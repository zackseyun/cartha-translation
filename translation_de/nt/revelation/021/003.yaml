id: REV.21.3
reference: Revelation 21:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: de
  text: 'Und ich hörte eine laute Stimme vom Thron her sagen: „Sieh: Gottes Wohnung[a] ist bei den Menschen[b]! Er wird bei ihnen wohnen[c], und sie werden seine Völker[d] sein. Gott selbst wird bei ihnen sein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „das Zelt Gottes“; σκηνή kann auch das heilige Zelt, die Stiftshütte, bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Menschen allgemein, nicht nur Männer.
    reason: lexical_clarification
  - marker: c
    text: 'Das griechische Verb gehört zur selben Wortfamilie wie „Zelt“; sinngemäß auch: „Er wird sein Zelt bei ihnen aufschlagen.“'
    reason: lexical_alternative
  - marker: d
    text: Im griechischen Text steht „Völker“ im Plural, nicht „Volk“ im Singular.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: eine laute Stimme
  rationale: In Verbindung mit φωνή bezeichnet μεγάλη idiomatisch Lautstärke oder Nachdruck. „Eine laute Stimme“ ist natürliches modernes Deutsch.
- source_word: ἐκ τοῦ θρόνου
  choice: vom Thron her
  rationale: Die Wendung gibt den Thron als Ausgangspunkt der Stimme wieder und bewahrt zugleich die Thronmotivik der Offenbarung.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: „Sieh“ erhält den feierlichen, Aufmerksamkeit fordernden Charakter des griechischen Präsentationssignals, ohne unnötig altertümlich zu klingen.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: Gottes Wohnung
  rationale: σκηνή bezeichnet wörtlich ein Zelt beziehungsweise das heilige Zelt, hier aber Gottes Wohnstätte. „Wohnung“ ist verständlich und lässt sich mit dem folgenden Verb „wohnen“ verbinden; das konkrete Zeltmotiv bleibt in der Fußnote erhalten.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: bei den Menschen
  rationale: ἄνθρωποι meint hier die Menschen allgemein. „Bei“ ist für die Aussage von Gottes bleibender Gegenwart im Deutschen natürlicher als ein mechanisches „mit“.
- source_word: σκηνώσει
  choice: er wird bei ihnen wohnen
  rationale: σκηνόω bedeutet wohnen oder sein Zelt aufschlagen und greift σκηνή auf. Die klare Haupttextfassung bewahrt den Wortklang „Wohnung/wohnen“; die konkretere Bildsprache wird in der Fußnote erläutert.
- source_word: λαοὶ αὐτοῦ
  choice: seine Völker
  rationale: Der Ausgangstext hat mit λαοί ausdrücklich den Plural. „Seine Völker“ bewahrt diese auffällige Form, statt sie der traditionellen Singularfassung anzugleichen.
- source_word: αὐτὸς ὁ θεός
  choice: Gott selbst
  rationale: „Selbst“ gibt die Hervorhebung durch αὐτός wieder und betont Gottes unmittelbare Gegenwart.
- source_word: μετ’ αὐτῶν ἔσται
  choice: wird bei ihnen sein
  rationale: Die schlichte Zukunftsformel wird in natürlichem Deutsch wiedergegeben und bewahrt die Aussage der göttlichen Gegenwart.
theological_decisions:
- issue: Plural λαοί gegenüber dem traditionellen Singular „Volk“
  choice: sie werden seine Völker sein
  alternative: sie werden sein Volk sein
  rationale: Der vorgelegte kritische griechische Text liest den Plural λαοί. Die Übersetzung bewahrt diese möglicherweise auf die vielen einbezogenen Völker weisende Form, ohne das Verhältnis zwischen ihrer Vielfalt und der Einheit der Erlösten näher festzulegen.
- issue: Zelt- und Heiligtumsmotiv in σκηνή und σκηνόω
  choice: Gottes Wohnung … er wird bei ihnen wohnen
  alternative: Gottes Zelt/Heiliges Zelt … er wird sein Zelt bei ihnen aufschlagen
  rationale: Der Haupttext soll unmittelbar verständlich bleiben. Durch „Wohnung/wohnen“ bleibt die sprachliche Verbindung beider griechischer Wörter sichtbar; die Fußnoten sichern zusätzlich das konkrete Zelt- und Heiligtumsmotiv.
- issue: Bedeutungsumfang von ἄνθρωποι
  choice: bei den Menschen
  alternative: bei den Männern
  rationale: Im Kontext bezeichnet der Plural Menschen allgemein und nicht ausschließlich männliche Personen. „Menschen“ gibt diesen Umfang ohne konfessionelle oder anthropologische Zusatzdeutung wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, feierliche Aussagesätze tragen den Verkündigungscharakter. „Sieh“ ist gehoben, aber weiterhin verständlich; „vom Thron her“ klingt natürlicher als „aus dem Thron“. Die Wiederholung „bei ihnen“ wurde beibehalten, weil sie die nachdrückliche Gegenwartsaussage des Ausgangstextes trägt.
