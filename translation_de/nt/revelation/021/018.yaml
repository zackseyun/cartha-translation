source:
  edition: SBLGNT
  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: de
  text: Und der Baustoff ihrer Mauer war Jaspis[a], und die Stadt war aus reinem Gold, wie reines Glas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Aufbau ihrer Mauer bestand aus Jaspis.“ Das griechische Wort kann den Baustoff oder den Aufbau bzw. das Bauwerk bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Reines Glas“ kann hier zugleich die außergewöhnliche Klarheit oder Durchsichtigkeit des Glases hervorheben.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐνδώμησις
  choice: Baustoff
  rationale: Das seltene Substantiv kann die Bauweise, den Aufbau oder das verbaute Material bezeichnen. Da Jaspis als Prädikatsnomen folgt und anschließend der Stoff der Stadt genannt wird, gibt „Baustoff“ den materiellen Sinn natürlich wieder, ohne die mögliche Bedeutung „Aufbau“ zu verschweigen.
- source_word: τεῖχος
  choice: Mauer
  rationale: Gemeint ist die Stadtmauer; im unmittelbaren Kontext ist „Mauer“ präzise und idiomatisch.
- source_word: ἴασπις
  choice: Jaspis
  rationale: Der traditionelle Edelsteinname gibt die griechische Bezeichnung wieder, auch wenn der antike Jaspis nicht zwingend genau dem heute so genannten Mineral entsprach.
- source_word: χρυσίον καθαρόν
  choice: reines Gold
  rationale: χρυσίον bezeichnet Gold als Material, und καθαρόν dessen Reinheit. „Aus reinem Gold“ klingt im Deutschen bei der Beschreibung der Stadt natürlich.
- source_word: ὅμοιον
  choice: gleich
  rationale: Das Wort führt einen Vergleich ein. „Gleich reinem Glas“ bewahrt den knappen, gehobenen Ton und vermeidet die mögliche Fehlauffassung, die Stadt bestehe zusätzlich aus Glas.
- source_word: ὕαλῳ καθαρῷ
  choice: reinem Glas
  rationale: ὕαλος bezeichnet Glas oder eine glasartige Substanz; καθαρός kann hier Reinheit sowie daraus folgende Klarheit oder Durchsichtigkeit ausdrücken. Die formnahe Wiedergabe bewahrt diese Bildspannung.
theological_decisions:
- issue: Beschaffenheit der endzeitlichen Stadt
  choice: Die visionäre Stoffbeschreibung wird ohne allegorische Ausdeutung wiedergegeben.
  alternative: Jaspis, Gold und Glas ausdrücklich symbolisch oder naturwissenschaftlich erklären.
  rationale: Der Vers beschreibt die Erscheinung der Stadt in Bildsprache, deutet deren einzelne Stoffe hier aber nicht aus. Die Übersetzung sollte diese Offenheit erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten. „Baustoff“ ist alltagssprachlich verständlich und im Kontext präziser als das abstraktere „Gefüge“; die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
