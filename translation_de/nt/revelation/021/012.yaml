id: REV.21.12
reference: Revelation 21:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: de
  text: 'Sie hatte eine große und hohe Mauer, zwölf Tore und an den Toren zwölf Engel. Auf den Toren waren Namen eingeschrieben: die Namen der zwölf Stämme der Söhne Israels.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „der zwölf Stämme der Kinder Israels“.'
    reason: Lexikalische Alternative für υἱῶν Ἰσραήλ.
lexical_decisions:
- source_word: ἔχουσα
  choice: Sie hatte
  rationale: Das feminine Partizip bezieht sich auf die Stadt aus dem vorherigen Vers. Im Deutschen führt ein finiter Satz die Beschreibung natürlicher fort als eine wörtliche Partizipialkonstruktion.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: eine große und hohe Mauer
  rationale: Beide Adjektive bleiben entsprechend dem griechischen Wortlaut erhalten; „hoch“ ist für eine Stadtmauer natürlich.
- source_word: πυλῶνας δώδεκα
  choice: zwölf Tore
  rationale: „Tore“ ist die übliche und kontextgerechte Bezeichnung für die Zugänge einer Stadt.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: an den Toren
  rationale: ἐπί mit Dativ ist hier lokal zu verstehen. „An den Toren“ ist idiomatisch und legt nicht nahe, die Engel befänden sich oben auf den Toren.
- source_word: ἀγγέλους δώδεκα
  choice: zwölf Engel
  rationale: Direkte und im Kontext eindeutige Wiedergabe.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: Namen eingraviert
  rationale: ἐπιγράφω bezeichnet das Aufschreiben oder Anbringen einer Aufschrift. Im monumentalen Zusammenhang vermittelt „eingraviert“ den Sinn prägnant, ohne die Träger der Namen ausdrücklich festzulegen.
- source_word: ἅ ἐστιν τῶν δώδεκα φυλῶν
  choice: die Namen der zwölf Stämme
  rationale: Das neutrale Relativpronomen bezieht sich auf „Namen“. Die Wiederholung von „Namen“ macht den im Griechischen knappen Identifikationssatz im Deutschen eindeutig und natürlich.
- source_word: υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  rationale: Bewahrt die ausdrückliche maskuline Verwandtschaftsbezeichnung υἱῶν und die feste biblische Formulierung, ohne sie zu „Volk Israel“ zu verallgemeinern.
theological_decisions:
- issue: Wiedergabe der kollektiven Bezeichnung υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  alternative: der Kinder Israels
  rationale: Der Haupttext wahrt das ausdrücklich verwendete υἱῶν („Söhne“). Die traditionelle, im Deutschen geläufigere kollektive Wiedergabe wird als Alternative in der Fußnote genannt.
- issue: Bezug der eingeschriebenen Namen
  choice: die Namen der zwölf Stämme
  alternative: die zu den zwölf Stämmen gehören
  rationale: Der griechische Genitiv bezeichnet die Namen als Namen der Stämme. Die gewählte Formulierung identifiziert sie klar, ohne darüber hinaus einzelne Stammväter oder andere Namensträger festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten griechischen Partizipien werden zu einem flüssigen deutschen Beschreibungssatz gestaltet. Der Doppelpunkt verdeutlicht die Identifikation der eingravierten Namen; die kurzen Satzglieder bewahren den feierlichen Aufzählungscharakter.
