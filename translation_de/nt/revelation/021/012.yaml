    issue: „eingraviert“ ist zu spezifisch.
    rationale: Das griechische ἐπιγεγραμμένα bezeichnet eingeschriebene bzw. angebrachte Namen, ohne die Herstellungsweise als Gravur festzulegen. „Eingeschrieben“ wahrt diese Offenheit.
  - severity: low
    issue: „Auf ihnen“ ist ein weniger klarer Bezug.
    rationale: Der Bezug auf die Tore ist aus dem Kontext erschließbar, wird mit „auf den Toren“ jedoch ohne Bedeutungsänderung klar und idiomatisch ausgedrückt.
