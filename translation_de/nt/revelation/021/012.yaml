  to: 'Sie hatte eine große und hohe Mauer, zwölf Tore und an den Toren zwölf Engel. Auf den Toren waren Namen eingeschrieben: die Namen der zwölf Stämme der Söhne Israels.[a]'
  rationale: 'Die Revision beschränkt sich auf zwei sichere Präzisierungen: „eingeschrieben“ gibt ἐπιγεγραμμένα ohne Festlegung auf eine Gravurtechnik wieder, und „auf den Toren“ macht den im Kontext liegenden Bezug ausdrücklich. Satzbau, Register und die Wiedergabe von υἱῶν Ἰσραήλ bleiben erhalten.'
