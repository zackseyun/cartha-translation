  verdict: revise
  source_fidelity: 'Die wesentlichen Elemente sind korrekt wiedergegeben: die Stadt hat eine große und hohe Mauer, zwölf Tore, zwölf Engel an den Toren und die Namen der zwölf Stämme der Söhne Israels. „Eingraviert“ ist jedoch enger als ἐπιγεγραμμένα, das allgemein „eingeschrieben/aufgeschrieben“ bedeutet und keine bestimmte Technik des Anbringens festlegt.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und die Auflösung des Partizips in einen finiten Satz ist angemessen. „Auf ihnen“ ist zwar verständlich, aber „auf den Toren“ ist klarer; außerdem vermeidet „eingeschrieben“ die unnötig konkrete Vorstellung einer Gravur.
  terminology: „Mauer“, „Tore“, „Engel“, „Stämme“ und „Söhne Israels“ sind terminologisch treffend. Die Fußnotenalternative „Kinder Israels“ gibt die traditionelle deutsche Formulierung sachgerecht wieder.
  issues:
