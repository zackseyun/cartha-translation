id: REV.21.27
reference: Revelation 21:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: de
  text: Und nichts Unreines wird jemals in sie hineinkommen[a], auch niemand, der Abscheuliches und Falsches tut[b], sondern nur die, die im Buch des Lebens des Lammes eingetragen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nichts Profanes“ oder „nichts Entweihtes“ (πᾶν κοινόν).'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „der Gräuel und Falschheit tut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: wird niemals hineinkommen
  rationale: Die Verbindung οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung aus; „wird niemals“ gibt den sicheren Ausschluss in natürlichem Deutsch wieder.
- source_word: αὐτὴν
  choice: in sie
  rationale: Das Pronomen bezieht sich auf die Stadt, das neue Jerusalem. Da „Stadt“ im Deutschen feminin ist, entspricht „sie“ dem natürlichen grammatischen Bezug.
- source_word: πᾶν κοινὸν
  choice: nichts Unreines
  rationale: 'Das substantivierte Neutrum mit πᾶν hat umfassenden Sinn: „nichts“. κοινός bezeichnet hier im jüdischen Reinheits- und Heiligkeitskontext etwas Unreines, Profanes oder Entweihtes.'
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: der Abscheuliches oder Falsches tut
  rationale: Das substantivierte Partizip bezeichnet eine handelnde Person. βδέλυγμα und ψεῦδος sind wörtlich mit „Gräuel/Abscheuliches“ und „Falschheit/Lüge“ verbunden; die deutsche Formulierung ist verständlich und bewahrt beide Handlungskategorien. „Oder“ formuliert die distributive Ausschlusswirkung natürlich, während die Fußnote den wörtlichen Anschluss mit „und“ festhält.
- source_word: εἰ μὴ
  choice: sondern nur
  rationale: εἰ μή führt hier die alleinige Ausnahme zum vorherigen Ausschluss ein; „sondern nur“ macht den Kontrast im Deutschen klar.
- source_word: οἱ γεγραμμένοι
  choice: die, die … eingetragen sind
  rationale: Das Perfekt Passiv bezeichnet den fortbestehenden Zustand des Eingetragenseins. „Eingetragen“ ist für ein Verzeichnis idiomatisch, ohne das im Griechischen nicht ausdrücklich genannte Wort „Namen“ einzufügen.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: im Buch des Lebens des Lammes
  rationale: 'Die Genitivfolge bleibt bewusst strukturell offen: Das Griechische kann natürlich als das dem Lamm zugehörige Buch des Lebens verstanden werden. Die Formulierung wahrt zugleich die etablierte Wendung „Buch des Lebens“ und den johanneischen Titel „das Lamm“.'
theological_decisions:
- issue: Umfang des Ausschlusses aus dem neuen Jerusalem
  choice: Der Vers schließt sowohl alles Unreine als auch Menschen aus, deren Handeln abscheulich oder falsch ist.
  alternative: Den ersten Ausdruck ausschließlich auf unpersönliche Verunreinigung beziehen und erst den zweiten auf Personen.
  rationale: Der griechische Text verbindet das substantivierte Neutrum πᾶν κοινόν mit dem substantivisch gebrauchten Partizip ποιῶν; die Übersetzung bewahrt beide Aspekte, ohne sie gleichzusetzen.
- issue: Gegenstand des Eingetragenseins
  choice: „die, die … eingetragen sind“ ohne Ergänzung von „Namen“
  alternative: „deren Namen … geschrieben stehen“
  rationale: Ein Buch oder Verzeichnis legt Namen nahe, doch das Wort „Namen“ steht in diesem Vers nicht ausdrücklich. Die Übersetzung vermeidet eine Ergänzung aus Parallelstellen.
- issue: Zuordnung des Buches des Lebens
  choice: „Buch des Lebens des Lammes“
  alternative: „Lebensbuch des Lammes“ oder „Buch des Lebens, das dem Lamm gehört“
  rationale: Die gewählte Form bewahrt die Genitivstruktur und die traditionelle Sachbezeichnung, ohne die Beziehung ausführlicher auszudeuten, als es der Ausgangstext tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hineinkommen“ ist gegenüber dem förmlicheren „eingehen“ für heutige Leser unmittelbar verständlich. „Abscheuliches oder Falsches“ wahrt das moralische Gewicht, während die Fußnote die ungewohnte wörtliche Konstruktion und die griechische Koordination dokumentiert.
