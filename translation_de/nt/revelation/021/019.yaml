id: REV.21.19
reference: Revelation 21:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: de
  text: 'Die Fundamente der Stadtmauer waren mit jeder Art von kostbarem Stein geschmückt: das erste Fundament mit Jaspis, das zweite mit Saphir, das dritte mit Chalzedon[a], das vierte mit Smaragd.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Chalzedon“ ist die traditionelle Wiedergabe des griechischen Begriffs; welche Steine mit manchen antiken Edelsteinbezeichnungen genau gemeint waren, ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: Fundamente
  rationale: Der Plural bezeichnet die Fundamente beziehungsweise Fundamentlagen der Stadtmauer; „Fundamente“ ist natürlich und hält sich eng an den griechischen Ausdruck.
- source_word: τείχους τῆς πόλεως
  choice: der Stadtmauer
  rationale: Die deutsche Zusammensetzung gibt die Genitivverbindung natürlich und präzise wieder.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: mit jeder Art von kostbarem Stein
  rationale: Die Formulierung gibt die mögliche distributive Bedeutung idiomatisch wieder, ohne den Sinn auf einzelne Exemplare zu beschränken.
- source_word: κεκοσμημένοι
  choice: waren ... geschmückt
  rationale: Das Prädikat bewahrt den passiven Sinn und den aus dem Perfektpartizip hervorgehenden vollendeten Zustand.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: das erste Fundament
  rationale: Die substantivische Wiedergabe entspricht dem Singular und vermeidet die interpretativ stärkere Ergänzung „Fundamentstein“.
- source_word: ἴασπις
  choice: Jaspis
  rationale: Übliche deutsche Bezeichnung des Edelsteins in Bibelübersetzung und Lexikografie.
- source_word: σάπφιρος
  choice: Saphir
  rationale: Die etablierte deutsche Entsprechung des griechischen Edelsteinnamens.
- source_word: χαλκηδών
  choice: Chalzedon
  rationale: Traditionelle deutsche Wiedergabe; die genaue Identität mancher antiker Edelsteine bleibt unsicher.
- source_word: σμάραγδος
  choice: Smaragd
  rationale: Etablierte und wahrscheinlichste deutsche Entsprechung.
theological_decisions:
- issue: Deutung der Edelsteine in der apokalyptischen Beschreibung
  choice: Die Edelsteinnamen werden ohne symbolische Auslegung wiedergegeben.
  alternative: Die Steine ausdrücklich auf Israels Stämme, die Apostel oder priesterliche Bildwelten beziehen.
  rationale: Der Vers nennt die Steine als Schmuck, deutet ihre Symbolik jedoch nicht aus. Die Übersetzung sollte keine nicht ausdrücklich genannte theologische Zuordnung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte elliptische Konstruktion „mit“ macht im Deutschen deutlich, dass die genannten Edelsteine die jeweiligen Fundamente schmücken, ohne die Steine und Fundamente gegen den griechischen Wortlaut ausdrücklich gleichzusetzen.
