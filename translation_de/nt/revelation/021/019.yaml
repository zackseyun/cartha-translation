  naturalness: „Die Fundamente der Stadtmauer“ und „mit jeder Art von kostbarem Stein geschmückt“ sind modernes, würdiges und gut verständliches Standarddeutsch. Die wiederholte elliptische Konstruktion mit „mit“ ist in einer feierlichen Aufzählung natürlich und verdeutlicht den Bezug der Edelsteine auf die jeweiligen Fundamente.
