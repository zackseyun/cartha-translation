  source_fidelity: 'Der Entwurf gibt die Satzglieder und den Sinn des griechischen Textes insgesamt zutreffend wieder: ein Engel aus der Siebenergruppe kommt, besitzt die sieben mit den letzten sieben Plagen gefüllten Schalen, spricht mit Johannes und kündigt an, ihm die Braut, die Frau des Lammes, zu zeigen. Die explizite Wiedergabe beider appositionellen Bezeichnungen ist angemessen.'
  naturalness: Die Formulierung „die sieben mit den sieben letzten Plagen gefüllten Schalen“ ist verständlich, aber durch die gehäufte Wiederholung von „sieben“ und die lange Attributgruppe schwerfällig. Eine Relativsatzauflösung ist im modernen Standarddeutsch klarer. Die direkte Anbindung der Rede mit Doppelpunkt statt „Er sagte“ ist zugleich natürlicher und näher an der griechischen Konstruktion.
  terminology: „Schalen“, „Plagen“, „Braut“ und „das Lamm“ sind treffend. Im ehelichen Kontext ist „die Frau des Lammes“ als Wiedergabe von γυνή möglich und bewahrt die absichtliche Doppelbezeichnung; „Ehefrau“ wäre zwar eindeutiger, aber stilistisch unnötig explizit.
  issues:
