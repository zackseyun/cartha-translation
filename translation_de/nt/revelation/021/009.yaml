    rationale: Die Wiederholung und Verschachtelung in „die sieben mit den sieben letzten Plagen gefüllten Schalen“ beeinträchtigt die Lesbarkeit. Ein Relativsatz macht eindeutig, dass die Schalen mit den Plagen gefüllt sind.
  - severity: low
    issue: Satztrennung vor der direkten Rede
    rationale: „und redete mit mir. Er sagte“ gibt den Sinn wieder, löst aber die enge griechische Verbindung ἐλάλησεν ... λέγων unnötig auf. Ein Doppelpunkt ist idiomatischer und bewahrt die Erzählverknüpfung.
