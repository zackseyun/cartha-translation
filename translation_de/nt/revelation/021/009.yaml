id: REV.21.9
reference: Revelation 21:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: de
  text: 'Dann kam einer der sieben Engel, die die sieben Schalen hatten, die mit den sieben letzten Plagen gefüllt waren, und redete mit mir: „Komm! Ich werde dir die Braut zeigen, die Frau des Lammes.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Dann
  rationale: Gibt den erzählerischen Fortgang im modernen Deutschen natürlich wieder, ohne die verbindende Funktion zu verlieren.
- source_word: ἦλθεν
  choice: kam
  rationale: Direkte und kontextgerechte Wiedergabe des Aorists von ἔρχομαι.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: einer von den sieben Engeln
  rationale: Idiomatiche deutsche Wiedergabe der partitiven Konstruktion.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: die die sieben … Schalen hatten
  rationale: Die Partizipialgruppe kennzeichnet die Engel durch die ihnen zugeordneten Schalen; „hatten“ ist hier natürlich und wahrt den Rückbezug auf die Engel.
- source_word: φιάλας
  choice: Schalen
  rationale: „Schalen“ entspricht Form und Funktion der φιάλαι besser als das traditionell mögliche, heute jedoch missverständliche „Phiolen“.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: mit den sieben letzten Plagen gefüllten
  rationale: Die attributive Form macht eindeutig, dass die Schalen gefüllt sind. „Letzten Plagen“ bewahrt sowohl den zeitlich-sequenziellen als auch den endzeitlichen Klang von ἐσχάτων.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: redete mit mir
  rationale: Bewahrt die mit μετά ausgedrückte Formulierung „mit mir“, statt sie zu „zu mir“ zu vereinfachen.
- source_word: λέγων
  choice: Er sagte
  rationale: Das griechische Partizip wird zur flüssigen deutschen Erzählung als eigener Satz wiedergegeben.
- source_word: Δεῦρο
  choice: Komm!
  rationale: Natürliche und knappe Wiedergabe der auffordernden Einladung.
- source_word: δείξω σοι
  choice: Ich werde dir … zeigen
  rationale: Gibt den Futur Indikativ unmittelbar wieder.
- source_word: τὴν νύμφην
  choice: die Braut
  rationale: Präzise und geläufige Wiedergabe von νύμφη.
- source_word: τὴν γυναῖκα τοῦ ἀρνίου
  choice: die Frau des Lammes
  rationale: Im ehelichen Kontext bezeichnet γυνή die Ehefrau. „Frau“ lässt zusammen mit „Braut“ die auffällige appositionelle Doppelbezeichnung bestehen; „Lamm“ bewahrt den christologischen Titel der Offenbarung.
theological_decisions:
- issue: Verhältnis von νύμφην und γυναῖκα
  choice: 'Beide Bezeichnungen ausdrücklich wiedergeben: „die Braut …, die Frau des Lammes“'
  alternative: „die Braut des Lammes“ oder „die Braut, die Gemahlin des Lammes“
  rationale: Der griechische Text setzt zwei eheliche Bezeichnungen appositionell nebeneinander. Ihre ausdrückliche Wiedergabe erhält das Bild und seine Spannung, ohne es zu einer einzigen Bezeichnung zu glätten.
- issue: ἀρνίον als christologischer Titel
  choice: „das Lamm“
  alternative: Eine erklärende Umschreibung wie „Christus, das Lamm“
  rationale: Die Offenbarung verwendet „das Lamm“ als Titel. Der Text wird ohne zusätzliche, im Vers nicht ausgesprochene Identifizierung wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verschachtelte griechische Nominalgruppe wurde so geordnet, dass eindeutig die Schalen mit den Plagen gefüllt sind. Die Wiederholung „Braut … Frau“ bleibt bewusst erhalten.
