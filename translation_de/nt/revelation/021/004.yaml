id: REV.21.4
reference: Revelation 21:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: de
  text: Und er wird jede Träne von ihren Augen abwischen, und der Tod wird nicht mehr sein; weder Trauer noch Geschrei[a] noch Schmerz wird es mehr geben. Das Frühere ist vergangen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aufschrei“. Das griechische Wort kann einen lauten Ruf oder Schrei bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die ersten Dinge sind vergangen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: wird … abwischen
  rationale: Bei Tränen bezeichnet ἐξαλείφω idiomatisch deren fürsorgliches Entfernen. „Abwischen“ ist im Deutschen natürlich und bewahrt das persönliche Bild.
- source_word: πᾶν δάκρυον
  choice: jede Träne
  rationale: Der Singular mit πᾶν ist distributiv und hebt jede einzelne Träne hervor.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: von ihren Augen
  rationale: Die Präpositionalfügung bezeichnet das Entfernen der Tränen von den Augen und wird so idiomatisch und quellennah wiedergegeben.
- source_word: ὁ θάνατος οὐκ ἔσται ἔτι
  choice: der Tod wird nicht mehr sein
  rationale: Die Formulierung erhält die kategorische und feierliche Aussage des Griechischen, dass der Tod vollständig aufhört.
- source_word: πένθος
  choice: Trauer
  rationale: Das Wort bezeichnet Trauer beziehungsweise Klage angesichts von Verlust und passt natürlich in die Reihe menschlichen Leids.
- source_word: κραυγή
  choice: Klage
  rationale: κραυγή kann einen lauten Ruf oder Aufschrei bezeichnen. Im Trostzusammenhang gibt „Klage“ den leidvollen Ruf natürlich wieder; die weitere mögliche Nuance wird in einer Fußnote bewahrt.
- source_word: πόνος
  choice: Schmerz
  rationale: Im Zusammenhang der endgültig beseitigten Leiden ist „Schmerz“ die klarste und natürlichste Entsprechung.
- source_word: τὰ πρῶτα
  choice: das Frühere
  rationale: Der substantivierte neutrale Plural verweist auf die bisherige Ordnung beziehungsweise die früheren Zustände. „Das Frühere“ wahrt die Offenheit, ohne zusätzliche Deutung einzutragen.
- source_word: ἀπῆλθαν
  choice: ist vergangen
  rationale: Der Aorist bezeichnet das vollzogene Fortgehen. Das deutsche Perfekt klingt in dieser feierlichen Feststellung natürlich und stellt das Ergebnis heraus.
theological_decisions:
- issue: Das Subjekt von ἐξαλείψει ist in diesem Vers nicht ausdrücklich genannt, sondern ergibt sich aus Offenbarung 21,3.
  choice: „er wird … abwischen“
  alternative: „Gott wird … abwischen“
  rationale: Das Pronomen bewahrt die Textgestalt des Verses und fügt den aus dem unmittelbaren Kontext eindeutig erschließbaren Namen Gottes nicht eigens ein.
- issue: Umfang des Endes von Tod und Leid in der neuen Schöpfung
  choice: 'Absolute Formulierungen: „der Tod wird nicht mehr sein“ und „wird es mehr geben“'
  alternative: Abschwächende Formulierungen, die nur eine Verringerung nahelegen
  rationale: Die griechischen Aussagen bezeichnen eine vollständige Beendigung und enthalten keine Einschränkung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Ton. Die Parallelstruktur der griechischen Aufzählung bleibt erhalten. Keine Fußnote zu „jede Träne“, da die deutsche Formulierung die distributive Bedeutung unmittelbar und natürlich wiedergibt.
