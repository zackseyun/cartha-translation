id: REV.21.14
reference: Revelation 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: de
  text: Und die Mauer der Stadt hatte zwölf Fundamente[a], und auf ihnen standen die zwölf Namen der zwölf Apostel des Lammes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zwölf Fundamentsteine«. Das griechische Wort kann in einem baulichen Zusammenhang Fundamente oder einzelne Fundamentsteine bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: Mauer
  rationale: Das Wort bezeichnet hier die Stadt- beziehungsweise Befestigungsmauer; »Mauer« ist im Deutschen natürlich und präzise.
- source_word: πόλεως
  choice: der Stadt
  rationale: Der Genitiv bezeichnet die Zugehörigkeit der Mauer zur Stadt und wird direkt wiedergegeben.
- source_word: ἔχων
  choice: hatte
  rationale: Das griechische Partizip Präsens wird im erzählenden Zusammenhang idiomatisch als finites Verb wiedergegeben. Die Form richtet sich nach dem grammatisch sächlichen »τεῖχος«, während »Mauer« im Deutschen weiblich ist.
- source_word: θεμελίους δώδεκα
  choice: zwölf Fundamente
  rationale: θεμέλιος kann sowohl ein Fundament als auch einen Fundamentstein bezeichnen. »Fundamente« ist die direkte Wiedergabe; die konkrete Alternative wird in der Fußnote bewahrt.
- source_word: ἐπ’ αὐτῶν
  choice: auf ihnen
  rationale: ἐπί mit Genitiv bezeichnet hier die Lage auf den Fundamenten; das Pronomen hält die Formulierung knapp und folgt der griechischen Struktur.
- source_word: δώδεκα ὀνόματα
  choice: die zwölf Namen
  rationale: Der Text nennt ausdrücklich Namen, ohne einen Vorgang des Einschreibens oder eine Inschrift näher zu bezeichnen.
- source_word: ἀποστόλων
  choice: Apostel
  rationale: »Apostel« ist für die etablierte neutestamentliche Bezeichnung sachlich und sprachlich angemessen.
- source_word: τοῦ ἀρνίου
  choice: des Lammes
  rationale: »Das Lamm« bewahrt den in der Offenbarung zentralen christologischen Titel; der Genitiv wird direkt wiedergegeben.
theological_decisions:
- issue: Christologischer Titel ἀρνίον
  choice: des Lammes
  alternative: des Lamms
  rationale: Die Großschreibung kennzeichnet »Lamm« als Titel Jesu, wie es der Sprachgebrauch der Offenbarung nahelegt. Die starke Genitivform »Lammes« entspricht dem würdevollen biblischen Register, ohne eine zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am griechischen Ausgangstext; »standen« macht im Deutschen idiomatisch deutlich, dass sich die Namen auf den Fundamenten befanden, ohne ausdrücklich eine Inschrift hinzuzufügen.
