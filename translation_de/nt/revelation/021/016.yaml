id: REV.21.16
reference: Revelation 21:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: de
  text: 'Und die Stadt ist quadratisch angelegt: Ihre Länge entspricht ihrer Breite. Er maß die Stadt mit dem Messstab[a] auf zwölftausend Stadien[b]. Ihre Länge, ihre Breite und ihre Höhe sind gleich[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann wörtlich „Rohr“ oder „Reet“ bedeuten; hier bezeichnet es ein Messgerät.
    reason: lexical_alternative
  - marker: b
    text: Ein Stadion war ein antikes Längenmaß. Zwölftausend Stadien entsprechen, je nach zugrunde gelegter Länge eines Stadions, ungefähr 2.220 Kilometern.
    reason: cultural_note
  - marker: c
    text: Sinngemäß ergibt sich daraus eine würfelförmige Stadt. Der griechische Text sagt unmittelbar, dass Länge, Breite und Höhe gleich sind.
    reason: alternative_reading
lexical_decisions:
- source_word: τετράγωνος κεῖται
  choice: ist quadratisch angelegt
  rationale: τετράγωνος bezeichnet eine vierseitige beziehungsweise quadratische Form; κεῖται beschreibt, wie die Stadt daliegt oder angeordnet ist. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den architektonischen Bildgehalt.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: Ihre Länge entspricht ihrer Breite
  rationale: ὅσον bezeichnet hier die Gleichheit der Ausdehnung. „Entspricht“ gibt dies knapp und idiomatisch wieder, ohne mehr als die Gleichheit beider Maße zu behaupten.
- source_word: ἐμέτρησεν
  choice: Er maß
  rationale: Der Aorist führt die Erzählung schlicht fort; das Subjekt ist aus dem Zusammenhang der messende Engel.
- source_word: τῷ καλάμῳ
  choice: mit dem Messstab
  rationale: κάλαμος kann wörtlich einen Rohrstab bezeichnen, dient hier aber als Messgerät. „Messstab“ macht die Funktion verständlich, ohne den Gegenstand unnötig auszudeuten.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: zwölftausend Stadien
  rationale: Die Präpositionalphrase nennt das Messergebnis. Die antike Einheit bleibt im Haupttext erhalten; ἐπί wird in der idiomatischen deutschen Angabe des Ergebnisses nicht eigens wiedergegeben.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: Ihre Länge, ihre Breite und ihre Höhe sind gleich
  rationale: Die Übersetzung gibt die ausdrücklich genannte Gleichheit aller drei Dimensionen wieder und ersetzt sie nicht durch die interpretierende geometrische Bezeichnung „Würfel“.
theological_decisions:
- issue: Antike Maßeinheit oder moderne Umrechnung im Haupttext
  choice: „zwölftausend Stadien“ bleibt im Haupttext stehen
  alternative: etwa 2.220 Kilometer
  rationale: Der griechische Text nennt eine antike Maßeinheit. Eine moderne Umrechnung ist wegen unterschiedlicher Ansätze für die Länge eines Stadions nur annähernd und gehört daher in eine Fußnote.
- issue: Geometrische Gestalt der Stadt
  choice: Die Gleichheit von Länge, Breite und Höhe wird ausdrücklich beibehalten
  alternative: „Die Stadt ist ein vollkommener Würfel“
  rationale: Eine würfelförmige Gestalt ist die naheliegende Folgerung, doch der griechische Text verwendet nicht das Wort „Würfel“, sondern nennt die drei gleichen Dimensionen. Diese Spannung zwischen Beschreibung und Folgerung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer architektonischer Sprache. Die Wiederholung der Possessivform in der Schlussaussage bewahrt die feierliche Dreigliedrigkeit des griechischen Textes; die erste Aussage wird durch einen Doppelpunkt natürlich mit der Erläuterung verbunden.
