id: REV.21.15
reference: Revelation 21:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: de
  text: Und der, der mit mir sprach, hatte einen goldenen Messstab[a], um die Stadt, ihre Tore und ihre Mauer zu messen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen goldenen Messstab (wörtlich: Rohr)«. Das griechische Wort κάλαμος bedeutet wörtlich »Rohr« und kann einen zum Messen verwendeten Stab bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: der, der mit mir redete
  rationale: Die substantivierte Präsenspartizipialform bezeichnet die mit Johannes redende Person. Die Wiedergabe bleibt natürlich und fügt die im weiteren Kontext erkennbare Bezeichnung »Engel« nicht in den Vers ein.
- source_word: εἶχεν
  choice: hatte
  rationale: Das Imperfekt von ἔχω wird in seinem schlichten Sinn wiedergegeben; »hielt« würde die Art des Besitzens stärker festlegen als der griechische Wortlaut.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: einen goldenen Messstab
  rationale: κάλαμος bedeutet wörtlich »Rohr«, bezeichnet hier zusammen mit μέτρον jedoch ein Messgerät. »Messstab« vermittelt dessen Funktion im heutigen Deutsch klar; die wörtlichere Bildgebung wird in der Fußnote bewahrt.
- source_word: ἵνα μετρήσῃ
  choice: um … zu messen
  rationale: Die deutsche Infinitivkonstruktion gibt den von ἵνα mit Konjunktiv ausgedrückten Zweck natürlich und eindeutig wieder.
- source_word: τὴν πόλιν
  choice: die Stadt
  rationale: Direkte und kontextgerechte Wiedergabe, ohne den Namen Jerusalem in den Vers einzufügen.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: ihre Tore
  rationale: πυλών bezeichnet ein Tor beziehungsweise einen Torbau; »Tore« ist hier die natürliche architektonische Bezeichnung.
- source_word: τὸ τεῖχος αὐτῆς
  choice: ihre Mauer
  rationale: τεῖχος bezeichnet die Stadtmauer; im Kontext ist »Mauer« eindeutig und idiomatisch.
theological_decisions:
- issue: Ob die redende Person ausdrücklich als Engel bezeichnet werden soll
  choice: Die Person wird nur als »der, der mit mir redete« bezeichnet.
  alternative: »Der Engel, der mit mir redete«
  rationale: Obwohl der weitere Zusammenhang die Person als einen der Engel erkennen lässt, steht das Wort »Engel« in diesem Vers nicht. Die Übersetzung bewahrt daher die Formulierung des griechischen Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Messstab« ist für heutige Leser verständlicher als »Messrohr«, während die Fußnote die konkrete griechische Bildsprache dokumentiert. Die Reihung »die Stadt, ihre Tore und ihre Mauer« ist im Deutschen flüssig und bewahrt alle drei Messobjekte.
