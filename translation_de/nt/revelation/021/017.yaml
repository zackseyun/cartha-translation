source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: de
  text: 'Und er maß ihre Mauer: 144 Ellen nach menschlichem Maß – das heißt: nach dem Maß eines Engels.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem Maß eines Menschen, das heißt: eines Engels.“ Das Griechische kann entweder betonen, dass der Engel eine menschliche Maßeinheit verwendete, oder dass menschliches und engelhaftes Maß hier übereinstimmen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: maß
  rationale: Der Aorist von μετρέω bezeichnet schlicht den vollzogenen Messvorgang; „maß“ ist präzise und idiomatisch.
- source_word: τὸ τεῖχος αὐτῆς
  choice: ihre Mauer
  rationale: τεῖχος bezeichnet die Stadt- beziehungsweise Schutzmauer. Das feminine Pronomen „ihre“ bezieht sich im Deutschen natürlich auf die zuvor genannte Stadt.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 Ellen
  rationale: Die antike Maßeinheit bleibt erhalten, weil keine bestimmte moderne Umrechnung im Text vorausgesetzt wird. Ziffern erleichtern die Erfassung der symbolisch auffälligen Zahl.
- source_word: μέτρον ἀνθρώπου
  choice: nach menschlichem Maß
  rationale: Die knappe griechische Apposition bezeichnet einen menschlichen Maßstab beziehungsweise eine menschliche Messweise. „Menschlich“ gibt ἀνθρώπου hier allgemein und nicht unnötig männlich wieder.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: das auch das eines Engels ist
  rationale: Das Relativpronomen bezieht sich am natürlichsten auf „Maß“. Das ergänzte „das“ macht die griechische Ellipse auf Deutsch verständlich; „auch“ bringt die im Kontext naheliegende Entsprechung zum Ausdruck, ohne sie weiter auszudeuten.
theological_decisions:
- issue: Deutung von μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου
  choice: Das menschliche Maß entspricht hier zugleich dem Maß eines Engels.
  alternative: Gemessen wurde nach dem Maß eines Menschen, nämlich eines Engels; der Engel wird dabei als der messende „Mensch“ bezeichnet.
  rationale: Die griechische Formulierung ist verdichtet und lässt offen, ob vor allem die Übereinstimmung menschlichen und engelhaften Messens oder die Identifizierung des Messenden betont wird. Der Haupttext gibt die naheliegende Entsprechung wieder, während die Fußnote die alternative syntaktische Auffassung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antike Einheit „Elle“ und die knappe Bildsprache bleiben erhalten; die schwer auflösbare Beziehung zwischen menschlichem und engelhaftem Maß wird nicht konfessionell oder spekulativ ausgedeutet.
