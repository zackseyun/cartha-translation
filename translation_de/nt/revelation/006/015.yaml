id: REV.6.15
reference: Revelation 6:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: de
  text: Und die Könige der Erde, die Großen[a], die Heerführer, die Reichen, die Mächtigen und alle Sklaven und Freien[b] versteckten sich in den Höhlen und zwischen den Felsen der Berge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Vornehmen« beziehungsweise »die einflussreichen Männer«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »jeder Sklave und Freie«; die griechischen maskulinen Singularformen stehen hier repräsentativ für alle Menschen dieser beiden gesellschaftlichen Gruppen.'
    reason: gender_and_number_clarification
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: die Könige der Erde
  rationale: γῆ kann »Erde« oder »Land« bedeuten; im Zusammenhang des weltumspannenden Gerichts in der Offenbarung passt »Erde« am besten.
- source_word: μεγιστᾶνες
  choice: die Großen
  rationale: Die substantivische Bezeichnung meint hochgestellte und einflussreiche Personen. »Die Großen« bewahrt die knappe, rangbezogene Ausdrucksweise, ohne sie auf Erbadel zu verengen.
- source_word: χιλίαρχοι
  choice: die Heerführer
  rationale: Der Ausdruck bezeichnet ursprünglich Befehlshaber über tausend Mann und hier militärische Führungspersonen; »Heerführer« ist verständlich und lässt den militärischen Bezug erkennen.
- source_word: πλούσιοι
  choice: die Reichen
  rationale: Die substantivierte Bezeichnung wird knapp und idiomatisch wiedergegeben.
- source_word: ἰσχυροὶ
  choice: die Mächtigen
  rationale: ἰσχυρός kann körperliche Stärke oder Macht bezeichnen. In der Aufzählung gesellschaftlich einflussreicher Gruppen ist »die Mächtigen« natürlich, ohne die Bedeutung auf ein bestimmtes Machtgebiet festzulegen.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: alle Sklaven und Freien
  rationale: Der Gegensatz zu den Freien macht bei δοῦλος den rechtlich und gesellschaftlich unfreien Status deutlich. Der griechische Singular hat repräsentative, umfassende Kraft; der deutsche Plural gibt dies natürlich und geschlechterübergreifend wieder.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: versteckten sich
  rationale: Natürliche deutsche Wiedergabe der reflexiven Handlung.
- source_word: εἰς τὰ σπήλαια
  choice: in den Höhlen
  rationale: Nach »sich verstecken« bezeichnet εἰς idiomatisch den erreichten Ort; »in den Höhlen« ist im Deutschen natürlicher als eine mechanische Richtungsangabe.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: zwischen den Felsen der Berge
  rationale: Gemeint sind felsige Formationen oder Klüfte im Gebirge, die als Versteck dienen. »Zwischen den Felsen« gibt dieses Bild idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gegensatzpaar Sklave/Freier
  choice: Sklaven
  alternative: Diener
  rationale: Der ausdrückliche Gegensatz zu ἐλεύθερος hebt den unfreien gesellschaftlichen und rechtlichen Status hervor; daher ist »Sklaven« präziser als »Diener«.
- issue: Repräsentative Geschlechtsaussage bei πᾶς δοῦλος καὶ ἐλεύθερος
  choice: alle Sklaven und Freien
  alternative: jeder Sklave und Freie
  rationale: Die maskulinen Singularformen bilden ein festes gesellschaftliches Gegensatzpaar mit umfassender, repräsentativer Bedeutung. Der deutsche Plural macht diese Reichweite natürlich deutlich, ohne eine Beschränkung auf Männer einzutragen.
- issue: Bedeutungsnuance von ἰσχυροί
  choice: die Mächtigen
  alternative: die Starken
  rationale: Beide Bedeutungen sind möglich. Im Umfeld von Herrschern, hochgestellten Personen, Heerführern und Reichen hebt »die Mächtigen« eher die gesellschaftliche Wirkmacht hervor, ohne körperliche Stärke ausdrücklich auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Artikel des Griechischen werden in einer natürlichen deutschen Aufzählung teilweise zusammengezogen. Die soziale Rangfolge und der umfassende Abschluss mit Sklaven und Freien bleiben erhalten.
