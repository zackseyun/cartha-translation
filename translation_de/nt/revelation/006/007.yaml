  source_fidelity: 'Der deutsche Text gibt alle Bestandteile des griechischen Satzes zutreffend wieder: das Öffnen des vierten Siegels, die Stimme des vierten Lebewesens und den unbestimmten Imperativ »Komm!«. Die Auslassung eines gesonderten »Und« für Καί ist im deutschen Erzählstil idiomatisch und ohne Bedeutungsverlust.'
  naturalness: '»Als er das vierte Siegel öffnete, hörte ich die Stimme des vierten Lebewesens sagen: »Komm!«« ist klares, modernes und zugleich dem Kontext angemessen würdevolles Standarddeutsch. Die Konstruktion »hörte … sagen« ist besonders natürlich.'
  terminology: »Siegel« und »Lebewesen« sind sachgerecht. »Lebewesen« bewahrt sinnvoll die in der Offenbarung wichtige Unterscheidung von ζῷον gegenüber θηρίον. Der Imperativ »Komm!« bleibt lexikalisch nah am Griechischen und legt den Adressaten nicht fest.
