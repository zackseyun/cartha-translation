id: REV.6.7
reference: Revelation 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: de
  text: 'Als er das vierte Siegel öffnete, hörte ich die Stimme des vierten Lebewesens sagen: »Komm!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Komm!« Möglicherweise ist sinngemäß gemeint: »Zieh hinaus!« Es ist umstritten, ob die Aufforderung an Johannes oder an den Reiter gerichtet ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: öffnete
  rationale: Die übliche und natürliche Wiedergabe von ἀνοίγω in der wiederkehrenden Szene, in der die Siegel der Schriftrolle geöffnet werden.
- source_word: σφραγῖδα
  choice: Siegel
  rationale: Der etablierte und präzise deutsche Begriff für die Verschlüsse der Schriftrolle in Offenbarung 6.
- source_word: τετάρτην / τετάρτου
  choice: vierte / vierten
  rationale: Beide Vorkommen sind eindeutige Ordnungszahlen und werden im Deutschen übereinstimmend wiedergegeben.
- source_word: φωνὴν
  choice: die Stimme
  rationale: Der bestimmte Artikel ist im Deutschen natürlich, weil die folgende Genitivverbindung die Stimme eindeutig als die des vierten Lebewesens bestimmt.
- source_word: ζῴου
  choice: Lebewesens
  rationale: ζῷον bezeichnet hier eines der Wesen am Thron und nicht ein gewöhnliches Tier; »Lebewesen« wahrt zudem die Unterscheidung zu θηρίον, dem »Tier« der späteren Visionen.
- source_word: λέγοντος
  choice: sagen
  rationale: Die Infinitivkonstruktion »hörte … sagen« gibt das griechische Partizip in natürlichem modernem Deutsch wieder.
- source_word: Ἔρχου
  choice: Komm!
  rationale: Der Imperativ bedeutet unmittelbar »Komm«. Eine Wiedergabe wie »Zieh hinaus« würde den nicht ausdrücklich genannten Adressaten interpretierend festlegen.
theological_decisions:
- issue: Adressat des Imperativs Ἔρχου
  choice: »Komm!« ohne Angabe des Adressaten
  alternative: Der Ruf kann als an Johannes oder an den Reiter gerichtet verstanden werden; bei Bezug auf den Reiter wäre sinngemäß auch »Zieh hinaus!« möglich.
  rationale: Der griechische Text nennt den Adressaten nicht. Die knappe Aufforderung bewahrt diese erzählerische und theologische Mehrdeutigkeit.
translation_notes:
  register: 'Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der Satzbau ist gegenüber einer streng formalen Wiedergabe leicht geglättet: Das einleitende καί wird nicht eigens mit »und« wiedergegeben, da »Als er …« im Deutschen den fortlaufenden Erzählanschluss natürlich ausdrückt. »Lebewesen« entspricht der etablierten apokalyptischen Bezeichnung und vermeidet eine Verwechslung mit θηρίον.'
