id: REV.6.16
reference: Revelation 6:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: de
  text: 'und sie sagen zu den Bergen und den Felsen: »Fallt auf uns und verbergt uns vor dem Angesicht[a] dessen, der auf dem Thron sitzt, und vor dem Zorn des Lammes«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor der Gegenwart dessen, der auf dem Thron sitzt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: sie sagen
  rationale: Das historische Präsens bewahrt die unmittelbare, anschauliche Wirkung der apokalyptischen Erzählung.
- source_word: ὄρεσιν
  choice: den Bergen
  rationale: ὄρος bezeichnet hier am natürlichsten Berge und erhält die Größe des Bildes.
- source_word: πέτραις
  choice: den Felsen
  rationale: πέτρα meint Fels beziehungsweise Felsmassiv; »Felsen« ist präzise und im Deutschen natürlich.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Fallt auf uns
  rationale: Der Aoristimperativ wird als dringender, direkter Befehl wiedergegeben; ἐπί mit Akkusativ bezeichnet hier die Bewegung auf die Menschen herab.
- source_word: κρύψατε ἡμᾶς
  choice: verbergt uns
  rationale: Die Formulierung gibt den Imperativ klar wieder und passt idiomatisch zum Schutz vor dem Blick beziehungsweise der Gegenwart der Genannten.
- source_word: ἀπὸ προσώπου
  choice: vor dem Angesicht
  rationale: Die konkrete Bildsprache von πρόσωπον bleibt erhalten; zugleich ist »vor« im Deutschen die natürliche Verbindung bei Verbergen und Furcht.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: dessen, der auf dem Thron sitzt
  rationale: Das substantivierte Partizip wird in natürlichem Deutsch wiedergegeben und bewahrt den fortdauernden Zustand des Thronens.
- source_word: ὀργῆς
  choice: Zorn
  rationale: »Zorn« trägt im Deutschen die ernste, gerichtliche Bedeutung von ὀργή, ohne unnötig altertümlich zu wirken.
- source_word: τοῦ ἀρνίου
  choice: des Lammes
  rationale: »Das Lamm« ist der etablierte christologische Titel der Offenbarung und bewahrt die Spannung zwischen Opfergestalt und richterlicher Autorität.
theological_decisions:
- issue: Die beiden Träger beziehungsweise Bezugspunkte des endzeitlichen Gerichts
  choice: Sowohl den auf dem Thron Sitzenden als auch das Lamm ausdrücklich und koordiniert nennen.
  alternative: Die Aussage zu einem allgemeinen Gottesbezug zusammenziehen oder den »Zorn des Lammes« abschwächen.
  rationale: Der griechische Text verbindet zwei mit ἀπό koordinierte Ausdrücke. Die Übersetzung wahrt daher die Unterscheidung und zugleich die theologische Spannung, dass gerade das Lamm Zorn ausübt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens und die direkte Rede erhalten die dramatische Unmittelbarkeit. »Angesicht« ist bewusst bildkräftiger und gehobener als »Gesicht«, bleibt aber allgemein verständlich; die sinngemäße Alternative »Gegenwart« steht in der Fußnote.
