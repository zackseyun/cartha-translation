id: REV.6.12
reference: Revelation 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: de
  text: 'Und ich sah, als er das sechste Siegel öffnete: Da ereignete sich ein großes Erdbeben, und die Sonne wurde schwarz wie ein Tuch aus Haar[a], und der ganze Mond wurde wie Blut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein grobes Sacktuch aus Haar“. Gemeint ist ein rauer Stoff aus Haar, der traditionell mit Trauer verbunden war.'
    reason: σάκκος τρίχινος bezeichnet einen groben, aus Haar gefertigten Sack- beziehungsweise Trauerstoff; die Fußnote bietet eine nähere lexikalische Alternative und erläutert den kulturellen Bezug, ohne den Ausdruck auf ein bestimmtes Kleidungsstück festzulegen.
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: Der Aorist von ὁράω bezeichnet hier die Wahrnehmung innerhalb der Vision; „ich sah“ ist im Deutschen die natürliche und etablierte Wiedergabe.
- source_word: ὅτε ἤνοιξεν
  choice: als er … öffnete
  rationale: ὅτε leitet den Zeitpunkt eines einmaligen vergangenen Geschehens ein; daher ist „als“ im Deutschen idiomatischer als „wenn“. ἀνοίγω wird im Zusammenhang der Siegel sachgerecht mit „öffnen“ wiedergegeben.
- source_word: τὴν σφραγῖδα τὴν ἕκτην
  choice: das sechste Siegel
  rationale: Direkte, im Deutschen natürliche Wiedergabe des Substantivs mit Ordinalzahl.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: da entstand ein großes Erdbeben
  rationale: σεισμός bezeichnet hier am naheliegendsten ein Erdbeben. „entstand“ bewahrt den Ereignischarakter von ἐγένετο, während „da“ die Abfolge anschaulich und natürlich markiert.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: die Sonne wurde schwarz
  rationale: μέλας bedeutet spezifisch „schwarz“; „wurde“ bildet den Zustandswechsel von ἐγένετο knapp und genau ab.
- source_word: ὡς σάκκος τρίχινος
  choice: wie ein Gewand aus Haarstoff
  rationale: σάκκος bezeichnet groben Sack- bzw. Trauerstoff, nicht zwingend einen Sack als Behälter; τρίχινος kennzeichnet ihn als aus Haar gefertigt. „Gewand aus Haarstoff“ vermittelt das Bild in verständlichem Deutsch, ohne eine bestimmte Tierart hinzuzufügen.
- source_word: ἡ σελήνη ὅλη
  choice: der ganze Mond
  rationale: ὅλη wird ausdrücklich mit „ganze“ wiedergegeben und bewahrt so die Betonung der vollständigen Erscheinung des Mondes.
- source_word: ἐγένετο ὡς αἷμα
  choice: wurde wie Blut
  rationale: „wurde“ gibt ἐγένετο wieder; „wie“ bewahrt den durch ὡς markierten Vergleich und behauptet keine stoffliche Verwandlung.
theological_decisions:
- issue: Art der kosmischen Zeichen
  choice: Die visionären Bilder werden unmittelbar wiedergegeben, ohne sie als ausschließlich buchstäbliche oder ausschließlich symbolische Vorgänge zu deuten.
  alternative: Die Erscheinungen ausdrücklich als reale astronomische Katastrophe oder als Sinnbild geschichtlicher und politischer Umwälzungen auslegen.
  rationale: Der griechische Text schildert die Vorgänge mit apokalyptischen Vergleichen, entscheidet aber die weitergehende Deutungsfrage nicht. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Satzfolge bleibt nahe am Griechischen, wird aber durch Doppelpunkt und „Da“ natürlich gegliedert. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Wendung.
