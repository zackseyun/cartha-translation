revisions:
- from: Und ein anderes Pferd kam heraus, feuerrot.[a] Dem, der auf ihm saß, wurde gegeben, den Frieden von der Erde[b] zu nehmen, sodass die Menschen einander abschlachten würden;[c] und ihm wurde ein großes Schwert gegeben.
  to: Und ein anderes, feuerrotes Pferd kam heraus[a]. Dem, der auf ihm saß, wurde gegeben, den Frieden von der Erde[b] zu nehmen, sodass sie einander abschlachten würden[c]; und ihm wurde ein großes Schwert gegeben.
  rationale: Die Überarbeitung entfernt nur die nicht ausdrücklich im griechischen Text enthaltene Benennung „die Menschen“, verbessert die deutsche Wortstellung und setzt sämtliche Fußnotenanker direkt an die erläuterten Ausdrücke. Die Ambiguität der pluralischen Bezugsgruppe sowie das wiederholte göttliche Passiv bleiben erhalten.
