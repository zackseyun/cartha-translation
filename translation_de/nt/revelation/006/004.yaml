  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: de
  text: Und ein anderes, feuerrotes Pferd kam heraus[a]. Dem, der auf ihm saß, wurde gegeben, den Frieden von der Erde[b] zu nehmen, sodass sie einander abschlachten würden[c]; und ihm wurde ein großes Schwert gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „rot“. Das griechische Wort bezeichnet genauer ein feuerähnliches Rot.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vom Land“. Das griechische Wort kann sowohl „Erde“ als auch „Land“ bedeuten; der umfassende Horizont der Vision spricht hier für „Erde“.'
    reason: lexical_alternative
  - marker: c
    text: Das mit „abschlachten“ übersetzte Verb ist stärker als ein allgemeines Wort für „töten“ und bezeichnet gewaltsames Blutvergießen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἵππος πυρρός
  choice: ein anderes Pferd … feuerrot
  rationale: ἄλλος kennzeichnet in der Abfolge ein weiteres, vom ersten unterschiedenes Pferd. πυρρός bezeichnet ein feuerähnliches Rot; „feuerrot“ bewahrt diese anschauliche Färbung.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: dem, der auf ihm saß
  rationale: Die partizipiale Formulierung wird beibehalten, statt sie deutender mit „dem Reiter“ wiederzugeben.
- source_word: ἐδόθη αὐτῷ
  choice: ihm wurde gegeben
  rationale: Die Passivform bleibt erhalten und benennt den Geber nicht. So wird auch die stilistische Wiederholung des griechischen Textes gewahrt.
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: den Frieden von der Erde zu nehmen
  rationale: Die Wendung gibt λαβεῖν … ἐκ direkt und verständlich wieder. „Erde“ wahrt hier den möglichen weltweiten Horizont der Vision.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: sodass die Menschen einander abschlachten würden
  rationale: Das im Griechischen unausgesprochene Subjekt wird im Deutschen mit „die Menschen“ natürlich verdeutlicht. σφάζω bezeichnet gewaltsames Töten und ist stärker als ein allgemeines „töten“.
- source_word: μάχαιρα μεγάλη
  choice: ein großes Schwert
  rationale: μάχαιρα kann Schwert, Kurzschwert oder großes Messer bezeichnen. „Schwert“ ist im apokalyptischen Bild klar und idiomatisch; μεγάλη wird mit „groß“ wiedergegeben.
theological_decisions:
- issue: Passivische Formulierung in den beiden ἐδόθη-Sätzen
  choice: Das Passiv „wurde gegeben“ bleibt stehen, ohne den Geber zu nennen.
  alternative: „Gott gab ihm“ oder „ihm wurde Vollmacht gegeben“
  rationale: Der Text lässt den Handelnden unausgesprochen und sagt nicht ausdrücklich „Vollmacht“. Die Übersetzung bewahrt dadurch sowohl Gottes implizite Souveränität als auch die sprachliche und theologische Spannung.
- issue: Zweck oder Folge bei ἵνα
  choice: „sodass“ als folgeorientierte Wiedergabe
  alternative: „damit“ als stärker zweckorientierte Wiedergabe
  rationale: ἵνα kann hier Zweck oder Folge ausdrücken. Im Zusammenhang folgt das gegenseitige Abschlachten unmittelbar auf die Wegnahme des Friedens; „sodass“ ist natürlich, ohne eine eigenständige Deutung des letztlichen Urhebers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und das wiederholte Passiv orientieren sich am feierlich-apokalyptischen Stil des Ausgangstextes, während „sodass die Menschen“ einen im Deutschen verständlichen Satzbau schafft.
