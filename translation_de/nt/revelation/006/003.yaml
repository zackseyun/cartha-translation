  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: de
  text: 'Und als er das zweite Siegel öffnete, hörte ich das zweite lebendige Wesen sagen: »Komm!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geh!« Manche verstehen den Befehl als an den Reiter gerichtet und nicht als Aufforderung, hervorzukommen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der übliche Satzanschluss bewahrt den fortlaufenden Erzählfluss.
- source_word: ὅτε
  choice: als
  rationale: Die temporale Konjunktion bezeichnet hier ein einmaliges Ereignis in der Erzählung; »als« ist im Deutschen natürlich und genau.
- source_word: ἤνοιξεν
  choice: er öffnete
  rationale: ἀνοίγω bedeutet »öffnen«; die Übersetzung vermeidet das interpretierende »brechen«.
- source_word: σφραγῖδα τὴν δευτέραν
  choice: das zweite Siegel
  rationale: Natürliche deutsche Wiedergabe der Artikel-Substantiv-Adjektiv-Fügung.
- source_word: ἤκουσα
  choice: hörte ich
  rationale: Schlichte narrative Wiedergabe des Aorists von ἀκούω.
- source_word: τοῦ δευτέρου ζῴου
  choice: das zweite Lebewesen
  rationale: ζῷον bezeichnet in der Offenbarung die lebendigen Wesen am Thron und nicht ein gewöhnliches Tier; »Lebewesen« ist klar und würdevoll.
- source_word: λέγοντος
  choice: sagen
  rationale: Die Konstruktion »hörte ... sagen« gibt das abhängige Partizip idiomatisch und knapp wieder.
- source_word: Ἔρχου
  choice: Komm!
  rationale: Der Imperativ von ἔρχομαι bedeutet unmittelbar »Komm!«; die kontextuell erwogene Wiedergabe »Geh!« wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von Ἔρχου beim Öffnen des zweiten Siegels
  choice: Komm!
  alternative: Geh!
  rationale: »Komm!« entspricht der unmittelbaren lexikalischen Bedeutung. Da unklar bleibt, an wen der Ruf gerichtet ist, wird die kontextuelle Alternative in einer Fußnote bewahrt, ohne die Auslegung im Haupttext festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. Die Wortstellung »hörte ich ... sagen« ist idiomatisch; »Lebewesen« vermeidet die irreführende Vorstellung eines gewöhnlichen Tieres.
