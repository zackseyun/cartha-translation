  verdict: revise
  source_fidelity: 'Der Satz gibt die griechische Abfolge und Syntax zuverlässig wieder: das Öffnen des zweiten Siegels, das Hören des zweiten Thronwesens und dessen Imperativ sind erhalten. Für ζῷον ist jedoch „lebendiges Wesen“ die im Offenbarungskontext deutlichere und etabliertere Wiedergabe als das kompaktere „Lebewesen“; sie macht besser kenntlich, dass nicht ein gewöhnliches Tier gemeint ist.'
  naturalness: Die Satzstellung „hörte ich ... sagen“ sowie „als“ für das einmalige vergangene Ereignis sind natürliches modernes Standarddeutsch. Der Imperativ „Komm!“ ist idiomatisch. Auch die Fußnote ist verständlich; „hervorzukommen“ ist dort präziser als „heranzukommen“, da die Richtung im Text nicht näher festgelegt wird.
  terminology: „Siegel“ und „Komm!“ entsprechen dem griechischen Wortlaut. „das zweite lebendige Wesen“ wahrt die besondere Terminologie für die Wesen am Thron besser und vermeidet sowohl die gewöhnliche Tierassoziation als auch eine zu biologische Lesart von „Lebewesen“. Die Fußnote bewahrt die kontextabhängige Alternative „Geh!“ ohne den Adressaten dogmatisch festzulegen.
  issues:
  - severity: low
    issue: „Lebewesen“ ist für ζῷον im Offenbarungskontext weniger präzise als „lebendiges Wesen“.
    rationale: Die Formulierung „lebendiges Wesen“ ist im deutschen Bibelgebrauch für die Thronwesen geläufig und bildet die Bedeutung von ζῷον transparenter ab, ohne die Wesen als gewöhnliche Tiere zu deuten.
  - severity: low
    issue: Die Fußnotenformulierung „Aufforderung, heranzukommen“ legt unnötig eine räumliche Perspektive nahe.
    rationale: Das griechische ἔρχου selbst spezifiziert keinen solchen Bezugspunkt. „Aufforderung, hervorzukommen“ erläutert die alternative Deutung neutraler.
  revised_text: 'Und als er das zweite Siegel öffnete, hörte ich das zweite lebendige Wesen sagen: »Komm!«[a]'
  revised_footnotes:
  - marker: a
    text: 'Oder: »Geh!« Manche verstehen den Befehl als an den Reiter gerichtet und nicht als Aufforderung, hervorzukommen.'
    reason: alternative_reading
  revision_rationale: Die Revision beschränkt sich auf eine kontextuell etabliertere Wiedergabe von ζῷον und eine neutralere Formulierung der Fußnote. Wortlaut, Erzählfolge und die Auslegungsambiguität von ἔρχου bleiben erhalten.
