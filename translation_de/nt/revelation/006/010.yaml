  source_fidelity: Die Übersetzung gibt den lauten Klageruf, die Anrede δεσπότης sowie die Bitte um Gericht und Vergeltung grundsätzlich treffend wieder. „Wartest du damit“ legt jedoch ein bloßes Abwarten stärker fest, als die griechische verneinte Präsensfrage tut; „zögerst du noch“ bildet den vorwurfsvollen Klageruf unmittelbarer ab.
  naturalness: „Wie lange noch, heiliger und wahrhaftiger Gebieter“ und „zögerst du noch, Gericht zu halten“ sind modernes, würdiges und idiomatisches Standarddeutsch. Die Wiederaufnahme von „noch“ bei „zögerst du noch“ ist im Deutschen für den anhaltenden Aufschub besonders natürlich.
  terminology: „Gebieter“ wahrt sinnvoll die Unterscheidung von δεσπότης gegenüber κύριος. „Heilig und wahrhaftig“ sowie „Gericht halten“ und „unser Blut ... rächen“ geben die maßgeblichen Begriffe ohne konfessionelle Einengung wieder. Die Fußnote zur Präposition sollte keine einseitige Erklärung als alternative Lesart ausgeben, sondern die mögliche Nuance knapp und sachlich kennzeichnen.
