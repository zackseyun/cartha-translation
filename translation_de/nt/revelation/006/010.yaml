id: REV.6.10
reference: Revelation 6:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: de
  text: 'Und sie riefen mit lauter Stimme: „Wie lange noch, heiliger und wahrhaftiger Gebieter[a], zögerst du noch, Gericht zu halten und unser Blut an denen zu rächen, die auf der Erde wohnen[b]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herrscher“. Das griechische Wort despótēs bezeichnet einen Gebieter mit uneingeschränkter Autorität und unterscheidet sich von kýrios („Herr“).'
    reason: lexical_alternative
  - marker: b
    text: Die Präposition kann auch mit „von denen, die auf der Erde wohnen“ wiedergegeben werden. Die Hauptfassung versteht die Wendung als die Personen, an denen die Vergeltung vollzogen wird.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: sie riefen mit lauter Stimme
  rationale: Die Verbindung bezeichnet einen lauten, eindringlichen Ruf. Die konkrete Wendung bewahrt das Bild des griechischen Textes und klingt im Deutschen natürlich.
- source_word: Ἕως πότε
  choice: Wie lange noch
  rationale: Die übliche deutsche Form eines Klagerufs über ausbleibendes Handeln; „noch“ bringt die im Kontext vorausgesetzte Verzögerung idiomatisch zum Ausdruck.
- source_word: δεσπότης
  choice: Gebieter
  rationale: Das Wort betont uneingeschränkte Verfügungsgewalt und ist von κύριος („Herr“) zu unterscheiden. „Gebieter“ wahrt diese Nuance, ohne einen zusätzlichen Titel einzuführen.
- source_word: ὁ ἅγιος καὶ ἀληθινός
  choice: du heiliger und wahrhaftiger
  rationale: Die Anrede wird im Deutschen durch „du“ klar gefasst. „Wahrhaftig“ kann hier sowohl Echtheit als auch Verlässlichkeit bezeichnen und bewahrt damit die Bedeutungsbreite von ἀληθινός.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: wartest du damit, Gericht zu halten und … zu rächen
  rationale: Die formal präsentische, verneinte Frage beklagt verzögertes Handeln. Diese idiomatische deutsche Wiedergabe erhält den Sinn der Frage, ohne Gericht oder Vergeltung abzuschwächen.
- source_word: τὸ αἷμα ἡμῶν
  choice: unser Blut
  rationale: Die wörtliche Wiedergabe bewahrt die biblische Redeweise für gewaltsamen Tod.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: an denen, die auf der Erde wohnen
  rationale: Bei ἐκδικεῖν kann ἐκ die Personen bezeichnen, an denen Vergeltung vollzogen wird. Die Formulierung bewahrt zugleich die in der Offenbarung wiederkehrende Bezeichnung der Erdbewohner.
theological_decisions:
- issue: Göttliche Anrede δεσπότης
  choice: Gebieter
  alternative: Herrscher; souveräner Herr; Herr
  rationale: „Gebieter“ erhält den Akzent absoluter Autorität und unterscheidet den Titel von κύριος, ohne eine konfessionelle Deutung einzutragen.
- issue: Bitte der Märtyrer um Gerechtigkeit
  choice: Gericht zu halten und unser Blut … zu rächen
  alternative: zu richten und unser Blut zu vergelten; unser Blut zu Recht zu bringen
  rationale: Der Text verbindet ausdrücklich Gericht mit Vergeltung für vergossenes Blut. Die kräftige Sprache bleibt erhalten und wird nicht zu bloßer Rehabilitation abgeschwächt.
- issue: Bezug der Präposition ἐκ
  choice: unser Blut an denen zu rächen
  alternative: unser Blut von denen einzufordern
  rationale: Die Hauptfassung versteht die Erdbewohner als Ziel der vergeltenden Handlung. Da ἐκ formal auch eine Herkunfts- oder Ausgangsbeziehung ausdrücken kann, wird die alternative Nuance in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Klageruf bleibt eindringlich; „Gebieter“ ist bewusst stärker und seltener als „Herr“. Die wiederkehrende Wendung „die auf der Erde wohnen“ wird nicht zu „Erdbewohner“ verdichtet, damit das johanneische Sprachbild sichtbar bleibt.
