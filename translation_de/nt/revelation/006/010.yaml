    rationale: Die griechische Form fragt vorwurfsvoll nach dem Ausbleiben von Gericht und Vergeltung. Zwar ist Verzögerung kontextuell enthalten, doch „warten“ beschreibt einen bestimmten inneren Vorgang. „Zögerst du noch“ erhält die idiomatische deutsche Wiedergabe des Aufschubs, ohne diese zusätzliche Festlegung.
