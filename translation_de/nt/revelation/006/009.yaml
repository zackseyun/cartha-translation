revisions:
- from: Und als er das fünfte Siegel öffnete, sah ich unter dem Altar die Seelen derer, die wegen des Wortes Gottes und wegen des Zeugnisses, an dem sie festgehalten hatten, geschlachtet worden waren.[a]
  to: Und als er das fünfte Siegel öffnete, sah ich unter dem Altar die Seelen derer, die wegen des Wortes Gottes und wegen des Zeugnisses, das sie hatten, geschlachtet worden waren.[a]
  rationale: Die Revision ersetzt allein die interpretierende Erweiterung „an dem sie festgehalten hatten“ durch die dem griechischen Relativsatz entsprechende Formulierung „das sie hatten“. Dadurch bleibt offen, ob der Akzent auf dem Besitz, dem Bewahren oder dem Bekennen des Zeugnisses liegt. Die kräftige Wiedergabe „geschlachtet worden waren“ und die Fußnote bleiben bestehen.
