id: REV.6.9
reference: Revelation 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: de
  text: Und als er das fünfte Siegel öffnete, sah ich unter dem Altar die Seelen derer, die wegen des Wortes Gottes und wegen des Zeugnisses, das sie hatten, geschlachtet worden waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „getötet worden waren“. Das griechische Verb bezeichnet ein gewaltsames Schlachten und kann hier im Zusammenhang mit dem Altar auch einen Opferanklang haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: öffnete
  rationale: Die übliche und natürliche Wiedergabe von ἀνοίγω in der wiederkehrenden Siegelöffnungsszene.
- source_word: τὴν πέμπτην σφραγῖδα
  choice: das fünfte Siegel
  rationale: Bewahrt die feste apokalyptische Bildsprache präzise und idiomatisch.
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: unter dem Altar
  rationale: Gibt die räumliche Aussage schlicht wieder und lässt den himmlischen beziehungsweise kultischen Bezug unausgedeutet.
- source_word: τὰς ψυχὰς
  choice: die Seelen
  rationale: Bewahrt die besondere visionäre Darstellung der Getöteten, ohne sie anthropologisch weiter auszudeuten.
- source_word: τῶν ἐσφαγμένων
  choice: derer, die … geschlachtet worden waren
  rationale: „Geschlachtet“ erhält die starke Gewalt- und mögliche Opferkonnotation von σφάζω, die durch das Altarbild verstärkt wird.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: wegen des Wortes Gottes
  rationale: διά mit Akkusativ bezeichnet hier den Grund; „wegen“ ist präzise, knapp und natürlich.
- source_word: διὰ τὴν μαρτυρίαν ἣν εἶχον
  choice: wegen des Zeugnisses, an dem sie festgehalten hatten
  rationale: „Zeugnis“ wahrt den juridisch-bekenntnishaften Sinn von μαρτυρία. Die Wendung „an dem sie festgehalten hatten“ gibt εἶχον im Zusammenhang idiomatisch wieder, ohne den Inhalt des Zeugnisses zu ergänzen.
theological_decisions:
- issue: Bedeutung von ψυχὰς in der Vision
  choice: „Seelen“ im Haupttext
  alternative: „Leben“ oder „Personen“
  rationale: „Seelen“ erhält die visionäre Eigenart der Szene, ohne daraus eine umfassende Lehre über den menschlichen Zustand nach dem Tod abzuleiten.
- issue: Stärke und Opferanklang von ἐσφαγμένων
  choice: „geschlachtet worden waren“
  alternative: „getötet worden waren“ oder „erschlagen worden waren“
  rationale: Die gewählte Formulierung bewahrt die drastische und möglicherweise kultisch-opferbezogene Färbung des Verbs im Zusammenhang mit dem Altar.
- issue: Deutung von μαρτυρίαν ἣν εἶχον
  choice: „das Zeugnis, an dem sie festgehalten hatten“
  alternative: „das Zeugnis, das sie hatten“ oder „das Zeugnis, das sie abgelegt hatten“
  rationale: Die Formulierung ist im Deutschen natürlich und lässt offen, ob stärker der Besitz, das Bewahren oder das Bekennen des Zeugnisses gemeint ist; „abgelegt hatten“ würde eine im griechischen Wortlaut nicht ausdrücklich bezeichnete Handlung festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der visionären Erzählbewegung des griechischen Textes. „Geschlachtet“ ist bewusst kräftig gewählt; „an dem sie festgehalten hatten“ vermeidet die im Deutschen schwerfällige wörtliche Form „das sie hatten“, ohne das Zeugnis als Handlung näher festzulegen.
