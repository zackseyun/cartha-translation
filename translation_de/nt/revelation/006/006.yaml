id: REV.6.6
reference: Revelation 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: de
  text: 'Und ich hörte mitten unter den vier Lebewesen etwas wie eine Stimme, die sagte: »Ein Liter Weizen[a] für einen Denar[b] und drei Liter Gerste für einen Denar! Doch dem Öl und dem Wein füge keinen Schaden zu[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: eine Choinix Weizen. Eine Choinix war ein Trockenmaß von ungefähr einem Liter und entsprach etwa der täglichen Getreideration eines Menschen.'
    reason: cultural_note
  - marker: b
    text: Ein Denar entsprach gewöhnlich ungefähr dem Tageslohn eines Arbeiters. Die genannten Preise weisen daher auf schwere Knappheit hin.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Beschädige das Öl und den Wein nicht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: etwas wie eine Stimme
  rationale: Die Formulierung bewahrt den Vergleichs- bzw. Wahrnehmungscharakter von ὡς, ohne die Stimme eindeutig zu identifizieren.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: mitten unter den vier Lebewesen
  rationale: ἐν μέσῳ bezeichnet die Lage in ihrer Mitte bzw. unter ihnen; „Lebewesen“ unterscheidet die Thronwesen von den feindlichen Tieren in späteren Visionen.
- source_word: Χοῖνιξ
  choice: ein Liter
  rationale: Die Choinix war ein Trockenmaß von ungefähr einem Liter. Die verständliche moderne Annäherung steht im Haupttext; die historische Genauigkeit und die Bedeutung als Tagesration werden in der Fußnote erläutert.
- source_word: σίτου
  choice: Weizen
  rationale: Im Kontrast zu κριθῶν bezeichnet σίτου hier Weizen.
- source_word: δηναρίου
  choice: für einen Denar
  rationale: Der Genitiv gibt den Preis an. Der historische Münzname bleibt erhalten, während seine wirtschaftliche Bedeutung in der Fußnote erklärt wird.
- source_word: τρεῖς χοίνικες κριθῶν
  choice: drei Liter Gerste
  rationale: Das Maß wird entsprechend der ersten Nennung wiedergegeben; κριθή bezeichnet Gerste.
- source_word: μὴ ἀδικήσῃς
  choice: füge keinen Schaden zu
  rationale: ἀδικέω kann hier „schädigen“, „beschädigen“ oder „Schaden zufügen“ bedeuten. Die gewählte Formulierung ist natürlich und lässt den genauen Umfang des Verbots offen.
- source_word: τὸ ἔλαιον καὶ τὸν οἶνον
  choice: dem Öl und dem Wein
  rationale: Die beiden Erzeugnisse werden schlicht und traditionsnah wiedergegeben; ἔλαιον meint im antiken Kontext gewöhnlich Olivenöl.
theological_decisions:
- issue: Bezeichnung der ζῷα in der Thronsaalvision
  choice: Lebewesen
  alternative: Tiere; Bestien
  rationale: „Lebewesen“ entspricht ihrer Rolle als erhabene Wesen am Thron und vermeidet eine Verwechslung mit den späteren feindlichen „Tieren“ der Offenbarung.
- issue: Wiedergabe von antikem Maß und Münze
  choice: Das Volumen annähernd modernisieren, den Denar als historische Münze beibehalten
  alternative: Beide Begriffe transliterieren oder beide in moderne Größen umrechnen
  rationale: „Liter“ macht die knappe Getreidemenge unmittelbar verständlich. Eine Umrechnung des Denars in heutige Währung wäre wegen wechselnder Werte irreführend; seine Bedeutung als ungefährer Tageslohn wird deshalb in einer Fußnote erklärt.
- issue: Bedeutung des Verbots bezüglich Öl und Wein
  choice: Das Verbot ohne weitergehende Deutung übersetzen
  alternative: Es ausdrücklich als Schutz von Luxusgütern oder als Begrenzung des Gerichts deuten
  rationale: Der griechische Text nennt keine Begründung. Die Übersetzung bewahrt diese theologische und bildhafte Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Preisansage behält ihren ausrufartigen Charakter; „etwas wie eine Stimme“ wahrt die Unsicherheit der Wahrnehmung. Die Fußnoten stehen jeweils bei dem Ausdruck, den sie erläutern.
