id: REV.6.8
reference: Revelation 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: de
  text: 'Und ich sah: Siehe, ein blassgrünes Pferd.[a] Der, der darauf saß, hieß Tod, und der Hades folgte ihm. Ihnen wurde Vollmacht über ein Viertel der Erde gegeben, mit dem Schwert, mit Hungersnot, mit Seuche[b] und durch die wilden Tiere der Erde zu töten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein fahles Pferd“. Das griechische Wort bezeichnet wörtlich einen grünlichen oder blassgrünen Farbton, der hier an eine kränkliche, leichenhafte Blässe denken lässt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Tod“. In alttestamentlichen Gerichtsreihen kann „Tod“ eine tödliche Seuche bezeichnen; siehe besonders Ezechiel 14.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: blassgrün
  rationale: Das Wort bezeichnet ein grünliches beziehungsweise blassgrünes Aussehen und kann hier eine kränkliche, leichenhafte Färbung andeuten. „Blassgrün“ bewahrt sowohl den Farbsinn als auch die unheilvolle Wirkung.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: der darauf saß
  rationale: Die partizipiale Wendung wird quellennah und zugleich idiomatisch wiedergegeben, ohne sie auf das etwas freiere „Reiter“ zu verkürzen.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: hieß Tod
  rationale: Die griechische Namensformel wird in natürlichem Deutsch ausgedrückt; „Tod“ bleibt als Name der personifizierten Gestalt erkennbar.
- source_word: ᾅδης
  choice: der Hades
  rationale: „Hades“ wahrt den eigenen griechischen Begriff für das Totenreich und vermeidet die theologisch missverständliche Gleichsetzung mit der endgültigen Hölle.
- source_word: ἠκολούθει μετ’ αὐτοῦ
  choice: folgte ihm
  rationale: Im Deutschen ist „folgte ihm“ die natürliche Wiedergabe der Verbindung aus „folgen“ und μετά; ein zusätzliches „mit“ wäre schwerfällig.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: ihnen wurde Macht gegeben
  rationale: Die passive Form bewahrt den für die Offenbarung typischen Gedanken verliehener beziehungsweise zugelassener Vollmacht. „Macht“ ist hier im Deutschen natürlich und umfasst den delegierten Handlungsbereich.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: über ein Viertel der Erde
  rationale: Die Wendung bezeichnet den Umfang ihres Machtbereichs; „Erde“ entspricht dem kosmisch-globalen Horizont der Szene besser als „Land“.
- source_word: ἐν ῥομφαίᾳ
  choice: mit dem Schwert
  rationale: „Schwert“ gibt das Tötungsinstrument direkt wieder; der bestimmte Artikel ist in der deutschen Aufzählung idiomatisch.
- source_word: ἐν λιμῷ
  choice: mit Hunger
  rationale: In biblischen Gerichtsreihen bezeichnet λιμός Hungersnot beziehungsweise tödlichen Hunger. „Hunger“ ist knapp, geläufig und erhält die Parallelstruktur.
- source_word: ἐν θανάτῳ
  choice: mit Seuche
  rationale: Im Hintergrund alttestamentlicher Gerichtslisten, besonders Ezechiel 14, kann θάνατος idiomatisch eine tödliche Seuche bezeichnen. Die wörtliche Alternative wird in einer Fußnote erhalten.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: durch die wilden Tiere der Erde
  rationale: Die Präposition bezeichnet hier die handelnde Ursache. „Wilde Tiere“ gibt θηρία im Kontext verständlich und sachgerecht wieder.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: der Hades
  alternative: das Totenreich; die Unterwelt; die Hölle
  rationale: Der Text unterscheidet den personifizierten Tod vom ihm folgenden Hades. Die Transliteration hält diese Unterscheidung offen und vermeidet, den Begriff mit dem endgültigen Strafgericht gleichzusetzen.
- issue: Deutung von ἐν θανάτῳ innerhalb der Gerichtsreihe
  choice: mit Seuche
  alternative: mit Tod
  rationale: Die Formulierung greift wahrscheinlich eine alttestamentliche Gerichtsreihe auf, in der „Tod“ idiomatisch für Pest beziehungsweise Seuche stehen kann. „Seuche“ macht den Sinn der Liste verständlich; die formale Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulichem Erzählrhythmus. Der einleitende Ausruf „Da war“ gibt ἰδού natürlich wieder. Fachlich beziehungsweise theologisch belastete Begriffe werden nicht konfessionell aufgelöst; notwendige Alternativen stehen in den Fußnoten.
