  naturalness: 'Die Sprache ist überwiegend natürliches modernes Standarddeutsch. „Und ich sah: Siehe“ ist als knappe, würdige Wiedergabe von καὶ εἶδον, καὶ ἰδού idiomatischer und näher am Ausrufcharakter als „Da war“. Die Umstellung bei „Vollmacht über ein Viertel der Erde“ macht den Bezugsbereich klarer.'
