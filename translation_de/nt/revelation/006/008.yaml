revisions:
- from: 'Und ich sah: Da war ein blassgrünes Pferd.[a] Der darauf saß, hieß Tod, und der Hades folgte ihm. Ihnen wurde Macht über ein Viertel der Erde gegeben, zu töten mit dem Schwert, mit Hunger, mit Seuche[b] und durch die wilden Tiere der Erde.'
  to: 'Und ich sah: Siehe, ein blassgrünes Pferd.[a] Der, der darauf saß, hieß Tod, und der Hades folgte ihm. Ihnen wurde Vollmacht über ein Viertel der Erde gegeben, mit dem Schwert, mit Hungersnot, mit Seuche[b] und durch die wilden Tiere der Erde zu töten.'
  rationale: 'Die Revision verbessert drei sichere Punkte der deutschen Wiedergabe, ohne den Sinn zu verändern: χλωρός bleibt als „blassgrün“ erhalten; λιμός wird präzise als „Hungersnot“ wiedergegeben; und ἐξουσία wird als verliehene „Vollmacht“ ausgedrückt. „Siehe“ erhält die Funktion von ἰδού. Die kontextuell mögliche Wiedergabe von ἐν θανάτῳ als „Seuche“ bleibt wegen der Fußnote transparent; die wörtliche Lesart wird nicht unterschlagen.'
