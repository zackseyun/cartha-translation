id: REV.6.11
reference: Revelation 6:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: de
  text: Und jedem von ihnen wurde ein weißes Gewand gegeben, und ihnen wurde gesagt, sie sollten noch eine kurze Zeit ruhen, bis auch ihre Mitsklaven und ihre Brüder[b], die ebenso wie sie noch getötet werden sollten, vollendet wären[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „bis auch ihre Mitsklaven und ihre Brüder erfüllt beziehungsweise vollendet wären“. Gemeint sein kann, dass ihre volle Zahl erreicht wird; das Wort „Zahl“ steht jedoch nicht ausdrücklich im griechischen Text.'
    reason: alternative_reading
  - marker: b
    text: „Brüder“ kann hier die Glaubensgemeinschaft insgesamt und damit auch Frauen einschließen; im Griechischen steht die maskuline Pluralform.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: ein weißes Gewand
  rationale: στολή bezeichnet ein langes Gewand oder eine Robe. „Gewand“ ist im Deutschen natürlich, würdevoll und für die Bildsprache der Offenbarung geeignet.
- source_word: ἑκάστῳ
  choice: jedem von ihnen
  rationale: Der distributive Dativ wird idiomatisch wiedergegeben und macht deutlich, dass jede einzelne Person ein Gewand erhält.
- source_word: ἐρρέθη αὐτοῖς
  choice: ihnen wurde gesagt
  rationale: Die Passivform bleibt erhalten; zugleich klingt die Formulierung in modernem Deutsch natürlich.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: sie sollten noch eine kurze Zeit ruhen
  rationale: „Ruhen“ bewahrt die Grundbedeutung von ἀναπαύω; „noch eine kurze Zeit“ gibt die zeitliche Aussage von ἔτι χρόνον μικρόν wieder.
- source_word: πληρωθῶσιν
  choice: zur Vollendung gelangt wären
  rationale: Die Formulierung wahrt die offene Bedeutung des passiven πληρόω, ohne das im Griechischen nicht ausdrücklich genannte Wort „Zahl“ in den Haupttext einzufügen.
- source_word: σύνδουλοι
  choice: Mitsklaven
  rationale: σύνδουλοι bezeichnet Menschen, die demselben Herrn als Sklaven gehören. „Mitsklaven“ erhält dieses Verhältnis deutlicher als „Mitknechte“ oder „Mitdiener“.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die maskuline Pluralform wird formal genau wiedergegeben; eine mögliche umfassendere Bezugnahme auf die Glaubensgemeinschaft wird in einer Fußnote erläutert.
- source_word: οἱ μέλλοντες ἀποκτέννεσθαι
  choice: die ... getötet werden sollten
  rationale: Die Wendung gibt das bevorstehende beziehungsweise erwartete Geschehen wieder, ohne mit „dazu bestimmt“ eine stärkere deterministische Aussage einzutragen.
- source_word: ὡς καὶ αὐτοί
  choice: ebenso wie sie
  rationale: Die knappe Vergleichsformulierung verweist natürlich auf die zuvor getöteten Seelen zurück.
theological_decisions:
- issue: Bedeutung von πληρωθῶσιν in Bezug auf die Mitsklaven und Brüder
  choice: zur Vollendung gelangt wären
  alternative: vollzählig wären / ihre volle Zahl erreicht hätten
  rationale: Der Kontext kann eine vollständige Zahl der noch zu Tötenden nahelegen, doch das griechische Wort „Zahl“ steht nicht im Text. Die allgemeinere Wiedergabe erhält diese Spannung.
- issue: Möglicher gemischtgeschlechtlicher Bezug von ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern / Glaubensgeschwister
  rationale: Der Haupttext wahrt die grammatisch maskuline Form. Die Fußnote weist darauf hin, dass der Ausdruck im frühchristlichen Sprachgebrauch die Glaubensgemeinschaft einschließlich Frauen bezeichnen kann.
- issue: Wiedergabe der Herr-Sklave-Bildsprache in σύνδουλοι
  choice: Mitsklaven
  alternative: Mitknechte / Mitdiener
  rationale: Die Zugehörigkeit zu demselben Herrn ist Bestandteil der Bildsprache. „Mitsklaven“ erhält diese soziale und theologische Schärfe, ohne sie abzuschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Der harte Ausdruck „Mitsklaven“ ist bewusst quellennah gewählt. Die offene Formulierung „zur Vollendung gelangt“ vermeidet eine vorschnelle Festlegung auf eine ausschließlich zahlenmäßige Deutung.
