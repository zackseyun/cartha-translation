  rationale: Die Revision ersetzt die aktive, stärker individualisierende Wendung „zur Vollendung gelangt wären“ durch „vollendet wären“. Damit bleibt die passive und hinsichtlich der genauen Art der Vervollständigung offene Formulierung von πληρωθῶσιν erhalten. „Noch“ verdeutlicht bei „getötet werden sollten“ den prospektiven Bezug von μέλλοντες, ohne eine deterministische Nuance einzutragen. Die Fußnotenanker und ihre Inhalte bleiben strukturell korrekt und sachlich angemessen.
