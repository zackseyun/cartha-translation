id: REV.6.1
reference: Revelation 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: de
  text: 'Und ich sah, als das Lamm eines der sieben Siegel öffnete, und ich hörte eines der vier Lebewesen mit einer Stimme wie Donner sagen: »Komm!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zieh aus!«, wenn die Aufforderung an den Reiter und nicht an Johannes gerichtet verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: das Lamm
  rationale: Obwohl die Form ursprünglich eine Verkleinerung ausdrücken kann, dient sie in der Offenbarung als christologischer Titel. »Das Lamm« ist im Deutschen die klare und etablierte Wiedergabe.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: eines der sieben Siegel
  rationale: Die partitive Wendung wird idiomatisch wiedergegeben und bezeichnet ein einzelnes Siegel aus der Gruppe von sieben.
- source_word: ζῴων
  choice: Lebewesen
  rationale: Gemeint sind die Wesen im himmlischen Thronsaal, nicht gewöhnliche Tiere. »Lebewesen« wahrt diese Bedeutung, ohne eine zoologische Vorstellung aufzudrängen.
- source_word: ὡς φωνῇ βροντῆς
  choice: mit einer Stimme wie Donner
  rationale: Die natürliche deutsche Formulierung bewahrt den ausdrücklichen Vergleich der Stimme mit Donner.
- source_word: Ἔρχου
  choice: Komm!
  rationale: Der Imperativ bedeutet unmittelbar »Komm!«. Da der griechische Text den Angesprochenen nicht ausdrücklich nennt, bleibt die Aufforderung im Haupttext offen; die kontextbezogene Alternative wird in der Fußnote genannt.
- source_word: ὅτε
  choice: als
  rationale: »Als« gibt den einmaligen Zeitpunkt innerhalb der erzählten Vision im modernen Deutschen natürlich wieder.
- source_word: εἶδον
  choice: ich sah
  rationale: Direkte Wiedergabe des narrativen Aorists ohne einen im Griechischen nicht vorhandenen Zusatz wie »ich blickte hin«.
- source_word: ἤκουσα
  choice: ich hörte
  rationale: Direkte und kontextgemäße Wiedergabe des narrativen Aorists.
- source_word: λέγοντος
  choice: sagen
  rationale: Die Infinitivkonstruktion nach »hören« gibt das griechische Partizip im Deutschen flüssig und ohne unnötige Verstärkung wieder.
theological_decisions:
- issue: Adressat und Bedeutung der Aufforderung Ἔρχου
  choice: »Komm!« ohne ausdrückliche Festlegung des Adressaten
  alternative: »Zieh aus!«, wenn die Aufforderung an den Reiter gerichtet verstanden wird
  rationale: Der griechische Imperativ lautet schlicht »Komm!«, während der Adressat nicht ausdrücklich bezeichnet wird. Der Haupttext bewahrt diese Offenheit; die Fußnote dokumentiert die verbreitete kontextuelle Deutung, ohne sie in den Text einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die wiederholte Verbindung mit »und« bewahrt den fortschreitenden, visionären Satzbau des griechischen Textes, ohne im Deutschen unnatürlich zu wirken.
