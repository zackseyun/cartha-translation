  source_fidelity: 'Der Text gibt den griechischen Satzbau und die wesentlichen Elemente zuverlässig wieder: das Öffnen eines von sieben Siegeln durch das Lamm, eines der vier Lebewesen, der Stimmvergleich mit Donner sowie der knappe Imperativ. »Als« ist für das einmalige Ereignis der Vision eine angemessene Wiedergabe von ὅτε.'
