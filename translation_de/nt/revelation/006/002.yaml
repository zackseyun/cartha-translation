id: REV.6.2
reference: Revelation 6:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: de
  text: 'Und ich sah: Siehe, ein weißes Pferd! Der darauf saß, hatte einen Bogen. Ihm wurde ein Kranz gegeben[a], und er zog aus, siegend und um zu siegen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Krone“. Das griechische Wort στέφανος bezeichnet häufig einen Sieges- oder Ehrenkranz, nicht das königliche Diadem.'
    reason: lexical_alternative
  - marker: b
    text: Der Text nennt die Identität des Reiters nicht; sie wird unterschiedlich gedeutet.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: Die gewöhnliche und sachlich genaue Wiedergabe des Aorists von ὁράω; im Deutschen verbindet sie sich natürlich mit der folgenden visionären Aufmerksamkeitspartikel.
- source_word: ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den markanten, visionären Aufmerksamkeitsruf der Offenbarung in einer würdevollen und verständlichen Form.
- source_word: ἵππος λευκός
  choice: ein weißes Pferd
  rationale: Gibt die neu eingeführte, artikellose Nominalgruppe unmittelbar wieder.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: der darauf saß
  rationale: Bewahrt die substantivierte Partizipialkonstruktion, klingt im Deutschen jedoch natürlicher als eine streng nominale Wiedergabe.
- source_word: ἔχων τόξον
  choice: hatte einen Bogen
  rationale: Natürliche deutsche Wiedergabe des begleitenden Partizips; τόξον bezeichnet einen Bogen als Waffe.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: ihm wurde ein Siegeskranz gegeben
  rationale: στέφανος bezeichnet typischerweise einen Kranz beziehungsweise eine mit Sieg oder Ehre verbundene Krone und ist vom königlichen Diadem zu unterscheiden.
- source_word: ἐξῆλθεν
  choice: er zog aus
  rationale: Im Zusammenhang eines bewaffneten Reiters gibt „zog aus“ die gerichtete Bewegung und den militärischen Anklang idiomatisch wieder, ohne die Identität des Reiters festzulegen.
- source_word: νικῶν
  choice: siegend
  rationale: Das Präsenspartizip bezeichnet die den Auszug begleitende, fortdauernde Handlung beziehungsweise den siegreichen Zustand.
- source_word: ἵνα νικήσῃ
  choice: um zu siegen
  rationale: Die finale Kraft von ἵνα mit Konjunktiv wird im Deutschen klar und natürlich als Zweckangabe ausgedrückt.
theological_decisions:
- issue: Identität des Reiters auf dem weißen Pferd
  choice: Die Übersetzung lässt die Identität des Reiters offen.
  alternative: Deutungen sehen in ihm Christus oder eine christusähnliche Gestalt, einen erobernden Herrscher beziehungsweise ein Reich oder einen antichristlichen beziehungsweise täuschenden Eroberer.
  rationale: Der griechische Text beschreibt Aussehen, Ausrüstung und Handeln des Reiters, nennt aber seine Identität nicht. Diese Spannung darf nicht durch eine interpretierende Benennung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem bewusst erhöhten visionären Ruf „Siehe“. Kurze Sätze machen die rasche Abfolge der griechischen καί-Verbindungen verständlich, ohne Bildelemente oder theologische Mehrdeutigkeit zu beseitigen.
