review_pass:
  verdict: revise
  source_fidelity: 'Die Bildfolge und Syntax werden im Wesentlichen treffend wiedergegeben: Johannes sieht ein weißes Pferd, dessen Reiter einen Bogen hat, einen στέφανος empfängt und auszieht. „Siehe“ bewahrt die hervorhebende Funktion von ἰδού, und die Identität des Reiters bleibt zu Recht unbestimmt. „Siegeskranz“ legt jedoch die mit στέφανος häufig verbundene Siegesbedeutung im Haupttext stärker fest, als es das Wort allein verlangt.'
  naturalness: Der Text ist verständliches, würdiges modernes Standarddeutsch. Die gedrängte Schlusspaarung „siegend und um zu siegen“ ist absichtlich eng am Griechischen und im apokalyptischen Register vertretbar.
  terminology: Für στέφανος ist im Haupttext „Kranz“ die neutralere Wiedergabe; die mögliche Bedeutung „Krone“ und die häufige Assoziation mit einem Siegeskranz gehören in die Fußnote. Damit wird στέφανος nicht mit einem königlichen Diadem gleichgesetzt und zugleich nicht vorentschieden als Siegeskranz bestimmt.
  issues:
  - severity: medium
    issue: „Siegeskranz“ als Haupttextwiedergabe von στέφανος ist zu spezifisch.
    rationale: στέφανος kann einen Kranz beziehungsweise eine Krone bezeichnen und trägt nicht aus sich heraus zwingend die vollständige Spezifikation „Siegeskranz“. Die Siegesassoziation kann erläuternd in der Fußnote stehen.
