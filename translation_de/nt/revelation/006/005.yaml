    rationale: Das Semikolon in »ein schwarzes Pferd; und der darauf saß« trennt zwei eng zusammengehörige Teile unangemessen. »Da war« macht die im Deutschen sonst fragmentarische Schauformel nach »siehe« zu einem vollständigen, natürlichen Satz, ohne den Aussagegehalt zu verändern.
