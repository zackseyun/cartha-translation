review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und wesentlichen Ausdrücke des griechischen Textes zuverlässig wieder: das Öffnen des dritten Siegels, das dritte Lebewesen, der unbestimmte Imperativ »Komm!«, das schwarze Pferd sowie die Waage in der Hand dessen, der darauf sitzt. Die Mehrdeutigkeit des Adressaten von Ἔρχου bleibt gewahrt.'
  naturalness: 'Die Konstruktion »und siehe: ein schwarzes Pferd; und der darauf saß« ist im modernen Standarddeutsch durch die satzfragmentartige Nennung nach dem Doppelpunkt und besonders durch das Semikolon vor »und« unnötig holprig. Eine behutsame Umstellung kann die visionäre Formel bewahren und den Satz idiomatischer machen.'
  terminology: »Lebewesen« ist für ζῷον in diesem Offenbarungskontext angemessen. »Waage« trifft ζυγός im Zusammenhang von V. 6 besser als »Joch«; die Fußnote erhält die lexikalische Alternative. Die Anrede »Komm!« legt keinen Adressaten fest.
