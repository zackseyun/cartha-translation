  to: 'Und als er das dritte Siegel öffnete, hörte ich das dritte Lebewesen sagen: »Komm!«[a] Und ich sah, und siehe: Da war ein schwarzes Pferd, und der darauf saß, hielt eine Waage[b] in seiner Hand.'
  rationale: Die Revision beschränkt sich auf eine stilistisch notwendige Glättung der deutschen Visionseröffnung. Sie bewahrt »und siehe« und alle semantischen Bestandteile des griechischen Satzes, beseitigt aber die unidiomatische satzfragmentartige Konstruktion und das störende Semikolon.
