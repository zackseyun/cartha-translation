id: REV.6.5
reference: Revelation 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: de
  text: 'Und als er das dritte Siegel öffnete, hörte ich das dritte Lebewesen sagen: »Komm!«[a] Und ich sah, und siehe: Da war ein schwarzes Pferd, und der darauf saß, hielt eine Waage[b] in seiner Hand.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ruf kann an Johannes gerichtet sein (»Komm her!«) oder das Pferd und seinen Reiter zum Hervortreten auffordern.
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort kann einen Waagebalken oder eine Waage bezeichnen; hier ist wahrscheinlich eine Waage zum Abmessen von Lebensmitteln gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: öffnete
  rationale: Die übliche und natürliche Wiedergabe von ἀνοίγω; sie beschreibt hier das Öffnen des Siegels ohne interpretierenden Zusatz.
- source_word: σφραγῖδα τὴν τρίτην
  choice: das dritte Siegel
  rationale: Direkte Wiedergabe, die die Reihenfolge der Siegel bewahrt.
- source_word: ζῴου
  choice: Lebewesen
  rationale: Bezeichnet in der Offenbarung die lebendigen Wesen im himmlischen Thronsaal und nicht ein gewöhnliches Tier.
- source_word: Ἔρχου
  choice: Komm!
  rationale: Der kurze Imperativ bleibt kraftvoll; der nicht genannte Adressat wird nicht interpretierend festgelegt.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: ich sah, und siehe
  rationale: Bewahrt sowohl den Sehakt als auch die eindringliche visionäre Hinweisformel des griechischen Textes.
- source_word: ἵππος μέλας
  choice: ein schwarzes Pferd
  rationale: Wörtliche und klare Wiedergabe der für die Vision wichtigen Farbe.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: der darauf saß
  rationale: Folgt der griechischen Partizipialkonstruktion enger als die komprimierende Bezeichnung „sein Reiter“.
- source_word: ζυγὸν
  choice: eine Waage
  rationale: ζυγός kann einen Waagebalken beziehungsweise eine Waage bezeichnen; der Zusammenhang mit abgemessenen Lebensmitteln im folgenden Vers stützt diese Bedeutung.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: in seiner Hand
  rationale: Direkte, idiomatische Wiedergabe der Präpositionalphrase.
theological_decisions:
- issue: Adressat des Befehls Ἔρχου
  choice: Nur „Komm!“ ohne ausdrücklichen Adressaten
  alternative: Der Ruf kann an Johannes gerichtet sein oder Pferd und Reiter zum Hervortreten auffordern.
  rationale: Im Griechischen bleibt der Adressat unausgesprochen. Die Übersetzung bewahrt diese echte Mehrdeutigkeit und erläutert sie in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die visionäre Formel „und siehe“ bleibt bewusst erhalten. Die Satzstruktur folgt dem griechischen Erzählfluss, ohne im Deutschen unnötig schwerfällig zu werden.
