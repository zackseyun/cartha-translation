id: REV.6.14
reference: Revelation 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: de
  text: Und der Himmel wich zurück wie eine Schriftrolle, die zusammengerollt wird,[a] und jeder Berg und jede Insel wurden von ihren Plätzen wegbewegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wurde getrennt“, „teilte sich“ oder „wich fort“. Das griechische Verb kann ein Trennen, Zurückweichen oder Sich-Entfernen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανός
  choice: Himmel
  rationale: Im Deutschen bezeichnet „Himmel“ sowohl den sichtbaren Himmelsraum als auch, je nach Kontext, den Bereich Gottes. Hier macht die kosmische Bildsprache den sichtbaren Himmel wahrscheinlich, ohne dass die Übersetzung die Mehrdeutigkeit unnötig verengt.
- source_word: ἀπεχωρίσθη
  choice: wich zurück
  rationale: Das Verb bezeichnet ein Sich-Trennen, Zurückweichen oder Entfernen. „Wich zurück“ ist im Deutschen anschaulich und bewahrt zusammen mit dem Bild der zusammengerollten Schriftrolle die Bewegung, ohne ein völliges Verschwinden oder eine Vernichtung zu behaupten.
- source_word: βιβλίον
  choice: Schriftrolle
  rationale: Im antiken Zusammenhang ist eine Rolle gemeint, nicht ein modernes gebundenes Buch; auch das Zusammenrollen bestätigt diese Bedeutung.
- source_word: ἑλισσόμενον
  choice: die zusammengerollt wird
  rationale: Die Form beschreibt einen fortschreitenden beziehungsweise passiv dargestellten Rollvorgang und wird im Deutschen klar und natürlich wiedergegeben.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: jeder Berg und jede Insel
  rationale: πᾶν hat bei den Einzelnomen verteilende Bedeutung. Die Wiederholung von „jeder/jede“ ist im Deutschen eindeutig und idiomatisch.
- source_word: ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν
  choice: wurden von ihren Plätzen wegbewegt
  rationale: Die griechische Mehrzahl „von ihren Plätzen“ bleibt erhalten. „Wegbewegt“ bezeichnet hier eine Ortsveränderung deutlicher als bloßes Erzittern.
theological_decisions:
- issue: Kosmische Bedeutung von οὐρανός
  choice: „Himmel“ im Sinn des sichtbaren Himmelsraums, ohne diesen Sinn ausdrücklich in den Text einzusetzen
  alternative: „Himmelsgewölbe“ oder eine Formulierung, die ausdrücklich Gottes Wohnbereich bezeichnet
  rationale: Die Vision beschreibt eine kosmische Erschütterung. Das gewöhnliche deutsche Wort „Himmel“ lässt den bildhaften Bezug erkennen, ohne eine zusätzliche kosmologische oder lehrmäßige Aussage einzutragen.
- issue: Art der Bewegung des Himmels
  choice: „wich zurück“
  alternative: „wurde getrennt“, „teilte sich“ oder „verschwand“
  rationale: Der griechische Ausdruck lässt Trennung, Zurückweichen oder Sich-Entfernen zu. „Wich zurück“ bewahrt diese Spannung und vermeidet die stärkere Behauptung, der Himmel sei vernichtet worden oder völlig verschwunden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Schriftrolle“ vermittelt den antiken Gegenstand unmittelbar; „wegbewegt“ hält die tatsächliche Ortsveränderung fest. Die Satzstruktur folgt der feierlichen, visionären Reihung des griechischen Textes.
