  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: de
  text: Denn der große Tag ihres Zorns ist gekommen[a] – wer kann bestehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche deutenden Wiedergaben haben hier »seines Zorns«. Im Griechischen steht »ihres Zorns«; das Pronomen bezieht sich auf den, der auf dem Thron sitzt, und auf das Lamm.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für den Schrecken im vorhergehenden Vers ein. „Denn“ ist im Deutschen ein natürlicher, würdevoller kausaler Anschluss.
- source_word: ἦλθεν
  choice: ist gekommen
  rationale: Das Aoristverb bezeichnet hier das eingetretene Kommen des Tages mit gegenwärtiger Folge; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: der große Tag
  rationale: Gibt die attributive Fügung idiomatisch wieder und bewahrt ihr feierliches, endzeitliches Gewicht.
- source_word: τῆς ὀργῆς
  choice: des Zorns
  rationale: „Zorn“ bewahrt in diesem Gerichtszusammenhang die starke und richterliche Bedeutung von ὀργή besser als eine mildere Umschreibung.
- source_word: αὐτῶν
  choice: ihres
  rationale: Das griechische Pronomen steht im Plural und verweist auf den auf dem Thron Sitzenden und das Lamm aus Vers 16. Das pluralische „ihres“ bewahrt diese auffällige Formulierung.
- source_word: τίς δύναται σταθῆναι
  choice: wer kann da bestehen?
  rationale: Die rhetorische Frage wird in natürlichem Deutsch wiedergegeben. „Bestehen“ erfasst hier das Standhalten beziehungsweise Fortbestehen angesichts des Gerichts; „da“ bindet die Frage idiomatisch an die geschilderte Situation zurück.
theological_decisions:
- issue: Pluralisches Possessivpronomen beim Zorn des auf dem Thron Sitzenden und des Lammes
  choice: „ihres Zorns“ im Plural beibehalten
  alternative: „seines Zorns“ als singularische Angleichung
  rationale: Der griechische Text hat ausdrücklich αὐτῶν („ihrer“) und nimmt damit beide Gestalten aus dem vorhergehenden Vers auf. Die Übersetzung bewahrt diese grammatische und theologische Spannung, statt sie zugunsten einer singularischen Deutung aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem apokalyptischem Ton. Der Gedankenstrich gibt den zugespitzten Übergang zur rhetorischen Frage natürlich wieder; die theologisch auffällige Mehrzahl wird unverändert bewahrt.
