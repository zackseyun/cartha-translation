    rationale: „Gemeinsam“ kann über die grammatische Rückverweisung hinaus eine bestimmte Deutung der gemeinsamen Handlung nahelegen. Eine neutrale Benennung beider vorausgehenden Referenten wahrt die textliche Spannung besser.
