id: REV.6.13
reference: Revelation 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: de
  text: Und die Sterne des Himmels fielen auf die Erde, wie ein Feigenbaum seine unreifen Feigen[a] abwirft, wenn er von einem starken Wind geschüttelt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Winterfeigen«, »grüne Feigen« oder »Spätfeigen«; das griechische Wort bezeichnet noch nicht ausgereifte Feigen, die abgeschüttelt werden, bevor sie reif sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: Sterne
  rationale: Die gewöhnliche Bedeutung ist »Sterne«. Das apokalyptische Bild bleibt ungedeutet erhalten.
- source_word: τοῦ οὐρανοῦ
  choice: des Himmels
  rationale: οὐρανός kann »Himmel« oder »Luftraum« bedeuten; »des Himmels« bewahrt hier den kosmischen und erhöhten Ton.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: fielen auf die Erde
  rationale: Die Wendung bezeichnet die Bewegung hin zur Erde; »auf die Erde fallen« ist im Deutschen natürlich und anschaulich.
- source_word: συκῆ
  choice: Feigenbaum
  rationale: Die übliche und eindeutige deutsche Bezeichnung.
- source_word: βάλλει
  choice: abwirft
  rationale: Im Zusammenhang mit Früchten gibt »abwerfen« die Wirkung von βάλλω idiomatisch wieder und passt zur Erschütterung durch den Wind.
- source_word: ὀλύνθους
  choice: unreifen Feigen
  rationale: ὄλυνθος bezeichnet Feigen, die noch nicht ausgereift sind und vor der Reife abgeschüttelt werden können; die Fußnote wahrt mögliche speziellere Nuancen.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: von einem starken Wind
  rationale: Bei Wind bezeichnet μέγας hier natürlich dessen große Stärke.
- source_word: σειομένη
  choice: wenn er ... geschüttelt wird
  rationale: Das passive Partizip beschreibt den begleitenden Umstand. Ein deutscher Temporalsatz gibt diesen Zusammenhang klar und natürlich wieder.
theological_decisions:
- issue: Apokalyptisches Bild von den fallenden Sternen
  choice: Das lexikalische Bild »die Sterne des Himmels fielen auf die Erde« bleibt ohne Deutung stehen.
  alternative: Die Sterne ausdrücklich als Engelwesen, Herrscher oder andere symbolische Gestalten deuten.
  rationale: Der Text kann symbolische Bedeutung tragen, legt diese aber in diesem Vers nicht ausdrücklich fest. Die Übersetzung soll die Bildsprache und ihre theologische Spannung bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kosmische Bildsprache bleibt direkt und eindringlich; die Syntax ist natürlich, ohne den apokalyptischen Ton zu glätten.
