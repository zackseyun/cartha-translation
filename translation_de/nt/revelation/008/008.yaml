source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: de
  text: Und der zweite Engel blies die Posaune; und etwas, das einem großen Berg glich, der mit Feuer brannte, wurde ins Meer geworfen, und ein Drittel des Meeres wurde zu Blut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas wie ein großer Berg, der mit Feuer brannte“; das griechische Wort kennzeichnet eine Ähnlichkeit, nicht unbedingt Identität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: blies die Posaune
  rationale: Das Verb bezeichnet das Blasen beziehungsweise Ertönenlassen einer Posaune. Das im Deutschen nötige Objekt ist aus dem Zusammenhang eindeutig erschlossen.
- source_word: ὡς ὄρος μέγα
  choice: etwas, das einem großen … Berg glich
  rationale: ὡς kennzeichnet einen Vergleich. Die Formulierung bewahrt die Ähnlichkeit, ohne den Gegenstand mit einem wirklichen Berg gleichzusetzen.
- source_word: πυρὶ καιόμενον
  choice: mit Feuer brennenden
  rationale: Die Wendung gibt den instrumentalen beziehungsweise begleitenden Dativ πυρί zusammen mit dem Partizip καιόμενον unmittelbar und bildhaft wieder.
- source_word: ἐβλήθη
  choice: wurde … geworfen
  rationale: Das Passiv wird beibehalten; „geworfen“ ist gegenwärtiges Standarddeutsch und fügt keine zusätzliche Heftigkeit hinzu.
- source_word: εἰς τὴν θάλασσαν
  choice: ins Meer
  rationale: Dies ist die direkte und natürliche deutsche Wiedergabe.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: ein Drittel des Meeres
  rationale: Die moderne deutsche Teilmengenformulierung bewahrt die genaue Mengenangabe.
- source_word: αἷμα
  choice: Blut
  rationale: Die schlichte Wiedergabe lässt die apokalyptische Aussage ohne erklärende Abschwächung oder symbolische Festlegung stehen.
theological_decisions:
- issue: Wesen des bergähnlichen Gegenstands
  choice: Der Gegenstand wird nur durch seine Ähnlichkeit mit einem großen brennenden Berg beschrieben.
  alternative: Die Erscheinung als wirklichen Berg, Meteor oder ausschließliches Gerichtssymbol bestimmen.
  rationale: ὡς signalisiert Ähnlichkeit und lässt offen, wie die visionäre Erscheinung ontologisch oder symbolisch zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Posaune“ wahrt den etablierten biblischen Klang, während Satzbau und Wortwahl gegenwärtig und gut verständlich bleiben.
