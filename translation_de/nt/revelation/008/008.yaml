  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente zuverlässig wieder: das Posaunenblasen, die durch ὡς markierte Ähnlichkeit, das Brennen mit Feuer, das passive Hineinwerfen ins Meer und die Verwandlung eines Drittels des Meeres in Blut. „Etwas, das ... glich“ bewahrt die Unbestimmtheit des visionären Gegenstands angemessen.'
