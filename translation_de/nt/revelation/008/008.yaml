- from: Und der zweite Engel blies die Posaune. Da wurde etwas, das einem großen, mit Feuer brennenden Berg glich,[a] ins Meer geworfen, und ein Drittel des Meeres wurde zu Blut.
  to: Und der zweite Engel blies die Posaune; und etwas, das einem großen Berg glich, der mit Feuer brannte, wurde ins Meer geworfen, und ein Drittel des Meeres wurde zu Blut.[a]
  rationale: Die Revision bewahrt die griechische Vergleichsaussage und die passive Handlung, ohne den Gegenstand als Berg zu identifizieren oder die Bildsprache auszudeuten. Sie ersetzt die leicht interpretierende Überleitung „Da“ durch eine einfache Reihung und glättet die deutsche Formulierung von „brennend mit Feuer“. Der Fußnotenanker steht bei der gesamten Aussage, weil die Alternative die syntaktische Ausgestaltung der Vergleichsformulierung betrifft.
