  terminology: „Posaune“, „Meer“ und „Blut“ sind treffend und im würdevollen modernen Bibeldeutsch natürlich. Die Vergleichsformulierung darf weder einen tatsächlichen Berg noch eine bestimmte symbolische Deutung festlegen.
