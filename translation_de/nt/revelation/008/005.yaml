id: REV.8.5
reference: Revelation 8:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: de
  text: Und der Engel nahm das Räuchergefäß, füllte es mit Feuer vom Altar und warf es auf die Erde. Da kamen Donnerschläge, Laute[a], Blitze und ein Erdbeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stimmen“. Das griechische Wort kann sowohl Stimmen als auch Laute oder Geräusche bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: nahm
  rationale: Obwohl die griechische Form ein Perfekt ist, gehört sie hier zur Abfolge der erzählten Handlungen; das deutsche Präteritum gibt dies natürlich wieder.
- source_word: λιβανωτόν
  choice: Räuchergefäß
  rationale: Gemeint ist im kultischen Zusammenhang ein Gefäß für Räucherwerk beziehungsweise Altarglut. „Räuchergefäß“ ist verständlich und bezeichnet den Gegenstand genauer als das heute wenig geläufige „Räucherfass“.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: füllte es mit Feuer vom Altar
  rationale: Die Formulierung gibt sowohl den Inhalt des Gefäßes als auch dessen Herkunft natürlich wieder und bewahrt die symbolisch wichtige ausdrückliche Nennung des Altars.
- source_word: θυσιαστηρίου
  choice: Altar
  rationale: Dies ist die übliche deutsche Wiedergabe des Begriffs in kultischer und apokalyptischer Tempelbildsprache.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: warf es auf die Erde
  rationale: „Warf“ bewahrt die kraftvolle, dramatische Handlung; „Erde“ entspricht dem kosmischen Gerichtszusammenhang der Offenbarung besser als das engere „Boden“.
- source_word: ἐγένοντο
  choice: da kamen
  rationale: Die Wendung bezeichnet das plötzliche Eintreten der aufgezählten Erscheinungen und klingt im Deutschen zugleich natürlich und erzählerisch.
- source_word: βρονταὶ
  choice: Donnerschläge
  rationale: Der Plural weist auf wiederholte Donnerereignisse hin; „Donnerschläge“ gibt dies idiomatisch wieder.
- source_word: φωναὶ
  choice: Laute
  rationale: φωνή kann sowohl Stimmen als auch sonstige hörbare Laute bezeichnen. Da keine Sprecher genannt werden, wahrt „Laute“ die Unbestimmtheit; „Stimmen“ bleibt als Fußnotenalternative erhalten.
- source_word: ἀστραπαὶ
  choice: Blitze
  rationale: „Blitze“ ist die klare und natürliche deutsche Wiedergabe des griechischen Plurals.
- source_word: σεισμός
  choice: ein Erdbeben
  rationale: Der griechische Singular wird als deutsches zählbares Substantiv idiomatisch mit dem unbestimmten Artikel wiedergegeben.
theological_decisions:
- issue: Bedeutung von γῆ im apokalyptischen Gerichtszusammenhang
  choice: Erde
  alternative: Boden; Land
  rationale: Die kosmische Gerichtsszene und der weitere Sprachgebrauch der Offenbarung sprechen für „Erde“. „Boden“ würde den Sinn unnötig verengen, „Land“ könnte eine nicht ausdrücklich angezeigte örtliche Begrenzung nahelegen.
- issue: Bedeutung von φωναί in der theophanischen Formel
  choice: Laute
  alternative: Stimmen
  rationale: Da keine Sprechenden oder Äußerungen genannt werden, legt „Laute“ keine bestimmte sprachliche Rede fest. Die mögliche Bedeutung „Stimmen“ wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzfolge bewahrt die Dramatik der Szene; Fachsprache und konfessionell geprägte Ausdeutungen werden vermieden.
