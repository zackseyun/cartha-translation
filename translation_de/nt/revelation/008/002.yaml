id: REV.8.2
reference: Revelation 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: de
  text: Und ich sah die sieben Engel, die vor Gott stehen[a], und ihnen wurden sieben Posaunen gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vor Gott dastehen“ oder „die vor Gott ihren Stand eingenommen haben“; das griechische Perfekt hebt ihr Stehen als fortdauernden Zustand hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: 'Der Aorist von ὁράω bezeichnet hier im fortlaufenden Visionsbericht am natürlichsten das Wahrnehmen: „ich sah“.'
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: die sieben Engel
  rationale: Artikel und Zahl bezeichnen eine bestimmte Gruppe; der himmlische Thronsaal-Kontext spricht für „Engel“ statt „Boten“.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe, natürliche Wendung bewahrt den räumlich-relationalen Sinn von ἐνώπιον.
- source_word: ἑστήκασιν
  choice: stehen
  rationale: Das Perfekt von ἵστημι beschreibt einen fortbestehenden Zustand. Das deutsche Präsens gibt diesen stativen Sinn idiomatisch wieder.
- source_word: ἐδόθησαν αὐτοῖς
  choice: ihnen wurden … gegeben
  rationale: Die Passivkonstruktion lässt wie im Griechischen offen, wer die Posaunen gibt.
- source_word: σάλπιγγες
  choice: Posaunen
  rationale: „Posaunen“ ist die im Deutschen geläufige und für die apokalyptische Gerichtssymbolik passende Wiedergabe von σάλπιγγες.
theological_decisions:
- issue: Identität und Rang der sieben Engel
  choice: „die sieben Engel, die vor Gott stehen“ ohne nähere Rangbezeichnung
  alternative: „die sieben Erzengel“ oder eine ausdrückliche Verknüpfung mit späteren Engeltraditionen
  rationale: Der griechische Text nennt eine bestimmte Gruppe von sieben Engeln vor Gott, bezeichnet sie aber weder als Erzengel noch erläutert er ihren Rang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Visionsbericht; „Posaunen“ folgt dem etablierten biblisch-apokalyptischen Sprachgebrauch, ohne altertümlich zu wirken.
