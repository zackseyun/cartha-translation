id: REV.8.9
reference: Revelation 8:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: de
  text: Und ein Drittel der Geschöpfe im Meer – die lebendig waren[a] – starb, und ein Drittel der Schiffe wurde zerstört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Seelen/Leben hatten“; auch: „lebende Wesen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: starb
  rationale: Der Aorist von ἀποθνῄσκω bezeichnet hier unmittelbar den Tod. Der Singular entspricht dem griechischen Subjekt τὸ τρίτον („ein Drittel“).
- source_word: τὸ τρίτον
  choice: ein Drittel
  rationale: Dies ist die natürliche deutsche Wiedergabe des quantitativen Ausdrucks und bewahrt beim jeweiligen Verb den Singular.
- source_word: κτισμάτων
  choice: Geschöpfe
  rationale: κτίσμα bezeichnet etwas Geschaffenes bzw. ein Geschöpf. Der Zusatz über das Leben und der Ort im Meer zeigen, dass hier belebte Meeresgeschöpfe gemeint sind.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: im Meer
  rationale: Die knappe Ortsangabe gibt die griechische Präpositionalfügung natürlich wieder.
- source_word: τὰ ἔχοντα ψυχάς
  choice: die, die Leben in sich hatten
  rationale: Die Formulierung bewahrt den besonderen, auf beseeltes bzw. lebendiges Dasein zielenden Zusatz, ohne im Deutschen die missverständliche Vorstellung einzelner „lebender Seelen“ einzuführen.
- source_word: ψυχάς
  choice: Leben
  rationale: ψυχή kann Seele, Leben oder Lebewesen bezeichnen. Bei Meerestieren hebt der Plural hier ihre belebte Natur hervor; „Leben“ ist im modernen Deutsch kontextgerecht, während eine Fußnote die wörtlichere Möglichkeit offenhält.
- source_word: πλοίων
  choice: Schiffe
  rationale: πλοῖον bezeichnet ein Schiff oder Boot; „Schiffe“ ist in diesem Zusammenhang die klare und natürliche Wiedergabe.
- source_word: διεφθάρησαν
  choice: wurde zerstört
  rationale: Das Passiv von διαφθείρω bezeichnet hier vernichtende Zerstörung. Wegen des grammatisch singularischen „ein Drittel“ steht das deutsche Verb im Singular.
theological_decisions:
- issue: Wiedergabe von ψυχάς bei Meerestieren
  choice: „Leben in sich hatten“ im Haupttext
  alternative: „Seelen hatten“ oder „lebende Wesen waren“
  rationale: Der Ausdruck kennzeichnet die Geschöpfe als belebt und macht keine ausgearbeitete anthropologische Aussage über Tierseelen. Die Haupttextfassung wahrt den Sinn, während die Fußnote die lexikalische Breite von ψυχή sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eingeschobene Wiederaufnahme macht deutlich, dass nur die belebten Geschöpfe im Meer gemeint sind; die Gedankenstriche bewahren die appositionelle Hervorhebung des griechischen Zusatzes.
