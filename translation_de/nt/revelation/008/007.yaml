  to: Und der erste blies die Posaune. Da kamen Hagel und Feuer, mit Blut vermischt, und das wurde auf die Erde[a] geworfen. Ein Drittel der Erde wurde verbrannt, ein Drittel der Bäume wurde verbrannt, und alles grüne Gras wurde verbrannt.
