id: REV.8.7
reference: Revelation 8:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: de
  text: Und der erste blies die Posaune. Da kamen Hagel und Feuer, mit Blut vermischt, und das wurde auf die Erde[a] geworfen. Ein Drittel der Erde wurde verbrannt, ein Drittel der Bäume wurde verbrannt, und alles grüne Gras wurde verbrannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Land«. Das griechische Wort γῆ kann sowohl die Erde als auch ein Land beziehungsweise das Festland bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: der erste
  rationale: Der griechische Text lässt das Substantiv aus; aus dem unmittelbaren Zusammenhang ist einer der sieben Engel gemeint. Die Ellipse bleibt erhalten, ohne »Engel« in den Text einzufügen.
- source_word: ἐσάλπισεν
  choice: blies die Posaune
  rationale: Die deutsche Wendung gibt das Erschallenlassen einer Posaune natürlich wieder; das im Verb enthaltene Instrument wird entsprechend dem unmittelbaren Kontext ausdrücklich genannt.
- source_word: ἐγένετο
  choice: da kamen
  rationale: Die ereignishafte Einführung der apokalyptischen Erscheinung wird in gegenwärtigem, erzählerischem Deutsch wiedergegeben.
- source_word: χάλαζα καὶ πῦρ
  choice: Hagel und Feuer
  rationale: Die beiden zerstörerischen Elemente werden bildhaft und ohne Deutung direkt wiedergegeben.
- source_word: μεμιγμένα ἐν αἵματι
  choice: mit Blut vermischt
  rationale: Die Form bezeichnet einen vermischten Zustand; »mit Blut vermischt« ist klar und bewahrt das verstörende Bild.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: es wurde auf die Erde geworfen
  rationale: Das singularische Passiv fasst Hagel und Feuer als ein Gesamtphänomen auf. »Auf« drückt die durch εἰς bezeichnete Bewegung zum Ziel aus.
- source_word: τὸ τρίτον τῆς γῆς
  choice: ein Drittel der Erde
  rationale: Die partitive Wendung wird idiomatisch als ein Drittel wiedergegeben; »Erde« passt zum umfassenden apokalyptischen Zusammenhang, ohne die lexikalische Alternative »Land« zu verschweigen.
- source_word: κατεκάη
  choice: verbrannte
  rationale: Das Verb bezeichnet intensives beziehungsweise vollständiges Verbrennen. Im Deutschen kann »verbrannte« in diesem Zusammenhang den Untergang durch Feuer natürlich ausdrücken, ohne einen zusätzlichen Gradbegriff einzutragen.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: ein Drittel der Bäume
  rationale: Natürliche deutsche Wiedergabe der partitiven Konstruktion und ihrer wiederholten Drittel-Struktur.
- source_word: πᾶς χόρτος χλωρός
  choice: alles grüne Gras
  rationale: Die konkrete Vegetationsbezeichnung und das Merkmal frischen Grüns bleiben erhalten.
theological_decisions:
- issue: Bedeutungsumfang von γῆ im Bild des Gerichts
  choice: Erde
  alternative: Land
  rationale: Der kosmisch-apokalyptische Zusammenhang legt »Erde« nahe. Da γῆ jedoch auch »Land« bedeuten kann, wird diese echte lexikalische Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzstruktur und das dreimalige »verbrannte« bewahren den eindringlichen Rhythmus des griechischen Textes. Die elliptische Bezeichnung »der erste« bleibt trotz der im Kontext erkennbaren Engelreferenz stehen.
