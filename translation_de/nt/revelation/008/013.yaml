id: REV.8.13
reference: Revelation 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: de
  text: 'Und ich sah und hörte einen Adler[a], der hoch am Himmel[b] flog und mit lauter Stimme rief: »Wehe, wehe, wehe denen, die auf der Erde wohnen, wegen der übrigen Posaunenstöße der drei Engel, die gleich ihre Posaunen blasen werden!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »einen Engel« statt »einen Adler«.
    reason: textual_variant
  - marker: b
    text: Wörtlich »in der Himmelsmitte«; der griechische Ausdruck bezeichnet den höchsten Bereich des Himmels oder den offenen Himmel hoch oben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: Adler
  rationale: Das Substantiv bezeichnet gewöhnlich einen Adler. Ohne einen auf Aas bezogenen Kontext ist »Adler« gegenüber »Geier« vorzuziehen; die SBLGNT-Lesart wird im Haupttext beibehalten.
- source_word: μεσουρανήματι
  choice: hoch am Himmel
  rationale: Der Ausdruck bezeichnet die Himmelsmitte beziehungsweise den höchsten, weithin sichtbaren Bereich des Himmels. »Hoch am Himmel« ist im modernen Deutschen natürlich und bewahrt die kosmische Bildsprache.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Diese idiomatische Wiedergabe erhält die öffentliche, eindringliche Verkündigung.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: Wehe, wehe, wehe
  rationale: Die dreifache Wiederholung wird wegen ihrer prophetischen und rhetorischen Wucht unverändert bewahrt.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: denen, die auf der Erde wohnen
  rationale: Die Formulierung bewahrt die in der Offenbarung wiederkehrende Wendung und klingt zugleich verständlich und natürlich.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: wegen der übrigen Posaunenstöße
  rationale: ἐκ ist hier kausal zu verstehen. φωναί bezeichnet in Verbindung mit der Posaune deren hörbare Stöße oder Klänge; »Posaunenstöße« gibt das Bild prägnant wieder.
- source_word: τῶν τριῶν ἀγγέλων
  choice: der drei Engel
  rationale: Im apokalyptischen Zusammenhang bezeichnet ἄγγελοι himmlische Engel, nicht allgemein menschliche Boten.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: die gleich ihre Posaunen blasen werden
  rationale: μέλλω mit Infinitiv drückt bevorstehendes Handeln aus. Die im Griechischen aus dem Kontext ergänzte Posaune wird im Deutschen ausdrücklich genannt.
theological_decisions:
- issue: Textlesart des fliegenden Rufers
  choice: ein Adler
  alternative: ein Engel
  rationale: Der Haupttext folgt der vorgegebenen SBLGNT-Lesart ἀετοῦ (»Adler«). Die abweichende Lesart »Engel« wird wegen ihrer handschriftlichen Bezeugung in einer Fußnote dokumentiert, aber nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzbewegung und der dreifache Weheruf bewahren den feierlich-apokalyptischen Ton; »hoch am Himmel« und »gleich ihre Posaunen blasen« vermeiden unnötig altertümliche oder schwer verständliche Wendungen.
