id: REV.8.11
reference: Revelation 8:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: de
  text: Und der Stern heißt Wermut[a]. Ein Drittel der Gewässer wurde zu Wermut, und viele Menschen starben infolge des Wassers, weil sie bitter gemacht worden waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wermut ist eine Pflanze, die für ihren starken bitteren Geschmack bekannt ist. Im Griechischen steht für den Namen des Sterns und für das veränderte Wasser dasselbe Wort.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »weil die Gewässer bitter gemacht worden waren«. Das griechische Passiv nennt nicht, wer oder was sie bitter machte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄνομα τοῦ ἀστέρος λέγεται
  choice: der Stern heißt
  rationale: Natürliches, knappes Deutsch für die griechische Namensformel; der Sinn »der Name des Sterns lautet« bleibt vollständig erhalten.
- source_word: Ἄψινθος / ἄψινθον
  choice: Wermut / Wermut
  rationale: Bezeichnet die sprichwörtlich bittere Pflanze. Die identische Wiedergabe bewahrt die bewusste Verbindung zwischen dem Namen des Sterns und der Veränderung des Wassers.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: ein Drittel der Gewässer
  rationale: Gibt den partitiven und quantitativen Ausdruck idiomatisch wieder; »Gewässer« passt zum pluralischen und umfassenden τῶν ὑδάτων.
- source_word: ἐγένετο ... εἰς ἄψινθον
  choice: wurde zu Wermut
  rationale: Bewahrt die konkrete Verwandlungsmetapher und vermeidet die erklärende Abschwächung »wurde bitter wie Wermut«.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: viele Menschen
  rationale: Geschlechtsübergreifende, natürliche Wiedergabe; der partitive Sinn ist im Kontext hinreichend erkennbar.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: starben an dem Wasser
  rationale: Drückt Quelle beziehungsweise Ursache natürlich aus, ohne das im Griechischen nicht ausdrücklich genannte Trinken hinzuzufügen. Der Singular ist im Deutschen als Sammelbezeichnung idiomatisch.
- source_word: ὅτι ἐπικράνθησαν
  choice: weil es bitter geworden war
  rationale: Das Pronomen nimmt das unmittelbar zuvor genannte Wasser auf. Das Plusquamperfekt verdeutlicht, dass dessen Bitterwerden den Todesfällen vorausging; »geworden« lässt die verursachende Instanz unausgesprochen.
theological_decisions:
- issue: Bezugswort des pluralischen Passivs ἐπικράνθησαν
  choice: Bezug auf die Gewässer beziehungsweise das Wasser
  alternative: Bezug auf die Menschen, die verbittert oder krank geworden wären
  rationale: Das nächstliegende Bezugswort ist τῶν ὑδάτων, und der Zusammenhang nennt das bitter gewordene Wasser als Todesursache. Die deutsche Formulierung macht diesen grammatisch und kontextuell starken Bezug deutlich.
- issue: Bildcharakter von »zu Wermut werden«
  choice: Die konkrete Metapher bleibt stehen
  alternative: Erklärend mit »wurde bitter wie Wermut« oder »wurde giftig« wiedergeben
  rationale: Der griechische Text wiederholt Ἄψινθος/ἄψινθον und verbindet so Sternname und Wasser ausdrücklich. Eine erklärende Wiedergabe würde diese literarische und theologische Spannung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bewahren den eindringlichen apokalyptischen Erzählstil. »Wermut« ist der geläufige deutsche Pflanzenname; die Wiederholung wird bewusst beibehalten. Die Fußnotenmarker [a] und [b] stehen vollständig im Haupttext.
