- from: Und der Stern heißt Wermut[a]. Ein Drittel der Gewässer wurde zu Wermut, und viele Menschen starben an dem Wasser, weil es bitter geworden war.[b]
  to: Und der Stern heißt Wermut[a]. Ein Drittel der Gewässer wurde zu Wermut, und viele Menschen starben infolge des Wassers, weil sie bitter gemacht worden waren.[b]
  rationale: Die Revision stellt das passive, auf die Gewässer bezogene Prädikat des griechischen Textes wieder her. Zugleich ersetzt sie die weniger idiomatische und potenziell missverständliche Kausalformulierung durch eine klare deutsche Ursachenangabe. Die konkrete Wermut-Metapher und ihre Wiederholung bleiben unverändert erhalten.
