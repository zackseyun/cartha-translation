  naturalness: »Der Stern heißt Wermut« und »wurde zu Wermut« sind klares, modernes Standarddeutsch. »Viele Menschen starben an dem Wasser« klingt weniger idiomatisch und kann im Deutschen missverständlich sein; »infolge des Wassers« bezeichnet die Ursache klar, ohne ein Trinken hinzuzufügen.
  terminology: »Wermut« ist der geläufige deutsche Pflanzenname und erhält die beabsichtigte lexikalische Verbindung zwischen dem Namen des Sterns und dem Zustand der Gewässer. Es besteht kein Anlass, eine modern getränkebezogene Bedeutung wie »Absinth« in den Haupttext einzuführen.
