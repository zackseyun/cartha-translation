id: REV.8.12
reference: Revelation 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: de
  text: Und der vierte Engel blies die Posaune. Da wurde ein Drittel der Sonne, ein Drittel des Mondes und ein Drittel der Sterne getroffen, sodass ein Drittel von ihnen verfinstert wurde und der Tag während eines Drittels seiner Dauer nicht schien und die Nacht ebenso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit stärkerer Zwecknuance: »damit ein Drittel von ihnen verfinstert würde und der Tag während eines Drittels seiner Dauer nicht schiene und die Nacht ebenso.«'
    reason: Die griechische Konstruktion mit ἵνα kann hier neben einer Folge auch einen beabsichtigten Zweck ausdrücken.
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: blies die Posaune
  rationale: Das Verb bezeichnet das Erschallenlassen einer Posaune bzw. Trompete. »Blies die Posaune« ist im Deutschen natürlich und gibt die Handlung ausdrücklich wieder.
- source_word: ἐπλήγη
  choice: wurde ... getroffen
  rationale: Der passive Aorist von πλήσσω bezeichnet ein Getroffen- oder Geschlagenwerden. »Getroffen« bewahrt das Gerichtsmotiv in heutiger, nicht archaischer Sprache.
- source_word: τὸ τρίτον
  choice: ein Drittel
  rationale: Die wiederholte Mengenangabe wird im Deutschen idiomatisch mit »ein Drittel« wiedergegeben; ihre bewusste Wiederholung bleibt erhalten.
- source_word: τοῦ ἡλίου / τῆς σελήνης / τῶν ἀστέρων
  choice: der Sonne / des Mondes / der Sterne
  rationale: Die drei Himmelslichter werden unmittelbar und wörtlich bezeichnet.
- source_word: ἵνα
  choice: sodass
  rationale: ἵνα kann hier Folge oder Zweck ausdrücken. Im fortlaufenden Bericht ist »sodass« eine natürliche Wiedergabe der eintretenden Wirkung; die mögliche Zwecknuance wird in der Fußnote bewahrt.
- source_word: σκοτισθῇ
  choice: verfinstert wurde
  rationale: Die passive Form wird beibehalten und passt zur kosmischen Verdunkelung. »Verfinstert« ist präzise und würdevoll.
- source_word: αὐτῶν
  choice: von ihnen
  rationale: Das Pluralpronomen verweist kollektiv auf Sonne, Mond und Sterne und wird deshalb pluralisch wiedergegeben.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: der Tag ... nicht schien
  rationale: φαίνω kann »scheinen«, »erscheinen« oder »Licht geben« bedeuten. Im Zusammenhang der verfinsterten Himmelslichter bewahrt »nicht schien« die Lichtmetaphorik und die knappe Ausdrucksweise.
- source_word: τὸ τρίτον αὐτῆς
  choice: während eines Drittels seiner Dauer
  rationale: Das feminine Pronomen bezieht sich auf den Tag. Die Formulierung verdeutlicht, dass ein Drittel der Zeitspanne des Tages betroffen ist, ohne den Umfang auszuweiten.
- source_word: ἡ νὺξ ὁμοίως
  choice: ebenso die Nacht
  rationale: 'Die elliptische Kürze des Griechischen bleibt erhalten: Dieselbe Einschränkung gilt entsprechend für die Nacht.'
theological_decisions:
- issue: Art der kosmischen Gerichtsbildsprache
  choice: Die Verfinsterung der Himmelslichter wird als im Text geschildertes kosmisches Gericht wiedergegeben, ohne ihre Wirklichkeitsebene festzulegen.
  alternative: Die Erscheinung ausdrücklich als rein wörtliches astronomisches Ereignis oder als ausschließlich symbolische Darstellung deuten.
  rationale: Der Vers selbst entscheidet nicht zwischen einer wörtlichen, symbolischen oder beide Ebenen verbindenden Lesart. Die Übersetzung bewahrt deshalb die apokalyptische Bildsprache und ihre Spannung.
- issue: Folge oder Zweck bei ἵνα
  choice: Im Haupttext wird die Folge mit »sodass« ausgedrückt; die mögliche Zwecknuance wird in einer Fußnote genannt.
  alternative: Die Konstruktion im Haupttext ausschließlich final mit »damit« wiedergeben.
  rationale: Die griechische ἵνα-Konstruktion lässt in diesem Zusammenhang sowohl eine zweckhafte als auch eine ergebnisbezogene Nuance zu. Keine davon soll dogmatisch verabsolutiert werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Erzählstil. Die Wiederholung von »ein Drittel« bildet den eindringlichen Rhythmus des griechischen Textes ab. Der Gedankenstrich macht die knappe Ellipse bei der Nacht verständlich, ohne sie inhaltlich auszudeuten.
