  source_fidelity: 'Die Übersetzung trifft die wesentlichen Elemente des griechischen Textes: einen weiteren Engel, den Altar, ein goldenes Räuchergefäß, die passive Gabe von viel Räucherwerk, den Zweck des Darbringens, die Gebete aller Heiligen sowie den goldenen Altar vor dem Thron. „Trat an den Altar“ ist jedoch gegenüber ἐστάθη etwas zu dynamisch und lässt das erreichte Stehen bzw. Sich-Hinstellen weniger deutlich erkennen. Die Fußnote nennt zudem eine „wörtliche“ Fassung mit eingefügtem Objekt, obwohl dieses im Griechischen nur aus dem Kontext zu ergänzen ist.'
  naturalness: Der Text ist modernes, würdiges und gut verständliches Standarddeutsch. „Stellte sich an den Altar“ ist idiomatisch und gibt die griechische Aktionsart genauer wieder. Die Satzverbindung mit „mit einem goldenen Räuchergefäß“ ist dabei knapper als die ergänzende Angabe „in der Hand“, die der Ausgangstext nicht ausdrücklich macht.
  terminology: „Altar“, „goldenes Räuchergefäß“, „Räucherwerk“ und „Heilige“ sind passende und etablierte kultisch-biblische Begriffe. „Zusammen mit den Gebeten“ ist als kontextuelle Wiedergabe der schwierigen Dativverbindung vertretbar, sofern die Fußnote die wörtlichere, elliptische Form transparent bewahrt.
