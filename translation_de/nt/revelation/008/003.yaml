id: REV.8.3
reference: Revelation 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: de
  text: Und ein anderer Engel kam und stellte sich an den Altar, mit einem goldenen Räuchergefäß. Ihm wurde viel Räucherwerk gegeben, damit er es zusammen mit den Gebeten aller Heiligen auf dem goldenen Altar vor dem Thron darbringe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „damit er den Gebeten aller Heiligen gebe“; „das Räucherwerk“ ist aus dem Zusammenhang zu ergänzen. Gemeint sein kann, dass das Räucherwerk zusammen mit den Gebeten dargebracht oder ihnen hinzugefügt wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: ein anderer Engel
  rationale: ἄλλος bezeichnet einen weiteren Engel in der Abfolge, nicht ein Wesen anderer Art.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: trat an den Altar
  rationale: Die Wendung beschreibt, dass der Engel seinen Platz am Altar einnimmt; „an den Altar“ vermeidet den irreführenden Eindruck, er stehe darauf.
- source_word: λιβανωτὸν χρυσοῦν
  choice: ein goldenes Räuchergefäß
  rationale: λιβανωτός bezeichnet hier ein Gefäß zum Räuchern. „Räuchergefäß“ ist im modernen Deutsch klarer und natürlicher als das fachsprachliche „Räucherfass“.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: Ihm wurde viel Räucherwerk gegeben
  rationale: θυμιάματα bezeichnet Räucherstoffe beziehungsweise Räucherwerk; die Passivform des Griechischen bleibt erhalten.
- source_word: ἵνα δώσει
  choice: damit er es … darbringe
  rationale: Im kultischen Zusammenhang bedeutet δίδωμι ein Darbringen beziehungsweise Darreichen. Der Konjunktiv „darbringe“ gibt den Zweck der ἵνα-Konstruktion würdig und präzise wieder.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: zusammen mit den Gebeten aller Heiligen
  rationale: Der Dativ ist syntaktisch knapp und mehrdeutig. „Zusammen mit“ gibt die naheliegende Begleitung oder Verbindung des Räucherwerks mit den Gebeten wieder, ohne eine weitergehende Lehre einzutragen.
- source_word: ἅγιοι
  choice: Heilige
  rationale: „Heilige“ ist die etablierte, knappe Bezeichnung für Gottes geheiligtes Volk und bewahrt die biblische Ausdrucksweise.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: auf dem goldenen Altar
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung beziehungsweise Ausrichtung auf den Altar, auf dem das Räucherwerk dargebracht wird.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: vor dem Thron
  rationale: Die Formulierung gibt die räumliche Beziehung natürlich und genau wieder.
theological_decisions:
- issue: Verhältnis des Räucherwerks zu den Gebeten der Heiligen
  choice: Das Räucherwerk wird zusammen mit den Gebeten aller Heiligen dargebracht.
  alternative: 'Wörtlicher: Es wird den Gebeten aller Heiligen gegeben beziehungsweise hinzugefügt.'
  rationale: Die griechische Dativkonstruktion ist verdichtet und lässt das genaue Verhältnis offen. Der Haupttext gibt die im kultischen Bild naheliegende Begleitung wieder; die Fußnote bewahrt die formale Mehrdeutigkeit und vermeidet es, eine ausgearbeitete Lehre von engelhafter Vermittlung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze entlasten die lange griechische Satzstruktur. Kultische Schlüsselbegriffe wie „Altar“, „Räucherwerk“ und „Heilige“ bleiben erhalten; die schwierige Dativkonstruktion wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
