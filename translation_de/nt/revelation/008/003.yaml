    rationale: Das direkte Objekt zu δώσει ist im griechischen Text nicht ausgedrückt; es wird aus dem Kontext als Räucherwerk erschlossen. Die Anmerkung sollte die Ellipse ausdrücklich ausweisen, statt „es“ als Bestandteil einer wörtlichen Wiedergabe erscheinen zu lassen.
