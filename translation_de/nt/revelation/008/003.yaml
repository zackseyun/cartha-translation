revisions:
- from: Und ein anderer Engel kam und trat an den Altar. Er hatte ein goldenes Räuchergefäß in der Hand. Ihm wurde viel Räucherwerk gegeben, damit er es zusammen mit den Gebeten aller Heiligen auf dem goldenen Altar vor dem Thron darbringe.[a]
  to: Und ein anderer Engel kam und stellte sich an den Altar, mit einem goldenen Räuchergefäß. Ihm wurde viel Räucherwerk gegeben, damit er es zusammen mit den Gebeten aller Heiligen auf dem goldenen Altar vor dem Thron darbringe.[a]
  rationale: Die Überarbeitung stellt die Wiedergabe von ἐστάθη genauer auf „stellte sich“ um und entfernt die nicht ausdrücklich im griechischen Text genannte Ergänzung „in der Hand“. Die Fußnote kennzeichnet nun korrekt die im griechischen Satz vorhandene Ellipse und bewahrt die syntaktische Offenheit des Verhältnisses von Räucherwerk und Gebeten.
