    rationale: Die Formulierung betont vor allem die Bewegung zum Altar. ἐστάθη bezeichnet hier das Sich-Hinstellen bzw. Stehen am Altar. „Stellte sich an den Altar“ wahrt beides und vermeidet zugleich die Vorstellung, der Engel stehe auf dem Altar.
  - severity: low
