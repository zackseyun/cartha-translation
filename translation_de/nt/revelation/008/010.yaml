reference: Revelation 8:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: de
  text: Und der dritte Engel blies die Posaune; und ein großer Stern[c] fiel vom Himmel[a], brennend wie eine Fackel[b], und er fiel auf ein Drittel der Flüsse und auf die Wasserquellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Zusammenhang den Himmel oder den sichtbaren Himmel bezeichnen; hier passt die visionäre Bedeutung »Himmel«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie eine Lampe«. Das griechische Wort kann eine Fackel oder Lampe bezeichnen; »Fackel« passt hier besonders zum Bild eines lodernd fallenden Sterns.'
    reason: lexical_alternative
  - marker: c
    text: Der »Stern« wird als Bild stehen gelassen. Umstritten ist, ob er ein Engelwesen, einen meteorartigen Himmelskörper oder eine symbolische Macht darstellt.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: blies die Posaune
  rationale: Das Verb bezeichnet das Blasen beziehungsweise Ertönenlassen einer Posaune. Die Formulierung ist im Deutschen natürlich und entspricht der wiederkehrenden Bildsprache der Offenbarung.
- source_word: ἀστὴρ μέγας
  choice: ein großer Stern
  rationale: Die Wiedergabe bleibt nah am griechischen Ausdruck und lässt offen, ob Größe, Eindruck oder Bedeutung im Vordergrund steht.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: οὐρανός kann Himmel oder Luftraum bezeichnen. »Vom Himmel« wahrt den visionär-apokalyptischen Ton und die lexikalische Offenheit.
- source_word: καιόμενος ὡς λαμπάς
  choice: der wie eine Fackel brannte
  rationale: καιόμενος bezeichnet ein Brennen; λαμπάς kann eine Fackel oder Lampe sein. »Fackel« passt anschaulich zu dem feurig fallenden Stern.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: fiel ... und er fiel
  rationale: Die Wiederholung des griechischen Verbs wird bewahrt, um Rhythmus und Nachdruck des Ausgangstextes wiederzugeben.
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: auf ein Drittel der Flüsse
  rationale: τὸ τρίτον bezeichnet in dieser Gerichtsfolge ein Drittel; die Formulierung ist präzise und idiomatisch.
- source_word: πηγὰς τῶν ὑδάτων
  choice: die Wasserquellen
  rationale: Das deutsche Kompositum gibt die griechische Genitivverbindung knapp, würdig und allgemeinverständlich wieder.
theological_decisions:
- issue: Bezug des fallenden Sterns
  choice: Wörtlich als »ein großer Stern« wiedergegeben, ohne seine Identität zu bestimmen.
  alternative: Ein Engelwesen, ein meteorartiger Himmelskörper oder eine symbolische Macht.
  rationale: Der Vers selbst deutet das Bild nicht ausdrücklich. Die Übersetzung bewahrt daher die Mehrdeutigkeit und nimmt keine theologische Identifizierung vor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wahrt die erzählerische Abfolge und die wiederholte Fallbewegung des griechischen Textes. »Posaune«, »Fackel« und »Wasserquellen« sind verständlich und zugleich dem apokalyptischen Register angemessen.
