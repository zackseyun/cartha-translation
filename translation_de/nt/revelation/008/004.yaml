id: REV.8.4
reference: Revelation 8:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: de
  text: Und der Rauch des Räucherwerks stieg zusammen mit den Gebeten der Heiligen aus der Hand des Engels vor Gott empor[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stieg auf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit den Gebeten der Heiligen“. Der Wortlaut verbindet den Rauch des Räucherwerks mit den Gebeten, setzt beides in diesem Vers aber nicht ausdrücklich gleich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: stieg … empor
  rationale: Das Aoristverb beschreibt eine Aufwärtsbewegung. „stieg … empor“ gibt das konkrete Bild natürlich und in einem der Offenbarung angemessenen Register wieder.
- source_word: καπνὸς
  choice: Rauch
  rationale: Die gewöhnliche konkrete Bedeutung „Rauch“ bewahrt die visionäre Bildsprache, ohne sie auszudeuten.
- source_word: τῶν θυμιαμάτων
  choice: des Räucherwerks
  rationale: θυμίαμα bezeichnet hier kultisches Räucherwerk. Der deutsche Sammelbegriff gibt den griechischen Plural idiomatisch wieder und passt zum Tempelbild.
- source_word: ταῖς προσευχαῖς
  choice: zusammen mit den Gebeten
  rationale: Der Dativ verbindet den Rauch mit den Gebeten, ohne die genaue Art dieser Beziehung festzulegen. „zusammen mit“ wahrt diese Zuordnung, ohne Gleichsetzung oder Zweckbeziehung zu behaupten.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: ἅγιοι ist eine geläufige neutestamentliche Bezeichnung für Gottes geheiligtes Volk. „die Heiligen“ bewahrt den biblischen Sprachgebrauch, ohne den Ausdruck auf später kanonisierte Einzelpersonen zu verengen.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: aus der Hand des Engels
  rationale: Die relativ formnahe Wiedergabe erhält das anschauliche Motiv, dass Rauch und Gebete aus der Hand des Engels aufsteigen.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: „vor Gott“ ist knapp und idiomatisch und bezeichnet Gottes Gegenwart, ohne den Ausdruck weiter auszulegen.
theological_decisions:
- issue: Verhältnis von Räucherwerk und Gebeten
  choice: Der Rauch steigt „zusammen mit den Gebeten“ empor; beide werden verbunden, aber nicht ausdrücklich gleichgesetzt.
  alternative: Der Rauch des Räucherwerks ist mit den Gebeten identisch oder steigt zugunsten der Gebete auf.
  rationale: Die griechische Dativkonstruktion stellt eine Verbindung her, bestimmt jedoch nicht ausdrücklich, ob das Räucherwerk die Gebete symbolisiert, begleitet oder trägt. Die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung von „die Heiligen“
  choice: Der traditionelle biblische Ausdruck „die Heiligen“ bleibt erhalten und bezeichnet hier Gottes geheiligtes Volk.
  alternative: „Gottes heiliges Volk“
  rationale: Die gewählte Form ist textnah und lässt den umfassenden neutestamentlichen Bezug bestehen, ohne eine spätere konfessionelle Bedeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem, der apokalyptischen Tempelszene angemessenem Klang. Die Satzstellung bleibt nahe am Griechischen, ist aber im Deutschen flüssig; „Räucherwerk“ und „die Heiligen“ erhalten die etablierte biblische Begrifflichkeit.
