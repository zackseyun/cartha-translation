source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: de
  text: Und die sieben Engel, die die sieben Posaunen hatten, machten sich bereit, die Posaunen zu blasen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Posaunen ertönen zu lassen“. Das griechische Verb bedeutet: „in die Posaune blasen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang bezeichnet das Wort hier himmlische Wesen; „Engel“ ist die natürliche und kontextgemäße Wiedergabe.
- source_word: ἔχοντες
  choice: die … hatten
  rationale: Das Partizip wird durch einen Relativsatz wiedergegeben. So bleibt die Zuordnung der sieben Posaunen zu den sieben Engeln klar und natürlich.
- source_word: σάλπιγγας
  choice: Posaunen
  rationale: „Posaunen“ ist die etablierte deutsche Bezeichnung für die kultisch und apokalyptisch geprägten Signalinstrumente; „Trompeten“ wäre möglich, hätte aber weniger biblische Bildtradition.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: machten sich bereit
  rationale: Die reflexive Selbstvorbereitung wird ausdrücklich bewahrt. Die Formulierung ist gegenwärtiges, würdiges Standarddeutsch.
- source_word: ἵνα σαλπίσωσιν
  choice: sie zu blasen
  rationale: Die Infinitivkonstruktion gibt den Zweck der Vorbereitung natürlich wieder. Das Pronomen bezieht sich eindeutig auf die sieben Posaunen; σαλπίζω bezeichnet das Blasen beziehungsweise Ertönenlassen einer Posaune.
theological_decisions:
- issue: Wesen der ἄγγελοι im apokalyptischen Zusammenhang
  choice: himmlische Engel
  alternative: menschliche Boten
  rationale: Die himmlische Szenerie und die Übergabe der sieben endzeitlichen Posaunen sprechen eindeutig für Engel. Darüber hinaus werden keine zusätzlichen Aussagen über ihr Wesen eingeführt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „sieben“ und die ausdrückliche reflexive Vorbereitung bleiben erhalten; die Zweckkonstruktion wird idiomatisch mit „zu“ wiedergegeben.
