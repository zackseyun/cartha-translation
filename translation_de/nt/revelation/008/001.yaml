id: REV.8.1
reference: Revelation 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: de
  text: Und als er das siebte Siegel öffnete[a], entstand im Himmel etwa eine halbe Stunde lang Stille.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das siebte Siegel aufbrach“. Wörtlich steht im Griechischen „öffnete“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „da war im Himmel etwa eine halbe Stunde lang Stille“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: als
  rationale: Obwohl ὅταν häufig „wenn/sooft“ bedeutet, bezeichnet es hier in der fortlaufenden Erzählung ein einmaliges vergangenes Geschehen. Das deutsche „als“ gibt diesen zeitlichen Bezug natürlich wieder.
- source_word: ἤνοιξεν
  choice: öffnete
  rationale: ἀνοίγω bedeutet schlicht „öffnen“. „Das Siegel öffnete“ wahrt die Ausdrucksweise des griechischen Textes, ohne den Vorgang als „Aufbrechen“ näher auszudeuten.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: das siebte Siegel
  rationale: σφραγίς wird im Zusammenhang der versiegelten Schriftrolle sachgerecht mit „Siegel“ wiedergegeben; das attributive Zahlwort bezeichnet eindeutig das siebte.
- source_word: ἐγένετο
  choice: entstand
  rationale: γίνομαι bezeichnet hier das Eintreten eines Zustands. „Entstand“ bildet diesen dynamischen Aspekt genauer ab als das bloße „war“, bleibt dabei aber natürlich.
- source_word: σιγή
  choice: Stille
  rationale: σιγή bezeichnet Schweigen beziehungsweise lautlose Ruhe. „Stille“ ist im Deutschen idiomatisch und bewahrt die feierlich-dramatische Wirkung.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: οὐρανός meint hier den himmlischen Bereich, nicht den sichtbaren Luftraum. „Im Himmel“ ist die natürliche deutsche Form.
- source_word: ὡς ἡμιώριον
  choice: etwa eine halbe Stunde lang
  rationale: ὡς kennzeichnet bei einer Zeitangabe eine Annäherung; ἡμιώριον bezeichnet eine halbe Stunde. „Lang“ macht die Dauer im Deutschen idiomatisch deutlich.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von ἤνοιξεν
  choice: „er“; der Bezug bleibt wie im griechischen Text unausgeführt
  alternative: „das Lamm“ ausdrücklich einsetzen
  rationale: Das Subjekt ist aus dem vorausgehenden Zusammenhang als das Lamm erkennbar. „Er“ ermöglicht einen vollständigen deutschen Satz, ohne die im Vers selbst nur implizite Identifizierung ausdrücklich einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die Wortstellung hält die zeitliche Abfolge und die dramatische Stille des Ausgangstextes fest.
