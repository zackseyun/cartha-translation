id: REV.10.3
reference: Revelation 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: de
  text: Und er rief mit lauter Stimme, wie ein Löwe brüllt. Und als er rief, ließen die sieben Donner ihre eigenen Stimmen hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sprachen mit ihren eigenen Stimmen“. Der griechische Wortlaut nennt ausdrücklich ihre „eigenen Stimmen“ und stellt die Donner als Sprechende dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: rief
  rationale: Das Verb bezeichnet einen kraftvollen, weithin hörbaren Ruf. „Rief“ bewahrt die Intensität, ohne wie „schrie“ unnötig Schmerz oder Angst anzudeuten.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die konkrete Wendung mit „Stimme“ wird beibehalten und nicht zum bloßen Adverb „laut“ verkürzt.
- source_word: ὥσπερ λέων μυκᾶται
  choice: wie ein Löwe brüllt
  rationale: Die Vergleichsform und das natürliche deutsche Verb für die Stimme eines Löwen bleiben erhalten.
- source_word: ὅτε
  choice: als
  rationale: „Als“ gibt den einmaligen zeitlichen Zusammenhang im Deutschen natürlich wieder, ohne eine weitergehende zeitliche oder ursächliche Aussage einzutragen.
- source_word: ἐλάλησαν
  choice: sprachen
  rationale: „Sprachen“ gibt die ausdrückliche Redehandlung wieder und bewahrt die Personifikation der Donner.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: die sieben Donner
  rationale: Die ungewöhnliche, aber für die Vision bedeutsame pluralische und bestimmte Bezeichnung wird wörtlich bewahrt.
- source_word: τὰς ἑαυτῶν φωνάς
  choice: mit ihren eigenen Stimmen
  rationale: Die Wiedergabe erhält sowohl den konkreten Begriff „Stimmen“ als auch die Hervorhebung durch das Reflexivpronomen ἑαυτῶν; die Präposition macht die Formulierung im Deutschen verständlich.
theological_decisions:
- issue: Personifikation der sieben Donner
  choice: „die sieben Donner … sprachen“
  alternative: „die sieben Donner ertönten“ oder „ließen ihre Stimmen hören“
  rationale: Der griechische Text schreibt den Donnern ausdrücklich ein Sprechen zu. Diese apokalyptische Personifikation wird nicht zu einem bloßen Geräusch abgeschwächt oder als Botschaft ausgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „rief“ entspricht dem griechischen Text; die leicht ungewöhnliche Wendung „sprachen … mit ihren eigenen Stimmen“ bewahrt bewusst dessen eindringliche Personifikation.
