id: REV.10.4
reference: Revelation 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: de
  text: 'Und als die sieben Donner gesprochen hatten, wollte ich gerade schreiben. Da hörte ich eine Stimme aus dem Himmel, die sagte: „Versiegle, was die sieben Donner gesprochen haben, und schreibe es[a] nicht auf.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schreibe sie nicht auf“; das griechische Pronomen steht im Plural und bezieht sich auf die Dinge, welche die sieben Donner gesprochen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: gesprochen hatten / gesprochen haben
  rationale: λαλέω bezeichnet hier das Sprechen. „Sprechen“ bewahrt die Personifizierung der sieben Donner und gibt den zeitlichen Bezug im ersten Satz natürlich deutsch wieder.
- source_word: αἱ ἑπτὰ βρονταί
  choice: die sieben Donner
  rationale: Der Plural entspricht dem griechischen Bild, in dem sieben Donner als sprechende Handlungsträger erscheinen. „Donnerschläge“ wäre konkreter, würde das Bild aber stärker ausdeuten.
- source_word: ἤμελλον γράφειν
  choice: wollte ich gerade schreiben
  rationale: μέλλω mit Infinitiv drückt hier eine unmittelbar bevorstehende Handlung aus. „Gerade“ macht deutlich, dass Johannes im Begriff war zu schreiben, als er unterbrochen wurde.
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: eine Stimme aus dem Himmel
  rationale: Die Formulierung gibt Herkunft und Unbestimmtheit der Stimme wieder, ohne ihre Identität näher festzulegen.
- source_word: Σφράγισον
  choice: Versiegle
  rationale: Der Imperativ bezeichnet eine entschiedene Aufforderung, den mitgeteilten Inhalt verschlossen beziehungsweise unveröffentlicht zu halten.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: was die sieben Donner gesprochen haben
  rationale: Das substantivisch gebrauchte neutrale Relativpronomen bezeichnet den Inhalt ihrer Rede. Die deutsche Formulierung ist nah am Griechischen und zugleich verständlich.
- source_word: μὴ αὐτὰ γράψῃς
  choice: schreibe es nicht auf
  rationale: „Aufschreiben“ ist im Deutschen die natürliche Bezeichnung für das schriftliche Festhalten. Das singularische „es“ nimmt idiomatisch den gesamten zuvor genannten Redeinhalt auf; der griechische Plural wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Identität der Stimme aus dem Himmel
  choice: eine Stimme aus dem Himmel
  alternative: Gottes Stimme aus dem Himmel
  rationale: Der griechische Text nennt nur Herkunft und Art der Wahrnehmung, identifiziert den Sprecher aber nicht ausdrücklich. Die Übersetzung lässt diese Offenheit bestehen.
- issue: Bedeutung des Versiegelns
  choice: Versiegle
  alternative: Halte geheim
  rationale: Das Bild des Versiegelns wird bewahrt, statt es ausschließlich als Geheimhaltung auszulegen. So bleibt die apokalyptische Bildsprache und ihre mögliche Bedeutungsbreite erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wollte ich gerade schreiben“ drückt die unmittelbar bevorstehende Handlung natürlich aus; „Versiegle“ erhält die prägnante apokalyptische Bildsprache. Die Wiederholung von „gesprochen“ folgt bewusst der Wiederholung im griechischen Text.
