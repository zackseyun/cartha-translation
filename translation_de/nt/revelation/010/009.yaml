id: REV.10.9
reference: Revelation 10:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: de
  text: 'Da ging ich zu dem Engel und sagte ihm, er solle mir die kleine Schriftrolle[a] geben. Und er sagt[b] zu mir: »Nimm sie und iss sie auf! Sie wird deinen Magen[c] bitter machen, aber in deinem Mund wird sie süß wie Honig sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das kleine Buch. Das griechische Wort ist eine Verkleinerungsform und kann eine kleine Schriftrolle oder ein Büchlein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Und er sagte zu mir. Im Griechischen steht zur lebendigen Vergegenwärtigung das historische Präsens.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: deinen Bauch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: ging ich zu dem Engel
  rationale: Die Wendung bezeichnet hier die Bewegung des Johannes auf den Engel zu. „Ging ... zu“ ist natürliches Deutsch und wahrt die räumliche Perspektive.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: sagte ihm, er solle mir ... geben
  rationale: Die indirekte Aufforderung gibt die Verbindung von Partizip und Infinitiv idiomatisch wieder, ohne sie als höfliche Bitte auszudeuten.
- source_word: βιβλαρίδιον
  choice: kleine Schriftrolle
  rationale: Das Diminutiv bezeichnet eine kleine Rolle oder ein Büchlein. „Schriftrolle“ passt zur antiken materiellen Form, während „kleine“ die diminutive Nuance bewahrt.
- source_word: λέγει μοι
  choice: er sagt zu mir
  rationale: Das historische Präsens des Griechischen bleibt erhalten und verleiht der Erzählung Unmittelbarkeit.
- source_word: Λάβε καὶ κατάφαγε αὐτό
  choice: Nimm sie und iss sie auf
  rationale: „Nimm“ gibt den Imperativ direkt wieder; „iss ... auf“ bringt die verstärkende Kraft des zusammengesetzten Verbs κατάφαγε in natürlichem Deutsch zum Ausdruck.
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: Sie wird deinen Magen bitter machen
  rationale: Im Zusammenhang mit Essen bezeichnet κοιλία konkret den Verdauungsbereich. Die kausative Bedeutung von πικραίνω wird mit „bitter machen“ transparent wiedergegeben.
- source_word: γλυκὺ ὡς μέλι
  choice: süß wie Honig
  rationale: Die geläufige deutsche Vergleichsformel bewahrt das Bild genau und natürlich.
theological_decisions:
- issue: Symbolisches Essen der Schriftrolle
  choice: Der konkrete Befehl „Nimm sie und iss sie auf“ bleibt ohne Deutung im Haupttext stehen.
  alternative: Das Essen erklärend als Verinnerlichung der göttlichen Botschaft wiedergeben.
  rationale: Der Text schildert eine prophetische Zeichenhandlung, erklärt ihre Bedeutung in diesem Vers aber nicht ausdrücklich. Eine deutende Ergänzung würde die Bildsprache und ihre theologische Spannung vorzeitig festlegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens wurde bewusst bewahrt. Die Pronomen beziehen sich grammatisch auf die feminine „Schriftrolle“.
