  rationale: Die einzige erforderliche Korrektur begrenzt „viele“ entsprechend der griechischen Grammatik auf „Könige“. Der übrige Wortlaut bleibt unverändert, da er Sinn, Offenheit des Sprecher-Subjekts und registergerechte Knappheit des Ausgangstextes wahrt.
