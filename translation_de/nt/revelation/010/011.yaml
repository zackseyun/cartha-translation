id: REV.10.11
reference: Revelation 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: de
  text: 'Und man sagt zu mir: „Du musst noch einmal über Völker, Nationen, Sprachen und viele Könige prophezeien.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν
  choice: man sagt
  rationale: Die dritte Person Plural hat hier ein nicht ausdrücklich genanntes Subjekt. Das unpersönliche „man“ bewahrt diese Offenheit natürlicher als ein ergänztes „sie“.
- source_word: Δεῖ σε
  choice: Du musst
  rationale: Gibt die durch δεῖ ausgedrückte Notwendigkeit klar und idiomatisch wieder.
- source_word: πάλιν
  choice: noch einmal
  rationale: Bezeichnet hier die erneute Ausübung des prophetischen Auftrags.
- source_word: προφητεῦσαι
  choice: prophezeien
  rationale: Bewahrt den ausdrücklichen prophetischen Charakter des Auftrags.
- source_word: ἐπὶ
  choice: über
  rationale: Im Zusammenhang mit dem Prophezeien bezeichnet ἐπί wahrscheinlich den Gegenstand beziehungsweise Adressatenkreis; „über“ lässt die genaue Beziehung hinreichend offen.
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: viele Völker, Nationen, Sprachen und Könige
  rationale: Bewahrt die viergliedrige Aufzählung und bezieht πολλοῖς entsprechend seiner Stellung und Reichweite natürlich auf die gesamte Reihe.
theological_decisions:
- issue: Nicht genanntes Subjekt von λέγουσίν
  choice: unpersönliches „man“
  alternative: „sie“
  rationale: Der griechische Text nennt die Sprechenden nicht ausdrücklich. Daher wird keine bestimmte himmlische Sprechergruppe ergänzt.
- issue: Bedeutung von ἐπί beim prophetischen Auftrag
  choice: „über“
  alternative: „vor“, „zu“ oder „gegen“
  rationale: „Über“ gibt den thematischen beziehungsweise adressatenbezogenen Bezug wieder, ohne die Prophetie einseitig als Verkündigung vor den Gruppen oder als Gerichtswort gegen sie festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp und nachdrücklich; die wiederholten Glieder der Aufzählung folgen dem feierlichen Rhythmus des Ausgangstextes.
