id: REV.10.6
reference: Revelation 10:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: de
  text: 'und schwor bei dem, der für immer und ewig lebt, der den Himmel und alles, was in ihm ist, die Erde und alles, was in ihr ist, und das Meer und alles, was in ihm ist, erschuf: Es wird keine Verzögerung mehr geben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es wird keine Zeit mehr geben.“ Im Zusammenhang ist χρόνος wahrscheinlich als „Verzögerung“ oder „Aufschub“ zu verstehen: Die Wartezeit bis zu Gottes abschließendem Handeln ist zu Ende.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: schwor
  rationale: Der Aorist von ὀμνύω bezeichnet das Ablegen eines Eides; „schwor“ ist im Deutschen knapp, natürlich und feierlich.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: bei dem, der für immer und ewig lebt
  rationale: Der Dativ nennt denjenigen, bei dem geschworen wird. Das substantivierte Partizip wird durch einen Relativsatz natürlich wiedergegeben; die feste Wendung bezeichnet unbegrenzte Dauer.
- source_word: ἔκτισεν
  choice: erschaffen hat
  rationale: κτίζω bezeichnet hier im kosmischen Schöpfungszusammenhang das Erschaffen. Das Perfekt ist im deutschen Relativsatz idiomatisch und stellt das vollendete Schöpfungswerk heraus, ohne die Aussage inhaltlich zu verändern.
- source_word: τὸν οὐρανὸν
  choice: den Himmel
  rationale: Im Schöpfungsdreiklang Himmel–Erde–Meer bezeichnet οὐρανός den kosmischen Himmel.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: alles darin / alles darauf
  rationale: Die substantivierten Präpositionalphrasen meinen jeweils den gesamten Inhalt. Bei der Erde entspricht „darauf“ dem natürlichen deutschen Sprachgebrauch, während Himmel und Meer „darin“ verlangen.
- source_word: γῆν
  choice: die Erde
  rationale: Im kosmischen Dreiklang ist γῆ die Erde, nicht ein begrenztes Landgebiet.
- source_word: θάλασσαν
  choice: das Meer
  rationale: „Meer“ entspricht dem Singular θάλασσα und bewahrt die Schöpfungsformel.
- source_word: ὅτι
  choice: Doppelpunkt vor dem Inhalt des Eides
  rationale: Nach dem Verb des Schwörens leitet ὅτι den Inhalt des Eides ein. Im Deutschen gibt ein Doppelpunkt diese syntaktische Funktion besonders natürlich wieder.
- source_word: χρόνος οὐκέτι ἔσται
  choice: Es wird keine Verzögerung mehr geben
  rationale: Im Zusammenhang mit der unmittelbar bevorstehenden Vollendung in Vers 7 bezeichnet χρόνος wahrscheinlich keinen Fortbestand von Zeit überhaupt, sondern einen weiteren Aufschub. Die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von χρόνος in der Eidesaussage
  choice: „keine Verzögerung mehr“ im Sinn eines endenden Aufschubs
  alternative: „Es wird keine Zeit mehr geben“
  rationale: Der folgende Vers kündigt die Vollendung von Gottes Geheimnis an und stützt daher den kontextuellen Sinn „Aufschub/Verzögerung“. Da χρόνος wörtlich „Zeit“ heißen kann und die Formulierung echte Mehrdeutigkeit besitzt, wird die traditionelle wörtliche Wiedergabe als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange feierliche Satzbau und der dreigliedrige Schöpfungskatalog bleiben erhalten; „sowie“ macht die letzte Einheit lesbar, ohne die Parallelität aufzulösen.
