revisions:
- from: 'und schwor bei dem, der für immer und ewig lebt, der den Himmel und alles darin, die Erde und alles darauf sowie das Meer und alles darin erschaffen hat: Es wird keine Verzögerung mehr geben.[a]'
  to: 'und schwor bei dem, der für immer und ewig lebt, der den Himmel und alles, was in ihm ist, die Erde und alles, was in ihr ist, und das Meer und alles, was in ihm ist, erschuf: Es wird keine Verzögerung mehr geben.[a]'
  rationale: Die Revision beschränkt sich auf den Ortsbezug bei der Erde und stellt die im Griechischen dreimal identische ἐν-Struktur im Deutschen konsistent als „in ihm/ihr“ dar. Der einheitliche Schöpfungskatalog wird zusätzlich durch die parallele Stellung von „und“ klarer abgebildet. Die kontextuelle Übersetzung von χρόνος und ihre alternative, wörtlichere Lesart bleiben erhalten.
