id: REV.10.5
reference: Revelation 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: de
  text: Und der Engel, den ich auf dem Meer und auf dem Land[a] stehen sah, hob seine rechte Hand zum Himmel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Erde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Richtung Himmel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: Engel
  rationale: Im Kontext der Offenbarung ist ein himmlisches Wesen gemeint; „Engel“ ist daher genauer und natürlicher als das allgemeinere „Bote“.
- source_word: ἑστῶτα
  choice: stehen
  rationale: Das Perfektpartizip beschreibt den gegenwärtigen Zustand beziehungsweise die Haltung des Engels. In der Verbindung mit „sah“ ist „stehen sah“ natürliches Deutsch.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: auf dem Meer
  rationale: ἐπί mit Genitiv bezeichnet hier die Position; „auf dem Meer“ bewahrt das eindrückliche Bild des griechischen Textes.
- source_word: ἐπὶ τῆς γῆς
  choice: auf dem Land
  rationale: γῆ kann „Erde“, „Boden“ oder „Land“ bedeuten. Im unmittelbaren Gegensatz zum Meer gibt „Land“ die räumliche Gegenüberstellung am klarsten wieder.
- source_word: ἦρεν
  choice: hob
  rationale: αἴρω bedeutet hier „heben“ beziehungsweise „emporheben“. „hob“ ist knapp, würdig und passt zur Schwurgeste.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: seine rechte Hand
  rationale: Die idiomatische deutsche Form bewahrt sowohl die ausdrückliche Nennung der Hand als auch ihre Bestimmung als rechte Hand.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel
  rationale: εἰς drückt die Richtung aus. Im Zusammenhang der folgenden Schwurformel wahrt „Himmel“ den theologischen Gehalt besser als „Himmelsraum“ oder „Himmelshöhe“.
theological_decisions:
- issue: Wiedergabe von γῆ im Gegensatz zu θάλασσα
  choice: Land
  alternative: Erde
  rationale: Die Szene stellt zwei räumliche Bereiche, Meer und Land, einander gegenüber. „Land“ bewahrt diesen sichtbaren Kontrast, ohne dem Vers eine weitergehende kosmologische Aussage aufzuerlegen.
- issue: Wiedergabe von οὐρανός
  choice: Himmel
  alternative: Himmelsraum
  rationale: Die Geste leitet den Schwur beim ewigen Schöpfer im folgenden Vers ein. „Himmel“ erhält diesen theologischen Klang und gibt zugleich die Richtung der Bewegung wieder.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung folgt natürlichem Deutsch, während das visionäre Bild und die Richtungsangabe des griechischen Textes erhalten bleiben.
