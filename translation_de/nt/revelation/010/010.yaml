source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: de
  text: Und ich nahm die kleine Schriftrolle[a] aus der Hand des Engels und aß sie; in meinem Mund war sie süß wie Honig, und als ich sie gegessen hatte, wurde mein Magen[b] bitter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das kleine Buch“. Das griechische Wort ist eine Verkleinerungsform und kann ein kleines Schriftstück bezeichnen; „kleine Schriftrolle“ entspricht wahrscheinlich am ehesten der antiken Form eines solchen Dokuments.
    reason: lexical_alternative
  - marker: b
    text: Oder „mein Bauch“.
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: kleine Schriftrolle
  rationale: Die Verkleinerungsform bezeichnet ein kleines Schriftstück; „Schriftrolle“ entspricht am ehesten der wahrscheinlichen antiken Form und vermeidet das anachronistisch wirkende „Büchlein“.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: aus der Hand des Engels
  rationale: Die Wendung bewahrt das anschauliche Bild der unmittelbaren Entgegennahme.
- source_word: κατέφαγον
  choice: aß sie
  rationale: Das schlichte „aß“ gibt die Handlung natürlich wieder; „verschlang“ könnte die mögliche Verstärkung des Kompositums im Deutschen überbetonen.
- source_word: ὡς μέλι γλυκύ
  choice: süß wie Honig
  rationale: Diese idiomatische Formulierung bewahrt den Vergleich des griechischen Textes.
- source_word: ὅτε ἔφαγον αὐτό
  choice: als ich sie gegessen hatte
  rationale: Das Plusquamperfekt macht die erzählte Abfolge im Deutschen klar, ohne dem griechischen Aorist eine zusätzliche Bedeutungsnuance zuzuschreiben.
- source_word: ἐπικράνθη
  choice: wurde … bitter
  rationale: Die Formulierung wahrt die passive Gestalt des griechischen Verbs und klingt im Zusammenhang natürlich.
- source_word: κοιλία
  choice: Magen
  rationale: „Magen“ ist im modernen Standarddeutsch klar und passt zum körperlichen Sinn; „Bauch“ bleibt als mögliche weitere Wiedergabe erhalten.
theological_decisions:
- issue: Symbolische Handlung des Essens der Schriftrolle
  choice: Das Bild wird ohne deutende Erweiterung wiedergegeben.
  alternative: Süße und Bitterkeit bereits in der Übersetzung ausdrücklich als Freude und Gericht auslegen.
  rationale: Der Vers erklärt die Bedeutung des prophetischen Bildes nicht vollständig. Die Übersetzung bewahrt daher seine Spannung, statt eine bestimmte Auslegung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz ist zur besseren Lesbarkeit in zwei Sätze gegliedert; „doch“ macht den im Kontext liegenden Umschwung natürlich deutlich, ohne das Symbol auszulegen.
