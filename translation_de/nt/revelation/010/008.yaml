id: REV.10.8
reference: Revelation 10:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: de
  text: 'Und die Stimme, die ich aus dem Himmel gehört hatte, redete wieder mit mir und sagte: »Geh und nimm die Schriftrolle[a], die in der Hand des Engels geöffnet ist, der auf dem Meer und auf dem Land[b] steht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die kleine Schriftrolle«; in den benachbarten Versen steht eine Verkleinerungsform, hier jedoch βιβλίον, »Schriftrolle«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »auf der Erde« statt »auf dem Land«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: Stimme
  rationale: Im Zusammenhang bezeichnet φωνή eine redende Stimme aus dem Himmel, nicht nur ein Geräusch.
- source_word: πάλιν
  choice: wieder
  rationale: Das Wort kennzeichnet die erneute Anrede durch dieselbe himmlische Stimme.
- source_word: λαλοῦσαν μετ’ ἐμοῦ
  choice: redete ... mit mir
  rationale: Die Wendung mit μετά und Genitiv wird relational und zugleich idiomatisch als »mit mir reden« wiedergegeben.
- source_word: Ὕπαγε λάβε
  choice: Geh und nimm
  rationale: Die beiden Imperative werden als unmittelbarer, natürlicher Doppelbefehl wiedergegeben.
- source_word: βιβλίον
  choice: Schriftrolle
  rationale: Im antiken und visionären Kontext ist eine Rolle gemeint; der Vers verwendet βιβλίον und nicht die in benachbarten Versen vorkommende Verkleinerungsform.
- source_word: ἠνεῳγμένον
  choice: geöffnet ... liegt
  rationale: Das Perfektpartizip beschreibt den fortbestehenden Zustand nach dem Öffnen; »geöffnet ... liegt« verbindet diesen Zustand natürlich mit der Ortsangabe in der Hand.
- source_word: ἐν τῇ χειρὶ
  choice: in der Hand
  rationale: Die Ortsangabe mit ἐν wird wörtlich bewahrt; dass Johannes die Rolle aus der Hand nehmen soll, ergibt sich aus dem Befehl.
- source_word: ἄγγελος
  choice: Engel
  rationale: Im visionären Zusammenhang der Offenbarung ist ein himmlisches Wesen gemeint.
- source_word: ἑστῶτος
  choice: steht
  rationale: Das Partizip bezeichnet den andauernden Zustand des Stehens.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: auf dem Meer und auf dem Land
  rationale: In der räumlichen Gegenüberstellung zum Meer bezeichnet γῆ am natürlichsten das Land; die Wiederholung von »auf« bildet die griechische Struktur ab.
theological_decisions:
- issue: Bedeutung von γῆ im apokalyptischen Bild
  choice: Land
  alternative: Erde
  rationale: Das unmittelbare Bild beschreibt den Standort des Engels auf Meer und festem Land, ohne eine weitergehende kosmologische Deutung festzulegen.
- issue: Bezug von βιβλίον zum unmittelbaren Kontext
  choice: Schriftrolle
  alternative: kleine Schriftrolle
  rationale: Der vorliegende Vers hat βιβλίον ohne Verkleinerungsform. Die kontextuell mögliche Nuance »kleine Schriftrolle« wird daher nicht harmonisierend in den Haupttext aufgenommen, sondern als Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt die feierliche Wiederaufnahme der himmlischen Stimme, bleibt aber gut verständlich. Die Fußnotenmarker stehen gesammelt nach dem Satz, da sie Alternativen zu zwei Ausdrücken innerhalb desselben Verses erläutern.
