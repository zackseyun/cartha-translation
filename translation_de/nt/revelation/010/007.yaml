source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: de
  text: sondern in den Tagen, in denen der siebte Engel seine Stimme erhebt, wenn er im Begriff ist, die Posaune zu blasen, wird das Geheimnis Gottes vollendet sein, wie er seinen eigenen Sklaven[a], den Propheten, die gute Botschaft verkündet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Dienern“. Das griechische Wort bezeichnet Menschen, die einem Herrn gehören und ihm dienen; „Sklaven“ hebt hier zusammen mit „seinen eigenen“ besonders die Zugehörigkeit zu Gott hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: sondern
  rationale: Der starke Gegensatz knüpft an die vorherige Aussage an, dass es keinen Aufschub mehr geben wird. Im Deutschen gibt „sondern“ diese Korrektur bzw. Gegenüberstellung prägnant wieder.
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: in den Tagen, wenn die Stimme des siebten Engels ertönt
  rationale: „In den Tagen“ bewahrt die apokalyptische Zeitangabe. Das ergänzte „ertönt“ macht die Genitivfügung im Deutschen verständlich, ohne φωνή vorschnell mit dem Posaunenblasen gleichzusetzen.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: wenn er im Begriff ist, die Posaune zu blasen
  rationale: μέλλῃ mit Infinitiv bezeichnet das unmittelbar bevorstehende Handeln. „Die Posaune blasen“ ist die natürliche deutsche Wiedergabe des kontextuell eindeutigen σαλπίζειν.
- source_word: καὶ ἐτελέσθη
  choice: wird auch … vollendet sein
  rationale: Der griechische Aorist steht innerhalb einer futurisch ausgerichteten ὅταν-Konstruktion und stellt das Geschehen als abgeschlossen dar. Das deutsche Futur II gibt diesen Zukunftsbezug und den Vollendungsaspekt natürlich wieder; „auch“ entspricht καί.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: das Geheimnis Gottes
  rationale: „Geheimnis“ bewahrt den etablierten biblisch-theologischen Begriff für Gottes zuvor verborgenen und bekannt gemachten Plan, ohne ihn erklärend einzuengen.
- source_word: ὡς εὐηγγέλισεν
  choice: wie er es … als gute Botschaft verkündet hat
  rationale: Die Formulierung bewahrt den Gute-Botschaft-Sinn von εὐαγγελίζω. Das Pronomen „es“ nimmt idiomatisch das Geheimnis bzw. dessen Vollendung als Inhalt der Verkündigung auf.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: seinen eigenen Sklaven
  rationale: „Sklaven“ gibt die rechtlich-soziale Grundbedeutung von δοῦλοι und den durch ἑαυτοῦ betonten Zugehörigkeitsaspekt deutlich wieder. Eine geläufigere, aber semantisch abgeschwächte Alternative wird in der Fußnote genannt.
- source_word: τοὺς προφήτας
  choice: den Propheten
  rationale: Die Apposition bezeichnet die zuvor genannten Sklaven näher und bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Zeitform und Bedeutung von ἐτελέσθη im futurischen Kontext
  choice: wird … vollendet sein
  alternative: wird … erfüllt; wurde … vollendet
  rationale: Obwohl ἐτελέσθη formal Aorist ist, wird es durch die zeitlich-futurische ὅταν-Konstruktion auf das bevorstehende Handeln des siebten Engels bezogen. Das Futur II bewahrt die als vollendet betrachtete Handlung, ohne ein bestimmtes endzeitliches System festzulegen.
- issue: Wiedergabe von δοῦλος für Gottes Propheten
  choice: Sklaven
  alternative: Diener
  rationale: ἑαυτοῦ hebt hervor, dass sie Gott gehören. „Sklaven“ erhält diese Spannung und den stärkeren Statusbegriff; „Diener“ ist im heutigen Deutsch natürlicher, schwächt aber den Eigentums- und Bindungsaspekt ab.
- issue: Inhalt des göttlichen Geheimnisses
  choice: Geheimnis Gottes
  alternative: Gottes verborgener Plan
  rationale: Die knappe Formulierung lässt offen, welche Aspekte des göttlichen Vorhabens genau gemeint sind, und vermeidet eine konfessionelle oder systematische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltenem apokalyptischem Ausdruck „in den Tagen“. „Im Begriff ist“ bildet die unmittelbar bevorstehende Handlung präzise ab. Die syntaktische Glättung „wenn … ertönt“ vermeidet die im Deutschen schwer verständliche wörtliche Wendung „Tage der Stimme“.
