  to: sondern in den Tagen, in denen der siebte Engel seine Stimme erhebt, wenn er im Begriff ist, die Posaune zu blasen, wird das Geheimnis Gottes vollendet sein, wie er seinen eigenen Sklaven[a], den Propheten, die gute Botschaft verkündet hat.
