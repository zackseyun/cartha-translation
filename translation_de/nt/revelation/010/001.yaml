id: REV.10.1
reference: Revelation 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: de
  text: Und ich sah einen anderen mächtigen Engel aus dem Himmel herabkommen. Er war mit einer Wolke bekleidet, über seinem Kopf war der Regenbogen[a], sein Gesicht war wie die Sonne und seine Füße waren wie Feuersäulen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Strahlenkranz«. Das griechische Wort bedeutet gewöhnlich »Regenbogen« und wird auch in Offenbarung 4,3 so verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: einen anderen … Engel
  rationale: ἄγγελος kann »Engel« oder »Bote« bedeuten; im visionären Zusammenhang und wegen des Herabkommens aus dem Himmel ist »Engel« die natürliche Wiedergabe.
- source_word: ἰσχυρὸν
  choice: mächtigen
  rationale: »Mächtig« bezeichnet hier außergewöhnliche Kraft und entspricht dem würdevollen apokalyptischen Stil.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel herabkommen
  rationale: Die Form beschreibt anschaulich eine Abwärtsbewegung mit dem Himmel als Ausgangspunkt.
- source_word: περιβεβλημένον νεφέλην
  choice: mit einer Wolke bekleidet
  rationale: Die Wiedergabe bewahrt die Gewandmetapher und zugleich die Vorstellung, dass die Gestalt von einer Wolke umgeben ist.
- source_word: ἡ ἶρις
  choice: der Regenbogen
  rationale: ἶρις bezeichnet gewöhnlich einen Regenbogen; diese Bedeutung passt auch zur Bildwelt der Offenbarung, besonders zu 4,3.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: über seinem Kopf
  rationale: Die Präpositionalfügung beschreibt hier die Lage des Regenbogens oberhalb des Kopfes.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: sein Gesicht war wie die Sonne
  rationale: Das im Griechischen ausgelassene Verb wird für natürliches Deutsch ergänzt; der Vergleich bleibt unverändert.
- source_word: οἱ πόδες αὐτοῦ
  choice: seine Füße
  rationale: πούς bedeutet primär »Fuß«; die übliche konkrete Wiedergabe wahrt das Bild.
- source_word: στῦλοι πυρός
  choice: Feuersäulen
  rationale: Das deutsche Kompositum gibt die Genitivverbindung knapp und bildkräftig wieder.
theological_decisions:
- issue: Identität des mächtigen Engels
  choice: Die Gestalt wird neutral als »ein anderer mächtiger Engel« bezeichnet.
  alternative: Sie ausdrücklich als geschaffenes Engelwesen oder als Erscheinung Christi identifizieren.
  rationale: Der griechische Text selbst entscheidet die umstrittene Identitätsfrage nicht; die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bildhaftem Ton. Die Satzteilung erleichtert das Lesen, ohne die fortlaufende Vision oder ihre parallelen Bildelemente aufzulösen.
