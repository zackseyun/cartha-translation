id: REV.10.2
reference: Revelation 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: de
  text: und hielt in seiner Hand eine kleine Schriftrolle, die geöffnet war.[a] Er stellte seinen rechten Fuß auf das Meer und den linken auf das Land.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein kleines Buch, das geöffnet war“. Das griechische Wort bezeichnet eine kleine Schriftrolle oder ein Büchlein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf die Erde“. Das griechische Wort kann „Land“ oder „Erde“ bedeuten; hier entspricht „Land“ dem Gegensatz zum Meer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: hielt
  rationale: Das Präsenspartizip bezieht sich auf den mächtigen Engel aus Vers 1. Im Deutschen gibt die finite Form „hielt“ den fortlaufenden Satzanschluss natürlich wieder.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: in seiner Hand
  rationale: Bewahrt die ausdrücklich singularische Form und entspricht der räumlichen Formulierung des Griechischen.
- source_word: βιβλαρίδιον
  choice: eine kleine Schriftrolle
  rationale: Das Diminutiv bezeichnet eine kleine Rolle beziehungsweise ein Büchlein. „Schriftrolle“ erhält das antike Bild und vermeidet die moderne Vorstellung eines gebundenen Buches.
- source_word: ἠνεῳγμένον
  choice: die geöffnet war
  rationale: Das Perfektpartizip Passiv bezeichnet eine vollzogene Öffnung mit fortbestehendem Ergebnis; der Relativsatz bringt diesen Zustand im Deutschen klar zum Ausdruck.
- source_word: ἔθηκεν
  choice: stellte
  rationale: Bei einem Fuß bezeichnet τίθημι hier das bewusste Aufsetzen beziehungsweise Platzieren; „stellte seinen Fuß auf“ klingt würdig und natürlich.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιόν
  choice: seinen rechten Fuß
  rationale: Direkte und idiomatische Wiedergabe der griechischen Wortgruppe.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: auf das Meer
  rationale: Die deutsche Richtungsangabe mit Akkusativ passt zur Handlung des Aufstellens und bewahrt das visionäre Bild.
- source_word: τὸν δὲ εὐώνυμον
  choice: und den linken
  rationale: Das wiederholte Substantiv „Fuß“ kann im parallelen deutschen Satz natürlich ausgelassen werden; δέ markiert hier den ergänzenden Kontrast.
- source_word: ἐπὶ τῆς γῆς
  choice: auf das Land
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. Im unmittelbaren Gegensatz zum Meer bezeichnet „Land“ am klarsten den festen Bereich.
theological_decisions:
- issue: Bedeutung von γῆ im Gegensatz zu θάλασσα
  choice: Land
  alternative: Erde
  rationale: Die Vision schildert den Stand des Engels mit je einem Fuß auf Meer und festem Land. „Land“ wahrt den unmittelbaren räumlichen Gegensatz, ohne eine umfassendere kosmologische Deutung auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der partizipiale Anschluss an Vers 1 wird mit „und hielt“ natürlich fortgeführt. Die Fußnoten bewahren die echten lexikalischen Alternativen bei βιβλαρίδιον und γῆ.
