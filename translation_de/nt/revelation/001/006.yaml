id: REV.1.6
reference: Revelation 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: de
  text: und machte uns zu einem Königreich[a], zu Priestern für seinen Gott und Vater – ihm sei die Herrlichkeit und die Herrschaft für immer und ewig[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige spätere Handschriften lesen »zu Königen und Priestern« statt »zu einem Königreich, zu Priestern«.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: »in die Zeitalter der Zeitalter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: machte
  rationale: Der Aorist wird im Zusammenhang der fortlaufenden Aussage aus Vers 5 schlicht mit dem Präteritum wiedergegeben; ein Perfekt wäre möglich, würde aber das fortdauernde Ergebnis stärker hervorheben.
- source_word: βασιλείαν
  choice: zu einem Königreich
  rationale: Das griechische Substantiv bezeichnet hier ein Königreich beziehungsweise eine Königsherrschaft, nicht »Könige«. Die Formulierung bewahrt zudem den gemeinschaftlichen Charakter der Aussage.
- source_word: ἱερεῖς
  choice: zu Priestern
  rationale: Die direkte kultische und bundestheologische Bezeichnung wird beibehalten; die Apposition erklärt, wozu die Gemeinschaft gemacht wurde.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: für seinen Gott und Vater
  rationale: '»Für« gibt die Ausrichtung ihres priesterlichen Dienstes natürlich wieder. Das Pronomen wird auf beide verbundenen Bezeichnungen bezogen: Er ist sein Gott und sein Vater.'
- source_word: αὐτῷ
  choice: ihm sei
  rationale: Die verblose griechische Doxologie wird mit der im Deutschen natürlichen Wunsch- und Huldigungsformel wiedergegeben.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: Dies ist die geläufige und sachlich angemessene Wiedergabe in einer Doxologie.
- source_word: κράτος
  choice: Herrschaft
  rationale: Das Wort bezeichnet wirksame, souveräne Macht; »Herrschaft« bewahrt hier den Aspekt regierender Macht deutlicher als das allgemeinere »Kraft«.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die feste Wendung drückt unbegrenzte Dauer aus und wird in natürlichem, würdigem Deutsch wiedergegeben; die wörtlichere Form steht in der Fußnote.
- source_word: ἀμήν
  choice: Amen
  rationale: Die eingebürgerte liturgische Bekräftigung wird unverändert übernommen.
theological_decisions:
- issue: Bezug von »seinen Gott und Vater«
  choice: Das Possessivpronomen bezieht sich auf Jesus Christus; die Glaubenden werden zu Priestern für den Gott und Vater Jesu gemacht.
  alternative: Die Wendung glättend als »für Gott, seinen Vater« wiederzugeben.
  rationale: Der unmittelbare Zusammenhang nennt Jesus Christus. Die Übersetzung bewahrt die relationale und christologische Spannung des griechischen Wortlauts, ohne sie dogmatisch zu glätten.
- issue: Status der Gemeinschaft
  choice: »ein Königreich, … Priester«
  alternative: »Könige und Priester«
  rationale: Der vorgelegte griechische Text hat βασιλείαν, ἱερεῖς und bezeichnet die Erlösten gemeinschaftlich als Königreich sowie als Priester. Die bekannte abweichende Lesart wird nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Fortsetzung des vorausgehenden Zusammenhangs mit »und« erhalten. Der Gedankenstrich markiert den Übergang von der Aussage über die Glaubenden zur Doxologie.
