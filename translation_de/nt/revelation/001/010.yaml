source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: de
  text: Am Tag des Herrn[a] war ich im Geist[b] und hörte hinter mir eine laute Stimme wie eine Posaune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „am Herrentag“. Im Griechischen steht hier κυριακῇ ἡμέρᾳ („der dem Herrn gehörende Tag“), nicht die sonst üblichere Wendung für den endzeitlichen „Tag des Herrn“.'
    reason: alternative_reading
  - marker: b
    text: Die Wendung kann prophetisches Wirken des Heiligen Geistes bezeichnen; ausdrücklich von einer Trance spricht der Text nicht.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: kam ich
  rationale: Der Aorist von γίνομαι bezeichnet hier das Eintreten in einen Zustand. „Kam ich“ bewahrt diesen ingressiven Aspekt natürlicher als „war ich“, ohne einen ausdrücklich nicht genannten Trancezustand einzutragen.
- source_word: ἐν πνεύματι
  choice: in den Geist
  rationale: Die Wendung wird als Eintreten in den Wirkungsbereich des Geistes verstanden und bleibt nahe an der griechischen Präpositionalphrase. Die Großschreibung signalisiert den im Offenbarungskontext wahrscheinlichen Bezug auf den Heiligen Geist, ohne „in Trance“ hinzuzufügen.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: am Tag des Herrn
  rationale: κυριακός bedeutet „dem Herrn gehörig“. „Tag des Herrn“ ist im Deutschen die natürliche Wiedergabe, kann jedoch mit der eschatologischen Formel gleichlauten; eine Fußnote erläutert den Unterschied der griechischen Ausdrucksweise.
- source_word: ἤκουσα
  choice: hörte
  rationale: Das Verb bezeichnet hier schlicht die akustische Wahrnehmung, nicht ein bewusstes Zuhören.
- source_word: ὀπίσω μου
  choice: hinter mir
  rationale: Der räumliche Sinn entspricht dem Zusammenhang.
- source_word: φωνὴν μεγάλην
  choice: eine laute Stimme
  rationale: μέγας bezeichnet zusammen mit φωνή idiomatisch große Lautstärke oder Kraft; „laut“ ist die natürliche deutsche Wiedergabe.
- source_word: ὡς σάλπιγγος
  choice: wie eine Posaune
  rationale: σάλπιγξ bezeichnet das laute antike Blasinstrument. „Posaune“ ist die etablierte, würdige biblische Wiedergabe; „Posaunenstoß“ würde ein im Substantiv nicht ausdrücklich enthaltenes Element ergänzen.
theological_decisions:
- issue: Bezeichnet ἐν πνεύματι prophetische Wirkung des Heiligen Geistes, den menschlichen Geist oder ausdrücklich eine Trance?
  choice: in den Geist
  alternative: im Geist; in Trance
  rationale: Der Zusammenhang legt prophetische Inspiration durch den Heiligen Geist nahe, doch der griechische Wortlaut nennt keine Trance. Die Formulierung bewahrt diesen Spielraum; die Fußnote nennt die mögliche Wiedergabe „im Geist“.
- issue: Bezeichnet κυριακῇ ἡμέρᾳ den wöchentlichen Herrentag oder den eschatologischen Tag des Herrn?
  choice: am Tag des Herrn
  alternative: am Herrentag
  rationale: Die Übersetzung gibt die Zugehörigkeitsbedeutung von κυριακός wieder. Da dieselbe deutsche Formulierung eschatologisch verstanden werden kann, weist die Fußnote darauf hin, dass im Griechischen nicht die sonst übliche Wendung für den eschatologischen „Tag des Herrn“ steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung setzt die Zeitangabe voran und gibt den ingressiven Sinn von ἐγενόμην mit „kam ich“ wieder. „Posaune“ folgt dem etablierten deutschen Bibelwortschatz, bleibt aber allgemein verständlich. Die Fußnoten bewahren die sprachliche und theologische Mehrdeutigkeit.
