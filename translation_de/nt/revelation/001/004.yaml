  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: de
  text: Johannes an die sieben Gemeinden in der Provinz Asia:[a] Gnade und Frieden euch von dem, der ist und der war und der kommt,[b] und von den sieben Geistern, die vor seinem Thron sind,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asia bezeichnet hier die römische Provinz im Westen Kleinasiens, nicht den heutigen Kontinent Asien.
    reason: historical_geography
  - marker: b
    text: 'Auch: „von dem, der ist und der war und der kommen wird“. Wörtlicher gibt das Griechische den letzten Ausdruck mit „der kommt“ wieder.'
    reason: lexical_alternative
  - marker: c
    text: „Die sieben Geister“ können sinnbildlich die Fülle des Heiligen Geistes bezeichnen oder sieben himmlische Geister; der griechische Text selbst spricht von „sieben Geistern“.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: Johannes
  rationale: Die im Deutschen übliche Form des griechischen Personennamens.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: an die sieben Gemeinden
  rationale: Im frühchristlichen Briefkontext bezeichnet ἐκκλησία die örtliche Glaubensgemeinschaft; „Gemeinden“ ist im modernen Deutsch natürlich und präzise.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: in der Provinz Asia
  rationale: Gemeint ist die römische Provinz Asia, nicht der moderne Kontinent Asien. Die Erläuterung im Haupttext verhindert ein naheliegendes geografisches Missverständnis.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Gnade sei mit euch und Frieden
  rationale: Bewahrt die griechische Reihenfolge und gibt den elliptischen Segensgruß in natürlichem, würdevollem Deutsch wieder.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: von dem, der ist und der war und der kommt
  rationale: Gibt die feierliche göttliche Selbstbezeichnung wieder und bewahrt bei ὁ ἐρχόμενος die gegenwärtig-dynamische Aussage „der kommt“. Die grammatische Unregelmäßigkeit des Griechischen nach ἀπό lässt sich im Deutschen nicht direkt nachbilden.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: den sieben Geistern
  rationale: Der griechische Plural bleibt erhalten; eine Deutung als siebenfacher Heiliger Geist oder als sieben himmlische Geister wird nicht in den Haupttext eingetragen.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: die vor seinem Thron sind
  rationale: Das relative ἃ wird idiomatisch wiedergegeben, ohne die Identität oder Wesensart der Geister näher festzulegen.
theological_decisions:
- issue: Identität und Wiedergabe von ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: „dem, der ist und der war und der kommt“ als göttliche Selbstbezeichnung
  alternative: „dem, der ist und der war und der kommen wird“ beziehungsweise traditionell „der da ist und der da war und der da kommt“
  rationale: „Der kommt“ entspricht dem Präsenspartizip genauer als ein Futur und lässt den Titel in seiner feierlichen Spannung stehen.
- issue: Identität der sieben Geister
  choice: Wörtlicher Plural „die sieben Geister“ im Haupttext
  alternative: Symbol für die Fülle des Heiligen Geistes oder sieben himmlische Geister
  rationale: Der griechische Text entscheidet die umstrittene Identität nicht ausdrücklich; die Übersetzung soll diese theologische Offenheit bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit brieflicher Feierlichkeit. „Provinz Asia“ dient der historischen Klarheit; die markante dreigliedrige Gottesbezeichnung und der umstrittene Plural „sieben Geister“ bleiben bewusst erhalten.
