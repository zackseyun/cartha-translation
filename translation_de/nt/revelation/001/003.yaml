id: REV.1.3
reference: Revelation 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: de
  text: Glücklich zu preisen ist, wer vorliest[a], und ebenso alle, die die Worte dieser Prophetie hören und das bewahren, was darin geschrieben steht. Denn die Zeit[b] ist nahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer liest“. Das Griechische meint hier wahrscheinlich jemanden, der den Text in der versammelten Gemeinde laut vorliest.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die festgesetzte Zeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Glücklich zu preisen
  rationale: Die Wendung bewahrt den feierlichen Charakter einer biblischen Seligpreisung und bezeichnet göttlich zugesprochenes Heil, ohne es auf ein bloßes Glücksgefühl zu reduzieren.
- source_word: ὁ ἀναγινώσκων
  choice: wer vorliest
  rationale: Der einzelne Lesende steht mehreren Hörenden gegenüber; dies legt das öffentliche Vorlesen in der versammelten Gemeinde nahe. Eine Fußnote wahrt die allgemeinere lexikalische Möglichkeit.
- source_word: οἱ ἀκούοντες
  choice: alle, die … hören
  rationale: „Hören“ gibt ἀκούω direkt wieder und passt zum wahrscheinlichen Rahmen einer öffentlichen Lesung.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: die Worte dieser Prophetie
  rationale: „Worte“ erhält den konkreten Ausdruck λόγους; „Prophetie“ gibt die Gattung wieder, ohne sie auf Vorhersagen zu verengen. „Dieser“ verdeutlicht den Bezug auf die vorliegende prophetische Schrift.
- source_word: τηροῦντες
  choice: bewahren
  rationale: „Bewahren“ umfasst sowohl das Festhalten als auch das entsprechende Befolgen und vermeidet eine Verengung auf einzelne Gebote.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: was darin geschrieben steht
  rationale: Die idiomatische deutsche Form gibt das griechische Perfekt als fortbestehenden schriftlichen Bestand wieder; „darin“ bezieht sich auf die Prophetie.
- source_word: ὁ καιρός
  choice: die Zeit
  rationale: „Zeit“ lässt offen, ob καιρός hier ausdrücklich als festgesetzter Zeitpunkt verstanden werden soll; diese mögliche Nuance wird in der Fußnote genannt.
- source_word: ἐγγύς
  choice: ist nahe
  rationale: Die schlichte Formulierung bewahrt die zeitliche Nähebehauptung, ohne ein bestimmtes endzeitliches Deutungssystem einzutragen.
theological_decisions:
- issue: Vom Singular des Vorlesenden und Plural der Hörenden angedeutete öffentliche Lesung
  choice: „wer vorliest“
  alternative: „wer liest“
  rationale: Die grammatische Gegenüberstellung spricht wahrscheinlich für eine Lesung vor der Gemeinde. Die Übersetzung macht diesen wahrscheinlichen Rahmen sichtbar, während die Fußnote die allgemeinere Wiedergabe offenhält.
- issue: Bedeutung von τηροῦντες
  choice: „bewahren“
  alternative: „befolgen“ oder „sich daran halten“
  rationale: „Bewahren“ erhält die Spannung zwischen treuem Festhalten, Beachten und gehorsamem Tun, statt das Wort ausschließlich als Regelgehorsam auszulegen.
- issue: Eschatologische Aussage καιρός ἐγγύς
  choice: „die Zeit ist nahe“
  alternative: „die festgesetzte Zeit ist nahe“
  rationale: Der Text behauptet die Nähe der entscheidenden Zeit, legt aber keinen Ablauf oder Erfüllungszeitpunkt fest. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glücklich zu preisen“ nimmt die Sprache der Seligpreisung auf, bleibt aber verständlicher als das heute weniger gebräuchliche „selig“. Die Satzgestaltung bildet den einzelnen Vorlesenden und die mehreren Hörenden natürlich ab.
