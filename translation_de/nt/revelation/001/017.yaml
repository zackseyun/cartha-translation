source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: de
  text: 'Als ich ihn sah, fiel ich wie tot[a] zu seinen Füßen. Da legte er seine rechte Hand auf mich und sagte: „Fürchte dich nicht![b] Ich bin der Erste und der Letzte,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Toter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Habe keine Angst!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: Als ich ihn sah
  rationale: Das temporale „Als“ gibt ὅτε im Deutschen natürlich wieder. Das einleitende καί wird nicht eigens mit „und“ übersetzt, weil „Und als“ hier unnötig schwerfällig klänge; der erzählerische Anschluss bleibt durch den Satzverlauf gewahrt.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: fiel ich … zu seinen Füßen
  rationale: Die deutsche Wendung „jemandem zu Füßen fallen“ gibt die räumliche und körperliche Bewegung idiomatisch und anschaulich wieder.
- source_word: ὡς νεκρός
  choice: wie tot
  rationale: Die ausdrückliche Vergleichspartikel ὡς bleibt durch „wie“ erhalten. „Wie tot“ ist natürliches modernes Deutsch und behauptet nicht, Johannes sei tatsächlich gestorben.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: legte er seine rechte Hand auf mich
  rationale: „Legte … auf mich“ entspricht τίθημι mit ἐπί und bewahrt die ausdrücklich genannte rechte Hand.
- source_word: λέγων
  choice: und sagte
  rationale: Das begleitende Partizip wird in natürlichem Deutsch als koordinierte Redeeinleitung wiedergegeben.
- source_word: Μὴ φοβοῦ
  choice: Fürchte dich nicht
  rationale: Die gebräuchliche Wendung ist verständlich, würdevoll und gibt den verneinten Imperativ direkt wieder.
- source_word: ἐγώ εἰμι
  choice: Ich bin
  rationale: Die ausdrückliche Selbstbezeichnung wird knapp und unmittelbar bewahrt, ohne eine weitergehende Anspielung in die Formulierung hineinzulesen.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: der Erste und der Letzte
  rationale: Die substantivierten Adjektive mit Artikel fungieren als Selbstbezeichnungen. Die deutsche Großschreibung ergibt sich zugleich regelgemäß aus der Substantivierung.
theological_decisions:
- issue: Titelfunktion von ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: der Erste und der Letzte
  alternative: der erste und der letzte
  rationale: Die Artikel und der Kontext kennzeichnen die Ausdrücke als substantivierte Selbstbezeichnungen. Im Deutschen ist deshalb „der Erste und der Letzte“ sowohl grammatisch als auch sachlich angemessen, ohne die christologische Bedeutung über den Wortlaut hinaus auszudeuten.
- issue: Aussagekraft von ἐγώ εἰμι
  choice: Ich bin
  alternative: Ich bin es
  rationale: Hier leitet ἐγώ εἰμι die folgende Selbstbezeichnung ein. „Ich bin“ erhält diese Struktur und ihr Gewicht, ohne die Formulierung ausdrücklich als zusätzliche Gottesnamensanspielung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ führt die Reaktion Jesu flüssig weiter; „Fürchte dich nicht“ wahrt den feierlichen Offenbarungston, während die Fußnote eine alltagssprachlichere Entsprechung nennt. Das abschließende Komma zeigt, dass die Rede im folgenden Vers weitergeht.
