id: REV.1.15
reference: Revelation 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: de
  text: und seine Füße waren wie glänzendes Erz[a], als wäre es im Schmelzofen zum Glühen gebracht worden, und seine Stimme war wie das Rauschen vieler Wasser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der seltene Ausdruck bezeichnet möglicherweise eine besonders reine oder glühende Metalllegierung; auch „polierte Bronze“ oder „feines Messing“ sind möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wie die Stimme vieler Wasser“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: Füße
  rationale: Die direkte und im visionären Zusammenhang natürliche Entsprechung von πούς ist „Fuß“.
- source_word: ὅμοιοι
  choice: waren wie
  rationale: Die ergänzte Kopula ergibt einen natürlichen deutschen Satz und bewahrt den Vergleich.
- source_word: χαλκολιβάνῳ
  choice: glänzendes Erz
  rationale: Der seltene Ausdruck bezeichnet wahrscheinlich ein hell glänzendes, veredeltes Metall oder eine Metalllegierung; „Erz“ vermeidet eine ungesicherte genaue metallurgische Bestimmung.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: als wäre es im Schmelzofen zum Glühen gebracht worden
  rationale: κάμινος bezeichnet einen Ofen, besonders einen Schmelzofen; πυρόομαι kann das Erhitzen bis zum Glühen oder die Läuterung durch Feuer ausdrücken. Die Formulierung erhält das sichtbare Glühen der Vision, ohne eine technische Raffination eindeutig festzulegen.
- source_word: φωνή
  choice: Stimme
  rationale: Beim ersten Vorkommen bezeichnet φωνή die persönliche Stimme der Gestalt.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: wie das Rauschen gewaltiger Wassermassen
  rationale: Das zweite φωνή wird idiomatisch als „Rauschen“ wiedergegeben. „Gewaltige Wassermassen“ bewahrt die Größe und Macht des Bildes, ohne es auf Brandung oder einen Wasserfall einzuengen.
theological_decisions:
- issue: Wiedergabe des wiederholten φωνή im abschließenden Vergleich
  choice: seine Stimme war wie das Rauschen gewaltiger Wassermassen
  alternative: seine Stimme war wie die Stimme vieler Wasser
  rationale: Die idiomatische Wiedergabe vermittelt die überwältigende Majestät der Vision, während die Fußnote die auffällige Wiederholung und das traditionelle biblische Bild sichtbar hält.
- issue: Genaue Bestimmung von χαλκολίβανον
  choice: glänzendes Erz
  alternative: polierte Bronze; feines Messing; eine hell glänzende Metalllegierung
  rationale: Da der seltene Metallbegriff nicht sicher identifiziert werden kann, legt der Haupttext keine bestimmte Legierung fest; die Fußnote bewahrt die sachliche Unsicherheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache bleibt kraftvoll und verständlich; die beiden echten lexikalischen Unsicherheiten werden in Fußnoten offengelegt. Die Fußnotenmarker sind im Haupttext entsprechend ihrer Inhalte korrekt zugeordnet.
