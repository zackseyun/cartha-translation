  rationale: Die einzige sichere Verbesserung ist die Ersetzung der interpretierenden Verstärkung „gewaltiger“ durch „vieler“. Damit bleibt die Übersetzung idiomatisch, wahrt aber die offene und eindrückliche Bildsprache des griechischen πολλῶν. Alle übrigen Formulierungen und die Fußnoten können bestehen bleiben.
