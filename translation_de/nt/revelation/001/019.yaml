id: REV.1.19
reference: Revelation 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: de
  text: Schreibe also auf, was du gesehen hast, was ist und was nach diesen Dingen bevorsteht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was nach diesen Dingen geschehen wird“. Das Verb kann in manchen Zusammenhängen nahezu wie ein einfaches Futur gebraucht werden, bezeichnet jedoch häufig etwas, das bevorsteht.'
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: Schreibe … auf
  rationale: Der Aorist-Imperativ richtet einen unmittelbaren Schreibauftrag an Johannes. „Aufschreiben“ klingt im heutigen Deutsch natürlich und gibt den Sinn ohne zusätzliche Deutung wieder.
- source_word: οὖν
  choice: also
  rationale: „Also“ wahrt den folgernden beziehungsweise weiterführenden Anschluss an die vorausgehende Beauftragung und wirkt hier natürlicher als „daher“.
- source_word: ἃ εἶδες
  choice: was du gesehen hast
  rationale: Die Formulierung bezeichnet den bereits geschauten Inhalt der Vision und erhält durch das Perfekt dessen Bezug zum gegenwärtigen Auftrag.
- source_word: ἃ εἰσὶν
  choice: was ist
  rationale: Die knappe kollektive Wendung bildet den griechischen Ausdruck nach und lässt offen, welche gegenwärtigen Wirklichkeiten damit genau gemeint sind.
- source_word: μέλλει γίνεσθαι
  choice: bevorsteht
  rationale: „Bevorsteht“ gibt die häufige Bedeutung des Bevorstehenden oder unmittelbar Erwarteten idiomatisch wieder, ohne das Verb unnötig mit „bald“ zeitlich genauer festzulegen.
- source_word: μετὰ ταῦτα
  choice: nach diesen Dingen
  rationale: Die Wiedergabe bewahrt den Plural des Demonstrativpronomens und die in der Offenbarung wiederkehrende zeitliche Formulierung.
theological_decisions:
- issue: Zeitliche Aussage von μέλλει im apokalyptischen Zusammenhang
  choice: 'Mit dem Sinn des Bevorstehenden: „bevorsteht“'
  alternative: 'Als einfaches Futur: „geschehen wird“'
  rationale: μέλλω mit Infinitiv kann ein bevorstehendes Geschehen bezeichnen, in manchen Zusammenhängen aber nahezu wie ein einfaches Futur gebraucht werden. Der Haupttext bewahrt die zeitliche Spannung; die Fußnote nennt die weniger stark auf Unmittelbarkeit weisende Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Struktur des griechischen Satzes bleibt erhalten; „was ist“ wird bewusst nicht erläuternd erweitert. Der Fußnotenmarker steht bei der Wendung, auf die sich die sprachliche Alternative tatsächlich bezieht.
