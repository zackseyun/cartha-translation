id: REV.1.13
reference: Revelation 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: de
  text: und mitten unter den Leuchtern einen, der einem Menschensohn[a] glich, bekleidet mit einem bis zu den Füßen reichenden Gewand und um die Brust mit einem goldenen Gürtel gegürtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Menschensohn«. Die griechische Formulierung erinnert an Daniel 7,13 und wird hier auf den erhöhten Jesus bezogen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ τῶν λυχνιῶν
  choice: mitten unter den Leuchtern
  rationale: Gibt die räumliche Bedeutung idiomatisch und zugleich bildhaft wieder. λυχνία bezeichnet den Leuchter beziehungsweise Lampenständer, nicht die Lampe selbst.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: einen, der einem Menschensohn glich
  rationale: Bewahrt die artikellose Formulierung und den erkennbaren Anklang an Daniel 7,13, ohne sie im Haupttext ausdrücklich als feststehenden Titel wiederzugeben.
- source_word: ἐνδεδυμένον ποδήρη
  choice: bekleidet mit einem bis zu den Füßen reichenden Gewand
  rationale: Gibt den resultativen Zustand des Partizips und die wörtliche Bedeutung von ποδήρης klar und natürlich wieder.
- source_word: περιεζωσμένον πρὸς τοῖς μαστοῖς
  choice: um die Brust … gegürtet
  rationale: Bezeichnet verständlich die hohe Lage des Gürtels am Oberkörper und erhält das Kleidungsbild.
- source_word: ζώνην χρυσᾶν
  choice: mit einem goldenen Gürtel
  rationale: ζώνη kann Gürtel oder Schärpe bedeuten. „Gürtel“ ist im Deutschen natürlich, würdevoll und mit „gegürtet“ sprachlich stimmig.
theological_decisions:
- issue: Christologische Aussagekraft von ὅμοιον υἱὸν ἀνθρώπου
  choice: Im Haupttext „einem Menschensohn“, mit Hinweis auf die titular verstandene Wiedergabe in der Fußnote.
  alternative: „dem Menschensohn“
  rationale: Die gewählte Form spiegelt den fehlenden Artikel im Griechischen und wahrt zugleich die Spannung des Daniel-Anklangs. Die traditionelle christologische Deutung wird nicht ausgeschlossen, sondern als plausible Lesart kenntlich gemacht; im Zusammenhang ist die Gestalt der erhöhte Jesus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem visionärem Ton. Die Partizipialstruktur des griechischen Satzes bleibt erhalten, ohne im Deutschen unnötig altertümlich zu wirken.
