- from: 'Was das Geheimnis der sieben Sterne betrifft, die du auf meiner rechten Hand gesehen hast, und die sieben goldenen Leuchter: Die sieben Sterne sind die Engel[a] der sieben Gemeinden, und die sieben Leuchter sind die sieben Gemeinden.'
  to: 'Was das Geheimnis der sieben Sterne betrifft, die du in meiner rechten Hand gesehen hast, und das der sieben goldenen Leuchter: Die sieben Sterne sind die Engel[a] der sieben Gemeinden, und die sieben Leuchter sind die sieben Gemeinden.'
  rationale: Die Revision ersetzt die unnatürliche räumliche Formulierung durch „in meiner rechten Hand“ und glättet die Einleitung, sodass beide Visionselemente eindeutig vom „Geheimnis“ abhängen. Bedeutung, Register, Terminologie und die bewusst offene Deutung von ἄγγελοι bleiben erhalten.
