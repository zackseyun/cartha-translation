id: REV.1.20
reference: Revelation 1:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: de
  text: 'Was das Geheimnis der sieben Sterne betrifft, die du in meiner rechten Hand gesehen hast, und das der sieben goldenen Leuchter: Die sieben Sterne sind die Engel[a] der sieben Gemeinden, und die sieben Leuchter sind die sieben Gemeinden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Boten“. Das griechische Wort kann sowohl Engel als auch menschliche Boten bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Bewahrt den apokalyptisch-theologischen Begriff und bezeichnet hier die nun enthüllte Bedeutung des Visionsbildes, ohne ihn auf „Symbolik“ zu verengen.
- source_word: ἀστέρων / ἀστέρες
  choice: Sterne
  rationale: Gibt das konkrete Bild wörtlich wieder; seine Bedeutung wird anschließend im Vers selbst erklärt.
- source_word: οὓς εἶδες
  choice: die du ... gesehen hast
  rationale: Natürlicher deutscher Relativsatz, der sich auf die sieben Sterne bezieht.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: auf meiner rechten Hand
  rationale: Gibt ἐπί mit Genitiv räumlich präzise wieder und bewahrt das ungewöhnliche Visionsbild. „In meiner rechten Hand“ wäre im Deutschen idiomatischer, entspricht hier aber weniger unmittelbar der Präposition.
- source_word: λυχνίας
  choice: Leuchter
  rationale: Bezeichnet die Träger der Lampen, nicht die Lampen selbst, und entspricht dem konkreten Bild des Textes.
- source_word: χρυσᾶς
  choice: goldenen
  rationale: Knappes und natürliches deutsches Adjektiv für die Material- beziehungsweise Qualitätsangabe.
- source_word: ἄγγελοι
  choice: Engel
  rationale: In der Offenbarung bezeichnet ἄγγελος häufig himmlische Wesen. Da das Wort auch menschliche Boten meinen kann und der unmittelbare Text den Bezug nicht eindeutig festlegt, wird diese Möglichkeit in einer Fußnote bewahrt.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: Gemeinden
  rationale: Bezeichnet hier die sieben örtlichen christlichen Gemeinschaften und ist dafür im modernen Standarddeutsch natürlicher und genauer als „Kirchen“ oder „Versammlungen“.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Was das Geheimnis ... und ... betrifft:'
  rationale: Die griechische Konstruktion führt die beiden Visionselemente als Thema ein und erklärt sie danach. Diese deutsche Wendung bildet die Themenstellung natürlich ab, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes Prädikat wie „ist dies“ einzufügen.
theological_decisions:
- issue: Bezug von ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: Engel der sieben Gemeinden
  alternative: Boten der sieben Gemeinden
  rationale: ἄγγελος kann ein himmlisches Wesen oder einen menschlichen Boten bezeichnen. Weil in der Offenbarung der übernatürliche Sinn häufig ist, steht „Engel“ im Haupttext; die sachlich mögliche menschliche Deutung wird in der Fußnote genannt, damit die Spannung des Ausgangstextes erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Themenkonstruktion mit Doppelpunkt folgt der erklärenden Struktur des griechischen Textes. „Auf meiner rechten Hand“ bewahrt bewusst die räumliche Formulierung dieser Stelle, während „Gemeinden“ die örtlichen Adressatengruppen klar und konfessionell neutral bezeichnet.
