  source_fidelity: 'Die Übersetzung gibt die syntaktische Abfolge und die wesentlichen Aussagen des griechischen Textes zuverlässig wieder: der Aufmerksamkeitsruf, das anschauliche Präsens („er kommt“), die Wolkenbildsprache, „jedes Auge“, die Gruppe derer, die ihn durchbohrt haben, sowie die allgemeine Klage und die doppelte Bekräftigung. „Um ihn klagen“ ist eine angemessene, nicht überinterpretierende Wiedergabe von ἐπ’ αὐτόν.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „Sieh“ ist etwas direkter als das traditionelle „Siehe“, bleibt aber als einleitender Aufmerksamkeitsruf verständlich und stilistisch vertretbar. Die Satzteilung vor „Und alle Stämme“ ist flüssig und bewahrt die koordinierende Fortführung.
  terminology: „Wolken“, „jedes Auge“, „durchbohrt“, „Stämme der Erde“ und „Amen“ sind treffend gewählt. „Stämme“ bewahrt gegenüber dem allgemeineren „Völker“ die Spezifität von φυλαί. Die Fußnote erhält die begründete Mehrdeutigkeit von γῆ als „Erde“ oder „Land“, ohne sie im Haupttext dogmatisch aufzulösen.
