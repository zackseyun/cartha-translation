id: REV.1.7
reference: Revelation 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: de
  text: Sieh, er kommt mit den Wolken, und jedes Auge wird ihn sehen, auch die, die ihn durchbohrt haben. Und alle Stämme der Erde werden um ihn klagen.[a] Ja, Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und alle Stämme des Landes werden um ihn klagen.“ Die Formulierung kann Sacharja 12,10–12 aufgreifen; dort ist „Land“ vom Zusammenhang her möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf wird lebendig und in heutigem, würdigem Deutsch wiedergegeben; „Siehe“ wäre möglich, wirkt jedoch stärker traditionell geprägt.
- source_word: ἔρχεται
  choice: er kommt
  rationale: Das griechische Präsens mit bevorstehender bzw. zukünftiger Bedeutung bleibt als anschauliches Präsens erhalten.
- source_word: μετὰ τῶν νεφελῶν
  choice: mit den Wolken
  rationale: Bewahrt Artikel, Bildsprache und die Anspielung auf Daniel 7,13.
- source_word: ὄψεται
  choice: wird … sehen
  rationale: Gibt das Futur idiomatisch und unmittelbar wieder.
- source_word: πᾶς ὀφθαλμὸς
  choice: jedes Auge
  rationale: Erhält das konkrete, distributive Bild des griechischen Singulars, statt es zu „alle Menschen“ zu verallgemeinern.
- source_word: οἵτινες
  choice: auch die, die
  rationale: Bezeichnet innerhalb von „jedes Auge“ ausdrücklich die Gruppe derer, die ihn durchbohrt haben; „auch“ macht den einschließenden Zusammenhang im Deutschen natürlich deutlich.
- source_word: ἐξεκέντησαν
  choice: durchbohrt haben
  rationale: Bewahrt Bedeutung und intertextuelle Verbindung zu Sacharja 12,10 und Johannes 19,37.
- source_word: κόψονται
  choice: werden … klagen
  rationale: Das Verb bezeichnet Totenklage bzw. schmerzvolles Trauern; „klagen“ wahrt die Intensität, ohne eine bestimmte Gebärde hinzuzufügen.
- source_word: ἐπ’ αὐτὸν
  choice: um ihn
  rationale: Passt im Deutschen idiomatisch zum Trauer- und Klagekontext und erhält den Bezug auf ihn als Gegenstand der Klage; „seinetwegen“ wäre ebenfalls möglich, könnte aber stärker kausal verstanden werden.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: alle Stämme der Erde
  rationale: „Stämme“ gibt φυλαί genauer wieder als „Völker“. γῆ wird angesichts des universalen Rahmens als „Erde“ übersetzt; „Land“ bleibt wegen der Anspielung auf Sacharja möglich und wird in der Fußnote genannt.
- source_word: ναί, ἀμήν
  choice: Ja, Amen
  rationale: Bewahrt die doppelte nachdrückliche Bekräftigung und das geläufige liturgische Lehnwort.
theological_decisions:
- issue: Reichweite von τῆς γῆς in πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: Im Haupttext „alle Stämme der Erde“
  alternative: „alle Stämme des Landes“
  rationale: Die Aussage, dass jedes Auge ihn sehen wird, begünstigt einen weltweiten Bezug. Zugleich lässt die Anspielung auf Sacharja 12,10–12 einen Bezug auf das Land zu; diese echte Mehrdeutigkeit wird in der Fußnote erhalten.
- issue: Sinn von ἐπ’ αὐτόν beim Klagen
  choice: „um ihn klagen“
  alternative: „seinetwegen klagen“
  rationale: „Um ihn“ bewahrt den Klang einer Klage über eine Person und die Verbindung zu Sacharja, ohne festzulegen, ob die Klage ausschließlich Trauer, Reue oder Entsetzen ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener biblischer Bildsprache. „Sieh“ ist gegenwärtiger als das traditionelle „Siehe“, ohne den feierlichen Ton aufzugeben. Die Satzteilung vor „Und alle Stämme“ verbessert die Lesbarkeit, ohne die griechische Verknüpfung zu verwischen.
