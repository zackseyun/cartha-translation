  terminology: „Alpha und Omega“, „Gott, der Herr“ und „der Allmächtige“ sind angemessene, traditionsfähige und zugleich verständliche Wiedergaben. „Der kommt“ wahrt die Präsensform des Partizips, ohne die eschatologische Spannung auf eine rein futurische Aussage einzuengen.
