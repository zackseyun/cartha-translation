id: REV.1.8
reference: Revelation 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: de
  text: „Ich bin das Alpha und das Omega“, sagt Gott, der Herr, „der ist und der war und der kommt[a], der Allmächtige.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ist und der war und der kommen wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die natürliche deutsche Wiedergabe bewahrt die feierliche Selbstvorstellung; das ausdrücklich gesetzte Pronomen ἐγώ wird durch „Ich“ angemessen wiedergegeben.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: das Alpha und das Omega
  rationale: Die griechischen Buchstabennamen bleiben erhalten und bewahren sowohl die symbolische Aussage als auch die im Deutschen eingebürgerte biblische Wendung.
- source_word: λέγει
  choice: sagt
  rationale: Gibt das Präsens schlicht und unmittelbar wieder, ohne die Aussage durch „erklärt“ oder „spricht“ stärker auszudeuten.
- source_word: κύριος, ὁ θεός
  choice: der Herr, Gott
  rationale: Die Apposition wird eng am griechischen Wortlaut wiedergegeben. Das Komma erhält die grammatische Beziehung, ohne einen im Ausgangstext nicht vorhandenen zusätzlichen Artikel einzuführen.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: der ist und der war und der kommt
  rationale: Die dreigliedrige, ungewöhnliche Gottesbezeichnung wird bewusst formal bewahrt. „Der kommt“ gibt das Präsenspartizip ἐρχόμενος direkt wieder und lässt sowohl gegenwärtiges Kommen als auch eschatologische Erwartung anklingen.
- source_word: ὁ παντοκράτωρ
  choice: der Allmächtige
  rationale: Dies ist die natürliche und traditionsfähige deutsche Entsprechung, die Gottes umfassende Herrschaft ausdrückt, ohne die unbeholfene Lehnübersetzung „Allherrscher“ zu verwenden.
theological_decisions:
- issue: Wiedergabe der göttlichen Selbstbezeichnung im Blick auf Gottes Sein und sein zukünftiges Kommen
  choice: der ist und der war und der kommt
  alternative: der ist und der war und der kommen wird
  rationale: Das griechische ἐρχόμενος ist ein Präsenspartizip und wird mit „der kommt“ aspektuell unmittelbarer wiedergegeben. „Der kommen wird“ ist eine legitime, stärker futurische Deutung und wird deshalb in der Fußnote genannt, statt die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Feierliches, klares modernes Standarddeutsch. Die markante dreigliedrige Formel wird trotz ihrer ungewöhnlichen Syntax beibehalten. Die Zeichensetzung stellt „Gott“ als Apposition zu „der Herr“ dar; der Text vermeidet konfessionell geprägte Zusätze.
