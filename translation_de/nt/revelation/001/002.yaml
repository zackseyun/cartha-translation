id: REV.1.2
reference: Revelation 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: de
  text: der das Wort Gottes und das Zeugnis Jesu, des Messias,[a] bezeugte – alles, was er sah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Zeugnis, das Jesus, der Messias, gab“; oder: „das Zeugnis über Jesus, den Messias“. Der griechische Ausdruck lässt beide Bedeutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: bezeugte
  rationale: Das Präteritum gibt den Aorist im erzählenden Zusammenhang knapp wieder. „Bezeugen“ bewahrt den Zeugen- und Aussagecharakter von μαρτυρέω und stellt zugleich den Wortstammbezug zu „Zeugnis“ her.
- source_word: λόγον
  choice: Wort
  rationale: „Wort Gottes“ ist eine natürliche und etablierte biblische Wendung für Gottes mitgeteilte Offenbarung; „Botschaft“ wäre möglich, würde die Ausdrucksweise aber stärker auslegen.
- source_word: μαρτυρίαν
  choice: Zeugnis
  rationale: „Zeugnis“ entspricht dem substantivischen Sinn und bewahrt die sprachliche Verbindung zu „bezeugte“.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird hier als Titel wiedergegeben. Die appositionale Form „Jesu, des Messias“ ist im Deutschen idiomatisch und lässt den Titel erkennbar bleiben.
- source_word: ὅσα εἶδεν
  choice: alles, was er sah
  rationale: Die umfassende Bedeutung des pluralisch-neutralen ὅσα wird mit „alles“ ausdrücklich wiedergegeben. Der Gedankenstrich kennzeichnet die nachgestellte zusammenfassende Erläuterung.
- source_word: τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: das Wort Gottes und das Zeugnis Jesu, des Messias
  rationale: Die beiden Akkusativobjekte bleiben koordiniert. Die Genitivkonstruktion bei „Zeugnis Jesu“ wird im Haupttext nicht einseitig als Zeugnis von Jesus oder über Jesus aufgelöst.
theological_decisions:
- issue: Mehrdeutigkeit des Genitivs in μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: „das Zeugnis Jesu, des Messias“; die Mehrdeutigkeit bleibt im Haupttext erhalten
  alternative: „das Zeugnis, das Jesus, der Messias, gab“ oder „das Zeugnis über Jesus, den Messias“
  rationale: Der griechische Genitiv kann Jesus als Urheber beziehungsweise Geber des Zeugnisses oder als dessen Gegenstand bezeichnen. Der Kontext erzwingt hier keine eindeutige Festlegung.
- issue: Wiedergabe von Χριστοῦ als Titel
  choice: „des Messias“
  alternative: „Christi“
  rationale: In diesem Zusammenhang bleibt der Titelcharakter von Χριστός erkennbar; „Messias“ macht seine Bedeutung für heutige Leser unmittelbar verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt eng an der griechischen Satzstruktur, vermeidet jedoch unnatürliche Wörtlichkeit. Der Gedankenstrich macht die nachgestellte Zusammenfassung „alles, was er sah“ im Deutschen klar lesbar.
