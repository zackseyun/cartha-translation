revisions:
- from: In seiner rechten Hand hielt er sieben Sterne, aus seinem Mund kam ein scharfes, zweischneidiges Schwert, und seine Erscheinung war wie die Sonne, wenn sie in ihrer Kraft strahlt.[a]
