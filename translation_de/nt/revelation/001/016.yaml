id: REV.1.16
reference: Revelation 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: de
  text: In seiner rechten Hand hatte er sieben Sterne, und aus seinem Mund ging ein scharfes, zweischneidiges Schwert hervor, und seine Erscheinung war wie die Sonne, die in ihrer Kraft strahlt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die mit voller Kraft strahlt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: hielt er
  rationale: Das Partizip beschreibt den fortdauernden Anblick innerhalb der Vision. Ein finites Verb ist im Deutschen natürlich und gibt den Zusammenhang idiomatisch wieder.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: in seiner rechten Hand
  rationale: χείρ steht im Griechischen ausdrücklich und wird daher beibehalten; die Formulierung ist zugleich natürliches Standarddeutsch.
- source_word: ἀστέρας ἑπτά
  choice: sieben Sterne
  rationale: Direkte und idiomatische Wiedergabe mit der im Deutschen üblichen Wortstellung.
- source_word: ῥομφαία δίστομος ὀξεῖα
  choice: ein scharfes, zweischneidiges Schwert
  rationale: ῥομφαία bezeichnet eine größere Schwertart, doch »Schwert« ist klar und überbestimmt die Waffe nicht. δίστομος wird idiomatisch als »zweischneidig« wiedergegeben, während ὀξεῖα die ausdrückliche Schärfe bezeichnet.
- source_word: ἐκπορευομένη
  choice: kam
  rationale: Das Partizip stellt das Schwert als aus seinem Mund hervorkommend dar. Die finite Formulierung ist im Deutschen flüssig und bewahrt das visionäre Bild.
- source_word: ἡ ὄψις αὐτοῦ
  choice: seine Erscheinung
  rationale: ὄψις bezeichnet hier den sichtbaren Anblick beziehungsweise die Erscheinung und ist nicht eindeutig auf das Gesicht beschränkt.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: wie die Sonne, wenn sie … strahlt
  rationale: Die Vergleichsformulierung gibt das gegenwärtige, intensive Leuchten natürlich wieder.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: in ihrer Kraft
  rationale: Die Wendung bleibt eng am griechischen Ausdruck und lässt offen, ob die volle Intensität ausdrücklich mitgedacht wird; diese idiomatische Möglichkeit wird in einer Fußnote genannt.
theological_decisions:
- issue: Bedeutung des aus dem Mund kommenden Schwertes
  choice: Das visionäre Bild wird ohne deutende Erweiterung beibehalten.
  alternative: Das Schwert ausdrücklich als richtendes Wort Christi erklären.
  rationale: Der Vers selbst bietet symbolische apokalyptische Bildsprache, legt ihre Bedeutung an dieser Stelle aber nicht ausdrücklich aus. Die Übersetzung soll diese Spannung bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt die dreigliedrige visionäre Beschreibung, ohne unnötig altertümlich zu wirken.
