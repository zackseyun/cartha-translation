  rationale: Die Revision präzisiert den deskriptiven Sinn von ἔχων, bildet das Hervorkommen des Schwertes aus dem Mund natürlicher und quellennäher ab und glättet den Sonnenvergleich, ohne das Bild auszudeuten oder dessen theologische Bedeutung festzulegen. Die Fußnote bleibt ausschließlich an der Wendung zur Intensität des Sonnenlichts verankert.
