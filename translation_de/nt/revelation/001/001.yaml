  to: Offenbarung Jesu, des Messias,[a] die Gott ihm gab, um seinen Sklaven[d] zu zeigen, was bald[b] geschehen muss, und die er bekannt machte, indem er sie durch seinen Engel seinem Sklaven Johannes sandte.[c]
  rationale: Die Revision stellt die ausdrücklich vorhandene Sendung durch den Engel wieder her („indem er sie … sandte“). Zugleich bleibt die mögliche Zeichen-Nuance von σημαίνω in der Fußnote erhalten, ohne den griechischen Ausdruck im Haupttext einseitig auf eine Mitteilung „in Zeichen“ festzulegen. Die Genitivoffenheit, die Wiedergabe von δοῦλος und sämtliche Fußnotenanker bleiben erhalten.
