id: REV.1.1
reference: Revelation 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: de
  text: Offenbarung Jesu, des Messias,[a] die Gott ihm gab, um seinen Sklaven[d] zu zeigen, was bald[b] geschehen muss, und die er bekannt machte, indem er sie durch seinen Engel seinem Sklaven Johannes sandte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Offenbarung von Jesus, dem Messias“ oder „Offenbarung über Jesus, den Messias“. Der griechische Genitiv lässt mehrere Beziehungen zu.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „schnell“. Die Wendung kann zeitliche Nähe bezeichnen oder bedeuten, dass das Geschehen rasch eintritt.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Verb bedeutet „bekannt machen“ und kann zugleich das Mitteilen durch Zeichen anklingen lassen.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Dienern“. Das griechische Wort bezeichnet Menschen, die einem Herrn gehören und ihm unterstellt sind; ebenso beim zweiten Vorkommen in diesem Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: Offenbarung
  rationale: Bezeichnet eine Enthüllung oder Mitteilung dessen, was zuvor verborgen war; „Offenbarung“ ist im Deutschen zugleich natürlich und traditionsgemäß.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird als Titel „Messias“ wiedergegeben. Der deutsche Genitiv lässt wie das Griechische offen, ob die Offenbarung von Jesus ausgeht, ihm gehört oder ihn zum Gegenstand hat.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: die Gott ihm gab
  rationale: Die Relativkonstruktion wird unmittelbar beibehalten; „ihm“ verweist im Satz auf Jesus, den Messias.
- source_word: δεῖξαι
  choice: um … zu zeigen
  rationale: Die finale Bedeutung des Infinitivs wird in natürlichem Deutsch ausdrücklich wiedergegeben.
- source_word: τοῖς δούλοις αὐτοῦ / τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: seinen Sklaven / seinem Sklaven Johannes
  rationale: „Sklave“ bewahrt das in δοῦλος enthaltene Verhältnis der Zugehörigkeit und Abhängigkeit; die geläufigere Alternative „Diener“ wird in einer Fußnote genannt.
- source_word: ἃ δεῖ γενέσθαι
  choice: was … geschehen muss
  rationale: Gibt sowohl den Inhalt als auch die durch δεῖ ausgedrückte Notwendigkeit knapp und idiomatisch wieder.
- source_word: ἐν τάχει
  choice: bald
  rationale: Im Kontext ist zeitliche Nähe die naheliegende Bedeutung; die mögliche Bedeutung „schnell“ wird als Alternative vermerkt.
- source_word: ἐσήμανεν
  choice: in Zeichen bekannt machte
  rationale: Die Formulierung verbindet die Grundbedeutung „bekannt machen“ mit der möglichen Nuance des Mitteilens durch Zeichen, die zum symbolischen Charakter des Buches passt.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: durch seinen Engel
  rationale: Die deutsche Formulierung bezeichnet den Engel als den gesandten Vermittler, ohne einen im Griechischen nicht ausdrücklich genannten Gegenstand des Sendens einzuführen.
theological_decisions:
- issue: Genitiv in Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: „Offenbarung Jesu, des Messias“ bewahrt die offene Genitivbeziehung.
  alternative: „Offenbarung von Jesus, dem Messias“ oder „Offenbarung über Jesus, den Messias“
  rationale: Der griechische Genitiv kann Quelle, Zugehörigkeit oder Gegenstand bezeichnen. Der unmittelbare Kontext legt zwar eine Weitergabe durch Jesus nahe, entscheidet die Beziehung aber nicht abschließend.
- issue: Wiedergabe von δοῦλος
  choice: Sklave/Sklaven
  alternative: Diener
  rationale: Die stärkere Bezeichnung wahrt den Gedanken völliger Zugehörigkeit, ohne ihn zu einer bloßen Amts- oder Dienstbezeichnung abzuschwächen.
- issue: Bezug der Possessivpronomen αὐτοῦ
  choice: Die wiederholte Form „sein-“ bleibt ohne erklärende Festlegung stehen.
  alternative: Ausdrückliche Zuordnung jedes Vorkommens zu Gott oder Jesus
  rationale: Der griechische Wortlaut wechselt den möglichen Bezug nicht ausdrücklich aus; eine erläuternde Festlegung würde mehr sagen als der Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der fortlaufenden griechischen Aussage, bleibt aber lesbar. „Sklave“ ist bewusst quellennah und wird wegen seiner Härte durch eine Fußnote erläutert; „in Zeichen bekannt machte“ bewahrt sowohl Verständlichkeit als auch die symbolische Nuance von σημαίνω.
