review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft die Aussage des griechischen Textes insgesamt: Johannes bezeichnet sich als Bruder und als jemand, der mit den Adressaten an Bedrängnis, Königsherrschaft und Ausdauer in Jesus teilhat; sein Aufenthalt auf Patmos wird als begründet durch Gottes Wort und das Zeugnis Jesu dargestellt. Die Mehrdeutigkeit von „Zeugnis Jesu“ bleibt im Haupttext erhalten und wird sachgerecht erläutert.'
  naturalness: „Mitteilhaber“ ist im heutigen Standarddeutsch jedoch vor allem für einen Miteigentümer bzw. geschäftlichen Teilhaber gebräuchlich. Es erzeugt gerade die wirtschaftliche Konnotation, die hier vermieden werden sollte. Eine Relativkonstruktion mit „mit euch ... teilhat“ ist idiomatisch und gibt συγκοινωνός präzise wieder.
  terminology: „Bedrängnis“, „Reich“, „standhafte Ausdauer“, „Wort Gottes“ und „Zeugnis Jesu“ sind angemessen. „Reich“ bewahrt die knappe, nicht weiter ausgelegte Bedeutung von βασιλεία. Die Fußnote wahrt die genitivische Ambiguität, ohne sie dogmatisch aufzulösen.
  issues:
