revisions:
- from: Ich, Johannes, euer Bruder und Mitteilhaber an der Bedrängnis, am Reich und an der standhaften Ausdauer in Jesus, war auf der Insel, die Patmos heißt, wegen des Wortes Gottes und des Zeugnisses Jesu.[a]
  to: Ich, Johannes, euer Bruder, der mit euch an der Bedrängnis, am Reich und an der standhaften Ausdauer in Jesus teilhat, war auf der Insel, die Patmos heißt, wegen des Wortes Gottes und des Zeugnisses Jesu.[a]
  rationale: Die einzige Änderung ersetzt das im Deutschen überwiegend wirtschaftlich verstandene „Mitteilhaber“ durch die natürliche und inhaltlich genaue Formulierung „der mit euch ... teilhat“. Sie erhält sowohl die gemeinsame Teilhabe als auch die Beziehung zu den Adressaten. Textsinn, Register, die Mehrdeutigkeit von „Zeugnis Jesu“ und der Fußnotenanker bleiben unverändert.
