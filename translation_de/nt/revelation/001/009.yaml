id: REV.1.9
reference: Revelation 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: de
  text: Ich, Johannes, euer Bruder, der mit euch an der Bedrängnis, am Reich und an der standhaften Ausdauer in Jesus teilhat, war auf der Insel, die Patmos heißt, wegen des Wortes Gottes und des Zeugnisses Jesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Zeugnisses über Jesus“. Der griechische Genitiv kann sowohl das von Jesus gegebene Zeugnis als auch das Zeugnis über Jesus bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: Mitteilhaber
  rationale: Das Wort bezeichnet jemanden, der gemeinsam mit anderen an etwas teilhat. „Mitteilhaber“ bewahrt den Gedanken gemeinsamer Beteiligung und vermeidet geschäftliche Untertöne.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: an der Bedrängnis, am Reich und an der standhaften Ausdauer
  rationale: Die drei koordinierten Begriffe bezeichnen die Wirklichkeiten, an denen Johannes gemeinsam mit seinen Lesern teilhat. „Bedrängnis“ trägt dem apokalyptischen Gewicht von θλῖψις Rechnung; „standhafte Ausdauer“ gibt den beharrlichen Aspekt von ὑπομονή natürlich wieder.
- source_word: ἐν Ἰησοῦ
  choice: in Jesus
  rationale: Die knappe Wendung bezieht sich am natürlichsten auf die vorausgehende Dreiergruppe und verortet Bedrängnis, Reich und Ausdauer in Jesus. Die kompakte theologische Ausdrucksweise bleibt erhalten.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: war auf der Insel
  rationale: γίνομαι bezeichnet hier idiomatisch das Sichbefinden an einem Ort. Die Wiedergabe legt nicht fest, auf welche Weise Johannes dorthin gelangte.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: die Patmos heißt
  rationale: Eine natürliche moderne Wiedergabe des attributiven Partizips καλουμένῃ.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: wegen des Wortes Gottes
  rationale: διά mit Akkusativ bezeichnet hier den Grund. „Wegen“ lässt offen, ob Verkündigung, Treue zum Wort oder daraus erwachsene Verfolgung gemeint ist.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: das Zeugnis Jesu
  rationale: Der Genitiv Ἰησοῦ kann subjektiv oder objektiv verstanden werden. Die deutsche Genitivfügung bewahrt diese echte Mehrdeutigkeit.
- source_word: ἀδελφὸς ὑμῶν
  choice: euer Bruder
  rationale: Die direkte familiäre Selbstbezeichnung bringt die Verbundenheit des Johannes mit den Angesprochenen natürlich zum Ausdruck.
theological_decisions:
- issue: Mehrdeutigkeit des Genitivs in μαρτυρίαν Ἰησοῦ
  choice: Im Haupttext „das Zeugnis Jesu“
  alternative: „das Zeugnis über Jesus“
  rationale: Die Genitivkonstruktion kann sowohl das von Jesus gegebene Zeugnis als auch das Zeugnis über Jesus bezeichnen. Der Haupttext bewahrt die Mehrdeutigkeit; die Fußnote nennt die ausdrücklich objektive Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch idiomatische Präpositionen und Kasusanschlüsse lesbar gestaltet. „Mitteilhaber“ ist bewusst gehoben, jedoch verständlich; „standhafte Ausdauer“ verdeutlicht den beharrlichen Gehalt von ὑπομονή ohne konfessionelle Zusätze.
