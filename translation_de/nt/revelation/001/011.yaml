id: REV.1.11
reference: Revelation 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: de
  text: 'die sagte: „Was du siehst, schreibe in ein Buch[a] und schicke es an die sieben Gemeinden: nach Ephesus, nach Smyrna, nach Pergamon, nach Thyatira, nach Sardes, nach Philadelphia und nach Laodizea.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in eine Schriftrolle“; das griechische Wort kann ein Buch, eine Schriftrolle oder ein Schriftstück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγούσης
  choice: die sagte
  rationale: Das feminine Partizip im Genitiv bezieht sich auf die im vorherigen Vers genannte Stimme. Die Wiedergabe setzt diesen syntaktischen Anschluss knapp und natürlich fort.
- source_word: Ὃ βλέπεις
  choice: Was du siehst
  rationale: Die idiomatische deutsche Form bewahrt den offenen Umfang dessen, was Johannes in der Vision sieht.
- source_word: γράψον
  choice: schreibe
  rationale: Der Aorist-Imperativ wird als unmittelbarer Schreibauftrag wiedergegeben.
- source_word: εἰς βιβλίον
  choice: in ein Buch
  rationale: βιβλίον kann ein Buch, eine Schriftrolle oder allgemeiner ein Schriftstück bezeichnen. „Buch“ ist im modernen Deutsch verständlich; die sachgeschichtlich naheliegende Alternative wird in der Fußnote genannt.
- source_word: πέμψον
  choice: schicke es
  rationale: Das im Deutschen erforderliche Objekt „es“ bezieht sich sinngemäß auf das Geschriebene.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: an die sieben Gemeinden
  rationale: „Gemeinden“ bezeichnet hier konkrete christliche Ortsgemeinden und ist im Deutschen natürlicher als „Kirchen“, ohne eine Konfession oder Institution vorauszusetzen.
- source_word: εἰς Ἔφεσον … εἰς Λαοδίκειαν
  choice: nach Ephesus … nach Laodizea
  rationale: Bei Städtenamen gibt „nach“ die jeweiligen Zielorte im Deutschen idiomatisch wieder; die wiederholte Präposition bewahrt die aufzählende Wirkung des Griechischen.
theological_decisions:
- issue: Bedeutung von ἐκκλησίαις in Offenbarung 1,11
  choice: Gemeinden
  alternative: Versammlungen; Kirchen
  rationale: Gemeint sind konkrete christliche Gemeinschaften an den genannten Orten. „Gemeinden“ vermittelt diesen Bezug, ohne konfessionelle Besonderheiten einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Relativanschluss „die sagte“ bleibt bewusst vom vorherigen Vers abhängig. Die Städtenamen folgen den im Deutschen üblichen Formen.
