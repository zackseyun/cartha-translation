id: REV.1.5
reference: Revelation 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: de
  text: und von Jesus, dem Messias[b], dem treuen Zeugen, dem Erstgeborenen von den Toten und dem Herrscher über die Könige der Erde. Ihm, der uns liebt und uns durch sein Blut von unseren Sünden befreit hat[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben statt „uns durch sein Blut von unseren Sünden befreit hat“: „uns in seinem Blut von unseren Sünden gewaschen hat“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Jesus Christus“. Das griechische Wort ist ein Titel und bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: Χριστός ist hier ein Titel. „Messias“ gibt diesen Titel verständlich wieder; die Apposition mit Komma ist im Deutschen natürlich.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: dem treuen Zeugen
  rationale: μάρτυς bezeichnet hier den, der Zeugnis ablegt, nicht speziell einen wegen seines Zeugnisses Getöteten; πιστός bewahrt die Bedeutung von Treue und Verlässlichkeit.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: dem Erstgeborenen von den Toten
  rationale: Die Formulierung bewahrt das biblische Bild des Erstgeborenen und die Mehrdeutigkeit des Genitivs, ohne es erklärend auf „als Erster auferstanden“ zu verengen.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: dem Herrscher über die Könige der Erde
  rationale: „Herrscher über“ gibt die Autorität des ἄρχων in idiomatischem Deutsch klar wieder; γῆ bezeichnet im kosmischen Horizont der Offenbarung die Erde.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: Ihm, der uns liebt
  rationale: Das Präsenspartizip bezeichnet fortdauernde Liebe; der deutsche Relativsatz ist natürlich und bewahrt den gegenwärtigen Aspekt.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: uns von unseren Sünden befreit hat
  rationale: λύω bedeutet lösen oder freisetzen; „befreit“ bewahrt das Befreiungsbild und verbindet sich idiomatisch mit „von unseren Sünden“.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: durch sein Blut
  rationale: ἐν ist hier sinnvoll instrumental zu verstehen. „Durch sein Blut“ benennt das Mittel in natürlichem Deutsch, ohne die Opfermetaphorik abzuschwächen.
theological_decisions:
- issue: Textvariante λύσαντι gegenüber λούσαντι
  choice: „befreit hat“ nach λύσαντι
  alternative: „gewaschen hat“ nach λούσαντι
  rationale: Der SBLGNT-Ausgangstext liest λύσαντι. Die bekannte und theologisch bedeutsame Variante λούσαντι wird transparent in einer Fußnote genannt, aber nicht in den Haupttext eingetragen.
- issue: Wiedergabe des christologischen Titels Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός fungiert hier als Titel und wird daher bedeutungsorientiert als „Messias“ wiedergegeben; die traditionelle Form „Christus“ bleibt als lexikalische Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der Hoheitstitel und der abschließende Gedankenstrich des griechischen Satzes bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Stellen.
