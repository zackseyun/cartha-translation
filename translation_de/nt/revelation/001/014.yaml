lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: Die schwache weiterführende Partikel wird im Deutschen durch den fortlaufenden Satz- und Erzählzusammenhang ausreichend wiedergegeben; ein ausdrückliches »nun« würde eine zeitliche Nuance nahelegen, die im Ausgangstext nicht vorhanden ist.
- source_word: ἡ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες
  choice: sein Kopf und seine Haare
  rationale: Die beiden anatomischen Begriffe werden direkt wiedergegeben; der Plural »Haare« entspricht τρίχες und klingt im Deutschen in dieser Beschreibung natürlich.
- source_word: λευκαὶ
  choice: weiß
  rationale: Der grundlegende Farbwert bleibt ohne deutende Erweiterung wie »strahlend« oder »leuchtend« erhalten.
- source_word: ὡς ἔριον λευκόν
  choice: wie weiße Wolle
  rationale: Die Vergleichspartikel und die ausdrückliche Wiederholung von »weiß« werden bewahrt.
- source_word: ὡς χιών
  choice: wie Schnee
  rationale: Der zweite, die Weiße steigernde Vergleich wird knapp und unmittelbar wiedergegeben.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: seine Augen
  rationale: Direkte und idiomatische Wiedergabe des anatomischen Ausdrucks.
- source_word: ὡς φλὸξ πυρός
  choice: wie eine Feuerflamme
  rationale: »Feuerflamme« ist eine natürliche, zugleich formal nahe deutsche Wiedergabe der Genitivverbindung und erhält das eindringliche Bild.
theological_decisions:
- issue: Symbolische Beschreibung des erhöhten Menschensohnes
  choice: Die visionären Vergleiche werden im Haupttext bildhaft und ohne Auslegung wiedergegeben.
  alternative: Die Bilder durch Zusätze ausdrücklich als Hinweise auf Reinheit, Ewigkeit oder Gericht deuten.
  rationale: Der Vers nennt diese theologischen Bedeutungen nicht ausdrücklich. Eine unveränderte Wiedergabe der Bilder bewahrt ihre Offenheit und vermeidet eine konfessionell oder dogmatisch festgelegte Auslegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die wiederholten Weiß-Vergleiche und das apokalyptische Bild der Feuerflamme bleiben bewusst unaufgelöst erhalten.
