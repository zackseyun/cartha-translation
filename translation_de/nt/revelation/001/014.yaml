  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: de
  text: Sein Kopf und seine Haare waren weiß[a], wie weiße Wolle, wie Schnee, und seine Augen waren wie eine Feuerflamme[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und sein Kopf und seine Haare waren weiß wie weiße Wolle, wie Schnee.«'
