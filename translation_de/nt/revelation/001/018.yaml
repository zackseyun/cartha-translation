id: REV.1.18
reference: Revelation 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: de
  text: und der Lebendige – ich war tot[a], und siehe, ich lebe für immer und ewig[b] – und ich habe die Schlüssel des Todes und des Totenreichs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich wurde tot.“ Das griechische Verb hebt den Übergang in den Tod hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in die Zeitalter der Zeitalter“; eine verstärkte Wendung für unbegrenzte Dauer.'
    reason: lexical_alternative
  - marker: c
    text: 'Griechisch Hades: der Bereich der Toten, nicht eigens die endgültige Strafe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ζῶν
  choice: der Lebendige
  rationale: Der substantivierte Partizipialausdruck wird als Titel wiedergegeben. So bleiben sowohl der Gegenwartsbezug des Lebens als auch der feierliche Klang erhalten.
- source_word: ἐγενόμην νεκρός
  choice: ich war tot
  rationale: Diese Formulierung ist im modernen Deutschen natürlich und bezeichnet hier den eingetretenen Todeszustand. Die wörtlichere Übergangsbedeutung von ἐγενόμην wird in einer Fußnote bewahrt.
- source_word: ἰδού
  choice: sieh
  rationale: „Sieh“ bewahrt den auffordernden, die Aufmerksamkeit lenkenden Charakter des griechischen Ausdrucks, ohne im heutigen Deutsch unnötig altertümlich zu wirken.
- source_word: ζῶν εἰμι
  choice: ich lebe
  rationale: Natürliche deutsche Wiedergabe der präsentischen Aussage, die einen scharfen Gegensatz zu „ich war tot“ bildet.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Gängige und verständliche deutsche Wiedergabe der verstärkten griechischen Zeitformel für unbegrenzte Dauer.
- source_word: κλεῖς
  choice: Schlüssel
  rationale: Direkte Entsprechung; das Bild bezeichnet hier Verfügungsgewalt, ohne diese Deutung in den Haupttext einzutragen.
- source_word: τοῦ θανάτου
  choice: des Todes
  rationale: Der Genitiv wird unmittelbar beibehalten; eine ausdrückliche Personifizierung wird durch die Kleinschreibung vermieden.
- source_word: τοῦ ᾅδου
  choice: des Totenreichs
  rationale: „Totenreich“ bezeichnet verständlich den Bereich der Toten und vermeidet die sachlich irreführende Gleichsetzung mit der endgültigen Strafe.
theological_decisions:
- issue: Wiedergabe von ᾅδης im eschatologischen Zusammenhang
  choice: Totenreich
  alternative: Hades; Hölle; Grab
  rationale: „Totenreich“ hält Tod und ᾅδης als verwandte, aber unterschiedene Größen auseinander. „Hölle“ würde die endgültige Strafe eintragen, während „Grab“ den Begriff auf die Begräbnisstätte verengen könnte. „Hades“ wäre formal näher, ist für viele heutige Leser jedoch weniger unmittelbar verständlich.
- issue: Übergang in den Tod bei ἐγενόμην νεκρός
  choice: Natürlicher Haupttext „ich war tot“ mit Hinweis auf die wörtlichere Übergangsbedeutung
  alternative: ich wurde tot; ich wurde ein Toter
  rationale: Die idiomatische Haupttextfassung vermeidet unnatürliches Deutsch, während die Fußnote den im Verb γίνομαι liegenden Übergang in den Tod ausdrücklich erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Der Lebendige“ bewahrt den Titelcharakter; „sieh“ erhält den eindringlichen Ton der Offenbarung. Der Satzbau wurde in kurze, klar verständliche Aussagen gegliedert, ohne die inhaltlichen Gegensätze zwischen Tod, Leben und bleibender Vollmacht einzuebnen.
