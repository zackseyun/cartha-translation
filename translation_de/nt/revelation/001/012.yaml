source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: de
  text: Und ich wandte mich um, um die Stimme zu sehen, die mit mir sprach[a]. Und als ich mich umwandte, sah ich sieben goldene Leuchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die zu mir sprach“. Wörtlich steht im Griechischen: „die mit mir sprach“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: ich wandte mich um
  rationale: Das Verb bezeichnet hier eine körperliche Wendung. „Sich umwenden“ ist im Deutschen natürlicher und in diesem Zusammenhang genauer als das bloße „sich wenden“.
- source_word: βλέπειν τὴν φωνὴν
  choice: um die Stimme zu sehen
  rationale: Die auffällige Verbindung von „sehen“ und „Stimme“ wird bewahrt, statt sie erklärend als ein Suchen nach der Quelle der Stimme wiederzugeben. So bleibt die bildhafte Ausdrucksweise des griechischen Textes erhalten.
- source_word: ἥτις ἐλάλει μετ’ ἐμοῦ
  choice: die mit mir sprach
  rationale: Der Imperfekt bezeichnet das andauernde Sprechen; μετά mit Genitiv wird eng am Wortlaut mit „mit mir“ wiedergegeben. Eine idiomatischere Alternative ist „zu mir sprach“.
- source_word: ἐπιστρέψας
  choice: als ich mich umgewandt hatte
  rationale: Das adverbiale Aoristpartizip bezeichnet eine der Wahrnehmung vorausgehende Handlung. Die deutsche Formulierung macht diese zeitliche Abfolge klar.
- source_word: εἶδον
  choice: sah ich
  rationale: Schlichte und genaue Wiedergabe des Aorists von ὁράω.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: sieben goldene Leuchter
  rationale: λυχνία bezeichnet einen Ständer für eine Lampe, nicht die Lampe selbst. „Leuchter“ ist die geläufige, konkrete deutsche Bezeichnung und wahrt den Bezug zur Deutung in Offenbarung 1,20; χρυσᾶς wird natürlich als „goldene“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des symbolischen Gegenstands λυχνίας
  choice: Leuchter
  alternative: Lampen; Lampenständer
  rationale: Der Gegenstand bleibt konkret vom darauf stehenden Licht unterschieden, weil die sieben Leuchter später ausdrücklich symbolisch gedeutet werden. „Lampen“ würde diese Bildstruktur verwischen; „Lampenständer“ wäre präzise, wirkt hier aber weniger würdevoll und weniger geläufig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „die Stimme zu sehen“ wurde bewusst beibehalten, da sie dem griechischen Ausdruck entspricht und die visionäre Sprache nicht glättet.
