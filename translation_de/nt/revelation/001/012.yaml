  source_fidelity: 'Der Entwurf gibt die Abfolge und die auffällige Formulierung des griechischen Textes zuverlässig wieder: Johannes wendet sich, um die sprechende Stimme zu sehen, und sieht danach sieben goldene Leuchter. „Leuchter“ trifft λυχνίαι sachgerecht und bewahrt den Bezug zu Offb 1,20. Die Wiedergabe von μετ’ ἐμοῦ als „mit mir“ ist möglich; die Fußnote nennt angemessen die idiomatischere Alternative.'
  naturalness: „Als ich mich umgewandt hatte“ ist zwar verständlich, wirkt im modernen Standarddeutsch jedoch unnötig schwerfällig und setzt mit dem Plusquamperfekt einen stärkeren Vorzeitigkeitsakzent, als die adverbiale Partizipialkonstruktion verlangt. „Und als ich mich umwandte, sah ich …“ ist natürlich, klar und bewahrt die Wiederaufnahme des Wendens im Griechischen.
  terminology: „Stimme“, „sprach“, „sieben goldene Leuchter“ sind terminologisch angemessen. „Leuchter“ ist gegenüber „Lampen“ vorzuziehen, da λυχνία den Träger der Lampe bezeichnet.
