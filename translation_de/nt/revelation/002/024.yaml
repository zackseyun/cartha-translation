  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: de
  text: 'Euch anderen in Thyatira aber sage ich allen, die an dieser Lehre nicht festhalten und die »Tiefen des Satans«[a], wie sie sagen, nicht kennengelernt haben: Ich lege euch keine weitere Last auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die tiefen Dinge des Satans«. Die Wendung kann auf den Anspruch anspielen, besondere »tiefe« geistliche Erkenntnis zu besitzen. Wer sie so bezeichnet, bleibt im Griechischen offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: euch anderen in Thyatira
  rationale: Die Formulierung bezeichnet die übrigen Gemeindeglieder im Gegensatz zu den Anhängern der zuvor genannten Lehre. »Euch anderen« ist im Deutschen natürlich und bewahrt den Kontrast.
- source_word: ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην
  choice: euch allen, die an dieser Lehre nicht festhalten
  rationale: ἔχω mit διδαχή bezeichnet hier das Haben beziehungsweise Vertreten einer Lehre. »An dieser Lehre festhalten« gibt die Zugehörigkeit zu ihr idiomatisch wieder, ohne bloßes Kennen mit Zustimmung gleichzusetzen.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: die … nicht kennengelernt haben
  rationale: Das Verb kann sowohl Kenntnis als auch erfahrene Vertrautheit bezeichnen. »Nicht kennengelernt haben« wahrt diese Spannweite besser als ein rein intellektuelles »nicht wissen«.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: die »Tiefen des Satans«
  rationale: Die substantivierte Form βαθέα bezeichnet »tiefe Dinge« oder »Tiefen«. Die knappe Wendung erhält die mögliche polemische Anspielung auf beanspruchte tiefere Erkenntnis.
- source_word: ὡς λέγουσιν
  choice: wie sie sagen
  rationale: Die wörtlich-nahe Wiedergabe lässt offen, wer genau diese Bezeichnung gebraucht und ob sie als Selbstbezeichnung, berichtete Wendung oder ironische Gegenkennzeichnung zu verstehen ist.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: Ich lege euch keine weitere Last auf
  rationale: βάλλω ἐπί mit βάρος bedeutet idiomatisch, jemandem eine Last beziehungsweise Verpflichtung aufzuerlegen. Die Formulierung ist natürlich und bewahrt das Bild des Ausgangstextes.
theological_decisions:
- issue: Bezug und Aussagekraft von »die Tiefen des Satans, wie sie sagen«
  choice: Die Wendung wird als knappe, berichtete und möglicherweise ironische Bezeichnung wiedergegeben, ohne ihren genauen Sprecher oder ihre polemische Funktion festzulegen.
  alternative: Die Irrlehrer behaupten, »tiefe Dinge« zu kennen, die Johannes ausdrücklich als satanisch entlarvt; oder Johannes gibt sarkastisch die vollständige Bezeichnung »Tiefen des Satans« wieder.
  rationale: Der griechische Satz ist in dieser Hinsicht mehrdeutig. Die Übersetzung soll weder eine Selbstbezeichnung der Irrlehrer noch eine ausschließlich johanneische Gegenbezeichnung als sicher voraussetzen.
- issue: Bedeutung von »keine weitere Last«
  choice: Das Bild einer zusätzlich auferlegten Last bleibt ohne nähere Bestimmung erhalten.
  alternative: Die Last ausdrücklich als weitere Gebote, Gemeindeauflagen oder apostolische Verpflichtungen erklären.
  rationale: Der Vers selbst benennt die Last nicht näher. Eine Konkretisierung würde eine mögliche intertextuelle oder gemeindliche Deutung vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der vorangestellte Dativ »Euch anderen … aber« bewahrt den betonten Kontrast des griechischen Satzes. Deutsche Anführungszeichen markieren die möglicherweise zitierte oder polemisch aufgegriffene Wendung, ohne ihre Herkunft festzulegen.
