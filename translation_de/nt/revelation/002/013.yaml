review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzfolge und die Bildsprache des griechischen Textes zuverlässig wieder: κατοικεῖς/κατοικεῖ bleibt als „wohnen“ erhalten, κρατεῖς als beharrliches Festhalten am Namen, und παρ’ ὑμῖν wird zutreffend nicht als Täterschaft der Gemeinde verstanden. „Glauben an mich“ ist eine plausible Kontextdeutung von τὴν πίστιν μου, aber die Fußnote muss die im Haupttext gewählte Deutung sauber von der wörtlichen, mehrdeutigen Formulierung unterscheiden.'
  naturalness: Das Deutsch ist insgesamt modernes Standarddeutsch und dem apokalyptischen Register angemessen. „Selbst in den Tagen des Antipas“ ist in diesem Satz etwas flüssiger und betont besser die konzessive Zuspitzung als „auch nicht in den Tagen des Antipas“.
  terminology: „Zeuge“ und „Getreuer“ bewahren die zwei griechischen Appositionen, ohne sie zu einem Diensttitel oder zu „treuer Zeuge“ zusammenzuziehen. Die Möglichkeit „Märtyrer“ gehört als lexikalische Kontextalternative in die Fußnote, deren Anker jedoch unmittelbar bei „Zeugen“ stehen muss.
  issues:
  - severity: medium
    issue: Der Fußnotenanker [b] steht am Satzende statt bei „meines Zeugen“.
    rationale: Die Fußnote erläutert μάρτυς („Zeuge“/„Märtyrer“), nicht den abschließenden Ortssatz. Der Anker muss daher an das erläuterte Wort gesetzt werden.
  - severity: low
    issue: „auch nicht in den Tagen des Antipas“ ist syntaktisch möglich, aber weniger idiomatisch als eine konzessive Fügung.
    rationale: καὶ ἐν ταῖς ἡμέραις Ἀντιπᾶς verschärft hier den vorausgehenden Sachverhalt. „selbst in den Tagen“ gibt diese Funktion im modernen Deutsch klarer wieder.
