revisions:
- from: 'Ich weiß, wo du wohnst: dort, wo der Thron Satans steht. Dennoch hältst du an meinem Namen fest und hast den Glauben an mich[a] nicht verleugnet, auch nicht in den Tagen des Antipas, meines Zeugen, meines Getreuen, der bei euch getötet wurde – dort, wo Satan wohnt.‌[b]'
  to: 'Ich weiß, wo du wohnst: dort, wo der Thron Satans steht. Dennoch hältst du an meinem Namen fest und hast den Glauben an mich[a] nicht verleugnet, selbst in den Tagen des Antipas, meines Zeugen[b], meines Getreuen, der bei euch getötet wurde – dort, wo Satan wohnt.'
  rationale: Die Revision versetzt den Märtyrer-Hinweis an seinen sachlichen Anker und glättet die temporale Zuspitzung. Die Übersetzung „Glauben an mich“ bleibt als kontextuell naheliegende Lesart bestehen; die Fußnote hält die wörtliche griechische Form und die weitere mögliche Deutung offen. Im Übrigen bleibt die Übersetzung unverändert.
