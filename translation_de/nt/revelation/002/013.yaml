id: REV.2.13
reference: Revelation 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: de
  text: 'Ich weiß, wo du wohnst: dort, wo der Thron Satans steht. Dennoch hältst du an meinem Namen fest und hast den Glauben an mich[a] nicht verleugnet, selbst in den Tagen des Antipas, meines Zeugen[b], meines Getreuen, der bei euch getötet wurde – dort, wo Satan wohnt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „meinen Glauben“. Die griechische Wendung kann auch als „meine Treue“ verstanden werden.
    reason: alternative_reading
  - marker: b
    text: Das mit „Zeuge“ übersetzte griechische Wort kann im Zusammenhang mit Leiden und Tod auch „Märtyrer“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Ich weiß
  rationale: Das griechische Perfekt hat hier präsentische Bedeutung; die direkte und natürliche deutsche Entsprechung lautet „Ich weiß“.
- source_word: κατοικεῖς
  choice: du wohnst
  rationale: κατοικέω bezeichnet das Wohnen an einem Ort. „Wohnen“ ist im modernen Deutsch natürlicher als „weilen“ oder „seinen Wohnsitz haben“.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: dort, wo der Thron Satans steht
  rationale: Die apokalyptische Metapher bleibt unverändert erhalten. „Steht“ ergänzt im Deutschen idiomatisch die im Griechischen nominal formulierte Ortsangabe.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: du hältst an meinem Namen fest
  rationale: κρατέω bezeichnet hier beharrliches Festhalten. Die Formulierung bewahrt „Name“ als theologisches Bild, ohne es mit Bekenntnis oder Zugehörigkeit auszudeuten.
- source_word: οὐκ ἠρνήσω
  choice: du hast … nicht verleugnet
  rationale: „Verleugnen“ gibt ἀρνέομαι im Zusammenhang mit persönlicher Treue und Bekenntnis treffend wieder.
- source_word: τὴν πίστιν μου
  choice: den Glauben an mich
  rationale: Im Kontext bezeichnet die Genitivverbindung am wahrscheinlichsten den auf Christus gerichteten Glauben. Da μου formal auch anders verstanden werden kann, werden die Alternativen in einer Fußnote bewahrt.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: in den Tagen des Antipas
  rationale: Die zeitliche Wendung wird nah an der griechischen Form und zugleich verständlich wiedergegeben.
- source_word: ὁ μάρτυς μου, ὁ πιστός μου
  choice: meines Zeugen, meines Getreuen
  rationale: Die zweifache Apposition und das wiederholte Possessivverhältnis bleiben erhalten. „Getreuer“ gibt πιστός substantivisch wieder, ohne einen nicht genannten Diensttitel einzuführen.
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: der bei euch getötet wurde
  rationale: „Getötet wurde“ entspricht dem Passiv, während „bei euch“ den Ort beziehungsweise das Umfeld bezeichnet und nicht fälschlich behauptet, die Gemeinde habe Antipas getötet.
- source_word: ὅπου ὁ Σατανᾶς κατοικεῖ
  choice: dort, wo Satan wohnt
  rationale: Die Wiederaufnahme des Ortsmotivs und die Personifikation werden direkt bewahrt.
theological_decisions:
- issue: Bedeutung von τὴν πίστιν μου
  choice: den Glauben an mich
  alternative: wörtlich „meinen Glauben“; möglicherweise „meine Treue“
  rationale: Der Kontext des Nichtverleugnens legt den Glauben an Christus nahe. Die knappe griechische Genitivverbindung bleibt jedoch mehrdeutig; deshalb werden andere grammatisch mögliche Deutungen nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Bedeutung von μάρτυς angesichts des gewaltsamen Todes
  choice: Zeuge
  alternative: Märtyrer
  rationale: „Zeuge“ ist die grundlegende Bedeutung von μάρτυς und bewahrt das Motiv des Zeugnisses. Der Kontext des Todes lässt zugleich die sich entwickelnde Bedeutung „Märtyrer“ anklingen, die deshalb in einer Fußnote vermerkt wird.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem apokalyptischem Ton. „Getreuer“ ist bewusst leicht gehoben, um die eigenständige Apposition ὁ πιστός μου zu erhalten. Gedankenstrich und Wiederholung von „dort, wo“ bilden die eindringliche Ortsrahmung des griechischen Satzes nach.
