id: REV.2.21
reference: Revelation 2:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: de
  text: Und ich gab ihr Zeit, damit sie umkehrt; doch sie will nicht von ihrer sexuellen Unmoral umkehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „doch sie will ihre sexuelle Unmoral nicht bereuen.“'
    reason: Die Hauptfassung bildet ἐκ („von, aus“) formal deutlicher ab; die Alternative entspricht einer geläufigeren deutschen Verbindung mit „bereuen“.
lexical_decisions:
- source_word: ἔδωκα
  choice: ich gab
  rationale: Der Aorist bezeichnet hier am natürlichsten eine vollzogene Gewährung und wird im Deutschen mit dem Präteritum wiedergegeben.
- source_word: χρόνον
  choice: Zeit
  rationale: χρόνος bezeichnet Zeit beziehungsweise eine gewährte Zeitspanne; „Zeit“ ist natürlich und präzise.
- source_word: ἵνα μετανοήσῃ
  choice: damit sie umkehrt
  rationale: ἵνα mit Aorist Konjunktiv drückt den Zweck der gewährten Zeit aus. „Umkehren“ gibt μετανοέω im biblischen Sinn verständlich wieder.
- source_word: οὐ θέλει
  choice: sie will nicht
  rationale: θέλω bezeichnet hier den fehlenden Willen. Die Formulierung bewahrt den voluntativen Gehalt, ohne stärker als der griechische Text „sie weigert sich“ zu sagen.
- source_word: μετανοῆσαι ἐκ
  choice: von … umkehren
  rationale: Die Wiederholung von „umkehren“ erhält den Nachdruck des griechischen Textes; „von“ bildet ἐκ und die Abkehr vom Verhalten unmittelbar ab.
- source_word: πορνείας αὐτῆς
  choice: ihrer sexuellen Unmoral
  rationale: πορνεία bezeichnet grundsätzlich sexuelle Unmoral. Diese Wiedergabe bleibt auch für mögliche symbolische oder götzendienerische Bezüge im apokalyptischen Kontext offen.
theological_decisions:
- issue: Bedeutung von πορνεία im apokalyptischen Tadel
  choice: sexuelle Unmoral
  alternative: Unmoral; Hurerei; Prostitution
  rationale: Die konkrete lexikalische Bedeutung soll im Haupttext stehen, ohne mögliche metaphorische Bezüge auf Götzendienst auszuschließen oder verbindlich festzulegen.
- issue: Verhältnis der Umkehr zur sexuellen Unmoral
  choice: von ihrer sexuellen Unmoral umkehren
  alternative: ihre sexuelle Unmoral bereuen
  rationale: Die Formulierung bewahrt ἐκ als Ausdruck der Abkehr und vermeidet es, μετάνοια lediglich als inneres Bedauern erscheinen zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Verwendung von „umkehren“ bewahrt die Wiederholung und den Nachdruck des griechischen μετανοέω; die Satzstellung bleibt klar und gut verständlich.
