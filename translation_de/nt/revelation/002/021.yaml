  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. „Von ihrer sexuellen Unmoral umkehren“ ist leicht formaler als eine rein idiomatische Umschreibung, aber im würdigen biblischen Register gut verständlich und dient hier der quellennahen Wiedergabe.
