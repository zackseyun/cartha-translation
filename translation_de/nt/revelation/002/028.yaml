id: REV.2.28
reference: Revelation 2:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: de
  text: wie auch ich von meinem Vater empfangen habe; und ich werde ihm den Morgenstern[a] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Stern der Morgenröte“. Die Wendung kann auf messianisch-königliche Bildsprache anspielen und zugleich Offenbarung 22,16 vorwegnehmen, wo Jesus sich selbst als „den hellen Morgenstern“ bezeichnet.'
    reason: Lexikalische Alternative und möglicher innerbiblischer Bezug.
lexical_decisions:
- source_word: ὡς κἀγὼ
  choice: wie auch ich
  rationale: Die Wendung bewahrt sowohl den vergleichenden Anschluss an die vorausgehende Verheißung als auch die additive Betonung von καὶ ἐγώ.
- source_word: εἴληφα
  choice: empfangen habe
  rationale: Das deutsche Perfekt gibt den vollzogenen Empfang mit fortdauernder Bedeutung natürlich wieder; wegen der ausdrücklichen Herkunft vom Vater ist „empfangen“ treffender als „genommen“.
- source_word: παρὰ τοῦ πατρός μου
  choice: von meinem Vater
  rationale: παρά mit Genitiv bezeichnet hier Herkunft beziehungsweise Quelle; die unmittelbare Sohn-Vater-Beziehung bleibt ohne erklärenden Zusatz erhalten.
- source_word: καὶ δώσω αὐτῷ
  choice: und ich werde ihm … geben
  rationale: Das Futur und der Dativbezug auf den Überwinder aus dem vorherigen Kontext werden direkt und idiomatisch wiedergegeben.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: den Morgenstern
  rationale: „Morgenstern“ ist die natürliche, etablierte deutsche Wiedergabe der substantivisch bestimmten Wortgruppe und bewahrt das Bild ohne Auslegung im Haupttext.
theological_decisions:
- issue: Identität und Bedeutung des Morgensterns
  choice: Das Bild bleibt im Haupttext als „Morgenstern“ unaufgelöst.
  alternative: Königliche oder messianische Bestätigung; Christus selbst im Licht von Offenbarung 22,16; endzeitliche Herrlichkeit oder Belohnung.
  rationale: Der Vers erklärt das Symbol nicht ausdrücklich. Die unveränderte Metapher bewahrt die innerbiblischen Bezüge und die theologische Spannung; die Fußnote weist zurückhaltend auf mögliche Resonanzen hin.
- issue: Christologische Beziehung in „von meinem Vater“
  choice: Die Herkunftsangabe wird ohne dogmatische Erläuterung direkt übersetzt.
  alternative: Ausdrückliche Deutung als übertragene Vollmacht oder als heilsgeschichtlicher Empfang.
  rationale: Der Text nennt die Sohn-Vater-Beziehung und den Empfang, erläutert deren dogmatische Tragweite hier aber nicht. Zusätze würden über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang bleibt bewusst kleingeschrieben, weil der Vers syntaktisch an die vorausgehende Aussage anschließt. Das Semikolon macht die Gliederung des griechischen Satzes lesbar, ohne den Zusammenhang zu lösen.
