id: REV.2.7
reference: Revelation 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: de
  text: Wer ein Ohr hat, soll hören, was der Geist den Gemeinden sagt. Wer siegt,[a] dem werde ich vom Baum des Lebens zu essen geben, der im Paradies Gottes ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wer überwindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Wer ein Ohr hat
  rationale: Die substantivierte Partizipialkonstruktion ist allgemein und singularisch. Die idiomatische deutsche Form bewahrt sowohl den repräsentativen Sinn als auch den Singular οὖς.
- source_word: ἀκουσάτω
  choice: soll hören
  rationale: Der Imperativ der dritten Person wird im modernen Deutschen natürlich mit „soll“ wiedergegeben; „hören“ bewahrt zugleich den Anklang zwischen Ohr und Hören.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Die feste Mahnformel in Offenbarung 2–3 bezeichnet im Kontext den göttlichen Geist; die Großschreibung entspricht diesem Bezug.
- source_word: ταῖς ἐκκλησίαις
  choice: den Gemeinden
  rationale: „Gemeinden“ ist für die örtlichen christlichen Gemeinschaften in Offenbarung 2–3 die natürliche und sachlich passende Wiedergabe.
- source_word: τῷ νικῶντι
  choice: Wer siegt
  rationale: νικάω trägt die Bildwelt von Kampf und Sieg. Die verbale Form erhält den fortdauernden, charakterisierenden Sinn des Präsenspartizips.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: dem werde ich … zu essen geben
  rationale: Die deutsche Dativkonstruktion bildet αὐτῷ ab und gibt die Verbindung aus δώσω und Infinitiv natürlich wieder, ohne das persönliche Versprechen abzuschwächen.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: vom Baum des Lebens
  rationale: ἐκ bezeichnet die Herkunft dessen, wovon gegessen wird. ξύλον meint hier aufgrund des Kontextes einen Baum.
- source_word: παραδείσῳ
  choice: Paradies
  rationale: „Paradies“ bewahrt in diesem eschatologischen und intertextuellen Zusammenhang das Gewicht von παράδεισος besser als das allgemeinere „Garten“.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der knappe Genitiv lässt Besitz beziehungsweise Zuordnung offen und wird im Deutschen ebenso knapp wiedergegeben.
theological_decisions:
- issue: Bezug von τὸ πνεῦμα
  choice: der Geist als Gottes Geist
  alternative: ein unbestimmter Geist
  rationale: Die wiederkehrende Formel in Offenbarung 2–3 stellt die Worte an die Gemeinden als göttliche Rede dar. „Der Geist“ bewahrt den Wortlaut, während die Großschreibung den kontextuellen Bezug kennzeichnet.
- issue: Wiedergabe von νικάω in der Verheißungsformel
  choice: siegt
  alternative: überwindet
  rationale: „Siegt“ gibt den Grundsinn und die Siegesbildwelt der Offenbarung unmittelbar wieder. Das traditionelle „überwindet“ bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
- issue: Repräsentativer Singular
  choice: Wer ein Ohr hat … Wer siegt
  alternative: Pluralische oder ausdrücklich geschlechtsneutrale Umformulierung
  rationale: Die wer-Konstruktion ist im Deutschen natürlich, singularisch und inklusiv; sie bewahrt die allgemeine Reichweite, ohne ein im Griechischen nicht ausgedrücktes Geschlecht hervorzuheben.
- issue: Ort des Baumes im Paradies
  choice: der im Paradies Gottes steht
  alternative: der im Paradies Gottes ist
  rationale: ἐστιν sagt wörtlich „ist“. Beim deutschen Subjekt „Baum“ macht „steht“ die räumliche Aussage idiomatisch, ohne eine zusätzliche theologische Bestimmung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Mahn- und Verheißungsformel bleibt knapp und einprägsam; unnötig kirchensprachliche Wendungen werden vermieden.
