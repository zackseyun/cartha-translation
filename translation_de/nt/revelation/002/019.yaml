source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: de
  text: Ich kenne deine Taten, deine Liebe und deinen Glauben[a], deinen Dienst und deine Standhaftigkeit; und deine späteren Taten übertreffen die früheren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Treue“. Das griechische Wort kann hier sowohl Glaube als auch Treue bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Ich kenne
  rationale: οἶδα hat hier präsentische, zuständliche Bedeutung. „Ich kenne“ entspricht der wiederkehrenden Formel in den Sendschreiben und ist im Deutschen natürlich.
- source_word: ἔργα
  choice: Taten
  rationale: ἔργα bezeichnet konkrete Handlungen. „Taten“ ist in modernem Deutsch verständlicher als „Werke“ und wird an beiden Stellen beibehalten.
- source_word: ἀγάπην
  choice: Liebe
  rationale: ἀγάπη bezeichnet hier die tätige Liebe als christliche Tugend.
- source_word: πίστιν
  choice: Glauben
  rationale: πίστις kann in dieser Tugendreihe „Glaube“ oder „Treue“ bedeuten. Der Haupttext bewahrt die übliche Wiedergabe „Glaube“, während die Fußnote die echte Bedeutungsalternative nennt.
- source_word: διακονίαν
  choice: Dienst
  rationale: διακονία bezeichnet praktischen Dienst. „Dienst“ ist zugänglich und vermeidet eine unnötige Einengung auf ein kirchliches Amt.
- source_word: ὑπομονήν
  choice: Standhaftigkeit
  rationale: ὑπομονή meint beharrliches Ausharren unter Druck. „Standhaftigkeit“ gibt diese beständige Haltung idiomatisch wieder.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: deine späteren Taten
  rationale: ἔσχατα steht im zeitlichen Gegensatz zu πρώτων. „Späteren“ macht diesen Vergleich im Deutschen klarer als das potenziell missverständliche „letzten“.
- source_word: πλείονα τῶν πρώτων
  choice: sind zahlreicher als die früheren
  rationale: πλείονα drückt hier einen Vergleich nach Zahl oder Umfang aus. „Zahlreicher“ hält die Aussage konkret; „früheren“ bildet den zeitlichen Gegensatz natürlich ab.
theological_decisions:
- issue: Bedeutung von πίστις in der Tugendreihe
  choice: Glaube
  alternative: Treue
  rationale: Im Kontext kann πίστις sowohl das Vertrauen des Glaubens als auch gelebte Zuverlässigkeit bezeichnen. Der Haupttext entscheidet sich nicht stillschweigend gegen die alternative Lesart, sondern bewahrt sie in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt eng am griechischen Satzbau, wird aber durch ein Semikolon lesbar gegliedert. Wiederholungen des Ausgangstextes werden bewahrt.
