id: REV.2.11
reference: Revelation 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: de
  text: Wer ein Ohr hat, soll hören, was der Geist den Gemeinden sagt. Wer siegt,[a] dem wird der zweite Tod ganz gewiss keinen Schaden zufügen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer überwindet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wird ganz gewiss nicht vom zweiten Tod geschädigt werden“.'
    reason: literal_rendering
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Wer ein Ohr hat
  rationale: Die repräsentative substantivierte Partizipialkonstruktion wird im Deutschen natürlich mit „wer“ wiedergegeben; der Singular „Ohr“ bleibt erhalten.
- source_word: ἀκουσάτω
  choice: soll hören
  rationale: Der Imperativ der dritten Person wird durch „soll hören“ würdig und in modernem Deutsch klar wiedergegeben.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Im wiederkehrenden Sendschreiben-Refrain ist der göttliche Geist als Sprecher gemeint; die Großschreibung entspricht diesem wahrscheinlichen Bezug.
- source_word: ταῖς ἐκκλησίαις
  choice: den Gemeinden
  rationale: Im Kontext von Offenbarung 2–3 bezeichnet ἐκκλησίαι die örtlichen christlichen Gemeinden; „Gemeinden“ ist im Deutschen genauer und natürlicher als „Kirchen“.
- source_word: ὁ νικῶν
  choice: Wer siegt
  rationale: Das präsentische substantivierte Partizip bezeichnet den Menschen, der überwindet beziehungsweise den Sieg erringt. „Wer siegt“ bewahrt die kräftige Bildsprache knapp und natürlich.
- source_word: οὐ μὴ
  choice: ganz gewiss keinen
  rationale: Die verstärkte griechische Verneinung wird mit einer ausdrücklich nachdrücklichen deutschen Formulierung wiedergegeben.
- source_word: ἀδικηθῇ
  choice: Schaden zufügen
  rationale: Das Passiv von ἀδικέω bezeichnet hier eine schädigende Wirkung; die aktive deutsche Konstruktion mit dem zweiten Tod als Subjekt ist idiomatisch und wahrt den Sinn.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: der zweite Tod ... Schaden zufügen
  rationale: ἐκ bezeichnet bei dem Passiv die vom zweiten Tod ausgehende Schädigung. Die Umformung ins Aktiv drückt dieses Verhältnis in natürlichem Deutsch aus.
theological_decisions:
- issue: Bezug von „der Geist“
  choice: Der göttliche Geist spricht zu den Gemeinden.
  alternative: Der prophetische Geist im allgemeineren Sinn.
  rationale: Der wiederkehrende Refrain in Offenbarung 2–3 stellt den Geist als göttlichen Sprecher dar, ohne den griechischen Ausdruck durch einen erklärenden Zusatz zu erweitern.
- issue: Repräsentative maskuline Formen
  choice: Geschlechtsübergreifende deutsche „wer“-Konstruktionen ohne zusätzliches Pronomen.
  alternative: Formale Wiedergabe mit „derjenige ... er“.
  rationale: Die griechischen maskulinen Singularformen haben repräsentative Kraft. Die „wer“-Konstruktion bewahrt den Singular und schließt im heutigen Deutsch alle angesprochenen Personen natürlich ein.
- issue: Bedeutung des „zweiten Todes“
  choice: Den Ausdruck unverändert und ohne Auslegung bewahren.
  alternative: Als endgültiges Gericht oder ewige Verdammnis ausdeuten.
  rationale: Die Offenbarung erläutert den theologisch gewichtigen Ausdruck an anderer Stelle selbst; der Vers soll diese Spannung nicht durch eine Paraphrase vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Mahnformel bleibt erhalten; „Gemeinden“ entspricht dem konkreten Kontext der sieben angesprochenen Versammlungen. Die nachdrückliche Verneinung wird hörbar gemacht, ohne archaische Wendungen zu verwenden.
