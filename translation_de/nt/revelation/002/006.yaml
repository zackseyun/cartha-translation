  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: de
  text: 'Doch dies hast du: Du hasst die Taten der Nikolaiten[a], die auch ich hasse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Werke«. Das griechische Wort bezeichnet hier Handlungen oder Praktiken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden Tadel knapp und natürlich.
- source_word: τοῦτο ἔχεις
  choice: dies spricht für dich
  rationale: Gibt die im Zusammenhang positive Bedeutung der wörtlichen Wendung »dies hast du« in natürlichem Deutsch wieder.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt den Inhalt dessen ein, was für die Gemeinde spricht.
- source_word: μισεῖς
  choice: du hasst
  rationale: Bewahrt die Stärke von μισέω und entspricht demselben Verb in der Schlussklausel.
- source_word: τὰ ἔργα
  choice: die Taten
  rationale: Bezeichnet hier die Handlungen oder Praktiken der Gruppe und klingt im modernen Deutsch natürlicher als »Werke«.
- source_word: τῶν Νικολαϊτῶν
  choice: der Nikolaiten
  rationale: Verwendet die im Deutschen übliche Form des Gruppennamens.
- source_word: ἃ κἀγὼ μισῶ
  choice: die auch ich hasse
  rationale: Das Relativpronomen bezieht sich eindeutig auf die Taten; »auch ich« bewahrt die ausdrückliche Übereinstimmung des Sprechers.
theological_decisions:
- issue: Gegenstand des Hasses
  choice: Gehasst werden ausdrücklich die Taten der Nikolaiten.
  alternative: Eine freiere Formulierung könnte so verstanden werden, als seien die Menschen selbst Gegenstand des Hasses.
  rationale: τὰ ἔργα ist das direkte Objekt; der Relativsatz nimmt diese Taten wieder auf.
- issue: Übereinstimmung des Sprechers mit der Gemeinde
  choice: »die auch ich hasse«
  alternative: »die ich ebenfalls verabscheue«
  rationale: Die Wiederholung von μισέω bleibt erhalten und wird nicht abgeschwächt oder lexikalisch variiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas freie Wendung »dies spricht für dich« macht die lobende Funktion von τοῦτο ἔχεις verständlich; der Doppelpunkt erhält die klare inhaltliche Gliederung.
