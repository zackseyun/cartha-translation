id: REV.2.2
reference: Revelation 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: de
  text: Ich kenne deine Taten, deine Mühe und deine Ausdauer. Ich weiß auch, dass du böse Menschen nicht ertragen kannst. Du hast diejenigen geprüft, die sich Apostel nennen, es aber nicht sind, und hast erkannt, dass sie Lügner sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: Ich kenne / Ich weiß
  rationale: Das Verb bezeichnet gegenwärtiges Wissen. Vor dem nominalen Objekt ist „Ich kenne“ idiomatisch; der zweite Satz nimmt die Aussage natürlich mit „Ich weiß auch“ auf.
- source_word: τὰ ἔργα σου
  choice: deine Taten
  rationale: „Taten“ gibt den breiten Sinn konkreter Handlungen in natürlichem, würdigem Deutsch wieder; „Werke“ wäre formaler und im heutigen Sprachgebrauch stärker theologisch geprägt.
- source_word: τὸν κόπον
  choice: deine Mühe
  rationale: κόπος bezeichnet anstrengende, ermüdende Arbeit. „Mühe“ bewahrt den Gedanken des hohen Einsatzes und ist hier natürlicher als „Arbeit“.
- source_word: τὴν ὑπομονήν σου
  choice: deine Ausdauer
  rationale: „Ausdauer“ drückt standhaftes Ausharren unter Belastung knapp und verständlich aus.
- source_word: οὐ δύνῃ βαστάσαι
  choice: du ... nicht ertragen kannst
  rationale: Die Formulierung hält sich eng an das Bild des Tragens, bezeichnet im Kontext aber die Weigerung beziehungsweise Unfähigkeit, böse Menschen zu dulden.
- source_word: κακούς
  choice: böse Menschen
  rationale: Das substantivierte maskuline Adjektiv bezeichnet hier Personen; „Menschen“ gibt den gemeinten Referenzbereich ohne unnötige geschlechtliche Einschränkung wieder.
- source_word: ἐπείρασας
  choice: du hast ... geprüft
  rationale: πειράζω bezeichnet hier die Prüfung eines erhobenen Anspruchs, nicht eine Versuchung.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: die sich Apostel nennen
  rationale: Die reflexive Konstruktion beschreibt einen selbst erhobenen Anspruch und wird im Deutschen präzise und idiomatisch wiedergegeben.
- source_word: ἀποστόλους
  choice: Apostel
  rationale: Im gemeindlichen Zusammenhang ist der Titel für bevollmächtigte Gesandte wahrscheinlich; die traditionelle Bezeichnung bewahrt diese mögliche technische Bedeutung.
- source_word: ψευδεῖς
  choice: als Lügner entlarvt
  rationale: Das prädikative Adjektiv bezeichnet die Personen als falsch beziehungsweise unwahr. Im Zusammenhang mit ihrem unwahren Selbstanspruch ist „als Lügner entlarvt“ natürliches Deutsch; die formal nähere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Status der Personen, die sich ἀπόστολοι nennen
  choice: Apostel
  alternative: Gesandte / Boten
  rationale: Der Kontext betrifft die Prüfung eines Autoritätsanspruchs in der Gemeinde. „Apostel“ bewahrt die wahrscheinlich technische Bedeutung, ohne spätere Amtslehren in den Text einzutragen.
- issue: Aussage von ψευδεῖς über die Anspruchsteller
  choice: als Lügner entlarvt
  alternative: als falsch befunden
  rationale: Der Text urteilt negativ über die Personen und ihren Anspruch. Die Hauptfassung formuliert dies idiomatisch; die Fußnote bewahrt die weniger zugespitzte, formal nähere Möglichkeit.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die lange griechische Satzkette wurde zur besseren Lesbarkeit in drei Sätze gegliedert, ohne die inhaltliche Abfolge zu verändern. Der Wechsel von „kennen“ zu „wissen“ folgt deutscher Idiomatik.
