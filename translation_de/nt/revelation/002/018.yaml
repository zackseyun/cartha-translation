  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: de
  text: 'Und dem Engel[a] der Gemeinde in Thyatira schreibe: So spricht der Sohn Gottes, dessen Augen wie eine Feuerflamme sind und dessen Füße glänzendem Erz[b] gleichen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dem Boten.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort ist selten und bezeichnet möglicherweise allgemeiner ein veredeltes, leuchtendes Metall oder eine entsprechende Legierung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: Engel
  rationale: In der wiederkehrenden Anredeformel der Sendschreiben ist „Engel“ die naheliegende apokalyptische Wiedergabe; „Bote“ bleibt lexikalisch möglich und wird in einer Fußnote genannt.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: „Gemeinde“ bezeichnet im modernen deutschen kirchlichen Sprachgebrauch natürlich und verständlich die örtliche christliche Gemeinschaft.
- source_word: Τάδε λέγει
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird mit der im Deutschen würdigen und vertrauten Wendung „So spricht“ wiedergegeben.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Der ausdrückliche christologische Titel wird unmittelbar und vollständig bewahrt.
- source_word: ὁ ἔχων
  choice: dessen … sind
  rationale: Der substantivierte Partizipialausdruck wird als natürlicher deutscher Relativsatz an den Sprecher angeschlossen.
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: dessen Augen wie eine Feuerflamme sind
  rationale: Die Vergleichsform und das eindringliche apokalyptische Bild bleiben eng am griechischen Wortlaut erhalten.
- source_word: οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: dessen Füße glänzendem Erz gleichen
  rationale: „Erz“ wahrt die Unbestimmtheit des seltenen Metallbegriffs besser als eine Festlegung auf Bronze; „glänzend“ vermittelt den Eindruck eines veredelten, leuchtenden Metalls.
theological_decisions:
- issue: Christologischer Titel in der direkten Selbstvorstellung
  choice: der Sohn Gottes
  alternative: keine abschwächende Umschreibung
  rationale: Der griechische Text bezeichnet den Sprecher ausdrücklich als Sohn Gottes; die Übersetzung erhält diese Aussage ohne dogmatische Erweiterung oder Abschwächung.
- issue: Bezug von ἀγγέλῳ in der Anrede an Thyatira
  choice: Engel
  alternative: Bote
  rationale: „Engel“ entspricht dem wahrscheinlichen apokalyptischen Sprachgebrauch der sieben Sendschreiben, während die mögliche menschliche Bedeutung „Bote“ durch die Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel „So spricht“ und die apokalyptischen Bilder werden bewahrt; seltene oder mehrdeutige Begriffe werden nicht unnötig präzisiert.
