  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: de
  text: Doch[a] haltet fest, was ihr habt, bis ich komme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haltet nur fest, was ihr habt, bis ich komme.“'
    reason: Lexikalische Alternative für πλὴν, das hier auch stärker einschränkend als „nur“ verstanden werden kann.
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Die Partikel leitet nach dem Vorhergehenden eine einschränkende beziehungsweise gegensätzliche Schlussfolgerung ein. „Doch“ gibt diese Kraft knapp und natürlich wieder; die mögliche stärker eingrenzende Bedeutung wird in der Fußnote bewahrt.
- source_word: ὃ ἔχετε
  choice: was ihr habt
  rationale: Das substantivierte Neutrum des Relativpronomens mit ἔχετε bezeichnet allgemein das, was die Angesprochenen bereits besitzen beziehungsweise festhalten. „Was ihr habt“ ist idiomatisch und lässt den Bezug offen.
- source_word: κρατήσατε
  choice: haltet fest
  rationale: Der Aoristimperativ von κρατέω fordert nachdrücklich zum Bewahren und unbeirrten Festhalten auf. „Haltet fest“ ist im modernen Deutsch klar und würdevoll.
- source_word: ἄχρι οὗ ἂν
  choice: bis
  rationale: Die Konstruktion bezeichnet die künftige zeitliche Grenze des Festhaltens. Das deutsche „bis“ gibt sie natürlich und vollständig wieder.
- source_word: ἥξω
  choice: ich komme
  rationale: ἥκω bezeichnet hier das Kommen beziehungsweise Eintreffen des Sprechers. „Ich komme“ bewahrt den eschatologischen Klang, ohne Art oder Zeitpunkt dieses Kommens festzulegen.
theological_decisions:
- issue: Ob Jesu Aussage speziell sein endgültiges eschatologisches Kommen oder allgemeiner ein Kommen zum Gericht beziehungsweise zur Heimsuchung dieser Gemeinde meint
  choice: „bis ich komme“ ohne nähere Bestimmung
  alternative: „bis ich zum Gericht komme“ oder „bis zu meiner endgültigen Wiederkunft“
  rationale: Der griechische Text bestimmt Art und Zeitpunkt des Kommens nicht ausdrücklich. Die offene Formulierung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Mahnton. Die Pluralformen „ihr“ und „haltet“ entsprechen der Anrede an die Gemeinde. Der Fußnotenmarker steht nach dem vollständigen Satz, dessen einleitende Partikel die Fußnote betrifft.
