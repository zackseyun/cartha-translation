  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: de
  text: Und wer siegt[a] und meine Werke[b] bis zum Ende hält, dem werde ich Vollmacht über die Völker geben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „überwindet“.'
    reason: lexical_alternative
  - marker: b
    text: „Meine Werke“ kann Jesu eigene Taten, seinem Wirken entsprechende Werke oder die von ihm geforderten Werke bezeichnen; das Griechische legt die Beziehung nicht genauer fest.
    reason: lexical_alternative
  - marker: c
    text: Im Griechischen stehen ein maskulines Singularpartizip und ein maskulines Singularpronomen („der … ihm“); sie bezeichnen hier repräsentativ jede entsprechende Person.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: wer siegt
  rationale: Das substantivierte Präsenspartizip bezeichnet den Menschen, der durch standhaftes Überwinden gekennzeichnet ist. „Siegt“ bewahrt die aktive Kampf- und Siegesbildsprache der Offenbarung; „überwindet“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: ὁ τηρῶν
  choice: bewahrt
  rationale: τηρέω kann „bewahren“, „halten“, „befolgen“ oder „hüten“ bedeuten. „Bewahrt“ lässt sowohl treues Festhalten als auch gehorsames Befolgen anklingen, ohne die Bedeutung auf bloßen Gehorsam einzuengen.
- source_word: ἄχρι τέλους
  choice: bis zum Ende
  rationale: Die Wendung bezeichnet das andauernde Festhalten bis zum Endpunkt und wird im Deutschen unmittelbar und natürlich wiedergegeben.
- source_word: τὰ ἔργα μου
  choice: meine Werke
  rationale: Die ungewöhnliche Formulierung des Griechischen wird erhalten. Sie legt nicht ausdrücklich fest, ob damit Jesu eigene Taten, seinem Wirken entsprechende Werke oder von ihm geforderte Werke gemeint sind.
- source_word: δώσω αὐτῷ
  choice: dem werde ich … geben
  rationale: Die deutsche Korrelativkonstruktion „wer …, dem …“ gibt den singularischen Bezug natürlich wieder und erhält das ausdrückliche indirekte Objekt.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: ἐξουσία bezeichnet hier verliehene Autorität beziehungsweise das Recht zu herrschen. „Vollmacht“ hebt diesen übertragenen Herrschaftsanspruch präziser hervor als das allgemeinere „Macht“.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: über die Völker
  rationale: Im Kontext der Offenbarung sind die Völker der Welt gemeint. „Über“ gibt den Herrschaftssinn von ἐπί mit Genitiv wieder; „Heiden“ würde unnötig einen Gegensatz zu Juden in den Vordergrund rücken.
theological_decisions:
- issue: Beziehung in „meine Werke“
  choice: Die wörtlich offene Formulierung „meine Werke“ bleibt stehen.
  alternative: „die Werke, die ich fordere“ oder „was ich geboten habe“
  rationale: Der griechische Text bestimmt die Beziehung des Possessivpronomens zu den Werken nicht näher. Eine engere Auslegung würde eine theologische Deutung in den Haupttext eintragen.
- issue: Singularische Personenbezeichnung
  choice: „wer …, dem …“ im generisch-repräsentativen Singular
  alternative: Pluralische oder ausdrücklich geschlechtsneutrale Umformulierung
  rationale: Das Griechische verwendet substantivierte Partizipien und ein Pronomen im maskulinen Singular. Die deutsche Konstruktion gibt den repräsentativen Singular idiomatisch wieder, ohne eine Beschränkung auf Männer auszudrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „wer …, dem …“ ist gut verständlich und bildet die griechische Singularstruktur natürlich ab. „Meine Werke“ bleibt bewusst ungeglättet, um die echte Bedeutungsbreite zu bewahren.
