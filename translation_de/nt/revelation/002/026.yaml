    issue: „meine Werke … bewahrt“
    rationale: Bei Werken bedeutet „bewahren“ im heutigen Deutsch gewöhnlich schützen, aufheben oder erhalten. Für τηρεῖν in dieser Verbindung ist „hält“ idiomatischer und wahrt die Offenheit zwischen Beachten, Befolgen und treuem Festhalten.
