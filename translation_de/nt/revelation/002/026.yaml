  verdict: revise
  source_fidelity: Die Satzstruktur „wer …, dem werde ich … geben“ gibt die substantivierten maskulinen Singularpartizipien und αὐτῷ idiomatisch sowie repräsentativ wieder. „Vollmacht über die Völker“ trifft ἐξουσίαν ἐπὶ τῶν ἐθνῶν präzise. „Bewahrt“ ist bei τὰ ἔργα μου jedoch missverständlich, da es im Deutschen primär ein Schützen oder Erhalten von Werken nahelegt, nicht ihr treues Halten bzw. Befolgen.
  naturalness: Der Vers ist in modernem, würdigem Standarddeutsch flüssig. Mit „hält“ wird die Verbindung zu „meine Werke“ deutlich natürlicher und zugleich nahe am offenen Sinn von τηρέω.
  terminology: „Siegt“, „meine Werke“, „Vollmacht“ und „Völker“ sind tragfähige Wiedergaben. „Meine Werke“ bleibt zu Recht ungeglättet. Die Anmerkung zur maskulinen Singulargrammatik wird genauer formuliert, ohne dem deutschen generischen „wer“ eine männliche Einschränkung zuzuschreiben.
