id: REV.2.20
reference: Revelation 2:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: de
  text: Doch ich habe gegen dich, dass du die Frau Isebel[a] duldest, die sich selbst Prophetin nennt[b]. Sie lehrt und verführt[c] meine Sklaven dazu, sexuelle Unmoral zu begehen und Speisen zu essen, die Götzen geopfert wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „deine Frau Isebel“ statt „die Frau Isebel“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „die behauptet, eine Prophetin zu sein“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in die Irre führt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Leitet einen deutlichen Gegensatz zum vorausgehenden Lob ein und klingt im modernen Deutschen würdig und natürlich.
- source_word: ἔχω κατὰ σοῦ
  choice: ich habe gegen dich
  rationale: Bewahrt die knappe Anklageformel des Griechischen; der folgende dass-Satz nennt den konkreten Vorwurf.
- source_word: ἀφεῖς
  choice: du ... gewähren lässt
  rationale: Bezeichnet hier das schuldhafte Dulden fortgesetzten schädlichen Handelns, nicht Vergebung.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: die Frau Isebel
  rationale: Gibt den bezeugten Haupttext wieder, ohne die Variante „deine Frau“ beziehungsweise „deine Ehefrau“ in den Text aufzunehmen. „Isebel“ ist die etablierte deutsche Namensform.
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: die sich selbst Prophetin nennt
  rationale: Bildet sowohl den Selbstbezug als auch die ausdrücklich feminine Bezeichnung prägnant ab, ohne zusätzlich über die Wahrhaftigkeit ihres Anspruchs zu urteilen.
- source_word: διδάσκει
  choice: sie lehrt
  rationale: Der Präsens beschreibt ihre andauernde beziehungsweise charakteristische Tätigkeit.
- source_word: πλανᾷ
  choice: verführt
  rationale: Drückt aus, dass sie andere vom rechten Weg zu falschem Verhalten bringt; die Alternative „in die Irre führt“ wird in einer Fußnote genannt.
- source_word: τοὺς ἐμοὺς δούλους
  choice: meine Sklaven
  rationale: Bewahrt den Aspekt der Zugehörigkeit und Bindung in δοῦλοι, der durch das Possessivpronomen besonders hervortritt.
- source_word: πορνεῦσαι
  choice: sexuelle Unmoral zu begehen
  rationale: Bezeichnet unerlaubtes sexuelles Verhalten klar und in gegenwärtigem Deutsch, ohne den Begriff unnötig einzuengen.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: Speisen zu essen, die Götzen geopfert wurden
  rationale: Gibt den Bezug auf heidnische Opfer verständlich wieder, ohne εἰδωλόθυτα auf Fleisch allein zu beschränken.
theological_decisions:
- issue: Identität Isebels
  choice: „Isebel“ bleibt als Name oder Bezeichnung unkommentiert im Text stehen.
  alternative: Der Name könnte wörtlich gemeint oder eine symbolische Anspielung auf die alttestamentliche Isebel sein.
  rationale: Der Vers selbst entscheidet nicht, ob es sich um ihren tatsächlichen Namen oder um eine typologische Bezeichnung handelt.
- issue: Wiedergabe von δοῦλοι
  choice: meine Sklaven
  alternative: meine Diener
  rationale: Der Besitzbezug „meine“ hebt die Zugehörigkeit zu Christus hervor; „Sklaven“ erhält diesen im griechischen Ausdruck vorhandenen Aspekt deutlich.
- issue: Verhältnis von Lehre, Irreführung und den Infinitiven
  choice: Beide Tätigkeiten führen dazu, dass die Betroffenen sexuelle Unmoral begehen und Götzenopferspeisen essen.
  alternative: Die Infinitive könnten syntaktisch besonders eng nur mit dem Irreführen verbunden gelesen werden.
  rationale: Die deutsche Formulierung lässt Lehren und Verführen als zusammengehöriges Wirken erscheinen, ohne die beiden Verben miteinander gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde nach „nennt“ geteilt, damit die lange griechische Konstruktion verständlich bleibt. „Götzen“ bewahrt den religiösen Gegensatz des Ausgangstextes; „Speisen“ vermeidet eine sachlich nicht zwingende Verengung auf Opferfleisch.
