id: REV.2.5
reference: Revelation 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: de
  text: Denk also daran, woher du gefallen bist[a], kehre um und tu wieder, was du am Anfang getan hast. Sonst komme ich zu dir und werde deinen Leuchter von seinem Platz wegnehmen[b], wenn du nicht umkehrst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus welcher Höhe du gefallen bist“. Wörtlich steht im Griechischen: „woher du gefallen bist“; möglicherweise ist eine Höhe als Bild mitgemeint.'
    reason: lexical_alternative
  - marker: b
    text: Der „Leuchter“ ist in Offenbarung 1,20 das Bild für eine Gemeinde.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: Denk daran
  rationale: Der präsentische Imperativ fordert anhaltendes Erinnern; die idiomatische deutsche Wendung gibt den Befehl natürlich wieder.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folgerung aus dem vorherigen Tadel und klingt im modernen Deutsch natürlicher als „daher“.
- source_word: πόθεν πέπτωκας
  choice: wovon du gefallen bist
  rationale: Bewahrt das im Griechischen ausdrücklich offene „woher/wovon“ und die Zustandswirkung des Perfekts, ohne eine nicht ausdrücklich genannte Höhe oder einen Abfall vom Glauben einzutragen.
- source_word: μετανόησον / μετανοήσῃς
  choice: kehre um / umkehrst
  rationale: „Umkehren“ ist in diesem geistlich-ethischen Zusammenhang verständlich und gibt die geforderte grundlegende Neuorientierung wieder; die Wiederholung desselben Verbs bleibt erkennbar.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: tu wieder, was du am Anfang getan hast
  rationale: Eine natürliche deutsche Wiedergabe des zeitlichen Sinns von πρῶτα; „wieder“ ist aus der Rückkehr zu den anfänglichen Taten impliziert.
- source_word: εἰ δὲ μή
  choice: Sonst
  rationale: Gibt die knappe konditionale Warnung idiomatisch und nachdrücklich wieder.
- source_word: ἔρχομαί σοι
  choice: komme ich zu dir
  rationale: Bewahrt die anschauliche Unmittelbarkeit des griechischen Präsens und ergänzt nicht das interpretierende „gegen dich“.
- source_word: κινήσω
  choice: werde ... wegnehmen
  rationale: Im Zusammenhang mit ἐκ τοῦ τόπου bezeichnet das Bewegen die Entfernung vom bisherigen Platz; „wegnehmen“ vermittelt diese Gerichtsdrohung klar.
- source_word: τὴν λυχνίαν σου
  choice: deinen Leuchter
  rationale: λύχνια bezeichnet einen Leuchter bzw. Lampenständer, nicht die Lampe selbst; „Leuchter“ bewahrt das in Offenbarung 1,20 erklärte Bild.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: von seinem Platz
  rationale: Direkte, natürliche Wiedergabe der räumlichen Aussage; das grammatische Geschlecht wird im Deutschen an „Leuchter“ angepasst.
theological_decisions:
- issue: Bedeutung der Drohung, den Leuchter wegzunehmen
  choice: Das symbolische Bild bleibt stehen, ohne es als Verlust des Heils oder ausschließlich als Verlust der Zeugnisfunktion auszudeuten.
  alternative: Ausdrückliche Deutung als Ende der Gemeinde, Verlust ihres Zeugnisses oder Verlust individuellen Heils.
  rationale: Nach Offenbarung 1,20 stehen die Leuchter für Gemeinden. Der Vers droht der Gemeinde Gericht an, legt aber keine einzelne systematisch-theologische Deutung der Folgen fest.
- issue: Sinn von πόθεν πέπτωκας
  choice: Die offene Herkunftsformulierung „wovon du gefallen bist“ wird beibehalten.
  alternative: „Aus welcher Höhe du gefallen bist“ oder „wie tief du gefallen bist“.
  rationale: Eine Höhenmetapher ist naheliegend, wird im griechischen Wortlaut jedoch nicht ausdrücklich genannt; die Übersetzung bewahrt daher die Ambiguität.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular und die eindringliche Folge von Imperativen bleiben erhalten. „Kehre um“ ist allgemein verständlich und weniger kirchensprachlich als „tu Buße“, ohne die moralisch-geistliche Forderung abzuschwächen.
