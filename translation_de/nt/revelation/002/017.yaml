id: REV.2.17
reference: Revelation 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: de
  text: Wer ein Ohr hat, der höre, was der Geist den Gemeinden sagt! Wer siegt[a], dem werde ich von dem verborgenen Manna geben. Ich werde ihm auch einen weißen Stein[b] geben, auf dem ein neuer Name geschrieben steht, den niemand kennt außer dem, der ihn empfängt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: überwindet.'
    reason: lexical_alternative
  - marker: b
    text: Der »weiße Stein« könnte an einen Stimmstein, ein Zeichen des Freispruchs oder eine Zutrittsmarke erinnern; der Text selbst legt den Hintergrund nicht fest.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Wer ein Ohr hat
  rationale: Die singularische Bildrede des Griechischen bleibt erhalten und klingt in der festen deutschen Mahnformel natürlich.
- source_word: ἀκουσάτω
  choice: der höre
  rationale: Der Imperativ wird in einer würdigen, im Deutschen idiomatischen Aufforderungsform wiedergegeben.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der Kontext meint den göttlichen Geist; da der griechische Text nicht ausdrücklich »Heiliger Geist« sagt, bleibt die kürzere Bezeichnung stehen.
- source_word: ταῖς ἐκκλησίαις
  choice: den Gemeinden
  rationale: Im Zusammenhang der Sendschreiben bezeichnet ἐκκλησίαις die angesprochenen örtlichen christlichen Gemeinden.
- source_word: τῷ νικῶντι
  choice: Wer siegt
  rationale: Die Formulierung bewahrt den Siegesgedanken von νικάω und ist im modernen Deutschen klar; »wer überwindet« wird als mögliche Alternative vermerkt.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: von dem verborgenen Manna
  rationale: Der Genitiv nach »geben« bezeichnet einen Anteil an dem Manna; »verborgen« gibt den fortdauernden Zustand des Verborgenseins wieder.
- source_word: ψῆφον λευκήν
  choice: einen weißen Stein
  rationale: »Stein« ist eine zurückhaltende Wiedergabe von ψῆφος und legt die nicht erklärte symbolische Funktion nicht fest.
- source_word: ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον
  choice: auf dem ein neuer Name geschrieben steht
  rationale: Die räumliche Beziehung und der bleibende Zustand der Aufschrift werden in natürlichem Deutsch ausgedrückt, ohne die Aussage inhaltlich zu erweitern.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: den niemand kennt außer dem, der ihn empfängt
  rationale: Das Relativpronomen bezieht sich grammatisch auf »Name«. Die Formulierung erhält die exklusive Kenntnis des Empfangenden und lässt die enge Verbindung von Stein und Name bestehen.
theological_decisions:
- issue: Bedeutung von τῷ νικῶντι
  choice: »Wer siegt« im Haupttext
  alternative: »Wer überwindet«
  rationale: νικάω trägt in der Offenbarung sowohl den Gedanken des Siegens als auch des Überwindens. Der Haupttext wählt eine knappe, anschauliche Form; die Fußnote bewahrt die traditionelle Alternative.
- issue: Symbolischer Hintergrund des weißen Steins
  choice: Keine bestimmte Deutung im Haupttext
  alternative: Stimmstein, Freispruchszeichen oder Zutrittsmarke
  rationale: Der Vers erklärt die kulturelle oder symbolische Funktion des Steins nicht. Die Übersetzung bewahrt diese Offenheit, während die Fußnote mögliche Hintergründe nennt.
- issue: Generische maskuline Einzahl
  choice: Singularformen entsprechend dem griechischen Text beibehalten
  alternative: Geschlechtsneutrale Pluralform oder wiederholtes »wer«
  rationale: Die grammatisch maskuline Einzahl hat hier allgemeinen Geltungsbereich. Die deutsche Form folgt dieser Struktur, ohne die Verheißung auf Männer zu beschränken.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die feste Mahnformel »der höre« bewahrt die eindringliche Aufforderung; die Bildsprache bleibt bewusst unerklärt.
