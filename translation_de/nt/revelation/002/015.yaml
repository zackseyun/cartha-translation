  text: οὕτως ἔχεις καὶ σὺ κρατοῦντας τὴν ⸀διδαχὴν Νικολαϊτῶν ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: de
  text: So hast auch du Leute, die ebenso an der Lehre der Nikolaiten festhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in gleicher Weise“. Das griechische Wort kann betonen, dass sie an dieser Lehre auf eine Weise festhalten, die mit den im vorhergehenden Vers genannten Personen vergleichbar ist.'
    reason: lexikalische Alternative und mehrdeutiger Satzbezug
lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Greift den vorhergehenden Tadel auf und leitet den entsprechenden Vergleich knapp und natürlich ein.
- source_word: ἔχεις
  choice: hast
  rationale: Bewahrt die direkte Anrede und den Grundsinn des Verbs; gemeint sind Personen innerhalb der Gemeinde.
- source_word: καὶ σὺ
  choice: auch du
  rationale: Gibt die betonte Einbeziehung und den Vergleich mit dem zuvor genannten Fall wieder.
- source_word: κρατοῦντας
  choice: Leute, die … festhalten
  rationale: Drückt das beharrliche Vertreten beziehungsweise Festhalten an einer Lehre idiomatisch aus.
- source_word: διδαχὴν
  choice: Lehre
  rationale: Ist im Deutschen die natürliche und sachlich passende Wiedergabe für den Inhalt des Gelehrten.
- source_word: Νικολαϊτῶν
  choice: Nikolaiten
  rationale: Verwendet die im Deutschen etablierte Form des Gruppennamens.
- source_word: ὁμοίως
  choice: ebenso
  rationale: Bewahrt die vergleichende Bedeutung und lässt offen, ob sich das Adverb besonders auf das Festhalten oder auf den gesamten Sachverhalt bezieht.
theological_decisions:
- issue: Bezug von ὁμοίως innerhalb des Satzes
  choice: „ebenso“ steht unmittelbar vor „an der Lehre … festhalten“
  alternative: „Ebenso hast auch du Leute …“ oder „So hast auch du in gleicher Weise Leute …“
  rationale: 'Die Stellung ergibt einen natürlichen deutschen Satz, ohne die griechische Mehrdeutigkeit völlig aufzulösen: Der Vergleich kann die Art des Festhaltens oder den gesamten, Vers 14 entsprechenden Zustand betreffen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. „Leute“ macht den im substantivierten Partizip enthaltenen Personenbezug verständlich; „festhalten“ bewahrt die nachdrückliche Bedeutung von κρατέω.
