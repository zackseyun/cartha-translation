  terminology: „Bedrängnis“, „Armut“, „reich“, „Verleumdung“, „Juden“ und „Synagoge Satans“ sind angemessen und textnah. Die Fußnote wahrt die lexikalische Alternative zu „Synagoge“ und „Verleumdung/Lästerung“, ohne den polemischen Wortlaut im Haupttext umzudeuten. Ihre Kontextualisierung verhindert eine unzulässige Verallgemeinerung, ohne eine zusätzliche Übersetzungsbehauptung aufzustellen.
