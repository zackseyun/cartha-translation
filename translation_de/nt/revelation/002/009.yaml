  rationale: Die einzige Änderung ersetzt das etwas unidiomatische „durch die, die“ durch „von denen, die“. Damit wird die im Griechischen durch ἐκ ausgedrückte Herkunft der Verleumdung natürlicher wiedergegeben; Bedeutung, Register, Ambiguität und Fußnoteninhalt bleiben unverändert.
