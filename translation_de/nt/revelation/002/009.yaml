id: REV.2.9
reference: Revelation 2:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: de
  text: Ich kenne deine Bedrängnis und deine Armut – doch du bist reich – und die Verleumdung von denen, die von sich sagen, sie seien Juden, und es nicht sind, sondern eine Synagoge Satans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Synagoge“ kann auch „Versammlung“ oder „Gemeinschaft“ bedeuten. Die scharfe Wendung „Synagoge Satans“ bezeichnet hier die im Vers angesprochene Gruppe und ist nicht als pauschales Urteil über jüdische Menschen oder Synagogen zu verstehen. Für „Verleumdung“ ist auch „Lästerung“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: Bedrängnis
  rationale: Bezeichnet Druck, Not oder bedrängende Verfolgung. „Bedrängnis“ wahrt die Breite und den würdigen biblischen Ton, ohne eine bestimmte endzeitliche Deutung festzulegen.
- source_word: πτωχείαν
  choice: Armut
  rationale: Die klare und natürliche deutsche Entsprechung; ein stärkeres „äußerste Armut“ würde den Grad interpretierend festlegen.
- source_word: πλούσιος
  choice: reich
  rationale: Bewahrt den pointierten Gegensatz zur materiellen Armut. Die vermutlich nichtmaterielle Bedeutung wird nicht durch einen Zusatz wie „geistlich“ explizit gemacht.
- source_word: βλασφημίαν
  choice: Verleumdung
  rationale: Im Zusammenhang geht es um feindselige, ehrverletzende Rede gegen Menschen. „Lästerung“ wäre ebenfalls möglich, wird im heutigen Deutsch jedoch häufig als Rede gegen Gott verstanden.
- source_word: ἐκ τῶν λεγόντων
  choice: durch die, die … sagen
  rationale: ἐκ kennzeichnet hier die Urheber bzw. den Ausgangspunkt der Verleumdung. „Durch“ drückt diese Herkunft im Deutschen natürlich aus.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: die von sich sagen, sie seien Juden
  rationale: „Von sich sagen“ gibt die reflexive Konstruktion ausdrücklich und idiomatisch wieder; der Konjunktiv markiert die wiedergegebene Behauptung, ohne sie vorweg zu beurteilen.
- source_word: συναγωγὴ
  choice: Synagoge
  rationale: Bewahrt die historische und lexikalische Besonderheit sowie die scharfe Ironie des Ausdrucks; das Wort kann zugleich eine Versammlung oder Gemeinschaft bezeichnen.
- source_word: τοῦ Σατανᾶ
  choice: Satans
  rationale: Der deutsche Genitiv bildet die knappe und scharfe griechische Genitivverbindung ab, ohne ihre genaue Relation weiter auszudeuten.
theological_decisions:
- issue: Die polemische Aussage über Menschen, die von sich sagen, sie seien Juden, und es nicht sind
  choice: „Juden“ wörtlich beibehalten und den Gegensatz ohne erklärenden Zusatz wiedergeben.
  alternative: „wahre Juden“ oder „Gottes Volk“
  rationale: Ἰουδαίους steht ausdrücklich im Ausgangstext. Zusätze wie „wahre“ oder eine Paraphrase als „Gottes Volk“ würden die wahrscheinlich auf beanspruchte Bundeszugehörigkeit zielende Polemik auslegen und könnten die Aussage entweder verengen oder verschärfen. Der Vers darf nicht als pauschale Bezeichnung jüdischer Menschen oder jüdischer Gemeinden verallgemeinert werden.
- issue: Art des Reichtums
  choice: „doch du bist reich“ ohne Qualifikation
  alternative: „doch du bist geistlich reich“
  rationale: Der Zusammenhang legt einen nichtmateriellen Reichtum nahe, doch der griechische Text bezeichnet ihn nicht ausdrücklich als geistlich. Die Spannung zur Armut bleibt daher erhalten.
- issue: Wiedergabe von „Synagoge Satans“
  choice: Die wörtliche Genitivverbindung beibehalten.
  alternative: „eine Versammlung, die Satan gehört“
  rationale: Die genaue Bedeutung des Genitivs wird im Griechischen nicht ausformuliert. Eine Besitz- oder Gefolgschaftsparaphrase würde die Relation stärker bestimmen als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Syntax. Gedankenstriche erhalten den eingeschobenen, pointierten Gegensatz „doch du bist reich“. Die Formulierung „von sich sagen, sie seien“ ist natürlich und gibt den reflexiven Behauptungscharakter wieder. Der sensible polemische Ausdruck bleibt textnah, wird aber in der Fußnote gegen eine unzulässige pauschale Verallgemeinerung abgegrenzt.
