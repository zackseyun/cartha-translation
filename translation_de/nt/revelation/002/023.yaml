id: REV.2.23
reference: Revelation 2:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: de
  text: Und ihre Kinder werde ich mit dem Tod töten[a]. Dann werden alle Gemeinden erkennen, dass ich der bin, der Nieren und Herzen erforscht[b], und ich werde jedem von euch nach euren Werken geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Seuche“. Wörtlich steht im Griechischen „mit dem Tod“; die Wendung kann das Gericht verstärken oder alttestamentliche Gerichtssprache aufgreifen.'
    reason: lexical_alternative
  - marker: b
    text: „Nieren und Herzen“ ist eine biblische Ausdrucksweise für das Innerste des Menschen, einschließlich seiner Beweggründe, Gedanken und Wünsche.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: Kinder
  rationale: „Kinder“ entspricht dem üblichen Sinn und lässt offen, ob leibliche Kinder oder bildlich ihre Anhänger gemeint sind.
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: werde ich mit dem Tod töten
  rationale: Die auffällige griechische Wendung wird bewusst bewahrt; sie kann das Gericht verstärken oder alttestamentliche Gerichtssprache aufgreifen. „Durch Seuche“ bleibt als mögliche Deutung in der Fußnote.
- source_word: γνώσονται
  choice: werden erkennen
  rationale: Das Futur bezeichnet hier eine durch das Gericht bewirkte Erkenntnis; „erkennen“ gibt diesen resultativen Zug natürlich wieder.
- source_word: ἐκκλησίαι
  choice: Gemeinden
  rationale: Im Kontext der Offenbarung bezeichnet das Wort die angesprochenen christlichen Ortsgemeinden; „Gemeinden“ ist im modernen Deutsch klar und konfessionell wenig vorgeprägt.
- source_word: ὁ ἐραυνῶν
  choice: der ... erforscht
  rationale: Die substantivierte Partizipialform beschreibt eine bleibende kennzeichnende Tätigkeit; „erforscht“ wahrt die feierliche und richterliche Nuance.
- source_word: νεφροὺς καὶ καρδίας
  choice: Nieren und Herzen
  rationale: Die konkrete biblische Bildsprache wird im Haupttext erhalten, statt ihre Bestandteile interpretierend neu zuzuordnen; eine Fußnote erläutert den Sinn für den inneren Menschen.
- source_word: δώσω ὑμῖν ἑκάστῳ
  choice: ich werde jedem von euch ... geben
  rationale: Die distributive Aussage und das angesprochene „euch“ werden vollständig wiedergegeben.
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: nach euren Werken
  rationale: „Werke“ wahrt die biblische Gerichtssprache und die lexikalische Verbindung zu anderen Vorkommen von ἔργα.
theological_decisions:
- issue: Identität des Sprechers als Erforscher des inneren Menschen
  choice: Die starke Selbstaussage „ich es bin, der ... erforscht“ bleibt erhalten.
  alternative: Eine abgeschwächte Wiedergabe im Sinn bloßen Wissens oder Beobachtens.
  rationale: Der griechische Text schreibt dem Sprecher umfassende richterliche Kenntnis des inneren Menschen zu; dieses theologische Gewicht darf nicht abgeschwächt werden.
- issue: Bedeutung von „ihre Kinder“
  choice: Die Formulierung bleibt ohne nähere Deutung stehen.
  alternative: Ausdrückliche Festlegung auf leibliche Kinder oder auf Anhänger beziehungsweise Schüler.
  rationale: τέκνα kann hier wörtlich oder bildlich verstanden werden; der Text erzwingt keine eindeutige Festlegung.
- issue: Bedeutung von „nach euren Werken geben“
  choice: Die offene Vergeltungsformel wird nah am Wortlaut wiedergegeben.
  alternative: Explizite Ausdeutung als Belohnung oder Bestrafung.
  rationale: Der Kontext ist richterlich, doch der Satz selbst formuliert allgemein; die Übersetzung soll die Reichweite nicht einengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „mit dem Tod töten“ und das Körperbild „Nieren und Herzen“ bleiben wegen ihrer biblischen und intertextuellen Bedeutung im Haupttext erhalten und werden durch Fußnoten erschlossen.
