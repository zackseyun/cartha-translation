id: REV.2.14
reference: Revelation 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: de
  text: 'Aber ich habe einiges gegen dich: Du hast dort einige, die an der Lehre Bileams festhalten. Er lehrte Balak, den Söhnen Israels[a] einen Stolperstein in den Weg zu legen, um sie dazu zu verleiten, Götzenopferfleisch zu essen und sexuelle Unmoral zu begehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Kindern Israels“ beziehungsweise „den Israeliten“. Wörtlich steht im Griechischen: „den Söhnen Israels“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: einiges
  rationale: Das substantivisch gebrauchte Neutrum Plural bezeichnet einige Beanstandungen; „einiges gegen dich“ ist im Deutschen natürlich und wahrt die unbestimmte Mehrzahl.
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: die an der Lehre … festhalten
  rationale: κρατέω bezeichnet hier das beharrliche Festhalten an einer Lehre, nicht körperliches Ergreifen.
- source_word: Βαλαάμ / Βαλὰκ
  choice: Bileam / Balak
  rationale: Die Namen folgen den im Deutschen etablierten biblischen Namensformen.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: Er lehrte Balak
  rationale: Das Imperfekt blickt auf Bileams damaliges Lehren zurück; das deutsche Präteritum gibt dies im erzählenden Zusammenhang natürlich wieder, ohne eine fortlaufende Handlung unnötig festzulegen.
- source_word: βαλεῖν σκάνδαλον ἐνώπιον
  choice: einen Stolperstein in den Weg zu legen
  rationale: Die verständliche Bildsprache von σκάνδαλον bleibt erhalten; „in den Weg legen“ gibt ἐνώπιον in natürlichem Deutsch wieder.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: den Söhnen Israels
  rationale: Die ausdrückliche maskuline Form des griechischen Textes und die traditionelle biblische Wendung werden bewahrt.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: Götzenopferfleisch aßen
  rationale: εἰδωλόθυτα bezeichnet Speise, besonders Fleisch, das Götzen geopfert worden war; das etablierte deutsche Kompositum ist knapp und präzise.
- source_word: πορνεῦσαι
  choice: sexuelle Unmoral begingen
  rationale: Die Formulierung wahrt die breite Bedeutung unerlaubten sexuellen Verhaltens, ohne den Ausdruck auf eine einzelne Form einzuengen.
theological_decisions:
- issue: Bezugsrichtung der Infinitive φαγεῖν und πορνεῦσαι
  choice: 'als Folge beziehungsweise Ziel des gelegten Stolpersteins wiedergegeben: „sodass sie … aßen und … begingen“'
  alternative: 'Appositionale Wiedergabe: „nämlich Götzenopferfleisch zu essen und sexuelle Unmoral zu begehen“'
  rationale: Die Infinitive erläutern, worin der von Bileam veranlasste Fallstrick bestand. „Sodass“ macht den syntaktischen Zusammenhang im Deutschen verständlich, ohne zu entscheiden, ob stärker Zweck oder Folge gemeint ist.
- issue: Wiedergabe von σκάνδαλον
  choice: Stolperstein
  alternative: Falle / Verführung zur Sünde
  rationale: Die bildhafte und theologisch spannungsreiche Ausdrucksweise des Ausgangstextes bleibt bestehen; eine rein deutende Wiedergabe würde sie vorschnell auflösen.
- issue: Wiedergabe von υἱοὶ Ἰσραήλ
  choice: Söhne Israels
  alternative: Israeliten / Kinder Israels
  rationale: Die formale Gestalt des griechischen Ausdrucks wird im Haupttext gewahrt; idiomatische Alternativen werden in der Fußnote genannt.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Anrede wechselt nicht: Das singularische „dich“ bezeichnet den Engel beziehungsweise die angesprochene Gemeinde als Einheit; „Menschen“ macht das substantivierte Partizip natürlich verständlich. Die traditionelle, aber weiterhin verständliche Metapher „Stolperstein“ bleibt erhalten.'
