  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: de
  text: Wer ein Ohr hat, soll hören, was der Geist den Gemeinden sagt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Wer … hat
  rationale: Der substantivierte Partizipialausdruck bezeichnet allgemein jeden, auf den die Aussage zutrifft. „Wer … hat“ gibt den sprichwortartigen, offenen Aufruf im modernen Deutschen natürlich wieder.
- source_word: οὖς
  choice: ein Ohr
  rationale: Der Singular des griechischen Textes bleibt erhalten und entspricht der festen deutschen Wendung „Wer ein Ohr hat“.
- source_word: ἀκουσάτω
  choice: soll hören
  rationale: Der Imperativ der dritten Person wird im Deutschen idiomatisch mit „soll“ wiedergegeben. „Höre“ würde eine Umformung in direkte Anrede und in den Plural oder eine altertümliche Konstruktion erfordern.
- source_word: τί
  choice: was
  rationale: „Was“ leitet natürlich und präzise den Inhalt dessen ein, was der Geist sagt.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Im wiederkehrenden Mahnruf von Offenbarung 2–3 ist der göttliche Geist gemeint. Die Großschreibung folgt deutscher Substantivschreibung und die bestimmte Form wahrt den eindeutigen Bezug des Kontexts.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bezeichnet die gegenwärtige beziehungsweise charakteristische Rede des Geistes; „sagt“ ist die natürliche deutsche Entsprechung.
- source_word: ταῖς ἐκκλησίαις
  choice: den Gemeinden
  rationale: ἐκκλησίαι bezeichnet hier die örtlichen christlichen Gemeinschaften. „Gemeinden“ ist im Deutschen kontextgenau und vermeidet die mögliche Verengung von „Kirchen“ auf Gebäude oder Institutionen.
theological_decisions:
- issue: Bezug von „der Geist“
  choice: der Heilige Geist, der zu den Gemeinden spricht
  alternative: ein menschlicher Geist oder lediglich der Geist beziehungsweise die Botschaft Jesu
  rationale: Der wiederkehrende Schlussruf in Offenbarung 2–3 stellt den Geist als göttlichen Sprecher dar. Die Übersetzung „der Geist“ bewahrt diese Identifikation, ohne „Heilige“ erläuternd in den Bibeltext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, feierliche Mahnformel und der Singular „ein Ohr“ bleiben erhalten; „Gemeinden“ gibt den örtlichen Bezug von ἐκκλησίαι idiomatisch wieder.
