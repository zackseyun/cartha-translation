id: REV.2.8
reference: Revelation 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: de
  text: 'Und dem Engel[a] der Gemeinde in Smyrna schreibe: Das sagt der Erste und der Letzte, der tot wurde und wieder lebendig wurde:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dem Boten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang der Offenbarung ist »Engel« die naheliegende Wiedergabe; »Bote« bleibt lexikalisch möglich und wird in der Fußnote genannt.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: Hier bezeichnet ἐκκλησία die örtliche christliche Gemeinschaft; »Gemeinde« ist dafür im modernen Standarddeutsch natürlich und präzise.
- source_word: Τάδε λέγει
  choice: Das sagt
  rationale: Die knappe, feierliche Botenformel wird idiomatisch wiedergegeben, ohne ihren prophetischen Charakter auszubauen.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: der Erste und der Letzte
  rationale: Die Großschreibung kennzeichnet die Wortgruppe als christologischen Titel und bewahrt den Anklang an göttliche Titelsprache.
- source_word: ἐγένετο νεκρὸς
  choice: der tot wurde
  rationale: Diese ereignishafte Formulierung bildet ἐγένετο ab und bezeichnet den Eintritt in den Tod, statt nur einen Zustand auszudrücken.
- source_word: ἔζησεν
  choice: wieder lebendig wurde
  rationale: Im Gegensatz zu »tot wurde« bringt die Formulierung den Auferstehungssinn im Deutschen klar und natürlich zum Ausdruck.
theological_decisions:
- issue: Christologischer Titel und Aussage über Tod und Auferstehung
  choice: »der Erste und der Letzte, der tot wurde und wieder lebendig wurde«
  alternative: »der Erste und der Letzte, der tot war und wieder lebendig wurde«
  rationale: Die Übersetzung wahrt den hohen christologischen Titel und die Aussage von Tod und neuem Leben, ohne zusätzliche dogmatische Erläuterung. »Tot wurde« erhält dabei die ereignishafte Nuance von ἐγένετο.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende prophetische Formel bleibt knapp; die Satzstellung folgt dem griechischen Aufbau, ohne im Deutschen unnatürlich zu wirken.
