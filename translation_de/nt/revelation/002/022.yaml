id: REV.2.22
reference: Revelation 2:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: de
  text: Siehe, ich werfe sie aufs Bett[a] und diejenigen, die mit ihr Ehebruch begehen, in große Bedrängnis[b], wenn sie nicht von den Werken dieser Frau umkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufs Krankenbett“. Wörtlich steht im Griechischen „aufs Bett“; im Zusammenhang verstehen es viele als ein Bett des Leidens oder der Krankheit als Gericht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in große Drangsal“. Gemeint ist hier schwere Not oder Bedrängnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel wird mit dem im würdevollen modernen Bibeldeutsch weiterhin verständlichen „Siehe“ wiedergegeben.
- source_word: βάλλω
  choice: ich werfe
  rationale: Das Präsens vermittelt die lebendige Unmittelbarkeit der angekündigten Gerichtshandlung; das einfache deutsche Präsens ist dafür natürlich.
- source_word: αὐτὴν εἰς κλίνην
  choice: sie aufs Bett
  rationale: κλίνη bezeichnet wörtlich ein Bett oder Ruhelager. Der Haupttext bewahrt diese Offenheit, statt die im Gerichtskontext mögliche Bedeutung „Krankenbett“ festzuschreiben.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: die, die mit ihr Ehebruch begehen
  rationale: Die verbale Wiedergabe erhält den konkreten Sinn von μοιχεύω und lässt eine mögliche bildliche Dimension offen.
- source_word: εἰς θλῖψιν μεγάλην
  choice: in große Bedrängnis
  rationale: „Bedrängnis“ gibt schwere Not und Leiden wieder, ohne unnötig eine bestimmte endzeitliche Fachbedeutung festzulegen.
- source_word: ἐὰν μὴ μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς
  choice: wenn sie nicht von ihren Werken umkehren
  rationale: Die Formulierung bildet sowohl die negative Bedingung als auch ἐκ als Abkehr von den Werken ab. „Umkehren“ gibt μετανοέω in diesem Zusammenhang natürlich wieder.
theological_decisions:
- issue: Ob κλίνη ausdrücklich als Krankenbett des Gerichts zu deuten ist
  choice: Im Haupttext bleibt die wörtliche Bezeichnung „Bett“ stehen.
  alternative: Krankenbett
  rationale: Der Zusammenhang legt Leiden als Gericht nahe, doch κλίνη selbst bezeichnet nicht zwingend ein Krankenbett. Die mögliche Deutung wird deshalb in einer Fußnote bewahrt.
- issue: Ob μοιχεύοντας wörtlichen Ehebruch, geistliche Untreue oder beides bezeichnet
  choice: Mit „Ehebruch begehen“ wird der konkrete lexikalische Sinn wiedergegeben.
  alternative: sexuelle Unmoral treiben / untreu sein
  rationale: Die Offenbarung kann den Ausdruck zugleich symbolisch gebrauchen. Eine konkrete Übersetzung bewahrt diese Spannung, statt sie durch eine allgemeinere Deutung aufzulösen.
- issue: Wessen Werke mit αὐτῆς gemeint sind
  choice: „ihren Werken“ bezieht sich grammatisch auf die Frau.
  alternative: ihren eigenen Werken, entsprechend einer abweichenden Lesart bzw. interpretierenden Angleichung
  rationale: Der vorgelegte SBLGNT-Text hat ausdrücklich αὐτῆς, Singular Femininum. Daher wird der Bezug auf ihre Werke im Haupttext erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ dient als prägnanter Aufmerksamkeitssignal; „Ehebruch begehen“, „Bedrängnis“ und „umkehren“ bleiben allgemein verständlich. Die Satzstruktur folgt dem griechischen Gerichtsspruch, ohne im Deutschen unnatürlich zu wirken.
