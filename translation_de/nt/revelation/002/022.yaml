revisions:
- from: Siehe, ich werfe sie aufs Bett[a] und die, die mit ihr Ehebruch begehen, in große Bedrängnis[b], wenn sie nicht von ihren Werken umkehren.
  to: Siehe, ich werfe sie aufs Bett[a] und diejenigen, die mit ihr Ehebruch begehen, in große Bedrängnis[b], wenn sie nicht von den Werken dieser Frau umkehren.
  rationale: Die Revision stellt durch „von den Werken dieser Frau“ eindeutig den im griechischen αὐτῆς ausgedrückten Bezug her. Zugleich glättet sie die deutsche Relativkonstruktion. Die wörtliche, nicht festgelegte Wiedergabe von κλίνη als „Bett“ sowie die Fußnotenanker und ihre sachlichen Alternativen bleiben erhalten.
