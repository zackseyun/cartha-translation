  timestamp: '2026-07-15T03:50:50Z'
review_pass:
  verdict: revise
  source_fidelity: Der Satz gibt die Abfolge und die Gerichtsaussage des griechischen Textes zutreffend wieder. Allerdings kann „ihren Werken“ im Deutschen ohne Weiteres als Werke derjenigen verstanden werden, die mit ihr Ehebruch begehen. αὐτῆς bezieht sich im SBLGNT-Text jedoch auf die Frau. Der Bezug sollte daher ausdrücklich gemacht werden.
  naturalness: „Siehe“ ist in würdigem, modernem Bibeldeutsch weiterhin möglich. „die, die“ ist zwar verständlich, aber „diejenigen, die“ ist im Satzfluss natürlicher. Die explizite Bezugnahme auf „die Werke dieser Frau“ verhindert zudem eine missverständliche Pronomenkette.
  terminology: „Ehebruch begehen“, „Bedrängnis“ und „umkehren“ sind angemessene, verständliche Wiedergaben. „Bett“ bewahrt die lexikalische Offenheit von κλίνη; die Fußnote darf die mögliche Deutung als Krankenbett erläutern, ohne sie in den Haupttext zu verlegen.
  issues:
  - severity: medium
    issue: Mehrdeutiger Bezug von „ihren Werken“
    rationale: Das deutsche Possessivpronomen kann sich hier naheliegend auf das pluralische Subjekt „diejenigen, die mit ihr Ehebruch begehen“ beziehen. Der griechische Text liest αὐτῆς und meint die Werke der Frau. Eine explizite Formulierung ist für die Quelltexttreue erforderlich.
  - severity: low
    issue: Wiederholung „die, die“
    rationale: Die Konstruktion ist nicht falsch, wirkt aber weniger glatt als „diejenigen, die“.
