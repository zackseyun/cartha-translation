id: REV.2.27
reference: Revelation 2:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: de
  text: und er wird sie mit einem eisernen Stab weiden[a], wie Tongefäße zerschmettert werden[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über sie mit einem eisernen Stab herrschen“. Das Verb bedeutet wörtlich „weiden“, trägt hier in der Anspielung auf Psalm 2 aber zugleich den Sinn königlicher Herrschaft.'
    reason: alternative_reading
  - marker: b
    text: Eine Anspielung auf Psalm 2,9, wo die Völker wie Töpfergeschirr zerschmettert werden.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet den Satz unmittelbar mit der vorausgehenden Verheißung und wird daher beibehalten.
- source_word: ποιμανεῖ
  choice: wird … weiden
  rationale: Das Verb bezeichnet wörtlich die Tätigkeit eines Hirten. „Weiden“ bewahrt das Hirtenbild und zugleich in der Anspielung auf Psalm 2 den Sinn königlicher Herrschaft, ohne diese Spannung aufzulösen.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: mit einem eisernen Stab
  rationale: „Stab“ kann sowohl an den Hirtenstab als auch an ein Herrschafts- oder Züchtigungsinstrument denken lassen und gibt so die Bildweite von ῥάβδος passend wieder.
- source_word: ὡς
  choice: wie
  rationale: „Wie“ leitet den Vergleich im Deutschen natürlich und klar ein.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: Tongefäße
  rationale: Die kompakte deutsche Zusammensetzung bezeichnet Gefäße aus gebranntem Ton und erhält das Bild ihrer Zerbrechlichkeit.
- source_word: συντρίβεται
  choice: zerschmettert werden
  rationale: Das Verb bezeichnet gewaltsames Zerbrechen. Das griechische Prädikat steht nach üblicher Kongruenz bei einem sächlichen Pluralsubjekt im Singular; im Deutschen ist die Pluralform erforderlich.
theological_decisions:
- issue: Königlich-messianische Anspielung auf Psalm 2,9 im Verb ποιμανεῖ und im eisernen Stab
  choice: Das Hirtenbild wird im Haupttext mit „weiden“ bewahrt.
  alternative: „über sie herrschen“ oder „sie regieren“, um den königlichen Herrschaftssinn ausdrücklich hervorzuheben
  rationale: Der griechische Text verwendet ποιμαίνω und kein allgemeines Verb für Herrschen. Zusammen mit dem eisernen Stab verbindet die Formulierung fürsorgliche Hirtenmetaphorik mit königlicher und richtender Autorität; die Übersetzung soll diese Spannung nicht einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weiden“ ist bewusst bildhaft und bibelsprachlich vertraut, bleibt aber verständlich. Die Wortstellung hält den Anschluss an den vorangehenden Satz offen; das abschließende Komma entspricht dem gelieferten Verssegment.
