id: REV.2.1
reference: Revelation 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: de
  text: 'Dem Engel[a] der Gemeinde in Ephesus schreibe: So spricht der, der die sieben Sterne in seiner rechten Hand hält und mitten unter den sieben goldenen Leuchtern umhergeht:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dem Boten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: Engel
  rationale: Das Wort kann einen himmlischen Engel oder einen menschlichen Boten bezeichnen. „Engel“ bewahrt den apokalyptischen Zusammenhang und die traditionelle, naheliegende Lesart; die mögliche Bedeutung „Bote“ wird in der Fußnote festgehalten.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: Im frühchristlichen Zusammenhang bezeichnet ἐκκλησία die örtliche Gemeinschaft der Glaubenden. „Gemeinde“ ist im modernen Standarddeutsch natürlich und vermeidet die mögliche Verengung von „Kirche“ auf Institution oder Gebäude.
- source_word: γράψον
  choice: schreibe
  rationale: Der Aoristimperativ wird als unmittelbare, knappe Aufforderung wiedergegeben.
- source_word: Τάδε λέγει
  choice: So spricht
  rationale: Die deutsche prophetische Formel gibt den feierlichen, autoritativen Charakter der griechischen Wendung prägnant und verständlich wieder.
- source_word: κρατῶν
  choice: hält
  rationale: κρατέω bezeichnet hier festes Halten beziehungsweise Verfügen. „Hält“ bewahrt das konkrete Bild, ohne zusätzliche Deutung einzutragen.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: in seiner rechten Hand
  rationale: Im Deutschen wird das im Griechischen elliptisch vorausgesetzte „Hand“ idiomatisch ergänzt; das Bild von Autorität und sicherem Besitz bleibt erhalten.
- source_word: περιπατῶν
  choice: umhergeht
  rationale: Das Partizip beschreibt Bewegung innerhalb des Bereichs der Leuchter. „Umhergeht“ ist anschaulich und gibt mehr als bloßes statisches Stehen wieder.
- source_word: ἐν μέσῳ
  choice: mitten unter
  rationale: Die Wendung bringt sowohl die zentrale Stellung als auch die Gegenwart zwischen den Leuchtern natürlich zum Ausdruck.
- source_word: λυχνιῶν
  choice: Leuchtern
  rationale: λυχνία bezeichnet einen Leuchter beziehungsweise Lampenständer, nicht nur eine Lampe. „Leuchter“ passt zur etablierten Bildsprache der Offenbarung.
- source_word: χρυσῶν
  choice: goldenen
  rationale: Die attributive Wiedergabe ist im Deutschen direkt, natürlich und bildhaft.
theological_decisions:
- issue: Bezugsgröße von ἀγγέλῳ in der Wendung „Engel der Gemeinde“
  choice: „Engel“ im Haupttext
  alternative: „Bote“
  rationale: Der griechische Ausdruck lässt beide Bedeutungen zu. Der apokalyptische Kontext begünstigt „Engel“, entscheidet die Identität des Bezeichneten aber nicht zweifelsfrei. Deshalb wird die alternative Deutung nicht dogmatisch ausgeschlossen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlichem prophetischem Ton. Die Satzstruktur bleibt eng am griechischen Aufbau, ohne unnatürlich zu wirken; die wiederholten Partizipien werden durch Relativsätze wiedergegeben.
