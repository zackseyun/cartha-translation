  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: de
  text: 'Aber ich habe dir etwas vorzuwerfen: Du hast deine erste Liebe verlassen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast deine erste Liebe aufgegeben.“ Gemeint sein kann die Liebe, die du am Anfang hattest – zum Herrn, zueinander oder in beiderlei Hinsicht.'
    reason: Lexikalische Alternative zu ἀφῆκες und Bewahrung der offenen Bezugsmöglichkeit von τὴν ἀγάπην σου τὴν πρώτην.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Die adversative Konjunktion markiert einen deutlichen Gegensatz zum vorausgehenden Lob. „Doch“ klingt im modernen Deutschen natürlich und würdevoll.
- source_word: ἔχω κατὰ σοῦ
  choice: ich habe gegen dich
  rationale: Die Wendung ἔχω κατά mit Genitiv bezeichnet einen Vorwurf oder eine Klage gegen jemanden. Die bewusst knappe Formulierung bewahrt die Nähe zum griechischen Ausdruck und seinen tadelnden Ton.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet den Inhalt des Vorwurfs ein. „Dass“ gibt diese syntaktische Beziehung unmittelbar wieder, ohne sie kausal als „weil“ auszulegen.
- source_word: ἀγάπην
  choice: Liebe
  rationale: „Liebe“ ist die direkte und kontextgemäße Wiedergabe von ἀγάπη.
- source_word: τὴν πρώτην
  choice: deine erste
  rationale: πρώτην bedeutet hier am natürlichsten „erste“. Die Formulierung bewahrt die Offenheit zwischen zeitlich anfänglicher und möglicherweise vorrangiger Liebe.
- source_word: ἀφῆκες
  choice: verlassen hast
  rationale: Der Aorist von ἀφίημι bezeichnet hier das Zurücklassen oder Aufgeben. „Verlassen hast“ ist gegenwärtiges, ernstes Deutsch, ohne die Aussage durch „aufgegeben“ oder „preisgegeben“ unnötig zu verstärken.
theological_decisions:
- issue: Bezug und Bedeutung der „ersten Liebe“
  choice: Wörtlich und offen als „deine erste Liebe“ wiedergegeben
  alternative: „deine anfängliche Liebe zu mir“ oder „die Liebe, die du am Anfang hattest“
  rationale: Der griechische Ausdruck nennt weder ausdrücklich das Objekt der Liebe noch legt er eindeutig fest, ob die Liebe zum Herrn, untereinander oder beides gemeint ist. Diese theologische und kontextuelle Offenheit bleibt erhalten.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdevoller Mahnrede. Die Satzstruktur bleibt bewusst nahe am Griechischen; „ich habe gegen dich, dass …“ ist leicht markiert, aber verständlich und bewahrt die formale Gestalt des Vorwurfs.
