id: REV.2.16
reference: Revelation 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: de
  text: Kehre daher um! Wenn aber nicht, komme ich bald zu dir und werde gegen sie Krieg führen mit dem Schwert meines Mundes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Schwert meines Mundes“ ist ein apokalyptisches Bild für Christi richtendes Wort oder seinen Gerichtsspruch.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: Kehre um
  rationale: Der Aorist-Imperativ fordert eine entschiedene Umkehr. „Umkehren“ gibt die moralisch-geistliche Stoßrichtung in natürlichem, heutigem Deutsch wieder.
- source_word: οὖν
  choice: daher
  rationale: Kennzeichnet die Folgerung aus dem vorhergehenden Tadel und wahrt den logischen Anschluss.
- source_word: εἰ δὲ μή
  choice: Wenn aber nicht
  rationale: Bewahrt die bedingte Warnung und den durch δέ ausgedrückten scharfen Gegensatz.
- source_word: ἔρχομαί σοι
  choice: komme ich … zu dir
  rationale: Gibt das Präsens mit unmittelbar bevorstehender Bedeutung wieder. Die feindliche Stoßrichtung wird nicht vorweggenommen, sondern folgt ausdrücklich im nächsten Satzteil.
- source_word: ταχύ
  choice: bald
  rationale: Im Zusammenhang einer angekündigten Ankunft bezeichnet das Adverb naheliegend zeitliche Nähe; zugleich bleibt offen, wie diese Nähe zu bestimmen ist.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: werde gegen sie Krieg führen
  rationale: Nach πολεμέω ist μετά mit Genitiv hier adversativ zu verstehen. „Krieg führen“ bewahrt die starke militärische Bildsprache.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: mit dem Schwert
  rationale: Gibt den instrumentalen Gebrauch von ἐν idiomatisch wieder.
- source_word: ῥομφαίᾳ
  choice: Schwert
  rationale: Die genauere Vorstellung einer großen Schwertwaffe muss im Deutschen nicht spezifiziert werden; „Schwert“ erhält das etablierte apokalyptische Bild ohne Ausschmückung.
- source_word: τοῦ στόματός μου
  choice: aus meinem Mund
  rationale: Im Deutschen bezeichnet „aus meinem Mund“ die bildhafte Herkunft des Schwertes natürlicher als das missverständliche „meines Mundes“ und entspricht der Darstellung in Offenbarung 1,16.
theological_decisions:
- issue: Adressat des Kommens und Ziel des Kampfes
  choice: Christus kommt „zu dir“, führt aber ausdrücklich „gegen sie“ Krieg.
  alternative: Christus kommt unterschiedslos gegen die ganze Gemeinde; oder sein Kommen betrifft ausschließlich die Irrlehrer.
  rationale: Der griechische Text verbindet die singularische Anrede σοι mit dem pluralischen αὐτῶν. Die Übersetzung erhält diese Spannung, ohne die Gemeinde oder die bezeichnete Gruppe miteinander gleichzusetzen.
- issue: Instrument des Gerichts
  choice: Das apokalyptische Bild vom Schwert aus Christi Mund bleibt erhalten.
  alternative: Paraphrase als „mein Wort“ oder „die Macht meines Ausspruchs“.
  rationale: Der Ausgangstext verwendet bewusst konkrete apokalyptische Bildsprache. Eine Auflösung in abstrakte Begriffe würde deren literarische und theologische Kraft mindern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Warnung und die militärische Bildsprache bleiben erhalten. „Kehre um“ ist allgemein verständlicher als das kirchlich geprägte „Tue Buße“. Das Ausrufezeichen gibt die Eindringlichkeit des Imperativs wieder, ohne zusätzliche Aussage einzutragen.
