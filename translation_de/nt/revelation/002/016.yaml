revisions:
- from: Kehre daher um! Wenn aber nicht, komme ich bald zu dir und werde gegen sie Krieg führen mit dem Schwert aus meinem Mund.[a]
  to: Kehre daher um! Wenn aber nicht, komme ich bald zu dir und werde gegen sie Krieg führen mit dem Schwert meines Mundes.[a]
  rationale: Die einzige sichere Korrektur betrifft die Wiedergabe des Genitivs τοῦ στόματός μου. Die Revision ersetzt die interpretativere Herkunftsformulierung „aus meinem Mund“ durch „meines Mundes“, ohne die apokalyptische Metapher zu erläutern oder ihre theologische Deutung festzulegen. Alle übrigen Entscheidungen können bestehen bleiben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:50:49Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Imperativ, Folgerung, bedingte Warnung, bevorstehendes Kommen, das Gegenüber von „dir“ und „sie“ sowie die Kriegs- und Schwertmetaphorik zuverlässig wieder. „gegen sie“ ist nach πολεμήσω μετ’ αὐτῶν im Kontext die sachgemäße Wiedergabe. Die Genitivverbindung τοῦ στόματός μου sollte jedoch nicht als Herkunftsangabe („aus meinem Mund“), sondern als Zugehörigkeits-/Bildgenitiv („meines Mundes“) wiedergegeben werden.
  naturalness: „Kehre daher um!“ und die knappe Warnung sind modernes, würdevolles Standarddeutsch. „Wenn aber nicht“ ist als bewusst knappe, eindringliche Ellipse verständlich und angemessen. „Mit dem Schwert meines Mundes“ ist in diesem apokalyptischen Bild zwar gehobener als Alltagssprache, aber idiomatisch genug und näher am Ausgangstext als „aus meinem Mund“.
  terminology: „Umkehren“ ist eine gute moderne Wiedergabe von μετανόησον, ohne die Aussage auf bloßen Meinungswechsel zu reduzieren. „Krieg führen“ bewahrt die Schärfe von πολεμήσω. „Schwert meines Mundes“ wahrt die etablierte Offenbarungsbildsprache und die griechische Genitivkonstruktion.
  issues:
  - severity: low
    issue: „aus meinem Mund“ statt „meines Mundes“
    rationale: τοῦ στόματός μου ist im griechischen Text ein Genitiv („des/meines Mundes“), nicht ausdrücklich eine Herkunftsbestimmung. „Aus meinem Mund“ ist als Bilddeutung möglich, legt aber stärker nahe, das Schwert komme aus dem Mund heraus. „Mit dem Schwert meines Mundes“ erhält die Formulierung und Bildspannung des Ausgangstextes genauer.
