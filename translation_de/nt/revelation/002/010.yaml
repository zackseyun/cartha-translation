id: REV.2.10
reference: Revelation 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: de
  text: 'Fürchte dich nicht vor dem, was du bald erleiden wirst. Sieh: Der Teufel wird einige von euch schon bald ins Gefängnis werfen, damit ihr geprüft werdet[a], und zehn Tage lang werdet ihr Bedrängnis erleiden. Sei treu bis zum Tod[b], und ich werde dir den Siegeskranz des Lebens[c] geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann je nach Zusammenhang auch „versucht“ oder „erprobt“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: '„Bis zum Tod“ kann auch „bis in den Tod“ bedeuten: treu zu bleiben, selbst wenn dies den Märtyrertod verlangt.'
    reason: alternative_reading
  - marker: c
    text: Das griechische Wort bezeichnet einen Sieges- oder Ehrenkranz, nicht ein königliches Diadem.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: Fürchte dich nicht
  rationale: Die verneinte Aufforderung wird in natürlichem, würdigem Deutsch wiedergegeben; „Fürchte nichts“ wäre formeller und weniger idiomatisch.
- source_word: ἃ μέλλεις πάσχειν
  choice: vor dem, was du bald erleiden wirst
  rationale: „Bald“ gibt die bevorstehende Handlung von μέλλω wieder, während „erleiden“ den Sinn von πάσχω bewahrt.
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Das Aufmerksamkeitssignal wird direkt und modern wiedergegeben, ohne das altertümliche „Siehe“ zu verwenden.
- source_word: μέλλει βάλλειν
  choice: wird ... schon bald ... werfen
  rationale: Die Verbindung bewahrt sowohl die nahe Zukunft von μέλλω als auch das kräftige Bild von βάλλω.
- source_word: ὁ διάβολος
  choice: der Teufel
  rationale: Hier bezeichnet διάβολος den persönlichen übernatürlichen Widersacher; der etablierte deutsche Titel ist daher angemessen.
- source_word: ἐξ ὑμῶν
  choice: einige von euch
  rationale: Die Formulierung bezeichnet idiomatisch eine Teilmenge aus der angesprochenen Gruppe.
- source_word: εἰς φυλακήν
  choice: ins Gefängnis
  rationale: φυλακή bezeichnet hier Haft beziehungsweise Gefangenschaft; „Gefängnis“ entspricht Kontext und Register.
- source_word: ἵνα πειρασθῆτε
  choice: damit ihr geprüft werdet
  rationale: πειράζω kann prüfen, erproben oder versuchen bedeuten. Im Zusammenhang mit Verfolgung ist „geprüft“ die naheliegende Wiedergabe, ohne die lexikalische Mehrdeutigkeit zu leugnen.
- source_word: ἕξετε θλῖψιν
  choice: werdet ihr Bedrängnis erleiden
  rationale: „Bedrängnis“ bewahrt das gewichtige, in der Offenbarung bedeutsame Leiden von θλῖψις; die verbale Fügung ist im Deutschen natürlicher als „Bedrängnis haben“.
- source_word: ἡμερῶν δέκα
  choice: zehn Tage lang
  rationale: Der Genitiv der zeitlichen Ausdehnung wird idiomatisch als Dauerangabe wiedergegeben.
- source_word: γίνου πιστός
  choice: Sei treu
  rationale: Die knappe Aufforderung umfasst im Kontext das Eintreten in und Ausharren in beständiger Treue.
- source_word: ἄχρι θανάτου
  choice: bis zum Tod
  rationale: Die direkte Wiedergabe lässt offen, ob lebenslange Treue oder ausdrücklich Treue bis hin zum Martyrium im Vordergrund steht.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: den Siegeskranz des Lebens
  rationale: στέφανος bezeichnet einen Kranz als Ehren- oder Siegespreis, nicht ein königliches Diadem. „Des Lebens“ bewahrt die mögliche Bedeutungsbreite des griechischen Genitivs.
theological_decisions:
- issue: Bedeutung von πειρασθῆτε angesichts von Teufel und Verfolgung
  choice: geprüft werdet
  alternative: versucht werdet; erprobt werdet
  rationale: Die Haft und Bedrängnis stellen die Treue der Glaubenden auf die Probe. „Geprüft“ passt zu diesem Zusammenhang, während eine Fußnote die mögliche Nuance von Versuchung oder Erprobung offenhält.
- issue: Bedeutungsumfang von ἄχρι θανάτου
  choice: bis zum Tod
  alternative: bis in den Tod; selbst wenn es den Tod bedeutet
  rationale: Die Übersetzung bewahrt sowohl den Gedanken an Treue bis zum Lebensende als auch die reale Möglichkeit des Märtyrertodes, ohne den Ausdruck auf nur eine dieser Deutungen festzulegen.
- issue: Bildgehalt von στέφανος
  choice: Siegeskranz
  alternative: Kranz; Krone
  rationale: „Siegeskranz“ macht das antike Bild eines verliehenen Ehrenpreises verständlich und vermeidet die irreführende Vorstellung eines königlichen Diadems.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Wechsel von der singularischen Anrede („du“) zur pluralischen Gemeinde („ihr/euch“) folgt dem griechischen Text. „Bedrängnis“ erhält das gewichtige apokalyptische Register, während Satzbau und Verben natürlich deutsch bleiben.
