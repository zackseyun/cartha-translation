source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: de
  text: 'Schreibe dem Engel der Gemeinde in Pergamon: So spricht der, der das scharfe, zweischneidige Schwert hat:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bote“ statt „Engel“. Es ist umstritten, ob ein himmlisches Wesen oder ein menschlicher Vertreter der Gemeinde gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: Engel
  rationale: ἄγγελος kann einen himmlischen Engel oder einen menschlichen Boten bezeichnen. „Engel“ entspricht der etablierten Anredeformel in Offenbarung 2–3 und bewahrt die im Kontext nicht aufgelöste Identitätsfrage.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: Im christlichen Kontext bezeichnet ἐκκλησία die örtliche Gemeinschaft der Glaubenden. „Gemeinde“ ist dafür im modernen Standarddeutsch natürlich und vermeidet die mögliche Verengung von „Kirche“ auf Gebäude oder Institution.
- source_word: Περγάμῳ
  choice: Pergamon
  rationale: „Pergamon“ ist die übliche moderne deutsche Namensform der antiken Stadt.
- source_word: γράψον
  choice: schreibe
  rationale: Der Aoristimperativ wird unmittelbar und idiomatisch mit „schreibe“ wiedergegeben; der folgende Ausspruch bildet den Inhalt.
- source_word: Τάδε λέγει
  choice: So spricht
  rationale: Die feste, feierliche Botenformel wird im Deutschen natürlich und würdig mit „So spricht“ wiedergegeben. Dies wahrt ihren prophetisch-autoritativen Charakter besser als das unidiomatische „Diese Dinge sagt“.
- source_word: ὁ ἔχων
  choice: der, der … hat
  rationale: Das substantivierte Partizip wird als titelartige Umschreibung wiedergegeben, ohne den Aspekt eines aktiven Haltens überzubetonen.
- source_word: ῥομφαίαν
  choice: Schwert
  rationale: ῥομφαία bezeichnet ein Schwert, möglicherweise eine große oder schwere Schwertart. „Schwert“ ist kontextuell ausreichend und vermeidet unbelegte technische Präzisierung.
- source_word: δίστομον
  choice: zweischneidig
  rationale: Das wörtlich „zweimündig“ bedeutende Adjektiv bezeichnet idiomatisch eine auf beiden Seiten geschärfte Klinge; „zweischneidig“ ist die präzise und geläufige deutsche Entsprechung.
- source_word: ὀξεῖαν
  choice: scharf
  rationale: ὀξύς beschreibt hier unmittelbar die Schärfe des Schwertes und wird schlicht mit „scharf“ wiedergegeben.
theological_decisions:
- issue: Identität des „Engels“ der Gemeinde
  choice: Im Haupttext steht „Engel“, ohne festzulegen, ob ein himmlisches oder menschliches Gegenüber gemeint ist.
  alternative: „Bote“, etwa als menschlicher Abgesandter oder Gemeindeleiter verstanden
  rationale: Der Ausdruck ἄγγελος und der Vers selbst lassen die genaue Identität offen. Die Übersetzung bewahrt diese theologische und referenzielle Spannung, statt eine bestimmte ekklesiologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede folgt der griechischen Satzführung, während „So spricht“ die formelhafte Wendung Τάδε λέγει idiomatisch wiedergibt. „Gemeinde“ und „Pergamon“ entsprechen dem gegenwärtigen deutschen Sprachgebrauch.
