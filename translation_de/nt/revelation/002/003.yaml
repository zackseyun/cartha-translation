  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: de
  text: Du hast Ausdauer, hast um meines Namens willen[a] ausgehalten und bist nicht müde geworden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen meines Namens«; »für meinen Namen« oder »um meines Namens willen« können auch im Sinn von »um meines Namens willen ausgehalten« verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hast nicht nachgelassen«. Das Verb kann auch das Ermüden bei Mühe oder Arbeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: Ausdauer
  rationale: Bezeichnet standhaftes Ausharren unter Belastung; »Ausdauer« ist natürlich, knapp und legt weder bloß passive Geduld noch eine bestimmte Form der Verfolgung fest.
- source_word: ἔχεις
  choice: du hast
  rationale: Gibt das Präsens und die direkte anerkennende Anrede schlicht wieder.
- source_word: ἐβάστασας
  choice: du hast Lasten getragen
  rationale: βαστάζω kann tragen, ertragen oder aushalten bedeuten. Die Formulierung wahrt das Bild des Tragens und unterscheidet es von ὑπομονή, ohne die Art der Belastung näher festzulegen.
- source_word: διὰ τὸ ὄνομά μου
  choice: um meines Namens willen
  rationale: διά mit Akkusativ kann hier Grund oder Zweck ausdrücken. Die idiomatische deutsche Wendung bezeichnet die Bindung an Jesu Namen, ohne eine bestimmte Art von Leiden einzutragen.
- source_word: οὐ κεκοπίακες
  choice: du bist nicht müde geworden
  rationale: κοπιάω kann sich auf Mühe und Arbeit oder auf das Ermüden beziehen. Im Zusammenhang mit Ausdauer und Tragen gibt die Zustandsbedeutung des Perfekts »bist nicht müde geworden« treffend wieder.
theological_decisions:
- issue: Art der Belastung und Ausdauer in der Anerkennung
  choice: Der Vers würdigt anhaltende Ausdauer und das Tragen von Belastungen um Jesu Namens willen, ohne diese als eine bestimmte Form von Verfolgung oder Dienst festzulegen.
  alternative: 'Die Schlussklausel kann enger auf Mühe oder Arbeit bezogen werden: »du bist bei der Mühe nicht müde geworden« beziehungsweise »du hast dich nicht abgemüht«.'
  rationale: Die Übersetzung bewahrt die Spannung im Wortfeld von Tragen, Mühe und Ermüdung und trägt keine nähere Lehre über Verfolgung, Dienst oder Lohn in den Text ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Um meines Namens willen« bewahrt den biblischen Namensausdruck in einer geläufigen deutschen Form; »Lasten getragen« macht den sonst im Deutschen unvollständigen Gebrauch von »tragen« verständlich, ohne konkrete Leiden zu ergänzen.
