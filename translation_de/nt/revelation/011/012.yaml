source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: de
  text: 'Und sie hörten eine laute Stimme aus dem Himmel, die zu ihnen sagte: »Kommt hier herauf!« Da stiegen sie in der Wolke[a] in den Himmel hinauf, und ihre Feinde sahen ihnen zu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einer Wolke«. Im Griechischen steht »in der Wolke«; dies kann zugleich an biblische Szenen göttlicher Gegenwart und Rechtfertigung erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: sie hörten
  rationale: Der Aorist bezeichnet hier das konkrete Hören der himmlischen Stimme, nicht ein länger andauerndes Zuhören.
- source_word: φωνῆς μεγάλης
  choice: eine laute Stimme
  rationale: Im Deutschen gibt »laut« in diesem Zusammenhang die Stärke der Stimme natürlich wieder; »groß« wäre unnötig wörtlich.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel
  rationale: Im visionären Zusammenhang der Offenbarung bezeichnet οὐρανός den Himmel; ἐκ wird mit »aus« räumlich präzise wiedergegeben.
- source_word: λεγούσης αὐτοῖς
  choice: die zu ihnen sagte
  rationale: Der feminine Partizipialausdruck bezieht sich auf »Stimme«; ein deutscher Relativsatz ist klar und natürlich.
- source_word: Ἀνάβατε ὧδε
  choice: Kommt hier herauf!
  rationale: Der Imperativ im Plural ist eine Aufforderung zur Aufwärtsbewegung; »hier herauf« bewahrt den deiktischen Gehalt von ὧδε.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: sie stiegen zum Himmel hinauf
  rationale: Die Formulierung gibt die gerichtete Aufwärtsbewegung idiomatisch wieder, ohne den Vorgang mit einem stärker traditionsgeprägten Fachausdruck zu versehen.
- source_word: ἐν τῇ νεφέλῃ
  choice: in der Wolke
  rationale: Der bestimmte Artikel wird bewahrt und lässt einen möglichen Anklang an biblische Szenen göttlicher Gegenwart und Bestätigung offen.
- source_word: ἐθεώρησαν αὐτοὺς
  choice: sahen ihnen zu
  rationale: θεωρέω bezeichnet hier ein beobachtendes Sehen; »ihnen zusehen« gibt diese Nuance natürlich wieder und nimmt αὐτούς auf.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: ihre Feinde
  rationale: Dies ist die klare und idiomatische deutsche Wiedergabe des possessiven Ausdrucks.
theological_decisions:
- issue: Möglicher biblisch-theologischer Anklang von »der Wolke«
  choice: Den bestimmten Ausdruck »in der Wolke« im Haupttext beibehalten
  alternative: »in einer Wolke«
  rationale: Der griechische bestimmte Artikel kann auf das bekannte biblische Motiv der Wolke als Zeichen göttlicher Gegenwart und Bestätigung anspielen. Die gewählte Form bewahrt diese Möglichkeit, ohne sie zur einzig möglichen Deutung zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist lebendig, aber nicht umgangssprachlich; »hier herauf« und »zum Himmel hinauf« halten die räumliche Bewegung klar auseinander. Der bestimmte Artikel bei »Wolke« bleibt bewusst erhalten.
