revisions:
- from: 'Und sie hörten eine laute Stimme aus dem Himmel, die zu ihnen sagte: »Kommt hier herauf!« Da stiegen sie in der Wolke[a] zum Himmel hinauf, und ihre Feinde sahen ihnen zu.'
  to: 'Und sie hörten eine laute Stimme aus dem Himmel, die zu ihnen sagte: »Kommt hier herauf!« Da stiegen sie in der Wolke[a] in den Himmel hinauf, und ihre Feinde sahen ihnen zu.'
  rationale: Die Revision beschränkt sich auf die explizite Wiedergabe der Zielrichtung von εἰς τὸν οὐρανόν und eine präzisere, nicht konfessionell festgelegte Formulierung der Fußnote. Die mögliche Anspielung des bestimmten Artikels bei »der Wolke« bleibt erhalten.
