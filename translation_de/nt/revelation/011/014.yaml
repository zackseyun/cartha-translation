id: REV.11.14
reference: Revelation 11:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: de
  text: Das zweite Wehe ist vorüber; siehe, das dritte Wehe kommt schnell[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bald. Das griechische Wort ταχύ kann sowohl zeitliche Nähe als auch Schnelligkeit ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Wehe
  rationale: „Wehe“ bewahrt den Charakter als Klage- und Unheilsruf sowie die apokalyptische Bezeichnung der nummerierten Gerichte in der Offenbarung.
- source_word: δευτέρα
  choice: zweite
  rationale: Die Ordnungszahl bezieht sich unmittelbar auf „Wehe“ und wird entsprechend wörtlich wiedergegeben.
- source_word: ἀπῆλθεν
  choice: ist vorüber
  rationale: Das Verb bedeutet wörtlich „ging fort“. Im Zusammenhang einer abgeschlossenen Folge von Unheilsereignissen gibt „ist vorüber“ den Sinn natürlich und prägnant wieder.
- source_word: ἰδού
  choice: siehe
  rationale: „Siehe“ macht als feierlicher Aufmerksamkeitsruf die Dringlichkeit und den prophetischen Ton des griechischen Ausdrucks deutlich.
- source_word: τρίτη
  choice: dritte
  rationale: Die Ordnungszahl wird direkt und eindeutig wiedergegeben.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens bewahrt die lebendige Darstellung des bevorstehenden Kommens, ohne die zeitliche Nähe stärker festzulegen als der Ausgangstext.
- source_word: ταχύ
  choice: schnell
  rationale: ταχύ kann sowohl Schnelligkeit als auch zeitliche Nähe ausdrücken. „Schnell“ bewahrt vorrangig den Aspekt der raschen Ankunft; die mögliche Wiedergabe „bald“ wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von ταχύ im endzeitlichen Zusammenhang
  choice: schnell
  alternative: bald
  rationale: Der griechische Ausdruck kann die Geschwindigkeit beziehungsweise Plötzlichkeit oder die zeitliche Nähe bezeichnen. Der Haupttext entscheidet die endzeitliche Zeitfrage nicht ausdrücklich; die alternative Nuance wird transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Siehe“ bewahrt bewusst den feierlichen prophetischen Aufmerksamkeitsruf; „Wehe“ erhält die feste apokalyptische Terminologie.
