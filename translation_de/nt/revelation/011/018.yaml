  terminology: „Völker“, „Zorn“, „Heiligen“, „deinen Namen fürchten“, „Lohn“ und „Erde“ sind angemessen. Die Paarformel wird mit „den Kleinen und den Großen“ quellennäher wiedergegeben. Die Fußnote zu Erde wird auf die tatsächlich markierte lexikalische Alternative beschränkt.
