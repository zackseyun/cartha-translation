revisions:
- from: Und die Völker wurden zornig, doch dein Zorn ist gekommen und die Zeit, die Toten zu richten und deinen Knechten[a] den Lohn zu geben – den Propheten, den Heiligen und denen, die deinen Namen fürchten, den Kleinen wie den Großen – und die zu vernichten, die die Erde[b] verderben.
  to: Und die Völker wurden zornig, und dein Zorn ist gekommen und die Zeit, dass die Toten gerichtet werden und du deinen Dienern[a] den Lohn gibst – den Propheten, den Heiligen und denen, die deinen Namen fürchten, den Kleinen und den Großen – und die vernichtest, die die Erde[b] verderben.
  rationale: Die Koordination des griechischen Satzes wird ohne hinzugefügte adversative Nuance wiedergegeben. Die passive Beurteilung der Toten bleibt ausdrücklich passiv; die folgenden Handlungen werden im Deutschen idiomatisch mit dem implizit angesprochenen Gott („du“) verbunden. „Dienern“ entspricht modernem Standarddeutsch und dem im englischen Audit Trail gewählten „servants“, während die breitere Bedeutung von δοῦλος in der Fußnote erhalten bleibt. Die Fußnotenanker sind jeweils auf den erläuterten Ausdruck beschränkt.
