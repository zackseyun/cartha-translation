id: REV.11.18
reference: Revelation 11:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: de
  text: Und die Völker wurden zornig, und dein Zorn ist gekommen und die Zeit, dass die Toten gerichtet werden und du deinen Dienern[a] den Lohn gibst – den Propheten, den Heiligen und denen, die deinen Namen fürchten, den Kleinen und den Großen – und die vernichtest, die die Erde[b] verderben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knechten“; das griechische Wort kann je nach Zusammenhang einen Diener, Knecht oder Sklaven bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Bezeichnet hier kollektiv die Völker der Welt; „Völker“ ist im Deutschen natürlicher und weniger politisch-staatlich verengt als „Nationen“.
- source_word: ὠργίσθησαν / ὀργή
  choice: wurden zornig / Zorn
  rationale: Die Wiederaufnahme desselben Wortfeldes wird bewahrt und stellt den Zorn der Völker dem Zorn Gottes gegenüber.
- source_word: καιρός
  choice: die Zeit
  rationale: Bezeichnet den entscheidenden, bestimmten Zeitpunkt; der endzeitliche Sinn ergibt sich aus dem Zusammenhang.
- source_word: κριθῆναι
  choice: zu richten
  rationale: Gibt den passiven griechischen Infinitiv idiomatisch wieder; im Deutschen bezeichnet „die Toten richten“ klar das göttliche Gericht.
- source_word: μισθός
  choice: Lohn
  rationale: „Lohn“ bewahrt den Gedanken göttlicher Vergeltung und Anerkennung, ohne notwendig ein gewöhnliches Arbeitsverhältnis vorauszusetzen.
- source_word: δούλοις
  choice: Knechten
  rationale: „Knechte“ bewahrt in würdigem biblischem Register sowohl Dienst als auch Zugehörigkeit, ohne die im heutigen Wort „Sklaven“ dominierende soziale Konnotation in den Vordergrund zu rücken.
- source_word: ἁγίοις
  choice: den Heiligen
  rationale: Etablierte Bezeichnung für das Gott geweihte Volk; sie wahrt die Gruppenbezeichnung des Ausgangstextes.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: denen, die deinen Namen fürchten
  rationale: Bewahrt die biblische Redeweise des ehrfürchtigen Gottesfürchtens, statt sie interpretierend mit „verehren“ aufzulösen.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: den Kleinen wie den Großen
  rationale: Gibt die umfassende Paarformel natürlich und rhythmisch wieder und schließt Menschen jedes Ranges ein.
- source_word: διαφθεῖραι / διαφθείροντας
  choice: zu vernichten / die ... verderben
  rationale: 'Die zwei Vorkommen desselben Verbs haben hier unterschiedliche Zielrichtungen: Gottes endgültiges Vernichten steht dem fortdauernden Verderben durch die Täter gegenüber; eine mechanisch identische Wiedergabe wäre im Deutschen missverständlich.'
- source_word: γῆ
  choice: Erde
  rationale: Der kosmische Gerichtszusammenhang legt „Erde“ nahe; „Land“ bleibt lexikalisch möglich.
theological_decisions:
- issue: Verhältnis der Satzglieder nach dem Zorn der Völker
  choice: „doch dein Zorn ist gekommen“
  alternative: „und dein Zorn ist gekommen“
  rationale: Das griechische καί verbindet die Glieder, während der inhaltliche Gegensatz zwischen dem Zorn der Völker und Gottes Zorn im Deutschen mit „doch“ natürlich sichtbar wird, ohne die Aussage theologisch zu erweitern.
- issue: Bedeutung von δοῦλος als Bezeichnung für Gottes Volk
  choice: Knechte
  alternative: Diener; Sklaven
  rationale: Der Kontext betont die Zugehörigkeit zu Gott und die Belohnung seiner Leute. „Knechte“ hält Dienst und Unterordnung zusammen; die Bandbreite wird in einer Fußnote offengelegt.
- issue: Bezug der Gruppen „Propheten, Heilige und Gottesfürchtige“
  choice: appositionelle Aufzählung nach „deinen Knechten“
  alternative: mehrere voneinander unabhängige Empfängergruppen
  rationale: Die griechische Struktur lässt die folgenden Gruppen als nähere Entfaltung der Knechte Gottes lesen. Der Gedankenstrich bewahrt diese Beziehung, ohne die genaue Abgrenzung der Gruppen festzulegen.
- issue: Umfang von γῆ
  choice: Erde
  alternative: Land
  rationale: Der apokalyptische Gerichtskontext spricht für weltweiten Bezug; die lokalere Bedeutung „Land“ wird als lexikalische Möglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener biblischer Bild- und Begriffssprache. Die lange, feierliche Satzbewegung des griechischen Hymnus bleibt erhalten; Gedankenstriche gliedern die Empfänger des Lohns. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
