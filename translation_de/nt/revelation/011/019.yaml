id: REV.11.19
reference: Revelation 11:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: de
  text: Und der Tempel[a] Gottes im Himmel wurde geöffnet, und die Lade seines Bundes wurde in seinem Tempel gesehen[b]; und es kamen Blitze, Stimmen[c] und Donner, ein Erdbeben und großer Hagel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heiligtum“. Das griechische Wort ναός kann besonders den inneren heiligen Bereich des Tempels bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „die Lade seines Bundes“; gemeint ist Gottes Bund. Möglich ist auch die geläufige Bezeichnung „die Bundeslade“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Laute“ beziehungsweise „Getöse“. Die Offenbarung verwendet „Stimmen“ wiederholt in solchen Szenen göttlicher Majestät und göttlichen Gerichts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: Tempel
  rationale: „Tempel“ ist im modernen Deutsch die natürliche Wiedergabe und bezeichnet hier Gottes himmlische Wohnstätte; „Heiligtum“ bleibt als genauere Bezeichnung des inneren Tempelbereichs möglich.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Die Wendung wird attributiv auf Gottes Tempel bezogen und idiomatisch-lokal wiedergegeben.
- source_word: ἠνοίγη
  choice: wurde geöffnet
  rationale: Das Passiv bewahrt den Ereignischarakter und lässt den Handelnden wie im Griechischen unausgesprochen.
- source_word: ὤφθη
  choice: wurde … gesehen
  rationale: Die passive Form entspricht dem Griechischen und legt nicht fest, ob die Lade aktiv erschien oder lediglich sichtbar wurde.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: die Lade seines Bundes
  rationale: „Seines“ gibt αὐτοῦ ausdrücklich wieder und bezieht den Bund auf Gott; „Bund“ ist die sachgerechte moderne Wiedergabe von διαθήκη.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: in seinem Tempel
  rationale: Die Wiederholung von ναός und das Possessivpronomen werden beibehalten.
- source_word: ἐγένοντο
  choice: da kamen
  rationale: Die Form bezeichnet das Einsetzen der folgenden Erscheinungen; „da kamen“ ist natürlich und bewahrt stärker als ein bloßes „es gab“ den Ereignischarakter.
- source_word: ἀστραπαὶ
  choice: Blitze
  rationale: Die Pluralform wird knapp und idiomatisch wiedergegeben.
- source_word: φωναὶ
  choice: Stimmen
  rationale: Die wörtliche Wiedergabe bewahrt die charakteristische theophanische Ausdrucksweise der Offenbarung; „Laute“ oder „Getöse“ sind kontextuell möglich.
- source_word: βρονταὶ
  choice: Donner
  rationale: „Donner“ ist im Deutschen als Sammelbezeichnung natürlich und kann die griechische Mehrzahl in dieser Reihung angemessen ausdrücken.
- source_word: σεισμὸς
  choice: ein Erdbeben
  rationale: Dies ist die übliche und kontextgemäße Wiedergabe.
- source_word: χάλαζα μεγάλη
  choice: großer Hagel
  rationale: Die Formulierung bleibt eng an Substantiv und Adjektiv und wahrt den gehobenen apokalyptischen Ton.
theological_decisions:
- issue: Bedeutung des himmlischen ναός
  choice: Tempel
  alternative: Heiligtum
  rationale: „Tempel“ vermeidet eine unnötige Festlegung auf eine bestimmte himmlische Architektur; die mögliche engere Bedeutung „Heiligtum“ wird in einer Fußnote dokumentiert.
- issue: Bedeutung von φωναὶ in der theophanischen Reihe
  choice: Stimmen
  alternative: Laute oder Getöse
  rationale: „Stimmen“ bewahrt den Wortlaut und die wiederkehrende Ausdrucksweise der Offenbarung, ohne die Spannung zugunsten rein meteorologischer Geräusche aufzulösen.
- issue: Sichtbarwerden der Bundeslade
  choice: wurde gesehen
  alternative: erschien / wurde sichtbar
  rationale: Die passive Wiedergabe wahrt die Offenheit darüber, ob die Lade selbst hervortrat oder dem Seher lediglich sichtbar gemacht wurde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die markante Reihung der theophanischen Erscheinungen bleibt erhalten; das Semikolon des Griechischen wird zur besseren deutschen Lesbarkeit durch einen Satzpunkt mit „Da“ wiedergegeben.
