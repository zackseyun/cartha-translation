id: REV.11.2
reference: Revelation 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: de
  text: Den Vorhof aber, der außerhalb des Tempels[a] liegt, lass aus und miss ihn nicht; denn er ist den Völkern[b] gegeben worden, und sie werden die heilige Stadt zweiundvierzig Monate lang zertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Heiligtums«. Das griechische Wort kann enger das Heiligtum beziehungsweise das Tempelhaus statt der gesamten Tempelanlage bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Heiden«. Das griechische Wort kann sowohl »Völker« als auch »Heiden« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: Vorhof
  rationale: Im Zusammenhang mit dem Tempel bezeichnet das Wort einen Hofbereich. »Vorhof« ist im Deutschen die geläufige und präzise Bezeichnung.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: der außerhalb des Tempels liegt
  rationale: Die Formulierung beschreibt den Vorhof als außerhalb des ναός gelegen. Der Relativsatz macht den räumlichen Bezug im Deutschen klar, ohne den Text als »äußerer Vorhof« stärker zu deuten.
- source_word: ναός
  choice: Tempel
  rationale: »Tempel« ist im Haupttext natürlich und verständlich. Da ναός hier enger das Heiligtum beziehungsweise Tempelhaus bezeichnen kann, wird diese Möglichkeit in einer Fußnote bewahrt.
- source_word: ἔκβαλε ἔξωθεν
  choice: lass aus
  rationale: In Verbindung mit dem anschließenden Verbot des Messens geht es um den Ausschluss vom Messvorgang, nicht notwendig um ein buchstäbliches Hinauswerfen. »Lass aus« gibt diesen Sinn knapp und idiomatisch wieder.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: miss ihn nicht
  rationale: Die direkte Aufforderung in der zweiten Person Singular und der Bezug auf den Vorhof werden im Deutschen klar bewahrt.
- source_word: ἐδόθη
  choice: ist … gegeben worden
  rationale: Das Passiv bleibt erhalten, ohne den im Griechischen nicht genannten Handelnden ausdrücklich als Gott zu bestimmen.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: ἔθνη kann allgemein »Völker« oder im Gegensatz zu Israel »Heiden« bedeuten. »Völker« bewahrt die breitere, in der Offenbarung geläufige Bedeutung; die Alternative steht in der Fußnote.
- source_word: πόλιν τὴν ἁγίαν
  choice: die heilige Stadt
  rationale: Dies ist die natürliche und traditionelle Wiedergabe, ohne die Stadt im Haupttext ausdrücklich mit Jerusalem gleichzusetzen.
- source_word: πατήσουσιν
  choice: sie werden … zertreten
  rationale: »Zertreten« bewahrt das starke Bild feindlicher Entweihung oder Unterwerfung und entspricht dem Futur des griechischen Verbs.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: zweiundvierzig Monate lang
  rationale: »Lang« macht den Akkusativ der Zeitdauer in natürlichem Deutsch ausdrücklich.
theological_decisions:
- issue: Bedeutungsumfang von ναός in der Tempelvision
  choice: Im Haupttext steht »Tempel«.
  alternative: »Heiligtum« beziehungsweise »Tempelhaus«
  rationale: Die Gegenüberstellung mit dem außerhalb gelegenen Vorhof kann für die engere Bedeutung »Heiligtum« sprechen. Die Fußnote bewahrt diese für die Auslegung relevante Möglichkeit, ohne den Haupttext unnötig zu erschweren.
- issue: Bedeutung von ἔθνεσιν
  choice: Im Haupttext steht »Völkern«.
  alternative: »Heiden«
  rationale: Der griechische Ausdruck kann entweder die Völker allgemein oder die Nichtjuden im religiös-ethnischen Sinn bezeichnen. »Völker« legt sich weniger stark fest; »Heiden« wird als echte Alternative genannt.
- issue: Ungenannter Handelnder beim Passiv ἐδόθη
  choice: Das Passiv »ist … gegeben worden« bleibt ohne ausdrückliche Nennung des Handelnden stehen.
  alternative: »Gott hat ihn den Völkern gegeben«
  rationale: Ein göttliches Handeln kann im Kontext mitgehört werden, wird im griechischen Satz jedoch nicht ausdrücklich benannt. Die Übersetzung fügt diese Deutung daher nicht in den Text ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der Abfolge des griechischen Textes, wird aber durch einen Relativsatz und ein Semikolon natürlich gegliedert. Bildsprache, Passivform und auslegungsrelevante Mehrdeutigkeiten bleiben erhalten.
