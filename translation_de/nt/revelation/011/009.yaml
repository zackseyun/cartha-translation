id: REV.11.9
reference: Revelation 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: de
  text: Und Menschen aus den Völkern, Stämmen, Sprachen und Nationen sehen ihren Leichnam dreieinhalb Tage lang an[a] und lassen nicht zu, dass ihre Leichname in ein Grab gelegt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht zuerst „ihren Leichnam“ in der Einzahl und danach „ihre Leichname“ in der Mehrzahl. Die Einzahl kann die beiden Zeugen als eine gemeinsame Zeugenschaft darstellen, bevor wieder von ihren einzelnen Leichnamen die Rede ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: sehen … an
  rationale: Das Präsens und die konkrete, fortdauernde Blickhandlung werden in natürlichem Deutsch bewahrt.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: Menschen aus den Völkern, Stämmen, Sprachen und Nationen
  rationale: 'Die partitive Bedeutung von ἐκ wird idiomatisch wiedergegeben: Gemeint sind Menschen aus diesen Gruppen, nicht notwendig alle ihre Angehörigen.'
- source_word: λαῶν
  choice: Völkern
  rationale: Der Plural bewahrt die verschiedenen kollektiven Gruppen der wiederkehrenden Aufzählung in der Offenbarung.
- source_word: φυλῶν
  choice: Stämmen
  rationale: Dies ist die etablierte und kontextgerechte deutsche Entsprechung in ethnografischen Aufzählungen.
- source_word: γλωσσῶν
  choice: Sprachen
  rationale: Die Bedeutung ist für heutige Leser klarer als das traditionelle „Zungen“.
- source_word: ἐθνῶν
  choice: Nationen
  rationale: Der Ausdruck passt zur festen Aufzählungsformel der Offenbarung und ist hier weniger einengend als „Heiden“.
- source_word: τὸ πτῶμα αὐτῶν
  choice: ihren Leichnam
  rationale: Der Singular des griechischen Textes bleibt trotz der zwei Zeugen sichtbar und kann sie in diesem Bild als gemeinsame Zeugenschaft darstellen.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: dreieinhalb Tage lang
  rationale: Natürliche deutsche Wiedergabe des Akkusativs der Zeitdauer.
- source_word: τὰ πτώματα αὐτῶν
  choice: ihre Leichname
  rationale: Der anschließende Wechsel zum Plural im griechischen Text wird ausdrücklich bewahrt.
- source_word: οὐκ ἀφίουσιν
  choice: lassen nicht zu
  rationale: ἀφίημι bezeichnet hier das Erlauben oder Zulassen, nicht das Verlassen oder Vergeben.
- source_word: τεθῆναι εἰς μνῆμα
  choice: in ein Grab gelegt werden
  rationale: Die Formulierung bewahrt das konkrete Hineinlegen in eine Begräbnisstätte und ist enger am griechischen Ausdruck als das allgemeinere „begraben werden“.
theological_decisions:
- issue: Singular πτῶμα im ersten Satzteil gegenüber Plural πτώματα im zweiten
  choice: Zuerst „ihren Leichnam“ im Singular, danach „ihre Leichname“ im Plural
  alternative: Beide Vorkommen zur stilistischen Glättung im Plural wiedergeben
  rationale: Der griechische Text weist den auffälligen Numeruswechsel auf. Ihn zu bewahren hält die mögliche Spannung zwischen den zwei Zeugen als gemeinsamer Zeugenschaft und ihren einzelnen Leichnamen offen, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Viererformel bleibt erhalten; der ungewöhnliche Wechsel zwischen Singular und Plural wird nicht geglättet.
