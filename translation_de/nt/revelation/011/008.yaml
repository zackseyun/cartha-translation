id: REV.11.8
reference: Revelation 11:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: de
  text: Und ihr Leichnam[a] liegt auf der Straße[b] der großen Stadt, die in geistlichem Sinn[c] Sodom und Ägypten genannt wird und in der auch ihr Herr gekreuzigt wurde.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „Leichnam“ im Singular, obwohl von den zwei Zeugen die Rede ist; sie werden hier als Einheit zusammengefasst.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „auf dem öffentlichen Platz“. Das griechische Wort kann eine breite Straße oder einen Platz bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bildlich“ beziehungsweise „symbolisch“. Wörtlicher: „geistlich“.'
    reason: lexical_alternative
  - marker: d
    text: Die Aussage, dass dort ihr Herr gekreuzigt wurde, weist auf Jerusalem; der Text selbst belässt es jedoch bei der symbolischen Bezeichnung „die große Stadt“.
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: ihr Leichnam
  rationale: πτῶμα bezeichnet einen toten, hingestürzten Körper. Das griechische Substantiv steht trotz des Bezugs auf die zwei Zeugen im Singular; „ihr Leichnam“ bewahrt diese auffällige Zusammenfassung als Einheit.
- source_word: ἐπὶ τῆς πλατείας
  choice: auf der Straße
  rationale: πλατεία kann eine breite Straße oder einen öffentlichen Platz bezeichnen. „Auf der Straße“ ist hier natürlich und lässt die öffentliche Zurschaustellung erkennen, ohne die Form des Ortes zu eng festzulegen.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: der großen Stadt
  rationale: Die formnahe Wiedergabe bewahrt die in der Offenbarung bedeutsame apokalyptische Bezeichnung.
- source_word: πνευματικῶς
  choice: in geistlichem Sinn
  rationale: Die Wendung gibt den adverbialen Sinn verständlich wieder und bewahrt den Bezug auf eine geistliche Deutung; „bildlich“ oder „symbolisch“ wäre stärker interpretierend.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: Sodom und Ägypten
  rationale: Die Eigennamen werden in ihrer üblichen deutschen Form wiedergegeben; ihre symbolische Aussage wird nicht in den Haupttext hineinerklärt.
- source_word: ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη
  choice: und in der auch ihr Herr gekreuzigt wurde
  rationale: „In der“ nimmt im Deutschen eindeutig die Stadt auf, während „auch“, der Herrentitel und das historische Passiv des griechischen Textes erhalten bleiben.
theological_decisions:
- issue: Singular πτῶμα bei zwei Zeugen
  choice: Singular „ihr Leichnam“ beibehalten
  alternative: „ihre Leichname“ oder „ihre toten Körper“
  rationale: Der griechische Text behandelt die beiden Zeugen an dieser Stelle sprachlich als Einheit. Die ungewöhnliche Form soll nicht stillschweigend geglättet werden.
- issue: Bedeutung von πνευματικῶς
  choice: „in geistlichem Sinn“
  alternative: „bildlich“ oder „symbolisch“
  rationale: Die Übersetzung wahrt die geistliche beziehungsweise symbolische Deutungsebene, ohne sie auf eine rein literarische Metapher zu reduzieren.
- issue: Identität der „großen Stadt“
  choice: Die Stadt im Haupttext nicht ausdrücklich Jerusalem nennen
  alternative: „Jerusalem“ als erklärende Einfügung
  rationale: Der Hinweis auf die Kreuzigung des Herrn weist auf Jerusalem, doch der Text selbst behält die apokalyptische Bezeichnung „die große Stadt“ und die Namen Sodom und Ägypten bei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der apokalyptischen Bildsprache des Ausgangstextes, verwendet aber eine klare deutsche Syntax. Der auffällige kollektive Singular „ihr Leichnam“ bleibt bewusst erhalten und wird durch eine Fußnote erläutert.
