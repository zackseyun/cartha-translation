  source_fidelity: Die Gegenwartsformen χαίρουσιν und εὐφραίνονται sowie das Futur πέμψουσιν sind zutreffend wiedergegeben. Die Wiedergabe von ἐβασάνισαν als Plusquamperfekt („gequält hatten“) legt jedoch eine vom griechischen Aorist nicht geforderte Vorvergangenheit fest. Ein deutsches Perfekt gibt die abgeschlossene Handlung im erzählerischen Zusammenhang wieder, ohne diese zusätzliche zeitliche Relation zu setzen.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. Die einheitliche Formulierung „diejenigen, die auf der Erde wohnen“ ist etwas ausführlicher als die substantivierte Partizipialform, aber idiomatisch, eindeutig und bewahrt die wiederholte verbale Struktur.
  terminology: „sich freuen“, „feiern“, „Geschenke schicken“ und „quälen“ geben die jeweiligen griechischen Ausdrücke angemessen wieder. Die wiederkehrende Offenbarungsformel wird in beiden Vorkommen gleich wiedergegeben, ohne ihre mögliche theologische Konnotation ausdeutend in den Haupttext einzutragen.
