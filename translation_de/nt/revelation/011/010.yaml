id: REV.11.10
reference: Revelation 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: de
  text: Und diejenigen, die auf der Erde wohnen, freuen sich über sie und feiern; sie werden einander Geschenke schicken, denn diese beiden Propheten haben diejenigen, die auf der Erde wohnen, gequält.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: die auf der Erde wohnen / die auf der Erde Wohnenden
  rationale: Die partizipiale Wendung und ihr in der Offenbarung wiederkehrender Charakter bleiben erkennbar. Die substantivierte Form am Versende vermeidet im Deutschen eine schwerfällige vollständige Wiederholung, ohne den Bezug zu verändern.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: freuen sich über sie
  rationale: Gibt sowohl die Freude als auch ihren Bezug auf die beiden Propheten knapp und natürlich wieder.
- source_word: εὐφραίνονται
  choice: feiern
  rationale: Unterscheidet das Verb von χαίρουσιν und vermittelt den festlichen Charakter der Freude in gegenwärtigem Deutsch.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: Sie werden einander Geschenke schicken
  rationale: Bewahrt den Futur und die wechselseitige Handlung, ohne sie deutend als Geschenketausch zu formulieren.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: diese beiden Propheten
  rationale: Natürliche und genaue Wiedergabe der demonstrativen Nominalgruppe.
- source_word: ἐβασάνισαν
  choice: gequält hatten
  rationale: Bewahrt die Intensität von βασανίζω. Das deutsche Plusquamperfekt macht natürlich deutlich, dass die Qual der anschließenden Freude und dem Schenken vorausging.
theological_decisions:
- issue: Die in der Offenbarung wiederkehrende Bezeichnung der erdgebundenen, Gott widerstehenden Menschheit
  choice: die auf der Erde wohnen
  alternative: die Bewohner der Erde
  rationale: Die gewählte Form bewahrt die verbale Struktur des Griechischen und lässt den im Kontext der Offenbarung mitschwingenden theologischen Sinn bestehen, ohne ihn im Haupttext ausdrücklich auszudeuten.
- issue: Stärke der Wirkung der beiden Zeugen auf die Erdbewohner
  choice: gequält hatten
  alternative: bedrängt hatten
  rationale: Die starke Aussage des griechischen Verbs wird nicht abgeschwächt; zugleich wird keine nähere Art der Qual hinzugefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Wendung wird möglichst konsistent gehalten; die zwei Verben der Freude werden als „sich freuen“ und „feiern“ differenziert. Keine Fußnote ist erforderlich, da keine wesentliche textliche oder semantische Mehrdeutigkeit im Haupttext verdeckt wird.
