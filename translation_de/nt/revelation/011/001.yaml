id: REV.11.1
reference: Revelation 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: de
  text: 'Und mir wurde ein Rohr gegeben, das einem Stab glich, mit den Worten: „Steh auf und miss den Tempel[a] Gottes, den Altar und die, die darin anbeten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Heiligtum Gottes“. Das griechische Wort ναός kann genauer das innere Tempelgebäude bezeichnen und nicht die gesamte Tempelanlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: mir wurde … gegeben
  rationale: Die Passivkonstruktion mit Dativpronomen bewahrt den Fokus des griechischen Textes auf dem Gegebenwerden, ohne den Geber ausdrücklich zu benennen.
- source_word: κάλαμος
  choice: Rohr
  rationale: Dies gibt die Grundbedeutung wieder und unterscheidet den Gegenstand weiterhin von dem anschließend zum Vergleich genannten Stab.
- source_word: ὅμοιος ῥάβδῳ
  choice: das einem Stab glich
  rationale: Die Formulierung gibt den Vergleich mit ὅμοιος und Dativ natürlich wieder, ohne den Gegenstand bereits als Messstab zu deuten.
- source_word: λέγων
  choice: mit den Worten
  rationale: Die deutsche Wendung gibt die begleitende Rede wieder und lässt wie der Kontext offen, wer spricht; das im Deutschen unnatürliche wörtliche „sagend“ wird vermieden.
- source_word: Ἔγειρε
  choice: Steh auf
  rationale: Der direkte Imperativ ist in modernem Deutsch natürlich und entspricht der Aufforderung des Aoristimperativs.
- source_word: μέτρησον
  choice: miss
  rationale: Direkte und knappe Wiedergabe des Imperativs von μετρέω.
- source_word: ναὸν τοῦ θεοῦ
  choice: den Tempel Gottes
  rationale: „Tempel“ ist die verständliche Hauptwiedergabe; die mögliche engere Bedeutung „Heiligtum/inneres Tempelgebäude“ wird in einer Fußnote erhalten.
- source_word: θυσιαστήριον
  choice: den Altar
  rationale: „Altar“ ist die übliche Wiedergabe und legt nicht fest, welcher Altar in der Vision gemeint ist.
- source_word: τοὺς προσκυνοῦντας
  choice: die, die … anbeten
  rationale: Die substantivierte Partizipialform wird mit ihrer verbalen Aussage wiedergegeben und bleibt in modernem Deutsch verständlich.
- source_word: ἐν αὐτῷ
  choice: darin
  rationale: Das Pronomen bezieht sich am natürlichsten räumlich auf den Tempel; „darin“ drückt diesen Rückbezug knapp aus.
theological_decisions:
- issue: Bezug von ναός im apokalyptischen Kontext
  choice: Tempel Gottes
  alternative: Heiligtum Gottes
  rationale: Der Vers entscheidet nicht, ob ein irdischer Tempel, ein himmlisches Heiligtum oder eine symbolische Wirklichkeit gemeint ist. Die Übersetzung legt keine bestimmte endzeitliche Deutung fest.
- issue: Identität des durch λέγων angedeuteten Sprechers
  choice: durch „mit den Worten“ offengelassen
  alternative: „ein Engel sagte“ oder „eine Stimme sagte“
  rationale: Der griechische Text nennt den Sprecher nicht ausdrücklich. Daher wird weder ein Engel noch eine Stimme ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt nahe an der visionären Erzählung, vermeidet aber das im Deutschen unnatürliche partizipiale „sagend“. Die Fußnotenmarke steht unmittelbar bei „Tempel“, auf dessen griechisches Ausgangswort sich die Anmerkung bezieht.
