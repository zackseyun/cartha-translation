id: REV.11.15
reference: Revelation 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: de
  text: 'Und der siebte Engel blies die Posaune[a]. Da erhoben sich laute Stimmen im Himmel. Sie sagten: »Die Herrschaft über die Welt ist unserem Herrn und seinem Messias[b] zuteilgeworden, und er wird für immer und ewig herrschen.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben sinngemäß: „Die Reiche der Welt sind … geworden“ oder: „Das Reich dieser Welt ist … geworden.“ Der hier zugrunde gelegte griechische Text hat den Singular: „die Herrschaft über die Welt“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „seinem Christus“. Das griechische Χριστός ist ein Titel und bedeutet „der Gesalbte“, also „Messias“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in die Zeitalter der Zeitalter“; eine griechische Wendung für unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: blies die Posaune
  rationale: Das Verb bezeichnet das Blasen beziehungsweise Ertönenlassen einer Posaune; die im Griechischen mitgemeinte Posaune wird im Deutschen ausdrücklich genannt.
- source_word: φωναὶ μεγάλαι
  choice: laute Stimmen
  rationale: Da die Stimmen anschließend etwas sagen, bezeichnet φωναί hier sprechende Stimmen; μεγάλαι wird idiomatisch mit „laut“ wiedergegeben.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Der Zusammenhang in der Offenbarung meint den himmlischen Bereich, nicht bloß den sichtbaren Himmel.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: Die Herrschaft über die Welt ist … zuteilgeworden
  rationale: βασιλεία bezeichnet hier die königliche Herrschaft. Die Formulierung bewahrt den Singular des SBLGNT und gibt das verkündete, nun eingetretene Geschehen natürlich wieder.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unserem Herrn
  rationale: Der Genitiv bezeichnet hier die neue Zugehörigkeit der Weltherrschaft; „Herr“ ist die angemessene Wiedergabe von κύριος.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: seinem Messias
  rationale: Χριστός steht als Titel des von Gott Gesalbten und wird deshalb mit „Messias“ wiedergegeben.
- source_word: καὶ βασιλεύσει
  choice: und er wird … herrschen
  rationale: Das griechische Verb steht im Singular. Das Pronomen lässt den im Griechischen knapp gehaltenen Bezug unaufgelöst.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die wörtliche Wendung „in die Zeitalter der Zeitalter“ ist eine feste Verstärkungsformel für unbegrenzte Dauer; „für immer und ewig“ ist ihre natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck ist hier durch „sein“ deutlich als Titel gekennzeichnet. „Messias“ bewahrt den Sinn „der Gesalbte“, ohne Χριστός wie einen Eigennamen zu behandeln.
- issue: Subjekt von βασιλεύσει
  choice: er wird herrschen
  alternative: sie werden herrschen / der Herr und sein Messias werden herrschen
  rationale: Das griechische Verb ist singular. Die Übersetzung bewahrt sowohl diese grammatische Form als auch die knappe, nicht ausdrücklich erläuterte Zuordnung des singularischen Subjekts.
- issue: Bedeutung von βασιλεία
  choice: Herrschaft
  alternative: Reich / Königsherrschaft
  rationale: Im Satz steht der Übergang der Weltherrschaft an Gott und seinen Messias im Vordergrund. „Herrschaft“ passt zudem unmittelbar zum folgenden Verb „herrschen“, ohne die Aussage auf ein räumliches Reich einzuengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Verkündigungston. Die Satzteilung macht die Szene klar lesbar. Archaische Formen werden vermieden; der singularische und theologisch spannungsvolle Bezug von „er“ bleibt erhalten.
