id: REV.11.13
reference: Revelation 11:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: de
  text: Und in jener Stunde ereignete sich ein großes Erdbeben. Ein Zehntel der Stadt stürzte ein, und bei dem Erdbeben kamen siebentausend Menschen[a] ums Leben. Die Übrigen wurden von Furcht ergriffen und gaben dem Gott des Himmels die Ehre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Namen von Menschen, siebentausend“ – eine Ausdrucksweise, bei der Personen als gezählte Namen bezeichnet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: in jener Stunde
  rationale: Die relativ formale Wiedergabe bewahrt die anschauliche zeitliche Unmittelbarkeit des apokalyptischen Berichts und klingt im Deutschen würdevoll und verständlich.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: ereignete sich ein großes Erdbeben
  rationale: „Sich ereignen“ gibt den Ereignischarakter von ἐγένετο im Deutschen natürlich wieder; μέγας wird unmittelbar mit „groß“ wiedergegeben.
- source_word: τὸ δέκατον τῆς πόλεως
  choice: ein Zehntel der Stadt
  rationale: Natürliche moderne Wiedergabe des partitiven Ausdrucks unter Wahrung der genauen Zahlenangabe.
- source_word: ἔπεσεν
  choice: stürzte ein
  rationale: Bei einem Stadtteil im Zusammenhang mit einem Erdbeben bezeichnet „stürzte ein“ das Fallen idiomatisch, ohne über den Kontext hinaus zusätzliche Einzelheiten einzutragen.
- source_word: ἀπεκτάνθησαν ἐν τῷ σεισμῷ
  choice: kamen bei dem Erdbeben ums Leben
  rationale: Der griechische Passivsatz bezeichnet Getötete; die deutsche Formulierung ist natürlich und lässt offen, ob Personen unmittelbar oder durch Folgen des Bebens starben.
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: siebentausend Menschen
  rationale: „Namen von Menschen“ dient hier zur Zählung von Personen. Im Haupttext wird der Sinn verständlich wiedergegeben, während die auffällige wörtliche Form in einer Fußnote erhalten bleibt.
- source_word: οἱ λοιποὶ
  choice: die Übrigen
  rationale: Direkte Wiedergabe, die nicht deutend „die Überlebenden“ einsetzt.
- source_word: ἔμφοβοι ἐγένοντο
  choice: wurden von Furcht ergriffen
  rationale: Die Formulierung wahrt den Eintritt des Zustands und die Stärke der Furcht in natürlichem, würdigem Deutsch.
- source_word: ἔδωκαν δόξαν
  choice: gaben … die Ehre
  rationale: Die etablierte deutsche Wendung bewahrt das biblische Idiom und vermeidet eine Deutung als ausdrückliche Bekehrung.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: dem Gott des Himmels
  rationale: Bewahrt die genitivische Gottesbezeichnung formal und entspricht geläufigem biblischem Deutsch.
theological_decisions:
- issue: Ob die Reaktion der Übrigen ausdrücklich als echte Umkehr oder rettender Glaube zu verstehen ist
  choice: Der Text nennt Furcht und das Geben der Ehre an den Gott des Himmels, ohne die innere geistliche Qualität der Reaktion festzulegen.
  alternative: Die Reaktion könnte als echte Umkehr oder lediglich als furchtsame Anerkennung von Gottes Macht gedeutet werden.
  rationale: Das Griechische beschreibt die Reaktion, bezeichnet sie jedoch nicht ausdrücklich als Umkehr oder Glauben. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zum griechischen Text. Der auffällige Ausdruck „Namen von Menschen“ wird zugunsten unmittelbarer Verständlichkeit im Haupttext sinnentsprechend wiedergegeben und in der Fußnote dokumentiert.
