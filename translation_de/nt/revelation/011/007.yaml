  to: Und wenn sie ihr Zeugnis vollendet haben, wird das Tier, das aus dem Abgrund heraufsteigt, gegen sie Krieg führen, sie besiegen und sie töten.
  rationale: Die einzige sichere Korrektur betrifft die idiomatische Wiedergabe der griechischen Kriegsformel. „Gegen sie Krieg führen“ gibt ihre feindliche Bedeutung im modernen Deutschen eindeutig wieder. Die Fußnote entfällt, weil die bisherige Hauptfassung nicht als gleichwertige, unmissverständliche deutsche Alternative beibehalten werden sollte.
