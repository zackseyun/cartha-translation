review_pass:
  verdict: revise
  source_fidelity: 'Die Abfolge und die zentralen Begriffe sind ansonsten quellentreu wiedergegeben: Der zukünftige Abschluss des Zeugnisses, das aus dem Abgrund heraufsteigende Tier sowie Besiegen und Töten entsprechen dem griechischen Text. Bei ποιήσει μετ’ αὐτῶν πόλεμον bezeichnet die Wendung jedoch eine feindliche Kriegführung gegen die Zeugen; eine formale Übertragung mit „mit ihnen“ ist im modernen Deutschen missverständlich.'
  naturalness: „Und wenn sie ihr Zeugnis vollendet haben“ und die anschließende Verbfolge sind natürliches, würdiges modernes Standarddeutsch. „Mit ihnen Krieg führen“ kann dagegen nahelegen, dass das Tier gemeinsam mit ihnen Krieg führt. „Gegen sie Krieg führen“ ist idiomatisch und stellt den Kontext klar.
  terminology: „Zeugnis“, „Tier“, „Abgrund“, „besiegen“ und „töten“ sind passende, etablierte und nicht unnötig ausdeutende Wiedergaben. Eine Fußnote zur feindlichen Bedeutung von μετά ist nicht erforderlich, wenn diese idiomatische Bedeutung im Haupttext steht.
  issues:
  - severity: medium
    issue: „mit ihnen Krieg führen“ ist im Deutschen mehrdeutig.
    rationale: Obwohl μετά mit Genitiv wörtlich oft „mit“ bedeutet, trägt die griechische feste Kriegsformel hier den Sinn „gegen sie Krieg führen“. Der unmittelbare Kontext („besiegen“ und „töten“) bestätigt dies. Die deutsche Formulierung kann eine gemeinsame Kriegsführung suggerieren und sollte daher nicht als Haupttext stehen.
  revised_text: Und wenn sie ihr Zeugnis vollendet haben, wird das Tier, das aus dem Abgrund heraufsteigt, gegen sie Krieg führen, sie besiegen und sie töten.
