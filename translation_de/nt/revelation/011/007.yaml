id: REV.11.7
reference: Revelation 11:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: de
  text: Und wenn sie ihr Zeugnis vollendet haben, wird das Tier, das aus dem Abgrund heraufsteigt, gegen sie Krieg führen, sie besiegen und sie töten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσωσιν
  choice: vollendet haben
  rationale: Der Aorist Konjunktiv nach ὅταν bezeichnet einen zukünftigen, noch ausstehenden Zeitpunkt. „Vollendet haben“ gibt sowohl den Abschluss als auch die zeitliche Vorordnung natürlich wieder.
- source_word: μαρτυρίαν
  choice: Zeugnis
  rationale: „Zeugnis“ bewahrt den Sinn des öffentlichen Bezeugens und ist im Deutschen die natürliche Entsprechung in dieser Verbindung.
- source_word: θηρίον
  choice: Tier
  rationale: „Tier“ ist die etablierte und sachlich passende Bezeichnung für θηρίον in der apokalyptischen Bildwelt der Offenbarung; „wildes Tier“ wäre hier unnötig erklärend.
- source_word: ἀναβαῖνον
  choice: heraufsteigt
  rationale: Das präsentische Partizip wird als Relativsatz wiedergegeben. „Heraufsteigt“ bewahrt die gerichtete Bewegung aus dem Abgrund.
- source_word: ἀβύσσου
  choice: Abgrund
  rationale: „Abgrund“ entspricht ἄβυσσος knapp und natürlich, ohne die ausdeutende Vorstellung eines „bodenlosen Schachts“ einzutragen.
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: wird mit ihnen Krieg führen
  rationale: Die Formulierung bildet μετά mit Genitiv eng ab und ist im Deutschen als feindliche Wendung verständlich. Die eindeutigere Wiedergabe „gegen sie“ wird als Alternative vermerkt.
- source_word: νικήσει
  choice: besiegen
  rationale: Im unmittelbaren Kriegskontext bezeichnet νικάω den Sieg über die beiden Zeugen. „Besiegen“ ist idiomatisch und erhält die Konfliktvorstellung.
- source_word: ἀποκτενεῖ
  choice: töten
  rationale: „Töten“ ist die direkte, moderne Entsprechung und vermeidet sowohl archaisches als auch unnötig umschreibendes Deutsch.
theological_decisions:
- issue: Feindliche Beziehung in ποιήσει μετ’ αὐτῶν πόλεμον
  choice: mit ihnen Krieg führen
  alternative: gegen sie Krieg führen
  rationale: Der griechische Text verwendet μετά mit Genitiv, während der Zusammenhang durch „besiegen“ und „töten“ die Feindschaft unmissverständlich macht. Die Hauptfassung bleibt nahe an der Konstruktion; die Fußnote bietet die im Deutschen explizitere Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der dramatischen Abfolge des griechischen Textes; die wiederholten Pronomen vor „besiegen“ und „töten“ bewahren den Nachdruck des Originals.
