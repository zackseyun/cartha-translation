  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: de
  text: 'und sagten: „Wir danken dir, Herr, Gott, Allmächtiger, der du bist und der du warst,[a] denn du hast deine große Macht ergriffen und deine Herrschaft angetreten.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der Seiende und der, der war“. Einige Handschriften und Übersetzungen ergänzen entsprechend anderen Stellen der Offenbarung „und der kommt“; im hier zugrunde gelegten griechischen Text fehlt dieser Ausdruck.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „und hast geherrscht“ beziehungsweise „und bist König geworden“. Das griechische Verb kann den Beginn oder die Ausübung königlicher Herrschaft bezeichnen; hier steht wahrscheinlich ihr machtvolles öffentliches Hervortreten im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: indem sie sagten
  rationale: Das präsentische Partizip führt, an den vorherigen Vers anschließend, den Inhalt der Rede der Ältesten ein. „Indem sie sagten“ bildet diese syntaktische Verbindung natürlich ab.
- source_word: Εὐχαριστοῦμέν σοι
  choice: Wir danken dir
  rationale: εὐχαριστέω bedeutet hier „danken“. Die knappe deutsche Wendung ist natürlich und behält den feierlichen Gebetscharakter.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Herr, Gott, Allmächtiger
  rationale: Die drei Anredeformen werden als Titelreihe bewahrt. Der substantivierte Titel „Allmächtiger“ entspricht ὁ παντοκράτωρ genauer als das bloß adjektivische „allmächtiger Gott“.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: der ist und der war
  rationale: Die formelhafte Gottesbezeichnung wird relativisch an die Titelreihe angeschlossen; Gegenwart und Vergangenheit bleiben ausdrücklich erhalten. Der im SBLGNT hier fehlende Zukunftsteil wird nicht ergänzt.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet den Dank. „Denn“ ist in dieser feierlichen direkten Rede idiomatisch und gibt den kausalen Zusammenhang klar wieder.
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: du hast deine große Macht ergriffen
  rationale: Das Perfekt εἴληφας bezeichnet eine vollzogene Handlung mit fortdauernder Bedeutung. „Ergriffen“ bewahrt das Bild des An-sich-Nehmens der Macht besser als ein bloßes „eingesetzt“.
- source_word: ἐβασίλευσας
  choice: deine Herrschaft angetreten
  rationale: Der Aorist kann hier den Eintritt in die öffentlich wirksame Königsherrschaft hervorheben. „Die Herrschaft antreten“ ist im Deutschen natürlicher als „zu herrschen begonnen“ und behauptet nicht, Gott sei zuvor schlechthin nicht souverän gewesen.
theological_decisions:
- issue: Die kürzere Gottesbezeichnung ohne Zukunftsformel
  choice: der ist und der war
  alternative: der ist und der war und der kommt
  rationale: Der vorgelegte griechische Text enthält nur ὁ ὢν καὶ ὁ ἦν. Die Übersetzung harmonisiert die Stelle daher nicht mit längeren Formeln an anderen Stellen der Offenbarung.
- issue: Beginn beziehungsweise Ausübung der Königsherrschaft in ἐβασίλευσας
  choice: deine Herrschaft angetreten
  alternative: geherrscht / bist König geworden
  rationale: Die gewählte Formulierung lässt die ingressive oder manifestierende Nuance des Aorists erkennen, ohne eine Aussage darüber einzutragen, dass Gottes Souveränität ihrem Wesen nach erst jetzt begonnen habe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. Die markierte Titelreihe wird bewusst nicht zu „Herr, allmächtiger Gott“ geglättet. Sämtliche Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
