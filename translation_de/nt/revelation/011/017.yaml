  naturalness: „Und sagten“ ist als Anschluss an den vorangehenden Vers idiomatisch. Die Anrede wird mit „der du bist und der du warst“ in natürlichem, würdigem deutschem Gebetsstil formuliert; sie wahrt zugleich die Präsens-/Vergangenheitsopposition des Griechischen.
