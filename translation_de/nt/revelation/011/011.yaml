  to: Und nach den dreieinhalb Tagen kam Lebensatem von Gott in sie hinein[a], und sie stellten sich auf ihre Füße, und große Furcht befiel die, die sie beobachteten.
  rationale: Die Revision entfernt die nicht im Ausgangstext enthaltene Verallgemeinerung „alle“ und bildet die einfache erzählende Reihung des Griechischen enger ab. Die Hauptübersetzung und Fußnote bewahren weiterhin die begründete Mehrdeutigkeit von πνεῦμα.
