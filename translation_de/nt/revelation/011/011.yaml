    rationale: Der bestimmte Artikel mit Partizip bezeichnet „diejenigen, die sie beobachteten“, nicht notwendigerweise ausnahmslos alle denkbaren Beobachtenden. „Alle“ erweitert den Umfang unnötig.
  - severity: low
    issue: „Da“ vor „stellten sie sich auf ihre Füße“
    rationale: „Da“ ist nicht sinnwidrig, fügt aber eine deutsche Folgerungs- bzw. Szenenmarkierung hinzu. Die einfache griechische Verbindung καί wird mit „und“ unmittelbarer wiedergegeben.
