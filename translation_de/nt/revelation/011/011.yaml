id: REV.11.11
reference: Revelation 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: de
  text: Und nach den dreieinhalb Tagen kam Lebensatem von Gott in sie hinein[a], und sie stellten sich auf ihre Füße, und große Furcht befiel die, die sie beobachteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Geist des Lebens von Gott“; möglicherweise: „der Geist des Lebens von Gott“. Das griechische Wort πνεῦμα kann Atem, Geist oder den Heiligen Geist bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: nach den dreieinhalb Tagen
  rationale: μετά mit Akkusativ bezeichnet die zeitliche Folge. Der bestimmte Artikel wird durch „den“ bewahrt; „dreieinhalb“ ist die natürliche moderne Wiedergabe von τρεῖς … καὶ ἥμισυ.
- source_word: πνεῦμα ζωῆς
  choice: Lebensatem
  rationale: πνεῦμα kann Atem, Geist oder den Geist bezeichnen. Im Zusammenhang der Wiederbelebung und vor dem Hintergrund von Ezechiel 37 gibt „Lebensatem“ den naheliegenden Sinn wieder, ohne die vorhandene Mehrdeutigkeit zu leugnen.
- source_word: ἐκ τοῦ θεοῦ
  choice: von Gott
  rationale: Die Formulierung bezeichnet Gott als Ursprung; „von Gott“ ist im Deutschen natürlich und sachlich genau.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: kam … in sie hinein
  rationale: Die Wendung beschreibt das Eintreten in die beiden Zeugen. „kam … in sie hinein“ ist idiomatisches Deutsch und bewahrt die räumliche Bildhaftigkeit.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: Da stellten sie sich auf ihre Füße
  rationale: Der Aorist von ἵστημι ist hier intransitiv beziehungsweise ingressiv zu verstehen. Die reflexive deutsche Form klingt natürlich und bewahrt das Bild des Aufstehens.
- source_word: φόβος μέγας
  choice: große Furcht
  rationale: „Große Furcht“ bildet die nominale Wendung eng und in würdigem Register ab, ohne sie unnötig zu „Entsetzen“ zu verschärfen.
- source_word: ἐπέπεσεν ἐπὶ
  choice: befiel
  rationale: „befiel“ ist eine natürliche und anschauliche deutsche Entsprechung für das Überkommen beziehungsweise Fallen von Furcht auf Menschen.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: alle, die sie beobachteten
  rationale: θεωρέω bezeichnet ein bewusstes Zuschauen oder Beobachten. „alle, die sie beobachteten“ gibt das substantivierte Partizip klar wieder; „alle“ ist dabei im Deutschen die natürliche kollektive Fassung der durch den Artikel bestimmten Gruppe.
theological_decisions:
- issue: Ob πνεῦμα ζωῆς als unpersönlicher Lebensatem oder ausdrücklich als der Heilige Geist wiederzugeben ist
  choice: Lebensatem von Gott
  alternative: ein Geist des Lebens von Gott; der Geist des Lebens von Gott
  rationale: Der griechische Text nennt Gott als Ursprung, identifiziert πνεῦμα aber nicht ausdrücklich als den Heiligen Geist. „Lebensatem“ passt zur Wiederbelebungsszene und ihrem prophetischen Hintergrund; die Fußnote bewahrt die echte lexikalische und theologische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt bildhaft und nah am Griechischen, vermeidet aber unnatürliche Wortstellung. Die Mehrdeutigkeit von πνεῦμα wird im Haupttext sinnvoll erschlossen und in der Fußnote ausdrücklich offengehalten.
