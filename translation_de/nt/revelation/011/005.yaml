id: REV.11.5
reference: Revelation 11:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: de
  text: Und wenn jemand ihnen schaden will, kommt Feuer aus ihrem Mund[a] und verzehrt ihre Feinde. Und wenn jemand ihnen schaden will, muss er auf diese Weise getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „aus ihrem Mund“; im Griechischen steht „Mund“ in der Einzahl, obwohl es sich auf beide Zeugen bezieht. Möglich ist auch: „aus ihren Mündern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: ihnen schaden
  rationale: Im apokalyptischen Zusammenhang bezeichnet das Verb feindliches Vorgehen gegen die beiden Zeugen. „Schaden“ ist gegenwärtiges, natürliches Deutsch und legt die Art des Angriffs nicht näher fest.
- source_word: πῦρ
  choice: Feuer
  rationale: Die konkrete und eindringliche Bildsprache des griechischen Textes wird unverändert bewahrt.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: kommt aus ihrem Mund
  rationale: Die Formulierung gibt die Bewegung natürlich wieder und bewahrt den auffälligen Singular στόματος bei einem pluralischen Possessor.
- source_word: κατεσθίει
  choice: verzehrt
  rationale: „Verzehrt“ bringt die vollständige, zerstörerische Wirkung zum Ausdruck und entspricht dem würdigen apokalyptischen Stil.
- source_word: ἐχθροὺς
  choice: Feinde
  rationale: Dies ist die klare und übliche Entsprechung.
- source_word: θέλει / θελήσῃ
  choice: will / will
  rationale: Beide Bedingungssätze werden im Deutschen idiomatisch mit „wenn jemand … will“ formuliert. Der Aspekt- und Modusunterschied lässt sich hier nicht natürlich abbilden, ohne eine im Deutschen nicht sicher begründete Bedeutungsnuance einzutragen.
- source_word: οὕτως
  choice: auf diese Weise
  rationale: Die Wendung verweist ausdrücklich auf die zuvor beschriebene Art des Todes.
- source_word: δεῖ
  choice: muss
  rationale: „Muss“ bewahrt die starke Aussage von Notwendigkeit, ohne deren theologischen Grund näher auszudeuten.
- source_word: ἀποκτανθῆναι
  choice: getötet werden
  rationale: Die direkte passive Form ist in modernem Deutsch klar und gibt den griechischen Infinitiv sachgerecht wieder.
theological_decisions:
- issue: Wörtliche Wiedergabe oder Deutung des Feuers aus dem Mund
  choice: Das Bild wird direkt als „Feuer kommt aus ihrem Mund“ wiedergegeben.
  alternative: Das Feuer als wirksames Gerichtswort oder zerstörerisches Gericht deutend umschreiben.
  rationale: Der griechische Text formuliert das apokalyptische Bild unmittelbar. Die Übersetzung lässt offen, wie es symbolisch oder wörtlich zu verstehen ist.
- issue: Art der in δεῖ ausgedrückten Notwendigkeit
  choice: Die Aussage wird schlicht mit „muss“ wiedergegeben.
  alternative: Die Notwendigkeit ausdrücklich als göttliche Bestimmung, prophetische Gewissheit oder Vergeltungsprinzip erklären.
  rationale: Der Vers nennt den Grund der Notwendigkeit nicht ausdrücklich; eine nähere Bestimmung würde die theologische Spannung auflösen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die eindringliche apokalyptische Bildsprache und die Wiederholung des Bedingungssatzes bleiben erhalten; der griechische Singular „Mund“ wird im Haupttext bewahrt und in der Fußnote erläutert.
