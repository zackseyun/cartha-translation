source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: de
  text: Das sind die beiden Ölbäume und die beiden Leuchter, die vor dem Herrn der Erde stehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ein Anklang an Sacharja 4: Dort stehen zwei Ölbäume und ein Leuchter sinnbildlich für von Gott beauftragte und durch seinen Geist befähigte Diener.'
    reason: cross_reference
lexical_decisions:
- source_word: Οὗτοί
  choice: Diese
  rationale: Das Demonstrativpronomen steht im maskulinen Plural und verweist im Zusammenhang auf die beiden Zeugen. „Diese“ gibt den Wortlaut direkt wieder, ohne „Zeugen“ aus dem vorherigen Vers einzufügen.
- source_word: ἐλαῖαι
  choice: Ölbäume
  rationale: Im apokalyptischen Bild und im Anklang an Sacharja 4 bezeichnet das Wort Ölbäume; so bleibt die Bildsprache erhalten.
- source_word: λυχνίαι
  choice: Leuchter
  rationale: λυχνία bezeichnet den Träger einer Lampe, nicht die Lampe selbst. „Leuchter“ ist im Deutschen präzise und bewahrt die für die Offenbarung wichtige Bildsprache.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ drückt knapp und natürlich die Stellung in der Gegenwart des Herrn aus.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ entspricht dem ehrfürchtigen Titel κύριος und passt zur Aussage über universale Herrschaft.
- source_word: γῆς
  choice: Erde
  rationale: Im kosmischen Horizont der Offenbarung ist „Erde“ wahrscheinlicher als „Land“.
- source_word: ἑστῶτες
  choice: die … stehen
  rationale: Das substantivisch beziehungsweise attributiv bezogene Partizip wird als Relativsatz natürlich wiedergegeben. Es bezeichnet ihren bestehenden Stand vor dem Herrn.
theological_decisions:
- issue: Beziehung der Bildsprache zu Sacharja 4 und Identität der beiden Zeugen
  choice: Die unmittelbare Gleichsetzung mit „den zwei Ölbäumen und den zwei Leuchtern“ bleibt im Haupttext erhalten.
  alternative: 'Erklärende Erweiterung wie: „Diese beiden Zeugen sind wie die zwei Ölbäume und die zwei Leuchter.“'
  rationale: Der griechische Text identifiziert sie durch apokalyptische Bildsprache, ohne das Bild im Vers auszulegen. Die direkte Metapher bewahrt den intertextuellen Bezug und lässt die genaue Identität offen.
- issue: Syntaktischer Bezug von ἑστῶτες
  choice: „die vor dem Herrn der Erde stehen“ wird als auf die mit „Diese“ bezeichneten Personen bezogener Relativsatz formuliert.
  alternative: „… die zwei Leuchter, vor dem Herrn der Erde stehend“, mit möglichem engerem Bezug nur auf „Leuchter“.
  rationale: Die maskuline Form ἑστῶτες stimmt grammatisch mit Οὗτοί beziehungsweise den gemeinten beiden Zeugen überein, nicht mit den femininen Substantiven ἐλαῖαι und λυχνίαι. Eine Fußnote dokumentiert eine näher am Partizip bleibende Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Bildgleichung bleibt bewusst erhalten. Der Relativsatz ist natürlicher als eine wörtliche Partizipialkonstruktion und macht den grammatischen Bezug auf die beiden bezeichneten Personen deutlich.
