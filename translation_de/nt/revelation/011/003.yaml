source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: de
  text: Und ich werde meinen zwei Zeugen [Vollmacht] geben[a], und sie werden 1.260 Tage lang prophezeien, in Sacktuch gekleidet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und ich werde meinen zwei Zeugen geben.“ Im Griechischen bleibt unausgesprochen, was ihnen gegeben wird. „Vollmacht“ ist eine kontextuelle Ergänzung; gemeint sein kann auch eine Beauftragung zum Prophezeien.'
    reason: lexical_alternative
  - marker: b
    text: Sacktuch wurde mit Trauer, Umkehr und prophetischer Klage verbunden.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: werde … Vollmacht geben
  rationale: Das Verb bedeutet wörtlich „geben“; sein direktes Objekt bleibt im Griechischen unausgesprochen. Der folgende Satz legt eine Befähigung oder Beauftragung zum prophetischen Reden nahe. Die Fußnote wahrt die syntaktische Offenheit des Ausgangstextes.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: meinen zwei Zeugen
  rationale: Natürliche deutsche Wiedergabe des Dativs mit Possessivpronomen; „Zeugen“ bewahrt den Aussage- und Zeugnischarakter von μάρτυς.
- source_word: προφητεύσουσιν
  choice: sie werden … prophetisch reden
  rationale: „Prophetisch reden“ ist gegenwärtig verständlicher als das seltenere „prophezeien“ und umfasst hier die öffentliche prophetische Verkündigung, ohne ihren Inhalt näher festzulegen.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: tausendzweihundertsechzig Tage lang
  rationale: Der Akkusativ bezeichnet die Zeitdauer; „Tage lang“ gibt dies im Deutschen idiomatisch wieder.
- source_word: περιβεβλημένοι σάκκους
  choice: in Sacktuch gekleidet
  rationale: Das Perfektpartizip beschreibt ihren anhaltenden Zustand. „Sacktuch“ bewahrt das biblische Bild und vermeidet die missverständliche Vorstellung gewöhnlicher Säcke als Kleidungsstücke.
theological_decisions:
- issue: Unausgesprochenes Objekt von δώσω
  choice: Im Haupttext wird „Vollmacht“ als kontextuell naheliegende Ergänzung verwendet und die wörtlich offenere Form in einer Fußnote genannt.
  alternative: „Und ich werde meinen zwei Zeugen geben“ beziehungsweise „Und ich werde es meinen zwei Zeugen geben“.
  rationale: Das Griechische sagt nicht ausdrücklich, was gegeben wird. Der Zusammenhang mit ihrem anschließenden prophetischen Reden deutet auf Bevollmächtigung oder Beauftragung, legt den genauen Inhalt aber nicht vollständig fest. Die Fußnote bewahrt diese echte Offenheit.
- issue: Bedeutungsgehalt des Sacktuchs
  choice: Das Bild bleibt im Haupttext unaufgelöst; seine kulturellen Assoziationen werden nur in der Fußnote erläutert.
  alternative: „in Trauerkleidung“
  rationale: Sacktuch kann Trauer, Umkehr und prophetische Klage anzeigen. Eine rein deutende Wiedergabe würde das konkrete apokalyptische Bild verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem Griechischen, bleibt aber natürlich lesbar. „Prophetisch reden“ ist bewusst verständlicher als „prophezeien“; das Bild des Sacktuchs bleibt erhalten.
