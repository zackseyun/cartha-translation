id: REV.11.6
reference: Revelation 11:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: de
  text: Diese haben die Vollmacht, den Himmel[a] zu verschließen, sodass während der Tage ihrer Prophetie kein Regen fällt. Auch haben sie Vollmacht über die Wasser, sie in Blut zu verwandeln und die Erde mit jeder Plage zu schlagen, sooft sie wollen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Himmel zu verschließen“. Das griechische οὐρανός kann sowohl „Himmel“ als auch „Himmelsraum“ bzw. „Himmel“ im Sinn des sichtbaren Himmels bedeuten; wegen des Zusammenhangs mit Regen ist hier der sichtbare Himmel gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Diese
  rationale: Der Demonstrativ wird ohne den aus dem Zusammenhang erschlossenen Zusatz „beiden“ wiedergegeben.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: „Vollmacht“ bezeichnet hier verliehene Befugnis und nicht nur bloße Fähigkeit oder Kraft.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: den Himmel zu verschließen
  rationale: Das deutsche „Himmel“ kann wie οὐρανός sowohl den sichtbaren Himmel als auch den himmlischen Bereich bezeichnen; der folgende Regenhinweis macht die konkrete Bedeutung im Zusammenhang deutlich.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: sodass … kein Regen fällt
  rationale: Natürliche deutsche Wiedergabe der Zweck- beziehungsweise Folgebeziehung, ohne den Sinn auf nur eine dieser Nuancen zu verengen.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: während der Zeit ihres prophetischen Redens
  rationale: Die Formulierung bezeichnet die Dauer ihres prophetischen Wirkens; „Zeit“ gibt den idiomatischen zeitlichen Sinn von „Tage“ wieder.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: Vollmacht über die Wasser
  rationale: Die Präposition bezeichnet zusammen mit ἐξουσίαν die Ausübung von Vollmacht über einen Bereich; der Plural bleibt erhalten.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: sie in Blut verwandeln
  rationale: Die Wendung bewahrt die im griechischen Text ausgesagte Verwandlung und nimmt das plurale Bezugswort „Wasser“ wieder auf.
- source_word: πατάξαι τὴν γῆν ἐν πάσῃ πληγῇ
  choice: die Erde mit jeder Plage schlagen
  rationale: „Mit“ gibt den instrumentalen Gebrauch von ἐν wieder; „jeder Plage“ bleibt eng am Wortlaut und fügt nicht ausdrücklich „jede Art“ hinzu.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: sooft sie wollen
  rationale: Die knappe deutsche Formulierung erhält sowohl den wiederholbaren als auch den vom Willen der Zeugen abhängigen Charakter.
theological_decisions:
- issue: Anklänge an die Wunderzeichen im Zusammenhang mit Elia und Mose
  choice: Die geschilderten Handlungen werden unmittelbar als verliehene Vollmacht der Zeugen wiedergegeben.
  alternative: Die Handlungen bereits in der Übersetzung ausdrücklich symbolisch oder ausschließlich wörtlich deuten.
  rationale: Der apokalyptische Text legt hier nicht fest, wie das Verhältnis von Bild und buchstäblichem Geschehen zu bestimmen ist; diese Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vollmacht“ trägt den Gedanken verliehener Befugnis. Die Zweiteilung in zwei Sätze und der Doppelpunkt machen die lange griechische Satzstruktur gut verständlich, ohne ihren Gedankengang zu verändern.
