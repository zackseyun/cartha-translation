id: REV.11.16
reference: Revelation 11:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: de
  text: Und die vierundzwanzig Ältesten, die vor Gott auf ihren Thronen saßen, warfen sich mit dem Gesicht zu Boden und beteten Gott an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: die vierundzwanzig Ältesten
  rationale: „Älteste“ ist in der Offenbarung die etablierte und verständliche Bezeichnung für diese himmlischen Ratsgestalten; die bestimmte Form kennzeichnet die bereits bekannte Gruppe.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe Wendung gibt die räumliche und relationale Gegenwart vor Gott natürlich und würdig wieder.
- source_word: καθήμενοι ἐπὶ τοὺς θρόνους αὐτῶν
  choice: die … auf ihren Thronen saßen
  rationale: Der attributive Relativsatz bildet das Partizip idiomatisch ab und bewahrt die fortdauernde Sitzposition; der deutsche Plural von „Thron“ lautet „Thronen“.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: warfen sich mit dem Gesicht zu Boden
  rationale: Diese natürliche deutsche Formulierung vermittelt die im griechischen Idiom bezeichnete vollständige Niederwerfung anschaulich, ohne das missverständliche wörtliche „fielen auf ihre Gesichter“.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: beteten Gott an
  rationale: Da die Handlung ausdrücklich Gott gilt und in einer himmlischen Thronszene geschieht, bezeichnet das Verb hier religiöse Verehrung; „anbeten“ gibt diese Bedeutung im Deutschen klar wieder.
theological_decisions:
- issue: Bedeutung von προσκυνέω in der himmlischen Thronszene
  choice: „beteten Gott an“
  alternative: „huldigten Gott“ oder „verneigten sich vor Gott“
  rationale: Das ausdrückliche Objekt Gott und der liturgische Kontext sprechen für Anbetung. Die Übersetzung schwächt den religiösen Gehalt nicht ab und fügt zugleich keine weitergehende dogmatische Aussage hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Satzstruktur des Griechischen bleibt erhalten; die Körperhaltung wird idiomatisch statt unnatürlich wörtlich wiedergegeben.
