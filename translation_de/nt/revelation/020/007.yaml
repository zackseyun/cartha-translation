  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: de
  text: Und wenn die tausend Jahre vollendet sind, wird Satan aus seinem Gefängnis freigelassen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Mit dem Konjunktiv τελεσθῇ leitet ὅταν hier einen erwarteten zukünftigen Zeitpunkt ein. „Wenn“ gibt diesen zeitlichen Bezug direkt wieder, ohne ein zusätzliches „nachdem“ einzutragen.
- source_word: τελεσθῇ
  choice: vollendet sind
  rationale: Die passive Form von τελέω bezeichnet hier den Abschluss eines bestimmten Zeitraums. „Vollendet sind“ bewahrt sowohl den Passivcharakter als auch den gehobenen, aber verständlichen Ton.
- source_word: τὰ χίλια ἔτη
  choice: die tausend Jahre
  rationale: Der bestimmte Artikel und der Kontext verweisen auf den bereits genannten Zeitraum. Die direkte Wiedergabe lässt offen, ob die Zahl wörtlich oder symbolisch zu verstehen ist.
- source_word: λυθήσεται
  choice: wird freigelassen werden
  rationale: Das Futur Passiv von λύω bezeichnet die Aufhebung der Gefangenschaft. „Wird freigelassen werden“ ist im modernen Deutsch klar und vermeidet das altertümliche „wird losgelassen werden“.
- source_word: ὁ Σατανᾶς
  choice: Satan
  rationale: „Satan“ ist die etablierte deutsche Namensform; der griechische Artikel wird bei Eigennamen im Deutschen nicht eigens wiedergegeben.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: aus seinem Gefängnis
  rationale: φυλακή kann Wache, Gewahrsam oder Gefängnis bezeichnen. Im Zusammenhang der Einsperrung ist „Gefängnis“ die naheliegende Bedeutung; ἐκ wird räumlich passend mit „aus“ wiedergegeben.
theological_decisions:
- issue: Bedeutung der tausend Jahre
  choice: Die Wendung wird schlicht als „die tausend Jahre“ wiedergegeben.
  alternative: Eine ausdrückliche Deutung als wörtliches tausendjähriges Reich oder als symbolischer langer Zeitraum.
  rationale: Der Vers bezeichnet einen bestimmten Zeitraum, entscheidet aber nicht zwischen verschiedenen Auslegungen des Millenniums. Die Übersetzung bewahrt diese Offenheit.
- issue: Art der Freilassung Satans
  choice: Das grammatische Passiv wird ohne Nennung des Handelnden bewahrt.
  alternative: „Gott wird Satan freilassen“ oder eine andere ausdrückliche Benennung des Handelnden.
  rationale: Der griechische Text nennt den Handelnden nicht ausdrücklich. Eine Ergänzung würde eine im Vers nur implizite theologische Aussage ausformulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau und Aussage des griechischen Textes. Keine Fußnote ist erforderlich, da die wesentlichen Mehrdeutigkeiten im Haupttext erhalten bleiben.
