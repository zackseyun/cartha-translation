id: REV.20.6
reference: Revelation 20:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: de
  text: Selig und heilig ist, wer an der ersten Auferstehung Anteil hat. Über diese hat der zweite Tod keine Macht, sondern sie werden Priester Gottes und des Messias[a] sein und mit ihm tausend Jahre lang herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Christus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“, also „der Gesalbte“.'
    reason: Die geläufige traditionelle Wiedergabe „Christus“ bleibt als sachlich mögliche Alternative sichtbar, während der Haupttext den Titelsinn ausdrückt.
lexical_decisions:
- source_word: μακάριος
  choice: glückselig
  rationale: Bewahrt die feierliche Sprache biblischer Seligpreisungen und das eschatologische Gewicht besser als das subjektivere „glücklich“.
- source_word: ἅγιος
  choice: heilig
  rationale: Gibt sowohl die Zugehörigkeit zu Gott als auch die Absonderung für ihn wieder, ohne den Ausdruck auf moralische Tadellosigkeit zu verengen.
- source_word: ὁ ἔχων
  choice: wer … hat
  rationale: Natürliche inklusive Wiedergabe des substantivierten Partizips im modernen Deutschen; der verallgemeinernde Singular bleibt gewahrt.
- source_word: μέρος
  choice: Anteil
  rationale: „An … Anteil haben“ ist idiomatisch und bezeichnet die Teilhabe an der ersten Auferstehung.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: an der ersten Auferstehung
  rationale: Die deutsche Verbindung „Anteil haben an“ verlangt hier den Dativ und gibt die griechische Aussage präzise wieder.
- source_word: ἐπὶ τούτων
  choice: über diese
  rationale: Bewahrt den knappen Rückbezug auf die zuvor genannten Menschen und bezeichnet den Bereich, über den Herrschaft oder Verfügungsgewalt ausgeübt wird.
- source_word: ὁ δεύτερος θάνατος
  choice: der zweite Tod
  rationale: Direkte Wiedergabe des apokalyptischen Fachausdrucks.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: hat keine Macht
  rationale: „Macht über“ ist im Deutschen die natürliche Verbindung und kann hier Befugnis beziehungsweise Verfügungsgewalt ausdrücken, nicht bloß physische Kraft.
- source_word: ἱερεῖς
  choice: Priester
  rationale: Gibt die kultische und königlich-priesterliche Bildsprache direkt wieder.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: Gottes und des Messias
  rationale: Χριστός ist hier in der formellen Genitivverbindung mit Gott als Titel gebraucht; „Messias“ macht den titularen Sinn sichtbar.
- source_word: βασιλεύσουσιν
  choice: sie werden … herrschen
  rationale: Natürliche Wiedergabe königlicher Herrschaft, ohne die Aussage interpretierend auszuweiten.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: Gibt die gemeinsame Ausübung der Herrschaft wieder; das Pronomen verweist im unmittelbaren Zusammenhang auf den Messias.
- source_word: χίλια ἔτη
  choice: tausend Jahre lang
  rationale: Gibt die ausdrücklich genannte Dauer wieder, ohne ein bestimmtes endzeitliches Deutungssystem einzutragen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck erscheint hier als Titel in „Gottes und des Χριστός“. „Messias“ bewahrt diesen titularen Sinn; die geläufige Alternative wird in einer Fußnote genannt.
- issue: Bedeutung von ἐξουσία
  choice: Macht
  alternative: Vollmacht
  rationale: „Keine Macht über“ ist im Deutschen idiomatisch und umfasst hier Herrschafts- beziehungsweise Verfügungsgewalt. „Vollmacht“ wäre enger und könnte eine ausdrücklich übertragene Amtsbefugnis nahelegen.
- issue: Dauer der gemeinsamen Herrschaft
  choice: tausend Jahre lang
  alternative: für tausend Jahre
  rationale: Die Zeitangabe wird als Dauer wiedergegeben. Ob sie wörtlich oder symbolisch zu verstehen ist, entscheidet dieser Vers nicht und wird daher nicht festgelegt.
translation_notes:
  register: Feierliches, aber gegenwärtiges Standarddeutsch. „Glückselig“ und „heilig“ erhalten den Klang einer Seligpreisung; Satzbau und Pronomen bleiben zugleich für heutige Leser verständlich. Die Mehrzahl „diese … sie“ folgt dem Wechsel vom repräsentativen Singular zur Gruppe im griechischen Text.
