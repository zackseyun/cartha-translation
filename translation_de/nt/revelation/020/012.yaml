review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die syntaktische Abfolge und die entscheidenden Aussagen des griechischen Textes zuverlässig wieder: die Toten aller Ränge stehen vor dem Thron; Bücher sowie ein weiteres Buch werden geöffnet; die Toten werden aufgrund des in den Büchern Verzeichneten und gemäß ihren Werken gerichtet. „Nach dem, was in den Büchern geschrieben stand“ ist eine angemessene deutsche Wiedergabe von ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις und bewahrt dessen Funktion als Grundlage des Gerichts.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Gliederung in kurze Hauptsätze ist klar und für den apokalyptischen Register angemessen. „Die Großen und die Kleinen“, „vor dem Thron stehen“ und „Buch des Lebens“ sind idiomatisch und etablieren keine unnötige Auslegung.
  terminology: 'Die zentralen Begriffe sind treffend und konsistent wiedergegeben: „die Toten“, „Bücher“, „Buch des Lebens“, „gerichtet“ und „Werke“. Insbesondere vermeidet „gerichtet“ die nicht vom Verb selbst geforderte Einengung auf „verurteilt“. Die Fußnoten sind korrekt an „Bücher“ beziehungsweise „Werken“ verankert und die Alternativen sind sachlich gerechtfertigt.'
  issues: []
  revised_text: ''
  revised_footnotes: []
  revision_rationale: Keine sichere Korrektur erforderlich. Die deutsche Fassung ist quellennah, natürlich und hält die Aussage über das Gericht nach den Werken ohne dogmatische Auflösung fest. Die gegenüber der englischen Audit-Spur sachgerecht platzierten Fußnotenanker sind für die deutsche Fassung stimmig.
