id: REV.20.12
reference: Revelation 20:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: de
  text: 'Und ich sah die Toten, die Großen und die Kleinen, vor dem Thron stehen. Bücher[a] wurden geöffnet. Auch ein anderes Buch wurde geöffnet: das Buch des Lebens. Und die Toten wurden nach dem gerichtet, was in den Büchern geschrieben stand, nach ihren Werken.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bücher“ kann im antiken Zusammenhang auch Schriftrollen bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „nach ihren Taten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: die Toten
  rationale: Die substantivierten Adjektive bezeichnen die Verstorbenen als Gesamtheit; „die Toten“ ist knapp, idiomatisch und feierlich.
- source_word: τοὺς μεγάλους καὶ τοὺς μικρούς
  choice: die Großen und die Kleinen
  rationale: Die formnahe Wendung bewahrt den Merismus, der Menschen aller Ränge und gesellschaftlichen Stellungen umfasst.
- source_word: ἑστῶτας
  choice: stehen
  rationale: 'Das Perfektpartizip beschreibt den bestehenden Zustand: Die Toten befinden sich stehend vor dem Thron.'
- source_word: ἐνώπιον τοῦ θρόνου
  choice: vor dem Thron
  rationale: Dies gibt die räumliche und gerichtliche Szene direkt wieder, ohne θρόνος deutend zu „Richterstuhl“ zu erweitern.
- source_word: βιβλία
  choice: Bücher
  rationale: „Bücher“ ist die natürliche deutsche Entsprechung; im antiken Kontext können damit auch Schriftrollen gemeint sein.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: wurden geöffnet
  rationale: Die Passivformen werden unmittelbar wiedergegeben; „entsiegelt“ wäre ohne ausdrücklichen Hinweis auf Siegel zu spezifisch.
- source_word: ἄλλο βιβλίον
  choice: ein anderes Buch
  rationale: Die Formulierung bezeichnet ein weiteres, von den zuvor genannten Büchern unterschiedenes Buch.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: das Buch des Lebens
  rationale: Im Griechischen ist βιβλίον sinngemäß zu ergänzen. Die deutsche Wendung gibt die Ellipse klar und traditionsgemäß wieder.
- source_word: ἐκρίθησαν
  choice: wurden … gerichtet
  rationale: κρίνω bezeichnet hier gerichtliches Urteilen, ohne bereits festzulegen, dass alle verurteilt wurden.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: nach dem, was in den Büchern geschrieben stand
  rationale: „Nach“ bezeichnet hier verständlich die Grundlage des Gerichts; „geschrieben stand“ bewahrt den resultativen Sinn des Perfektpartizips.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: nach ihren Werken
  rationale: Die formnahe Wiedergabe bewahrt sowohl die Breite von ἔργα als auch die biblischen Bezüge der Aussage.
theological_decisions:
- issue: Gericht nach den Werken
  choice: „nach ihren Werken“ unverändert stehen lassen
  alternative: „nach dem, was sie getan hatten“
  rationale: Der Vers stellt ausdrücklich fest, dass das Gericht den Werken entspricht. Die Übersetzung erklärt diese Spannung nicht durch eine importierte dogmatische Synthese weg.
- issue: Bedeutung von κρίνω
  choice: „gerichtet“
  alternative: „verurteilt“
  rationale: Der griechische Ausdruck bezeichnet das Urteilsgeschehen, legt aber an dieser Stelle nicht allein durch das Verb für jeden Einzelnen einen verurteilenden Ausgang fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt feierlich und bildhaft, wird aber durch deutsche Hauptsätze natürlich gegliedert. Wiederholungen zentraler Wörter wie „Buch“, „Bücher“ und „die Toten“ bleiben erhalten.
