id: REV.20.5
reference: Revelation 20:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: de
  text: Die übrigen Toten kamen nicht zum Leben, bis die tausend Jahre vollendet waren.[a] Dies ist die erste Auferstehung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lebten nicht, bis die tausend Jahre vollendet waren“.'
    reason: Lexikalische Alternative für οὐκ ἔζησαν; die weniger ingressiv formulierte Wiedergabe ist sprachlich möglich.
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: die übrigen Toten
  rationale: Die Wendung bezeichnet die Verbleibenden im Gegensatz zu der zuvor genannten Gruppe; „die übrigen Toten“ ist im Deutschen knapp, natürlich und bewahrt diesen Kontrast.
- source_word: οὐκ ἔζησαν
  choice: kamen nicht zum Leben
  rationale: Der Aorist von ζάω kann im Auferstehungskontext ingressiv verstanden werden. „kamen … zum Leben“ gibt diesen Sinn natürlich wieder; die mögliche Wiedergabe „lebten nicht“ bleibt in einer Fußnote erhalten.
- source_word: ἄχρι τελεσθῇ
  choice: bis … vollendet waren
  rationale: ἄχρι bezeichnet den zeitlichen Endpunkt, während τελεσθῇ das Erreichen des Abschlusses ausdrückt. „vollendet waren“ wahrt den passivisch-kompletiven Sinn.
- source_word: τὰ χίλια ἔτη
  choice: die tausend Jahre
  rationale: Der Ausdruck verweist auf den bereits im Zusammenhang genannten bestimmten Zeitraum und wird direkt wiedergegeben.
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: Dies ist die erste Auferstehung
  rationale: Die demonstrative Aussage und der feste Begriff ἀνάστασις werden ohne interpretierende Erweiterung unmittelbar und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezugsgröße von „Dies ist die erste Auferstehung“
  choice: Das Demonstrativpronomen bleibt ebenso offen wie im Griechischen und verweist auf die im Zusammenhang beschriebene Wirklichkeit.
  alternative: Der Satz könnte enger ausschließlich auf die Märtyrer in Vers 4 oder weiter auf alle gerechten Toten bezogen beziehungsweise geistlich gedeutet werden.
  rationale: Der griechische Text legt an dieser Stelle kein bestimmtes endzeitliches System ausdrücklich fest; die Übersetzung soll diese theologische Spannung nicht auflösen.
- issue: Bedeutung von ἔζησαν im Kontext
  choice: „kamen … zum Leben“ gibt die im unmittelbaren Auferstehungskontext naheliegende Bedeutung wieder.
  alternative: „lebten nicht“ ist lexikalisch möglich und kann weniger ausdrücklich als Wiederbelebungssprache verstanden werden.
  rationale: Die gewählte Formulierung entspricht dem Kontext, ohne Art, Umfang oder Zeitpunkt der Auferstehung über den Wortlaut hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist klar und nah am griechischen Satzbau, ohne eine bestimmte millennialistische Auslegung einzutragen.
