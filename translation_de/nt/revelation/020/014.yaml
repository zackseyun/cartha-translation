id: REV.20.14
reference: Revelation 20:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: de
  text: Und der Tod und der Hades[a] wurden in den Feuersee geworfen. Das ist der zweite Tod, der Feuersee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Totenreich“. Das griechische Wort lautet „Hades“ und wird hier vom „Feuersee“ unterschieden. Deshalb kann die ebenfalls gebräuchliche Übersetzung „Hölle“ an dieser Stelle irreführend sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: der Tod
  rationale: Das deutsche Substantiv gibt sowohl die personifizierte Größe im ersten Satz als auch die Bezeichnung „der zweite Tod“ wieder. Die im Englischen mögliche Unterscheidung durch Groß- und Kleinschreibung ist im Deutschen nicht darstellbar.
- source_word: ᾅδης
  choice: der Hades
  rationale: Die Transliteration bewahrt den eigenständigen griechischen Begriff und hält ihn vom Feuersee als endgültigem Gerichtsort unterschieden. „Hölle“ würde diese Unterscheidung verwischen; „Totenreich“ wäre verständlicher, aber bereits stärker deutend.
- source_word: ἐβλήθησαν
  choice: wurden … geworfen
  rationale: Die passive Verbform und die nachdrückliche Vorstellung des Hineinwerfens werden in natürlichem modernem Deutsch erhalten.
- source_word: λίμνη τοῦ πυρός
  choice: Feuersee
  rationale: „Feuersee“ ist die geläufige, knappe deutsche Wiedergabe des Genitivausdrucks und bewahrt das apokalyptische Bild.
- source_word: οὗτος … ἐστιν
  choice: Das ist
  rationale: Die demonstrative Gleichsetzung wird ausdrücklich bewahrt, ohne sie durch „Das bedeutet“ erklärend auszulegen.
- source_word: θάνατος ὁ δεύτερος
  choice: der zweite Tod
  rationale: Natürliche deutsche Wiedergabe der festen apokalyptischen Bezeichnung.
theological_decisions:
- issue: Wiedergabe von ᾅδης im Zusammenhang des Endgerichts
  choice: Hades
  alternative: Totenreich; Hölle
  rationale: Der Hades wird hier selbst in den Feuersee geworfen und ist daher im Bild des Verses nicht mit diesem identisch. „Hades“ bewahrt diese Spannung, ohne ein bestimmtes Lehrmodell einzutragen.
- issue: Personifizierung von θάνατος
  choice: der Tod im ersten Satz; der zweite Tod im zweiten Satz
  alternative: Eine zusätzliche Kennzeichnung als personifizierte Gestalt
  rationale: Der Zusammenhang stellt Tod und Hades als Größen dar, die geworfen werden. Da deutsche Substantive stets großgeschrieben werden, lässt sich die englische Differenzierung durch Großschreibung nicht nachbilden; eine zusätzliche Personifizierung würde mehr auslegen, als der Wortlaut verlangt.
- issue: Verhältnis von „zweiter Tod“ und „Feuersee“
  choice: appositionale Wiederholung mit Komma
  alternative: Doppelpunkt oder erklärendes „nämlich“
  rationale: Das Komma hält die knappe griechische Apposition bzw. Gleichsetzung offen und vermeidet eine stärker erklärende Umformung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper apokalyptischer Bildsprache. Die Wiederholung „Feuersee“ folgt bewusst dem griechischen Text; „Hades“ wird durch eine Fußnote für heutige Leser erschlossen.
