id: REV.20.13
reference: Revelation 20:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: de
  text: Und das Meer gab die Toten heraus, die in ihm waren, und der Tod und der Hades[a] gaben die Toten heraus, die in ihnen waren. Und jeder wurde nach seinen Taten gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Totenreich“. Das griechische Wort lautet ᾅδης (Hades) und ist von Begriffen zu unterscheiden, die häufig mit „Hölle“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: gab / gaben … heraus
  rationale: δίδωμι bedeutet grundsätzlich „geben“; im Zusammenhang mit der Freigabe der Toten zum Gericht gibt „herausgeben“ den kontextuellen Sinn natürlich und präzise wieder.
- source_word: ἡ θάλασσα
  choice: das Meer
  rationale: Die bestimmte Form des griechischen Ausdrucks wird direkt und idiomatisch wiedergegeben.
- source_word: τοὺς νεκρούς
  choice: die Toten
  rationale: Das substantivierte Adjektiv wird im Deutschen natürlich als „die Toten“ wiedergegeben.
- source_word: τοὺς ἐν αὐτῇ / τοὺς ἐν αὐτοῖς
  choice: die in ihm waren / die in ihnen waren
  rationale: Die Relativsätze bewahren die identifizierende Funktion der griechischen Konstruktionen; „ihnen“ nimmt die beiden Größen Tod und Hades gemeinsam auf.
- source_word: ὁ θάνατος
  choice: der Tod
  rationale: Der Ausdruck erscheint zusammen mit dem Hades als bildhaft handelnde Größe. Das deutsche Substantiv trägt regulär einen Großbuchstaben, sodass keine zusätzliche typografische Deutung nötig ist.
- source_word: ὁ ᾅδης
  choice: der Hades
  rationale: Die Transliteration erhält die begriffliche Unterscheidung von anderen griechischen Ausdrücken für endgültige Strafe und vermeidet die irreführende Wiedergabe „Hölle“.
- source_word: ἐκρίθησαν ἕκαστος
  choice: jeder wurde … gerichtet
  rationale: Obwohl das Verb im Griechischen im Plural steht, verteilt ἕκαστος das Gericht auf jeden Einzelnen. Die deutsche Singularform gibt diese Konstruktion idiomatisch wieder.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: nach seinen Taten
  rationale: „Taten“ gibt ἔργα in diesem Gerichtskontext natürlich wieder. Das distributive „seinen“ stimmt mit „jeder“ überein und bewahrt den individuellen Bezug.
theological_decisions:
- issue: Wiedergabe von ᾅδης im endzeitlichen Gerichtskontext
  choice: Hades
  alternative: Totenreich; Hölle
  rationale: „Hades“ bewahrt die lexikalische Eigenständigkeit des griechischen Begriffs und unterscheidet ihn von der unmittelbar folgenden endgültigen Strafe im Feuersee. „Hölle“ würde eine nicht vom Ausdruck selbst verlangte Gleichsetzung eintragen; „Totenreich“ ist als Sinnerklärung in der Fußnote geeignet.
- issue: Bildhafte Handlung von θάνατος und ᾅδης
  choice: der Tod und der Hades … gaben … heraus
  alternative: unpersönliche Umschreibung
  rationale: Die handelnden Subjekte und die apokalyptische Bildsprache des griechischen Textes bleiben unverändert erhalten.
- issue: 'Maßstab des Gerichts: κατὰ τὰ ἔργα αὐτῶν'
  choice: nach seinen Taten
  alternative: aufgrund dessen, was jeder getan hatte; nach seinen Werken
  rationale: Die Formulierung wahrt die Aussage, dass jeder entsprechend seinen Taten gerichtet wird, ohne das Verhältnis von Taten, Gericht und Heil dogmatisch weiter auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „gaben die Toten heraus“ folgt der markanten Parallelstruktur des griechischen Textes. Der Satz wird vor dem abschließenden Gerichtssatz geteilt, um die Lesbarkeit zu erhöhen, ohne die gedankliche Verbindung zu verändern.
