id: REV.20.8
reference: Revelation 20:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: de
  text: Und er wird hinausgehen, um die Völker an den vier Enden der Erde zu verführen[a] – Gog und Magog[b] – und sie zum Krieg[c] zu versammeln. Ihre Zahl ist wie der Sand am Meer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Irre zu führen“.'
    reason: lexical_alternative
  - marker: b
    text: „Gog und Magog“ nimmt Ezechiel 38–39 auf und kann als sinnbildliche Bezeichnung für die Völker dienen, die sich zur letzten Auflehnung versammeln.
    reason: cross_reference
  - marker: c
    text: 'Oder: „zur Schlacht“. Das griechische Wort kann „Krieg“ oder „Schlacht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: er wird hinausgehen
  rationale: Das Futur von ἐξέρχομαι bewahrt die Bewegungsvorstellung; das aus dem vorherigen Vers übernommene Subjekt ist Satan.
- source_word: πλανῆσαι
  choice: zu verführen
  rationale: πλανάω kann sowohl täuschen als auch vom rechten Weg abbringen bedeuten. „Verführen“ ist im Deutschen natürlich und bewahrt beide Aspekte; die Alternative wird in einer Fußnote genannt.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: ἔθνη bezeichnet hier kollektiv die Völker der Welt, nicht eigens Nichtjuden im Gegensatz zu Juden.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: an den vier Enden der Erde
  rationale: Die wörtlichen „vier Ecken“ sind eine bildhafte Wendung für die äußersten Bereiche der ganzen Erde. „Vier Enden“ gibt diese konventionelle Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: Gog und Magog
  rationale: Die Eigennamen werden transliteriert und als appositionelle Bezeichnung der Völker verstanden, ohne ihren apokalyptischen Bezug enger festzulegen.
- source_word: συναγαγεῖν
  choice: sie zu versammeln
  rationale: Das Objektpronomen gibt αὐτούς ausdrücklich wieder; der Infinitiv bezeichnet neben πλανῆσαι das Ziel seines Hinausgehens.
- source_word: εἰς τὸν πόλεμον
  choice: zum Krieg
  rationale: πόλεμος kann „Krieg“ oder „Schlacht/Kampf“ bedeuten. „Zum Krieg“ bleibt nahe am griechischen Ausdruck und vermeidet eine unnötige Festlegung.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: Ihre Zahl
  rationale: Die relative Konstruktion bezieht sich auf die versammelten Völker beziehungsweise Menschen. Ein neuer deutscher Hauptsatz vermeidet eine missverständliche Anbindung an „Krieg“.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: wie der Sand am Meer
  rationale: Die vertraute deutsche Wendung bewahrt das biblische Bild einer unermesslich großen Menge.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐξελεύσεται
  choice: „er“, mit Satan als aus Vers 7 fortgeführtem Bezug
  alternative: Das Subjekt im Vers ausdrücklich als „Satan“ wiederholen
  rationale: Der griechische Text nennt das Subjekt hier nicht erneut. Das Pronomen wahrt den Zusammenhang, ohne eine erklärende Ergänzung in den Vers einzufügen.
- issue: Funktion von „Gog und Magog“
  choice: Appositionelle Bezeichnung der Völker
  alternative: Streng geografische Identifizierung oder ausschließlich symbolische Deutung
  rationale: Die Gedankenstriche machen die appositionelle Beziehung sichtbar und bewahren zugleich die Anspielung auf Ezechiel 38–39, ohne deren genaue endzeitliche Zuordnung festzulegen.
- issue: Bedeutungsumfang von πόλεμος
  choice: „Krieg“ im Haupttext
  alternative: „Schlacht“ oder „Kampf“
  rationale: Der griechische Begriff lässt je nach Kontext Krieg oder konkrete Schlacht zu. Die Fußnote hält diese Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die Satzteilung nach „versammeln“ verhindert eine unklare relative Anbindung. Die Bildsprache und die apokalyptische Spannung bleiben erhalten.
