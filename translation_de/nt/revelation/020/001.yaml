id: REV.20.1
reference: Revelation 20:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: de
  text: Und ich sah einen Engel aus dem Himmel herabkommen, der den Schlüssel zum Abgrund[a] und eine große Kette in seiner Hand hielt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bodenloser Abgrund«. Das griechische Wort lautet »Abgrund«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den für die Offenbarung charakteristischen parataktischen Erzählfluss, ohne eine zeitliche Abfolge stärker auszudeuten.
- source_word: εἶδον
  choice: ich sah
  rationale: Gibt den Aorist von ὁράω in der visionären Erzählung direkt und natürlich wieder.
- source_word: ἄγγελον
  choice: einen Engel
  rationale: Im apokalyptischen Zusammenhang ist ein himmlisches Wesen gemeint; »Engel« ist daher treffender als das allgemeinere »Bote«.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel herabkommen
  rationale: Gibt sowohl die Herkunft als auch die abwärtsgerichtete Bewegung des Partizips idiomatisch wieder.
- source_word: ἔχοντα
  choice: hielt
  rationale: Das Partizip beschreibt, dass der Engel Schlüssel und Kette bei sich beziehungsweise in der Hand hat; »hielt« passt natürlich zum konkreten Bild.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: den Schlüssel zum Abgrund
  rationale: »Schlüssel zum« ist die natürliche deutsche Wiedergabe der Genitivverbindung; »Abgrund« entspricht ἄβυσσος, ohne das Bild unnötig auszudeuten.
- source_word: ἅλυσιν μεγάλην
  choice: eine große Kette
  rationale: Bewahrt die schlichte Größenangabe und den gehobenen apokalyptischen Ton, ohne sie zu »massiv« zu verstärken.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: in seiner Hand
  rationale: Obwohl die Präposition wörtlich »auf« bedeuten kann, bezeichnet die Wendung hier idiomatisch das Tragen beziehungsweise Halten in der Hand.
theological_decisions:
- issue: Wiedergabe von ἄβυσσος im apokalyptischen Zusammenhang
  choice: Abgrund
  alternative: bodenlose Tiefe
  rationale: »Abgrund« bildet den griechischen Begriff knapp und etabliert ab, ohne die Bodenlosigkeit ausdrücklich hinzuzufügen oder das apokalyptische Bild weiter festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bildhaftem Ton. Die griechische Partizipialkonstruktion wird durch einen Relativsatz natürlich wiedergegeben; der einleitende Anschluss mit »Und« bleibt erhalten.
