  source_fidelity: Der Entwurf gibt die unbestimmte Bedingung (εἴ τις), die gerichtliche Feststellung im Passiv (οὐχ εὑρέθη), die fortdauernde Eintragung (γεγραμμένος) und das anschließende Passiv von ἐβλήθη sachgerecht wieder. „Verzeichnet gefunden“ ist gegenüber dem wörtlicheren „geschrieben gefunden“ idiomatischer und bewahrt die Aussage, dass die Person im Buch registriert ist. „Feuersee“ gibt τὴν λίμνην τοῦ πυρός treffend und im Deutschen etabliert wieder.
  naturalness: „Und wenn jemand nicht im Buch des Lebens verzeichnet gefunden wurde, wurde er in den Feuersee geworfen“ ist modernes, verständliches Standarddeutsch. Die Wiederholung von „wurde“ folgt der passiven Satzstruktur und ist hier nicht störend.
  terminology: „Buch des Lebens“ und „Feuersee“ sind sachgemäße, kontextuell etablierte deutsche Wiedergaben. Die Fußnote zu „Schriftrolle“ bildet die lexikalische Möglichkeit von βίβλος neutral und korrekt ab. Das an „jemand“ anschließende „er“ wahrt den Singular, ohne den Aussagebereich auf Männer zu beschränken.
