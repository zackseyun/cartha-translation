id: REV.20.15
reference: Revelation 20:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: de
  text: Und wenn jemand nicht im Buch des Lebens[a] verzeichnet gefunden wurde, wurde er in den Feuersee geworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Schriftrolle des Lebens“. Das griechische Wort kann ein Buch oder eine Schriftrolle bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: wenn jemand
  rationale: Die unbestimmte Bedingung wird offen und im modernen Deutschen natürlich wiedergegeben.
- source_word: οὐχ εὑρέθη
  choice: nicht … gefunden wurde
  rationale: Bewahrt die passive, feststellende beziehungsweise gerichtliche Aussage des griechischen Verbs, ohne sie zu einer bloßen Zustandsbeschreibung abzuschwächen.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: im Buch des Lebens
  rationale: „Buch des Lebens“ ist verständlich und als Bild in diesem Zusammenhang etabliert; βίβλος kann auch eine Schriftrolle bezeichnen, was in einer Fußnote kenntlich gemacht wird.
- source_word: γεγραμμένος
  choice: verzeichnet
  rationale: Gibt das Ergebnis des Schreibens idiomatisch wieder und verbindet sich im Deutschen besser mit „gefunden wurde“ als das hölzerne „geschrieben gefunden“.
- source_word: ἐβλήθη
  choice: wurde … geworfen
  rationale: Gibt den Aorist Passiv direkt und mit der im Kontext vorhandenen Kraft wieder; „geschleudert“ wäre stärker, „ward geworfen“ veraltet.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: in den Feuersee
  rationale: Die kompakte deutsche Wortbildung bewahrt das apokalyptische Bild und entspricht dem üblichen Ausdruck, ohne es auszudeuten.
- source_word: τις … γεγραμμένος / ἐβλήθη
  choice: jemand … er
  rationale: Bewahrt den unbestimmten Singular. Das Pronomen „er“ nimmt im Deutschen das grammatisch maskuline „jemand“ auf und behauptet nicht, dass ausschließlich Männer gemeint seien.
theological_decisions:
- issue: Generischer Singular und grammatisches Geschlecht
  choice: jemand … er
  alternative: dieser Mensch
  rationale: Der griechische Text spricht von einem unbestimmten Einzelnen; die deutsche Form wahrt diesen Singular. Das grammatische Maskulinum wird nicht als Aussage über das natürliche Geschlecht ausgelegt.
- issue: Bild des Endgerichts
  choice: Feuersee
  alternative: See des Feuers
  rationale: Das Bild wird knapp und ohne konfessionelle Erklärung zur Art der endgültigen Strafe wiedergegeben. „Feuersee“ ist im Deutschen natürlich und semantisch gleichwertig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Verbindung „verzeichnet gefunden wurde“ wurde beibehalten, um sowohl γεγραμμένος als auch εὑρέθη sichtbar wiederzugeben und den feststellenden Charakter der Gerichtsszene nicht zu verlieren.
