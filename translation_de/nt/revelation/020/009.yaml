id: REV.20.9
reference: Revelation 20:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: de
  text: Und sie zogen über die Weite der Erde herauf und umzingelten das Lager der Heiligen und die geliebte Stadt.[a] Da kam Feuer vom Himmel herab und verzehrte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Text nennt die geliebte Stadt hier nicht ausdrücklich beim Namen. Häufig wird sie als Jerusalem oder umfassender als die Stadt Gottes verstanden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: zogen … herauf
  rationale: Das Verb bezeichnet ein Hinaufziehen oder Heraufkommen. Im Zusammenhang mit den feindlichen Scharen gibt „zogen … herauf“ sowohl die Bewegung als auch den erzählerischen Charakter natürlich wieder, ohne eine bestimmte Geografie festzulegen.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: über die Weite der Erde
  rationale: πλάτος bezeichnet Breite oder weite Ausdehnung. „Weite der Erde“ wahrt das räumliche Bild, ohne das im Griechischen nicht ausdrücklich enthaltene „Ebene“ hinzuzufügen.
- source_word: ἐκύκλευσαν
  choice: umzingelten
  rationale: Das Verb bedeutet „umringen, einkreisen“. „Umzingelten“ passt zum militärischen Bild des Lagers und ist im modernen Deutschen klar.
- source_word: παρεμβολὴν
  choice: Lager
  rationale: παρεμβολή bezeichnet ein Lager, häufig ein Heerlager. „Lager“ bleibt knapp und fügt keine nicht ausdrücklich genannte militärische Bestimmung hinzu.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: Die substantivische Bezeichnung meint die Gott Zugehörenden und wird in der Offenbarung traditions- und kontextgerecht mit „die Heiligen“ wiedergegeben.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: die geliebte Stadt
  rationale: Die Form ist ein passives Partizip und bezeichnet die Stadt als geliebt, ohne den Liebenden ausdrücklich zu nennen. Die Übersetzung bewahrt diese Offenheit.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: Da kam Feuer vom Himmel herab
  rationale: Die Formulierung gibt Bewegungsrichtung und Herkunft des Feuers direkt und in natürlichem deutschem Erzählstil wieder.
- source_word: κατέφαγεν αὐτούς
  choice: verzehrte sie
  rationale: κατεσθίω bedeutet wörtlich „aufessen“ und übertragen „verschlingen, verzehren“. Bei Feuer ist „verzehrte“ die natürliche Verbindung und drückt vollständige Vernichtung aus.
theological_decisions:
- issue: Identität der „geliebten Stadt“
  choice: Die Stadt wird im Haupttext nicht näher identifiziert.
  alternative: Jerusalem oder umfassender die Stadt beziehungsweise das Volk Gottes
  rationale: Der griechische Vers nennt die Stadt nicht ausdrücklich. Eine konkrete Identifizierung im Haupttext würde eine Auslegung festschreiben, die der Wortlaut offenlässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am griechischen Erzählgang; „Da“ verhindert zugleich eine schwerfällige Wiederholung von „Und“. Das räumliche Bild und die offene Identität der Stadt werden bewahrt.
