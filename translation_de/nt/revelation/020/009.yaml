review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt den griechischen Satzbau und die wesentlichen Aussagen zuverlässig wieder: ἀνέβησαν als „zogen … herauf“, ἐπὶ τὸ πλάτος τῆς γῆς als „über die Weite der Erde“, ἐκύκλευσαν als „umzingelten“, παρεμβολή als „Lager“ und κατέφαγεν als „verzehrte“. Die Herkunft des Feuers wird, entsprechend dem SBLGNT, schlicht mit „vom Himmel“ wiedergegeben, ohne den in manchen Überlieferungen bezeugten Zusatz „von Gott“ einzutragen.'
  naturalness: „Und sie zogen über die Weite der Erde herauf“ ist gehobenes, aber gut verständliches modernes Standarddeutsch und passt zum apokalyptisch-erzählenden Register. „Da kam Feuer vom Himmel herab“ ist flüssig und markiert den anschließenden Handlungsverlauf natürlich.
  terminology: „Die Heiligen“, „das Lager“ und „die geliebte Stadt“ sind treffend und traditionssensibel. Insbesondere wahrt „geliebte“ die im griechischen passiven Partizip enthaltene Offenheit hinsichtlich dessen, der die Stadt liebt. Die Fußnote benennt mögliche Deutungen, ohne sie als Textaussage auszugeben.
