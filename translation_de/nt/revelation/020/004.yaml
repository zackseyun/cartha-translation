revisions:
- from: Und ich sah Throne, und sie setzten sich darauf, und Gericht wurde ihnen gegeben. Ich sah die Seelen derer, die wegen des Zeugnisses Jesu[a] und wegen des Wortes Gottes enthauptet worden waren, und die, die weder das Tier noch sein Bild angebetet und das Kennzeichen nicht an ihrer Stirn und an ihrer Hand angenommen hatten. Sie wurden lebendig und herrschten mit dem Messias[b] tausend Jahre lang.
  to: Und ich sah Throne; sie setzten sich darauf, und ihnen wurde Gericht gegeben. Und ich sah die Seelen derer, die wegen des Zeugnisses Jesu[a] und wegen des Wortes Gottes enthauptet worden waren, und derer, die weder das Tier noch sein Bild angebetet hatten noch das Malzeichen an ihrer Stirn und an ihrer Hand angenommen hatten. Sie wurden lebendig und herrschten mit dem Messias[b] tausend Jahre lang.
  rationale: Die notwendige Revision stellt die im Griechischen elliptisch fortgeführte Beziehung der zweiten Beschreibung zu den „Seelen“ im Deutschen wieder her. Sie lässt weiterhin offen, ob beide Beschreibungen dieselbe Gruppe oder unterscheidbare Gruppen kennzeichnen. Zudem wird χάραγμα kontextgerecht als „Malzeichen“ wiedergegeben. Die Ambiguität des Genitivs in „Zeugnis Jesu“, das unbestimmte Subjekt der Sitzenden, die Offenheit von „Gericht“ und die ereignishafte Aussage des Lebendigwerdens bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:46Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft die wesentlichen Begriffe und bewahrt sowohl das ungenannte Subjekt bei „sie setzten sich“ als auch die Mehrdeutigkeit von „Zeugnis Jesu“. Im vorliegenden Satzbau steht jedoch „und die, die …“ als eigenes Satzglied neben „die Seelen derer …“. Dadurch werden im Deutschen die Seelen der Enthaupteten und eine weitere Gruppe von Personen gesehen, während der griechische elliptische Anschluss weiterhin die „Seelen“ bei beiden Beschreibungen nahelegt. Die Ergänzung „derer“ stellt den Bezug zu ψυχὰς wieder her, ohne zu entscheiden, ob es sich um eine oder zwei Gruppen handelt.
  naturalness: Die Revision gliedert den langen visionären Satz behutsam und verwendet idiomatisches, würdiges Standarddeutsch. „Ihnen wurde Gericht gegeben“ ist gegenüber der passivischen Wortstellung der Entwurfsfassung flüssiger, ohne die Offenheit von κρίμα auszudeuten.
  terminology: „Throne“, „Gericht“, „Seelen“, „Tier“, „Bild“ und „Messias“ sind angemessen. „Malzeichen“ ist für χάραγμα im Kontext der Offenbarung die geläufige präzise Wiedergabe; es bewahrt den Bezug zu einem aufgebrachten Kennzeichen besser als das allgemeinere „Kennzeichen“. Die Fußnoten sind korrekt verankert und geben die relevante Ambiguität beziehungsweise die lexikalische Alternative wieder.
