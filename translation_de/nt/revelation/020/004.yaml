id: REV.20.4
reference: Revelation 20:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: de
  text: Und ich sah Throne; sie setzten sich darauf, und ihnen wurde Gericht gegeben. Und ich sah die Seelen derer, die wegen des Zeugnisses Jesu[a] und wegen des Wortes Gottes enthauptet worden waren, und derer, die weder das Tier noch sein Bild angebetet hatten noch das Malzeichen an ihrer Stirn und an ihrer Hand angenommen hatten. Sie wurden lebendig und herrschten mit dem Messias[b] tausend Jahre lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „Zeugnis Jesu“ kann sowohl das von Jesus gegebene Zeugnis als auch das Zeugnis über Jesus bezeichnen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „mit Christus“. Das griechische Χριστός bedeutet als Titel „Messias“ beziehungsweise „Gesalbter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: Throne
  rationale: Direkte, konkrete Wiedergabe; der Ausdruck gehört zum visionären und königlichen Bildfeld der Offenbarung.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: sie setzten sich darauf
  rationale: Das aktive Verb und das im Griechischen ungenannte Subjekt bleiben erhalten, ohne die Sitzenden näher zu bestimmen.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: Gericht wurde ihnen gegeben
  rationale: Die formal nahe Wiedergabe bewahrt die mögliche Bedeutungsspanne zwischen Gericht, Urteil und übertragener richterlicher Befugnis.
- source_word: ψυχὰς
  choice: die Seelen
  rationale: Bewahrt die apokalyptische Anschauung und den Zusammenhang zwischen ihrem Tod und dem anschließenden Lebendigwerden.
- source_word: πεπελεκισμένων
  choice: enthauptet worden waren
  rationale: Gibt die Hinrichtungsart präzise und in natürlichem modernem Deutsch wieder, ohne das im Verb anklingende Werkzeug eigens auszudeuten.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: wegen des Zeugnisses Jesu
  rationale: διά mit Akkusativ wird kausal wiedergegeben; die Genitivverbindung bleibt bewusst offen für ein von Jesus gegebenes Zeugnis oder ein Zeugnis über Jesus.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: wegen des Wortes Gottes
  rationale: Direkte kausale Wiedergabe der im Griechischen parallelen Formulierung.
- source_word: οἵτινες
  choice: die, die
  rationale: Bezeichnet eine Gruppe anhand ihres kennzeichnenden Verhaltens, ohne sie mit einer nicht ausdrücklich genannten Gruppe gleichzusetzen.
- source_word: προσεκύνησαν
  choice: angebetet
  rationale: Trifft hier den religiösen Sinn besser als eine bloß körperliche Beschreibung wie „sich niederwerfen“.
- source_word: θηρίον
  choice: das Tier
  rationale: Direkte und in der Offenbarung etablierte Wiedergabe des apokalyptischen Ausdrucks.
- source_word: εἰκόνα
  choice: Bild
  rationale: Bewahrt die konkrete Bildsprache und vermeidet die interpretierende Verengung auf „Götzenbild“.
- source_word: χάραγμα
  choice: Kennzeichen
  rationale: Natürliches Deutsch für ein angebrachtes oder angenommenes Identifikationszeichen; der feste apokalyptische Bezug bleibt erkennbar.
- source_word: ἔζησαν
  choice: sie wurden lebendig
  rationale: Gibt die ereignishafte Bedeutung im Zusammenhang wieder, ohne die genaue Art des Lebendigwerdens über den Wortlaut hinaus festzulegen.
- source_word: ἐβασίλευσαν
  choice: herrschten
  rationale: Gibt die königliche Ausübung von Herrschaft knapp und idiomatisch wieder.
- source_word: χριστοῦ
  choice: Messias
  rationale: Χριστός fungiert hier als Titel; „Messias“ macht diesen Titelcharakter im Deutschen sichtbar.
theological_decisions:
- issue: Subjekt von ἐκάθισαν und Empfänger des Gerichts
  choice: Das ungenannte Subjekt bleibt als „sie“ unbestimmt.
  alternative: Die Sitzenden ausdrücklich als Märtyrer, Heilige oder himmlische Gerichtsversammlung identifizieren.
  rationale: Der griechische Text nennt den Bezug nicht ausdrücklich; eine nähere Bestimmung würde eine Auslegung in den Text eintragen.
- issue: Bedeutung von μαρτυρία Ἰησοῦ
  choice: „Zeugnis Jesu“ im Haupttext mit erklärender Fußnote zur Mehrdeutigkeit.
  alternative: „ihr Zeugnis über Jesus“ oder „das von Jesus gegebene Zeugnis“.
  rationale: Der Genitiv kann sowohl den Urheber als auch den Gegenstand des Zeugnisses bezeichnen; diese theologisch bedeutsame Spannung wird nicht aufgelöst.
- issue: Verhältnis der Enthaupteten zu denen, die das Tier nicht angebetet hatten
  choice: Beide Bezeichnungen werden entsprechend der griechischen Satzfolge nebeneinandergestellt, ohne ausdrücklich zu behaupten, es handle sich sicher um dieselbe oder um zwei verschiedene Gruppen.
  alternative: Beide Beschreibungen eindeutig auf dieselbe Gruppe beziehen oder zwei getrennte Gruppen daraus machen.
  rationale: Die Konstruktion erlaubt unterschiedliche syntaktische Zuordnungen; die Übersetzung soll diese nicht unnötig festlegen.
- issue: Art des in ἔζησαν bezeichneten Lebendigwerdens
  choice: „sie wurden lebendig“.
  alternative: „sie lebten“, „sie lebten wieder“ oder eine ausdrücklich körperliche beziehungsweise geistliche Deutung.
  rationale: Die ereignishafte Aussage wird wiedergegeben, ohne eine bestimmte endzeitliche Lehrposition einzutragen.
- issue: Wiedergabe von Χριστός
  choice: „Messias“ als Titel.
  alternative: „Christus“.
  rationale: Der Ausdruck bezeichnet hier den gesalbten Herrscher; die alternative traditionelle Titelform wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. Der Satzbau wurde für die Verständlichkeit leicht gegliedert, während ungenannte Bezugsgrößen und echte Mehrdeutigkeiten des griechischen Textes erhalten bleiben.
