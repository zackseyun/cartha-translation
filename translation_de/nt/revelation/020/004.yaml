  - severity: low
    issue: „Kennzeichen“ ist für χάραγμα weniger kontextpräzise als „Malzeichen“.
    rationale: „Malzeichen“ ist modernes Standarddeutsch und die etablierte Bezeichnung für das Zeichen des Tieres; es wahrt zugleich die konkrete Markierungsbedeutung.
