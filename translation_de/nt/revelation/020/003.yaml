revisions:
- from: Und er warf ihn in den Abgrund[a], verschloss ihn und versiegelte ihn über ihm, damit er die Völker nicht länger verführen[b] konnte, bis die tausend Jahre vollendet wären. Danach muss er für kurze Zeit freigelassen werden[c].
  to: Und er warf ihn in den Abgrund[a], verschloss den Abgrund und versiegelte ihn über ihm, damit er die Völker nicht mehr irreführen konnte, bis die tausend Jahre vollendet waren. Danach muss er für kurze Zeit freigelassen werden[c].
  rationale: 'Die Revision stellt die im Griechischen impliziten Bezüge eindeutig her: Verschlossen und versiegelt wird der Abgrund, während sich „über ihm“ auf den darin eingeschlossenen Gegner bezieht. Sie bewahrt die zeitliche und modale Aussage des Zweck- und Zeitsatzes, ohne eine eschatologische Deutung der tausend Jahre oder der Notwendigkeit von δεῖ vorzunehmen. Die Fußnote zu „irreführen“ entfällt, da die frühere Fußnote diese nun gewählte Übersetzung als Alternative nannte; die verbleibenden Marker sind korrekt im Text verankert.'
