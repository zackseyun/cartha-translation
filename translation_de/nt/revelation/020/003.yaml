id: REV.20.3
reference: Revelation 20:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: de
  text: Und er warf ihn in den Abgrund[a], verschloss den Abgrund und versiegelte ihn über ihm, damit er die Völker nicht mehr irreführen konnte, bis die tausend Jahre vollendet waren. Danach muss er für kurze Zeit freigelassen werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Tiefe“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „für kurze Zeit losgelassen werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: warf
  rationale: Das Aoristverb βάλλω bezeichnet hier ein gewaltsames Hineinbefördern; „warf“ ist anschaulich, natürlich und quellennah.
- source_word: ἄβυσσον
  choice: Abgrund
  rationale: ἄβυσσος ist in der Offenbarung eine apokalyptische Ortsbezeichnung. „Abgrund“ ist im Deutschen verständlich und etabliert, ohne die Deutung „bodenlos“ ausdrücklich hinzuzufügen.
- source_word: ἔκλεισεν
  choice: verschloss ihn
  rationale: κλείω bedeutet schließen oder verschließen. Das Pronomen bezieht sich grammatisch auf den maskulinen „Abgrund“ und bezeichnet dessen gesicherten Zugang.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: versiegelte ihn über ihm
  rationale: Die Formulierung bewahrt sowohl das Versiegeln des Abgrunds beziehungsweise seines Zugangs als auch die räumliche Aussage ἐπάνω αὐτοῦ („über ihm“), ohne ein im Griechischen nicht genanntes Schloss einzuführen.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: damit er die Völker nicht länger verführen konnte
  rationale: πλανάω kann täuschen, irreführen oder verführen bedeuten. „verführen“ ist im apokalyptischen Zusammenhang idiomatisch; „nicht länger“ gibt ἔτι wieder. Die Modalform „konnte“ drückt den durch die Gefangensetzung bewirkten Zweck aus.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: bis die tausend Jahre vollendet wären
  rationale: τελεσθῇ bezeichnet das Erreichen eines Abschlusses. „vollendet wären“ wahrt die zeitliche Grenze und den vom Zwecksatz abhängigen Modus.
- source_word: μετὰ ταῦτα
  choice: Danach
  rationale: „Danach“ gibt den zeitlichen Übergang natürlich und prägnant wieder.
- source_word: δεῖ
  choice: muss
  rationale: δεῖ drückt Notwendigkeit aus. „muss“ erhält diese Kraft, ohne ihre theologische Ursache näher festzulegen.
- source_word: λυθῆναι αὐτὸν
  choice: muss er freigelassen werden
  rationale: Das passive λυθῆναι bezeichnet hier die Aufhebung der Fesselung beziehungsweise Gefangenschaft; „freigelassen werden“ ist modernes, klares Deutsch.
- source_word: μικρὸν χρόνον
  choice: für kurze Zeit
  rationale: Der Akkusativ bezeichnet die Dauer; „für kurze Zeit“ gibt ihre Begrenztheit direkt wieder.
theological_decisions:
- issue: Bedeutung der tausend Jahre
  choice: „die tausend Jahre“ ohne erläuternden Zusatz
  alternative: wörtliches Millennium oder symbolischer langer Zeitraum
  rationale: Der Wortlaut legt in diesem Vers nicht fest, ob die Zeitangabe wörtlich oder symbolisch auszulegen ist; die Übersetzung hält diese Frage offen.
- issue: Kraft von δεῖ im apokalyptischen Zusammenhang
  choice: „muss“
  alternative: ausdrückliche Deutung als göttlicher Ratschluss oder bloße erzählerische Folgerichtigkeit
  rationale: Die Notwendigkeit wird ausgesagt, ihr genauer Charakter jedoch nicht erläutert. „muss“ wahrt diese Spannung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der für die Offenbarung angemessenen Bildkraft. Die Syntax bleibt quellennah, wird aber durch „Danach“ und die deutsche Pronomenführung natürlich lesbar. Sämtliche Fußnotenmarker stehen im Haupttext.
