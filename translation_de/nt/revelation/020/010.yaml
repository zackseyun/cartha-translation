id: REV.20.10
reference: Revelation 20:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: de
  text: Und der Teufel, der sie irreführte, wurde in den See aus Feuer und Schwefel geworfen, wo auch das Tier und der falsche Prophet sind[a]. Und sie werden Tag und Nacht für immer und ewig gequält werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier kein Verb. Dem Zusammenhang nach ist „sind“ zu ergänzen; grammatisch wäre auch eine Vergangenheitsform möglich.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Wörtlicher: „in die Zeitalter der Zeitalter“; eine nachdrückliche griechische Wendung für unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: der Teufel
  rationale: In der Offenbarung ist διάβολος die feststehende Bezeichnung für Satan. „Der Teufel“ ist im modernen Deutschen klar und entspricht dieser persönlichen Bezeichnung.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: der sie irreführte
  rationale: Das substantivierte Präsenspartizip kennzeichnet den Teufel durch seine fortdauernde Tätigkeit. „Irreführte“ gibt πλανάω natürlich wieder und passt zur erzählenden Rückschau.
- source_word: ἐβλήθη
  choice: wurde ... geworfen
  rationale: Das Passiv von βάλλω bezeichnet hier die gewaltsame Überführung an den Ort des Gerichts. „Geworfen“ ist gegenwärtiges, unverblasstes Deutsch.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: den See aus Feuer und Schwefel
  rationale: θεῖον bedeutet „Schwefel“. Die Formulierung bewahrt das Bild des griechischen Textes und ist im Deutschen unmittelbar verständlich.
- source_word: θηρίον
  choice: das Tier
  rationale: „Das Tier“ ist die direkte und in der Offenbarung etablierte Bezeichnung dieser apokalyptischen Gestalt.
- source_word: ψευδοπροφήτης
  choice: der falsche Prophet
  rationale: Direkte, klare Entsprechung und etablierte Bezeichnung der apokalyptischen Gestalt.
- source_word: βασανισθήσονται
  choice: sie werden ... gequält werden
  rationale: βασανίζω bezeichnet in diesem Gerichtszusammenhang schwere Qual. „Gequält“ wahrt die Aussage, ohne die Art der Qual näher festzulegen.
- source_word: ἡμέρας καὶ νυκτός
  choice: Tag und Nacht
  rationale: Die feste Wendung bezeichnet ununterbrochene Dauer.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Dies ist eine natürliche deutsche Wiedergabe der nachdrücklichen griechischen Zeitformel. Eine Fußnote nennt die wörtlichere Form.
theological_decisions:
- issue: Dauer der endgültigen Qual in εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  alternative: in die Zeitalter der Zeitalter
  rationale: Die gewählte Formulierung gibt die nachdrückliche Dauerangabe idiomatisch wieder, ohne über die Aussage des Verses hinaus eine umfassendere Lehrfrage zu entscheiden. Die wörtlichere Form bleibt in der Fußnote sichtbar.
- issue: Fehlendes Verb in ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: wo auch das Tier und der falsche Prophet sind
  alternative: wo auch das Tier und der falsche Prophet waren
  rationale: Der griechische Satz enthält an dieser Stelle kein ausdrückliches Verb. Das Präsens passt zum unmittelbaren Zusammenhang, nach dem beide zuvor dorthin geworfen wurden und sich dort befinden; die grammatische Offenheit wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die apokalyptischen Titel bleiben konsistent und ohne konfessionelle Zusätze. Der Satzbau folgt dem griechischen Gedankengang, wird aber durch die Satzteilung für heutige Leser übersichtlich gehalten.
