id: REV.20.11
reference: Revelation 20:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: de
  text: Und ich sah einen großen weißen Thron und den, der darauf saß, vor dessen Angesicht die Erde und der Himmel flohen, und kein Ort wurde für sie gefunden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: einen großen weißen Thron
  rationale: Gibt Größe und Erhabenheit in natürlicher deutscher Adjektivfolge wieder.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: den, der darauf saß
  rationale: Bewahrt die beschreibende, nicht näher identifizierende Formulierung des Griechischen und passt idiomatisch zum Thronbild.
- source_word: ἀπὸ τοῦ προσώπου
  choice: vor seinem Angesicht
  rationale: Bewahrt die konkrete Bildsprache von πρόσωπον und gibt ἀπό im Zusammenhang des Fliehens idiomatisch mit „vor“ wieder.
- source_word: ἔφυγεν
  choice: flohen
  rationale: Das Präteritum erhält die lebendige Bewegung des Aorists und vermeidet die deutendere Wiedergabe „verschwanden“.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: die Erde und der Himmel
  rationale: Entspricht den beiden artikulierten Singularnomen und klingt im Deutschen natürlich und feierlich.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: kein Ort wurde für sie gefunden
  rationale: Erhält die Passivkonstruktion und den feierlich-gerichtlichen Ton des Ausgangstextes.
theological_decisions:
- issue: Identität dessen, der auf dem Thron sitzt
  choice: Die Identität bleibt mit „den, der darauf saß“ unausgesprochen.
  alternative: Ausdrückliche Identifizierung als Gott, der Vater, Christus oder der göttliche Richter.
  rationale: Der Vers selbst nennt die Gestalt nicht ausdrücklich; die beschreibende Formulierung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ erhält bewusst die apokalyptische Bildkraft, ist aber durch die Fußnote in natürlicherem Deutsch erläutert.
