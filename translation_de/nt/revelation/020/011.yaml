revisions:
- from: Und ich sah einen großen weißen Thron und den, der darauf saß. Vor seinem Angesicht[a] flohen die Erde und der Himmel, und kein Ort wurde für sie gefunden.
  to: Und ich sah einen großen weißen Thron und den, der darauf saß, vor dessen Angesicht die Erde und der Himmel flohen, und kein Ort wurde für sie gefunden.
  rationale: Die geringfügige Umstellung bewahrt die Satzverknüpfung und den eindeutigen Bezug der griechischen Relativform οὗ. Sie verändert weder Aussage noch Register, sondern verhindert, dass „seinem“ auf den Thron bezogen wird.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft den griechischen Text insgesamt zuverlässig: Größe und Farbe des Thrones, die unbestimmt bleibende Identität der thronenden Gestalt, das Fliehen von Erde und Himmel sowie die passive Wendung vom nicht gefundenen Ort sind erhalten. Die Präposition „vor“ gibt ἀπό im Bildzusammenhang des Fliehens idiomatisch wieder.'
  naturalness: Der Entwurf ist würdevoll und gut verständlich. Die Satztrennung mit „Vor seinem Angesicht“ erzeugt jedoch eine vermeidbare grammatische Mehrdeutigkeit, weil „seinem“ formal auch auf „Thron“ bezogen werden könnte. Die Relativform „vor dessen Angesicht“ stellt den Bezug zur sitzenden Gestalt klar und bildet die griechische Relativkonstruktion genauer nach.
  terminology: „Angesicht“ ist als gehobene, bildhafte Wiedergabe von πρόσωπον passend; die Fußnote erläutert sachgerecht die idiomatische Möglichkeit „Gegenwart“. „Himmel“ ist im apokalyptischen Zusammenhang zutreffend. Die Gestalt auf dem Thron wird zu Recht nicht identifiziert.
  issues:
  - severity: low
    issue: Mehrdeutiger Bezug von „seinem Angesicht“
    rationale: Nach dem Satzende kann das maskuline Possessivpronomen formal sowohl auf „den, der darauf saß“ als auch auf „Thron“ bezogen werden. Das griechische οὗ bezieht sich eindeutig auf die sitzende Gestalt. „dessen“ beseitigt die Mehrdeutigkeit.
  revised_text: Und ich sah einen großen weißen Thron und den, der darauf saß, vor dessen Angesicht die Erde und der Himmel flohen, und kein Ort wurde für sie gefunden.
  revised_footnotes:
  - marker: a
    text: 'Oder: »vor dessen Gegenwart«.'
    reason: Die wörtlich-bildhafte Bedeutung von πρόσωπον ist „Angesicht“, während die Wendung zugleich die Gegenwart der thronenden Gestalt bezeichnen kann.
  revision_rationale: Die geringfügige Umstellung bewahrt die Satzverknüpfung und den eindeutigen Bezug der griechischen Relativform οὗ. Sie verändert weder Aussage noch Register, sondern verhindert, dass „seinem“ auf den Thron bezogen wird.
