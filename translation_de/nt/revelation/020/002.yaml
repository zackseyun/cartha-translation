id: REV.20.2
reference: Revelation 20:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: de
  text: Und er ergriff den Drachen – die alte Schlange[a], die der Teufel und Satan ist – und band ihn für tausend Jahre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Schlange aus alter Zeit«; auch: »jene Schlange von alters her«.'
    reason: lexikalische Alternative zu ὁ ὄφις ὁ ἀρχαῖος
lexical_decisions:
- source_word: ἐκράτησεν
  choice: ergriff
  rationale: Das Verb bezeichnet hier ein entschiedenes, machtvolles Ergreifen. »Ergriff« ist prägnant und bewahrt die konkrete Handlung.
- source_word: δράκοντα
  choice: Drachen
  rationale: Die übliche deutsche Wiedergabe erhält die apokalyptische Bildsprache und die Bezüge innerhalb der Offenbarung.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: die alte Schlange
  rationale: Die Wortgruppe identifiziert den Drachen appositionell. »Die alte Schlange« ist natürliches, würdevolles Deutsch; mögliche Nuancen von ἀρχαῖος werden in der Fußnote genannt.
- source_word: Διάβολος
  choice: der Teufel
  rationale: Die feste deutsche Bezeichnung verlangt in diesem Satzbau idiomatisch den bestimmten Artikel.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Die etablierte deutsche Form des Namens beziehungsweise Titels wird beibehalten.
- source_word: ἔδησεν
  choice: band
  rationale: Die konkrete Bedeutung »binden« bleibt erhalten, ohne die Art der Einschränkung näher auszudeuten.
- source_word: χίλια ἔτη
  choice: für tausend Jahre
  rationale: Der Akkusativ der zeitlichen Ausdehnung wird im Deutschen natürlich mit »für« wiedergegeben; die Zahlenangabe bleibt unverändert.
theological_decisions:
- issue: Art der tausend Jahre
  choice: Die Angabe wird schlicht mit »für tausend Jahre« wiedergegeben.
  alternative: Eine ausdrücklich wörtliche oder ausdrücklich symbolische Deutung des Zeitraums.
  rationale: Der Vers entscheidet in seiner Formulierung nicht zwischen den umstrittenen Deutungsmodellen; die Übersetzung soll diese Spannung nicht auflösen.
- issue: Identität des Drachen
  choice: Die vollständige Identifikationskette »der Drache – die alte Schlange –, der der Teufel und Satan ist« bleibt erhalten.
  alternative: Die Bezeichnungen zu einem einzigen vereinfachten Namen zusammenzufassen.
  rationale: Der griechische Text nennt alle Bezeichnungen ausdrücklich. Das maskuline Relativpronomen »der« nimmt dabei wie das griechische ὅς den Drachen auf, nicht nur die unmittelbar vorausgehende feminine Apposition »Schlange«.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bildkräftigem Ton. Die Gedankenstriche kennzeichnen die appositionelle Identifikation; das grammatisch auffällige maskuline »der« wahrt den Rückbezug auf »den Drachen« und entspricht dem griechischen Relativpronomen.
