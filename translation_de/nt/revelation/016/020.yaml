  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: de
  text: Und jede Insel floh[a], und keine Berge wurden gefunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verschwand“. Das griechische Verb bedeutet wörtlich „floh“ und bewahrt so die lebhafte Personifikation des Verses.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: πᾶσα
  choice: jede
  rationale: 'Mit dem Singular νῆσος ist πᾶσα distributiv: jede einzelne Insel.'
- source_word: νῆσος
  choice: Insel
  rationale: Die direkte und kontextgemäße Entsprechung ist „Insel“.
- source_word: ἔφυγεν
  choice: floh
  rationale: Die wörtliche Bedeutung von φεύγω bewahrt die eindringliche Personifikation; das Verschwinden ist das im Kontext bezeichnete Ergebnis.
- source_word: ὄρη
  choice: Berge
  rationale: Der artikellose Plural wird im Deutschen natürlich mit „Berge“ wiedergegeben.
- source_word: οὐχ εὑρέθησαν
  choice: wurden nicht mehr gefunden
  rationale: Die passive Form bedeutet „wurden nicht gefunden“; „nicht mehr“ macht im Deutschen den kontextuellen Ergebnissinn natürlich verständlich, ohne die konkrete Bildsprache aufzugeben.
- source_word: καὶ ... καὶ
  choice: Und ... und
  rationale: Die wiederholte Beiordnung erhält den kumulativen, parataktischen Stil der Offenbarung.
theological_decisions:
- issue: 'Apokalyptische Bildsprache: wörtliches Verschwinden oder bildhafte Deutung'
  choice: Die konkrete Bildsprache bleibt in der Übersetzung stehen.
  alternative: Interpretierender mit „verschwand“ oder „löste sich auf“ übersetzen.
  rationale: Der griechische Text formuliert anschaulich und personifizierend. Ob die Aussage wörtlich oder symbolisch zu verstehen ist, soll nicht bereits durch die Übersetzung entschieden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „jede Insel floh“ wird bewusst beibehalten, weil sie die apokalyptische Personifikation des griechischen Textes wiedergibt.
