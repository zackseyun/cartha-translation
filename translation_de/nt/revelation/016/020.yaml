  naturalness: Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. „Und keine Berge wurden gefunden“ ist in diesem apokalyptischen Berichtsstil natürlicher als die vorliegende Formulierung und wahrt zugleich deren knappe Parataxe.
