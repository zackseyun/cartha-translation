id: REV.16.19
reference: Revelation 16:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: de
  text: Und die große Stadt wurde in drei Teile gespalten, und die Städte der Völker fielen. Babylon die Große wurde vor Gott in Erinnerung gerufen[a], um ihr den Kelch mit dem Wein der Glut seines Zorns zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher am Wortlaut: „kam vor Gott in Erinnerung“. Die biblische Wendung bezeichnet hier, dass Babylon vor Gott zur gerichtlichen Rechenschaft kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο … εἰς τρία μέρη
  choice: wurde in drei Teile gespalten
  rationale: Die resultative Konstruktion besagt, dass die Stadt schließlich aus drei Teilen bestand. Die passive Formulierung gibt dies in natürlichem Deutsch wieder, ohne den Verursacher ausdrücklich zu benennen.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: die große Stadt
  rationale: Die direkte Wiedergabe bewahrt das wiederkehrende apokalyptische Stadtbild.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: die Städte der Völker
  rationale: „Völker“ gibt ἔθνη im weltweiten Gerichtskontext weit und ohne unnötige religiös-ethnische Festlegung wieder.
- source_word: ἔπεσαν
  choice: fielen
  rationale: Die schlichte, bildhafte Aussage lässt offen, ob politischer Untergang, baulicher Einsturz oder beides gemeint ist.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babylon die Große
  rationale: Die feste Bezeichnung und die griechische Hervorhebung bleiben erhalten.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: kam vor Gott in Erinnerung
  rationale: Diese Formulierung bewahrt das biblische Erinnerungsidiom und vermeidet die erklärende Festlegung „Gott nahm sie zum Gericht in den Blick“.
- source_word: δοῦναι αὐτῇ
  choice: damit er ihr … gab
  rationale: Der Zwecksinn des Infinitivs wird deutlich; Gott ist aus dem unmittelbar vorausgehenden Ausdruck als Handelnder erschließbar.
- source_word: τὸ ποτήριον
  choice: den Kelch
  rationale: „Kelch“ ist im Deutschen die natürliche, intertextuell anschlussfähige Bezeichnung für das biblische Bild eines von Gott zugeteilten Loses.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: mit dem Wein der Glut seines Zorns
  rationale: „Glut“ und „Zorn“ bilden die beiden verwandten griechischen Begriffe θυμός und ὀργή unterscheidbar und zugleich idiomatisch ab; „mit dem Wein“ macht den Inhalt des Kelches natürlich verständlich.
theological_decisions:
- issue: Das Gerichtsidiom ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: kam vor Gott in Erinnerung
  alternative: Gott erinnerte sich an Babylon die Große, um sie zu richten
  rationale: Die gewählte Fassung erhält die eigentümliche biblische Redeweise. Der Kontext zeigt, dass die Erinnerung Gericht nach sich zieht, ohne dass diese Deutung in den Satz selbst eingefügt wird.
- issue: Das Verhältnis von θυμός und ὀργή
  choice: die Glut seines Zorns
  alternative: sein glühender Zorn
  rationale: Die substantivische Fassung bildet beide griechischen Begriffe ab und bewahrt ihre rhetorische Verdichtung, ohne sie zu einem einzigen Begriff zu verschmelzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper apokalyptischer Bildsprache. „Fielen“ wahrt die Mehrdeutigkeit des griechischen Verbs; „Kelch“ erhält den biblischen Bildzusammenhang. Der Fußnotenmarker steht bei der Wendung, die er tatsächlich erläutert.
