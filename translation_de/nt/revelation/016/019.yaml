revisions:
- from: Und die große Stadt wurde in drei Teile gespalten, und die Städte der Völker fielen. Babylon die Große kam vor Gott in Erinnerung[a], damit er ihr den Kelch mit dem Wein der Glut seines Zorns gab.
  to: Und die große Stadt wurde in drei Teile gespalten, und die Städte der Völker fielen. Babylon die Große wurde vor Gott in Erinnerung gerufen[a], um ihr den Kelch mit dem Wein der Glut seines Zorns zu geben.
  rationale: Die Revision korrigiert die zwingend fehlerhafte Wiedergabe des griechischen Infinitivs durch eine deutsche Zweckkonstruktion. Zugleich wird das Erinnerungsidiom mit einer verständlichen deutschen Formulierung wiedergegeben; die Fußnote dokumentiert die nähere, bildhafte Alternative. Alle übrigen Bilder und die Unterscheidung von „Glut“ und „Zorn“ bleiben erhalten.
