source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: de
  text: 'Und der siebte goss seine Schale in die Luft aus, und eine laute Stimme kam aus dem Heiligtum[a], vom Thron her, und sagte: »Es ist geschehen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem Tempel«. Das griechische Wort bezeichnet genauer das Heiligtum und nicht den gesamten Tempelbezirk.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Es ist vollbracht.«'
    reason: alternative_rendering
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: der siebte
  rationale: Der griechische Text nennt nur die substantivierte Ordnungszahl. Aus dem Zusammenhang ist der siebte Engel gemeint; »Engel« wird jedoch nicht ergänzt, damit die Ellipse des Ausgangstextes erhalten bleibt.
- source_word: ἐξέχεεν
  choice: goss … aus
  rationale: »Ausgießen« ist im Deutschen die natürliche und in der Abfolge der Schalen konsistente Wiedergabe von ἐκχέω.
- source_word: φιάλην
  choice: Schale
  rationale: »Schale« bezeichnet das offene Gefäß angemessen und vermeidet das heute missverständliche beziehungsweise altertümliche »Phiole«.
- source_word: ἐπὶ τὸν ἀέρα
  choice: in die Luft
  rationale: Nach einem Verb des Ausgießens gibt »in die Luft« die Zielrichtung von ἐπί mit Akkusativ natürlich wieder.
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: Da kam eine laute Stimme
  rationale: »Laut« gibt die hörbare Stärke von μεγάλη idiomatisch wieder; »kam« bewahrt die im Verb ausgedrückte Bewegung, ohne im Deutschen schwerfällig zu wirken.
- source_word: ἐκ τοῦ ναοῦ
  choice: aus dem Heiligtum
  rationale: ναός bezeichnet genauer das Heiligtum und nicht allgemein den gesamten Tempelbezirk.
- source_word: ἀπὸ τοῦ θρόνου
  choice: vom Thron her
  rationale: Die Formulierung erhält neben »aus dem Heiligtum« die zweite Herkunftsangabe des griechischen Textes.
- source_word: λέγουσα
  choice: Sie sagte
  rationale: Das feminine Partizip bezieht sich auf φωνή, »Stimme«. Ein eigener deutscher Satz ist klar und natürlich.
- source_word: Γέγονεν
  choice: Es ist geschehen
  rationale: Das Perfekt von γίνομαι bezeichnet ein eingetretenes Geschehen mit fortbestehendem Ergebnis. »Es ist geschehen« wahrt diese Abgeschlossenheit und die knappe, feierliche Aussage.
theological_decisions:
- issue: ναός in der himmlischen Tempelszene
  choice: Heiligtum
  alternative: Tempel
  rationale: Die spezifischere Wiedergabe wahrt den lexikalischen Unterschied zu ἱερόν, ohne die apokalyptische Szenerie dogmatisch näher festzulegen.
- issue: Die Vollendungsformel Γέγονεν
  choice: Es ist geschehen
  alternative: Es ist vollbracht
  rationale: »Es ist geschehen« bildet das resultative Perfekt ab, ohne ausdrücklich zu entscheiden, ob der Schwerpunkt auf dem Eintreten oder der Vollendung des angekündigten Gerichts liegt. Die geläufige Alternative wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze machen die dramatische Abfolge verständlich; die ungewöhnliche Ellipse »der siebte« und die doppelte Herkunftsangabe der Stimme bleiben erhalten.
