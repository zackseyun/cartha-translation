source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: de
  text: Und der erste ging hin und goss seine Schale auf die Erde aus. Da befiel ein schlimmes und böses Geschwür[a] die Menschen, die das Kennzeichen des Tieres hatten und sein Bild anbeteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein böses und schlimmes Geschwür“ oder „ein übles und schlimmes Geschwür“. Das Griechische verwendet mit κακόν und πονηρόν zwei starke, bedeutungsnahe Adjektive, um die Schwere der Plage hervorzuheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ging
  rationale: Der Aorist von ἀπέρχομαι führt die Handlung in der Erzählfolge weiter. „Ging“ ist natürlich und fügt dem schlichten Bewegungsvorgang keine unnötige Betonung hinzu.
- source_word: ὁ πρῶτος
  choice: der erste
  rationale: Das substantivierte Adjektiv verweist im Kontext auf den ersten der sieben Engel. Die knappe Form des Griechischen bleibt erhalten, ohne „Engel“ ausdrücklich zu ergänzen.
- source_word: ἐξέχεεν
  choice: goss … aus
  rationale: Die trennbare Verbindung „ausgießen“ entspricht der üblichen Bedeutung von ἐκχέω und der wiederkehrenden Schalenformel in Offenbarung 16.
- source_word: φιάλην
  choice: Schale
  rationale: φιάλη bezeichnet ein flaches Gefäß. „Schale“ ist im heutigen Deutsch verständlich und vermeidet die irreführende Vorstellung eines kleinen Fläschchens.
- source_word: εἰς τὴν γῆν
  choice: auf die Erde
  rationale: εἰς bezeichnet hier die Erde als Ziel des Ausgießens. „Auf die Erde“ gibt diese Richtung idiomatisch wieder; „Land“ wäre lexikalisch möglich, ist im apokalyptischen Zusammenhang aber weniger wahrscheinlich.
- source_word: ἐγένετο … ἐπὶ τοὺς ἀνθρώπους
  choice: Da befiel … die Menschen
  rationale: Die deutsche Konstruktion gibt das Eintreten der Plage und ihre Wirkung auf die Betroffenen natürlich wieder, ohne den Inhalt zu erweitern.
- source_word: ἕλκος
  choice: Geschwür
  rationale: ἕλκος bezeichnet eine offene, geschwürartige Wunde. „Geschwür“ ist präziser als das allgemeinere „Wunde“ und weniger eng festgelegt als „Eiterbeule“.
- source_word: κακὸν καὶ πονηρὸν
  choice: schlimmes und bösartiges
  rationale: Die beiden starken negativen Adjektive werden beibehalten. „Schlimm“ bezeichnet die schwere Wirkung, „bösartig“ die verderbliche Beschaffenheit; eine Fußnote weist auf weitere mögliche Nuancen hin.
- source_word: τοὺς ἀνθρώπους
  choice: die Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, näher bestimmt als Anhänger des Tieres. Die Wiedergabe ist geschlechtsübergreifend und textgemäß.
- source_word: τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου
  choice: die das Kennzeichen des Tieres trugen
  rationale: χάραγμα ist ein eingeprägtes oder angebrachtes Kennzeichen. „Trugen“ formuliert den Besitz im Deutschen natürlich, ohne über die Art der Kennzeichnung zu entscheiden.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: sein Bild anbeteten
  rationale: προσκυνέω bezeichnet hier kultische Verehrung. „Anbeteten“ bringt diesen Zusammenhang klar zum Ausdruck; αὐτοῦ bezieht sich auf das Tier.
theological_decisions:
- issue: Die beiden Adjektive κακόν und πονηρόν beim Geschwür
  choice: „ein schlimmes und bösartiges Geschwür“ mit Fußnote
  alternative: „ein böses und schmerzhaftes Geschwür“ oder „ein schlimmes und übles Geschwür“
  rationale: Die Häufung zweier bedeutungsnaher negativer Adjektive verstärkt die Schwere der Plage. Die Übersetzung bewahrt beide, legt πονηρός aber nicht eindeutig auf moralische Bosheit fest; die mögliche Bedeutungsbreite wird in der Fußnote offengehalten.
- issue: Begrenzung der von der Plage Betroffenen
  choice: Nur Menschen mit dem Kennzeichen des Tieres, die sein Bild anbeten
  alternative: Eine allgemeine Plage über alle Menschen auf der Erde
  rationale: Die beiden substantivierten Partizipialgruppen bestimmen ausdrücklich, wen das Geschwür trifft. Die Übersetzung bewahrt diese Eingrenzung und weitet das Gericht nicht über den Wortlaut hinaus aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Schlüsselbegriffe der Offenbarung wie „Schale“, „Kennzeichen des Tieres“ und „Bild“ bleiben transparent. Der erste Engel wird entsprechend der knappen griechischen Form nur als „der erste“ bezeichnet.
