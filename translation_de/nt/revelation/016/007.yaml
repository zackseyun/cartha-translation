id: REV.16.7
reference: Revelation 16:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: de
  text: 'Und ich hörte den Altar sagen[a]: »Ja, Herr, Gott, du Allmächtiger: Wahr und gerecht sind deine Urteile.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und ich hörte vom Altar her sagen.« Der griechische Genitiv kann die Quelle des Gehörten bezeichnen; zusammen mit »sagen« stellt der Wortlaut jedoch am ehesten den Altar selbst als Sprecher dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: ich hörte
  rationale: Der Aorist von ἀκούω bezeichnet hier schlicht das Hören eines Ereignisses; »ich lauschte« würde eine nicht ausgedrückte Absicht hinzufügen.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: den Altar sagen
  rationale: Nach ἀκούω kann der Genitiv die gehörte Quelle bezeichnen. Zusammen mit dem Partizip λέγοντος liegt die anschauliche Personifikation des Altars als Sprecher am nächsten.
- source_word: Ναί
  choice: Ja
  rationale: Die bekräftigende Partikel wird im modernen Deutsch klar und unmittelbar mit »Ja« wiedergegeben.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Herr, Gott, du Allmächtiger
  rationale: Die Wiedergabe bewahrt alle drei Elemente der direkten Anrede. Das wiederaufnehmende »du« macht die Apposition im Deutschen natürlich, ohne einen Titel auszulassen.
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: wahr und gerecht
  rationale: Die beiden prädikativen Adjektive beschreiben Gottes Urteile als wirklich verlässlich und dem Recht entsprechend; »wahr und gerecht« bewahrt die knappe, gewichtige Formulierung.
- source_word: αἱ κρίσεις σου
  choice: deine Urteile
  rationale: κρίσεις bezeichnet hier richterliche Entscheidungen beziehungsweise Gerichtsurteile. »Urteile« wahrt den gerichtlichen Zusammenhang und klingt im Deutschen natürlicher als das mehrdeutige »Gerichte«.
theological_decisions:
- issue: Personifikation des Altars als Sprecher
  choice: 'Der Altar selbst wird als sprechend dargestellt: »ich hörte den Altar sagen«.'
  alternative: 'Eine nicht ausdrücklich genannte Stimme vom Altar: »ich hörte vom Altar her sagen« oder »ich hörte eine Stimme vom Altar«.'
  rationale: Der griechische Wortlaut nennt den Altar und verbindet ihn mit dem Partizip »sagend«. Die Personifikation erhält die apokalyptische Bildsprache und vermeidet die Ergänzung des nicht vorhandenen Wortes »Stimme«; die grammatisch mögliche Quellenangabe wird in einer Fußnote festgehalten.
- issue: Göttliche Titel in direkter Anrede
  choice: »Herr, Gott, du Allmächtiger«
  alternative: »Herr, allmächtiger Gott« oder »Herr, Gott, der Allmächtige«
  rationale: Die gewählte Form erhält κύριε, ὁ θεός und ὁ παντοκράτωρ als drei eng verbundene Anredeelemente. Sie vermeidet, die griechische Apposition stillschweigend zu einem einzigen zusammengesetzten Titel zu verschmelzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Personifikation des Altars bleibt bewusst erhalten. Der Doppelpunkt nach der Anrede gliedert den feierlichen Ausspruch, ohne die knappe Satzstruktur des Griechischen aufzulösen.
