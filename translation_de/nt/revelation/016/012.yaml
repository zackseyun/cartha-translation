id: REV.16.12
reference: Revelation 16:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: de
  text: Und der Sechste goss seine Schale über den großen Strom, den Euphrat, aus. Da trocknete sein Wasser aus, damit der Weg der Könige vom Aufgang der Sonne[a] bereitet werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfacher: „aus dem Osten“. Wörtlich: „vom Aufgang der Sonne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: der sechste
  rationale: Der griechische Text nennt nur die substantivierte Ordnungszahl und verweist damit auf die zuvor genannten Schalenträger zurück. „Engel“ wird nicht ergänzt.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: goss seine Schale … aus
  rationale: „Ausgießen“ ist im Deutschen die natürliche und bildkräftige Wiedergabe von ἐκχέω; „Schale“ bezeichnet das breite Gefäß φιάλη angemessen.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: über den großen Strom, den Euphrat
  rationale: „Über … ausgießen“ ist eine natürliche deutsche Konstruktion. Die Apposition „den Euphrat“ bewahrt die Struktur, während „Strom“ die Größe des bedeutenden Flusses idiomatisch ausdrückt.
- source_word: ἐξηράνθη τὸ ὕδωρ αὐτοῦ
  choice: Da trocknete sein Wasser aus
  rationale: Das intransitive deutsche „austrocknen“ gibt den griechischen Passivvorgang natürlich wieder, ohne einen Handelnden hinzuzufügen. „Sein“ bezieht sich eindeutig auf den Strom.
- source_word: ἵνα ἑτοιμασθῇ ἡ ὁδὸς
  choice: damit der Weg … bereitet würde
  rationale: „Damit“ wahrt die Zweckbedeutung von ἵνα; die Passivform erhält die Offenheit darüber, wer den Weg bereitet.
- source_word: τῶν βασιλέων
  choice: für die Könige
  rationale: Der griechische Genitiv bezeichnet hier diejenigen, denen der bereitete Weg dient. „Für die Könige“ ist im modernen Deutsch klarer und natürlicher als „der Weg der Könige“.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: vom Aufgang der Sonne
  rationale: Die wörtliche Bildsprache bleibt erhalten und wird nicht im Haupttext auf das schlichtere „aus dem Osten“ reduziert.
theological_decisions:
- issue: Ob „der sechste“ ausdrücklich als Engel bezeichnet werden soll
  choice: „der sechste“ ohne Ergänzung
  alternative: „der sechste Engel“
  rationale: Der Zusammenhang identifiziert die Handelnden als Engel, doch der vorliegende Vers wiederholt das Substantiv nicht. Die Ellipse des Ausgangstextes bleibt erhalten.
- issue: Ob das Austrocknen des Euphrat und der Zug der Könige symbolisch erklärt werden sollen
  choice: Die apokalyptischen Bilder werden ohne Deutung wiedergegeben.
  alternative: Eine erklärende Umschreibung als Invasion oder endzeitliche Sammlung
  rationale: Der Vers selbst legt die volle Bedeutung der Bilder nicht aus. Die Übersetzung bewahrt daher ihre Offenheit und theologische Spannung.
- issue: Ob ἀπὸ ἀνατολῆς ἡλίου direkt als Himmelsrichtung wiedergegeben werden soll
  choice: „vom Aufgang der Sonne“ im Haupttext
  alternative: „aus dem Osten“
  rationale: Die anschauliche Formulierung des Griechischen bleibt erhalten; die idiomatische Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die Satzteilung verbessert die Lesbarkeit, ohne den Gedankengang zu verändern. Kleinschreibung bei „der sechste“ folgt der substantivierten Ordnungszahl im laufenden Satz.
