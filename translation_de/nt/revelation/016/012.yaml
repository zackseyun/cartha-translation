- from: Und der sechste goss seine Schale über den großen Strom, den Euphrat, aus. Da trocknete sein Wasser aus, damit der Weg für die Könige vom Aufgang der Sonne[a] bereitet würde.
  to: Und der Sechste goss seine Schale über den großen Strom, den Euphrat, aus. Da trocknete sein Wasser aus, damit der Weg der Könige vom Aufgang der Sonne[a] bereitet werde.
  rationale: Die Revision korrigiert die obligatorische Großschreibung von „Sechste“, verwendet eine präzise finale Passivkonstruktion und stellt beim Genitiv „der Könige“ die Form und Offenheit des Ausgangstextes wieder her. Die apokalyptische Bildsprache und die Ellipse ohne „Engel“ bleiben erhalten.
