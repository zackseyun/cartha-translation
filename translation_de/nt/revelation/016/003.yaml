id: REV.16.3
reference: Revelation 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: de
  text: Und der Zweite goss seine Schale ins Meer aus. Da wurde es zu Blut wie das eines Toten[a], und jedes Lebewesen im Meer starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu Blut wie von einem Leichnam«; wörtlich: »Blut wie eines Toten«.'
    reason: Die knappe griechische Vergleichsformel ὡς νεκροῦ lässt das Bezugswort »Blut« unausgesprochen und kann im Deutschen unterschiedlich ergänzt werden.
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: der Zweite
  rationale: Das substantivierte Ordnungszahlwort verweist im Zusammenhang auf den zweiten Engel, doch »Engel« steht in diesem Vers nicht ausdrücklich im griechischen Text.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: goss seine Schale … aus
  rationale: »Ausgießen« gibt ἐκχέω im Bild der Gerichtsschalen treffend wieder; »Schale« bezeichnet das flache Gefäß φιάλη angemessener als das traditionelle »Phiole«.
- source_word: εἰς τὴν θάλασσαν
  choice: ins Meer
  rationale: εἰς bezeichnet hier die Richtung, in die der Inhalt der Schale gegossen wird.
- source_word: ἐγένετο αἷμα
  choice: wurde es zu Blut
  rationale: Die Formulierung bewahrt die Aussage einer wirklichen Verwandlung innerhalb der Vision und schwächt sie nicht zu einem bloßen Aussehen ab.
- source_word: ὡς νεκροῦ
  choice: wie das eines Toten
  rationale: 'Das ausgelassene Bezugswort ist aus αἷμα zu ergänzen: Das Blut wird mit dem Blut eines Toten verglichen. Die knappe Form bewahrt die ungewöhnliche und drastische Bildsprache.'
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: jedes Lebewesen
  rationale: Die semitisch geprägte Wendung bezeichnet hier im Zusammenhang der Meerestiere jedes lebende Geschöpf; »Seele« wäre im heutigen Deutsch missverständlich anthropologisch gefärbt.
- source_word: ἀπέθανεν τὰ ἐν τῇ θαλάσσῃ
  choice: im Meer starb
  rationale: Die Ortsangabe wird im Deutschen natürlich an »jedes Lebewesen« angeschlossen; »starb« entspricht unmittelbar ἀπέθανεν.
theological_decisions:
- issue: Wirklichkeit der Plage in der Vision
  choice: Das Meer wird zu Blut.
  alternative: Das Meer sah nur wie Blut aus.
  rationale: ἐγένετο αἷμα sagt, dass es Blut wurde; erst die folgende Wendung beschreibt vergleichend dessen Beschaffenheit. Die Härte des visionären Gerichtsbildes wird daher nicht abgeschwächt.
- issue: Bedeutung von ψυχή im Zusammenhang
  choice: Lebewesen
  alternative: Seele
  rationale: Im Kontext bezeichnet ψυχὴ ζωῆς lebende Geschöpfe im Meer und macht keine eigenständige anthropologische Aussage über die Seele.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Bezeichnung »der Zweite« bleibt erhalten, weil der unmittelbare Zusammenhang den zweiten Engel erkennen lässt, ohne das im Vers nicht genannte Substantiv einzufügen. Kurze Hauptsätze bewahren den eindringlichen Rhythmus der Vision.
