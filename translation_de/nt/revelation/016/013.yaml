id: REV.16.13
reference: Revelation 16:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: de
  text: Und ich sah, wie aus dem Mund des Drachen, aus dem Mund des Tieres und aus dem Mund des falschen Propheten drei unreine Geister hervorkamen, die Fröschen glichen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: Der Aorist von ὁράω wird als schlichtes Erzählpräteritum wiedergegeben; die Formulierung entspricht der Sprache eines Visionsberichts.
- source_word: ἐκ ... τοῦ στόματος
  choice: aus dem Maul/Mund ... hervorkamen
  rationale: ἐκ bezeichnet hier die Herkunft bzw. Bewegung aus etwas heraus. Das im Griechischen nicht ausdrücklich genannte Bewegungsverb wird im Deutschen ergänzt, damit der Satz natürlich und eindeutig lesbar ist. Bei Drache und Tier ist „Maul“, beim falschen Propheten „Mund“ idiomatisch.
- source_word: δράκοντος
  choice: des Drachen
  rationale: Bewahrt die etablierte apokalyptische Bildsprache der Offenbarung.
- source_word: θηρίου
  choice: des Tieres
  rationale: „Tier“ ist die sachgerechte und in der Offenbarung etablierte Wiedergabe von θηρίον; eine Deutung des Symbols wird nicht in die Übersetzung aufgenommen.
- source_word: ψευδοπροφήτου
  choice: des falschen Propheten
  rationale: Gibt das zusammengesetzte Substantiv direkt und im Deutschen natürlich wieder.
- source_word: πνεύματα
  choice: Geister
  rationale: Bezeichnet im Kontext geistige Wesen; „Geister“ bewahrt die Aussage des Verses, ohne die nähere Bestimmung des Folgeverses vorwegzunehmen.
- source_word: τρία ἀκάθαρτα
  choice: drei unreine
  rationale: „Unrein“ erhält die kultischen sowie moralisch-geistlichen Bedeutungsanklänge von ἀκάθαρτα.
- source_word: ὡς βάτραχοι
  choice: die wie Frösche aussahen
  rationale: ὡς kennzeichnet einen Vergleich. Die verbale deutsche Formulierung macht deutlich, dass die Geister nicht mit Fröschen gleichgesetzt werden, sondern ihnen in der Erscheinung gleichen.
theological_decisions:
- issue: Wesen der πνεύματα ἀκάθαρτα in der apokalyptischen Bildsprache
  choice: „drei unreine Geister ..., die wie Frösche aussahen“ ohne deutende Erweiterung
  alternative: „drei dämonische Geister, die wie Frösche aussahen“
  rationale: Vers 13 nennt sie unreine Geister; erst der folgende Vers bestimmt sie ausdrücklich als dämonische Geister. Die Übersetzung nimmt diese Erklärung nicht vorweg.
- issue: Bezug von ὡς βάτραχοι
  choice: Vergleich des Aussehens der Geister mit Fröschen
  alternative: Identifikation der Geister als Frösche
  rationale: ὡς drückt einen Vergleich aus und lässt offen, welche einzelnen Merkmale der Frösche gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Herkunftsangabe bleibt erhalten. „Maul“ wird für Drache und Tier, „Mund“ für den falschen Propheten verwendet. Die Umstellung und das ergänzte „hervorkamen“ dienen der natürlichen deutschen Syntax; die Fußnote dokumentiert die griechische Satzfolge.
