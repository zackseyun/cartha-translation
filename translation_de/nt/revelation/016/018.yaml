source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: de
  text: Und es geschahen Blitze, Laute[a] und Donnerschläge, und es ereignete sich ein gewaltiges Erdbeben, wie es seit Menschen auf der Erde sind kein Erdbeben gegeben hatte – so gewaltig war dieses Erdbeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Stimmen.'
    reason: Lexikalische Mehrdeutigkeit von φωναί.
lexical_decisions:
- source_word: ἀστραπαί
  choice: Blitze
  rationale: Der deutsche Plural bezeichnet wiederholte Blitzerscheinungen natürlich und knapp.
- source_word: φωναί
  choice: Laute
  rationale: φωνή kann sowohl »Stimme« als auch allgemeiner »Laut« oder »Geräusch« bedeuten. Im Zusammenhang mit Blitzen und Donner ist »Laute« naheliegend, ohne die mögliche Mehrdeutigkeit zu verschweigen.
- source_word: βρονταί
  choice: Donnerschläge
  rationale: Der zählbare Plural gibt die wiederholten Donnerereignisse idiomatisch wieder.
- source_word: σεισμός
  choice: Erdbeben
  rationale: Dies ist in diesem Zusammenhang die klare und übliche deutsche Entsprechung.
- source_word: μέγας
  choice: gewaltig / groß
  rationale: Beim ersten Vorkommen vermittelt »gewaltig« die enorme Stärke des Bebens; im abschließenden, emphatischen Satz wahrt »so gewaltig, so groß« die gesteigerte Wiederholung des Griechischen.
- source_word: οἷος οὐκ ἐγένετο
  choice: wie es keines gegeben hatte
  rationale: Die Formulierung bringt den rückblickenden Vergleich und die beispiellose Größe des Ereignisses natürlich zum Ausdruck.
- source_word: ἀφ’ οὗ ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: seit es Menschen auf der Erde gibt
  rationale: Die Wendung bezeichnet den gesamten Zeitraum menschlicher Existenz auf der Erde. »Menschen« gibt den generischen Plural ἄνθρωποι im Deutschen sachgerecht und ohne männliche Verengung wieder.
- source_word: τηλικοῦτος … οὕτω μέγας
  choice: so gewaltig, so groß
  rationale: Die doppelte Steigerung bewahrt den emphatischen, apokalyptischen Nachdruck der griechischen Schlusswendung.
theological_decisions:
- issue: Generisches ἄνθρωποι im geschichtlichen Vergleich
  choice: Menschen
  alternative: Männer
  rationale: Gemeint ist die Menschheit insgesamt, nicht ausschließlich männliche Personen. Im modernen Deutschen entspricht »Menschen« daher dem Umfang des griechischen Ausdrucks am genauesten.
- issue: Deutung von φωναί in der Gerichtstheophanie
  choice: Laute
  alternative: Stimmen
  rationale: Der Kontext begünstigt unbestimmte hörbare Erscheinungen neben Blitz und Donner; da »Stimmen« lexikalisch möglich bleibt und in der Offenbarung auch anderweitig vorkommt, wird die Alternative in einer Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem nachdrücklichen Rhythmus der apokalyptischen Darstellung. Die wiederholten καί-Verbindungen bleiben weitgehend erhalten; der Gedankenstrich hebt die emphatische Schlusssteigerung hervor.
