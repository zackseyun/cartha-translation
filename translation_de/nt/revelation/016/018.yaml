revisions:
- from: Und es kamen Blitze, Laute[a] und Donnerschläge, und es kam zu einem gewaltigen Erdbeben, wie es keines gegeben hatte, seit es Menschen auf der Erde gibt – so gewaltig, so groß war dieses Erdbeben.
  to: Und es geschahen Blitze, Laute[a] und Donnerschläge, und es ereignete sich ein gewaltiges Erdbeben, wie es seit Menschen auf der Erde sind kein Erdbeben gegeben hatte – so gewaltig war dieses Erdbeben.
  rationale: Die Revision bewahrt die Aufzählung und den feierlichen Nachdruck des griechischen Textes, benennt im Vergleichssatz ausdrücklich das Erdbeben und gibt die abschließende emphatische Wiederaufnahme ohne zusätzliche Doppelsteigerung wieder. Die Fußnotenverankerung bleibt unmittelbar bei „Laute“ erhalten.
