  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: de
  text: Siehe, ich komme wie ein Dieb. Selig ist, wer wach bleibt[a] und seine Gewänder bewahrt, damit er nicht nackt umhergeht und man seine Schande[b] sieht—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer wachsam ist“; wörtlich kann der Ausdruck auch „wer wacht“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Blöße“ beziehungsweise „seine schamvolle Entblößung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den nachdrücklichen Aufmerksamkeitsruf und den würdevollen apokalyptischen Ton; im modernen Bibeldeutsch ist „Siehe“ weiterhin verständlich.
- source_word: ἔρχομαι
  choice: ich komme
  rationale: Das Präsens wird unmittelbar und anschaulich wiedergegeben und kann wie im Griechischen bevorstehendes Kommen ausdrücken.
- source_word: ὡς κλέπτης
  choice: wie ein Dieb
  rationale: Gibt den Vergleich idiomatisch wieder und bezeichnet die unerwartete Art des Kommens, ohne eine moralische Gleichsetzung nahezulegen.
- source_word: μακάριος
  choice: Glücklich
  rationale: Gibt die Seligpreisungsformel in natürlichem, heutigem Deutsch wieder; gemeint ist ein von Gott begünstigter Zustand, nicht bloß ein momentanes Gefühl.
- source_word: ὁ γρηγορῶν
  choice: wer wach bleibt
  rationale: Bewahrt das konkrete Bild des Wachbleibens und zugleich dessen übertragene Bedeutung der Wachsamkeit.
- source_word: τηρῶν
  choice: bewahrt
  rationale: Deckt hier das Hüten, Festhalten und Behalten der Gewänder ab, ohne eine einzelne Nuance zu stark festzulegen.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: seine Gewänder
  rationale: „Gewänder“ wahrt den leicht gehobenen Ton und die mögliche symbolische Resonanz innerhalb der Offenbarung.
- source_word: ἵνα μὴ
  choice: damit er nicht
  rationale: Gibt die verneinte Zweck- beziehungsweise Vermeidungsaussage klar und natürlich wieder.
- source_word: γυμνὸς περιπατῇ
  choice: nackt umhergeht
  rationale: Erhält das konkrete und eindringliche Bild des griechischen Ausdrucks.
- source_word: βλέπωσιν
  choice: man ... sieht
  rationale: Das unpersönliche „man“ bewahrt den im Griechischen nicht näher bestimmten pluralischen Handlungsträger in natürlichem Deutsch.
- source_word: ἀσχημοσύνην αὐτοῦ
  choice: seine Blöße
  rationale: „Blöße“ bezeichnet sowohl die schamvolle Entblößung als auch die damit verbundene Schande und passt idiomatisch zum Kontext.
theological_decisions:
- issue: Bildhafte Bedeutung von Gewändern, Nacktheit und Blöße
  choice: Die konkreten Bilder bleiben im Haupttext ohne allegorische Ausdeutung stehen.
  alternative: Die Gewänder ausdrücklich als moralische Bereitschaft oder gerechte Taten und die Nacktheit als endzeitliche Schande deuten.
  rationale: Der Zusammenhang legt symbolische Resonanz nahe, doch der griechische Text erklärt die einzelnen Bilder nicht. Die Übersetzung bewahrt daher die theologische Spannung.
- issue: Generisches maskulines Einzelbild
  choice: Die singularische Konstruktion wird mit „wer“ und anschließendem „er/seine“ wiedergegeben.
  alternative: Pluralische oder vollständig geschlechtsneutrale Umformulierung.
  rationale: So bleiben Numerus und repräsentative Einzelform des griechischen maskulinen Partizips erkennbar, ohne den Kreis der Angesprochenen einzuschränken.
- issue: Wiedergabe der Seligpreisungsformel μακάριος
  choice: „Glücklich ist“
  alternative: „Selig ist“ oder „Gesegnet ist“
  rationale: „Glücklich ist“ ist in modernem Standarddeutsch verständlich und bezeichnet hier den begünstigten Zustand der wachsamen Person; „selig“ wirkt stärker kirchensprachlich, „gesegnet“ entspräche eher εὐλογητός.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptisch-feierlichem Ton. Das konkrete Bild und der Gedankenstrich am Versende bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
