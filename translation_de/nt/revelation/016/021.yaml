  rationale: Die Revision stellt das griechische Präsens ἐστίν wieder her und klärt durch die erneute Nennung des Hagels den Bezug des griechischen Pronomens, ohne den Inhalt zu erweitern. Die übrigen Formulierungen bleiben eng am Ausgangstext und im modernen Standarddeutsch idiomatisch.
