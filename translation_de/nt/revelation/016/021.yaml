id: REV.16.21
reference: Revelation 16:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: de
  text: Und großer Hagel, dessen Körner etwa ein Talent wiegen[a], fällt vom Himmel auf die Menschen herab; und die Menschen lästerten Gott wegen der Plage des Hagels, denn die Plage des Hagels ist überaus schwer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie ein Talent schwer“. Gemeint ist ungefähr das Gewicht eines Talents je Hagelkorn; der griechische Ausdruck bezeichnet einen Vergleich, keine genaue Messung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „denn die Plage des Hagels ist überaus groß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: gewaltiger Hagel
  rationale: Bewahrt den kollektiven Singular und vermittelt die außergewöhnliche Größe beziehungsweise Heftigkeit in natürlichem Deutsch.
- source_word: ὡς ταλαντιαία
  choice: dessen Körner etwa ein Talent wogen
  rationale: Macht verständlich, dass die Gewichtsangabe auf die einzelnen Hagelkörner zielt, und wahrt mit „etwa“ den Vergleichscharakter von ὡς.
- source_word: καταβαίνει
  choice: fällt ... herab
  rationale: Das anschauliche Präsens des griechischen Textes wird idiomatisch wiedergegeben; bei Hagel ist „herabfallen“ natürlicher als „herabkommen“.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: „Himmel“ bewahrt sowohl die räumliche als auch die apokalyptisch-theologische Bedeutung von οὐρανός.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: auf die Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein und nicht ausschließlich Männer.
- source_word: ἐβλασφήμησαν
  choice: lästerten
  rationale: „Gott lästern“ ist die direkte, gewichtige und im Deutschen idiomatische Wiedergabe des gegen Gott gerichteten βλασφημέω.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: wegen der Plage des Hagels
  rationale: ἐκ ist hier kausal; „Plage“ wahrt den in der Offenbarung wiederkehrenden Gerichtsausdruck πληγή.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: denn diese Plage war überaus schwer
  rationale: Gibt die Begründung und die starke Intensivierung μεγάλη ... σφόδρα in natürlichem Deutsch wieder. Das Demonstrativ „diese“ verweist eindeutig auf die Hagelplage.
theological_decisions:
- issue: Bedeutung von οὐρανός im apokalyptischen Gerichtskontext
  choice: vom Himmel
  alternative: vom Himmel her / aus dem Himmel
  rationale: Die Formulierung wahrt die atmosphärische Anschauung ebenso wie den in der Offenbarung mitschwingenden Ursprung des Gerichts von oben, ohne diesen näher auszudeuten.
- issue: Generische Bedeutung von ἄνθρωποι
  choice: die Menschen
  alternative: die Leute / die Menschheit
  rationale: Der Ausdruck meint Menschen allgemein. „Die Menschen“ ist präzise, geschlechtsübergreifend und stilistisch würdig.
- issue: Zeitform des abschließenden Begründungssatzes
  choice: war überaus schwer
  alternative: ist überaus schwer
  rationale: Das griechische Präsens kann als unmittelbare Begründung stehen. Im deutschen Erzählzusammenhang klingt das Präteritum natürlicher, ohne die Aussage über die Schwere der Plage abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher apokalyptischer Bildsprache. Das zweimalige „die Menschen“ bildet die Wiederholung des griechischen Textes ab; „Plage“ erhält die für die Gerichtsszenen der Offenbarung wichtige Wortverbindung.
