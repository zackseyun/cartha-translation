  naturalness: Die Fassung ist insgesamt würdiges, modernes Standarddeutsch. „Großer Hagel, dessen Körner etwa ein Talent wiegen“ ist natürlich und verdeutlicht ohne Bedeutungsverschiebung, dass die Gewichtsangabe die einzelnen Hagelkörner betrifft. Die Beibehaltung des Präsens in „ist überaus schwer“ ist auch im deutschen apokalyptischen Erzählstil gut möglich.
  terminology: „Himmel“, „Menschen“, „Gott lästerten“ und „Plage“ sind treffend und registergerecht. „Plage“ bewahrt die für die Offenbarung wichtige Terminologie von πληγή. „Überaus schwer“ gibt μεγάλη ... σφόδρα idiomatisch als extreme Schwere der Plage wieder.
