id: REV.16.9
reference: Revelation 16:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: de
  text: Und die Menschen wurden von großer Hitze versengt. Sie lästerten den Namen Gottes, der die Vollmacht über diese Plagen hat, und sie kehrten nicht um, um ihm Ehre zu geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: wurden … versengt
  rationale: Das Aoristpassiv von καυματίζω bezeichnet ein Versengt- oder Verbranntwerden durch Hitze. »Versengt« trifft die Wirkung stark, ohne eine vollständige Verbrennung auszudrücken.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein und nicht eigens Männer. »Die Menschen« gibt diesen umfassenden Bezug im Deutschen präzise wieder.
- source_word: καῦμα μέγα
  choice: von gewaltiger Hitze
  rationale: Die Wendung bezeichnet die große Stärke der Hitze. »Gewaltige Hitze« ist natürliches modernes Deutsch und bewahrt die Intensität von μέγα.
- source_word: ἐβλασφήμησαν
  choice: sie lästerten
  rationale: Im Bezug auf Gottes Namen bezeichnet βλασφημέω ehrverletzende, gotteslästerliche Rede. Das Verb »lästern« bewahrt diesen religiösen Sinn in natürlicher Form.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: den Namen Gottes
  rationale: Die formnahe Wiedergabe erhält die biblische Redeweise, in der Gottes Name für seine offenbarte Identität und Ehre steht.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: der Macht über diese Plagen hat
  rationale: Das präsentische Partizip ἔχοντος wird mit gegenwärtiger Geltung wiedergegeben. »Macht über« drückt die tatsächliche Verfügungsgewalt von ἐξουσία klar und idiomatisch aus.
- source_word: πληγὰς
  choice: Plagen
  rationale: πληγή bezeichnet in der Offenbarung wiederholt göttliche Gerichtsplagen. »Plagen« bewahrt zugleich den Zusammenhang mit den Plagen des Exodus.
- source_word: οὐ μετενόησαν
  choice: sie kehrten nicht um
  rationale: μετανοέω bezeichnet hier angesichts des Gerichts eine moralisch-geistliche Umkehr. »Umkehren« ist verständlich und gibt mehr als eine bloße Meinungsänderung wieder.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: um ihm Ehre zu geben
  rationale: Die Infinitivwendung beschreibt die aus der Umkehr hervorgehende beziehungsweise mit ihr beabsichtigte Ehrung Gottes. Die konkrete biblische Redeweise bleibt erhalten.
theological_decisions:
- issue: Umfang des maskulinen Plurals ἄνθρωποι
  choice: 'allgemeiner menschlicher Bezug: »die Menschen«'
  alternative: »die Männer«
  rationale: Der Zusammenhang handelt von Menschen unter dem Gericht und enthält keinen Hinweis auf eine Beschränkung auf männliche Personen.
- issue: Gottes Verhältnis zu den Plagen
  choice: Gott hat Macht über diese Plagen
  alternative: Gott ist lediglich mit diesen Plagen verbunden
  rationale: Der griechische Text schreibt Gott ausdrücklich ἐξουσία über die Plagen zu. Die Übersetzung erhält diese direkte Aussage, ohne sie abzuschwächen oder über den Wortlaut hinaus auszubauen.
- issue: Beziehung zwischen Umkehr und Gottesverehrung
  choice: »um ihm Ehre zu geben«
  alternative: »und gaben ihm keine Ehre«
  rationale: 'Der Infinitiv δοῦναι ist grammatisch von μετενόησαν abhängig. Die Übersetzung bewahrt daher die enge Verbindung: Sie kehrten nicht so um, dass sie Gott Ehre gaben.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste griechische Satzteil wird als eigener deutscher Satz gestaltet, um die lange Reihung verständlich zu gliedern, ohne die inhaltlichen Verknüpfungen zu verändern. »Gewaltig« bezeichnet hier die Intensität der Hitze; »Macht« ist für ein breites Publikum natürlicher als das abstraktere »Vollmacht«.
