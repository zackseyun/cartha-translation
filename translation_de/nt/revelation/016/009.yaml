revisions:
- from: Und die Menschen wurden von gewaltiger Hitze versengt. Sie lästerten den Namen Gottes, der Macht über diese Plagen hat, und sie kehrten nicht um, um ihm Ehre zu geben.
  to: Und die Menschen wurden von großer Hitze versengt. Sie lästerten den Namen Gottes, der die Vollmacht über diese Plagen hat, und sie kehrten nicht um, um ihm Ehre zu geben.
  rationale: 'Die Revision beschränkt sich auf zwei sichere lexikalische Präzisierungen: »großer Hitze« gibt καῦμα μέγα unmittelbar wieder, und »Vollmacht« bewahrt bei ἐξουσία den Autoritätsaspekt. Die Satzgliederung, die inklusive Referenz von ἄνθρωποι und die enge Verbindung von Umkehr und dem Geben von Ehre bleiben erhalten. Es sind keine Fußnotenanker erforderlich.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Sinn des griechischen Textes insgesamt zuverlässig wieder: ἄνθρωποι ist zutreffend inklusiv als »die Menschen« übersetzt, das Passiv ἐκαυματίσθησαν wird angemessen durch »wurden ... versengt« wiedergegeben, und die abschließende Infinitivkonstruktion bleibt in »um ihm Ehre zu geben« erhalten. Für καῦμα μέγα ist »großer Hitze« die unmittelbarere und nüchternere Entsprechung. Bei ἐξουσία sollte die Bedeutung von rechtmäßiger Autorität bzw. Vollmacht gegenüber bloßer Kraft deutlicher hervortreten.'
  naturalness: Der Text ist gut verständliches, würdiges modernes Standarddeutsch. »Von großer Hitze versengt« ist idiomatisch. »Die Vollmacht über diese Plagen hat« ist trotz leicht gehobenem Register natürlich und für den Offenbarungston passend.
  terminology: »Lästerten den Namen Gottes«, »Plagen«, »umkehren« und »Ehre geben« sind treffend und bibelsprachlich verständlich. »Vollmacht« bildet ἐξουσία präziser ab als »Macht«, da das griechische Wort hier Gottes Autorität über die Plagen bezeichnet.
  issues:
  - severity: low
    issue: »gewaltiger Hitze« für καῦμα μέγα
    rationale: Die Formulierung ist möglich, kann im Deutschen aber stärker bzw. dramatischer wirken als das einfache μέγα. »Großer Hitze« folgt dem Ausgangstext enger, ohne an Natürlichkeit zu verlieren.
  - severity: medium
    issue: »Macht über diese Plagen« für ἐξουσία
    rationale: »Macht« kann vor allem tatsächliche Stärke bezeichnen. ἐξουσία schließt besonders Autorität bzw. Verfügungsrecht ein; »Vollmacht« wahrt diesen Aspekt besser.
  revised_text: Und die Menschen wurden von großer Hitze versengt. Sie lästerten den Namen Gottes, der die Vollmacht über diese Plagen hat, und sie kehrten nicht um, um ihm Ehre zu geben.
