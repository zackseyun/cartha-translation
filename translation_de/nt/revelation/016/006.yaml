id: REV.16.6
reference: Revelation 16:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: de
  text: Denn sie haben das Blut von Heiligen und Propheten vergossen[a], und du hast ihnen Blut zu trinken gegeben. Sie haben es verdient.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ausgegossen«. Das kann zugleich an die Schalen erinnern, die im unmittelbaren Zusammenhang ausgegossen werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Sie sind würdig«, das heißt: Sie verdienen dieses Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die Aussage des Engels im vorherigen Vers ein und klingt im Deutschen in diesem feierlichen Zusammenhang natürlich.
- source_word: αἷμα
  choice: Blut
  rationale: Die wörtliche Wiederholung in beiden Satzhälften bewahrt den Gedanken der entsprechenden Vergeltung.
- source_word: ἁγίων
  choice: Heiligen
  rationale: Bezeichnet in der Offenbarung Gottes geheiligtes Volk, ohne damit eine später kirchlich kanonisierte Gruppe einzugrenzen.
- source_word: προφητῶν
  choice: Propheten
  rationale: Direkte und natürliche Wiedergabe der zusammen mit den Heiligen genannten Opfer.
- source_word: ἐξέχεαν
  choice: vergossen
  rationale: „Blut vergießen“ ist die natürliche deutsche Wendung; eine Fußnote hält die wörtliche Bedeutung „ausgießen“ und den möglichen Anklang an die ausgegossenen Schalen fest.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Gibt den Dativ als indirektes Objekt natürlich wieder und verweist auf die Täter.
- source_word: δέδωκας
  choice: hast ... gegeben
  rationale: Das deutsche Perfekt bildet die vollendete Handlung mit gegenwärtiger Relevanz angemessen ab.
- source_word: πιεῖν
  choice: zu trinken
  rationale: Direkte und idiomatische Wiedergabe des ergänzenden Infinitivs.
- source_word: ἄξιοί εἰσιν
  choice: Sie haben es verdient
  rationale: Gibt den kontextuellen Sinn des prädikativen ἄξιοι im heutigen Deutsch klar wieder; die Fußnote weist auf die formalere wörtliche Fassung hin.
theological_decisions:
- issue: Vergeltende Gerechtigkeit
  choice: Die schroffe Aussage, dass Gott ihnen Blut zu trinken gegeben hat und sie dies verdient haben, bleibt ungemildert erhalten.
  alternative: Du hast ihnen mit Blut zu trinken vergolten; sie verdienen diese Strafe.
  rationale: Der griechische Text stellt das Gericht als entsprechende Vergeltung dar. Die Übersetzung darf diese Härte weder abschwächen noch durch zusätzliche Deutung ausbauen.
- issue: Referent von ἁγίων
  choice: „Heilige“ bezeichnet allgemein Gottes geheiligtes Volk.
  alternative: die heiligen Menschen / die zu Gott Gehörenden
  rationale: „Heilige“ bewahrt den etablierten biblischen Sprachgebrauch, ohne eine spätere kirchliche Kategorie kanonisierter Personen vorauszusetzen.
- issue: Bedeutung von ἄξιοί εἰσιν
  choice: „Sie haben es verdient“ bezieht die Würdigkeit auf das unmittelbar genannte Gericht.
  alternative: „Sie sind es wert“ oder formal „Sie sind würdig“.
  rationale: Im Kontext bezeichnet ἄξιοι nicht moralische Vortrefflichkeit, sondern das Verdienen des Gerichts. Die idiomatische Form verhindert ein Missverständnis, während die formale Alternative in der Fußnote dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Blut vergießen“ ist idiomatisch; die Fußnote bewahrt das Bild des griechischen Verbs. Die abschließende Aussage wird verständlich formuliert, ohne die Härte des Gerichtswortes abzumildern.
