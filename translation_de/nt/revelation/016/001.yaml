id: REV.16.1
reference: Revelation 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: de
  text: 'Und ich hörte eine laute Stimme aus dem Heiligtum[a], die zu den sieben Engeln sagte: »Geht und gießt die sieben Schalen[b] des Zornes Gottes auf die Erde aus!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tempel«. Das griechische Wort bezeichnet häufig spezifischer das innere Heiligtum als die gesamte Tempelanlage.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet Schalen oder flache Gefäße, nicht die in älteren Übersetzungen teils genannten »Phiolen«.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: eine laute Stimme
  rationale: In Verbindung mit φωνή bezeichnet μέγας idiomatisch die Lautstärke. »Eine laute Stimme« ist im modernen Deutschen natürlich und sinngenau.
- source_word: ναοῦ
  choice: Heiligtum
  rationale: ναός bezeichnet häufig spezifischer das innere Heiligtum und nicht den gesamten Tempelbezirk. »Heiligtum« bewahrt diese Nuance in der himmlischen Szenerie der Offenbarung.
- source_word: λεγούσης
  choice: die ... sagte
  rationale: Das Partizip bezieht sich auf »Stimme«. Ein deutscher Relativsatz gibt die Konstruktion klar und natürlich wieder.
- source_word: Ὑπάγετε
  choice: Geht
  rationale: Der Imperativ fordert die Engel auf, sich auf den Weg zu machen und den folgenden Auftrag auszuführen.
- source_word: ἐκχέετε
  choice: gießt ... aus
  rationale: Die trennbare Verbform »ausgießen« erhält das Bild vom vollständigen Entleeren der Gefäße.
- source_word: φιάλας
  choice: Schalen
  rationale: φιάλη bezeichnet eine Schale beziehungsweise ein flaches Gefäß; »Schalen« ist sachlich genauer als traditionelle Wiedergaben wie »Schalenfläschchen« oder »Phiolen«.
- source_word: θυμοῦ
  choice: Zornes
  rationale: θυμός bezeichnet hier Gottes heftigen, gerichtlichen Zorn. »Zorn« wahrt das feierliche Gewicht, ohne eine zusätzliche Deutung einzutragen.
- source_word: εἰς τὴν γῆν
  choice: auf die Erde
  rationale: Bei ἐκχέω drückt εἰς die gerichtete Bewegung auf eine Fläche beziehungsweise in einen Wirkungsbereich aus. Der kosmische Kontext spricht für »Erde« statt »Land«.
theological_decisions:
- issue: Wiedergabe von ναός in der himmlischen Szene
  choice: Heiligtum
  alternative: Tempel
  rationale: »Heiligtum« bewahrt die mögliche Beschränkung auf den inneren heiligen Bereich; »Tempel« kann im Deutschen auch die gesamte Anlage bezeichnen.
- issue: Wiedergabe von θυμός τοῦ θεοῦ
  choice: des Zornes Gottes
  alternative: des Grimmes Gottes / des Zorns Gottes
  rationale: Die Formulierung bezeichnet Gottes gerichtliche Reaktion auf das Böse. »Zorn« gibt dies würdig und ohne zusätzliche konfessionelle Festlegung wieder; die Genitivform »Zornes« unterstützt hier den feierlichen Registerton.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die direkte Rede wird klar und kraftvoll formuliert; die Wortstellung »gießt ... aus« bleibt idiomatisch. Sämtliche Fußnotenmarker stehen im Haupttext.
