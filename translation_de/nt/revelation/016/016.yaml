id: REV.16.16
reference: Revelation 16:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: de
  text: Und er[a] versammelte sie an dem Ort, der auf Hebräisch[b] Harmagedon heißt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht das Verb im Singular: „er/es versammelte sie“. Wer damit gemeint ist, wird nicht ausdrücklich gesagt; im vorangehenden Zusammenhang ziehen die unreinen Geister aus, um die Könige zu versammeln (Verse 13–14).'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in der hebräischen/aramäischen Sprache“. In der Offenbarung bezeichnet „auf Hebräisch“ die semitische Namensform, ohne zwingend streng zwischen Hebräisch und Aramäisch zu unterscheiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: er versammelte
  rationale: Die griechische Verbform steht in der 3. Person Singular. Die Übersetzung bewahrt diesen Numerus, ohne den im Griechischen nicht ausdrücklich genannten Handelnden zu bestimmen.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Akkusativpronomen im Plural verweist im Zusammenhang auf die Könige beziehungsweise die zum Kampf Versammelten.
- source_word: εἰς τὸν τόπον
  choice: an dem Ort
  rationale: Bei einem Verb des Versammelns gibt „an dem Ort“ das Ziel im Deutschen natürlich wieder; τόπος bedeutet hier „Ort“.
- source_word: τὸν καλούμενον
  choice: der … heißt
  rationale: Der attributive Passivpartizipialausdruck wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: Ἑβραϊστὶ
  choice: auf Hebräisch
  rationale: Dies ist die übliche und textnahe Wiedergabe; im johanneischen Sprachgebrauch kann die Bezeichnung die semitische Sprachform einschließen, ohne Hebräisch und Aramäisch streng zu unterscheiden.
- source_word: Ἁρμαγεδών
  choice: Harmagedon
  rationale: Die im Deutschen gebräuchliche, an der griechischen Namensform orientierte Transkription bewahrt den Eigennamen.
theological_decisions:
- issue: Wer die Versammlung bewirkt
  choice: er versammelte sie
  alternative: sie versammelten sie; es versammelte sie
  rationale: Das Verb ist im griechischen Text eindeutig Singular, doch sein Subjekt wird nicht ausdrücklich genannt. Der vorherige Zusammenhang nennt die unreinen Geister als diejenigen, die zum Versammeln ausziehen (Verse 13–14). Die Übersetzung wahrt den Singular und erläutert die offene Bezugsmöglichkeit, statt den Handelnden dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und folgt der Struktur des griechischen Textes, während der Relativsatz idiomatisches Deutsch bietet.
