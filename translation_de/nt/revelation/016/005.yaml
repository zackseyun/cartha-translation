source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: de
  text: 'Und ich hörte den Engel der Gewässer sagen[a]: »Gerecht bist du, der du bist und der du warst, der Heilige, denn so hast du gerichtet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften bieten eine erweiterte Gottesbezeichnung, etwa: »der du bist und der du warst und der du kommst«. Wahrscheinlich wurde der Wortlaut an ähnliche Formeln an anderen Stellen der Offenbarung angeglichen. Der hier zugrunde gelegte Text lautet: »der du bist und der du warst, der Heilige«.'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: den Engel der Gewässer
  rationale: Die Genitivverbindung wird eng am Griechischen wiedergegeben. Sie kann einen Engel bezeichnen, der den Gewässern zugeordnet ist oder über sie gesetzt ist; »der Gewässer« bewahrt diese Offenheit.
- source_word: Δίκαιος
  choice: Gerecht
  rationale: δίκαιος bezeichnet hier Gottes moralische Gerechtigkeit, die sich in seinem Gericht erweist. »Gerecht« ist im Deutschen natürlich und umfasst sowohl Rechtschaffenheit als auch gerechtes Handeln.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: der du bist und der du warst
  rationale: Die substantivierte, formelhafte Gottesbezeichnung wird in direkter Anrede idiomatisch und zugleich eng am griechischen Wortlaut wiedergegeben.
- source_word: ὁ ὅσιος
  choice: der Heilige
  rationale: ὅσιος bezeichnet Heiligkeit beziehungsweise lautere, Gott entsprechende Treue. Im doxologischen Zusammenhang ist »der Heilige« die klarste und würdigste deutsche Titelform.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion begründet die Aussage über Gottes Gerechtigkeit. »Denn« gibt diesen kausalen Zusammenhang in gehobenem, natürlichem Deutsch wieder.
- source_word: ταῦτα
  choice: dies
  rationale: Das Demonstrativpronomen verweist auf die unmittelbar beschriebenen Vorgänge. »Dies« wahrt die knappe und unspezifische Form des griechischen Ausdrucks, ohne ausdrücklich »Gerichte« einzusetzen.
- source_word: ἔκρινας
  choice: du hast … gerichtet
  rationale: Das Perfekt gibt die abgeschlossene richterliche Handlung mit ihrer gegenwärtigen Bedeutung in der himmlischen Erklärung angemessen wieder.
theological_decisions:
- issue: Gottesbezeichnung ohne das erwartete zukünftige Glied
  choice: der du bist und der du warst, der Heilige
  alternative: der du bist und der du warst und der du kommst
  rationale: Der SBLGNT bietet ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος. Deshalb folgt der Haupttext dieser kürzeren Lesart und gleicht sie nicht an ähnliche Formeln in der Offenbarung an. Die abweichende, erweiterte Lesart wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die ungewöhnliche Gottesbezeichnung und die Mehrdeutigkeit der Genitivverbindung werden nicht stillschweigend harmonisiert oder präzisiert.
