id: REV.16.14
reference: Revelation 16:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: de
  text: Denn es sind Geister von Dämonen[a], die Zeichen tun. Sie ziehen zu den Königen der ganzen bewohnten Welt[b] aus, um sie zum Kampf am großen Tag Gottes, des Allmächtigen, zu versammeln –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dämonische Geister«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der ganzen Welt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: Geister von Dämonen
  rationale: Die genitivische Verbindung wird eng am Griechischen wiedergegeben und lässt offen, ob die Geister als dämonisch charakterisiert werden oder Dämonen zugeordnet sind.
- source_word: ποιοῦντα σημεῖα
  choice: die Zeichen tun
  rationale: Die in biblischer Sprache geläufige Wendung bewahrt den Begriff »Zeichen«, ohne Art oder Mechanismus der übernatürlichen Vorgänge näher festzulegen.
- source_word: ἃ ἐκπορεύεται
  choice: Sie ziehen … aus
  rationale: Das singularische Verb steht im griechischen Text auffällig bei einem pluralischen Bezugswort. Im Deutschen richtet sich der Numerus verständlich nach den Geistern; »ausziehen« erhält zudem die Bewegungsrichtung.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: zu den Königen
  rationale: ἐπί bezeichnet hier bei einem Bewegungsverb das Ziel; der Zweck des Sammelns bestätigt die Richtung zu den Königen.
- source_word: τῆς οἰκουμένης ὅλης
  choice: der ganzen bewohnten Welt
  rationale: οἰκουμένη bezeichnet genauer die bewohnte Welt beziehungsweise den menschlichen Weltkreis und wird nicht mit γῆ, »Erde«, gleichgesetzt.
- source_word: συναγαγεῖν
  choice: um sie … zu versammeln
  rationale: Die Infinitivkonstruktion drückt den Zweck des Ausziehens aus.
- source_word: εἰς τὸν πόλεμον
  choice: zum Kampf
  rationale: Die zielgerichtete Präposition εἰς wird natürlich mit »zum« wiedergegeben; »Kampf« bezeichnet hier den konkreten endzeitlichen Konflikt.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: am großen Tag
  rationale: Der Genitiv bezeichnet den Tag, an dem der Kampf stattfindet. Die deutsche temporale Formulierung ist natürlich und bewahrt die feierliche apokalyptische Aussage.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: Gottes, des Allmächtigen
  rationale: παντοκράτωρ wird als etablierter göttlicher Titel »der Allmächtige« wiedergegeben.
theological_decisions:
- issue: Art der von den Geistern gewirkten Zeichen
  choice: Die Vorgänge werden schlicht als »Zeichen« bezeichnet.
  alternative: Sie ausdrücklich als bloße Täuschungen oder als Wunder im selben Sinn wie göttliche Wunder zu kennzeichnen.
  rationale: Der Text schreibt die Zeichen Dämonengeistern zu, erklärt aber nicht ihren Mechanismus oder ontologischen Status; diese Spannung bleibt erhalten.
- issue: Verhältnis der Geister zu den Dämonen
  choice: Geister von Dämonen
  alternative: dämonische Geister
  rationale: Die formnahe Fassung bewahrt die mögliche genitivische Mehrdeutigkeit, statt sie ausschließlich als Eigenschaftsbezeichnung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich am Ende bleibt erhalten, da der Satz in Vers 15 beziehungsweise im weiteren Zusammenhang fortgeführt wird. Die Hauptsätze wurden für gute Verständlichkeit gegliedert, ohne die logischen Beziehungen zu verändern.
