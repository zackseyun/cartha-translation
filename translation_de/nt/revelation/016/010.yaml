- from: Und der fünfte goss seine Schale auf den Thron des Tieres. Da wurde sein Reich verfinstert, und die Menschen zerbissen sich vor Schmerz die Zungen.
  to: Und der fünfte goss seine Schale auf den Thron des Tieres; sein Reich wurde verfinstert, und sie zerbissen sich vor Schmerz die Zungen,
  rationale: 'Die Revision entfernt die nicht ausdrücklich im Griechischen genannte Ergänzung „die Menschen“ und stellt die satzübergreifende Reihung wieder her. Die übrigen Entscheidungen werden beibehalten: Das Tier bleibt sächlich, sein Reich ist dessen Herrschaftsbereich, und die Finsternis wird ohne interpretierende Erweiterung als Verfinsterung wiedergegeben.'
