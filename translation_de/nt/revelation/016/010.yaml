id: REV.16.10
reference: Revelation 16:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: de
  text: Und der fünfte goss seine Schale auf den Thron des Tieres; sein Reich wurde verfinstert, und sie zerbissen sich vor Schmerz die Zungen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: der fünfte
  rationale: Der griechische Text nennt nur die substantivierte Ordnungszahl. Dass ein Engel gemeint ist, ergibt sich aus dem Zusammenhang, wird aber nicht ergänzt.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: goss seine Schale
  rationale: „Ausgießen“ ist hier idiomatisch mit „goss“ wiedergegeben; φιάλη bezeichnet eine flache Schale, nicht ein modernes Fläschchen.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: auf den Thron des Tieres
  rationale: Die Formulierung bildet Präposition, Herrschaftssymbol und apokalyptisches Bild direkt und natürlich ab.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: sein Reich
  rationale: Im Deutschen richtet sich das Possessiv nach dem grammatisch sächlichen Bezugswort „Tier“ und lautet daher „sein“; βασιλεία bezeichnet hier dessen Herrschaftsbereich.
- source_word: ἐσκοτωμένη
  choice: verfinstert
  rationale: Das passive Partizip bezeichnet den eingetretenen Zustand der Verdunkelung; „wurde verfinstert“ bewahrt sowohl Vorgang als auch Ergebnis.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: die Menschen zerbissen sich die Zungen
  rationale: Der Imperfekt beschreibt fortdauerndes schmerzbedingtes Beißen. „Zerbissen sich“ gibt die heftige, wiederholte Handlung idiomatisch wieder; „die Menschen“ macht den im griechischen Verb enthaltenen pluralischen Handlungsträger verständlich.
- source_word: ἐκ τοῦ πόνου
  choice: vor Schmerz
  rationale: ἐκ bezeichnet hier Ursache beziehungsweise Auslöser; „vor Schmerz“ ist die natürliche deutsche Wendung.
theological_decisions:
- issue: Bezug des Reiches auf das Tier
  choice: sein Reich
  alternative: dessen Reich
  rationale: Das griechische αὐτοῦ verweist auf das Tier. Anders als im Englischen erzwingt das Deutsche hier keine Entscheidung zwischen sachlicher und personalisierender Pronominalform, da „sein“ zum Neutrum „Tier“ gehört.
- issue: Art der Finsternis
  choice: wurde verfinstert
  alternative: wurde in Finsternis gestürzt
  rationale: Die gewählte Formulierung bewahrt die passive Zustandsveränderung des griechischen Textes, ohne die Bildlichkeit durch „gestürzt“ zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reihungsstruktur des griechischen Textes bleibt erkennbar; der zweite Satz wird zur natürlichen deutschen Gliederung mit „Da“ eröffnet. Keine kontextuell erschlossene Ergänzung „Engel“.
