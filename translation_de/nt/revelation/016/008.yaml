review_pass:
  verdict: revise
  source_fidelity: Die Ergänzung „die Macht“ ist im griechischen Wortlaut nicht ausgedrückt. Zwar kann sie die Funktion von ἐδόθη in Verbindung mit dem Infinitiv erläutern, sie fügt jedoch einen Begriff hinzu, den der Text offenlässt. Zudem trifft „auf die Sonne“ ἐπὶ τὸν ἥλιον als Ziel des Ausgießens unmittelbarer als „über die Sonne“.
  naturalness: „Und es wurde ihr gegeben, die Menschen mit Feuer zu versengen“ ist verständliches, würdiges modernes Standarddeutsch und bewahrt zugleich die absichtlich unbenannte Gewährung. Der substantivierte Ausdruck „der Vierte“ ist im Kontext natürlich und angemessen knapp.
  terminology: „Schale“, „versengen“ und „die Menschen“ sind treffend. Das feminine Pronomen kann sich grammatisch auf „die Sonne“ beziehen; die Fußnote sollte diesen wahrscheinlichen, nicht ausdrücklich bezeichneten Bezug weiterhin kenntlich machen.
  issues:
  - severity: medium
    issue: „die Macht“ ergänzt einen im griechischen Text nicht vorhandenen Begriff.
    rationale: ἐδόθη αὐτῷ καυματίσαι bedeutet wörtlich, dass es ihr gegeben wurde, die Menschen zu versengen. Eine erteilte Befugnis ist naheliegend, aber „Macht“ ist nicht explizit und sollte nicht im Haupttext ergänzt werden.
  - severity: low
    issue: „über die Sonne“ ist für ἐπὶ τὸν ἥλιον weniger unmittelbar.
    rationale: Die Präposition mit Akkusativ bezeichnet das Ziel beziehungsweise den Gegenstand des Ausgießens. „Auf die Sonne“ bildet dies im Deutschen genauer ab, ohne die Bildsprache zu erklären.
  revised_text: Und der Vierte goss seine Schale auf die Sonne aus; und es wurde ihr gegeben, die Menschen mit Feuer zu versengen.[a]
