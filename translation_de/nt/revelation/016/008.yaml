source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: de
  text: Und der Vierte goss seine Schale auf die Sonne aus; und es wurde ihr gegeben, die Menschen mit Feuer zu versengen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Und ihr wurde gegeben, die Menschen im Feuer zu versengen.“ Das Pronomen bezieht sich wahrscheinlich auf die Sonne.'
    reason: Die Fußnote weist auf die mögliche wörtlichere Wiedergabe von ἐν πυρί hin und kennzeichnet den wahrscheinlichen, aber im Satz nicht ausdrücklich benannten Bezug von αὐτῷ.
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: der Vierte
  rationale: Der substantivierte Ordnungszahl-Ausdruck bleibt wie im Griechischen knapp; dass der vierte Engel gemeint ist, ergibt sich aus dem Zusammenhang, wird hier aber nicht ausdrücklich ergänzt.
- source_word: ἐξέχεεν
  choice: goss … aus
  rationale: Die übliche und natürliche deutsche Wiedergabe von ἐκχέω im Zusammenhang der Schalengerichte.
- source_word: φιάλην
  choice: Schale
  rationale: Bezeichnet ein flaches Gefäß und entspricht der etablierten, heute verständlichen Bildsprache der Schalengerichte.
- source_word: ἐπὶ τὸν ἥλιον
  choice: über die Sonne
  rationale: ἐπί mit Akkusativ bezeichnet hier das Ziel des Ausgießens; „über die Sonne ausgießen“ ist im Deutschen idiomatisch.
- source_word: ἐδόθη αὐτῷ
  choice: ihr wurde die Macht gegeben
  rationale: Das Passiv bewahrt die unausgesprochene göttliche Urheberschaft. Das Pronomen wird auf die Sonne bezogen; „die Macht“ macht die im Deutschen sonst schwer verständliche Konstruktion idiomatisch, ohne den Geber zu benennen.
- source_word: καυματίσαι
  choice: zu versengen
  rationale: καυματίζω bezeichnet das Schädigen durch starke Hitze; „versengen“ gibt dies präzise und bildkräftig wieder.
- source_word: τοὺς ἀνθρώπους
  choice: die Menschen
  rationale: Der Ausdruck bezeichnet Menschen allgemein und ist nicht auf Männer beschränkt.
- source_word: ἐν πυρί
  choice: mit Feuer
  rationale: Die Präpositionalphrase beschreibt Mittel oder Art des Versengens; „mit Feuer“ ist natürliches Deutsch und bewahrt das Feuerbild.
theological_decisions:
- issue: Unausgesprochene göttliche Urheberschaft in ἐδόθη
  choice: Das Passiv „ihr wurde … gegeben“ bleibt erhalten, ohne Gott ausdrücklich als Handelnden zu nennen.
  alternative: Gott gab ihr die Macht; sie erhielt die Erlaubnis
  rationale: Die in der Offenbarung häufige Passivform deutet gewährte Vollmacht an, lässt den Geber im Wortlaut jedoch ungenannt.
- issue: Bezug von αὐτῷ
  choice: Das Pronomen wird auf die Sonne bezogen.
  alternative: Bezug auf den vierten Engel oder auf einen unbestimmten Handelnden
  rationale: Die Sonne ist der nächstliegende grammatische Bezugspunkt, und das Versengen der Menschen passt sachlich zu ihr. Da der Bezug nicht völlig unangreifbar ist, wird er in der Fußnote als wahrscheinlich gekennzeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Bezeichnung „der Vierte“ bewahrt die Ausdrucksweise des Ausgangstextes. Die Hauptfassung ist idiomatisch, während die Fußnote die ungewöhnlichere griechische Konstruktion und ihre Auslegungsfrage sichtbar hält.
