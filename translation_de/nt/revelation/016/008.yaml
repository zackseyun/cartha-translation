revisions:
- from: Und der Vierte goss seine Schale über die Sonne aus. Ihr wurde die Macht gegeben, die Menschen mit Feuer zu versengen.[a]
  to: Und der Vierte goss seine Schale auf die Sonne aus; und es wurde ihr gegeben, die Menschen mit Feuer zu versengen.[a]
  rationale: Die Fassung entfernt die nicht ausdrücklich im Ausgangstext enthaltene Ergänzung „die Macht“ und gibt das Ziel von ἐπί mit „auf die Sonne“ wieder. Das unpersönliche Passiv bleibt erhalten, benennt den Geber nicht und bewahrt damit die griechische Offenheit. Die Fußnote dokumentiert sowohl die präpositionalen Nuance als auch den wahrscheinlichen Bezug des Pronomens.
