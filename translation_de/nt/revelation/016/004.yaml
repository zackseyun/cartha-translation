id: REV.16.4
reference: Revelation 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: de
  text: Und der dritte goss seine Schale in die Flüsse und die Wasserquellen aus, und das Wasser wurde zu Blut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ergebnissatz hat ein Verb im Singular und nennt das Subjekt nicht ausdrücklich. Gemeint ist im Zusammenhang das Wasser der Flüsse und Quellen als Ganzes.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ὁ τρίτος
  choice: der dritte
  rationale: Der griechische Text nennt nur die substantivierte Ordnungszahl; der Engel ist aus dem unmittelbaren Zusammenhang erschließbar und wird nicht ausdrücklich ergänzt.
- source_word: ἐξέχεεν
  choice: goss … aus
  rationale: Das trennbare Verb „ausgießen“ gibt die übliche Bedeutung von ἐκχέω in dieser Schalenfolge natürlich und sachnah wieder.
- source_word: φιάλην
  choice: Schale
  rationale: φιάλη bezeichnet ein schalenartiges, flaches Gefäß; „Schale“ ist im heutigen Deutsch genauer und verständlicher als das traditionelle „Zornesschale“ oder „Phiole“, wobei „Zorn“ hier nicht im Substantiv selbst steht.
- source_word: εἰς τοὺς ποταμοὺς
  choice: in die Flüsse
  rationale: εἰς mit Akkusativ bezeichnet hier die Richtung des Ausgießens; „in die Flüsse“ ist die naheliegende deutsche Entsprechung.
- source_word: τὰς πηγὰς τῶν ὑδάτων
  choice: die Wasserquellen
  rationale: „Wasserquellen“ gibt die Genitivverbindung knapp und idiomatisch wieder, ohne die altertümliche Formulierung „Quellen der Wasser“.
- source_word: ἐγένετο αἷμα
  choice: es wurde Blut
  rationale: Die unpersönlich wirkende deutsche Formulierung bewahrt den Singular des griechischen Verbs und den klaren Verwandlungssinn von γίνομαι, ohne einen ausdrücklich genannten Plural als Subjekt einzuführen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐγένετο
  choice: „es wurde Blut“; das Wasser der Flüsse und Quellen wird kollektiv als betroffen verstanden
  alternative: „sie wurden zu Blut“, mit Flüssen und Quellen als ausdrücklich pluralischem Subjekt
  rationale: Der griechische Ergebnissatz steht im Singular und lässt das Subjekt unausgesprochen. Die gewählte Fassung wahrt diese grammatische Offenheit, während der Zusammenhang deutlich macht, dass das Wasser von dem Gericht betroffen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ellipse „der dritte“ bleibt wie im Griechischen erhalten; „Engel“ und „Zorn“ werden nicht erläuternd in den Haupttext eingefügt.
