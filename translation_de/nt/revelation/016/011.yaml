- from: Und sie lästerten[a] den Gott des Himmels wegen ihrer Schmerzen und ihrer Geschwüre[b], und sie wandten sich nicht von ihren Taten ab.[c]
  to: Und sie lästerten[a] den Gott des Himmels wegen ihrer Schmerzen und ihrer Geschwüre[b], und sie kehrten nicht von ihren Taten um.[c]
  rationale: Die Revision ersetzt allein die zu verhaltensorientierte Umschreibung von μετενόησαν durch „kehrten ... um“. Damit bleibt die religiös-ethische Bedeutung des griechischen Verbs erhalten, während „von ihren Taten“ die durch ἐκ ausgedrückte Abkehr wiedergibt. Die übrigen Formulierungen sind quellennah, natürlich und registergerecht.
