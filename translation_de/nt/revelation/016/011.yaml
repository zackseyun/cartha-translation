  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: de
  text: Und sie lästerten[a] den Gott des Himmels wegen ihrer Schmerzen und ihrer Geschwüre[b], und sie kehrten nicht von ihren Taten um.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schmähten“ beziehungsweise „redeten lästerlich über“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „offenen Wunden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sie wandten sich nicht von ihren Taten ab“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: lästerten
  rationale: Das Verb bezeichnet hier ehrverletzendes, frevelhaftes Reden gegen Gott. „Lästerten“ bewahrt sowohl den sprachlichen Vorgang als auch den ausdrücklich gegen Gott gerichteten religiösen Gehalt.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: den Gott des Himmels
  rationale: Die Wendung gibt den Genitiv direkt wieder und bewahrt den feierlichen biblischen Titel.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: wegen ihrer Schmerzen
  rationale: ἐκ hat im Zusammenhang kausale Bedeutung. πόνοι bezeichnet hier starke Schmerzen beziehungsweise Qualen, nicht Arbeit oder Mühe.
- source_word: ἑλκῶν
  choice: Geschwüre
  rationale: ἕλκος bezeichnet ein Geschwür, eine offene Wunde oder ein Hautleiden. „Geschwüre“ ist im Plagenkontext präzise und allgemein verständlich.
- source_word: μετενόησαν
  choice: wandten sich … ab
  rationale: μετανοέω bezeichnet in der Offenbarung eine moralisch-religiöse Umkehr. Zusammen mit ἐκ τῶν ἔργων gibt „sich von ihren Taten abwenden“ sowohl die Umkehr als auch die Trennung vom bisherigen Handeln natürlich wieder.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: von ihren Taten
  rationale: ἐκ bezeichnet hier die Abkehr vom bisherigen Tun. „Taten“ ist im modernen Deutsch natürlicher und weniger missverständlich als „Werke“.
theological_decisions:
- issue: Bedeutung der wiederholten ἐκ-Verbindungen
  choice: Die Menschen lästern Gott wegen ihrer Schmerzen und Geschwüre und wenden sich nicht von ihren Taten ab.
  alternative: Die ersten beiden Verbindungen räumlich mit „aus ihren Schmerzen und Geschwüren heraus“ und die letzte wörtlicher mit „taten nicht Buße von ihren Werken“ wiederzugeben.
  rationale: Bei den Leiden ist ἐκ im Kontext kausal; bei μετανοέω bezeichnet es die Abkehr vom bisherigen Handeln. So bleibt die Spannung erhalten, dass das Gericht nicht zur Umkehr, sondern zur Lästerung führt, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Wiederholung von „und“. Der Satz folgt der apokalyptischen Schlichtheit des Griechischen; die idiomatische Wendung „sich von ihren Taten abwenden“ bildet die Umkehrbewegung von μετανοέω mit ἐκ ab.
