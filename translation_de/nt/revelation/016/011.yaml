  source_fidelity: Die ersten Satzteile geben ἐβλασφήμησαν, den Titel „den Gott des Himmels“ sowie die kausale Funktion von ἐκ bei Schmerzen und Geschwüren zutreffend wieder. „Sie wandten sich nicht von ihren Taten ab“ trifft die mit μετανοέω und ἐκ gemeinte Abkehr im Ergebnis, lässt aber die ausdrückliche Umkehr-/Bußdimension von μετανοέω zu stark in einer bloßen Verhaltensbeschreibung aufgehen.
  naturalness: „Lästerten den Gott des Himmels wegen ihrer Schmerzen und ihrer Geschwüre“ ist würdiges, verständliches modernes Standarddeutsch. „Sie kehrten nicht von ihren Taten um“ ist leicht bibelsprachlich, im apokalyptischen Register jedoch idiomatisch und präziser als die vorliegende Umschreibung.
  terminology: „Lästerten“, „Gott des Himmels“, „Schmerzen“ und „Geschwüre“ sind angemessen. Für μετανοέω ist „umkehren“ hier als zentrale religiös-ethische Terminologie vorzuziehen; es wahrt zugleich die durch ἐκ angezeigte Abkehr von den Taten.
