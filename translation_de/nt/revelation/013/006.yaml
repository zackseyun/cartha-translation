id: REV.13.6
reference: Revelation 13:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: de
  text: Und es öffnete sein Maul zu Lästerungen gegen Gott, um seinen Namen und seine Wohnung zu lästern, die im Himmel Wohnenden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die im Himmel wohnen“, wenn die Schlussphrase als drittes Objekt von „lästern“ und nicht als Erläuterung zu „seine Wohnung“ verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: „Wohnung“ kann auch mit „Zelt“ oder „Stiftshütte“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: es öffnete sein Maul
  rationale: Die Wendung wird anschaulich und nah am griechischen Wortlaut wiedergegeben. „Maul“ passt im Deutschen zum Tier als Bezugspunkt, ohne den Vorgang abzuschwächen.
- source_word: εἰς βλασφημίας
  choice: zu Lästerungen
  rationale: Die pluralische Form bleibt erhalten und bezeichnet vielfältige oder wiederholte lästernde Äußerungen.
- source_word: πρὸς τὸν θεόν
  choice: gegen Gott
  rationale: Im Zusammenhang feindseliger Rede hat πρός adversative Bedeutung.
- source_word: βλασφημῆσαι
  choice: um … zu lästern
  rationale: Die Infinitivkonstruktion wird als Zweckangabe natürlich und transparent wiedergegeben.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: seinen Namen
  rationale: „Name“ bewahrt die biblische Bedeutung von Gottes offenbarter Identität und Ehre.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: seine Wohnung
  rationale: σκηνή kann Zelt, Stiftshütte oder Wohnstätte bedeuten. „Wohnung“ ist hier verständlich und erhält den Gedanken von Gottes himmlischer Wohnstätte, ohne zwingend kultische Bezüge einzutragen.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: die im Himmel Wohnenden
  rationale: Das substantivierte Partizip wird knapp wiedergegeben; „Wohnenden“ erhält zugleich die sprachliche Verbindung zu σκηνή.
theological_decisions:
- issue: Verhältnis zwischen „seine Wohnung“ und „die im Himmel Wohnenden“
  choice: Die Schlussphrase steht unverbunden als mögliche Apposition zu „seine Wohnung“.
  alternative: 'Sie kann als drittes Objekt von „lästern“ verstanden werden: „und die im Himmel wohnen“.'
  rationale: Der griechische Akkusativ erlaubt sowohl eine erläuternde Apposition als auch eine koordinierte Objektfolge. Der Haupttext bildet die Apposition ohne den erklärenden Zusatz „das heißt“ ab; die alternative syntaktische Zuordnung wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche appositionelle Fügung bleibt erhalten, um die syntaktische Mehrdeutigkeit des griechischen Textes nicht vorschnell aufzulösen.
