- from: Dann sah ich ein anderes Tier aus der Erde[a] heraufsteigen. Es hatte zwei Hörner wie ein Lamm, redete aber wie ein Drache.
  to: Und ich sah ein anderes Tier aus der Erde[a] heraufsteigen. Es hatte zwei Hörner wie die eines Lammes und redete wie ein Drache.
  rationale: Die Revision entfernt die nicht im griechischen καί enthaltenen Zusätze „Dann“ und „aber“ und bewahrt damit die offene, parataktische Erzählweise. Zugleich verdeutlicht sie mit „wie die eines Lammes“, dass der Vergleich die Hörner betrifft. Die lexikalische Mehrdeutigkeit von γῆ bleibt durch die Fußnote erhalten.
