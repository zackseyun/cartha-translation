id: REV.13.11
reference: Revelation 13:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: de
  text: Und ich sah ein anderes Tier aus der Erde[a] heraufsteigen. Es hatte zwei Hörner wie die eines Lammes und redete wie ein Drache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Land“. Das griechische Wort γῆ kann „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: ein anderes Tier
  rationale: „Tier“ bewahrt den in der Offenbarung etablierten apokalyptischen Ausdruck und seine symbolische sowie intertextuelle Kraft; „anderes“ gibt ἄλλο direkt wieder.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: aus der Erde heraufsteigen
  rationale: Das Präsenspartizip schildert das Tier beim Hervorkommen. „heraufsteigen“ gibt die gerichtete Bewegung anschaulich wieder. γῆ kann „Erde“ oder „Land“ bedeuten; „Erde“ passt zum kosmischen Gegensatz zum Meerestier, ohne die Alternative auszuschließen.
- source_word: εἶχεν
  choice: Es hatte
  rationale: Das Imperfekt hat hier beschreibende Funktion und wird im natürlichen Deutschen angemessen mit dem Präteritum wiedergegeben.
- source_word: κέρατα δύο
  choice: zwei Hörner
  rationale: Die direkte Wiedergabe erhält die apokalyptische Symbolik von Macht und Autorität.
- source_word: ὅμοια ἀρνίῳ
  choice: wie ein Lamm
  rationale: Die knappe Vergleichsform ist im Deutschen natürlich und bewahrt zugleich die mögliche Anspielung auf das Lamm in der Offenbarung. Eine Wiedergabe als „Lämmchen“ würde eine im Kontext irreführende Verniedlichung nahelegen.
- source_word: ἐλάλει
  choice: redete
  rationale: Das Imperfekt beschreibt die charakteristische oder andauernde Sprechweise. Im Deutschen vermittelt „redete“ diesen narrativ-beschreibenden Sinn natürlich.
- source_word: ὡς δράκων
  choice: wie ein Drache
  rationale: „wie“ wahrt den Vergleich und behauptet keine Identität des Tieres mit dem Drachen.
theological_decisions:
- issue: Wiedergabe von ἀρνίον angesichts der möglichen Anspielung auf das Lamm der Offenbarung
  choice: Lamm
  alternative: Lämmchen
  rationale: „Lamm“ erhält die wahrscheinliche Anspielung, ohne das Tier mit dem wahren Lamm gleichzusetzen. „Lämmchen“ klänge im modernen Deutschen unnötig verniedlichend.
- issue: Wiedergabe von γῆ
  choice: Erde
  alternative: Land
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Erde“ bewahrt hier am besten den umfassenden apokalyptischen Kontrast zum Tier aus dem Meer; die Fußnote hält die echte Mehrdeutigkeit offen.
- issue: Verhältnis zwischen lammähnlichem Aussehen und drachenähnlichem Reden
  choice: redete aber wie ein Drache
  alternative: und redete wie ein Drache
  rationale: Das griechische καί verbindet formal die Satzglieder, doch der inhaltliche Gegensatz zwischen äußerer Lammähnlichkeit und drachenähnlicher Rede ist deutlich. „aber“ macht diesen im Deutschen natürlich erkennbar, ohne die Identität des Tieres über den Text hinaus festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Bildsprache bleibt knapp und markant; unnötige Fachsprache und konfessionelle Deutungszusätze werden vermieden.
