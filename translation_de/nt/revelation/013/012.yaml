id: REV.13.12
reference: Revelation 13:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: de
  text: Und es übt die ganze Vollmacht des ersten Tieres vor dessen Augen aus.[a] Es bringt die Erde und die Menschen, die auf ihr wohnen, dazu, das erste Tier anzubeten, dessen tödliche Wunde geheilt wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dessen Gegenwart“. Die Wendung kann betonen, dass das zweite Tier unter den Augen des ersten Tieres oder unmittelbar vor ihm handelt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dessen Wunde des Todes geheilt wurde“, also eine tödliche Wunde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: „Vollmacht“ bezeichnet hier ausgeübte bzw. übertragene Autorität und nicht lediglich rohe Kraft.
- source_word: πᾶσαν
  choice: die ganze
  rationale: Die Formulierung betont den vollständigen Umfang der Vollmacht des ersten Tieres.
- source_word: ποιεῖ (erstes Vorkommen)
  choice: übt … aus
  rationale: Die Verbindung ποιεῖ τὴν ἐξουσίαν wird im Deutschen idiomatisch mit „Vollmacht ausüben“ wiedergegeben.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor dessen Augen
  rationale: Die Wendung bewahrt sowohl die räumliche Bedeutung „vor ihm“ als auch den Gedanken des Handelns in seiner Gegenwart bzw. unter seinem Blick.
- source_word: ποιεῖ (zweites Vorkommen)
  choice: bringt … dazu
  rationale: Mit den Objekten und dem folgenden ἵνα-Satz hat ποιεῖ kausative Bedeutung; die Wiedergabe behauptet nicht ausdrücklich einen stärkeren Zwang, als der griechische Wortlaut verlangt.
- source_word: τὴν γῆν
  choice: die Erde
  rationale: In der Offenbarung bezeichnet γῆ in diesem Zusammenhang die Erde bzw. Welt im Gegensatz zu anderen kosmischen Bereichen.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: die Menschen, die auf ihr wohnen
  rationale: Diese natürliche deutsche Form bewahrt das in der Offenbarung wiederkehrende Motiv der auf der Erde Wohnenden.
- source_word: ἵνα προσκυνήσουσιν
  choice: dazu, … anzubeten
  rationale: Nach dem kausativen ποιεῖ gibt der Infinitiv im Deutschen die beabsichtigte oder bewirkte Handlung flüssig wieder.
- source_word: θηρίον
  choice: Tier
  rationale: „Tier“ ist die direkte und im deutschen Bibelsprachgebrauch etablierte Wiedergabe von θηρίον in diesem apokalyptischen Zusammenhang.
- source_word: πρῶτον
  choice: erste
  rationale: Das Adjektiv unterscheidet dieses Tier von dem zweiten Tier im unmittelbaren Kontext.
- source_word: ἐθεραπεύθη
  choice: geheilt worden war
  rationale: Die passive Form bedeutet „wurde geheilt“; das Plusquamperfekt macht im Deutschen deutlich, dass die Heilung der hier beschriebenen Anbetung vorausliegt.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: dessen tödliche Wunde
  rationale: Die Genitivverbindung bezeichnet eine vom Tod gekennzeichnete bzw. zum Tod führende Wunde; „tödliche Wunde“ ist natürlich und hält die Bildsprache fest.
theological_decisions:
- issue: Art der Einwirkung des zweiten Tieres auf die Bewohner der Erde
  choice: bringt … dazu, … anzubeten
  alternative: zwingt … anzubeten
  rationale: Die kausative Konstruktion besagt, dass das zweite Tier die Anbetung bewirkt, legt in diesem Vers aber den genauen Grad des Zwangs nicht ausdrücklich fest.
- issue: Verhältnis des zweiten Tieres zum ersten Tier
  choice: vor dessen Augen
  alternative: in dessen Gegenwart
  rationale: Der Wortlaut lässt sowohl räumliche Gegenwart als auch Handeln unter dem Blick des ersten Tieres anklingen, ohne das genaue Verhältnis weiter zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Text, wird aber idiomatisch gegliedert. „Vollmacht“ bewahrt den Autoritätsaspekt, während „bringt … dazu“ die kausative Aussage ohne unnötige Verstärkung wiedergibt.
