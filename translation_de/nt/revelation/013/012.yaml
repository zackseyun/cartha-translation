  - severity: low
    issue: Redundante Apposition im zweiten Satz
    rationale: „das erste Tier anzubeten – das Tier, dessen …“ wiederholt „Tier“ unnötig. Die Relativkonstruktion kann direkt an „das erste Tier“ anschließen und bildet οὗ klarer ab.
