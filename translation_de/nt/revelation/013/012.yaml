revisions:
- from: Und es übt die ganze Vollmacht des ersten Tieres vor dessen Augen aus.[a] Es bringt die Erde und die Menschen, die auf ihr wohnen, dazu, das erste Tier anzubeten – das Tier, dessen tödliche Wunde geheilt worden war.[b]
  to: Und es übt die ganze Vollmacht des ersten Tieres vor dessen Augen aus.[a] Es bringt die Erde und die Menschen, die auf ihr wohnen, dazu, das erste Tier anzubeten, dessen tödliche Wunde geheilt wurde.[b]
  rationale: 'Die Revision beschränkt sich auf zwei sichere Anpassungen: Der Aorist Passiv wird mit „geheilt wurde“ wiedergegeben, und die Relativbestimmung wird ohne die stilistisch redundante Apposition direkt an „das erste Tier“ angeschlossen. Aussagegehalt, Ambiguität von ἐνώπιον und die nicht näher bestimmte kausative Kraft von ποιεῖ bleiben erhalten; die Fußnotenanker bleiben korrekt gesetzt.'
  reviewer_model: gpt-5.6-terra
