revisions:
- from: Wenn jemand für die Gefangenschaft bestimmt ist, geht er in die Gefangenschaft.[a] Wenn jemand mit dem Schwert getötet werden soll, muss er mit dem Schwert getötet werden.[b] Hier sind das standhafte Ausharren und der Glaube[c] der Heiligen gefragt.
  to: Wenn jemand für die Gefangenschaft bestimmt ist, geht er in die Gefangenschaft.[a] Wenn jemand mit dem Schwert getötet werden soll, muss er mit dem Schwert getötet werden.[b] Hier ist das standhafte Ausharren und der Glaube[c] der Heiligen.
  rationale: Die Revision beschränkt sich auf den Schlusssatz. Sie entfernt die interpretierende Ergänzung „gefragt“ und gibt die demonstrative Formel ὧδέ ἐστιν unmittelbar wieder. Alle Wiederholungen, die passive Bestimmtheit der vorherigen Klauseln, die sachlichen Fußnotenanker sowie die im Deutschen natürliche, würdige Sprache bleiben erhalten.
