id: REV.13.10
reference: Revelation 13:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: de
  text: Wenn jemand für die Gefangenschaft bestimmt ist, geht er in die Gefangenschaft.[a] Wenn jemand mit dem Schwert getötet werden soll, muss er mit dem Schwert getötet werden.[b] Hier ist das standhafte Ausharren und der Glaube[c] der Heiligen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn jemand in Gefangenschaft geht, geht er in Gefangenschaft.“ Die knappe Formulierung kann als Aussage über ein feststehendes Geschick verstanden werden, nicht als Befehl.'
    reason: alternative_reading
  - marker: b
    text: 'Einige Handschriften beziehungsweise Textformen lesen sinngemäß: „Wenn jemand mit dem Schwert tötet, muss er mit dem Schwert getötet werden.“ Der Haupttext folgt der hier zugrunde gelegten Lesart; die Variante ist für die Auslegung bedeutsam.'
    reason: textual_variant
  - marker: c
    text: 'Oder: „die Treue“ beziehungsweise „die Glaubenstreue“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: Wenn jemand
  rationale: Die offene, allgemein formulierte Bedingung wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: für die Gefangenschaft bestimmt ist ... geht er in die Gefangenschaft
  rationale: Die Ergänzung „bestimmt ist“ macht die elliptische griechische Wendung verständlich, während die Wiederholung von „Gefangenschaft“ und das ausdrückliche „geht“ die feierlich-spruchhafte Form bewahren.
- source_word: αἰχμαλωσία
  choice: Gefangenschaft
  rationale: „Gefangenschaft“ bezeichnet hier passend das Schicksal, gefangen weggeführt zu werden, und bewahrt den Gerichtston des Verses.
- source_word: ἐν μαχαίρῃ
  choice: mit dem Schwert
  rationale: Die instrumentale Wendung wird idiomatisch wiedergegeben und behält zugleich die biblische Gerichtssprache bei.
- source_word: ἀποκτανθῆναι
  choice: getötet werden
  rationale: Die passive Bedeutung des Aoristinfinitivs wird klar und in gegenwärtigem Deutsch ausgedrückt.
- source_word: αὐτὸν ... ἀποκτανθῆναι
  choice: muss er ... getötet werden
  rationale: Die im Deutschen sonst schwer verständliche Infinitivkonstruktion wird als Aussage unausweichlicher Bestimmung formuliert, ohne sie zu einem Vergeltungsgebot umzudeuten.
- source_word: ὧδέ ἐστιν
  choice: Hier sind ... gefragt
  rationale: Diese idiomatische deutsche Wendung lenkt wie das Griechische die Aufmerksamkeit auf die Haltung, die in der geschilderten Lage erforderlich ist.
- source_word: ὑπομονή
  choice: standhaftes Ausharren
  rationale: Die Formulierung bezeichnet beharrliches Durchhalten unter Bedrängnis deutlicher als das möglicherweise sportlich klingende „Ausdauer“.
- source_word: πίστις
  choice: Glaube
  rationale: „Glaube“ wahrt die übliche und semantisch offene Wiedergabe; die im Zusammenhang ebenfalls mögliche Bedeutung „Treue“ wird in einer Fußnote genannt.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: Die knappe, in der Offenbarung geläufige Bezeichnung für Gottes heiliges Volk bleibt erhalten.
theological_decisions:
- issue: 'Sinn der ersten beiden Satzglieder: feststehendes Geschick oder Handlungsgebot'
  choice: Aussage über ein feststehendes beziehungsweise zugemessenes Geschick
  alternative: Gebot, Gewalt nicht zu widerstehen, oder Vergeltungsgrundsatz gegen Gefangennehmer und Schwerttäter
  rationale: Der zugrunde gelegte griechische Text ist knapp und schwierig, lässt sich aber am ehesten als spruchhafte Aussage über das bevorstehende Geschick lesen. Die Übersetzung macht daraus weder ausdrücklich ein Gebot des Gewaltverzichts noch ein Vergeltungsprinzip.
- issue: Bedeutung von πίστις im Schlusssatz
  choice: Glaube
  alternative: Treue beziehungsweise Glaubenstreue
  rationale: „Glaube“ hält den Bedeutungsraum offen; weil im Kontext des Ausharrens auch beständige Treue gemeint sein kann, wird diese Möglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die spruchhafte Wiederholung bleibt erhalten; notwendige Ergänzungen machen die elliptischen griechischen Sätze verständlich. „Standhaftes Ausharren“ vermeidet sowohl altertümliche Sprache als auch den zu alltäglichen oder sportlichen Klang von „Ausdauer“.
