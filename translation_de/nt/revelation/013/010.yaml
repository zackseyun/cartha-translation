    issue: Zusatz „gefragt“ im Schlusssatz
    rationale: ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων bedeutet wörtlich und funktional „Hier ist das Ausharren und der Glaube der Heiligen“. „... sind gefragt“ deutet die Formel als ausdrückliche Forderung aus und fügt damit eine Nuance hinzu, die der griechische Wortlaut nicht aussagt. Die knappe Formel sollte ohne diesen Zusatz wiedergegeben werden.
