review_pass:
  verdict: revise
  source_fidelity: Die beiden spruchhaften, wiederholenden Aussagen über Gefangenschaft und Tötung mit dem Schwert geben den zugrunde gelegten SBLGNT-Text angemessen wieder. „Für die Gefangenschaft bestimmt“ ist eine vertretbare, verständlich machende Ergänzung der elliptischen ersten Klausel und wird sachgerecht als Deutungsmöglichkeit erläutert. Die passivische und auf ein zugemessenes Geschick weisende Form der zweiten Klausel bleibt gewahrt. Im Schlusssatz fügt „gefragt“ jedoch eine im Griechischen nicht ausdrücklich enthaltene Auslegung („dafür ist erforderlich“) hinzu.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Hier sind ... gefragt“ klingt zwar idiomatisch, verändert aber die knappe hinweisende Formel ὧδέ ἐστιν. „Hier ist ...“ ist näher am Text und in diesem apokalyptisch-spruchhaften Register gut verständlich.
  terminology: „Gefangenschaft“, „mit dem Schwert“, „standhaftes Ausharren“, „Glaube“ und „die Heiligen“ sind treffend und konsistent. Die Fußnote zu πίστις bewahrt die mögliche Nuance „Treue“ ohne sie im Haupttext festzulegen. Die textkritische Fußnote zur abweichenden aktiven Lesart ist sinnvoll und korrekt verankert.
