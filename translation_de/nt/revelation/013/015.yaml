id: REV.13.15
reference: Revelation 13:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: de
  text: Und es wurde ihm gegeben, dem Bild des Tieres Atem[a] zu geben, damit das Bild des Tieres sogar sprechen konnte und bewirken konnte, dass alle, die das Bild des Tieres nicht anbeten würden, getötet würden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geist«; sinngemäß auch: »Leben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und dafür sorgen konnte, dass alle, die das Bild des Tieres nicht anbeten würden, getötet würden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: es wurde ihm gegeben
  rationale: Die unpersönliche Passivform bewahrt sowohl den nicht genannten Geber als auch die apokalyptische Ausdrucksweise einer verliehenen Befugnis oder Erlaubnis.
- source_word: δοῦναι πνεῦμα
  choice: Atem zu geben
  rationale: πνεῦμα kann »Atem«, »Geist« oder lebensspendende Kraft bezeichnen. Da das Bild dadurch sprechen kann, gibt »Atem« den konkreten Zusammenhang wieder, ohne wahres Leben oder einen persönlichen Geist ausdrücklich zu behaupten.
- source_word: εἰκών
  choice: Bild
  rationale: »Bild« ist weit genug, um ein Götzenbild oder Abbild zu bezeichnen, ohne die körperliche Form unnötig auf eine Statue festzulegen.
- source_word: θηρίον
  choice: Tier
  rationale: »Tier« ist die etablierte, sachlich passende Bezeichnung für θηρίον in der Offenbarung und vermeidet die deutende Verstärkung »Ungeheuer«.
- source_word: ἵνα καὶ λαλήσῃ
  choice: damit ... sogar sprechen konnte
  rationale: Die Formulierung gibt Zweck beziehungsweise Folge wieder; »sogar« hebt die erstaunliche Fähigkeit des Bildes zu sprechen hervor.
- source_word: ποιήσῃ ἵνα
  choice: bewirken konnte, dass
  rationale: Die natürliche deutsche Kausativkonstruktion bewahrt die Aussage, dass das Bild die Tötung der Nichtanbetenden herbeiführt.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: alle, die ... nicht anbeteten
  rationale: Dies gibt die offene relative Wendung idiomatisch wieder und erfasst sämtliche Personen, die die geforderte Anbetung verweigern.
- source_word: προσκυνήσωσιν
  choice: anbeteten
  rationale: Im Kontext der Offenbarung bezeichnet προσκυνέω gegenüber dem Tier und seinem Bild religiöse Verehrung, nicht lediglich eine höfische Verbeugung.
- source_word: ἀποκτανθῶσιν
  choice: getötet wurden
  rationale: Das Passiv bleibt erhalten; die Formulierung ist klar, modern und weniger juristisch als »hingerichtet wurden«.
theological_decisions:
- issue: Bedeutung von πνεῦμα bei der Belebung des Bildes
  choice: Atem
  alternative: Geist oder Leben
  rationale: »Atem« lässt den Anklang an Belebung und Schöpfung erkennen, ohne festzulegen, dass das Bild wirklich Leben oder einen eigenen Geist empfängt.
- issue: Urheber der verliehenen Befugnis
  choice: Der Geber bleibt ungenannt
  alternative: Gott oder den Drachen ausdrücklich als Geber nennen
  rationale: Das griechische Passiv nennt den Handelnden nicht. Die Übersetzung bewahrt diese Offenheit und trägt keine theologische Identifizierung in den Text ein.
- issue: Rolle des sprechenden Bildes bei der Tötung
  choice: Das Bild bewirkt die Tötung
  alternative: Das Bild selbst tötet die Betroffenen
  rationale: ποιήσῃ ἵνα drückt aus, dass das Bild die Tötung veranlasst oder herbeiführt; der konkrete Vollstrecker wird nicht genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung »Bild des Tieres« bleibt wie im griechischen Text erhalten. Das ungewöhnliche »es wurde ihm gegeben« bewahrt bewusst das unpersönliche apokalyptische Passiv.
