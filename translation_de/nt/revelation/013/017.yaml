id: REV.13.17
reference: Revelation 13:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: de
  text: und damit niemand kaufen oder verkaufen kann, außer wer das Kennzeichen[a], den Namen des Tieres oder die Zahl seines Namens hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Reihung lässt offen, ob „der Name des Tieres oder die Zahl seines Namens“ das Kennzeichen näher bestimmt oder ob mehrere Kennzeichnungen aufgezählt werden.
    reason: syntaktische_ambiguitaet
lexical_decisions:
- source_word: καὶ ἵνα μή τις δύνηται
  choice: und damit niemand … kann
  rationale: ἵνα mit μή bezeichnet hier Zweck bzw. beabsichtigte Folge; μή τις wird natürlich mit „niemand“ wiedergegeben, δύνηται mit „kann“.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: kaufen oder verkaufen
  rationale: Die beiden Infinitive bezeichnen gewöhnlichen Handel und werden im Deutschen direkt und idiomatisch wiedergegeben.
- source_word: εἰ μὴ ὁ ἔχων
  choice: außer wer … hat
  rationale: εἰ μή führt die einzige Ausnahme ein. Das substantivierte Partizip ὁ ἔχων ist zwar grammatisch maskulin Singular, bezeichnet hier aber allgemein jede betroffene Person; „wer“ bewahrt diesen generischen Sinn natürlich.
- source_word: τὸ χάραγμα
  choice: das Kennzeichen
  rationale: χάραγμα bezeichnet ein eingeprägtes oder angebrachtes Zeichen. „Kennzeichen“ ist im apokalyptischen Zusammenhang verständlich, würdig und weniger missverständlich als das heute oft wertende „Brandmal“.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: den Namen des Tieres
  rationale: Die Genitivverbindung wird formal und parallel zur folgenden Wendung wiedergegeben. θηρίον bezeichnet in der Offenbarung das symbolische Tier.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: oder die Zahl seines Namens
  rationale: Die Formulierung erhält die Genitivbeziehung des Griechischen. Das deutsche „seines“ passt grammatisch zu dem sächlichen „Tier“ und lässt zugleich die personale Darstellung des Tieres unangetastet.
theological_decisions:
- issue: Verhältnis von Kennzeichen, Name und Zahl
  choice: Beibehaltung der gereihten Formulierung mit Komma
  alternative: „das Kennzeichen, nämlich den Namen des Tieres oder die Zahl seines Namens“ beziehungsweise eine ausdrückliche Liste von drei Merkmalen
  rationale: Der griechische Wortlaut kann τὸ ὄνομα als nähere Bestimmung zu τὸ χάραγμα verstehen lassen, markiert dies aber nicht ausdrücklich; zugleich steht ἤ nur vor „die Zahl“. Die Übersetzung erklärt daher weder zwingend eine Apposition noch drei völlig getrennte Merkmale.
- issue: Generisches Maskulinum in ὁ ἔχων
  choice: „wer … hat“
  alternative: „derjenige, der … hat“
  rationale: Das grammatische Maskulinum des griechischen substantivierten Partizips ist in diesem Zusammenhang generisch. „Wer“ gibt den umfassenden Bezug im modernen Deutschen wieder, ohne eine Geschlechtsaussage in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt dem griechischen Zusammenhang und bewahrt die syntaktische Offenheit der Aufzählung.
