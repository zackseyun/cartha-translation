id: REV.13.14
reference: Revelation 13:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: de
  text: Und es verführt die Bewohner der Erde durch die Zeichen, die ihm vor den Augen des Tieres zu tun gegeben wurden,[a] und sagt den Bewohnern der Erde, sie sollten für das Tier ein Bild anfertigen[b] – für das Tier, das die Schwertwunde hat und lebte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen der Zeichen, die ihm in Gegenwart des Tieres zu tun gegeben wurden“.'
    reason: διά kann hier sowohl das Mittel als auch den Grund bezeichnen; ἐνώπιον kann schlichter mit „in Gegenwart von“ wiedergegeben werden.
  - marker: b
    text: 'Oder: „ein Bild des Tieres anfertigen“; wörtlicher steht im Griechischen „für das Tier ein Bild“.'
    reason: Die geläufige Deutung als Abbild des Tieres ist möglich, während der griechische Dativ formal „für das Tier“ ausdrückt.
  - marker: c
    text: 'Oder: „das die Wunde vom Schwert hat und wieder lebendig wurde“ oder „das die Wunde vom Schwert hat und am Leben blieb“.'
    reason: ἔζησεν kann im Zusammenhang sowohl Wiederbelebung als auch Weiterleben trotz der Wunde bezeichnen; „lebte“ im Haupttext hält diese Deutungsmöglichkeiten offen.
lexical_decisions:
- source_word: πλανᾷ
  choice: verführt
  rationale: Das Präsens bezeichnet fortdauerndes Irreführen. „Verführt“ ist im Deutschen natürlich und umfasst sowohl Täuschung als auch das Abbringen vom rechten Weg.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: die Bewohner der Erde
  rationale: Die knappe, wiedererkennbare Wendung bewahrt die in der Offenbarung wiederkehrende Bezeichnung, ohne altertümlich zu klingen.
- source_word: διὰ τὰ σημεῖα
  choice: durch die Zeichen
  rationale: διά mit Akkusativ kann Ursache oder Mittel bezeichnen. „Durch“ erhält hier die instrumentale Färbung; die kausale Möglichkeit wird in der Fußnote genannt.
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ gibt den Begriff ohne den nicht ausdrücklich enthaltenen Zusatz „Wunder-“ wieder.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: die ihm … zu tun gegeben wurden
  rationale: Die passive Form bleibt erhalten, ohne den Geber ausdrücklich zu benennen. Der Plural richtet sich im Deutschen natürlich nach „Zeichen“.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: vor den Augen des Tieres
  rationale: Die idiomatische Wendung bezeichnet das Handeln in Gegenwart des Tieres und bewahrt zugleich die anschauliche Bedeutung von ἐνώπιον.
- source_word: λέγων
  choice: und sagt …, sie sollten
  rationale: Die koordinierte Wiedergabe ist im Deutschen flüssiger als ein schweres Partizipialgefüge und übersteigert λέγων nicht zu „befiehlt“.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: für das Tier ein Bild anfertigen
  rationale: Der Dativ wird als „für das Tier“ wiedergegeben; damit wird nicht vorschnell festgelegt, dass das Bild zwingend das Tier darstellt.
- source_word: εἰκόνα
  choice: Bild
  rationale: „Bild“ bewahrt den weiten Bedeutungsumfang einschließlich einer kultischen Darstellung; „Statue“ wäre enger.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: das die Schwertwunde hat
  rationale: „Hat“ entspricht dem Präsens ἔχει. „Schwertwunde“ ist natürliches, präzises Deutsch.
- source_word: καὶ ἔζησεν
  choice: und wieder lebendig wurde
  rationale: Die Form blickt auf das Eintreten beziehungsweise Fortbestehen von Leben nach der Wunde zurück. „Wieder lebendig wurde“ gibt den narrativen Kontrast wieder; die weniger starke Deutung „am Leben blieb“ wird als Alternative vermerkt.
theological_decisions:
- issue: Nicht genannter Geber bei ἐδόθη
  choice: Das Passiv „gegeben wurden“ bleibt ohne ausdrückliche Nennung Gottes stehen.
  alternative: „die Gott ihm zu tun erlaubte“
  rationale: Der Text nennt den Geber nicht. Die passive Form wahrt die in apokalyptischer Sprache mögliche göttliche Zulassung, ohne sie erklärend in den Haupttext einzutragen.
- issue: Bedeutung von ἔζησεν nach der Schwertwunde
  choice: „wieder lebendig wurde“
  alternative: „am Leben blieb“
  rationale: Der Kontext legt eine Wiederherstellung des Lebens nahe, doch das Verb kann auch das Weiterleben bezeichnen. Die Fußnote hält diese Spannung offen und vermeidet eine dogmatische Festlegung auf eine buchstäbliche Auferstehung.
- issue: Bezug des Bildes auf das Tier
  choice: „für das Tier ein Bild“
  alternative: „ein Bild des Tieres“
  rationale: Der griechische Dativ bezeichnet unmittelbar die Zuordnung zum Tier, nicht ausdrücklich dessen Abbildung. Die formal nähere Fassung lässt Art und Gegenstand des Bildes offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wendung „Bewohner der Erde“ erhält das für die Offenbarung charakteristische Leitmotiv. Das Tier wird entsprechend dem grammatischen Geschlecht im Deutschen mit „es/das“ bezeichnet. Der Gedankenstrich verdeutlicht den Bezug des Relativsatzes auf das Tier, nicht auf das Bild.
