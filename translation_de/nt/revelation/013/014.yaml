- from: Und es verführt die Bewohner der Erde durch die Zeichen, die ihm vor den Augen des Tieres zu tun gegeben wurden,[a] und sagt den Bewohnern der Erde, sie sollten für das Tier ein Bild anfertigen[b] – für das Tier, das die Schwertwunde hat und wieder lebendig wurde.[c]
  to: Und es verführt die Bewohner der Erde durch die Zeichen, die ihm vor den Augen des Tieres zu tun gegeben wurden,[a] und sagt den Bewohnern der Erde, sie sollten für das Tier ein Bild anfertigen[b] – für das Tier, das die Schwertwunde hat und lebte.[c]
  rationale: Die einzige notwendige Änderung ersetzt die interpretativ stärkere Wiedergabe „wieder lebendig wurde“ durch das quellentextnähere und im Deutschen ausreichende „lebte“. Die Fußnote dokumentiert die beiden naheliegenden kontextuellen Auslegungen, ohne eine davon im Haupttext festzuschreiben. Alle Fußnotenmarker bleiben eindeutig an der jeweils einschlägigen Stelle verankert.
