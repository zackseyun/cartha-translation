  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: de
  text: Wenn jemand ein Ohr hat, soll er[a] hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Er“ nimmt das grammatische Geschlecht von „jemand“ auf; gemeint ist jede Person.
    reason: Hinweis zum generischen Bezug
lexical_decisions:
- source_word: Εἴ
  choice: Wenn
  rationale: Die konditionale Partikel leitet die sprichwörtliche Aufforderung unmittelbar ein; „wenn“ bewahrt die Form des griechischen Satzes.
- source_word: τις
  choice: jemand
  rationale: Das indefinite Pronomen ist allgemein und offen gemeint. „Jemand“ ist im modernen Deutschen natürlich und entspricht dem generischen Bezug.
- source_word: ἔχει
  choice: hat
  rationale: Das Präsens bezeichnet schlicht den Besitz; „hat“ ist die direkte und idiomatische Wiedergabe.
- source_word: οὖς
  choice: ein Ohr
  rationale: Der griechische Singular wird beibehalten. In dieser festen Mahnformel steht das Ohr sinnbildlich für die Fähigkeit und Bereitschaft, die Botschaft aufzunehmen.
- source_word: ἀκουσάτω
  choice: soll er hören
  rationale: Der Aoristimperativ in der dritten Person Singular wird durch „soll … hören“ als ernste Aufforderung natürlich wiedergegeben. „Hören“ bewahrt die biblische Formel und schließt aufmerksames, folgebereites Hören ein, ohne sie erklärend einzuengen.
theological_decisions:
- issue: Generischer Singular in der Aufforderung
  choice: soll er hören
  alternative: soll diese Person hören
  rationale: Das Griechische spricht eine einzelne, unbestimmte Person an. Das deutsche „jemand … er“ bewahrt den Singular in natürlicher Standardsprache; „er“ ist hier generisch und beschränkt die Aufforderung nicht auf Männer.
- issue: Bedeutung der Hörformel
  choice: „hören“ unverändert beibehalten
  alternative: „aufmerksam zuhören“ oder „verstehen“
  rationale: Die prophetisch-apokalyptische Mahnformel fordert zur aufmerksamen Aufnahme auf. „Hören“ erhält ihre literarische und theologische Spannung, ohne sie auf Zuhören oder verstandesmäßiges Begreifen zu reduzieren.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Satzform und der Singular des griechischen Mahnrufs bleiben erhalten.
