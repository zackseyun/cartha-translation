id: REV.13.3
reference: Revelation 13:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: de
  text: Und einer seiner Köpfe sah aus, als wäre er zu Tode geschlachtet worden[a]; doch seine tödliche Wunde wurde geheilt. Da staunte die ganze Erde und folgte dem Tier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „war wie zu Tode geschlachtet“. Das griechische „wie“ kann eine Erscheinung oder Ähnlichkeit ausdrücken, statt schlicht festzustellen, dass der Kopf tatsächlich getötet worden war.'
    reason: lexical_alternative
  - marker: b
    text: „Die ganze Erde“ kann auch mit „das ganze Land“ übersetzt werden; im apokalyptischen Zusammenhang ist jedoch wahrscheinlich die Erde insgesamt gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: eines seiner Köpfe
  rationale: Gibt die partitive Konstruktion μίαν ἐκ mit Genitiv Plural idiomatisch und genau wieder.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: sah aus, als wäre es zu Tode geschlachtet worden
  rationale: Bewahrt mit „sah aus, als“ den Vergleichs- bzw. Erscheinungscharakter von ὡς und gibt die starke Bedeutung von σφάζω sowie εἰς θάνατον wieder.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: seine tödliche Wunde
  rationale: Natürliches Deutsch für die Genitivverbindung; bezeichnet eine zum Tod führende beziehungsweise als tödlich erscheinende Wunde, ohne die Bildsprache unnötig auszudeuten.
- source_word: ἐθεραπεύθη
  choice: wurde geheilt
  rationale: Transparente Wiedergabe des Passivs von θεραπεύω im Zusammenhang mit einer Wunde.
- source_word: ἐθαυμάσθη
  choice: staunte
  rationale: Gibt die außergewöhnliche Bewunderung beziehungsweise das Erstaunen wieder, ohne die Reaktion eindeutig positiv oder negativ festzulegen.
- source_word: ὅλη ἡ γῆ
  choice: die ganze Erde
  rationale: Im weltweiten apokalyptischen Zusammenhang ist „Erde“ wahrscheinlicher als „Land“, obwohl γῆ beides bedeuten kann.
- source_word: ὀπίσω τοῦ θηρίου
  choice: folgte dem Tier
  rationale: Natürliches modernes Deutsch, das hier sowohl die Bewegung hinter dem Tier her als auch die Hinwendung zu ihm ausdrücken kann.
- source_word: θηρίου
  choice: Tier
  rationale: Übliche deutsche Wiedergabe von θηρίον in der apokalyptischen Bildsprache der Offenbarung.
theological_decisions:
- issue: Art des scheinbaren Todes und der Heilung des Tieres
  choice: Die Formulierung beschreibt einen Kopf, der wie zu Tode geschlachtet aussah, und die Heilung seiner tödlichen Wunde, ohne die Vorgänge näher zu bestimmen.
  alternative: Wörtlicher Tod und Auferstehung; symbolische Wiederherstellung eines Herrschers oder Reiches; inszenierte Täuschung.
  rationale: Das griechische ὡς lässt Erscheinung oder Ähnlichkeit anklingen. Der Vers entscheidet nicht zwischen einer buchstäblichen, symbolischen oder täuschenden Deutung; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Bildsprache von σφάζω bleibt mit „schlachten“ erhalten; die syntaktisch natürliche Form „sah aus, als wäre“ macht zugleich die durch ὡς markierte Unsicherheit verständlich. „Tier“ wird kleingeschrieben, da der griechische Text keinen Eigennamen markiert.
