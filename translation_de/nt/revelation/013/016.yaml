source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: de
  text: Und es bewirkt, dass allen – den Kleinen und den Großen, den Reichen und den Armen, den Freien und den Sklaven – ein Kennzeichen auf ihrer rechten Hand oder auf ihrer Stirn gegeben wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „damit sie ihnen ein Kennzeichen geben“. Das Subjekt von „geben“ bleibt im Griechischen ungenannt; „ihnen“ bezieht sich auf die genannten Personen.'
    reason: Die aktive griechische Pluralform ist ungewöhnlich. Der Haupttext gibt den Vorgang idiomatisch im Passiv wieder, ohne ein nicht genanntes handelndes Subjekt festzulegen.
lexical_decisions:
- source_word: ποιεῖ
  choice: es bewirkt
  rationale: ποιέω mit ἵνα und Konjunktiv bezeichnet hier, dass das Tier den Vorgang herbeiführt. „Bewirkt“ gibt diese wirksame Verursachung wieder, ohne über den Wortlaut hinaus ausdrücklich Zwang zu behaupten.
- source_word: πάντας
  choice: allen
  rationale: Der Akkusativ umfasst die anschließend in Gegensatzpaaren genannten Personengruppen vollständig. In der deutschen Passivkonstruktion wird daraus idiomatisch der Dativ „allen“.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: den Kleinen und den Großen
  rationale: Die formnahe Wiedergabe bewahrt die feierliche Aufzählung und den umfassenden sozialen Gegensatz, ohne ihn einengend als bloße Macht- oder Rangordnung auszudeuten.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: den Reichen und den Armen
  rationale: Dies ist die natürliche und genaue deutsche Wiedergabe des wirtschaftlichen Gegensatzpaares.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: den Freien und den Sklaven
  rationale: Der ausdrückliche Gegensatz zu den Freien hebt den rechtlich-sozialen Status der Unfreiheit hervor; deshalb ist „Sklaven“ genauer als „Diener“.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: dass allen … ein Kennzeichen … gegeben wird
  rationale: Der griechische Text hat wörtlich eine aktive Pluralform („damit sie ihnen … geben“), lässt deren Subjekt jedoch unausgesprochen. Das deutsche Passiv gibt den Vorgang natürlich wieder, ohne die nicht benannten Handelnden festzulegen; die formale Besonderheit bleibt in der Fußnote sichtbar.
- source_word: χάραγμα
  choice: Kennzeichen
  rationale: χάραγμα bezeichnet ein eingeprägtes oder angebrachtes identifizierendes Zeichen. „Kennzeichen“ ist in modernem Deutsch verständlich und wahrt diese Funktion, ohne die konkrete Ausführungsart festzulegen.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: an ihrer rechten Hand
  rationale: „An“ bezeichnet im Deutschen natürlich die Stelle, an der das Kennzeichen angebracht ist. Der Singular wird wie im Griechischen distributiv gebraucht.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: oder an ihrer Stirn
  rationale: Die Formulierung bewahrt die Alternative und den distributiven Singular des griechischen Textes in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gegensatz zu „frei“
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: In diesem Paar steht nicht allgemein Dienst, sondern der soziale Status der Unfreiheit im Vordergrund. „Sklaven“ gibt diesen Gegensatz klar wieder, ohne ihn zu vergeistlichen.
- issue: Mehrdeutige Konstruktion ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: deutsche Passivkonstruktion mit ungenannten Handelnden
  alternative: „damit sie ihnen ein Kennzeichen geben“; „damit alle ein Kennzeichen erhalten“
  rationale: Das Passiv bietet lesbares Deutsch und vermeidet es, ein bestimmtes Subjekt für die griechische Pluralform einzusetzen. Die wörtlichere aktive Fassung wird in der Fußnote dokumentiert, sodass die grammatische Spannung nicht verloren geht.
- issue: Deutung von χάραγμα
  choice: Kennzeichen
  alternative: Malzeichen; Prägung
  rationale: „Kennzeichen“ bezeichnet die identifizierende Funktion, ohne vorschnell eine bestimmte materielle oder endzeitliche Ausgestaltung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drei Gegensatzpaare und ihr rhythmischer Aufbau bleiben erhalten. Gedankenstriche grenzen die umfassende Aufzählung lesefreundlich ab; „Sklaven“ wahrt den konkreten sozialen Gegensatz, und die Fußnote dokumentiert die syntaktische Schwierigkeit des griechischen Textes.
