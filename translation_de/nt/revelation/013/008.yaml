id: REV.13.8
reference: Revelation 13:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: de
  text: 'Und alle, die auf der Erde wohnen, werden es anbeten: jeder, dessen Name nicht im Buch des Lebens des seit Grundlegung der Welt geschlachteten Lammes geschrieben steht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder, dessen Name nicht seit Grundlegung der Welt im Buch des Lebens des geschlachteten Lammes geschrieben steht“. Die griechische Formulierung kann „seit Grundlegung der Welt“ entweder mit „geschlachtet“ oder mit „geschrieben steht“ verbinden.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: werden … anbeten
  rationale: In der Offenbarung bezeichnet προσκυνέω regelmäßig religiöse Verehrung; „anbeten“ bewahrt diesen Gegensatz zwischen der Anbetung Gottes beziehungsweise des Lammes und der Anbetung des Tieres.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: die auf der Erde wohnen
  rationale: Die wiederkehrende Wendung der Offenbarung bleibt verbal und intertextuell erkennbar; „wohnen“ ist zugleich natürliches modernes Deutsch.
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: jeder, dessen Name nicht … geschrieben steht
  rationale: Der griechische Singular individualisiert die Betroffenen. „Geschrieben steht“ gibt den resultativen Sinn des Perfekts idiomatisch wieder.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: Buch des Lebens
  rationale: Dies ist die verständliche und etablierte Wiedergabe des apokalyptischen Bildes; eine Festlegung auf die materielle Form einer Schriftrolle ist nicht nötig.
- source_word: τοῦ ἀρνίου
  choice: des Lammes
  rationale: „Lamm“ bewahrt den christologischen Titel sowie seine Opfer- und Messiasbildlichkeit.
- source_word: τοῦ ἐσφαγμένου
  choice: das … geschlachtet ist
  rationale: σφάζω bezeichnet gewaltsames, häufig opferbezogenes Schlachten. „Geschlachtet“ erhält diese stärkere Bildsprache, während das Perfekt „ist“ den fortwirkenden Zustand des geschlachteten Lammes erkennen lässt.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: seit Grundlegung der Welt
  rationale: Die Wendung gibt den zeitlichen Ausgangspunkt von ἀπό mit Genitiv knapp wieder und bewahrt den biblischen Klang.
theological_decisions:
- issue: Syntaktische Zuordnung von ἀπὸ καταβολῆς κόσμου („seit Grundlegung der Welt“)
  choice: Im Haupttext auf „das … geschlachtet ist“ bezogen
  alternative: 'Auf „geschrieben steht“ bezogen: Der Name steht seit Grundlegung der Welt nicht im Buch des Lebens des geschlachteten Lammes geschrieben.'
  rationale: Die unmittelbare griechische Wortstellung verbindet die Zeitangabe am ehesten mit dem direkt vorausgehenden Partizip τοῦ ἐσφαγμένου. Offenbarung 17,8 spricht jedoch stark für eine Verbindung mit dem Einschreiben der Namen. Da die Syntax tatsächlich mehrdeutig ist, bleibt die naheliegende Wortverbindung im Haupttext stehen und die andere Deutung wird in einer Fußnote ausdrücklich bewahrt.
- issue: Genus des pronominalen Bezugs auf das Tier
  choice: „es“
  alternative: „ihn“
  rationale: Das Bezugswort θηρίον in Offenbarung 13 ist grammatisch Neutrum; das deutsche „Tier“ ist ebenfalls Neutrum. „Es“ bewahrt daher den unmittelbaren grammatischen Bezug, ohne das Tier unnötig zu personalisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter apokalyptischer Bildsprache. Der Doppelpunkt macht deutlich, dass der folgende Singular die Gesamtheit aus dem ersten Satzteil näher bestimmt. Die echte syntaktische Mehrdeutigkeit wird nicht dogmatisch aufgelöst.
