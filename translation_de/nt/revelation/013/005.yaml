revisions:
- from: Und ihm wurde ein Mund gegeben, der große Dinge[b] und Lästerungen aussprach; und ihm wurde Vollmacht gegeben, zweiundvierzig Monate lang zu handeln.[a]
  to: Und ihm wurde ein Mund gegeben, der große Worte[b] und Lästerungen sprach; und ihm wurde Vollmacht gegeben, zweiundvierzig Monate lang zu handeln.
  rationale: Die Haupttextformulierung wird idiomatischer gestaltet, indem die substantivierte Aussage μεγάλα im Bild eines redenden Mundes als „große Worte“ wiedergegeben wird. Die unzutreffend als textkritisch ausgewiesene Fußnote zur Deutung „fortzubestehen“ entfällt samt Anker. Die übrigen zentralen Struktur- und Bedeutungsmerkmale des griechischen Textes bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf bewahrt zutreffend die zweimalige Passivform („ihm wurde … gegeben“), die Bildsprache von στόμα, die Pluralform von βλασφημίας, die delegierte Nuance von ἐξουσία und die Dauerangabe. „Zu handeln“ gibt ποιῆσαι in seiner hier offenen Bedeutung angemessen wieder. Die Fußnote a ist jedoch als textkritische Anmerkung nicht haltbar: Die Wiedergabe „fortzubestehen/fortzufahren“ ist eine interpretierende Übersetzung von ποιῆσαι, nicht eine durch den vorgelegten SBLGNT-Text ausgewiesene Lesart, die als Handschriftenvariante zu kennzeichnen wäre.'
  naturalness: „Große Dinge … aussprach“ ist im Deutschen weniger idiomatisch, da Dinge gewöhnlich nicht „ausgesprochen“ werden. „Große Worte … sprach“ ist eine natürliche, würdige und für den apokalyptischen Kontext passende Formulierung. Das ergänzte „Worte“ expliziert lediglich die durch das redende „Mund“-Bild vorgegebene sprachliche Kategorie.
  terminology: „Vollmacht“ ist für ἐξουσία sehr passend. „Lästerungen“ wahrt den offenen Wortlaut, ohne „gegen Gott“ vorwegzunehmen. Die erläuternde Fußnote zu „große Worte“ darf die kontextuelle Nuance als Wahrscheinlichkeit benennen, sollte aber keine engere Deutung in den Haupttext ziehen.
  issues:
  - severity: medium
    issue: Unidiomatische Verbindung „große Dinge … aussprach“
    rationale: Das deutsche Verb „aussprechen“ verbindet sich hier deutlich natürlicher mit „Worten“ als mit „Dingen“. Die Änderung verbessert die Lesbarkeit ohne eine theologische oder inhaltliche Einengung.
  - severity: high
    issue: Fußnote a stellt eine Übersetzungsvariante irreführend als Handschriften- und Übersetzungsvariante dar
    rationale: Die Formulierung „fortzubestehen“ beruht auf einer kontextuellen Deutung von ποιῆσαι („tun/handeln“), nicht auf einer im vorgelegten griechischen Text belegten abweichenden Lesart. Die Anmerkung sollte daher entfallen, statt eine nicht nachgewiesene textkritische Alternative zu suggerieren.
  revised_text: Und ihm wurde ein Mund gegeben, der große Worte[b] und Lästerungen sprach; und ihm wurde Vollmacht gegeben, zweiundvierzig Monate lang zu handeln.
  revised_footnotes:
