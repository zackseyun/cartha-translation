id: REV.13.5
reference: Revelation 13:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: de
  text: Und ihm wurde ein Mund gegeben, der große Worte[b] und Lästerungen sprach; und ihm wurde Vollmacht gegeben, zweiundvierzig Monate lang zu handeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Große Worte“ bezeichnet hier wahrscheinlich großsprecherische oder anmaßende Rede.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: wurde gegeben
  rationale: Die Passivform zeigt, dass das Tier Mund und Vollmacht empfängt und nicht aus sich selbst besitzt. Die Wiederholung bewahrt zugleich die auffällige Formulierung des griechischen Textes.
- source_word: στόμα
  choice: ein Mund
  rationale: Die konkrete Bildsprache der Vision bleibt erhalten; eine Umschreibung wie „die Fähigkeit zu reden“ würde das apokalyptische Bild abschwächen.
- source_word: λαλοῦν
  choice: der … aussprach
  rationale: Das Partizip bezieht sich auf „Mund“. „Aussprach“ ergibt mit den beiden Akkusativobjekten ein natürliches modernes Deutsch, ohne den Inhalt des Redens näher festzulegen.
- source_word: μεγάλα
  choice: große Dinge
  rationale: Dies bildet den offenen Wortlaut nach. Im Zusammenhang sind großsprecherische oder anmaßende Äußerungen gemeint, doch „Prahlereien“ würde diese Deutung bereits in den Haupttext eintragen.
- source_word: βλασφημίας
  choice: Lästerungen
  rationale: Der Plural und der religiös anstößige Charakter der Äußerungen bleiben erhalten. „Gotteslästerungen“ wäre im Kontext verständlich, würde das im Substantiv nicht ausdrücklich genannte Objekt jedoch ergänzen.
- source_word: ἐξουσία
  choice: Vollmacht
  rationale: „Vollmacht“ bezeichnet verliehene Befugnis und passt daher besser zum wiederholten „wurde gegeben“ als „Macht“, das stärker nach eigener Kraft klingen könnte.
- source_word: ποιῆσαι
  choice: zu handeln
  rationale: Das Verb ist weit gefasst („tun, machen“). Mit der Zeitangabe gibt „handeln“ den Sinn knapp wieder, ohne „fortzubestehen“ aus einer abweichenden Überlieferungs- oder Übersetzungstradition in den Haupttext zu übernehmen.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: zweiundvierzig Monate lang
  rationale: Die Akkusativform bezeichnet die zeitliche Dauer; „Monate lang“ ist dafür die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Aussagewert von μεγάλα für die Rede des Tieres
  choice: „große Dinge“
  alternative: „großsprecherische Worte“ oder „Prahlereien“
  rationale: Der Zusammenhang legt anmaßende Rede nahe, während das griechische Adjektiv für sich genommen weiter gefasst ist. Die offenere Formulierung erhält diese Spannung; die Fußnote erläutert den wahrscheinlichen Sinn.
- issue: Bedeutung von ποιῆσαι in Verbindung mit der Zeitangabe
  choice: „zweiundvierzig Monate lang zu handeln“
  alternative: „zweiundvierzig Monate lang fortzubestehen“
  rationale: Der Haupttext folgt dem vorgelegten SBLGNT-Wortlaut und wahrt die semantische Breite von ποιῆσαι. Die bekannte alternative Wiedergabe wird als text- und übersetzungsgeschichtliche Variante in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „ihm wurde … gegeben“ und das konkrete Bild „ein Mund“ wurden bewusst bewahrt. Das Semikolon macht die beiden parallel aufgebauten Verleihungsaussagen gut erkennbar.
