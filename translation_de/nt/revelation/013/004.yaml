id: REV.13.4
reference: Revelation 13:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: de
  text: 'Und sie beteten den Drachen an, weil er dem Tier die Vollmacht gegeben hatte. Auch das Tier beteten sie an und sagten: »Wer ist dem Tier gleich,[a] und wer kann gegen es Krieg führen?«[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer ist mit dem Tier vergleichbar?«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wer kann mit ihm Krieg führen?«'
    reason: lexical_alternative
  - marker: c
    text: Dieser Zuruf klingt wahrscheinlich an alttestamentliche Aussagen über Gottes Unvergleichlichkeit an (zum Beispiel 2. Mose 15,11; Psalm 35,10), wird hier jedoch in gotteslästerlicher Weise auf das Tier angewandt.
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: beteten … an
  rationale: In der Offenbarung bezeichnet προσκυνέω regelmäßig religiöse Verehrung; „anbeten“ gibt die götzendienerische Bedeutung natürlich und deutlich wieder.
- source_word: δράκοντι
  choice: Drachen
  rationale: Direkte und im apokalyptischen Zusammenhang etablierte Wiedergabe von δράκων.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι nennt hier den Grund für die Anbetung des Drachen.
- source_word: ἔδωκεν
  choice: gegeben hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass die Übertragung der Vollmacht der Anbetung vorausging.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: ἐξουσία bezeichnet hier übertragene Herrschafts- oder Verfügungsgewalt; „Vollmacht“ wahrt diesen Aspekt besser als das allgemeinere „Macht“.
- source_word: θηρίῳ
  choice: Tier
  rationale: „Tier“ ist die direkte, traditionsfähige Wiedergabe von θηρίον und lässt die apokalyptische Symbolik unaufgelöst.
- source_word: λέγοντες
  choice: und sagten
  rationale: Gibt das begleitende Partizip in natürlichem modernem Deutsch wieder und leitet den Ausruf klar ein.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: Wer ist dem Tier gleich
  rationale: Bewahrt die rhetorische Form und den wahrscheinlichen Anklang an biblische Aussagen über Gottes Unvergleichlichkeit.
- source_word: δύναται
  choice: kann
  rationale: „Kann“ ist die natürliche moderne deutsche Wiedergabe der ausgedrückten Fähigkeit.
- source_word: πολεμῆσαι μετ’ αὐτοῦ
  choice: gegen es Krieg führen
  rationale: πολεμέω hat militärischen Sinn; μετά mit Genitiv bezeichnet hier die feindliche Auseinandersetzung. „Gegen es“ wahrt den grammatischen Bezug auf das sächliche „Tier“.
theological_decisions:
- issue: Pronomen für das Tier
  choice: „es“ entsprechend dem sächlichen deutschen Bezugswort „Tier“
  alternative: „ihn“, um die personhafte Darstellung des Tieres hervorzuheben
  rationale: Sowohl das griechische θηρίον als auch das deutsche „Tier“ sind sächlich. „Es“ bleibt quellennah und vermeidet eine zusätzliche Personalisierung.
- issue: Anklang an Aussagen über Gottes Unvergleichlichkeit
  choice: Die Formulierung „Wer ist dem Tier gleich“ ohne Ausdeutung im Haupttext beibehalten
  alternative: Die gotteslästerliche Nachahmung ausdrücklich in den Vers hineinübersetzen
  rationale: Die knappe Form bewahrt die theologische Spannung und den möglichen Schriftanklang, ohne ihn interpretierend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „anbeten“ und „Tier“ bleibt wegen ihrer rhetorischen und theologischen Funktion erhalten. „Vollmacht“ markiert die vom Drachen übertragene Autorität. Sämtliche Fußnotenmarker stehen im Haupttext.
