id: REV.13.7
reference: Revelation 13:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: de
  text: Und ihm wurde gegeben, Krieg gegen die Heiligen[a] zu führen und sie zu überwinden.[b] Und ihm wurde Vollmacht gegeben über jeden Stamm und jedes Volk und jede Sprache und jede Nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann die Wendung „mit den Heiligen“ lauten; im Zusammenhang der Kriegführung ist der Sinn jedoch feindlich: „gegen die Heiligen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie zu besiegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: ihm wurde gegeben
  rationale: Die unpersönliche Passivform bewahrt die Zurückhaltung des griechischen Textes darüber, wer der Gebende ist, und wird bei beiden Vorkommen entsprechend wiedergegeben.
- source_word: ποιῆσαι πόλεμον
  choice: Krieg zu führen
  rationale: Dies ist im heutigen Deutschen die natürliche idiomatische Wiedergabe der griechischen Wendung, ohne ihren kriegerischen Gehalt abzuschwächen.
- source_word: μετὰ τῶν ἁγίων
  choice: gegen die Heiligen
  rationale: μετά mit Genitiv bedeutet für sich genommen meist „mit“; in Verbindung mit Kriegführung bezeichnet es jedoch die gegnerische Seite. „Die Heiligen“ ist die knappe, im Deutschen etablierte Bezeichnung für Gottes heiliges Volk.
- source_word: νικῆσαι
  choice: sie zu überwinden
  rationale: „Überwinden“ erhält das für die Offenbarung wichtige wiederkehrende Motiv von νικάω und lässt zugleich die Bedeutung „besiegen“ erkennen.
- source_word: ἐξουσία
  choice: Vollmacht
  rationale: „Vollmacht“ bezeichnet verliehene Herrschaftsbefugnis und passt daher besonders gut zum wiederholten Passiv „wurde gegeben“; es betont nicht bloß rohe Macht.
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: über jeden Stamm und jedes Volk und jede Sprache und jede Nation
  rationale: Die viergliedrige, umfassende Aufzählung und ihre wiederholten Bindewörter bleiben erhalten. „Sprache“ gibt γλῶσσα im modernen Deutschen klarer wieder als das traditionelle „Zunge“.
theological_decisions:
- issue: Nicht genannter Urheber beim wiederholten göttlichen Passiv ἐδόθη
  choice: Die Passivform „ihm wurde gegeben“ beziehungsweise „ihm wurde Vollmacht gegeben“ bleibt erhalten, ohne den Geber zu benennen.
  alternative: „Es wurde ihm erlaubt“ oder „Gott erlaubte ihm“
  rationale: Der griechische Text nennt den Geber nicht ausdrücklich. Die passive Form wahrt die Spannung zwischen verliehener Befugnis, göttlicher Souveränität und dem Handeln des Bösen, ohne sie auslegend aufzulösen.
- issue: Bedeutung von νικάω im Kampf gegen die Heiligen
  choice: „überwinden“
  alternative: „besiegen“
  rationale: „Überwinden“ bewahrt die leitmotivische Wortverbindung zu anderen νικάω-Stellen der Offenbarung. In diesem Vers bezeichnet es dennoch einen tatsächlichen, zumindest äußerlich-geschichtlichen Sieg über die Heiligen, ohne dessen endgültige theologische Bedeutung auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wiederholung „ihm wurde gegeben“ folgt bewusst der Struktur des griechischen Textes. Die vierfache Aufzählung bleibt unverkürzt und mit wiederholtem „und“ erhalten.
