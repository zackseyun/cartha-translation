  terminology: „Weisheit“, „Verstand“, „berechne“, „Zahl“ und „das Tier“ sind konsistent und sachgerecht. Die Wiedergabe „eines Menschen“ ist gegenüber einer Festlegung auf „menschliche Zahl“ vorzuziehen, da sie die formale Singularität und Auslegungsöffnung des Griechischen erhält.
