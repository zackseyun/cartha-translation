id: REV.13.18
reference: Revelation 13:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: de
  text: 'Hier ist Weisheit: Wer Verstand hat, berechne die Zahl des Tieres; denn es ist die Zahl eines Menschen[a], und seine Zahl ist sechshundertsechsundsechzig[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine menschliche Zahl“. Die griechische Formulierung kann auch die Zahl eines bestimmten Menschen bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Einige Handschriften lesen 616 statt 666.
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: Hier ist Weisheit
  rationale: Die knappe, hervorgehobene Formulierung bewahrt den demonstrativen Charakter von ὧδε und die feierliche Aussage des griechischen Textes.
- source_word: ὁ ἔχων νοῦν
  choice: Wer Verstand hat
  rationale: Die substantivische Partizipialkonstruktion wird im Deutschen natürlich wiedergegeben; νοῦς bezeichnet hier Einsicht beziehungsweise geistiges Verständnis.
- source_word: ψηφισάτω
  choice: berechne
  rationale: Der Aoristimperativ fordert zum Errechnen oder Ermitteln der Zahl auf; „berechne“ ist präzise und im modernen Deutsch geläufig.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: die Zahl des Tieres
  rationale: Die Genitivverbindung wird direkt wiedergegeben; „das Tier“ ist die etablierte deutsche Bezeichnung für θηρίον im apokalyptischen Zusammenhang der Offenbarung.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: denn es ist die Zahl eines Menschen
  rationale: Die Formulierung wahrt den singularischen Genitiv ἀνθρώπου und lässt offen, ob ein bestimmter Mensch, ein Mensch allgemein oder der menschliche Charakter der Zahl gemeint ist.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Pronomen bezieht sich auf „das Tier“. Im Deutschen verlangt das grammatische Geschlecht von „Tier“ das Possessivpronomen „seine“.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: sechshundertsechsundsechzig
  rationale: Direkte Wiedergabe der ausgeschriebenen griechischen Zahl in standardgemäßer deutscher Zusammenschreibung.
theological_decisions:
- issue: Bedeutung von ἀνθρώπου in ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: die Zahl eines Menschen
  alternative: eine menschliche Zahl
  rationale: Der artikellose Genitiv Singular kann Zugehörigkeit zu einem Menschen, Bezug auf einen bestimmten Menschen oder allgemein menschlichen Charakter ausdrücken. Der Haupttext erhält den Singular und vermeidet es, die bekannte Deutungsfrage festzulegen; die Fußnote nennt die ebenfalls mögliche qualitative Wiedergabe.
- issue: Textvariante bei der Zahl des Tieres
  choice: sechshundertsechsundsechzig
  alternative: sechshundertsechzehn
  rationale: Die Lesart 666 ist im SBLGNT als Text gedruckt und insgesamt am stärksten bezeugt; die alte und bedeutende Variante 616 wird in einer Fußnote dokumentiert, ohne ihre Auslegung vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper, eindringlicher Satzführung. „Hier ist Weisheit“ bewahrt den apokalyptischen Ton; das Semikolon macht den begründenden Zusammenhang deutlich. Die Deutung der Zahl und des Ausdrucks „eines Menschen“ bleibt offen.
