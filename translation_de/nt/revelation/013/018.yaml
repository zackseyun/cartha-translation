  source_fidelity: 'Der Entwurf gibt den griechischen Satzbau und die wesentlichen Begriffe zuverlässig wieder: ὧδε als „Hier“, σοφία als „Weisheit“, der auffordernde Aoristimperativ ψηφισάτω als „berechne“, θηρίον als „Tier“ und die Zahl 666 ausgeschrieben. „die Zahl eines Menschen“ bewahrt den unbestimmten Genitiv Singular ἀνθρώπου, ohne die umstrittene Deutung auf eine bestimmte Person oder eine qualitative Bedeutung festzulegen. „seine Zahl“ bezieht sich nachvollziehbar auf das Tier.'
