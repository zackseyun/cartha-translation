id: REV.13.1
reference: Revelation 13:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: de
  text: Und ich sah ein Tier aus dem Meer heraufsteigen. Es hatte zehn Hörner und sieben Köpfe, auf seinen Hörnern zehn Diademe und auf seinen Köpfen Namen der Lästerung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: lästerliche Namen.'
    reason: Lexikalische Alternative für die Genitivverbindung ὀνόματα βλασφημίας.
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: Der Aorist von ὁράω wird als schlichtes narratives Präteritum wiedergegeben; Zusätze wie „in einer Vision“ stehen nicht ausdrücklich im griechischen Text.
- source_word: ἐκ τῆς θαλάσσης
  choice: aus dem Meer
  rationale: ἐκ bezeichnet das Hervorkommen aus dem Inneren bzw. aus dem Bereich des Meeres und bewahrt so das anschauliche Bild.
- source_word: θηρίον
  choice: Tier
  rationale: „Tier“ ist die geläufige deutsche Wiedergabe in der apokalyptischen Bildsprache und vermeidet die interpretierende Zuspitzung „Ungeheuer“.
- source_word: ἀναβαῖνον
  choice: heraufsteigen
  rationale: Das Präsenspartizip schildert den Vorgang, während Johannes ihn sieht; „heraufsteigen“ gibt Bewegung und Blickrichtung natürlich wieder.
- source_word: ἔχον
  choice: Es hatte
  rationale: Ein neuer Hauptsatz ist im modernen Deutschen flüssiger als eine lange Partizipialkonstruktion und bewahrt dennoch den beschreibenden Gehalt.
- source_word: κέρατα δέκα
  choice: zehn Hörner
  rationale: Das apokalyptische Bild wird wörtlich erhalten und nicht symbolisch ausgedeutet.
- source_word: κεφαλὰς ἑπτά
  choice: sieben Köpfe
  rationale: Die Bildsprache wird direkt und ohne interpretierende Erklärung wiedergegeben.
- source_word: διαδήματα
  choice: Diademe
  rationale: διάδημα bezeichnet spezifisch ein königliches Stirnband bzw. Diadem. „Diademe“ ist im Deutschen verständlich und unterscheidet den Ausdruck von στέφανος, dem anderen neutestamentlichen Wort für Kranz oder Krone.
- source_word: ἐπὶ τῶν κεράτων αὐτοῦ
  choice: auf seinen Hörnern
  rationale: ἐπί mit Genitiv ist hier örtlich zu verstehen; das grammatisch passende deutsche Possessivpronomen bezieht sich auf „Tier“.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: auf seinen Köpfen
  rationale: ἐπί mit Akkusativ beschreibt hier die Lage auf den Köpfen; die ungewöhnliche Vision wird unverändert bewahrt.
- source_word: ὀνόματα βλασφημίας
  choice: Namen der Lästerung
  rationale: Die Genitivverbindung wird formal bewahrt, statt sie ausschließlich attributiv als „lästerliche Namen“ festzulegen.
theological_decisions:
- issue: Symbolische apokalyptische Bildsprache
  choice: Die Bilder „Tier“, „Hörner“, „Köpfe“, „Diademe“ und „Namen der Lästerung“ bleiben unaufgelöst stehen.
  alternative: Das Tier oder seine Merkmale bereits im Haupttext als Reich, Herrscher, Weltmacht oder satanischen Akteur identifizieren.
  rationale: Der Vers bietet die visionären Symbole, aber noch keine vollständige Auslegung. Eine Identifikation im Übersetzungstext würde eine bestimmte eschatologische Deutung vorwegnehmen.
- issue: Bedeutung der Genitivverbindung ὀνόματα βλασφημίας
  choice: Namen der Lästerung
  alternative: lästerliche Namen
  rationale: Die gewählte Fassung erhält die formale und semantische Offenheit des Genitivs; die idiomatisch-attributive Deutung wird in der Fußnote genannt.
- issue: Wiedergabe von διαδήματα
  choice: Diademe
  alternative: Kronen
  rationale: „Diademe“ wahrt die königliche Nuance und die lexikalische Unterscheidung von anderen Kronen- bzw. Kranzbegriffen in der Offenbarung, ohne das Bild theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird nach dem ersten Bild in zwei deutsche Sätze gegliedert, damit die Beschreibung klar bleibt. Die traditionelle apokalyptische Begrifflichkeit wird beibehalten, ohne konfessionelle oder endzeitliche Deutungen in den Wortlaut einzutragen.
