id: REV.13.13
reference: Revelation 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: de
  text: Und es vollbringt große Zeichen[a]; ja, es lässt sogar Feuer vom Himmel auf die Erde herabkommen, vor den Augen der Menschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „große Wunderzeichen“ oder „große Wunder“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor den Menschen“ beziehungsweise „im Angesicht der Menschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ σημεῖα μεγάλα
  choice: vollbringt große Zeichen
  rationale: „Zeichen“ bewahrt den johanneischen und apokalyptischen Sinn von machtvollen Taten mit Hinweischarakter, ohne vorschnell festzulegen, ob es sich um echte Wunder oder Täuschungen handelt. Mit „vollbringt“ klingt die Verbindung im modernen Deutsch natürlich.
- source_word: ἵνα καὶ πῦρ ποιῇ … καταβαίνειν
  choice: ja, es lässt sogar Feuer … herabkommen
  rationale: Die Formulierung gibt den steigernden Nachdruck von καί wieder und drückt die Veranlassungskonstruktion mit ποιῇ und dem Infinitiv καταβαίνειν idiomatisch aus. Das semantische Verhältnis des ἵνα-Satzes wird nicht unnötig eng als reine Absicht festgelegt.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: „Himmel“ entspricht dem apokalyptischen Sprachgebrauch und erhält zugleich die mögliche Bedeutung des sichtbaren Himmels, ohne sie ausdrücklich auf „Firmament“ oder „Luftraum“ zu beschränken.
- source_word: εἰς τὴν γῆν
  choice: auf die Erde
  rationale: Die Wendung bildet die gerichtete Bewegung zur Erde natürlich und anschaulich ab.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: vor den Augen der Menschen
  rationale: Die idiomatische deutsche Wendung hebt die öffentliche Sichtbarkeit hervor. „Menschen“ gibt ἀνθρώπων geschlechtsübergreifend wieder.
theological_decisions:
- issue: Wesen der Zeichen
  choice: Die öffentlich wahrnehmbaren Vorgänge werden beschrieben, ohne ihre übernatürliche Echtheit oder ihren Mechanismus festzulegen.
  alternative: Mit „Wunder“ eine übernatürliche Wirkung nahelegen oder die Vorgänge ausdrücklich als bloße Täuschung bezeichnen.
  rationale: Der Vers nennt große Zeichen und das Herabkommen von Feuer, entscheidet an dieser Stelle aber nicht ausdrücklich, wie diese Erscheinungen zustande kommen. „Zeichen“ bewahrt diese Spannung.
- issue: Funktion des ἵνα-Satzes
  choice: Die Feuertat wird als gesteigerter Ausdruck des Zeichenwirkens wiedergegeben, ohne ausschließlich Zweck oder Folge festzulegen.
  alternative: Explizit „damit“ als Zweck oder „sodass“ als Folge übersetzen.
  rationale: ἵνα kann hier im Zusammenhang eine Zweck-, Folge- oder erläuternde Nuance tragen. „Ja … sogar“ bewahrt die Steigerung, ohne die syntaktisch-theologische Beziehung enger festzulegen als nötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „ja … sogar“ macht die Steigerung gut verständlich; „vor den Augen der Menschen“ betont die öffentliche Wahrnehmbarkeit. Die Satzstruktur bleibt dem apokalyptischen Erzählton angemessen.
