id: REV.13.2
reference: Revelation 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: de
  text: Und das Tier, das ich sah, glich einem Leoparden[a]. Seine Füße waren wie die eines Bären und sein Maul wie das Maul eines Löwen. Und der Drache gab ihm seine Macht, seinen Thron und große Vollmacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bilder vom Leoparden, Bären und Löwen erinnern an die Visionen von den Tieren in Daniel 7.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: Tier
  rationale: „Tier“ ist die natürliche deutsche Wiedergabe und zugleich der in der Offenbarung etablierte Ausdruck für die apokalyptische, monströse Gegenmacht; neutralere Umschreibungen würden die Symbolkraft abschwächen.
- source_word: ὅμοιον παρδάλει
  choice: glich einem Leoparden
  rationale: ὅμοιος mit Dativ bezeichnet Ähnlichkeit. „glich einem Leoparden“ ist idiomatisch, würdevoll und bewahrt den visionären Vergleich.
- source_word: πόδες ... ὡς ἄρκου
  choice: Seine Füße waren wie die eines Bären
  rationale: „Füße“ bildet πόδες direkt ab; „die eines Bären“ ergänzt die im Griechischen elliptische Vergleichsform natürlich, ohne sie zu „Tatzen“ zu spezifizieren.
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: sein Maul wie das Maul eines Löwen
  rationale: Bei Tieren ist „Maul“ im Deutschen natürlicher als „Mund“. Die ausdrückliche Wiederholung von στόμα bleibt erhalten und bewahrt die formale Ausgewogenheit und Anschaulichkeit.
- source_word: δράκων
  choice: Drache
  rationale: „Drache“ ist die direkte und in der Offenbarung feststehende Wiedergabe der apokalyptischen Gestalt.
- source_word: ἔδωκεν
  choice: gab
  rationale: Die einfache Vergangenheitsform gibt δίδωμι direkt und klar wieder; „verlieh“ wäre interpretierender.
- source_word: δύναμιν
  choice: Macht
  rationale: „Macht“ bezeichnet hier die wirksame Kraft bzw. Fähigkeit des Drachen und wahrt die Unterscheidung von ἐξουσία.
- source_word: θρόνον
  choice: Thron
  rationale: „Thron“ bildet den königlichen und herrschaftlichen Sinn von θρόνος unmittelbar ab.
- source_word: ἐξουσίαν μεγάλην
  choice: große Vollmacht
  rationale: „Vollmacht“ bezeichnet verliehene bzw. ausübbare Herrschaftsbefugnis und unterscheidet sich im Deutschen deutlicher von δύναμις, das hier mit „Macht“ wiedergegeben wird.
- source_word: αὐτοῦ / αὐτῷ
  choice: sein / ihm
  rationale: Die deutschen maskulinen Pronomen folgen dem grammatischen Geschlecht von „Tier“ und „Drache“. Der jeweilige Bezug bleibt durch Satzbau und Wortfolge klar.
theological_decisions:
- issue: Verhältnis zwischen Drache und Tier in der Pronomenwiedergabe
  choice: Die Bezüge werden mit den grammatisch erforderlichen maskulinen Formen „ihm“ und „seine/seinen“ wiedergegeben.
  alternative: Das Tier durch Umschreibungen wiederholt nennen, um die Bezüge ausdrücklich zu unterscheiden.
  rationale: Anders als im Englischen verlangt das deutsche Substantiv „Tier“ das Pronomen „es“ grundsätzlich nicht in jeder Kasusform; hier sind „ihm“ und possessiv „sein“ grammatisch korrekt. Die unmittelbare Wortfolge macht deutlich, dass der Drache dem Tier das gibt, was dem Drachen gehört, ohne die personale oder symbolische Deutung weiter festzulegen.
- issue: Zusammengesetzte Tierbilder und Anklang an Daniel 7
  choice: Die Tiervergleiche werden im Haupttext ohne deutende Erweiterung direkt wiedergegeben.
  alternative: Den Anklang an Daniel 7 bereits im Haupttext ausdrücklich erklären.
  rationale: Der griechische Text beschreibt die Gestalt, deutet die Einzelbilder aber an dieser Stelle nicht aus. Der wahrscheinliche Bezug zu Daniel 7 gehört daher in eine Fußnote, nicht in den Bibeltext.
- issue: Unterscheidung von δύναμις und ἐξουσία
  choice: δύναμις wird mit „Macht“, ἐξουσία mit „Vollmacht“ wiedergegeben.
  alternative: Beide Begriffe mit „Macht“ wiedergeben oder ἐξουσία als „Herrschaft“ übersetzen.
  rationale: Die getrennte Wiedergabe erhält die Spannung zwischen wirksamer Macht und Herrschaftsbefugnis, ohne ein bestimmtes politisches oder dogmatisches System einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. „Glich“ vermeidet eine schwerfällige Wiederholung von „war wie“; „Maul“ ist bei den Tiervergleichen idiomatisch. Die Wiederholung „Maul ... Maul“ sowie die dreigliedrige Gabe „Macht, Thron und große Vollmacht“ bewahren Struktur und Nachdruck des griechischen Textes.
