id: REV.19.8
reference: Revelation 19:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: de
  text: Und ihr wurde gegeben, sich in feines Leinen zu kleiden, strahlend und rein; denn das feine Leinen sind die gerechten Taten[a] der Heiligen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerechten Handlungen“. Das griechische Wort kann in anderen Zusammenhängen auch „gerechte Forderungen“ oder „Satzungen“ bedeuten; hier sind am ehesten die gerechten Taten der Heiligen gemeint.'
    reason: Lexikalische Alternative und Bedeutungsbreite von δικαιώματα.
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: ihr wurde gegeben
  rationale: Die unpersönliche Passivform lässt den Geber wie im Griechischen unausgesprochen und bewahrt so den wahrscheinlichen göttlichen Passiv, ohne Gott ausdrücklich als Subjekt einzufügen.
- source_word: ἵνα περιβάληται
  choice: sich … zu kleiden
  rationale: Die Formulierung gibt den finalen beziehungsweise resultativen ἵνα-Satz natürlich wieder und wahrt durch das Reflexivpronomen die mediale Bedeutung des Verbs.
- source_word: βύσσινον
  choice: feines Leinen
  rationale: Die Bezeichnung meint hochwertigen feinen Leinenstoff; dieselbe Wiedergabe wird bei beiden Vorkommen beibehalten.
- source_word: λαμπρὸν καθαρόν
  choice: strahlend und rein
  rationale: „Strahlend“ bewahrt die Lichtwirkung von λαμπρός; „rein“ ist für καθαρός bei einem symbolisch bedeutsamen Gewand natürlich, ohne die folgende Deutung vorwegzunehmen.
- source_word: δικαιώματα
  choice: gerechte Taten
  rationale: Der Plural bezeichnet hier am natürlichsten gerechte Handlungen. Die Bedeutungsbreite bis hin zu gerechten Forderungen oder Satzungen wird in der Fußnote kenntlich gemacht.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: „Die Heiligen“ ist eine verständliche und im Deutschen etablierte neutestamentliche Bezeichnung für Gottes geheiligtes Volk.
theological_decisions:
- issue: Verhältnis zwischen dem geschenkten Gewand und den gerechten Taten
  choice: Das feine Leinen wird mit den gerechten Taten der Heiligen identifiziert, während zugleich gesagt wird, dass es der Braut gegeben wurde.
  alternative: Die Aussage könnte zugunsten ausschließlich göttlichen Handelns oder ausschließlich menschlicher Leistung aufgelöst werden.
  rationale: Der Vers hält göttliche Gabe und das gerechte Handeln der Heiligen nebeneinander. Die Übersetzung bewahrt diese Spannung und erklärt sie nicht konfessionell.
- issue: Nicht genannter Handelnder bei ἐδόθη
  choice: 'Der Geber bleibt unausgesprochen: „ihr wurde gegeben“.'
  alternative: „Gott gab ihr“ oder „es wurde ihr von Gott gewährt“.
  rationale: Ein göttlicher Geber liegt nahe, wird im griechischen Text aber nicht ausdrücklich genannt.
- issue: Bedeutung von δικαιώματα
  choice: „gerechte Taten“
  alternative: „gerechte Handlungen“, „Rechtsforderungen“ oder „Satzungen“
  rationale: Im unmittelbaren Bildzusammenhang ist die Deutung als Taten am wahrscheinlichsten; die Fußnote wahrt die echte lexikalische Spannweite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht auffällige Gleichsetzung „das feine Leinen sind die gerechten Taten“ folgt bewusst der ausdrücklichen Identifikation im griechischen Text, statt sie durch „steht für“ interpretierend abzuschwächen.
