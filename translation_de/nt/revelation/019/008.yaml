  source_fidelity: 'Die Übersetzung folgt dem griechischen Satzbau und den wesentlichen Bedeutungen genau: Das ungenannte Passiv von ἐδόθη bleibt unpersönlich („ihr wurde gegeben“), die mediale Nuance von περιβάληται ist durch „sich … zu kleiden“ gewahrt, und βύσσινον wird an beiden Stellen einheitlich als „feines Leinen“ wiedergegeben. „Strahlend und rein“ entspricht λαμπρὸν καθαρόν angemessen. Die erklärende Identifikation des Leinens mit τὰ δικαιώματα τῶν ἁγίων wird ohne zusätzliche theologische Deutung beibehalten.'
  naturalness: Das Deutsch ist modernes, würdevolles Standarddeutsch. Die Formulierung „das feine Leinen sind die gerechten Taten der Heiligen“ ist wegen der prädikativen Gleichsetzung mit einem Plural im Deutschen korrekt und bildet die absichtliche symbolische Identifikation des Ausgangstextes gut ab. Auch die nachgestellten Adjektive „strahlend und rein“ sind verständlich und stilistisch passend.
  terminology: „Heilige“ ist eine etablierte und sachgerechte Wiedergabe von ἅγιοι. „Gerechte Taten“ gibt δικαιώματα im vorliegenden Kontext wahrscheinlich wieder, ohne die im Satz zugleich vorhandene Gabe-Spannung aufzulösen. Die Fußnote nennt mit „gerechten Handlungen“, „gerechten Forderungen“ und „Satzungen“ relevante lexikalische Möglichkeiten, ohne sie für diesen Kontext vorzuziehen.
