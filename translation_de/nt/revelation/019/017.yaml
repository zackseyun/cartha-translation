id: REV.19.17
reference: Revelation 19:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: de
  text: 'Und ich sah einen Engel in der Sonne stehen. Er rief mit lauter Stimme allen Vögeln zu, die in der Himmelsmitte[a] flogen: „Kommt, versammelt euch zum großen Mahl Gottes!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „hoch am Himmel“ beziehungsweise „mitten am Himmel“. Das griechische Wort μεσουράνημα ist ein markanter apokalyptischer Ausdruck, der in der Offenbarung verwendet wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: einen Engel
  rationale: Die deutsche Form „einen“ entspricht hier sowohl grammatisch als unbestimmter Artikel als auch formal dem griechischen Zahlwort. „Einen einzigen Engel“ würde eine ausschließende Betonung hinzufügen, die der Kontext nicht verlangt.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: in der Sonne stehen
  rationale: Die auffällige apokalyptische Ortsangabe wird entsprechend ἐν wörtlich bewahrt und nicht deutend zu „vor der Sonne“ abgeschwächt.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: rief mit lauter Stimme
  rationale: Diese Formulierung gibt die Kraft von κράζω und die Wendung φωνῇ μεγάλῃ in natürlichem, würdevollem Deutsch wieder.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: allen Vögeln
  rationale: ὄρνεον bezeichnet allgemein einen Vogel. Dass hier aasfressende Vögel gemeint sind, ergibt sich erst aus dem Zusammenhang und wird nicht in das Substantiv eingetragen.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: die in der Himmelsmitte flogen
  rationale: „Himmelsmitte“ bewahrt den markanten apokalyptischen Ausdruck μεσουράνημα und bezeichnet den hohen beziehungsweise mittleren Bereich des Himmels.
- source_word: Δεῦτε
  choice: Kommt
  rationale: Der unmittelbare Aufruf wird knapp und idiomatisch als Imperativ wiedergegeben.
- source_word: συνάχθητε
  choice: versammelt euch
  rationale: Der Aufruf zum Zusammenkommen wird im Deutschen natürlich reflexiv formuliert, ohne einen nicht ausdrücklich genannten Handelnden für eine Passivform einzuführen.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: zum großen Mahl Gottes
  rationale: „Mahl“ gibt δεῖπνον wieder und vermeidet bei „Abendmahl“ eine im Deutschen naheliegende sakramentale Zusatzbedeutung. Die Genitivverbindung „Gottes“ bleibt erhalten.
theological_decisions:
- issue: Apokalyptische räumliche Bildsprache
  choice: in der Sonne stehen
  alternative: vor der Sonne stehen
  rationale: Die bewusst eindrückliche Bildsprache des griechischen Textes bleibt bestehen; die Ortsangabe wird nicht durch eine plausibilisierende Deutung ersetzt.
- issue: Bezeichnung des Mahls
  choice: großes Mahl Gottes
  alternative: großes Festmahl Gottes
  rationale: „Mahl“ wahrt die Verbindung zu δεῖπνον, ohne durch „Festmahl“ einen feierlichen Charakter hinzuzufügen oder durch „Abendmahl“ eine spezifisch sakramentale Lesart nahezulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche apokalyptische Bildsprache und der charakteristische Ausdruck „Himmelsmitte“ werden bewusst bewahrt.
