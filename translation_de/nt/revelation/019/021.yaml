id: REV.19.21
reference: Revelation 19:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: de
  text: Und die Übrigen wurden durch das Schwert dessen getötet[a], der auf dem Pferd saß – durch das Schwert[b], das aus seinem Mund hervorkam. Und alle Vögel fraßen sich an ihrem Fleisch satt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden erschlagen“.'
    reason: lexical_alternative
  - marker: b
    text: Das aus seinem Mund hervorkommende „Schwert“ gehört zur Bildsprache der Offenbarung; vergleiche Offenbarung 19,15.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: die Übrigen
  rationale: Bezeichnet knapp und natürlich die nach dem Gericht über das Tier und den falschen Propheten noch Verbleibenden.
- source_word: ἀπεκτάνθησαν
  choice: wurden getötet
  rationale: Bewahrt das Passiv des Aorists und ist in modernem Deutsch klarer und weniger altertümlich als „wurden erschlagen“.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: durch das Schwert
  rationale: Gibt den instrumentalen Sinn von ἐν mit Dativ wieder und bewahrt das konkrete, in der Offenbarung wiederkehrende Bild.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: dessen, der auf dem Pferd saß
  rationale: Folgt der griechischen Partizipialkonstruktion eng, ohne den Reiter über den Text hinaus näher zu bestimmen.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: durch das Schwert, das aus seinem Mund hervorkam
  rationale: Macht die attributive Beziehung zum Schwert eindeutig und erhält das anschauliche apokalyptische Bild.
- source_word: πάντα τὰ ὄρνεα
  choice: alle Vögel
  rationale: Übersetzt ὄρνεα ohne die kontextuell naheliegende, aber nicht ausdrücklich genannte Spezifizierung als Raub- oder Aasvögel.
- source_word: ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν
  choice: fraßen sich an ihrem Fleisch satt
  rationale: Gibt den resultativen Sinn von χορτάζω und die Nahrung beziehungsweise Quelle mit idiomatischem Deutsch wieder; ein wörtliches „wurden von ihrem Fleisch gesättigt“ wäre schwerfällig.
theological_decisions:
- issue: Wesen des Schwertes aus dem Mund des Reiters
  choice: Das konkrete Bild vom Schwert, das aus seinem Mund hervorkommt, bleibt im Haupttext stehen.
  alternative: Das Schwert ausdrücklich als sein Wort oder sein Gericht deuten.
  rationale: Der griechische Text legt apokalyptische Bildsprache vor, erklärt ihre Bedeutung hier aber nicht ausdrücklich; die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich vermeidet eine schwerfällige doppelte Genitivkonstruktion und verdeutlicht, dass beide Nennungen dasselbe Schwert bezeichnen. Die Schlusswendung ist bewusst idiomatisch, ohne die drastische Bildsprache abzuschwächen.
