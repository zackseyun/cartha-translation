id: REV.19.2
reference: Revelation 19:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: de
  text: 'Denn seine Urteile sind wahr und gerecht: Er hat die große Prostituierte gerichtet, die durch ihre Unzucht die Erde verdarb, und hat an ihr das Blut seiner Sklaven[a] gerächt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das griechische Wort bezeichnet Menschen, die einem Herrn gehören und ihm unterstellt sind.'
    reason: Lexikalische Alternative für δοῦλος; die deutsche Wiedergabe „Sklave“ trägt stärkere moderne Konnotationen, während „Diener“ den Zugehörigkeitsaspekt abschwächen kann.
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ
  choice: seine Urteile sind wahr und gerecht
  rationale: „Urteile“ bewahrt den richterlichen Sinn von κρίσεις; „wahr und gerecht“ gibt beide prädikativen Adjektive knapp und idiomatisch wieder.
- source_word: ἔκρινεν
  choice: hat … gerichtet
  rationale: Das Perfekt bezeichnet im Lobpreis eine vollzogene, für die Gegenwart bedeutsame Gerichtshandlung, ohne κρίνω auf „verurteilen“ zu verengen.
- source_word: τὴν πόρνην τὴν μεγάλην
  choice: die große Prostituierte
  rationale: „Prostituierte“ ist eine direkte, moderne und nicht altertümliche Wiedergabe von πόρνη und erhält die Kraft des apokalyptischen Bildes.
- source_word: ἔφθειρεν τὴν γῆν
  choice: die Erde verdarb
  rationale: „Verdarb“ kann moralische Verderbnis und ruinöse Wirkung ausdrücken und bewahrt damit die Bedeutungsbreite von φθείρω besser als eine eindeutige Festlegung auf bloße physische Zerstörung.
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: durch ihre Unzucht
  rationale: „Durch“ gibt den instrumentalen Sinn von ἐν wieder. „Unzucht“ ist im Deutschen knapp und lässt neben dem sexuellen Wortsinn auch die im Kontext mögliche bildliche Untreue anklingen.
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: hat … das Blut … gerächt
  rationale: Die feste deutsche Wendung „das Blut rächen“ gibt die gerichtliche Vergeltung von ἐκδικέω prägnant wieder.
- source_word: τῶν δούλων αὐτοῦ
  choice: seiner Sklaven
  rationale: „Sklaven“ bewahrt den stärkeren Sinn rechtlicher Zugehörigkeit in δοῦλος; die im kirchlichen Sprachgebrauch geläufigere Alternative „Diener“ wird in einer Fußnote genannt.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: an ihr
  rationale: Die griechische Wendung bezeichnet ihre Täterschaft beziehungsweise Verantwortlichkeit. „An ihr … gerächt“ ist die natürliche deutsche Form, ohne das schwer verständliche Bild „aus ihrer Hand“ wörtlich nachzubilden.
theological_decisions:
- issue: Bezeichnung der zu Gott gehörenden Menschen mit δοῦλοι
  choice: Sklaven
  alternative: Diener
  rationale: Der Haupttext erhält die starke Zugehörigkeits- und Abhängigkeitsbedeutung von δοῦλος. „Diener“ ist kontextuell möglich, schwächt diesen Aspekt jedoch ab und wird deshalb als Alternative ausgewiesen.
- issue: Bildliche Reichweite von πορνεία
  choice: Unzucht
  alternative: sexuelle Unmoral; bildlich auch Abgötterei beziehungsweise Untreue
  rationale: Der Haupttext soll den sexuellen Grundsinn und die metaphorische Offenheit der Offenbarung bewahren, ohne das Bild einseitig dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt feierlich und knapp; der Doppelpunkt verbindet die allgemeine Aussage über Gottes Urteile mit ihrer konkreten Begründung. Altertümliche Wörter wie „Hure“ wurden vermieden, während „Unzucht“ wegen seiner knappen und bildlich offenen Bedeutung beibehalten wurde.
