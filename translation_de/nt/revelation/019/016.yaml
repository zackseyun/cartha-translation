source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: de
  text: 'Und er hat auf seinem Gewand und auf seinem Oberschenkel einen geschriebenen Namen: König der Könige und Herr der Herren.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „einen eingeschriebenen Namen“. Wörtlich steht im Griechischen: „einen geschriebenen Namen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: trägt
  rationale: Das Präsens hält die lebendige Gegenwart der Vision fest. Im Deutschen verbindet „trägt“ die Person natürlich mit dem auf Gewand und Oberschenkel befindlichen Namen, ohne die Aussage zu einer bloßen Besitzangabe zu machen.
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: auf seinem Gewand
  rationale: ἱμάτιον bezeichnet ein Kleidungsstück oder Gewand. „Gewand“ ist im Deutschen würdig und zugleich ausreichend allgemein; das Possessivpronomen ergibt sich aus dem Zusammenhang und der Parallelphrase.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: auf seinem Oberschenkel
  rationale: μηρός bezeichnet den Oberschenkel. Beide Ortsangaben werden unmittelbar wiedergegeben, ohne ihre räumliche Beziehung erklärend aufzulösen.
- source_word: ὄνομα γεγραμμένον
  choice: einen geschriebenen Namen
  rationale: 'Die Formulierung bewahrt den statischen Sinn des Perfektpartizips: Der Name ist geschrieben und befindet sich dort. Sie vermeidet die stärkere Festlegung, die „eingraviert“ oder „eingeschrieben“ mit sich bringen könnte.'
- source_word: Βασιλεὺς βασιλέων
  choice: König der Könige
  rationale: Die traditionelle und genaue Wiedergabe erhält die steigernde Genitivkonstruktion und ihre erhabene königliche Wirkung.
- source_word: κύριος κυρίων
  choice: Herr der Herren
  rationale: „Herr“ gibt κύριος in diesem Hoheitstitel angemessen wieder; die parallele Genitivkonstruktion bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Namens beziehungsweise Hoheitstitels
  choice: König der Könige und Herr der Herren
  alternative: höchster König und höchster Herr
  rationale: Die wörtliche Titelform bewahrt sowohl die sprachliche Parallelität als auch die christologische Hoheitsaussage, ohne sie paraphrasierend zu erweitern.
- issue: Verhältnis der Ortsangaben „auf seinem Gewand“ und „auf seinem Oberschenkel“
  choice: Beide Ortsangaben werden nebeneinander beibehalten.
  alternative: auf seinem Gewand, und zwar über seinem Oberschenkel
  rationale: Der griechische Text enthält zwei parallele ἐπί-Phrasen und erklärt ihr genaues räumliches Verhältnis nicht. Die Übersetzung sollte diese offene Bildsprache nicht harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gewand“ und die traditionellen Hoheitstitel tragen dem feierlichen apokalyptischen Kontext Rechnung. Die ungewöhnliche doppelte Ortsangabe bleibt bewusst unerklärt.
