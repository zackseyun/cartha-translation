  naturalness: Der Satz ist verständlich und im würdigen Register passend. „hat … einen geschriebenen Namen“ ist hier die näher am griechischen Prädikat liegende Formulierung. Die Fußnotenalternative „eingetragen“ ist im heutigen Deutsch jedoch unpassend, da sie vor allem einen registrierten bzw. vermerkten Eintrag bezeichnet.
  terminology: „Gewand“, „Oberschenkel“, „König der Könige“ und „Herr der Herren“ sind treffend, modern verständlich und bewahren die Titelparallelität. Die räumliche Mehrdeutigkeit wird nicht unzulässig aufgelöst.
