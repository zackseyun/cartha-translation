    rationale: „Eingetragen“ bedeutet im modernen Deutsch gewöhnlich registriert oder in ein Verzeichnis aufgenommen und ist keine angemessene lexikalische Alternative zu γεγραμμένον. „eingeschrieben“ ist als mögliche, wenn auch spezifischere Alternative geeigneter.
