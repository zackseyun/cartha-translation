id: REV.19.19
reference: Revelation 19:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: de
  text: Und ich sah das Tier und die Könige der Erde und ihre Heere versammelt, um Krieg zu führen gegen den, der auf dem Pferd sitzt, und gegen sein Heer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zusammengezogen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um Krieg zu führen mit“; im Zusammenhang ist die Bedeutung feindlich: „gegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: das Tier
  rationale: In der Offenbarung ist θηρίον eine fest geprägte apokalyptische Bezeichnung. „Das Tier“ bewahrt die symbolische und bedrohliche Wirkung, ohne durch „Wildtier“ unnötig zu konkretisieren.
- source_word: βασιλεῖς τῆς γῆς
  choice: die Könige der Erde
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten; im weltweiten apokalyptischen Horizont der Offenbarung passt „Erde“ am besten.
- source_word: στρατεύματα αὐτῶν
  choice: ihre Heere
  rationale: Der Zusammenhang des Krieges legt die kollektive militärische Bedeutung „Heere“ nahe.
- source_word: συνηγμένα
  choice: versammelt
  rationale: Das Perfekt Passiv bezeichnet den Zustand, zusammengebracht worden zu sein. „Versammelt“ gibt dies knapp und natürlich wieder.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: um Krieg zu führen
  rationale: Die griechische Wendung bezeichnet das Führen eines Krieges. Die deutsche Formulierung ist idiomatisch und bewahrt den militärischen Sinn.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: gegen den, der auf dem Pferd saß
  rationale: Obwohl μετά mit Genitiv gewöhnlich „mit“ bedeutet, verlangt der Zusammenhang des Kriegführens hier eine gegnerische Beziehung. Die beschreibende Partizipialform bleibt erhalten.
- source_word: τοῦ καθημένου
  choice: der ... saß
  rationale: Das substantivierte Partizip wird als beschreibender Relativsatz wiedergegeben; dies ist im Deutschen natürlich und vermeidet die interpretierende Verkürzung „Reiter“.
- source_word: ἐπὶ τοῦ ἵππου
  choice: auf dem Pferd
  rationale: Dies ist eine direkte, moderne und verständliche Wiedergabe der Ortsangabe.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: gegen sein Heer
  rationale: Wie bei der vorherigen μετά-Verbindung ist die Bedeutung im Kriegskontext gegnerisch. Der Singular στρατεύματος wird kollektiv als „Heer“ wiedergegeben.
theological_decisions:
- issue: Identität dessen, der auf dem Pferd saß
  choice: Die beschreibende Formulierung des griechischen Textes bleibt stehen.
  alternative: „gegen den Messias“ oder „gegen Christus“
  rationale: Der unmittelbare Zusammenhang macht die Identität deutlich, doch dieser Vers verwendet selbst keinen christologischen Titel. Die Übersetzung fügt daher keinen ausdrücklich genannten Titel ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Aufzählungsstil, bleibt aber gut verständlich. Die Fußnotenmarker stehen gesammelt am Satzende und erläutern echte lexikalische Alternativen.
