id: REV.19.18
reference: Revelation 19:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: de
  text: damit ihr das Fleisch von Königen fresst, das Fleisch von Heerführern, das Fleisch von Mächtigen, das Fleisch von Pferden und von denen, die auf ihnen sitzen, und das Fleisch aller Menschen, der Freien wie der Sklaven, der Kleinen wie der Großen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: damit ihr … fresst
  rationale: ἵνα mit dem Aorist Konjunktiv bezeichnet hier Ziel beziehungsweise Folge des Aufrufs im vorherigen Vers. Bei Vögeln, die Fleisch verzehren, ist „fressen“ im Deutschen die natürliche und sachlich genaue Wortwahl.
- source_word: σάρκας
  choice: das Fleisch
  rationale: σάρξ bezeichnet in dieser Gerichtsszene buchstäblich das Fleisch körperlicher Wesen. Die Wiederholung wird beibehalten, weil sie den eindringlichen Rhythmus der Aufzählung prägt.
- source_word: βασιλέων
  choice: von Königen
  rationale: Die konkrete Bezeichnung für Könige wird nicht zum allgemeineren „Herrscher“ abgeschwächt.
- source_word: χιλιάρχων
  choice: von Heerführern
  rationale: χιλίαρχος bezeichnet einen hohen militärischen Befehlshaber, ursprünglich den Führer einer Tausendschaft. „Heerführer“ ist verständlich, knapp und erhält den militärischen Bezug.
- source_word: ἰσχυρῶν
  choice: von Mächtigen
  rationale: Das substantivierte Adjektiv kann Starke oder Mächtige bezeichnen. Im Zusammenhang der Ranggruppen gibt „Mächtige“ die soziale und militärische Macht passend wieder, ohne die Bedeutung auf bloße Körperkraft zu verengen.
- source_word: τῶν καθημένων ἐπ’ αὐτῶν
  choice: von denen, die auf ihnen sitzen
  rationale: Die Formulierung bleibt nahe am griechischen Partizip und bewahrt das Bild der auf den Pferden Sitzenden; „Reiter“ wäre eine mögliche, aber stärker verdichtete Wiedergabe.
- source_word: πάντων
  choice: aller Menschen
  rationale: Das ergänzte „Menschen“ macht im Deutschen klar, dass nach Pferden wieder sämtliche Personengruppen zusammengefasst werden; der Sinn des substantivisch gebrauchten πάντων bleibt erhalten.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: der Freien wie der Sklaven
  rationale: Das Gegensatzpaar bezeichnet den rechtlich-sozialen Status. „Sklaven“ gibt die Unfreiheit von δοῦλοι hier genauer wieder als „Diener“.
- source_word: μικρῶν καὶ μεγάλων
  choice: der Kleinen wie der Großen
  rationale: Die traditionelle Paarformel wird bewahrt und bezeichnet Menschen aller Rangstufen beziehungsweise gesellschaftlichen Bedeutung.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gegensatz zu Freien
  choice: Sklaven
  alternative: Diener
  rationale: Der ausdrückliche Gegensatz zu den Freien stellt den unfreien Rechts- und Sozialstatus in den Vordergrund. „Diener“ würde diesen Gegensatz abschwächen.
- issue: Reichweite von πάντων
  choice: aller Menschen
  alternative: aller
  rationale: πάντων fasst die anschließend genannten menschlichen Statusgruppen zusammen. Die Ergänzung „Menschen“ verhindert, dass Pferde in diese Zusammenfassung einbezogen erscheinen, ohne die Universalität der Aussage theologisch einzuschränken.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die anaphorische Wiederholung von „das Fleisch“ und die paarweisen Gegensätze bleiben wegen ihrer rhetorischen Wucht erhalten. „Fressen“ ist im Blick auf die angesprochenen Vögel weder salopp noch abwertend, sondern die idiomatische deutsche Bezeichnung für tierische Nahrungsaufnahme.
