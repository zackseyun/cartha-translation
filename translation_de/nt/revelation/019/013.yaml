id: REV.19.13
reference: Revelation 19:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: de
  text: 'Er trägt ein Gewand, das in Blut getaucht ist[a], und sein Name lautet: »Das Wort Gottes«.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das mit Blut befleckt ist«. Das griechische Verb bedeutet wörtlicher »eintauchen« oder »färben«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: Er trägt
  rationale: Das Perfektpartizip beschreibt seinen gegenwärtigen bekleideten Zustand. »Er trägt« ist im Deutschen natürlich und gibt diesen Zustand treffend wieder.
- source_word: ἱμάτιον
  choice: Gewand
  rationale: ἱμάτιον bezeichnet allgemein ein äußeres Kleidungsstück. »Gewand« passt zum erhabenen visionären Kontext, ohne die konkrete Form unnötig festzulegen.
- source_word: βεβαμμένον αἵματι
  choice: in Blut getaucht
  rationale: Das Partizip von βάπτω hat als Grundbedeutung »eintauchen« beziehungsweise »färben«. Die Wiedergabe bewahrt das eindringliche Bild und die Verbindung mit αἵματι.
- source_word: κέκληται
  choice: lautet
  rationale: Das Perfekt Passiv von καλέω bezeichnet hier den bleibenden Namen beziehungsweise Titel. Die deutsche Wendung »sein Name lautet« ist idiomatisch und bewahrt den resultativen Sinn.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: sein Name
  rationale: Natürliche deutsche Wiedergabe der griechischen Possessivkonstruktion.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: Das Wort Gottes
  rationale: λόγος ist hier der persönliche Titel des Reiters, nicht bloß eine unpersönliche Botschaft. Die Großschreibung kennzeichnet den Titel, ohne über den Wortlaut hinauszugehen.
theological_decisions:
- issue: Christologischer Titel λόγος
  choice: Das Wort Gottes
  alternative: die Botschaft Gottes
  rationale: Der bestimmte Ausdruck ὁ Λόγος τοῦ Θεοῦ wird im Kontext als persönlicher Name oder Titel des Reiters vorgestellt. »Das Wort Gottes« erhält diese Funktion und die johanneische Resonanz, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt hebt den folgenden persönlichen Titel klar hervor. Das ungewöhnlich starke Bild »in Blut getaucht« bleibt im Haupttext erhalten; die weniger konkrete Deutung »mit Blut befleckt« steht in der Fußnote.
