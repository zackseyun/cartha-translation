id: REV.19.6
reference: Revelation 19:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: de
  text: 'Und ich hörte etwas wie die Stimme einer großen Menschenmenge und wie das Rauschen vieler Wasser und wie das Rollen gewaltiger Donner. Sie riefen: »Halleluja! Denn der Herr, der Gott, der Allmächtige, herrscht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat die Herrschaft angetreten«, »ist König geworden« oder »hat geherrscht«. Das griechische Verb kann hier die entscheidende Offenbarung von Gottes Königsherrschaft feiern. Einige Handschriften lesen außerdem: »der Herr, unser Gott, der Allmächtige«.'
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: ἤκουσα
  choice: ich hörte
  rationale: Der Aorist von ἀκούω bezeichnet im Erzählgang unmittelbar das Hören.
- source_word: ὡς φωνὴν
  choice: etwas wie die Stimme / wie das Rauschen / wie das Rollen
  rationale: Das wiederholte ὡς kennzeichnet Vergleiche. φωνή kann Stimme oder Schall bedeuten; beim Menschen wird daher „Stimme“, bei Wasser und Donner idiomatisch deren jeweiliges Geräusch gewählt.
- source_word: ὄχλου πολλοῦ
  choice: einer großen Menschenmenge
  rationale: Gibt die sehr große versammelte Menge natürlich und verständlich wieder.
- source_word: ὑδάτων πολλῶν
  choice: vieler Wasser
  rationale: Bewahrt das biblisch-apokalyptische Bild; „Rauschen“ macht dabei den akustischen Sinn von φωνή im Deutschen deutlich.
- source_word: βροντῶν ἰσχυρῶν
  choice: gewaltiger Donner
  rationale: ἰσχυρός betont Stärke und Macht; „Rollen“ ist eine natürliche deutsche Wiedergabe des Donnerschalls.
- source_word: λεγόντων
  choice: Sie riefen
  rationale: Das Partizip steht im Plural und bezieht sich sinngemäß auf die Menschenmenge. „Sie riefen“ gibt die laute gemeinschaftliche Akklamation natürlicher wieder als „sagend“.
- source_word: Ἁλληλουϊά
  choice: Halleluja
  rationale: Die im Deutschen etablierte liturgische Transliteration bewahrt den Charakter des Ausrufs.
- source_word: ὅτι
  choice: Denn
  rationale: Leitet den Grund für den Lobpreis ein und passt zum würdigen doxologischen Ton.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: der Herr, Gott, der Allmächtige
  rationale: Folgt dem vorliegenden SBLGNT-Text ohne das in einigen Handschriften bezeugte „unser“ und erhält die appositionelle Titelfolge.
- source_word: ἐβασίλευσεν
  choice: herrscht
  rationale: Der Aorist feiert hier Gottes Königsherrschaft als entscheidend hervorgetretene Wirklichkeit. Das deutsche Präsens ist in der Akklamation natürlich und vermeidet, einen Beginn seiner Herrschaft ausdrücklich in den Text hineinzulegen.
theological_decisions:
- issue: Zeit- und Aspektwert von ἐβασίλευσεν
  choice: herrscht
  alternative: hat die Herrschaft angetreten; ist König geworden; hat geherrscht
  rationale: Der Kontext feiert die entscheidende Offenbarung von Gottes Herrschaft. „Herrscht“ wahrt die Akklamation, ohne festzulegen, Gottes Souveränität habe erst jetzt begonnen; die möglichen aspektuellen Nuancen werden in der Fußnote offengelegt.
- issue: Textgestalt bei ὁ θεός
  choice: der Herr, Gott, der Allmächtige
  alternative: der Herr, unser Gott, der Allmächtige
  rationale: Der Haupttext folgt dem angegebenen SBLGNT-Wortlaut, der kein ἡμῶν („unser“) enthält. Die abweichende Lesart wird nicht stillschweigend übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die dreifache Vergleichsstruktur bleibt erkennbar; bei Wasser und Donner wird φωνή idiomatisch als hörbares Rauschen beziehungsweise Rollen ausgedrückt.
