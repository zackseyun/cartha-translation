id: REV.19.10
reference: Revelation 19:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: de
  text: 'Und ich fiel vor seinen Füßen nieder, um ihn anzubeten. Doch er sagte zu mir: »Tu das nicht! Ich bin ein Mitsklave, gemeinsam mit dir und deinen Brüdern[b], die das Zeugnis Jesu[a] haben. Bete Gott an! Denn das Zeugnis Jesu ist der Geist der Prophetie.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Zeugnis Jesu“ kann „das Zeugnis über Jesus“ oder „das Zeugnis, das Jesus gibt“ bedeuten. Dieselbe Mehrdeutigkeit gilt für die Wendung am Ende des Verses.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „deine Brüder und Schwestern“; „Brüder“ kann hier die Glaubensgeschwister insgesamt bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Denn das Zeugnis Jesu ist das Wesen der Prophetie.“ Die wörtliche Wiedergabe „Geist der Prophetie“ lässt offen, ob „Geist“ hier den prägenden Kern, die treibende Kraft oder den Geist Gottes bezeichnet.'
    reason: interpretive_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: ich fiel vor seinen Füßen nieder
  rationale: Die Formulierung bewahrt sowohl die körperliche Bewegung als auch ἔμπροσθεν („vor“); „niederfallen“ ist im Deutschen für diese Haltung natürlich.
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: um ihn anzubeten / Bete Gott an
  rationale: Da der Engel die Handlung entschieden zurückweist und sie auf Gott ausrichtet, gibt „anbeten“ hier die religiöse Bedeutung von προσκυνέω klar wieder.
- source_word: Ὅρα μή
  choice: Tu das nicht!
  rationale: Die kurze, scharfe Warnung gibt das abrupte griechische Verbot in natürlichem modernem Deutsch wieder.
- source_word: σύνδουλός
  choice: Mitsklave
  rationale: Das Wort bezeichnet jemanden, der denselben Sklavenstatus teilt. Im Kontext betont der Engel seine gemeinsame Unterordnung unter Gott und weist gerade deshalb Anbetung zurück.
- source_word: ἀδελφῶν σου
  choice: deine Brüder
  rationale: Die maskuline Pluralform wird formal bewahrt; im Kontext kann sie die Glaubensgeschwister insgesamt repräsentieren.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: die das Zeugnis Jesu haben
  rationale: „Haben“ entspricht ἔχω ohne eine zusätzliche Vorstellung wie Festhalten oder Verkündigen einzutragen. „Zeugnis Jesu“ bewahrt die Mehrdeutigkeit des Genitivs.
- source_word: μαρτυρία Ἰησοῦ
  choice: das Zeugnis Jesu
  rationale: Der deutsche Genitiv lässt wie der griechische sowohl ein Zeugnis über Jesus als auch ein von Jesus ausgehendes Zeugnis zu.
- source_word: πνεῦμα τῆς προφητείας
  choice: der Geist der Prophetie
  rationale: Die formnahe Wiedergabe bewahrt das theologisch gewichtige πνεῦμα und vermeidet die verengende Deutung als bloßes „Wesen“ oder „Kern“ der Prophetie.
theological_decisions:
- issue: Bedeutung des Genitivs in μαρτυρία Ἰησοῦ
  choice: Die mehrdeutige Formulierung „das Zeugnis Jesu“ bleibt im Haupttext erhalten.
  alternative: „das Zeugnis über Jesus“ oder „das Zeugnis, das Jesus gibt“
  rationale: Der griechische Genitiv kann objektiv oder subjektiv verstanden werden. Der Ausgangstext entscheidet nicht eindeutig zwischen beiden Möglichkeiten; daher wird die Spannung nicht aufgelöst.
- issue: Wiedergabe von σύνδουλος
  choice: Mitsklave
  alternative: Mitdiener oder Mitknecht
  rationale: Der Zusammenhang hebt die gemeinsame völlige Unterordnung des Engels, des Johannes und der übrigen Glaubenden unter Gott hervor. „Mitdiener“ schwächt diesen Status ab, während „Mitknecht“ heute altertümlich klingt.
- issue: Bezug von πνεῦμα in „Geist der Prophetie“
  choice: Die formale Wendung bleibt ohne ausdrückliche Identifikation des Geistes erhalten.
  alternative: „das Wesen der Prophetie“ oder eine ausdrückliche Deutung als Heiliger Geist
  rationale: Die griechische Formulierung lässt den genauen Sinn von πνεῦμα offen. Eine Festlegung auf „Wesen“ oder eine ausdrücklich trinitarische Ergänzung würde mehr sagen als der Vers selbst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich. „Mitsklave“ ist bewusst stärker als „Mitdiener“, während die Einschubkonstruktion „genau wie du und deine Brüder“ eine im Deutschen schwerfällige Genitiv- oder Präpositionalfügung vermeidet.
