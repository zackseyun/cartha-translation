source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: de
  text: Und aus seinem Mund kommt ein scharfes Schwert, damit er damit die Völker schlägt; und er selbst wird sie mit eisernem Stab hüten[a], und er selbst tritt die Kelter des Weines der Wut des Zornes Gottes, des Allmächtigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird über sie mit eisernem Stab herrschen“. Das griechische Verb bedeutet wörtlich „als Hirte hüten“ und bezeichnet hier zugleich königliche Herrschaft in Anlehnung an Psalm 2.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: kommt
  rationale: Das Präsens zeichnet das Hervorkommen des Schwertes anschaulich. „Kommt“ ist im modernen Deutschen natürlich und lässt die Bewegungsrichtung aus dem Mund durch die vorangestellte Wendung erkennen.
- source_word: ῥομφαία ὀξεῖα
  choice: ein scharfes Schwert
  rationale: ῥομφαία bezeichnet ein großes Schwert; die allgemeinere Wiedergabe „Schwert“ bewahrt das Bild, ohne eine bestimmte historische Waffenart festzulegen. ὀξεῖα wird unmittelbar mit „scharf“ wiedergegeben.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: damit er mit ihm … schlägt
  rationale: ἵνα mit Konjunktiv bezeichnet hier den Zweck; ἐν αὐτῇ ist instrumental. „Schlägt“ bewahrt die Aussage von πατάσσω, ohne das nicht ausdrücklich enthaltene Ergebnis „niederschlagen“ hinzuzufügen.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: ἔθνη bezeichnet hier kollektiv die Völker. „Völker“ ist im Deutschen natürlicher als „Nationen“ und legt die Wendung nicht einseitig auf Nichtjuden fest.
- source_word: ποιμανεῖ
  choice: wird … hüten
  rationale: Das Verb bedeutet wörtlich, als Hirte zu weiden oder zu hüten. „Hüten“ erhält das Hirtenbild und zugleich im Zusammenhang mit dem eisernen Stab die Spannung zwischen fürsorglicher und königlicher Herrschaft.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: mit eisernem Stab
  rationale: Das instrumentale ἐν wird mit „mit“ wiedergegeben. „Eiserner Stab“ ist eine knappe und traditionelle, zugleich verständliche Formulierung.
- source_word: πατεῖ τὴν ληνὸν
  choice: tritt die Kelter
  rationale: „Die Kelter treten“ ist eine geläufige und bildgetreue deutsche Wendung für das Auspressen der Trauben mit den Füßen; das Präsens bewahrt die lebendige Darstellung.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: des Weines der Zornglut des Zornes
  rationale: Die gestaffelten Genitive und beide nahe verwandten Zornbegriffe bleiben erhalten. „Zornglut“ gibt θυμός als heftige, aufflammende Erregung wieder, während „Zorn“ ὀργή bezeichnet.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: Gottes, des Allmächtigen
  rationale: Die Apposition bewahrt παντοκράτωρ als göttlichen Titel und entspricht natürlichem, würdigem Deutsch.
theological_decisions:
- issue: ποιμανεῖ als Hirtenmetapher in der Anspielung auf Psalm 2 und im Gerichtskontext
  choice: wird sie mit eisernem Stab hüten
  alternative: wird über sie mit eisernem Stab herrschen
  rationale: Der griechische Wortlaut verwendet ausdrücklich das Verb für das Hüten als Hirte. Die Hauptfassung erhält dieses Bild und damit die Spannung zwischen Hirtenamt, königlicher Herrschaft und Gericht; die sachlich mögliche Deutung „herrschen“ wird in einer Fußnote genannt.
- issue: Doppelte Zornformulierung θυμοῦ τῆς ὀργῆς
  choice: der Zornglut des Zornes
  alternative: des heftigen Zornes
  rationale: Die Quelle verwendet zwei semantisch verwandte Substantive zur rhetorischen Steigerung. Beide werden sichtbar bewahrt, statt sie zu einem einzigen Ausdruck zusammenzuziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst dichter Bildsprache. Die Wiederholung „er selbst“ gibt das zweimalige emphatische αὐτός wieder. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert; die syntaktische Abfolge und die wiederholte Hervorhebung bleiben erhalten.
