source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: de
  text: Lasst uns froh sein und jubeln und ihm die Herrlichkeit geben[a], denn die Hochzeit des Lammes ist gekommen, und seine Braut[b] hat sich bereit gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir werden ihm die Herrlichkeit geben.“ Das griechische Verb steht formal im Futur, hat hier in der Reihe der Aufforderungen jedoch wahrscheinlich auffordernden Sinn.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „seine Frau“. Das griechische Wort γυνή kann „Frau“, „Ehefrau“ oder im Zusammenhang einer Hochzeit „Braut“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν καὶ ἀγαλλιῶμεν
  choice: Lasst uns jubeln und uns von Herzen freuen
  rationale: Die beiden hortatorischen Konjunktive werden als gemeinsamer Aufruf wiedergegeben. „jubeln“ und „sich von Herzen freuen“ bewahren die gesteigerte, überschwängliche Freude, ohne die Verben zu einer bloßen Wiederholung einzuebnen.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: Lasst uns ihm die Ehre geben
  rationale: Obwohl δώσομεν formal Futur ist, legt die Parallelität mit den vorangehenden Aufforderungen eine hortative Funktion nahe. Die deutsche Wendung ist natürlich und wahrt den doxologischen Sinn.
- source_word: ἦλθεν ὁ γάμος
  choice: die Hochzeit ist gekommen
  rationale: Das Perfekt gibt den Aorist als eingetretenes Ereignis mit gegenwärtiger Bedeutung wieder. „Hochzeit“ bezeichnet hier natürlich den bevorstehenden Vollzug der ehelichen Vereinigung, ohne das erst im folgenden Vers ausdrücklich genannte Hochzeitsmahl vorwegzunehmen.
- source_word: τοῦ ἀρνίου
  choice: des Lammes
  rationale: Die etablierte johanneische Christusbezeichnung wird wörtlich und als Titel verstanden wiedergegeben.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: seine Braut
  rationale: γυνή kann Frau, Ehefrau oder im Hochzeitszusammenhang Braut bedeuten. Wegen der Hochzeits- und Vorbereitungsszene ist „Braut“ im Deutschen am treffendsten; die mögliche Wiedergabe „Frau“ wird in der Fußnote bewahrt.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: hat sich bereit gemacht
  rationale: Die Formulierung wahrt das reflexive Moment und klingt in der Bildsprache der Vorbereitung auf eine Hochzeit natürlich.
theological_decisions:
- issue: Wiedergabe von γυνὴ αὐτοῦ in der eschatologischen Hochzeitsbildsprache
  choice: seine Braut
  alternative: seine Frau
  rationale: „Braut“ entspricht der Szene, in der die Hochzeit gekommen ist und die Frau sich vorbereitet hat. „Frau“ ist lexikalisch möglich und wird deshalb als Alternative kenntlich gemacht, ohne die Identität der dargestellten Gemeinschaft näher auszudeuten.
- issue: Aussageweise von δώσομεν innerhalb der Aufforderungsreihe
  choice: Lasst uns ihm die Ehre geben
  alternative: Wir werden ihm die Ehre geben
  rationale: Das Futur steht zwischen hortatorischen Konjunktiven und lässt sich im Zusammenhang am besten als Fortsetzung des gemeinsamen Aufrufs verstehen. Die formal mögliche Zukunftsaussage bleibt als grammatische Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufforderungsreihe ist rhythmisch und für eine gottesdienstliche Proklamation geeignet. „Ehre geben“ ist verständlicher als das stärker kirchensprachliche „Herrlichkeit geben“, ohne den doxologischen Gehalt von δόξα abzuschwächen.
