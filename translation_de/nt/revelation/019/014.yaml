id: REV.19.14
reference: Revelation 19:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: de
  text: Und die Heere im Himmel[a] folgten ihm auf weißen Pferden; sie waren in feines, weißes und reines Leinen gekleidet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Heere des Himmels«. Wörtlich: »die Heere, die im Himmel sind«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύματα
  choice: Heere
  rationale: Der Plural bezeichnet organisierte militärische Verbände. »Heere« ist im Deutschen direkt, verständlich und dem erhöhten Ton der Vision angemessen.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: 'Die griechische Formulierung ist zunächst lokal: Es sind die Heere, die sich im Himmel befinden. Die Wiedergabe vermeidet eine weitergehende Bestimmung ihrer Identität.'
- source_word: ἠκολούθει αὐτῷ
  choice: folgten ihm
  rationale: Das Imperfekt schildert das fortdauernde Geschehen innerhalb der Vision. Im natürlichen deutschen Erzählstil kann dies mit dem Präteritum ausgedrückt werden.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: auf weißen Pferden
  rationale: Die Formulierung gibt das Reiten beziehungsweise die berittene Begleitung idiomatisch wieder und bewahrt die symbolisch bedeutsame Farbangabe.
- source_word: ἐνδεδυμένοι
  choice: sie waren … gekleidet
  rationale: Die finite Auflösung des Partizips macht den Bezug auf die Heere im Deutschen eindeutig und erhält den beschriebenen Zustand.
- source_word: βύσσινον
  choice: Leinen
  rationale: Das Wort bezeichnet hochwertiges feines Leinen. Im Zusammenhang mit Kleidung ist »Leinen« natürlich; die besondere Qualität ist aus dem biblischen Bildfeld erkennbar, ohne ein zusätzliches deutsches Adjektiv einzuführen.
- source_word: λευκὸν καθαρόν
  choice: weißes, reines
  rationale: Beide Adjektive werden als eigenständige Merkmale des Leinens bewahrt. »Rein« gibt καθαρόν wieder, ohne seine visuelle und kultisch-moralische Bedeutungsbreite auf »sauber« einzuengen.
theological_decisions:
- issue: Identität der Heere im Himmel
  choice: Die Gruppen werden lediglich als »die Heere im Himmel« bezeichnet.
  alternative: Sie ausdrücklich als Engel, verherrlichte Heilige oder beide Gruppen zu bestimmen.
  rationale: Der Vers nennt ihren Aufenthaltsort und ihre Erscheinung, bestimmt ihre Identität aber nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Bildsprache. Das Semikolon und die finite Auflösung des Partizips verhindern einen missverständlichen grammatischen Bezug von »gekleidet« auf die Pferde.
