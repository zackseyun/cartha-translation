reference: Revelation 19:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: de
  text: 'Und vom Thron ging eine Stimme aus, die sagte: „Lobt unseren Gott, alle seine Sklaven[a] und alle, die ihn fürchten[b], die Kleinen und die Großen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Diener“. Das griechische Wort δοῦλοι kann je nach Zusammenhang Sklaven oder Diener bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „die ihn ehrfürchtig verehren“. Die Wendung bezeichnet hier die von Ehrfurcht und Treue geprägte Haltung gegenüber Gott.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: eine Stimme
  rationale: Da die Stimme anschließend als redend beschrieben wird, ist „Stimme“ hier natürlicher und genauer als „Laut“ oder „Geräusch“.
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: ging vom Thron aus
  rationale: Die Formulierung gibt sowohl den Thron als Ursprung als auch die Bewegung des griechischen Verbs ἐξέρχομαι wieder und klingt im Deutschen idiomatisch.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: Lobt unseren Gott
  rationale: Der Pluralimperativ wird direkt wiedergegeben; das Dativobjekt nach αἰνέω entspricht im Deutschen dem Akkusativobjekt nach „loben“.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: alle seine Sklaven
  rationale: „Sklaven“ bewahrt den starken Sinn der Zugehörigkeit und Gebundenheit in δοῦλοι. Die im Deutschen geläufigere, aber semantisch schwächere Alternative „Diener“ wird in einer Fußnote genannt.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: alle, die ihn fürchten
  rationale: Die Wiedergabe bewahrt die biblische Rede von Gottesfurcht, ohne sie auf bloße Angst zu verengen oder durch eine interpretierende Paraphrase zu ersetzen.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: die Kleinen und die Großen
  rationale: Die substantivierten Adjektive folgen der griechischen Form und umfassen Menschen unabhängig von Rang oder gesellschaftlicher Stellung.
theological_decisions:
- issue: Wiedergabe von δοῦλοι als Bezeichnung der Gott Zugehörenden
  choice: Sklaven
  alternative: Diener
  rationale: Der Haupttext wahrt die in δοῦλος enthaltene Dimension vollständiger Zugehörigkeit und Dienstbindung. „Diener“ ist kontextuell möglich, schwächt diesen Aspekt jedoch ab.
- issue: Bedeutung der Gottesfurcht
  choice: die ihn fürchten
  alternative: die ihn ehrfürchtig verehren
  rationale: Die traditionelle biblische Ausdrucksweise lässt Ehrfurcht, Gehorsam und tatsächliches Fürchten zusammenklingen. Die Alternative erläutert einen wesentlichen Aspekt, würde die Spannung im Haupttext aber stärker auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der feierlichen Proklamation des griechischen Textes; „Sklaven“ ist bewusst stark und wird wegen seiner möglichen Härte durch eine Fußnote erläutert.
