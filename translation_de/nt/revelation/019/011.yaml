  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: de
  text: 'Und ich sah den Himmel offen stehen, und sieh: ein weißes Pferd. Der, der darauf sitzt, wird »Treu und Wahrhaftig« genannt, und in Gerechtigkeit richtet er und führt Krieg.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Recht«.'
    reason: δικαιοσύνη kann in diesem Zusammenhang die Nuance gerechten Rechts beziehungsweise gerechter Rechtsprechung tragen; die knappe Alternative wahrt dabei die Offenheit der griechischen Wendung.
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: offen stehen
  rationale: Das Perfekt Passiv beschreibt den Himmel als geöffnet und nun offen. Die deutsche Wendung gibt diesen resultativen Zustand natürlich wieder.
- source_word: ἰδοὺ
  choice: sieh
  rationale: Der kurze Aufforderungsausdruck bewahrt die lebhafte, visionäre Hinweisfunktion, ohne altertümlich zu wirken.
- source_word: ἵππος λευκός
  choice: ein weißes Pferd
  rationale: Direkte und natürliche Wiedergabe der Nominalgruppe.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: der darauf sitzt
  rationale: Bleibt nah an der substantivierten Partizipialkonstruktion und vermeidet die leicht interpretierende Verkürzung zu »der Reiter«.
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: wird »Treu und Wahrhaftig« genannt
  rationale: καλούμενος bezeichnet die Benennung; beide Adjektive werden im Kontext als zusammengehörige Bezeichnungen der Gestalt wiedergegeben.
- source_word: πιστός
  choice: Treu
  rationale: Bewahrt die Bedeutung von verlässlicher, beständiger Treue und eignet sich als titelartige Benennung.
- source_word: ἀληθινός
  choice: Wahrhaftig
  rationale: Gibt hier nicht nur sachliche Wahrheit, sondern echte Wahrhaftigkeit und Zuverlässigkeit wieder und bildet mit »Treu« ein natürliches Titelpaar.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Bewahrt die breite Bedeutung von δικαιοσύνη und lässt offen, ob besonders die Eigenschaft, der Maßstab oder die Art seines Handelns betont ist.
- source_word: κρίνει
  choice: richtet er
  rationale: Direkte Wiedergabe des Präsens; die deutsche Verbwahl passt zum gerichtlichen Kontext.
- source_word: πολεμεῖ
  choice: führt Krieg
  rationale: Natürliche moderne Wiedergabe der militärischen Bedeutung von πολεμέω, ohne die Aussage zu verharmlosen.
theological_decisions:
- issue: Darstellung der Bezeichnungen des Reiters
  choice: »Treu und Wahrhaftig« als titelartige Benennungen
  alternative: »treu und wahrhaftig« als rein beschreibende Adjektive
  rationale: Die Konstruktion mit καλούμενος und der unmittelbare Kontext legen Bezeichnungen der Gestalt nahe. Anführungszeichen kennzeichnen die Namensfunktion, ohne ihre Identität über den Wortlaut hinaus festzulegen.
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht
  rationale: »Gerechtigkeit« erhält den umfassenden ethischen und forensischen Bedeutungsraum. Die kontextuell mögliche Betonung gerechten Rechtshandelns wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter apokalyptischer Anschaulichkeit. »Sieh« erhält den visionären Nachdruck; die Satzteilung verbessert die Verständlichkeit, ohne die Abfolge des griechischen Textes aufzulösen.
