review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Textes zuverlässig wieder: der geöffnete Himmel als fortdauernder Zustand, der visionäre Hinweis, das weiße Pferd, die namensartige Bezeichnung des darauf Sitzenden sowie sein Richten und Kriegführen in Gerechtigkeit. »Offen stehen« bildet den resultativen Charakter des Perfektpassivs angemessen ab.'
  naturalness: Die Formulierung »Der darauf sitzt, wird … genannt« ist im Deutschen syntaktisch missverständlich bzw. nicht sauber als substantivierte Relativkonstruktion markiert. »Der, der darauf sitzt, wird … genannt« ist eindeutig und modernes Standarddeutsch. Im Übrigen sind Satzrhythmus und Register gelungen.
  terminology: »Treu und Wahrhaftig« ist als titelartige Wiedergabe von πιστός und ἀληθινός idiomatisch und kontextgerecht. »Gerechtigkeit« für δικαιοσύνη wahrt die Breite des griechischen Begriffs. Die Fußnote kann die forensische Nuance ausdrücken, sollte aber nicht den Eindruck erwecken, dies sei eine enger gleichwertige wörtliche Übersetzung.
  issues:
  - severity: medium
    issue: Syntaktische Markierung von »Der darauf sitzt«
    rationale: 'Im Satz »Der darauf sitzt, wird … genannt« fehlt für die beabsichtigte substantivierte Relativkonstruktion die Wiederaufnahme mit Komma: »Der, der darauf sitzt, …«. Ohne diese Markierung ist die Konstruktion missverständlich und grammatisch unsauber.'
  - severity: low
    issue: Fußnote zu δικαιοσύνη ist zu paraphrastisch
    rationale: »Nach dem Maßstab des Rechts« erläutert eine mögliche forensische Anwendung, ist aber keine enge Alternative zu ἐν δικαιοσύνῃ. Eine knappe Alternative wie »in/mit Recht« erhält die lexikalische Offenheit besser.
