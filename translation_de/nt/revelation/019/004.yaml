id: REV.19.4
reference: Revelation 19:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: de
  text: 'Und die vierundzwanzig Ältesten und die vier Lebewesen fielen nieder, beteten Gott an, der auf dem Thron sitzt, und sagten: „Amen! Halleluja![a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische „Halleluja“ bedeutet: „Lobt den HERRN!“; wörtlich: „Lobt Jah!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: fielen nieder
  rationale: Der Aorist von πίπτω bezeichnet hier im Zusammenhang mit der Anbetung das ehrfürchtige Niederfallen. „Fielen nieder“ bleibt nah am griechischen Ausdruck und ist im Deutschen natürlich.
- source_word: οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: die vierundzwanzig Ältesten
  rationale: „Älteste“ ist die übliche und verständliche Wiedergabe von πρεσβύτεροι in der Offenbarung und vermeidet den engeren kirchenamtlichen Klang von „Presbyter“.
- source_word: τὰ τέσσαρα ζῷα
  choice: die vier Lebewesen
  rationale: ζῷα bezeichnet hier die lebenden Wesen im himmlischen Thronsaal, nicht gewöhnliche Tiere. „Lebewesen“ ist präzise und im heutigen Deutsch gut verständlich.
- source_word: προσεκύνησαν
  choice: beteten ... an
  rationale: Da Gott das ausdrückliche Objekt ist, bezeichnet das Verb religiöse Anbetung und nicht nur eine Ehrerweisung.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: der auf dem Thron sitzt
  rationale: Der substantivierte Präsenspartizipialsatz identifiziert Gott als den gegenwärtig auf dem Thron Sitzenden. Der deutsche Relativsatz gibt dies natürlich wieder.
- source_word: λέγοντες
  choice: und sagten
  rationale: Die koordinierte Wiedergabe ist im Deutschen flüssiger als „sagend“ und verbindet die Akklamation unmittelbar mit der Anbetung.
- source_word: Ἀμήν
  choice: Amen
  rationale: Die feststehende liturgische Akklamation wird, wie im Deutschen üblich, transliteriert.
- source_word: Ἁλληλουϊά
  choice: Halleluja
  rationale: Die aus dem Hebräischen übernommene liturgische Akklamation ist im Deutschen in dieser Form eingebürgert; ihre Bedeutung wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe der hebräischen liturgischen Akklamation Ἁλληλουϊά im griechischen Text
  choice: Halleluja
  alternative: Lobt den HERRN! / Lobt Jah!
  rationale: Die Transliteration bewahrt den Charakter einer feststehenden gottesdienstlichen Akklamation und entspricht dem deutschen Sprachgebrauch. Die zugrunde liegende Bedeutung und der darin enthaltene Kurzname Gottes werden in der Fußnote offengelegt, ohne die Ausdrucksform im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Ablauf, vermeidet jedoch das im Deutschen schwerfällige Partizip „sagend“. „Lebewesen“ hält Abstand zur missverständlichen Wiedergabe „Tiere“.
