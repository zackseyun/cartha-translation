  verdict: approve
  source_fidelity: 'Der Text gibt alle Elemente des griechischen Satzes zutreffend wieder: das Niederfallen, die vierundzwanzig Ältesten, die vier Lebewesen, die Anbetung Gottes als des auf dem Thron Sitzenden sowie die beiden Akklamationen. „Fielen nieder“ trifft die kultisch-ehrerbietige Bedeutung von ἔπεσαν im Kontext; „beteten Gott an“ gibt προσεκύνησαν bei Gott als Objekt angemessen wieder.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die finite Wiedergabe „und sagten“ ist für das griechische Partizip λέγοντες idiomatisch und beeinträchtigt weder den Zusammenhang noch die Aussage.
  terminology: „Älteste“, „Lebewesen“, „Amen“ und „Halleluja“ sind sachgerecht und in der deutschen Offenbarungstradition verständlich. Die Fußnote erläutert die hebräische Akklamation zutreffend; die Wiedergabe „HERRN“ als traditionelle Bedeutungsumschreibung und „Jah“ als wörtlichere Alternative wahrt den Unterschied.
