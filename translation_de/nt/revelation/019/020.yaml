revisions:
- from: Und das Tier wurde ergriffen und mit ihm der falsche Prophet, der vor seinen Augen die Zeichen getan hatte, durch die er diejenigen verführte, die das Kennzeichen des Tieres angenommen hatten und sein Bild anbeteten. Die beiden wurden lebendig in den Feuersee geworfen, der mit Schwefel brennt.
  to: Und das Tier wurde ergriffen und mit ihm der falsche Prophet, der vor dessen Augen die Zeichen getan hatte, durch die er diejenigen verführte, die das Mal des Tieres angenommen hatten und dessen Bild anbeteten. Die beiden wurden lebendig in den Feuersee geworfen, der mit Schwefel brennt.
  rationale: 'Die Revision beschränkt sich auf sichere sprachliche und terminologische Korrekturen: „Mal“ gibt χάραγμα unmittelbar wieder; „dessen“ klärt die im griechischen Satz eindeutigen Rückbezüge auf das Tier. Die apokalyptische Bildsprache, die passive Gefangennahme, das instrumentale „durch die“, die Vorzeitigkeit der Partizipien und die Aussage, dass beide lebendig in den Feuersee geworfen werden, bleiben erhalten.'
