review_pass:
  verdict: revise
  source_fidelity: Die Satzglieder und die Abfolge entsprechen dem griechischen Text insgesamt gut. Die Bezüge von ἐνώπιον αὐτοῦ und εἰκόνι αὐτοῦ müssen im Deutschen jedoch eindeutig auf das Tier bezogen werden. Für χάραγμα ist „Mal“ die in der Offenbarung etablierte, unmittelbare Wiedergabe und präziser als das etwas interpretierende „Kennzeichen“.
  naturalness: Der Text ist gut lesbares modernes Standarddeutsch. „vor dessen Augen“ und „dessen Bild“ beseitigen eine mögliche missverständliche oder stilistisch unruhige maskuline Rückverweisung nach dem neutralen „Tier“, ohne die Personhaftigkeit der Gestalt auszudeuten.
  terminology: „Tier“, „falscher Prophet“, „Zeichen“, „Mal“, „anbeten“, „Feuersee“ und „Schwefel“ bewahren die geläufige biblisch-apokalyptische Terminologie. „Mal“ entspricht χάραγμα und wahrt zugleich die Verbindung zu den übrigen Stellen der Offenbarung.
  issues:
  - severity: medium
    issue: „Kennzeichen“ für χάραγμα
    rationale: „Kennzeichen“ kann allgemein ein unterscheidendes Merkmal bezeichnen und schwächt die konkrete, etablierte Bildsprache. „Mal“ ist die direkte und in der Offenbarung konventionelle Wiedergabe von χάραγμα.
  - severity: low
    issue: Potentiell unklarer Bezug in „vor seinen Augen“ und „sein Bild“
    rationale: Im Griechischen beziehen sich beide Pronomen auf das Tier. Die deutschen maskulinen Possessivformen nach „der falsche Prophet“ können beim Lesen kurz einen anderen Bezug nahelegen. „dessen“ stellt den Bezug klar und vermeidet unnötige Auslegung.
  revised_text: Und das Tier wurde ergriffen und mit ihm der falsche Prophet, der vor dessen Augen die Zeichen getan hatte, durch die er diejenigen verführte, die das Mal des Tieres angenommen hatten und dessen Bild anbeteten. Die beiden wurden lebendig in den Feuersee geworfen, der mit Schwefel brennt.
