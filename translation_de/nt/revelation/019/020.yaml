id: REV.19.20
reference: Revelation 19:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: de
  text: Und das Tier wurde ergriffen und mit ihm der falsche Prophet, der vor dessen Augen die Zeichen getan hatte, durch die er diejenigen verführte, die das Mal des Tieres angenommen hatten und dessen Bild anbeteten. Die beiden wurden lebendig in den Feuersee geworfen, der mit Schwefel brennt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: wurde ergriffen
  rationale: Der Aorist Passiv von πιάζω bezeichnet hier das gewaltsame Ergreifen beziehungsweise Gefangennehmen; „wurde ergriffen“ ist präzise und würdevoll.
- source_word: τὸ θηρίον
  choice: das Tier
  rationale: „Tier“ bewahrt den etablierten apokalyptischen Bildbegriff der Offenbarung und entspricht dem grammatischen Neutrum des Griechischen.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: Im Deutschen wird auf „das Tier“ trotz grammatischen Neutrums bei personhaftem Handeln idiomatisch häufig mit „ihm“ zurückverwiesen; die Formulierung bleibt zugleich nah am griechischen Ausdruck.
- source_word: ὁ ψευδοπροφήτης
  choice: der falsche Prophet
  rationale: Direkte und im Deutschen geläufige Wiedergabe des zusammengesetzten Substantivs.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: der … die Zeichen getan hatte
  rationale: Das vorzeitige Plusquamperfekt gibt das Aoristpartizip im Verhältnis zur Haupthandlung angemessen wieder; „Zeichen“ erhält den Zeichencharakter von σημεῖα.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor seinen Augen
  rationale: Die idiomatische Wendung gibt „in seiner Gegenwart/vor ihm“ anschaulich wieder, ohne mehr als die räumlich-personale Gegenwart auszusagen.
- source_word: ἐν οἷς ἐπλάνησεν
  choice: durch die er … verführte
  rationale: „Durch die“ bildet den instrumentalen Sinn von ἐν οἷς ab; „verführte“ bewahrt sowohl Täuschung als auch Irreführung.
- source_word: τοὺς λαβόντας τὸ χάραγμα
  choice: die das Kennzeichen … angenommen hatten
  rationale: „Kennzeichen“ bezeichnet den identifizierenden Aufdruck beziehungsweise das Mal; „angenommen hatten“ gibt die vorzeitige Handlung natürlich wieder.
- source_word: τοὺς προσκυνοῦντας
  choice: die … anbeteten
  rationale: Im kultischen Kontext der Offenbarung bezeichnet προσκυνέω Verehrung beziehungsweise Anbetung und nicht nur eine körperliche Verbeugung.
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: Die beiden wurden lebendig … geworfen
  rationale: Die Stellung von „lebendig“ bewahrt die nachdrückliche Aussage, dass beide in lebendem Zustand geworfen wurden.
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: den Feuersee, der mit Schwefel brennt
  rationale: Die konkrete apokalyptische Bildsprache wird ohne dogmatische Ausdeutung wiedergegeben; θεῖον bedeutet hier Schwefel.
theological_decisions:
- issue: Personhafte beziehungsweise grammatische Referenz auf das Tier
  choice: Deutsche maskuline Pronomen in der idiomatischen Rückverweisung („mit ihm“, „seinen“, „sein“)
  alternative: Strikt grammatisch-neutrale Formen („mit ihm“ bleibt im Dativ formal gleich; „vor dessen Augen“, „dessen Bild“) oder wiederholtes „des Tieres“
  rationale: Obwohl θηρίον und „Tier“ Neutra sind, wird das apokalyptische Tier handelnd und personhaft dargestellt. Die gewählten deutschen Pronomen klingen natürlich, ohne festzulegen, ob die Gestalt wörtlich als Person zu verstehen ist.
- issue: Bildsprache des Endgerichts
  choice: Wörtliche Wiedergabe als „Feuersee, der mit Schwefel brennt“
  alternative: Deutende Umschreibung als Hölle oder ewige Qual
  rationale: Der Text bietet ein konkretes apokalyptisches Bild. Die Übersetzung bewahrt dieses Bild und fügt keine späteren dogmatischen Bestimmungen hinzu.
- issue: Bedeutung von πλανάω
  choice: „verführte“
  alternative: „täuschte“ oder „führte in die Irre“
  rationale: „Verführen“ umfasst in diesem religiösen Kontext sowohl Täuschung als auch das Hinführen zu falscher Verehrung, ohne den Mechanismus genauer festzulegen, als es der griechische Text tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Satzstruktur bleibt nahe am griechischen Aufbau, wird aber für heutige Leser flüssig gestaltet. Da keine Fußnoten nötig sind, enthält der Haupttext keine Fußnotenmarker.
