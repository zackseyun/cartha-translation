  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: de
  text: 'Und er sagt zu mir: »Schreibe: Glücklich zu preisen sind die, die zum Hochzeitsmahl des Lammes eingeladen sind.«[a] Und er sagt zu mir: »Dies sind die wahren Worte Gottes.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „gerufen sind“.'
    reason: lexical_alternative
  - marker: b
    text: „Wahr“ kann hier zugleich „zuverlässig“ oder „vertrauenswürdig“ bedeuten; der griechische Ausdruck lässt offen, ob „Gottes“ vor allem Zugehörigkeit oder Herkunft bezeichnet.
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: Γράψον
  choice: Schreibe
  rationale: Der Aoristimperativ Singular wird unmittelbar und ohne inhaltlichen Zusatz wiedergegeben.
- source_word: Μακάριοι
  choice: Glücklich zu preisen
  rationale: Die Wendung bewahrt den feierlichen Charakter einer Seligpreisung und ist zugleich in modernem Deutsch verständlich; sie bezeichnet mehr als ein subjektives Glücksgefühl.
- source_word: οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι
  choice: alle, die zum Hochzeitsmahl des Lammes eingeladen sind
  rationale: Das Perfekt Passiv bezeichnet Menschen, die eingeladen worden sind und weiterhin als Geladene gelten. Im Zusammenhang eines Festmahls gibt „eingeladen“ die idiomatische Bedeutung von καλέω natürlich wieder. „Alle“ macht die substantivierte Pluralform im Deutschen flüssig, ohne den Umfang der Gruppe über den griechischen Ausdruck hinaus zu erweitern.
- source_word: δεῖπνον τοῦ γάμου
  choice: Hochzeitsmahl
  rationale: δεῖπνον bezeichnet eine Haupt- oder Festmahlzeit, während γάμος hier die Hochzeit bezeichnet. Das zusammengesetzte deutsche Wort gibt die Bildsprache prägnant und natürlich wieder.
- source_word: τοῦ ἀρνίου
  choice: des Lammes
  rationale: „Lamm“ bewahrt den in der Offenbarung zentralen christologischen Titel und seine Opfer- und Messiasbezüge.
- source_word: Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν
  choice: Dies sind die wahren Worte Gottes
  rationale: Die Formulierung hält die demonstrative Aussage, den Plural λόγοι und den Genitiv τοῦ θεοῦ eng am griechischen Wortlaut. „Wahr“ gibt ἀληθινός direkt wieder, ohne die mögliche Bedeutung „zuverlässig“ auszuschließen.
theological_decisions:
- issue: Bedeutung von κεκλημένοι im Zusammenhang des endzeitlichen Festmahls
  choice: eingeladen
  alternative: gerufen
  rationale: Im Kontext eines Mahls bezeichnet καλέω idiomatisch das Einladen. Diese Wiedergabe vermeidet zugleich, unmarkiert eine bestimmte Lehre über einen wirksamen Heilsruf einzutragen. Die wörtlichere Möglichkeit „gerufen“ bleibt in einer Fußnote sichtbar.
- issue: Bedeutung von ἀληθινοί und Verhältnis des Genitivs τοῦ θεοῦ
  choice: die wahren Worte Gottes
  alternative: die zuverlässigen Worte Gottes; diese Worte kommen wahrhaftig von Gott
  rationale: „Wahr“ ist die direkteste Wiedergabe und lässt sowohl Wahrheit als auch Verlässlichkeit mitschwingen. Der Genitiv wird als „Gottes“ bewahrt, statt ihn eindeutig als Herkunftsangabe „von Gott“ auszulegen.
- issue: Wiedergabe der Seligpreisung Μακάριοι
  choice: Glücklich zu preisen
  alternative: Selig
  rationale: „Glücklich zu preisen“ vermittelt den objektiven Zuspruch der Seligpreisung in allgemein verständlichem modernem Deutsch, ohne ihn auf ein Gefühl zu reduzieren. „Selig“ ist kürzer und traditionell, kann heute jedoch altertümlich oder konfessionell geprägt wirken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und feierlich. „Hochzeitsmahl“ ist natürlicher als das schwerfälligere „Mahl der Hochzeit“, während „des Lammes“ den etablierten Symboltitel bewahrt.
