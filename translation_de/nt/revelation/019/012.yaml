source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: de
  text: Seine Augen waren eine Feuerflamme, und auf seinem Kopf waren viele Diademe[a]. Er hatte einen Namen, der geschrieben war und den niemand kennt außer ihm selbst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: viele Königskronen. Das griechische Wort bezeichnet ausdrücklich königliche Kronen beziehungsweise Diademe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτοῦ
  choice: Seine Augen
  rationale: Die natürliche deutsche Possessivkonstruktion gibt die griechische Verbindung aus Substantiv und Genitivpronomen klar wieder; δέ dient hier nur als schwache Fortführung und braucht kein eigenes deutsches Gegenstück.
- source_word: φλὸξ πυρός
  choice: eine Feuerflamme
  rationale: Die nominale Metapher wird ohne ein im Griechischen nicht ausdrücklich vorhandenes „wie“ bewahrt. „Feuerflamme“ ist prägnant und nimmt die apokalyptische Bildsprache auf.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: auf seinem Kopf
  rationale: Gibt die räumliche Bedeutung von ἐπί mit Akkusativ in natürlichem modernem Deutsch wieder.
- source_word: διαδήματα πολλά
  choice: viele Diademe
  rationale: διάδημα bezeichnet spezifisch das königliche Stirnband beziehungsweise die Königskrone. „Diademe“ ist genauer als das allgemeinere „Kronen“; eine Fußnote erläutert den königlichen Sinn.
- source_word: ἔχων
  choice: trug er / Er trug
  rationale: Das Partizip beschreibt, was der Reiter an sich trägt. Die Wiedergabe durch finite Sätze ist im Deutschen flüssiger, ohne den sachlichen Bezug zu verändern.
- source_word: ὄνομα γεγραμμένον
  choice: einen geschriebenen Namen
  rationale: Bewahrt die passive und resultative Aussage des Perfektpartizips, ohne einen im griechischen Wortlaut nicht genannten Ort der Aufschrift hinzuzufügen.
- source_word: ὃ οὐδεὶς οἶδεν
  choice: den niemand kennt
  rationale: Das Perfekt οἶδεν hat präsentische Bedeutung. Bei einem Namen ist „kennen“ im Deutschen idiomatisch.
- source_word: εἰ μὴ αὐτός
  choice: außer ihm selbst
  rationale: Gibt die ausschließende Wendung und die Betonung des Selbstbezugs natürlich wieder.
theological_decisions:
- issue: Bezug der Aussage über die ausschließliche Kenntnis
  choice: Nur der Reiter selbst kennt den geschriebenen Namen.
  alternative: Die Aussage könnte allgemeiner als Hinweis auf die Unergründlichkeit des Namens verstanden werden.
  rationale: Der Wortlaut sagt ausdrücklich, dass niemand den Namen kennt außer ihm selbst. Die Übersetzung wahrt diese Exklusivität, ohne die Identität oder theologische Bedeutung des Namens weiter auszudeuten.
- issue: Metapher oder ausdrücklicher Vergleich bei den Augen
  choice: Die Augen werden als „eine Feuerflamme“ bezeichnet.
  alternative: „Seine Augen waren wie eine Feuerflamme.“
  rationale: Im griechischen Text steht kein Vergleichspartikel. Die direkte Metapher erhält die Stärke und Offenheit des Bildes, statt es durch „wie“ abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichter apokalyptischer Bildsprache. Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert; die unbestimmte Lage des geschriebenen Namens bleibt gewahrt.
