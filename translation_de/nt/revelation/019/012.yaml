    issue: Die Diademe werden als aktiv vom Reiter „getragen“ formuliert.
    rationale: ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά beschreibt zunächst, dass sich viele Diademe auf seinem Kopf befinden. Die revidierte Formulierung bleibt näher an dieser Struktur.
  - severity: low
    issue: „Er trug einen geschriebenen Namen“ ist im Deutschen leicht sperrig und kann den Charakter des Partizips weniger klar erkennen lassen.
    rationale: Die Relativsatzlösung „einen Namen, der geschrieben war“ bewahrt die passive, resultative Aussage von γεγραμμένον, ohne zu behaupten, der Reiter habe den Namen selbst geschrieben.
