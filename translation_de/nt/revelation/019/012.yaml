  source_fidelity: 'Die wesentlichen Lexeme sind zutreffend wiedergegeben: „Feuerflamme“ wahrt die prädikative Bildaussage ohne einen Vergleich einzuführen, „Diademe“ gibt διαδήματα präzise wieder, und „außer ihm selbst“ erhält die exklusive Aussage. Die Satzfassung verschiebt jedoch bei den Diademen unnötig den Ausdruck von einer Ortsangabe mit Existenzbehauptung („auf seinem Kopf waren“) zu einem aktiven Tragen durch den Reiter.'
  naturalness: Modernes, würdiges Deutsch ist grundsätzlich erreicht. Die Wiederholung von „trug“ wirkt jedoch stilistisch schwerfällig. Zudem ist „auf seinem Kopf trug er viele Diademe“ weniger unmittelbar als „auf seinem Kopf waren viele Diademe“.
  terminology: „Diademe“ ist als Wiedergabe von διαδήματα sachgerecht; die Fußnote erklärt den königlichen Charakter angemessen. „Namen, der geschrieben war“ gibt ὄνομα γεγραμμένον idiomatischer und klarer wieder als „einen geschriebenen Namen“, ohne einen Ort der Aufschrift zu ergänzen.
  issues:
