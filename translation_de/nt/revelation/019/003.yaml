id: REV.19.3
reference: Revelation 19:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: de
  text: 'Und ein zweites Mal sagten sie: »Halleluja!« Und ihr Rauch steigt auf für immer und ewig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in die Zeitalter der Zeitalter«; eine griechische Redewendung für unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: ein zweites Mal
  rationale: Der adverbiale Akkusativ bezeichnet die Wiederholung und bewahrt zugleich die Abfolge; die Formulierung ist im modernen Deutschen natürlich.
- source_word: εἴρηκαν
  choice: sagten sie
  rationale: Das Perfekt von λέγω wird im deutschen Erzählzusammenhang idiomatisch mit dem Präteritum wiedergegeben. »Riefen sie« würde eine im Verb nicht ausdrücklich enthaltene Lautstärke hinzufügen.
- source_word: Ἁλληλουϊά
  choice: Halleluja
  rationale: Die vertraute liturgische Formel wird entsprechend dem griechischen Text transliteriert, statt sie erklärend mit »Lobt Jah« oder »Lobt den HERRN« wiederzugeben.
- source_word: ὁ καπνὸς αὐτῆς
  choice: ihr Rauch
  rationale: Das feminine Pronomen verweist im Kontext auf Babylon als personifizierte Frau beziehungsweise Stadt. »Ihr Rauch« erhält diese Personifikation.
- source_word: ἀναβαίνει
  choice: steigt auf
  rationale: Das Präsens und das fortdauernde, anschauliche Bild werden durch die natürliche deutsche Wendung »steigt auf« bewahrt.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die feste griechische Wendung bezeichnet hier unbegrenzte Dauer. »Für immer und ewig« ist die geläufige, würdevolle deutsche Entsprechung; die wörtlichere Form steht in der Fußnote.
theological_decisions:
- issue: Die durch εἰς τοὺς αἰῶνας τῶν αἰώνων ausgedrückte Dauer
  choice: für immer und ewig
  alternative: in die Zeitalter der Zeitalter
  rationale: Im Zusammenhang des endgültigen Gerichts vermittelt die griechische Redewendung am natürlichsten unbegrenzte Dauer. Die Hauptübersetzung gibt diese Aussage unverkürzt wieder, während die Fußnote die formale Gestalt des Griechischen transparent macht.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Satzstruktur und die liturgische Formel bleiben erhalten; die feminine Personifikation Babylons wird nicht eingeebnet.
