id: REV.19.1
reference: Revelation 19:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: de
  text: 'Danach hörte ich etwas wie eine laute Stimme einer großen Menge im Himmel, die rief: »Halleluja![a] Die Rettung und die Herrlichkeit und die Macht gehören unserem Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lobt Jah!« beziehungsweise »Lobt den HERRN!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Gibt die zeitliche Abfolge der Vision natürlich wieder; der Plural des griechischen Ausdrucks ist im Deutschen in der idiomatischen Wendung mitgemeint.
- source_word: ἤκουσα
  choice: hörte ich
  rationale: Schlichte Vergangenheitsform, die der erzählerischen Abfolge entspricht.
- source_word: ὡς
  choice: etwas wie
  rationale: Bewahrt den Vergleichs- beziehungsweise Annäherungscharakter der apokalyptischen Wahrnehmung, ohne Stimme und Menge strikt gleichzusetzen.
- source_word: φωνὴν μεγάλην
  choice: die laute Stimme
  rationale: Bei einer Stimme bezeichnet μεγάλη vor allem große Lautstärke; »laut« ist im Deutschen idiomatischer als »groß«.
- source_word: ὄχλου πολλοῦ
  choice: einer großen Menge
  rationale: Bewahrt sowohl den kollektiven Sinn von ὄχλος als auch die Größenangabe πολλοῦ in natürlichem Deutsch.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Bezeichnet hier den himmlischen Bereich, nicht den sichtbaren Lufthimmel.
- source_word: λεγόντων
  choice: die rief
  rationale: Das Partizip führt den Wortlaut der laut vernehmbaren Akklamation ein; »rief« passt zum Kontext einer mächtigen gemeinsamen Stimme. Der Singular folgt dem grammatischen Bezugswort »Menge«.
- source_word: Ἁλληλουϊά
  choice: Halleluja
  rationale: Die im Deutschen fest etablierte lautliche Wiedergabe erhält den liturgischen und intertextuellen Charakter des hebräischen Lobpreisrufs.
- source_word: ἡ σωτηρία
  choice: die Rettung
  rationale: Gibt σωτηρία als rettendes Handeln beziehungsweise rettende Befreiung wieder und bewahrt durch den Artikel die markierte griechische Form.
- source_word: ἡ δόξα
  choice: die Herrlichkeit
  rationale: »Herrlichkeit« ist im Gotteslob die geläufige und inhaltlich breite Entsprechung von δόξα.
- source_word: ἡ δύναμις
  choice: die Macht
  rationale: »Macht« bezeichnet hier Gottes wirksame Kraft und eignet sich für die feierliche dreigliedrige Akklamation.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: gehören unserem Gott
  rationale: Macht den possessiven beziehungsweise zuschreibenden Genitiv in natürlichem Deutsch ausdrücklich.
theological_decisions:
- issue: Wiedergabe des himmlischen Lobpreisrufs Ἁλληλουϊά
  choice: Halleluja
  alternative: Lobt Jah / Lobt den HERRN
  rationale: Die Transliteration wahrt den überlieferten liturgischen Ruf, ohne die Kurzform des Gottesnamens im Haupttext interpretierend auszuschreiben; die Bedeutung wird in einer Fußnote erläutert.
- issue: Zuordnung von Rettung, Herrlichkeit und Macht zu Gott
  choice: gehören unserem Gott
  alternative: sind unseres Gottes
  rationale: Die Formulierung versteht den Genitiv als Besitz beziehungsweise feierliche Zuschreibung und vermeidet dabei unnatürliches Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Klang. Die wiederholten Artikel und das verbindende »und« erhalten den nachdrücklichen, liturgischen Rhythmus des griechischen Textes. Der Fußnotenmarker steht unmittelbar beim erläuterten Lobpreisruf.
