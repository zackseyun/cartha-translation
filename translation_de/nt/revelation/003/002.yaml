id: REV.3.2
reference: Revelation 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: de
  text: Wach auf und stärke, was noch übrig ist und zu sterben drohte. Denn ich habe deine Taten vor meinem Gott nicht als vollendet befunden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: Wach auf
  rationale: Die wörtliche Wendung bedeutet, wachsam bzw. wachend zu werden. Im Kontext der geistlichen Erstarrung von Sardes gibt der idiomatische Imperativ „Wach auf“ den dringlichen Weckruf natürlich und treffend wieder.
- source_word: στήρισον
  choice: stärke
  rationale: Der Aoristimperativ verlangt entschlossenes Handeln; „stärke“ bewahrt die Bedeutung von festigen, stützen oder stabilisieren.
- source_word: τὰ λοιπά
  choice: was noch übrig ist
  rationale: Die substantivierte Pluralform bezeichnet die verbliebenen Dinge oder Reste, ohne im Deutschen unnötig festzulegen, worauf sie sich genau bezieht.
- source_word: ἔμελλον ἀποθανεῖν
  choice: zu sterben drohte
  rationale: μέλλω mit Infinitiv bezeichnet hier ein unmittelbar bevorstehendes Geschehen. „drohte“ vermittelt die akute Gefahr idiomatisch; der deutsche Singular richtet sich nach dem neutralen Sammelausdruck „was“.
- source_word: τὰ ἔργα
  choice: deine Taten
  rationale: „Taten“ ist im heutigen Deutsch natürlicher als „Werke“ und bezeichnet das konkrete Handeln der Gemeinde.
- source_word: πεπληρωμένα
  choice: als vollendet
  rationale: Das Perfektpartizip bezeichnet einen erreichten Zustand der Erfüllung oder Vollendung. „als vollendet befunden“ bildet die Konstruktion mit εὕρηκα genau und verständlich ab.
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: vor meinem Gott
  rationale: „Vor“ ist die natürliche deutsche Entsprechung für eine Bewertung im Angesicht bzw. Urteil Gottes.
theological_decisions:
- issue: Bezug und Art des Mangels der Taten
  choice: „nicht als vollendet befunden“
  alternative: „nicht als vollkommen befunden“ oder „nicht erfüllt gefunden“
  rationale: „Vollendet“ bewahrt die Aussage, dass die Taten vor Gott nicht zum erforderlichen Abschluss bzw. zur Fülle gelangt sind, ohne daraus ausdrücklich moralische Sündlosigkeit oder bloß mengenmäßige Unvollständigkeit zu machen.
- issue: Bildsprache des Wachens
  choice: „Wach auf“
  alternative: „Sei wachsam“
  rationale: Beides ist sprachlich möglich. „Wach auf“ passt zum Kontrast zwischen dem Ruf, lebendig zu sein, und dem tatsächlichen Totsein in Vers 1 sowie zum folgenden „zu sterben“, ohne eine besondere konfessionelle Deutung einzutragen.
translation_notes:
  register: Moderne, klare und zugleich eindringliche Standardsprache. Der Satzbau bleibt nahe am griechischen Gedankengang, vermeidet aber schwerfällige Wörtlichkeit. Die echte Offenheit von „was noch übrig ist“ bleibt erhalten.
