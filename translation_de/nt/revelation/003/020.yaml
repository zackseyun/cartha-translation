id: REV.3.20
reference: Revelation 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: de
  text: Siehe[a], ich stehe an der Tür und klopfe. Wenn jemand meine Stimme hört und die Tür öffnet, werde ich zu ihm hineingehen[b] und mit ihm essen[c], und er mit mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schau!“ Das griechische Wort lenkt nachdrücklich die Aufmerksamkeit auf das Folgende.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werde ich zu ihm eintreten“. Die Wendung richtet den Eintritt persönlich auf den Menschen aus, nicht lediglich auf einen Ort.'
    reason: lexical_alternative
  - marker: c
    text: Das gemeinsame Mahl ist ein Bild inniger, wechselseitiger Gemeinschaft. Ob hier besonders auf das Abendmahl, auf Bekehrung oder auf wiederhergestellte Gemeinschaft angespielt wird, legt der Text selbst nicht ausdrücklich fest.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: Siehe
  rationale: Die aufmerksamkeitslenkende Partikel wird mit dem in heutiger gehobener Standardsprache weiterhin verständlichen „Siehe“ wiedergegeben; es bewahrt Nachdruck und Unmittelbarkeit.
- source_word: ἕστηκα
  choice: ich stehe
  rationale: 'Das Perfekt von ἵστημι hat hier präsentisch-statischen Sinn: Der Sprecher befindet sich gegenwärtig und fortdauernd an der Tür.'
- source_word: ἐπὶ τὴν θύραν
  choice: an der Tür
  rationale: Dies ist die natürliche deutsche Ortsangabe für eine Person, die vor einem Eingang steht und anklopft.
- source_word: κρούω
  choice: klopfe
  rationale: Das Präsens bezeichnet die gegenwärtige, fortdauernde Handlung; zusammen mit „ich stehe“ ergibt sich ein natürlicher deutscher Satz.
- source_word: ἐάν τις
  choice: Wenn jemand
  rationale: Die unbestimmte, offene Bedingung wird inklusiv und ohne geschlechtliche Einschränkung wiedergegeben.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: meine Stimme hört
  rationale: φωνή bezeichnet hier die Stimme; ἀκούω mit Genitiv wird im Deutschen idiomatisch mit direktem Objekt ausgedrückt.
- source_word: ἀνοίξῃ τὴν θύραν
  choice: die Tür öffnet
  rationale: Direkte und natürliche Wiedergabe des Aorist-Konjunktivs innerhalb des Bedingungssatzes.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: werde ich zu ihm hineinkommen
  rationale: „hineinkommen“ gibt εἰσελεύσομαι wieder, während „zu ihm“ die persönliche Beziehungsrichtung von πρὸς αὐτόν wahrt, statt nur den Eintritt in einen Raum auszudrücken.
- source_word: δειπνήσω
  choice: essen
  rationale: δειπνέω bezeichnet das Einnehmen einer Haupt- oder Abendmahlzeit. „Mit ihm essen“ klingt im modernen Deutsch natürlich und lässt die konkrete Art des Mahls offen.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: mit ihm … und er mit mir
  rationale: Die Ellipse und die betonte Gegenseitigkeit des griechischen Ausdrucks bleiben erhalten, ohne das ausgelassene Verb unnötig zu ergänzen.
theological_decisions:
- issue: Bild des gemeinsamen Mahls
  choice: Das Bild wird als persönliche, wechselseitige Tischgemeinschaft übersetzt, ohne seine genaue theologische Zuordnung festzulegen.
  alternative: Spezifischer Hinweis auf das Abendmahl, auf Bekehrung oder auf die Wiederherstellung der Gemeinschaft mit einem Gläubigen beziehungsweise einer Gemeinde.
  rationale: Der Text bringt innige gegenseitige Gemeinschaft zum Ausdruck, entscheidet aber nicht ausdrücklich, ob das Mahl sakramental, evangelistisch oder auf wiederhergestellte Gemeinschaft bezogen ist.
- issue: Adressat der Einladung
  choice: „Wenn jemand“ bewahrt die individuelle und offene Formulierung innerhalb der an die Gemeinde gerichteten Botschaft.
  alternative: Den Satz ausdrücklich nur auf Nichtchristen oder nur auf bereits Glaubende beziehen.
  rationale: Der unmittelbare Kontext ist eine Gemeindebotschaft, doch die Formulierung τις ist allgemein; die Übersetzung soll den möglichen Bezug nicht dogmatisch verengen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Siehe“ trägt den feierlichen Aufmerksamkeitsruf, ohne den übrigen Satz altertümlich zu gestalten. Die Wiederholung „mit ihm … mit mir“ wahrt die markante Gegenseitigkeit des Originals.
