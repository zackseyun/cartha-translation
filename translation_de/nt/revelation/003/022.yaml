id: REV.3.22
reference: Revelation 3:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: de
  text: Wer ein Ohr hat, soll hören, was der Geist den Gemeinden sagt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „der Geist“; gemeint ist hier der Heilige Geist.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Wer ein Ohr hat
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein die Person, die ein Ohr hat. Das deutsche „Wer …“ gibt diesen repräsentativen Sinn natürlich wieder und bewahrt den Singular des griechischen Idioms.
- source_word: ἀκουσάτω
  choice: soll hören
  rationale: Der Aoristimperativ in der dritten Person Singular wird im modernen Deutschen idiomatisch mit „soll hören“ wiedergegeben; dies wahrt den auffordernden Nachdruck.
- source_word: τί
  choice: was
  rationale: „Was“ leitet den Inhalt des Hörens natürlich und genau ein.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der bestimmte Ausdruck bezeichnet im wiederkehrenden Sendschreiben-Refrain den Heiligen Geist. Die Großschreibung kennzeichnet den kontextuellen Bezug, ohne „heilig“ in den Text einzufügen.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bezeichnet das Reden des Geistes; „sagt“ ist im Deutschen direkt und formelgerecht.
- source_word: ταῖς ἐκκλησίαις
  choice: den Gemeinden
  rationale: Der Dativ bezeichnet die Adressaten. „Gemeinden“ ist für die konkret angesprochenen christlichen Versammlungen in Offenbarung 2–3 die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Repräsentativer Singular in der Aufforderung
  choice: Wer ein Ohr hat, soll hören
  alternative: Wer Ohren hat, der höre
  rationale: Der griechische Text steht im Singular. Die gewählte Form bewahrt ihn, bleibt geschlechtsübergreifend verständlich und vermeidet die altertümliche Wendung „der höre“.
- issue: Bezug von τὸ πνεῦμα
  choice: der Geist
  alternative: der geist
  rationale: Im Kontext der sieben Sendschreiben ist der Sprecher der Heilige Geist. Die Großschreibung macht diesen Bezug im Deutschen sichtbar; eine Fußnote hält fest, dass im Griechischen lediglich „der Geist“ steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, formelhafte Mahnung und der griechische Singular „ein Ohr“ bleiben erhalten.
