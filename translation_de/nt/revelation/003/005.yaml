id: REV.3.5
reference: Revelation 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: de
  text: Wer siegt, wird so mit weißen Gewändern bekleidet werden. Ich werde seinen Namen ganz gewiss nicht aus dem Buch des Lebens auslöschen[a], und ich werde seinen Namen vor meinem Vater und vor seinen Engeln bekennen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das „Buch des Lebens“ ist das himmlische Verzeichnis derer, die Gott gehören und das Leben erben. Die griechische Verneinung ist besonders nachdrücklich: „Ich werde seinen Namen niemals auslöschen.“'
    reason: Sachhinweis und Wiedergabe der emphatischen Negation
  - marker: b
    text: 'Oder: „ich werde seinen Namen anerkennen“. Vergleiche Matthäus 10,32.'
    reason: Lexikalische Alternative und Querverweis
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Wer siegt
  rationale: Das substantivierte Präsenspartizip bezeichnet den Menschen, dessen Handeln vom Siegen geprägt ist. „Wer siegt“ ist im modernen Deutschen natürlich und bewahrt das Siegesmotiv der Offenbarung; „wer überwindet“ wäre ebenfalls möglich, klingt jedoch traditioneller und weniger unmittelbar.
- source_word: οὕτως
  choice: so
  rationale: Das im griechischen Text vorhandene Adverb wird knapp wiedergegeben und stellt den Bezug zur vorangehenden Verheißung beziehungsweise Aussage her.
- source_word: περιβαλεῖται
  choice: wird … bekleidet werden
  rationale: Die mediale/passive Form wird hier als Verheißung einer Bekleidung verstanden. Das Passiv bewahrt die Vorstellung, dass dem Sieger die weißen Gewänder verliehen werden.
- source_word: ἱματίοις λευκοῖς
  choice: mit weißen Gewändern
  rationale: „Gewänder“ gibt ἱμάτια allgemein genug und zugleich in einem der apokalyptischen Bildsprache angemessenen Register wieder, ohne die spezifischere Vorstellung von Roben einzutragen.
- source_word: οὐ μὴ ἐξαλείψω
  choice: werde … ganz gewiss nicht … auslöschen
  rationale: Die verstärkte griechische Verneinung οὐ μή wird durch „ganz gewiss nicht“ deutlich gemacht. „Auslöschen“ passt zum Bild eines Namens in einem Verzeichnis und ist im Deutschen idiomatisch.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: aus dem Buch des Lebens
  rationale: Die etablierte biblische Wendung ist verständlich und gibt βίβλος angemessen wieder, ohne unnötig auf „Schriftrolle“ festzulegen.
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: ich werde seinen Namen … bekennen
  rationale: „Bekennen“ bewahrt den öffentlichen und feierlichen Aussagecharakter des Verbs sowie die sprachliche Verbindung zu Jesu Ausspruch in Matthäus 10,32. „Anerkennen“ ist eine mögliche, im heutigen Deutsch etwas unmittelbarere Alternative.
- source_word: ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: vor meinem Vater und vor seinen Engeln
  rationale: „Vor“ ist eine knappe natürliche Entsprechung für beide Vorkommen von ἐνώπιον. Das Pronomen „seinen“ bezieht sich syntaktisch am nächsten auf den Vater und wird nicht harmonisierend umformuliert.
theological_decisions:
- issue: Bedeutung der Zusage, den Namen nicht aus dem Buch des Lebens auszulöschen
  choice: Die emphatische Zusage wird uneingeschränkt als Verheißung an den Sieger übersetzt.
  alternative: Die Formulierung ausdrücklich entweder als Garantie der endgültigen Bewahrung oder als Hinweis auf einen möglichen Verlust des Heils deuten.
  rationale: Der Vers selbst formuliert eine starke Verheißung, entscheidet aber die weitergehende dogmatische Debatte nicht eindeutig. Die Übersetzung bewahrt diese Spannung, statt eine Lehrposition einzutragen.
- issue: Generisches Maskulinum der singularischen Konstruktion
  choice: „seinen Namen“ entsprechend der grammatisch maskulinen Singularform
  alternative: „deren Namen“ oder eine pluralische geschlechtsneutrale Umformung
  rationale: Die deutsche Bedingungskonstruktion „Wer …, seinen Namen“ folgt der singularischen und repräsentativen Form des griechischen Textes, ohne die Aussage auf Männer zu beschränken.
- issue: Wer die Bekleidung vollzieht
  choice: 'Passivisch: „wird … bekleidet werden“'
  alternative: 'Medial/reflexiv: „wird sich … kleiden“'
  rationale: Die Form kann morphologisch medial oder passiv verstanden werden. Im Zusammenhang einer Verheißung ist die passive Investitur besonders plausibel; die Übersetzung vermeidet dennoch eine ausdrückliche Benennung des Handelnden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. „Gewänder“, „Buch des Lebens“ und „bekennen“ erhalten den feierlichen Charakter und zentrale biblische Sprachbezüge, bleiben aber für heutige Leser verständlich. Alle Fußnotenmarker stehen im Haupttext.
