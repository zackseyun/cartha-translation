  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: das substantivierte Partizip („Wer siegt“), οὕτως („so“), die weißen Gewänder, die emphatische Verneinung οὐ μή, das „Buch des Lebens“ sowie das öffentliche Bekennen vor dem Vater und dessen Engeln. Das Passiv bei „wird … bekleidet werden“ ist als idiomatische und im Kontext plausible Wiedergabe der medial/passivischen Verbform vertretbar, ohne einen Handelnden einzutragen.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „Wer siegt“ und „Buch des Lebens“ sind klar und im apokalyptischen Register angemessen. „Seinen Namen vor … bekennen“ ist eine bewusst nahe und traditionelle, weiterhin verständliche Wiedergabe; die Fußnote bietet mit „anerkennen“ eine heutige lexikalische Alternative.
  terminology: 'Die zentralen Begriffe sind konsistent und sachgerecht wiedergegeben: „Gewänder“ für ἱμάτια, „auslöschen“ für ἐξαλείφω, „Buch des Lebens“ für βίβλος τῆς ζωῆς und „bekennen“ für ὁμολογέω. „Seinen Engeln“ folgt zutreffend der unmittelbaren griechischen Bezugnahme auf den Vater. Die Fußnoten sind im Haupttext verankert und ergänzen, ohne die theologische Aussage dogmatisch festzulegen.'
