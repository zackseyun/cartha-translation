id: REV.3.4
reference: Revelation 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: de
  text: Doch du hast in Sardes einige wenige Namen[a], die ihre Gewänder nicht beschmutzt[b] haben. Sie werden mit mir in Weiß[c] einhergehen, denn sie sind würdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einige wenige Menschen“. Wörtlich steht im Griechischen: „einige wenige Namen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nicht befleckt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Gemeint ist wahrscheinlich: „in weißen Gewändern“. Das Griechische sagt knapp: „in Weiß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den deutlichen Gegensatz zum vorhergehenden Tadel und klingt im modernen Deutschen natürlich.
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: du hast einige wenige Namen
  rationale: Bewahrt die auffällige Metonymie des griechischen Wortlauts; der folgende Relativsatz macht deutlich, dass Personen gemeint sind.
- source_word: ἐν Σάρδεσιν
  choice: in Sardes
  rationale: Übliche deutsche Form des Stadtnamens mit lokaler Präposition.
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: die ihre Gewänder nicht beschmutzt haben
  rationale: Bewahrt das anschauliche Kleidungsbild; „beschmutzt“ ist gegenwärtig und verständlich, „Gewänder“ entspricht dem würdevollen symbolischen Register.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: Sie werden mit mir einhergehen
  rationale: Gibt das Bild des Gehens und die zugesagte Gemeinschaft wieder; „einhergehen“ passt zum feierlichen Ton, ohne das Bild aufzulösen.
- source_word: ἐν λευκοῖς
  choice: in Weiß
  rationale: Bewahrt die knappe, elliptische Formulierung des Griechischen; weiße Kleidung ist im Zusammenhang naheliegend, wird aber nicht in den Haupttext hineinerklärt.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: denn sie sind würdig
  rationale: Gibt die begründende Funktion von ὅτι und die ungemilderte Aussage über ihre Würdigkeit direkt wieder.
theological_decisions:
- issue: ὀνόματα wörtlich als „Namen“ oder idiomatisch als „Menschen“ wiedergeben
  choice: „einige wenige Namen“ im Haupttext
  alternative: „einige wenige Menschen“
  rationale: Die ungewöhnliche Rede von „Namen“ kann die persönliche Identität der Treuen hervorheben. Der Wortlaut bleibt verständlich und wird in einer Fußnote erläutert.
- issue: Die moralische beziehungsweise kultische Bildsprache von μολύνω wiedergeben
  choice: „ihre Gewänder nicht beschmutzt“
  alternative: „ihre Gewänder nicht befleckt“
  rationale: „Beschmutzt“ erhält das konkrete Bild und ist allgemein verständlich; „befleckt“ ist eine mögliche, etwas stärker religiös gefärbte Wiedergabe.
- issue: Die Aussage ἄξιοί εἰσιν und mögliche Vorstellungen von Verdienst
  choice: „sie sind würdig“ ohne erklärenden Zusatz
  alternative: „sie sind es wert“ oder „sie sind geeignet“
  rationale: Der Text bezeichnet sie ausdrücklich als würdig. Eine dogmatische Abschwächung oder Erweiterung würde über den griechischen Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Metonymie „Namen“, das Kleidungsbild und die knappe Wendung „in Weiß“ bleiben erhalten; Fußnoten erläutern idiomatische beziehungsweise lexikalische Alternativen.
