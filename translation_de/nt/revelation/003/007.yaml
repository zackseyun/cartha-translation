  source_fidelity: 'Die Übersetzung folgt der griechischen Satzstruktur, den Titeln und den Tempusformen sehr eng. Eine Korrektur ist bei ὁ ἀληθινός nötig: „der Wahrhaftige“ betont im heutigen Deutsch vor allem Wahrhaftigkeit bzw. Wahrheitsliebe, während ἀληθινός hier primär „wahr“, „echt“ oder „wirklich“ bezeichnet. „der Wahre“ erhält die Titelgestalt und den Sinnbereich besser.'
  naturalness: Der Text ist insgesamt würdevoll und modernes Standarddeutsch. Das Weglassen der Kommas vor den mit „und“ verbundenen Prädikaten macht die Reihung etwas flüssiger, ohne die feierliche Struktur zu glätten.
  terminology: „Engel“, „Gemeinde“, „der Heilige“, „der Wahre“ und „der Schlüssel Davids“ sind sachgerecht. Die Fußnoten bewahren sowohl die lexikalische Offenheit von ἀγγέλῳ als auch die wahrscheinliche Jesaja-Anspielung. Die alternative deutsche Zitierform sollte im Singular „Bote“ lauten.
