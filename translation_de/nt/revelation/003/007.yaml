  - severity: low
    issue: Fußnotenalternative „Boten“
    rationale: Als angeführte lexikalische Alternative ist „Bote“ die passende Grundform; „Boten“ wirkt ohne Satzkontext wie ein Kasus oder Plural und ist weniger präzise.
