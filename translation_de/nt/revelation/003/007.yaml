id: REV.3.7
reference: Revelation 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: de
  text: 'Und an den Engel[a] der Gemeinde in Philadelphia schreibe: Das sagt der Heilige, der Wahre, der den Schlüssel Davids[b] hat, der öffnet und niemand wird schließen, der schließt und niemand öffnet:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bote“. Das griechische Wort kann einen Engel oder einen menschlichen Boten bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: „Der Schlüssel Davids“ spielt wahrscheinlich auf Jesaja 22,22 an und ist ein Bild für königliche Vollmacht, zu öffnen und zu schließen.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: Engel
  rationale: Das Wort kann einen himmlischen Engel oder einen menschlichen Boten bezeichnen. „Engel“ entspricht der natürlichen und traditionellen Wiedergabe der wiederkehrenden Anredeformel in der Offenbarung, ohne die mögliche Bedeutung „Bote“ auszuschließen.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: Hier bezeichnet ἐκκλησία die örtliche christliche Gemeinschaft; „Gemeinde“ ist im modernen Standarddeutsch die klare und natürliche Entsprechung.
- source_word: Τάδε λέγει
  choice: Das sagt
  rationale: Die knappe Formel bewahrt den feierlichen Anklang an prophetische Botenformeln und gibt τάδε idiomatisch wieder.
- source_word: ὁ ἅγιος
  choice: der Heilige
  rationale: Der substantivierte, mit Artikel gebrauchte Ausdruck fungiert als Titel des Sprechers.
- source_word: ὁ ἀληθινός
  choice: der Wahrhaftige
  rationale: „Der Wahrhaftige“ ist im Deutschen als Titel natürlich und umfasst Zuverlässigkeit und Echtheit, auch wenn ἀληθινός im johanneischen Sprachgebrauch stärker „der Wahre/Echte“ bedeuten kann.
- source_word: κλεῖν Δαυίδ
  choice: den Schlüssel Davids
  rationale: Die Genitivverbindung wird direkt wiedergegeben und bewahrt das Bild der davidischen Vollmacht sowie die Anspielung auf Jesaja 22,22.
- source_word: ἀνοίγων
  choice: der öffnet
  rationale: Das Präsenspartizip setzt die Reihe der Titel und Beschreibungen fort; ein Relativsatz ist im Deutschen natürlich.
- source_word: κλείσει
  choice: wird schließen
  rationale: Der griechische Futurindikativ wird als Futur erhalten, einschließlich des leichten Tempuswechsels gegenüber den umgebenden Präsensformen.
- source_word: κλείων
  choice: der schließt
  rationale: Wie ἀνοίγων wird das Präsenspartizip idiomatisch durch einen Relativsatz wiedergegeben.
- source_word: ἀνοίγει
  choice: öffnet
  rationale: Der griechische Präsensindikativ bleibt erhalten und bildet den Gegenpol zu „wird schließen“.
theological_decisions:
- issue: Christologische Titel ὁ ἅγιος und ὁ ἀληθινός
  choice: 'Als unmittelbare Titel des auferstandenen Christus wiedergegeben: „der Heilige, der Wahrhaftige“.'
  alternative: Eine weniger titelhaft wirkende Wiedergabe wie „der heilig und wahr ist“ oder für ἀληθινός „der Wahre“.
  rationale: Artikel und substantivische Adjektive kennzeichnen feierliche Titel. Die Übersetzung bewahrt die hohe Christologie des Textes, ohne sie erläuternd auszubauen.
- issue: Anspielung in „Schlüssel Davids“
  choice: Das biblische Bild bleibt unverändert im Haupttext stehen.
  alternative: Eine deutende Paraphrase wie „die Vollmacht über Davids Reich“.
  rationale: Die Formulierung spielt wahrscheinlich auf Jesaja 22,22 und königliche Vollmacht an; diese Bedeutung soll erläutert, aber nicht an die Stelle des Bildes gesetzt werden.
- issue: Identität des ἄγγελος der Gemeinde
  choice: Im Haupttext „Engel“, mit „Bote“ als Fußnotenalternative.
  alternative: Im Haupttext „Bote“.
  rationale: Der griechische Ausdruck lässt beide Deutungen zu. „Engel“ wahrt die übliche Bedeutung und die Formel der Sendschreiben; die Fußnote erhält die echte lexikalische und interpretative Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Anredeformel bleibt knapp und feierlich; die ungleiche Tempusfolge des Griechischen („wird schließen“ / „öffnet“) wird bewusst bewahrt. Beide Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
