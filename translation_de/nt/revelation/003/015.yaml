id: REV.3.15
reference: Revelation 3:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: de
  text: 'Ich kenne deine Werke: Du bist weder kalt noch heiß. Wärst du doch kalt oder heiß!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδά
  choice: Ich kenne
  rationale: οἶδα hat hier präsentische, stative Bedeutung. „Ich kenne“ gibt den direkten und prüfenden Ton natürlich wieder.
- source_word: σου τὰ ἔργα
  choice: deine Werke
  rationale: „Deine Werke“ bewahrt die in der Offenbarung wiederkehrende Beurteilungsformel und deren moralisches Gewicht; „was du tust“ wäre verständlicher, aber stärker umschreibend.
- source_word: ψυχρὸς
  choice: kalt
  rationale: Die wörtliche Temperaturmetapher bleibt erhalten und wird nicht durch eine geistliche Deutung ersetzt.
- source_word: ζεστός
  choice: heiß
  rationale: „Heiß“ bildet den natürlichen Gegenpol zu „kalt“ und bewahrt das Temperaturbild; „glühend“ oder „eifrig“ würde die Metapher bereits auslegen.
- source_word: ὄφελον
  choice: Wärst du doch
  rationale: Die irreale Wunschformulierung gibt den nachdrücklichen Wunsch über einen gegenwärtig nicht bestehenden Zustand idiomatisch und würdig wieder.
- source_word: ἢ
  choice: oder
  rationale: Die einfache Disjunktion wird im Deutschen natürlich mit „oder“ wiedergegeben.
theological_decisions:
- issue: Bedeutung der Temperaturmetapher „kalt“ und „heiß“
  choice: Die wörtliche Metapher bleibt im Haupttext ungedeutet.
  alternative: „Kalt“ als geistlich gleichgültig oder ungläubig und „heiß“ als geistlich eifrig verstehen; alternativ beide Temperaturen als jeweils nützlich deuten.
  rationale: Der Vers selbst erklärt das Bild nicht. Eine ausdrückliche Deutung würde eine umstrittene Auslegung in die Übersetzung eintragen und die vorhandene theologische Spannung auflösen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die parallele Satzstruktur und der nachdrückliche Wunsch des griechischen Textes bleiben erhalten.
