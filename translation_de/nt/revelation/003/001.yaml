id: REV.3.1
reference: Revelation 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: de
  text: 'Und dem Engel[a] der Gemeinde in Sardes schreibe: So spricht[b] der, der die sieben Geister Gottes[c] und die sieben Sterne hat: Ich kenne deine Werke: Du hast den Ruf, lebendig zu sein[d], doch du bist tot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Boten“. Das griechische Wort ἄγγελος kann einen Engel oder einen Boten bezeichnen; im apokalyptischen Rahmen der Offenbarung liegt „Engel“ näher.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „Dies sagt“. „So spricht“ gibt die feierliche prophetische Formel im Deutschen natürlich wieder.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung „die sieben Geister Gottes“ ist wörtlich beibehalten. Sie kann symbolisch die Fülle des Heiligen Geistes bezeichnen; andere verstehen darunter sieben himmlische Geister.
    reason: alternative_reading
  - marker: d
    text: 'Wörtlicher: „Du hast einen Namen, dass du lebst.“ Gemeint ist: Du hast den Ruf, lebendig zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: Engel
  rationale: „Engel“ entspricht der üblichen Bedeutung und passt zum apokalyptischen Rahmen der Offenbarung; die ebenfalls mögliche Bedeutung „Bote“ wird in einer Fußnote genannt.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: „Gemeinde“ ist im heutigen Deutschen die natürliche Bezeichnung für die örtliche christliche Gemeinschaft und gibt den kontextuellen Sinn von ἐκκλησία wieder.
- source_word: Τάδε λέγει
  choice: So spricht
  rationale: Die geläufige prophetische Formel wahrt den feierlichen, orakelhaften Ton. Die formnähere Wiedergabe „Dies sagt“ wird in einer Fußnote genannt.
- source_word: ὁ ἔχων
  choice: der, der ... hat
  rationale: Diese substantivische Wiedergabe des Partizips ist verständlich, gegenwartsbezogen und vermeidet altertümliche Sprache.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: die sieben Geister Gottes
  rationale: Der griechische Plural wird beibehalten, ohne die umstrittene Symbolik deutend aufzulösen.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: die sieben Sterne
  rationale: Direkte Wiedergabe; die an anderer Stelle erklärte Symbolik wird hier nicht vorweggenommen.
- source_word: Οἶδά
  choice: Ich kenne
  rationale: „Ich kenne“ ist eine knappe, idiomatische Wiedergabe der wiederkehrenden Beurteilungsformel.
- source_word: τὰ ἔργα
  choice: deine Werke
  rationale: „Werke“ bewahrt die lexikalische Nähe und die wiederkehrende Ausdrucksweise der Offenbarung.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: Du stehst in dem Ruf, lebendig zu sein
  rationale: Die deutsche Wendung gibt den idiomatischen Sinn von „einen Namen haben“ als öffentliches Ansehen wieder, während die wörtlichere Form in der Fußnote erhalten bleibt.
- source_word: νεκρὸς εἶ
  choice: du bist tot
  rationale: Die direkte, scharfe Formulierung erhält den Gegensatz zu „lebendig“ und schwächt das geistliche Urteil nicht ab.
theological_decisions:
- issue: Bedeutung der „sieben Geister Gottes“
  choice: Die wörtliche Pluralform „die sieben Geister Gottes“ bleibt im Haupttext stehen.
  alternative: Symbolischer Hinweis auf die Fülle des Heiligen Geistes; oder sieben himmlische beziehungsweise engelhafte Geister.
  rationale: Der griechische Wortlaut legt die Deutung nicht eindeutig fest. Die Übersetzung bewahrt deshalb die theologische Spannung, statt eine Auslegung in den Text einzubauen.
- issue: Bezug von ἀγγέλῳ in der Anrede
  choice: Im Haupttext steht „Engel“.
  alternative: „Bote“ oder ein menschlicher Vertreter der Gemeinde.
  rationale: „Engel“ ist lexikalisch naheliegend und entspricht dem apokalyptischen Rahmen. Da der genaue Bezug umstritten ist, nennt die Fußnote die mögliche Alternative.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, klar verständlichem Ton. Die prophetische Formel „So spricht“ verleiht dem Satz Feierlichkeit, ohne altertümlich zu wirken. Der abrupte Schluss „doch du bist tot“ bewahrt die Schärfe des griechischen Gegensatzes.
