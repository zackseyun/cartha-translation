  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: de
  text: Wer ein Ohr hat, soll hören, was der Geist den Gemeinden sagt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Wer ein Ohr hat
  rationale: Das substantivierte Partizip mit dem singularischen οὖς wird als natürlicher deutscher Relativsatz wiedergegeben. Der Singular und der sprichwörtliche Charakter bleiben erhalten.
- source_word: ἀκουσάτω
  choice: soll hören
  rationale: Der Aorist-Imperativ der dritten Person Singular wird im heutigen Deutsch idiomatisch mit „soll hören“ wiedergegeben. „Hören“ bewahrt zudem die biblische Formel und kann aufmerksames Beachten einschließen.
- source_word: τί
  choice: was
  rationale: Das Fragepronomen leitet hier den Inhalt des Gesagten ein; „was“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der bestimmte Ausdruck bezeichnet in der wiederkehrenden Sendschreibenformel der Offenbarung den Heiligen Geist. Die Großschreibung signalisiert diesen wahrscheinlichen Bezug, ohne „Heilige“ ausdrücklich zu ergänzen.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bezeichnet den gegenwärtig geltenden Sprechakt. „Sagt“ ist im Deutschen schlicht und idiomatisch.
- source_word: ταῖς ἐκκλησίαις
  choice: den Gemeinden
  rationale: Der Dativ bezeichnet die Empfänger. „Gemeinden“ ist im Kontext der sieben örtlichen Adressatengemeinden natürlicher und genauer als das institutionell missverständliche singularische „Kirche“; „Versammlungen“ wäre lexikalisch möglich, klingt hier jedoch weniger idiomatisch.
theological_decisions:
- issue: Bezug von „der Geist“
  choice: der Heilige Geist, der zu den Gemeinden spricht
  alternative: ein menschlicher Geist oder ein unpersönlich verstandener Geist der Prophetie
  rationale: In der wiederkehrenden Mahnformel der Offenbarung ist „der Geist“ am wahrscheinlichsten der göttliche Geist, der durch die prophetische Botschaft zu den Gemeinden redet. Die Übersetzung lässt die knappe Ausdrucksweise des griechischen Textes bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute biblische Hörformel bleibt erhalten, wird aber ohne archaisches „der höre“ formuliert.
