id: REV.3.3
reference: Revelation 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: de
  text: Darum erinnere dich daran, wie du empfangen und gehört hast[a]; halte daran fest und kehre um. Wenn du nun nicht wach bleibst[b], werde ich kommen wie ein Dieb[c], und du wirst ganz gewiss nicht wissen, zu welcher Stunde ich über dich komme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erinnere dich daran, was du empfangen und gehört hast.“ Im Griechischen steht „wie“; dies kann die Art und Weise des Empfangs hervorheben, wird aber teilweise auf die empfangene Botschaft selbst bezogen.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Wache hältst“, „wachsam bist“ oder „aufmerksam bleibst“.'
    reason: lexical_alternative
  - marker: c
    text: Die Warnung „ich werde kommen wie ein Dieb“ erinnert an andere Aussagen über ein plötzliches, unerwartetes Kommen. Der Vers selbst legt nicht fest, ob das endgültige Gericht oder ein unmittelbareres disziplinierendes Eingreifen gemeint ist.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: erinnere dich daran
  rationale: Der präsentische Imperativ fordert zu fortdauernder, bewusster Erinnerung auf; die Formulierung ist natürlich und nachdrücklich.
- source_word: οὖν
  choice: darum / nun
  rationale: Das erste οὖν kennzeichnet die Folgerung aus dem vorherigen Tadel; das zweite leitet die entsprechende Warnung ein.
- source_word: πῶς
  choice: wie
  rationale: Die Übersetzung bewahrt den griechischen Hinweis auf die Art und Weise des Empfangens, ohne die mögliche Beziehung auf den Inhalt auszuschließen.
- source_word: εἴληφας καὶ ἤκουσας
  choice: du empfangen und gehört hast
  rationale: Das Perfekt von λαμβάνω bezeichnet einen zurückliegenden Empfang mit bleibender Bedeutung; der Aorist von ἀκούω verweist schlicht auf das frühere Hören.
- source_word: τήρει
  choice: halte daran fest
  rationale: τηρέω umfasst Bewahren, Festhalten und Befolgen. „Halte daran fest“ ist im Deutschen natürlicher als ein unbestimmtes „bewahre es“ und lässt Gehorsam sowie treues Bewahren anklingen.
- source_word: μετανόησον
  choice: kehre um
  rationale: „Kehre um“ gibt den Aufruf zur Abkehr von der Sünde in verständlicher, gegenwärtiger Sprache wieder.
- source_word: γρηγορήσῃς
  choice: wachsam bist
  rationale: Das Verb greift das Bild des Wachseins auf und bezeichnet geistliche Wachsamkeit; die konditionale Form wird im Deutschen idiomatisch mit „bist“ wiedergegeben.
- source_word: ἥξω ὡς κλέπτης
  choice: ich werde kommen wie ein Dieb
  rationale: Die geläufige Vergleichsform bewahrt das Bild eines plötzlichen und unerwarteten Kommens.
- source_word: οὐ μὴ γνῷς
  choice: du wirst ganz gewiss nicht wissen
  rationale: „Ganz gewiss nicht“ bildet die starke griechische Verneinung οὐ μή deutlich und idiomatisch ab.
- source_word: ποίαν ὥραν
  choice: zu welcher Stunde
  rationale: Die Formulierung erhält die konkrete Zeitangabe und den feierlichen Ton des Ausgangstextes.
- source_word: ἐπὶ σέ
  choice: über dich
  rationale: „Über dich kommen“ wahrt die bedrohliche Bewegung auf den Adressaten zu, ohne festzulegen, ob Gericht, Züchtigung oder eine andere Heimsuchung gemeint ist.
theological_decisions:
- issue: Bedeutung von πῶς in der Aufforderung zur Erinnerung
  choice: „wie du empfangen und gehört hast“
  alternative: „was du empfangen und gehört hast“
  rationale: πῶς bedeutet unmittelbar „wie“ und kann die Art des ursprünglichen Empfangs hervorheben. Da der Zusammenhang zugleich an die empfangene Botschaft denken lässt, wird die alternative Auffassung in einer Fußnote genannt.
- issue: Reichweite der Warnung „ich werde kommen wie ein Dieb“
  choice: Das unerwartete Kommen bleibt ohne nähere heilsgeschichtliche Festlegung.
  alternative: Ausdrückliche Deutung als endgültige Wiederkunft oder als zeitnahes örtliches Strafgericht
  rationale: Der Vers selbst entscheidet nicht, ob das endgültige Gericht oder ein unmittelbareres disziplinierendes Eingreifen gemeint ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt nahe am griechischen Aufbau, wird aber durch „daran festhalten“ und „wachsam sein“ idiomatisch gestaltet. Die starke Warnung und ihre bewusst offene theologische Reichweite bleiben erhalten.
