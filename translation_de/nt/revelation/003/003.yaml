  to: Darum erinnere dich daran, wie du empfangen und gehört hast[a]; halte daran fest und kehre um. Wenn du nun nicht wach bleibst[b], werde ich kommen wie ein Dieb[c], und du wirst ganz gewiss nicht wissen, zu welcher Stunde ich über dich komme.
