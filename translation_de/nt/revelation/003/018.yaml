id: REV.3.18
reference: Revelation 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: de
  text: Ich rate dir, von mir Gold zu kaufen, das im Feuer geläutert ist,[a] damit du reich wirst, und weiße Gewänder,[b] damit du sie anziehst und die Schande deiner Nacktheit nicht offenbar wird, und Augensalbe,[c] um deine Augen zu salben, damit du sehen kannst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Feuer gereinigt“ beziehungsweise „im Feuer erprobt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weiße Kleider“; je nach Zusammenhang kann das Wort auch besondere Obergewänder bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist ein medizinisches Präparat, das auf die Augen aufgetragen wurde.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω σοι
  choice: Ich rate dir
  rationale: Gibt den gewichtigen, persönlichen Rat natürlich und würdig wieder, ohne daraus einen ausdrücklichen Befehl zu machen.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: von mir ... zu kaufen
  rationale: Bewahrt sowohl das Kaufbild als auch die durch παρά mit Genitiv bezeichnete Bezugsquelle.
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: Gold, das im Feuer geläutert ist
  rationale: „Geläutert“ ist für Edelmetall idiomatisch und gibt den durch Feuer bewirkten Zustand des perfekten Passivpartizips wieder.
- source_word: ἵνα πλουτήσῃς
  choice: damit du reich wirst
  rationale: Das inchoative Moment des Aoristkonjunktivs wird mit „reich wirst“ klar ausgedrückt.
- source_word: ἱμάτια λευκά
  choice: weiße Gewänder
  rationale: „Gewänder“ ist ein breiter, würdiger Ausdruck und verengt die Bildsprache nicht auf eine besondere Kleidungsart.
- source_word: ἵνα περιβάλῃ
  choice: damit du dich bekleidest
  rationale: Die reflexive Form bildet den medialen Sinn ab und bewahrt das Motiv persönlicher Aneignung.
- source_word: μὴ φανερωθῇ
  choice: nicht sichtbar wird
  rationale: Gibt den passiven Vorgang natürlich wieder, ohne stärker als der griechische Ausdruck eine öffentliche Bloßstellung zu behaupten.
- source_word: ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: die Schande deiner Nacktheit
  rationale: Entspricht der Genitivverbindung direkt und erhält ihren moralisch-symbolischen Ernst.
- source_word: κολλούριον
  choice: Augensalbe
  rationale: Bezeichnet verständlich das medizinische Präparat für die Augen, ohne den technischen Fremdbegriff „Kollyrium“ zu verwenden.
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: um deine Augen damit zu bestreichen
  rationale: Gibt das Auftragen durch Einreiben präzise und im Deutschen natürlich wieder; „salben“ könnte hier unnötig kultische oder sakramentale Assoziationen wecken.
- source_word: ἵνα βλέπῃς
  choice: damit du sehen kannst
  rationale: Drückt den Zweck beziehungsweise das ermöglichte Sehen in natürlichem Deutsch aus.
theological_decisions:
- issue: Symbolische Bedeutung von Gold, weißen Gewändern und Augensalbe
  choice: Die drei Gegenstände bleiben im Haupttext als nicht ausgedeutete Bilder stehen.
  alternative: Gold als geistlichen Reichtum, Gewänder als Gerechtigkeit oder Reinheit und Augensalbe als geistliche Einsicht bereits in der Übersetzung erklären.
  rationale: Der Vers entfaltet die geistlichen Entsprechungen nicht ausdrücklich. Eine wörtlich-bildhafte Wiedergabe wahrt die Offenheit und lässt die Deutung aus dem Kontext hervorgehen.
- issue: Mögliche kultische oder sakramentale Resonanz von ἐγχρῖσαι
  choice: „bestreichen“ als konkrete medizinische Anwendung
  alternative: „salben“, um die lexikalisch mögliche symbolische Resonanz stärker hörbar zu machen
  rationale: Im unmittelbaren Zusammenhang mit Augensalbe bezeichnet das Verb deren Anwendung. „Bestreichen“ ist präzise und vermeidet eine unbegründete Festlegung auf einen sakramentalen Sinn.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt der dreifachen Aufzählung des Griechischen, wird aber durch idiomatische Zweckangaben lesbar gehalten. Sämtliche Fußnotenmarker stehen an den jeweils einschlägigen Ausdrücken im Haupttext.
