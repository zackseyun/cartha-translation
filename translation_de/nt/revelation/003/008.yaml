source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: de
  text: Ich kenne deine Taten. Sieh[a], ich habe dir eine Tür geöffnet, die niemand schließen kann; denn du hast nur geringe Kraft und hast an meinem Wort festgehalten und meinen Namen nicht verleugnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe“. Der Ausdruck ruft nachdrücklich zur Aufmerksamkeit auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: Ich kenne deine Taten
  rationale: οἶδα ist der Form nach Perfekt, hat aber präsentische Bedeutung. „Taten“ bewahrt das konkrete Plural τὰ ἔργα und die wiederkehrende Formel der Offenbarung.
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf wird modern und würdig wiedergegeben, ohne das altertümlichere „Siehe“ zu verlangen.
- source_word: δέδωκα ἐνώπιόν σου
  choice: ich habe vor dir … gegeben
  rationale: Die relativ formale Wiedergabe bewahrt das Verb δίδωμι sowie die vollendete Handlung mit gegenwärtiger Geltung. Im Deutschen ist eine vor jemandem gegebene Tür ungewöhnlich, aber verständlich und erhält die markante Bildsprache.
- source_word: θύραν ἠνεῳγμένην
  choice: eine geöffnete Tür
  rationale: Das Perfektpassiv-Partizip bezeichnet ausdrücklich eine Tür, die geöffnet worden ist und offen steht; „geöffnet“ bewahrt diese verbale und resultative Nuance.
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: die niemand schließen kann
  rationale: „Kann“ gibt die Fähigkeit von δύναται natürlich wieder; das im Griechischen wiederaufgenommene Pronomen αὐτήν wird gemäß deutscher Syntax nicht eigens wiederholt.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: denn du hast nur geringe Kraft
  rationale: ὅτι wird kausal verstanden. „Geringe Kraft“ wahrt δύναμις und die Begrenztheit; „nur“ verdeutlicht idiomatisch die geringe Größe, ohne die Aussage als völlige Kraftlosigkeit zu überzeichnen.
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: hast aber an meinem Wort festgehalten
  rationale: τηρέω umfasst Bewahren, Beachten und treues Festhalten. Die Wendung ist im Deutschen natürlich und lässt diese Bedeutungsbreite bestehen; λόγος bleibt „Wort“.
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: meinen Namen nicht verleugnet
  rationale: „Verleugnen“ entspricht ἀρνέομαι im Zusammenhang öffentlicher Treue beziehungsweise Abkehr und bewahrt „Name“ als Ausdruck der Zugehörigkeit.
theological_decisions:
- issue: Bedeutung der geöffneten Tür
  choice: Das Bild bleibt als „geöffnete Tür“ unaufgelöst.
  alternative: Missionsgelegenheit, Zugang zum Heil beziehungsweise Reich oder allgemein eine von Gott eröffnete Möglichkeit
  rationale: Der Vers selbst deutet die Metapher nicht eindeutig aus; eine erklärende Übersetzung würde die theologische Offenheit einschränken.
- issue: Verhältnis zwischen geringer Kraft und Treue
  choice: Mit „aber“ wird der im Satz erkennbare Gegensatz zwischen begrenzter Kraft und bewahrter Treue natürlich ausgedrückt.
  alternative: Reine Reihung mit „und“, die den möglichen konzessiven Zusammenhang weniger deutlich macht
  rationale: Das wiederholte καί kann im Kontext einen konzessiven beziehungsweise adversativen Zug tragen. Die Übersetzung macht diesen plausiblen Zusammenhang lesbar, ohne geringe Kraft als Grund der Treue auszulegen.
- issue: Zeitliche Aussage der Perfektformen
  choice: Deutsche Perfektformen für das Geben, Festhalten und Nichtverleugnen
  alternative: 'Präteritum: „gab“, „hieltest fest“, „verleugnetest nicht“'
  rationale: Das Perfekt gibt abgeschlossene Handlungen mit fortwirkender Bedeutung wieder, besonders den bleibenden Zustand der geöffneten Tür.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede steht entsprechend dem griechischen Singular durchgehend im „du“. Die ungewöhnliche Wendung „vor dir … gegeben“ wurde aus Quelltextnähe beibehalten; die Metapher wird nicht theologisch ausgedeutet.
