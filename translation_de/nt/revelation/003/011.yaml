id: REV.3.11
reference: Revelation 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: de
  text: Ich komme bald[a]. Halte fest, was du hast, damit niemand dir deinen Siegeskranz nimmt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schnell“ bzw. „unverzüglich“. Das griechische Adverb kann entweder zeitliche Nähe oder die Schnelligkeit des Geschehens betonen.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort bezeichnet einen als Auszeichnung verliehenen Kranz, besonders einen Siegeskranz, nicht speziell ein königliches Diadem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: Ich komme
  rationale: Das griechische Präsens hat hier im Kontext eine bevorstehende, zukunftsbezogene Bedeutung. „Ich komme“ ist im Deutschen natürlich und bewahrt zugleich die unmittelbare Aussageform.
- source_word: ταχύ
  choice: bald
  rationale: Das Adverb kann zeitliche Nähe („bald“) oder die Schnelligkeit des Geschehens („schnell“) hervorheben. Im Haupttext gibt „bald“ die naheliegende Ankündigung wieder; die echte Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: κράτει
  choice: Halte fest
  rationale: Der Imperativ fordert zu entschlossenem Festhalten und Ausharren auf. „Halte fest“ ist prägnant, verständlich und entspricht der Bildhaftigkeit des Verbs.
- source_word: ὃ ἔχεις
  choice: was du hast
  rationale: Die Formulierung lässt den Gegenstand wie im Griechischen unausgesprochen und überlässt seine nähere Bestimmung dem Kontext.
- source_word: ἵνα μηδεὶς λάβῃ
  choice: damit niemand … nimmt
  rationale: „Damit“ gibt den Zweck beziehungsweise das zu verhindernde Ergebnis natürlich wieder. Die Stellung mit „dir“ macht im Deutschen deutlich, wem der Kranz gehört, ohne den Sinn zu erweitern.
- source_word: τὸν στέφανόν σου
  choice: deinen Siegeskranz
  rationale: στέφανος bezeichnet hier einen als Auszeichnung verliehenen Kranz, nicht speziell ein königliches Diadem. „Siegeskranz“ macht diese im Deutschen sonst leicht verlorene Bedeutung verständlich.
theological_decisions:
- issue: Bedeutungsnuance von ταχύ bei der Ankündigung des Kommens Christi
  choice: bald
  alternative: schnell / unverzüglich
  rationale: Der Wortlaut kann zeitliche Nähe oder die Schnelligkeit des Eintretens betonen. Der Haupttext verwendet die kontextuell naheliegende zeitliche Lesart, während die Fußnote die andere Möglichkeit offenhält.
- issue: Bedeutung des Kranzes
  choice: Siegeskranz
  alternative: Krone
  rationale: Die Übersetzung vermeidet eine unbeabsichtigte Festlegung auf königliche Herrschaft und wahrt den Auszeichnungs- beziehungsweise Siegeraspekt von στέφανος, ohne näher zu bestimmen, worin die Belohnung besteht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Imperativ- und Aussagesätze bewahren die Dringlichkeit des Originals. „Siegeskranz“ ist allgemein verständlich und lexikalisch genauer als das mehrdeutige „Krone“.
