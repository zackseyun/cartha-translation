id: REV.3.9
reference: Revelation 3:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: de
  text: Siehe, ich gebe dir einige aus der Synagoge des Satans[a] – solche, die sagen, sie seien Juden, es aber nicht sind, sondern lügen. Siehe, ich werde sie dazu bringen, dass sie kommen, sich vor deinen Füßen niederwerfen[b] und erkennen, dass ich dich geliebt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ich gebe aus der Synagoge des Satans“. Gemeint sind wahrscheinlich einige Menschen aus dieser Gruppe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor deinen Füßen anbeten“. Das griechische Verb kann sowohl ein Niederwerfen als Zeichen der Huldigung als auch Anbetung bezeichnen. Hier vermeidet „sich niederwerfen“ den missverständlichen Eindruck, den Gläubigen werde göttliche Anbetung erwiesen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Siehe
  rationale: Das zweimalige Aufmerksamkeitssignal wird mit dem würdevollen, im modernen Bibeldeutsch weiterhin verständlichen „Siehe“ wiedergegeben.
- source_word: διδῶ
  choice: ich gebe dir einige
  rationale: Das Präsens bleibt erhalten. „Einige“ ergänzt das im Griechischen unausgedrückte Objekt und wahrt den durch ἐκ angezeigten Teilbezug; „dir“ macht den aus dem Kontext erschließbaren Empfänger verständlich.
- source_word: ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: aus der Synagoge des Satans
  rationale: ἐκ wird als Herkunftsangabe wiedergegeben; der scharfe polemische Genitiv bleibt ohne abschwächende oder erweiternde Deutung stehen.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: von denen, die sagen, sie seien Juden
  rationale: Die reflexive Identitätsbehauptung wird natürlich und eng am Griechischen ausgedrückt; der Konjunktiv markiert die wiedergegebene Behauptung.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: und es nicht sind, sondern lügen
  rationale: Die scharfe Gegenüberstellung bleibt erhalten, ohne die Aussage über ihren Wortlaut hinaus ethnisch oder theologisch auszudeuten.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν καὶ προσκυνήσουσιν
  choice: ich werde sie dazu bringen, zu kommen und sich niederzuwerfen
  rationale: Die kausative Konstruktion wird idiomatisch wiedergegeben. προσκυνέω bezeichnet hier angesichts der Ortsangabe vor den Füßen eine körperliche Huldigung beziehungsweise Unterwerfung; „niederwerfen“ bewahrt diese Geste, ohne göttliche Anbetung der Gemeinde zu unterstellen.
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: vor deinen Füßen
  rationale: Die räumliche Formulierung wird formal nah und zugleich natürlich wiedergegeben.
- source_word: γνῶσιν
  choice: Dann werden sie erkennen
  rationale: „Erkennen“ gibt den resultativen Sinn gut wieder; „Dann“ verdeutlicht den im ἵνα-Satz angelegten Folgezusammenhang, ohne eine zusätzliche inhaltliche Behauptung einzuführen.
- source_word: ἐγὼ ἠγάπησά σε
  choice: dass ich dich geliebt habe
  rationale: Das betonte ἐγώ ist durch die deutsche Verbform bereits klar; das Aoristverb wird als vollendete Aussage wiedergegeben, ohne es zu einem bloßen Präsens zu glätten.
theological_decisions:
- issue: Bedeutung derer, die sagen, sie seien Juden, und es nicht sind
  choice: Die polemische Aussage wird textnah als Bestreitung ihres behaupteten Judeseins wiedergegeben, ohne zu erläutern, in welchem ethnischen, geistlichen oder bundestheologischen Sinn dies gemeint ist.
  alternative: Die Aussage ausdrücklich als ethnische Bestreitung oder als vollständige geistliche Neudefinition des Begriffs „Juden“ auslegen.
  rationale: Der griechische Text urteilt scharf, bestimmt aber in diesem Vers nicht ausdrücklich die genaue Ebene der bestrittenen Identität. Die Übersetzung bewahrt diese theologische Spannung und vermeidet weitergehende antijüdische Verallgemeinerungen.
- issue: Bedeutung von προσκυνήσουσιν vor den Füßen des Angeredeten
  choice: „sich niederwerfen“ als Geste der Huldigung oder Unterwerfung
  alternative: „anbeten“
  rationale: „Anbeten“ könnte im heutigen Deutsch fälschlich göttliche Verehrung der Gläubigen ausdrücken. Die körperliche Geste und die mögliche Anspielung auf prophetische Umkehrmotive bleiben mit „sich niederwerfen“ erhalten.
- issue: Aspekt von ἠγάπησά σε
  choice: „ich dich geliebt habe“
  alternative: „ich dich liebe“
  rationale: Die Perfektform im Deutschen wahrt den rückblickenden beziehungsweise vollendeten Charakter des griechischen Aorists, ohne die fortdauernde Bedeutung der Liebe auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ bewahrt den feierlichen Offenbarungston, ohne altertümliche Satzformen zu häufen. Gedankenstrich und klare Satzgliederung machen die komplexe griechische Konstruktion gut verständlich; die polemische Sprache wird weder verschärft noch abgeschwächt.
