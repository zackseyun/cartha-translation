id: REV.3.14
reference: Revelation 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: de
  text: 'Und dem Engel[b] der Gemeinde in Laodizea schreibe: So spricht der Amen, der treue und wahrhaftige Zeuge, der Anfang[a] der Schöpfung Gottes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „der Ursprung der Schöpfung Gottes“ oder „der Herrscher über Gottes Schöpfung“. Das griechische Wort archē kann „Anfang“, „Ursprung“ oder „Herrscher“ bedeuten.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Bote“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: Engel
  rationale: Das Wort kann einen himmlischen Engel oder einen menschlichen Boten bezeichnen. In der wiederkehrenden Anredeformel der Offenbarung ist „Engel“ die naheliegende und etablierte Wiedergabe; die mögliche Alternative wird in einer Fußnote genannt.
- source_word: Τάδε λέγει
  choice: So spricht
  rationale: Diese im Deutschen geläufige prophetische Botenformel gibt den feierlichen Charakter der griechischen Wendung natürlich und prägnant wieder.
- source_word: ὁ Ἀμήν
  choice: der Amen
  rationale: „Amen“ bleibt als markanter christologischer Titel erhalten und bewahrt den hebräisch-liturgischen Anklang von Gewissheit und Wahrheit.
- source_word: ὁ μάρτυς ὁ πιστὸς καὶ ἀληθινός
  choice: der treue und wahrhaftige Zeuge
  rationale: Die Formulierung erhält sowohl den Zeugnischarakter von μάρτυς als auch die persönliche Zuverlässigkeit von πιστός und den Sinn des Echten beziehungsweise der Wirklichkeit Entsprechenden in ἀληθινός.
- source_word: ἡ ἀρχὴ
  choice: der Anfang
  rationale: ἀρχή kann Anfang, Ursprung oder Herrschaft bezeichnen. „Anfang“ ist die unmittelbarste Wiedergabe und lässt die theologisch bedeutsame Mehrdeutigkeit bestehen.
- source_word: τῆς κτίσεως τοῦ θεοῦ
  choice: der Schöpfung Gottes
  rationale: Die schlichte Genitivkonstruktion gibt κτίσις und τοῦ θεοῦ direkt und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ als christologischer Titel
  choice: der Anfang der Schöpfung Gottes
  alternative: der Ursprung der Schöpfung Gottes; der Herrscher über Gottes Schöpfung
  rationale: Die Hauptfassung folgt der unmittelbarsten Bedeutung von ἀρχή, ohne die umstrittene Aussage zugunsten einer bestimmten theologischen Deutung aufzulösen. Die ebenfalls möglichen Bedeutungen „Ursprung“ und „Herrscher“ werden transparent in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel „So spricht“ ist geläufig und feierlich. Die Fußnotenmarker stehen aus syntaktischen Gründen gesammelt am Versende; [a] erläutert „Anfang“, [b] „Engel“.
