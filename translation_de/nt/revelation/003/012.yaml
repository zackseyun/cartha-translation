id: REV.3.12
reference: Revelation 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: de
  text: Wer siegt, den werde ich zu einer Säule im Tempel meines Gottes machen, und er wird ganz gewiss nie mehr hinausgehen.[a] Ich werde auf ihn den Namen meines Gottes schreiben und den Namen der Stadt meines Gottes, des neuen Jerusalem, das aus dem Himmel von meinem Gott herabkommt, und meinen neuen Namen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit nachdrücklicher Verneinung: „Er wird gewiss niemals mehr hinausgehen.“'
    reason: Die griechische Verbindung οὐ μή mit dem Konjunktiv verstärkt die Verneinung und betont die endgültige Dauerhaftigkeit.
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Wer siegt
  rationale: Das substantivierte Präsenspartizip bezeichnet denjenigen, der siegreich bleibt. „Wer siegt“ ist natürliches Deutsch und bewahrt das wiederkehrende νικάω-Motiv der Offenbarung.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: den werde ich zu einer Säule … machen
  rationale: Die Konstruktion mit prädikativem Akkusativ wird im Deutschen idiomatisch mit „zu einer Säule machen“ wiedergegeben; das architektonische Bild bleibt erhalten.
- source_word: ἐν τῷ ναῷ
  choice: im Tempel
  rationale: ναός bezeichnet den Tempel beziehungsweise das Heiligtum, nicht allgemein den gesamten Tempelbezirk. „Tempel“ ist hier verständlich und bildkräftig.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: er wird ganz gewiss nie mehr hinausgehen
  rationale: „Ganz gewiss nie mehr“ gibt die nachdrückliche Verneinung οὐ μή wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Bezugsobjekt hinzuzufügen.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: ich werde auf ihn … schreiben
  rationale: Die konkrete Formulierung bewahrt das Bild des Beschriftens beziehungsweise Kennzeichnens, ohne es durch „eingravieren“ unnötig festzulegen.
- source_word: τῆς καινῆς Ἰερουσαλήμ
  choice: des neuen Jerusalem
  rationale: Die Apposition benennt die Stadt Gottes. Die deutsche Form wahrt Artikel und adjektivische Bestimmung.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: das aus dem Himmel von meinem Gott herabkommt
  rationale: „Aus dem Himmel“ gibt ἐκ als Herkunftsraum und „von meinem Gott“ ἀπό als Ursprung wieder; das Präsenspartizip wird beschreibend mit „herabkommt“ übersetzt.
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: meinen neuen Namen
  rationale: Die Nachstellung von τὸ καινόν hebt „neu“ hervor. Im Deutschen trägt „meinen neuen Namen“ diese Bedeutung natürlich; „meinen eigenen neuen Namen“ wäre schwerfällig und könnte einen zusätzlichen Gegensatz nahelegen.
theological_decisions:
- issue: Generisches Maskulinum in der Verheißungsformel
  choice: „Wer siegt, den …; er …; auf ihn“
  alternative: geschlechtsneutrale Plural- oder Personenform
  rationale: Das Griechische verwendet durchgehend den repräsentativen maskulinen Singular. Die deutsche Wiedergabe bewahrt Numerus, Bildzusammenhang und grammatische Bezüge, ohne die Verheißung inhaltlich auf Männer einzuschränken.
- issue: Wiederholung von „mein Gott“
  choice: alle vier Vorkommen beibehalten
  alternative: Wiederholungen stilistisch verkürzen
  rationale: Die vierfache Wiederholung ist ausdrücklich im Ausgangstext vorhanden und christologisch bedeutsam. Sie wird weder geglättet noch erklärt.
- issue: Der neue Name Christi
  choice: „meinen neuen Namen“ ohne inhaltliche Deutung
  alternative: „meinen eigenen neuen Namen“ oder eine erklärende Umschreibung
  rationale: Die Übersetzung bewahrt die Aussage und ihr theologisches Geheimnis, ohne den Inhalt oder Zeitpunkt dieses Namens spekulativ zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Sprache und die wiederholten Namens- und Gottesformulierungen bleiben bewusst erhalten. Der einzige Fußnotenmarker steht unmittelbar bei der emphatischen Verneinung, die er erläutert.
