id: REV.3.10
reference: Revelation 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: de
  text: Weil du an meinem Wort vom standhaften Ausharren festgehalten hast[a], werde auch ich dich vor der Stunde der Prüfung bewahren[b], die im Begriff ist, über die ganze bewohnte Welt zu kommen, um die zu prüfen, die auf der Erde wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wort von meinem Ausharren“ oder „mein Wort, das zum Ausharren aufruft“. Die griechische Wendung lässt mehrere eng verwandte Deutungen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch die Stunde der Prüfung hindurch bewahren“ beziehungsweise „aus der Stunde der Prüfung heraushalten“. Das griechische „bewahren aus/von“ entscheidet für sich allein nicht, auf welche Weise dieser Schutz geschieht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: an … festgehalten hast
  rationale: Bei einem Wort oder einer Botschaft gibt „an etwas festhalten“ die treue Befolgung und Bewahrung im Deutschen natürlich wieder. Das Perfekt passt zur begründenden Rückschau und ihrer fortdauernden Bedeutung.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: mein Wort vom standhaften Ausharren
  rationale: Die Formulierung bleibt offen dafür, ob das Wort von Jesu Ausharren handelt, durch Ausharren geprägt ist oder zum Ausharren aufruft. „Standhaftes Ausharren“ trifft ὑπομονή im Kontext besser als bloße Geduld.
- source_word: κἀγώ
  choice: auch ich
  rationale: 'Die betonte Gegenseitigkeit bleibt erhalten: Weil die Gemeinde festgehalten hat, wird auch Christus bewahren.'
- source_word: τηρήσω ἐκ
  choice: werde … vor … bewahren
  rationale: „Vor etwas bewahren“ ist die direkte und natürliche deutsche Wiedergabe, ohne festzulegen, ob der Schutz durch Herausnahme, Fernhaltung oder Bewahrung während der Prüfung geschieht.
- source_word: ὥρας
  choice: Stunde
  rationale: „Stunde“ bewahrt das apokalyptische Zeitwort des Griechischen, auch wenn damit ein begrenzter Zeitraum gemeint sein kann.
- source_word: πειρασμοῦ
  choice: Prüfung
  rationale: „Prüfung“ umfasst Erprobung und Bedrängnis, ohne die Stelle auf moralische Versuchung zu verengen.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: die im Begriff ist, … zu kommen
  rationale: Die Wendung bildet den prospektiven, möglicherweise unmittelbar bevorstehenden Sinn von μέλλω mit Infinitiv ab.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: über die ganze bewohnte Welt
  rationale: „Bewohnte Welt“ gibt οἰκουμένη genauer wieder als das umfassendere „Kosmos“ und bleibt im Deutschen verständlich.
- source_word: πειράσαι
  choice: um … zu prüfen
  rationale: Der Infinitiv bezeichnet hier den Zweck der kommenden Prüfungsstunde und nimmt πειρασμός sprachlich wieder auf.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: die, die auf der Erde wohnen
  rationale: Die verbale Form und die in der Offenbarung wiederkehrende Wendung bleiben sichtbar; „Erde“ ist im weltweiten Kontext naheliegender als „Land“.
theological_decisions:
- issue: Bedeutung von τηρήσω ἐκ im endzeitlichen Zusammenhang
  choice: vor der Stunde der Prüfung bewahren
  alternative: durch die Stunde der Prüfung hindurch bewahren; aus der Stunde der Prüfung heraushalten
  rationale: Die Hauptfassung folgt der gewöhnlichen deutschen Verbindung „vor etwas bewahren“. Sie entscheidet nicht, ob Schutz durch Herausnahme vor der Prüfung, Fernhaltung von ihr oder Bewahrung in beziehungsweise durch sie hindurch erfolgt.
- issue: Genitiv in τὸν λόγον τῆς ὑπομονῆς μου
  choice: mein Wort vom standhaften Ausharren
  alternative: das Wort von meinem Ausharren; mein Wort, das zum Ausharren aufruft
  rationale: Der griechische Genitiv lässt mehrere eng verwandte Deutungen zu. Die Fassung hält diese Spannung offen und erläutert sie in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Standhaftes Ausharren“ trägt den aktiven Sinn von ὑπομονή; „bewohnte Welt“ und „Stunde“ bewahren die apokalyptische Bildsprache. Die wiederholte griechische Verwendung von τηρέω wird im Deutschen aus idiomatischen Gründen mit „festhalten“ und „bewahren“ wiedergegeben.
