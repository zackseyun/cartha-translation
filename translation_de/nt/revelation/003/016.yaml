source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: de
  text: Darum, weil du lauwarm bist und weder heiß noch kalt, bin ich im Begriff, dich aus meinem Mund zu erbrechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich aus meinem Mund auszuspeien“. Das griechische Verb bedeutet direkt „erbrechen“ und ist stärker als „ausspucken“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: οὕτως, ὅτι
  choice: Weil du also
  rationale: Die Verbindung gibt den Grund für die angekündigte Folge an. „Weil … also“ klingt im Deutschen natürlich und bewahrt sowohl den kausalen als auch den folgernden Zusammenhang.
- source_word: χλιαρός
  choice: lauwarm
  rationale: „Lauwarm“ ist die geläufige und genaue deutsche Entsprechung und erhält das Temperaturbild.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: weder heiß noch kalt
  rationale: Die direkte Gegenüberstellung bleibt ohne metaphorische Ausdeutung erhalten.
- source_word: μέλλω
  choice: werde ich … gleich
  rationale: „Gleich“ bringt die bevorstehende, unmittelbar drohende Handlung natürlich zum Ausdruck; ein bloßes Futur würde den Aspekt der Nähe abschwächen.
- source_word: ἐμέσαι
  choice: erbrechen
  rationale: Das Verb bezeichnet ausdrücklich das Erbrechen. Diese Wiedergabe bewahrt das bewusst drastische Bild und schwächt es nicht zu „ausspucken“ ab.
- source_word: ἐκ τοῦ στόματός μου
  choice: aus meinem Mund
  rationale: Die Formulierung erhält das konkrete körperliche Bild des Ausstoßens.
theological_decisions:
- issue: Stärke des Gerichtsbildes in ἐμέσαι
  choice: Das drastische Bild mit „erbrechen“ beibehalten.
  alternative: „ausspeien“ oder „ausspucken“
  rationale: Der griechische Ausdruck schildert bewusst schockierend die drohende Verwerfung. Eine mildere Wiedergabe würde die rhetorische und theologische Schärfe abschwächen.
- issue: Zeitliche Bedeutung von μέλλω
  choice: Die unmittelbar bevorstehende Handlung mit „werde … gleich“ ausdrücken.
  alternative: 'Schlichtes Futur: „werde … erbrechen“'
  rationale: μέλλω mit Infinitiv weist hier auf ein bevorstehendes Geschehen hin. Die Übersetzung bewahrt dadurch die Dringlichkeit der Warnung.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, aber bewusst drastischem Ausdruck. Die Satzstellung ist idiomatisch deutsch und erhält Ursache, Folgerung und Dringlichkeit des griechischen Textes.
