id: REV.3.17
reference: Revelation 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: de
  text: 'Denn du sagst: »Ich bin reich und bin zu Wohlstand gekommen und brauche nichts.« Und du weißt nicht, dass gerade du elend und erbärmlich, arm, blind und nackt bist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις
  choice: Denn du sagst
  rationale: Das einleitende ὅτι begründet im Zusammenhang den Tadel; »denn« gibt diese kausale Funktion würdig und natürlich wieder.
- source_word: Πλούσιός εἰμι
  choice: Ich bin reich
  rationale: Direkte und idiomatische Wiedergabe der wirtschaftlichen Selbsteinschätzung.
- source_word: πεπλούτηκα
  choice: bin zu Wohlstand gekommen
  rationale: Das Perfekt bezeichnet einen erreichten, fortbestehenden Zustand und unterscheidet sich so von der vorausgehenden Aussage »Ich bin reich«.
- source_word: οὐδὲν χρείαν ἔχω
  choice: brauche nichts
  rationale: Natürliches modernes Deutsch, das das betonte οὐδέν vollständig wiedergibt.
- source_word: οὐκ οἶδας
  choice: du weißt nicht
  rationale: Bewahrt die ausdrückliche Erkenntnisaussage des griechischen Verbs, ohne sie deutend zu »erkennst nicht« abzuschwächen.
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: dass gerade du elend ... bist
  rationale: »Gerade du« nimmt die Betonung durch σὺ und die zugespitzte Formulierung mit Artikel auf; eine substantivische Wiedergabe wie »der Elende« wäre im Deutschen unnötig gekünstelt.
- source_word: ἐλεεινός
  choice: erbärmlich
  rationale: Bezeichnet einen Zustand, der Erbarmen hervorruft, und bleibt zugleich von ταλαίπωρος (»elend«) unterschieden.
- source_word: πτωχὸς καὶ τυφλὸς καὶ γυμνός
  choice: arm, blind und nackt
  rationale: Die konkreten Bilder und ihr rhetorischer Gegensatz zur behaupteten Selbstgenügsamkeit bleiben unverändert erhalten.
theological_decisions:
- issue: Ob der Gegensatz zwischen äußerem Wohlstand und dem von Christus beurteilten Zustand ausdrücklich als geistlich bezeichnet werden soll
  choice: Die Bildwörter »reich«, »arm«, »blind« und »nackt« bleiben ohne erklärenden Zusatz stehen.
  alternative: »geistlich arm«, »geistlich blind« oder eine entsprechende Paraphrase
  rationale: Der Text entfaltet die ironische und metaphorische Spannung selbst. Ein Zusatz wie »geistlich« würde die Auslegung in den Haupttext eintragen.
- issue: Wie die Zuspitzung von σὺ εἶ ὁ ταλαίπωρος wiederzugeben ist
  choice: »dass gerade du elend ... bist«
  alternative: »dass du der Elende bist«
  rationale: Die gewählte Form bewahrt die emphatische Gegenüberstellung, ohne im Deutschen eine möglicherweise ontologische oder titularische Bedeutung des substantivierten Ausdrucks nahezulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem, direktem Ton. Die wiederholte Reihung der Zustandsbeschreibungen bleibt erhalten; »Doch« markiert den scharfen Gegensatz zwischen Selbsturteil und tatsächlichem Zustand.
