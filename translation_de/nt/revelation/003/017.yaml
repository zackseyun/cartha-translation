  to: 'Denn du sagst: »Ich bin reich und bin zu Wohlstand gekommen und brauche nichts.« Und du weißt nicht, dass gerade du elend und erbärmlich, arm, blind und nackt bist.'
  rationale: Die einzige Änderung ersetzt das deutender-kontrastierende »Doch« durch das quellennähere koordinierende »Und«. Die Betonung in »gerade du«, die fünfgliedrige Zustandsreihe und die unkommentierten Bildfelder bleiben erhalten.
