id: REV.3.19
reference: Revelation 3:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: de
  text: Ich weise alle, die ich lieb habe,[a] zurecht und erziehe sie. Darum sei eifrig[b] und kehre um!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wen immer ich lieb habe“.'
    reason: Die griechische Konstruktion ὅσους ἐὰν hat einen indefiniten Sinn und kann sowohl kollektiv als „alle, die“ als auch distributiv als „wen immer“ wiedergegeben werden.
  - marker: b
    text: 'Oder: „sei mit Ernst dabei“ beziehungsweise „sei voller Eifer“.'
    reason: ζήλευε bezeichnet nachdrücklichen, anhaltenden Eifer; die Alternativen verdeutlichen die Bedeutungsbreite.
lexical_decisions:
- source_word: ἐγὼ
  choice: ich
  rationale: Das ausdrückliche Pronomen trägt im Griechischen Nachdruck. Im Deutschen lässt sich dieser durch die Voranstellung von „Ich“ bewahren, ohne die schwerfällige Wendung „Was mich betrifft“ einzuführen.
- source_word: ὅσους ἐὰν
  choice: alle, die
  rationale: 'Die indefinite Relativkonstruktion bezeichnet die Gesamtheit der jeweils Betroffenen: „alle, die“ beziehungsweise „wen immer“. „Alle, die“ ist hier natürlich und bewahrt den weiten Bezug.'
- source_word: φιλῶ
  choice: lieb habe
  rationale: φιλέω bezeichnet persönliche Liebe und Zuneigung. „lieb habe“ gibt diese relationale Färbung natürlich wieder, ohne die Liebe abzuschwächen oder einen starren Gegensatz zu ἀγαπάω einzutragen.
- source_word: ἐλέγχω
  choice: überführe
  rationale: ἐλέγχω umfasst das Aufdecken und Zurechtweisen eines Fehlers mit dem Ziel der Einsicht. „überführe“ wahrt diesen Sinn besser als das allgemeinere „weise zurecht“.
- source_word: παιδεύω
  choice: erziehe
  rationale: παιδεύω meint korrigierende, formende Erziehung und nicht bloß Strafe. „erziehe“ bringt den pädagogischen und korrektiven Charakter im Deutschen prägnant zum Ausdruck.
- source_word: ζήλευε
  choice: sei eifrig
  rationale: Der Präsensimperativ fordert anhaltenden Eifer. „sei eifrig“ bewahrt die Intensität und ist im heutigen Standarddeutsch verständlich; „sei ernsthaft“ wäre schwächer.
- source_word: οὖν
  choice: Darum
  rationale: οὖν kennzeichnet die Folgerung aus der liebevollen Zurechtweisung und Erziehung. „Darum“ stellt diesen Zusammenhang natürlich her.
- source_word: μετανόησον
  choice: kehre um
  rationale: Der Aoristimperativ ruft zu einer entschiedenen Umkehr auf. „kehre um“ ist im modernen Deutsch klar und erfasst die moralisch-geistliche Neuorientierung, ohne sie auf eine bloße Meinungsänderung zu verengen.
theological_decisions:
- issue: Art der durch φιλῶ bezeichneten Liebe im Zusammenhang mit göttlicher Korrektur
  choice: „lieb habe“ als Ausdruck wirklicher persönlicher Liebe
  alternative: „liebe“ oder „Zuneigung empfinde“
  rationale: Die Korrektur wird in echter Liebe begründet. „lieb habe“ bewahrt die persönliche Färbung von φιλέω, ohne die Liebe auf bloße Sympathie zu reduzieren oder einen theologischen Fachunterschied zu ἀγαπάω vorauszusetzen.
- issue: Bedeutungsumfang von παιδεύω
  choice: „erziehe“ als korrigierende und formende Tätigkeit
  alternative: „züchtige“, „bestrafe“ oder „weise zurecht“
  rationale: Der Ausdruck umfasst disziplinierende Korrektur und Erziehung. „erziehe“ vermeidet sowohl eine rein strafende Deutung als auch eine Abschwächung zu bloßer Belehrung.
- issue: Wiedergabe von μετανοέω
  choice: „kehre um“
  alternative: „tu Buße“ oder „ändere deine Gesinnung“
  rationale: „kehre um“ bezeichnet verständlich die geforderte moralisch-geistliche Neuausrichtung. Es vermeidet sowohl eine mögliche Verengung auf Bußhandlungen als auch die intellektuelle Verengung auf eine bloße Sinnesänderung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze, nachdrückliche Satzstruktur und die beiden Imperative bleiben erhalten. „Überführe“ ist bewusst etwas gehobener, aber verständlich; „erziehe“ macht den korrektiv-formenden Sinn von παιδεύω unmittelbar sichtbar.
