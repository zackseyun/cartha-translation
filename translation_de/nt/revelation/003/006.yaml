  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: de
  text: Wer ein Ohr hat, soll hören, was der Geist den Gemeinden sagt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Derjenige, der ein Ohr hat, soll hören.“ Die maskuline Singularform ist als allgemeine Aufforderung an alle gemeint.'
    reason: Die Fußnote erläutert die generische maskuline Singularform, ohne die deutsche idiomatische Wiedergabe fälschlich als wörtlich zu bezeichnen.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Wer ein Ohr hat
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jeden, auf den die Bedingung zutrifft. „Wer“ ist im modernen Deutschen natürlich und bewahrt zusammen mit „ein Ohr“ die singularische, sprichwörtliche Form.
- source_word: ἀκουσάτω
  choice: soll hören
  rationale: Der Imperativ der dritten Person Singular wird im Deutschen idiomatisch mit „soll hören“ wiedergegeben. Dies erhält den Aufforderungscharakter, ohne ihn zu einem bloßen Rat abzuschwächen oder als ausdrückliche Verpflichtung zu verschärfen.
- source_word: τί
  choice: was
  rationale: „Was“ leitet natürlich und präzise den Inhalt dessen ein, was gesagt wird.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der bestimmte Ausdruck bezeichnet im wiederkehrenden Sendschreiben-Refrain am wahrscheinlichsten den Heiligen Geist; die Großschreibung kennzeichnet diesen Bezug, ohne „Heilige“ in den Text einzufügen.
- source_word: λέγει
  choice: sagt
  rationale: „Sagt“ gibt das Präsens in dieser festen Wendung natürlich wieder und lässt den gegenwärtigen beziehungsweise charakteristischen Aussageaspekt bestehen.
- source_word: ταῖς ἐκκλησίαις
  choice: den Gemeinden
  rationale: „Gemeinden“ ist im modernen deutschen Sprachgebrauch die geläufige Bezeichnung für die örtlichen christlichen Gemeinschaften in Offenbarung 2–3 und gibt den Dativ Plural direkt wieder.
theological_decisions:
- issue: Bezug von „der Geist“
  choice: der Heilige Geist
  alternative: ein Geist beziehungsweise der Geist in einem unbestimmten Sinn
  rationale: Im wiederkehrenden Refrain der Sendschreiben spricht „der Geist“ durch die prophetische Botschaft zu den Gemeinden. Die Übersetzung wahrt den bestimmten Ausdruck des Griechischen und verdeutlicht den wahrscheinlichen Bezug nur durch Großschreibung.
- issue: Generischer Singular der Aufforderung
  choice: Wer ein Ohr hat, soll hören
  alternative: Wer Ohren hat, soll hören; Sie sollen hören
  rationale: Der griechische Text verwendet „Ohr“ und die Aufforderung im Singular. Die deutsche Konstruktion mit „wer“ ist geschlechtsübergreifend, bewahrt aber den individuellen und sprichwörtlichen Charakter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute biblische Mahnformel bleibt erkennbar; archaisches „der höre“ und eine unnötige geschlechtliche Markierung werden vermieden. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Satz.
