id: REV.3.21
reference: Revelation 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: de
  text: Wer siegt[a], dem[b] werde ich gewähren, mit mir auf meinem Thron zu sitzen, so wie auch ich gesiegt und mich mit meinem Vater auf seinen Thron gesetzt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer überwindet“. Das griechische Verb νικάω steht in diesem Vers zweimal; „siegt/gesiegt“ bewahrt die Wiederholung und das Siegesmotiv.'
    reason: lexical_alternative
  - marker: b
    text: 'Die grammatisch maskuline Einzahl („dem“) ist repräsentativ gemeint: Die Verheißung gilt jedem Menschen, der siegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Wer siegt
  rationale: Das substantivierte Präsenspartizip bezeichnet in repräsentativer Einzahl jeden Menschen, der den Sieg erringt. „Siegt“ bewahrt das Siegesmotiv und lässt sich mit ἐνίκησα im selben Vers lexikalisch einheitlich wiedergeben.
- source_word: δώσω αὐτῷ καθίσαι
  choice: dem werde ich gewähren, … zu sitzen
  rationale: δίδωμι mit Infinitiv bezeichnet hier das Gewähren eines Vorrechts. Die Formulierung gibt diesen idiomatischen Sinn wieder, ohne das Bild auszudeuten.
- source_word: μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου
  choice: mit mir auf meinem Thron
  rationale: μετά bezeichnet Gemeinschaft; bei einem Thron ist „auf“ im Deutschen die natürliche räumliche Wiedergabe von ἐν.
- source_word: ὡς κἀγὼ
  choice: so wie auch ich
  rationale: Bewahrt sowohl den ausdrücklichen Vergleich durch ὡς als auch den einschließenden Zusatz καί in κἀγώ.
- source_word: ἐνίκησα
  choice: gesiegt
  rationale: Die gleiche deutsche Wortwurzel wie bei νικῶν erhält die bewusste Wiederholung und das Siegesmotiv der Offenbarung.
- source_word: ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ
  choice: mich mit meinem Vater auf seinen Thron gesetzt habe
  rationale: Die deutsche Perfektkonstruktion gibt die abgeschlossene Inthronisierung natürlich wieder; „mit meinem Vater“ bewahrt die im Griechischen ausgedrückte Gemeinschaft.
theological_decisions:
- issue: Repräsentative maskuline Einzahl in der Verheißung
  choice: „Wer siegt, dem“
  alternative: „Wer siegt, darf“ oder pluralische Wiedergabe
  rationale: Die Konstruktion wahrt die grammatische Einzahl und den Rückbezug des maskulinen Pronomens, während „wer“ im Deutschen natürlich als allgemeine Personenbezeichnung verstanden wird. Eine Fußnote macht die repräsentative Reichweite ausdrücklich.
- issue: Verhältnis des Siegenden zu Christi Thron und Christi zum Thron des Vaters
  choice: Die Parallelität wird ohne abschwächende oder erklärende Zusätze wiedergegeben.
  alternative: Das Sitzen ausdrücklich als bloß symbolisch kennzeichnen oder dogmatische Erläuterungen in den Vers einfügen.
  rationale: Der griechische Text formuliert eine starke Parallele, unterscheidet aber weiterhin zwischen Christus, dem Vater und dem Siegenden. Die Übersetzung bewahrt diese Spannung, ohne sie systematisch-theologisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der feierlichen Verheißungsform des griechischen Textes, ohne unnötig altertümliche Wendungen. Die Bildsprache des gemeinsamen Sitzens auf dem Thron wird unverändert bewahrt.
