  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: de
  text: Die Könige der Erde trieben mit ihr Unzucht[a][b], und die, die auf der Erde wohnen[c], wurden vom Wein ihrer Unzucht[d] betrunken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der“.'
    reason: lexical_alternative
  - marker: b
    text: Die Rede von „Unzucht“ steht hier wahrscheinlich sinnbildlich für verderbliche, götzendienerische oder treulose Bündnisse; zugleich bleibt die Kraft des sexuellen Bildes erhalten.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Bewohner der Erde“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „ihrer Hurerei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: mit der
  rationale: Das Relativpronomen verweist auf die Frau im vorhergehenden Vers. „Mit der“ bildet die griechische Relativkonstruktion transparent und im Deutschen natürlich ab.
- source_word: ἐπόρνευσαν
  choice: Unzucht trieben
  rationale: Die Wendung bewahrt das sexuelle Bild und lässt zugleich dessen symbolische Bedeutung für götzendienerische, politische oder religiöse Untreue offen.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: die Könige der Erde
  rationale: „Der Erde“ entspricht dem umfassenden Sinn von γῆ und bewahrt die wiederkehrende apokalyptische Ausdrucksweise der Offenbarung.
- source_word: ἐμεθύσθησαν
  choice: wurden … betrunken
  rationale: Die Wiedergabe erfasst den resultativen Sinn des Aoristpassivs und klingt im Deutschen idiomatisch.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: die auf der Erde wohnen
  rationale: Die verbale Formulierung bewahrt die in der Offenbarung wiederkehrende Wendung und folgt der Struktur des griechischen Ausdrucks.
- source_word: ἐκ τοῦ οἴνου
  choice: vom Wein
  rationale: ἐκ bezeichnet hier Quelle beziehungsweise Ursache. „Vom Wein“ gibt diesen Zusammenhang im Deutschen natürlich wieder und erhält das Bild.
- source_word: τῆς πορνείας αὐτῆς
  choice: ihrer Unzucht
  rationale: „Unzucht“ entspricht dem verwandten Verb im ersten Satzteil, bewahrt die sexuelle Metaphorik und legt die symbolische Deutung nicht vorschnell fest.
theological_decisions:
- issue: Ob πορνεύω/πορνεία im Haupttext ausdrücklich als Götzendienst oder politisch-religiöse Untreue gedeutet werden soll
  choice: Das Bild der Unzucht bleibt im Haupttext erhalten.
  alternative: „mit ihr Götzendienst trieben“ oder „sich in treulosen Bündnissen mit ihr verbanden“
  rationale: Die Offenbarung gebraucht bewusst sexuelle Bildsprache für umfassende Untreue und Verderbnis. Eine ausdeutende Übersetzung würde die theologische und symbolische Spannung auf eine einzige Erklärung verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederkehrende Bildsprache der Offenbarung wird knapp und verständlich bewahrt; „Unzucht treiben“ ist bewusst bildkräftig, ohne die Metapher erklärend aufzulösen.
