  source_fidelity: 'Die Übersetzung gibt die Abfolge und die bewusst knappe Ausdrucksweise des griechischen Textes zuverlässig wieder: fünf sind gefallen, einer ist gegenwärtig, der andere ist noch nicht gekommen und muss bei seinem Kommen nur begrenzte Zeit bleiben. „Ist da“ macht das elliptische ὁ εἷς ἔστιν im modernen Deutsch verständlich, ohne „herrscht“ oder eine bestimmte historische Deutung einzutragen. „Muss“ gibt δεῖ angemessen wieder, ohne den Grund der Notwendigkeit zu bestimmen.'
