id: REV.17.10
reference: Revelation 17:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: de
  text: Fünf sind gefallen[a], einer ist da, der andere ist noch nicht gekommen; und wenn er kommt, muss er eine kurze Zeit bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang ausführlicher: „Fünf Könige sind gefallen, einer ist da, der andere ist noch nicht gekommen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: Fünf
  rationale: Der Artikel verweist auf die sieben Könige im vorhergehenden Satz. Im Deutschen genügt die artikellose Zahl, weil der Bezug aus dem Zusammenhang hervorgeht.
- source_word: ἔπεσαν
  choice: sind gefallen
  rationale: Das Perfekt gibt den abgeschlossenen Fall mit seiner für die Gegenwart fortbestehenden Bedeutung natürlich wieder und bewahrt zugleich das Bild des griechischen Verbs.
- source_word: ὁ εἷς ἔστιν
  choice: einer ist da
  rationale: Die Wendung bewahrt die knappe Ellipse und klingt im modernen Deutschen verständlicher als das isolierte „einer ist“, ohne sie deutend zu „einer herrscht“ zu erweitern.
- source_word: ὁ ἄλλος
  choice: der andere
  rationale: Die Formulierung bezeichnet den noch ausstehenden König innerhalb der genannten Abfolge, ohne ihn näher zu bestimmen.
- source_word: οὔπω ἦλθεν
  choice: ist noch nicht gekommen
  rationale: Das deutsche Perfekt mit „noch nicht“ bezeichnet idiomatisch das bis zur Gegenwart ausgebliebene Kommen.
- source_word: ὅταν ἔλθῃ
  choice: wenn er kommt
  rationale: „Wenn“ mit Präsens gibt den zukünftigen, erwarteten Eintritt natürlich wieder; „er“ folgt dem im Kontext männlichen Bezug auf einen König.
- source_word: ὀλίγον
  choice: eine kurze Zeit
  rationale: Das adverbial gebrauchte Wort bezeichnet eine begrenzte Dauer. „Eine kurze Zeit“ ist klar, würdig und weniger missverständlich als „ein wenig“.
- source_word: αὐτὸν δεῖ μεῖναι
  choice: muss er ... bleiben
  rationale: Die deutsche Konstruktion gibt die unpersönliche Notwendigkeit des Griechischen knapp und natürlich wieder, ohne deren Ursprung näher auszudeuten.
theological_decisions:
- issue: Deutung der sieben Könige
  choice: Die knappe Redeweise bleibt im Haupttext erhalten; konkrete historische Identifizierungen werden nicht eingeführt.
  alternative: „Fünf Könige sind gefallen, ein König ist da, und der andere König ist noch nicht gekommen“ oder die ausdrückliche Identifikation mit bestimmten römischen Herrschern.
  rationale: Der unmittelbare Zusammenhang macht deutlich, dass Könige gemeint sind, doch der Vers selbst formuliert elliptisch. Die Übersetzung wahrt diese apokalyptische Offenheit und entscheidet keine umstrittene historische Zuordnung.
- issue: Art der in δεῖ ausgedrückten Notwendigkeit
  choice: „muss“
  alternative: Die Notwendigkeit ausdrücklich als göttliche Bestimmung oder als bloße historische Notwendigkeit erklären.
  rationale: δεῖ bezeichnet eine Notwendigkeit, benennt hier jedoch nicht ausdrücklich deren Ursprung. „Muss“ erhält diese theologische Spannung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der knappen, feierlichen Wirkung apokalyptischer Rede. Die Ellipse wird weitgehend bewahrt; „ist da“ sorgt dabei für natürliche Verständlichkeit, ohne „herrscht“ in den Text einzutragen.
