source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: de
  text: Und die Frau war in Purpur und Scharlach gekleidet und mit Gold, Edelsteinen und Perlen geschmückt. In ihrer Hand hielt sie einen goldenen Becher, voll von Gräueln und den unreinen Dingen ihrer sexuellen Unmoral.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hurerei“ beziehungsweise „Prostitution“. Das griechische Wort kann in der Offenbarung sowohl wörtlich als auch bildlich gebraucht sein.'
    reason: Lexikalische Alternativen und die mögliche doppelte, wörtlich-metaphorische Bedeutung von πορνεία werden offengehalten.
lexical_decisions:
- source_word: περιβεβλημένη
  choice: war … gekleidet
  rationale: Das Perfektpartizip bildet mit ἦν eine periphrastische Konstruktion und beschreibt den bestehenden Zustand der Frau; die deutsche Formulierung bewahrt den passiv-resultativen Sinn.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: in Purpur und Scharlach
  rationale: Die substantivisch gebrauchten Farbadjektive bezeichnen luxuriöse Kleidung beziehungsweise deren Farben; die traditionellen, präzisen Farbbezeichnungen passen zur apokalyptischen Bildsprache.
- source_word: κεχρυσωμένη
  choice: mit … geschmückt
  rationale: Das Partizip bezeichnet kostbare Verzierung; „geschmückt“ ist natürliches modernes Deutsch und legt die genaue Art der Goldverarbeitung nicht fest.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: mit Gold, Edelsteinen und Perlen
  rationale: Die instrumentalen Dative benennen den Schmuck. Der formal singuläre Ausdruck λίθῳ τιμίῳ wird in der Aufzählung generisch und idiomatisch als „Edelsteinen“ wiedergegeben.
- source_word: ποτήριον χρυσοῦν
  choice: einen goldenen Becher
  rationale: Direkte und idiomatische Wiedergabe von Substantiv und Adjektiv.
- source_word: γέμον
  choice: voll von
  rationale: Das Präsenspartizip beschreibt den Inhalt des Bechers; „voll von“ ist knapp und natürlich.
- source_word: βδελυγμάτων
  choice: abscheulichen Dingen
  rationale: Die Formulierung bewahrt die starke kultisch-moralische Wertung, ohne im modernen Deutsch unnötig fachsprachlich zu wirken.
- source_word: τὰ ἀκάθαρτα
  choice: vom Unreinen
  rationale: Das substantivierte Neutrum Plural bezeichnet unreine Dinge beziehungsweise Unreinheiten. „das Unreine“ erhält die kultisch-moralische Mehrdeutigkeit und lässt sich im Deutschen natürlich mit dem folgenden Genitiv verbinden.
- source_word: πορνείας
  choice: sexuellen Unmoral
  rationale: Der Ausdruck ist breit genug, um sexuelle Verfehlung zu bezeichnen, ohne die in der Offenbarung mögliche bildliche Bedeutung vorschnell auf Prostitution oder ausschließlich geistliche Untreue einzuengen.
theological_decisions:
- issue: πορνεία kann in der apokalyptischen Bildsprache sowohl wörtliche sexuelle Unmoral als auch bildliche Untreue und Götzendienst anklingen lassen.
  choice: sexuelle Unmoral
  alternative: Hurerei; Prostitution
  rationale: „Sexuelle Unmoral“ wahrt die lexikalische Breite und die Spannung zwischen wörtlicher und metaphorischer Bedeutung. „Prostitution“ wäre enger; „Hurerei“ ist traditionell, heute aber missverständlich oder abwertend gefärbt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde nach der Schmuckbeschreibung geteilt, ohne seine Bildfolge zu verändern. Die Formulierung vermeidet konfessionelle Festlegungen und bewahrt die kultische sowie moralische Färbung der Schlüsselbegriffe.
