  source_fidelity: Die Bildfolge und die wesentlichen Begriffe sind zutreffend wiedergegeben. Allerdings ist τὰ ἀκάθαρτα ein substantivierter neutraler Plural und bezeichnet hier „die unreinen Dinge“; „vom Unreinen“ verallgemeinert und singularisiert den Ausdruck unnötig.
  naturalness: Der Satzbau ist modernes, gut lesbares Standarddeutsch. „Voll von Gräueln und den unreinen Dingen ihrer sexuellen Unmoral“ ist idiomatischer und syntaktisch klarer als „voll von abscheulichen Dingen und vom Unreinen ihrer sexuellen Unmoral“.
  terminology: „Purpur“, „Scharlach“, „Gold“, „Edelsteine“, „Perlen“ und „goldener Becher“ sind angemessen. „Gräuel“ gibt βδελύγματα mit dessen starken kultisch-moralischen Klang im biblisch-apokalyptischen Register präziser wieder. „Sexuelle Unmoral“ bleibt als breite Wiedergabe von πορνεία vertretbar; die Fußnote wahrt die mögliche wörtliche und metaphorische Dimension.
  issues:
