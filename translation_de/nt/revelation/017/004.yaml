    issue: „vom Unreinen“ für τὰ ἀκάθαρτα
    rationale: Das griechische τὰ ἀκάθαρτα steht im Plural und meint konkret „die unreinen Dinge“. Die substantivierte Singularform „das Unreine“ schwächt diese konkrete Pluralität und ist mit „voll von … und vom …“ weniger klar konstruiert.
  - severity: low
    issue: „abscheuliche Dinge“ für βδελυγμάτων
    rationale: Die Übersetzung ist semantisch möglich, doch „Gräuel“ bewahrt im Kontext der Offenbarung die markante kultisch-moralische und apokalyptische Terminologie genauer, ohne unverständlich zu sein.
