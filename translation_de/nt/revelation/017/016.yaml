id: REV.17.16
reference: Revelation 17:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: de
  text: Und die zehn Hörner, die du gesehen hast, und das Tier – sie werden die Prostituierte hassen. Sie werden sie verwüstet und nackt[a] zurücklassen, ihr Fleisch[b] essen und sie mit Feuer völlig verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „nackt“; das Bild schließt öffentliche Bloßstellung und Erniedrigung ein.
    reason: lexical_alternative
  - marker: b
    text: „Fleisch“ steht wörtlich im griechischen Text. Innerhalb der apokalyptischen Bildsprache der Offenbarung stellt der Ausdruck eine vollständige gewaltsame Vernichtung dar.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: Hörner
  rationale: Die apokalyptische Bildsprache wird wörtlich bewahrt; ihre Deutung ergibt sich aus dem Zusammenhang.
- source_word: θηρίον
  choice: Tier
  rationale: „Tier“ ist die etablierte, sachlich passende Wiedergabe der apokalyptischen Gestalt und vermeidet die interpretierende Verstärkung „Monster“.
- source_word: πόρνην
  choice: Prostituierte
  rationale: Das Wort gibt die Bedeutung in heutigem Standarddeutsch klar wieder; „Hure“ wirkt heute stärker beschimpfend, während „Dirne“ veraltet ist.
- source_word: μισήσουσι
  choice: werden … hassen
  rationale: Direkte Wiedergabe des Futurs von μισέω; die starke Bedeutung passt zu den folgenden Gewalttaten.
- source_word: ἠρημωμένην ποιήσουσιν αὐτήν
  choice: werden sie verwüstet … zurücklassen
  rationale: Die resultative Konstruktion bezeichnet das Herbeiführen eines verwüsteten, verlassenen Zustands. „Zurücklassen“ ergibt im Deutschen eine natürliche Formulierung, ohne die Bildaussage aufzulösen.
- source_word: γυμνήν
  choice: nackt
  rationale: Direkte Wiedergabe des Adjektivs; die damit verbundene Bloßstellung wird nicht durch eine interpretierende Umschreibung ersetzt.
- source_word: σάρκας
  choice: Fleisch
  rationale: Die konkrete und drastische Bildsprache bleibt erhalten; „Körper“ wäre abschwächend und stärker interpretierend.
- source_word: φάγονται
  choice: essen
  rationale: Direkte Wiedergabe von ἐσθίω; „verschlingen“ würde die Verbwahl stilistisch verstärken.
- source_word: κατακαύσουσιν ἐν πυρί
  choice: mit Feuer völlig verbrennen
  rationale: „Völlig verbrennen“ bringt die intensive Bedeutung von κατακαίω zum Ausdruck; „mit Feuer“ entspricht ἐν πυρί in natürlichem Deutsch.
- source_word: οὗτοι
  choice: sie
  rationale: Das Pronomen nimmt die zehn Hörner und das Tier gemeinsam wieder auf. Der Gedankenstrich bewahrt die hervorhebende Wiederaufnahme in flüssigem Deutsch.
theological_decisions:
- issue: Bezug und Numerus bei „den zehn Hörnern … und dem Tier“ mit den pluralischen Verben
  choice: Die Bildgestalten werden als gemeinsames Subjekt genannt und nach einem Gedankenstrich mit dem pluralischen Pronomen „sie“ wieder aufgenommen.
  alternative: Die Wiederaufnahme auslassen oder das Tier als Apposition zu den Hörnern deuten.
  rationale: Der griechische Satz nimmt die zehn Hörner und das Tier durch οὗτοι gemeinsam auf und setzt mit Verben im Plural fort. Die Übersetzung bewahrt diese gemeinsame Täterschaft, ohne das ungewöhnliche griechische Numerusgefüge im Deutschen künstlich nachzubilden.
- issue: Art der Darstellung bei der Vernichtung der Prostituierten
  choice: Die apokalyptische Metaphorik wird im Haupttext ungemildert beibehalten.
  alternative: Die Prostituierte unmittelbar als Stadt, Reich oder System auslegen und entsprechend paraphrasieren.
  rationale: Der Vers selbst spricht in symbolischen Bildern. Ihre Deutung soll nicht in die Übersetzung hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge oder gemeinsame Täterschaft zu verändern. Die drastische apokalyptische Bildsprache bleibt erhalten; altertümliche oder unnötig beschimpfende Wortwahl wird vermieden.
