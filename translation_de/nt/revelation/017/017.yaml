id: REV.17.17
reference: Revelation 17:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: de
  text: Denn Gott hat es ihnen ins Herz gegeben, seinen Beschluss auszuführen, einen gemeinsamen Beschluss zu fassen[a] und ihre Königsherrschaft dem Tier zu übergeben, bis die Worte Gottes erfüllt sein werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „einen einzigen Beschluss zu fassen“; auch: „eines Sinnes zu sein“ oder „dieselbe Absicht zu verfolgen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „bis die Worte Gottes vollendet sind“ oder „eingetroffen sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: hat es ihnen ins Herz gegeben
  rationale: Die im Deutschen geläufige Wendung bewahrt das Herzbild und bezeichnet Gottes inneres Einwirken, ohne es auf eine rein körperliche Vorstellung zu reduzieren.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: seinen Beschluss auszuführen
  rationale: γνώμη bezeichnet hier Gottes Absicht oder beschlossenen Plan. „Beschluss“ wahrt den willentlichen Charakter, während „auszuführen“ die Bedeutung von ποιῆσαι im Zusammenhang natürlich wiedergibt.
- source_word: ποιῆσαι μίαν γνώμην
  choice: zu einem gemeinsamen Entschluss zu kommen
  rationale: Die wörtlich gedrängte Formulierung „einen Beschluss machen“ bezeichnet die einheitliche Willensrichtung der Könige. Die gewählte Wendung ist idiomatisches Deutsch und bewahrt den Bezug zum vorangehenden γνώμη.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: ihre Königsherrschaft … zu übergeben
  rationale: βασιλεία kann Reich, Königtum oder königliche Herrschaft bezeichnen. Im Kontext übertragen mehrere Könige ihre Herrschaft auf das Tier; „Königsherrschaft“ macht diesen Sinn deutlich und bewahrt den Singular.
- source_word: τῷ θηρίῳ
  choice: dem Tier
  rationale: „Tier“ bewahrt die durchgehende apokalyptische Bildsprache der Offenbarung.
- source_word: ἄχρι τελεσθήσονται
  choice: bis … erfüllt sein werden
  rationale: Die Formulierung gibt das zukünftige Erreichen der von Gott angekündigten Vollendung wieder und wahrt die Passivform.
- source_word: οἱ λόγοι τοῦ θεοῦ
  choice: die Worte Gottes
  rationale: „Worte Gottes“ ist weit genug für Aussprüche oder Ankündigungen und entspricht dem würdigen prophetischen Sprachregister.
theological_decisions:
- issue: Göttliche Souveränität und menschliches Handeln der Könige
  choice: Gottes ursächliches Einwirken und das wirkliche Handeln der Könige werden beide ausdrücklich wiedergegeben.
  alternative: Gottes Rolle mit „zulassen“ abschwächen oder den Text stärker deterministisch ausdeuten.
  rationale: Der griechische Text sagt, Gott habe es ihnen ins Herz gegeben, und beschreibt zugleich ihre eigenen Beschlüsse und die Übergabe ihrer Herrschaft. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt den parallelen griechischen Infinitiven, ohne im Deutschen unnötig schwerfällig zu wirken; zentrale apokalyptische Begriffe und die Spannung zwischen Gottes Handeln und menschlicher Verantwortung bleiben erhalten.
