  rationale: Eine kleine, sichere Präzisierung ersetzt die prozesshafte Formulierung „zu einem gemeinsamen Entschluss zu kommen“ durch „einen gemeinsamen Beschluss zu fassen“. Dadurch wird die zweite γνώμη enger am griechischen Ausdruck wiedergegeben, ohne die Aussage über Gottes Handeln oder die Handlung der Könige auszudeuten. Die Fußnotenanker bleiben korrekt an den jeweiligen Stellen.
