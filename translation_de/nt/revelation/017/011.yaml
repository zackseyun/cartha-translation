source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: de
  text: Und das Tier, das war und nicht ist, ist selbst ein achtes[a] und ist aus den sieben[b], und es geht ins Verderben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist selbst ein achter König“. Das Substantiv „König“ wird durch den Zusammenhang nahegelegt, steht aber nicht im griechischen Text.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ist eines von den sieben“. Wörtlich heißt es „aus den sieben“; dies kann Herkunft, Zugehörigkeit oder eine enge Beziehung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: Tier
  rationale: „Tier“ ist in der deutschen Offenbarungstradition der etablierte apokalyptische Ausdruck und bewahrt die symbolische sowie intertextuelle Bedeutung.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: das war und nicht ist
  rationale: Die knappe Parallelstruktur des Griechischen bleibt erhalten; die ungewöhnliche Formulierung nimmt bewusst die wiederkehrende Wendung dieses Kapitels auf.
- source_word: αὐτὸς
  choice: selbst
  rationale: Das betonte αὐτός wird wiedergegeben, ohne einen männlichen Personenbezug einzutragen; „selbst“ bezieht sich natürlich auf das sächliche „Tier“.
- source_word: ὄγδοός
  choice: ein achtes
  rationale: Im Griechischen steht kein ausdrückliches Substantiv. Die substantivierte Form lässt wie der Ausgangstext offen, welche Bezeichnung aus dem Zusammenhang zu ergänzen ist.
- source_word: ἐκ τῶν ἑπτά
  choice: aus den sieben
  rationale: Die Wiedergabe bildet ἐκ formal ab und bewahrt die mögliche Bedeutung von Herkunft, Zugehörigkeit oder enger Beziehung, statt eindeutig „eines von den sieben“ festzulegen.
- source_word: εἰς ἀπώλειαν
  choice: ins Verderben
  rationale: „Verderben“ bezeichnet hier klar und würdig das endgültige Unheil beziehungsweise die eschatologische Vernichtung und fügt sich natürlich in die feste deutsche Wendung ein.
- source_word: ὑπάγει
  choice: geht
  rationale: Das Präsens und die gerichtete Bewegung werden schlicht und anschaulich wiedergegeben.
theological_decisions:
- issue: Ob das unausgesprochene Substantiv als „König“ ergänzt werden soll
  choice: Im Haupttext steht nur „ein achtes“; „König“ wird nicht ergänzt.
  alternative: „ein achter König“
  rationale: Der unmittelbare Kontext handelt von Königen, doch βασιλεύς steht in diesem Satz nicht. Die knappe und symbolisch offene Ausdrucksweise des griechischen Textes bleibt daher im Haupttext erhalten.
- issue: Ob ἐκ τῶν ἑπτά als „eines von den sieben“ präzisiert werden soll
  choice: „aus den sieben“
  alternative: „eines von den sieben“
  rationale: Die Präposition kann Herkunft, Zugehörigkeit oder eine enge Beziehung ausdrücken. Die gewählte Fassung wahrt diese echte Auslegungsunsicherheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst knappe und leicht ungewöhnliche Syntax bewahrt die Parallelität und Mehrdeutigkeit des griechischen Textes. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
