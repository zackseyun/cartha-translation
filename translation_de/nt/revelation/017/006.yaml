review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die beiden Blutgruppen, die Bildsprache der Trunkenheit und die begründete Bedeutungsbreite von μαρτύρων angemessen wieder. Die Konstruktion „ich sah, dass … betrunken war“ ist jedoch gegenüber εἶδον τὴν γυναῖκα μεθύουσαν etwas indirekter als nötig. „war ich tief erstaunt“ schwächt zudem die verbale Aussage ἐθαύμασα und die Intensivierung θαῦμα μέγα leicht ab.
  naturalness: Das Deutsch ist insgesamt verständlich und würdig. „Ich sah die Frau, betrunken vom Blut …“ ist hier eine natürliche, knappe und bildstarke Wiedergabe. „Staunte ich sehr“ gibt das abschließende griechische Verb im modernen Standarddeutsch unmittelbar wieder.
  terminology: „Heilige“ ist für ἅγιοι angemessen. „Zeugen Jesu“ bewahrt die lexikalische Grundbedeutung von μάρτυρες; die Fußnote nennt zu Recht „Märtyrer Jesu“ als im Kontext des vergossenen Blutes besonders naheliegende Alternative. Der unaufgelöste Genitiv „Jesu“ bewahrt die griechische Beziehungsweite.
  issues:
  - severity: low
    issue: Indirekte Wiedergabe des Partizips μεθύουσαν
    rationale: „Ich sah, dass die Frau … betrunken war“ ist möglich, rückt die Aussage aber in einen dass-Satz. Eine partizipnahe Apposition stellt die Frau wie im Griechischen unmittelbar als „betrunken“ vor Augen.
  - severity: low
    issue: Abschwächung von ἐθαύμασα … θαῦμα μέγα
    rationale: „War ich tief erstaunt“ beschreibt eher einen Zustand. „Staunte ich sehr“ gibt die Handlung des Staunens und die starke Intensivierung unmittelbarer wieder.
  revised_text: Und ich sah die Frau, betrunken vom Blut der Heiligen und vom Blut der Zeugen Jesu[a]. Und als ich sie sah, staunte ich sehr.
