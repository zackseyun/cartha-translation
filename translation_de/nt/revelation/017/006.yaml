id: REV.17.6
reference: Revelation 17:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: de
  text: Und ich sah die Frau, betrunken vom Blut der Heiligen und vom Blut der Zeugen Jesu[a]. Und als ich sie sah, staunte ich sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Märtyrer Jesu“. Das griechische Wort kann „Zeugen“ oder „Märtyrer“ bedeuten; weil hier von ihrem Blut die Rede ist, liegt die Bedeutung „Märtyrer“ besonders nahe.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: vom Blut … betrunken
  rationale: Die deutsche Verbindung „von etwas betrunken sein“ gibt den durch ἐκ bezeichneten Grund der Trunkenheit natürlich wieder und bewahrt das verstörende Bild.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: In der Offenbarung bezeichnet der Ausdruck Gottes geheiligtes Volk. „Die Heiligen“ ist knapp, traditionsverbunden und im Deutschen verständlich.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: der Zeugen Jesu
  rationale: μάρτυς bedeutet grundsätzlich „Zeuge“, kann im Verfolgungskontext aber auch „Märtyrer“ bezeichnen. Die Erwähnung ihres Blutes lässt das Martyrium deutlich anklingen; die kompakte Genitivverbindung bewahrt zudem die mögliche Zugehörigkeits- oder Zeugnisbeziehung zu Jesus.
- source_word: ἐθαύμασα … θαῦμα μέγα
  choice: war ich tief erstaunt
  rationale: Der verwandte Akkusativ θαῦμα μέγα verstärkt das Verb. Die adverbiale Wiedergabe ist natürliches Deutsch und vermeidet eine schwerfällige etymologische Figur.
- source_word: ἰδὼν αὐτὴν
  choice: Als ich sie sah
  rationale: Der Aoristpartizipialsatz wird als natürlicher temporaler Nebensatz wiedergegeben, ohne seinen Bezug zum Erstaunen zu verändern.
theological_decisions:
- issue: Bedeutung von μάρτυρες im Kontext apokalyptischer Verfolgung
  choice: Im Haupttext „Zeugen“, mit „Märtyrer“ als Fußnotenalternative.
  alternative: Märtyrer Jesu
  rationale: „Zeugen“ bewahrt die lexikalische Grundbedeutung und das für die Offenbarung wichtige Motiv des Zeugnisses. Weil ausdrücklich von ihrem Blut die Rede ist, ist zugleich die Bedeutung „Märtyrer“ kontextuell naheliegend und wird in der Fußnote sichtbar gehalten.
- issue: Objektgenitiv oder Zugehörigkeitsgenitiv bei Ἰησοῦ
  choice: Die knappe Form „Jesu“ bleibt unaufgelöst.
  alternative: Zeugen für Jesus / Zeugen, die von Jesus Zeugnis ablegten
  rationale: Der griechische Genitiv kann eine Beziehung der Zugehörigkeit zu Jesus oder des Zeugnisses für beziehungsweise über Jesus ausdrücken. Eine explizitere deutsche Form würde diese Spannung einseitig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem Griechischen leicht geglättet, während die drastische Blut- und Trunkenheitsmetaphorik sowie die Mehrdeutigkeit von μάρτυρες erhalten bleiben.
