revisions:
- from: Und ich sah, dass die Frau vom Blut der Heiligen und vom Blut der Zeugen Jesu[a] betrunken war. Als ich sie sah, war ich tief erstaunt.
  to: Und ich sah die Frau, betrunken vom Blut der Heiligen und vom Blut der Zeugen Jesu[a]. Und als ich sie sah, staunte ich sehr.
  rationale: Die Revision wahrt die bewusste Übersetzung von μάρτυρες als „Zeugen“ samt Fußnotenalternative, bildet aber die syntaktische Bildlichkeit von εἶδον τὴν γυναῖκα μεθύουσαν unmittelbarer ab. Die Schlussformulierung gibt das Verb ἐθαύμασα und seine starke Verstärkung idiomatisch und genauer wieder.
