id: REV.17.15
reference: Revelation 17:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: de
  text: 'Und er sagt zu mir: „Die Wasser, die du gesehen hast, wo die Prostituierte sitzt, sind Völker und Menschenmengen, Nationen und Sprachen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πόρνη
  choice: die Prostituierte
  rationale: Gibt die konkrete weibliche Bezeichnung direkt, verständlich und ohne unnötig altertümliche Sprache wieder.
- source_word: λαοὶ
  choice: Völker
  rationale: Entspricht dem üblichen kollektiven Sinn von λαοί und wahrt die Reihung verschiedener Menschengruppen.
- source_word: ὄχλοι
  choice: Menschenmengen
  rationale: Unterscheidet ὄχλοι klar von λαοί und bezeichnet größere Ansammlungen von Menschen, ohne die abwertende Färbung von „Massen“.
- source_word: ἔθνη
  choice: Nationen
  rationale: Bewahrt neben „Völker“ einen eigenen Ausdruck für politische oder ethnische Großgruppen.
- source_word: γλῶσσαι
  choice: Sprachen
  rationale: Die metonymische Bedeutung bezeichnet hier Sprachgemeinschaften beziehungsweise Sprachen; die direkte Wiedergabe wahrt das apokalyptische Aufzählungsmuster.
theological_decisions:
- issue: Deutung der Wasser
  choice: Die Gleichsetzung „Die Wasser … sind …“ wird unmittelbar beibehalten.
  alternative: Eine erklärende Wiedergabe wie „Die Wasser stehen für …“
  rationale: Der griechische Text verwendet εἰσίν („sind“); die bildhafte Identifikation soll nicht durch eine interpretierende Paraphrase abgeschwächt werden.
- issue: Zeitform von λέγει
  choice: 'Präsens: „er sagt“'
  alternative: 'Erzählvergangenheit: „er sagte“'
  rationale: Das historische beziehungsweise visionäre Präsens des griechischen Textes wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die viergliedrige Aufzählung bleibt erhalten; „Menschenmengen“ ist idiomatisch und grenzt ὄχλοι von „Völker“ und „Nationen“ ab.
