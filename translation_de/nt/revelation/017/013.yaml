source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: de
  text: Diese sind eines Sinnes[a] und geben ihre Macht und Vollmacht dem Tier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diese verfolgen ein gemeinsames Ziel.“ Die griechische Wendung bedeutet wörtlich etwa: „Sie haben eine gemeinsame Auffassung“; sie kann eine gemeinsame Haltung, Entschlossenheit oder Zielsetzung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Diese
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten zehn Könige; „Diese“ bewahrt den rückverweisenden Charakter knapp und natürlich.
- source_word: μίαν γνώμην ἔχουσιν
  choice: sind eines Sinnes
  rationale: Die deutsche Wendung bildet das griechische Idiom eng ab und lässt offen, ob vor allem gemeinsame Auffassung, Entschlossenheit oder Zielsetzung gemeint ist.
- source_word: δύναμιν
  choice: Macht
  rationale: Im politisch-apokalyptischen Zusammenhang bezeichnet das Wort wirksame Kraft beziehungsweise Macht.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: „Vollmacht“ unterscheidet die verliehene oder beanspruchte Herrschaftsbefugnis von der wirksamen „Macht“ und gibt ἐξουσία prägnant wieder.
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: ihre Macht und Vollmacht
  rationale: Beide verwandten, aber nicht identischen Begriffe bleiben erhalten; das Possessivpronomen wird im Deutschen natürlich nur einmal gesetzt.
- source_word: τῷ θηρίῳ
  choice: dem Tier
  rationale: „Das Tier“ ist die sachgerechte und in der Offenbarung etablierte Bezeichnung der apokalyptischen Gestalt.
- source_word: διδόασιν
  choice: geben
  rationale: Das Präsens und die direkte Bedeutung des Verbs werden ohne interpretierende Erweiterung wiedergegeben.
theological_decisions:
- issue: Deutung von μίαν γνώμην ἔχουσιν im politisch-apokalyptischen Zusammenhang
  choice: Diese sind eines Sinnes
  alternative: Diese verfolgen ein gemeinsames Ziel
  rationale: „Eines Sinnes“ bewahrt die Bildlichkeit und Bedeutungsbreite des griechischen Idioms, ohne es ausschließlich als Ziel, Meinung oder Entschluss festzulegen.
- issue: Unterscheidung zwischen δύναμις und ἐξουσία
  choice: Macht und Vollmacht
  alternative: Kraft und Herrschaftsgewalt
  rationale: Die Wiedergabe hält tatsächliche Macht und Herrschaftsbefugnis begrifflich auseinander und bewahrt so die politische und theologische Spannung des Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist bewusst knapp und folgt der Satzstruktur des griechischen Textes, ohne unnatürlich zu wirken.
