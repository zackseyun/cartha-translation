id: REV.17.9
reference: Revelation 17:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: de
  text: 'Hier ist der Verstand, der Weisheit hat: Die sieben Köpfe sind sieben Berge[a], auf denen die Frau sitzt; und sie sind sieben Könige.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben Hügel“. Das griechische Wort kann Berge oder Hügel bezeichnen; „Berge“ ist die direktere Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: Hier ist … gefragt
  rationale: Leitet eine deutende Aussage ein. Die idiomatische deutsche Wendung bewahrt den hinweisenden Charakter und macht deutlich, dass nun verständige Deutung erforderlich ist.
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: der Verstand, der Weisheit besitzt
  rationale: Gibt νοῦς mit „Verstand“ und die Partizipialfügung ὁ ἔχων σοφίαν eng mit „der Weisheit besitzt“ wieder, ohne sie auf bloße Erkenntnis oder Einsicht zu verengen.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: die sieben Köpfe
  rationale: Bewahrt das symbolische Bild, ohne es bereits auszulegen.
- source_word: ἑπτὰ ὄρη
  choice: sieben Berge
  rationale: „Berge“ ist die direkte und übliche Wiedergabe von ὄρη; die ebenfalls mögliche Wiedergabe „Hügel“ wird in der Fußnote genannt.
- source_word: ὅπου … κάθηται ἐπ’ αὐτῶν
  choice: auf denen die Frau sitzt
  rationale: Gibt den lokalen Sinn der gesamten griechischen Fügung natürlich wieder und vermeidet im Deutschen die schwerfällige Verdopplung „wo … auf ihnen“.
- source_word: ἡ γυνὴ
  choice: die Frau
  rationale: Behält die symbolische Gestalt ohne interpretierende Erweiterung bei.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: und sie sind sieben Könige
  rationale: Bezieht das unausgesprochene Subjekt sinnvoll auf die sieben Köpfe zurück und bewahrt so deren zweite symbolische Gleichsetzung.
theological_decisions:
- issue: Symbolische Zuordnung der sieben Köpfe
  choice: Die Gleichsetzungen mit sieben Bergen und sieben Königen bleiben ohne nähere historische Identifizierung stehen.
  alternative: Die Berge ausdrücklich als die sieben Hügel Roms oder die Könige als bestimmte Herrscher beziehungsweise Reiche auslegen.
  rationale: Der Vers nennt symbolische Entsprechungen, legt deren konkreten historischen Bezug jedoch nicht eindeutig fest. Diese Offenheit darf die Übersetzung nicht beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Wendung ist idiomatisch formuliert, während die apokalyptischen Bilder und ihre Mehrdeutigkeit möglichst eng bewahrt werden.
