revisions:
- from: 'Dann kam einer von den sieben Engeln, die die sieben Schalen hatten, und sprach mit mir: »Komm! Ich werde dir das Gericht über die große Prostituierte[a] zeigen, die an vielen Wassern sitzt.«'
  to: 'Dann kam einer der sieben Engel, die die sieben Schalen hatten, und sprach mit mir: »Komm! Ich werde dir das Gericht über die große Prostituierte[a] zeigen, die auf vielen Wassern sitzt.«'
  rationale: Die Revision stellt die räumlich-bildhafte Kraft von ἐπί mit „auf vielen Wassern“ wieder her und präzisiert die Fußnotenformulierung. Im Übrigen bleibt die sorgfältige, moderne und semantisch offene Wiedergabe erhalten.
  reviewer_model: gpt-5.6-terra
