review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Satzbau, Partitivkonstruktion, Besitz der sieben Schalen, Futur und den weiten Sinn von κρίμα zuverlässig wieder. Die Präposition ἐπί bezeichnet hier jedoch das Sitzen „auf“ vielen Wassern; gerade dieses bildhaft auffällige Verhältnis sollte nicht durch „an“ abgeschwächt werden.
  naturalness: Modernes, würdiges Deutsch. „Einer der sieben Engel“ ist etwas glatter als „einer von den sieben Engeln“. „Auf vielen Wassern sitzt“ ist als apokalyptisches Bild bewusst ungewöhnlich, aber verständlich und quellennäher.
  terminology: „Schalen“, „Gericht“ und „große Prostituierte“ sind treffend. Die Fußnotenalternative „große Hure“ sollte als mögliche bzw. traditionelle Wiedergabe, nicht als wörtliche Formulierung, gekennzeichnet werden.
  issues:
  - severity: medium
    issue: „an vielen Wassern sitzt“ schwächt ἐπὶ ὑδάτων πολλῶν ab.
    rationale: ἐπί mit der Sitzmetapher ist hier am besten mit „auf“ wiederzugeben. Die absichtlich bildhafte Formulierung wird im weiteren Kapitel symbolisch ausgelegt und sollte nicht zu einer bloßen Lage „an“ Gewässern umgeformt werden.
  - severity: low
    issue: Die Fußnote nennt „große Hure“ als „wörtlich auch“.
    rationale: „Hure“ ist eine mögliche, traditionellere und schärfere deutsche Wiedergabe von πόρνη, aber nicht zusätzlich zur gewählten Übersetzung „wörtlich“. Eine neutrale Kennzeichnung vermeidet eine irreführende Behauptung über die Lexik.
  revised_text: 'Dann kam einer der sieben Engel, die die sieben Schalen hatten, und sprach mit mir: »Komm! Ich werde dir das Gericht über die große Prostituierte[a] zeigen, die auf vielen Wassern sitzt.«'
  revised_footnotes:
  - marker: a
    text: 'Auch: »die große Hure«. »Gericht« kann hier auch ihre Verurteilung oder Bestrafung bezeichnen.'
    reason: lexical_alternative
  revision_rationale: Die Revision stellt die räumlich-bildhafte Kraft von ἐπί mit „auf vielen Wassern“ wieder her und präzisiert die Fußnotenformulierung. Im Übrigen bleibt die sorgfältige, moderne und semantisch offene Wiedergabe erhalten.
