id: REV.17.1
reference: Revelation 17:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: de
  text: 'Dann kam einer der sieben Engel, die die sieben Schalen hatten, und sprach mit mir: »Komm! Ich werde dir das Gericht über die große Prostituierte[a] zeigen, die auf vielen Wassern sitzt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »die große Hure«. »Gericht« kann hier auch ihre Verurteilung oder Bestrafung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Dann
  rationale: Gibt den erzählerischen Fortgang natürlich wieder und bewahrt zugleich die verbindende Funktion.
- source_word: ἦλθεν
  choice: kam
  rationale: Der Aorist von ἔρχομαι bezeichnet hier im Erzählgang das Kommen des Engels.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: einer von den sieben Engeln
  rationale: Natürliche deutsche Wiedergabe der partitiven Konstruktion.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: die die sieben Schalen hatten
  rationale: Der Relativsatz bestimmt die Engel näher; »Schalen« entspricht der etablierten Bildsprache der Offenbarung.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: sprach mit mir
  rationale: »Mit mir« bildet μετά mit Genitiv genau ab; das Partizip λέγων muss nach dem deutschen Redeeinleitungssatz nicht eigens mit »und sagte« verdoppelt werden.
- source_word: Δεῦρο
  choice: Komm!
  rationale: Prägnante und natürliche Wiedergabe der auffordernden Partikel.
- source_word: δείξω σοι
  choice: Ich werde dir … zeigen
  rationale: Bewahrt den Futur Indikativ unmittelbar.
- source_word: τὸ κρίμα
  choice: das Gericht über
  rationale: »Gericht« lässt sowohl Urteil als auch dessen vollstreckende Folge offen; »über« ist im Deutschen bei einer gegen eine Person gerichteten Gerichtshandlung idiomatisch.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: die große Prostituierte
  rationale: »Prostituierte« ist gegenwärtig, verständlich und gibt die scharfe metaphorische Bezeichnung wieder, ohne archaisch oder unnötig vulgär zu wirken.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: die an vielen Wassern sitzt
  rationale: »An« bewahrt ein im Deutschen verständliches räumliches Bild und vermeidet die unnatürliche Vorstellung, unmittelbar auf Wasserflächen zu sitzen; die symbolische Deutung wird nicht vorweggenommen.
theological_decisions:
- issue: Metaphorische Bezeichnung πόρνη für Babylon
  choice: große Prostituierte
  alternative: große Hure
  rationale: Die gewählte Form bewahrt die sexualisierte prophetische Metapher für religiöse und politische Untreue, ohne die Identität Babylons konfessionell festzulegen. Die traditionellere und schärfere Alternative wird in der Fußnote genannt.
- issue: Bedeutungsumfang von κρίμα im apokalyptischen Kontext
  choice: Gericht
  alternative: Verurteilung oder Bestrafung
  rationale: »Gericht« hält offen, ob besonders der richterliche Urteilsspruch, die Verurteilung oder die Strafvollstreckung im Blick steht, und bewahrt so die semantische Weite des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Erzählgang, wird aber durch eine natürliche deutsche Redeeinleitung geglättet. Die drastische Metapher bleibt erkennbar; archaisches Vokabular wird nur als Fußnotenalternative geboten.
