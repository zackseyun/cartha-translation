  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: de
  text: Und er trug mich im Geist[a] in eine Wüste. Da sah ich eine Frau, die auf einem scharlachroten Tier saß. Es war voller Lästerungsnamen und hatte sieben Köpfe und zehn Hörner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einem geistlichen Zustand“. Die griechische Wendung kann einen visionären Zustand bezeichnen oder darauf hinweisen, dass der Geist das visionäre Erleben bewirkt; in der Offenbarung leitet sie gewöhnlich eine Vision ein.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: trug mich
  rationale: Das Verb bezeichnet hier ein Wegtragen beziehungsweise Versetzen an einen anderen Ort; „trug mich … in“ bewahrt die Bildhaftigkeit des griechischen Ausdrucks und passt zum visionären Zusammenhang.
- source_word: εἰς ἔρημον
  choice: in eine Wüste
  rationale: ἔρημος kann eine Wüste, Wildnis oder menschenleere Gegend bezeichnen. Die artikellose Form wird mit „eine“ wiedergegeben, ohne einen bestimmten Ort vorauszusetzen.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Die Wendung kennzeichnet in der Offenbarung regelmäßig ein prophetisch-visionäres Erleben. „Im Geist“ lässt die wahrscheinliche Wirkung des göttlichen Geistes erkennen; die ebenso mögliche unpersönlichere Auffassung wird in der Fußnote genannt.
- source_word: γυναῖκα καθημένην ἐπὶ
  choice: eine Frau, die auf … saß
  rationale: Die Relativsatzkonstruktion ist im heutigen Deutsch natürlich und gibt die Stellung der Frau auf dem Tier klar wieder.
- source_word: θηρίον κόκκινον
  choice: scharlachroten Tier
  rationale: θηρίον ist der etablierte apokalyptische Ausdruck „Tier“; κόκκινος bezeichnet ein kräftiges Scharlachrot.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: voller Lästerungsnamen
  rationale: Die kompakte Bildung bewahrt die enge Verbindung zwischen den Namen und der Lästerung, ohne vorschnell festzulegen, ob die Namen selbst lästerlich sind oder Lästerung ausdrücken.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: hatte sieben Köpfe und zehn Hörner
  rationale: Die finite Wiedergabe ist im Deutschen klar und natürlich. Das maskuline Partizip ἔχων bezieht sich trotz des vorangehenden femininen γέμοντα sinngemäß auf das Tier; beide Beschreibungen werden deshalb ausdrücklich dem Tier zugeordnet.
theological_decisions:
- issue: Deutung von ἐν πνεύματι
  choice: im Geist
  alternative: im Geist beziehungsweise in einem geistgewirkten visionären Zustand, ohne ausdrückliche personale Festlegung
  rationale: Die Wendung führt in der Offenbarung typischerweise eine Vision ein und kann zugleich die Wirksamkeit des Geistes bezeichnen. Da die griechische Schrift keine Großschreibung zur Unterscheidung bietet, bleibt die Spannung durch eine Fußnote sichtbar.
- issue: Bezug der Beschreibungen γέμοντα und ἔχων
  choice: Beide Aussagen werden auf das Tier bezogen.
  alternative: Eine grammatisch rein formale Anknüpfung des femininen γέμοντα an die Frau
  rationale: γέμοντα ist Neutrum und stimmt mit θηρίον überein; ἔχων steht zwar maskulin und zeigt eine auffällige Kongruenzabweichung, wird aber inhaltlich ebenfalls als Beschreibung des Tieres verstanden. Die deutsche Fassung macht diesen naheliegenden Bezug transparent, ohne eine symbolische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Sätze vermeiden eine missverständliche Zuordnung der Lästerungsnamen und der sieben Köpfe zur Frau. „Lästerungsnamen“ ist bewusst dichter am offenen Genitiv ὀνόματα βλασφημίας als die stärker deutende Formulierung „gotteslästerliche Namen“.
