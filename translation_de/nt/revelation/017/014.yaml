id: REV.17.14
reference: Revelation 17:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: de
  text: Diese werden gegen das Lamm Krieg führen,[a] und das Lamm wird sie besiegen; denn es ist der Herr der Herren und der König der Könige. Und die bei ihm sind, sind berufen und erwählt und treu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werden mit dem Lamm Krieg führen“; im Zusammenhang bedeutet dies, dass sie gegen das Lamm Krieg führen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Diese
  rationale: Bewahrt die hinweisende Kraft des Demonstrativpronomens und verweist auf die zuvor genannten Könige beziehungsweise Mächte.
- source_word: μετὰ τοῦ ἀρνίου πολεμήσουσιν
  choice: werden gegen das Lamm Krieg führen
  rationale: μετά mit Genitiv bedeutet für sich gewöhnlich „mit“; zusammen mit πολεμέω bezeichnet die Wendung hier jedoch den Gegner, gegen den Krieg geführt wird. Die Fußnote hält die wörtliche Form sichtbar.
- source_word: ἀρνίον
  choice: das Lamm
  rationale: Bewahrt den charakteristischen christologischen Titel der Offenbarung; eine ausdrückliche Verkleinerungsform wäre im Deutschen unnatürlich und irreführend.
- source_word: νικήσει
  choice: wird sie besiegen
  rationale: Gibt den Sieg im konkreten Kriegskontext natürlich wieder und bewahrt das wiederkehrende Siegesmotiv der Offenbarung.
- source_word: ὅτι
  choice: denn
  rationale: Leitet in gehobenem, aber aktuellem Deutsch die Begründung für den Sieg des Lammes ein.
- source_word: κύριος κυρίων
  choice: der Herr der Herren
  rationale: Bewahrt die herkömmliche, superlativische Herrschaftsbezeichnung und ihren titularen Charakter.
- source_word: βασιλεὺς βασιλέων
  choice: der König der Könige
  rationale: Gibt die feste Bezeichnung höchster königlicher Autorität klar und würdevoll wieder.
- source_word: οἱ μετ’ αὐτοῦ
  choice: die bei ihm sind
  rationale: Natürliche Wiedergabe der substantivierten Präpositionalfügung, ohne die Art ihrer Begleitung näher festzulegen.
- source_word: κλητοὶ
  choice: berufen
  rationale: Bewahrt die neutestamentliche theologische Resonanz, ohne Einladung oder wirksame Berufung dogmatisch festzulegen.
- source_word: ἐκλεκτοὶ
  choice: erwählt
  rationale: Ist in modernem Deutsch verständlich und vermeidet eine systematische Ausdeutung des Begriffs.
- source_word: πιστοί
  choice: treu
  rationale: Erfasst in der Dreierreihe am besten Beständigkeit und loyale Zugehörigkeit; die mögliche Bedeutungsnähe zu „gläubig“ wird nicht dogmatisch ausgeschlossen.
theological_decisions:
- issue: Titel und Siegesaussage über das Lamm
  choice: „das Lamm wird sie besiegen“
  alternative: „das Lamm wird sie überwinden“
  rationale: „Lamm“ bewahrt den charakteristischen christologischen Titel. „Besiegen“ passt unmittelbar zum Kriegskontext, ohne zusätzliche Lehraussagen einzutragen.
- issue: Die Dreierreihe κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: „berufen und erwählt und treu“
  alternative: „berufen, auserwählt und gläubig“
  rationale: Die koordinierte Dreierreihe bleibt ausdrücklich erhalten. Die Übersetzung legt weder eine Heilsordnung noch ein bestimmtes konfessionelles Verständnis von Berufung und Erwählung fest.
- issue: Bezug des letzten Satzglieds
  choice: „Und die bei ihm sind, sind berufen und erwählt und treu.“
  alternative: Einbeziehung der Begleiter in die Aussage „werden sie besiegen“
  rationale: Die knappe griechische Konstruktion lässt die genaue syntaktische Ergänzung unausgesprochen. Die gewählte deutsche Fassung beschreibt die Begleiter, ohne ausdrücklich zu behaupten, dass sie grammatisches Subjekt des Siegesverbs seien.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Ernst. Die wiederholten Konjunktionen in „berufen und erwählt und treu“ spiegeln die nachdrückliche griechische Reihung. Der Fußnotenmarker steht unmittelbar bei der betreffenden Wendung.
