  source_fidelity: Die Übersetzung gibt die adversative Bedeutung von μετὰ τοῦ ἀρνίου πολεμήσουσιν im Kriegskontext zutreffend mit „gegen das Lamm Krieg führen“ wieder; die Fußnote dokumentiert zugleich die wörtliche Präposition. „wird sie besiegen“ gibt νικήσει im unmittelbaren Kontext angemessen wieder. Die Hoheitstitel sowie die dreigliedrige Charakterisierung κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί sind vollständig und ohne dogmatische Einengung wiedergegeben. Die prädikative Auffassung des letzten, im Griechischen knappen Satzglieds („die bei ihm sind, sind ...“) ist als mögliche und im Deutschen klare Wiedergabe vertretbar, ohne die Begleiter ausdrücklich zu Mitakteuren des Sieges zu machen.
  naturalness: Modernes, würdiges Standarddeutsch. „Krieg führen“, „Herr der Herren“ und „König der Könige“ passen zum apokalyptischen Register. Die Wiederholung von „und“ in der Dreierreihe bewahrt die Nachdrücklichkeit des Ausgangstextes und bleibt gut lesbar.
  terminology: „das Lamm“ wahrt den etablierten Offenbarungstitel. „berufen“, „erwählt“ und „treu“ sind terminologisch angemessen und vermeiden eine konfessionelle Festlegung. Die Titel sind korrekt großgeschrieben und idiomatisch formuliert.
