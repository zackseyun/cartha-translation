id: REV.17.7
reference: Revelation 17:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: de
  text: 'Und der Engel sagte zu mir: „Warum hast du dich gewundert? Ich werde dir das Geheimnis der Frau und des Tieres erklären, das sie trägt[a] und die sieben Köpfe und die zehn Hörner hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das sie auf sich trägt.'
    reason: 'Lexikalische Alternative: βαστάζω kann neben einfachem „tragen“ auch das Tragen auf sich ausdrücken.'
lexical_decisions:
- source_word: ἐθαύμασας
  choice: hast du dich gewundert
  rationale: Das Verb bezeichnet staunende Verwunderung oder Erstaunen. „Sich wundern“ ist im modernen Deutsch natürlich und bewahrt die offene Färbung zwischen Staunen und Verwunderung.
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Gemeint ist eine zunächst verborgene Wirklichkeit, die nun enthüllt wird, nicht bloß ein Rätsel. „Geheimnis“ ist dafür der etablierte und verständliche Ausdruck.
- source_word: γυναικός
  choice: Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten; hier steht eine symbolische Frauengestalt ohne ausdrücklich bezeichnete eheliche Beziehung im Blick.
- source_word: θηρίου
  choice: Tier
  rationale: „Tier“ bewahrt den festen apokalyptischen Bildbegriff der Offenbarung und die Verbindung zu den übrigen Vorkommen im Buch.
- source_word: βαστάζοντος
  choice: trägt
  rationale: Das Partizip kann Tragen, Auf-sich-Tragen oder Stützen ausdrücken. „Trägt“ gibt das visionäre Bild knapp und klar wieder, ohne die Art des Tragens näher festzulegen.
- source_word: ἔχοντος
  choice: hat
  rationale: Die finite Form im Relativsatz ist natürliches Deutsch und hält eindeutig fest, dass das Tier die Köpfe und Hörner hat.
- source_word: κεφαλάς
  choice: Köpfe
  rationale: Die konkrete Bildsprache der Vision wird wörtlich bewahrt.
- source_word: κέρατα
  choice: Hörner
  rationale: Die konkrete und symbolisch bedeutsame apokalyptische Bildsprache wird wörtlich bewahrt.
- source_word: Διὰ τί
  choice: Warum
  rationale: Dies ist die knappe, idiomatische deutsche Wiedergabe der begründungsbezogenen Frage.
- source_word: ἐρῶ σοι
  choice: Ich werde dir … erklären
  rationale: Wörtliches „ich werde dir … sagen“ klingt mit „das Geheimnis“ im Deutschen unnatürlich. „Erklären“ gibt im Kontext zutreffend wieder, dass der Engel die Bedeutung der Vision mitteilen wird.
theological_decisions:
- issue: Bezug der Beschreibung mit den sieben Köpfen und zehn Hörnern
  choice: Die Beschreibung wird eindeutig auf das Tier bezogen.
  alternative: Eine lockerere Formulierung könnte den Bezug auf die Frau, das Tier oder das gesamte Geheimnis offenlassen.
  rationale: Die Genitivpartizipien τοῦ βαστάζοντος und τοῦ ἔχοντος stimmen grammatisch mit θηρίου überein, nicht mit γυναικός. Daher soll die deutsche Fassung klar zeigen, dass das Tier die Frau trägt und die sieben Köpfe und zehn Hörner hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng an der griechischen Bildfolge, wird aber durch „erklären“ idiomatisch geglättet. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Variante bezieht.
