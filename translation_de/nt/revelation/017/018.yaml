id: REV.17.18
reference: Revelation 17:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: de
  text: Und die Frau, die du gesehen hast, ist die große Stadt, die über die Könige der Erde herrscht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Königsherrschaft über die Könige der Erde hat“. Wörtlich heißt es im Griechischen „die Königsherrschaft hat“; gemeint sein kann auch, dass sie königliche Herrschaft oder ein Königtum besitzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: Frau
  rationale: Im visionären Zusammenhang bezeichnet das Wort die symbolische Frauengestalt; „Frau“ ist daher natürlicher und weniger deutend als „Ehefrau“.
- source_word: ἣν εἶδες
  choice: die du gesehen hast
  rationale: Die Relativkonstruktion gibt den Rückbezug auf die zuvor gesehene Frau klar und idiomatisch wieder.
- source_word: πόλις ἡ μεγάλη
  choice: die große Stadt
  rationale: Dies ist die direkte und natürliche Wiedergabe der attributiven Wortgruppe, ohne die apokalyptische Identifikation näher auszudeuten.
- source_word: ἔχουσα βασιλείαν
  choice: die … herrscht
  rationale: Wörtlich steht „die Königsherrschaft/Königtum hat“. Zusammen mit „über die Könige“ bezeichnet die Formulierung ausgeübte Herrschaft; das verbale „herrscht“ ist im Deutschen klar und bewahrt diesen Sinn.
- source_word: βασιλεία
  choice: Herrschaft
  rationale: Das Substantiv kann Königreich, Königtum oder Herrschaft bedeuten. Hier liegt wegen der Ergänzung „über die Könige“ der Schwerpunkt auf königlicher Herrschaft, nicht auf einem Territorium.
- source_word: ἐπὶ τῶν βασιλέων
  choice: über die Könige
  rationale: ἐπί mit Genitiv drückt hier Überordnung beziehungsweise Herrschaft aus; „über“ ist dafür die natürliche deutsche Präposition.
- source_word: τῆς γῆς
  choice: der Erde
  rationale: Im apokalyptischen Zusammenhang ist der umfassende Sinn „Erde“ wahrscheinlicher als die Eingrenzung auf ein bestimmtes Land.
theological_decisions:
- issue: Art der Identifikation von Frau und Stadt
  choice: „die Frau … ist die große Stadt“
  alternative: „die Frau … stellt die große Stadt dar“
  rationale: Das einfache ἔστιν bedeutet „ist“. Die direkte Identifikation erhält die Bildsprache und ihre Spannung, statt sie durch eine erklärende Paraphrase aufzulösen.
- issue: Bedeutung von βασιλεία in der Herrschaftsaussage
  choice: 'Ausgeübte Herrschaft: „die … herrscht“'
  alternative: 'Besitz eines Königreichs: „die ein Königreich über die Könige der Erde hat“'
  rationale: Beide Bedeutungsrichtungen sind lexikalisch möglich. Der Haupttext gibt die im Kontext idiomatischere Herrschaftsaussage wieder; die wörtlichere Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte symbolische Gleichsetzung bleibt erhalten. „herrscht“ vermeidet eine unnatürliche deutsche Nachbildung, während die Fußnote die Mehrdeutigkeit von βασιλεία dokumentiert.
