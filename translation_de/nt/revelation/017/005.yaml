id: REV.17.5
reference: Revelation 17:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: de
  text: 'Und auf ihrer Stirn stand ein Name geschrieben: »Geheimnis, Babylon die Große, die Mutter der Prostituierten und der Gräuel der Erde.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: auf ihrer Stirn
  rationale: Die räumliche Bedeutung von ἐπί mit Akkusativ wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: ὄνομα γεγραμμένον
  choice: ein Name war geschrieben
  rationale: Die Formulierung bewahrt den passiven und resultativen Sinn des Partizips; die finite deutsche Konstruktion ist gut lesbar.
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Das Wort wird im Haupttext als Bestandteil der Aufschrift verstanden. »Geheimnis« bewahrt den apokalyptischen Sinn besser als das stärker erklärende »verborgene Bedeutung«.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babylon die Große
  rationale: Der Eigenname wird beibehalten; das substantivierte Adjektiv gibt den appositionellen Titel natürlich und würdevoll wieder.
- source_word: ἡ μήτηρ
  choice: die Mutter
  rationale: Der bestimmte Artikel und die appositionelle Titelfunktion werden im Deutschen bewahrt.
- source_word: τῶν πορνῶν
  choice: der Prostituierten
  rationale: »Prostituierte« ist eine genaue, gegenwärtige und verständliche Wiedergabe von πόρναι, ohne die Bedeutung zu verallgemeinern.
- source_word: τῶν βδελυγμάτων
  choice: der Gräuel
  rationale: »Gräuel« wahrt den biblisch-apokalyptischen Klang und umfasst moralisch wie kultisch Abscheuliches.
- source_word: τῆς γῆς
  choice: der Erde
  rationale: Im weltweiten apokalyptischen Zusammenhang ist »Erde« gegenüber »Land« vorzuziehen; der Genitiv bleibt erhalten.
theological_decisions:
- issue: Ob μυστήριον Teil der Aufschrift ist oder als erzählerische Kennzeichnung die symbolische Bedeutung des folgenden Namens einführt
  choice: 'Im Haupttext gehört »Geheimnis« zur Aufschrift: »Geheimnis, Babylon die Große …«'
  alternative: '»Ein Name war geschrieben, ein Geheimnis: Babylon die Große …«; dabei führt »Geheimnis« die symbolische Deutung des Namens ein.'
  rationale: Der unpunktierte griechische Wortlaut lässt beide Zuordnungen zu. Die Hauptfassung folgt der naheliegenden Lesart als Bestandteil des geschriebenen Namens; die sachlich mögliche Alternative wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem apokalyptischem Register. Die traditionelle, aber weiterhin verständliche Wiedergabe »Gräuel« erhält die biblische Motivik; »Prostituierte« vermeidet sowohl archaische Härte als auch interpretierende Verallgemeinerung.
