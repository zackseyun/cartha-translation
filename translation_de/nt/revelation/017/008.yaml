  naturalness: Der Text ist modernes, würdiges Standarddeutsch. „Da sein wird“ ist hier klar und weniger technisch als „gegenwärtig sein wird“. Eine geringfügige Umstellung im letzten Satz macht den Bezug des Sehens und Staunens transparenter.
