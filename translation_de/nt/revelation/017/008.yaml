id: REV.17.8
reference: Revelation 17:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: de
  text: Das Tier, das du gesehen hast, war und ist nicht. Es ist im Begriff, aus dem Abgrund heraufzusteigen und ins Verderben zu gehen. Die Bewohner der Erde, deren Name nicht seit Grundlegung der Welt im Buch des Lebens geschrieben steht, werden staunen, wenn sie das Tier sehen, weil es war und nicht ist und da sein wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… werden staunen, wenn sie das Tier sehen, das war und nicht ist und kommen (oder: erscheinen) wird.“ Das griechische Wort kann hier sowohl den Grund des Staunens („weil“) als auch dessen Inhalt bzw. eine nähere Bestimmung des Tieres einleiten; „da sein wird“ gibt die künftige Anwesenheit des Tieres wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: Tier
  rationale: „Tier“ ist die in der Offenbarung etablierte deutsche Wiedergabe und bewahrt die symbolische, bedrohliche Kraft des Begriffs; „wildes Tier“ wäre erklärender, aber weniger traditions- und kontextgerecht.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: war und ist nicht
  rationale: Die knappe Zeitformfolge des Griechischen bleibt erhalten und damit auch ihr bewusster Kontrast zur Gottesbezeichnung im Umfeld.
- source_word: μέλλει ἀναβαίνειν
  choice: ist im Begriff, … heraufzusteigen
  rationale: Die Formulierung gibt sowohl die bevorstehende Handlung in μέλλει als auch die Aufwärtsbewegung von ἀναβαίνειν wieder.
- source_word: ἄβυσσος
  choice: Abgrund
  rationale: „Abgrund“ ist ein verständlicher und im apokalyptischen Sprachgebrauch etablierter Ausdruck, ohne die interpretierende Vorstellung eines „bodenlosen Schlundes“ einzutragen.
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: ins Verderben zu gehen
  rationale: Die Wendung bewahrt die gerichtete Bewegung auf den endgültigen Untergang zu; „Verderben“ ist würdig und im heutigen Deutsch verständlich.
- source_word: θαυμασθήσονται
  choice: werden staunen
  rationale: Das deponentisch gebrauchte Futur bezeichnet hier erstauntes, verwundertes Reagieren; „staunen“ ist natürlich und lässt offen, ob Bewunderung mitschwingt.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: die Bewohner der Erde
  rationale: Die Formulierung gibt die wiederkehrende Bezeichnung der Offenbarung prägnant und in natürlichem Deutsch wieder.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: deren Name nicht … geschrieben steht
  rationale: Der Singular τὸ ὄνομα wird bewahrt. „Geschrieben steht“ gibt den resultativen Zustand des griechischen Perfekts idiomatisch wieder.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: im Buch des Lebens
  rationale: Für einen eingetragenen Namen verlangt das Deutsche idiomatisch „im Buch“, auch wenn ἐπί wörtlich eine Lage „auf“ bezeichnen kann.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: seit Grundlegung der Welt
  rationale: „Seit“ drückt den zeitlichen Ausgangspunkt natürlich aus; „Grundlegung der Welt“ bewahrt die gewichtige und etablierte Form des Ausdrucks.
- source_word: βλεπόντων
  choice: wenn sie … sehen
  rationale: Der Genitiv des Partizips wird als zeitlicher Begleitumstand verständlich ins Deutsche übertragen.
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: weil es war und nicht ist und da sein wird
  rationale: ὅτι wird im Haupttext kausal verstanden. „Da sein wird“ wahrt den Bezug von παρέσται auf künftige Anwesenheit und zugleich die sprachliche Folge von Sein, Nichtsein und erneutem Dasein.
theological_decisions:
- issue: Zeitlicher Bezug von ἀπὸ καταβολῆς κόσμου
  choice: 'Die Wendung bezieht sich auf das Nichtgeschriebensein des Namens: „deren Name nicht seit Grundlegung der Welt im Buch des Lebens geschrieben steht“.'
  alternative: Eine weiter reichende dogmatische Deutung der Aussage über Erwählung oder Vorherbestimmung.
  rationale: Wortstellung und Satzbau verbinden die Zeitangabe unmittelbar mit γέγραπται und dem Buch des Lebens. Die Übersetzung erhält diese Verbindung, ohne daraus ein über den Vers hinausgehendes Lehrsystem abzuleiten.
- issue: Funktion von ὅτι und Bedeutung von παρέσται
  choice: „weil … und da sein wird“
  alternative: „dass es war und nicht ist und kommen/erscheinen wird“
  rationale: ὅτι kann den Grund des Staunens oder dessen Inhalt einleiten; beide Möglichkeiten sind grammatisch vertretbar. Der Haupttext wählt die kausale Lesart, während die Fußnote die Inhaltslesart festhält. παρέσται wird möglichst nah als künftiges Dasein beziehungsweise Anwesendsein wiedergegeben, ohne ausdrücklich eine Auferstehung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der in der Offenbarung vertrauten Bildsprache. Kurze, markante Sätze bewahren die feierliche Zeitformfolge, während idiomatische Wendungen wie „im Buch“ und „geschrieben steht“ natürliche Verständlichkeit sichern.
