id: REV.17.12
reference: Revelation 17:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: de
  text: Und die zehn Hörner, die du gesehen hast, sind zehn Könige. Sie haben noch kein Königreich empfangen, aber zusammen mit dem Tier empfangen sie für eine Stunde[a] Vollmacht als Könige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für kurze Zeit“. Die Wendung „eine Stunde“ bezeichnet in der apokalyptischen Bildsprache wahrscheinlich einen kurzen, begrenzten Zeitraum.'
    reason: lexikalische Alternative und Erklärung der Bildsprache
lexical_decisions:
- source_word: κέρατα
  choice: Hörner
  rationale: Die wörtliche Wiedergabe bewahrt die apokalyptische Bildsprache; ihre symbolische Bedeutung wird durch die Identifikation als Könige im Satz selbst angezeigt.
- source_word: βασιλεῖς
  choice: Könige
  rationale: Dies entspricht der üblichen lexikalischen Bedeutung und lässt offen, ob konkrete Monarchen oder symbolisch dargestellte Herrscher gemeint sind.
- source_word: βασιλείαν
  choice: Königreich
  rationale: Die Wiedergabe bezeichnet hier am natürlichsten ein Reich beziehungsweise einen Herrschaftsbereich und hält die Unterscheidung zu ἐξουσίαν aufrecht.
- source_word: οὔπω ἔλαβον
  choice: haben noch kein … empfangen
  rationale: 'Das deutsche Perfekt gibt den resultativen Gegenwartsbezug idiomatisch wieder: Bis zum dargestellten Zeitpunkt haben sie kein Königreich erhalten.'
- source_word: ἐξουσίαν ὡς βασιλεῖς
  choice: königliche Vollmacht
  rationale: Die Formulierung gibt die zum Herrschen erteilte Autorität natürlich wieder, ohne sie mit dem zuvor genannten Königreich gleichzusetzen.
- source_word: μίαν ὥραν
  choice: für eine Stunde
  rationale: Die formale Zeitangabe und ihre apokalyptische Bildkraft bleiben im Haupttext erhalten; die mögliche Bedeutung eines kurzen, begrenzten Zeitraums wird in der Fußnote genannt.
- source_word: λαμβάνουσιν
  choice: sie empfangen
  rationale: Das griechische Präsens wird direkt und im lebhaften Stil der Vision wiedergegeben, statt den möglichen Zukunftsbezug ausdrücklich festzulegen.
- source_word: μετὰ τοῦ θηρίου
  choice: zusammen mit dem Tier
  rationale: Die Formulierung drückt die zeitliche und sachliche Verbindung mit dem Tier idiomatisch aus.
- source_word: θηρίου
  choice: Tier
  rationale: Die in der Offenbarung etablierte Wiedergabe bewahrt die apokalyptische Bildsprache.
theological_decisions:
- issue: Sind die zehn Könige wörtliche Monarchen oder symbolische Herrscher beziehungsweise Mächte?
  choice: Im Haupttext steht entsprechend dem Griechischen „zehn Könige“.
  alternative: „zehn Herrscher“, „zehn politische Mächte“ oder „zehn Reiche“
  rationale: Der Wortlaut identifiziert die Hörner als Könige, während der apokalyptische Zusammenhang zugleich eine symbolische Deutung zulässt. Diese Spannung wird nicht durch eine erklärende Paraphrase aufgelöst.
- issue: Bezeichnet μίαν ὥραν eine buchstäbliche Stunde oder einen kurzen Zeitraum?
  choice: Im Haupttext steht „für eine Stunde“, ergänzt durch eine Fußnote.
  alternative: „für kurze Zeit“ oder „für eine kurze Weile“
  rationale: Die Übersetzung bewahrt die konkrete Ausdrucksweise des Ausgangstextes, ohne die im apokalyptischen Zusammenhang wahrscheinliche bildhafte Bedeutung zu verschweigen.
- issue: Hat λαμβάνουσιν hier präsentische oder zukünftige Bedeutung?
  choice: Das Präsens wird mit „sie empfangen“ bewahrt.
  alternative: „sie werden empfangen“
  rationale: Der Kontext kann auf ein zukünftiges Geschehen weisen, doch das griechische Präsens lässt sich als lebhaftes visionssprachliches Präsens verstehen. Die Übersetzung legt die Zeitstufe daher nicht stärker fest als der Wortlaut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzfolge wurde zur besseren Lesbarkeit geteilt. „Königliche Vollmacht“ vermeidet das im Deutschen schwerfällige „Vollmacht als Könige“, bewahrt aber die Unterscheidung zwischen Königreich und erteilter Herrschaftsvollmacht.
