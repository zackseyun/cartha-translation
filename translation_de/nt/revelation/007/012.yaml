id: REV.7.12
reference: Revelation 7:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: de
  text: 'und sagten: »Amen! Der Lobpreis und die Herrlichkeit und die Weisheit und der Dank und die Ehre und die Macht und die Stärke seien unserem Gott für immer und ewig.[a] Amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »bis in die Zeitalter der Zeitalter«.'
    reason: Die Fußnote bewahrt die Bild- und Steigerungsform der griechischen Zeitangabe, während der Haupttext ihre natürliche deutsche Entsprechung verwendet.
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip leitet den Inhalt des gemeinsamen Zurufs ein. Im Deutschen gibt die koordinierte finite Form den Anschluss an die vorausgehende Handlung natürlich wieder.
- source_word: Ἀμήν / ἀμήν
  choice: Amen
  rationale: In liturgischem und doxologischem Zusammenhang wird ἀμήν herkömmlich als »Amen« wiedergegeben. Die Wiederholung rahmt den Lobpreis.
- source_word: ἡ εὐλογία
  choice: der Lobpreis
  rationale: In der an Gott gerichteten Doxologie bezeichnet εὐλογία hier den ihm zugesprochenen Lobpreis; »Segen« könnte im Deutschen eher an eine von Gott ausgehende Gabe denken lassen.
- source_word: ἡ δόξα
  choice: die Herrlichkeit
  rationale: »Herrlichkeit« ist die geläufige und in doxologischer Sprache angemessene Wiedergabe von δόξα.
- source_word: ἡ σοφία
  choice: die Weisheit
  rationale: Die substantivische Form und der Artikel der feierlichen Aufzählung bleiben erhalten.
- source_word: ἡ εὐχαριστία
  choice: der Dank
  rationale: »Dank« gibt die an Gott gerichtete Danksagung natürlich und würdig wieder; »Danksagung« wäre formaler, im heutigen Deutsch aber schwerfälliger.
- source_word: ἡ τιμή
  choice: die Ehre
  rationale: Im Anbetungskontext bezeichnet τιμή die Gott erwiesene Ehre.
- source_word: ἡ δύναμις
  choice: die Macht
  rationale: »Macht« bezeichnet hier wirksame Kraft beziehungsweise Vermögen und lässt sich von ἰσχύς sprachlich unterscheiden.
- source_word: ἡ ἰσχύς
  choice: die Stärke
  rationale: »Stärke« bewahrt neben »Macht« die rhetorische Häufung zweier bedeutungsnaher, aber verschiedener Begriffe.
- source_word: τῷ θεῷ ἡμῶν
  choice: seien unserem Gott
  rationale: Der Dativ bezeichnet den Empfänger beziehungsweise das Ziel des Lobpreises. Der ergänzte Optativ »seien« wahrt den zusprechenden Charakter der im Griechischen verblosen Doxologie.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Diese feste deutsche Wendung gibt die griechische Steigerungsform für unbegrenzte Dauer idiomatisch wieder.
theological_decisions:
- issue: Ergänzung eines Verbs in der verblosen Doxologie
  choice: seien unserem Gott
  alternative: gehören unserem Gott
  rationale: Das Griechische enthält nach der Aufzählung kein ausdrückliches Verb. »Seien unserem Gott« erhält die offene, zusprechende Gebetssprache, während »gehören« den Ausdruck stärker als Besitzfeststellung festlegen würde.
- issue: Unterscheidung von δύναμις und ἰσχύς
  choice: Macht … Stärke
  alternative: Kraft … Stärke
  rationale: Die zwei verschiedenen, bedeutungsnahen Wörter werden nicht zusammengezogen. »Macht … Stärke« bewahrt sowohl ihre Unterscheidung als auch die feierliche Fülle des siebenfachen Lobpreises.
translation_notes:
  register: Moderne, würdige Gottesdienstsprache. Die sieben Glieder behalten jeweils den bestimmten Artikel und damit den feierlichen Rhythmus des griechischen Textes; zugleich werden schwerfällige oder missverständliche Wort-für-Wort-Formulierungen vermieden.
