  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: de
  text: aus dem Stamm Ascher zwölftausend, aus dem Stamm Naftali zwölftausend, aus dem Stamm Manasse zwölftausend;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aus dem Zusammenhang ausführlicher: „Aus dem Stamm Ascher wurden zwölftausend versiegelt“ (entsprechend auch bei den folgenden Stämmen). Im griechischen Text dieses Verses wird das Verb nicht wiederholt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: aus
  rationale: Die Präposition bezeichnet hier Herkunft beziehungsweise Zugehörigkeit. In der wiederholten Aufzählungsformel ist „aus“ die natürliche und genaue deutsche Wiedergabe.
- source_word: φυλῆς
  choice: Stamm
  rationale: φυλή bezeichnet in diesem israelitisch-genealogischen Zusammenhang einen der Stämme Israels; „Stamm“ ist die etablierte und präzise deutsche Entsprechung.
- source_word: Ἀσὴρ
  choice: Ascher
  rationale: Der Eigenname wird in der im modernen deutschen Bibelgebrauch üblichen Form wiedergegeben.
- source_word: δώδεκα χιλιάδες
  choice: zwölftausend
  rationale: Zahlwort und Mengenbezeichnung geben unmittelbar die Größe der genannten Gruppe an. Ein Verb wie „wurden versiegelt“ wird nicht ergänzt, weil es im griechischen Text dieses Verses nicht wiederholt wird.
- source_word: Νεφθαλὶμ
  choice: Naftali
  rationale: Die im modernen deutschen Bibelgebrauch übliche Form des Stammesnamens.
- source_word: Μανασσῆ
  choice: Manasse
  rationale: Die im Deutschen etablierte Form des Eigennamens.
theological_decisions:
- issue: Ob das aus dem Zusammenhang erschlossene Verb „wurden versiegelt“ ergänzt werden soll
  choice: Im Haupttext kein Verb ergänzen, sondern die knappe, verblose Aufzählung des Griechischen bewahren.
  alternative: aus dem Stamm Ascher wurden zwölftausend versiegelt; aus dem Stamm Naftali zwölftausend; aus dem Stamm Manasse zwölftausend
  rationale: Der Gedanke der Versiegelung ist durch den vorausgehenden Zusammenhang vorgegeben. Der griechische Text dieses Verses enthält jedoch nur wiederholte Herkunftsangaben und Zahlen, ohne das Verb erneut auszudrücken. Die knappe Listenform wahrt daher sowohl den Wortlaut als auch den Zusammenhang.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele, knappe Listenstruktur des griechischen Textes bleibt erhalten; die Namen folgen den geläufigen deutschen Bibelformen.
