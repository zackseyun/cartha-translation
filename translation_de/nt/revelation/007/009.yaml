id: REV.7.9
reference: Revelation 7:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: de
  text: 'Danach sah ich, und siehe: eine große Schar, die niemand zählen konnte, aus jeder Nation und aus Stämmen, Völkern und Sprachen.[a] Sie standen vor dem Thron und vor dem Lamm, in weißen Gewändern gekleidet, mit Palmzweigen in ihren Händen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich in der auffälligen Zahlenfolge des Griechischen: »aus jeder Nation und aus Stämmen und Völkern und Sprachen«. Nur »Nation« steht im Singular; die übrigen Bezeichnungen stehen im Plural.'
    reason: Die Anmerkung macht den grammatischen Wechsel sichtbar, der leicht als eine durchgehend singularische Aufzählung geglättet wird.
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Die natürliche deutsche Zeitangabe bewahrt die Abfolge der Visionen, ohne die im Deutschen schwerfällige Wendung »Nach diesen Dingen« zu verwenden.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: sah ich, und sieh
  rationale: »Sah ich« gibt das Wahrnehmungsverb direkt wieder; »sieh« erhält ἰδού als eindringliches Aufmerksamkeitssignal.
- source_word: ὄχλος πολύς
  choice: eine große Schar
  rationale: »Schar« bezeichnet eine sehr große versammelte Menschenmenge und passt zum würdevollen visionären Register, ohne die Größe über das griechische πολύς hinaus zu steigern.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: die niemand zählen konnte
  rationale: Die deutsche Relativkonstruktion gibt sowohl das Zählen als auch die Unfähigkeit jedes Menschen idiomatisch wieder; das griechische wiederaufnehmende Pronomen αὐτόν wird im Deutschen nicht eigens ausgedrückt.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: aus jeder Nation und aus Stämmen, Völkern und Sprachen
  rationale: Die Wiedergabe erhält den auffälligen Wechsel vom Singular »Nation« zu den Pluralformen »Stämmen, Völkern und Sprachen«. Das zweite »aus« macht die Konstruktion im Deutschen verständlich, ohne die Gruppenbegriffe zu vereinheitlichen.
- source_word: ἑστῶτες
  choice: Sie standen
  rationale: Ein neuer deutscher Satz löst den griechischen Wechsel von der singularischen »Schar« zur pluralischen Beschreibung ihrer Angehörigen grammatisch und erhält zugleich den anschaulichen Szenenwechsel.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: vor dem Thron und vor dem Lamm
  rationale: Die Wiederholung von »vor« entspricht der Wiederholung von ἐνώπιον und bewahrt den feierlichen Rhythmus.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: in weiße Gewänder gekleidet
  rationale: »Gewänder« gibt die langen, feierlichen Kleidungsstücke wieder; die Formulierung wahrt den passivischen Sinn von περιβεβλημένους.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: mit Palmzweigen in ihren Händen
  rationale: φοίνικες bezeichnet hier Palmzweige. Die mit-Konstruktion bleibt nahe an der griechischen Zustandsbeschreibung und ergänzt nicht ausdrücklich eine Handlung wie »halten«.
theological_decisions:
- issue: Wiedergabe von ἀρνίον als christologischer Titel
  choice: das Lamm
  alternative: das Lämmchen
  rationale: Obwohl ἀρνίον der Form nach ein Diminutiv sein kann, ist es in der Offenbarung ein feststehender christologischer Titel. »Das Lamm« bewahrt dessen Erkennbarkeit und theologisches Gewicht, ohne eine im Deutschen unangebrachte Verniedlichung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem visionärem Aufmerksamkeitssignal. Der lange griechische Satz wird nach der Herkunftsangabe geteilt, damit der Wechsel von der singularischen Gesamtheit (»Schar«) zu den pluralisch beschriebenen Menschen natürlich verständlich bleibt. Der Fußnotenmarker steht unmittelbar bei der betreffenden Herkunftsformel.
