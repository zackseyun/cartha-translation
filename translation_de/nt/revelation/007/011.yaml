review_pass:
  verdict: revise
  source_fidelity: Die räumliche Anordnung („rings um den Thron, um die Ältesten und um die vier lebendigen Wesen“) gibt κύκλῳ mit allen drei Genitiven treffend wieder. „Beteten Gott an“ entspricht προσεκύνησαν τῷ θεῷ im gegebenen Kontext. „Warfen sich ... nieder“ beschreibt zwar die resultierende Prostration, ist gegenüber ἔπεσαν („fielen“) jedoch etwas stärker voluntativ und damit weniger unmittelbar.
  naturalness: Der Text ist insgesamt klares, würdiges modernes Standarddeutsch. „Auf ihr Angesicht“ wirkt allerdings gehoben-biblisch und ist im modernen Standarddeutsch weniger natürlich als „auf ihre Gesichter“.
  terminology: „Engel“, „Thron“, „Älteste“ und „lebendige Wesen“ sind konsistent und angemessen. Die Fußnote bietet mit „lebendige Geschöpfe“ eine sachlich mögliche lexikalische Alternative, ohne die visionären Wesen auf Tiere zu reduzieren.
  issues:
  - severity: low
    issue: „warfen sich ... nieder“ statt „fielen ... nieder“
    rationale: ἔπεσαν bezeichnet zunächst das Fallen; die Prostration wird durch „auf ihre Gesichter“ ausdrücklich gemacht. „Fielen“ bewahrt die unmittelbare verbale Bildlichkeit des griechischen Textes besser und vermeidet einen leicht verstärkten, absichtlichen Anklang.
  - severity: low
    issue: „auf ihr Angesicht“
    rationale: Die singularische distributive Wendung ist verständlich, aber stilistisch altertümlicher. „Auf ihre Gesichter“ ist für modernes Standarddeutsch natürlicher und gibt τὰ πρόσωπα αὐτῶν unmittelbar wieder.
  revised_text: Und alle Engel standen rings um den Thron, um die Ältesten und um die vier lebendigen Wesen[a]. Sie fielen vor dem Thron auf ihre Gesichter nieder und beteten Gott an.
  revised_footnotes:
