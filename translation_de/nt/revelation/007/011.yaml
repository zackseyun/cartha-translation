source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: de
  text: Und alle Engel standen rings um den Thron, um die Ältesten und um die vier lebendigen Wesen[a]. Sie fielen vor dem Thron auf ihre Gesichter nieder und beteten Gott an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vier lebendigen Geschöpfe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: alle Engel
  rationale: Gibt die umfassende Aussage des griechischen Ausdrucks schlicht und idiomatisch wieder; „Engel“ ist im Kontext der Offenbarung die natürliche Entsprechung.
- source_word: εἱστήκεισαν
  choice: standen
  rationale: Die Form bezeichnet einen bestehenden Zustand. Das deutsche Präteritum „standen“ drückt die andauernde Körperhaltung im Erzählzusammenhang natürlich aus.
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων
  choice: rings um den Thron, um die Ältesten und um die vier lebendigen Wesen
  rationale: „Rings um“ bildet die räumliche Anordnung ab. Die Wiederholung von „um“ verdeutlicht im Deutschen, dass die Engel die gesamte genannte Throngruppe umgeben.
- source_word: τῶν πρεσβυτέρων
  choice: die Ältesten
  rationale: „Älteste“ ist die etablierte, kontextgerechte Bezeichnung für diese himmlische Gruppe in der Offenbarung.
- source_word: τῶν τεσσάρων ζῴων
  choice: die vier lebendigen Wesen
  rationale: „Lebendige Wesen“ bewahrt den belebten Charakter und die apokalyptische Offenheit von ζῷα, ohne irreführend „Tiere“ zu sagen oder die Wesen näher zu bestimmen.
- source_word: ἔπεσαν ... ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: warfen sich ... auf ihr Angesicht nieder
  rationale: Die deutsche Wendung gibt die bewusste vollständige Niederwerfung natürlich wieder. Der Singular „ihr Angesicht“ ist eine würdige distributive Formulierung.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: vor dem Thron
  rationale: Gibt die räumliche Bedeutung knapp und idiomatisch wieder.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: beteten Gott an
  rationale: Da Gott ausdrücklich das Ziel der Handlung ist und die körperliche Niederwerfung bereits genannt wurde, bezeichnet προσκυνέω hier eindeutig Anbetung.
theological_decisions:
- issue: Bezeichnung der himmlischen Thronwesen (ζῷα)
  choice: lebendige Wesen
  alternative: lebendige Geschöpfe
  rationale: „Lebendige Wesen“ erhält die Mehrdeutigkeit der visionären Gestalten und vermeidet sowohl die Verengung auf Tiere als auch eine zusätzliche theologische Identifizierung.
- issue: Bedeutung von προσκυνέω gegenüber Gott
  choice: beteten Gott an
  alternative: huldigten Gott
  rationale: Mit Gott als ausdrücklichem Gegenüber und nach der bereits geschilderten Niederwerfung trägt das Verb hier den vollen Sinn religiöser Anbetung; „huldigen“ wäre weniger eindeutig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung nach der Beschreibung der Aufstellung verbessert die Lesbarkeit, ohne die Abfolge oder den Zusammenhang des griechischen Satzes zu verändern.
