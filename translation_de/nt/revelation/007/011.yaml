- from: Und alle Engel standen rings um den Thron, um die Ältesten und um die vier lebendigen Wesen[a]. Sie warfen sich vor dem Thron auf ihr Angesicht nieder und beteten Gott an.
  to: Und alle Engel standen rings um den Thron, um die Ältesten und um die vier lebendigen Wesen[a]. Sie fielen vor dem Thron auf ihre Gesichter nieder und beteten Gott an.
  rationale: 'Die Revision ersetzt nur zwei Formulierungen: „fielen“ bildet ἔπεσαν unmittelbarer ab, und „auf ihre Gesichter“ ist modernes, natürliches Deutsch bei gleicher Aussage. Die Satzteilung, die räumliche Zuordnung und die terminologische Entscheidung für „lebendige Wesen“ bleiben erhalten.'
