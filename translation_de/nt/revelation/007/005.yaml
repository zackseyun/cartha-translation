  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: de
  text: aus dem Stamm Juda zwölftausend Versiegelte[a], aus dem Stamm Ruben zwölftausend, aus dem Stamm Gad zwölftausend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit ausdrücklicher Verbform: „aus dem Stamm Juda wurden zwölftausend versiegelt“. Im Griechischen steht nach der ersten Stammeszahl ein passives Partizip („versiegelt“).'
    reason: lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: ἐκ
  choice: aus
  rationale: Bezeichnet hier Herkunft beziehungsweise Zugehörigkeit und bewahrt die wiederholte griechische Aufzählungsformel natürlich im Deutschen.
- source_word: φυλῆς
  choice: Stamm
  rationale: Im Zusammenhang der israelitischen Stammesliste ist „Stamm“ die etablierte und sachlich passende Wiedergabe; „Sippe“ wäre zu eng.
- source_word: Ἰούδα
  choice: Juda
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
- source_word: δώδεκα χιλιάδες
  choice: zwölftausend
  rationale: Direkte Zahlwiedergabe; im Deutschen kann die substantivische Ergänzung aus dem folgenden Partizip hervorgehen.
- source_word: ἐσφραγισμένοι
  choice: Versiegelte
  rationale: Das passive Partizip wird formal nah und zugleich idiomatisch substantiviert wiedergegeben. Seine Stellung nach der ersten Zahl bleibt erkennbar, ohne es in den folgenden Gliedern ausdrücklich zu wiederholen.
- source_word: Ῥουβὴν
  choice: Ruben
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
- source_word: Γὰδ
  choice: Gad
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
theological_decisions:
- issue: Form und Reichweite von ἐσφραγισμένοι in der Stammesaufzählung
  choice: „zwölftausend Versiegelte“ im ersten Glied; in den folgenden parallelen Gliedern bleibt das Partizip unausgesprochen mitverstanden.
  alternative: „zwölftausend wurden versiegelt“ oder die Wiederholung von „Versiegelte“ bei jedem Stamm.
  rationale: Der griechische Text setzt das passive Partizip ausdrücklich nur nach der ersten Zahl. Die substantivische Wiedergabe wahrt diese Struktur und lässt zugleich offen, wie stark die Formulierung syntaktisch auf die gesamte Liste zu beziehen ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe Listenform und die Ellipse der folgenden Glieder werden bewahrt; „Versiegelte“ ist verständlich und näher an der griechischen Partizipialkonstruktion als eine vollständig ausgebaute Verbform.
