revisions:
- from: Darum stehen sie vor dem Thron Gottes und dienen ihm Tag und Nacht in seinem Tempel. Und der auf dem Thron sitzt, wird sein Zelt über ihnen aufschlagen.[a]
  to: Darum stehen sie vor dem Thron Gottes und dienen ihm Tag und Nacht in seinem Tempel. Und der auf dem Thron sitzt, wird sein Zelt über ihnen aufspannen.[a]
  rationale: Die Revision betrifft ausschließlich die Wiedergabe von σκηνώσει ἐπ’ αὐτούς und ihre Erläuterung. „Aufspannen“ ist im Deutschen die natürlichere Formulierung für ein Zelt, das schützend „über“ Personen steht, und erhält zugleich das im griechischen Verb angelegte Zeltbild. Die Alternative „beschirmen“ bleibt als sinngemäße, nicht als alleinige Wiedergabe in der Fußnote.
  reviewer_model: gpt-5.6-terra
