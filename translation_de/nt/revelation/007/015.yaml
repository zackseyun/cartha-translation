id: REV.7.15
reference: Revelation 7:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: de
  text: Darum stehen sie vor dem Thron Gottes und dienen ihm Tag und Nacht in seinem Tempel. Und der auf dem Thron sitzt, wird sein Zelt über ihnen aufspannen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird über ihnen wohnen“ oder „wird sie beschirmen“. Das griechische Verb ist mit dem Bild eines Zeltes und des Wohnens darin verbunden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: Darum
  rationale: Die knappe, natürliche Folgerungsformel verweist auf die vorausgehende Begründung und bewahrt den kausal-inferenziellen Zusammenhang.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor dem Thron“ gibt sowohl die räumliche Nähe als auch das Sein in Gottes Gegenwart prägnant wieder.
- source_word: λατρεύουσιν
  choice: dienen
  rationale: Das Verb bezeichnet hier den Gott erwiesenen kultischen Dienst. „Dienen“ lässt dessen umfassenden Charakter stehen, während der Tempelkontext die gottesdienstliche Bedeutung erkennen lässt.
- source_word: ἡμέρας καὶ νυκτός
  choice: Tag und Nacht
  rationale: Die verständliche feste Wendung bewahrt das Bild unablässigen Dienstes.
- source_word: ναῷ
  choice: Tempel
  rationale: ναός bezeichnet das Heiligtum beziehungsweise den Tempel. „Tempel“ ist im Deutschen geläufig und passt zum himmlischen Kontext.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: der auf dem Thron sitzt
  rationale: Die Formulierung ist natürlich, würdevoll und bewahrt den titelartigen Charakter des Partizips.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: wird sein Zelt über ihnen aufschlagen
  rationale: Die Wiedergabe erhält das Zelt- beziehungsweise Heiligtumsmotiv des Verbs σκηνόω und die durch ἐπί bezeichnete schützende Gegenwart, ohne das Bild auf eine abstrakte Aussage zu reduzieren.
theological_decisions:
- issue: Wiedergabe von σκηνώσει als Bild göttlicher Gegenwart
  choice: wird sein Zelt über ihnen aufschlagen
  alternative: wird über ihnen wohnen; wird sie beschirmen
  rationale: Die gewählte Formulierung bewahrt die Spannung zwischen Wohnen, Zelt-Heiligtum und Schutz. Sie ruft Gottes gegenwärtige und schützende Nähe auf, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der Satzbau folgt dem griechischen Gedankengang, bleibt aber idiomatisch. Das Zeltbild wird im Haupttext erhalten und durch eine knappe Fußnote erläutert.
