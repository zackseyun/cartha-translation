review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzglieder und die inferenzielle Verbindung von διὰ τοῦτο zutreffend wieder. „dienen“ wahrt bei λατρεύουσιν den Charakter des Gott erwiesenen kultischen Dienstes, und „Tempel“ ist für ναός angemessen. Für σκηνώσει ἐπ’ αὐτούς sollte das Zeltbild jedoch idiomatischer und räumlich klarer als Überspannen über den Menschen formuliert werden.
  naturalness: „Darum stehen sie vor dem Thron Gottes“ sowie der übrige Satz sind modernes, würdiges Standarddeutsch. „Sein Zelt über ihnen aufschlagen“ ist zwar verständlich, klingt aber im Deutschen eher nach dem Errichten eines Lagers und verbindet sich weniger natürlich mit „über ihnen“. „… über ihnen aufspannen“ bildet das beabsichtigte Schutz- und Zeltbild klarer ab.
  terminology: „Thron Gottes“, „dienen“, „Tag und Nacht“ und „Tempel“ sind treffend und registergerecht. Die Fußnote soll die mit σκηνόω verbundene Zelt-/Wohnmetaphorik nennen, ohne „Heiligtum“ als unmittelbare lexikalische Bedeutung des Verbs auszugeben.
  issues:
  - severity: low
    issue: „sein Zelt über ihnen aufschlagen“ ist für σκηνώσει ἐπ’ αὐτούς leicht unidiomatisch.
    rationale: „Ein Zelt aufschlagen“ bezeichnet gewöhnlich das Errichten eines Zeltes an einem Ort. „Sein Zelt über ihnen aufspannen“ bewahrt die Zeltmetaphorik und macht die durch ἐπί ausgedrückte Überdeckung bzw. schützende Nähe im Deutschen deutlicher.
  - severity: low
    issue: Die Fußnote verknüpft das Verb zu direkt mit dem Bildfeld „Heiligtum“.
    rationale: σκηνόω bezeichnet primär das Zelten/Wohnen im Zelt; die Anspielung auf das Heiligtum bzw. die Stiftshütte entsteht hier aus dem weiteren Bildzusammenhang. Eine präzisere Fußnote sollte zuerst Zelt und Wohnen nennen.
