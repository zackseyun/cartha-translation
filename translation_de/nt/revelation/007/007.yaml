id: REV.7.7
reference: Revelation 7:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: de
  text: aus dem Stamm Simeon zwölftausend, aus dem Stamm Levi zwölftausend, aus dem Stamm Issachar zwölftausend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: aus
  rationale: Bezeichnet Herkunft beziehungsweise Zugehörigkeit. „Aus“ ist im Deutschen die natürliche Entsprechung und bewahrt die wiederholte Listenformel.
- source_word: φυλῆς
  choice: Stamm
  rationale: Im Zusammenhang der israelitischen Gliederung bezeichnet φυλή einen Stamm; „Stamm“ ist die etablierte und präzise deutsche Wiedergabe.
- source_word: Συμεὼν
  choice: Simeon
  rationale: Wiedergabe des Stammesnamens in der geläufigen deutschen Form.
- source_word: δώδεκα χιλιάδες
  choice: zwölftausend
  rationale: Die ausgeschriebene Zahl entspricht dem feierlich-literarischen Charakter der Aufzählung und bezeichnet die Zahl aus jedem Stamm.
- source_word: Λευὶ
  choice: Levi
  rationale: Wiedergabe des Eigennamens in der geläufigen deutschen Form. Die ausdrückliche Aufnahme Levis in die griechische Liste bleibt ohne erklärenden Zusatz erhalten.
- source_word: Ἰσσαχὰρ
  choice: Issachar
  rationale: Wiedergabe des Stammesnamens in der geläufigen deutschen Form.
theological_decisions:
- issue: Wiederholte Syntax der Stammesliste
  choice: Die Formel „aus dem Stamm … zwölftausend“ wird bei jedem Stamm wiederholt.
  alternative: „aus den Stämmen Simeon, Levi und Issachar jeweils zwölftausend“
  rationale: Der griechische Text wiederholt die vollständige Formel. Diese Wiederholung trägt den Rhythmus der apokalyptischen Aufzählung und soll nicht geglättet werden.
- issue: Aufnahme Levis in die Aufzählung
  choice: Levi wird ohne erklärende Erweiterung im Haupttext genannt.
  alternative: Eine Erklärung zu Levis ungewöhnlicher Aufnahme in die Stammesliste ergänzen.
  rationale: Der Vers zählt Levi schlicht zu den genannten Stämmen. Eine Erklärung im Haupttext würde über die Aussage der Vorlage hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Listenform ohne ergänztes Verb und die dreifache Wiederholung entsprechen der Struktur des griechischen Textes. Für ἐκ ist „aus“ im Deutschen eindeutig und natürlich; eine Fußnote mit derselben Bedeutungsalternative ist daher nicht erforderlich.
