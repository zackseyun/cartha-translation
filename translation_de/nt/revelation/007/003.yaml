reference: Revelation 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: de
  text: 'und sagte: „Fügt weder der Erde noch dem Meer noch den Bäumen Schaden zu, bis wir die Sklaven[a] unseres Gottes an ihren Stirnen versiegelt haben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Diener“ beziehungsweise „Knechte“. Das griechische Wort bezeichnet Menschen, die einem Herrn gehören; „Sklaven“ hebt hier diese Zugehörigkeit hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das präsentische Partizip führt den Inhalt des Zurufs ein. Im Deutschen gibt die finite Form den Anschluss an die vorausgehende Handlung natürlich wieder.
- source_word: ἀδικήσητε
  choice: Schaden zufügen
  rationale: Da Erde, Meer und Bäume die Objekte sind, bezeichnet das Verb hier schädigendes Einwirken, nicht moralisches Unrecht gegenüber Personen.
- source_word: τὴν γῆν
  choice: der Erde
  rationale: In der kosmischen Dreiergruppe mit Meer und Bäumen ist „Erde“ angemessener als das räumlich begrenztere „Land“.
- source_word: τὴν θάλασσαν
  choice: dem Meer
  rationale: Direkte und im Kontext natürliche Wiedergabe.
- source_word: τὰ δένδρα
  choice: den Bäumen
  rationale: Direkte und verständliche Wiedergabe des Plurals.
- source_word: ἄχρι
  choice: bis
  rationale: 'Bezeichnet die zeitliche Grenze des Verbots: Die Schädigung soll erst nach der Versiegelung einsetzen dürfen.'
- source_word: σφραγίσωμεν
  choice: wir … versiegelt haben
  rationale: Das Perfekt nach „bis“ drückt im Deutschen natürlich aus, dass die Versiegelung vor dem folgenden Geschehen abgeschlossen sein soll.
- source_word: τοὺς δούλους
  choice: die Sklaven
  rationale: „Sklaven“ bewahrt den im Kontext hervortretenden Gedanken der Zugehörigkeit zu einem Herrn deutlicher als „Diener“. Eine geläufigere traditionelle Alternative wird in der Fußnote genannt.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: unseres Gottes
  rationale: Die Genitivverbindung bezeichnet die Zugehörigkeit zu Gott; „unseres“ wird entsprechend dem griechischen Text beibehalten.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: an ihren Stirnen
  rationale: Natürliche deutsche Ortsangabe für das Anbringen des Siegels; „an“ beschreibt die Markierung auf der Stirn idiomatisch.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Kontext von Zugehörigkeit und Versiegelung
  choice: Sklaven
  alternative: Diener oder Knechte
  rationale: Die Versiegelung kennzeichnet Menschen als Gott zugehörig. „Sklaven“ erhält diese starke Besitz- und Bindungsdimension, ohne sie durch eine konfessionelle Deutung weiter auszulegen; die sprachlich milderen Alternativen werden offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Konstruktion „weder … noch … noch“ bewahrt die eindringliche Dreierfolge des Ausgangstextes. „Sklaven“ ist bewusst stark und wird wegen möglicher heutiger Verständnisschwierigkeiten durch eine Fußnote erläutert.
