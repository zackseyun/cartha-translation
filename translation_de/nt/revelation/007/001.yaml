id: REV.7.1
reference: Revelation 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: de
  text: Danach sah ich vier Engel an den vier Ecken der Erde[a] stehen. Sie hielten die vier Winde der Erde zurück, damit kein Wind über die Erde, über das Meer oder über irgendeinen Baum wehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Die vier Ecken der Erde« ist eine traditionelle Bildwendung für die äußersten Bereiche der Erde beziehungsweise die vier Himmelsrichtungen.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Danach
  rationale: Natürlicher deutscher Zeit- und Gliederungsmarker, der die Abfolge der Vision wahrt; wörtlicher wäre »Nach diesem«.
- source_word: εἶδον
  choice: sah ich
  rationale: Gibt die visionäre Wahrnehmung direkt wieder, ohne das griechische Verb unnötig zu erweitern.
- source_word: τέσσαρας ἀγγέλους
  choice: vier Engel
  rationale: Direkte und eindeutige Wiedergabe von Zahlwort und Substantiv.
- source_word: ἑστῶτας
  choice: stehen
  rationale: Das Partizip bezeichnet den bestehenden Zustand des Stehens; »aufgestellt« wäre stärker deutend.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: an den vier Enden der Erde
  rationale: Bewahrt das konventionelle kosmische Bild, klingt im heutigen Deutschen jedoch natürlicher als »auf den vier Ecken der Erde«.
- source_word: κρατοῦντας
  choice: hielten … zurück
  rationale: Der folgende Zwecksatz zeigt, dass die Winde am Wehen gehindert werden; daher ist die Bedeutung des Zurückhaltens kontextuell angemessen.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: die vier Winde der Erde
  rationale: Bewahrt die apokalyptische Vorstellung von den Winden aus den vier Richtungen und den kosmischen Umfang.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: damit kein Wind … wehe
  rationale: »Damit« bildet den Zweck des griechischen ἵνα-Satzes ab; der Konjunktiv »wehe« entspricht dem gehobenen, aber verständlichen Erzählregister.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: über die Erde, über das Meer oder über irgendeinen Baum
  rationale: Unter der vorausgehenden Verneinung gibt die dreifache deutsche Oder-Verbindung die koordinierten μήτε-Glieder natürlich wieder; πᾶν ist distributiv als »irgendeinen« gefasst.
theological_decisions:
- issue: Bedeutungsumfang von γῆ in der apokalyptischen Vision
  choice: durchgehend »Erde«
  alternative: »Land«
  rationale: Vier Enden, vier Winde sowie die Gegenüberstellung von Erde, Meer und Bäumen weisen auf eine kosmische Szenerie; »Land« würde den Umfang unnötig verengen.
- issue: Kosmologische Bildsprache der vier γωνίαι der Erde
  choice: »vier Enden der Erde« mit erklärender Fußnote
  alternative: »vier Ecken der Erde«
  rationale: Die konventionelle Vorstellung der äußersten Bereiche beziehungsweise vier Himmelsrichtungen bleibt erhalten, ohne die Wendung als naturwissenschaftliche Beschreibung zu behandeln. »Enden« ist im modernen Deutschen idiomatischer, während die Fußnote das zugrunde liegende Bild transparent macht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Ton. Die Satzteilung entlastet den langen griechischen Satz, ohne seine inhaltlichen Beziehungen zu verändern. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Wendung.
