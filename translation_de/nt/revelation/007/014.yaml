id: REV.7.14
reference: Revelation 7:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: de
  text: 'Und ich sagte zu ihm: „Mein Herr, du weißt es.“ Da sagte er zu mir: „Das sind die, die aus der großen Bedrängnis[a] kommen. Sie haben ihre Gewänder gewaschen und sie im Blut des Lammes[b] weiß gemacht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „aus der großen Drangsal“ beziehungsweise „aus der großen Not“. Das griechische Wort kann Bedrängnis, Leidensdruck oder schwere Not bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung „im Blut des Lammes“ ist bewusst beibehalten. Das Griechische kann auch instrumental als „durch das Blut“ verstanden werden; die Übersetzung wahrt jedoch das paradoxe Reinigungsbild der Offenbarung.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: ich sagte
  rationale: Obwohl die Form ein Perfekt ist, dient sie hier in der johanneischen Erzählung als Einleitung einer Antwort. Das deutsche Präteritum gibt den erzählerischen Zusammenhang natürlich wieder.
- source_word: Κύριέ μου
  choice: Mein Herr
  rationale: Johannes redet einen der Ältesten an, nicht ausdrücklich Gott oder Christus. „Mein Herr“ bewahrt die ehrerbietige Anrede, ohne den Angeredeten mit dem göttlichen Herrn gleichzusetzen.
- source_word: σὺ οἶδας
  choice: du weißt es
  rationale: Das ausdrücklich gesetzte Pronomen trägt eine leichte Betonung. Im Deutschen bringt „du weißt es“ die ehrerbietige Anerkennung des Wissens des Ältesten natürlich zum Ausdruck.
- source_word: οἱ ἐρχόμενοι
  choice: die … kommen
  rationale: Das substantivierte Präsenspartizip bezeichnet die Menschen, die herauskommen. Die präsentische Form wahrt den fortdauernden oder charakteristischen Aspekt, ohne ihn in eine abgeschlossene Vergangenheit umzudeuten.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: aus der großen Bedrängnis
  rationale: „Bedrängnis“ ist eine verständliche, würdige Wiedergabe von θλῖψις und lässt offen, ob eine bestimmte endzeitliche Not oder umfassenderes Leiden gemeint ist.
- source_word: ἔπλυναν
  choice: haben … gewaschen
  rationale: Das Perfekt ist im deutschen direkten Redekontext idiomatisch und stellt die im griechischen Aorist als Ganzes betrachtete, vollzogene Handlung klar dar.
- source_word: στολάς
  choice: Gewänder
  rationale: στολή bezeichnet ein langes oder festliches Gewand. „Gewänder“ passt zur erhöhten Bildsprache der Offenbarung und ist im modernen Deutsch geläufig.
- source_word: ἐλεύκαναν
  choice: weiß gemacht
  rationale: Die Formulierung bewahrt den kausativen Sinn des Verbs und ist klarer und natürlicher als „geweißt“.
- source_word: ἐν τῷ αἵματι
  choice: im Blut
  rationale: Die örtlich formulierte Wiedergabe bewahrt das absichtliche paradoxe Bild der Reinigung im Blut. Eine instrumentale Deutung mit „durch“ bleibt möglich, wird aber nicht in den Haupttext eingetragen.
- source_word: τοῦ ἀρνίου
  choice: des Lammes
  rationale: In der Offenbarung ist das Lamm eine christologische Bezeichnung. Die Großschreibung kennzeichnet den Titelgebrauch entsprechend der deutschen Orthografie.
theological_decisions:
- issue: Anrede κύριος an den Ältesten
  choice: Mein Herr
  alternative: Herr; mein Gebieter
  rationale: Die ehrerbietige Anrede wird bewahrt, ohne dem Ältesten durch die Übersetzung ausdrücklich göttliche oder christologische Identität zuzuschreiben.
- issue: Bedeutungsumfang der großen θλῖψις
  choice: die große Bedrängnis
  alternative: die große Drangsal; die große Not
  rationale: Die Übersetzung bleibt lexikalisch und legt nicht fest, ob die Wendung ausschließlich eine besondere endzeitliche Periode, das Leiden der Glaubenden allgemein oder beides bezeichnet.
- issue: Funktion von ἐν beim Blut des Lammes
  choice: im Blut des Lammes
  alternative: durch das Blut des Lammes; mit dem Blut des Lammes
  rationale: „Im Blut“ erhält die auffällige und theologisch spannungsreiche Bildsprache des griechischen Textes, statt sie durch eine rein instrumentale Formulierung aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Satzbau folgt der direkten Rede des Ausgangstextes, ohne unnatürliche griechische Strukturen nachzuahmen. Die Bezeichnung „Bedrängnis“ vermeidet sowohl veraltete Sprache als auch eine konfessionell festgelegte endzeitduino Deutung.
