revisions:
- from: 'Und ich sah einen anderen Engel vom Osten heraufkommen,[a] der das Siegel des lebendigen Gottes hatte. Er rief den vier Engeln, denen gegeben worden war, der Erde und dem Meer Schaden zuzufügen, mit lauter Stimme zu:'
  to: 'Und ich sah einen anderen Engel vom Osten heraufkommen,[a] der das Siegel des lebendigen Gottes hatte, und rief den vier Engeln, denen es gegeben worden war, der Erde und dem Meer Schaden zuzufügen, mit lauter Stimme zu:'
  rationale: Die Revision ist rein stilistisch-syntaktisch. Sie bewahrt die Aussage, Ambiguität und den abschließenden Doppelpunkt des Ausgangstextes, bindet die Handlungen des Engels aber enger zusammen und ergänzt bei der deutschen unpersönlichen Passivkonstruktion das erforderliche „es“.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die wesentlichen Elemente des griechischen Textes: einen weiteren Engel, sein Heraufkommen aus dem Osten, das Siegel des lebendigen Gottes, den lauten Zuruf und die den vier Engeln erteilte Befugnis, Erde und Meer zu schädigen. Die unpersönlich-passive Formulierung bei ἐδόθη bleibt angemessen offen. Eine geringfügige syntaktische Glättung stellt jedoch die enge griechische Verknüpfung der Handlungen klarer her und macht das unpersönliche „es wurde gegeben“ im Deutschen vollständig.'
  naturalness: „Und ich sah …, der … hatte. Er rief …“ ist verständlich, aber die Satzteilung schwächt unnötig die koordinierte Struktur des griechischen Satzes. Die Fassung mit „und rief“ ist flüssiger und bewahrt den fortlaufenden Visionserzählstil. „denen es gegeben worden war“ ist im Deutschen vollständiger und natürlicher als eine Tilgung des unpersönlichen Subjekts.
  terminology: „Siegel des lebendigen Gottes“, „Schaden zufügen“, „Erde und Meer“ und „mit lauter Stimme“ sind präzise, idiomatische und registergerechte Wiedergaben. Die Fußnote gibt die Bildform der Richtungsangabe korrekt wieder. Es besteht kein Anlass, „gegeben“ zu „Macht“ oder „Erlaubnis“ auszudeuten.
  issues:
  - severity: low
    issue: Satzteilung und implizites unpersönliches Subjekt
    rationale: Die Satzteilung vor „Er rief“ ist nicht falsch, aber die griechische Koordination wird besser mit „und rief“ wiedergegeben. Bei „denen gegeben worden war“ ist das im Deutschen naheliegende unpersönliche „es“ elliptisch; seine Ergänzung erhöht Klarheit, ohne einen Gegenstand wie „Macht“ hinzuzufügen.
  revised_text: 'Und ich sah einen anderen Engel vom Osten heraufkommen,[a] der das Siegel des lebendigen Gottes hatte, und rief den vier Engeln, denen es gegeben worden war, der Erde und dem Meer Schaden zuzufügen, mit lauter Stimme zu:'
