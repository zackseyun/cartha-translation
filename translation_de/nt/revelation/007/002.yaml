source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: de
  text: 'Und ich sah einen anderen Engel vom Osten heraufkommen,[a] der das Siegel des lebendigen Gottes hatte, und rief den vier Engeln, denen es gegeben worden war, der Erde und dem Meer Schaden zuzufügen, mit lauter Stimme zu:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Aufgang der Sonne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: einen anderen Engel
  rationale: ἄλλον bezeichnet einen weiteren, von den zuvor genannten Engeln unterschiedenen Engel; die deutsche Wendung ist natürlich und genau.
- source_word: ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου
  choice: vom Osten heraufkommen
  rationale: Das Partizip bezeichnet eine Aufwärtsbewegung; die Richtungsangabe meint idiomatisch den Osten. Die wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: ἔχοντα σφραγῖδα θεοῦ ζῶντος
  choice: der das Siegel des lebendigen Gottes hatte
  rationale: ἔχοντα bedeutet zunächst „haben“; „Siegel“ bewahrt das konkrete Bild, ohne dessen Funktion näher festzulegen.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: Er rief … mit lauter Stimme zu
  rationale: κράζω bezeichnet einen kräftigen Ruf; zusammen mit dem Dativ φωνῇ μεγάλῃ wird die Lautstärke ausdrücklich wiedergegeben.
- source_word: οἷς ἐδόθη αὐτοῖς ἀδικῆσαι
  choice: denen gegeben worden war, … Schaden zuzufügen
  rationale: Die unpersönliche Passivform und die nicht ausdrücklich genannte Instanz des Gebens bleiben erhalten; anders als „Macht gegeben“ fügt die Übersetzung kein Substantiv hinzu.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: der Erde und dem Meer
  rationale: Im kosmischen Zusammenhang der Offenbarung ist „Erde“ für γῆ passend; die deutsche Kasusform folgt der Wendung „Schaden zufügen“.
theological_decisions:
- issue: Umfang und Art der übertragenen Befugnis in ἐδόθη
  choice: „denen gegeben worden war, … Schaden zuzufügen“
  alternative: „denen Macht gegeben worden war“ / „denen erlaubt worden war“
  rationale: Die gewählte Fassung spiegelt das griechische Passiv, ohne „Macht“, „Erlaubnis“ oder den Geber ausdrücklich einzutragen, und bewahrt damit die offene Formulierung.
- issue: Richtungsangabe ἀπὸ ἀνατολῆς ἡλίου
  choice: „vom Osten“ im Haupttext
  alternative: „vom Aufgang der Sonne“
  rationale: „Vom Osten“ vermittelt die idiomatische Richtungsbedeutung; die wörtliche Bildgestalt bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der abschließende Doppelpunkt macht kenntlich, dass der in Vers 3 folgende Zuruf eingeleitet wird; er fügt keinen Inhalt hinzu.
