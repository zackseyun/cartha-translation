id: REV.7.10
reference: Revelation 7:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: de
  text: 'Und sie rufen mit lauter Stimme: »Die Rettung gehört unserem Gott, der auf dem Thron sitzt, und dem Lamm!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Die Rettung unserem Gott, der auf dem Thron sitzt, und dem Lamm!«'
    reason: Die griechische Akklamation ist ohne ausgesprochenes Verb formuliert; »gehört« verdeutlicht im Haupttext die naheliegende Zuordnung durch den Dativ.
lexical_decisions:
- source_word: κράζουσι
  choice: sie rufen
  rationale: Das Präsens schildert die Szene lebendig; »rufen« gibt die nachdrückliche, öffentliche Äußerung natürlich wieder.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die Dativfügung bezeichnet die Art und Weise und bewahrt mit dieser Wiedergabe das Bild der Stimme.
- source_word: λέγοντες
  choice: Doppelpunkt vor der direkten Rede
  rationale: Das Partizip führt den Inhalt des Rufens ein; im natürlichen Deutschen erfüllt der Doppelpunkt diese Funktion, ohne das schwerfällige »indem sie sagen«.
- source_word: Ἡ σωτηρία
  choice: Die Rettung gehört
  rationale: Die verblose Akklamation mit den folgenden Dativen schreibt die Rettung Gott und dem Lamm zu. »Rettung« ist gegenwärtiges Standarddeutsch und lässt sowohl den Vorgang als auch das Heilsergebnis offen.
- source_word: τῷ θεῷ ἡμῶν
  choice: unserem Gott
  rationale: Der Dativ bezeichnet den, dem die Rettung zugeschrieben wird; zusammen mit »gehört« ist dies idiomatisches Deutsch.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: der auf dem Thron sitzt
  rationale: Der substantivierte Partizipialausdruck wird als Relativsatz auf »unserem Gott« bezogen und bewahrt die anschauliche Gegenwart der Szene.
- source_word: τῷ ἀρνίῳ
  choice: dem Lamm
  rationale: »Lamm« bewahrt den etablierten johanneischen Titel und seine Opfer- und Messiasmetaphorik.
theological_decisions:
- issue: Zuordnung der Rettung zu Gott und dem Lamm
  choice: »Die Rettung gehört unserem Gott … und dem Lamm« als gemeinsame Akklamation
  alternative: »Die Rettung sei bei/unserem Gott … und dem Lamm« oder wörtlicher »Die Rettung unserem Gott … und dem Lamm«
  rationale: Die Wiedergabe schreibt die Rettung gemeinsam Gott und dem Lamm zu, ohne die genaue Art dieser Zuordnung dogmatisch weiter zu bestimmen. So bleiben die hohe christologische Aussage und der liturgische Charakter erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Mit lauter Stimme« erhält die feierliche Bildhaftigkeit; der Doppelpunkt macht das im Deutschen entbehrliche Redepartizip knapp und natürlich. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Ausruf.
