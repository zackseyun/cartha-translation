id: REV.7.16
reference: Revelation 7:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: de
  text: Sie werden nicht mehr hungern und nicht mehr dürsten; weder die Sonne noch irgendeine sengende Hitze wird sie je treffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird auf sie fallen“. Die griechische Verneinung ist besonders nachdrücklich: „wird sie keinesfalls treffen“.'
    reason: Die Fußnote bewahrt das griechische Bild von πέσῃ ἐπ’ αὐτούς und macht zugleich die emphatische Verneinung οὐδὲ μή sichtbar.
lexical_decisions:
- source_word: πεινάσουσιν
  choice: sie werden hungern
  rationale: Die verbale Wiedergabe entspricht dem Futur von πεινάω und bildet einen natürlichen Parallelismus mit „dürsten“.
- source_word: ἔτι
  choice: nicht mehr
  rationale: In Verbindung mit der Verneinung bezeichnet ἔτι das endgültige Aufhören von Hunger und Durst.
- source_word: διψήσουσιν
  choice: sie werden dürsten
  rationale: Die verbale Form wahrt den Parallelismus und gibt das Futur von διψάω direkt wieder.
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτούς
  choice: wird sie je treffen
  rationale: Im Rahmen von „weder … noch“ drückt „je“ die nachdrückliche zukünftige Verneinung aus; „treffen“ gibt das Bild des auf jemanden Fallens in natürlichem Deutsch wieder.
- source_word: ὁ ἥλιος
  choice: die Sonne
  rationale: Direkte und eindeutige Wiedergabe.
- source_word: πᾶν καῦμα
  choice: irgendeine sengende Hitze
  rationale: „Sengende Hitze“ erfasst die brennende, versengende Bedeutung von καῦμα; „irgendeine“ bewahrt unter der Verneinung die umfassende Kraft von πᾶν.
theological_decisions:
- issue: Anspielung auf Jesaja 49,10 und die endzeitliche Wiederherstellung
  choice: Die konkreten Bilder von Hunger, Durst, Sonne und sengender Hitze bleiben erhalten.
  alternative: Hunger und Durst ausdrücklich als geistliches Verlangen deuten.
  rationale: Der Wortlaut greift die Bildsprache der prophetischen Wiederherstellungsverheißung auf. Die Übersetzung lässt deren theologische Tragweite offen, ohne die konkreten Bilder vorschnell zu vergeistlichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau ist klar und gut vorlesbar; „weder … noch“ bündelt Sonne und sengende Hitze natürlich, während „je“ die Endgültigkeit der Verheißung hervorhebt.
