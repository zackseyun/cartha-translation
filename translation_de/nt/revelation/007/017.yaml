id: REV.7.17
reference: Revelation 7:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: de
  text: Denn das Lamm in der Mitte des Thrones[a] wird sie weiden und sie zu Quellen des Lebenswassers führen[b]. Und Gott wird jede Träne von ihren Augen abwischen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Zentrum des Thrones.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: zu Quellen lebendigen Wassers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: das Lamm
  rationale: Die etablierte deutsche Wiedergabe bewahrt den christologischen Titel und seine Opfer- und Messiasbezüge, ohne die Verkleinerungsform unpassend hervorzuheben.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: in der Mitte des Thrones
  rationale: Die Formulierung erhält die anschauliche zentrale Stellung des Lammes; die räumliche Beziehung zum Thron bleibt im Griechischen ungewöhnlich und wird daher in einer Fußnote alternativ wiedergegeben.
- source_word: ποιμανεῖ
  choice: wird sie weiden
  rationale: „Weiden“ bewahrt das Hirtenbild und insbesondere das beabsichtigte Paradox, dass das Lamm selbst als Hirte handelt. „Beherrschen“ würde den fürsorglichen Zusammenhang mit den Wasserquellen abschwächen.
- source_word: ὁδηγήσει
  choice: wird … führen
  rationale: „Führen“ ist im Deutschen eine natürliche Entsprechung für das zielgerichtete Geleiten und passt zum Hirtenbild, ohne den Sinn unnötig auszudeuten.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: zu Quellen mit Wasser des Lebens
  rationale: Diese Fassung verbindet „des Lebens“ vorrangig mit dem Wasser und gibt die Bewegungsrichtung idiomatisch mit „zu“ wieder. Zugleich vermeidet sie die schwerfällige Kette „Quellen des Wassers des Lebens“.
- source_word: ἐξαλείψει
  choice: wird … abwischen
  rationale: Im tröstenden Zusammenhang gibt „abwischen“ die konkrete, fürsorgliche Bildsprache natürlich wieder; „auslöschen“ wäre hier zu abstrakt.
- source_word: πᾶν δάκρυον
  choice: jede Träne
  rationale: Der distributive Singular betont anschaulich die vollständige Beseitigung allen Leids.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: von ihren Augen
  rationale: Dies ist die natürliche deutsche Wiedergabe der Ausgangsbeziehung und bewahrt das körperlich-konkrete Bild.
theological_decisions:
- issue: 'Christologisches Paradox: Das Lamm handelt als Hirte'
  choice: „das Lamm … wird sie weiden“
  alternative: „das Lamm … wird für sie sorgen“ oder „wird über sie herrschen“
  rationale: Die konkrete Hirtenmetapher und das für die Offenbarung charakteristische Zusammenspiel von Lamm und Hirte sollen nicht durch eine allgemeinere Fürsorge- oder Herrschaftsaussage eingeebnet werden.
- issue: Gott als ausdrücklich genanntes Subjekt des letzten Satzes
  choice: „Und Gott wird jede Träne von ihren Augen abwischen“
  alternative: Fortführung des Lammes als unausgesprochenes Subjekt
  rationale: Das Griechische nennt ausdrücklich ὁ θεός. Der eigenständige Satz erhält diesen Subjektwechsel, ohne das Verhältnis zwischen Gott und dem Lamm weitergehend zu erklären.
- issue: Bezug des Genitivs ζωῆς
  choice: „Wasser des Lebens“
  alternative: „lebendiges Wasser“
  rationale: Die Wortstellung und der Sprachgebrauch der Offenbarung stützen die Deutung als lebenspendendes beziehungsweise zum Leben gehörendes Wasser; die alternative qualitative Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weiden“ ist bewusst leicht bibelsprachlich, bleibt aber verständlich und erhält das zentrale Hirtenbild. Die Satzteilung vor „Und Gott“ macht den im Griechischen ausdrücklich markierten Subjektwechsel klar.
