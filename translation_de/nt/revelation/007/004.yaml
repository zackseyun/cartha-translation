id: REV.7.4
reference: Revelation 7:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: de
  text: 'Und ich hörte die Zahl der Versiegelten: 144.000, versiegelt aus jedem Stamm der Söhne Israels[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Kinder Israels«. Wörtlich steht im Griechischen »der Söhne Israels«; damit bleibt die maskuline genealogische Ausdrucksweise erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: ich hörte
  rationale: Der Aorist von ἀκούω bezeichnet hier im berichtenden Zusammenhang schlicht das Hören.
- source_word: τὸν ἀριθμὸν
  choice: die Zahl
  rationale: ἀριθμός meint hier die zahlenmäßige Gesamtangabe der versiegelten Gruppe; »die Zahl« ist die natürliche deutsche Entsprechung.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: der Versiegelten / versiegelt
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Versiegelung mit fortbestehendem Ergebnis. Die substantivierte Form »der Versiegelten« und die anschließende Wiederholung »versiegelt« bewahren sowohl Zustand als auch Wiederaufnahme.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: '144.000'
  rationale: Die Ziffernschreibweise ist im modernen Deutschen klar und idiomatisch und gibt den exakten Zahlenwert wieder.
- source_word: ἐκ
  choice: aus
  rationale: ἐκ kennzeichnet Herkunft beziehungsweise Auswahl aus einer Gruppe; »aus« ist hier die direkte und natürliche deutsche Wiedergabe.
- source_word: πάσης φυλῆς
  choice: jedem Stamm
  rationale: 'Der Singular mit πᾶς ist distributiv: Die Versiegelten stammen aus jedem einzelnen Stamm.'
- source_word: υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  rationale: Die Formulierung wahrt den ausdrücklich maskulinen, genealogischen Wortlaut des Griechischen und den Anklang an die biblische Stammessprache.
theological_decisions:
- issue: Wiedergabe von υἱῶν Ἰσραήλ im Zusammenhang der Stammesliste
  choice: der Söhne Israels
  alternative: der Kinder Israels
  rationale: »Söhne Israels« erhält die maskuline genealogische Ausdrucksweise des Ausgangstextes, ohne eine bestimmte endzeitliche Deutung der Gruppe festzulegen. »Kinder Israels« ist eine traditionsreiche und mögliche idiomatische Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und die Wiederholung von »versiegelt« folgen dem griechischen Text. Der Fußnotenmarker steht unmittelbar nach der betreffenden Wendung.
