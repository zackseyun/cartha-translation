translation:
  language: de
  text: aus dem Stamm Sebulon zwölftausend, aus dem Stamm Josef zwölftausend, aus dem Stamm Benjamin zwölftausend, versiegelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die versiegelt worden sind“ oder „die versiegelt waren“. Das griechische perfekte Passivpartizip am Ende fasst die aufgezählten Gruppen zusammen und bezeichnet sie als versiegelt.'
    reason: lexikalische und grammatische Alternative
lexical_decisions:
- source_word: ἐκ
  choice: aus
  rationale: Kennzeichnet in der wiederholten Listenformel die Herkunft beziehungsweise Zugehörigkeit und entspricht hier natürlichem deutschem Sprachgebrauch.
- source_word: φυλῆς
  choice: Stamm
  rationale: Bezeichnet im Zusammenhang der israelitischen Stammesliste eine Stammesgliederung; „Stamm“ ist die etablierte deutsche Entsprechung.
- source_word: Ζαβουλών
  choice: Sebulon
  rationale: Verwendet die im Deutschen übliche biblische Namensform.
- source_word: δώδεκα χιλιάδες
  choice: zwölftausend
  rationale: Gibt Zahl und formale Wiederholung des griechischen Textes unmittelbar wieder.
- source_word: Ἰωσήφ
  choice: Josef
  rationale: Bewahrt ausdrücklich den im Text genannten Namen „Josef“, ohne ihn als Ephraim oder Manasse zu deuten.
- source_word: Βενιαμίν
  choice: Benjamin
  rationale: Verwendet die im Deutschen übliche biblische Namensform.
- source_word: ἐσφραγισμένοι
  choice: die versiegelt worden waren
  rationale: Gibt das perfektische passive Partizip als abschließende Zusammenfassung der aufgezählten Gruppen wieder und wahrt sowohl Passiv als auch resultativen Vorzeitigkeitssinn.
theological_decisions:
- issue: Bezug und Aussagekraft des abschließenden Partizips ἐσφραγισμένοι
  choice: 'Als abschließenden Relativsatz wiedergeben, der die aufgezählten Angehörigen aller drei Stämme zusammenfassend beschreibt: „die versiegelt worden waren“.'
  alternative: „versiegelt“ oder „die versiegelt wurden“
  rationale: Die Endstellung und der zusammenfassende Bezug bleiben erhalten. Die Übersetzung benennt weder Art noch theologische Bedeutung der Versiegelung und vermeidet so eine über den Wortlaut hinausgehende Festlegung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die anaphorische Listenstruktur und die Endstellung der zusammenfassenden Versiegelungsaussage werden bewahrt; ein Semikolon wurde nicht ergänzt, da der griechische Text eine fortlaufende Aufzählung bietet.
