review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Sprecher, Adressaten, die Gruppe in weißen Gewändern sowie die beiden Fragen zutreffend wieder. »wandte sich ... an mich und sagte« schwächt jedoch ἀπεκρίθη („antwortete“) zu einer bloßen Gesprächseröffnung ab. Da das Verb im Griechischen ausdrücklich steht, sollte es auch im Deutschen erkennbar bleiben.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. »Da antwortete einer der Ältesten und sagte zu mir« ist trotz der narrativen Doppelung idiomatisch im biblisch-literarischen Register und bildet die griechische Konstruktion angemessener ab.
  terminology: »Älteste« und »weiße Gewänder« sind für die etablierte Bildsprache der Offenbarung passend. »Woher sind sie gekommen?« gibt πόθεν ἦλθον präzise und natürlich wieder.
  issues:
  - severity: low
    issue: ἀπεκρίθη wird nicht als „antwortete“ wiedergegeben.
    rationale: »Sich an jemanden wenden« kann zwar einen Redebeginn bezeichnen, enthält aber nicht die vom griechischen Verb ausgedrückte Antworthandlung. Die explizite Wiedergabe wahrt die Quelle ohne die Aussage zu verändern.
  revised_text: 'Da antwortete einer der Ältesten und sagte zu mir: »Wer sind diese, die mit den weißen Gewändern bekleidet sind, und woher sind sie gekommen?«'
