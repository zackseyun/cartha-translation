id: REV.7.13
reference: Revelation 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: de
  text: 'Da antwortete einer der Ältesten und sagte zu mir: »Wer sind diese, die mit den weißen Gewändern bekleidet sind, und woher sind sie gekommen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Da
  rationale: Der Anschluss führt die Vision erzählerisch weiter; »Da« ist im Deutschen natürlich und bewahrt die Abfolge.
- source_word: ἀπεκρίθη … λέγων μοι
  choice: wandte sich … an mich und sagte
  rationale: ἀποκρίνομαι kann auch ohne unmittelbar vorausgehende Frage eine einsetzende Äußerung bezeichnen. Die deutsche Wendung gibt den Redebeginn samt Adressaten natürlich wieder, ohne eine nicht genannte Frage vorauszusetzen.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: einer der Ältesten
  rationale: Natürliche Wiedergabe der partitiven Konstruktion und der in der Offenbarung etablierten Personengruppe.
- source_word: οἱ περιβεβλημένοι
  choice: die … bekleidet sind
  rationale: Das Perfektpartizip bezeichnet den gegenwärtigen Zustand als Ergebnis des Bekleidens; »bekleidet sind« wahrt diesen Zustandsaspekt.
- source_word: τὰς στολὰς τὰς λευκάς
  choice: mit den weißen Gewändern
  rationale: στολή bezeichnet ein langes oder festliches Gewand. »Gewänder« ist würdig, verständlich und hält die Bildsprache offen, ohne die Form unnötig auf »Roben« festzulegen.
- source_word: τίνες εἰσὶν
  choice: Wer sind diese
  rationale: Die deutsche Frage greift das vorangestellte Demonstrativpronomen direkt und idiomatisch auf.
- source_word: πόθεν ἦλθον
  choice: woher sind sie gekommen
  rationale: »Woher« bildet die Herkunftsfrage präzise ab; das deutsche Perfekt ist in gegenwärtiger Erzähl- und Redeweise natürlich und bezeichnet die für die Szene relevante Ankunft.
theological_decisions:
- issue: Zeitliche Wiedergabe von ἦλθον
  choice: »woher sind sie gekommen?«
  alternative: »woher kamen sie?«
  rationale: Der griechische Aorist blickt auf das Kommen als Ganzes. Das deutsche Perfekt ist in direkter Rede natürlich und wahrt den Gegenwartsbezug der nun sichtbaren Gruppe; die Alternative mit Präteritum bleibt sprachlich möglich, trägt aber keine andere theologische Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas formelle Wendung »mit den weißen Gewändern bekleidet« bewahrt den Zustandsaspekt und die feierliche Bildsprache der Offenbarung. Keine Fußnote ist nötig, da die Tempusalternative im Deutschen keine für Leser wesentliche Bedeutungsdifferenz erzeugt.
