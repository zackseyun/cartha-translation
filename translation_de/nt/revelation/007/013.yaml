revisions:
- from: 'Da wandte sich einer der Ältesten an mich und sagte: »Wer sind diese, die mit den weißen Gewändern bekleidet sind, und woher sind sie gekommen?«'
  to: 'Da antwortete einer der Ältesten und sagte zu mir: »Wer sind diese, die mit den weißen Gewändern bekleidet sind, und woher sind sie gekommen?«'
  rationale: Die Revision ersetzt die abschwächende Umschreibung des griechischen ἀπεκρίθη durch »antwortete« und erhält mit »und sagte zu mir« die anschließende Partizipialkonstruktion λέγων μοι. Alle übrigen Formulierungen bleiben erhalten, da sie den griechischen Wortlaut, die Bildsprache und den modernen deutschen Registeranspruch zuverlässig wiedergeben.
