revisions:
- from: 'Da kam die Erde der Frau zu Hilfe[a]: Die Erde öffnete ihren Mund und verschlang den Fluss, den der Drache aus seinem Mund ausgestoßen hatte.[b]'
  to: Und die Erde kam der Frau zu Hilfe, und die Erde öffnete ihren Mund und verschlang den Fluss, den der Drache aus seinem Mund ausgestoßen hatte.[a][b]
  rationale: Die Revision ersetzt das potenziell temporal deutende »Da« durch das dem griechischen καί entsprechende »Und« und bewahrt die koordinierende Satzfolge. Fußnotenanker a und b stehen jeweils bei der betreffenden Übersetzungseinheit. Fußnote b wird syntaktisch vervollständigt; die lexikalischen Alternativen und die Bedeutung des Verses bleiben unverändert.
