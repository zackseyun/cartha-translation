source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: de
  text: Und die Erde kam der Frau zu Hilfe, und die Erde öffnete ihren Mund und verschlang den Fluss, den der Drache aus seinem Mund ausgestoßen hatte.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Land kam der Frau zu Hilfe«. Das griechische Wort kann »Erde«, »Land« oder »Boden« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »den der Drache aus seinem Mund geworfen hatte« oder »den der Drache aus seinem Mund ausgesandt hatte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: kam ... zu Hilfe
  rationale: βοηθέω bezeichnet hier, jemandem zu helfen oder zu Hilfe zu kommen. Die gewählte Wendung ist im modernen Deutsch natürlich und bewahrt die erzählerische Bewegung.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: γῆ kann »Erde«, »Land« oder »Boden« bedeuten. Im kosmisch-apokalyptischen Bildzusammenhang ist »Erde« am naheliegendsten; die mögliche Bedeutung »Land« bleibt in einer Fußnote sichtbar.
- source_word: τῇ γυναικί
  choice: der Frau
  rationale: Direkte Wiedergabe des bestimmten Dativobjekts; die symbolische Gestalt wird nicht näher gedeutet.
- source_word: ἤνοιξεν ... τὸ στόμα αὐτῆς
  choice: öffnete ihren Mund
  rationale: Das feminine Pronomen entspricht dem grammatischen Geschlecht von γῆ und lässt sich im Deutschen mit »die Erde« natürlich wiedergeben; zugleich bleibt die Personifikation erhalten.
- source_word: κατέπιεν
  choice: verschlang
  rationale: καταπίνω bedeutet »hinunterschlucken, verschlingen«. »Verschlang« ist bildkräftig und im Zusammenhang mit dem personifizierten Mund der Erde idiomatisch.
- source_word: τὸν ποταμόν
  choice: den Fluss
  rationale: ποταμός bedeutet gewöhnlich »Fluss«. »Flut« oder »Strom« würden die Bildsprache stärker auslegen.
- source_word: ὃν ἔβαλεν
  choice: den ... ausgestoßen hatte
  rationale: βάλλω hat ein breites Spektrum von »werfen« bis »hervorbringen/aussenden«. In Verbindung mit »aus seinem Mund« gibt »ausgestoßen« den gewaltsamen Vorgang natürlich wieder; wörtlichere Alternativen werden in der Fußnote genannt.
- source_word: ὁ δράκων
  choice: der Drache
  rationale: Entspricht dem etablierten apokalyptischen Bild von δράκων, ohne es umzudeuten.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: aus seinem Mund
  rationale: Direkte und idiomatische Wiedergabe der Herkunftsangabe.
theological_decisions:
- issue: Personifikation der Erde in der apokalyptischen Bildsprache
  choice: Die Erde handelt als personifizierte Größe und öffnet »ihren Mund«.
  alternative: Die Erde als menschliche Bevölkerung, bestimmtes Gebiet oder Mittel göttlicher Bewahrung auslegen.
  rationale: Der griechische Text bietet das Bild ohne allegorische Erklärung. Die Übersetzung bewahrt deshalb die Spannung und legt das Symbol nicht konfessionell fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Nennung von »die Erde« folgt der markanten Wiederholung im griechischen Text. Der Doppelpunkt bildet den engen erklärenden Anschluss des zweiten Satzteils natürlich ab.
