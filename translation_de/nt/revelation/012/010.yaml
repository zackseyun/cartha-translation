id: REV.12.10
reference: Revelation 12:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: de
  text: 'Und ich hörte eine laute Stimme im Himmel sagen: »Jetzt sind die Rettung und die Macht und das Reich unseres Gottes und die Vollmacht seines Messias[a] gekommen; denn hinabgeworfen wurde der Ankläger unserer Brüder[b], der sie Tag und Nacht vor unserem Gott anklagt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus«. Das griechische Χριστός (Christos) ist hier ein Titel und bedeutet »Gesalbter« beziehungsweise »Messias«.'
    reason: alternative_reading
  - marker: b
    text: »Brüder« kann hier die Glaubensgeschwister insgesamt bezeichnen, also Männer und Frauen.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: eine laute Stimme
  rationale: μέγας bezeichnet bei φωνή idiomatisch die Lautstärke; »laut« ist im Deutschen natürlich und präzise.
- source_word: Ἄρτι ἐγένετο
  choice: Jetzt sind … gekommen
  rationale: Ἄρτι markiert den entscheidenden gegenwärtigen Zeitpunkt; ἐγένετο bezeichnet hier das wirksame Eintreten der in der Aufzählung genannten Größen.
- source_word: ἡ σωτηρία
  choice: die Rettung
  rationale: »Rettung« gibt σωτηρία verständlich wieder und passt zum in Kapitel 12 geschilderten Sieg und Befreiungsgeschehen.
- source_word: ἡ δύναμις
  choice: die Macht
  rationale: Bezeichnet Gottes wirksam erwiesene Kraft und bleibt von ἐξουσία unterschieden.
- source_word: ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: das Reich unseres Gottes
  rationale: βασιλεία kann Herrschaft oder Reich bezeichnen; »Reich« wahrt den apokalyptisch-königlichen Sprachklang, ohne die Bedeutung auf ein Gebiet zu beschränken.
- source_word: ἡ ἐξουσία
  choice: die Vollmacht
  rationale: »Vollmacht« bezeichnet rechtmäßige Herrschaftsbefugnis und unterscheidet sich klar von δύναμις, »Macht«.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: seines Messias
  rationale: Χριστός fungiert hier als Titel für Gottes Gesalbten; »Messias« erhält diesen Titelcharakter im modernen Deutschen.
- source_word: ἐβλήθη
  choice: hinabgeworfen wurde
  rationale: Der passive Aorist schildert die vollzogene gewaltsame Entfernung; »hinabgeworfen« nimmt die räumliche Bewegung des Kontextes auf.
- source_word: ὁ κατήγωρ
  choice: der Ankläger
  rationale: Das seltene Substantiv bezeichnet jemanden, der Anklage erhebt; »Ankläger« bewahrt den gerichtlichen Hintergrund.
- source_word: ἡμέρας καὶ νυκτός
  choice: Tag und Nacht
  rationale: Die feste deutsche Wendung gibt die unablässige Anklage natürlich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Im Genitiv »seines Χριστός« steht das Wort deutlich als Herrschertitel. »Messias« vermittelt die Bedeutung »Gesalbter«, während die Fußnote die traditionelle Wiedergabe »Christus« nennt.
- issue: Geschlechtlicher Umfang von ἀδελφῶν
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die Hauptübersetzung bildet den maskulinen griechischen Ausdruck formal ab; eine Fußnote weist darauf hin, dass damit im Kontext die Glaubensgeschwister insgesamt gemeint sein können.
- issue: Aspekt und Zeitbezug von ἐβλήθη
  choice: hinabgeworfen wurde
  alternative: hinabgeworfen worden ist
  rationale: Der griechische Aorist stellt den Sturz als vollzogenes Ereignis dar. Das deutsche Präteritum bewahrt die erzählerisch-proklamatorische Kraft, ohne den Aspekt übermäßig festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem feierlichen Rhythmus der viergliedrigen Proklamation. Die wiederholten Artikel und Konjunktionen werden weitgehend bewahrt. »Hinabgeworfen wurde« ist bewusst vorangestellt, um den Nachdruck des griechischen Passivs und den dramatischen Sturz hervorzuheben.
