id: REV.12.5
reference: Revelation 12:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: de
  text: Und sie gebar einen Sohn, ein männliches Kind, das alle Völker mit eisernem Stab weiden[a] soll; und ihr Kind wurde zu Gott und zu seinem Thron entrückt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das alle Völker mit eisernem Stab regieren wird“. Das griechische Verb bedeutet wörtlich „weiden“, trägt hier aber als Anspielung auf Psalm 2 den Sinn königlicher Herrschaft.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: gebar
  rationale: Das natürliche, zugleich würdevolle deutsche Verb bewahrt das konkrete Bild der Geburt.
- source_word: υἱόν, ἄρσεν
  choice: einen Sohn, ein männliches Kind
  rationale: Die Wiedergabe beider Ausdrücke erhält die bewusste Hervorhebung und appositionelle Wiederaufnahme des Griechischen.
- source_word: μέλλει ποιμαίνειν
  choice: soll … weiden
  rationale: „Soll“ gibt die zukunftsbezogene, bestimmte Handlung von μέλλει mit Infinitiv im apokalyptischen Kontext natürlich wieder, ohne sie auf bloße zeitliche Unmittelbarkeit festzulegen.
- source_word: ποιμαίνειν
  choice: weiden
  rationale: „Weiden“ bewahrt die Hirtenmetapher von ποιμαίνω; im Psalm-2-Bezug schließt sie königliche Herrschaft ein.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: „Völker“ bezeichnet hier im Anschluss an Psalm 2 umfassend die Nationen der Welt und ist kontextuell treffender als „Heiden“.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: mit eisernem Stab
  rationale: Die Formulierung bewahrt den instrumentalen Sinn sowie das markante Bild des Psalmbezugs in natürlichem Deutsch.
- source_word: ἡρπάσθη
  choice: wurde … entrückt
  rationale: „Entrückt“ bezeichnet die plötzliche Wegnahme hinauf zu Gott; das Passiv des griechischen Verbs bleibt erhalten.
- source_word: τὸ τέκνον αὐτῆς
  choice: ihr Kind
  rationale: Die Wiedergabe als „Kind“ erhält den Wechsel vom spezifischen υἱός zum allgemeineren τέκνον.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: zu Gott und zu seinem Thron
  rationale: Die Formulierung bewahrt die Bewegung auf Gott und seinen Thron hin, ohne im Deutschen unnötig schwerfällig zu werden.
theological_decisions:
- issue: Messianischer Bezug auf Psalm 2 in ποιμαίνειν … ἐν ῥάβδῳ σιδηρᾷ
  choice: Die Hirtenmetapher „weiden“ bleibt im Haupttext erhalten; die königliche Bedeutung wird in einer Fußnote erläutert.
  alternative: alle Völker mit eisernem Stab regieren
  rationale: Der Kontext bezeichnet messianische Herrschaft, doch das griechische Verb lautet ποιμαίνω („weiden“, „als Hirte führen“). Die Übersetzung soll das Bild nicht stillschweigend durch seine Deutung ersetzen.
- issue: Bedeutung von μέλλει
  choice: „soll … weiden“
  alternative: „wird … weiden“ oder „ist im Begriff, … zu weiden“
  rationale: μέλλει kann bevorstehendes oder bestimmtes zukünftiges Handeln ausdrücken. „Soll“ wahrt hier die zukunftsbezogene Bestimmung und klingt im Deutschen natürlicher, ohne die Formulierung auf unmittelbare zeitliche Nähe zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst auffällige Doppelung „einen Sohn, ein männliches Kind“ sowie die Hirtenmetapher wurden quellennah bewahrt. Der Fußnotenmarker steht unmittelbar bei der erläuterungsbedürftigen Wendung.
