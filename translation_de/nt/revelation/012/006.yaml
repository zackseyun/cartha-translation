id: REV.12.6
reference: Revelation 12:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: de
  text: Und die Frau floh in die Wüste. Dort hat sie einen von Gott bereiteten Ort, damit man sie dort eintausendzweihundertsechzig Tage lang ernährt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen ein Verb in der dritten Person Mehrzahl ohne genanntes Subjekt: „damit sie sie dort … ernähren“. Auch möglich: „damit sie dort eintausendzweihundertsechzig Tage lang ernährt wird“.'
    reason: Die griechische Verbform ist aktiv und pluralisch, doch der Handlungsträger bleibt unbestimmt; die Fußnote macht Form und mögliche passive Wiedergabe transparent.
lexical_decisions:
- source_word: ἔφυγεν
  choice: floh
  rationale: Der Aorist von φεύγω bezeichnet Flucht oder Entkommen; „floh“ ist knapp, anschaulich und fügt keine Einzelheiten hinzu.
- source_word: ἔρημον
  choice: Wüste
  rationale: ἔρημος kann Wüste oder Einöde bezeichnen. „Wüste“ ist im Deutschen die geläufige biblische Wiedergabe, ohne zwingend eine Sandwüste vorauszusetzen.
- source_word: τόπον
  choice: einen Ort
  rationale: τόπος bedeutet hier schlicht „Ort“; der unbestimmte Sinn bleibt erhalten.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: von Gott bereiteten
  rationale: Das Perfektpartizip bezeichnet einen bereits vorbereiteten Ort; ἀπό kennzeichnet hier Gott als den Handelnden.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck- beziehungsweise Ergebnissinn von ἵνα in natürlichem modernem Deutsch wieder.
- source_word: τρέφωσιν αὐτὴν
  choice: man sie ernährt
  rationale: τρέφω bedeutet „ernähren, versorgen“. Das unpersönliche „man“ bewahrt den nicht genannten Handlungsträger der dritten Person Plural, ohne einen bestimmten Versorger einzutragen; die aktive Form bleibt sinngemäß erhalten.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: eintausendzweihundertsechzig Tage lang
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer; „Tage lang“ ist dafür natürliches Deutsch, während die ausgeschriebene Zahl zum fortlaufenden Bibeltext passt.
- source_word: ἔχει ἐκεῖ
  choice: Dort hat sie
  rationale: Die Voranstellung von „Dort“ erhält die ausdrückliche Ortsangabe ἐκεῖ, vermeidet aber die im Deutschen schwerfällige Doppelung „wo sie dort ... hat“.
theological_decisions:
- issue: Nicht genannter Handlungsträger von τρέφωσιν
  choice: 'Unbestimmt aktiv wiedergeben: „damit man sie dort ... ernährt“'
  alternative: „damit sie dort ... ernährt wird“ oder „damit sie dort von ihnen ... ernährt wird“
  rationale: Der griechische Text hat ein aktives Verb in der dritten Person Plural ohne ausdrückliches Subjekt. „Man“ wahrt die Unbestimmtheit besser als die Einfügung Gottes oder anderer bestimmter Akteure. Die passive Alternative ist idiomatisch, verdeckt jedoch die aktive Konstruktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung und „Dort hat sie“ bewahren die Ortsbetonung, ohne eine unnatürliche deutsche Redundanz zu erzeugen. „Ernährt“ bezeichnet die fortdauernde Versorgung und ist hier geläufiger als „nährt“.
