revisions:
- from: Der Frau aber wurden die beiden Flügel des großen Adlers gegeben, damit sie in die Wüste an ihren Ort fliegen konnte. Dort wird sie eine Zeit und Zeiten und eine halbe Zeit lang ernährt, fern vom Angesicht der Schlange.
  to: Und der Frau wurden die beiden Flügel des großen Adlers gegeben, damit sie in die Wüste an ihren Ort fliegen kann. Dort wird sie, fern vom Angesicht der Schlange, eine Zeit und Zeiten und eine halbe Zeit lang ernährt.
  rationale: Die Revision entfernt den nicht markierten Gegensatz bei καί und ersetzt die präteritale Modalform durch eine dem finalen Präsenskonjunktiv entsprechende deutsche Form. Die räumliche Wiederaufnahme von ὅπου … ἐκεῖ bleibt durch „Dort“ erhalten; das Passiv lässt den Ernährenden weiterhin ungenannt. Die offene Zeitformel und die konkrete Bildlichkeit von „Angesicht“ bleiben bestehen.
