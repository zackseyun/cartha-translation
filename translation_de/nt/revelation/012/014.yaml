id: REV.12.14
reference: Revelation 12:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: de
  text: Und der Frau wurden die beiden Flügel des großen Adlers gegeben, damit sie in die Wüste an ihren Ort fliegen kann. Dort wird sie, fern vom Angesicht der Schlange, eine Zeit und Zeiten und eine halbe Zeit lang ernährt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: die beiden Flügel des großen Adlers
  rationale: Gibt die bestimmte, bildhafte Formulierung des Griechischen unmittelbar wieder und bewahrt den möglichen Bezug auf alttestamentliche Adlerflügel-Motive.
- source_word: ἵνα πέτηται
  choice: damit sie … fliegen konnte
  rationale: Drückt den Zwecksatz mit einer im Deutschen natürlichen Modalform aus; das Präsens des griechischen Konjunktivs bezeichnet hier nicht zwingend die deutsche Zeitstufe.
- source_word: εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς
  choice: in die Wüste an ihren Ort
  rationale: Bewahrt beide Richtungsangaben, ohne das im Deutschen schwerfällige doppelte „in“ nachzuahmen.
- source_word: ὅπου τρέφεται ἐκεῖ
  choice: Dort wird sie … ernährt
  rationale: Das räumliche Element von ὅπου … ἐκεῖ bleibt durch „Dort“ erhalten; das Passiv lässt den Ernährenden wie im Ausgangstext ungenannt.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: eine Zeit und Zeiten und eine halbe Zeit lang
  rationale: Bewahrt die eigentümliche und auslegungsbedürftige Zeitformel, statt sie rechnerisch als dreieinhalb Jahre festzulegen.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: fern vom Angesicht der Schlange
  rationale: Erhält die konkrete Semantik von πρόσωπον und den Gedanken des Entzogenseins aus ihrer Gegenwart beziehungsweise Reichweite.
theological_decisions:
- issue: Deutung der Zeitformel
  choice: eine Zeit und Zeiten und eine halbe Zeit
  alternative: dreieinhalb Jahre
  rationale: Der Text selbst verwendet eine symbolisch offene Formel; eine kalendarische Festlegung würde bereits eine Auslegung in die Übersetzung eintragen.
- issue: Identität des ernährenden Handelnden
  choice: Passiv „wird sie ernährt“ ohne genanntes Subjekt
  alternative: „Gott ernährt sie“
  rationale: Obwohl Gott im Kontext als Handelnder verstanden werden kann, nennt der griechische Text das Subjekt nicht ausdrücklich.
- issue: Bildsprache der Adlerflügel
  choice: wörtlich als „Flügel des großen Adlers“ wiedergegeben
  alternative: als bloßes Bild göttlicher Rettung paraphrasiert
  rationale: Die apokalyptische Bildsprache und ihre möglichen Schriftbezüge sollen erhalten bleiben, ohne eine einzelne Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptische Bildsprache und die absichtlich offene Zeitangabe bleiben erhalten. „Angesicht“ ist hier bewusst etwas gehobener gewählt, um die konkrete Bildlichkeit des griechischen Ausdrucks nicht auf das abstraktere „Gegenwart“ zu reduzieren.
