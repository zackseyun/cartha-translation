id: REV.12.9
reference: Revelation 12:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: de
  text: Und der große Drache wurde hinabgeworfen – die alte Schlange[a], die der Teufel und Satan genannt wird und die ganze Welt verführt.[b] Er wurde auf die Erde hinabgeworfen, und seine Engel wurden mit ihm hinabgeworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezeichnung „alte Schlange“ greift das Schlangenbild aus 1. Mose 3 auf.
    reason: cross_reference
  - marker: b
    text: 'Oder: „die die ganze bewohnte Erde in die Irre führt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: wurde hinabgeworfen / wurden hinabgeworfen
  rationale: Die Passivformen bezeichnen eine gewaltsame Entfernung nach unten. „Hinabgeworfen“ bewahrt sowohl die Richtung als auch die dreifache Wiederholung des griechischen Verbs.
- source_word: δράκων ὁ μέγας
  choice: der große Drache
  rationale: „Drache“ gibt das apokalyptische Bild direkt und in geläufiger biblischer Sprache wieder.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: die alte Schlange
  rationale: „Schlange“ ist im modernen Deutschen natürlich und lässt zugleich den Bezug auf das Schlangenbild aus 1. Mose 3 erkennen. „Alt“ gibt ἀρχαῖος wieder, ohne „urzeitlich“ oder „ursprünglich“ deutend vorwegzunehmen.
- source_word: ὁ καλούμενος
  choice: die … genannt wird
  rationale: Die partizipiale Wendung kennzeichnet den Drachen durch seine bekannten Namen beziehungsweise Bezeichnungen und lässt sich so idiomatisch in den Relativsatz einfügen.
- source_word: Διάβολος
  choice: Teufel
  rationale: Hier steht das Wort als feststehende Bezeichnung der dargestellten Gestalt; „Teufel“ ist die konventionelle und verständliche deutsche Wiedergabe.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Der Name beziehungsweise Titel wird entsprechend der etablierten deutschen Form transliteriert.
- source_word: ὁ πλανῶν
  choice: die … verführt
  rationale: πλανάω umfasst das Täuschen und Irreführen. „Verführt“ ist in diesem Zusammenhang knapp, natürlich und bewahrt die aktive geistliche Irreführung; die wörtlichere Alternative wird in einer Fußnote genannt.
- source_word: τὴν οἰκουμένην ὅλην
  choice: die ganze Welt
  rationale: Die Wendung bezeichnet die gesamte bewohnte Welt. „Die ganze Welt“ vermittelt den universalen Umfang im Deutschen am natürlichsten; die engere lexikalische Form erscheint in der Fußnote.
- source_word: εἰς τὴν γῆν
  choice: auf die Erde
  rationale: Im Gegensatz zum himmlischen Bereich bezeichnet γῆ hier die Erde; bei einer Bewegung nach unten ist „auf die Erde“ idiomatisches Deutsch.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: seine Engel
  rationale: Im apokalyptischen Zusammenhang sind übermenschliche Wesen gemeint, nicht menschliche Boten.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: Die schlichte Begleitangabe wird unmittelbar und ohne Zusatz wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Διάβολος und Σατανᾶς in der Reihe der Identifizierungen
  choice: die Teufel und Satan genannt wird
  alternative: die der Verleumder und der Widersacher genannt wird
  rationale: Der Text identifiziert den Drachen durch etablierte Namen beziehungsweise Bezeichnungen. Die geläufigen deutschen Formen erhalten diese Identifizierung, ohne ihre lexikalischen Bedeutungen als zusätzliche Auslegung in den Haupttext einzutragen.
- issue: Reichweite von οἰκουμένη
  choice: die ganze Welt
  alternative: die ganze bewohnte Erde
  rationale: Die natürliche deutsche Formulierung bewahrt den universalen Zug der apokalyptischen Aussage. Die lexikalisch ausdrücklichere Alternative bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante dreifache Wiederholung von „hinabgeworfen“ wurde trotz möglicher stilistischer Glättung beibehalten. Die weiblichen Relativpronomen beziehen sich grammatisch auf „die Schlange“, während alle Appositionen dieselbe Gestalt bezeichnen.
