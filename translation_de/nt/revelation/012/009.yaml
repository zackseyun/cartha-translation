revisions:
- from: Und der große Drache wurde hinabgeworfen – die alte Schlange[a], die Teufel und Satan genannt wird und die ganze Welt verführt.[b] Er wurde auf die Erde hinabgeworfen, und seine Engel wurden mit ihm hinabgeworfen.
  to: Und der große Drache wurde hinabgeworfen – die alte Schlange[a], die der Teufel und Satan genannt wird und die ganze Welt verführt.[b] Er wurde auf die Erde hinabgeworfen, und seine Engel wurden mit ihm hinabgeworfen.
  rationale: Die einzige notwendige Korrektur ist der Artikelwechsel von „die Teufel“ zu „der Teufel“. Dadurch wird die Identifizierungsreihe grammatisch korrekt und der Singular des griechischen Ausgangstextes gewahrt. Textstruktur, Wiederholung und Fußnotenanker bleiben unverändert.
