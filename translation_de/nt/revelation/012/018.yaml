lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die gewöhnliche deutsche Konjunktion verbindet den Satz schlicht mit der vorausgehenden Erzählung.
- source_word: ἐστάθη
  choice: er stellte sich
  rationale: Die passive Form des Aorists von ἵστημι wird hier intransitiv gebraucht. Im Zusammenhang ist der Drache aus Vers 17 das naheliegende Subjekt; „stellte sich“ gibt zudem den punktuellen Aspekt natürlich wieder.
- source_word: ἐπὶ
  choice: auf
  rationale: Mit dem Akkusativ bezeichnet ἐπί hier die eingenommene Position; im Deutschen passt „sich auf den Sand stellen“ idiomatisch.
- source_word: τὴν ἄμμον
  choice: den Sand
  rationale: ἄμμος bezeichnet konkret den Sand; diese Bildsprache sollte nicht durch das allgemeinere „Ufer“ ersetzt werden.
- source_word: τῆς θαλάσσης
  choice: am Meer
  rationale: Der attributive Genitiv bezeichnet den zum Meer gehörenden Sand. „Sand am Meer“ ist im modernen Deutschen natürlicher als „Sand des Meeres“, ohne den örtlichen Bezug zu verlieren.
theological_decisions:
- issue: Subjektbestimmung und Textvariante der Verbform
  choice: 'Der Haupttext folgt ἐστάθη in der dritten Person: „er stellte sich“; im Kontext bezieht sich dies am ehesten auf den Drachen.'
  alternative: 'Eine Textüberlieferung liest ἐστάθην und ergibt: „Und ich stellte mich auf den Sand am Meer.“'
  rationale: Der gedruckte SBLGNT-Text hat die dritte Person. Die bedeutsame Variante in der ersten Person wird in einer Fußnote bewahrt, statt die textliche Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Formulierung bleibt bildnah, vermeidet jedoch den im Deutschen schwerfälligen Genitiv „Sand des Meeres“.
