base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/018.yaml
  text: And he stood on the sand of the sea[a].
translation:
  language: de
  text: Und er stellte sich auf den Sand am Meer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „Und ich stellte mich auf den Sand am Meer.“'
