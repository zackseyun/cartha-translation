id: REV.12.2
reference: Revelation 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐν γαστρὶ ἔχουσα· ⸂καὶ κράζει⸃ ὠδίνουσα καὶ βασανιζομένη τεκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: de
  text: Sie war schwanger[a] und schreit in Geburtswehen[b] und Qualen, um zu gebären.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »im Leib habend«; auch: »sie war mit einem Kind schwanger«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in den Wehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: sie war schwanger
  rationale: Die Wendung bedeutet wörtlich »im Mutterleib habend« und bezeichnet idiomatisch eine Schwangerschaft. »Sie war schwanger« ist im modernen Deutschen natürlich und präzise.
- source_word: κράζει
  choice: sie schreit
  rationale: Das Präsens bewahrt die unmittelbare, anschauliche Darstellung der Vision.
- source_word: ὠδίνουσα
  choice: unter Geburtswehen
  rationale: Das Partizip bezeichnet das Erleiden von Wehen. Die Formulierung hält den Bezug zur Geburt und den Schmerz ausdrücklich fest.
- source_word: βασανιζομένη
  choice: unter Qualen
  rationale: Die Wendung gibt die starke Intensität des passiven Partizips wieder, ohne eine äußere Person als Verursacher der Qualen vorauszusetzen.
- source_word: τεκεῖν
  choice: um zu gebären
  rationale: Der finale Infinitiv wird knapp und natürlich wiedergegeben; das Verb lässt wie im Griechischen unausgesprochen, wen oder was sie gebiert.
- source_word: καὶ ... καὶ
  choice: und ... und
  rationale: Die wiederholte Verknüpfung bleibt erhalten und bewahrt den kumulativen Rhythmus der Beschreibung.
theological_decisions:
- issue: Art und Intensität des Leidens der Frau in der Vision
  choice: βασανιζομένη wird stark mit »unter Qualen« wiedergegeben; die symbolische Identität der Frau bleibt offen.
  alternative: Eine mildere Wiedergabe wie »von Schmerzen geplagt« oder eine Deutung der Frau im Übersetzungstext.
  rationale: Der griechische Text schildert heftiges Leiden, legt in diesem Vers aber weder die symbolische Identität der Frau noch die theologische Bedeutung ihrer Schmerzen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens »schreit« erhält die visionäre Unmittelbarkeit; »unter Geburtswehen und Qualen« wahrt die starke, kumulative Bildsprache, ohne zusätzliche Deutung einzutragen.
