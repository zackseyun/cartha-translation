id: REV.12.7
reference: Revelation 12:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: de
  text: 'Und im Himmel brach ein Krieg aus: Michael und seine Engel kämpften gegen den Drachen.[a] Und der Drache und seine Engel kämpften.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Michael und seine Engel, um gegen den Drachen zu kämpfen.« Das Griechische verwendet hier einen substantivierten Infinitiv in einer gedrängten Konstruktion.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Und der Drache kämpfte und seine Engel.« Das Verb steht im Griechischen nur beim Drachen; die Engel werden anschließend angefügt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: ein Krieg brach aus
  rationale: Die Verbindung von γίνομαι mit πόλεμος bezeichnet hier das Eintreten eines Geschehens. »Ein Krieg brach aus« gibt diesen beginnenden Charakter in natürlichem modernem Deutsch wieder.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Im apokalyptischen Zusammenhang ist der himmlische Bereich gemeint, nicht bloß der sichtbare Luftraum.
- source_word: Μιχαὴλ
  choice: Michael
  rationale: Der Personenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: seine Engel
  rationale: Die natürliche deutsche Possessivkonstruktion bewahrt die Zuordnung der Engel zu Michael beziehungsweise zum Drachen.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: kämpften gegen den Drachen
  rationale: Der substantivierte Infinitiv bezeichnet in der gedrängten griechischen Konstruktion den Kampf beziehungsweise dessen Zweck. Die finite Wiedergabe ist im Deutschen klar und idiomatisch; »gegen« macht im gegebenen Konfliktzusammenhang die Gegnerschaft deutlich.
- source_word: δράκοντος / δράκων
  choice: der Drache / den Drachen
  rationale: »Drache« entspricht dem apokalyptischen Bild und wahrt die Bezeichnung des griechischen Textes.
- source_word: ἐπολέμησεν
  choice: kämpfte
  rationale: Die schlichte Wiedergabe vermeidet es, mit »wehrte sich« oder »kämpfte zurück« eine Reaktionsrichtung stärker auszudrücken, als sie grammatisch ausdrücklich gesagt ist.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: zusammen mit seinen Engeln
  rationale: Die idiomatische Ergänzung macht verständlich, dass auch die Engel des Drachen am Kampf beteiligt sind, ohne ein im Griechischen nicht wiederholtes Verb unnötig einzufügen.
theological_decisions:
- issue: Identität und Rang Michaels
  choice: Nur den Namen »Michael« nennen, ohne erklärenden Titel oder christologische Gleichsetzung.
  alternative: »der Erzengel Michael« oder eine ausdrückliche Identifizierung Michaels mit Christus
  rationale: Der Vers nennt Michael, bestimmt hier aber weder seinen Rang noch setzt er ihn mit Christus gleich. Die Übersetzung lässt diese Auslegungsfragen daher offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dynamische Formulierung »brach ein Krieg aus« bewahrt den Ereignischarakter, während die Fußnoten die ungewöhnlich gedrängte griechische Syntax sichtbar halten.
