  source_fidelity: 'Der Text gibt die Satzstruktur und die zentralen Ausdrücke des griechischen Textes zuverlässig wieder: δράκων als „Drache“, das gewaltsame Passiv ἐβλήθη als „hinabgeworfen worden war“, γῆ im kosmischen Sinn als „Erde“, und ἐδίωξεν als „verfolgte“. „Das männliche Kind“ macht die durch τὸν ἄρσενα markierte Geschlechtlichkeit verständlich, ohne die symbolische Referenz näher festzulegen.'
  naturalness: Der Satz ist modernes, gut lesbares Standarddeutsch und wahrt zugleich einen angemessen würdevollen biblischen Registerton. Die Vorvergangenheit in „geboren hatte“ und „hinabgeworfen worden war“ bildet die zeitliche Abfolge idiomatisch ab.
  terminology: Die Terminologie ist konsistent mit der apokalyptischen Bildsprache. „Drache“, „Frau“ und „männliches Kind“ vermeiden eine unzulässige dogmatische oder allegorische Festlegung. Die Anmerkungen erläutern die lexikalische Spannweite von „verfolgte“ und die Ergänzung „Kind“ sachgerecht.
