id: REV.12.13
reference: Revelation 12:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: de
  text: Als der Drache sah, dass er auf die Erde hinabgeworfen worden war, verfolgte[a] er die Frau, die das männliche Kind[b] geboren hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jagte er … hinterher« beziehungsweise »bedrängte er«. Das griechische Verb kann feindliches Verfolgen und Verfolgung im Sinn von Bedrängung bezeichnen; hier können beide Aspekte mitschwingen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Männlichen«. »Kind« ist zum natürlichen Verständnis ergänzt; vergleiche den Wortlaut im Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: Drache
  rationale: Bewahrt die ausdrücklich verwendete apokalyptische Bildsprache, ohne mit der an anderer Stelle genannten Schlange zu harmonisieren.
- source_word: ἐβλήθη
  choice: hinabgeworfen worden war
  rationale: Gibt den gewaltsamen passiven Vorgang und im Deutschen passend das zeitliche Verhältnis zu »sah« wieder.
- source_word: εἰς τὴν γῆν
  choice: auf die Erde
  rationale: Im kosmischen Zusammenhang der Offenbarung bezeichnet γῆ die Erde im Gegensatz zum Himmel.
- source_word: ἐδίωξεν
  choice: verfolgte
  rationale: Das deutsche »verfolgen« kann sowohl das feindliche Hinterherjagen als auch die Verfolgung im Sinn von Bedrängung ausdrücken und bewahrt so die Bedeutungsweite von διώκω.
- source_word: γυναῖκα
  choice: Frau
  rationale: Direkte und natürliche Wiedergabe, die keine bestimmte Deutung der symbolischen Gestalt vorwegnimmt.
- source_word: ἥτις
  choice: die
  rationale: Natürliche deutsche Wiedergabe des Relativpronomens in diesem Satz.
- source_word: ἔτεκεν
  choice: geboren hatte
  rationale: Gibt den Geburtsvorgang klar wieder und markiert natürlich dessen Vorzeitigkeit.
- source_word: τὸν ἄρσενα
  choice: das männliche Kind
  rationale: Das substantivierte Adjektiv bedeutet wörtlich »den Männlichen«; »männliches Kind« ist im Deutschen verständlich und bewahrt die auffällige Betonung des Geschlechts.
theological_decisions:
- issue: Symbolische Identität der Frau und des männlichen Kindes
  choice: Die Bildsprache bleibt als »die Frau« und »das männliche Kind« stehen.
  alternative: Die Frau ausdrücklich als Maria, Israel oder Gottes Volk beziehungsweise die Gemeinde und das Kind ausdrücklich als eine bestimmte Gestalt identifizieren.
  rationale: Der griechische Text nennt hier keine eindeutige Auslegung der symbolischen Gestalten; die Übersetzung soll die verschiedenen möglichen Deutungen nicht vorentscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am griechischen Text; »hinabgeworfen« wahrt zugleich den im Kontext vorausgesetzten Gegensatz zwischen Himmel und Erde. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
