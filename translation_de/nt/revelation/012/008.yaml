id: REV.12.8
reference: Revelation 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: de
  text: Doch er war nicht stark genug[a], und im Himmel wurde kein Platz mehr für sie gefunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch er konnte sich nicht durchsetzen.“ Das griechische Verb kann stark oder mächtig sein, etwas vermögen oder sich durchsetzen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Doch
  rationale: Im Zusammenhang mit dem Kampf hat καί hier adversative Wirkung; „Doch“ gibt den Gegensatz im Deutschen natürlich wieder.
- source_word: οὐκ ἴσχυσεν
  choice: er war nicht stark genug
  rationale: ἰσχύω kann stark sein, Macht haben, imstande sein oder siegen bedeuten. Die Formulierung bewahrt den Kraftaspekt und bezieht den Singular auf den Drachen aus Vers 7.
- source_word: οὐδὲ
  choice: und … kein
  rationale: Nach der vorausgehenden Verneinung ist diese Koordination im Deutschen flüssig und bewahrt die zusätzliche negative Aussage.
- source_word: τόπος
  choice: Platz
  rationale: τόπος bezeichnet hier einen Ort beziehungsweise Raum. „Platz für sie“ ist in diesem Satz idiomatischer als „Ort für sie“.
- source_word: εὑρέθη
  choice: wurde … gefunden
  rationale: Die passive Form wird ausdrücklich beibehalten und nicht lediglich mit „es gab“ wiedergegeben.
- source_word: αὐτῶν
  choice: für sie
  rationale: Der Genitiv wird in dieser Konstruktion idiomatisch wiedergegeben und bezeichnet den Drachen samt seinen Engeln.
- source_word: ἔτι
  choice: mehr
  rationale: Zusammen mit der Verneinung bedeutet ἔτι „nicht mehr“ und zeigt an, dass ihnen fortan kein Platz im Himmel verblieb.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Gemeint ist in diesem Zusammenhang der himmlische Bereich, nicht der sichtbare Luftraum.
theological_decisions:
- issue: Bezugswort des singularischen Verbs ἴσχυσεν
  choice: Das Subjekt bleibt singularisch („er“) und bezeichnet den Drachen aus dem vorhergehenden Vers; „sie“ bezeichnet anschließend den Drachen und seine Engel gemeinsam.
  alternative: 'Kollektive Wiedergabe: „Sie waren nicht stark genug.“'
  rationale: Der griechische Singular führt den Drachen als Subjekt fort, während das spätere αὐτῶν die gesamte Gruppe umfasst. Die deutsche Wiedergabe erhält diesen Wechsel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Wendung „wurde … gefunden“ wahrt die Form des griechischen Textes; die Stellung „im Himmel“ sorgt zugleich für einen natürlichen deutschen Satzfluss.
