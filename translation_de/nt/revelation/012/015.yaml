    rationale: ποιήσῃ bedeutet hier, dass die Schlange bewirken will, dass die Frau vom Fluss fortgetragen wird. „Lassen“ kann im Deutschen ein bloßes Zulassen ausdrücken und ist zudem stilistisch schwerfällig. Eine dass-Konstruktion stellt die beabsichtigte Verursachung klar dar.
