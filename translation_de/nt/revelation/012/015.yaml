- from: Da schleuderte die Schlange Wasser wie einen Strom aus ihrem Maul hinter der Frau her[a], um sie vom Strom fortreißen zu lassen[b].
  to: Da schleuderte die Schlange Wasser wie einen Strom aus ihrem Maul hinter der Frau her[a], um zu bewirken, dass der Strom sie fortreißt[b].
  rationale: Der Schlusssatz wird so umgestellt, dass die im Griechischen vorliegende kausative Zweckbestimmung klar und idiomatisch wiedergegeben wird. Die Revision erhält das Strombild, fügt keine Aussage über Ertrinken oder Tod hinzu und verändert weder die symbolische Offenheit noch die Fußnotenanker.
