review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Bildfolge und den Zweck des griechischen Textes insgesamt zuverlässig wieder: Die Schlange schleudert Wasser wie einen Strom aus ihrem Maul der Frau nach, um ihr Fortgerissenwerden durch den Strom zu bewirken. „Strom“ bewahrt ποταμός, und der Vergleich mit ὡς bleibt erhalten. Die bisherige Schlussformulierung mit „fortreißen zu lassen“ ist jedoch weniger unmittelbar als das kausative ποιήσῃ und kann stilistisch nahelegen, die Schlange lasse lediglich zu, dass etwas geschieht.'
  naturalness: „Da schleuderte die Schlange …“ und „hinter der Frau her“ sind modernes, verständliches Standarddeutsch mit angemessen würdigem Register. „Um zu bewirken, dass der Strom sie fortreißt“ ist idiomatischer und syntaktisch klarer als „um sie vom Strom fortreißen zu lassen“.
  terminology: „Schlange“, „Maul“, „Wasser wie einen Strom“ und „Strom“ sind angemessene und bildtreue Wiedergaben. Die Übersetzung deutet die apokalyptische Symbolik nicht aus. Die Fußnote zu ὀπίσω bewahrt zutreffend die räumliche Alternative; die Fußnote zur seltenen kausativen Wendung bleibt sachgerecht.
  issues:
