  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: de
  text: Da schleuderte die Schlange Wasser wie einen Strom aus ihrem Maul hinter der Frau her[a], um zu bewirken, dass der Strom sie fortreißt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinter die Frau“. Die griechische Wendung kann rein räumlich verstanden werden oder eine Verfolgung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „um sie stromgetragen zu machen“, das heißt, um zu bewirken, dass der Strom sie fortträgt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: schleuderte
  rationale: βάλλω bedeutet „werfen, schleudern“. „Schleuderte“ bringt die gewaltsame, feindselige Handlung in dieser Szene zum Ausdruck.
- source_word: ὁ ὄφις
  choice: die Schlange
  rationale: ὄφις bezeichnet eine Schlange. Die deutsche Benennung bewahrt die biblische und symbolische Bildsprache.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: aus ihrem Maul
  rationale: Die Präposition ἐκ bezeichnet die Bewegung aus etwas heraus. Bei einer Schlange ist „Maul“ im Deutschen natürlicher als „Mund“; das feminine Pronomen folgt dem grammatischen Geschlecht von „Schlange“.
- source_word: ὀπίσω τῆς γυναικός
  choice: hinter der Frau her
  rationale: ὀπίσω mit Genitiv kann räumlich „hinter“ oder im Sinn einer Verfolgung „hinter … her“ bedeuten. Die gewählte Formulierung wahrt das räumliche Bild und macht im Kontext die gegen die Frau gerichtete Bewegung verständlich.
- source_word: ὕδωρ ὡς ποταμόν
  choice: Wasser wie einen Strom
  rationale: Die Formulierung erhält den mit ὡς eingeleiteten Vergleich und gibt ποταμός als „Strom“ wieder, ohne das Bild deutend durch „Flut“ zu ersetzen.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: sie vom Strom fortreißen zu lassen
  rationale: ποταμοφόρητος bedeutet wörtlich etwa „von einem Strom getragen“. Zusammen mit ποιέω ist die Wendung kausativ; die Übersetzung gibt idiomatisch wieder, dass die Frau durch den Strom fortgetragen werden soll, ohne ausdrücklich Ertrinken oder Tod hinzuzufügen.
theological_decisions:
- issue: Symbolische apokalyptische Darstellung des Angriffs der Schlange
  choice: Die Bilder „Wasser wie einen Strom“ und „vom Strom fortreißen“ bleiben im Haupttext unaufgelöst erhalten.
  alternative: Das Wasser unmittelbar als Heer, Verfolgung, Lüge oder Chaos deuten.
  rationale: Der Ausgangstext nennt keine eindeutige Auflösung des Symbols. Die Übersetzung bewahrt deshalb die Bildsprache und legt keine bestimmte theologische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schleuderte“ erhält die Wucht der Handlung; „hinter der Frau her“ ist allgemein verständlich und lässt die räumliche Grundbedeutung erkennen. Die seltene griechische Wendung im Schlusssatz wird idiomatisch wiedergegeben und in einer Fußnote wörtlicher erläutert.
