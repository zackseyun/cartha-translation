id: REV.12.1
reference: Revelation 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: de
  text: 'Und ein großes Zeichen erschien im Himmel: eine Frau, mit der Sonne bekleidet, der Mond unter ihren Füßen und auf ihrem Kopf ein Kranz[a] aus zwölf Sternen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Krone“. Das griechische Wort bezeichnet einen Kranz oder Siegeskranz, nicht ein königliches Diadem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: Zeichen
  rationale: Im visionären Kontext der Offenbarung bezeichnet das Wort ein sinnbedeutendes Zeichen; „Zeichen“ wahrt diesen apokalyptischen Charakter, ohne die Symbolik auszudeuten.
- source_word: μέγα
  choice: großes
  rationale: „Groß“ gibt sowohl die Eindrücklichkeit als auch die Bedeutung des Zeichens natürlich und knapp wieder.
- source_word: ὤφθη
  choice: erschien
  rationale: Die formal passive Form bedeutet „wurde gesehen“; „erschien“ ist im Deutschen die natürliche Formulierung für eine visionäre Sichtbarwerdung.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: οὐρανός kann auch den sichtbaren Himmel bezeichnen; im visionären Zusammenhang der Offenbarung ist „im Himmel“ passend, ohne die Szene weiter festzulegen.
- source_word: γυνή
  choice: eine Frau
  rationale: Der Vers führt eine symbolische weibliche Gestalt ein, ohne sie als Ehefrau oder als bestimmte Person zu identifizieren.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: mit der Sonne bekleidet
  rationale: Die Formulierung bewahrt das ungewöhnliche, feierliche Bild des griechischen Textes und gibt den durch das Perfekt bezeichneten Zustand wieder.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: der Mond war unter ihren Füßen
  rationale: Die ergänzte Kopula ergibt im Deutschen einen vollständigen und natürlichen Satz und bewahrt die räumliche Bildsprache.
- source_word: στέφανος
  choice: Kranz
  rationale: στέφανος bezeichnet einen Kranz beziehungsweise Siegeskranz und ist vom königlichen Diadem unterschieden. „Kranz“ bildet diese lexikalische Besonderheit genauer ab als das allgemeinere „Krone“.
- source_word: ἀστέρων δώδεκα
  choice: aus zwölf Sternen
  rationale: Der Genitiv beschreibt, woraus der Kranz besteht; „aus zwölf Sternen“ macht das Bild im Deutschen klar, ohne zusätzliche Deutung.
theological_decisions:
- issue: Symbolische Identität der Frau
  choice: Die Frau wird lediglich als visionäre Gestalt beschrieben und nicht identifiziert.
  alternative: Israel; Maria; das Volk Gottes; die Gemeinde
  rationale: Der Vers selbst benennt die Identität der Frau nicht. Eine rein beschreibende Übersetzung wahrt die Offenheit und vermeidet eine konfessionelle Festlegung.
- issue: Bedeutung der Himmelskörper und der Zahl zwölf
  choice: Sonne, Mond und zwölf Sterne werden ohne symbolische Erklärung wiedergegeben.
  alternative: Explizite Zuordnung zu bestimmten Personen, Stämmen, Aposteln oder Gemeinschaften
  rationale: Solche Deutungen können aus intertextuellen oder theologischen Erwägungen entstehen, werden in diesem Vers jedoch nicht ausdrücklich vorgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die koordinierende Satzstruktur des griechischen Textes bleibt weitgehend erhalten; kleine syntaktische Ergänzungen dienen der natürlichen deutschen Lesbarkeit.
