  to: Und sein Schwanz fegt ein Drittel der Sterne des Himmels hinweg und warf sie auf die Erde. Der Drache stand vor der Frau, die im Begriff war zu gebären, um ihr Kind zu verschlingen, sobald sie es geboren hatte.
  rationale: Die Schlussformulierung wird so geändert, dass sie den erwarteten Eintritt der Geburt ohne irrealen Unterton ausdrückt. „Im Begriff war zu gebären“ gibt die bevorstehende Geburt präzise und natürlich wieder. Der im griechischen Text vorhandene Wechsel von Präsens und Aorist bleibt in „fegt … und warf“ erhalten.
