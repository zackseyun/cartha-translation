review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Bildsprache, den Bruchausdruck und den auffälligen Wechsel von Präsens (σύρει) zu Aorist (ἔβαλεν) zutreffend wieder. Auch die finale Aussage des ἵνα-Satzes ist grundsätzlich getroffen. „Sobald sie es geboren hätte“ ist jedoch nicht quellentreu: Der Konjunktiv II Perfekt kann im Deutschen einen irrealen oder nur hypothetischen Sinn nahelegen, während ὅταν mit Aoristkonjunktiv hier den erwarteten Eintritt des Ereignisses bezeichnet.'
  naturalness: „Kurz vor der Geburt“ ist verständlich, aber „im Begriff war zu gebären“ ist näher an μελλούσης τεκεῖν und im apokalyptisch-erzählenden Register idiomatisch. Die ersetzte Zeitform im Schlusssatz vermeidet die irreführende Irrealitätsnuance und bleibt flüssig.
  terminology: „Drache“, „Frau“, „Kind“, „Sterne des Himmels“ und „verschlingen“ sind angemessen. Die Sterne werden zutreffend nicht als Engel ausgelegt.
  issues:
  - severity: medium
    issue: „sobald sie es geboren hätte“
    rationale: Diese Form ist Konjunktiv II Perfekt und kann einen kontrafaktischen bzw. hypothetischen Sachverhalt ausdrücken. Das griechische ὅταν τέκῃ bezeichnet hier den erwarteten Zeitpunkt der Geburt innerhalb der Zielhandlung, nicht eine irreale Bedingung.
  revised_text: Und sein Schwanz fegt ein Drittel der Sterne des Himmels hinweg und warf sie auf die Erde. Der Drache stand vor der Frau, die im Begriff war zu gebären, um ihr Kind zu verschlingen, sobald sie es geboren hatte.
