id: REV.12.4
reference: Revelation 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: de
  text: Und sein Schwanz fegt ein Drittel der Sterne des Himmels hinweg und warf sie auf die Erde. Der Drache stand vor der Frau, die im Begriff war zu gebären, um ihr Kind zu verschlingen, sobald sie es geboren hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: fegt … hinweg
  rationale: Das Präsens bezeichnet die im Bild sichtbar werdende Bewegung des Drachenschwanzes; die Wendung gibt die kraftvolle, mitreißende Handlung natürlich wieder.
- source_word: τὸ τρίτον
  choice: ein Drittel
  rationale: Idiomatiche deutsche Wiedergabe des griechischen Bruchausdrucks.
- source_word: ἔβαλεν
  choice: warf
  rationale: Bewahrt den auffälligen Wechsel vom Präsens σύρει zum Aorist und harmonisiert die Zeitformen nicht.
- source_word: ἕστηκεν
  choice: stand
  rationale: Das Perfekt beschreibt den Drachen in eingenommener Stellung vor der Frau; im Deutschen gibt „stand“ den erzählerischen Zustand natürlich wieder.
- source_word: καταφάγῃ
  choice: zu verschlingen
  rationale: Gibt die intensive Bedeutung von καταφαγεῖν als vollständiges Auffressen wieder und passt zum bedrohlichen Bild.
theological_decisions:
- issue: Deutung der Sterne
  choice: Sterne
  alternative: Engel
  rationale: Der Bildbegriff wird nicht auslegend auf Engel festgelegt; so bleibt die symbolische Offenheit des Textes erhalten.
- issue: Tempuswechsel zwischen σύρει und ἔβαλεν
  choice: „fegt … hinweg und warf“
  alternative: „fegte … hinweg und warf“ oder „fegt … hinweg und wirft“
  rationale: Der ungewöhnliche Wechsel der griechischen Verbformen wird bewusst bewahrt, statt ihn zur stilistischen Glätte zu harmonisieren.
- issue: Zweck des Wartens vor der Frau
  choice: „um ihr Kind zu verschlingen“
  alternative: „damit er ihr Kind verschlänge“
  rationale: Der finale Sinn von ἵνα bleibt erhalten, ohne eine weitergehende theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Der markante Tempuswechsel des Ausgangstextes bleibt absichtlich stehen; „kurz vor der Geburt“ formuliert τῆς μελλούσης τεκεῖν natürlich und verständlich.
