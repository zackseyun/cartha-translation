  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: de
  text: 'Und ein anderes Zeichen erschien im Himmel, und siehe: ein großer, feuerroter Drache mit sieben Köpfen und zehn Hörnern und mit sieben Diademen[a] auf seinen Köpfen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kronen“. Gemeint sind genauer Diademe, königliche Stirnbänder im Unterschied zu Siegeskränzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: erschien
  rationale: Das Aoristpassiv von ὁράω wird in diesem visionären Zusammenhang idiomatisch mit „erschien“ wiedergegeben; „wurde gesehen“ wäre formaler, aber im Deutschen weniger natürlich.
- source_word: ἄλλο σημεῖον
  choice: ein anderes Zeichen
  rationale: σημεῖον bezeichnet hier eine symbolische Erscheinung innerhalb der Vision. „Zeichen“ ist klar, geläufig und wahrt den Bezug zu Offenbarung 12,1.
- source_word: ἐν τῷ οὐρανῷ
  choice: am Himmel
  rationale: οὐρανός kann „Himmel“ im räumlichen oder theologischen Sinn bezeichnen. „Am Himmel“ entspricht natürlichem Deutsch für das Erscheinen eines visionären Zeichens und lässt die genaue räumliche Vorstellung offen.
- source_word: ἰδοὺ
  choice: Siehe
  rationale: „Siehe“ bewahrt den aufmerksamkeitslenkenden, feierlichen Charakter des griechischen Diskursmarkers und passt zum erhöhten Register der apokalyptischen Vision.
- source_word: δράκων μέγας πυρρός
  choice: ein großer, feuerroter Drache
  rationale: „Drache“ gibt δράκων direkt wieder; „groß“ wahrt μέγας. „Feuerrot“ ist eine natürliche deutsche Farbbezeichnung und bringt den flammenartig roten Sinn von πυρρός zum Ausdruck, ohne ihn symbolisch auszudeuten.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: mit sieben Köpfen und zehn Hörnern
  rationale: Die deutsche Konstruktion mit „mit“ gibt das beschreibende Partizip ἔχων natürlich und vollständig wieder; Köpfe und Hörner bleiben uninterpretierte Bildelemente.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα
  choice: mit sieben Diademen auf seinen Köpfen
  rationale: „Auf seinen Köpfen“ gibt ἐπί mit Akkusativ räumlich wieder. Das maskuline Possessivpronomen entspricht dem grammatisch maskulinen δράκων. „Diademe“ wahrt die spezifische Bezeichnung für königliche Stirnbänder und unterscheidet διάδημα von στέφανος.
theological_decisions:
- issue: Farbbezeichnung πυρρός
  choice: feuerrot
  alternative: rot
  rationale: πυρρός bezeichnet nicht bloß irgendein Rot, sondern ein feuer- beziehungsweise flammenartiges Rot. „Feuerrot“ wahrt diese Bildhaftigkeit, ohne eine zusätzliche symbolische Bedeutung festzulegen.
- issue: Bezug des Possessivpronomens αὐτοῦ
  choice: seinen Köpfen
  alternative: dessen Köpfen
  rationale: Das maskuline Pronomen folgt natürlich dem maskulinen Substantiv „Drache“ und erhält die personale Wirkung der Gestalt, ohne ihre spätere Identifizierung vorwegzunehmen.
- issue: Wiedergabe von διάδημα
  choice: Diadem
  alternative: Krone
  rationale: „Diadem“ bewahrt die lexikalische Unterscheidung zum Siegeskranz (στέφανος) und kennzeichnet den königlichen Herrschaftsanspruch, ohne dessen Rechtmäßigkeit zu beurteilen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach „am Himmel“ bildet den präsentierenden Charakter von καὶ ἰδού idiomatisch ab. Die Aufzählung bleibt bildkräftig und nahe an der Struktur des griechischen Textes, wird aber durch die zweimalige Verwendung von „mit“ natürlich lesbar.
