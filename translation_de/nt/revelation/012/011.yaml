  to: Und sie besiegten ihn[a] durch das Blut des Lammes[c] und durch das Wort ihres Zeugnisses und liebten ihr Leben[b] nicht bis zum Tod.
  rationale: Die Revision ersetzt allein die unidiomatische und potenziell missverständliche Schlussformulierung durch „bis zum Tod“ und stellt die im Griechischen durchgehend koordinierte Satzstruktur wieder her. Bedeutung, Ambiguität von διά und ψυχή sowie sämtliche Fußnotenanker bleiben erhalten.
