id: REV.12.11
reference: Revelation 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: de
  text: Und sie besiegten ihn[a] durch das Blut des Lammes[c] und durch das Wort ihres Zeugnisses und liebten ihr Leben[b] nicht bis zum Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „überwanden ihn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Seele“ beziehungsweise „sich selbst“. Das griechische Wort psychē kann „Leben“, „Selbst“ oder „Seele“ bedeuten; hier weist der Zusammenhang auf das Leben angesichts des Todes.'
    reason: lexical_alternative
  - marker: c
    text: 'Das mit „durch“ wiedergegebene griechische Wort kann hier auch den Grund bezeichnen: „wegen des Blutes des Lammes und wegen des Wortes ihres Zeugnisses“.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐνίκησαν
  choice: besiegten
  rationale: Das Verb bezeichnet das Siegen oder Überwinden. „Besiegten“ bewahrt die anschauliche Kampfsprache der Offenbarung; „überwanden“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: διὰ τὸ αἷμα
  choice: durch das Blut
  rationale: διά mit Akkusativ kann hier Mittel oder Grund bezeichnen. „Durch“ gibt den instrumentalen Sinn natürlich wieder, ohne die mögliche kausale Nuance auszuschließen.
- source_word: ἀρνίου
  choice: des Lammes
  rationale: ἀρνίον ist in der Offenbarung ein christologischer Titel. „Das Lamm“ bewahrt die Opfer- und Bildsprache des Buches.
- source_word: λόγον τῆς μαρτυρίας αὐτῶν
  choice: das Wort ihres Zeugnisses
  rationale: Die formal nahe Wiedergabe erhält sowohl λόγος als auch μαρτυρία und lässt offen, ob besonders die verkündete Botschaft oder der bezeugende Ausspruch im Blick ist.
- source_word: οὐκ ἠγάπησαν
  choice: liebten … nicht
  rationale: Die Wiedergabe bewahrt die direkte Bedeutung von ἀγαπάω und damit die zugespitzte Aussage des griechischen Textes, statt sie zu „hingen nicht daran“ abzuschwächen.
- source_word: τὴν ψυχὴν αὐτῶν
  choice: ihr Leben
  rationale: ψυχή kann Leben, Selbst oder Seele bedeuten. Im Zusammenhang mit dem Tod ist das irdische Leben gemeint; der Singular des Griechischen wird distributiv beibehalten.
- source_word: ἄχρι θανάτου
  choice: bis in den Tod
  rationale: Die Formulierung bezeichnet die äußerste Grenze ihrer Treue, nämlich den Tod selbst, und klingt im Deutschen zugleich knapp und würdig.
theological_decisions:
- issue: Art des Sieges durch das Blut des Lammes
  choice: „durch“ als vorwiegend instrumentale Wiedergabe
  alternative: „wegen“ als kausale Wiedergabe
  rationale: Der Text führt den Sieg auf das Blut des Lammes zurück, entfaltet hier aber keine weitergehende Sühnelehre. „Durch“ bleibt nah am Zusammenhang; die ebenfalls mögliche kausale Deutung wird in einer Fußnote genannt.
- issue: Bedeutung von ψυχή im Martyriumskontext
  choice: „Leben“
  alternative: „Seele“ oder „Selbst“
  rationale: Der folgende Ausdruck „bis in den Tod“ spricht für das preisgegebene irdische Leben. „Seele“ könnte einen Leib-Seele-Gegensatz nahelegen, den der Vers nicht ausdrücklich setzt.
- issue: Die Aussage, das eigene Leben nicht zu lieben
  choice: Die zugespitzte Formulierung wird wörtlich bewahrt
  alternative: „Sie hingen nicht an ihrem Leben“
  rationale: Der Text lobt nicht Lebensverachtung an sich, sondern Treue trotz drohenden Todes. Die Übersetzung bewahrt dennoch die bewusste Härte der Aussage, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Text; der Gedankenstrich markiert die zugespitzte Schlusswendung. „Zeugnis“ und „Lamm“ bewahren die johanneische und apokalyptische Begrifflichkeit.
