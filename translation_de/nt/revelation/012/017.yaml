id: REV.12.17
reference: Revelation 12:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: de
  text: Da wurde der Drache zornig auf die Frau und ging fort, um gegen die übrigen ihrer Nachkommen Krieg zu führen, die Gottes Gebote halten und das Zeugnis Jesu[a] haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Zeugnis über Jesus“; auch möglich: „das Zeugnis, das Jesus gibt“. Der griechische Genitiv lässt mehrere Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: wurde zornig
  rationale: Der ingressiv zu verstehende Aorist von ὀργίζομαι bezeichnet das Aufkommen von Zorn. „Wurde zornig“ ist gegenwärtiges, würdiges Deutsch und vermeidet eine unnötige Steigerung.
- source_word: δράκων
  choice: Drache
  rationale: Die übliche und bildgetreue Wiedergabe des apokalyptischen Symbols in Offenbarung 12.
- source_word: ἀπῆλθεν
  choice: ging fort
  rationale: Gibt die erzählerische Bewegung von ἀπέρχομαι natürlich wieder, ohne ein Ziel hinzuzufügen.
- source_word: ποιῆσαι πόλεμον μετὰ
  choice: um gegen … Krieg zu führen
  rationale: Die Wendung bedeutet idiomatisch, Krieg zu führen. Obwohl μετά mit dem Genitiv wörtlich „mit“ heißt, verlangt der kriegerische Zusammenhang im Deutschen die adversative Formulierung „gegen“.
- source_word: τῶν λοιπῶν τοῦ σπέρματος αὐτῆς
  choice: die übrigen ihrer Nachkommen
  rationale: σπέρμα bezeichnet hier kollektiv die Nachkommenschaft. „Nachkommen“ bewahrt den familiären Sinn, während „die übrigen“ den partitiven Bezug ausdrückt.
- source_word: τηρούντων τὰς ἐντολὰς τοῦ θεοῦ
  choice: die Gottes Gebote halten
  rationale: τηρέω bezeichnet hier treue Befolgung; „Gebote halten“ ist prägnant, verständlich und biblisch angemessen.
- source_word: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: die das Zeugnis Jesu haben
  rationale: „Haben“ bildet ἔχω unmittelbar ab. Die Genitivfügung „Zeugnis Jesu“ bewahrt im Deutschen die mögliche subjektive wie objektive Deutung.
theological_decisions:
- issue: Bedeutung des Genitivs in τὴν μαρτυρίαν Ἰησοῦ
  choice: das Zeugnis Jesu
  alternative: das Zeugnis über Jesus; das Zeugnis, das Jesus gibt
  rationale: Der griechische Genitiv kann objektiv oder subjektiv verstanden werden. Die formal ebenso offene deutsche Genitivfügung bewahrt diese echte Auslegungsfrage; die Fußnote nennt beide Hauptmöglichkeiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch „gegen … Krieg zu führen“ idiomatisch deutsch formuliert. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten Wendung.
