id: REV.12.12
reference: Revelation 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: de
  text: Darum freut euch, ihr Himmel, und ihr, die ihr in ihnen wohnt! Wehe der Erde[a] und dem Meer! Denn der Teufel ist zu euch hinabgestiegen, voll großen Zorns[b], weil er weiß, dass er nur wenig Zeit hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Land«. Das griechische Wort γῆ kann sowohl »Erde« als auch »Land« bedeuten; wegen des kosmischen Zusammenhangs ist hier »Erde« gewählt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »voll großer Wut«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »dass er wenig Zeit hat«.'
    reason: literal_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Stellt knapp und natürlich den Folgerungszusammenhang zur zuvor geschilderten himmlischen Siegeshandlung her.
- source_word: εὐφραίνεσθε
  choice: freut euch
  rationale: Gibt den Imperativ als unmittelbare Aufforderung zur Freude in natürlichem, würdigem Deutsch wieder.
- source_word: οἱ οὐρανοὶ
  choice: ihr Himmel
  rationale: Der formal nominativische Ausdruck dient als direkte Anrede. Der Plural des griechischen Textes bleibt erhalten.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: ihr, die ihr in ihnen wohnt
  rationale: σκηνόω bezeichnet hier das Wohnen beziehungsweise den Aufenthalt im Himmel; eine Wiedergabe mit »zelten« wäre im Deutschen missverständlich.
- source_word: οὐαὶ
  choice: Wehe
  rationale: Bewahrt die prägnante prophetische Klage- und Gerichtsformel.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: der Erde und dem Meer
  rationale: γῆ kann »Erde« oder »Land« bedeuten. Im kosmischen Gegensatz zu den Himmeln und in der Verbindung mit dem Meer ist »Erde« hier vorzuziehen.
- source_word: κατέβη
  choice: ist hinabgestiegen
  rationale: Das Perfekt bezeichnet im Deutschen eine vollendete Bewegung mit gegenwärtiger Folge und wahrt zugleich die räumliche Richtung.
- source_word: ὁ διάβολος
  choice: der Teufel
  rationale: Der Ausdruck fungiert hier als etablierte Bezeichnung für Satan; »der Verleumder« würde die Titelfunktion unnötig auflösen.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: Bewahrt die Bewegung auf die Angeredeten zu, ohne die bereits durch den Zorn ausgedrückte Feindseligkeit zusätzlich in die Präposition hineinzulesen.
- source_word: ἔχων θυμὸν μέγαν
  choice: voll großen Zorns
  rationale: Gibt die begleitende Partizipialkonstruktion knapp wieder und bewahrt die starke Intensität von θυμός.
- source_word: εἰδὼς
  choice: weil er weiß
  rationale: Macht den im Kontext begründenden Sinn des Partizips in flüssigem Deutsch ausdrücklich, ohne seinen Aussagegehalt zu erweitern.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: dass er nur noch wenig Zeit hat
  rationale: Gibt die begrenzte verbleibende Zeitspanne idiomatisch wieder; »nur noch« verdeutlicht die kontextuell vorausgesetzte Kürze, während eine Fußnote den engeren Wortlaut ausweist.
theological_decisions:
- issue: Bezug von »euch« in »der Teufel ist zu euch hinabgestiegen«
  choice: »Euch« bezieht sich auf die unmittelbar zuvor genannten Bereiche Erde und Meer beziehungsweise deren Bewohner.
  alternative: Die Anrede könnte rhetorisch bei den Himmeln und ihren Bewohnern bleiben.
  rationale: Der unmittelbare Anschluss an »Wehe der Erde und dem Meer« legt einen Wechsel von der himmlischen Freude zur irdischen Bedrohung nahe. Die Übersetzung fügt jedoch keine ausdrückliche Deutung wie »Bewohner der Erde« hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht erhöhtem Ton. Die direkte Anrede und der Plural »Himmel« bleiben erhalten; schwer verständliche Sakralsprache wie »tabernakeln« wird vermieden. Die Zeichensetzung hebt den scharfen Gegensatz zwischen himmlischer Freude und dem Weheruf über Erde und Meer hervor.
