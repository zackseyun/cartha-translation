id: REV.5.8
reference: Revelation 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: de
  text: Und als das Lamm die Buchrolle nahm, fielen die vier Lebewesen und die vierundzwanzig Ältesten vor dem Lamm nieder, alle mit je einer Leier[a] und goldenen Schalen voller Räucherwerk; diese sind die Gebete der Heiligen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Harfe“. Gemeint ist ein antikes Saiteninstrument.'
    reason: lexical_alternative
  - marker: b
    text: „Die Heiligen“ sind hier die Menschen, die Gott gehören; gemeint sind nicht nur besonders verehrte oder später kirchlich anerkannte Einzelpersonen.
    reason: lexical_clarification
lexical_decisions:
- source_word: βιβλίον
  choice: Buchrolle
  rationale: Im Zusammenhang von Offenbarung 5 bezeichnet das Wort ein beschriebenes, versiegeltes Schriftstück; „Buchrolle“ gibt dessen antike Form und die Bildwelt genauer wieder als das moderne „Buch“.
- source_word: ζῷα
  choice: Lebewesen
  rationale: Gemeint sind die himmlischen Wesen am Thron, nicht abwertend verstandene Tiere. „Lebewesen“ ist sachlich, würdevoll und verständlich.
- source_word: πρεσβύτεροι
  choice: Älteste
  rationale: Die Bezeichnung wahrt den Rang und die repräsentative Würde der vierundzwanzig Gestalten, ohne ein späteres kirchliches Amt einzutragen.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor dem Lamm“ gibt die räumliche Nähe und ehrfürchtige Ausrichtung knapp und idiomatisch wieder.
- source_word: ἀρνίου
  choice: dem Lamm
  rationale: „Das Lamm“ ist in der Offenbarung ein christologischer Titel; die Übersetzung erhält dessen Opfer- und Herrschaftssymbolik.
- source_word: ἔχοντες ἕκαστος
  choice: Jeder hatte
  rationale: Die distributive Aussage wird in natürlichem Deutsch wiedergegeben. Das maskuline Partizip kann sich syntaktisch besonders auf die Ältesten beziehen, lässt sich bei der gemischten Gesamtgruppe jedoch auch sinngemäß auf alle zuvor Genannten beziehen; die knappe Form bewahrt die Aussage des griechischen Textes, ohne sie erklärend einzuengen.
- source_word: κιθάραν
  choice: eine Leier
  rationale: κιθάρα bezeichnet ein antikes Saiteninstrument. „Leier“ ist historisch näherliegend als die traditionelle Wiedergabe „Harfe“; diese bleibt als verständliche Alternative in der Fußnote erhalten.
- source_word: φιάλας χρυσᾶς
  choice: goldene Schalen
  rationale: φιάλη bezeichnet eine flache Schale beziehungsweise ein schalenförmiges Gefäß; „Schalen“ ist im heutigen Deutsch klarer als altertümliche Alternativen wie „Schalenkelche“ oder „Gefäße“.
- source_word: γεμούσας θυμιαμάτων
  choice: die mit Räucherwerk gefüllt waren
  rationale: „Räucherwerk“ gibt θυμίαμα als zum Verbrennen bestimmtes Duft- beziehungsweise Weihrauchmaterial wieder, ohne es unnötig auf eine einzige Substanz zu verengen.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: Diese sind die Gebete der Heiligen
  rationale: Das feminine Relativpronomen bezieht sich grammatisch auf die goldenen Schalen. Die direkte Gleichsetzung durch εἰσιν wird beibehalten und nicht deutend zu „stellen dar“ abgeschwächt.
theological_decisions:
- issue: Symbolische Gleichsetzung der goldenen Schalen mit den Gebeten
  choice: „Diese sind die Gebete der Heiligen“
  alternative: „Diese stellen die Gebete der Heiligen dar“ oder „Das Räucherwerk sind die Gebete der Heiligen“
  rationale: Der griechische Text verwendet eine direkte Gleichsetzung, und das feminine αἵ verweist grammatisch auf die Schalen. Die Übersetzung bewahrt diese auffällige apokalyptische Bildsprache, statt sie harmonisierend auf das Räucherwerk zu beziehen oder durch „stellen dar“ abzuschwächen.
- issue: Bedeutung von οἱ ἅγιοι
  choice: „die Heiligen“
  alternative: „die heiligen Menschen“ oder „Gottes heiliges Volk“
  rationale: „Die Heiligen“ ist die etablierte und textnahe Bezeichnung für die Gott zugehörigen Menschen. Die Fußnote stellt klar, dass hier nicht nur später kirchlich kanonisierte Einzelpersonen gemeint sind.
- issue: Träger der Leiern und Schalen
  choice: Die distributive Form „Jeder hatte“ bleibt ohne ausdrückliche Beschränkung stehen.
  alternative: „Jeder der Ältesten hatte“
  rationale: Die maskuline Form ἔχοντες ἕκαστος kann besonders auf die unmittelbar genannten Ältesten weisen, kann bei einer koordinierten Gruppe mit einem maskulinen Bestandteil aber auch die gesamte Gruppe erfassen. Eine ausdrückliche Beschränkung auf die Ältesten würde die syntaktische Spannung stärker auflösen, als der Ausgangstext es verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze entlasten die lange griechische Satzperiode, ohne ihre Abfolge zu verändern. „Buchrolle“, „Lebewesen“, „Älteste“ und „Lamm“ halten die etablierte Bildsprache der Offenbarung aufrecht. Beide Fußnotenmarker [a] und [b] stehen unmittelbar an den erläuterten Ausdrücken im Haupttext.
