revisions:
- from: Und als es die Buchrolle nahm, fielen die vier Lebewesen und die vierundzwanzig Ältesten vor dem Lamm nieder. Jeder hatte eine Leier[a] und goldene Schalen, die mit Räucherwerk gefüllt waren. Diese sind die Gebete der Heiligen.[b]
  to: Und als das Lamm die Buchrolle nahm, fielen die vier Lebewesen und die vierundzwanzig Ältesten vor dem Lamm nieder, alle mit je einer Leier[a] und goldenen Schalen voller Räucherwerk; diese sind die Gebete der Heiligen[b].
  rationale: Die Revision benennt das handelnde Lamm ausdrücklich, ohne eine zusätzliche Deutung einzutragen. „Alle mit je“ gibt die distributive Aussage von ἔχοντες ἕκαστος flüssig wieder, ohne die Ausstattung ausdrücklich auf die Ältesten zu beschränken. Der Relativbezug auf die goldenen Schalen und die direkte Gleichsetzung mit den Gebeten bleiben erhalten. Fußnote [b] wurde an den erläuterten Ausdruck verschoben.
