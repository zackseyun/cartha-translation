  naturalness: „Als es die Buchrolle nahm“ wirkt im modernen Deutsch für das als personale himmlische Gestalt handelnde Lamm stilistisch spröde und kann ohne unmittelbaren Satzkontext missverständlich sein. Die Wiederholung „das Lamm“ ist klarer und in diesem Kontext natürlich. Die Verknüpfung der Partizipialangabe lässt sich zudem in einem Satz idiomatischer abbilden.
  terminology: „Buchrolle“, „Lebewesen“, „Älteste“, „Lamm“, „Leier“, „goldene Schalen“, „Räucherwerk“ und „die Heiligen“ sind geeignete, moderne und quellentreue Wiedergaben. Die Fußnote zu „Heiligen“ ist sachlich und nicht konfessionell verengend; ihr Anker sollte aber unmittelbar beim erläuterten Ausdruck stehen.
