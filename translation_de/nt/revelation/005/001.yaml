id: REV.5.1
reference: Revelation 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: de
  text: Und ich sah in der rechten Hand dessen, der auf dem Thron saß, eine Schriftrolle, innen und auf der Rückseite beschrieben[a] und mit sieben Siegeln versiegelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „innen und hinten“. Gemeint ist wahrscheinlich, dass die Schriftrolle innen und auf ihrer Rückseite, also außen, beschrieben war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: Der Aorist von ὁράω wird als schlichtes Erzählpräteritum wiedergegeben.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: auf der rechten Hand
  rationale: ἐπί mit Akkusativ bezeichnet hier zunächst die Lage auf der Hand. Anders als im Englischen ist im Deutschen „auf der rechten Hand“ natürlich verständlich und bewahrt das konkrete Bild, ohne Besitz oder festes Umgreifen vorauszusetzen.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: dessen, der auf dem Thron saß
  rationale: Die substantivierte Partizipialkonstruktion wird idiomatisch als Relativsatz wiedergegeben; das Präteritum fügt sich in den Erzählrahmen ein, ohne die Identität der Gestalt ausdrücklich festzulegen.
- source_word: βιβλίον
  choice: Schriftrolle
  rationale: Im dargestellten antiken Zusammenhang ist eher eine Rolle als ein Kodex gemeint; zudem passt die beidseitige Beschriftung zur Bildwelt des Verses.
- source_word: γεγραμμένον
  choice: beschrieben
  rationale: Das Perfektpartizip bezeichnet den fortbestehenden Zustand der Rolle als beschriftet. „Beschrieben“ ist im Deutschen für einen Schriftträger idiomatisch.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: innen und auf der Rückseite
  rationale: ἔσωθεν bezeichnet die Innenseite; ὄπισθεν meint hier am ehesten die rückwärtige beziehungsweise äußere Seite der Rolle. Die Formulierung bewahrt die räumliche Konkretheit.
- source_word: κατεσφραγισμένον
  choice: versiegelt
  rationale: Das Perfektpartizip bezeichnet einen vollzogenen, fortbestehenden Zustand. Die mögliche Verstärkung durch κατα- muss im Deutschen nicht eigens ausgedrückt werden.
- source_word: σφραγῖσιν ἑπτά
  choice: mit sieben Siegeln
  rationale: Der instrumentale Dativ wird natürlich mit „mit“ wiedergegeben.
theological_decisions:
- issue: Bezeichnung der Gestalt auf dem Thron
  choice: dessen, der auf dem Thron saß
  alternative: Gottes, der auf dem Thron saß
  rationale: Der griechische Text beschreibt die Gestalt, nennt sie hier aber nicht ausdrücklich Gott. Die Übersetzung wahrt diese literarische Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schriftrolle“ vermeidet das heute missverständliche „Buch“. Die Satzstellung bleibt nah am griechischen Wahrnehmungsbericht, ist aber im Deutschen flüssig.
