review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die wesentlichen Elemente des griechischen Textes: Johannes sieht eine Schriftrolle, die auf beiden Seiten beschrieben und mit sieben Siegeln versiegelt ist. „Schriftrolle“ ist für βιβλίον im antiken Kontext treffend. Für ἐπὶ τὴν δεξιὰν ist im Deutschen jedoch „in der rechten Hand“ die idiomatische Wiedergabe der dargestellten Haltung; „auf der rechten Hand“ legt eher eine Lage auf dem Handrücken oder einen getragenen Gegenstand nahe.'
  naturalness: Der Satz ist insgesamt verständlich und würdig. Mit „in der rechten Hand“ klingt er im modernen Standarddeutsch deutlich natürlicher. Die knappe Partizipialfügung zu „Schriftrolle“ kann beibehalten werden.
  terminology: „Schriftrolle“, „Thron“ und „Siegel“ sind sachgerecht und registerangemessen. Die umschreibende Bezeichnung der Throngestalt wahrt die im griechischen Text gewählte Zurückhaltung. Die Fußnote sollte ὄπισθεν nicht als bloßes „hinten“ glossieren, sondern die hier gemeinte Rückseite der Rolle benennen.
  issues:
  - severity: medium
    issue: „auf der rechten Hand“
    rationale: Die Formulierung ist zwar nah an der räumlichen Grundbedeutung von ἐπί, ist im heutigen Deutschen bei einer gehaltenen Schriftrolle aber unidiomatisch und kann ein Aufliegen auf dem Handrücken suggerieren. „In der rechten Hand“ gibt die Szene natürlich und kontextgerecht wieder.
  - severity: low
    issue: Fußnotenformulierung „innen und hinten“
    rationale: „Hinten“ ist im Deutschen als wörtliche Glosse hier zu unbestimmt. ὄπισθεν bezeichnet in diesem Kontext die Rück- bzw. Außenseite der Schriftrolle; die Fußnote sollte dies klarer ausdrücken, ohne die räumliche Bildlichkeit aufzugeben.
  revised_text: Und ich sah in der rechten Hand dessen, der auf dem Thron saß, eine Schriftrolle, innen und auf der Rückseite beschrieben[a] und mit sieben Siegeln versiegelt.
