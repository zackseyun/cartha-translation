    reason: lexical_alternative
  revision_rationale: Die Änderung von „auf der rechten Hand“ zu „in der rechten Hand“ verbessert die idiomatische und szenisch zutreffende deutsche Wiedergabe, ohne die Bedeutung des griechischen Ausdrucks einzuengen. Die übrige Übersetzung kann bestehen bleiben; die Fußnote erklärt die räumliche Bedeutung von „auf der Rückseite“ angemessen.
