revisions:
- from: Und ich sah auf der rechten Hand dessen, der auf dem Thron saß, eine Schriftrolle, innen und auf der Rückseite beschrieben[a] und mit sieben Siegeln versiegelt.
  to: Und ich sah in der rechten Hand dessen, der auf dem Thron saß, eine Schriftrolle, innen und auf der Rückseite beschrieben[a] und mit sieben Siegeln versiegelt.
  rationale: Die Änderung von „auf der rechten Hand“ zu „in der rechten Hand“ verbessert die idiomatische und szenisch zutreffende deutsche Wiedergabe, ohne die Bedeutung des griechischen Ausdrucks einzuengen. Die übrige Übersetzung kann bestehen bleiben; die Fußnote erklärt die räumliche Bedeutung von „auf der Rückseite“ angemessen.
