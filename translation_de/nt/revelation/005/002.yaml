id: REV.5.2
reference: Revelation 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: de
  text: 'Und ich sah einen mächtigen Engel, der mit lauter Stimme verkündete: »Wer ist würdig, die Schriftrolle[a] zu öffnen und ihre Siegel zu lösen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Buch« beziehungsweise »das Schriftstück«. Das griechische Wort βιβλίον kann allgemein eine beschriebene Unterlage bezeichnen; hier passt wegen der mehreren Siegel wahrscheinlich »Schriftrolle« am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: einen mächtigen Engel
  rationale: ἰσχυρός bezeichnet Stärke oder Macht. »Mächtig« klingt im Deutschen natürlich und bewahrt die nachdrückliche Charakterisierung des Engels.
- source_word: κηρύσσοντα
  choice: der … verkündete
  rationale: κηρύσσω bezeichnet das öffentliche, weithin vernehmbare Ausrufen durch einen Herold. »Verkündete« entspricht dem feierlichen Charakter der Szene besser als »predigte«.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die griechische Wendung bezeichnet lautes, kraftvolles Sprechen. »Mit lauter Stimme« ist eine natürliche und genaue deutsche Wiedergabe.
- source_word: Τίς ἄξιος
  choice: Wer ist würdig
  rationale: ἄξιος bezeichnet hier die Würdigkeit beziehungsweise Befähigung für eine einzigartige, feierliche Aufgabe. »Würdig« bewahrt sowohl den üblichen Sinn als auch das theologische Gewicht der Frage.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: die Schriftrolle zu öffnen
  rationale: βιβλίον kann allgemein ein Schriftstück oder Buch bezeichnen. Die mehrfach versiegelte Schrift und der antike Kontext sprechen hier anschaulich für eine Schriftrolle.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: ihre Siegel zu lösen
  rationale: λύω bedeutet lösen, losmachen oder aufheben. »Die Siegel lösen« bewahrt die konkrete Bildsprache, ohne festzulegen, ob sie zerbrochen, entfernt oder anderweitig geöffnet werden.
theological_decisions:
- issue: Wiedergabe von βιβλίον in der Thronsaalvision
  choice: Schriftrolle
  alternative: Buch; Schriftstück
  rationale: Der Gegenstand trägt mehrere Siegel und gehört in einen antiken Bildzusammenhang. »Schriftrolle« lässt die Szene am plausibelsten erkennen, ohne aus dem Ausdruck eine Lehrentscheidung abzuleiten.
- issue: Wiedergabe des Lösens der Siegel
  choice: die Siegel lösen
  alternative: die Siegel brechen; entsiegeln
  rationale: Die allgemeinere Bedeutung von λύω bleibt erhalten. So wird die konkrete Handlung nicht unnötig auf ein Zerbrechen der Siegel eingeengt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-feierlichem Ton. Der Relativsatz gibt das griechische Partizip natürlich wieder; die direkte Frage bleibt knapp und eindringlich.
