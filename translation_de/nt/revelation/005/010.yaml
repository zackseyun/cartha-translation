id: REV.5.10
reference: Revelation 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: de
  text: Und du hast sie für unseren Gott zu einem Königreich und zu Priestern gemacht[a], und sie herrschen auf der Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben „Könige und Priester“ statt „ein Königreich und Priester“.
    reason: textual_variant
  - marker: b
    text: Einige Handschriften haben „sie werden auf der Erde herrschen“ statt „sie herrschen auf der Erde“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: du hast … gemacht
  rationale: Der Aorist bezeichnet hier die vollzogene Handlung. Das deutsche Perfekt klingt in einem gegenwärtigen Lied natürlich und gibt den Rückbezug auf die Erlösung im vorherigen Vers angemessen wieder.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Akkusativpronomen bezeichnet die im vorherigen Vers genannten Erlösten und ist direktes Objekt von ἐποίησας.
- source_word: τῷ θεῷ ἡμῶν
  choice: für unseren Gott
  rationale: Der Dativ bezeichnet, wem die Erlösten als Königreich und Priester zugeordnet sind. „Für unseren Gott“ ist im heutigen Deutsch natürlicher als „unserem Gott“ allein, ohne die Beziehung weiter festzulegen.
- source_word: βασιλείαν
  choice: zu einem Königreich
  rationale: Der Singular bezeichnet die Erlösten kollektiv als Königreich. Die Konstruktion „zu … gemacht“ gibt das prädikative Akkusativobjekt idiomatisch wieder.
- source_word: ἱερεῖς
  choice: zu Priestern
  rationale: Die übliche und sachlich genaue Wiedergabe; zusammen mit „Königreich“ klingt die Anspielung auf 2. Mose 19,6 an.
- source_word: βασιλεύουσιν
  choice: sie herrschen
  rationale: Die im angegebenen SBLGNT-Text stehende Form ist Präsens Indikativ Aktiv und wird daher präsentisch wiedergegeben. Die futurische Textvariante wird in einer Fußnote genannt.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: ἐπί mit Genitiv wird hier räumlich als „auf“ wiedergegeben. „Über die Erde“ würde den Herrschaftsaspekt stärker auslegen, als es die Präposition für sich verlangt.
theological_decisions:
- issue: Bezeichnung der Erlösten als βασιλείαν
  choice: ein Königreich
  alternative: Könige
  rationale: Der angegebene griechische Text liest den Singular βασιλείαν („Königreich“). Die abweichende Lesart „Könige“ wird als Textvariante bewahrt, aber nicht in den Haupttext übernommen.
- issue: Zeitpunkt der Herrschaft
  choice: sie herrschen
  alternative: sie werden herrschen
  rationale: Der angegebene griechische Haupttext hat das Präsens βασιλεύουσιν. Damit wird keine eschatologische Einordnung erzwungen; die futurische Lesart wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die poetische Parallelität des griechischen Lobgesangs fest; „zu einem Königreich und zu Priestern gemacht“ ist zugleich verständlich und formal quellennah.
