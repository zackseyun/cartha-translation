id: REV.5.7
reference: Revelation 5:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: de
  text: Und es kam und nahm die Buchrolle[a] aus der rechten Hand dessen, der auf dem Thron sitzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen ist das direkte Objekt nicht ausgedrückt; gemeint ist die zuvor erwähnte Buchrolle.
    reason: Kennzeichnet die im Deutschen zur Klarheit ergänzte, im unmittelbaren Kontext eindeutig bezogene Buchrolle.
lexical_decisions:
- source_word: ἦλθεν
  choice: kam
  rationale: Der Aorist von ἔρχομαι beschreibt die Bewegung des Lammes zu dem auf dem Thron Sitzenden. „Kam“ gibt das Verb direkt wieder, ohne die deutendere Nuance von „trat heran“ einzuführen.
- source_word: εἴληφεν
  choice: nahm
  rationale: Das Perfekt von λαμβάνω steht hier in einer fortlaufenden Visionsschilderung. Das deutsche Präteritum „nahm“ gibt die auf „kam“ folgende Handlung natürlich wieder; „empfing“ wäre weniger konkret und könnte die aktive Bewegung abschwächen.
- source_word: ἐκ
  choice: aus
  rationale: 'Die Präposition bezeichnet hier die räumliche Herkunft: Die Buchrolle wird aus der rechten Hand genommen.'
- source_word: τῆς δεξιᾶς
  choice: der rechten Hand
  rationale: Die substantivierte Form bezeichnet in diesem Zusammenhang die rechte Hand, nicht bloß die rechte Seite, und bewahrt das konkrete Bild der Vision.
- source_word: τοῦ καθημένου
  choice: dessen, der … saß
  rationale: Das substantivierte Präsenspartizip bezeichnet den auf dem Thron Sitzenden. Die deutsche Relativkonstruktion ist klar und natürlich; das Präteritum fügt sich in die Visionsschilderung ein, ohne die fortdauernde Sitzhaltung zu bestreiten.
- source_word: ἐπὶ τοῦ θρόνου
  choice: auf dem Thron
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe des örtlichen Gebrauchs von ἐπί.
theological_decisions:
- issue: Unausgesprochenes direktes Objekt von εἴληφεν
  choice: „die Buchrolle“ wird aus dem unmittelbaren Zusammenhang ergänzt und durch eine Fußnote kenntlich gemacht.
  alternative: „Und es kam und nahm aus der rechten Hand …“
  rationale: Im Griechischen bleibt das Objekt unausgesprochen, weil die Buchrolle aus dem vorhergehenden Zusammenhang eindeutig ist. Im Deutschen wäre ein objektloses „nahm“ unnatürlich und missverständlich. Die Ergänzung macht nur den bereits gegebenen Bezug ausdrücklich.
- issue: Bezeichnung des auf dem Thron Sitzenden
  choice: „dessen, der auf dem Thron saß“
  alternative: „von dem, der auf dem Thron sitzt“
  rationale: Die Formulierung hält das Lamm und den auf dem Thron Sitzenden sprachlich auseinander, ohne die Identität des Letzteren zusätzlich auszudeuten. Das Präteritum entspricht einer natürlichen deutschen Erzählweise.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Visionssprache. Das Pronomen „es“ nimmt das grammatisch sächliche „Lamm“ aus dem Zusammenhang auf. Keine altertümlichen Formen oder zusätzlichen theologischen Identifizierungen.
