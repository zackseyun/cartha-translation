  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: de
  text: 'Sie sprachen mit lauter Stimme: »Würdig ist das Lamm, das geschlachtet worden ist[a], Macht, Reichtum, Weisheit, Kraft[b], Ehre, Herrlichkeit und Segen[c] zu empfangen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das getötet worden ist“. Das griechische Wort kann ausdrücklich das Schlachten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stärke“. „Kraft“ unterscheidet diesen Ausdruck von der zuvor genannten „Macht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Lobpreis“ oder „Segensspruch“. Das griechische Wort kann Segen oder einen Ausdruck des Lobes und Segnens bezeichnen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: λέγοντες
  choice: Sie sprachen
  rationale: Das Präsenspartizip knüpft an die himmlische Menge im vorherigen Vers an. Im Deutschen gibt ein finites Verb diese Verbindung natürlich wieder, ohne den Inhalt zu verändern.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die konkrete Wendung entspricht dem griechischen Dativ und bewahrt das hörbare Bild besser als das bloße Adverb „laut“.
- source_word: Ἄξιόν ἐστιν
  choice: Würdig ist
  rationale: Die Voranstellung bewahrt die Hervorhebung und den feierlichen, hymnischen Klang des griechischen Satzes.
- source_word: τὸ ἀρνίον
  choice: das Lamm
  rationale: „Lamm“ ist die etablierte und kontextgemäße Wiedergabe des christologischen Titels in der Offenbarung.
- source_word: τὸ ἐσφαγμένον
  choice: das geschlachtet worden ist
  rationale: Das Perfektpartizip bezeichnet eine vollzogene Tötung mit fortwirkender Bedeutung. „Geschlachtet“ bewahrt sowohl die drastische als auch die opferbezogene Bildsprache.
- source_word: λαβεῖν
  choice: zu empfangen
  rationale: Im Lobgesang geht es um die Zuerkennung der sieben genannten Größen; „empfangen“ passt daher besser als das ebenfalls mögliche „nehmen“.
- source_word: δύναμιν
  choice: Macht
  rationale: „Macht“ bezeichnet hier wirksame Vollmacht und lässt sich zugleich von ἰσχύς unterscheiden.
- source_word: πλοῦτον
  choice: Reichtum
  rationale: Direkte, natürliche Wiedergabe für Fülle an Besitz oder Mitteln.
- source_word: σοφίαν
  choice: Weisheit
  rationale: Direkte und im Deutschen geläufige Entsprechung.
- source_word: ἰσχὺν
  choice: Kraft
  rationale: „Kraft“ hält die Bedeutung von Stärke fest und unterscheidet den Ausdruck von der zuvor genannten „Macht“.
- source_word: τιμὴν
  choice: Ehre
  rationale: Natürliche Wiedergabe für die dem Lamm erwiesene Anerkennung und Hochachtung.
- source_word: δόξαν
  choice: Herrlichkeit
  rationale: Im biblischen Anbetungskontext ist „Herrlichkeit“ die präzise und geläufige Wiedergabe.
- source_word: εὐλογίαν
  choice: Lobpreis
  rationale: In dieser Aufzählung dessen, was dem Lamm zugesprochen wird, gibt „Lobpreis“ die doxologische Funktion natürlich wieder; die wörtlichere Möglichkeit „Segen“ bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Christologischer Titel und Großschreibung
  choice: das Lamm
  alternative: das Lamm als bloße Tierbezeichnung zu verstehen
  rationale: Im Kontext der Offenbarung bezeichnet ἀρνίον den getöteten und erhöhten Christus. Die übliche Substantivschreibung im Deutschen signalisiert darüber hinaus keine zusätzliche Lehrentscheidung.
- issue: Sprache für den gewaltsamen beziehungsweise opferbezogenen Tod
  choice: das geschlachtet worden ist
  alternative: das getötet worden ist
  rationale: „Geschlachtet“ wahrt die starke Bildsprache von σφάζω und den Bezug des Lammbildes zum Opfer, ohne eine bestimmte Theorie der Sühne in den Vers hineinzulesen.
- issue: Bedeutung von εὐλογία im himmlischen Lobgesang
  choice: Lobpreis
  alternative: Segen
  rationale: Das Wort kann „Segen“, „Segensspruch“ oder „Lobpreis“ bezeichnen. Da es hier etwas ist, das das Lamm empfangen soll, ist „Lobpreis“ im Deutschen idiomatischer; die lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Moderner, würdiger und hymnischer Stil. Die vorangestellte Formulierung „Würdig ist“ bewahrt den feierlichen Nachdruck des Griechischen; die sieben Glieder bleiben vollständig und rhythmisch klar erhalten.
