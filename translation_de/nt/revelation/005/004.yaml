id: REV.5.4
reference: Revelation 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: de
  text: Und ich weinte sehr, weil niemand für würdig befunden wurde, die Schriftrolle[a] zu öffnen oder sie anzusehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Buch“. Das griechische Wort kann beides bedeuten; in dieser Szene passt „Schriftrolle“ besser zur antiken Form und zum Bild des Öffnens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in sie hineinzusehen“. Der Ausdruck kann schlicht das Ansehen meinen, im Zusammenhang aber auch den Einblick in ihren Inhalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: Und ich
  rationale: Bewahrt die narrative Verknüpfung durch καί und die ausdrückliche Nennung des Ichs, ohne die Betonung künstlich zu verstärken.
- source_word: ἔκλαιον
  choice: weinte
  rationale: Das Imperfekt bezeichnet ein andauerndes Geschehen in der Vergangenheit. Im Deutschen kann das Präteritum diesen Verlauf natürlich wiedergeben; eine Umschreibung wie „war am Weinen“ wäre weniger würdevoll.
- source_word: πολύ
  choice: sehr
  rationale: Das adverbial gebrauchte Wort verstärkt das Weinen. „Sehr“ ist im modernen Deutschen natürlich und fügt keine im Griechischen ungenannte Gefühlsnuance hinzu.
- source_word: οὐδεὶς ἄξιος εὑρέθη
  choice: niemand für würdig befunden wurde
  rationale: Die passive Form und das gewichtige „würdig“ bleiben erhalten, ohne die handelnde Instanz des Befindens festzulegen.
- source_word: ἀνοῖξαι
  choice: zu öffnen
  rationale: Direkte und natürliche Wiedergabe des Infinitivs, der angibt, wozu jemand würdig sein müsste.
- source_word: τὸ βιβλίον
  choice: die Schriftrolle
  rationale: Im antiken und bildhaften Zusammenhang von Offenbarung 5 ist eine Schriftrolle gemeint; die Übersetzung vermittelt die Form des Gegenstands klarer als „Buch“.
- source_word: οὔτε βλέπειν αὐτό
  choice: oder sie anzusehen
  rationale: „Ansehen“ gibt βλέπειν αὐτό eng und idiomatisch wieder. Die weitergehende Deutung „hineinzusehen“ ist im Zusammenhang möglich, aber lexikalisch nicht zwingend und wird daher in der Fußnote genannt.
- source_word: ὅτι
  choice: weil
  rationale: Leitet hier den Grund für das Weinen ein und wird im Deutschen eindeutig kausal wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἄξιος in der himmlischen Thronszene
  choice: „würdig“
  alternative: „geeignet“ oder „befähigt“
  rationale: „Würdig“ bewahrt die moralische und heilsgeschichtliche Tragweite des Ausdrucks, ohne sie durch eine erklärende Ergänzung festzulegen.
- issue: Gegenstand, der mit βιβλίον bezeichnet wird
  choice: „Schriftrolle“
  alternative: „Buch“
  rationale: Die Szene und das Öffnen sprechen für eine antike Schriftrolle. Diese kulturell konkrete Wiedergabe verändert keine Lehraussage.
- issue: Reichweite von βλέπειν αὐτό
  choice: „sie anzusehen“ im Haupttext
  alternative: „in sie hineinzusehen“
  rationale: Das Verb kann schlicht das Ansehen bezeichnen; der Kontext kann darüber hinaus den Einblick in den Inhalt nahelegen. Die Übersetzung bewahrt diese Spannung durch eine zurückhaltende Haupttextfassung und eine Fußnote.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Das Präteritum ist für die fortdauernde Handlung idiomatischer als eine deutsche Verlaufsform. Die Satzstruktur bleibt nah am Griechischen, ohne unnatürlich zu wirken.
