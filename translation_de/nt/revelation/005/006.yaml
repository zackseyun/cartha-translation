id: REV.5.6
reference: Revelation 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: de
  text: Und ich sah mitten zwischen dem Thron und den vier Lebewesen und inmitten der Ältesten ein Lamm stehen, wie geschlachtet[a]. Es hatte sieben Hörner und sieben Augen; diese sind die sieben Geister Gottes[b], ausgesandt über die ganze Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „als wäre es geschlachtet worden“. Das verwendete griechische Wort bezeichnet ein gewaltsames, oft mit einem Opfer verbundenes Schlachten.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung „die sieben Geister Gottes“ wird so wiedergegeben, wie sie im Text steht. Manche verstehen sie symbolisch als Bezeichnung für den Heiligen Geist in siebenfacher Fülle.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων
  choice: mitten zwischen dem Thron und den vier Lebewesen und inmitten der Ältesten
  rationale: Die wiederholte räumliche Formulierung bleibt erkennbar, während „zwischen“ und „inmitten“ die Szene im Deutschen verständlich wiedergeben, ohne die gestaffelte Anordnung zusammenzuziehen.
- source_word: ζῴων
  choice: Lebewesen
  rationale: Im Thronsaal bezeichnet das Wort besondere lebendige Wesen und keine gewöhnlichen Tiere. „Lebewesen“ ist sachlich, verständlich und grenzt sie von den anders bezeichneten apokalyptischen Tieren ab.
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: Hier bezeichnet das Wort eine bestimmte himmlische Gruppe; „Älteste“ gibt diese Funktion als Titel natürlich wieder.
- source_word: ἀρνίον
  choice: Lamm
  rationale: „Lamm“ bewahrt die Opfer- und Messiasbildsprache, ohne die mögliche Verkleinerungsform unpassend als „Lämmchen“ wiederzugeben.
- source_word: ἑστηκὸς
  choice: stehen
  rationale: Das Perfektpartizip zeigt das Lamm in einem fortbestehenden Zustand des Stehens. Der deutsche Infinitiv in der Wahrnehmungskonstruktion gibt das anschaulich und idiomatisch wieder.
- source_word: ὡς ἐσφαγμένον
  choice: wie geschlachtet
  rationale: Die knappe Formulierung wahrt sowohl den Vergleich beziehungsweise Erscheinungseindruck als auch das Paradox eines stehenden und doch geschlachteten Lammes.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: Es hatte sieben Hörner und sieben Augen
  rationale: Die Bilder werden wörtlich beibehalten, statt ihre apokalyptische Symbolik bereits in der Übersetzung auszudeuten. Ein neuer Hauptsatz ist im Deutschen klarer als eine lange Partizipialfügung.
- source_word: οἵ εἰσιν
  choice: diese sind
  rationale: „Diese“ stellt im Deutschen einen klaren Rückbezug auf die unmittelbar vorausgehenden sieben Augen her.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: die sieben Geister Gottes
  rationale: Die im Griechischen stehende, theologisch gewichtige Mehrzahl wird bewahrt und nicht deutend zu „der siebenfältige Geist“ umformuliert.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: ausgesandt über die ganze Erde
  rationale: „Ausgesandt“ gibt den passiven Sendungscharakter wieder; „über die ganze Erde“ bewahrt die weltweite Reichweite und das konkrete Wort „Erde“.
theological_decisions:
- issue: Bezugswort von „diese sind die sieben Geister Gottes“
  choice: Die Aussage identifiziert die sieben Augen des Lammes mit den sieben Geistern Gottes.
  alternative: Die Aussage könnte weiter gefasst auf Hörner und Augen zusammen bezogen werden.
  rationale: Die sieben Augen sind das unmittelbar vorausgehende und im Bildzusammenhang naheliegendste Bezugswort. Die Übersetzung fügt jedoch keine weitergehende theologische Deutung hinzu.
- issue: Deutung der „sieben Geister Gottes“
  choice: Die Mehrzahl „die sieben Geister Gottes“ wird unverändert bewahrt.
  alternative: „der siebenfältige Geist Gottes“ oder „der Geist Gottes in siebenfacher Fülle“
  rationale: Der griechische Text verwendet ausdrücklich die Mehrzahl. Da umstritten ist, ob und wie sie den Heiligen Geist in vollkommener Fülle bezeichnet, darf die Übersetzung diese Spannung nicht durch eine dogmatische Paraphrase auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die räumliche Doppelung und die auffällige Mehrzahl „sieben Geister“ bleiben erhalten; unnötig altertümliche Formen und konfessionell festgelegte Deutungen werden vermieden.
