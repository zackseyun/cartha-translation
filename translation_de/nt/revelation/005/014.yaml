id: REV.5.14
reference: Revelation 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: de
  text: 'Und die vier lebendigen Wesen sagten: »Amen.« Und die Ältesten fielen nieder und beteten an.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften ergänzen nach »beteten an« ausdrücklich ein Objekt, etwa »den, der von Ewigkeit zu Ewigkeit lebt«, oder »ihn«. Der Haupttext folgt der kürzeren Lesart des SBLGNT, in der sich das Objekt nur aus dem Zusammenhang ergibt.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: lebendige Wesen
  rationale: Im Kontext der Offenbarung bezeichnet ζῷα die himmlischen Wesen am Thron. »Lebendige Wesen« vermeidet die irreführende Verengung auf Tiere und bewahrt den Bezug zur Thronvision Hesekiels.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der griechische Imperfekt stellt die Äußerung als im Gang befindlich beziehungsweise begleitend dar. Da das Deutsche hier keine natürliche Verlaufsform besitzt, gibt »sagten« den Vorgang ohne eine möglicherweise überdeutliche Wiederholungsangabe wieder.
- source_word: Ἀμήν
  choice: Amen
  rationale: Die vertraute liturgische Bekräftigung wird als Lehnwort beibehalten; Umschreibungen wie »So sei es« würden ihren gottesdienstlichen Klang abschwächen.
- source_word: πρεσβύτεροι
  choice: Ältesten
  rationale: Der Ausdruck bezeichnet in der Offenbarung eine bestimmte himmlische Gruppe und nicht lediglich ältere Männer.
- source_word: ἔπεσαν
  choice: fielen nieder
  rationale: Die Wendung bezeichnet hier die körperliche Niederwerfung in ehrfürchtiger Anbetung.
- source_word: προσεκύνησαν
  choice: beteten an
  rationale: Im himmlischen Thronsaal bezeichnet προσκυνέω kultische Verehrung. »Beteten an« gibt diese religiöse Bedeutung im heutigen Deutsch natürlich wieder.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt der Anbetung
  choice: 'Das Objekt bleibt wie im SBLGNT unausgesprochen: »beteten an«.'
  alternative: »beteten ihn/Gott/den, der von Ewigkeit zu Ewigkeit lebt, an«
  rationale: Der zugrunde gelegte griechische Text nennt nach προσεκύνησαν kein Objekt. Die deutsche Formulierung kann dies natürlich offenlassen, ohne eine Lesart anderer Handschriften oder eine kontextuelle Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am knappen, feierlichen Rhythmus des griechischen Textes; »Amen« wird als liturgischer Zuruf hervorgehoben.
