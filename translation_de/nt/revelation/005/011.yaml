id: REV.5.11
reference: Revelation 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: de
  text: Und ich sah[a] und hörte die Stimme vieler Engel rings um den Thron, die lebendigen Wesen und die Ältesten. Ihre Zahl war Myriaden von Myriaden und Tausende von Tausenden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich blickte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Myriaden von Myriaden und Tausende von Tausenden“; eine Myriade bezeichnet zehntausend, die ganze Wendung eine unermesslich große Menge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: Die gewöhnliche und im Deutschen natürliche Wiedergabe des Aorists von ὁράω; sie wahrt den Übergang vom Sehen zum Hören. „Ich blickte“ ist als stärker aufmerksamkeitsbezogene Nuance möglich.
- source_word: ἤκουσα
  choice: ich hörte
  rationale: Direkte und idiomatische Wiedergabe des aoristischen Erzählverbs.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: die Stimme vieler Engel
  rationale: Der Singular φωνή wird bewahrt und bezeichnet hier die vereinte Stimme der Engelschar; der Genitiv benennt ihre Urheber.
- source_word: κύκλῳ
  choice: rings um
  rationale: Knappes, natürliches Deutsch für die räumliche Anordnung um den Thron und die weiteren Gestalten.
- source_word: ζῴων
  choice: die lebendigen Wesen
  rationale: Bezeichnet die besonderen Thronwesen der Offenbarung, ohne sie als gewöhnliche Tiere erscheinen zu lassen.
- source_word: πρεσβυτέρων
  choice: die Ältesten
  rationale: Übliche und kontextgerechte Wiedergabe der πρεσβύτεροι in den Thronsaalvisionen.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: Ihre Zahl war
  rationale: Natürliches Deutsch, das die ausdrückliche Zahlenangabe des Griechischen erhält.
- source_word: μυριάδες μυριάδων
  choice: Myriaden von Myriaden
  rationale: Bewahrt die gesteigerte griechische Zahlenformel und ihren Eindruck einer unermesslichen Menge, ohne sie vorschnell als „unzählbar“ auszudeuten.
- source_word: χιλιάδες χιλιάδων
  choice: Tausende von Tausenden
  rationale: Erhält die parallele, repetitive Zahlenformel des Ausgangstextes.
theological_decisions:
- issue: Bezeichnung der apokalyptischen Thronwesen (ζῷα)
  choice: die lebendigen Wesen
  alternative: die Lebewesen; die lebendigen Geschöpfe
  rationale: „Lebendige Wesen“ wahrt ihre besondere Rolle in der Vision und vermeidet die mögliche Assoziation gewöhnlicher Tiere, ohne ihre Identität weiter auszulegen.
- issue: Umfang der mit κύκλῳ verbundenen Gruppe
  choice: Die Engel sind rings um den Thron, die lebendigen Wesen und die Ältesten angeordnet.
  alternative: „rings um den Thron“ nur eng mit dem Thron verbinden
  rationale: Die koordinierte griechische Genitivfolge legt nahe, dass alle drei Größen innerhalb der von den Engeln umgebenen Mitte genannt werden; die Übersetzung erhält diese syntaktische Spannung ohne zusätzliche Erklärung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle apokalyptische Zahlenformel bleibt im Haupttext erhalten; ungebräuchliches „Myriaden“ wird in der Fußnote erläutert. Die Zeichensetzung teilt den langen griechischen Satz für bessere Verständlichkeit in zwei deutsche Sätze.
