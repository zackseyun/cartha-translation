id: REV.5.5
reference: Revelation 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: de
  text: 'Und einer von den Ältesten sagt zu mir: »Weine nicht! Sieh: Der Löwe aus dem Stamm Juda[a], die Wurzel Davids, hat gesiegt[b], um die Schriftrolle und ihre sieben Siegel zu öffnen.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »der Löwe vom Stamm Juda«; traditionell wird die Wendung mit »der Löwe aus dem Stamm Juda« wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hat überwunden«. Das griechische Verb ist in der Offenbarung ein Schlüsselwort für siegreiches Überwinden.'
    reason: lexical_alternative
  - marker: c
    text: 'Der griechische Infinitiv kann hier auch als Folge oder Befähigung verstanden werden: »sodass er die Schriftrolle und ihre sieben Siegel öffnen kann«.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: In der Offenbarung bezeichnet das Wort eine anerkannte himmlische Gruppe und nicht lediglich ältere Männer; »Älteste« bewahrt diese Funktion und die biblischen Bezüge.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens ist ein lebendiges Erzählpräsens und wird im Deutschen natürlich mit »sagt« wiedergegeben.
- source_word: Μὴ κλαῖε
  choice: Weine nicht!
  rationale: Die Formulierung ist feierlich, unmittelbar und gibt κλαίω präzise wieder, ohne zwingend die mögliche Verlaufsnuance »Hör auf zu weinen« festzulegen.
- source_word: ἰδοὺ
  choice: Sieh
  rationale: »Sieh« lenkt wie ἰδού nachdrücklich die Aufmerksamkeit auf das Folgende, bleibt aber in modernem Deutsch verständlich und würdevoll.
- source_word: ἐνίκησεν
  choice: hat gesiegt
  rationale: νικάω ist ein Schlüsselwort der Offenbarung für siegreiches Überwinden. »Hat gesiegt« wahrt das Siegesmotiv und die vollendete Handlung.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: der Löwe aus dem Stamm Juda
  rationale: »Aus dem Stamm« bildet ἐκ genau und idiomatisch ab und erhält die messianische Herkunftsbezeichnung.
- source_word: ἡ ῥίζα Δαυίδ
  choice: die Wurzel Davids
  rationale: Die wörtliche titularische Wendung bewahrt das messianische Bild und seine alttestamentlichen Anklänge, ohne es erklärend aufzulösen.
- source_word: ἀνοῖξαι
  choice: um … zu öffnen
  rationale: Der deutsche Infinitivanschluss bildet den griechischen Infinitiv knapp ab. Da sein Verhältnis zum Sieg als Zweck oder als Folge beziehungsweise Befähigung verstanden werden kann, wird die alternative Deutung in einer Fußnote offengehalten.
- source_word: τὸ βιβλίον
  choice: die Schriftrolle
  rationale: Im dargestellten antiken und apokalyptischen Zusammenhang ist eine beschriebene Rolle gemeint; »Schriftrolle« ist anschaulicher und genauer als »Buch«.
- source_word: σφραγῖδας
  choice: Siegel
  rationale: »Siegel« ist die sachlich und kontextuell passende Bezeichnung für die Verschlüsse der Schriftrolle.
- source_word: αὐτοῦ
  choice: ihre
  rationale: Das Pronomen bezieht sich auf die Schriftrolle; das feminine deutsche Possessivpronomen stellt diesen Bezug natürlich her.
theological_decisions:
- issue: Messianische Königstitel
  choice: 'Beide Bezeichnungen bleiben ausdrücklich und unverkürzt stehen: »der Löwe aus dem Stamm Juda, die Wurzel Davids«.'
  alternative: Eine oder beide Bezeichnungen durch eine erklärende Umschreibung ersetzen.
  rationale: Die Häufung der schriftbezogenen messianischen Titel gehört zur Aussage des Verses. Ihre direkte Wiedergabe erhält die christologische Spannung, ohne zusätzliche dogmatische Erläuterungen einzutragen.
- issue: Funktion des Infinitivs ἀνοῖξαι nach ἐνίκησεν
  choice: Der knappe Infinitivanschluss wird mit »um … zu öffnen« wiedergegeben und seine mögliche Ergebnis- beziehungsweise Befähigungsnuance in einer Fußnote genannt.
  alternative: »sodass er … öffnen kann«
  rationale: Der griechische Infinitiv bestimmt den Zusammenhang zwischen Sieg und Öffnen, legt dessen genaue semantische Einordnung jedoch nicht vollständig fest. Die Hauptfassung bleibt formal nah; die Fußnote bewahrt die plausible Lesart, dass der Sieg das Öffnen ermöglicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Das Erzählpräsens bleibt erhalten. »Sieh« vermeidet das heute altertümliche »Siehe«, während die Bildsprache der messianischen Titel unverändert bleibt.
