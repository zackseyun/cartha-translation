  terminology: »Älteste«, »Löwe aus dem Stamm Juda«, »Wurzel Davids«, »Schriftrolle« und »Siegel« sind fachlich, kontextuell und idiomatisch treffend. »Hat gesiegt« bewahrt das für die Offenbarung zentrale Siegesmotiv, ohne die ebenfalls mögliche Wiedergabe »hat überwunden« auszuschließen; diese ist korrekt vermerkt.
