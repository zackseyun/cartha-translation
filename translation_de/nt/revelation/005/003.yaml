id: REV.5.3
reference: Revelation 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: de
  text: Und niemand im Himmel, auf der Erde oder unter der Erde konnte die Schriftrolle öffnen oder sie ansehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Buch“. Das griechische Wort kann allgemein ein schriftliches Dokument bezeichnen; in dieser Szene passt „Schriftrolle“ am besten zum antiken Bild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: niemand
  rationale: Die übliche und natürliche deutsche Wiedergabe des verneinenden Indefinitpronomens.
- source_word: ἐδύνατο
  choice: konnte
  rationale: Das Imperfekt von δύναμαι bezeichnet hier im Erzählzusammenhang die Unfähigkeit; „konnte“ ist im Deutschen direkt und idiomatisch.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Bewahrt die räumliche Aussage und entspricht natürlichem deutschem Sprachgebrauch.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Gibt die Ortsangabe mit ἐπί und Genitiv präzise wieder und erhält die dreigliedrige kosmische Ordnung.
- source_word: ὑποκάτω τῆς γῆς
  choice: unter der Erde
  rationale: Direkte räumliche Wiedergabe, die zusammen mit Himmel und Erde den umfassenden Horizont der Vision bewahrt.
- source_word: ἀνοῖξαι
  choice: öffnen
  rationale: Schlichte und genaue Wiedergabe des Infinitivs nach ἐδύνατο.
- source_word: τὸ βιβλίον
  choice: die Schriftrolle
  rationale: βιβλίον kann allgemein ein Schriftstück oder Buch bezeichnen; im antiken visionären Zusammenhang passt „Schriftrolle“ am besten zum dargestellten Gegenstand.
- source_word: οὔτε βλέπειν αὐτό
  choice: oder sie ansehen
  rationale: οὔτε verbindet unter fortwirkender Verneinung den zweiten Infinitiv mit dem ersten. „Ansehen“ bezeichnet hier das bewusste Hinblicken, ohne das im Griechischen nicht ausdrücklich vorhandene „sogar“ einzufügen.
theological_decisions:
- issue: Umfassender Bereich derer, die die Schriftrolle nicht öffnen können
  choice: Die dreifache räumliche Formulierung „im Himmel, auf der Erde oder unter der Erde“ wird beibehalten.
  alternative: Verallgemeinerung wie „nirgendwo in der Schöpfung“
  rationale: Die konkrete kosmische Dreiteilung unterstreicht die universale Unfähigkeit und bewahrt die Bildsprache der Offenbarung, ohne sie abstrakt aufzulösen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstruktur folgt der feierlichen dreigliedrigen Bildsprache des Ausgangstextes, bleibt dabei aber natürlich lesbar.
