id: REV.5.13
reference: Revelation 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: de
  text: 'Und ich hörte jedes Geschöpf[a] im Himmel und auf der Erde und unter der Erde und auf dem Meer und alles, was in ihnen ist, sagen: „Dem, der auf dem Thron sitzt, und dem Lamm seien der Lobpreis und die Ehre und die Herrlichkeit und die Macht für immer und ewig.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „jedes geschaffene Wesen“; auch „alles Geschaffene“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in die Zeitalter der Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: jedes Geschöpf
  rationale: κτίσμα bezeichnet ein geschaffenes Wesen oder Ding. In dieser Szene äußert die gesamte geschaffene Welt hörbar Lob; „jedes Geschöpf“ bewahrt sowohl die distributive Kraft von πᾶν als auch den personalen Klang.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: im Himmel und auf der Erde und unter der Erde und auf dem Meer und alles, was in ihnen ist
  rationale: Die Folge nennt sämtliche kosmischen Bereiche und drückt umfassende Totalität aus. „In ihnen“ greift die zuvor genannten Bereiche gemeinsam auf.
- source_word: ἤκουσα λέγοντας
  choice: hörte ich sagen
  rationale: Die Konstruktion wird nahe am griechischen Wortlaut wiedergegeben. Der maskuline Plural des Partizips richtet sich dem Sinn nach auf die Gesamtheit der Geschöpfe.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Dem, der auf dem Thron sitzt
  rationale: Das substantivierte Partizip wird in natürlichem, gegenwärtigem Deutsch als Relativsatz wiedergegeben und behält den präsentischen Sinn.
- source_word: τῷ ἀρνίῳ
  choice: dem Lamm
  rationale: „Das Lamm“ ist in der Offenbarung ein feststehender christologischer Titel und bewahrt die Opfer- und Herrschaftssymbolik.
- source_word: ἡ εὐλογία
  choice: der Lobpreis
  rationale: In der doxologischen Formel bezeichnet εὐλογία den Gott und dem Lamm zugesprochenen Segen beziehungsweise Lobpreis. „Lobpreis“ ist im modernen Deutschen hier natürlicher als „Segen“.
- source_word: ἡ τιμή
  choice: die Ehre
  rationale: „Ehre“ gibt die zugesprochene Wertschätzung im doxologischen Zusammenhang präzise und verständlich wieder.
- source_word: ἡ δόξα
  choice: die Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte und sachlich passende Wiedergabe von δόξα in einem Anbetungskontext.
- source_word: τὸ κράτος
  choice: die Macht
  rationale: κράτος bezeichnet wirksame Stärke beziehungsweise Herrschaftsmacht. „Macht“ ist prägnant und im modernen Deutsch verständlich, ohne den Ausdruck auf politische Herrschaft zu verengen.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die griechische Wendung bezeichnet unbegrenzte Dauer. „Für immer und ewig“ ist ihr klares und idiomatisches deutsches Äquivalent.
theological_decisions:
- issue: Gemeinsamer Lobpreis für Gott und das Lamm
  choice: Die eine Lobpreisformel wird gemeinsam an den auf dem Thron Sitzenden und an das Lamm gerichtet.
  alternative: Für beide Angesprochenen jeweils eine eigene verbale Zuschreibung formulieren.
  rationale: Der griechische Text verbindet beide Empfänger in einer einzigen Zuschreibung. Die Übersetzung wahrt diese liturgische Parallelität und die christologische Spannung, ohne sie dogmatisch auszudeuten.
- issue: Referenz von κτίσμα in der kosmischen Lobpreisszene
  choice: „jedes Geschöpf“
  alternative: „die ganze Schöpfung“ oder „alles Geschaffene“
  rationale: Die Wesen aller Bereiche sprechen hörbar. „Jedes Geschöpf“ bringt diesen personalen und zugleich universalen Zug besser zum Ausdruck als die stärker kollektive Formulierung „die ganze Schöpfung“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung mit wiederholten Artikeln bewahrt den feierlichen doxologischen Rhythmus; „seien“ ergänzt das im Griechischen ausgelassene Verb idiomatisch, ohne die gemeinsame Zuschreibung aufzulösen.
