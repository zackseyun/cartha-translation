id: REV.5.9
reference: Revelation 5:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: de
  text: 'Und sie singen ein neues Lied und sagen: „Du bist würdig, die Schriftrolle zu nehmen und ihre Siegel zu öffnen; denn du wurdest geschlachtet und hast mit deinem Blut[a] für Gott[b] Menschen[c] aus jedem Stamm und jeder Sprache und jedem Volk und jeder Nation erkauft.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch dein Blut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Gott zu eigen“.'
    reason: lexical_alternative
  - marker: c
    text: Das Wort „Menschen“ steht nicht ausdrücklich im griechischen Text, ist aber als Objekt sinngemäß zu ergänzen.
    reason: textual_clarity
lexical_decisions:
- source_word: ᾄδουσιν
  choice: sie singen
  rationale: Das Präsens wird als lebendiges Erzählpräsens wiedergegeben; ein Zusatz wie „Loblieder“ wäre im Verb nicht ausdrücklich enthalten.
- source_word: ᾠδὴν καινὴν
  choice: ein neues Lied
  rationale: Die geläufige Formulierung bewahrt das biblische Motiv des neuen Liedes.
- source_word: Ἄξιος εἶ
  choice: Du bist würdig
  rationale: Natürliches, würdevolles modernes Deutsch, das den direkten Zuruf erhält.
- source_word: τὸ βιβλίον
  choice: die Schriftrolle
  rationale: Gemeint ist hier ein antikes, mit Siegeln verschlossenes Schriftstück; „Schriftrolle“ bezeichnet den Gegenstand genauer als „Buch“.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: ihre Siegel zu öffnen
  rationale: Die Formulierung folgt der griechischen Wendung, ohne sie deutend zu „die Siegel zu brechen“ zu erweitern.
- source_word: ἐσφάγης
  choice: du wurdest geschlachtet
  rationale: „Geschlachtet“ erhält sowohl die gewaltsame als auch die im Bild des Lammes mitschwingende Opferkonnotation von σφάζω; „getötet“ wäre allgemeiner.
- source_word: ἠγόρασας
  choice: erkauft
  rationale: „Erkauft“ gibt den Erwerbsvorgang wieder und passt im Deutschen zur Angabe des Preises durch das Blut, ohne das Verb bereits als umfassende Lehrformel auszudeuten.
- source_word: τῷ θεῷ
  choice: für Gott
  rationale: Der Dativ bezeichnet hier am natürlichsten den, für den die Menschen erworben wurden.
- source_word: ἐν τῷ αἵματί σου
  choice: mit deinem Blut
  rationale: Die Präposition bezeichnet in diesem Zusammenhang das Mittel beziehungsweise den Preis. „Mit deinem Blut“ ist im Deutschen natürlich und bleibt nahe am Bild.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: aus jedem Stamm und jeder Sprache und jedem Volk und jeder Nation
  rationale: Die viergliedrige, weltumspannende Formel und ihre wiederholte Verbindung mit „und“ bleiben erhalten.
theological_decisions:
- issue: Das direkte Objekt von ἠγόρασας ist im griechischen Satz nicht ausdrücklich genannt.
  choice: „Menschen“ wird als sinngemäßes Objekt ergänzt und durch eine Fußnote kenntlich gemacht.
  alternative: 'Das Objekt unausgesprochen lassen: „du hast für Gott aus jedem Stamm … erkauft“.'
  rationale: Ein ausdrückliches Objekt ist für einen verständlichen deutschen Satz nahezu erforderlich. Der Zusammenhang zeigt, dass Menschen gemeint sind; die Ergänzung legt keine engere dogmatische Deutung fest.
- issue: Bedeutung des Blutes des Lammes
  choice: Das konkrete Opferbild bleibt in „mit deinem Blut“ unverändert erhalten.
  alternative: 'Deutend verallgemeinern: „durch deinen Tod“.'
  rationale: Der Ausgangstext nennt ausdrücklich das Blut. Die Übersetzung bewahrt diese Aussage, ohne sie zu einer weitergehenden Sühneformel auszubauen.
- issue: Empfänger beziehungsweise Nutznießer des Erkaufens
  choice: τῷ θεῷ wird mit „für Gott“ wiedergegeben.
  alternative: „Gott zu eigen“ oder formal „Gott“.
  rationale: „Für Gott“ wahrt die Dativbeziehung und vermeidet sowohl unnatürliches Deutsch als auch eine unnötige Ausdeutung des Besitzverhältnisses.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Ton. Die markante Wiederholung „und … und … und“ in der weltweiten Viererformel wurde bewusst bewahrt. „Geschlachtet“ ist kräftig, entspricht jedoch dem Bild des geschlachteten Lammes und der Wortwahl des Ausgangstextes.
