id: REV.9.21
reference: Revelation 9:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: de
  text: Und sie kehrten weder von ihren Morden noch von ihrer Zauberei[a] noch von ihrer sexuellen Unmoral noch von ihren Diebstählen um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „magische Künste“; das griechische Wort kann auch Zaubermittel, Tränke, Gifte oder Vergiftungen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν
  choice: bereuten
  rationale: Das Verb bezeichnet hier angesichts der folgenden Vergehen moralische Umkehr und Reue, nicht bloß eine Meinungsänderung. „Bereuten“ verbindet sich im Deutschen natürlich mit den aufgezählten Akkusativobjekten.
- source_word: ἐκ
  choice: ihre
  rationale: Die wiederholte Verbindung μετανοέω ἐκ bezeichnet das Abwenden von bestimmten Vergehen. Im idiomatischen Deutschen wird dies mit „etwas bereuen“ und direktem Objekt wiedergegeben, statt mit dem schwerfälligen „von etwas umkehren“.
- source_word: φόνων
  choice: Mordtaten
  rationale: φόνος bezeichnet schuldhaftes Töten beziehungsweise Mord. „Mordtaten“ bewahrt die moralisch-strafrechtliche Schärfe und klingt in der pluralischen Aufzählung natürlich.
- source_word: φαρμάκων
  choice: Zauberei
  rationale: Im apokalyptischen Zusammenhang bezeichnet der Ausdruck wahrscheinlich okkulte oder magische Praktiken. Das Kollektivwort „Zauberei“ ist im modernen Deutschen natürlicher als ein künstlicher Plural; die mögliche Verbindung mit Zaubermitteln, Tränken oder Gift wird in einer Fußnote offengehalten.
- source_word: πορνείας
  choice: sexuelle Unmoral
  rationale: πορνεία ist ein weiter Sammelbegriff für moralisch verurteiltes sexuelles Verhalten. „Sexuelle Unmoral“ ist gegenwärtig verständlich und weniger eng oder altertümlich als „Unzucht“ beziehungsweise „Hurerei“.
- source_word: κλεμμάτων
  choice: Diebstähle
  rationale: κλέμμα bezeichnet Gestohlenes oder einen Diebstahl; in dieser Lasterliste gibt „Diebstähle“ den Sinn knapp und natürlich wieder.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: weder ... noch ... noch ... noch
  rationale: Nach der Verneinung bildet „weder … noch“ im Deutschen eine klare, rhythmische Aufzählung und gibt die wiederholten οὔτε-Verknüpfungen vollständig wieder.
theological_decisions:
- issue: Bedeutungsumfang von φαρμάκων in der apokalyptischen Lasterliste
  choice: Zauberei
  alternative: Zaubermittel, magische Tränke oder Vergiftungen
  rationale: Der Kontext der Offenbarung und der Gebrauch verwandter Wörter sprechen vor allem für magische beziehungsweise okkulte Praktiken. Da das griechische Wort zugleich Mittel, Tränke oder Gifte bezeichnen kann, wird diese echte lexikalische Breite nicht im Haupttext auf eine einzige Nebenbedeutung verengt, sondern in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vierfache weder-noch-Struktur bewahrt den Nachdruck der griechischen Aufzählung. „Sexuelle Unmoral“ ist bewusst breit und gegenwärtig verständlich; „Zauberei“ wird als natürliches deutsches Kollektivwort verwendet.
