id: REV.9.19
reference: Revelation 9:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: de
  text: Denn die Macht der Pferde liegt in ihren Mäulern und in ihren Schwänzen; denn ihre Schwänze sind Schlangen ähnlich, haben Köpfe und richten mit ihren Schwänzen Schaden an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: Macht
  rationale: Im Zusammenhang der apokalyptischen Vision bezeichnet das Wort die wirksame Fähigkeit der Pferde, Schaden anzurichten, nicht in erster Linie eine übertragene Vollmacht.
- source_word: στόματι
  choice: Maul
  rationale: Bei Pferden ist »Maul« die natürliche deutsche Bezeichnung. Der griechische Singular wird beibehalten, da er distributiv auf die mehreren Pferde bezogen ist.
- source_word: οὐραῖς
  choice: Schwänzen
  rationale: Dies ist die direkte und bildlich klare Wiedergabe des ausdrücklichen Plurals.
- source_word: ὅμοιαι ὄφεσιν
  choice: Schlangen ähnlich
  rationale: Die Formulierung bewahrt den Vergleich und entspricht einem würdigen, natürlichen deutschen Erzählstil.
- source_word: ἔχουσαι κεφαλάς
  choice: haben Köpfe
  rationale: Das Partizip wird als finites Verb wiedergegeben, damit die anschauliche Beschreibung im Deutschen flüssig bleibt.
- source_word: ἐν αὐταῖς ... ἀδικοῦσιν
  choice: mit ihnen richten sie Schaden an
  rationale: ἐν ist hier instrumental zu verstehen; ἀδικέω bezeichnet in diesem Kontext konkretes Schädigen statt abstraktes Unrechttun.
- source_word: γάρ
  choice: denn / nämlich
  rationale: Beide Vorkommen sind begründend beziehungsweise erläuternd. Die Variation gibt ihre Funktion in natürlichem Deutsch wieder.
theological_decisions:
- issue: Apokalyptisches Bild der Schwänze und Köpfe
  choice: Das visionäre Bild wird ohne allegorische Deutung unmittelbar wiedergegeben.
  alternative: Die Schwänze ausdrücklich als falsche Lehre oder dämonische Mächte deuten.
  rationale: Eine solche symbolische Zuordnung steht nicht im griechischen Wortlaut dieses Verses und soll daher nicht in die Übersetzung eingetragen werden.
- issue: Bezug von αὐταῖς in der Schlussklausel
  choice: »mit ihnen« bezieht sich grammatisch auf die Schwänze, die zuvor als schlangenähnlich und mit Köpfen versehen beschrieben werden.
  alternative: Den Schaden ausdrücklich allein den Köpfen zuschreiben.
  rationale: Das feminine Pronomen stimmt mit »Schwänzen« überein; die Köpfe sind im Griechischen Neutrum. Die Übersetzung lässt das ungewöhnliche Gesamtbild bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am Griechischen, während »Maul«, »nämlich« und »Schaden anrichten« für gewöhnliche heutige Leser natürlich klingen. Keine Fußnoten erforderlich.
