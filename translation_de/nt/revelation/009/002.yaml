id: REV.9.2
reference: Revelation 9:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: de
  text: Und er öffnete den Schacht zum Abgrund[a]. Da stieg Rauch aus dem Schacht auf wie der Rauch eines großen Ofens, und die Sonne und die Luft wurden vom Rauch aus dem Schacht verfinstert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Schacht des Abgrunds“; möglich ist: „die Grube des Abgrunds“. Traditionell: „der Brunnen des Abgrunds“.'
    reason: Die Genitivverbindung und der Bedeutungsumfang von φρέαρ lassen mehrere deutsche Wiedergaben zu; die Fußnote kennzeichnet die unmittelbare Formulierung und eine traditionelle deutsche Bibelwendung, ohne „bodenlos“ in den Wortlaut einzutragen.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: öffnete
  rationale: Die einfache Vergangenheitsform gibt den Aorist von ἀνοίγω sachgerecht wieder, ohne die Art des Öffnens näher festzulegen.
- source_word: τὸ φρέαρ τῆς ἀβύσσου
  choice: den Schacht zum Abgrund
  rationale: φρέαρ bezeichnet hier die schachtartige Öffnung beziehungsweise den Zugang, während ἄβυσσος den Abgrund selbst meint. „Zum Abgrund“ drückt diese Beziehung im Deutschen natürlicher aus als „des Abgrunds“, ohne beide Größen gleichzusetzen.
- source_word: ἀνέβη καπνὸς
  choice: stieg Rauch … auf
  rationale: Bewahrt die ausdrücklich aufwärts gerichtete Bewegung von ἀναβαίνω und klingt im Deutschen idiomatisch.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: wie der Rauch eines großen Ofens
  rationale: Gibt den mit ὡς markierten Vergleich und die Größe des Ofens direkt wieder; „Ofen“ ist hier verständlich und umfasst einen großen Brenn- oder Schmelzofen.
- source_word: ἐσκοτώθη
  choice: wurden … verfinstert
  rationale: Erhält die passive Bedeutung und bezieht das singuläre griechische Verb im idiomatischen Deutsch auf das zusammengesetzte Subjekt „die Sonne und die Luft“.
- source_word: ὁ ἀὴρ
  choice: die Luft
  rationale: Direkte Wiedergabe der Luft beziehungsweise Atmosphäre; „Himmel“ würde das Bild unnötig verschieben.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: vom Rauch aus dem Schacht
  rationale: „Vom“ vermittelt die Ursache der Verfinsterung, „aus dem Schacht“ zugleich die Herkunft des Rauchs.
theological_decisions:
- issue: Apokalyptische Ortsbezeichnung ohne traditionelle Ausdeutung wiedergeben
  choice: „der Schacht zum Abgrund“
  alternative: „der Brunnen des Abgrunds“; „die Grube des Abgrunds“; traditionell „der bodenlose Abgrund“
  rationale: „Abgrund“ gibt ἄβυσσος wieder, ohne die im Vers nicht ausdrücklich enthaltene Eigenschaft „bodenlos“ einzutragen. „Schacht“ hält die Zugangsöffnung vom Abgrund selbst begrifflich auseinander.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze erhalten den eindringlichen Erzählrhythmus. Die Wiederholung von „Schacht“ und „Rauch“ bleibt entsprechend dem griechischen Text bewusst erhalten.
