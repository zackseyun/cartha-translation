id: REV.9.4
reference: Revelation 9:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: de
  text: Und ihnen wurde gesagt, sie sollten weder dem Gras der Erde noch irgendetwas Grünem noch irgendeinem Baum Schaden zufügen, sondern nur den Menschen, die das Siegel Gottes nicht auf ihrer Stirn tragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: ihnen wurde gesagt
  rationale: Die unpersönliche Passivform bleibt erhalten, ohne den im Griechischen ungenannten Sprecher zu bestimmen oder die Aussage ausdrücklich als Befehl zu kennzeichnen.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: sie sollten … keinen Schaden zufügen
  rationale: Im Zusammenhang des Gerichts bezeichnet ἀδικέω schädigendes Einwirken; die deutsche Konstruktion gibt zugleich die abhängige Anweisung natürlich wieder.
- source_word: τὸν χόρτον τῆς γῆς
  choice: dem Gras der Erde
  rationale: χόρτος bezeichnet hier Gras beziehungsweise niedrige Vegetation; der Genitiv und die umfassende Bildsprache bleiben gewahrt.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: noch irgendetwas Grünem
  rationale: Das substantivierte χλωρόν bedeutet wörtlich etwas Grünes. Die Wiedergabe bleibt bewusst weiter als „grüne Pflanze“ und passt zur Vegetationsreihe.
- source_word: οὐδὲ πᾶν δένδρον
  choice: noch irgendeinem Baum
  rationale: Direkte, idiomatische Wiedergabe des koordinierten Ausdrucks.
- source_word: εἰ μὴ
  choice: sondern nur
  rationale: Die Wendung führt hier die einzige Gruppe ein, der Schaden zugefügt werden darf.
- source_word: τοὺς ἀνθρώπους
  choice: den Menschen
  rationale: ἄνθρωποι meint Menschen allgemein und ist nicht auf männliche Personen beschränkt.
- source_word: οἵτινες οὐκ ἔχουσι
  choice: die … nicht … tragen
  rationale: Bei einem Siegel auf der Stirn ist „tragen“ im Deutschen natürlicher als „haben“, ohne den Sinn zu verändern.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: das Siegel Gottes
  rationale: Die wichtige apokalyptische Bezeichnung für göttliche Zugehörigkeit und Schutz sowie die Genitivbeziehung werden bewahrt.
- source_word: ἐπὶ τῶν μετώπων
  choice: auf ihrer Stirn
  rationale: Natürliches Deutsch verwendet bei mehreren Menschen distributiv häufig den Singular „ihrer Stirn“; gemeint ist jeweils die Stirn der betreffenden Person.
theological_decisions:
- issue: Umfang von ἀνθρώπους
  choice: Menschen allgemein
  alternative: nur Männer
  rationale: Der Gegensatz besteht zwischen der Vegetation und den Menschen ohne Gottes Siegel; der Text bietet keine Einschränkung auf männliche Personen.
- issue: Urheber und Nachdruck der Anweisung
  choice: passive, autoritative Anweisung mit ungenanntem Sprecher
  alternative: ausdrücklicher Befehl Gottes
  rationale: ἐρρέθη nennt den Sprecher nicht. Der Zusammenhang legt göttliche Autorität nahe, doch die Übersetzung ergänzt kein ausdrücklich genanntes Subjekt.
- issue: Bedeutung des Siegels Gottes
  choice: das Bild ohne erklärende Deutung stehen lassen
  alternative: das Siegel ausdrücklich als Eigentums- oder Schutzzeichen auslegen
  rationale: Der Vers nennt das Siegel, entfaltet hier aber nicht abschließend seine genaue theologische Funktion; die Spannung des Bildes bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Reihung mit „weder … noch … noch“ bildet die Struktur des griechischen Satzes klar ab. Keine Fußnote ist nötig, da „irgendetwas Grünem“ die lexikalische Weite von πᾶν χλωρόν unmittelbar im Haupttext erhält.
