id: REV.9.1
reference: Revelation 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: de
  text: Und der fünfte Engel blies die Posaune. Da sah ich einen Stern[c], der vom Himmel auf die Erde gefallen war[a], und ihm wurde der Schlüssel zum Schacht des Abgrunds[b] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „einen vom Himmel auf die Erde gefallenen Stern“. Die gewählte Form macht deutlicher, dass der Fall bereits geschehen war, als Johannes den Stern sah.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „zur Grube des Abgrunds“ oder „zum Brunnen des Abgrunds“.'
    reason: lexical_alternative
  - marker: c
    text: 'Der „Stern“ kann ein personales Wesen symbolisieren, denn der Text fährt fort: „ihm wurde der Schlüssel … gegeben“. Wer damit gemeint ist, wird hier nicht ausdrücklich gesagt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: blies die Posaune
  rationale: Das Verb σαλπίζω bezeichnet das Blasen bzw. Ertönenlassen einer Trompete oder Posaune. „Blies die Posaune“ ist im Deutschen natürlich und bewahrt das im Verb enthaltene Instrumentenbild.
- source_word: ἀστέρα
  choice: einen Stern
  rationale: ἀστήρ bedeutet wörtlich „Stern“. Auch wenn das Bild hier auf ein personales Wesen weisen kann, soll die Übersetzung diese Identität nicht vorwegnehmen.
- source_word: πεπτωκότα
  choice: der … gefallen war
  rationale: Das Perfektpartizip bezeichnet einen bereits vollzogenen Fall mit fortbestehendem Ergebnis. Das Plusquamperfekt macht deutlich, dass der Stern schon gefallen war, als Johannes ihn sah.
- source_word: ἐκ τοῦ οὐρανοῦ … εἰς τὴν γῆν
  choice: vom Himmel auf die Erde
  rationale: „Himmel“ passt zum visionären Zusammenhang der Offenbarung; „auf die Erde“ gibt die Zielrichtung von εἰς idiomatisch wieder.
- source_word: ἐδόθη αὐτῷ
  choice: ihm wurde … gegeben
  rationale: Die Passivform bleibt erhalten, sodass der im Griechischen nicht genannte Geber nicht ausdrücklich identifiziert wird.
- source_word: ἡ κλεὶς
  choice: der Schlüssel
  rationale: Der bestimmte Artikel im Griechischen wird mit „der“ wiedergegeben.
- source_word: τοῦ φρέατος
  choice: zum Schacht
  rationale: φρέαρ kann Brunnen, Grube oder Schacht bedeuten. „Schacht“ bezeichnet hier anschaulich den Zugang zum Abgrund und hält ihn vom Abgrund selbst begrifflich auseinander.
- source_word: τῆς ἀβύσσου
  choice: des Abgrunds
  rationale: ἄβυσσος bezeichnet die unergründliche Tiefe bzw. den Abgrund. „Abgrund“ ist im Deutschen verständlich, würdevoll und weniger deutend als „bodenlose Grube“.
theological_decisions:
- issue: Identität des als Stern dargestellten Wesens
  choice: Im Haupttext bleibt „Stern“ stehen; die mögliche Personalität wird nur in einer Fußnote erläutert.
  alternative: Den Stern ausdrücklich als Engel oder als Satan bezeichnen.
  rationale: Der Text nennt einen Stern und gebraucht anschließend das maskuline Pronomen αὐτῷ. Das legt ein personales Wesen oder eine Personifikation nahe, identifiziert es aber nicht ausdrücklich.
- issue: Nicht genannter Geber des Schlüssels
  choice: Das Passiv „wurde gegeben“ bleibt ohne ausdrückliches Subjekt erhalten.
  alternative: „Gott gab ihm den Schlüssel.“
  rationale: Die göttliche Autorisierung liegt im Kontext nahe, doch das griechische Passiv nennt den Handelnden nicht. Die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. „Posaune“ folgt dem vertrauten biblischen Sprachgebrauch. Die Satzteilung nach dem ersten Teilsatz fördert die Lesbarkeit, ohne die Abfolge des griechischen Textes zu verändern.
