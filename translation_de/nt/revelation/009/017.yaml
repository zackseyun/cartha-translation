id: REV.9.17
reference: Revelation 9:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: de
  text: 'Und so sah ich in der Vision die Pferde und die, die auf ihnen saßen: Sie trugen feurige, hyazinthfarbene und schwefelfarbene Brustpanzer.[a] Die Köpfe der Pferde waren wie Löwenköpfe, und aus ihren Mäulern kommen Feuer, Rauch und Schwefel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die drei Wörter können auch stärker als Farbangaben verstanden werden: »feuerrot, hyazinthblau und schwefelgelb«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: so
  rationale: Das natürliche deutsche »so« bewahrt die Angabe der Art und Weise, ohne das demonstrative Element unnötig auszubauen.
- source_word: ἐν τῇ ὁράσει
  choice: in der Vision
  rationale: Im apokalyptischen Zusammenhang bezeichnet ὅρασις eine visionäre Schau; »Vision« ist im modernen Standarddeutsch klar und treffend.
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: die, die auf ihnen saßen
  rationale: Die partizipiale Wendung wird ausdrücklich wiedergegeben und nicht lediglich zu »Reiter« verkürzt.
- source_word: θώρακας
  choice: Brustpanzer
  rationale: »Brustpanzer« gibt das konkrete Rüstungsteil präzise und allgemein verständlich wieder.
- source_word: πυρίνους
  choice: feurige
  rationale: Die Wiedergabe bewahrt sowohl die Verbindung zum Feuer als auch die mögliche Farbbedeutung, ohne sie auf »rot« festzulegen.
- source_word: ὑακινθίνους
  choice: hyazinthfarbene
  rationale: Die Wortverbindung zum Hyazinth wird erhalten; eine genauere Festlegung auf Blau oder Blauviolett würde die im Ausdruck liegende Unschärfe reduzieren.
- source_word: θειώδεις
  choice: schwefelfarbene
  rationale: In der koordinierten visuellen Beschreibung ist eine Farbangabe wahrscheinlich; »schwefelfarben« bewahrt zugleich die unmittelbare Verbindung zum Schwefel.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: wie Löwenköpfe
  rationale: Die knappe deutsche Vergleichsform entspricht dem griechischen Bild natürlich und genau.
- source_word: ἐκπορεύεται
  choice: kommen
  rationale: Das Präsens der Vision bleibt als anschauliches Präsens erhalten; beim nachgestellten mehrteiligen Subjekt ist der Plural im Deutschen idiomatisch.
- source_word: θεῖον
  choice: Schwefel
  rationale: »Schwefel« ist die präzise, moderne Bezeichnung des Stoffes und bedarf keiner archaisierenden Alternative.
theological_decisions:
- issue: Deutung der drei Adjektive zu den Brustpanzern
  choice: feurige, hyazinthfarbene und schwefelfarbene
  alternative: feuerrote, hyazinthblaue und schwefelgelbe
  rationale: Der visionäre Zusammenhang legt Farbbezeichnungen nahe, doch die griechischen Adjektive benennen die konkreten Farbtöne nicht durchgängig ausdrücklich. Die gewählte Form bewahrt die Bildbezüge und vermeidet eine übergenaue Festlegung auf Rot, Blau und Gelb.
- issue: Zuordnung der Brustpanzer
  choice: Die auf den Pferden Sitzenden tragen die Brustpanzer
  alternative: Die Pferde und ihre Reiter werden gemeinsam mit Brustpanzern beschrieben
  rationale: Das maskuline Partizip ἔχοντας schließt syntaktisch unmittelbar an die ebenfalls maskulin pluralischen Sitzenden an und bezeichnet daher am natürlichsten deren Rüstung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Das anschauliche Präsens »kommen« folgt dem griechischen Text; die ungewöhnlichen Farbwörter der Vision werden verständlich, aber ohne unnötige Präzisierung wiedergegeben.
