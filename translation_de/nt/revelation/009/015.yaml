source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: de
  text: Und die vier Engel, die für die Stunde, den Tag, den Monat und das Jahr bereitgemacht worden waren,[a] wurden losgelassen, um ein Drittel der Menschen zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die für diese Stunde und diesen Tag und diesen Monat und dieses Jahr bereitgemacht worden waren“. Die griechische Formulierung kann einen genau festgesetzten Zeitpunkt betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: wurden losgelassen
  rationale: Der Aorist Passiv von λύω knüpft an die zuvor gebundenen Engel an. „Losgelassen“ bewahrt das Bild des Lösens und klingt im heutigen Deutsch natürlich.
- source_word: ἄγγελοι
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang sind übernatürliche Wesen gemeint, nicht menschliche Boten.
- source_word: ἡτοιμασμένοι
  choice: bereitgemacht worden waren
  rationale: Das Perfekt Passiv bezeichnet eine vorausgegangene Vorbereitung mit fortbestehendem Ergebnis; die deutsche Vorvergangenheit gibt dieses Verhältnis verständlich wieder.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: für die Stunde, den Tag, den Monat und das Jahr
  rationale: Die Reihung der Zeitangaben und ihre kumulative Genauigkeit bleiben erhalten. Der Artikel wird im Deutschen bei jedem Glied aufgenommen, ohne die Wendung als Dauer oder berechenbares Schema festzulegen.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den finalen Sinn der Konstruktion idiomatisch wieder.
- source_word: ἀποκτείνωσιν
  choice: sie ... töteten
  rationale: Der Konjunktiv unter ἵνα bezeichnet den Zweck der Freilassung. „Töten“ ist die klare, gegenwärtige Entsprechung ohne altertümliche Färbung.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: ein Drittel der Menschen
  rationale: Die partitive Wendung bedeutet „ein Drittel“. ἄνθρωποι meint hier Menschen allgemein; „der Menschen“ ist geschlechtsübergreifend, konkret und natürlich.
theological_decisions:
- issue: Bedeutung der Zeitangabe „die Stunde, der Tag, der Monat und das Jahr“
  choice: Die Formulierung wird als genaue, festgesetzte Zeitangabe bewahrt, ohne ihre apokalyptische Chronologie näher auszudeuten.
  alternative: Die Wendung könnte als Gesamtdauer von einem Jahr, einem Monat, einem Tag und einer Stunde verstanden oder ausdrücklich als „für genau diese Stunde ...“ wiedergegeben werden.
  rationale: Die griechische Reihung unter einem Artikel legt kumulative zeitliche Bestimmtheit nahe, entscheidet aber nicht zweifelsfrei zwischen Zeitpunkt und Dauer. Die Übersetzung wahrt diese Spannung.
- issue: Umfang von ἀνθρώπων
  choice: Menschen allgemein
  alternative: „Menschheit“ oder das traditionell mehrdeutige „Männer“
  rationale: Das Substantiv bezeichnet hier Menschen ohne Beschränkung auf männliche Personen. „Menschen“ gibt den generischen Bezug präzise wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Ablauf, wird aber durch Kommas und die finite Relativkonstruktion natürlich lesbar gehalten. Der Ausdruck „ein Drittel der Menschen“ vermeidet sowohl eine männliche Engführung als auch das abstraktere „Menschheit“.
