revisions:
- from: Auch die übrigen Menschen, die durch diese Plagen nicht getötet worden waren, kehrten nicht einmal um und wandten sich von den Werken ihrer Hände ab[b], um die Dämonen und die Götzen aus Gold, Silber, Bronze, Stein und Holz nicht länger anzubeten[a] – Götzen, die weder sehen noch hören noch gehen können.
  to: Auch die übrigen Menschen, die durch diese Plagen nicht getötet worden waren, kehrten nicht einmal von den Werken ihrer Hände um, um die Dämonen und die Götzen aus Gold, Silber, Bronze, Stein und Holz nicht anzubeten – Götzen, die weder sehen noch hören noch gehen können.
  rationale: Die Revision bewahrt die emphatische Fortführung durch „nicht einmal“, die konkrete Wendung „Werke ihrer Hände“, die Zweck-/Folgenambiguität von ἵνα μή und die auf die Götzen beschränkte Relativkonstruktion. Zugleich entfernt sie nicht ausdrücklich im Griechischen enthaltene Erläuterungen und die zeitliche Zuspitzung „nicht länger“.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben. Die Ergänzungen „wandten sich ... ab“ und besonders „nicht länger“ gehen jedoch über den griechischen Wortlaut hinaus: μετανοεῖν ἐκ bezeichnet bereits die Umkehr/Abkehr, und ἵνα μή enthält kein ausdrückliches temporales „länger“ bzw. „mehr“.'
  naturalness: Die Übersetzung ist insgesamt modernes, würdiges Standarddeutsch. „Von den Werken ihrer Hände umkehren“ ist in diesem biblisch geprägten Kontext verständlich und vermeidet die doppelte, erklärende Verbfügung des Entwurfs.
  terminology: „Menschen“, „Plagen“, „umkehren“, „Dämonen“ und „Götzen“ sind angemessen. Die wiederholte Nennung von „Götzen“ stellt klar, dass sich der Relativsatz auf die Götzen und nicht zugleich auf Dämonen bezieht.
  issues:
  - severity: medium
    issue: Die Formulierung „kehrten nicht einmal um und wandten sich von den Werken ihrer Hände ab“ entfaltet ein einzelnes griechisches Prädikat in zwei eigenständige Aussagen.
    rationale: μετενόησαν ἐκ τῶν ἔργων bezeichnet die Umkehr von diesen Werken. Die zusätzliche Aussage ist zwar kontextuell plausibel, aber unnötig explizierend und schwächt die knappe Struktur des Ausgangstextes.
  - severity: medium
    issue: „Nicht länger anzubeten“ fügt eine zeitliche Komponente hinzu.
    rationale: Das griechische ἵνα μή προσκυνήσουσιν drückt Zweck bzw. beabsichtigte Folge aus, nicht ausdrücklich die Beendigung einer zuvor fortdauernden Handlung. „Nicht anzubeten“ bewahrt die Formulierung ohne diesen Zusatz.
  revised_text: Auch die übrigen Menschen, die durch diese Plagen nicht getötet worden waren, kehrten nicht einmal von den Werken ihrer Hände um, um die Dämonen und die Götzen aus Gold, Silber, Bronze, Stein und Holz nicht anzubeten – Götzen, die weder sehen noch hören noch gehen können.
  revised_footnotes:
  - marker: a
    text: 'Die griechische Satzverbindung kann den Zweck oder die beabsichtigte Folge der Umkehr ausdrücken; auch möglich: „sodass sie die Dämonen und die Götzen nicht anbeteten“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Sie kehrten nicht von den Werken ihrer Hände um“. Gemeint sind hier besonders die Dinge, die sie selbst hergestellt und verehrt hatten.'
    reason: lexical_alternative
  revision_rationale: Die Revision bewahrt die emphatische Fortführung durch „nicht einmal“, die konkrete Wendung „Werke ihrer Hände“, die Zweck-/Folgenambiguität von ἵνα μή und die auf die Götzen beschränkte Relativkonstruktion. Zugleich entfernt sie nicht ausdrücklich im Griechischen enthaltene Erläuterungen und die zeitliche Zuspitzung „nicht länger“.
