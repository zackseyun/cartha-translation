id: REV.9.20
reference: Revelation 9:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: de
  text: Auch die übrigen Menschen, die durch diese Plagen nicht getötet worden waren, kehrten nicht einmal von den Werken ihrer Hände um, um die Dämonen und die Götzen aus Gold, Silber, Bronze, Stein und Holz nicht anzubeten – Götzen, die weder sehen noch hören noch gehen können.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: die übrigen Menschen
  rationale: Die Wendung bezeichnet die verbleibenden Menschen insgesamt; ἀνθρώπων ist hier generisch und nicht auf Männer beschränkt.
- source_word: ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: durch diese Plagen nicht getötet worden waren
  rationale: Der passive Aorist wird im Rückblick auf die bereits geschilderten Plagen natürlich mit deutschem Plusquamperfekt wiedergegeben; ἐν kann hier das Mittel beziehungsweise den Wirkungsbereich bezeichnen.
- source_word: οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: kehrten nicht einmal um und wandten sich von den Werken ihrer Hände ab
  rationale: οὐδέ trägt hier steigernde Kraft. μετανοεῖν mit ἐκ bezeichnet eine Umkehr weg von etwas; die koordinierte deutsche Formulierung macht diese Bewegungsrichtung verständlich und bewahrt zugleich das konkrete Bild der Handwerke.
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: um … nicht länger anzubeten
  rationale: Die Formulierung gibt den Zweck beziehungsweise die beabsichtigte Folge der Umkehr wieder. „Nicht länger“ verdeutlicht im Deutschen, dass es um das Aufgeben einer bestehenden Verehrung geht, ohne die syntaktische Nuance dogmatisch festzulegen.
- source_word: τὰ δαιμόνια
  choice: die Dämonen
  rationale: δαιμόνια bezeichnet im neutestamentlichen Zusammenhang feindliche Geistwesen; „Dämonen“ ist die klare und etablierte deutsche Entsprechung.
- source_word: τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: die Götzen aus Gold, Silber, Bronze, Stein und Holz
  rationale: εἴδωλα meint kultisch verehrte Götzenbilder. Die Materialangaben werden in natürlichem Deutsch kumulativ aufgeführt; die Artikelkraft bleibt durch „die Götzen“ erhalten.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: Götzen, die weder sehen noch hören noch gehen können
  rationale: Die dreigliedrige Aussage verspottet die Ohnmacht der Götzen. περιπατεῖν wird konkret als „gehen“ wiedergegeben und nicht zum allgemeineren „sich bewegen“ abgeschwächt.
theological_decisions:
- issue: Verhältnis von Umkehr und Aufgabe des Götzendienstes in ἵνα μὴ προσκυνήσουσιν
  choice: 'Zweck beziehungsweise beabsichtigte Folge: „um … nicht länger anzubeten“'
  alternative: 'Folge: „sodass sie … nicht mehr anbeteten“'
  rationale: ἵνα μή kann Zweck oder beabsichtigte Folge ausdrücken. Der Haupttext bewahrt den engeren Zusammenhang zwischen Umkehr und Abkehr vom Götzendienst; die Fußnote nennt die mögliche Ergebnisnuance.
- issue: Bedeutung der „Werke ihrer Hände“
  choice: Das biblische Bild bleibt im Haupttext erhalten und wird kontextuell auf die hergestellten und verehrten Götzen bezogen.
  alternative: „von dem, was sie mit ihren Händen gemacht hatten“
  rationale: Die Wendung kann menschliche Taten allgemein bezeichnen, weist hier durch die anschließende Götzenliste jedoch besonders auf selbst gefertigte Kultbilder. Die Übersetzung legt sie nicht ausschließlich darauf fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Umkehren“ bewahrt den biblisch-theologischen Gehalt von μετανοεῖν, während „wandten sich … ab“ die im Griechischen ausdrücklich bezeichnete Abkehr natürlich erklärt. Die Wiederaufnahme mit „Götzen“ verhindert einen unklaren Bezug des Relativsatzes auf Dämonen und Götzen zugleich.
