source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: de
  text: Und die Gestalten der Heuschrecken glichen Pferden, die zum Kampf gerüstet waren. Auf ihren Köpfen waren gleichsam Kronen[a], die Gold glichen, und ihre Gesichter waren wie Menschengesichter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Siegeskränze“; das griechische Wort στέφανοι kann kranzartige Kronen bezeichnen, die mit Ehre oder Sieg verbunden sind.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Gesichter von Menschen“; der griechische Ausdruck ist allgemein gemeint und bezeichnet nicht speziell Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὁμοιώματα τῶν ἀκρίδων
  choice: die Gestalten der Heuschrecken
  rationale: ὁμοίωμα bezeichnet Gestalt, Erscheinung oder Ähnlichkeit. „Gestalten“ bewahrt den bildhaften Charakter der Vision und die Mehrzahl des griechischen Ausdrucks, ohne die Wesen mit gewöhnlichen Heuschrecken gleichzusetzen.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: glichen Pferden, die zum Kampf gerüstet waren
  rationale: Die Formulierung erhält den ausdrücklichen Vergleich und gibt den durch das Perfektpartizip bezeichneten Zustand anhaltender Kampfbereitschaft in natürlichem Deutsch wieder.
- source_word: ὡς στέφανοι
  choice: sah es aus wie Kronen
  rationale: ὡς kennzeichnet eine wahrgenommene Ähnlichkeit. Die Wiedergabe beschreibt daher den visionären Eindruck, statt eine buchstäbliche Identität zu behaupten.
- source_word: στέφανοι
  choice: Kronen
  rationale: στέφανος kann eine Krone oder einen Ehren- beziehungsweise Siegeskranz bezeichnen. „Kronen“ ist im Haupttext verständlich und hinreichend offen; die engere Alternative wird in der Fußnote genannt.
- source_word: ὅμοιοι χρυσῷ
  choice: die Gold glichen
  rationale: Der Ausdruck bezeichnet Ähnlichkeit mit Gold, nicht ausdrücklich Material oder bloß eine goldene Farbe. „Gold glichen“ bewahrt diesen Vergleich.
- source_word: πρόσωπα ἀνθρώπων
  choice: Menschengesichter
  rationale: Die kompakte deutsche Bildung gibt „Gesichter von Menschen“ natürlich wieder. ἄνθρωπος ist hier generisch und nicht auf Männer beschränkt.
theological_decisions:
- issue: Vergleichssprache in der apokalyptischen Vision
  choice: 'Die wiederholten Vergleichssignale werden ausdrücklich beibehalten: „glichen“, „sah es aus wie“ und „glichen“.'
  alternative: Die Wesen und Gegenstände unmittelbar als Pferde, Kronen aus Gold und menschliche Gesichter bezeichnen.
  rationale: ὅμοια und ὡς beschreiben Ähnlichkeit beziehungsweise visionären Eindruck. Eine stärker festlegende Wiedergabe würde die Bildsprache unzulässig als Aussage über die tatsächliche Beschaffenheit auslegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildfolge bleibt anschaulich und verständlich; zugleich wird die mehrfach abgestufte Vergleichssprache der griechischen Vision nicht eingeebnet.
