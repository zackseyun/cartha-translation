  source_fidelity: 'Die zentrale Bildsprache und die Vergleichsmarker werden insgesamt zutreffend wiedergegeben: τὰ ὁμοιώματα bleibt als pluralische „Gestalten“ erhalten, die zum Kampf gerüsteten Pferde entsprechen dem griechischen Partizip, und „Menschengesichter“ gibt πρόσωπα ἀνθρώπων idiomatisch und generisch wieder. Die Wendung „sah es aus wie Kronen“ ist jedoch syntaktisch unpräzise, weil der griechische Text die kronenähnlichen Gegenstände auf den Köpfen beschreibt, nicht einen unpersönlichen Gesamteindruck.'
  naturalness: Der Text ist überwiegend modernes, würdevolles Standarddeutsch. „Auf ihren Köpfen sah es aus wie Kronen“ klingt jedoch unidiomatisch und lässt den Bezug zu den Gegenständen auf den Köpfen verschwimmen. „Auf ihren Köpfen waren gleichsam Kronen“ ist klarer und bewahrt den Vergleichscharakter.
  terminology: „Gestalten“, „Heuschrecken“, „Kronen“, „Gold“ und „Menschengesichter“ sind sachgerecht. Die Fußnoten sind inhaltlich zutreffend; bei στέφανοι ist „Siegeskränze“ eine angemessene lexikalische Alternative, und die Erklärung zur generischen Bedeutung von ἀνθρώπων ist korrekt.
