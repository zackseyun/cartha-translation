revisions:
- from: Und die Gestalten der Heuschrecken glichen Pferden, die zum Kampf gerüstet waren. Auf ihren Köpfen sah es aus wie Kronen[a], die Gold glichen, und ihre Gesichter waren wie Menschengesichter[b].
  to: Und die Gestalten der Heuschrecken glichen Pferden, die zum Kampf gerüstet waren. Auf ihren Köpfen waren gleichsam Kronen[a], die Gold glichen, und ihre Gesichter waren wie Menschengesichter[b].
  rationale: Die Revision ersetzt allein die unpersönliche Formulierung „sah es aus wie Kronen“ durch „waren gleichsam Kronen“. Damit wird die räumliche Aussage des griechischen Textes klar wiedergegeben und zugleich die apokalyptische Vergleichssprache von ὡς bewahrt. Die übrigen Formulierungen und beide Fußnoten können unverändert bleiben.
