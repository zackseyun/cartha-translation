id: REV.9.5
reference: Revelation 9:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: de
  text: Und ihnen wurde gegeben, sie nicht zu töten, sondern sie fünf Monate lang zu quälen; und ihre Qual war wie die Qual eines Skorpions, wenn er einen Menschen trifft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Zusammenhang genauer: „wenn er einen Menschen sticht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: ihnen wurde gegeben
  rationale: Die unpersönliche Passivform bleibt erhalten und nennt den Geber nicht ausdrücklich. So wird die für die Offenbarung typische Spannung zwischen göttlicher Vollmacht und zugelassener Wirkung nicht erklärend aufgelöst.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: sie nicht zu töten
  rationale: Der Infinitiv gibt im Deutschen den Inhalt beziehungsweise Zweck des Gewährten natürlich wieder und bewahrt den pronominalen Rückbezug.
- source_word: ἀλλ’ ἵνα βασανισθήσονται
  choice: sondern sie … zu quälen
  rationale: Das ungewöhnliche Futur Passiv nach ἵνα bezeichnet den beabsichtigten beziehungsweise eintretenden Gegensatz zum Töten. Die aktive deutsche Form ergibt sich natürlich aus dem gleichbleibenden Handlungsträger, ohne die Betroffenen zu ändern.
- source_word: βασανισθήσονται / βασανισμός
  choice: quälen / Qual
  rationale: Die verwandten deutschen Wörter bewahren die Wiederholung des βασαν-Wortstamms und bezeichnen schwere schmerzhafte Pein, ohne eine gerichtliche Foltermethode vorauszusetzen.
- source_word: μῆνας πέντε
  choice: fünf Monate lang
  rationale: Die Akkusativangabe der Dauer wird idiomatisch und genau wiedergegeben.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: ihre Qual
  rationale: Die knappe Genitivkonstruktion bleibt bewusst offen genug, um die mit ihnen verbundene beziehungsweise von ihnen verursachte Qual auszudrücken, ohne sie im Haupttext auszudeuten.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: wie die Qual eines Skorpions
  rationale: Die Vergleichskonstruktion und die Wiederholung von βασανισμός werden beibehalten.
- source_word: ὅταν παίσῃ ἄνθρωπον
  choice: wenn er einen Menschen trifft
  rationale: „Trifft“ bleibt nahe an der Grundbedeutung von παίω („schlagen, treffen“). „Einen Menschen“ gibt das generisch gebrauchte ἄνθρωπον im heutigen Deutschen natürlich und umfassend wieder.
theological_decisions:
- issue: Göttliches Passiv im apokalyptischen Gericht
  choice: „ihnen wurde gegeben“, ohne Gott als Geber ausdrücklich zu nennen
  alternative: „Gott gab ihnen die Vollmacht“ oder „ihnen wurde erlaubt“
  rationale: Die griechische Passivform lässt den Geber unausgesprochen. Eine ausdrückliche Nennung Gottes oder eine Reduktion auf bloße Erlaubnis würde stärker interpretieren als der Ausgangstext.
- issue: Zweck- und Ergebnisspannung nach ἵνα
  choice: „sondern sie … zu quälen“
  alternative: „sondern damit sie … gequält würden“
  rationale: Die gewählte Form wahrt den Gegensatz zwischen Töten und Quälen und klingt im Deutschen natürlich. Sie legt nicht über den Text hinaus fest, wie Zweck und eintretendes Ergebnis theologisch zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Passivform. Das Semikolon erhält den engen Zusammenhang der beiden griechischen Satzteile; die Pronomen und „ihre Qual“ bewahren die knappe Ausdrucksweise und verbleibende Mehrdeutigkeit des Ausgangstextes.
