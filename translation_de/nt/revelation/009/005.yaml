review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die ungenannte Passivform von ἐδόθη angemessen wieder und bewahrt damit die im griechischen Text offene Frage nach dem Geber. Die Infinitivkonstruktionen bilden die beiden ἵνα-Sätze idiomatisch ab. „Sie ... zu quälen“ macht die im Kontext naheliegende Handlung der zuvor genannten Wesen deutlich, ohne eine zusätzliche Ursache einzutragen. „Fünf Monate lang“, der Vergleich mit dem Skorpion und „wenn er einen Menschen trifft“ entsprechen dem griechischen Wortlaut und seiner Bildsprache.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und bewahrt zugleich einen angemessen würdigen, apokalyptischen Registerton. Die Formulierung „ihnen wurde gegeben“ ist bewusst bibelnah, aber im Deutschen gut verständlich. „Trifft“ ist als nahe, nicht überpräzisierende Wiedergabe von παίσῃ tragfähig; die Fußnote bietet die kontextuell konkretere Alternative.
  terminology: „quälen / Qual“ bewahrt die Wortwiederholung der βασανισμός-Wortgruppe sinnvoll. „Mensch“ gibt ἄνθρωπον hier natürlich als generischen Ausdruck wieder. „Ihre Qual“ lässt die im Genitiv liegende Beziehung offen genug und vermeidet eine unnötig interpretierende Umschreibung.
