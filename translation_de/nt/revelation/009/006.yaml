id: REV.9.6
reference: Revelation 9:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: de
  text: Und in jenen Tagen werden die Menschen den Tod suchen und ihn ganz gewiss nicht finden; sie werden sich danach sehnen zu sterben, doch der Tod flieht vor ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: in jenen Tagen
  rationale: Die geläufige deutsche Zeitangabe bewahrt den rückverweisenden Charakter von ἐκείναις und den feierlichen Ton.
- source_word: ζητήσουσιν
  choice: werden … suchen
  rationale: „Suchen“ gibt die zielgerichtete Handlung von ζητέω unmittelbar und würdig wieder.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, nicht ausschließlich männliche Personen; „die Menschen“ ist im modernen Deutschen präzise und natürlich.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: werden ihn ganz gewiss nicht finden
  rationale: „Ganz gewiss nicht“ bringt die nachdrückliche Verneinung οὐ μή mit Futur deutlich zum Ausdruck. Das Pronomen „ihn“ greift das im Deutschen maskuline Substantiv „Tod“ auf.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: sie werden sich danach sehnen zu sterben
  rationale: Die Wendung vermittelt das starke Verlangen von ἐπιθυμέω und klingt zugleich natürlich und ernst.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: der Tod flieht vor ihnen
  rationale: Die Formulierung bewahrt sowohl das dramatische Präsens von φεύγει als auch die ausdrückliche Personifikation des Todes.
theological_decisions:
- issue: Personifikation des Todes im apokalyptischen Gericht
  choice: „der Tod flieht vor ihnen“
  alternative: „sie können nicht sterben“
  rationale: Der griechische Text macht den Tod ausdrücklich zum handelnden Subjekt. Die direkte Wiedergabe erhält das apokalyptische Bild und löst es nicht in eine erklärende Aussage auf.
- issue: Bedeutungsumfang von οἱ ἄνθρωποι
  choice: „die Menschen“
  alternative: „die Männer“
  rationale: Im Kontext ist die Menschheit unter dem Gericht gemeint; das grammatische Maskulinum des Griechischen schränkt den Bezug nicht auf männliche Personen ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Das Semikolon gliedert die eng verbundenen Aussagen klar; die personifizierende Bildsprache bleibt unverändert erhalten.
