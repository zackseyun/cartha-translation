id: REV.9.11
reference: Revelation 9:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: de
  text: Sie haben den Engel des Abgrunds als König über sich.[a] Sein Name ist auf Hebräisch Abaddon,[b] und auf Griechisch trägt er den Namen Apollyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der bodenlose Abgrund«.'
    reason: alternative_reading
  - marker: b
    text: Abaddon ist ein hebräischer Name, der mit Verderben und Untergang verbunden ist.
    reason: lexical_alternative
  - marker: c
    text: Apollyon ist ein griechischer Name und bedeutet »Verderber«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν
  choice: Sie haben über sich
  rationale: Die Formulierung bewahrt das griechische Verb »haben« und gibt ἐπί mit Genitiv idiomatisch als »über sich« wieder; gemeint sind die heuschreckenartigen Wesen aus dem vorhergehenden Zusammenhang.
- source_word: βασιλέα
  choice: als König
  rationale: βασιλεύς bezeichnet hier konkret einen König; die königliche Bildsprache bleibt dadurch erhalten.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: den Engel des Abgrunds
  rationale: In der Offenbarung ist ἄγγελος hier sachgemäß »Engel«. »Abgrund« ist eine direkte, im Deutschen geläufige Wiedergabe von ἄβυσσος und vermeidet die stärker ausdeutende traditionelle Form »bodenloser Abgrund«.
- source_word: ὄνομα αὐτῷ
  choice: Sein Name ist
  rationale: Der griechische Dativ wird im Deutschen idiomatisch als Besitzverhältnis wiedergegeben.
- source_word: Ἑβραϊστὶ
  choice: auf Hebräisch
  rationale: Die adverbiale Sprachangabe wird im modernen Deutschen natürlich mit »auf Hebräisch« ausgedrückt.
- source_word: Ἀβαδδών
  choice: Abaddon
  rationale: Die Form dient als Eigenname und wird deshalb transliteriert; ihre Bedeutung wird in einer Fußnote erläutert.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ
  choice: und auf Griechisch
  rationale: Die elliptische Wendung bezeichnet die griechische Sprache und bildet den ausdrücklichen Gegensatz zu »auf Hebräisch«.
- source_word: ὄνομα ἔχει
  choice: trägt er den Namen
  rationale: Diese natürliche deutsche Wendung wahrt gegenüber dem ersten Satzteil einen Teil der griechischen Wiederholung von »Name« und »haben«.
- source_word: Ἀπολλύων
  choice: Apollyon
  rationale: Die Form wird als Eigenname transliteriert; ihre im Griechischen erkennbare Bedeutung »Verderber« wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Übersetzung oder Transliteration der Namen Ἀβαδδών und Ἀπολλύων
  choice: Beide Formen stehen als Eigennamen »Abaddon« und »Apollyon« im Haupttext.
  alternative: Einen oder beide Namen mit »Verderben« beziehungsweise »Verderber« übersetzen.
  rationale: Im Vers fungieren beide Formen als Namen des Engels. Die Transliteration bewahrt diese Funktion, während Fußnoten den für die Aussage wichtigen Bedeutungsgehalt zugänglich machen.
- issue: Wiedergabe von ἄβυσσος
  choice: Abgrund
  alternative: bodenloser Abgrund / bodenlose Tiefe
  rationale: »Abgrund« ist die direkte und verständliche Wiedergabe, ohne eine Bodenlosigkeit ausdrücklich einzutragen, die das griechische Wort hier nicht eigens formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Ausgangstext, wird aber idiomatisch gestaltet. Die wiederholte Nennung von »Name« bleibt erhalten; beide Eigennamen werden transliteriert und semantisch in Fußnoten erschlossen.
