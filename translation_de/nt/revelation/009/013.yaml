id: REV.9.13
reference: Revelation 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: de
  text: Und der sechste Engel blies die Posaune, und ich hörte eine Stimme[a] von den Hörnern des goldenen Altars, der vor Gott steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine einzige Stimme“. Das griechische Zahlwort betont, dass es eine Stimme war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: blies die Posaune
  rationale: Das Verb bezeichnet das Blasen beziehungsweise Ertönenlassen einer Posaune. Das im Deutschen notwendige Objekt wird aus dem Kontext ergänzt.
- source_word: φωνὴν μίαν
  choice: eine einzige Stimme
  rationale: μίαν hebt hervor, dass es eine einzige Stimme war. „Stimme“ wahrt zugleich die Offenheit hinsichtlich ihres Urhebers.
- source_word: ἐκ τῶν κεράτων
  choice: von den Hörnern
  rationale: ἐκ bezeichnet hier den Ausgangspunkt; κέρατα sind die hornartigen Vorsprünge des Altars.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: des goldenen Altars
  rationale: Die attributive Fügung wird im Deutschen natürlich und bestimmt als „des goldenen Altars“ wiedergegeben.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: der vor Gott steht
  rationale: ἐνώπιον bezeichnet die Stellung in Gottes Gegenwart. „Vor Gott steht“ ist anschaulich und idiomatisch, ohne über den Ort hinauszugehen.
- source_word: ἄγγελος
  choice: Engel
  rationale: Im visionären Zusammenhang der Offenbarung ist ein himmlisches Wesen gemeint.
theological_decisions:
- issue: Identität der Stimme
  choice: Die Stimme wird nicht näher bestimmt.
  alternative: Gottes Stimme, die Stimme eines Engels oder eine mit dem Altar verbundene Stimme ausdrücklich benennen.
  rationale: Der griechische Text nennt nur eine Stimme, die von den Hörnern des Altars ausgeht, und lässt ihren Urheber offen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Da hörte ich“ trennt die aufeinanderfolgenden Handlungen natürlich; „Posaune“ entspricht dem etablierten biblischen Sprachgebrauch und bleibt allgemein verständlich.
