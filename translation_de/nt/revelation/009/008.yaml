  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: de
  text: Sie hatten Haare wie das Haar von Frauen, und ihre Zähne waren wie die Zähne von Löwen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶχον
  choice: sie hatten
  rationale: Der Imperfekt von ἔχω beschreibt in der Vision einen andauernden Zustand; im natürlichen Deutschen gibt ihn das Präteritum treffend wieder.
- source_word: τρίχας
  choice: Haare
  rationale: Der griechische Plural wird im Deutschen idiomatisch ebenfalls mit „Haare“ wiedergegeben.
- source_word: ὡς τρίχας γυναικῶν
  choice: wie Frauenhaar
  rationale: ὡς kennzeichnet einen Vergleich. „Frauenhaar“ ist eine knappe, natürliche Wiedergabe, die den Sinn des Genitivs γυναικῶν bewahrt.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: ihre Zähne
  rationale: Die deutsche Possessivkonstruktion gibt Artikel, Substantiv und Genitivpronomen natürlich wieder.
- source_word: ὡς λεόντων
  choice: wie die von Löwen
  rationale: Das im Griechischen aus dem Zusammenhang ergänzte Bezugswort „Zähne“ wird im Deutschen durch das Pronomen „die“ aufgenommen. So bleibt der Vergleich klar, ohne das Substantiv unnötig zu wiederholen.
- source_word: ἦσαν
  choice: waren
  rationale: Das Präteritum von „sein“ entspricht dem griechischen Imperfekt in dieser beschreibenden Visionsszene.
theological_decisions:
- issue: Deutung der apokalyptischen Bildsprache
  choice: Die Vergleiche werden ohne symbolische Auslegung unmittelbar wiedergegeben.
  alternative: Die mögliche Bedeutung von Frauenhaar und Löwenzähnen bereits in der Übersetzung erklären.
  rationale: Der griechische Text nennt nur die visionären Vergleiche und deutet sie hier nicht. Die Übersetzung bewahrt deshalb die Bildsprache und ihre Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. „Frauenhaar“ vermeidet eine schwerfällige Genitivkonstruktion; die Fußnote dokumentiert die formalere Wiedergabe.
