id: REV.9.10
reference: Revelation 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: de
  text: Und sie haben Schwänze wie Skorpione und Stacheln; in ihren Schwänzen liegt ihre Macht, den Menschen fünf Monate lang Schaden zuzufügen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: Schwänze
  rationale: Die direkte anatomische Bildsprache und der Plural werden beibehalten.
- source_word: ὁμοίας σκορπίοις
  choice: wie Skorpione
  rationale: ὅμοιος mit Dativ bezeichnet Ähnlichkeit. Die knappe Formulierung bewahrt die mögliche Unschärfe, ob die Schwänze Skorpionen allgemein oder Skorpionschwänzen gleichen.
- source_word: κέντρα
  choice: Stacheln
  rationale: κέντρον kann einen Stachel, eine Spitze oder einen Treibstachel bezeichnen. Im Bild von Skorpionen ist „Stacheln“ konkret und natürlich.
- source_word: ἐξουσία
  choice: Macht
  rationale: Hier steht die wirksame Befähigung im Vordergrund, Schaden zuzufügen; „Macht“ lässt zugleich den im Kontext der Offenbarung möglichen Gedanken verliehener Vollmacht offen.
- source_word: ἀδικῆσαι
  choice: Schaden zuzufügen
  rationale: Im Zusammenhang der Plage bezeichnet das Verb konkrete Schädigung, nicht bloß abstraktes Unrechttun.
- source_word: τοὺς ἀνθρώπους
  choice: den Menschen
  rationale: ἄνθρωποι meint hier Menschen allgemein. Das deutsche „den Menschen“ gibt diesen generischen Bezug natürlich und ohne unnötige geschlechtliche Verengung wieder.
- source_word: μῆνας πέντε
  choice: fünf Monate lang
  rationale: Der Akkusativ bezeichnet die Zeitdauer; „lang“ macht diese Funktion im Deutschen idiomatisch deutlich.
theological_decisions:
- issue: Bedeutung von ἐξουσία in der apokalyptischen Plagenschilderung
  choice: Macht
  alternative: Vollmacht
  rationale: Der Satz betont die tatsächliche Fähigkeit zur Schädigung. „Macht“ gibt dies unmittelbar wieder, ohne auszuschließen, dass diese Macht innerhalb der Vision begrenzt oder verliehen ist.
- issue: Generischer Bezug von τοὺς ἀνθρώπους
  choice: den Menschen
  alternative: die Menschen
  rationale: Die Präpositionierung ergibt sich im Deutschen aus „Schaden zufügen“; der Ausdruck bezeichnet die Menschheit beziehungsweise Menschen allgemein und nicht ausschließlich Männer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Bildfolge; das Semikolon gliedert die Aufzählung und die Aussage über die in den Schwänzen liegende Macht.
