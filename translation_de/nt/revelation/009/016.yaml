  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ ἀριθμὸς τῶν στρατευμάτων τοῦ ⸀ἱππικοῦ ⸀δισμυριάδες μυριάδων· ἤκουσα τὸν ἀριθμὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: de
  text: Und die Zahl der Reitertruppen betrug zweimal zehntausend mal zehntausend[a]. Ich hörte ihre Zahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das sind zweihundert Millionen.
    reason: Die Fußnote nennt den rechnerischen Wert der im Haupttext wörtlich transparent wiedergegebenen griechischen Zahlenformulierung.
lexical_decisions:
- source_word: ἀριθμὸς
  choice: Zahl
  rationale: Die direkte und natürliche Entsprechung bewahrt zudem die Wiederholung des griechischen Wortes im zweiten Satz.
- source_word: στρατευμάτων τοῦ ἱππικοῦ
  choice: Reiterheere
  rationale: Die Verbindung bezeichnet die militärischen Verbände der Reiterei. „Reiterheere“ ist im Deutschen verständlich und bildet sowohl den Heeres- als auch den Reiterbezug ab.
- source_word: δισμυριάδες μυριάδων
  choice: zweimal zehntausend mal zehntausend
  rationale: Die transparente Wiedergabe folgt der ungewöhnlichen griechischen Zahlenformulierung und ergibt rechnerisch zweihundert Millionen, ohne deren Ausdrucksweise im Haupttext einzuebnen.
- source_word: ἤκουσα
  choice: Ich hörte
  rationale: Schlichte narrative Wiedergabe des Aorists.
- source_word: αὐτῶν
  choice: ihre
  rationale: Das Pronomen verweist auf die zuvor genannten Reiterheere; die possessive Form ist im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Zahlenform des Griechischen bleibt im Haupttext sichtbar; eine verständliche Umrechnung steht in der Fußnote.
