source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: de
  text: Und sie hatten Brustpanzer wie eiserne Brustpanzer, und das Geräusch ihrer Flügel war wie das Geräusch von Streitwagen mit vielen Pferden, die in die Schlacht stürmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie das Geräusch von Streitwagen vieler Pferde, die in den Krieg laufen“. Das griechische Partizip „laufen“ bezieht sich grammatisch auf die Pferde.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: θώρακας
  choice: Brustpanzer
  rationale: θώραξ bezeichnet den den Oberkörper schützenden Panzer; „Brustpanzer“ ist im Deutschen präzise und in diesem visionär-militärischen Bild geläufig.
- source_word: ὡς θώρακας σιδηροῦς
  choice: wie eiserne Brustpanzer
  rationale: „wie“ bewahrt den ausdrücklich durch ὡς markierten Vergleich; „eiserne Brustpanzer“ gibt σιδηροῦς natürlich wieder.
- source_word: φωνὴ
  choice: Geräusch
  rationale: φωνή bezeichnet hier keine Stimme, sondern den hörbaren Eindruck der Flügel und der Streitwagen. Die Wiederholung von „Geräusch“ bildet die Wiederholung des griechischen Wortes ab.
- source_word: πτερύγων
  choice: Flügel
  rationale: πτέρυξ bedeutet hier eindeutig „Flügel“; der Genitiv wird natürlich mit „das Geräusch ihrer Flügel“ wiedergegeben.
- source_word: ἁρμάτων
  choice: Streitwagen
  rationale: ἅρμα bezeichnet einen Wagen, hier im militärischen Zusammenhang einen Streitwagen.
- source_word: ἵππων πολλῶν
  choice: mit vielen Pferden
  rationale: Die Wendung nennt sowohl die Wagen als auch viele Pferde. „Mit vielen Pferden“ ist verständliches Deutsch und vermeidet es, die genaue Beziehung innerhalb der Genitivkette stärker festzulegen als der griechische Text.
- source_word: τρεχόντων
  choice: stürmen
  rationale: τρέχω bedeutet „laufen/rennen“. Im Zusammenhang mit der Bewegung εἰς πόλεμον gibt „stürmen“ die schnelle, heftige Vorwärtsbewegung anschaulich wieder, ohne über das Bild hinauszugehen.
- source_word: εἰς πόλεμον
  choice: in die Schlacht
  rationale: πόλεμος kann „Krieg“ oder „Kampf/Schlacht“ bedeuten; bei heranstürmenden Streitwagen ist „in die Schlacht“ im Deutschen idiomatisch und bildkräftig.
theological_decisions:
- issue: Deutung der visionären Bilder
  choice: Die ausdrücklich als Vergleiche formulierten Bilder werden ohne Identifizierung der Wesen mit Maschinen, Dämonen oder einer bestimmten Armee wiedergegeben.
  alternative: Die Bilder bereits in der Übersetzung auf einen konkreten endzeitlichen oder historischen Bezug festlegen.
  rationale: Das wiederholte ὡς („wie“) kennzeichnet visionäre Vergleiche. Die Übersetzung soll diese darstellen, aber ihre umstrittene apokalyptische Deutung nicht vorwegnehmen.
- issue: Bezug von τρεχόντων („stürmen“)
  choice: Die deutsche Formulierung lässt offen, ob gedanklich besonders die Pferde oder das gesamte Streitwagengespann stürmt.
  alternative: Das Partizip eindeutig nur auf die Pferde oder nur auf die Streitwagen beziehen.
  rationale: Die griechische Genitivkette erlaubt inhaltlich beide Auffassungen; eine eindeutige Festlegung würde die genuine syntaktische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, bildkräftigem Ton. Die Wiederholung „Geräusch … Geräusch“ folgt bewusst der griechischen Wiederholung von φωνή; die apokalyptische Bildsprache bleibt uninterpretiert.
