source:
  edition: SBLGNT
  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: de
  text: 'die zu dem sechsten Engel sagte, der die Posaune hält: »Löse die vier Engel, die am großen Strom Euphrat gebunden sind[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die gebunden worden sind«; das griechische Perfektpartizip betont ihren fortdauernden Zustand als Folge einer früheren Fesselung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: die … sagte
  rationale: Das Partizip bezieht sich auf die Stimme aus Vers 13. Im Deutschen stellt ein Relativsatz den fortlaufenden Satzanschluss natürlich und klar her.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: zu dem sechsten Engel
  rationale: Der Dativ bezeichnet den Empfänger der Rede; »zu … sagte« ist idiomatisches modernes Deutsch.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: der die Posaune hatte
  rationale: Die substantivierte Partizipialfügung bestimmt den angesprochenen Engel näher. »Hatte« gibt den Besitz im Erzählzusammenhang natürlich wieder.
- source_word: Λῦσον
  choice: Löse
  rationale: Der Aoristimperativ fordert die Aufhebung der Fesselung. »Löse« bewahrt zudem den sprachlichen Bezug zu »gebunden«.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: die vier Engel
  rationale: Direkte und unmarkierte Wiedergabe von Artikel, Zahlwort und Substantiv.
- source_word: τοὺς δεδεμένους
  choice: die … gebunden sind
  rationale: Das passive Perfektpartizip bezeichnet einen gegenwärtigen Zustand als Folge einer früheren Fesselung.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: am … Strom
  rationale: ἐπί mit Dativ ist hier örtlich. »Am« lässt die genaue räumliche Beziehung offen und klingt im Deutschen natürlich.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: am großen Strom Euphrat
  rationale: Die Apposition wird in der im Deutschen etablierten biblischen Form »der große Strom Euphrat« wiedergegeben.
theological_decisions:
- issue: Identität und moralischer Status der vier Engel
  choice: Nur »die vier Engel«, ohne moralische Einordnung
  alternative: »die vier gefallenen Engel« oder »die vier zum Gericht bestimmten Engel«
  rationale: Der Vers nennt sie lediglich Engel, die gebunden sind. Eine nähere moralische oder heilsgeschichtliche Bestimmung wäre eine nicht ausdrücklich im Text enthaltene Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Posaune« folgt dem vertrauten biblischen Sprachgebrauch für σάλπιγξ; »Strom Euphrat« wahrt die feierliche Bezeichnung des griechischen Textes. Der Vers bleibt als syntaktische Fortsetzung von Vers 13 erkennbar.
