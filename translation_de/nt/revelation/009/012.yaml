id: REV.9.12
reference: Revelation 9:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: de
  text: Das erste Wehe ist vorüber[a]. Siehe, danach kommen noch zwei weitere Wehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Das eine Wehe ist vorüber«; im Zusammenhang ist das erste einer Reihe gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Wehe
  rationale: Bewahrt die feierliche apokalyptische Gerichtsformel und ihren Anklang an die zuvor angekündigte Reihe von drei Weherufen.
- source_word: ἡ μία
  choice: das erste
  rationale: Wörtlich steht »das eine«; im Zusammenhang unterscheidet die Wendung jedoch das erste Glied einer Reihe von drei Wehen.
- source_word: ἀπῆλθεν
  choice: ist vorüber
  rationale: Gibt den abgeschlossenen Verlauf des ersten Wehes idiomatisch wieder, ohne die im Deutschen unnatürliche räumliche Vorstellung »ging fort« aufzudrängen.
- source_word: ἰδού
  choice: Siehe
  rationale: Erhält den aufmerksamkeitslenkenden, prophetisch-apokalyptischen Ton des griechischen Diskursmarkers.
- source_word: ἔρχεται
  choice: kommen
  rationale: Das griechische Verb steht trotz des pluralischen Sinnsubjekts im Singular; im Deutschen verlangt der Bezug auf zwei Wehe den Plural.
- source_word: ἔτι
  choice: noch
  rationale: Zeigt an, dass nach dem ersten Wehe zwei weitere ausstehen.
- source_word: δύο οὐαί
  choice: zwei weitere Wehe
  rationale: »Weitere« macht im Deutschen natürlich deutlich, dass diese zwei zu dem bereits vergangenen Wehe hinzukommen; die Zahl und die wiederholte Wehe-Formel bleiben erhalten.
- source_word: μετὰ ταῦτα
  choice: danach
  rationale: Gibt die zeitliche Abfolge der pluralischen griechischen Wendung in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Apokalyptische Abfolge der drei Wehe
  choice: Der Vers bezeichnet das erste angekündigte Wehe als abgeschlossen und kündigt zwei weitere an.
  alternative: »Wehe« allgemein als »Gericht« oder »Unheil« wiederzugeben, ohne die wiederkehrende Formel und Zählung zu bewahren.
  rationale: Die Formulierung strukturiert die Vision als Folge von drei Wehen. Die Beibehaltung von »Wehe« und die Wiedergabe von ἡ μία als »das erste« erhalten diese literarische und theologische Spannung, ohne die einzelnen Wehe näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht erhöhtem prophetisch-apokalyptischem Ton. »Siehe« bewahrt bewusst den markanten Aufmerksamkeitsruf; »danach« vermeidet eine unnötig steife Wiedergabe von μετὰ ταῦτα.
