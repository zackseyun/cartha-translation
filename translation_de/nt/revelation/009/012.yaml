  source_fidelity: 'Der Text gibt die Abfolge und den Nachdruck des griechischen Satzes zuverlässig wieder: ἡ μία ist kontextgerecht als „das erste“ verstanden, ἀπῆλθεν als abgeschlossener Vorgang („ist vorüber“), und die noch ausstehenden zwei Wehe werden klar angekündigt. „Danach“ gibt μετὰ ταῦτα idiomatisch und ohne relevanten Bedeutungsverlust wieder.'
  naturalness: „Das erste Wehe ist vorüber. Siehe, danach kommen noch zwei weitere Wehe.“ ist modernes, verständliches Standarddeutsch. „Siehe“ ist bewusst leicht erhöht und passt zum prophetisch-apokalyptischen Register. Der Plural „Wehe“ und die Verbindung „zwei weitere Wehe“ sind grammatisch und stilistisch tragfähig.
  terminology: „Wehe“ bewahrt die formelhafte, apokalyptische Gerichtsansage von οὐαί und vermeidet eine einengende Paraphrase wie „Katastrophe“ oder „Gericht“. Die Fußnote erläutert die wörtliche Möglichkeit „das eine Wehe“ angemessen, ohne die kontextuell richtige ordinale Wiedergabe zu relativieren.
