  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: de
  text: 'Durch diese drei Plagen wurde ein Drittel der Menschen getötet: durch das Feuer und den Rauch und den Schwefel, der aus ihren Mäulern kam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: Durch diese drei Plagen
  rationale: ἀπό bezeichnet hier Ursache beziehungsweise Mittel. „Durch“ gibt diesen Zusammenhang natürlich wieder; „diese“ bewahrt den Rückverweis des Demonstrativpronomens τούτων.
- source_word: ἀπεκτάνθησαν
  choice: wurde … getötet
  rationale: Der passive Aorist wird als abgeschlossenes Geschehen im Passiv wiedergegeben. Der Singular richtet sich nach „ein Drittel“.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: ein Drittel der Menschen
  rationale: Die partitive Wendung bezeichnet ein Drittel der Menschen insgesamt. „Menschen“ ist im Deutschen allgemeinverständlich und nicht auf Männer beschränkt.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: durch das Feuer und den Rauch und den Schwefel
  rationale: Das zweite „durch“ verdeutlicht die tödliche Ursache. Die wiederholte Verbindung mit „und“ bewahrt den feierlich-nachdrucksvollen Rhythmus des Griechischen; θεῖον wird zeitgemäß mit „Schwefel“ wiedergegeben.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: die aus ihren Mäulern kamen
  rationale: Die Formulierung gibt das Hervorkommen der drei genannten Plagen anschaulich wieder. „Mäuler“ passt zu den zuvor beschriebenen pferdeartigen Wesen und erhält die Bildsprache.
theological_decisions:
- issue: Bedeutungsumfang von ἀνθρώπων im Gerichtsgeschehen
  choice: der Menschen
  alternative: der Menschheit
  rationale: ἀνθρώπων bezeichnet hier Menschen allgemein, nicht speziell männliche Personen. „Der Menschen“ wahrt zugleich die partitive Struktur und legt keine weitergehende theologische Deutung fest.
- issue: Verhältnis der drei Plagen zur Tötung
  choice: 'instrumental-kausal: „durch“'
  alternative: 'quellbezogen: „von/aus“'
  rationale: Im Zusammenhang benennt ἀπό die Plagen als Ursache der Tötung; das folgende ἐκ beschreibt zugleich ihren Ursprung aus den Mäulern. Die Übersetzung hält beide Aspekte durch „durch“ und „aus“ auseinander.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener apokalyptischer Bildkraft. Die polysyndetische Reihe „das Feuer und den Rauch und den Schwefel“ folgt dem griechischen Nachdruck, ohne altertümlich zu wirken.
