  source_fidelity: Die Übersetzung gibt Kausalität/Mittel von ἀπό, die partitive Wendung und die dreigliedrige Aufzählung zutreffend wieder. Allerdings ist τοῦ ἐκπορευομένου ein singularischer, genitivischer Artikelpartizip-Ausdruck und bezieht sich unmittelbar auf τοῦ θείου („des Schwefels“), nicht grammatisch auf Feuer, Rauch und Schwefel gemeinsam. Die pluralische Relativkonstruktion „die ... kamen“ erweitert den Bezug über den griechischen Wortlaut hinaus.
