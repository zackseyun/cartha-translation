id: REV.9.3
reference: Revelation 9:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: de
  text: Und aus dem Rauch kamen Heuschrecken auf die Erde, und ihnen wurde Vollmacht[a] gegeben, wie die Skorpione der Erde Vollmacht haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Macht. Das griechische Wort kann Vollmacht, Befugnis oder Macht bezeichnen. „Vollmacht“ hebt hier hervor, dass sie ihnen gegeben wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: aus dem Rauch
  rationale: ἐκ bezeichnet die Bewegung aus dem Inneren heraus; „aus dem Rauch“ gibt das Entstehungsbild knapp und anschaulich wieder.
- source_word: ἐξῆλθον
  choice: kamen
  rationale: Zusammen mit „aus dem Rauch“ drückt „kamen“ die Bewegung natürlich aus, ohne das Herauskommen im Deutschen unnötig doppelt zu markieren.
- source_word: ἀκρίδες
  choice: Heuschrecken
  rationale: ἀκρίδες bezeichnet hier im biblisch-apokalyptischen Zusammenhang Heuschrecken, insbesondere Schwarmheuschrecken.
- source_word: εἰς τὴν γῆν
  choice: auf die Erde
  rationale: εἰς bezeichnet eine gerichtete Bewegung; „auf die Erde“ bewahrt sowohl diese Richtung als auch den umfassenden Sinn von γῆ.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: ihnen wurde Vollmacht gegeben
  rationale: „Vollmacht“ bringt gewährte Befugnis beziehungsweise Ermächtigung zum Ausdruck. Die Passivform bleibt erhalten und benennt den Geber nicht ausdrücklich.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: wie ... Vollmacht haben
  rationale: Die Vergleichsform mit ὡς und die Wiederholung von ἐξουσία werden beibehalten.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: die Skorpione der Erde
  rationale: Die Genitivverbindung wird formal bewahrt und unterscheidet die irdischen Skorpione von den aus dem Rauch hervorkommenden Heuschrecken.
theological_decisions:
- issue: Art der den Heuschrecken gewährten Fähigkeit
  choice: ἐξουσία wird mit „Vollmacht“ wiedergegeben; das Passiv „wurde ... gegeben“ bleibt ohne ausdrückliche Nennung des Gebers erhalten.
  alternative: „Macht“ verwenden oder den unausgesprochenen Geber ausdrücklich benennen.
  rationale: Die Formulierung lässt erkennen, dass die Heuschrecken nicht unabhängig handeln, ohne über die knappe Aussage des griechischen Textes hinaus festzulegen, wer die Vollmacht erteilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung von „Vollmacht“ und die ungewöhnlichere Wendung „Skorpione der Erde“ bewahren die Struktur und Bildsprache des griechischen Textes.
