  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Satzes präzise wieder: Καὶ mit „Und“, οἱ ἔμποροι τῆς γῆς mit „die Kaufleute der Erde“, die doppelte Klage κλαίουσιν καὶ πενθοῦσιν mit „weinen und trauern“, den femininen Bezug ἐπ’ αὐτήν mit „um sie“, τὸν γόμον αὐτῶν mit „ihre Ladung“ sowie die fortdauernde Verneinung οὐδεὶς ἀγοράζει οὐκέτι mit „niemand mehr … kauft“. „Ladung“ bewahrt die konkrete, auch maritime Nuance von γόμος und bleibt zugleich im Kontext der folgenden Warenliste verständlich.'
  naturalness: „Und die Kaufleute der Erde weinen und trauern um sie, weil niemand mehr ihre Ladung kauft“ ist modernes, flüssiges Standarddeutsch. Die knappe Reihung und die Wiederholung der Klageverben entsprechen dem feierlich-prophetischen Register der Offenbarung, ohne unnatürlich zu wirken.
  terminology: „Kaufleute“ ist für ἔμποροι passend und idiomatisch. „Erde“ wahrt den weiten, apokalyptischen Horizont von τῆς γῆς. Das feminine „sie“ erhält die Personifikation Babylons, ohne deren Referenz theologisch auszudeuten. Die vorliegenden deutschen Entscheidungen sind mit dem englischen Audit Trail vereinbar; dessen Fußnoten betreffen dort lexikalische Alternativen, die im deutschen Text keine Fußnote erfordern.
