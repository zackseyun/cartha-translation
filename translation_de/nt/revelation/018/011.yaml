  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: de
  text: Und die Kaufleute der Erde weinen und trauern um sie, weil niemand mehr ihre Ladung kauft,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμποροι
  choice: Kaufleute
  rationale: „Kaufleute“ ist im modernen Standarddeutsch die natürliche Bezeichnung für Personen, die gewerbsmäßig Handel treiben, und passt zum internationalen Luxus- und Seehandel in Offenbarung 18.
- source_word: τῆς γῆς
  choice: der Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. Im weltweiten Horizont der Offenbarung liegt hier „der Erde“ näher und bewahrt zugleich die übliche Ausdrucksweise des Buches.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: weinen und trauern
  rationale: Die beiden Verben werden getrennt wiedergegeben, damit die rhetorische Steigerung von sichtbarem Weinen und umfassender Trauer erhalten bleibt.
- source_word: ἐπ’ αὐτήν
  choice: um sie
  rationale: Bei Verben des Klagens bezeichnet ἐπί mit Akkusativ den Gegenstand der Trauer. „Um sie“ ist im Deutschen idiomatisch und erhält den femininen Bezug auf die personifizierte Stadt Babylon.
- source_word: τὸν γόμον αὐτῶν
  choice: ihre Ladung
  rationale: γόμος bezeichnet besonders eine Schiffs- oder Frachtladung. „Ladung“ passt zum Handelskontext und leitet natürlich zur folgenden Warenliste über; das Possessivpronomen gibt αὐτῶν wieder.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: niemand mehr … kauft
  rationale: Diese Wortstellung ist natürliches Deutsch und gibt sowohl das Präsens als auch die Beendigung des bisherigen Kaufens durch οὐκέτι klar wieder.
theological_decisions:
- issue: Bezug und Darstellung Babylons
  choice: Das feminine Pronomen wird mit „sie“ bewahrt und auf die personifizierte Stadt bezogen.
  alternative: Eine versachlichende Wiedergabe mit „es“ für eine Stadt oder ein Wirtschaftssystem.
  rationale: Die Offenbarung stellt Babylon als Frau und Stadt dar. „Sie“ wahrt dieses literarisch-theologische Bild, ohne die Symbolik weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Satzbau und die doppelte Klageformel bleiben erhalten. Keine Fußnote ist nötig, da „Ladung“ und „Erde“ im Kontext verständlich sind und die möglichen Bedeutungsnuancen den Haupttext nicht sachlich verändern.
