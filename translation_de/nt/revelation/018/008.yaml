id: REV.18.8
reference: Revelation 18:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: de
  text: 'Darum werden an einem einzigen Tag ihre Plagen kommen: Tod, Trauer und Hungersnot; und sie wird im Feuer völlig verbrannt werden. Denn stark ist Gott, der Herr, der sie gerichtet hat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Begründungsformel knapp und natürlich wieder.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: an einem einzigen Tag
  rationale: Bewahrt die betonte Plötzlichkeit und zeitliche Verdichtung des griechischen Ausdrucks.
- source_word: πληγαὶ
  choice: Plagen
  rationale: Entspricht dem apokalyptischen Gerichtsvokabular und umfasst die anschließend genannten Heimsuchungen.
- source_word: πένθος
  choice: Trauer
  rationale: Modernes, allgemein verständliches Wort für Trauer beziehungsweise Klage.
- source_word: λιμός
  choice: Hunger
  rationale: Gibt die konkrete Not einer Hungersnot idiomatisch wieder, ohne den Satz unnötig zu beschweren.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: sie wird im Feuer verbrannt werden
  rationale: Bewahrt Passiv, Feuerbild und die intensive Bedeutung des Verbs; „im Feuer“ folgt der griechischen Konstruktion.
- source_word: ἰσχυρὸς
  choice: stark
  rationale: Gibt das Grundwort direkt wieder und erhält die markante Aussage über Gottes Stärke.
- source_word: ὁ κρίνας αὐτήν
  choice: der sie gerichtet hat
  rationale: Bewahrt den substantivisch gebrauchten Aoristpartizip als abgeschlossene richterliche Handlung.
theological_decisions:
- issue: Zeitliches Verhältnis zwischen angekündigten Plagen und vollzogenem Gericht
  choice: Futur bei den Plagen, Perfekt bei Gottes Gerichtshandeln
  alternative: Auch Gottes Gericht rein zukünftig wiedergeben
  rationale: 'Die Übersetzung erhält die Aspekt- und Tempusspannung des griechischen Textes: Die Plagen werden kommen, weil Gott sie gerichtet hat.'
- issue: Bezeichnung Gottes
  choice: „der Herr, Gott“
  alternative: „Gott, der Herr“ oder „der Herr, unser Gott“
  rationale: Folgt der Wortfolge κύριος ὁ θεός möglichst eng, ohne ein im Ausgangstext nicht vorhandenes Possessivpronomen einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst kräftiger, leicht markierter Schlussformulierung „denn stark ist der Herr, Gott“, welche die griechische Voranstellung des Prädikats aufnimmt. Keine Fußnoten erforderlich.
