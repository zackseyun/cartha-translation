revisions:
- from: 'Darum werden an einem einzigen Tag ihre Plagen kommen: Tod, Trauer und Hunger. Und sie wird im Feuer verbrannt werden; denn stark ist der Herr, Gott, der sie gerichtet hat.'
  to: 'Darum werden an einem einzigen Tag ihre Plagen kommen: Tod, Trauer und Hungersnot; und sie wird im Feuer völlig verbrannt werden. Denn stark ist Gott, der Herr, der sie gerichtet hat.'
  rationale: 'Der Text wird nur dort präzisiert, wo der griechische Wortlaut eine sichere engere Bedeutung nahelegt: λιμός als „Hungersnot“ und κατακαυθήσεται als vollständiges Verbrennen. Die Gottesbezeichnung wird idiomatisch als „Gott, der Herr“ formuliert. Das Perfekt „gerichtet hat“ bewahrt weiterhin die aspektuelle Spannung des Aoristpartizips κρίνας gegenüber den zukünftigen Plagen.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die griechische Satzstruktur und die zentralen Begriffe im Wesentlichen zutreffend wieder: die Plagen kommen „an einem einzigen Tag“, und die abschließende Begründung bezieht sich auf Gottes bereits vollzogenes Gericht. Eine sichere Präzisierung ist bei λιμός angezeigt, das spezifisch „Hungersnot“ bezeichnet, nicht bloß allgemeines „Hunger“.'
  naturalness: Der Satz ist überwiegend modernes Standarddeutsch. „im Feuer verbrannt werden“ ist verständlich, aber „im Feuer völlig verbrannt werden“ bildet κατακαυθήσεται präziser ab. Die Apposition „der Herr, Gott“ wirkt im Deutschen unnötig abgehackt und kann missverständlich klingen.
  terminology: „Plagen“, „Tod“, „Trauer“ und „gerichtet hat“ passen zum apokalyptischen Gerichtsregister. Für κύριος ὁ θεός ist „Gott, der Herr“ im modernen deutschen Bibelregister idiomatischer und gibt beide Titel ohne Zusatz wieder. „Hungersnot“ entspricht λιμός.
  issues:
  - severity: medium
    issue: λιμός ist mit „Hunger“ zu allgemein wiedergegeben.
    rationale: λιμός bezeichnet eine Hungersnot bzw. einen Mangelzustand als Katastrophe; „Hungersnot“ bewahrt die spezifische Bedeutung und die Reihung der Gerichtsplagen.
  - severity: low
    issue: „der Herr, Gott“ ist als Gottesbezeichnung unidiomatisch.
    rationale: Die griechische Nominalgruppe ὁ κύριος ὁ θεός lässt sich ohne Bedeutungsverlust und in natürlichem deutschen Bibelstil als „Gott, der Herr“ wiedergeben.
  - severity: low
    issue: Die Intensivierung von κατακαυθήσεται bleibt in „verbrannt werden“ unterbestimmt.
    rationale: Das Kompositum bezeichnet ein vollständiges Verbrennen; „völlig verbrannt werden“ macht dies sichtbar, ohne das Bild zu verändern.
  revised_text: 'Darum werden an einem einzigen Tag ihre Plagen kommen: Tod, Trauer und Hungersnot; und sie wird im Feuer völlig verbrannt werden. Denn stark ist Gott, der Herr, der sie gerichtet hat.'
