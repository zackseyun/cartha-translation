id: REV.18.7
reference: Revelation 18:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: de
  text: 'In dem Maß, in dem sie sich selbst verherrlicht und in Üppigkeit gelebt hat[a], gebt ihr Qual und Trauer. Denn in ihrem Herzen sagt sie: »Ich sitze als Königin, ich bin keine Witwe, und Trauer werde ich ganz gewiss niemals erleben.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein üppiges Leben geführt« oder »ausschweifend gelebt«. Das griechische Verb kann luxuriöses, zügelloses Leben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Verneinung ist besonders nachdrücklich und bringt ihre feste Überzeugung zum Ausdruck, dass sie niemals Trauer erleben werde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: In dem Maß, wie ...
  rationale: 'Gibt die korrelative Verhältnisbestimmung wieder: Die Vergeltung entspricht dem Maß ihrer Selbstverherrlichung und ihres üppigen Lebens. Die deutsche Formulierung bleibt natürlich, ohne den Gedanken proportionaler Vergeltung abzuschwächen.'
- source_word: ἐδόξασεν αὑτὴν
  choice: sie sich selbst verherrlicht hat
  rationale: Bewahrt die ausdrückliche reflexive Aussage und damit den Gedanken ihrer Selbstüberhöhung.
- source_word: ἐστρηνίασεν
  choice: in Üppigkeit gelebt hat
  rationale: Bezeichnet ein luxuriöses, ausschweifendes und selbstverwöhntes Leben. »In Üppigkeit gelebt« passt zum wirtschaftlichen und königlichen Zusammenhang, ohne den Ausdruck unnötig zu sexualisieren.
- source_word: δότε αὐτῇ
  choice: gebt ihr
  rationale: Entspricht unmittelbar dem pluralischen Imperativ und wahrt den gerichtlichen Ton.
- source_word: βασανισμὸν
  choice: Qual
  rationale: Drückt schweres Leiden unter dem Gericht aus, ohne es auf körperliche Folter zu verengen.
- source_word: πένθος
  choice: Trauer
  rationale: Passt zum Verlust- und Gerichtskontext und wird beim zweiten Vorkommen identisch wiedergegeben.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: in ihrem Herzen sagt sie
  rationale: Bewahrt die biblische Redeweise für ihre innere, selbstsichere Überzeugung.
- source_word: Κάθημαι βασίλισσα
  choice: Ich throne als Königin
  rationale: Gibt das Bild königlicher Stellung und vermeintlicher Sicherheit in natürlichem Deutsch wieder. Das einfache »ich sitze« wäre zwar formnäher, klänge hier jedoch missverständlich und weniger idiomatisch.
- source_word: χήρα οὐκ εἰμί
  choice: ich bin keine Witwe
  rationale: Direkte Wiedergabe des Bildes vermeintlicher Unverletzlichkeit gegenüber Verlust und Verlassenheit.
- source_word: οὐ μὴ ἴδω
  choice: werde ich ganz gewiss niemals erleben
  rationale: »Ganz gewiss niemals« bringt die nachdrückliche griechische Verneinung zum Ausdruck; »erleben« gibt die idiomatische Bedeutung von »sehen« in diesem Zusammenhang natürlich wieder.
theological_decisions:
- issue: Personifikation Babylons als Frau, Königin und Witwe
  choice: Die feminine Personifikation wird durchgehend beibehalten.
  alternative: Babylon unpersönlich als Stadt oder Wirtschaftssystem wiedergeben.
  rationale: Der griechische Text gestaltet Babylon ausdrücklich als Frau. Die Bilder von Königin und Witwe sind wesentlich für den Kontrast zwischen stolzer Selbstsicherheit und kommendem Gericht.
- issue: Gerichtssprache in βασανισμός
  choice: Qual
  alternative: Folter; Schmerz
  rationale: »Qual« wahrt die Schwere des Gerichts, ohne eine bestimmte Art körperlicher Misshandlung in den Text hineinzulesen.
- issue: Nachdruck der Verneinung οὐ μή
  choice: ganz gewiss niemals
  alternative: niemals; keinesfalls
  rationale: Die verstärkte Verneinung drückt Babylons überhebliche Gewissheit aus, Trauer werde sie unter keinen Umständen treffen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache der weiblich personifizierten Stadt und die innere Selbstüberhebung bleiben erhalten. »Ich throne« vermittelt die königliche Sitzposition idiomatisch; »ganz gewiss niemals« wahrt den Nachdruck der griechischen Verneinung.
