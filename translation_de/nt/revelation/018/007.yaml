  terminology: Die zentralen Begriffe sind konsistent und registergerecht. »Ich sitze als Königin« wahrt das Sitz-/Herrschaftsbild von κάθημαι ohne die zusätzliche, im Ausgangstext nicht ausdrücklich genannte Aussage eines Thrones. »Trauer erleben« gibt das idiomatische »sehen« in diesem Zusammenhang angemessen wieder; »ganz gewiss niemals« bildet οὐ μή nachdrücklich ab.
