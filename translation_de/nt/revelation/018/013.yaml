  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: de
  text: und Zimt und Gewürz[a] und Räucherwerk und Parfüm und Weihrauch und Wein und Olivenöl und Feinmehl und Weizen und Vieh und Schafe, dazu Pferde und Wagen und Leiber und Seelen von Menschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Amomum, ein kostbares aromatisches Gewürz.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung bezeichnet im Kontext wahrscheinlich Menschen, die als Sklaven gehandelt werden.
    reason: contextual_clarification
lexical_decisions:
- source_word: κιννάμωμον
  choice: Zimt
  rationale: Die etablierte deutsche Bezeichnung für das importierte aromatische Handelsgut.
- source_word: ἄμωμον
  choice: Gewürz
  rationale: Das genaue aromatische Gewächs ist unsicher; die verständliche Oberbezeichnung wahrt den Charakter als kostbares Handelsgut, während die mögliche Identifizierung in der Fußnote steht.
- source_word: θυμιάματα
  choice: Räucherwerk
  rationale: Im Warenverzeichnis sind Räucherstoffe gemeint, nicht der Vorgang des Räucherns.
- source_word: μύρον
  choice: Parfüm
  rationale: Bezeichnet kostbares duftendes Öl beziehungsweise Salböl; „Parfüm“ ist im modernen Deutsch natürlich und passt zur Luxuswarenliste.
- source_word: λίβανον
  choice: Weihrauch
  rationale: Bezeichnet spezifisch Weihrauch und bleibt dadurch vom allgemeineren Räucherwerk unterschieden.
- source_word: ἔλαιον
  choice: Olivenöl
  rationale: Der gemeinte Öltyp wird für heutige Leser eindeutig benannt.
- source_word: σεμίδαλιν
  choice: Feinmehl
  rationale: Gibt hochwertiges, fein gemahlenes Mehl knapp und traditionsgemäß wieder.
- source_word: σῖτον
  choice: Weizen
  rationale: In dieser Handelsliste ist die spezifische Bedeutung „Weizen“ wahrscheinlich.
- source_word: κτήνη
  choice: Rinder
  rationale: Wahrt gegenüber den unmittelbar folgenden Schafen die Unterscheidung zwischen größeren Nutztieren und Kleinvieh.
- source_word: πρόβατα
  choice: Schafe
  rationale: Die direkte und natürliche deutsche Entsprechung.
- source_word: ῥεδῶν
  choice: Wagen
  rationale: Das Wort bezeichnet vierrädrige Fahrzeuge; „Wagen“ vermeidet die militärische Engführung von „Streitwagen“ und lässt den möglichen Luxuscharakter offen.
- source_word: σωμάτων
  choice: Leiber
  rationale: Bewahrt die wörtliche, schockierende Verdinglichung von Menschen als Handelsware; die Fußnote erläutert den Sklavenhandel.
- source_word: ψυχὰς ἀνθρώπων
  choice: Menschenseelen
  rationale: Gibt den klimaktischen Ausdruck knapp wieder und bewahrt die Spannung zwischen körperlicher Verdinglichung und dem vollen menschlichen Leben.
theological_decisions:
- issue: Wiedergabe von σωμάτων καὶ ψυχὰς ἀνθρώπων
  choice: Leiber – ja, Menschenseelen
  alternative: Sklaven, das heißt Menschenleben
  rationale: Die wörtliche Wiedergabe erhält die rhetorische Härte und theologische Spannung des griechischen Textes, der Menschen erst als „Leiber“ unter Waren aufführt und dann als Menschenseelen bezeichnet. Die Deutung als Sklavenhandel wird nicht in den Haupttext eingetragen, sondern in einer Fußnote erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten „und“ bilden den kumulativen Charakter der griechischen Warenliste nach. „Dazu“ gliedert die lange Aufzählung behutsam, ohne ihre Struktur aufzulösen; der Gedankenstrich und „ja“ markieren die erschütternde Klimax.
