- from: und Zimt und Gewürz[a] und Räucherwerk und Parfüm und Weihrauch und Wein und Olivenöl und Feinmehl und Weizen und Rinder und Schafe, dazu Pferde und Wagen und Leiber[b] – ja, Menschenseelen.
  to: und Zimt und Gewürz[a] und Räucherwerk und Parfüm und Weihrauch und Wein und Olivenöl und Feinmehl und Weizen und Vieh und Schafe, dazu Pferde und Wagen und Leiber und Seelen von Menschen.[b]
  rationale: Die Revision korrigiert die zu spezifische Tierbezeichnung und entfernt die nicht ausdrücklich im griechischen Text vorhandene Bekräftigung „ja“. Die harte, für den Warenhandel bewusst verstörende Ausdrucksweise bleibt erhalten; die wahrscheinliche Bezugnahme auf den Sklavenhandel wird ausschließlich und vorsichtig in der Fußnote erklärt.
