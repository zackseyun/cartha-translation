source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: de
  text: Freue dich über sie, du Himmel, und ihr Heiligen, Apostel und Propheten! Denn Gott hat euren Rechtsfall gegen sie entschieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich verdichtet: „Denn Gott hat euren Rechtsfall aus/von ihr entschieden.“ Gemeint ist wahrscheinlich, dass Gott ihren Fall gegenüber ihr gerichtlich entschieden hat. Sinngemäß auch: „Denn Gott hat sie um euretwillen verurteilt“ oder „Denn Gott hat euch an ihr gerächt.“'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐφραίνου
  choice: Freue dich
  rationale: Der Imperativ richtet eine unmittelbare Aufforderung zur Freude an den personifiziert angesprochenen Himmel.
- source_word: ἐπ’ αὐτῇ
  choice: über sie
  rationale: ἐπί mit Dativ bezeichnet hier bei einem Verb der Freude den Gegenstand oder Anlass der Freude; „über sie“ ist im Deutschen knapp und kontextgemäß.
- source_word: οὐρανέ
  choice: du Himmel
  rationale: Der Vokativ spricht den Himmel personifiziert an; „du Himmel“ erhält diese direkte, feierliche Anrede in natürlichem Deutsch.
- source_word: οἱ ἅγιοι
  choice: ihr Heiligen
  rationale: Die substantivierte Bezeichnung meint Gottes geheiligtes Volk; „Heilige“ ist hier prägnant und in der Offenbarung geläufig.
- source_word: οἱ ἀπόστολοι καὶ οἱ προφῆται
  choice: Apostel und Propheten
  rationale: Die üblichen Amts- beziehungsweise Gruppenbezeichnungen geben die wahrscheinlich technischen Bedeutungen unmittelbar wieder.
- source_word: ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν
  choice: Gott hat euer Urteil … vollstreckt
  rationale: Die deutsche Formulierung bewahrt die Gerichtssprache und den Bezug auf „euer Urteil“, ohne ausdrücklich „gerächt“ zu sagen; zugleich vermeidet sie die unverständliche Wort-für-Wort-Wiedergabe „hat euer Urteil gerichtet“.
- source_word: ἐξ αὐτῆς
  choice: an ihr
  rationale: In Verbindung mit der Vollstreckung eines Urteils bezeichnet „an ihr“ Babylon als diejenige, an der Gottes gerichtliches Handeln ergeht, ohne die Aussage zu einer ausdrücklichen Racheformel auszuweiten.
theological_decisions:
- issue: Wie ausdrücklich Gottes gerichtliches Handeln zugunsten der Heiligen als Rechtfertigung oder Vergeltung bezeichnet werden soll
  choice: Die komprimierte Gerichtssprache bleibt mit „euer Urteil an ihr vollstreckt“ im Haupttext erhalten.
  alternative: „Gott hat sie um euretwillen verurteilt“ oder „Gott hat euch an ihr gerächt“
  rationale: Der griechische Text verwendet κρίνω/κρίμα und kein ausdrückliches Verb für Rache. Die gewählte Fassung macht den gerichtlichen Vorgang verständlich, lässt aber offen, ob der Genitiv vor allem das Urteil zugunsten der Angeredeten, ihren Rechtsfall oder ihre Rechtfertigung bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „du Himmel“ erhält den Vokativ, während das Ausrufezeichen die gesamte Aufforderung klar gliedert. Die schwierige Schlusswendung bleibt bewusst gerichtlich und mehrdeutig; die Fußnote nennt sowohl die formale Struktur als auch mögliche sinngemäße Deutungen.
