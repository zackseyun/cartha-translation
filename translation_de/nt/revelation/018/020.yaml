review_pass:
  verdict: revise
  source_fidelity: 'Die Anrede an Himmel, Heilige, Apostel und Propheten sowie der Anlass der Freude sind zutreffend wiedergegeben. Die Schlusswendung ist jedoch eine verdichtete Gerichtsformel: κρίμα bezeichnet hier eher den Rechtsfall bzw. die Rechtsforderung der Angeredeten als ein von ihnen selbst gefälltes „Urteil“. „Vollstreckt“ fügt zudem den Gedanken der Urteilsvollstreckung stärker ein, als ἔκρινεν unmittelbar ausdrückt. Eine Formulierung mit „Rechtsfall“ und „gegen sie“ gibt die gerichtliche Entscheidung verständlich wieder, ohne sie ausdrücklich als Rache zu bestimmen.'
  naturalness: 'Die Anrede ist würdevoll und gut verständlich. „Euer Urteil an ihr vollstreckt“ ist im heutigen Deutsch jedoch semantisch schief: Ein Urteil wird gewöhnlich gegen jemanden oder an jemandem vollstreckt, während „euer Urteil“ nahelegt, die Angeredeten hätten das Urteil gefällt. „Euren Rechtsfall gegen sie entschieden“ ist idiomatischer und wahrt den gerichtlichen Charakter.'
  terminology: „Heilige“, „Apostel“ und „Propheten“ sind angemessene, etablierte Wiedergaben. „Rechtsfall“ bringt die forensische Dimension von κρίμα in diesem schwierigen Ausdruck klarer zur Geltung als „Urteil“, ohne eine konfessionell geprägte Deutung einzutragen.
  issues:
  - severity: medium
    issue: „euer Urteil an ihr vollstreckt“ verschiebt die Bedeutung von κρίμα und ἔκρινεν.
    rationale: Die Formulierung lässt das Urteil den Angeredeten gehören und setzt dessen Vollstreckung voraus. Der griechische Ausdruck bezeichnet wahrscheinlicher Gottes Entscheidung ihres Rechtsfalls gegenüber Babylon; die genaue Nuance bleibt dennoch verdichtet.
  - severity: medium
    issue: Die Fußnote bietet mit „von ihr her gerichtet“ keine verständliche deutsche wörtliche Orientierung.
    rationale: Die Formulierung ist im Deutschen nicht sinnvoll auswertbar. Die Fußnote sollte die griechische Verdichtung erklären und die möglichen Deutungen als solche kennzeichnen.
