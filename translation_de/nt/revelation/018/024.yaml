  source_fidelity: 'Die Grundbedeutung ist zutreffend: Das feminine „ihr“ bewahrt den Bezug auf das personifizierte Babylon, αἷμα wird angemessen als „Blut“ wiedergegeben, und „abgeschlachtet“ gibt die besondere Gewalt von ἐσφαγμένων gut wieder. Das deutsche Plusquamperfekt „hingeschlachtet worden waren“ verschiebt jedoch das griechische Perfektpartizip unnötig in eine Vorvergangenheit. Zudem legt die Wiederholung von „das Blut“ vor der letzten Gruppe eine im Griechischen nicht vorhandene Gliederung nahe.'
  naturalness: 'Die Überarbeitung bleibt würdiges modernes Standarddeutsch und ist syntaktisch klarer: Ein gemeinsames „Blut“ regiert alle drei Personengruppen, wie im Griechischen.'
  terminology: „Heilige“ ist als etablierte, knappe Wiedergabe von ἅγιοι angemessen; die Fußnote bietet die nötigen nichtkonfessionellen Verständnishilfen. „Erde“ entspricht im Kontext besser als „Land“.
