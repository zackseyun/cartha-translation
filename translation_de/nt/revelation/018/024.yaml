  rationale: Die Revision korrigiert die Tempelentsprechung des griechischen Perfektpartizips und fasst die drei von „Blut“ abhängigen Gruppen in einer im Deutschen natürlichen, dem Ausgangstext enger entsprechenden Konstruktion zusammen. Die Fußnotenanker bleiben eindeutig und die Erläuterungen inhaltlich erhalten.
