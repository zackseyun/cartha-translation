id: REV.18.24
reference: Revelation 18:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: de
  text: Und in ihr[a] wurde das Blut der Propheten, der Heiligen[b] und all derer gefunden, die auf der Erde abgeschlachtet worden sind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ihr“ bezieht sich auf Babylon, das in der umgebenden Vision als Frau dargestellt wird.
    reason: cross_reference
  - marker: b
    text: 'Oder: „der heiligen Menschen“ beziehungsweise „des heiligen Gottesvolkes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „getötet worden sind“. Das griechische Verb ist stärker als ein allgemeiner Ausdruck für Töten und kann gewaltsames Abschlachten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: in ihr
  rationale: Das feminine Pronomen verweist im Zusammenhang auf Babylon, das als Frau und Stadt dargestellt wird. „In ihr“ bewahrt diese Personifikation.
- source_word: αἷμα
  choice: Blut
  rationale: Die wörtliche Wiedergabe ist im Deutschen natürlich und lässt zugleich den Zusammenhang von vergossenem Blut und Blutschuld erkennen.
- source_word: προφητῶν
  choice: der Propheten
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe von προφῆται.
- source_word: ἁγίων
  choice: der Heiligen
  rationale: In der Offenbarung bezeichnet ἅγιοι häufig das Gott geweihte Volk. „Heilige“ ist knapp, etabliert und wahrt den substantivischen Ausdruck des Griechischen.
- source_word: εὑρέθη
  choice: wurde ... gefunden
  rationale: Die passive Form gibt den Aorist εὑρέθη direkt wieder und bewahrt den enthüllenden beziehungsweise gerichtlichen Ton der Aussage.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: all derer, die ... hingeschlachtet worden waren
  rationale: σφάζω bezeichnet ein gewaltsames Abschlachten und ist stärker als ein allgemeines „töten“. Das Plusquamperfekt macht im deutschen Satz deutlich, dass die Tötung dem Finden vorausging, ohne die fortwirkende Bedeutung des griechischen Perfektpartizips zu leugnen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Im apokalyptischen Sprachgebrauch der Offenbarung ist hier die umfassende Bedeutung „Erde“ naheliegender als das örtlich begrenzte „Land“.
theological_decisions:
- issue: Bezug und Umfang der Schuld Babylons
  choice: Die Aussage schreibt Babylon in umfassender apokalyptischer Gerichtssprache Verantwortung für das Blut der Propheten, der Heiligen und aller auf der Erde Hingeschlachteten zu.
  alternative: Die Schlusswendung kann entweder als rhetorisch umfassende Aussage über das Blutvergießen verstanden werden, für das Babylon sinnbildlich steht, oder innerhalb der Symbolwelt der Vision als Aussage universaler Schuld.
  rationale: Der griechische Text schränkt die umfassende Anklage nicht ein. Die Übersetzung bewahrt ihren Umfang, ohne festzulegen, wie das Symbol im Einzelnen auf die Geschichte zu beziehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Anklagesatz; die Wiederholung von „das Blut“ verdeutlicht im Deutschen die syntaktische Zuordnung des letzten Genitivs, ohne den Aussageumfang einzuengen.
