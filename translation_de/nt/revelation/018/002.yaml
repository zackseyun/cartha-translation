id: REV.18.2
reference: Revelation 18:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: de
  text: 'Und er rief mit gewaltiger Stimme: »Gefallen, gefallen ist Babylon, die Große! Sie ist zu einer Behausung von Dämonen geworden, zu einem Gefängnis[a] für jeden unreinen Geist, zu einem Gefängnis für jeden unreinen Vogel und zu einem Gefängnis für jedes unreine und verhasste Tier[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einem Aufenthaltsort für jeden unreinen Geist … jeden unreinen Vogel … jedes unreine und verhasste Tier«. Das griechische Wort kann außer einem Gefängnis auch einen Ort bezeichnen, an dem jemand oder etwas sich aufhält.'
    reason: lexical_alternative
  - marker: b
    text: In einigen Handschriften fehlen die Worte »und zu einem Gefängnis für jedes unreine und verhasste Tier«.
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν
  choice: rief
  rationale: Das Aoristverb bezeichnet einen lauten Ruf. Zusammen mit »mit gewaltiger Stimme« gibt »rief« die Intensität natürlich wieder, ohne sie doppelt auszudrücken.
- source_word: ἐν ἰσχυρᾷ φωνῇ
  choice: mit gewaltiger Stimme
  rationale: Die Wendung bezeichnet Art beziehungsweise Mittel des Rufens. »Gewaltig« bewahrt die Kraft von ἰσχυρός und passt zum gehobenen Stil der Offenbarung.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Gefallen, gefallen ist
  rationale: Die Wiederholung und die vorangestellte Verbform bewahren den feierlichen, prophetischen Klang sowie den Anklang an alttestamentliche Gerichtsworte.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babylon, die Große
  rationale: Die appositionsartige, wiederkehrende Bezeichnung wird erhalten und nicht zum bloßen attributiven »das große Babylon« geglättet.
- source_word: ἐγένετο
  choice: ist ... geworden
  rationale: Das deutsche Perfekt stellt sowohl das eingetretene Geschehen als auch den daraus hervorgegangenen Zustand heraus.
- source_word: κατοικητήριον
  choice: Behausung
  rationale: »Behausung« bezeichnet klar einen bewohnten Ort und trägt zugleich den würdevoll-düsteren Ton des Bildes.
- source_word: δαιμονίων
  choice: Dämonen
  rationale: Der Ausdruck bezeichnet ausdrücklich Dämonen; »böse Geister« wäre allgemeiner und interpretierender.
- source_word: φυλακή
  choice: Gefängnis
  rationale: φυλακή kann einen Ort der Bewachung oder Verwahrung und damit ein Gefängnis bezeichnen. Weil im Kontext auch ein Aufenthalts- oder Schlupfort gemeint sein kann, wird diese Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: jeden unreinen Geist
  rationale: Die Formulierung bewahrt die biblisch geprägte Reinheits- und Dämonensprache.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: jeden unreinen Vogel
  rationale: ὄρνεον bedeutet hier schlicht »Vogel«; eine nähere Bestimmung als Aas- oder Raubvogel wäre nicht ausdrücklich im griechischen Text enthalten.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: jedes unreine und verhasste Tier
  rationale: θηρίον steht hier generisch für ein Tier, nicht als Titel des endzeitlichen »Tieres«. »Verhasst« wahrt den passiv-resultativen Sinn des Partizips μεμισημένου.
theological_decisions:
- issue: Ob θηρίου als Titel des apokalyptischen »Tieres« oder als gewöhnliche Bezeichnung für ein Tier zu verstehen ist
  choice: gewöhnliche Bezeichnung »Tier«
  alternative: das Tier als symbolischer Gegenspieler
  rationale: Das Wort ist von παντός bestimmt und mit unreinen Geistern und Vögeln zusammengestellt. Daher liegt hier die generische Bedeutung nahe; eine Großschreibung würde eine spezielle Identifikation in den Text eintragen.
- issue: Bedeutung von φυλακή in der Gerichtsschilderung
  choice: Gefängnis
  alternative: Aufenthaltsort oder Schlupfwinkel
  rationale: »Gefängnis« gibt die Bedeutung eines Ortes der Verwahrung direkt wieder. Da das Wort im Zusammenhang auch einen von solchen Wesen bewohnten oder aufgesuchten Ort bezeichnen kann, bleibt diese Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst feierlichem Rhythmus. Die Wiederholung »Gefallen, gefallen« und die dreifache Wendung »zu einem Gefängnis« erhalten die eindringliche Struktur des griechischen Textes. Die Fußnotenmarker stehen unmittelbar bei dem jeweils erläuterten Ausdruck beziehungsweise der betroffenen Textvariante.
