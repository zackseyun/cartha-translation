id: REV.18.3
reference: Revelation 18:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: de
  text: Denn alle Völker sind durch den Wein des Zorns ihrer Unzucht zu Fall gekommen[a][b]. Die Könige der Erde haben mit ihr Unzucht getrieben[c], und die Kaufleute der Erde sind durch die Macht ihres ausschweifenden Luxus reich geworden[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine verbreitete Lesart lautet: „Denn alle Völker haben vom Wein … getrunken.“ Der vorliegende griechische Text lautet dagegen: „sind … zu Fall gekommen“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „vom Wein der Leidenschaft ihrer Unzucht“. Die Folge griechischer Genitive lässt mehrere Beziehungen zu, und θυμός kann je nach Verständnis des Bildes „Zorn“ oder „Leidenschaft“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: Die Rede von „Unzucht“ ist hier wahrscheinlich ein Bild für verderbliche, götzendienerische und ausbeuterische Verbindungen; die Übersetzung bewahrt jedoch bewusst das sexuelle Bild des Griechischen.
    reason: alternative_reading
  - marker: d
    text: Das griechische Wort bezeichnet maßlosen, selbstgefälligen und überheblichen Luxus, nicht bloß materiellen Komfort.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Ankündigung vom Fall Babylons ein und bewahrt den kausalen Zusammenhang.
- source_word: ἐκ τοῦ οἴνου
  choice: durch den Wein
  rationale: ἐκ bezeichnet hier den Ursprung beziehungsweise die Ursache ihres Falls. Im Deutschen gibt „durch“ diesen Zusammenhang idiomatisch wieder und erhält zugleich das Weinbild.
- source_word: θυμοῦ
  choice: Wut
  rationale: θυμός kann Zorn, Wut oder heftige Leidenschaft bezeichnen. „Wut“ bewahrt die zerstörerische Intensität der Wendung; die mögliche Bedeutung „Leidenschaft“ wird in einer Fußnote genannt.
- source_word: πορνείας
  choice: Unzucht
  rationale: „Unzucht“ bewahrt in würdigem, knappem Deutsch das sexuelle Bild des griechischen Wortes, ohne es vorschnell ausschließlich als Götzendienst oder politische Untreue auszulegen.
- source_word: πέπτωκαν
  choice: sind … zu Fall gekommen
  rationale: Der vorgelegte SBLGNT-Text hat πέπτωκαν, Perfekt von πίπτω, „fallen“. Die Übersetzung folgt dieser Lesart trotz der verbreiteten Variante πέπωκαν, „haben getrunken“.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: Bezeichnet die Völker in ihrer Gesamtheit; „Völker“ ist im Kontext natürlicher und treffender als „Heiden“.
- source_word: μετ’ αὐτῆς ἐπόρνευσαν
  choice: haben mit ihr Unzucht getrieben
  rationale: Gibt das wiederkehrende sexuelle Bild unmittelbar wieder und lässt dessen religiöse, politische und wirtschaftliche Bedeutung offen.
- source_word: ἔμποροι
  choice: Kaufleute
  rationale: Passt zum Handels- und Wirtschaftskontext des Kapitels und ist im modernen Standarddeutsch klar verständlich.
- source_word: ἐκ τῆς δυνάμεως
  choice: durch die Macht
  rationale: Bewahrt die Grundbedeutung von δύναμις und stellt den Luxus als wirksame, bereichernde Kraft dar, statt δύναμις stillschweigend mit „Reichtum“ gleichzusetzen.
- source_word: στρήνους
  choice: ausschweifender Luxus
  rationale: στρῆνος bezeichnet nicht bloß Wohlstand oder Komfort, sondern überheblichen, selbstgefälligen und maßlosen Luxus. Das Adjektiv macht diese negative Färbung im Haupttext sichtbar.
- source_word: ἐπλούτησαν
  choice: sind … reich geworden
  rationale: Gibt das erzielte Ergebnis des Aorists in natürlichem Deutsch wieder.
theological_decisions:
- issue: Soll πορνεία/πορνεύω wörtlich-bildhaft oder unmittelbar als Götzendienst, Untreue beziehungsweise korrupte Bündnispolitik wiedergegeben werden?
  choice: Das sexuelle Bild wird mit „Unzucht“ und „Unzucht treiben“ beibehalten.
  alternative: Götzendienst treiben; geistlichen Ehebruch begehen; sich auf korrupte Bündnisse einlassen
  rationale: Die Offenbarung verbindet in diesem Bild religiöse, politische und wirtschaftliche Verderbtheit. Eine deutende Ersetzung würde die absichtliche Mehrschichtigkeit auf nur eine Bedeutung verengen.
- issue: Wie ist die ungewöhnliche Lesart πέπτωκαν gegenüber πέπωκαν zu behandeln?
  choice: 'Der Haupttext folgt dem ausdrücklich vorgelegten SBLGNT-Wortlaut: „sind … zu Fall gekommen“.'
  alternative: „haben … getrunken“ nach der verbreiteten Lesart πέπωκαν
  rationale: Die Übersetzung soll primär der angegebenen originalsprachlichen Ausgabe folgen. Die wichtige Textvariante wird transparent in einer Fußnote geboten und nicht stillschweigend in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. „Unzucht“ ist bewusst bildkräftig und etwas gehoben, bleibt aber allgemein verständlich. „Ausschweifender Luxus“ macht die deutlich negative Wertung von στρῆνος ohne konfessionelle Zusatzdeutung hörbar.
