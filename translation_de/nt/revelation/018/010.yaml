id: REV.18.10
reference: Revelation 18:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: de
  text: 'Sie stehen weit entfernt, aus Angst vor ihrer Qual, und sagen: »Wehe, wehe! Du große Stadt, Babylon, du starke Stadt! Denn in einer einzigen Stunde ist dein Gericht gekommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: Sie stehen weit entfernt
  rationale: Das Perfektpartizip beschreibt ihren anhaltenden Standort bzw. Zustand; die deutsche finite Form ist im Verszusammenhang natürlich und bewahrt das räumliche Bild.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: aus Angst vor ihrer Qual
  rationale: διά mit Akkusativ bezeichnet den Grund. »Qual« gibt βασανισμός als schweres Leiden wieder, ohne die Art des Leidens unnötig als Folter festzulegen.
- source_word: λέγοντες
  choice: und sagen
  rationale: Das Partizip leitet die direkte Rede ein; die koordinierte finite Form klingt im modernen Deutschen flüssig.
- source_word: Οὐαὶ οὐαί
  choice: Wehe, wehe!
  rationale: »Wehe« bewahrt sowohl den Klang der Klage als auch den prophetisch-apokalyptischen Unheilsruf.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: du große Stadt
  rationale: Der Vokativ wird im Griechischen durch den Nominativ mit Artikel ausgedrückt. Die deutsche Anrede mit »du« macht die direkte Rede idiomatisch deutlich.
- source_word: Βαβυλὼν
  choice: Babylon
  rationale: Der Eigenname folgt der etablierten deutschen Form.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: du starke Stadt
  rationale: ἰσχυρός bezeichnet Stärke oder Macht; »stark« ist direkt, verständlich und lässt die Bedeutungsbreite offen.
- source_word: μιᾷ ὥρᾳ
  choice: in einer einzigen Stunde
  rationale: Die Wendung bezeichnet einen kurzen Zeitraum; »einzigen« hebt die im Kontext betonte Plötzlichkeit hervor, ohne den Zeitwert zu verändern.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: ist dein Gericht gekommen
  rationale: Das Perfekt gibt im Deutschen die eingetretene und nun wirksame Ankunft des Gerichts natürlich wieder; κρίσις bezeichnet hier das Gericht bzw. Urteilsgeschehen.
theological_decisions:
- issue: Bedeutung des apokalyptischen Ausrufs οὐαί
  choice: Wehe, wehe!
  alternative: Ach, ach!
  rationale: Der griechische Ruf kann Klage und drohendes Unheil ausdrücken. »Wehe« erhält diese Spannung und den prophetischen Ton besser als das vorwiegend klagende »Ach«.
- issue: Wiedergabe von κρίσις
  choice: Gericht
  alternative: Urteil
  rationale: »Gericht« kann sowohl den richterlichen Entscheid als auch dessen Vollzug umfassen und bewahrt damit die im apokalyptischen Kontext mögliche Bedeutungsweite.
- issue: Zeitliche Aussage von ἦλθεν
  choice: ist ... gekommen
  alternative: kam
  rationale: Die deutsche Perfektform stellt das Gericht als eingetretenes Ereignis mit gegenwärtiger Wirkung dar, ohne über den griechischen Aorist eine besondere Lehrentscheidung zu treffen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-apokalyptischem Klang. Die Anredeformen »du große Stadt« und »du starke Stadt« machen die griechische direkte Anrede natürlich sichtbar. Keine Fußnoten sind nötig, da die wesentlichen Bedeutungsnuancen im Haupttext bewahrt werden.
