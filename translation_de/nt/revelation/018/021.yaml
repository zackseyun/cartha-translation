  source_fidelity: 'Die Übersetzung bildet die Abfolge der Zeichenhandlung und Deutung zuverlässig ab: Ein mächtiger Engel nimmt einen einem großen Mühlstein vergleichbaren Stein auf, wirft ihn ins Meer und kündigt Babylons gewaltsamen, endgültigen Untergang an. »Mit solcher Wucht« gibt das Zusammenspiel von οὕτως und ὁρμήματι idiomatisch wieder; »nie wieder« trägt die emphatische Verneinung οὐ μὴ … ἔτι angemessen.'
  naturalness: Modernes, flüssiges und zugleich würdiges Standarddeutsch. Die Satzverknüpfung »Dabei sagte er« ist natürlich und macht die Zugehörigkeit der Rede zur symbolischen Handlung klar. Der Präteritumerzählstil passt zum Kontext.
  terminology: »Mächtiger Engel«, »großer Mühlstein«, »Babylon, die große Stadt« und »hinabgeworfen« sind treffend und registergerecht. Die Übersetzung legt die referenzielle oder theologische Deutung Babylons nicht fest. Eine Fußnote zu »Wucht« ist nicht erforderlich, weil die gewählte Formulierung im deutschen Kontext den relevanten Sinnbereich ausreichend vermittelt.
