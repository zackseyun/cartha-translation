id: REV.18.21
reference: Revelation 18:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: de
  text: 'Und ein mächtiger Engel hob einen Stein auf, der wie ein großer Mühlstein war, und warf ihn ins Meer. Dabei sagte er: »Mit solcher Wucht wird Babylon, die große Stadt, hinabgeworfen werden, und man wird sie nie wieder finden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦρεν
  choice: hob … auf
  rationale: Der Aorist von αἴρω bezeichnet hier das Aufnehmen des Steins zur anschließenden Zeichenhandlung; »hob … auf« bewahrt die bewusste körperliche Bewegung.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: ein mächtiger Engel
  rationale: Im Deutschen gibt »ein« die einzelne Engelsgestalt natürlich wieder; »mächtig« entspricht ἰσχυρός und passt zum würdevollen apokalyptischen Stil.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: einen Stein …, der wie ein großer Mühlstein war
  rationale: Die Formulierung wahrt mit »wie« den Vergleich, statt den Stein eindeutig als Mühlstein zu identifizieren.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: warf ihn ins Meer
  rationale: »Warf« gibt βάλλω in natürlichem Gegenwartsdeutsch wieder und erhält die kraftvolle Bewegung.
- source_word: Οὕτως
  choice: Mit solcher Wucht
  rationale: Οὕτως verweist auf die vorgeführte Zeichenhandlung; zusammen mit ὁρμήματι drückt die Wendung Art und Heftigkeit des kommenden Sturzes idiomatisch aus.
- source_word: ὁρμήματι
  choice: mit solcher Wucht
  rationale: Das Substantiv bezeichnet eine heftige, drängende Bewegung beziehungsweise einen gewaltsamen Ansturm. »Wucht« bewahrt die plötzliche Kraft des Bildes, ohne unnötig abstrakt zu klingen.
- source_word: βληθήσεται
  choice: wird … hinabgeworfen werden
  rationale: Das Futur Passiv greift das vorherige Werfen des Steins auf. »Hinabgeworfen« verdeutlicht die im Bild erkennbare stürzende und vernichtende Bewegung.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: Babylon, die große Stadt
  rationale: Die Apposition und die wiederkehrende apokalyptische Bezeichnung werden unmittelbar bewahrt.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: man wird sie nie wieder finden
  rationale: »Nie wieder« gibt die emphatische Verneinung οὐ μή zusammen mit ἔτι klar und idiomatisch wieder; das unpersönliche »man« ermöglicht den natürlichen Aktivsatz, ohne einen bestimmten Suchenden einzuführen.
theological_decisions:
- issue: Art des Vernichtungsbildes für Babylon
  choice: Das Gericht wird als wuchtig und endgültig wiedergegeben, ohne festzulegen, ob Babylon wörtlich, symbolisch oder in beiderlei Hinsicht zu verstehen ist.
  alternative: Babylon ausdrücklich als historische Stadt, gottfeindliches Weltsystem oder fest umrissenes endzeitliches Symbol deuten.
  rationale: Der Vers selbst verbindet eine symbolische Handlung mit der Ankündigung eines endgültigen Sturzes. Die Übersetzung bewahrt diese Bildsprache und ihre theologische Spannung, ohne ein nicht ausdrücklich genanntes eschatologisches Schema einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Bildsprache und die Wiederholung des Werfens bleiben erhalten. Es ist keine Fußnote nötig, da »mit solcher Wucht« den Bedeutungsumfang von ὁρμήματι im Kontext verständlich abbildet.
