source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: de
  text: 'Und ich hörte eine andere Stimme aus dem Himmel sagen: »Geht aus ihr hinaus, mein Volk, damit ihr euch nicht an ihren Sünden beteiligt und damit ihr nichts von ihren Plagen erduldet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: eine andere Stimme
  rationale: Bezeichnet eine weitere, von der zuvor sprechenden unterschiedene Stimme und entspricht natürlichem Deutsch.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel
  rationale: Der Kontext der Offenbarung meint den himmlischen Bereich; »aus dem Himmel« gibt zudem die Herkunftsrichtung von ἐκ wieder.
- source_word: Ἐξέλθατε … ἐξ αὐτῆς
  choice: Geht aus ihr hinaus
  rationale: Der Aoristimperativ Plural fordert unmittelbar zum Verlassen auf. »Geht … hinaus« ist im Deutschen perspektivisch neutral und verbindet sich natürlich mit »aus ihr«.
- source_word: ὁ λαός μου
  choice: mein Volk
  rationale: Bewahrt die direkte, bundesbezogene Anrede ohne altertümliche Anredepartikel.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: damit ihr euch nicht an ihren Sünden beteiligt
  rationale: συγκοινωνέω bezeichnet Beteiligung oder Teilhabe. Die reflexive deutsche Form macht die gemeinte Mitschuld klar, ohne den Text auszudeuten.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: damit ihr nichts von ihren Plagen abbekommt
  rationale: »Nichts von … abbekommen« bildet die partitive Konstruktion ἐκ mit λαμβάνω idiomatisch ab; »Plagen« bewahrt die biblische Gerichtssprache.
theological_decisions:
- issue: Bezug und Bildsprache von αὐτῆς
  choice: Das feminine Pronomen wird mit »ihr/ihren« bewahrt.
  alternative: Mit »daraus/deren« oder neutralem Bezug auf die Stadt beziehungsweise das System übersetzen.
  rationale: Babylon wird im Zusammenhang als Frau und Stadt personifiziert. Die feminine Sprache erhält diese literarische Bildwelt, ohne den Referenten einseitig festzulegen.
- issue: Funktion der beiden ἵνα-Sätze
  choice: Beide werden als koordinierte Zweck- beziehungsweise Warnsätze mit wiederholtem »damit … nicht« wiedergegeben.
  alternative: Die Sätze mit »sonst« oder »damit nicht … und keine …« stärker zusammenziehen.
  rationale: Das wiederholte ἵνα mit Konjunktiv setzt zwei parallele Folgen beziehungsweise Ziele des Herausgehens und sollte rhetorisch erkennbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich, ohne altertümliche Formen. Das feminine Babylon-Bild wird konsequent erhalten; die beiden parallelen Warnungen bleiben syntaktisch sichtbar.
