  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: de
  text: 'Und sie schrien, als sie den Rauch ihres Brandes sahen: »Welche Stadt ist der großen Stadt gleich?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν
  choice: schrien sie
  rationale: Das Verb bezeichnet einen lauten Ruf oder Schrei; »schrien« gibt seine Stärke knapp und natürlich wieder.
- source_word: βλέποντες
  choice: als sie … sahen
  rationale: Das Präsenspartizip bezeichnet eine zum Schreien gleichzeitige Wahrnehmung; die temporale Wiedergabe ist im Deutschen idiomatisch.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: den Rauch ihres Brandes
  rationale: »Brand« gibt πύρωσις als Verbrennung beziehungsweise Brennen wieder. Das Possessivpronomen bewahrt den Rückbezug auf die grammatisch feminine und personifizierte Stadt.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: Welche Stadt war der großen Stadt gleich?
  rationale: Der griechische Satz ist ohne ausgedrückte Kopula elliptisch. »Stadt« wird aus dem Vergleichsglied ergänzt; das Präteritum passt zur Klage über die nun zerstörte Stadt, ohne eine im Griechischen ausdrücklich markierte Zeitform vorzutäuschen.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: der großen Stadt
  rationale: Direkte Wiedergabe der substantivischen Artikel-Adjektiv-Verbindung und des bekannten Referenten im Kontext.
theological_decisions:
- issue: Personifikation Babylons beziehungsweise der Stadt
  choice: Femininen Rückbezug durch »ihres Brandes« beibehalten
  alternative: Neutralisierendes »des Brandes der Stadt«
  rationale: Die Offenbarung stellt Babylon durchgehend als Frau und Stadt dar; der feminine Rückbezug bewahrt diese literarisch-theologische Bildsprache.
- issue: Zeitbezug der elliptischen Vergleichsfrage
  choice: »war … gleich«
  alternative: »ist … gleich«
  rationale: Im Griechischen fehlt die Kopula, sodass deren Tempus nicht ausdrücklich festgelegt ist. Das Präteritum entspricht dem unmittelbaren Kontext der bereits brennenden und beklagten Stadt; die Alternative mit Präsens bleibt grammatisch möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und mündlich gut verständlich; die rhetorische Klage bleibt knapp und eindringlich.
