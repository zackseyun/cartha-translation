  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: de
  text: eine Ladung Gold und Silber, Edelsteine und Perlen, feines Leinen, Purpurstoff, Seide und Scharlachstoff, dazu jede Art von Thujaholz[a] und Gegenstände aller Art aus Elfenbein, aus kostbarstem Holz, aus Bronze, Eisen und Marmor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist ein kostbares, wohlriechendes Holz; die genaue Baumart ist unsicher. Auch „Zitrusholz“ wird als Übersetzung verwendet.
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: eine Ladung
  rationale: γόμος bezeichnet eine Schiffsladung oder Fracht. Der Singular wird als Sammelbegriff beibehalten; der Satz setzt syntaktisch den vorangehenden Vers fort.
- source_word: λίθου τιμίου
  choice: Edelsteine
  rationale: Der griechische Singular bezeichnet hier kollektiv das Material beziehungsweise die Handelsware; im Deutschen ist der Plural in einer Warenliste natürlicher.
- source_word: βυσσίνου
  choice: feinstes Leinen
  rationale: βύσσινος bezeichnet besonders feines, kostbares Leinengewebe. „Feinstes Leinen“ vermittelt Material und Luxuscharakter in natürlichem Deutsch.
- source_word: πορφύρας
  choice: Purpurstoff
  rationale: πορφύρα kann Purpurfarbe, purpurnen Stoff oder Kleidung bezeichnen. Im Zusammenhang einer Warenliste macht „Purpurstoff“ die textile Handelsware deutlich, ohne eine bestimmte Kleidungsform vorauszusetzen.
- source_word: σιρικοῦ
  choice: Seide
  rationale: σιρικός bezeichnet Seide beziehungsweise Seidenware; „Seide“ ist die klare und übliche deutsche Warenbezeichnung.
- source_word: κοκκίνου
  choice: Scharlachstoff
  rationale: Das Wort bezeichnet scharlachrotes Material beziehungsweise Gewebe. „Scharlachstoff“ entspricht parallel dem „Purpurstoff“ und passt zur Handelsliste.
- source_word: πᾶν ξύλον θύϊνον
  choice: jede Art von Thujaholz
  rationale: θύϊνος bezeichnet ein kostbares, wohlriechendes Holz, dessen genaue botanische Zuordnung nicht völlig sicher ist. „Thujaholz“ wahrt den spezifischen traditionellen Namen; die Fußnote erläutert die Unsicherheit.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: Gegenstände aller Art aus Elfenbein
  rationale: σκεῦος ist weiter als „Gefäß“ und kann Geräte, Gefäße oder andere gefertigte Gegenstände meinen. „Gegenstände aller Art“ bildet die Breite des Ausdrucks und πᾶν idiomatisch ab.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: Gegenstände aller Art … aus kostbarstem Holz
  rationale: Der Superlativ τιμιωτάτου wird mit „kostbarstem“ formal gewahrt. Das gemeinsame Substantiv „Gegenstände“ gilt in der deutschen Aufzählung auch für die anschließend genannten Materialien.
- source_word: χαλκοῦ
  choice: Bronze
  rationale: χαλκός kann Kupfer oder Bronze bezeichnen. Für antike Gebrauchs- und Luxusgegenstände ist „Bronze“ hier die wahrscheinlichere und im Deutschen geläufigere Wiedergabe.
theological_decisions: []
translation_notes:
  register: Die Fassung bewahrt den Charakter einer fortlaufenden, üppigen Warenliste und endet entsprechend dem griechischen Satzfragment mit Komma. „Gegenstände“ ist bewusst weiter und gegenwartsverständlicher als „Gefäße“. Die gehäuften Verbindungen mit καί werden im Deutschen teils durch Kommas und „dazu“ gegliedert, ohne Elemente der Liste auszulassen.
