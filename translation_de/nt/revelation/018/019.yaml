    rationale: Das Griechische beschreibt die Rufenden als zugleich weinend und klagend bzw. trauernd. Eine temporale Formulierung macht beide Handlungen klar und klingt natürlicher.
  - severity: low
    issue: Die deutsche Weheformel benötigt eine idiomatischere Anbindung an „die große Stadt“.
    rationale: „Wehe, wehe der großen Stadt“ entspricht dem deutschen Gebrauch von „Wehe“ mit Dativ und bewahrt die rhetorische Klage über die Stadt, ohne eine theologische Deutung hinzuzufügen.
