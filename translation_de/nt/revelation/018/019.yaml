  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: de
  text: 'Und sie warfen Staub auf ihre Köpfe und schrien, während sie weinten und klagten: »Wehe, wehe der großen Stadt, in der alle, die Schiffe auf dem Meer hatten, durch ihren Reichtum[a] reich wurden! Denn in einer einzigen Stunde wurde sie verwüstet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch ihren kostbaren Luxus« beziehungsweise »durch ihre Pracht«. Das griechische Wort kann Reichtum, Kostbarkeit, kostspielige Pracht oder Luxus bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: sie warfen Staub auf ihre Köpfe
  rationale: Bewahrt das konkrete Bild der antiken Trauergeste und gibt den Aorist schlicht wieder.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: schrien unter Tränen und Trauer
  rationale: Gibt den lauten Klageruf sowie die beiden begleitenden Aspekte des Weinens und Trauerns natürlich und knapp wieder.
- source_word: Οὐαὶ οὐαί
  choice: Wehe, wehe!
  rationale: Erhält sowohl den Klagecharakter als auch den prophetischen Gerichtston des wiederholten Ausrufs.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: die große Stadt
  rationale: Natürliche deutsche Wiedergabe der bestimmten appositionellen Wortgruppe.
- source_word: ἐν ᾗ
  choice: in der
  rationale: Entspricht unmittelbar der lokalen Formulierung des griechischen Textes, ohne sie unnötig instrumental umzudeuten.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: alle, die Schiffe auf dem Meer hatten
  rationale: Bleibt eng am Partizipialausdruck und legt nicht fest, ob ἔχοντες ausschließlich Eigentum bezeichnet.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: durch ihre Kostbarkeit
  rationale: Bewahrt die seltene und mehrdeutige Bedeutung von τιμιότης als Kostbarkeit, hoher Wert oder kostbarer Luxus; der instrumentale Zusammenhang wird mit „durch“ klar.
- source_word: μιᾷ ὥρᾳ
  choice: in einer einzigen Stunde
  rationale: „Einzigen“ verdeutlicht idiomatisch die im Ausdruck liegende Plötzlichkeit, ohne einen zusätzlichen Zeitraum einzuführen.
- source_word: ἠρημώθη
  choice: wurde sie verwüstet
  rationale: Gibt den Aorist Passiv natürlich wieder und bewahrt den Gedanken einer von außen herbeigeführten Verödung.
theological_decisions:
- issue: Klage- und Gerichtscharakter von Οὐαὶ οὐαί
  choice: Wehe, wehe!
  alternative: Ach, ach!
  rationale: „Wehe“ wahrt die Spannung zwischen Trauerklage und prophetischem Gerichtsausruf; „Ach“ würde den Gerichtsanklang abschwächen.
- issue: Mehrdeutigkeit von τιμιότης im wirtschaftlichen Kontext
  choice: Kostbarkeit
  alternative: Reichtum; kostbarer Luxus; Pracht
  rationale: Der griechische Ausdruck kann hohen Wert, Kostbarkeit oder kostspielige Pracht bezeichnen. „Kostbarkeit“ hält diese Bedeutungsbreite eher offen, während „Reichtum“ den Begriff auf Besitz verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Bezug zur griechischen Bildsprache. Der Ausruf „Wehe, wehe“ bewahrt den prophetischen Ton. Die seltene Formulierung „durch ihre Kostbarkeit“ wird durch eine Fußnote erläutert, damit die echte lexikalische Mehrdeutigkeit sichtbar bleibt.
