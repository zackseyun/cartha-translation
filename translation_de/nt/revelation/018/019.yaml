revisions:
- from: 'Und sie warfen Staub auf ihre Köpfe und schrien unter Tränen und Trauer: »Wehe, wehe! Die große Stadt, in der alle, die Schiffe auf dem Meer hatten, durch ihre Kostbarkeit reich wurden![a] Denn in einer einzigen Stunde wurde sie verwüstet.«'
  to: 'Und sie warfen Staub auf ihre Köpfe und schrien, während sie weinten und klagten: »Wehe, wehe der großen Stadt, in der alle, die Schiffe auf dem Meer hatten, durch ihren Reichtum[a] reich wurden! Denn in einer einzigen Stunde wurde sie verwüstet.«'
  rationale: Die Revision verbessert die natürliche deutsche Syntax und macht die beiden begleitenden Klagehandlungen explizit. Zugleich ersetzt sie das missverständliche „Kostbarkeit“ im Haupttext durch das im wirtschaftlichen Kontext naheliegende „Reichtum“; die Fußnote erhält die lexikalische Mehrdeutigkeit von τιμιότης. Die örtliche Formulierung „in der“ bleibt bestehen und vermeidet eine überstarke instrumentale Umdeutung von ἐν ᾗ.
  reviewer_model: gpt-5.6-terra
