  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: de
  text: Vergeltet ihr, wie auch sie selbst vergolten hat, und vergeltet ihr doppelt entsprechend ihren Taten[a]. In dem Kelch, in dem sie den Trank gemischt hat, mischt ihr für sie eine doppelte Menge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und verdoppelt ihr das Doppelte entsprechend ihren Taten«; die griechische Formulierung ist knapp und nachdrücklich und kann eine gesteigerte Vergeltung betonen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Kelch, in dem sie ein Getränk zubereitet hat; das Bild kann einen für das Gericht bereiteten Trank hervorrufen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ
  choice: Zahlt ihr heim
  rationale: Der Aoristimperativ bezeichnet hier vergeltende Rückzahlung. „Heimzahlen“ gibt diesen Sinn im modernen Deutschen knapp und deutlich wieder.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: wie auch sie selbst heimgezahlt hat
  rationale: „Sie selbst“ bewahrt die Hervorhebung durch αὐτή; das Perfekt bezeichnet ihre vorausgegangene, für das Urteil maßgebliche Handlung.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: gebt ihr das Doppelte
  rationale: Die griechische Wendung ist verdichtet und rhetorisch verstärkend. Die deutsche Fassung bleibt verständlich, erhält aber die ausdrückliche Verdoppelung; die ungewöhnliche Formulierung wird in einer Fußnote vermerkt.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: entsprechend ihren Taten
  rationale: „Taten“ gibt ἔργα natürlich wieder und bewahrt den Gedanken einer Vergeltung nach ihrem Handeln.
- source_word: ἐν τῷ ποτηρίῳ
  choice: in dem Kelch
  rationale: „Kelch“ bewahrt das in Offenbarung und prophetischer Gerichtssprache geläufige Bild.
- source_word: ᾧ ἐκέρασεν
  choice: den sie gemischt hat
  rationale: κεράννυμι bedeutet, ein Getränk durch Mischen zuzubereiten. „Gemischt“ erhält das konkrete Bild, statt es zu verallgemeinern.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: Mischt ihr ... eine doppelte Portion
  rationale: Die Wiederholung von „mischen“ spiegelt die Wortwiederholung im Griechischen; „eine doppelte Portion“ formuliert διπλοῦν idiomatisch und hält die gesteigerte Vergeltung fest.
theological_decisions:
- issue: Art der doppelten Vergeltung
  choice: Die verdoppelte Vergeltung als apokalyptisch-symbolische und gerichtliche Aussage wiedergeben, ohne ihre Härte abzuschwächen.
  alternative: „Doppelt“ als exakt berechenbare gesetzliche Strafe verstehen oder das Bild zu einer allgemeinen Aussage über Gerechtigkeit verflachen.
  rationale: Der Text verbindet eine an ihren Taten ausgerichtete Vergeltung mit rhetorisch gesteigerter Verdoppelung. Die Übersetzung lässt offen, ob die Verdoppelung mathematisch oder vor allem emphatisch gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkten Imperative und die Wiederholung von „heimzahlen“ und „mischen“ bewahren den eindringlichen Gerichtston und die Bildsprache des Ausgangstextes.
