  to: Vergeltet ihr, wie auch sie selbst vergolten hat, und vergeltet ihr doppelt entsprechend ihren Taten[a]. In dem Kelch, in dem sie den Trank gemischt hat, mischt ihr für sie eine doppelte Menge[b].
  rationale: Die Revision bewahrt die beiden Imperative, die Hervorhebung „sie selbst“, die doppelte Vergeltung und die Wiederholung von „mischen“. Sie beseitigt zugleich die deutsche Mehrdeutigkeit, dass der Kelch selbst gemischt worden sei. „Den Trank“ ist eine im griechischen Bild implizite, für idiomatisches Deutsch notwendige Ergänzung und legt die Art des Getränks nicht fest.
