  naturalness: „Zahlt ihr heim“ ist möglich, klingt hier aber etwas umgangssprachlich und die Konstruktion „in dem Kelch, den sie gemischt hat“ ist im Deutschen missverständlich, als sei der Kelch selbst gemischt worden. „Vergeltet“ sowie eine explizite Ergänzung „den Trank“ ergeben modernes, würdiges und verständliches Standarddeutsch.
  terminology: „Vergelten“, „Taten“, „Kelch“ und „mischen“ sind für den gerichtlichen und bildhaften Kontext treffend. Die doppelte Vergeltung wird beibehalten, ohne sie als mathematisch genaue Strafnorm festzulegen.
