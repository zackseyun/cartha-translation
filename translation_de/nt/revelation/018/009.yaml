  terminology: „Könige der Erde“, „Unzucht“, „Üppigkeit“ und „Brand“ bewahren die apokalyptische Bildsprache, ohne sie konfessionell auszudeuten. Die Fußnote zu κόψονται ist sachlich und korrekt verankert.
