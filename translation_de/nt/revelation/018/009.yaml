id: REV.18.9
reference: Revelation 18:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: de
  text: Und die Könige der Erde, die mit ihr Unzucht getrieben und in Üppigkeit gelebt haben, werden über sie weinen und klagen[a], wenn sie den Rauch ihres Brandes sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich an die Brust schlagen“; das griechische Verb bezeichnet eine demonstrative Trauerklage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: werden … weinen
  rationale: Gibt das hörbare Weinen und Jammern des griechischen Verbs in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: κόψονται
  choice: werden … klagen
  rationale: Das Verb bezeichnet in diesem Zusammenhang demonstrative Trauer; „klagen“ bewahrt den Sinn, ohne irreführend eine wörtliche Selbstverletzung nahezulegen.
- source_word: ἐπ’ αὐτὴν
  choice: über sie
  rationale: Bei Verben des Trauerns bezeichnet ἐπί mit Akkusativ die Person beziehungsweise Größe, der die Klage gilt.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: die Könige der Erde
  rationale: Bewahrt die für die Offenbarung typische, umfassende Bezeichnung der irdischen Herrscher.
- source_word: μετ’ αὐτῆς
  choice: mit ihr
  rationale: Die präpositionale Bestimmung steht vor den beiden koordinierten Partizipien und kann im Deutschen natürlich auf beide bezogen werden.
- source_word: πορνεύσαντες
  choice: Unzucht getrieben
  rationale: Bewahrt die ausdrücklich sexualisierte Bildsprache, die in der Offenbarung zugleich für abgöttische und korrupte Bündnisse stehen kann.
- source_word: στρηνιάσαντες
  choice: in Üppigkeit gelebt
  rationale: Vermittelt ausschweifenden, selbstgefälligen Luxus und passt zur wirtschaftlich-moralischen Kritik an Babylon.
- source_word: ὅταν βλέπωσιν
  choice: wenn sie … sehen
  rationale: Gibt die zukünftige Bedingung in der prophetischen Darstellung idiomatisch wieder.
- source_word: τὸν καπνὸν
  choice: den Rauch
  rationale: Direkte und natürliche Entsprechung.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: ihres Brandes
  rationale: Bezeichnet ihre Verbrennung beziehungsweise Feuersbrunst knapp und idiomatisch, ohne zusätzliche Einzelheiten aus benachbarten Versen einzutragen.
theological_decisions:
- issue: Bildsprache der Unzucht Babylons
  choice: Die sexualisierte Formulierung „Unzucht getrieben“ bleibt im Haupttext erhalten.
  alternative: 'Abstrakter: „sich mit ihr vergangen“ oder „ihr untreu gefolgt“.'
  rationale: Die Offenbarung verwendet Unzuchtsbildsprache wiederholt für Götzendienst und korrupte Bündnisse. Eine abstrakte Wiedergabe würde die Spannung und Schärfe des Bildes vorschnell auflösen.
- issue: Bedeutung von κόψονται
  choice: Wiedergabe des Trauersinns mit „klagen“.
  alternative: 'Bildhafter: „sich an die Brust schlagen“; missverständlich wörtlich: „sich schlagen/schneiden“.'
  rationale: Im Kontext bezeichnet das Verb eine sicht- und hörbare Trauerhandlung. „Klagen“ vermittelt deren Sinn; die körperliche Komponente wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau hält die gemeinsame Beziehung „mit ihr“ zu beiden Handlungen offen und natürlich. „Unzucht“ erhält die prophetische Bildsprache; „Üppigkeit“ markiert selbstgefälligen Luxus.
