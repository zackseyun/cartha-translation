    issue: »zu einem bestimmten Ort«
    rationale: Das Adjektiv »bestimmten« ist im griechischen τόπον nicht ausgedrückt und verengt bzw. präzisiert die bewusst problematische Wendung unnötig.
  - severity: low
    issue: »blieben in der Ferne stehen«
    rationale: »Blieben« kann ein bereits bestehendes Stehen bzw. Verharren ausdrücken. Der Aorist ἔστησαν beschreibt einfacher, dass sie sich in einiger Entfernung aufstellten/standen.
