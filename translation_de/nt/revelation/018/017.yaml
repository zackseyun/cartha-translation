revisions:
- from: Denn in einer einzigen Stunde ist dieser gewaltige Reichtum verwüstet worden. Und jeder Steuermann, jeder, der zu einem bestimmten Ort fährt[a], die Seeleute und alle, die auf dem Meer arbeiten, blieben in der Ferne stehen.
  to: Denn in einer einzigen Stunde ist dieser gewaltige Reichtum verwüstet worden. Und jeder Steuermann, jeder, der zu einem Ort fährt[a], die Seeleute und alle, die auf dem Meer arbeiten, standen von weitem.
  rationale: Die Revision entfernt die nicht im Grundtext liegende Bestimmung »bestimmten« und ersetzt die aspektuell missverständliche Formulierung »blieben ... stehen« durch »standen von weitem«. Die Ambiguität der zweiten Personengruppe und die Aufzählungsstruktur bleiben erhalten.
