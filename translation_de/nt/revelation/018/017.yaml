source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: de
  text: Denn in einer einzigen Stunde ist dieser gewaltige Reichtum verwüstet worden. Und jeder Steuermann, jeder, der zu einem Ort fährt[a], die Seeleute und alle, die auf dem Meer arbeiten, standen von weitem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist nicht ganz eindeutig; auch möglich: »jeder, der irgendwohin fährt«, »jeder, der einen Hafen anläuft« oder allgemein »jeder, der zur See fährt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise den Inhalt der vorausgehenden Klage ein und stellt den Zusammenhang natürlich her.
- source_word: μιᾷ ὥρᾳ
  choice: in einer einzigen Stunde
  rationale: Gibt den temporalen Dativ wieder und hebt wie das Griechische die erschreckende Plötzlichkeit hervor, ohne die Zeitangabe umzudeuten.
- source_word: ἠρημώθη
  choice: ist … verwüstet worden
  rationale: Bewahrt Passiv und Perfektwirkung im Deutschen sowie den Sinn völliger Verwüstung.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: dieser gewaltige Reichtum
  rationale: Gibt die hinweisende und intensivierend wertende Kraft von τοσοῦτος in natürlichem, würdigem Deutsch wieder.
- source_word: πᾶς κυβερνήτης
  choice: jeder Steuermann
  rationale: Bezeichnet im Seefahrtszusammenhang denjenigen, der ein Schiff steuert; die Übersetzung bleibt näher am griechischen Begriff als das weiter gefasste »Kapitän«.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: jeder, der zu einem bestimmten Ort fährt
  rationale: Folgt der syntaktischen Form und wahrt die idiomatische Unbestimmtheit der umstrittenen Wendung, ohne sie sicher auf Passagiere, Häfen oder eine Berufsgruppe festzulegen.
- source_word: ναῦται
  choice: die Seeleute
  rationale: Klare und gegenwärtige deutsche Bezeichnung für die ausdrücklich genannte Gruppe.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: alle, die auf dem Meer arbeiten
  rationale: Bewahrt die Breite des Ausdrucks und beschränkt ihn nicht auf Seeleute, die bereits gesondert genannt sind.
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: blieben in der Ferne stehen
  rationale: Gibt die räumliche Distanz und die eingenommene beziehungsweise beibehaltene Stellung idiomatisch wieder; der Aorist wird im deutschen Erzählzusammenhang natürlich ausgedrückt.
theological_decisions:
- issue: Umfang der genannten Gruppen aus der Seefahrt
  choice: Die koordinierten Gruppen werden getrennt wiedergegeben.
  alternative: Die gesamte Aufzählung zu »allen Seefahrern« zusammenzufassen oder die zweite Gruppe ausdrücklich als Passagiere beziehungsweise Kaufleute zu bestimmen.
  rationale: Das Griechische führt mehrere Gruppen nebeneinander auf und zeichnet damit die umfassenden wirtschaftlichen Folgen von Babylons Fall. Ihre Unterscheidung wird bewahrt, ohne eine nicht ausdrücklich genannte Identität einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzstruktur folgt der griechischen Aufzählung, wird aber durch Artikelsetzung und idiomatische Verbwahl natürlich gestaltet.
