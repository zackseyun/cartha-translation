id: REV.18.5
reference: Revelation 18:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: de
  text: Denn ihre Sünden haben sich bis zum Himmel aufgetürmt[a], und Gott hat ihrer Verfehlungen gedacht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sind bis zum Himmel zusammengefügt worden“. Das griechische Verb bedeutet eigentlich „ankleben, zusammenfügen“ und beschreibt hier bildhaft eine gewaltige Anhäufung von Sünden.'
    reason: lexical_alternative
  - marker: b
    text: Dass Gott ihrer Verfehlungen „gedacht“ hat, bedeutet in diesem Zusammenhang, dass er sie nicht übergangen hat, sondern nun gerichtlich darauf reagieren wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die Aufforderung im vorhergehenden Vers ein und bewahrt die kausale Verknüpfung.
- source_word: ἐκολλήθησαν
  choice: haben sich aufgetürmt
  rationale: Das Verb bedeutet wörtlich „zusammengefügt/angeklebt werden“. Im Zusammenhang mit Sünden und der Ausdehnung bis zum Himmel bezeichnet es bildhaft eine gewaltige Anhäufung; „sich auftürmen“ gibt dieses Bild natürlich wieder.
- source_word: αἱ ἁμαρτίαι
  choice: ihre Sünden
  rationale: „Sünden“ ist die klare und übliche Entsprechung für ἁμαρτίαι.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: bis zum Himmel
  rationale: Gibt die räumliche Grenze eng am griechischen Ausdruck wieder und erhält das vertikale Bild.
- source_word: ἐμνημόνευσεν
  choice: hat gedacht
  rationale: In der Verbindung „einer Sache gedenken“ bleibt der Gedanke des Erinnerns erhalten; im Kontext deutet das göttliche Gedenken auf bevorstehendes gerichtliches Handeln, ohne dieses in den Text hineinzuerklären.
- source_word: ὁ θεός
  choice: Gott
  rationale: Direkte und übliche Wiedergabe.
- source_word: τὰ ἀδικήματα
  choice: ihrer Verfehlungen
  rationale: „Verfehlungen“ bezeichnet konkrete unrechte Taten und wahrt die sprachliche Unterscheidung zu ἁμαρτίαι („Sünden“), ohne den Begriff auf juristische Straftaten zu verengen.
theological_decisions:
- issue: Unterscheidung zwischen ἁμαρτίαι und ἀδικήματα
  choice: Wiedergabe mit „Sünden“ und „Verfehlungen“
  alternative: Beide Begriffe mit „Sünden“ oder „Übertretungen“ wiedergeben
  rationale: Der griechische Text verwendet zwei verwandte, aber unterschiedliche Wörter. Zwei deutsche Begriffe bewahren diese rhetorische Differenz, ohne eine übermäßig scharfe sachliche Trennung zu behaupten.
- issue: Bedeutung von Gottes Gedenken
  choice: „Gott hat ihrer Verfehlungen gedacht“
  alternative: „Gott hat sie für ihre Verfehlungen zur Rechenschaft gezogen“
  rationale: Göttliches Gedenken schließt hier im Kontext gerichtliches Handeln ein. Die Übersetzung bewahrt jedoch das Verb „gedenken“ und damit die Aussageform des Ausgangstextes, statt die Folge ausdrücklich in den Wortlaut aufzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich bis zum Himmel auftürmen“ vermittelt das starke Bild der Anhäufung idiomatisch; „einer Sache gedenken“ bewahrt den biblisch-feierlichen und zugleich gerichtlichen Klang.
