revisions:
- from: Die Händler mit diesen Dingen[a], die durch sie reich geworden waren, werden aus Angst vor ihrer Qual in weiter Ferne stehen, weinen und trauern.
  to: Die Händler dieser Waren[a], die durch sie reich geworden sind, werden aus Angst vor ihrer Qual weit entfernt stehen und weinen und trauern.
  rationale: Die Revision ersetzt die missverständliche und unnatürliche Formulierung »Händler mit diesen Dingen« durch »Händler dieser Waren«. Sie glättet außerdem die Distanzangabe, ohne den räumlichen Abstand oder den Grund der Furcht abzuschwächen. Die Fußnote bewahrt die formal nähere, im Deutschen jedoch weniger natürliche Alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes im Wesentlichen zutreffend wieder: die Händler wurden durch Babylon reich, halten aus Furcht Abstand und weinen und trauern über ihre Qual. »Durch sie« ist als Wiedergabe von ἀπ’ αὐτῆς möglich, aber die Formulierung der Händlerbeziehung zu τούτων sollte präziser sein.'
  naturalness: »Händler mit diesen Dingen« ist im modernen Deutsch nicht idiomatisch und kann bedeuten, dass die Händler die Dinge lediglich bei sich haben. »Händler dieser Waren« bezeichnet klar die Händler, die mit den zuvor genannten Gütern handeln. »Weit entfernt stehen« ist zudem natürlicher als »in weiter Ferne stehen«.
  terminology: »Händler«, »Qual«, »weinen« und »trauern« sind treffend. »Waren« ist im Kontext der aufgezählten Handelsgüter eine natürliche, kontextuell klar begrenzte Wiedergabe von τούτων; die wörtlichere Alternative wird in der Fußnote erhalten.
  issues:
  - severity: medium
    issue: »Händler mit diesen Dingen«
    rationale: Diese Verbindung ist unidiomatisch und bildet den Genitiv τούτων nicht eindeutig als die Handelsgüter ab. Sie kann missverständlich auf bloßen Besitz statt auf Handel mit den Gütern weisen.
  - severity: low
    issue: »in weiter Ferne stehen«
    rationale: Die Wendung ist verständlich, klingt jedoch weniger natürlich als »weit entfernt stehen« und ist für ἀπὸ μακρόθεν nicht nötig.
  revised_text: Die Händler dieser Waren[a], die durch sie reich geworden sind, werden aus Angst vor ihrer Qual weit entfernt stehen und weinen und trauern.
