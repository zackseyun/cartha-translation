id: REV.18.15
reference: Revelation 18:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: de
  text: Die Händler dieser Waren[a], die durch sie reich geworden sind, werden aus Angst vor ihrer Qual weit entfernt stehen und weinen und trauern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Händler dieser Dinge«; gemeint sind die im Zusammenhang aufgezählten Luxusgüter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: Händler
  rationale: Bezeichnet Personen, die Handel treiben; »Händler« ist im wirtschaftlichen Zusammenhang natürlich und präzise.
- source_word: τούτων
  choice: mit diesen Dingen
  rationale: Der Genitiv weist auf die zuvor aufgezählten Luxusgüter zurück. Im Deutschen gibt »Händler mit diesen Dingen« die Beziehung idiomatisch wieder, ohne das Pronomen im Haupttext weiter auszudeuten.
- source_word: πλουτήσαντες ἀπ’ αὐτῆς
  choice: die durch sie reich geworden waren
  rationale: Das Partizip bezeichnet ihre vorausgegangene Bereicherung, deren Quelle bzw. Vermittlerin Babylon war. »Durch sie« ist hier natürlicher als »von ihr«, ohne eine ausdrückliche Passivbedeutung einzuführen.
- source_word: ἀπὸ μακρόθεν στήσονται
  choice: werden in weiter Ferne stehen
  rationale: Gibt die bewusst eingehaltene räumliche Distanz klar und würdig wieder.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: aus Angst vor ihrer Qual
  rationale: διά mit Akkusativ bezeichnet den Grund; der Genitiv kann im Deutschen natürlich als Angst vor der Qual wiedergegeben werden, die sie trifft.
- source_word: κλαίοντες καὶ πενθοῦντες
  choice: weinen und trauern
  rationale: Bewahrt die beiden verbundenen, aber unterschiedlichen Handlungen in natürlichem Deutsch.
theological_decisions:
- issue: Bedeutung von βασανισμός in der apokalyptischen Gerichtssprache
  choice: Qual
  alternative: Strafe; Pein
  rationale: »Qual« bewahrt die Schwere des über Babylon kommenden Gerichts, ohne den Ausdruck auf bloße seelische oder wirtschaftliche Not abzuschwächen oder eine weitergehende Lehre über endgültige Strafe einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Satzbau folgt dem griechischen Gedankengang, vermeidet jedoch unnatürliche Genitivverbindungen.
