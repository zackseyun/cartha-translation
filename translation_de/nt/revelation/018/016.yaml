  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: de
  text: 'und werden sagen: „Wehe, wehe! Die große Stadt, die in feines Leinen, Purpur und Scharlach gekleidet und mit Gold, Edelsteinen und Perlen geschmückt war!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip führt die Klage ein und knüpft an die Handelsherren aus dem vorigen Vers an. Im natürlichen Deutschen gibt eine finite, mit „und“ angeschlossene Form diese Verbindung klar wieder.
- source_word: Οὐαὶ οὐαί
  choice: Wehe, wehe!
  rationale: „Wehe“ bewahrt sowohl den Klagecharakter als auch den prophetischen Gerichtston; die Wiederholung wird erhalten.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: die große Stadt
  rationale: Natürliche deutsche Wiedergabe der griechischen Artikel-Adjektiv-Konstruktion mit ihrer Hervorhebung der Stadt.
- source_word: περιβεβλημένη
  choice: gekleidet
  rationale: Das Perfektpartizip beschreibt den prunkvollen Zustand der personifizierten Stadt; „gekleidet“ ist verständlich und bildkräftig.
- source_word: βύσσινον
  choice: feines Leinen
  rationale: Bezeichnet kostbares, feines Leinen und erhält so die Luxusmotivik.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: Purpur und Scharlach
  rationale: Die traditionellen, präzisen Farbbezeichnungen bewahren die Bildwelt von Reichtum, Rang und Pracht.
- source_word: κεχρυσωμένη
  choice: geschmückt
  rationale: Da das Partizip eine Aufzählung aus Gold, Edelstein und Perle regiert, erfasst „geschmückt“ die umfassende Verzierung besser als das enger auf Gold bezogene „vergoldet“.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίτῃ
  choice: mit Gold, Edelsteinen und Perlen
  rationale: Die griechischen Singulare können kollektiv gebraucht sein. Die deutschen Plurale bei Edelsteinen und Perlen sind in dieser Materialaufzählung natürlich und verdeutlichen den üppigen Schmuck.
theological_decisions:
- issue: Ton der Klage über den Fall Babylons
  choice: „Wehe“ als Ausdruck von Klage und Gericht
  alternative: „Ach“ zur stärkeren Betonung der Trauer
  rationale: Im Kontext des Gerichts über Babylon hält „Wehe“ die Spannung zwischen schmerzlicher Klage und prophetischem Gerichtsruf offen.
- issue: Zeitbezug der prunkvollen Kleidung
  choice: „gekleidet ... war“
  alternative: „gekleidet ist“ beziehungsweise eine rein partizipiale Gegenwartsform
  rationale: Die Kaufleute beklagen nach Vers 15–17 den bereits eingetretenen Untergang. Das deutsche Präteritum macht die rückblickende Klage idiomatisch deutlich, ohne die Identität der beschriebenen Stadt zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-apokalyptischem Klang. Die Personifikation der Stadt und die dreigliedrige Luxusaufzählung bleiben erhalten; keine konfessionell geprägte Deutung wird ergänzt.
