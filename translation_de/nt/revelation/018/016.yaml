  source_fidelity: Die Luxusmaterialien und die doppelten Klagerufe sind treffend wiedergegeben. Die Plurale „Edelsteinen und Perlen“ sind im Deutschen als Materialaufzählung idiomatisch und können die griechischen generischen Singulare angemessen wiedergeben. Allerdings steht λέγοντες als präsentes Partizip in Abhängigkeit von dem futurischen Hauptsatz in V. 15; „und sagten“ setzt davon unabhängig ein Präteritum und verwischt diesen Bezug. „und werden sagen“ gibt den vom Kontext getragenen Zukunftsbezug klar wieder.
  naturalness: Der Satz ist würdig und gut verständlich. Die Ausrufung mit „Wehe, wehe!“ und die anschließende Nominalgruppe funktioniert im prophetisch-apokalyptischen Register. „und werden sagen“ ist als Fortsetzung des Satzes aus dem vorherigen Vers natürlich.
  terminology: „Wehe“, „feines Leinen“, „Purpur“, „Scharlach“, „Gold“, „Edelsteine“ und „Perlen“ sind sachgerecht, registerangemessen und ohne konfessionelle Überdeutung gewählt.
