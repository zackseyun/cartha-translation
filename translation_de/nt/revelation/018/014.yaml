  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem griechischen Satzbau und den zentralen Begriffen insgesamt zuverlässig: ὀπώρα bleibt als „Frucht“ erhalten, die genitivische Wunschformel wird idiomatisch und sinnentsprechend wiedergegeben, und „nie mehr“ bringt die verstärkte Verneinung οὐκέτι οὐ μή angemessen zum Ausdruck. Im Schlusssatz steht αὐτά jedoch im Neutrum Plural und bezieht sich auf die verlorenen kostbaren und prächtigen Dinge. Das Singularpronomen „es“ verwischt diesen Bezug.'
