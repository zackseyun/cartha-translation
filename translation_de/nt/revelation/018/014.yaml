  terminology: „Frucht“, „Seele“, „üppig“ und „prächtig“ sind im Luxus- und Verlustkontext angemessene Entsprechungen. „Ist dir verloren gegangen“ gibt den eingetretenen, endgültigen Verlust idiomatisch wieder, ohne unnötig eine bestimmte Ursache zu behaupten.
