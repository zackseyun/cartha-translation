id: REV.18.14
reference: Revelation 18:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: de
  text: Auch die Frucht, nach der deine Seele verlangte, ist von dir gewichen, und alles Üppige und Prächtige ist dir verloren gegangen; man wird sie nie mehr finden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie werden nie mehr gefunden werden«. Das griechische Verb steht in der dritten Person Plural, ohne dass ein Subjekt genannt wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: Frucht
  rationale: ὀπώρα bezeichnet insbesondere reife oder spätsommerliche Frucht. „Frucht“ bewahrt das konkrete Bild im Zusammenhang der begehrten Luxusgüter.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: nach der deine Seele verlangte
  rationale: Die attributive Wiedergabe löst die im Deutschen schwerfällige Genitivkette natürlich auf, bewahrt aber sowohl ψυχή („Seele“) als auch das intensive Begehren von ἐπιθυμία.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: ist von dir gewichen
  rationale: Die Formulierung gibt die Bewegung weg von der angesprochenen Stadt wieder und trägt zugleich dem endgültigen Verlust im Klagekontext Rechnung.
- source_word: πάντα τὰ λιπαρὰ
  choice: alles Üppige
  rationale: λιπαρός bezeichnet hier nicht bloß fetthaltige Speisen, sondern Wohlstand, Genuss und luxuriöse Fülle. „Üppige“ passt zum Waren- und Luxuskontext.
- source_word: τὰ λαμπρὰ
  choice: Prächtige
  rationale: λαμπρός meint hier das Glänzende und prunkvoll Eindrucksvolle. „Prächtige“ ist im Deutschen natürlich und hält den Bezug auf Luxusgüter offen.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: ist dir verloren gegangen
  rationale: Das intransitive ἀπόλλυμι bezeichnet den eingetretenen Verlust. Die deutsche Wendung ist idiomatisch und bewahrt dessen bleibendes Ergebnis.
- source_word: οὐκέτι οὐ μὴ
  choice: nie mehr
  rationale: Die gehäufte Negation drückt nachdrückliche und endgültige Verneinung aus; „nie mehr“ gibt diese Endgültigkeit knapp und natürlich wieder.
- source_word: αὐτὰ εὑρήσουσιν
  choice: man wird es finden
  rationale: Der griechische Plural hat kein ausdrücklich genanntes Subjekt und kann unbestimmt gebraucht sein. Das deutsche „man“ bewahrt dieses unbestimmte Subjekt; „es“ greift das zusammenfassende „alles Üppige und Prächtige“ auf.
theological_decisions:
- issue: Nicht genanntes Subjekt von εὑρήσουσιν
  choice: 'Unbestimmtes Subjekt: „man wird es nie mehr finden“'
  alternative: 'Passivische Wiedergabe: „es wird nie mehr gefunden werden“'
  rationale: Das Griechische nennt kein konkretes handelndes Subjekt. „Man“ bildet den unbestimmten Gebrauch der dritten Person Plural natürlich ab, ohne eine bestimmte Personengruppe einzutragen; die Fußnote nennt die ebenfalls mögliche passivische Auffassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der klagende Ton bleiben erhalten. „Üppige und Prächtige“ fasst die Luxusgüter substantivisch zusammen; der Semikolon gliedert die abschließende Aussage über ihren unwiderruflichen Verlust.
