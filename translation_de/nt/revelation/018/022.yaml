id: REV.18.22
reference: Revelation 18:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: de
  text: Und der Klang von Harfenspielern, Musikern, Flötenspielern[a] und Trompetern wird nie wieder in dir zu hören sein. Kein Handwerker irgendeines Handwerks wird je wieder in dir zu finden sein, und das Geräusch einer Mühle[b] wird nie wieder in dir zu hören sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich Spieler des Aulos, eines antiken Blasinstruments, das nicht mit der modernen Flöte identisch war; auch „Pfeifenspieler“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: Oder „das Geräusch eines Mühlsteins“; das griechische Wort kann das Mahlgerät genauer bezeichnen, während „Mühle“ das Bild der Mahltätigkeit insgesamt wiedergibt.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: Klang / Geräusch
  rationale: φωνή bezeichnet hier hörbaren Schall, nicht eine sprechende Stimme. Bei den Musikern ist „Klang“, bei der Mühle „Geräusch“ im Deutschen jeweils natürlich; die Wiederholung der Aussageform bleibt erhalten.
- source_word: κιθαρῳδῶν
  choice: Harfenspielern
  rationale: Das Wort bezeichnet Spieler beziehungsweise Sänger zur Kithara. „Harfenspieler“ ist eine verständliche, traditionelle Annäherung an antike Saitenmusiker, ohne eine erklärungsbedürftige Transliteration zu verwenden.
- source_word: μουσικῶν
  choice: Musikern
  rationale: Der Ausdruck kann musikalische Ausführende allgemein bezeichnen. „Musiker“ ist im Deutschen die natürliche Oberbezeichnung innerhalb der Aufzählung.
- source_word: αὐλητῶν
  choice: Flötenspielern
  rationale: Gemeint sind Spieler des αὐλός. „Flötenspieler“ ist allgemein verständlich; eine Fußnote weist darauf hin, dass das antike Instrument nicht der modernen Flöte entsprach.
- source_word: σαλπιστῶν
  choice: Trompetern
  rationale: Eine knappe und natürliche Bezeichnung für Spieler beziehungsweise Bläser der σάλπιγξ.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: wird nie wieder ... zu hören sein
  rationale: οὐ μή mit Aorist Konjunktiv drückt eine nachdrückliche Verneinung aus; zusammen mit ἔτι vermittelt „nie wieder“ die endgültige Beendigung.
- source_word: ἐν σοὶ
  choice: in dir
  rationale: Die direkte Anrede an das personifizierte Babylon wird bewahrt.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: kein Handwerker irgendeines Handwerks
  rationale: Die umfassende Bedeutung und die Wortwiederholung des Griechischen werden weitgehend bewahrt. Die Formulierung ist würdevoll und verständlich.
- source_word: οὐ μὴ εὑρεθῇ ... ἔτι
  choice: wird je wieder ... zu finden sein
  rationale: „Je wieder“ bringt in Verbindung mit „kein“ die nachdrückliche und endgültige Abwesenheit natürlich zum Ausdruck.
- source_word: μύλου
  choice: einer Mühle
  rationale: μύλος kann die Mühle beziehungsweise das Mahlgerät bezeichnen. „Geräusch einer Mühle“ vermittelt die alltägliche Mahltätigkeit; „Mühlstein“ bleibt als engere Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Bildsprache vom Gericht über Babylon
  choice: Der Vers wird als dreifache Ankündigung wiedergegeben, dass Musik, handwerkliche Arbeit und alltägliche Versorgung in der gerichteten Stadt vollständig und endgültig verstummen beziehungsweise verschwinden.
  alternative: Die genannten Einzelheiten lediglich als dekorative Ausschmückung ohne weiterreichende Bildwirkung behandeln.
  rationale: Die wiederholte Formel οὐ μή ... ἔτι betont vollständige und endgültige Verwüstung. Die Übersetzung bewahrt die konkreten Bilder, ohne sie allegorisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die dreifache Endgültigkeitsformel werden bewahrt. Für die musikalischen Klänge und das Arbeitsgeräusch der Mühle werden idiomatisch unterschiedliche deutsche Wörter verwendet, ohne den inhaltlichen Parallelismus aufzugeben.
