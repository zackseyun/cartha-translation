id: REV.18.23
reference: Revelation 18:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: de
  text: Und das Licht einer Lampe wird nie mehr in dir leuchten, und die Stimme von Bräutigam und Braut wird nie mehr in dir zu hören sein. Denn deine Kaufleute waren die Großen der Erde[a], denn durch deine Zauberei[b] wurden alle Völker irregeführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Mächtigen der Erde“ beziehungsweise „die Großen und Einflussreichen der Erde“. Das griechische Wort bezeichnet Menschen von hohem Rang, großer Bedeutung oder Macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch deine magischen Künste“ beziehungsweise „durch deine Hexerei“. Das griechische Wort φαρμακεία bezeichnet Zauberei oder magische Praktiken, die mit Täuschung verbunden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: das Licht einer Lampe
  rationale: Die Genitivverbindung wird direkt und im Deutschen natürlich wiedergegeben; „Lampe“ passt zum antiken und biblischen Kontext.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: wird nie mehr ... leuchten
  rationale: „Nie mehr“ gibt die nachdrückliche Verneinung mit οὐ μή und das Ende des bisherigen Zustands durch ἔτι idiomatisch wieder.
- source_word: ἐν σοὶ
  choice: in dir
  rationale: Die direkte Anrede und Personifikation Babylons werden bewahrt.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: die Stimme von Bräutigam und Braut
  rationale: „Stimme“ wahrt den Grundsinn von φωνή und den Anklang an prophetische Gerichtsworte; die artikellose Paarformel wird knapp wiedergegeben.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: wird nie mehr ... zu hören sein
  rationale: Die Formulierung gibt die starke Verneinung und das griechische Passiv in natürlichem Deutsch wieder.
- source_word: οἱ ἔμποροί σου
  choice: deine Kaufleute
  rationale: „Kaufleute“ entspricht dem Handel treibenden Personenkreis und fügt sich in die wirtschaftliche Bildwelt des Kapitels ein.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: die Großen der Erde
  rationale: Die breite Bedeutung gesellschaftlich besonders einflussreicher oder hochgestellter Menschen bleibt erhalten, ohne sie auf Adel oder Wirtschaftsmagnaten zu verengen.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: durch deine Zauberei
  rationale: „Zauberei“ bezeichnet magische Praktiken und ihre täuschende Wirkung, ohne den Ausdruck modern auf Arznei- oder Drogengebrauch zu reduzieren.
- source_word: ἐπλανήθησαν
  choice: wurden ... irregeführt
  rationale: Die passive Form sowie der Sinn von Täuschung und Verleitung werden bewahrt.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: „Völker“ ist hier die natürliche kollektive Wiedergabe der Nationen der Welt.
theological_decisions:
- issue: Bedeutung von φαρμακεία im apokalyptischen Gerichtswort
  choice: Zauberei
  alternative: magische Künste; Hexerei
  rationale: Der Ausdruck verweist auf magische Praktiken und täuschende Verführung. „Zauberei“ erhält diesen religiös-moralischen Bedeutungsumfang, ohne eine moderne pharmazeutische Deutung einzutragen.
- issue: Nachdruck der beiden οὐ μή-Aussagen
  choice: wird nie mehr
  alternative: wird keinesfalls mehr; wird nicht länger
  rationale: „Nie mehr“ vermittelt die Endgültigkeit des angekündigten Gerichts klar und idiomatisch.
- issue: Wiederholung von ὅτι
  choice: denn ... denn
  alternative: denn ... weil
  rationale: Die wiederholte kausale Verknüpfung des griechischen Textes bleibt sichtbar, ohne das genaue Verhältnis der beiden Begründungen stärker auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter direkter Anrede Babylons. Die wiederholte Formel „nie mehr in dir“ trägt den feierlichen Gerichtston. Die Fußnoten stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
