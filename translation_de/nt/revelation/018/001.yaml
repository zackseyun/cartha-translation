id: REV.18.1
reference: Revelation 18:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: de
  text: Danach sah ich einen anderen Engel aus dem Himmel herabkommen[a]. Er hatte große Vollmacht, und die Erde wurde durch seine Herrlichkeit erleuchtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Himmel herabsteigen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „von seiner Herrlichkeit her erleuchtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Die Wendung kennzeichnet die zeitliche und visionäre Abfolge. „Danach“ gibt sie in natürlichem modernem Deutsch wieder; der Plural von ταῦτα muss im Deutschen nicht eigens ausgedrückt werden.
- source_word: εἶδον
  choice: sah ich
  rationale: Die schlichte Vergangenheitsform gibt den Aorist ohne zusätzliche Nuance wieder und führt die nächste Vision ein.
- source_word: ἄλλον ἄγγελον
  choice: einen anderen Engel
  rationale: Dies ist die direkte und natürliche Wiedergabe von ἄλλον ἄγγελον innerhalb der fortlaufenden Vision.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel herabkommen
  rationale: Die Infinitivkonstruktion nach „sah“ gibt das gleichzeitig wahrgenommene Herabkommen idiomatisch wieder. „Aus dem Himmel“ bildet ἐκ deutlicher ab als bloßes „vom Himmel“.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: Er hatte große Vollmacht
  rationale: „Vollmacht“ bezeichnet hier verliehene Autorität und Verfügungsgewalt genauer als das allgemeinere „Macht“. Ein neuer Hauptsatz vermeidet eine schwerfällige deutsche Partizipialkonstruktion.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: Das kosmische Bild der Erleuchtung spricht für die umfassende Bedeutung „Erde“, nicht für das örtlich begrenzte „Land“.
- source_word: ἐφωτίσθη
  choice: wurde … erleuchtet
  rationale: Die passive Form und das feierliche Bild des griechischen Verbs werden gewahrt.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: durch seine Herrlichkeit
  rationale: ἐκ bezeichnet hier die Herrlichkeit als Quelle beziehungsweise Ursache der Erleuchtung. „Durch“ ist dafür im Deutschen klar und idiomatisch; eine stärker quellbezogene Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Wesen der Herrlichkeit und Vollmacht des Engels
  choice: Der Text schreibt dem Engel große Vollmacht und eine die Erde erleuchtende Herrlichkeit zu, ohne ihn als göttlich zu bezeichnen.
  alternative: Wegen der außergewöhnlichen Herrlichkeit kann die Gestalt in einem erhöhten oder göttlich repräsentativen Sinn verstanden werden.
  rationale: Die Übersetzung bewahrt die starken Aussagen über Vollmacht und Herrlichkeit, fügt aber weder eine Identifikation mit Gott oder Christus noch eine ausdrückliche Einschränkung auf bloß geschöpfliche Eigenschaften hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechischen Partizipien werden zur besseren Verständlichkeit teils als Infinitivkonstruktion, teils als eigener Hauptsatz wiedergegeben, ohne die inhaltlichen Beziehungen zu verändern.
