id: REV.4.4
reference: Revelation 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: de
  text: Und rings um den Thron standen vierundzwanzig Throne, und auf den Thronen saßen vierundzwanzig Älteste, mit weißen Gewändern bekleidet und mit goldenen Kronen[a] auf ihren Köpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Siegeskränze. Das griechische Wort kann einen Ehren- oder Siegeskranz bezeichnen, nicht nur eine Herrscherkrone.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: rings um
  rationale: Gibt die den zentralen Thron umschließende räumliche Anordnung natürlich und anschaulich wieder.
- source_word: θρόνοι
  choice: Throne
  rationale: Bewahrt die Wiederholung desselben griechischen Wortes wie beim zentralen Thron und damit die königliche beziehungsweise richterliche Bildwelt.
- source_word: εἴκοσι τέσσαρες
  choice: vierundzwanzig
  rationale: Die übliche deutsche Wiedergabe der Zahl.
- source_word: ἐπὶ τοὺς θρόνους
  choice: auf den Thronen
  rationale: Bezeichnet hier idiomatisch die Position der Sitzenden.
- source_word: πρεσβυτέρους
  choice: Älteste
  rationale: Gibt die Bezeichnung der himmlischen Gruppe wieder, ohne ihre Identität näher festzulegen.
- source_word: καθημένους
  choice: saßen
  rationale: Löst die griechische Partizipialkonstruktion in einen natürlichen deutschen Hauptsatz auf.
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: mit weißen Gewändern bekleidet
  rationale: Bewahrt den Zustand des Bekleidetseins und vermeidet die nicht zwingende Präzisierung als lange Roben.
- source_word: στεφάνους
  choice: Siegeskränze
  rationale: Unterscheidet den στέφανος als Ehren- oder Siegeskranz vom königlichen Diadem und bewahrt so die spezifische Bildnuance.
- source_word: χρυσοῦς
  choice: goldene
  rationale: Natürliche attributive Wiedergabe des griechischen Adjektivs.
theological_decisions:
- issue: Art der vierundzwanzig umgebenden θρόνοι
  choice: Throne
  alternative: Sitze
  rationale: Da der griechische Text dasselbe Substantiv wie für den zentralen Thron verwendet, bleibt die lexikalische Verbindung und die königlich-richterliche Bildsprache erhalten. Der Kontext unterscheidet weiterhin klar den zentralen Thron von den ihn umgebenden Thronen.
- issue: Identität der vierundzwanzig Ältesten
  choice: Ohne erklärenden Zusatz als „Älteste“ wiedergegeben
  alternative: Vertreter der Gemeinde, Engelwesen oder Vertreter Israels und der Apostel
  rationale: Der Vers bezeichnet die Gestalten als Älteste, erklärt ihre Identität aber nicht; die Übersetzung lässt diese Frage deshalb offen.
- issue: Bedeutung von στέφανος
  choice: Siegeskränze im Text, mit allgemeinerer Alternative in der Fußnote
  alternative: Kronen
  rationale: Das Wort bezeichnet typischerweise einen als Auszeichnung oder Siegespreis verliehenen Kranz, kann im Deutschen jedoch traditionell auch mit „Krone“ wiedergegeben werden. Die Fußnote wahrt diese Übersetzungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzfolge wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Rings um“ erhält die visionäre Anschaulichkeit; „Älteste“ bleibt bewusst ohne identifizierenden Zusatz.
