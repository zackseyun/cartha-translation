id: REV.4.3
reference: Revelation 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: de
  text: Und der darauf saß, glich in seinem Aussehen einem Jaspis und einem Karneol[a]. Rings um den Thron war ein Regenbogen[b], der in seinem Aussehen einem Smaragd glich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Sardisstein“; traditionelle Bezeichnung für den hier mit „Karneol“ wiedergegebenen Edelstein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Strahlenkranz“; das griechische Wort kann eine regenbogenartige Lichterscheinung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: der darauf saß
  rationale: Das substantivierte Partizip bezeichnet den auf dem zuvor genannten Thron Sitzenden. „Darauf“ nimmt den unmittelbaren Kontext auf, ohne die Gestalt näher zu bestimmen.
- source_word: ὅμοιος ὁράσει
  choice: glich in seinem Aussehen
  rationale: Der Dativ ὁράσει bezeichnet den Bereich der Ähnlichkeit. Die Formulierung wahrt den Charakter einer visionären Erscheinung und behauptet keine stoffliche Identität.
- source_word: λίθῳ ἰάσπιδι
  choice: einem Jaspis
  rationale: ἴασπις bezeichnet einen kostbaren Stein. „Jaspis“ ist die geläufige deutsche Entsprechung; ein zusätzliches „Stein“ wäre im Deutschen unnötig.
- source_word: σαρδίῳ
  choice: einem Karneol
  rationale: „Karneol“ ist die heute verständliche Bezeichnung für den rötlichen Schmuckstein; die traditionelle Wiedergabe „Sardisstein“ wird in einer Fußnote bewahrt.
- source_word: ἶρις
  choice: Regenbogen
  rationale: Im visionären Zusammenhang bezeichnet ἶρις am naheliegendsten eine regenbogenartige Erscheinung. Die mögliche Bedeutung eines strahlenden Lichtkranzes wird als Alternative vermerkt.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: rings um den Thron
  rationale: Die Wendung drückt aus, dass die Erscheinung den Thron ringsum umgab. „Rings um“ ist präzise und idiomatisch.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: der in seinem Aussehen einem Smaragd glich
  rationale: Die Wiedergabe behält ausdrücklich die visuelle Ähnlichkeit bei und vermeidet die Aussage, der Regenbogen habe aus Smaragd bestanden.
theological_decisions:
- issue: Beschreibung des Thronenden durch einen Vergleich statt durch eine unmittelbare körperliche Darstellung
  choice: Die zweimalige Vergleichssprache wird mit „glich in seinem Aussehen“ ausdrücklich bewahrt.
  alternative: Die Gestalt oder den Regenbogen als aus Edelsteinen bestehend beziehungsweise als bestimmte Edelsteinfarben ausstrahlend beschreiben.
  rationale: Das Griechische spricht von wahrgenommener Ähnlichkeit. Die Übersetzung soll die visionäre Bildsprache und die damit verbundene Zurückhaltung hinsichtlich des Wesens des Thronenden nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die inhaltliche Verbindung aufzuheben. Die wiederholte Wendung „in seinem Aussehen“ bildet die zweimalige griechische Vergleichsformel bewusst ab.
