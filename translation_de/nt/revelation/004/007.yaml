reference: Revelation 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: de
  text: Und das erste Lebewesen glich einem Löwen, das zweite Lebewesen einem Kalb, das dritte Lebewesen hatte ein Gesicht wie das eines Menschen[a], und das vierte Lebewesen glich einem fliegenden Adler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein menschliches Gesicht“. Wörtlich: „ein Gesicht wie das eines Menschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: Lebewesen
  rationale: „Lebewesen“ gibt den weiten Sinn von ζῷον wieder und unterscheidet diese Wesen am Thron sprachlich von den späteren feindlichen „Tieren“ (θηρίον) der Offenbarung.
- source_word: ὅμοιον
  choice: glich / einem … ähnlich
  rationale: Die Form bezeichnet Ähnlichkeit, nicht Identität. „glich“ ist im Deutschen knapp, natürlich und wahrt den Vergleich.
- source_word: λέοντι
  choice: Löwen
  rationale: Direkte Wiedergabe des Tierbegriffs im Dativ nach ὅμοιον.
- source_word: μόσχῳ
  choice: Kalb
  rationale: μόσχος bezeichnet gewöhnlich ein Kalb beziehungsweise ein junges Rind. „Kalb“ bleibt nah am griechischen Ausdruck, ohne Geschlecht oder kultische Bedeutung hinzuzufügen.
- source_word: ἔχων
  choice: hatte
  rationale: Das Partizip wird für einen natürlichen deutschen Satz als finites Verb wiedergegeben; seine beschreibende Funktion bleibt erhalten.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: ein Gesicht wie ein Mensch
  rationale: „Gesicht“ entspricht πρόσωπον, und „wie“ bewahrt den durch ὡς ausgedrückten Vergleich. ἀνθρώπου bezeichnet hier einen Menschen; die alternative, idiomatischere Auffassung wird in der Fußnote genannt.
- source_word: ἀετῷ πετομένῳ
  choice: einem fliegenden Adler
  rationale: Das Partizip πετομένῳ beschreibt den Adler unmittelbar als fliegend. Die attributive Wiedergabe ist im Deutschen anschaulich und formal nah am Griechischen.
theological_decisions:
- issue: Wiedergabe von ἀνθρώπου bei der Beschreibung des dritten Lebewesens
  choice: ein Gesicht wie ein Mensch
  alternative: ein menschliches Gesicht
  rationale: Die Hauptfassung bewahrt sowohl den ausdrücklichen Vergleich mit ὡς als auch den Personenbezug von ἀνθρώπου. Die idiomatischere Alternative ist sachlich möglich, glättet den Vergleich jedoch etwas.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die viergliedrige Reihung und die wiederholte Bezeichnung „Lebewesen“ spiegeln den feierlichen Aufbau des griechischen Satzes; unnötig altertümliche Formulierungen wurden vermieden.
