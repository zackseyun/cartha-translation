revisions:
- from: Und das erste Lebewesen glich einem Löwen, das zweite Lebewesen einem Kalb, das dritte Lebewesen hatte ein Gesicht wie ein Mensch[a], und das vierte Lebewesen glich einem fliegenden Adler.
  to: Und das erste Lebewesen glich einem Löwen, das zweite Lebewesen einem Kalb, das dritte Lebewesen hatte ein Gesicht wie das eines Menschen[a], und das vierte Lebewesen glich einem fliegenden Adler.
  rationale: Die Revision beschränkt sich auf die deutsche Ausformulierung der Vergleichskonstruktion beim dritten Lebewesen. Sie bewahrt die von ὡς markierte Ähnlichkeit, vermeidet eine unnatürliche deutsche Konstruktion und korrigiert entsprechend die Fußnote. Alle übrigen Formulierungen können unverändert bleiben.
