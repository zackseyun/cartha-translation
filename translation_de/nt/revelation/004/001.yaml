id: REV.4.1
reference: Revelation 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: de
  text: 'Danach sah ich: Siehe, eine Tür stand im Himmel offen. Und die erste Stimme,[b] die ich gehört hatte und die wie eine Posaune mit mir redete,[a] sagte: »Komm hier herauf! Ich werde dir zeigen, was danach geschehen muss.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die wie eine Posaune zu mir redete“. Wörtlicher lautet das Griechische „mit mir redete“.'
    reason: lexical_alternative
  - marker: b
    text: Die „erste Stimme“ bezieht sich wahrscheinlich auf die Stimme, die Johannes zuvor gehört hatte (siehe Offenbarung 1,10).
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Die natürliche deutsche Wiedergabe bezeichnet die zeitliche Folge. Dasselbe Wort wird am Anfang und Ende verwendet, um die Wiederholung des griechischen Ausdrucks erkennbar zu halten; dessen grammatischer Plural lässt sich im Deutschen hier nicht idiomatisch abbilden.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: 'sah ich: Siehe'
  rationale: „Sah ich“ gibt das gewöhnliche Sehen im visionären Zusammenhang wieder; der Doppelpunkt führt den aufmerksamkeitslenkenden Ausruf „Siehe“ natürlich ein.
- source_word: θύρα ἠνεῳγμένη
  choice: eine Tür stand ... offen
  rationale: Das Perfektpartizip beschreibt den fortdauernden Zustand als Ergebnis einer Öffnung; „stand offen“ bringt diesen Zustand idiomatisch zum Ausdruck.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Gemeint ist in diesem apokalyptischen Zusammenhang der himmlische Bereich, nicht lediglich der sichtbare Himmel.
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: die erste Stimme
  rationale: Die formal transparente Wiedergabe bewahrt den Rückbezug auf die zuvor gehörte Stimme, wahrscheinlich in Offenbarung 1,10.
- source_word: ὡς σάλπιγγος
  choice: wie eine Posaune
  rationale: „Posaune“ ist die geläufige biblische Bezeichnung für das antike Signal- beziehungsweise Blasinstrument; „wie“ wahrt den Vergleich, ohne Stimme und Instrument gleichzusetzen.
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: mit mir redete
  rationale: Dies bewahrt die Präposition μετά („mit“) und ist im Deutschen verständlich; die idiomatischere Alternative „zu mir redete“ wird in einer Fußnote genannt.
- source_word: Ἀνάβα ὧδε
  choice: Komm hier herauf
  rationale: Der Imperativ fordert Johannes auf, zum Standort des Sprechers im himmlischen Bereich hinaufzukommen. „Komm“ entspricht dieser deiktischen Perspektive.
- source_word: ἃ δεῖ γενέσθαι
  choice: was ... geschehen muss
  rationale: Die Wendung bewahrt sowohl den Ereignischarakter von γενέσθαι als auch die Notwendigkeit, die δεῖ ausdrückt.
theological_decisions:
- issue: Zeitliche Bedeutung des wiederholten μετὰ ταῦτα
  choice: Beide Vorkommen werden mit „danach“ wiedergegeben.
  alternative: „Nach diesen Dingen“ oder am Ende „was nach diesem geschehen muss“
  rationale: Die Wiederholung bleibt sichtbar, ohne festzulegen, ob die Reihenfolge primär literarisch, visionär oder heilsgeschichtlich zu verstehen ist. So wird kein bestimmtes endzeitliches Schema in den Text eingetragen.
- issue: Bezug der „ersten Stimme“
  choice: Die ungewöhnliche Formulierung „die erste Stimme“ bleibt im Haupttext stehen.
  alternative: „die Stimme, die ich zuerst gehört hatte“
  rationale: Die gewählte Form bewahrt die Struktur und den möglichen Rückbezug auf Offenbarung 1,10, ohne diesen ausdrücklich als einzig mögliche Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht erhöhtem apokalyptischem Ton. „Siehe“ wurde als prägnanter visionärer Aufmerksamkeitsruf bewahrt. Kurze Sätze und der Doppelpunkt vermeiden eine schwer verständliche griechisch geprägte Satzverschachtelung.
