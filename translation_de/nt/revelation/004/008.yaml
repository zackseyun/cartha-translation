  verdict: revise
  source_fidelity: Die Übersetzung gibt die vier Wesen, die distributive Angabe, je sechs Flügel, die Augen ringsum und innen, die unablässige Akklamation sowie die dreifache Heiligung zutreffend wieder. »Der kommt« bewahrt die präsentische, dynamische Form von ὁ ἐρχόμενος angemessen; die traditionelle futurische Alternative ist sinnvoll vermerkt.
  naturalness: Die Satzgliederung ist klar und modernes würdiges Deutsch. Allerdings erzeugt »sondern sagen« einen im Griechischen nicht ausgedrückten Gegensatz. Die Titelfolge »der Herr, Gott, der Allmächtige« ist zwar bibelsprachlich möglich, wirkt im modernen Standarddeutsch jedoch unnötig sperrig. »der Herr, der allmächtige Gott« ist natürlich und enthält alle drei Titelbestandteile.
  terminology: »lebendige Wesen«, »Flügel«, »Augen«, »der Allmächtige« und »Heilig, heilig, heilig« sind treffend. Die Wiedergabe der göttlichen Zeitformel und die Fußnote vermeiden eine unzulässige Festlegung zugunsten der traditionellen futurischen Deutung.
