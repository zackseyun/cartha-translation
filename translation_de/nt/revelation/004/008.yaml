id: REV.4.8
reference: Revelation 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: de
  text: 'Und die vier lebendigen Wesen, von denen jedes sechs Flügel hat, sind ringsum und innen voller Augen. Tag und Nacht kommen sie nicht zur Ruhe und sagen: »Heilig, heilig, heilig ist der Herr, der allmächtige Gott, der war und der ist und der kommt.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: »der war und der ist und der kommen wird.«'
    reason: alternative_reading
lexical_decisions:
- source_word: ζῷα
  choice: lebendige Wesen
  rationale: Die Wendung bezeichnet hier belebte himmlische Wesen und vermeidet die im modernen Deutschen irreführende Wiedergabe »Tiere«.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: von denen jedes
  rationale: Die distributive Formulierung macht natürlich und eindeutig deutlich, dass jedes einzelne Wesen gemeint ist.
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: sechs Flügel hat
  rationale: Die Formulierung ordnet jedem der vier Wesen jeweils sechs Flügel zu und gibt das Partizip in natürlichem Deutsch wieder.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: ringsum und innen
  rationale: Beide räumlichen Angaben bleiben erhalten, ohne die visionäre Bildsprache näher festzulegen.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: sind ... voller Augen
  rationale: Dies ist eine direkte und im Deutschen idiomatische Wiedergabe der Konstruktion mit γέμω und Genitiv.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: kommen sie nicht zur Ruhe
  rationale: Die Wendung bewahrt die Bedeutung von Ruhe beziehungsweise Rast und klingt im Zusammenhang natürlicher als »haben sie keine Ruhe«.
- source_word: ἡμέρας καὶ νυκτός
  choice: Tag und Nacht
  rationale: Die adverbialen Genitive bezeichnen die ununterbrochene Dauer.
- source_word: λέγοντες
  choice: sondern sagen
  rationale: »Sagen« bleibt gegenüber möglichen Verstärkungen wie »rufen« neutral; »sondern« stellt idiomatisch heraus, womit ihr ruheloses Tun verbunden ist.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: Heilig, heilig, heilig
  rationale: Die theologisch und rhetorisch bedeutsame dreifache Wiederholung wird unverändert bewahrt.
- source_word: κύριος, ὁ θεός
  choice: der Herr, Gott
  rationale: Die Apposition gibt die griechische Titelfolge erkennbar wieder; das Komma verhindert, dass »Herrgott« wie eine feste deutsche Zusammensetzung klingt.
- source_word: ὁ παντοκράτωρ
  choice: der Allmächtige
  rationale: Dies ist die etablierte und semantisch angemessene deutsche Wiedergabe des göttlichen Titels.
theological_decisions:
- issue: Wiedergabe der göttlichen Zeitformel ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: der war und der ist und der kommt
  alternative: der war und der ist und der kommen wird
  rationale: Das substantivierte Präsenspartizip ὁ ἐρχόμενος bezeichnet den Kommenden und stellt sein Kommen sprachlich als gegenwärtig-dynamisch dar. »Der kommt« bewahrt diese Form und die eschatologische Spannung besser; die traditionelle futurische Wiedergabe bleibt als Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem langen griechischen Satz behutsam gegliedert. Die apokalyptische Bildsprache und die dreifache Heilig-Akklamation bleiben unverändert; konfessionell geprägte Zusätze werden vermieden.
