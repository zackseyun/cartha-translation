id: REV.4.2
reference: Revelation 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: de
  text: 'Sofort war ich im Geist[a]. Und siehe: Im Himmel stand ein Thron, und auf dem Thron saß einer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einem geistlichen oder visionären Zustand“. Die griechische Wendung steht ohne Artikel und kann sowohl auf das Wirken des Heiligen Geistes als auch auf einen geistlichen beziehungsweise visionären Zustand hinweisen.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Sofort
  rationale: Gibt die unmittelbare, plötzliche Fortsetzung natürlich und prägnant wieder.
- source_word: ἐγενόμην
  choice: war ich
  rationale: Im Zusammenhang mit ἐν πνεύματι bezeichnet γίνομαι den Eintritt in den visionären Zustand; im Deutschen ist „war ich im Geist“ idiomatischer als das schwerfällige „wurde ich im Geist“, während „sofort“ den Übergang erkennen lässt.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Die Wendung kennzeichnet in der Offenbarung einen prophetisch-visionären Zustand und kann wahrscheinlich auf den Heiligen Geist bezogen werden. Die mögliche allgemeinere Deutung wird in der Fußnote bewahrt.
- source_word: ἰδοὺ
  choice: Und siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden, feierlichen Ton der apokalyptischen Vision.
- source_word: θρόνος ἔκειτο
  choice: stand ein Thron
  rationale: κεῖμαι beschreibt hier die feste Platzierung des Thrones; „stand“ ist dafür natürliches Deutsch.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Bezeichnet hier den himmlischen Bereich, nicht den sichtbaren Lufthimmel.
- source_word: ἐπὶ τὸν θρόνον καθήμενος
  choice: auf dem Thron saß einer
  rationale: Gibt das substantivisch gebrauchte Partizip natürlich wieder, ohne die Identität des Sitzenden über den griechischen Text hinaus ausdrücklich zu benennen.
theological_decisions:
- issue: Bezeichnet ἐν πνεύματι den Heiligen Geist oder einen geistlichen beziehungsweise visionären Zustand?
  choice: im Geist
  alternative: im Geist, das heißt in einem geistlichen oder visionären Zustand
  rationale: Die Großschreibung folgt der wahrscheinlichen Beziehung auf den Heiligen Geist und dem Sprachgebrauch der Offenbarung. Da im Griechischen kein Artikel steht und auch der Zustand des Sehers im Vordergrund stehen kann, hält die Fußnote diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und siehe“ erhält bewusst den erhöhten apokalyptischen Erzählton; die übrige Syntax ist klar und gegenwärtig. Der im Ausgangstext offene Satzbau wird als vollständiger deutscher Satz wiedergegeben.
