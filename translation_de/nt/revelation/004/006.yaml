id: REV.4.6
reference: Revelation 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: de
  text: Und vor dem Thron war etwas wie ein gläsernes Meer[a], wie Kristall. Und inmitten des Thrones und rings um den Thron[c] waren vier lebendige Wesen[b], voller Augen vorn und hinten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Meer wie aus Glas“. Das Griechische formuliert einen Vergleich: „etwas wie ein gläsernes Meer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vier Lebewesen“. Das griechische Wort bezeichnet hier nicht die feindlichen „Tiere“ in späteren Abschnitten der Offenbarung.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung „inmitten des Thrones und rings um den Thron“ ist räumlich schwer vorstellbar. Das Griechische spiegelt vermutlich die Perspektive der Vision wider; die ungewöhnliche Formulierung wurde daher bewusst beibehalten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: vor
  rationale: Die übliche und natürliche räumliche Wiedergabe bezeichnet die Lage vor dem Thron, ohne den Ausdruck unnötig zu erweitern.
- source_word: ὡς
  choice: etwas wie
  rationale: Kennzeichnet ausdrücklich einen Vergleich und wahrt den annähernden Charakter der visionären Beschreibung.
- source_word: θάλασσα ὑαλίνη
  choice: ein gläsernes Meer
  rationale: Gibt die substantivisch-adjektivische Fügung bildkräftig und im Deutschen verständlich wieder, ohne das Bild als buchstäbliche Stoffangabe festzulegen.
- source_word: ὁμοία κρυστάλλῳ
  choice: Kristall gleich
  rationale: Bewahrt den zweiten Vergleich knapp und in würdigem, natürlichem Deutsch.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: inmitten des Thrones und rings um den Thron
  rationale: Bleibt nahe an der räumlich schwer aufzulösenden Formulierung des Griechischen und glättet die visionäre Perspektive nicht.
- source_word: ζῷα
  choice: lebendige Wesen
  rationale: Bezeichnet belebte Wesen am Thron Gottes und vermeidet die im Deutschen leicht feindselig oder tierisch verstandene Bezeichnung „Bestien“.
- source_word: γέμοντα ὀφθαλμῶν
  choice: voller Augen
  rationale: Ist eine knappe, idiomatische und zugleich quellennah bleibende Wiedergabe der Partizipialkonstruktion.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: vorn und hinten
  rationale: Das natürliche deutsche Adverbpaar gibt die räumliche Verteilung der Augen prägnant wieder.
theological_decisions:
- issue: Wiedergabe von ζῷα in der himmlischen Thronsaalvision
  choice: lebendige Wesen
  alternative: Lebewesen; Tiere; Bestien
  rationale: „Lebendige Wesen“ wahrt den visionären und erhabenen Zusammenhang, lässt den Anklang an die Thronvision Ezechiels bestehen und vermeidet eine Verwechslung mit den feindlichen Tieren späterer Kapitel der Offenbarung.
- issue: Räumliche Spannung in ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: inmitten des Thrones und rings um den Thron
  alternative: rings um den Thron, zur Mitte hin; zwischen dem Thron und seinem Umkreis
  rationale: Die ungewöhnliche räumliche Aussage wird als Teil der visionären Perspektive bewahrt, statt durch eine harmonisierende Deutung auf eine eindeutige Geometrie festgelegt zu werden.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, bildhaftem Ton. Die Satzstruktur bleibt nah an der visionären Abfolge des griechischen Textes; die ungewöhnliche räumliche Spannung wird nicht erklärend geglättet.
