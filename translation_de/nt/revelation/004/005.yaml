source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: de
  text: Und vom Thron gehen Blitze, Stimmen und Donnerschläge aus[a]; und vor dem Thron brennen sieben Feuerfackeln[b], die die sieben Geister Gottes[c] sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Laute« statt »Stimmen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sieben brennende Lampen aus Feuer«.'
    reason: lexical_alternative
  - marker: c
    text: Viele verstehen »die sieben Geister Gottes« als symbolische Rede von der Fülle des einen Heiligen Geistes; der griechische Text selbst lautet »sieben Geister«.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: gehen … aus
  rationale: Die Wendung gibt die Bewegung vom Thron her natürlich wieder und bewahrt das Präsens.
- source_word: ἀστραπαὶ
  choice: Blitze
  rationale: Der deutsche Plural bezeichnet wiederholte Blitzerscheinungen klar und idiomatisch.
- source_word: φωναὶ
  choice: Laute
  rationale: φωνή kann sowohl eine Stimme als auch allgemeiner einen Laut bezeichnen. Im Zusammenhang mit Blitzen und Donner ist „Laute“ offen genug, ohne persönliche Sprecher vorauszusetzen; „Stimmen“ bleibt als Fußnotenalternative erhalten.
- source_word: βρονταί
  choice: Donnerschläge
  rationale: Der Plural wird durch eine natürliche deutsche Bezeichnung für wiederholte Donnerereignisse wiedergegeben.
- source_word: λαμπάδες πυρὸς
  choice: Feuerfackeln
  rationale: λαμπάς bezeichnet häufig eine Fackel; „Feuerfackeln“ bewahrt zugleich das ausdrücklich genannte Feuer und ergibt ein anschauliches deutsches Bild. Die mögliche Wiedergabe als Lampen wird in der Fußnote genannt.
- source_word: καιόμεναι
  choice: brennen
  rationale: Das Partizip bezeichnet ein fortdauerndes Brennen. Im Deutschen ist ein finites Verb in diesem verblosen Satzglied natürlich.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: vor dem Thron
  rationale: Dies ist die knappe und übliche räumliche Wiedergabe.
- source_word: ἅ εἰσιν
  choice: sie sind
  rationale: Die eigenständige Formulierung stellt die symbolische Gleichsetzung klar und natürlich dar.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: die sieben Geister Gottes
  rationale: Die Übersetzung bewahrt den ausdrücklichen griechischen Plural und deutet ihn nicht bereits als „siebenfachen Geist“.
theological_decisions:
- issue: Deutung von τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: Im Haupttext wörtlich „die sieben Geister Gottes“
  alternative: „der siebenfache Geist Gottes“ beziehungsweise eine symbolische Bezeichnung für die Fülle des einen Heiligen Geistes
  rationale: Der griechische Text steht ausdrücklich im Plural. Eine Wiedergabe im Singular würde eine verbreitete Deutung in den Haupttext übernehmen und die im Wortlaut bestehende Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze erhalten die kraftvolle Reihung der Thronvision. „Laute“ wahrt die lexikalische Mehrdeutigkeit, während „Feuerfackeln“ die Bildhaftigkeit des griechischen Ausdrucks in natürlichem Deutsch vermittelt.
