source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: de
  text: Und sooft die lebendigen Wesen dem, der auf dem Thron sitzt und für immer und ewig lebt[a], Herrlichkeit, Ehre und Dank geben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in die Zeitalter der Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: sooft
  rationale: Die Verbindung bezeichnet einen wiederkehrenden beziehungsweise unbestimmten Zeitpunkt. „Sooft“ gibt diesen iterativen Sinn im Deutschen natürlich wieder.
- source_word: δώσουσιν
  choice: darbringen
  rationale: δίδωμι bedeutet grundsätzlich „geben“. Mit Herrlichkeit, Ehre und Dank als Gaben des Lobpreises ist „darbringen“ im Deutschen idiomatischer, ohne den Sinn unnötig einzuengen.
- source_word: τὰ ζῷα
  choice: die lebendigen Wesen
  rationale: Gemeint sind die zuvor beschriebenen Wesen im himmlischen Thronsaal, nicht gewöhnliche Tiere. „Lebendige Wesen“ ist sachlich und vermeidet eine animalische Verengung; die Zahl vier wird nicht ergänzt, da sie in diesem Vers nicht steht.
- source_word: δόξαν καὶ τιμὴν καὶ εὐχαριστίαν
  choice: Herrlichkeit, Ehre und Dank
  rationale: „Herrlichkeit“ und „Ehre“ entsprechen der doxologischen Wortwahl. „Dank“ gibt εὐχαριστία im heutigen Deutschen natürlicher wieder als das mögliche, aber schwerfälligere „Danksagung“.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: dem, der auf dem Thron sitzt
  rationale: Die substantivierte Partizipialkonstruktion wird als natürlicher deutscher Relativsatz wiedergegeben, ohne den im Griechischen nicht ausdrücklich genannten Gottesnamen einzufügen.
- source_word: τῷ ζῶντι
  choice: ihm, der … lebt
  rationale: Die zweite substantivierte Partizipialphrase steht appositionell zur ersten. Die Wiederaufnahme mit „ihm“ bewahrt die Hervorhebung und bleibt im Deutschen verständlich.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die griechische Zeitformel bezeichnet unbegrenzte Dauer. „Für immer und ewig“ ist die geläufige, würdige deutsche Entsprechung; die wörtlichere Form wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Göttliche Thronbezeichnung ohne ergänzende Identifikation
  choice: dem, der auf dem Thron sitzt … ihm, der für immer und ewig lebt
  alternative: Gott, der auf dem Thron sitzt und für immer und ewig lebt
  rationale: Der griechische Text identifiziert den Empfänger durch Thronen und ewiges Leben, nennt ihn hier aber nicht ausdrücklich „Gott“. Die Übersetzung bewahrt diese appositionelle Struktur und fügt keine theologische Spezifizierung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit doxologischem Rhythmus. Der Gedankenstrich markiert die appositionelle Wiederaufnahme des Empfängers. Das abschließende Komma bleibt erhalten, da der Vers syntaktisch in Vers 10 weitergeführt wird.
