    rationale: διά mit Akkusativ bezeichnet hier primär Grund/Ursache. „Durch“ legt im Deutschen stärker ein Mittel bzw. Instrument nahe. Die weniger wahrscheinliche instrumentale Deutung sollte daher in die Fußnote.
  - severity: low
