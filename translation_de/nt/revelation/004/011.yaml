  source_fidelity: Die Anrede, die dreigliedrige Gabeformel und die schöpferische Begründung sind zutreffend wiedergegeben. Bei τὰ πάντα ... ἦσαν καὶ ἐκτίσθησαν glättet der Singular „es“ jedoch die pluralische Rückaufnahme des griechischen Textes. Für διὰ mit Akkusativ ist eine kausale Wiedergabe im Haupttext vorzuziehen; die instrumentale Lesart kann als Alternative stehen bleiben.
  naturalness: „War es da und wurde erschaffen“ ist trotz des vorangehenden Sammelbegriffs „alles“ im modernen Deutschen unnötig sperrig. Die Umstellung auf „alles war da und wurde erschaffen“ ist klarer und bewahrt beide Prädikate.
  terminology: „Herr“, „Gott“, „Herrlichkeit“, „Ehre“, „Macht“ und „erschaffen“ sind angemessen, würdevoll und terminologisch konsistent. „Wegen deines Willens“ gibt die vorrangig kausale Nuance von διὰ τὸ θέλημά σου genauer wieder als das instrumentale „durch deinen Willen“.
