source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: de
  text: Würdig bist du, unser Herr und Gott, die Herrlichkeit, die Ehre und die Macht zu empfangen; denn du hast alles erschaffen, und wegen deines Willens[a] war alles da und wurde erschaffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch deinen Willen«. Die griechische Wendung bezeichnet vor allem den Grund; sie kann möglicherweise auch die vermittelnde Wirksamkeit seines Willens ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: Würdig bist du
  rationale: Die Voranstellung von ἄξιος wird im Deutschen natürlich und zugleich betont wiedergegeben; die direkte Anrede bleibt erhalten.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: unser Herr und Gott
  rationale: Die artikulierte Nominalfolge fungiert im Kontext als Anrede. Diese Fassung bewahrt beide Titel und bezieht ἡμῶν idiomatisch auf die gesamte Verbindung.
- source_word: λαβεῖν
  choice: zu empfangen
  rationale: Der Infinitiv bezeichnet, was Gott zu empfangen würdig ist; „empfangen“ passt zum Kontext der Anbetung besser als „nehmen“.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: die Herrlichkeit, die Ehre und die Macht
  rationale: Die drei Begriffe werden einzeln und mit wiederholtem Artikel wiedergegeben, wodurch Umfang und feierlicher Rhythmus der griechischen Reihung erhalten bleiben.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι nennt den Grund der Würdigkeit. „Denn“ ist in einem feierlichen deutschen Lobpreis natürlich und eindeutig begründend.
- source_word: ἔκτισας τὰ πάντα
  choice: du hast alles erschaffen
  rationale: κτίζω bezeichnet hier das Erschaffen; „alles“ gibt τὰ πάντα umfassend und idiomatisch wieder.
- source_word: διὰ τὸ θέλημά σου
  choice: durch deinen Willen
  rationale: Die Wendung bewahrt die mögliche vermittelnde bzw. ursächliche Beziehung des göttlichen Willens, ohne sie im Haupttext enger auf reine Kausalität festzulegen.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: war es da und wurde erschaffen
  rationale: Beide griechischen Verben bleiben unterschieden. Der Singular „es“ nimmt das im Deutschen singularische Sammelwort „alles“ auf; „war da“ gibt ἦσαν verständlich wieder, ohne es mit dem Schöpfungsakt zusammenzuziehen.
theological_decisions:
- issue: Anrede Gottes mit der Titelfolge ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: unser Herr und Gott
  alternative: der Herr und unser Gott
  rationale: Der Anbetungskontext verlangt eine direkte Anrede. Die gewählte Form bewahrt beide Titel, ohne zusätzliche christologische oder konfessionelle Festlegungen einzutragen.
- issue: Beziehung des göttlichen Willens zu Existenz und Schöpfung
  choice: durch deinen Willen
  alternative: wegen deines Willens
  rationale: διά mit Akkusativ hat vorwiegend ursächlichen Sinn, kann hier aber im Deutschen sowohl die Begründung als auch die Wirksamkeit des Willens anklingen lassen. Die Fußnote nennt die stärker kausale Wiedergabe ausdrücklich und lässt die theologische Spannung offen.
- issue: Abfolge von ἦσαν und ἐκτίσθησαν
  choice: war es da und wurde erschaffen
  alternative: kam es ins Dasein und wurde erschaffen
  rationale: Die beiden Verben werden nicht harmonisiert oder zu einer einzigen Aussage verschmolzen. Die Übersetzung vermeidet zugleich eine metaphysische Ausdeutung ihrer Reihenfolge.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlichem, aber verständlichem Satzrhythmus. Die betonte Anfangsstellung „Würdig bist du“ entspricht der griechischen Wortstellung. Das Semikolon gliedert Lobpreis und Begründung.
