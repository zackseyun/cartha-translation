    rationale: Das Deutsche erlaubt bei „alles“ den Singular, doch die Formulierung ist weniger natürlich und verdeckt die pluralische Referenz von ἦσαν und ἐκτίσθησαν. „Alles war da und wurde erschaffen“ ist idiomatischer, ohne die zwei Verben zusammenzuziehen.
