    rationale: Das zweite ἐνώπιον mit Genitiv bedeutet „vor dem Thron“ und beschreibt den Ort bzw. die Gegenwart, nicht ein Ziel im Akkusativ. „Vor den Thron“ legt eine nicht im griechischen Text ausgedrückte Bewegungsrichtung nahe.
  - severity: low
    issue: Satzstellung bei „vor dem niederfallen, der auf dem Thron sitzt“
    rationale: Grammatisch ist die Fassung zwar grundsätzlich verständlich, doch die Stellung des Relativsatzes nach dem abgetrennten Bezugswort wirkt unnötig schwerfällig. Die Umstellung erhält den Sinn präzise und ist idiomatischer.
