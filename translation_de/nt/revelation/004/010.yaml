  source_fidelity: 'Die zentralen Ausdrücke sind zutreffend wiedergegeben: die vierundzwanzig Ältesten, das Niederfallen vor dem Thronenden, Anbetung, ewiges Leben, Kronen und das Werfen der Kronen. Die Richtungsangabe „vor den Thron“ weicht jedoch vom griechischen ἐνώπιον τοῦ θρόνου („vor dem Thron“) ab; es bezeichnet hier keine Bewegung auf den Thron zu.'
  naturalness: Die Umstellung zu „vor dem, der auf dem Thron sitzt, niederfallen“ ist im modernen Standarddeutsch deutlich flüssiger und verhindert die schwer lesbare Trennung von „vor dem“ und seinem Relativsatz.
  terminology: „Älteste“, „anbeten“, „in alle Ewigkeit“ und „Kronen“ sind sachgerecht. Die Fußnote zu στεφάνους bewahrt angemessen die mögliche Nuance von Ehren- oder Siegeskränzen. Die beschreibenden Titel werden ohne zusätzliche dogmatische Identifikation beibehalten.
