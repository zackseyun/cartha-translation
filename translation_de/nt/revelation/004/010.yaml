id: REV.4.10
reference: Revelation 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: de
  text: 'Dann werden die vierundzwanzig Ältesten vor dem, der auf dem Thron sitzt, niederfallen und den anbeten, der in alle Ewigkeit lebt.[a] Sie werden ihre Kronen vor dem Thron werfen[b] und sagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in die Zeitalter der Zeitalter«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort für »Kronen« kann auch Ehren- oder Siegeskränze bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: werden niederfallen
  rationale: Das Futur bezeichnet hier das ehrfürchtige Niederfallen im Zusammenhang der Anbetung. „Niederfallen“ bewahrt die körperliche Handlung, ohne eine vollständige Prostration ausdrücklich festzulegen.
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: die vierundzwanzig Ältesten
  rationale: „Älteste“ ist im Deutschen die geläufige und verständliche Wiedergabe für die Gestalten des himmlischen Thronrats; „Presbyter“ wäre unnötig fachsprachlich.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ ist an beiden Stellen knapp, natürlich und gibt sowohl die räumliche als auch die ehrerbietige Beziehung wieder.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: dem, der auf dem Thron sitzt
  rationale: Die substantivierte Partizipialform wird als beschreibender Titel wiedergegeben und nicht über den griechischen Wortlaut hinaus identifiziert.
- source_word: προσκυνήσουσιν
  choice: werden … anbeten
  rationale: Im göttlichen Kontext der Offenbarung bezeichnet das Verb religiöse Verehrung; „anbeten“ gibt dies deutlicher wieder als bloßes „sich verbeugen“.
- source_word: τῷ ζῶντι
  choice: den, der … lebt
  rationale: Die substantivierte Partizipialform betont die bleibende lebendige Existenz des Thronenden und klingt im modernen Deutsch natürlich.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: in alle Ewigkeit
  rationale: Die deutsche Wendung gibt die idiomatische Bedeutung unbegrenzter Dauer natürlich und würdig wieder; die formnähere Ausdrucksweise steht in der Fußnote.
- source_word: βαλοῦσιν
  choice: werden … werfen
  rationale: „Werfen“ bewahrt die anschauliche Kraft von βάλλω und schwächt die Handlung nicht zu einem bloßen Niederlegen ab.
- source_word: τοὺς στεφάνους
  choice: ihre Kronen
  rationale: „Kronen“ ist im apokalyptischen Thronkontext die natürliche Wiedergabe; die mögliche Bedeutung von Ehren- oder Siegeskränzen wird in einer Fußnote erläutert.
- source_word: λέγοντες
  choice: und sagen
  rationale: Das präsentische Partizip leitet die folgende Rede ein; die finite deutsche Fortführung ist flüssig und erhält den Doppelpunkt.
theological_decisions:
- issue: Identität dessen, der auf dem Thron sitzt und ewig lebt
  choice: 'Beschreibende Formulierungen des griechischen Textes beibehalten: „der auf dem Thron sitzt“ und „der in alle Ewigkeit lebt“'
  alternative: Die Gestalt ausdrücklich als Gott oder Gott den Vater benennen
  rationale: Der Kontext weist klar auf Gott hin, doch der Vers selbst verwendet beschreibende Titel. Die Übersetzung vermeidet deshalb eine über den Wortlaut hinausgehende dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die mit „Da“ eröffnete Satzstellung bildet die zeitlich wiederkehrende Szene aus Vers 9 natürlich ab. Die beschreibenden Gottestitel und die lebendige Abfolge der kultischen Handlungen bleiben erhalten; die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
