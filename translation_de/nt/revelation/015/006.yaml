  terminology: „Heiligtum“ für ναός, „Plagen“ für πληγαί, „Leinen“ für λίνον und „Schärpen“ für ζῶναι sind sachgerecht. Die Fußnoten bewahren die lexikalischen Alternativen ohne den Text unnötig auszudeuten.
