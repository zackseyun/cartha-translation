revisions:
- from: Und die sieben Engel, die die sieben Plagen hatten, kamen aus dem Heiligtum[a] heraus. Sie waren mit reinem, leuchtendem Leinen[b] bekleidet und hatten goldene Schärpen um die Brust gebunden[c].
  to: Und die sieben Engel, die die sieben Plagen hatten, kamen aus dem Heiligtum[a] heraus, bekleidet mit reinem, leuchtendem Leinen[b] und mit goldenen Schärpen um die Brust gegürtet[c].
  rationale: Die Revision verbindet die beiden Partizipialbeschreibungen in einer dem griechischen Satzbau entsprechenden, im modernen Standarddeutsch flüssigen Konstruktion. Sie ersetzt die handlungsnahe Wendung „hatten ... gebunden“ durch den zuständlichen Ausdruck „gegürtet“, ohne die ungewöhnliche Lage der Schärpen um die Brust zu glätten. Die Fußnote zu c wird als echte lexikalische Alternative formuliert, nicht als irreführend strikte wörtliche Wiedergabe.
