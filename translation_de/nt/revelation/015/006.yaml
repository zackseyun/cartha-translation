source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: de
  text: Und die sieben Engel, die die sieben Plagen hatten, kamen aus dem Heiligtum[a] heraus, bekleidet mit reinem, leuchtendem Leinen[b] und mit goldenen Schärpen um die Brust gegürtet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tempel«. Das griechische Wort ναός bezeichnet häufig besonders das innere Heiligtum und nicht die gesamte Tempelanlage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sauberem, glänzendem Leinen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »mit goldenen Gürteln um die Brust gegürtet«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: kamen … heraus
  rationale: Gibt die Bewegung aus dem Heiligtum nach außen in natürlichem modernem Deutsch wieder.
- source_word: ἄγγελοι
  choice: Engel
  rationale: Im Zusammenhang der himmlischen Vision sind übernatürliche Engel, nicht menschliche Boten, gemeint.
- source_word: πληγάς
  choice: Plagen
  rationale: Bezeichnet in der Offenbarung die von Gott kommenden Schläge beziehungsweise Gerichte; »Plagen« ist kontextgerecht und etabliert.
- source_word: ναοῦ
  choice: Heiligtum
  rationale: ναός bezeichnet häufig den inneren heiligen Bereich und nicht die gesamte Tempelanlage; »Heiligtum« wahrt diese engere Bedeutung.
- source_word: ἐνδεδυμένοι
  choice: bekleidet
  rationale: Das Perfektpartizip beschreibt den fortbestehenden Zustand ihrer Bekleidung; »bekleidet« ist würdig und klar.
- source_word: λίνον
  choice: Leinen
  rationale: Das Substantiv bezeichnet Leinen; ein zusätzliches Wort für »fein« steht im vorliegenden griechischen Text nicht.
- source_word: καθαρὸν
  choice: rein
  rationale: καθαρός kann »rein« oder »sauber« bedeuten. Bei himmlischer Kleidung ist »rein« natürlich und lässt sowohl die sichtbare als auch die symbolische Dimension offen.
- source_word: λαμπρὸν
  choice: leuchtend
  rationale: λαμπρός bezeichnet Helligkeit oder Glanz; »leuchtend« vermittelt diesen bildhaften Eindruck treffend.
- source_word: περιεζωσμένοι
  choice: hatten … gebunden
  rationale: Die Form bezeichnet einen Zustand des Umgürtet- beziehungsweise Umbundenseins. Die deutsche Wendung ist gegenwärtig und verständlich, ohne das ungewöhnliche Tragen um die Brust zu glätten.
- source_word: περὶ τὰ στήθη
  choice: um die Brust
  rationale: Gibt die Lage der Bänder im Brustbereich direkt wieder; der griechische Plural kann im Deutschen idiomatisch kollektiv mit dem Singular ausgedrückt werden.
- source_word: ζώνας χρυσᾶς
  choice: goldene Schärpen
  rationale: ζώνη kann Gürtel, Band oder Schärpe bedeuten. Weil sie um die Brust getragen werden, bildet »Schärpen« die Szene natürlicher ab als »Gürtel«.
theological_decisions:
- issue: Bedeutung von ναός im Zusammenhang des himmlischen Tempels
  choice: Heiligtum
  alternative: Tempel
  rationale: »Heiligtum« bewahrt den spezifischeren Sinn des inneren heiligen Bereichs, ohne weiter festzulegen, wie die himmlische Tempelszene theologisch zu deuten ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Zwei Hauptsätze vermeiden eine überladene Partizipialkonstruktion. Die ungewöhnliche Position der goldenen Schärpen um die Brust bleibt erhalten; die Alternative mit »Gürteln« wird in der Fußnote dokumentiert.
