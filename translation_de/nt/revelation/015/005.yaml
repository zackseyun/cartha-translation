id: REV.15.5
reference: Revelation 15:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: de
  text: 'Und nach all dem sah ich: Das Heiligtum[a] des Zeltes des Zeugnisses[b] im Himmel wurde geöffnet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Tempel“. Das griechische Wort ναός kann besonders das innere Heiligtum und nicht den gesamten Tempelbezirk bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Zelt des Zeugnisses“ greift die Sprache des Alten Testaments auf, besonders die Bezeichnung des Zeltheiligtums in der Wüste, das mit Gottes Bundeszeugnis verbunden war.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: Und nach all dem
  rationale: Die Wendung gibt die fortschreitende Abfolge der Vision wieder. „Nach all dem“ ist im heutigen Deutsch natürlich und bewahrt zugleich den zusammenfassenden Plural von ταῦτα; das einleitende „Und“ nimmt den parataktischen Erzählstil des Johannes auf.
- source_word: εἶδον
  choice: sah ich
  rationale: Der Aorist von ὁράω bezeichnet hier die Wahrnehmung in der Vision. „Sah ich“ gibt dies unmittelbar wieder, ohne den Akzent auf den Vorgang des Hinschauens zu verlagern.
- source_word: ἠνοίγη
  choice: wurde geöffnet
  rationale: Die passive Aoristform beschreibt, dass das Heiligtum geöffnet wurde. Die Passivform bleibt erhalten, ohne einen im Text nicht genannten Handelnden einzuführen.
- source_word: ὁ ναὸς
  choice: das Heiligtum
  rationale: ναός bezeichnet häufig das eigentliche, innere Heiligtum im Unterschied zum gesamten Tempelbezirk. „Heiligtum“ macht diese kultische Bedeutung im Deutschen deutlich; „Tempel“ bleibt als mögliche Wiedergabe in der Fußnote genannt.
- source_word: τῆς σκηνῆς
  choice: des Zeltes
  rationale: σκηνή bezeichnet im kultischen Zusammenhang das heilige Zelt der Wüstenzeit. „Zelt“ ist verständliches modernes Deutsch und bewahrt das konkrete Bild, ohne es durch einen erklärenden Traditionsbegriff zu ersetzen.
- source_word: τοῦ μαρτυρίου
  choice: des Zeugnisses
  rationale: μαρτύριον greift die alttestamentliche Bezeichnung des mit Gottes Bundeszeugnis verbundenen Heiligtums auf. „Zeugnis“ wahrt diese feste kultische Anspielung besser als das hier weniger idiomatische „Zeugenschaft“.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Die Wendung lokalisiert das Heiligtum in der himmlischen Sphäre. „Im Himmel“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Kultische Bildsprache des himmlischen Heiligtums
  choice: Die Genitivfolge wird als „das Heiligtum des Zeltes des Zeugnisses im Himmel“ bewahrt.
  alternative: das himmlische Heiligtum; das Heiligtum im Himmel, nämlich das Zelt des Zeugnisses
  rationale: Die ungewöhnlich dichte Formulierung verbindet die Tempelvision mit der alttestamentlichen Bildwelt des Zeltheiligtums und des Bundeszeugnisses. Eine vereinfachende Paraphrase würde das Verhältnis der Bilder vorschnell deuten und ihre Spannung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gibt den Übergang von der einleitenden Wahrnehmungsformel zum Inhalt der Vision natürlich wieder. Die ungewöhnliche kultische Genitivfolge bleibt bewusst erhalten; erklärende Einzelheiten stehen in den Fußnoten.
