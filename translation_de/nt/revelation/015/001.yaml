revisions:
- from: 'Und ich sah ein anderes Zeichen im Himmel, groß und staunenerregend: sieben Engel, die sieben Plagen hatten, die letzten; denn in ihnen kam der Zorn Gottes zur Vollendung.[a]'
  to: 'Und ich sah ein anderes Zeichen im Himmel, groß und staunenerregend: sieben Engel, die die sieben letzten Plagen hatten; denn in ihnen kam der Zorn Gottes zur Vollendung[a].'
  rationale: Die Revision glättet lediglich die deutsche Wortstellung bei τὰς ἐσχάτας und setzt den bestehenden Fußnotenanker an seine sachliche Bezugsstelle. Bedeutung, Ambiguität und gehobenes modernes Register bleiben erhalten.
