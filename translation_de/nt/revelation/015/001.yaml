id: REV.15.1
reference: Revelation 15:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: de
  text: 'Und ich sah ein anderes Zeichen im Himmel, groß und staunenerregend: sieben Engel, die die sieben letzten Plagen hatten; denn in ihnen kam der Zorn Gottes zur Vollendung[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fand der Zorn Gottes sein Ende“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ ist in der Offenbarung die geläufige und transparente Wiedergabe für eine sichtbare Erscheinung mit symbolischer Bedeutung.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Im apokalyptischen Zusammenhang ist der himmlische Bereich gemeint, nicht lediglich der sichtbare Luftraum.
- source_word: μέγα καὶ θαυμαστόν
  choice: groß und staunenerregend
  rationale: Die Formulierung bewahrt Größe und ehrfürchtiges Staunen in natürlichem modernem Deutsch.
- source_word: ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ
  choice: sieben Engel, die sieben Plagen hatten
  rationale: Der Relativsatz gibt das Partizip idiomatisch wieder und hält die Engel eindeutig als Träger der Plagen fest.
- source_word: τὰς ἐσχάτας
  choice: die letzten
  rationale: Die nachgestellte Apposition erhält die Betonung und den sequenziellen Sinn des griechischen Ausdrucks.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ bezeichnet natürlich den Grund dafür, dass diese Plagen die letzten heißen.
- source_word: ἐν αὐταῖς
  choice: in ihnen
  rationale: Die örtlich-instrumentale Offenheit von ἐν bleibt erhalten; die Plagen sind der Zusammenhang, in dem Gottes Zorn sein Ende erreicht.
- source_word: ἐτελέσθη
  choice: kam zur Vollendung
  rationale: Diese Wiedergabe erfasst sowohl das Zu-Ende-Kommen als auch den Ziel- und Vollendungsaspekt von τελέω, ohne über den Vers hinauszugehen.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: der Zorn Gottes
  rationale: „Zorn Gottes“ bewahrt die feierliche und gerichtliche Kraft des Ausdrucks, ohne sie abzuschwächen oder zu steigern.
theological_decisions:
- issue: Sprache des göttlichen Gerichts im apokalyptischen Zusammenhang
  choice: der Zorn Gottes
  alternative: Gottes Grimm; der heftige Zorn Gottes
  rationale: Die traditionelle, klare Wendung wahrt das Gewicht des göttlichen Gerichts, ohne dem Text eine konfessionelle Deutung hinzuzufügen.
- issue: Bedeutung von ἐτελέσθη
  choice: kam zur Vollendung
  alternative: wurde vollendet; fand sein Ende
  rationale: Die Formulierung lässt sowohl Abschluss als auch Zielerreichung anklingen und behauptet nicht, dass damit jedes denkbare Gericht endgültig abgeschlossen sei.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Visionformel und die Siebenerstruktur bleiben deutlich; der griechisch schwerfällige Partizipialbau wird durch einen natürlichen Relativsatz wiedergegeben.
