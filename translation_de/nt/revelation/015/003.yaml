id: REV.15.3
reference: Revelation 15:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: de
  text: 'Und sie singen das Lied des Mose, des Dieners Gottes, und das Lied des Lammes. Sie sagen: »Groß und wunderbar sind deine Werke, Herr, Gott, du Allmächtiger! Gerecht und wahr sind deine Wege, du König der Zeitalter.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben: »König der Völker« statt »König der Zeitalter«.'
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: sie singen
  rationale: Das griechische Präsens wird im visionären Bericht natürlich als anschauliches deutsches Präsens wiedergegeben.
- source_word: ᾠδὴν
  choice: Lied
  rationale: »Lied« gibt den gewöhnlichen Sinn wieder, ohne die nicht zwingend geforderte liturgische Färbung von »Hymnus« einzutragen.
- source_word: δούλου
  choice: Diener
  rationale: In der feierlichen Bezeichnung des Mose drückt »Diener Gottes« Zugehörigkeit und Beauftragung aus und ist im heutigen Standarddeutsch natürlicher als »Sklave Gottes«, ohne das Abhängigkeitsverhältnis aufzuheben.
- source_word: ἀρνίου
  choice: des Lammes
  rationale: In der Offenbarung ist »das Lamm« ein christologischer Titel; die Wiedergabe bewahrt die Opfer- und Messiasmetaphorik.
- source_word: λέγοντες
  choice: Sie sagen
  rationale: Der begleitende Partizipialsatz führt den Wortlaut des Liedes ein; ein neuer Hauptsatz klingt im Deutschen klar und natürlich.
- source_word: Μεγάλα καὶ θαυμαστὰ
  choice: Groß und wunderbar
  rationale: Die prädikativen Adjektive werden direkt und in einem würdigen doxologischen Register wiedergegeben.
- source_word: ἔργα
  choice: Werke
  rationale: »Werke« ist die direkte und im biblischen Zusammenhang angemessene Bezeichnung für Gottes Taten.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Herr, Gott, du Allmächtiger
  rationale: Die anredende und appositionelle Struktur bleibt erkennbar; alle drei Elemente – Herr, Gott und der Allmächtige – werden bewahrt.
- source_word: δίκαιαι καὶ ἀληθιναὶ
  choice: gerecht und wahr
  rationale: Die Formulierung erhält sowohl die moralische Richtigkeit als auch die Verlässlichkeit von Gottes Wegen.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: du König der Zeitalter
  rationale: Die Übersetzung folgt dem vorgegebenen SBLGNT-Text αἰώνων und bewahrt dessen zeitlich-kosmische Weite.
theological_decisions:
- issue: Wiedergabe von δοῦλος als Titel des Mose
  choice: Diener Gottes
  alternative: Sklave Gottes
  rationale: »Diener Gottes« ist für Mose im modernen Deutschen die natürliche, würdevolle Amts- und Zugehörigkeitsbezeichnung. »Sklave« bildet die soziale Grundbedeutung schärfer ab, würde hier jedoch leicht eine ungewollt erniedrigende oder rein institutionelle Vorstellung hervorrufen.
- issue: Textform des abschließenden Königstitels
  choice: König der Zeitalter
  alternative: König der Völker
  rationale: Der Haupttext folgt der vorgegebenen Lesart αἰώνων. Die bedeutende Variante ἐθνῶν wird transparent in einer Fußnote genannt, statt in den Text übernommen zu werden.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit feierlichem, doxologischem Klang. Die direkte Anrede wird durch »du« verdeutlicht; ein neuer Hauptsatz für λέγοντες vermeidet eine schwerfällige Partizipialkonstruktion. Der Fußnotenmarker steht unmittelbar beim betroffenen Titel.
