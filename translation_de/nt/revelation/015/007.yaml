id: REV.15.7
reference: Revelation 15:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: de
  text: Und eines der vier Lebewesen gab den sieben Engeln sieben goldene Schalen, gefüllt mit dem Zorn Gottes, der in alle Ewigkeit lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der in die Zeitalter der Zeitalter lebt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: eines der vier Lebewesen
  rationale: ζῷον bezeichnet hier die lebendigen Wesen im himmlischen Thronsaal. „Lebewesen“ unterscheidet sie sachgerecht vom „Tier“ (θηρίον) der Offenbarung.
- source_word: ἔδωκεν
  choice: gab
  rationale: Die schlichte Vergangenheitsform gibt den Aorist von δίδωμι natürlich und ohne zusätzliche Deutung wieder.
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: den sieben Engeln
  rationale: Im apokalyptischen Zusammenhang bezeichnet ἄγγελος himmlische Engel.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: sieben goldene Schalen
  rationale: φιάλη bezeichnet ein flaches, schalenartiges Gefäß; „Schalen“ ist im heutigen Deutsch klarer und sachlich treffender als „Fläschchen“ oder „Phiolen“.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: gefüllt mit dem Zorn Gottes
  rationale: γέμω mit Genitiv bezeichnet das Erfülltsein. „Zorn“ bewahrt hier die ernste, gerichtliche Kraft von θυμός.
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: der in alle Ewigkeit lebt
  rationale: Das Partizip bezieht sich auf Gott; die deutsche Relativkonstruktion erhält diesen Bezug. „In alle Ewigkeit“ gibt die idiomatische Aussage unbegrenzter Dauer natürlich wieder.
theological_decisions:
- issue: Bezeichnung des göttlichen θυμός
  choice: Zorn Gottes
  alternative: Grimm Gottes; heftiger Zorn Gottes
  rationale: „Zorn“ bewahrt den feierlichen Gerichtssinn, ohne die Formulierung emotional zu übersteigern oder abzuschwächen.
- issue: Bezug von τοῦ ζῶντος und Aussage der Ewigkeit
  choice: Gottes, der in alle Ewigkeit lebt
  alternative: des lebendigen Gottes in alle Ewigkeit; Gottes, des Lebenden, von Ewigkeit zu Ewigkeit
  rationale: Der Relativsatz macht eindeutig, dass τοῦ ζῶντος Gott näher bestimmt, und verbindet sein Leben entsprechend dem griechischen Satz mit der unbegrenzten Dauer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Text, wird aber durch „gefüllt mit“ und den Relativsatz natürlich lesbar. „Lebewesen“ vermeidet eine Verwechslung mit dem apokalyptischen „Tier“.
