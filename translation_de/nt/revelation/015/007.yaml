  terminology: „Lebewesen“ ist hier gegenüber „Tieren“ sachgerecht, da es ζῷα von dem in der Offenbarung für das Tier verwendeten θηρίον unterscheidet. „Schalen“ ist eine passende Wiedergabe von φιάλαι; „Zorn Gottes“ trifft θυμός im Gerichtskontext. Die Fußnote ist korrekt verankert und erläutert die wörtlichere Form der Ewigkeitsformel.
