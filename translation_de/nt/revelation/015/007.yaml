  source_fidelity: 'Der Entwurf gibt alle Satzglieder des griechischen Textes zutreffend wieder: eines der vier Lebewesen, die sieben Engel, sieben goldene Schalen, ihre Füllung mit Gottes Zorn sowie die auf Gott bezogene Aussage seines ewigen Lebens. Der Relativsatz bezieht sich eindeutig auf „Gottes“ und wahrt die griechische Verbindung.'
