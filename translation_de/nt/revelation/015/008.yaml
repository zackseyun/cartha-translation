id: REV.15.8
reference: Revelation 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: de
  text: Und das Heiligtum[a] wurde mit Rauch aus der Herrlichkeit Gottes und aus seiner Macht erfüllt. Niemand konnte das Heiligtum betreten, bis die sieben Plagen der sieben Engel vollendet waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Tempel. Das griechische Wort ναός bezeichnet häufig genauer das innere Heiligtum als die gesamte Tempelanlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναός
  choice: Heiligtum
  rationale: ναός bezeichnet hier wahrscheinlich den inneren heiligen Wohnbereich Gottes, nicht die gesamte Tempelanlage. „Heiligtum“ gibt diese engere Bedeutung im Deutschen natürlich wieder.
- source_word: ἐγεμίσθη
  choice: wurde … erfüllt
  rationale: Die Form ist Aorist Passiv; die deutsche Passivkonstruktion bewahrt sowohl die grammatische Form als auch den feierlichen Ton.
- source_word: καπνοῦ
  choice: mit Rauch
  rationale: Der Genitiv bei γεμίζω bezeichnet den Inhalt; im Deutschen ist „mit Rauch erfüllt“ idiomatisch. „Rauch“ passt zur theophanischen Bildsprache.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ
  choice: aus der Herrlichkeit Gottes
  rationale: ἐκ bezeichnet Ursprung oder Quelle. „Aus der Herrlichkeit Gottes“ wahrt das Bild, dass der Rauch von Gottes offenbarter Herrlichkeit ausgeht.
- source_word: ἐκ τῆς δυνάμεως αὐτοῦ
  choice: aus seiner Macht
  rationale: Die parallele Wiedergabe von ἐκ erhält die koordinierte Aussage des griechischen Textes; „Macht“ ist hier eine direkte und würdige Entsprechung für δύναμις.
- source_word: οὐδεὶς ἐδύνατο
  choice: niemand konnte
  rationale: Die idiomatische deutsche Form gibt die im Imperfekt ausgedrückte anhaltende Unmöglichkeit klar wieder.
- source_word: εἰσελθεῖν εἰς τὸν ναόν
  choice: das Heiligtum betreten
  rationale: „Betreten“ ist im Deutschen natürlicher als eine wörtlichere Konstruktion mit „hineingehen“ und bewahrt das Ziel der Bewegung.
- source_word: ἄχρι τελεσθῶσιν
  choice: bis … vollendet waren
  rationale: Die Form markiert die zeitliche Grenze bis zum vollständigen Abschluss. „Vollendet waren“ bewahrt den passiven und resultativen Sinn.
- source_word: πληγαί
  choice: Plagen
  rationale: In der Offenbarung bezeichnet das Wort göttliche Gerichtsplagen; „Plagen“ ist die etablierte und kontextuell präzise Wiedergabe.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: der sieben Engel
  rationale: 'Der Genitiv wird als Zuordnung wiedergegeben: Es sind die Plagen, die mit den sieben Engeln verbunden sind.'
theological_decisions:
- issue: Wiedergabe von ναός im apokalyptischen Kontext des himmlischen Gottesdienstes
  choice: Heiligtum
  alternative: Tempel
  rationale: Das Bild zeigt Gottes heiligen Wohnbereich, der wie bei alttestamentlichen Gotteserscheinungen mit Rauch erfüllt wird. „Heiligtum“ vermeidet die vorschnelle Gleichsetzung mit der gesamten Tempelanlage, ohne weitergehende dogmatische Einzelheiten festzulegen.
- issue: Beziehung des Rauchs zu Gottes Herrlichkeit und Macht
  choice: Die beiden mit ἐκ eingeleiteten Angaben werden parallel als Quellenangaben wiedergegeben.
  alternative: Den Rauch ausdrücklich als Zeichen oder Wirkung von Herrlichkeit und Macht erklären.
  rationale: Der griechische Text nennt Herrlichkeit und Macht als Ursprung, erläutert ihre genaue Beziehung zum Rauch jedoch nicht. Die Übersetzung bewahrt diese Bildspannung, statt sie theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Wiederholung von „Heiligtum“ folgt bewusst dem griechischen Text. Der zweite mit καί verbundene Hauptsatz wird zur besseren deutschen Lesbarkeit als neuer Satz wiedergegeben, ohne die inhaltliche Verknüpfung zu verändern.
