id: REV.15.4
reference: Revelation 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: de
  text: Wer sollte dich nicht fürchten, Herr, und deinen Namen verherrlichen? Denn du allein bist heilig. Alle Völker werden kommen und vor dir anbeten, denn deine gerechten Taten[a] sind offenbar geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gerechten Urteile«. Das griechische Wort kann auch richterliche Entscheidungen oder Rechtsbestimmungen bezeichnen; hier sind wahrscheinlich Gottes nun sichtbar gewordene gerechte Taten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: Wer sollte dich nicht fürchten
  rationale: Die rhetorische Frage mit οὐ μή erwartet die Antwort »niemand«. »Wer sollte … nicht« gibt diese starke rhetorische Wirkung in natürlichem Deutsch wieder, ohne sie ausdrücklich aufzulösen.
- source_word: κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος wird in dieser Gottesrede mit der üblichen und würdigen Anrede »Herr« wiedergegeben.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: deinen Namen verherrlichen
  rationale: Die Formulierung bewahrt das biblische Bild vom Namen als Ausdruck der offenbarten Person und ihres Ansehens.
- source_word: μόνος ὅσιος
  choice: du allein bist heilig
  rationale: ὅσιος bezeichnet hier in einer Doxologie Gottes einzigartige Heiligkeit und sittliche Reinheit. Das im Griechischen vorausgesetzte »bist« muss im Deutschen ergänzt werden.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: ἔθνη bezeichnet hier umfassend die Völker, die zur endzeitlichen Anbetung kommen; »Völker« ist im Deutschen natürlicher und bewahrt den kollektiven Sinn.
- source_word: ἥξουσιν
  choice: werden kommen
  rationale: Die Zukunftsform und die Bedeutung des Kommens beziehungsweise Eintreffens werden unmittelbar wiedergegeben.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: werden … vor dir anbeten
  rationale: Im himmlisch-liturgischen Zusammenhang bezeichnet προσκυνέω religiöse Anbetung; ἐνώπιόν σου bleibt durch »vor dir« ausdrücklich erhalten.
- source_word: τὰ δικαιώματά σου
  choice: deine gerechten Taten
  rationale: δικαιώματα kann gerechte Taten, Rechtssprüche oder Satzungen bezeichnen. Im Kontext werden sichtbare Erweise von Gottes Gerechtigkeit besungen; »gerechte Taten« bewahrt die semantische Breite besser als eine ausschließlich juristische Wiedergabe.
- source_word: ἐφανερώθησαν
  choice: sind offenbar geworden
  rationale: Der Aorist Passiv bezeichnet das Sichtbar- oder Offenbarwerden. Das deutsche Perfekt bringt die abgeschlossene Handlung mit ihrer gegenwärtigen Bedeutung natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von ὅσιος in einer an Gott gerichteten Doxologie
  choice: heilig
  alternative: treu; fromm
  rationale: »Heilig« entspricht dem Lobpreis von Gottes einzigartiger sittlicher und kultischer Reinheit. »Fromm« wäre bei Gott unnatürlich, »treu« würde den Sinn auf Bundestreue verengen.
- issue: Deutung von δικαιώματα im apokalyptischen Gerichtskontext
  choice: gerechte Taten
  alternative: gerechte Urteile; Rechtsbestimmungen
  rationale: Der Zusammenhang preist Gottes nun sichtbar gewordene Gerechtigkeit. »Gerechte Taten« lässt offen, ob besonders Gerichtstaten oder andere gerechte Erweise gemeint sind; die juristische Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt erhalten; biblische Schlüsselbegriffe wie »Herr«, »heilig«, »Völker« und »anbeten« werden verständlich und ohne konfessionelle Zusätze wiedergegeben. Der Fußnotenmarker steht beim tatsächlich erläuterten Ausdruck.
