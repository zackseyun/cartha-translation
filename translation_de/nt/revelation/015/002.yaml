revisions:
- from: Und ich sah etwas wie ein gläsernes Meer, mit Feuer vermischt, und die, die über das Tier, über sein Bild und über die Zahl seines Namens gesiegt hatten,[a] auf dem gläsernen Meer stehen. Sie hielten Harfen Gottes[b] in den Händen.
  to: Und ich sah etwas wie ein gläsernes Meer, mit Feuer vermischt, und diejenigen, die über das Tier, über sein Bild und über die Zahl seines Namens gesiegt hatten,[a] auf dem gläsernen Meer stehen und Harfen Gottes[b] halten.
  rationale: Die Revision verbindet die beiden beschreibenden Handlungen wieder in einem Satz und lässt die nicht ausdrücklich genannte Ergänzung »in den Händen« weg. Die etablierte Übersetzungsentscheidung »über ... gesiegt« sowie die dreigliedrige Wiederholung bleiben erhalten. Fußnote a erläutert die ungewöhnliche ἐκ-Konstruktion präzise und in natürlichem Deutsch, ohne die im Text verbleibende Ambiguität aufzulösen.
