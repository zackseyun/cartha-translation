id: REV.15.2
reference: Revelation 15:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: de
  text: Und ich sah etwas wie ein gläsernes Meer, mit Feuer vermischt, und diejenigen, die über das Tier, über sein Bild und über die Zahl seines Namens gesiegt hatten,[a] auf dem gläsernen Meer stehen und Harfen Gottes[b] halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach dem Verb »siegen/überwinden« steht im Griechischen dreimal ein Ausdruck mit »aus«: »aus dem Tier, aus seinem Bild und aus der Zahl seines Namens«. Das kann den Sieg über diese Mächte oder das Herausgelangen aus ihrem Machtbereich betonen.'
    reason: alternative_reading
  - marker: b
    text: Der Ausdruck kann auch »Gottes eigene Harfen« oder »von Gott stammende beziehungsweise ihm geweihte Harfen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς θάλασσαν ὑαλίνην
  choice: etwas wie ein gläsernes Meer
  rationale: ὡς kennzeichnet einen visionären Vergleich und keine schlichte Gleichsetzung. »Etwas wie« gibt dies natürlich wieder; »gläsernes Meer« bewahrt das eindrückliche Bild und lässt offen, ob es aus Glas besteht oder wie Glas erscheint.
- source_word: μεμιγμένην πυρί
  choice: mit Feuer vermischt
  rationale: Das Partizip beschreibt das Meer als in einem fortbestehenden Zustand mit Feuer vermischt, ohne die ungewöhnliche Vision auszudeuten.
- source_word: τοὺς νικῶντας
  choice: die, die … gesiegt hatten
  rationale: νικάω bezeichnet in der Offenbarung das Siegen beziehungsweise Überwinden. Die Formulierung ist im Deutschen verständlich und stellt die Personen in der geschauten Szene als Sieger dar.
- source_word: ἐκ τοῦ θηρίου … καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: über das Tier, über sein Bild und über die Zahl seines Namens
  rationale: Nach dem deutschen Verb »siegen« bezeichnet »über« idiomatisch die besiegte Macht. Die dreimalige Wiederholung bewahrt die dreigliedrige Struktur des griechischen Textes; eine Fußnote weist auf die ungewöhnliche Verwendung von ἐκ und ihre mögliche Herkunfts- beziehungsweise Befreiungsnuance hin.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: auf dem gläsernen Meer stehen
  rationale: »Auf« bewahrt die auffällige visionäre Darstellung von ἐπί mit Akkusativ. »Am gläsernen Meer« wäre zwar möglich, würde das Bild jedoch abschwächen.
- source_word: κιθάρας τοῦ θεοῦ
  choice: Harfen Gottes
  rationale: »Harfen« ist die geläufige deutsche Wiedergabe der κιθάραι in der Offenbarung. Der Genitiv »Gottes« bleibt bewusst mehrdeutig und kann Besitz, Herkunft oder Bestimmung ausdrücken.
theological_decisions:
- issue: Verhältnis der Sieger zum Tier, ausgedrückt durch νικῶντας mit wiederholtem ἐκ
  choice: Sie haben über das Tier, sein Bild und die Zahl seines Namens gesiegt.
  alternative: Sie sind aus dem Machtbereich des Tieres, seines Bildes und der Zahl seines Namens herausgelangt beziehungsweise daraus befreit worden.
  rationale: Die Verbindung bezeichnet im Zusammenhang am ehesten den Sieg über feindliche Mächte. Da ἐκ gewöhnlich »aus/von« bedeutet, wird die mögliche Nuance des Herausgelangens aus ihrer Macht nicht beseitigt, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer visionärer Bildlichkeit. Die Satzteilung entlastet den langen griechischen Satz, ohne seine inhaltliche Abfolge zu verändern. Wiederholungen werden dort bewahrt, wo sie die dreigliedrige Struktur und den feierlichen Ton tragen.
