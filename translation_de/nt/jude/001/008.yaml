source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: de
  text: Doch ebenso beflecken auch diese Menschen, die sich auf Träume berufen,[a] das Fleisch, verwerfen Herrschaft[b] und lästern erhabene Wesen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „die träumen“ oder „als Träumende“. Das griechische Partizip kann schlicht das Träumen bezeichnen; im Zusammenhang kann es bedeuten, dass sie sich zur Rechtfertigung ihres Verhaltens auf Träume berufen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Autorität“. Der griechische Ausdruck kann Herrschaft allgemein, göttliche Herrschaft oder himmlische Herrschaft bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Gemeint sind wahrscheinlich erhabene himmlische Wesen, möglicherweise Engel; wörtlich: „Herrlichkeiten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: Doch ebenso
  rationale: „Ebenso“ bewahrt den Vergleich mit den vorausgehenden Beispielen; „doch“ gibt die leicht gegensätzliche Kraft von μέντοι natürlich wieder.
- source_word: οὗτοι
  choice: diese Menschen
  rationale: Das Demonstrativpronomen bezeichnet die im Kontext beschriebenen Eindringlinge. „Diese Menschen“ macht den Bezug verständlich, ohne ein im Griechischen nicht ausdrücklich bezeichnetes Geschlecht einzutragen.
- source_word: ἐνυπνιαζόμενοι
  choice: die sich auf Träume berufen
  rationale: Das Partizip bezeichnet wahrscheinlich nicht bloß den Vorgang des Träumens, sondern Träume als Grundlage oder Rechtfertigung ihres Verhaltens. Die formalere Wiedergabe wird in einer Fußnote bewahrt.
- source_word: σάρκα
  choice: das Fleisch
  rationale: Die formnahe Wiedergabe bewahrt die Bedeutungsbreite von σάρξ und legt den Ausdruck weder ausschließlich auf den Körper noch auf eine spätere theologische Fachbedeutung fest.
- source_word: μιαίνουσιν
  choice: beschmutzen
  rationale: Das Verb gibt die moralische und kultische Verunreinigung in natürlichem modernem Deutsch wieder.
- source_word: κυριότητα
  choice: Herrschaft
  rationale: „Herrschaft“ bewahrt eher als „Autorität“ den möglichen Bezug auf göttliche oder überirdische Herrschaft, ohne den genauen Bezug festzulegen.
- source_word: ἀθετοῦσιν
  choice: verwerfen
  rationale: „Verwerfen“ drückt die bewusste Zurückweisung dessen aus, was anerkannt werden sollte.
- source_word: δόξας
  choice: Herrliche
  rationale: Die substantivierte Wiedergabe bezeichnet ruhmvolle oder erhabene Wesen, ohne sie im Haupttext ausdrücklich mit Engeln gleichzusetzen.
- source_word: βλασφημοῦσιν
  choice: lästern
  rationale: „Lästern“ bezeichnet schwerwiegendes ehrverletzendes Reden und ist bei erhabenen beziehungsweise himmlischen Wesen treffender als das stärker auf unwahre Behauptungen eingeengte „verleumden“.
theological_decisions:
- issue: Bezug von δόξας
  choice: bewusst weiter Ausdruck für herrliche beziehungsweise erhabene Wesen
  alternative: Engel; himmlische Majestäten; abstrakt verstandene Herrlichkeiten
  rationale: Vers 9 legt einen Bezug auf himmlische Wesen nahe, doch δόξας benennt sie nicht ausdrücklich als Engel. Der Haupttext wahrt diese Offenheit.
- issue: Bedeutung von ἐνυπνιαζόμενοι
  choice: Ihr Verhalten stützt sich auf Träume
  alternative: Sie träumen; als Träumende
  rationale: Das Partizip kann formal mit „träumend“ wiedergegeben werden, dürfte hier aber die Grundlage ihres Handelns andeuten. Die Fußnote erhält die engere, formalere Möglichkeit.
- issue: Bezug von κυριότητα
  choice: Herrschaft ohne näher bestimmte Zuordnung
  alternative: die Herrschaft Christi oder Gottes; engelhafte Herrschaft; Autorität allgemein
  rationale: Der Singular kann verschiedene Formen von Herrschaft bezeichnen. Eine ausdrückliche Identifizierung würde die Mehrdeutigkeit des griechischen Textes unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der dreigliedrigen Anklage des griechischen Satzes. Die ungewöhnlichen Ausdrücke „das Fleisch“, „Herrschaft“ und „Herrliche“ bewahren bewusst die Mehrdeutigkeit und theologische Spannung des Ausgangstextes; Fußnoten erläutern mögliche engere Deutungen.
