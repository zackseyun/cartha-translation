id: JUD.1.15
reference: Jude 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: de
  text: um an allen Gericht zu vollziehen und alle Gottlosen zu überführen[a] wegen all ihrer gottlosen Taten, die sie in Gottlosigkeit begangen haben, und wegen all der harten Worte[c], die gottlose Sünder gegen ihn[b] geredet haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „bloßzustellen“ oder „ihre Schuld nachzuweisen“. Das griechische Verb kann das Aufdecken von Unrecht bezeichnen; hier steht es im Zusammenhang mit dem Gerichtsvollzug.
    reason: lexical_alternative
  - marker: b
    text: „Ihn“ bezieht sich dem Zusammenhang nach auf den Herrn, der im vorherigen Vers genannt wird.
    reason: cross_reference
  - marker: c
    text: Wörtlich „all des Harten“. Gemeint sind wahrscheinlich harte, trotzige oder vermessene Äußerungen gegen ihn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: Gericht zu vollziehen
  rationale: Die Wendung bezeichnet die Ausführung des Gerichts, nicht nur das Fällen einer Entscheidung. „Gericht vollziehen“ gibt den gerichtlichen und endzeitlichen Zusammenhang würdig und idiomatisch wieder.
- source_word: κατὰ πάντων
  choice: an allen
  rationale: κατά mit dem Genitiv hat hier gerichtliche, gegen Personen gerichtete Bedeutung. Im Deutschen bringt die feste Verbindung „an allen Gericht vollziehen“ dies natürlicher zum Ausdruck als das schwerfällige „Gericht gegen alle vollziehen“.
- source_word: ἐλέγξαι
  choice: zu überführen
  rationale: Im Zusammenhang mit dem Gericht meint das Verb, Schuld aufzudecken und nachzuweisen. „Überführen“ bewahrt diesen gerichtlichen Sinn, ohne vorschnell nur den formalen Schuldspruch zu bezeichnen.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: alle Gottlosen
  rationale: Die substantivische Mehrzahl wird knapp und natürlich wiedergegeben. „Gottlos“ ermöglicht zudem, die auffällige Wiederholung der Wortgruppe ἀσεβ- im Vers weitgehend zu bewahren.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: wegen all ihrer gottlosen Taten
  rationale: „Gottlose Taten“ ist modernes, verständliches Deutsch für den Genitiv „Werke der Gottlosigkeit“. „Wegen“ passt zum gerichtlichen Vorwurf, den περί hier einleitet.
- source_word: ὧν ἠσέβησαν
  choice: die sie in Gottlosigkeit begangen haben
  rationale: Die Formulierung erhält die im Griechischen nachdrücklich wiederholte Wortfamilie ἀσέβεια/ἀσεβέω. Das Verb „begangen“ nimmt idiomatisch die zuvor genannten Taten auf.
- source_word: σκληρῶν
  choice: harten Worte
  rationale: σκληρός bedeutet grundsätzlich „hart“ und bezeichnet hier aufgrund von ἐλάλησαν feindselige oder trotzige Äußerungen. Das ergänzte „Worte“ macht den Bezug im Deutschen klar, ohne die Breite des Ausdrucks unnötig einzuengen.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: gegen ihn geredet haben
  rationale: „Gegen ihn reden“ bildet κατά mit dem Genitiv natürlich ab. Das Perfekt stellt die begangenen Äußerungen als nun zur Anklage stehende Handlungen dar.
- source_word: αὐτοῦ
  choice: ihn
  rationale: Der griechische Text hat ein Pronomen. Dieses bleibt erhalten, statt es deutend durch „den Herrn“ oder „Gott“ zu ersetzen.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: gottlose Sünder
  rationale: Die kompakte Verbindung bewahrt beide betonten Bezeichnungen und stellt durch „gottlose“ erneut den leitenden Wortstamm dieses Verses heraus.
theological_decisions:
- issue: Bezugswort von αὐτοῦ in „gegen ihn“
  choice: Das Pronomen „ihn“ bleibt im Haupttext stehen.
  alternative: „gegen den Herrn“ oder „gegen Gott“
  rationale: Der Zusammenhang mit dem in Vers 14 genannten Herrn weist auf den Bezug hin. Da der griechische Text hier jedoch nur ein Pronomen verwendet, wird die kontextuelle Deutung nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit verständlicher gerichtlicher Ausdrucksweise. Die vierfache Häufung der griechischen ἀσεβ-Wortfamilie wird soweit idiomatisch möglich durch „Gottlose“, „gottlosen“, „Gottlosigkeit“ und „gottlose“ nachvollzogen. Der Satz bleibt als Fortsetzung von Vers 14 mit „um“ eingeleitet.
