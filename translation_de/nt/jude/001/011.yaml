  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: de
  text: Wehe ihnen! Denn sie sind den Weg Kains gegangen, haben sich für Lohn dem Irrweg Bileams hingegeben[a] und sind im Aufruhr Korachs umgekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „sind um Gewinn willen Hals über Kopf in Bileams Irrweg gestürzt“.'
    reason: Lexikalische Alternative für die ungewöhnliche und syntaktisch gedrängte Wendung mit ἐξεχύθησαν; sie bringt die mögliche Vorstellung ungestümen Sich-Hineinstürzens zum Ausdruck, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: Wehe ihnen!
  rationale: Bewahrt den prophetischen Gerichts- und Drohruf; „Ach“ wäre zu schwach.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: sie sind den Weg Kains gegangen
  rationale: Gibt das Bild eines moralischen Lebenswegs natürlich und quellennah wieder.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: in den Irrweg Bileams
  rationale: „Irrweg“ wahrt sowohl den Gedanken des Irrtums als auch das im Zusammenhang anklingende Bild eines falschen Weges.
- source_word: μισθοῦ
  choice: um Lohn
  rationale: Bezeichnet die entgeltliche, eigennützige Motivation knapp und in würdigem modernem Deutsch.
- source_word: ἐξεχύθησαν
  choice: haben sich … ergossen
  rationale: Bewahrt bewusst das ungewöhnliche Bild des griechischen Verbs, statt es im Haupttext vollständig deutend aufzulösen.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: im Aufruhr Korachs
  rationale: Im Bezug auf Numeri 16 bezeichnet ἀντιλογία nicht bloß verbalen Widerspruch, sondern widerständige Auflehnung; „Aufruhr“ bleibt konkret, ohne den Ausdruck unnötig konfessionell zu prägen.
- source_word: ἀπώλοντο
  choice: sind … umgekommen
  rationale: Gibt den abgeschlossenen Untergang feierlich und natürlich wieder, ohne dessen Art näher festzulegen.
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: Kain / Bileam / Korach
  rationale: Verwendet die im modernen deutschen Bibelgebrauch vertrauten Namensformen.
theological_decisions:
- issue: Die schwierige Metapher καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: haben sich um Lohn in den Irrweg Bileams ergossen
  alternative: sind um Gewinn willen Hals über Kopf dem Irrweg Bileams verfallen
  rationale: Der Haupttext erhält das auffällige Bild von ἐξεχύθησαν und die eigennützige Motivation von μισθοῦ. Die Fußnote bietet eine verständlichere Sinnwiedergabe, ohne sie als einzig mögliche Deutung auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Der dreigliedrige Parallelismus und die alttestamentlichen Anspielungen bleiben erhalten; die schwierigste Metapher wird im Haupttext formal bewahrt und in einer Fußnote sinngemäß erläutert.
