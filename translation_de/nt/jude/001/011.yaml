  source_fidelity: Der dreigliedrige Gerichtspruch sowie die Anspielungen auf Kain, Bileam und Korach sind zutreffend wiedergegeben. Die Wendung „haben sich ... in den Irrweg Bileams ergossen“ bildet ἐξεχύθησαν zwar formal nach, ist im Deutschen jedoch keine verständliche oder tragfähige Metapher und kann einen falschen räumlich-stofflichen Sinn nahelegen. Eine idiomatische Wiedergabe als selbstpreisgebendes Eingehen auf Bileams Irrweg vermittelt die metaphorische und die eigennützige Dimension, ohne die genaue Bildlogik übermäßig festzulegen.
  naturalness: „Wehe ihnen!“ und der Parallelismus sind modern, würdig und natürlich. „Sich in einen Irrweg ergießen“ ist dagegen im modernen Standarddeutsch unidiomatisch. „Sich für Lohn dem Irrweg Bileams hingeben“ ist klar, gehoben und dem Register angemessen.
  terminology: Die Namen Kain, Bileam und Korach entsprechen dem etablierten deutschen Bibelgebrauch. „Irrweg“, „Lohn“, „Aufruhr“ und „umkommen“ sind in diesem Kontext angemessen. Die Fußnote sollte die idiomatischere Deutungsalternative als solche ausweisen, ohne den schwierigen griechischen Ausdruck als eindeutig zu behandeln.
