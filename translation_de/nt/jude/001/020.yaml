source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: de
  text: Ihr aber, Geliebte, baut euch auf eurem allerheiligsten Glauben auf[a] und betet im Heiligen Geist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „baut euch in eurem allerheiligsten Glauben auf“. Die griechische Konstruktion kann den Glauben als Grundlage des Bauens oder als dessen Bereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „betet durch den Heiligen Geist“. Die Wendung kann sowohl den Wirkungsbereich des Gebets als auch die Befähigung durch den Geist betonen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ihr aber
  rationale: Das ausdrückliche Pronomen betont die Angesprochenen; δέ stellt sie in einen deutlichen, im Deutschen natürlichen Gegensatz zu den zuvor Genannten.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Die Anrede bewahrt sowohl den herzlichen als auch den theologisch gewichtigen Charakter des griechischen Ausdrucks.
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: baut euch … auf
  rationale: Die Wendung erhält das Bild des Bauens und die reflexive, gemeinschaftliche Ausrichtung. Die koordinierte Aufforderung gibt die exhortative Funktion der Partizipien im Zusammenhang natürlich wieder.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: auf eurem hochheiligen Glauben
  rationale: Bei ἐποικοδομέω kann der Dativ die Grundlage bezeichnen. „Auf … Glauben“ führt das Baubild im Deutschen klar fort; „hochheilig“ gibt den Superlativ ἁγιωτάτῃ würdig und idiomatisch wieder.
- source_word: πίστει
  choice: Glauben
  rationale: Im Judasbrief weist der Zusammenhang wahrscheinlich auf den von der Gemeinschaft empfangenen und bekannten christlichen Glauben; das deutsche Wort lässt zugleich den Aspekt des Vertrauens offen.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: Die Wendung bezeichnet am natürlichsten den Heiligen Geist. „Im“ bewahrt ἐν und legt nicht ausschließlich eine instrumentale Bedeutung fest.
- source_word: προσευχόμενοι
  choice: betet
  rationale: Das Partizip gehört zu einer Folge von Ermahnungen. Eine finite Aufforderung ist im modernen Deutsch klar und bewahrt innerhalb des Verses die Koordination mit dem Aufbau der Gemeinde.
theological_decisions:
- issue: Bezug von πνεύματι ἁγίῳ
  choice: der göttliche Heilige Geist
  alternative: eine heilige menschliche Geisteshaltung
  rationale: Sprachgebrauch und Kontext sprechen überwiegend für den Heiligen Geist; die artikellose griechische Form schließt diese bestimmte Referenz nicht aus.
- issue: Bedeutung von πίστις
  choice: der gemeinsame christliche Glaube
  alternative: persönliches Vertrauen oder Treue
  rationale: Der Judasbrief spricht in Vers 3 vom überlieferten Glauben; hier legt „euer“ den gemeinsamen Glauben der Gemeinde nahe. „Glaube“ vermeidet dennoch eine unnötige Verengung.
- issue: Funktion von ἐν bei πνεύματι ἁγίῳ
  choice: Gebet im Wirkungs- oder Lebensbereich des Heiligen Geistes
  alternative: Gebet durch die Befähigung des Heiligen Geistes
  rationale: „Im Heiligen Geist“ hält die mögliche Bedeutung von Sphäre und Einfluss offen, ohne die ebenfalls mögliche instrumentale Nuance auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Geliebte“ erhält die feierliche Anrede; „hochheilig“ bildet den griechischen Superlativ prägnant ab. Die Partizipialkonstruktionen werden als koordinierte Imperative wiedergegeben, damit die Ermahnung natürlich verständlich ist; der Abschluss als Punkt folgt der Einzelversdarstellung, obwohl der griechische Satz in Vers 21 weiterläuft.
