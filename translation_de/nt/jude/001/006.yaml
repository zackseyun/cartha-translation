id: JUD.1.6
reference: Jude 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: de
  text: Und die Engel, die ihre eigene Stellung[a] nicht bewahrten, sondern die ihnen eigene Wohnstätte verließen, hat er mit ewigen Fesseln in tiefer Dunkelheit für das Gericht des großen Tages verwahrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihren eigenen Bereich; oder: ihre eigene Herrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: Engel
  rationale: Im Gerichtskontext bezeichnet das Wort übernatürliche Wesen; „Boten“ wäre hier missverständlich.
- source_word: τηρήσαντας / τετήρηκεν
  choice: nicht bewahrten / hat er … verwahrt
  rationale: 'Die verwandten deutschen Verben bewahren die bewusste Wiederholung und den Kontrast des griechischen τηρέω: Die Engel bewahrten ihren Bereich nicht, Gott aber verwahrt sie für das Gericht.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: ihren eigenen Herrschaftsbereich
  rationale: ἀρχή kann Stellung, Herrschaft oder einen zugewiesenen Bereich bezeichnen. „Herrschaftsbereich“ hält die Bedeutungsbreite zwischen Autorität und Sphäre möglichst offen.
- source_word: ἀπολιπόντας
  choice: verließen
  rationale: „Verließen“ gibt den bewussten Weggang klar und natürlich wieder, ohne den ohnehin erkennbaren Schuldton unnötig zu verstärken.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: die ihnen eigene Wohnstätte
  rationale: οἰκητήριον bezeichnet eine Wohnstätte; „die ihnen eigene“ gibt ἴδιον wieder, ohne ausdrücklich eine zusätzliche Vorstellung von Angemessenheit oder göttlicher Zuweisung einzutragen.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: für das Gericht des großen Tages
  rationale: Die Formulierung bewahrt die Zielrichtung von εἰς und die Genitivkonstruktion, ohne sie interpretierend als bloßen Zeitpunkt („bis“) aufzulösen.
- source_word: δεσμοῖς ἀϊδίοις
  choice: mit ewigen Fesseln
  rationale: „Fesseln“ ist im Deutschen idiomatisch und bildkräftig; „ewig“ gibt die bleibende Dauer von ἀΐδιος wieder.
- source_word: ὑπὸ ζόφον
  choice: in tiefer Dunkelheit
  rationale: ζόφος bezeichnet düstere, tiefe Finsternis, nicht nur gewöhnliche Dunkelheit. Das idiomatische „in“ gibt hier die räumliche Verwahrung natürlicher wieder als ein wörtliches „unter“.
- source_word: τε
  choice: Und
  rationale: „Und“ verbindet dieses Gerichtsbeispiel natürlich mit dem vorausgehenden Zusammenhang.
theological_decisions:
- issue: Art der Verfehlung der Engel
  choice: Die Engel bewahrten ihren eigenen Herrschaftsbereich nicht und verließen ihre Wohnstätte; der genaue traditionsgeschichtliche Hintergrund bleibt unausgeführt.
  alternative: Ausdrückliche Deutung als Ereignis aus 1. Mose 6 oder als allgemeiner ursprünglicher Engelfall.
  rationale: Der Vers spielt wahrscheinlich auf eine bekannte jüdische Überlieferung an, bestimmt sie im Wortlaut jedoch nicht näher. Die Übersetzung importiert deshalb keine vollständige Deutung.
- issue: Bedeutung von ἀΐδιος
  choice: ewig
  alternative: immerwährend; dauerhaft
  rationale: „Ewig“ ist die klare und herkömmliche Wiedergabe der bleibenden Dauer, ohne weitere metaphysische Einzelheiten über die Fesseln festzulegen.
- issue: Nicht ausdrücklich genanntes Subjekt von τετήρηκεν
  choice: „hat er … verwahrt“, wobei der Zusammenhang Gott als Handelnden erkennen lässt
  alternative: „hat Gott … verwahrt“
  rationale: Das griechische Verb hat in diesem Vers kein ausdrücklich genanntes Subjekt. Das Pronomen bewahrt diese Textgestalt und vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der markanten Gegenüberstellung des griechischen Textes, bleibt aber gut lesbar. Die Wiederholung von τηρέω wird durch „bewahrten“ und „verwahrt“ hörbar gemacht.
