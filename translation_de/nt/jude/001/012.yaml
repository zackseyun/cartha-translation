  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: de
  text: Diese sind verborgene Klippen bei euren Liebesmahlen[a]; sie feiern unbekümmert mit und weiden sich selbst[b]; wasserlose Wolken, von Winden dahingetrieben; herbstliche Bäume ohne Frucht, zweimal gestorben, entwurzelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Flecken« oder »Makel bei euren Liebesmahlen«. Das griechische Wort kann moralisch verstanden werden, kann aber auch gefährliche Klippen bezeichnen; Letzteres passt gut zu der Reihe anschaulicher Bilder.'
    reason: alternative_reading
  - marker: b
    text: »Sich selbst weiden« kann auch im Sinn von »sich selbst nähren« oder »nur für sich selbst sorgen« verstanden werden. Vergleiche Hesekiel 34, wo Hirten sich selbst statt die Herde weiden.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: verborgene Klippen
  rationale: Die Bedeutung gefährlicher, möglicherweise verborgener Felsen passt zur Reihe eindrücklicher Naturbilder; die mögliche moralische Bedeutung „Flecken“ bleibt in der Fußnote erhalten.
- source_word: ἀγάπαις
  choice: Liebesmahlen
  rationale: Der Plural bezeichnet hier gemeinschaftliche Mahlfeiern der christlichen Gemeinde und bewahrt zugleich die Verbindung zu ἀγάπη, „Liebe“.
- source_word: συνευωχούμενοι
  choice: sie feiern … mit
  rationale: Das Partizip bezeichnet die gemeinsame Teilnahme an einem Festmahl; „mitfeiern“ ist im Deutschen natürlich und macht die Mahlgemeinschaft deutlich.
- source_word: ἀφόβως
  choice: unbekümmert
  rationale: Das Wort beschreibt ein Handeln ohne Furcht oder Scheu. „Unbekümmert“ vermittelt hier die fehlende Zurückhaltung, ohne ausdrücklich zwischen Dreistigkeit und mangelnder Gottesfurcht zu entscheiden.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: weiden sich selbst
  rationale: Die Formulierung bewahrt das Hirtenbild und zugleich den möglichen Sinn, dass sie nur sich selbst nähren und versorgen.
- source_word: νεφέλαι ἄνυδροι
  choice: wasserlose Wolken
  rationale: Die knappe, konkrete Wiedergabe erhält das Bild von Wolken, die trotz ihres Anscheins keinen Regen bringen.
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: von Winden dahingetrieben
  rationale: Die passive Bewegung durch äußere Kräfte wird im Deutschen anschaulich und quellennah ausgedrückt.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: herbstliche Bäume ohne Frucht
  rationale: Die Wiedergabe hält Jahreszeit und Fruchtlosigkeit konkret fest, ohne die Metapher auszudeuten.
- source_word: δὶς ἀποθανόντα
  choice: zweimal gestorben
  rationale: Die auffällige rhetorische Formulierung wird direkt bewahrt und nicht als bloß „völlig tot“ erklärt.
- source_word: ἐκριζωθέντα
  choice: entwurzelt
  rationale: Das Wort verstärkt das Bild endgültiger Leblosigkeit knapp und anschaulich.
theological_decisions:
- issue: Deutung von σπιλάδες im Blick auf die beschriebenen Menschen
  choice: gefährliche verborgene Klippen innerhalb der gemeinschaftlichen Mahlfeiern
  alternative: Flecken oder Schandflecken bei den Liebesmahlen
  rationale: Die Lesart „Klippen“ fügt sich gut in die folgende Reihe lebhafter Naturbilder und bezeichnet eine verborgene Gefahr. Die lexikalisch und traditionell mögliche moralische Lesart wird in der Fußnote genannt.
- issue: Bedeutung von ἑαυτοὺς ποιμαίνοντες
  choice: das Hirtenbild mit „weiden sich selbst“ bewahren
  alternative: sich selbst nähren oder nur für sich selbst sorgen
  rationale: ποιμαίνω bezeichnet grundsätzlich das Hüten oder Weiden. Die bildhafte Wiedergabe erhält sowohl den möglichen Bezug auf selbstsüchtige Leiter als auch den Anklang an das Motiv eigennütziger Hirten, ohne eine einzelne Auslegung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die asyndetische Reihe der Metaphern und die rhetorisch ungewöhnliche Wendung „zweimal gestorben“ bleiben erhalten. Der Doppelpunkt macht deutlich, dass die folgenden Bilder die eingangs bezeichneten Menschen charakterisieren.
