review_pass:
  verdict: revise
  source_fidelity: Der Imperfekt ἔλεγον wird durch „sagten euch immer wieder“ angemessen als wiederholtes Sprechen wiedergegeben. „Spötter“ trifft ἐμπαῖκται, und „ihren eigenen gottlosen Begierden folgen“ gibt sowohl den Lebenswandel (πορευόμενοι) als auch die durch ἀσέβειαι qualifizierten Begierden sachgerecht wieder. Die Zeitangabe steht im Griechischen im Singular und sollte im Deutschen zugleich klar endzeitlich verstanden werden.
  naturalness: „In der letzten Zeit“ ist zwar formal möglich, kann im heutigen Deutsch jedoch leicht im nichteschatologischen Sinn von „kürzlich“ bzw. „in jüngerer Zeit“ verstanden werden. „In der Endzeit“ ist hier natürlich, eindeutig und wahrt den Singular der griechischen Zeitangabe. Das einleitende „ja“ ist entbehrlich; ohne es bleibt der Satz schlicht und natürlich.
  terminology: „Endzeit“, „Spötter“, „gottlose Begierden“ sind verständliche standardsprachliche und dem Kontext angemessene Wiedergaben. Die Fußnote hält die wörtlichere Alternative sowie die Singularbeobachtung fest.
  issues:
