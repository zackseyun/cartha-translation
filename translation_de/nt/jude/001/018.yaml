    issue: Die Hauptlesart „in der letzten Zeit“ ist im modernen Deutsch mehrdeutig.
    rationale: Sie kann eine jüngst vergangene Zeit bezeichnen und verdeutlicht daher den eschatologischen Bezug von ἐπ’ ἐσχάτου χρόνου nicht zuverlässig. „In der Endzeit“ beseitigt diese deutsche Mehrdeutigkeit, ohne den griechischen Singular aufzugeben.
