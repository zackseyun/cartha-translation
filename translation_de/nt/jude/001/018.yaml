  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: de
  text: 'Sie sagten euch immer wieder: »In der Endzeit[a] wird es Spötter geben, die ihren eigenen gottlosen Begierden folgen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „in der letzten Zeit“ oder „am Ende der Zeit“. Im Griechischen steht „Zeit“ im Singular, nicht „Tage“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sie sagten … immer wieder
  rationale: Der Imperfekt bezeichnet hier wahrscheinlich wiederholtes oder fortdauerndes Reden in der Vergangenheit. „Immer wieder“ macht diesen Aspekt in natürlichem Deutsch deutlich.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: in der letzten Zeit
  rationale: Die Wiedergabe bewahrt den Singular χρόνος („Zeit“) und den endzeitlichen Sinn, ohne die Formulierung an das geläufigere „in den letzten Tagen“ anzugleichen.
- source_word: ἐμπαῖκται
  choice: Spötter
  rationale: „Spötter“ ist im heutigen Standarddeutsch verständlich und gibt die verächtliche, höhnische Haltung des griechischen Ausdrucks prägnant wieder.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: ihren eigenen … Begierden folgen
  rationale: κατά mit Akkusativ drückt hier die Ausrichtung des Lebens an den eigenen Begierden aus. „Folgen“ verbindet sich im Deutschen natürlich mit „Begierden“ und gibt den Sinn der Wendung treffend wieder.
- source_word: πορευόμενοι
  choice: folgen
  rationale: Das Partizip beschreibt bildhaft den Lebenswandel. Die deutsche Formulierung „Begierden folgen“ überträgt diese Bedeutung natürlich, ohne das im Kontext schwerfällige „gehen“ oder „wandeln“ zu verwenden.
- source_word: τῶν ἀσεβειῶν
  choice: gottlosen
  rationale: Der Genitiv kennzeichnet die Begierden als von Gottlosigkeit geprägt. Die adjektivische Wiedergabe ist idiomatisch und bewahrt das moralisch-religiöse Urteil, ohne die Begierden auf Sexualität einzuengen.
theological_decisions:
- issue: Endzeitliche Zeitangabe
  choice: in der letzten Zeit
  alternative: in der Endzeit; am Ende der Zeit; in den letzten Tagen
  rationale: Die Übersetzung erhält den Singular „Zeit“ und harmonisiert Judas’ eigene Formulierung nicht mit anderen neutestamentlichen Wendungen. „Am Ende der Zeit“ könnte zudem stärker einen Zeitpunkt statt einen Zeitraum nahelegen.
- issue: Moralische Kennzeichnung der Begierden
  choice: gottlose Begierden
  alternative: Begierden der Gottlosigkeit; sündige Begierden
  rationale: „Gottlos“ entspricht ἀσέβεια genauer als das allgemeinere „sündig“. Zugleich bleibt der breite Bedeutungsumfang von ἐπιθυμίαι erhalten und wird nicht auf sexuelle Lust beschränkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ja“ greift die erinnernde Begründungsfunktion von ὅτι im Zusammenhang auf; „immer wieder“ bildet den imperfektiven Aspekt von ἔλεγον ab. Die direkte Rede bleibt klar und flüssig.
