id: JUD.1.14
reference: Jude 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: de
  text: 'Auch Henoch[a], der siebte nach Adam, prophezeite über diese und sagte: »Siehe,[b] der Herr ist mit seinen heiligen Zehntausenden[c] gekommen,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »gegen diese« oder »an diese gerichtet«. Der griechische Dativ kann die Personen bezeichnen, auf die sich die Prophetie bezieht oder an die sie gerichtet ist; im Zusammenhang sind die zuvor beschriebenen gottlosen Eindringlinge gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das Zitat greift 1 Henoch 1,9 auf.
    reason: cross_reference
  - marker: c
    text: 'Oder: »mit seinen heiligen Myriaden«. Gemeint ist eine gewaltige heilige Schar; der griechische Ausdruck bezeichnet wörtlich Zehntausende beziehungsweise Myriaden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: hat … prophezeit
  rationale: Bewahrt den prophetischen Sprechakt des Aorists, ohne ihn auf bloße Zukunftsvorhersage zu verengen.
- source_word: δὲ καὶ
  choice: Auch
  rationale: Gibt die weiterführende und additive Funktion natürlich wieder; ein starker Gegensatz ist nicht angezeigt.
- source_word: τούτοις
  choice: über diese
  rationale: Der Dativ bei προφητεύω kann den Gegenstand der Prophetie bezeichnen. Die Formulierung bleibt geschlechtsneutral und verweist im Kontext auf die zuvor beschriebenen Gottlosen.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: der Siebte von Adam an
  rationale: Gibt die genealogische Zählung präzise und in verständlichem Deutsch wieder.
- source_word: Ἑνὼχ
  choice: Henoch
  rationale: Eingebürgerte deutsche Namensform.
- source_word: λέγων
  choice: und gesagt
  rationale: Führt das Zitat in natürlichem Deutsch ein und entspricht funktional dem Partizip λέγων.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den feierlichen, prophetischen Aufmerksamkeitsruf.
- source_word: ἦλθεν
  choice: ist … gekommen
  rationale: Gibt den griechischen Aorist als vergangenes Kommen wieder, ohne den prophetischen Vergangenheitsgebrauch ausdrücklich in eine Zukunftsform umzudeuten.
- source_word: κύριος
  choice: der Herr
  rationale: Entspricht dem griechischen Titel mit Artikel und lässt dessen genaue Referenz offen.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: mit seinen heiligen Zehntausenden
  rationale: ἐν wird hier assoziativ als „mit“ verstanden; μυριάσιν bezeichnet Zehntausende beziehungsweise eine gewaltige Schar. „Heilige“ wird substantivisch wiedergegeben, ohne sie ausdrücklich als Engel zu bestimmen.
theological_decisions:
- issue: Identität des „Herrn“ im Henoch-Zitat
  choice: Nur „der Herr“, ohne nähere Identifizierung
  alternative: Ausdrückliche Identifizierung mit Gott oder Jesus Christus
  rationale: κύριος allein entscheidet die Referenz nicht eindeutig. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Zeitbezug von ἦλθεν
  choice: „ist … gekommen“
  alternative: „wird … kommen“
  rationale: Die Vergangenheitsform des griechischen Textes wird bewahrt. Dass sie prophetisch ein zukünftiges Ereignis als gewiss darstellen kann, wird nicht stillschweigend in den Haupttext eingetragen.
- issue: Art und Status des Zitats
  choice: Als Prophetie Henochs wiedergeben; den Bezug zu 1 Henoch nur in einer Fußnote nennen
  alternative: Im Haupttext als Zitat aus 1 Henoch kennzeichnen oder dessen kanonischen Status bewerten
  rationale: Judas bezeichnet die Aussage als Prophetie, macht hier aber keine ausdrückliche Aussage zum kanonischen Status der überlieferten Schrift.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ erhält bewusst den feierlich-prophetischen Ton. „Von Adam an“ verdeutlicht die genealogische Zählung. Die ungewöhnliche Vergangenheitsform des Zitats bleibt erhalten, damit die mögliche prophetische Spannung nicht aufgelöst wird.
