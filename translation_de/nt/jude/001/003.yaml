id: JUD.1.3
reference: Jude 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: de
  text: Geliebte, während ich mich mit allem Eifer bemühte, euch über unser gemeinsames Heil zu schreiben, sah ich mich genötigt, euch zu schreiben und euch aufzurufen, mit aller Kraft für den Glauben[a] zu kämpfen, der den Heiligen[b] ein für alle Mal überliefert[c] worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Glaube“ meint hier wahrscheinlich den den Glaubenden anvertrauten Glaubensinhalt, nicht nur den persönlichen Akt des Glaubens.
    reason: alternative_reading
  - marker: b
    text: Mit den „Heiligen“ sind Gottes geheiligte Menschen gemeint, also die Glaubenden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „weitergegeben“ oder „übergeben“. Das Wort kann sowohl die Übergabe als auch die Weitergabe einer Überlieferung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Geliebte
  rationale: Die substantivierte Anrede bewahrt den warmen, von Liebe geprägten Ton und bleibt zugleich würdevoll.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: als ich mit allem Eifer daranging
  rationale: Die Wendung bezeichnet ernsthaften Eifer beim beabsichtigten Schreiben. „Als“ lässt den genauen logischen Wert des Partizips offen, statt ausdrücklich einen möglicherweise zu starken Gegensatz durch „obwohl“ einzuführen.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: über unser gemeinsames Heil
  rationale: κοινή bezeichnet das gemeinsam geteilte Heil; „Heil“ ist im biblischen Register prägnant und umfasst die Bedeutung von Rettung beziehungsweise Erlösung.
- source_word: ἀνάγκην ἔσχον
  choice: sah ich mich genötigt
  rationale: Die idiomatische Wendung drückt eine aus den Umständen entstandene Notwendigkeit aus, ohne eine ausdrücklich genannte äußere Zwangsinstanz einzuführen.
- source_word: παρακαλῶν
  choice: und euch aufzurufen
  rationale: Das Partizip bezeichnet hier den dringlichen, ermahnenden Zweck beziehungsweise Inhalt des Schreibens.
- source_word: ἐπαγωνίζεσθαι
  choice: mit aller Kraft ... zu kämpfen
  rationale: Die Form bezeichnet intensiven Einsatz. Die Wiedergabe erhält das agonistische Bild und macht die verstärkende Bedeutung des Verbs hörbar.
- source_word: τῇ ... πίστει
  choice: für den Glauben
  rationale: Im Zusammenhang mit dem einmaligen Überliefern an die Heiligen bezeichnet πίστις am ehesten den gemeinsam empfangenen Glauben beziehungsweise dessen Inhalt; die deutsche Formulierung lässt dennoch die enge Verbindung zum gläubigen Vertrauen bestehen.
- source_word: ἅπαξ
  choice: ein für alle Mal
  rationale: Die Wendung gibt den definitiven, nicht zu wiederholenden Charakter der Überlieferung wieder.
- source_word: παραδοθείσῃ
  choice: überliefert
  rationale: Das Passiv von παραδίδωμι bezeichnet hier die Weitergabe beziehungsweise Übergabe des Glaubens. „Überliefert“ bewahrt den Gedanken der vermittelten Weitergabe.
- source_word: τοῖς ἁγίοις
  choice: den Heiligen
  rationale: Der Ausdruck bezeichnet die zu Gott gehörenden, geheiligten Menschen und nicht eine spätere besondere Gruppe kirchlich kanonisierter Personen.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: „der Glaube“ als der gemeinschaftlich empfangene Inhalt des christlichen Glaubens
  alternative: das persönliche Vertrauen beziehungsweise der Glaubensvollzug
  rationale: Die Formulierung, dass dieser Glaube den Heiligen ein für alle Mal überliefert wurde, weist vor allem auf etwas Empfangbares und Weitergegebenes. Die Übersetzung „Glaube“ vermeidet jedoch eine starre Gleichsetzung mit einem später formulierten Lehrsystem.
- issue: Kraft von ἅπαξ παραδοθείσῃ
  choice: definitive, einmalige Überlieferung
  alternative: eine einmal erfolgte Übergabe ohne ausdrücklich hervorgehobene Endgültigkeit
  rationale: ἅπαξ kann schlicht „einmal“ heißen, trägt hier aber in Verbindung mit der Überlieferung des Glaubens wahrscheinlich den Sinn „ein für alle Mal“. Diese Nuance wird im Haupttext sichtbar gemacht.
- issue: Referenz von τοῖς ἁγίοις
  choice: Gottes geheiligtes Volk, also die Glaubenden
  alternative: eine besondere, später als Heilige anerkannte Personengruppe
  rationale: Im frühchristlichen Sprachgebrauch bezeichnet der Plural gewöhnlich die Gemeinschaft der zu Gott gehörenden Menschen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit warmer Anrede und klarer Satzführung. Die Wiederholung von „euch zu schreiben“ folgt der Wiederholung von γράφειν ... γράψαι im Griechischen. Die zeitliche Einleitung mit „als“ vermeidet es, den syntaktischen Bezug des Partizips unnötig als ausdrücklich konzessiv festzulegen.
