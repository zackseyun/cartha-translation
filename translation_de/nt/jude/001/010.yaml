  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: de
  text: Doch diese Leute schmähen alles, was sie nicht verstehen[a]. Was sie aber von Natur aus verstehen, wie die vernunftlosen Tiere, darin gehen sie zugrunde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über alles lästern, was sie nicht kennen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dadurch werden sie verdorben“ beziehungsweise „daran verderben sie“.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: diese Leute
  rationale: Der Ausdruck verweist auf die im Zusammenhang angeprangerten Eindringlinge. „Diese Leute“ ist im modernen Deutsch klar und vermeidet eine nicht ausdrücklich bezeichnete männliche Eingrenzung.
- source_word: βλασφημοῦσιν
  choice: schmähen
  rationale: Das Verb bezeichnet ehrverletzendes oder lästerndes Reden und ist nicht auf unmittelbare Gotteslästerung beschränkt. „Schmähen“ bewahrt die Schärfe und passt zu dem allgemeinen Objekt „alles“.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: alles, was sie nicht verstehen
  rationale: Im Gegensatz zum natürlichen, tierähnlichen Erfassen bezeichnet οἴδασιν hier mehr als bloße Kenntnis; „verstehen“ gibt den gedanklichen Kontrast natürlich wieder.
- source_word: φυσικῶς
  choice: von Natur aus
  rationale: Die Wendung bildet das Adverb direkt und idiomatisch ab. Der folgende Vergleich mit vernunftlosen Tieren lässt zugleich die Bedeutung instinktiven Erfassens erkennen.
- source_word: ἄλογα ζῷα
  choice: vernunftlose Tiere
  rationale: ἄλογα betont den Mangel an vernünftigem Erfassen. „Vernunftlose Tiere“ ist verständlich, würdig und weniger missverständlich als „irrationale Tiere“.
- source_word: ἐπίστανται
  choice: verstehen
  rationale: Das Verb bezeichnet hier das begrenzte natürliche Erfassen dieser Menschen. Die Wiederholung von „verstehen“ macht den Gegensatz zur ersten Satzhälfte deutlich.
- source_word: ἐν τούτοις
  choice: daran
  rationale: „Daran“ kann im Deutschen sowohl den Bereich als auch den Anlass oder das Mittel ihres Verderbens bezeichnen und bewahrt so die Offenheit von ἐν τούτοις.
- source_word: φθείρονται
  choice: richten sie sich zugrunde
  rationale: Die Form kann Verderben, moralische Zerrüttung oder Vernichtung ausdrücken und lässt eine mediale Nuance zu. Die Übersetzung stellt heraus, dass gerade ihr natürliches Erfassen zu ihrem eigenen Verderben führt, ohne bloß einen äußeren Vorgang zu behaupten.
theological_decisions:
- issue: Bedeutung von βλασφημέω bei einem nicht ausdrücklich göttlichen Objekt
  choice: „schmähen“
  alternative: „lästern“ oder „verleumden“
  rationale: Der Vers verurteilt herabsetzendes Reden über Dinge, welche die Betreffenden nicht verstehen. „Schmähen“ bewahrt den Ernst, ohne den Gegenstand unnötig auf Gott oder heilige Wirklichkeiten einzugrenzen.
- issue: Bedeutung und Diathese von φθείρονται
  choice: „daran richten sie sich zugrunde“
  alternative: „darin verderben sie“ oder „dadurch werden sie verdorben“
  rationale: Der Kontext verbindet moralische Verderbnis und endgültiges Verderben. Die gewählte Fassung lässt die selbstzerstörerische mediale Nuance hervortreten; die Fußnote hält die passive und stärker auf Korruption bezogene Deutung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt den scharfen Gegensatz zwischen fehlendem geistigem Verständnis und natürlichem, tierähnlichem Erfassen. „Doch“ markiert den kontrastiven Anschluss; die Wiederholung von „verstehen“ macht die Parallelstruktur für heutige Leser deutlich.
