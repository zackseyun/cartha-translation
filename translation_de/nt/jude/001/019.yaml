  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: de
  text: Das sind die, die Spaltungen verursachen[a], Menschen, die vom bloß natürlichen Leben bestimmt sind[b] und den Geist nicht haben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich absondern“; auch möglich: „die Spaltungen schaffen“ oder „die Trennungen vornehmen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „natürliche“ oder „seelische Menschen“; gemeint sind Menschen, die nicht vom Geist bestimmt sind.'
    reason: lexical_alternative
  - marker: c
    text: Im Zusammenhang ist wahrscheinlich der Heilige Geist gemeint; möglich ist auch ein allgemeineres Verständnis von „Geist“.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: Das sind die
  rationale: Die Wendung nimmt knapp und nachdrücklich auf die zuvor beschriebenen Eindringlinge Bezug und bewahrt die hinweisende Kraft des griechischen Pronomens.
- source_word: οἱ ἀποδιορίζοντες
  choice: die Spaltungen verursachen
  rationale: Das substantivierte Partizip kennzeichnet diese Menschen durch ihr trennendes Wirken. Im Zusammenhang ist die aktive Bedeutung wahrscheinlich; die mögliche reflexive Bedeutung wird in der Fußnote erhalten.
- source_word: ψυχικοί
  choice: Menschen, die nur ihren natürlichen Trieben folgen
  rationale: ψυχικοί bezeichnet hier Menschen, deren Leben auf die bloß natürliche, nicht vom Geist bestimmte Ebene beschränkt ist. Die Umschreibung ist im heutigen Deutsch verständlicher als das missverständliche „seelisch“ und bildet den Gegensatz zu πνεῦμα deutlich ab.
- source_word: πνεῦμα
  choice: den Geist
  rationale: Der unmittelbare Gegensatz zu ψυχικοί legt den Heiligen Geist nahe. Der bestimmte Artikel und die Großschreibung geben diese kontextuell wahrscheinlichste Deutung wieder; die sprachlich mögliche allgemeinere Wiedergabe bleibt in der Fußnote sichtbar.
- source_word: μὴ ἔχοντες
  choice: nicht haben
  rationale: Die finite deutsche Form gibt die Verneinung des Partizips natürlich und unmittelbar wieder.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: der Heilige Geist
  alternative: Geist im allgemeinen Sinn beziehungsweise menschlicher Geist
  rationale: Der Kontrast zwischen ψυχικοί und πνεῦμα spricht am stärksten dafür, dass Judas das Fehlen des Heiligen Geistes meint. Da πνεῦμα ohne Artikel steht und lexikalisch weiter verstanden werden kann, wird die Alternative nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Sinn von ψυχικοί
  choice: auf das bloß natürliche Leben und seine Triebe ausgerichtet
  alternative: ungeistlich / seelisch / natürlich
  rationale: Die Übersetzung soll weder Leiblichkeit an sich abwerten noch eine technische Dreiteilung des Menschen einführen. Sie bewahrt vielmehr den im Vers angelegten Gegensatz zwischen natürlicher Lebensausrichtung und dem Besitz des Geistes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung vermeidet das heute leicht missverständliche „seelisch“ und verwendet eine verständliche Umschreibung. Der Doppelpunkt bildet die appositionale Folge der griechischen Charakterisierungen ab. Alle echten lexikalischen und theologischen Alternativen werden in den Fußnoten bewahrt.
