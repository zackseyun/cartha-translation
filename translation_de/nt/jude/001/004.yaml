id: JUD.1.4
reference: Jude 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: de
  text: Denn einige Menschen haben sich unbemerkt eingeschlichen[a], die schon vor langer Zeit im Hinblick auf dieses Gericht verzeichnet worden sind[b] – Gottlose, die die Gnade unseres Gottes in Ausschweifung verkehren[c] und unseren einzigen Gebieter und Herrn, Jesus, den Messias, verleugnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben sich heimlich eingeschlichen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über die schon vor langer Zeit im Hinblick auf dieses Gericht geschrieben wurde“; möglicherweise auch: „die schon vorher für dieses Gericht bestimmt worden sind“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Zügellosigkeit“ beziehungsweise „schamlose Ausschweifung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: haben sich unbemerkt eingeschlichen
  rationale: Die Formulierung gibt das heimliche, unerlaubte Eindringen natürlich und präzise wieder.
- source_word: πάλαι προγεγραμμένοι
  choice: schon vor langer Zeit ... vorgemerkt worden
  rationale: „Vorgemerkt“ wahrt die mögliche Bedeutung einer früheren schriftlichen Erwähnung beziehungsweise Kennzeichnung, ohne ausdrücklich eine Vorherbestimmung zu behaupten.
- source_word: κρίμα
  choice: Gericht
  rationale: „Gericht“ bewahrt die Breite des griechischen Ausdrucks zwischen richterlichem Urteil und Verdammungsurteil.
- source_word: ἀσεβεῖς
  choice: Gottlose
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, denen Ehrfurcht vor Gott fehlt, und knüpft knapp an „Menschen“ an.
- source_word: χάριτα
  choice: Gnade
  rationale: „Gnade“ ist in diesem theologischen Zusammenhang die geläufige und sachgemäße Wiedergabe.
- source_word: μετατιθέντες εἰς
  choice: in ... verkehren
  rationale: Die Wendung drückt eine entstellende Umwandlung aus und ist im Deutschen idiomatisch.
- source_word: ἀσέλγειαν
  choice: Ausschweifung
  rationale: Der Begriff bezeichnet schamlose, zügellose Selbsthingabe, häufig mit sexueller Komponente, ohne darauf beschränkt zu sein.
- source_word: μόνον δεσπότην καὶ κύριον
  choice: einzigen Gebieter und Herrn
  rationale: Beide unterschiedlichen Hoheitstitel werden wiedergegeben; „Gebieter“ bringt die umfassende Autorität von δεσπότης zum Ausdruck.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, den Messias
  rationale: Χριστός wird als Titel verstanden und daher in natürlichem Deutsch mit „Messias“ wiedergegeben.
- source_word: ἀρνούμενοι
  choice: verleugnen
  rationale: „Verleugnen“ erfasst die persönliche Zurückweisung und Lossagung von Jesus.
theological_decisions:
- issue: Bedeutung von προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: frühere Kennzeichnung oder schriftliche Ankündigung im Blick auf dieses Gericht
  alternative: für diese Verurteilung vorherbestimmt
  rationale: Die Übersetzung lässt offen, ob eine frühere schriftliche Ankündigung oder eine vorherige Kennzeichnung gemeint ist, und behauptet keine stärkere Prädestinationsaussage, als der Wortlaut sicher trägt.
- issue: Bezug von „einzigen Gebieter und Herrn“
  choice: Beide Titel beziehen sich auf Jesus, den Messias
  alternative: „Gebieter“ bezeichnet Gott den Vater, „Herr“ dagegen Jesus
  rationale: Die eng verbundene griechische Wortgruppe und die nachgestellte Apposition Ἰησοῦν Χριστόν sprechen am natürlichsten dafür, beide Titel auf Jesus zu beziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Begründungsfunktion von γάρ oder die enge Charakterisierung der Eindringlinge aufzulösen. „Vorgemerkt“ erhält bewusst die lexikalische und theologische Spannung von προγεγραμμένοι.
