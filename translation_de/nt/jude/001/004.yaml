  to: Denn einige Menschen haben sich unbemerkt eingeschlichen[a], die schon vor langer Zeit im Hinblick auf dieses Gericht verzeichnet worden sind[b] – Gottlose, die die Gnade unseres Gottes in Ausschweifung verkehren[c] und unseren einzigen Gebieter und Herrn, Jesus, den Messias, verleugnen.
  rationale: Die Revision ersetzt das missverständlicher administrative „vorgemerkt“ durch „verzeichnet“ und führt die Charakterisierung der Eindringlinge wieder in einer zusammenhängenden Relativkonstruktion. Damit bleibt offen, ob προγεγραμμένοι eine frühere schriftliche Erwähnung oder eine vorherige Kennzeichnung bezeichnet; die stärkere Deutung als Vorherbestimmung bleibt ausschließlich als vorsichtig markierte Alternative in der Fußnote.
