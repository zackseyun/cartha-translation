id: JUD.1.24
reference: Jude 1:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: de
  text: Dem aber, der euch vor dem Straucheln[a] bewahren und euch mit Jubel untadelig[b] vor seine Herrlichkeit[c] stellen kann,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Fallen“. Das griechische Wort bezeichnet jemanden, der nicht strauchelt oder fällt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „makellos“. Das griechische Wort kann auch an ein Opfer ohne Makel erinnern.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „vor seine Herrlichkeit“; sinngemäß ist auch „in die Gegenwart seiner Herrlichkeit“ möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: Dem ..., der ... kann
  rationale: Die substantivierte Partizipialkonstruktion im Dativ eröffnet die in Vers 25 fortgesetzte Doxologie. Der deutsche Relativsatz ist natürlich und bewahrt sowohl den Dativ als auch den Gedanken des Vermögens.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen milden Übergang zur abschließenden Doxologie. „Aber“ gibt die verbindende beziehungsweise leicht absetzende Funktion wieder, ohne einen zeitlichen Sinn einzuführen.
- source_word: φυλάξαι
  choice: bewahren
  rationale: φυλάσσω bedeutet bewahren, behüten oder schützen. „Bewahren“ passt idiomatisch zur Ergänzung „vor dem Straucheln“.
- source_word: ὑμᾶς
  choice: euch
  rationale: Direktes Objekt in der zweiten Person Plural.
- source_word: ἀπταίστους
  choice: vor dem Straucheln
  rationale: Das Adjektiv bezeichnet das Nichtstraucheln beziehungsweise Nichtfallen. Die deutsche Konstruktion „vor dem Straucheln bewahren“ gibt den prädikativen Sinn natürlich wieder und erhält das Bild, ohne es auf alltägliche Verfehlungen oder endgültigen Abfall festzulegen.
- source_word: καὶ στῆσαι
  choice: und ... stellen
  rationale: Das transitive στῆσαι bedeutet hier, jemanden hinstellen beziehungsweise zum Stehen bringen. „Stellen“ bewahrt dieses Bild enger als das ebenfalls mögliche „darstellen“ oder „vorführen“.
- source_word: κατενώπιον
  choice: vor
  rationale: Die Präposition bezeichnet eine Stellung vor beziehungsweise in der Gegenwart von jemandem oder etwas.
- source_word: τῆς δόξης αὐτοῦ
  choice: seine Herrlichkeit
  rationale: Die Formulierung gibt δόξα ausdrücklich als „Herrlichkeit“ wieder und erweitert sie nicht deutend zu „herrlicher Gegenwart“.
- source_word: ἀμώμους
  choice: untadelig
  rationale: ἀμώμος kann moralische Tadellosigkeit und kultische Makellosigkeit bezeichnen. „Untadelig“ ist verständlich und würdevoll; eine Fußnote hält die Bildwelt des Makellosen offen.
- source_word: ἐν ἀγαλλιάσει
  choice: mit Jubel
  rationale: ἀγαλλίασις bezeichnet überschwängliche Freude oder Jubel. Die abgesetzte Stellung erhält die knappe griechische Formulierung und vermeidet es, ihren syntaktischen Bezug unnötig festzulegen.
theological_decisions:
- issue: Ob τῆς δόξης αὐτοῦ als „seine Herrlichkeit“ oder deutend als „seine herrliche Gegenwart“ wiederzugeben ist
  choice: seine Herrlichkeit
  alternative: seine herrliche Gegenwart
  rationale: Der griechische Text nennt ausdrücklich seine Herrlichkeit. Die engere Wiedergabe wahrt das theologische Gewicht des Ausdrucks, ohne die darin möglicherweise mitgedachte göttliche Gegenwart in den Text einzubauen.
- issue: Ob ἀπταίστους auf moralisches Straucheln oder endgültiges Fallen beziehungsweise Abfallen festgelegt werden soll
  choice: vor dem Straucheln
  alternative: vor dem Fallen
  rationale: „Straucheln“ erhält die Grundmetapher und lässt offen, welche Reichweite die Bewahrung im Zusammenhang genau hat.
- issue: Wessen Jubel mit ἐν ἀγαλλιάσει gemeint ist und worauf die Wendung syntaktisch zu beziehen ist
  choice: mit Jubel, typografisch abgesetzt
  alternative: euch jubelnd vor seine Herrlichkeit stellen
  rationale: Die knappe Präpositionalwendung kann auf die freudige Präsentation beziehungsweise auf die dabei Beteiligten bezogen werden. Die Übersetzung legt den Träger des Jubels nicht stärker fest als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Auftakt der bis Vers 25 reichenden Doxologie bewusst offen. Die Gedankenstriche um „mit Jubel“ machen die knappe Schlusswendung lesbar und bewahren zugleich ihre mögliche syntaktische Mehrdeutigkeit.
