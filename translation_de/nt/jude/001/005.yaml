id: JUD.1.5
reference: Jude 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: de
  text: 'Ich will euch aber daran erinnern, obwohl ihr dies alles ein für alle Mal wisst: Jesus[a] rettete ein Volk aus dem Land Ägypten und vernichtete danach diejenigen, die nicht glaubten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben statt »Jesus«: »der Herr« oder »Gott«.'
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι
  choice: daran erinnern
  rationale: Gibt den Aoristinfinitiv in Verbindung mit βούλομαι natürlich wieder und bezeichnet das erneute Vor-Augen-Führen bereits bekannter Inhalte.
- source_word: βούλομαι
  choice: Ich will
  rationale: Entspricht der in der ersten Person ausgedrückten Absicht und klingt im heutigen Standarddeutsch klar und würdig.
- source_word: δὲ
  choice: aber
  rationale: Bewahrt die leichte weiterführende beziehungsweise kontrastierende Verknüpfung mit dem vorausgehenden Zusammenhang.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: obwohl ihr dies alles ein für alle Mal wisst
  rationale: Versteht das Partizip konzessiv und bezieht πάντα kontextgemäß auf die gemeinsam bekannten Sachverhalte; ἅπαξ wird mit dem Wissen verbunden, ohne die Formulierung als absolutes Allwissen erscheinen zu lassen.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Übersetzt unmittelbar die Lesart des vorgegebenen SBLGNT-Textes und bewahrt deren starke christologische Aussage.
- source_word: λαὸν
  choice: ein Volk
  rationale: Gibt das artikellose Substantiv sachgerecht wieder und bezeichnet Israel kollektiv, ohne im Deutschen unnötig stärker zu bestimmen.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: aus dem Land Ägypten
  rationale: Bewahrt die biblische Exodus-Sprache und ist zugleich natürliches modernes Deutsch.
- source_word: σώσας
  choice: rettete
  rationale: Die finite Koordination löst das griechische vorzeitige Partizip idiomatisch auf; die Abfolge mit danach macht die zeitliche Priorität eindeutig.
- source_word: τὸ δεύτερον
  choice: danach
  rationale: Gibt die idiomatische Bedeutung als nachfolgende Handlung wieder, ohne das missverständliche wörtliche 'zum zweiten Mal' zu erzwingen.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: diejenigen, die nicht glaubten
  rationale: Gibt die substantivierte Negativpartizipialkonstruktion direkt und verständlich wieder.
- source_word: ἀπώλεσεν
  choice: vernichtete
  rationale: Bewahrt die Härte und Endgültigkeit des im Kontext beschriebenen göttlichen Gerichts.
theological_decisions:
- issue: Christologisches Subjekt beim Exodus
  choice: Jesus im Haupttext
  alternative: der Herr; Gott
  rationale: Der vorgegebene griechische Text liest Ἰησοῦς. Diese Lesart wird trotz ihrer theologischen Spannung direkt wiedergegeben; wichtige abweichende Lesarten erscheinen in der Fußnote.
- issue: Verhältnis von Rettung und Gericht
  choice: rettete … vernichtete danach jedoch
  alternative: nachdem er gerettet hatte, vernichtete er danach
  rationale: Die koordinierte deutsche Form wahrt sowohl die zeitliche Abfolge als auch den scharfen Gegensatz zwischen der Rettung des Volkes und dem Gericht über die Ungläubigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Doppelpunkt entlastet den langen Satz; die finite Wiedergabe des Partizips ist im Deutschen natürlicher, ohne die zeitliche Reihenfolge zu verändern. Die Fußnotenmarke steht unmittelbar bei der textkritisch betroffenen Lesart.
