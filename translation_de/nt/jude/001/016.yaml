source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: de
  text: Diese Leute sind Nörgler, die mit ihrem Los unzufrieden sind und nach ihren eigenen Begierden leben[a]. Ihr Mund redet großspurig[b], und sie umschmeicheln Menschen, um sich Vorteile zu verschaffen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie folgen ihren eigenen Wünschen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ihr Mund redet Hochtrabendes«; gemeint sind anmaßende oder prahlerische Worte.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Sie bewundern Gesichter um eines Vorteils willen«; die Wendung kann auch bedeuten, Menschen aus Eigennutz bevorzugt zu behandeln.'
    reason: idiom_explanation
lexical_decisions:
- source_word: γογγυσταί
  choice: Nörgler
  rationale: Das Substantiv bezeichnet Menschen, die fortwährend murrend klagen. »Nörgler« ist gegenwärtiges, verständliches Deutsch und gibt die charakteristische Unzufriedenheit knapp wieder.
- source_word: μεμψίμοιροι
  choice: mit ihrem Los unzufrieden
  rationale: Das seltene Wort bezeichnet Menschen, die ihr Los beklagen. Die Umschreibung wahrt diese spezifische Bedeutung und vermeidet eine bloße Wiederholung von »Nörgler«.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: Sie leben nach ihren eigenen Begierden
  rationale: πορεύομαι bezeichnet hier bildlich den Lebenswandel. »Begierden« bewahrt im polemischen Zusammenhang die negative moralische Färbung von ἐπιθυμίαι, ohne sie auf Sexualität zu verengen.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: ihr Mund führt hochtrabende Reden
  rationale: Die griechische Singularform »ihr Mund« bleibt erhalten. ὑπέρογκα bezeichnet aufgeblähte, anmaßende Äußerungen; »hochtrabende Reden« ist idiomatisch und bewahrt das Bild übersteigerter Sprache.
- source_word: θαυμάζοντες πρόσωπα
  choice: sie schmeicheln anderen
  rationale: Die Wendung bedeutet wörtlich, Gesichter zu bewundern, und bezeichnet hier eigennützige Gunstbezeugung. In Verbindung mit ὠφελείας χάριν bringt »schmeicheln« das konkrete Verhalten natürlich zum Ausdruck.
- source_word: ὠφελείας χάριν
  choice: um sich einen Vorteil zu verschaffen
  rationale: Die Konstruktion nennt den Zweck beziehungsweise Beweggrund. Die gewählte Formulierung macht den eigennützigen Nutzen deutlich, ohne ihn unnötig auf finanziellen Gewinn zu beschränken.
- source_word: οὗτοί εἰσιν
  choice: Diese Leute sind
  rationale: »Diese Leute« benennt die gemeinte Personengruppe im Deutschen klarer als das isolierte »Diese« und bewahrt den hinweisenden Charakter.
theological_decisions:
- issue: Moralische Tragweite von ἐπιθυμίαι
  choice: Begierden im Haupttext
  alternative: Wünsche oder Gelüste
  rationale: Das Wort kann allgemein starke Wünsche bezeichnen, trägt hier aber durch den polemischen Kontext eine negative moralische Wertung. »Begierden« wahrt diese Breite und beschränkt die Aussage nicht auf sexuelle Lust.
- issue: Idiomhafte Bedeutung von θαυμάζοντες πρόσωπα
  choice: anderen schmeicheln
  alternative: 'Menschen bevorzugen beziehungsweise wörtlich: Gesichter bewundern'
  rationale: Die griechische Wendung beschreibt parteiliche Gunst gegenüber Personen. Da ausdrücklich der eigene Vorteil als Motiv folgt, gibt »schmeicheln« den situativen Sinn treffend wieder; eine Fußnote bewahrt die weitere idiomatische Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Anklagen bleiben prägnant; idiomatische griechische Wendungen werden verständlich wiedergegeben, während Fußnoten wörtlichere Formen und echte Bedeutungsbreite dokumentieren.
