  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: de
  text: Bewahrt euch selbst in der Liebe Gottes[a] und wartet auf die Barmherzigkeit unseres Herrn Jesus, des Messias, zum ewigen Leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Liebe Gottes“ kann sowohl Gottes Liebe zu euch als auch eure Liebe zu Gott bezeichnen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „für das ewige Leben“; die griechische Präposition kann die Zielrichtung oder den Bezug der erwarteten Barmherzigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: Bewahrt euch
  rationale: Der Aorist Aktiv Imperativ in der zweiten Person Plural wird als direkte Aufforderung wiedergegeben; die reflexive Form entspricht ἑαυτούς.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: in der Liebe Gottes
  rationale: Die Formulierung bewahrt den mehrdeutigen Genitiv θεοῦ und legt nicht fest, ob Gottes Liebe zu den Glaubenden oder deren Liebe zu Gott gemeint ist.
- source_word: προσδεχόμενοι
  choice: während ihr … wartet
  rationale: Das präsentische Partizip bezeichnet eine fortdauernde, die Aufforderung begleitende Haltung erwartungsvollen Wartens.
- source_word: τὸ ἔλεος
  choice: die Barmherzigkeit
  rationale: Dies ist die natürliche und theologisch sachgemäße deutsche Entsprechung für ἔλεος.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: κύριος wird im neutestamentlichen Titelgebrauch mit „Herr“ wiedergegeben.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός wird seiner Titelfunktion entsprechend als „Messias“ übersetzt; die Apposition ist im Deutschen idiomatisch.
- source_word: εἰς ζωὴν αἰώνιον
  choice: die zum ewigen Leben führt
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis; die Formulierung macht den Bezug zur Barmherzigkeit in natürlichem modernem Deutsch deutlich, ohne ihn weiter zu bestimmen.
theological_decisions:
- issue: Bedeutung des Genitivs in ἀγάπῃ θεοῦ
  choice: Die Mehrdeutigkeit wird mit „Liebe Gottes“ bewahrt.
  alternative: „Gottes Liebe“ oder „eure Liebe zu Gott“
  rationale: Der griechische Genitiv kann sowohl subjektiv als auch objektiv verstanden werden; der Kontext zwingt nicht zu einer Festlegung.
- issue: Wiedergabe von Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: Χριστός trägt hier weiterhin Titelfunktion; „Messias“ übersetzt den Titel, statt ihn lediglich zu transliterieren.
- issue: Bezug von εἰς ζωὴν αἰώνιον
  choice: als Zielrichtung der erwarteten Barmherzigkeit wiedergegeben
  alternative: „für das ewige Leben“ oder „bis zum ewigen Leben“
  rationale: Die Präposition εἰς lässt hinsichtlich der genauen Nuance von Ziel, Ergebnis oder Hinführung Spielraum; die Hauptfassung gibt die wahrscheinlichste syntaktische Verbindung verständlich wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bewahrt euch“ erhält die knappe Imperativkraft; „während ihr … wartet“ macht die begleitende Funktion des Partizips verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
