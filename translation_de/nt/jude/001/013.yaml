id: JUD.1.13
reference: Jude 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: de
  text: wilde Wogen des Meeres, die ihre eigenen Schändlichkeiten ausschäumen[a]; umherirrende Sterne, denen das Dunkel der Finsternis[b] auf ewig vorbehalten ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihre eigene Schande ausschäumen“ oder „die ihre eigenen schändlichen Taten hervorschäumen“. Der griechische Plural kann die Schande selbst oder schändliche Handlungen bezeichnen, durch die sie offenbar wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das tiefste Dunkel“ beziehungsweise „die Schwärze der Finsternis“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: wilde Wogen des Meeres
  rationale: „Wogen“ gibt κύματα bildkräftig und in gehobenem, aber verständlichem Deutsch wieder; ἄγρια und der Genitiv θαλάσσης bleiben unmittelbar erhalten.
- source_word: ἐπαφρίζοντα
  choice: ausschäumen
  rationale: Das Verb bewahrt das anschauliche Bild des hervortretenden Schaums sowie den fortdauernden Charakter des griechischen Präsenspartizips.
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: ihre eigenen Schändlichkeiten
  rationale: „Schändlichkeiten“ wahrt den auffälligen Plural und kann sowohl Beschämendes als auch schändliche Handlungen bezeichnen; „ihre eigenen“ gibt ἑαυτῶν ausdrücklich wieder.
- source_word: ἀστέρες πλανῆται
  choice: umherirrende Sterne
  rationale: Die Formulierung erhält die antike Vorstellung wandernder beziehungsweise vom Weg abgekommener Himmelskörper, ohne den modernen astronomischen Fachbegriff „Planeten“ einzutragen.
- source_word: οἷς
  choice: denen
  rationale: Das Relativpronomen bezieht sich durch das Bild der Sterne auf die zuvor beschriebenen Personen; „denen“ bewahrt diesen persönlichen Bezug.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: das Dunkel der Finsternis
  rationale: Die genitivische Verdichtung des Griechischen bleibt erhalten. „Dunkel“ gibt ζόφος als tiefes, düsteres Dunkel wieder, während „Finsternis“ σκότος entspricht.
- source_word: εἰς αἰῶνα
  choice: auf ewig
  rationale: Im Gerichtskontext bezeichnet die Wendung eine unbegrenzte Dauer; „auf ewig“ ist würdig, natürlich und lässt die Aussage in ihrer vollen Schärfe stehen.
- source_word: τετήρηται
  choice: vorbehalten ist
  rationale: 'Die Formulierung gibt den resultativen Zustand des Perfekt Passiv wieder: Das Dunkel ist für sie festgehalten beziehungsweise bestimmt. Im Deutschen passt „vorbehalten“ natürlich zum Gerichtskontext.'
theological_decisions:
- issue: Dauer der Gerichtsverwahrung in εἰς αἰῶνα
  choice: auf ewig
  alternative: für das Zeitalter
  rationale: Im vorliegenden Gerichtswort bezeichnet die idiomatische Wendung am natürlichsten eine fortdauernde, unbegrenzte Verwahrung. Die Übersetzung fügt keine nähere Lehrbestimmung hinzu.
- issue: Personaler Bezug von οἷς trotz der Sternenmetapher
  choice: denen
  alternative: für die
  rationale: Die Sterne stehen für Menschen; der personale Relativanschluss macht dies kenntlich, ohne die Metapher aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Bildsprache. „Wogen“, „ausschäumen“ und „Dunkel der Finsternis“ halten den poetisch-prophetischen Ton, bleiben jedoch für heutige Leser verständlich. Die Satzform bleibt entsprechend dem vorgelegten Versfragment nominal und schließt an den vorausgehenden Kontext an.
