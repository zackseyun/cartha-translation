source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: de
  text: Andere aber rettet, indem ihr sie aus dem Feuer reißt[a]; anderen aber erweist Erbarmen mit Furcht[b], wobei ihr sogar das vom Fleisch befleckte Untergewand hasst[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild kann auf das bevorstehende Gericht oder auf schwere geistliche Gefahr hinweisen.
    reason: alternative_reading
  - marker: b
    text: „Mit Furcht“ kann ehrfürchtige Furcht vor Gott oder vorsichtige Wachsamkeit meinen, damit man nicht selbst verdorben wird.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das von der sündigen Natur befleckte Gewand“. Wörtlich steht im Griechischen „Fleisch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: rettet
  rationale: Der Imperativ wird direkt wiedergegeben; „retten“ bewahrt sowohl das geistliche Gewicht als auch den konkreten Rettungscharakter des Bildes.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: indem ihr sie aus dem Feuer reißt
  rationale: Das Partizip bezeichnet die Art und Weise des Rettens. „Reißen“ vermittelt die Dringlichkeit und Kraft von ἁρπάζω.
- source_word: ἐλεᾶτε
  choice: habt Erbarmen
  rationale: Eine natürliche, würdige Wiedergabe des Imperativs, die den persönlichen Vollzug der Barmherzigkeit ausdrückt.
- source_word: ἐν φόβῳ
  choice: in Furcht
  rationale: Die knappe Formulierung erhält die mögliche Spannung zwischen Gottesfurcht und vorsichtiger Furcht vor eigener Verunreinigung.
- source_word: μισοῦντες
  choice: wobei ihr … hasst
  rationale: „Hassen“ gibt die moralische Schärfe des griechischen Partizips unverblümt wieder; die Konstruktion zeigt die begleitende Haltung beim Erbarmen.
- source_word: χιτῶνα
  choice: Untergewand
  rationale: χιτών bezeichnet gewöhnlich das unmittelbar am Körper getragene Kleidungsstück. „Untergewand“ ist im Deutschen verständlich und genauer als das allgemeine „Gewand“.
- source_word: ἐσπιλωμένον
  choice: befleckt
  rationale: „Befleckt“ wahrt zugleich das konkrete Kleidungsbild und den übertragenen Gedanken moralischer Verunreinigung.
- source_word: σάρξ
  choice: Fleisch
  rationale: Die wörtliche Wiedergabe bewahrt die Metapher und vermeidet, sie durch die stärker deutende Formulierung „sündige Natur“ festzulegen.
theological_decisions:
- issue: Bedeutung des Feuers im Rettungsbild
  choice: Das Bild „aus dem Feuer“ bleibt im Haupttext ohne nähere Bestimmung stehen.
  alternative: Das Feuer ausdrücklich als kommendes Gericht oder als gegenwärtige geistliche Gefahr deuten.
  rationale: Der griechische Text nennt den Bezugspunkt des Feuers nicht ausdrücklich; die offene Bildsprache bewahrt die theologische Spannung.
- issue: Bedeutung von ἐν φόβῳ
  choice: „in Furcht“ ohne Festlegung des Gegenstands der Furcht
  alternative: „in Gottesfurcht“ oder „mit Vorsicht“
  rationale: 'Beides ist im Zusammenhang möglich: ehrfürchtige Furcht vor Gott und Vorsicht angesichts der Gefahr, selbst verunreinigt zu werden.'
- issue: Bedeutung von σάρξ
  choice: „Fleisch“
  alternative: „sündige Natur“
  rationale: Obwohl moralische Verunreinigung gemeint ist, erhält „Fleisch“ das Bild und vermeidet eine systematisierende Auslegung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Gruppen („Andere … mit anderen …“) bleiben erkennbar; die Bildsprache von Feuer, Fleisch und beflecktem Kleidungsstück wird nicht aufgelöst. „Untergewand“ ist sachlich präzise, ohne unnötig altertümlich zu wirken.
