    issue: Die Schlussformel ist als Imperativ statt als Wunsch formuliert.
    rationale: ἐπιτιμήσαι ist ein Aoristoptativ. Die deutsche Form »Der Herr weise dich zurecht!« ist formal ein Imperativ; »Möge der Herr dich zurechtweisen!« bewahrt die invokative Wunschform ohne zusätzliche theologische Deutung.
