    issue: »Verhandelte« ist für διελέγετο potenziell missverständlich.
    rationale: Das Verb bezeichnet hier eine andauernde verbale Auseinandersetzung. Im heutigen Deutsch kann »verhandeln« eine Verhandlung im Sinn von Aushandeln nahelegen; »diskutieren« ist neutraler und treffender.
