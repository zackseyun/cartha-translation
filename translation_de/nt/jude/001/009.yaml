reference: Jude 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: de
  text: 'Der Erzengel Michael aber stritt mit dem Teufel und diskutierte mit ihm über den Leichnam des Mose. Dabei wagte er nicht, ein schmähendes Urteil über ihn zu fällen[a], sondern sagte: »Möge der Herr dich zurechtweisen!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditioneller: »wagte er nicht, eine lästernde Anklage gegen ihn vorzubringen«.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung erinnert an Sacharja 3,2, wo der HERR Satan zurechtweist.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: Erzengel
  rationale: Die etablierte und allgemein verständliche deutsche Wiedergabe des Titels.
- source_word: διαβόλῳ
  choice: dem Teufel
  rationale: Hier bezeichnet διάβολος den persönlichen übernatürlichen Widersacher; die traditionelle Titelbezeichnung ist im Deutschen natürlich und eindeutig.
- source_word: διακρινόμενος
  choice: stritt
  rationale: Das Partizip bezeichnet hier ein widerstreitendes Auseinandersetzen und wird zusammen mit dem folgenden Verb als fortlaufender Vorgang wiedergegeben.
- source_word: διελέγετο
  choice: verhandelte mit ihm
  rationale: Das Imperfekt beschreibt eine andauernde mündliche Auseinandersetzung. »Verhandelte« bewahrt gegenüber »stritt« die Eigenständigkeit des zweiten griechischen Verbs und kann hier eine kontroverse Erörterung ausdrücken.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: über den Leichnam des Mose
  rationale: σῶμα bedeutet grundsätzlich »Körper/Leib«; im Zusammenhang mit Mose ist der tote Körper gemeint. »Leichnam« ist im Deutschen konkret, würdig und idiomatisch.
- source_word: οὐκ ἐτόλμησεν
  choice: wagte er nicht
  rationale: Direkte und natürliche Wiedergabe von τολμάω, ohne ein zusätzliches Motiv zu unterstellen.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: ein schmähendes Urteil über ihn zu fällen
  rationale: Die schwierige Genitivverbindung wird als Bezeichnung der Art des Urteils verstanden. »Schmähend« hält den Bezug auf verleumderische bzw. lästernde Rede offen, während »Urteil fällen« den forensischen Zug wahrt.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Der Herr weise dich zurecht!
  rationale: Der Aorist Optativ formuliert einen Wunsch bzw. eine Anrufung. Der deutsche Konjunktiv gebe die Kraft der Aussage würdig und knapp wieder.
- source_word: κύριος
  choice: der Herr
  rationale: Entspricht der üblichen Wiedergabe von κύριος und dem Anklang an Sacharja 3,2.
theological_decisions:
- issue: Michaels Zurückhaltung gegenüber dem Teufel
  choice: Michael fällt nicht selbst ein schmähendes Verdammungsurteil, sondern ruft den Herrn zur Zurechtweisung an.
  alternative: Michael unterlässt entweder ein lästerliches Urteil oder jede beschimpfende Anklage als solche.
  rationale: 'Die syntaktisch umstrittene Wendung κρίσιν … βλασφημίας wird nicht dogmatisch überbestimmt. Der klare Gegensatz bleibt erhalten: Michael spricht nicht aus eigener Vollmacht das betreffende Urteil, sondern verweist auf die Zurechtweisung durch den Herrn.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. »Leichnam des Mose« ist natürlicher als eine mechanische Nachbildung der griechischen Genitivstellung. Die doppelte Beschreibung des Streits bleibt erhalten, ohne im Deutschen unnötig tautologisch zu wirken; die umstrittene Wendung zu Urteil und Schmähung wird samt Alternative in der Fußnote bewahrt.
