    issue: Unnatürliche Satzstellung
    rationale: Die Voranstellung von „mit denen“ vor „habt Erbarmen“ ist nicht falsch, aber weniger flüssig als die reguläre Wortstellung im modernen Standarddeutsch.
  - severity: low
    issue: Fußnotenalternative „die streiten“
    rationale: Als mögliche Nuance von διακρινομένους ist ein konfliktbezogener Sinn möglich; „die im Streit sind“ klingt im Deutschen idiomatischer als „die streiten“.
