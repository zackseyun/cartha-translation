  yaml_path: translation/nt/jude/001/022.yaml
  text: And have mercy on those who are doubting,[a]
translation:
  language: de
  text: Und habt Erbarmen mit denen, die zweifeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die schwanken«; möglicherweise: »die im Streit sind«. Das griechische Partizip lässt in diesem Zusammenhang mehrere Bedeutungsnuancen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Konjunktion verbindet diese Aufforderung mit den vorausgehenden und folgenden Ermahnungen.
- source_word: οὓς μὲν
  choice: mit denen
  rationale: Das Relativpronomen bezeichnet die erste Gruppe einer Reihe. Die Konstruktion mit μέν wird im Deutschen natürlich wiedergegeben, ohne ein schwerfälliges »einerseits« einzufügen.
- source_word: ἐλεᾶτε
  choice: habt Erbarmen
  rationale: Der Imperativ fordert zu einer barmherzigen, mitfühlenden Haltung und Handlung gegenüber dieser Gruppe auf; »Erbarmen haben mit« ist klar und würdevoll.
- source_word: διακρινομένους
  choice: die zweifeln
  rationale: Das Partizip kann hier Zweifeln, Schwanken oder Streiten bezeichnen. Im pastoralen Zusammenhang ist »zweifeln« eine gut begründete Hauptwiedergabe; die echte Bedeutungsbreite bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von διακρινομένους im Zusammenhang verschiedener seelsorgerlicher Reaktionen
  choice: die zweifeln
  alternative: die schwanken; die streiten
  rationale: Die Wiedergabe versteht diese Menschen als innerlich unsicher und damit als Empfänger von Erbarmen. Da das griechische Wort auch Schwanken oder Streiten bezeichnen kann, wird diese Spannung nicht dogmatisch aufgelöst, sondern in der Fußnote offengelegt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Stellung »mit denen … habt Erbarmen« hält den Bezug des Verbs klar und bewahrt den auffordernden Charakter.
