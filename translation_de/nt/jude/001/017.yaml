id: JUD.1.17
reference: Jude 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: de
  text: Ihr aber, Geliebte, erinnert euch an die Worte, die zuvor von den Aposteln unseres Herrn Jesus, des Messias[a], gesprochen wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unseres Herrn Jesus Christus.'
    reason: Etablierte traditionelle Wiedergabe von Ἰησοῦ Χριστοῦ; „Messias“ im Haupttext gibt den Titelcharakter von Χριστός wieder.
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Ihr aber
  rationale: Gibt sowohl das betonte Personalpronomen als auch den Kontrast zu den zuvor beschriebenen Personen knapp und natürlich wieder.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Bewahrt die herzliche Anrede und den würdevollen Briefstil; zugleich bleibt der Gedanke des Geliebtseins erhalten.
- source_word: μνήσθητε
  choice: erinnert euch
  rationale: Entspricht dem direkten Imperativ und ist im modernen Standarddeutsch die natürliche Formulierung für das bewusste Zurückrufen früherer Unterweisung.
- source_word: τῶν ῥημάτων
  choice: an die Worte
  rationale: Der deutsche Ausdruck „sich an die Worte erinnern“ gibt die konkrete Bezugnahme auf frühere Äußerungen klar wieder.
- source_word: τῶν προειρημένων
  choice: die zuvor … gesprochen wurden
  rationale: Bewahrt den zeitlichen Sinn des Partizips, ohne durch „vorhergesagt“ vorschnell ausschließlich eine prophetische Vorhersage anzunehmen.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: von den Aposteln
  rationale: Gibt die im Passivsatz ausdrücklich genannte handelnde Personengruppe genau und in etablierter neutestamentlicher Terminologie wieder.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: Bewahrt die genitivische Zugehörigkeitsbeziehung und die etablierte Anrede κύριος als „Herr“.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: „Jesus Christus“ ist im Deutschen die natürliche und etablierte Wiedergabe der griechischen Verbindung; die ausdrücklich titelbezogene Wiedergabe mit „Messias“ bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Christus
  alternative: Messias
  rationale: Im modernen deutschen Sprachgebrauch ist „Jesus Christus“ die feste, verständliche Form und lässt den Titelcharakter weiterhin erkennen. „Messias“ macht die Bedeutung des griechischen Titels deutlicher und wird deshalb als echte Übersetzungsalternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung „Ihr aber“ erhält den nachdrücklichen Kontrast des griechischen Satzanfangs. Die Passivform und „zuvor“ vermeiden eine unnötige Festlegung darauf, ob die apostolischen Worte nur früher ausgesprochen oder ausdrücklich prophetisch vorhergesagt wurden.
