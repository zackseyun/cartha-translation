  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: de
  text: Mögen euch Barmherzigkeit und Frieden und Liebe reichlich zuteilwerden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mögen sich Barmherzigkeit und Frieden und Liebe für euch mehren“; wörtlich: „vermehrt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: Die übliche und in diesem Segensgruß sachlich passende Wiedergabe; sie bewahrt sowohl den helfenden als auch den beziehungsbezogenen Sinn.
- source_word: ὑμῖν
  choice: euch … zuteilwerden
  rationale: Der Dativ bezeichnet die Empfänger des Segenswunsches. Die deutsche Konstruktion mit „zuteilwerden“ gibt diese Richtung natürlich wieder.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Die etablierte Wiedergabe bewahrt die umfassende persönliche und heilsgeschichtliche Bedeutung, ohne sie auszuweiten.
- source_word: ἀγάπη
  choice: Liebe
  rationale: Die klare, moderne Standardentsprechung; sie lässt im knappen Gruß offen, wessen Liebe beziehungsweise welche Beziehungsrichtung besonders gemeint ist.
- source_word: πληθυνθείη
  choice: mögen … immer reichlicher zuteilwerden
  rationale: Der Optativ wird als Segenswunsch mit „mögen“ ausgedrückt. „Immer reichlicher“ vermittelt das Bild der Vermehrung in natürlichem Deutsch, während „zuteilwerden“ den passiven Empfängerbezug erhält.
- source_word: καὶ … καὶ … καὶ
  choice: und … und … und
  rationale: Das wiederholte „und“ bewahrt den feierlichen, rhythmischen Aufbau des griechischen Segensgrußes.
theological_decisions:
- issue: Wiedergabe des Optativs in der Segensformel
  choice: Barmherzigkeit und Frieden und Liebe mögen euch immer reichlicher zuteilwerden.
  alternative: Barmherzigkeit, Frieden und Liebe mögen sich bei euch mehren.
  rationale: „Mögen“ macht den Wunschcharakter ausdrücklich. Die gewählte Form vermeidet den möglichen Eindruck, die drei Gaben vermehrten sich aus eigener Kraft, und erhält zugleich die passive Ausrichtung des griechischen Verbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konjunktion ist bewusst beibehalten; die etwas gehobene Wendung „zuteilwerden“ passt zum Charakter eines apostolischen Segensgrußes.
