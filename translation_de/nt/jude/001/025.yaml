source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: de
  text: dem einzigen Gott, unserem Retter, sei durch Jesus, den Messias, unseren Herrn, Herrlichkeit, Majestät, Macht und Vollmacht vor aller Zeit, jetzt und für alle Ewigkeit.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „vor jedem Zeitalter und jetzt und für alle Zeitalter“.'
    reason: Die Fußnote bewahrt die Bild- und Ausdrucksweise von αἰών in beiden griechischen Zeitangaben.
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  choice: dem einzigen Gott, unserem Retter
  rationale: Der Dativ gehört zur ergänzten doxologischen Aussage „sei“. „Einzigen“ wahrt die Exklusivität von μόνος; „Retter“ ist die geläufige und kontextgemäße Wiedergabe von σωτήρ.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: durch Jesus, den Messias, unseren Herrn
  rationale: διά mit Genitiv bezeichnet hier Vermittlung. Χριστός wird als Titel mit „Messias“ wiedergegeben; die Appositionen sind im Deutschen durch Kommas natürlich und eindeutig.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: Herrlichkeit, Majestät, Macht und Vollmacht
  rationale: „Herrlichkeit“ und „Majestät“ entsprechen dem feierlichen doxologischen Register. „Macht“ gibt κράτος als wirksame Stärke bzw. Herrschaftsmacht wieder, während „Vollmacht“ den Aspekt rechtmäßiger Autorität in ἐξουσία unterscheidbar hält.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: vor aller Zeit
  rationale: Die idiomatische deutsche Formulierung gibt den zeitlichen Sinn klar wieder, ohne die griechische Singularform „vor jedem Zeitalter“ hölzern nachzubilden.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: jetzt und in alle Ewigkeit
  rationale: Die natürliche deutsche Wendung bewahrt den zeitlichen Bogen der Doxologie; die wörtlichere Form wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bezug der Vermittlungsformel in der Doxologie
  choice: Das Lob gilt dem einzigen Gott, unserem Retter, und wird durch Jesus, den Messias und unseren Herrn, ausgesprochen.
  alternative: Die Präpositionalphrase könnte lockerer mit der gesamten Doxologie verbunden werden.
  rationale: Die Syntax legt am ehesten nahe, διά mit den Gott zugeschriebenen Prädikaten zu verbinden. So bleiben sowohl die Ausrichtung auf Gott als auch die vermittelnde Rolle Jesu sichtbar, ohne die Spannung aufzulösen.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός trägt hier erkennbar titularen Gehalt. „Messias“ macht diesen Sinn für heutige Leser unmittelbar verständlich; „Christus“ wäre die traditionelle, stärker namensartig wirkende Wiedergabe.
translation_notes:
  register: Feierlich und würdevoll, zugleich in modernem Standarddeutsch. Die traditionelle doxologische Satzform mit dem ergänzten „sei“ bleibt erhalten. „Macht und Vollmacht“ hält κράτος und ἐξουσία unterscheidbar, ohne unnatürlich zu klingen.
