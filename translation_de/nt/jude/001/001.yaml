  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: de
  text: 'Judas, ein Sklave Jesu, des Messias, und Bruder des Jakobus, an die, die in Gott, dem Vater, geliebt[b], für Jesus, den Messias, bewahrt[a] und berufen sind[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Jesus, dem Messias, bewahrt“. Der griechische Dativ kann hier die handelnde Person („von“) oder die Zielrichtung beziehungsweise den Begünstigten („für“) bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Einige Handschriften haben „geheiligt“ statt „geliebt“.
    reason: textual_variant
  - marker: c
    text: 'Oder: „gerufen“.'
    reason: translation_note
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: „Judas“ ist die übliche deutsche Wiedergabe des griechischen Personennamens Ἰούδας; anders als im Englischen gibt es für den Verfasser des Judasbriefs keine etablierte Namensform „Jude“.
- source_word: δοῦλος
  choice: Sklave
  rationale: Das Wort bezeichnet einen Menschen in gebundener, einem Herrn unterstellter Stellung. „Sklave“ bewahrt diese starke Aussage in der Selbstbezeichnung; „Diener“ wäre geläufiger, schwächte aber den Begriff ab.
- source_word: Χριστοῦ / Χριστῷ
  choice: des Messias / den Messias
  rationale: Χριστός ist ein Titel. Die appositionelle Wiedergabe „Jesus, der Messias“ beziehungsweise in den erforderlichen Kasusformen macht dessen Bedeutung sichtbar, statt ihn lediglich als Namensbestandteil wiederzugeben.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: und Bruder des Jakobus
  rationale: δέ verbindet hier die beiden Angaben zur Person des Verfassers; das natürliche deutsche „und“ gibt die schwache Verbindung besser wieder als „aber“.
- source_word: ἐν θεῷ πατρὶ
  choice: in Gott, dem Vater
  rationale: Die Formulierung erhält den naheliegenden Bereichs- oder Sphärensinn von ἐν und lässt die ungewöhnliche, theologisch dichte Aussage stehen.
- source_word: ἠγαπημένοις
  choice: geliebt
  rationale: Das Perfektpassiv bezeichnet einen aus vorausgegangener Liebe hervorgegangenen, fortbestehenden Zustand. „Geliebt“ ist gegenwärtig und verständlich.
- source_word: τετηρημένοις
  choice: bewahrt
  rationale: Das Perfektpassiv beschreibt einen fortbestehenden Zustand des Bewahrtseins. „Bewahrt“ trifft diesen Sinn, ohne die Art des Schutzes unnötig auszugestalten.
- source_word: κλητοῖς
  choice: die Berufenen
  rationale: Das Adjektiv ist substantivisch auf die Empfänger bezogen. Im Deutschen dient „die Berufenen“ als klarer Bezugsbegriff; seine Voranstellung ermöglicht einen natürlichen Satz und erhält den theologischen Gehalt der Berufung.
- source_word: Ἰακώβου
  choice: Jakobus
  rationale: „Jakobus“ ist die etablierte deutsche Wiedergabe dieses neutestamentlichen Personennamens.
theological_decisions:
- issue: Beziehung von τετηρημένοις zu Ἰησοῦ Χριστῷ
  choice: für Jesus, den Messias, bewahrt
  alternative: von Jesus, dem Messias, bewahrt
  rationale: Der Dativ kann Ziel beziehungsweise Begünstigten oder handelnde Person bezeichnen. Der Haupttext folgt der gut begründeten Zielrichtung „für“, während die Fußnote die ebenfalls mögliche Deutung der Urheberschaft offenhält.
- issue: Textform bei ἠγαπημένοις
  choice: geliebt
  alternative: geheiligt
  rationale: Der vorgegebene SBLGNT-Text liest ἠγαπημένοις („geliebt“). Die abweichende Lesart ἡγιασμένοις („geheiligt“) wird wegen ihrer inhaltlichen Bedeutung in einer Fußnote genannt.
- issue: Syntaktische Stellung von κλητοῖς
  choice: „die Berufenen“ als Empfängerbezeichnung vorangestellt
  alternative: 'am Satzende: „die Berufenen“ beziehungsweise „berufen“'
  rationale: Im Griechischen steht κλητοῖς am Ende, ist aber mit den Empfängern im Dativ verbunden. Die Voranstellung schafft im Deutschen einen eindeutigen, natürlichen Bezugsrahmen, ohne die Aussage inhaltlich zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftige Selbstbezeichnung „Sklave“ bleibt trotz ihrer Härte erhalten. Die Appositionen „Jesus, der Messias“ und „Gott, der Vater“ machen Titel und Beziehung verständlich. κλητοῖς wird aus Gründen deutscher Syntax als Empfängerbezeichnung vorangestellt; sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
