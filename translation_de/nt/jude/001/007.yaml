source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: de
  text: 'Ebenso stehen Sodom und Gomorra und die Städte in ihrer Umgebung als Beispiel vor Augen: Sie trieben in ähnlicher Weise wie diese[a] Unzucht, gingen anderem Fleisch[b] nach und erleiden die Strafe ewigen Feuers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort „diese“ kann sich auf die in Vers 6 genannten Engel oder allgemeiner auf die vorausgehenden Beispiele von Auflehnung und Gericht beziehen.
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „andersartigem Fleisch“; traditionell „fremdem Fleisch“. Die wörtliche Wiedergabe legt nicht fest, welche konkrete Grenzüberschreitung gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: ebenso
  rationale: Leitet den Vergleich mit den vorausgehenden Beispielen ein und gibt dessen Kraft in natürlichem Deutsch wieder.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Sodom und Gomorra
  rationale: Verwendet die im Deutschen etablierten Namensformen.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: die Städte in ihrer Umgebung
  rationale: Gibt die räumliche Bedeutung von περί mit Akkusativ klar und idiomatisch wieder.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: auf dieselbe Weise wie diese
  rationale: Bewahrt sowohl den ausdrücklichen Vergleich als auch das mehrdeutige Pronomen τούτοις, ohne dessen Bezug im Haupttext festzulegen.
- source_word: ἐκπορνεύσασαι
  choice: trieben Unzucht
  rationale: Gibt die sexuelle Verfehlung deutlich, knapp und in einem für einen würdigen Bibeltext geeigneten Register wieder.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: gingen … nach
  rationale: Entspricht dem griechischen Ausdruck des Verfolgens oder Begehrens und ist im Deutschen idiomatisch.
- source_word: σαρκὸς ἑτέρας
  choice: anderem Fleisch
  rationale: Übersetzt beide Wörter bewusst wörtlich und schränkt die umstrittene Bedeutung nicht auf eine bestimmte Auslegung ein.
- source_word: πρόκεινται δεῖγμα
  choice: stehen … als Beispiel vor Augen
  rationale: Vermittelt den Gedanken eines öffentlich sichtbaren, vorliegenden Beispiels in natürlichem Deutsch.
- source_word: πυρὸς αἰωνίου
  choice: ewigen Feuers
  rationale: Bewahrt die Genitivverbindung und die volle zeitliche beziehungsweise eschatologische Aussage von αἰώνιος, ohne sie auszudeuten.
- source_word: δίκην ὑπέχουσαι
  choice: erleiden die Strafe
  rationale: Gibt die feste gerichtliche Wendung verständlich und sachlich wieder.
theological_decisions:
- issue: Bezug von τούτοις in τὸν ὅμοιον τρόπον τούτοις
  choice: Das Pronomen wird ausdrücklich, aber ohne festgelegten Bezug als „diese“ wiedergegeben.
  alternative: Den Ausdruck nur mit „ebenso“ wiederzugeben oder „diese“ ausdrücklich auf die Engel aus Vers 6 zu beziehen.
  rationale: Der griechische Text enthält das Pronomen, doch sein genauer Bezug ist umstritten. Die Übersetzung bewahrt daher sowohl den Wortlaut als auch die echte Mehrdeutigkeit.
- issue: Bedeutung von σαρκὸς ἑτέρας
  choice: „anderem Fleisch“
  alternative: „andersartigem Fleisch“, „fremdem Fleisch“ oder eine Auslegung als konkrete sexuelle Praxis beziehungsweise als Überschreitung der Grenze zwischen Engel und Mensch.
  rationale: Die wörtliche Wiedergabe lässt die genaue Art der bezeichneten Grenzüberschreitung offen und importiert keine engere Lehrentscheidung.
- issue: Aussage von πυρὸς αἰωνίου
  choice: „ewigen Feuers“
  alternative: „immerwährenden Feuers“ oder eine ausführlichere systematisch-theologische Deutung.
  rationale: Die Formulierung des Ausgangstextes wird direkt beibehalten, ohne sie abzuschwächen oder über den Vers hinaus zu entfalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur wurde für natürliche deutsche Lesbarkeit leicht entfaltet; die beiden strittigen Formulierungen bleiben bewusst offen.
