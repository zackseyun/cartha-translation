  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: de
  text: 'Sie ließen auch falsche Zeugen auftreten, die sagten: »Dieser Mann hört nicht auf, gegen diesen heiligen Ort[a] und das Gesetz zu reden.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den heiligen Ort«; im Zusammenhang ist der Tempel gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Worte gegen diesen heiligen Ort und das Gesetz zu reden«.'
    reason: source_form
lexical_decisions:
- source_word: ἔστησάν
  choice: ließen … auftreten
  rationale: Im gerichtlichen Zusammenhang bedeutet die Form, dass Zeugen vorgeführt beziehungsweise als Zeugen aufgeboten wurden. »Ließen … auftreten« ist im modernen Deutschen natürlich und lässt zugleich erkennen, dass ihr Auftreten veranlasst wurde.
- source_word: τε
  choice: auch
  rationale: Gibt die anreihende, ergänzende Funktion von τέ wieder.
- source_word: μάρτυρας ψευδεῖς
  choice: falsche Zeugen
  rationale: Entspricht dem üblichen deutschen Ausdruck für Personen, die eine falsche Zeugenaussage ablegen, und bewahrt den rechtlichen Ton.
- source_word: λέγοντας
  choice: die sagten
  rationale: Ein Relativsatz gibt das griechische Partizip im Deutschen flüssig und inhaltlich genau wieder.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Dieser Mensch
  rationale: Bewahrt die direkte, leicht distanzierende Bezeichnung, ohne sie durch eine umgangssprachliche oder stärker abwertende Formulierung zu verschärfen.
- source_word: οὐ παύεται
  choice: hört nicht auf
  rationale: Natürliche deutsche Wiedergabe des fortdauernden Handelns.
- source_word: λαλῶν ῥήματα
  choice: zu reden
  rationale: Die Verbindung bedeutet idiomatisch, dass jemand Äußerungen macht. Das explizite ῥήματα wird nicht mit dem im Deutschen schwerfälligen »Worte reden« nachgebildet, sondern in einer Fußnote offengelegt.
- source_word: κατὰ
  choice: gegen
  rationale: Im Rahmen der feindseligen Anklage bezeichnet κατά mit Genitiv eine gegen den Tempel und das Gesetz gerichtete Rede.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: diesen heiligen Ort
  rationale: Der griechische Ausdruck lautet formal »den heiligen Ort«; im situativen Zusammenhang ist der örtlich gegenwärtige beziehungsweise bekannte Tempel gemeint. Das deutsche Demonstrativpronomen macht diesen deiktischen Bezug natürlich deutlich.
- source_word: τοῦ νόμου
  choice: das Gesetz
  rationale: Bezeichnet im jüdischen Kontext das mosaische Gesetz; die Übersetzung lässt den inhaltlichen Bezug aus dem Zusammenhang hervorgehen.
theological_decisions:
- issue: Bezug von »heiliger Ort« und »Gesetz«
  choice: Die Anklage richtet sich gegen Äußerungen über den Jerusalemer Tempel und das mosaische Gesetz.
  alternative: Allgemeiner Bezug auf einen beliebigen heiligen Ort und eine unbestimmte Rechtsordnung.
  rationale: Der unmittelbare Zusammenhang nennt den Tempel sowie Mose. Die Übersetzung wahrt dennoch die Formulierung der Ankläger und fügt diese Erläuterungen nicht in den Haupttext ein.
- issue: Stärke der Anklage
  choice: »gegen … reden«
  alternative: Deutendere Ausdrücke wie »lästern« oder »verunglimpfen«
  rationale: Der griechische Text spricht von gegen etwas gerichteten Worten, ohne hier selbst ein stärkeres theologisches oder rechtliches Wertungswort zu verwenden. Die feindselige Anklage wird daher bewahrt, aber nicht verschärft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarem Gerichts- und Anklagekontext. Die Rede der falschen Zeugen bleibt direkt und feindselig, wird aber nicht durch stärkere Begriffe als im Griechischen zugespitzt.
