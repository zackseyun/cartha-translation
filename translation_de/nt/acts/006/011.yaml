id: ACT.6.11
reference: Acts 6:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: de
  text: 'Da stifteten sie heimlich Männer dazu an, zu sagen[a]: „Wir haben gehört, wie er Lästerworte gegen Mose und Gott geredet hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da brachten sie heimlich Männer dazu, zu behaupten“; das griechische Verb bezeichnet hier ein verdecktes Anstiften oder Veranlassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Ein natürlicher erzählerischer Anschluss, der den nächsten Handlungsschritt zeitlich markiert.
- source_word: ὑπέβαλον
  choice: stifteten sie heimlich … dazu an
  rationale: Die Wendung gibt sowohl das veranlassende Handeln als auch den verdeckten, unlauteren Beiklang des Verbs wieder.
- source_word: ἄνδρας
  choice: Männer
  rationale: ἀνήρ bezeichnet hier ausdrücklich männliche Personen.
- source_word: λέγοντας
  choice: zu sagen
  rationale: Das Partizip wird nach dem veranlassenden Verb im Deutschen idiomatisch als Infinitivkonstruktion wiedergegeben.
- source_word: Ἀκηκόαμεν
  choice: Wir haben gehört
  rationale: Das Perfekt wird durch das deutsche Perfekt natürlich und mit seiner fortwirkenden Aussage wiedergegeben.
- source_word: αὐτοῦ λαλοῦντος
  choice: wie er … geredet hat
  rationale: Die Konstruktion nach dem Verb des Hörens wird im Deutschen natürlich mit „wie“ wiedergegeben; sie bezeichnet wahrgenommenes Sprechen, ohne einen einzelnen Ausspruch zu spezifizieren.
- source_word: ῥήματα βλάσφημα
  choice: Lästerworte
  rationale: Das Kompositum ist verständliches, würdiges Deutsch und bewahrt die religiös-rechtliche Schärfe von βλάσφημα.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: gegen Mose und Gott
  rationale: Im Zusammenhang der Anklage bezeichnet εἰς die Richtung der behaupteten Lästerung.
theological_decisions:
- issue: Charakter der Anklage gegen Stephanus
  choice: Die Äußerung wird als berichtete Beschuldigung mit „Lästerworte gegen Mose und Gott“ wiedergegeben.
  alternative: „verleumderische Worte über Mose und Gott“
  rationale: „Lästerworte“ bewahrt die religiös-rechtliche Tragweite von βλάσφημα, ohne die von angestifteten Männern erhobene Beschuldigung als wahr zu bestätigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Da“ hält den narrativen Fluss knapp; „stifteten … heimlich … an“ macht den verdeckten Charakter der Handlung deutlich.
