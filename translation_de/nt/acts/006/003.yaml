  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: de
  text: Nun, Brüder[a], wählt aus eurer Mitte sieben Männer aus, die einen guten Ruf haben[b] und voll Geist und Weisheit sind[c], die wir für diese Aufgabe einsetzen werden[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Anrede ist grammatisch männlich; im Zusammenhang kann sie die gesamte Gemeinschaft der Glaubenden einschließen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „für die ein gutes Zeugnis abgelegt wird“; auch: „die als bewährt gelten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „voll des Geistes und der Weisheit“ beziehungsweise „voll Heiligen Geistes und Weisheit“. Im Griechischen steht „voll Geist und Weisheit“.'
    reason: alternative_reading
  - marker: d
    text: Gemeint ist die praktische Verantwortung für die zuvor erwähnte tägliche Versorgung.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: wählt ... aus
  rationale: Der Imperativ fordert die Gemeinschaft auf, geeignete Männer aus den eigenen Reihen zu ermitteln und auszuwählen; „auswählen“ ist im Deutschen natürlich und gibt den Zusammenhang treffend wieder.
- source_word: δέ
  choice: Darum
  rationale: Die Partikel führt von der Begründung in Vers 2 zur daraus folgenden Aufforderung über. „Darum“ macht diesen folgernden Zusammenhang deutlich, ohne einen scharfen Gegensatz einzutragen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird formgetreu wiedergegeben; im Kontext kann sie die versammelte Gemeinschaft insgesamt ansprechen.
- source_word: ἄνδρας
  choice: Männer
  rationale: ἀνήρ bezeichnet hier ausdrücklich männliche Personen und wird daher nicht geschlechtsneutral wiedergegeben.
- source_word: ἐξ ὑμῶν
  choice: aus eurer Mitte
  rationale: Die Wendung bezeichnet die Auswahl innerhalb der Gemeinschaft und klingt im modernen Deutschen idiomatisch.
- source_word: μαρτυρουμένους
  choice: die einen guten Ruf haben
  rationale: Das Partizip bezeichnet Personen, für die andere ein gutes Zeugnis ablegen. „Einen guten Ruf haben“ vermittelt dies klar und natürlich.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: voll Geist und Weisheit
  rationale: Die artikellose griechische Form wird knapp bewahrt. Im lukanischen Kontext ist wahrscheinlich Gottes Geist gemeint, doch die Übersetzung ergänzt nicht ausdrücklich „Heiliger“ und erhält damit die sprachliche Spannung.
- source_word: καταστήσομεν
  choice: wollen wir ... betrauen
  rationale: Das Futur bezeichnet die vorgesehene Einsetzung in eine verantwortliche Funktion. „Mit ... betrauen“ verbindet die formelle Beauftragung natürlich mit der folgenden Aufgabe.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: mit dieser Aufgabe
  rationale: χρεία meint hier die konkret anstehende Angelegenheit beziehungsweise Verantwortung, im Kontext die tägliche Versorgung.
theological_decisions:
- issue: Bezeichnet πνεύματος allgemein Geist oder den Heiligen Geist?
  choice: Geist
  alternative: Heiliger Geist
  rationale: Der Gebrauch in Lukas–Apostelgeschichte legt Gottes Geist nahe. Da ἁγίου im griechischen Text fehlt, ergänzt der Haupttext „heilig“ jedoch nicht; Großschreibung und Fußnote weisen auf die wahrscheinliche Referenz hin, ohne die Formulierung zu vereindeutigen.
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern / Geschwister
  rationale: Die maskuline Form des Ausgangstextes bleibt im Haupttext sichtbar. Eine Fußnote erläutert, dass die Anrede im Zusammenhang die weitere Gemeinschaft der Glaubenden einschließen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufforderung ist direkt und gut verständlich; der zweite Satz vermeidet eine schwerfällige Relativsatzkonstruktion. Die ausdrücklich männliche Bezeichnung ἄνδρας sowie die Mehrdeutigkeit von πνεύματος und χρεία bleiben erkennbar.
