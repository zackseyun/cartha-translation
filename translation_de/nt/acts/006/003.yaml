  to: Nun, Brüder[a], wählt aus eurer Mitte sieben Männer aus, die einen guten Ruf haben[b] und voll Geist und Weisheit sind[c], die wir für diese Aufgabe einsetzen werden[d].
  rationale: 'Die Revision beschränkt sich auf zwei sichere Verbesserungen: Der Übergang δέ wird mit dem weniger folgerungsstarken „Nun“ wiedergegeben, und die Relativverknüpfung samt Futur von οὓς καταστήσομεν wird im Deutschen unmittelbar sichtbar. Die übrigen lexikalischen und theologischen Entscheidungen bleiben erhalten; insbesondere wird πνεύματος weder zu „Heiliger Geist“ erweitert noch als bloß allgemeiner Geist festgelegt.'
