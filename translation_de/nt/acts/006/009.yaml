id: ACT.6.9
reference: Acts 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: de
  text: Doch einige aus der Synagoge, die Synagoge der Freigelassenen genannt wurde, sowie aus Kyrene und Alexandria und aus Kilikien und der Provinz Asia[b] standen auf und stritten mit Stephanus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Asia bezeichnet hier die römische Provinz im Westen Kleinasiens, nicht den heutigen Kontinent Asien.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: traten auf
  rationale: Gibt das Auftreten zum Widerstand idiomatisch wieder, ohne die Wendung unnötig zu verstärken.
- source_word: δέ
  choice: Doch
  rationale: Markiert den Kontrast zwischen dem vorher geschilderten Wirken des Stephanus und dem nun einsetzenden Widerstand.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: einige aus der … Synagoge
  rationale: 'Bewahrt den partitiven Sinn: Nur ein nicht näher bestimmter Teil der zu dieser Synagoge Gehörenden trat auf.'
- source_word: τῆς λεγομένης
  choice: sogenannten
  rationale: Kennzeichnet sachlich den gebräuchlichen Namen der Synagoge; im Deutschen muss dies nicht abwertend verstanden werden.
- source_word: Λιβερτίνων
  choice: der Freigelassenen
  rationale: Das Lehnwort bezeichnet Freigelassene, wahrscheinlich ehemalige Sklaven oder deren Nachkommen; die Übersetzung vermeidet das missverständliche moderne Wort „Libertiner“.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: aus Kyrene und Alexandria
  rationale: Gibt die Herkunftsbezeichnungen in natürlichem modernem Deutsch wieder.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: aus Kilikien und der Provinz Asia
  rationale: ἀπό bezeichnet die Herkunft. Der Zusatz „Provinz“ verhindert, dass Asia als heutiger Kontinent verstanden wird.
- source_word: συζητοῦντες
  choice: stritten mit
  rationale: Im Zusammenhang bezeichnet das Verb eine kontroverse Auseinandersetzung, nicht ein neutrales Gespräch; das durative Partizip wird als begleitende Handlung wiedergegeben.
- source_word: τῷ Στεφάνῳ
  choice: mit Stephanus
  rationale: Der Dativ bezeichnet bei συζητέω den Gesprächs- beziehungsweise Streitpartner.
theological_decisions:
- issue: Gliederung der genannten Gruppen beziehungsweise Synagogen
  choice: Die Formulierung lässt offen, ob eine einzige Synagoge mit mehreren Herkunftsgruppen oder mehrere Gruppen beziehungsweise Synagogen gemeint sind.
  alternative: Die Aufzählung ausdrücklich als eine einzige Synagoge oder als mehrere Synagogen deuten.
  rationale: Die griechische Syntax ist in ihrer genauen Gliederung umstritten; die Übersetzung soll diese historische Frage nicht unnötig entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Traten auf“ bildet den Beginn des Widerstands idiomatisch ab; „stritten“ macht den kontroversen Zusammenhang deutlich. Die Herkunftsnamen werden als Ortsangaben formuliert, und „Provinz Asia“ wahrt die historische Bezeichnung bei gleichzeitiger Verständlichkeit.
