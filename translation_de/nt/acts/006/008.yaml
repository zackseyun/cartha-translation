id: ACT.6.8
reference: Acts 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: de
  text: Stephanus[a] aber, voll Gnade und Kraft, tat große Wunder und Zeichen unter dem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen hier „voll Glauben und Kraft“ statt „voll Gnade und Kraft“.
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ verbindet den Satz mit dem vorherigen Zusammenhang und kann hier einen leichten Kontrast markieren, ohne einen starken Gegensatz auszudrücken.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: voll Gnade und Kraft
  rationale: Die Wendung beschreibt Stephanus als von Gnade und wirksamer Kraft erfüllt beziehungsweise geprägt. „Gnade“ bewahrt den theologischen Klang von χάρις; „Kraft“ ist im Deutschen in Verbindung mit Wundern idiomatisch.
- source_word: ἐποίει
  choice: tat
  rationale: Der deutsche Präteritumsausdruck ist natürlich; der imperfektive Sinn einer fortdauernden oder wiederholten Tätigkeit ergibt sich im Erzählzusammenhang.
- source_word: τέρατα καὶ σημεῖα μεγάλα
  choice: große Wunder und Zeichen
  rationale: 'Die feste Paarung wahrt beide Aspekte: τέρατα hebt das Staunen hervor, σημεῖα die hinweisende Bedeutung. μεγάλα bezieht sich auf die gesamte Wortgruppe.'
- source_word: ἐν τῷ λαῷ
  choice: unter dem Volk
  rationale: Die Präpositionalphrase bezeichnet den Kreis, in dem Stephanus wirkte; „unter dem Volk“ ist natürlich und bewahrt den kollektiven Bezug von λαός.
theological_decisions:
- issue: Textvariante χάριτος/πίστεως
  choice: Gnade
  alternative: Glaube
  rationale: Der vorgegebene SBLGNT-Text liest χάριτος („Gnade“). Die bedeutsame Variante πίστεως („Glaube“) wird in einer Fußnote dokumentiert, nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Namensform „Stephanus“ und die geläufige biblische Wortverbindung „Wunder und Zeichen“ wurden beibehalten.
