  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: de
  text: So wiegelten sie das Volk, die Ältesten und die Schriftgelehrten auf. Dann gingen sie auf ihn zu, packten ihn und führten ihn vor den Hohen Rat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor den Sanhedrin. Das griechische Wort συνέδριον kann allgemein „Rat“ bedeuten; hier ist wahrscheinlich der jüdische Hohe Rat gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: wiegelten … auf
  rationale: Das Verb bezeichnet ein emotionales und gesellschaftliches Aufbringen gegen jemanden. „Aufwiegeln“ gibt den verursachenden Sinn natürlich und kräftig wieder, ohne bereits körperliche Gewalt auszudrücken.
- source_word: τε
  choice: So
  rationale: Die schwache verbindende Partikel führt die Erzählung fort und kann im Deutschen natürlich mit „So“ wiedergegeben werden.
- source_word: τὸν λαὸν
  choice: das Volk
  rationale: „Das Volk“ ist die direkte Wiedergabe und lässt offen, ob besonders die Öffentlichkeit oder eine Menschenmenge gemeint ist.
- source_word: τοὺς πρεσβυτέρους
  choice: die Ältesten
  rationale: Im Jerusalemer Zusammenhang bezeichnet der Ausdruck anerkannte jüdische Führungspersonen, nicht lediglich ältere Männer.
- source_word: τοὺς γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Der etablierte deutsche Ausdruck bezeichnet die damaligen Fachleute für Schrift und Gesetz und bewahrt den historischen Charakter.
- source_word: ἐπιστάντες
  choice: fielen sie über ihn her
  rationale: Das Partizip beschreibt hier ein plötzliches, bedrohliches Herantreten. Die gewählte Wendung erhält diese Abruptheit und passt zur unmittelbar folgenden Festnahme.
- source_word: συνήρπασαν
  choice: packten
  rationale: Das Verb bezeichnet ein gewaltsames Ergreifen. „Packten“ ist anschaulich und vermeidet die Wiederholung des institutionell geprägten Verbs „festnehmen“.
- source_word: ἤγαγον
  choice: führten
  rationale: Das breite Bewegungsverb wird mit „führten“ direkt wiedergegeben; der zuvor genannte gewaltsame Zugriff macht deutlich, dass dies nicht freiwillig geschah.
- source_word: τὸ συνέδριον
  choice: den Hohen Rat
  rationale: Im Jerusalemer Kontext ist der jüdische oberste Rat gemeint. „Hoher Rat“ ist die geläufige, verständliche deutsche Bezeichnung für den Sanhedrin.
theological_decisions:
- issue: Bestimmung von συνέδριον
  choice: der Hohe Rat
  alternative: der Rat / der Sanhedrin
  rationale: Der Zusammenhang mit Ältesten und Schriftgelehrten in Jerusalem spricht für das konkrete jüdische Leitungsgremium. Die Übersetzung wahrt die historische Bestimmung, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Schriftgelehrte“ und „Hoher Rat“ bewahren die historischen Begriffe, bleiben aber für heutige Leser verständlich.
