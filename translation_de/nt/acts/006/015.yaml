id: ACT.6.15
reference: Acts 6:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: de
  text: Und alle, die im Hohen Rat[a] saßen, richteten ihren Blick fest auf ihn und sahen, dass sein Gesicht wie das Gesicht eines Engels war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sanhedrin“. Gemeint ist das jüdische Ratsgremium.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: richteten ihren Blick fest auf ihn
  rationale: Das Partizip bezeichnet ein aufmerksames, anhaltendes Hinschauen; die Formulierung gibt die Intensität in natürlichem Deutsch wieder.
- source_word: πάντες οἱ καθεζόμενοι
  choice: alle, die … saßen
  rationale: Bewahrt sowohl die Gesamtheit von πάντες als auch die situative Beschreibung der Sitzenden.
- source_word: συνεδρίῳ
  choice: Hohen Rat
  rationale: Im Kontext bezeichnet συνέδριον das maßgebliche jüdische Ratsgremium. „Hoher Rat“ ist die geläufige deutsche Sachbezeichnung; die alternative Bezeichnung „Synedrium“ wird in der Fußnote genannt.
- source_word: πρόσωπον
  choice: Gesicht
  rationale: πρόσωπον bezeichnet hier unmittelbar das sichtbare Gesicht des Stephanus; „Gesicht“ ist klar und gegenwärtig.
- source_word: ὡσεὶ
  choice: wie
  rationale: ὡσεὶ kennzeichnet einen Vergleich, ohne die genaue Art der Ähnlichkeit festzulegen.
- source_word: ἀγγέλου
  choice: eines Engels
  rationale: Im erzählerischen Zusammenhang ist ἄγγελος als himmlischer Engel zu verstehen, nicht lediglich als menschlicher Bote.
theological_decisions:
- issue: Art des Vergleichs „wie das Gesicht eines Engels“
  choice: Ein offener Vergleich, der das Aussehen des Stephanus mit dem eines Engels vergleicht, ohne die Ähnlichkeit näher zu bestimmen.
  alternative: Die Ähnlichkeit ausdrücklich als strahlenden Glanz, gelassene Unschuld oder himmlische Autorität deuten.
  rationale: Der griechische Text nennt nur die Ähnlichkeit und legt nicht fest, worin sie besteht. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt gut lesbar und bewahrt zugleich die gemeinsame, eindringliche Blickrichtung aller Ratsmitglieder. Der Fußnotenmarker [a] steht unmittelbar bei der kulturell erklärungsbedürftigen Bezeichnung.
