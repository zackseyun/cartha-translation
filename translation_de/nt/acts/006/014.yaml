  source_fidelity: 'Der Text gibt alle Sinnelemente des griechischen Satzes angemessen wieder: das begründende γάρ („Denn“), das Perfekt mit direktem Höranspruch („wir haben ihn sagen hören“), die demonstrativ hervorgehobene Jesusbezeichnung, die Zukunftsaussagen sowie die von Mose überlieferten ἔθη. „Diesen Ort“ bewahrt die nicht weiter spezifizierende Formulierung τὸν τόπον τοῦτον.'
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch. „Dieser Jesus, der Nazarener“ ist als bewusst markierte, anklagende Bezeichnung leicht gehoben, aber idiomatisch vertretbar und dem rhetorischen Ton der Zeugenrede angemessen.
  terminology: „Bräuche“ trifft τὰ ἔθη im Kontext überkommener religiös-gemeinschaftlicher Praxis gut. „Überliefert“ gibt παρέδωκεν treffend wieder. „Der Nazarener“ wahrt die deskriptiv-titulare Bezeichnung ὁ Ναζωραῖος, ohne den Haupttext auf „von Nazaret“ zu glätten.
