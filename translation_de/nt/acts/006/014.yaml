id: ACT.6.14
reference: Acts 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: de
  text: 'Denn wir haben ihn sagen hören: Dieser Jesus, der Nazarener, wird diesen Ort zerstören und die Bräuche ändern, die Mose uns überliefert hat.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser Jesus von Nazaret“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „diesem Ort“ ist der Tempel gemeint.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Überlieferungen, die Mose an uns weitergegeben hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: wir haben … hören
  rationale: Das Perfekt bezeichnet ein gehörtes Zeugnis mit gegenwärtiger Bedeutung; im Deutschen gibt das Perfekt dies hier natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden Anschluss an die vorhergehende Anklage.
- source_word: αὐτοῦ λέγοντος
  choice: ihn sagen hören
  rationale: Gibt die Konstruktion nach ἀκούω idiomatisch wieder und wahrt den Anspruch, die Aussage unmittelbar gehört zu haben.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: dieser Jesus, der Nazarener
  rationale: „Dieser“ erhält die demonstrative, möglicherweise abwertende Hervorhebung; „der Nazarener“ bewahrt die Bezeichnung des griechischen Textes.
- source_word: καταλύσει
  choice: wird … zerstören
  rationale: Im Bezug auf den Tempel bezeichnet das Verb hier am ehesten Zerstören oder Niederreißen.
- source_word: τὸν τόπον τοῦτον
  choice: diesen Ort
  rationale: Folgt dem Wortlaut, ohne den im Kontext erkennbaren Bezug auf den Tempel im Haupttext ausdrücklich einzutragen.
- source_word: ἀλλάξει
  choice: wird … ändern
  rationale: Direkte und natürliche Wiedergabe des Futurs von ἀλλάσσω.
- source_word: τὰ ἔθη
  choice: die Bräuche
  rationale: Bezeichnet überkommene gemeinschaftliche und religiöse Lebenspraktiken, ohne den später stärker fachsprachlichen Begriff „Traditionen“ vorauszusetzen.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: die Mose uns überliefert hat
  rationale: „Überliefert“ drückt die Weitergabe verbindlicher Bräuche aus und bleibt nahe am Sinn von παραδίδωμι.
theological_decisions:
- issue: Bezug von „diesem Ort“
  choice: Im Haupttext steht wörtlich „diesen Ort“; der Tempelbezug wird in einer Fußnote erläutert.
  alternative: „diesen Tempel“ oder „dieses Heiligtum“
  rationale: Der Kontext weist auf den Tempel, doch der griechische Wortlaut sagt lediglich „diesen Ort“. Die Übersetzung wahrt diese Ausdrucksweise.
- issue: Ton der Anklage gegen Jesus
  choice: „Dieser Jesus, der Nazarener“ bewahrt die demonstrative Hervorhebung.
  alternative: „Jesus von Nazaret“ oder „jener Jesus von Nazaret“
  rationale: Die Formulierung lässt den feindseligen beziehungsweise abschätzigen Ton der Ankläger erkennen, ohne ihn interpretierend zu verstärken.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Der Satz bleibt als Aussage der Ankläger erkennbar; die griechische Wortstellung wird zugunsten natürlichen deutschen Satzbaus maßvoll geglättet.
