id: ACT.6.6
reference: Acts 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: de
  text: Diese stellten sie vor die Apostel; und nachdem sie gebetet hatten, legten sie ihnen die Hände auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Handauflegung kann eine öffentliche Beauftragung oder Segnung ausdrücken. Der griechische Text nennt hier die Handlung, bestimmt ihre kirchliche Bedeutung aber nicht näher.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: Diese
  rationale: Das maskuline Relativpronomen verweist auf die sieben zuvor genannten Männer. „Diese“ nimmt den Bezug im Deutschen natürlich auf, ohne das im Vers nicht wiederholte Substantiv eigens hinzuzufügen.
- source_word: ἔστησαν ἐνώπιον
  choice: stellten sie vor
  rationale: Die Verbindung bezeichnet hier das Aufstellen beziehungsweise Vorstellen von Personen in der Gegenwart der Apostel. „Vor die Apostel stellen“ bewahrt sowohl den räumlichen als auch den präsentierenden Aspekt.
- source_word: τῶν ἀποστόλων
  choice: die Apostel
  rationale: In der Apostelgeschichte bezeichnet das Wort die anerkannte Gruppe der Apostel; der geläufige Titel ist sachgerecht und verständlich.
- source_word: προσευξάμενοι
  choice: nachdem sie gebetet hatten
  rationale: Das Aoristpartizip bezeichnet am natürlichsten eine der Haupthandlung vorausgehende Handlung. Der deutsche Nebensatz gibt diese Abfolge klar wieder.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: legten sie ihnen die Hände auf
  rationale: Dies ist die natürliche deutsche Wiedergabe der griechischen Wendung für das Handauflegen. Der Dativ αὐτοῖς wird mit „ihnen“ wiedergegeben; der bestimmte Artikel bei einem Körperteil entspricht im Deutschen ebenfalls idiomatisch „die Hände“.
theological_decisions:
- issue: Bedeutung der Handauflegung
  choice: Die Handlung wird beschreibend als „legten sie ihnen die Hände auf“ wiedergegeben.
  alternative: „weihten sie“ oder „setzten sie in ihr Amt ein“
  rationale: Der griechische Text nennt die sichtbare Handlung, legt aber ihre vollständige kirchenrechtliche oder sakramentale Bedeutung an dieser Stelle nicht ausdrücklich fest. Eine deutende Amtsbezeichnung würde die Offenheit des Textes einschränken.
- issue: Subjekt des Gebets und der Handauflegung
  choice: Das fortlaufende „sie“ bleibt im Haupttext erhalten.
  alternative: Ausdrücklich „die Apostel beteten und legten ihnen die Hände auf“
  rationale: Grammatisch liegt es nahe, dass das Subjekt von ἐπέθηκαν dasselbe wie bei προσευξάμενοι und im Kontext die Apostel sind. Da der griechische Vers das Subjekt jedoch nicht nochmals nennt, wird es nicht erläuternd in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Aufbau, ohne unnatürlich zu wirken. Das Semikolon verdeutlicht den Übergang von der Vorstellung der Sieben zum Gebet und zur Handauflegung.
