id: ACT.6.5
reference: Acts 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: de
  text: Der Vorschlag fand bei der ganzen Versammlung Zustimmung, und sie wählten Stephanus, einen Mann voll Glaubens[a] und Heiligen Geistes, sowie Philippus, Prochorus, Nikanor, Timon, Parmenas und Nikolaus, einen Proselyten[b] aus Antiochia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „voll Treue“. Das griechische Wort kann Glaube, Vertrauen oder Treue bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Ein Proselyt war ein Nichtjude, der zum Judentum übergetreten war.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: der Vorschlag
  rationale: Im Zusammenhang bezeichnet λόγος den unmittelbar zuvor geäußerten Vorschlag der Apostel; „Vorschlag“ gibt den konkreten Bezug im Deutschen natürlich wieder.
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: fand die Zustimmung der ganzen Versammlung
  rationale: Die Wendung besagt idiomatisch, dass der Vorschlag bei der gesamten versammelten Gemeinschaft Anklang fand. „Versammlung“ wahrt den kollektiven Sinn, ohne einen späteren kirchlichen Fachbegriff einzutragen.
- source_word: ἐξελέξαντο
  choice: sie wählten
  rationale: Das Medium bezeichnet die Auswahl von Personen für die eigene Gemeinschaft beziehungsweise Aufgabe; „wählten“ ist direkt und im Kontext natürlich.
- source_word: ἄνδρα πλήρης πίστεως
  choice: einen Mann voll Glauben
  rationale: ἀνήρ wird geschlechtsgenau mit „Mann“ wiedergegeben. Trotz der auffälligen nominativischen Form πλήρης ist die Charakterisierung des Stephanus eindeutig. πίστις bedeutet hier wahrscheinlich „Glaube“, kann aber auch „Treue“ bezeichnen.
- source_word: πνεύματος ἁγίου
  choice: Heiligen Geistes
  rationale: Die Wendung verweist im Sprachgebrauch der Apostelgeschichte auf den göttlichen Heiligen Geist; die Großschreibung macht diesen Bezug im Deutschen kenntlich.
- source_word: προσήλυτον
  choice: einen Proselyten
  rationale: προσήλυτος bezeichnet hier präzise einen Nichtjuden, der zum Judentum übergetreten war. Eine Fußnote erklärt den historischen Begriff.
- source_word: Ἀντιοχέα
  choice: aus Antiochia
  rationale: Das Herkunftsadjektiv bezeichnet Nikolaus als aus Antiochia stammend beziehungsweise mit Antiochia verbunden; „aus Antiochia“ ist im Deutschen die natürliche Form.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Stephanus, Philippus, Prochorus, Nikanor, Timon, Parmenas und Nikolaus
  rationale: Die Namen folgen geläufigen deutschen beziehungsweise bibeldeutschen Formen. Die griechische Häufung von καί wird als natürliche deutsche Aufzählung wiedergegeben; „sowie“ bindet die übrigen Namen nach der ausführlichen Beschreibung des Stephanus eindeutig in dieselbe Siebenergruppe ein.
theological_decisions:
- issue: Bedeutung von πίστις in der Beschreibung des Stephanus
  choice: Glaube
  alternative: Treue / Zuverlässigkeit
  rationale: „Glaube“ ist in diesem Kontext die naheliegende und eingebürgerte Wiedergabe. Da πίστις zugleich Treue oder Zuverlässigkeit bezeichnen kann und der Kontext diese Nuance nicht völlig ausschließt, wird sie in einer Fußnote bewahrt.
- issue: Referenz von πνεῦμα ἅγιον
  choice: der Heilige Geist
  alternative: heiliger Geist / eine heilige geistliche Befähigung
  rationale: In der Apostelgeschichte bezeichnet die feste Wendung regelmäßig Gottes Heiligen Geist. Die Übersetzung wahrt dennoch die quellensprachliche Formulierung ohne zusätzliche trinitarische Erklärung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, während die Namensreihe für natürliches Deutsch gegliedert wird. „Versammlung“ ist verständlicher als „Volksmenge“ und vermeidet eine unnötig institutionelle Festlegung; „Proselyt“ erhält die historische Präzision und wird erklärt.
