  - severity: low
    issue: Die Begründung, die Großschreibung von „Geist“ zeige die Deutung als Heiliger Geist an, trifft im Deutschen nicht zu.
    rationale: „Geist“ wird als Substantiv unabhängig vom Referenten großgeschrieben. Die mögliche Deutung muss daher durch den Kontext bzw. die Fußnote kenntlich gemacht werden.
