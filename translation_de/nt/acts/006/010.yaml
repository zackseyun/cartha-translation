  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: de
  text: Doch sie konnten der Weisheit und dem Geist, durch den er redete, nicht standhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geist“ kann sich auf Stephanus’ eigenen Geist beziehen statt auf den Heiligen Geist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: konnten … nicht
  rationale: Das Imperfekt bezeichnet hier ihre fortdauernde Unfähigkeit; die deutsche Modalverbkonstruktion gibt dies natürlich und präzise wieder.
- source_word: ἀντιστῆναι
  choice: standhalten
  rationale: Das Verb bezeichnet, sich erfolgreich entgegenzustellen beziehungsweise gegenüber einem Widerpart zu behaupten. „Standhalten“ passt zur Dativkonstruktion und zum Streitgespräch.
- source_word: σοφίᾳ
  choice: der Weisheit
  rationale: Der bestimmte Artikel und der konkrete Bezug auf die in Stephanus’ Rede erkennbare Weisheit werden gewahrt.
- source_word: πνεύματι
  choice: dem Geist
  rationale: Der unmittelbare Kontext, besonders Apostelgeschichte 6,5, legt den Heiligen Geist nahe. Die Großschreibung zeigt diese Deutung an, ohne die lexikalisch mögliche Alternative zu verschweigen.
- source_word: ᾧ ἐλάλει
  choice: durch den er redete
  rationale: 'Der Dativ wird instrumental wiedergegeben: Der Geist ist die wirksame Quelle seines Redens. Das Imperfekt wird im Deutschen idiomatisch mit „redete“ ausgedrückt; der Relativsatz bezieht sich grammatisch eindeutig auf „Geist“.'
theological_decisions:
- issue: Bezieht sich πνεύματι auf den Heiligen Geist oder auf Stephanus’ eigenen Geist?
  choice: Geist (der Heilige Geist)
  alternative: Geist im Sinn von Stephanus’ eigener innerer Haltung oder Geisteskraft
  rationale: Die wiederholte Hervorhebung, dass Stephanus vom Heiligen Geist erfüllt war, und die Verbindung von Weisheit und Geist sprechen kontextuell für den Heiligen Geist. Da das griechische Wort allein die andere Deutung nicht ausschließt, wird sie in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ bindet den Vers als Gegensatz an den vorausgehenden erfolglosen Disput an. Die Satzstellung hält Weisheit und Geist eng zusammen und vermeidet unnötig konfessionelle Terminologie.
