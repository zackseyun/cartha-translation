  source_fidelity: Der Haupttext gibt die kontrastiv hervorgehobene erste Person (ἡμεῖς δέ), das zukünftige beharrliche Sich-Widmen (προσκαρτερήσομεν), das Gebet und die διακονία τοῦ λόγου zuverlässig wieder. „Dienst am Wort“ ist im heutigen kirchlich-literarischen Standarddeutsch eine natürliche und sachlich passende Wiedergabe, ohne ein besonderes Amt vorauszusetzen.
  naturalness: „Wir aber werden uns dem Gebet und dem Dienst am Wort widmen“ ist flüssiges, würdiges modernes Standarddeutsch. Die Satzstellung bildet den griechischen Kontrast angemessen ab.
  terminology: '„Dienst“ bewahrt die Verbindung zu διακονία im unmittelbaren Kontext und vermeidet die institutionell enger klingende Wiedergabe „Amt“. „Wort“ ist für λόγος hier etabliert und angemessen. Die vorhandene Fußnotenalternative „Dienst an der Botschaft“ ist jedoch im Deutschen missverständlich und nicht idiomatisch: Sie kann einen Dienst zugunsten einer Botschaft statt den Dienst der Verkündigung bezeichnen.'
