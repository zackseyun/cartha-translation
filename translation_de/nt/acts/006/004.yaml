  text: ἡμεῖς δὲ τῇ προσευχῇ καὶ τῇ διακονίᾳ τοῦ λόγου προσκαρτερήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: de
  text: Wir aber werden uns dem Gebet und dem Dienst am Wort[a] widmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienst der Verkündigung“. Das griechische Wort λόγος kann hier das verkündigte Wort oder die Botschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: wir
  rationale: Das im Griechischen ausdrücklich gesetzte Pronomen hebt die Apostel kontrastiv hervor; im Deutschen trägt „wir“ zusammen mit „aber“ diesen Nachdruck natürlich.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert den Gegensatz zur zuvor vorgeschlagenen Übertragung des Tischdienstes an andere.
- source_word: τῇ προσευχῇ
  choice: dem Gebet
  rationale: Der Dativ bezeichnet bei προσκαρτερέω den Bereich, dem man sich beständig widmet; „sich dem Gebet widmen“ ist idiomatisches Deutsch.
- source_word: διακονίᾳ
  choice: Dienst
  rationale: διακονία bezeichnet einen Dienst oder eine dienende Aufgabe. „Dienst“ bewahrt die Verbindung zum Tischdienst im unmittelbaren Kontext und vermeidet eine unnötige kirchenamtliche Verengung.
- source_word: τοῦ λόγου
  choice: am Wort
  rationale: λόγος meint hier das verkündigte Wort beziehungsweise die Botschaft Gottes. „Dienst am Wort“ ist im Deutschen verständlich und bewahrt die frühchristliche Ausdrucksweise.
- source_word: προσκαρτερήσομεν
  choice: werden uns … widmen
  rationale: Das Futur bezeichnet den festen Vorsatz zu anhaltender, beharrlicher Hingabe; „sich widmen“ gibt dies in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von διακονία im Kontrast zum Tischdienst des unmittelbaren Zusammenhangs
  choice: Dienst am Wort
  alternative: Verkündigungsdienst
  rationale: „Dienst“ erhält das gemeinsame Bedeutungsfeld der praktischen Versorgung und der Verkündigung und vermeidet, eine starre Unterscheidung zwischen geistlichem Amt und gewöhnlichem Dienst in den Text einzutragen. „Verkündigungsdienst“ wäre erklärender, engt den allgemeineren Ausdruck jedoch stärker ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kontrastive Satzstellung „Wir aber“ spiegelt die Hervorhebung im Griechischen. „Dienst am Wort“ ist knapp, geläufig und wahrt zugleich die semantische Verbindung zum Dienen im Kontext.
