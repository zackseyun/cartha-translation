id: ACT.6.1
reference: Acts 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: de
  text: In diesen Tagen, als die Zahl der Jünger immer weiter wuchs, kam es bei den Hellenisten zu Beschwerden gegen die Hebräer[a], weil ihre Witwen bei der täglichen Versorgung übergangen wurden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind wahrscheinlich griechischsprachige Juden im Unterschied zu den »Hebräern«, die wahrscheinlich Aramäisch oder Hebräisch sprachen.
    reason: Kulturelle und sprachliche Einordnung der historischen Gruppenbezeichnungen.
  - marker: b
    text: 'Oder: weil ihre Witwen beim täglichen Dienst vernachlässigt wurden.'
    reason: Bewahrt die möglichen Wiedergaben von παρεθεωροῦντο und die breitere Bedeutung von διακονία.
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: In diesen Tagen
  rationale: Bewahrt die zeitliche Einordnung; die leichte fortführende Funktion von δέ ergibt sich im Deutschen aus dem Erzählfluss, ohne dass ein zusätzliches »nun« nötig ist.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: als die Zahl der Jünger immer weiter wuchs
  rationale: Gibt den Genitivus absolutus als Hintergrundgeschehen wieder und bringt den andauernden zahlenmäßigen Zuwachs in natürlichem Deutsch zum Ausdruck.
- source_word: ἐγένετο γογγυσμός
  choice: kam es … zu Beschwerden
  rationale: γογγυσμός kann Murren, Unmut oder eine Beschwerde bezeichnen. Der Plural »Beschwerden« klingt im Deutschen idiomatisch und passt zu dem anschließend genannten konkreten Missstand.
- source_word: τῶν Ἑλληνιστῶν
  choice: bei den Hellenisten
  rationale: Der historisch spezifische Gruppenname bleibt erhalten, ohne die wahrscheinlich sprachlich-kulturelle Bedeutung bereits im Haupttext festzulegen.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: gegen die Hebräer
  rationale: πρός bezeichnet hier die Zielrichtung der Beschwerden und lässt die soziale Spannung erkennen; die parallele historische Gruppenbezeichnung bleibt gewahrt.
- source_word: παρεθεωροῦντο
  choice: übergangen wurden
  rationale: Das Imperfekt Passiv beschreibt einen fortdauernden Vorgang. »Übergangen« gibt das Nichtberücksichtigen wieder, ohne ausdrücklich Absicht zu unterstellen.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: bei der täglichen Versorgung
  rationale: διακονία bezeichnet allgemein Dienst, meint im Zusammenhang mit den Witwen und der materiellen Fürsorge hier jedoch wahrscheinlich deren tägliche Versorgung.
- source_word: αἱ χῆραι αὐτῶν
  choice: ihre Witwen
  rationale: Das Pronomen bezieht sich am natürlichsten auf die Hellenisten und bewahrt die soziale Zuordnung der betroffenen Witwen.
theological_decisions:
- issue: Bedeutung der Gruppenbezeichnungen Ἑλληνισταί und Ἑβραῖοι
  choice: Die Bezeichnungen »Hellenisten« und »Hebräer« bleiben im Haupttext stehen und werden in einer Fußnote erläutert.
  alternative: Griechischsprachige Juden und hebräisch- beziehungsweise aramäischsprachige Juden
  rationale: Die historischen Gruppenbezeichnungen lassen eine gewisse kulturelle und sprachliche Mehrdeutigkeit bestehen. Die Fußnote nennt die wahrscheinliche Unterscheidung, ohne sie als vollständig gesichert in den Text einzutragen.
- issue: Konkrete Bedeutung von διακονία
  choice: tägliche Versorgung
  alternative: täglicher Dienst
  rationale: Der unmittelbare Zusammenhang legt eine materielle Versorgung der Witwen nahe; eine Fußnote hält die breitere Bedeutung »Dienst« offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Historische Gruppenbezeichnungen bleiben im Haupttext erhalten; erklärungsbedürftige kulturelle und lexikalische Einzelheiten stehen in den Fußnoten.
