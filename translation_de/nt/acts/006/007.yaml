id: ACT.6.7
reference: Acts 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: de
  text: Und das Wort Gottes breitete sich immer weiter aus. Die Zahl der Jünger in Jerusalem nahm stark zu, und auch sehr viele Priester wurden dem Glauben gehorsam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: gehorchten dem Glauben. Mit „Glauben“ kann hier die christliche Glaubensbotschaft gemeint sein, der sie sich anschlossen, nicht nur ein innerer Akt des Vertrauens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Bewahrt die geläufige biblische Wendung und lässt offen, ob besonders die Verkündigung, die Botschaft oder das von Gott ausgehende Wort im Blick ist.
- source_word: ηὔξανεν
  choice: breitete sich immer weiter aus
  rationale: Das Imperfekt bezeichnet einen fortlaufenden Vorgang. Im Deutschen gibt „breitete sich immer weiter aus“ das Wachstum des verkündigten Wortes natürlich wieder.
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: die Zahl der Jünger … nahm stark zu
  rationale: Gibt die fortlaufende starke Vermehrung idiomatisch wieder und bewahrt „Jünger“ als wichtigen lukanischen Begriff.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Direkte Ortsangabe.
- source_word: σφόδρα
  choice: stark
  rationale: Drückt die deutliche Intensivierung knapp und in modernem Deutsch aus.
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: und auch sehr viele Priester
  rationale: Die kollektive Wendung bezeichnet idiomatisch eine große Zahl von Priestern; „sehr viele“ klingt im Deutschen natürlicher als „eine große Menge der Priester“. τε wird durch „und auch“ wiedergegeben.
- source_word: ὑπήκουον
  choice: wurden … gehorsam
  rationale: Das Imperfekt kann den fortschreitenden Anschluss der Priester bezeichnen. Die Formulierung wahrt den Gehorsamsaspekt von ὑπακούω.
- source_word: τῇ πίστει
  choice: dem Glauben
  rationale: 'Der Artikel und die Verbindung mit „gehorsam werden“ sprechen hier für einen objektiven Sinn: der geglaubten und verkündigten Botschaft. Die knappe Wiedergabe vermeidet jedoch eine überdeutende Paraphrase wie „der christlichen Lehre“.'
theological_decisions:
- issue: Bedeutung von πίστις in τῇ πίστει
  choice: dem Glauben
  alternative: der Glaubensbotschaft / dem Glauben gehorchten
  rationale: Die Formulierung kann den Glauben als Inhalt der christlichen Verkündigung bezeichnen, ohne den Gedanken persönlichen Vertrauens auszuschließen. „Dem Glauben“ bewahrt diese Spannung und legt keine konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne die gedankliche Abfolge des griechischen Textes aufzulösen. Die wiederholten Imperfektformen werden durch „immer weiter“, „nahm … zu“ und „wurden“ als fortlaufende Entwicklung wiedergegeben.
