  source_fidelity: 'Die Übersetzung gibt die drei Imperfektformen als fortlaufende Entwicklung angemessen wieder: Das Wort Gottes breitet sich weiter aus, die Zahl der Jünger nimmt stark zu, und viele Priester werden dem Glauben gehorsam. „Das Wort Gottes“, „Jünger“, „Jerusalem“, „Priester“ und „dem Glauben“ entsprechen dem griechischen Text präzise. „Sehr viele Priester“ ist eine idiomatische Wiedergabe von πολύς ὄχλος τῶν ἱερέων, ohne fälschlich eine exakt bestimmbare Zahl anzudeuten.'
  naturalness: Modernes, gut lesbares Standarddeutsch in würdigem biblischem Register. Die Formulierung „wurden dem Glauben gehorsam“ ist leicht gehoben, aber bewusst nah an ὑπήκουον τῇ πίστει und im Kontext verständlich. Die Satzteilung ist im Deutschen flüssig und bewahrt die Abfolge der Aussagen.
  terminology: „Das Wort Gottes“ bewahrt die etablierte, zugleich nicht überdeutende biblische Terminologie für ὁ λόγος τοῦ θεοῦ. „Dem Glauben“ hält den objektiven möglichen Sinn von τῇ πίστει offen, ohne ihn konfessionell festzulegen. Die Fußnote erläutert sachgerecht, dass die Wendung die christliche Glaubensbotschaft meinen kann, ohne persönliches Vertrauen auszuschließen.
