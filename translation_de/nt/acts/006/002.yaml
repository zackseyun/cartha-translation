  to: 'Da riefen die Zwölf die ganze Schar der Jünger zusammen[a] und sagten: „Es ist nicht angemessen[b], dass wir das Wort Gottes vernachlässigen, um an den Tischen[c] zu dienen.“'
  rationale: Die Revision ersetzt die leicht institutionell gefärbte „Gemeinschaft“ durch die dem griechischen πλῆθος nähere und im Deutschen idiomatische „Schar“. Außerdem wird der kulturelle Fußnotenanker an das erläuterte Wort gesetzt. Die übrigen Formulierungen bleiben erhalten, weil sie den griechischen Sinn und die sachliche Priorisierung der Aufgaben ohne Abwertung des praktischen Dienstes angemessen wiedergeben.
