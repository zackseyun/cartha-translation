  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Ausdrücke insgesamt zuverlässig wieder: Die Zwölf berufen die Jüngerschaft ein, und der Kontrast zwischen dem Wort Gottes und dem Dienst an den Tischen bleibt erhalten. „Vernachlässigen“ ist für καταλείψαντας im Kontext vertretbar, da es das Zurückstellen der Wortaufgabe bezeichnet. „Die ganze Gemeinschaft“ ist jedoch etwas institutioneller als τὸ πλῆθος τῶν μαθητῶν und weniger präzise als eine kollektive Bezeichnung wie „die ganze Schar der Jünger“.'
