  terminology: „die Zwölf“, „das Wort Gottes“ und „an den Tischen dienen“ sind angemessene, theologisch nicht überdeutende Wiedergaben. Die Fußnote wahrt die historische Offenheit, dass τραπέζαις den praktischen Umgang mit Mahlzeiten und gemeinschaftlichen Mitteln betreffen kann.
