  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: de
  text: 'Da riefen die Zwölf die ganze Schar der Jünger zusammen[a] und sagten: „Es ist nicht angemessen[b], dass wir das Wort Gottes vernachlässigen, um an den Tischen[c] zu dienen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die Menge der Jünger“; möglich ist ebenso: „die Gesamtheit der Jünger“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Es ist nicht recht“; „Es ist nicht akzeptabel“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der praktische Dienst bei der Verteilung von Mahlzeiten und möglicherweise auch die Verwaltung der gemeinschaftlichen Mittel.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: riefen ... zusammen
  rationale: Das Aoristpartizip leitet die Haupthandlung ein. Die finite Wiedergabe ist im Deutschen natürlich und bewahrt den Sinn des Einberufens.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Reaktion auf den zuvor geschilderten Konflikt weiter, ohne einen starken Gegensatz auszudrücken.
- source_word: οἱ δώδεκα
  choice: die Zwölf
  rationale: Die feste Bezeichnung der apostolischen Gruppe wird ohne den im Griechischen nicht ausdrücklich genannten Zusatz „Apostel“ wiedergegeben.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: die ganze Gemeinschaft der Jünger
  rationale: πλῆθος bezeichnet hier die versammelte Gesamtheit beziehungsweise große Gruppe der Jünger. „Gemeinschaft“ klingt im modernen Deutsch natürlich, während die Fußnote die lexikalische Spannweite offenhält.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Es ist nicht angemessen
  rationale: ἀρεστόν bezeichnet, was gefällt, akzeptabel oder angebracht ist. „Nicht angemessen“ drückt hier die Frage der passenden Aufgabenverteilung aus, ohne den praktischen Dienst moralisch abzuwerten.
- source_word: ἡμᾶς καταλείψαντας
  choice: dass wir ... vernachlässigen
  rationale: καταλείπω bedeutet zurücklassen oder verlassen. Im Zusammenhang der apostolischen Aufgabe gibt „vernachlässigen“ den gemeinten Vorrang idiomatisch wieder, ohne eine vollständige Preisgabe zu behaupten.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die traditionelle und zugleich transparente Wiedergabe bewahrt sowohl den Bezug auf Gottes Botschaft als auch die theologische Resonanz des Ausdrucks in der Apostelgeschichte.
- source_word: διακονεῖν
  choice: zu dienen
  rationale: Das schlichte Verb „dienen“ entspricht dem praktischen Dienst und vermeidet eine vorschnelle Übertragung späterer Amtsbegriffe.
- source_word: τραπέζαις
  choice: an Tischen
  rationale: Die konkrete Bildsprache des griechischen Plurals bleibt erhalten. Der Kontext kann Speiseausgabe oder Verwaltung gemeinschaftlicher Mittel einschließen; dies wird in der Fußnote erläutert, nicht in den Text hineingetragen.
theological_decisions:
- issue: Verhältnis des apostolischen Verkündigungsauftrags zum praktischen Dienst
  choice: 'Die Aussage wird als Frage der angemessenen Aufgabenverteilung wiedergegeben: Die Zwölf sollen das Wort Gottes nicht vernachlässigen, um den Tischdienst selbst zu übernehmen.'
  alternative: „Es ist nicht recht ...“ könnte stärker wie eine moralische Abwertung des Tischdienstes klingen; „Es gefällt nicht ...“ ließe den Bezugspunkt des Gefallens unklar.
  rationale: Der Vers ordnet Verantwortlichkeiten, ohne den praktischen Dienst als geistlich minderwertig darzustellen. Die Spannung zwischen Wortdienst und notwendiger Versorgung bleibt bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur wurde für natürliches Deutsch geglättet; zentrale Begriffe und die konkrete Rede von den „Tischen“ bleiben erhalten.
