  text: ⸀οὕτως ὁ Παῦλος ἐξῆλθεν ἐκ μέσου αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/033.yaml
  text: So Paul went out from among them[a].
translation:
  language: de
  text: So ging Paulus aus ihrer Mitte weg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf diese Weise verließ Paulus ihre Mitte.“'
    reason: Lexikalische Alternative für οὕτως und ἐξῆλθεν; sie gibt den Ausdruck etwas formeller wieder.
lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: 'Hier führt οὕτως folgernd zum Abschluss der Szene: „so/auf diese Weise“. „So“ ist im modernen Deutschen natürlich und bewahrt die erzählerische Anschlussfunktion.'
- source_word: ὁ Παῦλος
  choice: Paulus
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben; der Artikel bleibt nach deutschem Sprachgebrauch unübersetzt.
- source_word: ἐξῆλθεν
  choice: ging … weg
  rationale: Der Aorist von ἐξέρχομαι bezeichnet hier das Hinausgehen beziehungsweise Fortgehen. „ging … weg“ klingt natürlich und bewahrt die konkrete Bewegung aus der versammelten Gruppe heraus.
- source_word: ἐκ μέσου αὐτῶν
  choice: aus ihrer Mitte
  rationale: Die Wendung bezeichnet das Verlassen der Mitte beziehungsweise Gegenwart der versammelten Menschen. „aus ihrer Mitte“ bildet das griechische Bild knapp und idiomatisch ab.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Formulierung folgt der knappen griechischen Erzählweise und erhält zugleich die bildhafte Ortsangabe „aus ihrer Mitte“.
