  variant: modern standard German
source:
  edition: SBLGNT
  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: de
  text: Daraufhin schickten die Brüder[a] Paulus sofort fort, um bis ans Meer[b] zu gehen; Silas und Timotheus aber blieben beide dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Brüder und Schwestern“. Im Griechischen steht „Brüder“; der Ausdruck kann die Glaubenden gemeinschaftlich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Meer“ oder „in Richtung Meer“. Die griechische Formulierung kann eine Bewegung bis zur Küste bezeichnen, ohne den weiteren Reiseweg genauer anzugeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: Da ... sofort
  rationale: „Da“ führt die zeitliche Erzählfolge natürlich weiter; „sofort“ bewahrt die Dringlichkeit von εὐθέως, ohne die Partikeln einzeln und schwerfällig wiederzugeben.
- source_word: ἐξαπέστειλαν
  choice: schickten ... fort
  rationale: Die Formulierung gibt die Bedeutung des Aussendens beziehungsweise Wegschickens in natürlichem modernem Deutsch wieder.
- source_word: οἱ ἀδελφοὶ
  choice: die Brüder
  rationale: Die Übersetzung bewahrt die maskuline Pluralform des griechischen Ausdrucks; dass damit die Gemeinschaft der Glaubenden insgesamt gemeint sein kann, wird in einer Fußnote erläutert.
- source_word: πορεύεσθαι
  choice: damit er ... ging
  rationale: Der Infinitiv hängt von „schickten“ ab und bezeichnet die beabsichtigte Bewegung; ein Finalsatz ist im Deutschen klar und idiomatisch.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: bis ans Meer
  rationale: Die Wendung bewahrt die Vorstellung einer Bewegung bis zur Küste, ohne festzulegen, ob Paulus anschließend auf dem Seeweg weiterreiste.
- source_word: ὑπέμεινάν
  choice: blieben
  rationale: Im Kontext bezeichnet das Verb das Verbleiben an einem Ort, nicht das Erdulden von Not.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Silas und Timotheus
  rationale: Beide Namen werden als zusammengehöriges Paar wiedergegeben; im Deutschen ist kein zusätzliches „beide“ nötig, da der Gegensatz zu Paulus klar ist.
- source_word: ἐκεῖ
  choice: dort
  rationale: Natürliche deutsche Entsprechung des Ortsadverbs.
theological_decisions:
- issue: Wiedergabe von ἀδελφοί als Bezeichnung der glaubenden Gemeinschaft
  choice: die Brüder
  alternative: die Brüder und Schwestern; die Glaubenden
  rationale: Der Haupttext bleibt nahe an der grammatischen Form des Ausgangstextes. Zugleich wird in der Fußnote offengehalten, dass der Ausdruck im frühchristlichen Sprachgebrauch die Glaubenden gemeinschaftlich und damit auch Frauen einschließen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der griechischen Erzählbewegung, vermeidet jedoch eine unnatürliche wörtliche Abbildung der Partikeln. Die Stellung „Silas und Timotheus aber“ hebt den Gegensatz zwischen Paulus’ Abreise und ihrem Verbleiben hervor.
