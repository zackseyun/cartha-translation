  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: de
  text: 'Jason hat diese Leute bei sich aufgenommen. Sie alle handeln gegen die Erlasse des Kaisers und sagen, es gebe einen anderen König: Jesus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen weiteren König“. Das griechische Wort bezeichnet einen anderen König und stellt Jesus in der Anklage als Gegenanspruch zum Kaiser dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: hat … bei sich aufgenommen
  rationale: Das Perfekt bezeichnet Jasons Aufnahme der Männer als Gäste und den fortbestehenden Sachverhalt, auf den sich die Anklage stützt. Die deutsche Wendung ist natürlich und lässt sowohl Beherbergung als auch gastfreundliche Aufnahme anklingen.
- source_word: ἀπέναντι
  choice: gegen
  rationale: Mit dem Genitiv bezeichnet das Wort hier Widerspruch oder Gegnerschaft. „Gegen“ ist im anklagenden, rechtlich-politischen Zusammenhang klar und idiomatisch.
- source_word: δογμάτων
  choice: Erlasse
  rationale: Im römisch-politischen Kontext sind amtliche Anordnungen oder Beschlüsse gemeint. „Erlasse“ ist verständlich und wahrt den offiziellen Charakter.
- source_word: πράσσουσι
  choice: handeln
  rationale: Das Präsens beschreibt ihr angeblich fortlaufendes Verhalten. „Handeln gegen“ gibt die Wendung im Deutschen knapp und natürlich wieder.
- source_word: βασιλέα ἕτερον
  choice: einen anderen König
  rationale: βασιλεύς bedeutet konkret „König“, während ἕτερον einen weiteren beziehungsweise andersartigen Anspruchsteller bezeichnet. Die direkte Wiedergabe erhält die politische Schärfe der Anklage.
- source_word: λέγοντες
  choice: und sagen
  rationale: Das Partizip erläutert, worin ihr Handeln gegen die Erlasse bestehen soll. Die koordinierte deutsche Formulierung ist natürlich und überzeichnet die Aussage nicht als bloße Behauptung.
- source_word: εἶναι Ἰησοῦν
  choice: 'es gebe …: Jesus'
  rationale: Der abhängige Infinitiv wird als indirekte Rede wiedergegeben. Der Konjunktiv „gebe“ kennzeichnet die Aussage als Inhalt der Anklage; die Schlussstellung hebt die Identifizierung des Königs mit Jesus hervor.
- source_word: οὗτοι πάντες
  choice: Sie alle
  rationale: 'Die demonstrative und umfassende Aussage wird im Zusammenhang idiomatisch wiedergegeben: Zuerst werden „diese Leute“ bezeichnet, dann schließt „sie alle“ jeden von ihnen in die Anklage ein.'
theological_decisions:
- issue: Politische Tragweite der Bezeichnung Jesu als König
  choice: Die Anklage wird ungeschmälert als Aussage über „einen anderen König“ wiedergegeben.
  alternative: „König“ durch „Herrscher“ oder „Anführer“ ersetzen und dadurch die politische Spannung abschwächen.
  rationale: Die Verbindung mit den Erlassen des Kaisers macht die politische Stoßrichtung ausdrücklich. Die Übersetzung bewahrt zugleich die theologische Spannung, ohne das Königtum Jesu näher zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bei sich aufgenommen“ ist alltagssprachlich verständlich, ohne die gastfreundliche Nuance zu verlieren. „Erlasse des Kaisers“ wahrt den amtlich-politischen Ton. Der Doppelpunkt vor „Jesus“ setzt die im griechischen Satz hervorgehobene Identifizierung prägnant um.
