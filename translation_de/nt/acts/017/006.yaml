source:
  edition: SBLGNT
  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: de
  text: 'Als sie sie aber nicht fanden, schleppten sie Jason und einige Brüder[a] vor die Stadtoberen[b] und schrien: »Diese Leute, die die bewohnte Welt[c] in Aufruhr versetzt haben, sind auch hier!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Brüder« sind hier andere Angehörige der christlichen Gemeinschaft gemeint; je nach Zusammensetzung der Gruppe können Frauen mitgemeint sein.
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht »Politarchen«, ein örtlicher makedonischer Amtstitel für städtische Obrigkeiten.
    reason: cultural_note
  - marker: c
    text: Gemeint ist wörtlich die »bewohnte Welt«, im damaligen Sprachgebrauch häufig besonders die bekannte griechisch-römische Welt.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες δὲ αὐτοὺς
  choice: Als sie sie aber nicht fanden
  rationale: Das Aoristpartizip mit μή bezeichnet den Umstand, der der Haupthandlung vorausgeht. Die temporale Wiedergabe ist im Deutschen natürlich; »aber« gibt δέ wieder.
- source_word: ἔσυρον
  choice: schleppten sie
  rationale: σύρω bezeichnet ein gewaltsames Ziehen oder Fortschleppen. »Schleppten« bewahrt den körperlichen Zwang.
- source_word: τινας ἀδελφοὺς
  choice: einige Brüder
  rationale: ἀδελφοί bezeichnet hier Mitglieder der christlichen Gemeinschaft. Die formale Bezeichnung »Brüder« bleibt im Haupttext erhalten; die mögliche gemeinschaftsbezogene Bedeutung wird in einer Fußnote erläutert.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: vor die Stadtoberen
  rationale: πολιτάρχης ist ein örtlicher makedonischer Amtstitel. »Stadtobere« vermittelt die amtliche Funktion und »vor« den Gedanken des Vorführens vor eine Behörde.
- source_word: βοῶντες
  choice: und schrien
  rationale: Das Partizip beschreibt lautes Rufen gleichzeitig mit dem Vorführen. Die finite Koordination klingt im Deutschen natürlich und erhält die Heftigkeit.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: Diese Leute, die die bewohnte Welt in Aufruhr versetzt haben
  rationale: ἀναστατόω bezeichnet das Hervorrufen schwerer Unruhe oder Umwälzung. »In Aufruhr versetzt« bewahrt den anklagenden Sinn, während »bewohnte Welt« die Reichweite von οἰκουμένη sichtbar hält.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: sind nun auch hier
  rationale: πάρειμι bezeichnet gegenwärtige Anwesenheit und kann eine vorausgegangene Ankunft einschließen. »Sind nun auch hier« gibt die empörte Feststellung sowie καί idiomatisch wieder.
