id: ACT.17.1
reference: Acts 17:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: de
  text: Nachdem sie durch Amphipolis und Apollonia gezogen waren, kamen sie nach Thessalonich. Dort gab es eine Synagoge der Juden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Nachdem sie durch … gezogen waren
  rationale: Das vorzeitige aoristische Partizip bezeichnet eine dem Hauptverb vorausgehende Durchreise. Die Formulierung gibt sowohl die zeitliche Abfolge als auch die Bewegung durch die beiden Orte in natürlichem Deutsch wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ dient hier als schwacher erzählerischer Anschluss; im modernen deutschen Erzählfluss ist kein ausdrückliches Bindewort nötig.
- source_word: τὴν Ἀμφίπολιν καὶ τὴν Ἀπολλωνίαν
  choice: durch Amphipolis und Apollonia
  rationale: Die Akkusative bezeichnen bei διοδεύω die durchquerten Orte. Die Eigennamen folgen der im Deutschen üblichen Form.
- source_word: ἦλθον εἰς Θεσσαλονίκην
  choice: kamen sie nach Thessalonich
  rationale: ἦλθον bezeichnet die Ankunftsbewegung; bei Städtenamen ist „nach“ im Deutschen idiomatisch. „Thessalonich“ ist die etablierte deutsche Namensform.
- source_word: ὅπου ἦν
  choice: Dort gab es
  rationale: Die existenziale Aussage wird im Deutschen natürlicher mit „Dort gab es“ als wörtlich mit „wo … war“ ausgedrückt.
- source_word: συναγωγὴ τῶν Ἰουδαίων
  choice: eine Synagoge der Juden
  rationale: Das artikellose συναγωγή wird sachgerecht indefinit wiedergegeben; der Genitiv bezeichnet die Zugehörigkeit zur jüdischen Gemeinschaft.
theological_decisions:
- issue: Bedeutung von Ἰουδαίων im örtlichen Erzählzusammenhang
  choice: der Juden
  alternative: der jüdischen Gemeinschaft; der Judäer
  rationale: Gemeint ist die jüdische Gemeinschaft, zu der die Synagoge in Thessalonich gehörte. „Judäer“ wäre hier geografisch irreführend, während „der jüdischen Gemeinschaft“ stärker erläuternd wäre als der griechische Ausdruck.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung vermeidet einen schwerfälligen Relativsatz, ohne Inhalt oder Zusammenhang zu verändern.
