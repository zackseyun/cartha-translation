id: ACT.17.32
reference: Acts 17:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: de
  text: 'Als sie von der Auferstehung der Toten hörten, spotteten die einen; die anderen aber sagten: »Wir werden dich noch einmal darüber hören[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir werden dich darüber ein andermal hören.«'
    reason: Die Wendung καὶ πάλιν kann neben der Wiederholung auch den Gedanken eines späteren weiteren Anhörens hervorheben.
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Als sie … hörten
  rationale: Das Aoristpartizip bezeichnet den zeitlichen Umstand der folgenden Reaktionen. „Als sie … hörten“ ist im Deutschen natürlich; δέ braucht hier neben dem folgenden Gruppenkontrast nicht eigens wiedergegeben zu werden.
- source_word: ἀνάστασιν νεκρῶν
  choice: von der Auferstehung der Toten
  rationale: Die Wendung bezeichnet die Auferstehung der Toten als den Inhalt, den die Zuhörer vernahmen. „Von … hören“ ist dafür idiomatisches Deutsch.
- source_word: οἱ μὲν … οἱ δὲ
  choice: die einen; die anderen aber
  rationale: Die korrelative Gegenüberstellung zweier Gruppen wird klar und ohne unnötige Zusätze wiedergegeben.
- source_word: ἐχλεύαζον
  choice: spotteten
  rationale: Das Imperfekt beschreibt ihre Reaktion; das schlichte Präteritum ist im Deutschen natürlich und vermeidet die nicht zwingende Festlegung auf einen Handlungsbeginn.
- source_word: Ἀκουσόμεθά σου
  choice: Wir werden dich … hören
  rationale: Das Futur von ἀκούω mit dem Genitiv der Person bedeutet hier, jemanden anzuhören. Die Formulierung bewahrt die Zukunftsaussage und lässt offen, wie ernst die Sprecher sie meinen.
- source_word: περὶ τούτου καὶ πάλιν
  choice: darüber noch einmal
  rationale: „Darüber“ gibt den Gesprächsgegenstand wieder; „noch einmal“ bewahrt die ausdrückliche Wiederholungsaussage von καὶ πάλιν in natürlichem Deutsch.
theological_decisions:
- issue: Bedeutung der Auferstehungsformulierung vor einem nichtjüdischen Publikum
  choice: Auferstehung der Toten
  alternative: Auferstehung von den Toten
  rationale: Der griechische Genitiv bezeichnet hier am natürlichsten die Toten als die von der Auferstehung Betroffenen. Die Übersetzung erläutert weder deren Umfang noch ihre genaue Art über den Wortlaut hinaus.
- issue: Haltung der zweiten Zuhörergruppe
  choice: 'neutrale Zukunftsaussage: „Wir werden dich … hören“'
  alternative: 'absichtsbetont: „Wir wollen dich … hören“'
  rationale: Der Wortlaut kann echtes weiteres Interesse, höflichen Aufschub oder eine ausweichende Reaktion ausdrücken. Die Übersetzung legt das Motiv nicht fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; das Semikolon macht den griechischen Kontrast der beiden Gruppen deutlich.
