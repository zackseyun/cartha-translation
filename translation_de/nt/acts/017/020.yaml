  variant: modern standard German
source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: de
  text: Denn du bringst uns einige ungewöhnliche Dinge zu Gehör.[a] Deshalb möchten wir wissen, was diese Dinge bedeuten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ungewohnte Dinge“ oder „Dinge, die uns fremd sind“. Das griechische Wort kann etwas bezeichnen, das den Hörern neu oder fremd erscheint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „was diese Dinge sein wollen“; eine griechische Wendung für die Frage, was diese Dinge bedeuten oder welche Tragweite sie haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα
  choice: fremdartige
  rationale: Das Partizip bezeichnet hier Inhalte, die den Hörern fremd, ungewohnt oder neu erscheinen. „Fremdartig“ wahrt diese Bedeutungsbreite, ohne bereits ein Urteil wie „erstaunlich“ auszudrücken.
- source_word: τινα
  choice: einige … Dinge
  rationale: Das indefinite Pronomen wird zusammen mit dem substantivisch verstandenen Partizip als unbestimmter Plural wiedergegeben.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: du bringst uns … zu Gehör
  rationale: Die Formulierung bewahrt das Bild des Heranbringens an das Gehör und klingt zugleich in modernem Deutsch natürlich.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: Deshalb möchten wir wissen
  rationale: „Möchten“ gibt den geäußerten Wunsch höflich und gegenwartssprachlich wieder; „deshalb“ markiert die Folgerung von οὖν.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: was diese Dinge bedeuten
  rationale: Die griechische Wendung fragt idiomatisch nach Sinn und Bedeutung der gehörten Aussagen, nicht nur nach ihrer bloßen Identität.
- source_word: γάρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Bitte und wird durch die erklärende Konjunktion „denn“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu Gehör bringen“ erhält das Bild des griechischen Ausdrucks, ohne unnatürlich wörtlich zu wirken; die idiomatische Schlussfrage steht im Haupttext klar und verständlich, während die auffällige griechische Formulierung in der Fußnote dokumentiert wird.
