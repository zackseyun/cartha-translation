source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: de
  text: Diese hatten eine edlere Haltung als die Menschen in Thessalonich[a]. Sie nahmen das Wort mit größter Bereitwilligkeit auf[b] und untersuchten täglich die Schriften, um festzustellen, ob diese Dinge sich so verhielten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diese waren vornehmer als die Menschen in Thessalonich.« Das griechische Wort kann eine achtenswertere Haltung oder – hier weniger wahrscheinlich – einen höheren gesellschaftlichen Rang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie nahmen die Botschaft mit größter Bereitwilligkeit an.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: hatten eine edlere Haltung
  rationale: Der Komparativ kann gesellschaftlichen Rang oder eine achtenswerte Gesinnung bezeichnen. Der folgende Satz erklärt hier ihre Haltung durch die bereitwillige Aufnahme des Wortes und die tägliche Prüfung der Schriften. Die Formulierung gibt diese kontextuelle Bedeutung wieder, ohne die mögliche soziale Bedeutung zu verschweigen.
- source_word: οἵτινες
  choice: Sie
  rationale: Das Relativpronomen leitet eine erläuternde Charakterisierung ein. Ein neuer deutscher Hauptsatz stellt diesen Zusammenhang klar und natürlich dar.
- source_word: ἐδέξαντο τὸν λόγον
  choice: nahmen das Wort … auf
  rationale: Die Wendung bewahrt die in der Apostelgeschichte wichtige Bezeichnung »das Wort« und bringt zugleich den Gedanken des annehmenden Empfangens idiomatisch zum Ausdruck.
- source_word: μετὰ πάσης προθυμίας
  choice: mit größter Bereitwilligkeit
  rationale: προθυμία bezeichnet Bereitschaft, Willigkeit oder Eifer; πάσης verstärkt diese Haltung. »Mit größter Bereitwilligkeit« ist verständlich und gibt die Intensität wieder.
- source_word: τὸ καθ’ ἡμέραν
  choice: täglich
  rationale: Die Präpositionalfügung wird adverbial gebraucht und bezeichnet eine regelmäßige, jeden Tag erfolgende Handlung.
- source_word: ἀνακρίνοντες
  choice: untersuchten
  rationale: Das Verb bezeichnet sorgfältiges Prüfen oder Untersuchen. »Untersuchten« bewahrt diesen prüfenden Sinn, ohne einen förmlichen Gerichtsrahmen vorauszusetzen.
- source_word: τὰς γραφὰς
  choice: die Schriften
  rationale: Gemeint sind in diesem Zusammenhang die heiligen jüdischen Schriften. »Die Schriften« ist präzise und vermeidet die mögliche anachronistische Vorstellung eines bereits abgeschlossenen christlichen Bibelkanons.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: um festzustellen, ob es sich so verhielt
  rationale: Die indirekte Frage wird im Deutschen idiomatisch wiedergegeben. »Ob es sich so verhielt« bewahrt den prüfenden, nicht vorschnell wertenden Charakter der Aussage.
theological_decisions:
- issue: Bedeutung von εὐγενέστεροι
  choice: eine achtenswerte, edlere Haltung
  alternative: höherer gesellschaftlicher Rang oder edlere Herkunft
  rationale: Der unmittelbare Kontext beschreibt ihre »edlere« Art durch ihre Reaktion auf die Verkündigung und ihre Prüfung der Schriften. Die soziale Bedeutung bleibt als lexikalische Möglichkeit in der Fußnote erhalten.
- issue: Wiedergabe von λόγος
  choice: das Wort
  alternative: die Botschaft
  rationale: »Das Wort« erhält die sprachliche und theologische Kontinuität innerhalb der Apostelgeschichte, ohne mehr zu behaupten, als der griechische Ausdruck besagt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht die erläuternde Beziehung natürlich verständlich. »Edlere Haltung« vermeidet sowohl das heute missverständliche »edler gesinnt« als auch eine vorschnelle Festlegung auf gesellschaftlichen Adel.
