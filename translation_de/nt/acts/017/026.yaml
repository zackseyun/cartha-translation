id: ACT.17.26
reference: Acts 17:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: de
  text: Und aus einem einzigen Menschen[a] ließ er alle Völker hervorgehen, damit sie die ganze Erde bewohnen. Dabei setzte er die für sie bestimmten Zeiten[b] und die Grenzen ihrer Wohngebiete fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „aus einem Blut“ statt „aus einem“. Der Haupttext folgt der Lesart „aus einem“; „Menschen“ wurde zum besseren Verständnis ergänzt.
    reason: textual_variant
  - marker: b
    text: 'Oder: „die ihnen gesetzten Zeiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν τε
  choice: Und … ließ er … hervorgehen
  rationale: Das einleitende „Und“ gibt die Verknüpfung durch τε wieder. Die Konstruktion „ließ … hervorgehen“ überträgt ποιέω mit dem Infinitiv κατοικεῖν in natürliches Deutsch, ohne die Art des göttlichen Hervorbringens unnötig festzulegen.
- source_word: ἐξ ἑνὸς
  choice: aus einem einzigen Menschen
  rationale: Wörtlich steht „aus einem“. Im Deutschen macht „Menschen“ den im Zusammenhang naheliegenden Bezug verständlich; „einzigen“ bringt die Zahlbetonung zum Ausdruck. Die Lesart „Blut“ wird nicht in den Haupttext aufgenommen.
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: alle Völker
  rationale: Der distributive Singular πᾶν ἔθνος bezeichnet sämtliche Völker. Der Zusatz ἀνθρώπων kennzeichnet sie als menschliche Völker, was im Deutschen bereits durch „Völker“ eindeutig ist; „alle Völker der Menschen“ wäre unnötig schwerfällig.
- source_word: κατοικεῖν ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: damit sie die ganze Erde bewohnen
  rationale: Der Infinitiv wird als Ziel beziehungsweise Ergebnis wiedergegeben. Das griechische Bild von der „ganzen Oberfläche der Erde“ wird idiomatisch mit „die ganze Erde“ ausgedrückt.
- source_word: ὁρίσας
  choice: Dabei setzte er … fest
  rationale: Das Partizip bezeichnet Gottes begleitendes beziehungsweise vorausgehendes Festlegen. „Dabei“ verbindet den Satz natürlich, während „setzte … fest“ den abgrenzenden Sinn von ὁρίζω wahrt.
- source_word: προστεταγμένους καιρούς
  choice: die für sie bestimmten Zeiten
  rationale: καιροί meint bestimmte Zeiträume oder Zeitpunkte; προστεταγμένους bezeichnet sie als angeordnet oder zugewiesen. Die Formulierung lässt offen, welcher Art diese Zeiten sind.
- source_word: τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν
  choice: die Grenzen ihrer Wohngebiete
  rationale: ὁροθεσίαι sind räumliche Grenzsetzungen. Der griechische Singular κατοικία wird im Deutschen passend auf die mehreren Völker bezogen und deshalb mit dem Plural „Wohngebiete“ wiedergegeben.
theological_decisions:
- issue: Der unausgesprochene Bezug von ἐξ ἑνὸς
  choice: aus einem einzigen Menschen
  alternative: aus einem; aus einem einzigen Vorfahren
  rationale: Der Ausgangstext enthält nur „aus einem“, nicht „aus einem Blut“. Für verständliches Deutsch wird der menschliche Bezug aus dem unmittelbaren Zusammenhang ausdrücklich gemacht, ohne die abweichende Lesart „Blut“ zu übernehmen.
- issue: Gottes Bestimmung von Zeiten und Grenzen
  choice: setzte er die für sie bestimmten Zeiten und die Grenzen ihrer Wohngebiete fest
  alternative: bestimmte er ihre festgesetzten Zeiten und die Grenzen ihres Wohnens
  rationale: Die Übersetzung bewahrt die Aussage göttlicher Festlegung, legt aber weder die genaue Art der Zeiten noch deren heilsgeschichtliche Bedeutung aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit geteilt. „Hervorgehen ließ“ vermeidet das unnatürliche „machte alle Völker, damit sie wohnen“, und „Wohngebiete“ gibt die räumliche Aussage für mehrere Völker klar wieder.
