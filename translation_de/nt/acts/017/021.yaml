  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀθηναῖοι δὲ πάντες καὶ οἱ ἐπιδημοῦντες ξένοι εἰς οὐδὲν ἕτερον ηὐκαίρουν ἢ λέγειν τι ⸀ἢ ἀκούειν ⸀τι καινότερον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: de
  text: Alle Athener und die Fremden, die sich dort aufhielten, verbrachten ihre Zeit nämlich mit nichts anderem als etwas Neueres[a] zu sagen oder zu hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „etwas Neues“. Im Griechischen steht der Komparativ „Neueres“, der wahrscheinlich das ständige Verlangen nach der jeweils neuesten Neuigkeit ausdrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: Alle Athener … nämlich
  rationale: πάντες wird mit „alle“ wiedergegeben. Das nachgestellte „nämlich“ lässt δέ als milden, erläuternden Übergang erkennen, ohne einen starken Gegensatz zu erzeugen.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: die Fremden, die sich dort aufhielten
  rationale: Die Formulierung bezeichnet auswärtige Personen, die sich in Athen aufhielten; sie legt keinen dauerhaften Wohnsitz fest.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: verbrachten ihre Zeit mit nichts anderem
  rationale: Die Wiedergabe erfasst den idiomatischen Sinn und den durativen beziehungsweise gewohnheitsmäßigen Aspekt des Imperfekts.
- source_word: λέγειν … ἢ ἀκούειν
  choice: zu erzählen oder zu hören
  rationale: Die parallelen Infinitive bleiben erhalten; „erzählen“ passt im Deutschen natürlich zu dem unbestimmten Gegenstand „etwas Neueres“.
- source_word: τι καινότερον
  choice: etwas Neueres
  rationale: Der Komparativ καινότερον wird ausdrücklich bewahrt und deutet auf das fortwährende Interesse an der jeweils neuesten Neuigkeit hin.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit sachlich-erzählendem und würdigem Ton. Der griechische Komparativ bleibt trotz der im Deutschen geläufigeren Formulierung „etwas Neues“ im Haupttext erhalten.
