id: ACT.17.15
reference: Acts 17:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: de
  text: Diejenigen, die Paulus begleiteten, brachten ihn bis nach Athen. Nachdem sie die Anweisung für Silas und Timotheus erhalten hatten, dass diese so schnell wie möglich zu ihm kommen sollten, reisten sie ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθιστάνοντες
  choice: die ... begleiteten
  rationale: Das Partizip bezeichnet hier die Männer, die Paulus auf der Reise begleiteten und ihn an sein Ziel brachten. „Begleiteten“ ist im Deutschen natürlich und lässt den aus dem Zusammenhang erkennbaren Schutz- oder Geleitcharakter bestehen, ohne ihn zu überzeichnen.
- source_word: ἤγαγον
  choice: brachten
  rationale: Der Aorist bezeichnet die abgeschlossene Beförderung beziehungsweise Führung des Paulus nach Athen. „Brachten“ passt idiomatisch zum Zielausdruck.
- source_word: ἕως Ἀθηνῶν
  choice: bis nach Athen
  rationale: ἕως mit dem Ortsnamen bezeichnet die räumliche Erstreckung bis zum Ziel. „Bis nach Athen“ bewahrt diesen Sinn und ist natürliches Standarddeutsch.
- source_word: λαβόντες ἐντολήν
  choice: Nachdem sie den Auftrag ... erhalten hatten
  rationale: Das Partizip wird als zeitlich vorausgehende Handlung wiedergegeben. ἐντολή kann einen Befehl, Auftrag oder eine Anweisung bezeichnen; „Auftrag“ wahrt den verbindlichen Charakter, ohne unnötig einen autoritären Ton einzutragen.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: für Silas und Timotheus
  rationale: πρός bezeichnet hier die Empfänger des Auftrags. Die deutsche Formulierung ist knapp und verständlich.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: so schnell wie möglich zu ihm zu kommen
  rationale: Der ἵνα-Satz gibt den Inhalt des Auftrags an. „So schnell wie möglich“ bringt den Superlativ τάχιστα und die Dringlichkeit klar zum Ausdruck; „zu ihm“ erhält den ausdrücklichen Rückbezug des griechischen Pronomens.
- source_word: ἐξῄεσαν
  choice: reisten sie ab
  rationale: Das Imperfekt schildert ihr anschließendes Fortgehen. „Reisten sie ab“ passt zum Reisebericht und bezeichnet natürlich das Verlassen Athens.
