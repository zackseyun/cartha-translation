  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: de
  text: Einige Männer aber schlossen sich ihm an und glaubten.[a] Unter ihnen waren auch Dionysius der Areopagit,[b] eine Frau namens Damaris und weitere mit ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „glaubten“. Das griechische Verb nennt hier nicht ausdrücklich, wem oder was sie glaubten.'
    reason: lexical_alternative
  - marker: b
    text: Der Titel kann ein Mitglied des Areopags oder allgemeiner jemanden bezeichnen, der mit diesem Gremium verbunden war. Der Areopag war ein angesehenes athenisches Ratsgremium.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Einige Männer aber
  rationale: τινὲς bezeichnet eine unbestimmte Teilgruppe; ἄνδρες ist ausdrücklich maskulin. Das nachgestellte „aber“ gibt den milden Gegensatz zu den vorherigen Reaktionen wieder und klingt im Deutschen würdevoll und natürlich.
- source_word: κολληθέντες αὐτῷ
  choice: schlossen sich ihm an
  rationale: Das Partizip von κολλάομαι bezeichnet enge Verbindung oder persönliche Zuordnung. „Sich ihm anschließen“ bewahrt den Bezug auf Paulus, ohne ein körperliches „Festhalten“ nahezulegen.
- source_word: ἐπίστευσαν
  choice: kamen zum Glauben
  rationale: Im erzählerischen Kontext bezeichnet der Aorist den Eintritt in den Glauben als Reaktion auf die Verkündigung. Die Formulierung lässt das im Griechischen nicht ausdrücklich genannte Objekt des Glaubens offen.
- source_word: ἐν οἷς καὶ
  choice: Unter ihnen waren auch
  rationale: Die Wendung führt namentlich genannte Beispiele aus der zuvor bezeichneten Gruppe ein; „auch“ bewahrt den additiven Wert von καί.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: Dionysius, ein Mitglied des Areopags
  rationale: Ἀρεοπαγίτης bezeichnet Dionysius durch seine Beziehung zum Areopag. Die erklärende deutsche Wiedergabe ist für heutige Leser verständlicher als das seltene Fremdwort „Areopagit“, ohne die historische Zuordnung unnötig auszubauen.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: eine Frau namens Damaris
  rationale: Direkte, idiomatische Wiedergabe, die Geschlecht und Eigenname ausdrücklich erhält.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: andere mit ihnen
  rationale: Die knappe Wiedergabe erhält sowohl die zusätzlichen Personen als auch die durch σύν ausgedrückte Gemeinschaft mit den Genannten.
theological_decisions:
- issue: Bedeutung von πιστεύω im Kontext
  choice: kamen zum Glauben
  alternative: glaubten
  rationale: Die gewählte Wendung gibt die punktuelle Reaktion auf die Verkündigung natürlich wieder. Sie nennt weder Paulus noch eine ausgeführte Glaubensformel als Objekt und trägt daher keine zusätzliche dogmatische Bestimmung in den Text ein.
- issue: Bezug von κολληθέντες αὐτῷ und ἐπίστευσαν
  choice: Die persönliche Verbindung gilt Paulus; das Objekt des Glaubens bleibt unausgesprochen.
  alternative: Sie glaubten an Paulus.
  rationale: Das Pronomen αὐτῷ gehört grammatisch zu κολληθέντες. Es darf nicht zum Objekt von ἐπίστευσαν gemacht werden; die Übersetzung wahrt diese Unterscheidung.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Erzählstil. Die Satzfolge bleibt nah am griechischen Aufbau, wird aber durch zwei Hauptsätze lesbarer. Seltene kirchliche Fachsprache wie „Areopagit“ wird im Haupttext vermieden; die verbleibende historische Mehrdeutigkeit wird in der Fußnote ausgewiesen.
