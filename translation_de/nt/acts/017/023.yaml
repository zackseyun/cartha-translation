source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: de
  text: 'Denn als ich umherging und die Gegenstände eurer religiösen Verehrung genau betrachtete, fand ich sogar einen Altar mit der Inschrift: »Einem unbekannten Gott.«[a] Was ihr nun verehrt, ohne es zu kennen,[b] das verkünde ich euch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dem unbekannten Gott.« Im Griechischen steht kein Artikel; je nach Verständnis ist im Deutschen sowohl die unbestimmte als auch die bestimmte Form möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wen ihr verehrt, ohne ihn zu kennen.« Im Griechischen steht jedoch das sächliche Relativpronomen („was“), nicht das männliche („wen“).'
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: als ich umherging
  rationale: Das präsentische Partizip wird als natürliche deutsche Temporalkonstruktion wiedergegeben, ohne den im Griechischen nicht ausdrücklich genannten Ort zu ergänzen.
- source_word: ἀναθεωρῶν
  choice: genau betrachtete
  rationale: Die Form bezeichnet aufmerksames Betrachten und mehr als einen flüchtigen Blick.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: die Gegenstände eurer religiösen Verehrung
  rationale: Die Formulierung bewahrt die Breite des griechischen Ausdrucks für religiös verehrte Gegenstände oder Kultobjekte und vermeidet die engere Festlegung auf Heiligtümer oder Götterbilder.
- source_word: βωμόν
  choice: Altar
  rationale: Dies ist die übliche und kontextgerechte Entsprechung für einen Kultaltar.
- source_word: ἐπεγέγραπτο
  choice: mit der Inschrift
  rationale: Die idiomatische deutsche Wendung gibt den Zustand wieder, der aus dem vorherigen Anbringen der Aufschrift hervorgegangen ist.
- source_word: Ἀγνώστῳ θεῷ
  choice: Einem unbekannten Gott
  rationale: Der griechische Widmungstext hat keinen Artikel; die indefinite deutsche Fassung ist natürlich und wahrt diese Offenheit.
- source_word: ὃ οὖν
  choice: Was ihr nun
  rationale: „Was“ erhält das Neutrum des Relativpronomens; „nun“ gibt den folgernden Übergang von οὖν natürlich wieder.
- source_word: ἀγνοοῦντες
  choice: ohne es zu kennen
  rationale: Die Wendung beschreibt die Unkenntnis, in der die Verehrung geschieht, und stellt zugleich den sprachlichen Bezug zu „unbekannt“ her.
- source_word: εὐσεβεῖτε
  choice: verehrt
  rationale: „Verehren“ bezeichnet hier verständlich die religiöse Ehrerbietung, ohne die Bedeutung stärker als nötig festzulegen.
- source_word: καταγγέλλω
  choice: verkünde
  rationale: Das Verb bezeichnet eine öffentliche, nachdrückliche Bekanntmachung und passt zum Charakter der Rede.
theological_decisions:
- issue: Bezug des neutralen Relativpronomens ὃ
  choice: „Was ihr nun verehrt, ohne es zu kennen“
  alternative: „Wen ihr verehrt, ohne ihn zu kennen“
  rationale: Das griechische Relativpronomen steht im Neutrum. Die gewählte Fassung bewahrt diese grammatische und theologische Spannung und personalisiert den Bezug nicht stärker als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt rhetorisch und für eine öffentliche Rede geeignet; fachsprachliche oder konfessionell geprägte Ausdrücke werden vermieden.
