  variant: modern standard German
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: de
  text: damit sie Gott suchen, ob sie vielleicht nach ihm tasten und ihn finden könnten – und doch ist er keinem Einzigen von uns fern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητεῖν
  choice: damit sie Gott suchen
  rationale: Der Infinitiv hängt vom vorausgehenden Satz ab und bezeichnet Ziel beziehungsweise beabsichtigte Folge; ein deutscher damit-Satz gibt diese Funktion natürlich wieder.
- source_word: εἰ ἄρα γε
  choice: ob sie ihn vielleicht
  rationale: „Ob … vielleicht“ bewahrt den tastenden, ungewissen Charakter der griechischen Partikelfolge, ohne die Suche als aussichtslos darzustellen.
- source_word: ψηλαφήσειαν
  choice: ertasten
  rationale: Das Verb bezeichnet ein Suchen oder Wahrnehmen durch Berührung. „Ertasten“ erhält das Bild eingeschränkter Wahrnehmung und klingt im modernen Deutsch natürlicher als „nach ihm tasten“ in dieser Satzstellung.
- source_word: καὶ εὕροιεν
  choice: und finden könnten
  rationale: Beide Optative stehen zusammen unter der durch εἰ eingeleiteten Möglichkeit; „könnten“ trägt diese modale Bedeutung für beide Verben.
- source_word: καί γε
  choice: obwohl … doch
  rationale: 'Die Formulierung leitet hier eine nachdrückliche, konz essive Klarstellung ein: Trotz der unsicheren menschlichen Suche ist Gott tatsächlich nahe.'
- source_word: οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: keinem Einzigen von uns fern
  rationale: Diese Wiedergabe bewahrt die verneinte Distanz und die distributive Betonung von ἑνὸς ἑκάστου in idiomatischem Deutsch.
- source_word: ὑπάρχοντα
  choice: er … ist
  rationale: Das Partizip sagt die wirkliche Nähe Gottes aus; im Deutschen wird die prädikative Aussage natürlich durch ein finites „ist“ ausgedrückt.
theological_decisions:
- issue: Gottes Nähe und die Unsicherheit menschlichen Suchens
  choice: Die menschliche Suche bleibt mit „ob … vielleicht … könnten“ tastend und ungewiss, während „obwohl er doch … nicht fern ist“ Gottes tatsächliche Nähe bekräftigt.
  alternative: Die Suchbewegung glätten und lediglich von „Gott finden“ sprechen oder umgekehrt das Suchen als nahezu aussichtslos formulieren.
  rationale: Der griechische Text hält begrenzte menschliche Wahrnehmung und wirkliche göttliche Nähe zusammen. Die Übersetzung bewahrt diese Spannung, statt sie zugunsten einer Seite aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ertasten“ erhält die konkrete Metapher, während „keinem Einzigen von uns fern“ die individuelle Reichweite der Aussage betont.
