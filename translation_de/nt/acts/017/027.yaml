  rationale: Die Revision ersetzt das ergebnisorientierte „ertasten“ durch „nach ihm tasten“, damit das Bild des unsicheren Suchens durch Tasten und die anschließende Möglichkeit des Findens klar unterschieden bleiben. „Und doch“ bewahrt den nachdrücklich-kontrastiven Anschluss von καί γε, ohne die Aussage stärker zu harmonisieren als der griechische Text.
