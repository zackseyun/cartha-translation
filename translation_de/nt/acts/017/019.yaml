source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: de
  text: 'Da ergriffen sie ihn und führten ihn zum Areopag[a]. Sie fragten: »Können wir erfahren, was diese neue Lehre ist, die du vorträgst?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Areopag“ kann den Areshügel selbst oder den mit ihm verbundenen Rat bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: nahmen sie ihn mit
  rationale: Das Verb bezeichnet ein Ergreifen oder Sich-Annehmen und kann auch ein Mitnehmen ausdrücken. Die Formulierung wahrt die körperliche Initiative, ohne die Szene vorschnell als gewaltsame Festnahme zu deuten.
- source_word: τε
  choice: Da
  rationale: Die schwache Verknüpfung führt die Erzählung aus dem vorhergehenden Vers fort; „Da“ ist im Deutschen flüssig und markiert diesen Fortgang.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: zum Areopag
  rationale: Der Eigenname lässt offen, ob vor allem der Hügel oder das mit ihm verbundene Gremium gemeint ist.
- source_word: ἤγαγον
  choice: führten
  rationale: ἄγω bedeutet hier führen oder bringen; zusammen mit „zum Areopag“ ist „führten“ natürlich und nah am griechischen Ausdruck.
- source_word: λέγοντες
  choice: Sie sagten
  rationale: Die Auflösung des Partizips in einen selbstständigen Satz entspricht natürlichem modernem Deutsch, ohne den gleichzeitigen Zusammenhang zu verändern.
- source_word: Δυνάμεθα γνῶναι
  choice: Können wir erfahren
  rationale: Die Wendung ist als höfliche Bitte um Auskunft zu verstehen. „Erfahren“ gibt γνῶναι in diesem Zusammenhang idiomatisch wieder.
- source_word: καινὴ
  choice: neue
  rationale: „Neu“ deckt den weiten Sinn von καινός ab, ohne zusätzlich eine abwertende Nuance wie „neuartig“ oder „sonderbar“ einzutragen.
- source_word: ἡ ὑπὸ σοῦ λαλουμένη
  choice: die du vorträgst
  rationale: Die aktive deutsche Form gibt den griechischen Passivgedanken natürlich wieder. „Vortragen“ passt zu einer öffentlich dargelegten Lehre, ohne es auf förmliche Verkündigung einzuengen.
- source_word: διδαχή
  choice: Lehre
  rationale: „Lehre“ ist im Kontext einer inhaltlichen Botschaft prägnant und allgemein verständlich; „Doktrin“ wäre unnötig technisch.
theological_decisions:
- issue: Art des Mitnehmens zum Areopag
  choice: Bestimmtes Mitnehmen, aber nicht ausdrücklich als Festnahme bezeichnet
  alternative: Gewaltsames Ergreifen oder lediglich höfliche Einladung
  rationale: ἐπιλαμβάνομαι kann körperliches Ergreifen bezeichnen, doch der unmittelbare Zusammenhang nennt Neugier und keine formelle Anklage. „nahmen sie ihn mit“ hält den Grad des Zwangs offen.
- issue: Bedeutung von Ἄρειος Πάγος
  choice: Eigenname „Areopag“, ohne Festlegung auf Ort oder Gremium
  alternative: Areshügel als reiner Ortsname oder der Areopag als Ratsgremium
  rationale: Der griechische Ausdruck kann sowohl den Hügel als auch den damit verbundenen Rat bezeichnen. Die Übersetzung bewahrt diese historische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist höflich und verständlich formuliert; unnötig technische oder konfessionell geprägte Begriffe werden vermieden.
