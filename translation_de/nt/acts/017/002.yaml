  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: de
  text: Wie Paulus es gewohnt war, ging er zu ihnen hinein, und an drei Sabbaten erörterte er mit ihnen anhand der Schriften[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führte mit ihnen Gespräche“; auch: „argumentierte mit ihnen anhand der Schriften“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: Wie es für Paulus üblich war
  rationale: Die Wendung bezeichnet eine feste Gewohnheit. Diese Formulierung gibt den habituellen Sinn natürlich und ohne unnötige Erweiterung wieder.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: ging er zu ihnen hinein
  rationale: Die Übersetzung bewahrt sowohl die durch εἰσέρχομαι ausgedrückte Bewegung nach innen als auch die durch πρὸς αὐτούς bezeichnete Ausrichtung auf die bereits im Kontext genannten Personen.
- source_word: ἐπὶ σάββατα τρία
  choice: an drei Sabbaten
  rationale: ἐπί mit dem Akkusativ bezeichnet hier die zeitliche Erstreckung beziehungsweise wiederholte Anlässe; die deutsche Wendung beschreibt drei einzelne Sabbattage idiomatisch.
- source_word: διελέξατο αὐτοῖς
  choice: sprach … mit ihnen
  rationale: διαλέγομαι bezeichnet hier ein erörterndes, argumentierendes Gespräch. „sprach mit ihnen“ ist im heutigen Deutsch natürlich und lässt den dialogischen Charakter erkennen; eine Fußnote nennt präzisierende Alternativen.
- source_word: ἀπὸ τῶν γραφῶν
  choice: anhand der Schriften
  rationale: ἀπό bezeichnet die Schriften als Ausgangspunkt und Grundlage der Darlegung. „die Schriften“ gibt den im jüdisch-christlichen Kontext gemeinten anerkannten Bestand heiliger Schriften wieder, ohne das Adjektiv „heilig“ hinzuzufügen.
theological_decisions:
- issue: Bezugswort von „ihnen“ bei Paulus’ Synagogentätigkeit
  choice: Das Pronomen „ihnen“ bleibt im Haupttext erhalten.
  alternative: „in die Synagoge“ oder „zu den Juden dort“
  rationale: Der unmittelbare Zusammenhang macht den Synagogenkontext deutlich, doch der griechische Vers selbst verwendet Pronomen. Die Übersetzung fügt daher keine ausdrücklichere Personengruppe ein.
- issue: Charakter von Paulus’ Tätigkeit
  choice: „sprach … mit ihnen“ mit einer Fußnote zu „erörterte“ und „argumentierte“
  alternative: Nur „argumentierte mit ihnen“ oder „predigte ihnen“
  rationale: Das Verb umfasst Gespräch und begründende Darlegung. Die gewählte Form vermeidet sowohl den möglichen modernen Beiklang eines Streits als auch die einseitige Festlegung auf eine monologische Predigt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Sabbaten“ und „Schriften“ bewahren den historischen und religiösen Kontext; der Satz bleibt nah an der griechischen Struktur, ohne im Deutschen steif zu wirken.
