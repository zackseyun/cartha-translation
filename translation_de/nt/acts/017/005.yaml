  naturalness: Der Text ist gut verständliches modernes Standarddeutsch. »Einige üble Männer vom Marktplatz zu sich nehmen« wirkt jedoch leicht unidiomatisch, weil »zu sich nehmen« im Deutschen andere Assoziationen haben kann. »Mitnehmen« ist hier natürlicher. Die Satzverbindung mit Semikolon bildet die griechische Abfolge ohne das nicht eigens markierte »Dann« ab.
  terminology: »Die Juden«, »Mob« und »Bürgerversammlung« sind im gegebenen Kontext vertretbar. »Bürgerversammlung« gibt den öffentlichen, politischen Charakter von δῆμος angemessen wieder; die Fußnote bewahrt die lexikalischen Alternativen.
