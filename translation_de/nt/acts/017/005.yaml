source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: de
  text: Die Juden aber wurden eifersüchtig, nahmen einige üble Männer vom Marktplatz mit, brachten einen Mob zusammen und versetzten die Stadt in Aufruhr; sie gingen zu Jasons Haus und versuchten, sie aus dem Haus vor die Bürgerversammlung[a] zu führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor die öffentliche Versammlung« beziehungsweise »vor das Volk«. Das griechische Wort bezeichnet hier die öffentlich versammelte Bürgerschaft, nicht bloß eine unbestimmte Menschenmenge.'
    reason: lexikalische Alternative und Erläuterung des institutionellen Sinns von δῆμος
lexical_decisions:
- source_word: ζηλώσαντες
  choice: wurden eifersüchtig
  rationale: 'Das Aoristpartizip bezeichnet hier den Beweggrund für die folgenden Handlungen und lässt sich ingressiv verstehen: Sie wurden eifersüchtig.'
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Der griechische Text nennt sie schlicht »die Juden«; der Kontext begrenzt den Bezug auf die hier handelnde Gruppe in Thessalonich, ohne dass der Ausdruck im Haupttext enger gefasst werden sollte.
- source_word: προσλαβόμενοι
  choice: nahmen … zu sich
  rationale: Das mediale Partizip bezeichnet, dass sie weitere Personen zu sich nahmen; die Formulierung vermeidet die nicht ausdrücklich belegte Vorstellung einer formellen Anwerbung.
- source_word: τῶν ἀγοραίων
  choice: vom Marktplatz
  rationale: Der Ausdruck bezeichnet Personen aus dem Umfeld der Agora beziehungsweise des öffentlichen Marktplatzes; abwertende Zusätze wie »Herumtreiber« wären stärker interpretierend.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: einige üble Männer
  rationale: »Männer« bewahrt die konkrete Personenbezeichnung; »übel« gibt die negative moralische Wertung von πονηρός in natürlichem modernem Deutsch wieder.
- source_word: ὀχλοποιήσαντες
  choice: brachten einen Mob zusammen
  rationale: Das seltene Verb bedeutet, eine Menschenmenge zusammenzubringen; im Zusammenhang einer gezielten gewaltsamen Unruhe gibt »Mob« die feindselige Färbung wieder.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: versetzten die Stadt in Aufruhr
  rationale: Die Formulierung gibt die fortdauernde, die ganze Stadt erfassende Unruhe des Imperfekts anschaulich und idiomatisch wieder.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: zogen sie vor Jasons Haus
  rationale: ἐφίστημι bezeichnet hier das Herankommen beziehungsweise Auftreten am Haus. »Zogen vor« lässt die feindselige Situation erkennen, ohne ausdrücklich einen Angriff zu behaupten.
- source_word: ἐζήτουν
  choice: versuchten
  rationale: Mit folgendem Infinitiv bezeichnet ζητέω das anhaltende Bestreben, die genannte Handlung auszuführen; »versuchten« ist hier natürliches Deutsch.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen bleibt wie im Griechischen stehen, statt seine aus dem Kontext erschließbaren Bezugspersonen ausdrücklich zu benennen.
- source_word: προαγαγεῖν
  choice: zu bringen
  rationale: Das Verb meint, jemanden heraus- oder vorzuführen; zusammen mit dem Ziel »vor die Bürgerversammlung« ist »bringen« im Deutschen klar und nicht überbestimmt.
- source_word: εἰς τὸν δῆμον
  choice: vor die Bürgerversammlung
  rationale: δῆμος bezeichnet hier die öffentlich versammelte Bürgerschaft als politisches Organ, nicht bloß eine unbestimmte Menschenmenge. »Vor« entspricht idiomatisch dem Vorführen vor dieses Gremium.
theological_decisions:
- issue: Wiedergabe von οἱ Ἰουδαῖοι in einem Konfliktbericht
  choice: die Juden
  alternative: die jüdischen Führer; die Judäer
  rationale: Die Übersetzung folgt der Quellenformulierung und engt den Ausdruck nicht auf Führungspersonen ein. Aus dem Erzählzusammenhang ist dennoch klar, dass die konkret handelnde Gruppe gemeint ist und keine pauschale Aussage über alle Juden gemacht wird.
- issue: Institutioneller oder allgemeiner Sinn von δῆμος
  choice: Bürgerversammlung
  alternative: Volk; öffentliche Versammlung
  rationale: Im städtischen Kontext Thessalonichs bezeichnet δῆμος die politisch versammelte Bürgerschaft. Die institutionelle Bedeutung sollte nicht zu einer bloßen Menge verflacht werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge wird zur Lesbarkeit in zwei Hauptsätze gegliedert. »Mob« ist ein eingebürgertes, prägnantes Wort für eine feindselige zusammengerottete Menge; »Bürgerversammlung« bewahrt den antiken öffentlichen und politischen Charakter des δῆμος.
