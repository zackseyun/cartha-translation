  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: de
  text: Daher kamen viele von ihnen zum Glauben, und auch nicht wenige angesehene griechische Frauen sowie Männer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bezogen auf die griechischen Frauen: „gesellschaftlich hochstehende“ oder „achtbare“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Daher ... viele
  rationale: μὲν οὖν leitet eine Folgerung aus der in Vers 11 beschriebenen Prüfung der Schriften ein. „Daher“ gibt diesen Zusammenhang in natürlichem Deutsch wieder, ohne die Partikeln einzeln übermäßig abzubilden.
- source_word: ἐξ αὐτῶν
  choice: von ihnen
  rationale: Die Wendung ist partitiv und verweist auf die zuvor genannten Menschen in Beröa zurück. „Viele von ihnen“ ist im Deutschen idiomatisch.
- source_word: ἐπίστευσαν
  choice: kamen ... zum Glauben
  rationale: Im Deutschen könnte das bloße „glaubten“ ohne genanntes Objekt missverständlich wirken. „Zum Glauben kommen“ gibt hier den inchoativen Gebrauch von πιστεύω natürlich wieder, ohne ein im Vers nicht ausdrücklich genanntes Glaubensobjekt hinzuzufügen.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: der ... griechischen Frauen
  rationale: Ἑλληνίδων bezeichnet die Frauen als Griechinnen; γυναικῶν bedeutet hier „Frauen“, da keine eheliche Beziehung angesprochen wird.
- source_word: τῶν εὐσχημόνων
  choice: angesehenen
  rationale: εὐσχήμων bezeichnet hier gesellschaftliches Ansehen beziehungsweise eine respektierte Stellung. „Angesehen“ ist prägnant, modern und lässt offen, ob vor allem Rang oder allgemeine gesellschaftliche Achtung gemeint ist.
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: ebenso nicht wenige ... Männer
  rationale: „Nicht wenige“ bewahrt die lukanische Litotes οὐκ ὀλίγοι. Die deutsche Wortstellung verbindet Männer und Frauen natürlich, ohne die Aussage zu „viele“ einzuebnen.
- source_word: καὶ
  choice: ebenso
  rationale: Das zweite καί fügt neben den zuerst genannten Menschen eine weitere Gruppe hinzu. „Ebenso“ macht diese additive Funktion im Deutschen flüssig deutlich.
theological_decisions:
- issue: Ob ἐπίστευσαν durch ausdrücklich christologische oder lehrhafte Sprache ergänzt werden soll
  choice: kamen zum Glauben
  alternative: glaubten an den Messias / glaubten der Botschaft
  rationale: Das Glaubensobjekt ergibt sich aus dem Zusammenhang, wird in diesem Vers aber nicht ausdrücklich genannt. Die Übersetzung wahrt dies und fügt keine weitergehende Lehrformulierung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Litotes „nicht wenige“ bleibt erhalten. „Angesehen“ wahrt die Bedeutungsbreite von εὐσχήμων zwischen gesellschaftlichem Rang und allgemeiner Achtbarkeit; die Alternative wird in der Fußnote ausgewiesen.
