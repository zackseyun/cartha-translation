id: ACT.17.29
reference: Acts 17:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: de
  text: Da wir also Gottes Nachkommen sind, sollten wir nicht meinen, das Göttliche[a] sei Gold, Silber oder Stein gleich – einem Bildwerk[b], das durch menschliche Kunstfertigkeit und Vorstellungskraft geschaffen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Gottheit“, „das göttliche Wesen“ oder „die göttliche Natur“. Das griechische τὸ θεῖον ist eine weit gefasste Bezeichnung für das Göttliche; in Paulus’ Argument bezieht sie sich auf den wahren Gott.
    reason: lexical_alternative
  - marker: b
    text: Oder „einem Schnitzwerk“, „einem eingravierten Werk“ oder „einem geprägten Bild“.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: von Gott abstammen
  rationale: Die prädikative Wendung γένος ... τοῦ θεοῦ bezeichnet Herkunft beziehungsweise Verwandtschaft. Die verbale Formulierung ist im Deutschen natürlicher als „Gottes Geschlecht“ und vermeidet ethnische oder biologische Engführungen.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet den Schluss aus der vorhergehenden Aussage und fügt sich natürlich in den deutschen Satz ein.
- source_word: ὑπάρχοντες
  choice: da wir ... abstammen
  rationale: Das Partizip hat hier kausale Funktion; „da“ macht diesen Zusammenhang deutlich.
- source_word: οὐκ ὀφείλομεν
  choice: dürfen wir nicht
  rationale: Drückt hier die aus dem Argument folgende Unangemessenheit beziehungsweise Verpflichtung aus. „Wir sollten nicht“ wäre schwächer, „wir sind nicht verpflichtet“ würde den Sinn verfehlen.
- source_word: νομίζειν
  choice: meinen
  rationale: Gibt das urteilende Denken oder Annehmen in idiomatischem modernem Deutsch wieder.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: Gold oder Silber oder Stein
  rationale: Bewahrt die drei ausdrücklich genannten Materialien und die wiederholte Alternative des Griechischen.
- source_word: χαράγματι
  choice: einem Gebilde
  rationale: Bezeichnet ein durch Gravieren, Schnitzen oder Prägen hervorgebrachtes Werk. „Gebilde“ lässt die genaue Herstellungsart offen und passt syntaktisch zur Apposition.
- source_word: τέχνης
  choice: Kunstfertigkeit
  rationale: Bezeichnet menschliches Können, Handwerk oder Kunst und wahrt sowohl den gestalterischen als auch den handwerklichen Aspekt.
- source_word: ἐνθυμήσεως
  choice: Vorstellungskraft
  rationale: Bezeichnet einen Gedanken, Entwurf oder eine geistige Vorstellung; „Vorstellungskraft“ macht den mentalen Anteil an der Herstellung verständlich, ohne ihn auf bloße Fantasie zu reduzieren.
- source_word: ἀνθρώπου
  choice: menschlicher
  rationale: Gibt den generischen Singular natürlich wieder und bezieht sich auf menschliche Urheberschaft allgemein.
- source_word: τὸ θεῖον
  choice: das Göttliche
  rationale: Bewahrt die substantivierte neutrale und philosophisch weite Ausdrucksweise des Griechischen. Im Kontext bezeichnet sie den wahren Gott, ohne den Ausdruck unnötig zu personalisieren oder metaphysisch festzulegen.
theological_decisions:
- issue: Wiedergabe von τὸ θεῖον in einer monotheistischen, philosophisch formulierten Rede
  choice: das Göttliche
  alternative: die Gottheit; das göttliche Wesen; die göttliche Natur
  rationale: „Das Göttliche“ entspricht Form und Weite des griechischen substantivierten Adjektivs und erhält die Spannung zwischen der für das Areopag-Publikum anschlussfähigen Ausdrucksweise und Paulus’ Bezug auf den wahren Gott. „Die Gottheit“ könnte stärker als konkrete Gottheit oder Fachbegriff verstanden werden; „das göttliche Wesen“ wäre personalisierender, „die göttliche Natur“ metaphysisch enger.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung hält den argumentativen Schlusscharakter fest; „Kunstfertigkeit und Vorstellungskraft“ verbindet handwerkliche Herstellung und geistigen Entwurf. Beide Fußnotenmarker stehen unmittelbar bei den erklärten Ausdrücken.
