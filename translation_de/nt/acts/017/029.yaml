revisions:
- from: Da wir also von Gott abstammen, dürfen wir nicht meinen, das Göttliche[a] gleiche Gold oder Silber oder Stein, einem Gebilde[b] menschlicher Kunstfertigkeit und Vorstellungskraft.
  to: Da wir also Gottes Nachkommen sind, sollten wir nicht meinen, das Göttliche[a] sei Gold, Silber oder Stein gleich – einem Bildwerk[b], das durch menschliche Kunstfertigkeit und Vorstellungskraft geschaffen ist.
  rationale: Die Revision klärt die im Deutschen missverständliche dative Vergleichs- und Erläuterungskonstruktion, ohne die griechische bildhafte Verdichtung aufzulösen. „Das Göttliche“ und die dazugehörige Anmerkung erhalten die lexikalische und theologische Offenheit von τὸ θεῖον; die Satzfassung macht zugleich deutlich, dass es um ein menschlich hergestelltes Bildwerk geht.
