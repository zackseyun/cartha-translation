source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: de
  text: Als Paulus in Athen auf sie wartete, wurde sein Geist in ihm erregt[a], weil er sah, dass die Stadt voller Götzenbilder war[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde er innerlich aufgewühlt“; das griechische Verb bezeichnet eine scharfe innere Aufwallung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass die Stadt ganz dem Götzendienst ergeben war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: auf sie wartete
  rationale: Das Partizip bezeichnet den andauernden Umstand, während dessen die Handlung des Hauptsatzes einsetzt; die Formulierung ist im modernen Deutsch natürlich.
- source_word: παρωξύνετο
  choice: wurde … aufgebracht
  rationale: Das Imperfekt gibt eine sich vollziehende innere Reaktion wieder; „aufgebracht“ bewahrt die Schärfe der Erregung, ohne sie auf bloße Traurigkeit oder Ärger zu verengen.
- source_word: τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ
  choice: in seinem Innersten
  rationale: Die Wendung bezeichnet hier Paulus’ eigenes inneres Erleben. Die idiomatische deutsche Formulierung vermeidet die schwerfällige Doppelung „sein Geist in ihm“, ohne den Heiligen Geist als Handelnden einzutragen.
- source_word: θεωροῦντος
  choice: als er sah
  rationale: Das Partizip beschreibt die gleichzeitige, aufmerksame Wahrnehmung; „als er sah“ ist knapp und natürlich.
- source_word: κατείδωλον
  choice: voller Götzenbilder
  rationale: Das seltene Adjektiv beschreibt die Stadt als von Kultbildern angefüllt. „Götzenbilder“ gibt den konkreten Bezug besser wieder als das abstraktere „Götzen“; eine alternative Deutung wird in der Fußnote bewahrt.
- source_word: πόλιν
  choice: die Stadt
  rationale: Die ausdrückliche Wiederaufnahme als „die Stadt“ bleibt erhalten und verweist eindeutig auf das zuvor genannte Athen.
- source_word: δὲ
  choice: Während
  rationale: Die leichte narrative Weiterführung wird durch den temporalen Satzanschluss natürlich aufgenommen; ein zusätzliches „nun“ ist im Deutschen nicht nötig.
theological_decisions:
- issue: Bezug von τὸ πνεῦμα αὐτοῦ
  choice: Paulus’ eigenes Inneres
  alternative: eine Anspielung auf das Wirken des Heiligen Geistes
  rationale: Das Possessivpronomen und die zusätzliche Wendung ἐν αὐτῷ stellen Paulus’ innere Reaktion in den Vordergrund. Eine ausdrückliche Zuschreibung an den Heiligen Geist sollte nicht in die Übersetzung eingetragen werden.
- issue: Wertung von κατείδωλον
  choice: konkrete Fülle von Götzenbildern
  alternative: die Stadt war dem Götzendienst ergeben
  rationale: Die konkrete Wiedergabe bleibt näher an der Bildlichkeit des Adjektivs; die stärker deutende Alternative wird als Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
