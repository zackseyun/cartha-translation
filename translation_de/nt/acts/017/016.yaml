revisions:
- from: Während Paulus in Athen auf sie wartete, wurde er in seinem Innersten aufgebracht[a], als er sah, dass die Stadt voller Götzenbilder war[b].
  to: Als Paulus in Athen auf sie wartete, wurde sein Geist in ihm erregt[a], weil er sah, dass die Stadt voller Götzenbilder war[b].
  rationale: Die Revision stellt „sein Geist“ für τὸ πνεῦμα αὐτοῦ wieder her und bewahrt mit „in ihm“ die ausdrücklich innere Lokalisierung. „Wurde … erregt“ gibt die starke, sich vollziehende innere Reaktion wieder. Der kausale Anschluss macht deutlich, dass Paulus’ Wahrnehmung der idolatrischen Stadt diese Reaktion auslöst; die konkrete Bildsprache „voller Götzenbilder“ und die alternative Deutung bleiben erhalten.
