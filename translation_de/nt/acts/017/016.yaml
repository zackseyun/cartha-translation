  source_fidelity: Die Wiedergabe trifft den zeitlichen Umstand des Wartens, die fortdauernde innere Reaktion und die Beschreibung Athens als von Kultbildern erfüllt grundsätzlich gut. Allerdings fasst „er in seinem Innersten“ τὸ πνεῦμα αὐτοῦ zu frei und lässt den im Ausgangstext ausdrücklich genannten „Geist“ verschwinden.
  naturalness: Der Entwurf ist insgesamt gut verständlich. Die Abfolge „Während …, wurde er …, als er sah“ häuft jedoch temporale Anschlüsse. Eine leichte Umstellung verbessert den Satzfluss.
  terminology: „Götzenbilder“ gibt κατείδωλον sachgerecht und konkret wieder. Für τὸ πνεῦμα αὐτοῦ sollte auch im Deutschen „Geist“ stehen; dies wahrt zugleich, ohne den Heiligen Geist einzutragen, den Ausdruck des Textes.
