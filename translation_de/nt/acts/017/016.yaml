    rationale: „Während … als er sah“ ist nicht unverständlich, aber stilistisch weniger glatt. Die Wahrnehmung kann mit „weil er sah“ als Auslöser der inneren Reaktion angeschlossen werden, ohne den Sachverhalt zu verändern.
