source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: de
  text: 'Paulus stand in der Mitte des Areopags und sagte: »Ihr Männer von Athen, ich sehe, dass ihr in jeder Hinsicht sehr religiös seid.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »abergläubisch«; auch: »religiöser«. Das griechische Wort kann sowohl negativ als auch positiv verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς δὲ
  choice: Da trat Paulus
  rationale: Das aoristische Partizip mit δέ führt die Szene und den nächsten Erzählungsschritt ein. »Da trat« ist im Deutschen natürlich und gibt das Einnehmen des Standorts wieder, ohne den Aspekt zu überdehnen.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: in die Mitte des Areopags
  rationale: Die Wendung wird räumlich verstanden und bewahrt damit die im Griechischen offene Möglichkeit, dass sowohl der Ort als auch die dort versammelte Körperschaft mitschwingt. »Vor den Areopag« wäre stärker institutionell deutend.
- source_word: Ἀρείου Πάγου
  choice: Areopag
  rationale: Die im Deutschen etablierte, direkt auf die griechische Bezeichnung zurückgehende Namensform wird gegenüber dem kulturell ersetzenden »Areshügel« bevorzugt.
- source_word: ἔφη
  choice: sagte
  rationale: Das Imperfekt von φημί dient hier als gewöhnliche Redeeinleitung; »sagte« ist idiomatisch und sachlich.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Ihr Männer von Athen
  rationale: Die Anrede wahrt die ausdrücklich männliche Form ἄνδρες und klingt im modernen Deutschen würdevoll und verständlich.
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Die Formulierung gibt den umfassenden Bezug idiomatisch wieder.
- source_word: ὡς
  choice: dass
  rationale: In Verbindung mit θεωρῶ leitet ὡς hier den wahrgenommenen Sachverhalt ein; »dass« ist dafür im Deutschen die natürliche Entsprechung.
- source_word: δεισιδαιμονεστέρους
  choice: sehr religiös
  rationale: Der Komparativ kann je nach Kontext anerkennend oder abwertend verstanden werden. »Sehr religiös« gibt die steigernde Bedeutung idiomatisch wieder, ohne den Ton vorschnell negativ festzulegen; die Alternativen stehen in der Fußnote.
- source_word: θεωρῶ
  choice: ich sehe
  rationale: Das Verb bezeichnet hier beobachtendes Wahrnehmen. »Ich sehe« ist knapp, natürlich und passt zur gesprochenen Rede.
theological_decisions:
- issue: Ton von Paulus’ Beschreibung der athenischen Religiosität mit δεισιδαιμονεστέρους
  choice: Im Haupttext relativ neutral als »sehr religiös« wiedergeben
  alternative: »abergläubisch« oder wörtlicher-komparativ »religiöser«
  rationale: Das griechische Wort lässt sowohl eine anerkennende als auch eine kritische Nuance zu und kann am Beginn der Rede bewusst taktvoll gewählt sein. Eine eindeutig negative Übersetzung würde diese Spannung auflösen; die Fußnote bewahrt die möglichen Lesarten.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdevoller Redeeinleitung. Die traditionelle Anrede »Ihr Männer von Athen« erhält die Form des griechischen Vokativs. Die zentrale Bedeutungsambivalenz wird im Haupttext nicht negativ festgelegt und in der Fußnote ausdrücklich dokumentiert.
