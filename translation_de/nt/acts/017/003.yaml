id: ACT.17.3
reference: Acts 17:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: de
  text: Er erklärte und legte dar, dass der Messias[a] leiden und von den Toten auferstehen musste[b] und dass dieser Jesus, den ich euch verkünde, der Messias ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“; ebenso beim zweiten Vorkommen von „Messias“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „von den Toten auferweckt werden“. Im Griechischen steht hier der aktive Infinitiv „auferstehen“, während das Neue Testament an anderen Stellen auch davon spricht, dass Gott Jesus auferweckt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: erklärte
  rationale: Das Partizip bezeichnet hier das Erschließen beziehungsweise verständliche Auslegen des schriftgemäßen Zusammenhangs. „Erklärte“ ist natürlich und überträgt die Aussage, ohne ein im Vers unausgesprochenes Objekt einzufügen.
- source_word: παρατιθέμενος
  choice: legte dar
  rationale: Das Verb beschreibt, wie Paulus seine Belege und Argumente vorbrachte. „Legte dar“ bewahrt diesen argumentativen Sinn, ohne einen streng formalen Beweis zu unterstellen.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: der Messias
  rationale: Χριστός wird an beiden Stellen eindeutig als Titel des erwarteten Gesalbten gebraucht. „Messias“ macht den jüdisch-schriftbezogenen Zusammenhang im Deutschen deutlich.
- source_word: ἔδει
  choice: musste
  rationale: Die unpersönliche Notwendigkeitsform bezeichnet eine in Gottes Plan und der Schrift begründete Notwendigkeit. Das deutsche „musste“ gibt sie knapp und idiomatisch wieder.
- source_word: παθεῖν
  choice: leiden
  rationale: „Leiden“ ist die direkte und im Kontext angemessene Wiedergabe des Infinitivs.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: von den Toten auferstehen
  rationale: Der griechische aktive Infinitiv wird unmittelbar als „auferstehen“ wiedergegeben; ἐκ νεκρῶν entspricht idiomatisch „von den Toten“.
- source_word: καταγγέλλω ὑμῖν
  choice: den ich euch verkünde
  rationale: „Verkünden“ bewahrt den öffentlichen Bekanntmachungscharakter des Verbs und gibt den Dativ ὑμῖν natürlich mit „euch“ wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias an beiden Stellen
  alternative: Christus
  rationale: Die Argumentation identifiziert den erwarteten Gesalbten mit Jesus. „Messias“ hält diesen titularen und jüdisch-schriftbezogenen Sinn erkennbar; die traditionelle Wiedergabe „Christus“ wird in der Fußnote genannt.
- issue: Genus Verbi bei ἀναστῆναι
  choice: von den Toten auferstehen
  alternative: von den Toten auferweckt werden
  rationale: Im griechischen Text steht ein aktiver Infinitiv. Die aktive deutsche Form folgt dieser Formulierung, ohne die anderweitig bezeugte Aussage auszuschließen, dass Gott Jesus auferweckt hat.
- issue: Ich-Form in ὃν ἐγὼ καταγγέλλω ὑμῖν
  choice: den ich euch verkünde
  alternative: den er ihnen verkündete
  rationale: Die unvermittelte Ich-Form des griechischen Wortlauts wird bewahrt. Eine Angleichung an die Er-Erzählung wäre stilistisch glatter, würde jedoch die Perspektive des Ausgangstextes verändernern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben „erklärte und legte dar“ bilden die beiden griechischen Partizipien ab. Der lange dass-Satz bewahrt die syntaktische und argumentative Verbindung der beiden Aussagen sowie den auffälligen Wechsel zur Ich-Form.
