id: ACT.17.4
reference: Acts 17:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: de
  text: Einige von ihnen ließen sich überzeugen und schlossen sich Paulus und Silas an.[a] Auch eine große Zahl gottesfürchtiger Griechen und nicht wenige angesehene Frauen schlossen sich ihnen an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wurden Paulus und Silas zugelost«; gemeint ist, dass sie sich ihnen anschlossen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: Einige von ihnen
  rationale: Die natürliche deutsche Wiedergabe des partitiven Ausdrucks; der Rückbezug auf die Zuhörer in der Synagoge bleibt erhalten.
- source_word: ἐπείσθησαν
  choice: ließen sich überzeugen
  rationale: Gibt das Passiv von πείθω idiomatisch wieder und wahrt den Unterschied zu einem ausdrücklichen Verb für »glauben«.
- source_word: προσεκληρώθησαν
  choice: schlossen sich … an
  rationale: Das seltene Verb bezeichnet hier die Zuordnung beziehungsweise den Anschluss an Paulus und Silas. Diese Wiedergabe ist im modernen Deutsch klar, ohne die Bildlichkeit des Loses in den Haupttext einzutragen.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: Paulus und Silas
  rationale: Der relationale Dativ wird mit dem deutschen Verb »sich anschließen« durch die passende syntaktische Konstruktion wiedergegeben.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: gottesfürchtiger Griechen
  rationale: In der Apostelgeschichte bezeichnet der Ausdruck gewöhnlich Nichtjuden, die den Gott Israels verehrten und dem jüdischen Gottesdienst verbunden waren.
- source_word: πλῆθος πολὺ
  choice: eine große Zahl
  rationale: Natürliche, präzise Mengenangabe, die nicht unnötig das Bild einer versammelten Menschenmenge hervorruft.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: der führenden Frauen
  rationale: πρῶτος bezeichnet hier gesellschaftliche Stellung oder Einfluss, nicht zeitliche Reihenfolge.
- source_word: οὐκ ὀλίγαι
  choice: nicht wenige
  rationale: Bewahrt die für Lukas typische Untertreibung und ihre rhetorische Wirkung.
- source_word: τε … τε
  choice: Dazu kamen … und
  rationale: Macht die additive Verbindung der beiden weiteren Gruppen im Deutschen flüssig und eindeutig.
theological_decisions:
- issue: Ob ἐπείσθησαν ausdrücklich als Bekehrung oder Glaube wiederzugeben ist
  choice: ließen sich überzeugen
  alternative: kamen zum Glauben
  rationale: Der Zusammenhang betrifft die Reaktion auf die apostolische Verkündigung, doch Lukas verwendet πείθω und nicht πιστεύω. Die gewählte Fassung wahrt diese lexikalische Unterscheidung.
- issue: Wie ausdrücklich die religiöse Stellung der σεβόμενοι Ἕλληνες benannt werden soll
  choice: gottesfürchtige Griechen
  alternative: Griechen, die Gott verehrten
  rationale: '»Gottesfürchtig« gibt den in der Apostelgeschichte erkennbaren historischen Sinn knapp wieder: Nichtjuden, die den Gott Israels verehrten, ohne dass ihre genaue rechtliche oder religiöse Stellung weiter festgelegt wird.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung macht die Gruppenstruktur klar. Die lukanische Untertreibung »nicht wenige« und die vorsichtige Aussage »ließen sich überzeugen« bleiben erhalten.
