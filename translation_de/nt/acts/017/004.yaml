  terminology: „Gottesfürchtige Griechen“ gibt σεβομένων Ἑλλήνων angemessen wieder. „Angesehene Frauen“ ist für κοινωνisch hervorgehobene Frauen (τῶν πρώτων) im heutigen Deutsch idiomatischer als „führende Frauen“. „Nicht wenige“ bewahrt die lukanische Litotes.
