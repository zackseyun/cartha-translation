id: ACT.17.24
reference: Acts 17:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: de
  text: Der Gott, der die Welt und alles, was in ihr ist, gemacht hat – er ist Herr über Himmel und Erde und wohnt nicht in Tempeln, die von Menschenhand erbaut sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in handgemachten Tempeln«; gemeint sind Tempel, die Menschen erbaut haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: der … gemacht hat
  rationale: Das substantivisch bezogene Partizip wird im Deutschen natürlich als Relativsatz wiedergegeben. »Gemacht« entspricht ποιέω unmittelbar, ohne den Sinn unnötig auf einen spezielleren Schöpfungsbegriff festzulegen.
- source_word: κόσμον
  choice: die Welt
  rationale: κόσμος bezeichnet hier die gesamte geschaffene Weltordnung. »Die Welt« ist im Deutschen idiomatisch und im Zusammenhang umfassend genug.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: alles, was in ihr ist
  rationale: Die Formulierung bewahrt den umfassenden Sinn von πάντα und den ausdrücklichen Rückbezug auf die Welt.
- source_word: ὑπάρχων κύριος
  choice: er ist Herr
  rationale: Die griechische Partizipialkonstruktion bezeichnet Gottes bestehende Stellung als Herr. Ein selbstständiger deutscher Hauptsatz gibt dies klar und natürlich wieder, ohne das Partizip ausdrücklich kausal zu deuten.
- source_word: κύριος
  choice: Herr
  rationale: »Herr« bewahrt den Titel und bezeichnet hier Gottes souveräne Herrschaft über Himmel und Erde.
- source_word: οὐρανοῦ καὶ γῆς
  choice: über Himmel und Erde
  rationale: Beim deutschen »Herr« drückt »über« das im griechischen Genitiv enthaltene Herrschaftsverhältnis idiomatisch aus. »Himmel und Erde« bewahrt die feste umfassende Paarformel.
- source_word: χειροποιήτοις
  choice: die von Menschenhand erbaut sind
  rationale: χειροποίητος bedeutet von menschlichen Händen gefertigt. »Von Menschenhand erbaut« macht den menschlichen Ursprung der Tempel deutlich und klingt im Deutschen natürlich.
- source_word: ναοῖς
  choice: Tempeln
  rationale: ναός bezeichnet ein Heiligtum beziehungsweise einen Tempel als kultischen Wohnort einer Gottheit. Im Athener Kontext ist »Tempel« die klarste allgemeine Wiedergabe.
- source_word: κατοικεῖ
  choice: wohnt nicht
  rationale: κατοικέω bedeutet wohnen oder seinen Wohnsitz haben. »Wohnt nicht« ist verständlich und bewahrt den Gegensatz zur Vorstellung eines in Tempeln lokalisierten Gottes.
theological_decisions:
- issue: Gottes Transzendenz gegenüber einer Bindung an Tempel
  choice: Der Schöpfer und Herr über Himmel und Erde wohnt nicht in von Menschen erbauten Tempeln.
  alternative: Dynamischer könnte formuliert werden, Gott lasse sich nicht auf Tempel beschränken.
  rationale: Die Übersetzung bleibt bei der direkten Aussage des griechischen Textes und erweitert sie nicht zu einer ausdrücklichen Lehre über Begrenzung oder Gefangenschaft.
- issue: Verhältnis des Partizips ὑπάρχων zur Hauptaussage
  choice: »Er ist Herr … und wohnt nicht …« gibt den bestehenden Zustand wieder, ohne eine logische Beziehung ausdrücklich festzulegen.
  alternative: »Weil er Herr über Himmel und Erde ist, wohnt er nicht …« würde das Partizip kausal auslegen.
  rationale: Der griechische Wortlaut lässt die genaue adverbiale Beziehung des Partizips offen. Die deutsche Koordination bewahrt diese Spannung, statt Kausalität festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt den mit οὗτος aufgenommenen Hauptgedanken hervor. Die Formulierung vermeidet unnötig altertümliche Wörter und bewahrt zugleich den feierlichen Umfang von »Himmel und Erde«.
