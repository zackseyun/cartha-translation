source:
  edition: SBLGNT
  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: de
  text: So führte er in der Synagoge Gespräche mit den Juden und den Gottesfürchtigen[a] und täglich auf dem Marktplatz[b] mit denen, die sich gerade dort einfanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bezeichnung für Menschen, häufig Nichtjuden, die den Gott Israels verehrten und mit der jüdischen Synagoge verbunden waren.
    reason: lexical_alternative
  - marker: b
    text: Der Marktplatz war nicht nur ein Ort des Handels, sondern zugleich ein öffentlicher Mittelpunkt des gesellschaftlichen Lebens.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: sprach … mit
  rationale: Das Imperfekt bezeichnet eine wiederholte Tätigkeit; die Verbindung „mit“ bewahrt den dialogischen Charakter von διαλέγομαι, ohne das Wort einseitig auf Debatte oder Streitgespräch festzulegen.
- source_word: μὲν οὖν
  choice: So
  rationale: Die Partikelverbindung führt den Gedankengang folgernd und zugleich fortsetzend weiter. „So“ ist im Deutschen knapp und natürlich.
- source_word: συναγωγῇ
  choice: Synagoge
  rationale: Gemeint ist hier die jüdische Synagoge als Versammlungsort und Institution.
- source_word: τοῖς Ἰουδαίοις
  choice: den Juden
  rationale: Der Ausdruck bezeichnet in diesem Zusammenhang die jüdischen Teilnehmer in der Synagoge, nicht speziell Bewohner Judäas.
- source_word: τοῖς σεβομένοις
  choice: den Gottesfürchtigen
  rationale: In der Apostelgeschichte bezeichnet der substantivierte Ausdruck gewöhnlich Nichtjuden, die den Gott Israels verehrten und mit der Synagoge verbunden waren. Der etablierte deutsche Ausdruck ist knapp; eine Fußnote erläutert ihn.
- source_word: ἀγορᾷ
  choice: Marktplatz
  rationale: Die ἀγορά war ein öffentlicher, sowohl wirtschaftlich als auch gesellschaftlich und politisch genutzter Platz. „Marktplatz“ ist die geläufigste Wiedergabe; die Fußnote verhindert eine zu enge moderne Vorstellung.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: jeden Tag
  rationale: Die Wendung bezeichnet eine regelmäßig wiederholte tägliche Tätigkeit.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: mit denen, die sich gerade dort einfanden
  rationale: Das Partizip meint Menschen, die jeweils zufällig anwesend waren oder dort hinzukamen. Die Formulierung vermeidet die Verengung auf bloße Passanten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sprach … mit“ klingt natürlich und lässt den dialogischen bis argumentierenden Umfang des griechischen Verbs offen. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
