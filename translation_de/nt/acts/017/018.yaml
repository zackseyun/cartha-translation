id: ACT.17.18
reference: Acts 17:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: de
  text: 'Auch einige epikureische und stoische Philosophen diskutierten mit ihm[a]. Manche sagten: »Was will dieser Schwätzer[b] wohl sagen?« Andere aber meinten: »Er scheint ein Verkünder fremder Gottheiten[c] zu sein.« Denn er verkündete die gute Nachricht von Jesus und der Auferstehung[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »führten Gespräche mit ihm« beziehungsweise »stritten mit ihm«; das griechische Verb kann eine lebhafte Diskussion oder Auseinandersetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das abwertende griechische Wort bedeutet wörtlich »Körneraufleser«. Gemeint ist jemand, der vereinzelte Gedankenfetzen aufsammelt und weiterverbreitet.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »fremder göttlicher Wesen«, »fremder Götter« oder, wörtlich, »fremder Dämonen«. Aus Sicht der heidnischen Sprecher sind unbekannte göttliche Wesen gemeint, nicht unbedingt böse Geister im späteren christlichen Sinn.'
    reason: alternative_reading
  - marker: d
    text: Möglicherweise hielten die Athener »die Auferstehung« für den Namen einer weiteren Gottheit, weil Paulus von Jesus und der Auferstehung sprach.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: diskutierten mit ihm
  rationale: Das Verb bezeichnet hier eine aktive Auseinandersetzung im Gespräch und kann sowohl Diskussion als auch Streitgespräch meinen. »Diskutierten« passt zum philosophischen Umfeld, ohne unnötig Feindseligkeit vorauszusetzen.
- source_word: σπερμολόγος
  choice: Schwätzer
  rationale: Das abwertende Wort bezeichnet wörtlich einen »Körnerpicker« und übertragen jemanden, der Gedankenfetzen aufsammelt und weiterträgt. »Schwätzer« vermittelt die verächtliche Haltung in verständlichem Deutsch; das zugrunde liegende Bild wird in der Fußnote erklärt.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: Was will dieser Schwätzer wohl sagen?
  rationale: Das mit ἄν verbundene Optativ drückt eine distanzierte, hier wohl geringschätzige Vermutung aus. »wohl« bewahrt diese Nuance in natürlichem Deutsch.
- source_word: Ξένων δαιμονίων
  choice: fremder Gottheiten
  rationale: Im heidnisch-athenischen Sprachrahmen bezeichnet δαιμόνια göttliche Wesen, nicht notwendig böse Geister im christlichen Sinn. »Gottheiten« gibt die Perspektive der Sprecher wieder.
- source_word: καταγγελεὺς
  choice: Verkünder
  rationale: Das Substantiv bezeichnet jemanden, der etwas öffentlich bekannt macht oder verkündet. »Verkünder« ist prägnant und dem Register angemessen.
- source_word: εὐηγγελίζετο
  choice: verkündete die gute Nachricht
  rationale: Die Form bezeichnet das Verkünden einer guten Botschaft. Die ausdrückliche Wiedergabe erhält diesen Bedeutungsgehalt besser als das allgemeinere »predigte«.
- source_word: ἀνάστασιν
  choice: der Auferstehung
  rationale: Der Erzählkommentar bezeichnet den Inhalt von Paulus’ Botschaft. Das Wort wird daher als gewöhnliches Substantiv wiedergegeben, ohne es als Eigennamen zu personifizieren.
- source_word: τινὲς ... καί τινες ... οἱ δέ
  choice: einige ... Manche ... Andere aber
  rationale: Die Formulierung macht die verschiedenen Reaktionen innerhalb der Gruppe deutlich und bewahrt den Kontrast des griechischen Textes.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: epikureische und stoische Philosophen
  rationale: Diese Formulierung gibt die beiden philosophischen Schulen in natürlichem modernem Deutsch genau wieder.
theological_decisions:
- issue: Wiedergabe von δαιμόνια in der Rede heidnischer Athener
  choice: fremde Gottheiten
  alternative: fremde Dämonen; fremde Götter
  rationale: »Dämonen« würde leicht die spätere christliche Vorstellung böser Geister in die Aussage der Athener hineintragen. »Gottheiten« entspricht eher ihren religiösen Kategorien, während die Fußnote die sprachliche Bandbreite wahrt.
- issue: Mögliche Personifizierung von ἀνάστασις
  choice: der Auferstehung
  alternative: Auferstehung als vermeintlicher Name einer weiteren Gottheit
  rationale: Lukas erklärt mit dem gewöhnlichen Substantiv den Inhalt der Verkündigung. Die mögliche Fehlauffassung der Athener ist eine plausible Deutung, aber nicht ausdrücklich im Text festgestellt und wird deshalb nur in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Benennungen der philosophischen Schulen bleiben fachlich präzise; die direkte Rede klingt verständlich und zugleich deutlich geringschätzig. Echte lexikalische und kulturelle Mehrdeutigkeiten werden in den Fußnoten offengehalten.
