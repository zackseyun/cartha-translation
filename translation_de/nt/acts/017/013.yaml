  to: Als aber die Juden aus Thessalonich erfuhren, dass das Wort Gottes auch in Beröa von Paulus verkündet worden war, kamen sie auch dorthin und wiegelten die Menschenmengen auf und versetzten sie in Unruhe.
  rationale: Die einzige Änderung ersetzt „durch Paulus“ durch das im deutschen Passiv mit persönlichem Agens natürlichere „von Paulus“. Bedeutung, Satzstruktur und die zwei unterscheidbaren Aspekte der öffentlichen Unruhe bleiben erhalten.
