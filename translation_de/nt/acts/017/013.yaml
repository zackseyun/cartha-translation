id: ACT.17.13
reference: Acts 17:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: de
  text: Als aber die Juden aus Thessalonich erfuhren, dass das Wort Gottes auch in Beröa von Paulus verkündet worden war, kamen sie auch dorthin und wiegelten die Menschenmengen auf und versetzten sie in Unruhe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als aber
  rationale: ὡς wird temporal wiedergegeben; δέ markiert den erzählerischen Übergang und den Gegensatz zur positiven Aufnahme in Beröa.
- source_word: ἔγνωσαν
  choice: erfuhren
  rationale: Der Aorist von γινώσκω bezeichnet hier das Erlangen einer Information, nicht bloß vorhandenes Wissen.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: die Juden aus Thessalonich
  rationale: Die Herkunftsangabe grenzt die betreffende Gruppe ein und verallgemeinert nicht über Juden insgesamt.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: dass ... auch in Beröa
  rationale: καί hebt Beröa als weiteren Ort der Verkündigung neben Thessalonich hervor.
- source_word: κατηγγέλη
  choice: verkündet worden war
  rationale: Der Aorist Passiv bezeichnet die öffentliche Bekanntmachung; das deutsche Plusquamperfekt stellt die Verkündigung natürlich als dem Erfahren vorausliegend dar.
- source_word: ὑπὸ τοῦ Παύλου
  choice: durch Paulus
  rationale: ὑπό mit Genitiv kennzeichnet den persönlichen Urheber der passivisch ausgedrückten Handlung. Im Deutschen ist „durch Paulus“ hier idiomatisch.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die vertraute biblische Wendung bewahrt die theologische Dichte von λόγος, ohne sie auf eine bloße Mitteilung zu reduzieren.
- source_word: ἦλθον κἀκεῖ
  choice: kamen sie auch dorthin
  rationale: κἀκεῖ bedeutet „auch dorthin“ und zeigt, dass die Gegner ihre Tätigkeit bis nach Beröa ausdehnten.
- source_word: σαλεύοντες
  choice: wiegelten ... auf
  rationale: σαλεύω bezeichnet hier das Hervorrufen öffentlicher Erregung oder Unruhe; „aufwiegeln“ gibt die aktive Agitation natürlich wieder.
- source_word: καὶ ταράσσοντες
  choice: und versetzten sie in Unruhe
  rationale: ταράσσω ergänzt die Aufwiegelung um das Resultat von Beunruhigung und Verwirrung, ohne beide Partizipien zusammenfallen zu lassen.
- source_word: τοὺς ὄχλους
  choice: die Menschenmengen
  rationale: ὄχλοι bezeichnet versammelte größere Gruppen; „Menschenmengen“ bleibt neutral und vermeidet die Überzeichnung „Mobs“.
theological_decisions:
- issue: Wiedergabe von ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  alternative: die Botschaft Gottes
  rationale: „Das Wort Gottes“ bewahrt die geläufige und theologisch resonante Formulierung für die von Gott stammende Verkündigung, ohne im Kontext zusätzliche dogmatische Festlegungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Partizipien werden als koordinierte finite Verben wiedergegeben, um den langen griechischen Satz natürlich lesbar zu machen. Die spezifische Herkunftsbezeichnung der Gegner bleibt erhalten.
