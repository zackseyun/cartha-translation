  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. Bei einer passivischen Handlung mit persönlichem Urheber ist „von Paulus“ jedoch idiomatischer und unmittelbarer als „durch Paulus“.
  terminology: „das Wort Gottes“ ist für ὁ λόγος τοῦ θεοῦ angemessen und wahrt die traditionelle, im Kontext nicht weiter technisch festgelegte Formulierung. „Menschenmengen“ gibt τοὺς ὄχλους neutral wieder. Die Ortsnamen Thessalonich und Beröa sind im deutschen Bibelgebrauch vertretbar.
