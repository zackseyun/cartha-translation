  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: de
  text: Nachdem sie von Jason und den anderen eine Sicherheitsleistung erhalten hatten, ließen sie sie frei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Nachdem sie … erhalten hatten
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die der Freilassung vorausgeht. Die deutsche Nebensatzkonstruktion gibt diese zeitliche Abfolge natürlich wieder.
- source_word: τὸ ἱκανὸν
  choice: eine Sicherheit
  rationale: Der Ausdruck bezeichnet in diesem rechtlichen Zusammenhang wahrscheinlich eine ausreichende Sicherheitsleistung oder Bürgschaft. „Sicherheit“ bewahrt den juristisch-finanziellen Sinn, ohne die genaue Form näher festzulegen.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: von Jason und den anderen
  rationale: παρά mit Genitiv bezeichnet die Herkunft beziehungsweise die Personen, von denen die Leistung entgegengenommen wurde. „Die anderen“ meint die übrigen Beteiligten im unmittelbaren Zusammenhang.
- source_word: ἀπέλυσαν
  choice: ließen sie frei
  rationale: Im behördlich-rechtlichen Zusammenhang bedeutet ἀπολύω, festgehaltene Personen freizulassen. Die Formulierung ist im modernen Deutsch klar und natürlich.
- source_word: αὐτούς
  choice: sie
  rationale: Das Akkusativpronomen im Plural bezieht sich auf Jason und die anderen festgehaltenen Personen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Bedeutung wird verständlich wiedergegeben, während die im Griechischen nicht näher bestimmte Art der Sicherheitsleistung offenbleibt.
