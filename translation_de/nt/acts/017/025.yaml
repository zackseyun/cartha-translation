  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: de
  text: Auch lässt er sich nicht von Menschenhand dienen[a], als ob er etwas nötig hätte; er selbst gibt allen Leben und Atem und alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird er nicht durch Menschenhand verehrt“. Das griechische Verb kann einen Dienst bezeichnen, der in einem religiösen Zusammenhang geleistet wird. Hier liegt der Nachdruck darauf, dass Gott nicht auf menschliche Versorgung oder kultische Dienste angewiesen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Auch … nicht
  rationale: Setzt die verneinte Aussage des vorherigen Verses natürlich fort.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: von Menschenhänden
  rationale: Bewahrt das konkrete biblische Bild und bezeichnet menschliche, besonders kultische Dienstleistungen.
- source_word: θεραπεύεται
  choice: lässt er sich … dienen
  rationale: Das Verb meint hier nicht Heilung, sondern Dienst oder Versorgung. Die reflexive Form klingt im Deutschen natürlich und unterstreicht, dass Gott solcher Dienste nicht bedarf.
- source_word: προσδεόμενός τινος
  choice: als ob er etwas nötig hätte
  rationale: Gibt die rhetorische Begründung wieder, ohne den partizipialen Zusammenhang unnötig zu verengen.
- source_word: αὐτὸς
  choice: er selbst
  rationale: 'Erhält den ausdrücklichen Kontrast: Nicht Gott empfängt lebensnotwendige Versorgung, sondern er ist der Geber.'
- source_word: διδοὺς πᾶσι
  choice: gibt doch allen
  rationale: Die finite Form ist im Deutschen flüssig; „doch“ verdeutlicht den begründenden Gegensatz. „Allen“ lässt den umfassenden Bezugsbereich offen.
- source_word: ζωὴν καὶ πνοὴν
  choice: Leben und Atem
  rationale: Entspricht der geläufigen Bedeutung und betont die geschöpfliche Abhängigkeit von Gott.
- source_word: καὶ τὰ πάντα
  choice: und alles
  rationale: Gibt die umfassende Schlussformulierung knapp, natürlich und ohne sachliche Einschränkung wieder.
theological_decisions:
- issue: Ob θεραπεύεται ausdrücklich mit Gottesverehrung oder allgemeiner mit Dienst wiederzugeben ist
  choice: lässt er sich … dienen
  alternative: wird … verehrt
  rationale: Der Zusammenhang betrifft Gottes Unabhängigkeit von menschlichen, insbesondere kultischen Dienstleistungen. „Dienen“ bewahrt diese Breite; „verehren“ könnte die Aussage zu stark auf Anbetung verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch Semikolon und „doch“ idiomatisch gegliedert.
