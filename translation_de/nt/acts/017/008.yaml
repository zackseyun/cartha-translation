  yaml_path: translation/nt/acts/017/008.yaml
  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: de
  text: Und sie beunruhigten die Menge und die städtischen Amtsträger[a], als diese dies hörten.
  philosophy: optimal-equivalence
  footnotes:
