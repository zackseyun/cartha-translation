review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft die Aussage im Wesentlichen: ἐτάραξαν wird angemessen als Verursachen von Unruhe wiedergegeben, ὄχλος neutral als „Menge“, und πολιτάρχας funktional als „städtische Amtsträger“. Im vorliegenden Satz kann der Relativsatz „die das hörten“ jedoch wegen seiner Stellung unmittelbar nach „städtischen Amtsträgern“ auch nur auf diese bezogen werden, obwohl das griechische Partizip sowohl die Menge als auch die Amtsträger bezeichnet.'
  naturalness: „In Unruhe versetzen“ ist idiomatisch, doch die Stellung des Relativsatzes ist unnötig mehrdeutig. Die Revision macht den gemeinsamen Bezug mit „diese“ klar und bleibt modernes Standarddeutsch.
  terminology: „Städtische Amtsträger“ ist als verständliche funktionale Übersetzung von πολιτάρχας geeignet. Die Fußnote sollte „Politarchen“ nicht als „wörtlicher“, sondern als alternative, titelnahe Wiedergabe bezeichnen. „Lokaler Amtstitel“ ist hier idiomatischer als „örtlicher Titel“.
  issues:
  - severity: medium
    issue: Der Relativsatz „die das hörten“ kann syntaktisch nur auf „die städtischen Amtsträger“ bezogen verstanden werden.
    rationale: ἀκούοντας steht im Plural und modifiziert im Griechischen sowohl τὸν ὄχλον als auch τοὺς πολιτάρχας. Die deutsche Fassung soll diesen gemeinsamen Bezug eindeutig erkennen lassen.
  - severity: low
    issue: Die Fußnote bezeichnet „Politarchen“ als „wörtlicher“.
    rationale: „Politarchen“ ist eine eingedeutschte/transliterierte, titelnahe Alternative, nicht eigentlich eine wörtliche Übersetzung. Eine neutralere Formulierung ist präziser.
  revised_text: Und sie beunruhigten die Menge und die städtischen Amtsträger[a], als diese dies hörten.
