revisions:
- from: Und sie versetzten die Menge und die städtischen Amtsträger[a], die das hörten, in Unruhe.
  to: Und sie beunruhigten die Menge und die städtischen Amtsträger[a], als diese dies hörten.
  rationale: Die Revision beseitigt die mögliche Einschränkung des Hörens auf die Amtsträger allein und gibt die aktive Aussage von ἐτάραξαν mit „beunruhigten“ direkt und natürlich wieder. Die kulturgeschichtliche Fußnote bleibt erhalten, ist aber terminologisch präziser formuliert.
