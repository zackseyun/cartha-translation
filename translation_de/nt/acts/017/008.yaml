lexical_decisions:
- source_word: ἐτάραξαν
  choice: versetzten … in Unruhe
  rationale: Die Wendung gibt das Verursachen innerer oder öffentlicher Beunruhigung natürlich wieder und passt sowohl zur Menge als auch zu den Amtsträgern, ohne die Wirkung als Aufruhr oder Verwirrung zu überzeichnen.
- source_word: δὲ
  choice: Und
  rationale: δέ führt hier die Erzählung mit einer leichten Verknüpfung weiter; „Und“ entspricht dieser Funktion im Deutschen.
- source_word: ὄχλον
  choice: Menge
  rationale: „Menge“ ist eine neutrale und geläufige Wiedergabe; „Mob“ würde eine stärkere Feindseligkeit eintragen, als das griechische Wort für sich genommen ausdrückt.
- source_word: πολιτάρχας
  choice: städtischen Amtsträger
  rationale: πολιτάρχης bezeichnet einen örtlichen makedonischen Amtstitel. „Städtische Amtsträger“ vermittelt die Funktion verständlich, ohne ein genauer bestimmtes richterliches oder magistratisches Amt zu unterstellen.
- source_word: ἀκούοντας ταῦτα
  choice: die das hörten
  rationale: Das Partizip im Akkusativ Plural bezieht sich grammatisch auf die Menge und die städtischen Amtsträger. Der Relativsatz bewahrt diesen Bezug in natürlichem Deutsch; „das“ fasst den zuvor berichteten Inhalt idiomatisch zusammen.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die sachliche Bezeichnung „städtische Amtsträger“ wird durch eine kulturgeschichtliche Fußnote zum spezifischen makedonischen Titel ergänzt.
