source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: de
  text: Denn er hat einen Tag festgesetzt, an dem er den bewohnten Erdkreis in Gerechtigkeit[a] durch einen Mann richten wird, den er dazu bestimmt hat. Allen hat er den Beweis[b] dafür gegeben, indem er diesen Mann von den Toten auferweckte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Gerechtigkeit“; griechisch ἐν δικαιοσύνῃ.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gewissheit“. Wörtlicher: „Glauben“ oder „Vertrauen“; in der Verbindung πίστιν παρασχών bezeichnet der Ausdruck hier eine gewährte Beglaubigung oder einen Beweis.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: Denn
  rationale: Leitet den Grund für den vorausgehenden Aufruf zur Umkehr ein und gibt die kausale Bedeutung in natürlichem Deutsch wieder.
- source_word: ἔστησεν ἡμέραν
  choice: hat einen Tag festgesetzt
  rationale: Bezeichnet einen verbindlich bestimmten Zeitpunkt und bewahrt den feierlichen Ton.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: an dem er … richten wird
  rationale: Gibt die beabsichtigte zukünftige Handlung idiomatisch wieder; eine wörtlichere Form wie „im Begriff ist zu richten“ würde im Deutschen eine möglicherweise zu starke zeitliche Unmittelbarkeit nahelegen.
- source_word: τὴν οἰκουμένην
  choice: den bewohnten Erdkreis
  rationale: Bewahrt den konkreten Sinn der bewohnten Welt und den universalen menschlichen Umfang des Gerichts.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl die sittliche Richtigkeit als auch den gerechten Vollzug des Gerichts ab; die stärker forensische Alternative wird in der Fußnote genannt.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: durch einen Mann, den er dazu bestimmt hat
  rationale: Gibt ἀνήρ geschlechtsgenau als „Mann“ und das artikellose ἀνδρί als „einen Mann“ wieder. „Dazu bestimmt“ drückt die Beauftragung aus, ohne eine nicht ausdrücklich genannte Amtsbezeichnung einzuführen.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: Allen hat er den Beweis dafür gegeben
  rationale: Im Zusammenhang mit παρέχω bezeichnet πίστις hier eine öffentlich gewährte Beglaubigung beziehungsweise Gewissheit, nicht primär den persönlichen Glauben.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: indem er diesen Mann von den Toten auferweckte
  rationale: Das Partizip bezeichnet hier am natürlichsten das Mittel, durch das Gott den Beweis gab. „Diesen Mann“ macht den Rückbezug des Pronomens im Deutschen eindeutig, ohne einen neuen Referenten einzuführen.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im Gerichtskontext
  choice: in Gerechtigkeit
  alternative: nach Recht und Gerechtigkeit; mit gerechtem Urteil
  rationale: Die Formulierung bewahrt die umfassende Bedeutung von δικαιοσύνη, während die Fußnote die speziell forensische Nuance transparent macht.
- issue: Bedeutung von πίστις in πίστιν παρασχὼν πᾶσιν
  choice: Beweis
  alternative: 'Gewissheit; wörtlicher: Glauben oder Vertrauen'
  rationale: Die Verbindung mit παρέχω und die Auferweckung als öffentliche Bestätigung sprechen hier für „Beweis“ beziehungsweise „Gewissheit“. Die lexikalisch gewöhnliche Bedeutung „Glaube“ wird nicht in den Haupttext gezwungen, aber in der Fußnote offengelegt.
- issue: Wiedergabe von ἀνδρί
  choice: einen Mann
  alternative: den Mann
  rationale: ἀνήρ bezeichnet ausdrücklich einen Mann; der fehlende Artikel stützt die unbestimmte Form, obwohl der Zusammenhang auf Jesus verweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bewohnter Erdkreis“ bewahrt die konkrete Reichweite von οἰκουμένη, ohne sie auf einen politischen Herrschaftsraum zu beschränken. Die Aufteilung in zwei Sätze verbessert die Verständlichkeit, während der kausale Anschluss und die Beziehung zwischen Auferweckung und Beweis erhalten bleiben.
