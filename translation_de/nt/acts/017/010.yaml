id: ACT.17.10
reference: Acts 17:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: de
  text: Die Brüder[a] schickten sowohl Paulus als auch Silas sofort, noch in der Nacht[b], nach Beröa fort. Als sie dort ankamen, gingen sie in die Synagoge der Juden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“. Das griechische Wort für „Brüder“ kann die gesamte Gemeinschaft der Glaubenden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei Nacht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die jüdische Synagoge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: Brüder
  rationale: Die grammatisch maskuline Pluralform und die familiäre Bezeichnung der Glaubensgemeinschaft bleiben erhalten; dass die weitere Gemeinschaft einschließlich Frauen gemeint sein kann, wird in einer Fußnote kenntlich gemacht.
- source_word: εὐθέως
  choice: sofort
  rationale: „Sofort“ gibt die Dringlichkeit der unverzüglichen Handlung klar und in natürlichem modernem Deutsch wieder.
- source_word: διὰ νυκτός
  choice: noch in der Nacht
  rationale: Die Formulierung bezeichnet eine Handlung während der Nacht. „Noch in der Nacht“ klingt im deutschen Erzählzusammenhang natürlich und bewahrt zusammen mit „sofort“ sowohl den zeitlichen als auch den dringlichen Aspekt.
- source_word: ἐξέπεμψαν
  choice: schickten … fort
  rationale: Das zusammengesetzte Verb bezeichnet ein Weg- oder Aussenden; „fortschicken“ passt zur eiligen Abreise aus der Gefahrensituation.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: Paulus und Silas
  rationale: Die Verbindung τε … καί schließt ausdrücklich beide Männer ein. Im Deutschen ist dies durch die gemeinsame Nennung bereits eindeutig, ohne dass ein zusätzliches „sowohl“ nötig wäre.
- source_word: Βέροιαν
  choice: Beröa
  rationale: „Beröa“ ist die im Deutschen etablierte Wiedergabe des Ortsnamens.
- source_word: οἵτινες παραγενόμενοι
  choice: Als sie dort ankamen
  rationale: Das Partizip wird seiner zeitlichen Funktion entsprechend als Nebensatz wiedergegeben; „dort“ macht das im griechischen Zielausdruck enthaltene Ankommen in Beröa natürlich verständlich.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: Synagoge der Juden
  rationale: Die Genitivverbindung wird transparent bewahrt und bezeichnet die Synagoge der örtlichen jüdischen Gemeinschaft, ohne abwertende Bedeutung.
- source_word: ἀπῄεσαν
  choice: gingen sie in
  rationale: Mit der Richtungsangabe εἰς τὴν συναγωγήν ergibt sich im Deutschen idiomatisch „in die Synagoge gehen“; das Präteritum trägt die Erzählung natürlich weiter.
theological_decisions:
- issue: Umfang der mit ἀδελφοὶ bezeichneten Gemeinschaft
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Der Haupttext wahrt die maskuline Form des griechischen Ausdrucks, ohne auszuschließen, dass im Kontext die gesamte glaubende Gemeinschaft einschließlich Frauen gemeint ist; diese mögliche inklusive Bedeutung wird in der Fußnote genannt.
- issue: Wiedergabe von τῶν Ἰουδαίων
  choice: der Juden
  alternative: jüdische
  rationale: Die transparente Genitivwiedergabe bewahrt Lukas’ Formulierung. Sie kennzeichnet die örtliche Synagogengemeinschaft und enthält kein theologisches oder abwertendes Urteil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. „Sofort, noch in der Nacht“ bewahrt sowohl εὐθέως als auch διὰ νυκτός; die Zeichensetzung verhindert, dass einer der beiden Aspekte untergeht. Sämtliche Fußnotenmarker stehen an der jeweils sachlich passenden Stelle im Haupttext.
