  variant: modern standard German
source:
  edition: SBLGNT
  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: de
  text: Zwar hat Gott über die Zeiten der Unwissenheit hinweggesehen[a]; jetzt aber gebietet er allen Menschen überall, umzukehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat Gott die Zeiten der Unwissenheit übergangen«. Gemeint ist, dass Gott diese Zeiten geduldig überging, nicht dass er die Unwissenheit billigte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: Über die Zeiten der Unwissenheit ... zwar
  rationale: Die Wortgruppe ist das Objekt des Partizips ὑπεριδών. »Zeiten der Unwissenheit« wahrt die knappe Formulierung; »zwar ... doch jetzt« gibt den durch μὲν οὖν und τὰ νῦν angelegten Übergang und zeitlichen Kontrast natürlich wieder.
- source_word: ὑπεριδὼν
  choice: hat ... hinweggesehen
  rationale: »Hinwegsehen über« bezeichnet hier Gottes bisheriges Übergehen beziehungsweise seine Nachsicht, ohne Zustimmung zu der Unwissenheit auszudrücken. Die finite deutsche Form gibt das vorzeitige Aoristpartizip idiomatisch wieder.
- source_word: τὰ νῦν παραγγέλλει
  choice: doch jetzt gebietet er
  rationale: τὰ νῦν hebt die gegenwärtige Lage gegenüber den früheren Zeiten hervor; παραγγέλλει hat die verbindliche Kraft eines Befehls. »Gebietet« ist würdevoll und im heutigen Standarddeutsch verständlich.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: allen Menschen überall
  rationale: ἄνθρωποι ist hier generisch und bezeichnet Menschen insgesamt; πάντας und πανταχοῦ unterstreichen die uneingeschränkte persönliche und räumliche Reichweite.
- source_word: μετανοεῖν
  choice: umzukehren
  rationale: μετανοεῖν umfasst eine grundlegende Sinnes- und Lebensänderung. »Umkehren« ist im biblischen Verkündigungskontext natürlich und bewahrt die moralisch-religiöse Dimension besser als das engere »anders zu denken«.
theological_decisions:
- issue: Bedeutung von Gottes Handeln gegenüber den »Zeiten der Unwissenheit«
  choice: Gott sah darüber hinweg, im Sinn bisherigen Übergehens oder geduldiger Nachsicht.
  alternative: Gott billigte oder entschuldigte die Unwissenheit.
  rationale: ὑπεριδών lässt die Spannung zwischen Gottes bisheriger Nachsicht und seinem jetzigen Umkehrgebot bestehen. Die Formulierung behauptet weder Billigung noch völlige Entschuldigung.
- issue: Reichweite des Umkehrgebots
  choice: Das Gebot gilt allen Menschen überall.
  alternative: Das Gebot gilt nur Männern oder nur den nichtjüdischen Völkern.
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ bezeichnet im Kontext umfassend Menschen ohne räumliche Einschränkung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwar–doch-Konstruktion macht den griechischen Kontrast zwischen den früheren Zeiten und dem Jetzt sichtbar. »Umkehren« vermeidet eine bloß intellektuelle Verengung von μετανοεῖν.
