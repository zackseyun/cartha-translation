revisions:
- from: Über die Zeiten der Unwissenheit hat Gott nun zwar hinweggesehen[a]; doch jetzt gebietet er allen Menschen überall, umzukehren.
  to: Zwar hat Gott über die Zeiten der Unwissenheit hinweggesehen[a]; jetzt aber gebietet er allen Menschen überall, umzukehren.
  rationale: Die Revision beseitigt die missverständliche und weniger natürliche Verbindung »nun zwar ... doch jetzt«, ohne den griechischen Übergang und Kontrast abzuschwächen. Die Fußnote verdeutlicht die forbearende Bedeutung von ὑπεριδών präziser, ohne eine weitergehende theologische Deutung festzulegen.
