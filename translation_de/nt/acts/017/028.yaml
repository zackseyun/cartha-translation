id: ACT.17.28
reference: Acts 17:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: de
  text: 'Denn in ihm leben wir, bewegen wir uns und sind wir, wie auch einige eurer Dichter gesagt haben: »Denn auch wir sind seine Nachkommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Bewahrt die räumlich-metaphorische Formulierung und ihre theologische Offenheit.
- source_word: κινούμεθα
  choice: bewegen wir uns
  rationale: Gibt das mediale Verb natürlich wieder, ohne es unnötig auf eine bestimmte Art von Bewegung einzuengen.
- source_word: ἐσμέν
  choice: sind wir
  rationale: Entspricht unmittelbar dem griechischen Seinsverb und erhält die prägnante Dreierfolge; »existieren wir« wäre erklärender, aber weniger nah an der Form.
- source_word: γένος
  choice: Geschlecht
  rationale: Bezeichnet hier Abstammung beziehungsweise Zugehörigkeit; die feste Wendung »von seinem Geschlecht« ist würdig und vermeidet die biologisch enger klingende Übersetzung »Nachkommen«.
theological_decisions:
- issue: Bedeutung der Aussage, dass Menschen Gottes γένος sind
  choice: »von seinem Geschlecht« als Zitat wiedergeben
  alternative: »seine Nachkommen« oder »seine Kinder«
  rationale: Die Übersetzung wahrt die Aussage des zitierten Dichters, ohne daraus ausdrücklich eine heilsgeschichtliche Gotteskindschaft oder eine biologische Abstammung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anaphorische Dreierfolge »leben wir, bewegen wir uns und sind wir« spiegelt den Rhythmus des griechischen Textes. Die direkte Rede wird mit deutschen Anführungszeichen markiert.
