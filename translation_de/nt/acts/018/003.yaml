  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: de
  text: Und weil er dasselbe Handwerk ausübte, blieb er bei ihnen und arbeitete; denn sie waren von Beruf Zeltmacher[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise auch: Lederarbeiter. Das griechische Wort kann neben Zeltmachern auch Personen in einem damit verbundenen Ledergewerbe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: weil er dasselbe Handwerk ausübte
  rationale: διά mit dem substantivierten Infinitiv bezeichnet hier den Grund. Die Formulierung gibt ὁμότεχνος natürlich wieder und lässt das konkrete Handwerk zunächst ungenannt, bis es am Satzende bezeichnet wird.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: blieb er bei ihnen
  rationale: μένω bedeutet in diesem erzählerischen Zusammenhang, dass Paulus bei Aquila und Priszilla blieb beziehungsweise wohnte. „Blieb bei ihnen“ ist knapp und idiomatisch, ohne eine bestimmte Art der Unterkunft vorauszusetzen.
- source_word: ἠργάζετο
  choice: arbeitete
  rationale: ἐργάζομαι bezeichnet hier die fortgesetzte berufliche beziehungsweise handwerkliche Arbeit. Das deutsche Präteritum passt zur Erzählung; der durative Charakter des Imperfekts ergibt sich aus dem Zusammenhang.
- source_word: σκηνοποιοί
  choice: Zeltmacher
  rationale: „Zeltmacher“ ist die traditionelle und wahrscheinlichste Bedeutung. Da das Wort möglicherweise auch ein verwandtes Handwerk, besonders Lederarbeit, bezeichnen kann, wird diese echte lexikalische Unsicherheit in einer Fußnote bewahrt.
- source_word: τῇ τέχνῃ
  choice: von Beruf
  rationale: τέχνη bezeichnet Handwerk oder Gewerbe. Die idiomatische Wendung „von Beruf“ macht deutlich, dass es sich um ihre regelmäßige Erwerbstätigkeit handelte.
