translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzstruktur bewahrt den ausdrücklichen Kausalzusammenhang und vermeidet Zusätze wie „mit ihnen“, die im griechischen Text nicht ausdrücklich stehen.
