  text: ἐκάθισεν ⸀δὲ ἐνιαυτὸν καὶ μῆνας ἓξ διδάσκων ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: de
  text: So blieb er ein Jahr und sechs Monate dort und lehrte unter ihnen das Wort Gottes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: blieb … dort
  rationale: Das Verb bedeutet wörtlich „setzte sich“, bezeichnet hier aber idiomatisch das längere Bleiben an einem Ort. „Blieb … dort“ gibt diesen erzählerischen Sinn natürlich wieder.
- source_word: δὲ
  choice: So
  rationale: δέ ist ein leichter Satzanschluss. Im Zusammenhang mit der vorausgehenden Ermutigung bezeichnet „So“ passend die Fortführung beziehungsweise Folge, ohne einen starken Gegensatz einzutragen.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: ein Jahr und sechs Monate
  rationale: Die Akkusativgruppe gibt die Dauer an und wird im modernen Deutschen unmittelbar und idiomatisch wiedergegeben.
- source_word: διδάσκων
  choice: und lehrte
  rationale: Das Präsenspartizip bezeichnet die während seines Aufenthalts fortdauernde Begleittätigkeit. Ein koordinierter deutscher Hauptsatz ist hier natürlicher und wahrt den zeitlichen Zusammenhang.
- source_word: ἐν αὐτοῖς
  choice: unter ihnen
  rationale: ἐν mit dem Dativ hat hier lokalen beziehungsweise sozialen Sinn. „Unter ihnen“ beschreibt Paulus’ Lehrtätigkeit innerhalb der dortigen Gemeinschaft, ohne das unnatürliche wörtliche „in ihnen“.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: λόγος bezeichnet in der Apostelgeschichte häufig die von Gott stammende und verkündete Botschaft. „Das Wort Gottes“ bewahrt die etablierte biblische Ausdrucksweise und bleibt allgemein verständlich.
theological_decisions: []
