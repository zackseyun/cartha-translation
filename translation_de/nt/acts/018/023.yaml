id: ACT.18.23
reference: Acts 18:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: de
  text: Nachdem er einige Zeit dort verbracht hatte, brach er auf und zog der Reihe nach[a] durch das galatische Gebiet und Phrygien; dabei stärkte er alle Jünger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nacheinander“ oder „von Ort zu Ort“.'
    reason: Lexikalische Alternative für καθεξῆς, das eine geordnete beziehungsweise schrittweise Abfolge ausdrückt.
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: nachdem er einige Zeit dort verbracht hatte
  rationale: Die Verbindung ποιέω + χρόνον ist eine idiomatische Wendung für das Verbringen von Zeit. „Dort“ wird aus dem vorherigen Zusammenhang ergänzt und bezeichnet den zuletzt genannten Aufenthaltsort.
- source_word: ἐξῆλθεν
  choice: brach er auf
  rationale: Im Reisebericht bezeichnet das Verb das Verlassen eines Ortes beziehungsweise den Beginn der Weiterreise. „Brach auf“ ist im Deutschen natürlich und präzise.
- source_word: διερχόμενος καθεξῆς
  choice: zog der Reihe nach
  rationale: διέρχομαι beschreibt das Durchreisen, während καθεξῆς eine geordnete oder schrittweise Abfolge bezeichnet. Die Formulierung bewahrt diesen Verlauf, ohne eine genauer festgelegte Reiseroute einzutragen.
- source_word: τὴν Γαλατικὴν χώραν
  choice: das galatische Gebiet
  rationale: χώρα bezeichnet ein Gebiet oder eine Landschaft. Die adjektivische Wiedergabe vermeidet die vorschnelle Gleichsetzung mit einer exakt abgegrenzten römischen Provinz.
- source_word: καὶ Φρυγίαν
  choice: und Phrygien
  rationale: Der geografische Eigenname wird in seiner üblichen deutschen Form wiedergegeben. Die Koordination mit dem galatischen Gebiet bleibt erhalten.
- source_word: στηρίζων
  choice: dabei stärkte er
  rationale: στηρίζω bedeutet festigen oder stärken. Im Zusammenhang mit den Jüngern bezeichnet es fortgesetzte Unterstützung, ohne deren genaue Form näher zu bestimmen.
- source_word: πάντας τοὺς μαθητάς
  choice: alle Jünger
  rationale: „Jünger“ ist die etablierte deutsche Bezeichnung für μαθηταί als Nachfolger Jesu; πάντας wird ausdrücklich mit „alle“ wiedergegeben.
theological_decisions:
- issue: Geografisches Verhältnis von Galatien und Phrygien
  choice: „das galatische Gebiet und Phrygien“ als koordinierte Gebietsbezeichnungen
  alternative: „das galatisch-phrygische Gebiet“ als Bezeichnung einer zusammengehörigen Region
  rationale: Die griechische Formulierung nennt τὴν Γαλατικὴν χώραν und Φρυγίαν mit καί. Die Übersetzung wahrt die sichtbare Koordination und legt die historisch-geografische Zuordnung nicht enger fest, als es der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzfluss folgt dem Reisebericht, während das Semikolon die begleitende Tätigkeit des Stärkens klar anschließt. Geografische und syntaktische Mehrdeutigkeiten werden nicht konfessionell oder historisch überbestimmt.
