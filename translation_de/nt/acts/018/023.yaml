  terminology: „Galatisches Gebiet“ vermeidet eine historisch zu enge Festlegung auf die römische Provinz. „Phrygien“ ist die übliche deutsche Namensform. „Jünger“ und „stärkte“ sind etablierte und semantisch passende Wiedergaben von μαθηταί und στηρίζων.
