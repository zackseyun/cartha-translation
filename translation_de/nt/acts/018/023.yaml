  source_fidelity: 'Die Übersetzung gibt die griechische Abfolge und Syntax zuverlässig wieder: Der vorangehende Aufenthalt (ποιήσας χρόνον τινά), der Aufbruch (ἐξῆλθεν), das schrittweise Durchreisen (διερχόμενος καθεξῆς) sowie das fortlaufende Stärken aller Jünger (στηρίζων πάντας τοὺς μαθητάς) sind erhalten. Die kontextuelle Ergänzung „dort“ ist vertretbar und führt keine zusätzliche Sachinformation ein.'
