source:
  edition: SBLGNT
  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: de
  text: Ein Jude namens Apollos, ein aus Alexandria stammender redegewandter Mann, kam nach Ephesus. Er war in den Schriften sehr bewandert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gelehrter«; das griechische Wort kann sowohl Redegewandtheit als auch Gelehrsamkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: Jude
  rationale: Die Bezeichnung meint hier die ethnisch-religiöse Zugehörigkeit des Apollos, nicht seine geografische Herkunft aus Judäa.
- source_word: δέ τις
  choice: Ein
  rationale: δέ leitet einen neuen Erzählabschnitt ein und muss im Deutschen nicht eigens wiedergegeben werden; das indefinite τις ist durch den unbestimmten Artikel natürlich ausgedrückt.
- source_word: Ἀπολλῶς ὀνόματι
  choice: namens Apollos
  rationale: Dies gibt die griechische Namensformel knapp und idiomatisch wieder.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: gebürtig aus Alexandria
  rationale: Die Wendung bezeichnet Herkunft beziehungsweise Geburtsort; die deutsche Formulierung ist natürlich und vermeidet moderne Missverständnisse von γένος als »Rasse«.
- source_word: ἀνὴρ λόγιος
  choice: ein redegewandter Mann
  rationale: λόγιος kann sowohl »redegewandt« als auch »gelehrt« bedeuten. Die Hauptfassung wählt die rhetorische Bedeutung, während die echte lexikalische Alternative in der Fußnote erhalten bleibt.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: kam nach Ephesus
  rationale: Das Verb bezeichnet das Erreichen eines Zielortes; »kam nach« ist klares, natürliches Deutsch.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: kannte sich in den Schriften sehr gut aus
  rationale: Die idiomatische Wiedergabe bringt seine ausgeprägte Fähigkeit und Vertrautheit im Umgang mit den heiligen Schriften verständlich zum Ausdruck, ohne das missverständliche wörtliche »mächtig in«.
- source_word: ταῖς γραφαῖς
  choice: den Schriften
  rationale: Im jüdischen Kontext sind die anerkannten heiligen Schriften gemeint; die bestimmte Form bewahrt diesen Bezug.
theological_decisions:
- issue: Bedeutung von λόγιος
  choice: redegewandt
  alternative: gelehrt
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der Haupttext entscheidet sich nicht dogmatisch, sondern kennzeichnet die Alternative ausdrücklich in einer Fußnote.
- issue: Bedeutung von δυνατός ἐν ταῖς γραφαῖς
  choice: kannte sich in den Schriften sehr gut aus
  alternative: war mächtig in den Schriften
  rationale: Die gewählte Fassung versteht die Wendung als starke Sachkenntnis beziehungsweise Befähigung im Umgang mit der Schrift. Sie vermeidet eine unnötig dunkle Formulierung, ohne Apollos’ außergewöhnliche Kompetenz abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Satzperiode wurde für bessere Verständlichkeit in zwei Sätze gegliedert. Die Formulierung bleibt sachlich und konfessionell neutral; die Mehrdeutigkeit von λόγιος wird durch die Fußnote bewahrt.
