id: ACT.18.21
reference: Acts 18:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: de
  text: 'Doch er verabschiedete sich und sagte[a]: »Ich werde wieder zu euch zurückkehren, wenn Gott will[b].« Dann stach er von Ephesus aus in See.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lassen »und sagte: ›Ich werde wieder zu euch zurückkehren, wenn Gott will.‹« aus.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »so Gott will« beziehungsweise »wenn Gott es will«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: doch
  rationale: Markiert den Gegensatz zur vorausgehenden Bitte, länger zu bleiben, und klingt im Deutschen natürlich.
- source_word: ἀποταξάμενος
  choice: er verabschiedete sich
  rationale: Gibt das Aorist-Medium als vorausgehende Abschiedshandlung idiomatisch wieder.
- source_word: καὶ εἰπών
  choice: und sagte
  rationale: Bewahrt die zweite Handlung der griechischen Partizipialfolge in natürlicher deutscher Syntax.
- source_word: Πάλιν ἀνακάμψω πρὸς ὑμᾶς
  choice: Ich werde wieder zu euch zurückkehren
  rationale: Gibt das erneute Zurückkehren und die Richtung zu den Angesprochenen ausdrücklich wieder.
- source_word: τοῦ θεοῦ θέλοντος
  choice: wenn Gott will
  rationale: Der Genitivus absolutus bezeichnet die Abhängigkeit des Reiseplans von Gottes Willen; die Formulierung ist knapp und idiomatisch.
- source_word: ἀνήχθη ἀπὸ τῆς Ἐφέσου
  choice: Dann stach er von Ephesus aus in See
  rationale: ἀνάγω hat im lukanischen Reisekontext die nautische Bedeutung des Ablegens; »von Ephesus aus« bezeichnet den Ausgangspunkt.
theological_decisions:
- issue: Abhängigkeit von Gottes Willen bei Paulus’ Reiseplan
  choice: wenn Gott will
  alternative: so Gott will
  rationale: Die Übersetzung bewahrt den ausdrücklichen Gottesbezug von τοῦ θεοῦ und den kontingenten Charakter der Aussage, ohne »Gott« durch »Herr« zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und alltagstauglich; »in See stechen« gibt den nautischen Reiseausdruck präzise wieder.
