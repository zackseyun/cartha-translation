source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: de
  text: Und nachdem er von dort weggegangen war, ging er in das Haus eines Mannes namens Titius Justus, der Gott verehrte[a] und dessen Haus an die Synagoge angrenzte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gott fürchtete“ oder „ein Verehrer Gottes“. Der Ausdruck kann im lukanischen Kontext einen nichtjüdischen Verehrer des Gottes Israels bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „direkt neben der Synagoge lag“ oder „eine Grenze mit der Synagoge teilte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: er ging von dort weg
  rationale: Die Verbindung bezeichnet das Verlassen des bisherigen Ortes. Die finite deutsche Form gibt die erzählerische Abfolge natürlich wieder, ohne die Bewegung abzuschwächen.
- source_word: εἰσῆλθεν εἰς οἰκίαν
  choice: begab sich in das Haus
  rationale: Im Kontext ist wohl nicht nur das körperliche Eintreten, sondern der Wechsel an einen neuen Wirkungsort gemeint. „Begab sich in das Haus“ bleibt bewegungsbezogen und klingt im Deutschen natürlich.
- source_word: τινὸς ὀνόματι Τιτίου Ἰούστου
  choice: eines Mannes namens Titius Justus
  rationale: Gibt das indefinite Pronomen und die Namensangabe idiomatisch und vollständig wieder.
- source_word: σεβομένου τὸν θεόν
  choice: der Gott verehrte
  rationale: Das Partizip beschreibt seine Hinwendung zum Gott Israels, ohne zwingend eine feste sozioreligiöse Kategorie zu benennen. „Verehrte“ bewahrt diese deskriptive Aussage.
- source_word: συνομοροῦσα
  choice: grenzte unmittelbar an
  rationale: Das seltene Verb bezeichnet räumliche Angrenzung beziehungsweise eine gemeinsame Grenze. Die Formulierung ist präzise und in modernem Deutsch verständlich.
- source_word: συναγωγῇ
  choice: die Synagoge
  rationale: Standardentsprechung im erzählerischen Kontext der Apostelgeschichte.
theological_decisions:
- issue: Bezeichnung des Titius Justus als σεβόμενος τὸν θεόν
  choice: der Gott verehrte
  alternative: der Gott fürchtete; ein Gottesfürchtiger
  rationale: Die deskriptive Wiedergabe zeigt seine Verehrung des Gottes Israels, ohne den möglichen halbtechnischen Status „Gottesfürchtiger“ im Haupttext festzuschreiben.
- issue: Bedeutung des Ortswechsels in εἰσῆλθεν εἰς οἰκίαν
  choice: begab sich in das Haus
  alternative: trat in das Haus ein; ging in das Haus
  rationale: Die Übersetzung lässt offen, ob lediglich ein Betreten oder die Verlagerung des Wirkungsortes gemeint ist, und vermeidet eine konfessionell oder historisch überladene Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Kette von Relativsätzen; „unmittelbar angrenzen“ wahrt zugleich die präzise räumliche Aussage des griechischen Verbs.
