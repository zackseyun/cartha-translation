  text: καὶ ἀπήλασεν αὐτοὺς ἀπὸ τοῦ βήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/016.yaml
  text: And he drove them away from the judgment seat[a].
translation:
  language: de
  text: Und er trieb sie vom Richterstuhl weg[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Gericht“ beziehungsweise „vom Gerichtsplatz“; das griechische Wort bezeichnet den erhöhten Amtssitz eines Richters und damit auch die dort tagende Gerichtsstätte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Das einfache „Und“ gibt die fortlaufende Erzählverknüpfung wieder, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: ἀπήλασεν
  choice: vertrieb
  rationale: Das Verb bezeichnet ein entschiedenes Wegtreiben oder Entfernen. „Vertrieb“ bewahrt die autoritative, nachdrückliche Handlung besser als das mildere „entließ“.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor genannten Beteiligten und bleibt wie der griechische Text kontextabhängig, ohne den Bezug unnötig zu präzisieren.
- source_word: ἀπὸ τοῦ βήματος
  choice: vom Richterstuhl
  rationale: Die Wendung bezeichnet die Entfernung aus dem Bereich des offiziellen richterlichen Sitzes beziehungsweise der Gerichtsstätte. „Vom Richterstuhl“ ist knapp, verständlich und bewahrt das konkrete Bild des griechischen Ausdrucks.
theological_decisions: []
translation_notes:
  register: Moderne, knappe und würdige Erzählsprache. „Richterstuhl“ erhält das konkrete Bild des βῆμα; die Fußnote erläutert dessen weiter gefasste gerichtliche Bedeutung.
