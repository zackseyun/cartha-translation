base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: de
  text: Er führte jeden Sabbat in der Synagoge Gespräche und suchte, Juden und Griechen zu überzeugen.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er sprach … mit ihnen“ oder „Er erörterte …“. Das griechische Verb kann ein erörterndes Gespräch oder eine argumentierende Auseinandersetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und überzeugte“. Die Imperfektform kann die fortdauernde Bemühung hervorheben: „suchte zu überzeugen“.'
    reason: lexical_alternative
  - marker: c
    text: Möglicherweise sind Griechen im Umfeld der Synagoge gemeint; manche verstehen die Bezeichnung weiter als „Nichtjuden“.
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: führte … Gespräche
  rationale: Das Imperfekt beschreibt eine wiederholte Tätigkeit. Die Formulierung gibt den sachlich argumentierenden Austausch wieder, ohne den möglichen Dialog auf einen Monolog oder förmlichen Streit zu verengen.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ ist hier ein schwacher erzählerischer Anschluss. Im Deutschen ist ein neuer Hauptsatz ohne ausdrückliches Bindewort natürlicher.
- source_word: ἐν τῇ συναγωγῇ
  choice: in der Synagoge
  rationale: Die Wendung ist eindeutig örtlich zu verstehen.
- source_word: κατὰ πᾶν σάββατον
  choice: jeden Sabbat
  rationale: κατά mit πᾶν hat distributiven Sinn; zusammen mit dem Imperfekt bezeichnet die Wendung regelmäßiges, wiederholtes Handeln.
- source_word: ἔπειθέν
  choice: suchte … zu überzeugen
  rationale: Das Imperfekt stellt den fortdauernden bzw. wiederholten Überzeugungsversuch dar, ohne zwingend zu behaupten, dass er bei allen Erfolg hatte.
- source_word: τε
  choice: und
  rationale: τε verbindet das Überzeugen eng mit dem vorausgehenden Gespräch; die deutsche Satzfügung gibt diese Verbindung durch „und“ wieder.
- source_word: Ἰουδαίους
  choice: Juden
  rationale: Hier bezeichnet das Wort Juden als ethnisch-religiöse Gruppe, nicht lediglich Bewohner Judäas.
- source_word: Ἕλληνας
  choice: Griechen
  rationale: Die konkrete Bezeichnung des Ausgangstextes bleibt erhalten und wird nicht zu „Nichtjuden“ verallgemeinert.
theological_decisions:
- issue: Identität der Ἕλληνες im Umfeld der Synagoge
  choice: Griechen
  alternative: Nichtjuden oder gottesfürchtige Griechen
  rationale: Der Vers nennt sie ausdrücklich Griechen, bestimmt ihren religiösen Status aber nicht näher. Die Übersetzung vermeidet daher, ihnen eine im Text nicht ausdrücklich genannte Kategorie zuzuweisen.
- issue: Erfolg des Überzeugens
  choice: suchte … zu überzeugen
  alternative: überzeugte
  rationale: Die imperfektive Form kann den fortdauernden Einsatz hervorheben und muss keinen durchgängigen Erfolg ausdrücken. Die Formulierung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gespräche führen“ ist allgemein verständlich und bewahrt den dialogisch-argumentativen Sinn; die Fußnoten legen die echten lexikalischen und sozialen Mehrdeutigkeiten offen.
