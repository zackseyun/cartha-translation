id: ACT.18.25
reference: Acts 18:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: de
  text: Dieser Mann war mit dem Weg des Herrn vertraut gemacht worden. Glühend im Geist[a] sprach und lehrte er genau über Jesus und kannte dabei nur die Taufe des Johannes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Im Geist“ kann sich auf den eigenen Geist des Apollos oder auf den Heiligen Geist beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: unterwiesen worden
  rationale: Das Perfektpartizip bezeichnet eine vorausgegangene Unterweisung mit fortdauernder Wirkung. „Unterwiesen“ ist natürlich und vermeidet die späteren kirchlichen Fachbedeutungen von „katechisiert“.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: im Weg des Herrn
  rationale: Die Wiedergabe bewahrt die frühchristliche Weg-Metaphorik und gibt κύριος entsprechend als „Herr“ wieder.
- source_word: ζέων τῷ πνεύματι
  choice: glühend im Geist
  rationale: „Glühend“ erhält das Bild siedender, brennender Hingabe. „Im Geist“ lässt offen, ob der eigene Geist des Apollos oder der Heilige Geist gemeint ist.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: sprach und lehrte er
  rationale: Die beiden Imperfektformen bezeichnen seine fortgesetzte Tätigkeit; im Deutschen kann dies idiomatisch mit dem Präteritum ausgedrückt werden, ohne eines der beiden Verben zusammenzuziehen.
- source_word: ἀκριβῶς
  choice: genau
  rationale: „Genau“ bezeichnet hier die sachliche Richtigkeit und Präzision seiner Rede und Lehre, trotz der anschließend genannten Begrenzung seines Wissens.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: über Jesus
  rationale: Die natürliche deutsche Wendung gibt den weiten Bezug auf die Jesus betreffenden Inhalte wieder, ohne diese näher einzugrenzen.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: wobei er nur die Taufe des Johannes kannte
  rationale: „Wobei“ bildet das begleitende Partizip ab und macht die Spannung zum Vorhergehenden erkennbar, ohne sie ausdrücklich mit einem stärker deutenden „obwohl“ als konzessiv festzulegen.
theological_decisions:
- issue: Bedeutung von τῷ πνεύματι in ζέων τῷ πνεύματι
  choice: 'mehrdeutig: Geist des Apollos oder Heiliger Geist'
  alternative: eindeutig der eigene Geist beziehungsweise eindeutig der Heilige Geist
  rationale: Der griechische Ausdruck entscheidet nicht ausdrücklich zwischen innerer menschlicher Begeisterung und dem Wirken des Heiligen Geistes. Der Haupttext bewahrt diese Offenheit; die Fußnote benennt beide Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht bibelsprachliche Formulierung „im Weg des Herrn“ bewahrt die prägende Metapher des griechischen Textes; die übrige Syntax bleibt gegenwärtig und allgemein verständlich.
