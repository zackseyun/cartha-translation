- from: Dieser war im Weg des Herrn unterwiesen worden. Glühend im Geist[a] sprach und lehrte er genau über Jesus, wobei er nur die Taufe des Johannes kannte.
  to: Dieser Mann war mit dem Weg des Herrn vertraut gemacht worden. Glühend im Geist[a] sprach und lehrte er genau über Jesus und kannte dabei nur die Taufe des Johannes.
  rationale: Die Überarbeitung verbessert die idiomatische Verständlichkeit, ohne die Weg-Metapher, den passivischen Charakter der vorausgegangenen Unterweisung oder die Mehrdeutigkeit von „im Geist“ aufzugeben. Der Schluss wird als begrenzende Begleitinformation formuliert, ohne das griechische Partizip unnötig als ausdrücklichen Gegensatz auszulegen.
