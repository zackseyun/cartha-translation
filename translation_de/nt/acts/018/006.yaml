source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: de
  text: 'Als sie sich aber widersetzten und lästerten[a], schüttelte er seine Kleider aus und sagte zu ihnen: »Euer Blut komme auf euer Haupt![b] Ich bin frei von Schuld. Von jetzt an werde ich zu den Nichtjuden gehen.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann sowohl »Gott lästern« als auch »schmähen« oder »beleidigend reden« bedeuten. Wen oder was ihre Lästerung unmittelbar traf, wird hier nicht ausdrücklich gesagt.
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung bedeutet: Ihr selbst tragt die Verantwortung für die Folgen. »Haupt« steht im griechischen Text trotz der Mehrzahl der Angeredeten in der Einzahl und kann hier kollektiv verstanden werden.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »zu den Völkern«; gemeint sind in diesem Zusammenhang die Nichtjuden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: sich widersetzten
  rationale: Das reflexive Verb gibt die aktive, entschiedene Gegenwehr gegen Paulus und seine Botschaft natürlich und quellennah wieder.
- source_word: βλασφημούντων
  choice: lästerten
  rationale: Das deutsche »lästern« bewahrt die Spannweite zwischen gotteslästerlicher Rede und verächtlicher Schmähung, ohne ein im Griechischen nicht genanntes Objekt hinzuzufügen.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: schüttelte er seine Kleider aus
  rationale: Die Formulierung bleibt nahe am griechischen Ausdruck und lässt die symbolische Geste der Lossagung erkennbar, ohne sie im Haupttext auszudeuten.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Euer Blut komme über euer eigenes Haupt
  rationale: Die feierliche Verantwortungsformel wird als Idiom bewahrt. Der griechische Text hat trotz der Mehrzahl der Angeredeten das kollektive Singularwort »Haupt«.
- source_word: καθαρὸς ἐγώ
  choice: Ich bin frei von Schuld
  rationale: καθαρός bezeichnet hier bildlich die Freiheit von Verantwortung beziehungsweise Blutschuld; diese Wiedergabe ist im Deutschen klarer als das wörtliche »rein«.
- source_word: ἀπὸ τοῦ νῦν
  choice: Von jetzt an
  rationale: Die Wendung markiert idiomatisch und klar einen entschiedenen Übergang.
- source_word: εἰς τὰ ἔθνη
  choice: zu den Nichtjuden
  rationale: Im Gegensatz zur jüdischen Synagogengemeinde bezeichnet ἔθνη hier Menschen aus den anderen Völkern, also Nichtjuden. Die Wiedergabe ist für heutige Leser unmittelbar verständlich.
- source_word: πορεύσομαι
  choice: werde ich ... gehen
  rationale: Die schlichte Zukunftsform gibt Paulus’ angekündigte weitere Hinwendung natürlich wieder.
theological_decisions:
- issue: Verantwortungsformel »Euer Blut komme über euer eigenes Haupt«
  choice: Als feierliche Erklärung verstanden, dass die Angesprochenen die Verantwortung für die Folgen ihrer Ablehnung selbst tragen und Paulus davon frei ist.
  alternative: Als ausdrückliche Verfluchung oder Verwünschung verstanden.
  rationale: Der Wortlaut wird bewahrt, ohne ihn durch eine Paraphrase auf nur eine Deutung zu verengen. Der unmittelbare Zusatz »Ich bin frei von Schuld« stützt vor allem die Bedeutung einer Verantwortungsabgrenzung, schließt den ernsten Gerichtscharakter aber nicht aus.
- issue: Bezugsrichtung von βλασφημούντων
  choice: Ohne ausdrücklich genanntes Objekt als »lästerten« wiedergegeben.
  alternative: »ihn beschimpften« oder »Gott lästerten«
  rationale: Der griechische Text nennt weder Paulus noch Gott ausdrücklich als Objekt. Die Übersetzung vermeidet daher eine nicht eindeutig belegte Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Verlauf, ohne unnatürlich zu wirken. »Lästerten« erhält die lexikalische und theologische Mehrdeutigkeit; »Nichtjuden« macht den kontextuellen Gegensatz verständlich. Die traditionelle Blutschuldformel bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
