    issue: Inhalt der Anordnung
    rationale: „Claudius angeordnet hatte, alle Juden müssten Rom verlassen“ vermischt die berichtete Anordnung mit einer Notwendigkeitsformulierung. „dass alle Juden Rom verlassen sollten“ ist im Deutschen die klarere und natürlichere Inhaltsangabe einer Anordnung, ohne die Bedeutung zu verändern.
  - severity: low
    issue: Formulierung der Fußnote
    rationale: Die Alternative „aus Rom ausgewiesen werden“ sollte syntaktisch an den Inhalt der Anordnung anschließen. So ist eindeutig, dass sie eine mögliche Übersetzungsalternative zu „Rom verlassen sollten“ darstellt.
