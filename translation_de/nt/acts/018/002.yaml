source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: de
  text: Und er fand einen Juden namens Aquila, der aus Pontus stammte und vor Kurzem mit seiner Frau Priszilla aus Italien gekommen war, weil Claudius angeordnet hatte, dass alle Juden Rom verlassen sollten.[a] Da ging er zu ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass alle Juden aus Rom ausgewiesen würden“. Wörtlicher spricht das Griechische davon, von Rom getrennt zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: fand
  rationale: Das Aoristpartizip leitet die anschließende Begegnung ein; „fand“ gibt den schlichten Erzählsinn direkt wieder.
- source_word: τινα Ἰουδαῖον
  choice: einen Juden
  rationale: τις bezeichnet hier eine zunächst unbestimmte Einzelperson; Ἰουδαῖος hat in diesem Zusammenhang die ethnisch-religiöse Bedeutung „Jude“.
- source_word: ὀνόματι Ἀκύλαν
  choice: namens Aquila
  rationale: Die übliche deutsche Wendung gibt die griechische Namensformel knapp und natürlich wieder.
- source_word: Ποντικὸν τῷ γένει
  choice: der aus Pontus stammte
  rationale: Die Wendung bezeichnet Herkunft beziehungsweise Abstammung; die relative Formulierung ist in modernem Deutsch klar und idiomatisch.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: vor Kurzem … aus Italien gekommen war
  rationale: Das Perfektpartizip bezeichnet eine kurz zuvor erfolgte Ankunft, die für die erzählte Situation noch von Bedeutung ist.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: mit seiner Frau Priszilla
  rationale: „Mit“ macht im Deutschen natürlich deutlich, dass Priszilla Aquila bei der Ankunft aus Italien begleitete.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: weil Claudius angeordnet hatte
  rationale: διά mit substantiviertem Infinitiv bezeichnet den Grund; διατάσσω verweist hier auf eine amtliche Anordnung.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: alle Juden müssten Rom verlassen
  rationale: χωρίζεσθαι mit ἀπό beschreibt die Trennung von Rom. „Rom verlassen“ gibt das angeordnete Ergebnis natürlich wieder, ohne das stärker deutende „ausweisen“ in den Haupttext aufzunehmen.
- source_word: προσῆλθεν αὐτοῖς
  choice: Da ging er zu ihnen
  rationale: προσέρχομαι bezeichnet hier die Hinwendung zu den beiden; „ging zu ihnen“ passt zur erzählten Bewegung. „Da“ markiert den Fortgang, ohne ein zusätzliches logisches Verhältnis einzutragen.
theological_decisions:
- issue: Wiedergabe von Ἰουδαῖον / Ἰουδαίους
  choice: Jude / Juden
  alternative: Judäer / Judäer
  rationale: Gemeint sind hier Aquilas ethnisch-religiöse Zugehörigkeit und die jüdische Bevölkerung Roms, nicht lediglich Menschen aus der Landschaft Judäa.
- issue: Stärke der kaiserlichen Maßnahme
  choice: Rom verlassen
  alternative: aus Rom ausgewiesen werden
  rationale: Der griechische Ausdruck spricht wörtlich von einer Trennung von Rom. Der Haupttext bewahrt diese sprachliche Zurückhaltung; die historisch naheliegende Ausweisung wird als mögliche Deutung in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem griechischen Handlungsablauf, wird jedoch durch Relativsatz und abschließendes „Da“ für heutige Leser entlastet.
