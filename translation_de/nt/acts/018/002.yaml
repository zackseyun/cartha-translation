  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und wesentlichen Aussagen des griechischen Textes zuverlässig wieder: Paulus findet Aquila, einen Juden aus Pontus, der kürzlich mit Priszilla aus Italien gekommen war; die Ursache ist die Anordnung des Claudius, und Paulus geht zu beiden. „Rom verlassen“ ist eine angemessen zurückhaltende Wiedergabe von χωρίζεσθαι ... ἀπὸ τῆς Ῥώμης.'
  naturalness: Der Satz ist insgesamt modernes, verständliches Standarddeutsch. Die Wiedergabe „alle Juden müssten Rom verlassen“ ist jedoch nach „angeordnet hatte“ weniger präzise und stilistisch etwas sperrig. Ein dass-Satz mit „verlassen sollten“ bildet den Inhalt einer Anordnung klarer ab.
  terminology: „Jude/Juden“, „Pontus“, „Aquila“, „Priszilla“ und „Claudius“ sind angemessen. Die Fußnote soll die mögliche stärkere Deutung als Ausweisung als Alternative zum Satzinhalt formulieren, nicht als unverbundene Infinitivgruppe.
