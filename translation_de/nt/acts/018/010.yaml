  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: de
  text: Denn ich bin mit dir, und niemand wird dich angreifen, um dir zu schaden.[a] Denn ich habe viele Menschen in dieser Stadt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Niemand wird Hand an dich legen, um dir zu schaden.“'
    reason: lexical_alternative
  - marker: b
    text: „Viele Menschen“ kann Menschen meinen, die dem Herrn gehören, einschließlich solcher, die noch zum Glauben kommen werden.
    reason: theological_ambiguity
lexical_decisions:
- source_word: διότι
  choice: denn
  rationale: Die Konjunktion leitet jeweils eine Begründung ein. „Denn“ bewahrt den kausalen Zusammenhang und klingt in einer göttlichen Zusage natürlich und würdig.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: ich bin mit dir
  rationale: Die ausdrückliche Nennung von ἐγώ betont den Sprecher. Im Deutschen trägt „ich bin mit dir“ diese Zusage klar, ohne das unnatürliche „ich selbst“ zu benötigen.
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: niemand wird dich angreifen
  rationale: ἐπιτίθημι mit dem Dativ bezeichnet hier ein feindliches Vorgehen gegen Paulus. „Angreifen“ ist gegenwärtiges, gut verständliches Deutsch; die bildhaftere Alternative wird in der Fußnote genannt.
- source_word: τοῦ κακῶσαί σε
  choice: um dir zu schaden
  rationale: Der artikulierte Infinitiv gibt hier Ziel oder beabsichtigte Folge des Angriffs an. „Dir schaden“ lässt die Art des Schadens entsprechend dem griechischen Ausdruck offen.
- source_word: λαός ἐστί μοι πολύς
  choice: ich habe viele Menschen …, die zu mir gehören
  rationale: Die Konstruktion εἰμί mit dem Dativ μοι drückt Zugehörigkeit beziehungsweise Besitz aus. Das kollektive Singularwort λαός mit πολύς wird im heutigen Deutsch natürlicher durch „viele Menschen“ wiedergegeben; der Relativsatz macht die in μοι enthaltene Zugehörigkeit sichtbar, ohne festzulegen, ob diese Menschen bereits glauben oder erst noch glauben werden.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: in dieser Stadt
  rationale: Dies ist die direkte und natürliche Wiedergabe des Ortsausdrucks; πόλις bezeichnet hier Korinth als Stadt.
theological_decisions:
- issue: Wer mit den „vielen Menschen“ in Korinth gemeint ist
  choice: Der Haupttext bezeichnet sie als Menschen, die dem Herrn gehören, lässt aber offen, ob sie bereits glauben oder künftig zum Glauben kommen werden.
  alternative: Die Aussage könnte lediglich viele Paulus gegenüber günstig eingestellte Menschen meinen oder ausschließlich bereits Glaubende bezeichnen.
  rationale: λαός und der Zugehörigkeitsdativ μοι sprechen für eine besondere Beziehung zum Herrn. Der unmittelbare Zusammenhang begründet damit, warum Paulus weiterreden soll. Eine zeitliche oder dogmatische Präzisierung, wann und wie diese Menschen zu ihm gehören, bietet der griechische Wortlaut jedoch nicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, während die ungewöhnliche Besitzkonstruktion mit λαός idiomatisch wiedergegeben wird.
