  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: de
  text: 'Eines Nachts sagte der Herr Paulus in einer Vision[a]: „Hab keine Angst, sondern rede weiter und schweige nicht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der Nacht durch eine Vision“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die übliche und theologisch angemessene Wiedergabe von κύριος; der Titel bleibt erhalten, ohne den Sprecher ausdrücklich als Jesus zu identifizieren.
- source_word: ἐν νυκτὶ
  choice: in der Nacht
  rationale: Bewahrt die temporale Präpositionalfügung und klingt in modernem Standarddeutsch natürlich und würdevoll.
- source_word: δι’ ὁράματος
  choice: durch eine Vision
  rationale: Gibt διά mit Genitiv als Mittel bzw. Vermittlung wieder und erhält damit die Formulierung des griechischen Textes; idiomatisch wäre auch „in einer Vision“ möglich.
- source_word: Μὴ φοβοῦ
  choice: Hab keine Angst
  rationale: Natürliche moderne Wiedergabe des verneinten Imperativs; sie spricht Paulus direkt und verständlich an.
- source_word: ἀλλὰ λάλει
  choice: sondern rede weiter
  rationale: „Rede weiter“ bringt den fortdauernden Aspekt des Präsensimperativs λάλει zum Ausdruck.
- source_word: καὶ μὴ σιωπήσῃς
  choice: und schweige nicht
  rationale: Knapp und direkt; bewahrt die negative Aufforderung und die rhetorische Parallelität mit „rede weiter“.
theological_decisions:
- issue: Identität des „Herrn“
  choice: Der Sprecher wird entsprechend dem griechischen Text lediglich „der Herr“ genannt.
  alternative: „der Herr Jesus“
  rationale: Im Kontext der Apostelgeschichte ist wahrscheinlich der auferstandene Jesus gemeint. Da der Vers selbst jedoch nur ὁ κύριος sagt, wird die Identität nicht durch einen Zusatz ausdrücklich festgelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede verwendet die natürliche Singularform „Hab“, ohne altertümliches „Fürchte dich nicht“. Das einleitende δέ wird mit „Doch“ wiedergegeben, was den narrativen Übergang und einen leichten Gegensatz zum vorausgehenden Kontext markiert.
