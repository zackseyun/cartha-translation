    rationale: „in der Nacht durch eine Vision“ bildet die griechische Wortfolge zu eng nach und klingt im modernen Standarddeutsch holprig. „eines Nachts in einer Vision“ ist die gewöhnliche deutsche Ausdrucksweise und lässt die Aussage unverändert.
  - severity: low
    issue: Satzschluss der direkten Rede
    rationale: Das griechische Zitat ist nicht als Ausruf markiert. Ein Punkt ist die neutralere deutsche Interpunktion; der imperative Nachdruck bleibt erhalten.
