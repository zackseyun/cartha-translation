  text: Danach verließ er Athen und ging nach Korinth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Die Wendung dient als zeitlicher Erzählübergang. „Danach“ gibt die zeitliche Abfolge knapp und natürlich wieder.
- source_word: χωρισθεὶς
  choice: verließ er
  rationale: Das Aorist-Passivpartizip von χωρίζω bezeichnet hier idiomatisch den Aufbruch von einem Ort. „Verließ er“ ist im Deutschen klar und natürlich, ohne ein unpassendes Passiv zu erzwingen.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: Athen
  rationale: ἐκ bezeichnet den Ausgangspunkt. Beim deutschen Verb „verlassen“ wird der Ort idiomatisch als direktes Objekt ausgedrückt.
- source_word: ἦλθεν
  choice: ging
  rationale: Obwohl ἔρχομαι grundsätzlich „kommen“ heißen kann, beschreibt „ging“ aus der Perspektive des Erzählers die Weiterreise zu einer anderen Stadt natürlich.
- source_word: εἰς Κόρινθον
  choice: nach Korinth
  rationale: εἰς bezeichnet die Richtung beziehungsweise das Ziel der Bewegung; bei Städtenamen ist „nach Korinth“ die übliche deutsche Form.
