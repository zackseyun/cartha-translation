source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: de
  text: Als er nach Achaia hinüberreisen wollte, ermutigten ihn die Brüder[a] und schrieben den Jüngern, sie sollten ihn willkommen heißen. Nach seiner Ankunft war er denen, die durch die Gnade zum Glauben gekommen waren, eine große Hilfe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ kann hier auch die Gemeinschaft der Glaubenden einschließlich der Frauen eingeschlossen sein; im Griechischen steht die maskuline Form.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Nach seiner Ankunft war er durch die Gnade denen, die zum Glauben gekommen waren, eine große Hilfe.“ Die griechische Wendung „durch die Gnade“ kann sich statt auf ihr Zum-Glauben-Kommen auch auf die Hilfe des Apollos beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: Als er … wollte
  rationale: Der Genitivus absolutus bezeichnet hier den begleitenden Umstand von Apollos’ Absicht. Die Formulierung ist natürlich und bewahrt den Willensbezug.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: nach Achaia hinüberreisen
  rationale: Das Verb kann im Reisekontext ein Hinübergehen oder Durchqueren bezeichnen. „Hinüberreisen“ gibt hier die Bewegung von Ephesus nach Achaia idiomatisch wieder.
- source_word: προτρεψάμενοι
  choice: ermutigten ihn
  rationale: Das Partizip bezeichnet eine unterstützende Ermunterung oder Aufforderung. „Ermutigten“ passt zum positiven Zusammenhang und klingt im modernen Deutsch natürlich.
- source_word: οἱ ἀδελφοὶ
  choice: die Brüder
  rationale: Die maskuline Ausgangsform wird bewahrt. Im frühchristlichen Sprachgebrauch kann die Bezeichnung zugleich die weitere Gemeinschaft der Glaubenden einschließen; dies wird in einer Fußnote erläutert.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: schrieben den Jüngern
  rationale: Der Dativ bezeichnet die Empfänger des Schreibens. „Jünger“ entspricht dem für die Apostelgeschichte charakteristischen μαθηταί.
- source_word: ἀποδέξασθαι αὐτόν
  choice: sie sollten ihn willkommen heißen
  rationale: Der Infinitiv hängt inhaltlich vom Schreiben ab und bezeichnet eine freundliche Aufnahme. Ein deutscher Inhaltssatz ist hier klarer als eine wörtlichere Infinitivkonstruktion.
- source_word: ὃς παραγενόμενος
  choice: Nach seiner Ankunft
  rationale: Die Relativkonstruktion mit Partizip führt Apollos’ Wirken nach seiner Ankunft ein. Die nominale Wendung ist knapp und natürlich.
- source_word: συνεβάλετο πολὺ
  choice: war … eine große Hilfe
  rationale: Das Medium bezeichnet in diesem Zusammenhang beträchtliche Unterstützung. Die gewählte Wendung ist idiomatisch und gibt den Dativ der unterstützten Personen klar wieder.
- source_word: τοῖς πεπιστευκόσιν
  choice: denen, die … zum Glauben gekommen waren
  rationale: Das Perfektpartizip beschreibt Menschen, deren Glauben bereits begründet war. Die Formulierung bewahrt diesen vorausliegenden, fortwirkenden Zustand.
- source_word: διὰ τῆς χάριτος
  choice: durch die Gnade
  rationale: Die Präpositionalphrase bezeichnet am wahrscheinlichsten das Mittel, durch das sie zum Glauben gekommen waren. „Gnade“ bleibt ohne den im Griechischen nicht ausdrücklich genannten Zusatz „Gottes“.
theological_decisions:
- issue: Zuordnung von διὰ τῆς χάριτος
  choice: 'Die Wendung wird auf das Zum-Glauben-Kommen bezogen: „die durch die Gnade zum Glauben gekommen waren“.'
  alternative: 'Die Wendung kann auf die Hilfe des Apollos bezogen werden: „Durch die Gnade war er denen, die zum Glauben gekommen waren, eine große Hilfe.“'
  rationale: Wortstellung und Zusammenhang sprechen eher für den Bezug auf die Glaubenden. Da der griechische Satz jedoch auch die andere Zuordnung zulässt, wird diese echte syntaktische und theologische Spannung in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau wurde gegenüber dem Griechischen behutsam gegliedert, ohne Bedeutungsbezüge zu glätten. Geografische und gemeindliche Fachbegriffe bleiben erhalten.
