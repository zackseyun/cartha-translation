id: ACT.18.12
reference: Acts 18:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: de
  text: Als aber Gallio Prokonsul von Achaia war, erhoben sich die Juden[a] geschlossen gegen Paulus und brachten ihn vor den Richterstuhl[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist hier die örtliche jüdische Gruppe, die gegen Paulus vorging, nicht das jüdische Volk insgesamt.
    reason: cultural_note
  - marker: b
    text: 'Oder: „vor das Tribunal“. Das griechische Wort bezeichnet den amtlichen Richterstuhl beziehungsweise die Gerichtsplattform.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen erzählerischen Übergang mit leichter Gegenüberstellung und entspricht hier natürlich dem einsetzenden Widerstand.
- source_word: ἀνθυπάτου ὄντος
  choice: als … Prokonsul … war
  rationale: Der Genitivus absolutus gibt den zeitlichen Rahmen an; die deutsche Konstruktion ist klar und bewahrt diese Funktion.
- source_word: ἀνθύπατος
  choice: Prokonsul
  rationale: Dies ist der genaue römische Amtstitel des Statthalters einer senatorischen Provinz und daher präziser als das allgemeinere „Statthalter“.
- source_word: Ἀχαΐας
  choice: Achaia
  rationale: Übliche deutsche Form des Namens der römischen Provinz.
- source_word: κατεπέστησαν
  choice: erhoben sich … gegen
  rationale: Gibt das feindselige Vorgehen gegen Paulus wieder, ohne eine im Text nicht ausdrücklich genannte körperliche Gewalttat einzutragen.
- source_word: ὁμοθυμαδὸν
  choice: geschlossen
  rationale: Drückt das einmütige, gemeinsame Vorgehen der Gruppe in idiomatischem modernem Deutsch aus.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Entspricht dem ausdrücklichen Wortlaut, ohne den Bezug eigenmächtig auf „jüdische Führer“ zu verengen; eine Fußnote verhindert eine pauschale Verallgemeinerung.
- source_word: τῷ Παύλῳ
  choice: gegen Paulus
  rationale: Der Dativ bezeichnet bei diesem Verb die Person, gegen die sich das feindselige Vorgehen richtet.
- source_word: ἤγαγον αὐτὸν
  choice: brachten ihn
  rationale: Gibt ἄγω im gerichtlichen Zusammenhang sachlich wieder und vermeidet die unbelegte Verschärfung „schleppten“.
- source_word: ἐπὶ τὸ βῆμα
  choice: vor den Richterstuhl
  rationale: Bezeichnet hier den amtlichen Sitz beziehungsweise die Plattform, an der ein Magistrat Recht sprach; „Richterstuhl“ bewahrt das konkrete Bild und den gerichtlichen Sinn.
theological_decisions:
- issue: Wiedergabe von οἱ Ἰουδαῖοι in einer Konflikterzählung
  choice: die Juden
  alternative: die jüdischen Führer; die Judäer
  rationale: Der griechische Text nennt weder ausschließlich Führungspersonen noch verwendet er eine eindeutig geografische Bezeichnung. Die direkte Wiedergabe bleibt daher erhalten; die Fußnote stellt klar, dass im Kontext die örtliche handelnde Gruppe gemeint ist und keine pauschale Aussage über alle Juden gemacht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der genaue römische Amtstitel „Prokonsul“ bleibt erhalten; „geschlossen“ vermittelt die koordinierte gemeinsame Aktion, ohne altertümlich zu wirken.
