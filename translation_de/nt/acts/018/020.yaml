lexical_decisions:
- source_word: ἐρωτώντων δὲ αὐτῶν
  choice: Als sie ihn aber baten
  rationale: Der Genitivus absolutus wird als natürlicher deutscher Temporalsatz wiedergegeben. δέ markiert einen leichten Gegensatz beziehungsweise narrativen Übergang und wird mit „aber“ ausgedrückt; das im Deutschen erforderliche Objekt „ihn“ ergibt sich aus dem Kontext.
- source_word: ἐπὶ πλείονα χρόνον
  choice: länger
  rationale: Die knappe idiomatische Wiedergabe bewahrt den komparativen Sinn einer ausgedehnteren Aufenthaltsdauer, ohne das Deutsche unnötig zu beschweren.
- source_word: μεῖναι
  choice: zu bleiben
  rationale: „Bleiben“ ist in diesem Reisekontext die natürliche moderne Entsprechung des Aoristinfinitivs.
- source_word: οὐκ ἐπένευσεν
  choice: stimmte er nicht zu
  rationale: ἐπινεύω bezeichnet hier das Zustimmen zu einer Bitte. Die Formulierung wahrt die Negation und vermeidet die stärkere, möglicherweise schroffere Aussage „er weigerte sich“.
