id: ACT.18.22
reference: Acts 18:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: de
  text: Nachdem er nach Cäsarea hinabgegangen war, zog er hinauf und begrüßte die Gemeinde.[a] Dann zog er hinab nach Antiochia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich die Gemeinde in Jerusalem. Viele Übersetzungen nennen Jerusalem hier ausdrücklich; im griechischen Text steht der Ortsname jedoch nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: nachdem er ... hinabgegangen war
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Hauptverb vorausgeht. „Hinabgegangen“ bewahrt zugleich Lukas’ Richtungs- und Reisesprache.
- source_word: Καισάρειαν
  choice: Cäsarea
  rationale: Übliche deutsche Form des Ortsnamens; im Kontext ist das an der Küste gelegene Cäsarea gemeint.
- source_word: ἀναβὰς
  choice: zog er hinauf
  rationale: Die Richtungsaussage bleibt erhalten, ohne das im Griechischen nicht ausdrücklich genannte Jerusalem in den Haupttext einzufügen.
- source_word: ἀσπασάμενος
  choice: begrüßte
  rationale: Direkte und kontextgemäße Wiedergabe des Verbs im Bericht über die Reise.
- source_word: τὴν ἐκκλησίαν
  choice: die Gemeinde
  rationale: „Gemeinde“ ist im modernen Standarddeutsch eine natürliche Bezeichnung für die örtliche christliche Gemeinschaft und vermeidet die mögliche Verengung von „Kirche“ auf Institution oder Gebäude.
- source_word: κατέβη
  choice: zog er hinab
  rationale: Bewahrt die topografische Richtungsangabe und passt idiomatisch zu einem Reisebericht.
- source_word: Ἀντιόχειαν
  choice: Antiochia
  rationale: Übliche deutsche Form des Ortsnamens; gemeint ist hier das syrische Antiochia.
theological_decisions:
- issue: Ob das unausgesprochene Ziel des Hinaufziehens als Jerusalem bezeichnet werden soll
  choice: Das Ziel bleibt im Haupttext unausgesprochen.
  alternative: „zog er nach Jerusalem hinauf“
  rationale: Der Reiseverlauf und die Erwähnung „der Gemeinde“ legen Jerusalem nahe. Da der griechische Text den Ort jedoch nicht nennt, wird diese plausible Deutung nicht als ausdrückliche Textaussage dargestellt, sondern in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Richtungsangaben „hinab“ und „hinauf“ werden als charakteristischer Bestandteil des lukanischen Reiseberichts bewahrt. Das Perfekt „hinabgegangen war“ macht die zeitliche Beziehung des ersten Partizips natürlich verständlich.
