  source_fidelity: 'Der Entwurf bildet die Abfolge und die Richtungsangaben des griechischen Textes zuverlässig ab: κατελθών εἰς Καισάρειαν mit „nach Cäsarea hinabgegangen“, ἀναβὰς mit „zog er hinauf“, ἀσπασάμενος mit „begrüßte“ und κατέβη εἰς Ἀντιόχειαν mit „zog er hinab nach Antiochia“. Das im Griechischen nicht genannte Ziel des Hinaufziehens wird zu Recht nicht in den Haupttext eingefügt.'
