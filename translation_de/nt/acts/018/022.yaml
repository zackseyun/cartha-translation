  terminology: „Gemeinde“ ist für τὴν ἐκκλησίαν idiomatisch und kontextgerecht. „Cäsarea“ und „Antiochia“ sind etablierte deutsche Ortsnamensformen. Die Fußnote wahrt die begründete, aber textlich unausgesprochene Zuordnung zu Jerusalem.
