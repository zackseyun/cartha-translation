base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: de
  text: Sie kamen nach Ephesus, und er ließ sie dort zurück.[a] Er selbst aber ging in die Synagoge und führte mit den Juden ein Gespräch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Priszilla und Aquila aus dem vorigen Vers.
    reason: cross_reference
  - marker: b
    text: 'Oder: „erörterte mit den Juden“ oder „sprach mit den Juden“. Das griechische Wort bezeichnet einen erörternden, dialogischen Austausch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: kamen nach
  rationale: Das Verb bezeichnet das Erreichen eines Zielortes. „Sie kamen nach Ephesus“ ist im Deutschen natürlich und gibt den erzählerischen Zusammenhang treffend wieder.
- source_word: κἀκείνους
  choice: die beiden
  rationale: Das Pronomen verweist im unmittelbaren Kontext auf Priszilla und Aquila. Der Dual ist im Griechischen nicht ausdrücklich markiert, ergibt sich aber eindeutig aus dem vorigen Vers; die Namen werden nicht in den Vers hineingetragen.
- source_word: κατέλιπεν … αὐτοῦ
  choice: ließ … dort zurück
  rationale: καταλείπω bezeichnet hier das Zurücklassen, während das adverbial gebrauchte αὐτοῦ den Ort als „dort“ angibt.
- source_word: αὐτὸς δὲ
  choice: Er selbst aber
  rationale: Die emphatische Form hebt sein eigenes Handeln gegenüber dem Zurückbleiben seiner Begleiter hervor; δέ markiert den Kontrast.
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: ging in die Synagoge
  rationale: Die finite deutsche Form gibt das vorzeitige beziehungsweise begleitende Partizip in natürlichem Erzählstil wieder.
- source_word: διελέξατο
  choice: führte … ein Gespräch
  rationale: Das Medium von διαλέγομαι bezeichnet hier einen Austausch durch Erörterung und Gespräch. Die Wiedergabe bewahrt den dialogischen Charakter, ohne unnötig einen Streit zu unterstellen.
- source_word: τοῖς Ἰουδαίοις
  choice: mit den Juden
  rationale: Die Form bezeichnet hier die jüdischen Anwesenden in der Synagoge; die direkte Wiedergabe vermeidet die unbelegte Einengung auf Leiter.
