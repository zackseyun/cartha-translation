translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. „Die beiden“ schafft einen natürlichen Rückbezug, während die Fußnote die Referenz ausdrücklich nennt. „Führte … ein Gespräch“ bewahrt den wechselseitigen Charakter des griechischen Verbs.
