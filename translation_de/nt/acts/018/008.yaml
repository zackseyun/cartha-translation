  rationale: Die Überarbeitung stellt die direkte Glaubensaussage über Krispus wieder her, gibt οἶκος mit dem im modernen Deutsch eindeutigen „Haushalt“ wieder und vermeidet mit „hörten zu“ eine inhaltliche Ergänzung. Die idiomatische Wiedergabe der passiven Taufe und die Fußnote zur fortlaufenden Aspektnuance bleiben erhalten.
