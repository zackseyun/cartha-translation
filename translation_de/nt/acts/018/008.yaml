id: ACT.18.8
reference: Acts 18:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: de
  text: Krispus aber, der Synagogenvorsteher, glaubte an den Herrn, zusammen mit seinem ganzen Haushalt. Viele Korinther hörten zu, glaubten und ließen sich taufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Imperfektformen stellen das Glauben und Getauftwerden vieler Korinther als ein fortlaufendes Geschehen dar.
    reason: Aspektnuance der Imperfektformen ἐπίστευον und ἐβαπτίζοντο
lexical_decisions:
- source_word: Κρίσπος
  choice: Krispus
  rationale: Der Personenname wird nach üblicher deutscher Transliterationskonvention mit K wiedergegeben.
- source_word: ἀρχισυνάγωγος
  choice: Synagogenvorsteher
  rationale: Bezeichnet den leitenden Amtsträger einer Synagoge und ist im Deutschen präzise und geläufig.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: kam zum Glauben an den Herrn
  rationale: Gibt den punktuellen Aorist idiomatisch wieder; der Dativ bei πιστεύω wird im Deutschen natürlich mit „an“ ausgedrückt, während κύριος als Titel „Herr“ erhalten bleibt.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: mit seinem ganzen Haus
  rationale: „Haus“ kann im biblisch geprägten, aber verständlichen Deutsch die gesamte Hausgemeinschaft bezeichnen und bewahrt die knappe Ausdrucksweise des Griechischen.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: viele von den Korinthern
  rationale: 'Bewahrt den partitiven Sinn: Viele aus der Gruppe der Korinther reagierten.'
- source_word: ἀκούοντες
  choice: die davon hörten
  rationale: Gibt das gleichzeitige Partizip natürlich wieder; „davon“ macht den im Griechischen aus dem Zusammenhang erschlossenen Gegenstand des Hörens deutlich, ohne ihn näher festzulegen.
- source_word: ἐπίστευον
  choice: kamen zum Glauben
  rationale: Das Imperfekt schildert eine sich fortsetzende beziehungsweise wiederholte Reaktion vieler Menschen; die Formulierung ist natürlicher als „waren glaubend“.
- source_word: ἐβαπτίζοντο
  choice: ließen sich taufen
  rationale: Idiomatiche deutsche Wiedergabe des passiven Taufempfangs; zusammen mit dem Kontext wird der fortlaufende Vorgang deutlich.
theological_decisions:
- issue: Umfang des Glaubens der Hausgemeinschaft
  choice: „mit seinem ganzen Haus“ ohne nähere Erklärung
  alternative: Ausdrücklich sagen, jedes einzelne Mitglied habe persönlich in gleicher Weise geglaubt, oder die Aussage rein korporativ deuten
  rationale: Der griechische Text fasst Krispus und seine Hausgemeinschaft zusammen, erläutert aber nicht die individuelle Beteiligung jedes Mitglieds. Die Übersetzung vermeidet konfessionelle Folgerungen.
- issue: Referent von „der Herr“
  choice: den griechischen Titel als „den Herrn“ wiedergeben
  alternative: „den Herrn Jesus“
  rationale: Im Erzählzusammenhang ist Jesus gemeint, doch der Ausgangstext nennt hier nur κύριος. Die knappe Titelform bleibt daher erhalten.
- issue: Aspekt der Reaktion vieler Korinther
  choice: idiomatischer Haupttext mit Aspekthinweis in der Fußnote
  alternative: „waren dabei zu glauben und getauft zu werden“
  rationale: Die Imperfektformen stellen Glauben und Taufe als fortlaufendes Geschehen unter vielen Korinthern dar. Eine streng formale Wiedergabe wäre im Deutschen schwerfällig; die Fußnote bewahrt die relevante Nuance.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Synagogenvorsteher“ ist präzise und allgemein verständlich. „Ganzes Haus“ bewahrt die soziale Bedeutung von οἶκος in knapper biblischer Ausdrucksweise; die zweite Satzhälfte ist zugunsten natürlicher deutscher Syntax idiomatisch gestaltet.
