  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: de
  text: Da packten sie alle Sosthenes[a], den Synagogenvorsteher, und schlugen ihn immer wieder vor dem Richterstuhl. Doch Gallio kümmerte sich um nichts davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben hier „alle Griechen“ statt nur „sie alle“. Der wahrscheinlich ältere, kürzere Text lässt offen, um welche Gruppe es sich handelt.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: packten
  rationale: Das Aoristpartizip bezeichnet ein feindseliges Ergreifen. „packten“ ist im modernen Deutschen natürlich und leitet unmittelbar zur Misshandlung über.
- source_word: πάντες
  choice: sie alle
  rationale: Die substantivisch gebrauchte Pluralform wird vollständig wiedergegeben, ohne die im griechischen Text nicht genannte Gruppe zu bestimmen.
- source_word: ἀρχισυνάγωγον
  choice: Synagogenvorsteher
  rationale: Der Ausdruck bezeichnet den leitenden Amtsträger einer Synagoge; „Synagogenvorsteher“ ist präzise, geläufig und knapp.
- source_word: ἔτυπτον
  choice: schlugen
  rationale: Der Imperfekt stellt das Schlagen als andauernden oder wiederholten Vorgang dar. Im Deutschen kann „schlugen“ dies im Kontext natürlich ausdrücken, ohne eine schwerfällige Verlaufsform zu erzwingen.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: vor dem Richterstuhl
  rationale: βῆμα bezeichnet hier die richterliche Plattform beziehungsweise den Ort der Gerichtsverhandlung. „Richterstuhl“ hält den konkreten und rechtlichen Bezug zusammen.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: kümmerte sich um nichts davon
  rationale: Die idiomatische Verbindung bedeutet, dass diese Vorgänge Gallio nicht bekümmerten oder interessierten. Die deutsche Wendung gibt seine Gleichgültigkeit klar und natürlich wieder.
- source_word: δέ
  choice: Da
  rationale: δέ führt den nächsten Erzählvorgang ein; „Da“ sorgt für einen natürlichen narrativen Anschluss.
- source_word: καί
  choice: Doch
  rationale: Obwohl καί gewöhnlich „und“ bedeutet, hebt der Zusammenhang den Gegensatz zwischen der Gewalt und Gallios Untätigkeit hervor. „Doch“ macht diesen Kontrast idiomatisch sichtbar.
theological_decisions:
- issue: Identität der mit πάντες bezeichneten Gruppe
  choice: Im Haupttext bleibt die Gruppe mit „sie alle“ unbestimmt.
  alternative: „alle Griechen“ beziehungsweise eine Identifikation als Juden
  rationale: Der SBLGNT-Text nennt nur πάντες und bestimmt die Gruppe nicht ausdrücklich. Die Übersetzung bewahrt diese echte Unbestimmtheit; die abweichende Lesart wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem Erzählstil. Die Formulierungen vermeiden konfessionelle Zusätze und bewahren die Unbestimmtheit des griechischen Subjekts.
