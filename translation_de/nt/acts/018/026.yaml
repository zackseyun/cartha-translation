id: ACT.18.26
reference: Acts 18:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: de
  text: Und er begann, in der Synagoge offen und mutig zu sprechen. Als Priscilla und Aquila ihn hörten, nahmen sie ihn zu sich[a] und erklärten ihm den Weg Gottes noch genauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahmen ihn beiseite“, „nahmen ihn mit“ oder „nahmen ihn bei sich auf“. Das griechische Verb kann sowohl das Aufnehmen einer Person als auch das Mit- oder Beiseitenehmen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: Und er begann
  rationale: οὗτος verweist auf Apollos im vorausgehenden Zusammenhang; im Deutschen ist das Pronomen natürlich. τέ verbindet den Satz leicht mit dem Vorhergehenden, und ἤρξατο mit Infinitiv bedeutet „begann“.
- source_word: παρρησιάζεσθαι
  choice: offen und mutig zu sprechen
  rationale: Das Verb bezeichnet freimütiges, unerschrockenes öffentliches Reden. Die Doppelung gibt sowohl die Offenheit als auch die Kühnheit in natürlichem Deutsch wieder.
- source_word: ἐν τῇ συναγωγῇ
  choice: in der Synagoge
  rationale: Direkte und etablierte Wiedergabe der Ortsangabe.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Als ... ihn hörten
  rationale: Das Partizip ist hier zeitlich zu verstehen. δέ markiert einen leichten Fortgang, der im Deutschen nicht eigens mit einem adversativen „aber“ ausgedrückt werden muss.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Priscilla und Aquila
  rationale: Übliche deutsche Namensformen; die Reihenfolge des griechischen Textes bleibt erhalten.
- source_word: προσελάβοντο αὐτὸν
  choice: nahmen sie ihn zu sich
  rationale: Die Formulierung bewahrt die Bedeutungsbreite des Verbs zwischen persönlichem Aufnehmen, Mitnehmen und Beiseitenehmen, ohne eine ausschließlich private Zurechtweisung oder bloße Gastfreundschaft festzulegen.
- source_word: ἀκριβέστερον
  choice: noch genauer
  rationale: Der Komparativ bezeichnet eine präzisere Erklärung im Verhältnis zu Apollos’ bisheriger Kenntnis. „Noch genauer“ klingt im Deutschen natürlich und wahrt den vergleichenden Sinn.
- source_word: αὐτῷ ἐξέθεντο
  choice: erklärten ihm
  rationale: ἐκτίθημι im Medium bedeutet hier „erklären/darlegen“; der Dativ wird idiomatisch mit „ihm“ wiedergegeben.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: den Weg Gottes
  rationale: Die genitivische Wendung bleibt eng am griechischen Ausdruck und lässt offen, wie umfassend „Weg“ hier als Botschaft, Lebensweg oder Bezeichnung des christlichen Glaubens gemeint ist.
theological_decisions:
- issue: Art der Aufnahme des Apollos durch Priscilla und Aquila
  choice: „nahmen sie ihn zu sich“
  alternative: „nahmen sie ihn beiseite“ oder „nahmen sie bei sich auf“
  rationale: προσλαμβάνομαι kann das Aufnehmen einer Person ebenso wie das Mit- oder Beiseitenehmen bezeichnen. Der Zusammenhang legt ein persönliches Gespräch nahe, bestimmt aber weder den Ort noch die genaue soziale Form eindeutig; die gewählte Fassung erhält diese Spannung.
- issue: Bedeutung von „der Weg Gottes“
  choice: Die ursprüngliche Wendung bleibt ohne erklärende Erweiterung stehen.
  alternative: Ausdrückliche Deutung als christliche Botschaft, Heilsweg oder moralischer Lebensweg
  rationale: Im Zusammenhang bezeichnet die Wendung wahrscheinlich Gottes Weg beziehungsweise die christliche Lehre, doch der Vers selbst grenzt ihren Bedeutungsumfang nicht vollständig ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Offen und mutig“ macht die freimütige Rede verständlich; „nahmen sie ihn zu sich“ vermeidet eine vorschnelle Festlegung auf private Korrektur oder häusliche Gastfreundschaft.
