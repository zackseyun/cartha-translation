  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: de
  text: 'Sie sagten: „Dieser Mann überredet die Menschen, Gott gegen das Gesetz[a] zu verehren.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist wahrscheinlich das jüdische Gesetz; im griechischen Text steht lediglich „das Gesetz“. Möglich ist auch: „im Widerspruch zum Gesetz“ oder „unter Verletzung des Gesetzes“.'
    reason: Kultureller Hinweis und lexikalische Alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'Sie sagten: „…“'
  rationale: Das Partizip leitet den Inhalt der Anklage ein. Im Deutschen gibt direkte Rede den griechischen Anschluss mit ὅτι natürlich wieder.
- source_word: Παρὰ τὸν νόμον
  choice: gegen das Gesetz
  rationale: παρά mit Akkusativ bezeichnet hier einen Widerspruch zum Gesetz oder dessen Übertretung. „Gegen das Gesetz“ ist natürlich und wahrt den rechtlichen Ton der Anklage.
- source_word: ἀναπείθει
  choice: überredet
  rationale: Das Verb bezeichnet ein nachdrückliches Überzeugen oder Gewinnen für etwas. „Überredet“ bewahrt diese Nuance, ohne die nicht zwingend im griechischen Wort enthaltene Wertung „verführt“ einzutragen.
- source_word: οὗτος
  choice: Dieser Mann
  rationale: Die demonstrative, in der Anklage pointierte Ausdrucksweise wird bewahrt, ohne unnötig abwertend zu klingen.
- source_word: τοὺς ἀνθρώπους
  choice: die Menschen
  rationale: ἄνθρωποι ist hier allgemein und nicht ausschließlich auf Männer bezogen.
- source_word: σέβεσθαι τὸν θεόν
  choice: Gott zu verehren
  rationale: σέβομαι bezeichnet hier religiöse Verehrung. „Gott verehren“ ist idiomatisch und lässt gegenüber „anbeten“ die etwas breitere Bedeutung des Verbs erkennen.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Der griechische Text bestimmt das Gesetz nicht ausdrücklich als jüdisch; diese Offenheit bleibt im Haupttext erhalten.
theological_decisions:
- issue: Bezug von „das Gesetz“
  choice: Die unbestimmte Bezeichnung „das Gesetz“ bleibt im Haupttext erhalten.
  alternative: „das jüdische Gesetz“ oder „unser Gesetz“
  rationale: Im Zusammenhang ist wahrscheinlich das jüdische Gesetz gemeint, doch der griechische Wortlaut fügt weder „jüdisch“ noch „unser“ hinzu.
- issue: Bedeutung von σέβεσθαι
  choice: „Gott zu verehren“
  alternative: „Gott anzubeten“
  rationale: „Verehren“ bildet die religiöse Bedeutung ab, ohne den Ausdruck stärker auf kultische Anbetung einzuengen, als es das griechische Verb verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede und der forensische Charakter der Anklage bleiben erhalten.
