id: ACT.18.5
reference: Acts 18:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: de
  text: Als aber Silas und Timotheus aus Mazedonien herabkamen, widmete sich Paulus ganz dem Wort[a] und bezeugte den Juden eindringlich, dass Jesus der Messias[b] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde vom Wort gedrängt“ beziehungsweise „war ganz von der Botschaft in Anspruch genommen“. Das griechische Verb kann ausdrücken, dass jemand von etwas ergriffen, gedrängt oder völlig beansprucht wird.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch „Christus“. Hier steht das Wort als Titel und bedeutet „Messias“, also „der Gesalbte“.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als aber
  rationale: Gibt sowohl den zeitlichen Sinn von ὡς als auch die weiterführende beziehungsweise leicht kontrastierende Funktion von δέ natürlich wieder.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: aus Mazedonien herabkamen
  rationale: Bewahrt das lukanische Reiseidiom mit κατέρχομαι, ohne daraus eine Rückkehr zu machen.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Silas und Timotheus
  rationale: Bezeichnet beide gemeinsam; das Deutsche benötigt keine ausdrückliche Wiedergabe der korrelativen Konstruktion τε … καί.
- source_word: συνείχετο τῷ λόγῳ
  choice: widmete sich ganz dem Wort
  rationale: συνείχετο bezeichnet hier, dass Paulus ganz von einer Tätigkeit beziehungsweise Sache in Anspruch genommen war. Die Formulierung ist natürlich und lässt in der Fußnote die mögliche Nuance des Gedrängt- oder Ergriffenseins offen.
- source_word: διαμαρτυρόμενος
  choice: bezeugte … eindringlich
  rationale: Bewahrt den Zeugnischarakter des Verbs und bringt zugleich seine verstärkende, nachdrückliche Kraft zum Ausdruck.
- source_word: τοῖς Ἰουδαίοις
  choice: den Juden
  rationale: Direkte und kontextgemäße Bezeichnung der angesprochenen ethnoreligiösen Gruppe.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: dass Jesus der Messias ist
  rationale: Die Konstruktion identifiziert Jesus mit dem erwarteten Gesalbten; die deutsche Wortfolge ist klar und idiomatisch.
theological_decisions:
- issue: Χριστός als Titel oder namensähnliche Bezeichnung
  choice: Messias
  alternative: Christus
  rationale: Der bestimmte Artikel und die prädikative Verwendung in der Verkündigung gegenüber Juden machen den Titelcharakter deutlich. „Messias“ hält den Bezug auf den erwarteten Gesalbten unmittelbar erkennbar.
- issue: Bedeutungsnuance von συνείχετο τῷ λόγῳ
  choice: widmete sich ganz dem Wort
  alternative: wurde vom Wort gedrängt
  rationale: Die griechische Wendung kann völlige Inanspruchnahme oder ein Gedrängtsein ausdrücken. Der Haupttext vermeidet eine nicht ausdrücklich genannte geistliche Ursache; die echte Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dem Wort“ bewahrt die lukanische Kurzbezeichnung für die Evangeliumsbotschaft; die etwas ungewohnte Formulierung wird durch die Fußnote erläutert. Die Satzstruktur bleibt nah am griechischen Ablauf, ohne im Deutschen schwerfällig zu wirken.
