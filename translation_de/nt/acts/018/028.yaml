  source_fidelity: 'Der Text gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: γάρ als „Denn“, εὐτόνως als „mit Nachdruck“, das imperfektische διακατηλέγχετο idiomatisch als „widerlegte“, δημοσίᾳ als „öffentlich“ sowie das Mittel διὰ τῶν γραφῶν als „anhand der Schriften“. Der Partizipialsatz erklärt zutreffend das Mittel des Widerlegens. Die Identifikationsaussage „dass Jesus der Messias ist“ entspricht dem griechischen AcI, ohne eine über die Vorlage hinausgehende Deutung einzutragen.'
