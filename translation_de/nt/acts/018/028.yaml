id: ACT.18.28
reference: Acts 18:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: de
  text: Denn öffentlich widerlegte er die Juden mit Nachdruck, indem er anhand der Schriften nachwies, dass Jesus der Messias[b] ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass der Messias Jesus ist“. Der griechische Infinitivsatz lässt auch diese Zuordnung beziehungsweise Wortfolge zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „der Christus“; gemeint ist der Titel „der Messias“, also „der Gesalbte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: mit Nachdruck
  rationale: Das Adverb bezeichnet energische und wirkungsvolle Intensität. „Mit Nachdruck“ ist im heutigen Deutsch natürlich und lässt sowohl die Kraft als auch die Überzeugungswirkung der Argumentation erkennen.
- source_word: διακατηλέγχετο
  choice: widerlegte
  rationale: Das Verb bezeichnet ein gründliches argumentatives Widerlegen. Das Imperfekt schildert die fortlaufende Tätigkeit im Erzählzusammenhang; eine schwerfällige deutsche Verlaufsform ist dafür nicht nötig.
- source_word: τοῖς Ἰουδαίοις
  choice: die Juden
  rationale: Die Wiedergabe folgt der griechischen Gruppenbezeichnung unmittelbar. Im Kontext sind die jüdischen Gesprächspartner beziehungsweise Gegner des Apollos gemeint, nicht eine pauschale Aussage über alle Juden.
- source_word: δημοσίᾳ
  choice: öffentlich
  rationale: Die adverbiale Form bezeichnet den öffentlichen Rahmen der Auseinandersetzung.
- source_word: ἐπιδεικνὺς
  choice: indem er … nachwies
  rationale: Das Partizip erläutert, wie Apollos seine Gesprächspartner widerlegte. „Nachweisen“ bewahrt den argumentativen und auf Belege gestützten Sinn.
- source_word: διὰ τῶν γραφῶν
  choice: anhand der Schriften
  rationale: διά mit Genitiv bezeichnet hier das Mittel. „Anhand der Schriften“ macht natürlich verständlich, dass die heiligen Schriften die Beleggrundlage seiner Argumentation waren.
- source_word: τὸν χριστὸν
  choice: der Messias
  rationale: Χριστός fungiert hier als Titel für den verheißenen Gesalbten. „Messias“ erhält den jüdisch-schriftbezogenen Horizont der Aussage.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: dass Jesus der Messias ist
  rationale: Diese deutsche Wortstellung ist natürlich und gibt die Identifikationsaussage des griechischen Infinitivsatzes wieder, ohne dessen mögliche alternative Gliederung zu verschweigen.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: An dieser Stelle ist Χριστός kein namensähnlicher Bestandteil, sondern der Titel des in den Schriften verheißenen Gesalbten. „Messias“ bringt diese Funktion im Deutschen deutlich zum Ausdruck.
- issue: Zuordnung von Subjekt und Prädikatsnomen im Infinitivsatz
  choice: dass Jesus der Messias ist
  alternative: dass der Messias Jesus ist
  rationale: Der griechische Akkusativ-mit-Infinitiv-Satz kann im Deutschen in beiden Wortfolgen sinnvoll wiedergegeben werden. Der Haupttext identifiziert Jesus als den Messias; die Fußnote bewahrt die echte syntaktische Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt argumentativ klar; „öffentlich“, „mit Nachdruck“ und „anhand der Schriften“ geben Ort, Intensität und Beleggrundlage präzise wieder. Die Formulierung vermeidet altertümliches „überführen“ und lässt die titulare sowie syntaktische Spannung durch Fußnoten sichtbar.
