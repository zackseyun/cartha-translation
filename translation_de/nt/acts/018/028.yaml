  terminology: „Messias“ ist für τὸν χριστόν hier sachgerecht, da der Ausdruck als Titel in einer schriftbezogenen Identifikationsaussage fungiert. „Schriften“ ist im biblischen Kontext angemessen. Die Fußnote zu „Christus“ erläutert transparent die griechische Form und die titulare Bedeutung.
