source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: de
  text: Wenn es aber Streitfragen über ein Wort[a], über Namen und über das bei euch geltende Gesetz sind, sollt ihr selbst zusehen. Über diese Angelegenheiten will ich kein Richter sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Aussage“, „eine Botschaft“ oder „eine Lehre“. Das griechische Wort λόγος ist weit gefasst und kann hier eine umstrittene Lehre oder Bezeichnung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: Streitfragen
  rationale: Das Wort bezeichnet Fragen oder Angelegenheiten, die strittig sind oder untersucht werden. „Streitfragen“ passt zum gerichtlichen Kontext, ohne Feindseligkeit vorauszusetzen.
- source_word: περὶ λόγου
  choice: über ein Wort
  rationale: λόγος hat ein breites Bedeutungsspektrum und kann hier Wortlaut, Aussage, Lehre oder Botschaft bezeichnen. Die nahe Wiedergabe „ein Wort“ bewahrt diese Offenheit; eine Fußnote nennt verständlichere Deutungsmöglichkeiten.
- source_word: ὀνομάτων
  choice: über Namen
  rationale: „Namen“ ist die direkte Wiedergabe und lässt offen, ob konkrete Namen, Titel oder Bezeichnungen gemeint sind.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: über das bei euch geltende Gesetz
  rationale: καθ’ ὑμᾶς kennzeichnet das Gesetz als das für die angesprochenen jüdischen Parteien maßgebliche Gesetz. Diese Formulierung gibt Gallios Abgrenzung von der römischen Gerichtsbarkeit natürlich wieder, ohne durch „euer eigenes Gesetz“ unnötig zuzuspitzen.
- source_word: ὄψεσθε αὐτοί
  choice: dann kümmert euch selbst darum
  rationale: Das Futur Medium von ὁράω wird hier idiomatisch im Sinn von „selbst zusehen/sich darum kümmern“ gebraucht; αὐτοί erhält durch „selbst“ den nötigen Nachdruck.
- source_word: κριτής
  choice: Richter
  rationale: Der Begriff entspricht der gerichtlichen Situation und bezeichnet denjenigen, der über eine Sache entscheidet.
- source_word: τούτων
  choice: über solche Dinge
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten Streitfragen; „solche Dinge“ ist im Deutschen idiomatisch und hält den Bezug breit.
- source_word: οὐ βούλομαι εἶναι
  choice: Ich will … nicht sein
  rationale: βούλομαι bezeichnet Wollen oder Bereitschaft. „Ich will … kein Richter sein“ gibt Gallios persönliche Weigerung knapp und natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von λόγος in Gallios Zurückweisung
  choice: „ein Wort“ als bewusst offene Wiedergabe
  alternative: „eine Botschaft“, „eine Lehre“ oder „eine Aussage“
  rationale: Der Kontext betrifft Gallios Weigerung, einen innerjüdischen Streit zu entscheiden, legt aber nicht eindeutig fest, welchen Aspekt λόγος bezeichnet. Der Haupttext bewahrt deshalb die Mehrdeutigkeit, während die Fußnote mögliche Bedeutungen nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Streitfragen“ wahrt den sachlich-juristischen Ton. Die Satzteilung nach „darum“ verbessert die Verständlichkeit, ohne die gedankliche Verbindung des griechischen Textes aufzulösen.
