id: ACT.18.18
reference: Acts 18:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: de
  text: Nachdem Paulus noch viele Tage geblieben war, nahm er Abschied von den Brüdern[a] und segelte nach Syrien ab; mit ihm reisten Priscilla und Aquila. In Kenchreä hatte er sich das Haar geschnitten[b][c], denn er stand unter einem Gelübde[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüdern“ ist hier wahrscheinlich die Gemeinschaft der Glaubenden gemeint, zu der auch Frauen gehörten.
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung kann auch mit „hatte er sich den Kopf geschoren beziehungsweise rasiert“ wiedergegeben werden. Das griechische Verb bezeichnet allgemein das Schneiden oder Scheren des Haares und muss keine vollständige Rasur meinen.
    reason: lexical_alternative
  - marker: c
    text: Einige beziehen das Haareschneiden auf Aquila statt auf Paulus. Grammatisch liegt der Bezug auf Paulus jedoch näher.
    reason: alternative_reading
  - marker: d
    text: Der Text sagt nur „ein Gelübde“; dass es sich um ein Nasiräergelübde oder eine ähnliche Form handelte, wird nicht ausdrücklich gesagt.
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας
  choice: geblieben war
  rationale: Das vorzeitige Aoristpartizip bezeichnet Paulus’ weiteres Verbleiben vor der Abreise; der Ort ist aus dem Zusammenhang ersichtlich und muss nicht ergänzt werden.
- source_word: ἔτι ... ἡμέρας ἱκανὰς
  choice: noch viele Tage
  rationale: ἔτι bewahrt den Gedanken des weiteren Verweilens; ἱκανὰς bezeichnet hier eine beträchtliche Anzahl.
- source_word: τοῖς ἀδελφοῖς
  choice: von den Brüdern
  rationale: Die vertraute gemeinschaftliche Anrede wird formal bewahrt; eine Fußnote erläutert den wahrscheinlich umfassenden Bezug auf die Glaubensgemeinschaft.
- source_word: ἀποταξάμενος
  choice: nahm er Abschied
  rationale: Das Medium bedeutet hier, sich von jemandem zu verabschieden beziehungsweise Abschied zu nehmen.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: segelte nach Syrien ab
  rationale: Die Wiedergabe bringt sowohl die Abreise per Schiff als auch das Ziel zum Ausdruck.
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: mit ihm reisten Priscilla und Aquila
  rationale: Die eigenständige Begleitangabe des Griechischen wird natürlich und vollständig wiedergegeben, ohne ein bestimmtes Verkehrsmittel für die gesamte Reise zu erzwingen.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: hatte er sich das Haar schneiden lassen
  rationale: κείρω kann Schneiden, Scheren oder Rasieren bezeichnen. Die zurückhaltende Formulierung bewahrt den lexikalischen Spielraum und die vorzeitige Beziehung zum Hauptverb.
- source_word: ἐν Κεγχρεαῖς
  choice: In Kenchreä
  rationale: Gebräuchliche deutsche Form des Ortsnamens und natürliche Wiedergabe der Ortsangabe.
- source_word: εἶχεν γὰρ εὐχήν
  choice: denn er stand unter einem Gelübde
  rationale: Die idiomatische deutsche Formulierung gibt den bestehenden Bindungszustand wieder, ohne Art oder Zeitpunkt des Gelübdes näher festzulegen.
theological_decisions:
- issue: Bezugswort des Partizips κειράμενος
  choice: Das Partizip wird auf Paulus bezogen.
  alternative: Einige beziehen die Handlung wegen der Nähe des Namens auf Aquila.
  rationale: Das maskuline Singularpartizip knüpft am natürlichsten an Paulus als fortlaufendes Subjekt des Satzes an. Die diskutierte Alternative bleibt in einer Fußnote sichtbar.
- issue: Art des Gelübdes εὐχή
  choice: Allgemein als „ein Gelübde“ wiedergegeben.
  alternative: Nasiräergelübde beziehungsweise ein diesem ähnliches Gelübde.
  rationale: Der griechische Text benennt keine besondere Art des Gelübdes; eine genauere kultische Zuordnung wäre eine nicht ausdrücklich gemachte Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird durch ein Semikolon gegliedert. Die Übersetzung wahrt die Vorzeitigkeit der Partizipien, vermeidet unnötige Ergänzungen und lässt sowohl den Umfang des Haareschneidens als auch die Art des Gelübdes offen.
