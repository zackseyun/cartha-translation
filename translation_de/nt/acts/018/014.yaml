  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: de
  text: 'Als Paulus gerade den Mund öffnen wollte[a], sagte Gallio zu den Juden: »Wenn es sich um irgendein Unrecht oder ein böses Verbrechen handeln würde, ihr Juden, dann würde ich euch mit gutem Grund ertragen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Mund öffnen«; gemeint ist, mit dem Reden zu beginnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dann würde ich euch mit gutem Grund anhören« oder »Nachsicht mit euch haben«. Das griechische Verb kann »ertragen«, »dulden« oder »Nachsicht haben« bedeuten; im gerichtlichen Zusammenhang kann es einschließen, ihre Beschwerde anzuhören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: Als Paulus gerade den Mund öffnen wollte
  rationale: Der Genitivus absolutus mit μέλλω und Infinitiv bezeichnet eine unmittelbar bevorstehende Handlung. Die deutsche Wendung bewahrt das griechische Bild und ist zugleich verständlich.
- source_word: δὲ
  choice: Als
  rationale: Der leichte narrative Gegensatz ergibt sich im Deutschen bereits daraus, dass Gallio Paulus zuvorkommt; ein zusätzliches „aber“ wäre zusammen mit dem temporalen Anschluss schwerfällig.
- source_word: Γαλλίων
  choice: Gallio
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: zu den Juden
  rationale: Die Formulierung folgt dem Wortlaut, ohne die kontextuell naheliegende, aber ergänzende Präzisierung „jüdische Ankläger“ einzufügen.
- source_word: ἀδίκημά τι
  choice: irgendein Unrecht
  rationale: ἀδίκημα bezeichnet eine rechtswidrige Tat oder ein Unrecht; die offene Formulierung erhält den juristischen Rahmen, ohne die Art des Vergehens festzulegen.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: ein böses Verbrechen
  rationale: Die Wiedergabe erhält sowohl den strafrechtlichen Sinn von ῥᾳδιούργημα als auch die ausdrücklich negative moralische Wertung durch πονηρόν.
- source_word: ὦ Ἰουδαῖοι
  choice: ihr Juden
  rationale: „Ihr Juden“ gibt die direkte, rhetorisch markierte Anrede im heutigen Standarddeutsch natürlicher wieder als das altertümlich wirkende „o Juden“.
- source_word: κατὰ λόγον
  choice: mit gutem Grund
  rationale: Die idiomatische Wendung bezeichnet ein vernünftiges beziehungsweise berechtigtes Vorgehen.
- source_word: ἀνεσχόμην ὑμῶν
  choice: würde ich euch ... anhören
  rationale: Im richterlichen Kontext meint ἀνέχομαι, dass Gallio bereit wäre, die Beschwerdeführer beziehungsweise ihren Fall geduldig anzuhören. „Euch ertragen“ wäre formaler, im Deutschen hier aber missverständlich.
