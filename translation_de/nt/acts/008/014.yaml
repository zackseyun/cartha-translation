id: ACT.8.14
reference: Acts 8:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: de
  text: Als die Apostel in Jerusalem hörten, dass Samaria das Wort Gottes angenommen hatte, sandten sie Petrus und Johannes zu ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Als ... hörten
  rationale: Das Aoristpartizip bezeichnet den Umstand, der der Haupthandlung vorausgeht; „als ... hörten“ ist im Deutschen natürlich. Das schwach weiterführende δέ wird durch den Erzählfluss mitgetragen und nicht eigens wiedergegeben.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: die Apostel in Jerusalem
  rationale: Gibt die Ortsangabe knapp, eindeutig und idiomatisch wieder.
- source_word: δέδεκται
  choice: angenommen hatte
  rationale: Das Perfekt von δέχομαι bezeichnet die vollzogene Aufnahme des verkündigten Wortes mit fortdauernder Wirkung; das Plusquamperfekt passt zur deutschen Erzählfolge.
- source_word: ἡ Σαμάρεια
  choice: Samaria
  rationale: Der Ortsname steht metonymisch für seine Bevölkerung. Die Beibehaltung wahrt die Ausdrucksweise des griechischen Textes.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Bewahrt die vertraute biblische Wendung und ihre Bedeutungsweite; gemeint ist die von Gott kommende beziehungsweise von ihm handelnde Verkündigung.
- source_word: ἀπέστειλαν
  choice: sandten sie
  rationale: „Senden“ entspricht dem einfachen Aorist und bietet einen würdigen, im biblischen Erzählstil weiterhin natürlichen Ausdruck.
- source_word: πρὸς αὐτοὺς
  choice: zu ihnen
  rationale: Gibt die Richtung zu den durch „Samaria“ bezeichneten Menschen idiomatisch wieder.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Petrus und Johannes
  rationale: Verwendet die im Deutschen etablierten Namensformen.
theological_decisions:
- issue: Metonymischer Gebrauch von „Samaria“
  choice: Samaria hatte das Wort Gottes angenommen
  alternative: Die Samaritaner hatten das Wort Gottes angenommen
  rationale: Der griechische Text nennt Samaria kollektiv. Die wörtlichere Form bewahrt diese Metonymie, ohne den Sinn unverständlich zu machen.
- issue: Wiedergabe von λόγος
  choice: das Wort Gottes
  alternative: die Botschaft Gottes
  rationale: „Wort Gottes“ erhält die lexikalische Form und theologische Bedeutungsweite, ohne den Ausdruck auf „Botschaft“ zu verengen.
- issue: Bedeutung von δέχομαι
  choice: angenommen hatte
  alternative: empfangen hatte
  rationale: Im Zusammenhang der Verkündigung bezeichnet δέχομαι eine zustimmende Aufnahme. „Angenommen“ ist im heutigen Deutsch natürlicher als „empfangen“, ohne eine spezifische Bekehrungssystematik einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Syntax bleibt nahe am Griechischen, ohne unnatürlich zu wirken; keine Fußnote ist für diesen Vers erforderlich.
