  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: de
  text: Saulus aber verwüstete die Gemeinde[a], indem er in ein Haus nach dem anderen eindrang[b], Männer und Frauen fortschleppte und sie ins Gefängnis einlieferte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: richtete in der Gemeinde verheerenden Schaden an. Das griechische Verb bezeichnet schwere, gewaltsame Schädigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung hat verteilenden Sinn: Saulus ging beziehungsweise drang von Haus zu Haus vor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: verwüstete
  rationale: Das starke Verb bezeichnet hier fortgesetzte, gewaltsame Schädigung und ist deutlicher als das allgemeinere „verfolgte“. Der Zusammenhang lässt den andauernden beziehungsweise wiederholten Charakter der Imperfektform erkennen.
- source_word: ἐκκλησίαν
  choice: die Gemeinde
  rationale: Gemeint ist die Gemeinschaft der an Jesus Glaubenden. „Gemeinde“ ist im modernen Deutschen natürlich und bezeichnet hier nicht bloß eine Versammlung.
- source_word: κατὰ τοὺς οἴκους
  choice: in ein Haus nach dem anderen
  rationale: κατά mit dem Plural hat verteilenden Sinn und beschreibt das wiederholte Eindringen in mehrere Häuser.
- source_word: εἰσπορευόμενος
  choice: Er drang … ein
  rationale: „Eindringen“ gibt in diesem gewaltsamen Zusammenhang mehr als ein neutrales Hineingehen wieder; der deutsche Hauptsatz macht den Ablauf gut verständlich.
- source_word: σύρων
  choice: schleppte … fort
  rationale: σύρω bezeichnet gewaltsames Ziehen oder Schleppen; „fortschleppen“ bringt auch die Entfernung aus den Häusern zum Ausdruck.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: Männer wie Frauen
  rationale: Die Formulierung betont knapp und natürlich, dass Saulus ohne Rücksicht auf das Geschlecht vorging.
- source_word: παρεδίδου
  choice: lieferte sie … ein
  rationale: Das Imperfekt beschreibt wiederholte Übergabe in amtlichen Gewahrsam. „Ins Gefängnis einliefern“ ist dafür eine natürliche deutsche Wendung.
- source_word: εἰς φυλακήν
  choice: ins Gefängnis
  rationale: φυλακή bezeichnet hier Haft beziehungsweise Gefängnisgewahrsam.
theological_decisions:
- issue: Schwere von Saulus’ Vorgehen vor seiner Bekehrung
  choice: „verwüstete die Gemeinde“
  alternative: „verfolgte die Gemeinde“
  rationale: Die starke Formulierung wahrt die Gewalt des griechischen Verbs, ohne aus dem späteren Leben des Saulus zusätzliche theologische Deutungen in den Vers einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Hauptsätze bewahren den energischen Ablauf; starke Verben geben die Härte des Geschehens wieder, ohne sie auszuschmücken.
