  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: de
  text: Die Zerstreuten zogen nun umher und verkündeten das Wort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezeichnet das Verkünden einer guten Nachricht. Mit „dem Wort“ ist hier die Botschaft von Jesus gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Die … aber
  rationale: Die Wendung führt nach der Schilderung der Verfolgung und Zerstreuung den Erzählfaden weiter. Im Deutschen gibt „aber“ den Übergang und zugleich den Kontrast zu Saulus in Vers 3 natürlich wieder; μέν wird nicht schematisch eigens übersetzt.
- source_word: διασπαρέντες
  choice: Zerstreuten
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die zuvor durch die Verfolgung zerstreut worden waren. „Die Zerstreuten“ ist knapp und bewahrt das Bild des griechischen Verbs.
- source_word: διῆλθον
  choice: zogen umher
  rationale: Das Verb beschreibt hier eine Bewegung von Ort zu Ort. „Zogen umher“ ist natürlich und vermeidet den unbelegten Zusatz „durch die Gegend“.
- source_word: εὐαγγελιζόμενοι
  choice: verkündeten
  rationale: Das Partizip bezeichnet die begleitende Tätigkeit während ihres Umherziehens. Zusammen mit „das Wort“ gibt „verkündeten“ die evangelisierende Tätigkeit idiomatisch wieder; der Aspekt der guten Nachricht wird in der Fußnote erläutert.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: Die wörtliche und in der Apostelgeschichte geläufige Bezeichnung bleibt erhalten. Gemeint ist die Botschaft von Jesus, ohne dass „Gottes“ in den Text eingefügt wird.
theological_decisions:
- issue: Wiedergabe von εὐαγγελιζόμενοι τὸν λόγον
  choice: verkündeten das Wort
  alternative: brachten das Wort als gute Nachricht
  rationale: Im Griechischen ist „das Wort“ direktes Objekt eines Verbs, das das Verkünden guter Nachricht bezeichnet. Die gewählte Formulierung wahrt die Syntax und klingt auf Deutsch natürlich; die semantische Komponente „gute Nachricht“ wird nicht durch eine künstliche Genitivkonstruktion ausgedrückt, sondern in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist bewusst knapp und erzählerisch; „das Wort“ bewahrt Lukas’ Terminologie, während die Fußnote die für heutige Leser mögliche Unklarheit erläutert.
