source:
  edition: SBLGNT
  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: de
  text: 'Als sie nun die Straße entlangzogen, kamen sie an eine Wasserstelle. Da sagt der Eunuch: »Sieh, Wasser! Was hindert mich daran, getauft zu werden?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ τὴν ὁδόν
  choice: die Straße entlang
  rationale: Gibt die Bewegung entlang des Weges natürlich und präzise wieder.
- source_word: ἐπί τι ὕδωρ
  choice: an eine Wasserstelle
  rationale: Das indefinite τι bezeichnet eine nicht näher bestimmte Stelle mit Wasser; »Wasserstelle« klingt im Deutschen natürlicher als »etwas Wasser«, ohne Art oder Größe festzulegen.
- source_word: φησιν
  choice: sagt
  rationale: Bewahrt das historische Präsens des griechischen Erzählstils.
- source_word: ὁ εὐνοῦχος
  choice: der Eunuch
  rationale: Entspricht der konkreten Personenbezeichnung im Ausgangstext und wahrt den Bezug zum vorausgehenden Kontext.
- source_word: Ἰδού
  choice: Sieh
  rationale: Gibt den aufmerksamkeitheischenden Ausruf direkt und würdevoll wieder.
- source_word: βαπτισθῆναι
  choice: getauft zu werden
  rationale: Bewahrt die passive Form des griechischen Aoristinfinitivs.
theological_decisions:
- issue: Mögliches zusätzliches Glaubensbekenntnis vor der Taufe
  choice: Kein Zusatz nach Vers 36
  alternative: Einfügung des in späteren Handschriften bezeugten Verses 37
  rationale: Der vorgelegte SBLGNT-Text enthält hier nur die Frage des Eunuchen; eine textkritisch spätere Erweiterung wird nicht in diesen Vers importiert.
- issue: Voraussetzungen für die Taufe
  choice: Die offene Frage »Was hindert mich daran …?« bleibt unverändert offen
  alternative: Explizite Angabe einer Bedingung oder theologischen Deutung
  rationale: Der Vers selbst beantwortet die Frage nicht; die Übersetzung bewahrt diese erzählerische und theologische Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens »sagt« folgt bewusst dem griechischen Text. Keine Fußnoten erforderlich.
