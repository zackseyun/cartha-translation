  to: Saulus aber war mit seiner Tötung einverstanden. An jenem Tag setzte eine schwere Verfolgung der Gemeinde in Jerusalem ein. Alle außer den Aposteln wurden über die Gebiete Judäas und Samariens hin zerstreut.
