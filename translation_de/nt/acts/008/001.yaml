id: ACT.8.1
reference: Acts 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: de
  text: Saulus aber war mit seiner Tötung einverstanden. An jenem Tag setzte eine schwere Verfolgung der Gemeinde in Jerusalem ein. Alle außer den Aposteln wurden über die Gebiete Judäas und Samariens hin zerstreut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulus
  rationale: Die im Deutschen etablierte Form des griechischen Personennamens.
- source_word: συνευδοκῶν
  choice: war ... einverstanden
  rationale: Gibt zusammen mit ἦν die fortdauernde bzw. gleichzeitige Zustimmung wieder, ohne Saulus eine unmittelbare Beteiligung an der Tötung zuzuschreiben.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: mit seiner Tötung
  rationale: Bezeichnet den Akt, ihn zu Tode zu bringen. „Tötung“ vermeidet sowohl die mögliche rechtliche Legitimation von „Hinrichtung“ als auch die stärkere rechtlich-moralische Festlegung von „Mord“.
- source_word: Ἐγένετο
  choice: setzte ... ein
  rationale: Im Zusammenhang bezeichnet das Verb den Beginn der Verfolgung; die deutsche Wendung ist natürlich und präzise.
- source_word: διωγμὸς μέγας
  choice: eine schwere Verfolgung
  rationale: „Schwer“ gibt die Intensität von μέγας im heutigen Deutschen idiomatischer wieder als das wörtliche „groß“.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: der Gemeinde in Jerusalem
  rationale: Der deutsche Genitiv bei „Verfolgung“ bezeichnet das Ziel der feindlichen Handlung klar; die attributive Ortsangabe wird knapp bewahrt.
- source_word: πάντες ... πλὴν τῶν ἀποστόλων
  choice: Alle außer den Aposteln
  rationale: Bewahrt die ausdrückliche Gesamtaussage samt der im Text genannten Ausnahme, ohne den Bezug durch „alle Gläubigen“ weiter auszudeuten.
- source_word: διεσπάρησαν
  choice: wurden ... zerstreut
  rationale: Bewahrt das Passiv und den Eindruck einer durch die Verfolgung erzwungenen Zerstreuung.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: in die Gebiete von Judäa und Samarien
  rationale: Gibt die räumliche Verteilung über die betreffenden Territorien in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bezeichnung von Stephanus’ Tod in ἀναιρέσει αὐτοῦ
  choice: seiner Tötung
  alternative: seiner Hinrichtung; seinem Tod; seiner Ermordung
  rationale: „Tötung“ hält fest, dass Saulus dem Akt des Zu-Tode-Bringens zustimmte, ohne dessen rechtliche Legitimität oder die genaue moralisch-rechtliche Einstufung ausdrücklich festzulegen.
- issue: Reichweite von πάντες
  choice: Alle außer den Aposteln wurden ... zerstreut
  alternative: Alle Gläubigen wurden ... zerstreut; jeder wurde ... zerstreut
  rationale: Die Formulierung erhält die rhetorische Kraft von „alle“ und zugleich die ausdrückliche Ausnahme. Der Kontext bestimmt den Bezug zur Jerusalemer Gemeinde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das adversative δέ nach „Saulus“ wird mit „aber“ wiedergegeben; das zweite δέ wird durch den natürlichen Satzanschluss ausgedrückt. Die Satzstruktur wurde für gute deutsche Lesbarkeit in drei Sätze gegliedert.
