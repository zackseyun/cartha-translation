  source_fidelity: Die Wiedergabe trifft die fortdauernde Zustimmung des Saulus zu der Tötung sowie Beginn, Ziel und Ausmaß der Verfolgung. Bei κατὰ τὰς χώρας ist jedoch eine Verteilung über die Regionen gemeint; „in die Gebiete“ betont primär die Richtung bzw. das Ziel.
  naturalness: Modernes, klares Standarddeutsch. „Über die Gebiete Judäas und Samariens hin“ ist in Verbindung mit „zerstreut“ idiomatisch und bildet die räumliche Verteilung präziser ab als „in die Gebiete von ...“.
  terminology: „Saulus“, „Tötung“, „Verfolgung“, „Gemeinde“, „Judäa“ und „Samarien“ sind angemessen. „Tötung“ wahrt die lexikalische Offenheit von ἀναίρεσις, ohne eine rechtliche oder moralisch-rechtliche Einordnung vorwegzunehmen.
