id: ACT.8.38
reference: Acts 8:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: de
  text: Und er befahl, den Wagen anzuhalten. Dann stiegen beide ins Wasser hinab, Philippus und der Eunuch, und Philippus taufte ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: er befahl
  rationale: κέλευω bezeichnet ein Anordnen oder Befehlen. „Er befahl“ gibt den verbindlichen Charakter knapp und natürlich wieder.
- source_word: στῆναι τὸ ἅρμα
  choice: den Wagen anzuhalten
  rationale: Bei einem Fahrzeug bezeichnet στῆναι hier das Zum-Stillstand-Bringen. „Den Wagen anzuhalten“ ist im Deutschen idiomatisch.
- source_word: ἅρμα
  choice: Wagen
  rationale: ἅρμα kann einen Streitwagen oder allgemein einen Wagen bezeichnen. Im erzählerischen Kontext ist „Wagen“ natürlich und vermeidet die im Deutschen vorwiegend militärische Vorstellung eines „Streitwagens“.
- source_word: κατέβησαν
  choice: stiegen ... hinab
  rationale: καταβαίνω bedeutet hinabgehen oder hinabsteigen. Bei der Bewegung vom Wagen zum Wasser ist „hinabsteigen“ anschaulich und idiomatisch.
- source_word: ἀμφότεροι
  choice: beide
  rationale: ἀμφότεροι hebt ausdrücklich hervor, dass beide Personen gemeinsam ins Wasser gingen.
- source_word: εἰς τὸ ὕδωρ
  choice: ins Wasser
  rationale: εἰς bezeichnet regulär eine Bewegung hinein. „Ins Wasser“ bewahrt diese Richtungsangabe, ohne daraus eine Aussage über die genaue Taufweise abzuleiten.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: Philippus und der Eunuch
  rationale: Die korrelative Fügung nennt beide Beteiligten ausdrücklich. Zusammen mit „beide“ bleibt die Hervorhebung des griechischen Satzes erhalten.
- source_word: εὐνοῦχος
  choice: Eunuch
  rationale: „Eunuch“ bewahrt die übliche und hier wahrscheinlich konkrete Bedeutung sowie die begriffliche Kontinuität im Bericht.
- source_word: ἐβάπτισεν
  choice: taufte
  rationale: „Taufen“ ist die etablierte, sachlich offene Wiedergabe von βαπτίζω. Eine Übersetzung mit „untertauchen“ würde die genaue Taufweise stärker festlegen, als es dieser Satz verlangt.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich als direktes Objekt auf den Eunuchen.
theological_decisions:
- issue: Ob die Formulierung die genaue Taufweise festlegen soll
  choice: Die Bewegung „ins Wasser“ wird beibehalten, während βαπτίζω mit „taufen“ wiedergegeben wird.
  alternative: βαπτίζω mit „untertauchen“ übersetzen oder εἰς τὸ ὕδωρ zu „zum Wasser“ abschwächen.
  rationale: Der griechische Text sagt, dass beide ins Wasser hinabstiegen und Philippus den Eunuchen taufte. Die Übersetzung bewahrt beides, ohne eine spätere konfessionelle Deutung zur Taufweise in den Text einzutragen.
- issue: Explizites Subjekt des letzten Verbs
  choice: „Philippus taufte ihn“
  alternative: „er taufte ihn“
  rationale: Im Griechischen ist das Subjekt von ἐβάπτισεν nur durch die Verbform mitgemeint und ergibt sich eindeutig aus dem Zusammenhang. Die Wiederaufnahme von „Philippus“ verhindert im Deutschen eine mögliche, sachlich falsche Zuordnung des Pronomens nach der unmittelbar vorausgehenden Nennung des Eunuchen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Satzteilung nach „anzuhalten“ verbessert die Lesbarkeit, ohne den inhaltlichen Zusammenhang aufzulösen. Keine Fußnote ist erforderlich, da „ins Wasser“ die normale Richtungskraft von εἰς unmittelbar wiedergibt; die Alternative „zum Wasser“ ist hier weniger wahrscheinlich.
