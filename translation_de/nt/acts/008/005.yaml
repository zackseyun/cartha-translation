source:
  edition: SBLGNT
  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: de
  text: Philippus ging in die Stadt Samarias hinab[a][b] und verkündete ihnen den Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in eine Stadt Samarias“. Der griechische Ausdruck kann entweder eine bestimmte Stadt in Samaria oder allgemeiner eine Stadt im samaritanischen Gebiet bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in die Stadt Samaria“.'
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: Die Partikel führt die Erzählung mild weiter, ohne hier einen deutlichen Gegensatz auszudrücken. Im Deutschen ist kein eigener Konnektor nötig.
- source_word: κατελθὼν
  choice: ging … hinab
  rationale: Das Aoristpartizip bezeichnet die vorausgehende Reisebewegung und wird im natürlichen Deutsch als beigeordnete Handlung wiedergegeben; die Richtungsangabe bleibt erhalten.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: die Stadt Samarias
  rationale: Die Wiedergabe folgt dem bestimmten Artikel und dem Genitiv des griechischen Textes, ohne die mögliche Deutung als eine nicht näher bezeichnete Stadt der Region zu verschweigen; diese steht in Fußnote [a].
- source_word: ἐκήρυσσεν
  choice: verkündete
  rationale: Das Verb bezeichnet öffentliches, heroldartiges Bekanntmachen. „Verkündete“ ist im Deutschen klar und würdig, ohne den Ausdruck auf eine förmliche Predigt einzuengen.
- source_word: αὐτοῖς
  choice: den Menschen dort
  rationale: Das Pronomen bezeichnet die Bewohner beziehungsweise die Zuhörerschaft am genannten Ort. Die idiomatische deutsche Wiedergabe macht den Bezug verständlich, ohne eine bestimmte Personengruppe hinzuzufügen.
- source_word: τὸν χριστόν
  choice: den Messias
  rationale: Mit Artikel und als Inhalt der Verkündigung bezeichnet Χριστός hier den messianischen Titel, nicht bloß einen namenähnlichen Zusatz.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus / der Christus
  rationale: In diesem Verkündigungskontext ist der Titel gemeint. „Messias“ bewahrt den jüdischen Erwartungshorizont und vermeidet, den Titel stillschweigend wie einen Eigennamen zu behandeln.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist natürlich deutsch; die Ortsangabe und ihre echte Mehrdeutigkeit werden durch die Fußnoten offengehalten.
