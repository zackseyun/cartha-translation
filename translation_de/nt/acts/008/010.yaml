source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: de
  text: 'Sie alle hörten aufmerksam auf ihn, vom Geringsten bis zum Größten, und sagten: »Dieser Mann ist die Kraft Gottes, die ‚die Große‘ genannt wird.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dieser Mann ist die große Kraft Gottes.« Der griechische Ausdruck kann auch kompakter als titelartige Bezeichnung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: hörten aufmerksam auf ihn
  rationale: προσέχω bezeichnet hier anhaltende, auf eine Person gerichtete Aufmerksamkeit. Die Formulierung ist natürliches modernes Deutsch, ohne bereits Gefolgschaft oder Hingabe zu unterstellen.
- source_word: πάντες
  choice: sie alle
  rationale: Gibt die umfassende Mehrzahl ausdrücklich und idiomatisch wieder.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: vom Geringsten bis zum Größten
  rationale: Bewahrt die umfassende Spannweite der griechischen Wendung und gibt wahrscheinlich den gesellschaftlichen Rang wieder.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das gleichzeitige Partizip wird im Deutschen flüssig als koordinierter Vorgang wiedergegeben.
- source_word: Οὗτός
  choice: Dieser Mann
  rationale: Das Demonstrativpronomen verweist auf Simon; »dieser Mann« ist im Deutschen klar und natürlich.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: die Kraft Gottes
  rationale: Bewahrt die bestimmte, titelartig klingende Formulierung, ohne die Aussage der Menge als Urteil des Erzählers darzustellen.
- source_word: ἡ καλουμένη Μεγάλη
  choice: die ›die Große‹ genannt wird
  rationale: Gibt den passiven Benennungssinn von καλουμένη wieder und lässt Μεγάλη als substantivisch gebrauchte Bezeichnung erkennen.
theological_decisions:
- issue: Ob die Aussage der Menge als formeller göttlicher Titel oder als beschreibende Behauptung über Simon wiederzugeben ist
  choice: 'Die direkte Behauptung wird bewahrt: »Dieser Mann ist die Kraft Gottes, die ›die Große‹ genannt wird.«'
  alternative: »Dieser Mann ist die sogenannte große Kraft Gottes.« / »Dieser ist die große Kraft Gottes.«
  rationale: Der griechische Text berichtet die Zuschreibung der Menge, ohne sie durch den Erzähler zu bestätigen. Die gewählte Fassung erhält zugleich den titelartigen und sprachlich ungewöhnlichen Charakter des Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Titelbildung des Griechischen bleibt im Haupttext sichtbar; die Fußnote bietet eine flüssigere alternative Wiedergabe.
