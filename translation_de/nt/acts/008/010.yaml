  source_fidelity: Die Wiedergabe von προσεῖχον, πάντες und der Spannweitenformel ἀπὸ μικροῦ ἕως μεγάλου ist quellentreu. Auch die Aussage der Menge wird zutreffend als deren Zuschreibung an Simon wiedergegeben. Bei ἡ καλουμένη Μεγάλη sollte die Benennung als Titel klarer markiert werden; die griechische feminine Form bezieht sich auf δύναμις.
