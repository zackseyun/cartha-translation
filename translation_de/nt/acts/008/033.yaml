  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: de
  text: In seiner Erniedrigung wurde ihm das Recht genommen.[a] Wer wird seine Generation schildern?[b] Denn sein Leben wird von der Erde hinweggenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihm wurde das Gericht genommen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine Nachkommen« oder »seine Zeitgenossen«; das griechische Wort »Generation« bewahrt die Mehrdeutigkeit des Zitats aus Jesaja 53.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταπεινώσει
  choice: Erniedrigung
  rationale: Das Substantiv bezeichnet einen Zustand der Herabsetzung oder Demütigung. »Erniedrigung« passt zum Kontext ungerechten Leidens und bleibt nahe am Wortlaut des Jesaja-Zitats.
- source_word: κρίσις
  choice: Recht
  rationale: κρίσις kann »Gericht«, »Urteil« oder »Rechtsprechung« bedeuten. Die Wendung »ihm wurde das Recht genommen« gibt hier natürlich wieder, dass ihm ein gerechtes Verfahren beziehungsweise sein Recht versagt wurde, ohne die rechtliche Dimension aufzugeben.
- source_word: ἤρθη
  choice: wurde … genommen
  rationale: Der Aorist Passiv von αἴρω bezeichnet hier Entzug oder Beseitigung. Die deutsche Formulierung drückt diesen Verlust idiomatisch aus.
- source_word: γενεὰν
  choice: Generation
  rationale: γενεά ist mehrdeutig und kann unter anderem Generation, Zeitgenossen oder Nachkommenschaft bezeichnen. »Generation« bewahrt im Haupttext die Schwierigkeit des griechischen Jesaja-Zitats; mögliche Deutungen werden in einer Fußnote genannt.
- source_word: διηγήσεται
  choice: wird … beschreiben
  rationale: Das Verb bedeutet, etwas ausführlich darzustellen oder zu erzählen. »Beschreiben« ist in der rhetorischen Frage verständlich und lässt offen, was genau mit seiner Generation gemeint ist.
- source_word: αἴρεται
  choice: wird … hinweggenommen
  rationale: Das Präsens Passiv vergegenwärtigt den Vorgang des Entfernens. »Hinweggenommen« gibt die Bewegung fort von der Erde klar und würdig wieder.
- source_word: γῆς
  choice: Erde
  rationale: γῆ kann »Erde« oder »Land« bedeuten. In der Aussage über das Ende des irdischen Lebens ist »Erde« die naheliegende Wiedergabe.
- source_word: ζωὴ
  choice: Leben
  rationale: Gemeint ist hier im Zusammenhang des Jesaja-Zitats das physische Leben.
theological_decisions:
- issue: Deutung von »seine Generation«
  choice: Die formal mehrdeutige Wendung »seine Generation« bleibt im Haupttext erhalten.
  alternative: »seine Nachkommen« oder »seine Zeitgenossen«
  rationale: Das Jesaja-Zitat ist an dieser Stelle schwer zu deuten. Es kann sich auf Nachkommenschaft, Zeitgenossen oder die betreffende Generation beziehen. Der Haupttext entscheidet diese theologisch und exegetisch bedeutsame Frage nicht stillschweigend.
- issue: Bedeutung von κρίσις
  choice: Wiedergabe mit »Recht«
  alternative: »Gericht« oder »Urteil«
  rationale: Im Zusammenhang seiner Erniedrigung liegt nahe, dass ihm gerechte Behandlung oder Rechtsprechung entzogen wurde. »Recht« vermittelt dies im Deutschen natürlich, während die wörtlichere Alternative in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und dem poetischen Charakter des Jesaja-Zitats angemessen. Schwer verständliche, aber echte Mehrdeutigkeit wird im Haupttext bewahrt und durch Fußnoten erschlossen.
