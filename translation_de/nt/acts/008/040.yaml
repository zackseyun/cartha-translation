source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: de
  text: Philippus aber wurde in Aschdod[a] gefunden. Als er weiterzog, verkündete er in allen Städten die gute Nachricht, bis er nach Cäsarea kam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wurde in Aschdod gefunden«. Im Zusammenhang kann damit eine plötzliche Versetzung durch Gott gemeint sein, ohne dass dies hier ausdrücklich gesagt wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten erzählerischen Übergang und zugleich den Gegensatz dazu, dass der Geist Philippus im vorigen Vers fortgenommen hat.
- source_word: εὑρέθη εἰς Ἄζωτον
  choice: fand sich in Aschdod wieder
  rationale: Das passive εὑρέθη bezeichnet den resultierenden Aufenthaltsort. Die idiomatische deutsche Wendung bewahrt den überraschenden Ortswechsel, ohne über den griechischen Wortlaut hinaus ausdrücklich ein Erscheinen zu behaupten. Der alttestamentlich vertraute deutsche Ortsname Aschdod bezeichnet dasselbe Ἄζωτος.
- source_word: διερχόμενος
  choice: auf seinem Weg
  rationale: Das begleitende Partizip beschreibt Philippus’ Weiterziehen durch das Gebiet; die Formulierung verbindet Bewegung und fortlaufende Verkündigung natürlich.
- source_word: εὐηγγελίζετο
  choice: verkündete er … die gute Nachricht
  rationale: Das Imperfekt beschreibt fortlaufendes beziehungsweise wiederholtes Verkündigen. »Die gute Nachricht verkünden« ist verständlich und gibt den verbalen Sinn ohne unnötige kirchliche Fachsprache wieder.
- source_word: τὰς πόλεις πάσας
  choice: in allen Städten
  rationale: Bezeichnet umfassend die Städte entlang seiner Reiseroute; im Deutschen ist bei der Verkündigung die Ortsangabe mit »in« natürlich.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν
  choice: bis er nach Cäsarea kam
  rationale: Die Konstruktion mit ἕως und dem substantivierten Infinitiv nennt den Endpunkt seines Weges und der fortlaufenden Tätigkeit.
theological_decisions:
- issue: Ob εὑρέθη Philippus’ Ortswechsel ausdrücklich als wundersames Erscheinen deuten soll
  choice: Die zurückhaltende Wendung »fand sich … wieder« im Haupttext
  alternative: »erschien in Aschdod« oder wörtlicher »wurde in Aschdod gefunden«
  rationale: Der Zusammenhang legt göttliches Handeln nahe, doch εὑρέθη selbst sagt lediglich, dass Philippus dort vorgefunden wurde. Die Übersetzung lässt daher Art und Vorgang der Versetzung unausgedeutet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Aschdod« folgt der im Deutschen geläufigen biblischen Bezeichnung des Ortes; »Cäsarea« ist die etablierte deutsche Namensform. Die Satzteilung erhöht die Lesbarkeit, ohne den Gedankengang zu verändern.
