  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: de
  text: Dann legten sie ihnen die Hände auf, und sie empfingen den Heiligen Geist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beide griechischen Verben stehen im Imperfekt. Je nach Zusammenhang können diese Formen einen andauernden oder wiederholten Vorgang hervorheben.
    reason: 'Aspektuelle Anmerkung: Die Fußnote bewahrt die mögliche Nuance des Imperfekts, ohne mit „jeweils“ eine nicht ausdrücklich im Text enthaltene Verteilung zu konkretisieren.'
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Kennzeichnet in natürlichem Deutsch die zeitliche und erzählerische Abfolge.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: legten sie ihnen die Hände auf
  rationale: Die deutsche Wendung „jemandem die Hände auflegen“ gibt das griechische Idiom präzise und idiomatisch wieder. Das Imperfekt wird im erzählenden Deutsch natürlich mit dem Präteritum ausgedrückt.
- source_word: ἐλάμβανον
  choice: sie empfingen
  rationale: „Empfangen“ entspricht dem Kontext der Gabe des Geistes. Das deutsche Präteritum ist hier natürlich, legt den griechischen Imperfekt aber nicht einseitig auf einen fortlaufenden oder wiederholten Verlauf fest.
- source_word: πνεῦμα ἅγιον
  choice: den Heiligen Geist
  rationale: Im Zusammenhang von Lukas und Apostelgeschichte bezeichnet die artikellose griechische Wortgruppe hier den göttlichen Heiligen Geist; im Deutschen verlangt die übliche bestimmte Bezeichnung den Artikel.
theological_decisions:
- issue: Bestimmte oder unbestimmte Wiedergabe von πνεῦμα ἅγιον
  choice: den Heiligen Geist
  alternative: einen heiligen Geist
  rationale: Der unmittelbare Kontext spricht vom verheißenen göttlichen Geist, nicht von einem unbestimmten Geistwesen. Die Wiedergabe benennt den Referenten, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Aspekt der beiden Imperfektformen
  choice: Natürliches deutsches Präteritum in beiden Satzteilen
  alternative: „Dann waren sie dabei, ihnen die Hände aufzulegen, und sie waren dabei, den Heiligen Geist zu empfangen“ beziehungsweise eine ausdrücklich wiederholende Formulierung
  rationale: Beide griechischen Verben stehen im Imperfekt, doch dessen genauer Verlaufs- oder Wiederholungswert ist hier nicht eindeutig. Das deutsche Präteritum bewahrt diese Offenheit; die Fußnote macht die Aspektfrage sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Wendung „die Hände auflegen“ und das Verb „empfangen“ sind allgemein verständlich und dem biblischen Erzählstil angemessen; unnötig schwerfällige Verlaufsformen werden vermieden.
