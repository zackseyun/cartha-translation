  source_fidelity: Die Übersetzung gibt die doppelte Verneinung und die zwei eng verbundenen Begriffe μερίς und κλῆρος mit „weder Anteil noch Anrecht“ sachgerecht wieder. „An dieser Sache“ trifft ἐν τῷ λόγῳ τούτῳ im hier gemeinten Zusammenhang, ohne die Reichweite der Aussage zu verengen. „Vor Gott nicht aufrichtig“ vermittelt den moralischen Sinn von οὐκ ... εὐθεῖα ἔναντι τοῦ θεοῦ angemessen.
  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch. Die direkte Anrede und der ernste Ton entsprechen dem Kontext. „Anteil noch Anrecht“ ist verständlich und erhält die bewusst doppelte Ausdrucksweise.
  terminology: Die Begriffe sind theologisch nicht unnötig festgelegt. „Anrecht“ gibt bei κλῆρος den Aspekt eines zugewiesenen bzw. beanspruchten Anteils wieder, ohne daraus ein bestimmtes Amt, Heilsgut oder eine bestimmte Gabe abzuleiten. „Vor Gott“ ist für ἔναντι τοῦ θεοῦ treffend.
