id: ACT.8.21
reference: Acts 8:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: de
  text: Du hast weder Anteil noch Anrecht an dieser Sache, denn dein Herz ist vor Gott nicht aufrichtig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: weder Anteil noch Anrecht
  rationale: Die beiden eng verwandten Begriffe werden im Deutschen unterscheidbar wiedergegeben. „Anteil“ bezeichnet die Teilhabe, „Anrecht“ den durch κλῆρος mitschwingenden Anspruch auf einen zugewiesenen Anteil; ein wörtliches „Los“ wäre hier missverständlich.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: an dieser Sache
  rationale: λόγος bezeichnet in diesem Zusammenhang nicht nur ein gesprochenes Wort, sondern die soeben behandelte Angelegenheit. „An dieser Sache“ ist daher natürlich und kontextgerecht.
- source_word: εὐθεῖα
  choice: aufrichtig
  rationale: Das Grundbild ist „gerade“. Auf das Herz bezogen gibt „aufrichtig“ den moralisch-geistlichen Sinn im heutigen Deutsch idiomatisch wieder.
- source_word: ἔναντι τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe Wendung bewahrt den Gedanken, dass der Zustand des Herzens in Gottes Gegenwart und Urteil offenbar ist.
theological_decisions:
- issue: Art des ausgeschlossenen Anteils
  choice: Die Formulierung lässt offen, ob vor allem Teilhabe, Befugnis oder Anspruch gemeint ist.
  alternative: Die Aussage ausdrücklich auf ein kirchliches Amt, das Heil oder den Heiligen Geist festlegen.
  rationale: Der griechische Vers nennt die konkrete „Sache“, bestimmt ihre theologische Reichweite hier aber nicht abschließend. Die Übersetzung soll diese Offenheit nicht konfessionell verengen.
translation_notes:
  register: Direkte, ernste Anrede in modernem Standarddeutsch. Die Wortstellung „vor Gott nicht aufrichtig“ klingt natürlich und hält Gottes Urteil als maßgeblichen Bezugspunkt deutlich fest.
