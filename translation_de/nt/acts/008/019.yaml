  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: de
  text: 'und sagte: „Gebt auch mir diese Vollmacht[a], damit jeder, dem ich die Hände auflege, den Heiligen Geist empfängt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Macht“. Das griechische Wort kann eine verliehene Vollmacht, ein Recht oder die Macht zu handeln bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das präsentische Partizip führt Simons Rede ein und wird im natürlichen deutschen Erzählstil am besten mit einem beigeordneten finiten Verb wiedergegeben.
- source_word: Δότε
  choice: Gebt
  rationale: Der Aoristimperativ Plural von δίδωμι bezeichnet hier eine direkte Aufforderung an Petrus und Johannes.
- source_word: κἀμοί
  choice: auch mir
  rationale: Die Krasis aus καί und ἐμοί betont, dass Simon dieselbe Vollmacht ebenfalls für sich begehrt.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: ἐξουσία kann Autorität, Berechtigung oder verliehene Handlungsmacht bezeichnen. „Vollmacht“ verbindet im Deutschen Befugnis und wirksame Handlungsgewalt, ohne das Wort schlicht mit „Kraft“ gleichzusetzen.
- source_word: ταύτην
  choice: diese
  rationale: Das Demonstrativpronomen verweist auf die konkrete, unmittelbar zuvor beobachtete Vollmacht.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck beziehungsweise das beabsichtigte Ergebnis idiomatisch wieder.
- source_word: ᾧ ἐὰν
  choice: jeder, dem
  rationale: Relativpronomen und ἐάν ergeben einen unbestimmten, allgemein geltenden Bezug.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: ich die Hände auflege
  rationale: „Die Hände auflegen“ ist die natürliche deutsche Wendung und bewahrt das konkrete Bild des griechischen Ausdrucks.
- source_word: λαμβάνῃ
  choice: empfängt
  rationale: Der deutsche Indikativ im damit-Satz gibt den griechischen Konjunktiv idiomatisch wieder, ohne unnötig Unsicherheit durch „vielleicht“ oder „könnte“ einzutragen.
- source_word: πνεῦμα ἅγιον
  choice: den Heiligen Geist
  rationale: Obwohl die griechische Wortgruppe artikellos ist, bezeichnet sie im Kontext der Apostelgeschichte den göttlichen Heiligen Geist; im Deutschen verlangt der bestimmte personale Bezug hier den Artikel.
theological_decisions:
- issue: Bedeutung von ἐξουσία als Befugnis oder wirksame Macht
  choice: Vollmacht
  alternative: Macht
  rationale: „Vollmacht“ wahrt sowohl den Gedanken einer Befugnis als auch den einer verliehenen Handlungsmacht. Die Alternative „Macht“ ist möglich, könnte aber die lexikalische Unterscheidung gegenüber Wörtern, die unmittelbarer Kraft oder Macht bezeichnen, verwischen.
- issue: Artikelloses πνεῦμα ἅγιον
  choice: den Heiligen Geist
  alternative: Heiligen Geist; einen heiligen Geist
  rationale: Der Erzählzusammenhang meint den göttlichen Geist. „Einen heiligen Geist“ würde einen unbestimmten Geist nahelegen und den Kontext verfehlen; die bestimmte Form ist im Deutschen natürlich und sachlich präzise.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Standardsprache. Die direkte Rede bleibt knapp und eindringlich; „Vollmacht“ bewahrt die begriffliche Spannung zwischen Befugnis und wirksamer Macht.
