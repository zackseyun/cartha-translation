  source_fidelity: 'Der Text gibt die zentralen Elemente des griechischen Satzes treffend wieder: die an die Apostel gerichtete Aufforderung, die hervorgehobene Einbeziehung Simons („auch mir“), die konkrete „Vollmacht“, den Zweck und den unbestimmten Personenkreis, dem Simon die Hände auflegen würde. „den Heiligen Geist“ ist im Kontext sachgerecht.'
  naturalness: Die Formulierung ist modernes, flüssiges Standarddeutsch. „Jemandem die Hände auflegen“ ist die übliche und verständliche Wendung. Die Wiedergabe des einleitenden Partizips durch „und sagte“ ist im deutschen Erzählstil natürlich und bewahrt den Anschluss an den vorherigen Vers.
  terminology: „Vollmacht“ gibt ἐξουσίαν präzise als Befugnis mit wirksamer Handlungsmacht wieder. Die Fußnote nennt mit „Macht“ eine vertretbare lexikalische Alternative, ohne die gewählte Übersetzung zu entwerten. „der Heilige Geist“ entspricht dem eindeutigen Kontext und deutschem Sprachgebrauch.
