id: ACT.8.20
reference: Acts 8:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: de
  text: 'Petrus aber sagte zu ihm: „Dein Silber[a] soll mit dir zugrunde gehen, weil du gemeint hast, die Gabe Gottes mit Geld erwerben[b] zu können.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Silber“; das Wort konnte auch Silbermünzen und damit Geld bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „erlangen“; im Zusammenhang auch „kaufen“. Gemeint ist, dass Simon Gottes Gabe für etwas hielt, das man durch Bezahlung bekommen könne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: Silber
  rationale: Das Substantiv bezeichnet wörtlich Silber beziehungsweise Silbergeld. „Silber“ bewahrt das konkrete Bild und vermeidet die Wiederholung von „Geld“ im zweiten Satzteil.
- source_word: σὺν σοὶ
  choice: mit dir
  rationale: Die direkte und natürliche Wiedergabe verbindet Simon und sein Geld in der scharfen Aussage des Petrus.
- source_word: εἴη εἰς ἀπώλειαν
  choice: soll … zugrunde gehen
  rationale: Der Optativ drückt hier einen Wunsch beziehungsweise eine Verwünschung aus. „Soll … zugrunde gehen“ gibt diese Kraft im Deutschen wieder, ohne ἀπώλεια vorschnell als ausdrückliche Aussage über die ewige Verdammnis zu deuten.
- source_word: δωρεὰν
  choice: Gabe
  rationale: „Gabe“ ist eine natürliche, würdige Entsprechung und erhält den Gegensatz zwischen dem von Gott Gegebenen und einem vermeintlich käuflichen Gut.
- source_word: ἐνόμισας
  choice: du gemeint hast
  rationale: Das Verb bedeutet hier denken, meinen oder annehmen. „Gemeint hast“ klingt in der direkten Zurechtweisung natürlich.
- source_word: διὰ χρημάτων
  choice: mit Geld
  rationale: διά mit dem Genitiv bezeichnet das Mittel; „mit Geld“ ist die idiomatische deutsche Formulierung.
- source_word: κτᾶσθαι
  choice: erwerben
  rationale: Das Verb bezeichnet das Erlangen oder Sichverschaffen. „Erwerben“ wahrt diesen Sinn und lässt den ausdrücklich genannten Einsatz von Geld die kaufmännische Nuance vermitteln.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier den Gegensatz zwischen Simons Bitte und der scharfen Antwort des Petrus.
theological_decisions:
- issue: Kraft der Aussage des Petrus über Simon und sein Geld
  choice: 'Eine verwünschende Wunsch- beziehungsweise Aufforderungsform: „soll mit dir zugrunde gehen“'
  alternative: Eine bloße Vorhersage des Verderbens oder die ausdrücklich ewige Verdammnis bezeichnende Formulierung „zur Hölle mit dir und deinem Geld“
  rationale: Der Optativ εἴη trägt die Kraft eines Wunsches oder einer Verwünschung. Die Übersetzung erhält die Schärfe, legt ἀπώλεια aber nicht auf eine über den Wortlaut hinausgehende Lehre vom endgültigen Schicksal Simons fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und scharfem Ton. Die konkrete Rede von „Silber“ bleibt erhalten; „zugrunde gehen“ vermeidet sowohl eine Abschwächung zu bloßem finanziellem Verlust als auch eine dogmatisch überbestimmte Wiedergabe.
