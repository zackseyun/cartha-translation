id: ACT.8.39
reference: Acts 8:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: de
  text: Als sie aus dem Wasser heraufkamen, riss der Geist des Herrn Philippus fort[a], und der Eunuch sah ihn nicht mehr; denn er zog voll Freude seines Weges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entriss Philippus“. Das griechische Verb kann eine plötzliche, gewaltsame Wegnahme hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: aus dem Wasser heraufkamen
  rationale: Die Wendung gibt sowohl die Aufwärtsbewegung als auch das Herauskommen aus dem Wasser wieder, ohne die Art der Taufe näher festzulegen.
- source_word: πνεῦμα κυρίου
  choice: der Geist des Herrn
  rationale: Im Sprachgebrauch des Lukas bezeichnet die Wendung am ehesten Gottes Geist als handelnden Urheber; die Großschreibung entspricht diesem Verständnis.
- source_word: ἥρπασεν
  choice: entriss
  rationale: Das Verb ἁρπάζω bezeichnet hier ein plötzliches, machtvolles Wegnehmen. „Entriss“ bewahrt diese Stärke und die göttliche Initiative.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: sah ihn nicht mehr
  rationale: Die Formulierung gibt natürlich und genau wieder, dass der Eunuch Philippus von diesem Zeitpunkt an nicht mehr sah.
- source_word: ὁ εὐνοῦχος
  choice: der Eunuch
  rationale: Die direkte Bezeichnung wahrt den ausdrücklichen griechischen Wortlaut und den Bezug zur vorausgehenden Erzählung.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: zog seines Weges
  rationale: Die deutsche Wendung bezeichnet idiomatisch die Fortsetzung seiner Reise und gibt den Verlauf des Imperfekts angemessen wieder.
- source_word: χαίρων
  choice: voll Freude
  rationale: Die Formulierung gibt die begleitende freudige Haltung des Reisenden in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Ob πνεῦμα κυρίου als Heiliger Geist oder als unpersönliche göttliche Kraft zu verstehen ist
  choice: „der Geist des Herrn“ als persönlich handelnder göttlicher Urheber
  alternative: ein vom Herrn ausgehender unpersönlicher Geist oder eine Kraft
  rationale: Im Kontext von Lukas und Apostelgeschichte bezeichnet diese Wendung gewöhnlich Gottes Geist, der wirksam handelt. Die Übersetzung fügt jedoch nicht ausdrücklich „Heiliger“ hinzu.
- issue: Ob ἥρπασεν eine plötzliche, wunderhafte Entfernung ausdrückt
  choice: „entriss“ bewahrt die Plötzlichkeit und Kraft des Vorgangs
  alternative: „nahm Philippus hinweg“ oder „führte Philippus fort“
  rationale: Das griechische Verb ist stärker als ein neutrales Fortführen. Zugleich bleibt offen, auf welche konkrete Weise Philippus entfernt wurde.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Eunuch“ bleibt als sachlich genaue historische Bezeichnung erhalten. „Zog seines Weges“ ist leicht gehoben, aber allgemein verständlich und passt zum biblischen Erzählregister.
