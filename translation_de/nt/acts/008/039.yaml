  source_fidelity: Die Übersetzung gibt die Bewegungsangabe „aus dem Wasser heraufkamen“, πνεῦμα κυρίου als „der Geist des Herrn“, das Nichtwiedersehen des Eunuchen sowie dessen freudige Weiterreise zutreffend wieder. Für ἥρπασεν ist „entriss“ semantisch möglich, bleibt ohne Richtungsadverb jedoch etwas unbestimmt; „riss … fort“ gibt die plötzliche, gewaltsame Wegnahme klar und idiomatisch wieder.
  naturalness: Die Erzählsprache ist insgesamt natürliches, würdiges modernes Deutsch. „Zog voll Freude seines Weges“ ist bewusst leicht gehoben, aber verständlich und passend. „Riss Philippus fort“ ist im heutigen Deutsch klarer und flüssiger als das etwas literarische „entriss Philippus“.
  terminology: „Geist des Herrn“ wahrt die lukanische Formulierung, ohne den nicht im griechischen Text stehenden Titel „Heiliger Geist“ einzutragen. „Eunuch“ ist die direkte und sachlich angemessene Wiedergabe von εὐνοῦχος. Der Name „Philippus“ ist korrekt.
