  - severity: low
    issue: „Entriss der Geist des Herrn Philippus“ ist ohne „fort/hinweg“ leicht literarisch und weniger eindeutig als eine moderne deutsche Wiedergabe.
    rationale: ἁρπάζω bezeichnet hier eine plötzliche Wegnahme. „Riss Philippus fort“ macht diese Bewegungsrichtung explizit, ohne den Vorgang näher zu erklären.
  revised_text: Als sie aus dem Wasser heraufkamen, riss der Geist des Herrn Philippus fort[a], und der Eunuch sah ihn nicht mehr; denn er zog voll Freude seines Weges.
