  to: Als sie aus dem Wasser heraufkamen, riss der Geist des Herrn Philippus fort[a], und der Eunuch sah ihn nicht mehr; denn er zog voll Freude seines Weges.
  rationale: Die Revision ersetzt die etwas weniger idiomatische Formulierung „entriss … Philippus“ durch „riss … fort“, welche die plötzliche Wegnahme von ἥρπασεν klar und modern wiedergibt. Die auditierte lexikalische Alternative wird als deutsche Fußnote mit einem Anker an der betreffenden Verbgruppe ergänzt. Im Übrigen bleibt der Entwurf unverändert.
