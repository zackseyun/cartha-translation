base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: de
  text: Und die Menschenmengen richteten einmütig[a] ihre Aufmerksamkeit auf das, was Philippus sagte, während sie zuhörten[b] und die Zeichen sahen, die er tat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gemeinsam“ oder „übereinstimmend“. Das griechische Wort betont ihre gemeinsame, übereinstimmende Reaktion.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „während sie hörten und die Zeichen sahen“. Das griechische Pronomen bezeichnet die Menschenmengen als Subjekt der Infinitive.'
    reason: source_clarification
lexical_decisions:
- source_word: προσεῖχον
  choice: achteten auf
  rationale: Das Verb bezeichnet hier das bewusste, anhaltende Richten der Aufmerksamkeit auf etwas. „Achteten auf“ ist im modernen Deutsch natürlich und bewahrt durch das Präteritum im Kontext den fortlaufenden Charakter des Imperfekts.
- source_word: δὲ
  choice: Und
  rationale: δέ verbindet den Satz locker mit dem vorhergehenden Geschehen; „Und“ setzt den Erzählfluss fort, ohne einen stärkeren Gegensatz einzutragen.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Die Wiedergabe bewahrt den Plural und bezeichnet die versammelten Gruppen genauer als das allgemeinere „die Leute“.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: auf das, was Philippus sagte
  rationale: Die Formulierung gibt den Inhalt des von Philippus Gesagten idiomatisch wieder und bewahrt Philippus als Sprecher, ohne den Ausdruck deutend zu „Botschaft“ zu erweitern.
- source_word: ὁμοθυμαδὸν
  choice: einmütig
  rationale: „Einmütig“ drückt die gemeinsame, übereinstimmende Reaktion der Menschenmengen knapp und würdig aus.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: während sie ihm zuhörten und … sahen
  rationale: Die Konstruktion ἐν τῷ mit Infinitiv beschreibt hier die begleitenden Umstände. Das Akkusativpronomen αὐτούς bezeichnet syntaktisch die Menschenmengen als diejenigen, die hörten und sahen; „ihm“ macht im Deutschen den aus dem Zusammenhang erschlossenen Bezug auf Philippus verständlich.
- source_word: τὰ σημεῖα
  choice: die Zeichen
  rationale: „Zeichen“ entspricht dem griechischen Ausdruck, ohne die deutende Ergänzung „Wunder-“ vorwegzunehmen.
- source_word: ἃ ἐποίει
  choice: die er tat
  rationale: Die schlichte Wendung bewahrt die übliche Ausdrucksweise des griechischen Textes. Im Zusammenhang bezeichnet sie die wiederholt beziehungsweise fortlaufend geschehenden Zeichen.
