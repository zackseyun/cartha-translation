  source_fidelity: 'Die Wiedergabe von προσεῖχον, ὁμοθυμαδόν, τοῖς λεγομένοις, σημεῖα und dem imperfektischen ἐποίει ist im Wesentlichen zutreffend. Korrigiert werden muss jedoch „während sie ihm zuhörten“: Das αὐτούς im überlieferten griechischen Wortlaut fungiert bei den Infinitiven als deren Akkusativsubjekt und bezeichnet die Menschenmengen. Es liefert kein ausdrückliches Objekt „ihm“ zu ἀκούειν.'
  naturalness: „Die Menschenmengen richteten einmütig ihre Aufmerksamkeit auf ...“ ist modernes, flüssiges Standarddeutsch und gibt die anhaltend gebündelte Aufmerksamkeit klar wieder. „Während sie zuhörten und die Zeichen sahen“ ist natürlich und vermeidet eine nicht im Text ausgedrückte Ergänzung.
