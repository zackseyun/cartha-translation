  source_fidelity: 'Der Entwurf gibt die Abfolge sowie die wesentlichen Bedeutungen von προσδραμών, ἀκούω mit Genitivpartizip, Ἆρά γε und γινώσκεις zutreffend wieder. Die Formulierung „den Propheten Jesaja lesen“ ist jedoch im modernen Deutschen syntaktisch weniger eindeutig: Sie kann den Propheten als unmittelbar gelesenen Gegenstand erscheinen lassen. „aus dem Propheten Jesaja lesen“ macht natürlich deutlich, dass aus der Schrift des Propheten gelesen wird, ohne über den griechischen Text hinauszugehen.'
  naturalness: „Da lief Philippus zu ihm hin“ und die direkte Frage sind gut verständlich. Die Umstellung zu „hörte ihn aus dem Propheten Jesaja lesen“ ist im Deutschen klarer und idiomatischer. „Wirklich“ trägt den Nachdruck der Fragepartikeln natürlich; das zusätzliche „denn“ ist dafür nicht erforderlich.
  terminology: „Philippus“, „der Prophet Jesaja“ und „verstehen“ sind sachgerecht und im modernen bibelsprachlichen Standardregister etabliert. Die Formulierung „aus dem Propheten Jesaja“ wahrt die übliche deutsche Bezeichnung einer prophetischen Schrift.
