  - severity: low
    issue: „denn wirklich“ wirkt leicht gehäuft
    rationale: Beide Wörter können die griechische Partikelfügung abbilden, doch „wirklich“ allein ist im modernen Standarddeutsch flüssiger und erhält den Nachdruck.
