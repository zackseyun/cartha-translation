  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: de
  text: 'Da lief Philippus zu ihm hin und hörte ihn aus dem Propheten Jesaja lesen. Er sagte: »Verstehst du wirklich, was du liest?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verstehst du, was du liest?« Die griechischen Fragepartikeln verleihen der Frage Nachdruck; ihre genaue Stärke lässt sich im Deutschen unterschiedlich wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: lief … zu ihm hin
  rationale: Das Aoristpartizip von προστρέχω bezeichnet eine schnelle Bewegung auf jemanden zu. Die deutsche Formulierung bewahrt die Lebendigkeit des Vorgangs; das im Kontext eindeutige Ziel wird mit »zu ihm« natürlich ausgedrückt.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter. »Da« stellt im Deutschen einen natürlichen Anschluss an die vorausgehende Aufforderung des Geistes her, ohne eine stärkere Folgerung zu behaupten.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: Er hörte ihn … lesen
  rationale: Die Konstruktion ἀκούω mit Genitivpartizip beschreibt, dass Philippus den Mann während des Lesens hörte. Lautes Lesen ist dadurch naheliegend, aber nicht ausdrücklich lexikalisch markiert und wird daher nicht ergänzt.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: den Propheten Jesaja
  rationale: Diese im Deutschen natürliche Wortstellung gibt sowohl den Namen Jesaja als auch seine Bezeichnung als Prophet vollständig wieder.
- source_word: εἶπεν
  choice: sagte
  rationale: »Sagte« entspricht λέγω unmittelbar; die folgende direkte Frage macht die Art der Äußerung bereits deutlich.
- source_word: Ἆρά γε
  choice: denn wirklich
  rationale: Die Partikelverbindung verleiht der Frage einen prüfenden, nachdrücklichen Ton. »Denn wirklich« gibt diese Nuance in natürlichem Deutsch wieder, ohne eine eindeutige erwartete Antwort festzulegen.
- source_word: γινώσκεις
  choice: verstehst
  rationale: Im Kontext geht es um das Erfassen des Sinnes der gelesenen Schriftstelle, nicht bloß um Kenntnis.
- source_word: ἃ ἀναγινώσκεις
  choice: was du liest
  rationale: Das Relativpronomen bezeichnet den Inhalt des Gelesenen. Das deutsche Präsens gibt den gerade stattfindenden Vorgang idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; die Betonung der griechischen Fragepartikeln bleibt erhalten, ohne Philipps Erwartung dogmatisch festzulegen.
