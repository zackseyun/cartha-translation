id: ACT.8.12
reference: Acts 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: de
  text: Als sie aber Philippus glaubten, der die gute Nachricht vom Reich Gottes und vom Namen Jesu, des Messias,[a] verkündete, wurden sowohl Männer als auch Frauen getauft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Namen Jesu Christi“. Das griechische Χριστός ist hier als Titel „Messias“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als sie aber
  rationale: ὅτε leitet den zeitlichen Nebensatz ein; δέ kennzeichnet hier eine leichte Gegenüberstellung beziehungsweise den nächsten Erzählschritt. „Als … aber“ gibt beides im Deutschen natürlich wieder.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: sie Philippus glaubten
  rationale: πιστεύω mit Dativ bedeutet hier, Philippus als Verkündiger Glauben zu schenken, nicht an ihn als Gegenstand des rettenden Glaubens zu glauben. Die knappe deutsche Form bewahrt diesen Unterschied.
- source_word: εὐαγγελιζομένῳ
  choice: der die gute Nachricht … verkündete
  rationale: Das präsentische Partizip beschreibt Philippus während seiner Verkündigung. Die Relativsatzkonstruktion ist im Deutschen klar und gibt den Inhalt von εὐαγγελίζω verständlich wieder.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: vom Reich Gottes
  rationale: περί mit Genitiv bezeichnet den Gegenstand der Verkündigung. „Reich Gottes“ ist die geläufige und transparente Wiedergabe.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: vom Namen Jesu, des Messias
  rationale: „Name“ bleibt erhalten, da ὄνομα die Person, Vollmacht und offenbarte Identität bezeichnen kann. Χριστός wird als Titel verstanden und daher mit „Messias“ wiedergegeben; die Apposition macht dies in natürlichem Deutsch deutlich.
- source_word: ἐβαπτίζοντο
  choice: wurden … getauft
  rationale: Das Imperfekt Passiv bezeichnet das fortlaufende Geschehen, während Menschen der Botschaft glaubten. Das deutsche Präteritum Passiv wahrt die passive Form, ohne durch Zusätze eine Wiederholung stärker zu behaupten, als der Kontext erlaubt.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: sowohl Männer als auch Frauen
  rationale: Die Verbindung τε … καί hebt ausdrücklich beide Gruppen hervor; „sowohl … als auch“ bildet diese Koordination idiomatisch ab.
theological_decisions:
- issue: Bedeutung von πιστεύω mit Philippus als Dativobjekt
  choice: Philippus glaubten
  alternative: an Philippus glaubten
  rationale: Der Text sagt, dass die Menschen Philippus und seiner Verkündigung Glauben schenkten. „An Philippus glaubten“ könnte ihn fälschlich zum Gegenstand des Glaubens machen.
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  alternative: Jesu Christi
  rationale: Χριστός trägt hier seinen Titelsinn. „Des Messias“ hält diesen Sinn sichtbar, während die Fußnote die traditionelle deutsche Namensform nennt, ohne die griechische Mehrdeutigkeit zu verschweigen.
- issue: Taufhandlung und grammatische Form
  choice: wurden … getauft
  alternative: ließen sich … taufen
  rationale: Die passive Form entspricht ἐβαπτίζοντο und vermeidet, über die im Text ausgesagte freiwillige Reaktion hinaus eine reflexiv-kausative Nuance einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau bleibt quellennah, ohne unnatürlich zu wirken; traditionelle kirchliche Fachsprache wird nur dort verwendet, wo sie allgemein verständlich ist.
