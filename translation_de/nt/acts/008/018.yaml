  verdict: approve
  source_fidelity: Der Entwurf gibt die temporale Funktion von ἰδών, den milden Kontrast von δέ, die durch διά mit Genitiv bezeichnete Mittelbeziehung und das Passiv von δίδοται sachgerecht wieder. „Durch das Auflegen der Hände der Apostel“ entspricht dem griechischen Genitivverhältnis und legt keine weitergehende Aussage über die letztliche Quelle der Gabe fest. „Geld anbot“ trifft προσήνεγκεν χρήματα idiomatisch und inhaltlich.
  naturalness: „Als Simon aber sah, dass der Geist durch das Auflegen der Hände der Apostel gegeben wurde, bot er ihnen Geld an“ ist klares, modernes Standarddeutsch mit angemessen würdigem Register. Die Wortstellung und die Bezeichnung „das Auflegen der Hände“ sind natürlich und gut verständlich.
  terminology: „Der Geist“ bewahrt die articular-kürzere Form τὸ πνεῦμα; die Fußnote erklärt angemessen und nicht überdeutend den im Kontext klaren Bezug auf den Heiligen Geist. „Apostel“ und „Geld“ sind terminologisch treffend.
