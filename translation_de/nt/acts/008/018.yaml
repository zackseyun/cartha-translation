id: ACT.8.18
reference: Acts 8:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: de
  text: Als Simon aber sah, dass der Geist durch das Auflegen der Hände der Apostel gegeben wurde,[a] bot er ihnen Geld an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Heilige Geist“. Im Griechischen steht hier nur „der Geist“; aus dem Zusammenhang geht hervor, dass der Heilige Geist gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: als … sah
  rationale: Das Aoristpartizip von ὁράω ist hier temporal zu verstehen; „als … sah“ gibt die zeitliche Abfolge natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet eine leichte Weiterführung mit Kontrast und lenkt den Blick auf Simons Reaktion.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: durch das Auflegen der Hände
  rationale: διά mit Genitiv bezeichnet hier das Mittel. „Durch das Auflegen der Hände“ ist klar, idiomatisch und bewahrt die instrumentale Aussage.
- source_word: τῶν ἀποστόλων
  choice: der Apostel
  rationale: Der Genitiv bezeichnet, wessen Hände aufgelegt wurden; die deutsche Genitivkonstruktion bildet dies unmittelbar ab.
- source_word: δίδοται
  choice: gegeben wurde
  rationale: Das historische Präsens im griechischen Erzählzusammenhang wird im Deutschen natürlich mit dem Präteritum wiedergegeben; das Passiv bleibt erhalten.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der griechische Text sagt wörtlich „der Geist“. Der unmittelbare Zusammenhang identifiziert den Referenten als den Heiligen Geist; die kürzere Form bewahrt jedoch den Wortlaut.
- source_word: προσήνεγκεν
  choice: bot … an
  rationale: προσφέρω bezeichnet hier das Anbieten beziehungsweise Darreichen einer Zahlung; „bot … Geld an“ ist im Deutschen idiomatisch.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ wird als indirektes Objekt natürlich mit „ihnen“ wiedergegeben.
- source_word: χρήματα
  choice: Geld
  rationale: χρήματα bedeutet in diesem Zusammenhang Geld beziehungsweise eine Geldsumme; „Geld“ ist die direkte und geläufige Wiedergabe.
theological_decisions:
- issue: Referent von τὸ πνεῦμα
  choice: „der Geist“, mit Bezug auf den Heiligen Geist
  alternative: „der Heilige Geist“
  rationale: Der unmittelbare Kontext macht den Heiligen Geist zum Referenten. Der Haupttext hält dennoch an der kürzeren griechischen Form fest; eine Fußnote erläutert den Bezug.
- issue: Mittel beziehungsweise Vermittlung bei der Gabe des Geistes
  choice: „durch das Auflegen der Hände der Apostel gegeben wurde“
  alternative: „durch die Handauflegung der Apostel verliehen wurde“
  rationale: Die Formulierung wahrt die mit διά und Genitiv ausgedrückte Mittelbeziehung, ohne die Apostel ausdrücklich zur letztgültigen Quelle der Gabe zu machen oder eine weitergehende sakramentale beziehungsweise antisakramentale Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das Auflegen der Hände“ ist verständlicher als das stärker fachsprachliche „Handauflegung“ und bildet zugleich die griechische Wendung transparent ab.
