source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: de
  text: Da begann Philippus zu sprechen[a] und verkündete ihm, ausgehend von dieser Schriftstelle, die gute Nachricht über Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Philippus öffnete seinen Mund«; eine Redewendung für den Beginn des Sprechens.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Er verkündete ihm Jesus«; Jesus bezeichnet den Inhalt der Verkündigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: begann ... zu sprechen
  rationale: Die wörtliche Wendung »öffnete seinen Mund« ist eine feste Redewendung für den Beginn einer Äußerung. Die gewählte Form gibt ihren Sinn in natürlichem modernem Deutsch wieder; die Bildsprache wird in der Fußnote dokumentiert.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter. »Da« markiert den anschließenden Handlungsschritt knapp und idiomatisch.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: ausgehend von dieser Schriftstelle
  rationale: ἀπό bezeichnet den Ausgangspunkt der Erklärung. »Schriftstelle« macht im Kontext deutlich, dass die eben gelesene Stelle aus der Heiligen Schrift gemeint ist, ohne zusätzliches Material einzutragen.
- source_word: εὐηγγελίσατο
  choice: verkündete ... die gute Nachricht
  rationale: Das Verb bezeichnet das Verkünden einer guten Botschaft. Diese Wiedergabe ist verständlich und bewahrt den evangelistischen Gehalt, ohne das stärker institutionell klingende »predigte« vorauszusetzen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Pronomen wird entsprechend dem griechischen Dativ ausdrücklich wiedergegeben und verweist im Kontext auf den äthiopischen Hofbeamten.
- source_word: τὸν Ἰησοῦν
  choice: von Jesus
  rationale: Der Akkusativ bezeichnet bei εὐαγγελίζομαι den Inhalt der Verkündigung. Im Deutschen drückt »die gute Nachricht von Jesus« diese Beziehung natürlich aus, wobei Jesus selbst Inhalt und Mittelpunkt bleibt.
theological_decisions:
- issue: Bedeutung von εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: Philippus verkündete ihm die gute Nachricht von Jesus.
  alternative: Philippus verkündete ihm Jesus.
  rationale: Die griechische Konstruktion stellt Jesus als Inhalt der Evangeliumsverkündigung dar. Die gewählte Form ist im Deutschen klar und natürlich, ohne den Ausdruck auf eine bestimmte dogmatische Erklärung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die griechischen Partizipialkonstruktionen werden in einen natürlichen deutschen Hauptsatz überführt; ihre Abfolge und inhaltlichen Beziehungen bleiben erhalten.
