revisions:
- from: Da begann Philippus zu sprechen[a] und verkündete ihm, ausgehend von dieser Schriftstelle, die gute Nachricht von Jesus.[b]
  to: Da begann Philippus zu sprechen[a] und verkündete ihm, ausgehend von dieser Schriftstelle, die gute Nachricht über Jesus.[b]
  rationale: Die Revision beseitigt die mögliche deutsche Mehrdeutigkeit von »von Jesus« und korrigiert die Fußnote zur griechischen Konstruktion, ohne Bedeutung, Register oder erzählerischen Ablauf zu verändern.
  reviewer_model: gpt-5.6-terra
