id: ACT.8.15
reference: Acts 8:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: de
  text: Nachdem sie hinabgegangen waren, beteten sie für sie, damit sie den Heiligen Geist empfingen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Sie gingen hinab und beteten für sie“ oder „Als sie hinabgekommen waren, beteten sie für sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: sie
  rationale: Das Relativpronomen verweist auf Petrus und Johannes im vorhergehenden Vers. Im Deutschen führt die temporale Umformung mit „Nachdem sie …“ den Bezug natürlich fort.
- source_word: καταβάντες
  choice: nachdem sie hinabgegangen waren
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die dem Beten vorausgeht. Die Formulierung wahrt sowohl die zeitliche Abfolge als auch die im Verb enthaltene Abwärtsbewegung.
- source_word: προσηύξαντο
  choice: beteten
  rationale: Die schlichte Vergangenheitsform gibt das Aoristverb idiomatisch wieder; eine besondere Bedeutung des Mediums muss im Deutschen nicht ausgedrückt werden.
- source_word: περὶ αὐτῶν
  choice: für sie
  rationale: Bei einem Gebet bezeichnet περί mit Genitiv hier die Personen, für die Fürbitte gehalten wird.
- source_word: ὅπως
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Zielangabe der griechischen Konjunktion klar wieder.
- source_word: λάβωσιν
  choice: empfingen
  rationale: Das Verb bezeichnet das Empfangen des Geistes. In Verbindung mit „damit“ fügt sich die Vergangenheitsform natürlich in den erzählenden Kontext ein, ohne eine zusätzliche Unsicherheit auszudrücken.
- source_word: πνεῦμα ἅγιον
  choice: den Heiligen Geist
  rationale: Im Erzählzusammenhang der Apostelgeschichte ist der göttliche Heilige Geist gemeint. Der bestimmte Artikel entspricht dabei dem üblichen deutschen Sprachgebrauch.
theological_decisions:
- issue: Ob πνεῦμα ἅγιον allgemein als „heiligen Geist“ oder als Bezeichnung des göttlichen Heiligen Geistes zu verstehen ist
  choice: den Heiligen Geist
  alternative: heiligen Geist / einen heiligen Geist
  rationale: Der unmittelbare Zusammenhang in Apostelgeschichte 8 bezeichnet den verheißenen Geist, den die Glaubenden empfangen. Die Wiedergabe identifiziert den kontextuellen Referenten, ohne über den Text hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die temporale Unterordnung macht die Abfolge des griechischen Aoristpartizips deutlich; die Fußnote nennt flüssigere koordinierte beziehungsweise alternative temporale Wiedergaben.
