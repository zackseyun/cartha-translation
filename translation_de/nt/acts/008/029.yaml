id: ACT.8.29
reference: Acts 8:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ· Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: de
  text: 'Da sagte der Geist zu Philippus: „Geh hin und halte dich dicht an diesen Wagen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geh näher heran und bleib dicht bei diesem Wagen.“'
    reason: 'Lexikalische Alternative: Πρόσελθε und κολλήθητι können die Annäherung und das anschließende Verbleiben in unmittelbarer Nähe stärker hervorheben.'
lexical_decisions:
- source_word: εἶπεν
  choice: sagte
  rationale: Der Aorist von λέγω wird in einer Erzählung mit anschließender direkter Rede natürlich mit „sagte“ wiedergegeben.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Handlung weiter, ohne einen starken Gegensatz auszudrücken. „Da“ gibt den erzählerischen Fortgang im Deutschen natürlich wieder.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: In diesem Zusammenhang der Apostelgeschichte ist der Heilige Geist gemeint; da ἅγιον im griechischen Text fehlt, bewahrt „der Geist“ dessen knappe Formulierung.
- source_word: τῷ Φιλίππῳ
  choice: zu Philippus
  rationale: Der Dativ bezeichnet den Adressaten. „Philippus“ ist die im Deutschen übliche biblische Namensform.
- source_word: Πρόσελθε
  choice: Geh hin
  rationale: Der Imperativ fordert Philippus auf, sich dem Wagen zu nähern. „Geh hin“ ist im Zusammenhang natürlich und bewahrt den Bewegungsimpuls.
- source_word: κολλήθητι
  choice: halte dich dicht an
  rationale: κολλάομαι bezeichnet ein enges Anschließen oder Sich-daran-Halten. Die Formulierung gibt sowohl die räumliche Nähe als auch das mögliche Fortbewegen neben dem Wagen wieder.
- source_word: τῷ ἅρματι τούτῳ
  choice: an diesen Wagen
  rationale: ἅρμα bezeichnet hier den Wagen des Würdenträgers; τούτῳ wird als nahweisendes „diesen“ wiedergegeben.
theological_decisions:
- issue: Bezug von τὸ πνεῦμα
  choice: „der Geist“ bezeichnet den Heiligen Geist, ohne das nicht ausdrücklich vorhandene Adjektiv „heilig“ zu ergänzen.
  alternative: Eine unbestimmtere geistliche Eingebung oder ein nicht näher bezeichneter Geist.
  rationale: In der Apostelgeschichte ist das richtungsweisende Reden „des Geistes“ ein wiederkehrendes Handeln des Heiligen Geistes. Die Übersetzung lässt zugleich die knappe Ausdrucksweise des griechischen Textes stehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Befehlsform bleibt direkt; „Wagen“ ist im Deutschen kontextgerecht und weniger missverständlich als „Streitwagen“.
