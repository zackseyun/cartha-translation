id: ACT.8.25
reference: Acts 8:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: de
  text: Nachdem sie nun eindringlich Zeugnis abgelegt und das Wort des Herrn verkündet hatten, kehrten sie nach Jerusalem zurück und verkündigten in vielen Dörfern der Samariter die gute Nachricht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: eindringlich Zeugnis abgelegt
  rationale: Das Verb bezeichnet ein nachdrückliches, ernstes Bezeugen. „Eindringlich Zeugnis abgelegt“ bewahrt dieses Gewicht, ohne den Sinn auf eine Warnung zu verengen.
- source_word: λαλήσαντες
  choice: verkündet
  rationale: Wörtlich bedeutet das Verb „gesprochen“. Mit dem direkten Objekt „das Wort des Herrn“ gibt „verkündet“ den gemeinten öffentlichen Mitteilungsakt im natürlichen Deutschen knapp wieder.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: das Wort des Herrn
  rationale: Die traditionelle und im Kontext verständliche Wiedergabe bewahrt sowohl die Breite von λόγος als auch den theologischen Klang der Formulierung.
- source_word: ὑπέστρεφον
  choice: kehrten … zurück
  rationale: Der deutsche einfache Präteritumsausdruck ist hier natürlich; der fortlaufende Aspekt des Imperfekts wird zusammen mit der gleichzeitig ausgeübten Verkündigung im Satzgefüge erkennbar.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: in vielen Dörfern der Samariter
  rationale: Die Formulierung wahrt den Genitiv und die ausdrückliche ethnische Bezeichnung, ohne im Deutschen unnötig schwer zu wirken.
- source_word: εὐηγγελίζοντο
  choice: brachten … die gute Nachricht
  rationale: Diese Wiedergabe macht den verbalen Sinn allgemeinverständlich und vermeidet das kirchensprachlich engere „evangelisierten“. Der Imperfekt bezeichnet die wiederholte beziehungsweise fortlaufende Tätigkeit auf dem Rückweg.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts
  choice: Das Subjekt bleibt als „sie“ wiedergegeben.
  alternative: Die Namen Petrus und Johannes ausdrücklich einsetzen.
  rationale: Der unmittelbare Zusammenhang weist auf Petrus und Johannes, doch der griechische Vers nennt die Namen nicht. Die Übersetzung bewahrt diese Ausdrucksweise.
- issue: Referenz von κυρίου
  choice: „des Herrn“ ohne nähere Festlegung im Vers
  alternative: „Jesu“ oder „Gottes“ ergänzen
  rationale: Der Text verwendet κύριος ohne ausdrückliche Namensnennung. Eine Ergänzung würde die Referenz stärker bestimmen, als es der Vers selbst tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur lässt Zeugnis, Verkündigung und Rückkehr flüssig zusammenwirken; kirchlicher Fachjargon wird vermieden, während „das Wort des Herrn“ als etablierte biblische Wendung erhalten bleibt.
