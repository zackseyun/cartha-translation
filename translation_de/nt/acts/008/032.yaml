source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: de
  text: 'Die Stelle aus der Schrift, die er las, lautete: »Wie ein Schaf wurde er zur Schlachtung geführt[a], und wie ein Lamm vor dem, der es schert, schweigt[b], so öffnet er seinen Mund nicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Schlachten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie ein Lamm vor dem Scherer schweigt«; wörtlich: »vor dem, der es schert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: Stelle aus der Schrift
  rationale: περιοχή bezeichnet hier den abgegrenzten Teil der heiligen Schrift, den der Mann gerade liest. „Stelle aus der Schrift“ ist in modernem Deutsch natürlich und präzise.
- source_word: ἀνεγίνωσκεν
  choice: las
  rationale: Das Imperfekt bezeichnet die im Erzählzusammenhang andauernde Lektüre. Im deutschen Relativsatz gibt „die er las“ diesen Verlauf idiomatisch wieder.
- source_word: Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη
  choice: Wie ein Schaf wurde er zur Schlachtung geführt
  rationale: Die Vergleichsform und das Passiv werden bewahrt. „Zur Schlachtung“ bezeichnet das Ziel der Bewegung, ohne den Ausdruck unnötig auszudeuten.
- source_word: ἀμνὸς
  choice: Lamm
  rationale: ἀμνός bezeichnet ausdrücklich ein Lamm; damit bleibt der Unterschied zum allgemeineren πρόβατον („Schaf“) erhalten.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: vor dem, der es schert
  rationale: Die Wiedergabe folgt dem substantivierten Partizip eng und bleibt zugleich verständlich. Das deutsche Pronomen „es“ richtet sich grammatisch nach „Lamm“.
- source_word: ἄφωνος
  choice: stumm bleibt
  rationale: Im Bild bezeichnet das Wort das Ausbleiben eines Lautes. „Stumm bleibt“ ist würdig und natürlich, ohne eine dauerhafte Unfähigkeit zu sprechen zu behaupten.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: so öffnet er seinen Mund nicht
  rationale: Der vergleichende Abschluss mit οὕτως und das Präsens von ἀνοίγει werden beibehalten; dadurch bleibt das eindringliche Präsens des Schriftzitats erhalten.
theological_decisions:
- issue: Messianisches Zitat aus Jesaja 53, das im Kontext auf Jesus bezogen wird
  choice: Das Zitat bleibt in seiner bildhaften Form stehen, ohne Jesus in diesem Vers ausdrücklich einzusetzen.
  alternative: Den leidenden Knecht bereits im Wortlaut ausdrücklich mit Jesus gleichzusetzen.
  rationale: Apostelgeschichte 8 stellt die christologische Beziehung im weiteren Zusammenhang her. Vers 32 selbst gibt jedoch zunächst den Schrifttext wieder; die Übersetzung soll diese Abfolge und Spannung bewahren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Rhythmus für das Schriftzitat. Die Satzstellung wahrt den poetischen Parallelismus, ohne altertümliche Formen zu verwenden.
