    rationale: ἄφωνος bedeutet hier „stumm/still, schweigend“; „bleibt“ fügt einen Aspekt des Verbleibens hinzu, der nicht ausdrücklich im griechischen Text steht. „schweigt“ gibt die Bildaussage knapp und natürlich wieder.
  - severity: low
    issue: Fußnote b formuliert die Alternative unvollständig und mit zusätzlichem Possessivpronomen
    rationale: „vor seinem Scherer schweigt“ ist als bloße Alternative syntaktisch kein vollständiger Ersatz für die markierte Wortgruppe und „seinem“ ist nicht nötig. Eine vollständige Alternative mit „Scherer“ und eine wörtliche Erklärung des Partizips sind klarer.
