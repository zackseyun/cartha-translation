id: ACT.8.23
reference: Acts 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: de
  text: Denn ich sehe, dass du in der Galle der Bitterkeit und in der Fessel des Unrechts bist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Bindung an das Unrecht“; auch möglich: „in der Fessel der Bosheit“.'
    reason: lexical_alternative
  - marker: b
    text: „Galle der Bitterkeit“ ist ein drastisches Bild, das wahrscheinlich an alttestamentliche Sprache für giftige Bitterkeit erinnert (vgl. 5. Mose 29,17 in der Septuaginta).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: in
  rationale: In Verbindung mit ὁρῶ σε ὄντα bezeichnet εἰς hier den Zustand, in dem Simon sich befindet. Das deutsche „in“ gibt diesen bildlichen Bereich natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die vorangehende Zurechtweisung. „Denn“ bewahrt diese argumentative Verknüpfung.
- source_word: χολὴν πικρίας
  choice: bitterer Galle
  rationale: Die Formulierung bewahrt das drastische Bild der χολή und gibt den Genitiv πικρίας idiomatisch als qualifizierendes Adjektiv wieder, ohne ihn zu bloßer „Bitterkeit“ abzuflachen.
- source_word: σύνδεσμον ἀδικίας
  choice: den Fesseln des Unrechts
  rationale: σύνδεσμος bezeichnet etwas Bindendes oder eine Fessel. Der Plural „Fesseln“ ist im Deutschen ein natürliches Bild für Gefangenschaft; „Unrecht“ lässt bei ἀδικία sowohl moralische Bosheit als auch Ungerechtigkeit anklingen.
- source_word: ὁρῶ
  choice: ich sehe
  rationale: „Ich sehe“ entspricht dem Grundsinn und kann im Deutschen ebenso eine Einsicht oder Wahrnehmung ausdrücken.
- source_word: σε ὄντα
  choice: dass du … bist
  rationale: Die Akkusativ-Partizip-Konstruktion nach ὁρῶ wird im Deutschen natürlich als Inhaltssatz wiedergegeben.
theological_decisions:
- issue: Bildhafte Beschreibung von Simons geistlichem und moralischem Zustand
  choice: Die beiden Bilder bleiben als „in bitterer Galle“ und „in den Fesseln des Unrechts“ erhalten.
  alternative: 'Deutender: „voll bitteren Giftes und von der Sünde gefangen“.'
  rationale: Der griechische Text beschreibt den Zustand in gedrängten Metaphern und erklärt ihn nicht ausdrücklich dogmatisch. Die bildhafte Wiedergabe bewahrt Schärfe und Mehrdeutigkeit.
- issue: Bedeutungsumfang von ἀδικία
  choice: Unrecht
  alternative: Ungerechtigkeit; Bosheit; Sünde
  rationale: „Unrecht“ ist im modernen Deutschen verständlich und hält die moralische wie auch die auf Ungerechtigkeit bezogene Bedeutung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Galle“ und „Fesseln“ bewahren die anschauliche Härte des griechischen Textes; die Satzstellung bleibt klar und gut verständlich.
