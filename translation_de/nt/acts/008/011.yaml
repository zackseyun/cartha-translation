  variant: modern standard German
source:
  edition: SBLGNT
  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: de
  text: Sie schenkten ihm Beachtung, weil er sie lange Zeit mit seinen magischen Künsten[a] in Staunen versetzt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit seiner Zauberei«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: sie hörten auf ihn
  rationale: Das Imperfekt bezeichnet ihre fortdauernde Zuwendung zu Simon. »Auf jemanden hören« gibt im Deutschen sowohl Aufmerksamkeit als auch Beachtung natürlich wieder.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: weil … schon seit geraumer Zeit
  rationale: διά mit substantiviertem Infinitiv nennt den Grund; ἱκανῷ χρόνῳ bezeichnet eine beträchtliche beziehungsweise längere Zeitspanne. »Schon seit geraumer Zeit« ist idiomatisch und wahrt das zeitliche Gewicht.
- source_word: ταῖς μαγείαις
  choice: mit seinen magischen Künsten
  rationale: μαγεία bezeichnet magische Praktiken. Die Formulierung bleibt offen dafür, ob Täuschung, okkulte Betätigung oder beides gemeint ist; »seinen« wird aus dem Kontext ergänzt.
- source_word: ἐξεστακέναι
  choice: in Staunen versetzt hatte
  rationale: Der Perfektinfinitiv von ἐξίστημι beschreibt die zuvor bewirkte und weiterhin relevante Verblüffung. Die Wiedergabe vermeidet die überdeutende Vorstellung, die Menschen seien im wörtlichen Sinn verzaubert worden.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen ist das direkte Objekt zu ἐξεστακέναι und bezieht sich auf die zuvor genannten Menschen.
theological_decisions:
- issue: Art der durch μαγείαις bezeichneten Praktiken Simons
  choice: magische Künste
  alternative: Zauberei; Zauberkünste
  rationale: Der Vers bezeichnet Simons Tätigkeiten als magische Praktiken, legt aber nicht fest, ob sie Betrug, okkulte Wirksamkeit oder beides umfassten. Die Übersetzung lässt diese Frage offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sie hörten auf ihn« ist verständlich und bildet die anhaltende Beachtung idiomatisch ab; »seit geraumer Zeit« bewahrt die gehobene, aber allgemein zugängliche Sprache.
