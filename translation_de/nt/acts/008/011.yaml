  verdict: revise
  source_fidelity: 'Der Kausalsatz gibt διά τὸ mit dem Perfektinfinitiv ἐξεστακέναι sachgerecht wieder: Simons frühere, über einen beträchtlichen Zeitraum ausgeübte magische Praktiken begründen die fortdauernde Aufmerksamkeit der Menschen. »Lange Zeit« entspricht ἱκανῷ χρόνῳ idiomatisch und ohne Abschwächung. »Magische Künste« gibt ταῖς μαγείαις angemessen wieder, ohne die Art der Praktiken näher festzulegen.'
  naturalness: »Sie hörten auf ihn« ist zwar idiomatisch, kann im heutigen Deutsch aber auch bedeuten, dass sie ihm gehorchten oder seinen Anweisungen folgten. »Sie schenkten ihm Beachtung« bezeichnet hier eindeutiger die von προσέχω gemeinte Zuwendung bzw. Aufmerksamkeit und bleibt in modernem Standarddeutsch natürlich. Die Stellung von »lange Zeit« beim verursachenden Vorgang ist zudem klarer als »schon seit geraumer Zeit« mit Plusquamperfekt.
  terminology: »Magische Künste« ist als Wiedergabe von μαγείαις geeignet und wahrt die im Text bestehende Offenheit hinsichtlich Art und tatsächlicher Wirksamkeit der Praktiken. Die Fußnotenalternative »Zauberei« ist möglich, jedoch etwas weniger genau hinsichtlich der pluralischen Praktiken; sie kann als idiomatische Kollektivbezeichnung bestehen bleiben.
