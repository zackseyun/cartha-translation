id: ACT.8.31
reference: Acts 8:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: de
  text: 'Er antwortete: »Wie könnte ich es denn verstehen, wenn mich niemand anleitet?[a]« Dann bat er Philippus eindringlich, aufzusteigen und sich zu ihm zu setzen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn mir niemand den Weg weist?« Das griechische Verb kann sowohl das Führen auf einem Weg als auch die Anleitung zum Verständnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Dann lud er Philippus ein, aufzusteigen und sich zu ihm zu setzen.« Das Verb kann eine eindringliche Bitte oder eine Einladung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Wie könnte ich es denn verstehen
  rationale: Der Optativ mit ἄν drückt eine Möglichkeit beziehungsweise Fähigkeit unter einer Bedingung aus. Das im Deutschen ergänzte »verstehen« ergibt sich aus dem unmittelbaren Zusammenhang, in dem es um das Verständnis der gelesenen Schriftstelle geht.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: wenn mich niemand anleitet
  rationale: ὁδηγέω bedeutet wörtlich »führen, den Weg weisen« und kann hier zugleich die Hinführung zum Verständnis bezeichnen. »Anleiten« bewahrt diese Offenheit besser als die engere Paraphrase »es mir erklären«.
- source_word: παρεκάλεσέν
  choice: bat er … eindringlich
  rationale: παρακαλέω bezeichnet hier eine nachdrückliche Bitte oder Einladung. Die Formulierung gibt die Stärke des Verbs wieder, ohne das übersteigerte »anflehen« zu verwenden.
- source_word: τε
  choice: Dann
  rationale: Die leicht verbindende Partikel markiert hier den Fortgang der Erzählung; »Dann« klingt im modernen Deutschen natürlich.
- source_word: ἀναβάντα
  choice: aufzusteigen
  rationale: ἀναβαίνω bezeichnet das Hinaufsteigen, hier auf den Wagen. Die Übersetzung erhält die räumliche Vorstellung des griechischen Ausdrucks.
- source_word: καθίσαι σὺν αὐτῷ
  choice: sich zu ihm zu setzen
  rationale: Die Wendung mit σύν bedeutet, sich zu jemandem zu setzen beziehungsweise bei ihm Platz zu nehmen, ohne zwingend die genauere Position »neben ihm« festzulegen.
- source_word: Φίλιππον
  choice: Philippus
  rationale: Der Personenname wird in der im deutschen Bibelgebrauch etablierten Form wiedergegeben.
theological_decisions: []
