id: ACT.8.24
reference: Acts 8:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: de
  text: 'Simon aber erwiderte: »Betet ihr für mich zum Herrn, damit nichts von dem, was ihr gesagt habt, über mich kommt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: Simon aber erwiderte
  rationale: Die griechische Verbindung aus Partizip und εἶπεν ist eine idiomatische Redeeinleitung. »Erwiderte« gibt den antwortenden Charakter natürlich wieder; »aber« markiert den leichten Gegensatz zu Petrus’ vorheriger Aufforderung.
- source_word: Δεήθητε ὑμεῖς
  choice: Betet ihr
  rationale: Der Imperativ bezeichnet hier eine an den Herrn gerichtete Bitte. Das ausdrücklich gesetzte ὑμεῖς wird durch »ihr« bewahrt und betont, dass Simon die Apostel zum Gebet auffordert.
- source_word: ὑπὲρ ἐμοῦ
  choice: für mich
  rationale: ὑπέρ mit Genitiv bezeichnet hier Fürbitte beziehungsweise stellvertretendes Eintreten; »für mich« ist die natürliche deutsche Wiedergabe.
- source_word: πρὸς τὸν κύριον
  choice: zum Herrn
  rationale: πρός bezeichnet nach dem Gebetsverb die Ausrichtung der Bitte. »Zum Herrn beten« ist im Deutschen idiomatisch und lässt den Referenten von κύριος so offen wie der Ausgangstext.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: damit nichts … über mich kommt
  rationale: »Damit« bewahrt den Ziel- beziehungsweise Ergebnisbezug. »Über mich kommt« erhält das Bild eines hereinbrechenden Unheils oder Gerichts, ohne dieses ausdrücklich hinzuzufügen.
- source_word: ὧν εἰρήκατε
  choice: von dem, was ihr gesagt habt
  rationale: Die genitivische Relativkonstruktion wird im Deutschen natürlich mit »von dem, was« wiedergegeben. Das Perfekt »gesagt habt« bewahrt die fortdauernde Relevanz der vorausgehenden Worte.
theological_decisions:
- issue: Referent von τὸν κύριον
  choice: »zum Herrn« ohne nähere Bestimmung
  alternative: »zu Gott« oder »zum Herrn Jesus«
  rationale: Der griechische Text nennt nur »den Herrn«. Da κύριος in der Apostelgeschichte je nach Zusammenhang Gott oder Jesus bezeichnen kann und dieser Vers keine eindeutige Präzisierung verlangt, bleibt die Offenheit des Ausgangstextes erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung »Betet ihr« bewahrt die ausdrückliche Betonung des griechischen Personalpronomens, ohne unnatürlich zu wirken. Es ist keine Fußnote nötig; die genitivische Wendung lässt sich im Haupttext zugleich genau und idiomatisch wiedergeben.
