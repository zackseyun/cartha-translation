  text: ἀποκριθεὶς δὲ ὁ εὐνοῦχος τῷ Φιλίππῳ εἶπεν· Δέομαί σου, περὶ τίνος ὁ προφήτης λέγει ⸀τοῦτο; περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: de
  text: 'Da erwiderte der Eunuch Philippus: »Ich bitte dich[a]: Von wem sagt der Prophet das? Von sich selbst oder von jemand anderem?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich flehe dich an.« Der griechische Ausdruck bezeichnet eine respektvolle Bitte und kann auch mit stärkerer Dringlichkeit verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν
  choice: Da wandte sich … an … und sagte
  rationale: Die Verbindung aus Partizip und Redeverb leitet idiomatisch die Reaktion des Eunuchen ein. Die deutsche Formulierung gibt den Gesprächsanschluss natürlich wieder, ohne das in diesem Zusammenhang schwerfällige »antwortete und sagte« nachzubilden.
- source_word: ὁ εὐνοῦχος
  choice: der Eunuch
  rationale: Die konkrete Bezeichnung wird beibehalten und nicht zum allgemeineren »Hofbeamten« abgeschwächt.
- source_word: τῷ Φιλίππῳ
  choice: an Philippus
  rationale: Der Dativ bezeichnet den Adressaten. In Verbindung mit »wandte sich« ist »an Philippus« natürliches Deutsch.
- source_word: Δέομαί σου
  choice: Ich bitte dich
  rationale: Die Wendung bezeichnet eine respektvolle, gegebenenfalls dringliche Bitte. »Ich bitte dich« bewahrt diesen Ton, ohne ihn unnötig zu verstärken.
- source_word: περὶ τίνος
  choice: Von wem
  rationale: Im Deutschen fragt man in Verbindung mit »von jemandem sprechen« idiomatisch »Von wem?«. Der Personenbezug bleibt eindeutig.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: spricht der Prophet hier
  rationale: Das demonstrative τοῦτο verweist auf die unmittelbar zuvor gelesene Schriftstelle. »hier« gibt diesen Textbezug im Deutschen natürlich wieder.
- source_word: περὶ ἑαυτοῦ
  choice: von sich selbst
  rationale: Das Reflexivpronomen bezieht sich eindeutig auf den Propheten und wird direkt wiedergegeben.
- source_word: περὶ ἑτέρου τινός
  choice: von jemand anderem
  rationale: Die Formulierung bewahrt den offenen Gegensatz zwischen dem Propheten selbst und einer anderen, nicht näher bestimmten Person.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert; »Eunuch« und die offene Frage nach der Identität der beschriebenen Person bleiben ohne interpretierende Auflösung erhalten.
