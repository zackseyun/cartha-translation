  naturalness: Die Formulierung ist insgesamt flüssiges modernes Standarddeutsch. »Der Eunuch erwiderte Philippus« ist eine natürliche, knappe Wiedergabe der griechischen Verbindung von Antwortpartizip und Redeverb und vermeidet eine im Deutschen unnötig doppelte Formel wie »antwortete ... und sagte«.
  terminology: »Eunuch«, »Philippus«, »Prophet« und die nicht interpretierend offene Gegenüberstellung »von sich selbst oder von jemand anderem« sind angemessen. Die Fußnote zu »Ich bitte dich« bietet eine vertretbare stärkere lexikalische Alternative, ohne eine theologische Deutung einzutragen.
