id: ACT.8.9
reference: Acts 8:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: de
  text: Ein Mann namens Simon hatte schon vorher in der Stadt Magie betrieben und das Volk von Samarien[a] in Staunen versetzt. Dabei sagte er, er selbst sei jemand Großes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Bevölkerung Samariens«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »er sei eine bedeutende Persönlichkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Ein Mann
  rationale: Ἀνήρ bezeichnet ausdrücklich einen Mann; τις führt ihn unbestimmt als neue Figur ein. Das schwach weiterführende δέ wird im Deutschen durch den Erzählanschluss getragen, ohne ein künstliches »nun« einzufügen.
- source_word: ὀνόματι Σίμων
  choice: namens Simon
  rationale: Natürliche deutsche Wiedergabe des Dativs ὀνόματι mit dem Eigennamen.
- source_word: προϋπῆρχεν
  choice: hatte schon vorher
  rationale: Gibt die zeitliche Vorordnung und den durativen Hintergrund des Imperfekts wieder, ohne eine übergenaue Dauer festzulegen.
- source_word: ἐν τῇ πόλει
  choice: in der Stadt
  rationale: Schlichte lokale Wiedergabe; der Artikel verweist auf die im Kontext genannte Stadt.
- source_word: μαγεύων
  choice: Magie betrieben
  rationale: Bezeichnet die Ausübung magischer Künste. Die Formulierung ist modern und wertet die metaphysische Quelle nicht über den griechischen Text hinaus aus.
- source_word: ἐξιστάνων
  choice: in Staunen versetzt
  rationale: Gibt die kausative Bedeutung von ἐξίστημι verständlich wieder und bewahrt die fortgesetzte Wirkung der Tätigkeit.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: das Volk von Samarien
  rationale: ἔθνος bezeichnet hier die Bevölkerung als Gesamtheit; »Volk« ist weniger politisch verengt als »Nation«.
- source_word: λέγων
  choice: Dabei sagte er
  rationale: Leitet Simons Selbstdarstellung ein; »dabei« verbindet das Partizip natürlich mit den fortlaufenden Tätigkeiten.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: er selbst sei jemand Großes
  rationale: »er selbst« bewahrt die Hervorhebung durch ἑαυτόν; »jemand Großes« gibt τινα ... μέγαν natürlich wieder, ohne den selbstüberhöhenden Anspruch abzuschwächen.
theological_decisions:
- issue: Charakterisierung von Simons Tätigkeit
  choice: »Magie betrieben«
  alternative: »Zauberei betrieben«
  rationale: Der Vers beschreibt magische Betätigung, bestimmt aber weder deren genaue Art noch ausdrücklich ihre metaphysische Quelle. Die Übersetzung fügt daher keine weitergehende theologische Deutung hinzu.
- issue: Simons Selbstanspruch
  choice: »er selbst sei jemand Großes«
  alternative: »er sei ein großer Mann«
  rationale: Die gewählte Fassung bewahrt die eigentümlich unbestimmte Formulierung τινα ... μέγαν und die ausdrückliche Selbstbetonung, statt den Anspruch genauer festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden griechischen Partizipien werden zur besseren Lesbarkeit teils verbal aufgelöst. »Magie« bleibt sachlich und vermeidet sowohl verharmlosende Unterhaltungssprache als auch eine über den Vers hinausgehende dogmatische Einordnung.
