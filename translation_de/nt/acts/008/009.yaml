review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes zuverlässig wieder: die unbestimmte Einführung eines Mannes namens Simon, seine schon zuvor bestehende Präsenz in der Stadt, das Ausüben magischer Künste, das fortgesetzte Versetzen der Bevölkerung Samariens in Staunen sowie seinen selbstüberhöhenden Anspruch. Die Wiedergabe von προϋπῆρχεν mit „hatte schon vorher“ ist im erzählerischen Kontext angemessen.'
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die Auflösung der Partizipien in „und … Dabei sagte er“ ist gut lesbar und bewahrt den Zusammenhang der Handlungen. „jemand Großes“ ist leicht markiert, aber gerade deshalb eine passende, idiomatisch noch natürliche Wiedergabe der bewusst unbestimmten Selbstzuschreibung.
  terminology: „Magie betrieben“ ist eine sachliche und zeitgemäße Wiedergabe von μαγεύων, ohne eine im Vers nicht ausdrücklich formulierte metaphysische oder dogmatische Bewertung einzutragen. „Volk von Samarien“ gibt τὸ ἔθνος τῆς Σαμαρείας angemessen wieder. Der Name Simon und die Ortsbezeichnung Samarien sind korrekt.
