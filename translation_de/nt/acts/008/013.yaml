id: ACT.8.13
reference: Acts 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: de
  text: Auch Simon selbst glaubte. Nachdem er getauft worden war, blieb er beständig bei Philippus. Als er die Zeichen und großen machtvollen Taten[a] geschehen sah, war er außer sich vor Staunen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „großen Wundern“. Das griechische Wort bezeichnet machtvolle Taten oder Wirkungen und kann hier Wunder meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: auch … selbst
  rationale: 'Die Wiedergabe erhält sowohl die additive Kraft von καί als auch die Hervorhebung durch αὐτός: Auch Simon reagierte auf die Verkündigung.'
- source_word: ἐπίστευσεν
  choice: glaubte
  rationale: Die schlichte Wiedergabe entspricht dem Aorist von πιστεύω und legt nicht fest, wie Simons Glaube im Licht des weiteren Erzählverlaufs theologisch zu beurteilen ist.
- source_word: βαπτισθεὶς
  choice: nachdem er getauft worden war
  rationale: Der vorzeitige temporale Nebensatz gibt das passive Aoristpartizip natürlich wieder und macht die Abfolge vor seinem anhaltenden Bleiben bei Philippus deutlich.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: blieb er beständig bei Philippus
  rationale: Die Umschreibung mit Imperfekt und Partizip bezeichnet fortdauerndes Verhalten. Die Formulierung wahrt die anhaltende Nähe zu Philippus, ohne eine stärkere geistliche Hingabe hineinzulesen.
- source_word: θεωρῶν
  choice: als er … geschehen sah
  rationale: Der temporale Nebensatz bringt das gleichzeitige, fortlaufende Beobachten idiomatisch zum Ausdruck und verbindet es mit Simons Staunen.
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ ist die etablierte und semantisch passende Wiedergabe, die den hinweisenden Charakter des Begriffs bewahrt.
- source_word: δυνάμεις μεγάλας
  choice: große Machttaten
  rationale: „Machttaten“ bezeichnet konkrete machtvolle Wirkungen, ohne den Ausdruck vorschnell auf den engeren deutschen Begriff „Wunder“ zu reduzieren.
- source_word: γινομένας
  choice: geschehen
  rationale: Das Verb beschreibt die Zeichen und Machttaten als Ereignisse, die sich vor Simons Augen vollzogen.
- source_word: ἐξίστατο
  choice: war er außer sich vor Staunen
  rationale: Die Formulierung erhält die starke Bedeutung von ἐξίστημι und den fortdauernden Charakter des Imperfekts in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Ob Simons Glaube als echte Bekehrung oder nur als äußerliches Bekenntnis zu kennzeichnen ist
  choice: ἐπίστευσεν ohne wertende Ergänzung mit „glaubte“ wiedergeben
  alternative: „kam wirklich zum Glauben“, „bekannte sich zum Glauben“ oder „glaubte nur oberflächlich“
  rationale: Der Vers sagt, dass Simon glaubte und getauft wurde; der weitere Erzählverlauf wirft jedoch Fragen nach seinem inneren Zustand auf. Die Übersetzung bewahrt diese Spannung, statt sie dogmatisch zu entscheiden.
- issue: Ob δυνάμεις μεγάλας ausdrücklich als Wunder festgelegt werden soll
  choice: „große Machttaten“
  alternative: „große Wunder“
  rationale: Der griechische Ausdruck kann machtvolle Taten beziehungsweise Wirkungen bezeichnen und in diesem Zusammenhang Wunder einschließen. „Machttaten“ hält den Machtaspekt ausdrücklich fest und lässt den Kontext die Art der Ereignisse bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze sorgen für Klarheit; „beständig“, „Machttaten“ und „außer sich vor Staunen“ bewahren zugleich den gehobenen biblischen Erzählton. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, den die Anmerkung erläutert.
