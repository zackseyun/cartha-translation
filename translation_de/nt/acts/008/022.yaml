source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: de
  text: Kehre also um von dieser deiner Bosheit und bete zum Herrn; vielleicht wird dir die Absicht deines Herzens vergeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανόησον
  choice: Bereue
  rationale: Der Aoristimperativ ruft zu einer entschiedenen Umkehr auf. „Bereue“ gibt den moralisch-geistlichen Ernst knapp und im Zusammenhang mit dem folgenden ἀπό idiomatisch wieder.
- source_word: οὖν
  choice: also
  rationale: Das Wort kennzeichnet die Folgerung aus der unmittelbar vorausgehenden Zurechtweisung; „also“ ist im heutigen Deutsch klar und natürlich.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: diese Bosheit von dir
  rationale: κακία bezeichnet hier moralische Schlechtigkeit. „Bosheit“ bewahrt diese Wertung, während „von dir“ den betonten Besitzbezug von σου erhält.
- source_word: δεήθητι
  choice: bitte
  rationale: Das Verb bezeichnet eine ernsthafte Bitte. „Bitte den Herrn“ ist im religiösen Kontext natürlich, ohne die Intensität durch ein möglicherweise überstarkes „anflehen“ festzulegen.
- source_word: τοῦ κυρίου
  choice: den Herrn
  rationale: κύριος wird als „Herr“ wiedergegeben. Der Text muss nicht näher bestimmen, ob der Bezug hier ausdrücklich auf Jesus oder allgemeiner auf Gott als Herrn zielt.
- source_word: εἰ ἄρα
  choice: ob dir vielleicht
  rationale: Die Verbindung drückt eine vorsichtige Möglichkeit aus. „Ob … vielleicht“ erhält die bedingte, nicht garantierende Formulierung.
- source_word: ἀφεθήσεταί σοι
  choice: dir … vergeben wird
  rationale: Das Futur Passiv bewahrt Gott als unausgesprochenen Urheber der Vergebung. Im durch εἰ ἄρα eingeleiteten Satz bleibt die Vergebung als erhoffte Möglichkeit formuliert.
- source_word: ἡ ἐπίνοια
  choice: die Absicht
  rationale: ἐπίνοια kann Gedanke, Absicht oder Plan bedeuten. Im Zusammenhang bezeichnet „Absicht“ passend die innere, willentliche Ausrichtung hinter Simons Handeln; die offenere Alternative wird in der Fußnote genannt.
- source_word: τῆς καρδίας σου
  choice: deines Herzens
  rationale: Die formnahe Wiedergabe erhält das biblische Bild des Herzens als Zentrum des inneren Wollens und Denkens.
theological_decisions:
- issue: Grad der Gewissheit einer möglichen Vergebung
  choice: Petrus fordert Simon zur Umkehr und zum Gebet auf, formuliert die mögliche Vergebung aber vorsichtig und ohne Zusicherung.
  alternative: Die Aussage könnte als sichere Verheißung der Vergebung bei erfolgter Umkehr oder als Hinweis auf nahezu ausgeschlossene Vergebung verstanden werden.
  rationale: εἰ ἄρα mit dem Futur Passiv ist bewusst zurückhaltend. „Ob … vielleicht“ bewahrt die Spannung zwischen Hoffnung auf Vergebung und fehlender ausdrücklicher Garantie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Formulierung „ob dir vielleicht … vergeben wird“ wurde beibehalten, um die vorsichtige Bedingtheit des griechischen Ausdrucks nicht in eine sichere Zusage umzudeuten.
