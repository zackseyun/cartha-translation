  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: de
  text: Doch fromme Männer bestatteten Stephanus[a] und hielten eine große Totenklage um ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „brachten Stephanus zur Bestattung weg“ oder „überführten seinen Leichnam zur Bestattung“. Das griechische Verb kann neben der Bestattung selbst auch das Wegbringen beziehungsweise die Überführung des Leichnams betonen.'
    reason: lexical_alternative
  - marker: b
    text: Die „große Totenklage“ kann laute und öffentliche Trauerbekundungen einschließen, nicht nur inneren Schmerz.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: bestatteten
  rationale: Das Verb bezeichnet hier den fürsorglichen Umgang mit dem Leichnam des Stephanus und kann das Wegtragen beziehungsweise die Vorbereitung zur Bestattung einschließen. „Bestatteten“ gibt im Deutschen den aus dem Zusammenhang naheliegenden Endpunkt natürlich wieder, während die Fußnote die Bedeutungsbreite wahrt.
- source_word: δέ
  choice: Doch
  rationale: δέ markiert hier einen milden Übergang mit einem gewissen Kontrast zum vorausgehenden gewaltsamen Tod des Stephanus. „Doch“ bewahrt diese Nuance, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: ἄνδρες εὐλαβεῖς
  choice: gottesfürchtige Männer
  rationale: ἄνδρες ist ausdrücklich maskulin; „Männer“ bildet dies ab. εὐλαβεῖς bezeichnet religiöse Ehrfurcht oder Frömmigkeit, wofür „gottesfürchtig“ im Kontext natürlich und würdig ist.
- source_word: ἐποίησαν κοπετὸν μέγαν
  choice: hielten eine große Totenklage
  rationale: ἐποίησαν bildet mit κοπετόν eine idiomatische Verbindung. „Eine Totenklage halten“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „machen“ und bringt den öffentlichen, hörbaren Ausdruck der Trauer zum Ausdruck.
- source_word: ἐπ’ αὐτῷ
  choice: um ihn
  rationale: Bei einem Ausdruck der Trauer bezeichnet ἐπί mit Dativ die Person, der die Klage gilt. Das Deutsche sagt idiomatisch „um ihn“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Totenklage“ ist präzise und macht den äußeren Charakter von κοπετός deutlicher als das allgemeinere „Trauer“. Die Satzstellung bleibt knapp und erzählerisch.
