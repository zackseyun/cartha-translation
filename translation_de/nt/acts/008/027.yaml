id: ACT.8.27
reference: Acts 8:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: de
  text: Da stand er auf und ging. Und siehe, da war ein äthiopischer Mann, ein Eunuch[a] und hoher Beamter der Kandake[b], der Königin der Äthiopier. Er war für ihre gesamte Schatzkammer verantwortlich und war nach Jerusalem gekommen, um anzubeten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hofbeamter“. Das griechische Wort kann in manchen Zusammenhängen einen königlichen Amtsträger bezeichnen; hier ist wahrscheinlich die wörtliche Bedeutung „Eunuch“ gemeint.'
    reason: lexical_alternative
  - marker: b
    text: „Kandake“ war möglicherweise kein persönlicher Name, sondern ein dynastischer Titel der Königin.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand … auf
  rationale: Das vorangestellte Aoristpartizip bezeichnet die Handlung, die dem Gehen vorausgeht; „stand auf“ ist natürliches modernes Deutsch.
- source_word: ἐπορεύθη
  choice: ging
  rationale: Die schlichte Erzählform gibt das häufige Bewegungsverb unmittelbar und ohne unnötige Präzisierung wieder.
- source_word: ἰδοὺ
  choice: siehe
  rationale: Der ausdrückliche Aufmerksamkeitsruf des griechischen Textes bleibt erhalten; „siehe“ passt zum gehobenen, aber verständlichen biblischen Erzählstil.
- source_word: ἀνὴρ Αἰθίοψ
  choice: ein äthiopischer Mann
  rationale: Die Wiedergabe bewahrt sowohl ἀνήρ („Mann“) als auch die Herkunftsbezeichnung.
- source_word: εὐνοῦχος
  choice: Eunuch
  rationale: Dies ist die primäre konkrete Bedeutung. Die Amtsstellung wird bereits durch δυνάστης ausgedrückt; die mögliche weitere Bedeutung „Hofbeamter“ wird in einer Fußnote genannt.
- source_word: δυνάστης
  choice: hoher Beamter
  rationale: Die Formulierung vermittelt die bedeutende Macht- und Amtsstellung, ohne den Mann als eigenständigen Herrscher darzustellen.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: der Kandake, der Königin der Äthiopier
  rationale: „Kandake“ folgt der griechischen Namensform; die Apposition und der pluralische Volksname werden bewahrt. Eine Fußnote weist auf die mögliche Funktion als Herrschertitel hin.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: für ihre gesamte Schatzkammer verantwortlich
  rationale: Die idiomatische deutsche Amtsformulierung gibt ἐπὶ als Zuständigkeitsverhältnis und γάζα als Schatzkammer beziehungsweise Schatzverwaltung wieder.
- source_word: ἐληλύθει
  choice: war … gekommen
  rationale: Das Plusquamperfekt wahrt die Vorzeitigkeit gegenüber der erzählten Begegnung.
- source_word: προσκυνήσων
  choice: um anzubeten
  rationale: Das Futurpartizip drückt hier den Zweck seiner Reise aus.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Dies ist die natürliche deutsche Richtungsangabe bei einer Reise zu einer Stadt.
theological_decisions:
- issue: Ob εὐνοῦχος konkret als „Eunuch“ oder allgemein als „Hofbeamter“ wiederzugeben ist
  choice: Im Haupttext steht „Eunuch“.
  alternative: Hofbeamter
  rationale: Die konkrete Bedeutung ist lexikalisch vorrangig und kann für die soziale und körperliche Stellung des Mannes erzählerisch bedeutsam sein. Da δυνάστης seine hohe Amtsstellung eigens bezeichnet, würde „Hofbeamter“ bei εὐνοῦχος die mögliche konkrete Aussage unnötig abschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit leicht gehobenem Erzählton. „Und siehe“ bewahrt bewusst den lukanischen Aufmerksamkeitsmarker. Die längere griechische Satzperiode wurde für bessere deutsche Lesbarkeit in drei Sätze gegliedert, ohne ihre Aussagefolge zu verändern.
