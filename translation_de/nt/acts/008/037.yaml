  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: de
  text: 'Philipp[a] sagte: „Wenn du von ganzem Herzen glaubst, darfst du.“ Da antwortete er: „Ich glaube, dass Jesus Christus der Sohn Gottes ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter Papyrushandschriften aus dem 3. Jahrhundert sowie der Codex Sinaiticus und der Codex Vaticanus aus dem 4. Jahrhundert, und auch in frühen koptischen Übersetzungen. Er ist in der byzantinischen Mehrheitstradition und in der lateinischen Überlieferung bezeugt; außerdem wurde er bereits im späten 2. Jahrhundert von Kirchenvätern wie Irenäus und Cyprian angeführt. Häufig gilt er als frühe Taufformel, die später in den Erzähltext der Apostelgeschichte aufgenommen wurde.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: ist es erlaubt
  rationale: Das unpersönliche Verb bezeichnet hier, dass die erbetene Taufe gestattet ist. Die Formulierung bleibt nahe am Griechischen und lässt den im Zusammenhang ergänzten Bezug auf die Taufe erkennbar.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche biblische Wendung gibt den Gedanken ungeteilter Aufrichtigkeit und Hingabe natürlich wieder.
- source_word: Πιστεύω
  choice: Ich glaube
  rationale: Im Bekenntnis bezeichnet das Verb gläubige Zustimmung zu der Aussage über die Identität Jesu.
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: Jesus Christus
  rationale: Die Wiedergabe bewahrt die griechische Wortfolge und die im Deutschen fest etablierte Bezeichnung; Χριστός trägt zugleich die Bedeutung „Messias/der Gesalbte“.
theological_decisions:
- issue: Textkritischer Status des gesamten Verses
  choice: Der Vers wird entsprechend der vorgegebenen byzantinischen Ausgangsausgabe im Haupttext wiedergegeben und mit einer textkritischen Fußnote versehen.
  alternative: Den Vers aus dem Haupttext auslassen oder in Klammern setzen.
  rationale: Der Vers gehört zum gewählten griechischen Ausgangstext, fehlt jedoch in den frühesten erhaltenen griechischen Zeugen. Die Fußnote macht diese bedeutsame Überlieferungslage transparent, ohne sie stillschweigend zu entscheiden.
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: Messias
  rationale: „Christus“ erhält die syntaktische Form von Ἰησοῦν Χριστόν und die traditionelle deutsche Bezeichnung. Die messianische Titelbedeutung bleibt dabei enthalten, ohne den griechischen Ausdruck als erklärende Apposition umzuformen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Von ganzem Herzen“ ist bewusst idiomatisch; „ist es erlaubt“ bewahrt den unpersönlichen Charakter von ἔξεστιν. Die wiederholte Redeeinleitung des Griechischen wird natürlich, aber noch erkennbar mit „Da antwortete er“ wiedergegeben.
