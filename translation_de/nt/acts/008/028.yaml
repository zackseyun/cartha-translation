  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: de
  text: Er war auf dem Rückweg, saß auf seinem Wagen und las[a] im Propheten Jesaja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „las laut“. In der Antike wurde häufig laut gelesen; das griechische Verb sagt dies hier jedoch nicht ausdrücklich.'
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Er war auf dem Rückweg
  rationale: Die Verbindung aus ἦν und Präsenspartizip bezeichnet eine im Gang befindliche Handlung in der Vergangenheit. „War auf dem Rückweg“ gibt dies natürlich wieder, ohne das im Zusammenhang naheliegende, aber nicht ausdrücklich genannte Ziel hinzuzufügen. Das schwach verbindende τέ wird durch den fortlaufenden deutschen Satzbau aufgenommen.
- source_word: καθήμενος
  choice: saß
  rationale: Das Partizip beschreibt seine Haltung während der Fahrt. Das finite „saß“ ist im Deutschen natürlich und erhält den gleichzeitigen Handlungsverlauf.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: in seinem Wagen
  rationale: ἐπί mit Genitiv ist räumlich wörtlich „auf“, doch bei einem Fahrzeug entspricht „in seinem Wagen“ dem natürlichen deutschen Ausdruck. „Wagen“ vermeidet die irreführend militärische Festlegung, die „Streitwagen“ nahelegen könnte.
- source_word: ἀνεγίνωσκεν
  choice: las
  rationale: Der Imperfekt bezeichnet fortdauerndes Lesen. Im Deutschen kann das Präteritum in dieser Erzählung den Verlauf natürlich ausdrücken. Da das Verb hier nicht ausdrücklich „laut“ bedeutet, wird dies nicht in den Haupttext aufgenommen.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: den Propheten Jesaja
  rationale: 'Die Formulierung folgt der griechischen Wortfolge und bewahrt die antike, im Deutschen verständliche metonymische Redeweise: Gelesen wird die Schrift des Propheten.'
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil mit knapper Satzfolge. „Wagen“ ist allgemeinverständlich und historisch weniger festlegend als „Streitwagen“. Die Formulierung „den Propheten Jesaja lesen“ bewahrt die Nähe zum griechischen Ausdruck, ohne eine theologische Deutung hinzuzufügen.
