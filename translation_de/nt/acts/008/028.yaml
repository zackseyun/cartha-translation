revisions:
- from: Er war auf dem Rückweg, saß in seinem Wagen und las den Propheten Jesaja.[a]
  to: Er war auf dem Rückweg, saß auf seinem Wagen und las[a] im Propheten Jesaja.
  rationale: Die Revision stellt die räumliche Nuance von ἐπί mit Genitiv wieder her, ersetzt die im Deutschen weniger natürliche Objektkonstruktion durch die idiomatische Buchbezeichnung „im Propheten Jesaja“ und verlegt den Fußnotenanker zum Verb, auf das sich der Hinweis bezieht. Aussagegehalt, Aspekt und Register bleiben erhalten.
