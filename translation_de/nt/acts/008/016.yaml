  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: de
  text: Denn er war noch nicht auf einen von ihnen gefallen; sie waren nur auf den Namen des Herrn Jesus getauft worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: in den Namen des Herrn Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: noch … nicht / noch auf keinen
  rationale: Die zeitliche Bedeutung „noch nicht“ wird zusammen mit dem verneinten Ausdruck „auf keinen“ natürlich wiedergegeben.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: auf keinen von ihnen
  rationale: Die Präposition ἐπί mit Dativ bezeichnet hier das Kommen auf Personen und bewahrt die räumliche Bildsprache.
- source_word: ἐπιπεπτωκός
  choice: gefallen
  rationale: Die Wiedergabe erhält das für das Wirken des Heiligen Geistes in der Apostelgeschichte verwendete Bild des „Fallens auf“ und entspricht dem resultativen Perfekt.
- source_word: μόνον
  choice: nur
  rationale: „Nur“ gibt die Einschränkung und den Gegensatz knapp und idiomatisch wieder.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: sie waren … getauft worden
  rationale: Die periphrastische Konstruktion bezeichnet eine vorausgegangene Taufe mit fortbestehendem Ergebnis; das deutsche Plusquamperfekt Passiv gibt dies natürlich wieder.
- source_word: εἰς τὸ ὄνομα
  choice: auf den Namen
  rationale: „Auf den Namen taufen“ ist im Deutschen eine natürliche, traditionsnahe Taufformulierung; eine stärker formale Wiedergabe von εἰς wird in der Fußnote erhalten.
- source_word: κυρίου Ἰησοῦ
  choice: des Herrn Jesus
  rationale: Die Titelform wird im Deutschen natürlich und vollständig wiedergegeben.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐπιπεπτωκός
  choice: Das Pronomen „er“ verweist auf den im vorherigen Vers genannten Heiligen Geist.
  alternative: Das Subjekt ausdrücklich als „der Heilige Geist“ wiederholen.
  rationale: Der griechische Text lässt das Subjekt unausgesprochen, doch der unmittelbare Kontext macht den Bezug eindeutig. Das Pronomen bewahrt die textliche Verknüpfung, ohne eine erklärende Wiederholung einzufügen.
- issue: Formulierung der Taufe
  choice: „auf den Namen des Herrn Jesus“
  alternative: „in den Namen des Herrn Jesus hinein“
  rationale: Der Vers verbindet die Taufe mit dem Namen Jesu, entscheidet aber keine späteren Lehrfragen zur Taufformel. Die Hauptfassung ist idiomatisches Deutsch; die Fußnote bewahrt die Richtungsaussage von εἰς.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur und die Bildsprache des griechischen Textes bleiben weitgehend erhalten; die Taufformulierung wird idiomatisch wiedergegeben.
