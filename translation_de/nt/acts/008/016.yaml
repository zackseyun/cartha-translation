- from: Denn er war noch auf keinen von ihnen gefallen; sie waren nur auf den Namen des Herrn Jesus getauft worden.[a]
  to: Denn er war noch nicht auf einen von ihnen gefallen; sie waren nur auf den Namen des Herrn Jesus getauft worden.[a]
  rationale: Die Revision verdeutlicht οὐδέπω mit der im Deutschen regulären Folge ‚noch nicht‘ und präzisiert die Fußnote zu εἰς, ohne die Bildsprache, den impliziten Bezug auf den Heiligen Geist oder die Bedeutung der Taufformulierung zu verändern.
