review_pass:
  verdict: revise
  source_fidelity: Die Hauptfassung gibt die zeitliche Verneinung, das Bild des ‚Fallens auf‘, die Einschränkung durch μόνον sowie die vorausliegende Taufe zutreffend wieder. Das im Deutschen nachgestellte ‚noch‘ kann jedoch weniger klar als die griechische Verbindung οὐδέπω ausfallen; ‚noch nicht‘ stellt den zeitlichen Sinn unmittelbar her.
  naturalness: ‚Denn er war noch nicht auf einen von ihnen gefallen‘ ist modernes, würdiges Standarddeutsch und bringt die deutsche Verneinung idiomatischer zur Geltung als ‚war noch auf keinen ... gefallen‘. Die Satzfügung bleibt knapp und dem Original nahe.
  terminology: ‚Herr Jesus‘ und ‚auf den Namen ... getauft‘ sind angemessen und traditionsnah, ohne spätere theologische Folgerungen einzutragen. Die Fußnote sollte die Richtungsbedeutung von εἰς präzise, aber ohne das im Deutschen überstarke ‚hinein‘ angeben.
  issues:
  - severity: low
    issue: Die Stellung von ‚noch‘ in ‚er war noch auf keinen von ihnen gefallen‘ ist potenziell weniger eindeutig als ‚noch nicht‘.
    rationale: οὐδέπω bedeutet ausdrücklich ‚noch nicht‘. Die revidierte Stellung macht die zeitliche Negation im modernen Deutsch unmittelbar transparent.
  - severity: low
    issue: Die Fußnote verwendet ‚in den Namen ... hinein‘ als angeblich wörtlichere Alternative.
    rationale: ‚Hinein‘ verstärkt die Richtung im Deutschen über das von εἰς allein Geforderte hinaus und klingt hier unnötig schwerfällig. ‚in den Namen‘ wahrt die formale Alternative genauer.
  revised_text: Denn er war noch nicht auf einen von ihnen gefallen; sie waren nur auf den Namen des Herrn Jesus getauft worden.[a]
