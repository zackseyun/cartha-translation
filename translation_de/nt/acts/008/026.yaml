source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: de
  text: 'Aber ein Engel des Herrn sprach zu Philippus: »Steh auf und geh nach Süden[a] zu der Straße, die von Jerusalem nach Gaza hinabführt.« Diese Straße ist menschenleer.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen Mittag«. Der griechische Ausdruck kann sowohl eine Richtung (»nach Süden«) als auch eine Zeit (»um die Mittagszeit«) bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Dies ist Wüste«; möglicherweise ist gemeint, dass die Straße durch ein Wüstengebiet führt, statt dass sie selbst menschenleer ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: Ein Engel des Herrn aber
  rationale: Der artikellose Singular wird natürlich unbestimmt wiedergegeben. »Engel« passt zur göttlichen Führung im Erzählzusammenhang; δέ wird mit dem dezenten Anschlusswort »aber« bewahrt.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: 'sprach zu Philippus:'
  rationale: »Sprach zu« gibt λαλέω mit πρός natürlich wieder. Der Doppelung »sprach … und sagte« wird durch den Doppelpunkt vermieden, der die Funktion des Partizips λέγων idiomatisch ausdrückt.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Steh auf und geh
  rationale: Die beiden Imperative werden unmittelbar, klar und in heutigem Deutsch wiedergegeben.
- source_word: κατὰ μεσημβρίαν
  choice: nach Süden
  rationale: Bei einem Bewegungsverb ist die Richtungsangabe wahrscheinlich; die ebenfalls mögliche Zeitangabe »gegen Mittag« bleibt in einer Fußnote erhalten.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: zu der Straße
  rationale: Gibt die Bewegung auf eine bestimmte Straße zu in natürlichem Deutsch wieder.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: die von Jerusalem nach Gaza hinabführt
  rationale: »Hinabführt« bewahrt die geografische Vorstellung des Abstiegs von Jerusalem, ohne unnatürlich zu klingen.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Diese Straße ist menschenleer.
  rationale: Das feminine αὕτη bezieht sich wahrscheinlich auf ὁδός. »Menschenleer« gibt ἔρημος als verlassen beziehungsweise unbewohnt wieder; die mögliche Deutung als Wüstenstrecke wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von »Herr« in »Engel des Herrn«
  choice: Die Wendung wird als »ein Engel des Herrn« wiedergegeben, ohne die Gestalt näher zu bestimmen.
  alternative: Ein von Gott gesandter Engel; der Engel des Herrn als besondere Offenbarungsgestalt
  rationale: Der Text bezeichnet den Boten durch seine Zugehörigkeit zum beziehungsweise Sendung durch den Herrn, legt aber keine weitergehende Identifikation fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Rede. »Philippus« folgt der im Deutschen etablierten biblischen Namensform. Die echten Mehrdeutigkeiten von μεσημβρία und ἔρημος werden nicht im Haupttext überladen, sondern transparent in den Fußnoten erhalten.
