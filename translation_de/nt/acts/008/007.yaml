  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: de
  text: Denn aus vielen, die unreine Geister hatten, fuhren die unreinen Geister unter lautem Geschrei aus; und viele Gelähmte und Menschen mit Gehbehinderung wurden geheilt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: Denn aus vielen, die … hatten
  rationale: γάρ bewahrt den begründenden Anschluss an den vorherigen Vers. Die im Griechischen gedrängte Genitivkonstruktion wird im Deutschen so entfaltet, dass die betroffenen Menschen und das Ausfahren aus ihnen klar erkennbar sind.
- source_word: πνεύματα ἀκάθαρτα
  choice: unreine Geister
  rationale: Dies ist die geläufige und sachlich genaue Wiedergabe für dämonische Geister im biblischen Erzählzusammenhang.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: mit lautem Geschrei
  rationale: Die Formulierung gibt sowohl das laute Rufen als auch dessen Nachdruck idiomatisch wieder und bezieht es entsprechend der grammatischen Kongruenz auf die unreinen Geister.
- source_word: ἐξήρχοντο
  choice: fuhren … aus
  rationale: „Ausfahren“ ist im deutschen Exorzismuskontext idiomatisch und gibt den imperfektischen Vorgang ohne unnötige Umschreibung wieder.
- source_word: πολλοὶ δὲ
  choice: und viele
  rationale: δέ führt hier einen weiteren Teil der Schilderung an, ohne einen starken Gegensatz auszudrücken.
- source_word: παραλελυμένοι
  choice: Gelähmte
  rationale: Die substantivierte Bezeichnung gibt den durch das Perfektpartizip bezeichneten anhaltenden Zustand knapp und natürlich wieder.
- source_word: χωλοὶ
  choice: Gehbehinderte
  rationale: Die moderne, respektvolle Bezeichnung erfasst hier Menschen, deren Fähigkeit zu gehen eingeschränkt ist, ohne eine heute abwertend wirkende Benennung zu verwenden.
- source_word: ἐθεραπεύθησαν
  choice: wurden geheilt
  rationale: Das Passiv und die Bedeutung von θεραπεύω im Heilungskontext werden direkt bewahrt.
theological_decisions:
- issue: Bezug des lauten Rufens und des Ausfahrens
  choice: Die unreinen Geister schreien laut und fahren aus den betroffenen Menschen aus.
  alternative: Die besessenen Menschen schreien, während die Geister ausfahren.
  rationale: Das neutrale Pluralpartizip βοῶντα stimmt grammatisch mit πνεύματα ἀκάθαρτα überein. Das Demonstrativpronomen „diese“ macht diesen Bezug im Deutschen klar, ohne die Geister mit den betroffenen Menschen gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt dem griechischen Gedankengang nahe, wird aber zur eindeutigen Referenz der unreinen Geister behutsam entfaltet.
