  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: de
  text: 'Er sagte aber zu ihnen: »Es steht euch nicht zu, Zeiten oder Zeitpunkte[a] zu kennen, die der Vater kraft seiner eigenen Vollmacht festgesetzt hat.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zeiträume oder festgesetzte Zeiten«. Das Griechische verwendet zwei verwandte Begriffe: χρόνοι für Zeiten beziehungsweise Zeiträume und καιροί für besondere oder festgesetzte Zeitpunkte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in seiner eigenen Vollmacht«. Wörtlich steht im Griechischen »in seiner eigenen Vollmacht«; die Formulierung bezeichnet die eigene Vollmacht des Vaters als Grundlage seiner Festsetzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den milden Gegensatz zwischen der Frage der Jünger und Jesu korrigierender Antwort.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Es steht euch nicht zu, … zu kennen
  rationale: 'Gibt die griechische Zugehörigkeits- und Zuständigkeitswendung natürlich wieder: Diese Kenntnis fällt nicht in den den Jüngern zustehenden Bereich.'
- source_word: χρόνους
  choice: Zeiten
  rationale: Bezeichnet allgemein Zeiträume oder Zeitverläufe und bleibt in der Paarung knapp.
- source_word: καιρούς
  choice: Zeitpunkte
  rationale: Bezeichnet hier besonders bestimmte oder entscheidende Zeitgelegenheiten; die Wiedergabe wahrt einen erkennbaren, aber nicht starr technischen Unterschied zu χρόνοι.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Entspricht dem bestimmten griechischen Titel, ohne ein im Text nicht vorhandenes Possessivpronomen einzufügen.
- source_word: ἔθετο
  choice: festgesetzt hat
  rationale: Drückt das Setzen oder Bestimmen mit fortdauernder Geltung im Deutschen idiomatisch aus.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: in seiner eigenen Vollmacht
  rationale: Bewahrt die örtlich-sphärische Ausdrucksweise von ἐν und gibt ἐξουσία als eigene Befugnis und souveränen Verfügungsbereich des Vaters wieder.
theological_decisions:
- issue: Wiedergabe des Begriffspaars χρόνοι / καιροί
  choice: Zeiten oder Zeitpunkte
  alternative: Zeiten oder festgesetzte Zeiten; Zeiträume oder Zeitpunkte
  rationale: Die Formulierung erhält zwei verwandte Zeitbegriffe, ohne daraus ein spekulatives oder starres heilsgeschichtliches Schema abzuleiten.
- issue: Vollmacht des Vaters in ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: in seiner eigenen Vollmacht
  alternative: durch seine eigene Vollmacht; kraft eigener Vollmacht
  rationale: Die gewählte Fassung bleibt nahe an ἐν und lässt offen, ob besonders der Verfügungsbereich oder die autoritative Festsetzung betont ist, während die souveräne Zuständigkeit des Vaters deutlich bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung »Es steht euch nicht zu« ist allgemein verständlich und bildet das griechische Idiom präzise ab. »Vollmacht« eignet sich im religiösen Kontext besser als das möglicherweise missverständliche »Autorität« und betont rechtmäßige Befugnis, ohne zusätzliche Lehrbegriffe einzutragen.
