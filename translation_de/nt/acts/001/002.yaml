  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: de
  text: bis zu dem Tag, an dem er, nachdem er den Aposteln, die er ausgewählt hatte, durch den Heiligen Geist[a] Weisungen erteilt hatte, aufgenommen wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kraft des Heiligen Geistes«. Die griechische Wendung kann den Heiligen Geist als Mittel oder als vermittelnd Handelnden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: bis zu dem Tag, an dem
  rationale: Die Wendung bezeichnet den zeitlichen Endpunkt des in Vers 1 erwähnten Wirkens und klingt im modernen Standarddeutsch natürlich.
- source_word: ἐντειλάμενος
  choice: Aufträge erteilte
  rationale: Das Aoristpartizip bezeichnet eine der Aufnahme vorausgehende Handlung. „Aufträge erteilen“ bewahrt den verbindlichen Sinn von ἐντέλλομαι, ohne unnötig hart zu klingen.
- source_word: τοῖς ἀποστόλοις
  choice: den Aposteln
  rationale: „Apostel“ ist in Lukas–Apostelgeschichte die etablierte und sachlich passende Bezeichnung für die von Jesus ausgewählte Gruppe.
- source_word: διὰ πνεύματος ἁγίου
  choice: durch den Heiligen Geist
  rationale: διά mit Genitiv kann Mittel oder Vermittlung ausdrücken. „Durch“ hält diese Bedeutungsbreite im Deutschen möglichst offen.
- source_word: οὓς ἐξελέξατο
  choice: die er ausgewählt hatte
  rationale: Das Plusquamperfekt verdeutlicht idiomatisch, dass die Auswahl der Apostel bereits vor den hier berichteten Aufträgen und der Aufnahme erfolgt war.
- source_word: ἀνελήμφθη
  choice: aufgenommen wurde
  rationale: Die passive Form gibt den direkten Sinn wieder, ohne „in den Himmel“ zu ergänzen, was in diesem Vers nicht ausdrücklich steht.
theological_decisions:
- issue: Beziehung der Aufträge Jesu zum Heiligen Geist
  choice: Jesus erteilte den Aposteln durch den Heiligen Geist Aufträge.
  alternative: Jesus erteilte den Aposteln kraft des Heiligen Geistes Aufträge.
  rationale: Die Syntax verbindet διὰ πνεύματος ἁγίου am natürlichsten mit ἐντειλάμενος. „Durch“ bewahrt die mögliche Nuance von Mittel oder Vermittlung, ohne sie dogmatisch genauer festzulegen.
- issue: Agens der Aufnahme
  choice: 'Passiv: „aufgenommen wurde“'
  alternative: 'Explizit: „von Gott aufgenommen wurde“'
  rationale: Der griechische Text nennt das handelnde Subjekt nicht ausdrücklich. Die Übersetzung wahrt dieses Passiv und ergänzt weder Gott noch den Himmel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält den langen griechischen Satz verständlich; „und dann“ macht die zeitliche Abfolge des Partizips idiomatisch deutlich, ohne zusätzliche inhaltliche Aussage.
