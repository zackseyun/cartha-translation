  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: de
  text: Denn er war zu uns gezählt und erhielt einen Anteil an diesem Dienst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erhielt das Los dieses Dienstes“ oder „erhielt den zugeteilten Anteil an diesem Dienst“. Das griechische Wort κλῆρος kann „Los“ oder „Anteil/zugeteilter Teil“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Der Vers begründet im Zusammenhang die besondere Bedeutung des Falls Judas. „Denn“ gibt die erklärend-kausale Funktion im Deutschen knapp und natürlich wieder.
- source_word: κατηριθμημένος ἦν
  choice: war … gezählt worden
  rationale: Die periphrastische Passivform bezeichnet Judas als jemanden, der zur apostolischen Gruppe gerechnet worden war. Die Formulierung bewahrt sowohl den passiven Charakter als auch den resultierenden Zustand.
- source_word: ἐν ἡμῖν
  choice: zu uns
  rationale: In Verbindung mit „gezählt“ bezeichnet die Wendung die tatsächliche Zugehörigkeit zur Gruppe, nicht bloß räumliche Nähe.
- source_word: ἔλαχεν
  choice: hatte … erhalten
  rationale: λαγχάνω kann das Erlangen durch Los beziehungsweise das Empfangen eines zugeteilten Anteils bezeichnen. „Erhalten“ ist im Deutschen natürlich; die Zuteilungs- und Losbedeutung wird zusammen mit κλῆρος in der Fußnote offengehalten.
- source_word: τὸν κλῆρον
  choice: seinen Anteil
  rationale: κλῆρος kann „Los“ oder den dadurch zugewiesenen „Anteil“ bezeichnen. „Seinen Anteil“ vermittelt hier verständlich Judas’ Teilhabe am Dienst, ohne eine konkrete Loshandlung zu behaupten.
- source_word: τῆς διακονίας ταύτης
  choice: an diesem Dienst
  rationale: διακονία bezeichnet hier den apostolischen Dienst. „Anteil an diesem Dienst“ ist natürliches modernes Deutsch und wahrt den sachlichen Bezug.
theological_decisions:
- issue: Judas’ Verhältnis zum apostolischen Dienst
  choice: Der Text sagt aus, dass Judas wirklich zur Gruppe gerechnet worden war und einen Anteil an ihrem Dienst erhalten hatte.
  alternative: Die Aussage könnte abgeschwächt als bloße äußere Verbindung mit der Gruppe verstanden werden.
  rationale: Die Verbindung von κατηριθμημένος ἐν ἡμῖν und κλῆρος τῆς διακονίας bezeugt tatsächliche Zugehörigkeit und Teilhabe. Die Übersetzung zieht daraus jedoch keine weitergehenden dogmatischen Folgerungen über Anerkennung oder endgültiges Heil.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht formelle Wendung „zu uns gezählt worden“ entspricht dem Charakter der Rede und macht die Gruppenzugehörigkeit deutlich; die Fußnote bewahrt die Mehrdeutigkeit von κλῆρος.
