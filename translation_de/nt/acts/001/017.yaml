  - severity: low
    issue: Fußnotenalternative ist syntaktisch unnatürlich
    rationale: „hatte das Los, den zugeteilten Anteil, an diesem Dienst erhalten“ ist im Deutschen holprig und verbindet „Los“ unklar mit „an diesem Dienst“. Eine Formulierung mit Genitiv oder einer klaren Alternative bildet die lexikalische Spannweite verständlicher ab.
