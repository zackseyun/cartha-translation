review_pass:
  verdict: revise
  source_fidelity: Die kausale Einleitung und die Aussage über Judas’ Zugehörigkeit zur Gruppe sind zutreffend wiedergegeben. Die deutsche Plusquamperfektfolge „war ... gezählt worden und hatte ... erhalten“ verschiebt jedoch beide griechischen Aussagen unnötig in eine Vorvergangenheit. Das Perfektpartizip mit ἦν bezeichnet hier seinen bestehenden Status als zu den Aposteln Gezählt(er); ἔλαχεν ist ein Aorist und sollte schlicht als „erhielt“ wiedergegeben werden. „Einen Anteil“ gibt κλῆρος im Kontext angemessen wieder, während die Fußnote die Los-/Zuteilungsnuance wahrt.
  naturalness: „Er war zu uns gezählt und erhielt einen Anteil an diesem Dienst“ ist modernes, würdevolles Standarddeutsch und vermeidet die etwas schwerfällige doppelte Vorvergangenheit des Entwurfs.
  terminology: „Dienst“ ist für διακονία hier passend. „Anteil“ ist für κλῆρος kontextgerecht, ohne eine konkrete Loshandlung zu behaupten. Die Fußnote sollte die Alternative idiomatisch formulieren und darf nicht durch „das Los ... an diesem Dienst“ eine unnatürliche Konstruktion erzeugen.
