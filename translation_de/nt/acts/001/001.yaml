id: ACT.1.1
reference: Acts 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: de
  text: Den ersten Bericht[a], Theophilus, habe ich über alles verfasst, was Jesus zu tun und zu lehren begann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „früheren Bericht“; auch: „erstes Buch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: Den ersten Bericht
  rationale: λόγος bezeichnet hier im Zusammenhang ein schriftliches Werk bzw. einen Bericht und verweist auf das Lukasevangelium. „Ersten“ bewahrt die Reihenfolge; μέν eröffnet den Zusammenhang mit der folgenden Fortsetzung, ohne im Deutschen eigens wiedergegeben werden zu müssen.
- source_word: ἐποιησάμην
  choice: habe ich … verfasst
  rationale: Mit λόγος bezeichnet ποιέω idiomatisch das Anfertigen eines schriftlichen Werks. „Verfasst“ ist präzise und im Deutschen natürlicher als das wörtliche „gemacht“.
- source_word: περὶ πάντων
  choice: über alles
  rationale: περί mit Genitiv bezeichnet den Gegenstand des Berichts. Die Verbindung mit dem folgenden Relativsatz ergibt natürlich „über alles, was …“.
- source_word: ὦ Θεόφιλε
  choice: Theophilus
  rationale: ὦ kennzeichnet die direkte Anrede. Im modernen Standarddeutsch wird diese durch den Namen und die Kommas hinreichend ausgedrückt; „o Theophilus“ wäre unnötig altertümlich.
- source_word: ὧν
  choice: was
  rationale: Das Relativpronomen nimmt πάντων auf; „alles, was“ ist die natürliche deutsche Entsprechung.
- source_word: ἤρξατο
  choice: begann
  rationale: Die ausdrückliche Anfangsbedeutung bleibt erhalten und wird nicht zu „tat und lehrte“ abgeschwächt.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Übliche deutsche Form des Personennamens.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: zu tun und zu lehren
  rationale: Die beiden koordinierten Tätigkeiten werden vollständig bewahrt. Das deutsche „und“ gibt τε καί natürlich wieder; ein zusätzliches „sowohl“ wäre möglich, aber stilistisch nicht erforderlich.
theological_decisions:
- issue: Mögliche Fortsetzung des Wirkens Jesu, die durch ἤρξατο („begann“) angedeutet wird
  choice: „begann“ im Haupttext beibehalten, ohne die mögliche Fortsetzung ausdrücklich zu erklären
  alternative: „was Jesus tat und lehrte“ oder eine ausdeutende Wiedergabe wie „was Jesus begann und durch seine Apostel fortsetzte“
  rationale: Der griechische Text sagt ausdrücklich „begann“. Dies kann das in der Apostelgeschichte fortgesetzte Wirken Jesu andeuten, legt diese Deutung aber nicht ausdrücklich aus; die Übersetzung bewahrt daher die Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede wird ohne das im heutigen Deutsch altertümlich wirkende „o“ wiedergegeben. „Verfasst“ kennzeichnet natürlich ein schriftliches Werk; die Satzstellung bleibt nahe am griechischen Diskursbeginn.
