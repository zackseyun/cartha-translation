source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: de
  text: Als er mit ihnen zusammen war[a], wies er sie an, Jerusalem nicht zu verlassen, sondern auf die Verheißung des Vaters zu warten, von der ihr von mir gehört habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als er sich mit ihnen versammelte“; manche verstehen die Wendung als: „als er mit ihnen aß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: als er mit ihnen zusammen war
  rationale: Die Wiedergabe bewahrt den im Kontext sicheren Sinn des Zusammenseins, ohne die lexikalisch umstrittene Form unnötig auf gemeinsames Essen oder eine förmliche Versammlung festzulegen.
- source_word: παρήγγειλεν
  choice: wies er sie an
  rationale: Die Formulierung bezeichnet eine verbindliche Weisung Jesu und klingt im modernen Deutschen natürlich; der Kontext vermittelt ihre Autorität, ohne dass das härter wirkende „befahl“ nötig ist.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: Jerusalem nicht zu verlassen
  rationale: Dies gibt den räumlichen Sinn idiomatisch und klar wieder. Eine wörtlichere Formulierung wie „sich nicht von Jerusalem zu trennen“ wäre im Deutschen unnatürlich.
- source_word: περιμένειν
  choice: auf … zu warten
  rationale: Die Wendung drückt verständlich das erwartungsvolle Bleiben bis zur Erfüllung aus.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: die Verheißung des Vaters
  rationale: Die formnahe Wiedergabe lässt offen, ob der Genitiv vor allem den Urheber oder die Zugehörigkeit bezeichnet, während der Kontext die Verheißung als vom Vater gegeben erkennen lässt.
- source_word: ἣν ἠκούσατέ μου
  choice: von der ihr durch mich gehört habt
  rationale: Das griechische μου bei ἀκούω bezeichnet Jesus als Quelle der gehörten Botschaft. „Durch mich“ ist hier natürlich und vermeidet die im Deutschen mögliche Fehlvorstellung, die Jünger hätten lediglich etwas über Jesus gehört.
theological_decisions:
- issue: Bedeutung von συναλιζόμενος im Blick auf Jesu Handeln nach der Auferstehung
  choice: Allgemein als Zusammensein Jesu mit den Aposteln wiedergegeben
  alternative: „als er sich mit ihnen versammelte“ oder „als er mit ihnen aß“
  rationale: Die griechische Form ist lexikalisch schwierig. Das Zusammensein ist sicher, ein gemeinsames Essen dagegen nicht eindeutig aus dieser Form abzuleiten. Die allgemeine Wiedergabe vermeidet eine dogmatisch unnötige Festlegung; die Alternativen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang, wird aber für heutige Leser geglättet. Das Zitat wird typografisch markiert, da der Relativsatz auf Jesu eigene frühere Worte verweist.
