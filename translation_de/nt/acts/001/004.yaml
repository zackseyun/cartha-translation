  naturalness: Der deutsche Satz ist insgesamt modernes, würdevolles Standarddeutsch. Die Anführungszeichen um den Relativsatz sind nicht angezeigt, da der griechische Text keinen direkten Redewechsel oder ein eigenständiges Zitat markiert.
  terminology: „Verheißung des Vaters“ ist eine angemessene, traditionelle und zugleich verständliche Wiedergabe von τὴν ἐπαγγελίαν τοῦ πατρὸς. „Wies er sie an“ ist für παρήγγειλεν im Kontext vertretbar. Die Fußnote bewahrt die umstrittenen Deutungsmöglichkeiten von συναλιζόμενος ohne sie in den Haupttext einzutragen.
