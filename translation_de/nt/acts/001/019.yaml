source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: de
  text: 'Und das wurde allen Bewohnern Jerusalems bekannt, sodass jenes Feld in ihrer eigenen Sprache[a] Hakeldamach genannt wurde, das heißt: Feld des Blutes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in ihrer eigenen Mundart«. Das griechische Wort διάλεκτος kann eine Sprache oder eine regionale Sprechform bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: wurde bekannt
  rationale: Die unpersönliche Wendung bezeichnet, dass die Sache allgemein bekannt wurde; die deutsche Formulierung ist natürlich und eng am Griechischen.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: allen Bewohnern Jerusalems
  rationale: Die substantivierte Partizipialwendung bezeichnet die in Jerusalem Wohnenden; »Bewohner« ist knappes, modernes Standarddeutsch.
- source_word: ὥστε
  choice: sodass
  rationale: ὥστε leitet hier eine Folge ein; »sodass« wahrt diesen Zusammenhang, ohne eine bloße Schlussfolgerung auszudrücken.
- source_word: κληθῆναι
  choice: genannt wurde
  rationale: Die passive Benennung wird idiomatisch wiedergegeben und bleibt näher an »rufen/nennen« als das stärker deutende »erhielt den Namen«.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: jenes Feld
  rationale: χωρίον kann ein Grundstück oder Feld bezeichnen. »Feld« erhält die Verbindung zur unmittelbar folgenden Namensdeutung »Blutfeld«.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: in ihrer eigenen Sprache
  rationale: διάλεκτος kann sowohl Sprache als auch regionale Sprechform bezeichnen. »Sprache« klingt im Deutschen natürlich; die mögliche Wiedergabe »Mundart« wird in der Fußnote bewahrt.
- source_word: Ἁκελδαμάχ
  choice: Hakeldamach
  rationale: Die Transliteration gibt den griechischen Namen einschließlich des anlautenden Spiritus asper und des Schlusskonsonanten χ erkennbar wieder.
- source_word: τοῦτ’ ἔστιν
  choice: das heißt
  rationale: Die feste Wendung führt eine erklärende Übersetzung des fremdsprachigen Namens ein.
- source_word: Χωρίον Αἵματος
  choice: Blutfeld
  rationale: Das griechische Genitivattribut bedeutet wörtlich »Feld des Blutes«; »Blutfeld« ist als deutscher Ortsname natürlich und prägnant.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem griechischen Folgegefüge, ohne im Deutschen schwerfällig zu wirken. Der fremdsprachige Ortsname wird transliteriert, seine Bedeutung im Haupttext wiedergegeben.
