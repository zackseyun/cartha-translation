id: ACT.1.13
reference: Acts 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: de
  text: 'Als sie hineingegangen waren, stiegen sie in das Zimmer im Obergeschoss hinauf, wo sie sich aufhielten: Petrus, Johannes, Jakobus und Andreas; Philippus und Thomas; Bartholomäus und Matthäus; Jakobus, der Sohn des Alphäus, Simon der Zelot und Judas, der Sohn des Jakobus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judas, der Bruder des Jakobus“. Im Griechischen steht nur „Judas des Jakobus“; die genaue Beziehung bleibt unausgesprochen.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: als sie hineingegangen waren
  rationale: Der Aorist in der mit ὅτε eingeleiteten Zeitangabe bezeichnet hier die dem Hinaufgehen vorausgehende Handlung. Das deutsche Plusquamperfekt gibt diese Abfolge natürlich wieder.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: stiegen sie in das Zimmer im Obergeschoss hinauf
  rationale: Die Wiedergabe bewahrt sowohl die Aufwärtsbewegung von ἀνέβησαν als auch das räumliche Ziel. „Zimmer im Obergeschoss“ ist im heutigen Deutsch klar und vermeidet unnötige kirchliche Nebenbedeutungen von „Obergemach“.
- source_word: οὗ ἦσαν καταμένοντες
  choice: wo sie sich aufhielten
  rationale: Die Formulierung gibt das fortdauernde Bleiben an diesem Ort idiomatisch wieder, ohne zwingend eine dauerhafte Unterkunft vorauszusetzen.
- source_word: ὅ τε Πέτρος καὶ Ἰωάννης καὶ Ἰάκωβος καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθαῖος
  choice: Petrus, Johannes, Jakobus und Andreas; Philippus und Thomas; Bartholomäus und Matthäus
  rationale: Die Namensformen entsprechen dem etablierten deutschen biblischen Gebrauch. Doppelpunkt und Semikola machen die griechische Aufzählung und ihre Gruppierung lesbar, ohne sämtliche Konjunktionen mechanisch nachzubilden.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Jakobus, der Sohn des Alphäus
  rationale: Der Genitiv identifiziert diesen Jakobus am wahrscheinlichsten durch seinen Vater; die Ergänzung „Sohn“ ist im Deutschen für ein Patronym natürlich.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Simon der Zelot
  rationale: ζηλωτής dient als unterscheidender Beiname. „Zelot“ ist die prägnante und etablierte deutsche Entsprechung, ohne eine abweichende Bezeichnung aus anderen Apostellisten einzutragen.
- source_word: Ἰούδας Ἰακώβου
  choice: Judas, der Sohn des Jakobus
  rationale: In dieser Namensliste ist ein Patronym wahrscheinlich. Da der griechische Genitiv die Beziehung jedoch nicht ausdrücklich bezeichnet, wird die mögliche Bedeutung „Bruder des Jakobus“ in einer Fußnote bewahrt.
theological_decisions:
- issue: Verwandtschaftsverhältnis in Ἰούδας Ἰακώβου
  choice: Judas, der Sohn des Jakobus
  alternative: Judas, der Bruder des Jakobus
  rationale: Ein Patronym passt am besten zum Kontext der Namensliste. Weil das Griechische wörtlich nur „Judas des Jakobus“ sagt und weder „Sohn“ noch „Bruder“ nennt, bleibt die andere mögliche Deutung ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauten deutschen Namensformen. Die Satzstruktur bleibt übersichtlich; veraltetes „Obergemach“ und eine unnatürlich wörtliche Häufung von „und“ werden vermieden.
