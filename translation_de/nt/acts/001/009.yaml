source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: de
  text: Nachdem er das gesagt hatte, wurde er vor ihren Augen emporgehoben, und eine Wolke nahm ihn auf, sodass sie ihn nicht mehr sehen konnten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wolke kann an biblische Berichte erinnern, in denen eine Wolke Gottes Gegenwart anzeigt; ausdrücklich gesagt wird das hier jedoch nicht.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: Nachdem er das gesagt hatte
  rationale: Der Aoristpartizip εἰπών bezeichnet eine Handlung, die der Haupthandlung vorausgeht. Die deutsche Formulierung gibt die zeitliche Abfolge natürlich wieder; ταῦτα wird idiomatisch mit „das“ auf Jesu vorausgehende Worte bezogen.
- source_word: βλεπόντων αὐτῶν
  choice: vor ihren Augen
  rationale: Der Genitivus absolutus beschreibt die Jünger als Augenzeugen während des Geschehens. „Vor ihren Augen“ ist im Deutschen knapp und anschaulich, ohne zusätzliche Deutung.
- source_word: ἐπήρθη
  choice: wurde er emporgehoben
  rationale: Das Passiv bewahrt sowohl die sichtbare Aufwärtsbewegung als auch die nicht ausdrücklich genannte handelnde Instanz. „Emporgehoben“ klingt in diesem Kontext natürlicher und würdiger als „hochgehoben“.
- source_word: νεφέλη
  choice: eine Wolke
  rationale: Das artikellose Substantiv wird sachgerecht unbestimmt wiedergegeben; eine ausdrückliche theophanische Identifikation wird nicht in den Haupttext aufgenommen.
- source_word: ὑπέλαβεν αὐτόν
  choice: nahm ihn auf
  rationale: ὑπολαμβάνω kann hier „aufnehmen“ oder „wegnehmen“ bedeuten. „Nahm ihn auf“ bewahrt das Bild der Wolke als aufnehmendes Subjekt und lässt die genaue Art des Vorgangs offen.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: entzog ihn ihren Blicken
  rationale: Die idiomatische Wiedergabe bezeichnet klar, dass Jesus für sie nicht mehr sichtbar war, und verbindet sich im Deutschen flüssig mit „nahm ihn auf“.
theological_decisions:
- issue: Ob das Passiv ἐπήρθη durch eine ausdrücklich genannte göttliche Handlung verdeutlicht werden soll
  choice: wurde er emporgehoben
  alternative: Gott hob ihn empor / er fuhr auf
  rationale: Das griechische Passiv nennt den Handelnden nicht. Die Übersetzung wahrt diese Zurückhaltung und vermeidet, eine zwar naheliegende, aber hier unausgesprochene Deutung in den Wortlaut einzutragen.
- issue: Ob die Wolke ausdrücklich als Zeichen der Gegenwart Gottes bezeichnet werden soll
  choice: eine Wolke
  alternative: die Wolke der Gegenwart Gottes
  rationale: Biblische Wolkenmotive können anklingen, doch der Vers erklärt die Wolke nicht ausdrücklich. Der Haupttext bleibt daher zurückhaltend; die mögliche Resonanz wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem griechischen Ablauf, vermeidet jedoch schwerfällige Partizipialkonstruktionen. Die Formulierungen „emporgehoben“ und „nahm ihn auf“ bewahren das Bild und die Mehrdeutigkeit des Ausgangstextes.
