  verdict: revise
  source_fidelity: Der Entwurf gibt die notwendige Folgerung (δεῖ οὖν), die ausdrücklich männliche Personengruppe (ἀνδρῶν), die gesamte Zeitspanne und den in Vers 22 fortgesetzten Satzbau sachgerecht wieder. Die Vorwegnahme von „einer“ ist im Deutschen zur Wiedergabe der erst im folgenden Vers vervollständigten griechischen Konstruktion vertretbar. Die Stellung von „bei uns“ beim Idiom sollte jedoch geglättet werden, ohne die Bildsprache aufzugeben.
  naturalness: „Einer der Männer“ ist im modernen Standarddeutsch idiomatischer als „einer von den Männern“. „Der Herr Jesus ging bei uns ein und aus“ ist eine natürliche Wortstellung für die bewahrte feste Wendung.
  terminology: „Herr Jesus“ gibt κύριος angemessen wieder; „Männer“ bewahrt die spezifische Bedeutung von ἀνήρ. Die Fußnote zum Partizip sollte dessen wörtliche Vorzeitigkeitsnuance genauer wiedergeben und nicht die gegenwärtig klingende Form „zusammenkamen“ verwenden.
