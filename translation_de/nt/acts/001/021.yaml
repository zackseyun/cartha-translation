id: ACT.1.21
reference: Acts 1:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: de
  text: Darum muss einer der Männer, die während der ganzen Zeit mit uns zusammen waren[a], in der der Herr Jesus bei uns ein und aus ging[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die mit uns zusammengekommen sind«.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung »bei uns ein und aus ging« bezeichnet Jesu fortdauerndes öffentliches Leben und Wirken in Gemeinschaft mit den Jüngern.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: muss
  rationale: Das unpersönliche Verb bezeichnet eine Notwendigkeit. Die deutsche Konstruktion mit „muss einer“ gibt diese Kraft natürlich wieder, während der Satz in Vers 22 weitergeführt wird.
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Zusammenhang und klingt im modernen Standarddeutsch klar und natürlich.
- source_word: συνελθόντων ἡμῖν ἀνδρῶν
  choice: von den Männern, die … mit uns zusammen waren
  rationale: Das Partizip bezeichnet hier Männer, die sich über den betreffenden Zeitraum in Gemeinschaft mit den Aposteln befanden. Die Formulierung gibt die fortdauernde Zugehörigkeit natürlicher wieder als das wörtliche „zusammenkamen“ und bewahrt mit „Männern“ die geschlechtsspezifische Bedeutung von ἀνήρ.
- source_word: ἐν παντὶ χρόνῳ
  choice: während der ganzen Zeit
  rationale: Gemeint ist die gesamte Zeitspanne des Wirkens Jesu in ihrer Gemeinschaft, nicht ausnahmslos jeder einzelne Zeitpunkt.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: ein und aus ging
  rationale: Bewahrt das anschauliche Ausgangsidiom, das Jesu fortdauerndes Leben und Wirken inmitten des Jüngerkreises bezeichnet.
- source_word: ἐφ’ ἡμᾶς
  choice: bei uns
  rationale: Die Präpositionalfügung beschreibt Jesu Bewegung und Tätigkeit in Beziehung zur versammelten Gruppe; „bei uns ein und aus ging“ ist im Deutschen idiomatisch.
- source_word: ὁ κύριος Ἰησοῦς
  choice: der Herr Jesus
  rationale: „Herr“ wahrt das etablierte christologische Gewicht von κύριος; der bestimmte Artikel entspricht hier natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von κύριος als christologischer Titel
  choice: der Herr Jesus
  alternative: der Meister Jesus
  rationale: „Herr“ bewahrt sowohl den ehrenden als auch den theologischen Gehalt des Titels in der Apostelgeschichte; „Meister“ wäre enger und würde diesen Gehalt abschwächen.
- issue: Geschlechtsspezifische Bedeutung von ἀνδρῶν
  choice: Männern
  alternative: Menschen
  rationale: ἀνήρ bezeichnet hier ausdrücklich Männer. Eine geschlechtsneutrale Wiedergabe würde eine im Ausgangstext vorhandene Aussage beseitigen.
- issue: Über Vers 21 hinausreichende Satzkonstruktion
  choice: muss einer von den Männern …
  alternative: ist es nötig, von den Männern …
  rationale: Das griechische Satzgefüge wird erst in Vers 22 mit ἕνα τούτων vervollständigt. Die Vorwegnahme von „einer“ schafft im Deutschen einen verständlichen Satzanschluss, ohne die Auswahl oder Aufgabe theologisch näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schlussinterpunktion bleibt ein Komma, weil der Gedanke in Vers 22 weitergeführt wird. Das Quellenbild „ein und aus gehen“ wird bewahrt und durch eine knappe Fußnote erläutert.
