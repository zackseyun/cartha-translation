  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: de
  text: Dann kehrten sie vom Ölberg nach Jerusalem zurück. Er liegt nahe bei Jerusalem, einen Sabbatweg entfernt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein „Sabbatweg“ war die Wegstrecke, die ein Jude nach damaligem Brauch am Sabbat zurücklegen durfte.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Gibt den zeitlichen Fortgang der Erzählung knapp und natürlich wieder.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: kehrten sie ... nach Jerusalem zurück
  rationale: Entspricht der Bewegungsrichtung und ist im modernen deutschen Erzählstil idiomatisch.
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: von dem Berg, der Ölberg genannt wird
  rationale: Bewahrt sowohl das Gattungswort ὄρος als auch die Benennungskonstruktion; „Ölberg“ ist die etablierte und transparente deutsche Ortsbezeichnung.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: Er liegt nahe bei Jerusalem
  rationale: Gibt die räumliche Nähe klar wieder; der neue Satz vermeidet einen schwerfälligen Relativsatz.
- source_word: σαββάτου ἔχον ὁδόν
  choice: einen Sabbatweg entfernt
  rationale: Bewahrt den jüdischen Entfernungsbegriff knapp und verständlich; die kulturelle Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Jüdische Entfernungsangabe σαββάτου ἔχον ὁδόν
  choice: einen Sabbatweg entfernt
  alternative: eine Sabbattagereise entfernt
  rationale: „Sabbatweg“ ist im Deutschen als biblischer Fachausdruck verständlich und hält die kulturelle Eigenart des Ausdrucks fest, ohne eine genaue moderne Maßeinheit vorzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne Informationen hinzuzufügen oder die räumliche Aussage zu präzisieren.
