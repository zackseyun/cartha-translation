  variant: modern standard German
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: de
  text: Ihnen zeigte er sich nach seinem Leiden durch viele Beweise[a] als lebendig. Im Laufe von vierzig Tagen[b] erschien er ihnen und sprach über das Reich Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „mit vielen Beweisen“ oder „durch viele überzeugende Beweise“. Das griechische Wort bezeichnet Beweismittel, die Gewissheit begründen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „während vierzig Tagen“ oder „vierzig Tage lang“. Gemeint sind Erscheinungen, die sich über diesen Zeitraum verteilten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: ihnen
  rationale: Das Dativpronomen bezieht sich auf die zuvor genannten Apostel. „Ihnen“ entspricht dem griechischen Text, ohne das dort nicht ausdrücklich stehende Wort „Männer“ einzufügen.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: zeigte er sich … als lebendig
  rationale: Die reflexive Konstruktion bezeichnet ein Sich-Zeigen oder Sich-Darstellen; ζῶντα beschreibt dabei prädikativ Jesu lebendigen Zustand nach seinem Leiden.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: nach seinem Leiden
  rationale: Die Konstruktion mit μετά und substantiviertem Infinitiv ist temporal und bezeichnet das Leiden als abgeschlossenes Geschehen vor den Erscheinungen.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: durch viele überzeugende Beweise
  rationale: τεκμήριον bezeichnet einen tragfähigen, Gewissheit begründenden Beweis. „Überzeugende“ gibt diese lexikalische Stärke in natürlichem Deutsch wieder; ἐν wird hier instrumental mit „durch“ wiedergegeben.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: im Laufe von vierzig Tagen
  rationale: διά mit Genitiv bezeichnet hier einen Zeitraum, über den sich wiederholte Erscheinungen erstreckten, nicht notwendig eine ununterbrochene Dauer.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: erschien er ihnen
  rationale: ὀπτάνομαι bedeutet in diesem Auferstehungskontext natürlich „erscheinen“.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: sprach über das Reich Gottes
  rationale: τὰ περὶ bezeichnet die Dinge oder Themen, die etwas betreffen. Die knappe deutsche Formulierung gibt den Sinn idiomatisch wieder.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Reich Gottes
  rationale: „Reich Gottes“ ist die geläufige und inhaltlich offene Wiedergabe, die sowohl Gottes Herrschaft als auch deren Wirkungsbereich anklingen lässt.
theological_decisions:
- issue: Auferstehungsaussage und Beweiskraft
  choice: Jesus zeigte sich nach seinem Leiden durch viele überzeugende Beweise als lebendig.
  alternative: Jesus zeigte sich nach seinem Leiden lebend und lieferte dafür viele Beweise.
  rationale: Die Übersetzung bekräftigt ausdrücklich Jesu Leben nach seinem Leiden und bewahrt die starke Beweiskraft von τεκμήρια, ohne mit Wörtern wie „unfehlbar“ über den griechischen Text hinauszugehen.
- issue: Bedeutungsumfang von βασιλεία τοῦ θεοῦ
  choice: Reich Gottes
  alternative: Herrschaft Gottes
  rationale: „Reich Gottes“ bewahrt die traditionelle, allgemein verständliche Formulierung und legt die im griechischen Begriff mögliche Spannung zwischen königlicher Herrschaft und Reichsbereich nicht einseitig fest.
- issue: Geschlecht des Bezugswortes von οἷς
  choice: ihnen
  alternative: diesen Männern
  rationale: Der Zusammenhang verweist auf die Apostel, doch das Pronomen selbst enthält das Substantiv „Männer“ nicht. „Ihnen“ bleibt daher näher am Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge des griechischen Textes zu verändern. „Überzeugende Beweise“ gibt die Stärke von τεκμήρια idiomatisch wieder; die Fußnote dokumentiert die formal knappere Alternative.
