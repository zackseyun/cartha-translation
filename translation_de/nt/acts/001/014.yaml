id: ACT.1.14
reference: Acts 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: de
  text: Sie alle widmeten sich beharrlich und einmütig[a] dem Gebet, zusammen mit den Frauen[b], mit Maria, der Mutter Jesu, und mit seinen Brüdern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in völliger Übereinstimmung“ oder „mit einem gemeinsamen Ziel“. Das griechische Wort bezeichnet nicht nur das Zusammensein, sondern auch die gemeinsame Ausrichtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: „mit Frauen“. Im Griechischen fehlt der Artikel; wahrscheinlich ist jedoch eine bekannte Gruppe von Frauen gemeint, die mit den Jüngern verbunden war.'
    reason: lexical_alternative
  - marker: c
    text: „Brüder“ übersetzt das griechische Wort adelphoi. Es kann je nach Zusammenhang auch nahe Verwandte bezeichnen; welches genaue Verwandtschaftsverhältnis hier gemeint ist, sagt der Text nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Sie alle
  rationale: Die Wendung gibt sowohl den rückverweisenden Charakter von οὗτοι als auch die Vollständigkeit von πάντες in natürlichem Deutsch wieder.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: widmeten sich beharrlich
  rationale: Die umschreibende Imperfektform bezeichnet ein fortdauerndes Verhalten; „beharrlich“ bewahrt zugleich den Gedanken des ausdauernden Festhaltens in προσκαρτερέω.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: „Einmütig“ bringt die gemeinsame Ausrichtung und Geschlossenheit zum Ausdruck, nicht nur die räumliche Anwesenheit.
- source_word: τῇ προσευχῇ
  choice: dem Gebet
  rationale: Der Dativ bezeichnet hier das, dem sich die Gruppe beharrlich widmete. Der griechische Artikel wird im Deutschen idiomatisch mit dem bestimmten Artikel wiedergegeben.
- source_word: σὺν γυναιξίν
  choice: zusammen mit den Frauen
  rationale: Obwohl im Griechischen kein Artikel steht, legt der Zusammenhang eine bekannte Gruppe von Frauen nahe; „zusammen mit“ gibt σύν natürlich wieder.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: mit Maria, der Mutter Jesu
  rationale: „Maria“ ist die übliche deutsche Namensform; die Apposition identifiziert sie unmittelbar und ohne zusätzliche Deutung.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: mit seinen Brüdern
  rationale: ἀδελφοί ist maskuliner Plural und wird zunächst mit „Brüder“ wiedergegeben; die genaue Art des Verwandtschaftsverhältnisses wird dadurch nicht näher festgelegt.
theological_decisions:
- issue: Verwandtschaftsverhältnis der ἀδελφοί Jesu
  choice: seine Brüder
  alternative: seine nahen Verwandten oder Angehörigen
  rationale: „Brüder“ entspricht der gewöhnlichen Bedeutung des griechischen Ausdrucks. Ob damit leibliche Brüder, Stiefbrüder oder andere nahe Verwandte gemeint sind, entscheidet der Vers selbst nicht; diese Spannung bleibt in der Fußnote offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Formulierung ist idiomatisch, bewahrt aber den fortdauernden Charakter des griechischen Imperfekts, die betonte Einmütigkeit und die nicht abschließend bestimmte Bedeutung von ἀδελφοί.
