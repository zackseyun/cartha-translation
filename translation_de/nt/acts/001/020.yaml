  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: de
  text: 'Denn im Buch der Psalmen steht geschrieben: »Seine Wohnstätte soll veröden, und niemand soll darin wohnen«, und: »Sein Amt soll ein anderer übernehmen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für »Amt« steht das griechische Wort ἐπισκοπή; auch »Aufsichtsamt« oder »Aufsicht« sind möglich. Die traditionelle Wiedergabe »Bischofsamt« kann hier eine spätere kirchliche Amtsbezeichnung nahelegen, die der Zusammenhang nicht voraussetzt.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν
  choice: Denn im Buch der Psalmen steht geschrieben
  rationale: Die geläufige deutsche Zitierformel bewahrt die präsentische Wirkung des griechischen Perfekts; βίβλος wird im Kontext natürlich mit »Buch« wiedergegeben.
- source_word: Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος
  choice: Sein Wohnplatz soll veröden
  rationale: Der deutsche Jussiv mit »soll« gibt den Imperativ der Psalmstelle würdig wieder. »Wohnplatz« bezeichnet den bewohnten Ort, ohne ihn unnötig auf Haus, Hof oder Lager festzulegen; »veröden« drückt das Unbewohntwerden prägnant aus.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: niemand soll darin wohnen
  rationale: Diese natürliche deutsche Formulierung gibt die verneinte Existenz eines Bewohners vollständig und knapp wieder.
- source_word: Τὴν ἐπισκοπὴν αὐτοῦ λαβέτω ἕτερος
  choice: Sein Aufsichtsamt soll ein anderer übernehmen
  rationale: »Aufsichtsamt« bewahrt den Bedeutungsbezug von ἐπισκοπή zu Aufsicht und Verantwortung, ohne den späteren technischen Titel »Bischofsamt« in den Kontext einzutragen. »übernehmen« ist für das Antreten einer Aufgabe oder Stellung idiomatisches Deutsch.
theological_decisions:
- issue: Wiedergabe von ἐπισκοπή bei der Neubesetzung der Stellung des Judas
  choice: Aufsichtsamt
  alternative: Amt; Aufsicht; Bischofsamt
  rationale: »Aufsichtsamt« lässt erkennen, dass es um eine anvertraute Funktion mit Verantwortung geht, vermeidet aber eine vorschnelle Gleichsetzung mit einem später institutionell ausgeprägten Bischofsamt. Die allgemeinere Wiedergabe »Amt« ist möglich, verliert jedoch den Aufsichtsaspekt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftzitat. Die parallelen Aufforderungen werden jeweils mit »soll« wiedergegeben. Zeichensetzung und Anführungszeichen folgen heutigem deutschem Gebrauch.
