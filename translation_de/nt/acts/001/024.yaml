  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: de
  text: 'Und nachdem sie gebetet hatten, sagten sie: »Du, Herr[b], der du die Herzen aller kennst, zeige[a], welchen von diesen beiden du erwählt hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weise aus« oder »bestimme«. Das Verb kann sowohl das Kenntlichmachen als auch die öffentliche Bestimmung oder Einsetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Anrede »Herr« kann sich allgemein auf Gott oder speziell auf Jesus beziehen; der griechische Text identifiziert den Angeredeten hier nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: nachdem sie gebetet hatten
  rationale: Das Aoristpartizip bezeichnet hier am natürlichsten eine Handlung, die dem Sagen vorausgeht; der temporale Nebensatz gibt diese Abfolge in modernem Deutsch klar wieder.
- source_word: Σὺ κύριε
  choice: Du, Herr
  rationale: Das ausdrücklich gesetzte Pronomen Σὺ hebt den Angeredeten hervor; die direkte Anrede bleibt erhalten, ohne den Bezug von »Herr« näher festzulegen.
- source_word: καρδιογνῶστα πάντων
  choice: der du die Herzen aller kennst
  rationale: Die attributive Umschreibung klingt im Deutschen natürlich und bewahrt sowohl den Gedanken des Herzenskenners als auch πάντων, »aller«.
- source_word: ἀνάδειξον
  choice: zeige
  rationale: Im Zusammenhang wird darum gebeten, die bereits getroffene Wahl kenntlich zu machen. »Zeige« vermeidet die zusätzliche Festlegung, dass erst hier eine formelle Einsetzung erfolgt.
- source_word: ὃν ἐξελέξω
  choice: welchen ... du erwählt hast
  rationale: Die Form bezeichnet denjenigen, den der Herr für sich ausgewählt hat; das deutsche Perfekt bringt die vorausliegende Wahl mit ihrer gegenwärtigen Bedeutung idiomatisch zum Ausdruck.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: welchen von diesen beiden
  rationale: Die Formulierung gibt die Auswahl eines Einzelnen aus den zwei Kandidaten natürlich wieder, ohne das im Vers nicht ausdrücklich stehende Wort »Männer« hinzuzufügen.
theological_decisions:
- issue: Bezug der Anrede »Herr«
  choice: Die Anrede »Du, Herr« bleibt ohne ausdrückliche Identifizierung des Angeredeten stehen.
  alternative: Die Anrede ausdrücklich auf Gott allgemein beziehungsweise auf den auferstandenen Jesus beziehen.
  rationale: Der griechische Text nennt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt daher die echte Auslegungsfrage, statt sie konfessionell oder dogmatisch vorzuentscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch einen idiomatischen temporalen Nebensatz und die natürliche Umschreibung des Titels καρδιογνώστης verständlich gestaltet.
