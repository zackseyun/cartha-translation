id: ACT.1.16
reference: Acts 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: de
  text: Ihr Männer und Brüder, die Schrift musste erfüllt werden, die der Heilige Geist durch den Mund Davids zuvor über Judas gesagt hatte, der für diejenigen, die Jesus festnahmen[b], zum Führer wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „ergriffen hatten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ihr Männer, Brüder
  rationale: Beide maskulinen Vokative werden wiedergegeben. „Ihr“ kennzeichnet im heutigen Deutsch die direkte Anrede natürlich, ohne ἄνδρες in „Brüder“ aufgehen zu lassen.
- source_word: ἔδει πληρωθῆναι
  choice: musste erfüllt werden
  rationale: Die Formulierung bewahrt sowohl die ausgedrückte Notwendigkeit als auch das Passiv und entspricht dem üblichen Sprachgebrauch für die Erfüllung der Schrift.
- source_word: τὴν γραφὴν
  choice: die Schrift
  rationale: γραφή bezeichnet hier die heilige Schrift, nicht lediglich irgendeinen schriftlichen Text.
- source_word: προεῖπε
  choice: im Voraus gesprochen hatte
  rationale: Diese Wiedergabe hält sich eng an die Grundbedeutung „vorher sagen/sprechen“ und vermeidet es, den Begriff stärker als nötig als technische Weissagungssprache festzulegen.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Dies ist die geläufige und genaue moderne deutsche Bezeichnung.
- source_word: διὰ στόματος Δαυὶδ
  choice: durch den Mund Davids
  rationale: 'Die bildhafte instrumentale Wendung des Griechischen bleibt erhalten: Der Heilige Geist ist der Sprecher, David das menschliche Sprachorgan.'
- source_word: περὶ Ἰούδα
  choice: über Judas
  rationale: Die Präposition bezeichnet hier den Gegenstand der vorausgehenden Aussage; „über“ ist im Deutschen klar und natürlich.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: der … zum Wegweiser wurde
  rationale: „Wurde“ bildet γενομένου ab; „zum Wegweiser“ gibt die prädikative, artikellose Bezeichnung natürlich wieder.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: denen, die Jesus festnahmen
  rationale: Im Erzählzusammenhang bezeichnet συλλαμβάνω die Festnahme Jesu. Die Alternative „ergriffen“ bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Art der in ἔδει bezeichneten Notwendigkeit
  choice: „musste erfüllt werden“ ohne nähere Bestimmung des Grundes
  alternative: Ausdrückliche Deutung als göttliche Vorherbestimmung oder bloße Angemessenheit
  rationale: Der Vers stellt die Erfüllung als notwendig dar, erläutert aber nicht den genauen Zusammenhang von göttlichem Plan, Vorwissen und menschlichem Handeln.
- issue: Göttliche und menschliche Urheberschaft der Schriftaussage
  choice: Der Heilige Geist spricht durch den Mund Davids
  alternative: David spricht unter Eingebung des Geistes
  rationale: Die griechische Syntax setzt ausdrücklich den Heiligen Geist als Sprecher und David als menschlichen Mittler; diese Zuordnung wird nicht umgestellt.
- issue: Bedeutungsumfang von προεῖπε
  choice: „im Voraus gesprochen hatte“
  alternative: „vorhergesagt hatte“
  rationale: Die gewählte Form bewahrt die Aussage des Vorher-Sprechens, ohne die prophetische Bedeutung zu leugnen oder terminologisch stärker festzulegen; die geläufige Alternative wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die förmliche doppelte Anrede und die bildhafte Wendung „durch den Mund Davids“ bleiben erhalten. Der lange griechische Satz wird als ein Satz wiedergegeben, wobei die Relativsätze syntaktisch nachvollziehbar bleiben.
