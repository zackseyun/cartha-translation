revisions:
- from: Ihr Männer, Brüder, die Schrift musste erfüllt werden, die der Heilige Geist durch den Mund Davids über Judas im Voraus gesprochen hatte[a], der denen, die Jesus festnahmen[b], zum Wegweiser wurde.
  to: Ihr Männer und Brüder, die Schrift musste erfüllt werden, die der Heilige Geist durch den Mund Davids zuvor über Judas gesagt hatte, der für diejenigen, die Jesus festnahmen[b], zum Führer wurde.
  rationale: Die Revision verbessert idiomatische moderne deutsche Ausdrucksweise und ersetzt die sachlich ungenaue Personenbezeichnung „Wegweiser“. Die Notwendigkeit der Erfüllung sowie die doppelte göttliche und menschliche Sprechvermittlung bleiben unverändert. Die Fußnotenalternativen bleiben inhaltlich erhalten; der Marker a entfällt im fortlaufenden Text, weil die gewählte Formulierung „zuvor gesagt hatte“ die semantisch passende Grundwiedergabe ist, während die Alternative weiterhin dokumentiert wird.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:54:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Bedeutungen zuverlässig wieder: die Notwendigkeit der Schrifterfüllung, den Heiligen Geist als voraussprechenden Akteur durch David sowie Judas als Führer der Festnehmenden. „Wegweiser“ bezeichnet im heutigen Deutsch jedoch primär ein Zeichen bzw. eine Orientierungshilfe und nicht den handelnden Begleiter/Leiter, den ὁδηγός hier meint.'
  naturalness: „Ihr Männer, Brüder“ und besonders „im Voraus gesprochen hatte“ wirken im modernen Deutsch unnötig sperrig. „Ihr Männer und Brüder“ erhält die doppelte förmliche Anrede, und „zuvor gesagt hatte“ ist idiomatisch, ohne die Bedeutung zu einer technischen Weissagungsformel zu verengen.
  terminology: „Die Schrift“, „der Heilige Geist“, „durch den Mund Davids“ und „Jesus festnahmen“ sind treffend. „Führer“ ist in diesem konkreten syntaktischen Zusammenhang die sachgerechte Personenbezeichnung für ὁδηγός; durch „für diejenigen“ wird die Bezugsrichtung klar bezeichnet.
  issues:
  - severity: medium
    issue: „Wegweiser“ für ὁδηγός
    rationale: Ein „Wegweiser“ ist im modernen Standarddeutsch gewöhnlich ein Schild oder allenfalls bildlich eine Orientierungshilfe. Judas führte die Personen, die Jesus festnahmen; „zum Führer“ gibt diese personale Rolle genauer wieder.
  - severity: low
    issue: Unidiomatische Formulierung „im Voraus gesprochen hatte“
    rationale: Die enge Nachbildung von προεῖπε ist verständlich, aber stilistisch holprig. „Zuvor gesagt hatte“ bewahrt das vorausgehende Sprechen und ist natürliches modernes Deutsch.
  - severity: low
    issue: Anrede „Ihr Männer, Brüder“
    rationale: Die Reihung mit Komma klingt im Deutschen fragmentarisch. „Ihr Männer und Brüder“ bewahrt beide ausdrücklich maskulinen Vokative und die feierliche Anredeform.
