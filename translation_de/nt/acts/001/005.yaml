id: ACT.1.5
reference: Acts 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: de
  text: Denn Johannes taufte mit Wasser; ihr aber werdet in wenigen Tagen im Heiligen Geist[a] getauft werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Heiligen Geist“. Die griechische Präposition kann hier „in“ oder „mit“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert hier die unmittelbar vorausgehende Verheißung. „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: ἐβάπτισεν
  choice: taufte
  rationale: Der etablierte Ausdruck „taufen“ bewahrt den religiösen Sinn, ohne eine bestimmte Taufweise durch „untertauchen“ festzulegen.
- source_word: ὕδατι
  choice: mit Wasser
  rationale: Der Dativ bezeichnet hier natürlich das Mittel; „mit Wasser“ ist idiomatisches Deutsch und bildet einen klaren Kontrast zur folgenden Wendung.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: „Im Heiligen Geist“ bildet ἐν transparent ab und lässt offen, ob vor allem Sphäre oder Mittel gemeint ist. Die alternative Wiedergabe „mit dem Heiligen Geist“ wird in der Fußnote genannt.
- source_word: βαπτισθήσεσθε
  choice: ihr werdet … getauft werden
  rationale: Die Form gibt Futur und Passiv direkt wieder, bewahrt die Verbindung zu Johannes’ Taufe und lässt den Handelnden wie im Griechischen unausgesprochen.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: in wenigen Tagen
  rationale: Diese geläufige deutsche Zeitangabe gibt den Sinn von „nicht nach vielen dieser Tage“ prägnant und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von ἐν πνεύματι ἁγίῳ in der theologisch sensiblen Aussage über die Geisttaufe
  choice: im Heiligen Geist
  alternative: mit dem Heiligen Geist
  rationale: ἐν kann hier die Sphäre oder das Mittel bezeichnen. Der Haupttext folgt der Präposition mit „im“ relativ eng; die instrumentale Deutung wird als echte Alternative in der Fußnote bewahrt, ohne die theologische Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon macht den im Griechischen markierten Gegensatz zwischen Johannes und den Angesprochenen deutlich. Die Wortstellung bleibt natürlich und bewahrt zugleich die Parallele der beiden Taufhandlungen.
