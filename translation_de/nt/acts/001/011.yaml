id: ACT.1.11
reference: Acts 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: de
  text: 'Sie sagten: „Ihr Männer aus Galiläa, warum steht ihr da und schaut zum Himmel? Dieser Jesus[a], der von euch in den Himmel aufgenommen wurde, wird auf dieselbe Weise kommen, wie ihr ihn in den Himmel gehen saht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditioneller: „Dieser selbe Jesus.“ Im Griechischen steht ausdrücklich „Dieser Jesus“; „selbe“ ist eine interpretierende Ergänzung zur Hervorhebung seiner Identität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Ihr Männer aus Galiläa
  rationale: Die direkte Anrede mit dem maskulinen Plural ἄνδρες und der Herkunftsbezeichnung Γαλιλαῖοι wird natürlich und zugleich formnah wiedergegeben.
- source_word: τί ἑστήκατε βλέποντες
  choice: warum steht ihr da und schaut
  rationale: Das Perfekt ἑστήκατε bezeichnet den gegenwärtigen Zustand des Stehens; das Partizip βλέποντες nennt die begleitende Handlung. „Steht ihr da und schaut“ ist im modernen Deutsch idiomatisch, ohne das stärkere „starren“ einzutragen.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel / in den Himmel
  rationale: Beim Schauen bezeichnet εἰς die Blickrichtung („zum Himmel“), bei Aufnahme und Hingehen die gerichtete Bewegung („in den Himmel“). οὐρανός wird aufgrund des Himmelfahrtskontexts als „Himmel“ verstanden.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Dieser Jesus
  rationale: Dies entspricht dem ausdrücklich gesetzten Demonstrativpronomen οὗτος. Ein zusätzliches „derselbe“ würde die Identitätsbetonung interpretierend verstärken, obwohl dafür kein eigenes griechisches Wort steht.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: der von euch weg in den Himmel aufgenommen wurde
  rationale: Das Passiv ἀναλημφθείς wird als göttliches Passiv offen belassen. „Von euch weg“ macht die durch ἀπό bezeichnete Trennung im Deutschen verständlich; das Ziel folgt aus εἰς τὸν οὐρανόν.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: wird ebenso wiederkommen, wie
  rationale: οὕτως zusammen mit ὃν τρόπον stellt eine Entsprechung der Art und Weise her. „Ebenso … wie“ bildet diese Vergleichsstruktur natürlich ab. „Wiederkommen“ ist im Deutschen kontextuell erforderlich, da Jesus zuvor weggegangen ist.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: ihr ihn … gehen saht
  rationale: Die Konstruktion mit Wahrnehmungsverb und prädikativem Partizip wird formnah wiedergegeben. „Saht“ ist würdig und knapp; „gehen“ bewahrt die allgemeine Bewegungsbedeutung von πορεύομαι.
theological_decisions:
- issue: Bedeutung von οὐρανός im Zusammenhang von Himmelfahrt und Wiederkunft
  choice: Himmel
  alternative: Himmelssphäre / sichtbarer Himmel
  rationale: οὐρανός kann auch den sichtbaren Himmel bezeichnen. Hier verbindet der Text jedoch Jesu Aufnahme mit seinem künftigen Kommen; „Himmel“ erhält die räumliche und theologische Offenheit des Begriffs besser als „Firmament“ oder „Luftraum“.
- issue: Identitätsbetonung in οὗτος ὁ Ἰησοῦς
  choice: Dieser Jesus
  alternative: Dieser selbe Jesus
  rationale: Die Übersetzung bewahrt die ausdrückliche demonstrative Form, ohne durch „selbe“ eine zusätzliche lexikalische Komponente einzuführen. Die Identität des Weggehenden und Kommenden bleibt durch den Satzbau klar.
- issue: Agens der Aufnahme Jesu
  choice: 'Passiv: „aufgenommen wurde“'
  alternative: Gott nahm ihn auf
  rationale: Das griechische Passiv nennt das handelnde Subjekt nicht ausdrücklich. Die Übersetzung lässt diese Form bestehen und macht die theologisch naheliegende Deutung als göttliches Handeln nicht expliziter als der Vers selbst.
- issue: Art der verheißenen Wiederkunft
  choice: „ebenso … wie“
  alternative: „auf dieselbe Weise, wie“
  rationale: Die Formulierung wahrt die Entsprechung, legt aber nicht über den Text hinaus fest, welche einzelnen Merkmale der Himmelfahrt bei der Wiederkunft gemeint sind.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Anrede bleibt männlich markiert, wie im griechischen Text. „Saht“ ist bewusst knapp und gehoben, aber nicht altertümlich. Keine Fußnote ist nötig, da die formnahe Wiedergabe „Dieser Jesus“ im Haupttext steht.
