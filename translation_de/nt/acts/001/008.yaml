source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: de
  text: Aber ihr werdet Kraft empfangen, wenn der Heilige Geist auf euch kommt, und ihr werdet meine Zeugen sein in Jerusalem, in ganz Judäa und Samarien und bis ans Ende der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis an die Enden der Erde“. Im Griechischen steht die Wendung im Singular („bis ans Ende der Erde“), bezeichnet aber idiomatisch die äußerste Reichweite der Erde.'
    reason: Lexikalische und idiomatische Übersetzungsalternative zu ἕως ἐσχάτου τῆς γῆς.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Aber
  rationale: Kennzeichnet den Gegensatz zur Aussage des vorangehenden Verses und ist hier die natürliche deutsche adversative Verknüpfung.
- source_word: λήμψεσθε δύναμιν
  choice: ihr werdet Kraft empfangen
  rationale: λαμβάνω bezeichnet hier das Empfangen von etwas Gegebenem; δύναμις meint die durch den Geist verliehene wirksame Befähigung, ohne auf körperliche Stärke verengt zu sein.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: wenn der Heilige Geist auf euch kommt
  rationale: Der Genitivus absolutus wird als natürliche temporale Aussage wiedergegeben. „Auf euch kommt“ bewahrt die Bewegungsrichtung von ἐπί mit Akkusativ, während das deutsche Präsens in der Zukunftsaussage idiomatisch ist.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: ihr werdet meine Zeugen sein
  rationale: Die Formulierung gibt das Futur von εἰμί direkt wieder; μου bezeichnet die Zugehörigkeit zu Jesus, und μάρτυρες sind Menschen, die Zeugnis über ihn ablegen.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: in ganz Judäa und Samaria
  rationale: πάσῃ bezeichnet den gesamten geografischen Raum Judäas; die für Samaria mitzudenkende Präposition muss im Deutschen nicht wiederholt werden.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: bis ans Ende der Erde
  rationale: Die Übersetzung bewahrt den griechischen Singular und zugleich die idiomatische Bedeutung der äußersten geografischen Reichweite.
theological_decisions:
- issue: πνεῦμα als persönlicher göttlicher Referent
  choice: der Heilige Geist
  alternative: der heilige Geist / der Heilige Hauch
  rationale: Der bestimmte Ausdruck bezeichnet im Kontext den Heiligen Geist. Die übliche Großschreibung macht den personalen Referenten deutlich, ohne zusätzliche dogmatische Aussagen in den Vers einzutragen.
- issue: Bedeutung von μάρτυρες
  choice: meine Zeugen
  alternative: Zeugen für mich
  rationale: Der Genitiv μου lässt sich am unmittelbarsten als Zugehörigkeit beziehungsweise Beziehung zu Jesus ausdrücken. „Zeugen“ wahrt den Sinn des Zeugnisgebens und legt nicht die spätere Bedeutung „Märtyrer“ zugrunde.
- issue: Reichweite des Zeugnisauftrags
  choice: konkrete geografische Ausweitung bis ans Ende der Erde
  alternative: ausschließlich symbolische geistliche Geografie
  rationale: Die genannten Orte bilden eine reale geografische Folge von Jerusalem nach außen. Die Übersetzung bewahrt diese Folge und ihren weltweiten Horizont, ohne daraus ein weitergehendes kirchliches Schema abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, vermeidet jedoch unnatürliche Partizipialkonstruktionen. Die Ortsnamen und der geografische Fortschritt werden ausdrücklich bewahrt.
