  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: de
  text: den Platz dieses Dienstes und Apostelamtes einzunehmen, den Judas verlassen hat[a], um an seinen eigenen Ort zu gehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von dem Judas abgewichen ist“ oder „von dem Judas abgefallen ist“. Das griechische Verb kann ein Abweichen von oder Verlassen des Dienstes und Apostelamtes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Sein eigener Ort“ kann schlicht den Judas zukommenden Ort meinen oder zugespitzt den für ihn bestimmten Ort des Gerichts.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: einzunehmen
  rationale: Im Zusammenhang mit der Besetzung der frei gewordenen Aufgabe bezeichnet das Verb die Übernahme einer Stelle; „einnehmen“ ist dafür im Deutschen idiomatisch.
- source_word: τὸν τόπον
  choice: den Platz
  rationale: „Platz“ bewahrt das Bild des griechischen τόπος und lässt zugleich den Bezug auf eine Aufgabe oder Stellung erkennen.
- source_word: τῆς διακονίας ταύτης
  choice: in diesem Dienst
  rationale: διακονία bezeichnet hier den anvertrauten apostolischen Dienst. Die Formulierung ist natürlich und vermeidet eine unnötig institutionelle Engführung.
- source_word: καὶ ἀποστολῆς
  choice: und Apostelamt
  rationale: ἀποστολή meint hier die apostolische Beauftragung beziehungsweise Stellung, nicht bloß eine allgemeine Sendung. „Apostelamt“ gibt diesen konkreten Bezug verständlich wieder.
- source_word: ἀφ’ ἧς
  choice: von dem
  rationale: Das Relativpronomen bezieht sich sinngemäß auf den Platz in Dienst und Apostelamt; die Formulierung erhält die Bewegung weg von der anvertrauten Aufgabe.
- source_word: παρέβη
  choice: abgewichen ist
  rationale: παραβαίνω kann ein Überschreiten, Abweichen oder Verlassen bezeichnen. „Abgewichen“ gibt die Abkehr wieder, ohne bereits eine bestimmte dogmatische Deutung festzulegen.
- source_word: πορευθῆναι
  choice: um … zu gehen
  rationale: Die einfache Bewegungsbedeutung von πορεύομαι bleibt erhalten; die deutsche Infinitivkonstruktion gibt den Zusammenhang mit Judas’ Abweichen natürlich wieder.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: an seinen eigenen Ort
  rationale: Die knappe und deutungsoffene Wendung des Griechischen bleibt bestehen. Sie wird weder ausdrücklich auf das Grab noch auf den endgültigen Gerichtsort festgelegt.
theological_decisions:
- issue: Bedeutung von „seinen eigenen Ort“ für das Geschick des Judas
  choice: Die mehrdeutige Formulierung „an seinen eigenen Ort“ bleibt im Haupttext erhalten.
  alternative: Möglich wären eine ausdrückliche Deutung als Tod beziehungsweise Grab, als Gerichtsort oder als der Judas zukommende Ort.
  rationale: Der griechische Text benennt das Ziel nicht genauer. Eine Festlegung im Haupttext würde die theologische Spannung stärker auflösen, als es die Formulierung selbst erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dienst“ ist allgemein verständlich, während „Apostelamt“ die besondere Beauftragung präzisiert. Die Wiederaufnahme des Ortsbildes wird mit „Platz“ und „Ort“ weitgehend bewahrt; die ominöse Mehrdeutigkeit des letzten Ausdrucks bleibt ausdrücklich offen.
