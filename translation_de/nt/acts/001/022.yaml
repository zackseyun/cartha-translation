review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den von V. 21 fortwirkenden Zwang („muss“), die zeitliche Spanne, die Aufnahme Jesu, den gemeinsamen Zeugendienst und „einer von diesen“ insgesamt zuverlässig wieder. „Hinweg hinaufgenommen“ versucht zutreffend, sowohl ἀφ’ ἡμῶν als auch die Aufwärtsnuance von ἀνελήμφθη abzubilden, ist im Deutschen jedoch keine geläufige Verbindung.
  naturalness: Die Satzfügung ist als Fortsetzung des vorherigen Verses angemessen. „Von uns hinweg hinaufgenommen“ wirkt jedoch doppelt und stilistisch sperrig. „Von uns weg hinaufgenommen“ ist klarer und bewahrt beide Aspekte. Die Fußnote zu „Taufe des Johannes“ ist verständlich, sollte aber die Alternative nicht mit „beziehungsweise“ unnötig ausweiten.
  terminology: „Taufe des Johannes“, „Zeuge seiner Auferstehung“ und „zusammen mit uns“ sind sachgerecht und registerangemessen. Für τῆς ἀναστάσεως αὐτοῦ ist der Genitiv im Deutschen natürlich; keine konfessionell lenkende Deutung wird eingeführt.
  issues:
  - severity: low
    issue: Unnatürliche Wortverbindung „von uns hinweg hinaufgenommen“
    rationale: Die Verbindung häuft zwei deutsche Richtungsadverbien an. Sie ist zwar semantisch motiviert, klingt aber nicht nach modernem Standarddeutsch. „Von uns weg hinaufgenommen“ erhält die Trennung von den Jüngern und die Aufwärtsnuance des griechischen Verbs.
  - severity: low
    issue: Fußnote formuliert die beiden Erklärungen unnötig als gleichrangige Umschreibungen
    rationale: „Beziehungsweise“ kann den Eindruck erwecken, „Taufe“ und ein umfassendes „Taufwirken“ seien ohne Weiteres austauschbar. Die Fußnote sollte knapp als mögliche Kontextpräzisierung formuliert werden.
