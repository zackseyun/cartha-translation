  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: de
  text: angefangen mit der Taufe des Johannes[a] bis zu dem Tag, an dem er von uns weg hinaufgenommen wurde, muss einer von diesen zusammen mit uns Zeuge seiner Auferstehung werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Sinn des Zusammenhangs: mit der Taufe, die Johannes vollzog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: angefangen
  rationale: Das Partizip eröffnet den zeitlichen Rahmen, der bereits im vorhergehenden Vers syntaktisch eingebunden ist; „angefangen … bis“ gibt diesen Anschluss knapp wieder.
- source_word: ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: mit der Taufe des Johannes
  rationale: Die Formulierung bewahrt die griechische Genitivverbindung. Im Zusammenhang ist die von Johannes vollzogene Taufe beziehungsweise sein Taufwirken gemeint; eine Fußnote macht dies deutlich.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: bis zu dem Tag, an dem
  rationale: Dies gibt die zeitliche Grenze und den Relativsatz in natürlichem modernem Deutsch wieder.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: von uns hinweg hinaufgenommen wurde
  rationale: „Hinaufgenommen“ bewahrt die im Verb liegende Aufwärtsrichtung, ohne den Text zu „in den Himmel aufgefahren“ auszuweiten; „von uns hinweg“ gibt die Trennung durch ἀφ’ ἡμῶν wieder.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: Zeuge seiner Auferstehung
  rationale: Der deutsche Genitiv ist natürlich und entspricht unmittelbar der griechischen Genitivkonstruktion.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: zusammen mit uns … werden
  rationale: Die Wendung bezeichnet den Eintritt des Ausgewählten in den gemeinsamen apostolischen Auferstehungszeugendienst.
- source_word: ἕνα τούτων
  choice: einer von diesen
  rationale: Die Übersetzung fügt kein Substantiv hinzu, das in diesem Vers nicht ausdrücklich steht; der Bezug ergibt sich aus Vers 21.
theological_decisions:
- issue: Fortgeltende Notwendigkeit aus Vers 21
  choice: „muss“ wird ausdrücklich wiedergegeben
  alternative: Nur den Infinitiv „werden“ wiedergeben und die Notwendigkeit aus dem vorhergehenden Vers erschließen lassen
  rationale: Der Vers hängt syntaktisch von δεῖ in Vers 21 ab. Im Deutschen ist „muss“ nötig, damit die fortgeführte Satzkonstruktion verständlich und inhaltlich vollständig bleibt.
- issue: Bezeichnung der Aufnahme Jesu
  choice: „hinaufgenommen wurde“
  alternative: „auffuhr“ oder „in den Himmel aufgenommen wurde“
  rationale: Die gewählte Form bewahrt das Passiv und die Aufwärtsrichtung des griechischen Verbs, ohne Ziel oder nähere Deutung hinzuzufügen, die in diesem Vers nicht ausdrücklich genannt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt erkennbar eine syntaktische Fortsetzung von Vers 21. „Hinweg hinaufgenommen“ ist bewusst etwas feierlicher, bewahrt jedoch sowohl die Trennung von den Jüngern als auch die räumliche Nuance des griechischen Verbs.
