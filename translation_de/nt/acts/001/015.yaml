source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: de
  text: 'Und in diesen Tagen stand Petrus inmitten der Brüder[a] auf und sagte (wobei etwa hundertzwanzig Personen[b] versammelt waren):'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Brüder und Schwestern«. Im Griechischen steht »Brüder«; hier kann damit die ganze Gemeinschaft der Glaubenden einschließlich der Frauen gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »eine Schar von Namen«; gemeint sind die gezählten Menschen.'
    reason: source_idiom
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand … auf
  rationale: Das Aoristpartizip bezeichnet hier die konkrete Handlung, mit der Petrus zu seiner Rede ansetzt; „stand … auf“ ist im Deutschen natürlich und quellennah.
- source_word: ἐν μέσῳ
  choice: inmitten
  rationale: Die Wiedergabe bewahrt die räumliche Vorstellung, dass Petrus innerhalb der versammelten Gruppe aufsteht.
- source_word: ἀδελφῶν
  choice: Brüder
  rationale: Die maskuline Pluralform wird im Haupttext sichtbar erhalten; dass sie in diesem Zusammenhang wahrscheinlich die gesamte Gemeinschaft einschließlich Frauen bezeichnet, wird in einer Fußnote erläutert.
- source_word: ὄχλος ὀνομάτων
  choice: Personen
  rationale: Wörtlich steht eine ungewöhnliche Wendung mit „Namen“, die hier die gezählten Menschen bezeichnet. „Personen“ gibt den idiomatischen Sinn in natürlichem Deutsch wieder; die Bildlichkeit des Ausgangstextes wird in einer Fußnote dokumentiert.
- source_word: ἐπὶ τὸ αὐτό
  choice: versammelt
  rationale: Die Wendung beschreibt das Zusammenkommen an einem Ort; „versammelt“ bringt dies knapp und idiomatisch zum Ausdruck.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: etwa hundertzwanzig
  rationale: ὡς kennzeichnet vor einer Zahl eine ungefähre Angabe; „etwa“ gibt diese Näherung klar wieder.
- source_word: τε
  choice: dabei
  rationale: Das anschließende τε verbindet die eingeschobene Angabe mit der Erzählung. „Dabei“ wahrt den Zusammenhang in natürlichem Deutsch.
theological_decisions:
- issue: Geschlechtlicher Bezug von ἀδελφῶν innerhalb der versammelten Gemeinschaft
  choice: Im Haupttext „Brüder“, ergänzt durch eine Fußnote zum möglichen inklusiven Bezug
  alternative: „Brüder und Schwestern“ oder „Gläubige“
  rationale: So bleibt die grammatisch maskuline Bezeichnung des griechischen Textes erkennbar, ohne den wahrscheinlichen Einbezug der Frauen in der versammelten Glaubensgemeinschaft zu verschweigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der griechische Einschub wird durch Gedankenstriche kenntlich gemacht; der Doppelpunkt leitet die in den folgenden Versen einsetzende Rede ein.
