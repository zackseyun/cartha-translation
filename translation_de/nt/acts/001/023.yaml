id: ACT.1.23
reference: Acts 1:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: de
  text: 'Und sie stellten zwei auf[a]: Josef, genannt Barsabbas, der auch Justus genannt wurde, und Matthias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie stellten zwei vor“ beziehungsweise „sie schlugen zwei vor“. Das griechische Verb kann bedeuten, Personen vor eine Gruppe zu stellen; hier geht es wahrscheinlich darum, sie als Kandidaten vorzuschlagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: stellten … auf
  rationale: Im Auswahlzusammenhang bezeichnet das Verb, dass zwei Männer der versammelten Gruppe als Kandidaten vorgestellt beziehungsweise vorgeschlagen wurden. „Aufstellen“ bewahrt den Verfahrenscharakter, ohne bereits eine endgültige Ernennung auszudrücken.
- source_word: δύο
  choice: zwei
  rationale: Das Zahlwort bezeichnet die beiden vorgeschlagenen Männer.
- source_word: καλούμενον
  choice: genannt
  rationale: Das Partizip führt eine weitere Namensbezeichnung Josefs ein; „genannt“ ist im Deutschen natürlich und präzise.
- source_word: Βαρσαββᾶν
  choice: Barsabbas
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: ἐπεκλήθη
  choice: auch Justus genannt wurde
  rationale: Die Passivform führt einen weiteren Namen oder Beinamen ein. „auch“ verdeutlicht natürlich das Verhältnis zu der vorausgehenden Namensangabe, ohne den Sinn zu erweitern.
- source_word: Ἰοῦστος
  choice: Justus
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: Μαθθίαν
  choice: Matthias
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: καὶ … καὶ
  choice: Und … und
  rationale: Die Wiedergabe erhält sowohl den erzählerischen Anschluss als auch die Verbindung der beiden Kandidaten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sie stellten zwei auf“ ist im Deutschen für die Benennung von Kandidaten idiomatisch und lässt offen, ob die Gemeinde oder die zuvor genannten Beteiligten handelten. Die doppelte Namensangabe bleibt eng an der griechischen Satzstruktur.
