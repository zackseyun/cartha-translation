  source_fidelity: Die Übersetzung gibt καὶ ἔστησαν δύο treffend als Benennung zweier Kandidaten wieder. Die beiden Namens- bzw. Beinamensangaben zu Josef sowie die koordinierte Nennung des Matthias entsprechen dem griechischen Satzbau und Sinn. Das ergänzende „auch“ bei Justus verdeutlicht lediglich die zweite Namensangabe und legt nichts Zusätzliches fest.
