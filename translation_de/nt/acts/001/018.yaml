  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: de
  text: Dieser Mann nun erwarb mit dem Lohn der Ungerechtigkeit ein Feld[a], und als er kopfüber stürzte[b], platzte er in der Mitte auf, und alle seine Eingeweide quollen heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „erwarb aus dem Lohn der Ungerechtigkeit ein Feld“. „Erwarb“ kann auch bedeuten, dass das Feld durch das mit Judas verbundene Geld in seinen Besitz kam; ein persönlicher Kauf wird nicht ausdrücklich gesagt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „als er vornüber zu liegen kam“ beziehungsweise „als er auf das Gesicht fiel“. Der griechische Ausdruck beschreibt eine kopfüber oder bäuchlings gerichtete Lage und wahrscheinlich einen entsprechenden Sturz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Dieser Mann nun
  rationale: Οὗτος verweist auf Judas zurück; μέν οὖν führt den Bericht weiter. „Dieser Mann nun“ erhält Rückverweis und Übergang in würdigem, verständlichem Deutsch.
- source_word: ἐκτήσατο
  choice: erwarb
  rationale: κτάομαι bezeichnet den Erwerb oder das Erlangen von Besitz. „Erwarb“ legt nicht fest, dass Judas das Feld persönlich kaufte.
- source_word: χωρίον
  choice: ein Feld
  rationale: χωρίον bezeichnet hier ein Feld beziehungsweise ein Grundstück; „Feld“ ist im Kontext prägnant und natürlich.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: von dem Lohn der Ungerechtigkeit
  rationale: Die Formulierung wahrt ἐκ sowie die bewusst moralisch aufgeladene Genitivverbindung, ohne sie zu einer bloßen Zweckangabe umzuformen.
- source_word: πρηνὴς γενόμενος
  choice: als er kopfüber stürzte
  rationale: πρηνής beschreibt eine vornüber beziehungsweise kopfüber gerichtete Lage oder Bewegung. Die Wiedergabe drückt den wahrscheinlichen Vorgang idiomatisch aus; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: ἐλάκησεν μέσος
  choice: barst er mitten entzwei
  rationale: λακάω bedeutet aufbersten oder aufreißen; μέσος bezeichnet hier die Mitte. „Mitten entzwei“ gibt das gewaltsame Aufplatzen anschaulich wieder.
- source_word: ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ
  choice: alle seine Eingeweide quollen heraus
  rationale: ἐκχέω bezeichnet das Ausgießen beziehungsweise Herausströmen; σπλάγχνα sind die inneren Organe oder Eingeweide. Die Formulierung ist konkret, verständlich und dem drastischen Erzählton angemessen.
theological_decisions:
- issue: Verhältnis des Judas zum Erwerb des Feldes
  choice: „erwarb“ statt „kaufte“
  alternative: Judas kaufte das Feld persönlich; oder das Feld wurde mit seinem Geld beziehungsweise auf seine Rechnung erworben.
  rationale: Der griechische Text schreibt Judas den Erwerb zu, bestimmt aber den rechtlichen oder praktischen Vorgang nicht genauer. Die Übersetzung bewahrt diese Spannung gegenüber Matthäus 27,5–8, statt sie harmonisierend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst enger Anlehnung an die griechische Satzfolge. Die drastische Körperbeschreibung bleibt ungemildert. „Lohn der Ungerechtigkeit“ bewahrt die markante biblische Ausdrucksweise; Fußnoten erläutern echte lexikalische und erzählerische Mehrdeutigkeit.
