  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: de
  text: Und sie losten zwischen den beiden[a]. Das Los fiel auf Matthias, und er wurde zu den elf Aposteln hinzugezählt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie gaben ihnen Lose.« Gemeint ist das Losverfahren zwischen den beiden Kandidaten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »er wurde den elf Aposteln zugerechnet« bzw. »er wurde den elf Aposteln hinzugefügt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: sie warfen das Los über die beiden
  rationale: Die wörtliche Formulierung »sie gaben ihnen Lose« bezeichnet hier idiomatisch das Losverfahren zwischen den beiden zuvor genannten Kandidaten. Der Singular »das Los« entspricht natürlichem modernem Deutsch; »über die beiden« macht den Bezug des Pronomens deutlich, ohne den Vorgang näher auszudeuten.
- source_word: κλήρους / ὁ κλῆρος
  choice: das Los / Das Los
  rationale: Im Erzählzusammenhang bezeichnet κλῆρος das zur Auswahl verwendete Los, nicht Anteil oder Erbteil. Deutsch kann das Verfahren idiomatisch mit dem Kollektivsingular »das Los werfen« wiedergeben, während anschließend dasselbe Wort für das Ergebnis steht.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: Das Los fiel auf Matthias
  rationale: Die deutsche Wendung bewahrt sowohl die konkrete Losvorstellung als auch die Präposition ἐπί und ist natürlich verständlich.
- source_word: Μαθθίαν
  choice: Matthias
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: συγκατεψηφίσθη
  choice: wurde hinzugezählt
  rationale: Das Verb bezeichnet, dass Matthias gemeinsam mit einer bestehenden Gruppe gezählt beziehungsweise ihr zugerechnet wurde. »Hinzugezählt« ist knapp, quellennah und vermeidet eine weitergehende Amts- oder Einsetzungsdeutung.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: zu den elf Aposteln
  rationale: In Verbindung mit »hinzugezählt« gibt »zu« die Zugehörigkeit zur Gruppe im Deutschen idiomatisch wieder; die elf Apostel werden aus der Perspektive vor Matthias’ Aufnahme bezeichnet.
theological_decisions:
- issue: Ob συγκατεψηφίσθη eine über den Erzählbericht hinausgehende göttliche oder sakramentale Einsetzung ausdrückt
  choice: er wurde zu den elf Aposteln hinzugezählt
  alternative: er wurde den elf Aposteln hinzugefügt; er wurde den elf Aposteln zugerechnet
  rationale: Die Formulierung berichtet Matthias’ Aufnahme in den Kreis nach dem Losentscheid, ohne eine stärkere ekklesiologische Aussage in das Verb hineinzulegen.
- issue: Wie ausdrücklich das Losverfahren als menschliches oder göttliches Handeln zu kennzeichnen ist
  choice: sie warfen das Los; das Los fiel auf Matthias
  alternative: Gott ließ das Los auf Matthias fallen
  rationale: Das Subjekt des ersten Verbs ist die versammelte Gruppe; beim Fallen des Loses nennt der griechische Text keinen handelnden Gott. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bilden den Ablauf klar ab. »Hinzugezählt« bewahrt die Bedeutung des seltenen griechischen Verbs, ohne eine konfessionell geprägte Einsetzungslehre vorauszusetzen.
