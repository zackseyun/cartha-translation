source:
  edition: SBLGNT
  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: de
  text: Als er wegging, blickten sie ihm unverwandt zum Himmel[a] nach; und siehe, zwei Männer standen bei ihnen in weißen Gewändern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Himmel“ im Sinn von „Luftraum“ oder „Himmel/Sky“ bezeichnen. Im Zusammenhang der Himmelfahrt ist „Himmel“ gewählt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in weißen Kleidern“. Das griechische Wort bezeichnet Kleidung allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: unverwandt … hinaufsahen
  rationale: Das Partizip bezeichnet ein anhaltendes, festes und aufmerksames Hinschauen; „unverwandt hinaufsahen“ gibt dies natürlich und präzise wieder.
- source_word: οὐρανόν
  choice: Himmel
  rationale: οὐρανός kann „Himmel“ oder „Luftraum“ bedeuten. Im Zusammenhang der Himmelfahrt ist „Himmel“ sachgerecht, ohne die räumliche Bildsprache aufzuheben.
- source_word: πορευομένου αὐτοῦ
  choice: als er fortging
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig verlaufende Handlung. „Als er fortging“ wahrt die Bewegung, ohne bereits „auffuhr“ oder „verschwand“ einzutragen.
- source_word: ἰδοὺ
  choice: siehe, da
  rationale: Die Wendung markiert erzählerisch etwas Auffälliges. „Siehe, da“ bewahrt den feierlichen Aufmerksamkeitsruf und ist im biblischen Erzählregister verständlich.
- source_word: ἄνδρες δύο
  choice: zwei Männer
  rationale: ἀνήρ bezeichnet hier ausdrücklich Männer. Ihre mögliche Identität als Engel wird nicht in den Wortlaut hineingelesen.
- source_word: παρειστήκεισαν
  choice: standen … bei ihnen
  rationale: Die Form beschreibt, dass die Männer bei den Jüngern standen. „Erschienen“ würde ein plötzliches oder übernatürliches Auftreten hinzufügen, das das Verb selbst nicht ausdrücklich bezeichnet.
- source_word: ἐσθήσεσι λευκαῖς
  choice: in weißen Gewändern
  rationale: ἐσθής ist eine breite Bezeichnung für Kleidung. „Gewänder“ ist würdig und natürlich, ohne eine bestimmte Kleidungsform wie Roben festzulegen.
theological_decisions:
- issue: Bedeutung von οὐρανός im Zusammenhang der Himmelfahrt
  choice: Himmel
  alternative: Luftraum
  rationale: „Himmel“ entspricht dem theologischen Horizont der Szene und ist eine reguläre Bedeutung des griechischen Wortes. Die sichtbare Blickrichtung bleibt durch „hinaufsahen“ erhalten.
- issue: Identität der beiden Männer
  choice: zwei Männer
  alternative: zwei Engel
  rationale: Der Vers nennt sie ausdrücklich „Männer“. Eine Deutung als Engel mag sich aus dem weiteren Zusammenhang ergeben, soll aber nicht an die Stelle des Wortlauts treten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Erzählton. „Siehe, da“ erhält die markierte Aufmerksamkeitspartikel; „unverwandt“ gibt die Intensität des Blickens wieder. Die Wortstellung bleibt gut lesbar und folgt zugleich dem Ablauf der griechischen Szene.
