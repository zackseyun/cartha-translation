base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: de
  text: 'Als sie nun zusammengekommen waren, fragten sie ihn: „Herr, stellst du zu dieser Zeit das Königreich für Israel[a] wieder her?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Königreich Israel zurückgibst“. Der griechische Dativ kann einen Vorteil ausdrücken („für Israel“) oder Israel unmittelbarer als Empfänger der Wiederherstellung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Als sie nun zusammengekommen waren
  rationale: Das Partizip συνελθόντες wird hier temporal verstanden. „Nun“ gibt die fortführende Funktion von μὲν οὖν natürlich wieder, ohne die Partikeln übermäßig wörtlich abzubilden.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: fragten sie ihn
  rationale: Der Imperfekt wird im deutschen Erzählstil natürlich mit dem Präteritum wiedergegeben. Das inhaltseinleitende λέγοντες muss nicht eigens als „und sagten“ ausgedrückt werden, da der Doppelpunkt dieselbe Funktion erfüllt.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ bewahrt sowohl die respektvolle Anrede als auch das mögliche theologische Gewicht des Titels.
- source_word: εἰ ἐν τῷ χρόνῳ τούτῳ
  choice: stellst du in dieser Zeit
  rationale: εἰ leitet eine direkte Entscheidungsfrage ein und wird im Deutschen durch die Verb-Erst-Stellung ausgedrückt. „In dieser Zeit“ bewahrt den Bezug auf einen Zeitraum und vermeidet die Verengung auf einen bloßen Augenblick.
- source_word: ἀποκαθιστάνεις
  choice: stellst du … wieder her
  rationale: Die Wendung gibt die Wiederherstellung eines früheren Zustands klar wieder. Das Präsens bleibt erhalten und kann sowohl gegenwärtiges Handeln als auch ein unmittelbar bevorstehendes Geschehen bezeichnen.
- source_word: τὴν βασιλείαν
  choice: das Königreich
  rationale: βασιλεία kann Herrschaft oder Königreich bezeichnen. In Verbindung mit Israel lässt „Königreich“ die konkrete Erwartung der Fragenden hervortreten, ohne ihre genaue Art festzulegen.
- source_word: τῷ Ἰσραήλ
  choice: für Israel
  rationale: Der Dativ lässt sich als Dativ des Vorteils („für Israel“) oder als Empfänger der Wiederherstellung („an Israel“) verstehen. Im Haupttext steht die im Deutschen natürlichere Lesart; die Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Art der Erwartung der Jünger hinsichtlich des Königreichs Israels
  choice: Die Frage wird als Wiederherstellung des Königreichs für Israel wiedergegeben, ohne diese Erwartung als rein politisch oder rein geistlich zu deuten.
  alternative: „das Königreich an Israel zurückgibst“ beziehungsweise „Israels Königreich wiederherstellst“
  rationale: Der Vers berichtet die Frage der Jünger, ohne an dieser Stelle alle darin enthaltenen Voraussetzungen zu bestätigen oder zu korrigieren. Die Übersetzung bewahrt deshalb die historische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt ersetzt das im Deutschen schwerfällige „indem sie sagten“. Die Formulierung wahrt die Mehrdeutigkeit des Dativs und deutet die Erwartung der Jünger nicht konfessionell aus.
