  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: de
  text: Es waren mehr als vierzig, die diese Verschwörung geschmiedet hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: mehr als vierzig
  rationale: Die Verbindung des Komparativs πλείους mit der Zahl τεσσεράκοντα bedeutet idiomatisch „mehr als vierzig“. Die deutsche Formulierung gibt die Mengenangabe klar wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Substantiv hinzuzufügen.
- source_word: συνωμοσίαν
  choice: Verschwörung
  rationale: συνωμοσία bezeichnet eine geheime, gemeinschaftliche Verabredung beziehungsweise Verschwörung. „Verschwörung“ entspricht dem formalen Sinn und vermeidet, Einzelheiten aus dem weiteren Zusammenhang in das Wort selbst hineinzutragen.
- source_word: ποιησάμενοι
  choice: eingegangen waren
  rationale: Das Aorist-Medium-Partizip von ποιέω bildet mit συνωμοσίαν eine Verbindung im Sinn von eine Verschwörung zustande bringen beziehungsweise eingehen. Im Deutschen ist „eine Verschwörung eingehen“ natürlich und lässt die Beteiligung der Handelnden erkennen.
- source_word: ἦσαν δὲ
  choice: Es waren
  rationale: ἦσαν führt hier die Existenz beziehungsweise Anzahl der Gruppe ein. Das leicht verbindende δέ muss im flüssigen deutschen Satz nicht eigens mit „aber“ oder „nun“ ausgedrückt werden.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: die diese Verschwörung eingegangen waren
  rationale: Der Artikel mit dem Partizip bezeichnet substantivisch diejenigen, die gehandelt hatten. Ein Relativsatz gibt diese Struktur in natürlichem Deutsch wieder; das Plusquamperfekt wahrt die Vorzeitigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur bleibt erhalten; auf eine Fußnote zur bloßen Stilvariante „über vierzig“ wird verzichtet, da keine inhaltliche Mehrdeutigkeit entsteht.
