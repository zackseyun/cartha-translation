id: ACT.23.16
reference: Acts 23:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: de
  text: Als aber der Sohn von Paulus’ Schwester von dem Hinterhalt[a] hörte, kam er, ging in die Kaserne[b] hinein und berichtete Paulus davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von dem Komplott“. Das griechische Wort bezeichnet genauer einen Hinterhalt oder das Auflauern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in das Lager“. In diesem Zusammenhang ist wahrscheinlich die römische Kaserne gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: Als ... hörte
  rationale: Das Aoristpartizip bezeichnet hier eine der Haupthandlung vorausgehende Wahrnehmung; die temporale Wiedergabe ist im Deutschen natürlich.
- source_word: δὲ
  choice: aber
  rationale: 'Markiert den erzählerischen Fortgang mit leichtem Kontrast: Der geplante Anschlag wird entdeckt.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: der Sohn von Paulus’ Schwester
  rationale: Bewahrt die ausdrückliche Verwandtschaftsangabe des Griechischen genauer als die kürzere Bezeichnung „Paulus’ Neffe“.
- source_word: τὴν ἐνέδραν
  choice: den Hinterhalt
  rationale: ἐνέδρα bezeichnet konkret einen Hinterhalt beziehungsweise das Auflauern und gibt den geplanten Angriff präziser wieder als das allgemeinere „Komplott“.
- source_word: παραγενόμενος
  choice: kam er
  rationale: Das Partizip bezeichnet sein Eintreffen vor dem Hineingehen; als finite Verbfolge klingt dies im Deutschen natürlich.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: ging in die Kaserne hinein
  rationale: παρεμβολή kann „Lager“ oder „Kaserne“ bedeuten; im Zusammenhang des römischen Gewahrsams in Jerusalem ist „Kaserne“ wahrscheinlich.
- source_word: ἀπήγγειλεν
  choice: berichtete ... davon
  rationale: ἀπαγγέλλω bezeichnet das Überbringen beziehungsweise Melden einer Nachricht; „davon“ nimmt den zuvor genannten Hinterhalt idiomatisch wieder auf.
- source_word: τῷ Παύλῳ
  choice: Paulus
  rationale: Der Dativ bezeichnet den Empfänger der Mitteilung; beim deutschen Verb „berichten“ steht die Person ebenfalls im Dativ.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ausdrückliche Verwandtschaftsbezeichnung bleibt erhalten; die Partizipien werden für einen natürlichen deutschen Erzählfluss als aufeinanderfolgende Verben wiedergegeben.
