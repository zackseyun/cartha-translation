source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: de
  text: Die Soldaten nahmen also Paulus, wie ihnen befohlen worden war, und brachten ihn in der Nacht nach Antipatris.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Die Soldaten … also
  rationale: οὖν führt die Erzählung folgernd weiter; μέν bereitet den Gegensatz beziehungsweise Fortgang im nächsten Vers vor, wird im Deutschen hier aber natürlicherweise nicht eigens wiedergegeben.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: wie es ihnen befohlen worden war
  rationale: Das substantivierte Perfektpassiv-Partizip bezeichnet den bereits erteilten Befehl. Die Formulierung bewahrt Passiv und Vorzeitigkeit in natürlichem Deutsch.
- source_word: ἀναλαβόντες
  choice: nahmen … Paulus
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Begleithandlung. „nahmen“ gibt dies knapp wieder, ohne die nicht ausdrücklich genannte Bedeutung „in Gewahrsam nehmen“ oder „eskortieren“ einzutragen.
- source_word: ἤγαγον
  choice: brachten ihn
  rationale: ἄγω kann „führen“, „bringen“ oder „mitnehmen“ bedeuten. Mit dem genannten Zielort und dem Transport unter Bewachung ist „brachten ihn … nach“ idiomatisch und sachgerecht.
- source_word: διὰ νυκτός
  choice: während der Nacht
  rationale: διά mit dem Genitiv bezeichnet hier den Zeitraum, in dem die Handlung stattfand. „während der Nacht“ wahrt die zeitliche Bedeutung, ohne zwingend zu behaupten, die Reise habe die ganze Nacht gedauert.
- source_word: Ἀντιπατρίδα
  choice: Antipatris
  rationale: Der Ortsname wird gemäß der üblichen deutschen neutestamentlichen Namensform transliteriert.
