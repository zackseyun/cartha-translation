  verdict: revise
  source_fidelity: Der Entwurf gibt die narrative Folgerung von οὖν, den vorausliegenden an die Soldaten ergangenen Befehl (κατὰ τὸ διατεταγμένον αὐτοῖς), die Übernahme des Paulus und die nächtliche Überführung nach Antipatris zutreffend wieder. Das unmarkierte μέν muss im Deutschen nicht separat abgebildet werden.
  naturalness: „wie es ihnen befohlen worden war“ ist verständlich, wirkt mit dem unpersönlichen „es“ jedoch etwas schwerfällig. „wie ihnen befohlen worden war“ ist idiomatischer und lässt den Bezug auf den zuvor ergangenen Befehl klarer hervortreten. „in der Nacht“ ist eine natürliche, neutrale Wiedergabe von διὰ νυκτός.
  terminology: „Soldaten“, „Paulus“ und „Antipatris“ entsprechen dem griechischen Text und dem üblichen modernen deutschen Bibelgebrauch. Es sind keine theologischen Fachbegriffe betroffen.
