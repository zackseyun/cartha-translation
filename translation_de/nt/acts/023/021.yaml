id: ACT.23.21
reference: Acts 23:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: de
  text: Lass dich also nicht von ihnen überreden; denn mehr als vierzig Männer aus ihren Reihen liegen ihm auf der Lauer. Sie haben sich unter einen Fluch gestellt,[a] weder zu essen noch zu trinken, bis sie ihn getötet haben. Jetzt stehen sie bereit und warten auf deine Zusage.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben sich durch einen Eid verpflichtet“. Der griechische Ausdruck schließt den Gedanken ein, dass sie einen Fluch auf sich herabrufen, falls sie ihr Vorhaben nicht ausführen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Sie warten auf deine Zustimmung oder Genehmigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: dich … überreden
  rationale: Das passive Verb bezeichnet hier, sich von der Bitte der Gegner bestimmen zu lassen; „dich nicht … überreden“ ist im Deutschen natürlich und bewahrt den Gedanken des Überzeugtwerdens.
- source_word: ἐνεδρεύουσιν
  choice: liegen ihm auf der Lauer
  rationale: Die Wendung gibt das konkrete Bild eines feindlichen Hinterhalts wieder und klingt im modernen Deutschen natürlicher als „liegen im Hinterhalt“.
- source_word: ἐξ αὐτῶν
  choice: aus ihren Reihen
  rationale: Dies macht deutlich, dass die Männer aus der zuvor genannten Gruppe stammen.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: mehr als vierzig Männer
  rationale: Natürliche und genaue Wiedergabe des Komparativs mit der Zahl.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: haben sich unter einen Fluch gestellt
  rationale: Die Formulierung bewahrt den Gedanken der Selbstverfluchung für den Fall, dass das Gelübde nicht erfüllt wird; eine bloße Wiedergabe mit „schwören“ würde diesen Aspekt abschwächen.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: weder zu essen noch zu trinken
  rationale: Bewahrt die korrelative Struktur und den feierlichen Inhalt der Verpflichtung.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: bis sie ihn getötet haben
  rationale: ἀναιρέω bezeichnet im Kontext gewaltsames Töten; das Perfekt im Deutschen stellt die vollendete Tat als Grenze des Gelübdes heraus.
- source_word: εἰσιν ἕτοιμοι
  choice: stehen sie bereit
  rationale: Idiomatiche deutsche Wiedergabe, die ihre unmittelbare Handlungsbereitschaft ausdrückt.
- source_word: προσδεχόμενοι
  choice: warten auf
  rationale: Das Partizip bezeichnet erwartungsvolles Warten auf die Reaktion des Kommandanten.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: deine Zusage
  rationale: ἐπαγγελία bedeutet grundsätzlich „Versprechen/Zusage“; im Zusammenhang ist die erwartete Zustimmung beziehungsweise Genehmigung gemeint. „Zusage“ bewahrt den Wortgedanken und ist im Deutschen kontextgerecht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Warnung bleibt nachdrücklich; konkrete Bilder wie „auf der Lauer liegen“ und der im Griechischen enthaltene Fluchcharakter werden bewahrt. Die Satzfolge wurde für gute deutsche Verständlichkeit behutsam gegliedert.
