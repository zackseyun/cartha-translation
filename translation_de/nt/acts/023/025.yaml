lexical_decisions:
- source_word: γράψας
  choice: Er schrieb
  rationale: Der Aoristpartizip bezeichnet die Abfassung des Briefes durch den im vorherigen Vers genannten Befehlshaber. Ein finites Verb gibt den griechischen Erzählzusammenhang im Deutschen natürlich wieder.
- source_word: ἐπιστολὴν
  choice: einen Brief
  rationale: ἐπιστολή bezeichnet hier eine schriftliche Mitteilung. „Brief“ ist die klare, heutige und im Erzählkontext angemessene Entsprechung.
- source_word: ἔχουσαν
  choice: in
  rationale: Das Partizip ἔχουσαν bestimmt „Brief“ näher. Die deutsche Wendung „in dieser Form“ gibt den Sinn knapp und idiomatisch wieder, ohne den folgenden Wortlaut bereits als bloßen Inhalt einzuengen.
- source_word: τύπον
  choice: Form
  rationale: τύπος bezeichnet hier die Gestalt, Fassung oder den Wortlaut des Briefes. „Form“ bewahrt die Breite des griechischen Ausdrucks.
- source_word: τοῦτον
  choice: dieser
  rationale: Das Demonstrativpronomen weist voraus auf den anschließend zitierten Brief.
