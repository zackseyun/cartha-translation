source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: de
  text: Als es Tag wurde, verschworen sich die Juden[a] und verpflichteten sich unter einem Fluch[b], weder zu essen noch zu trinken, bis sie Paulus getötet hätten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Juden«. Gemeint ist hier eine bestimmte Gruppe von Juden, die an dem Mordplan beteiligt war, nicht das jüdische Volk insgesamt.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »verfluchten sich selbst« bzw. »unterwarfen sich einem Fluch«. Sie bekräftigten ihre Verpflichtung durch einen Eid, der bei einem Bruch einen Fluch über sie selbst brachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Als es Tag geworden war
  rationale: Der Genitivus absolutus markiert den zeitlichen Übergang. Die Formulierung ist natürlich und bewahrt den Bezug auf den Tagesanbruch.
- source_word: ποιήσαντες συστροφὴν
  choice: verschworen sich
  rationale: Die Wendung bezeichnet hier ein organisiertes, gemeinsames Komplott. Das deutsche Verb verbindet Zusammenschluss und heimliche Mordabsicht idiomatisch.
- source_word: οἱ Ἰουδαῖοι
  choice: einige Juden
  rationale: Obwohl der griechische Ausdruck formal »die Juden« lautet, zeigt der unmittelbare Kontext eine begrenzte Gruppe von mehr als vierzig Männern. »Einige Juden« gibt den konkreten Referenten wieder und vermeidet eine sachlich falsche Verallgemeinerung; eine Fußnote dokumentiert die Form des Ausgangstextes.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: belegten sich selbst mit einem Fluch
  rationale: Die Formulierung bewahrt die Selbstverfluchung, mit der die Männer ihre Verpflichtung bekräftigten, ohne das im Deutschen missverständliche Fremdwort »anathematisieren« zu verwenden.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: Sie erklärten, weder zu essen noch zu trinken
  rationale: Der Infinitiv gibt den Inhalt ihrer Selbstverpflichtung an. Die deutsche Konstruktion bewahrt die paarige Verneinung knapp und verständlich.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: bis sie Paulus getötet hätten
  rationale: Der Konjunktiv mit ἕως οὗ bezeichnet den noch ausstehenden Endpunkt. Der deutsche Konjunktiv II im Rahmen der indirekten Wiedergabe stellt dies natürlich dar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit; »verschworen sich« vermeidet eine schwerfällige nominale Wiedergabe. Sämtliche Fußnotenmarker stehen im Haupttext.
