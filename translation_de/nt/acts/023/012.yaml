revisions:
- from: Als es Tag geworden war, verschworen sich einige Juden[a] und belegten sich selbst mit einem Fluch[b]. Sie erklärten, weder zu essen noch zu trinken, bis sie Paulus getötet hätten.
  to: Als es Tag wurde, verschworen sich die Juden[a] und verpflichteten sich unter einem Fluch[b], weder zu essen noch zu trinken, bis sie Paulus getötet hätten.
  rationale: Die Revision stellt die ausdrückliche Formulierung des griechischen Textes im Haupttext wieder her und bewahrt die notwendige kontextuelle Einordnung in einer Fußnote. Zugleich werden Tagesangabe und Eidesformel idiomatischer wiedergegeben, ohne die Selbstverpflichtung oder den noch ausstehenden Endpunkt der Handlung abzuschwächen.
