review_pass:
  verdict: revise
  source_fidelity: Die Einschränkung „einige Juden“ steht nicht im griechischen Text, der οἱ Ἰουδαῖοι („die Juden“) liest. Der Kontext grenzt die Referenz zwar auf die beteiligte Gruppe ein, doch dies sollte, wie im englischen Audit Trail, durch eine Fußnote erläutert werden. Die übrigen Sinnelemente – Tagesanbruch, organisierte Verschwörung, Selbstverpflichtung unter einem Fluch sowie Verzicht auf Essen und Trinken bis zur Tötung des Paulus – sind getroffen.
  naturalness: „Als es Tag wurde“ ist im modernen Standarddeutsch idiomatischer als „Als es Tag geworden war“. „Sich unter einem Fluch verpflichten“ gibt die selbstverfluchende Eidesverpflichtung klarer und natürlicher wieder als „sich selbst mit einem Fluch belegen“.
  terminology: „Die Juden“ wahrt die Formulierung des Ausgangstextes, ohne die im Kontext eindeutige begrenzte Referenz zu einer Aussage über das jüdische Volk insgesamt auszuweiten. Die Fußnote erläutert dies. Die Fußnote zum Fluch vermeidet die zusätzliche, im Vers nicht ausdrücklich genannte Bestimmung „Gottes Gericht“.
  issues:
  - severity: medium
    issue: „einige Juden“ engt οἱ Ἰουδαῖοι im Haupttext ein.
    rationale: Auch wenn die Erzählung eine konkrete Gruppe meint, lautet der griechische Ausdruck „die Juden“. Die kontextuelle Präzisierung gehört in die Anmerkung, nicht als nicht ausdrücklich markierte Einengung in den Text.
  - severity: low
    issue: Die Formulierung „belegten sich selbst mit einem Fluch“ ist schwerfälliger und weniger idiomatisch.
    rationale: Die griechische Wendung bezeichnet eine Selbstverpflichtung unter einer Selbstverwünschung; „verpflichteten sich unter einem Fluch“ vermittelt dies in natürlichem Deutsch.
  - severity: low
    issue: Die Fußnote b nennt ausdrücklich Gottes Gericht.
    rationale: Ein selbstauferlegter Fluch beziehungsweise eine Selbstverwünschung ist im Ausdruck enthalten, nicht jedoch eine explizite Nennung Gottes.
  revised_text: Als es Tag wurde, verschworen sich die Juden[a] und verpflichteten sich unter einem Fluch[b], weder zu essen noch zu trinken, bis sie Paulus getötet hätten.
