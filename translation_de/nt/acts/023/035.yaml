base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: de
  text: „Ich werde dich anhören[a]“, sagte er, „sobald auch deine Ankläger eintreffen.“ Dann befahl er, ihn im Prätorium[b] des Herodes unter Bewachung zu halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde dich vollständig anhören“ beziehungsweise „Ich werde deinen Fall anhören“. Das griechische Verb kann bedeuten, jemanden bis zum Ende anzuhören; hier steht es in einem gerichtlichen Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: Das Prätorium war die Amtsresidenz oder der Amtssitz eines römischen Statthalters; hier ist wahrscheinlich der Palast des Herodes in Cäsarea gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: Ich werde dich anhören
  rationale: διακούω kann ein vollständiges Anhören bezeichnen und hat hier einen gerichtlichen Bezug. „Dich anhören“ bleibt nahe an der griechischen Verbindung mit dem Genitivpronomen, klingt im Deutschen natürlich und legt nicht unnötig fest, ob ausdrücklich „den Fall verhandeln“ oder „vollständig anhören“ gemeint ist.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: wenn auch deine Ankläger eingetroffen sind
  rationale: ὅταν mit dem Konjunktiv bezeichnet ein künftig erwartetes, aber noch ausstehendes Eintreten. καί wird mit „auch“ bewahrt; κατήγοροί bezeichnet im Rechtskontext die Ankläger, und παραγένωνται ihr Eintreffen.
- source_word: κελεύσας
  choice: Dann befahl er
  rationale: Das Aoristpartizip wird für einen flüssigen deutschen Erzählstil als finites Verb wiedergegeben. „Dann“ macht die zeitliche Folge deutlich, ohne eine zusätzliche inhaltliche Beziehung einzutragen.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: im Prätorium des Herodes
  rationale: „Prätorium“ bewahrt den historischen Verwaltungsbegriff; der Genitiv wird natürlich mit „des Herodes“ wiedergegeben.
- source_word: φυλάσσεσθαι αὐτόν
  choice: ihn … unter Bewachung zu halten
  rationale: Die passive Infinitivkonstruktion bezeichnet fortdauernde Verwahrung beziehungsweise Bewachung. Die Formulierung vermeidet die stärkere, nicht notwendige Festlegung auf Strafhaft.
