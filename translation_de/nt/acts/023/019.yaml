source:
  edition: SBLGNT
  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: de
  text: 'Da nahm der Kommandant ihn bei der Hand, ging mit ihm beiseite und fragte ihn unter vier Augen: »Was hast du mir zu berichten?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: nahm ihn bei der Hand
  rationale: Die Wendung mit dem Genitiv bezeichnet das Ergreifen beziehungsweise Nehmen der Hand. Die gewählte Formulierung ist im Deutschen idiomatisch, bewahrt die konkrete Handlung und unterstellt keine unnötige Gewalt.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter. „Da“ gibt den narrativen Anschluss im modernen Deutschen natürlich wieder, ohne einen starken Gegensatz auszudrücken.
- source_word: ὁ χιλίαρχος
  choice: der Kommandant
  rationale: χιλίαρχος bezeichnet hier den ranghohen römischen Truppenführer. „Kommandant“ ist verständlich und kontextgerecht; „Chiliarch“ wäre unnötig fachsprachlich, „Tribun“ historisch genauer, aber weniger allgemein verständlich.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: ging mit ihm beiseite ... unter vier Augen
  rationale: ἀναχωρέω bezeichnet das Sichentfernen beziehungsweise Beiseitegehen, κατ’ ἰδίαν die private Situation. Die deutsche Wiedergabe macht den im Kontext eindeutig beteiligten jungen Mann ausdrücklich und klingt natürlich.
- source_word: ἐπυνθάνετο
  choice: fragte ihn
  rationale: Der Imperfekt kann den einsetzenden oder fortlaufenden Vorgang hervorheben. Im Deutschen ist vor der unmittelbar folgenden direkten Frage das schlichte „fragte“ natürlicher als „begann ihn zu fragen“.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Was hast du mir zu berichten?
  rationale: Die idiomatische Frage gibt die Konstruktion mit ἔχεις und Infinitiv knapp wieder. „Berichten“ bewahrt den Sinn des Übermittelns einer Nachricht und passt zum militärisch-rechtlichen Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die konkrete, vertrauliche Geste bleibt erhalten; die militärische Amtsbezeichnung wird allgemein verständlich wiedergegeben.
