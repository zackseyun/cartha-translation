  text: κτήνη τε παραστῆσαι ἵνα ἐπιβιβάσαντες τὸν Παῦλον διασώσωσι πρὸς Φήλικα τὸν ἡγεμόνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/024.yaml
  text: and provide mounts[a], so that they may put Paul on them and bring him safely to Felix the governor[b],
translation:
  language: de
  text: Auch sollten sie Tiere[a] bereitstellen, damit sie Paulus auf sie setzen und ihn sicher zu Felix, dem Statthalter, bringen konnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reit- oder Lasttiere“; das griechische Wort legt weder Tierart noch genaue Verwendung fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήνη
  choice: Reittiere
  rationale: κτήνη bezeichnet allgemein Tiere zum Reiten oder Lastentragen, ohne die Tierart festzulegen. „Reittiere“ gibt hier die vorgesehene Funktion natürlich wieder, ohne „Pferde“ einzutragen.
- source_word: τε
  choice: auch
  rationale: τε verbindet diese Anweisung mit den vorausgehenden Befehlen; „auch“ trägt den ergänzenden Sinn im Deutschen idiomatisch.
- source_word: παραστῆσαι
  choice: bereitstellen
  rationale: Im abhängigen Befehlskontext geht es darum, die Tiere verfügbar und einsatzbereit zu machen.
- source_word: ἵνα
  choice: damit
  rationale: ἵνα leitet den Zweck der Bereitstellung ein.
- source_word: ἐπιβιβάσαντες
  choice: aufsitzen lassen
  rationale: Das Partizip bezeichnet hier, dass die Begleiter Paulus auf die Tiere setzen beziehungsweise ihn aufsteigen lassen. Die koordinierte deutsche Wiedergabe bewahrt die Handlungsfolge in natürlicher Form.
- source_word: διασώσωσι
  choice: sicher ... bringen
  rationale: διασῴζω betont in diesem Zusammenhang, dass Paulus trotz der Gefahr wohlbehalten sein Ziel erreicht.
- source_word: πρὸς
  choice: zu
  rationale: πρός bezeichnet hier die Bewegung zu einer Person hin.
- source_word: ἡγεμόνα
  choice: Statthalter
  rationale: ἡγεμών bezeichnet hier Felix als römischen Provinzstatthalter; „Statthalter“ ist historisch passend und allgemein verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz schließt als Fortsetzung an den vorausgehenden Befehl an; deshalb stehen die abhängigen Verben im Konjunktiv Präteritum. Die Tierart wird bewusst nicht als „Pferde“ präzisiert.
