id: ACT.23.33
reference: Acts 23:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: de
  text: Als sie nach Cäsarea gekommen waren und dem Statthalter den Brief übergeben hatten, führten sie ihm auch Paulus vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stellten sie ihm auch Paulus vor“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: sie
  rationale: Das Pronomen bezieht sich auf die Begleitmannschaft aus dem vorherigen Vers; im Deutschen ist ein selbstständiges „sie“ im temporalen Satz natürlich.
- source_word: εἰσελθόντες εἰς τὴν Καισάρειαν
  choice: als sie nach Cäsarea gekommen waren
  rationale: Der temporale Nebensatz gibt die Vorzeitigkeit des Aoristpartizips gegenüber den Hauptverben idiomatisch wieder; bei einer Stadt ist „nach Cäsarea kommen“ natürliches Deutsch.
- source_word: ἀναδόντες
  choice: übergeben hatten
  rationale: Im Zusammenhang mit einem amtlichen Schreiben bezeichnet das Verb dessen förmliche Aushändigung an den zuständigen Amtsträger.
- source_word: ἐπιστολήν
  choice: Brief
  rationale: „Brief“ ist die geläufige und kontextgemäße Bezeichnung für das amtliche Schreiben.
- source_word: ἡγεμόνι
  choice: Statthalter
  rationale: „Statthalter“ bezeichnet den römischen Provinzamtsträger hier präzise und ist im Deutschen gut verständlich.
- source_word: παρέστησαν
  choice: führten … vor
  rationale: In diesem amtlich-rechtlichen Zusammenhang bedeutet das Verb, eine Person vor eine Autorität zu bringen beziehungsweise ihr vorzuführen.
- source_word: καὶ
  choice: auch
  rationale: Das zweite καί fügt die Vorführung des Paulus zur Übergabe des Briefes hinzu.
- source_word: Παῦλον
  choice: Paulus
  rationale: Dies ist die traditionelle und standardsprachliche deutsche Namensform.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen verweist auf den Statthalter und verbindet sich idiomatisch mit „jemandem jemanden vorführen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wahrt die zeitliche Abfolge des griechischen Partizipialgefüges, ohne schwerfällig zu wirken. Die amtliche Situation wird durch „Statthalter“, „übergeben“ und „vorführen“ klar erkennbar.
