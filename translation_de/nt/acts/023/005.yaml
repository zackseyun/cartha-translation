source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: de
  text: 'Da sagte Paulus: „Ich wusste nicht, Brüder, dass er der Hohepriester ist; denn es steht geschrieben: ‚Über einen Obersten deines Volkes sollst du nicht schlecht reden.‘[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Einen Obersten deines Volkes sollst du nicht beschimpfen.“'
    reason: Lexikalische Alternative für οὐκ ἐρεῖς κακῶς; die Formulierung kann stärker als bloßes Schlechtreden verstanden werden.
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: Da sagte Paulus
  rationale: τέ verbindet die Antwort locker mit dem Vorhergehenden; „Da sagte Paulus“ gibt den Erzählfluss im Deutschen natürlich wieder.
- source_word: Οὐκ ᾔδειν
  choice: Ich wusste nicht
  rationale: Die Form von οἶδα bezeichnet hier fehlendes Wissen; die schlichte deutsche Wiedergabe bleibt nah am griechischen Wortlaut und lässt die genaue Ursache dieses Nichtwissens offen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der maskuline Vokativ passt zur Anrede an den Hohen Rat und wird geschlechtsgenau wiedergegeben.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: dass er der Hohe Priester ist
  rationale: Das Präsens ἐστίν wird bewahrt; der bestimmte Amtstitel ist im Deutschen idiomatisch „der Hohe Priester“.
- source_word: γέγραπται γὰρ
  choice: denn es steht geschrieben
  rationale: Die geläufige Schriftformel gibt den resultativen Sinn des griechischen Perfekts natürlich und würdig wieder.
- source_word: Ἄρχοντα
  choice: einen Obersten
  rationale: ἄρχων bezeichnet hier allgemein eine Person in leitender oder herrschender Stellung. „Oberster“ bewahrt zudem den vertrauten Wortlaut des Zitats aus 2. Mose 22,27, ohne eine bestimmte Amtsbezeichnung einzutragen.
- source_word: τοῦ λαοῦ σου
  choice: deines Volkes
  rationale: Die knappe Genitivverbindung entspricht dem gemeinschaftsbezogenen Sinn von λαός und klingt im Deutschen natürlich.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: sollst du nicht schlecht reden
  rationale: Das Futur hat im Gesetzeszitat gebietende Kraft. „Schlecht reden“ gibt κακῶς breit und verständlich wieder; die stärkere mögliche Bedeutung „beschimpfen“ wird in der Fußnote genannt.
theological_decisions:
- issue: Art und Grund von Paulus’ Nichtwissen
  choice: Ich wusste nicht
  alternative: Ich hatte nicht erkannt
  rationale: Der Text erklärt nicht, ob Paulus die Person nicht erkannte, das Amt nicht kannte oder anders zu verstehen ist. Die Übersetzung bewahrt diese Spannung und ergänzt keine Erklärung.
- issue: Zeitform beim Amt des Hohen Priesters
  choice: dass er der Hohe Priester ist
  alternative: dass er der Hohe Priester war
  rationale: Die Übersetzung folgt dem griechischen Präsens ἐστίν und vermeidet eine durch die deutsche Erzählzeit motivierte Verschiebung.
- issue: Stärke des Verbots im Schriftzitat
  choice: nicht schlecht reden
  alternative: nicht beschimpfen
  rationale: κακῶς λέγειν kann allgemein böses oder schlechtes Reden und konkreter Schmähung bezeichnen. Der Haupttext bleibt semantisch breit; die stärkere Lesart erscheint als Alternative.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede und die traditionelle Schriftformel bleiben erhalten; unnötig altertümliche Syntax wird vermieden.
