- from: 'Dann rief er zwei von den Hauptleuten zu sich und sagte: »Haltet zweihundert Soldaten bereit, damit sie bis nach Cäsarea ziehen, dazu siebzig Reiter und zweihundert Speerträger[a]. Sie sollen von der dritten Stunde der Nacht an[b] aufbrechen.«'
  to: 'Dann rief er zwei von den Zenturionen zu sich und sagte: »Haltet ab der dritten Stunde der Nacht zweihundert Soldaten für den Marsch bis Cäsarea bereit, dazu siebzig Reiter und zweihundert Speerträger[a].«'
  rationale: Die Revision hält die drei Kontingente und die Zeitangabe im deutschen Hauptbefehl zusammen, verwendet für ἑκατοντάρχης die präzise moderne Bezeichnung „Zenturion“ und formuliert die Unsicherheit von δεξιολάβοι zurückhaltend. Die Zeitnotiz wird als Fußnote b beibehalten, auch wenn die Zeitangabe im revidierten Haupttext keinen eigenen Marker trägt; sie dokumentiert die kulturelle Einordnung ohne den Text zu vereindeutigen.
