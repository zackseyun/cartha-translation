review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Personen, Truppenzahlen, das Ziel Caesarea und die Zeitangabe grundsätzlich zutreffend wieder. Die Koordination der drei Truppenkontingente gehört jedoch im Griechischen unmittelbar zum Imperativ; die Aufspaltung in einen zweiten Satz mit „Sie sollen ... aufbrechen“ verschiebt den Satzbau und fügt eine ausdrückliche Abmarschweisung ein.
  naturalness: „Zenturionen“ ist im modernen Standarddeutsch für den römischen Rang präziser und geläufiger als das historisch anders konnotierte „Hauptleute“. Eine einheitliche Befehlsform ist zudem natürlicher und näher an der Vorlage.
  terminology: „Speerträger“ ist als vorsichtige Hauptübersetzung für δεξιολάβους vertretbar, sofern die Fußnote die lexikalische Unsicherheit nicht durch zu bestimmte Alternativen verdeckt. Die vorgeschlagene Fußnote kennzeichnet die möglichen Deutungen ausdrücklich als unsicher.
  issues:
  - severity: medium
    issue: Die drei Truppenkontingente und die Zeitbestimmung werden in zwei Sätze aufgeteilt.
    rationale: Im griechischen Satz sind Soldaten, Reiter und δεξιολάβοι gemeinsam Objekte von Ἑτοιμάσατε; ἀπὸ τρίτης ὥρας τῆς νυκτός gehört zu diesem Befehl. Die Fassung „Sie sollen ... aufbrechen“ ist zwar sachlich naheliegend, aber nicht ausdrücklich formuliert.
  - severity: low
    issue: „Hauptleuten“ ist für ἑκατοντάρχων weniger präzise.
    rationale: „Zenturionen“ bezeichnet den römischen Dienstgrad unmittelbar und ist modernes Standarddeutsch.
  - severity: low
    issue: Die Fußnote zu δεξιολάβους nennt „Leichtbewaffnete“ und „Leibwächter“ zu kategorisch als Alternativen.
    rationale: Die seltene Bezeichnung ist in ihrer genauen Referenz umstritten. Die Fußnote sollte die möglichen Deutungen als Möglichkeiten und nicht als gesicherte Synonyme ausweisen.
