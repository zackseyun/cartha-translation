source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: de
  text: 'Dann rief er zwei von den Zenturionen zu sich und sagte: »Haltet ab der dritten Stunde der Nacht zweihundert Soldaten für den Marsch bis Cäsarea bereit, dazu siebzig Reiter und zweihundert Speerträger[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung des seltenen Ausdrucks ist unsicher; möglicherweise bezeichnet er eine Art Leibwächter oder leicht bewaffnete Soldaten.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: rief ... zu sich
  rationale: Das mediale Partizip bezeichnet das Herbeirufen in die eigene Gegenwart; die finite deutsche Form ergibt einen natürlichen Satzanschluss.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: zwei von den Hauptleuten
  rationale: τινας δύο wird im Deutschen natürlich mit »zwei« wiedergegeben. »Hauptmann« ist eine verständliche, traditionelle Bezeichnung des römischen Zenturios.
- source_word: Ἑτοιμάσατε
  choice: Haltet ... bereit
  rationale: Der Imperativ erteilt den beiden Hauptleuten den Befehl, die Truppen für den Abmarsch bereitzustellen.
- source_word: στρατιώτας διακοσίους
  choice: zweihundert Soldaten
  rationale: Direkte und klare Wiedergabe der Truppengattung und Zahl.
- source_word: ὅπως πορευθῶσιν
  choice: damit sie ... ziehen
  rationale: »Damit« bewahrt die Zweckbedeutung von ὅπως mit dem Konjunktiv; »ziehen« passt zum militärischen Marsch.
- source_word: ἕως Καισαρείας
  choice: bis nach Cäsarea
  rationale: »Bis nach« gibt die durch ἕως bezeichnete räumliche Erstreckung idiomatisch wieder.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: siebzig Reiter
  rationale: ἱππεῖς bezeichnet berittene Truppen; »Reiter« ist knapp und allgemein verständlich.
- source_word: δεξιολάβους διακοσίους
  choice: zweihundert Speerträger
  rationale: Der seltene militärische Ausdruck ist in seiner genauen Bedeutung unsicher. »Speerträger« ist kontextuell plausibel, während eine Fußnote die Unsicherheit offenlegt.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: von der dritten Stunde der Nacht an
  rationale: Die Wiedergabe erhält sowohl die Ausgangsbedeutung von ἀπό als auch die antike Stundenangabe; der Zusammenhang macht sie zur Abmarschzeit.
theological_decisions: []
