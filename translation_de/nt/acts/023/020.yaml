source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: de
  text: 'Er sagte: „Die Juden[a] haben sich darauf verständigt, dich zu bitten, Paulus morgen zum Hohen Rat[b] hinabzuführen, als ob sie sich genauer nach ihm erkundigen wollten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „die Juden“ ist hier die an dem Anschlag auf Paulus beteiligte jüdische Gruppe gemeint, nicht das jüdische Volk insgesamt.
    reason: Kontextuelle Eingrenzung des im griechischen Text allgemein formulierten Ausdrucks Οἱ Ἰουδαῖοι.
  - marker: b
    text: 'Oder: „zum Sanhedrin“. Der Hohe Rat war der jüdische Rat in Jerusalem.'
    reason: Begriffserklärung zu συνέδριον.
lexical_decisions:
- source_word: συνέθεντο
  choice: haben sich darauf verständigt
  rationale: Die mediale Form bezeichnet eine gemeinsame Absprache. Die Formulierung wahrt dies, ohne die feindliche Absicht bereits lexikalisch als Verschwörung festzulegen.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: dich zu bitten
  rationale: Im Kontext ist ἐρωτάω eine an den Befehlshaber gerichtete Bitte; der deutsche Infinitiv gibt den Inhalt der Absprache natürlich wieder.
- source_word: καταγάγῃς
  choice: hinunterbringen zu lassen
  rationale: Das Präfix κατά- bezeichnet die Abwärtsbewegung. Da der Angesprochene als Befehlshaber die Überführung wohl anordnet, ist die kausative deutsche Wendung idiomatisch, ohne seine Verantwortung zu verwischen.
- source_word: συνέδριον
  choice: Hoher Rat
  rationale: Gemeint ist hier der jüdische Hohe Rat in Jerusalem. Die etablierte deutsche Bezeichnung ist verständlicher als das Fremdwort „Sanhedrin“.
- source_word: ὡς μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: als wollten sie seinen Fall genauer untersuchen
  rationale: ὡς kennzeichnet den bloßen Vorwand; μέλλω mit Infinitiv bezeichnet die angebliche Absicht. πυνθάνομαι und ἀκριβέστερον werden mit „genauer untersuchen“ natürlich wiedergegeben; „seinen Fall“ drückt das sachbezogene τι περὶ αὐτοῦ im gerichtlichen Kontext aus.
- source_word: Οἱ Ἰουδαῖοι
  choice: Die Juden
  rationale: Die direkte Wiedergabe bewahrt die Ausdrucksweise des griechischen Textes. Eine Fußnote grenzt den Bezug auf die konkret beteiligte Gruppe ein.
theological_decisions:
- issue: Bezug von „die Juden“ in einem feindseligen Erzählzusammenhang
  choice: „Die Juden“ im Haupttext beibehalten und kontextuell erläutern
  alternative: „die jüdischen Führer“ oder „die Judäer“
  rationale: Der griechische Text nennt Οἱ Ἰουδαῖοι und spezifiziert hier nicht ausdrücklich „Führer“. Zugleich darf die Formulierung nicht als pauschale Aussage über alle Juden verstanden werden; im Erzählzusammenhang geht es um die an dem Plan beteiligte Gruppe.
- issue: ὡς als Kennzeichnung eines Vorwands
  choice: „als wollten sie“
  alternative: „unter dem Vorwand, sie wollten“
  rationale: Die gewählte Form bewahrt die indirekte, leicht mehrdeutige Ausdrucksweise des Originals, während der Kontext die Täuschungsabsicht erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hoher Rat“ folgt dem etablierten deutschen Bibelgebrauch; „als wollten sie“ bewahrt die knappe Darstellung des vorgetäuschten Zwecks.
