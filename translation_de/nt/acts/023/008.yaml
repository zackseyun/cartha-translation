  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: de
  text: Denn die Sadduzäer sagen, es gebe keine Auferstehung, weder Engel noch Geist; die Pharisäer dagegen erkennen beides[a] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im weiteren Sinn: »Die Pharisäer erkennen alle drei an« – Auferstehung, Engel und Geist. Im Griechischen steht »beides«, was sich am unmittelbarsten auf »Engel« und »Geist« bezieht; manche verstehen es vom Zusammenhang her jedoch umfassender.'
    reason: Bewahrt die echte Mehrdeutigkeit beim Bezugsbereich von »beides«.
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: die Sadduzäer
  rationale: Die im Deutschen übliche Bezeichnung der jüdischen Gruppierung.
- source_word: μὲν γὰρ
  choice: Denn
  rationale: Gibt die erklärende Funktion der Partikelverbindung natürlich und knapp wieder.
- source_word: λέγουσιν μὴ εἶναι
  choice: sagen, es gebe keine
  rationale: Der Konjunktiv der indirekten Rede ist idiomatisches Standarddeutsch und gibt die Behauptung wieder, ohne sie als Erzähleraussage zu bestätigen.
- source_word: ἀνάστασιν
  choice: Auferstehung
  rationale: Bezeichnet hier Auferstehung als Wirklichkeit beziehungsweise Glaubensinhalt.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: weder Engel noch Geist
  rationale: Bewahrt die paarige Verneinung und die Singularformen des griechischen Textes.
- source_word: Φαρισαῖοι
  choice: die Pharisäer
  rationale: Die im Deutschen übliche Bezeichnung der jüdischen Gruppierung.
- source_word: ὁμολογοῦσιν
  choice: erkennen … an
  rationale: Gibt hier das Bejahen beziehungsweise Anerkennen als wahr wieder, ohne den möglichen Bußsinn von »bekennen« nahezulegen.
- source_word: τὰ ἀμφότερα
  choice: beides
  rationale: Entspricht formal dem griechischen Ausdruck für zwei Dinge und verweist am unmittelbarsten auf das zuvor genannte Paar »Engel« und »Geist«.
theological_decisions:
- issue: Bezugsbereich von τὰ ἀμφότερα (»beides«)
  choice: Im Haupttext erkennen die Pharisäer »beides« an; dies verweist am unmittelbarsten auf Engel und Geist.
  alternative: 'Der Ausdruck kann im weiteren Zusammenhang als zusammenfassender Hinweis auf alle drei genannten Inhalte verstanden werden: Auferstehung, Engel und Geist.'
  rationale: Der griechische Text sagt ausdrücklich »beides«, nicht »alles« oder »alle drei«. Zugleich umfasst der größere Zusammenhang auch die Auferstehung als pharisäische Überzeugung. Die Spannung wird daher im Haupttext bewahrt und in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv »es gebe« kennzeichnet natürliche indirekte Rede. Das Semikolon macht den scharfen Gegensatz zwischen den beiden Gruppen deutlich.
