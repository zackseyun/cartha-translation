id: ACT.23.34
reference: Acts 23:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: de
  text: Nachdem er das Schreiben gelesen hatte, fragte er, aus welcher Provinz Paulus stamme. Als er erfuhr, dass er aus Kilikien war,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Nachdem er es gelesen und gefragt hatte, aus welcher Provinz er sei, und erfahren hatte, dass er aus Kilikien war …«'
    reason: Formnähere Wiedergabe der griechischen Partizipialkonstruktion; der Satz wird im folgenden Vers fortgesetzt.
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Nachdem er das Schreiben gelesen hatte
  rationale: Das Partizip Aorist bezeichnet eine der folgenden Nachfrage vorausgehende Handlung. »Das Schreiben« ergänzt das im Griechischen unausgedrückte Objekt aus dem unmittelbaren Zusammenhang.
- source_word: δὲ
  choice: —
  rationale: Die schwache fortführende Partikel wird im Deutschen durch den Erzählfluss ausreichend wiedergegeben und benötigt keine eigene Entsprechung.
- source_word: καὶ ἐπερωτήσας
  choice: fragte er
  rationale: ἐπερωτάω bezeichnet hier eine direkte Nachfrage. Die finite Form ergibt einen natürlichen deutschen Satz; καί führt die nächste Handlung in der Abfolge ein.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: aus welcher Provinz Paulus stamme
  rationale: ἐπαρχία bezeichnet eine römische Verwaltungsprovinz. Der Konjunktiv »stamme« gibt die indirekte Frage idiomatisch wieder; »Paulus« verdeutlicht das im Griechischen nur durch die Verbform bezeichnete Subjekt aus dem Kontext.
- source_word: καὶ πυθόμενος
  choice: Als er erfuhr
  rationale: Das mediale Partizip von πυνθάνομαι bezeichnet das Erlangen einer Auskunft. »Als er erfuhr« gibt die zeitliche Abfolge natürlich wieder.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: dass er aus Kilikien war
  rationale: ἀπό mit dem Ortsnamen bezeichnet die Herkunft. Die Kopula und das Subjekt werden, wie im Deutschen erforderlich, aus dem Zusammenhang ergänzt.
- source_word: Κιλικίας
  choice: Kilikien
  rationale: Dies ist die übliche deutsche Namensform der römischen Provinz Cilicia.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte griechische Partizipialfolge wird zur besseren Verständlichkeit in zwei Sätze gegliedert, ohne die zeitliche Abfolge zu verändern. Kontextuell eindeutige Bezüge werden mit »das Schreiben« und »Paulus« ausdrücklich benannt.
