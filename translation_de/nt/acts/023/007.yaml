id: ACT.23.7
reference: Acts 23:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: de
  text: Während er dies sagte, entstand ein Streit[a] zwischen den Pharisäern und den Sadduzäern, und die Versammlung[b] spaltete sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Zwist; auch: ein Aufruhr.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: die Menge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Während er dies sagte
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet eine gleichzeitig ablaufende Handlung. „Während er dies sagte“ gibt diesen zeitlichen Verlauf natürlich und genau wieder.
- source_word: ἐγένετο
  choice: entstand
  rationale: In Verbindung mit στάσις bezeichnet das Verb das Aufkommen oder Ausbrechen des Konflikts. „Entstand“ ist im Deutschen idiomatisch und wahrt die Erzählbewegung.
- source_word: στάσις
  choice: Streit
  rationale: Das Wort kann Streit, Zwist, Aufruhr oder Parteiung bezeichnen. Im unmittelbaren Zusammenhang steht die Auseinandersetzung der beiden Gruppen im Vordergrund; „Streit“ ist verständlich, ohne die mögliche Intensität ganz auszuschließen.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: zwischen den Pharisäern und den Sadduzäern
  rationale: Der griechische Genitiv benennt die beteiligten Parteien. Im Deutschen drückt „zwischen“ die Gegnerschaft der beiden Gruppen natürlich aus.
- source_word: ἐσχίσθη
  choice: spaltete sich
  rationale: Das Passiv von σχίζω bezeichnet wörtlich ein Gespaltenwerden. Die reflexive deutsche Form bewahrt das kräftige Bild und passt idiomatisch zu einer Gruppe.
- source_word: τὸ πλῆθος
  choice: die Versammlung
  rationale: Gemeint ist hier die zusammengekommene Körperschaft, vor der Paulus spricht, nicht notwendig eine ungeordnete Menschenmenge. „Versammlung“ entspricht dem Kontext; „Menge“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am griechischen Erzählfluss; „während“ wahrt die Gleichzeitigkeit, und „spaltete sich“ erhält die Bildhaftigkeit des griechischen Verbs.
