id: ACT.23.6
reference: Acts 23:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: de
  text: 'Als Paulus aber erkannte, dass der eine Teil aus Sadduzäern und der andere aus Pharisäern bestand, rief er im Hohen Rat[a]: »Männer und Brüder, ich bin ein Pharisäer, ein Sohn von Pharisäern[b]. Wegen der Hoffnung und der Auferstehung der Toten stehe ich vor Gericht[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Synhedrium«. Gemeint ist hier die jüdische Ratsversammlung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein Sohn pharisäischer Eltern« beziehungsweise »ein Nachkomme von Pharisäern«.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »Wegen der Hoffnung auf die Auferstehung der Toten stehe ich vor Gericht.«'
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: als ... erkannte
  rationale: Das temporale Gefüge gibt das einleitende Aoristpartizip im Deutschen natürlich wieder und macht Paulus’ Erkenntnis zum Anlass seines folgenden Rufes.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: der eine Teil ... der andere
  rationale: Bewahrt die Gliederung des griechischen Ausdrucks, während »aus ... bestand« idiomatisch verdeutlicht, wie sich die Versammlung zusammensetzte.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: Sadduzäern / Pharisäern
  rationale: Gebräuchliche deutsche Bezeichnungen für die beiden jüdischen Gruppen.
- source_word: ἔκραζεν
  choice: rief ...
  rationale: Gibt die laute öffentliche Äußerung wieder; im Zusammenhang trägt »rief« genügend Nachdruck, ohne unnötig umgangssprachlich zu wirken.
- source_word: ἐν τῷ συνεδρίῳ
  choice: im Hohen Rat
  rationale: Im Kontext bezeichnet συνέδριον die jüdische Ratsversammlung; »Hoher Rat« ist die transparente und geläufige deutsche Bezeichnung. »Synhedrium« wird als Alternative vermerkt.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ihr Männer, Brüder
  rationale: Bewahrt beide Anredebestandteile des Griechischen. Die Form ist bewusst feierlich und näher am Wortlaut als das glattere »Brüder«.
- source_word: Φαρισαῖός εἰμι
  choice: ich bin ein Pharisäer
  rationale: Direkte Wiedergabe der Selbstbezeichnung im Präsens.
- source_word: υἱὸς Φαρισαίων
  choice: ein Sohn von Pharisäern
  rationale: Bewahrt sowohl das familiale Bild als auch den griechischen Plural, ohne festzulegen, ob Eltern, Vorfahren oder eine gruppenbezogene Herkunft gemeint sind.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: wegen der Hoffnung und der Auferstehung der Toten
  rationale: Bewahrt die Koordination von »Hoffnung« und »Auferstehung« durch καί. »Wegen« passt zum gerichtlichen Kontext, ohne beide Begriffe zu einer einzigen Aussage zusammenzuziehen.
- source_word: κρίνομαι
  choice: stehe ich vor Gericht
  rationale: Idiomatiche deutsche Wiedergabe des präsentischen Passivs in Paulus’ laufendem Gerichtsverfahren; sie ist natürlicher als »werde ich gerichtet«.
theological_decisions:
- issue: Bedeutung von υἱὸς Φαρισαίων
  choice: »ein Sohn von Pharisäern« bleibt als offene familiale Wendung erhalten.
  alternative: »Sohn pharisäischer Eltern« oder »Nachkomme von Pharisäern«
  rationale: Der griechische Plural lässt den genauen Bezug offen. Die Übersetzung vermeidet eine historisch engere Festlegung, als der Text erlaubt.
- issue: Verhältnis von Hoffnung und Auferstehung
  choice: »der Hoffnung und der Auferstehung der Toten«
  alternative: »der Hoffnung auf die Auferstehung der Toten«
  rationale: Der Haupttext erhält die mit καί koordinierte Form und damit die mögliche Unterscheidung zweier eng verbundener Begriffe. Die alternative Deutung als eine auf die Auferstehung gerichtete Hoffnung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Anrede »Ihr Männer, Brüder« und die Wendung »Sohn von Pharisäern« bleiben bewusst quellennah; Fußnoten erläutern die natürlichen beziehungsweise interpretierenden Alternativen.
