  to: 'Als Paulus aber erkannte, dass der eine Teil aus Sadduzäern und der andere aus Pharisäern bestand, rief er im Hohen Rat[a]: »Männer und Brüder, ich bin ein Pharisäer, ein Sohn von Pharisäern[b]. Wegen der Hoffnung und der Auferstehung der Toten stehe ich vor Gericht[c].«'
  rationale: Nur die öffentliche Anrede wird zur natürlichen deutschen Formel »Männer und Brüder« angepasst. Die Ergänzung von »und« ist für die deutsche Koordination erforderlich und legt weder die soziale Reichweite noch eine theologische Deutung des griechischen Ausdrucks enger fest. Alle übrigen Formulierungen und Fußnoten können bestehen bleiben.
