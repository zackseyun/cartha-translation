  text: οἱ δὲ παρεστῶτες εἶπαν· Τὸν ἀρχιερέα τοῦ θεοῦ λοιδορεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: de
  text: 'Die Umstehenden sagten: „Du beschimpfst[a] den Hohepriester Gottes?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du schmähst den Hohepriester Gottes?“'
    reason: Lexikalische Alternative für λοιδορεῖς; „schmähen“ liegt näher an traditioneller biblischer Ausdrucksweise, ist aber im heutigen Alltagsdeutsch weniger geläufig.
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Die Umstehenden
  rationale: Das substantivierte Partizip bezeichnet die Personen, die dabeistanden. „Die Umstehenden“ ist im Deutschen natürlich und bewahrt den räumlichen Bezug.
- source_word: εἶπαν
  choice: sagten
  rationale: Der Aorist führt die Erzählung mit einer abgeschlossenen Äußerung fort; das einfache Präteritum ist hier angemessen.
- source_word: ἀρχιερέα
  choice: Hohen Priester
  rationale: In diesem Zusammenhang bezeichnet ἀρχιερεύς den jüdischen Hohen Priester; dies ist die übliche und präzise deutsche Entsprechung.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird idiomatisch mit „Gottes“ wiedergegeben und bezeichnet die Zuordnung des Amtes zu Gott, ohne darüber hinaus eine Billigung des Amtsinhabers auszusagen.
- source_word: λοιδορεῖς
  choice: beschimpfst
  rationale: λοιδορέω bezeichnet beleidigendes oder schmähendes Reden. „Beschimpfen“ ist gegenwärtig, verständlich und gibt die verbale Herabsetzung deutlich wieder.
theological_decisions:
- issue: Aussagekraft von τοῦ θεοῦ in Bezug auf den Hohen Priester
  choice: „den Hohen Priester Gottes“
  alternative: „Gottes Hohen Priester“
  rationale: Die Formulierung ordnet das Amt Gott zu, ohne stillschweigend zu behaupten, Gott billige das Verhalten des konkreten Amtsinhabers.
- issue: Form der Frage
  choice: Als vorwurfsvolle Frage ohne zusätzliches Modalwort wiedergegeben
  alternative: „Wie kannst du den Hohen Priester Gottes beschimpfen?“
  rationale: Der griechische Text enthält eine direkte Frage. Eine Erweiterung mit „Wie kannst du“ würde den Vorwurf stärker ausdeuten, als es der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Umstehenden“ ist knapp und erzählerisch natürlich; „beschimpfst“ ist allgemein verständlich und wahrt die Schärfe der Zurechtweisung.
