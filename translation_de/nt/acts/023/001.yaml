  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: de
  text: 'Paulus blickte den Hohen Rat fest an und sagte: »Brüder, ich habe bis zum heutigen Tag vor Gott mit durchweg gutem Gewissen gelebt[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe bis zum heutigen Tag vor Gott als Bürger gelebt.« Das griechische Verb kann eine staatsbürgerliche Färbung haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: blickte … fest an
  rationale: Das Partizip bezeichnet einen gerichteten, anhaltenden Blick; die deutsche Formulierung ist natürlich und bewahrt dessen Nachdruck.
- source_word: δὲ
  choice: unübersetzt
  rationale: Das schwache narrative Bindewort wird im Deutschen durch den fortlaufenden Satzanschluss hinreichend wiedergegeben; ein ausdrückliches „und“ oder „da“ wäre möglich, aber nicht nötig.
- source_word: τῷ συνεδρίῳ
  choice: den Hohen Rat
  rationale: Im Kontext ist das jüdische Leitungsgremium gemeint. „Hoher Rat“ ist die geläufige, verständliche deutsche Bezeichnung und vermeidet die weniger transparente Transliteration „Synedrium“.
- source_word: Ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Die doppelte männliche Anrede lautet wörtlich etwa „Männer, Brüder“, wird im heutigen Deutsch jedoch idiomatisch und inhaltlich genau mit „Brüder“ wiedergegeben.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: mit durchweg gutem Gewissen
  rationale: Die Dativwendung bezeichnet die Art und Weise; „durchweg“ gibt die umfassende Kraft von πάσῃ wieder, ohne ein unnatürliches „mit allem guten Gewissen“ zu erzeugen.
- source_word: πεπολίτευμαι
  choice: ich habe … gelebt
  rationale: Das Perfekt blickt auf die bis zur Gegenwart reichende Lebensführung zurück. „Gelebt“ gibt den kontextuellen Sinn natürlich wieder; die mögliche bürgerlich-politische Färbung wird in der Fußnote bewahrt.
- source_word: τῷ θεῷ
  choice: vor Gott
  rationale: Die Dativform beschreibt hier die auf Gott bezogene und unter seinem Blick stehende Lebensführung. „Vor Gott“ passt zudem natürlich zur Aussage über das Gewissen.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: bis auf den heutigen Tag
  rationale: Die Wendung bezeichnet die zeitliche Erstreckung von der Vergangenheit bis zum gegenwärtigen Tag und wird in würdigem, verständlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Bedeutung von πεπολίτευμαι in Paulus’ Selbstaussage
  choice: Allgemeine Aussage über seine bisherige Lebensführung vor Gott
  alternative: „Ich habe mich vor Gott als Bürger verhalten“, mit ausdrücklich bewahrter staatsbürgerlicher Färbung
  rationale: Das Verb kann bürgerliche Obertöne tragen, bezeichnet hier aber am natürlichsten die Lebensführung. Die Übersetzung behauptet weder technische Bürgerschaft noch moralische Sündlosigkeit; Paulus sagt ausdrücklich, dass er mit gutem Gewissen gelebt hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und mündlich verständlich; „Hoher Rat“ setzt die historische Institution präzise und geläufig um.
