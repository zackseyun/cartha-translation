  rationale: Die Hauptaussage bleibt unverändert. „Bis zum heutigen Tag“ beseitigt eine mögliche moderne Mehrdeutigkeit von „bis auf“. Die Fußnote bewahrt die mögliche bürgerliche Nuance des griechischen Verbs in natürlichem Deutsch, ohne sie dem Haupttext aufzuzwingen, und ihr Anker steht nun direkt bei dem erläuterten Verb.
