  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Bis zum heutigen Tag“ ist gegenüber „bis auf den heutigen Tag“ eindeutiger und im gegenwärtigen Deutsch geläufiger. Die Fußnotenalternative wird sprachlich geglättet.
  terminology: „Hoher Rat“ ist für συνέδριον in diesem Kontext eine etablierte und verständliche Bezeichnung. „Brüder“ ist als knappe idiomatische Wiedergabe der Anrede vertretbar. Die Formulierung „als Bürger verhalten“ ist im Deutschen jedoch unnatürlich und kann irreführend technisch wirken.
