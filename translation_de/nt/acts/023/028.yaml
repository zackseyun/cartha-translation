revisions:
- from: Und weil ich erfahren wollte, aus welchem Grund sie ihn anklagten, ließ ich ihn vor ihren Hohen Rat[a] bringen.
  to: Und weil ich erfahren wollte, welche Anklage sie gegen ihn erhoben, ließ ich ihn zu ihrer Ratsversammlung hinabführen.[a]
  rationale: Die Revision verdeutlicht den forensischen Sinn von αἰτία, bewahrt die Bewegungsrichtung von κατήγαγον und übersetzt συνέδριον im Haupttext neutral. Die kontextuell wahrscheinliche Gleichsetzung mit dem Hohen Rat bleibt als Fußnote kenntlich, ohne sie dem griechischen Begriff selbst aufzuzwingen.
