  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: de
  text: Und weil ich erfahren wollte, welche Anklage sie gegen ihn erhoben, ließ ich ihn zu ihrer Ratsversammlung hinabführen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu ihrem Rat“. Das griechische Wort bezeichnet einen Rat oder eine Ratsversammlung; hier ist wahrscheinlich der jüdische Hohe Rat in Jerusalem gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: Und weil ich erfahren wollte
  rationale: Die Formulierung gibt das Motiv des Sprechers natürlich wieder. „Erfahren“ erfasst hier das angestrebte genauere Wissen besser als das statische „wissen“; τέ verbindet den Satz locker mit dem Vorhergehenden.
- source_word: τὴν αἰτίαν δι’ ἣν
  choice: aus welchem Grund
  rationale: αἰτία kann im Rechtskontext die Beschuldigung oder deren Grundlage bezeichnen. Mit ἐνεκάλουν zusammen ergibt „aus welchem Grund … anklagten“ im Deutschen eine klare, nicht überpräzisierende Wiedergabe.
- source_word: ἐνεκάλουν αὐτῷ
  choice: sie ihn anklagten
  rationale: Das Verb bezeichnet das Erheben einer Anklage gegen jemanden. Das Imperfekt wird im deutschen Präteritum idiomatisch wiedergegeben; der Kontext trägt den fortdauernden Vorgang.
- source_word: κατήγαγον
  choice: ließ ich ihn … bringen
  rationale: 'Der Kontext des militärischen Befehlshabers erlaubt eine kausative deutsche Formulierung: Er veranlasste, dass Paulus vor den Rat geführt wurde. Die wörtliche Richtungsangabe „hinab“ klingt ohne sichere topografische Relevanz im Deutschen unnötig räumlich.'
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: vor ihren Hohen Rat
  rationale: Im Kontext bezeichnet συνέδριον den jüdischen Leitungsrat in Jerusalem. Deutsch sagt idiomatisch, jemanden „vor“ ein gerichtliches Gremium zu bringen; „ihr“ bewahrt αὐτῶν.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Berichtsstil. Die Satzstruktur bleibt eng am griechischen Motiv-und-Handlung-Gefüge, verwendet aber idiomatisches juristisches Deutsch. „Hoher Rat“ ist im deutschen Bibelgebrauch verständlicher als das Fremdwort „Sanhedrin“; die allgemeinere Bedeutung wird in der Fußnote bewahrt.
