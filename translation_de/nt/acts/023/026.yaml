lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Klaudius Lysias
  rationale: Die Personennamen werden nach gebräuchlicher deutscher Konvention transliteriert.
- source_word: τῷ κρατίστῳ
  choice: an den hochverehrten
  rationale: Der Superlativ κρατίστῳ dient hier als förmliche ehrerbietige Anrede eines hohen Amtsträgers. „Hochverehrt“ bewahrt den offiziellen Ton und klingt im heutigen Deutschen natürlicher als die wörtlichere Form „vortrefflichster“.
- source_word: ἡγεμόνι
  choice: Statthalter
  rationale: ἡγεμών bezeichnet in diesem römischen Provinzkontext einen leitenden Regierungsbeamten. „Statthalter“ ist präzise und verständlich, ohne einen engeren technischen Amtstitel wie „Präfekt“ festzulegen.
- source_word: Φήλικι
  choice: Felix
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: χαίρειν
  choice: Grüße!
  rationale: χαίρειν ist in der Briefeinleitung eine feste Grußformel und nicht als Aufforderung „Freue dich“ zu verstehen. Die knappe Form wahrt den Charakter eines offiziellen Briefkopfs.
