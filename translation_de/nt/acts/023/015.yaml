  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: de
  text: Jetzt also teilt dem Befehlshaber zusammen mit dem Hohen Rat mit, dass er Paulus zu euch hinunterführen soll[a], als wolltet ihr seinen Fall genauer untersuchen[b]. Wir aber stehen bereit, ihn zu töten, bevor er sich euch nähert[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn vor euch bringen“. Das griechische Verb enthält wörtlich die Vorstellung des Hinunterführens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als würdet ihr die ihn betreffenden Angelegenheiten genauer prüfen“. Die Formulierung bezeichnet eine nur vorgetäuschte weitere Untersuchung seines Falls.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bevor er ankommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: mitteilen
  rationale: Der Aorist-Imperativ bezeichnet hier eine förmliche Mitteilung an eine Autorität. „Mitteilen“ ist im Deutschen natürlich und legt den Inhalt nicht unnötig als bloße Bitte fest.
- source_word: χιλιάρχῳ
  choice: Befehlshaber
  rationale: Gemeint ist der römische Chiliarch, der eine Kohorte befehligte. „Befehlshaber“ ist verständlich und vermeidet den weniger geläufigen Fachbegriff „Tribun“.
- source_word: σὺν τῷ συνεδρίῳ
  choice: zusammen mit dem Hohen Rat
  rationale: σύν bezeichnet die gemeinsame Beteiligung; συνέδριον meint im Kontext die bekannte jüdische Ratsversammlung. „Hoher Rat“ ist die etablierte, verständliche deutsche Bezeichnung.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: er möge Paulus zu euch hinunterführen
  rationale: κατάγω enthält die Richtungsangabe „hinunter“. Das im Kontext eindeutige Pronomen wird zur besseren deutschen Verständlichkeit mit „Paulus“ wiedergegeben.
- source_word: ὡς μέλλοντας
  choice: als wolltet ihr
  rationale: ὡς mit dem Partizip stellt eine nur vorgegebene Absicht dar. „Als wolltet ihr“ bewahrt diese Täuschungsnuance knapp und natürlich.
- source_word: διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ
  choice: seinen Fall genauer untersuchen
  rationale: διαγινώσκω bezeichnet im gerichtlichen Zusammenhang eine eingehende Untersuchung oder Klärung; ἀκριβέστερον verlangt den Komparativ „genauer“. „Seinen Fall“ gibt die deutsche Bedeutung von τὰ περὶ αὐτοῦ idiomatisch wieder.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτόν
  choice: bevor er in eure Nähe kommt
  rationale: Die Konstruktion bezeichnet Vorzeitigkeit, während ἐγγίζω die räumliche Annäherung ausdrückt. Die Wiedergabe erhält beides.
- source_word: ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν
  choice: wir stehen bereit, ihn zu töten
  rationale: ἕτοιμοί ἐσμεν drückt Bereitschaft aus; ἀναιρέω bedeutet hier direkt „töten“. Die Formulierung ist klar, ohne die moralisch wertende Bezeichnung „ermorden“ in den Verbtext einzutragen.
