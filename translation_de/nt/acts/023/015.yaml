  terminology: „Hoher Rat“, „Befehlshaber“, „genauer untersuchen“ und „töten“ sind angemessen. „Seinen Fall“ ist im gerichtlichen Kontext eine natürliche Wiedergabe von τὰ περὶ αὐτοῦ, ohne eine über das Kontextverständnis hinausgehende theologische oder konfessionelle Deutung einzutragen.
