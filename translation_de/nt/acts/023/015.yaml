  register: Modernes, würdevolles Standarddeutsch. Die förmliche Anrede steht im Plural. „Hoher Rat“ und „Befehlshaber“ sind allgemein verständlich; die räumliche Nuance von κατάγω und ἐγγίζω bleibt erhalten.
