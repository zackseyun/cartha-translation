source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: de
  text: Am nächsten Tag aber ließen sie die Reiter mit ihm weiterziehen und kehrten in die Kaserne[a] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in das Lager“. Das griechische Wort kann ein Lager oder eine militärische Unterkunft bezeichnen; hier ist wahrscheinlich die römische Kaserne beziehungsweise Festung in Jerusalem gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Am nächsten Tag aber
  rationale: Die Wendung bezeichnet den folgenden Tag. Das nachgestellte „aber“ gibt δέ als leichten erzählerischen Übergang wieder, ohne einen starken Gegensatz zu erzeugen.
- source_word: ἐάσαντες
  choice: ließen sie
  rationale: Das Aoristpartizip von ἐάω bezeichnet hier das Erlauben beziehungsweise Geschehenlassen; die deutsche Nebengeordnetheit gibt den zeitlich vorausliegenden Begleitumstand natürlich wieder.
- source_word: τοὺς ἱππεῖς
  choice: die Reiter
  rationale: ἱππεῖς bezeichnet berittene Soldaten. „Reiter“ ist knapp, verständlich und näher an der griechischen Form als das kollektiv-technische „Kavallerie“.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: mit ihm weiterziehen
  rationale: ἀπέρχεσθαι bezeichnet hier das Fortsetzen des Weges, während σύν mit Dativ die Begleitung ausdrückt. „Weiterziehen“ macht den Gegensatz zur Rückkehr der übrigen Soldaten deutlich, ohne mehr als der Kontext auszusagen.
- source_word: ὑπέστρεψαν
  choice: kehrten … zurück
  rationale: ὑποστρέφω bedeutet in diesem Erzählzusammenhang „zurückkehren“ oder „umkehren“.
- source_word: εἰς τὴν παρεμβολήν
  choice: in die Kaserne
  rationale: παρεμβολή kann ein Lager oder eine militärische Unterkunft bezeichnen. Im Jerusalemer Kontext ist wahrscheinlich die römische Kaserne beziehungsweise Festungsanlage gemeint.
theological_decisions: []
