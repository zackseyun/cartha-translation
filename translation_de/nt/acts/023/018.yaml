source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: de
  text: 'Da nahm er ihn mit, führte ihn zum Befehlshaber[a] und sagte: »Der Gefangene Paulus rief mich zu sich und bat mich, diesen jungen Mann zu dir zu bringen, denn er hat dir etwas zu sagen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch χιλίαρχος, ein römischer Militärtribun; traditionell auch »Tribun«.
    reason: Historische Amtsbezeichnung und traditionelle Wiedergabe.
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: nahm er ihn mit
  rationale: Das Partizip bezeichnet hier, dass der Soldat den jungen Mann übernahm und begleitete. »Nahm ihn mit« ist im Deutschen natürlich und passt zur anschließenden Führung zum Befehlshaber.
- source_word: ἤγαγεν πρὸς
  choice: führte ihn zu
  rationale: ἄγω bezeichnet das Führen oder Bringen zu einem Ziel. »Führte ihn zu« bewahrt die Bewegung und vermeidet die unmittelbare Wiederholung von »bringen« in der direkten Rede.
- source_word: χιλίαρχον
  choice: Befehlshaber
  rationale: χιλίαρχος bezeichnet hier den ranghohen römischen Offizier, der die Truppe in Jerusalem befehligte. »Befehlshaber« ist verständlich und funktional treffend; die historische Amtsbezeichnung wird in der Fußnote erläutert.
- source_word: φησίν
  choice: sagte
  rationale: Der griechische historische Präsens wird dem natürlichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Ὁ δέσμιος Παῦλος
  choice: Der Gefangene Paulus
  rationale: δέσμιος bezeichnet einen Gefangenen beziehungsweise einen Menschen in Fesseln oder Haft. »Der Gefangene Paulus« ist klar und kontextgerecht.
- source_word: προσκαλεσάμενός με
  choice: rief mich zu sich
  rationale: Die mediale Form drückt aus, dass Paulus den Soldaten zu sich kommen ließ. Die gewählte Formulierung gibt diese Richtung ausdrücklich und idiomatisch wieder.
- source_word: ἠρώτησεν ... ἀγαγεῖν
  choice: bat mich, ... zu bringen
  rationale: ἐρωτάω bezeichnet mit folgendem Infinitiv hier eine Bitte, nicht eine Frage. »Bat mich« bildet diese Funktion präzise ab.
- source_word: νεανίαν
  choice: jungen Mann
  rationale: νεανίας bezeichnet einen jungen männlichen Menschen. »Junger Mann« ist in modernem Standarddeutsch natürlich und weder altertümlich noch umgangssprachlich.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: denn er hat dir etwas zu sagen
  rationale: Das Partizip bezieht sich auf den jungen Mann und nennt den Grund für die Bitte. Die finite deutsche Formulierung ist klar und bewahrt diesen erklärenden Zusammenhang.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer direkter Rede. Das historische Präsens φησίν wird im Deutschen als Präteritum wiedergegeben. »Befehlshaber« vermeidet eine vorschnelle Gleichsetzung des antiken Amtes mit einem exakt entsprechenden modernen Dienstgrad.
