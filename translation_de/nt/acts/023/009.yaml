id: ACT.23.9
reference: Acts 23:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: de
  text: 'Da erhob sich ein großes Geschrei, und einige Schriftgelehrte aus der Partei der Pharisäer standen auf und stritten heftig: »Wir finden nichts Unrechtes an diesem Menschen. Wenn aber ein Geist zu ihm gesprochen hat oder ein Engel—[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz bricht auch im griechischen Text unvermittelt ab.
    reason: textual_feature
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: ein großes Geschrei
  rationale: Gibt Substantiv und Adjektiv direkt wieder und bezeichnet in natürlichem Deutsch einen lautstarken Tumult.
- source_word: ἀναστάντες
  choice: standen auf
  rationale: Bewahrt den konkreten Handlungssinn und passt zur Wortergreifung in der Versammlung.
- source_word: τινὲς τῶν γραμματέων
  choice: einige Schriftgelehrte
  rationale: γραμματεῖς bezeichnet hier jüdische Schriftgelehrte; die traditionelle deutsche Bezeichnung ist weiterhin klar und sachgerecht.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: aus der Partei der Pharisäer
  rationale: μέρος bezeichnet hier die Gruppierung oder Partei im Rat; »aus« drückt die Zugehörigkeit der betreffenden Schriftgelehrten natürlich aus.
- source_word: διεμάχοντο
  choice: stritten heftig
  rationale: Das Imperfekt und das Verb bezeichnen ein anhaltendes, energisches Streiten; die Wendung ist verständlich und bewahrt die Intensität.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: Wir finden nichts Unrechtes
  rationale: κακόν meint im quasi-rechtlichen Zusammenhang etwas Böses, Falsches oder Vorwerfbares; »nichts Unrechtes« bleibt nah am Wortlaut und klingt würdig.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: an diesem Menschen
  rationale: Im Deutschen ist »etwas an jemandem finden« die natürliche Entsprechung; »Mensch« gibt ἄνθρωπος direkt wieder.
- source_word: εἰ δὲ
  choice: Wenn aber
  rationale: Bewahrt die bedingte, adversative Konstruktion und lässt den im Griechischen abgebrochenen Satz offen.
- source_word: πνεῦμα
  choice: ein Geist
  rationale: Der Gegensatz zu »Engel« legt ein Geistwesen nahe, ohne den Ausdruck mit dem Heiligen Geist gleichzusetzen.
- source_word: ἐλάλησεν αὐτῷ
  choice: zu ihm gesprochen hat
  rationale: Das Perfekt ist im deutschen Bedingungssatz idiomatisch und gibt eine mögliche, bereits erfolgte Rede mit gegenwärtiger Relevanz wieder.
- source_word: ἄγγελος
  choice: ein Engel
  rationale: Im Zusammenhang übernatürlicher Wesen ist »Engel« eindeutig angemessener als das allgemeinere »Bote«.
theological_decisions:
- issue: Bedeutung von πνεῦμα im Gegensatz zu ἄγγελος
  choice: ein Geist, verstanden als Geistwesen
  alternative: der Geist, verstanden als der Heilige Geist
  rationale: Die Verbindung »ein Geist oder ein Engel« spiegelt die im Kontext erwähnten pharisäischen Kategorien wider. Die unbestimmte Wiedergabe wahrt die Aussage, ohne eine spezifische Identifikation einzutragen.
- issue: Unvollständiger Schlusssatz
  choice: Abbruch mit Gedankenstrich beibehalten
  alternative: 'Als vollständige rhetorische Frage formulieren: »Was, wenn ein Geist oder ein Engel zu ihm gesprochen hat?«'
  rationale: Der griechische Text bricht nach ἄγγελος syntaktisch unvermittelt ab. Der Gedankenstrich bewahrt diese textliche Spannung, statt die unausgesprochene Folgerung zu ergänzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der abrupte Satzabbruch des Ausgangstextes wird sichtbar bewahrt; konfessionell festgelegte Deutungen werden vermieden.
