id: ACT.23.11
reference: Acts 23:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: de
  text: 'In der folgenden Nacht aber stand der Herr bei ihm und sagte: »Fasse Mut![a] Denn wie du in Jerusalem von mir Zeugnis abgelegt hast,[b] so musst du auch in Rom Zeugnis ablegen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sei getrost!«'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »von mir eindringlich Zeugnis abgelegt hast«. Die beiden griechischen Verben für das bisherige und das künftige Zeugnis des Paulus gehören derselben Wortfamilie an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: In der folgenden Nacht aber
  rationale: ἐπιοῦσα bezeichnet die folgende beziehungsweise nächste Nacht. Das nachgestellte »aber« gibt die leichte fortführende, möglicherweise kontrastierende Funktion von δέ wieder, ohne einen starken Gegensatz zu erzeugen.
- source_word: ἐπιστὰς αὐτῷ
  choice: stand der Herr bei ihm
  rationale: Die Form bezeichnet hier das Herantreten und Dabeistehen. »Stand bei ihm« bewahrt die konkrete, persönliche Nähe und vermeidet die interpretierende Erweiterung »erschien ihm«.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die übliche und kontextgemäße Wiedergabe von κύριος. Der Text wird nicht erläuternd zu »der Herr Jesus« erweitert.
- source_word: Θάρσει
  choice: Fasse Mut!
  rationale: Der Imperativ fordert Paulus unmittelbar zu Zuversicht und Mut auf. Die Formulierung ist gegenwärtig, verständlich und würdevoll.
- source_word: διεμαρτύρω
  choice: du … Zeugnis abgelegt hast
  rationale: διαμαρτύρομαι kann ein nachdrückliches Bezeugen bezeichnen. »Zeugnis abgelegt hast« gibt den abgeschlossenen Rückblick wieder und hält zugleich die Verbindung zum folgenden μαρτυρῆσαι sichtbar.
- source_word: τὰ περὶ ἐμοῦ
  choice: von mir
  rationale: Die knappe deutsche Wendung gibt den Bezug auf das wieder, was Jesus betrifft, ohne die schwerfällige Formulierung »die Dinge über mich«.
- source_word: εἰς Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Obwohl εἰς grundsätzlich eine Richtung bezeichnen kann, nennt es hier idiomatisch den Ort des bereits geschehenen Zeugnisses.
- source_word: οὕτω
  choice: so
  rationale: »So« markiert knapp und natürlich die Entsprechung zwischen dem Zeugnis in Jerusalem und dem künftigen Zeugnis in Rom.
- source_word: σε δεῖ
  choice: du musst
  rationale: δεῖ drückt eine Notwendigkeit aus, die im Kontext unter Gottes Führung steht. »Du musst« bewahrt diese Notwendigkeit, ohne sie als unpersönliches Schicksal auszudeuten.
- source_word: καὶ εἰς Ῥώμην
  choice: auch in Rom
  rationale: καί fügt Rom als weiteren Ort des Zeugnisses hinzu; die deutsche Wortstellung ist natürlich und klar.
- source_word: μαρτυρῆσαι
  choice: Zeugnis ablegen
  rationale: Die Wiedergabe lässt die gemeinsame Wortfamilie mit διεμαρτύρω auch im Deutschen erkennen und passt zum öffentlichen Zeugnis des Paulus.
theological_decisions:
- issue: Identität von ὁ κύριος
  choice: »der Herr«
  alternative: »der Herr Jesus«
  rationale: Im Zusammenhang der Apostelgeschichte weist die Rede über das Zeugnis »von mir« auf den auferstandenen Jesus. Die Übersetzung belässt es dennoch bei der ausdrücklichen Formulierung des griechischen Textes und ergänzt den Namen nicht.
- issue: Bedeutung von δεῖ
  choice: »du musst«
  alternative: »es ist für dich notwendig« oder »es ist dir bestimmt«
  rationale: Die Formulierung gibt die im Text liegende, im Kontext göttliche Notwendigkeit wieder, ohne näher festzulegen, auf welche Weise sie verwirklicht wird oder sie zu einem Schicksalsbegriff zu verstärken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung »Zeugnis ablegen« erhält den Zusammenhang der griechischen Wortfamilie. »Stand … bei ihm« bewahrt die anschauliche Nähe des Herrn; »Fasse Mut!« ist direkt und gut verständlich.
