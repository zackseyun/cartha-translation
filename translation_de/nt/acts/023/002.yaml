base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: de
  text: Doch der Hohepriester Hananias befahl denen, die bei ihm standen, Paulus auf den Mund zu schlagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Paulus eine Ohrfeige zu geben.« Das griechische Verb bezeichnet allgemein ein Schlagen; »eine Ohrfeige geben« ist hier möglich, legt die Art des Schlages aber genauer fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet hier die unvermittelte Gegenreaktion auf die vorausgehende Aussage des Paulus, ohne einen starken Gegensatz zu erzwingen.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohe Priester
  rationale: Die etablierte deutsche Bezeichnung für das hier gemeinte Amt; die Großschreibung behandelt die Amtsbezeichnung als Titel.
- source_word: Ἁνανίας
  choice: Hananias
  rationale: Entspricht der im Deutschen üblichen biblischen Namensform.
- source_word: ἐπέταξεν
  choice: befahl
  rationale: Gibt den autoritativen Befehl präzise und in natürlichem modernem Deutsch wieder.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: denen, die bei ihm standen
  rationale: Bewahrt den räumlichen Sinn des Partizips und bleibt zugleich idiomatisch.
- source_word: τύπτειν
  choice: zu schlagen
  rationale: Das Verb bezeichnet allgemein das Schlagen; die Wiedergabe legt die genauere Art des Schlages nicht fest.
- source_word: αὐτοῦ τὸ στόμα
  choice: Paulus auf den Mund
  rationale: Im Griechischen steht wörtlich »seinen Mund«. Die namentliche Wiederaufnahme von Paulus vermeidet im Deutschen die mehrdeutige Folge mehrerer männlicher Pronomen und macht das Ziel des Schlages klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am griechischen Satzbau, löst jedoch die im Deutschen missverständliche Pronomenfolge durch die ausdrückliche Nennung des Paulus auf.
