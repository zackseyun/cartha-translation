  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: de
  text: 'Daraufhin entließ der Kommandant den jungen Mann und wies ihn an: »Sage niemandem, dass du mir dies mitgeteilt hast.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: Kommandant
  rationale: Bezeichnet hier den ranghohen römischen Offizier, der eine Kohorte befehligte. »Kommandant« ist verständlich und gibt seine militärische Autorität wieder, ohne den technischeren Titel »Tribun« vorauszusetzen.
- source_word: ἀπέλυσε
  choice: entließ
  rationale: Der Offizier beendet das Gespräch und lässt den jungen Mann gehen. »Entließ« passt zum amtlichen Rahmen, ohne nahezulegen, dass er zuvor in Haft war.
- source_word: νεανίσκον
  choice: jungen Mann
  rationale: Das Wort bezeichnet einen jüngeren männlichen Menschen. »Junger Mann« ist natürlich, respektvoll und altersmäßig weniger eng als »Junge«.
- source_word: παραγγείλας
  choice: wies ihn an
  rationale: Das Partizip bezeichnet eine verbindliche Weisung. »Wies ihn an« wahrt den autoritativen Ton, ohne unnötig schroff zu klingen.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Sage niemandem
  rationale: Die Wendung untersagt, die betreffende Information irgendeiner Person mitzuteilen. Diese Formulierung ist knapp und idiomatisch.
- source_word: ἐνεφάνισας
  choice: mitgeteilt hast
  rationale: Das Verb bedeutet, etwas bekannt zu machen oder einer zuständigen Person zu melden. »Mitgeteilt hast« ist im Deutschen natürlich und deckt die im Kontext gemeinte Übermittlung der Information ab.
- source_word: ταῦτα
  choice: dies
  rationale: Obwohl der griechische Ausdruck formal pluralisch ist, fasst idiomatisches Deutsch die zuvor berichtete Angelegenheit häufig mit »dies« zusammen. »Diese Dinge« wäre formnäher, klänge hier jedoch weniger natürlich.
- source_word: πρὸς ἐμέ
  choice: mir
  rationale: Nach dem Verb des Mitteilens bezeichnet πρός mit Akkusativ den Empfänger. Der deutsche Dativ »mir« gibt diese Richtung idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung »Daraufhin« gibt οὖν im erzählerischen Zusammenhang natürlich wieder; die direkte Rede bleibt knapp und verbindlich.
