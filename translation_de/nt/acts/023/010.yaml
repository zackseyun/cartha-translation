  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: de
  text: Als ein heftiger Streit entstand,[a] fürchtete der Befehlshaber, Paulus könnte von ihnen zerrissen werden. Deshalb befahl er den Soldaten, hinunterzugehen, ihn aus ihrer Mitte herauszureißen und in die Kaserne zu bringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als ein großer Aufruhr entstand“ oder „Als eine heftige Auseinandersetzung entstand“. Das griechische Wort kann einen scharfen inneren Konflikt, Aufruhr oder auch einen Aufstand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Kaserne“ bezeichnet hier die römischen Militärquartiere in Jerusalem; wörtlich kann das griechische Wort auch „Lager“ bedeuten.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς δὲ γινομένης στάσεως
  choice: Als der Aufruhr immer heftiger wurde
  rationale: Der Genitivus absolutus wird als temporaler Umstandssatz wiedergegeben. στάσις bezeichnet hier einen heftigen inneren Konflikt, der bereits in Gewalt umzuschlagen droht; „Aufruhr“ bewahrt diese Stärke, ohne einen förmlichen Aufstand vorauszusetzen. γινομένης wird durch „immer heftiger wurde“ idiomatisch entfaltet.
- source_word: φοβηθεὶς ὁ χιλίαρχος
  choice: fürchtete der Befehlshaber
  rationale: Das Partizip bezeichnet den Beweggrund für den folgenden Befehl. χιλίαρχος meint den ranghohen römischen Offizier; „Befehlshaber“ ist verständlich und kontextgerecht.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: Paulus könnte von ihnen zerrissen werden
  rationale: Die Konstruktion mit μή nach einem Verb des Fürchtens bezeichnet den befürchteten möglichen Ausgang. „Zerrissen“ erhält die drastische Bildkraft von διασπάω.
- source_word: ἐκέλευσεν τὸ στράτευμα
  choice: befahl er den Soldaten
  rationale: στράτευμα bezeichnet kollektiv die eingesetzte Truppe; im Deutschen ist „den Soldaten“ in Verbindung mit dem Befehlsverb natürlicher als „der Truppe“.
- source_word: καταβὰν
  choice: hinunterzugehen
  rationale: Die räumliche Bewegung von der höher gelegenen Festung zum Versammlungsort wird ausdrücklich bewahrt.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: ihn aus ihrer Mitte herauszureißen
  rationale: ἁρπάζω bezeichnet ein rasches, gewaltsames Ergreifen oder Entreissen. „Herauszureißen“ passt zur unmittelbaren Gefahr und bewahrt zugleich den Bezug zu ἐκ μέσου αὐτῶν.
- source_word: ἄγειν τε εἰς τὴν παρεμβολήν
  choice: und in die Kaserne zu bringen
  rationale: ἄγω wird zielgerichtet mit „bringen“ wiedergegeben. παρεμβολή kann „Lager“ bedeuten, bezeichnet hier jedoch die römischen Militärquartiere in der Festung von Jerusalem.
