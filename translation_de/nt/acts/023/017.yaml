  variant: modern standard German
source:
  edition: SBLGNT
  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: de
  text: 'Da rief Paulus einen der Hauptleute zu sich und sagte: »Bring diesen jungen Mann zum Befehlshaber, denn er hat ihm etwas zu berichten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mitzuteilen« beziehungsweise »zu sagen«. Das griechische Verb kann berichten, melden oder mitteilen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: rief … zu sich
  rationale: Das Aoristpartizip von προσκαλέομαι bezeichnet hier, dass Paulus den Hauptmann zu sich ruft, bevor er zu ihm spricht. Die deutsche Wendung gibt die mediale Bedeutung natürlich wieder.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung ohne starken Gegensatz weiter. »Da« markiert im Deutschen passend die narrative Folge.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: einen der Hauptleute
  rationale: ἑκατοντάρχης bezeichnet einen römischen Zenturio. »Hauptmann« ist die geläufige, verständliche deutsche Rangbezeichnung.
- source_word: ἔφη
  choice: sagte
  rationale: φημί ist hier ein schlichtes Redeverb; »sagte« ist direkt und unauffällig.
- source_word: νεανίαν
  choice: jungen Mann
  rationale: νεανίας bezeichnet einen jüngeren männlichen Menschen; »junger Mann« ist gegenwärtig und neutral.
- source_word: ἄπαγε
  choice: Bring
  rationale: Der Imperativ von ἀπάγω bedeutet hier, jemanden zu einer anderen Person hinzuführen. Im Deutschen ist »Bring« in dieser Situation natürlicher als das formellere »Führe«.
- source_word: πρὸς τὸν χιλίαρχον
  choice: zum Befehlshaber
  rationale: χιλίαρχος bezeichnet hier den bereits bekannten römischen Militärtribunen beziehungsweise Kommandeur. »Befehlshaber« ist verständlich und bewahrt den militärischen Sinn ohne den technischen griechischen Titel nachzubilden.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: denn er hat ihm etwas zu berichten
  rationale: Die Konstruktion ἔχει mit Infinitiv drückt aus, dass der junge Mann etwas mitzuteilen hat. ἀπαγγέλλω kann »berichten«, »melden« oder »mitteilen« bedeuten; »berichten« passt zum Überbringen dringlicher Informationen.
