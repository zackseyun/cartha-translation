  source_fidelity: 'Die Übersetzung gibt die Abfolge und Satzstruktur des griechischen Textes zuverlässig wieder: Paulus ruft einen Zenturio zu sich, weist ihn an, den jungen Mann zum bekannten militärischen Vorgesetzten zu bringen, und begründet dies mit dessen Mitteilung. »Da« bildet δέ als erzählenden Übergang angemessen ab. »Denn er hat ihm etwas zu berichten« trifft die Konstruktion ἔχει + Infinitiv und ἀπαγγεῖλαι idiomatisch.'
  naturalness: Flüssiges modernes Standarddeutsch mit angemessen würdigem Erzählregister. »Rief ... zu sich«, »Bring diesen jungen Mann« und »hat ihm etwas zu berichten« sind natürlich und klar. Die direkte Rede ist gut lesbar.
  terminology: »Hauptleute« ist als traditionelle, verständliche Bezeichnung für ἑκατοντάρχαι vertretbar; »Befehlshaber« gibt χιλίαρχος verständlich als militärische Funktion wieder, ohne einen unnötig technischen Titel aufzudrängen. Es liegen keine theologischen Fachbegriffe vor. Die Fußnote bewahrt die lexikalische Bandbreite von ἀπαγγέλλω angemessen.
