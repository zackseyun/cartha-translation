source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: de
  text: Als mir aber mitgeteilt wurde, dass es einen Anschlag gegen den Mann geben werde, schickte ich ihn sofort zu dir und wies zugleich auch seine Ankläger an, ihre Anklage gegen ihn vor dir vorzubringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dir zu ihm/gegen ihn zu sprechen“; im Gerichtskontext: die Anklage gegen ihn vorzubringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: Als mir aber gemeldet wurde
  rationale: Der Genitivus absolutus im Aorist Passiv wird als natürlicher temporaler Nebensatz wiedergegeben; „gemeldet“ wahrt den amtlichen Ton.
- source_word: ἐπιβουλῆς
  choice: ein Anschlag
  rationale: Das Substantiv bezeichnet einen feindseligen Plan gegen Paulus. „Anschlag“ ist im Kontext treffend, ohne die konkrete Ausführung als Hinterhalt festzulegen.
- source_word: εἰς τὸν ἄνδρα
  choice: auf den Mann
  rationale: In Verbindung mit „Anschlag“ bezeichnet „auf“ idiomatisch die Zielrichtung der feindseligen Planung; „den Mann“ bewahrt die ausdrückliche Nominalbezeichnung.
- source_word: ἔσεσθαι
  choice: geplant sei
  rationale: Der zukünftige Infinitiv zeigt den bevorstehenden Anschlag an. Im Deutschen gibt der Konjunktiv I zugleich den Inhalt der Meldung wieder; „geplant“ ergibt sich aus dem Begriff des Anschlags.
- source_word: ἐξαυτῆς
  choice: sofort
  rationale: Gibt die unmittelbare Reaktion knapp und idiomatisch wieder.
- source_word: ἔπεμψα πρὸς σέ
  choice: schickte ich ihn sofort zu dir
  rationale: Das im Deutschen nötige Objekt „ihn“ wird eindeutig aus dem Kontext ergänzt und bezieht sich auf Paulus.
- source_word: παραγγείλας καὶ
  choice: Zugleich wies ich auch … an
  rationale: Die Beiordnung des Aoristpartizips wird in einen selbstständigen Satz überführt; „zugleich“ und „auch“ bewahren den begleitenden und additiven Sinn.
- source_word: τοῖς κατηγόροις
  choice: seine Ankläger
  rationale: „Ankläger“ entspricht dem gerichtlichen Kontext; „seine“ verdeutlicht den im Zusammenhang eindeutigen Bezug auf Paulus.
- source_word: λέγειν πρὸς αὐτὸν
  choice: ihre Sache gegen ihn … vorzubringen
  rationale: Die Wendung bedeutet im gerichtlichen Zusammenhang, gegen Paulus auszusagen beziehungsweise die Anklage vorzutragen. Die Formulierung hält die Richtung „gegen ihn“ ausdrücklich fest.
- source_word: ἐπὶ σοῦ
  choice: vor dir
  rationale: Bezeichnet hier das Auftreten vor Felix in seiner richterlichen beziehungsweise amtlichen Zuständigkeit.
