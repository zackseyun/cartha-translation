id: ACT.23.3
reference: Acts 23:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: de
  text: 'Da sagte Paulus zu ihm: »Gott wird dich gleich schlagen,[a] du weiß getünchte Wand! Du sitzt da und richtest mich nach dem Gesetz, und zugleich übertrittst du das Gesetz, indem du befiehlst, mich zu schlagen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott wird dich schlagen.« Wörtlich: »Gott ist im Begriff, dich zu schlagen«; die griechische Formulierung kann die zeitliche Nähe betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Gott wird dich gleich schlagen
  rationale: μέλλει mit Infinitiv bezeichnet hier eine unmittelbar bevorstehende Handlung. „Wird dich gleich schlagen“ bewahrt diesen Zukunfts- und Näheaspekt in natürlichem Deutsch; τύπτειν wird mit „schlagen“ wiedergegeben.
- source_word: τοῖχε κεκονιαμένε
  choice: du weiß getünchte Wand
  rationale: Die wörtliche Metapher bleibt erhalten. κεκονιαμένε bezeichnet eine mit Kalk überzogene beziehungsweise weiß getünchte Wand und wirkt hier als scharfe Anrede.
- source_word: κάθῃ
  choice: du sitzt da
  rationale: Die konkrete Bedeutung des Verbs bleibt gewahrt; „da“ gibt der rhetorischen Frage im Deutschen natürliche Schärfe.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: richtest mich nach dem Gesetz
  rationale: κατά bezeichnet das Gesetz als Maßstab des Richtens. Die Formulierung ist präzise, knapp und idiomatisch.
- source_word: παρανομῶν
  choice: übertrittst du das Gesetz
  rationale: Das Partizip bezeichnet gesetzeswidriges Handeln. Die verbale Wiedergabe macht im Deutschen den bewussten Gegensatz zu „nach dem Gesetz“ klar.
- source_word: κελεύεις με τύπτεσθαι
  choice: indem du befiehlst, mich zu schlagen
  rationale: Die Befehlsstruktur und der passive Sinn bleiben erhalten; im Deutschen ist der Infinitiv „mich zu schlagen“ formal aktiv, bezeichnet hier aber aufgrund des Befehls an andere, dass Paulus geschlagen werden soll.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Da sagte Paulus zu ihm
  rationale: Schlichte, natürliche Erzählform, die τότε als zeitlich-fortführendes „Da“ wiedergibt.
theological_decisions:
- issue: Art der Aussage „Gott wird dich gleich schlagen“
  choice: Als Ankündigung eines unmittelbar bevorstehenden göttlichen Handelns wiedergegeben
  alternative: 'Als Wunsch oder Verwünschung: „Gott möge dich schlagen“'
  rationale: Die Konstruktion μέλλει + Infinitiv spricht am ehesten von bevorstehendem Handeln, nicht von einem Wunsch. Die Übersetzung beurteilt dabei nicht, ob oder in welchem Sinn Paulus prophetisch spricht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die scharfe rhetorische Anrede und der Gegensatz zwischen einem Richten nach dem Gesetz und gesetzeswidrigem Handeln bleiben erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Aussage.
