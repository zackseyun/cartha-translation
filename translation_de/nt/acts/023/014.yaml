source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: de
  text: 'Diese Männer gingen zu den Hohenpriestern und den Ältesten und sagten: »Wir haben uns mit einem Fluch verpflichtet[a], nichts zu uns zu nehmen, bis wir Paulus getötet haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Mit einem Fluch haben wir uns verflucht.« Die griechische Formel bezeichnet einen Eid, bei dem die Sprechenden sich selbst einem Fluch aussetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Diese Männer
  rationale: Das Relativpronomen verweist auf die Verschwörer des vorhergehenden Verses. Die explizite Wiedergabe stellt den Bezug im Deutschen natürlich und eindeutig her.
- source_word: προσελθόντες
  choice: gingen zu
  rationale: Das Aoristpartizip bezeichnet eine dem Sprechen vorausgehende Handlung; »gingen zu« ist im Erzählzusammenhang idiomatisch.
- source_word: ἀρχιερεῦσιν
  choice: führenden Priestern
  rationale: Der Plural bezeichnet hier die priesterliche Führungsschicht. »Führende Priester« ist im modernen Deutsch klarer als das missverständliche »Hohepriester« im Plural.
- source_word: πρεσβυτέροις
  choice: Ältesten
  rationale: Im institutionellen Zusammenhang sind anerkannte jüdische Führungspersonen gemeint, nicht lediglich ältere Männer.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: wir haben uns selbst unter einen Fluch gestellt und geschworen
  rationale: Die Verbindung aus stammverwandtem Substantiv und Verb bezeichnet einen selbstverfluchenden Eid. Die Wiedergabe bewahrt sowohl den Fluchcharakter als auch die bindende Verpflichtung in verständlichem Deutsch.
- source_word: μηδενὸς γεύσασθαι
  choice: nichts zu essen
  rationale: γεύομαι bedeutet wörtlich »kosten«, kann hier aber idiomatisch die Aufnahme von Nahrung bezeichnen. »Nichts zu essen« klingt im Deutschen natürlich und bewahrt den absoluten Verzicht.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die Konjunktion markiert die zeitliche Grenze des Eides.
- source_word: ἀποκτείνωμεν
  choice: wir Paulus getötet haben
  rationale: Der Aoristkonjunktiv nach ἕως οὗ blickt auf den Abschluss der beabsichtigten Tötung. Das deutsche Perfekt nach »bis« gibt diese Zielgrenze natürlich wieder, ohne zusätzlich die rechtliche Wertung »ermorden« einzutragen.
- source_word: τὸν Παῦλον
  choice: Paulus
  rationale: Gebräuchliche deutsche Namensform von Παῦλος.
theological_decisions:
- issue: Wiedergabe der Eidesformel Ἀναθέματι ἀνεθεματίσαμεν ἑαυτούς
  choice: Wir haben uns selbst unter einen Fluch gestellt und geschworen
  alternative: Wir haben uns mit einem Fluch verpflichtet
  rationale: Die Formulierung bezeichnet keinen späteren kirchlichen Bann, sondern einen Eid mit Selbstverfluchung. Die gewählte Fassung macht beide Aspekte deutlich, ohne konfessionelle Fachsprache einzutragen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die direkte Rede bleibt hart und knapp. »Führende Priester« vermeidet die im Deutschen sachlich missverständliche Vorstellung mehrerer amtierender Hoherpriester; die Fußnote erläutert die ungewöhnlich starke griechische Eidesformel.
