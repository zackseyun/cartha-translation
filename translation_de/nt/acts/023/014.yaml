revisions:
- from: 'Diese Männer gingen zu den führenden Priestern und den Ältesten und sagten: »Wir haben uns selbst unter einen Fluch gestellt[a] und geschworen, nichts zu essen, bis wir Paulus getötet haben.«'
  to: 'Diese Männer gingen zu den Hohenpriestern und den Ältesten und sagten: »Wir haben uns mit einem Fluch verpflichtet[a], nichts zu uns zu nehmen, bis wir Paulus getötet haben.«'
  rationale: Die Revision wahrt die emphatische, selbstverfluchende Eidesformel als eine Einheit und gibt den umfassenden Verzicht von μηδενὸς γεύσασθαι ohne sachliche Einengung wieder. Die Fußnote erläutert die Formel, ohne eine im Wortlaut nicht näher bestimmte Bedingung des Fluchs festzulegen.
