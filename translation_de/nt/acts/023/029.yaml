  source_fidelity: Der Entwurf gibt die Untersuchung des Befehlshabers, die Streitfragen über das Gesetz und das Fehlen eines todes- oder haftwürdigen Anklagegrundes im Wesentlichen zutreffend wieder. Die Formulierung „ihm aber nichts zur Last gelegt wurde“ kann jedoch unqualifiziert besagen, dass überhaupt kein Vorwurf erhoben worden sei, und verwischt damit die im Griechischen vorhandene Unterscheidung zwischen den tatsächlich erhobenen Anschuldigungen und dem Fehlen eines schwerwiegenden Anklagepunkts.
  naturalness: „Ich stellte fest“ und „wegen Streitfragen ihres Gesetzes“ sind idiomatisch und dem amtlich-rechtlichen Register angemessen. Die Revision beseitigt die missverständliche Doppelung von „angeklagt“ und „zur Last gelegt“ und formuliert den rechtlichen Gegensatz klarer.
