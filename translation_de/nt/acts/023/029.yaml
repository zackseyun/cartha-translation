  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: de
  text: Ich stellte fest, dass er wegen Streitfragen[a] ihres Gesetzes angeklagt wurde, dass jedoch kein gegen ihn erhobener Vorwurf Tod oder Haft[b] verdient hätte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fragen“ oder „strittigen Fragen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Fesseln“; gemeint ist Haft oder Gefangenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: Ich stellte fest
  rationale: Der Aorist beschreibt die Schlussfolgerung des römischen Befehlshabers nach seiner Untersuchung. „Ich stellte fest“ ist in diesem amtlichen Zusammenhang natürlicher als das wörtlichere „ich fand“.
- source_word: ἐγκαλούμενον
  choice: angeklagt wurde
  rationale: Das passive Partizip bezeichnet die gegen Paulus erhobenen Anschuldigungen, ohne deren Berechtigung vorauszusetzen.
- source_word: περὶ ζητημάτων
  choice: wegen Streitfragen
  rationale: ζητήματα kann Fragen, strittige Punkte oder Streitfragen bezeichnen. „Streitfragen“ macht den kontroversen Charakter deutlich; die offenere Alternative wird in der Fußnote genannt.
- source_word: τοῦ νόμου αὐτῶν
  choice: ihres Gesetzes
  rationale: Die Formulierung bewahrt die Perspektive des römischen Befehlshabers und den possessiven Ausdruck αὐτῶν.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: nichts ... was Tod oder Fesseln verdient hätte
  rationale: Die Wiedergabe hält die gerichtliche Aussage und das konkrete Bild von δεσμά fest. „Fesseln“ kann hier metonymisch für Haft stehen.
- source_word: ἔχοντα ἔγκλημα
  choice: ihm aber nichts zur Last gelegt wurde
  rationale: Die idiomatische deutsche Rechtsformulierung gibt das Vorliegen einer Anklage wieder, ohne wie „schuldig“ eine Verurteilung zu behaupten.
