  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: de
  text: Diesen Mann hatten die Juden[a] ergriffen und waren im Begriff, ihn zu töten; und ich kam mit der Truppe hinzu und rettete ihn, nachdem ich erfahren hatte, dass er Römer ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“. Das griechische Wort kann Juden im ethnisch-religiösen Sinn oder Menschen aus Judäa im geografischen Sinn bezeichnen; hier sind wahrscheinlich die jüdischen Gegner in Jerusalem gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: hatten … ergriffen
  rationale: Das passive Partizip bezeichnet hier ein feindliches Ergreifen oder Festhalten, ohne zwingend eine förmliche Festnahme auszudrücken.
- source_word: Ἰουδαίων
  choice: die Juden
  rationale: Der Ausdruck bezeichnet hier die jüdische Gruppe in Jerusalem, die gegen Paulus vorging. Die mögliche geografische Wiedergabe wird in einer Fußnote bewahrt.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: wollten ihn gerade töten
  rationale: Die Verbindung drückt eine unmittelbar bevorstehende Tötung aus. Im Deutschen gibt die aktive Form mit dem bereits genannten Handlungsträger den Sinn natürlich wieder.
- source_word: ἐπιστὰς
  choice: Da kam ich … hinzu
  rationale: Das Partizip bezeichnet das Hinzukommen beziehungsweise Eingreifen; „hinzukommen“ bewahrt die räumliche und situative Nuance.
- source_word: σὺν τῷ στρατεύματι
  choice: mit den Soldaten
  rationale: στράτευμα bezeichnet hier die militärische Truppe, mit der der Befehlshaber eingriff. „Soldaten“ ist im Kontext klar und natürlich.
- source_word: ἐξειλάμην
  choice: rettete ihn
  rationale: Das Medium von ἐξαιρέω bedeutet in diesem Zusammenhang, jemanden aus unmittelbarer Gefahr zu retten.
- source_word: μαθὼν
  choice: nachdem ich erfahren hatte
  rationale: Die Form stellt das Erfahren als der Rettung vorausgehend dar und erhält damit die Aussagefolge des Briefes.
- source_word: Ῥωμαῖός ἐστιν
  choice: dass er Römer ist
  rationale: Die direkte Wiedergabe erhält die Gegenwartsform und lässt die im rechtlichen Kontext naheliegende Bedeutung der römischen Bürgerschaft implizit.
theological_decisions:
- issue: Historisch-rhetorische Darstellung im Brief des Tribuns
  choice: Die Behauptung des Tribuns wird so wiedergegeben, wie sie im griechischen Text formuliert ist.
  alternative: Die zeitliche Aussage an den ausführlicheren Handlungsablauf in Apostelgeschichte 21–22 angleichen oder die Spannung erklärend glätten.
  rationale: Der Vers gibt die Selbstdarstellung des Claudius Lysias wieder. Die Übersetzung darf die Spannung zur vorangehenden Erzählung weder harmonisieren noch durch Zusätze auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Satzteilung vermeidet eine schwerfällige Partizipialkette, während Reihenfolge und rhetorische Spannung der griechischen Aussage erhalten bleiben.
