  source_fidelity: „Als sie davon erfuhren“ gibt συνιδόντες im Kontext angemessen wieder; das Bezugsobjekt ist die im vorherigen Vers genannte Anschlagsabsicht. „flohen“ trifft κατέφυγον im erzählerischen Zusammenhang. Die Ziele – die Städte Lykaoniens, Lystra und Derbe, sowie das Umland – sind vollständig und in der richtigen Verknüpfung wiedergegeben.
  naturalness: Der Satz ist klares modernes Standarddeutsch. Die Gedankenstriche markieren die Apposition „Lystra und Derbe“ gut, und die Wiederholung von „in“ vor „das umliegende Gebiet“ ist idiomatisch und verdeutlicht die gemeinsame Zielrichtung.
