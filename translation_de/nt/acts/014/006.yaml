  variant: modern standard German
source:
  edition: SBLGNT
  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: de
  text: Als sie davon erfuhren[a], flohen sie in die Städte Lykaoniens – Lystra und Derbe – und in das umliegende Gebiet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als sie das erkannten“ oder „Als ihnen das bewusst wurde“. Das griechische Partizip bezeichnet, dass sie die im vorherigen Vers beschriebene Gefahr erkannten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: Als sie davon erfuhren
  rationale: Das Aoristpartizip von συνοράω bezeichnet hier, dass sie die im vorherigen Vers geschilderte Gefahr erkannten beziehungsweise davon Kenntnis erhielten. Das im Deutschen nötige Bezugswort „davon“ wird aus dem Kontext ergänzt.
- source_word: κατέφυγον
  choice: flohen sie
  rationale: καταφεύγω kann „fliehen“ oder „Zuflucht suchen“ bedeuten. Im Zusammenhang steht die rasche Flucht vor der drohenden Gewalt im Vordergrund.
- source_word: εἰς
  choice: in
  rationale: Bei einer Bewegung bezeichnet εἰς das Ziel. Vor „Städte“ und „Gebiet“ ist „in“ im Deutschen natürlich.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: die Städte Lykaoniens
  rationale: Der Genitiv bezeichnet die regionale Zugehörigkeit. Diese Formulierung bewahrt die griechische Struktur und leitet zur Benennung der Städte über.
- source_word: Λύστραν καὶ Δέρβην
  choice: Lystra und Derbe
  rationale: Dies sind die üblichen deutschen Formen der Ortsnamen; sie stehen als erläuternde Apposition zu „die Städte Lykaoniens“.
- source_word: τὴν περίχωρον
  choice: das umliegende Gebiet
  rationale: Das substantivierte περίχωρος bezeichnet das Gebiet rings um die genannten Städte und kann städtisches wie ländliches Umland umfassen.
- source_word: καὶ ... καὶ
  choice: – Lystra und Derbe – und
  rationale: Die Gedankenstriche kennzeichnen „Lystra und Derbe“ als Erläuterung zu den zuvor genannten Städten; das folgende „und“ fügt das Umland als weiteres Ziel hinzu.
theological_decisions: []
