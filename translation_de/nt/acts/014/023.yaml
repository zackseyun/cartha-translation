review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur gibt die beiden aoristischen Partizipien als vorausgehende Handlungen und παρέθεντο als Haupthandlung zuverlässig wieder. „in jeder Gemeinde“, „Älteste“, „dem Herrn anvertrauen“ und die offene Referenz von αὐτούς sind sachgerecht. Die Wiedergabe „an den sie gläubig geworden waren“ trifft zwar die intendierte Vorzeitigkeit, ist mit „an den“ im modernen Standarddeutsch jedoch nicht idiomatisch; πιστεύω εἰς wird hier am besten mit „an den sie geglaubt hatten“ wiedergegeben.
  naturalness: Der Satz ist insgesamt klar und würdevoll. „Unter Fasten beten“ ist möglich und registergerecht. Die Formulierung „an den sie gläubig geworden waren“ wirkt hingegen syntaktisch und idiomatisch unnatürlich; „an den sie geglaubt hatten“ ist die übliche deutsche Verbindung und bewahrt das Plusquamperfekt.
  terminology: „Gemeinde“, „Älteste“ und „Herr“ sind im Kontext etablierte, verständliche Begriffe. „Eingesetzt“ legt kein bestimmtes Wahl- oder Leitungsmodell fest. Die Fußnote zu χειροτονήσαντες wahrt die mögliche, aber im Vers nicht festgelegte Wahlbedeutung. Die Fußnote zum Pronomen sollte dessen Bezug eindeutiger benennen, statt von einem „zweiten sie“ zu sprechen.
  issues:
  - severity: medium
    issue: „an den sie gläubig geworden waren“
    rationale: „Gläubig werden“ wird im Deutschen gewöhnlich mit „an etwas/jemanden glauben“ oder „zum Glauben an ... kommen“ verbunden, nicht mit „an den ... gläubig werden“. Die Formulierung ist daher nicht natürliches Standarddeutsch. „an den sie geglaubt hatten“ bildet πιστεύω εἰς und πεπιστεύκεισαν unmittelbar ab.
  - severity: low
    issue: 'Fußnote b: „Das zweite ‚sie‘“'
    rationale: Die Formulierung ist im deutschen Satz nicht eindeutig, weil mehrere Pronomen vorkommen. Die Fußnote sollte ausdrücklich das mit „sie“ wiedergegebene Objektpronomen benennen.
