  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: de
  text: Nachdem sie ihnen in jeder Gemeinde Älteste eingesetzt[a] und unter Fasten gebetet hatten, vertrauten sie sie dem Herrn an[b], an den sie geglaubt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Älteste gewählt“. Das griechische Verb kann in manchen Zusammenhängen eine Wahl durch Handzeichen bezeichnen, hier aber auch einfach die Auswahl und Einsetzung.'
    reason: alternative_reading
  - marker: b
    text: Das mit „sie“ wiedergegebene griechische Pronomen kann sich auf die Gläubigen der Gemeinden insgesamt oder speziell auf die neu eingesetzten Ältesten beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: eingesetzt
  rationale: Das Verb bezeichnet hier die Auswahl beziehungsweise Einsetzung von Personen. „Eingesetzt“ gibt den Kern der Handlung wieder, ohne ein bestimmtes kirchliches Wahlverfahren vorauszusetzen.
- source_word: κατ’ ἐκκλησίαν
  choice: in jeder Gemeinde
  rationale: 'Die distributive Verbindung mit κατά bezeichnet die einzelnen örtlichen Gemeinden: Gemeinde für Gemeinde.'
- source_word: πρεσβυτέρους
  choice: Älteste
  rationale: Im Gemeindekontext bezeichnet das Wort anerkannte Leiter und nicht lediglich ältere Männer.
- source_word: προσευξάμενοι
  choice: gebetet hatten
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Begleithandlung und wird zusammen mit dem ersten Partizip natürlich als Vorzeitigkeit wiedergegeben.
- source_word: μετὰ νηστειῶν
  choice: unter Fasten
  rationale: Die Wendung bezeichnet Fasten als Begleitung des Gebets; „unter Fasten“ ist knapp, idiomatisch und bewahrt den religiösen Handlungskontext.
- source_word: παρέθεντο
  choice: vertrauten … an
  rationale: Die mediale Form bezeichnet, dass Personen der Fürsorge eines anderen anbefohlen beziehungsweise anvertraut werden.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Der Dativ nennt denjenigen, dessen Fürsorge die betreffenden Personen anvertraut werden.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: an den sie gläubig geworden waren
  rationale: πιστεύω mit εἰς bezeichnet auf eine Person gerichteten Glauben. Das Plusquamperfekt verweist auf den bereits zuvor entstandenen Glauben; die Formulierung vermeidet die im Deutschen mögliche missverständliche Lesart von „geglaubt hatten“ als bloß vergangenem, inzwischen beendetem Glauben.
- source_word: αὐτοῖς … αὐτοὺς
  choice: ihnen … sie
  rationale: Die Pronomen bleiben entsprechend dem griechischen Text erhalten. Das zweite „sie“ bezieht sich im Zusammenhang wahrscheinlich auf die Gläubigen beziehungsweise Gemeinden, kann grammatisch aber auch enger auf die neu eingesetzten Ältesten bezogen werden.
theological_decisions:
- issue: Bedeutung von χειροτονήσαντες im Blick auf die Gemeindeleitung
  choice: Älteste eingesetzt
  alternative: Älteste gewählt beziehungsweise durch Handzeichen bestimmt
  rationale: Das Wort kann geschichtlich mit einer Wahl durch Handzeichen verbunden sein, bezeichnet im Koine-Griechischen jedoch auch allgemein Auswahl oder Einsetzung. Der Vers legt kein bestimmtes konfessionelles Wahl- oder Leitungsmodell eindeutig fest.
- issue: Bezugswort von αὐτοὺς in παρέθεντο αὐτοὺς τῷ κυρίῳ
  choice: wahrscheinlich die Gläubigen beziehungsweise Gemeinden
  alternative: die neu eingesetzten Ältesten
  rationale: Der weitere Zusammenhang handelt von den Jüngern, und das vorangehende αὐτοῖς weist auf diejenigen, für die Älteste eingesetzt wurden. Wegen der grammatischen Nähe der Ältesten bleibt die engere Bezugsmöglichkeit jedoch offen und wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bildet die beiden vorausgehenden Partizipialhandlungen als koordinierte Handlungen ab. „Gemeinde“ ist im neutestamentlichen Kontext natürlicher als „Kirche“; „Älteste“ wahrt den etablierten Leitungsbegriff. Die Pronomenmehrdeutigkeit des griechischen Textes wird nicht im Haupttext aufgelöst.
