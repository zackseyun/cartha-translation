  text: καὶ λαλήσαντες ἐν Πέργῃ τὸν λόγον κατέβησαν εἰς Ἀττάλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: de
  text: Und nachdem sie in Perge das Wort verkündet hatten, gingen sie hinab nach Attalia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλήσαντες
  choice: nachdem sie … verkündet hatten
  rationale: Das Aoristpartizip bezeichnet hier am natürlichsten eine Handlung, die der durch das Hauptverb ausgedrückten Weiterreise vorausgeht. Im Zusammenhang mit τὸν λόγον gibt „verkündet“ den öffentlichen Mitteilungscharakter idiomatisch wieder, ohne ein stärkeres griechisches Verkündigungsverb vorauszusetzen.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: Die feste frühchristliche Wendung für die verkündete Botschaft bleibt erhalten. „Die Botschaft“ wäre verständlich, würde aber die wiederkehrende lukanische Ausdrucksweise einebnen; „das Wort des Herrn“ stünde ausführlicher da als der griechische Text.
- source_word: ἐν Πέργῃ
  choice: in Perge
  rationale: ἐν mit dem Stadtnamen bezeichnet den Ort der Handlung und wird im Deutschen natürlich mit „in“ wiedergegeben.
- source_word: κατέβησαν
  choice: zogen sie hinab
  rationale: καταβαίνω bezeichnet eine abwärts gerichtete Bewegung. „Hinabziehen“ passt zu einer Reisegruppe und bewahrt den geografischen Zug von der im Landesinneren gelegenen Stadt Perge zur Küstenstadt Attalia.
- source_word: εἰς Ἀττάλειαν
  choice: nach Attalia
  rationale: εἰς bezeichnet hier das Reiseziel; bei Städtenamen ist „nach“ die natürliche deutsche Entsprechung.
- source_word: καὶ
  choice: Und
  rationale: καί führt die Reiseerzählung schlicht weiter, ohne eine zusätzliche zeitliche oder argumentative Nuance einzutragen.
theological_decisions: []
