  yaml_path: translation/nt/acts/014/028.yaml
  text: And they stayed with the disciples for no little time[a].
translation:
  language: de
  text: Und sie blieben eine nicht geringe Zeit bei den Jüngern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „eine beträchtliche Zeit“ oder „ziemlich lange“. Im Griechischen steht eine Litotes: „eine nicht geringe Zeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: sie blieben
  rationale: Das Imperfekt bezeichnet einen andauernden Aufenthalt. „Sie blieben“ ist im modernen Deutsch natürlich und bewahrt den durativen Sinn.
- source_word: δὲ
  choice: Und
  rationale: δέ setzt die Erzählung mit einer leichten Verknüpfung fort; „Und“ gibt diese Funktion knapp und angemessen wieder.
- source_word: χρόνον οὐκ ὀλίγον
  choice: eine nicht geringe Zeit
  rationale: Die Formulierung bewahrt die Litotes des Griechischen und bleibt im Deutschen verständlich; gemeint ist eine beträchtliche Zeitspanne.
- source_word: σὺν τοῖς μαθηταῖς
  choice: bei den Jüngern
  rationale: σύν bezeichnet Gemeinschaft bzw. Zusammensein. Bei einem Aufenthalt klingt „bei den Jüngern“ im Deutschen natürlicher als „mit den Jüngern“, ohne das gemeinsame Verweilen aufzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Litotes wird im Haupttext bewusst erhalten; die Fußnote bietet geläufigere idiomatische Wiedergaben.
