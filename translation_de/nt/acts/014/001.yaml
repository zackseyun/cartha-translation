id: ACT.14.1
reference: Acts 14:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: de
  text: In Ikonion betraten sie gemeinsam die Synagoge der Juden[a] und sprachen so, dass eine große Menge von Juden wie auch von Griechen glaubte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die jüdische Synagoge«. Wörtlich: »die Synagoge der Juden«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ohne eigenständige Wiedergabe
  rationale: Die Wendung dient hier vor allem der Fortführung der Erzählung. Eine wörtliche Übersetzung wie »Es geschah aber« wäre im modernen Deutschen unnötig schwerfällig; ein ausdrückliches zeitliches »Nun« steht nicht im griechischen Text.
- source_word: ἐν Ἰκονίῳ
  choice: In Ikonion
  rationale: Direkte Ortsangabe; der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: κατὰ τὸ αὐτό
  choice: gemeinsam
  rationale: Die idiomatische Wendung bezeichnet hier am natürlichsten das gemeinsame Handeln von Paulus und Barnabas.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: betraten sie
  rationale: Der von ἐγένετο abhängige Infinitiv wird im Deutschen idiomatisch als finites Verb wiedergegeben. »Betraten« bezeichnet die Bewegung in die Synagoge knapp und klar.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: die Synagoge der Juden
  rationale: Die Genitivverbindung τῶν Ἰουδαίων bleibt ausdrücklich erhalten. Die ebenfalls mögliche attributive Wiedergabe wird in der Fußnote genannt.
- source_word: λαλῆσαι
  choice: sprachen
  rationale: λαλέω bezeichnet hier ihr Reden beziehungsweise Verkündigen. »Sprachen« ist direkt und fügt keinen im Text nicht genannten Gegenstand hinzu.
- source_word: οὕτως ὥστε
  choice: so, dass
  rationale: Die Formulierung verbindet die Art ihres Redens mit dem daraus folgenden Glauben und klingt zugleich natürlich auf Deutsch.
- source_word: πιστεῦσαι
  choice: glaubte
  rationale: Das Verb bezeichnet die Reaktion auf die apostolische Verkündigung. Da das griechische Verb kein ausdrückliches Objekt nennt, bleibt auch die Übersetzung offen.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: von Juden wie auch von Griechen
  rationale: Die Konstruktion τε καὶ schließt beide Gruppen ausdrücklich ein. »Wie auch« gibt diese Verbindung in natürlichem Deutsch wieder.
- source_word: πολὺ πλῆθος
  choice: eine große Menge
  rationale: Die Wendung hebt die beträchtliche Zahl der Glaubenden hervor und bewahrt das kollektive Bild von πλῆθος.
theological_decisions:
- issue: Bedeutung von πιστεῦσαι im erzählerischen Zusammenhang
  choice: glaubte
  alternative: zum Glauben kam; der Botschaft glaubte
  rationale: »Glaubte« gibt das Verb unmittelbar wieder und lässt das im Griechischen nicht ausgesprochene Objekt offen. »Zum Glauben kam« wäre idiomatisch, deutete den Vorgang aber stärker als Bekehrungsformel; »der Botschaft glaubte« ergänzte ein Objekt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, ohne die formelhafte Eröffnung Ἐγένετο δὲ hölzern nachzubilden.
