  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: de
  text: Und in Lystra saß ein Mann, der keine Kraft in den Füßen hatte. Er war von Mutterleib an lahm und war noch nie gegangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καί
  choice: Und
  rationale: Ein schlichter erzählerischer Anschluss an den vorhergehenden Abschnitt.
- source_word: τις ἀνὴρ
  choice: ein Mann
  rationale: Das Deutsche gibt die unbestimmte, aber konkrete Einführung einer Person natürlich mit „ein Mann“ wieder; „ein gewisser Mann“ wäre hier unnötig steif.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: der keine Kraft in den Füßen hatte
  rationale: Bewahrt den Gedanken fehlender Kraft und nimmt χωλός nicht vorweg.
- source_word: ἐν Λύστροις
  choice: in Lystra
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: ἐκάθητο
  choice: saß
  rationale: Das Imperfekt beschreibt den anhaltenden Zustand; im deutschen Erzählstil bringt das Präteritum dies ohne zusätzliche Umschreibung natürlich zum Ausdruck.
- source_word: χωλός
  choice: gelähmt
  rationale: Bezeichnet hier die angeborene Gehbehinderung; „gelähmt“ ist im heutigen Deutsch verständlich und würdevoll, während „lahm“ auf Personen vielfach abwertend klingt.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: von Mutterleib an
  rationale: Bewahrt das anschauliche griechische Idiom in einer etablierten deutschen Wendung.
- source_word: οὐδέποτε περιεπάτησεν
  choice: war noch nie gegangen
  rationale: Bezeichnet seinen lebenslangen Zustand bis zu diesem Zeitpunkt; „noch nie“ bildet οὐδέποτε idiomatisch ab.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die gestufte Beschreibung des griechischen Textes bleibt erhalten: zuerst die fehlende Kraft in den Füßen, dann ausdrücklich die Lähmung seit dem Mutterleib und schließlich, dass der Mann noch nie gegangen war.'
