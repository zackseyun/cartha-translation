  text: Und nachdem sie Pisidien durchquert hatten, kamen sie nach Pamphylien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Reiseerzählung fort und entspricht dem koordinierenden καί.
- source_word: διελθόντες
  choice: nachdem sie … durchquert hatten
  rationale: Das Partizip Aorist bezeichnet hier eine Handlung, die der Haupthandlung zeitlich vorausgeht. Die Formulierung gibt dieses Verhältnis im Deutschen klar und natürlich wieder.
- source_word: τὴν Πισιδίαν
  choice: Pisidien
  rationale: Der regionale Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: ἦλθον
  choice: kamen sie
  rationale: Die schlichte Wiedergabe von ἔρχομαι passt zur erzählten Reisebewegung und vermeidet eine unnötige Präzisierung als bloßes Ankommen.
- source_word: εἰς τὴν Παμφυλίαν
  choice: nach Pamphylien
  rationale: εἰς bezeichnet die Bewegung in das Gebiet hinein; bei geografischen Gebieten ohne Artikel ist „nach“ im Deutschen die natürliche Richtungsangabe.
