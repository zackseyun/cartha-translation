source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: de
  text: 'Als die Volksmengen sahen, was Paulus getan hatte, erhoben sie ihre Stimmen und riefen auf Lykaonisch[a]: »Die Götter sind Menschen gleich geworden[b] und zu uns herabgekommen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der lykaonischen Sprache«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Menschen gleich gemacht worden«; das griechische Wort kann hier auch einfach das Gleichwerden beziehungsweise die Ähnlichkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε ὄχλοι
  choice: Als die Volksmengen
  rationale: τέ führt die Erzählung weiter; der Plural ὄχλοι wird mit »Volksmengen« bewahrt. Zusammen mit dem folgenden Partizip ergibt sich im Deutschen natürlich ein temporaler Nebensatz.
- source_word: ἰδόντες
  choice: sahen
  rationale: 'Das Aoristpartizip bezeichnet hier am natürlichsten den zeitlichen Umstand der Haupthandlung: »Als … sahen«.'
- source_word: ὃ ἐποίησεν Παῦλος
  choice: was Paulus getan hatte
  rationale: Das Plusquamperfekt verdeutlicht idiomatisch, dass die Tat der Reaktion der Volksmengen vorausging, ohne den Inhalt der Tat näher auszudeuten.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: erhoben sie ihre Stimmen
  rationale: Die Wendung bezeichnet lautes Sprechen oder Rufen. Die Übersetzung wahrt das Bild und den im Griechischen ausdrücklich vorhandenen Pluralbezug.
- source_word: Λυκαονιστί
  choice: auf Lykaonisch
  rationale: Das Adverb bezeichnet die lykaonische Sprache. »Auf Lykaonisch« ist im heutigen Deutsch knapp und eindeutig.
- source_word: λέγοντες
  choice: und riefen
  rationale: Wegen der zuvor erhobenen Stimmen gibt »riefen« die Art des Sprechens natürlich wieder; die inhaltliche Rede wird unmittelbar angeschlossen.
- source_word: Οἱ θεοὶ
  choice: Die Götter
  rationale: Der Plural bezeichnet die heidnischen Gottheiten, für die die Volksmengen Paulus und Barnabas halten.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: sind Menschen gleich geworden
  rationale: Die Formulierung bewahrt die ausgesagte Ähnlichkeit und gibt das vorzeitige Aoristpartizip als Teil der aufgeregten Feststellung wieder, ohne christologische Begrifflichkeit einzutragen.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: und zu uns herabgekommen
  rationale: »Herabkommen« entspricht der räumlichen Grundbedeutung von καταβαίνω. Das Perfekt passt zur unmittelbaren, begeisterten Feststellung der Sprechenden.
theological_decisions:
- issue: Wiedergabe der heidnischen Deutung ohne Eintragung christlicher Inkarnationsterminologie
  choice: Die Götter sind Menschen gleich geworden und zu uns herabgekommen
  alternative: Die Götter sind in Menschengestalt zu uns herabgekommen
  rationale: Die gewählte Fassung hält die Aussage der Volksmengen als deren heidnische Deutung fest und bildet ὁμοιωθέντες gesondert ab. »In Menschengestalt« wäre flüssiger, würde aber den partizipialen Vorgang stärker zu einer bloßen Zustandsangabe verdichten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Volksmengen« wahrt den griechischen Plural; »riefen« macht die durch das Erheben der Stimmen bezeichnete Lautstärke idiomatisch deutlich. Die direkte Rede bleibt lebhaft, ohne die heidnische Aussage dogmatisch umzudeuten.
