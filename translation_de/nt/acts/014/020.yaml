  variant: modern standard German
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: de
  text: Doch als die Jünger sich um ihn versammelt hatten[a], stand er auf[b] und ging in die Stadt. Am nächsten Tag zog er zusammen mit Barnabas weiter nach Derbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn umringt hatten“ beziehungsweise „einen Kreis um ihn gebildet hatten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „er erhob sich“. Das griechische Wort kann so wiedergegeben werden; hier bezeichnet es wahrscheinlich das körperliche Aufstehen des Paulus und nicht ausdrücklich eine Auferstehung.'
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: sich um ihn versammelt hatten
  rationale: Das Verb bezeichnet wörtlich ein Umringen oder Umgeben. Im Zusammenhang mit den Jüngern gibt die Formulierung ihre räumliche Bewegung natürlich wieder, ohne einen feindseligen Beiklang nahezulegen.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel markiert hier eine leichte Gegenbewegung zu der unmittelbar vorausgehenden Steinigung und dem Hinausschleifen des Paulus.
- source_word: τῶν μαθητῶν
  choice: die Jünger
  rationale: „Jünger“ ist die etablierte und im Kontext der Apostelgeschichte sachlich passende Wiedergabe von μαθηταί.
- source_word: ἀναστὰς
  choice: stand er auf
  rationale: Das Partizip beschreibt hier zunächst die körperliche Handlung des Aufstehens. Die Wiedergabe vermeidet es, ausdrücklich eine Auferweckung zu behaupten, die der griechische Wortlaut nicht eigens formuliert.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: ging in die Stadt
  rationale: Die Formulierung bewahrt die gerichtete Bewegung und klingt im Deutschen in Verbindung mit „stand er auf“ natürlich.
- source_word: τῇ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Die temporale Dativform bezeichnet den folgenden Tag; diese Wendung ist im modernen Deutsch idiomatisch.
- source_word: ἐξῆλθεν ... εἰς Δέρβην
  choice: zog ... weiter nach Derbe
  rationale: Wörtlich steht „ging hinaus ... nach Derbe“. „Zog weiter“ gibt im Reisebericht sowohl das Verlassen der Stadt als auch die Bewegung zum genannten Ziel flüssig wieder.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: zusammen mit Barnabas
  rationale: σύν mit Dativ bezeichnet Begleitung; „zusammen mit“ hebt diese eindeutig hervor.
- source_word: Δέρβην
  choice: Derbe
  rationale: Dies ist die übliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Ob ἀναστὰς eine Auferstehung oder wundersame Auferweckung bezeichnet
  choice: 'Als gewöhnliche körperliche Handlung wiedergegeben: „stand er auf“'
  alternative: „er erhob sich“ oder „er wurde auferweckt“
  rationale: ἀναστὰς kann schlicht das Aufstehen bezeichnen. Obwohl die Erholung nach der Steinigung außergewöhnlich erscheint, sagt der Vers nicht ausdrücklich, Paulus sei gestorben oder auferweckt worden. Die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ lässt den überraschenden Gegensatz zum vorherigen Geschehen erkennen. „Zog weiter“ ist im erzählenden Reisebericht natürlich und vermeidet die im Deutschen schwerfällige wörtliche Folge „ging hinaus ... nach“.
