  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: de
  text: Die Juden aber, die sich weigerten zu glauben,[a] wiegelten die Nichtjuden gegen die Brüder auf und vergifteten deren Haltung gegenüber den Brüdern.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ungehorsam waren«. Das griechische Wort kann sowohl Ungehorsam als auch die Weigerung bezeichnen, einer Botschaft Glauben zu schenken; hier ist wahrscheinlich die Ablehnung des Evangeliums gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Seelen der Nichtjuden«; gemeint ist hier ihre innere Haltung oder Einstellung.'
    reason: lexical_alternative
  - marker: c
    text: »Brüder« bezeichnet hier wahrscheinlich die Glaubensgeschwister insgesamt, einschließlich der Frauen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: die sich weigerten zu glauben
  rationale: Das Partizip kann sowohl Ungehorsam als auch die Weigerung zu glauben bezeichnen. Im missionarischen Zusammenhang ist die bewusste Ablehnung der verkündeten Botschaft gemeint; die Formulierung bewahrt dabei das willentliche Moment.
- source_word: Ἰουδαῖοι
  choice: die Juden
  rationale: Gemeint ist im Zusammenhang die örtliche Gruppe von Juden, die sich der Botschaft widersetzte, nicht das jüdische Volk insgesamt. Die direkte Wiedergabe lässt diese kontextuelle Begrenzung bestehen.
- source_word: ἐπήγειραν
  choice: wiegelten ... auf
  rationale: Die Wendung gibt das Hervorrufen feindseliger Stimmung oder feindseligen Handelns natürlich und treffend wieder.
- source_word: ἐκάκωσαν
  choice: vergifteten
  rationale: Mit ψυχάς als Objekt bezeichnet das Verb hier eine schädliche Beeinflussung der inneren Haltung; »vergifteten ihre Gesinnung« ist im Deutschen idiomatisch und erhält die Bildkraft.
- source_word: τὰς ψυχὰς
  choice: ihre Gesinnung
  rationale: Wörtlich steht »die Seelen«. Hier geht es jedoch um die innere Einstellung der Nichtjuden gegenüber den Glaubenden; »Gesinnung« gibt diesen Sinn ohne anthropologische Überdeutung wieder.
- source_word: τῶν ἐθνῶν
  choice: die Nichtjuden
  rationale: Im jüdisch-nichtjüdischen Gegensatz bezeichnet ἔθνη hier Menschen aus den Völkern. »Nichtjuden« ist im modernen Deutsch unmittelbar verständlich und vermeidet die heute weniger geläufige Bezeichnung »Heiden«.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: gegen die Brüder
  rationale: Die formale maskuline Pluralform wird im Haupttext bewahrt. Der frühchristliche Gemeinschaftsbegriff kann zugleich Glaubensgeschwister beiderlei Geschlechts einschließen, was die Fußnote erläutert.
theological_decisions:
- issue: Bedeutung von ἀπειθήσαντες zwischen Glaubensverweigerung und Ungehorsam
  choice: die sich weigerten zu glauben
  alternative: die ungehorsam waren
  rationale: Der unmittelbare Verkündigungskontext legt die Ablehnung der Botschaft nahe, während »sich weigerten« den in ἀπειθέω enthaltenen Aspekt widerständigen Ungehorsams nicht völlig einebnet.
- issue: Wiedergabe von ἀδελφῶν bei möglichem Bezug auf eine gemischtgeschlechtliche christliche Gemeinschaft
  choice: Brüder
  alternative: Brüder und Schwestern; Glaubenden
  rationale: Der Haupttext bleibt nahe an der grammatischen Form des Griechischen. Da der Ausdruck im frühchristlichen Sprachgebrauch wahrscheinlich die Glaubensgemeinschaft insgesamt bezeichnet, wird der inklusive Umfang in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit »aber« wahrt den erzählerischen Kontrast. »Nichtjuden« ist verständlicher und weniger missverständlich als »Heiden«; »Gesinnung vergiften« gibt das griechische Bild natürlich wieder. Alle echten lexikalischen Spannungen werden in den Fußnoten offengehalten.
