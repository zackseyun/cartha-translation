source:
  edition: SBLGNT
  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: de
  text: Dieser Mann hörte Paulus beim Reden zu. Paulus blickte ihn aufmerksam an und erkannte, dass er Glauben hatte, geheilt zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerettet zu werden“. Das griechische Verb kann sowohl „retten“ als auch „heilen“ bedeuten; hier spricht der Zusammenhang für körperliche Heilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Dieser Mann
  rationale: Das Demonstrativpronomen verweist auf den gelähmten Mann aus dem vorhergehenden Vers; die ausdrückliche Wiedergabe macht den Bezug im Deutschen klar.
- source_word: ἤκουσεν
  choice: hörte … zu
  rationale: Im Zusammenhang bezeichnet das Verb aufmerksames Hören; „zuhören“ ist dafür natürliches modernes Deutsch.
- source_word: τοῦ Παύλου λαλοῦντος
  choice: Paulus beim Reden
  rationale: Die Genitivkonstruktion mit dem Partizip beschreibt das Reden des Paulus, dem der Mann zuhört. „Reden“ wahrt den allgemeinen Sinn, ohne eine bestimmte Form der Verkündigung hinzuzufügen.
- source_word: ἀτενίσας αὐτῷ
  choice: blickte ihn aufmerksam an
  rationale: Das Verb bezeichnet einen festen, konzentrierten Blick; die Formulierung ist klar und würdevoll, ohne die negative Färbung von „anstarren“.
- source_word: ἰδὼν
  choice: erkannte
  rationale: 'Das Wahrnehmungsverb meint hier mehr als bloßes optisches Sehen: Paulus nimmt den Glauben des Mannes wahr. „Erkannte“ gibt diesen kontextuellen Sinn natürlich wieder.'
- source_word: ἔχει πίστιν
  choice: dass er den Glauben hatte
  rationale: πίστις bezeichnet hier den glaubenden, vertrauenden Bezug des Mannes auf Gottes Hilfe. „Glauben“ wahrt zugleich den theologischen Wortlaut.
- source_word: τοῦ σωθῆναι
  choice: geheilt zu werden
  rationale: σῴζω kann retten oder heilen bedeuten. Die unmittelbar folgende körperliche Wiederherstellung des gelähmten Mannes legt hier „heilen“ nahe; die weitere Bedeutung bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Bedeutung von σωθῆναι im Heilungsbericht
  choice: körperliche Heilung („geheilt zu werden“)
  alternative: umfassendere Rettung beziehungsweise Heil („gerettet zu werden“)
  rationale: Der unmittelbare Erzählzusammenhang handelt von der Wiederherstellung der Gehfähigkeit. Dennoch besitzt das griechische Verb eine breitere Bedeutung, die nicht stillschweigend ausgeschlossen werden darf und deshalb in einer Fußnote genannt wird.
- issue: Beziehung zwischen Glaube und Heilung
  choice: Die Formulierung „den Glauben hatte, geheilt zu werden“ bleibt eng am griechischen Text.
  alternative: Eine kausale Aussage wie „weil er genug glaubte“
  rationale: Der Text stellt Glauben im Hinblick auf die Heilung fest, erklärt aber weder dessen Maß noch einen allgemeinen Mechanismus. Zusätzliche dogmatische Folgerungen werden vermieden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der lange griechische Relativsatz wurde in zwei Sätze gegliedert, um den Bezug von ὃς eindeutig auf Paulus zu beziehen und im Deutschen eine missverständliche Satzverknüpfung zu vermeiden.
