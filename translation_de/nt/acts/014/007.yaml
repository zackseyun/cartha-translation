lexical_decisions:
- source_word: κἀκεῖ
  choice: Und dort
  rationale: κἀκεῖ verbindet καί und ἐκεῖ. „Und dort“ bewahrt sowohl den Anschluss an die vorherige Erzählung als auch die Ortsangabe; „auch dort“ bleibt als mögliche Nuance erhalten.
- source_word: εὐαγγελιζόμενοι
  choice: verkündeten sie die gute Nachricht
  rationale: Das Verb εὐαγγελίζω bezeichnet das Verkünden einer guten Nachricht, im Kontext besonders der Heilsbotschaft. „Die gute Nachricht verkünden“ ist verständlich, würdig und bildet den verbalen Charakter ohne unnötige kirchliche Fachsprache ab.
- source_word: ἦσαν
  choice: verkündeten
  rationale: ἦσαν bildet mit dem Partizip εὐαγγελιζόμενοι eine periphrastische Imperfektkonstruktion und bezeichnet einen andauernden Vorgang in der Vergangenheit. Im Deutschen gibt das einfache Präteritum diesen Verlauf natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, erzählerischem und würdigem Stil. „Gute Nachricht“ gibt die Grundbedeutung transparent wieder; die traditionelle Wiedergabe „Evangelium“ steht als Alternative in der Fußnote.
