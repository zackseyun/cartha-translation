  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: de
  text: 'Er sagte mit lauter Stimme: „Stell dich gerade auf deine Füße!“ Da sprang der Mann auf und begann zu gehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da sprang der Mann auf und ging.“ Das Imperfekt kann eine fortdauernde Handlung oder den Beginn des Gehens hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: mit lauter Stimme
  rationale: Die Dativverbindung bezeichnet die Art des Sprechens. „Mit lauter Stimme“ ist im modernen Deutschen idiomatisch und gibt die öffentliche, nachdrückliche Äußerung treffend wieder.
- source_word: Ἀνάστηθι
  choice: Stell dich
  rationale: Der Aoristimperativ von ἀνίστημι fordert hier dazu auf, eine stehende Haltung einzunehmen. Zusammen mit „aufrecht auf deine Füße“ ergibt sich eine klare und natürliche deutsche Aufforderung.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: auf deine Füße
  rationale: Die Präpositionalverbindung bezeichnet die Haltung beziehungsweise Position auf den eigenen Füßen und lässt sich unmittelbar ins Deutsche übertragen.
- source_word: ὀρθός
  choice: aufrecht
  rationale: ὀρθός beschreibt die gerade, aufrechte Körperhaltung und wird im Deutschen am natürlichsten adverbial wiedergegeben.
- source_word: ἥλατο
  choice: sprang der Mann auf
  rationale: Die Form von ἅλλομαι bezeichnet eine plötzliche, lebhafte Sprungbewegung. Das ergänzte Subjekt „der Mann“ sorgt nach dem Sprecherwechsel für Klarheit, ohne den Sinn zu erweitern.
- source_word: περιεπάτει
  choice: begann umherzugehen
  rationale: Das Imperfekt kann den Beginn beziehungsweise den Verlauf der Handlung hervorheben; „begann umherzugehen“ bewahrt den inchoativen Sinn und gibt zugleich die räumliche Nuance von περιπατέω wieder.
theological_decisions:
- issue: Wunderhandlung und Aufforderung zur aufrechten Haltung
  choice: Die Aufforderung und die unmittelbar folgende körperliche Reaktion werden ohne Ausschmückung als sichtbares Heilungsgeschehen wiedergegeben.
  alternative: Die Reaktion ausdrücklich als übernatürliches Wunder zu erläutern oder zusätzliche Glaubensaussagen einzufügen.
  rationale: Der griechische Text berichtet eine direkte Aufforderung und eine sofortige körperliche Reaktion. Die Übersetzung bewahrt diese Konkretheit, ohne theologische Erklärungen hinzuzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und kraftvoll; „der Mann“ verdeutlicht den Subjektwechsel im deutschen Erzählfluss. Die Fußnote erhält die aspektuelle Mehrdeutigkeit des Imperfekts.
