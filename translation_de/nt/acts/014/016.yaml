id: ACT.14.16
reference: Acts 14:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: de
  text: In den vergangenen Generationen ließ er alle Völker ihre eigenen Wege gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gestattete er allen Heiden, auf ihren Wegen zu gehen«.'
    reason: Lexikalische Alternativen für ἔθνη, εἴασεν und die Wegmetapher.
lexical_decisions:
- source_word: ὃς
  choice: er
  rationale: Das Relativpronomen bezieht sich auf Gott im vorherigen Vers. Im Deutschen führt ein neuer Hauptsatz mit »er« den Gedanken natürlich fort.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: In den vergangenen Generationen
  rationale: Die Formulierung gibt den zeitlichen Sinn von bereits vergangenen Geschlechtern klar und in modernem Standarddeutsch wieder.
- source_word: εἴασεν
  choice: ließ
  rationale: »Ließ« drückt Erlaubnis beziehungsweise Nicht-Eingreifen aus, ohne Zustimmung oder kausale Bestimmung zu behaupten.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: »Völker« bewahrt den kollektiven ethnischen Sinn von ἔθνη; je nach Kontext ist auch »Heiden« möglich.
- source_word: πορεύεσθαι
  choice: gehen
  rationale: In Verbindung mit »Wege« bewahrt »gehen« die griechische Wegmetapher und klingt im Deutschen natürlicher als »wandeln«.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: ihre eigenen Wege
  rationale: Die Wendung gibt die possessive Bedeutung von αὐτῶν idiomatisch wieder und bezeichnet bildlich die jeweilige Lebensführung.
theological_decisions:
- issue: Göttliche Erlaubnis gegenüber Zustimmung
  choice: Gott ließ die Völker ihre eigenen Wege gehen.
  alternative: Gott billigte oder bestimmte ihre Wege.
  rationale: εἴασεν bezeichnet Zulassen. Die Übersetzung wahrt die Spannung zwischen Gottes Souveränität und menschlicher Verantwortung, ohne moralische Billigung oder Determinismus einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Wegmetapher bleibt erhalten; das altertümlicher wirkende »wandeln« wird vermieden.
