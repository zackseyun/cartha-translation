  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: de
  text: Als aber Nichtjuden und Juden[b] zusammen mit ihren Anführern den Versuch unternahmen[a], sie zu misshandeln und zu steinigen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Ansturm entstand“ oder „ein Angriff erfolgte“. Das griechische Wort ὁρμή kann einen heftigen Vorstoß oder Angriff bezeichnen. „Versuch“ wurde gewählt, weil das Misshandeln und Steinigen als beabsichtigt, nicht als bereits ausgeführt dargestellt wird.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann in manchen Zusammenhängen auch „Judäer“ bedeuten. Hier sind wahrscheinlich jüdische Gegner als Gruppe gemeint, nicht speziell Menschen aus Judäa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: Als aber … den Versuch unternahmen
  rationale: Die Formulierung gibt den zeitlichen Anschluss von ὡς und die leicht weiterführende beziehungsweise kontrastierende Kraft von δέ natürlich wieder. Zusammen mit ὁρμή bezeichnet ἐγένετο hier das Zustandekommen eines feindlichen Vorhabens.
- source_word: ὁρμή
  choice: Versuch
  rationale: ὁρμή kann einen Ansturm, Angriff oder heftigen Vorstoß bezeichnen. Da die beabsichtigten Handlungen durch Infinitive ausgedrückt werden und im Vers nicht als vollzogen erscheinen, bewahrt „Versuch“ diesen noch nicht abgeschlossenen Charakter.
- source_word: τῶν ἐθνῶν τε καὶ Ἰουδαίων
  choice: Nichtjuden und Juden
  rationale: Im Gegensatz zu Ἰουδαῖοι bezeichnet ἔθνη hier Menschen aus den anderen Völkern, nicht politische Nationen. „Nichtjuden“ ist im heutigen Deutsch klarer und weniger kirchensprachlich als „Heiden“. τε καὶ verbindet beide Gruppen als gemeinsam Beteiligte.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: zusammen mit ihren führenden Männern
  rationale: ἄρχοντες bezeichnet Personen mit leitender oder obrigkeitlicher Stellung. Die Wiedergabe lässt offen, ob kommunale, gesellschaftliche oder politische Führungspersonen gemeint sind.
- source_word: ὑβρίσαι
  choice: zu misshandeln
  rationale: ὑβρίζω bezeichnet überhebliche, entehrende oder gewaltsame Misshandlung und ist weiter als bloßes Beschimpfen.
- source_word: λιθοβολῆσαι
  choice: zu steinigen
  rationale: Die Wiedergabe entspricht dem Verb, ohne mit „zu Tode steinigen“ einen im griechischen Wortlaut nicht ausdrücklich genannten Ausgang hinzuzufügen.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist im Zusammenhang auf Paulus und Barnabas.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Nichtjuden“ vermeidet das heute leicht abwertend oder missverständlich wirkende „Heiden“. Die Satzform bleibt wegen des anschließenden Verses bewusst offen und endet mit einem Komma.
