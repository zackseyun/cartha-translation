id: ACT.14.21
reference: Acts 14:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: de
  text: Und nachdem sie in jener Stadt die gute Nachricht[a] verkündet und viele zu Jüngern gemacht hatten, kehrten sie nach Lystra, nach Ikonion und nach Antiochia zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Evangelium.'
    reason: 'Lexikalische Alternative: „die gute Nachricht“ gibt den Inhalt allgemein verständlich wieder; „das Evangelium“ ist die traditionelle kirchliche Formulierung.'
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: nachdem sie … die gute Nachricht verkündet … hatten
  rationale: Das Aoristpartizip bezeichnet eine der Rückkehr vorausgehende Handlung. „Die gute Nachricht verkünden“ gibt εὐαγγελίζομαι verständlich und in seinem evangelistischen Sinn wieder.
- source_word: τε
  choice: Und
  rationale: τε verbindet den Satz locker mit dem Vorhergehenden; „Und“ bewahrt diesen fortlaufenden Erzählzusammenhang.
- source_word: τὴν πόλιν ἐκείνην
  choice: in jener Stadt
  rationale: Die Wendung verweist im Zusammenhang auf Derbe. „Jene Stadt“ entspricht dem Demonstrativ und klingt in gehobener, moderner Erzählsprache natürlich.
- source_word: μαθητεύσαντες
  choice: viele zu Jüngern gemacht hatten
  rationale: Das transitive Verb bedeutet, Menschen zu Jüngern zu machen. Die Formulierung bewahrt diesen aktiven Sinn, ohne ihn auf bloße Unterweisung zu verengen.
- source_word: ἱκανοὺς
  choice: viele
  rationale: ἱκανός bezeichnet hier eine beträchtliche Anzahl; „viele“ ist prägnant und idiomatisch.
- source_word: ὑπέστρεψαν
  choice: kehrten … zurück
  rationale: Die Form bezeichnet die Rückkehr an bereits besuchte Orte; „zurückkehren“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: nach Lystra, nach Ikonion und nach Antiochia
  rationale: Das wiederholte „nach“ bildet die dreimalige Zielangabe mit εἰς ab und hält die Reiseroute deutlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Partizipialkonstruktionen werden als natürlicher deutscher Temporalsatz wiedergegeben; die wiederholten Zielangaben bleiben zur Betonung der Reiseroute erhalten.
