  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: de
  text: 'Als aber die Apostel Barnabas und Paulus davon hörten, zerrissen sie ihre Kleider[a], sprangen in die Menschenmenge[b] und riefen laut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zerreißen der Kleider war ein gebräuchliches Zeichen von Trauer, Entsetzen oder Protest gegen eine als gotteslästerlich empfundene Ehrerweisung.
    reason: cultural_note
  - marker: b
    text: 'Oder: „stürmten in die Menschenmenge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: als … davon hörten
  rationale: Das Aoristpartizip hat hier zeitliche Bedeutung. „Davon“ stellt im Deutschen natürlich den Bezug zum beabsichtigten Opfer im vorhergehenden Kontext her, ohne zusätzliche Deutung einzuführen.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Kontrast zwischen dem Handeln der Menge und der entsetzten Reaktion der Apostel.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: die Apostel Barnabas und Paulus
  rationale: Bewahrt die griechische Apposition und bezeichnet Barnabas und Paulus in diesem Zusammenhang ausdrücklich als Apostel.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: zerrissen sie ihre Kleider
  rationale: Gibt die konkrete Handlung und ihre kulturell erkennbare Bedeutung mit einer geläufigen, würdigen deutschen Wendung wieder.
- source_word: ἐξεπήδησαν εἰς τὸν ὄχλον
  choice: liefen hinaus in die Menschenmenge
  rationale: „Liefen hinaus“ vermittelt die plötzliche, dringliche Bewegung des Verbs; „in die Menschenmenge“ bewahrt die durch εἰς bezeichnete Bewegungsrichtung.
- source_word: κράζοντες
  choice: und riefen laut
  rationale: Das begleitende Präsenspartizip beschreibt lautes Rufen während der Bewegung. Die koordinierte deutsche Form ist natürlich und leitet unmittelbar zur folgenden Rede über.
theological_decisions:
- issue: Bezeichnung von Barnabas und Paulus als Apostel
  choice: „die Apostel Barnabas und Paulus“ unverändert beibehalten
  alternative: „Barnabas und Paulus, die Gesandten“ oder eine Einschränkung des Apostelbegriffs
  rationale: Der griechische Text identifiziert beide an dieser Stelle ausdrücklich als ἀπόστολοι. Die Übersetzung bewahrt diese Aussage, ohne den Begriff aufgrund späterer Debatten einzuengen oder auszuweiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung bleibt nah am griechischen Ablauf; der Doppelpunkt bereitet die in Vers 15 folgende direkte Rede vor.
