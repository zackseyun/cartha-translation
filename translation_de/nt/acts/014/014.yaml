  source_fidelity: 'Die Wiedergabe ist insgesamt quellentreu: Barnabas und Paulus werden ausdrücklich als Apostel bezeichnet, das Zerreißen der Kleider und das laute Rufen bleiben erhalten. „Hinaus“ in „liefen hinaus in die Menschenmenge“ ist jedoch im deutschen Haupttext nicht hinreichend durch εἰς τὸν ὄχλον gedeckt; die Bewegungsrichtung ist in die Menge hinein. Das Verb ἐξεπήδησαν vermittelt eine plötzliche, energische Bewegung.'
