source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: de
  text: Als sie angekommen waren und die Gemeinde zusammengerufen hatten, berichteten sie alles, was Gott mit ihnen getan hatte,[a] und dass er den Nichtjuden eine Tür zum Glauben geöffnet hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was Gott durch sie getan hatte“. Wörtlicher lautet das Griechische: „mit ihnen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Völkern eine Tür zum Glauben geöffnet hatte“. Das griechische Wort kann „Völker“ bedeuten, bezeichnet hier aber im jüdischen Sprachgebrauch Nichtjuden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Als sie angekommen waren
  rationale: Das temporale Verhältnis des Aoristpartizips zur anschließenden Berichterstattung wird in natürlichem Deutsch wiedergegeben.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: die Gemeinde zusammengerufen hatten
  rationale: Gemeint ist das Einberufen der örtlichen christlichen Versammlung; „Gemeinde“ ist im Deutschen hier natürlicher als „Kirche“.
- source_word: ἀνήγγελλον
  choice: berichteten sie
  rationale: Das Imperfekt bezeichnet das ausführliche Berichten gegenüber der Gemeinde und passt zum Kontext des Missionsberichts.
- source_word: ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: alles, was Gott mit ihnen getan hatte
  rationale: „Mit ihnen“ bewahrt die unmittelbare Bedeutung von μετά mit Genitiv und legt die Art ihrer Mitwirkung nicht vorschnell als bloße Instrumentalität fest.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: „Völker“ gibt ἔθνη unmittelbar wieder; im Kontext bezeichnet der Ausdruck die nichtjüdischen Völker. Eine Fußnote nennt die kontextuell geläufige Alternative „Nichtjuden“.
- source_word: θύραν πίστεως
  choice: die Tür zum Glauben
  rationale: Die Türmetapher bleibt erhalten, während „zum Glauben“ die griechische Genitivverbindung in verständlichem Deutsch ausdrückt.
- source_word: πίστεως
  choice: Glauben
  rationale: „Glauben“ ist hier die sachgerechte Wiedergabe von πίστις und bezeichnet den durch Gottes Handeln eröffneten Zugang beziehungsweise die Möglichkeit zu glauben.
theological_decisions:
- issue: Bedeutung von μετ’ αὐτῶν bei Gottes Handeln
  choice: was Gott mit ihnen getan hatte
  alternative: was Gott durch sie getan hatte
  rationale: 'Die Hauptfassung wahrt die offene Formulierung des Griechischen: Gott bleibt der Handelnde, während Paulus und Barnabas mit seinem Wirken verbunden sind, ohne ihre Rolle stärker instrumental zu bestimmen.'
- issue: Bedeutung von τοῖς ἔθνεσιν
  choice: den Völkern
  alternative: den Nichtjuden
  rationale: Die wörtlichere Hauptfassung bewahrt den kollektiven Ausdruck; die Fußnote verdeutlicht, dass im Erzählzusammenhang Menschen aus den nichtjüdischen Völkern gemeint sind.
- issue: Genitivverbindung θύραν πίστεως
  choice: die Tür zum Glauben
  alternative: eine Tür des Glaubens
  rationale: Die gewählte Form ist idiomatisches Deutsch und bewahrt die Metapher, ohne abschließend festzulegen, ob der Genitiv Zugang zum Glauben, Gelegenheit zu glauben oder den Bereich des Glaubens bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem griechischen Ablauf, vermeidet jedoch schwerfällige Partizipialkonstruktionen. „Gemeinde“ entspricht dem örtlichen christlichen Versammlungszusammenhang; echte lexikalische und theologische Offenheiten werden in den Fußnoten erhalten.
