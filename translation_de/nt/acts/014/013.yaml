id: ACT.14.13
reference: Acts 14:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: de
  text: Der Priester des Zeus, dessen Tempel vor der Stadt lag,[a] brachte Stiere und Kränze zu den Toren und wollte zusammen mit den Menschenmengen ein Opfer darbringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »des Zeus, der vor der Stadt war«; wahrscheinlich ist der Tempel oder das Heiligtum des Zeus außerhalb der Stadt gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »opfern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: Der
  rationale: Die Verbindung führt die Erzählung weiter; im Deutschen ist kein ausdrückliches »und« nötig, da der Satz unmittelbar an den vorherigen Zusammenhang anschließt.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: der Priester des Zeus
  rationale: Ζεύς bezeichnet den griechischen Gott Zeus; die römische Entsprechung »Jupiter« wird nicht eingesetzt.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: dessen Tempel vor der Stadt lag
  rationale: Die Wendung bestimmt Zeus nach seinem außerhalb beziehungsweise vor der Stadt gelegenen Kultort. »Tempel« ist sinngemäß ergänzt, um die im Griechischen knappe Ortsbezeichnung verständlich wiederzugeben.
- source_word: ταύρους
  choice: Stiere
  rationale: Die direkte Bedeutung passt zum Zusammenhang eines Tieropfers.
- source_word: στέμματα
  choice: Kränze
  rationale: Gemeint sind kultische Fest- oder Opferkränze; »Kränze« ist im Deutschen prägnant und natürlich.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: zu den Toren
  rationale: Die Präposition bezeichnet zusammen mit dem Bewegungsverb das Ziel; der Plural des Ausgangstextes bleibt erhalten.
- source_word: ἐνέγκας
  choice: brachte
  rationale: Das aoristische Partizip wird für einen natürlichen deutschen Satz als beigeordnetes Prädikat wiedergegeben.
- source_word: σὺν τοῖς ὄχλοις
  choice: zusammen mit den Menschenmengen
  rationale: Der Plural ὄχλοις wird bewahrt; »Menschenmengen« macht deutlich, dass die versammelten Leute gemeint sind.
- source_word: ἤθελεν θύειν
  choice: wollte … ein Opfer darbringen
  rationale: Die Formulierung gibt sowohl die Absicht als auch den kultischen Sinn von θύω wieder.
theological_decisions:
- issue: Bezug von τοῦ ὄντος πρὸ τῆς πόλεως
  choice: Die Wendung wird auf den vor der Stadt gelegenen Tempel des Zeus bezogen.
  alternative: 'Wörtlicher: »des Zeus, der vor der Stadt war«; möglich ist auch ein allgemeinerer Bezug auf ein Heiligtum.'
  rationale: Eine Gottheit konnte nach dem Standort ihres Kultortes bezeichnet werden. Die Ergänzung »Tempel« ergibt im Kontext einen verständlichen Sinn, während die Fußnote die grammatische Kürze und Mehrdeutigkeit des Griechischen offenlegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kultischen Begriffe bleiben konkret; die im Griechischen implizite Ortsangabe wird im Text vorsichtig verdeutlicht und in der Fußnote offengelegt.
