  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: de
  text: 'und sagten: „Männer, warum tut ihr das? Auch wir sind Menschen wie ihr und teilen dieselbe menschliche Erfahrung. Wir bringen euch die gute Nachricht, dass ihr euch von diesen nichtigen Dingen[a] abwenden und dem lebendigen Gott zuwenden sollt, der den Himmel, die Erde, das Meer und alles, was darin ist, gemacht hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den „nichtigen Dingen“ ist im Zusammenhang die vergebliche heidnische Verehrung, besonders die Götzenverehrung, gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: Männer
  rationale: Die direkte Anrede wahrt den männlichen Plural von ἀνήρ und passt zur öffentlichen Rede.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: Menschen und haben dieselbe menschliche Natur wie ihr
  rationale: Die Formulierung gibt die gemeinsame menschliche Verfasstheit und Erfahrungswelt wieder und betont gegenüber der beabsichtigten Vergöttlichung, dass Paulus und Barnabas bloße Menschen sind.
- source_word: εὐαγγελιζόμενοι
  choice: Wir bringen euch die gute Nachricht
  rationale: Die verbale Bedeutung wird verständlich wiedergegeben, ohne den Ausdruck vorschnell auf späteren kirchlichen Sprachgebrauch einzuengen.
- source_word: ἀπὸ τούτων τῶν ματαίων
  choice: von diesen nichtigen Dingen
  rationale: „Nichtig“ bewahrt die Bedeutung von leer, vergeblich und wertlos, ohne das im Kontext Gemeinte im Haupttext ausdrücklich auf Götzenbilder zu verengen.
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: euch ... abwenden und dem lebendigen Gott zuwenden
  rationale: Die deutsche Wendung macht sowohl die durch ἀπό bezeichnete Abkehr als auch die durch ἐπί bezeichnete Hinwendung natürlich und deutlich.
- source_word: ἐποίησεν
  choice: gemacht hat
  rationale: „Machen“ entspricht ποιέω unmittelbar und bewahrt den biblischen Schöpfungsanklang.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς
  choice: den Himmel, die Erde, das Meer und alles, was darin ist
  rationale: Die Aufzählung und ihr umfassender Abschluss werden in natürlichem Deutsch bewahrt.
theological_decisions:
- issue: Menschlicher Status von Paulus und Barnabas gegenüber göttlicher Verehrung
  choice: Auch wir sind Menschen und haben dieselbe menschliche Natur wie ihr
  alternative: Auch wir sind nur Menschen wie ihr
  rationale: Die gewählte Fassung bewahrt den ausdrücklichen Gehalt von ὁμοιοπαθεῖς und weist die Vergöttlichung zurück, ohne die Aussage auf gleiche Gefühle zu reduzieren.
- issue: Bedeutungsumfang von τὰ μάταια
  choice: nichtige Dinge
  alternative: Götzen
  rationale: Der Zusammenhang betrifft heidnische Opfer und Verehrung; der griechische Ausdruck ist jedoch weiter als ein ausdrückliches Wort für „Götzen“. Diese Offenheit bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- issue: Der lebendige Gott im Gegensatz zu heidnischer Verehrung
  choice: dem lebendigen Gott
  alternative: zu einem lebendigen Gott
  rationale: Der artikellose griechische Ausdruck ist in dieser festen theologischen Gegenüberstellung qualitativ zu verstehen; im Deutschen bezeichnet „dem lebendigen Gott“ idiomatisch den einen Schöpfer, ohne den Gegensatz zu leblosen Kultobjekten abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Männer“ und die wiederholten Schöpfungsbegriffe wahren die rhetorische Kraft; „dieselbe menschliche Natur“ erklärt das seltene ὁμοιοπαθεῖς verständlich, ohne die gemeinsame menschliche Verfasstheit abzuschwächen.
