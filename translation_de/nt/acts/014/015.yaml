- from: 'und riefen: „Männer, warum tut ihr das? Auch wir sind Menschen und haben dieselbe menschliche Natur wie ihr. Wir bringen euch die gute Nachricht, dass ihr euch von diesen nichtigen Dingen[a] abwenden und dem lebendigen Gott zuwenden sollt, der den Himmel, die Erde, das Meer und alles, was darin ist, gemacht hat.“'
  to: 'und sagten: „Männer, warum tut ihr das? Auch wir sind Menschen wie ihr und teilen dieselbe menschliche Erfahrung. Wir bringen euch die gute Nachricht, dass ihr euch von diesen nichtigen Dingen[a] abwenden und dem lebendigen Gott zuwenden sollt, der den Himmel, die Erde, das Meer und alles, was darin ist, gemacht hat.“'
  rationale: Die Revision ersetzt die nicht vom griechischen Wortlaut geforderte Steigerung „riefen“ durch „sagten“. Sie gibt ὁμοιοπαθεῖς idiomatischer als gemeinsame menschliche Erfahrung wieder, ohne die Aussage auf bloße Gefühle zu begrenzen oder eine metaphysische Lehre von „derselben Natur“ zu formulieren. Die Fußnote erläutert den kultischen Kontext, ohne den weiten Ausdruck τὰ μάταια im Haupttext oder in der Anmerkung unnötig zu verengen.
