  - severity: medium
    issue: „haben dieselbe menschliche Natur wie ihr“ für ὁμοιοπαθεῖς
    rationale: Die Formulierung ist abstrakt und legt „Natur“ stärker ontologisch fest. Gemeint ist die gemeinsame menschliche Bedingtheit bzw. Erfahrung; außerdem ist die Verbindung mit „wir sind Menschen“ stilistisch redundant.
