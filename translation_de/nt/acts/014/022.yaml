  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: de
  text: 'Dabei stärkten sie die Jünger innerlich und ermutigten sie, am Glauben[a] festzuhalten. Sie sagten: »Durch viele Bedrängnisse müssen wir in das Reich Gottes eingehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „im Glauben bleiben“. Das griechische Wort kann sowohl persönliches Glaubensvertrauen als auch den gemeinsam bekannten christlichen Glauben bezeichnen; der Artikel weist eher auf Letzteres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: stärkten
  rationale: Das Verb bezeichnet ein Festigen oder weiteres Stärken. „Stärkten“ ist im modernen Deutsch klar und gibt die fortdauernde Tätigkeit der Handelnden natürlich wieder.
- source_word: τὰς ψυχὰς τῶν μαθητῶν
  choice: die Jünger innerlich
  rationale: ψυχή bezeichnet hier die Person in ihrem inneren Leben. Die Wendung vermeidet das im Deutschen leicht dualistisch oder unnatürlich wirkende „die Seelen der Jünger“, ohne den inneren Aspekt zu verlieren.
- source_word: παρακαλοῦντες
  choice: ermutigten
  rationale: Im Zusammenhang verbindet das Wort Zuspruch mit eindringlicher Aufforderung. „Ermutigten“ bewahrt den unterstützenden Ton und ist allgemein verständlich.
- source_word: ἐμμένειν
  choice: festzuhalten
  rationale: Das Verb bedeutet, bei etwas zu bleiben oder darin auszuharren. „Am Glauben festzuhalten“ bringt die geforderte Beständigkeit idiomatisch zum Ausdruck.
- source_word: τῇ πίστει
  choice: am Glauben
  rationale: Der Artikel kann auf den gemeinsam bekannten christlichen Glauben weisen. Die deutsche Formulierung bleibt zugleich offen dafür, ob stärker der Glaubensinhalt oder das vertrauende Glauben gemeint ist.
- source_word: διὰ πολλῶν θλίψεων
  choice: durch viele Bedrängnisse
  rationale: θλῖψις bezeichnet Druck, Not und bedrängendes Leiden. „Bedrängnisse“ wahrt die Schwere des Ausdrucks und klingt würdig, ohne unnötig altertümlich zu sein.
- source_word: δεῖ ἡμᾶς
  choice: müssen wir
  rationale: „Müssen“ gibt die im griechischen δεῖ ausgesagte Notwendigkeit knapp und kräftig wieder, ohne deren theologischen Grund näher festzulegen.
- source_word: εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: in das Reich Gottes eingehen
  rationale: Die feste deutsche Wendung gibt sowohl die Bewegung des Eintretens als auch die traditionelle, mehrdimensionale Bedeutung von βασιλεία als Gottes Reich und Herrschaft wieder.
theological_decisions:
- issue: Bedeutung von πίστις mit Artikel
  choice: am Glauben
  alternative: im Glauben bleiben / am überlieferten Glauben festhalten
  rationale: Der griechische Artikel legt einen bestimmten, gemeinsam bekannten Glauben nahe, zwingt aber nicht zu einer ausschließlich objektiven Bedeutung im Sinn eines fest umrissenen Lehrbestands. Die Übersetzung bewahrt die Spannung zwischen Glaubensvertrauen und Glaubensinhalt.
- issue: Aussage der Notwendigkeit durch δεῖ
  choice: Durch viele Bedrängnisse müssen wir in das Reich Gottes eingehen
  alternative: Es ist für uns notwendig, durch viele Bedrängnisse in das Reich Gottes einzugehen
  rationale: „Müssen“ erhält die starke Notwendigkeits­aussage, ohne zu erklären, ob sie hier als göttliche Bestimmung, allgemeiner Weg der Nachfolge oder auf andere Weise zu verstehen ist.
- issue: Verhältnis von Bedrängnissen und Eintritt in Gottes Reich
  choice: durch viele Bedrängnisse … eingehen
  alternative: unter vielen Bedrängnissen … eingehen
  rationale: „Durch“ entspricht διά mit Genitiv und bewahrt die bildhafte Aussage eines Weges durch Leiden. Die Formulierung behauptet nicht, Bedrängnisse seien verdienstliche Ursache des Eintritts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Jünger innerlich stärken“ gibt den semitisch-griechisch geprägten Ausdruck „die Seelen der Jünger stärken“ natürlich wieder. „Dabei“ bindet die Partizipialkonstruktion an den vorausgehenden Erzählzusammenhang. Der mit ὅτι eingeleitete Inhalt wird wegen des eingeschlossenen „wir“ als Rede wiedergegeben; „sie sagten“ macht die im Griechischen implizite Redeeinleitung transparent.
