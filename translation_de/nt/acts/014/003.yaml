id: ACT.14.3
reference: Acts 14:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: de
  text: Sie blieben also geraume Zeit dort und redeten freimütig im Herrn[a]. Der Herr bezeugte das Wort seiner Gnade, indem er Zeichen und Wunder durch ihre Hände geschehen ließ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Vertrauen auf den Herrn“ oder „für den Herrn“. Die griechische Wendung kann ausdrücken, dass ihre Freimütigkeit im Herrn begründet war, sich auf ihn bezog oder in seinem Dienst geschah.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: geraume Zeit
  rationale: Die Wendung bezeichnet eine beträchtliche, nicht näher bestimmte Zeitspanne. „Geraume Zeit“ ist im Deutschen natürlich und würdevoll, ohne die Dauer zu übertreiben.
- source_word: διέτριψαν
  choice: blieben ... dort
  rationale: διατρίβω bedeutet hier, sich für eine gewisse Zeit an einem Ort aufzuhalten. Das im Deutschen nötige „dort“ ergibt sich aus dem Erzählzusammenhang.
- source_word: παρρησιαζόμενοι
  choice: sprachen ... freimütig
  rationale: Das Verb bezeichnet offenes, unerschrockenes Reden. „Freimütig sprechen“ gibt sowohl den Sprechakt als auch dessen Kühnheit wieder.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: im Vertrauen auf den Herrn
  rationale: ἐπί mit Dativ kann hier Grundlage oder Vertrauen bezeichnen. Die Formulierung macht verständlich, dass ihre Freimütigkeit im Herrn begründet war, ohne den möglichen Beziehungsumfang der Wendung völlig festzulegen.
- source_word: τῷ κυρίῳ
  choice: der Herr
  rationale: κύριος wird entsprechend dem griechischen Titel als „Herr“ wiedergegeben; der Name Jesus wird nicht ergänzt, da er im Ausgangstext nicht steht.
- source_word: τῷ μαρτυροῦντι
  choice: bezeugte
  rationale: μαρτυρέω hat eine bezeugende, bestätigende Bedeutung. Der deutsche Hauptsatz vermeidet eine schwerfällige Verschachtelung und wahrt den Herrn als handelndes Subjekt.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: das Wort seiner Gnade
  rationale: Die Formulierung erhält die Genitivverbindung und ihre mögliche Bedeutung als Wort, das von der Gnade handelt oder durch sie geprägt ist.
- source_word: χάριτος
  choice: Gnade
  rationale: „Gnade“ bewahrt das theologische Gewicht von χάρις im lukanischen Sprachgebrauch.
- source_word: διδόντι
  choice: indem er ... geschehen ließ
  rationale: Wörtlich „gebend/gewährend“ bezeichnet das Partizip hier, dass der Herr das Geschehen der Zeichen und Wunder ermöglichte. Die deutsche Konstruktion stellt zugleich ihre bezeugende Funktion heraus.
- source_word: σημεῖα καὶ τέρατα
  choice: Zeichen und Wunder
  rationale: Die feste biblische Wortverbindung bewahrt sowohl den Hinweischarakter als auch die staunenerregende Wirkung dieser Taten.
- source_word: γίνεσθαι
  choice: geschehen ließ
  rationale: Die kausative Wendung gibt im Zusammenhang mit διδόντι wieder, dass der Herr ihr Eintreten gewährte, ohne die Apostel als eigentliche Quelle der Taten erscheinen zu lassen.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: durch ihre Hände
  rationale: Die konkrete biblische Ausdrucksweise bleibt erhalten und kennzeichnet die Apostel als Werkzeuge des Geschehens.
theological_decisions:
- issue: Bezug von „der Herr“
  choice: Der Titel bleibt ohne erläuternde Ergänzung als „der Herr“ stehen.
  alternative: „der Herr Jesus“ oder eine ausdrückliche Beziehung auf Gott
  rationale: Der griechische Text nennt nur τῷ κυρίῳ. Obwohl der erzählerische Zusammenhang wahrscheinlich auf den auferstandenen Jesus weist, würde die Ergänzung seines Namens die Formulierung stärker festlegen als das Original.
- issue: Bedeutung von ἐπὶ τῷ κυρίῳ
  choice: „im Vertrauen auf den Herrn“ als Ausdruck der Grundlage ihrer Freimütigkeit
  alternative: „für den Herrn“ oder „in Verbundenheit mit dem Herrn“
  rationale: Die Präposition kann Grundlage, Vertrauen oder Beziehung ausdrücken. Der Haupttext bietet eine verständliche Deutung; die Fußnote wahrt die übrigen ernsthaften Möglichkeiten.
- issue: Art des Zeugnisses des Herrn
  choice: Der Herr bezeugt das Wort, indem er Zeichen und Wunder gewährt.
  alternative: Die beiden Partizipien lediglich nebeneinanderzustellen, ohne ihre sachliche Beziehung ausdrücklich zu markieren
  rationale: Die Zeichen und Wunder fungieren im Satz als göttliche Bestätigung der Botschaft. „Indem“ macht diesen naheliegenden Zusammenhang im Deutschen lesbar, ohne eine fremde handelnde Instanz einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der erste lange griechische Satz wurde zur besseren Lesbarkeit in zwei Sätze gegliedert; die fortgesetzte Handlung und der gemeinsame Bezug auf den Herrn bleiben erhalten.
