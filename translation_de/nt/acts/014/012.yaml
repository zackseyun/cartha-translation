  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: de
  text: Und sie nannten Barnabas Zeus und Paulus Hermes, weil er das Wort führte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »weil er beim Reden die führende Rolle hatte«, also der Hauptredner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: sie nannten
  rationale: Der Imperfekt beschreibt die Benennung im Verlauf der Szene; im natürlichen deutschen Erzählstil gibt das Präteritum den Vorgang angemessen wieder.
- source_word: τε
  choice: Und
  rationale: Die Partikel verbindet den Satz locker mit dem vorausgehenden Geschehen; »Und« bildet diesen narrativen Anschluss natürlich ab.
- source_word: Δία
  choice: Zeus
  rationale: Der griechische Text nennt ausdrücklich die griechische Gottheit Zeus, nicht ihr römisches Gegenstück Jupiter.
- source_word: Ἑρμῆν
  choice: Hermes
  rationale: Der griechische Text nennt ausdrücklich Hermes; »Merkur« wäre die aus der lateinischen Tradition stammende römische Entsprechung.
- source_word: ἐπειδὴ
  choice: weil
  rationale: Die Konjunktion nennt den Grund dafür, dass die Menge Paulus für Hermes hielt.
- source_word: αὐτὸς
  choice: er
  rationale: Das Pronomen verweist im Kontext auf Paulus. Eine zusätzliche Wiedergabe der leichten Hervorhebung durch »selbst« wäre im Deutschen unnötig schwerfällig.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: das Wort führte
  rationale: Die idiomatische deutsche Wendung bezeichnet Paulus als denjenigen, der beim Reden die führende Rolle übernahm, und bewahrt zugleich den Bezug von λόγος auf Rede bzw. Sprechen.
theological_decisions:
- issue: Wiedergabe heidnischer Götternamen
  choice: Zeus und Hermes
  alternative: Jupiter und Merkur
  rationale: Die griechischen Namen entsprechen unmittelbar dem Ausgangstext; die römischen Namen gehen auf spätere lateinische Übersetzungstradition zurück.
- issue: Bedeutung von τοῦ λόγου
  choice: 'auf das Reden bezogen: »das Wort führte«'
  alternative: 'auf eine theologisch verstandene Botschaft bezogen: »die Botschaft leitete«'
  rationale: Im Zusammenhang begründet die Wendung die Gleichsetzung des redenden Paulus mit Hermes. Daher ist die konkrete Rolle als Hauptredner gemeint, ohne λόγος unnötig theologisch aufzuladen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Das Wort führen« ist allgemein verständlich und idiomatisch; die Fußnote macht die Struktur und Bedeutungsbreite der griechischen Wendung sichtbar.
