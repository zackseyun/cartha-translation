id: ACT.14.26
reference: Acts 14:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: de
  text: Und von dort segelten sie nach Antiochia, von wo aus sie der Gnade Gottes für das Werk anvertraut worden waren, das sie vollendet hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Und von dort
  rationale: Bewahrt sowohl den erzählerischen Anschluss als auch den räumlichen Ausgangspunkt in natürlichem Deutsch.
- source_word: ἀπέπλευσαν
  choice: segelten sie … zurück
  rationale: Das Verb bezeichnet die Abfahrt auf dem Seeweg. „Zurück“ ergibt sich aus dem erzählerischen Ziel Antiochia und macht die Rückkehrbewegung idiomatisch deutlich, ohne ein zusätzliches theologisches Moment einzutragen.
- source_word: εἰς Ἀντιόχειαν
  choice: nach Antiochia
  rationale: Bei einer Ortsbewegung ist „nach“ im Deutschen die natürliche Wiedergabe von εἰς vor einem Städtenamen.
- source_word: ὅθεν
  choice: von wo aus
  rationale: Gibt die Herkunftsbedeutung des Relativadverbs ausdrücklich wieder und bezieht sich eindeutig auf Antiochia.
- source_word: ἦσαν παραδεδομένοι
  choice: sie … anvertraut worden waren
  rationale: Das periphrastische Plusquamperfekt bezeichnet eine vorausliegende Handlung. „Anvertraut“ bewahrt den Sinn des Übergebens in die Obhut der Gnade Gottes.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: der Gnade Gottes
  rationale: Die Dativkonstruktion wird direkt bewahrt; die theologisch gewichtige Genitivverbindung bleibt ohne Paraphrase erhalten.
- source_word: εἰς τὸ ἔργον
  choice: für das Werk
  rationale: „Werk“ ist die direkte, kontextoffene Wiedergabe und vermeidet die stärker deutende Bezeichnung „Mission“.
- source_word: ὃ ἐπλήρωσαν
  choice: das sie nun vollendet hatten
  rationale: „Vollendet“ gibt hier das Zu-Ende-Bringen des Werkes natürlich wieder. „Nun“ verdeutlicht lediglich den im Rückblick gegebenen Abschluss und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Art der früheren Übergabe von Paulus und Barnabas
  choice: der Gnade Gottes anvertraut
  alternative: der Gnade Gottes übergeben / empfohlen
  rationale: „Anvertraut“ beschreibt, dass sie für das Werk in Gottes gnädige Obhut gestellt wurden, ohne eine bestimmte kirchenrechtliche oder konfessionelle Vorstellung von Beauftragung einzutragen.
- issue: Bedeutung von πληρόω beim Werk
  choice: vollendet
  alternative: erfüllt
  rationale: Im Zusammenhang mit einem abgeschlossenen Werk steht das Zu-Ende-Bringen im Vordergrund. „Vollendet“ erhält zugleich mehr semantisches Gewicht als das rein organisatorische „abgeschlossen“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die Satzstruktur bleibt nahe am Griechischen, ist aber für heutige Leser flüssig; echte Mehrdeutigkeiten werden nicht konfessionell vereindeutigt.
