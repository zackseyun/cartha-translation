source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: de
  text: 'Und doch ließ er sich selbst nicht ohne Zeugnis: Er tat Gutes, gab euch Regen vom Himmel und fruchtbare Zeiten[a] und erfüllte eure Herzen mit Nahrung und Freude.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fruchtbringende Zeiten“.'
    reason: lexical_alternative
  - marker: b
    text: Eine Textvariante lautet „unsere Herzen“; der SBLGNT bietet „eure Herzen“.
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Und doch
  rationale: Gibt die konzessive Verbindung zum vorherigen Gedanken natürlich und prägnant wieder.
- source_word: οὐκ ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: ließ er sich nicht unbezeugt
  rationale: Bewahrt den reflexiven Bezug auf Gott und den Zeugnischarakter seiner Wohltaten; die deutsche Wendung ist knapp und würdevoll.
- source_word: ἀγαθουργῶν
  choice: Er tat Gutes
  rationale: Das Partizip erläutert, wie Gott sich bezeugte. Ein neuer Hauptsatz vermeidet eine schwerfällige Partizipialkonstruktion.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: gab euch Regen vom Himmel
  rationale: Gibt Quelle, Empfänger und Gabe klar wieder. Der deutsche Singular „Regen“ bezeichnet das Naturphänomen idiomatischer als der griechische Plural.
- source_word: καιροὺς καρποφόρους
  choice: ertragreiche Zeiten
  rationale: καιροί bezeichnet passende beziehungsweise bestimmte Zeiten; καρποφόρους ihre Frucht hervorbringende Produktivität. „Ertragreich“ klingt im heutigen Deutsch natürlicher als „fruchttragend“.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ὑμῶν
  choice: erfüllte eure Herzen mit Nahrung und Freude
  rationale: Folgt der Bildsprache und der SBLGNT-Lesart „eure Herzen“, ohne die ungewöhnliche Verbindung von Herzen und Nahrung aufzulösen.
theological_decisions:
- issue: Gottes Selbstzeugnis durch seine Güte
  choice: Gott bezeugt sich durch konkrete Wohltaten der Schöpfung und Fürsorge
  alternative: Die Aussagen lediglich als unpersönliche Naturvorgänge wiederzugeben
  rationale: Der reflexive Ausdruck „sich nicht unbezeugt“ und die Gott zugeschriebenen Handlungen stellen Regen, Erntezeiten, Nahrung und Freude ausdrücklich als sein Zeugnis dar.
- issue: Ungewöhnliche Aussage, dass Herzen mit Nahrung erfüllt werden
  choice: Die Bildsprache wörtlich bewahren
  alternative: „euch mit Nahrung und eure Herzen mit Freude erfüllen“
  rationale: Die geglättete Alternative wäre verständlicher, würde aber die syntaktische Spannung des griechischen Textes beseitigen und eine distributive Zuordnung ergänzen, die dort nicht ausdrücklich steht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die ungewöhnliche Bildsprache des Ausgangstextes bleibt erhalten; erläuterungsbedürftige lexikalische und textkritische Punkte stehen in knappen Fußnoten.
