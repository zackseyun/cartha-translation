reference: Acts 14:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: de
  text: 'Doch die Bevölkerung der Stadt spaltete sich[a]: Die einen hielten zu den Juden, die anderen zu den Aposteln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Die Menge der Stadt wurde gespalten.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: spaltete sich
  rationale: Das griechische Passiv bezeichnet ein Geteilt- oder Gespaltenwerden. Im Deutschen gibt die idiomatische Wendung „sich spalten“ die gesellschaftliche Teilung natürlich und treffend wieder.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: die Bevölkerung der Stadt
  rationale: πλῆθος bezeichnet hier nicht bloß eine momentan versammelte Menge, sondern die Menschen der Stadt als größere Gesamtheit. „Bevölkerung der Stadt“ ist präzise und modern.
- source_word: δὲ
  choice: Doch
  rationale: δέ führt eine leicht kontrastierende Weiterentwicklung gegenüber dem vorangehenden Geschehen ein. „Doch“ markiert diesen Gegensatz knapp.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: die einen ... die anderen
  rationale: Die Korrelativkonstruktion teilt die Bevölkerung in zwei gegenüberstehende Gruppen; die deutsche Paarformel bildet dies unmittelbar ab.
- source_word: σὺν
  choice: hielten zu
  rationale: σύν bezeichnet Zugehörigkeit oder Verbindung. Im Zusammenhang einer gespaltenen Stadt bringt „zu jemandem halten“ die Parteinahme natürlicher zum Ausdruck als ein bloßes „mit“.
- source_word: Ἰουδαίοις
  choice: den Juden
  rationale: Der Ausdruck bezeichnet hier die im Kontext genannte jüdische Gruppe; der Vers selbst beschränkt ihn nicht ausdrücklich auf deren führende Vertreter.
- source_word: ἀποστόλοις
  choice: den Aposteln
  rationale: „Apostel“ ist die etablierte und verständliche Wiedergabe. In Apostelgeschichte 14,14 bezeichnet Lukas Barnabas und Paulus ausdrücklich ebenso.
theological_decisions:
- issue: Bezeichnung von Barnabas und Paulus als Apostel
  choice: die Apostel
  alternative: die Gesandten
  rationale: Die direkte Wiedergabe bewahrt Lukas’ eigene Bezeichnung, ohne daraus eine über den Text hinausgehende Lehraussage über das Apostelamt abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich, bewahrt den Kontrast und gibt die gesellschaftliche Parteinahme idiomatisch wieder.
