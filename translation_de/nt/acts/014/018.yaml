id: ACT.14.18
reference: Acts 14:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντες μόλις κατέπαυσαν τοὺς ὄχλους τοῦ μὴ θύειν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: de
  text: Doch selbst mit diesen Worten konnten sie die Menschenmenge kaum davon abhalten, ihnen Opfer darzubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Doch selbst mit diesen Worten
  rationale: 'Im Zusammenhang hat καί verstärkende beziehungsweise konzessive Kraft: Trotz ihrer ausdrücklichen Zurückweisung des Opfers gelang es ihnen nur knapp, die Menge aufzuhalten.'
- source_word: μόλις κατέπαυσαν
  choice: konnten sie … kaum davon abhalten
  rationale: μόλις bezeichnet, dass etwas nur mit Mühe beziehungsweise gerade noch erreicht wurde; die deutsche Formulierung gibt den knappen Erfolg natürlich wieder.
- source_word: τοὺς ὄχλους
  choice: die Menschenmenge
  rationale: Der griechische Plural kann die versammelten Volksmengen bezeichnen; im Deutschen ist hier der kollektive Singular idiomatisch.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: ihnen Opfer darzubringen
  rationale: Die Genitivkonstruktion ergänzt κατέπαυσαν und bezeichnet die verhinderte Handlung. θύειν meint im kultischen Zusammenhang das Darbringen eines Opfers.
theological_decisions:
- issue: Die Apostel als Empfänger eines kultischen Opfers
  choice: ihnen Opfer darzubringen
  alternative: für sie zu opfern
  rationale: Der Dativ αὐτοῖς bezeichnet hier die Personen, denen geopfert werden sollte. Die Wiedergabe bewahrt die im Kontext zentrale Zurückweisung göttlicher Verehrung durch Barnabas und Paulus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Doch selbst“ trägt die konzessive Zuspitzung, während „kaum davon abhalten“ den gerade noch erfolgreichen Ausgang wahrt.
