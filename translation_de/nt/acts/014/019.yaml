  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: de
  text: Doch aus Antiochia und Ikonion kamen Juden. Sie brachten die Menschenmengen auf ihre Seite, steinigten Paulus und schleppten ihn in der Annahme, dass er tot sei, aus der Stadt hinaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Annahme, dass er gestorben sei“. Der griechische Text gibt die Annahme der Angreifer wieder und sagt nicht ausdrücklich, dass Paulus tatsächlich starb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: Doch … kamen
  rationale: δέ kennzeichnet hier nach dem vorherigen günstigen Verlauf eine gegensätzliche Wendung; die Verbform bezeichnet das Eintreffen der Gegner.
- source_word: Ἰουδαῖοι
  choice: Juden
  rationale: Der Ausdruck bezeichnet hier jüdische Gegner aus Antiochia und Ikonion, nicht speziell Bewohner Judäas.
- source_word: πείσαντες τοὺς ὄχλους
  choice: Sie brachten die Menschenmengen auf ihre Seite
  rationale: Die Formulierung gibt die vorausgehende und für das weitere Geschehen maßgebliche Einflussnahme idiomatisch wieder, ohne ihren Inhalt näher festzulegen.
- source_word: λιθάσαντες τὸν Παῦλον
  choice: steinigten Paulus
  rationale: Das koordinierte Aoristpartizip bezeichnet eine vor dem Hinausschleppen vollzogene gewaltsame Handlung.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: schleppten ihn aus der Stadt
  rationale: „Schleppten“ vermittelt die Gewalt von σύρω; „aus der Stadt“ wahrt die gerichtete Bewegung von ἔξω mit Genitiv.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: weil sie meinten, er sei tot
  rationale: Das Partizip nennt ihre Annahme als Beweggrund; der deutsche Konjunktiv I markiert die berichtete Einschätzung, während „tot sei“ den aus dem Sterben resultierenden Zustand des griechischen Perfekts wiedergibt.
theological_decisions:
- issue: Ob Paulus tatsächlich starb oder nur für tot gehalten wurde
  choice: 'Der Haupttext berichtet ausschließlich die Einschätzung der Angreifer: „weil sie meinten, er sei tot“.'
  alternative: Man kann aus dem weiteren Verlauf folgern, Paulus sei tatsächlich gestorben und wieder lebendig geworden.
  rationale: νομίζοντες kennzeichnet ausdrücklich eine Annahme der Handelnden; der Vers selbst stellt den tatsächlichen Tod des Paulus nicht fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung vermeidet eine schwerfällige Partizipienkette. „Menschenmengen“ bewahrt den Plural von ὄχλους; „auf ihre Seite bringen“ ist natürlich und lässt offen, mit welchen Argumenten die Menge beeinflusst wurde.
