id: ACT.7.49
reference: Acts 7:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: de
  text: Der Himmel ist mein Thron, die Erde aber der Schemel meiner Füße. Was für ein Haus werdet ihr mir bauen, spricht der Herr, oder welcher Ort ist der Ort meiner Ruhe?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: der Himmel
  rationale: Im kosmischen Gegensatz zur Erde bezeichnet das Wort hier den Himmel als göttlichen Herrschaftsbereich, nicht nur den sichtbaren Luftraum.
- source_word: θρόνος
  choice: mein Thron
  rationale: Die durchsichtige Metapher königlicher Herrschaft wird unmittelbar bewahrt.
- source_word: γῆ
  choice: die Erde
  rationale: Im Gegensatz zum Himmel ist die gesamte Erde gemeint, nicht ein bestimmtes Land.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: der Schemel meiner Füße
  rationale: Diese formnahe und im Deutschen verständliche Wendung bewahrt sowohl das Bild als auch den ausdrücklichen Bezug auf die Füße.
- source_word: ποῖον οἶκον
  choice: Was für ein Haus
  rationale: ποῖον fragt nach Art oder Beschaffenheit. „Haus“ gibt οἶκον wieder, ohne die im Zusammenhang erkennbare Tempelbedeutung ausdrücklich einzutragen.
- source_word: οἰκοδομήσετέ
  choice: werdet ihr mir bauen
  rationale: Das Futur in der rhetorischen Frage wird direkt und natürlich wiedergegeben.
- source_word: λέγει κύριος
  choice: spricht der Herr
  rationale: „Spricht der Herr“ ist eine im Deutschen würdige und natürliche Redeeinleitung; „Herr“ entspricht dem griechischen κύριος.
- source_word: τίς τόπος τῆς καταπαύσεώς μου
  choice: wo ist der Ort meiner Ruhe
  rationale: Die idiomatische Frage mit „wo“ wahrt den Begriff „Ort“ und die theologisch offene Rede von Gottes Ruhe, ohne sie erklärend auf einen Tempel zu verengen.
theological_decisions:
- issue: Wiedergabe von κύριος im Jesajazitat, dessen Sprecher der Gott Israels ist
  choice: der Herr
  alternative: der HERR
  rationale: Der neutestamentliche griechische Text hat κύριος. „Der Herr“ gibt diesen Wortlaut wieder, ohne die alttestamentliche Gottesnamenschreibung in den griechischen Ausgangstext einzutragen.
- issue: Bezug des Hauses und des Ortes der Ruhe
  choice: Haus; Ort meiner Ruhe
  alternative: Tempel; meine Ruhestätte
  rationale: Die Übersetzung bewahrt die Bildsprache und Spannung des Zitats. Der Tempelbezug ergibt sich aus dem Kontext, soll aber nicht durch eine auslegende Ersetzung ausdrücklich gemacht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die poetisch-rhetorische Gestalt des griechischen Zitats. Der Kontrast wird durch „aber“ markiert; die beiden rhetorischen Fragen bleiben als direkte Gottesrede erhalten.
