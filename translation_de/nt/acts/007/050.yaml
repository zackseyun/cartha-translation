lexical_decisions:
- source_word: οὐχὶ
  choice: Hat nicht
  rationale: οὐχί leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. „Hat nicht“ bewahrt diese Kraft in natürlichem, würdigem Deutsch.
- source_word: ἡ χείρ μου
  choice: meine Hand
  rationale: χείρ bedeutet wörtlich „Hand“. Die konkrete, anthropomorphe Bildsprache des Zitats aus Jesaja 66,2 bleibt erhalten, statt sie als „meine Macht“ oder schlicht „ich“ aufzulösen.
- source_word: ἐποίησεν
  choice: gemacht
  rationale: ποιέω bezeichnet hier Gottes hervorbringendes beziehungsweise schöpferisches Handeln. „gemacht“ ist im Kontext klar und entspricht dem schlichten Wortlaut des Zitats.
- source_word: ταῦτα πάντα
  choice: dies alles
  rationale: „dies alles“ gibt sowohl die hinweisende Bedeutung von ταῦτα als auch den umfassenden Sinn von πάντα idiomatisch wieder.
theological_decisions:
- issue: Anthropomorphe Rede von Gott
  choice: „meine Hand“ als bildhafte Bezeichnung für Gottes eigenes schöpferisches Handeln beibehalten
  alternative: Dynamisch „Habe nicht ich dies alles gemacht?“ oder interpretierend „Hat nicht meine Macht dies alles gemacht?“
  rationale: Die konkrete Form bewahrt die Bildsprache und den rhetorischen Nachdruck des Zitats aus Jesaja 66,2, ohne sie durch eine abstrakte theologische Deutung zu ersetzen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die rhetorische Frage und die konkrete biblische Bildsprache bleiben erhalten.
