  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: de
  text: In jenen Tagen machten sie ein Kalb und brachten dem Götzen ein Opfer dar. Sie freuten sich über die Werke ihrer Hände.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie freuten sich über das, was ihre Hände gemacht hatten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: machten sie ein Kalb
  rationale: Das Verb bezeichnet das Anfertigen eines Kalbes. Die knappe Formulierung ist natürlich und benötigt keinen Zusatz wie „Götzenbild“, da der folgende Ausdruck den religiösen Charakter ausdrücklich benennt.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: In jenen Tagen
  rationale: Die geläufige Zeitangabe bewahrt Struktur und rückverweisenden Charakter des griechischen Ausdrucks.
- source_word: ἀνήγαγον θυσίαν
  choice: brachten … ein Opfer dar
  rationale: „Ein Opfer darbringen“ gibt die kultische Bedeutung idiomatisch und würdig wieder.
- source_word: τῷ εἰδώλῳ
  choice: dem Götzen
  rationale: Der bestimmte Artikel verweist auf das zuvor genannte Kalb; „Götze“ bewahrt die abwertende, götzendienstkritische Kraft von εἴδωλον.
- source_word: εὐφραίνοντο
  choice: Sie freuten sich
  rationale: Das Präteritum ist im deutschen Erzählstil natürlich. Der Kontext beschreibt ihre Freude beziehungsweise ihr Feiern angesichts des selbst angefertigten Kultbildes.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: über das Werk ihrer Hände
  rationale: Die Formulierung erhält das biblisch geprägte Bild vom „Werk ihrer Hände“, während „über“ die gemeinte Ursache beziehungsweise den Gegenstand ihrer Freude im Deutschen verständlich ausdrückt.
theological_decisions:
- issue: Sprache des Götzendienstes und rhetorische Schärfe
  choice: „Götze“ und „Werk ihrer Hände“
  alternative: „Bild“ und „das, was sie mit ihren Händen gemacht hatten“
  rationale: Stephanus greift die biblische Kritik am Götzendienst auf. „Götze“ bewahrt die wertende Kraft, und „Werk ihrer Hände“ erhält die traditionsreiche polemische Bildsprache, ohne zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wendung „Werk ihrer Hände“ ist bewusst etwas bibelsprachlich gehalten, um den alttestamentlich-prophetischen Widerhall der Götzenkritik zu bewahren.
