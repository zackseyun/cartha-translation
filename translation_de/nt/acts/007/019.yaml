  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: de
  text: Dieser Mann ging mit unserem Volk hinterlistig um[a] und misshandelte unsere Vorfahren, indem er sie dazu brachte, ihre Säuglinge auszusetzen[b], damit diese nicht am Leben erhalten würden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ging arglistig gegen unser Volk vor“. Das griechische Wort bezeichnet ein berechnendes, hinterhältiges Vorgehen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist, Säuglinge preiszugeben beziehungsweise im Freien zurückzulassen, um sie nicht am Leben zu erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Dieser Mann
  rationale: Der Rückverweis gilt dem zuvor genannten König; die Wiedergabe bewahrt die demonstrative Kraft und klingt im Deutschen natürlich.
- source_word: κατασοφισάμενος
  choice: ging … hinterlistig um
  rationale: Das Partizip bezeichnet ein klug berechnendes, hier eindeutig arglistiges Vorgehen gegen das Volk. „Hinterlistig“ macht den negativen Sinn verständlich, ohne eine bestimmte Maßnahme hinzuzufügen.
- source_word: τὸ γένος ἡμῶν
  choice: unserem Volk
  rationale: γένος bezeichnet hier das ethnisch-historische Volk Israel; „Volk“ ist im modernen Deutsch angemessener als „Geschlecht“ oder „Rasse“.
- source_word: ἐκάκωσεν
  choice: misshandelte
  rationale: Das Verb bezeichnet schädigende, üble Behandlung. „Misshandelte“ gibt die Schwere des Vorgehens wieder, ohne es allein auf politische Unterdrückung einzuengen.
- source_word: τοὺς πατέρας
  choice: unsere Vorfahren
  rationale: Obwohl der griechische Text wörtlich „die Väter“ hat, ist der Bezug auf die früheren Generationen Israels im Deutschen mit „unsere Vorfahren“ klar und inklusiv wiedergegeben; das possessive Verhältnis ergibt sich aus dem Kontext und entspricht dem Sinn.
- source_word: τοῦ ποιεῖν … ἔκθετα
  choice: indem er sie dazu brachte, … auszusetzen
  rationale: Die Konstruktion kann Mittel beziehungsweise Folge der Misshandlung ausdrücken. Diese Formulierung wahrt die Verursachung, ohne die im Griechischen nicht ausdrücklich ausgesagte stärkere Nuance „zwingen“ einzutragen.
- source_word: τὰ βρέφη αὐτῶν
  choice: ihre Säuglinge
  rationale: βρέφη meint sehr junge Kinder beziehungsweise Babys; „Säuglinge“ ist präzise und würdevoll.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: damit sie nicht am Leben blieben
  rationale: Die Wendung drückt Zweck oder beabsichtigte Folge aus. Die Übersetzung gibt den Sinn des passiven „nicht lebend erhalten werden“ natürlich wieder und lässt die Zweck-Folge-Nuance im Kontext bestehen.
theological_decisions:
- issue: Bezug von αὐτῶν und Subjekt des Aussetzens
  choice: „ihre Säuglinge“ bezieht sich auf die Vorfahren; sie setzen die Kinder infolge des königlichen Vorgehens aus.
  alternative: Der König beziehungsweise seine Beauftragten lassen die Säuglinge aussetzen.
  rationale: Grammatisch bezieht sich αὐτῶν am naheliegendsten auf τοὺς πατέρας, und ποιεῖν mit prädikativem ἔκθετα beschreibt, dass er sie dazu brachte, ihre Kinder ausgesetzt sein zu lassen beziehungsweise auszusetzen. Die deutsche Fassung vermeidet dennoch eine überstarke Aussage über den genauen Grad des Zwangs.
- issue: Zweck oder Ergebnis bei εἰς τὸ μή
  choice: „damit“ als beabsichtigter Zweck
  alternative: „sodass“ als tatsächliches Ergebnis
  rationale: Die Konstruktion kann Zweck und Ergebnis berühren. Im Zusammenhang mit der gegen die Säuglinge gerichteten Politik steht die Absicht im Vordergrund; die Formulierung behauptet nicht, dass ausnahmslos jedes Kind starb.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Abfolge, wird aber für heutige Leser geglättet. „Vorfahren“ vermeidet das im Deutschen potenziell missverständliche generische „Väter“. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar bei der erklärungsbedürftigen Wendung.
