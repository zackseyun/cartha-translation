  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: de
  text: 'Dann kniete er nieder und rief mit lauter Stimme: »Herr, rechne ihnen diese Sünde nicht an!«[a] Nachdem er das gesagt hatte, schlief er ein.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Laste ihnen diese Sünde nicht an« beziehungsweise »Halte ihnen diese Sünde nicht vor«.'
    reason: lexical_alternative
  - marker: b
    text: Eine geläufige bildhafte Ausdrucksweise für das Sterben.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Dann kniete er nieder
  rationale: Die griechische Wendung bedeutet wörtlich, dass er die Knie aufsetzte, und bezeichnet das Niederknien. Die gewählte Formulierung gibt die körperliche Handlung in natürlichem Deutsch wieder; δέ markiert hier den Fortgang der Erzählung.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: und rief mit lauter Stimme
  rationale: κράζω bezeichnet einen lauten Ruf oder Schrei. Die ausdrückliche Wiedergabe von φωνῇ μεγάλῃ als »mit lauter Stimme« bewahrt die Betonung des griechischen Textes.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ ist im Zusammenhang an Jesus gerichtet. »Herr« bewahrt sowohl die ehrfürchtige Anrede als auch den etablierten neutestamentlichen Titelgebrauch.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: rechne ihnen diese Sünde nicht an
  rationale: ἵστημι hat hier den Sinn, etwas jemandem zur Last beziehungsweise auf sein Konto zu setzen. »Anrechnen« bewahrt diesen forensischen Sinn; »diese« gibt ταύτην ausdrücklich wieder.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Nachdem er das gesagt hatte
  rationale: Die partizipiale Konstruktion wird als natürlicher deutscher Temporalsatz wiedergegeben und hält die zeitliche Folge fest.
- source_word: ἐκοιμήθη
  choice: entschlief er
  rationale: κοιμάομαι ist hier eine geläufige bildhafte Bezeichnung für das Sterben. »Entschlief« bewahrt das Schlafbild und bleibt zugleich würdevoll und verständlich.
theological_decisions:
- issue: Wiedergabe des Todesbildes ἐκοιμήθη
  choice: entschlief er
  alternative: starb er
  rationale: Der griechische Text bezeichnet den Tod des Stephanus mit einem Schlafbild. Dieses wird bewahrt, ohne daraus über den Wortlaut hinaus eine bestimmte Lehre abzuleiten.
- issue: Anrede Κύριε im Gebet des Stephanus
  choice: Herr
  alternative: Gebieter
  rationale: Nach dem unmittelbaren Kontext richtet Stephanus seine Worte an Jesus. »Herr« erhält den christologischen Titel, ohne zusätzliche Deutung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge ist flüssig, die ausdrückliche Lautstärke des Rufes und das griechische Schlafbild bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Formulierungen.
