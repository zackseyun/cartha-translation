  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: das Niederknien, den lauten Ruf, die Anrede »Herr«, die Bitte, diese konkrete Sünde nicht anzurechnen, sowie die anschließende Todesmetapher. »Rechne ihnen diese Sünde nicht an« trifft den hier gemeinten forensischen Sinn von μὴ στήσῃς ... τὴν ἁμαρτίαν sehr gut.'
  naturalness: Der Satzbau ist klar und idiomatisch. »Entschlief« bewahrt zwar das Bild, wirkt im modernen Standarddeutsch jedoch deutlich gehoben und bibelsprachlich. »Schlief ein« ist gegenwärtiger und erhält dieselbe Metapher.
  terminology: »Herr« ist für Κύριε im Kontext angemessen. »Diese Sünde« bewahrt die demonstrative Bestimmung ταύτην. Die Fußnotenalternative zu »anrechnen« ist sachlich möglich; die Erläuterung zum Schlafbild sollte nicht mehr als wörtliche Alternative formuliert werden, wenn der Text selbst bereits »schlief ein« lautet.
