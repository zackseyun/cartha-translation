  to: 'Dann kniete er nieder und rief mit lauter Stimme: »Herr, rechne ihnen diese Sünde nicht an!«[a] Nachdem er das gesagt hatte, schlief er ein.[b]'
  rationale: Die einzige Änderung ersetzt das gehobene »entschlief« durch das im modernen Standarddeutsch natürlichere »schlief ein«. Dadurch bleiben sowohl die Metapher des griechischen ἐκοιμήθη als auch die zeitliche Abfolge erhalten. Die Fußnote b wurde entsprechend angepasst, damit sie nicht etwas als wörtliche Wiedergabe ausweist, das bereits im Haupttext steht.
