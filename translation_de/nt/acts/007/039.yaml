id: ACT.7.39
reference: Acts 7:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: de
  text: Unsere Vorfahren wollten ihm nicht gehorsam werden, sondern wiesen ihn zurück und wandten sich in ihren Herzen wieder Ägypten zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Obwohl sie noch in der Wüste waren, sehnten sie sich innerlich wieder nach Ägypten.'
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: ihm
  rationale: Das Dativpronomen bezieht sich auf Mose im vorherigen Vers und gehört sinngemäß zu »gehorsam werden«.
- source_word: οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι
  choice: wollten ihm nicht gehorsam werden
  rationale: Die Formulierung bewahrt sowohl den Willensaspekt von θέλω als auch das Werden aus γενέσθαι und klingt im heutigen Deutsch natürlich.
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Vorfahren
  rationale: Gemeint sind Israels frühere Generationen. »Vorfahren« ist in modernem Standarddeutsch klar und vermeidet, dass »Väter« nur als unmittelbare Eltern verstanden wird.
- source_word: ἀπώσαντο
  choice: wiesen ihn zurück
  rationale: Das Verb bezeichnet ein Wegstoßen beziehungsweise eine entschiedene Zurückweisung; die deutsche Wendung erhält beide Bedeutungsanteile.
- source_word: ἐστράφησαν ... εἰς Αἴγυπτον
  choice: wandten sich ... wieder Ägypten zu
  rationale: Die Formulierung drückt eine erneute Ausrichtung auf Ägypten aus, ohne eine tatsächlich vollzogene geografische Rückkehr zu behaupten.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: in ihren Herzen
  rationale: Die biblische Wendung bezeichnet ihr inneres Wollen und Verlangen und bewahrt das Bild des griechischen Textes.
theological_decisions:
- issue: Art der Hinwendung zu Ägypten
  choice: »wandten sich in ihren Herzen wieder Ägypten zu«
  alternative: »kehrten in ihren Herzen nach Ägypten zurück«
  rationale: Der ausdrückliche Hinweis auf ihre Herzen kennzeichnet eine innere Neuausrichtung. Die gewählte Fassung wahrt die Spannung zwischen ihrem äußeren Aufenthalt in der Wüste und ihrem inneren Verlangen nach Ägypten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt nahe an der griechischen Struktur, verwendet aber mit »Vorfahren« und »wiesen ihn zurück« allgemein verständliche heutige Sprache.
