id: ACT.7.30
reference: Acts 7:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: de
  text: Als vierzig Jahre vergangen waren[a], erschien ihm in der Wüste am Berg Sinai ein Engel[c] in einer Feuerflamme aus einem Dornbusch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als vierzig Jahre vollendet waren.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in einer Feuerflamme eines Dornbuschs“; die Flamme war also mit einem Dornbusch verbunden. Vgl. 2. Mose 3,2.'
    reason: cross_reference
  - marker: c
    text: Manche beziehen dies auf den „Engel des HERRN“ in 2. Mose 3,2; hier steht jedoch lediglich „ein Engel“.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: Als vierzig Jahre vergangen waren
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand. Die idiomatische Formulierung gibt den Abschluss der vierzig Jahre natürlich wieder; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: ὤφθη αὐτῷ
  choice: erschien ihm
  rationale: Die Passivform von ὁράω wird bei Erscheinungen gewöhnlich intransitiv gebraucht; „erschien ihm“ ist im Deutschen natürlicher als „wurde von ihm gesehen“.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: in der Wüste am Berg Sinai
  rationale: „Wüste“ ist eine natürliche deutsche Entsprechung für ἔρημος. Der Genitiv bezeichnet hier das zum Berg Sinai gehörende Wüstengebiet; „am Berg Sinai“ vermeidet die missverständliche Vorstellung einer Wüste auf dem Berg.
- source_word: ἄγγελος
  choice: ein Engel
  rationale: Im Zusammenhang ist ein himmlischer Bote gemeint. Der unbestimmte Ausdruck des griechischen Textes wird beibehalten, ohne aus Exodus eine nähere Identifikation einzutragen.
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: in einer Feuerflamme aus einem Dornbusch
  rationale: Die Formulierung wahrt das anschauliche Doppelbild von Flamme und Feuer. „Aus einem Dornbusch“ gibt die gedrängte Genitivverbindung verständlich wieder; ihre wörtliche Struktur wird in der Fußnote erläutert.
theological_decisions:
- issue: Identität der erscheinenden Gestalt (ἄγγελος) im Kontext einer Gotteserscheinung
  choice: ein Engel
  alternative: der Engel des Herrn
  rationale: Apostelgeschichte 7,30 sagt lediglich ἄγγελος und enthält weder Artikel noch die Ergänzung „des Herrn“. Eine genauere theologische Identifikation wird deshalb nicht in den Haupttext eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig, während die Bildsprache und die unbestimmte Bezeichnung des Engels erhalten bleiben.
