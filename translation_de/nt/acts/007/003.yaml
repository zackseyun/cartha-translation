id: ACT.7.3
reference: Acts 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: de
  text: 'Und er sagte zu ihm: »Verlass dein Land und deine Verwandtschaft[a] und komm in das Land, das ich dir zeigen werde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Verwandten« beziehungsweise »deine Familie«. Das griechische Wort bezeichnet die durch Abstammung verbundene Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: er sagte zu ihm
  rationale: Die griechische Erzählformel und das Pronomen werden direkt wiedergegeben; der Bezug auf Abraham ergibt sich aus dem Zusammenhang.
- source_word: Ἔξελθε
  choice: Verlass
  rationale: Der Aoristimperativ fordert zum Aufbruch aus dem bisherigen Lebensraum auf. »Verlass« ist im Deutschen natürlicher als das wörtlichere »Geh hinaus aus« und bewahrt den Sinn der Bewegung weg von etwas.
- source_word: ἐκ τῆς γῆς σου
  choice: dein Land
  rationale: γῆ bezeichnet hier das eigene Gebiet beziehungsweise Herkunftsland; »Land« vermeidet moderne nationalstaatliche Nebenbedeutungen.
- source_word: συγγενείας
  choice: Verwandtschaft
  rationale: Das Wort bezeichnet kollektiv die durch Abstammung verbundene Gruppe. »Verwandtschaft« bewahrt diesen weiteren Sinn; mögliche Alternativen werden in der Fußnote genannt.
- source_word: δεῦρο
  choice: komm
  rationale: Das deiktische Adverb wird hier imperativisch gebraucht. »Komm« erhält diese Perspektive, statt sie mit »geh« einzuebnen.
- source_word: εἰς τὴν γῆν
  choice: in das Land
  rationale: εἰς bezeichnet eine Bewegung hinein; »in das Land« bildet diese Richtung natürlich ab.
- source_word: ἣν ἄν σοι δείξω
  choice: das ich dir zeigen werde
  rationale: Die Verbindung von ἄν mit dem Aoristkonjunktiv ist hier zukunftsbezogen. Das deutsche Futur gibt dies idiomatisch wieder, ohne eine sachlich unpassende Unsicherheit auszudrücken.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und befehlend; »komm« bewahrt die deiktische Spannung des griechischen δεῦρο.
