review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den zeitlich vorangehenden Genitivus absolutus ἐκτεθέντος, die Aufnahmehandlung ἀνείλατο und das Großziehen ἀνεθρέψατο zutreffend wieder. Die Formulierung „als ihren Sohn“ gibt das Zusammenspiel von ἑαυτῇ und εἰς υἱόν idiomatisch wieder, ohne die rechtliche Kategorie einer Adoption zu behaupten.
  naturalness: „Für sich als Sohn großziehen“ ist im modernen Standarddeutsch deutlich sperrig. „Als ihren Sohn großziehen“ ist natürlich, würdig und in diesem Kontext eindeutig.
  terminology: „Ausgesetzt“, „die Tochter des Pharaos“, „aufnehmen“ und „großziehen“ sind sachgerecht. „Sohn“ bewahrt die geschlechtsspezifische Form des griechischen υἱόν.
  issues:
  - severity: medium
    issue: Die Wendung „zog ihn für sich als Sohn groß“ ist unidiomatisch.
    rationale: Sie bildet den reflexiven Dativ zu mechanisch nach. Die natürliche deutsche Entsprechung „zog ihn als ihren Sohn groß“ drückt dieselbe personale Zuordnung und den Status als Sohn aus.
  - severity: low
    issue: Die Fußnote b bezeichnet „zog ihn für sich zu einem Sohn groß“ als wörtliche Wiedergabe.
    rationale: Als Erklärung der griechischen Wortfolge ist dies möglich, aber als deutsches Zitat unnötig holprig. Die Anmerkung sollte die wörtliche Präpositionalphrase knapp erklären und die idiomatische Hauptübersetzung stützen.
  revised_text: Als er aber ausgesetzt worden war, nahm ihn die Tochter des Pharaos auf[a] und zog ihn als ihren Sohn groß.[b]
