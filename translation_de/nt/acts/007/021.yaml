revisions:
- from: Als er aber ausgesetzt worden war, nahm ihn die Tochter des Pharaos auf[a] und zog ihn für sich als Sohn groß.[b]
  to: Als er aber ausgesetzt worden war, nahm ihn die Tochter des Pharaos auf[a] und zog ihn als ihren Sohn groß.[b]
  rationale: Die Revision ersetzt allein die unnatürliche, jedoch quellengetreu gemeinte Wendung „für sich als Sohn“ durch das idiomatische „als ihren Sohn“. Damit bleiben der reflexive Bezug auf die Tochter des Pharaos und die mit εἰς υἱόν bezeichnete Stellung erhalten; eine rechtliche Adoption wird weiterhin nicht hineingelesen. Die Fußnote b wird entsprechend präzisiert.
