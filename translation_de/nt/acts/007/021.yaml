source:
  edition: SBLGNT
  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: de
  text: Als er aber ausgesetzt worden war, nahm ihn die Tochter des Pharaos auf[a] und zog ihn als ihren Sohn groß.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahm ihn zu sich“. Das griechische Verb kann die Aufnahme eines ausgesetzten Kindes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für sich zu einem Sohn“; auch: „als ihren Sohn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: ausgesetzt worden war
  rationale: Das passive Partizip bezeichnet hier das Aussetzen eines Säuglings. „Ausgesetzt“ bewahrt den geschichtlich-kulturellen Sinn, ohne mit „verlassen“ ein Motiv stärker festzulegen.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert den erzählerischen Übergang und zugleich den Gegensatz zwischen dem Aussetzen des Kindes und seiner Aufnahme.
- source_word: ἀνείλατο
  choice: nahm ihn auf
  rationale: Das Medium von ἀναιρέω bezeichnet hier die Aufnahme eines ausgesetzten Kindes. „Nahm ihn auf“ unterscheidet diese Handlung von der anschließend genannten Erziehung zum Sohn.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: die Tochter des Pharaos
  rationale: Die übliche deutsche Genitivkonstruktion gibt die Beziehung natürlich und genau wieder.
- source_word: ἀνεθρέψατο
  choice: zog ihn … groß
  rationale: ἀνατρέφω bezeichnet das Aufziehen beziehungsweise Großziehen eines Kindes; die Formulierung ist modernes, gut verständliches Deutsch.
- source_word: ἑαυτῇ
  choice: für sich
  rationale: Der reflexive Dativ wird ausdrücklich bewahrt und auf die Tochter des Pharaos bezogen.
- source_word: εἰς υἱόν
  choice: als Sohn
  rationale: Die Wendung bezeichnet die Rolle beziehungsweise den Status, in dem Mose aufgezogen wurde; „als Sohn“ lässt offen, wie genau dieses Verhältnis rechtlich einzuordnen ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Formulierung „für sich als Sohn“ bewahrt sowohl den reflexiven Dativ ἑαυτῇ als auch die Ergebnis- beziehungsweise Rollenangabe εἰς υἱόν, ohne vorschnell den rechtlichen Begriff „adoptieren“ einzuführen.
