  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: de
  text: Und er gab ihm darin kein Erbteil, nicht einmal einen Fußbreit Boden[a]. Doch er versprach, es ihm zum Besitz zu geben und nach ihm auch seinen Nachkommen[b], obwohl er kein Kind hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „nicht einmal den Tritt eines Fußes“. Die griechische Wendung bezeichnet den kleinstmöglichen Anteil an Land.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als er kein Kind hatte“. Die griechische Konstruktion kann temporal verstanden werden; der Zusammenhang legt jedoch den Gegensatz nahe: „obwohl er kein Kind hatte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: Erbteil
  rationale: „Erbteil“ bewahrt den rechtlichen und bundestheologischen Sinn eines zugewiesenen Anteils am Land besser als das allgemeinere „Besitz“.
- source_word: οὐδὲ βῆμα ποδός
  choice: nicht einmal einen Fußbreit Boden
  rationale: Die griechische Wendung bezeichnet bildhaft den kleinstmöglichen Landanteil. Die deutsche idiomatische Wiedergabe ist klar und erhält den Bezug auf Grund und Boden.
- source_word: ἐπηγγείλατο
  choice: er versprach
  rationale: Diese natürliche Wiedergabe gibt die verbindliche Zusage ohne unnötige Erweiterung wieder.
- source_word: εἰς κατάσχεσιν
  choice: zum Besitz
  rationale: Die Formulierung bringt die auf dauerhafte Inbesitznahme gerichtete Bedeutung prägnant zum Ausdruck.
- source_word: σπέρματι
  choice: Nachkommen
  rationale: Das griechische Wort steht im Singular, hat hier aber kollektiven Sinn. „Nachkommen“ ist im heutigen Deutsch natürlich und für die abrahamitische Verheißung sachgerecht.
- source_word: μετ’ αὐτόν
  choice: nach ihm
  rationale: Die direkte Wiedergabe bezeichnet die zeitliche beziehungsweise generationelle Nachfolge Abrahams.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: obwohl er noch kein Kind hatte
  rationale: Der Genitivus absolutus nennt den Begleitumstand. „Obwohl“ gibt die im Kontext hervortretende Spannung zwischen Kinderlosigkeit und Verheißung wieder; „noch“ verdeutlicht den damaligen Zustand, ohne zu behaupten, das Partizip selbst trage diese Bedeutung.
- source_word: τέκνου
  choice: Kind
  rationale: τέκνον ist weiter als „Sohn“ und bezeichnet hier, dass Abraham zu diesem Zeitpunkt kinderlos war.
theological_decisions:
- issue: Konzessive oder temporale Deutung der Kinderlosigkeit Abrahams
  choice: obwohl er noch kein Kind hatte
  alternative: als er noch kein Kind hatte
  rationale: 'Die Konstruktion kann rein temporal verstanden werden. Im Zusammenhang hebt sie jedoch besonders den Gegensatz hervor: Gott gab die Verheißung trotz Abrahams damaliger Kinderlosigkeit. Die Fußnote bewahrt die grammatische Alternative.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Abfolge, wird aber durch die Satzgrenze nach der Landverweigerung lesbarer. „Erbteil“, „Verheißung“ im Bedeutungsfeld von „versprechen“ und „Nachkommen“ bewahren den biblisch-rechtlichen Ton, ohne altertümlich zu wirken.
