id: ACT.7.58
reference: Acts 7:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: de
  text: Und nachdem sie ihn aus der Stadt hinausgetrieben hatten, steinigten sie ihn. Die Zeugen legten ihre Obergewänder[a] zu Füßen eines jungen Mannes ab, der Saulus hieß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Kleider« oder »Mäntel«; das griechische Wort bezeichnet allgemein äußere Kleidung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: nachdem sie ihn … hinausgetrieben hatten
  rationale: Der vorzeitige Aoristpartizip wird als vorausgehende, gewaltsame Handlung wiedergegeben. »Hinausgetrieben« ist natürliches Deutsch und bewahrt die Bewegungsrichtung.
- source_word: ἔξω τῆς πόλεως
  choice: aus der Stadt hinaus
  rationale: Die Formulierung bezeichnet die Bewegung vom Inneren der Stadt nach draußen und verbindet sich im Deutschen idiomatisch mit »hinausgetrieben«.
- source_word: ἐλιθοβόλουν
  choice: steinigten sie ihn
  rationale: Das Imperfekt stellt die Steinigung als im Verlauf befindliche Handlung dar. Im Deutschen trägt das Präteritum diese Erzählfunktion natürlich; eine Umschreibung wie »waren dabei, ihn zu steinigen« wäre unnötig schwerfällig.
- source_word: οἱ μάρτυρες
  choice: die Zeugen
  rationale: Im Hinrichtungskontext sind die rechtlichen Zeugen gemeint, nicht »Märtyrer« im späteren kirchlichen Sinn.
- source_word: ἀπέθεντο
  choice: legten … ab
  rationale: Das Medium bezeichnet hier das Ablegen beziehungsweise Deponieren der Kleidung. Die trennbare Verbform »legten … ab« ist präzise und idiomatisch.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: ihre Obergewänder
  rationale: ἱμάτια bezeichnet häufig die äußere Kleidung. »Obergewänder« ist genauer als das allgemeinere »Kleider«, ohne den Begriff auf einen bestimmten Manteltyp einzuengen.
- source_word: παρὰ τοὺς πόδας
  choice: zu Füßen
  rationale: Dies ist die übliche deutsche Wendung für das Niederlegen von etwas bei den Füßen einer Person beziehungsweise in deren Obhut.
- source_word: νεανίου
  choice: eines jungen Mannes
  rationale: νεανίας bezeichnet einen relativ jungen männlichen Erwachsenen; »junger Mann« ist im modernen Deutsch natürlich und altersmäßig nicht unnötig eng.
- source_word: καλουμένου Σαύλου
  choice: der Saulus hieß
  rationale: Die Relativsatzkonstruktion gibt das Partizip καλουμένου verständlich und natürlich wieder. »Saulus« entspricht der etablierten deutschen Namensform für Σαῦλος.
theological_decisions:
- issue: Bedeutung von μάρτυρες im Hinrichtungskontext
  choice: »Zeugen« im rechtlichen Sinn
  alternative: »Märtyrer«
  rationale: Der unmittelbare Zusammenhang bezeichnet diejenigen, die im Gerichtsverfahren Zeugnis abgelegt haben und bei der Steinigung beteiligt sind. Die spätere kirchliche Bedeutung »Märtyrer« wäre hier anachronistisch.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die griechische Satzfolge und die zeitliche Abfolge bleiben erhalten; die im Deutschen unnötige Wiederholung von »und« am Beginn des zweiten Satzes wurde nicht nachgeahmt. Der Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Anmerkung tatsächlich bezieht.
