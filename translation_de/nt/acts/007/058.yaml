  source_fidelity: 'Der Entwurf gibt die zeitliche Abfolge von ἐκβαλόντες und ἐλιθοβόλουν zuverlässig wieder: Zuerst wird Stephanus gewaltsam aus der Stadt hinausgetrieben, anschließend wird er gesteinigt. »Zeugen« trifft οἱ μάρτυρες im juristischen Kontext. Das Ablegen der Obergewänder bei den Füßen des jungen Mannes namens Saulus ist vollständig und korrekt wiedergegeben.'
  naturalness: Das Deutsch ist modernes, klares Standarddeutsch. »Nachdem sie ihn aus der Stadt hinausgetrieben hatten« ist idiomatisch; »zu Füßen eines jungen Mannes« ist eine etablierte natürliche Wendung für παρὰ τοὺς πόδας.
  terminology: »Obergewänder« ist für ἱμάτια sachgerecht und wird durch die Fußnote angemessen als nicht exklusiv erläutert. »Saulus« ist die etablierte deutsche Namensform. Die Unterscheidung von rechtlichen »Zeugen« gegenüber dem späteren Sinn von »Märtyrer« ist korrekt.
