source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: de
  text: 'Gott aber sprach folgendermaßen: »sein Nachwuchs wird als Fremder in einem Land leben, das ihm nicht gehört[a], und man wird ihn versklaven und vierhundert Jahre lang misshandeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder natürlicher im Plural: „Seine Nachkommen werden als Fremde in einem Land leben, das ihnen nicht gehört, und man wird sie vierhundert Jahre lang versklaven und misshandeln.“ Im Griechischen steht kollektiv die Einzahl: „Nachwuchs … ihn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεός
  choice: Gott aber sprach folgendermaßen
  rationale: „Aber“ gibt die fortführende Nuance von δέ wieder; „sprach folgendermaßen“ bewahrt οὕτως ausdrücklich und leitet Gottes Aussage in natürlichem Deutsch ein.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: sein Nachwuchs
  rationale: σπέρμα bezeichnet hier kollektiv Abrahams Nachkommenschaft. „Nachwuchs“ ermöglicht im Deutschen eine verständliche kollektive Einzahl und wahrt so die grammatische Form des griechischen Textes besser als der Plural „Nachkommen“.
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: als Fremder in einem Land leben, das ihm nicht gehört
  rationale: πάροικος bezeichnet einen ortsfremden Bewohner ohne Heimatrecht; ἀλλοτρία ist ein Land, das einem anderen gehört. Die Formulierung macht beide Aspekte in heutigem Deutsch deutlich, ohne einen bloßen Kurzaufenthalt vorauszusetzen.
- source_word: δουλώσουσιν αὐτό
  choice: man wird ihn versklaven
  rationale: δουλόω wird präzise mit „versklaven“ wiedergegeben. Das unbestimmte „man“ entspricht dem im Zusammenhang nicht ausdrücklich benannten pluralischen Täter; „ihn“ bewahrt den Rückbezug auf das kollektive Singularwort.
- source_word: κακώσουσιν
  choice: misshandeln
  rationale: Das Verb bezeichnet hier das Zufügen von Leid beziehungsweise schlechte Behandlung; „misshandeln“ ist klar, gegenwärtig und hinreichend weit.
- source_word: ἔτη τετρακόσια
  choice: vierhundert Jahre lang
  rationale: „Jahre lang“ gibt den griechischen Akkusativ der zeitlichen Ausdehnung idiomatisch wieder.
theological_decisions:
- issue: Kollektiver Singular für Abrahams Nachkommenschaft
  choice: Der Haupttext wahrt mit „sein Nachwuchs … ihn“ die kollektive Einzahl.
  alternative: „Seine Nachkommen werden als Fremde … man wird sie versklaven und misshandeln.“
  rationale: Der griechische Text verwendet σπέρμα und das darauf bezogene αὐτό im Singular. Diese auffällige Form wird nicht stillschweigend pluralisiert; die Fußnote bietet zugleich die im Deutschen gewöhnlichere pluralische Wiedergabe.
- issue: Identität der versklavenden und misshandelnden Personen
  choice: Unbestimmtes „man“ ohne nähere Identifizierung
  alternative: „Sie werden ihn versklaven und misshandeln.“
  rationale: Im griechischen Satz bleibt das Subjekt der Verben nur in der dritten Person Plural enthalten und wird nicht ausdrücklich benannt. „Man“ bewahrt diese Unbestimmtheit in natürlichem Deutsch, statt eine Personengruppe aus dem weiteren Zusammenhang in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Einzahl ist bewusst etwas markanter als die idiomatische Pluralfassung, bleibt aber verständlich. Die direkte Wiedergabe nach dem Doppelpunkt erhält den Zukunftsbezug der göttlichen Aussage.
