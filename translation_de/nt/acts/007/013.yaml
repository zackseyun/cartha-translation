  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: de
  text: Beim zweiten Mal gab sich Josef seinen Brüdern zu erkennen, und Josefs Familie wurde dem Pharao bekannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Josefs Verwandtschaft“ oder „Josefs Abstammung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: Beim zweiten Mal
  rationale: Die substantivierte Ordnungszahl bezeichnet idiomatisch die zweite Gelegenheit. Der Zusammenhang macht deutlich, dass der zweite Aufenthalt der Brüder in Ägypten gemeint ist; „Mal“ bewahrt die Kürze des Griechischen.
- source_word: ἀνεγνωρίσθη
  choice: gab sich … zu erkennen
  rationale: Die Form ist grammatisch passiv, doch im erzählerischen Hintergrund offenbart Josef seinen Brüdern seine Identität. Die reflexive deutsche Wendung gibt das Ereignis natürlich wieder; die formal passive Alternative wird in der Fußnote bewahrt.
- source_word: ἀδελφοῖς αὐτοῦ
  choice: seinen Brüdern
  rationale: Gemeint sind Josefs männliche Geschwister; „Brüder“ ist daher sachlich und sprachlich genau.
- source_word: φανερὸν ἐγένετο
  choice: wurde … bekannt
  rationale: Die Verbindung bezeichnet, dass etwas jemandem bekannt oder offenbar wird. „Wurde bekannt“ ist im Deutschen knapp und idiomatisch.
- source_word: γένος Ἰωσήφ
  choice: Josefs Herkunft
  rationale: γένος kann Familie, Verwandtschaft oder Abstammung bezeichnen. In Verbindung mit dem Bekanntwerden beim Pharao umfasst „Herkunft“ Josefs familiären Hintergrund, ohne moderne Vorstellungen von „Rasse“ einzutragen.
- source_word: τῷ Φαραώ
  choice: dem Pharao
  rationale: Der Dativ bezeichnet die Person, der Josefs Herkunft bekannt wurde.
