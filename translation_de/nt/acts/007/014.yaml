source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: de
  text: Da sandte Josef aus und ließ seinen Vater Jakob und alle seine Verwandten zu sich rufen, insgesamt fünfundsiebzig Personen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige alttestamentliche Stellen nennen als Gesamtzahl „siebzig“ (zum Beispiel der hebräische Text von 1. Mose 46,27 und 2. Mose 1,5); hier in der Apostelgeschichte steht „fünfundsiebzig“.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: ließ … rufen
  rationale: Das Aoristpartizip bezeichnet die vorausgehende Veranlassung. Zusammen mit μετεκαλέσατο lässt es sich im Deutschen natürlich als „ließ … zu sich rufen“ wiedergeben, ohne ein im Griechischen nicht genanntes Objekt des Sendens einzuführen.
- source_word: δὲ
  choice: Dann
  rationale: Kennzeichnet hier den Fortgang der Erzählung; „Dann“ ist im modernen Deutschen klar und flüssig.
- source_word: μετεκαλέσατο
  choice: zu sich rufen
  rationale: Das Medium bedeutet, jemanden zu sich kommen zu lassen beziehungsweise nach jemandem zu schicken. „Zu sich rufen“ gibt Ziel und Veranlassung natürlich wieder.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: seinen Vater Jakob
  rationale: Natürliche deutsche Wiedergabe der appositionellen Wortgruppe, bei der die Beziehung eindeutig erhalten bleibt.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: alle seine Verwandten
  rationale: συγγένεια bezeichnet die Verwandtschaft beziehungsweise den Kreis der Angehörigen. „Verwandte“ ist gegenwärtig, verständlich und weniger eng als „Familie“.
- source_word: ἐν ψυχαῖς
  choice: insgesamt … Personen
  rationale: Die wörtliche Wendung „an Seelen“ dient hier der Zählung von Menschen. „Insgesamt … Personen“ gibt diese idiomatische Funktion ohne sachfremde anthropologische Festlegung wieder.
- source_word: ἑβδομήκοντα πέντε
  choice: fünfundsiebzig
  rationale: Direkte Wiedergabe der im griechischen Text stehenden Zahl.
theological_decisions:
- issue: Zahl der Angehörigen Jakobs im Vergleich zu alttestamentlichen Textformen
  choice: fünfundsiebzig Personen
  alternative: siebzig Personen
  rationale: Apostelgeschichte 7,14 nennt ausdrücklich fünfundsiebzig. Die abweichende Zahl in manchen alttestamentlichen Textformen wird nicht harmonisiert, sondern in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktisch zusammengehörigen Verben ἀποστείλας und μετεκαλέσατο werden idiomatisch gebündelt; die Spannung zwischen den Zahlenangaben bleibt im Haupttext und in der Fußnote sichtbar.
