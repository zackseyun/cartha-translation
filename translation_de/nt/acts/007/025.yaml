    issue: »würden verstehen« gibt συνιέναι verschoben wieder.
    rationale: Die würde-Form legt eine bloß zukünftige Erwartung nahe. Im Griechischen ist das Verstehen der Inhalt dessen, was Mose von seinen Brüdern annahm; »verstünden« bewahrt dies.
  - severity: low
    issue: Die abhängige Aussage steht teils im Indikativ (»schenkte«).
    rationale: Der Indikativ ist nicht ungrammatisch, lässt Gottes Rettung aber stärker als Erzählerfeststellung erscheinen. Konjunktiv I hält die Aussage konsequent als von Mose angenommene Einsicht markiert.
  - severity: low
    issue: 'Genitiv in Fußnote a: »Moses israelitische«.'
    rationale: Im Deutschen lautet die reguläre Schreibung bei einem auf s auslautenden Namen »Moses' israelitische Volksgenossen«.
