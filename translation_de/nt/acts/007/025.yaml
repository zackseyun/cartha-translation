  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: de
  text: Er meinte, seine Brüder[a] verstünden, dass Gott ihnen durch seine Hand Rettung[b] schenke; doch sie verstanden es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Brüder« sind hier Moses' israelitische Volksgenossen gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Befreiung« beziehungsweise »Heil«. Das griechische Wort kann Rettung, Befreiung oder Heil bezeichnen; hier steht zunächst Gottes Rettung Israels durch Mose im Blick.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: Er meinte
  rationale: Das Imperfekt beschreibt Moses’ damalige, im Hintergrund stehende Annahme. Das idiomatische deutsche Präteritum gibt dies natürlich wieder.
- source_word: συνιέναι / συνῆκαν
  choice: würden verstehen / verstanden es nicht
  rationale: Die Wiederholung von »verstehen« bewahrt den deutlichen Gegensatz und das Wortspiel des griechischen Textes.
- source_word: ἀδελφοὺς
  choice: seine Brüder
  rationale: Die maskuline Pluralform bezeichnet hier Moses’ israelitische Volksgenossen in verwandtschaftlicher Sprache; eine Fußnote erläutert den Bezug.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: durch seine Hand
  rationale: Die Formulierung bewahrt das anschauliche griechische Bild für Vermittlung beziehungsweise Wirksamkeit durch Mose.
- source_word: δίδωσιν
  choice: schenkte
  rationale: Das historische Präsens innerhalb der abhängigen Aussage wird im Deutschen passend an den Vergangenheitsrahmen angeglichen. »Schenken« gibt δίδωμι in Verbindung mit Rettung würdig und natürlich wieder.
- source_word: σωτηρίαν
  choice: Rettung
  rationale: »Rettung« deckt sowohl die konkrete Befreiung Israels als auch die weiterreichende heilsgeschichtliche Bedeutung ab, ohne den Ausdruck auf eine rein geistliche Bedeutung zu verengen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Empfänger der von Gott gewährten Rettung.
theological_decisions:
- issue: Bedeutung von σωτηρία im Zusammenhang mit Mose
  choice: Rettung
  alternative: Befreiung; Heil
  rationale: Im unmittelbaren Zusammenhang geht es um Gottes konkrete Rettung Israels durch Mose. »Rettung« erhält zugleich die mögliche umfassendere Heilsbedeutung des griechischen Wortes und löst diese Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Quellenmetapher »durch seine Hand« bleibt erhalten; die zweimalige Verwendung von »verstehen« bildet den griechischen Kontrast nach. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
