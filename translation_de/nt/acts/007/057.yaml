review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die Handlungsfolge und alle wesentlichen Elemente des Griechischen zutreffend wieder: lautes Schreien, das Zuhalten der eigenen Ohren sowie das geschlossene, gegen Stephanus gerichtete Losstürmen. »Einmütig« bildet ὁμοθυμαδόν angemessen ab und bewahrt dessen Nuance gemeinsamen Handelns über bloße Gleichzeitigkeit hinaus.'
  naturalness: »Doch sie schrien laut, hielten sich die Ohren zu und stürmten einmütig auf ihn los« ist idiomatisches modernes Standarddeutsch und hat einen passenden erzählerischen Ton. Die Auflösung des griechischen Partizips in einen Hauptsatz ist natürlich und erhält die zeitlich eng verknüpfte Handlung.
  terminology: Es sind keine besonderen theologischen Fachbegriffe betroffen. »Sie hielten sich die Ohren zu« und »auf ihn losstürmen« sind klare, treffende Wiedergaben der griechischen Ausdrücke.
  issues:
