id: ACT.7.57
reference: Acts 7:57
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: de
  text: Doch sie schrien laut, hielten sich die Ohren zu und stürmten einmütig auf ihn los.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κράξαντες
  choice: sie schrien
  rationale: Das Aoristpartizip bezeichnet lautes Rufen oder Schreien. Im Deutschen gibt ein koordinierter Hauptsatz die Abfolge natürlich wieder, ohne den Gefühlsgehalt näher festzulegen.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier den Gegensatz zwischen Stephanus’ Worten und der feindseligen Reaktion der Zuhörer.
- source_word: φωνῇ μεγάλῃ
  choice: laut
  rationale: Die instrumentale Wendung bedeutet idiomatisch »mit lauter Stimme«; »laut« ist im modernen Deutschen natürlicher und bewahrt den Sinn.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: hielten sich die Ohren zu
  rationale: Die Wendung beschreibt das bewusste Verschließen der eigenen Ohren, um nichts mehr zu hören. Diese Formulierung ist klar und idiomatisch.
- source_word: ὥρμησαν
  choice: stürmten ... los
  rationale: Das Verb bezeichnet eine plötzliche, energische Bewegung. »Auf ihn losstürmen« bringt die feindselig gerichtete Bewegung natürlich zum Ausdruck.
- source_word: ὁμοθυμαδὸν
  choice: einmütig
  rationale: Das Adverb betont nicht nur Gleichzeitigkeit, sondern gemeinsames Wollen und geschlossenes Handeln; »einmütig« bewahrt diese Nuance knapp.
- source_word: ἐπ’ αὐτόν
  choice: auf ihn los
  rationale: ἐπί mit Akkusativ bezeichnet hier die auf eine Person gerichtete Bewegung; zusammen mit »stürmten« ist »auf ihn los« idiomatisches modernes Deutsch.
