    issue: Der englische Audit-Trail setzt die Fußnotenmarkierung nach »with a loud voice«, während der Fußnotentext die Alternative zu ὁμοθυμαδόν (»together / with one accord«) erläutert.
    rationale: Dies ist ein Ankerproblem im englischen Referenztext, nicht im deutschen Entwurf. Der deutsche Text enthält keine Fußnote und benötigt für die gewählte, eindeutige Wiedergabe »einmütig« keine Fußnote.
  revised_text: Doch sie schrien laut, hielten sich die Ohren zu und stürmten einmütig auf ihn los.
