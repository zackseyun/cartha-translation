id: ACT.7.29
reference: Acts 7:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: de
  text: Auf dieses Wort hin floh Mose und lebte als Fremder im Land Midian[a]. Dort zeugte er zwei Söhne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ sich als ansässiger Fremder im Land Midian nieder“. Gemeint ist, dass Mose in einem Land lebte, das nicht seine Heimat war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: floh
  rationale: Der Aorist von φεύγω bezeichnet Moses’ Flucht; „floh“ ist knapp, natürlich und bewahrt die Nachdrücklichkeit des griechischen Verbs.
- source_word: δὲ
  choice: unmarkiert im Anschluss „Auf dieses Wort hin“
  rationale: δέ führt die Erzählung weiter und kann hier im Deutschen ohne eigenes Bindewort wiedergegeben werden, da der vorangestellte Auslöser den Zusammenhang bereits deutlich macht.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: Auf dieses Wort hin
  rationale: Die Formulierung bewahrt λόγος als „Wort“ und gibt die auslösende, möglicherweise kausale Beziehung idiomatisch wieder, ohne sie zu einer ausdrücklich begründenden Aussage zu verengen.
- source_word: ἐγένετο πάροικος
  choice: lebte als Fremder
  rationale: πάροικος bezeichnet jemanden, der außerhalb seiner Heimat in einem fremden Land wohnt. „Lebte als Fremder“ ist im modernen Deutsch verständlicher und natürlicher als „wurde ein Beisasse“ und vermeidet die stärkere Festlegung von „Exilant“.
- source_word: ἐν γῇ Μαδιάμ
  choice: im Land Midian
  rationale: Die Wiedergabe erhält γῇ ausdrücklich und verwendet die im Deutschen geläufige biblisch-geografische Form.
- source_word: οὗ
  choice: Dort
  rationale: Das Lokaladverb verweist auf Midian zurück; „Dort“ ergibt einen natürlichen deutschen Satzanschluss.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Bei einem männlichen Subjekt bezeichnet γεννάω das Vaterwerden beziehungsweise Zeugen. „Zeugte“ erhält diese Präzision, ohne archaisch zu wirken.
- source_word: υἱοὺς δύο
  choice: zwei Söhne
  rationale: Dies ist die unmittelbare und natürliche Wiedergabe der griechischen Wortgruppe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf dieses Wort hin“ bewahrt die knappe Ausdrucksweise und den möglichen kausalen Zusammenhang. „Lebte als Fremder“ vermeidet sowohl einen altertümlichen Fachausdruck als auch die theologisch oder politisch stärker festgelegte Bezeichnung „Exilant“.
