  terminology: „Mose“ und „Midian“ entsprechen dem etablierten deutschen biblischen Namengebrauch. „Zeugte“ gibt γεννάω bei männlichem Subjekt präzise wieder. Die Fußnote erläutert die Bedeutung von πάροικος sachlich, ohne eine unangebrachte historische oder theologische Deutung einzutragen.
