  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Satzes zutreffend wieder: Moses floh als Reaktion auf die genannte Äußerung, lebte anschließend als Nicht-Einheimischer im Land Midian und zeugte dort zwei Söhne. „Auf dieses Wort hin“ bewahrt die knappe, auslösende Funktion von ἐν τῷ λόγῳ τούτῳ, ohne den Grad der Kausalität übermäßig festzulegen. „Lebte als Fremder“ trifft πάροικος im Kontext angemessen; die ingressive Nuance von ἐγένετο ist hierbei nicht in einer Weise unterschlagen, die eine Änderung erforderte.'
