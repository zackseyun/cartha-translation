source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: de
  text: 'Am folgenden Tag erschien er ihnen, als sie miteinander kämpften, und versuchte, sie miteinander zu versöhnen[a]. Er sagte: »Ihr Männer, ihr seid doch Brüder! Warum tut ihr einander Unrecht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und suchte sie zum Frieden zu bringen«. Der griechische Imperfekt kann eine andauernde Handlung bezeichnen; im Zusammenhang liegt wahrscheinlich ein Versuch vor, da Moses Eingreifen zurückgewiesen wird.'
    reason: Aspektuelle und lexikalische Alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: Am folgenden Tag
  rationale: Gibt die zeitliche Abfolge des griechischen Ausdrucks natürlich und präzise wieder.
- source_word: ὤφθη
  choice: erschien er bei ihnen
  rationale: 'Das formal passive Verb wird in diesem Erzählzusammenhang idiomatisch intransitiv gebraucht: Mose trat für sie sichtbar in Erscheinung.'
- source_word: αὐτοῖς μαχομένοις
  choice: als sie miteinander kämpften
  rationale: Die partizipiale Konstruktion bezeichnet die gleichzeitig andauernde Handlung; »miteinander« verdeutlicht den gegenseitigen Kampf.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: versuchte, sie miteinander zu versöhnen
  rationale: Der Imperfekt lässt hier angesichts der Zurückweisung im Folgevers am besten einen nicht vollendeten Versöhnungsversuch erkennen. Die deutsche Formulierung gibt das Ziel des Friedens idiomatisch wieder.
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: Ihr Männer, ihr seid doch Brüder!
  rationale: »Männer« wahrt die direkte Anrede; »doch« bringt den appellativen Nachdruck der festgestellten gemeinsamen Zugehörigkeit natürlich zum Ausdruck, ohne den Sachgehalt zu erweitern.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: Warum tut ihr einander Unrecht?
  rationale: »Unrecht tun« entspricht dem relationalen und ethischen Sinn von ἀδικέω und ist im modernen Deutsch klar und würdig.
theological_decisions:
- issue: Bezug von »Brüder«
  choice: Wörtlich als gemeinsame brüderliche Zugehörigkeit der beiden israelitischen Männer wiedergegeben
  alternative: Landsleute
  rationale: Der griechische Text verwendet ausdrücklich ἀδελφοί und begründet damit Moses Appell; die verwandtschaftlich-solidarische Spannung soll erhalten bleiben.
- issue: Aspekt von συνήλλασσεν
  choice: als versuchte Handlung wiedergegeben
  alternative: »versöhnte sie« bzw. »führte sie zum Frieden«
  rationale: Der Imperfekt kann fortdauernde oder versuchte Handlung ausdrücken. Da der folgende Vers Moses Eingreifen als zurückgewiesen schildert, ist die konative Deutung im Kontext wahrscheinlich, bleibt aber in einer Fußnote transparent.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt eindringlich, ohne altertümliche Wendungen. Die Satzverbindung wurde für natürliche deutsche Lesbarkeit in zwei Sätze gegliedert.
