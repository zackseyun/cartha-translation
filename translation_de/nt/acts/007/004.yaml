revisions:
- from: Dann zog er aus dem Land der Chaldäer fort und ließ sich in Haran nieder. Von dort ließ Gott ihn, nachdem sein Vater gestorben war, in dieses Land übersiedeln, in dem ihr jetzt wohnt.[a]
  to: Dann, nachdem er das Land der Chaldäer verlassen hatte, ließ er sich in Haran nieder. Von dort siedelte Gott[a] ihn, nachdem sein Vater gestorben war[b], in dieses Land um, in dem ihr jetzt wohnt.
  rationale: Die Revision verbessert die deutsche idiomatische Genauigkeit und die Ankerführung, ohne die Aussage oder die in der griechischen Formulierung bestehende Subjektimplizitheit zu verändern. Die zeitliche Abfolge wird ausdrücklich beibehalten; der Fußnotenhinweis beschreibt die Spannung mit Genesis neutral.
