  source_fidelity: 'Die Grundbedeutung wird getroffen: Abraham verlässt das Land der Chaldäer, wohnt in Haran, und nach dem Tod seines Vaters wird er in das Land der gegenwärtigen Zuhörer umgesiedelt. Die kausative Bedeutung von μετῴκισεν sollte jedoch im Deutschen unmittelbarer wiedergegeben werden. Die Ergänzung „Gott“ ist kontextuell vertretbar, muss aber, da das griechische Subjekt unausgedrückt ist, genau an dieser Stelle kenntlich gemacht werden.'
  naturalness: „ließ Gott ihn … übersiedeln“ ist zwar verständlich, kann aber im heutigen Deutsch leicht permissiv („er erlaubte ihm“) statt kausativ wirken. „siedelte Gott ihn … um“ ist die natürlichere, direktere Wiedergabe. Die ausdrückliche Vorzeitigkeit des Partizips ist mit „nachdem er … verlassen hatte“ klarer als die bloße Reihung „zog … fort und ließ sich … nieder“.
  terminology: „Land der Chaldäer“, „Haran“, „sich niederlassen“ und „wohnen“ sind angemessen. „umsiedeln“ gibt den transitiv-kausativen Charakter von μετοικίζω besser wieder als „übersiedeln lassen“.
