id: ACT.7.4
reference: Acts 7:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: de
  text: Dann, nachdem er das Land der Chaldäer verlassen hatte, ließ er sich in Haran nieder. Von dort siedelte Gott[a] ihn, nachdem sein Vater gestorben war[b], in dieses Land um, in dem ihr jetzt wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Von dort siedelte er ihn … um.« Das Griechische nennt das Subjekt nicht ausdrücklich; aus dem Zusammenhang ist Gott als Handelnder zu erschließen.'
    reason: Bewahrt die grammatische Mehrdeutigkeit des nicht ausgedrückten Subjekts.
  - marker: b
    text: Stephanus ordnet diesen Umzug nach dem Tod von Abrahams Vater ein. Vergleiche 1. Mose 11,32; 12,4 zur damit verbundenen chronologischen Spannung.
    reason: Macht den Bezug der Zeitangabe sichtbar, ohne die Abfolge von Apostelgeschichte 7,4 zu harmonisieren.
lexical_decisions:
- source_word: τότε ἐξελθὼν
  choice: Dann zog er … fort
  rationale: Das temporale τότε und das vorzeitige Aoristpartizip werden in natürlichem Deutsch als fortschreitende Erzählung wiedergegeben; die Reihenfolge bleibt klar.
- source_word: ἐκ γῆς Χαλδαίων
  choice: aus dem Land der Chaldäer
  rationale: Bewahrt die volle geografisch-ethnische Wendung des Griechischen, ohne sie zu »Chaldäa« zu verkürzen.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: ließ sich in Haran nieder
  rationale: κατοικέω bezeichnet hier das Nehmen eines Wohnsitzes; »sich niederlassen« ist präzise und modernes Standarddeutsch.
- source_word: κἀκεῖθεν
  choice: Von dort
  rationale: Gibt den Herkunftsbezug klar wieder; der verbindende Sinn von καί wird im deutschen Satzanschluss ausreichend ausgedrückt.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: nachdem sein Vater gestorben war
  rationale: Die temporale Konstruktion bezeichnet ein vorausgehendes Ereignis und wird idiomatisch als Nebensatz wiedergegeben.
- source_word: μετῴκισεν αὐτὸν
  choice: ließ Gott ihn … übersiedeln
  rationale: 'μετοικίζω ist kausativ: jemanden an einen anderen Wohnort bringen beziehungsweise übersiedeln lassen. »Gott« wird als aus dem Zusammenhang erschlossener, im Vers jedoch nicht ausdrücklich genannter Satzgegenstand eingesetzt.'
- source_word: εἰς τὴν γῆν ταύτην
  choice: in dieses Land
  rationale: Gibt die gerichtete Bewegung von εἰς und den demonstrativen Bezug von ταύτην wieder.
- source_word: εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: in dem ihr jetzt wohnt
  rationale: Das zweite εἰς wird im Deutschen gemäß dem statischen Sinn von κατοικεῖτε idiomatisch mit »in« wiedergegeben.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von μετῴκισεν
  choice: Im Haupttext wird »Gott« ergänzt und die Ergänzung durch eine Fußnote offengelegt.
  alternative: »Von dort siedelte er ihn … um« beziehungsweise eine Passivform ohne ausdrücklich genannten Handelnden.
  rationale: Die griechische Verbform hat kein ausdrücklich genanntes Subjekt; im weiteren Zusammenhang ist Gott jedoch der naheliegende Handelnde. Die Fußnote bewahrt die formale Mehrdeutigkeit und verhindert, dass die Ergänzung als ausdrücklich im Vers stehend erscheint.
- issue: Chronologische Spannung zur Genesis-Erzählung
  choice: Die Abfolge »nachdem sein Vater gestorben war« wird unverändert übersetzt.
  alternative: Eine harmonisierende Umschreibung, die den Umzug zeitlich anders einordnet.
  rationale: Apostelgeschichte 7,4 stellt den Umzug ausdrücklich nach den Tod des Vaters. Die Übersetzung darf diese Spannung nicht stillschweigend auflösen; die Fußnote verweist auf die einschlägigen Vergleichsstellen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Sich niederlassen« und »übersiedeln lassen« vermeiden archaische beziehungsweise bürokratische Formulierungen. Der einzige Fußnotenmarker [a] steht im Haupttext und deckt sowohl die Subjektfrage als auch den notwendigen Querverweis ab.
