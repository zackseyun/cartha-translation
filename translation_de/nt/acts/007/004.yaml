    issue: Die Formulierung „ließ Gott ihn … übersiedeln“ ist im Deutschen semantisch potenziell permissiv.
    rationale: μετῴκισεν bezeichnet hier Gottes Veranlassung bzw. Verbringung an einen anderen Wohnort, nicht bloß eine Erlaubnis. „siedelte ihn um“ gibt die Kausativität unmittelbar wieder.
  - severity: low
