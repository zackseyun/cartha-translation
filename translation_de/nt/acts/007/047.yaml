  text: Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: de
  text: Doch Salomo baute ihm ein Haus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Tempel“; wörtlich: „ein Haus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Salomo
  rationale: Die im Deutschen eingebürgerte biblische Namensform.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet hier einen milden Gegensatz beziehungsweise eine Weiterführung mit Kontrast; „doch“ verbindet den Satz natürlich mit dem vorangehenden Gedankengang.
- source_word: οἰκοδόμησεν
  choice: baute
  rationale: Das Verb bezeichnet hier konkret die Errichtung eines Gebäudes; „baute“ ist direkt und idiomatisch.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezieht sich im Kontext auf Gott; die deutsche Wendung „ihm ein Haus bauen“ gibt Zweck und Zuordnung natürlich wieder.
- source_word: οἶκον
  choice: ein Haus
  rationale: Die Grundbedeutung ist „Haus“. Obwohl sachlich der Tempel gemeint ist, bewahrt „Haus“ den Wortlaut und die Spannung zum folgenden Hinweis, dass der Höchste nicht in von Menschenhand errichteten Häusern wohnt.
theological_decisions:
- issue: Soll οἶκον als „Haus“ oder deutend als „Tempel“ wiedergegeben werden?
  choice: Haus
  alternative: Tempel
  rationale: „Haus“ entspricht dem verwendeten griechischen Ausdruck und bewahrt die theologische Spannung des Zusammenhangs. „Tempel“ ist die sachlich zutreffende Identifikation des Gebäudes, wird aber als lexikalische Alternative in der Fußnote angegeben.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. „Doch“ bildet den milden Kontrast ab; „Haus“ hält sich eng an die Bildsprache des griechischen Textes.
