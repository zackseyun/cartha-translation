translation:
  language: de
  text: Ihr, die ihr das Gesetz durch Anordnungen von Engeln empfangen habt[a], habt es nicht gehalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Vermittlung von Engeln“ oder „auf Anordnung von Engeln hin“. Die griechische Wendung ist schwierig; sie bezeichnet eine Beteiligung von Engeln an der Gabe des Gesetzes, ohne deren genaue Art eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ihr
  rationale: Das qualitative Relativpronomen greift die direkt Angesprochenen anklagend auf. Im Deutschen führt ein eigenständiges „Ihr“ den Satz natürlich fort und bewahrt die direkte Anrede.
- source_word: ἐλάβετε
  choice: habt … empfangen
  rationale: Das Perfekt gibt den griechischen Aorist in diesem Zusammenhang idiomatisch wieder. „Empfangen“ bezeichnet die Entgegennahme des Gesetzes, ohne eine bereitwillige Annahme vorauszusetzen.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Gemeint ist das mosaische Gesetz. Die Großschreibung entspricht der regulären deutschen Substantivschreibung und fügt keine besondere Auslegung hinzu.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: auf Anordnungen von Engeln hin
  rationale: Die schwierige Wendung verbindet den Empfang des Gesetzes mit Anordnung beziehungsweise Vermittlung durch Engel. Die Formulierung bleibt näher an διαταγαί als eine eindeutige Wiedergabe mit „übermittelt“, ohne im Deutschen unverständlich zu werden.
- source_word: ἀγγέλων
  choice: Engeln
  rationale: Im Zusammenhang sind himmlische Wesen gemeint, die an der Gabe des Gesetzes beteiligt sind, nicht menschliche Boten.
- source_word: οὐκ ἐφυλάξατε
  choice: habt … nicht gehalten
  rationale: Bei einem Gesetz bedeutet φυλάσσω, es zu beachten oder einzuhalten. „Das Gesetz halten“ ist im Deutschen eine natürliche und prägnante Wendung.
theological_decisions:
- issue: Bedeutung von εἰς διαταγὰς ἀγγέλων
  choice: Der Empfang des Gesetzes geschah auf Anordnungen von Engeln hin beziehungsweise unter ihrer vermittelnden Beteiligung.
  alternative: Das Gesetz wurde durch Engel übermittelt oder aufgrund einer von Engeln vorgenommenen Anordnung empfangen.
  rationale: Die Wendung bezeugt eine Beteiligung von Engeln an der Gesetzgebung, legt deren genaue Art jedoch nicht eindeutig fest. Die Übersetzung bewahrt diese Unschärfe, statt den Ablauf der Vermittlung näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anklage bleibt knapp und eindringlich; die schwierige Formulierung zur Beteiligung der Engel wird im Haupttext relativ quellennah wiedergegeben und in der Fußnote erläutert.
