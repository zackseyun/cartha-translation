source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: de
  text: Dieser führte sie heraus und tat Wunder und Zeichen im Land Ägypten, am Roten Meer[a] und vierzig Jahre lang in der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische bezeichnet den Ort als »Rotes Meer« (Ἐρυθρὰ Θάλασσα). Im hebräischen Hintergrund steht die Bezeichnung, die auch mit »Schilfmeer« wiedergegeben werden kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen greift Mose betont auf und bewahrt die rhetorische Hervorhebung, ohne im Deutschen das unnötig abwertend klingende »dieser Mann« zu verwenden.
- source_word: ἐξήγαγεν αὐτούς
  choice: führte sie heraus
  rationale: Die Wendung gibt das Herausführen Israels aus Ägypten idiomatisch wieder und lässt Mose als handelnden menschlichen Mittler erscheinen.
- source_word: ποιήσας
  choice: und tat
  rationale: Der griechische Aoristpartizipialsatz bezeichnet eine mit dem Herausführen verbundene Handlung. Eine koordinierte deutsche Verbform ist natürlicher und bewahrt den sachlichen Zusammenhang.
- source_word: τέρατα καὶ σημεῖα
  choice: Wunder und Zeichen
  rationale: Die feste lukanische Wortverbindung unterscheidet staunenerregende Machttaten von zeichenhaften Handlungen und ist im Deutschen zugleich verständlich und traditionsnah.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: im Land Ägypten
  rationale: Die Übersetzung bildet γῇ ausdrücklich ab und erhält die geografische Reihung des griechischen Textes.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: am Roten Meer
  rationale: »Rotes Meer« gibt die ausdrückliche griechische Bezeichnung wieder. »Am« bezeichnet im natürlichen Deutschen den Schauplatz der Ereignisse, ohne zu behaupten, alle Zeichen seien innerhalb des Wassers geschehen.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: »Wüste« ist die geläufige biblische Bezeichnung für den Raum der Wanderung Israels und entspricht ἐρήμῳ in diesem Zusammenhang.
- source_word: ἔτη τεσσεράκοντα
  choice: vierzig Jahre lang
  rationale: Die Ergänzung »lang« drückt die zeitliche Dauer im Deutschen eindeutig und idiomatisch aus.
theological_decisions:
- issue: Bezug des Demonstrativpronomens und Moses Rolle beim Exodus
  choice: »Dieser« bezeichnet Mose nachdrücklich als den menschlichen Handelnden, durch den Israel herausgeführt wurde und Zeichen geschahen.
  alternative: Eine Wiedergabe mit »Er« würde die rhetorische Betonung abschwächen; eine erläuternde Einfügung göttlicher Urheberschaft ginge über den Wortlaut hinaus.
  rationale: Stephanus hebt in seinem Redegang Mose wiederholt mit einem Demonstrativpronomen hervor. Die Übersetzung wahrt diese Spannung und schreibt Mose die im Vers genannte Handlung zu, ohne daraus eine von Gott unabhängige Wirksamkeit abzuleiten.
- issue: Zeitlicher Bezug der vierzig Jahre
  choice: »vierzig Jahre lang in der Wüste« bezieht die Dauer natürlich auf die Wüstenzeit und die dort geschehenen Wunder und Zeichen.
  alternative: Man könnte die vierzig Jahre syntaktisch auf die gesamte Reihe einschließlich Ägyptens und des Roten Meeres beziehen.
  rationale: Die griechische Endstellung erlaubt formal einen weiteren Bezug, doch der unmittelbare Anschluss an »in der Wüste« und die bekannte Dauer der Wüstenwanderung sprechen für den engeren Bezug. Die deutsche Stellung wahrt den natürlichen Zusammenhang, ohne zusätzliche Erklärung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählform und die dreigliedrige geografische Folge bleiben erhalten; die koordinierte Form »und tat« klingt natürlicher als eine schwere Partizipialkonstruktion.
