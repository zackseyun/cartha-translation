  rationale: Die Revision dient ausschließlich der idiomatischen Modernisierung. Sie bewahrt die scharfe prophetische Anrede, die wörtliche Beschneidungsmetapher, den Bezug auf den Heiligen Geist und den Vergleich mit den Vätern. Das im griechischen Vergleich elliptisch mitverstandene Verb wird im Deutschen natürlich ergänzt.
