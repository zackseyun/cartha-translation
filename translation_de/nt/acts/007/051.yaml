  variant: modern standard German
source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: de
  text: Ihr seid halsstarrig und unbeschnitten an Herz und Ohren! Ihr widersetzt euch immer dem Heiligen Geist. Wie eure Väter es taten, so tut auch ihr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: Ihr Halsstarrigen
  rationale: Bewahrt das anschauliche biblische Bild des steifen Nackens in einer etablierten, würdevollen deutschen Ausdrucksweise, statt es zum bloßen „Stur“ abzuflachen.
- source_word: ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν
  choice: an Herz und Ohren Unbeschnittenen
  rationale: Gibt die Dative des Bezugs idiomatisch mit „an“ wieder und erhält die bewusst anstößige, prophetisch-bundestheologische Metapher. Der Singular „Herz“ ist im Deutschen als kollektive Wendung natürlich und entspricht der pluralischen Anrede.
- source_word: ἀεὶ
  choice: immer
  rationale: Gibt die fortdauernde und wiederkehrende Haltung der Angesprochenen unmittelbar wieder.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: dem Heiligen Geist
  rationale: Entspricht der bestimmten griechischen Wortgruppe und dem üblichen persönlichen Bezug in der Apostelgeschichte.
- source_word: ἀντιπίπτετε
  choice: widersetzt euch
  rationale: Drückt aktive Gegenwehr aus und ist im modernen Deutschen natürlicher als eine wörtliche Wiedergabe des zugrunde liegenden Bewegungsbildes.
- source_word: οἱ πατέρες ὑμῶν
  choice: eure Väter
  rationale: Bewahrt die ausdrücklich maskuline Verwandtschaftsbezeichnung und die rhetorische Verbindung mit den früheren Generationen Israels.
- source_word: ὡς … καὶ ὑμεῖς
  choice: Wie eure Väter, so auch ihr
  rationale: Vervollständigt den im Griechischen elliptischen Vergleich idiomatisch, ohne einen zusätzlichen inhaltlichen Gedanken einzuführen.
theological_decisions:
- issue: Bezug von „dem Heiligen Geist“
  choice: Persönlicher göttlicher Heiliger Geist
  alternative: Heiliger Geist als unpersönlicher göttlicher Einfluss oder als Gesinnung
  rationale: Die bestimmte Formulierung bezeichnet in der Apostelgeschichte regelmäßig den Heiligen Geist als handelndes persönliches Gegenüber; die Großschreibung folgt dem deutschen Gebrauch.
- issue: Bundestheologische Bildsprache der Unbeschnittenheit
  choice: Die Metapher „unbeschnitten“ für Herz und Ohren bewahren
  alternative: Deutend wiedergeben, etwa „verschlossen im Herzen und taub“
  rationale: Die Formulierung greift prophetische Bundes- und Beschneidungssprache auf. Eine rein psychologische Umschreibung würde diese Verbindung und ihre Spannung beseitigen.
- issue: Bezeichnung der früheren Generationen
  choice: „eure Väter“
  alternative: „eure Vorfahren“
  rationale: Die Übersetzung erhält die konkrete maskuline Bezeichnung des griechischen Textes und dessen anklagende Wiederaufnahme der Geschichte Israels.
translation_notes:
  register: Direkte, scharfe prophetische Anklage in modernem, würdigem Standarddeutsch. „Halsstarrig“ und „unbeschnitten“ bleiben wegen ihrer biblischen Bildkraft bewusst markant; die Ausrufeintonation bildet die vorangestellten Anredeformen ab.
