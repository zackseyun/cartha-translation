source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: de
  text: Und er gab ihm den Bund der Beschneidung. Und so zeugte Abraham Isaak und beschnitt ihn am achten Tag; Isaak zeugte Jakob und Jakob die zwölf Patriarchen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: den Bund der Beschneidung
  rationale: διαθήκη bezeichnet in diesem heilsgeschichtlichen Zusammenhang einen Bund. Der Genitiv περιτομῆς kennzeichnet ihn als den durch die Beschneidung bestimmten Bund aus 1. Mose 17. Der bestimmte Artikel macht den aus dem Zusammenhang eindeutig identifizierbaren Bund im Deutschen idiomatisch kenntlich.
- source_word: οὕτως
  choice: So
  rationale: Das knappe „So“ bewahrt den folgernden beziehungsweise fortführenden Zusammenhang und klingt im modernen Deutschen natürlich.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Bei männlichen Subjekten in einer genealogischen Folge gibt „zeugte“ die Bedeutung präzise, knapp und ohne Umschreibung wieder.
- source_word: περιέτεμεν
  choice: beschnitt
  rationale: „Beschneiden“ ist der sachlich und biblisch etablierte deutsche Ausdruck für περιτέμνω.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: am achten Tag
  rationale: Die Dativfügung ist temporal; die deutsche Formulierung ist idiomatisch und fügt keinen im Griechischen unausgesprochenen Zusatz hinzu.
- source_word: πατριάρχας
  choice: Patriarchen
  rationale: „Patriarchen“ ist der etablierte bibelgeschichtliche Ausdruck für die Stammväter der zwölf Stämme Israels und wahrt zugleich die Terminologie des griechischen Textes.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: Isaak / Jakob
  rationale: Die Namen folgen den geläufigen deutschen Bibelformen.
- source_word: αὐτός (implizites Subjekt von ἐγέννησεν)
  choice: Abraham
  rationale: Die Wiederaufnahme des im unmittelbaren Kontext genannten Abraham verhindert im Deutschen eine mögliche falsche Zuordnung des Pronomens und macht den Satz flüssig, ohne zusätzliche Sachinformation einzutragen.
theological_decisions:
- issue: Bestimmtheit des Bundes mit Abraham
  choice: „den Bund der Beschneidung“
  alternative: „einen Bund der Beschneidung“
  rationale: Obwohl διαθήκην keinen Artikel trägt, verweist die Erzählung auf den bestimmten, aus 1. Mose 17 bekannten Bund. Das Deutsche verlangt hier für den identifizierbaren Referenten natürlicherweise den bestimmten Artikel; damit wird keine weitergehende Bundestheologie festgelegt.
- issue: Genealogische Bedeutung von γεννάω
  choice: „zeugte“
  alternative: „wurde der Vater von“
  rationale: „Zeugte“ erhält die männlich-genealogische Aussage des griechischen Verbs und die knappe Parallelstruktur. Die Formulierung macht keine Aussage darüber, ob in genealogischen Listen Generationen ausgelassen sein können.
- issue: Bezeichnung der zwölf Söhne Jakobs
  choice: „die zwölf Patriarchen“
  alternative: „die zwölf Stammväter“
  rationale: „Patriarchen“ bewahrt den im Urtext verwendeten Titel und dessen heilsgeschichtlichen Klang, ohne die Männer über ihre Rolle als Stammväter hinaus näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper genealogischer Parallelstruktur. „Zeugte“ und „Patriarchen“ sind bewusst bibelsprachlich geprägt, aber weiterhin allgemein verständlich. Das Semikolon gliedert die lange Abstammungsfolge, ohne ihren engen Zusammenhang aufzulösen.
