  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: de
  text: Zu dieser Zeit wurde Mose geboren, und er war in Gottes Augen schön.[a] Drei Monate lang wurde er im Haus seines Vaters aufgezogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor Gott schön«. Das griechische Wort kann auch »ansehnlich« oder »stattlich« bedeuten; der Bezug auf Gott steht jedoch ausdrücklich im Wortlaut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: Zu dieser Zeit
  rationale: Die idiomatische deutsche Zeitangabe gibt den temporalen Bezug klar und natürlich wieder.
- source_word: ἐγεννήθη
  choice: wurde … geboren
  rationale: Im Geburtskontext ist dies die übliche deutsche Wiedergabe des Aorist Passiv von γεννάω.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: ἀστεῖος
  choice: schön
  rationale: Das Adjektiv bezeichnet hier Schönheit oder eine besonders ansprechende Beschaffenheit. „Schön“ bewahrt den naheliegenden Sinn, ohne ihn auf „außergewöhnlich“ oder „vielversprechend“ festzulegen.
- source_word: τῷ θεῷ
  choice: in Gottes Augen
  rationale: Die Formulierung gibt den Dativ als Bezug beziehungsweise Bewertung wieder und erhält den ausdrücklichen Gottesbezug in natürlichem Deutsch.
- source_word: ὃς
  choice: Er
  rationale: Ein neuer deutscher Satz vermeidet einen schwerfälligen Relativsatz; der Bezug auf Mose bleibt eindeutig.
- source_word: ἀνετράφη
  choice: wurde … aufgezogen
  rationale: Dies gibt das passive Aufziehen oder Großziehen eines Kindes im häuslichen Umfeld treffend wieder.
- source_word: μῆνας τρεῖς
  choice: Drei Monate lang
  rationale: Die vorangestellte Zeitdauer ist im Deutschen flüssig und bewahrt die Dauerangabe.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: im Haus seines Vaters
  rationale: Die Formulierung wahrt sowohl den familiären als auch den häuslichen Sinn von οἶκος und bleibt nah am griechischen Ausdruck.
theological_decisions:
- issue: Bedeutung von ἀστεῖος τῷ θεῷ
  choice: Mose war „in Gottes Augen schön“; Gottes bewertende Sicht bleibt ausdrücklich genannt.
  alternative: „vor Gott schön“ oder, bei idiomatischer Verstärkung, „außergewöhnlich schön“
  rationale: Der griechische Text nennt Gott ausdrücklich. Die Übersetzung darf diesen Bezug nicht in eine rein menschliche Einschätzung auflösen, sollte aber auch keine weitergehende Aussage über Erwählung oder göttliches Wohlgefallen hineinlesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Formulierung „in Gottes Augen“ ist natürlicher als das missverständliche „für Gott schön“ und bewahrt dennoch den ausdrücklichen Gottesbezug.
