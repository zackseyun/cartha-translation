id: ACT.7.37
reference: Acts 7:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: de
  text: 'Das ist der Mose, der zu den Israeliten[a] sagte: »Gott wird euch aus der Mitte eurer Brüder[c] einen Propheten[b] wie mich erwecken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Söhnen Israels«; gemeint sind die Israeliten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder stärker deutend: »den Propheten«. So wird die aus 5. Mose 18,15 bekannte Erwartung und ihre Anwendung auf Jesus in der Apostelgeschichte hervorgehoben.'
    reason: alternative_reading
  - marker: c
    text: Mit »Brüder« sind hier die Angehörigen des eigenen Volkes, also andere Israeliten, gemeint; im Griechischen steht die männliche Pluralform.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Das ist der Mose
  rationale: Die betonte Identifikation mit dem zuvor genannten Mose bleibt erhalten. Die im Deutschen markierte Formulierung »der Mose« spiegelt die griechische Wendung genauer als das glattere »Das ist Mose«.
- source_word: εἴπας
  choice: der … sagte
  rationale: Das attributive Aoristpartizip wird im Deutschen natürlich als Relativsatz wiedergegeben.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: zu den Israeliten
  rationale: Die idiomatische Bezeichnung meint das Volk Israel insgesamt. Die wörtliche Form »Söhne Israels« wird in einer Fußnote genannt.
- source_word: Προφήτην
  choice: einen Propheten
  rationale: Das artikellose Substantiv wird seinem unmittelbaren Wortlaut entsprechend unbestimmt wiedergegeben, ohne die christologische Bedeutung der Stelle im Haupttext vorwegzunehmen.
- source_word: ἀναστήσει
  choice: wird … erwecken
  rationale: »Erwecken« bewahrt den in diesem prophetischen Zusammenhang üblichen Sinn des Hervorbringens beziehungsweise Auftretenlassens und zugleich die sprachliche Verbindung zu anderen Verwendungen von ἀνίστημι.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: aus der Mitte eurer Brüder
  rationale: Die Formulierung gibt ἐκ als Herkunft aus der eigenen Gemeinschaft wieder und bewahrt das familiär-volkliche Bild von ἀδελφοί.
- source_word: ὡς ἐμέ
  choice: wie mich
  rationale: Dies ist die direkte und im Deutschen natürliche Wiedergabe des Vergleichs mit Mose.
theological_decisions:
- issue: Zitat aus 5. Mose 18,15 und seine messianische Bedeutung
  choice: »einen Propheten« im Haupttext
  alternative: »den Propheten«
  rationale: Apostelgeschichte wendet die Verheißung auf Jesus an; der griechische Wortlaut hat hier jedoch Προφήτην ohne Artikel. Die Übersetzung bewahrt daher den unmittelbaren Wortlaut und weist nur in der Fußnote auf die bekannte Deutung als »der Prophet« hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst leicht markierte Wendung »der Mose« erhält die emphatische Identifikation des griechischen Textes; ansonsten ist der Satz idiomatisch und gut verständlich formuliert.
