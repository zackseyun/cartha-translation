id: ACT.7.43
reference: Acts 7:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: de
  text: Und ihr habt das Zelt des Moloch und den Stern des Gottes Räfan[a] mitgeführt, die Bilder[b], die ihr angefertigt habt, um sie anzubeten. Und ich werde euch über Babylon hinaus[c] in die Verbannung führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Übersetzungen geben im Anschluss an den hebräischen Text von Amos 5,26 „eures Gottes Räfan“ wieder. Hier in der Apostelgeschichte steht „des Gottes Räfan“.
    reason: alternative_reading
  - marker: b
    text: Oder „Gestalten“ beziehungsweise „Darstellungen“.
    reason: lexical_alternative
  - marker: c
    text: Hier in der Apostelgeschichte steht „über Babylon hinaus“. In Amos 5,27 lautet die entsprechende Ortsangabe gewöhnlich „über Damaskus hinaus“.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνελάβετε
  choice: ihr habt … mitgeführt
  rationale: Das Verb bezeichnet hier das Aufnehmen und Mittragen der kultischen Gegenstände. „Mitgeführt“ gibt diesen Sinn in natürlichem Deutsch wieder, ohne die Handlung unnötig auszudeuten.
- source_word: σκηνὴν
  choice: Zelt
  rationale: σκηνή bedeutet wörtlich „Zelt“. „Stiftshütte“ würde hier irreführend an das rechtmäßige Heiligtum Israels denken lassen; „Schrein“ wäre stärker interpretierend.
- source_word: Μολὸχ
  choice: Moloch
  rationale: Der Eigenname wird in der im Deutschen geläufigen Form wiedergegeben.
- source_word: ἄστρον
  choice: Stern
  rationale: ἄστρον bezeichnet unmittelbar einen Stern. Dass es sich im Zusammenhang um ein kultisches Symbol handeln kann, wird nicht schon in das Substantiv hineingedeutet.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: des Gottes Räfan
  rationale: Der griechische Text von Apostelgeschichte 7,43 lautet „des Gottes Räfan“. Die abweichende Form „eures Gottes“ aus der hebräischen Vorlage in Amos 5,26 wird in einer Fußnote genannt.
- source_word: Ῥαιφάν
  choice: Räfan
  rationale: „Räfan“ ist eine verständliche deutsche Umschrift der griechischen Namensform Ῥαιφάν und entspricht einer verbreiteten deutschen Wiedergabe.
- source_word: τύπους
  choice: Abbilder
  rationale: τύπος kann „Gestalt“, „Form“ oder „Abbild“ bedeuten. Im Zusammenhang mit selbst angefertigten Kultgegenständen ist „Abbilder“ klar und bewahrt zugleich den gegenständlichen Bezug.
- source_word: ἐποιήσατε
  choice: ihr angefertigt hattet
  rationale: Das Plusquamperfekt stellt im Deutschen natürlich klar, dass die Anfertigung dem Mitführen vorausging. „Angefertigt“ passt zu hergestellten Kultbildern, ohne zusätzliche Einzelheiten einzutragen.
- source_word: προσκυνεῖν αὐτοῖς
  choice: um sie anzubeten
  rationale: Im religiösen Zusammenhang bezeichnet προσκυνέω die verehrende Anbetung. Die Zweckkonstruktion gibt den griechischen Infinitiv natürlich wieder.
- source_word: μετοικιῶ
  choice: ich werde euch … in die Verbannung führen
  rationale: Das Verb bezeichnet eine erzwungene Umsiedlung beziehungsweise Wegführung ins Exil. Diese Formulierung bewahrt den Exilgedanken und klingt weniger nach moderner Verwaltungssprache als „deportieren“.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: über Babylon hinaus
  rationale: ἐπέκεινα bedeutet „jenseits“ oder „über … hinaus“. „Babylon“ folgt ausdrücklich dem griechischen Text der Apostelgeschichte.
theological_decisions:
- issue: Das Zitat in Apostelgeschichte nennt als Ziel der Verbannung Babylon, während Amos 5,27 gewöhnlich Damaskus nennt.
  choice: über Babylon hinaus
  alternative: über Damaskus hinaus
  rationale: Der Wortlaut der Apostelgeschichte wird nicht an die Amosüberlieferung angeglichen. Die Spannung zwischen beiden Texten bleibt durch die Fußnote sichtbar.
- issue: Apostelgeschichte 7,43 hat „des Gottes Räfan“, während die hebräische Vorlage von Amos 5,26 „eures Gottes“ zugrunde legt.
  choice: des Gottes Räfan
  alternative: eures Gottes Räfan
  rationale: Die Übersetzung folgt der vorliegenden griechischen Formulierung in der Apostelgeschichte und dokumentiert die quellensprachliche Abweichung in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Zitat, wird aber durch „mitgeführt“ und „in die Verbannung führen“ idiomatisch gestaltet. Die Wiederholung von „Und“ bewahrt den parataktischen Nachdruck des Ausgangstextes.
