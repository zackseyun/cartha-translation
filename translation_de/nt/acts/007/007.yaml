source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: de
  text: »Und über das Volk, dem sie als Sklaven dienen werden, werde ich Gericht halten«, sagte Gott, »und danach werden sie ausziehen und mir an diesem Ort dienen[a].«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mich anbeten« / »mir Gottesdienst erweisen«. Das griechische Verb bezeichnet hier den religiösen Dienst für Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: Volk
  rationale: ἔθνος bezeichnet hier das Gemeinwesen, das Abrahams Nachkommen versklaven wird. »Volk« ist in diesem alttestamentlichen Zitat natürlich und vermeidet die moderne staatsrechtliche Färbung von »Nation«.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: dem sie als Sklaven dienen werden
  rationale: Der Dativ bezeichnet den Empfänger des Dienstes; im Kontext der ägyptischen Knechtschaft macht »als Sklaven dienen« den Zwangscharakter deutlich, ohne die Verbform in ein Passiv umzuwandeln.
- source_word: κρινῶ
  choice: werde ich Gericht halten
  rationale: κρίνω bezeichnet hier Gottes richterliches Eingreifen. »Gericht halten über« wahrt den gerichtlichen Sinn und klingt im Deutschen natürlicher als das bloße »richten«.
- source_word: ὁ θεὸς εἶπεν
  choice: sagte Gott
  rationale: Die eingeschobene Redeeinleitung wird knapp und in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: μετὰ ταῦτα
  choice: danach
  rationale: »Danach« gibt die zeitliche Folge idiomatisch wieder; das griechische Neutrum Plural wird im Deutschen nicht künstlich als »nach diesen Dingen« nachgebildet.
- source_word: ἐξελεύσονται
  choice: werden sie ausziehen
  rationale: Im Zusammenhang mit dem Exodus bezeichnet ἐξέρχομαι das Verlassen des Landes der Knechtschaft. »Ausziehen« trägt diesen heilsgeschichtlichen Kontext, ohne ihn ausdrücklich hinzuzufügen.
- source_word: λατρεύσουσίν μοι
  choice: werden mir dienen
  rationale: λατρεύω bezeichnet auf Gott gerichteten religiösen Dienst. »Mir dienen« erhält zugleich das bewusste Gegenüber zu δουλεύω; die kultische Bedeutung wird in einer Fußnote kenntlich gemacht.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: an diesem Ort
  rationale: »An diesem Ort« ist die natürliche deutsche Entsprechung und bewahrt den örtlichen Hinweis ohne zusätzliche Identifizierung.
theological_decisions:
- issue: Wiedergabe von δουλεύω im Kontext der Versklavung
  choice: als Sklaven dienen
  alternative: dienen; versklavt sein
  rationale: Der Zusammenhang verlangt mehr als freiwilligen Dienst. Die aktive Form bleibt jedoch erhalten, sodass weder der Zwang noch die grammatische Gestalt eingeebnet wird.
- issue: Wiedergabe von λατρεύω gegenüber Gott
  choice: mir dienen
  alternative: mich anbeten; mir Gottesdienst erweisen
  rationale: Das Verb bezeichnet religiösen beziehungsweise kultischen Dienst. »Dienen« bewahrt die Verbindung und den Kontrast zum vorherigen δουλεύω; eine Fußnote erläutert die besondere Bedeutung, damit sie nicht als gewöhnliche Arbeit missverstanden wird.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Gottesrede wird durch deutsche Anführungszeichen klar gegliedert. Der Kontrast zwischen erzwungenem Sklavendienst und dem Dienst für Gott bleibt sprachlich sichtbar; unnötig altertümliche Formulierungen werden vermieden.
