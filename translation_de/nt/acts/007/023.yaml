  terminology: „Brüder“ und „Söhne Israels“ bewahren die griechischen Verwandtschafts- und Volksbezeichnungen. Die Fußnote erläutert korrekt, dass damit israelitische Volksgenossen gemeint sind, ohne die Hauptaussage unnötig zu neutralisieren. „Besuchen“ ist für ἐπισκέψασθαι in diesem Zusammenhang angemessen; die mögliche Nuance des Sich-Kümmerns muss nicht in den Haupttext aufgenommen werden.
