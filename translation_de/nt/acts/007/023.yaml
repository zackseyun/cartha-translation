  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: de
  text: Als er vierzig Jahre alt geworden war[a], kam es ihm ins Herz[b], seine Brüder, die Söhne Israels[c], zu besuchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Als sich für ihn eine Zeit von vierzig Jahren erfüllte.«'
    reason: Wörtliche Alternative zur idiomatisch wiedergegebenen Altersangabe.
  - marker: b
    text: 'Oder: »stieg es in seinem Herzen auf«; sinngemäß: »fasste er den Entschluss«.'
    reason: Die Fußnote bewahrt sowohl das Bild des griechischen Ausdrucks als auch dessen mögliche Bedeutung.
  - marker: c
    text: Mit den »Brüdern« und den »Söhnen Israels« sind hier Moses israelitische Volksgenossen gemeint.
    reason: Erläuterung der familiären und ethnischen Bezeichnungen.
lexical_decisions:
- source_word: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: Als er vierzig Jahre alt wurde
  rationale: 'Die griechische Zeitangabe lautet wörtlich etwa: »Als sich für ihn eine Zeit von vierzig Jahren erfüllte«. Die gewählte Formulierung gibt den Eintritt in dieses Lebensalter natürlich wieder, ohne daraus lediglich einen statischen Alterszustand zu machen.'
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: kam es ihm ins Herz
  rationale: Die Formulierung bewahrt das semitisch geprägte Bild eines innerlich aufkommenden Entschlusses. Das glattere »da beschloss er« wäre verständlich, würde das Bild jedoch beseitigen.
- source_word: ἐπισκέψασθαι
  choice: zu besuchen
  rationale: Das Verb bezeichnet hier das Aufsuchen seiner Volksgenossen und kann zugleich Anteilnahme an ihrem Ergehen mitschwingen lassen. »Besuchen« ist im Kontext knapp und natürlich.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: seine Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten; die folgende Apposition erklärt, dass seine israelitischen Volksgenossen gemeint sind.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die Apposition wird formal transparent wiedergegeben und bewahrt die biblische Bezeichnung. Gemeint ist das Volk Israel insgesamt.
theological_decisions:
- issue: Geschlechtlich markierte Verwandtschafts- und Volksbezeichnung
  choice: seine Brüder, die Söhne Israels
  alternative: seine israelitischen Volksgenossen / die Israeliten
  rationale: Die griechischen maskulinen Pluralformen und die familiäre Sprache werden beibehalten, ohne sie auf ausschließlich männliche Personen zu verengen; eine Fußnote erläutert den kollektiven Bezug.
- issue: Innerer Entschluss des Mose
  choice: kam es ihm ins Herz
  alternative: er beschloss
  rationale: Die bildhafte, möglicherweise semitisch geprägte Ausdrucksweise des Ausgangstextes bleibt sichtbar. Zugleich wird nicht näher bestimmt, ob der Gedanke als Wunsch, Entschluss oder Antrieb zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Die Satzstruktur folgt dem Griechischen, bleibt aber gut lesbar; erklärungsbedürftige Idiome und kollektiv gebrauchte maskuline Bezeichnungen werden knapp in Fußnoten erläutert.
