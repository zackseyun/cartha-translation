  source_fidelity: 'Die Grundstruktur und die wesentlichen Begriffe sind zutreffend wiedergegeben: Die Zeitangabe, die bildhafte innere Regung, das Aufsuchen der Brüder und die appositionale Identifikation als „Söhne Israels“ bleiben erkennbar. „Als er vierzig Jahre alt wurde“ bezeichnet jedoch stärker den punktuellen Eintritt in das vierzigste Lebensjahr. ἐπληροῦτο ... τεσσερακονταετὴς χρόνος beschreibt idiomatisch, dass sich für Mose ein Zeitraum von vierzig Jahren erfüllte bzw. vollendete. „Als er vierzig Jahre alt geworden war“ gibt dies im Deutschen angemessener wieder, ohne eine weitergehende chronologische Präzisierung einzutragen.'
