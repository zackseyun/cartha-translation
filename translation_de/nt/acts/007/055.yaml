id: ACT.7.55
reference: Acts 7:55
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: de
  text: Er aber, erfüllt vom Heiligen Geist, blickte unverwandt zum Himmel und sah die Herrlichkeit Gottes und Jesus zur Rechten Gottes stehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zur Rechten Gottes“ ist eine biblische Wendung für den Platz höchster Ehre und Vollmacht.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων δὲ
  choice: Er aber, erfüllt
  rationale: Das Partizip beschreibt seinen fortdauernden Zustand, während δέ den Kontrast zur feindseligen Menge des vorangehenden Zusammenhangs markiert. Die deutsche Konstruktion ist natürlich und bewahrt diesen Umstandssinn.
- source_word: πλήρης πνεύματος ἁγίου
  choice: erfüllt vom Heiligen Geist
  rationale: Die Formulierung gibt den Zustand des Vollseins mit dem Heiligen Geist in heutigem, idiomatischem Deutsch wieder. „Voll Heiligen Geistes“ wäre formnäher, wirkt jedoch deutlich altertümlicher.
- source_word: ἀτενίσας
  choice: blickte unverwandt
  rationale: Das Verb bezeichnet ein festes, aufmerksames Hinschauen. „Blickte unverwandt“ erhält diese Intensität, ohne die Handlung zu überdeuten.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel
  rationale: Im Zusammenhang der Vision bezeichnet οὐρανός den Himmel als göttlichen Bereich, nicht lediglich den sichtbaren Luftraum. „Zum Himmel“ ist im Deutschen die natürliche Richtungsangabe.
- source_word: εἶδεν δόξαν θεοῦ
  choice: sah die Herrlichkeit Gottes
  rationale: Die direkte Formulierung bewahrt sowohl das schlichte Hauptverb als auch die biblisch geprägte Bezeichnung für die sichtbare Offenbarung göttlicher Majestät.
- source_word: Ἰησοῦν ἑστῶτα
  choice: Jesus … stehen
  rationale: Die deutsche Infinitivkonstruktion nach „sah“ gibt das prädikative Partizip natürlich wieder und bewahrt ausdrücklich Jesu stehende Haltung.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: zur Rechten Gottes
  rationale: Die feste deutsche biblische Wendung gibt das griechische räumliche Idiom verständlich wieder, statt die Präposition ἐκ unnatürlich mit „von“ abzubilden.
theological_decisions:
- issue: Bezug von πνεύματος ἁγίου
  choice: Heiliger Geist als persönliche göttliche Bezeichnung
  alternative: heiliger Geist beziehungsweise eine heilige geistige Kraft
  rationale: Der Sprachgebrauch in Lukas und der Apostelgeschichte sowie der unmittelbare Erzählzusammenhang sprechen für den Heiligen Geist. Die Übersetzung macht daraus keine bloße Eigenschaft oder unpersönliche Kraft.
- issue: Jesus zur Rechten Gottes
  choice: Die personale Unterscheidung und das Erhöhungsbild bleiben beide erhalten
  alternative: Eine erklärende Paraphrase wie „Jesus am höchsten Ehrenplatz Gottes“
  rationale: Die bildhafte Aussage des griechischen Textes soll nicht durch eine Deutung ersetzt werden. Sie unterscheidet Jesus von Gott und beschreibt zugleich seine Ehren- und Autoritätsstellung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Blickte unverwandt“ vermittelt die Intensität von ἀτενίζω, ohne archaisch zu klingen. Die traditionelle Wendung „zur Rechten Gottes“ bleibt im Haupttext erhalten und wird knapp erläutert.
