  text: Εἶπεν δὲ ὁ ἀρχιερεύς· ⸀Εἰ ταῦτα οὕτως ἔχει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: de
  text: 'Da fragte der Hohe Priester: »Verhält es sich so?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ist das so?«; wörtlicher: »Verhalten sich diese Dinge so?«; sinngemäß auch: »Treffen diese Anschuldigungen zu?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: fragte
  rationale: λέγω bedeutet formal »sagen«. Da unmittelbar eine direkte Frage folgt, ist »fragte« im heutigen Deutsch die natürliche Wiedergabe der Sprechhandlung, ohne den Inhalt zu verändern.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier den nächsten Schritt der Erzählung ein. »Da« verbindet die Frage natürlich mit den unmittelbar vorausgehenden Anschuldigungen.
- source_word: ὁ ἀρχιερεύς
  choice: der Hohe Priester
  rationale: ἀρχιερεύς bezeichnet hier den einzelnen Hohen Priester, der in der Verhandlung das Wort ergreift; »Oberpriester« könnte mit der Gruppe der führenden Priester verwechselt werden.
- source_word: Εἰ
  choice: Fragesatz ohne eigenes lexikalisches Gegenstück
  rationale: εἰ leitet hier eine direkte Entscheidungsfrage ein. Im Deutschen wird diese Funktion idiomatisch durch die Verberststellung ausgedrückt.
- source_word: ταῦτα
  choice: es
  rationale: Das neutrale Pronomen greift die zuvor genannten Anschuldigungen auf und ergibt zusammen mit »sich so verhalten« eine natürliche deutsche Frage. Die ausdrücklichere Wiedergabe »diese Dinge« bleibt in der Fußnote erhalten.
- source_word: οὕτως ἔχει
  choice: verhält es sich so
  rationale: Die feste Verbindung οὕτως ἔχει bedeutet »so sein« bzw. »sich so verhalten«. Diese Wiedergabe bewahrt die zurückhaltende Formulierung des griechischen Textes, ohne ταῦτα ausdrücklich als »Anschuldigungen« auszulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe gerichtliche Frage bleibt erhalten; die im Kontext naheliegende Deutung von ταῦτα als Anschuldigungen wird nicht in den Haupttext aufgenommen, sondern als sinngemäße Möglichkeit in der Fußnote genannt.
