  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: de
  text: Und sie wurden nach Sichem überführt und in das Grab gelegt, das Abraham für einen Silberpreis von den Söhnen Hamors in Sichem gekauft hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung des Stephanus verbindet Einzelheiten, die man mit 1. Mose 23 vergleichen kann, wo Abraham von Efron eine Grabstätte bei Machpela kauft, und mit 1. Mose 33,19, wo Jakob bei Sichem Land von den Söhnen Hamors kauft.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: wurden nach Sichem überführt
  rationale: Der Aorist Passiv bezeichnet hier die Verbringung der sterblichen Überreste an einen anderen Ort. „Überführt“ ist im Deutschen im Bestattungskontext natürlich und bewahrt den Gedanken der Ortsverlagerung.
- source_word: Συχὲμ / Συχέμ
  choice: Sichem
  rationale: „Sichem“ ist die etablierte deutsche Form des Ortsnamens.
- source_word: ἐτέθησαν
  choice: wurden … gelegt
  rationale: Im Zusammenhang mit einer Bestattung gibt „gelegt“ das griechische τίθημι schlicht und angemessen wieder.
- source_word: μνήματι
  choice: Grab
  rationale: μνῆμα bezeichnet eine Grabstätte oder ein Grab. „Grab“ ist im modernen Deutsch verständlich und passt zum Kontext.
- source_word: ᾧ
  choice: das
  rationale: Das Relativpronomen bezieht sich grammatisch auf μνήματι; im Deutschen leitet „das“ den Relativsatz zu „Grab“ ein.
- source_word: ὠνήσατο
  choice: gekauft hatte
  rationale: Das Verb bedeutet „kaufen“. Das Plusquamperfekt verdeutlicht natürlich, dass der Kauf der Beisetzung vorausging.
- source_word: τιμῆς ἀργυρίου
  choice: für einen Silberpreis
  rationale: Die Formulierung bewahrt knapp die Vorstellung eines in Silber entrichteten Kaufpreises, ohne sie zu einer bestimmten Geldsumme auszugestalten.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: von den Söhnen Hamors
  rationale: 'παρά mit Genitiv bezeichnet hier die Herkunft beziehungsweise die Verkäufer: „von“.'
- source_word: ἐν Συχέμ
  choice: in Sichem
  rationale: Die abschließende Ortsangabe wird unmittelbar wiedergegeben. So bleibt offen, ob sie Hamor, seine Söhne oder den Ort des Kaufes näher bestimmt.
theological_decisions:
- issue: Historische Spannung zu den Berichten über den Erwerb von Grabstätten im 1. Buch Mose
  choice: 'Stephanus’ Wortlaut bleibt erhalten: Abraham kaufte das Grab von den Söhnen Hamors in Sichem.'
  alternative: Den Wortlaut an Jakobs Landkauf in 1. Mose 33,19 oder an Abrahams Kauf bei Machpela in 1. Mose 23 angleichen.
  rationale: Die Übersetzung gibt den griechischen Text wieder, ohne ihn stillschweigend mit den alttestamentlichen Berichten zu harmonisieren. Die Spannung wird in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die passiven Verbformen und die Abfolge des griechischen Satzes bleiben weitgehend erhalten; die historische Spannung wird nicht im Haupttext aufgelöst.
