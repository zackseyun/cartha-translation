id: ACT.7.59
reference: Acts 7:59
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: de
  text: 'Und sie steinigten Stephanus. Dabei rief er[a]: »Herr Jesus, nimm meinen Geist auf!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dabei rief er ihn an und sagte«. Das griechische Wort kann ausdrücklich das Anrufen im Gebet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: sie steinigten
  rationale: Das Imperfekt bezeichnet die im Verlauf befindliche Handlung. Im Zusammenhang mit »dabei« gibt das deutsche Präteritum den fortdauernden Vorgang natürlich wieder.
- source_word: ἐπικαλούμενον καὶ λέγοντα
  choice: Dabei rief er
  rationale: Die beiden Partizipien beschreiben Stephanus während der Steinigung. »Rief er« ist im heutigen Deutsch natürlich und führt seinen ausdrücklichen Ruf an Jesus ein; die mögliche stärkere Bedeutung des Anrufens im Gebet wird in der Fußnote bewahrt.
- source_word: Κύριε Ἰησοῦ
  choice: Herr Jesus
  rationale: Die direkte Anrede wird wörtlich und ehrfürchtig wiedergegeben. »Herr« entspricht hier dem üblichen Sinn von κύριος.
- source_word: δέξαι
  choice: nimm … auf
  rationale: Der Imperativ von δέχομαι bezeichnet hier das Aufnehmen oder Empfangen des Geistes. »Nimm meinen Geist auf« ist idiomatisch, feierlich und in diesem Sterbekontext klar.
- source_word: τὸ πνεῦμά μου
  choice: meinen Geist
  rationale: »Geist« bewahrt die übliche und kontextuell passende Bedeutung von πνεῦμα, ohne sie auf Atem oder bloße Lebenskraft einzuengen.
theological_decisions:
- issue: Ist Stephanus’ Ruf ausdrücklich als Gebet beziehungsweise Anrufung Jesu wiederzugeben?
  choice: 'Der Haupttext gibt die direkte Anrede Jesu natürlich mit »rief er: Herr Jesus« wieder.'
  alternative: »Während er ihn anrief und sagte« oder »während er betete«
  rationale: Der griechische Text stellt eindeutig eine Bitte an Jesus dar. Zugleich bleibt beim Partizip ἐπικαλούμενον das Objekt unausgesprochen. Der Haupttext vermeidet daher eine erklärende Ergänzung, während die Fußnote den möglichen Sinn einer förmlichen Anrufung nennt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Aufteilung in zwei Sätze vermeidet eine schwerfällige Partizipialkonstruktion und erhält zugleich die Gleichzeitigkeit durch »Dabei«.
