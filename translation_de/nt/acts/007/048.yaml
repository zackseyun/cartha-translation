  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: de
  text: 'Doch der Höchste wohnt nicht in dem, was von Menschenhand gemacht ist[a], wie der Prophet sagt:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Tempeln, die von Menschenhand gemacht sind“. Der griechische Ausdruck ist weiter gefasst: „in dem, was von Menschenhand gemacht ist“; im unmittelbaren Zusammenhang geht es jedoch um den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Markiert den deutlichen Gegensatz zum vorherigen Satz über das von Salomo gebaute Haus und klingt im Deutschen vorangestellten Satz natürlich.
- source_word: οὐχ
  choice: nicht
  rationale: Verneint das finite Verb κατοικεῖ unmittelbar und idiomatisch.
- source_word: ὁ ὕψιστος
  choice: der Höchste
  rationale: Bewahrt den substantivierten göttlichen Hoheitstitel, ohne das im Griechischen nicht ausdrücklich stehende Wort „Gott“ hinzuzufügen.
- source_word: ἐν χειροποιήτοις
  choice: in dem, was von Menschenhand gemacht ist
  rationale: Gibt den substantivisch gebrauchten Plural des Adjektivs in natürlichem Deutsch bewusst allgemein wieder. Der unmittelbare Bezug auf Tempel bleibt möglich, ohne den weiteren Ausdruck darauf zu verengen.
- source_word: κατοικεῖ
  choice: wohnt
  rationale: Ist im Zusammenhang mit Gottes Gegenwart und Wohnstatt die natürliche und theologisch passende Entsprechung.
- source_word: καθὼς
  choice: wie
  rationale: Leitet idiomatisch die bestätigende prophetische Schriftstelle ein; ein verstärkendes „genau wie“ wäre im Deutschen unnötig.
- source_word: ὁ προφήτης
  choice: der Prophet
  rationale: Folgt dem griechischen Wortlaut, der den Propheten hier nicht namentlich als Jesaja bezeichnet.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt das Präsens der geläufigen Zitierformel und stellt die fortdauernde Stimme der Schrift heraus.
theological_decisions:
- issue: Ob χειροποιήτοις im Haupttext ausdrücklich auf Tempel eingegrenzt werden soll
  choice: Den weiteren Ausdruck „in dem, was von Menschenhand gemacht ist“ beibehalten
  alternative: „in Tempeln, die von Menschenhand gemacht sind“
  rationale: Der unmittelbare Zusammenhang betrifft den Tempel, doch das griechische Adjektiv ist weiter gefasst. Die allgemeinere Wiedergabe bewahrt die mögliche polemische Reichweite gegenüber menschlich hergestellten heiligen Dingen und Bauten.
- issue: Ob ὁ ὕψιστος als „der höchste Gott“ erweitert werden soll
  choice: „der Höchste“
  alternative: „der höchste Gott“
  rationale: Der Titel bezeichnet eindeutig Gott, doch θεός steht nicht im Ausgangstext. Die knappe Form erhält sowohl die Titelfunktion als auch die formale Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Von Menschenhand gemacht“ ist verständlich und bewahrt den biblisch-polemischen Klang, ohne altertümlich zu wirken. Der Doppelpunkt bleibt stehen, weil im folgenden Vers das Prophetenzitat beginnt.
