id: ACT.7.2
reference: Acts 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: de
  text: 'Er aber sagte: „Brüder und Väter, hört zu! Der Gott der Herrlichkeit erschien unserem Vater Abraham, als er in Mesopotamien war, bevor er in Haran wohnte.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Er aber sagte
  rationale: δέ markiert hier leicht den Fortgang beziehungsweise die Reaktion auf die vorausgehende Frage. „Er aber sagte“ bewahrt diese Verknüpfung, ohne einen starken Gegensatz zu erzwingen.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Brüder und Väter
  rationale: Die förmliche, ausdrücklich männliche Anrede an die versammelten Männer wird im Deutschen natürlich mit „Brüder und Väter“ wiedergegeben. Das anredende ἄνδρες muss in dieser Formel nicht zusätzlich und schwerfällig als „Männer“ ausgedrückt werden.
- source_word: ἀκούσατε
  choice: hört zu
  rationale: Der Imperativ fordert die Aufmerksamkeit der Zuhörer. „Hört zu“ ist im heutigen Deutsch direkt und idiomatisch.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: der Gott der Herrlichkeit
  rationale: Die Genitivkonstruktion bleibt erhalten; dadurch werden die feierliche biblische Ausdrucksweise und mögliche alttestamentliche Anklänge nicht zu einem bloßen Adjektiv eingeebnet.
- source_word: ὤφθη
  choice: erschien
  rationale: Die Passivform von ὁράω bezeichnet in diesem Zusammenhang eine Gotteserscheinung. „Erschien“ ist näher am griechischen Ausdruck als das deutendere „offenbarte sich“.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: unserem Vater Abraham
  rationale: Die Formulierung bewahrt die gemeinschaftliche Zuordnung Abrahams und entspricht natürlichem deutschem Satzbau.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: als er in Mesopotamien war
  rationale: Das Partizip wird als zeitliche Begleitumstandsangabe verstanden und klar sowie natürlich wiedergegeben.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: bevor er sich in Haran niederließ
  rationale: κατοικέω kann „wohnen“ oder „sich niederlassen“ bedeuten. Im Zusammenhang mit dem Wechsel des Aufenthaltsortes gibt „sich niederließ“ die mögliche ingressive beziehungsweise dauerhafte Nuance gut wieder.
theological_decisions:
- issue: Männliche Anrede des Publikums
  choice: Brüder und Väter
  alternative: Männer, Brüder und Väter
  rationale: Die ausdrücklich männliche Anrede wird nicht neutralisiert. Zugleich wird ἄνδρες nicht hölzern als separates Glied wiederholt, da seine Anredefunktion im Deutschen bereits durch die gesamte Formel getragen wird.
- issue: Wiedergabe des Gottestitels θεὸς τῆς δόξης
  choice: der Gott der Herrlichkeit
  alternative: der herrliche Gott
  rationale: Die formale Genitivstruktur bewahrt die theologische und mögliche intertextuelle Spannung besser als eine adjektivische Glättung.
- issue: Bedeutungsumfang von κατοικέω
  choice: sich niederlassen
  alternative: wohnen
  rationale: Beide Wiedergaben sind lexikalisch möglich. „Sich niederlassen“ passt zum räumlich-biografischen Kontext, ohne eine weitergehende theologische Aussage einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit feierlichem Ton. Die direkte Rede bleibt förmlich und nachdrücklich; traditionelle, aber weiterhin verständliche biblische Wendungen wie „Gott der Herrlichkeit“ werden bewahrt.
