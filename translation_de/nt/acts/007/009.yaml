  terminology: „Patriarchen“ ist im bibelsprachlichen modernen Standarddeutsch die etablierte und präzise Bezeichnung für πατριάρχαι. „Josef“, „Ägypten“ und „Gott war mit ihm“ sind korrekt und registergerecht.
