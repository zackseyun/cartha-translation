  source_fidelity: 'Die wesentlichen Begriffe sind zutreffend wiedergegeben: πατριάρχαι bezeichnet die Patriarchen bzw. Stammväter, ζηλώσαντες den Neid als Beweggrund, und der Verkauf Josefs nach Ägypten ist klar ausgedrückt. „Doch“ gibt jedoch καί als adversative Konjunktion wieder und verstärkt den Kontrast über den Wortlaut hinaus.'
