source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: de
  text: Und die Patriarchen verkauften Josef aus Neid nach Ägypten, und Gott war mit ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: Stammväter
  rationale: Gemeint sind hier Jakobs Söhne als Stammväter Israels. „Stammväter“ gibt diesen geschichtlich-theologischen Sinn präziser wieder als das allgemeinere „Vorfahren“.
- source_word: ζηλώσαντες
  choice: waren eifersüchtig auf
  rationale: Das Partizip bezeichnet den Beweggrund für den Verkauf. „Eifersüchtig auf“ ist im heutigen Deutsch natürlich und bewahrt die emotionale Stärke des griechischen Verbs.
- source_word: ἀπέδοντο
  choice: verkauften
  rationale: Im Zusammenhang mit der Josefgeschichte bezeichnet das Verb konkret den Verkauf Josefs; allgemeinere Wiedergaben wie „gaben preis“ wären zu unbestimmt.
- source_word: εἰς Αἴγυπτον
  choice: nach Ägypten
  rationale: Bei einer Bewegung zu einem geografischen Ziel ist „nach Ägypten“ die idiomatische deutsche Wiedergabe von εἰς Αἴγυπτον.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Gott war mit ihm
  rationale: Die schlichte Formulierung bewahrt die Aussage über Gottes Gegenwart bei Josef, ohne sie erklärend zu erweitern.
theological_decisions:
- issue: Gottes Gegenwart in Josefs Leiden
  choice: Doch Gott war mit ihm
  alternative: und Gott war mit ihm
  rationale: Das griechische καί verbindet die Aussagen, während der Zusammenhang zugleich einen deutlichen Gegensatz zwischen dem Verrat der Stammväter und Gottes Gegenwart erkennen lässt. „Doch“ macht diesen im Kontext liegenden Kontrast im Deutschen natürlich sichtbar, ohne zusätzliche Aussagen über die Vorsehung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Stammväter“ erhält die besondere geschichtlich-theologische Bezeichnung; die übrige Satzführung bleibt einfach und allgemein verständlich.
