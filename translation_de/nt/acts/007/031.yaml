id: ACT.7.31
reference: Acts 7:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: de
  text: Als Mose das sah, staunte er über den Anblick.[a] Als er näher kam, um genauer hinzusehen, ertönte die Stimme des Herrn:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über die Erscheinung«. Das griechische Wort kann einen sichtbaren Anblick oder eine Vision beziehungsweise Erscheinung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »geschah eine Stimme des Herrn«; sinngemäß auch: »da kam eine Stimme des Herrn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: als Mose das sah
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die dem Staunen vorausgeht. Die temporale Wiedergabe ist im Deutschen natürlich; »das« nimmt den sichtbaren Vorgang aus dem Kontext auf.
- source_word: ἐθαύμασεν
  choice: staunte
  rationale: Das Verb bezeichnet Verwunderung oder Erstaunen. »Staunte« ist gegenwärtiges, gut verständliches Deutsch und bewahrt den Ausdruck des Wunders.
- source_word: τὸ ὅραμα
  choice: den Anblick
  rationale: ὅραμα kann eine sichtbare Erscheinung oder Vision bezeichnen. Im Zusammenhang mit dem brennenden Dornbusch hebt »Anblick« das von Mose wahrgenommene Phänomen hervor, ohne die Möglichkeit einer Offenbarungserscheinung auszuschließen.
- source_word: προσερχομένου δὲ αὐτοῦ
  choice: als er näher kam
  rationale: Der Genitivus absolutus bezeichnet die begleitende beziehungsweise zeitliche Situation. Die Formulierung gibt Moses Annäherung flüssig wieder.
- source_word: κατανοῆσαι
  choice: um genauer hinzusehen
  rationale: Das Verb bezeichnet aufmerksames Wahrnehmen oder genaues Betrachten. Die finale Infinitivkonstruktion wird im Deutschen natürlich mit »um … zu« wiedergegeben.
- source_word: ἐγένετο φωνὴ κυρίου
  choice: ertönte die Stimme des Herrn
  rationale: Die ereignishafte Konstruktion ἐγένετο mit φωνή kündigt das Einsetzen einer Stimme an. »Ertönte« ist idiomatisch und fügt keinen Sprecher hinzu; der bestimmte Artikel entspricht natürlichem Deutsch, da die Stimme durch »des Herrn« näher bestimmt ist.
- source_word: κυρίου
  choice: des Herrn
  rationale: κύριος wird als »Herr« wiedergegeben. Der Genitiv hängt von »Stimme« ab und wird im Deutschen mit »des Herrn« ausgedrückt.
theological_decisions:
- issue: Wiedergabe von κύριος im Kontext einer Gotteserscheinung
  choice: Herr
  alternative: HERR
  rationale: Der griechische Text hat κύριος, nicht das hebräische Tetragramm. »Herr« bildet daher die vorliegende griechische Form unmittelbar ab. Der Bezug zu Exodus 3 kann an JHWH denken lassen, rechtfertigt aber nicht, diese Deutung typografisch in den Haupttext einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. »Staunte«, »Anblick« und »genauer hinzusehen« sind alltagssprachlich zugänglich, ohne den Text zu verflachen. Die Doppeldeutigkeit von ὅραμα wird durch eine Fußnote bewahrt.
