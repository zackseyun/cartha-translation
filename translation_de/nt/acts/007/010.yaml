id: ACT.7.10
reference: Acts 7:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: de
  text: und rettete ihn aus all seinen Bedrängnissen[a]. Er schenkte ihm Gunst und Weisheit vor dem Pharao, dem König von Ägypten, und setzte ihn als Herrscher über Ägypten und über den ganzen Haushalt des Pharao ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus all seinen Nöten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: rettete
  rationale: Das Medium bezeichnet hier die Befreiung aus Not und Gefahr. „rettete“ ist natürlich, klar und bewahrt den Gedanken aktiven Eingreifens.
- source_word: θλίψεων
  choice: Bedrängnissen
  rationale: Der Ausdruck umfasst die Nöte, den Druck und die Leiden Josefs. „Bedrängnisse“ wahrt das Gewicht des griechischen Wortes, ohne unnötig endzeitliche Nebenbedeutungen anzudeuten.
- source_word: χάριν
  choice: Gunst
  rationale: Im Zusammenhang bezeichnet χάρις das Wohlwollen, das Josef beim Pharao fand. „Gunst“ gibt diesen konkreten Beziehungssinn besser wieder als das theologisch stärker geprägte „Gnade“.
- source_word: σοφίαν
  choice: Weisheit
  rationale: Gemeint ist die von Gott verliehene und vom Pharao erkannte Einsicht und praktische Urteilskraft.
- source_word: ἐναντίον Φαραώ
  choice: vor dem Pharao
  rationale: Die Wendung bezeichnet Josefs Stellung in der Gegenwart beziehungsweise in den Augen des Pharaos. „vor dem Pharao“ ist knapp und quellennah.
- source_word: κατέστησεν
  choice: setzte … ein
  rationale: Das Verb bezeichnet hier die Einsetzung in eine Leitungsstellung. Die deutsche Wendung vermittelt eine formelle Übertragung von Autorität.
- source_word: ἡγούμενον
  choice: Herrscher
  rationale: Das Partizip bezeichnet jemanden, der leitende und regierende Autorität ausübt. „Herrscher“ ist weiter gefasst als „Statthalter“ und entspricht der offenen Formulierung des Ausgangstextes.
- source_word: ἐπ’ Αἴγυπτον
  choice: über Ägypten
  rationale: ἐπί mit Akkusativ bezeichnet hier den Bereich, über den Josef Autorität erhielt.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: dessen ganzen Hof
  rationale: οἶκος meint hier den Haushalt beziehungsweise Hofstaat des Pharaos, nicht ein Gebäude. „dessen“ macht im Deutschen eindeutig, dass sich αὐτοῦ auf den Pharao bezieht.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: Das Subjekt wird wie im Griechischen nicht ausdrücklich ergänzt; aus dem Zusammenhang ist Gott gemeint.
  alternative: „Gott rettete ihn …“
  rationale: Die Verben führen den vorherigen Kontext fort, in dem Gott mit Josef war. Die fehlende ausdrückliche Nennung Gottes wird bewahrt, ohne den Zusammenhang zu verdunkeln.
- issue: Bedeutung von χάρις
  choice: „Gunst“ im Sinn von Wohlwollen beim Pharao
  alternative: „Gnade“
  rationale: Der unmittelbare narrative Zusammenhang spricht von Josefs Ansehen vor dem ägyptischen König. Die Wiedergabe vermeidet, dem Wort hier ungefragt einen umfassenderen soteriologischen Sinn zu geben.
translation_notes:
  register: Moderne, würdige Standardsprache. „Bedrängnisse“ wahrt die Ernsthaftigkeit des Geschehens; „Hof“ bezeichnet hier den gesamten königlichen Haushalt beziehungsweise Hofstaat. Die Satzteilung nach dem ersten Teilsatz verbessert die deutsche Lesbarkeit, ohne die griechische Koordination inhaltlich aufzulösen.
