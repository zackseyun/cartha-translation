  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: de
  text: 'Und er sagte: »Seht, ich sehe die Himmel geöffnet[a] und den Menschensohn[b] zur Rechten Gottes stehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Himmel, die geöffnet worden sind«. Das griechische Perfektpassiv betont den bereits herbeigeführten und fortbestehenden Zustand des Geöffnetseins.'
    reason: lexical_alternative
  - marker: b
    text: »Der Menschensohn« ist ein messianisch geprägter Titel; die Formulierung erinnert an Daniel 7,13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Die aufmerksamkeitsweckende Interjektion wird als unmittelbarer Ausruf wiedergegeben. »Siehe« wäre möglich, klingt im heutigen Standarddeutsch jedoch stärker altertümlich.
- source_word: θεωρῶ
  choice: ich sehe
  rationale: Das Präsens bezeichnet die gegenwärtige, fortdauernde Wahrnehmung des Stephanus; »ich sehe« ist natürlich und lässt den visionären Zusammenhang bestehen.
- source_word: τοὺς οὐρανοὺς
  choice: die Himmel
  rationale: Der Plural des griechischen Textes wird bewahrt. Das singularische »den Himmel« wäre im Deutschen geläufiger, würde aber die Form der Vorlage einebnen.
- source_word: διηνοιγμένους
  choice: geöffnet
  rationale: Das Perfekt Passiv Partizip beschreibt einen durch das Öffnen entstandenen und fortbestehenden Zustand. »Geöffnet« gibt diesen knapp und natürlich wieder.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: Die etablierte Wiedergabe wahrt den christologisch bedeutsamen Titel und seinen Anklang an Daniel 7,13.
- source_word: ἐκ δεξιῶν
  choice: zur Rechten
  rationale: Die traditionelle deutsche Wendung bezeichnet den Ehren- und Autoritätsplatz und bewahrt die biblische Bildsprache.
- source_word: ἑστῶτα
  choice: stehen
  rationale: Die ausdrücklich genannte stehende Haltung wird direkt wiedergegeben und nicht mit anderen Aussagen über den sitzenden Christus harmonisiert.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv lässt sich im Deutschen unmittelbar und ohne erklärende Erweiterung wiedergeben.
theological_decisions:
- issue: Christologischer Titel υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Sohn des Menschen
  rationale: »Menschensohn« ist die erkennbare, textnahe deutsche Titelform und erhält den Bezug zu Daniel 7,13; eine aufgelöste Form wäre wörtlicher in ihren Bestandteilen, aber als Titel weniger deutlich.
- issue: Haltung des erhöhten Jesus
  choice: zur Rechten Gottes stehen
  alternative: zur Rechten Gottes sitzen
  rationale: Der Text sagt ausdrücklich »stehen«. Diese auffällige Aussage wird bewahrt und nicht an häufigere Formulierungen vom Sitzen zur Rechten Gottes angeglichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Quellenplural »die Himmel« und die auffällige stehende Haltung des Menschensohns bleiben erhalten. »Seht« vermittelt die Unmittelbarkeit des Ausrufs ohne das altertümlichere »Siehe«.
