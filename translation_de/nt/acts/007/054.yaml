  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: de
  text: Als sie das hörten, gerieten sie in ihrem Innersten in heftige Wut,[a] und sie knirschten mit den Zähnen gegen ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie wurden in ihren Herzen zersägt“; das griechische Verb greift bildhaft das Durchsägen oder Zerschneiden auf und bezeichnet hier heftige innere Erregung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: Als sie das hörten
  rationale: Das Partizip wird als natürlicher temporaler Nebensatz wiedergegeben. δέ markiert hier lediglich die Fortführung der Erzählung und braucht im Deutschen kein eigenes Wort; ταῦτα verweist zusammenfassend auf die vorausgehenden Aussagen des Stephanus.
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: ging es ihnen durchs Herz
  rationale: Die Wendung bewahrt das anschauliche Bild des griechischen Verbs („durchsägen, durchschneiden“) und bezeichnet hier eine heftige innere Erregung. Die deutsche Formulierung vermeidet eine vorschnelle Festlegung allein auf Zorn.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: sie knirschten vor Wut mit den Zähnen
  rationale: „Mit den Zähnen knirschen“ ist die natürliche deutsche Entsprechung; „vor Wut“ macht die im Kontext erkennbare feindselige Gemütsbewegung deutlich.
- source_word: ἐπ’ αὐτόν
  choice: gegen ihn
  rationale: ἐπί bezeichnet hier die gegen Stephanus gerichtete Feindseligkeit; „gegen ihn“ ist im Deutschen idiomatisch und erhält diese Ausrichtung.
theological_decisions:
- issue: Art der inneren Reaktion
  choice: ging es ihnen durchs Herz
  alternative: sie wurden in ihren Herzen rasend vor Wut
  rationale: Das seltene Verb vermittelt heftige innere Erregung mit einem Bild des Durchschneidens. Die Hauptübersetzung bewahrt das Bild und lässt dessen genaue emotionale Nuance offen; die Fußnote nennt die kontextuell naheliegende Deutung als Wut.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche, aber verständliche Wendung „ging es ihnen durchs Herz“ erhält bewusst die Bildhaftigkeit und Mehrdeutigkeit des griechischen Ausdrucks; die emotionale Feindseligkeit wird im zweiten Satzteil natürlich verdeutlicht.
