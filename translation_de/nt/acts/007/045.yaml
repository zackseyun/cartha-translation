    text: Im Griechischen steht derselbe Name wie für „Jesus“; hier ist Josua, der Sohn Nuns, gemeint.
    reason: alternative_reading
  revision_rationale: Die nicht im Ausgangstext enthaltene Aussage über ein Verbleiben des Zeltes wurde entfernt. Die deutsche Kongruenz wurde mit „Dieses“ hergestellt. Die Besitznahme wird idiomatisch, aber zurückhaltender wiedergegeben; die zeitliche Schlussangabe bleibt wie im Griechischen im Satz stehen, ohne ihren Bezug durch einen Zusatzsatz festzulegen.
