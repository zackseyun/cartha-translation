revisions:
- from: Diese brachten unsere Väter, nachdem sie sie übernommen hatten, zusammen mit Josua[a] in das Land, als sie es von den Völkern in Besitz nahmen, die Gott vor unseren Vätern vertrieb; dort blieb sie bis zu den Tagen Davids.
  to: Dieses brachten auch unsere Väter, die es in der Generationenfolge übernommen hatten, zusammen mit Josua[a] in das Land, bei der Besitznahme des Landes der Völker, die Gott vor unseren Vätern vertrieb, bis zu den Tagen Davids.
  rationale: Die nicht im Ausgangstext enthaltene Aussage über ein Verbleiben des Zeltes wurde entfernt. Die deutsche Kongruenz wurde mit „Dieses“ hergestellt. Die Besitznahme wird idiomatisch, aber zurückhaltender wiedergegeben; die zeitliche Schlussangabe bleibt wie im Griechischen im Satz stehen, ohne ihren Bezug durch einen Zusatzsatz festzulegen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:56:07Z'
review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt Josua zutreffend wieder und erfasst εἰσήγαγον sowie die Übernahme in der Generationenfolge grundsätzlich gut. Sie fügt jedoch mit „dort blieb sie“ eine im griechischen Text nicht vorhandene Prädikation hinzu und legt damit den Bezug von ἕως τῶν ἡμερῶν Δαυίδ unzulässig fest. Außerdem ist „Diese“ bei Bezug auf das im Deutschen sächliche „Zelt“ nicht kongruent, und „als sie es von den Völkern in Besitz nahmen“ macht die Väter ausdrücklich zu den Handelnden der Besitznahme und deutet das Objekt stärker aus, als die knappe griechische Genitivfügung verlangt.
  naturalness: Die Revision verwendet modernes, würdiges Standarddeutsch. „Dieses“ kann den Anschluss an das zuvor genannte Zelt knapp aufnehmen; der Relativsatz zur Übernahme macht die Satzstruktur verständlich, ohne den generationsbezogenen Sinn des Partizips zu verlieren.
  terminology: „Unsere Väter“, „Josua“ und „bis zu den Tagen Davids“ sind angemessen. „bei der Besitznahme des Landes der Völker“ gibt den Eroberungs- und Besitzergreifungskontext idiomatisch wieder; „des Landes“ ist zur deutschen Verständlichkeit ergänzt, ohne die Völker mit einem unnatürlichen Ausdruck als Besitzobjekt erscheinen zu lassen. Die Fußnote zur Namensgleichheit ist sachlich und ausreichend.
  issues:
  - severity: high
    issue: Zusätzlicher Satzteil „dort blieb sie“
    rationale: Der Ausgangstext enthält kein Verb oder keine Aussage, dass das Zelt an diesem Ort blieb. Der Zusatz entscheidet zudem den syntaktisch nicht völlig unstrittigen Anschluss der Zeitangabe und darf nicht in den Haupttext aufgenommen werden.
  - severity: medium
    issue: Nicht kongruentes „Diese“
    rationale: Das griechische Relativpronomen ist feminin, weil es auf σκηνή bezogen ist; im Deutschen ist „Zelt“ sächlich. Daher ist „Dieses“ erforderlich, wenn der Bezug auf Deutsch aufgenommen wird.
  - severity: medium
    issue: „als sie es von den Völkern in Besitz nahmen“ überinterpretiert die Konstruktion
    rationale: Die Formulierung macht die Väter ausdrücklich zu Subjekten und „es“ zu einem bestimmten Besitzobjekt. Die griechische Wendung ἐν τῇ κατασχέσει τῶν ἐθνῶν ist kompakter und ihre genitive Zuordnung sollte nicht stärker als nötig aufgelöst werden.
  revised_text: Dieses brachten auch unsere Väter, die es in der Generationenfolge übernommen hatten, zusammen mit Josua[a] in das Land, bei der Besitznahme des Landes der Völker, die Gott vor unseren Vätern vertrieb, bis zu den Tagen Davids.
  revised_footnotes:
