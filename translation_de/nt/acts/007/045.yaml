reference: Acts 7:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: de
  text: Dieses brachten auch unsere Väter, die es in der Generationenfolge übernommen hatten, zusammen mit Josua[a] in das Land, bei der Besitznahme des Landes der Völker, die Gott vor unseren Vätern vertrieb, bis zu den Tagen Davids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht derselbe Name wie für „Jesus“; hier ist Josua, der Sohn Nuns, gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: Diese
  rationale: Das feminine Relativpronomen verweist auf das Zelt des Zeugnisses im vorhergehenden Vers. Im Deutschen nimmt „Diese“ den Bezug eindeutig und natürlich wieder auf.
- source_word: εἰσήγαγον
  choice: brachten … in das Land
  rationale: εἰσάγω bedeutet „hineinbringen“. Die Ergänzung „in das Land“ macht das im Kontext vorausgesetzte Ziel verständlich, ohne den Sinn zu verändern.
- source_word: διαδεξάμενοι
  choice: nachdem sie sie übernommen hatten
  rationale: Das Partizip bezeichnet die Übernahme in der Nachfolge der vorigen Generation; „übernommen“ bewahrt sowohl den Empfang als auch den Gedanken der Weitergabe.
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Väter
  rationale: Die Formulierung erhält die wiederholte heilsgeschichtliche Redeweise des Stephanus und ist im gehobenen modernen Deutsch verständlich.
- source_word: μετὰ Ἰησοῦ
  choice: zusammen mit Josua
  rationale: Ἰησοῦ kann die griechische Form von Jesus oder Josua sein. Der geschichtliche Zusammenhang nach Mose bezeichnet eindeutig Josua, den Sohn Nuns.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: als sie es von den Völkern in Besitz nahmen
  rationale: κατάσχεσις bezeichnet Besitzergreifung beziehungsweise Inbesitznahme. Der Genitiv τῶν ἐθνῶν kann sich auf die Völker beziehungsweise das von ihnen gehaltene Land beziehen; die deutsche Fassung gibt den Eroberungskontext idiomatisch wieder, ohne „Enteignung“ zum lexikalischen Hauptsinn zu machen.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: die Gott … vertrieb
  rationale: ἐξωθέω bedeutet hinausdrängen oder vertreiben. Das Relativpronomen bezieht sich grammatisch auf die Völker.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: vor unseren Vätern
  rationale: Die semitisch geprägte Wendung bedeutet, dass Gott die Völker aus der Gegenwart beziehungsweise aus dem Weg der Vorfahren vertrieb. „vor“ bewahrt das Bild knapp und verständlich.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: bis zu den Tagen Davids
  rationale: Die formnahe Wendung erhält den zeitlichen Anschluss an den folgenden Vers.
theological_decisions:
- issue: Referent von Ἰησοῦ
  choice: Josua
  alternative: Jesus
  rationale: Obwohl dieselbe griechische Namensform auch für Jesus steht, handelt der Kontext vom Einzug Israels in das Land nach Mose; gemeint ist Josua, der Sohn Nuns. Eine Fußnote bewahrt die sprachliche Form des Ausgangstextes.
- issue: Bedeutung von διαδεξάμενοι
  choice: Übernahme des Zeltes in der Generationenfolge
  alternative: bloßes zeitliches „danach“ oder knappes „ihrerseits“
  rationale: Das Partizip trägt den Gedanken des Empfangens beziehungsweise Nachfolgens. Die ausdrückliche Wiedergabe vermeidet, diesen Aspekt zu verlieren.
- issue: Bezug von ἕως τῶν ἡμερῶν Δαυίδ
  choice: Das Zelt blieb bis zu Davids Zeit
  alternative: Gott vertrieb die Völker bis zu Davids Zeit
  rationale: Die Stellung der Wendung lässt syntaktisch einen gewissen Bezugsspielraum. Im Gedankengang führt sie jedoch am natürlichsten die Geschichte des Zeltes bis zu David weiter; „dort blieb sie“ macht diesen im Kontext wahrscheinlichen Bezug lesbar, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Unsere Väter“ bewahrt die rhetorische und heilsgeschichtliche Wiederholung der Rede. Die Satzstruktur wurde für verständliches Deutsch leicht entfaltet; das feminine Pronomen bezieht sich auf das Zelt des Zeugnisses.
