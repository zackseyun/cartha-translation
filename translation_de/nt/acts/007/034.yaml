source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: de
  text: '»Ich habe sehr wohl die Misshandlung meines Volkes in Ägypten gesehen,[a] und ich habe sein Stöhnen gehört. Ich bin herabgekommen, um es zu retten. Und nun komm: Ich werde dich nach Ägypten senden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Bedrängnis meines Volkes in Ägypten«; auch: »die Unterdrückung meines Volkes in Ägypten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: Ich habe sehr wohl gesehen
  rationale: Die Verbindung von Partizip und finitem Verb ist eine semitisch geprägte Verstärkung im Anschluss an die Septuaginta von Exodus 3,7. „Sehr wohl“ gibt den Nachdruck in natürlichem Deutsch wieder, ohne die Konstruktion hölzern nachzubilden.
- source_word: κάκωσιν
  choice: wie … misshandelt wird
  rationale: Das Substantiv bezeichnet üble Behandlung, Bedrängnis oder Unterdrückung. Die verbale Formulierung ist im modernen Deutsch natürlich und wahrt den Gedanken schuldhaft zugefügten Leids.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: mein Volk in Ägypten
  rationale: Die knappe Ortsbestimmung entspricht dem griechischen attributiven Ausdruck und bewahrt die Bezeichnung „mein Volk“.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: sein Stöhnen
  rationale: Das griechische Pronomen steht im Singular und bezieht sich auf das kollektiv verstandene „Volk“. Deutsch kann diese Kongruenz natürlich beibehalten; „Stöhnen“ trifft στεναγμός und erhält den Exodus-Anklang.
- source_word: κατέβην
  choice: Ich bin herabgekommen
  rationale: Die Formulierung bewahrt die anthropomorphe Rede von Gottes Eingreifen und gibt den Aorist als vollzogene, gegenwartsrelevante Bewegung wieder.
- source_word: ἐξελέσθαι
  choice: um es zu retten
  rationale: Das mediale ἐξαιρέω bedeutet hier herausretten oder befreien. „Retten“ ist klar, gegenwärtig und weniger potenziell missverständlich als „erlösen“.
- source_word: δεῦρο
  choice: komm
  rationale: Die deiktische Aufforderung wird knapp und idiomatisch wiedergegeben.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: Ich werde dich nach Ägypten senden
  rationale: Der Futur-Indikativ bezeichnet unmittelbar den göttlichen Auftrag; „nach Ägypten“ ist die natürliche deutsche Richtungsangabe.
theological_decisions:
- issue: Anthropomorphe Rede vom Herabkommen Gottes
  choice: Ich bin herabgekommen
  alternative: Ich bin gekommen
  rationale: Die Übersetzung erhält das räumlich-anthropomorphe Bild des Ausgangstextes, statt es deutend abzuschwächen.
- issue: Bedeutung von ἐξελέσθαι
  choice: um es zu retten
  alternative: um es zu befreien
  rationale: „Retten“ lässt offen, auf welche Weise Gott sein Volk aus der Bedrängnis herausführt, und fügt keine besondere soteriologische Deutung hinzu.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede folgt dem griechischen Satzfluss, verwendet aber natürliche deutsche Syntax. Der Nachdruck am Versanfang sowie die anthropomorphe Rede bleiben erhalten.
