source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: de
  text: Als aber die Zeit der Verheißung näher rückte, die Gott Abraham zugesagt hatte[a], wuchs das Volk und vermehrte sich in Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gott Abraham versprochen hatte“ oder „zu der Gott sich Abraham gegenüber verpflichtet hatte“. Das griechische Verb kann eine erklärte, verbindliche Zusage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ ἤγγιζεν
  choice: Als aber ... näher rückte
  rationale: Καθώς leitet den zeitlichen Zusammenhang ein, δέ markiert einen leichten Übergang, und der Imperfekt ἤγγιζεν beschreibt ein fortschreitendes Näherrücken.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: die Zeit, in der sich die Zusage erfüllen sollte
  rationale: Die wörtliche Wendung „die Zeit der Zusage“ wäre im Deutschen mehrdeutig. Die gewählte Formulierung gibt im Kontext natürlich wieder, dass der Zeitpunkt der zugesagten Erfüllung näher kam, ohne einen festgesetzten Termin in den Text hineinzulesen.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: die Gott Abraham gegeben hatte
  rationale: ὁμολογέω bezeichnet hier im Zusammenhang mit ἐπαγγελία eine erklärte Verpflichtung oder Zusage. „eine Zusage geben“ ist eine natürliche deutsche Verbindung und vermeidet die stärkere, nicht ausdrücklich bezeichnete Bedeutung „schwören“.
- source_word: ηὔξησεν ὁ λαὸς
  choice: wuchs das Volk
  rationale: „Wuchs“ gibt die Zunahme des Volkes als Kollektiv idiomatisch wieder und bleibt vom folgenden Verb unterschieden.
- source_word: καὶ ἐπληθύνθη
  choice: und vermehrte sich
  rationale: Die Wiedergabe bewahrt die verbale Doppelung und den Bedeutungsfortschritt des griechischen Textes.
- source_word: ἐν Αἰγύπτῳ
  choice: in Ägypten
  rationale: Direkte und übliche Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Bedeutung von ὡμολόγησεν im Verhältnis zu Gottes Zusage an Abraham
  choice: „die Gott Abraham gegeben hatte“
  alternative: „die Gott Abraham versprochen hatte“; „zu der Gott sich Abraham gegenüber verpflichtet hatte“; „die Gott Abraham zugeschworen hatte“
  rationale: Die Übersetzung bringt Gottes erklärte Zusage zum Ausdruck, ohne ausdrücklich eine Eidformel anzunehmen. „Zugeschworen“ wäre stärker als das hier verwendete Verb, während „gegeben“ in Verbindung mit „Zusage“ idiomatisch und inhaltlich offen bleibt.
- issue: Verhältnis von „Zeit“ und „Zusage“
  choice: „die Zeit, in der sich die Zusage erfüllen sollte“
  alternative: „die Zeit der Zusage“; „die Zeit für die Zusage“
  rationale: Der Kontext spricht vom Herannahen der Erfüllung, nicht davon, dass Gott die Zusage erst zu diesem Zeitpunkt geben würde. „Sollte“ bezeichnet hier die angekündigte künftige Erfüllung und nicht bloße Möglichkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Zusage“ vermeidet die unschöne Wiederholung „das Versprechen, das Gott versprochen hatte“. Die paarige Aussage „wuchs ... und vermehrte sich“ bewahrt die rhetorische Gestalt des Ausgangstextes.
