  naturalness: Die revidierte Fassung ist modernes, flüssiges Standarddeutsch und behält einen angemessen nüchternen biblischen Registerton. „Zeit der Verheißung“ ist in diesem Kontext idiomatisch und genauer als die auslegende Relativkonstruktion.
  terminology: „Verheißung“ gibt ἐπαγγελία als etablierter biblisch-theologischer Begriff treffend wieder. „zugesagt hatte“ gibt die hier kontextuell verpflichtende Bedeutung von ὡμολόγησεν natürlich wieder, ohne die stärkere Bedeutung eines Eides einzutragen. Abraham und Ägypten sind korrekt.
