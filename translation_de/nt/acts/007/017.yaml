    rationale: „zu der Gott sich Abraham gegenüber bekannt hatte“ ist keine hilfreiche wörtliche Glosse und klingt im Deutschen missverständlich. Die Fußnote sollte die möglichen Bedeutungsnuancen als Zusage bzw. erklärte Verpflichtung verständlich benennen.
