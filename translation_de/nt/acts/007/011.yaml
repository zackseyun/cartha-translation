id: ACT.7.11
reference: Acts 7:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: de
  text: Über ganz Ägypten und Kanaan kamen eine Hungersnot und große Bedrängnis, und unsere Väter[a] konnten keine Nahrung finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Vorfahren“. Im Griechischen steht „unsere Väter“; gemeint sind die Vorväter Israels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ
  choice: kamen
  rationale: Der Aorist von ἔρχομαι beschreibt hier idiomatisch das Eintreten der Hungersnot und der Bedrängnis. Die deutsche Satzstellung gibt die erzählerische Fortführung durch δέ ausreichend wieder, ohne einen unnötigen Zeitmarker einzufügen.
- source_word: λιμὸς
  choice: eine Hungersnot
  rationale: Gemeint ist eine weitreichende Lebensmittelknappheit, nicht lediglich persönlicher Hunger.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: über ganz Ägypten und Kanaan
  rationale: ἐπί mit Akkusativ bezeichnet hier die räumliche Ausdehnung über beide Gebiete.
- source_word: θλῖψις μεγάλη
  choice: große Bedrängnis
  rationale: Die Wendung bezeichnet die schwere Notlage infolge der Hungersnot, ohne an dieser Stelle eine endzeitliche Bedeutung vorauszusetzen.
- source_word: οὐχ ηὕρισκον
  choice: konnten … nicht finden
  rationale: Das Imperfekt beschreibt die fortdauernde erfolglose Suche beziehungsweise praktische Unmöglichkeit während der Krise.
- source_word: χορτάσματα
  choice: Nahrung
  rationale: Der Plural bezeichnet Essbares beziehungsweise Lebensmittelvorräte allgemein; „Nahrung“ ist weiter und weniger spezifizierend als „Getreide“ oder „Futter“.
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Väter
  rationale: Die ausdrücklich männliche Verwandtschaftsbezeichnung bezieht sich im Zusammenhang auf Israels Vorväter und wird quellennah bewahrt.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Vorfahren
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Der griechische Ausdruck ist ausdrücklich männlich und bezeichnet Israels Väter in der Heilsgeschichte. Die Alternative wird in der Fußnote genannt, ohne die Formulierung des Ausgangstextes im Haupttext zu neutralisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung der Ortsangabe ermöglicht eine natürliche gemeinsame Konstruktion für „Hungersnot“ und „große Bedrängnis“ und bewahrt zugleich ihre enge Verbindung im griechischen Satz.
