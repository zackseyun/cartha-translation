id: ACT.7.33
reference: Acts 7:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: de
  text: 'Da sagte der Herr zu ihm: »Zieh deine Sandalen aus[a], denn der Ort, auf dem du stehst, ist heiliger Boden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Löse die Sandale von deinen Füßen.«'
    reason: Der griechische Wortlaut verwendet das Verb »lösen« und das Substantiv »Sandale/Fußbekleidung« im Singular; die Hauptübersetzung gibt die Aufforderung idiomatisch wieder.
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: Die übliche und ehrerbietige Wiedergabe des griechischen Titels κύριος; sie bleibt beim neutestamentlichen Wortlaut, ohne die alttestamentliche Schreibweise für den Gottesnamen einzuführen.
- source_word: Λῦσον
  choice: Zieh … aus
  rationale: λύω bedeutet wörtlich »lösen«; in Verbindung mit Fußbekleidung bezeichnet es idiomatisch deren Ablegen. »Zieh … aus« ist im modernen Deutschen natürlich.
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: deine Sandalen
  rationale: ὑπόδημα steht im Griechischen im Singular, kann hier jedoch die Fußbekleidung als solche bezeichnen. Der deutsche Plural ist in dieser Aufforderung idiomatisch; die wörtlichere Form wird in der Fußnote dokumentiert.
- source_word: ὁ γὰρ τόπος
  choice: denn der Ort
  rationale: »Ort« gibt τόπος direkt wieder; »denn« bewahrt die begründende Funktion von γάρ.
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: auf dem du stehst
  rationale: Die Präposition ἐπί wird mit »auf« wiedergegeben; das Perfekt ἕστηκας bezeichnet hier den gegenwärtigen Zustand des Stehens.
- source_word: γῆ ἁγία
  choice: heiliger Boden
  rationale: Im örtlichen Zusammenhang bedeutet γῆ »Boden«; die prädikative Aussage wird im Deutschen natürlich als »ist heiliger Boden« formuliert.
theological_decisions:
- issue: Wiedergabe von κύριος in einem Zitat der Dornbuschszene
  choice: Herr
  alternative: HERR
  rationale: Der griechische Text hat κύριος und nicht den hebräischen Gottesnamen. »Herr« wahrt den neutestamentlichen Wortlaut und die Ehrfurcht, ohne eine nicht ausdrücklich vorhandene Kennzeichnung des Tetragramms einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede ist knapp und natürlich formuliert; die ungewöhnliche Singularform des griechischen Ausdrucks bleibt durch die Fußnote sichtbar.
