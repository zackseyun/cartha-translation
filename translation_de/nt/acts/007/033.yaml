  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: κύριος als »Herr«, der Imperativ Λῦσον idiomatisch als »Zieh … aus«, γάρ als »denn«, ἐφ’ ᾧ als »auf dem« und γῆ ἁγία als »heiliger Boden«. Der griechische Singular τὸ ὑπόδημα bei pluralischem »Füßen« ist im Deutschen in der Hauptfassung sinnvoll idiomatisiert; die Fußnote hält die auffällige Singularform transparent fest.'
  naturalness: '»Da sagte der Herr zu ihm: ›Zieh deine Sandalen aus, denn der Ort, auf dem du stehst, ist heiliger Boden.‹« ist klares, modernes Standarddeutsch mit einem angemessen würdigen biblischen Register. Die Formulierung vermeidet eine im Deutschen unnötig sperrige wörtliche Wiedergabe der singulären Fußbekleidung.'
  terminology: »Herr« entspricht κύριος und wahrt den griechischen Wortlaut, ohne den nicht im Text stehenden Gottesnamen typographisch zu markieren. »Sandalen« und »heiliger Boden« sind im Kontext treffend. Die Fußnote erläutert die lexikalische Alternative und den Singular sachgerecht.
