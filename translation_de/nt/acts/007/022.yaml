source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: de
  text: Und Mose wurde in aller Weisheit der Ägypter unterrichtet, und er war mächtig in seinen Worten und Taten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mächtig in Rede und Handeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: wurde … unterrichtet
  rationale: Das Passiv bezeichnet hier Moses umfassende Bildung beziehungsweise Unterweisung. „Wurde unterrichtet“ ist in modernem Deutsch natürlich und lässt den Umfang der Ausbildung offen.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: in aller Weisheit der Ägypter
  rationale: Die Wendung bewahrt die Breite von πάσῃ und gibt den Dativ als Bereich beziehungsweise Inhalt der Unterweisung wieder.
- source_word: δυνατὸς
  choice: mächtig
  rationale: „Mächtig“ erhält die Stärke des Ausdrucks und passt zu der folgenden Verbindung mit Worten und Taten, ohne ihn auf bloße Begabung abzuschwächen.
- source_word: ἐν λόγοις καὶ ἔργοις αὐτοῦ
  choice: in seinen Worten und Taten
  rationale: Die natürliche deutsche Wortverbindung gibt λόγοις und ἔργοις ausgewogen wieder. Das nachgestellte αὐτοῦ wird sinnvoll auf beide Glieder bezogen.
theological_decisions:
- issue: Umfang von Moses Stärke in λόγοις
  choice: „mächtig in seinen Worten und Taten“ ohne Angleichung an 2. Mose 4,10
  alternative: „wirkungsvoll in Rede und Handeln“ oder eine Deutung, die Moses eigene Worte abschwächt
  rationale: Die Aussage des Stephanus wird nach ihrem eigenen Wortlaut wiedergegeben. Die Spannung zu Moses Selbstaussage in 2. Mose 4,10 bleibt bestehen und wird nicht durch eine harmonisierende Paraphrase aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen; „Worte und Taten“ ist zugleich verständlich und bibelsprachlich angemessen.
