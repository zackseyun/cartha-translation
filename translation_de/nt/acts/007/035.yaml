revisions:
- from: 'Diesen Mose, den sie zurückgewiesen hatten, als sie sagten: »Wer hat dich zum Anführer und Richter eingesetzt?« – eben diesen sandte Gott als Anführer und Erlöser[a], durch die Hand des Engels, der ihm im Dornbusch erschienen war.'
  to: 'Diesen Mose, den sie zurückwiesen, als sie sagten: »Wer hat dich zum Herrscher und Richter eingesetzt?« – eben diesen hat Gott als Herrscher und Erlöser[a] durch den Engel gesandt, der ihm im Dornbusch erschien.'
  rationale: Die Revision bewahrt die rhetorische Hervorhebung und die beiden Funktionen Moses, stellt aber die Tempora näher am griechischen Text dar, präzisiert die Amtsbezeichnung und ersetzt eine im heutigen Deutsch schwer verständliche idiomatische Lehnübersetzung durch eine natürliche, semantisch gleichwertige Formulierung.
