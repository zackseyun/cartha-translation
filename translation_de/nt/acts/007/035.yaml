source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: de
  text: 'Diesen Mose, den sie zurückwiesen, als sie sagten: »Wer hat dich zum Herrscher und Richter eingesetzt?« – eben diesen hat Gott als Herrscher und Erlöser[a] durch den Engel gesandt, der ihm im Dornbusch erschien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Befreier«. Das griechische Wort bezeichnet jemanden, der Befreiung oder Freilassung bewirkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: zurückgewiesen hatten
  rationale: Das Verb bezeichnet hier die Zurückweisung von Moses Anspruch auf Autorität. »Zurückweisen« gibt den Bezug auf 2. Mose 2,14 natürlich und präzise wieder.
- source_word: κατέστησεν
  choice: eingesetzt
  rationale: Gemeint ist die Einsetzung in eine Autoritätsstellung; »eingesetzt« passt daher besser als das allgemeinere »gemacht«.
- source_word: ἄρχοντα
  choice: Anführer
  rationale: Das Wort bezeichnet jemanden, der Autorität ausübt. »Anführer« ist im heutigen Deutsch verständlich und bewahrt die rhetorisch wichtige Wiederholung im Vers.
- source_word: δικαστήν
  choice: Richter
  rationale: Die direkte und sachlich genaue deutsche Entsprechung ist »Richter«.
- source_word: λυτρωτὴν
  choice: Erlöser
  rationale: Das Wort bezeichnet jemanden, der Freilassung oder Befreiung bewirkt. »Erlöser« bewahrt den Bezug zur Wortfamilie des Loskaufens und Erlösens; die mögliche Wiedergabe »Befreier« wird in einer Fußnote genannt.
- source_word: ἀπέσταλκεν
  choice: sandte
  rationale: Das deutsche Präteritum gibt die vollzogene Sendung in dieser erzählenden Rückschau natürlich wieder.
- source_word: σὺν χειρὶ
  choice: durch die Hand
  rationale: Die semitisch geprägte Wendung bezeichnet Vermittlung oder Wirksamkeit. Die bewusst bildhafte Wiedergabe erhält die Formulierung des Ausgangstextes, ohne eine zusätzliche Deutung einzutragen.
- source_word: ἀγγέλου
  choice: des Engels
  rationale: Im Bericht vom Dornbusch ist ein himmlischer Bote gemeint; »Engel« ist dafür die klare und kontextgemäße Wiedergabe.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: der ihm im Dornbusch erschienen war
  rationale: Das formal passive Partizip hat hier idiomatisch die Bedeutung »erscheinen«. »Dornbusch« bezeichnet βάτος präziser als nur »Busch«; »brennend« wird nicht ergänzt, da es in diesem Vers nicht ausdrücklich steht.
- source_word: Τοῦτον ... τοῦτον
  choice: Diesen Mose ... eben diesen
  rationale: Die Wiederaufnahme mit »eben diesen« bewahrt die starke rhetorische Hervorhebung des Mannes, den das Volk zurückgewiesen hatte und den Gott dennoch sandte.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: als Anführer und Erlöser
  rationale: Die beiden Rollen werden gleichrangig wiedergegeben. Das Deutsche benötigt kein zusätzliches »sowohl«, da die Paarung auch so klar und würdig klingt.
theological_decisions:
- issue: Wiedergabe von λυτρωτής bei Moses als Gottes Werkzeug der Rettungsgeschichte
  choice: Erlöser
  alternative: Befreier
  rationale: »Erlöser« erhält die stärkere Nuance von Freisetzung und Erlösung und lässt die heilsgeschichtliche Bedeutung von Moses Sendung stehen. Die Übersetzung setzt Mose dabei nicht uneingeschränkt mit Christus gleich; die lexikalisch mögliche, weniger theologisch geprägte Lesart »Befreier« bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die emphatische Wiederholung des Demonstrativpronomens wird durch »Diesen Mose ... eben diesen« bewahrt. Die biblisch geprägte Wendung »durch die Hand« bleibt bewusst erhalten.
