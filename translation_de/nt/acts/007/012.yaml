  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: de
  text: Als Jakob aber hörte, dass es in Ägypten Getreide gab[a], schickte er unsere Väter zum ersten Mal dorthin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lebensmittelvorräte“. Das griechische Wort kann allgemeiner Vorräte zum Essen bezeichnen; in diesem Zusammenhang ist wahrscheinlich Getreide gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: als ... hörte
  rationale: Das Aoristpartizip bezeichnet hier den zeitlichen Umstand der Haupthandlung; die finite Wiedergabe mit „als“ ist im Deutschen natürlich und bewahrt die zeitliche Abfolge.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert einen leichten Übergang im Erzählgang. „Aber“ gibt diese Bewegung wieder, ohne einen starken Gegensatz zu erzeugen.
- source_word: ὄντα σιτία εἰς Αἴγυπτον
  choice: dass es in Ägypten Getreide gab
  rationale: Die Akkusativ-Partizip-Konstruktion nach ἀκούω wird idiomatisch als indirekte Rede wiedergegeben. Das griechische εἰς steht hier in einer für die Koine möglichen lokalen Bedeutung.
- source_word: σιτία
  choice: Getreide
  rationale: Der Plural kann Getreide oder allgemeiner Lebensmittelvorräte bezeichnen. Im Zusammenhang der Hungersnot und der Josefgeschichte ist „Getreide“ am wahrscheinlichsten; die breitere Bedeutung wird in der Fußnote erhalten.
- source_word: ἐξαπέστειλεν
  choice: schickte ... dorthin
  rationale: „Schickte“ gibt das Verb natürlich wieder; „dorthin“ macht das im Präfix ἐξ- und im Kontext enthaltene Aussenden auf eine Reise im Deutschen verständlich, ohne das Verb hölzern nachzubilden.
- source_word: τοὺς πατέρας ἡμῶν
  choice: unsere Väter
  rationale: Die konkrete männliche und familiäre Bezeichnung bleibt erhalten, da hier Jakobs Söhne als Israels Vorväter gemeint sind. „Vorfahren“ wäre flüssig, aber weniger nah am Wortlaut.
- source_word: πρῶτον
  choice: zum ersten Mal
  rationale: Die adverbiale Form bezeichnet den ersten von mehreren Besuchen und weist auf die später erwähnte zweite Reise voraus.
theological_decisions:
- issue: Wiedergabe von τοὺς πατέρας ἡμῶν
  choice: unsere Väter
  alternative: unsere Vorfahren; die Stammväter
  rationale: „Unsere Väter“ bewahrt die familiäre Sprache und das grammatische Geschlecht des griechischen Ausdrucks. Gemeint sind hier konkret die männlichen Vorväter Israels; „Stammväter“ wäre stärker deutend.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung ist natürlich gehalten; „dorthin“ vermeidet die im Deutschen mögliche Fehllektüre, Jakob habe die Väter lediglich fortgeschickt, und macht Ägypten als Reiseziel klar.
