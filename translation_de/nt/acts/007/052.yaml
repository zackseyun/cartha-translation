id: ACT.7.52
reference: Acts 7:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: de
  text: Welchen der Propheten haben eure Väter nicht verfolgt? Und sie töteten die, die das Kommen des Gerechten[a] im Voraus ankündigten. Dessen Verräter[b] und Mörder seid ihr nun geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Rechtschaffenen« beziehungsweise »desjenigen, der gerecht ist«.'
    reason: lexical_alternative
  - marker: b
    text: »Verräter« kann hier auch im Sinn von »Auslieferer« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Welchen der Propheten
  rationale: Die partitive Konstruktion wird im Deutschen direkt und idiomatisch wiedergegeben und bewahrt die rhetorische Aussage, dass kein Prophet ausgenommen war.
- source_word: ἐδίωξαν
  choice: haben ... verfolgt
  rationale: Im Zusammenhang bezeichnet das Verb die feindselige Verfolgung der Propheten; »verfolgen« ist die natürliche und sachlich genaue Wiedergabe.
- source_word: οἱ πατέρες ὑμῶν
  choice: eure Väter
  rationale: Die formnahe Wiedergabe bewahrt die anklagende Verbindung zu den Vorvätern; »Vorfahren« wäre im modernen Deutsch ebenfalls möglich.
- source_word: ἀπέκτειναν
  choice: sie töteten
  rationale: »Töten« ist eine klare, moderne Wiedergabe des Aorists ohne altertümliche Färbung.
- source_word: τοὺς προκαταγγείλαντας
  choice: die ... im Voraus ankündigten
  rationale: Die Formulierung bildet sowohl den Verkündigungscharakter als auch die zeitliche Bedeutung des Präfixes προ- ab.
- source_word: περὶ τῆς ἐλεύσεως
  choice: das Kommen
  rationale: In Verbindung mit προκαταγγέλλω ist »das Kommen ... ankündigen« natürliches Deutsch und bewahrt den vertrauten theologischen Ausdruck.
- source_word: τοῦ δικαίου
  choice: des Gerechten
  rationale: Der substantivierte Singular mit Artikel bezeichnet hier titelartig Jesus. Die Großschreibung folgt der deutschen Substantivierung und macht den bestimmten Bezug sichtbar.
- source_word: οὗ
  choice: Dessen
  rationale: Das Genitiv-Relativpronomen wird durch einen neuen, klaren deutschen Satz direkt auf »den Gerechten« bezogen.
- source_word: νῦν
  choice: nun
  rationale: »Nun« bewahrt den zeitlichen und rhetorischen Kontrast zwischen dem Handeln der Väter und der gegenwärtigen Schuld der Angeredeten.
- source_word: προδόται
  choice: Verräter
  rationale: »Verräter« ist die übliche substantivische Wiedergabe und bezeichnet diejenigen, die Jesus preisgegeben beziehungsweise ausgeliefert haben.
- source_word: φονεῖς
  choice: Mörder
  rationale: »Mörder« bringt den moralischen Schuldvorwurf stärker und genauer zum Ausdruck als das allgemeinere »Töter«.
- source_word: ἐγένεσθε
  choice: seid ... geworden
  rationale: Das deutsche Perfekt gibt den Eintritt in einen nun bestehenden schuldhaften Status idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von τοῦ δικαίου als christologische Bezeichnung
  choice: des Gerechten
  alternative: des Rechtfertigen / des gerechten Mannes
  rationale: Im Kontext der Rede des Stephanus verweist die bestimmte, substantivierte Bezeichnung auf Jesus, dessen Kommen die Propheten vorher ankündigten. »Der Gerechte« bewahrt die titelartige und zugleich beschreibende Spannung.
- issue: Beziehung von προδόται καὶ φονεῖς auf Jesus
  choice: Dessen Verräter und Mörder seid ihr nun geworden
  alternative: An ihm seid ihr nun zu Verrätern und Mördern geworden
  rationale: Die gewählte Form erhält die Genitivbeziehung von οὗ möglichst unmittelbar, ohne die Art des Verrats über den griechischen Text hinaus genauer festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die scharfe Anklage bleiben erhalten. »Eure Väter« ist bewusst formnah; die weniger bildhafte Alternative wäre »eure Vorfahren«. Der lange griechische Satz wird zur besseren deutschen Verständlichkeit nach »ankündigten« geteilt, ohne die syntaktische Beziehung zu »dem Gerechten« aufzulösen.
