  source_fidelity: 'Der Text gibt die Satzstruktur und die zentralen Bedeutungen zuverlässig wieder: Das temporale Aoristpartizip (»Als er sah«), die unbestimmte und passiv geschädigte Person (»wie jemand Unrecht erlitt«), das Eingreifen zu ihren Gunsten, die zugunsten des Bedrängten vollzogene ἐκδίκησις sowie das Schlagen des Ägypters. »Verschaffte dem Unterdrückten Recht« ist für ἐποίησεν ἐκδίκησιν eine tragfähige, kontextgerechte Wiedergabe; die Fußnote wahrt ausdrücklich den möglichen Vergeltungsakzent. »Schlug« trägt nicht über die unmittelbare Lexik von πατάξας hinaus.'
