id: ACT.7.24
reference: Acts 7:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: de
  text: Als er sah, wie jemand Unrecht erlitt, kam er ihm zu Hilfe und verschaffte dem Unterdrückten Recht[a], indem er den Ägypter schlug[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rächte den Unterdrückten« bzw. »übte Vergeltung für den Unterdrückten«. Der griechische Ausdruck kann Rechtverschaffung, Ahndung oder Vergeltung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »erschlug«. Das griechische Verb bedeutet zunächst »schlagen«; nach dem Zusammenhang hatte der Schlag einen tödlichen Ausgang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: als er sah
  rationale: Das Aoristpartizip wird als temporaler Nebensatz wiedergegeben und bezeichnet den Anlass für Moses’ Eingreifen.
- source_word: τινα ἀδικούμενον
  choice: wie jemand Unrecht erlitt
  rationale: Die Formulierung bewahrt die Unbestimmtheit von τινα und den moralisch-rechtlichen Sinn des passiven ἀδικέω in natürlichem Deutsch.
- source_word: ἠμύνατο
  choice: kam er ihm zu Hilfe
  rationale: Das Medium bezeichnet ein Eingreifen zugunsten des Angegriffenen; diese Wendung ist idiomatisch und lässt die Art der Hilfe zunächst offen.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: verschaffte … Recht
  rationale: Die Wendung kann Vergeltung, Rache oder Rechtverschaffung bezeichnen. Die gewählte Formulierung gibt den Einsatz zugunsten des Unterdrückten wieder, ohne den Vergeltungsaspekt auszuschließen; dieser erscheint in der Fußnote.
- source_word: τῷ καταπονουμένῳ
  choice: dem Unterdrückten
  rationale: Das substantivierte passive Partizip bezeichnet denjenigen, der hart bedrängt oder misshandelt wird; der Dativ wird als begünstigte Person verstanden.
- source_word: πατάξας
  choice: indem er … schlug
  rationale: Das Aoristpartizip beschreibt das Mittel des Eingreifens. πατάσσω bedeutet zunächst „schlagen“; der im weiteren Kontext tödliche Ausgang wird nicht in das Verb selbst eingetragen.
- source_word: τὸν Αἰγύπτιον
  choice: den Ägypter
  rationale: Natürliche Wiedergabe des substantivierten Ethnikons.
theological_decisions:
- issue: Bedeutungsweite von ἐκδίκησις bei Moses’ Tat
  choice: 'Rechtsorientierte Wiedergabe im Haupttext: „verschaffte dem Unterdrückten Recht“'
  alternative: „rächte den Unterdrückten“ oder „übte Vergeltung für den Unterdrückten“
  rationale: Der griechische Ausdruck umfasst Rechtverschaffung, Ahndung und Vergeltung. Der Haupttext vermeidet eine vorschnelle moralische oder lehrmäßige Bewertung von Moses’ Gewalttat; die Fußnote bewahrt den stärkeren Vergeltungssinn.
- issue: Tödlicher Ausgang von πατάξας
  choice: „schlug“
  alternative: „erschlug“
  rationale: Aus Exodus 2 geht der tödliche Ausgang hervor, doch πατάσσω selbst bezeichnet hier wörtlich das Schlagen. Die Übersetzung wahrt diese lexikalische Zurückhaltung und nennt die kontextuelle Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt dem griechischen Handlungsablauf, löst die Partizipien jedoch in gut verständliche deutsche Satzgefüge auf. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Wendungen.
