  terminology: »Unrecht erlitt«, »kam ihm zu Hilfe«, »dem Unterdrückten Recht verschaffte« und »den Ägypter« sind terminologisch angemessen. Die Alternativen in den Fußnoten sind sachlich, nicht konfessionell zugespitzt und erläutern die semantische Spannweite ohne den Haupttext zu überladen.
