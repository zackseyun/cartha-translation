source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: de
  text: 'Sie sagten zu Aaron: »Mach uns Götter[a], die vor uns herziehen! Denn dieser Mose[b], der uns aus dem Land Ägypten herausgeführt hat – wir wissen nicht, was mit ihm geschehen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Götzen«. Im Griechischen steht wörtlich »Götter«; damit wird der Wortlaut des Exodusberichts aufgegriffen und die Forderung des Volkes wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: »Dieser Mose« kann hier distanziert oder geringschätzig klingen.
    reason: discourse_nuance
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: Sie sagten zu Aaron
  rationale: Das Aoristpartizip setzt die zuvor beschriebene Handlung fort und führt den Inhalt der Rede ein. Ein selbstständiger deutscher Satz ist hier natürlicher als eine schwerfällige partizipiale Konstruktion.
- source_word: Ποίησον ἡμῖν
  choice: Mach uns
  rationale: Der Imperativ von ποιέω bedeutet hier direkt „machen“ oder „anfertigen“. „Mach uns“ bewahrt zugleich den Dativ des Interesses.
- source_word: θεοὺς
  choice: Götter
  rationale: θεοί bedeutet wörtlich „Götter“. Obwohl es sich um Götzen handelt, bewahrt „Götter“ den Wortlaut der Exodus-Anspielung und gibt die Behauptung des Volkes wieder, ohne sie im Haupttext auszulegen.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: die vor uns herziehen
  rationale: προπορεύομαι bezeichnet das Vorangehen. „Vor uns herziehen“ passt zum Weg des Volkes und vermeidet die zusätzliche Deutung „uns führen“.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: Denn dieser Mose
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder. Das nachgestellte οὗτος wirkt distanzierend; im Deutschen kann „dieser Mose“ denselben leicht abwertenden Ton tragen.
- source_word: ὃς ἐξήγαγεν ἡμᾶς
  choice: der uns ... herausgeführt hat
  rationale: ἐξάγω bedeutet „hinausführen“ oder „herausführen“. Das deutsche Perfekt ist in direkter Rede natürlich und hält die vollzogene Handlung gegenwärtig.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: aus dem Land Ägypten
  rationale: Die Übersetzung bewahrt das ausdrücklich genannte γῆ „Land“ und gibt die Ausgangsbewegung mit „aus“ wieder.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: wir wissen nicht, was mit ihm geschehen ist
  rationale: Die Formulierung ist idiomatisches, gegenwärtiges Deutsch und entspricht der Bedeutung der Konstruktion mit γίνομαι.
theological_decisions:
- issue: Wiedergabe von θεοὺς im Zusammenhang mit Götzendienst
  choice: Götter
  alternative: Götzen
  rationale: Der griechische Text verwendet das gewöhnliche Wort für „Götter“ und zitiert damit die Forderung des Volkes. „Götzen“ wäre sachlich zutreffend, würde aber bereits im Haupttext eine wertende Deutung an die Stelle des verwendeten Substantivs setzen.
- issue: Möglicher Singularbezug trotz der grammatischen Mehrzahl
  choice: grammatische Mehrzahl „Götter, die“
  alternative: sinngemäßer Singular im Blick auf das goldene Kalb
  rationale: Sowohl θεοὺς als auch das Relativpronomen und Verb stehen im Plural. Die Übersetzung bewahrt diese Form und löst die Spannung zum einzelnen Kalb nicht stillschweigend auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt lebendig; „vor uns herziehen“ passt zum Wüstenzug. Der Gedankenstrich bildet den deutlichen Neuansatz vor „wir wissen nicht“ ab. Alle Fußnotenmarker stehen im Haupttext.
