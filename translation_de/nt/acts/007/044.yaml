  source_fidelity: Der Entwurf gibt die zentralen Begriffe und Beziehungen überwiegend zutreffend wieder. Die satztrennende Formulierung lässt jedoch καθὼς („so/wie“) nicht deutlich als Vergleichsbezug zur Existenz des Zeltes hervortreten. Außerdem geht die Fußnote c über die im Griechischen unausgesprochene Identität des Sprechers hinaus, indem sie Gott bzw. den Herrn als gemeint behauptet.
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. Ein zusammenhängender Satz mit „so wie“ ist zugleich natürlicher im Verhältnis zur griechischen Syntax und eindeutiger im Gedankengang.
  terminology: „Zelt des Zeugnisses“, „Wüste“, „Vorbild“ und „Mose“ sind angemessen. „Stiftshütte des Zeugnisses“ bleibt als hilfreiche traditionelle Alternative in der Fußnote. „Unsere Väter“ bildet die maskuline Form des griechischen Ausdrucks ab; „Vorfahren“ ist eine geeignete Alternative.
