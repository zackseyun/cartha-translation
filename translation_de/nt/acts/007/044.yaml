  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: de
  text: Das Zelt des Zeugnisses[a] war bei unseren Vätern[b] in der Wüste, so wie der, der zu Mose sprach,[c] Mose angewiesen hatte, es nach dem Vorbild anzufertigen, das Mose gesehen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stiftshütte des Zeugnisses“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unseren Vorfahren“. Wörtlich steht im Griechischen „unseren Vätern“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „derjenige, der zu Mose redete“. Der griechische Text nennt den Sprecher hier nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: das Zelt des Zeugnisses
  rationale: „Zelt“ gibt die Grundbedeutung von σκηνή verständlich und anschaulich wieder. Der Genitiv „des Zeugnisses“ bewahrt die biblische Bezeichnung, ohne sie erklärend aufzulösen.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: bei unseren Vätern
  rationale: Der Dativ wird idiomatisch mit „bei“ wiedergegeben. „Unsere Väter“ bewahrt die ausdrücklich männliche Form und den Bezug auf Israels Vorväter.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: Dies ist die natürliche und im biblisch-geografischen Zusammenhang übliche Wiedergabe.
- source_word: διετάξατο
  choice: hatte angeordnet
  rationale: Das Verb bezeichnet eine verbindliche Weisung. „Anordnen“ vermittelt deren Autorität, ohne unnötig zu verschärfen.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: derjenige, der zu Mose sprach
  rationale: Die substantivierte Partizipialkonstruktion wird in natürlichem Deutsch wiedergegeben; der im Griechischen nicht ausdrücklich genannte Sprecher bleibt unbenannt.
- source_word: ποιῆσαι αὐτὴν
  choice: dass Mose es … anfertigen sollte
  rationale: Der vom Zusammenhang geforderte Ausführende des Infinitivs wird für klares Deutsch als Mose genannt. „Anfertigen“ passt zum Bau des Zeltes.
- source_word: κατὰ τὸν τύπον
  choice: nach dem Vorbild
  rationale: „Vorbild“ bezeichnet hier angemessen das Mose gezeigte Muster beziehungsweise Modell, nach dem das Zelt hergestellt werden sollte.
- source_word: ὃν ἑωράκει
  choice: das er gesehen hatte
  rationale: Das Plusquamperfekt gibt die Vorzeitigkeit des Sehens wieder; im deutschen Zusammenhang bezieht sich „er“ auf Mose.
theological_decisions:
- issue: Identität dessen, der zu Mose sprach
  choice: Der Sprecher bleibt als „derjenige, der zu Mose sprach“ unbenannt.
  alternative: „Gott“ oder „der Herr“ ausdrücklich als Sprecher nennen.
  rationale: Der griechische Text setzt die Identität zwar im biblischen Zusammenhang voraus, nennt sie in diesem Vers aber nicht ausdrücklich. Die Übersetzung bewahrt diese Zurückhaltung.
- issue: Subjekt von ἑωράκει
  choice: „er“ wird im Zusammenhang auf Mose bezogen.
  alternative: Die pronominale Mehrdeutigkeit ohne syntaktische Klärung stehen lassen.
  rationale: Mose ist der Empfänger der Anweisung und derjenige, dem das Vorbild gezeigt wurde; die deutsche Satzgestaltung macht diesen natürlichen Bezug erkennbar, ohne zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Text vermeidet das heute wenig transparente „Stiftshütte“ im Haupttext, erhält es aber als traditionelle Alternative in der Fußnote. Die Aufteilung in zwei Sätze sorgt für gute Verständlichkeit, ohne den Gedankengang oder die Beziehung der Satzteile zu verändern.
