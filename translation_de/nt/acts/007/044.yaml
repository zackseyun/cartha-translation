revisions:
- from: Das Zelt des Zeugnisses[a] befand sich bei unseren Vätern[b] in der Wüste. Derjenige, der zu Mose sprach,[c] hatte angeordnet, dass Mose es nach dem Vorbild anfertigen sollte, das er gesehen hatte.
  to: Das Zelt des Zeugnisses[a] war bei unseren Vätern[b] in der Wüste, so wie der, der zu Mose sprach,[c] Mose angewiesen hatte, es nach dem Vorbild anzufertigen, das Mose gesehen hatte.
  rationale: „So wie“ stellt καθὼς ausdrücklich dar und bewahrt den Zusammenhang des griechischen Satzes. Die Wiederholung von „Mose“ macht im Deutschen klar, dass er die Anweisung empfängt und das Vorbild gesehen hat; sie fügt keine inhaltliche Bestimmung des unausgesprochenen Sprechers hinzu. Fußnote c wurde auf eine neutrale Beschreibung der griechischen Offenheit beschränkt.
