source:
  edition: SBLGNT
  text: ἄχρι οὗ ἀνέστη βασιλεὺς ἕτερος ⸂ἐπ’ Αἴγυπτον⸃, ὃς οὐκ ᾔδει τὸν Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/018.yaml
  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: de
  text: bis ein anderer König über Ägypten an die Macht kam[a], der Josef nicht kannte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aufstand“ oder „erstand“. Gemeint sein kann auch: „als Herrscher auftrat“.'
    reason: lexical_alternative
  - marker: b
    text: „Josef nicht kannte“ kann hier auch bedeuten, dass der König Josef nicht anerkannte oder nichts von ihm wissen wollte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: bis
  rationale: Die Wendung bezeichnet die zeitliche Grenze des zuvor geschilderten Zustands. „Bis“ ist im Deutschen natürlich und präzise.
- source_word: ἀνέστη
  choice: an die Macht kam
  rationale: ἀνίστημι bedeutet wörtlich „aufstehen/erstehen“, wird hier aber idiomatisch vom Auftreten beziehungsweise Regierungsantritt eines Königs gebraucht. „An die Macht kam“ gibt diesen Sinn in modernem Deutsch klar wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: βασιλεὺς ἕτερος
  choice: ein anderer König
  rationale: „König“ ist die direkte Entsprechung von βασιλεύς; ἕτερος unterscheidet ihn vom bisherigen Herrscher und wird natürlich mit „ein anderer“ wiedergegeben.
- source_word: ἐπ’ Αἴγυπτον
  choice: über Ägypten
  rationale: ἐπί mit Akkusativ bezeichnet in Verbindung mit dem König die Herrschaft über ein Gebiet. „Über Ägypten“ bewahrt diesen Herrschaftsbezug.
- source_word: οὐκ ᾔδει τὸν Ἰωσήφ
  choice: der Josef nicht kannte
  rationale: Die direkte Bedeutung von οἶδα ist „kennen/wissen“. Die Formulierung lässt offen, ob darüber hinaus fehlende Anerkennung oder Rücksicht gemeint ist; diese mögliche Nuance wird nicht in den Haupttext hineingedeutet.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die idiomatische Haupttextfassung vermeidet das im Deutschen missverständliche „ein König stand auf“, während die Fußnote das griechische Bild und die mögliche Deutung erhält.
