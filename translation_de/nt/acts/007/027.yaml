    issue: „Herrscher“ für ἄρχων ist im Deutschen enger und ranghöher gefärbt.
    rationale: ἄρχων bezeichnet hier einen Autoritätsträger bzw. Leiter, ohne zwingend einen souveränen Herrscherstatus zu behaupten. „Anführer“ ist kontextgemäß und vermeidet diese Überhöhung.
  - severity: low
    issue: „Unrecht tat“ und „stieß ihn weg“ sind weniger idiomatisch als mögliche Alternativen.
    rationale: Die vorgeschlagenen Formulierungen geben den griechischen Sinn nicht falsch wieder, doch „Unrecht zufügte“ und „stieß ihn zurück“ lesen sich im modernen Standarddeutsch flüssiger und erhalten die konkrete wie abweisende Nuance des Verbs.
