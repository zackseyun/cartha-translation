  source_fidelity: Die Satzstruktur und die zentralen Begriffe sind grundsätzlich zutreffend wiedergegeben. ἀδικῶν bezeichnet fortdauerndes bzw. gerade ausgeübtes Unrecht gegenüber dem πλησίον; „seinem Nächsten Unrecht zufügte“ gibt dies idiomatisch wieder. ἀπώσατο ist ein aoristischer, im Kontext konkreter und zugleich abweisender Akt; „stieß ihn zurück“ wahrt diese Doppeldeutigkeit. Die Frage nach einer Einsetzung zum ἄρχων und δικαστής „über uns“ wird vollständig abgebildet.
  naturalness: „Unrecht zufügte“ ist im heutigen Standarddeutsch natürlicher als „Unrecht tat“. „Stieß ihn zurück“ ist eine geläufigere Erzählformulierung als „stieß ihn weg“ und kann sowohl körperliches Zurückdrängen als auch schroffe Abweisung ausdrücken. Die direkte Rede bleibt klar und würdevoll.
  terminology: „Nächsten“ bewahrt πλησίον ohne eine im Wortlaut nicht ausgedrückte Einschränkung auf einen Volksgenossen. „Anführer“ ist für ἄρχων in dieser vorwurfsvollen Frage angemessener als „Herrscher“, das im Deutschen leicht einen monarchisch-souveränen Rang nahelegt. „Richter“ und „über uns“ sind direkte, natürliche Entsprechungen.
