  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: de
  text: 'Doch der Mann, der seinem Nächsten Unrecht zufügte, stieß ihn zurück[a] und sagte: »Wer hat dich zum Anführer und Richter über uns eingesetzt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wies ihn zurück«. Das griechische Verb kann sowohl ein körperliches Zurückstoßen als auch eine entschiedene Zurückweisung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: der seinem Nächsten Unrecht tat
  rationale: Das präsentische Partizip bezeichnet den Mann anhand seines gerade geschehenden ungerechten Handelns. Die deutsche Formulierung gibt den Sinn von ἀδικέω präzise und im Erzählzusammenhang natürlich wieder.
- source_word: πλησίον
  choice: seinem Nächsten
  rationale: »Nächster« bewahrt die übliche lexikalische Bedeutung und legt nicht ausdrücklich fest, dass es sich um einen israelitischen Volksgenossen handelt, obwohl der Kontext dies erkennen lässt.
- source_word: ἀπώσατο
  choice: stieß ihn weg
  rationale: Die Wendung gibt sowohl die konkrete körperliche Bewegung als auch die darin liegende abweisende Haltung wieder.
- source_word: κατέστησεν
  choice: eingesetzt
  rationale: Im Zusammenhang mit einer Autoritätsstellung bezeichnet καθίστημι das Einsetzen in ein Amt; »eingesetzt« ist idiomatisches, gegenwärtiges Deutsch.
- source_word: ἄρχοντα
  choice: Herrscher
  rationale: »Herrscher« bildet die Autoritätsbedeutung direkt ab und bewahrt die Verbindung zur Herrschaft über eine Gruppe.
- source_word: δικαστὴν
  choice: Richter
  rationale: »Richter« ist die direkte und natürliche Entsprechung und bildet zusammen mit »Herrscher« das griechische Begriffspaar ab.
- source_word: ἐφ’ ἡμῶν
  choice: über uns
  rationale: ἐπί mit Genitiv bezeichnet hier die Ausübung von Autorität über die Sprecher; »über uns« bewahrt diese Herausforderung an Moses Befugnis.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Doch« gibt den kontrastierenden Anschluss wieder; »Nächster« erhält den biblisch-lexikalischen Bezug, ohne den Mann über den Kontext hinaus näher zu bestimmen.
