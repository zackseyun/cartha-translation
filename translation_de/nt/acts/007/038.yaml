id: ACT.7.38
reference: Acts 7:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: de
  text: Er ist es, der in der Versammlung[a] in der Wüste war, zusammen mit dem Engel, der auf dem Berg Sinai zu ihm sprach, und mit unseren Vätern[b]. Er empfing lebendige Gottessprüche[c], um sie uns weiterzugeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gemeinde«; traditionell: »Kirche in der Wüste«.'
    reason: alternative_reading
  - marker: b
    text: Mit »unseren Vätern« sind die Vorfahren Israels gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »lebendige Worte«; auch möglich: »lebensspendende Gottessprüche«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: Versammlung
  rationale: Bezeichnet hier das versammelte Israel in der Wüste und vermeidet, die später institutionell geprägte Bedeutung von „Kirche“ in den Text einzutragen.
- source_word: ἐρήμῳ
  choice: Wüste
  rationale: Entspricht dem biblischen Schauplatz der Wüstenwanderung und ist im Deutschen die geläufige Wiedergabe.
- source_word: ἀγγέλου
  choice: Engel
  rationale: Im Sinai-Kontext ist ein himmlischer Bote gemeint; „Engel“ gibt dies unmittelbar wieder.
- source_word: λαλοῦντος
  choice: der … zu ihm sprach
  rationale: Die Relativsatzkonstruktion ist natürliches Deutsch; das griechische Partizip bezeichnet den Engel als den zu Mose Redenden.
- source_word: ὄρει Σινᾶ
  choice: Berg Sinai
  rationale: Geläufige deutsche Bezeichnung des Ortes.
- source_word: πατέρων ἡμῶν
  choice: unseren Vätern
  rationale: Bewahrt die ausdrücklich maskuline und traditionsgeschichtlich geprägte Bezeichnung für Israels Vorväter; eine Fußnote erläutert den Bezug.
- source_word: ἐδέξατο
  choice: empfing
  rationale: Passt zu Mose als Empfänger göttlicher Offenbarung und gibt den Vorgang präzise wieder.
- source_word: λόγια
  choice: Gottessprüche
  rationale: λόγια meint hier göttliche Aussprüche, nicht gewöhnliche Worte. „Gottessprüche“ macht den Offenbarungscharakter im modernen Deutsch verständlich.
- source_word: ζῶντα
  choice: lebendige
  rationale: Bewahrt die bildhafte und theologisch offene Aussage des griechischen Textes, ohne sie auf „lebensspendend“ festzulegen.
- source_word: δοῦναι
  choice: um sie … weiterzugeben
  rationale: Gibt die Zweckrichtung des Infinitivs wieder und macht deutlich, dass Mose das Empfangene dem Volk übermitteln sollte.
- source_word: ἡμῖν
  choice: uns
  rationale: Bewahrt Stephanus’ Identifikation seiner Zuhörer und seiner selbst mit Israels Bundesgeschichte.
- source_word: ὁ γενόμενος
  choice: der … war
  rationale: Idiomatiche deutsche Wiedergabe der Identifizierung Moses als desjenigen, der sich in dieser geschichtlichen Situation befand.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία für Israel in der Wüste
  choice: Versammlung
  alternative: Gemeinde; Kirche
  rationale: „Versammlung“ bezeichnet das versammelte Israel, ohne eine spätere kirchliche Institution vorauszusetzen. „Gemeinde“ bleibt als mögliche Übersetzung in der Fußnote erhalten.
- issue: Deutung von λόγια ζῶντα
  choice: lebendige Gottessprüche
  alternative: lebendige Worte; lebensspendende Gottessprüche
  rationale: Die gewählte Form bewahrt sowohl den Charakter als göttliche Aussprüche als auch die offene Metapher „lebendig“, statt sie ausschließlich kausal als „lebensspendend“ auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, wird jedoch zur besseren Verständlichkeit in zwei Sätze gegliedert. „Weiterzugeben“ klingt im Deutschen natürlicher als ein bloßes „zu geben“ und wahrt die Mittlerrolle Moses.
