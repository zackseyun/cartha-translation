id: ACT.7.32
reference: Acts 7:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: de
  text: »Ich bin der Gott deiner Väter, der Gott Abrahams, Isaaks und Jakobs.« Da wurde Mose von Furcht ergriffen und wagte nicht, genauer hinzusehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »es genauer zu betrachten« beziehungsweise »es aufmerksam zu prüfen«. Das griechische Verb kann sowohl genaues Hinsehen als auch eingehendes Betrachten oder Erwägen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς τῶν πατέρων σου
  choice: Ich bin der Gott deiner Väter
  rationale: Die im Griechischen verblose Identifikationsformel erfordert im Deutschen die Ergänzung von »bin«. Das betonte Ἐγώ wird durch das ausdrückliche »Ich« bewahrt; »Väter« erhält den konkreten und bundestheologischen Klang von πατέρων.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: der Gott Abrahams, Isaaks und Jakobs
  rationale: Die Genitivformen sind im Deutschen eine natürliche und zugleich feierliche Wiedergabe. Die Aufzählung bleibt vollständig, ohne ein unnatürlich schweres mehrfaches »und«.
- source_word: ἔντρομος δὲ γενόμενος
  choice: Da wurde Mose von Furcht ergriffen
  rationale: ἔντρομος bezeichnet starke Furcht und kann auch das Zittern einschließen. Die finite deutsche Form gibt den Eintritt in diesen Zustand, den das Aoristpartizip ausdrückt, idiomatisch wieder.
- source_word: οὐκ ἐτόλμα
  choice: wagte nicht
  rationale: Die Wendung entspricht dem Sinn von τολμάω und ist in modernem Deutsch knapp und natürlich.
- source_word: κατανοῆσαι
  choice: genauer hinzusehen
  rationale: Im Zusammenhang mit der Erscheinung bezeichnet das Verb ein aufmerksames, eingehendes Betrachten; »genauer hinsehen« bewahrt den visuellen Sinn, ohne die ebenfalls mögliche Bedeutung des prüfenden Betrachtens auszuschließen.
theological_decisions:
- issue: Göttliche Selbstvorstellung im Exodus-Zitat
  choice: Ich bin der Gott deiner Väter
  alternative: Ich, der Gott deiner Väter
  rationale: Obwohl der griechische Wortlaut nach Ἐγώ kein ausdrückliches Verb enthält, ist »Ich bin« die natürliche deutsche Identifikationsformel. Sie gibt die Aussage wieder, ohne darüber hinaus eine besondere dogmatische Deutung von Ἐγώ einzutragen.
- issue: Bezeichnung der Vorfahren Moses
  choice: Väter
  alternative: Vorfahren
  rationale: »Väter« wahrt die konkrete Formulierung und den schriftsprachlich-biblischen Resonanzraum; das allgemeinere »Vorfahren« wäre verständlich, würde aber die väterliche Linie nivellieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt feierlich, während Moses Reaktion natürlich und klar formuliert ist. Der einzige Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wiedergabe von κατανοῆσαι.
