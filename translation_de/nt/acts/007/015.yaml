  terminology: „Jakob“, „Ägypten“, „starb“ und „unsere Väter“ sind angemessen. Die Fußnote erläutert die mögliche idiomatischere Alternative „Vorfahren“, ohne den im Grundtext bewahrten maskulinen und heilsgeschichtlich bestimmten Ausdruck „Väter“ zu nivellieren.
