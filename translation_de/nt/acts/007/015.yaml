  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: de
  text: Und Jakob zog nach Ägypten hinab. Er starb, ebenso unsere Väter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Vorfahren“. Das Griechische lautet wörtlich „unsere Väter“ und bezeichnet hier die Vorväter Israels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: zog … hinab
  rationale: Bewahrt die Richtungsangabe von καταβαίνω und entspricht der im Deutschen verständlichen geografischen Redeweise für die Reise nach Ägypten.
- source_word: Ἰακώβ
  choice: Jakob
  rationale: Verwendet die im Deutschen übliche biblische Namensform.
- source_word: εἰς Αἴγυπτον
  choice: nach Ägypten
  rationale: Gibt die Bewegung zum Zielort im natürlichen Deutschen wieder; die Verbindung mit „hinab“ bewahrt die volle Bewegungsbedeutung.
- source_word: ἐτελεύτησεν
  choice: starben
  rationale: τελευτάω bezeichnet hier direkt das Sterben. Der deutsche Plural ist wegen des zusammengesetzten Subjekts „er und unsere Väter“ grammatisch erforderlich.
- source_word: αὐτὸς
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und bezeichnet Jakob.
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Väter
  rationale: Bewahrt die wörtliche und heilsgeschichtliche Bezeichnung für Israels Vorväter; eine Fußnote nennt die im Deutschen mögliche verständlichere Alternative.
theological_decisions:
- issue: Wiedergabe von πατέρες in Israels Ahnengeschichte
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die maskuline Bezeichnung des Ausgangstextes verweist in Stephanus’ Rede auf Israels Stammväter und wird daher nicht stillschweigend verallgemeinert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufteilung in zwei Sätze und das ergänzte „Dort“ machen den Bezug des Sterbens auf Ägypten natürlich verständlich, ohne den Aussagegehalt zu verändern.
