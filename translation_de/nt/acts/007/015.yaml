  source_fidelity: Die Wiedergabe von κατέβη mit „zog ... hinab“ sowie von „unsere Väter“ ist grundsätzlich treffend. Die Formulierung „Dort starben er und unsere Väter“ fasst jedoch zwei im Griechischen getrennt dargestellte Aussagen zu einem gemeinsamen Pluralsubjekt zusammen und kann dadurch nahelegen, Jakob und die Väter seien gemeinsam beziehungsweise in derselben Situation gestorben. Das griechische Singularverb bei αὐτός hebt zunächst Jakobs Tod hervor; die Väter werden anschließend hinzugefügt.
