id: ACT.7.46
reference: Acts 7:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: de
  text: Der fand Gunst vor Gott und bat darum, eine Wohnstätte für den Gott Jakobs[a] zu finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Stiftshütte für den Gott Jakobs“.'
    reason: Lexikalische Alternative für σκήνωμα.
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: fand Gunst
  rationale: Die feste Wendung bezeichnet, dass jemand Wohlwollen erlangt; „Gunst finden“ ist im Deutschen idiomatisch und bewahrt den relationalen Sinn.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: ἐνώπιον mit Genitiv bedeutet „vor“ beziehungsweise „in den Augen von“; „vor Gott“ ist knapp, natürlich und textnah.
- source_word: ᾐτήσατο
  choice: bat darum
  rationale: Die mediale Form bezeichnet das Vorbringen einer Bitte. „bat darum“ verbindet sich im Deutschen natürlich mit dem folgenden Infinitiv.
- source_word: εὑρεῖν
  choice: zu finden
  rationale: Die Wiedergabe wahrt den ausdrücklichen Wortlaut des Infinitivs, auch wenn im Kontext das Erlangen oder Bereitstellen einer Wohnstätte gemeint sein kann.
- source_word: σκήνωμα
  choice: eine Wohnstätte
  rationale: Das Wort bezeichnet allgemein einen Wohn- oder Aufenthaltsort. „Wohnstätte“ ist würdig und verständlich, ohne die Art des geplanten Bauwerks vorschnell als Stiftshütte oder Tempel festzulegen.
- source_word: τῷ θεῷ Ἰακώβ
  choice: für den Gott Jakobs
  rationale: Der Dativ wird hier natürlich mit „für“ wiedergegeben; „der Gott Jakobs“ bewahrt die vertraute biblische Bundesformel.
theological_decisions:
- issue: Art der von David erbetenen Stätte
  choice: „Wohnstätte“ als weiter Begriff
  alternative: „Stiftshütte“ oder „Haus“
  rationale: 'σκήνωμα ist weiter als eine technische Bezeichnung für Stiftshütte oder Tempel. Die Übersetzung hält die Spannung der Erzählung offen: David wünscht eine Stätte für Gott, während erst Salomo im nächsten Vers das Haus baut.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die relativische Anknüpfung „Der fand“ entspricht dem fortlaufenden Satzbau der Rede. „Wohnstätte“ vermeidet eine konfessionell oder sachlich zu enge Festlegung.
