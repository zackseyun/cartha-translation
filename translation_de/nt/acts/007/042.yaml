id: ACT.7.42
reference: Acts 7:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: de
  text: 'Doch Gott wandte sich ab und gab sie dahin, dem Heer des Himmels zu dienen[a][b], wie im Buch der Propheten[c] geschrieben steht: »Habt ihr mir etwa vierzig Jahre lang in der Wüste Schlachtopfer und Opfergaben dargebracht, Haus Israel?[d]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „anzubeten“. Das griechische Verb kann religiösen Dienst oder Anbetung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Das Heer des Himmels“ ist eine biblische Bezeichnung für die Himmelskörper und darüber hinaus für die himmlischen Mächte, die mit ihnen in götzendienerischer Verehrung verbunden wurden.
    reason: cultural_note
  - marker: c
    text: 'Oder: „in der Schriftrolle der Propheten“.'
    reason: lexical_alternative
  - marker: d
    text: Zitat aus Amos 5,25.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστρεψεν
  choice: wandte sich ab
  rationale: Mit Gott als Subjekt und zusammen mit dem folgenden Gerichtshandeln bezeichnet das Verb hier nicht bloß eine Wendung, sondern den Entzug seiner Zuwendung.
- source_word: παρέδωκεν
  choice: gab sie dahin
  rationale: Die Wendung bewahrt den Gedanken eines richterlichen Preisgebens, ohne Gott zum Urheber des Götzendienstes zu machen.
- source_word: λατρεύειν
  choice: zu dienen
  rationale: Das Verb bezeichnet religiösen oder kultischen Dienst und kann auch mit „anzubeten“ wiedergegeben werden; „dienen“ hält den Bedeutungsumfang offen.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: dem Heer des Himmels
  rationale: Die wörtlich-nahe biblische Wendung lässt offen, ob vor allem Himmelskörper oder mit ihnen verbundene himmlische Mächte gemeint sind.
- source_word: καθὼς γέγραπται
  choice: wie ... geschrieben steht
  rationale: Dies ist eine natürliche deutsche Wiedergabe der üblichen Schriftzitat-Formel.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: im Buch der Propheten
  rationale: „Buch“ ist im modernen Deutsch verständlich; das griechische Wort kann im historischen Kontext auch eine Schriftrolle bezeichnen.
- source_word: Μὴ
  choice: Habt ihr mir etwa ...?
  rationale: Die mit μή eingeleitete rhetorische Frage erwartet eine verneinende Antwort; „etwa“ macht diese Erwartung im Deutschen hörbar, ohne die Frage in eine Aussage umzuwandeln.
- source_word: σφάγια καὶ θυσίας
  choice: Schlachtopfer und Opfergaben
  rationale: „Schlachtopfer“ erhält den Hinweis auf geschlachtete Opfertiere; „Opfergaben“ gibt den allgemeineren kultischen Ausdruck wieder, ohne eine im Griechischen nicht genannte Opferart festzulegen.
- source_word: προσηνέγκατέ μοι
  choice: mir ... dargebracht
  rationale: „Darbringen“ ist im Deutschen die natürliche kultische Entsprechung und gibt den Dativ μοι ausdrücklich mit „mir“ wieder.
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: vierzig Jahre lang in der Wüste
  rationale: Diese Formulierung gibt Dauer und Ort idiomatisch sowie vollständig wieder.
theological_decisions:
- issue: Göttliches Handeln im Gericht
  choice: Gott „wandte sich ab und gab sie dahin“
  alternative: Gott erlaubte den Götzendienst lediglich; oder Gott zwang sie aktiv dazu
  rationale: Die verbundenen Verben stellen Gottes Handeln als Gericht auf vorausgehende Auflehnung dar. Die Formulierung wahrt das aktive richterliche Preisgeben, ohne Gott als positiven Urheber ihrer Sünde darzustellen.
- issue: Bedeutung des „Heeres des Himmels“
  choice: Die traditionelle biblische Wendung bleibt im Haupttext stehen
  alternative: ausschließlich die Sterne; oder ausschließlich Engel
  rationale: Der Ausdruck kann Himmelskörper und darüber hinaus die mit ihnen verbundenen himmlischen Mächte bezeichnen. Eine engere Festlegung würde die echte Bedeutungsbreite des Textes unnötig auflösen.
- issue: Rhetorische Frage im Amos-Zitat
  choice: Die Frage wird mit „etwa“ als eine verneinende Antwort erwartend wiedergegeben
  alternative: eine neutrale Informationsfrage; oder die ausdrückliche Aussage, Israel habe keine Opfer dargebracht
  rationale: μή markiert die erwartete Verneinung, während die Frageform und damit die Spannung des prophetischen Vorwurfs erhalten bleiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Gab sie dahin“ ist bewusst etwas gehoben, bleibt aber verständlich und trägt den richterlichen Ernst von παρέδωκεν. Die rhetorische Frage und die begriffliche Offenheit bei „dienen“ sowie „Heer des Himmels“ bleiben erhalten.
