  source_fidelity: 'Der Entwurf gibt den griechischen Text vollständig und präzise wieder: Gottes Abwendung und richterliches Preisgeben (ἔστρεψεν ... παρέδωκεν), der kultische Dienst für das „Heer des Himmels“, die Schriftzitatformel sowie die rhetorische, auf Verneinung zielende Frage des Amos-Zitats. „Schlachtopfer und Opfergaben“ bildet σφάγια καὶ θυσίας angemessen ab, und „mir ... dargebracht“ wahrt μοι.'
  naturalness: Das Deutsch ist modernes Standarddeutsch mit bewusst würdig-biblischem Register. „Gab sie dahin“ und „Haus Israel“ sind leicht gehoben, aber im Kontext eines prophetischen Zitats verständlich und stilistisch passend. Die Wortstellung und Interpunktion sind natürlich.
