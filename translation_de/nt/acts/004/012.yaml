id: ACT.4.12
reference: Acts 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: de
  text: Und in keinem anderen ist die Rettung; denn unter dem Himmel ist kein anderer Name unter den Menschen gegeben, durch den wir gerettet werden müssen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: Rettung
  rationale: „Rettung“ gibt die Grundbedeutung im Deutschen natürlich wieder und bewahrt sowohl den unmittelbaren Gedanken des Gerettetwerdens als auch die theologische Tragweite im Zusammenhang.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: in keinem anderen
  rationale: Die Formulierung bewahrt die personale und exklusive Aussage des Griechischen sowie dessen ἐν-Konstruktion, ohne sie vorschnell rein instrumental aufzulösen.
- source_word: ὄνομα
  choice: Name
  rationale: „Name“ bleibt als biblisch geprägter Ausdruck erhalten und kann Person, Vollmacht und offenbarte Identität mitschwingen lassen, ohne diese Bedeutungsfülle auszudeuten.
- source_word: ἕτερον
  choice: anderer
  rationale: In der verneinten Wendung ist „kein anderer Name“ die natürliche deutsche Entsprechung und erhält den Ausschließlichkeitsanspruch.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: unter dem Himmel
  rationale: Die feste biblische Wendung wahrt den weltweiten Bezugsrahmen und den feierlichen Ton des Ausgangstextes.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: unter den Menschen gegeben
  rationale: „Unter den Menschen“ gibt das generische ἀνθρώποις inklusiv und im heutigen Standarddeutsch verständlich wieder; „gegeben“ bleibt eng beim Partizip und bezieht sich auf „Name“.
- source_word: ἐν ᾧ
  choice: durch den
  rationale: Das Relativpronomen bezieht sich auf „Name“. „Durch den“ drückt im Deutschen die hier naheliegende vermittelnde beziehungsweise instrumentale Bedeutung natürlich aus.
- source_word: δεῖ
  choice: müssen
  rationale: „Müssen“ bewahrt die im griechischen δεῖ ausgedrückte Notwendigkeit knapp und deutlich.
- source_word: σωθῆναι
  choice: gerettet werden
  rationale: Die passive Form wird unmittelbar wiedergegeben und stellt die sprachliche Verbindung zu „Rettung“ her.
theological_decisions:
- issue: Ausschließlichkeit der Rettung in Jesus
  choice: „In keinem anderen ist die Rettung“
  alternative: „Es gibt keinen anderen Weg zur Rettung“
  rationale: Der griechische Text spricht ausdrücklich von keinem anderen und nicht abstrakt von keinem anderen Weg. Die personale Ausschließlichkeit bleibt daher unverändert stehen, ohne zusätzliche dogmatische Erklärung.
- issue: Bezug und Bedeutung von ἐν ᾧ
  choice: „durch den wir gerettet werden müssen“
  alternative: „in dem wir gerettet werden müssen“
  rationale: „Durch den“ ist idiomatisches Deutsch und macht den Namen als vermittelnden Bezug der Rettung verständlich. Die reiche biblische Bedeutung von „Name“ bleibt dennoch erhalten.
- issue: Generischer Umfang von ἀνθρώποις
  choice: „unter den Menschen“
  alternative: „der Menschheit gegeben“
  rationale: Das griechische Wort bezeichnet hier Menschen allgemein. Die gewählte Form ist geschlechtsübergreifend, quellennah und vermeidet eine unnötige Einschränkung auf Männer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Die Satzstruktur folgt dem argumentativen Aufbau des Griechischen; „denn ... auch“ gibt οὐδὲ γάρ in natürlicher deutscher Reihenfolge wieder. Keine Fußnote ist nötig, da „Menschen“ die generische Bedeutung von ἀνθρώποις unmittelbar und eindeutig ausdrückt.
