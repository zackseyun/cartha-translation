  to: Und in keinem anderen ist die Rettung; denn unter dem Himmel ist kein anderer Name unter den Menschen gegeben, durch den wir gerettet werden müssen.
  rationale: Die Umstellung von „unter dem Himmel“ vor „kein anderer Name“ beseitigt die störende Wiederholung zweier direkt aufeinanderfolgender „unter“-Gruppen. Sie erhält den Umfang von „unter dem Himmel“, die Aussage, dass der Name unter den Menschen gegeben ist, sowie die exklusive und notwendige Rettungsaussage.
