  source_fidelity: '„Da“ gibt τότε angemessen als erzählerischen Anschluss wieder. „erfüllt vom Heiligen Geist“ trifft das aoristische Passivpartizip πλησθείς sowie πνεύματος ἁγίου idiomatisch und sachlich. „führenden Männer“ ist jedoch weniger genau: ἄρχοντες bezeichnet Amtsträger bzw. Oberste; „Männer“ steht nicht im griechischen Text und kann die Anrede unnötig einengen.'
  naturalness: Die Satzstellung ist natürlich und würdevoll. Da die Anrede im griechischen Satz über den Vers hinaus weitergeführt wird, ist ein Komma statt eines Ausrufezeichens am Versende sachgerechter.
  terminology: „Petrus“, „Heiliger Geist“ und „Älteste“ sind etablierte, kontextgerechte Bezeichnungen. „Oberste des Volkes“ gibt die institutionell-öffentliche Funktion von ἄρχοντες präziser wieder als „führende Männer“.
  issues:
