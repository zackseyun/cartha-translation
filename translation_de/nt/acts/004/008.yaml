  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: de
  text: 'Da sagte Petrus, erfüllt vom Heiligen Geist, zu ihnen: »Ihr Obersten des Volkes und Ältesten,«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Leitet als natürlicher deutscher Erzählanschluss das unmittelbar folgende Geschehen ein.
- source_word: Πέτρος
  choice: Petrus
  rationale: Im Deutschen etablierte biblische Namensform.
- source_word: πλησθεὶς
  choice: erfüllt
  rationale: Das passive Partizip von πίμπλημι wird knapp und idiomatisch wiedergegeben; Petrus empfängt die Erfüllung.
- source_word: πνεύματος ἁγίου
  choice: vom Heiligen Geist
  rationale: Nach »erfüllt« ist dies im Deutschen eine natürliche Wiedergabe des Genitivs; sie bezeichnet hier den Heiligen Geist, ohne das Bild der Erfüllung aufzugeben.
- source_word: εἶπεν πρὸς αὐτούς
  choice: sagte … zu ihnen
  rationale: Direkte und natürliche Wiedergabe der griechischen Redeformel.
- source_word: Ἄρχοντες τοῦ λαοῦ
  choice: ihr führenden Männer des Volkes
  rationale: Bezeichnet die Männer mit leitender beziehungsweise obrigkeitlicher Stellung. Die Anrede mit »ihr« klingt im modernen Deutschen natürlich und würdevoll.
- source_word: πρεσβύτεροι
  choice: ihr Ältesten
  rationale: Bezeichnet in diesem institutionellen Zusammenhang anerkannte Älteste, nicht lediglich ältere Männer.
theological_decisions:
- issue: Bezug von πνεύματος ἁγίου
  choice: Heiliger Geist
  alternative: heiliger Geist
  rationale: Im Kontext der Apostelgeschichte ist der persönliche göttliche Geist gemeint, der Petrus zum Zeugnis befähigt; die Großschreibung kennzeichnet diesen Bezug, ohne zusätzliche Aussage einzutragen.
- issue: Kraft der Passivform πλησθεὶς
  choice: erfüllt vom Heiligen Geist
  alternative: voll Heiligen Geistes
  rationale: »Erfüllt« bewahrt den empfangenden, passiven Sinn der griechischen Form. »Voll Heiligen Geistes« wäre möglich, könnte aber eher einen Zustand als das vorausgesetzte göttliche Wirken hervorheben.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Anrede wird im Deutschen durch wiederholtes »ihr« klar markiert. Keine Fußnoten erforderlich.
