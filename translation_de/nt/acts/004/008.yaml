    issue: „führenden Männer des Volkes“ für Ἄρχοντες τοῦ λαοῦ
    rationale: Die Wiedergabe fügt mit „Männer“ ein im Ausgangstext nicht ausgedrücktes Element hinzu und schwächt den amtlichen Sinn von ἄρχοντες. „Oberste des Volkes“ ist näher am griechischen Ausdruck und im modernen gehobenen Bibeldeutsch verständlich.
  - severity: low
    issue: Ausrufezeichen am Ende der fortlaufenden Anrede
    rationale: Die Anrede wird in den folgenden Versen syntaktisch fortgesetzt. Ein Komma bildet diesen Zusammenhang ab, ohne eine abgeschlossene Ausrufeeinheit zu erzeugen.
