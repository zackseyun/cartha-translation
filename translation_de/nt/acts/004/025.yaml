  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: de
  text: 'der[a] durch den Heiligen Geist, durch den Mund unseres Vaters David, deines Dieners, gesagt hat: »Warum tobten die Nationen, und die Völker ersannen Nichtiges?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lassen „unseres Vaters“ aus; dann lautet die Einleitung: „der durch den Heiligen Geist, durch den Mund Davids, deines Dieners, gesagt hat“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „und die Völker sannen über Nichtiges nach“. Das griechische Verb kann „nachsinnen“ bedeuten, hier im Zusammenhang aber auch „ersinnen“ oder „Pläne schmieden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: der
  rationale: Das substantivierte ὁ stellt den Relativanschluss an Gott in Vers 24 her. Die textkritisch unsichere Wendung τοῦ πατρὸς ἡμῶν wird nicht in den Haupttext gezwungen, sondern in Fußnote [a] dokumentiert.
- source_word: διὰ πνεύματος ἁγίου
  choice: durch den Heiligen Geist
  rationale: διά mit Genitiv bezeichnet hier Mittel beziehungsweise vermittelnde Urheberschaft; die deutsche Formulierung bewahrt den ausdrücklichen Bezug auf den Geist.
- source_word: στόματος Δαυὶδ
  choice: aus dem Mund ... Davids
  rationale: Die biblische Redeweise bezeichnet David als menschlichen Sprecher prophetischer Worte. „Aus dem Mund“ ist im Deutschen natürlich und erhält das Bild des griechischen Ausdrucks.
- source_word: παιδός σου
  choice: deines Dieners
  rationale: παῖς kann Kind oder Diener bedeuten; bei David in dieser Zitationsformel entspricht „Diener“ dem sachlichen und alttestamentlichen Kontext.
- source_word: εἰπών
  choice: gesagt hat
  rationale: Das Aoristpartizip führt das Zitat ein und wird im deutschen Relativsatz idiomatisch als finites Verb wiedergegeben.
- source_word: Ἱνατί
  choice: Warum
  rationale: Direkte und natürliche Wiedergabe der Frageeinleitung.
- source_word: ἐφρύαξαν
  choice: tobten
  rationale: Das Verb bezeichnet aufbrausende, trotzige Erregung. „Tobten“ gibt das anschaulich wieder, ohne den Sinn auf bloßen Zorn zu verengen.
- source_word: ἔθνη
  choice: die Nationen
  rationale: Im Psalmzitat sind allgemein die Nationen gemeint, nicht ausschließlich Nichtjuden als religiöse Kategorie.
- source_word: λαοὶ
  choice: die Völker
  rationale: Der Plural und der poetische Parallelismus zu „Nationen“ bleiben erhalten.
- source_word: ἐμελέτησαν
  choice: ersannen
  rationale: Im feindseligen Kontext bedeutet das sonst auch für Nachsinnen verwendete Verb ein planendes Ausdenken; „ersannen“ bewahrt den gehobenen Psalmton.
- source_word: κενά
  choice: Nichtiges
  rationale: Das substantivierte Adjektiv bezeichnet Leeres, Vergebliches oder Wirkungsloses. „Nichtiges“ bewahrt die knappe, bewusst offene Ausdrucksweise.
theological_decisions:
- issue: Textgestalt der Einleitung zum Zitat
  choice: Im Haupttext steht lediglich der Relativanschluss „der“; die unsichere Wendung „unseres Vaters“ wird in Fußnote [a] geboten.
  alternative: „der durch den Heiligen Geist aus dem Mund unseres Vaters David, deines Dieners, gesagt hat“
  rationale: Die überlieferte Wendung τοῦ πατρὸς ἡμῶν ist textkritisch umstritten und steht in der SBLGNT-Fassung syntaktisch schwierig. Der Haupttext bleibt lesbar, während die Variante transparent dokumentiert wird.
- issue: Bedeutung von ἐμελέτησαν
  choice: „ersannen“ im Haupttext, mit „sannen über Nichtiges nach“ als Fußnotenalternative
  alternative: „sannen über Nichtiges nach“
  rationale: Der unmittelbare Konfliktkontext legt planendes Ausdenken nahe; zugleich darf die lexikalisch mögliche Bedeutung des Nachsinnens nicht verdeckt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Ton, der dem Psalmzitat entspricht. Die Versform schließt syntaktisch an Apostelgeschichte 4,24 an. Alle Fußnotenmarker stehen im Haupttext.
