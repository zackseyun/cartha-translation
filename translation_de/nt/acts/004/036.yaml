id: ACT.4.36
reference: Acts 4:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: de
  text: 'Josef aber, der von den Aposteln Barnabas genannt wurde – das heißt übersetzt: Sohn der Ermutigung[a] –, war ein Levit und stammte aus Zypern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sohn der Ermahnung«, »Sohn des Zuspruchs« oder »Sohn des Trostes«. Das griechische Wort kann Ermutigung, eindringliches Zureden oder Trost bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: Im modernen deutschen Bibelgebrauch etablierte Form des Personennamens.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten Übergang beziehungsweise hebt Josef als konkretes Beispiel aus dem vorangehenden Bericht hervor, ohne einen starken Gegensatz auszudrücken.
- source_word: ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: der von den Aposteln Barnabas genannt wurde
  rationale: Gibt die Benennung und ihren Ursprung bei den Aposteln klar und ohne das im Griechischen nicht ausgedrückte »auch« wieder.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: das heißt übersetzt
  rationale: Natürliche deutsche Wiedergabe der ausdrücklich erklärenden Übersetzung des Namens.
- source_word: υἱὸς παρακλήσεως
  choice: Sohn der Ermutigung
  rationale: Bewahrt die semitische Namensformel und gibt παράκλησις mit einem breiten, verständlichen deutschen Begriff wieder; weitere mögliche Nuancen stehen in der Fußnote.
- source_word: Λευίτης
  choice: ein Levit
  rationale: Direkte und geläufige Wiedergabe der Stammes- und Religionszugehörigkeit.
- source_word: Κύπριος τῷ γένει
  choice: stammte aus Zypern
  rationale: Gibt die Herkunftsangabe idiomatisch wieder, ohne enger zwischen Geburtsort und Abstammung zu entscheiden.
theological_decisions:
- issue: Bedeutung von παρακλήσεως in der Namenserklärung
  choice: Ermutigung
  alternative: Ermahnung, Zuspruch oder Trost
  rationale: Das Wort umfasst sowohl ermunterndes oder mahnendes Zureden als auch tröstenden Zuspruch. Der Haupttext verwendet einen breiten, heutigen Ausdruck; die Fußnote bewahrt die echte Bedeutungsweite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wird gegenüber der griechischen Appositionsfolge leicht gegliedert, damit er als vollständiger deutscher Satz natürlich verständlich ist. Die Gedankenstriche markieren die eingeschobene Namenserklärung.
