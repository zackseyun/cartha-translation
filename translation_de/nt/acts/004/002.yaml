id: ACT.4.2
reference: Acts 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: de
  text: Sie waren sehr aufgebracht, weil sie das Volk lehrten und in Jesus die Auferstehung von den Toten verkündeten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Beispiel Jesu die Auferstehung von den Toten verkündeten“. Die griechische Wendung „in Jesus“ kann besonders darauf hinweisen, dass die Auferstehung an Jesu eigener Auferweckung sichtbar geworden ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: sehr aufgebracht
  rationale: Das Partizip bezeichnet starke Verärgerung oder Erregung. „Sehr aufgebracht“ gibt die Intensität natürlich wieder, ohne die Gefühlslage unnötig zuzuspitzen.
- source_word: διὰ τὸ διδάσκειν
  choice: weil sie … lehrten
  rationale: διά mit substantiviertem Infinitiv drückt hier den Grund aus; ein deutscher weil-Satz ist klar und idiomatisch.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor genannten Handelnden und wird ohne interpretierende Konkretisierung wiedergegeben.
- source_word: τὸν λαὸν
  choice: das Volk
  rationale: λαός bezeichnet hier das Volk als Gesamtheit, nicht lediglich eine zufällige Menschenmenge.
- source_word: καταγγέλλειν
  choice: verkündeten
  rationale: Das Verb bezeichnet öffentliches Bekanntmachen beziehungsweise Verkündigen und passt zum feierlich-sachlichen Register.
- source_word: ἐν τῷ Ἰησοῦ
  choice: in Jesus
  rationale: Die direkte Wiedergabe bewahrt die Offenheit der griechischen Präpositionalphrase zwischen einer auf Jesus bezogenen, an ihm sichtbar gewordenen oder durch ihn vermittelten Auferstehung.
- source_word: ἀνάστασιν
  choice: die Auferstehung
  rationale: Der bestimmte Artikel und der theologisch gewichtige Begriff werden im Deutschen sachgerecht mit „die Auferstehung“ wiedergegeben.
- source_word: τὴν ἐκ νεκρῶν
  choice: von den Toten
  rationale: Die Wendung bezeichnet die Auferstehung aus dem Bereich beziehungsweise aus der Mitte der Toten; „von den Toten“ ist die natürliche deutsche Formulierung.
theological_decisions:
- issue: Bedeutung von ἐν τῷ Ἰησοῦ in der Auferstehungsverkündigung
  choice: Die Formulierung bleibt als „in Jesus“ transparent und deutungsoffen.
  alternative: „am Beispiel Jesu“, „durch Jesus“ oder „im Fall Jesu“
  rationale: ἐν kann hier mehrere eng verwandte Nuancen tragen. Die Hauptfassung legt nicht fest, ob vor allem Jesu eigene Auferstehung, die in ihm erwiesene Auferstehung oder seine vermittelnde Rolle gemeint ist.
- issue: Umfang der Wendung „die Auferstehung von den Toten“
  choice: Die Fassung lässt sowohl Jesu Auferstehung als auch die in ihm begründete umfassendere Auferstehungshoffnung anklingen.
  alternative: Ausschließlicher Bezug entweder auf Jesu eigene Auferstehung oder auf die allgemeine künftige Auferstehung
  rationale: Der griechische Wortlaut kann im Kontext beide Horizonte verbinden; die Übersetzung verengt ihn nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sehr aufgebracht“ ist verständlich und bringt die starke Verärgerung der Obrigkeit zum Ausdruck; die ungewöhnliche, aber theologisch offene Wendung „in Jesus“ bleibt bewusst erhalten.
