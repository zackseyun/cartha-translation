review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt διαπονούμενοι als starke Verärgerung wieder und bewahrt den kausalen Zusammenhang von διὰ τὸ διδάσκειν. „das Volk“, „verkündeten“ und „die Auferstehung von den Toten“ entsprechen dem griechischen Wortlaut angemessen. Die bewusst direkte Wiedergabe „in Jesus“ erhält die semantische Offenheit von ἐν τῷ Ἰησοῦ, ohne die Aussage auf Jesu eigene Auferstehung oder auf eine allgemeine Auferstehungslehre festzulegen.
  naturalness: „Sie waren sehr aufgebracht“ ist modernes, verständliches Standarddeutsch und dem Kontext angemessen. Die Stellung von „in Jesus“ ist leicht markiert, aber gerade dadurch als eng an die Auferstehungsverkündigung gebundene und im Griechischen nicht weiter präzisierte Wendung erkennbar; sie ist nicht unnatürlich. „Auferstehung von den Toten“ ist im religiös-biblischen Register idiomatisch.
  terminology: „Volk“, „verkündeten“ und „Auferstehung“ sind terminologisch konsistent und sachgerecht. Die Fußnote bietet mit „am Beispiel Jesu“ eine mögliche erläuternde Lesart, kennzeichnet sie aber korrekt als Alternative und wahrt im Haupttext die Ambiguität. Der Anker [a] steht unmittelbar bei der betroffenen Aussage.
