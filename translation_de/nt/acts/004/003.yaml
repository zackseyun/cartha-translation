  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: de
  text: Sie ergriffen sie[a] und nahmen sie bis zum nächsten Tag in Gewahrsam[b], denn es war schon Abend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie legten die Hände auf sie«; die griechische Wendung bezeichnet hier ein feindliches Ergreifen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hielten sie unter Bewachung« beziehungsweise »brachten sie ins Gefängnis«. Das Griechische bezeichnet eine Verwahrung, ohne den genauen Ort näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: Sie ergriffen sie
  rationale: Die griechische Wendung lautet wörtlich »sie legten die Hände an sie« und bezeichnet hier ein feindliches Ergreifen. »Sie ergriffen sie« gibt den Sinn in natürlichem modernem Deutsch wieder; die Bildhaftigkeit der Wendung bleibt in der Fußnote sichtbar.
- source_word: αὐτοῖς
  choice: sie
  rationale: Das Dativpronomen im Griechischen bezieht sich im Zusammenhang auf Petrus und Johannes; mit dem deutschen Verb »ergreifen« steht idiomatisch der Akkusativ.
- source_word: ἔθεντο εἰς τήρησιν
  choice: nahmen sie in Gewahrsam
  rationale: τήρησις bezeichnet Bewachung oder Verwahrung. »In Gewahrsam nehmen« drückt die amtliche Festsetzung aus, ohne ein bestimmtes Gebäude wie ein Gefängnis vorauszusetzen.
- source_word: εἰς τὴν αὔριον
  choice: bis zum nächsten Tag
  rationale: Die Präpositionalwendung bezeichnet die Dauer der Verwahrung bis zum folgenden Tag; diese Formulierung passt natürlich in einen rückblickenden Erzähltext.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: denn es war schon Abend
  rationale: Die Klausel begründet den Aufschub. Die Übersetzung folgt Wortlaut und Satzfunktion eng und vermeidet die weniger genaue Deutung »es war schon spät«.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Übersetzung gibt den Sinn der griechischen Festnahmewendung idiomatisch wieder und kennzeichnet ihren wörtlichen Wortlaut in einer Fußnote; bei der Verwahrung wird keine bestimmte Haftanstalt vorausgesetzt.
