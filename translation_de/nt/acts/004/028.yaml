  source_fidelity: 'Die Grundentsprechungen sind zutreffend: ποιῆσαι („zu tun“), ὅσα („alles, was“), χείρ („Hand“) und προώρισεν („vorherbestimmt“/„im Voraus bestimmt“) werden sachgerecht erfasst. In der vorliegenden Satzfassung bleibt jedoch γενέσθαι („geschehen“, „eintreten“) im Haupttext unübersetzt. Dadurch kann der deutsche Relativsatz missverständlich besagen, Hand und Plan hätten bestimmt, was getan werden solle, statt was geschehen sollte.'
  naturalness: Die Ergänzung „dass es geschehen sollte“ ist im modernen, würdigen Standarddeutsch klar und bildet die infinitivische Konstruktion des Griechischen natürlich ab. „Ratschluss“ ist hier als etablierte, verständliche Wiedergabe von βουλή idiomatischer und präziser als das etwas allgemeinere „Plan“.
  terminology: „Hand“ bewahrt das biblische Bild. „Ratschluss“ gibt βουλή als überlegte, beschlossene Absicht wieder, ohne konfessionelle Deutung einzutragen. „Vorherbestimmt“ gibt προώρισεν stark und direkt wieder; die Fußnote dokumentiert neutralere Alternativen.
