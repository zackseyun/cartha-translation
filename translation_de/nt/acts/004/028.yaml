  - severity: low
    issue: „Plan“ ist für βουλή weniger präzise als „Ratschluss“
    rationale: βουλή meint hier einen überlegten Beschluss bzw. Ratschluss. „Plan“ ist möglich, aber weiter; „Ratschluss“ wahrt den gehobenen, jedoch weiterhin verständlichen Registerton der Gebetsrede.
