base_translation:
  language: en
  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: de
  text: um alles zu tun, was deine Hand und dein Ratschluss vorherbestimmt hatten, dass es geschehen sollte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Voraus bestimmt hatten“ oder „zuvor beschlossen hatten“. Das griechische Verb bezeichnet eine vorherige Bestimmung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: zu tun
  rationale: Der Aoristinfinitiv wird direkt und natürlich wiedergegeben und schließt an den vorausgehenden Kontext an.
- source_word: ὅσα
  choice: alles, was
  rationale: Die umfassende Bedeutung des neutralen Relativpronomens im Plural wird im Deutschen idiomatisch durch „alles, was“ ausgedrückt.
- source_word: χείρ
  choice: Hand
  rationale: Die konkrete biblische Metapher für Gottes Macht und Wirken bleibt erhalten, ohne sie erklärend auf „Macht“ zu verengen.
- source_word: βουλή
  choice: Plan
  rationale: Das Wort bezeichnet eine überlegte Absicht oder einen Ratschluss; „Plan“ ist in modernem Deutsch klar und wahrt die bewusste Zielsetzung.
- source_word: προώρισεν
  choice: im Voraus bestimmt hatten
  rationale: Die Formulierung gibt die vorherige Festlegung deutlich wieder, bleibt im Deutschen natürlich und vermeidet, dem Verb durch einen konfessionell aufgeladenen Fachausdruck zusätzliche Systematik aufzuerlegen.
- source_word: γενέσθαι
  choice: '[inhaltlich in „zu tun“ und dem Relativsatz erfasst]'
  rationale: Eine wörtliche zusätzliche Wiedergabe als „geschehen sollte“ wäre möglich; die kompakte deutsche Konstruktion versteht das im Voraus Bestimmte als das, was ausgeführt wurde. Um die Ereignisnuance und die syntaktische Spannung deutlicher zu bewahren, wird sie in der Fußnote ausgewiesen.
theological_decisions:
- issue: Gottes vorherige Bestimmung im Verhältnis zum menschlichen Handeln
  choice: im Voraus bestimmt hatten
  alternative: vorherbestimmt hatten; zuvor beschlossen hatten
  rationale: Die Übersetzung bekräftigt die im griechischen Verb ausgesagte vorherige göttliche Festlegung, ohne daraus ein umfassenderes Lehrsystem über Vorherbestimmung und menschliche Verantwortung abzuleiten.
- issue: Verhältnis von Gottes „Hand“ und Gottes „Plan“
  choice: 'Beide stehen als gemeinsames Subjekt: „deine Hand und dein Plan … hatten“'
  alternative: 'sinngemäß: „durch deine Macht nach deinem Plan“'
  rationale: Die ungewöhnliche Verbindung des griechischen Textes bleibt sichtbar. Sie kann Gottes wirksame Macht und bewusste Absicht gemeinsam bezeichnen, ohne die Metapher aufzulösen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Wendung „deine Hand“ bewahrt bewusst das biblische Bild. „Im Voraus bestimmt“ gibt προώρισεν kräftig, aber ohne unnötig konfessionelle Fachsprache wieder.
