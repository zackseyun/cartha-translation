source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: de
  text: Und nun, Herr, sieh auf ihre Drohungen und gewähre deinen Dienern[a], mit aller Freimütigkeit von deinem Wort zu reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Sklaven“ oder „Knechten“. Das griechische Wort doulos kann jemanden bezeichnen, der einem Herrn gehört. Hier steht „Diener“, weil der Gebetskontext den demütigen Dienst an Gott hervorhebt.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: Und nun
  rationale: Die adverbiale Wendung leitet in diesem Gebet von der zuvor angeführten Schrift und der geschilderten Lage zur gegenwärtigen Bitte über.
- source_word: κύριε
  choice: Herr
  rationale: Die direkte Anrede gilt Gott; „Herr“ entspricht dem neutestamentlichen Gebetsgebrauch und ist im Deutschen natürlich und würdig.
- source_word: ἔπιδε ἐπὶ
  choice: sieh auf
  rationale: Der Aoristimperativ bittet Gott, seine Aufmerksamkeit auf die Drohungen zu richten. „Sieh auf“ bewahrt das konkrete Bild und den Gebetston.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: ihre Drohungen
  rationale: Dies ist die klare, unmittelbare Wiedergabe des griechischen Plurals mit Possessivbezug.
- source_word: δὸς
  choice: gewähre
  rationale: Wörtlich bedeutet das Verb „gib“; im Zusammenhang einer Bitte um Befähigung gibt „gewähre“ die Funktion im Deutschen natürlicher wieder.
- source_word: τοῖς δούλοις σου
  choice: deinen Dienern
  rationale: δοῦλος bezeichnet jemanden, der einem Herrn gehört und ihm dient. Im Gebetskontext steht die demütige Unterordnung unter Gott im Vordergrund; die stärkere soziale Bedeutung wird in der Fußnote offengehalten.
- source_word: μετὰ παρρησίας πάσης
  choice: mit aller Freimütigkeit
  rationale: παρρησία bezeichnet hier offenes, unerschrockenes Reden; πάσης verstärkt diese Haltung. „Mit aller Freimütigkeit“ bewahrt beide Aspekte knapp und würdig.
- source_word: λαλεῖν τὸν λόγον σου
  choice: dein Wort … zu verkünden
  rationale: λαλεῖν bedeutet grundsätzlich „reden/sprechen“. Mit „dein Wort“ als Gegenstand bezeichnet es hier die öffentliche Weitergabe der Botschaft Gottes; „verkünden“ ergibt im Deutschen eine natürliche und kontextgerechte Formulierung, ohne den Inhalt näher festzulegen.
theological_decisions:
- issue: Wiedergabe von δοῦλος für Menschen in ihrer Beziehung zu Gott
  choice: deinen Dienern
  alternative: deinen Sklaven; deinen Knechten
  rationale: „Diener“ stellt in diesem Gebet die Haltung des Gehorsams und Dienstes heraus. Da δοῦλος zugleich Zugehörigkeit zu einem Herrn und einen unfreien Status bezeichnen kann, wird diese stärkere Bedeutung nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gebetstypischem Ton. „Freimütigkeit“ ist bewusst etwas gehoben, bleibt aber verständlich und bündelt Offenheit sowie Unerschrockenheit. Der Fußnotenmarker steht unmittelbar bei dem erläuterten Ausdruck.
