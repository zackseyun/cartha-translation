revisions:
- from: Als sie den Freimut von Petrus und Johannes sahen und begriffen, dass sie ungelehrte Männer und Laien[a] waren, staunten sie. Und sie erkannten, dass die beiden mit Jesus zusammen gewesen waren.
  to: Als sie den Freimut von Petrus und Johannes sahen und begriffen, dass sie ungelehrte Männer ohne besondere Stellung waren, staunten sie und erkannten, dass sie mit Jesus zusammen gewesen waren.
  rationale: Die Revision ersetzt den modern potenziell anachronistischen Ausdruck „Laien“ durch eine idiomatische Formulierung, die den Kontextkontrast von ἰδιῶται wahrt. Die Fußnote erläutert weiterhin beide griechischen Charakterisierungen. Die Satzverbindung bildet die koordinierte Folge von Staunen und Wiedererkennen enger ab, ohne den Sinn zu verändern.
