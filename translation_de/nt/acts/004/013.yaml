  variant: modern standard German
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: de
  text: Als sie den Freimut von Petrus und Johannes sahen und begriffen, dass sie ungelehrte Männer ohne besondere Stellung waren, staunten sie und erkannten, dass sie mit Jesus zusammen gewesen waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεωροῦντες
  choice: Als sie … sahen
  rationale: Das Partizip bezeichnet ein bewusstes Wahrnehmen, das zusammen mit dem folgenden Erkennen ihre Reaktion auslöst. „Sahen“ ist im Deutschen natürlich und kann in diesem Zusammenhang die aufmerksame Beobachtung einschließen.
- source_word: παρρησίαν
  choice: Freimut
  rationale: Das Wort bezeichnet hier den offenen, unerschrockenen Mut beim Reden. „Freimut“ bewahrt sowohl die Offenheit als auch die Kühnheit des Auftretens.
- source_word: καταλαβόμενοι
  choice: begriffen
  rationale: Der Aorist beschreibt, dass die führenden Männer zu einer Einschätzung über Petrus und Johannes gelangten. „Begriffen“ gibt dieses Erfassen idiomatisch wieder.
- source_word: ἀγράμματοί
  choice: ungelehrte
  rationale: Gemeint ist fehlende formale schriftgelehrte beziehungsweise rabbinische Ausbildung, nicht zwingend Analphabetismus oder mangelnde Intelligenz.
- source_word: ἰδιῶται
  choice: Laien
  rationale: Der Ausdruck bezeichnet Personen ohne fachliche oder amtliche Stellung und kontrastiert Petrus und Johannes mit den ausgebildeten religiösen Autoritäten.
- source_word: ἐθαύμαζον
  choice: staunten sie
  rationale: Der Imperfekt schildert ihre anhaltende verwunderte Reaktion; „staunten“ ist klar, natürlich und nicht übersteigernd.
- source_word: ἐπεγίνωσκόν
  choice: sie erkannten
  rationale: Das Verb bezeichnet Wiedererkennen oder Feststellen. Die anschließende ὅτι-Aussage nennt den Inhalt dieser Erkenntnis.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: mit Jesus zusammen gewesen waren
  rationale: Der deutsche Plusquamperfekt macht deutlich, dass ihre frühere Gemeinschaft mit Jesus aus der späteren Erzählsituation heraus erkannt wurde.
- source_word: δὲ … τε
  choice: Als … Und
  rationale: Die Partikeln gliedern den Erzählgang und verbinden die Wahrnehmung mit der zusätzlichen Feststellung. Eine unmarkierte deutsche Satzverknüpfung gibt ihre leichte diskursive Funktion natürlich wieder.
theological_decisions:
- issue: Soziale und bildungsmäßige Charakterisierung von Petrus und Johannes
  choice: „ungelehrte Männer und Laien“
  alternative: „ungebildete und gewöhnliche Männer“
  rationale: Die Formulierung bezeichnet fehlende formale Gelehrtenausbildung und fehlenden professionellen beziehungsweise amtlichen Status. Sie behauptet weder mangelnde Intelligenz noch moralische Unzulänglichkeit und bewahrt die zwei unterscheidbaren griechischen Begriffe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Freimut“ ist leicht gehoben, aber im kirchlichen und allgemeinen Sprachgebrauch verständlich und semantisch präzise. „Laien“ wahrt den Gegensatz zu fachlich ausgebildeten oder amtlich anerkannten Autoritäten; die Fußnote verhindert eine mögliche Verengung auf den späteren kirchenrechtlichen Sinn.
