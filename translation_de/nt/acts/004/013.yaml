  source_fidelity: 'Der Entwurf gibt den Satzbau, die beobachtete παρρησία, das Erkennen ihrer fehlenden gelehrten Ausbildung bzw. ihres nichtfachlichen Status, das Staunen und die frühere Gemeinschaft mit Jesus insgesamt zutreffend wieder. „Laien“ ist für ἰδιῶται jedoch nicht die beste deutsche Zielformulierung: Es ist heute stark kirchlich-fachsprachlich geprägt und kann einen späteren institutionellen Gegensatz nahelegen. „Männer ohne besondere Stellung“ gibt den Kontrast zu den amtlich bzw. fachlich anerkannten Gesprächspartnern idiomatischer wieder.'
  naturalness: „Freimut“ ist in einem würdevollen modernen Bibelregister verständlich und präzise. Die Ersetzung von „ungelehrte Männer und Laien“ durch „ungelehrte Männer ohne besondere Stellung“ ist gegenwartsnäher und weniger missverständlich. Die beiden griechischen Hauptverben werden im Deutschen natürlich in einem Satz verbunden.
  terminology: „Freimut“ bewahrt bei παρρησία sowohl Offenheit als auch Unerschrockenheit. „Ungelehrte“ bezeichnet angemessen fehlende formale Gelehrtenausbildung, ohne Analphabetismus oder fehlende Intelligenz zu behaupten. „Ohne besondere Stellung“ vermeidet die anachronistische bzw. konfessionell gefärbte Lesart von „Laien“, ohne den sozialen Kontrast von ἰδιῶται aufzugeben.
