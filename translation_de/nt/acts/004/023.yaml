id: ACT.4.23
reference: Acts 4:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: de
  text: Nachdem sie freigelassen worden waren, gingen sie zu den Ihren[a] und berichteten alles, was die obersten Priester und die Ältesten zu ihnen gesagt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu ihren eigenen Leuten“ beziehungsweise „zu ihren Gefährten“; wörtlich: „zu den Ihren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Nachdem sie freigelassen worden waren
  rationale: Das passivische Aoristpartizip bezeichnet hier eine Handlung, die vor dem Hauptverb liegt. Die Formulierung gibt sowohl den zeitlichen Bezug als auch den Gewahrsamskontext natürlich wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist ein schwaches verbindendes Element; im Deutschen stellt bereits der einleitende temporale Nebensatz den flüssigen Anschluss her.
- source_word: ἦλθον
  choice: gingen sie
  rationale: ἔρχομαι kann je nach Perspektive „kommen“ oder „gehen“ bedeuten. Da die Erzählperspektive nicht am Zielpunkt verankert ist, ist „gingen“ im Deutschen idiomatisch.
- source_word: πρὸς τοὺς ἰδίους
  choice: zu den Ihren
  rationale: Die substantivierte Wendung τοὺς ἰδίους bedeutet wörtlich „die Ihren“ und bezeichnet die eigene Gemeinschaft oder die eigenen Gefährten, ohne diese genauer festzulegen.
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: ἀπαγγέλλω bezeichnet das Überbringen oder Berichten von Informationen; „berichteten“ passt zum zusammenhängenden Wiedergeben des Geschehenen.
- source_word: ὅσα
  choice: alles, was
  rationale: Die Formulierung bewahrt den umfassenden Sinn des Relativpronomens und klingt im modernen Deutsch natürlich.
- source_word: πρὸς αὐτοὺς
  choice: zu ihnen
  rationale: Bei einem Verb des Sagens bezeichnet πρός mit Akkusativ hier die Adressaten. „Gegen sie“ würde eine Gegnerschaft in die Präposition hineinlesen, die sie für sich genommen nicht ausdrückt.
- source_word: οἱ ἀρχιερεῖς
  choice: die obersten Priester
  rationale: Der Plural bezeichnet die führenden priesterlichen Autoritäten, nicht mehrere gleichzeitig amtierende Hohepriester. „Oberste Priester“ bildet diese institutionelle Bedeutung transparent ab.
- source_word: οἱ πρεσβύτεροι
  choice: die Ältesten
  rationale: Im institutionellen Zusammenhang sind anerkannte jüdische Führungs- beziehungsweise Ratsmitglieder gemeint, nicht lediglich ältere Männer.
- source_word: εἶπαν
  choice: gesagt hatten
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass ihre Worte dem späteren Bericht vorausgingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu den Ihren“ bewahrt die knappe und nicht näher bestimmte griechische Wendung; die Fußnote erläutert mögliche natürliche Wiedergaben.
