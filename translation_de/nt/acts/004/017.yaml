source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: de
  text: Doch damit es sich im Volk nicht noch weiter ausbreitet, wollen wir ihnen unter Drohungen verbieten[a], zu niemandem mehr in diesem Namen zu reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wollen wir ihnen drohen“. Das griechische Verb bezeichnet eine ausdrückliche Drohung und damit mehr als eine bloße Warnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: es sich … ausbreitet
  rationale: Das Verb bezeichnet hier idiomatisch die weitere Verbreitung der öffentlich bekannt gewordenen Sache oder Botschaft. Das unbestimmte „es“ bewahrt den im Griechischen nur aus dem Zusammenhang erschlossenen Bezug.
- source_word: ἐπὶ πλεῖον
  choice: noch weiter
  rationale: Die Wendung bezeichnet eine Ausdehnung über den bisherigen Stand hinaus; „noch weiter“ gibt ihre komparative Kraft natürlich wieder.
- source_word: εἰς τὸν λαόν
  choice: im Volk
  rationale: Gemeint ist die Verbreitung innerhalb der Bevölkerung. „Im Volk“ ist im Deutschen idiomatischer als eine räumlich wörtliche Wiedergabe mit „hinein“.
- source_word: ἀπειλησώμεθα
  choice: wollen wir ihnen mit Drohungen einschärfen
  rationale: ἀπειλέω bezeichnet ausdrücklich ein Drohen. Da „ihnen drohen, nicht mehr zu reden“ im Deutschen leicht so verstanden würde, als drohten die Ratsmitglieder selbst mit dem Reden, macht diese Formulierung sowohl die Einschüchterung als auch den Inhalt der Forderung klar.
- source_word: μηκέτι λαλεῖν
  choice: nicht mehr … zu reden
  rationale: '„Nicht mehr“ bewahrt die zeitliche Bedeutung: Von nun an sollen sie das Reden unterlassen.'
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: in diesem Namen
  rationale: Die knappe Formulierung bewahrt die für die Apostelgeschichte wichtige, zugleich deutungsoffene Verbindung von Namen, Vollmacht und Berufung auf Jesus, ohne sie erklärend auf eine einzige Nuance festzulegen.
- source_word: μηδενὶ ἀνθρώπων
  choice: zu niemandem
  rationale: Der Dativ bezeichnet die Adressaten des untersagten Redens. „Zu niemandem“ gibt die generische und nachdrückliche Verneinung natürlich wieder.
theological_decisions:
- issue: Stärke und Funktion von ἀπειλησώμεθα
  choice: Die offene Einschüchterung wird im Haupttext mit „mit Drohungen einschärfen“ wiedergegeben.
  alternative: „sie warnen“ oder wörtlich „ihnen drohen“
  rationale: Eine bloße Warnung würde den Zwangscharakter der amtlichen Reaktion abschwächen. Die gewählte Form wahrt die lexikalische Stärke, vermeidet aber eine irreführende deutsche Infinitivkonstruktion.
- issue: Bedeutungsumfang von „in diesem Namen“
  choice: Die traditionelle knappe Wendung bleibt erhalten.
  alternative: „unter Berufung auf diesen Namen“ oder „aufgrund dieses Namens“
  rationale: Die griechische Präpositionalfügung kann Vollmacht, Grundlage oder Bezug ausdrücken. „In diesem Namen“ bewahrt diese theologisch relevante Mehrdeutigkeit, statt sie vorschnell auf eine Erklärung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung folgt der beratenden Rede des Hohen Rates; „mit Drohungen einschärfen“ ist bewusst gewählt, um die Stärke des griechischen Verbs ohne missverständliche deutsche Infinitivfügung auszudrücken.
