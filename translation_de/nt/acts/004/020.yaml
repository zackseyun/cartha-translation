  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: de
  text: Denn wir können nicht anders, als über das zu reden, was wir gesehen und gehört haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn wir können nicht nicht reden, was wir gesehen und gehört haben.“'
    reason: Die Fußnote zeigt die griechische Negativkonstruktion (οὐ δυνάμεθα ... μὴ λαλεῖν), ohne eine im Ausgangstext nicht ausdrücklich vorhandene Präposition einzuführen.
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: wir können unmöglich verschweigen
  rationale: Die Wendung drückt aus, dass die Sprecher nicht imstande sind, vom Reden abzusehen. „Unmöglich verschweigen“ gibt diese Unfähigkeit im Deutschen natürlich wieder, ohne sie zu bloßer Weigerung abzuschwächen.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die unmittelbar vorausgehende Aussage; „Denn“ bewahrt diese erklärende Verknüpfung.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen wird mit „wir“ wiedergegeben. Eine Verstärkung wie „wir selbst“ wäre im Deutschen unnötig markiert.
- source_word: ἃ
  choice: was
  rationale: „Was“ bezeichnet natürlich und prägnant den Inhalt ihres Sehens und Hörens.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: gesehen und gehört haben
  rationale: Das deutsche Perfekt stellt die erfahrenen Ereignisse als Grundlage des gegenwärtigen Zeugnisses dar und verbindet beide Verben idiomatisch.
- source_word: λαλεῖν
  choice: verschweigen
  rationale: Im negierten Gefüge bezeichnet das Verb das Unterlassen des Redens über das Erlebte. „Verschweigen“ macht den Bezug auf den folgenden Inhalt im Deutschen klar; die wörtlichere Struktur wird in der Fußnote bewahrt.
theological_decisions:
- issue: Die apostolische Verpflichtung wird als Unfähigkeit zu schweigen und nicht nur als mangelnde Bereitschaft dargestellt.
  choice: Die Sprecher können unmöglich verschweigen, was sie gesehen und gehört haben.
  alternative: Wir wollen nicht aufhören, davon zu reden.
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν drückt unmittelbar Unfähigkeit aus. Die Übersetzung bewahrt diesen starken Sinn und deutet ihn nicht lediglich als Entschlossenheit oder Weigerung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unmöglich verschweigen“ ist idiomatisch, erhält aber die starke Aussage der griechischen Unfähigkeitskonstruktion; die formalere Doppelverneinung steht in der Fußnote.
