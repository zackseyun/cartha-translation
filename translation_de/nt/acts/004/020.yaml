    rationale: Das griechische λαλεῖν hat hier zwar den Inhalt ἃ εἴδαμεν καὶ ἠκούσαμεν bei sich, enthält aber keine separate Präposition. Eine Fußnote, die die Form sichtbar machen soll, sollte nicht zusätzlich „von dem“ einführen.
