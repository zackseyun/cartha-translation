id: ACT.4.19
reference: Acts 4:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: de
  text: 'Petrus und Johannes aber antworteten ihnen: „Urteilt selbst, ob es vor Gott recht ist, mehr auf euch zu hören als auf Gott.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „euch mehr zu gehorchen als Gott“. Das griechische Verb bedeutet wörtlich „hören/auf jemanden hören“, bezeichnet hier aber auch das Befolgen einer Autorität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Petrus und Johannes aber
  rationale: Das nachgestellte „aber“ gibt den milden Gegensatz von δέ natürlich und würdig wieder.
- source_word: ἀποκριθέντες εἶπον πρὸς αὐτούς
  choice: antworteten ihnen
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine semitisch geprägte griechische Redeformel. Im modernen Deutschen wäre „antworteten und sagten zu ihnen“ unnötig schwerfällig; „antworteten ihnen“ gibt ihre Funktion vollständig wieder.
- source_word: δίκαιόν
  choice: recht
  rationale: „Recht“ bezeichnet hier das, was vor Gottes Urteil richtig und gerechtfertigt ist, und passt natürlich zur Aufforderung „Urteilt selbst“.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: „Vor Gott“ bewahrt sowohl den Gedanken seiner Gegenwart als auch den der Beurteilung durch ihn und ist im Deutschen idiomatischer als „in den Augen Gottes“.
- source_word: ἀκούειν
  choice: auf ... hören
  rationale: Die Wendung bewahrt den Grundsinn des Hörens und kann im Deutschen zugleich das Befolgen einer Autorität ausdrücken, ohne ausdrücklich „gehorchen“ in den Text einzutragen.
- source_word: μᾶλλον ἢ
  choice: mehr ... als
  rationale: Die vergleichende Form entspricht der griechischen Konstruktion und bewahrt deren Form etwas genauer als das ebenfalls mögliche „eher ... als“.
- source_word: κρίνατε
  choice: Urteilt selbst
  rationale: Der Imperativ fordert die Angesprochenen unmittelbar zu einer eigenen Beurteilung auf; „selbst“ macht diese rhetorische Stoßrichtung im Deutschen deutlich.
theological_decisions:
- issue: Ob ἀκούειν im Gegensatz zwischen menschlichen Autoritäten und Gott ausdrücklich als „gehorchen“ wiederzugeben ist
  choice: Im Haupttext steht „auf euch hören ... auf Gott“
  alternative: „euch gehorchen ... Gott gehorchen“
  rationale: Der Zusammenhang betrifft eindeutig das Befolgen von Autorität, doch das Griechische verwendet das Verb für Hören beziehungsweise Hinhören. Die gewählte deutsche Wendung trägt beide Bedeutungsanteile und löst die Spannung nicht unnötig auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Redeformel wurde ohne Bedeutungsverlust idiomatisch gestrafft; die rhetorische Herausforderung und die Mehrdeutigkeit von „hören“ und „gehorchen“ bleiben erhalten.
