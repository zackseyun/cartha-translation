id: ACT.4.37
reference: Acts 4:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: de
  text: Er besaß ein Feld[a], verkaufte es, brachte das Geld[b] und legte es den Aposteln zu Füßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da er ein Feld hatte«. Die griechische Konstruktion nennt einen begleitenden Hintergrundumstand.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Erlös«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: Er besaß ein Feld
  rationale: Der Genitivus absolutus beschreibt einen Hintergrundumstand. Die Besitzkonstruktion mit ὑπάρχω und Dativ wird im modernen Deutschen natürlich mit »besitzen« wiedergegeben.
- source_word: ἀγροῦ
  choice: ein Feld
  rationale: ἀγρός bezeichnet hier ein Feld oder Grundstück. »Feld« ist die direkteste Wiedergabe, ohne den Text auf einen landwirtschaftlichen Betrieb festzulegen.
- source_word: πωλήσας
  choice: verkaufte es
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die den Hauptverben vorausgeht. Eine finite Verbfolge gibt den Ablauf im Deutschen klar und natürlich wieder; »es« bezieht sich auf das Feld.
- source_word: ἤνεγκεν
  choice: brachte
  rationale: φέρω bedeutet in diesem Zusammenhang, etwas zu einem Ziel zu bringen. »Brachte« ist die natürliche deutsche Entsprechung.
- source_word: τὸ χρῆμα
  choice: das Geld
  rationale: χρῆμα bezeichnet hier das aus dem Verkauf stammende Geld. »Das Geld« bleibt nah am Wortlaut; die genauere Deutung »der Erlös« wird als Alternative vermerkt.
- source_word: ἔθηκεν
  choice: legte
  rationale: τίθημι bedeutet legen oder hinstellen. In Verbindung mit »zu Füßen« bewahrt »legte« das konkrete Bild.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: den Aposteln zu Füßen
  rationale: Diese idiomatische deutsche Formulierung bewahrt sowohl die räumliche Darstellung als auch den Gedanken, dass das Geld der Verwaltung der Apostel übergeben wurde, ohne diesen auszudeuten.
theological_decisions:
- issue: Soll das konkrete Bild der Übergabe an die apostolische Autorität erhalten bleiben?
  choice: Das konkrete Bild »legte es den Aposteln zu Füßen« bleibt erhalten.
  alternative: Den Sinn lediglich als »gab es den Aposteln« wiedergeben.
  rationale: Der Text schildert eine konkrete Übergabe, die zugleich die Verfügungsgewalt der Apostel über die Gabe erkennen lässt. Die bildhafte Formulierung bewahrt beide Aspekte, ohne weitergehende ekklesiologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Verbfolge bildet den Ablauf des griechischen Satzes natürlich ab; die konkrete Wendung »den Aposteln zu Füßen« bleibt erhalten.
