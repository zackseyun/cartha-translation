review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt den Genitivus absolutus als Hintergrundangabe mit »Er besaß ein Feld« angemessen wieder. Die zeitliche Abfolge des vorzeitigen Partizips πωλήσας wird durch »verkaufte es, brachte ... und legte ...« klar vermittelt. »das Geld« trifft τὸ χρῆμα im Kontext, und »den Aposteln zu Füßen« bewahrt das konkrete Bild von παρὰ τοὺς πόδας τῶν ἀποστόλων.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch. Die knappe Reihung der Verben passt zum erzählenden Register und ist syntaktisch eindeutig. »legte es den Aposteln zu Füßen« ist eine natürliche und bildtreue deutsche Wendung.
  terminology: »Feld« ist für ἀγρός ausreichend weit und präzise. »Aposteln« ist die etablierte, sachgerechte Wiedergabe von ἀποστόλων. Die Fußnote zu »den Erlös« bietet eine sinnvolle kontextuelle Alternative zu »das Geld«, ohne die Hauptübersetzung unnötig zu spezifizieren.
