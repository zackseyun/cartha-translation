id: ACT.4.1
reference: Acts 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: de
  text: Während sie zum Volk redeten, traten die Priester, der Befehlshaber des Tempels[a] und die Sadduzäer an sie heran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »Befehlshaber des Tempels« war der Amtsträger, der für Ordnung und Sicherheit im Tempelbereich verantwortlich war.
    reason: cultural_note
  - marker: b
    text: 'Oder: »kamen zu ihnen« beziehungsweise »traten plötzlich zu ihnen«. Das griechische Verb kann ein unvermitteltes Eintreffen oder Herantreten bezeichnen; der Zusammenhang deutet auf eine offizielle Unterbrechung hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Während sie … redeten
  rationale: Der Genitivus absolutus wird im natürlichen Deutschen als temporaler Nebensatz wiedergegeben. Das δέ markiert den Fortgang der Erzählung, verlangt hier aber kein eigens ausgedrücktes »nun« oder »aber«.
- source_word: πρὸς τὸν λαὸν
  choice: zum Volk
  rationale: λαός bezeichnet hier die im Tempel versammelten Menschen. »Volk« bleibt nah am griechischen Ausdruck und ist weniger deutend als »Menschenmenge«.
- source_word: ἐπέστησαν αὐτοῖς
  choice: traten … an sie heran
  rationale: ἐφίστημι kann ein Herantreten oder plötzliches Hinzukommen bezeichnen. Die Formulierung passt zu einer offiziellen Unterbrechung, ohne bereits ausdrücklich Feindseligkeit in das Verb hineinzulesen.
- source_word: οἱ ἱερεῖς
  choice: die Priester
  rationale: Im griechischen Text steht ἱερεῖς, nicht ἀρχιερεῖς; deshalb wird kein höherer Rang wie »Oberpriester« ergänzt.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: der Befehlshaber des Tempels
  rationale: στρατηγός bezeichnet hier den für Ordnung und Sicherheit im Tempelbereich verantwortlichen Amtsträger. »Befehlshaber« gibt seine leitende Funktion wieder, ohne die im Griechischen nicht ausdrücklich genannte »Tempelwache« in den Haupttext einzufügen.
- source_word: οἱ Σαδδουκαῖοι
  choice: die Sadduzäer
  rationale: Dies ist die geläufige deutsche Bezeichnung für diese jüdische Gruppe.
theological_decisions:
- issue: Möglicherweise feindseliger Beiklang des Eintreffens der Amtsträger
  choice: Neutral als »traten … an sie heran« wiedergeben.
  alternative: »stellten sich ihnen entgegen« oder »gingen gegen sie vor«
  rationale: Der weitere Zusammenhang zeigt Widerstand, doch das Verb selbst berichtet zunächst ihr Herantreten. Die neutrale Wiedergabe bewahrt die Spannung, ohne die Feindseligkeit vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wahrt die Aufzählung des griechischen Textes; die Amtsbezeichnung wird verständlich, aber nicht übermäßig erklärend wiedergegeben. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
