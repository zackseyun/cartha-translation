  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: de
  text: 'Nachdem sie sie in die Mitte gestellt hatten, begannen sie zu fragen[a]: »Durch welche Kraft oder in welchem Namen habt ihr das getan?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fragten sie immer wieder“ beziehungsweise „erkundigten sie sich“. Das griechische Imperfekt kann statt des Beginns auch den fortlaufenden Verlauf der Befragung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: Nachdem sie … gestellt hatten
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die der Befragung vorausgeht. Der temporale Nebensatz gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: ἐν τῷ μέσῳ
  choice: in die Mitte
  rationale: Die Wendung wird räumlich und ohne die interpretierende Ergänzung „vor sich“ wiedergegeben; zugleich bleibt die Verhörs- beziehungsweise Ratsszene erkennbar.
- source_word: ἐπυνθάνοντο
  choice: begannen sie zu fragen[a]
  rationale: Das Imperfekt kann hier ingressiv verstanden werden und den Beginn der Befragung bezeichnen. Da auch ein durativer Sinn möglich ist, wird diese Mehrdeutigkeit in der Fußnote offengehalten.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: Durch welche Kraft
  rationale: ἐν hat hier instrumentalen Sinn. „Kraft“ entspricht δύναμις genauer als „Vollmacht“ und hält die Formulierung vom folgenden „Namen“ unterscheidbar.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: oder in welchem Namen
  rationale: Die im Deutschen geläufige biblische Wendung „in jemandes Namen“ bewahrt sowohl den Wortlaut als auch den Gedanken stellvertretender Bevollmächtigung.
- source_word: ἐποιήσατε τοῦτο
  choice: habt ihr das getan
  rationale: Das deutsche Perfekt klingt in direkter Rede natürlich und verweist auf die unmittelbar vorausliegende Tat, ohne diese näher auszudeuten.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrückliche Personalpronomen ist im Deutschen bereits Bestandteil der Verbformulierung. Eine Wiedergabe mit „ihr selbst“ würde die griechische Hervorhebung in diesem Zusammenhang leicht übersteigern.
theological_decisions:
- issue: Ob δύναμις als „Kraft“ oder deutend als „Vollmacht“ wiederzugeben ist
  choice: Kraft
  alternative: Vollmacht
  rationale: δύναμις bezeichnet unmittelbar Kraft beziehungsweise wirksame Macht. Die danebenstehende Frage nach dem „Namen“ trägt bereits den Gedanken der Bevollmächtigung; „Kraft“ bewahrt daher die begriffliche Spannung der beiden Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die räumliche Formulierung „in die Mitte“ bleibt nah am griechischen Text; die direkte Frage ist natürlich und klar formuliert. Die mögliche Verlaufsbedeutung des Imperfekts wird nicht im Haupttext erzwungen, sondern in der Fußnote bewahrt.
