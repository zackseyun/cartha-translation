  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: de
  text: Als sie den Mann, der geheilt worden war, mit ihnen stehen sahen, hatten sie nichts zu erwidern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „konnten sie nichts dagegen vorbringen“; auch: „hatten sie nichts zu widersprechen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: aber
  rationale: 'Die Partikel verbindet den Satz mit dem vorausgehenden Geschehen. Im Deutschen gibt „aber“ zugleich den hier wahrnehmbaren Gegensatz wieder: Trotz ihrer Feststellungen konnten die Ratsmitglieder nichts erwidern.'
- source_word: ἄνθρωπον
  choice: den Mann
  rationale: Gemeint ist der konkrete männliche Geheilte aus dem vorherigen Zusammenhang; „den Mann“ ist präzise und natürlich.
- source_word: βλέποντες
  choice: Als sie … sahen
  rationale: Das präsentische Partizip bezeichnet eine zur Haupthandlung gleichzeitige Wahrnehmung. Ein temporaler Nebensatz ist im modernen Deutschen natürlicher als eine substantivische oder partizipiale Nachbildung.
- source_word: σὺν αὐτοῖς
  choice: bei ihnen
  rationale: σύν mit Dativ bezeichnet Begleitung beziehungsweise Gemeinschaft. „Bei ihnen“ gibt in diesem Zusammenhang anschaulich wieder, dass der Mann zusammen mit Petrus und Johannes vor dem Rat stand.
- source_word: ἑστῶτα
  choice: stehen
  rationale: Das Perfektpartizip von ἵστημι bezeichnet den fortdauernden Zustand des Stehens; der deutsche Infinitiv „stehen“ gibt diesen Zustand idiomatisch wieder.
- source_word: τεθεραπευμένον
  choice: der geheilt worden war
  rationale: Das passive Perfektpartizip kennzeichnet den Mann durch die vollzogene Heilung mit fortbestehendem Ergebnis. Die Formulierung wahrt sowohl das Passiv als auch den vorzeitigen Aspekt.
- source_word: οὐδὲν
  choice: nichts
  rationale: Das Wort drückt die vollständige Abwesenheit einer möglichen Entgegnung aus.
- source_word: εἶχον ἀντειπεῖν
  choice: konnten sie nichts dagegen sagen
  rationale: Die Verbindung von ἔχω mit dem Infinitiv bezeichnet hier fehlende Möglichkeit oder Grundlage; ἀντειπεῖν trägt den Sinn des Widersprechens oder Entgegnens. Die gewählte Formulierung ist natürlich und bewahrt die adversative Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der griechische Partizipialsatz wird zur besseren Lesbarkeit als temporaler Nebensatz wiedergegeben; die Mehrdeutigkeit von ἀντειπεῖν zwischen Erwiderung und Widerspruch wird in Text und Fußnote erhalten.
