  text: κελεύσαντες δὲ αὐτοὺς ἔξω τοῦ συνεδρίου ἀπελθεῖν συνέβαλλον πρὸς ἀλλήλους
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/015.yaml
  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: de
  text: Nachdem sie ihnen jedoch befohlen hatten, den Hohen Rat[a] zu verlassen, berieten sie miteinander[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Versammlung des Hohen Rates zu verlassen“. Das griechische συνέδριον kann sowohl das jüdische Leitungsgremium als auch dessen versammelte Sitzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie besprachen sich miteinander“ beziehungsweise „sie beratschlagten untereinander“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: sie befahlen
  rationale: Das Aoristpartizip bezeichnet eine der Hauptaussage vorausgehende Anordnung. Die finite Wiedergabe mit anschließender Satzverbindung klingt im modernen Deutschen natürlich und bewahrt den autoritativen Charakter.
- source_word: δὲ
  choice: jedoch
  rationale: Kennzeichnet hier eine leichte Gegenbewegung beziehungsweise einen Szenenwechsel von der öffentlichen Befragung zur internen Beratung.
- source_word: αὐτοὺς
  choice: ihnen
  rationale: Bezieht sich im Kontext auf Petrus und Johannes; beim deutschen Verb „befehlen“ steht die betroffene Person idiomatisch im Dativ.
- source_word: ἔξω τοῦ συνεδρίου
  choice: den Sitzungssaal des Hohen Rates
  rationale: Im Kontext sollen Petrus und Johannes den Ort beziehungsweise die versammelte Sitzung des jüdischen Leitungsgremiums verlassen. Die Formulierung vermeidet das im Deutschen missverständliche „außerhalb des Rates“.
- source_word: ἀπελθεῖν
  choice: zu verlassen
  rationale: Ergänzt κελεύσαντες und gibt zusammen mit der Ortsangabe die angeordnete Entfernung aus der Sitzung idiomatisch wieder.
- source_word: συνέβαλλον
  choice: berieten
  rationale: Das Imperfekt beschreibt die einsetzende beziehungsweise fortdauernde gemeinsame Beratung. „Berieten“ trifft im Kontext die deliberative Bedeutung von συμβάλλω.
- source_word: πρὸς ἀλλήλους
  choice: miteinander
  rationale: Gibt die reziproke Beratung natürlich und prägnant wieder.
