  register: Modernes, würdevolles Standarddeutsch. „Hoher Rat“ ist verständlicher als die Transliteration „Sanhedrin“; „Sitzungssaal“ macht die räumliche Bedeutung im Kontext deutlich, während die Fußnote die Mehrdeutigkeit des griechischen Ausdrucks bewahrt.
