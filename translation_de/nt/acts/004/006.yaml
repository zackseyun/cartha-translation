  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: de
  text: und Hannas, der Hohepriester, sowie Kajaphas, Johannes, Alexander und alle, die aus hoherpriesterlichem Geschlecht stammten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅννας
  choice: Hannas
  rationale: Die im Deutschen gebräuchliche biblische Namensform.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohepriester
  rationale: Gibt den singularischen Titel in Apposition zu Hannas unmittelbar wieder, ohne ihn historisierend umzudeuten.
- source_word: Καϊάφας
  choice: Kajaphas
  rationale: Gebräuchliche deutsche biblische Namensform.
- source_word: Ἰωάννης
  choice: Johannes
  rationale: Traditionelle und allgemein verständliche deutsche Form des griechischen Personennamens.
- source_word: Ἀλέξανδρος
  choice: Alexander
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: ὅσοι ἦσαν
  choice: alle, die … stammten
  rationale: Natürliches Deutsch für die quantifizierende Relativkonstruktion; zusammen mit ἐκ γένους bezeichnet sie die familiäre Herkunft.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: aus der hohenpriesterlichen Familie
  rationale: γένος bezeichnet hier Familie, Geschlecht oder Abstammung; die Formulierung bewahrt die Zugehörigkeit zum hohenpriesterlichen Familienverband.
theological_decisions:
- issue: Bezeichnung des Hannas als Hohepriester trotz historischer Fragen zur damaligen Amtsinhaberschaft
  choice: Hannas, der Hohepriester
  alternative: Hannas, der frühere Hohepriester
  rationale: Der griechische Text nennt Hannas ausdrücklich ὁ ἀρχιερεύς. Eine Ergänzung wie „frühere“ würde die historische Spannung interpretierend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Liste bleibt erhalten; „sowie“ verhindert im Deutschen eine schwerfällige Häufung von „und“. Kein Fußnotenmarker ist nötig, da die Bedeutungsbreite von γένος hier angemessen und natürlich mit „Familie“ wiedergegeben wird.
