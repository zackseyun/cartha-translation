id: ACT.4.18
reference: Acts 4:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: de
  text: Sie riefen sie zu sich und befahlen ihnen, überhaupt nicht im Namen Jesu zu reden oder zu lehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „überhaupt nichts zu sagen und nicht im Namen Jesu zu lehren.“'
    reason: Die griechische Wortstellung lässt auch die Lesart zu, dass sich „überhaupt“ unmittelbar auf das Reden und „im Namen Jesu“ besonders auf das Lehren bezieht.
lexical_decisions:
- source_word: καλέσαντες αὐτούς
  choice: sie riefen sie zu sich
  rationale: Das Aoristpartizip bezeichnet eine der Anordnung vorausgehende Handlung. „Zu sich rufen“ gibt das Einbestellen in natürlichem Deutsch wieder, ohne einen förmlichen Rechtsakt vorauszusetzen.
- source_word: παρήγγειλαν
  choice: befahlen
  rationale: Das Verb bezeichnet hier eine verbindliche, autoritative Anordnung; „befahlen“ bewahrt deren Nachdruck.
- source_word: τὸ καθόλου μὴ φθέγγεσθαι
  choice: überhaupt nicht … zu reden
  rationale: „Überhaupt nicht“ gibt die umfassende und nachdrückliche Verneinung durch τὸ καθόλου idiomatisch wieder. „Reden“ entspricht dem allgemeinen Sinn von φθέγγομαι, ohne ihn auf eine bestimmte Art öffentlicher Verkündigung einzuengen.
- source_word: μηδὲ διδάσκειν
  choice: oder zu lehren
  rationale: Nach einer deutschen Verneinung verbindet „oder“ die zweite untersagte Tätigkeit natürlich mit der ersten; der negative Geltungsbereich bleibt eindeutig erhalten.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: im Namen Jesu
  rationale: Die geläufige Wendung bezeichnet hier Reden und Lehren in Bezug auf beziehungsweise unter Berufung auf Jesus. Die traditionelle Genitivform „Jesu“ ist im modernen Standarddeutsch weiterhin verständlich und würdevoll.
theological_decisions:
- issue: Reichweite des Verbots
  choice: Das Verbot umfasst sowohl das Reden als auch das Lehren im Namen Jesu.
  alternative: Das Verbot untersagt jedes Reden überhaupt und daneben das Lehren im Namen Jesu.
  rationale: Die Stellung der Präpositionalphrase am Ende lässt sie natürlich auf beide koordinierten Infinitive beziehen. Die andere mögliche Zuordnung wird in der Fußnote offengehalten, da die griechische Wortstellung den Bezug nicht völlig eindeutig festlegt.
- issue: Bedeutung von „im Namen Jesu“
  choice: Die feste, mehrdeutige Ausdrucksweise „im Namen Jesu“ bleibt erhalten.
  alternative: „unter Berufung auf den Namen Jesu“ oder „über Jesus“
  rationale: Die Übersetzung soll die mögliche Bedeutungsspanne von Bezug, Bevollmächtigung und Berufung auf den Namen nicht einseitig auflösen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die doppelte Pronomenfolge in „Sie riefen sie“ ist grammatisch eindeutig und vermeidet, aus dem Kontext ergänzend „die beiden“ in den Vers einzutragen.
