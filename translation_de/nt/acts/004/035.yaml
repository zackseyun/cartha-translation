revisions:
- from: und legten ihn den Aposteln zu Füßen[a]. Dann wurde jedem davon zugeteilt, je nachdem, wie viel jemand brauchte.[b]
  to: und legten sie den Aposteln zu Füßen[a]. Und jedem wurde davon zugeteilt, je nachdem, was jemand brauchte.[b]
  rationale: Die Revision richtet das Pronomen am im unmittelbaren Kontext vorausgesetzten pluralischen Objekt aus, bewahrt die Passivform der Verteilung und gibt die bedarfsbezogene Zuordnung ohne zusätzliche Einschränkung wieder. Die Fußnote erläutert die konkrete griechische Bildsprache, ohne eine institutionelle oder theologische Folgerung als Textbedeutung festzuschreiben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:55:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft die grundlegende Abfolge und die bedarfsbezogene Verteilung. „ihn“ ist jedoch als Aufnahme des im griechischen Kontext vorausgesetzten Objekts problematisch: Der Bezug liegt in V. 34 bei den pluralischen Verkaufserlösen (τὰς τιμάς), und der Singular erzeugt ohne ein ausdrücklich singuläres Bezugswort einen unnötigen Bruch. Die Fußnote deutet zudem die Ortsformel stärker aus, als der griechische Wortlaut verlangt.'
  naturalness: „Sie legten sie den Aposteln zu Füßen“ und „Jedem wurde davon zugeteilt“ sind modernes, klares Standarddeutsch. „Je nachdem, was jemand brauchte“ gibt die bedarfsabhängige Zuordnung idiomatisch wieder, ohne die nicht ausdrücklich genannte Art des Bedarfs zu verengen.
  terminology: „Den Aposteln zu Füßen“ bewahrt das anschauliche griechische Bild. Die Anmerkung sollte die mögliche Funktion der Handlung nicht als festgelegte Bedeutung („gemeint ist“) oder als ausdrücklich ausgesagte „Verfügungsgewalt“ darstellen.
  issues:
  - severity: medium
    issue: Singularpronomen „ihn“ für das implizite Objekt
    rationale: Das aus V. 34 aufgenommene Objekt sind die dort genannten Verkaufserlöse im Plural. Der Singular ist nur über ein zusätzlich mitgedachtes „der Erlös“ möglich und ist im Vers selbst nicht hinreichend verankert.
  - severity: low
    issue: Fußnote a überdeutet die Ortsangabe
    rationale: παρὰ τοὺς πόδας bezeichnet konkret das Niederlegen bei/zu Füßen der Apostel. Eine Übergabe unter ihre Obhut kann kontextuell mitschwingen, ist aber nicht die explizite lexikalische Aussage; „Verfügungsgewalt“ ist zu bestimmt.
  - severity: low
    issue: „wie viel“ schränkt die Bedarfsformulierung unnötig auf eine Mengenfrage ein
    rationale: καθότι ἄν τις χρείαν εἶχεν ordnet die Zuteilung dem jeweiligen Bedarf zu. „was jemand brauchte“ ist im Deutschen weiter und lässt Art sowie Umfang des Bedarfs offen.
  revised_text: und legten sie den Aposteln zu Füßen[a]. Und jedem wurde davon zugeteilt, je nachdem, was jemand brauchte.[b]
