source:
  edition: SBLGNT
  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: de
  text: und legten sie den Aposteln zu Füßen[a]. Und jedem wurde davon zugeteilt, je nachdem, was jemand brauchte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei/an die Füße der Apostel“. Die Formulierung bewahrt das Bild des Niederlegens vor den Aposteln.'
    reason: lexical_alternative
  - marker: b
    text: 'Worauf sich „sie“ und „davon“ beziehen, ergibt sich aus Vers 34: auf die Erlöse aus den Verkäufen.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: legten
  rationale: Der Imperfekt bezeichnet hier eine fortlaufende bzw. wiederholte Praxis. Im Deutschen ergibt sich dieser Aspekt natürlich aus dem Erzählzusammenhang; eine Umschreibung wie „waren dabei, ihn hinzulegen“ wäre schwerfällig.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: den Aposteln zu Füßen
  rationale: Die Wendung bewahrt das konkrete Bild des Niederlegens und deutet zugleich die Übergabe in die Verfügungsgewalt der Apostel an.
- source_word: διεδίδετο
  choice: wurde … zugeteilt
  rationale: Die Passivform und der durative Charakter bleiben erhalten. „Zuteilen“ gibt eine bedarfsgerechte Verteilung an einzelne Personen idiomatisch wieder.
- source_word: ἑκάστῳ
  choice: jedem
  rationale: Das Dativpronomen bringt die individuelle Zuteilung knapp und geschlechtsübergreifend zum Ausdruck.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: je nachdem, wie viel jemand brauchte
  rationale: Die Formulierung gibt die Entsprechung zwischen Zuteilung und jeweiligem Bedarf in natürlichem Deutsch wieder, ohne einen einheitlichen Anteil zu unterstellen.
- source_word: τις
  choice: jemand
  rationale: Das Indefinitpronomen ist generisch und wird im Deutschen natürlich mit „jemand“ wiedergegeben.
- source_word: χρείαν
  choice: brauchte
  rationale: Die verbale Wiedergabe ist im Deutschen natürlicher als „Bedarf hatte“ und bewahrt den Sinn von Bedürftigkeit bzw. Bedarf.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt des Niederlegens und Verteilens
  choice: Das aus Vers 34 erschließbare Geld wird nur durch „ihn“ und „davon“ aufgenommen.
  alternative: „den Erlös“ oder „das Geld“ in beiden Satzteilen ausdrücklich ergänzen
  rationale: Der griechische Text setzt das Objekt aus dem vorherigen Vers voraus. Die pronominale Aufnahme macht den deutschen Satz verständlich, ohne die implizite Referenz unnötig auszudeuten.
- issue: Bedeutung des Niederlegens zu Füßen der Apostel
  choice: Das konkrete Bild wird im Haupttext bewahrt.
  alternative: „übergaben es den Aposteln“
  rationale: Die bildhafte Ortsangabe kann sowohl die tatsächliche Handlung als auch die Unterstellung unter apostolische Verwaltung erkennen lassen; eine rein abstrakte Wiedergabe würde diese Spannung auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Praxis wird idiomatisch durch das Präteritum im Kontext ausgedrückt; das konkrete Bild der griechischen Wendung bleibt erhalten.
