source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: de
  text: während du deine Hand zur Heilung ausstreckst und Zeichen und Wunder durch den Namen deines heiligen Dieners[a] Jesus geschehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deines heiligen Kindes Jesus“. Das griechische Wort παῖς kann sowohl „Diener“ als auch „Kind“ bedeuten. Hier wird wegen der Anklänge an Jesajas Aussagen über den Diener Gottes „Diener“ bevorzugt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: während du ... ausstreckst
  rationale: Die Konstruktion ἐν τῷ mit Infinitiv bezeichnet hier einen gleichzeitig stattfindenden Begleitumstand. „Während“ gibt diesen zeitlich-umständlichen Sinn im Deutschen natürlich wieder.
- source_word: τὴν χεῖρά σου
  choice: deine Hand
  rationale: Die wörtliche und im Deutschen natürliche Wiedergabe bewahrt das biblische Bild für Gottes wirksames Handeln.
- source_word: εἰς ἴασιν
  choice: damit Heilungen geschehen
  rationale: ἴασις bezeichnet Heilung; εἰς kann Zweck oder Ergebnis ausdrücken. Die Formulierung verbindet den Ausdruck idiomatisch mit dem Ausstrecken der Hand, ohne die beabsichtigte Wirkung zu verengen.
- source_word: σημεῖα καὶ τέρατα
  choice: Zeichen und Wunder
  rationale: Dies ist die geläufige und genaue Wiedergabe der festen Wortverbindung in der Apostelgeschichte.
- source_word: γίνεσθαι
  choice: geschehen
  rationale: γίνομαι bezeichnet hier das Eintreten beziehungsweise Zustandekommen der Heilungen, Zeichen und Wunder. „Geschehen“ ist würdig und lässt die göttliche Verursachung aus dem Zusammenhang hervorgehen.
- source_word: διὰ τοῦ ὀνόματος
  choice: durch den Namen
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Wirksamkeit. Die wörtliche Form bewahrt den biblischen Bedeutungsumfang von Jesu Namen, ohne „Vollmacht“ ausdrücklich einzutragen.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: deines heiligen Dieners Jesus
  rationale: παῖς kann „Kind“ oder „Diener“ bedeuten. Im Kontext von Apostelgeschichte 3–4 und den Anklängen an den Gottesknecht bei Jesaja ist „Diener“ vorzuziehen; die echte lexikalische Alternative wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von παῖς als Bezeichnung für Jesus
  choice: Diener
  alternative: Kind
  rationale: Die Verwendung in Apostelgeschichte 3,13.26 und 4,27.30 erinnert an die Gottesknecht-Texte Jesajas und spricht für „Diener“. Da παῖς ebenso „Kind“ bedeuten kann, wird diese Möglichkeit nicht ausgeschlossen, sondern in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als Fortsetzung des Gebets syntaktisch offen. Die Wiederholung von „geschehen“ ist bewusst in Kauf genommen, um sowohl εἰς ἴασιν als auch γίνεσθαι klar abzubilden; der Fußnotenmarker steht unmittelbar am mehrdeutigen Ausdruck.
