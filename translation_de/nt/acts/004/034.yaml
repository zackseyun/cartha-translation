  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: de
  text: Denn es gab unter ihnen auch keinen Bedürftigen; denn alle, die Grundstücke oder Häuser besaßen, verkauften sie und brachten den Erlös aus den Verkäufen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Preise des Verkauften“. Gemeint ist das Geld, das durch die Verkäufe eingenommen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Denn ... auch keinen
  rationale: γάρ knüpft erklärend an den vorherigen Zusammenhang an; οὐδέ verstärkt die Verneinung. Die deutsche Wortstellung gibt dies natürlich mit „Denn ... auch keinen“ wieder.
- source_word: ἐνδεής
  choice: Bedürftigen
  rationale: „Bedürftig“ bezeichnet jemanden, dem das Nötige fehlt, ohne den Begriff unnötig auf eine bestimmte Form wirtschaftlicher Armut einzuengen.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: es gab unter ihnen ... keinen
  rationale: Die existentielle Wendung wird im modernen Deutschen idiomatisch mit „es gab unter ihnen“ ausgedrückt.
- source_word: ὅσοι
  choice: alle, die
  rationale: Die Form bezeichnet sämtliche Personen innerhalb der genannten Gruppe. „Alle, die“ ist im Deutschen natürlicher als eine wörtlichere distributive Konstruktion.
- source_word: κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον
  choice: Grundstücke oder Häuser besaßen
  rationale: κτήτορες bezeichnet Eigentümer beziehungsweise Besitzer; zusammen mit ὑπῆρχον lässt sich die Wendung knapp und natürlich verbal wiedergeben. χωρίων meint hier Landbesitz beziehungsweise Grundstücke und nicht zwingend bewirtschaftete Felder.
- source_word: πωλοῦντες ἔφερον
  choice: verkauften sie und brachten
  rationale: Das Präsenspartizip begleitet das imperfektische Hauptverb. Die koordinierte deutsche Form wahrt den wiederholten beziehungsweise fortlaufenden Charakter im Erzählzusammenhang, ohne eine streng einmalige Handlung zu behaupten.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: den Erlös aus dem Verkauf
  rationale: Wörtlich steht „die Preise des Verkauften“. Gemeint ist hier idiomatisch das durch die Verkäufe erhaltene Geld; „Erlös aus dem Verkauf“ vermittelt diesen Sinn klar und vermeidet eine schwerfällige Wiederholung.
theological_decisions:
- issue: Umfang des beschriebenen Verkaufs
  choice: „alle, die Grundstücke oder Häuser besaßen, verkauften sie“
  alternative: „die Besitzer von Grundstücken oder Häusern verkauften jeweils davon“
  rationale: Der griechische Satz beschreibt die Angehörigen dieser Besitzergruppe kollektiv und ihre wiederholte Praxis, legt aber nicht ausdrücklich fest, ob jeder seinen gesamten Besitz oder jeweils einzelne Objekte verkaufte. Die Übersetzung folgt der Satzoberfläche; sie soll nicht als dogmatische Aussage über zwingende vollständige Besitzaufgabe gelesen werden.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Das zweimalige „denn“ bewahrt die erklärende Verknüpfung des griechischen γάρ, auch wenn die Wiederholung im Deutschen leicht markiert wirkt. Der Fußnotenmarker steht unmittelbar nach der einschlägigen Aussage.
