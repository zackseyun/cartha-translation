base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: de
  text: Nachdem sie ihnen nochmals gedroht hatten,[a] ließen sie sie frei, da sie wegen des Volkes keine Möglichkeit fanden, wie sie sie bestrafen könnten; denn alle verherrlichten Gott wegen dessen, was geschehen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem sie ihnen weiter gedroht hatten“ oder „Nachdem sie zusätzliche Drohungen ausgesprochen hatten“. Das griechische Verb bezeichnet ein zusätzliches Drohen; es kann auch eine Verstärkung bereits ausgesprochener Drohungen nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: Nachdem sie ihnen noch weiter gedroht hatten
  rationale: Die mit προσ- gebildete Verbform bezeichnet ein zusätzliches oder verstärktes Drohen. „noch weiter gedroht“ nimmt den Rückbezug auf die bereits ausgesprochenen Drohungen natürlich auf.
- source_word: ἀπέλυσαν
  choice: ließen sie sie frei
  rationale: ἀπολύω bezeichnet hier die Freilassung aus dem Gewahrsam; „freilassen“ passt zum behördlichen Kontext und ist modernes Standarddeutsch.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: fanden sie keine Möglichkeit, sie zu bestrafen
  rationale: Das wörtliche „nichts findend, das Wie“ bezeichnet, dass die Behörden keinen gangbaren Weg zur Bestrafung fanden. Die Formulierung bewahrt den modalen Sinn von πῶς und gibt κολάζω eindeutig als „bestrafen“ wieder.
- source_word: διὰ τὸν λαόν
  choice: wegen des Volkes
  rationale: διά mit Akkusativ ist kausal. λαός meint hier die breitere Bevölkerung und nicht lediglich eine gerade anwesende Menschenmenge.
- source_word: πάντες
  choice: alle
  rationale: πάντες bezeichnet im Kontext umfassend die Menschen aus dem Volk; „alle“ wahrt die starke Verallgemeinerung knapp und natürlich.
- source_word: ἐδόξαζον τὸν θεόν
  choice: verherrlichten Gott
  rationale: „verherrlichen“ bewahrt die für Lukas und die Apostelgeschichte charakteristische Sprache der Gott erwiesenen Ehre. Das deutsche Präteritum kann den durativen Sinn des griechischen Imperfekts im erzählenden Zusammenhang tragen.
- source_word: ἐπὶ τῷ γεγονότι
  choice: für das, was geschehen war
  rationale: Die Wendung bezeichnet das geschehene Ereignis als Anlass beziehungsweise Grundlage der Verherrlichung Gottes. „was geschehen war“ gibt den resultativen Rückbezug des Perfekts idiomatisch wieder.
