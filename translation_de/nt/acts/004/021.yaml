translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde leicht gegliedert, damit die Begründungsstruktur verständlich bleibt. Der Ausdruck „das Volk“ bewahrt den breiteren sozialen Bezug von λαός; „verherrlichten“ erhält die theologische Ausdrucksweise des Ausgangstextes.
