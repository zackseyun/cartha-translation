source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: de
  text: Dieser ist der Stein, der von euch, den Bauleuten, verworfen wurde und zum Eckstein[a] geworden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Schlussstein; wörtlich: Kopf der Ecke.'
    reason: 'Lexikalische Alternative: Der genaue architektonische Bezug von κεφαλὴ γωνίας ist nicht sicher.'
lexical_decisions:
- source_word: οὗτός
  choice: Dieser
  rationale: Das Demonstrativpronomen verweist nachdrücklich auf Jesus und wahrt die direkte Identifizierung.
- source_word: λίθος
  choice: Stein
  rationale: „Stein“ ist die übliche Bedeutung und bewahrt den Bezug auf Psalm 118,22.
- source_word: ἐξουθενηθεὶς
  choice: verworfen
  rationale: Das Verb bezeichnet eine geringschätzige Zurückweisung; im Bild der Bauleute gibt „verworfen“ sowohl die Haltung als auch das Ergebnis treffend wieder.
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: von euch, den Bauleuten
  rationale: Die Formulierung erhält die direkte Anklage in der zweiten Person Plural und die metaphorische Bezeichnung der Angesprochenen.
- source_word: ὁ γενόμενος
  choice: und … geworden ist
  rationale: Die deutsche Perfektform drückt den eingetretenen Wandel mit fortdauernder Bedeutung natürlich aus; „und“ verbindet die beiden Relativbestimmungen idiomatisch.
- source_word: κεφαλὴν γωνίας
  choice: zum Eckstein
  rationale: „Eckstein“ ist die verständlichste idiomatische Wiedergabe und bewahrt das Bau-Bild, ohne den genauen architektonischen Bezug endgültig festzulegen.
theological_decisions:
- issue: Architektonisches Bild in Psalm 118,22
  choice: Eckstein
  alternative: 'Schlussstein; wörtlich: Haupt der Ecke'
  rationale: „Eckstein“ gibt die herausgehobene und entscheidende Stellung des zuvor verworfenen Steins natürlich wieder. Da der genaue architektonische Bezug der Wendung umstritten ist, werden andere Möglichkeiten in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und das biblische Baubild bleiben erhalten; die umstrittene architektonische Einzelheit wird nicht dogmatisch festgelegt.
