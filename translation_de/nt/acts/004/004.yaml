id: ACT.4.4
reference: Acts 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: de
  text: Doch viele von denen, die die Botschaft[a] gehört hatten, glaubten, und die Zahl der Männer[b] stieg auf etwa fünftausend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »das Wort«. Gemeint ist hier die apostolische Verkündigung.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet hier Männer; wahrscheinlich wurden die männlichen Personen gezählt und nicht die gesamte, aus Männern und Frauen bestehende Menge.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Bewahrt die unbestimmte Mengenangabe, ohne sie zu verstärken oder ein zusätzliches Substantiv einzuführen.
- source_word: δὲ
  choice: doch
  rationale: Bringt den Gegensatz zur vorher geschilderten Festnahme und Gegenwehr natürlich zum Ausdruck.
- source_word: ἀκουσάντων τὸν λόγον
  choice: von denen, die die Botschaft gehört hatten
  rationale: Das Aoristpartizip bezeichnet hier eine vorausgehende Handlung. »Botschaft« gibt λόγος im Sinn der apostolischen Verkündigung verständlich wieder; »Wort« bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: ἐπίστευσαν
  choice: glaubten
  rationale: Gibt πιστεύω schlicht und ohne theologische Erweiterung wieder.
- source_word: ἐγενήθη
  choice: stieg auf
  rationale: Drückt im Deutschen idiomatisch den erreichten neuen Zahlenstand aus. Die Formulierung setzt im Kontext einen zahlenmäßigen Zuwachs voraus, ohne dessen Umfang näher zu bestimmen.
- source_word: ὁ ἀριθμὸς
  choice: die Zahl
  rationale: Direkte und natürliche Wiedergabe der griechischen Nominalphrase.
- source_word: τῶν ἀνδρῶν
  choice: der Männer
  rationale: ἀνήρ bezeichnet gewöhnlich erwachsene Männer und wird deshalb nicht geschlechtsneutral als »Menschen« oder »Gläubige« wiedergegeben.
- source_word: ὡς χιλιάδες πέντε
  choice: etwa fünftausend
  rationale: ὡς vor einer Zahl kennzeichnet hier eine ungefähre Angabe; »etwa« gibt dies prägnant wieder.
theological_decisions:
- issue: Geschlechtsspezifische Zählung in τῶν ἀνδρῶν
  choice: »der Männer« ausdrücklich beibehalten
  alternative: »der Menschen« oder »der Gläubigen«
  rationale: Der griechische Text verwendet ἀνδρῶν, das hier normalerweise Männer bezeichnet. Die Übersetzung entscheidet damit nicht, dass Frauen nicht zur Gemeinde gehörten, sondern bewahrt lediglich die Formulierung der in diesem Vers genannten Zählung.
- issue: Gegenstand des Glaubens bei ἐπίστευσαν
  choice: Das Verb ohne ausdrücklich ergänztes Objekt als »glaubten« wiedergeben
  alternative: »glaubten der Botschaft« oder »kamen zum Glauben«
  rationale: Im Griechischen steht πιστεύω hier ohne genanntes Objekt. Die knappe Wiedergabe erhält diese Offenheit und vermeidet eine erklärende theologische Ausformulierung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, während »stieg auf« die im Deutschen unnatürliche wörtliche Wendung »die Zahl wurde« vermeidet.
