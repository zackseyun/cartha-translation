id: ACT.4.26
reference: Acts 4:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: de
  text: Die Könige der Erde bezogen Stellung, und die Herrscher kamen zusammen gegen den Herrn und gegen seinen Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Christus«; das griechische Wort Christos bedeutet »Gesalbter«.
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: bezogen Stellung
  rationale: Die Wendung gibt im Kontext von Psalm 2 eine bewusste, feindliche Positionierung wieder und ist stärker als ein bloßes »standen da«.
- source_word: βασιλεῖς
  choice: Könige
  rationale: Die konkrete Herrscherbezeichnung und der Parallelismus des Psalmzitats bleiben erhalten.
- source_word: τῆς γῆς
  choice: der Erde
  rationale: Im weltweiten Horizont von Psalm 2 ist die umfassende Bedeutung wahrscheinlicher als das örtlich begrenzte »des Landes«.
- source_word: ἄρχοντες
  choice: Herrscher
  rationale: Die moderne, natürliche Entsprechung bezeichnet politisch Mächtige und wahrt den Parallelismus mit »Könige«.
- source_word: συνήχθησαν
  choice: versammelten sich
  rationale: Das deutsche reflexive Verb gibt den griechischen Passivgedanken natürlich wieder, ohne eine im Text nicht genannte handelnde Instanz einzuführen.
- source_word: ἐπὶ τὸ αὐτό
  choice: gemeinsam
  rationale: Das Idiom bezeichnet das Zusammenkommen an einem Ort beziehungsweise zu gemeinsamem Handeln; hier hebt »gemeinsam« die koordinierte Gegnerschaft hervor.
- source_word: κατὰ
  choice: gegen
  rationale: Die Präposition bezeichnet in beiden Vorkommen eindeutig feindliche Gegnerschaft.
- source_word: κυρίου
  choice: Herrn
  rationale: »Herr« wahrt die übliche biblische Wiedergabe von κύριος und dessen Gewicht in dem Schriftzitat.
- source_word: χριστοῦ
  choice: Messias
  rationale: Im Zitat aus Psalm 2 ist Χριστός titelhaft gebraucht; »Messias« macht diesen alttestamentlich-messianischen Zusammenhang erkennbar.
- source_word: αὐτοῦ
  choice: seinen
  rationale: Das Pronomen bezieht sich natürlich auf den Herrn und bezeichnet den Messias als den zu ihm Gehörenden beziehungsweise von ihm Beauftragten.
theological_decisions:
- issue: Wiedergabe von Χριστός im Zitat aus Psalm 2
  choice: Messias
  alternative: Christus; Gesalbter
  rationale: Der Ausdruck ist hier ein Titel und greift den »Gesalbten« aus Psalm 2,2 auf. »Messias« bewahrt diesen Zusammenhang, ohne Χριστός wie einen Eigennamen zu behandeln; die Fußnote nennt die geläufigen Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Bezogen Stellung« vermittelt die bewusste Gegnerschaft idiomatisch; »versammelten sich gemeinsam« bewahrt sowohl das Zusammenkommen als auch das koordinierte Vorgehen. Der Fußnotenmarker steht unmittelbar bei der betroffenen Wiedergabe »Messias«.
