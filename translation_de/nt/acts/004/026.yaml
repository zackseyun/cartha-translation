  naturalness: „Versammelten sich gemeinsam“ ist im modernen Deutschen unnötig doppelt, da „sich versammeln“ das Zusammenkommen bereits ausdrückt. „Kamen zusammen“ ist knapp, natürlich und behält den Sinn koordinierter Gegnerschaft.
