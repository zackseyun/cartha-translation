review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die deliberative Frage Τί ποιήσωμεν idiomatisch wieder und trifft die Konstruktion ποιεῖν τινί mit „mit diesen Männern tun“. „Denn dass … geschehen ist, ist … offenkundig“ bildet die erklärend-betonte Aussage ὅτι μὲν γὰρ sowie φανερόν sachgerecht ab. „Durch sie“ wahrt die instrumentale bzw. vermittelte Aussage von δι’ αὐτῶν, und „es“ bei „nicht leugnen“ nimmt das im Griechischen kontextuell vorausgesetzte Objekt auf.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. Die dass-Konstruktion ist trotz der Satzlänge klar; „allgemein bekannt“ und „offenkundig“ sind hier keine störende Dopplung, sondern geben die öffentliche Bekanntheit und Evidenz der griechischen Aussage wieder. Das satzanschließende „und sagten“ ist als narrativer Anschluss in diesem Versauszug natürlich.
  terminology: „Zeichen“ ist für σημεῖον die angemessene, theologisch nicht einengende Wiedergabe. „Allgemein bekanntes Zeichen“ ist für γνωστὸν im Kontext der gesamten Jerusalemer Bewohnerschaft gut begründet und natürlicher als eine unnötig technische Alternative. „Männer“ entspricht dem konkreten Bezug auf Petrus und Johannes.
