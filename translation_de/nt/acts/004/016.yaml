  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: de
  text: 'und sagten: „Was sollen wir mit diesen Männern tun? Denn dass durch sie ein allgemein bekanntes Zeichen geschehen ist, ist für alle, die in Jerusalem wohnen, offenkundig, und wir können es nicht leugnen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip führt die Äußerung des Rates ein und knüpft an den vorangehenden Satz an; im natürlichen deutschen Erzählstil wird die Verbindung durch einen koordinierten Hauptsatz wiedergegeben.
- source_word: Τί ποιήσωμεν
  choice: Was sollen wir … tun?
  rationale: Die deliberative Frage mit Aorist Konjunktiv wird im modernen Deutschen idiomatisch mit „sollen“ ausgedrückt.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: mit diesen Männern
  rationale: Der Dativ bei ποιέω entspricht hier der deutschen Wendung „etwas mit jemandem tun“; im Kontext sind Petrus und Johannes gemeint.
- source_word: ὅτι μὲν γὰρ
  choice: Denn dass
  rationale: „Denn“ bewahrt die begründende Funktion; die dass-Konstruktion ermöglicht zugleich, φανερόν als Prädikat des gesamten Sachverhalts klar wiederzugeben.
- source_word: γνωστὸν σημεῖον
  choice: ein allgemein bekanntes Zeichen
  rationale: γνωστός bezeichnet hier etwas öffentlich Bekanntes bzw. Anerkanntes. „Allgemein bekannt“ passt zur folgenden Aussage über sämtliche Einwohner Jerusalems, ohne σημεῖον auf „Wunder“ zu verengen.
- source_word: γέγονεν
  choice: geschehen ist
  rationale: Das Perfekt bezeichnet ein eingetretenes Ereignis mit fortbestehender Relevanz; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: δι’ αὐτῶν
  choice: durch sie
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Agency und lässt offen, wer letztlich der Urheber des Zeichens ist.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ
  choice: für alle, die in Jerusalem wohnen
  rationale: Die Formulierung gibt den substantivierten Partizipialausdruck klar und vollständig wieder.
- source_word: φανερόν
  choice: offenkundig
  rationale: Das prädikative Adjektiv bezeichnet einen öffentlich erkennbaren, unbestreitbaren Sachverhalt.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: wir können es nicht leugnen
  rationale: Die natürliche deutsche Formulierung ergänzt mit „es“ das im Griechischen aus dem Zusammenhang erschlossene Objekt.
theological_decisions:
- issue: Bedeutung von σημεῖον im Kontext einer öffentlich bekannten Heilung
  choice: Zeichen
  alternative: Wunder
  rationale: „Zeichen“ bewahrt den lukanischen Begriff und dessen mögliche Hinweisfunktion, während „Wunder“ die Bedeutung stärker auf das Außergewöhnliche des Geschehens festlegen würde.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil. Die verschachtelte griechische Begründung wird in einer gut verständlichen dass-Konstruktion bewahrt; „allgemein bekannt“ und „offenkundig“ bilden die öffentliche Anerkennung des Zeichens ab, ohne den Satz unnötig zu glätten.
