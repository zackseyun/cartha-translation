  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: de
  text: Wenn wir heute wegen einer Wohltat an einem kranken Menschen verhört werden, nämlich darüber, wodurch dieser geheilt worden ist[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerettet worden ist“ oder „gesund geworden ist“. Das griechische Verb kann Rettung wie auch körperliche Heilung bezeichnen; hier weist der unmittelbare Zusammenhang auf Heilung hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: verhört werden
  rationale: Das Verb bezeichnet hier eine amtliche beziehungsweise gerichtliche Befragung. „Verhört werden“ gibt den rechtlichen Rahmen deutlich wieder, ohne bereits ein förmliches Gerichtsverfahren zu behaupten.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: wegen einer Wohltat
  rationale: ἐπί mit Dativ bezeichnet hier Anlass oder Grundlage der Befragung; εὐεργεσία meint eine hilfreiche, wohltätige Handlung. „Wohltat“ bewahrt zugleich die Ironie, dass eine gute Handlung Gegenstand des Verhörs ist.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: an einem kranken Menschen
  rationale: Der Genitiv bezeichnet den Empfänger der Wohltat. ἀσθενής verweist im Zusammenhang auf eine körperliche Beeinträchtigung; „krank“ ist verständlich und legt die genaue Art des Leidens nicht neu fest.
- source_word: ἐν τίνι
  choice: wodurch
  rationale: Die Wendung kann nach Mittel oder Wirkmacht fragen und bleibt grammatisch weiter als „durch wen“. „Wodurch“ lässt die folgende Antwort, in der Jesus genannt wird, den persönlichen Urheber bestimmen.
- source_word: σέσωσται
  choice: geheilt worden ist
  rationale: Das Perfekt von σῴζω beschreibt hier unmittelbar die fortbestehende Wiederherstellung des zuvor gelähmten Mannes. „Geheilt worden ist“ ist im Kontext natürlich; die ebenfalls mögliche Bedeutung „gerettet“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von σέσωσται in einem Heilungskontext
  choice: geheilt worden ist
  alternative: gerettet worden ist; gesund gemacht worden ist
  rationale: Die körperliche Wiederherstellung steht im unmittelbaren Kontext im Vordergrund. Da σῴζω jedoch auch „retten“ bedeutet und diese Bedeutungsfelder in der Apostelgeschichte theologisch ineinandergreifen können, wird die weitere Bedeutung nicht in den Haupttext eingetragen, aber in der Fußnote ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt wegen des in Vers 10 weitergeführten Gedankens mit einem Gedankenstrich offen. „Darüber … wodurch“ macht die erläuternde Beziehung im Deutschen verständlich, ohne die Frage nach Mittel oder Person vorzeitig festzulegen.
