id: ACT.4.22
reference: Acts 4:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: de
  text: Denn der Mann, an dem dieses Zeichen der Heilung geschehen war, war über vierzig Jahre alt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieses Heilungszeichen“; auch: „dieses Wunder der Heilung“.'
    reason: Lexikalische und syntaktische Alternativen für σημεῖον τῆς ἰάσεως.
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: über vierzig Jahre alt
  rationale: Die griechische Genitivkonstruktion mit dem Komparativ πλειόνων bezeichnet idiomatisch das Alter. „Über vierzig Jahre alt“ ist im Deutschen präzise und natürlich.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage. „Denn“ wahrt diesen erklärenden Zusammenhang knapp und idiomatisch.
- source_word: ὁ ἄνθρωπος
  choice: der Mann
  rationale: Gemeint ist der aus dem Zusammenhang bekannte männliche Geheilte; „der Mann“ ist daher genauer und natürlicher als das allgemeinere „der Mensch“.
- source_word: ἐφ’ ὃν
  choice: an dem
  rationale: ἐπί mit dem Akkusativ bezeichnet hier die vom Geschehen betroffene Person. Im Deutschen verbindet sich „an dem“ natürlich mit einem an jemandem geschehenen Zeichen.
- source_word: γεγόνει
  choice: geschehen war
  rationale: Der Plusquamperfekt von γίνομαι bezeichnet ein bereits eingetretenes Geschehen. „Geschehen war“ erhält die ereignisbezogene Formulierung, ohne einen im Verb nicht ausdrücklich genannten Handelnden einzuführen.
- source_word: τὸ σημεῖον τοῦτο
  choice: dieses Zeichen
  rationale: „Zeichen“ bewahrt den für Lukas wichtigen Hinweischarakter des außergewöhnlichen Geschehens; „Wunder“ wäre stärker deutend.
- source_word: τῆς ἰάσεως
  choice: der Heilung
  rationale: ἴασις bedeutet Heilung oder Genesung. Der Genitiv lässt sich formal und verständlich als „der Heilung“ wiedergeben.
theological_decisions:
- issue: Wiedergabe von σημεῖον im Zusammenhang einer Wunderheilung
  choice: Zeichen
  alternative: Wunder
  rationale: „Zeichen“ erhält den offenbarenden und bestätigenden Charakter des Geschehens, ohne die Bedeutung auf bloße Außergewöhnlichkeit zu verengen.
- issue: In γεγόνει ausgedrückte Handlungsträgerschaft
  choice: geschehen war
  alternative: vollbracht worden war
  rationale: γίνομαι stellt das Eintreten des Ereignisses in den Vordergrund und nennt keinen Handelnden ausdrücklich. Die gewählte Formulierung vermeidet es, eine stärkere Agensangabe in diesen Vers hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die relativ formale Wendung „Zeichen der Heilung“ bewahrt die Genitivverbindung und die lukanische Zeichen-Terminologie; die Fußnote nennt flüssigere beziehungsweise stärker deutende Möglichkeiten.
