  source_fidelity: 'Die Übersetzung gibt alle Satzglieder des griechischen Textes angemessen wieder: γάρ als begründendes „Denn“, das Alter mit „über vierzig Jahre alt“, ὁ ἄνθρωπος als „der Mann“, die betroffene Person mit „an dem“, das Plusquamperfekt γεγόνει mit „geschehen war“ sowie σημεῖον τῆς ἰάσεως als „Zeichen der Heilung“. Die ereignisbezogene, nicht agentiv verstärkte Ausdrucksweise des Griechischen bleibt erhalten.'
  naturalness: Der Satz ist verständliches modernes Standarddeutsch und hat einen angemessen würdigen biblischen Registerton. Die Verbindung „an dem ... geschehen war“ ist leicht formell, aber im Kontext einer Heilung idiomatisch und präzise; eine Umformung wäre nicht nötig.
  terminology: „Zeichen der Heilung“ bewahrt die lukanische Terminologie von σημεῖον und gibt ἴασις transparent wieder. Die Fußnote kennzeichnet „Heilungszeichen“ und das stärker deutende „Wunder der Heilung“ zutreffend als Alternativen, ohne sie in den Haupttext zu verlagern.
