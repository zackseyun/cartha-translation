id: ACT.4.10
reference: Acts 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: de
  text: 'Euch allen und dem ganzen Volk Israel sei bekannt: Im Namen Jesu, des Messias, des Nazareners[a], den ihr gekreuzigt habt und den Gott von den Toten auferweckt hat – durch ihn[b] steht dieser Mann gesund[c] vor euch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesu Christi aus Nazaret“. Das griechische Χριστός kann als Titel „Messias“ oder in stärker namenähnlichem Gebrauch „Christus“ wiedergegeben werden; Ναζωραῖος bedeutet „Nazarener“ beziehungsweise „aus Nazaret“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durch diesen Namen“. Das griechische ἐν τούτῳ kann sich auf Jesus selbst oder genauer auf seinen unmittelbar zuvor genannten Namen beziehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „heil“, „unversehrt“ oder „wieder gesund“. Das griechische ὑγιής bezeichnet körperliche Unversehrtheit beziehungsweise wiederhergestellte Gesundheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: sei bekannt
  rationale: Die unpersönliche Imperativkonstruktion wird als feierliche öffentliche Feststellung wiedergegeben; die Form ist im Deutschen knapp, verständlich und würdevoll.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: euch allen und dem ganzen Volk Israel
  rationale: Bewahrt die Unterscheidung zwischen den unmittelbar Angesprochenen und dem gesamten Volk Israel.
- source_word: ἐν τῷ ὀνόματι
  choice: im Namen
  rationale: Gibt die griechische Wendung formal nah wieder und lässt ihren Sinnbereich von wirksamer Vollmacht und Kraft offen.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird hier als aussagekräftiger Titel verstanden und daher mit „Messias“ übersetzt; der Genitiv folgt der deutschen Wendung „im Namen“.
- source_word: τοῦ Ναζωραίου
  choice: des Nazareners
  rationale: Bewahrt die adjektivisch-titelhafte Bezeichnung des griechischen Textes; die transparentere Wiedergabe „aus Nazaret“ wird in der Fußnote genannt.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: den ihr gekreuzigt habt
  rationale: Direkte Wiedergabe der Anklage mit ausdrücklichem „ihr“.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: den Gott von den Toten auferweckt hat
  rationale: Bewahrt Gottes ausdrückliche Urheberschaft und die Auferweckungsaussage ohne zusätzliche Deutung.
- source_word: ἐν τούτῳ
  choice: durch ihn
  rationale: Das Demonstrativpronomen weist am natürlichsten auf Jesus zurück und hat hier instrumentalen Sinn. Der mögliche Bezug auf den zuvor genannten Namen bleibt in einer Fußnote erhalten.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Das ergänzte Substantiv macht im Deutschen deutlich, dass der geheilte Mann gemeint ist.
- source_word: παρέστηκεν ἐνώπιον ὑμῶν
  choice: steht vor euch
  rationale: Das griechische Perfekt bezeichnet einen gegenwärtigen Zustand als Ergebnis des Geschehenen; „steht vor euch“ gibt dies idiomatisch wieder.
- source_word: ὑγιής
  choice: gesund
  rationale: Bezeichnet die wiederhergestellte körperliche Unversehrtheit in allgemein verständlicher Sprache.
theological_decisions:
- issue: Χριστός als Titel oder namenähnliche Bezeichnung
  choice: Messias
  alternative: Christus
  rationale: Vor den führenden Männern Israels trägt Χριστός erkennbar titulare Bedeutung. „Messias“ macht diese Aussage sichtbar, ohne „Christus“ als mögliche traditionelle Wiedergabe auszuschließen.
- issue: Bezug von ἐν τούτῳ
  choice: durch ihn
  alternative: durch diesen Namen
  rationale: Das grammatisch maskuline τούτῳ kann auf Jesus selbst weisen; zugleich lässt der unmittelbar vorausgehende Ausdruck „im Namen“ einen Bezug auf den Namen zu. Die Mehrdeutigkeit wird durch die Fußnote bewahrt.
- issue: Aussage über die Auferweckung
  choice: den Gott von den Toten auferweckt hat
  alternative: den Gott aus den Toten auferweckt hat
  rationale: Die gewählte idiomatische deutsche Form bewahrt Gottes Handeln und die Auferweckung Jesu, ohne weitere dogmatische Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Form „sei bekannt“ bewahrt den Charakter einer öffentlichen Erklärung. Der Satzbau folgt der feierlichen Zuspitzung des griechischen Textes, während die Gedankenstrichkonstruktion die Rückkehr zur Aussage über den geheilten Mann klar erkennbar macht.
