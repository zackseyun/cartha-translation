  text: Ἐγένετο δὲ ἐπὶ τὴν αὔριον συναχθῆναι αὐτῶν τοὺς ἄρχοντας καὶ ⸀τοὺς πρεσβυτέρους καὶ ⸁τοὺς γραμματεῖς ⸀ἐν Ἰερουσαλήμ
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: de
  text: Am nächsten Tag geschah es, dass sich ihre führenden Männer, die Ältesten und die Schriftgelehrten in Jerusalem versammelten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zusammenkamen“. Das griechische Verb steht der Form nach im Passiv: „versammelt wurden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: geschah es
  rationale: Die unpersönliche Erzählformel führt die Handlung weiter. „Geschah es“ bewahrt ihren erzählerischen Charakter, ohne altertümlich zu klingen.
- source_word: ἐπὶ τὴν αὔριον
  choice: Am nächsten Tag
  rationale: Die Wendung bezeichnet den folgenden Tag; die gewählte Form ist im modernen Deutsch natürlich und präzise.
- source_word: συναχθῆναι
  choice: sich … versammelten
  rationale: Das mediale deutsche Verb gibt das Zusammenkommen idiomatisch wieder. Die formal passive Gestalt des griechischen Aoristinfinitivs wird in der Fußnote kenntlich gemacht.
- source_word: αὐτῶν
  choice: ihre
  rationale: Das Possessivpronomen bewahrt den relationalen Bezug des griechischen Genitivs, ohne seinen im Vers nicht ausdrücklich genannten Bezug näher festzulegen.
- source_word: τοὺς ἄρχοντας
  choice: führenden Männer
  rationale: Im gegebenen institutionellen Zusammenhang bezeichnet ἄρχοντες die maßgeblichen Leitungspersonen. „Führende Männer“ ist verständlich und unterscheidet sie natürlich von den anschließend genannten Ältesten.
- source_word: τοὺς πρεσβυτέρους
  choice: die Ältesten
  rationale: Hier handelt es sich um anerkannte Gemeindeleiter und nicht lediglich um ältere Männer; „Älteste“ ist die etablierte sachgerechte Bezeichnung.
- source_word: τοὺς γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Die traditionelle deutsche Bezeichnung erfasst die anerkannte schrift- und rechtskundige Gruppe im jüdischen Führungskreis.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Bezug von αὐτῶν bei den versammelten Autoritäten
  choice: „ihre“ wurde beibehalten, ohne den Bezug näher zu bestimmen.
  alternative: Das Pronomen auslassen oder ausdrücklich „die jüdischen führenden Männer“ schreiben.
  rationale: Der griechische Text enthält den relationalen Genitiv, lässt dessen Bezug in diesem Vers aber nur aus dem Kontext erschließen. Die Übersetzung wahrt beides.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur erhält die griechische Erzählformel und die dreigliedrige Aufzählung, wird jedoch idiomatisch formuliert.
