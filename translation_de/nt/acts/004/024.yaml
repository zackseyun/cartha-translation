  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: de
  text: 'Als sie das hörten, erhoben sie einmütig ihre Stimme zu Gott und sagten: »Gebieter[a], du bist es, der den Himmel, die Erde und das Meer und alles, was in ihnen ist, geschaffen hat,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herrscher«. Das griechische Wort bezeichnet einen Gebieter mit uneingeschränkter Verfügungsgewalt und unterscheidet sich von dem gewöhnlich mit »Herr« übersetzten Wort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Als sie das hörten
  rationale: Das Aoristpartizip ist hier temporal gebraucht. Das im Deutschen ergänzte „das“ nimmt natürlich auf den zuvor berichteten Inhalt Bezug.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Das Wort bezeichnet ihre gemeinsame Ausrichtung und ihr geschlossenes Handeln, ohne notwendig Gleichzeitigkeit jedes gesprochenen Wortes zu behaupten.
- source_word: ἦραν φωνήν
  choice: erhoben sie … ihre Stimme
  rationale: Die kollektive Einzahl des griechischen Textes bleibt erhalten und bringt die gemeinsame Gebetsäußerung der Gruppe zum Ausdruck.
- source_word: πρὸς τὸν θεόν
  choice: zu Gott
  rationale: Im Gebetszusammenhang bezeichnet πρός die Ausrichtung der Anrede; „zu Gott“ ist dafür idiomatisches Deutsch.
- source_word: Δέσποτα
  choice: Gebieter
  rationale: „Gebieter“ gibt die mit Eigentumsrecht und umfassender Autorität verbundene Anrede wieder und wahrt die lexikalische Unterscheidung zu κύριος („Herr“).
- source_word: σὺ ὁ ποιήσας
  choice: du bist es, der … geschaffen hat
  rationale: Die Formulierung bildet die nachdrückliche Identifizierung Gottes als Schöpfer durch Pronomen und substantiviertes Partizip in natürlichem Deutsch ab.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: den Himmel, die Erde und das Meer
  rationale: Dies entspricht der vertrauten Schöpfungsformel und bewahrt die drei Bereiche des griechischen Textes.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: alles, was in ihnen ist
  rationale: Die Wendung gibt die umfassende Aussage über den gesamten Inhalt der drei zuvor genannten Schöpfungsbereiche klar wieder.
theological_decisions:
- issue: Wiedergabe von Δέσποτα als Gottesbezeichnung
  choice: Gebieter
  alternative: Herrscher; unumschränkter Herr; Herr
  rationale: „Gebieter“ bewahrt den Akzent auf umfassender Autorität, ohne Δέσποτα mit κύριος gleichzusetzen oder durch „Herr“ einen im Ausgangstext nicht vorhandenen Titel hinzuzufügen. Eine Fußnote nennt eine verständliche Bedeutungsalternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einmütig“ ist prägnant und im heutigen religiösen Sprachgebrauch verständlich; die kollektive Einzahl „ihre Stimme“ folgt bewusst dem griechischen Ausdruck. Die eröffnete direkte Rede endet in diesem Vers syntaktisch nicht, daher steht am Versende ein Komma vor dem schließenden Anführungszeichen.
