  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: de
  text: Die große Schar derer, die zum Glauben gekommen waren, war ein Herz und eine Seele. Keiner sagte von etwas, das ihm gehörte, es sei sein Eigentum, sondern alles war ihnen gemeinsam[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder dynamischer: „Sie teilten alles miteinander“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: die ganze Gemeinschaft
  rationale: πλῆθος bezeichnet hier die große Gesamtheit der Glaubenden. „Gemeinschaft“ klingt im Deutschen natürlicher als „Menge“ und passt zum konkreten sozialen Zusammenhang; „ganze“ bringt die kollektive Aussage zum Ausdruck, ohne eine exakte Größenangabe einzuführen.
- source_word: τῶν πιστευσάντων
  choice: derer, die zum Glauben gekommen waren
  rationale: Die Formulierung bildet den substantivierten Aoristpartizip transparent ab und lässt die vorausgehende Hinwendung zum Glauben erkennen.
- source_word: καρδία καὶ ψυχὴ μία
  choice: war ein Herz und eine Seele
  rationale: Die geläufige deutsche Wendung bewahrt beide griechischen Substantive und drückt die tiefe innere Einheit der Gemeinschaft aus.
- source_word: οὐδὲ εἷς
  choice: Kein Einziger
  rationale: Die betonte Formulierung gibt die emphatische Kraft von οὐδὲ εἷς wieder.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: etwas von seinem Besitz
  rationale: Die Wendung bezeichnet Dinge, die der jeweiligen Person gehören. Das singularische „seinem“ bewahrt den distributiven Bezug auf jeden Einzelnen.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: bezeichnete … als sein ausschließliches Eigentum
  rationale: ἴδιον hebt das Eigene beziehungsweise privat Beanspruchte hervor. „Ausschließliches Eigentum“ macht in diesem Zusammenhang den Gegensatz zum gemeinschaftlichen Gebrauch deutlich, ohne die rechtliche Eigentumslage abschließend festzulegen.
- source_word: πάντα κοινά
  choice: alles war ihnen gemeinsam
  rationale: Die Übersetzung folgt der griechischen Kopulakonstruktion und bewahrt die mögliche Spannweite zwischen gemeinsamem Besitz, gemeinsamer Verfügung und gemeinsamer Nutzung.
theological_decisions:
- issue: Gemeinschaftlicher Umgang mit Besitz in der Jerusalemer Gemeinde
  choice: Der Vers beschreibt, dass niemand Besitz für sich allein beanspruchte und alles der Gemeinschaft zur Verfügung stand.
  alternative: „Sie besaßen alles gemeinsam“ oder abgeschwächt „sie teilten gern miteinander“.
  rationale: Der griechische Text verbindet die Ablehnung eines ausschließlichen privaten Anspruchs mit der Aussage, alles sei ihnen gemeinsam. Die Übersetzung ordnet dies weder einem späteren politischen Wirtschaftssystem zu noch schwächt sie die weitreichende Gemeinschaftsaussage ab.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. Die idiomatische Wendung „ein Herz und eine Seele“ ist im Deutschen vertraut. Die Eigentumsaussage bleibt bewusst beschreibend und lässt offen, ob rechtliches Eigentum, freie Verfügung oder praktischer Gebrauch im Vordergrund steht.
