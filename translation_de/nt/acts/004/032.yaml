review_pass:
  verdict: revise
  source_fidelity: 'Die Wendung „die ganze Gemeinschaft“ gibt πλῆθος nur eingeschränkt wieder: „ganze“ hat keine ausdrückliche Grundlage im Text und „Gemeinschaft“ schwächt den Aspekt einer großen Vielzahl ab. „bezeichnete ... als sein ausschließliches Eigentum“ ist gegenüber ἔλεγεν ἴδιον εἶναι unnötig interpretierend, besonders durch „ausschließliches“ und die rechtlich klingende Terminologie.'
  naturalness: „Ein Herz und eine Seele“ sowie „alles war ihnen gemeinsam“ sind natürliche, moderne und zugleich angemessen bibelsprachliche Formulierungen. Die revidierte Eigentumsaussage ist idiomatisch und näher am griechischen Satzbau.
  terminology: „Große Schar“ gibt πλήθος als große Anzahl von Glaubenden wieder, ohne eine institutionelle Bedeutung von „Gemeinschaft“ einzutragen. „Sein Eigentum“ gibt ἴδιον angemessen wieder, ohne die Aussage zu einer Festlegung über die juristische Eigentumsordnung zu machen.
  issues:
  - severity: medium
    issue: „die ganze Gemeinschaft“ für τοῦ πλήθους
    rationale: Das griechische πλῆθος bezeichnet eine Menge bzw. große Schar. Das ergänzte „ganze“ ist nicht im Ausgangstext ausgedrückt; „Gemeinschaft“ kann zudem eher eine organisierte Gruppe als deren Vielzahl bezeichnen.
  - severity: medium
    issue: „bezeichnete ... als sein ausschließliches Eigentum“ für ἔλεγεν ἴδιον εἶναι
    rationale: ἔλεγεν bedeutet hier „sagte/behauptete“, nicht speziell „bezeichnete“. „Ausschließliches Eigentum“ verstärkt und juridifiziert die Aussage unnötig. Der Text beschreibt den fehlenden exklusiven Eigenanspruch, ohne dessen rechtliche Ausgestaltung zu definieren.
