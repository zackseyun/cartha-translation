revisions:
- from: Die ganze Gemeinschaft derer, die zum Glauben gekommen waren, war ein Herz und eine Seele. Kein Einziger bezeichnete etwas von seinem Besitz als sein ausschließliches Eigentum[a], sondern alles war ihnen gemeinsam[b].
  to: Die große Schar derer, die zum Glauben gekommen waren, war ein Herz und eine Seele. Keiner sagte von etwas, das ihm gehörte, es sei sein Eigentum, sondern alles war ihnen gemeinsam[a].
  rationale: Die Revision stellt den Bezug auf die große Zahl der Glaubenden deutlicher her und gibt die Aussage über persönlichen Besitz näher am griechischen „sagte ... sei sein Eigenes“ wieder. Sie bewahrt zugleich die beschreibende Offenheit der Aussage über das gemeinsame Haben.
