  terminology: „deinen heiligen Diener Jesus“ bewahrt den im Kontext wichtigen Gottesknecht-Anklang von παῖς, ohne die lexikalische Alternative „Kind“ zu verschweigen. „gesalbt“ erhält die konkrete und messianisch relevante Bedeutung von ἔχρισας. Die Namen sind standardsprachlich korrekt wiedergegeben. Beide Fußnoten sind sinnvoll und an den jeweils passenden Wörtern verankert.
