  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: die bekräftigende Einleitung, den Ortsbezug, das feindliche Zusammenkommen gegen Jesus, die Benennung Jesu als Gottes heiliger παῖς, seine Salbung sowie die beteiligten Gruppen. Die reflexive deutsche Form „haben sich … versammelt“ ist für das griechische Aoristpassiv idiomatisch und legt keine zusätzliche Urheberschaft des Zusammentreffens fest. Der auffällige Plural „Völkern Israels“ bleibt sachgerecht erhalten.'
