id: ACT.4.27
reference: Acts 4:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: de
  text: Denn tatsächlich haben sich in dieser Stadt Herodes und Pontius Pilatus zusammen mit den Nichtjuden[b] und den Völkern Israels gegen deinen heiligen Diener[a] Jesus versammelt, den du gesalbt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein heiliges Kind“. Das griechische Wort παῖς kann „Diener“ oder „Kind“ bedeuten. Hier ist wegen des wahrscheinlichen Anklangs an den Diener Gottes bei Jesaja „Diener“ vorzuziehen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch mit „Nationen“ oder „Völker“ wiedergegeben werden. Im Gegensatz zu den Völkern Israels sind hier die Nichtjuden gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: haben sich … versammelt
  rationale: Das griechische Aoristpassiv bezeichnet das erfolgte Zusammenkommen. Die im Deutschen idiomatische reflexive Form bewahrt den Sinn, ohne eine im Text nicht ausdrücklich genannte handelnde Instanz hinter dem Passiv festzulegen.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet den Vers als Begründung beziehungsweise Bestätigung der unmittelbar zuvor angeführten Schriftworte.
- source_word: ἐπ’ ἀληθείας
  choice: tatsächlich
  rationale: Gibt die adverbiale Wendung natürlich und mit ihrer bekräftigenden Bedeutung wieder.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: in dieser Stadt
  rationale: Bewahrt den örtlichen Bezug, ohne Jerusalem, das aus dem Zusammenhang hervorgeht, ausdrücklich in den Text einzusetzen.
- source_word: ἐπὶ τὸν
  choice: gegen
  rationale: Bei einem feindlichen Sichversammeln bezeichnet ἐπί mit Akkusativ die Ausrichtung der Gegnerschaft.
- source_word: τὸν ἅγιον παῖδά σου
  choice: deinen heiligen Diener
  rationale: παῖς kann Diener oder Kind bedeuten. Im Kontext von Apostelgeschichte 3–4 und vor dem Hintergrund der Gottesknechtsaussagen Jesajas ist „Diener“ hier am wahrscheinlichsten; die Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: ὃν ἔχρισας
  choice: den du gesalbt hast
  rationale: Bewahrt die konkrete Bedeutung von χρίω und zugleich den messianischen sowie den Beauftragungsaspekt, ohne das Verb durch den Titel „Messias“ zu ersetzen.
- source_word: ἔθνεσιν
  choice: Nichtjuden
  rationale: In der Gegenüberstellung zu Israel bezeichnet das Wort hier die Völker außerhalb Israels. „Nichtjuden“ ist im heutigen Deutsch klarer und weniger missverständlich als „Heiden“; die Grundbedeutung „Nationen/Völker“ wird in der Fußnote genannt.
- source_word: λαοῖς Ἰσραήλ
  choice: den Völkern Israels
  rationale: Bewahrt den auffälligen griechischen Plural und den sprachlichen Anklang an Psalm 2, ohne ihn glättend zum Singular zu machen.
theological_decisions:
- issue: Bezeichnung Jesu mit παῖς
  choice: Diener
  alternative: Kind; Sohn
  rationale: Der Jesaja-Hintergrund und der Sprachgebrauch in Apostelgeschichte 3,13.26; 4,27.30 sprechen für „Diener“. „Kind“ bleibt lexikalisch möglich; „Sohn“ wäre hier eine theologisch zutreffende, aber für dieses konkrete Wort zu stark deutende Wiedergabe.
- issue: Bezeichnung der ἔθνη im Gegensatz zu Israel
  choice: Nichtjuden
  alternative: Nationen; Völker; Heiden
  rationale: Der Zusammenhang stellt Menschen aus den Völkern denen aus Israel gegenüber. „Nichtjuden“ macht diese Beziehung im modernen Deutsch deutlich, während die Fußnote die weitere lexikalische Spannbreite wahrt.
- issue: Passivform von συνήχθησαν
  choice: 'idiomatisch reflexiv: „haben sich versammelt“'
  alternative: „wurden versammelt“
  rationale: Die reflexive deutsche Form drückt das Zusammenkommen natürlich aus. Sie entscheidet nicht, ob hinter dem griechischen Passiv menschliche Initiative, göttliche Vorsehung oder lediglich die Ereignisperspektive steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der Gebets- und Schriftbegründung des Zusammenhangs, bleibt aber gut verständlich. „Nichtjuden“ vermeidet das heute leicht abwertend oder altertümlich wirkende „Heiden“. Der ungewöhnliche Plural „Völker Israels“ bleibt wegen des griechischen Wortlauts und des Anklangs an Psalm 2 erhalten.
