  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und die wesentlichen Bedeutungen des griechischen Textes zuverlässig wieder: δυνάμει μεγάλῃ als „mit großer Kraft“, die Zeugnisformel ἀπεδίδουν τὸ μαρτύριον als „legten ... Zeugnis ... ab“, den Inhalt als Auferstehung des Herrn Jesus sowie χάρις ... ἐπὶ πάντας αὐτούς als auf der ganzen Gemeinschaft ruhende „große Gunst“. Das deutsche Präteritum kann die imperfektische, fortlaufende bzw. wiederholte Handlung angemessen abdecken.'
  naturalness: „Zeugnis von der Auferstehung ... ablegen“ ist idiomatisches modernes Standarddeutsch. Die Stellung von „ruhte auf ihnen allen“ ist leicht gehoben, aber klar, würdig und passend zum Register; sie erhält zugleich das Bild von ἐπί.
  terminology: „Herr Jesus“ gibt κύριος sachgerecht wieder. „Gunst“ ist für χάρις eine vertretbare, nicht einengende Wahl; die Fußnote nennt „Gnade“ und erläutert ausgewogen die mögliche göttliche, menschliche oder umfassende Dimension, ohne eine Deutung vorzuschreiben. Der Fußnotenanker steht unmittelbar bei dem erläuterten Begriff.
