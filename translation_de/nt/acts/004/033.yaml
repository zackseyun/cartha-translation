id: ACT.4.33
reference: Acts 4:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: de
  text: Und mit großer Kraft legten die Apostel Zeugnis von der Auferstehung des Herrn Jesus ab, und große Gunst[a] ruhte auf ihnen allen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „große Gnade“. Das griechische Wort kann sowohl „Gnade“ als auch „Gunst“ bedeuten; gemeint sein können Gottes gnädige Gegenwart, das Wohlwollen, das den Glaubenden entgegengebracht wurde, oder beides.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: mit großer Kraft
  rationale: Der instrumentale Dativ bezeichnet Art oder Mittel des apostolischen Zeugnisses. „Kraft“ ist in Lukas und Apostelgeschichte natürlich und lässt eine vom Geist gewirkte Wirksamkeit erkennen, ohne sie ausdrücklich auf Wunder einzugrenzen.
- source_word: ἀπεδίδουν
  choice: legten … ab
  rationale: In Verbindung mit μαρτύριον entspricht „Zeugnis ablegen“ dem natürlichen deutschen Ausdruck. Das Imperfekt beschreibt das fortdauernde beziehungsweise wiederholte Handeln der Apostel.
- source_word: τὸ μαρτύριον
  choice: Zeugnis
  rationale: μαρτύριον bezeichnet ein Zeugnis oder eine Bezeugung. Zusammen mit „ablegen“ ergibt sich eine idiomatische und quellennahe deutsche Formulierung.
- source_word: τῆς ἀναστάσεως
  choice: von der Auferstehung
  rationale: Der Genitiv bezeichnet hier am natürlichsten den Inhalt des Zeugnisses. „Von der Auferstehung“ ist im Deutschen klarer und geläufiger als eine wörtliche Genitivkonstruktion.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: des Herrn Jesus
  rationale: Die Genitivverbindung ordnet die Auferstehung Jesus zu; κύριος wird mit dem etablierten Titel „Herr“ wiedergegeben.
- source_word: χάρις
  choice: Gunst
  rationale: χάρις kann hier Gnade oder wohlwollende Anerkennung bezeichnen, ohne dass deren Quelle ausdrücklich genannt wird. „Gunst“ wahrt diese Offenheit besser als das im heutigen Deutsch meist ausdrücklich theologische „Gnade“; eine Fußnote nennt die wichtige Alternative.
- source_word: τε
  choice: und
  rationale: τε verbindet die zweite Aussage locker mit der ersten; „und“ gibt diese Funktion im modernen Deutsch unauffällig wieder.
- source_word: ἐπὶ πάντας αὐτούς
  choice: ruhte auf ihnen allen
  rationale: Die Formulierung bewahrt das Bild von etwas, das auf der gesamten Gemeinschaft liegt, und betont, dass niemand ausgenommen ist.
theological_decisions:
- issue: Bedeutung und Quelle von χάρις
  choice: große Gunst, die auf der ganzen Gemeinschaft ruhte
  alternative: große Gnade im ausdrücklich theologischen Sinn
  rationale: Der griechische Text nennt die Quelle der χάρις nicht. Die Übersetzung und die Fußnote halten daher offen, ob Gottes gnädige Gegenwart, das Wohlwollen anderer Menschen oder beides gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zeugnis ablegen“ ist idiomatisch; „ruhte auf ihnen allen“ erhält zugleich das Bild und die feierliche Tonlage des griechischen Textes.
