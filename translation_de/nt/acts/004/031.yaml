  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: de
  text: Nachdem sie gebetet hatten, wurde der Ort, an dem sie versammelt waren, erschüttert. Alle wurden mit dem Heiligen Geist erfüllt und redeten das Wort Gottes freimütig[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Freimut“; auch: „offen und unerschrocken“. Das griechische Wort bezeichnet freie, furchtlose Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: Nachdem sie gebetet hatten
  rationale: Der Genitivus absolutus mit Aoristpartizip gibt den zeitlichen Hintergrund an. „Nachdem sie gebetet hatten“ ist natürliches Deutsch und gibt die Vorzeitigkeit klar wieder.
- source_word: ἐσαλεύθη
  choice: wurde … erschüttert
  rationale: Das Aoristpassiv bezeichnet eine Erschütterung, die den Versammlungsort erfasste. „Erschüttert“ bewahrt die körperlich wahrnehmbare Kraft des Verbs.
- source_word: ὁ τόπος
  choice: der Ort
  rationale: τόπος meint hier den konkreten Versammlungsort; „der Ort“ ist präzise und allgemein verständlich.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: an dem sie versammelt waren
  rationale: Die Konstruktion aus ἦσαν und Perfektpartizip beschreibt ihren fortbestehenden Zustand als versammelte Gemeinschaft.
- source_word: ἐπλήσθησαν ἅπαντες
  choice: Sie wurden alle … erfüllt
  rationale: Die passive Form und die Gesamtheit der Gruppe werden unmittelbar wiedergegeben.
- source_word: τοῦ ἁγίου πνεύματος
  choice: mit dem Heiligen Geist
  rationale: Der Genitiv nach πίμπλημι bezeichnet hier idiomatisch das, womit sie erfüllt wurden. Die Formulierung entspricht zugleich dem wiederkehrenden lukanischen Sprachgebrauch.
- source_word: ἐλάλουν
  choice: verkündeten
  rationale: Im Zusammenhang von Apostelgeschichte 4 bezeichnet das Reden des Wortes Gottes öffentliche Weitergabe. „Verkündeten“ ist im Deutschen natürlicher als „sprachen das Wort“, ohne den Inhalt näher festzulegen; der durative Charakter des Imperfekts liegt im fortgesetzten Geschehen.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die feste lukanische Wendung bezeichnet die von Gott kommende und auf ihn bezogene Botschaft. „Das Wort Gottes“ bewahrt ihren biblischen und theologischen Gehalt.
- source_word: μετὰ παρρησίας
  choice: freimütig
  rationale: παρρησία bezeichnet offenes, unerschrockenes und zuversichtliches Reden. Das Adverb ist in modernem Deutsch flüssiger als „mit Freimut“.
theological_decisions:
- issue: Erfüllung mit dem Heiligen Geist
  choice: Sie wurden alle mit dem Heiligen Geist erfüllt
  alternative: Sie wurden alle durch den Heiligen Geist erfüllt
  rationale: Die gewählte Fassung gibt den Geist als Inhalt der Erfüllung wieder und entspricht dem lukanischen Idiom. Sie legt nicht fest, wie dieses Ereignis in ein bestimmtes konfessionelles Schema geistlicher Erfahrungen einzuordnen ist.
- issue: Aspekt von ἐλάλουν
  choice: verkündeten
  alternative: begannen zu verkünden
  rationale: Das Imperfekt stellt das Verkündigen als andauerndes Geschehen dar. Eine ausdrücklich inchoative Wiedergabe mit „begannen“ würde eine Nuance hinzufügen, die der griechische Text nicht verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Ablauf, wird aber zur besseren Lesbarkeit in zwei Sätze gegliedert. „Freimütig“ bewahrt den traditionellen biblischen Begriff in einer noch verständlichen modernen Form.
