  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: de
  text: Petrus und Johannes gingen zur neunten Stunde, der Gebetsstunde,[a] zum Tempel hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das entspricht nach heutiger Zeitrechnung ungefähr drei Uhr nachmittags.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel führt die Erzählung lediglich locker weiter. Ein ausdrückliches „nun“ würde im Deutschen leicht zeitlich verstanden; der Zusammenhang trägt die Verknüpfung ausreichend.
- source_word: ἀνέβαινον
  choice: gingen … hinauf
  rationale: Das Imperfekt schildert die Handlung im Verlauf. Die deutsche Vergangenheitsform ist hier natürlich; „hinauf“ bewahrt die übliche räumliche Ausdrucksweise für den Weg zum Tempel.
- source_word: ἱερόν
  choice: Tempel
  rationale: Gemeint ist der Tempelbereich, nicht speziell das innere Heiligtum. „Tempel“ ist im Haupttext die geläufige und verständliche Wiedergabe.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην
  choice: zur neunten Stunde, der Gebetsstunde
  rationale: Die Formulierung bewahrt die antike Stundenangabe und macht zugleich deutlich, dass diese festgesetzte Zeit eine Gebetsstunde war.
