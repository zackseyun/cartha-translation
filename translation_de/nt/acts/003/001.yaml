  source_fidelity: Die Übersetzung gibt die Personen, die Bewegung zum Tempel hinauf, die neunte Stunde und ihren Charakter als Gebetsstunde zuverlässig wieder. Das deutsche Präteritum „gingen“ kann die im griechischen Imperfekt angelegte Verlaufs- bzw. Hintergrundhandlung idiomatisch wiedergeben; eine ausdrücklich periphrastische Verlaufsform wäre hier nicht erforderlich.
  naturalness: „Petrus und Johannes gingen zur neunten Stunde, der Gebetsstunde, zum Tempel hinauf“ ist verständliches, würdevolles modernes Standarddeutsch. Die Apposition erläutert die neunte Stunde klar, ohne den Satz unnötig zu belasten.
  terminology: „Petrus“, „Johannes“, „Tempel“ und „Gebetsstunde“ sind sachgerecht und im kirchlich-biblischen Sprachgebrauch etabliert. „Tempel“ ist als lesbare Wiedergabe von ἱερόν angemessen; die Fußnote zur antiken Zeitrechnung ist korrekt und passend verankert.
