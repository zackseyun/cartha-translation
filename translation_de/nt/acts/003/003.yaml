  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: de
  text: Als er sah, dass Petrus und Johannes gerade in den Tempel[a] hineingehen wollten, bat er um Almosen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die gesamte Tempelanlage beziehungsweise die Tempelvorhöfe, nicht speziell das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: Als er sah
  rationale: Das Relativpronomen greift den gelähmten Mann aus dem vorherigen Vers auf; das Aoristpartizip wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Petrus und Johannes
  rationale: Die im Deutschen üblichen biblischen Namensformen.
- source_word: μέλλοντας εἰσιέναι
  choice: gerade … gehen wollten
  rationale: μέλλω mit Infinitiv bezeichnet hier eine unmittelbar bevorstehende und beabsichtigte Handlung. Die Formulierung wahrt beide Nuancen, ohne sie unnötig festzulegen.
- source_word: εἰς τὸ ἱερὸν
  choice: in den Tempel
  rationale: Im Haupttext ist »Tempel« die natürliche deutsche Bezeichnung; ἱερόν meint hier jedoch die Tempelanlage und nicht ausschließlich das innere Heiligtum, was die Fußnote erläutert.
- source_word: ἠρώτα
  choice: bat er sie
  rationale: Der Imperfekt beschreibt das Bitten in der damaligen Situation; im idiomatischen Deutschen genügt hier das Präteritum, ohne einen ausdrücklich markierten Handlungsbeginn in den griechischen Text einzutragen.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: um eine Gabe
  rationale: Gemeint ist eine wohltätige Zuwendung an einen Bedürftigen. »Um eine Gabe bitten« ist im modernen Deutsch natürlicher als das traditionelle »Almosen empfangen« und gibt den Sinn des Infinitivs knapp wieder.
