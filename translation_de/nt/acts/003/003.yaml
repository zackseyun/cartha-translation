    issue: Das Pronomen „sie“ in „bat er sie um eine Gabe“ ist eine nicht im griechischen Text ausgedrückte Ergänzung.
    rationale: ἠρώτα ἐλεημοσύνην λαβεῖν nennt das Erbetene und den Zweck des Empfangens, aber keinen als Objekt des Bittens bezeichneten Adressaten. Die Auslassung bewahrt die textliche Offenheit und ergibt im Deutschen einen natürlichen Satz.
  - severity: low
    issue: „eine Gabe“ ist gegenüber ἐλεημοσύνη weniger spezifisch.
    rationale: „Gabe“ kann jede Art von Geschenk bezeichnen. „Almosen“ macht den im Kontext gemeinten karitativen Charakter der erbetenen Zuwendung deutlich.
