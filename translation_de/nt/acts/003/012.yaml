source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: de
  text: 'Als Petrus das sah, wandte er sich an das Volk: »Ihr Männer Israels, warum wundert ihr euch darüber? Oder warum starrt ihr uns an, als hätten wir ihn aus eigener Kraft oder Frömmigkeit zum Gehen gebracht?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Als Petrus das sah
  rationale: Das Aoristpartizip wird natürlich als temporaler Nebensatz wiedergegeben. »Das« nimmt aus dem Zusammenhang die Reaktion der Menge auf die Heilung auf; δέ markiert hier einen leichten Übergang, der im Deutschen keiner eigenen adversativen Konjunktion bedarf.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: wandte er sich an das Volk
  rationale: Obwohl keine ausdrückliche Frage vorausgeht, bezeichnet ἀποκρίνομαι eine Reaktion auf die Situation. Die Formulierung ist im Deutschen natürlicher als »antwortete dem Volk«.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ihr Männer Israels
  rationale: Die Anrede bewahrt den ausdrücklich maskulinen Vokativ und klingt zugleich wie eine würdige öffentliche Ansprache.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: warum wundert ihr euch darüber?
  rationale: θαυμάζω bezeichnet Verwunderung oder Staunen; die gewählte Form ist im modernen Standarddeutsch natürlich. »Darüber« verweist auf das Heilungsgeschehen.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: Und warum starrt ihr uns an
  rationale: ἀτενίζω bezeichnet einen festen, anhaltenden Blick. »Anstarren« gibt diese Intensität knapp und idiomatisch wieder; ἤ verbindet hier die zweite rhetorische Frage und wird natürlich mit »und« wiedergegeben.
- source_word: ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ
  choice: als hätten wir aus eigener Kraft oder Frömmigkeit
  rationale: ὡς führt die irrige Annahme ein, die Petrus zurückweist. ἰδίᾳ betont, dass Kraft oder Frömmigkeit den Aposteln selbst zugeschrieben würden.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: bewirkt, dass dieser Mann gehen kann
  rationale: Die Konstruktion bezeichnet die vermeintliche Verursachung des Gehens. »Dieser Mann« verdeutlicht den Bezug von αὐτόν, und »gehen kann« drückt den sichtbar wiederhergestellten Zustand natürlich aus.
theological_decisions:
- issue: Ob εὐσεβείᾳ als apostolisches Verdienst oder als religiöse Eigenschaft verstanden werden könnte
  choice: Frömmigkeit
  alternative: Gottesfurcht
  rationale: »Frömmigkeit« bewahrt den religiösen Sinn des Wortes, ohne eine spätere Verdienstlehre einzutragen. Petrus bestreitet ausdrücklich, dass die Heilung aus einer den Aposteln eigenen geistlichen Qualität hervorgegangen sei.
- issue: Geschlechtsspezifische Anrede Ἄνδρες Ἰσραηλῖται
  choice: Ihr Männer Israels
  alternative: Ihr Israeliten
  rationale: Die Übersetzung erhält die ausdrücklich maskuline Anrede des griechischen Textes, ohne daraus eine Aussage über die vollständige Zusammensetzung der Zuhörerschaft abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die öffentliche Rede ist direkt und verständlich; ungewöhnlich kirchliche oder altertümliche Wendungen werden vermieden. Es sind keine Fußnoten erforderlich, da die relevanten Bedeutungsnuancen im Haupttext angemessen wiedergegeben werden.
