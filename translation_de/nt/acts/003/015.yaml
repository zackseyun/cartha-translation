lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ setzt die scharfe Gegenüberstellung zum vorherigen Zusammenhang fort, ohne einen starken adversativen Gegensatz zu erzwingen.
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: den Urheber des Lebens
  rationale: ἀρχηγός kann Ursprung, Führung und Vorrang bezeichnen. „Urheber“ gibt hier den Ursprungssinn natürlich wieder und bewahrt den paradoxen Gegensatz zwischen Leben und Töten.
- source_word: ἀπεκτείνατε
  choice: habt ihr getötet
  rationale: Die direkte Formulierung entspricht dem Aorist und fügt keine besondere rechtliche Wertung wie „ermordet“ hinzu.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: hat Gott von den Toten auferweckt
  rationale: „Von den Toten auferweckt“ ist die klare und geläufige deutsche Wiedergabe der neutestamentlichen Auferstehungsformel.
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: dafür sind wir Zeugen
  rationale: Das rückbezügliche „dafür“ verbindet das Zeugnis idiomatisch mit der unmittelbar genannten Auferweckung, ohne den möglichen Personenbezug völlig auszuschließen.
theological_decisions:
- issue: Christologischer Titel ἀρχηγὸς τῆς ζωῆς
  choice: Urheber des Lebens
  alternative: Anführer des Lebens; Fürst des Lebens; Begründer des Lebens
  rationale: „Urheber“ bringt in diesem Kontext den Ursprungssinn und den bewussten Gegensatz zur Tötung besonders deutlich zum Ausdruck. Die Fußnote bewahrt die Führungs- und Vorrangnuancen des griechischen Wortes.
- issue: Bezug von οὗ im Zeugensatz
  choice: dafür sind wir Zeugen
  alternative: für ihn sind wir Zeugen; dessen Zeugen sind wir
  rationale: Das Genitivpronomen kann auf den auferweckten Jesus oder sachlich auf seine Auferweckung bezogen werden. Der Haupttext folgt dem naheliegenden Ereignisbezug; die Fußnote hält die Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anklage bleibt erhalten; zwei Hauptsätze vermeiden eine schwerfällige deutsche Relativsatzkette. Der Fußnotenmarker steht unmittelbar bei der Stelle, deren lexikalische und syntaktische Mehrdeutigkeit erläutert wird.
