revisions:
- from: Und alle Propheten, von Samuel an und die nach ihm kamen[a] — alle, die geredet haben —, haben auch diese Tage angekündigt[b].
  to: Und alle Propheten, angefangen bei Samuel und allen seinen Nachfolgern, alle, die geredet haben, haben diese Tage verkündet[b].
  rationale: Die Revision behebt die syntaktisch ungleichartige Aufzählung und gibt die substantivische Folgebezeichnung τῶν καθεξῆς idiomatisch mit „allen seinen Nachfolgern“ wieder. Die Wiederaufnahme „alle, die geredet haben“ erhält die umfassende Aussage von ὅσοι. „Verkündet“ bildet κατήγγειλαν näher ab; die mögliche Lesart als Ankündigung oder Vorhersage bleibt in der Fußnote erhalten. Da die alternative Formulierung zu τῶν καθεξῆς nun nicht mehr benötigt wird, entfällt Fußnote a samt Anker.
