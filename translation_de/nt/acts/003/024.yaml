source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: de
  text: Und alle Propheten, angefangen bei Samuel und allen seinen Nachfolgern, alle, die geredet haben, haben diese Tage verkündet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: »angekündigt«; stärker deutend: »vorhergesagt«. »Diese Tage« kann auch »diese Zeit« bedeuten und bezeichnet hier die gegenwärtige Zeit der Erfüllung, von der Petrus spricht.'
    reason: lexical_and_contextual_alternative
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: Und alle Propheten
  rationale: δέ verbindet hier den Satz leicht mit dem Vorhergehenden, ohne einen starken Gegensatz auszudrücken. „Und“ ist im Deutschen natürlich; πάντες bleibt durch „alle“ erhalten.
- source_word: ἀπὸ Σαμουὴλ
  choice: von Samuel an
  rationale: ἀπό bezeichnet Samuel als Ausgangspunkt einer zeitlichen Folge. „Von Samuel an“ bringt dies im Deutschen klarer zum Ausdruck als das missverständliche bloße „von Samuel“.
- source_word: τῶν καθεξῆς
  choice: die nach ihm kamen
  rationale: καθεξῆς bezeichnet die anschließende Folge. Die substantivische Wendung meint die Propheten, die auf Samuel folgten; eine Fußnote bewahrt die enger formale Alternative.
- source_word: ὅσοι ἐλάλησαν
  choice: alle, die geredet haben
  rationale: ὅσοι hat umfassende beziehungsweise quantitative Kraft. „Alle, die“ ist idiomatisches Deutsch und ἐλάλησαν wird ohne interpretierende Zusätze als „geredet haben“ wiedergegeben.
- source_word: καὶ κατήγγειλαν
  choice: haben auch … angekündigt
  rationale: καταγγέλλω bedeutet bekannt machen, verkünden oder ankündigen. Im prophetischen Zusammenhang ist „angekündigt“ natürlich, ohne das stärker interpretierende „vorhergesagt“ einzusetzen; καί wird als „auch“ wiedergegeben.
- source_word: τὰς ἡμέρας ταύτας
  choice: diese Tage
  rationale: Die direkte temporale Formulierung bleibt erhalten. Sie verweist im Zusammenhang auf die gegenwärtige Erfüllungszeit, ohne diese Deutung in den Haupttext einzutragen.
theological_decisions:
- issue: Bezug der prophetischen Ankündigung auf den gegenwärtigen heilsgeschichtlichen Zeitraum
  choice: diese Tage
  alternative: diese Zeit
  rationale: Die Übersetzung bewahrt die konkrete griechische Wendung und lässt den Kontext bestimmen, dass Petrus von den Tagen der gegenwärtigen Erfüllung spricht, ohne die eschatologische Bedeutung ausdrücklich auszudeuten.
- issue: Bedeutung von κατήγγειλαν im prophetischen Zusammenhang
  choice: angekündigt
  alternative: vorhergesagt
  rationale: „Angekündigt“ bildet die öffentliche Bekanntmachung des Verbs ab und wahrt die Spannung zwischen Verkündigung und Vorhersage. „Vorhergesagt“ wäre kontextuell möglich, legt den Zukunftsaspekt aber stärker fest, als das Verb allein verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Gedankenstriche grenzen die umfassende Wendung ὅσοι ἐλάλησαν lesbar ab. Die Formulierung vermeidet konfessionell geprägte Zusätze und bewahrt sowohl die zeitliche Bildsprache von „diesen Tagen“ als auch die Bedeutungsbreite des prophetischen Ankündigens.
