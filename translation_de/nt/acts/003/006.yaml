source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: de
  text: 'Petrus aber sagte: »Silber und Gold habe ich nicht. Doch was ich habe, das gebe ich dir: Im Namen Jesu, des Messias, des Nazareners[a]: Geh!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesu, des Messias aus Nazaret«. Das Griechische lautet wörtlicher: »Jesu Christi, des Nazareners«; »Christus« ist die traditionelle Wiedergabe von »Messias«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: Silber und Gold
  rationale: Die ausdrückliche Verbindung der beiden Edelmetalle bleibt erhalten; sie bezeichnet hier materiellen Besitz beziehungsweise Geld.
- source_word: οὐχ ὑπάρχει μοι
  choice: habe ich nicht
  rationale: Die griechische Besitzkonstruktion wird natürlich und genau wiedergegeben.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: Doch was ich habe, das gebe ich dir
  rationale: Das demonstrative τοῦτο wird durch „das“ aufgenommen und der betonte Gegensatz zum fehlenden Geld bewahrt.
- source_word: ἐν τῷ ὀνόματι
  choice: Im Namen
  rationale: Die Formulierung bewahrt sowohl den griechischen Wortlaut als auch dessen mögliche Bedeutung von Vollmacht und Wirksamkeit, ohne sie einseitig auszulegen.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird als Titel verstanden und mit „Messias“ übersetzt; der deutsche Genitiv macht die Beziehung innerhalb der Namensformel deutlich.
- source_word: τοῦ Ναζωραίου
  choice: aus Nazaret
  rationale: Das griechische Herkunftsepitheton wird in modernem Deutsch natürlich wiedergegeben; die wörtlichere Alternative steht in der Fußnote.
- source_word: περιπάτει
  choice: geh umher
  rationale: Der Präsensimperativ verlangt nicht nur das einmalige Aufstehen, sondern tatsächliches Gehen; „geh umher“ bildet dies genauer ab als das im Deutschen mehrdeutige „geh“.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Namensformel
  choice: Messias
  alternative: Christus
  rationale: Χριστός ist hier weiterhin als Titel verständlich. „Messias“ gibt seine Bedeutung wieder, während „Christus“ im Deutschen stärker wie ein Namensbestandteil wirken kann.
- issue: Bedeutung von ἐν τῷ ὀνόματι
  choice: Im Namen
  alternative: in der Vollmacht
  rationale: Die wörtliche Wendung erhält die theologische Spannung zwischen Berufung auf den Namen, Vollmacht und wirksamer Gegenwart, statt sie auf nur eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt die betonte Gegenüberstellung von fehlendem materiellen Besitz und der tatsächlich gegebenen Gabe. Die Herkunftsbezeichnung „aus Nazaret“ ist im Haupttext natürlicher als „der Nazarener“, während die Fußnote die formnähere Fassung dokumentiert.
