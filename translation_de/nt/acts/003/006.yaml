  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Geh!“ ist als unmittelbarer Heilungsbefehl natürlicher und präziser als „geh umher“. Die appositionelle Form „Jesu, des Messias, des Nazareners“ ist in diesem feierlich-formelhaften Kontext verständlich und bewahrt die Struktur der griechischen Bezeichnung.
  terminology: „Messias“ gibt Χριστός sachgerecht als Titel wieder. „der Nazarener“ erhält die Form und die mögliche titelartige Funktion von τοῦ Ναζωραίου besser als die interpretierende Herkunftsangabe „aus Nazaret“.
