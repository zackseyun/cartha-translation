  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: de
  text: Da richtete er seine Aufmerksamkeit auf sie[a] und erwartete, etwas von ihnen zu bekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „achtete aufmerksam auf sie“; auch möglich: „sah sie unverwandt an“.'
    reason: 'Lexikalische Alternative: ἐπέχω kann hier allgemein das aufmerksame Sich-Zuwenden oder konkreter einen anhaltenden Blick bezeichnen.'
lexical_decisions:
- source_word: ὁ δὲ
  choice: Da … er
  rationale: δέ führt die Erzählung mit einer leichten Folgewirkung fort; „Da“ gibt den Anschluss im Deutschen natürlich wieder. ὁ verweist auf den gelähmten Mann.
- source_word: ἐπεῖχεν
  choice: richtete seine Aufmerksamkeit auf
  rationale: ἐπέχω bezeichnet hier das aufmerksame Sich-Zuwenden. Die Imperfektform lässt eine anhaltende Aufmerksamkeit erkennen.
- source_word: αὐτοῖς
  choice: auf sie
  rationale: Das Pronomen bezieht sich auf Petrus und Johannes und wird passend zur deutschen Wendung „die Aufmerksamkeit auf jemanden richten“ wiedergegeben.
- source_word: προσδοκῶν
  choice: erwartete
  rationale: Das Partizip beschreibt die begleitende Erwartung des Mannes; die koordinierte deutsche Formulierung ist natürlich und bewahrt den zeitlichen Zusammenhang.
- source_word: τι
  choice: etwas
  rationale: Das indefinite Pronomen bezeichnet eine nicht näher bestimmte Gabe.
- source_word: παρ’ αὐτῶν
  choice: von ihnen
  rationale: παρά mit Genitiv bezeichnet hier die Quelle dessen, was der Mann zu erhalten erwartet.
- source_word: λαβεῖν
  choice: zu bekommen
  rationale: Im Zusammenhang mit einer erwarteten Gabe ist „bekommen“ natürlich und eindeutig; „nehmen“ könnte eine aktive Aneignung nahelegen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung vermeidet das veraltete „achtgeben“ und lässt offen, ob vor allem Aufmerksamkeit oder der intensive Blick hervorgehoben wird.
