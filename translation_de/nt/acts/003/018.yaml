id: ACT.3.18
reference: Acts 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: de
  text: 'Doch Gott erfüllte auf diese Weise, was er durch den Mund aller Propheten[a] im Voraus angekündigt hatte: dass sein Messias[b] leiden würde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch alle Propheten“. Wörtlicher heißt es im Griechischen: „durch den Mund aller Propheten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „seinen Christus“; hier als „Messias“ wiedergegeben, weil Χριστός als Titel gebraucht wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zwischen dem Handeln der Angesprochenen im vorherigen Vers und Gottes erfüllendem Handeln.
- source_word: προκατήγγειλεν
  choice: im Voraus angekündigt hatte
  rationale: Gibt sowohl den zeitlichen Vorbezug des Präfixes προ- als auch den Charakter einer öffentlichen Ankündigung wieder.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: durch den Mund aller Propheten
  rationale: Bewahrt die konkrete biblische Redeweise des griechischen Textes und gibt πάντων ausdrücklich mit „aller“ wieder.
- source_word: παθεῖν
  choice: dass … leiden würde
  rationale: Drückt den Inhalt der vorausgegangenen Ankündigung natürlich aus, ohne eine im Infinitiv nicht ausdrücklich markierte Notwendigkeit hinzuzufügen.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: sein Messias
  rationale: Χριστός wird hier als Titel gebraucht; „Messias“ erhält den jüdisch-messianischen Zusammenhang der Rede. αὐτοῦ wird als possessive Bestimmung zu χριστόν verstanden.
- source_word: ἐπλήρωσεν
  choice: erfüllte
  rationale: Entspricht dem üblichen Sprachgebrauch für die Erfüllung prophetischer Ankündigungen.
- source_word: οὕτως
  choice: auf diese Weise
  rationale: Bezeichnet die Art und Weise der Erfüllung und bezieht sich auf das zuvor geschilderte Leiden.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Das Wort fungiert hier als Titel. „Messias“ macht diesen Titelcharakter und den jüdischen Kontext von Petrus’ Rede deutlich, ohne eine zusätzliche Auslegung einzutragen.
- issue: Aussagekraft von παθεῖν innerhalb der prophetischen Ankündigung
  choice: dass sein Messias leiden würde
  alternative: dass sein Messias leiden musste
  rationale: Die gewählte Fassung gibt den angekündigten Inhalt wieder, ohne die modale Notwendigkeit stärker auszudrücken, als es der griechische Infinitiv an dieser Stelle für sich genommen tut.
- issue: Bezug von οὕτως
  choice: Gott erfüllte die Ankündigung „auf diese Weise“
  alternative: „so“ lediglich als zusammenfassende Folgerung
  rationale: Die Stellung und der Zusammenhang legen einen Bezug auf die Weise der Erfüllung nahe; die Formulierung lässt den Rückbezug auf das zuvor geschilderte Geschehen bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Wendung „durch den Mund“ bleibt bewusst erhalten; der Doppelpunkt verdeutlicht den Inhalt der vorausgegangenen Ankündigung, ohne die Satzbeziehung auszulegen.
