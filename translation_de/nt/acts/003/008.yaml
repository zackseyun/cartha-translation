source:
  edition: SBLGNT
  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: de
  text: Er sprang auf, stand und ging umher. Dann betrat er mit ihnen den Tempelbereich und ging, sprang und lobte Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: Er sprang auf
  rationale: Das Partizip bezeichnet hier ein Auf- beziehungsweise Emporspringen und leitet unmittelbar zum Stehen und Gehen über.
- source_word: περιεπάτει / περιπατῶν
  choice: begann umherzugehen / ging er umher
  rationale: Das Imperfekt kann den Beginn beziehungsweise den fortdauernden Verlauf des Gehens ausdrücken; die Wiederholung des griechischen Verbs bleibt erkennbar.
- source_word: τὸ ἱερόν
  choice: den Tempelbereich
  rationale: ἱερόν bezeichnet den gesamten heiligen Tempelbezirk, nicht speziell das Tempelgebäude.
- source_word: ἁλλόμενος
  choice: sprang vor Freude
  rationale: Das Verb bedeutet springen oder hüpfen; der Kontext des Lobens legt Freude nahe, ohne den körperlichen Vorgang aufzugeben.
- source_word: αἰνῶν τὸν θεόν
  choice: lobte Gott
  rationale: Direkte und natürliche Wiedergabe der fortdauernden Handlung.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdige Erzählprosa. Die lebhafte Bewegungsfolge des griechischen Textes bleibt erhalten; »Tempelbereich« vermeidet die sachlich zu enge Vorstellung des eigentlichen Heiligtums.
