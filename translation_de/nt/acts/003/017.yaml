id: ACT.3.17
reference: Acts 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: de
  text: Und nun, Brüder[a], ich weiß, dass ihr aus Unwissenheit gehandelt habt, ebenso wie eure führenden Männer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“. Das griechische Wort lautet „Brüder“ und kann hier eine gemischte Gruppe repräsentativ ansprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: Und nun
  rationale: Gibt den fortführenden Übergang καί und das zeitliche νῦν knapp und natürlich wieder.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die wörtliche Anrede im maskulinen Plural; sie kann hier die versammelte Gemeinschaft repräsentativ ansprechen.
- source_word: οἶδα
  choice: ich weiß
  rationale: Direkte und idiomatische Entsprechung der von Petrus behaupteten Kenntnis.
- source_word: κατὰ ἄγνοιαν
  choice: aus Unwissenheit
  rationale: Bezeichnet Unwissenheit als Umstand beziehungsweise Beweggrund des Handelns, ohne damit Schuldlosigkeit zu behaupten.
- source_word: ἐπράξατε
  choice: ihr ... gehandelt habt
  rationale: Gibt das allgemein gehaltene Verb wieder, ohne ein im Vers unausgesprochenes Objekt hinzuzufügen.
- source_word: ὥσπερ καὶ
  choice: ebenso wie
  rationale: Drückt Vergleich und Einbeziehung der führenden Männer in ihrem entsprechenden Handeln natürlich aus.
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: eure führenden Männer
  rationale: Bezeichnet die maßgeblichen Autoritätspersonen im Jerusalemer Kontext; diese Formulierung ist im modernen Deutsch natürlicher als „eure Herrscher“ und konkreter als das breitere „eure Führer“.
theological_decisions:
- issue: Ob die erwähnte Unwissenheit die Handelnden von Schuld freispricht
  choice: „aus Unwissenheit gehandelt“ ohne weiteren entschuldigenden Zusatz
  alternative: „es getan habt, weil ihr es nicht wusstet“
  rationale: Der Vers nennt Unwissenheit als maßgeblichen Umstand, während der folgende Aufruf zur Umkehr Verantwortung voraussetzt. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt nahe am griechischen Aufbau, ohne unnatürlich zu wirken. „Führende Männer“ macht das grammatische Geschlecht der ἄρχοντες sichtbar und bezeichnet Autoritätspersonen im damaligen Jerusalemer Umfeld.
