  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: de
  text: Ihr aber habt den Heiligen und Gerechten verleugnet und darum gebeten, dass euch ein Mörder freigegeben wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „dass euch ein Mörder gewährt wird“; im gerichtlichen Zusammenhang ist seine Freigabe gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Ihr aber
  rationale: δέ setzt einen Gegensatz zum Vorhergehenden, während das ausdrücklich gesetzte ὑμεῖς die Angeredeten hervorhebt. „Ihr aber“ bewahrt beides knapp und natürlich.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: den Heiligen und Gerechten
  rationale: Der Artikel substantiviert die beiden Adjektive zu einer zusammengehörigen Bezeichnung für Jesus. Im Deutschen gibt die Großschreibung der substantivierten Adjektive diese Funktion ohne ein ergänztes „Einen“ wieder.
- source_word: ἠρνήσασθε
  choice: habt … verleugnet
  rationale: ἀρνέομαι bezeichnet hier das Leugnen beziehungsweise Lossagen von Jesus. „Verleugnet“ vermittelt die persönliche und öffentliche Zurückweisung genauer als das allgemeinere „abgelehnt“.
- source_word: ᾐτήσασθε
  choice: verlangt
  rationale: αἰτέω bedeutet bitten oder verlangen. Angesichts der an eine Obrigkeit gerichteten Forderung nach Freigabe ist „verlangt“ im Deutschen natürlich, ohne die Aussage unnötig zu verschärfen.
- source_word: ἄνδρα φονέα
  choice: ein Mörder
  rationale: Die Verbindung bezeichnet idiomatisch einen Mann, der ein Mörder ist. Das natürliche deutsche „ein Mörder“ enthält die männliche Personenbezeichnung bereits und vermeidet die schwerfällige Wiedergabe „einen Mann, einen Mörder“.
- source_word: χαρισθῆναι ὑμῖν
  choice: dass euch … freigegeben wird
  rationale: χαρίζομαι kann bedeuten, jemandem etwas aus Gunst zu gewähren; bei einer in Gewahrsam befindlichen Person bezeichnet es kontextuell deren Freigabe. „Freigegeben“ bewahrt den gerichtlichen Zusammenhang und die Ausrichtung „euch“.
theological_decisions:
- issue: Christologische Funktion von τὸν ἅγιον καὶ δίκαιον
  choice: 'Als substantivierte, zusammengehörige Bezeichnung für Jesus: „den Heiligen und Gerechten“'
  alternative: 'Rein beschreibend: „den heiligen und gerechten Mann“ oder aufgeteilt: „den Heiligen und den Gerechten“'
  rationale: Der eine Artikel umfasst beide Adjektive und bezeichnet eine Person. Die deutsche Substantivierung wahrt die christologische Aussage, ohne zwei getrennte Titel oder das im Griechischen nicht stehende Substantiv „Mann“ einzuführen.
- issue: Gerichtlicher Sinn von χαρισθῆναι
  choice: Kontextuell mit „freigegeben“ wiedergeben
  alternative: 'Formnäher: „gewährt“ oder „geschenkt“'
  rationale: Der Verbalstamm trägt den Gedanken einer Gunstgewährung, doch bei einem Gefangenen ist die konkret gewährte Handlung dessen Freigabe. Die Übersetzung macht den im Kontext notwendigen Bezug verständlich, ohne zusätzliche theologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anklage und der scharfe Gegensatz zwischen Jesus und dem Mörder bleiben erhalten. Das Perfekt klingt in heutiger deutscher Rede natürlicher als das Präteritum und gibt den griechischen Aorist hier angemessen wieder.
