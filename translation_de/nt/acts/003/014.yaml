  to: Ihr aber habt den Heiligen und Gerechten verleugnet und darum gebeten, dass euch ein Mörder freigegeben wird.[a]
  rationale: Die einzige notwendige Änderung ersetzt das semantisch zu starke „verlangt“ durch „darum gebeten“. Die Fußnote macht kenntlich, dass χαρισθῆναι grundsätzlich ein Gewähren als Gunst bezeichnet, während „freigegeben“ den hier gegebenen gerichtlichen Kontext ausdrücklich wiedergibt.
