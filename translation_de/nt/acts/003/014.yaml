    issue: „verlangt“ für ᾐτήσασθε
    rationale: „Verlangen“ kann eine Forderung ausdrücken und verschärft damit die Grundbedeutung von αἰτέω („bitten, ersuchen“). Der Kontext der Bitte an Pilatus rechtfertigt keine solche Verstärkung im Haupttext.
