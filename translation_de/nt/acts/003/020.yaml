  source_fidelity: Der Entwurf gibt die Zweckbindung von ὅπως ἄν sowie die beiden koordinierten Verben angemessen wieder. Bei προκεχειρισμένον bleibt die zeitliche Komponente von προ- im Haupttext jedoch unterbestimmt. Die Apposition „Messias Jesus“ sollte im Deutschen durch Kommas kenntlich gemacht werden.
  naturalness: „Erquickung“ und „vom Angesicht des Herrn“ sind verständlich, wirken zusammen jedoch deutlich bibelsprachlich und nicht durchgängig modern. „Erfrischung aus der Gegenwart des Herrn“ ist modernes Standarddeutsch und wahrt die Bild- und Herkunftsaussage. Die Apposition „der Messias, Jesus“ ist natürlich.
  terminology: „Herr“ und „Messias“ sind sachgerecht. „Für euch zuvor bestimmten“ gibt προκεχειρισμένον ὑμῖν vollständig wieder, ohne eine konfessionell geprägte Lehraussage über Vorherbestimmung einzutragen.
