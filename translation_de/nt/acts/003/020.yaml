id: ACT.3.20
reference: Acts 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: de
  text: damit Zeiten der Erfrischung aus der Gegenwart des Herrn kommen und er den für euch zuvor bestimmten Messias, Jesus, sendet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den euch bestimmten Messias, Jesus“; auch: „den für euch bestimmten Messias, Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: damit
  rationale: Leitet in Verbindung mit dem Konjunktiv einen Zweck- beziehungsweise Folgesatz ein und knüpft an den vorausgehenden Ruf zur Umkehr an.
- source_word: ἔλθωσιν
  choice: kommen
  rationale: Der deutsche Konjunktiv ist nach „damit“ nicht erforderlich; die Abhängigkeit und Offenheit werden durch den damit-Satz ausgedrückt.
- source_word: καιροὶ
  choice: Zeiten
  rationale: Bewahrt die Weite von καιρός, das passende oder bestimmte Zeitabschnitte bezeichnen kann, ohne die eschatologische Einordnung näher festzulegen.
- source_word: ἀναψύξεως
  choice: Erquickung
  rationale: Gibt das Bild von Aufatmen, Erfrischung und neuer Belebung in würdiger, biblisch verständlicher Sprache wieder; „Erholung“ oder „Aufatmen“ wären ebenfalls möglich, aber enger.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: vom Angesicht des Herrn
  rationale: Bewahrt die konkrete Bildsprache von πρόσωπον und bezeichnet zugleich die wirksame Gegenwart des Herrn.
- source_word: ἀποστείλῃ
  choice: sendet
  rationale: Ist mit dem vorherigen Verb durch καί koordiniert und bleibt vom einleitenden „damit“ abhängig.
- source_word: προκεχειρισμένον
  choice: bestimmten
  rationale: Bezeichnet Jesus als den zuvor ausgewählten beziehungsweise eingesetzten Messias; im Deutschen ist „bestimmt“ knapp und natürlich.
- source_word: ὑμῖν
  choice: für euch
  rationale: Gibt den Dativ als Zuordnung beziehungsweise Bestimmung zugunsten der Angeredeten wieder; „euch bestimmten“ bleibt grammatisch ebenfalls möglich.
- source_word: χριστὸν
  choice: Messias
  rationale: χριστός fungiert hier als Titel und wird deshalb sinngemäß als „Messias“ wiedergegeben.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Übliche deutsche Form des Personennamens.
theological_decisions:
- issue: Wiedergabe von χριστόν als Titel oder traditionelle Bezeichnung
  choice: Messias
  alternative: Christus
  rationale: Im Ausdruck „den ... Messias Jesus“ ist χριστός erkennbar Titel; „Messias“ macht dessen Bedeutung und den jüdischen Kontext transparent.
- issue: Bedeutung von προκεχειρισμένον ὑμῖν
  choice: für euch bestimmten
  alternative: euch bestimmten; zuvor für euch bestimmten
  rationale: Das Partizip bezeichnet eine vorausgehende Bestimmung oder Auswahl. Der Haupttext gibt den Kern knapp wieder; die zeitliche Nuance und die mögliche Dativkonstruktion werden in der Fußnote offengehalten.
- issue: Bildhafte oder idiomatische Wiedergabe von ἀπὸ προσώπου τοῦ κυρίου
  choice: vom Angesicht des Herrn
  alternative: aus der Gegenwart des Herrn
  rationale: Die wörtlichere Form bewahrt die biblische Bildsprache, ohne die gemeinte persönliche Gegenwart und Zuwendung des Herrn auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. „Erquickung“ ist leicht gehoben, vermittelt jedoch die Spannweite von Erfrischung, Aufatmen und Belebung prägnanter als engere Alltagswörter.
