review_pass:
  verdict: revise
  source_fidelity: Die Ergänzung „Gott“ bei „wendet euch Gott wieder zu“ ist im griechischen Wortlaut dieses Verses nicht ausgedrückt. πρὸς leitet hier die Zweckbestimmung πρὸς τὸ ἐξαλειφθῆναι ein und bezeichnet nicht das Ziel von ἐπιστρέψατε. Die Ergänzung ist zwar kontextuell naheliegend, macht aber die Satzstruktur missverständlich und geht über den Vers hinaus. Die beiden aktiven Imperative sowie die Zweck-/Folgebeziehung bleiben in der Revision erhalten.
  naturalness: „Tut also Buße und kehrt um“ ist würdiges, gut verständliches modernes Standarddeutsch im biblischen Register. Es gibt die zwei Imperative unterscheidbar wieder, ohne ein im Ausgangstext nicht genanntes Ziel zu ergänzen. „Damit eure Sünden ausgelöscht werden“ ist idiomatisch und bewahrt das passive Bild von ἐξαλειφθῆναι.
  terminology: „Buße tun“ gibt μετανοεῖν in diesem religiös-ethischen Kontext angemessen wieder, ohne den Begriff auf bloßes Umdenken zu reduzieren. „Umkehren“ entspricht ἐπιστρέφειν als aktivem Ruf zur Rückkehr. „Sünden“ und „ausgelöscht werden“ sind treffend; die Formulierung legt keinen weitergehenden dogmatischen Mechanismus fest.
  issues:
  - severity: medium
    issue: Nicht im Wortlaut genannte Ergänzung „Gott“
    rationale: Der griechische Text nennt nach ἐπιστρέψατε kein Objekt bzw. kein Ziel „zu Gott“; πρὸς gehört zur anschließenden Infinitivkonstruktion der Zweckbestimmung. Die Ergänzung ist daher zu streichen.
  revised_text: Tut also Buße und kehrt um, damit eure Sünden ausgelöscht werden.
