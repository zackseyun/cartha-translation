translation:
  language: de
  text: Tut also Buße und kehrt um, damit eure Sünden ausgelöscht werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσατε
  choice: Kehrt … um
  rationale: Der Aorist-Imperativ ruft zu einer entschiedenen Umkehr auf. „Umkehren“ gibt im Deutschen den moralischen und geistlichen Gehalt natürlicher wieder als das zu schwache „ändert eure Meinung“, ohne bereits ausdrücklich „von euren Sünden“ zu ergänzen.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Argumentation; „also“ ist im modernen Deutsch klar und idiomatisch.
- source_word: ἐπιστρέψατε
  choice: wendet euch Gott wieder zu
  rationale: Der aktive Aorist-Imperativ bezeichnet eine Rückwendung. Die Ergänzung „Gott“ macht das im Kontext vorausgesetzte Ziel im Deutschen verständlich; „wieder“ bewahrt den Rückkehraspekt. Dadurch bleibt der zweite Imperativ von „kehrt um“ unterscheidbar.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: damit … ausgelöscht werden
  rationale: Die Präposition mit substantiviertem Infinitiv kann Ziel beziehungsweise Ergebnis ausdrücken. „Damit“ bewahrt diese Verbindung, ohne einen genaueren dogmatischen Mechanismus festzulegen.
- source_word: ἐξαλειφθῆναι
  choice: ausgelöscht werden
  rationale: Der passive Infinitiv von ἐξαλείφω trägt das Bild des vollständigen Entfernens oder Tilgens. „Ausgelöscht“ ist verständlich, bildkräftig und in Verbindung mit Sünden idiomatisch.
- source_word: ἁμαρτίας
  choice: Sünden
  rationale: Direkte und im Deutschen geläufige Wiedergabe des Plurals, ohne ihn auf einzelne Taten zu verengen.
theological_decisions:
- issue: Verhältnis von Umkehr, Hinwendung zu Gott und Vergebung
  choice: Die Ziel- beziehungsweise Ergebnisbeziehung wird mit „damit eure Sünden ausgelöscht werden“ wiedergegeben.
  alternative: Eine stärker kausal klingende Formulierung wie „zur Auslöschung eurer Sünden“ oder eine dogmatisch ausgeführte Aussage über den Heilsvorgang.
  rationale: Der Vers verbindet die gebotene Umkehr und Hinwendung eng mit der Beseitigung der Sünden, entfaltet aber keine vollständige Heilsordnung. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei koordinierten Imperative werden als zusammengehörig, aber nicht bedeutungsgleich wiedergegeben. Keine konfessionell geprägte Formulierung wie „lasst euch bekehren“, da der griechische Text aktive Imperative verwendet.
