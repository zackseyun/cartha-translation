  text: Und das ganze Volk sah ihn gehen und Gott loben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Konjunktion wahrt den fortlaufenden Erzählfluss, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: εἶδεν
  choice: sah
  rationale: Der Aorist von ὁράω bezeichnet hier die Wahrnehmung des geheilten Mannes durch das Volk; „sah“ ist die natürliche und direkte Wiedergabe.
- source_word: πᾶς ὁ λαὸς
  choice: das ganze Volk
  rationale: πᾶς mit singularischem Substantiv und Artikel hat kollektiven Sinn. „Das ganze Volk“ gibt λαός als zusammengehörige Volksmenge wieder und vermeidet die Verengung auf eine bloße Menschenansammlung.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen verweist als Objekt auf den im vorherigen Zusammenhang geheilten Mann.
- source_word: περιπατοῦντα
  choice: wie er umherging
  rationale: Das präsentische Partizip beschreibt die gleichzeitig wahrnehmbare Handlung. „Umherging“ macht das tatsächliche Gehvermögen sichtbar und klingt in der deutschen Satzkonstruktion natürlich.
- source_word: καὶ αἰνοῦντα
  choice: und Gott lobte
  rationale: αἰνέω bezeichnet lobende, hier auf Gott gerichtete Anerkennung. Die finite Form nach „wie“ gibt das koordinierte Partizip idiomatisch wieder.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Der bestimmte Artikel wird im Deutschen beim Eigennamengebrauch von „Gott“ in dieser Konstruktion nicht wiedergegeben.
theological_decisions: []
