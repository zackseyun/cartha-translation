  to: Und aufgrund des Glaubens an seinen Namen[a] hat sein Name selbst diesen Mann gestärkt, den ihr seht und kennt; und der Glaube, der durch ihn kommt, hat ihm vor euch allen diese vollkommene Gesundheit[b] gegeben.
