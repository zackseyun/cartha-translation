id: ACT.3.16
reference: Acts 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: de
  text: Und aufgrund des Glaubens an seinen Namen[a] hat sein Name selbst diesen Mann gestärkt, den ihr seht und kennt; und der Glaube, der durch ihn kommt, hat ihm vor euch allen diese vollkommene Gesundheit[b] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Vertrauens auf seinen Namen“. Das griechische Wort kann „Glaube“, „Vertrauen“ oder in manchen Zusammenhängen „Treue“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „diese vollständige Unversehrtheit“; auch: „diese völlige Heilung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: aufgrund des Glaubens
  rationale: ἐπί mit dem Dativ bezeichnet hier wahrscheinlich Grundlage oder Grund. „Aufgrund des Glaubens“ gibt diesen Zusammenhang deutlicher wieder als ein rein instrumentales „durch Glauben“.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: an seinen Namen
  rationale: Beim Substantiv πίστις wird der Genitiv im Deutschen idiomatisch als „Glaube an“ ausgedrückt. „Name“ bleibt als Bezeichnung für Jesu Person und Vollmacht erhalten.
- source_word: ἐστερέωσεν
  choice: hat … gestärkt
  rationale: Das Verb bedeutet fest oder stark machen. „Gestärkt“ ist natürlich und bezeichnet hier die sichtbar wiederhergestellte körperliche Kraft.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: den ihr seht und kennt
  rationale: Die knappe Wiedergabe erhält sowohl die unmittelbare Wahrnehmung als auch die Vertrautheit der Zuhörer mit dem Mann.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: sein Name selbst
  rationale: Die Wiederholung von „Name“ und der Zusatz „selbst“ bewahren die emphatische Zuschreibung der Heilung an Jesu Namen.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: der Glaube, der durch ihn kommt
  rationale: „Durch ihn kommt“ ist im Deutschen verständlicher als das starre „durch ihn ist“, lässt aber offen, ob Jesus den Glauben vermittelt oder hervorbringt.
- source_word: ὁλοκληρίαν
  choice: vollkommene Gesundheit
  rationale: Das seltene Substantiv bezeichnet vollständige körperliche Unversehrtheit oder Gesundheit. Im Heilungskontext ist „vollkommene Gesundheit“ präzise und natürlich.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: vor euch allen
  rationale: Die Formulierung bringt die öffentliche und für alle Anwesenden sichtbare Natur der Heilung knapp zum Ausdruck.
theological_decisions:
- issue: Glaube an den Namen und durch Jesus
  choice: Die Formulierungen nennen keinen menschlichen Träger des Glaubens und lassen Jesus als dessen Vermittler oder Ursprung offen.
  alternative: Der Glaube des Geheilten; der Glaube der Apostel; von Jesus hervorgebrachter Glaube.
  rationale: Der griechische Text bestimmt nicht ausdrücklich, wessen Glaube gemeint ist. Diese theologische Spannung darf nicht durch einen ergänzten Besitzer aufgelöst werden.
- issue: Der Name als wirksames Subjekt
  choice: „Sein Name selbst“ bleibt als Subjekt der Stärkung erhalten.
  alternative: „Jesus selbst“ oder „die Macht seines Namens“.
  rationale: Lukas verwendet „Name“ als theologisch gewichtige Bezeichnung für Jesu Person und Vollmacht. Eine Auflösung in „Jesus“ oder „Macht“ würde die markante Wiederholung des Ausgangstextes einebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wiederholung von „Name“ wird bewusst bewahrt. Der komplexe griechische Satzbau wird leicht gegliedert, ohne die doppelte Aussage über Glauben und Jesu Namen zusammenzuziehen.
