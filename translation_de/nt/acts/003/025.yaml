id: ACT.3.25
reference: Acts 3:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: de
  text: 'Ihr seid die Söhne der Propheten[a] und des Bundes, den Gott mit euren Vorfahren geschlossen hat, als er zu Abraham sagte: »Und in deinem Nachkommen[b] werden alle Familien der Erde gesegnet werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Söhne«; hier ein Ausdruck für diejenigen, die am Erbe der prophetischen Verheißungen teilhaben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in deiner Nachkommenschaft«. Das griechische Wort kann kollektiv Abrahams Nachkommenschaft bezeichnen und zugleich einen repräsentativen Einzelnen im Blick behalten.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: Söhne
  rationale: Die maskuline Form wird beibehalten; im Zusammenhang bezeichnet sie Menschen, die an der prophetischen Verheißung und ihrem Erbe teilhaben, nicht notwendig leibliche Söhne.
- source_word: προφητῶν
  choice: der Propheten
  rationale: Der Genitiv wird direkt wiedergegeben. Gemeint ist die Zugehörigkeit zur Überlieferungs- und Verheißungslinie der Propheten.
- source_word: διαθήκης
  choice: des Bundes
  rationale: Im Zusammenhang der Abrahamverheißung ist »Bund« die sachlich und sprachlich angemessene Wiedergabe.
- source_word: διέθετο ὁ θεὸς
  choice: den Gott ... geschlossen hat
  rationale: Die idiomatische deutsche Verbindung lautet »einen Bund schließen« und gibt das griechische διατίθεμαι mit διαθήκη natürlich wieder.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: mit euren Vorfahren
  rationale: »Mit« entspricht der deutschen Wendung »einen Bund mit jemandem schließen«; »Vorfahren« vermittelt hier den Bezug auf die patriarchalischen Ahnen natürlicher und umfassender als »Väter«.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: als er zu Abraham sagte
  rationale: Der griechische Partizipialsatz wird als natürlicher deutscher Nebensatz wiedergegeben und führt den Inhalt des Bundesschlusses ein.
- source_word: σπέρματί
  choice: Nachkommen
  rationale: »Nachkomme« kann im Deutschen als singularische Kollektivbezeichnung verstanden werden und bewahrt damit die mögliche kollektive wie repräsentativ-singularische Bedeutung.
- source_word: ἐν τῷ σπέρματί σου
  choice: durch deinen Nachkommen
  rationale: Das griechische ἐν kann in diesem Segenszusammenhang vermittelnde beziehungsweise instrumentale Bedeutung haben; »durch« ergibt klares modernes Deutsch.
- source_word: ἐνευλογηθήσονται
  choice: werden ... gesegnet werden
  rationale: Das Futur Passiv wird direkt wiedergegeben.
- source_word: πατριαὶ
  choice: Familien
  rationale: πατριά bezeichnet Familienverbände oder Sippen; »Familien« ist verständlich und bewahrt die breite Reichweite der Verheißung.
- source_word: γῆς
  choice: Erde
  rationale: Der universale Umfang der Abrahamverheißung spricht hier für »Erde« statt des engeren »Land«.
theological_decisions:
- issue: Repräsentativ-maskuline Sprache in υἱοὶ
  choice: Söhne
  alternative: Kinder
  rationale: »Söhne« bewahrt die Form und den Erbanspruch der Bundesrede. Eine Fußnote erläutert, dass der Ausdruck repräsentativ verstanden werden kann und nicht auf männliche Personen beschränkt werden muss.
- issue: Bedeutungsumfang von σπέρμα
  choice: Nachkomme
  alternative: Nachkommenschaft; Same
  rationale: Der singularische deutsche Ausdruck lässt sowohl einen kollektiven Bezug auf Abrahams Nachkommenschaft als auch einen repräsentativen Einzelbezug offen, ohne die Spannung dogmatisch aufzulösen.
- issue: Bedeutung von ἐν in der Abrahamverheißung
  choice: durch
  alternative: in
  rationale: »Durch« gibt die wahrscheinlich vermittelnde Bedeutung in natürlichem Deutsch wieder. Die wörtlichere Wiedergabe »in« bleibt als Fußnotenalternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde behutsam geglättet; zentrale Bundesbegriffe und die Mehrdeutigkeit der Abrahamverheißung bleiben erhalten.
