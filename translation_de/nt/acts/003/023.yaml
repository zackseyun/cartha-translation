review_pass:
  verdict: approve
  source_fidelity: Der Haupttext gibt πᾶσα ψυχή idiomatisch als „jeder“ wieder, bewahrt die indefinite Bedingung („der nicht … hört“), verweist zutreffend auf den bestimmten zuvor genannten Propheten und gibt das starke futurische Passiv ἐξολεθρευθήσεται mit „wird … ausgerottet werden“ angemessen wieder. „Aus dem Volk“ erhält die gemeinschaftliche Bezugsgröße von ἐκ τοῦ λαοῦ, ohne eine bestimmte Ausgestaltung des Gerichts festzulegen.
  naturalness: „Doch jeder, der nicht auf diesen Propheten hört, wird aus dem Volk ausgerottet werden“ ist verständliches, würdiges modernes Standarddeutsch. Die Verbindung „auf jemanden hören“ trägt hier natürlich auch den Aspekt des Befolgens beziehungsweise Beachtens.
  terminology: „Propheten“ bleibt sinnvoll klein geschrieben, da die Großschreibung eine zusätzliche interpretierende Titelfestlegung wäre. „Ausgerottet“ gibt die besondere Intensität von ἐξολεθρεύω besser wieder als bloßes „vernichtet“ oder „beseitigt“ und bestimmt weder Zeitpunkt noch genaue Art des Gerichts. Die Fußnote bietet mit „beseitigt“ eine zulässige, wenn auch schwächere lexikalische Umschreibung; ihr Anker ist korrekt gesetzt.
