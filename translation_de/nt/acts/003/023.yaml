id: ACT.3.23
reference: Acts 3:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: de
  text: Doch jeder, der nicht auf diesen Propheten hört, wird aus dem Volk ausgerottet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird aus dem Volk beseitigt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: jeder
  rationale: Die Wendung bedeutet in diesem idiomatischen Gebrauch jede einzelne Person. „Jeder“ ist im modernen Deutschen natürlich und vermeidet die mögliche anthropologische Überdeutung von „jede Seele“.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: der nicht … hört
  rationale: Die unbestimmte Relativkonstruktion bezeichnet jeden, auf den die Bedingung zutrifft. „Auf jemanden hören“ umfasst im Deutschen sowohl das Hören als auch das gehorsame Beachten.
- source_word: τοῦ προφήτου ἐκείνου
  choice: auf diesen Propheten
  rationale: Der Ausdruck verweist auf den zuvor genannten Propheten wie Mose. „Diesen“ stellt den rückbezüglichen Zusammenhang im Deutschen klar; die Kleinschreibung von „Propheten“ vermeidet die Einführung eines im Griechischen nicht eigens markierten Titels.
- source_word: ἐξολεθρευθήσεται
  choice: wird … ausgerottet werden
  rationale: Das starke Verb bezeichnet vollständige Beseitigung oder Vernichtung. „Ausgerottet werden“ bewahrt die Schärfe sowie die passive Form, ohne Art und Zeitpunkt des Gerichts näher festzulegen.
- source_word: ἐκ τοῦ λαοῦ
  choice: aus dem Volk
  rationale: Die Präposition bezeichnet die Entfernung aus der Mitte des Volkes. In Verbindung mit „ausrotten“ ist „aus dem Volk“ idiomatisch und wahrt zugleich den gemeinschaftlichen Bezug.
theological_decisions:
- issue: Art des angedrohten Gerichts in der Anführung beziehungsweise Anspielung auf 5. Mose 18,19
  choice: Die Warnung wird als Ausrottung aus dem Volk wiedergegeben, ohne das Gericht zeitlich oder seiner Art nach näher zu bestimmen.
  alternative: Ausschluss aus der Bundesgemeinschaft oder endgültiges göttliches Gericht
  rationale: Der Vers kündigt ein schweres Gericht über den an, der nicht auf den Propheten hört, legt aber nicht eindeutig fest, ob dieses ausschließlich zeitlich, gemeinschaftlich oder endgerichtlich zu verstehen ist. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „auf diesen Propheten hört“ ist verständlich und lässt den Sinn des gehorsamen Hörens mitschwingen. „Ausgerottet“ bewahrt die ungewöhnliche Stärke des griechischen Verbs; die Fußnote bietet eine etwas weniger festgelegte lexikalische Alternative.
