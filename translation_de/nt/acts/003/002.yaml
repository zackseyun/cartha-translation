source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: de
  text: Ein Mann, der von Geburt an gelähmt war[b], wurde herbeigetragen; man setzte ihn Tag für Tag an das Tor der Tempelanlage[a], das „das Schöne Tor“ genannt wurde[c], um die Eintretenden um Almosen zu bitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet hier die gesamte Tempelanlage, nicht nur das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „aus dem Schoß seiner Mutter“, das heißt: von Geburt an.'
    reason: lexical_alternative
  - marker: c
    text: Der Name des Tores bedeutet wörtlich „schön“.
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: ein Mann
  rationale: τις bezeichnet eine unbestimmte, aber konkrete Person. Im modernen Deutschen genügt der unbestimmte Artikel; „ein gewisser Mann“ klänge unnötig markiert.
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: der von Geburt an gelähmt war
  rationale: Die idiomatische deutsche Wendung „von Geburt an“ gibt ἐκ κοιλίας μητρὸς αὐτοῦ natürlich wieder; „gelähmt“ bezeichnet hier seine dauerhafte Gehbehinderung, ohne die heute abwertend wirkende Bezeichnung „lahm“ zu verwenden.
- source_word: ἐβαστάζετο
  choice: wurde herbeigetragen
  rationale: Das Imperfekt beschreibt den laufenden beziehungsweise wiederholten Vorgang. „Herbeigetragen“ passt zum Zielort und ist im Deutschen natürlicher als eine progressive Umschreibung.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: Tag für Tag setzte man ihn
  rationale: Das Imperfekt und καθ’ ἡμέραν bezeichnen eine gewohnheitsmäßige, täglich wiederholte Handlung. Das unbestimmte pluralische Subjekt wird idiomatisch mit „man“ wiedergegeben.
- source_word: θύραν τοῦ ἱεροῦ
  choice: Tor des Tempels
  rationale: θύρα bezeichnet in diesem architektonischen Zusammenhang ein Tor. ἱερόν meint die Tempelanlage, was in einer Fußnote erläutert wird.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: das sogenannte Schöne Tor
  rationale: Ὡραία ist die Bezeichnung des Tores. „Schönes Tor“ bewahrt die wörtliche Bedeutung und bildet im Deutschen eine verständliche Namensform.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: damit er … um ein Almosen bat
  rationale: Der substantivierte Infinitiv drückt den Zweck aus. „Um ein Almosen bitten“ ist die etablierte deutsche Wendung; das Imperfekt „bat“ entspricht dem wiederholten Geschehen.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: die Menschen, die in den Tempel gingen
  rationale: Das Partizip bezeichnet die gerade Eintretenden. „Menschen“ macht den Bezug im deutschen Relativsatz klar und schließt keine Personengruppe aus.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die lange griechische Satzperiode wurde zur Klarheit in zwei Sätze gegliedert. Das heute häufig abwertend empfundene „lahm“ wurde vermieden; „gelähmt“ bleibt sachlich, ohne die Heilung vorwegzunehmen.
