revisions:
- from: Ein Mann, der von Geburt an gelähmt war, wurde herbeigetragen. Tag für Tag setzte man ihn an das sogenannte Schöne Tor des Tempels[a], damit er die Menschen, die in den Tempel gingen, um ein Almosen bat.[b]
  to: Ein Mann, der von Geburt an gelähmt war[b], wurde herbeigetragen; man setzte ihn Tag für Tag an das Tor der Tempelanlage[a], das „das Schöne Tor“ genannt wurde[c], um die Eintretenden um Almosen zu bitten.
  rationale: Die Revision stellt die finale Funktion von τοῦ αἰτεῖν mit „um ... zu bitten“ korrekt und flüssig her. Sie markiert Ὡραία neutral als Torname und setzt die vorhandene Fußnote zur Geburt unmittelbar an die entsprechende Wendung. Die Satzglieder bleiben in der Reihenfolge und Bedeutung des griechischen Textes erhalten; die Aufteilung bzw. Umformung in einen deutschen Hauptsatz mit Semikolon dient nur der natürlichen Lesbarkeit.
