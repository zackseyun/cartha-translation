source:
  edition: SBLGNT
  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: de
  text: Und er fasste ihn an der rechten Hand und richtete ihn auf. Sofort wurden seine Füße und Knöchel stark.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιάσας
  choice: fasste … an
  rationale: Das Aoristpartizip beschreibt die der Haupthandlung vorausgehende körperliche Berührung. „Anfassen“ ist im helfenden Zusammenhang natürlich und vermeidet den härteren Klang von „ergreifen“ oder „packen“.
- source_word: τῆς δεξιᾶς χειρός
  choice: an der rechten Hand
  rationale: Der Genitiv nach πιάσας bezeichnet den Körperteil, an dem er ihn fasste. Die deutsche Formulierung ist idiomatisch; wessen rechte Hand gemeint ist, ergibt sich eindeutig aus dem Zusammenhang.
- source_word: ἤγειρεν αὐτόν
  choice: richtete ihn auf
  rationale: ἐγείρω bezeichnet hier das körperliche Aufrichten des Mannes. „Richtete ihn auf“ bewahrt die konkrete Handlung und ist im modernen Deutschen natürlicher als „erhob ihn“.
- source_word: παραχρῆμα
  choice: sofort
  rationale: Das Adverb hebt den unverzüglichen Eintritt der körperlichen Veränderung hervor. „Sofort“ ist prägnant und gegenwartssprachlich.
- source_word: ἐστερεώθησαν
  choice: wurden … kräftig
  rationale: Das Passiv beschreibt, dass die betreffenden Körperteile Festigkeit beziehungsweise Kraft erhielten. „Wurden kräftig“ klingt im Deutschen körperbezogen natürlicher als „wurden gestärkt“, ohne einen Handelnden ausdrücklich einzufügen.
- source_word: αἱ βάσεις αὐτοῦ
  choice: seine Füße
  rationale: βάσεις bezeichnet hier die tragenden Körperteile, also die Füße. Eine wörtliche Wiedergabe als „Basen“ wäre unverständlich, „Fußsohlen“ wäre anatomisch zu eng.
- source_word: τὰ σφυδρά
  choice: Knöchel
  rationale: Das seltene anatomische Wort bezeichnet den Bereich der Knöchel beziehungsweise Fußgelenke. „Knöchel“ ist die natürliche und hinreichend genaue deutsche Wiedergabe.
theological_decisions:
- issue: Art der Heilungsbeschreibung
  choice: Die unmittelbare körperliche Kräftigung wird konkret berichtet, ohne den Vorgang mit „geheilt“ zu umschreiben oder den Handelnden im Passiv ausdrücklich zu benennen.
  alternative: „wurden geheilt“ oder „Gott stärkte seine Füße und Knöchel“
  rationale: Der griechische Text beschreibt die körperliche Wirkung und lässt die göttliche Urheberschaft aus dem Zusammenhang hervorgehen. Die Übersetzung fügt keine Erklärung des Wunderwirkens hinzu.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die zwei Hauptsätze bilden die Abfolge von helfender Handlung und augenblicklicher körperlicher Wirkung deutlich ab; die seltenen anatomischen Ausdrücke werden ohne unnötige Fachsprache wiedergegeben.
