id: ACT.3.13
reference: Acts 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: de
  text: Der Gott Abrahams, Isaaks und Jakobs, der Gott unserer Väter, hat seinen Diener Jesus[a] verherrlicht. Ihn habt ihr ausgeliefert und vor Pilatus verleugnet, obwohl dieser entschieden hatte, ihn freizulassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Kind Jesus“. Das griechische Wort kann sowohl „Kind“ als auch „Diener“ bedeuten. Hier ist wahrscheinlich Gottes Diener im Sinne der Gottesknecht-Texte bei Jesaja gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Der Gott Abrahams, Isaaks und Jakobs
  rationale: Bewahrt die Bundesformel aus 2. Mose 3,6 in natürlichem, würdigem Deutsch. Die wiederholte griechische Konjunktion wird gemäß üblichem deutschen Aufzählungsstil wiedergegeben.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: der Gott unserer Väter
  rationale: Die wörtliche und biblisch geprägte Wendung erhält den patriarchalischen und heilsgeschichtlichen Klang von πατέρων.
- source_word: ἐδόξασεν
  choice: hat … verherrlicht
  rationale: Das deutsche Perfekt passt natürlich zur Rede und bringt die fortdauernde Bedeutung der vollzogenen Handlung zum Ausdruck; „verherrlicht“ bewahrt das theologische Gewicht von δοξάζω.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: seinen Diener Jesus
  rationale: παῖς kann „Kind“ oder „Diener“ bedeuten. „Diener“ entspricht hier wahrscheinlich der Anspielung auf den Gottesknecht bei Jesaja, ohne die lexikalische Alternative zu verschweigen.
- source_word: παρεδώκατε
  choice: habt … ausgeliefert
  rationale: „Ausliefern“ gibt die Übergabe an die Obrigkeit im gerichtlichen Zusammenhang idiomatisch und präzise wieder, ohne wie „verraten“ ein engeres Motiv einzutragen.
- source_word: ἠρνήσασθε
  choice: verleugnet
  rationale: „Verleugnen“ ist eine direkte, im neutestamentlichen Sprachgebrauch vertraute Wiedergabe von ἀρνέομαι und passt zur öffentlichen Zurückweisung Jesu.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: vor Pilatus
  rationale: Gibt die griechische Wendung „vor dem Angesicht des Pilatus“ knapp und idiomatisch als öffentliches Auftreten in seiner Gegenwart wieder.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: obwohl dieser entschieden hatte, ihn freizulassen
  rationale: Der Genitivus absolutus ist grammatisch zeitlich oder konzessiv deutbar. Im Kontext hebt die konzessive Wiedergabe den Gegensatz zwischen der Verleugnung durch die Angesprochenen und Pilatus’ Freilassungsentscheidung natürlich hervor.
theological_decisions:
- issue: Wiedergabe von παῖς als Bezeichnung Jesu
  choice: Diener
  alternative: Kind
  rationale: Der wahrscheinliche Bezug auf die Gottesknecht-Texte Jesajas spricht für „Diener“. Da παῖς tatsächlich auch „Kind“ bedeuten kann, wird diese genuine lexikalische Mehrdeutigkeit in einer Fußnote bewahrt.
- issue: Aspekt und deutsche Zeitform von ἐδόξασεν
  choice: hat verherrlicht
  alternative: verherrlichte
  rationale: Das griechische Aorist bezeichnet die vollzogene Handlung, schreibt aber keine deutsche Zeitform zwingend vor. Das Perfekt ist in moderner deutscher Rede natürlich und lässt die gegenwärtige Bedeutung von Gottes Handeln hervortreten, ohne zusätzlichen Lehrgehalt einzutragen.
- issue: Verhältnis des Genitivus absolutus κρίναντος ἐκείνου zur Haupthandlung
  choice: 'konzessiv: obwohl dieser entschieden hatte'
  alternative: 'temporal: als dieser entschieden hatte'
  rationale: Die griechische Konstruktion markiert das Verhältnis nicht ausdrücklich. Der Kontext legt den Gegensatz nahe, weshalb „obwohl“ im Deutschen klar und natürlich ist; die temporale Analyse bleibt grammatisch möglich.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, biblisch anschlussfähigem Ton. Der Satz wurde zur besseren Verständlichkeit geteilt. „Väter“, „verherrlicht“ und „verleugnet“ erhalten den heilsgeschichtlichen beziehungsweise theologischen Sprachklang, ohne altertümlich zu wirken.
