  text: ἀτενίσας δὲ Πέτρος εἰς αὐτὸν σὺν τῷ Ἰωάννῃ εἶπεν· Βλέψον εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: de
  text: 'Da sah Petrus ihn zusammen mit Johannes eindringlich an und sagte: »Sieh uns an!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: sah … eindringlich an
  rationale: Das Partizip bezeichnet einen konzentrierten, anhaltenden Blick. »Eindringlich ansehen« bewahrt diese Intensität in natürlichem modernem Deutsch, ohne die mögliche negative Färbung von »anstarren«.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung ohne deutlichen Gegensatz weiter. »Da« stellt im Deutschen einen natürlichen narrativen Anschluss her.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: zusammen mit Johannes
  rationale: σύν mit Dativ bezeichnet Begleitung; »zusammen mit Johannes« gibt diese ausdrücklich wieder.
- source_word: εἶπεν
  choice: sagte
  rationale: Die gewöhnliche Bedeutung von λέγω passt hier unmittelbar und idiomatisch.
- source_word: Βλέψον
  choice: Sieh … an
  rationale: Der Aoristimperativ fordert unmittelbar zu gezielter Aufmerksamkeit auf. »Sieh uns an!« ist im Deutschen klarer und natürlicher als das bloße »Sieh zu uns«.
- source_word: εἰς ἡμᾶς
  choice: uns
  rationale: Bei einem Verb des Sehens kennzeichnet εἰς das Ziel des Blicks; im Deutschen wird dies idiomatisch durch das trennbare Verb »jemanden ansehen« ausgedrückt.
- source_word: εἰς αὐτόν
  choice: ihn
  rationale: Mit ἀτενίζω bezeichnet εἰς das Ziel des konzentrierten Blicks; »ihn eindringlich ansehen« gibt dies natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »ansehen« spiegelt die beiden griechischen Verben des gerichteten Sehens verständlich wider; »eindringlich« unterscheidet den intensiven Blick des Petrus vom anschließenden direkten Befehl.
