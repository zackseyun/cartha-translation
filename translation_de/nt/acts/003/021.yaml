id: ACT.3.21
reference: Acts 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: de
  text: Ihn muss der Himmel bis zu den Zeiten der Wiederherstellung von allem aufnehmen, wovon Gott von alters her durch den Mund seiner heiligen Propheten gesprochen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihn muss der Himmel bis zu den Zeiten aufnehmen, in denen alles wiederhergestellt wird, was Gott von alters her durch den Mund seiner heiligen Propheten gesagt hat.«'
    reason: Die Genitivform ὧν kann als Angleichung an πάντων verstanden werden. Die Fußnote bewahrt diese mögliche Konstruktion, ohne die Hauptfassung auf sie festzulegen.
lexical_decisions:
- source_word: δεῖ ... δέξασθαι
  choice: muss ... aufnehmen
  rationale: Gibt die im Griechischen ausgedrückte Notwendigkeit und das Aufnehmen bzw. Beherbergen im Himmel klar und ohne zusätzliche Deutung wieder.
- source_word: ἄχρι χρόνων
  choice: bis zu den Zeiten
  rationale: Bewahrt den Plural des Ausgangstextes und bezeichnet den Endpunkt des himmlischen Aufnehmens.
- source_word: ἀποκαταστάσεως πάντων
  choice: in denen alles wiederhergestellt wird
  rationale: Formuliert die nominale Wendung in natürlichem Deutsch, ohne den umfassenden Bezug von πάντων einzuschränken. ἀποκατάστασις kann Wiederherstellung oder Wiederaufrichtung bezeichnen.
- source_word: ἐλάλησεν
  choice: angekündigt hat
  rationale: Im Zusammenhang prophetischer Rede bezeichnet das Verb Gottes gesprochenes Ankündigen; die Wiedergabe stellt keine nähere inhaltliche Erfüllungstheorie auf.
- source_word: διὰ στόματος
  choice: durch den Mund
  rationale: Bewahrt das biblische Bild, wonach Gott durch prophetische Sprecher redet.
- source_word: ἀπ’ αἰῶνος
  choice: von alters her
  rationale: Gibt die zeitliche Bedeutung idiomatisch und in würdigem modernem Deutsch wieder.
theological_decisions:
- issue: Umfang der Wiederherstellung
  choice: alles
  alternative: alle Dinge / das All
  rationale: πάντων bleibt umfassend und unbestimmt; der Text wird weder auf eine universale Heilslehre festgelegt noch auf bestimmte geschichtliche Gegenstände begrenzt.
- issue: Bezug des Relativpronomens ὧν
  choice: alles ... was Gott ... angekündigt hat
  alternative: alles ... wovon Gott ... gesprochen hat
  rationale: Die griechische Genitivform kann als Angleichung an πάντων verstanden werden. Die Hauptfassung bewahrt den engen Bezug zu dem von Gott prophetisch Angekündigten; die Fußnote nennt die ebenfalls mögliche relationale Lesart.
- issue: Zeitlicher Bezug von ἀπ’ αἰῶνος
  choice: Gott hat von alters her durch seine heiligen Propheten angekündigt
  alternative: seine heiligen Propheten von alters her
  rationale: Die Stellung erlaubt eine enge Verbindung mit den Propheten, doch sachlich bezeichnet die Wendung zugleich den seit alter Zeit ergehenden prophetischen Redegang. Die deutsche Wortstellung lässt den Zeitbezug hinreichend offen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfolge hält Christus als vorangestelltes Objekt fest und bewahrt das Bild vom Himmel, der ihn aufnimmt. Der Fußnotenmarker [a] steht im Haupttext.
