revisions:
- from: Den muss der Himmel aufnehmen bis zu den Zeiten, in denen alles wiederhergestellt wird, was Gott von alters her durch den Mund seiner heiligen Propheten angekündigt hat.[a]
  to: Ihn muss der Himmel bis zu den Zeiten der Wiederherstellung von allem aufnehmen, wovon Gott von alters her durch den Mund seiner heiligen Propheten gesprochen hat.[a]
  rationale: Die Revision ersetzt die interpretierende Wiedergabe »angekündigt hat« durch das quellentreuere »gesprochen hat« und bildet die griechische Nominalgruppe »Zeiten der Wiederherstellung von allem« sowie die mögliche relationale Verbindung von ὧν genauer nach. Die alternative syntaktische Deutung bleibt in einer Fußnote dokumentiert.
