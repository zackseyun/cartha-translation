review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von δεῖ, δέξασθαι, ἄχρι χρόνων, ἀποκατάστασις πάντων und διὰ στόματος ist grundsätzlich zutreffend. »angekündigt hat« verengt jedoch ἐλάλησεν („sprach“) unnötig auf prophetische Ankündigung. Die Konstruktion des Genitiv-Relativpronomens ὧν ist syntaktisch umstritten und sollte in der Hauptfassung möglichst nah am griechischen Bezug erhalten bleiben.
  naturalness: Der Entwurf ist gut verständlich und registergerecht. »bis zu den Zeiten der Wiederherstellung von allem« ist dabei ebenso natürlich wie die umschreibende Fassung und bildet die Nominalkonstruktion des Ausgangstextes genauer ab.
  terminology: »Wiederherstellung« ist für ἀποκατάστασις angemessen und lässt den Umfang von πάντων offen. »Durch den Mund seiner heiligen Propheten« bewahrt die biblische Ausdrucksweise. Für ἐλάλησεν ist »gesprochen hat« die unmarkierte, quellentreue Wahl.
  issues:
  - severity: medium
    issue: »angekündigt hat« für ἐλάλησεν
    rationale: Das Verb bedeutet hier zunächst „sprach“ und enthält nicht von sich aus die engere Aussage eines Ankündigens. Die Änderung zu »gesprochen hat« vermeidet eine nicht ausdrücklich markierte Einengung.
  - severity: low
    issue: Haupttext paraphrasiert die Genitivkonstruktion stärker als nötig
    rationale: »in denen alles wiederhergestellt wird, was Gott ... angekündigt hat« ist möglich, verschiebt aber die nominale Struktur und verbindet das Relativpronomen stärker mit »alles«. Die Hauptfassung kann die relationale Lesart unmittelbar wiedergeben; die alternative Konstruktion wird als Fußnote erhalten.
  revised_text: Ihn muss der Himmel bis zu den Zeiten der Wiederherstellung von allem aufnehmen, wovon Gott von alters her durch den Mund seiner heiligen Propheten gesprochen hat.[a]
