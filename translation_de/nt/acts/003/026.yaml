source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: de
  text: Für euch zuerst[a] hat Gott seinen Diener[b] erweckt und ihn gesandt, um euch zu segnen, indem er jeden von euch von euren bösen Wegen abbringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erweckt“ kann hier auch bedeuten, dass Gott seinen Diener hat auftreten lassen oder ihn berufen hat; es muss nicht ausdrücklich die Auferweckung von den Toten bezeichnen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „sein Kind“. Das griechische Wort παῖς kann „Diener“ oder „Kind“ bedeuten; hier klingt wahrscheinlich das Bild des Gottesknechts bei Jesaja an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: Für euch zuerst
  rationale: Die Dativverbindung bezeichnet die zuerst bedachte Empfängergruppe und bewahrt die heilsgeschichtliche Priorität der angesprochenen jüdischen Zuhörer.
- source_word: ἀναστήσας
  choice: erweckt
  rationale: Das deutsche „erweckt“ lässt ähnlich wie das griechische Verb sowohl die Auferweckung als auch das Auftretenlassen beziehungsweise Hervorbringen eines von Gott gesandten Retters anklingen.
- source_word: τὸν παῖδα αὐτοῦ
  choice: seinen Diener
  rationale: „Diener“ entspricht hier wahrscheinlich dem Hintergrund des Gottesknechts bei Jesaja; „Kind“ ist lexikalisch möglich, während „Sohn“ den Ausdruck zu stark festlegen würde.
- source_word: ἀπέστειλεν
  choice: gesandt
  rationale: Die schlichte Wiedergabe erhält den Sendungsgedanken, ohne eine förmliche Beauftragung zusätzlich einzutragen.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: um euch zu segnen
  rationale: Die finale Formulierung gibt die mit der Sendung verbundene Absicht beziehungsweise Wirkung in natürlichem Deutsch wieder.
- source_word: ἐν τῷ ἀποστρέφειν
  choice: indem er … abbringt
  rationale: Die Konstruktion bezeichnet hier das Mittel oder die Weise des Segnens. „Abbringen“ bewahrt die transitive Aussage, dass der gesandte Diener die Menschen vom Bösen wegwendet.
- source_word: ἕκαστον
  choice: jeden von euch
  rationale: Diese Formulierung macht die verteilende Bedeutung deutlich und bezieht sie natürlich auf die Angesprochenen.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: von seinen bösen Wegen
  rationale: Das Possessivpronomen bezieht sich distributiv auf „jeden“. „Böse Wege“ gibt den Plural als konkrete, umfassende Ausdrucksformen des Bösen idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von ἀναστήσας in Bezug auf Jesus
  choice: „erweckt“ bleibt im Haupttext ohne nähere Festlegung
  alternative: „von den Toten auferweckt“ oder „auftreten lassen/berufen“
  rationale: Der griechische Ausdruck kann im Kontext an die Auferweckung Jesu denken lassen, zugleich aber an Gottes Verheißung, einen Propheten beziehungsweise Diener auftreten zu lassen. Die Übersetzung erhält diese Spannung.
- issue: Christologische Nuance von παῖς
  choice: Diener
  alternative: Kind; Sohn
  rationale: „Diener“ bewahrt am ehesten den wahrscheinlichen Bezug zum Gottesknecht bei Jesaja. „Kind“ bleibt lexikalisch möglich; „Sohn“ würde eine spezifischere Aussage eintragen, als der griechische Ausdruck an dieser Stelle ausdrücklich macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält „Für euch zuerst“ betont am Anfang. „Erweckt“ wahrt die Mehrdeutigkeit des griechischen Ausdrucks; „abbringen“ vermeidet die mögliche Fehlannahme, jeder Einzelne wende sich hier ausschließlich aus eigener Initiative ab.
