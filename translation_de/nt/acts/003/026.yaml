  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Von seinen bösen Wegen“ kann wegen des Subjekts „er“ missverständlich auf den Diener bezogen werden und ist zudem nicht die pluralische Anrede des Ausgangstextes. „Von euren bösen Wegen“ ist klar und natürlich.
