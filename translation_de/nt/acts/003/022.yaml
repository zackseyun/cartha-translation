revisions:
- from: 'Mose hat ja gesagt: »Der Herr, Gott, wird euch aus euren Brüdern[a] einen Propheten wie mich erwecken.[b] Auf ihn sollt ihr hören in allem, was er zu euch sagt.«'
  to: 'Mose hat nämlich gesagt: »Gott, der Herr, wird euch aus euren Brüdern[a] einen Propheten wie mich erwecken.[b] Auf ihn sollt ihr hören in allem, was er zu euch sagt.«'
  rationale: 'Die Revision verbessert zwei sichere stilistisch-semantische Punkte, ohne den Sinn zu verändern: μέν wird als nachvollziehbarer Diskursanschluss mit „nämlich“ wiedergegeben, und κύριος ὁ θεός erhält mit „Gott, der Herr“ eine natürliche deutsche Form. Die fehlende Possessivbestimmung „euer“ bleibt weiterhin unergänzt. Textumfang, Zitatcharakter, Ambiguität von „Brüdern“ und der nicht ausdrücklich messianisch gemachte Ausdruck „einen Propheten“ bleiben erhalten.'
