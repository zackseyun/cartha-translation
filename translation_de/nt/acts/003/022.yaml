  variant: modern standard German
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: de
  text: 'Mose hat nämlich gesagt: »Gott, der Herr, wird euch aus euren Brüdern[a] einen Propheten wie mich erwecken.[b] Auf ihn sollt ihr hören in allem, was er zu euch sagt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier im Sinn von „aus euren israelitischen Volksgenossen“ verstanden werden; wörtlich steht „aus euren Brüdern“.
    reason: lexical_alternative
  - marker: b
    text: Hier wird 5. Mose 18,15 mit leicht verändertem Wortlaut angeführt. Im griechischen Text der Apostelgeschichte steht insbesondere „Gott, der Herr“ statt „der Herr, euer Gott“.
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς μὲν εἶπεν
  choice: Mose hat ja gesagt
  rationale: „Mose“ ist die übliche deutsche Namensform. „Ja“ gibt die hervorhebende und den Gedankengang weiterführende Funktion von μέν knapp und natürlich wieder.
- source_word: Προφήτην
  choice: einen Propheten
  rationale: Die artikellose Form wird unbestimmt wiedergegeben. Die Übersetzung macht die messianische Anwendung im Zusammenhang nicht schon durch „den Propheten“ ausdrücklich.
- source_word: ἀναστήσει
  choice: wird … erwecken
  rationale: „Erwecken“ bewahrt den sprachlichen Anschluss an die Verheißung aus Deuteronomium und bedeutet hier vor allem, dass Gott einen Propheten auftreten lässt; eine ausdrückliche Beschränkung auf Auferstehung wird vermieden.
- source_word: κύριος ὁ θεὸς
  choice: Der Herr, Gott
  rationale: Die appositionelle Wiedergabe folgt dem Wortlaut von Apostelgeschichte, ohne das in dieser griechischen Form fehlende „euer“ aus Deuteronomium einzufügen.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: aus euren Brüdern
  rationale: Die männliche Verwandtschaftsbezeichnung wird formgetreu wiedergegeben; im Bundes- und Volkszusammenhang bezeichnet sie die israelitischen Volksgenossen.
- source_word: ὡς ἐμέ
  choice: wie mich
  rationale: Die Wendung wird als unmittelbarer Vergleich zwischen Mose und dem angekündigten Propheten wiedergegeben.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Auf ihn sollt ihr hören
  rationale: Das Futur hat im Zitat verpflichtenden Sinn. „Auf ihn hören“ vermittelt sowohl Zuhören als auch gehorsames Beachten.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: in allem, was er zu euch sagt
  rationale: Die Formulierung gibt den umfassenden und distributiven Sinn in klarem modernem Deutsch wieder.
theological_decisions:
- issue: Verheißung eines Propheten und ihre messianische Anwendung
  choice: „einen Propheten“ ohne ausdrückliche Einfügung von „Messias“
  alternative: „den Propheten“ oder „den Messias“
  rationale: Petrus bezieht die Verheißung im Zusammenhang auf Jesus; der zitierte Wortlaut selbst spricht jedoch von „einem Propheten“. Diese Spannung bleibt erhalten.
- issue: Bedeutungsumfang von ἀδελφῶν
  choice: „Brüdern“ im Haupttext
  alternative: „israelitischen Volksgenossen“
  rationale: Die grammatisch männliche Form bleibt sichtbar, während eine Fußnote den repräsentativen ethnisch-bundestheologischen Sinn erläutert.
- issue: Wortlaut des Deuteronomium-Zitats
  choice: Das in Apostelgeschichte überlieferte „der Herr, Gott“ ohne „euer“
  alternative: Harmonisierend „der Herr, euer Gott“
  rationale: Die Übersetzung folgt der vorliegenden griechischen Fassung von Apostelgeschichte und gleicht sie nicht stillschweigend an Deuteronomium 18,15 an.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und mündlich verständlich. „Hat ja gesagt“ bewahrt die Diskursnuance von μέν, ohne den Satz zu beschweren; „auf ihn hören“ bringt den verpflichtenden Charakter idiomatisch zum Ausdruck.
