  terminology: „Prophet“, „erwecken“, „Brüdern“ und „auf ihn hören“ sind angemessen. Die Fußnote zu „Brüdern“ erläutert den ethnisch-bundestheologischen Bezug, ohne die grammatisch männliche Form im Haupttext zu ersetzen. Die zweite Fußnote wird an die revidierte, natürliche Gottesbezeichnung angepasst.
