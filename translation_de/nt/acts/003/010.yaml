  naturalness: Das Deutsch ist klar, idiomatisch und im angemessen würdigen Register. „Da wurden sie“ fügt allerdings eine stärker zeitlich-folgernde Verbindung ein als der griechische Text, der schlicht mit καί fortfährt.
  terminology: „Schönes Tor“, „Almosen“, „Staunen“ und „Bestürzung“ sind sachgerecht. Die Anmerkung zu ἱερόν ist korrekt und angemessen verankert.
