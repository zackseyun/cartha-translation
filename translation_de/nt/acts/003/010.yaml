source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: de
  text: 'Und sie erkannten ihn wieder: Das war der Mann, der sonst am Schönen Tor des Tempels[a] saß und um Almosen bat. Und sie wurden von Staunen und Bestürzung erfüllt über das, was ihm widerfahren war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ἱερόν bezeichnet die Tempelanlage insgesamt, nicht speziell das innere Heiligtum.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: sie erkannten ihn wieder
  rationale: Das Imperfekt beschreibt das Erkennen durch die Menschen im Fortgang der Szene; „wiedererkennen“ gibt die Identifizierung des ihnen bekannten Mannes idiomatisch wieder.
- source_word: δὲ
  choice: Und
  rationale: δέ führt die Erzählung hier mit einer schwachen Verknüpfung weiter, ohne einen deutlichen Gegensatz auszudrücken.
- source_word: οὗτος ἦν
  choice: Er war der Mann
  rationale: Die Formulierung bewahrt die identifizierende und hervorhebende Kraft des Demonstrativpronomens in natürlichem Deutsch.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: der sonst … saß und um Almosen bat
  rationale: Das substantivierte Partizip bezeichnet im Kontext seine gewohnheitsmäßige Tätigkeit. „sonst saß“ bringt diesen Hintergrundsinn zum Ausdruck; „um Almosen bat“ verdeutlicht natürlich den Zweck seines Sitzens.
- source_word: ἐλεημοσύνην
  choice: Almosen
  rationale: „Almosen“ bezeichnet präzise Gaben für Bedürftige und passt zum historischen Zusammenhang.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: am Schönen Tor
  rationale: Ὡραία dient als Bezeichnung des Tores; „Schönes Tor“ wird daher als Eigenname behandelt.
- source_word: τοῦ ἱεροῦ
  choice: des Tempels
  rationale: „Tempel“ ist die natürliche deutsche Wiedergabe; eine Fußnote erläutert, dass ἱερόν die gesamte Tempelanlage bezeichnen kann.
- source_word: ἐπλήσθησαν
  choice: wurden sie … erfüllt
  rationale: Die Passivform mit den folgenden Genitiven wird formal und zugleich verständlich wiedergegeben.
- source_word: θάμβους
  choice: Staunen
  rationale: θάμβος bezeichnet ein überwältigtes, verblüfftes Staunen und bleibt so vom folgenden Ausdruck unterscheidbar.
- source_word: ἐκστάσεως
  choice: Bestürzung
  rationale: ἔκστασις bezeichnet hier das Außer-sich-Geraten angesichts des Geschehens, nicht eine mystische Ekstase. „Bestürzung“ bewahrt gegenüber „Staunen“ eine eigene Nuance.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: über das, was ihm widerfahren war
  rationale: Das Perfektpartizip bezeichnet das eingetretene Geschehen mit fortdauernder Auswirkung; „widerfahren war“ ist würdig und im Kontext gut verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der gewohnheitsmäßige Sinn der Beschreibung wird mit „sonst … saß“ ausgedrückt; „Staunen und Bestürzung“ hält die beiden griechischen Reaktionsbegriffe auseinander.
