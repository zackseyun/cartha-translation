source:
  edition: SBLGNT
  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: de
  text: Während er sich an Petrus und Johannes festhielt,[a] lief das ganze Volk voller Staunen zu ihnen in der Säulenhalle zusammen, die Salomos genannt wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Während er sich an Petrus und Johannes klammerte.“ Das griechische Verb kann ein kräftiges Greifen oder beharrliches Festhalten betonen.'
    reason: lexical_alternative
  - marker: b
    text: Eine „Säulenhalle“ war ein überdachter, von Säulen getragener Gang. Diese Säulenhalle im Tempelbezirk wurde „Säulenhalle Salomos“ genannt.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: Während er sich … festhielt
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet eine gleichzeitige Handlung. Das reflexive „sich festhalten an“ gibt das kräftige Greifen oder Festhalten natürlich wieder, ohne dem Mann ausdrücklich ein bestimmtes Gefühl oder Motiv zuzuschreiben.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: Petrus und Johannes
  rationale: Die im Deutschen etablierten Formen der Personennamen.
- source_word: συνέδραμεν
  choice: lief … zusammen
  rationale: Das Verb bezeichnet ein schnelles gemeinsames Zulaufen beziehungsweise Zusammenströmen und bewahrt sowohl die Bewegung als auch das Zusammenkommen.
- source_word: πᾶς ὁ λαὸς
  choice: das ganze Volk
  rationale: Diese Wiedergabe entspricht dem umfassenden Ausdruck des Griechischen und legt die anwesenden Menschen nicht unnötig auf die engere Bedeutung „Menschenmenge“ fest.
- source_word: πρὸς αὐτούς
  choice: bei ihnen … zusammen
  rationale: Im Deutschen bringt die Verbindung mit „zusammenlaufen“ idiomatisch zum Ausdruck, dass die Menschen auf Petrus, Johannes und den Geheilten zuliefen und sich um sie sammelten.
- source_word: ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος
  choice: in der sogenannten Säulenhalle Salomos
  rationale: στοά bezeichnet eine überdachte Säulenhalle. „Säulenhalle Salomos“ ist eine klare, etablierte deutsche Bezeichnung; „sogenannt“ gibt das Partizip καλουμένῃ wieder, ohne die historische Zuschreibung zu bestätigen oder zu bestreiten.
- source_word: ἔκθαμβοι
  choice: völlig außer sich vor Staunen
  rationale: Der starke Ausdruck ἔκθαμβοι bezeichnet mehr als gewöhnliche Verwunderung. Die deutsche Formulierung wahrt diese Intensität und fügt sich als Beschreibung des Zustands der zusammenlaufenden Menschen natürlich in den Satz ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur hält die gleichzeitigen Handlungen und die starke Reaktion der Menschen erkennbar zusammen. „Säulenhalle“ ist verständlicher und architektonisch genauer als das heute leicht missverständliche „Halle“ oder das altertümliche „Vorhalle“.
