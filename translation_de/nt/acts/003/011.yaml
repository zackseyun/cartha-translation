  terminology: Die etablierten Namen „Petrus“ und „Johannes“ sowie „Säulenhalle Salomos“ sind passend. „Säulenhalle“ ist eine gute Wiedergabe von στοά. Die Benennung sollte neutral als „genannt“ erscheinen, nicht als „sogenannt“.
