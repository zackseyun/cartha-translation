  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: de
  text: Während Apollos in Korinth war, geschah es, dass Paulus die höher gelegenen Gebiete[a] durchzog, nach Ephesus kam und dort einige Jünger[b] fand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die oberen Gebiete“ oder „die Gebiete im Landesinneren“. Gemeint ist wahrscheinlich der Weg durch das höher gelegene Binnenland und nicht die Küstenstraße.'
    reason: lexical_alternative
  - marker: b
    text: Wessen Jünger sie waren, bleibt hier zunächst offen. Die folgenden Verse zeigen, dass sie mit der Taufe des Johannes verbunden waren.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: geschah es, dass
  rationale: Die lukanische Erzählformel wird erkennbar wiedergegeben; δέ markiert hier einen Fortgang der Erzählung und braucht im Deutschen kein eigenes „nun“.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: Während Apollos in Korinth war
  rationale: Die artikulierte Infinitivkonstruktion bezeichnet Gleichzeitigkeit; „während“ gibt dies natürlich und präzise wieder.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: die Gebiete im Landesinneren durchzog
  rationale: ἀνωτερικά kann wörtlich „höher gelegen“ bedeuten; im geografischen Zusammenhang ist wahrscheinlich die Route durch das Binnen- beziehungsweise Hochland im Gegensatz zur Küstenstraße gemeint. „Durchzog“ wahrt die Bewegungsrichtung durch das Gebiet.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: nach Ephesus kam
  rationale: Die Bewegungsangabe wird in natürlichem Deutsch wiedergegeben, ohne den Infinitivbau des Griechischen mechanisch nachzuahmen.
- source_word: καὶ εὑρεῖν τινας μαθητάς
  choice: und dort einige Jünger fand
  rationale: τινας bleibt unbestimmt („einige“), und μαθητάς wird mit dem im neutestamentlichen Sprachgebrauch üblichen „Jünger“ übersetzt. „Dort“ verdeutlicht lediglich den im Satz gegebenen Ortsbezug zu Ephesus.
theological_decisions:
- issue: Identität der μαθηταί
  choice: einige Jünger
  alternative: einige Jünger des Johannes; einige Jünger Jesu
  rationale: Der griechische Text bestimmt ihre Zugehörigkeit an dieser Stelle nicht näher. Erst die folgenden Verse bringen sie mit der Taufe des Johannes in Verbindung; diese Spannung wird im Haupttext nicht vorzeitig aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die griechische Satzstruktur wird maßvoll geglättet, ohne inhaltliche Unbestimmtheiten aufzulösen. Der Fußnotenmarker [a] steht bei der Wendung, auf die sich die lexikalische Alternative tatsächlich bezieht.
