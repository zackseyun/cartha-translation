  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: de
  text: Als sie das hörten, wurden sie auf den Namen des Herrn Jesus getauft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in den Namen des Herrn Jesus hinein«.'
    reason: Die Fußnote macht die Richtungs- und Zuordnungsnuance von εἰς τὸ ὄνομα sichtbar, die die idiomatische deutsche Wendung „auf den Namen“ nicht ausdrücklich abbildet.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Als sie das hörten
  rationale: Das Aoristpartizip hat hier zeitliche Funktion. Das im Griechischen nicht ausdrücklich genannte Objekt wird aus dem vorausgehenden Gespräch aufgenommen; „das“ ist im Deutschen für einen natürlichen Satzfluss angemessen.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist ein schwaches Bindewort. Der zeitliche Nebensatz stellt den erzählerischen Anschluss im Deutschen bereits klar her; ein zusätzliches „und“ wäre unnötig schwerfällig.
- source_word: ἐβαπτίσθησαν
  choice: ließen sie sich … taufen
  rationale: Diese im Deutschen idiomatische Konstruktion gibt wieder, dass die Taufe an ihnen vollzogen wurde, ohne eine reflexive Selbsttaufe nahezulegen.
- source_word: εἰς τὸ ὄνομα
  choice: auf den Namen
  rationale: „Auf den Namen“ ist im Deutschen eine natürliche und traditionsfähige Wiedergabe der zielgerichteten bzw. zuordnenden Kraft von εἰς. Die stärker formale Wiedergabe „in den Namen hinein“ bleibt als Fußnote erhalten.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: des Herrn Jesus
  rationale: κύριος wird in diesem christologischen Zusammenhang als Titel mit „Herr“ wiedergegeben; Ἰησοῦ erhält die übliche deutsche Namensform.
theological_decisions:
- issue: Wiedergabe der Taufformulierung εἰς τὸ ὄνομα
  choice: auf den Namen des Herrn Jesus
  alternative: in den Namen des Herrn Jesus hinein
  rationale: Die Hauptfassung ist klares, gegenwärtiges Deutsch und bewahrt die Zuordnung zu Jesus. Die Fußnote macht zugleich die wörtlichere Richtungsbedeutung von εἰς sichtbar, ohne die Formulierung an eine spätere liturgische Formel anzugleichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich taufen lassen“ ist allgemein verständlich und vermeidet das im Deutschen unnatürliche Passiv „sie wurden getauft“. Die Fußnote hält die genuine Bedeutungsbreite der griechischen Präposition offen.
