  naturalness: „Sie wurden auf den Namen des Herrn Jesus getauft“ ist modernes, klares und in diesem Zusammenhang durchaus natürliches Standarddeutsch. Es wahrt zugleich die passive Form des griechischen Textes besser als die reflexiv-kausative Umschreibung.
  terminology: „Herr Jesus“ gibt τοῦ κυρίου Ἰησοῦ sachgerecht wieder. „auf den Namen“ ist in deutscher Taufsprachlichkeit etabliert, ohne eine spätere Formel in den Text einzutragen. Die Fußnote sollte direkt an der erläuterten Präpositionalphrase stehen.
