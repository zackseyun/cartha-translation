id: ACT.19.31
reference: Acts 19:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: de
  text: Und sogar einige der Asiarchen[a], die mit ihm befreundet waren, schickten ihm eine Nachricht und baten ihn eindringlich, sich nicht ins Theater zu begeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Asiarchen“ waren führende Persönlichkeiten mit öffentlichen und religiösen Aufgaben in der römischen Provinz Asia.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „sich nicht selbst in das Theater zu geben“; auch: „sich nicht im Theater zu zeigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: Und sogar einige
  rationale: Die Formulierung führt die Erzählung weiter und bewahrt mit „sogar“ die hervorhebende, möglicherweise überraschende Nuance von καί.
- source_word: Ἀσιαρχῶν
  choice: Asiarchen
  rationale: Der eingedeutschte Fachausdruck bewahrt die besondere Amts- beziehungsweise Würdenbezeichnung, ohne sie durch eine zu allgemeine Umschreibung einzuebnen.
- source_word: ὄντες αὐτῷ φίλοι
  choice: die mit ihm befreundet waren
  rationale: Ein natürlicher deutscher Relativsatz gibt die begleitende Beschreibung des Partizips und den persönlichen Beziehungssinn von φίλοι wieder.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: schickten ihm eine Nachricht
  rationale: Im Griechischen bleibt unausgesprochen, was gesandt wurde. „Eine Nachricht“ ergänzt dies im Deutschen idiomatisch, ohne den Inhalt näher festzulegen.
- source_word: παρεκάλουν
  choice: baten ihn eindringlich
  rationale: Die Wiedergabe erfasst den nachdrücklichen Appell; das Imperfekt kann eine anhaltende oder wiederholte Bitte andeuten, was durch „eindringlich“ im natürlichen deutschen Erzählstil angemessen vermittelt wird.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: sich nicht ins Theater zu begeben
  rationale: Die Formulierung gibt die beabsichtigte Bewegung in das Theater natürlich wieder und vermeidet das im Deutschen missverständliche wörtliche „sich selbst hingeben“. Die bildhaftere Ausgangsform bleibt in einer Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der technische Titel „Asiarchen“ bleibt erhalten und wird erklärt; die schwer übertragbare Wendung δοῦναι ἑαυτόν wird im Haupttext idiomatisch und in der Fußnote formnäher wiedergegeben.
