  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: de
  text: 'Doch der böse Geist antwortete ihnen: „Jesus kenne ich, und Paulus ist mir bekannt[a] – aber wer seid ihr?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier zwei verschiedene Verben für „kennen“ beziehungsweise „wissen“. Auch möglich: „Jesus kenne ich, und von Paulus weiß ich“; beide Verben können sich in ihrer Bedeutung überschneiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν … εἶπεν αὐτοῖς
  choice: antwortete ihnen
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine griechische Redeformel. Die natürliche deutsche Wiedergabe „antwortete ihnen“ bewahrt sowohl den Antwortcharakter als auch die Adressaten, ohne die Konstruktion hölzern zu verdoppeln.
- source_word: δὲ
  choice: Doch
  rationale: 'δέ kennzeichnet hier den kontrastierenden Fortgang: Auf den Beschwörungsversuch folgt die unerwartete Antwort des Geistes. „Doch“ gibt diesen Umschwung in modernem Deutsch knapp wieder.'
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: der böse Geist
  rationale: πνεῦμα bezeichnet hier ein personales Geistwesen; πονηρός charakterisiert es als böse. „Der böse Geist“ ist klar, geläufig und kontextgerecht.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Jesus kenne ich
  rationale: γινώσκω bezeichnet hier persönliches Kennen oder Vertrautsein. Die vorangestellte Namensform bewahrt die Betonung des griechischen Satzes.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: Paulus ist mir bekannt
  rationale: ἐπίσταμαι kann ein Kennen, Wissen um oder Vertrautsein bezeichnen. Die Formulierung wahrt den Wechsel gegenüber γινώσκω, ohne eine bestimmte Abstufung der Kenntnis zu behaupten.
- source_word: ὑμεῖς δὲ τίνες ἐστέ;
  choice: aber wer seid ihr?
  rationale: Das ausdrücklich gesetzte ὑμεῖς ist kontrastiv. „Aber wer seid ihr?“ bringt den Gegensatz zu Jesus und Paulus sowie den Plural natürlich zum Ausdruck.
theological_decisions:
- issue: Unterschied zwischen γινώσκω und ἐπίσταμαι in der Rede des bösen Geistes
  choice: „Jesus kenne ich, und Paulus ist mir bekannt“
  alternative: „Jesus kenne ich, und von Paulus weiß ich“ oder „Jesus kenne ich, und Paulus kenne ich“
  rationale: Der griechische Text verwendet zwei verschiedene Verben. Die Übersetzung lässt diesen rhetorischen Wechsel erkennen, legt aber keine spekulative Lehre über unterschiedliche Grade dämonischer Erkenntnis fest. Da sich die Bedeutungsbereiche überschneiden, wird die mögliche Gleichwertigkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede folgt der griechischen Betonung durch die Voranstellung von „Jesus“ und „Paulus“. Der Gedankenstrich verdeutlicht den scharfen Gegensatz zur abschließenden Frage.
