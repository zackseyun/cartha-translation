source:
  edition: SBLGNT
  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: de
  text: 'Er rief sie und die Arbeiter, die mit solchen Dingen beschäftigt waren, zusammen und sagte: „Ihr Männer, ihr wisst, dass wir diesem Gewerbe[a] unseren Wohlstand verdanken.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dieser Erwerbstätigkeit.'
    reason: ἐργασία kann hier als Gewerbe, Geschäft oder Erwerbstätigkeit verstanden werden.
lexical_decisions:
- source_word: συναθροίσας
  choice: rief … zusammen
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Sagen vorausgeht. Die deutsche Satzverbindung gibt diese Abfolge natürlich wieder.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: die Arbeiter, die mit solchen Dingen beschäftigt waren
  rationale: Die Formulierung bleibt bei der allgemeinen Bedeutung von ἐργάτας und legt nicht genauer als der griechische Text fest, um welche handwerklichen Tätigkeiten es ging.
- source_word: Ἄνδρες
  choice: Ihr Männer
  rationale: Die direkte Anrede gibt den maskulinen Plural von ἀνήρ genau und in würdigem, verständlichem Deutsch wieder.
- source_word: ἐπίστασθε
  choice: ihr wisst
  rationale: Das Verb bezeichnet vorhandenes Wissen oder Bewusstsein; „ihr wisst“ ist die direkte und natürliche Wiedergabe.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: diesem Gewerbe
  rationale: Im geschäftlichen Zusammenhang bezeichnet ἐργασία die Erwerbstätigkeit beziehungsweise das Gewerbe. Die deutsche Konstruktion mit „verdanken“ gibt ἐκ idiomatisch wieder.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: wir … unseren Wohlstand verdanken
  rationale: εὐπορία bezeichnet Wohlstand oder wirtschaftliches Wohlergehen. Die gewählte Formulierung gibt die Herkunft dieses Wohlstands natürlich wieder, ohne ihn auf bloßen Lohn oder Umsatz zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdiger direkter Rede. Die Umstellung zum Hauptsatz „Er rief … zusammen und sagte“ vermeidet eine schwerfällige Partizipialkonstruktion, ohne die zeitliche Abfolge zu verändern.
