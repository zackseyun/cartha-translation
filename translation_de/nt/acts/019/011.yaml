id: ACT.19.11
reference: Acts 19:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: de
  text: Und Gott wirkte durch die Hände des Paulus außergewöhnliche Wunder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Machttaten, nicht die gewöhnlichen.“'
    reason: Die Fußnote bewahrt die wörtlich verneinende Formulierung und den Grundsinn von δυνάμεις als machtvolle Taten, ohne der Partikel τε eine zusätzliche spezifizierende Bedeutung zuzuschreiben.
lexical_decisions:
- source_word: Δυνάμεις
  choice: Wunder
  rationale: Der Plural bezeichnet hier machtvolle, übernatürliche Taten, nicht abstrakte Kräfte. „Wunder“ gibt diesen ereignisbezogenen Sinn im modernen Deutsch klar wieder.
- source_word: τε
  choice: Und
  rationale: Die Partikel verbindet die Aussage mit dem vorausgehenden Erzählzusammenhang; am Satzanfang ist „Und“ natürlich und angemessen.
- source_word: οὐ τὰς τυχούσας
  choice: außergewöhnliche
  rationale: Die Wendung bedeutet wörtlich etwa „nicht von gewöhnlicher Art“ beziehungsweise „nicht alltäglich“. „Außergewöhnliche“ bewahrt die Hervorhebung in natürlichem Deutsch.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Gott ist ausdrücklich das grammatische Subjekt; dadurch bleibt die göttliche Urheberschaft der Wunder deutlich.
- source_word: ἐποίει
  choice: tat
  rationale: Das Verb bezeichnet das Wirken beziehungsweise Vollbringen der Wunder. Das deutsche Präteritum passt zum Erzählstil; der fortlaufende oder wiederholte Charakter des griechischen Imperfekts ergibt sich aus dem Kontext.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: durch die Hände des Paulus
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Instrumentalität. Die konkrete Ausdrucksweise „durch die Hände“ bleibt erhalten und kennzeichnet Paulus als das menschliche Werkzeug.
- source_word: Παύλου
  choice: Paulus
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Form wiedergegeben.
theological_decisions:
- issue: Urheberschaft der Wunder
  choice: Gott vollbringt die Wunder durch Paulus als Werkzeug.
  alternative: Paulus vollbringt die Wunder aus eigener Kraft.
  rationale: Im Griechischen ist ὁ θεὸς das Subjekt von ἐποίει, während διὰ τῶν χειρῶν Παύλου die vermittelte Ausführung bezeichnet. Die Übersetzung hält diese Unterscheidung ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wendung „durch die Hände des Paulus“ wurde trotz ihrer leichten Fremdheit beibehalten, weil sie die Vermittlung und das sichtbare Handeln prägnant ausdrückt.
