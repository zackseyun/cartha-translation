id: ACT.19.18
reference: Acts 19:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: de
  text: Auch viele von denen, die gläubig geworden waren, kamen, bekannten und legten ihre Taten[a] offen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Praktiken; oder: was sie getan hatten.'
    reason: Lexikalische Alternative zu πράξεις; das Wort kann einzelne Taten ebenso wie ausgeübte Praktiken bezeichnen.
lexical_decisions:
- source_word: πολλοί τε
  choice: Auch viele
  rationale: πολλοί bezeichnet eine große, unbestimmte Zahl; τέ führt die Erzählung mit leicht anknüpfender Kraft fort. „Auch viele“ gibt beides knapp und natürlich wieder.
- source_word: τῶν πεπιστευκότων
  choice: von denen, die gläubig geworden waren
  rationale: Das Perfektpartizip bezeichnet einen vorausgegangenen Glaubensbeginn mit fortdauerndem Ergebnis. Die Formulierung wahrt diese Nuance, ohne einen technischen Gruppennamen einzuführen.
- source_word: ἤρχοντο
  choice: kamen
  rationale: Der Imperfekt beschreibt ein andauerndes oder wiederholtes Geschehen. Im Deutschen kann das schlichte Präteritum diesen erzählerischen Verlauf natürlich ausdrücken; „kamen immer wieder“ wäre deutlicher, aber stärker auslegend.
- source_word: ἐξομολογούμενοι
  choice: bekannten
  rationale: Das Verb bezeichnet offenes Bekennen oder Eingestehen. „Bekannten“ bleibt bewusst ohne ergänztes Objekt wie „Sünden“, das im griechischen Text nicht ausdrücklich steht.
- source_word: ἀναγγέλλοντες
  choice: legten … offen
  rationale: Das Verb bedeutet berichten, verkünden oder bekannt machen. Im Zusammenhang mit zuvor verborgenen Handlungen gibt „offenlegen“ die Bedeutung idiomatisch wieder, ohne sie auf magische Betätigung einzuengen.
- source_word: τὰς πράξεις αὐτῶν
  choice: ihre Taten
  rationale: πρᾶξις kann Taten, Handlungen oder Praktiken bezeichnen. „Taten“ ist breit genug, um die lexikalische Offenheit zu bewahren; die kontextuell mögliche Bedeutung „Praktiken“ steht in der Fußnote.
theological_decisions:
- issue: Ob πεπιστευκότων als feste Gruppenbezeichnung oder als vorausgegangener Glaubensbeginn mit bleibendem Ergebnis wiederzugeben ist.
  choice: die gläubig geworden waren
  alternative: die Gläubigen; die geglaubt hatten
  rationale: Das Perfektpartizip hebt den eingetretenen und fortbestehenden Zustand hervor. Die gewählte Wiedergabe bewahrt dies, ohne mehr über ihren kirchlichen Status auszusagen als der Text.
- issue: Ob τὰς πράξεις αὐτῶν ausdrücklich Sünden, magische Praktiken oder allgemein ihre Taten bezeichnet.
  choice: ihre Taten
  alternative: ihre Praktiken; ihre Sünden; was sie getan hatten
  rationale: Der unmittelbare Zusammenhang legt magische Praktiken nahe, doch πρᾶξις ist weiter gefasst und nennt die Handlungen nicht ausdrücklich „Sünden“. „Taten“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipien werden als koordinierte finite Verben wiedergegeben, damit der Satz natürlich verständlich bleibt. „Bekannten“ erhält kein ausdrücklich genanntes Objekt; dadurch wird die Offenheit des griechischen Textes gewahrt.
