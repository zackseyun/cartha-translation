id: ACT.19.38
reference: Acts 19:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: de
  text: Wenn also Demetrius und die Handwerker, die bei ihm sind, gegen jemanden eine Beschwerde haben, werden Gerichtssitzungen abgehalten, und es gibt Prokonsuln[a]. Sie sollen gegeneinander Anklage erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und Prokonsuln sind anwesend«. Der Plural kann sich allgemein auf das verfügbare Provinzamt beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Wenn also
  rationale: Gibt die folgernde und überleitende Funktion der Partikeln in natürlichem Deutsch wieder; μέν bleibt im Satzfluss leicht gewichtet.
- source_word: Δημήτριος
  choice: Demetrius
  rationale: Im Deutschen übliche Namensform.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: die Handwerker, die bei ihm sind
  rationale: τεχνῖται bezeichnet fachkundige Handwerker; die Formulierung bewahrt das unspezifische σὺν αὐτῷ, ohne eine engere Beziehung wie Mitarbeiterschaft vorauszusetzen.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: gegen jemanden eine Beschwerde haben
  rationale: Die Wendung bezeichnet hier einen rechtlich verfolgbaren Streit- oder Beschwerdegrund.
- source_word: τινα
  choice: jemanden
  rationale: Gibt das indefinite Pronomen in dieser allgemeinen Verfahrensaussage idiomatisch wieder.
- source_word: ἀγοραῖοι ἄγονται
  choice: Gerichtssitzungen werden abgehalten
  rationale: Die feste Wendung verweist auf ordnungsgemäß angesetzte gerichtliche Verhandlungen und bewahrt zugleich die passive Form.
- source_word: ἀνθύπατοί εἰσιν
  choice: es gibt Prokonsuln
  rationale: Bewahrt den Plural des griechischen Textes und die Bezeichnung des römischen Provinzamtes, ohne ihn stillschweigend zu singularisieren.
- source_word: ἐγκαλείτωσαν
  choice: Anklage erheben
  rationale: Gibt die forensische Bedeutung des Verbs im Zusammenhang mit den ordentlichen Gerichten präzise wieder.
- source_word: ἀλλήλοις
  choice: gegeneinander
  rationale: 'Bewahrt die reziproke Form: Die beteiligten Seiten sollen ihre Vorwürfe auf dem Rechtsweg gegeneinander vorbringen.'
theological_decisions: []
