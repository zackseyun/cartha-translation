source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: de
  text: Und nicht nur unser Gewerbe läuft Gefahr, in Verruf zu geraten, sondern auch der Tempel der großen Göttin Artemis könnte für bedeutungslos gehalten werden; ja, sie könnte ihrer Majestät[b] beraubt werden – sie, die ganz Asia und der ganze Erdkreis[a] verehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die bewohnte Welt“; gemeint ist häufig die damals bekannte Welt, besonders der weitere römische Raum.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihrer Herrlichkeit“ beziehungsweise „ihrer Größe“. Gemeint ist der erhabene Rang oder die Pracht der Artemis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: läuft Gefahr
  rationale: Gibt die gegenwärtige Gefährdung idiomatisch und nah am griechischen Verb wieder.
- source_word: τὸ μέρος
  choice: unser Gewerbe
  rationale: Im Kontext bezeichnet der Ausdruck den Erwerbszweig der Kunsthandwerker; „Gewerbe“ ist natürlich und wirtschaftlich präzise.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: in Verruf zu geraten
  rationale: Bewahrt die Vorstellung eines eintretenden Ansehensverlusts in geläufigem Deutsch.
- source_word: ἱερὸν
  choice: Tempel
  rationale: Bezeichnet hier das berühmte Heiligtum der Artemis in Ephesus; „Tempel“ ist für heutige Leser am klarsten.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: für bedeutungslos gehalten werden
  rationale: Gibt das passive Urteil, für nichts beziehungsweise für ohne Bedeutung zu gelten, verständlich wieder, ohne „wertlos“ wirtschaftlich zu verengen.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: könnte gestürzt werden
  rationale: Die schwierige, verdichtete Konstruktion beschreibt den befürchteten bevorstehenden Niedergang; der Konjunktiv greift den Gefährdungssinn des Satzes auf.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: ihre Majestät
  rationale: Bezeichnet Artemis’ erhabenen Rang und ihre öffentlich verehrte Größe; eine Fußnote hält weitere Bedeutungsnuancen offen.
- source_word: ὅλη ἡ Ἀσία
  choice: ganz Asia
  rationale: „Asia“ bezeichnet hier die römische Provinz, nicht den heutigen Kontinent Asien, und vermeidet dadurch eine historische Fehlassoziation.
- source_word: ἡ οἰκουμένη
  choice: der ganze Erdkreis
  rationale: Bewahrt die Vorstellung der bewohnten beziehungsweise bekannten Welt und passt zum rhetorischen Anspruch der Rede.
- source_word: σέβεται
  choice: verehren
  rationale: Das Verb bezeichnet kultische Ehrfurcht und Verehrung; „verehren“ bewahrt den religiösen Sinn, ohne die berichtete heidnische Perspektive abzuschwächen.
theological_decisions:
- issue: Wiedergabe heidnischer religiöser Aussagen
  choice: die große Göttin Artemis … die ganz Asia und der ganze Erdkreis verehren
  alternative: die sogenannte große Göttin Artemis … anbeten
  rationale: Der Vers gibt die Rede des Demetrius wieder. Die Übersetzung fügt weder eine Distanzierung wie „sogenannt“ hinzu noch bestätigt sie die Aussage außerhalb ihrer erzählten Perspektive.
- issue: Mehrdeutigkeit von τῆς μεγαλειότητος αὐτῆς bei καθαιρεῖσθαι
  choice: ihre Majestät könnte gestürzt werden
  alternative: sie könnte ihrer Herrlichkeit beraubt werden
  rationale: Die griechische Konstruktion ist ungewöhnlich und kann auf den Niedergang ihres erhabenen Rangs oder den Verlust ihrer Pracht zielen. Der Haupttext bleibt knapp; die Fußnote wahrt die Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Asia“ bleibt als historische Bezeichnung der römischen Provinz stehen. Die Satzstruktur folgt der Steigerung der griechischen Rede, wird aber durch Semikolon und Gedankenstrich für heutige Leser gegliedert.
