  to: Und nicht nur unser Gewerbe läuft Gefahr, in Verruf zu geraten, sondern auch der Tempel der großen Göttin Artemis könnte für bedeutungslos gehalten werden; ja, sie könnte ihrer Majestät[b] beraubt werden – sie, die ganz Asia und der ganze Erdkreis[a] verehren.
