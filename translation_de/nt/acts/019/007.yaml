lexical_decisions:
- source_word: ἦσαν
  choice: Es waren
  rationale: Die existenzielle deutsche Wendung gibt die griechische Form im Zusammenhang einer Mengenangabe natürlich und präzise wieder.
- source_word: δὲ
  choice: —
  rationale: Die schwache weiterführende Partikel braucht hier im Deutschen keine eigene Wiedergabe; ein ausdrückliches „aber“ würde einen zu starken Gegensatz nahelegen.
- source_word: οἱ πάντες
  choice: insgesamt
  rationale: Die substantivierte Wendung bezeichnet die gesamte Gruppe; „insgesamt“ bewahrt bei der Zahlenangabe ihren zusammenfassenden Sinn.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἀνήρ bezeichnet hier Männer und nicht allgemein Menschen; die geschlechtsspezifische Aussage bleibt daher erhalten.
- source_word: ὡσεὶ
  choice: etwa
  rationale: Das Wort kennzeichnet die Zahl ausdrücklich als ungefähre Angabe.
- source_word: δώδεκα
  choice: zwölf
  rationale: Direkte Wiedergabe der Kardinalzahl.
