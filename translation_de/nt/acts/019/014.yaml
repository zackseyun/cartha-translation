  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: de
  text: Es waren sieben Söhne eines jüdischen Hohepriesters namens Skevas, die dies taten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eines führenden Priesters. Das griechische Wort kann den Hohenpriester oder allgemeiner einen führenden Priester beziehungsweise einen Angehörigen der hohepriesterlichen Kreise bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Sieben … taten
  rationale: Die Existenzkonstruktion mit dem Partizip wird im Deutschen natürlich als finiter Satz wiedergegeben. δέ setzt die Erzählung fort; ein eigener Konnektor ist hier nicht erforderlich.
- source_word: τινος Σκευᾶ
  choice: eines … namens Skeuas
  rationale: τινος führt Skeuas als sonst nicht näher bekannte Person ein. „namens Skeuas“ ist natürliches Deutsch und bewahrt zusammen mit dem unbestimmten Artikel diese Unbestimmtheit.
- source_word: Ἰουδαίου
  choice: jüdischen
  rationale: Hier bezeichnet das Wort am ehesten die ethnisch-religiöse Zugehörigkeit und nicht lediglich die geografische Herkunft aus Judäa.
- source_word: ἀρχιερέως
  choice: Oberpriesters
  rationale: Die Wiedergabe vermeidet die eindeutige Behauptung, Skeuas habe das singuläre Amt des Hohenpriesters in Jerusalem bekleidet, und lässt zugleich den hohen priesterlichen Rang erkennen.
- source_word: ἑπτὰ υἱοὶ
  choice: Sieben Söhne
  rationale: Direkte und natürliche Wiedergabe von Zahlwort und Verwandtschaftsbezeichnung.
- source_word: τοῦτο ποιοῦντες
  choice: taten dies
  rationale: Das Partizip bezeichnet die im unmittelbar vorausgehenden Zusammenhang beschriebene Tätigkeit. Das Singularpronomen τοῦτο wird mit „dies“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἀρχιερεύς in Bezug auf Skeuas
  choice: Oberpriester
  alternative: Hoherpriester
  rationale: ἀρχιερεύς kann den amtierenden Hohenpriester, aber auch einen führenden Priester beziehungsweise Angehörigen der hohepriesterlichen Kreise bezeichnen. Da Skeuas sonst nicht als der jüdische Hohepriester belegt ist, vermeidet „Oberpriester“ eine möglicherweise irreführende Festlegung; die gebräuchlichere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die griechische Existenzkonstruktion wurde zugunsten eines natürlichen deutschen Hauptsatzes umgeformt. „Oberpriester“ ist weniger geläufig als „Hoherpriester“, bewahrt hier aber die sachliche Unbestimmtheit des griechischen Titels; die Alternative steht in der Fußnote.
