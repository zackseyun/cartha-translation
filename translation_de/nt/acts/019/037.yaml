id: ACT.19.37
reference: Acts 19:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: de
  text: Denn ihr habt diese Männer hergebracht, die weder Tempelräuber sind noch unsere Göttin lästern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Artemis, die Schutzgöttin von Ephesus.
    reason: Der Vers nennt Artemis nicht ausdrücklich; die Fußnote macht den aus dem unmittelbaren Zusammenhang eindeutigen Bezug transparent.
lexical_decisions:
- source_word: ἠγάγετε
  choice: ihr habt … hergebracht
  rationale: Der Aorist bezeichnet die vollzogene Handlung; das deutsche Perfekt ist in direkter Rede natürlich und »hergebracht« gibt die Bewegung zum Versammlungsort wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage des Stadtschreibers ein.
- source_word: τοὺς ἄνδρας τούτους
  choice: diese Männer
  rationale: ἀνήρ bezeichnet hier Männer; τούτους weist auf die vor der Versammlung stehenden Personen.
- source_word: οὔτε … οὔτε
  choice: weder … noch
  rationale: Entspricht der korrelativen Verneinung des Griechischen.
- source_word: ἱεροσύλους
  choice: Tempelräuber
  rationale: Das Wort bezeichnet Menschen, die Tempel beziehungsweise deren heiligen Besitz berauben; die konkrete Wiedergabe passt zum rechtlichen Kontext.
- source_word: βλασφημοῦντας
  choice: lästern
  rationale: Das Partizip bezeichnet ehrverletzende oder frevelhafte Rede gegen eine Gottheit. Die verbale Wiedergabe ist im modernen Deutschen natürlicher als das Substantiv »Lästerer«.
- source_word: τὴν θεὸν ἡμῶν
  choice: unsere Göttin
  rationale: Der bestimmte weibliche Artikel und der Kontext weisen auf Artemis. »Göttin« gibt den tatsächlichen Bezug im Deutschen eindeutig wieder.
theological_decisions:
- issue: Wiedergabe von τὴν θεὸν ἡμῶν mit Bezug auf Artemis
  choice: unsere Göttin
  alternative: unseren Gott
  rationale: Der heidnische Stadtschreiber spricht von Artemis. »Unsere Göttin« bewahrt den kontextuellen Sinn, ohne die Aussage theologisch zu bestätigen oder einen Bezug auf den Gott Israels nahezulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverbindung mit »obwohl« bildet idiomatisch ab, dass das Herbeibringen dieser Männer unbegründet war, und bewahrt zugleich die beiden ausdrücklich verneinten Vorwürfe.
