revisions:
- from: Denn ihr habt diese Männer hergebracht, obwohl sie weder Tempelräuber sind noch unsere Göttin lästern.[a]
  to: Denn ihr habt diese Männer hergebracht, die weder Tempelräuber sind noch unsere Göttin lästern.[a]
  rationale: Die Revision ersetzt allein die nicht ausdrücklich markierte Konzession „obwohl“ durch einen Relativsatz. Dadurch bleiben die beiden verneinten Vorwürfe als Beschreibung der herbeigebrachten Männer erhalten, ohne eine zusätzliche logische Beziehung einzutragen. Die Fußnote bleibt als knappe Kontextklärung bestehen.
