id: ACT.19.34
reference: Acts 19:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: de
  text: 'Als sie aber erkannten, dass er ein Jude[a] war, erhob sich aus ihnen allen eine einzige Stimme, und sie riefen etwa zwei Stunden lang: »Groß ist die Artemis der Epheser!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Judäer«. Das griechische Wort kann sowohl einen Juden als auch jemanden aus Judäa bezeichnen; hier ist wahrscheinlich die umfassendere ethnisch-religiöse Bedeutung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: Als sie ... erkannten
  rationale: Das Aoristpartizip bezeichnet einen vorausgehenden Umstand; die temporale Wiedergabe ist im Deutschen natürlich und bewahrt den Sinn des Erkennens seiner Identität.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet die gegensätzliche Wendung gegenüber Alexanders beabsichtigter Verteidigungsrede.
- source_word: Ἰουδαῖός
  choice: ein Jude
  rationale: Im ephesischen Diasporakontext bezeichnet der Ausdruck am ehesten die ethnisch-religiöse Zugehörigkeit, nicht bloß die Herkunft aus Judäa.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: erhob sich aus ihnen allen eine einzige Stimme
  rationale: Bewahrt das griechische Bild einer einzigen, aus der ganzen Menge kommenden Stimme und bringt ihren einhelligen Ruf zum Ausdruck.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: etwa zwei Stunden lang
  rationale: ὡς bei einer Zeitangabe bezeichnet hier eine ungefähre Dauer.
- source_word: κραζόντων
  choice: und sie riefen
  rationale: Das Präsenspartizip beschreibt den anhaltenden lauten Ruf; die finite Koordination ergibt natürliches Deutsch und verbindet ihn klar mit der ungefähren Dauer.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Groß ist die Artemis der Epheser!
  rationale: Erhält die emphatische Wortstellung der Akklamation und gibt den Genitiv Ἐφεσίων idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von Ἰουδαῖος
  choice: ein Jude
  alternative: ein Judäer
  rationale: Die Reaktion der Menge richtet sich hier wahrscheinlich gegen Alexanders wahrgenommene ethnisch-religiöse Identität. Die geografisch engere Bedeutung bleibt als echte lexikalische Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die bildhafte Einheitsformulierung »eine einzige Stimme« und die emphatische Akklamation bleiben erhalten.
