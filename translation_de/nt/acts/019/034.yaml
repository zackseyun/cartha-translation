  source_fidelity: 'Die Übersetzung gibt die Satzbewegung und den Sinn des griechischen Textes zuverlässig wieder: das Erkennen von Alexanders jüdischer Identität, der einhellige Ausruf der Menge, die ungefähre Dauer und die Akklamation an Artemis. »Etwa zwei Stunden lang« gibt ὡς ἐπὶ ὥρας δύο angemessen approximativ wieder. Die finite deutsche Formulierung »und sie riefen« überträgt das begleitende Präsenspartizip κραζόντων idiomatisch, ohne die anhaltende Handlung wesentlich einzubüßen.'
  naturalness: Modernes Standarddeutsch und angemessener erzählerischer Register. »Erhob sich aus ihnen allen eine einzige Stimme« ist leicht gehoben, aber verständlich und passend, da es das Bild der griechischen Einzahl bewahrt. Die Akklamation klingt auf Deutsch natürlich und eindringlich.
  terminology: »Jude« ist im ephesischen Kontext die wahrscheinlichste Wiedergabe von Ἰουδαῖος. Die Fußnote wahrt die mögliche geografische Lesart »Judäer«, ohne den Haupttext unnötig zu belasten. »Artemis der Epheser« gibt die kultische Zugehörigkeitsbezeichnung Ἄρτεμις Ἐφεσίων sachgerecht wieder.
