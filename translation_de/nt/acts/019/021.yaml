id: ACT.19.21
reference: Acts 19:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: de
  text: 'Nachdem dies abgeschlossen war, fasste Paulus im Geist[a] den Entschluss, durch Mazedonien und Achaia zu ziehen und dann nach Jerusalem zu reisen. Er sagte: »Nachdem ich dort gewesen bin, muss ich auch Rom sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seinem Geist«, das heißt: innerlich. Die griechische Wendung kann sich auf Paulus’ eigenen Geist oder auf die Führung des Heiligen Geistes beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: abgeschlossen war
  rationale: Das Passiv bezeichnet hier, dass die zuvor geschilderten Vorgänge zum Abschluss kamen, nicht die Erfüllung einer Weissagung.
- source_word: ἔθετο
  choice: fasste … den Entschluss
  rationale: Die mediale Wendung bezeichnet einen bewusst gefassten persönlichen Vorsatz; diese deutsche Formulierung ist natürlich und bewahrt die Entschiedenheit.
- source_word: ἐν τῷ πνεύματι
  choice: im Geist
  rationale: Die knappe Wiedergabe bewahrt die Mehrdeutigkeit zwischen dem Heiligen Geist und Paulus’ eigenem Geist; eine Fußnote erläutert beide Möglichkeiten.
- source_word: διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν
  choice: durch Mazedonien und Achaia zu ziehen
  rationale: Das Partizip gehört inhaltlich zum gefassten Reiseplan. Die deutsche Infinitivkoordination gibt die geplante Route klar und natürlich wieder.
- source_word: πορεύεσθαι εἰς Ἱεροσόλυμα
  choice: und dann nach Jerusalem zu reisen
  rationale: „Dann“ macht die zeitliche Abfolge des aoristischen Partizips vor der Reise nach Jerusalem deutlich; „reisen“ passt zum längeren Reiseweg.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Wenn ich dort gewesen bin
  rationale: Die Konstruktion bezeichnet den Aufenthalt in Jerusalem als dem Rom-Besuch vorausgehend. „Wenn“ ist im Deutschen für einen als künftig vorausgesetzten Zeitpunkt idiomatisch.
- source_word: δεῖ με
  choice: muss ich
  rationale: Bewahrt die starke Notwendigkeit, die bei Lukas auch einen göttlich bestimmten Auftrag anklingen lassen kann, ohne ihn ausdrücklich festzulegen.
- source_word: Ῥώμην ἰδεῖν
  choice: Rom sehen
  rationale: Die wörtliche und zugleich idiomatische Wiedergabe lässt offen, dass damit praktisch ein Besuch gemeint ist.
theological_decisions:
- issue: Bezug von ἐν τῷ πνεύματι
  choice: im Geist
  alternative: in seinem Geist / innerlich
  rationale: Der griechische Text enthält kein Possessivpronomen und lässt sowohl eine Führung durch den Heiligen Geist als auch Paulus’ inneren Entschluss zu. Die Hauptfassung vermeidet eine grammatische Festlegung; die Fußnote bewahrt die echte Ambiguität.
- issue: Bedeutungsgehalt von δεῖ
  choice: muss ich
  alternative: ich habe vor / ich will
  rationale: Die Formulierung bewahrt den Nachdruck der Notwendigkeit und lässt eine göttliche Bestimmung anklingen, ohne diese interpretierend in den Text einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde gegenüber dem Griechischen behutsam gegliedert, damit Reiseplan und Reihenfolge klar bleiben. „Im Geist“ bewahrt im Deutschen durch Großschreibung zwar die traditionelle Anspielung auf den Heiligen Geist, während die Fußnote die lexikalisch mögliche persönliche Lesart ausdrücklich offenhält.
