    issue: „silberne Heiligtümer“ ist für gefertigte Silberobjekte im modernen Deutsch missverständlich und wenig idiomatisch.
    rationale: Ein „Heiligtum“ wird im Deutschen überwiegend als geweihter Ort oder Kultbezirk verstanden. ναός bedeutet primär „Tempel“; der konkrete Gegenstandscharakter kann in der Fußnote erläutert werden.
  - severity: medium
    issue: „verschaffte den Kunsthandwerkern damit ein beträchtliches Geschäft“ ist sprachlich holprig und glättet die griechische Litotes.
    rationale: ἐργασία kann hier Geschäftstätigkeit, Erwerb oder Verdienst bezeichnen. „Nicht geringen Verdienst verschaffen“ ist idiomatischer, bewahrt οὐκ ὀλίγην und stellt den wirtschaftlichen Ertrag für die Handwerker klar dar.
