revisions:
- from: Denn ein Mann namens Demetrius, ein Silberschmied, fertigte silberne Heiligtümer der Artemis[a] an und verschaffte den Kunsthandwerkern damit ein beträchtliches Geschäft[b].
  to: Denn ein Mann namens Demetrius, ein Silberschmied, stellte silberne Tempel der Artemis[a] her und verschaffte den Handwerkern damit nicht geringen Verdienst[b].
  rationale: Die Revision verbessert die moderne deutsche Idiomatik und hält sich zugleich enger an die Grundbedeutung von ναός sowie an die litotische Formulierung οὐκ ὀλίγην. Die Fußnote zu ναός wahrt die historische und lexikalische Unsicherheit hinsichtlich der genauen Form der hergestellten Silberobjekte.
  reviewer_model: gpt-5.6-terra
