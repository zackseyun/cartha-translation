source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: de
  text: Denn ein Mann namens Demetrius, ein Silberschmied, stellte silberne Tempel der Artemis[a] her und verschaffte den Handwerkern damit nicht geringen Verdienst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »silberne Heiligtümer der Artemis«. Das griechische Wort bedeutet gewöhnlich »Tempel«; im gewerblichen Zusammenhang sind wahrscheinlich kleine, mit dem Artemiskult verbundene Gegenstände gemeint, möglicherweise Tempelmodelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »nicht geringen Erwerb/Geschäftsbetrieb«. Die griechische Untertreibung bezeichnet erheblichen wirtschaftlichen Ertrag oder Verdienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Leitet die erklärende Hintergrundinformation zum vorausgehenden Geschehen ein und bewahrt die Verknüpfung ausdrücklich.
- source_word: Δημήτριός τις ὀνόματι
  choice: ein Mann namens Demetrius
  rationale: Gibt die Einführung einer bestimmten, bisher nicht genannten Person natürlich wieder; der griechische Personenname wird transliteriert.
- source_word: ἀργυροκόπος
  choice: Silberschmied
  rationale: Bezeichnet einen Handwerker, der Silber bearbeitet; »Silberschmied« ist die geläufige deutsche Berufsbezeichnung.
- source_word: ποιῶν
  choice: fertigte … an
  rationale: Das Partizip beschreibt die fortlaufende berufliche Tätigkeit des Demetrius; die finite Form ergibt einen natürlichen deutschen Satz.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: silberne Heiligtümer der Artemis
  rationale: ναός bezeichnet ein Heiligtum oder einen Tempel. Im gewerblichen Kontext sind wahrscheinlich kleine silberne Kultobjekte beziehungsweise Tempelnachbildungen gemeint; »Heiligtümer« wahrt die mögliche Bedeutungsbreite.
- source_word: παρείχετο
  choice: verschaffte … damit
  rationale: Das Imperfekt bezeichnet eine andauernde oder gewohnheitsmäßige Tätigkeit; die mittlere Form passt hier zur wirtschaftlichen Bereitstellung beziehungsweise Eröffnung von Geschäftsmöglichkeiten.
- source_word: τοῖς τεχνίταις
  choice: den Kunsthandwerkern
  rationale: τεχνῖται bezeichnet fachkundige Handwerker; »Kunsthandwerker« passt besonders zur Herstellung kultischer Silberarbeiten.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: ein beträchtliches Geschäft
  rationale: Die Litotes bedeutet eine erhebliche wirtschaftliche Tätigkeit oder Einnahme. Die positive Wiedergabe klingt im Deutschen natürlicher, während eine Fußnote die griechische Ausdrucksweise festhält.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem langen griechischen Gefüge behutsam geglättet. »Artemis« folgt dem griechischen Namen statt der römischen Entsprechung »Diana«.
