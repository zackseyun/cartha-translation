source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: de
  text: 'Nachdem der Stadtschreiber die Menge beruhigt hatte, sagte er: »Ihr Männer von Ephesus! Denn wer weiß nicht, dass die Stadt der Epheser Tempelhüterin der großen Artemis und des vom Himmel Gefallenen[a] ist?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet etwas, von dem man glaubte, es sei vom Himmel gefallen. Gemeint ist wahrscheinlich das mit Artemis verbundene Kultbild oder ein heiliger Gegenstand.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: Nachdem … beruhigt hatte
  rationale: Das vorzeitige Partizip bezeichnet eine Handlung, die dem Sprechen vorausgeht; die temporale Konstruktion ist im Deutschen natürlich und wahrt die Abfolge.
- source_word: ὁ γραμματεὺς
  choice: der Stadtschreiber
  rationale: Im politischen Zusammenhang von Ephesus bezeichnet das Wort einen hohen städtischen Verwaltungsbeamten, nicht einen jüdischen Schriftgelehrten.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Ihr Männer von Ephesus
  rationale: Die direkte, ausdrücklich männliche Anrede wird verständlich und würdevoll wiedergegeben.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: Wer wüsste denn nicht
  rationale: Die idiomatische rhetorische Frage vermittelt den Sinn der griechischen Wendung, ohne im Deutschen schwerfällig zu wirken.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: die Stadt der Epheser
  rationale: Die Genitivkonstruktion des Ausgangstextes bleibt erhalten.
- source_word: νεωκόρον
  choice: Tempelhüterin
  rationale: Der Ausdruck bezeichnet eine Stadt, die als Hüterin beziehungsweise Verwalterin eines Tempels oder Kultes anerkannt ist; das feminine Wort stimmt mit »Stadt« überein.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: der großen Artemis
  rationale: Die etablierte kultische Ehrenbezeichnung wird direkt wiedergegeben.
- source_word: τοῦ διοπετοῦς
  choice: des vom Himmel gefallenen Bildes
  rationale: Das substantivierte Adjektiv bezeichnet etwas, das nach damaliger Vorstellung vom Himmel gefallen war; im Kontext ist wahrscheinlich ein Kultbild gemeint, doch die Ergänzung wird durch eine Fußnote als kontextuelle Deutung kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe der heidnischen Behauptung über Artemis und das διοπετές
  choice: 'Die Aussage wird als Behauptung des Stadtschreibers unmittelbar wiedergegeben: »des vom Himmel gefallenen Bildes«.'
  alternative: »des vom Himmel gefallenen Gegenstandes« oder »des vom Himmel gefallenen Heiligtums«
  rationale: Der Vers berichtet eine pagane Überzeugung, ohne sie als wahr zu bestätigen. »Bild« benennt den im Kontext wahrscheinlichen Bezug, während die Fußnote die wörtlich offenere Bedeutung bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Stadtschreiber« wahrt die historische Amtsbezeichnung; »Tempelhüterin« gibt den städtischen Ehrentitel knapp wieder. Die rhetorische Frage ist idiomatisch formuliert.
