  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: de
  text: Die einen schrien das eine, die anderen etwas anderes; denn die Versammlung[a] war in Verwirrung, und die meisten wussten nicht, weshalb sie zusammengekommen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zusammenkunft“; das griechische Wort ἐκκλησία bezeichnet hier eine öffentliche Versammlung, nicht die christliche Gemeinde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Die einen riefen dies, die anderen etwas anderes
  rationale: Die Gegenüberstellung ἄλλοι … ἄλλο τι wird im Deutschen natürlich mit „die einen … die anderen“ wiedergegeben. Der Imperfekt ἔκραζον bezeichnet das anhaltende Rufen innerhalb der turbulenten Szene.
- source_word: ἐκκλησία
  choice: Versammlung
  rationale: Im Zusammenhang bezeichnet ἐκκλησία eine öffentliche Zusammenkunft, nicht die christliche Gemeinde. „Versammlung“ ist präzise und bewahrt die lexikalische Breite des griechischen Wortes.
- source_word: συγκεχυμένη
  choice: in Verwirrung
  rationale: Das perfekte Partizip beschreibt den entstandenen und fortbestehenden Zustand von Unordnung und Verwirrung.
- source_word: οἱ πλείους
  choice: die meisten
  rationale: Der substantivierte Komparativ bezeichnet die Mehrheit der Anwesenden; „die meisten“ ist die natürliche deutsche Entsprechung.
- source_word: τίνος ἕνεκα
  choice: weshalb
  rationale: Die Wendung fragt nach dem Grund oder Anlass. „Weshalb“ gibt sie knapp und idiomatisch wieder.
- source_word: συνεληλύθεισαν
  choice: sie zusammengekommen waren
  rationale: Der Plusquamperfekt gibt wieder, dass das Zusammenkommen dem beschriebenen Zustand zeitlich vorausging.
theological_decisions:
- issue: Bedeutung von ἐκκλησία in diesem Kontext
  choice: Versammlung als öffentliche Zusammenkunft
  alternative: Gemeinde oder Kirche
  rationale: Der unmittelbare Kontext ist eine aufgebrachte öffentliche Versammlung in Ephesus. Eine kirchliche Bedeutung würde hier einen sachfremden theologischen Sinn eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem bewegten Erzählfluss, ohne die griechische Konstruktion unnatürlich nachzuahmen. Das einleitende οὖν bleibt unmarkiert, da ein zusätzliches „also“ oder „nun“ im Deutschen hier schwerfällig wirken würde.
