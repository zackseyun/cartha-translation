revisions:
- from: 'Doch auch einige der umherziehenden jüdischen Beschwörer versuchten, über denen, die böse Geister hatten, den Namen des Herrn Jesus anzurufen. Sie sagten: »Ich beschwöre euch bei dem Jesus, den Paulus verkündet.«'
  to: 'Einige umherziehende jüdische Exorzisten versuchten auch, über Menschen mit bösen Geistern den Namen des Herrn Jesus anzurufen. Sie sagten: »Ich beschwöre euch bei Jesus, den Paulus verkündet.«'
  rationale: Die Revision glättet die unidiomatische Präpositionalfügung, verwendet mit „Exorzisten“ den präziseren Ausdruck und gestaltet die Beschwörungsformel idiomatisch. Sie bewahrt den Versuchcharakter von ἐπεχείρησαν, die additive Nuance von καί, die vorsichtige Formulierung „Menschen mit bösen Geistern“ und den Titel „Herr Jesus“, ohne eine bestimmte Lehre über Besessenheit einzutragen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:59:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des griechischen Textes zutreffend wieder: den Versuch, die umherziehenden jüdischen Exorzisten/Beschwörer, die Anrufung des Namens des Herrn Jesus, die Menschen mit bösen Geistern sowie die Beschwörungsformel. Die Satztrennung ist zulässig. Allerdings ist „über denen“ in dieser Konstruktion sprachlich missglückt und verschleiert die Rektion; außerdem sollte die Formel „bei Jesus“ ohne Artikel stehen, da der Akkusativ nach ὁρκίζω die Anrufungsbasis der Beschwörung bezeichnet.'
  naturalness: „Doch auch einige“ ist eine etwas sperrige Eröffnung, und „über denen, die böse Geister hatten“ ist im modernen Standarddeutsch nicht natürlich. „Einige umherziehende jüdische Exorzisten versuchten auch, über Menschen mit bösen Geistern …“ ist idiomatischer und bewahrt die vom Griechischen nicht näher definierte Beziehung zu den Geistern. „Exorzisten“ ist hier als präziser Fachausdruck gegenüber dem mehrdeutigen „Beschwörer“ vorzuziehen.
  terminology: „Herr Jesus“ und „böse Geister“ sind angemessen. „Exorzisten“ entspricht ἐξορκισταί genauer; „Beschwörer“ kann auch Personen meinen, die etwas oder jemanden herbeizaubern bzw. beschwören. Die direkte Rede sollte „bei Jesus“ statt „bei dem Jesus“ lauten; der deutsche Artikel legt unnötig eine besondere Abgrenzung nahe, die im griechischen Wortlaut nicht markiert ist.
  issues:
  - severity: medium
    issue: Unnatürliche und syntaktisch problematische Formulierung „über denen, die böse Geister hatten“
    rationale: ἐπί mit dem Vorgang des Anrufens ist hier am besten mit „über Menschen mit bösen Geistern“ wiederzugeben. Das Relativpronomen „denen“ nach „über“ ist zwar formal möglich, wirkt aber semantisch und stilistisch misslungen; „Menschen mit bösen Geistern“ gibt τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά zugleich präzise und ohne stärkere Ausdeutung wieder.
  - severity: low
    issue: „Beschwörer“ ist für ἐξορκισταί weniger präzise
    rationale: Im Kontext bezeichnet ἐξορκισταί Personen, die Exorzismen vollziehen. „Exorzisten“ ist im modernen Deutsch verständlich und vermeidet die breitere Bedeutung von „Beschwörer“.
  - severity: low
    issue: Artikel in „bei dem Jesus“
    rationale: Die Beschwörungsformel Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν wird idiomatisch mit „Ich beschwöre euch bei Jesus“ wiedergegeben. Der bestimmte Artikel ist nicht erforderlich und klingt im Deutschen unnötig markierend.
  revised_text: 'Einige umherziehende jüdische Exorzisten versuchten auch, über Menschen mit bösen Geistern den Namen des Herrn Jesus anzurufen. Sie sagten: »Ich beschwöre euch bei Jesus, den Paulus verkündet.«'
  revised_footnotes: []
