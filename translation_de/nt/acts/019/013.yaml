  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: de
  text: 'Einige umherziehende jüdische Exorzisten versuchten auch, über Menschen mit bösen Geistern den Namen des Herrn Jesus anzurufen. Sie sagten: »Ich beschwöre euch bei Jesus, den Paulus verkündet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: versuchten
  rationale: Das Aoristverb bezeichnet den Versuch bzw. das Unternehmen einer Handlung; »versuchten« ist natürlich und deutet keinen Erfolg an.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: auch einige der umherziehenden jüdischen Beschwörer
  rationale: τινες bedeutet »einige«, καὶ ist hier additiv, und περιερχομένων beschreibt Menschen, die von Ort zu Ort ziehen. »Beschwörer« gibt ἐξορκισταί verständlich wieder, ohne das modern fachsprachliche Fremdwort »Exorzisten« vorauszusetzen.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: über ... den Namen ... anzurufen
  rationale: Die Verbindung bezeichnet im Kontext den formelhaften Gebrauch bzw. die Anrufung eines Namens über betroffenen Menschen. Die Formulierung wahrt zugleich die Präposition ἐπί.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: denen, die böse Geister hatten
  rationale: Dies bleibt nahe bei der wörtlichen Aussage »die böse Geister hatten« und vermeidet die stärkere, ausdeutende Formulierung »von bösen Geistern besessen«.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: den Namen des Herrn Jesus
  rationale: »Herr Jesus« gibt den christologischen Titel κύριος würdig und im Deutschen idiomatisch wieder.
- source_word: Ὁρκίζω ὑμᾶς
  choice: Ich beschwöre euch
  rationale: ὁρκίζω bezeichnet ein feierliches, eidlich bindendes Beschwören. »Ich beschwöre euch« passt zum exorzistischen Kontext und bewahrt dessen formellen Ton.
- source_word: τὸν Ἰησοῦν ὃν Παῦλος κηρύσσει
  choice: bei dem Jesus, den Paulus verkündet
  rationale: Der Akkusativ nach ὁρκίζω bezeichnet denjenigen, bei dem beschworen wird. κηρύσσει meint öffentliches Verkündigen; »verkündet« ist präzise und nicht unnötig kirchensprachlich.
theological_decisions:
- issue: Wiedergabe von κύριος in τοῦ κυρίου Ἰησοῦ
  choice: Herr
  alternative: Meister
  rationale: »Herr« bewahrt sowohl den ehrenden Titel als auch sein christologisches Gewicht in der Apostelgeschichte.
- issue: Grad der dämonischen Beeinflussung in τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: die böse Geister hatten
  alternative: die von bösen Geistern besessen waren
  rationale: Der griechische Text sagt wörtlich, dass sie böse Geister »hatten«. Die gewählte Fassung macht eine vollständige Besessenheit nicht ausdrücklicher, als es die Quelle tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Umherziehend« ist allgemein verständlich und bildet den Ortswechsel ab; »Beschwörer« vermeidet ein unnötiges Fremdwort. Die direkte Rede behält den feierlich-formelhaften Ton des griechischen Textes.
