source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: de
  text: sodass man sogar Schweißtücher oder Arbeitsschürzen von seiner Haut zu den Kranken brachte[a], und die Krankheiten von ihnen wichen und die bösen Geister ausfuhren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von seinem Körper«. Griechisch wörtlich: »von seiner Haut«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sodass
  rationale: Leitet die Folge der in Vers 11 genannten außergewöhnlichen Machttaten ein und bewahrt den konsekutiven Sinn.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: zu den Kranken
  rationale: Gibt das substantivierte Partizip natürlich und knapp wieder und passt zur gerichteten Bewegung.
- source_word: ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: man … die seine Haut berührt hatten, … brachte
  rationale: Die Umformung macht im Deutschen verständlich, dass die Tücher von Paulus zu den Kranken gebracht wurden; χρώς wird mit dem präzisen »Haut« bewahrt. Das unbestimmte »man« vermeidet die im Passiv mögliche Fehlvorstellung, die Gegenstände hätten sich selbst bewegt.
- source_word: σουδάρια
  choice: Schweißtücher
  rationale: Das Lehnwort bezeichnet Tücher zum Abwischen von Schweiß oder Gesicht; »Schweißtücher« ist im Arbeitskontext präziser als das moderne »Taschentücher«.
- source_word: σιμικίνθια
  choice: Arbeitsschürzen
  rationale: Bezeichnet Schürzen beziehungsweise bei körperlicher Arbeit getragene Tücher; die Wiedergabe verdeutlicht die Funktion ohne unnötige Auslegung.
- source_word: ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους
  choice: da wichen die Krankheiten von ihnen
  rationale: Bewahrt die Krankheiten als grammatisches Subjekt sowie die Bewegung weg von den Kranken; »wichen« klingt natürlich und würdig.
- source_word: τά τε πνεύματα τὰ πονηρὰ
  choice: und die bösen Geister
  rationale: Bewahrt die bestimmte Bezeichnung der feindlichen Geister und die koordinierende Fortführung.
- source_word: ἐκπορεύεσθαι
  choice: fuhren aus
  rationale: Ist im Deutschen eine klare, etablierte Formulierung für das Verlassen besessener Menschen durch Geister und bildet den Ausgangsaspekt des Verbs ab.
theological_decisions:
- issue: Art der durch Gegenstände von Paulus vermittelten Heilungen und Befreiungen
  choice: Das Geschehen wird ohne Erklärung eines Mechanismus oder einer späteren Frömmigkeitspraxis als erzähltes Wunder wiedergegeben.
  alternative: Eine Wiedergabe, die Reliquienverehrung nahelegt oder das übernatürliche Geschehen symbolisch abschwächt.
  rationale: Der Text berichtet die Heilungen und Exorzismen unmittelbar, erklärt aber weder eine innewohnende Kraft der Gegenstände noch begründet er daraus eine allgemeine Praxis.
- issue: Bezug von ἐκπορεύεσθαι
  choice: Das Subjekt »die bösen Geister« bleibt ausdrücklich genannt; die betroffenen Menschen werden nicht zusätzlich ergänzt.
  alternative: »Die bösen Geister fuhren aus den Kranken aus.«
  rationale: Der Ausgang aus Menschen ist im Kontext verständlich, doch ein ausdrücklicher Bezug ausschließlich auf »die Kranken« wäre eine nicht zwingende Präzisierung des griechischen Textes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Schweißtücher« und »Arbeitsschürzen« stellen den handwerklichen Zusammenhang her. Das Semikolon gliedert Transport und Wirkung, ohne den engen Folgezusammenhang aufzulösen.
