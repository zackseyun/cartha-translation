source:
  edition: SBLGNT
  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: de
  text: Da diese Dinge nun unbestreitbar sind, müsst ihr ruhig bleiben und dürft nichts Übereiltes tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: unbestreitbar
  rationale: Das Adjektiv bezeichnet etwas, dem nicht widersprochen werden kann. „Unbestreitbar“ gibt diese Aussagekraft in natürlichem, modernem Deutsch wieder.
- source_word: οὖν
  choice: also
  rationale: Die Partikel kennzeichnet die Folgerung aus der vorausgehenden Argumentation. „Also“ stellt diesen logischen Anschluss im Deutschen klar und idiomatisch her.
- source_word: ὄντων τούτων
  choice: da dies … ist
  rationale: Der Genitivus absolutus nennt hier den Grund für die folgende Aufforderung. Die kausale Wiedergabe mit „da“ ist im Deutschen natürlich.
- source_word: δέον ἐστίν
  choice: müsst ihr
  rationale: Die unpersönliche Wendung drückt Notwendigkeit beziehungsweise Verpflichtung aus. Das Modalverb „müssen“ bewahrt diese Kraft in einer flüssigen deutschen Satzstruktur.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: euch ruhig verhalten
  rationale: Die Verbindung beschreibt einen gefassten, beruhigten Zustand. „Sich ruhig verhalten“ passt zum Kontext einer aufgebrachten Volksmenge und beschränkt die Aussage nicht auf bloßes Schweigen.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: nichts Übereiltes tun
  rationale: προπετής bezeichnet vorschnelles, unbedachtes Handeln. „Nichts Übereiltes tun“ gibt die Warnung vor impulsivem Vorgehen präzise und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, beschwichtigende Argumentation des Stadtschreibers bleibt erhalten; die Notwendigkeit wird direkt und verständlich mit „müsst“ ausgedrückt.
