  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: de
  text: Aus der Menge brachte man Alexander nach vorn[a], den die Juden vorgeschoben hatten. Alexander gab mit der Hand ein Zeichen und wollte vor der Volksversammlung eine Verteidigungsrede halten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Man stellte Alexander aus der Menge vor.“ Das Griechische verwendet für das Nach-vorn-Bringen Alexanders und das Vorschieben durch die Juden zwei verwandte Verben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „zum Volk“. Das griechische Wort bezeichnet hier die versammelte Bürgerschaft beziehungsweise Öffentlichkeit und unterscheidet sich von der „Menge“ am Anfang des Verses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: brachte man ... nach vorn
  rationale: Im Zusammenhang mit ἐκ τοῦ ὄχλου und Alexander als Objekt bezeichnet das Verb hier das öffentliche Hervorbringen aus der Menge. Das unbestimmte „man“ wahrt die im griechischen Verb nicht ausdrücklich genannte handelnde Personengruppe.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: nachdem die Juden ihn vorgeschoben hatten
  rationale: Der Genitivus absolutus beschreibt, wie Alexander nach vorn gelangte. „Vorgeschoben“ erhält die öffentliche und möglicherweise instrumentelle Nuance, ohne körperliche Gewalt ausdrücklich zu behaupten.
- source_word: κατασείσας τὴν χεῖρα
  choice: gab mit der Hand ein Zeichen
  rationale: Die Wendung bezeichnet eine Handbewegung, mit der Aufmerksamkeit oder Ruhe erbeten wird. Die Übersetzung vermeidet die nicht ausdrücklich genannte Festlegung „um Ruhe zu bitten“.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: wollte ... eine Verteidigungsrede halten
  rationale: „Wollte“ gibt Absicht oder Wunsch wieder, nicht eine vollendete Handlung. „Verteidigungsrede halten“ bewahrt den öffentlichen beziehungsweise forensischen Sinn von ἀπολογεῖσθαι und klingt im modernen Deutschen natürlich.
- source_word: τῷ δήμῳ
  choice: vor der Volksversammlung
  rationale: δῆμος bezeichnet hier die öffentlich versammelte Bürgerschaft. „Volksversammlung“ erhält den bürgerlich-öffentlichen Sinn und unterscheidet den Ausdruck von ὄχλος.
- source_word: ὄχλου
  choice: Menge
  rationale: „Menge“ ist eine natürliche Wiedergabe der allgemeinen Menschenansammlung und bleibt von der später genannten Volksversammlung unterscheidbar.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Alexander
  rationale: Der Personenname wird nach der üblichen deutschen Namensform wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden verwandten Ausdrücke für das Nach-vorn-Bringen werden mit „nach vorn bringen“ und „vorschieben“ unterscheidbar gehalten. „Volksversammlung“ wahrt gegenüber „Menge“ die öffentliche beziehungsweise städtisch-bürgerliche Färbung.
