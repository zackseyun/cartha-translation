base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: de
  text: Als Paulus aber in die Versammlung hineingehen wollte, ließen die Jünger ihn nicht hinein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Volksversammlung“ oder „in die Menge“. Das griechische Wort δῆμος kann in diesem städtischen Zusammenhang die versammelte Öffentlichkeit als bürgerliche Körperschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου δὲ … βουλομένου
  choice: Als Paulus aber … gehen wollte
  rationale: Der Genitivus absolutus bezeichnet hier Paulus’ Absicht; „als … wollte“ gibt dies natürlich wieder. δέ markiert den leichten Gegensatz zur vorherigen Handlung.
- source_word: εἰσελθεῖν εἰς τὸν δῆμον
  choice: unter die versammelte Menge gehen
  rationale: εἰσελθεῖν bezeichnet das Hineingehen. δῆμος meint im Kontext des Theaters die öffentlich versammelte Bevölkerung; die Formulierung wahrt sowohl den Gedanken einer Versammlung als auch den einer Menschenmenge.
- source_word: οὐκ εἴων αὐτὸν
  choice: ließen … ihn nicht
  rationale: Der Imperfekt von ἐάω beschreibt das anhaltende Verhindern beziehungsweise die Weigerung, Paulus gehen zu lassen.
- source_word: οἱ μαθηταί
  choice: die Jünger
  rationale: „Jünger“ ist die direkte und im neutestamentlichen Kontext geläufige Wiedergabe von μαθηταί, ohne ein im Griechischen nicht ausgedrücktes Besitzverhältnis hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Versammelte Menge“ vermeidet das im Deutschen möglicherweise zu stark institutionell geprägte alleinige „Versammlung“, während die Fußnote die staatsbürgerliche Bedeutung von δῆμος offenhält.
