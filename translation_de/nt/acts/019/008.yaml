  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: de
  text: Dann ging er in die Synagoge und sprach dort drei Monate lang freimütig. Dabei führte er Gespräche und suchte sie in Bezug auf das Reich Gottes zu überzeugen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dabei führte er Gespräche und überzeugte sie in Bezug auf das Reich Gottes.“ Das griechische Partizip bezeichnet die fortgesetzte Tätigkeit des Überzeugens; der Erfolg bei den Zuhörern wird damit nicht ausdrücklich festgestellt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: Dann ging er
  rationale: Das aoristische Partizip leitet den nächsten Erzählabschnitt ein; die finite deutsche Form gibt die zeitliche Abfolge natürlich wieder. δέ ist als leichter narrativer Anschluss mit „Dann“ ausgedrückt.
- source_word: τὴν συναγωγήν
  choice: in die Synagoge
  rationale: συναγωγή bezeichnet hier eindeutig die jüdische Synagoge; der etablierte deutsche Begriff ist präzise und verständlich.
- source_word: ἐπαρρησιάζετο
  choice: sprach dort … offen und furchtlos
  rationale: Das Imperfekt bezeichnet fortgesetztes freimütiges Reden. „offen und furchtlos“ erfasst sowohl die öffentliche Freimütigkeit als auch den Mut, ohne ein bloßes Lautsprechen anzudeuten.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: drei Monate lang
  rationale: ἐπί mit Akkusativ bezeichnet hier die Dauer; die gewählte Wendung ist idiomatisches Deutsch.
- source_word: διαλεγόμενος
  choice: Er führte Gespräche
  rationale: Das Verb bezeichnet ein argumentierendes Erörtern im Austausch mit Zuhörern. „Gespräche führen“ bewahrt den dialogischen Zug und klingt weniger einseitig als „predigen“.
- source_word: πείθων
  choice: versuchte, die Menschen … zu überzeugen
  rationale: Das Präsenspartizip beschreibt sein fortgesetztes Bemühen um Überzeugung. Weil das Objekt im Griechischen unausgesprochen bleibt, wird es allgemein als „die Menschen“ wiedergegeben; „versuchte“ vermeidet die Behauptung, alle seien tatsächlich überzeugt worden.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: vom Reich Gottes
  rationale: περί mit Genitiv bezeichnet den Gegenstand des Gesprächs und Überzeugens. „Reich Gottes“ ist die geläufige und sachlich angemessene Wiedergabe der neutestamentlichen Wendung.
theological_decisions:
- issue: Unausgesprochenes Objekt und mögliche Erfolgsimplikation von πείθων
  choice: „versuchte, die Menschen … zu überzeugen“
  alternative: „überzeugte sie vom Reich Gottes“
  rationale: Das griechische Partizip kann die Überzeugungstätigkeit oder das Bemühen darum bezeichnen, ohne festzulegen, dass alle Zuhörer überzeugt wurden. Die Formulierung wahrt diese Offenheit und ergänzt nur ein allgemein bezeichnetes, kontextuell vorausgesetztes Publikum.
- issue: Bedeutung von βασιλεία τοῦ θεοῦ
  choice: „Reich Gottes“
  alternative: „Herrschaft Gottes“
  rationale: βασιλεία kann sowohl das Herrschen als auch den Herrschaftsbereich bezeichnen. „Reich Gottes“ bewahrt die traditionelle Breite des Schlüsselbegriffs, ohne ihn hier auf einen einzelnen Bedeutungsaspekt festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den sachlichen Zusammenhang der Partizipien mit dem fortgesetzten freimütigen Reden aufzugeben. Der Fußnotenmarker steht unmittelbar nach der betroffenen Aussage.
