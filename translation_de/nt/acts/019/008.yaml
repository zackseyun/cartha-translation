revisions:
- from: Dann ging er in die Synagoge und sprach dort drei Monate lang offen und furchtlos. Er führte Gespräche und versuchte, die Menschen vom Reich Gottes zu überzeugen.[a]
  to: Dann ging er in die Synagoge und sprach dort drei Monate lang freimütig. Dabei führte er Gespräche und suchte sie in Bezug auf das Reich Gottes zu überzeugen.[a]
  rationale: Die Revision bewahrt die narrative Verbindung und die Bedeutung aller griechischen Ausdrücke, ersetzt aber das unnötig verallgemeinernde „die Menschen“ durch das kontextbezogene „sie“. „Freimütig“ gibt die für Paulus charakteristische offene und mutige Rede präzise wieder. Die Fußnote erläutert die Handlungsbedeutung von πείθων, ohne die Übersetzungsalternative fälschlich als stärker wörtlich oder als Erfolgsbehauptung darzustellen.
