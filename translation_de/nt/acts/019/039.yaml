  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: de
  text: Wenn ihr aber noch etwas Weiteres verlangt, wird es in der ordentlichen Volksversammlung[a] geklärt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist eine gesetzmäßig oder regulär tagende städtische Versammlung, nicht die christliche Gemeinde. Auch möglich: »gesetzmäßigen Volksversammlung« oder »ordnungsgemäßen Versammlung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: noch etwas darüber hinaus
  rationale: Das Adverb bezeichnet etwas Zusätzliches, das über die gegenwärtig behandelte Angelegenheit hinausgeht. Die Wendung gibt den vergleichenden Sinn im Deutschen natürlich wieder.
- source_word: ἐπιζητεῖτε
  choice: verlangt
  rationale: Das Verb kann je nach Zusammenhang »suchen«, »nachfragen« oder »verlangen« bedeuten. Im Rahmen der öffentlichen Forderungen der Menge passt »verlangt«, ohne bereits eine bestimmte rechtliche Verfahrensform festzulegen.
- source_word: ἐννόμῳ
  choice: ordnungsgemäß einberufenen
  rationale: Das Adjektiv bezeichnet eine Versammlung, die dem geltenden Recht beziehungsweise der vorgeschriebenen Ordnung entspricht. Im deutschen Verwaltungskontext bringt »ordnungsgemäß einberufen« den Gegensatz zur tumultartigen Zusammenkunft klar zum Ausdruck.
- source_word: ἐκκλησίᾳ
  choice: Bürgerversammlung
  rationale: Hier ist keine christliche Gemeinde gemeint, sondern die politische Versammlung der Bürger von Ephesus. »Bürgerversammlung« macht den städtisch-politischen Bezug verständlich, ohne daraus ein Gericht zu machen.
- source_word: ἐπιλυθήσεται
  choice: wird … geklärt werden
  rationale: Das Futur Passiv bezeichnet die regelgerechte Klärung oder Entscheidung einer Angelegenheit. »geklärt werden« ist natürlich und lässt offen, wie genau der Beschluss zustande kommt.
- source_word: τι
  choice: etwas
  rationale: Das Indefinitpronomen steht im Konditionalsatz und bezeichnet eine nicht näher bestimmte zusätzliche Angelegenheit.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία in einem nichtchristlichen städtischen Zusammenhang
  choice: Bürgerversammlung
  alternative: Versammlung; Gemeinde
  rationale: Der Kontext verlangt eine gesetzmäßig konstituierte politische Versammlung in Ephesus. »Gemeinde« würde im heutigen Bibeldeutsch irreführende kirchliche Assoziationen hervorrufen; »Bürgerversammlung« bewahrt den Charakter eines versammelten öffentlichen Körpers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist für heutige Leser verständlich und wahrt den städtisch-rechtlichen Kontext, ohne ἐκκλησία als Gericht oder christliche Gemeinde auszulegen.
