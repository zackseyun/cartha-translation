  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: de
  text: So wuchs das Wort des Herrn mit Macht und setzte sich durch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So breitete sich das Wort des Herrn machtvoll aus und gewann immer mehr an Kraft.“'
    reason: Die Verbindung κατὰ κράτος sowie die Verben für Wachsen und Starksein lassen mehrere natürliche Zuordnungen und Wiedergaben zu.
lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Leitet die Folge der vorausgehenden Ereignisse ein und gibt den resultativen Sinn knapp und natürlich wieder.
- source_word: κατὰ κράτος
  choice: mit Macht
  rationale: Die idiomatische Wendung bezeichnet kraftvolle Wirkung. „Mit Macht“ bewahrt den substantivischen Anklang von κράτος und lässt sich im Deutschen natürlich auf die gesamte verbale Aussage beziehen.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Bewahrt den griechischen Titel, ohne den im Kontext naheliegenden Bezug auf Jesus im Haupttext ausdrücklich zu ergänzen.
- source_word: ὁ λόγος
  choice: das Wort
  rationale: Bewahrt die in der Apostelgeschichte wiederkehrende Bezeichnung für die verkündete Botschaft.
- source_word: ηὔξανεν
  choice: wuchs
  rationale: Das Imperfekt beschreibt einen fortschreitenden Vorgang; im Deutschen vermittelt das Präteritum im Erzählzusammenhang diesen Verlauf ausreichend natürlich.
- source_word: ἴσχυεν
  choice: setzte sich durch
  rationale: Gibt in Verbindung mit dem Wachstum die wirksame, überlegene Kraft des Wortes idiomatisch wieder.
theological_decisions:
- issue: Bezug von „Herr“ in τοῦ κυρίου
  choice: „des Herrn“, ohne ausdrückliche Ergänzung „Jesus“
  alternative: „des Herrn Jesus“
  rationale: Der Zusammenhang legt Jesus nahe, doch der griechische Text nennt nur den Titel „Herr“. Die Übersetzung wahrt diese Formulierung und lässt die Bezugnahme unausgesprochen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und erzählerisch; „mit Macht“ wahrt die Kraftmetaphorik des griechischen Ausdrucks, während „setzte sich durch“ die wirksame Ausbreitung verständlich ausdrückt.
