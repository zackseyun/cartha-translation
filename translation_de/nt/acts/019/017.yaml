id: ACT.19.17
reference: Acts 19:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: de
  text: Und dies wurde allen Juden wie auch Griechen, die in Ephesus wohnten, bekannt. Da befiel sie alle Furcht[a], und der Name des Herrn Jesus wurde hoch geehrt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da kam Furcht über sie alle.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wurde groß gemacht«; auch: »wurde gepriesen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: dies
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist im Singular auf den unmittelbar zuvor berichteten Vorfall.
- source_word: ἐγένετο γνωστὸν
  choice: wurde … bekannt
  rationale: Die Verbindung von γίνομαι und γνωστόν bezeichnet idiomatisch das Bekanntwerden und bewahrt den inchoativen Sinn.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: allen Juden wie auch Griechen
  rationale: Der Dativ bezeichnet die Personen, denen der Vorfall bekannt wurde; τε καί verbindet beide Gruppen ausdrücklich.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: die in Ephesus wohnten
  rationale: κατοικέω bezeichnet dauerhaftes Wohnen oder Ansässigsein; der Relativsatz bezieht sich natürlich auf beide Gruppen.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: Da befiel sie alle Furcht
  rationale: Die deutsche Wendung gibt das lebhafte Bild von ἐπιπίπτω wieder, ohne unnatürlich wörtlich zu klingen.
- source_word: φόβος
  choice: Furcht
  rationale: Furcht lässt die mögliche Spannweite zwischen Angst und ehrfürchtigem Erschrecken bestehen, statt sie auf bloße Ehrfurcht oder Schrecken einzuengen.
- source_word: ἐμεγαλύνετο
  choice: wurde hoch geehrt
  rationale: Das Imperfekt Passiv beschreibt eine fortdauernde öffentliche Erhöhung beziehungsweise Ehrung. Die idiomatische Formulierung vermittelt dies klar; die bildnähere Alternative steht in der Fußnote.
- source_word: τὸ ὄνομα
  choice: der Name
  rationale: Die wörtliche Wiedergabe bewahrt die biblische Bedeutungsspanne von Person, Ansehen und Autorität.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: des Herrn Jesus
  rationale: κύριος wird als christologischer Titel mit „Herr“ wiedergegeben; der Genitiv hängt von „Name“ ab.
theological_decisions:
- issue: Wiedergabe von κύριος als Titel Jesu
  choice: Herr
  alternative: Meister
  rationale: „Herr“ ist die natürliche und traditionsübergreifend verständliche Wiedergabe des christologischen Titels, ohne dessen Bedeutung einzuengen.
- issue: Wiedergabe von τὸ ὄνομα
  choice: der Name des Herrn Jesus
  alternative: das Ansehen des Herrn Jesus
  rationale: „Name“ wahrt die ausdrückliche Formulierung und ihre theologische Bedeutung für Jesu Person, Autorität und öffentliches Ansehen.
- issue: Bedeutung von ἐμεγαλύνετο
  choice: wurde hoch geehrt
  alternative: wurde groß gemacht
  rationale: Der Kontext beschreibt die zunehmende öffentliche Hochschätzung des Namens Jesu. Die Hauptfassung ist im modernen Deutsch natürlich; die Fußnote bewahrt die bildnähere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz folgt der griechischen Informationsstruktur, ohne schwerfällig zu wirken. „Furcht“ bewahrt die Mehrdeutigkeit zwischen Angst und ehrfürchtigem Erschrecken; „hoch geehrt“ gibt den fortdauernden öffentlichen Bedeutungszuwachs idiomatisch wieder.
