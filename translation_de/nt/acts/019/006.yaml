revisions:
- from: Und als Paulus ihnen die Hände aufgelegt hatte, kam der Heilige Geist auf sie. Da begannen sie, in Zungen[a] zu reden und prophetisch zu sprechen.
  to: Und als Paulus ihnen die Hände aufgelegt hatte, kam der Heilige Geist auf sie, und sie redeten in Zungen[a] und prophezeiten.
  rationale: Die Revision vermeidet eine nicht ausdrücklich verlangte Inzeptivdeutung und gibt die beiden griechischen Imperfektformen mit parallelen deutschen Verben wieder. Sie bewahrt zugleich die narrative zeitliche Abfolge, die idiomatische Wendung „in Zungen reden“ sowie die lexikalische Ambiguität von γλώσσαις.
