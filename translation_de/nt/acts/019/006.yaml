source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: de
  text: Und als Paulus ihnen die Hände aufgelegt hatte, kam der Heilige Geist auf sie, und sie redeten in Zungen[a] und prophezeiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Sprachen“. Das griechische Wort kann sowohl „Zungen“ als auch „Sprachen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: als Paulus ihnen die Hände aufgelegt hatte
  rationale: Der Genitivus absolutus mit Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben. Das Plusquamperfekt macht deutlich, dass die Handauflegung dem Kommen des Geistes vorausging, ohne einen über den Text hinausgehenden zeitlichen Abstand anzunehmen.
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: kam der Heilige Geist auf sie
  rationale: Die Formulierung gibt die Bewegung von ἔρχομαι mit ἐπί knapp und idiomatisch wieder und bewahrt die für Lukas-Apostelgeschichte typische Redeweise.
- source_word: ἐλάλουν
  choice: begannen sie, … zu reden
  rationale: Der Imperfekt beschreibt hier die einsetzende und fortdauernde Handlung nach dem Kommen des Geistes. „begannen“ bildet den inchoativen Zug im Deutschen natürlich ab.
- source_word: γλώσσαις
  choice: in Zungen
  rationale: „Zungen“ bewahrt die lexikalische Bildhaftigkeit und lässt offen, ob bekannte menschliche Sprachen oder andersartige geistgewirkte Rede gemeint sind. Eine Fußnote nennt die sprachlich naheliegende Alternative.
- source_word: ἐπροφήτευον
  choice: prophetisch zu sprechen
  rationale: Die Wiedergabe bezeichnet verständlich prophetische Rede, ohne durch „weissagen“ den Sinn unnötig auf Zukunftsvoraussage zu verengen.
- source_word: τε … καί
  choice: und
  rationale: Die enge Verbindung der beiden gleichzeitigen Äußerungen wird im Deutschen durch die einfache Koordination natürlich ausgedrückt.
theological_decisions:
- issue: Art der mit γλώσσαις bezeichneten Rede
  choice: „in Zungen“ im Haupttext, ohne die Art der Rede näher festzulegen
  alternative: „in Sprachen“ oder „in fremden Sprachen“
  rationale: γλῶσσα kann sowohl „Zunge“ als auch „Sprache“ bedeuten. Der Vers allein entscheidet nicht, ob bekannte menschliche Sprachen oder ekstatische beziehungsweise andersartige geistgewirkte Rede vorliegt; die Übersetzung hält diese Spannung offen.
- issue: Zusammenhang zwischen Handauflegung und Kommen des Heiligen Geistes
  choice: Die zeitliche Abfolge wird berichtet, aber nicht dogmatisch erklärt.
  alternative: Eine Formulierung, die ausdrücklich eine sakramentale Ursache oder eine allgemeingültige feste Reihenfolge behauptet
  rationale: Der griechische Text erzählt, was bei diesem Ereignis geschah, erläutert jedoch weder die vollständige theologische Kausalität noch stellt er ausdrücklich ein universales Schema auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Zungen reden“ bleibt als etablierte biblische Wendung stehen; die Fußnote erschließt ihre lexikalische Alternative. Der zweite Satz verhindert eine schwerfällige Kette von Hauptsätzen und lässt das Einsetzen der beiden parallelen Handlungen natürlich hervortreten.
