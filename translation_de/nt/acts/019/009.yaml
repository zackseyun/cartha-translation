source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: de
  text: Als sich aber einige verhärteten und sich nicht überzeugen ließen[a] und vor der Menge abfällig über den Weg[b] redeten, zog er sich von ihnen zurück, sonderte die Jünger ab und diskutierte täglich im Lehrsaal des Tyrannus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ungehorsam waren“ beziehungsweise „nicht glaubten“.'
    reason: lexical_alternative
  - marker: b
    text: „Der Weg“ war in der Apostelgeschichte eine frühe Bezeichnung für die christliche Bewegung.
    reason: cultural_note
  - marker: c
    text: 'Oder: „in der Schule des Tyrannus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: sich verhärteten
  rationale: Das Imperfekt bezeichnet einen fortdauernden beziehungsweise sich entwickelnden Widerstand; die mediale Formulierung bewahrt die mögliche Beteiligung der Betroffenen, ohne die Frage nach der letztlichen Verursachung festzulegen.
- source_word: ἠπείθουν
  choice: sich nicht überzeugen ließen
  rationale: ἀπειθέω kann Unglauben, Ungehorsam oder die Weigerung bezeichnen, sich überzeugen zu lassen. Im Zusammenhang der argumentativen Verkündigung gibt diese Formulierung die widerständige Reaktion natürlich wieder und vermeidet eine unnötige Verengung.
- source_word: κακολογοῦντες
  choice: abfällig über … redeten
  rationale: Das Partizip bezeichnet feindseliges, herabsetzendes Reden. Die Wiedergabe ist modernes, verständliches Deutsch und legt sich nicht auf den engeren juristischen Sinn von „verleumden“ fest.
- source_word: τὴν ὁδὸν
  choice: den Weg
  rationale: In der Apostelgeschichte ist „der Weg“ eine erkennbare Bezeichnung für die Jesusbewegung. Der bestimmte Ausdruck bleibt erhalten; eine Fußnote erläutert den historischen Gebrauch.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: vor der Menge
  rationale: Die knappe Wiedergabe bewahrt den öffentlichen Charakter der Anfeindung.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: wandte er sich von ihnen ab
  rationale: Die Formulierung vermittelt den entschiedenen Rückzug des Paulus von der widerständigen Gruppe, ohne nur eine räumliche Bewegung auszudrücken.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: sonderte die Jünger aus
  rationale: ἀφορίζω bezeichnet eine bewusste Absonderung oder Trennung. „Sonderte … aus“ hält die Handlung deutlich von dem vorangehenden eigenen Rückzug des Paulus unterschieden.
- source_word: καθ’ ἡμέραν
  choice: täglich
  rationale: Gibt die regelmäßige Aktivität an jedem Tag knapp und natürlich wieder.
- source_word: διαλεγόμενος
  choice: führte … Gespräche
  rationale: διαλέγομαι bezeichnet hier argumentierenden, lehrenden Austausch. „Gespräche führen“ bewahrt den dialogischen Zug besser als das einseitig klingende „lehren“, während die Fußnote auf die argumentative Nuance hinweist.
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: im Lehrsaal des Tyrannus
  rationale: σχολή bezeichnet hier wahrscheinlich einen Unterrichts- oder Vortragssaal. „Lehrsaal“ ist im Deutschen verständlicher als „Schule“, ohne eine moderne Schule als Institution vorauszusetzen.
theological_decisions:
- issue: „Der Weg“ als Bezeichnung der christlichen Bewegung
  choice: „der Weg“ als feste, durch Fußnote erläuterte Bezeichnung
  alternative: „der Weg“ als allgemeines Bild für eine Lehre oder Lebensweise
  rationale: Der Ausdruck fungiert in der Apostelgeschichte wiederholt als Bezeichnung der Jesusbewegung. Die Übersetzung bewahrt Lukas’ Ausdruck, während die Fußnote dessen Funktion erklärt, ohne eine konfessionelle Selbstbezeichnung einzuführen.
- issue: Bedeutung von ἠπείθουν
  choice: „sich nicht überzeugen ließen“
  alternative: „ungehorsam waren“ oder „nicht glaubten“
  rationale: Das Verb umfasst semantisch Unglauben und Ungehorsam. Die gewählte Formulierung erhält im Kontext des öffentlichen Widerstands die willentliche Verweigerung und lässt die theologische Spannung zwischen Nichtglauben und Ungehorsam bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem Ablauf des griechischen Textes, wird aber für heutige Leser geglättet. „Lehrsaal“ vermeidet die irreführende Vorstellung einer modernen Schule; „Gespräche führen“ hält den dialogisch-argumentativen Charakter der Tätigkeit offen.
