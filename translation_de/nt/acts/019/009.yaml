  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen. Allerdings gibt „führte ... Gespräche“ die argumentative, öffentliche Lehr- und Erörterungstätigkeit von διαλεγόμενος etwas zu unverbindlich wieder. Die Fußnote c ist zudem nicht bei dem Ausdruck angesetzt, den sie nach der englischen Audit-Trail-Entscheidung erläutern sollte: σχολή.'
  naturalness: Der Entwurf ist überwiegend modernes Standarddeutsch. „diskutierte“ ist für διαλέγεσθαι idiomatisch und präziser als „führte Gespräche“. „zog sich von ihnen zurück“ bezeichnet ἀποστάς klarer als „wandte sich von ihnen ab“.
  terminology: „Der Weg“ bleibt als lukanische Bewegungsbezeichnung erhalten und wird sachlich erläutert. „Lehrsaal des Tyrannus“ ist vertretbar; die alternative Wiedergabe „Schule des Tyrannus“ soll entsprechend der englischen Vorlage als Fußnote verfügbar sein. Die alternative Deutung von ἠπείθουν wird in der Fußnote beibehalten.
  issues:
  - severity: medium
    issue: Fußnote c erläutert das falsche Textelement.
    rationale: Die englische Referenzfußnote zu σχολῇ bietet „school of Tyrannus“ als Alternative. Im deutschen Entwurf steht Fußnote c hingegen für διαλεγόμενος, während „Lehrsaal“ keine entsprechende Alternative erhält.
  - severity: low
    issue: „führte ... Gespräche“ ist für διαλεγόμενος zu allgemein.
    rationale: Das Verb bezeichnet hier ein erörterndes beziehungsweise argumentierendes Reden. „Diskutierte“ wahrt den dialogischen Zug und die argumentative Nuance besser.
  - severity: low
    issue: „wandte er sich von ihnen ab“ kann primär eine innere oder relationale Abkehr ausdrücken.
    rationale: ἀποστὰς ἀπ’ αὐτῶν beschreibt auch einen tatsächlichen Rückzug beziehungsweise ein Sich-Entfernen von der opponierenden Gruppe. „zog sich von ihnen zurück“ bildet dies klarer ab.
  revised_text: Als sich aber einige verhärteten und sich nicht überzeugen ließen[a] und vor der Menge abfällig über den Weg[b] redeten, zog er sich von ihnen zurück, sonderte die Jünger ab und diskutierte täglich im Lehrsaal des Tyrannus.[c]
