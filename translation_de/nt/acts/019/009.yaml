revisions:
- from: Als sich aber einige verhärteten und sich nicht überzeugen ließen[a], sondern vor der Menge abfällig über den Weg[b] redeten, wandte er sich von ihnen ab, sonderte die Jünger aus und führte täglich im Lehrsaal des Tyrannus Gespräche.[c]
  to: Als sich aber einige verhärteten und sich nicht überzeugen ließen[a] und vor der Menge abfällig über den Weg[b] redeten, zog er sich von ihnen zurück, sonderte die Jünger ab und diskutierte täglich im Lehrsaal des Tyrannus.[c]
  rationale: Die Revision schärft die Wiedergabe von ἀποστὰς und διαλεγόμενος, ohne die semantische Offenheit von ἠπείθουν aufzugeben. Sie ordnet die Fußnote c wieder der griechischen σχολή zu und bewahrt damit die in der englischen Audit-Trail-Vorlage dokumentierte lexikalische Alternative. Der Satz bleibt in modernem, würdigem Standarddeutsch und folgt dem griechischen Handlungsablauf.
