id: ACT.19.22
reference: Acts 19:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: de
  text: Nachdem er zwei von denen, die ihm dienten – Timotheus und Erastus –, nach Mazedonien gesandt hatte, blieb er selbst eine Zeit lang in der Provinz Asia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asia war eine römische Provinz im Westen Kleinasiens; gemeint ist nicht der heutige Kontinent Asien.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: Nachdem er … gesandt hatte
  rationale: Das vorzeitige aoristische Partizip wird als abgeschlossene Handlung vor dem Hauptverb natürlich und eindeutig wiedergegeben.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die schwache fortführende Partikel markiert hier vor allem den Erzählfluss; die deutsche Satzfolge trägt diese Funktion ohne zusätzliches Bindewort.
- source_word: εἰς τὴν Μακεδονίαν
  choice: nach Mazedonien
  rationale: Bei geografischen Zielangaben ist „nach“ die natürliche deutsche Entsprechung und bewahrt die Richtungsbedeutung von εἰς.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: zwei von denen, die ihm dienten
  rationale: Die Formulierung bewahrt sowohl die Teilmenge als auch den allgemeinen Dienstgedanken von διακονέω, ohne ein bestimmtes Amt oder bloß eine technische Assistenz anzunehmen.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Timotheus und Erastus
  rationale: Die Namen folgen den im Deutschen etablierten biblischen Formen.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen hebt Paulus im Gegensatz zu den beiden Gesandten hervor.
- source_word: ἐπέσχεν χρόνον
  choice: blieb … noch eine Zeit lang
  rationale: Die Wendung bezeichnet hier das Verweilen für einen gewissen Zeitraum; „noch“ gibt im Deutschen den fortdauernden Aufenthalt natürlich wieder.
- source_word: εἰς τὴν Ἀσίαν
  choice: in der Provinz Asia
  rationale: In Verbindung mit dem Verb des Verweilens ist εἰς hier idiomatisch lokal zu verstehen. „Provinz Asia“ vermeidet die moderne Fehlassoziation mit dem Kontinent und bezeichnet die römische Provinz präzise.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau macht die zeitliche Abfolge und die Betonung von „er selbst“ deutlich. „Dienten“ bleibt bewusst allgemein und legt kein kirchliches Amt fest.
