  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Johannes vollzog eine durch Umkehr geprägte Taufe und forderte das Volk auf, an den nach ihm Kommenden zu glauben; dieser wird ausdrücklich als Jesus identifiziert. „Kommen würde“ gibt die vom Wirken des Johannes her zukünftige Perspektive des Partizips ἐρχόμενον angemessen wieder.'
  naturalness: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die bewusst beibehaltene Verbindung „taufte mit einer Taufe“ ist leicht markiert, aber als textnahe Wiedergabe der griechischen Kognatverbindung gut vertretbar. Die indirekte Rede mit Konjunktiv ist idiomatisch.
  terminology: „Umkehr“ ist für μετανοία eine sachgerechte, nicht einengende Wiedergabe. „Dem Volk“, „an den glauben“ und „an Jesus“ entsprechen dem griechischen Wortlaut und deutschem Sprachgebrauch. Es wird weder „Christus“ noch eine weitergehende theologische Deutung hinzugefügt.
