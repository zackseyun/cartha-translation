reference: Acts 19:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: de
  text: 'Paulus aber sagte: »Johannes taufte mit einer Taufe der Umkehr und sagte dem Volk, es solle an den glauben, der nach ihm kommen würde – das heißt, an Jesus.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: taufte mit einer Taufe der Umkehr
  rationale: Die Formulierung bewahrt die griechische Wortverbindung von Verb und Substantiv, klingt durch „mit“ im Deutschen aber natürlicher. μετανοία wird als „Umkehr“ wiedergegeben, da dies die innere Neuausrichtung und Lebenswende ausdrückt.
- source_word: τῷ λαῷ
  choice: dem Volk
  rationale: λαός bezeichnet hier kollektiv die Menschen, an die Johannes sich wandte. „Dem Volk“ bleibt nah am Griechischen, ohne ausdrücklich „Israel“ hinzuzufügen.
- source_word: λέγων
  choice: und sagte
  rationale: Das begleitende Partizip beschreibt, was Johannes bei seinem Taufen verkündete. Eine koordinierte Formulierung ist im modernen Deutschen klar und natürlich.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: an den glauben, der nach ihm kommen würde
  rationale: Bei πιστεύω bezeichnet εἰς die Person, auf die sich der Glaube richtet, idiomatisch „an“. Die Vergangenheitsform „kommen würde“ passt zur rückblickenden Rede des Paulus und wahrt den Gedanken der zeitlichen Nachfolge.
- source_word: ἵνα πιστεύσωσιν
  choice: es solle ... glauben
  rationale: Nach λέγων kann ἵνα den Inhalt beziehungsweise die Absicht der Aufforderung ausdrücken. Der deutsche Konjunktiv in indirekter Rede gibt dies natürlich wieder.
- source_word: τοῦτ’ ἔστιν
  choice: das heißt
  rationale: Die geläufige deutsche Erläuterungsformel entspricht der identifizierenden Funktion des griechischen Ausdrucks.
- source_word: εἰς τὸν Ἰησοῦν
  choice: an Jesus
  rationale: Das zuvor verwendete πιστεύω ist mitzudenken; daher lautet die natürliche deutsche Verbindung „an Jesus glauben“. Ein Titel wie „Christus“ wird nicht ergänzt, da im griechischen Text nur der Name steht.
theological_decisions:
- issue: Verhältnis der Taufe des Johannes zum Glauben an Jesus
  choice: Die Taufe des Johannes wird als Taufe der Umkehr bezeichnet und mit seiner Aufforderung verbunden, an den nach ihm Kommenden zu glauben, der als Jesus identifiziert wird.
  alternative: Die Taufe des Johannes selbst habe den christlichen Glauben bewirkt.
  rationale: Der Satz unterscheidet sprachlich zwischen dem Taufen des Johannes und seiner begleitenden Verkündigung. Er macht keine weitergehende Aussage über die Heilswirkung seiner Taufe.
- issue: Identität des nach Johannes Kommenden
  choice: Die erklärende Wendung identifiziert ihn ausdrücklich als Jesus.
  alternative: Die Bezeichnung bleibt unbestimmt.
  rationale: τοῦτ’ ἔστιν εἰς τὸν Ἰησοῦν erläutert den zuvor genannten Glaubensgegenstand ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Wiederholung „taufte ... Taufe“ wurde aus Gründen der Textnähe beibehalten, während Syntax und indirekte Rede natürlich deutsch gestaltet wurden.
