source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: de
  text: Viele von denen, die magische Praktiken ausgeübt hatten, brachten ihre Bücher zusammen und verbrannten sie vor aller Augen; sie berechneten deren Wert und kamen auf fünfzigtausend Silberstücke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fünf Myriaden Silber“, also fünfzigtausend Silbereinheiten. Welche Münze gemeint ist, wird nicht angegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: Viele
  rationale: Das Wort bezeichnet hier eine beträchtliche Zahl von Personen; „Viele“ ist natürlich und treffend.
- source_word: τὰ περίεργα πραξάντων
  choice: die Magie betrieben hatten
  rationale: Im Zusammenhang mit Beschwörungen, bösen Geistern und entsprechenden Büchern bezeichnet die Wendung magische Praktiken, nicht bloß ungewöhnliche oder neugierige Tätigkeiten.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: brachten ihre Bücher zusammen
  rationale: Die Formulierung bewahrt die konkrete Handlung des Zusammentragens; „ihre“ ergibt sich aus dem Zusammenhang.
- source_word: κατέκαιον
  choice: verbrannten sie
  rationale: Das Imperfekt kann den Vorgang als im Verlauf darstellen; im natürlichen deutschen Erzählstil gibt „verbrannten“ die öffentliche Verbrennung klar wieder.
- source_word: ἐνώπιον πάντων
  choice: vor aller Augen
  rationale: Die idiomatische Wendung betont, dass die Handlung öffentlich und für alle sichtbar geschah.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: rechnete man ihren Wert zusammen
  rationale: Das Verb bezeichnet das Zusammenrechnen einer Gesamtsumme; der unpersönliche Ausdruck vermeidet eine im Griechischen nicht ausdrücklich identifizierte Personengruppe.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: fünfzigtausend Silberstücke
  rationale: Wörtlich sind es „fünf Myriaden Silber“, also fünfzigtausend Einheiten; die genaue Münzsorte bleibt ungenannt.
theological_decisions:
- issue: Bedeutung von τὰ περίεργα im ephesischen Zusammenhang
  choice: Magie
  alternative: okkulte Praktiken; außergewöhnliche Künste
  rationale: Der unmittelbare Kontext weist auf magische Praktiken. „Magie“ ist klar, historisch angemessen und legt keine konfessionelle Sonderdeutung nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vor aller Augen“ gibt die öffentliche Sichtbarkeit idiomatisch wieder. Die unbestimmte Silbereinheit wird durch eine Fußnote kenntlich gemacht.
