source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: de
  text: 'Da fragte er: „Worauf seid ihr denn getauft worden?“ Sie antworteten: „Auf die Taufe des Johannes.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf Johannes’ Taufe.“'
    reason: Alternative natürliche Wiedergabe des Genitivs Ἰωάννου.
lexical_decisions:
- source_word: εἶπέν τε
  choice: Da fragte er
  rationale: λέγω kann bei der Einleitung einer direkten Frage im Deutschen natürlich mit „fragen“ wiedergegeben werden. Das schwach verbindende τε wird durch „Da“ aufgenommen, ohne den Erzählfluss unnötig zu beschweren.
- source_word: Εἰς τί οὖν
  choice: Worauf ... denn
  rationale: „Worauf“ gibt εἰς τί im Zusammenhang mit „taufen“ idiomatisch wieder und ermöglicht die Wiederaufnahme von εἰς in der Antwort. „Denn“ bildet den folgernden Gesprächston von οὖν natürlich ab.
- source_word: ἐβαπτίσθητε
  choice: seid ihr ... getauft worden
  rationale: Die Form bewahrt das Passiv des griechischen Aorists und ist in modernem Standarddeutsch klar und geläufig.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: Auf die Taufe des Johannes
  rationale: Die Formulierung nimmt die Präposition der Frage wieder auf und bewahrt so den griechischen Parallelismus. Der Genitiv Ἰωάννου bezeichnet die Johannes zugeordnete Taufe, ohne die Art dieser Zuordnung näher festzulegen.
- source_word: βάπτισμα
  choice: Taufe
  rationale: „Taufe“ ist hier die etablierte und sachlich passende Bezeichnung für den mit Johannes verbundenen Ritus; eine Umschreibung wie „Waschungsritus“ wäre unnötig erklärend.
theological_decisions:
- issue: Wiederholung von εἰς in Frage und Antwort
  choice: „Worauf ...?“ / „Auf die Taufe ...“
  alternative: „Welche Taufe habt ihr empfangen?“ / „Die Taufe des Johannes.“
  rationale: Die gewählte Fassung bewahrt die auffällige Parallelstruktur des Griechischen und lässt die mit εἰς ausgedrückte Zuordnung bestehen, ohne daraus eine bestimmte Tauftheologie abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da fragte er“ ist im Dialog natürlicher als das formal mögliche „Und er sagte“. Die etwas markante Konstruktion „Worauf ... getauft“ wurde bewusst beibehalten, weil sie den Parallelismus des griechischen εἰς in Frage und Antwort hörbar macht.
