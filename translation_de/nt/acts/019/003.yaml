  source_fidelity: Die Übersetzung gibt die Satzfolge, die Frageform, den passiven Aorist („seid ... getauft worden“) und die wiederholte Präposition εἰς sachgerecht wieder. „Da fragte er“ ist als idiomatische Wiedergabe von εἶπέν τε bei einer direkten Frage vertretbar; der Bezug auf Johannes bleibt im Genitiv offen und wird nicht theologisch verengt.
  naturalness: „Worauf seid ihr denn getauft worden?“ und die parallele Antwort „Auf die Taufe des Johannes“ sind verständliches modernes Standarddeutsch. Die Konstruktion ist leicht markiert, aber bewusst und angemessen, weil sie die griechische Parallelführung sichtbar macht. Der würdige, knappe Dialogton ist erhalten.
  terminology: „Taufe“ ist der etablierte und kontextgerechte Terminus für βάπτισμα. „Die Taufe des Johannes“ ist eine präzise, nicht konfessionell aufgeladene Wiedergabe von τὸ Ἰωάννου βάπτισμα. Die Fußnote bietet mit „Johannes’ Taufe“ eine echte natürliche Stilvariante.
