id: ACT.19.10
reference: Acts 19:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: de
  text: Das setzte sich zwei Jahre lang fort, sodass alle, die in Asia[a] wohnten, das Wort des Herrn hörten, Juden wie Griechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asia war die römische Provinz im Westen Kleinasiens, nicht der heutige Kontinent Asien.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Das ging ... so
  rationale: Die Wendung blickt auf die fortdauernde Lehrtätigkeit aus dem vorherigen Vers zurück. Die idiomatische deutsche Formulierung gibt diesen zeitlichen Fortgang wieder, ohne eine neue Handlung einzuführen.
- source_word: ἐπὶ ἔτη δύο
  choice: zwei Jahre lang
  rationale: ἐπί mit dem Akkusativ bezeichnet hier die Dauer; „zwei Jahre lang“ ist die natürliche deutsche Wiedergabe.
- source_word: ὥστε
  choice: sodass
  rationale: ὥστε führt die Folge der vorausgehenden Lehrtätigkeit ein; „sodass“ bewahrt diesen resultativen Sinn.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: alle Bewohner der Provinz Asia
  rationale: Das substantivierte Partizip bezeichnet alle dort Wohnenden. Der Zusatz „Provinz“ verhindert im Deutschen unmittelbar die Verwechslung mit dem heutigen Kontinent, während „Asia“ als historischer Eigenname erhalten bleibt.
- source_word: ἀκοῦσαι
  choice: hörten
  rationale: Der Aoristinfinitiv nach ὥστε beschreibt das eingetretene Ergebnis schlicht als Hören.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: „Wort“ bewahrt Lukas’ wiederkehrende Bezeichnung für die verkündigte Botschaft und ihre theologische Textur.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Der Genitiv bestimmt „das Wort“ näher. κύριος wird in seiner üblichen neutestamentlichen Würdebezeichnung mit „Herr“ wiedergegeben.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: Juden wie Griechen
  rationale: Die Formulierung gibt die inklusive Verbindung beider Gruppen knapp und natürlich wieder.
theological_decisions:
- issue: Bedeutung von Ἀσία
  choice: die römische Provinz Asia im Westen Kleinasiens
  alternative: der moderne Kontinent Asien oder ein großräumiger asiatischer Bereich
  rationale: Im Kontext der Apostelgeschichte bezeichnet Ἀσία die römische Provinz. Die historische Bezeichnung „Asia“ bleibt stehen und wird durch Text und Fußnote erläutert.
- issue: Umfang von πάντας
  choice: „alle“ wird uneingeschränkt wiedergegeben
  alternative: eine Abschwächung im Sinn von „sehr viele“ oder „Menschen aus allen Teilen“
  rationale: Der griechische Text formuliert universal. Eine pragmatische Einordnung darf diese Aussage in der Übersetzung nicht stillschweigend abschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Das ging zwei Jahre lang so“ ist idiomatisch und bindet den Vers an die fortdauernde Lehrtätigkeit des vorherigen Verses an. Der historische Provinzname „Asia“ wird zur Unterscheidung vom modernen „Asien“ beibehalten und erläutert.
