  naturalness: Die Satzgliederung ist flüssig und modern. „Die Stadt war voller Verwirrung“ ist idiomatisch und bildet die griechische Füllungsmetapher unmittelbarer ab. „Rissen ... mit sich“ gibt die gewaltsame Dynamik natürlich wieder.
