  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: de
  text: Und die Stadt war voller Verwirrung. Da stürmten sie gemeinsam ins Theater und rissen Gaius und Aristarchus, zwei Makedonier und Reisegefährten des Paulus, mit sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ergriffen Gaius und Aristarchus und rissen sie mit sich“. Das griechische Verb betont ein gewaltsames Ergreifen und Fortreißen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: die ganze Stadt geriet in Aufruhr
  rationale: Die Wendung bezeichnet, dass die Stadt von chaotischer Unruhe erfüllt wurde. „Geriet in Aufruhr“ ist im modernen Deutsch natürlich und gibt den resultativen Sinn wieder; „die ganze Stadt“ macht die umfassende Aussage idiomatisch deutlich.
- source_word: ὥρμησάν
  choice: stürmten
  rationale: Das Verb bezeichnet eine plötzliche, heftige Bewegung. „Stürmten“ passt zur Dynamik der Menschenmenge, ohne eine militärische Bedeutung vorauszusetzen.
- source_word: ὁμοθυμαδόν
  choice: gemeinsam
  rationale: Im Zusammenhang des Tumults bezeichnet das Adverb das geschlossene Handeln der Menge, nicht notwendigerweise eine positiv verstandene Einmütigkeit.
- source_word: θέατρον
  choice: Theater
  rationale: Die direkte Entsprechung wahrt die Bezeichnung des öffentlichen Theaters von Ephesus; „Amphitheater“ wäre enger als der griechische Ausdruck.
- source_word: συναρπάσαντες
  choice: schleppten … mit sich
  rationale: Das Partizip drückt gewaltsames Ergreifen und Mitreißen aus. Die Formulierung verbindet die Gewalt des Zugriffs mit der Bewegung ins Theater.
- source_word: Μακεδόνας
  choice: zwei Makedonier
  rationale: Die geographische Herkunftsbezeichnung wird direkt wiedergegeben; „zwei“ verdeutlicht im Deutschen natürlich die Apposition zu den beiden genannten Männern.
- source_word: συνεκδήμους Παύλου
  choice: die Paulus auf seinen Reisen begleiteten
  rationale: Der Ausdruck bezeichnet Reisegefährten, die mit Paulus unterwegs waren. Die verbale Formulierung klingt im modernen Deutsch natürlich und bewahrt die Beziehung zu Paulus.
