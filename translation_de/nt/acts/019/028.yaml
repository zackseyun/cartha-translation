  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: de
  text: 'Als sie das hörten und von Wut erfüllt wurden[a], schrien sie immer wieder: »Groß ist die Artemis der Epheser!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »voll Zorn wurden«, »von heftigem Zorn erfüllt wurden« oder »in Wut gerieten«. Wörtlich heißt es: »voll von θυμός wurden«; das griechische Wort bezeichnet heftigen Zorn oder Wut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Als sie das hörten
  rationale: Der Aoristpartizip nennt den vorausgehenden Umstand; das im Griechischen unausgesprochene Objekt ergibt sich aus dem Zusammenhang und wird im Deutschen natürlich mit »das« wiedergegeben.
- source_word: δὲ
  choice: und
  rationale: δέ verbindet hier locker, ohne einen deutlichen Gegensatz auszudrücken. »Und« wahrt den Fortgang des Satzes.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: von Wut erfüllt wurden
  rationale: Die Wendung bedeutet wörtlich, dass sie »voll von θυμός wurden«. Die gewählte idiomatische Form bewahrt sowohl das Eintreten des Zustands als auch dessen Intensität.
- source_word: θυμοῦ
  choice: Wut
  rationale: θυμός bezeichnet hier heftigen Zorn beziehungsweise rasende Erregung; »Wut« ist im heutigen Deutsch kräftig und natürlich.
- source_word: ἔκραζον
  choice: schrien sie immer wieder
  rationale: Das Imperfekt stellt das Rufen als andauernd oder wiederholt dar. »Immer wieder« macht diesen Aspekt im Deutschen deutlich.
- source_word: λέγοντες
  choice: ':'
  rationale: Das Partizip führt den Inhalt des Rufens ein. Im Deutschen übernimmt ein Doppelpunkt diese Funktion natürlicher als »indem sie sagten«.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Groß ist die Artemis der Epheser!
  rationale: Die vorangestellte Aussage »Groß ist« erhält den feierlich-rhythmischen Charakter des Zurufs; der Genitiv wird als »der Epheser« präzise bewahrt.
- source_word: Ἄρτεμις
  choice: Artemis
  rationale: Der Eigenname der Göttin wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: Ἐφεσίων
  choice: der Epheser
  rationale: Der substantivierte Genitiv Plural bezeichnet die Einwohner von Ephesus, nicht bloß den Ort.
theological_decisions:
- issue: Wiedergabe eines heidnischen Bekenntnisrufs ohne Zustimmung des Übersetzers
  choice: »Groß ist die Artemis der Epheser!« als direkte Rede
  alternative: »Die Artemis der Epheser ist groß!«
  rationale: Die Übersetzung gibt den Ruf der Menge unverändert als berichtete direkte Rede wieder. Sie schwächt dessen religiösen Gehalt weder ab noch stellt sie ihn als Aussage des Erzählers dar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die fortdauernde beziehungsweise wiederholte Handlung des Imperfekts wird ausdrücklich wiedergegeben; der Zuruf behält seine markante Wortstellung.
