id: ACT.19.16
reference: Acts 19:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: de
  text: Da sprang der Mann, in dem der böse Geist war, auf sie los[a]. Er überwältigte beide[b] und erwies sich ihnen gegenüber als stärker, sodass sie nackt und verwundet aus jenem Haus flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stürzte sich auf sie“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „beide von ihnen“. Obwohl der weitere Zusammenhang mehr als zwei Söhne des Skeuas erwähnt, steht hier ausdrücklich „beide“.'
    reason: textual_narrative_tension
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: sprang ... auf sie los
  rationale: Das Aoristpartizip bezeichnet einen plötzlichen körperlichen Sprung oder Angriff. „Auf sie losspringen“ gibt die gewaltsame Bewegung im modernen Deutschen anschaulich wieder.
- source_word: ὁ ἄνθρωπος
  choice: der Mann
  rationale: Das Substantiv ist maskulin und bezeichnet im Zusammenhang einen männlichen Menschen.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: in dem der böse Geist war
  rationale: Die Formulierung folgt der räumlichen Ausdrucksweise des Griechischen und vermeidet einen späteren technischen Begriff für Besessenheit.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: der böse Geist
  rationale: „Böser Geist“ ist hier die klare, sachgemäße und geläufige Wiedergabe.
- source_word: κατακυριεύσας
  choice: überwältigte
  rationale: Das Verb bezeichnet das Erlangen von Herrschaft oder Übermacht; im gewaltsamen Zusammenhang ist „überwältigen“ natürlich und präzise.
- source_word: ἀμφοτέρων
  choice: beide
  rationale: Das griechische Wort bezeichnet ausdrücklich zwei. Diese Angabe wird trotz der Spannung zum weiteren Zusammenhang nicht geglättet.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: erwies sich ihnen gegenüber als stärker
  rationale: Diese Wiedergabe bewahrt neben „überwältigte“ die eigenständige Aussage, dass der Mann die Oberhand über sie gewann, ohne beide Ausdrücke zusammenzuziehen.
- source_word: γυμνούς
  choice: nackt
  rationale: Das Adjektiv bezeichnet ihren Zustand unmittelbar; eine ergänzende Erklärung, wie sie entkleidet wurden, steht nicht im Text.
- source_word: τετραυματισμένους
  choice: verwundet
  rationale: Das Perfektpartizip beschreibt sie als verwundet und in diesem Zustand verbleibend.
- source_word: ἐκφυγεῖν
  choice: flohen
  rationale: Im Folgesatz bezeichnet der Infinitiv ihre Flucht beziehungsweise ihr Entkommen. Zusammen mit „aus jenem Haus“ ist „flohen“ idiomatisch und wahrt die Bewegungsrichtung.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: aus jenem Haus
  rationale: Die Wendung bezeichnet das Verlassen des konkreten, zuvor gemeinten Hauses.
theological_decisions:
- issue: Darstellung des Verhältnisses zwischen dem bösen Geist und dem Mann
  choice: der Mann, in dem der böse Geist war
  alternative: der von dem bösen Geist besessene Mann
  rationale: Die gewählte Formulierung bildet die Aussage des Griechischen eng ab, ohne einen theologischen Fachbegriff einzuführen.
- issue: Bezugsumfang von ἀμφοτέρων im Verhältnis zur größeren Gruppe
  choice: beide
  alternative: alle beziehungsweise die beiden aus der Gruppe
  rationale: Der Ausgangstext sagt ausdrücklich „beide“. Die daraus entstehende Spannung zum größeren Zusammenhang bleibt erhalten und wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Abfolge der gewaltsamen Handlungen bleibt klar, während die beiden griechischen Aussagen über das Überwältigen und Stärkersein voneinander unterschieden werden. Die Spannung bei „beide“ wird im Haupttext bewahrt und in der Fußnote erläutert.
