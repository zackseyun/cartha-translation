  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: de
  text: Denn wir laufen Gefahr, wegen des heutigen Aufruhrs[a] angeklagt zu werden, da kein Grund vorliegt, aufgrund dessen wir für diese Zusammenrottung[b] Rechenschaft ablegen könnten.« Nachdem er das gesagt hatte, entließ er die Versammlung[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen des heutigen Aufstands“ beziehungsweise „wegen der heutigen Unruhen“. Das griechische Wort kann einen schweren bürgerlichen Aufruhr oder Aufstand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für diesen Menschenauflauf“ beziehungsweise „für diese Unruhe“. Gemeint ist die tumultartige Ansammlung; dafür steht im Griechischen ein anderes Wort als für die anschließende „Versammlung“.'
    reason: lexical_alternative
  - marker: c
    text: Das mit „Versammlung“ übersetzte griechische Wort wird an anderen Stellen häufig für die christliche „Gemeinde“ gebraucht; hier bezeichnet es jedoch die öffentliche Versammlung in Ephesus.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn … sogar
  rationale: „Denn“ bewahrt den begründenden Anschluss; „sogar“ gibt die verstärkende Kraft von γάρ in Verbindung mit καί natürlich wieder.
- source_word: κινδυνεύομεν ἐγκαλεῖσθαι
  choice: wir laufen Gefahr, … angeklagt zu werden
  rationale: Die Formulierung wahrt die gegenwärtige Gefahr und den rechtlich-forensischen Sinn von ἐγκαλεῖσθαι.
- source_word: στάσεως περὶ τῆς σήμερον
  choice: wegen des heutigen Aufruhrs
  rationale: Die knappe deutsche Wendung gibt den Bezug auf das Ereignis dieses Tages wieder. „Aufruhr“ passt zum öffentlichen Tumult und behält den möglichen ernsteren, staatsgefährdenden Beiklang bei.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: es gibt nämlich keinen Grund dafür
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet das Fehlen eines tragfähigen Grundes; „Grund“ lässt den rechtlichen Kontext anklingen, ohne ihn zu überdeuten.
- source_word: ἀποδοῦναι λόγον
  choice: Rechenschaft ablegen
  rationale: Die geläufige deutsche Wendung bewahrt sowohl den formellen als auch den erklärenden Sinn des griechischen Ausdrucks.
- source_word: συστροφῆς
  choice: Zusammenrottung
  rationale: Das Wort bezeichnet hier ein tumultartiges Zusammenströmen. „Zusammenrottung“ unterscheidet diese ungeordnete Menschenansammlung von der anschließend genannten ἐκκλησία und passt zum ordnungsrechtlichen Kontext.
- source_word: ἀπέλυσεν τὴν ἐκκλησίαν
  choice: entließ er die Versammlung
  rationale: „Entließ“ ist für die Beendigung einer öffentlichen Versammlung idiomatisch; „Versammlung“ gibt hier den bürgerlichen, nicht den kirchlichen Sinn von ἐκκλησία wieder.
theological_decisions:
- issue: Bedeutung von ἐκκλησία im Kontext
  choice: Versammlung
  alternative: Gemeinde/Kirche
  rationale: Im Zusammenhang bezeichnet ἐκκλησία die öffentliche Versammlung in Ephesus, nicht die christliche Gemeinde. Die Übersetzung vermeidet daher eine unbegründete kirchliche Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher rechtlicher Färbung. Der Satzbau bleibt dem argumentativen Zusammenhang des griechischen Textes nahe, wird aber für heutige Leser natürlich gegliedert. Das schließende Anführungszeichen markiert das Ende der Rede des Stadtschreibers.
