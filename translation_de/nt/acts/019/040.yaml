  rationale: Die Revision stellt die syntaktische Abhängigkeit des fehlenden Grundes von der geforderten Rechenschaft deutlicher heraus und vermeidet eine nicht erforderliche Wiedergabe von καὶ γάρ mit „sogar“. Die Bedeutung, der juristisch-öffentliche Ton sowie die vorhandenen Fußnotenanker bleiben erhalten.
