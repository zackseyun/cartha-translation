id: ACT.19.26
reference: Acts 19:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: de
  text: Ihr seht und hört doch, dass dieser Paulus nicht nur in Ephesus, sondern in fast ganz Asia[a] eine beträchtliche Menschenmenge überredet und umgestimmt hat. Dabei sagt er, die Götter, die von Menschenhand gemacht werden[b], seien keine Götter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die römische Provinz Asia im Westen Kleinasiens, nicht der heutige Kontinent Asien.
    reason: historical_geography
  - marker: b
    text: 'Wörtlich: „die durch Hände entstehen“; gemeint sind von Menschen angefertigte Götterbilder.'
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: ihr seht und hört doch
  rationale: Die beiden Präsensformen appellieren an das, was die Zuhörer selbst wahrnehmen. „Doch“ gibt den nachdrücklichen, rhetorischen Ton im Deutschen natürlich wieder, ohne einen zusätzlichen Sachinhalt einzuführen.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: nicht nur in Ephesus, sondern in fast ganz Asia
  rationale: Die Genitive werden dem Zusammenhang entsprechend lokativ wiedergegeben. „Asia“ bezeichnet hier die römische Provinz und nicht den heutigen Kontinent.
- source_word: ὁ Παῦλος οὗτος
  choice: dieser Paulus
  rationale: Die Wortstellung mit dem Demonstrativ hat in der Rede des Demetrius einen abwertenden oder distanzierenden Beiklang, den „dieser Paulus“ bewahrt.
- source_word: πείσας μετέστησεν
  choice: überredet und umgestimmt hat
  rationale: Die Wiedergabe wahrt sowohl das Überreden als auch die dadurch bewirkte Abkehr beziehungsweise den Positionswechsel. „Umgestimmt“ vermeidet, ein im Griechischen nicht ausdrücklich genanntes Objekt der Abkehr einzusetzen.
- source_word: ἱκανὸν ὄχλον
  choice: eine beträchtliche Menschenmenge
  rationale: ἱκανός bezeichnet hier eine zahlenmäßig beachtliche Menge; „beträchtlich“ erhält diesen Akzent.
- source_word: λέγων ὅτι
  choice: dabei sagt er
  rationale: Das Partizip führt den Inhalt ein, mit dem Paulus die Menschen umstimmt. Die finite deutsche Form ist natürlich und erhält den sachlichen Zusammenhang.
- source_word: οὐκ εἰσὶν θεοὶ
  choice: seien keine Götter
  rationale: Der Konjunktiv markiert im Deutschen die indirekte Wiedergabe der Behauptung des Paulus; die klare Verneinung ihres göttlichen Status bleibt erhalten.
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: die von Menschenhand gemacht werden
  rationale: Die idiomatische Formulierung meint durch menschliches Handwerk hergestellte Götterbilder. „Von Menschenhand“ macht den im Griechischen vorausgesetzten menschlichen Urheber verständlich.
theological_decisions:
- issue: Aussage über den göttlichen Status menschengemachter Kultbilder
  choice: die Götter, die von Menschenhand gemacht werden, seien keine Götter
  alternative: von Händen gemachte Dinge seien keine Götter
  rationale: Die Formulierung bewahrt die zugespitzte Wiederholung von θεοί und gibt die direkte Bestreitung des göttlichen Status hergestellter Götter wieder, ohne eine weitergehende metaphysische Aussage hinzuzufügen.
- issue: Nicht ausdrücklich genanntes Ziel der Abkehr
  choice: überredet und umgestimmt
  alternative: überredet und vom Götterkult abgebracht
  rationale: Das Verb μεθίστημι bezeichnet einen bewirkten Wechsel, nennt hier aber nicht ausdrücklich, wovon die Menschen abgebracht wurden. Die Übersetzung lässt diese syntaktische Offenheit bestehen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Rede bleibt deutlich anklagend; „dieser Paulus“ bewahrt den distanzierenden Ton des Demetrius. „Menschenmenge“ ist verständlicher als das stärker ereignisbezogene „Menschenauflauf“.
