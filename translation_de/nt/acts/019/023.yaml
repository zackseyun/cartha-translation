base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: de
  text: Zu jener Zeit entstand in Bezug auf den Weg[a] ein nicht geringer Aufruhr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »dem Weg« ist hier die christliche Bewegung gemeint; diese Bezeichnung begegnet mehrfach in der Apostelgeschichte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: kam es zu
  rationale: Die idiomatische deutsche Wendung gibt das Eintreten eines Ereignisses wieder und verbindet sich natürlich mit »Unruhen«.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ markiert hier einen leichten narrativen Übergang. Im Deutschen stellt die vorangestellte Zeitangabe den Anschluss ausreichend her; ein zusätzliches »aber« oder »nun« würde den Gegensatz beziehungsweise Einschnitt zu stark hervorheben.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: um jene Zeit
  rationale: Die Wendung bezeichnet den betreffenden Zeitraum. »Um jene Zeit« ist natürliches ErzählDeutsch und lässt die zeitliche Ausdehnung offen.
- source_word: τάραχος
  choice: Unruhen
  rationale: τάραχος bezeichnet Aufruhr oder öffentliche Unordnung. Der deutsche Plural »Unruhen« ist in diesem Zusammenhang idiomatisch, ohne bereits einen förmlichen Aufstand oder eine juristisch bestimmte Ausschreitung anzunehmen.
- source_word: οὐκ ὀλίγος
  choice: erheblich
  rationale: Die griechische Litotes bedeutet, dass die Unruhen beträchtlich waren. Eine wörtliche Form wie »nicht gering« wirkt mit »Unruhen« im heutigen Deutsch schwerfällig; »erheblich« bewahrt die Stärke natürlich.
- source_word: περὶ
  choice: wegen
  rationale: περί mit dem Genitiv bezeichnet hier den Gegenstand beziehungsweise Anlass der Unruhen. »Wegen« ist im Deutschen knapp und kontextgerecht.
- source_word: τῆς ὁδοῦ
  choice: des Weges
  rationale: In der Apostelgeschichte dient »der Weg« wiederholt als Bezeichnung für die christliche Bewegung. Der bestimmte Artikel und die Großschreibung des deutschen Substantivs bewahren die Form, ohne eine erklärende Benennung in den Text einzufügen.
theological_decisions:
- issue: τῆς ὁδοῦ als Bezeichnung der christlichen Bewegung
  choice: des Weges
  alternative: des Weges, das heißt der christlichen Bewegung
  rationale: Die knappe, bildhafte Bezeichnung des Ausgangstextes bleibt erhalten. Die Referenz wird in einer Fußnote erklärt, statt im Haupttext theologisch ausgedeutet zu werden.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles ErzählDeutsch. Der Satz vermeidet einen unnötigen einleitenden Diskursmarker und bewahrt die in der Apostelgeschichte charakteristische Bezeichnung »der Weg«.
