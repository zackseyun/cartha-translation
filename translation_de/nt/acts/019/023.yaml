  - severity: medium
    issue: »wegen des Weges« fasst περὶ unnötig kausal.
    rationale: περὶ mit Genitiv markiert den Gegenstand bzw. Streitpunkt des Aufruhrs. »In Bezug auf« erhält diese offenere Beziehung und vermeidet eine stärkere Kausalbehauptung.
  - severity: low
    issue: Die Litotes οὐκ ὀλίγος wird mit »erheblich« geglättet.
    rationale: »Nicht geringer« ist im Deutschen noch natürlich und bewahrt die rhetorische Ausdrucksweise des Ausgangstextes.
