  source_fidelity: Die Zeitangabe und der ereignishafte Ausdruck sind im Entwurf grundsätzlich zutreffend. τάραχος steht jedoch im Singular; »Unruhen« verschiebt dies zu mehreren Unruheereignissen. Außerdem bezeichnet περὶ hier vorrangig den Gegenstand des Aufruhrs, nicht zwingend dessen Ursache. Die Litotes οὐκ ὀλίγος sollte möglichst erhalten bleiben.
  naturalness: »Zu jener Zeit entstand in Bezug auf den Weg ein nicht geringer Aufruhr« ist modernes, verständliches Standarddeutsch und bewahrt zugleich die lukanische Litotes. Es ist etwas formeller als Umgangssprache, passt aber zum erzählenden Register.
  terminology: »der Weg« bewahrt die in der Apostelgeschichte wiederkehrende Selbst- bzw. Bewegungsbezeichnung. Da deutsche Substantive ohnehin großgeschrieben werden, kann die Titelhaftigkeit nicht allein durch Großschreibung signalisiert werden; die Fußnote erläutert den Bezug angemessen.
  issues:
