  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Habt ihr den Heiligen Geist empfangen, als ihr gläubig wurdet?[a]« Sie antworteten ihm: »Nein, wir haben noch nicht einmal gehört, dass es einen Heiligen Geist gibt.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Habt ihr den Heiligen Geist empfangen, nachdem ihr gläubig geworden wart?« Das griechische Partizip lässt bei der zeitlichen Beziehung eine leicht unterschiedliche Nuance zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wir haben noch nicht einmal gehört, ob es einen Heiligen Geist gibt«; stärker deutend auch: »Wir haben noch nicht einmal gehört, dass der Heilige Geist gegeben worden ist.«'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Und er fragte sie
  rationale: τέ verbindet die Aussage leicht mit dem vorausgehenden Bericht. Da eine direkte Frage folgt, gibt »fragte« das in diesem Zusammenhang verwendete λέγω im natürlichen Deutschen treffend wieder.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: Habt ihr ... empfangen, als ihr zum Glauben kamt?
  rationale: Das Aoristpartizip πιστεύσαντες steht in zeitlicher Beziehung zu ἐλάβετε. »Als ihr zum Glauben kamt« wahrt diese Beziehung, ohne zwingend eine strikte zeitliche Abfolge oder völlige Gleichzeitigkeit festzulegen.
- source_word: πνεῦμα ἅγιον
  choice: den Heiligen Geist
  rationale: Im Kontext bezeichnet der Ausdruck Gottes Heiligen Geist. Artikel und Großschreibung entsprechen dem natürlichen deutschen Sprachgebrauch bei persönlicher Bezugnahme.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Sie antworteten ihm
  rationale: δέ führt die Erwiderung weiter; das im Griechischen aus dem Kontext zu ergänzende Sprechverb wird im Deutschen idiomatisch mit »antworteten« wiedergegeben.
- source_word: Ἀλλ’ οὐδ’
  choice: Nein, ... noch nicht einmal
  rationale: Die Verbindung verstärkt die Verneinung. Diese Formulierung gibt die nachdrückliche Antwort im Deutschen natürlich wieder.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: wir haben noch nicht einmal gehört, dass es einen Heiligen Geist gibt
  rationale: οὐδὲ εἰ kann hier als »nicht einmal, dass« oder »nicht einmal, ob« verstanden werden. Die Hauptfassung folgt dem unmittelbaren Wortlaut, ohne die nicht ausdrücklich genannte Deutung »dass der Heilige Geist gegeben worden ist« in den Text aufzunehmen.
theological_decisions:
- issue: Zeitliches Verhältnis zwischen Glauben und dem Empfang des Heiligen Geistes
  choice: »als ihr zum Glauben kamt«
  alternative: »nachdem ihr zum Glauben gekommen wart« oder »als ihr gläubig wurdet«
  rationale: Das griechische Partizip kennzeichnet einen zeitlichen Zusammenhang, legt aber für sich genommen keine detaillierte Lehre über Nachzeitigkeit oder Gleichzeitigkeit fest. Die gewählte Fassung bewahrt diese Offenheit.
- issue: Bedeutung der Unkenntnis der Jünger über den Heiligen Geist
  choice: »dass es einen Heiligen Geist gibt«
  alternative: '»ob es einen Heiligen Geist gibt« oder deutender: »dass der Heilige Geist gegeben worden ist«'
  rationale: Die knappe griechische Formulierung lässt eine gewisse Deutungsbreite zu. Die Hauptfassung bleibt beim direkten Sinn; die Fußnote dokumentiert die sprachliche Alternative und die verbreitete kontextuelle Deutung, ohne sie in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und alltagssprachlich verständlich; zugleich bleiben die zeitliche Offenheit des Partizips und die knappe, spannungsreiche Aussage über den Heiligen Geist erhalten.
