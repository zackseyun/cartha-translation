id: ACT.26.27
reference: Acts 26:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: de
  text: König Agrippa, glaubst du den Propheten[a]? Ich weiß, dass du glaubst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: schenkst du den Propheten Glauben; auch: vertraust du den Propheten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: glaubst du / du glaubst
  rationale: Das Präsens Aktiv bezeichnet hier zunächst eine direkte Frage und wird anschließend pointiert wiederholt. „Glauben“ bewahrt sowohl die Wiederholung als auch den Bezug auf das Zeugnis der Propheten.
- source_word: βασιλεῦ Ἀγρίππα
  choice: König Agrippa
  rationale: Der Vokativ wird in natürlicher moderner deutscher Anrede ohne das altertümliche „o“ wiedergegeben; der Personenname folgt der üblichen deutschen Form.
- source_word: τοῖς προφήταις
  choice: den Propheten
  rationale: Der Dativ bei πιστεύω bezeichnet hier diejenigen, deren Zeugnis man glaubt. Die direkte Wiedergabe vermeidet eine unnötige Festlegung auf „Schriften“ oder „Botschaft“, obwohl beides sachlich mitgemeint sein kann.
- source_word: οἶδα
  choice: ich weiß
  rationale: Die Perfektform hat präsentische Bedeutung und drückt eine klare Feststellung aus, die mit „ich weiß“ unmittelbar wiedergegeben wird.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was Paulus weiß.
theological_decisions:
- issue: Art des Glaubens an die Propheten
  choice: „den Propheten glauben“ als Anerkennung ihres Zeugnisses
  alternative: „an die Propheten glauben“, „den Propheten vertrauen“ oder ausdrücklich „ihre Botschaft für wahr halten“
  rationale: Der griechische Dativ legt nahe, dass Agrippa dem Zeugnis der Propheten Glauben schenkt. Die Formulierung behauptet weder bloß ihre Existenz noch entfaltet sie über den unmittelbaren rhetorischen Zusammenhang hinaus eine umfassende Glaubenslehre.
- issue: Objektloses zweites πιστεύεις
  choice: „dass du glaubst“
  alternative: „dass du ihnen glaubst“
  rationale: Das Griechische wiederholt das Verb ohne ausdrückliches Objekt. Die gewählte Fassung erhält diese knappe, rhetorisch zugespitzte Form und lässt den vorausgehenden Bezug auf die Propheten aus dem Zusammenhang hervorgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede ist natürlich formuliert; die knappe Wiederholung im zweiten Satz bewahrt den rhetorischen Nachdruck des griechischen Textes.
