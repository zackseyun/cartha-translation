id: ACT.26.6
reference: Acts 26:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: de
  text: Und nun stehe ich vor Gericht wegen der Hoffnung auf die Verheißung, die Gott unseren Vätern[a] gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseren Vorfahren“. Wörtlich steht im Griechischen „unseren Vätern“; gemeint sind Israels Vorväter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt den Übergang von der vorausgehenden Rede zu Paulus’ gegenwärtiger Lage in natürlichem Deutsch.
- source_word: ἐπ’ ἐλπίδι
  choice: wegen der Hoffnung
  rationale: ἐπί mit Dativ bezeichnet hier den Grund beziehungsweise die Grundlage des Gerichtsverfahrens; „wegen“ gibt den kausalen Zusammenhang klar wieder.
- source_word: τῆς … ἐπαγγελίας
  choice: auf die Verheißung
  rationale: Der Genitiv bestimmt die Hoffnung näher. Im Deutschen ist „Hoffnung auf die Verheißung“ idiomatischer als eine formale Wiedergabe mit „der“, ohne den sachlichen Bezug aufzulösen.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: die … unseren Vätern gegeben hat
  rationale: εἰς bezeichnet die Empfänger beziehungsweise Ausrichtung der Verheißung; der Relativsatz gibt dies in natürlichem Deutsch wieder.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: die Gott … gegeben hat
  rationale: Das Partizip mit ὑπό nennt Gott als Urheber. „gegeben hat“ ist für eine göttliche Verheißung idiomatisch und wahrt die göttliche Initiative.
- source_word: πατέρας ἡμῶν
  choice: unseren Vätern
  rationale: Gibt die ausdrücklich maskuline Form und den Bezug auf Israels Vorväter direkt wieder; „Vorfahren“ bleibt als mögliche verständniserleichternde Alternative in der Fußnote.
- source_word: ἕστηκα κρινόμενος
  choice: stehe ich vor Gericht
  rationale: ἕστηκα hat gegenwärtig-stativen Sinn, und κρινόμενος bezeichnet hier die gerichtliche Verhandlung. Die deutsche Wendung ist prägnant und natürlich.
theological_decisions:
- issue: Identität der „Väter“
  choice: Israels Väter beziehungsweise Vorväter als Empfänger der göttlichen Verheißung
  alternative: allgemein die Vorfahren des jüdischen Volkes
  rationale: Im Zusammenhang von Paulus’ Rede vor Agrippa verweist die Formulierung auf Israels Verheißungsgeschichte. Der Haupttext bewahrt die konkrete Bezeichnung, ohne die genaue Gruppe über den Wortlaut hinaus festzulegen.
- issue: Verhältnis von Hoffnung und Verheißung
  choice: „Hoffnung auf die Verheißung“
  alternative: „Hoffnung, die aus der Verheißung erwächst“
  rationale: Der knappe Genitiv wird nicht zu einer theologischen Erklärung ausgeweitet. So bleibt offen, ob stärker der Inhalt, die Erfüllung oder die von der Verheißung begründete Hoffnung akzentuiert ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vor Gericht stehen“ bildet den juristischen Kontext natürlich ab; „Verheißung“ bewahrt den biblisch-theologischen Ton, ohne konfessionelle Zusätze.
