id: ACT.26.18
reference: Acts 26:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: de
  text: um ihnen die Augen zu öffnen, damit sie sich von der Finsternis zum Licht und von der Herrschaft Satans[a] zu Gott wenden und Vergebung der Sünden sowie ein Erbteil unter denen empfangen, die durch den Glauben an mich geheiligt sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „von der Macht Satans“ oder „aus dem Herrschaftsbereich Satans“. Das griechische Wort kann Autorität, herrschende Macht oder einen Herrschaftsbereich bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „heilig gemacht worden sind“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: ihnen die Augen zu öffnen
  rationale: Bewahrt das anschauliche Bild geöffneter Augen, das hier zugleich geistliche Wahrnehmung bezeichnet, ohne es erklärend aufzulösen.
- source_word: τοῦ ἐπιστρέψαι
  choice: damit sie sich … wenden
  rationale: Gibt den Zweck des articularen Infinitivs wieder und erhält die Umkehr- und Richtungsbewegung des Verbs.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: von der Finsternis zum Licht
  rationale: Die metaphorische Gegenüberstellung ist im Deutschen klar und kann unmittelbar erhalten bleiben.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: von der Herrschaft Satans
  rationale: ἐξουσία kann Autorität, Macht oder Herrschaftsbereich bezeichnen. „Herrschaft“ verbindet regierende Macht und Bereich, ohne bloß körperliche Stärke nahezulegen.
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: und … empfangen
  rationale: Der zweite Zweckinfinitiv wird in die von „damit“ eröffnete Satzkonstruktion einbezogen; „empfangen“ wahrt den Charakter einer gewährten Gabe.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: Vergebung der Sünden
  rationale: Dies ist die klare, eingebürgerte und gegenwärtig verständliche Wiedergabe.
- source_word: κλῆρον
  choice: ein Erbteil
  rationale: Im heilsgeschichtlichen Zusammenhang bezeichnet κλῆρος den zugeteilten Anteil am Erbe des Gottesvolkes. „Erbteil“ bewahrt diese Konnotation, während „Anteil“ ebenfalls möglich ist.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: unter denen, die … geheiligt sind
  rationale: Die Formulierung bewahrt sowohl die Zugehörigkeit zu einer Gruppe als auch den passiven und fortdauernden Zustand des Perfektpartizips.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: durch den Glauben an mich
  rationale: Der Dativ wird instrumental verstanden; εἰς ἐμέ bezeichnet Jesus als Ziel beziehungsweise Gegenstand des Glaubens.
theological_decisions:
- issue: Bezug und Bedeutung von πίστει τῇ εἰς ἐμέ
  choice: die durch den Glauben an mich geheiligt sind
  alternative: die durch das Vertrauen auf mich geheiligt sind
  rationale: Die Wortgruppe steht am natürlichsten bei τοῖς ἡγιασμένοις und bezeichnet das Mittel der Heiligung. „Glaube an mich“ ist die direkte, theologisch nicht einengende Wiedergabe; „Vertrauen auf mich“ bleibt lexikalisch möglich.
- issue: Bedeutungsumfang von κλῆρος
  choice: ein Erbteil
  alternative: einen Anteil
  rationale: „Erbteil“ bringt den biblischen Zusammenhang des zugeteilten Erbes zur Geltung, ohne auszuschließen, dass das Wort allgemeiner einen Anteil oder ein Los bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur hält die beiden Zweckangaben zusammen, vermeidet jedoch unnötig schwerfällige Infinitivketten. Die Bildsprache von Finsternis und Licht sowie die passive Formulierung der Heiligung bleiben erhalten.
