source:
  edition: SBLGNT
  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: de
  text: 'Nachdem sie sich zurückgezogen hatten, sagten sie zueinander: »Dieser Mann tut nichts, was Todesstrafe oder Haft[a] verdient.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Fesseln«; gemeint ist hier wahrscheinlich Haft oder Gefangenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: Nachdem sie sich zurückgezogen hatten
  rationale: Das Aoristpartizip bezeichnet das vorausgehende Weggehen aus der öffentlichen Verhandlung; die Formulierung gibt diese zeitliche Abfolge natürlich wieder.
- source_word: ἐλάλουν πρὸς ἀλλήλους λέγοντες
  choice: sagten sie zueinander
  rationale: Der griechische Imperfekt beschreibt das Gespräch untereinander. Im Deutschen gibt die idiomatische Formulierung den Austausch klar wieder, ohne die schwerfällige Doppelung »sprachen … und sagten«.
- source_word: Οὐδὲν ... ἄξιον
  choice: nichts, was ... verdient
  rationale: Die Relativsatzkonstruktion ist in modernem Deutsch natürlich und bewahrt den Sinn, dass keine Handlung des Mannes die genannten Strafen rechtfertigt.
- source_word: θανάτου ἢ δεσμῶν
  choice: den Tod oder eine Gefangenschaft
  rationale: »Tod« bezeichnet hier die Todesstrafe; δεσμά meint wörtlich Fesseln, im gerichtlichen Zusammenhang jedoch Haft oder Gefangenschaft. Die Fußnote bewahrt das konkrete Bild des Ausgangstextes.
- source_word: τι πράσσει
  choice: tut
  rationale: Das Präsens und die allgemeine Bedeutung von πράσσω werden knapp wiedergegeben; »begeht« würde eine Straftat stärker voraussetzen, als der griechische Wortlaut es tut.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Dieser Mann
  rationale: Die Formulierung entspricht dem bestimmten männlichen Bezug auf Paulus und klingt im Deutschen natürlich.
