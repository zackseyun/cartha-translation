  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: de
  text: 'Agrippa aber sagte zu Festus: »Dieser Mann hätte freigelassen werden können, wenn er sich nicht auf den Kaiser berufen hätte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ verbindet Agrippas abschließende Bemerkung mit dem Vorhergehenden und kann hier zugleich einen leichten Übergang beziehungsweise Kontrast markieren. »Aber« bewahrt diese Funktion im Deutschen.
- source_word: ἔφη
  choice: sagte
  rationale: Der Imperfekt von φημί dient hier als gewöhnliche Redeeinleitung; »sagte« ist natürlich und überbetont den Aspekt nicht.
- source_word: Ἀπολελύσθαι
  choice: freigelassen werden
  rationale: Der Perfektinfinitiv von ἀπολύω bezeichnet in diesem rechtlichen Zusammenhang die Freilassung. »Freigesprochen« wäre zu eng, da keine formelle Unschuldsfeststellung ausgesagt werden muss.
- source_word: ἐδύνατο
  choice: hätte ... können
  rationale: In Verbindung mit der irrealen Bedingung bezeichnet δύναμαι eine nicht verwirklichte Möglichkeit in der Vergangenheit. Die deutsche Konstruktion »hätte ... können« gibt dies idiomatisch wieder.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: dieser Mann
  rationale: Die Wendung verweist ausdrücklich auf den männlichen Einzelnen Paulus und bewahrt mit »dieser« die demonstrative Kraft von οὗτος.
- source_word: εἰ μὴ
  choice: wenn ... nicht
  rationale: Die Verbindung leitet hier eine irreale Bedingung ein. »Wenn er nicht ... hätte« bildet deren Logik im Deutschen klar ab.
- source_word: ἐπεκέκλητο
  choice: Berufung ... eingelegt hätte
  rationale: ἐπικαλέω bezeichnet mit »Kaiser« im römischen Rechtskontext die rechtliche Berufung an den Kaiser. Die feste deutsche Rechtswendung ist präzise und verständlich.
- source_word: Καίσαρα
  choice: beim Kaiser
  rationale: Καῖσαρ ist der historische Herrschertitel. »Kaiser« ist im Deutschen die natürliche Entsprechung und bewahrt den rechtlichen Bezug der Berufung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nah am griechischen Gedankengang, während der irreale Bedingungssatz idiomatisch deutsch formuliert ist. Keine Fußnote ist nötig, da »freigelassen werden« die relevante Bedeutungsbreite von ἀπολύω ohne sachlichen Verlust wiedergibt.
