    issue: „Berufung beim Kaiser eingelegt“ ist für ἐπεκέκλητο weniger idiomatisch und rechtlich weniger unmittelbar.
    rationale: ἐπικαλεῖσθαι Καίσαρα bezeichnet den Rekurs bzw. die Berufung auf/an Caesar. Die Formulierung „sich auf den Kaiser berufen“ gibt diese feste Bedeutung unmittelbar wieder, ohne eine Aussage über den formalen Ort der Einlegung zu implizieren.
