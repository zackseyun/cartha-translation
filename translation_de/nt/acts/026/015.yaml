  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: de
  text: 'Ich sagte: »Wer bist du, Herr?[a]« Der Herr antwortete: »Ich bin Jesus, den du verfolgst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Herr«. Das griechische Wort kann auch als respektvolle Anrede gebraucht werden; hier spricht jedoch die himmlische Erscheinung, die sich unmittelbar als Jesus zu erkennen gibt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: Ich sagte
  rationale: δέ ist hier ein schwaches narratives Bindewort. Im natürlichen Deutschen muss es nicht eigens wiedergegeben werden; das ausdrückliche ἐγώ ist mit »ich« angemessen erfasst, ohne zusätzliche Betonung einzutragen.
- source_word: Τίς εἶ, κύριε;
  choice: Wer bist du, Herr?
  rationale: τίς εἶ bedeutet direkt »Wer bist du?«. κύριε wird angesichts der himmlischen Erscheinung und der unmittelbaren Selbstoffenbarung Jesu mit »Herr« wiedergegeben; die mögliche höfliche Anrede »mein Herr« wird in einer Fußnote genannt.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: Der Herr antwortete
  rationale: ὁ κύριος bezeichnet den bereits angesprochenen und nun als Jesus identifizierten Sprecher. εἶπεν kann wörtlich »sagte« heißen; »antwortete« gibt in diesem Frage-Antwort-Zusammenhang denselben Sprechakt natürlich wieder. Das schwache δέ bleibt unausgedrückt.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ich bin Jesus
  rationale: Die direkte Selbstidentifikation wird schlicht wiedergegeben. Das ausdrückliche ἐγώ rechtfertigt hier keine künstliche Verstärkung wie »Ich selbst«.
- source_word: ὃν σὺ διώκεις
  choice: den du verfolgst
  rationale: διώκω bezeichnet hier feindseliges Verfolgen. Das deutsche Präsens gibt die andauernde Handlung natürlich wieder; das ausdrückliche σὺ wird durch »du« erfasst, ohne eine im Deutschen unnatürliche Zusatzbetonung.
theological_decisions:
- issue: Wiedergabe von κύριε in Sauls Anrede
  choice: Herr
  alternative: mein Herr; mein Herr im höflichen Sinn
  rationale: Die Anrede kann für sich genommen respektvoll gemeint sein. Im Zusammenhang einer himmlischen Erscheinung und der sofortigen Identifikation des Sprechers als Jesus bewahrt »Herr« jedoch am besten das Gewicht der Szene, ohne die lexikalische Mehrdeutigkeit zu verschweigen.
- issue: Wiedergabe von ὁ κύριος für den Sprecher
  choice: der Herr
  alternative: der Sprecher
  rationale: Der griechische Text bezeichnet den Antwortenden ausdrücklich als ὁ κύριος. »Der Herr« erhält diese Identifikation und ihren theologischen Gehalt.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die direkte Rede ist flüssig gestaltet; die Mehrdeutigkeit der Anrede κύριε wird durch eine Fußnote offengehalten.
