  source_fidelity: Der deutsche Text gibt μάλιστα als verstärkende Begründung („vor allem weil“) passend wieder und trifft γνώστην ὄντα mit „du ... genau kennst“ idiomatisch. „alle Bräuche und Streitfragen unter den Juden“ bewahrt sowohl den Bezugsbereich von κατὰ Ἰουδαίους als auch die Koordination von ἐθῶν τε καὶ ζητημάτων. „Darum bitte ich dich, mich geduldig anzuhören“ entspricht διὸ δέομαι μακροθύμως ἀκοῦσαί μου ohne zusätzliche Deutung.
