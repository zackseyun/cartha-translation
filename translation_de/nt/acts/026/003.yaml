  variant: modern standard German
source:
  edition: SBLGNT
  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: de
  text: vor allem weil du alle Bräuche und Streitfragen unter den Juden genau kennst.[a] Darum bitte ich dich, mich geduldig anzuhören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil du alle jüdischen Bräuche und Streitfragen genau kennst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: vor allem weil
  rationale: Die Wendung hebt den besonderen Grund hervor, weshalb Paulus sich glücklich schätzt, sich vor Agrippa verteidigen zu dürfen; „weil“ gibt den Zusammenhang des Partizips im Deutschen natürlich wieder.
- source_word: γνώστην ὄντα σε
  choice: weil du … genau kennst
  rationale: Die partizipiale Akkusativkonstruktion bezeichnet Agrippa als sachkundig. Die verbale Formulierung ist modernes, natürliches Deutsch und vermeidet die mögliche Übertreibung „Experte“.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: alle Bräuche … unter den Juden
  rationale: κατὰ Ἰουδαίους bezeichnet den jüdischen Bezugsbereich. „Unter den Juden“ wahrt diese relationale Formulierung; „alle jüdischen Bräuche“ ist ebenfalls möglich.
- source_word: τε καὶ
  choice: und
  rationale: Die Partikelverbindung koordiniert Bräuche und Streitfragen; ein schlichtes „und“ ist im Deutschen idiomatisch.
- source_word: ζητημάτων
  choice: Streitfragen
  rationale: Das Wort bezeichnet hier strittige Fragen beziehungsweise Gegenstände der Auseinandersetzung. „Streitfragen“ erhält sowohl den Frage- als auch den Konfliktaspekt.
- source_word: διὸ
  choice: Darum
  rationale: Das Wort leitet die Folgerung aus Agrippas genauer Kenntnis ein.
- source_word: δέομαι
  choice: bitte ich dich
  rationale: Das Verb bezeichnet eine eindringliche Bitte. „Bitte ich dich“ ist würdig und natürlich; „flehe ich dich an“ wäre im Deutschen für diesen Zusammenhang zu stark.
- source_word: μακροθύμως
  choice: geduldig
  rationale: Das Adverb bittet um ein geduldiges, nachsichtiges Anhören.
- source_word: ἀκοῦσαί μου
  choice: mich … anzuhören
  rationale: Das griechische Verb mit Genitiv bedeutet, jemandem zuzuhören beziehungsweise ihn anzuhören. Im Kontext einer Verteidigungsrede ist „mich anzuhören“ besonders passend.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz beginnt als Fortsetzung von Vers 2 bewusst mit einem Kleinbuchstaben. „Streitfragen“ wahrt die Spannweite von ζητήματα besser als das neutralere „Fragen“; „bitte“ vermittelt die ernsthafte Bitte ohne unnatürliche Übersteigerung.
