  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Grundsinn des griechischen Textes zutreffend wieder: Agrippa richtet sich an Paulus, und ἐν ὀλίγῳ wird als zeitliche Wendung wiedergegeben. »überzeugst du mich, Christ zu werden« gibt με πείθεις Χριστιανὸν ποιῆσαι idiomatisch und ohne zusätzliche Deutung wieder. Die umstrittene Reichweite von Ἐν ὀλίγῳ sowie der mögliche ironische Ton bleiben angemessen in der Fußnote offen.'
