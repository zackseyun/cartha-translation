  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: de
  text: 'Da sagte Agrippa zu Paulus[a]: »In kurzer Zeit überzeugst du mich, Christ zu werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Beinahe überzeugst du mich, Christ zu werden«, oder: »Du meinst, du könntest mich in so kurzer Zeit zum Christen machen?« Die griechische Wendung kann sich auf eine kurze Zeit oder ein geringes Maß beziehen; Agrippas Ton kann ernst oder ironisch gemeint sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: Da sagte Agrippa
  rationale: δέ ist hier ein schwaches erzählerisches Bindewort. »Da« führt den Dialog natürlich weiter, ohne einen starken Gegensatz auszudrücken; das im Griechischen nur sinngemäß vorausgesetzte Redeverb wird im Deutschen ergänzt.
- source_word: πρὸς τὸν Παῦλον
  choice: zu Paulus
  rationale: πρός bezeichnet hier den Adressaten der Äußerung. Zusammen mit dem ergänzten »sagte« ergibt sich eine natürliche deutsche Redeformel.
- source_word: Ἐν ὀλίγῳ
  choice: In kurzer Zeit
  rationale: Die Wendung kann eine geringe Zeitspanne oder ein geringes Maß bezeichnen. Die Hauptübersetzung gibt den naheliegenden zeitlichen Sinn wieder; andere mögliche Nuancen werden in der Fußnote bewahrt.
- source_word: με πείθεις
  choice: überzeugst du mich
  rationale: Das Präsens πείθεις beschreibt den gegenwärtigen Überzeugungsvorgang. Die deutsche Form bleibt nah am Wortlaut und legt nicht zusätzlich fest, ob Paulus nur einen Versuch unternimmt.
- source_word: Χριστιανὸν
  choice: Christ
  rationale: Das prädikative Akkusativwort bezeichnet die Identität beziehungsweise den Status, zu dem Agrippa gebracht werden soll. »Christ« ist die etablierte, präzise deutsche Entsprechung.
- source_word: ποιῆσαι
  choice: zu werden
  rationale: In der Konstruktion mit πείθω bezeichnet ποιῆσαι das Herbeiführen eines neuen Status. Idiomatisches Deutsch sagt »jemanden überzeugen, Christ zu werden« statt wörtlicher »mich zu einem Christen machen«.
theological_decisions:
- issue: Ton und Aussageabsicht von Agrippas Antwort
  choice: 'Eine vordergründig direkte Aussage: »In kurzer Zeit überzeugst du mich, Christ zu werden.«'
  alternative: Möglich sind auch »Beinahe überzeugst du mich, Christ zu werden« oder die ironische Frage »Du meinst, du könntest mich in so kurzer Zeit zum Christen machen?«
  rationale: Ἐν ὀλίγῳ ist hinsichtlich Zeit oder Grad mehrdeutig, und der griechische Wortlaut kennzeichnet Agrippas Ton nicht eindeutig als aufrichtig, ausweichend oder ironisch. Die Hauptübersetzung bewahrt die Oberflächenstruktur; die Fußnote hält die interpretative Spannung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt bewusst knapp. Die Mehrdeutigkeit der griechischen Wendung wird nicht im Haupttext aufgelöst, sondern durch eine unmittelbar markierte Fußnote dokumentiert.
