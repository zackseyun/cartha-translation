  text: ⸀Ἀνέστη ⸀τε ὁ βασιλεὺς καὶ ὁ ἡγεμὼν ἥ τε Βερνίκη καὶ οἱ συγκαθήμενοι αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: de
  text: Da standen der König, der Statthalter, Berenike und die, die bei ihnen saßen, auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέστη
  choice: stand … auf
  rationale: Der Aorist von ἀνίστημι bezeichnet hier das körperliche Aufstehen vom Sitz; „stand … auf“ ist im Deutschen natürlich und dem feierlichen Rahmen angemessen.
- source_word: τε
  choice: Da / ebenso
  rationale: Die Partikeln verknüpfen das Geschehen mit dem vorherigen Abschnitt und koordinieren die genannten Personen. „Da“ gibt den Erzählfortgang wieder, „ebenso“ macht deutlich, dass auch die folgenden Personen aufstanden.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: βασιλεύς ist hier die Amtsbezeichnung; wie im Griechischen wird Agrippa nicht namentlich genannt.
- source_word: ὁ ἡγεμὼν
  choice: der Statthalter
  rationale: ἡγεμών bezeichnet im Kontext der Apostelgeschichte einen römischen Provinzstatthalter; „Statthalter“ ist im Deutschen historisch und sachlich präzise.
- source_word: Βερνίκη
  choice: Berenike
  rationale: „Berenike“ ist die im modernen Deutschen übliche Wiedergabe des griechischen Eigennamens und benötigt daher keine bloß aus der englischen Form abgeleitete Variante.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: die, die bei ihnen saßen
  rationale: Die Wiedergabe bewahrt das konkrete Bild des gemeinsamen Sitzens, ohne eine gesellschaftliche Rolle wie „Gäste“ hinzuzufügen.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion koordiniert die aufgezählten Personen und Gruppen; die deutsche Satzstruktur gibt die additive Verbindung natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung verdeutlicht, dass nicht nur der König, sondern die gesamte genannte Gruppe aufstand, ohne über den griechischen Text hinauszugehen.
