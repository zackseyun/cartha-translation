id: ACT.26.19
reference: Acts 26:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: de
  text: Darum, König Agrippa, war ich der himmlischen Vision[a] nicht ungehorsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Vision vom Himmel«.'
    reason: Das Adjektiv οὐρανίῳ kann sowohl den himmlischen Charakter als auch die Herkunft der Vision vom Himmel ausdrücken.
lexical_decisions:
- source_word: Ὅθεν
  choice: Darum
  rationale: Das Wort zieht eine Folgerung aus dem vorausgehenden Bericht über die Begegnung und den Auftrag des Paulus. »Darum« stellt diesen Zusammenhang in natürlichem, modernem Deutsch her.
- source_word: βασιλεῦ Ἀγρίππα
  choice: König Agrippa
  rationale: Der Vokativ richtet sich unmittelbar und mit dem gebührenden Titel an Agrippa. Die deutsche Anrede benötigt weder ein zusätzliches »o« noch eine besondere Kennzeichnung.
- source_word: οὐκ ἐγενόμην
  choice: war ich … nicht
  rationale: γίνομαι mit einem prädikativen Adjektiv bezeichnet hier idiomatisch einen Zustand beziehungsweise ein entsprechendes Verhalten. »War ich … nicht« bewahrt die griechische Ausdrucksweise, ohne im Deutschen unnatürlich zu wirken.
- source_word: ἀπειθὴς
  choice: ungehorsam
  rationale: Im Zusammenhang mit dem göttlichen Auftrag geht es um die Weigerung, diesem Auftrag Folge zu leisten. »Ungehorsam« gibt diesen willentlichen Sinn präziser wieder als »nicht überzeugt« und zurückhaltender als »rebellisch«.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: der himmlischen Vision
  rationale: ὀπτασία bezeichnet eine übernatürliche Schau oder Erscheinung. »Vision« ist im heutigen Deutsch verständlich und lässt offen, ob οὐρανίῳ vor allem Herkunft oder Beschaffenheit bezeichnet. Der griechische Dativ nach ἀπειθής entspricht hier dem deutschen Dativ nach »ungehorsam«.
theological_decisions:
- issue: Art des Erlebnisses des Paulus auf dem Weg nach Damaskus
  choice: Vision
  alternative: Erscheinung; Offenbarung vom Himmel
  rationale: ὀπτασία bezeichnet unmittelbar eine Vision beziehungsweise Erscheinung. »Vision« bleibt bei der Kategorie des Textes und legt weder die genaue Wahrnehmungsweise noch eine weiter ausgearbeitete theologische Deutung fest.
- issue: Bedeutung von οὐρανίῳ
  choice: himmlisch
  alternative: vom Himmel
  rationale: Das Adjektiv kann die himmlische Herkunft oder den himmlischen Charakter der Vision bezeichnen. Die Hauptübersetzung bewahrt diese Mehrdeutigkeit; die Fußnote nennt die mögliche Herkunftsangabe ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt die direkte Anrede und den folgernden Anschluss an den vorherigen Bericht. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die lexikalische Alternative bezieht.
