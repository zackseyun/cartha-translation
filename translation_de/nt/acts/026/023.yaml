source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: de
  text: dass der Messias leiden würde[a] und dass er, als Erster von den Toten auferstanden, sowohl dem Volk[b] als auch den Völkern[c] Licht verkünden würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische Wort kann „leidensfähig“ oder „zum Leiden bestimmt“ bedeuten; im Zusammenhang wird es natürlich mit „leiden würde“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: Mit „dem Volk“ ist hier im Gegensatz zu den Völkern wahrscheinlich das jüdische Volk gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den Nichtjuden“. Das griechische Wort bedeutet wörtlich „Völker“, bezeichnet in diesem Gegensatz aber wahrscheinlich die nichtjüdischen Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: leiden würde
  rationale: Das Verbalgefüge gibt das prädikative Adjektiv im prophetischen Zusammenhang natürlich wieder, ohne die mögliche Bedeutung einer Bestimmung zum Leiden unnötig dogmatisch auszuweiten.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός steht hier als Titel des in Mose und den Propheten angekündigten Gesalbten; „Messias“ macht diese titular-prophetische Funktion im Deutschen deutlich.
- source_word: πρῶτος
  choice: als Erster
  rationale: Die ausdrückliche Vorrangstellung bleibt erhalten, ohne näher festzulegen, worin ihre theologische Besonderheit besteht.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: aus der Auferstehung der Toten
  rationale: Die ungewöhnlich komprimierte griechische Wendung wird bewusst relativ formal wiedergegeben, damit die mögliche syntaktische Spannung nicht stillschweigend auf „als Erster von den Toten auferstehen“ verengt wird.
- source_word: φῶς
  choice: Licht
  rationale: Die breite biblische Metapher für Offenbarung, Heil und Hoffnung wird bewahrt.
- source_word: μέλλει καταγγέλλειν
  choice: würde verkünden
  rationale: Im indirekten Bericht bezeichnet μέλλω mit Infinitiv hier eine angekündigte beziehungsweise bestimmte zukünftige Handlung; der deutsche Konjunktiv gibt dies natürlich wieder.
- source_word: τῷ τε λαῷ
  choice: dem Volk
  rationale: Die wörtliche Bezeichnung bleibt stehen; der Gegensatz zu den Völkern legt Israel beziehungsweise das jüdische Volk nahe, ohne dies im Haupttext auszuschreiben.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: „Völker“ bewahrt den Grundsinn von ἔθνη und lässt zugleich die im Kontext naheliegende Bedeutung „Nichtjuden“ erkennen.
- source_word: τε ... καὶ
  choice: sowohl ... als auch
  rationale: Die korrelative Verbindung der beiden Empfängergruppen wird im Deutschen ausdrücklich abgebildet.
theological_decisions:
- issue: Verhältnis von πρῶτος zu ἐξ ἀναστάσεως νεκρῶν und καταγγέλλειν
  choice: „als Erster aus der Auferstehung der Toten Licht verkünden würde“
  alternative: „als Erster von den Toten auferstehen und Licht verkünden würde“
  rationale: Der griechische Wortlaut ist komprimiert und verbindet πρῶτος unmittelbar mit ἐξ ἀναστάσεως νεκρῶν; die gewählte Fassung bewahrt diese Spannung und fügt kein zweites, im Griechischen nicht ausdrücklich vorhandenes Verb hinzu.
- issue: Bedeutung der Vorrangstellung des Messias in der Auferstehung
  choice: Die Aussage der Vorrangstellung wird ohne dogmatische Erläuterung wiedergegeben.
  alternative: „als Erster, der auferstand, um nie mehr zu sterben“ oder „als Erstling der endzeitlichen Auferstehung“
  rationale: Der Vers selbst erläutert nicht, wie sich diese Vorrangstellung zu früheren Wiederbelebungen verhält; eine solche Erklärung gehört nicht in den Haupttext.
- issue: Referent von λαός
  choice: „dem Volk“
  alternative: „dem jüdischen Volk“ oder „Israel“
  rationale: Der Kontrast mit ἔθνη weist wahrscheinlich auf das jüdische Volk, doch der griechische Text nennt es nicht ausdrücklich; daher bleibt der Haupttext offen und die Fußnote erläutert den wahrscheinlichen Bezug.
- issue: Wiedergabe von ἔθνη
  choice: „den Völkern“
  alternative: „den Nichtjuden“
  rationale: Beide Bedeutungen sind kontextuell möglich; „Völker“ bewahrt die lexikalische Bildbreite, während die Fußnote den hier wahrscheinlichen jüdisch-nichtjüdischen Gegensatz erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst etwas ungewohnte Formulierung „aus der Auferstehung der Toten“ spiegelt die komprimierte und syntaktisch spannungsreiche Ausdrucksweise des griechischen Textes. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
