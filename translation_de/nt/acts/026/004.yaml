  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: de
  text: Mein Leben von Jugend an, das ich von Anfang an in meinem Volk und auch in Jerusalem geführt habe, kennen also alle Juden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meinen Lebenswandel … kennen also alle Juden.“ Das griechische Wort meint die Art der Lebensführung, nicht nur das bloße Dasein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: Leben … geführt habe
  rationale: βίωσις bezeichnet hier den Lebenswandel beziehungsweise Lebenslauf, nicht bloß die Existenz. Die deutsche Verbindung „ein Leben führen“ gibt dies natürlich wieder.
- source_word: ἐκ νεότητος
  choice: von Jugend an
  rationale: Die idiomatische deutsche Wendung bewahrt den zeitlichen Ausgangspunkt.
- source_word: ἀπ’ ἀρχῆς
  choice: von Anfang an
  rationale: Die Formulierung erhält die ausdrückliche zeitliche Verstärkung des griechischen Textes.
- source_word: γενομένην
  choice: geführt habe
  rationale: Das Partizip bezieht sich auf βίωσις und beschreibt den in einem bestimmten Umfeld verbrachten Lebenslauf; im Deutschen ist „ein Leben führen“ natürlicher als eine formale Wiedergabe mit „geschehen“.
- source_word: ἐν τῷ ἔθνει μου
  choice: in meinem Volk
  rationale: ἔθνος bezeichnet hier die eigene ethnische Gemeinschaft des Paulus, nicht einen modernen Nationalstaat.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: und auch in Jerusalem
  rationale: „Auch“ macht die koordinierende beziehungsweise additive Kraft von τε im Deutschen deutlich.
- source_word: ἴσασι
  choice: kennen
  rationale: οἶδα hat hier präsentische Bedeutung. „Kennen“ passt idiomatisch zum vorangestellten Lebenslauf als Gegenstand persönlicher Kenntnis.
- source_word: πάντες Ἰουδαῖοι
  choice: alle Juden
  rationale: Die direkte Wiedergabe bewahrt die umfassende Formulierung des griechischen Textes, ohne sie einzuschränken.
- source_word: μὲν οὖν
  choice: also
  rationale: „Also“ kennzeichnet knapp den Übergang und die Fortführung innerhalb der Verteidigungsrede.
