id: ACT.26.20
reference: Acts 26:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: de
  text: Doch zuerst verkündete ich den Menschen in Damaskus, dann auch in Jerusalem und im ganzen Gebiet Judäas und ebenso den Nichtjuden[a], sie sollten umkehren, sich Gott zuwenden und Taten vollbringen, die der Umkehr entsprechen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Völkern«. Gemeint sind hier die nichtjüdischen Völker beziehungsweise Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Werke tun, die der Umkehr würdig sind«; gemeint sind Taten, die zu dieser Umkehr passen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zur vorausgehenden Aussage und klingt im modernen Deutschen natürlich.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: den Menschen in Damaskus
  rationale: Der substantivierte Dativ bezeichnet die dort befindlichen Menschen und hängt als indirektes Objekt von ἀπήγγελλον ab.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: zuerst ... dann auch in Jerusalem
  rationale: Gibt die Abfolge und Hinzufügung idiomatisch wieder, ohne Jerusalem ebenfalls künstlich unter »zuerst« zu fassen.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: im ganzen Gebiet Judäas
  rationale: χώρα bezeichnet hier allgemein das Gebiet beziehungsweise die Region, ohne notwendig nur das ländliche Umland zu meinen.
- source_word: τοῖς ἔθνεσιν
  choice: den Nichtjuden
  rationale: Im Zusammenhang mit Jerusalem und Judäa bezeichnet ἔθνη die nichtjüdischen Völker beziehungsweise Menschen; »Nichtjuden« ist für heutige Leser unmittelbar verständlich.
- source_word: ἀπήγγελλον
  choice: verkündete ich
  rationale: Im missionarischen Kontext bezeichnet das Verb eine öffentliche Bekanntmachung; das deutsche Präteritum fügt sich natürlich in Paulus’ Bericht ein.
- source_word: μετανοεῖν
  choice: umkehren
  rationale: Bezeichnet hier eine grundlegende innere und praktische Neuausrichtung vor Gott, nicht nur eine Änderung der Meinung.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: sich Gott zuwenden
  rationale: Gibt die gerichtete Hinwendung zu Gott wieder. »Zu Gott zurückkehren« könnte bei den Nichtjuden unzutreffend eine frühere Zugehörigkeit voraussetzen.
- source_word: ἄξια τῆς μετανοίας ἔργα πράσσοντας
  choice: Taten vollbringen, die der Umkehr entsprechen
  rationale: Bewahrt den Zusammenhang zwischen Umkehr und entsprechendem Handeln in natürlichem Deutsch, ohne die Taten ausdrücklich als Verdienstgrund zu deuten.
theological_decisions:
- issue: Verhältnis von Umkehr, Hinwendung zu Gott und Taten
  choice: Die Taten werden als der Umkehr entsprechendes Handeln formuliert.
  alternative: »Werke tun, die der Umkehr würdig sind« oder die Taten als Inhalt beziehungsweise Verdienstgrund der Umkehr verstehen.
  rationale: Das Partizip πράσσοντας beschreibt das Handeln, das mit der geforderten Umkehr und Hinwendung einhergeht. Die Übersetzung wahrt diesen Zusammenhang, ohne eine über den Wortlaut hinausgehende Heilsordnung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Umkehren« und »sich Gott zuwenden« halten die beiden griechischen Verben unterscheidbar; »Nichtjuden« ist verständlicher als das heute weniger geläufige »Heiden«.
