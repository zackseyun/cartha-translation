  naturalness: Der Text ist flüssiges modernes Standarddeutsch mit würdigem Register. „Über die Maßen wütend“ ist idiomatisch, wenn auch leicht gehoben. Die Umformulierung bei βλασφημεῖν erhöht Präzision und Klarheit.
