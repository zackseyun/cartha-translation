  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: de
  text: Und in allen Synagogen bestrafte ich sie immer wieder und versuchte, sie dazu zu zwingen, zu lästern. Über die Maßen wütend auf sie verfolgte ich sie sogar bis in die auswärtigen Städte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »bis in die außerhalb gelegenen Städte«; wahrscheinlich sind Städte außerhalb Judäas gemeint.'
    reason: Die Fußnote bewahrt die wörtlichere räumliche Bedeutung von ἔξω und weist zugleich auf den wahrscheinlichen Bezug hin, ohne ihn im Haupttext festzuschreiben.
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: in allen Synagogen
  rationale: κατά mit Akkusativ ist hier distributiv-lokal und bezeichnet das wiederholte Vorgehen in den verschiedenen Synagogen.
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: bestrafte ich sie immer wieder
  rationale: Die Formulierung gibt sowohl den wiederholten Charakter von πολλάκις als auch die begleitende Handlung des Partizips τιμωρῶν in natürlichem Deutsch wieder.
- source_word: ἠνάγκαζον
  choice: versuchte, sie … zu zwingen
  rationale: Der Imperfekt beschreibt fortgesetztes beziehungsweise wiederholtes Zwingen; die Formulierung lässt offen, ob die Versuche jeweils zum Erfolg führten.
- source_word: βλασφημεῖν
  choice: zum Lästern
  rationale: Das Objekt der Lästerung bleibt im Griechischen ungenannt. Die Wiedergabe bewahrt diese Offenheit und vermeidet eine ausdrückliche Ergänzung wie „Jesus“ oder „Gott“.
- source_word: περισσῶς ἐμμαινόμενος αὐτοῖς
  choice: über die Maßen wütend auf sie
  rationale: Die Wendung bringt sowohl die starke Steigerung durch περισσῶς als auch die rasende Feindseligkeit von ἐμμαινόμενος verständlich zum Ausdruck, ohne moderne Assoziationen psychischer Krankheit zu wecken.
- source_word: ἐδίωκον
  choice: verfolgte ich sie
  rationale: Im Zusammenhang bezeichnet διώκω die feindliche Verfolgung der Gläubigen; der fortdauernde Charakter wird durch den Satzkontext getragen.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: sogar bis in die auswärtigen Städte
  rationale: „Auswärtig“ bewahrt den räumlichen Grundsinn „außerhalb gelegen“, ohne im Haupttext genauer festzulegen, welche Grenze gemeint ist.
theological_decisions:
- issue: Bezug von βλασφημεῖν
  choice: 'Das Objekt bleibt ungenannt: „zum Lästern“.'
  alternative: „Jesus zu lästern“ oder „Gott zu lästern“
  rationale: Der Kontext legt eine Lästerung gegen Jesus beziehungsweise das christliche Bekenntnis nahe, doch der griechische Text nennt kein Objekt. Diese Spannung wird nicht aufgelöst.
- issue: Bezugspunkt der „auswärtigen Städte“
  choice: Im Haupttext wird keine bestimmte politische oder geografische Grenze ergänzt.
  alternative: „Städte außerhalb Judäas“ oder „Städte im Ausland“
  rationale: ἔξω bezeichnet Städte außerhalb eines vorausgesetzten Bereichs, benennt diesen Bereich aber nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Über die Maßen“ erhält die starke Intensivierung des griechischen Ausdrucks; „zum Lästern“ lässt dessen ungenanntes Objekt bewusst offen. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
