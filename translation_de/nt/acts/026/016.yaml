  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: de
  text: 'Doch steh auf und stell dich auf deine Füße! Denn dazu bin ich dir erschienen: um dich zu einem Diener und Zeugen sowohl dessen zu bestimmen, was du von mir gesehen hast, als auch dessen, worin ich dir noch erscheinen werde.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Konstruktion ist stark verkürzt. Der erste Teil lässt sich auch näher am Wortlaut als „dessen, was du mich gesehen hast“ wiedergeben; gemeint kann sein: „dessen, was du von mir gesehen hast“.'
    reason: Die Fußnote erläutert die schwer nachbildbare Relativkonstruktion und bewahrt die Auslegungs- bzw. Übersetzungsmehrdeutigkeit, ohne eine ungrammatische deutsche Pseudowörtlichkeit als eigentlichen Text auszugeben.
lexical_decisions:
- source_word: ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου
  choice: steh auf und stell dich auf deine Füße
  rationale: Die beiden Imperative und das anschauliche körperliche Bild werden bewahrt. „Stell dich auf deine Füße“ klingt im Deutschen würdevoll und verständlich, ohne die Wendung zu verflachen.
- source_word: εἰς τοῦτο γὰρ ὤφθην σοι
  choice: Denn dazu bin ich dir erschienen
  rationale: „Dazu“ gibt den Zweck prägnant wieder; ὤφθην wird als geläufige Erscheinungsformel aktivisch-intransitiv übersetzt und nicht auf ein bloß inneres Wahrnehmen reduziert.
- source_word: προχειρίσασθαί σε
  choice: Ich will dich … bestimmen
  rationale: Der Infinitiv bezeichnet den Zweck der Erscheinung und eine verbindliche Beauftragung. Die finite Zweckentfaltung ist im Deutschen natürlich und bewahrt den Sinn von Auswahl und Einsetzung.
- source_word: ὑπηρέτην
  choice: Diener
  rationale: „Diener“ bezeichnet hier einen beauftragten, untergeordneten Mitarbeiter, ohne den stärker auf Unfreiheit bezogenen Sinn von δοῦλος oder einen modernen kirchenamtlichen Titel einzutragen.
- source_word: μάρτυρα
  choice: Zeugen
  rationale: „Zeuge“ ist die sachlich und kontextuell genaue Bezeichnung für jemanden, der aufgrund des Gesehenen und Offenbarten Zeugnis ablegt.
- source_word: ὧν τε εἶδές με ὧν τε ὀφθήσομαί σοι
  choice: sowohl dessen, worin du mich gesehen hast, als auch dessen, worin ich dir noch erscheinen werde
  rationale: Die parallele, komprimierte Relativkonstruktion und der Wechsel zwischen „sehen“ und „erscheinen“ bleiben erkennbar. „Noch“ macht den Zukunftsbezug idiomatisch deutlich, ohne zusätzliche Offenbarungsinhalte festzulegen.
theological_decisions:
- issue: Charakter der Offenbarungssprache in ὤφθην und ὀφθήσομαί
  choice: 'Beide Formen werden mit persönlichem Erscheinungsvokabular wiedergegeben: „bin … erschienen“ und „erscheinen werde“.'
  alternative: „wurde von dir gesehen / werde von dir gesehen werden“ oder „habe mich offenbart / werde mich offenbaren“
  rationale: So bleibt die persönliche, objektiv formulierte Begegnung mit dem auferstandenen Jesus erhalten, ohne die Art der Erscheinung näher zu bestimmen.
- issue: Bezug der beiden Relativsätze auf Paulus’ Zeugendienst
  choice: Die parallelen Glieder beziehen sowohl die bisherige als auch die künftige Erscheinung auf seinen Auftrag als Zeuge.
  alternative: Den ersten Teil als allgemeines Wissen „über mich“ und den zweiten als künftig von Jesus gezeigte Inhalte zu paraphrasieren.
  rationale: Die Übersetzung wahrt Parallelismus und Spannung des griechischen Wortlauts, statt Inhalt oder Modus der Offenbarungen dogmatisch auszuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelbefehl bleibt nachdrücklich und bildhaft. Der Doppelpunkt und der Gedankenstrich gliedern den langen Auftragssatz, ohne seinen argumentativen Zusammenhang aufzulösen. Der Fußnotenmarker [a] steht unmittelbar nach der betroffenen Gesamtkonstruktion.
