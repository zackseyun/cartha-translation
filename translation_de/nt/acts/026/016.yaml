  naturalness: „Stell dich auf deine Füße“ ist verständlich und im würdevollen Register möglich. Der anschließende Auftrag sollte jedoch ohne die doppelte Bezeichnung „Zeuge“ formuliert werden. „Was du von mir gesehen hast“ ist modernes, natürliches Deutsch; die Fußnote kann die ungewöhnlich verdichtete griechische Konstruktion transparent machen.
  terminology: „Diener“ und „Zeuge“ geben ὑπηρέτης und μάρτυς angemessen wieder. „Erschienen“ / „erscheinen werde“ bewahrt die Erscheinungssprache. Die Formulierung „von mir gesehen hast“ legt eine plausible Auflösung der ersten komprimierten Konstruktion vor, ohne Aussagen über die Art der Offenbarung hinzuzufügen.
