  source_fidelity: 'Die Reise nach Damaskus sowie die beiden offiziellen Befugnisse sind zutreffend wiedergegeben. »Führende Priester« ist jedoch für ἀρχιερεῖς zu ungenau: Der etablierte, quellennahe Ausdruck »Hohenpriester« bezeichnet hier im Plural die hohepriesterliche Führungsschicht, nicht mehrere gleichzeitig amtierende Inhaber eines einzelnen Amtes.'
