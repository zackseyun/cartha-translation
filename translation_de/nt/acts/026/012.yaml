  terminology: »Vollmacht« und »im Auftrag« geben ἐξουσία und ἐπιτροπή idiomatisch und mit dem nötigen offiziellen Charakter wieder. »Hohenpriester« wahrt die in diesem historischen Kontext übliche und präzise Terminologie.
