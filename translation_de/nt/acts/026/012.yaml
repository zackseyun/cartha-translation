  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: de
  text: Bei diesen Unternehmungen[a] war ich mit Vollmacht und im Auftrag der Hohenpriester nach Damaskus unterwegs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »In welchen Dingen«; die Wendung verweist auf die zuvor beschriebenen Handlungen und Absichten des Paulus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: in diesem Zusammenhang
  rationale: Die Wendung verweist auf die zuvor beschriebenen Handlungen und Absichten des Paulus. Die deutsche Formulierung wahrt diesen Rückbezug, ohne das wörtliche und hier schwerfällige »in welchen Dingen« zu verwenden.
- source_word: πορευόμενος
  choice: als ich … unterwegs war
  rationale: Das Präsenspartizip bezeichnet eine gleichzeitig verlaufende Handlung. Die gewählte Nebensatzkonstruktion ist im modernen Deutschen natürlich und passt zur Reise nach Damaskus.
- source_word: εἰς τὴν Δαμασκὸν
  choice: nach Damaskus
  rationale: Bei Städtenamen wird die Bewegungsrichtung im Deutschen idiomatisch mit »nach« ausgedrückt.
- source_word: μετ’ ἐξουσίας
  choice: mit Vollmacht
  rationale: ἐξουσία bezeichnet hier verliehene amtliche Befugnis, nicht bloße Kraft oder Macht. »Vollmacht« bringt die rechtmäßige Beauftragung prägnant zum Ausdruck.
- source_word: ἐπιτροπῆς
  choice: im Auftrag
  rationale: Das Substantiv bezeichnet eine übertragene Aufgabe beziehungsweise offizielle Beauftragung. »Im Auftrag« ist natürliches Deutsch und ergänzt »mit Vollmacht« ohne militärische Nebenbedeutung.
- source_word: τῆς τῶν ἀρχιερέων
  choice: der führenden Priester
  rationale: Der Genitiv bezeichnet die Quelle der Vollmacht und des Auftrags. Im Deutschen lässt sich dies in der festen Wendung »im Auftrag der …« natürlich wiedergeben.
- source_word: ἀρχιερέων
  choice: führende Priester
  rationale: Der Plural bezeichnet die hohepriesterliche Führungsschicht und nicht mehrere gleichzeitig amtierende Hohepriester. »Führende Priester« ist verständlich und vermeidet dieses mögliche Missverständnis.
