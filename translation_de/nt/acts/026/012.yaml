    rationale: ἐν οἷς verweist auf die unmittelbar zuvor genannten Verfolgungsaktivitäten. »Bei diesen Unternehmungen« stellt diesen Rückbezug im modernen Deutsch klarer her, ohne mehr als der griechische Text festzulegen.
