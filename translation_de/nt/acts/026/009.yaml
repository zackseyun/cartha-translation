id: ACT.26.9
reference: Acts 26:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: de
  text: Ich selbst war nun der Meinung, ich müsse vieles gegen den Namen Jesu, des Nazareners, unternehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vieles gegen den Namen Jesu von Nazaret tun.“'
    reason: Lexikalische Alternative für Ναζωραῖος sowie formalere Wiedergabe von πολλὰ ἐναντία πρᾶξαι.
lexical_decisions:
- source_word: Ἐγὼ
  choice: Ich selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist emphatisch; „Ich selbst“ bewahrt die persönliche Betonung in der rückblickenden Aussage des Paulus.
- source_word: μὲν οὖν
  choice: nun
  rationale: Die Partikelverbindung führt den Gedankengang weiter und gibt ihm leichtes Gewicht. „Nun“ ist im Deutschen natürlich; die zusätzliche Nuance von μέν muss nicht künstlich durch eine zweite Partikel wiedergegeben werden.
- source_word: ἔδοξα ἐμαυτῷ
  choice: war der Meinung
  rationale: Die Wendung bezeichnet die eigene damalige Einschätzung. „War der Meinung“ gibt den inneren Urteilsvorgang idiomatisch wieder, ohne den Reflexivbezug doppelt auszudrücken.
- source_word: πρὸς τὸ ὄνομα
  choice: gegen den Namen
  rationale: In Verbindung mit ἐναντία und πρᾶξαι hat πρός eine gegnerische Bedeutung. „Gegen den Namen“ bewahrt zugleich die biblische Redeweise, in der der Name für die Person, ihr Ansehen und ihre Autorität stehen kann.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Jesu, des Nazareners
  rationale: „Des Nazareners“ bewahrt den bezeichnungsartigen Charakter von Ναζωραῖος; der Genitiv „Jesu“ ist in diesem würdigen, aber modernen Register gut verständlich.
- source_word: δεῖν
  choice: ich müsse
  rationale: Der Konjunktiv in der indirekten Rede gibt die von Paulus damals empfundene Notwendigkeit wieder, ohne sie als objektiv gültige Pflicht zu bestätigen.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: vieles … unternehmen
  rationale: „Vieles unternehmen“ bezeichnet zahlreiche gegnerische Handlungen natürlich und prägnant. Die Stellung von „gegen den Namen“ macht die feindliche Ausrichtung ausdrücklich.
theological_decisions:
- issue: Bedeutung von „der Name“ in Bezug auf Jesus
  choice: Die biblische Wendung „der Name“ bleibt erhalten.
  alternative: „die Autorität Jesu“ oder „die Sache Jesu“
  rationale: Der griechische Text legt die Bedeutung nicht auf einen einzelnen Aspekt fest. „Der Name“ kann die Person Jesu, sein öffentliches Bekenntnis, sein Ansehen und seine Autorität umfassen.
- issue: Status der von Paulus empfundenen Verpflichtung
  choice: „ich müsse“ wird als Bestandteil seiner damaligen Meinung formuliert.
  alternative: „ich musste“ oder „ich sollte“
  rationale: δεῖν bezeichnet hier die von Paulus subjektiv angenommene Notwendigkeit. Die indirekte Rede verhindert, dass diese Einschätzung als göttlich bestätigte Verpflichtung erscheint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt eng am griechischen Gedankengang, während „war der Meinung“ und „vieles unternehmen“ natürliches heutiges Deutsch bieten.
