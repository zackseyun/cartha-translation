source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: de
  text: 'Als wir alle zu Boden gefallen waren, hörte ich eine Stimme, die auf Hebräisch[a] zu mir sagte: »Saul, Saul, warum verfolgst du mich? Es ist schwer für dich, gegen die Treibstacheln auszuschlagen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist Aramäisch gemeint; der griechische Ausdruck lautet wörtlich »in der hebräischen Sprache/Mundart«.
    reason: alternative_reading
  - marker: b
    text: 'Eine sprichwörtliche Redensart: Wer gegen die Treibstacheln ausschlägt, verletzt sich selbst.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Als wir alle zu Boden gefallen waren
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben. »Wir alle« bewahrt πάντων … ἡμῶν; das Plusquamperfekt stellt den Fall als vor dem Hören abgeschlossen dar.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: hörte ich eine Stimme … zu mir sagen
  rationale: φωνή bezeichnet wegen der folgenden direkten Rede eine Stimme, nicht nur ein Geräusch. Die Partizipialkonstruktion wird im Deutschen idiomatisch mit »eine Stimme … sagen hören« wiedergegeben.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: auf Hebräisch
  rationale: Dies gibt die griechische Bezeichnung knapp und natürlich wieder, ohne die mögliche historische Einordnung als Aramäisch in den Haupttext einzutragen.
- source_word: Σαοὺλ Σαούλ
  choice: Saul, Saul
  rationale: Der Name und seine eindringliche Wiederholung werden unverändert bewahrt.
- source_word: τί με διώκεις;
  choice: warum verfolgst du mich?
  rationale: Das Präsens und der Sinn feindseliger Verfolgung werden direkt und natürlich wiedergegeben.
- source_word: σκληρόν σοι
  choice: Es ist hart für dich
  rationale: Die unpersönliche Wendung bleibt nah am Wortlaut und wahrt sowohl die Schwierigkeit als auch die schmerzliche Folge des Widerstands.
- source_word: πρὸς κέντρα λακτίζειν
  choice: gegen die Treibstacheln auszuschlagen
  rationale: κέντρα bezeichnet spitze Geräte zum Antreiben von Zugtieren. »Treibstacheln« macht das Bild verständlich; »ausschlagen« ist im Deutschen für das Treten eines Tieres idiomatisch und bewahrt die sprichwörtliche Bildrede.
theological_decisions:
- issue: Bedeutung von τῇ Ἑβραΐδι διαλέκτῳ
  choice: auf Hebräisch
  alternative: auf Aramäisch
  rationale: Der Haupttext folgt der ausdrücklichen griechischen Bezeichnung. Da sie im damaligen jüdischen Sprachgebrauch möglicherweise Aramäisch einschließen oder bezeichnen konnte, wird diese Deutung als Fußnote bewahrt, statt die sprachliche Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Satzführung. Die direkte Rede bleibt eindringlich und bildhaft; die historisch-sprachliche Mehrdeutigkeit wird nicht im Haupttext aufgelöst.
