  naturalness: Der Satzbau »hörte ich eine Stimme auf Hebräisch zu mir sagen« ist verständlich, aber unnötig gedrängt. Mit einem Relativsatz ist die deutsche Satzführung klarer. »Es ist schwer für dich« ist im heutigen Standarddeutsch die idiomatischere Wiedergabe der unpersönlichen Wendung σκληρόν σοι als »Es ist hart für dich«.
