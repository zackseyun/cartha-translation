    issue: Die Zukunftsform und die Koordination in „und ich werde dich ... retten ... , zu denen ich dich sende“ bilden die griechische Partizipialkonstruktion nicht angemessen ab.
    rationale: ἐξαιρούμενός ist ein präsentisches Partizip und steht zur Aussage „ich sende dich“ in Beziehung. Eine adverbiale deutsche Wiedergabe bewahrt diese Struktur und vermeidet eine nicht ausdrücklich markierte Zukunftsverheißung.
  - severity: low
    issue: „anderen Völkern“ ist als Wiedergabe von τῶν ἐθνῶν weniger präzise.
    rationale: Im vorliegenden Kontrast bezeichnet ἔθνη nicht einfach beliebige „andere“ Völker, sondern die nichtjüdischen Völker. Die vorgeschlagene Formulierung macht dies transparent.
