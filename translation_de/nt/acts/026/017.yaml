  source_fidelity: Die Übersetzung trifft den Schutz-/Rettungssinn von ἐξαιρούμενος und den Gegensatz zwischen dem Volk und den ἔθνη grundsätzlich. Doch die finite Zukunftsform „ich werde ... retten“ macht aus dem präsentischen Partizip eine eigenständige Zukunftsaussage und verwischt seine syntaktische Zuordnung zur Sendung.
  naturalness: „Indem ich dich ... rette“ gibt die partizipiale Konstruktion in modernem, würdigem Deutsch natürlich wieder. „Nichtjüdische Völker“ erläutert den hier kontextuell erforderlichen Sinn von ἔθνη verständlich, ohne auf das stärker kirchensprachliche „Heiden“ zurückzugreifen.
  terminology: „Volk“ bleibt als knappe Wiedergabe von τοῦ λαοῦ erhalten; eine Fußnote erläutert den im Kontrast zu den nichtjüdischen Völkern naheliegenden Bezug. „Nichtjüdische Völker“ gibt ἔθνη in diesem jüdisch-nichtjüdischen Gegensatz angemessener wieder als „andere Völker“, dessen Zusatz „andere“ nicht im griechischen Wortlaut steht.
  issues:
