lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: ich werde dich … retten
  rationale: Das präsentische Partizip bezeichnet Jesu rettendes Eingreifen zugunsten von Paulus. Im Deutschen gibt der finite, futurisch verstandene Ausdruck im Zusammenhang der Beauftragung den Sinn natürlich wieder; „retten“ bewahrt den Gedanken der Befreiung aus Gefahr.
- source_word: τοῦ λαοῦ
  choice: dem Volk
  rationale: Der bestimmte Singular bezeichnet im Kontrast zu den ἔθνη das jüdische Volk beziehungsweise Israel. „dem Volk“ bleibt nahe am griechischen Wortlaut und bewahrt dessen Binnenperspektive.
- source_word: τῶν ἐθνῶν
  choice: den anderen Völkern
  rationale: Im jüdischen Kontext bezeichnet ἔθνη hier die nichtjüdischen Völker. „die anderen Völker“ macht diesen Gegensatz in modernem Deutsch verständlich, ohne den Begriff auf politische Nationen zu verengen.
- source_word: εἰς οὓς
  choice: zu denen
  rationale: Nach einem Verb des Sendens bezeichnet εἰς mit dem Relativpronomen das Ziel der Sendung; „zu denen“ ist die natürliche deutsche Entsprechung.
- source_word: ἀποστέλλω
  choice: ich dich sende
  rationale: Das Präsens bezeichnet die nun erteilte Sendung. Das deutsche Präsens ist natürlich und bewahrt die Zeitform.
theological_decisions:
- issue: Referent von „dem Volk“ im Gegensatz zu den ἔθνη
  choice: „dem Volk“ bleibt im Haupttext stehen und ist kontextuell als das jüdische Volk zu verstehen.
  alternative: „dem jüdischen Volk“ oder „Israel“
  rationale: Der Gegensatz macht den Bezug auf das jüdische Volk deutlich, doch der griechische Text sagt nur „das Volk“. Die knappere Wiedergabe vermeidet eine unnötige Ausdeutung.
- issue: Bedeutung von ἐξαιρούμενος im Verhältnis zu Paulus’ Sendung
  choice: als Verheißung rettenden Eingreifens wiedergegeben
  alternative: „indem ich dich herausnehme“
  rationale: Das Verb kann ein Herausnehmen bezeichnen, meint in diesem Kontext aber Schutz und Rettung aus der Gewalt feindlicher Gruppen. Die Übersetzung lässt zugleich bestehen, dass Paulus zu eben den Menschen gesandt wird, vor denen Jesus ihn rettet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist als syntaktische Fortsetzung des vorhergehenden Satzes mit „und“ formuliert. „Andere Völker“ ist allgemein verständlicher als das kirchensprachlich geprägte „Heiden“.
