translation:
  language: de
  text: indem ich dich vor dem Volk[a] und vor den nichtjüdischen Völkern rette, zu denen ich dich sende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist im Gegensatz zu den nichtjüdischen Völkern das jüdische Volk.
