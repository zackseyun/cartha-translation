id: ACT.26.26
reference: Acts 26:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: de
  text: Denn der König weiß über diese Dinge Bescheid, und zu ihm spreche ich auch ganz offen[a]. Ich bin nämlich überzeugt, dass ihm nichts davon entgangen ist[b]; denn dies ist nicht in einem Winkel geschehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und zu ihm rede ich auch freimütig“. Das griechische Wort bezeichnet offenes, freies und zuversichtliches Reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass nichts davon vor ihm verborgen geblieben ist“ beziehungsweise „dass er nichts davon übersehen hat“.'
    reason: lexical_alternative
  - marker: c
    text: '„In einem Winkel“ ist eine bildhafte Wendung: Das Geschehen fand nicht heimlich oder abseits der Öffentlichkeit statt.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται ... περὶ τούτων
  choice: weiß über diese Dinge Bescheid
  rationale: Die Wendung bezeichnet Kenntnis beziehungsweise Vertrautheit mit dem Sachverhalt. „Weiß ... Bescheid“ ist im modernen Deutschen natürlich und bringt mehr als bloßes punktuelles Wissen zum Ausdruck.
- source_word: πρὸς ὃν καὶ παρρησιαζόμενος λαλῶ
  choice: und zu ihm spreche ich auch ganz offen
  rationale: πρός bezeichnet den Angeredeten; παρρησιαζόμενος meint freimütiges, offenes und zuversichtliches Reden. „Ganz offen“ bewahrt hier den Gedanken freier, unverhüllter Rede, ohne vorrangig Wagemut zu betonen.
- source_word: λανθάνειν ... αὐτὸν τούτων οὐ ... οὐθέν
  choice: dass ihm nichts davon entgangen ist
  rationale: Die griechische Konstruktion besagt idiomatisch, dass nichts unbemerkt geblieben ist. Die deutsche Formulierung gibt die verschachtelte Verneinung klar und natürlich wieder.
- source_word: οὐ πείθομαι
  choice: Ich bin ... überzeugt
  rationale: Das Verb im Passiv beziehungsweise Medium bezeichnet hier eine gefestigte Überzeugung. Wegen der weiteren Verneinung ergibt sich im Deutschen natürlich die positive Aussage, dass Paulus überzeugt ist, nichts sei dem König entgangen.
- source_word: ἐν γωνίᾳ
  choice: in einem Winkel
  rationale: Die bildhafte Ortsangabe wird formal bewahrt; im Zusammenhang bedeutet sie, dass das Geschehen nicht verborgen oder abseits der Öffentlichkeit stattfand.
- source_word: πεπραγμένον τοῦτο
  choice: dies ist ... geschehen
  rationale: Das Perfektpartizip bezeichnet ein vollzogenes Geschehen mit gegenwärtiger Relevanz. „Ist geschehen“ ist im Deutschen natürlicher als „ist getan worden“ und lässt den Bezug von τοῦτο bewusst offen.
theological_decisions:
- issue: Bezugsumfang von τοῦτο („dies“) und Öffentlichkeit des Geschehens
  choice: „dies“ bleibt ohne nähere Bestimmung und bezeichnet ein öffentlich bekanntes Geschehen.
  alternative: Den Bezug ausdrücklich auf Tod und Auferstehung Jesu oder auf die gesamte christliche Bewegung und den Prozess des Paulus festlegen.
  rationale: Der unmittelbare Wortlaut bestimmt den Umfang des Demonstrativpronomens nicht genau. Die offene Wiedergabe bewahrt diese Mehrdeutigkeit und vermeidet eine dogmatische Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge folgt der griechischen Begründungsstruktur, wird jedoch für flüssiges Deutsch leicht gegliedert. Das Bild vom „Winkel“ und die unbestimmte Reichweite von „dies“ bleiben erhalten; Fußnoten erläutern Idiom und lexikalische Alternativen.
