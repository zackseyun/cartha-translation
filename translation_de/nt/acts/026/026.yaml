  source_fidelity: 'Die Übersetzung gibt die griechische Argumentationsfolge und die wesentlichen Aussagen präzise wieder: Der König ist über die betreffenden Dinge informiert, Paulus redet ihn freimütig an, nichts davon ist ihm entgangen, und das betreffende Geschehen geschah nicht verborgen. „Dies“ wahrt den im Ausgangstext offenen Bezug von τοῦτο.'
