id: ACT.26.25
reference: Acts 26:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: de
  text: 'Paulus aber sagte: »Ich bin nicht von Sinnen[a], hochverehrter Festus[b], sondern ich spreche Worte der Wahrheit und der Besonnenheit[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich bin nicht wahnsinnig.«'
    reason: lexical_alternative
  - marker: b
    text: »Hochverehrter« ist eine förmliche ehrende Anrede für einen hohen Amtsträger.
    reason: cultural_note
  - marker: c
    text: 'Oder: »Worte der Wahrheit und der geistigen Klarheit«; das griechische Wort kann Besonnenheit, Selbstbeherrschung und einen gesunden Geisteszustand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Gegensatz zu Festus’ Vorwurf im vorhergehenden Vers und steht im Deutschen natürlich nach dem Subjekt.
- source_word: μαίνομαι
  choice: bin nicht von Sinnen
  rationale: Gibt den Vorwurf des Wahnsinns idiomatisch und in würdigem modernem Deutsch wieder.
- source_word: φησίν
  choice: sagte
  rationale: Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend als Präteritum wiedergegeben.
- source_word: κράτιστε
  choice: hochverehrter
  rationale: Gibt die förmliche ehrende Anrede an einen hohen Amtsträger natürlich wieder, ohne daraus einen festen deutschen Amtstitel zu machen.
- source_word: ἀληθείας
  choice: der Wahrheit
  rationale: Bewahrt die griechische Genitivverbindung und bezeichnet den Wahrheitscharakter von Paulus’ Worten.
- source_word: σωφροσύνης
  choice: der Besonnenheit
  rationale: Erfasst vernünftige Selbstbeherrschung, Nüchternheit und geistige Klarheit und bildet zugleich den Gegenpol zum Vorwurf des Wahnsinns.
- source_word: ῥήματα
  choice: Worte
  rationale: Entspricht dem konkreten Plural und bewahrt die Formulierung »Worte der …«.
- source_word: ἀποφθέγγομαι
  choice: ich spreche
  rationale: Gibt das vernehmliche, bestimmte Reden wieder, ohne die rhetorische Stärke durch »verkünden« unnötig zu steigern.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die leicht gehobene Wendung »Worte der Wahrheit und der Besonnenheit« bewahrt die parallele Genitivkonstruktion und den formellen Charakter von Paulus’ Antwort.
