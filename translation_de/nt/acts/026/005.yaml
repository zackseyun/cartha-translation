id: ACT.26.5
reference: Acts 26:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: de
  text: Sie kennen mich von Anfang an[a]; falls sie bereit sind, können sie bezeugen, dass ich als Pharisäer nach der strengsten Richtung[b] unserer Religion gelebt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von früher her« oder »seit Langem«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Wort bezeichnet hier eine religiöse Richtung oder Gruppe; auch: »Sekte«. Es bedeutet hier nicht »Häresie« im späteren kirchlichen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές με
  choice: Sie kennen mich
  rationale: Das Partizip bezeichnet hier eine bereits früher bestehende und weiterhin relevante persönliche Kenntnis. Das natürliche deutsche Perfekt „haben mich gekannt“ könnte dagegen nahelegen, diese Kenntnis sei beendet.
- source_word: ἄνωθεν
  choice: von Anfang an
  rationale: Im Zusammenhang meint ἄνωθεν die Kenntnis aus früherer Zeit beziehungsweise vom Beginn an, nicht räumlich „von oben“. Die verbleibende zeitliche Bedeutungsbreite wird in Fußnote [a] bewahrt.
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: wenn sie bereit sind, es zu bezeugen
  rationale: θέλωσι hebt die Bereitschaft hervor; μαρτυρεῖν ist im Gerichts- und Anhörungskontext sachgerecht mit „bezeugen“ wiedergegeben.
- source_word: ἀκριβεστάτην
  choice: strengsten
  rationale: Der Superlativ beschreibt die besondere Regelstrenge der pharisäischen Richtung; „strengsten“ ist im Deutschen präzise und idiomatisch.
- source_word: αἵρεσιν
  choice: Richtung
  rationale: Hier bezeichnet αἵρεσις eine erkennbare religiöse Gruppierung innerhalb des Judentums. „Richtung“ ist historisch neutral und vermeidet die spätere technische Bedeutung von „Häresie“.
- source_word: θρησκείας
  choice: Religion
  rationale: Im Kontext bezeichnet das Wort die gemeinsame jüdische Religion als Ganzes; „Religion“ ist klar und natürlich.
- source_word: ἔζησα Φαρισαῖος
  choice: Ich habe als Pharisäer … gelebt
  rationale: Die Formulierung gibt sowohl die frühere Lebensführung als auch die pharisäische Identität idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von αἵρεσις im jüdischen historischen Zusammenhang
  choice: Richtung
  alternative: Sekte; Partei; Häresie
  rationale: Gemeint ist die pharisäische Gruppierung innerhalb des damaligen Judentums, nicht eine „Häresie“ im späteren kirchlichen Sinn. „Richtung“ wahrt diesen neutralen historischen Bezug; Fußnote [b] nennt die ebenfalls mögliche Wiedergabe „Sekte“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der etwas konditionale Satzbau bewahrt die Aussage, dass die betreffenden Juden Paulus lange kannten, ihr tatsächliches Zeugnis aber von ihrer Bereitschaft dazu abhängt. Die Doppelpunktkonstruktion macht den griechischen Gedankengang im Deutschen verständlich, ohne die Bedingung in eine Tatsachenbehauptung umzudeuten.
