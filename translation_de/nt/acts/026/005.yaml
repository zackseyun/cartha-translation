  terminology: „Pharisäer“, „Religion“ und „Richtung“ sind passend. „Richtung“ gibt αἵρεσις hier neutral als innerjüdische Gruppierung wieder; die Fußnote erläutert die mögliche Wiedergabe „Sekte“ und grenzt die spätere Bedeutung „Häresie“ ab.
