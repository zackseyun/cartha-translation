  source_fidelity: Der Entwurf gibt die zeitliche Vorvertrautheit (προγινώσκοντες ... ἄνωθεν), die von ihrem Willen abhängige Aussagebereitschaft und Paulus’ frühere Lebensführung als Pharisäer in der strengsten αἵρεσις der gemeinsamen Religion sachgerecht wieder. Die Stellung des Fußnotenankers [b] ist jedoch nicht am Bezugswort αἵρεσις/Richtung, sondern am Satzende.
