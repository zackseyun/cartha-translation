  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: de
  text: Zu der unser Volk aus den zwölf Stämmen[a] zu gelangen hofft, indem es Gott Nacht und Tag mit ganzer Hingabe dient[b]. Wegen dieser Hoffnung werde ich von Juden[c] angeklagt, o König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische verwendet ein kollektives Substantiv für Israel als das Volk der zwölf Stämme. Auch möglich: „unsere zwölf Stämme“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gott verehrt“. Das griechische Verb kann religiösen Dienst oder Anbetung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind hier jüdische Ankläger; die Aussage bezieht sich nicht pauschal auf alle Juden.
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: Dieses Ziel
  rationale: Das Relativpronomen verweist auf die zuvor genannte Verheißung; die zielgerichtete Bedeutung von εἰς wird im Deutschen durch „Ziel“ natürlich ausgedrückt.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: unser Zwölfstämmevolk
  rationale: Der kollektive Singular bezeichnet Israel als das aus zwölf Stämmen bestehende Volk. Die Zusammensetzung bewahrt diese kollektive Einheit genauer als der bloße Plural „unsere zwölf Stämme“.
- source_word: ἐν ἐκτενείᾳ
  choice: mit ganzer Hingabe
  rationale: Die Wendung bezeichnet Ernsthaftigkeit, Intensität und beharrlichen Eifer; „mit ganzer Hingabe“ ist verständlich und würdevoll.
- source_word: νύκτα καὶ ἡμέραν
  choice: Nacht und Tag
  rationale: Bewahrt die griechische Reihenfolge und bezeichnet fortwährenden Dienst.
- source_word: λατρεῦον
  choice: Gott ... dient
  rationale: Das Verb bezeichnet hier religiösen Dienst beziehungsweise Gottesverehrung. Das im Kontext selbstverständliche Objekt „Gott“ wird zur Klarheit ergänzt.
- source_word: ἐλπίζει καταντῆσαι
  choice: hofft ... zu erreichen
  rationale: καταντάω beschreibt das Gelangen zu einem Ziel; die Formulierung gibt sowohl Hoffnung als auch Zielrichtung natürlich wieder.
- source_word: περὶ ἧς ἐλπίδος
  choice: Wegen dieser Hoffnung
  rationale: περί mit Genitiv kann den Gegenstand oder im Kontext den Anlass der Anklage bezeichnen. „Wegen“ ist im deutschen Gerichtskontext natürlich, während die sachbezogene Alternative in der Entscheidung dokumentiert bleibt.
- source_word: ἐγκαλοῦμαι
  choice: werde ich ... angeklagt
  rationale: Gibt den passiven juristischen Sinn im Kontext von Paulus’ Verteidigungsrede präzise wieder.
- source_word: ὑπὸ Ἰουδαίων
  choice: von Juden
  rationale: Die artikellose griechische Form bezeichnet jüdische Ankläger, nicht unterschiedslos das gesamte jüdische Volk. Eine Fußnote verhindert eine pauschalisierende Lesart.
- source_word: βασιλεῦ
  choice: o König
  rationale: Bewahrt den direkten Vokativ und den feierlich-rhetorischen Ton der Anrede an Agrippa.
theological_decisions:
- issue: Unausgesprochenes Objekt von λατρεῦον
  choice: '„Gott“ wird als Objekt ausdrücklich ergänzt: „Gott ... dient“'
  alternative: „dient“ oder „Gottesdienst hält“ ohne ausdrücklich genanntes Objekt
  rationale: Im Zusammenhang mit Israels beständigem religiösem Dienst ist Gott eindeutig der Empfänger. Die Ergänzung klärt den deutschen Satz, ohne eine neue theologische Aussage einzuführen.
- issue: Inhalt der Hoffnung
  choice: Der Rückverweis auf die zuvor genannte Verheißung bleibt erhalten, ohne hier die Auferstehung ausdrücklich einzusetzen
  alternative: Die Hoffnung bereits in diesem Vers ausdrücklich als Auferstehungshoffnung benennen
  rationale: Der Zusammenhang verbindet die Hoffnung mit Gottes Verheißung und dem Auferstehungsthema, doch dieser Vers selbst wiederholt ihren Inhalt nicht. Die Übersetzung lässt diesen Rückverweis bestehen.
- issue: περὶ als Gegenstand oder Grund der Anklage
  choice: „Wegen dieser Hoffnung“
  alternative: „Im Blick auf diese Hoffnung“ oder „Über diese Hoffnung“
  rationale: 'Im juristischen Zusammenhang liegt eine kausale Nuance nahe: Die Hoffnung ist Anlass der Anklage. Die mögliche sachbezogene Bedeutung wird nicht zu einer weitergehenden theologischen Deutung ausgebaut.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Zwölfstämmevolk“ ist eine bewusst kompakte, bibelsprachlich tragfähige Wiedergabe des kollektiven Singulars. Die feierliche Anrede „o König“ erhält die rhetorische Form der Verteidigungsrede.
