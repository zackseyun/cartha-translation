source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: de
  text: König Agrippa, wegen all dessen, wessen ich von jüdischer Seite beschuldigt werde, schätze ich mich glücklich, dass ich heute vor dir meine Verteidigung vorbringen werde,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: gegen all das …, dessen
  rationale: περί bezeichnet hier den Gegenstand der Verteidigung; zusammen mit ἐγκαλοῦμαι lässt sich die griechische Verknüpfung im Deutschen natürlich durch „sich gegen all das verteidigen, dessen … beschuldigt“ wiedergeben.
- source_word: ἐγκαλοῦμαι
  choice: ich … beschuldigt werde
  rationale: Das Verb bezeichnet im gerichtlichen Zusammenhang eine gegen Paulus erhobene Beschuldigung. Das Präsens Passiv bleibt erhalten.
- source_word: ὑπὸ Ἰουδαίων
  choice: von Juden
  rationale: ὑπό kennzeichnet die Handelnden. Der artikellose Ausdruck wird als „von Juden“ wiedergegeben und bezeichnet im Kontext jüdische Ankläger, ohne pauschal alle Juden einzubeziehen.
- source_word: βασιλεῦ Ἀγρίππα
  choice: König Agrippa
  rationale: Der Vokativ wird als direkte, im modernen Deutschen natürliche Anrede wiedergegeben.
- source_word: ἥγημαι ἐμαυτὸν
  choice: ich schätze mich
  rationale: ἡγέομαι mit reflexivem Akkusativ bedeutet „sich für etwas halten / sich einschätzen“. „Ich schätze mich“ bewahrt die reflexive Form und klingt in Verbindung mit „glücklich“ würdevoll und idiomatisch.
- source_word: μακάριον
  choice: glücklich
  rationale: Im forensischen Kontext bezeichnet μακάριον eine günstige, privilegierte Lage, nicht zwingend einen ausdrücklich theologischen Segen. „Glücklich“ bewahrt dabei mehr von der traditionellen Bedeutungsbreite als das rein zufallsbezogene „vom Glück begünstigt“.
- source_word: ἐπὶ σοῦ
  choice: vor dir
  rationale: Die Wendung bezeichnet hier das Auftreten beziehungsweise Sprechen vor Agrippa in einer Anhörung.
- source_word: μέλλων
  choice: … verteidigen zu können
  rationale: Das Partizip mit Infinitiv drückt die unmittelbar bevorstehende Verteidigung aus. Im deutschen Satz vermittelt die Verbindung mit „heute“ und „zu können“ zugleich die bevorstehende Gelegenheit, ohne eine schwerfällige Partizipialkonstruktion.
- source_word: σήμερον
  choice: heute
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: ἀπολογεῖσθαι
  choice: mich … verteidigen
  rationale: Das Verb ist forensisch und bezeichnet das Vorbringen der eigenen Verteidigung. Die reflexive deutsche Form ist klar und idiomatisch.
theological_decisions:
- issue: Bedeutungsnuance von μακάριον
  choice: glücklich
  alternative: vom Glück begünstigt / in einer bevorzugten Lage
  rationale: Der gerichtliche Kontext spricht für eine günstige oder privilegierte Lage; zugleich soll die mögliche weitere Bedeutungsbreite von μακάριος nicht unnötig auf bloßen Zufall oder ausdrücklich geistlichen Segen festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht zur besseren deutschen Satzführung am Anfang. „Von Juden“ vermeidet eine pauschale Aussage über das gesamte jüdische Volk und entspricht dem artikellosen griechischen Ausdruck im konkreten Kontext.
