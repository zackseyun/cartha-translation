id: ACT.26.1
reference: Acts 26:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: de
  text: 'Da sagte Agrippa zu Paulus: „Es ist dir gestattet, in eigener Sache zu sprechen.[a]“ Darauf streckte Paulus die Hand aus und verteidigte sich[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für dich selbst zu sprechen.“'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann auch das Vorbringen einer förmlichen oder rechtlichen Verteidigung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agrippa
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier den nächsten Schritt der Erzählung ein; „Da“ gibt den Fortgang natürlich wieder, ohne einen starken Gegensatz auszudrücken.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: sagte … zu Paulus
  rationale: Dies ist die natürliche deutsche Wiedergabe der Verbindung aus einem Verb des Sagens und πρός.
- source_word: Ἐπιτρέπεταί σοι
  choice: Es ist dir gestattet
  rationale: Die passive Form und der förmliche Ton der Erlaubnis werden bewahrt.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: in eigener Sache zu sprechen
  rationale: Im Kontext einer Anhörung bezeichnet ὑπὲρ σεαυτοῦ das Reden zugunsten der eigenen Person beziehungsweise Sache, ohne den Ausdruck bereits vollständig als juristische Verteidigung festzulegen.
- source_word: τότε
  choice: Darauf
  rationale: „Darauf“ wahrt die ausdrücklich markierte zeitliche Abfolge und klingt im deutschen Erzählfluss natürlich.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: streckte … die Hand aus
  rationale: Die körperliche Geste wird unmittelbar wiedergegeben, ohne sie näher als bestimmte Rednergeste auszudeuten.
- source_word: ἀπελογεῖτο
  choice: verteidigte sich
  rationale: Das Imperfekt wird als einsetzende beziehungsweise fortlaufende Verteidigungsrede im Erzählzusammenhang wiedergegeben; der folgende Doppelpunkt macht deutlich, dass nun die Rede folgt.
theological_decisions:
- issue: Rechtlicher Gehalt von ἀπελογεῖτο
  choice: verteidigte sich
  alternative: hielt seine Verteidigungsrede / trug seine Verteidigung vor
  rationale: „Verteidigte sich“ bewahrt sowohl den allgemeinen als auch den möglichen förmlich-rechtlichen Sinn des Verbs, ohne den juristischen Grad stärker festzulegen, als es der Kontext verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einem leicht förmlichen Ton, der zur Anhörung vor Agrippa passt. Die Satzstellung bleibt klar und gut vorlesbar.
