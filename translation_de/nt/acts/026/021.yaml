  text: ἕνεκα τούτων ⸂με Ἰουδαῖοι⸃ ⸀συλλαβόμενοι ἐν τῷ ἱερῷ ἐπειρῶντο διαχειρίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: de
  text: Deswegen ergriffen mich Juden im Tempel und versuchten, mich zu töten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Aus diesem Grund“ oder „Wegen dieser Dinge“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet hier die gesamte Tempelanlage, nicht nur das innere Heiligtum.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: Deswegen
  rationale: Die Präposition mit dem Genitiv bezeichnet Ursache oder Grund und verweist auf das zuvor Geschilderte zurück. „Deswegen“ ist knapp, natürlich und wahrt diesen rückbezüglichen Zusammenhang.
- source_word: με
  choice: mich
  rationale: Akkusativobjekt zu συλλαβόμενοι und sinngemäß auch zum Infinitiv; die erste Person Singular wird direkt wiedergegeben.
- source_word: Ἰουδαῖοι
  choice: Juden
  rationale: Der artikellose griechische Plural bezeichnet hier die jüdischen Gegner, die Paulus ergriffen, nicht das jüdische Volk insgesamt. Der artikellose deutsche Plural vermeidet eine pauschalisierende Aussage.
- source_word: συλλαβόμενοι
  choice: packten
  rationale: Das Partizip bezeichnet ein gewaltsames Ergreifen. „Packten“ gibt die feindselige Handlung anschaulich und in natürlichem modernem Deutsch wieder, ohne den amtlichen Beiklang von „verhafteten“ einzutragen.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet die gesamte Tempelanlage, nicht speziell das innere Heiligtum. „Im Tempel“ ist idiomatisch; eine Fußnote präzisiert den räumlichen Umfang.
- source_word: ἐπειρῶντο
  choice: versuchten
  rationale: Das Imperfekt bezeichnet den im Gang befindlichen, nicht zum Ziel gelangten Versuch. Im Deutschen vermittelt „versuchten“ dies zusammen mit dem Infinitiv natürlich.
- source_word: διαχειρίσασθαι
  choice: zu töten
  rationale: Das Verb bedeutet in diesem Zusammenhang, jemanden gewaltsam umzubringen. „Zu töten“ ist klar und fügt im Unterschied zu „zu ermorden“ keine zusätzliche rechtlich-moralische Wertung hinzu.
theological_decisions:
- issue: Bezug von Ἰουδαῖοι in einem polemisch sensiblen Zusammenhang
  choice: „Juden“ ohne bestimmten Artikel, kontextuell auf die an der Ergreifung beteiligten jüdischen Gegner bezogen
  alternative: „die Juden“ oder „jüdische Leute“
  rationale: Der Text nennt die an diesem Ereignis beteiligte Gruppe, erhebt aber keine Aussage über alle Juden. Die artikellose Form bewahrt den historischen Bezug, ohne ihn zu einer ethnischen Pauschalisierung zu verschärfen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. „Packten“ bringt die gewaltsame Situation natürlicher zum Ausdruck als das amtlich klingende „verhafteten“. Die Wortstellung folgt idiomatischem Deutsch und bewahrt den kausalen Rückverweis.
