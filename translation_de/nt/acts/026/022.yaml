revisions:
- from: Weil ich nun die Hilfe von Gott erhalten habe, stehe ich bis auf diesen Tag da und lege vor Geringen wie vor Großen[a] Zeugnis ab. Dabei sage ich nichts, was über das hinausgeht, wovon die Propheten und Mose gesagt haben, dass es geschehen werde.[b]
  to: So stehe ich bis heute, weil ich Gottes Hilfe erhalten habe, und lege sowohl vor Geringen als auch vor Großen[a] Zeugnis ab. Ich sage dabei nichts außer dem, was sowohl die Propheten als auch Mose als kommendes Geschehen vorausgesagt haben.[b]
  rationale: Die Satzführung wurde für modernes Standarddeutsch geglättet und zugleich enger an die griechische Struktur angebunden. „So“ gibt die inferentielle Funktion von οὖν wieder; die erhaltene Hilfe Gottes bleibt als Grund ausdrücklich genannt. Die Formulierung zu den Propheten und Mose stellt klar und ohne zusätzliche Auslegung heraus, dass Paulus nur das bezeugt, was sie als künftig eintretend vorausgesagt haben. Die Fußnotenanker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:43:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur wird getroffen: Gottes Hilfe, das fortdauernde Auftreten als Zeuge, die Adressaten aller Ränge und die Beschränkung auf Mose und die Propheten. Allerdings ist „Weil ich nun“ für das inferentielle οὖν weniger passend, „bis auf diesen Tag da“ im modernen Standarddeutsch unnatürlich, und der Anschluss „wovon ... gesagt haben, dass es geschehen werde“ bildet den Inhaltssatz zu ἐλάλησαν μελλόντων γίνεσθαι unnötig indirekt und schwer verständlich ab.'
  naturalness: Die Überarbeitung verwendet idiomatisches, würdiges Gegenwartsdeutsch. „Bis heute stehe ich“ bewahrt das Bild von ἕστηκα, ohne die umgangs- oder ortsbezogene Nuance von „stehe ... da“.
  terminology: „Gottes Hilfe“, „Zeugnis ablegen“, „Geringe und Große“, „die Propheten und Mose“ und „vorausgesagt“ sind sachgerecht. „Vorausgesagt“ gibt in diesem Kontext die Aussage über künftig Geschehendes wieder, ohne den folgenden Vers inhaltlich vorwegzunehmen.
  issues:
  - severity: medium
    issue: „Weil ich nun“ gibt οὖν nicht treffend wieder.
    rationale: οὖν ist hier vor allem folgernd bzw. weiterführend („daher/so nun“), nicht schlicht eine kausale Einleitung. Die Kausalbeziehung stammt aus dem Partizipialausdruck und lässt sich im Deutschen besser mit „weil ich ... erhalten habe“ innerhalb des Satzes ausdrücken.
  - severity: medium
    issue: „stehe ich bis auf diesen Tag da“ ist unidiomatisch.
    rationale: „Bis auf diesen Tag“ wirkt in modernem Deutsch künstlich; „dastehen“ kann zudem bloßes Herumstehen oder Verlegenheit andeuten. „Bis heute stehe ich“ bewahrt die resultative Gegenwartsbedeutung des Perfekts ἕστηκα.
  - severity: medium
    issue: Der Relativanschluss mit „wovon ... gesagt haben, dass es geschehen werde“ ist syntaktisch und semantisch schwerfällig.
    rationale: ὧν bezieht sich auf das von Propheten und Mose angekündigte künftige Geschehen. Eine direkte Fassung mit „was ... vorausgesagt haben“ ist klarer und wahrt Umfang und Zukunftsbezug der griechischen Aussage.
