source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: de
  text: So stehe ich bis heute, weil ich Gottes Hilfe erhalten habe, und lege sowohl vor Geringen als auch vor Großen[a] Zeugnis ab. Ich sage dabei nichts außer dem, was sowohl die Propheten als auch Mose als kommendes Geschehen vorausgesagt haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geringe und Große“ bezeichnet Menschen jeden gesellschaftlichen Ranges.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Ich sage dabei nichts, was über das hinausgeht, was sowohl die Propheten als auch Mose als kommendes Geschehen vorausgesagt haben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τῆς ἀπὸ τοῦ θεοῦ
  choice: die Hilfe von Gott
  rationale: ἐπικουρία bezeichnet Hilfe oder Beistand; die attributive Wendung ἀπὸ τοῦ θεοῦ nennt Gott ausdrücklich als deren Ursprung.
- source_word: τυχὼν
  choice: erhalten habe
  rationale: Das Aoristpartizip von τυγχάνω bedeutet hier, Hilfe erlangt oder empfangen zu haben. Die finite Nebensatzform ist im Deutschen natürlich.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: stehe ich bis auf diesen Tag da
  rationale: Das Perfekt ἕστηκα bezeichnet den bis zur Gegenwart bestehenden Zustand; „stehe ... da“ bewahrt das Bild und klingt im Deutschen idiomatisch.
- source_word: μαρτυρόμενος
  choice: lege ... Zeugnis ab
  rationale: Die Wendung gibt die fortdauernde Zeugentätigkeit wieder und bewahrt den möglichen forensischen Klang.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: vor Geringen wie vor Großen
  rationale: Die antithetische Formel wird bewahrt und bezeichnet Menschen unabhängig von Rang oder Bedeutung.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: Dabei sage ich nichts, was über das hinausgeht
  rationale: ἐκτός kann hier „außerhalb von“ beziehungsweise „über ... hinaus“ bedeuten; diese Fassung gibt die starke Begrenzung von Paulus’ Aussage klar wieder.
- source_word: ὧν τε οἱ προφῆται ἐλάλησαν ... καὶ Μωϋσῆς
  choice: wovon die Propheten und Mose gesagt haben
  rationale: Die griechische Reihenfolge und die Verbindung von Propheten und Mose werden beibehalten; der Relativanschluss ist im Deutschen verständlich.
- source_word: μελλόντων γίνεσθαι
  choice: dass es geschehen werde
  rationale: Die Konstruktion bezeichnet aus Sicht der früheren Sprecher zukünftiges Geschehen. Der Konjunktiv I markiert die abhängige Wiedergabe, ohne besondere Unmittelbarkeit einzutragen.
theological_decisions:
- issue: Verhältnis von Paulus’ Zeugnis zu Mose und den Propheten
  choice: Paulus sagt, dass sein Zeugnis nicht über das von den Propheten und Mose angekündigte Geschehen hinausgeht.
  alternative: Paulus behauptet lediglich eine allgemeine Übereinstimmung mit der Schrift.
  rationale: οὐδὲν ἐκτὸς formuliert eine starke Begrenzung und betont die Kontinuität mit Israels Schriften, ohne den Inhalt des folgenden Verses vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der längere griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Bis auf diesen Tag“ bewahrt den feierlichen zeitlichen Ausdruck, während „stehe ... da“ den gegenwärtigen Resultatszustand des griechischen Perfekts natürlich wiedergibt.
