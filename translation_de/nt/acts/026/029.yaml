source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: de
  text: 'Paulus aber sagte: „Ich würde Gott darum bitten, dass nicht nur du, sondern auch alle, die mich heute hören, ob in kurzer oder langer Zeit[a] so werden wie ich – abgesehen von diesen Fesseln.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ob beinahe oder völlig“; auch „mit wenig oder mit viel Aufwand“ ist möglich. Der griechische Ausdruck ist schwierig und kann Grad, Aufwand oder Zeit beziehungsweise Umfang bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: Ich bete zu Gott
  rationale: Der Optativ mit ἄν drückt einen zurückhaltend formulierten Wunsch aus; mit dem ausdrücklich genannten τῷ θεῷ ist „zu Gott beten“ im Deutschen natürlich und sachlich treffend.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: in kurzer oder langer Zeit
  rationale: Die schwierige Gegenüberstellung kann Zeit, Ausmaß oder Aufwand bezeichnen. Die zeitliche Wiedergabe passt zum Gesprächszusammenhang, ohne die Aussage auf das traditionelle Verständnis „beinahe oder völlig“ festzulegen.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: nicht nur du, sondern auch alle, die mich heute hören
  rationale: Bewahrt die emphatische Gegenüberstellung und gibt das präsentische Partizip in natürlichem modernem Deutsch wieder.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: so werden mögen, wie auch ich bin
  rationale: „Werden mögen“ gibt den gewünschten Eintritt in einen Zustand wieder; „wie auch ich bin“ erhält das καί und Paulus’ betonte Selbstreferenz.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: abgesehen von diesen Fesseln
  rationale: παρεκτός bezeichnet eine Ausnahme; „Fesseln“ ist konkret, würdevoll und für Paulus’ Gefangenschaft idiomatisch.
theological_decisions:
- issue: Deutung von ἐν ὀλίγῳ καὶ ἐν μεγάλῳ im Zusammenhang mit Agrippas vorausgehender Äußerung
  choice: in kurzer oder langer Zeit
  alternative: beinahe oder völlig; mit wenig oder mit viel Aufwand
  rationale: Der griechische Ausdruck ist mehrdeutig. Der Haupttext bietet eine plausible zeitliche Deutung; die Fußnote bewahrt die anderen ernsthaft vertretenen Möglichkeiten, ohne die Spannung dogmatisch aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller direkter Rede. Die Satzstellung hält Paulus’ Gebet und dessen Reichweite klar zusammen; der Gedankenstrich hebt die pointierte Ausnahme der Fesseln hervor.
