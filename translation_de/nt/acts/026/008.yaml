  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: de
  text: Warum erscheint es euch unglaubhaft, wenn Gott Tote auferweckt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ἄπιστον κρίνεται παρ’ ὑμῖν
  choice: Warum erscheint es euch unglaubhaft
  rationale: Gibt die rhetorische Frage natürlich und würdig wieder. κρίνεται bezeichnet hier die Einschätzung oder Beurteilung; παρ’ ὑμῖν wird mit dem auf die Urteilenden bezogenen „euch“ erhalten.
- source_word: εἰ
  choice: dass
  rationale: Nach einer Wertung wie „unglaubhaft erscheinen“ gibt „dass“ den Inhalt dessen an, was für unglaubhaft gehalten wird; ein konditionales „wenn“ wäre im Deutschen möglich, aber weniger idiomatisch.
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: Gott Tote auferweckt
  rationale: Bewahrt das präsentische ἐγείρει sowie den knappen, allgemeinen Ausdruck νεκρούς ohne einen im Griechischen nicht vorhandenen Artikel.
theological_decisions:
- issue: Reichweite der Aussage über die Auferweckung der Toten
  choice: „Gott Tote auferweckt“ bleibt allgemein formuliert.
  alternative: „Gott die Toten auferweckt“ oder eine ausdrückliche Bezugnahme auf Jesus
  rationale: Der griechische Satz nennt weder ausdrücklich alle Toten noch ausschließlich Jesus. Die offene, rhetorische Formulierung soll nicht dogmatisch verengt oder erweitert werden.
translation_notes:
  register: Modernes Standarddeutsch in einer knappen, rhetorischen und würdigen Form. „Erscheint“ ist natürlicher als das formnähere, aber schwerfällige „wird beurteilt“; die Perspektive des Urteils bleibt durch „euch“ gewahrt.
