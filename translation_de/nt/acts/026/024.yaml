id: ACT.26.24
reference: Acts 26:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: de
  text: 'Während Paulus sich so verteidigte, rief Festus mit lauter Stimme: »Du bist von Sinnen, Paulus! Dein großes Wissen treibt dich in den Wahnsinn.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: während Paulus sich so verteidigte
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitige Handlung. »Sich verteidigte« bewahrt den forensischen Sinn von ἀπολογέομαι; »so« nimmt Ταῦτα auf und bezieht sich auf die unmittelbar vorausgehenden Ausführungen.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: mit lauter Stimme
  rationale: Die Dativfügung bezeichnet die Art und Weise und wird nah am griechischen Ausdruck sowie idiomatisch deutsch wiedergegeben.
- source_word: φησιν
  choice: rief
  rationale: Das historische Präsens wird entsprechend natürlicher deutscher Erzählweise im Präteritum wiedergegeben. »Rief« verbindet das Sprechen sachgerecht mit der ausdrücklich genannten lauten Stimme.
- source_word: Μαίνῃ
  choice: du bist von Sinnen
  rationale: Die Wendung gibt den Vorwurf geistiger Verwirrung kräftig und in würdigem, weiterhin verständlichem Deutsch wieder, ohne eine moderne medizinische Diagnose einzutragen.
- source_word: τὰ πολλά ... γράμματα
  choice: dein großes Wissen
  rationale: γράμματα kann Schriftkenntnis, Bildung oder Gelehrsamkeit bezeichnen. Im Kontext meint Festus plausibel die umfangreiche Bildung beziehungsweise Kenntnis des Paulus, nicht eine Menge konkreter Briefe.
- source_word: εἰς μανίαν
  choice: in den Wahnsinn
  rationale: 'Die Präposition εἰς bewahrt die resultative beziehungsweise gerichtete Vorstellung: Das Wissen treibe Paulus in einen Zustand des Wahnsinns.'
- source_word: περιτρέπει
  choice: treibt
  rationale: Das Verb bezeichnet hier das Hineinbringen oder Umwenden in einen Zustand. »Treibt« ist im Deutschen idiomatisch und erhält die kausative Kraft.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. Festus’ Unterbrechung bleibt durch »rief« und das Ausrufezeichen lebhaft; der rechtliche Charakter von Paulus’ Rede wird durch »sich verteidigte« bewahrt.
