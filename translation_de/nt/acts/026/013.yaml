id: ACT.26.13
reference: Acts 26:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: de
  text: Mitten am Tag sah ich auf dem Weg, o König, vom Himmel her ein Licht, heller als die Sonne[a], das mich und meine Reisegefährten umstrahlte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »über den Glanz der Sonne hinaus«; das Griechische betont, dass das Licht den Glanz der Sonne übertraf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: Mitten am Tag
  rationale: Die Genitivfügung bezeichnet idiomatisch die Tagesmitte; die Wiedergabe ist zeitlich präzise und in modernem Deutsch natürlich.
- source_word: κατὰ τὴν ὁδὸν
  choice: auf dem Weg
  rationale: Die Wendung bezeichnet den Ort beziehungsweise den Verlauf der Reise und bewahrt das konkrete Wegmotiv.
- source_word: εἶδον
  choice: sah ich
  rationale: Der Aorist des Wahrnehmens wird schlicht und unmittelbar wiedergegeben.
- source_word: βασιλεῦ
  choice: o König
  rationale: Der Vokativ ist eine direkte förmliche Anrede. Das knappe „o“ bewahrt ihre Form, ohne den im Vers nicht genannten Namen Agrippas einzufügen.
- source_word: οὐρανόθεν
  choice: vom Himmel her
  rationale: Die Form bezeichnet die Herkunft von oben; im Offenbarungskontext wahrt „Himmel“ die erzählerische und theologische Tragweite besser als „Himmelssphäre“ oder „vom Himmel herunter“.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: heller als die Sonne
  rationale: ὑπέρ mit Akkusativ drückt ein Übertreffen aus. Die natürliche deutsche Vergleichsform gibt den Sinn präzise wieder; die ausdrücklich genannte Helligkeit beziehungsweise der Glanz wird in der Fußnote kenntlich gemacht.
- source_word: φῶς
  choice: ein Licht
  rationale: Das artikellose Substantiv führt die wahrgenommene Lichterscheinung ein und wird im Deutschen idiomatisch mit dem unbestimmten Artikel wiedergegeben.
- source_word: περιλάμψαν
  choice: umstrahlte
  rationale: Das zusammengesetzte Verb bezeichnet ein ringsum scheinendes Licht; „umstrahlte“ erfasst sowohl das Leuchten als auch dessen umfassende Ausrichtung.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: meine Reisegefährten
  rationale: Die substantivierte Partizipialgruppe bezeichnet diejenigen, die mit Paulus unterwegs waren. „Reisegefährten“ ist knapp, klar und fügt keine nähere Bestimmung hinzu.
theological_decisions:
- issue: Wiedergabe von οὐρανόθεν im Zusammenhang einer Offenbarungserscheinung
  choice: vom Himmel her
  alternative: vom Himmel / aus dem Himmel
  rationale: Die Formulierung bewahrt die himmlische Herkunft des Lichts, ohne die Art des Erlebnisses über den Wortlaut hinaus dogmatisch festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller Erzählweise. Die direkte Anrede „o König“ bewahrt den griechischen Vokativ; die Satzstellung bleibt trotz der eingeschobenen Anrede flüssig. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die Anmerkung bezieht.
