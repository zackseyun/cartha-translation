id: ACT.26.10
reference: Acts 26:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: de
  text: 'Und das tat ich auch in Jerusalem: Viele von den Heiligen[a] sperrte ich in Gefängnisse ein, nachdem ich von den Hohenpriestern Vollmacht erhalten hatte; und wenn sie getötet wurden, gab ich meine Stimme gegen sie ab[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Heiligen« sind hier die Menschen gemeint, die zu Jesus gehören, nicht nur eine besonders ausgezeichnete Gruppe.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich ist von einem »Stimmstein« die Rede. Gemeint sein kann eine förmliche Stimmabgabe oder, allgemeiner, die ausdrückliche Zustimmung zu ihrer Tötung; der genaue institutionelle Rahmen bleibt offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: Und genau das tat ich
  rationale: Das Relativpronomen greift die zuvor beschriebene Verfolgung auf; „genau das“ gibt den rückbezüglichen und bestätigenden Sinn in natürlichem Deutsch wieder.
- source_word: ἐν Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: πολλούς τε τῶν ἁγίων
  choice: Viele von den Heiligen
  rationale: ἅγιοι bezeichnet hier die zur christlichen Gemeinschaft gehörenden Menschen. „Heilige“ bewahrt den neutestamentlichen Schlüsselbegriff, ohne eine später kirchenrechtlich anerkannte Sondergruppe zu meinen.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: sperrte ich in Gefängnisse
  rationale: Die Formulierung bewahrt sowohl das aktive Einschließen als auch den ausdrücklich gesetzten Plural von φυλακαῖς.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: nachdem ich von den führenden Priestern die Vollmacht dazu erhalten hatte
  rationale: Der Partizipialsatz nennt die Grundlage seines Handelns. „Vollmacht“ gibt ἐξουσία prägnant wieder; „führende Priester“ ist im heutigen Deutsch verständlicher als das leicht missverständliche „Hohepriester“ im Plural.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: wenn sie getötet wurden
  rationale: Die passive Partizipialkonstruktion wird zeitlich wiedergegeben. „Getötet“ wahrt den Ernst der Aussage, ohne über den Text hinaus eine bestimmte rechtliche Hinrichtungsform festzulegen.
- source_word: κατήνεγκα ψῆφον
  choice: gab ich meine Stimme gegen sie ab
  rationale: ψῆφος bezeichnet wörtlich einen Stimmstein und dann eine Stimme. Die deutsche Wendung gibt den Abstimmungssinn wieder; „gegen sie“ macht die im Verfolgungskontext erkennbare Richtung der Stimme deutlich.
theological_decisions:
- issue: Bedeutung von ἅγιοι
  choice: „Heilige“ als Bezeichnung für die Glaubenden beziehungsweise Gottes heiliges Volk
  alternative: „die heiligen Menschen“ oder „Gottes Volk“
  rationale: Der Ausdruck meint die Angehörigen der christlichen Gemeinschaft insgesamt, nicht nur eine besonders ausgezeichnete oder später heiliggesprochene Gruppe.
- issue: Aussagekraft von κατήνεγκα ψῆφον
  choice: Paulus gab seine Stimme gegen die Betroffenen ab
  alternative: Paulus billigte ihre Tötung, ohne dass zwingend eine förmliche Abstimmung gemeint sein muss
  rationale: Die konkrete Bildsprache des Stimmsteins spricht am ehesten für eine Stimmabgabe. Eine Fußnote lässt offen, in welchem institutionellen Rahmen dies geschah.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige griechische Periodenstruktur, während die beiden miteinander verbundenen Verfolgungshandlungen erhalten bleiben. „Führende Priester“ verhindert die im Deutschen naheliegende Fehlvorstellung mehrerer gleichzeitig amtierender Hohepriester.
