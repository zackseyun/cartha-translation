  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Paulus beschreibt seine Verfolgungstätigkeit in Jerusalem, die Gefangensetzung vieler ἅγιοι aufgrund einer von den ἀρχιερεῖς erhaltenen ἐξουσία sowie seine Stimmabgabe bei deren Tötung. Eine Korrektur ist bei der Bezeichnung ἀρχιερεῖς angebracht: „Hohenpriester“ ist im neutestamentlichen Kontext die etablierte deutsche Sachbezeichnung für die führende priesterliche Gruppe; der Plural behauptet nicht mehrere gleichzeitig amtierende oberste Hohepriester. Die Satzverbindung wird zudem näher am griechischen Zusammenhang belassen.'
