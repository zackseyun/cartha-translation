  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: de
  text: Nachdem sie das Gefängnis verlassen hatten, gingen sie zu Lydia. Als sie die Brüder[a] sahen, ermutigten sie sie und zogen weiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Brüder und Schwestern“. Das griechische Wort steht im männlichen Plural, kann aber eine gemischte Gruppe von Glaubenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες ἀπὸ τῆς φυλακῆς
  choice: Nachdem sie aus dem Gefängnis gekommen waren
  rationale: Das vorangestellte Aoristpartizip bezeichnet eine Handlung, die dem folgenden Hauptverb zeitlich vorausgeht. Die Formulierung gibt Abfolge und bestimmtes Gefängnis natürlich wieder.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: gingen sie zu Lydia
  rationale: Die Verbindung bezeichnet hier das Aufsuchen Lydias. Anders als „zu Lydia ins Haus“ ergänzt diese Wiedergabe keinen im Vers ausdrücklich genannten Ort.
- source_word: ἰδόντες
  choice: Als sie … gesehen hatten
  rationale: Das Aoristpartizip wird als temporaler Nebensatz wiedergegeben und wahrt, dass das Sehen der Ermutigung vorausgeht.
- source_word: παρεκάλεσαν
  choice: ermutigten sie
  rationale: παρακαλέω kann ermahnen, ermutigen oder trösten bedeuten. „ermutigten“ bewahrt hier den breiten stärkenden Sinn, ohne ihn unnötig einzuengen.
- source_word: τοὺς ἀδελφούς
  choice: die Brüder und Schwestern
  rationale: Der maskuline griechische Plural kann eine gemischte Gruppe von Glaubensgeschwistern bezeichnen. Im Kontext um Lydia ist die inklusive deutsche Wiedergabe wahrscheinlich sachgerecht; die formnähere Alternative steht in der Fußnote.
- source_word: ἐξῆλθαν
  choice: zogen weiter
  rationale: Das Verb bezeichnet das Weggehen. „zogen weiter“ vermeidet die missverständliche Wiederholung von „hinausgehen“ und passt zum erzählten Aufbruch, ohne ein Ziel festzulegen.
theological_decisions:
- issue: Bezeichnung der christlichen Gemeinschaft mit τοὺς ἀδελφούς
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Der grammatisch maskuline Plural kann im Koine-Griechischen Männer und Frauen gemeinsam meinen. Die inklusive Haupttextfassung macht den wahrscheinlichen Bezug deutlich; die Fußnote erhält die formale Alternative und damit die sprachliche Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Partizipialkonstruktionen werden in natürliche temporale Nebensätze aufgelöst; „Haus“ wird nicht ergänzt, da es im griechischen Wortlaut dieses Verses nicht ausdrücklich steht.
