  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: de
  text: Da erhob sich die Menge geschlossen gegen sie.[a] Die Stadtobersten rissen ihnen die Kleider vom Leib und befahlen, sie mit Ruten zu schlagen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da schloss sich die Menge dem Angriff auf sie an.“ Das griechische Verb betont das gemeinsame feindselige Vorgehen.'
    reason: lexical_alternative
  - marker: b
    text: Die „Stadtobersten“ waren die leitenden römischen Amtsträger in Philippi; technisch können sie als Prätoren bezeichnet werden.
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: erhob sich ... gemeinsam gegen
  rationale: Die Form bezeichnet ein gemeinsames, feindseliges Vorgehen. Die Wiedergabe bewahrt sowohl den kollektiven Charakter als auch die offene Feindseligkeit, ohne mit „angreifen“ einen bereits vollzogenen körperlichen Angriff festzulegen.
- source_word: ὄχλος
  choice: Menge
  rationale: „Menge“ ist im modernen Standarddeutsch natürlich und neutral genug; „Mob“ wäre stärker wertend, als das Substantiv selbst verlangt.
- source_word: κατ’ αὐτῶν
  choice: gegen sie
  rationale: Dies gibt die feindselige Bedeutung von κατά mit dem Genitiv hier idiomatisch wieder.
- source_word: στρατηγοὶ
  choice: Stadtobersten
  rationale: In der römischen Kolonie Philippi bezeichnet das Wort die leitenden städtischen Amtsträger. „Stadtoberste“ ist verständlich und bewahrt den institutionellen Bezug; die technischere Einordnung steht in der Fußnote.
- source_word: περιρήξαντες αὐτῶν τὰ ἱμάτια
  choice: ließen ihnen die Kleider vom Leib reißen
  rationale: Das Griechische sagt wörtlich, dass die Amtsträger ihnen die Kleider abrissen. Im Zusammenhang mit ihrem anschließenden Befehl kann Deutsch natürlich eine veranlassende Handlung ausdrücken; zugleich bleibt das gewaltsame Entkleiden deutlich.
- source_word: ἐκέλευον
  choice: befahlen
  rationale: Das Imperfekt schildert den Befehl innerhalb des fortlaufenden Geschehens. Ein einfaches deutsches Präteritum ist hier natürlicher als eine schwerfällige Verlaufsform.
- source_word: ῥαβδίζειν
  choice: mit Ruten zu schlagen
  rationale: Die Wendung bezeichnet ausdrücklich eine Prügelstrafe mit Ruten und vermeidet die mögliche Verwechslung von „auspeitschen“ mit einer Bestrafung durch Peitschen.
