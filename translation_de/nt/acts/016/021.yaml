  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: de
  text: und sie verkünden Bräuche, die wir als Römer weder annehmen noch ausüben dürfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil wir Römer sind“. Die griechische Partizipialkonstruktion kann den von den Anklägern angeführten Grund nennen oder die Aussage als für Römer geltend kennzeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ καταγγέλλουσιν
  choice: und verkünden
  rationale: Das Präsens führt die Anklage aus dem vorherigen Vers fort; „verkünden“ bewahrt den öffentlichen Charakter, ohne das Verb stärker als „lehren“ oder „propagieren“ auszulegen.
- source_word: ἔθη
  choice: Bräuche
  rationale: „Bräuche“ bezeichnet etablierte Sitten oder Praktiken und passt zum gesellschaftlich-rechtlichen Rahmen der Anklage.
- source_word: οὐκ ἔξεστιν ἡμῖν
  choice: uns nicht erlaubt ist
  rationale: Die Formulierung gibt den behaupteten rechtlichen beziehungsweise gesellschaftlichen Erlaubnisrahmen wieder, ohne die Anklage als sachlich zutreffend zu bestätigen.
- source_word: παραδέχεσθαι
  choice: anzunehmen
  rationale: Das Verb meint hier, die genannten Bräuche zu akzeptieren oder zu übernehmen; „anzunehmen“ hält diese Bedeutungsbreite offen.
- source_word: οὐδὲ ποιεῖν
  choice: oder auszuüben
  rationale: In Verbindung mit „Bräuche“ bezeichnet ποιεῖν deren praktische Ausübung. Im Deutschen gibt „oder“ nach der vorausgehenden Verneinung die griechische Verbindung natürlich wieder.
- source_word: Ῥωμαίοις οὖσιν
  choice: da wir Römer sind
  rationale: Die partizipiale Wendung nennt den von den Anklägern vorgebrachten Grund für das behauptete Verbot.
theological_decisions:
- issue: Art des behaupteten Verbots
  choice: Die Anklage wird in rechtlich-gesellschaftlicher Sprache als „uns nicht erlaubt“ wiedergegeben, ohne ihre Richtigkeit zu bestätigen.
  alternative: „für uns nicht recht“
  rationale: οὐκ ἔξεστιν bezeichnet Erlaubnis oder Zulässigkeit. Der Vers berichtet die Behauptung der Ankläger und erklärt sie nicht zur objektiven Rechtslage.
- issue: Funktion von Ῥωμαίοις οὖσιν
  choice: 'kausal: „da wir Römer sind“'
  alternative: 'modal/statusbezogen: „als Römer“'
  rationale: Der Kontext legt eine Begründung nahe, doch die knappe griechische Partizipialkonstruktion kann auch enger als Statusangabe verstanden werden; die Fußnote bewahrt diese Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt den Anschluss an die laufende Anklage; „Bräuche“, „anzunehmen“ und „auszuüben“ sind verständlich und zugleich dem rechtlich-gesellschaftlichen Ton angemessen.
