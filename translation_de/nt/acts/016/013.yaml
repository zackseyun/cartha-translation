  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: de
  text: Am Sabbat gingen wir vor das Tor hinaus an einen Fluss, wo wir eine Gebetsstätte vermuteten.[a] Wir setzten uns und sprachen mit den Frauen, die dort zusammengekommen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „... wo wir Gebet vermuteten.“ Das griechische Wort kann sowohl das Gebet selbst als auch einen dafür bestimmten Ort bezeichnen; der Zusammenhang spricht hier eher für „Gebetsstätte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: Am Sabbat
  rationale: Die Wendung bezeichnet idiomatisch den Sabbattag. „Am Sabbat“ ist im Deutschen natürlich und präzise.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: gingen wir vor das Tor hinaus
  rationale: Die Formulierung gibt die nach außen gerichtete Bewegung wieder, ohne das im Griechischen nicht ausdrücklich genannte Wort „Stadt“ zu ergänzen.
- source_word: παρὰ ποταμόν
  choice: an einen Fluss
  rationale: παρά mit Akkusativ bezeichnet hier die Bewegung zu einem Ort am Fluss. Der fehlende griechische Artikel spricht im Deutschen eher für „einen Fluss“ als für „den Fluss“.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: Dort, so nahmen wir an, gab es eine Gebetsstätte
  rationale: νομίζω wird als Annahme wiedergegeben. προσευχή kann sowohl das Gebet selbst als auch eine dafür bestimmte Stätte bezeichnen; der örtliche Zusammenhang begünstigt „Gebetsstätte“.
- source_word: καὶ καθίσαντες
  choice: Wir setzten uns und
  rationale: 'Die koordinierte deutsche Formulierung stellt die zeitliche Abfolge des Aoristpartizips natürlich dar: Zuerst setzten sie sich, dann sprachen sie.'
- source_word: ἐλαλοῦμεν
  choice: sprachen
  rationale: Das deutsche Präteritum ist hier eine natürliche Erzählform. Der Zusammenhang beschreibt das einsetzende beziehungsweise andauernde Gespräch, ohne dass eine schwerfällige Verlaufsform nötig ist.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: mit den Frauen, die dort zusammengekommen waren
  rationale: Das Partizip bezeichnet die bereits versammelten Frauen. „Mit“ gibt λαλέω mit Dativ im Deutschen als Gesprächssituation natürlich wieder; „dort“ wird aus dem unmittelbaren Ortszusammenhang ergänzt.
theological_decisions:
- issue: Bedeutung von προσευχή an diesem Ort
  choice: Gebetsstätte
  alternative: Gebet; Synagoge
  rationale: Der Kontext bezeichnet einen Versammlungsort am Fluss, und προσευχή kann im hellenistisch-jüdischen Sprachgebrauch eine Gebetsstätte meinen. „Synagoge“ wäre eine stärkere institutionelle Deutung, als der griechische Wortlaut verlangt; die mögliche abstrakte Bedeutung „Gebet“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax wurde für gute Verständlichkeit in drei Sätze gegliedert. „Gebetsstätte“ ist allgemeinverständlich und vermeidet die nicht ausdrücklich im Ausgangstext stehende institutionelle Bezeichnung „Synagoge“.
