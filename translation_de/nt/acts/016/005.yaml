source:
  edition: SBLGNT
  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: de
  text: So wurden die Gemeinden im Glauben[a] gestärkt und nahmen Tag für Tag an Zahl zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck kann sowohl bedeuten, dass die Gemeinden in dem gemeinsam getragenen christlichen Glauben gefestigt wurden, als auch allgemeiner, dass sie im Vertrauen gestärkt wurden.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: So
  rationale: Die Partikelverbindung leitet eine zusammenfassende Folgerung aus dem vorhergehenden Bericht ein. „So“ stellt diesen Zusammenhang im modernen Deutsch knapp und natürlich her, ohne μέν unnötig eigens wiederzugeben.
- source_word: ἐκκλησίαι
  choice: Gemeinden
  rationale: In diesem Zusammenhang bezeichnet das Wort die örtlichen christlichen Gemeinschaften. „Gemeinden“ ist im Deutschen klarer und idiomatischer als „Versammlungen“.
- source_word: ἐστερεοῦντο
  choice: wurden … gestärkt
  rationale: Der Imperfekt Passiv beschreibt einen fortdauernden Vorgang in der Vergangenheit. Die Formulierung bewahrt sowohl das Passiv als auch den Gedanken zunehmender Festigung.
- source_word: τῇ πίστει
  choice: im Glauben
  rationale: Die Wendung bezeichnet den Bereich, in dem die Gemeinden gestärkt wurden. „Im Glauben“ lässt im Deutschen sowohl den gemeinschaftlich getragenen christlichen Glauben als auch das persönliche Vertrauen anklingen und bewahrt damit die echte Bedeutungsweite.
- source_word: ἐπερίσσευον
  choice: nahmen … zu
  rationale: Der Imperfekt bezeichnet ein fortlaufendes Wachstum. Zusammen mit „an Zahl“ ist „nahmen … zu“ eine natürliche und genaue deutsche Wiedergabe.
- source_word: τῷ ἀριθμῷ
  choice: an Zahl
  rationale: Der Dativ gibt an, in welcher Hinsicht die Gemeinden zunahmen. „An Zahl“ bezeichnet eindeutig ihr zahlenmäßiges Wachstum.
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die distributive Wendung betont, dass sich das Wachstum fortgesetzt und wiederholt vollzog.
theological_decisions:
- issue: Bedeutung von πίστις mit Artikel
  choice: „im Glauben“ als vorrangig gemeinschaftlicher christlicher Glaube, ohne die Bedeutung persönlichen Vertrauens auszuschließen
  alternative: „im Vertrauen“ als stärker subjektive Glaubenshaltung der einzelnen Glaubenden
  rationale: Der Artikel und der Zusammenhang mit den Gemeinden sprechen eher für den gemeinsam getragenen christlichen Glauben. Die deutsche Wendung „im Glauben“ bewahrt jedoch bewusst die mögliche persönliche Dimension, statt die Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der knappen zusammenfassenden Struktur des Griechischen; „Tag für Tag“ bewahrt den fortlaufenden Charakter des berichteten Wachstums.
