source:
  edition: SBLGNT
  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: de
  text: So legten wir von Troas ab und segelten auf direktem Kurs nach Samothrake, am folgenden Tag dann nach Neapolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: legten wir … ab
  rationale: Das Partizip von ἀνάγω bezeichnet im nautischen Zusammenhang das Ablegen beziehungsweise Auslaufen. Die finite deutsche Form fügt sich natürlich in den erzählenden Satz ein.
- source_word: οὖν
  choice: So
  rationale: οὖν führt hier die aus dem vorherigen Geschehen folgende Fortsetzung der Reise ein; „So“ gibt diesen narrativen Anschluss knapp und idiomatisch wieder.
- source_word: ἀπὸ Τρῳάδος
  choice: von Troas
  rationale: Die Präpositionalphrase nennt den Ausgangspunkt; „Troas“ ist die etablierte deutsche Namensform.
- source_word: εὐθυδρομήσαμεν
  choice: segelten auf direktem Kurs
  rationale: Das Verb bezeichnet das Segeln auf geradem beziehungsweise direktem Kurs. Die Wiedergabe bewahrt die nautische und richtungsbezogene Bedeutung in natürlichem Deutsch.
- source_word: εἰς Σαμοθρᾴκην
  choice: nach Samothrake
  rationale: εἰς bezeichnet das Reiseziel; „Samothrake“ ist die gebräuchliche deutsche Form des Ortsnamens.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: am folgenden Tag dann
  rationale: Die temporale Dativfügung bezeichnet den folgenden Tag. „dann“ gibt δέ als Weiterführung und leichten Übergang innerhalb der Reiseroute wieder.
- source_word: εἰς Νέαν Πόλιν
  choice: nach Neapolis
  rationale: Der Ortsname wird entsprechend der etablierten deutschen Form transliteriert und nicht als „Neue Stadt“ übersetzt.
