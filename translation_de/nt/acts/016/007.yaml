id: ACT.16.7
reference: Acts 16:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: de
  text: Als sie aber bis an Mysien[a] gekommen waren, versuchten sie, nach Bithynien zu reisen; doch der Geist Jesu ließ es ihnen nicht zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Nähe von Mysien“ oder „an Mysien entlang“. Die griechische Wendung bezeichnet wahrscheinlich das Erreichen des Grenzgebiets von Mysien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: als sie … gekommen waren
  rationale: Das Aoristpartizip hat hier temporale Funktion und bezeichnet das Eintreffen vor dem anschließenden Reiseversuch.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert eine leichte Weiterführung mit Kontrast zur zuvor berichteten Reiseroute.
- source_word: κατὰ τὴν Μυσίαν
  choice: bis an Mysien
  rationale: κατά mit Akkusativ kann in geografischem Zusammenhang eine Lage an oder entlang einer Region bezeichnen. „Bis an Mysien“ ist natürlich und lässt offen, ob die Reisenden die Grenzgegend erreichten oder an der Region entlangzogen.
- source_word: ἐπείραζον
  choice: versuchten sie
  rationale: Das Imperfekt beschreibt den im Gang befindlichen Versuch, eine andere Route einzuschlagen.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: nach Bithynien zu reisen
  rationale: Die Formulierung gibt die beabsichtigte Bewegung in die Region idiomatisch wieder.
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: ließ es ihnen nicht zu
  rationale: ἐάω bedeutet erlauben oder zulassen; die Wiedergabe vermeidet die stärkere Aussage eines ausdrücklichen Verbots.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: der Geist Jesu
  rationale: Der Genitiv wird unmittelbar bewahrt; die ungewöhnliche christologische Formulierung wird nicht zu „der Heilige Geist“ harmonisiert.
theological_decisions:
- issue: Wiedergabe von τὸ πνεῦμα Ἰησοῦ
  choice: der Geist Jesu
  alternative: der Heilige Geist; der Geist
  rationale: Der griechische Text nennt Jesus ausdrücklich. Diese Formulierung bleibt erhalten, ohne ihre genaue theologische Beziehung über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bis an Mysien“ bewahrt die geografische Unschärfe der Präpositionalwendung; das Semikolon vermeidet eine schwerfällige Reihung und macht den Gegensatz klar.
