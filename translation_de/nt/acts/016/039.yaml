id: ACT.16.39
reference: Acts 16:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: de
  text: Da kamen sie und redeten ihnen beschwichtigend zu[a]. Dann führten sie sie hinaus und baten sie, die Stadt zu verlassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »baten sie eindringlich« beziehungsweise »redeten ihnen gut zu«. Das griechische Verb kann in anderen Zusammenhängen auch »ermutigen« oder »trösten« bedeuten; hier hat es wahrscheinlich einen versöhnlich-beschwichtigenden Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb für »baten« steht im Imperfekt und kann eine fortgesetzte oder wiederholte Bitte ausdrücken: »sie baten sie immer wieder« oder »sie drängten sie«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Da kamen sie
  rationale: Das Aoristpartizip bezeichnet die vorausgehende Handlung der Stadtobersten. Die finite Wiedergabe ist im modernen Deutschen natürlich und wahrt die zeitliche Abfolge.
- source_word: παρεκάλεσαν
  choice: redeten ihnen beschwichtigend zu
  rationale: παρακαλέω hat ein breites Bedeutungsspektrum. Im Zusammenhang suchen die Stadtobersten nach ihrer rechtswidrigen Behandlung von Paulus und Silas offenbar deren Einvernehmen; die Formulierung gibt diesen versöhnlich-beschwichtigenden Sinn wieder, ohne das Verb als seelsorgerliches »trösten« zu verstehen.
- source_word: αὐτούς
  choice: ihnen / sie
  rationale: Das Pronomen bezieht sich auf Paulus und Silas. Die unterschiedlichen deutschen Kasusformen ergeben sich aus der jeweiligen Satzkonstruktion.
- source_word: ἐξαγαγόντες
  choice: Dann führten sie sie hinaus
  rationale: Das Aoristpartizip von ἐξάγω bezeichnet das Hinausführen und setzt die Handlung fort. »Dann« macht die Abfolge idiomatisch deutlich, ohne einen Ausgangsort zu ergänzen, den der griechische Satz nicht ausdrücklich nennt.
- source_word: ἠρώτων
  choice: baten sie
  rationale: ἐρωτάω bezeichnet hier eine höfliche Bitte. Der Imperfekt kann einen andauernden oder wiederholten Vorgang andeuten; diese Nuance wird in einer Fußnote offengehalten.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: die Stadt zu verlassen
  rationale: Die Infinitivfügung nennt den Inhalt der Bitte. »Die Stadt verlassen« ist präzises, natürliches modernes Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die griechischen Partizipien werden zur besseren Lesbarkeit in finite Hauptsätze aufgelöst. Die Mehrdeutigkeit von παρακαλέω und die mögliche Verlaufsnuance des Imperfekts werden durch Fußnoten bewahrt.
