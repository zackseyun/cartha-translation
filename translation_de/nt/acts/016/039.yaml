  source_fidelity: 'Die Übersetzung gibt die Handlungsfolge des griechischen Satzes zuverlässig wieder: Die Stadtobersten kommen, reden Paulus und Silas versöhnlich zu, führen sie hinaus und bitten sie, die Stadt zu verlassen. »Beschwichtigend zureden« ist im gegebenen Kontext eine angemessene deutsche Wiedergabe von παρεκάλεσαν, ohne die lexikalische Breite des Verbs zu leugnen. Der Imperfekt ἠρώτων ist zutreffend durch die Fußnote berücksichtigt.'
  naturalness: Der Text ist flüssiges, modernes Standarddeutsch. Die Auflösung der griechischen Partizipien in Hauptsätze ist idiomatisch und erhält die zeitliche Abfolge. »Da kamen sie« und »Dann führten sie sie hinaus« sind im erzählerischen Kontext klar und natürlich.
