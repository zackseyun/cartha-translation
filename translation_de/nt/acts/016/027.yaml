id: ACT.16.27
reference: Acts 16:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: de
  text: Als der Gefängniswärter aufwachte und sah, dass die Gefängnistüren offen standen[a], zog er sein Schwert[b] und war im Begriff, sich zu töten, weil er annahm, die Gefangenen seien entflohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sah, dass die Gefängnistüren geöffnet waren“. Das griechische Perfektpartizip betont ihren geöffneten Zustand.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort μάχαιρα kann ein Schwert oder eine kürzere Klingenwaffe wie einen Dolch bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: aufwachte
  rationale: Die Verbindung bezeichnet idiomatisch den Übergang in den wachen Zustand; „aufwachte“ ist im modernen Deutsch natürlich und gibt den ingressiven Sinn wieder.
- source_word: δεσμοφύλαξ
  choice: Gefängniswärter
  rationale: Gemeint ist der für die Gefangenen zuständige Amtsträger; „Gefängniswärter“ ist präziser als das allgemeinere „Wächter“.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: sah, dass die Gefängnistüren offen standen
  rationale: Das Perfektpartizip ἀνεῳγμένας hebt den fortbestehenden geöffneten Zustand hervor. „Offen standen“ gibt diesen Ergebniszustand idiomatisch wieder.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: zog er sein Schwert
  rationale: σπάομαι bezeichnet hier das Ziehen einer Waffe. μάχαιρα kann ein Schwert oder eine kürzere Klingenwaffe meinen; „Schwert“ ist die geläufige kontextuelle Wiedergabe.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: wollte sich gerade töten
  rationale: Die Formulierung vermittelt die unmittelbar bevorstehende Handlung; „wollte sich gerade töten“ verbindet Absicht und zeitliche Unmittelbarkeit in natürlichem Deutsch.
- source_word: νομίζων
  choice: weil er annahm
  rationale: Das Partizip nennt den Grund für sein Handeln und bezeichnet eine Schlussfolgerung, nicht gesichertes Wissen.
- source_word: ἐκπεφευγέναι
  choice: seien entflohen
  rationale: Der Perfektinfinitiv bezeichnet die als bereits vollzogen angenommene Flucht. Der Konjunktiv I passt zur indirekten Wiedergabe seiner Annahme.
- source_word: τοὺς δεσμίους
  choice: die Gefangenen
  rationale: Im Kontext sind damit die inhaftierten Personen gemeint; „Gefangenen“ ist klar und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nahe am griechischen Ablauf; die Partizipialkonstruktion νομίζων wird zur Verdeutlichung des Begründungszusammenhangs als Nebensatz wiedergegeben.
