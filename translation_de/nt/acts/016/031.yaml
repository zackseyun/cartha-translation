  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: de
  text: 'Sie antworteten: „Glaube an den Herrn Jesus, und du wirst gerettet werden – du und dein Haus[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Haus“ sind hier die Menschen seines Haushalts gemeint, nicht das Gebäude.
    reason: Kultur- und Bedeutungsnotiz zu οἶκος.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Sie antworteten
  rationale: Im unmittelbaren Dialog gibt εἶπαν die Reaktion auf die vorausgehende Frage wieder. „Sie antworteten“ ist im Deutschen natürlich; das schwach verbindende δέ muss dabei nicht eigens mit „und“ oder „aber“ wiedergegeben werden.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: Glaube an
  rationale: Der Aoristimperativ fordert zu einer entschiedenen Reaktion auf. Bei πιστεύω mit ἐπί und Akkusativ bezeichnet die Präpositionalfügung die Person, auf die sich der Glaube richtet; „an … glauben“ ist dafür die natürliche deutsche Wendung.
- source_word: κύριον Ἰησοῦν
  choice: den Herrn Jesus
  rationale: „Herr“ bewahrt sowohl den ehrenden Titel als auch dessen christologisches Gewicht; der Personenname wird nach üblicher deutscher Form als „Jesus“ wiedergegeben.
- source_word: σωθήσῃ
  choice: wirst du gerettet werden
  rationale: Das Futur Passiv von σῴζω wird im evangelistischen Zusammenhang mit „gerettet werden“ wiedergegeben. Die Form bewahrt den passiven Charakter und engt die Rettung nicht auf bloß zeitliche Befreiung ein.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: du und dein Haus
  rationale: οἶκος kann hier die zum Haus gehörende Personen- und Lebensgemeinschaft bezeichnen. „Dein Haus“ bewahrt die knappe biblische Ausdrucksweise und die genuine Spannung über die Reichweite der Verheißung; eine Fußnote verhindert das Missverständnis, es gehe um das Gebäude.
theological_decisions:
- issue: Reichweite der Verheißung für „dich und dein Haus“
  choice: Die Aussage wird unverändert auf den Gefängnisaufseher und sein Haus bezogen, ohne den Heilsmodus der einzelnen Angehörigen aus diesem Vers abzuleiten.
  alternative: Entweder eine automatische Rettung des ganzen Hauses allein aufgrund seines Glaubens ausdrücken oder den Bezug auf das Haus abschwächen.
  rationale: Der griechische Wortlaut schließt das Haus ausdrücklich in die Verheißung ein, erklärt in diesem Vers aber nicht, dass die Angehörigen unabhängig von eigener Glaubensantwort gerettet würden. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dann“ gibt die Folgerung des mit καί verbundenen Hauptsatzes idiomatisch wieder, ohne eine zusätzliche theologische Bedingung einzuführen. Der Gedankenstrich hebt die nachgestellte ausdrückliche Einbeziehung des Hauses hervor.
