  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: de
  text: Dann führte er sie hinauf in sein Haus, setzte ihnen eine Mahlzeit vor und jubelte mit seiner ganzen Hausgemeinschaft[a], nachdem er zum Glauben an Gott gekommen war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem ganzen Haus“. Gemeint ist die gesamte Hausgemeinschaft. Die griechische Formulierung kann die Freude des Gefängnisaufsehers mit seiner Hausgemeinschaft bezeichnen; manche verstehen sie auch als Hinweis darauf, dass die Hausgemeinschaft an der Freude teilhatte.'
    reason: lexical_clarification
  - marker: b
    text: Das griechische Partizip steht im Singular und bezieht sich unmittelbar auf den Gefängnisaufseher. Der Satz kann im Zusammenhang nahelegen, dass seine Hausgemeinschaft auch am Glauben teilhatte, sagt dies in diesem Satz aber nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: Dann führte er sie hinauf
  rationale: Das Aoristpartizip bezeichnet hier die räumliche Bewegung aus dem Gefängnis hinauf und zugleich die zeitliche Abfolge; die finite Form ist im Deutschen natürlich.
- source_word: εἰς τὸν οἶκον
  choice: ins Haus
  rationale: Die Wendung meint im Kontext das Haus des Gefängnisaufsehers. „Ins Haus“ bleibt nah am bestimmten griechischen Ausdruck, ohne den Besitz ausdrücklich zu ergänzen.
- source_word: παρέθηκεν τράπεζαν
  choice: setzte ihnen eine Mahlzeit vor
  rationale: Die griechische Wendung lautet wörtlich „stellte einen Tisch hin“, bezeichnet hier aber idiomatisch das Bereitstellen einer Mahlzeit.
- source_word: ἠγαλλιάσατο
  choice: freute sich … von Herzen
  rationale: Das Verb bezeichnet starke, überschwängliche Freude. Diese Formulierung ist gegenwärtig und würdig, ohne altertümlich zu wirken.
- source_word: πανοικεὶ
  choice: mit seinem ganzen Haus
  rationale: Das Adverb umfasst die gesamte Hausgemeinschaft. „Haus“ bewahrt den damaligen weiteren Sinn besser als das engere „Familie“.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: nachdem er zum Glauben an Gott gekommen war
  rationale: Das Perfektpartizip bezeichnet einen eingetretenen Glauben mit fortdauerndem Ergebnis. Die temporale Wiedergabe wahrt die partizipiale Beziehung, ohne die im Griechischen nicht ausdrücklich markierte Kausalität festzuschreiben.
theological_decisions:
- issue: Bezug von πανοικεὶ und Umfang des Glaubens
  choice: Der Gefängnisaufseher freut sich mit seiner ganzen Hausgemeinschaft; das maskuline Singularpartizip beschreibt zunächst ihn als denjenigen, der zum Glauben gekommen war.
  alternative: Die gesamte Hausgemeinschaft freute sich und hatte gemeinsam an Gott geglaubt.
  rationale: πανοικεὶ steht am natürlichsten bei ἠγαλλιάσατο, während πεπιστευκώς im maskulinen Singular grammatisch auf den Gefängnisaufseher zurückweist. Der weitere Zusammenhang kann eine Beteiligung des Hauses nahelegen, doch dieser Satz allein formuliert den gemeinsamen Glauben nicht eindeutig.
- issue: Semantische Beziehung des Partizips πεπιστευκώς zum Hauptverb
  choice: 'temporal bzw. begleitend: „nachdem er … gekommen war“'
  alternative: 'kausal: „weil er an Gott gläubig geworden war“'
  rationale: Das Partizip kann den Grund der Freude nahelegen, markiert die kausale Beziehung aber nicht ausdrücklich. Die Hauptfassung vermeidet daher eine unnötige Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Haus“ erhält die antike soziale Weite der Hausgemeinschaft; „von Herzen“ gibt die Intensität des Freudenverbs idiomatisch wieder.
