  rationale: Die Übersetzung wird bei der Bezeichnung des Mannes enger am griechischen Μακεδών ausgerichtet. Die Fußnote zu Διαβάς wird korrigiert, damit sie keine zeitliche Abfolge behauptet, die der griechische Partizipgebrauch nicht zwingend ausdrückt. Der Fußnotenanker wird unmittelbar an »herüber« gesetzt, das die betreffende Verbform wiedergibt.
