  source_fidelity: 'Der Entwurf gibt den Sinn des Verses insgesamt zuverlässig wieder: Die Vision erscheint Paulus nachts, der Mann ist als stehend und eindringlich bittend geschildert, und der Aufruf zur Hilfe bleibt direkt. »Mann aus Mazedonien« ist jedoch gegenüber Μακεδών etwas weniger präzise, da das Wort primär die mazedonische Zugehörigkeit benennt, nicht bloß die Herkunft bzw. den Aufenthaltsort. Die Fußnote zu Διαβάς macht aus dem Partizip zudem unnötig eine zeitlich abgeschlossene Vorbedingung (»Nachdem ...«).'
  naturalness: Die Formulierung ist modernes, gut verständliches Standarddeutsch. »Paulus erschien eine Vision« und »stand da« sind idiomatisch. »Ein mazedonischer Mann« ist zwar etwas formeller als »ein Mazedonier«, bewahrt aber die ausdrückliche Bezeichnung als Mann und bleibt im erzählerischen Register natürlich.
  terminology: »Vision«, »Mazedonier«, »bat ihn eindringlich« und »hilf uns« sind angemessene und theologisch nicht überdeutende Wiedergaben. Die Formulierung zur Vision legt weder Traum noch objektive Erscheinung fest.
