id: ACT.16.9
reference: Acts 16:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: de
  text: 'In der Nacht[a] erschien Paulus eine Vision: Ein mazedonischer Mann[b] stand da, bat ihn eindringlich und sagte: »Komm herüber[c] nach Mazedonien und hilf uns!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »während der Nacht« oder »bei Nacht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »ein Mann aus Mazedonien«. Das Griechische bezeichnet ihn als Mazedonier.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Hinübergehend nach Mazedonien, hilf uns.« Das griechische Partizip ist mit der Aufforderung verbunden; »Komm herüber« gibt seine idiomatische Funktion im Deutschen wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: Vision
  rationale: Die übliche Bezeichnung für eine offenbarende Schau; sie entspricht dem Sprachgebrauch der Apostelgeschichte, ohne die genaue Art des Erlebnisses näher festzulegen.
- source_word: διὰ νυκτός
  choice: in der Nacht
  rationale: Die Wendung bezeichnet den Zeitpunkt des Geschehens. »In der Nacht« ist im modernen Deutschen natürlich und genau.
- source_word: τῷ Παύλῳ ὤφθη
  choice: erschien Paulus
  rationale: Der passive Aorist von ὁράω mit Dativ wird idiomatisch als ein Erscheinen gegenüber Paulus wiedergegeben; so bleibt der offenbarende Charakter erhalten.
- source_word: ἀνὴρ Μακεδών τις
  choice: ein Mann aus Mazedonien
  rationale: ἀνήρ bezeichnet hier einen Mann; Μακεδών kennzeichnet ihn als Mazedonier. Der unbestimmte Artikel gibt τις im Deutschen natürlich wieder, ohne das schwerfällige »ein gewisser« zu erzwingen.
- source_word: ἑστώς
  choice: stand da
  rationale: Die Form beschreibt die Haltung des Mannes innerhalb der Vision. »Stand da« zeichnet die Szene knapp und natürlich.
- source_word: παρακαλῶν αὐτόν
  choice: bat ihn eindringlich
  rationale: Im Zusammenhang einer Bitte um Hilfe bezeichnet παρακαλέω einen dringenden Appell. Die Wiedergabe wahrt den Ernst, ohne die stärkere Nuance von »anflehen« festzuschreiben.
- source_word: λέγων
  choice: und sagte
  rationale: Das Partizip führt die direkte Rede ein und lässt sich im Deutschen natürlich als finite Verbform wiedergeben.
- source_word: Διαβάς
  choice: Komm herüber
  rationale: Das Aoristpartizip ist eng mit dem Imperativ verbunden und bezeichnet die vorausgehende Bewegung nach Mazedonien. Die idiomatische deutsche Aufforderung »Komm herüber« vermittelt diese Kraft klar.
- source_word: εἰς Μακεδονίαν
  choice: nach Mazedonien
  rationale: Bei Ländernamen ohne Artikel ist »nach« die natürliche deutsche Wiedergabe einer gerichteten Bewegung, auch wenn εἰς wörtlich eine Bewegung hinein bezeichnet.
- source_word: βοήθησον ἡμῖν
  choice: hilf uns
  rationale: Die unmittelbare Aufforderung zur Hilfe wird schlicht, prägnant und bedeutungsgleich wiedergegeben.
theological_decisions:
- issue: Art des durch ὅραμα und ὤφθη bezeichneten Erlebnisses
  choice: Als Vision wiedergeben, die Paulus erschien, ohne ihre genaue Erscheinungsweise zu bestimmen.
  alternative: Traum, innerer Eindruck oder objektive Erscheinung
  rationale: Der Text nennt das Erlebnis ausdrücklich eine Vision, erklärt aber nicht, ob Paulus schlief oder auf welche Weise er sie wahrnahm. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bewahrt die szenische Abfolge des griechischen Textes; idiomatische deutsche Formulierungen vermeiden unnötige Wörtlichkeit.
