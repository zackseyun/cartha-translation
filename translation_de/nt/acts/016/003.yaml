id: ACT.16.3
reference: Acts 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: de
  text: Paulus wollte, dass Timotheus mit ihm auf die Reise ging[a]. Er nahm ihn mit und beschnitt ihn wegen der Juden in jenen Gegenden[b]; denn sie alle wussten, dass sein Vater ein Grieche war[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit ihm hinausging“; gemeint sein kann, dass Timotheus mit Paulus aufbrach oder ihn auf seiner Reise begleitete.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „um der Juden willen“ oder „aufgrund der Juden“.'
    reason: lexical_alternative
  - marker: c
    text: „Grieche“ kann in diesem jüdischen Zusammenhang hervorheben, dass Timotheus’ Vater kein Jude war.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: Timotheus
  rationale: Das Demonstrativpronomen verweist auf Timotheus aus dem unmittelbaren Kontext. Die Wiederaufnahme des Namens ist im Deutschen klar und natürlich.
- source_word: ἠθέλησεν
  choice: wollte
  rationale: Gibt die Absicht beziehungsweise den Wunsch des Paulus ohne zusätzliche Bedeutungsnuance wieder.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: dass Timotheus mit ihm auf die Reise ging
  rationale: ἐξέρχομαι bedeutet wörtlich „hinausgehen“, bezeichnet hier aber idiomatisch das Aufbrechen zu einer Reise. Die Formulierung ist in modernem Deutsch natürlich.
- source_word: λαβὼν
  choice: Er nahm ihn zu sich
  rationale: Das vorzeitige Aoristpartizip wird als anschließende Handlung wiedergegeben. „Zu sich nehmen“ drückt hier aus, dass Paulus Timotheus als Begleiter annahm, ohne mehr zu behaupten.
- source_word: περιέτεμεν
  choice: beschnitt ihn
  rationale: Direkte und sachliche Wiedergabe von περιτέμνω.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: wegen der Juden
  rationale: διά mit Akkusativ bezeichnet hier Grund oder Beweggrund; „wegen“ bewahrt diese Offenheit.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: in jenen Gegenden
  rationale: Natürliche deutsche Verdichtung des attributiven Partizips; τόποι kann hier mehrere Orte beziehungsweise das betreffende Gebiet bezeichnen.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: denn sie alle wussten
  rationale: „Denn“ erhält die erklärende Funktion von γάρ, während „sie alle“ die umfassende Aussage von ἅπαντες bewahrt.
- source_word: Ἕλλην
  choice: ein Grieche
  rationale: Formale Wiedergabe der ethnisch-kulturellen Bezeichnung; die mögliche kontextuelle Bedeutung „Nichtjude“ wird in einer Fußnote erläutert.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: sein Vater ... war
  rationale: Im Kontext ist die einfache Kopula die natürlichste Wiedergabe von ὑπάρχω.
theological_decisions:
- issue: Grund für die Beschneidung des Timotheus
  choice: Die Beschneidung wird als Handlung wegen der örtlichen Juden und ihres Wissens um die Herkunft des Vaters dargestellt.
  alternative: Die Handlung ausdrücklich als Heilsnotwendigkeit oder ausschließlich als missionarische Strategie deuten.
  rationale: Der Vers nennt den konkreten Beweggrund, zieht daraus aber selbst keine umfassende lehrmäßige Schlussfolgerung. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Name Timotheus wird zur eindeutigen Bezugnahme aus dem unmittelbaren Kontext eingesetzt; die idiomatische Reisebedeutung wird im Text natürlich wiedergegeben und in der Fußnote formal abgesichert.
