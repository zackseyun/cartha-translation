base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: de
  text: Plötzlich ereignete sich ein großes Erdbeben, sodass die Fundamente des Gefängnisses erschüttert wurden. Sofort wurden alle Türen geöffnet, und die Fesseln aller lösten sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Fesseln aller wurden gelöst.“ Das Griechische δεσμά kann „Fesseln“ oder „Bande“ bedeuten; ἀνέθη kann mit „lösten sich“ oder „wurden gelöst“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: Plötzlich
  rationale: Gibt die unvermittelte, überraschende Einsetzung des Ereignisses natürlich und präzise wieder.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: ereignete sich ein starkes Erdbeben
  rationale: Die deutsche Wendung ist idiomatisch; „stark“ gibt μέγας im Zusammenhang mit einem Erdbeben natürlicher wieder als das wörtliche „groß“.
- source_word: ὥστε σαλευθῆναι
  choice: sodass … erschüttert wurden
  rationale: Bewahrt die von ὥστε bezeichnete Folge und die passive Form von σαλευθῆναι.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: die Grundmauern des Gefängnisses
  rationale: „Grundmauern“ bezeichnet im Deutschen anschaulich die tragenden Fundamente; „Gefängnis“ ist die allgemein verständliche Entsprechung für δεσμωτήριον.
- source_word: ἠνεῴχθησαν … αἱ θύραι πᾶσαι
  choice: alle Türen öffneten sich
  rationale: Das mediale deutsche „öffneten sich“ gibt das Geschehen natürlich wieder, ohne einen menschlichen Handelnden einzuführen.
- source_word: παραχρῆμα
  choice: Sofort
  rationale: Drückt den unmittelbaren Eintritt des folgenden Geschehens klar aus.
- source_word: πάντων
  choice: aller Gefangenen
  rationale: Das im Kontext naheliegende Bezugswort wird zur Klarheit ergänzt; gemeint sind die im Gefängnis Festgehaltenen.
- source_word: τὰ δεσμὰ
  choice: die Fesseln
  rationale: „Fesseln“ deckt den allgemeineren Sinn von δεσμά ab, ohne das Material oder die genaue Art der Vorrichtung festzulegen.
- source_word: ἀνέθη
  choice: lösten sich
  rationale: Gibt das Lockern beziehungsweise Lösen der Fesseln idiomatisch wieder und vermeidet die weitergehende Aussage, die Gefangenen seien bereits freigelassen worden.
