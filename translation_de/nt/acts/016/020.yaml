  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: de
  text: 'Nachdem sie sie vor die Magistrate[a] geführt hatten, sagten sie: »Diese Männer, die Juden[b] sind, bringen unsere Stadt in Aufruhr.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Prätoren«. Gemeint sind die leitenden römischen Amtsträger der Kolonie Philippi.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »Judäer«. Der griechische Ausdruck kann Juden allgemein oder Menschen aus Judäa bezeichnen; hier passt die ethnisch-religiöse Bezeichnung »Juden« am besten zur Anschuldigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: Sie führten sie vor
  rationale: Das Aoristpartizip bezeichnet eine der Hauptaussage vorausgehende Handlung. Die koordinierte deutsche Form ist natürlich und bewahrt die zeitliche Abfolge.
- source_word: στρατηγοῖς
  choice: Stadtobersten
  rationale: In der römischen Kolonie Philippi bezeichnet der Ausdruck die leitenden städtischen Amtsträger. »Stadtoberste« ist verständlich und historisch hinreichend präzise; die technische Amtsbezeichnung steht in der Fußnote.
- source_word: ἐκταράσσουσιν
  choice: bringen … in Aufruhr
  rationale: Das Verb bezeichnet ein starkes Beunruhigen oder Aufwühlen und wird hier als gegenwärtige Anschuldigung formuliert.
- source_word: ἡμῶν τὴν πόλιν
  choice: unsere Stadt
  rationale: Die possessive Form gibt die rhetorische Betonung der städtischen Zugehörigkeit natürlich wieder.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Diese Männer
  rationale: Der maskuline Plural bezieht sich konkret auf Paulus und Silas.
- source_word: Ἰουδαῖοι
  choice: Juden
  rationale: Im Kontext dient der Begriff als ethnisch-religiöse Kennzeichnung im Gegensatz zur römischen Bürgerschaft Philippis. »Judäer« bleibt lexikalisch möglich und wird in der Fußnote genannt.
- source_word: ὑπάρχοντες
  choice: Sie sind
  rationale: Die eigenständige Satzform bewahrt den Umstand beziehungsweise möglichen Grund der Anklage, ohne die logische Beziehung ausdrücklich als kausal festzulegen.
theological_decisions:
- issue: Wiedergabe von Ἰουδαῖοι innerhalb einer feindseligen ethnisch-religiösen Anschuldigung
  choice: Juden
  alternative: Judäer
  rationale: Im Diasporakontext von Philippi ist die ethnisch-religiöse Bedeutung am wahrscheinlichsten. Die Aussage wird den Anklägern zugeschrieben und nicht als Urteil des Erzählers dargestellt.
- issue: Logische Funktion von ὑπάρχοντες
  choice: 'Parataktisch: »Sie sind Juden«'
  alternative: 'Kausal: »weil sie Juden sind«'
  rationale: Das Partizip kann einen begleitenden Umstand oder den Grund der Anklage andeuten. Eine eigenständige Aussage erhält diese Spannung, statt die Kausalität ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Stadtoberste« vermeidet den heute teils richterlich verstandenen Ausdruck »Magistrate«. Die direkte Rede bleibt knapp und anklagend; die Aufteilung in zwei Sätze bewahrt die Mehrdeutigkeit des Partizips ὑπάρχοντες.
