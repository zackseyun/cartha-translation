  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: de
  text: Sie zogen durch das Gebiet von Phrygien und Galatien[b], vom Heiligen Geist daran gehindert, das Wort in Asia[a] zu verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die römische Provinz Asia im Westen Kleinasiens, nicht der heutige Kontinent Asien.
    reason: cultural_note
  - marker: b
    text: 'Möglicherweise auch: „durch das phrygische und galatische Gebiet“. Die griechische Formulierung kann als einheitliche regionale Bezeichnung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: sie zogen durch
  rationale: Das Aoristverb διέρχομαι bezeichnet die Bewegung durch ein Gebiet. „Sie zogen durch“ ist im Deutschen natürlich und bewahrt den räumlichen Sinn.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches Bindewort zur Fortführung der Erzählung. Im modernen Deutschen ergibt sich der Anschluss aus dem Zusammenhang; ein ausdrückliches „und“ oder „dann“ wäre nicht erforderlich.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: das Gebiet von Phrygien und Galatien
  rationale: χώρα bedeutet „Gebiet“ oder „Landstrich“. Die Formulierung bleibt gut verständlich, während eine Fußnote die mögliche Deutung als einheitliche regionale Bezeichnung festhält.
- source_word: κωλυθέντες
  choice: nachdem … ihnen verwehrt hatte
  rationale: Das passive Aoristpartizip von κωλύω bezeichnet hier eine vorausgehende oder begleitende Verhinderung. Die deutsche Formulierung gibt die Untersagung klar wieder, ohne den Vorgang näher auszugestalten.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: der Heilige Geist
  rationale: Die Konstruktion mit ὑπό bezeichnet den Heiligen Geist als handelnde Instanz. Die Umformung ins deutsche Aktiv ist natürlich und erhält diese Aussage.
- source_word: λαλῆσαι
  choice: zu verkünden
  rationale: λαλέω bedeutet grundsätzlich „sprechen“. In Verbindung mit „dem Wort“ bezeichnet es hier dessen öffentliche Weitergabe; „verkünden“ ist dafür idiomatisches, würdevolles Deutsch.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: „Das Wort“ bewahrt den in Lukas und der Apostelgeschichte geläufigen Ausdruck für die christliche Botschaft, ohne ihn ausdrücklich zu „Evangelium“ zu verengen.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: in Asia
  rationale: Ἀσία bezeichnet hier die römische Provinz Asia. Der historische Eigenname „Asia“ vermeidet die Verwechslung mit dem modernen Kontinent „Asien“; eine Fußnote erläutert den Bezug.
theological_decisions:
- issue: Handlungsträgerschaft des Geistes bei der Untersagung
  choice: der Heilige Geist hatte ihnen verwehrt
  alternative: der Geist hatte sie gehindert
  rationale: τοῦ ἁγίου πνεύματος bezeichnet im Sprachgebrauch von Lukas und der Apostelgeschichte den Heiligen Geist. Die Formulierung bewahrt seine ausdrückliche Handlungsträgerschaft, ohne über den Text hinaus zu erklären, auf welche Weise die Weisung erging.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevollem Erzählton. „Asia“ wird als historischer Provinzname beibehalten und erläutert. Die geografische Mehrdeutigkeit der griechischen Konstruktion wird nicht stillschweigend aufgelöst.
