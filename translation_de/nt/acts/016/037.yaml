revisions:
- from: 'Paulus aber sagte zu ihnen: »Sie haben uns öffentlich geschlagen und ohne Urteil ins Gefängnis geworfen, obwohl wir römische Bürger sind. Und jetzt wollen sie uns heimlich fortschicken? Auf keinen Fall! Sie sollen selbst kommen und uns hinausführen.[a]«'
  to: 'Paulus aber sagte zu ihnen: »Sie haben uns ohne Urteil öffentlich geschlagen und ins Gefängnis geworfen, obwohl wir römische Bürger sind. Und jetzt schicken sie uns heimlich fort? Auf keinen Fall! Sie sollen selbst kommen und uns hinausführen.[a]«'
  rationale: Die Revision verdeutlicht den syntaktischen Geltungsbereich von ἀκατακρίτους über beide vorangehenden Misshandlungen hinweg und gibt ἐκβάλλουσιν ohne abschwächende Modalität als aktuelle beabsichtigte Handlung wieder. Bedeutung, Register, rechtliche Ambiguität und Fußnotenstruktur bleiben erhalten.
