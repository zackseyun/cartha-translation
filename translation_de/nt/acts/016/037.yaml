review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge der Misshandlung, des Einsperrens und der beabsichtigten heimlichen Entlassung sowie den Nachdruck von οὐ γάρ und αὐτοί zuverlässig wieder. »Römische Bürger« trifft die rechtlich relevante Bedeutung von Ῥωμαίους angemessen. Die Stellung von »ohne Urteil« kann jedoch im Deutschen den Eindruck erwecken, sie beziehe sich nur auf das Einsperren, während ἀκατακρίτους Paulus und Silas als nicht verurteilte Personen bei der gesamten beschriebenen Behandlung kennzeichnet. Außerdem ist »schicken ... fort« als Wiedergabe des präsentischen ἐκβάλλουσιν unmittelbarer als »wollen ... fortschicken«.
  naturalness: Die Sprache ist modern, klar und der empörten Rede angemessen. Die Umstellung zu »uns ohne Urteil öffentlich geschlagen und ins Gefängnis geworfen« macht den Satzfluss und den Bezug von »ohne Urteil« eindeutiger. »Und jetzt schicken sie uns heimlich fort?« ist idiomatisch und bewahrt die rhetorische Gegenwartsfrage.
  terminology: »ohne Urteil« ist als knappe rechtliche Formulierung vertretbar und vermeidet die weitergehende Behauptung, es habe keinerlei Verfahren gegeben. »römische Bürger«, »Gefängnis«, »heimlich«, »Auf keinen Fall« und »hinausführen« sind treffend. Die vorhandene Fußnote zu ἐξαγαγέτωσαν ist korrekt verankert und bietet sinnvolle Alternativen.
  issues:
  - severity: low
    issue: Bezug von »ohne Urteil«
    rationale: In der vorliegenden Wortstellung liegt »ohne Urteil« unmittelbar bei »ins Gefängnis geworfen« und kann daher zu eng nur auf diese Handlung bezogen werden. Eine Voranstellung bei beiden Prädikaten bildet ἀκατακρίτους als Prädikativ zu »uns« klarer ab.
  - severity: low
    issue: »wollen sie uns heimlich fortschicken« für ἐκβάλλουσιν
    rationale: Die Modalform »wollen« kann eine bloße Absicht ausdrücken. Das griechische Präsens in der empörten Frage bezeichnet das gegenwärtig veranlasste Vorgehen; »schicken sie uns ... fort« ist direkter, ohne die Nuance der Entlassung zu verlieren.
