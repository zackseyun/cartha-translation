source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: de
  text: 'Paulus aber sagte zu ihnen: »Sie haben uns ohne Urteil öffentlich geschlagen und ins Gefängnis geworfen, obwohl wir römische Bürger sind. Und jetzt schicken sie uns heimlich fort? Auf keinen Fall! Sie sollen selbst kommen und uns hinausführen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hinausbringen« beziehungsweise »hinausbegleiten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: sagte
  rationale: Das einfache Präteritum entspricht dem üblichen deutschen Erzählstil.
- source_word: Δείραντες
  choice: sie haben uns ... geschlagen
  rationale: Das Aoristpartizip bezeichnet die dem Einsperren vorausgehende Misshandlung; »geschlagen« wahrt die Breite des Verbs, ohne eine bestimmte Art der Auspeitschung festzulegen.
- source_word: δημοσίᾳ
  choice: öffentlich
  rationale: Direkte und natürliche Wiedergabe des adverbialen Sinnes.
- source_word: ἀκατακρίτους
  choice: ohne Urteil
  rationale: Das Wort bezeichnet Personen, über die kein verurteilendes Gerichtsurteil ergangen ist. »Ohne Urteil« bewahrt diesen präzisen rechtlichen Sinn besser als das weiter deutende »ohne Gerichtsverfahren«.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: obwohl wir römische Bürger sind
  rationale: Die Wendung hebt ihren rechtlichen Status als Römer hervor. Der konzessive Nebensatz gibt die sachliche Spannung im Deutschen natürlich wieder.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: ins Gefängnis geworfen
  rationale: »Geworfen« erhält die Härte von βάλλω.
- source_word: λάθρᾳ
  choice: heimlich
  rationale: Gibt das verdeckte, der Öffentlichkeit entzogene Vorgehen idiomatisch wieder.
- source_word: ἐκβάλλουσιν
  choice: wollen sie uns ... fortschicken
  rationale: Der Kontext verlangt keine gewaltsame Vertreibung; die deutsche Wendung bringt zugleich die eigenmächtige Entlassung zum Ausdruck.
- source_word: οὐ γάρ
  choice: Auf keinen Fall!
  rationale: Natürliche, nachdrückliche deutsche Zurückweisung.
- source_word: ἐλθόντες αὐτοὶ
  choice: Sie sollen selbst kommen
  rationale: '»Selbst« bewahrt die Betonung des Pronomens αὐτοί: Die verantwortlichen Amtsträger sollen persönlich erscheinen.'
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: uns hinausführen
  rationale: Formnahe und idiomatische Wiedergabe; auch »hinausbringen« ist lexikalisch möglich.
theological_decisions:
- issue: Rechtlich-politische Bedeutung von Ῥωμαίους
  choice: römische Bürger
  alternative: Römer
  rationale: Im Zusammenhang beruft sich Paulus auf den mit dem römischen Bürgerrecht verbundenen Rechtsschutz. »Römische Bürger« macht diese kontextuell zentrale Bedeutung deutlich.
- issue: Bedeutung von ἀκατακρίτους
  choice: ohne Urteil
  alternative: ohne verurteilt worden zu sein; ohne Gerichtsverfahren
  rationale: »Ohne Urteil« wahrt die Aussage, dass keine gerichtliche Verurteilung vorlag, ohne ausdrücklich zu behaupten, dass überhaupt kein Verfahren stattgefunden hatte.
translation_notes:
  register: Moderne, würdige Standardsprache mit deutlich hörbarer Empörung. Die direkte Rede bleibt knapp und rechtlich präzise; »Auf keinen Fall!« trägt die Schärfe der Zurückweisung, ohne umgangssprachlich zu wirken.
