id: ACT.16.10
reference: Acts 16:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: de
  text: Nachdem er die Vision gesehen hatte, bemühten wir uns sofort, nach Mazedonien aufzubrechen, denn wir schlossen daraus, dass Gott uns gerufen hatte, ihnen die gute Nachricht zu verkünden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nachdem
  rationale: 'Leitet einen zeitlichen Folgesatz ein und gibt den Ablauf natürlich wieder: zuerst die Vision, danach die gemeinsame Reaktion.'
- source_word: τὸ ὅραμα
  choice: die Vision
  rationale: Gängige und kontextgenaue Wiedergabe einer offenbarenden Schau.
- source_word: εὐθέως
  choice: sofort
  rationale: Bewahrt die im Adverb ausgedrückte Unverzüglichkeit in klarem modernem Deutsch.
- source_word: ἐζητήσαμεν
  choice: bemühten wir uns
  rationale: ζητέω bezeichnet hier das entschlossene Bestreben, die Reise anzutreten; „bemühten uns“ ist idiomatischer als das wörtliche „suchten“.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: nach Mazedonien aufzubrechen
  rationale: Gibt sowohl den Aufbruch als auch das Reiseziel natürlich wieder, ohne die griechische Bewegungsrichtung unnötig wörtlich nachzubilden.
- source_word: συμβιβάζοντες
  choice: denn wir schlossen daraus
  rationale: Das Partizip bezeichnet das gedankliche Zusammenfügen von Anzeichen zu einer Schlussfolgerung; „daraus“ bezieht sich auf die Vision.
- source_word: προσκέκληται
  choice: gerufen hatte
  rationale: Bewahrt den Gedanken eines vorausgegangenen göttlichen Rufes mit fortdauernder Bedeutung; das Plusquamperfekt passt zur deutschen Erzählfolge.
- source_word: εὐαγγελίσασθαι
  choice: die gute Nachricht zu verkünden
  rationale: Gibt die verbale Bedeutung verständlich und würdig wieder, ohne kirchlichen Fachwortschatz vorauszusetzen.
- source_word: αὐτούς
  choice: ihnen
  rationale: Natürliche deutsche Ergänzung zu „die gute Nachricht verkünden“ und klarer Rückbezug auf die Menschen in Mazedonien.
theological_decisions:
- issue: Wechsel zur ersten Person Plural
  choice: „bemühten wir uns“
  alternative: Eine unpersönliche Umschreibung
  rationale: Das ausdrückliche ἡμεῖς-Signal der Verbform wird bewahrt, ohne daraus eine weitergehende Theorie zur Verfasserschaft abzuleiten.
- issue: Göttliche Initiative in προσκέκληται ἡμᾶς ὁ θεός
  choice: „Gott uns gerufen hatte“
  alternative: „Gott uns führte“ oder „eingeladen hatte“
  rationale: „Gerufen“ entspricht dem Verb genauer und wahrt die Aussage von Gottes Initiative, ohne sie auszubauen.
- issue: Logischer Zusammenhang des Partizips συμβιβάζοντες
  choice: „denn wir schlossen daraus“
  alternative: „wobei wir folgerten“
  rationale: Macht deutlich, dass der Aufbruch auf einer gemeinsam gezogenen Schlussfolgerung aus der Vision beruht, ohne die Gewissheit stärker darzustellen als der Text.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satzfluss ist natürlich; die erste Person Plural und die zeitliche Abfolge des griechischen Textes bleiben erhalten.
