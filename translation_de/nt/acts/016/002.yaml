  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: de
  text: Er hatte bei den Brüdern[a] in Lystra und Ikonion einen guten Ruf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Geschwistern«; gemeint sind die anderen Gläubigen an diesen Orten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Er
  rationale: Das Relativpronomen bezieht sich auf Timotheus in Vers 1. Da der Vers im Deutschen als eigener Satz wiedergegeben wird, ist das Personalpronomen natürlich und eindeutig.
- source_word: ἐμαρτυρεῖτο
  choice: hatte … einen guten Ruf
  rationale: Das Imperfekt Passiv bezeichnet hier das fortdauernde günstige Zeugnis der anderen über Timotheus. Die idiomatische Wendung gibt diesen Sinn im heutigen Deutsch klar wieder.
- source_word: ὑπὸ
  choice: bei
  rationale: Ὑπό mit Genitiv kennzeichnet beim Passiv die Personen, von denen das günstige Zeugnis ausgeht. In Verbindung mit »einen guten Ruf haben« entspricht dem im Deutschen idiomatisch »bei«.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: in Lystra und Ikonion
  rationale: Die Präpositionalgruppe bestimmt die Brüder näher und bezeichnet die dortigen christlichen Gemeinschaften.
- source_word: ἀδελφῶν
  choice: Brüdern
  rationale: Die grammatisch maskuline Pluralform wird im Haupttext bewahrt. Da ἀδελφοί im frühchristlichen Sprachgebrauch die Glaubensgemeinschaft einschließlich Frauen bezeichnen kann, wird diese mögliche inklusive Bedeutung in einer Fußnote genannt.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von ἀδελφῶν als Bezeichnung der christlichen Gemeinschaft
  choice: Brüdern
  alternative: Geschwistern; anderen Gläubigen
  rationale: Der Haupttext bewahrt die grammatisch maskuline Form des Griechischen, ohne die mögliche inklusive Referenz auszuschließen; die Fußnote macht diese Bedeutungsweite transparent.
translation_notes:
  register: Modernes, natürliches und würdevolles Standarddeutsch. Die idiomatische Formulierung »einen guten Ruf haben« vermeidet ein hölzernes »ihm wurde Zeugnis gegeben«, ohne den Sinn des griechischen Passivs zu verändern.
