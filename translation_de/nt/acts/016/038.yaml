  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: de
  text: Die Rutenträger[b] berichteten den Stadtobersten[c] diese Worte. Als diese hörten, dass Paulus und Silas Römer[a] waren, bekamen sie Angst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »römische Bürger«. Im Griechischen steht »Römer«; in diesem rechtlichen Zusammenhang geht es um den Schutz und die Rechte des römischen Bürgerrechts.'
    reason: lexical_alternative
  - marker: b
    text: Die Rutenträger waren Amtsdiener der Stadtobersten; traditionell werden sie »Liktoren« genannt.
    reason: cultural_note
  - marker: c
    text: »Stadtoberste« übersetzt στρατηγοί, die führenden städtischen Amtsträger in Philippi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Das Verb bezeichnet hier die offizielle Weitergabe einer Nachricht und passt zum amtlichen Zusammenhang.
- source_word: στρατηγοῖς
  choice: Stadtobersten
  rationale: In der römischen Kolonie Philippi sind die führenden städtischen Amtsträger gemeint. „Stadtoberste“ ist verständlich und vermeidet den im heutigen Deutsch leicht missverständlichen Ausdruck „Magistrate“.
- source_word: ῥαβδοῦχοι
  choice: Rutenträger
  rationale: Die wörtliche Wiedergabe bewahrt das konkrete Bild der Amtsdiener, die als Zeichen obrigkeitlicher Gewalt Rutenbündel trugen.
- source_word: τὰ ῥήματα ταῦτα
  choice: diese Worte
  rationale: Die Formulierung gibt den griechischen Ausdruck unmittelbar wieder und verweist auf die zuvor übermittelte Aussage.
- source_word: ἐφοβήθησαν
  choice: bekamen sie Angst
  rationale: Die Wendung gibt die als Reaktion einsetzende Furcht natürlich und ohne zusätzliche Deutung wieder.
- source_word: ἀκούσαντες
  choice: Als diese hörten
  rationale: Der temporale Nebensatz bildet die zeitliche und sachliche Verknüpfung des Aoristpartizips idiomatisch ab.
- source_word: Ῥωμαῖοί
  choice: Römer
  rationale: Der griechische Text sagt wörtlich „Römer“; im rechtlichen Kontext ist damit ihr römisches Bürgerrecht gemeint, was in einer Fußnote erläutert wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. „Paulus und Silas“ verdeutlicht die im Kontext bestimmten, im griechischen Prädikatsnomen jedoch nur implizit bezeichneten Personen; die eigentliche Aussage „Römer“ bleibt erhalten.
