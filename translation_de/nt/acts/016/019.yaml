  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: de
  text: Als aber ihre Herren sahen, dass ihre Hoffnung auf Gewinn dahin war[a], packten sie Paulus und Silas und schleppten sie auf den Marktplatz zu den Oberen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hinausgegangen war“; gemeint ist, dass ihre Aussicht auf Verdienst oder Gewinn verschwunden war.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet allgemein Herrschende oder Obrigkeit. Im folgenden Vers steht eine genauere Amtsbezeichnung, die oft mit „Stadtrichter“ wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: ihre Herren
  rationale: Im Zusammenhang bezeichnet κύριοι diejenigen, die Herrschaft und Besitzanspruch über die versklavte Frau ausübten. „Ihre Herren“ bewahrt die soziale und wirtschaftliche Machtbeziehung, ohne sie zu einem bloßen Arbeitgeberverhältnis abzuschwächen.
- source_word: ἐξῆλθεν
  choice: dahin war
  rationale: Wörtlich bedeutet das Verb „hinausging“. Die idiomatische Wendung „dahin war“ gibt den eingetretenen vollständigen Verlust wieder; eine Fußnote bewahrt das auffällige Bild des griechischen Textes.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: ihre Hoffnung auf Gewinn
  rationale: ἐλπίς wird ausdrücklich als „Hoffnung“ wiedergegeben; ἐργασία bezeichnet hier angesichts der wirtschaftlichen Ausbeutung den erwarteten Verdienst beziehungsweise Gewinn.
- source_word: ἐπιλαβόμενοι
  choice: packten sie
  rationale: Das Partizip bezeichnet ein feindseliges, kräftiges Ergreifen. „Packten“ ist natürliches modernes Deutsch und vermittelt die Gewalt der Handlung.
- source_word: εἵλκυσαν
  choice: schleppten sie
  rationale: ἕλκω bezeichnet ein gewaltsames Ziehen. „Schleppten“ bringt den Zwang und die öffentliche Misshandlung deutlich zum Ausdruck.
- source_word: ἀγορὰν
  choice: Marktplatz
  rationale: ἀγορά war sowohl Markt als auch öffentlicher und politischer Platz. „Marktplatz“ ist die direkte, allgemein verständliche Entsprechung.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: vor die führenden Männer der Stadt
  rationale: ἄρχοντες ist hier eine allgemeine Bezeichnung für städtische Machthaber. Diese Wiedergabe unterscheidet sie von den spezifischer bezeichneten Amtsträgern im folgenden Vers.
theological_decisions: []
