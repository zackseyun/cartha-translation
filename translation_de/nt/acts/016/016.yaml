id: ACT.16.16
reference: Acts 16:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: de
  text: Als wir einmal zur Gebetsstätte gingen, begegnete uns eine Sklavin, die einen Pythongeist[a] hatte. Durch Wahrsagen[b] brachte sie ihren Herren viel Gewinn ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Wahrsagegeist“. Wörtlich steht im Griechischen „einen Pythongeist“, eine kulturspezifische Bezeichnung für einen mit Wahrsagerei verbundenen Geist.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durch das Ausüben von Wahrsagerei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Als … einmal
  rationale: Gibt den lukanischen Erzählübergang in natürlichem modernem Deutsch wieder, ohne die schwerfällige Wendung „Und es geschah“.
- source_word: πορευομένων ἡμῶν
  choice: als wir … gingen
  rationale: Gibt den Genitivus absolutus als gleichzeitige Hintergrundhandlung wieder.
- source_word: εἰς τὴν προσευχήν
  choice: zur Gebetsstätte
  rationale: Versteht προσευχή hier im örtlichen Sinn als einen anerkannten Ort des Gebets; „Gebetsstätte“ ist knapp und idiomatisch.
- source_word: παιδίσκην τινά
  choice: eine Sklavin
  rationale: Der Hinweis auf ihre Herren und deren wirtschaftlichen Gewinn macht ihren unfreien Status im Kontext deutlich; τινά muss im Deutschen nicht eigens mit „eine gewisse“ wiedergegeben werden.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: die einen Pythongeist hatte
  rationale: Bewahrt den kulturspezifischen griechischen Ausdruck, statt ihn im Haupttext bereits als Wahrsagegeist auszulegen.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: begegnete uns
  rationale: Natürliche deutsche Wiedergabe der durch die Erzählformel eingeführten Begegnung.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: brachte … viel Gewinn ein
  rationale: Drückt den erheblichen und fortlaufenden wirtschaftlichen Ertrag idiomatisch aus.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: ihren Herren
  rationale: Bezeichnet hier die Männer, unter deren Verfügungsgewalt die Sklavin stand, nicht den göttlichen Titel „Herr“.
- source_word: μαντευομένη
  choice: durch Wahrsagen
  rationale: Eine verständliche moderne Wiedergabe der mantischen Tätigkeit; die fachsprachlichere Alternative steht in der Fußnote.
theological_decisions:
- issue: Kulturspezifische Bedeutung von πνεῦμα πύθωνα
  choice: Pythongeist
  alternative: Wahrsagegeist / Geist der Weissagung
  rationale: Die Hauptübersetzung bewahrt die auffällige Bezeichnung des Ausgangstextes und legt das bezeichnete Phänomen nicht über das notwendige Maß hinaus fest; die Fußnote erläutert die Funktion.
- issue: Sozialer Status bei παιδίσκη
  choice: Sklavin
  alternative: Dienerin / junge Frau
  rationale: Der unmittelbare Kontext nennt mehrere Herren und deren Gewinn aus ihrer Tätigkeit. „Sklavin“ macht das hier relevante Abhängigkeits- und Ausbeutungsverhältnis deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für natürliche Lesbarkeit in zwei Sätze gegliedert; die kulturell fremde Bezeichnung „Pythongeist“ bleibt bewusst erhalten und wird in einer Fußnote erklärt.
