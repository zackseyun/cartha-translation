id: ACT.16.30
reference: Acts 16:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: de
  text: 'Dann führte er sie hinaus und sagte: »Meine Herren[a], was muss ich tun, damit ich gerettet werde?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Anrede bedeutet hier höflich »meine Herren«; sie ist nicht der göttliche Titel »Herr«.
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: führte er sie hinaus
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der durch ἔφη eingeführten Rede vorausgeht. »Führte er sie hinaus« gibt sowohl die Bewegung als auch die natürliche Erzählfolge im Deutschen wieder.
- source_word: ἔφη
  choice: sagte
  rationale: Der Imperfekt von φημί dient hier als übliche Redeeinleitung; »sagte« ist im deutschen Erzählstil natürlich.
- source_word: Κύριοι
  choice: Meine Herren
  rationale: Der Vokativ Plural ist hier eine respektvolle Anrede an Paulus und Silas und kein göttlicher Titel. »Meine Herren« bewahrt Höflichkeit und Plural.
- source_word: τί με δεῖ ποιεῖν
  choice: was muss ich tun
  rationale: δεῖ drückt Notwendigkeit aus; die knappe Formulierung entspricht dem griechischen Satz und klingt im modernen Deutsch natürlich.
- source_word: ἵνα σωθῶ
  choice: damit ich gerettet werde
  rationale: Die ἵνα-Konstruktion mit dem passiven Konjunktiv bezeichnet Ziel oder beabsichtigtes Ergebnis. »Damit« erhält die Satzstruktur, »gerettet werde« das Passiv.
theological_decisions:
- issue: Bedeutung von σωθῶ in der Frage des Gefängnisaufsehers
  choice: gerettet werde
  alternative: befreit werde / heil davonkomme
  rationale: σῴζω kann sowohl konkrete Rettung als auch Heil im umfassenderen Sinn bezeichnen. Der unmittelbare Zusammenhang und Vers 31 legen hier den umfassenderen Heilsbezug nahe; »gerettet« wahrt zugleich die semantische Weite, ohne ein bestimmtes Lehrsystem einzutragen.
- issue: Bedeutung von Κύριοι
  choice: Meine Herren
  alternative: Herren / Gebieter
  rationale: Die Anrede richtet sich im Plural an Paulus und Silas. Daher ist sie sozial-höflich zu verstehen und nicht als der Gottestitel »Herr«.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung bildet die zeitliche Folge natürlich ab; das Passiv und die Zielkonstruktion des griechischen Textes bleiben erhalten.
