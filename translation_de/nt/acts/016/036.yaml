source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: de
  text: 'Der Gefängniswärter überbrachte Paulus diese Nachricht: „Die Stadtrichter[a] haben ausrichten lassen[b], dass ihr freigelassen werden sollt. Kommt nun also heraus und geht in Frieden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Stadtrichter“ bezeichnet die leitenden städtischen Amtsträger von Philippi; als technische Amtsbezeichnung ist auch „Prätoren“ möglich.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „Die Stadtrichter haben geschickt, damit ihr freigelassen werdet.“ Das Griechische nennt nicht ausdrücklich, wen oder was sie geschickt haben; dem Zusammenhang nach geht es um die Übermittlung ihrer Anordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: überbrachte
  rationale: Das Verb bezeichnet hier die Weitergabe einer Nachricht. „Überbrachte“ passt natürlich zur amtlichen Mitteilung und gibt den Aorist als abgeschlossenes Erzählereignis wieder.
- source_word: ὁ δεσμοφύλαξ
  choice: der Gefängniswärter
  rationale: Gemeint ist der für das Gefängnis verantwortliche Aufseher. „Gefängniswärter“ ist im modernen Standarddeutsch klar und präzise.
- source_word: τοὺς λόγους τούτους
  choice: diese Nachricht
  rationale: Der griechische Plural „diese Worte“ bezeichnet hier den übermittelten Inhalt. „Diese Nachricht“ ist im Deutschen idiomatischer, ohne den Sinn zu erweitern.
- source_word: Ἀπέσταλκαν
  choice: haben ausrichten lassen
  rationale: Das Perfekt bezeichnet eine bereits erfolgte Sendung mit gegenwärtiger Bedeutung. Da das Objekt im Griechischen unausgesprochen bleibt, gibt „ausrichten lassen“ den im Zusammenhang gemeinten amtlichen Bescheid natürlich wieder.
- source_word: οἱ στρατηγοί
  choice: die Stadtrichter
  rationale: In der römischen Kolonie Philippi bezeichnet der Ausdruck die leitenden städtischen Amtsträger. „Stadtrichter“ ist verständlich und bewahrt den lokalen Amtscharakter besser als das allgemeinere „Beamte“.
- source_word: ἵνα ἀπολυθῆτε
  choice: dass ihr freigelassen werden sollt
  rationale: Die ἵνα-Konstruktion gibt hier den Inhalt beziehungsweise Zweck der Anordnung wieder; das Passiv bezeichnet die Entlassung aus der Haft.
- source_word: νῦν οὖν
  choice: nun also
  rationale: Die Formulierung bewahrt sowohl den zeitlichen Übergang als auch die folgernde Bedeutung in natürlichem Deutsch.
- source_word: ἐξελθόντες
  choice: kommt … heraus
  rationale: Das Aoristpartizip ist eng mit dem folgenden Imperativ verbunden und bezeichnet die erste Handlung der Abfolge. Die deutsche Aufforderung gibt diese Funktion idiomatisch wieder.
- source_word: πορεύεσθε
  choice: geht
  rationale: Der Imperativ fordert zum Fortgehen auf. „Geht“ ist schlicht und entspricht dem Erzählregister.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Die geläufige Wendung bewahrt sowohl den wörtlichen Ausdruck als auch den Sinn eines friedlichen und unbehelligten Weggehens.
