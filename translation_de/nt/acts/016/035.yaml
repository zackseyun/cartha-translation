  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: de
  text: 'Als es Tag wurde, schickten die Stadtobersten die Rutenträger[a] und ließen sagen: »Lass jene Männer frei!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Liktoren; Amtsdiener römischer Magistrate, die Ruten als Zeichen ihrer Amtsgewalt trugen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Als es Tag geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Übergang. Die Formulierung gibt den Eintritt des Tages natürlich wieder; δέ wird im Deutschen durch den erzählerischen Anschluss ausreichend vermittelt.
- source_word: ἀπέστειλαν
  choice: schickten
  rationale: Die übliche und klare Wiedergabe des Aorists von ἀποστέλλω.
- source_word: στρατηγοὶ
  choice: Stadtobersten
  rationale: Gemeint sind die leitenden Amtsträger der römischen Kolonie Philippi, nicht Heerführer. „Stadtoberste“ ist verständlich und bildet ihre kommunale Leitungsfunktion ab.
- source_word: ῥαβδούχους
  choice: Rutenträger
  rationale: Die wörtliche Wiedergabe bewahrt das sichtbare Amtszeichen dieser Bediensteten. Der historisch-technische Ausdruck „Liktoren“ wird in der Fußnote genannt.
- source_word: λέγοντες
  choice: und ließen sagen
  rationale: Das Partizip leitet die übermittelte Botschaft ein. „Ließen sagen“ ist im Deutschen idiomatisch und macht deutlich, dass die Amtsträger ihre Anweisung durch Boten übermitteln.
- source_word: Ἀπόλυσον
  choice: Lass … frei
  rationale: Der Aoristimperativ Singular verlangt die Freilassung der Gefangenen. Der Singular bleibt erhalten, weil die übermittelte Anweisung an den Gefängnisaufseher gerichtet ist.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: jene Männer
  rationale: Im Kontext sind Paulus und Silas gemeint. „Männer“ ist daher sachlich genau; „jene“ bewahrt die distanzierende Demonstrativform.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Amtsbezeichnungen bleiben verständlich, während die Fußnote den historisch präzisen Fachbegriff bietet. Der Imperativ im Singular und das distanzierende „jene“ wurden entsprechend dem griechischen Text bewahrt.
