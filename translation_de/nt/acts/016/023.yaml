  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: de
  text: Nachdem sie ihnen viele Schläge versetzt hatten[a], warfen sie sie ins Gefängnis[b] und befahlen dem Gefängniswärter, sie sicher zu verwahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »viele Hiebe« oder »viele Züchtigungen«. Das griechische Wort bezeichnet hier zahlreiche zugefügte Schläge, ohne das verwendete Schlaginstrument näher zu bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in den Kerker«. Der griechische Ausdruck kann allgemein einen Ort der Verwahrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: viele Schläge
  rationale: Die Wendung bezeichnet zahlreiche zugefügte Schläge, ohne das Schlaginstrument genauer zu bestimmen. »Schläge« bewahrt diese Offenheit.
- source_word: τε
  choice: und
  rationale: Die verbindende Partikel knüpft den Vorgang an die vorausgehende Erzählung an; im Deutschen wird diese Verbindung natürlich durch »und« vor dem zweiten Hauptsatz wiedergegeben.
- source_word: ἐπιθέντες
  choice: Nachdem sie ... versetzt hatten
  rationale: Mit πληγάς bildet das Partizip eine idiomatische Wendung für das Zufügen von Schlägen. Der vorzeitige temporale Bezug zum Hauptverb wird durch »Nachdem ... hatten« deutlich.
- source_word: ἔβαλον εἰς φυλακήν
  choice: warfen sie sie ins Gefängnis
  rationale: »Warfen« erhält die kraftvolle Bildlichkeit von βάλλω; »ins Gefängnis« gibt die Einweisung in den Haftort idiomatisch wieder.
- source_word: φυλακήν
  choice: Gefängnis
  rationale: φυλακή bezeichnet hier den Ort der Verwahrung. »Gefängnis« ist die klare und allgemein verständliche deutsche Entsprechung.
- source_word: παραγγείλαντες
  choice: befahlen
  rationale: Das Partizip bezeichnet eine begleitende autoritative Anweisung. Ein koordinierter Satz mit »und befahlen« klingt im Deutschen natürlich und erhält den Befehlscharakter.
- source_word: δεσμοφύλακι
  choice: dem Gefängniswärter
  rationale: Das Wort bezeichnet den für die Gefangenen verantwortlichen Aufseher. »Gefängniswärter« ist präzise, verständlich und dem historischen Kontext angemessen.
- source_word: ἀσφαλῶς
  choice: sicher
  rationale: Gemeint ist sichere Verwahrung, die eine Flucht verhindert, nicht das Wohlergehen der Gefangenen.
- source_word: τηρεῖν
  choice: zu verwahren
  rationale: Im Haftkontext bezeichnet τηρεῖν das Bewachen beziehungsweise Festhalten. »Sicher zu verwahren« gibt den Zusammenhang idiomatisch und ohne Bedeutungsverlust wieder.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist auf Paulus und Silas als diejenigen, die inhaftiert und sicher verwahrt werden sollen.
