  yaml_path: translation/nt/acts/016/008.yaml
  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: de
  text: Da zogen sie an Mysien vorbei[a] und gingen hinab nach Troas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zogen durch Mysien hindurch“. Das griechische Partizip kann sowohl ein Vorbeiziehen an Mysien als auch ein Durchqueren der Region bezeichnen; der genaue Verlauf bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: zogen … vorbei
  rationale: Das Aoristpartizip von παρέρχομαι mit dem Akkusativ τὴν Μυσίαν bezeichnet hier am ehesten ein Vorbeiziehen an der Region, ohne dort Halt zu machen. Die deutsche Formulierung ist natürlich und bewahrt die Bewegungsrichtung.
- source_word: δὲ
  choice: Da
  rationale: δέ ist ein leichter erzählerischer Anschluss. „Da“ führt im Deutschen den Handlungsablauf natürlich fort, ohne einen starken Gegensatz auszudrücken.
- source_word: Μυσίαν
  choice: Mysien
  rationale: Übliche deutsche Form des antiken Landschaftsnamens.
- source_word: κατέβησαν
  choice: gingen hinab
  rationale: Die Form von καταβαίνω bezeichnet eine Bewegung nach unten. „Gingen hinab“ bewahrt diese räumliche Angabe und bleibt idiomatisch.
- source_word: εἰς
  choice: nach
  rationale: Bei Städtenamen wird das Ziel im Deutschen idiomatisch mit „nach“ ausgedrückt.
- source_word: Τρῳάδα
  choice: Troas
  rationale: Übliche deutsche Wiedergabe des Ortsnamens.
theological_decisions: []
