base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: de
  text: Und sie verkündeten ihm, zusammen mit allen, die in seinem Haus waren, das Wort des Herrn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Botschaft vom Herrn“ beziehungsweise „die Botschaft über den Herrn“. Die griechische Wendung kann eine Botschaft bezeichnen, die vom Herrn kommt, ihm gehört oder ihn zum Inhalt hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλάλησαν
  choice: sagten
  rationale: Das Verb λαλέω bezeichnet hier das mündliche Mitteilen der christlichen Botschaft. „Sagten“ ist im Deutschen natürlich und gibt mit dem Dativ „ihm“ die persönliche Anrede wieder, ohne den öffentlichen Verkündigungscharakter von „verkündigten“ vorauszusetzen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ Singular bezieht sich auf den Gefängnisaufseher und wird bei λαλέω idiomatisch mit „ihm“ wiedergegeben.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: das Wort des Herrn
  rationale: „Das Wort des Herrn“ bewahrt die neutestamentliche Ausdrucksweise und lässt offen, ob die Botschaft vom Herrn kommt, ihm gehört oder ihn zum Inhalt hat.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: zusammen mit allen, die in seinem Haus waren
  rationale: „Zusammen mit“ bildet σύν unmittelbar ab. Die Formulierung schließt alle Anwesenden in den Kreis der Angesprochenen ein, ohne die griechische Konstruktion in ein ausdrückliches zweites Dativobjekt umzuwandeln.
- source_word: οἰκίᾳ
  choice: Haus
  rationale: οἰκία kann das Gebäude oder den Haushalt bezeichnen. „Haus“ wahrt die konkrete Ortsangabe; „Hausgemeinschaft“ bleibt als sinngemäße Möglichkeit in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutungsumfang von „das Wort des Herrn“
  choice: Die Genitivverbindung bleibt als „das Wort des Herrn“ erhalten.
  alternative: „die Botschaft vom Herrn“ oder „die Botschaft über den Herrn“
  rationale: Der griechische Genitiv kann Herkunft, Zugehörigkeit oder Inhalt bezeichnen. Die Hauptfassung legt sich nicht auf nur eine dieser theologischen Nuancen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sagten ihm das Wort“ ist bewusst schriftsprachlich und bewahrt die enge Verbindung von λαλέω mit λόγος; „redeten zu ihm“ wäre formaler, im heutigen Deutsch jedoch schwerfälliger.
