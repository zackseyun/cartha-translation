  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: de
  text: 'Sie tat dies viele Tage lang immer wieder. Paulus aber, tief bekümmert, wandte sich um und sagte zu dem Geist: „Ich befehle dir im Namen Jesu, des Messias[a]: Verlass sie!“ Sofort verließ der Geist sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Namen Jesu Christi“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: Das tat sie viele Tage lang
  rationale: Der Imperfekt beschreibt eine über viele Tage fortgesetzte beziehungsweise wiederholte Handlung; die deutsche Formulierung gibt dies natürlich wieder.
- source_word: διαπονηθεὶς
  choice: war darüber tief bekümmert
  rationale: Das Partizip bezeichnet starke innere Belastung oder Bedrängnis und nicht bloß leichte Verärgerung. „Tief bekümmert“ wahrt den Ernst, ohne Zorn ausdrücklich einzutragen.
- source_word: ἐπιστρέψας
  choice: wandte sich um
  rationale: Das Aoristpartizip bezeichnet Paulus’ körperliche Hinwendung, bevor er den Geist anspricht.
- source_word: τῷ πνεύματι
  choice: zu dem Geist
  rationale: Der griechische Text sagt ohne weiteren Zusatz „zu dem Geist“. Daher werden „böse“ und „Dämon“ nicht in den Haupttext eingefügt.
- source_word: Παραγγέλλω σοι
  choice: Ich befehle dir
  rationale: Die Wendung drückt hier einen autoritativen Befehl aus und wird im Deutschen direkt und idiomatisch wiedergegeben.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: im Namen Jesu, des Messias
  rationale: Χριστός wird in seiner Titelfunktion als „Messias“ wiedergegeben. Die Apposition mit Komma und Artikel ist im Deutschen natürlich und macht den Titelcharakter deutlich.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: Verlass sie!
  rationale: Die knappe deutsche Befehlsform gibt den exorzistischen Sinn des Infinitivs nach παραγγέλλω natürlich wieder, ohne den Inhalt abzuschwächen.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: noch in derselben Stunde verließ er sie
  rationale: Die Wendung αὐτῇ τῇ ὥρᾳ betont das unmittelbare Eintreten. Das männliche Pronomen nimmt im Deutschen eindeutig „der Geist“ auf.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Befehlsformel
  choice: des Messias
  alternative: Christi
  rationale: Χριστός hat hier Titelfunktion. „Messias“ bewahrt die Bedeutung des Titels, während „Christus“ im heutigen Sprachgebrauch leicht wie ein fester Namensbestandteil verstanden wird.
- issue: Nähere Bestimmung des Geistes
  choice: der Geist
  alternative: der böse Geist / der Dämon
  rationale: Der Vers selbst verwendet πνεῦμα ohne ausdrückliche nähere Bestimmung. Der Haupttext bewahrt diese Formulierung und überlässt die Einordnung dem Kontext.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist knapp und kraftvoll; unnötige konfessionelle oder interpretierende Zusätze werden vermieden.
