  source_fidelity: 'Die Wiedergabe folgt dem griechischen Satzbau und den zentralen Begriffen weitgehend zuverlässig. Eine Korrektur ist jedoch bei αὐτῇ τῇ ὥρᾳ sinnvoll: „noch in derselben Stunde“ kann ein Eintreten irgendwann innerhalb der Stunde zulassen, während die Wendung hier den sofortigen Erfolg des Befehls hervorhebt. Außerdem macht die ausdrückliche Wiederaufnahme „der Geist“ den im Deutschen sonst etwas weniger klaren Bezug von „er“ eindeutig.'
  naturalness: Der Erzählton ist modern und würdig. „Das tat sie viele Tage lang“ ist verständlich, doch „immer wieder“ bringt den iterativen bzw. andauernden Imperfektgebrauch deutlicher zur Geltung. Die knappe Befehlsform „Verlass sie!“ ist idiomatisch.
  terminology: „Geist“ bewahrt die unqualifizierte Bezeichnung πνεῦμα; weder „Dämon“ noch „böser Geist“ wird unzulässig ergänzt. „Jesu, des Messias“ gibt Χριστοῦ als Titel in gutem Deutsch wieder. Die Fußnote ist sachlich und am passenden Ausdruck verankert.
  issues:
