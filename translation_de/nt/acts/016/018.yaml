revisions:
- from: 'Das tat sie viele Tage lang. Doch Paulus war darüber tief bekümmert, wandte sich um und sagte zu dem Geist: „Ich befehle dir im Namen Jesu, des Messias[a]: Verlass sie!“ Und noch in derselben Stunde verließ er sie.'
  to: 'Sie tat dies viele Tage lang immer wieder. Paulus aber, tief bekümmert, wandte sich um und sagte zu dem Geist: „Ich befehle dir im Namen Jesu, des Messias[a]: Verlass sie!“ Sofort verließ der Geist sie.'
  rationale: Die Änderung stellt die iterative Nuance des Imperfekts heraus und gibt die unmittelbare Wirkung von αὐτῇ τῇ ὥρᾳ mit „Sofort“ wieder. Die ausdrückliche Subjektnennung im Schlusssatz dient allein der deutschen Klarheit. „Tief bekümmert“, „der Geist“ und „Jesu, des Messias“ können beibehalten werden, da sie die Quellformulierung und deren Zurückhaltung angemessen bewahren.
