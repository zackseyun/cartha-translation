  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: de
  text: 'Als nun sie und ihr Haushalt getauft worden waren, bat sie uns eindringlich: „Wenn ihr mich als dem Herrn treu beurteilt habt[a], dann kommt in mein Haus und bleibt.“ Und sie drängte uns dazu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ihr mich als gläubig an den Herrn beurteilt habt“; auch „wenn ihr mich dem Herrn gegenüber für vertrauenswürdig haltet“. Das griechische Adjektiv kann „treu“, „vertrauenswürdig“ oder „gläubig“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nachdem
  rationale: Gibt den zeitlichen Zusammenhang und die Abfolge im Deutschen natürlich wieder; das schwache δέ muss nicht eigens mit „aber“ übersetzt werden.
- source_word: ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: sie und ihr Haushalt getauft worden waren
  rationale: Der griechische Singular setzt bei Lydia an und bezieht anschließend ihren Haushalt ein. Der deutsche Pluralpassiv gibt beide Satzglieder natürlich wieder.
- source_word: ὁ οἶκος αὐτῆς
  choice: ihr Haushalt
  rationale: οἶκος bezeichnet hier die zu Lydia gehörende Hausgemeinschaft, nicht das Gebäude.
- source_word: παρεκάλεσεν
  choice: bat sie uns eindringlich
  rationale: παρακαλέω bezeichnet hier angesichts des nachfolgenden Drängens eine nachdrückliche Bitte beziehungsweise Einladung.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Wenn ihr zu dem Urteil gekommen seid, dass ich dem Herrn treu bin
  rationale: Die Form κεκρίκατε bezeichnet eine bereits vollzogene und fortgeltende Einschätzung. „Dem Herrn treu“ bewahrt die relationale Bedeutung und lässt die mögliche Nuance „gläubig“ offen.
- source_word: πιστὴν
  choice: treu
  rationale: πιστός kann hier „treu“, „vertrauenswürdig“ oder „gläubig“ bedeuten. „Treu“ erhält die Mehrdeutigkeit zwischen Glauben, Loyalität und Zuverlässigkeit am besten.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: 'Der Dativ wird relational zu πιστή verstanden: Lydia ist dem Herrn gegenüber treu.'
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: dann kommt in mein Haus und bleibt dort
  rationale: Das Partizip εἰσελθόντες wird als begleitende Aufforderung wiedergegeben. Hier bezeichnet οἶκος anders als zuvor das Wohnhaus; μένετε meint den Aufenthalt als Gäste.
- source_word: παρεβιάσατο ἡμᾶς
  choice: sie drängte uns, bis wir nachgaben
  rationale: παραβιάζομαι bezeichnet beharrliches, starkes Drängen. Die Formulierung gibt sowohl die Intensität als auch den erzielten Erfolg wieder, ohne körperlichen Zwang nahezulegen.
theological_decisions:
- issue: Mögliche konfessionelle Folgerungen aus der Taufe ihres Haushalts
  choice: Die Taufe Lydias und ihres Haushalts wird ohne nähere Bestimmung der einzelnen Haushaltsangehörigen berichtet.
  alternative: Eine Formulierung, die entweder die Taufe von Kleinkindern oder ausschließlich die Taufe ausdrücklich bekennender Gläubiger voraussetzt.
  rationale: Der Vers nennt weder Alter noch persönlichen Glaubensstatus der einzelnen Personen und entscheidet daher spätere Taufdebatten nicht ausdrücklich.
- issue: Bedeutung von πιστὴν in Lydias Aussage
  choice: dem Herrn treu
  alternative: an den Herrn gläubig; vor dem Herrn vertrauenswürdig
  rationale: Das griechische Adjektiv lässt mehrere verwandte Nuancen zu. „Treu“ bewahrt die Spannung zwischen Glauben, Loyalität und erwiesener Zuverlässigkeit; die Fußnote nennt die Alternativen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Haushalt“ bezeichnet die Hausgemeinschaft, während „mein Haus“ das Gebäude meint. Die Schlussformulierung vermeidet sowohl das altertümliche „nötigte“ als auch den Eindruck gewaltsamen Zwangs.
