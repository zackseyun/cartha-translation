  text: αἰτήσας δὲ φῶτα εἰσεπήδησεν καὶ ἔντρομος γενόμενος προσέπεσεν τῷ Παύλῳ καὶ ⸀τῷ Σιλᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: de
  text: Da bat er um Licht, stürzte hinein und fiel zitternd vor Paulus und Silas nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Niederfallen kann hier Angst, dringende Bitte oder Ehrerbietung ausdrücken; Anbetung ist damit nicht ausdrücklich gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰτήσας δὲ φῶτα
  choice: Da ließ er sich Lichter bringen
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Bitte. Die kausative deutsche Wendung gibt im Zusammenhang natürlich wieder, dass der Gefängnisaufseher Lichtquellen anforderte; der Plural „Lichter“ legt weder Lampen noch Fackeln fest. δέ führt die Erzählung weiter und wird mit „Da“ wiedergegeben.
- source_word: εἰσεπήδησεν
  choice: stürzte hinein
  rationale: Das Verb bezeichnet eine plötzliche, kraftvolle Bewegung nach innen. „Stürzte hinein“ ist im modernen Deutschen anschaulich und idiomatisch, ohne einen wörtlichen Sprung zu behaupten.
- source_word: ἔντρομος γενόμενος
  choice: zitternd
  rationale: Die Verbindung beschreibt den eingetretenen Zustand des von Furcht körperlich Erschütterten. „Zitternd“ bewahrt das körperliche Bild knapp und natürlich; die Furcht ergibt sich aus Wortbedeutung und Kontext.
- source_word: προσέπεσεν τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: fiel vor Paulus und Silas nieder
  rationale: Das Verb mit Dativ bezeichnet ein Niederfallen vor Personen. Die Formulierung wahrt die Geste der Angst, Bitte oder Ehrerbietung, ohne sie ausdrücklich als Anbetung zu deuten.
theological_decisions:
- issue: Bedeutung des Niederfallens vor Paulus und Silas
  choice: 'Als körperliche Geste wiedergegeben: „fiel vor Paulus und Silas nieder“'
  alternative: „warf sich vor Paulus und Silas nieder“ oder „betete Paulus und Silas an“
  rationale: προσπίπτω kann ein Niederfallen aus Angst, dringender Bitte oder Ehrerbietung bezeichnen und fordert hier nicht die Aussage religiöser Anbetung. Die gewählte Fassung lässt die genaue Bedeutung der Geste offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählfolge. „Lichter“ erhält die Unbestimmtheit der Lichtquellen; „stürzte hinein“ vermittelt die plötzliche Bewegung. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Satz.
