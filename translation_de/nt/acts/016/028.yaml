id: ACT.16.28
reference: Acts 16:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: de
  text: 'Doch Paulus rief laut: „Tu dir nichts an! Wir sind nämlich alle hier.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν … φωνῇ μεγάλῃ
  choice: rief laut
  rationale: Die Verbindung bezeichnet in der dringlichen Situation einen kräftigen, lauten Ruf. „Rief laut“ gibt die Intensität natürlich wieder, ohne die im Deutschen schwerfällige Doppelung „rief mit lauter Stimme“.
- source_word: δὲ
  choice: Doch
  rationale: 'Die Partikel markiert hier den Gegensatz zur unmittelbar bevorstehenden Selbsttötung des Gefängnisaufsehers: Paulus greift unterbrechend ein.'
- source_word: λέγων
  choice: durch direkte Rede ohne gesondertes „und sagte“
  rationale: Das Partizip führt den Inhalt des Rufes ein. Im Deutschen genügt nach „rief laut“ der Doppelpunkt; eine zusätzliche Redeeinleitung wäre redundant.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Tu dir nichts an!
  rationale: Die idiomatische deutsche Wendung bewahrt den reflexiven Sinn und bezeichnet im Kontext klar die beabsichtigte Selbstverletzung beziehungsweise Selbsttötung. Sie klingt dringlich und natürlich.
- source_word: ἅπαντες
  choice: alle
  rationale: Das Wort betont ausnahmslos die Gesamtheit der anwesenden Gefangenen.
- source_word: γάρ
  choice: nämlich
  rationale: Die Partikel begründet, warum der Aufseher sich nichts antun soll. „Nämlich“ stellt diesen erklärenden Zusammenhang in natürlicher deutscher Wortfolge her.
- source_word: ἐνθάδε
  choice: hier
  rationale: Die Ortsangabe wird knapp und idiomatisch wiedergegeben.
- source_word: ὁ Παῦλος
  choice: Paulus
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
theological_decisions:
- issue: Art der drohenden Selbstschädigung
  choice: Die Formulierung „Tu dir nichts an!“ bleibt allgemein, verweist im Kontext aber deutlich auf die unmittelbar beabsichtigte Selbsttötung.
  alternative: „Töte dich nicht!“
  rationale: Der griechische Wortlaut sagt weiter gefasst, man solle sich nichts Böses antun. Eine ausdrückliche Festlegung auf „töten“ wäre zwar kontextuell verständlich, würde den Wortlaut jedoch verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit unmittelbarer Dringlichkeit. Die knappe direkte Rede entspricht der Gefahrensituation; der erklärende Zusammenhang von γάρ bleibt durch „nämlich“ erhalten.
