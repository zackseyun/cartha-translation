source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: de
  text: Und eine Frau namens Lydia, eine Purpurhändlerin aus der Stadt Thyatira, die Gott verehrte[a], hörte zu. Der Herr öffnete ihr das Herz, sodass sie auf das achtete, was Paulus sagte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Gottesverehrerin«; die Wendung kann eine nichtjüdische Anhängerin bezeichnen, die den Gott Israels verehrte.'
    reason: Lexikalische Alternative und möglicher zeitgeschichtlicher Gruppenbegriff.
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: Eine Frau
  rationale: Das unbestimmte τις wird im Deutschen durch den unbestimmten Artikel natürlich wiedergegeben; »eine gewisse Frau« wäre unnötig steif.
- source_word: ὀνόματι Λυδία
  choice: namens Lydia
  rationale: Idiոմatische und genaue Wiedergabe der Dativwendung mit dem Personennamen.
- source_word: πορφυρόπωλις
  choice: eine Purpurhändlerin
  rationale: Das Wort bezeichnet eine Händlerin mit purpurgefärbten Stoffen oder entsprechenden Waren; die kompakte deutsche Berufsbezeichnung vermeidet eine unnötige Festlegung auf eine einzelne Warenart.
- source_word: πόλεως Θυατείρων
  choice: aus der Stadt Thyatira
  rationale: Gibt die Herkunftsangabe im Deutschen natürlich wieder und bewahrt die ausdrückliche Bezeichnung als Stadt.
- source_word: σεβομένη τὸν θεόν
  choice: die Gott verehrte
  rationale: Gibt ihre Verehrung des Gottes Israels verständlich wieder, ohne im Haupttext einen möglicherweise technischen Gruppenbegriff vorauszusetzen.
- source_word: ἤκουεν
  choice: hörte zu
  rationale: Das Imperfekt beschreibt fortdauerndes Zuhören; im deutschen Erzählzusammenhang vermittelt das Präteritum dies ausreichend und natürlich.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Entspricht dem griechischen Ausdruck, ohne seinen hier nicht ausdrücklich bestimmten Referenten enger festzulegen.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: öffnete ihr das Herz
  rationale: Bewahrt das griechische Bild und bezeichnet die von Gott bewirkte innere Aufnahmebereitschaft.
- source_word: προσέχειν
  choice: sodass sie aufmerksam auf das hörte
  rationale: Drückt gerichtete Aufmerksamkeit aus, ohne den Begriff bereits als Glaubensentscheidung oder Gehorsam auszulegen.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: was Paulus sagte
  rationale: Natürliche deutsche Wiedergabe der substantivierten Passivkonstruktion; der Inhalt und Paulus als Sprecher bleiben vollständig erhalten.
theological_decisions:
- issue: Bezug von ὁ κύριος
  choice: der Herr
  alternative: Gott; der Herr Jesus
  rationale: Der griechische Text nennt lediglich »den Herrn«. Die Übersetzung bewahrt diese Offenheit, statt den göttlichen Handelnden ausdrücklich mit Gott oder Jesus gleichzusetzen.
- issue: Bedeutung von σεβομένη τὸν θεόν
  choice: die Gott verehrte
  alternative: eine Gottesverehrerin; eine Gottesfürchtige
  rationale: Die Formulierung kann auf eine nichtjüdische Anhängerin des Gottes Israels hinweisen, ist im Satz aber zunächst eine beschreibende Partizipialwendung. Der Haupttext bleibt beschreibend; die mögliche gruppenspezifische Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das griechische Bild vom geöffneten Herzen bleibt erhalten; schwerfällige Passivformen und unnötig technische religiöse Bezeichnungen werden im Haupttext vermieden.
