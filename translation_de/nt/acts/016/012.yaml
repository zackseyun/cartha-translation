id: ACT.16.12
reference: Acts 16:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: de
  text: Von dort reisten wir weiter nach Philippi, einer bedeutenden Stadt im Bezirk Mazedoniens[a] und einer römischen Kolonie[b]. In dieser Stadt hielten wir uns einige Tage auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die erste Stadt des Bezirks Mazedoniens“. Die griechische Formulierung ist schwierig; „erste“ kann sich auf Rang, Bedeutung oder Reihenfolge beziehen.'
    reason: alternative_reading
  - marker: b
    text: 'Das heißt: Philippi besaß unter römischer Herrschaft den besonderen Rechtsstatus einer römischen Kolonie.'
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: Von dort reisten wir weiter nach Philippi
  rationale: Die Wendung führt die zuvor geschilderte Reiseroute fort. Das im Griechischen elliptisch fehlende Bewegungsverb wird im Deutschen aus dem Zusammenhang ergänzt; „weiter“ gibt die verbindende Kraft von κἀκεῖθεν natürlich wieder.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: eine bedeutende Stadt dieses Bezirks von Mazedonien
  rationale: πρώτη kann hier Rang, Bedeutung oder Reihenfolge bezeichnen; die genaue Konstruktion ist umstritten. „bedeutende“ vermeidet eine historisch möglicherweise irreführende Festlegung auf „erste“, während „Bezirk“ die regionale Bedeutung von μερίς wiedergibt.
- source_word: κολωνία
  choice: eine römische Kolonie
  rationale: Das Lehnwort bezeichnet hier den rechtlichen Status Philippis als römische Kolonie. „römische“ macht den antiken Bezug für heutige Leser ausdrücklich.
- source_word: ἦμεν ... διατρίβοντες
  choice: hielten wir uns ... auf
  rationale: Die umschreibende Verbform drückt einen andauernden Aufenthalt aus. Die deutsche Wendung ist natürlich und bewahrt diesen durativen Sinn.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: In dieser Stadt
  rationale: Die demonstrative Form ταύτῃ wird direkt wiedergegeben und nimmt Philippi ausdrücklich auf.
- source_word: ἡμέρας τινάς
  choice: einige Tage
  rationale: Die Zeitangabe bleibt bewusst unbestimmt und wird nicht unnötig auf „wenige“ oder „mehrere“ Tage präzisiert.
theological_decisions:
- issue: Bedeutung von πρώτη in der Beschreibung Philippis
  choice: „eine bedeutende Stadt“
  alternative: „die erste Stadt“
  rationale: Die Formulierung ist sprachlich und historisch umstritten. Die Hauptübersetzung gibt den möglichen Rang- oder Bedeutungsaspekt wieder; die Fußnote bewahrt die wörtlichere Alternative, ohne eine nicht eindeutige administrative Aussage festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das in der ersten Satzhälfte im Griechischen vorausgesetzte Reiseverb wird für einen vollständigen natürlichen deutschen Satz ergänzt. Die historisch schwierige Beschreibung Philippis bleibt durch Haupttext und Fußnote transparent.
