id: ACT.16.17
reference: Acts 16:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: de
  text: 'Sie folgte Paulus und uns ständig und rief immer wieder laut: »Diese Männer sind Sklaven des höchsten Gottes. Sie verkünden euch einen Weg zur Rettung.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Weg zur Rettung«. Im Griechischen steht »Weg« hier ohne Artikel; je nach Verständnis kann die Wendung unbestimmt oder bestimmt wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: folgte … ständig
  rationale: Das Präsenspartizip zusammen mit dem Imperfekt beschreibt ein anhaltendes Geschehen. Die Formulierung gibt diesen durativen Sinn in natürlichem Deutsch wieder.
- source_word: ἔκραζεν
  choice: rief immer wieder laut
  rationale: Das Verb bezeichnet lautes Rufen; das Imperfekt legt fortgesetztes oder wiederholtes Rufen nahe.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Der Ausdruck bezeichnet hier Menschen, die Gott gehören und ihm unterstellt sind. »Sklaven« bewahrt diesen Aspekt deutlicher als das allgemeinere »Diener«.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: des höchsten Gottes
  rationale: Die Formulierung gibt den griechischen Gottesnamen beziehungsweise Hoheitstitel knapp und idiomatisch wieder.
- source_word: καταγγέλλουσιν
  choice: verkünden
  rationale: Das Verb bezeichnet eine öffentliche Bekanntmachung oder Verkündigung; das deutsche Präsens entspricht dem griechischen Präsens.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Adressaten der Verkündigung.
- source_word: ὁδὸν σωτηρίας
  choice: einen Weg zur Rettung
  rationale: ὁδόν steht ohne Artikel. Die gewählte Formulierung wahrt diese mögliche Unbestimmtheit, während die Fußnote auf die ebenso mögliche bestimmte Wiedergabe hinweist.
theological_decisions:
- issue: Bestimmtheit von ὁδὸν σωτηρίας
  choice: einen Weg zur Rettung
  alternative: den Weg zur Rettung
  rationale: Der fehlende griechische Artikel lässt die Wendung formal unbestimmt erscheinen, erzwingt im Koine-Griechischen jedoch keine unbestimmte Deutung. Haupttext und Fußnote bewahren diese echte sprachliche und theologische Spannung, ohne sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. »Sklaven« bewahrt bewusst die Schärfe des griechischen δοῦλοι; »immer wieder laut« macht den fortdauernden Charakter des Rufens verständlich.
