  source_fidelity: Der Text gibt die durative bzw. wiederholte Handlung von κατακολουθοῦσα und ἔκραζεν angemessen wieder („ständig“ / „immer wieder laut“). „Sklaven des höchsten Gottes“ bewahrt δοῦλοι und den Hoheitstitel τοῦ θεοῦ τοῦ ὑψίστου. „einen Weg zur Rettung“ ist für ὁδὸν σωτηρίας sprachlich möglich; die Fußnote wahrt zutreffend die im Koine-Griechischen bestehende Offenheit hinsichtlich der Bestimmtheit.
  naturalness: Modernes, gut verständliches Standarddeutsch mit passendem erzählerischem Register. Die Aufteilung der direkten Rede in zwei deutsche Hauptsätze ist natürlich und beeinträchtigt die Aussage der griechischen Relativkonstruktion nicht.
  terminology: „Sklaven“ ist eine sachgerechte, bewusst präzise Wiedergabe von δοῦλοι. „Verkünden“, „höchster Gott“ und „Rettung“ sind idiomatisch und dem Kontext angemessen. Die Übersetzung legt keine konfessionelle Deutung der anarthrischen Wortgruppe ὁδὸν σωτηρίας fest.
