id: ACT.16.1
reference: Acts 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: de
  text: Er kam auch nach Derbe und nach Lystra. Und sieh, dort war ein Jünger namens Timotheus, der Sohn einer gläubigen Jüdin[a]; sein Vater aber war Grieche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer treuen Jüdin“. Das griechische Wort kann sowohl „gläubig“ als auch „treu“ bedeuten; hier ist „gläubig“ wahrscheinlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν
  choice: kam
  rationale: Das Verb bezeichnet hier im Reisebericht das Gelangen an einen Ort. „Kam“ ist natürlich und gibt die Bewegung zu den genannten Städten ohne Zusatzbedeutung wieder.
- source_word: δὲ καὶ
  choice: auch
  rationale: „Auch“ bewahrt den weiterführenden und zugleich additiven Sinn der Partikelverbindung.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: nach Derbe und nach Lystra
  rationale: Bei Städtenamen ist εἰς idiomatisch mit „nach“ wiederzugeben; die Wiederholung von „nach“ entspricht der wiederholten Präposition im Griechischen.
- source_word: καὶ ἰδοὺ
  choice: Und sieh
  rationale: ἰδού lenkt ausdrücklich die Aufmerksamkeit auf die neu eingeführte Person. „Und sieh“ wahrt diese erzählerische Hervorhebung in verständlichem Deutsch.
- source_word: μαθητής τις ἦν ἐκεῖ
  choice: dort war ein Jünger
  rationale: Die Wortstellung ist im Deutschen natürlich, bewahrt ἐκεῖ als Ortsangabe und führt mit τις einen bisher nicht genannten Jünger ein, ohne das schwerfällige „ein gewisser“ zu erzwingen.
- source_word: ὀνόματι Τιμόθεος
  choice: namens Timotheus
  rationale: „Namens“ ist eine knappe und geläufige Wiedergabe der Dativkonstruktion mit ὀνόματι.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: der Sohn einer gläubigen Jüdin
  rationale: Die substantivische Form „Jüdin“ gibt γυναικὸς Ἰουδαίας natürlich wieder. Im Kontext der Apostelgeschichte bezeichnet πιστή am ehesten eine Frau, die glaubt.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: sein Vater aber war Grieche
  rationale: Die im Griechischen elliptische Genitivfügung wird zu einem natürlichen deutschen Satz entfaltet; „aber“ bewahrt den durch δέ markierten Gegensatz, und „Grieche“ gibt Ἕλλην direkt wieder.
theological_decisions:
- issue: Bedeutung von πιστῆς als Beschreibung der Mutter des Timotheus
  choice: gläubigen Jüdin
  alternative: treuen Jüdin
  rationale: πιστός kann sowohl „gläubig“ als auch „treu“ bedeuten. Im Sprachgebrauch der Apostelgeschichte und bei der Einführung des Jüngers Timotheus ist die Zugehörigkeit zum Glauben wahrscheinlicher; die lexikalisch mögliche Alternative wird in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und sieh“ erhält die auffällige erzählerische Funktion von ἰδού, während die übrige Syntax für heutige Leser natürlich gestaltet ist.
