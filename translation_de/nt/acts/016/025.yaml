source:
  edition: SBLGNT
  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: de
  text: Gegen Mitternacht beteten Paulus und Silas und sangen Gott Loblieder, und die Gefangenen hörten ihnen zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch ein aufmerksames Zuhören bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Gegen Mitternacht
  rationale: κατά mit dem Akkusativ der Zeit bezeichnet hier ungefähr den Zeitpunkt; „gegen Mitternacht“ ist im Deutschen natürlich und vermeidet eine übergenaue Festlegung. Das leicht weiterführende δέ braucht hier keine eigene Wiedergabe.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Paulus und Silas
  rationale: Gebräuchliche deutsche Namensformen.
- source_word: προσευχόμενοι
  choice: beteten
  rationale: Das Präsenspartizip bezeichnet eine gleichzeitig andauernde Handlung. Die koordinierte finite Form ist im Deutschen flüssig und wahrt den zeitlichen Zusammenhang mit ὕμνουν.
- source_word: ὕμνουν
  choice: sangen Loblieder
  rationale: ὑμνέω bezeichnet das Singen von Hymnen oder Lobgesängen; „Loblieder singen“ gibt diese spezifische Bedeutung natürlich wieder.
- source_word: τὸν θεόν
  choice: für Gott
  rationale: Bei „Loblieder singen“ bezeichnet „für Gott“ idiomatisch den, dem der Lobgesang gilt; „Gott loben“ wäre ebenfalls möglich, würde aber das ausdrückliche Singen weniger direkt abbilden.
- source_word: ἐπηκροῶντο
  choice: hörten ihnen zu
  rationale: Das Imperfekt beschreibt fortdauerndes Zuhören. Das Verb kann zugleich eine Nuance aufmerksamen oder gespannten Lauschens tragen, die in einer Fußnote bewahrt wird.
- source_word: οἱ δέσμιοι
  choice: die Gefangenen
  rationale: δέσμιοι bezeichnet Menschen in Haft beziehungsweise Fesseln; „die Gefangenen“ ist im Erzählzusammenhang klar und natürlich.
theological_decisions: []
