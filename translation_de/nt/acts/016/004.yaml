id: ACT.16.4
reference: Acts 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: de
  text: Als sie durch die Städte zogen, übergaben sie ihnen die Beschlüsse[a] zur Befolgung, die von den Aposteln und Ältesten in Jerusalem gefasst worden waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Entscheidungen“. Das griechische Wort bezeichnet hier die verbindlichen Beschlüsse der Versammlung in Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: durch die Städte zogen
  rationale: Das Imperfekt beschreibt das fortlaufende Reisen von Stadt zu Stadt; „durch die Städte zogen“ ist natürlich und wahrt den Verlaufssinn.
- source_word: παρεδίδοσαν
  choice: übergaben
  rationale: Das Verb bezeichnet hier die verbindliche Weitergabe bereits festgelegter Beschlüsse und bewahrt zugleich den Grundsinn des Übergebens.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Die pronominale Form des Griechischen bleibt erhalten, ohne den kontextuell erschließbaren Bezug ausdrücklich als Gemeinden oder Gläubige festzulegen.
- source_word: φυλάσσειν
  choice: zur Befolgung
  rationale: φυλάσσω meint hier das Einhalten bzw. Befolgen; die nominale Wendung verbindet sich im Deutschen idiomatisch mit „übergaben“.
- source_word: δόγματα
  choice: Beschlüsse
  rationale: „Beschlüsse“ gibt die verbindlichen Entscheidungen der Jerusalemer Versammlung wieder, ohne den späteren fachtheologischen Beiklang von „Dogmen“ einzutragen.
- source_word: κεκριμένα
  choice: gefasst worden waren
  rationale: 'Die deutsche Vorvergangenheit mit Passiv bildet das griechische Perfekt Passiv ab: Die Beschlüsse waren bereits gefasst und galten weiterhin.'
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: den Aposteln und Ältesten
  rationale: Dies sind die etablierten, verständlichen deutschen Bezeichnungen für die genannten Jerusalemer Leitungspersonen.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Die knappe Ortsangabe bezieht sich natürlich auf Apostel und Älteste und entspricht dem griechischen Präpositionalausdruck.
- source_word: ὡς δὲ
  choice: Als
  rationale: „Als“ gibt den temporalen Zusammenhang und den erzählerischen Fortgang ohne unnötige Zusatzmarkierung wieder.
theological_decisions:
- issue: Autorität der Jerusalemer Beschlüsse
  choice: Beschlüsse
  alternative: Anordnungen; Verordnungen; Dogmen
  rationale: Die Übersetzung lässt den verbindlichen Charakter der in Apostelgeschichte 15 gefassten Entscheidungen erkennen, vermeidet aber sowohl einen staatlich-rechtlichen Klang als auch die anachronistische Bedeutung späterer kirchlicher Dogmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Ablauf, bleibt aber idiomatisch. Der Fußnotenmarker steht nach dem vollständigen Satz, da die Anmerkung den Ausdruck „Beschlüsse“ erläutert.
