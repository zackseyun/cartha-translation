id: ACT.16.33
reference: Acts 16:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: de
  text: Noch in jener Stunde der Nacht nahm er sie zu sich und wusch ihnen die Wunden. Dann ließ er sich sofort taufen, er und alle, die zu seinem Haus gehörten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »er und alle die Seinen«; gemeint sind alle, die zu seinem häuslichen Personenkreis gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: nahm er sie zu sich
  rationale: Das Aoristpartizip bezeichnet eine der Wundversorgung vorausgehende Handlung. »Zu sich nehmen« ist natürlich und legt weder einen bestimmten Ort noch ein Beiseitenehmen fest.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: noch in jener Stunde der Nacht
  rationale: Die Formulierung bewahrt sowohl die nächtliche Stunde als auch den Nachdruck auf der unmittelbaren Reaktion.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: wusch ihnen die Wunden
  rationale: Die idiomatische deutsche Wiedergabe macht deutlich, dass die durch die Schläge entstandenen Verletzungen gewaschen wurden, ohne den ungewöhnlichen griechischen Anschluss mit ἀπό mechanisch nachzubilden.
- source_word: ἐβαπτίσθη
  choice: ließ er sich taufen
  rationale: Die im Deutschen natürliche Form gibt den griechischen Passiv wieder und vermeidet eine Festlegung auf eine bestimmte Taufweise.
- source_word: οἱ αὐτοῦ πάντες
  choice: alle, die zu seinem Haus gehörten
  rationale: Die Wendung umfasst den häuslichen Personenkreis und ist weiter als die moderne Kernfamilie; zugleich klingt sie im Deutschen natürlicher als »alle die Seinen«.
- source_word: παραχρῆμα
  choice: sofort
  rationale: Das Adverb betont die unverzügliche Taufe; »sofort« ist klar, knapp und gegenwartssprachlich.
theological_decisions:
- issue: Umfang von οἱ αὐτοῦ πάντες bei der Taufe
  choice: »alle, die zu seinem Haus gehörten« ohne Angaben zu Alter, persönlichem Bekenntnis oder Taufweise
  alternative: »seine ganze Familie« oder »sein ganzes Haus«
  rationale: Der Vers bezeugt die Taufe des Gefängnisaufsehers und seines gesamten häuslichen Personenkreises, entscheidet aber nicht ausdrücklich spätere Lehrfragen zur Haustaufe, Kindertaufe oder Taufweise.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bildet den raschen Handlungsablauf ab. »Haus« wird relational umschrieben, damit der umfassendere antike Haushalt nicht auf die heutige Kernfamilie verengt wird.
