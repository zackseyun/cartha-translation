  source_fidelity: Die zeitliche Vorordnung von λαβών, die harte Nuance von ἔβαλεν, die Haftanweisung und die Sicherung der Füße werden grundsätzlich zutreffend wiedergegeben. »innersten« ist jedoch stärker als das griechische Komparativum ἐσωτέραν, das einen weiter innen gelegenen Bereich bezeichnet. Die Umschreibung der hölzernen Vorrichtung sollte idiomatischer und eindeutiger als Fußblock gefasst werden.
  naturalness: »Schloss ihre Füße in den Holzblock« wirkt im modernen Standarddeutsch unidiomatisch. »Befestigte ihre Füße im Fußblock« ist klar, knapp und wahrt den Sinn. »Innerer Bereich des Gefängnisses« ist natürlich und bildet die räumliche Aussage ohne unnötige Steigerung ab.
  terminology: »Befehl«, »warf«, »Füße« und »Fußblock« sind registergerecht. Die Fußnote zu ξύλον erläutert die wörtliche Formulierung und die kontextuell gemeinte hölzerne Fesselvorrichtung, ohne deren genaue Bauart zu überbestimmen.
  issues:
