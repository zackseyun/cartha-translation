    issue: »innersten Teil« überträgt ἐσωτέραν als Superlativ.
    rationale: ἐσωτέραν ist morphologisch ein Komparativ („innerer/weiter innen gelegen“), nicht „innerster“. Die deutsche Formulierung sollte diese Steigerung nicht verstärken.
  - severity: medium
    issue: »schloss ihre Füße in den Holzblock« ist idiomatisch und semantisch unklar.
    rationale: Die Formulierung kann nahelegen, die Füße seien eingeschlossen worden, statt dass sie in einer hölzernen Fesselvorrichtung gesichert wurden. Eine Formulierung mit »befestigte« und »Fußblock« gibt ἠσφαλίσατο … εἰς τὸ ξύλον klarer wieder.
  - severity: low
