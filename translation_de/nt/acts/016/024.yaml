  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: de
  text: Nachdem er einen solchen Befehl erhalten hatte, warf er sie in den inneren Bereich des Gefängnisses[a] und befestigte ihre Füße im Fußblock[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in das innere Gefängnis«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in das Holz«; gemeint ist eine hölzerne Vorrichtung, mit der die Füße festgehalten wurden.'
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: einen solchen Befehl
  rationale: παραγγελία bezeichnet hier eine verbindliche Anweisung einer Autorität; »Befehl« ist im Deutschen natürlich und dem Haftkontext angemessen.
- source_word: λαβὼν
  choice: Nachdem er … erhalten hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Haupthandlung vorausgeht; ein temporaler Nebensatz gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: ἔβαλεν
  choice: warf
  rationale: βάλλω kann im Kontext »bringen« oder »stecken« bedeuten, doch »warf« bewahrt die Härte der Behandlung, ohne dem Text etwas hinzuzufügen.
- source_word: ἐσωτέραν φυλακήν
  choice: in den innersten Teil des Gefängnisses
  rationale: ἐσωτέραν bezeichnet den weiter innen gelegenen, besonders gesicherten Bereich. Die Wiedergabe bewahrt den räumlichen Sinn und vermeidet die mögliche Verengung auf eine einzelne Zelle.
- source_word: ἠσφαλίσατο
  choice: schloss
  rationale: ἀσφαλίζω bedeutet sichern oder festmachen. In Verbindung mit einem Holzblock ist »schloss … in« eine klare und idiomatische deutsche Formulierung.
- source_word: τοὺς πόδας αὐτῶν
  choice: ihre Füße
  rationale: πούς bedeutet unmittelbar »Fuß«; der Plural und die Zugehörigkeit werden entsprechend wiedergegeben.
- source_word: εἰς τὸ ξύλον
  choice: in den Holzblock
  rationale: ξύλον bedeutet wörtlich »Holz« beziehungsweise einen hölzernen Gegenstand. Im Gefängniskontext ist ein hölzernes Fesselgerät gemeint; »Holzblock« bleibt näher am Bild des griechischen Ausdrucks als der stärker konventionalisierte Ausdruck »Stock«.
