id: ACT.10.41
reference: Acts 10:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: de
  text: nicht dem ganzen Volk, sondern den Zeugen, die Gott im Voraus erwählt hatte[a] – uns, die wir mit ihm gegessen und getrunken haben, nachdem er von den Toten auferstanden war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Voraus bestimmt hatte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nachdem er von den Toten auferweckt worden war“. Der griechische Ausdruck wird hier natürlich mit „auferstanden war“ wiedergegeben; an anderen Stellen des Neuen Testaments steht ausdrücklich eine passive Formulierung.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: nicht dem ganzen Volk
  rationale: Die Wendung bezeichnet den Umfang derer, denen Jesus erschien. „Dem ganzen Volk“ ist im Deutschen natürlich und bewahrt den Gegensatz zur begrenzten Gruppe der Zeugen.
- source_word: μάρτυσι
  choice: den Zeugen
  rationale: μάρτυς bezeichnet hier Menschen, die aufgrund des Erlebten Zeugnis ablegen; „Zeugen“ ist die klare und übliche Wiedergabe.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: die Gott im Voraus erwählt hatte
  rationale: Das Perfektpassiv bezeichnet eine vorausgehende göttliche Auswahl mit fortdauernder Bedeutung. Die aktive deutsche Form nennt Gott weiterhin ausdrücklich als Handelnden und klingt natürlicher als eine schwere Passivkonstruktion.
- source_word: ἡμῖν
  choice: uns
  rationale: Das Dativpronomen steht erläuternd zu „Zeugen“. Der Gedankenstrich macht diese Apposition im Deutschen deutlich.
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: die wir mit ihm gegessen und getrunken haben
  rationale: Die συν-Komposita betonen die gemeinsame Mahlgemeinschaft. Die konkrete Formulierung wahrt zugleich den körperlichen Charakter der Begegnung nach der Auferstehung.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: nachdem er von den Toten auferstanden war
  rationale: Die Konstruktion mit μετά ist temporal, und ἀναστῆναι wird hier natürlich intransitiv als „auferstehen“ verstanden. Das Plusquamperfekt entspricht idiomatischem Deutsch nach „nachdem“ und ordnet das Ereignis zeitlich vor dem gemeinsamen Essen und Trinken ein.
theological_decisions:
- issue: Formulierung der Auferstehung in ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: nachdem er von den Toten auferstanden war
  alternative: nachdem er von den Toten auferweckt worden war
  rationale: Die griechische Form wird an dieser Stelle am unmittelbarsten intransitiv wiedergegeben. Damit wird die andernorts ausdrücklich genannte göttliche Urheberschaft der Auferstehung weder ausgeschlossen noch eigens in diesen Vers eingetragen.
- issue: Bedeutungsumfang von προκεχειροτονημένοις
  choice: im Voraus erwählt
  alternative: im Voraus bestimmt
  rationale: Das Verb kann Auswahl oder vorherige Bestimmung bezeichnen. „Erwählt“ passt zum Kontext der begrenzten Zeugengruppe; die mögliche Nuance der Beauftragung beziehungsweise Bestimmung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Versform bleibt als syntaktische Fortsetzung des vorhergehenden Satzes kleingeschrieben. Der Gedankenstrich kennzeichnet die erläuternde Apposition „uns“; die konkrete Wendung „gegessen und getrunken“ wird ohne Abschwächung bewahrt.
