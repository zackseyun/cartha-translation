id: ACT.10.22
reference: Acts 10:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: de
  text: 'Sie sagten: „Der Hauptmann Kornelius ist ein gerechter, gottesfürchtiger Mann, dem das ganze jüdische Volk[a] ein gutes Zeugnis ausstellt. Ein heiliger Engel hat ihm die Weisung gegeben[b], dich in sein Haus zu rufen und Worte von dir zu hören[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das ganze Volk der Juden“. Das griechische Wort bezeichnet hier eine Volksgemeinschaft, nicht notwendig einen modernen Staat.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat ihm eine göttliche Mitteilung zukommen lassen“. Das griechische Verb bezeichnet hier eine Mitteilung oder Weisung göttlichen Ursprungs.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu hören, was du zu sagen hast“. Wörtlich: „Worte von dir zu hören“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: Hauptmann
  rationale: Die etablierte deutsche Bibel- und Geschichtsbezeichnung gibt den Rang eines römischen Zenturios verständlich wieder.
- source_word: ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεόν
  choice: ein gerechter, gottesfürchtiger Mann
  rationale: Bewahrt sowohl die moralische Aussage von δίκαιος als auch die religiöse Charakterisierung durch φοβούμενος τὸν θεόν, ohne Kornelius’ theologischen Status näher zu bestimmen.
- source_word: μαρτυρούμενος
  choice: dem … ein gutes Zeugnis ausstellt
  rationale: Gibt das passive Empfangen eines positiven Zeugnisses idiomatisch und zugleich quellennah wieder.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: von dem ganzen jüdischen Volk
  rationale: ἔθνος bezeichnet hier die Volksgemeinschaft und nicht notwendig einen modernen Nationalstaat.
- source_word: ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου
  choice: Ein heiliger Engel hat ihm die Weisung gegeben
  rationale: Drückt die göttliche Mitteilung durch den ausdrücklich als heilig bezeichneten Engel natürlich aus, ohne sie auf eine Warnung zu verengen.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: dich in sein Haus zu rufen
  rationale: Gibt das Veranlassen, dass Petrus zu Kornelius kommt, knapp und idiomatisch wieder; „Haus“ bewahrt den konkreten Ausdruck οἶκος.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: Worte von dir zu hören
  rationale: Bleibt nah an ῥήματα und vermeidet es, den Inhalt bereits als Predigt oder förmliche Botschaft festzulegen.
theological_decisions:
- issue: Beschreibung der Frömmigkeit des Kornelius
  choice: ein gerechter, gottesfürchtiger Mann
  alternative: ein frommer Mann
  rationale: Die gewählte Fassung erhält beide griechischen Beschreibungen und lässt offen, welche weiteren heilsgeschichtlichen oder soteriologischen Folgerungen daraus zu ziehen sind.
- issue: Art der Engelmitteilung
  choice: hat ihm die Weisung gegeben
  alternative: hat ihn gewarnt / ihm eine göttliche Botschaft übermittelt
  rationale: Im Kontext handelt es sich um eine göttliche Anweisung, nicht erkennbar um eine Warnung; die Formulierung wahrt jedoch den Charakter einer vermittelten himmlischen Mitteilung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hauptmann“ ist historisch und biblisch vertraut; „ein gutes Zeugnis ausstellen“ bewahrt den Zeugnischarakter des griechischen Ausdrucks. Die direkte Rede bleibt gut verständlich, ohne die religiösen Bezeichnungen oder die Engelmitteilung konfessionell auszudeuten.
