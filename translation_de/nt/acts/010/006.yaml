source:
  edition: SBLGNT
  text: οὗτος ξενίζεται παρά τινι Σίμωνι βυρσεῖ, ᾧ ἐστιν οἰκία παρὰ θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: de
  text: Er ist bei einem gewissen Simon zu Gast[a], einem Gerber, dessen Haus am Meer liegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er hält sich bei einem gewissen Simon auf, einem Gerber.'
    reason: Lexikalische Alternative für ξενίζεται; die Form kann den Gaststatus oder allgemeiner den Aufenthalt bei jemandem ausdrücken.
lexical_decisions:
- source_word: οὗτος
  choice: Er
  rationale: Das Demonstrativpronomen verweist im Zusammenhang auf Petrus; im natürlichen Deutschen ist hier das Personalpronomen angemessen.
- source_word: ξενίζεται
  choice: ist … zu Gast
  rationale: Die mediale/passive Form bezeichnet hier, dass jemand als Gast aufgenommen ist beziehungsweise sich als Gast bei jemandem aufhält. Die Wendung bewahrt diesen Sinn natürlicher als ein bloßes „bleibt“.
- source_word: παρά τινι
  choice: bei einem gewissen
  rationale: παρά mit Dativ bezeichnet den Aufenthalt bei einer Person; τις lässt diese Person zunächst unbestimmt. „Bei einem gewissen“ gibt beides knapp wieder.
- source_word: Σίμωνι
  choice: Simon
  rationale: Der Personenname wird nach üblicher deutscher Form wiedergegeben.
- source_word: βυρσεῖ
  choice: einem Gerber
  rationale: βυρσεύς bezeichnet einen Handwerker, der Tierhäute gerbt; „Gerber“ ist die präzise und geläufige deutsche Berufsbezeichnung.
- source_word: ᾧ ἐστιν οἰκία
  choice: dessen Haus … liegt
  rationale: Die griechische Relativkonstruktion bezeichnet Simon als Besitzer beziehungsweise Bewohner des genannten Hauses; diese Wiedergabe ist knapp und idiomatisch.
- source_word: παρὰ θάλασσαν
  choice: am Meer
  rationale: παρά mit Akkusativ bezeichnet hier unmittelbare räumliche Nähe. „Am Meer“ ist im Deutschen die natürliche Ortsangabe.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Konstruktion „zu Gast sein“ bewahrt den im griechischen Verb enthaltenen Gedanken der Aufnahme als Gast.
