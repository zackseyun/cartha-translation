  text: ἐν ᾧ ὑπῆρχεν πάντα τὰ τετράποδα ⸂καὶ ἑρπετὰ τῆς γῆς καὶ⸃ πετεινὰ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: de
  text: Darin befanden sich alle vierfüßigen Tiere, die Kriechtiere der Erde[a] und die Vögel des Himmels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die kriechenden Tiere der Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Darin
  rationale: Das Relativpronomen verweist auf das zuvor gesehene Behältnis beziehungsweise Tuch. „Darin“ gibt den örtlichen Sinn knapp und natürlich wieder.
- source_word: ὑπῆρχεν
  choice: befanden sich
  rationale: Das Imperfekt bezeichnet hier das Vorhandensein der Tiere in dem gesehenen Gegenstand. „Befanden sich“ ist im Deutschen natürlicher als ein bloßes „waren“ und vermeidet das stärkere, auslegende „enthielt“.
- source_word: πάντα
  choice: alle
  rationale: „Alle“ bewahrt den umfassenden Wortlaut, ohne ausdrücklich „alle Arten von“ einzutragen, was zwar sinngemäß möglich, aber interpretierender wäre.
- source_word: τὰ τετράποδα
  choice: vierfüßigen Tiere
  rationale: Die Formulierung ist allgemeinverständlich und gibt die wörtliche Bedeutung wieder, ohne den fachsprachlichen Ausdruck „Vierfüßer“ zu verwenden.
- source_word: ἑρπετὰ τῆς γῆς
  choice: Kriechtiere der Erde
  rationale: „Kriechtiere“ bewahrt die breite, nicht auf die moderne zoologische Klasse der Reptilien beschränkte Bedeutung von ἑρπετά. „Der Erde“ bildet den Genitiv und die biblische Einteilung der Lebewesen ab.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: Vögel des Himmels
  rationale: Im Zusammenhang der Tiergruppen ist „Vögel“ die natürliche Wiedergabe von πετεινά. „Des Himmels“ bewahrt die traditionelle räumliche Ausdrucksweise, wobei hier der sichtbare Himmel gemeint ist.
- source_word: καὶ ... καὶ
  choice: und ... und
  rationale: Die Aufzählung wird durch wiederholtes „und“ entsprechend der griechischen Koordination wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die breite Bedeutung von ἑρπετά bleibt erhalten; eine Beschränkung auf Reptilien im heutigen zoologischen Sinn wird vermieden.
