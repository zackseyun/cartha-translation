id: ACT.10.34
reference: Acts 10:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: de
  text: 'Da öffnete Petrus den Mund und sagte: »In Wahrheit erkenne ich[a], dass Gott niemanden bevorzugt[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wahrhaftig begreife ich«; auch: »In Wahrheit nehme ich wahr«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »dass Gott kein Anseher der Person ist«; gemeint ist, dass er niemandem aus Ansehen, Herkunft oder Stellung Parteilichkeit erweist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: öffnete ... den Mund
  rationale: Die im Griechischen feierliche Redeformel wird beibehalten. Sie ist auch im Deutschen verständlich und bewahrt das rhetorische Gewicht des Satzanfangs.
- source_word: δὲ
  choice: Da
  rationale: Hier führt δέ die Erzählung weiter. »Da« verbindet den Ausspruch natürlich mit der vorausgehenden Szene, ohne einen starken Gegensatz einzutragen.
- source_word: Ἐπ’ ἀληθείας
  choice: In Wahrheit
  rationale: Die Wendung unterstreicht die Echtheit und Gewissheit von Petrus’ Einsicht. »In Wahrheit« ist würdevoll, verständlich und liegt nahe an der griechischen Formulierung.
- source_word: καταλαμβάνομαι
  choice: erkenne ich
  rationale: Das Verb bezeichnet hier ein Erfassen oder Begreifen. »Erkenne« lässt sowohl eine gegenwärtige Einsicht als auch einen fortschreitenden Erkenntnisprozess zu, ohne das im Griechischen nicht ausdrücklich vorhandene »jetzt« einzufügen.
- source_word: προσωπολήμπτης
  choice: niemanden bevorzugt
  rationale: Das Substantiv bezeichnet jemanden, der nach der Person urteilt und einzelnen Menschen Parteilichkeit erweist. Die verbale deutsche Formulierung gibt den Sinn klar und natürlich wieder.
- source_word: ὁ θεός
  choice: Gott
  rationale: Dies ist die übliche und sachlich genaue Wiedergabe von θεός; der bestimmte Artikel muss im Deutschen nicht eigens abgebildet werden.
theological_decisions:
- issue: Aussage über Gottes Unparteilichkeit ohne zusätzliche dogmatische Festlegung
  choice: dass Gott niemanden bevorzugt
  alternative: dass Gott die Person nicht ansieht
  rationale: Die Formulierung hält die Aussage fest, dass Gott Menschen nicht aufgrund ihres Ansehens oder ihrer Gruppenzugehörigkeit bevorzugt. Sie legt nicht über den unmittelbaren Zusammenhang hinaus fest, wie diese Unparteilichkeit in einem späteren theologischen System einzuordnen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche griechische Redeformel »öffnete ... den Mund« bleibt bewusst erhalten; die Aussage über Gottes Unparteilichkeit wird dagegen in einer unmittelbar verständlichen deutschen Wendung ausgedrückt.
