  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: de
  text: Da wurde er sehr hungrig und wollte etwas essen[a]. Während sie es zubereiteten, überkam ihn eine Trance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wollte kosten«; das griechische Verb bezeichnet hier das Essen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Eine Verzückung überkam ihn«. Das griechische Wort bezeichnet hier einen außergewöhnlichen Bewusstseinszustand, der mit einer Offenbarungsvision verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο … πρόσπεινος
  choice: wurde … sehr hungrig
  rationale: Die Verbindung bezeichnet den Eintritt eines Zustands; πρόσπεινος ist stärker als bloß »hungrig«.
- source_word: ἤθελεν γεύσασθαι
  choice: wollte etwas essen
  rationale: γεύομαι bedeutet wörtlich »kosten«, bezeichnet hier aber im Zusammenhang das Essen; »etwas« gibt das im Deutschen erforderliche implizite Objekt zurück.
- source_word: παρασκευαζόντων … αὐτῶν
  choice: Während sie es zubereiteten
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitige Handlung. Das Pronomen »es« verweist natürlich auf das erwartete Essen, ohne dieses näher zu bestimmen.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: geriet er in
  rationale: Die Wendung beschreibt das Einsetzen eines Zustands, der Petrus erfasst; zusammen mit »Verzückung« ist diese Formulierung idiomatisches Deutsch.
- source_word: ἔκστασις
  choice: Verzückung
  rationale: Das Wort bezeichnet hier angesichts der anschließenden Offenbarungsvision einen außergewöhnlichen Bewusstseinszustand, nicht bloß Erstaunen. »Verzückung« wahrt zugleich die Nähe zum griechischen Ausdruck.
theological_decisions:
- issue: Art des durch ἔκστασις bezeichneten visionären Zustands
  choice: Verzückung
  alternative: Trance; Entrückung; Erstaunen
  rationale: Der unmittelbare Kontext spricht für einen veränderten Bewusstseinszustand im Zusammenhang mit einer Offenbarungsvision. »Verzückung« beschreibt diesen, ohne eine spätere mystische Theorie einzutragen; die Fußnote nennt die verständliche Alternative »Trance«.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem griechischen Ablauf, ohne im Deutschen schwerfällig zu wirken.
