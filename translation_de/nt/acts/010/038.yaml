  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: de
  text: 'Jesus von Nazaret: wie Gott ihn mit Heiligem Geist und Kraft salbte; er zog umher, tat Gutes und heilte alle, die vom Teufel unterdrückt wurden, weil Gott mit ihm war.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Satzbau knüpft an den vorausgehenden Zusammenhang an und kann auch enger wiedergegeben werden: „Jesus von Nazaret – wie Gott ihn mit Heiligem Geist und Kraft salbte –, der umherzog, Gutes tat und alle heilte, die vom Teufel unterdrückt wurden, weil Gott mit ihm war.“'
    reason: syntaktische_alternative
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Jesus von Nazaret
  rationale: Die Wendung kennzeichnet Jesus nach seiner Herkunft. „Von Nazaret“ ist im Deutschen idiomatisch und entspricht dem Sinn von ἀπό.
- source_word: ὡς
  choice: wie
  rationale: ὡς leitet hier die nähere Darstellung dessen ein, was Gott an Jesus tat. „Wie“ bewahrt die erzählend-erklärende Funktion.
- source_word: ἔχρισεν
  choice: salbte
  rationale: „Salben“ gibt χρίω unmittelbar wieder und erhält dessen messianischen und geistbezogenen Klang, ohne eine zusätzliche Lehrdeutung einzutragen.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: mit Heiligem Geist und Kraft
  rationale: Der Dativ bezeichnet das Mittel beziehungsweise die Ausstattung. „Heiliger Geist“ bleibt vom ebenfalls genannten Begriff „Kraft“ unterschieden.
- source_word: διῆλθεν εὐεργετῶν
  choice: er zog umher, tat Gutes
  rationale: διέρχομαι beschreibt hier Jesu Wirken von Ort zu Ort; εὐεργετέω bezeichnet wohltätiges, gutes Handeln. Die koordinierte Form klingt im modernen Deutschen natürlicher als eine enge Partizipialkonstruktion.
- source_word: ἰώμενος πάντας τοὺς καταδυναστευομένους
  choice: und heilte alle, die … unterdrückt wurden
  rationale: „Heilte“ gibt ἰάομαι direkt wieder; „unterdrückt“ bringt die gewaltsame Beherrschung durch καταδυναστεύω verständlich zum Ausdruck.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: vom Teufel
  rationale: διάβολος bezeichnet hier den persönlichen Widersacher; „der Teufel“ ist die klare und etablierte deutsche Wiedergabe.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: weil Gott mit ihm war
  rationale: ὅτι begründet hier Jesu heilendes und wohltätiges Wirken. „Weil“ macht diesen kausalen Zusammenhang deutlich.
theological_decisions:
- issue: Verhältnis von Jesu Salbung zu seiner Identität und Sendung
  choice: Die Aussage wird mit „salbte“ wiedergegeben, ohne sie zu „zum Messias ernannte“ oder bloß zu „ermächtigte“ auszudeuten.
  alternative: „zum Messias ernannte“ oder „mit Kraft ausstattete“
  rationale: Der Text spricht ausdrücklich von einer Salbung mit Heiligem Geist und Kraft. Die unmittelbare Wiedergabe erhält die biblisch-theologische Spannung, ohne über den Vers hinauszugehen.
- issue: Bezug von πνεύματι ἁγίῳ
  choice: „Heiliger Geist“ wird als Bezeichnung des göttlichen Geistes wiedergegeben und von „Kraft“ unterschieden.
  alternative: „heiliger Geist“ als unpersönliche geistige Kraft
  rationale: Im Sprachgebrauch der Apostelgeschichte bezeichnet die Wendung regelmäßig den Heiligen Geist; zudem nennt der Vers Geist und Kraft nebeneinander.
- issue: Kausale Aussage über Gottes Gegenwart
  choice: „weil Gott mit ihm war“ bleibt als Begründung für Jesu Wirken stehen.
  alternative: „denn Gott war mit ihm“ als weniger ausdrücklich untergeordnete Begründung
  rationale: Die Übersetzung bewahrt den kausalen Sinn von ὅτι, ohne aus der Aussage weitergehende christologische Folgerungen abzuleiten oder sie abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt und das Semikolon bilden die gedrängte griechische Struktur lesbar ab; die Fußnote weist darauf hin, dass der Vers syntaktisch an den vorausgehenden Satz anschließt.
