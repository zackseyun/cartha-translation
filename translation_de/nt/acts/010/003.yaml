id: ACT.10.3
reference: Acts 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: de
  text: 'In einer Vision sah er deutlich[a], wie etwa um die neunte Stunde des Tages ein Engel Gottes zu ihm hereinkam und zu ihm sagte: »Kornelius.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das heißt nach heutiger Zeitrechnung etwa um drei Uhr nachmittags. φανερῶς (»deutlich«) kennzeichnet das Sehen als klar; dem Sinn nach kann es auch die Klarheit des Visionserlebnisses hervorheben.
    reason: Kulturhinweis zur antiken Stundenrechnung und präzisierter Hinweis auf die mögliche Reichweite von φανερῶς.
lexical_decisions:
- source_word: εἶδεν
  choice: sah er
  rationale: Der Aorist von ὁράω bezeichnet hier im erzählenden Rückblick ein konkretes Sehen.
- source_word: ἐν ὁράματι
  choice: in einer Vision
  rationale: ὅραμα bezeichnet eine Vision beziehungsweise eine übernatürliche Erscheinung, ohne die genaue Erlebnisweise näher festzulegen.
- source_word: φανερῶς
  choice: deutlich
  rationale: Das Adverb kennzeichnet das Wahrgenommene als klar und unverkennbar. Seine Stellung lässt einen Bezug auf das Sehen beziehungsweise die Vision zu.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: etwa um die neunte Stunde des Tages
  rationale: ὡσεὶ und περὶ markieren eine ungefähre Zeitangabe; die antike Stundenbezeichnung bleibt im Haupttext erhalten.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: ein Engel Gottes
  rationale: Im ausdrücklich visionären Zusammenhang bezeichnet ἄγγελος einen himmlischen Boten; »Engel Gottes« ist dafür die natürliche und präzise deutsche Wiedergabe.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: zu ihm hereinkam
  rationale: Die Wiedergabe bewahrt sowohl die Bewegung des Eintretens als auch die Ausrichtung auf Kornelius und klingt im Deutschen natürlich.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: und zu ihm sagte
  rationale: Obwohl im Griechischen ein zweites Partizip steht, gibt ein finites Verb die abhängige Wahrnehmungskonstruktion im Deutschen flüssig und eindeutig wieder.
- source_word: Κορνήλιε
  choice: Kornelius!
  rationale: Der griechische Vokativ wird mit der üblichen deutschen Namensform und einem Anredezeichen wiedergegeben.
theological_decisions:
- issue: Art des ἄγγελος im Kontext
  choice: himmlischer Engel
  alternative: menschlicher Bote
  rationale: Die Vision und die Bezeichnung »Gottes« weisen in diesem Zusammenhang klar auf ein übernatürliches Wesen, ohne dessen Natur weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Seh-Konstruktion mit »wie« bildet die griechischen Akkusativ-Partizipien idiomatisch ab. Die antike Zeitangabe bleibt aus Gründen der Quellennähe im Haupttext und wird in der Fußnote erläutert.
