  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: de
  text: Und die beschnittenen Gläubigen[a], die mit Petrus gekommen waren, waren zutiefst erstaunt, weil die Gabe des Heiligen Geistes sogar[b] über die Nichtjuden ausgegossen worden war[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Gläubigen aus der Beschneidung“, das heißt die jüdischen Gläubigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auch“. Das griechische Wort kann eine Hinzufügung ausdrücken; hier hebt es wahrscheinlich das Überraschende hervor: „sogar über die Nichtjuden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ausgegossen worden ist“. Der griechische Perfekt hebt eine abgeschlossene Handlung mit fortdauerndem Ergebnis hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: waren außer sich vor Staunen
  rationale: Das Verb bezeichnet hier starkes Erstaunen. Die Formulierung gibt die Intensität natürlich wieder, ohne einen Verlust der Selbstbeherrschung als eigenständige Aussage zu behaupten.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: die beschnittenen Gläubigen
  rationale: Gemeint sind die jüdischen Gläubigen als durch die Beschneidung gekennzeichnete Gruppe. Diese Wiedergabe ist im Deutschen verständlicher als die wörtliche Formulierung „die Gläubigen aus der Beschneidung“; die wörtliche Struktur bleibt in der Fußnote sichtbar.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: die mit Petrus gekommen waren
  rationale: Der Relativsatz grenzt die betreffende Gruppe ein und drückt Begleitung aus. Das Plusquamperfekt fügt sich natürlich in den deutschen Erzählzusammenhang ein.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: sogar über die Nichtjuden
  rationale: ἔθνη bezeichnet in diesem Zusammenhang die Menschen außerhalb des jüdischen Volkes. „Sogar“ bringt die durch καί hervorgehobene überraschende Einbeziehung zum Ausdruck, während die additive Lesart in der Fußnote erhalten bleibt.
- source_word: ἡ δωρεὰ
  choice: die Gabe
  rationale: δωρεά bezeichnet eine frei gewährte Gabe. „Gabe“ ist knapp, würdig und im Zusammenhang eindeutig.
- source_word: τοῦ ἁγίου πνεύματος
  choice: des Heiligen Geistes
  rationale: Dies ist die klare und konfessionsübergreifend übliche moderne deutsche Wiedergabe der Genitivverbindung.
- source_word: ἐκκέχυται
  choice: ausgegossen worden war
  rationale: Das Passiv bewahrt das biblische Bild des Ausgießens. Das Plusquamperfekt bezeichnet im deutschen Erzählfluss das bereits eingetretene Geschehen, dessen Wirkung die Anwesenden wahrnahmen; die stärker resultative Wiedergabe steht in der Fußnote.
theological_decisions:
- issue: Bedeutung von ἔθνη im heilsgeschichtlichen Zusammenhang
  choice: Nichtjuden
  alternative: Völker
  rationale: Apostelgeschichte 10 stellt jüdische Gläubige den nichtjüdischen Empfängern des Geistes gegenüber. „Nichtjuden“ macht diesen konkreten Gegensatz deutlich, ohne ἔθνη allgemein auf politische Nationen zu verengen.
- issue: Aspekt von ἐκκέχυται
  choice: ausgegossen worden war
  alternative: ausgegossen worden ist
  rationale: Der griechische Perfekt bezeichnet eine vollzogene Ausgießung mit fortbestehendem Ergebnis. Im deutschen Erzählzusammenhang ist das Plusquamperfekt natürlich; die alternative Perfektform bildet den fortwirkenden Ergebniszustand unmittelbarer ab und wird deshalb als Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die ungewöhnliche Gruppenbezeichnung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote formal offengelegt. Das Bild des Ausgießens sowie die starke Reaktion der jüdischen Gläubigen bleiben erhalten.
