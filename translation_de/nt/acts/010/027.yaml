  text: καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: de
  text: Während er sich mit ihm unterhielt, ging er hinein und fand viele versammelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit historischem Präsens: „Während er sich mit ihm unterhielt, ging er hinein und findet viele versammelt.“ Das griechische Präsens „findet“ macht die Erzählung anschaulicher.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: während er sich mit ihm unterhielt
  rationale: Das Präsenspartizip bezeichnet eine Handlung, die gleichzeitig mit dem Hineingehen stattfindet. Die reflexive deutsche Wendung gibt den wechselseitigen Charakter des Gesprächs natürlich wieder.
- source_word: αὐτῷ
  choice: mit ihm
  rationale: Der Dativ bezeichnet bei συνομιλέω die Person, mit der jemand spricht; „mit ihm“ entspricht dem deutschen Sprachgebrauch.
- source_word: εἰσῆλθεν
  choice: ging er hinein
  rationale: Der Aorist führt die Erzählung mit dem nächsten Ereignis fort. „Hineingehen“ ist im Deutschen natürlich und wahrt die räumliche Bewegung.
- source_word: εὑρίσκει
  choice: fand
  rationale: Das historische Präsens wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben; seine anschauliche Form wird in der Fußnote kenntlich gemacht.
- source_word: συνεληλυθότας
  choice: versammelt
  rationale: Das Perfektpartizip beschreibt die vielen Menschen als bereits zusammengekommen und nun anwesend. „Versammelt“ gibt diesen resultativen Zustand knapp wieder.
- source_word: πολλούς
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet viele Personen. Im Deutschen ist „viele“ in diesem Zusammenhang eindeutig; „dort“ macht zugleich den vorgefundenen Zustand idiomatisch deutlich.
