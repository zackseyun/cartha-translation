translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bildet die Gleichzeitigkeit des Gesprächs und des Hineingehens ab; das historische Präsens wird zugunsten natürlicher deutscher Erzählweise im Haupttext als Präteritum wiedergegeben und in der Fußnote dokumentiert.
