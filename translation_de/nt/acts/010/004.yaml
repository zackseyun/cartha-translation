  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: de
  text: 'Er blickte ihn unverwandt an, bekam Angst und sagte: »Was ist es, Herr?« Er sagte zu ihm: »Deine Gebete und deine Gaben für die Armen[a] sind als Erinnerung vor Gott aufgestiegen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich näher: »Almosen«; gemeint sind barmherzige Gaben für Bedürftige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: blickte ihn unverwandt an
  rationale: Das Partizip bezeichnet einen festen, aufmerksamen Blick. »Unverwandt anblicken« gibt dessen Intensität in natürlichem, gehobenem Deutsch wieder.
- source_word: ἔμφοβος γενόμενος
  choice: bekam Angst
  rationale: Die Formulierung drückt den Eintritt in einen Zustand der Furcht aus. »Bekam Angst« wahrt diesen ingressiven Sinn, ohne die Stärke als Entsetzen zu überzeichnen.
- source_word: Τί ἐστιν
  choice: Was ist
  rationale: Die knappe Frage erkundigt sich danach, was vorliegt oder was der himmlische Bote will. »Was ist?« ist direkt und im Deutschen idiomatisch.
- source_word: κύριε
  choice: Herr
  rationale: »Herr« bewahrt die ehrerbietige Anrede und den erhöhten Ton; hier muss das Wort keine christologische Aussage enthalten.
- source_word: προσευχαί
  choice: Gebete
  rationale: Dies ist die direkte und kontextgemäße Wiedergabe.
- source_word: ἐλεημοσύναι
  choice: Gaben für die Armen
  rationale: Das Wort bezeichnet besonders barmherzige Unterstützung beziehungsweise Spenden für Bedürftige. Die Formulierung ist im modernen Deutsch klarer als »Almosen«.
- source_word: ἀνέβησαν
  choice: sind ... aufgestiegen
  rationale: Die Übersetzung erhält das Bild der Aufwärtsbewegung, das an Gebets- und Opferbilder erinnert.
- source_word: εἰς μνημόσυνον
  choice: sodass er ihrer gedenkt
  rationale: Die funktionale Formulierung gibt den Erinnerungsgedanken verständlich wieder, ohne eine bestimmte kultische Opferkategorie in den Text einzutragen.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: zu Gott
  rationale: In Verbindung mit »aufgestiegen« ist »zu Gott« natürliches Deutsch und vermittelt, dass Gebete und Gaben vor ihn gelangt sind.
theological_decisions:
- issue: Bedeutung von κύριε in der Anrede des Kornelius
  choice: Herr
  alternative: mein Herr; Herr im Sinn von »mein Herr/Sir«
  rationale: Die ehrerbietige Anrede an die himmlische Gestalt bleibt erhalten, ohne sie im Haupttext ausdrücklich als christologisches Bekenntnis festzulegen.
- issue: Sinn von εἰς μνημόσυνον vor Gott
  choice: sodass Gott ihrer gedenkt
  alternative: als eine Erinnerungsgabe vor Gott
  rationale: Der Erinnerungsgedanke und der mögliche kultische Nachklang bleiben erkennbar, doch die Übersetzung vermeidet es, die Gebete und Gaben ausdrücklich zu einem technischen Opferbegriff zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp gehalten. »Der Engel« macht im Deutschen den aus dem unmittelbaren Kontext eindeutig erschließbaren Sprecher natürlich kenntlich; das griechische Pronomen selbst lautet lediglich »er«.
