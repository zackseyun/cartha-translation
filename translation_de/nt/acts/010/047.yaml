id: ACT.10.47
reference: Acts 10:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: de
  text: Kann etwa jemand diesen Menschen, die den Heiligen Geist ebenso empfangen haben wie wir, das Wasser verweigern und so verhindern, dass sie getauft werden?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μήτι
  choice: Kann etwa jemand …?
  rationale: Die Fragepartikel leitet eine rhetorische Frage ein, auf die eine verneinende Antwort erwartet wird. „Kann etwa jemand …?“ gibt diese Erwartung im heutigen Deutsch natürlich wieder.
- source_word: τὸ ὕδωρ
  choice: das Wasser
  rationale: Der Artikel und der konkrete Bezug auf das bei der Taufe verwendete Wasser bleiben erhalten.
- source_word: δύναται κωλῦσαί τις
  choice: kann jemand … verweigern und so verhindern
  rationale: κωλύω kann „hindern“, „verwehren“ oder „verhindern“ bedeuten. Bei „Wasser“ ist „verweigern“ idiomatisch; zusammen mit dem folgenden Infinitiv verdeutlicht „verhindern“ die beabsichtigte Folge.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: und so verhindern, dass sie getauft werden
  rationale: Der negierte passive Infinitiv bezeichnet hier die verhinderte Handlung. Die deutsche Nebensatzkonstruktion bewahrt das Passiv und den Sinn des Hinderns.
- source_word: τούτους
  choice: diesen Menschen
  rationale: Die Form verweist auf die anwesende Personengruppe. „Menschen“ ist natürlich und legt über den Kontext hinaus kein ausschließlich männliches Geschlecht fest.
- source_word: οἵτινες
  choice: die
  rationale: Das Relativpronomen kennzeichnet die Betroffenen durch ihren Empfang des Geistes. Die Übersetzung als Relativsatz bewahrt die grammatische Offenheit zwischen bloßer Beschreibung und begründendem Unterton.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: den Heiligen Geist
  rationale: Dies ist die etablierte und sachlich genaue moderne deutsche Wiedergabe.
- source_word: ἔλαβον
  choice: empfangen haben
  rationale: Das Perfekt im Deutschen bezeichnet ein abgeschlossenes Geschehen mit fortdauernder Bedeutung für das gegenwärtige Argument.
- source_word: ὡς καὶ ἡμεῖς
  choice: ebenso … wie wir
  rationale: Die Formulierung gibt den ausdrücklichen Vergleich zwischen ihrem Geistempfang und dem der jüdischen Gläubigen knapp und natürlich wieder.
theological_decisions:
- issue: Verhältnis von Geistempfang und Wassertaufe
  choice: Der bereits erfolgte Empfang des Heiligen Geistes wird als Grund dafür wiedergegeben, diesen Menschen das Wasser und damit die Taufe nicht zu verweigern.
  alternative: Eine Formulierung, welche die zeitliche Abfolge von Geistempfang und Taufe verdeckt oder beide Vorgänge systematisch miteinander gleichsetzt.
  rationale: Im Erzählzusammenhang haben diese Menschen den Heiligen Geist bereits empfangen; daraufhin argumentiert Petrus gegen die Verweigerung ihrer Wassertaufe. Die Übersetzung erhält diese Abfolge, ohne daraus eine konfessionelle Lehre abzuleiten.
- issue: Funktion von οἵτινες
  choice: Ein Relativsatz mit „die“
  alternative: Eine ausdrücklich kausale Wiedergabe wie „weil sie“ oder „da sie“
  rationale: Der Zusammenhang legt einen begründenden Unterton nahe, doch die griechische Form bleibt ein Relativsatz. Die Übersetzung bewahrt diese Spannung, statt die kausale Deutung festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung wurde für flüssiges Deutsch angepasst, während rhetorische Frage, Wasserbezug, passiver Taufvorgang und Vergleich des Geistempfangs erhalten bleiben.
