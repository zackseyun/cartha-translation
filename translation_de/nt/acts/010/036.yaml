source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: de
  text: Die Botschaft, die er den Söhnen Israels sandte, indem er Frieden durch Jesus, den Messias, verkündete – dieser ist Herr über alle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Botschaft, die er den Kindern Israels sandte, als er die gute Nachricht vom Frieden durch Jesus Christus verkündete – er ist Herr über alle.“'
    reason: Die Fußnote dokumentiert die idiomatische kollektive Wiedergabe von „Söhne Israels“, den ausdrücklich guten-Nachricht-Charakter von εὐαγγελίζομαι, die traditionelle Transliteration „Christus“ und die natürlichere, aber weniger nachdrückliche Wiedergabe von οὗτός mit „er“.
lexical_decisions:
- source_word: τὸν λόγον
  choice: die Botschaft
  rationale: λόγος bezeichnet hier den von Gott an Israel gesandten Verkündigungsinhalt; „Botschaft“ ist im heutigen Deutsch natürlicher als „Wort“, ohne den Sinn einzuengen.
- source_word: ὃν ἀπέστειλεν
  choice: die er … sandte
  rationale: Die Relativkonstruktion wird direkt wiedergegeben; das aus dem Kontext erschlossene Subjekt bleibt wie im Griechischen unausgesprochen.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: den Söhnen Israels
  rationale: Die traditionelle, wörtliche Bezeichnung bewahrt υἱοί und ist als Sammelbezeichnung für Israel verständlich.
- source_word: εὐαγγελιζόμενος
  choice: indem er … verkündete
  rationale: Das Partizip bezeichnet das Verkünden einer guten Botschaft. „Verkündete“ passt zum würdevollen Register; die modale Beziehung zur Sendung der Botschaft bleibt erhalten.
- source_word: εἰρήνην
  choice: Frieden
  rationale: Direkte und im biblischen Sprachgebrauch tragfähige Entsprechung, die Versöhnung und Wohlergehen einschließen kann.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: διά mit Genitiv bezeichnet die Vermittlung; Χριστός wird hier als Titel verstanden und daher mit „der Messias“ übersetzt.
- source_word: οὗτός
  choice: dieser
  rationale: Das Demonstrativpronomen hebt Jesus ausdrücklich hervor. „Dieser“ bewahrt diesen Nachdruck im Deutschen besser als ein bloßes „er“.
- source_word: πάντων κύριος
  choice: Herr über alle
  rationale: „Herr“ bewahrt das theologische Gewicht von κύριος; „über alle“ gibt die universale Herrschaft im Deutschen idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ als Titel
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Im Zusammenhang der Verkündigung an Israel ist die titular-messianische Bedeutung deutlich. Die Apposition macht im Deutschen kenntlich, dass „Messias“ ein Titel ist.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ bewahrt sowohl den Autoritätsanspruch als auch das christologische Gewicht der Aussage, ohne sie auf ein bloß soziales Herrschaftsverhältnis zu reduzieren.
- issue: Nachdruck von οὗτός ἐστιν πάντων κύριος
  choice: dieser ist Herr über alle
  alternative: er ist Herr über alle
  rationale: „Dieser“ erhält die demonstrative Hervorhebung des griechischen οὗτός, auch wenn die Form im Deutschen markierter ist.
- issue: Bezug des Partizips εὐαγγελιζόμενος
  choice: indem er Frieden … verkündete
  alternative: die Botschaft …, die Frieden … verkündete
  rationale: Das maskuline Partizip bezieht sich grammatisch auf das unausgesprochene Subjekt „er“ (Gott), nicht auf das neutrale λόγον. Die Übersetzung hält diesen Bezug offen erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Der Satz ist offenbar Teil eines größeren Satzgefüges; das einleitende Akkusativobjekt „Die Botschaft“ wird deshalb beibehalten. Der Gedankenstrich markiert die hervorgehobene christologische Aussage.
