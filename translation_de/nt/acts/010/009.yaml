id: ACT.10.9
reference: Acts 10:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: de
  text: Am nächsten Tag, als jene Männer unterwegs waren und sich der Stadt näherten, stieg Petrus gegen die sechste Stunde[a] auf das flache Hausdach, um zu beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das heißt nach damaliger jüdischer Tageszählung etwa um zwölf Uhr mittags.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Die temporale Wendung wird natürlich und genau wiedergegeben. Das schwach fortführende δέ braucht im Deutschen hier kein eigenes Wort.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: als jene Männer unterwegs waren
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig verlaufende Handlung. „Jene Männer“ wahrt den Rückverweis auf die Boten des Kornelius.
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: und sich der Stadt näherten
  rationale: Die koordinierte Partizipialkonstruktion wird als zweites Prädikat des temporalen Nebensatzes wiedergegeben; ἐγγίζω bedeutet hier, sich der Stadt zu nähern.
- source_word: ἀνέβη
  choice: stieg … auf
  rationale: Das Bewegungsverb bezeichnet den Aufstieg zum Dach und wird in idiomatischem Deutsch als trennbares Verb wiedergegeben.
- source_word: ἐπὶ τὸ δῶμα
  choice: auf das flache Hausdach
  rationale: δῶμα bezeichnet hier die begehbare Dachfläche eines Hauses. „Flaches Hausdach“ macht den antiken baulichen Kontext verständlich, ohne eine zusätzliche Handlung einzutragen.
- source_word: προσεύξασθαι
  choice: um zu beten
  rationale: Der Infinitiv drückt den Zweck des Hinaufsteigens aus.
- source_word: περὶ ὥραν ἕκτην
  choice: gegen die sechste Stunde
  rationale: „Gegen“ gibt die ungefähre Zeitangabe περί wieder; die kulturgebundene Stundenbezeichnung bleibt im Haupttext erhalten und wird in der Fußnote erklärt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt übersichtlich; die antike Zeitangabe wird bewahrt, während „flaches Hausdach“ den für heutige Leser sonst leicht missverständlichen architektonischen Bezug knapp verdeutlicht.
