  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: de
  text: Sondern in jedem Volk ist ihm willkommen[c], wer ihn fürchtet und tut, was gerecht ist[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Gerechtigkeit übt“ / „und gerecht handelt“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch δικαιοσύνη, gewöhnlich „Gerechtigkeit“; je nach Zusammenhang kann das Wort auch „Recht“ bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wird von ihm angenommen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: sondern
  rationale: Nach der unmittelbar vorausgehenden Verneinung, dass Gott die Person ansieht, gibt „sondern“ den korrigierenden Gegensatz im Deutschen natürlich wieder.
- source_word: ἐν παντὶ ἔθνει
  choice: in jedem Volk
  rationale: „Volk“ gibt ἔθνος in diesem Zusammenhang wieder, ohne den modernen Nationalstaat oder eine eng definierte ethnische Kategorie vorauszusetzen; παντί hat verteilenden Sinn.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: wer ihn fürchtet
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden entsprechenden Menschen. „Wer“ ist im Deutschen natürlich und nicht unnötig geschlechtsspezifisch; „fürchtet“ bewahrt den biblischen Gedanken ehrfürchtiger Gottesfurcht.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: und tut, was gerecht ist
  rationale: Die Verbindung bezeichnet tätiges gerechtes Handeln. Die gewählte Formulierung ist modernes, verständliches Deutsch und bewahrt den moralischen Gehalt, ohne eine technische Deutung einzutragen.
- source_word: δικαιοσύνην
  choice: was gerecht ist
  rationale: δικαιοσύνη bedeutet gewöhnlich „Gerechtigkeit“. In der Verbindung mit ἐργάζομαι ist die aufgelöste Wendung „tut, was gerecht ist“ idiomatischer; „Recht“ bleibt als mögliche Bedeutungsnuance in der Fußnote erhalten.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: ist ihm willkommen
  rationale: δεκτός bezeichnet, was willkommen beziehungsweise annehmbar ist oder günstig aufgenommen wird. „Ist ihm willkommen“ bildet die prädikative Konstruktion ab und behauptet nicht ausdrücklich, dass sich der Mensch Gottes Annahme verdient.
theological_decisions:
- issue: Ob der Vers eine Annahme aufgrund von Werken lehrt oder im Zusammenhang der Unparteilichkeit Gottes beschreibt, welchen Menschen Gott ungeachtet seiner Volkszugehörigkeit willkommen heißt
  choice: Die Übersetzung lässt die Aussage stehen, dass Gott in jedem Volk willkommen ist, wer ihn fürchtet und gerecht handelt.
  alternative: Möglich wären stärker deutende Formulierungen, nach denen der Mensch sich Gottes Annahme verdient oder sein Handeln lediglich bereits vorhandenen rettenden Glauben beweist.
  rationale: Der griechische Text verbindet Gottes positive Aufnahme mit Gottesfurcht und gerechtem Handeln, erklärt aber an dieser Stelle nicht das genaue Verhältnis zu Verdienst, Glaube oder Heil. Diese theologische Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit „wer“ klingt natürlich und wahrt den allgemeinen, nicht geschlechtsspezifisch eingeschränkten Bezug. „Willkommen“ ist zugänglich, ohne die Aussage lehrmäßig über den griechischen Wortlaut hinaus zu erklären.
