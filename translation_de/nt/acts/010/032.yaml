  variant: modern standard German
source:
  edition: SBLGNT
  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: de
  text: Darum schick jemanden nach Joppe und lass Simon[a], der Petrus genannt wird, zu dir rufen. Er ist als Gast im Haus von Simon, einem Gerber, untergebracht[b], das am Meer liegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lass Simon holen“. Das griechische Verb bedeutet, jemanden zu sich rufen beziehungsweise holen zu lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Er wohnt als Gast“. Das griechische Verb hebt hervor, dass Petrus dort beherbergt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Schick nun nach Joppe
  rationale: Der Aoristimperativ fordert zu einer unmittelbaren Handlung auf; „nun“ gibt den folgernden beziehungsweise fortführenden Sinn von οὖν natürlich wieder. Das im Deutschen mögliche absolute „schick“ vermeidet, ausdrücklich Boten einzufügen, die im griechischen Text nur vorausgesetzt sind.
- source_word: μετακάλεσαι
  choice: lass Simon zu dir rufen
  rationale: Das Medium bezeichnet, dass jemand veranlasst, eine Person zu sich zu rufen. Die Formulierung bewahrt diese Zielrichtung deutlicher als das allgemeinere „rufen“.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Simon, der Petrus genannt wird
  rationale: Die Wendung nennt den weiteren Namen, unter dem Simon bekannt ist, ohne darüber hinaus eine besondere Namensfunktion festzulegen.
- source_word: ξενίζεται
  choice: ist als Gast … untergebracht
  rationale: Die Form bezeichnet hier, dass Petrus von jemandem beherbergt wird. „Als Gast untergebracht“ macht den Gaststatus und die andauernde Situation in natürlichem Deutsch sichtbar.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: im Haus des Gerbers Simon
  rationale: Die Genitivverbindung bezeichnet das Haus Simons; βυρσεύς nennt sein Handwerk. Die deutsche Wortstellung unterscheidet diesen Simon klar von Simon Petrus.
- source_word: παρὰ θάλασσαν
  choice: das am Meer liegt
  rationale: παρά mit dem Akkusativ bezeichnet hier die Lage unmittelbar am Meer. Der Relativsatz stellt den natürlichen Bezug zum Haus klar heraus.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Gerber“ ist die geläufige Berufsbezeichnung; „als Gast untergebracht“ bewahrt die besondere Aussage von ξενίζεται.
