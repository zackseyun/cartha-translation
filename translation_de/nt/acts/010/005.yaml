  source_fidelity: 'Die Übersetzung gibt die zwei Imperative und ihre unterschiedliche Funktion sachgerecht wieder: Männer sollen nach Joppe geschickt und Simon soll herbeigeholt werden. „Einen gewissen Simon“ bildet τις angemessen ab; „der Petrus genannt wird“ entspricht ὃς ἐπικαλεῖται Πέτρος. Die Satzverknüpfung „Und nun“ bewahrt καὶ νῦν.'
  naturalness: „Und nun schick Männer nach Joppe und lass einen gewissen Simon holen“ ist modernes, verständliches Standarddeutsch mit angemessen würdigem Erzählregister. Die leicht markierte Formulierung „einen gewissen Simon“ ist hier als gezielte Wiedergabe der griechischen Erzählweise natürlich genug.
  terminology: „Joppe“, „Simon“ und „Petrus“ sind die etablierten deutschen biblischen Namensformen. Es werden keine theologisch aufgeladenen oder konfessionell einengenden Begriffe hinzugefügt. Die Fußnote bietet eine vertretbare idiomatischere Alternative, ohne den Haupttext zu beeinträchtigen.
