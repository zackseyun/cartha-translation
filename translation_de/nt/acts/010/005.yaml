id: ACT.10.5
reference: Acts 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: de
  text: Und nun schick Männer nach Joppe und lass einen gewissen Simon holen, der Petrus genannt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und lass einen Mann namens Simon holen, der als Petrus bekannt ist.“'
    reason: Lexikalische Alternative für Σίμωνά τινα und ὃς ἐπικαλεῖται Πέτρος.
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorausgehenden Redefluss als auch den zeitlich-diskursiven Übergang.
- source_word: πέμψον
  choice: schick
  rationale: Der Aorist-Imperativ verlangt eine direkte Aufforderung; „schick“ ist im modernen Standarddeutsch natürlich und klar.
- source_word: ἄνδρας
  choice: Männer
  rationale: ἀνήρ bezeichnet hier ausdrücklich Männer, wahrscheinlich männliche Abgesandte; „Boten“ wäre eine zusätzliche Deutung.
- source_word: εἰς Ἰόππην
  choice: nach Joppe
  rationale: Bei Ortsnamen ist „nach“ die idiomatische deutsche Wiedergabe der Richtungsangabe mit εἰς; „Joppe“ ist die etablierte deutsche Namensform.
- source_word: μετάπεμψαι
  choice: lass … holen
  rationale: Das Medium bezeichnet das Schicken nach jemandem mit dem Ziel, ihn kommen zu lassen. „Lass … holen“ gibt dies natürlich wieder, ohne einen Zwang zu unterstellen.
- source_word: Σίμωνά τινα
  choice: einen gewissen Simon
  rationale: 'Bewahrt die Funktion von τινα: Die Person ist bestimmt, wird dem Angesprochenen aber zunächst als noch nicht näher identifiziert eingeführt.'
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: der Petrus genannt wird
  rationale: Gibt die Bezeichnung wieder, unter der Simon bekannt ist, und bleibt nahe an der grammatischen Form des Griechischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung bleibt erhalten; die leicht markierte Wendung „einen gewissen Simon“ bewahrt die erzählerische Unbestimmtheit des griechischen Textes.
