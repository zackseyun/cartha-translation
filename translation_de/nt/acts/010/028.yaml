source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Ihr wisst selbst, dass es einem jüdischen Mann nicht erlaubt ist, mit einem Angehörigen eines anderen Volkes[a] Umgang zu haben oder ihn aufzusuchen. Doch mir hat Gott gezeigt, dass ich keinen Menschen als unheilig[b] oder unrein bezeichnen soll.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einem Andersvölkischen“; im Zusammenhang kann ein Nichtjude gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: „Unheilig“ gibt κοινός wieder, wörtlich „gewöhnlich“ oder „gemein“ im Sinn von nicht heilig; der Ausdruck ist von „unrein“ (ἀκάθαρτος) zu unterscheiden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: Und er sagte zu ihnen
  rationale: τέ verbindet den Satz locker mit dem Erzählfluss; „und“ gibt dies wieder, ohne eine stärkere zeitliche oder folgernde Beziehung einzutragen.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Ihr wisst selbst
  rationale: Das ausdrücklich gesetzte ὑμεῖς trägt Nachdruck, der durch „selbst“ natürlich wiedergegeben wird.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: dass es … nicht erlaubt ist
  rationale: ἀθέμιτος bezeichnet etwas, das als nicht gestattet oder mit geltenden religiös-sozialen Normen unvereinbar gilt. „Nicht erlaubt“ wahrt die Stärke der Aussage, ohne ausdrücklich ein Verbot der Tora zu behaupten.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: einem jüdischen Mann
  rationale: Die Wiedergabe erhält Singular und grammatisch männliche Bezeichnung des griechischen Ausdrucks.
- source_word: κολλᾶσθαι
  choice: Umgang zu haben
  rationale: Das Verb bedeutet wörtlich, sich anzuschließen oder eng zu verbinden; im sozialen Zusammenhang drückt „Umgang haben“ den gemeinten Kontakt natürlich aus.
- source_word: ἢ προσέρχεσθαι
  choice: oder ihn aufzusuchen
  rationale: προσέρχομαι bedeutet herantreten oder hingehen. Hier bezeichnet es das Aufsuchen eines Nichtjuden, wahrscheinlich auch in dessen Haus; „aufsuchen“ bleibt etwas weiter als das stärker gastlich geprägte „besuchen“.
- source_word: ἀλλοφύλῳ
  choice: einem Angehörigen eines anderen Volkes
  rationale: ἀλλόφυλος bezeichnet wörtlich jemanden aus einem anderen Volk oder Stamm. Die Formulierung bleibt näher am griechischen Ausdruck als das kontextuell mögliche „Nichtjuden“.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Doch mir hat Gott gezeigt
  rationale: κἀμοί bedeutet wörtlich „und mir“; „doch“ macht im Deutschen den sachlichen Gegensatz zwischen der bisherigen Abgrenzung und Gottes Offenbarung deutlich. Das Perfekt hebt deren fortdauernde Bedeutung für Petrus hervor.
- source_word: μηδένα … ἄνθρωπον
  choice: keinen Menschen
  rationale: ἄνθρωπος bezeichnet hier allgemein einen Menschen, nicht nur eine männliche Person.
- source_word: κοινὸν
  choice: profan
  rationale: κοινός bezeichnet im Reinheitswortschatz das Gewöhnliche beziehungsweise nicht Geheiligte und muss von ἀκάθαρτος unterschieden bleiben. „Profan“ vermeidet die heute irreführende Bedeutung von „gemein“.
- source_word: ἢ ἀκάθαρτον
  choice: oder unrein
  rationale: ἀκάθαρτος ist der übliche Ausdruck für kultische Unreinheit; „unrein“ bewahrt die religiöse Kategorie und die Unterscheidung von κοινός.
- source_word: λέγειν
  choice: nennen darf
  rationale: Der Infinitiv hängt inhaltlich von Gottes Weisung ab. „Nennen darf“ gibt im Deutschen den normativen Sinn der Offenbarung natürlich wieder, ohne die Aussage in ein Urteil über den inneren Zustand eines Menschen umzudeuten.
theological_decisions:
- issue: Verhältnis jüdischer Abgrenzungspraxis zu Gottes Offenbarung
  choice: Petrus beschreibt den Umgang mit Angehörigen anderer Völker als für einen jüdischen Mann nicht erlaubt und stellt dem Gottes Weisung gegenüber, keinen Menschen profan oder unrein zu nennen.
  alternative: ἀθέμιτον als bloß gesellschaftlich ungehörig wiederzugeben oder als ausdrückliches Verbot der Tora zu bezeichnen.
  rationale: Der Text spricht stärker als von bloßer Etikette, benennt aber nicht ausdrücklich eine bestimmte Vorschrift der Tora. Die Übersetzung lässt diese Spannung bestehen und bewahrt zugleich die ausdrückliche Anwendung der Vision auf Menschen.
- issue: Unterscheidung der Reinheitsbegriffe κοινός und ἀκάθαρτος
  choice: „profan oder unrein“
  alternative: Beide Begriffe unterschiedslos mit „unrein“ wiederzugeben oder κοινός mit dem modern missverständlichen „gemein“ zu übersetzen.
  rationale: Die zwei griechischen Begriffe gehören zum jüdischen Reinheitswortschatz, sind jedoch nicht identisch. Die gewählte Paarung erhält diese begriffliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und mündlich, während „profan“ als präziser Begriff des Reinheitswortschatzes durch eine Fußnote erläutert wird.
