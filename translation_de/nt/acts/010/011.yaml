id: ACT.10.11
reference: Acts 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: de
  text: und er sieht den Himmel geöffnet[a] und etwas[b] wie ein großes Tuch herabkommen, das an seinen vier Ecken[c] zur Erde hinabgelassen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Himmel offen“; οὐρανός kann auch den sichtbaren Himmel beziehungsweise Luftraum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „einen Gegenstand“ oder „ein Gefäß“. Der griechische Ausdruck σκεῦός τι bleibt unbestimmt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „an seinen vier Enden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: er sieht
  rationale: Das historische Präsens wird beibehalten; „sieht“ ist unmittelbar, natürlich und weniger altertümlich als „schaut“ oder „erblickt“.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: den Himmel geöffnet
  rationale: Im Zusammenhang einer Offenbarungsvision gibt „Himmel“ die räumliche und theologische Tragweite besser wieder als das ebenfalls mögliche „Himmelsgewölbe“ oder „der geöffnete Himmel“; die prädikative Fügung folgt dem Griechischen knapp.
- source_word: καταβαῖνον
  choice: herabkommen
  rationale: Das Partizip beschreibt die Abwärtsbewegung des unbestimmten Gegenstands. Die Infinitivkonstruktion nach „sieht“ ist im Deutschen natürlich und bewahrt den lebendigen Verlauf.
- source_word: σκεῦός τι
  choice: etwas
  rationale: σκεῦος bezeichnet allgemein einen Gegenstand, ein Gefäß oder Gerät; τι hält die Bezeichnung absichtlich unbestimmt. „Etwas“ vermeidet eine sachlich nicht gesicherte Festlegung.
- source_word: ὡς ὀθόνην μεγάλην
  choice: wie ein großes Tuch
  rationale: ὀθόνη kann ein großes Tuch, Leinentuch oder Segeltuch bezeichnen. „Tuch“ bewahrt den Vergleich und legt weder Verwendung noch Material unnötig fest.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: an seinen vier Ecken
  rationale: ἀρχή bezeichnet hier die Enden oder äußersten Punkte. Bei einem tuchartigen Gegenstand ist „Ecken“ die natürlichste deutsche Wiedergabe; „seinen“ wird zur eindeutigen Bezugnahme ergänzt.
- source_word: καθιέμενον
  choice: hinabgelassen wird
  rationale: Die Passivform lässt offen, wer den Gegenstand hinablässt, und unterscheidet diese bewirkte Bewegung vom vorausgehenden allgemeinen Herabkommen.
- source_word: ἐπὶ τῆς γῆς
  choice: zur Erde
  rationale: Bei der Abwärtsbewegung bezeichnet ἐπί das Ziel. „Zur Erde“ erhält die umfassendere räumliche Perspektive der Vision; „auf den Boden“ wäre stärker lokalisiert.
theological_decisions:
- issue: Bedeutung von οὐρανός in der Vision
  choice: Himmel
  alternative: Himmel beziehungsweise Luftraum
  rationale: Der geöffnete Bereich ist in diesem Offenbarungsgeschehen Ursprung dessen, was herabkommt. „Himmel“ bewahrt diese Dimension, ohne die lexikalisch mögliche räumliche Bedeutung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens und die fortlaufende Satzverknüpfung mit „und“ spiegeln den lebendigen griechischen Erzählstil. Die Formulierung vermeidet altertümliche Wörter und bewahrt zugleich die visionäre Bildsprache sowie die Unbestimmtheit des Gegenstands.
