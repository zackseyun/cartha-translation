source:
  edition: SBLGNT
  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: de
  text: 'Und zum zweiten Mal sprach eine Stimme zu ihm: »Was Gott rein gemacht hat, das erkläre du nicht für profan.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »erkläre du nicht für gemein«; auch: »erkläre du nicht für unrein« oder »behandle es nicht als unrein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: eine Stimme
  rationale: Der artikellose Ausdruck wird im Deutschen natürlich unbestimmt wiedergegeben; im Mittelpunkt steht die erneut an Petrus gerichtete himmlische Äußerung.
- source_word: πάλιν ἐκ δευτέρου
  choice: wieder, zum zweiten Mal
  rationale: Beide Elemente werden bewahrt, da die griechische Formulierung die Wiederholung nachdrücklich und leicht redundant ausdrückt.
- source_word: πρὸς αὐτόν
  choice: erging … an ihn
  rationale: Eine natürliche, würdevolle deutsche Wendung für eine an Petrus gerichtete Stimme.
- source_word: Ἃ
  choice: Was …, das
  rationale: Das substantivierte relative Neutrum Plural wird im Deutschen idiomatisch kollektiv wiedergegeben.
- source_word: ἐκαθάρισεν
  choice: rein gemacht hat
  rationale: Die Formulierung ist allgemein verständlich und bewahrt zugleich den Bezug auf kultische Reinheit sowie Gottes vollzogene Handlung.
- source_word: σὺ μὴ κοίνου
  choice: das erkläre du nicht für unrein
  rationale: Das betonte σὺ erscheint als »du«. κοινόω bezeichnet hier, etwas als gemein beziehungsweise kultisch verunreinigt einzustufen; »für unrein erklären« gibt diese bewertende Handlung im heutigen Deutsch klar wieder.
theological_decisions:
- issue: Reinheitssprache in der Vision des Petrus
  choice: »für unrein erklären« im Haupttext
  alternative: »für gemein erklären« oder »als unrein behandeln«
  rationale: Das wörtlichere »gemein« bewahrt zwar die lexikalische Unterscheidung zwischen κοινός und ἀκάθαρτος, ist im modernen Deutschen jedoch leicht im Sinn von »niederträchtig« missverständlich. »Für unrein erklären« erhält den Reinheitskontext und die bewertende Kraft des Verbs; die formnähere Alternative wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht nachdrückliche Wiederholung »wieder, zum zweiten Mal« und das betonte »du« spiegeln die griechische Form; die Fußnote hält die genuine Bedeutungsbreite von κοινόω offen.
