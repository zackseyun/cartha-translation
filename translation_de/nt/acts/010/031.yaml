id: ACT.10.31
reference: Acts 10:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: de
  text: 'Und er sagte: »Kornelius, dein Gebet ist erhört worden, und an deine Gaben für die Armen[a] ist vor Gott gedacht worden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Almosen« oder »deine Werke der Barmherzigkeit«. Das griechische Wort bezeichnet barmherzige Gaben oder Taten für Bedürftige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: er sagte
  rationale: Das historische Präsens wird im deutschen Erzählzusammenhang idiomatisch im Präteritum wiedergegeben.
- source_word: Κορνήλιε
  choice: Kornelius
  rationale: Die im Deutschen übliche Form des Eigennamens.
- source_word: εἰσηκούσθη
  choice: ist erhört worden
  rationale: Das Passiv wird bewahrt; »erhören« bezeichnet bei einem Gebet treffender als bloßes »hören«, dass es bei Gott Gehör gefunden hat, ohne eine bestimmte Art der Erfüllung festzulegen.
- source_word: ἡ προσευχὴ
  choice: dein Gebet
  rationale: Der Singular des griechischen Textes wird beibehalten.
- source_word: αἱ ἐλεημοσύναι
  choice: deine Gaben für die Armen
  rationale: Die Wendung vermittelt die konkrete Bedeutung barmherziger Zuwendungen an Bedürftige in verständlichem modernem Deutsch; die Fußnote nennt die traditionelle Alternative.
- source_word: ἐμνήσθησαν
  choice: ist ... gedacht worden
  rationale: Die Passivform und das biblisch gewichtige Motiv des Gedenkens werden erhalten. Wegen des im Deutschen als Kollektivausdruck gebrauchten Singulars »Gaben« steht das Verb im Singular.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Knappes und idiomatisches Äquivalent, das Gottes Gegenwart und Wahrnehmung ausdrückt.
theological_decisions:
- issue: Bedeutung der ἐλεημοσύναι des Kornelius
  choice: Gaben für die Armen
  alternative: Almosen; Werke der Barmherzigkeit
  rationale: Die Übersetzung bezeichnet konkrete Hilfe für Bedürftige, ohne daraus eine Aussage über Verdienst oder Heilsgrund abzuleiten.
- issue: Göttliches Gedenken
  choice: vor Gott gedacht worden
  alternative: Gott hat sie wahrgenommen; Gott hat ihrer gedacht
  rationale: Die Erinnerungssprache des Ausgangstextes bleibt erkennbar und wird nicht zu einer theologischen Erklärung erweitert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede wird natürlich formuliert; das traditionelle Wort »Almosen« steht wegen seiner heute teils verengten oder abwertenden Nebenbedeutung in der Fußnote.
