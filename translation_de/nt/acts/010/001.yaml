  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: de
  text: In Cäsarea lebte ein Mann namens Kornelius[a], ein Zenturio aus der sogenannten Italischen Kohorte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ein gewisser Mann in Cäsarea“. Der griechische Ausdruck führt eine bisher nicht erwähnte Person unbestimmt in die Erzählung ein.'
    reason: lexical_alternative
  - marker: b
    text: Eine Kohorte war eine Einheit des römischen Heeres. Die Bezeichnung „Italische Kohorte“ weist wahrscheinlich auf eine mit Italien verbundene oder aus italischen Soldaten bestehende Einheit hin.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Ein Mann lebte
  rationale: Die Wendung führt mit δέ und dem indefiniten τις eine neue Person und Szene ein. Die deutsche Existenzformulierung „In Cäsarea lebte ein Mann“ klingt natürlich; ein eigenes „aber“ oder „nun“ ist hier nicht nötig.
- source_word: ἐν Καισαρείᾳ
  choice: in Cäsarea
  rationale: Direkte Ortsangabe; „Cäsarea“ ist die im Deutschen gebräuchliche Namensform.
- source_word: ὀνόματι Κορνήλιος
  choice: namens Kornelius
  rationale: Die idiomatische deutsche Wiedergabe der Namensangabe bewahrt den Personennamen in seiner etablierten Form.
- source_word: ἑκατοντάρχης
  choice: Hauptmann
  rationale: „Hauptmann“ ist die traditionelle und allgemein verständliche deutsche Bezeichnung für einen römischen Zenturio; sie bezeichnet hier den militärischen Rang, ohne die Sollstärke von hundert Mann wörtlich zu erklären.
- source_word: ἐκ σπείρης
  choice: der Kohorte
  rationale: „Kohorte“ ist die historisch präzise Bezeichnung für die römische Militäreinheit. Der Anschluss mit Genitiv gibt die Zugehörigkeit idiomatisch wieder.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: der sogenannten Italischen Kohorte
  rationale: „Sogenannt“ gibt καλουμένης knapp wieder; „Italisch“ wird als Bestandteil der Einheitsbezeichnung großgeschrieben.
