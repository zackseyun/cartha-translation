review_pass:
  verdict: approve
  source_fidelity: Die Hauptfassung gibt den Genitivus absolutus mit der fortdauernden Handlung („Während Petrus … noch sprach“) treffend wieder. „Diese Worte“ entspricht τὰ ῥήματα ταῦτα, „fiel … auf“ bewahrt die bildhafte Kraft von ἐπέπεσε, und „alle, die das Wort hörten“ deckt ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον ab. Die Vergangenheitsform im deutschen Relativsatz ist durch die erzählende Vergangenheitszeit gedeckt und bedeutet hier zugleichzeitiges Hören, nicht notwendig ein zuvor abgeschlossenes Hören.
  naturalness: Der Satz ist klares, modernes Standarddeutsch und behält zugleich einen angemessen würdigen biblischen Erzählton. „Der Heilige Geist fiel auf alle“ ist bewusst bildhaft, aber im Deutschen verständlich und nicht unnatürlich.
  terminology: „Der Heilige Geist“ ist der etablierte deutsche Ausdruck. „Das Wort“ ist für λόγος in diesem Verkündigungskontext eine enge und zugleich ausreichend offene Wiedergabe. Die Fußnotenalternative „kam … über“ / „die Botschaft“ ist sachlich korrekt und legt keine konfessionelle Deutung nahe.
