id: ACT.10.44
reference: Acts 10:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: de
  text: Während Petrus diese Worte noch sprach, fiel der Heilige Geist auf alle, die das Wort hörten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kam der Heilige Geist über alle, die die Botschaft hörten.“'
    reason: Lexikalische Alternativen für ἐπέπεσε und λόγος; die Fußnote bietet eine idiomatischere Wiedergabe, ohne die Hauptfassung zu ersetzen.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Während Petrus … noch sprach
  rationale: Der Genitivus absolutus mit präsentischem Partizip bezeichnet eine gleichzeitig andauernde Handlung; „während … noch sprach“ gibt diese zeitliche Überschneidung natürlich und genau wieder.
- source_word: τὰ ῥήματα ταῦτα
  choice: diese Worte
  rationale: ῥήματα bezeichnet hier die soeben gesprochenen Äußerungen des Petrus. „Diese Worte“ ist direkt, verständlich und verweist klar auf seine laufende Rede.
- source_word: ἐπέπεσε
  choice: fiel … auf
  rationale: Die Wiedergabe bewahrt das anschauliche Verb ἐπιπίπτω und die erzählerische Plötzlichkeit. Das glattere „kam über“ bleibt als Übersetzungsalternative in der Fußnote erhalten.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Dies ist die geläufige und sachlich genaue Wiedergabe der bestimmten griechischen Wortgruppe im modernen Standarddeutsch.
- source_word: ἐπὶ πάντας
  choice: auf alle
  rationale: Die Präposition ἐπί mit Akkusativ gehört zur Bewegungsvorstellung des Verbs; πάντας bezieht sich umfassend auf sämtliche anwesenden Hörenden.
- source_word: τοὺς ἀκούοντας
  choice: die … hörten
  rationale: Das präsentische Partizip kennzeichnet die Menschen, die in diesem Augenblick hörten. Der deutsche Relativsatz ist natürlicher als eine substantivierte Partizipialform.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: „Das Wort“ entspricht λόγος eng und bewahrt sowohl den Bezug auf die verkündigte Botschaft als auch die für Lukas charakteristische theologische Ausdrucksweise, ohne den Sinn auf eine bloße Einzeläußerung festzulegen.
theological_decisions:
- issue: Art des Wirkens des Heiligen Geistes in ἐπέπεσε
  choice: fiel der Heilige Geist auf alle
  alternative: kam der Heilige Geist über alle
  rationale: Die Hauptfassung hält an der konkreten, kraftvollen Bildsprache des griechischen Verbs fest, ohne eine bestimmte konfessionelle Lehre über Geistempfang oder Geistestaufe einzutragen. Die idiomatisch glattere Alternative wird ausgewiesen.
- issue: Bedeutungsumfang von λόγος
  choice: das Wort
  alternative: die Botschaft
  rationale: '„Das Wort“ wahrt die lexikalische und theologische Offenheit des Ausdrucks: Gemeint ist die von Petrus verkündigte Botschaft, doch die Übersetzung legt den Begriff nicht enger aus als der Ausgangstext.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Hauptfassung bleibt quellennah, ohne unnatürlich zu wirken; die plötzliche Unterbrechung der Rede des Petrus und die umfassende Wirkung auf alle Hörenden bleiben deutlich.
