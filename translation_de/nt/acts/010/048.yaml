id: ACT.10.48
reference: Acts 10:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: de
  text: Da ordnete er an, dass sie im Namen Jesu, des Messias[a], getauft würden. Dann baten sie ihn, noch einige Tage zu bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditioneller: »Jesus Christus«; in der ganzen Wendung: »im Namen Jesu Christi«.'
    reason: Alternative traditionelle Wiedergabe des Titels Χριστός.
lexical_decisions:
- source_word: προσέταξεν
  choice: ordnete er an
  rationale: Das Verb bezeichnet eine verbindliche, autoritative Anweisung. »Ordnete an« ist im modernen Deutsch natürlich und bewahrt diese Stärke.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier den Erzählgang weiter und knüpft folgernd an das Vorangehende an, ohne einen starken Gegensatz auszudrücken.
- source_word: ἐν τῷ ὀνόματι
  choice: im Namen
  rationale: Die geläufige Wendung lässt die im Griechischen mögliche Verbindung von Autorität, Zugehörigkeit und Anrufung offen.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird hier als Titel verstanden. Die Genitiv-Apposition gibt diesen Titel in natürlichem, würdigem Deutsch wieder.
- source_word: βαπτισθῆναι
  choice: dass sie … getauft würden
  rationale: Die Konstruktion bewahrt den passiven Infinitiv und macht eindeutig, dass die genannten Personen die Taufe empfangen sollten.
- source_word: τότε
  choice: Dann
  rationale: τότε bezeichnet schlicht den nächsten Schritt in der zeitlichen Abfolge.
- source_word: ἠρώτησαν
  choice: baten
  rationale: In Verbindung mit einem Infinitiv bezeichnet das Verb hier eine Bitte; »baten« ist im Deutschen natürlicher als das wörtlichere »fragten«.
- source_word: ἐπιμεῖναι
  choice: noch … zu bleiben
  rationale: Das Verb bezeichnet hier das weitere Verweilen an einem Ort; »noch zu bleiben« bildet diesen Sinn idiomatisch ab.
- source_word: ἡμέρας τινάς
  choice: einige Tage
  rationale: Die Formulierung bewahrt die unbestimmte Zeitangabe, ohne sie auf »wenige« oder »mehrere« Tage festzulegen.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Taufformel
  choice: des Messias
  alternative: Christi
  rationale: Χριστός hat hier erkennbar titularen und bekenntnishaften Gehalt. »Messias« macht die Bedeutung des Titels sichtbar; die traditionelle Wiedergabe bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die traditionelle Formel »im Namen« und das Passiv der Taufaussage wurden beibehalten; konfessionell enger deutende Umschreibungen wurden vermieden.
