  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: de
  text: Sie riefen laut und fragten, ob Simon, der Petrus genannt wird, hier zu Gast sei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hier untergebracht sei“ beziehungsweise „hier beherbergt werde“. Das griechische Verb bezeichnet den Aufenthalt als Gast.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: Sie riefen
  rationale: Das Aoristpartizip bezeichnet die dem Fragen vorausgehende Handlung. Die finite Wiedergabe ist im Deutschen natürlich und lässt erkennen, dass die Männer sich laut an die Bewohner des Hauses wandten.
- source_word: ἐπυνθάνοντο
  choice: fragten
  rationale: Das Imperfekt beschreibt ihre Nachfrage im Erzählverlauf. Das schlichte „fragten“ ist idiomatisch; eine ausdrücklich durative Form wäre im Deutschen unnötig schwerfällig.
- source_word: εἰ
  choice: ob
  rationale: εἰ leitet hier eine indirekte Frage ein und wird im Deutschen präzise mit „ob“ wiedergegeben.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Simon, der Petrus genannt wird
  rationale: Die Relativkonstruktion bewahrt beide Namen sowie den präsentisch-passiven Sinn von ἐπικαλούμενος und klingt zugleich klar und würdig.
- source_word: ἐνθάδε
  choice: hier
  rationale: „Hier“ ist die unmittelbare und natürliche deutsche Entsprechung der Ortsangabe.
- source_word: ξενίζεται
  choice: zu Gast sei
  rationale: Das Verb bezeichnet das Untergebrachtsein bei einem Gastgeber. „Zu Gast sein“ bildet diesen Gastfreundschaftsaspekt natürlicher und genauer ab als das allgemeinere „sich aufhalten“; der Konjunktiv I passt zur indirekten Frage.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die partizipiale Eingangskonstruktion wird in eine natürliche deutsche Satzfolge überführt; der Gaststatus in ξενίζεται bleibt ausdrücklich erhalten.
