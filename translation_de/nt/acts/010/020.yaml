source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: de
  text: Doch steh auf, geh hinunter und geh ohne zu zögern[a] mit ihnen, denn ich habe sie gesandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ohne einen Unterschied zu machen«. Das griechische Partizip kann sowohl bedeuten, nicht zu zweifeln oder zu zögern, als auch, keinen Unterschied zu machen; die zweite Bedeutung kann auf das Thema von Juden und Nichtjuden in diesem Kapitel anspielen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Markiert knapp den Gegensatz zu Petrus’ vorheriger Ungewissheit und leitet zum gebotenen Handeln über.
- source_word: ἀναστὰς
  choice: steh auf
  rationale: Das Aoristpartizip steht in einer imperativischen Handlungsfolge; „steh auf“ ist natürlich und unmittelbar.
- source_word: κατάβηθι
  choice: geh hinunter
  rationale: Bewahrt die räumliche Bewegung vom Dach hinab.
- source_word: πορεύου σὺν αὐτοῖς
  choice: geh … mit ihnen
  rationale: Gibt den Bewegungsimperativ und die Begleitung schlicht und idiomatisch wieder.
- source_word: μηδὲν διακρινόμενος
  choice: ohne zu zögern
  rationale: Im unmittelbaren Zusammenhang bezeichnet διακρίνομαι wahrscheinlich Zweifel oder Zögern. Die ebenfalls mögliche Bedeutung „keinen Unterschied machen“ wird wegen des Juden-Heiden-Themas in der Fußnote bewahrt.
- source_word: ὅτι
  choice: denn
  rationale: Leitet in natürlichem, würdigem Deutsch die Begründung für den Auftrag ein.
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: ich habe sie gesandt
  rationale: Das Perfekt bezeichnet eine vollzogene Sendung mit gegenwärtiger Relevanz; das explizite ἐγώ wird durch „ich“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von μηδὲν διακρινόμενος im Blick auf die Aufnahme von Nichtjuden
  choice: Im Haupttext „ohne zu zögern“, mit Schwerpunkt auf dem unmittelbaren Auftrag, ohne Zweifel mitzugehen.
  alternative: „ohne einen Unterschied zu machen“
  rationale: Das unmittelbare Umfeld legt Zögern oder Zweifel nahe; zugleich kann die Formulierung das übergreifende Thema anklingen lassen, zwischen Juden und Nichtjuden keinen Unterschied zu machen. Die Fußnote erhält diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die kurze Befehlsfolge des griechischen Textes bleibt erhalten. Der Fußnotenmarker steht nach dem Satz, da sich die Anmerkung auf die Wendung „ohne zu zögern“ bezieht.
