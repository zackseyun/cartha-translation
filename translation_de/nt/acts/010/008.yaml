  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: de
  text: Nachdem er ihnen alles erklärt hatte, schickte er sie nach Joppe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: Nachdem er … erklärt hatte
  rationale: Das Partizip Aorist bezeichnet hier eine Handlung, die der Haupthandlung vorausgeht. Die temporale Nebensatzkonstruktion gibt dies im Deutschen natürlich wieder; „erklärt“ vermittelt, dass Kornelius ihnen alles ausführlich darlegte.
- source_word: ἅπαντα
  choice: alles
  rationale: Das substantivisch gebrauchte Neutrum Plural bezeichnet umfassend „alles“ und wird so idiomatisch und präzise wiedergegeben.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Empfänger der Erklärung.
- source_word: ἀπέστειλεν
  choice: schickte er
  rationale: „Schicken“ ist hier die klare, natürliche Entsprechung von ἀποστέλλω, ohne die zusätzliche Nuance besonderer Dringlichkeit, die „entsenden“ nahelegen könnte.
- source_word: εἰς τὴν Ἰόππην
  choice: nach Joppe
  rationale: εἰς bezeichnet die Richtung beziehungsweise das Ziel. Bei Städtenamen ist „nach“ im Deutschen idiomatisch; „Joppe“ ist die etablierte deutsche biblische Namensform.
theological_decisions: []
