id: ACT.10.25
reference: Acts 10:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: de
  text: Als Petrus eintrat, ging Kornelius ihm entgegen, fiel ihm zu Füßen und erwies ihm Ehrerbietung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: betete ihn an. Das griechische Verb kann je nach Zusammenhang sowohl Anbetung als auch das Niederwerfen aus Ehrerbietung oder Huldigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν
  choice: Als … eintrat
  rationale: Die griechische Wendung führt einen zeitlichen Begleitumstand ein. „Als“ gibt sie in natürlichem modernem Deutsch wieder; die verbindende Funktion von δέ wird im fortlaufenden Erzählzusammenhang ausreichend durch den Satzanschluss getragen.
- source_word: εἰσελθεῖν τὸν Πέτρον
  choice: Petrus eintrat
  rationale: Der Aoristinfinitiv bezeichnet den Eintritt als schlichtes Ereignis. Die finite deutsche Form ist idiomatisch und macht Petrus klar zum handelnden Subjekt.
- source_word: συναντήσας αὐτῷ
  choice: ging Kornelius ihm entgegen
  rationale: Das Verb bezeichnet hier das Entgegenkommen beziehungsweise Zusammentreffen. „Ging … ihm entgegen“ bildet die zielgerichtete Begegnung natürlicher und anschaulicher ab als das weniger eindeutige „traf ihn“.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: fiel ihm zu Füßen
  rationale: Die deutsche Wendung bewahrt die konkrete Haltung der Unterwerfung und Ehrerbietung, ohne die Geste zusätzlich auszudeuten.
- source_word: προσεκύνησεν
  choice: erwies ihm Ehrerbietung
  rationale: προσκυνέω kann je nach Zusammenhang sowohl Anbetung als auch eine durch Niederwerfen ausgedrückte Huldigung oder Ehrerbietung bezeichnen. Die Haupttextfassung erhält hier die erkennbare Verehrung, ohne die lexikalische Mehrdeutigkeit vorschnell auf göttliche Anbetung festzulegen; die stärkere Möglichkeit steht in der Fußnote.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber Petrus
  choice: erwies ihm Ehrerbietung
  alternative: betete ihn an; huldigte ihm
  rationale: Kornelius bringt Petrus eine übermäßige Verehrung entgegen, die Petrus im folgenden Vers zurückweist. Die Übersetzung soll die Ernsthaftigkeit der Handlung bewahren, aber nicht stärker als der griechische Ausdruck festlegen, dass Kornelius Petrus ausdrücklich als Gott anbetete. Die mögliche stärkere Lesart bleibt deshalb in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ging … ihm entgegen“ ist erzählerisch natürlich; „erwies ihm Ehrerbietung“ hält die Bedeutungsbreite von προσκυνέω offen. Der Fußnotenmarker steht unmittelbar nach der mehrdeutigen Formulierung.
