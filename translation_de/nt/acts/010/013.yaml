  text: καὶ ἐγένετο φωνὴ πρὸς αὐτόν· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: de
  text: 'Und eine Stimme erging an ihn: »Steh auf, Petrus, schlachte[a] und iss!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »opfere«. Das griechische Verb kann sowohl »schlachten« als auch »opfern« bedeuten; im Zusammenhang dieser Vision ist wahrscheinlich das Schlachten eines Tieres zum Essen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: sprach
  rationale: Zusammen mit φωνή und πρὸς αὐτόν führt γίνομαι hier idiomatisch das Ergehen einer Stimme ein. Die deutsche Formulierung »eine Stimme sprach zu ihm« gibt das Ereignis natürlich und klar wieder.
- source_word: φωνὴ
  choice: eine Stimme
  rationale: Im Offenbarungsgeschehen bezeichnet φωνή eine verständlich redende Stimme, nicht bloß einen Laut.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: Bei einer Äußerung bezeichnet πρός mit Akkusativ die angesprochene Person.
- source_word: Ἀναστάς
  choice: Steh auf
  rationale: Das Aoristpartizip von ἀνίστημι hat hier imperativische Kraft und leitet die folgenden Aufforderungen ein.
- source_word: Πέτρε
  choice: Petrus
  rationale: Der Vokativ des Eigennamens Πέτρος wird entsprechend der etablierten deutschen Namensform mit »Petrus« wiedergegeben.
- source_word: θῦσον
  choice: schlachte
  rationale: θύω kann sowohl das Schlachten als auch das Opfern bezeichnen. Im Zusammenhang mit Tieren und der Aufforderung zu essen drückt »schlachte« die konkrete Handlung präzise aus, ohne die mögliche kultische Bedeutung zu verschweigen.
- source_word: φάγε
  choice: iss
  rationale: Der direkte Imperativ wird knapp und natürlich mit »iss« wiedergegeben.
- source_word: καὶ
  choice: Und
  rationale: Das einleitende καί führt die Erzählfolge fort; »Und« bewahrt diese Verknüpfung.
theological_decisions:
- issue: Ob θῦσον mit kultischer Opfersprache wiederzugeben ist
  choice: Im Haupttext steht »schlachte«.
  alternative: »opfere«
  rationale: Der unmittelbare Zusammenhang betrifft Tiere, die zur Nahrung dienen sollen. »Opfere« könnte die Szene unnötig als kultische Opferhandlung festlegen. Da θύω diese Bedeutung jedoch tatsächlich haben kann, wird sie in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp und befehlend; die echte Bedeutungsbreite von θύω wird durch die Fußnote sichtbar gehalten.
