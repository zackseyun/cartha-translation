id: ACT.10.39
reference: Acts 10:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: de
  text: Und wir sind Zeugen für alles, was er im Land der Juden und in Jerusalem getan hat. Ihn haben sie auch getötet, indem sie ihn an ein Holz hängten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen Baum“; sinngemäß: „an ein Kreuz“. Das griechische Wort bedeutet „Holz“ oder „Baum“ und klingt vermutlich an 5. Mose 21,23 an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: Zeugen
  rationale: „Zeugen“ ist die natürliche und sachlich passende Wiedergabe für apostolisches Augenzeugenzeugnis.
- source_word: πάντων ὧν ἐποίησεν
  choice: für alles, was er … getan hat
  rationale: Bewahrt den umfassenden Sinn von πάντων und klingt im modernen Deutschen natürlich.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: im Land der Juden
  rationale: „Land“ gibt χώρα als Gebiet oder Land wieder, ohne es vorschnell mit der römischen Provinz Judäa gleichzusetzen; „der Juden“ wahrt die mögliche ethnisch-religiöse Bedeutung von Ἰουδαίων.
- source_word: καὶ Ἰερουσαλήμ
  choice: und in Jerusalem
  rationale: Die im Griechischen nicht wiederholte Präposition wird im Deutschen aus Gründen der Klarheit ergänzt.
- source_word: ἀνεῖλαν
  choice: getötet
  rationale: Gibt die Bedeutung von ἀναιρέω direkt, verständlich und ohne unnötige interpretierende Zusätze wieder.
- source_word: κρεμάσαντες
  choice: indem sie ihn … hängten
  rationale: Gibt das Partizip als Mittel beziehungsweise begleitende Handlung der Tötung wieder.
- source_word: ἐπὶ ξύλου
  choice: an ein Holz
  rationale: ξύλον kann „Holz“ oder „Baum“ bedeuten. „An ein Holz“ bewahrt die konkrete hölzerne Hinrichtungsstätte und den möglichen Anklang an Deuteronomium 21,23, ohne interpretierend „Kreuz“ einzusetzen.
theological_decisions:
- issue: Wiedergabe von ξύλου im Zusammenhang der Kreuzigung
  choice: an ein Holz
  alternative: an einen Baum; an ein Kreuz
  rationale: Der griechische Text verwendet ξύλον, nicht σταυρός. „Holz“ erhält diese Wortwahl und den möglichen Schriftanklang, während „Kreuz“ die gemeinte Hinrichtungsart ausdrücklich deutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „Ihn haben sie auch getötet“ greift das vorangestellte griechische Relativpronomen auf und setzt Jesus als Betroffenen hervor. Die Formulierung vermeidet konfessionell geprägte Zusätze und bewahrt die lexikalische Spannung bei ξύλον.
