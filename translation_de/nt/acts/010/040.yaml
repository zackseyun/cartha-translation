  - marker: b
    text: 'Wörtlich: „gab ihn, sichtbar/offenbar zu werden“; auch: „ließ ihn erscheinen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Diesen
  rationale: Das vorangestellte Demonstrativpronomen bezeichnet nachdrücklich den zuvor genannten Jesus. „Diesen“ bewahrt sowohl die demonstrative Kraft als auch die Wortstellung des Griechischen.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte Wiedergabe des bestimmten Subjekts; im Deutschen steht der Gottesname hier idiomatisch ohne Artikel.
- source_word: ἤγειρεν
  choice: hat … auferweckt
  rationale: Im Zusammenhang der Auferstehung gibt „auferwecken“ die Bedeutung von ἐγείρω klar und natürlich wieder.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: am dritten Tag
  rationale: Die Zeitangabe im Dativ wird im Deutschen idiomatisch mit „am“ wiedergegeben, ohne die Tageszählung näher festzulegen.
- source_word: ἔδωκεν
  choice: ließ
  rationale: In der Verbindung mit Akkusativ und Infinitiv bezeichnet δίδωμι hier, dass Gott das Sichtbarwerden ermöglichte bzw. bewirkte. „ließ“ ist eine natürliche deutsche Wiedergabe; die ungewöhnlichere wörtliche Konstruktion bleibt in der Fußnote erhalten.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bezieht sich auf Jesus und wird im Deutschen ausdrücklich wiedergegeben.
- source_word: ἐμφανῆ
  choice: sichtbar
  rationale: ἐμφανής bezeichnet etwas, das sichtbar oder offenbar ist. „Sichtbar“ wahrt hier den konkreten Bezug auf die Erscheinungen des Auferstandenen, ohne die Empfänger vorwegzunehmen.
- source_word: γενέσθαι
  choice: werden
  rationale: „Werden“ erhält den Veränderungs- bzw. Eintrittsaspekt von γίνομαι und vermeidet die Abschwächung zu einem bloßen „sein“.
theological_decisions:
- issue: Formulierung der Auferstehung
  choice: Diesen hat Gott am dritten Tag auferweckt
  alternative: Ihn hat Gott am dritten Tag auferweckt
  rationale: Die Fassung benennt Gott ausdrücklich als Handelnden und bewahrt durch „Diesen“ die Hervorhebung des griechischen Demonstrativpronomens, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Sichtbarwerden nach der Auferstehung
  choice: ließ ihn sichtbar werden
  alternative: gewährte ihm, sichtbar zu werden
  rationale: Die Übersetzung hält Auferweckung und anschließendes Sichtbarwerden als zwei Aussagen auseinander. „Ließ“ gibt die göttliche Ermöglichung bzw. Veranlassung natürlich wieder, ohne bereits die in Vers 41 genannten Zeugen in den Text dieses Verses einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Anfangsstellung „Diesen hat Gott …“ ist bewusst beibehalten, um den Nachdruck des griechischen τοῦτον hörbar zu machen. „Ließ ihn sichtbar werden“ vermeidet eine unnatürliche deutsche Infinitivkonstruktion, während die Fußnote die Form des griechischen Ausdrucks transparent macht.
