  rationale: Die Revision behebt die deutsche Tempusinkongruenz durch die idiomatische Perfektkonstruktion „hat … sichtbar werden lassen“. Dadurch bleiben die zwei griechischen Aoriste als zusammengehörige vergangene Handlungen wiedergegeben. Die demonstrative Hervorhebung, die Auferweckungsaussage und die vorsichtige Wiedergabe des Sichtbarwerdens bleiben erhalten. Die Fußnoten sind sprachlich und formal bereinigt, ohne zusätzliche Auslegung einzutragen.
