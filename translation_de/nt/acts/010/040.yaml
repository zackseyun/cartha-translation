  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: de
  text: Diesen[a] hat Gott am dritten Tag auferweckt und ihn sichtbar werden lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn“ oder „diesen Mann“. Das griechische Demonstrativpronomen ist hervorgehoben.'
