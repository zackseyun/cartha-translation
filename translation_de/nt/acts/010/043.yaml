id: ACT.10.43
reference: Acts 10:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: de
  text: Von ihm[a] bezeugen alle Propheten, dass jeder, der an ihn glaubt, durch seinen Namen Vergebung der Sünden empfängt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ihm geben alle Propheten Zeugnis.'
    reason: lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: τούτῳ
  choice: von ihm
  rationale: Der Dativ beim Verb μαρτυρέω bezeichnet hier am natürlichsten die Person, von der das Zeugnis handelt. „Von ihm“ ist im Deutschen klar und idiomatisch; die mögliche Auffassung als Dativ des Empfängers bleibt in der Fußnote sichtbar.
- source_word: πάντες οἱ προφῆται
  choice: alle Propheten
  rationale: Die Wendung bezeichnet umfassend die prophetischen Zeugen und zugleich ihr in der Schrift überliefertes Zeugnis, ohne dass „Propheten“ als formaler Korpustitel markiert werden muss.
- source_word: μαρτυροῦσιν
  choice: bezeugen
  rationale: „Bezeugen“ bewahrt die Aussagekraft des griechischen Verbs und klingt im modernen Standarddeutsch natürlich und würdig.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: Vergebung der Sünden
  rationale: Dies ist die etablierte und verständliche Wiedergabe der neutestamentlichen Wendung; sie wahrt deren persönlichen und rechtlichen Bedeutungsgehalt.
- source_word: λαβεῖν
  choice: empfängt
  rationale: Der Infinitiv gibt den Inhalt des prophetischen Zeugnisses an. Ein deutscher dass-Satz mit finitem Verb ist idiomatisch und erhält die allgemeingültige Aussage.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: durch seinen Namen
  rationale: Die biblische Redeweise bleibt erhalten und bezeichnet Vermittlung beziehungsweise Wirksamkeit, die in Jesu Person und Vollmacht begründet ist, ohne dies erklärend auszuweiten.
- source_word: πάντα τὸν πιστεύοντα
  choice: jeder, der ... glaubt
  rationale: Der substantivierte maskuline Singular ist allgemein und distributiv gemeint. „Jeder, der“ gibt den umfassenden Bezug natürlich und geschlechtsübergreifend wieder.
- source_word: εἰς αὐτόν
  choice: an ihn glaubt
  rationale: Bei πιστεύω bezeichnet εἰς das auf eine Person gerichtete Vertrauen. „An ihn glauben“ ist dafür die übliche deutsche Entsprechung.
theological_decisions:
- issue: Reichweite und Bedingung der Sündenvergebung
  choice: Jeder, der an Jesus glaubt, empfängt durch seinen Namen Vergebung der Sünden.
  alternative: Eine stärker lehrmäßige Umschreibung der Art und Weise des Heils.
  rationale: Die Übersetzung bewahrt die im Text ausgesagte Beziehung zwischen Jesus, Glauben und Vergebung, ohne über den griechischen Wortlaut hinaus konfessionelle Bestimmungen einzutragen.
- issue: Generisches maskulines Partizip
  choice: jeder, der an ihn glaubt
  alternative: jeder Mann, der an ihn glaubt
  rationale: Das griechische Maskulinum ist hier repräsentativ und nicht auf Männer beschränkt. Die gewählte Form gibt den universalen Bezug korrekt wieder.
- issue: Bezug des Dativs τούτῳ
  choice: von ihm
  alternative: ihm
  rationale: Im Zusammenhang spricht Petrus davon, dass die Propheten über Jesus Zeugnis ablegen. Da der Dativ formal auch als Bezug auf den Empfänger des Zeugnisses verstanden werden kann, wird diese Möglichkeit nicht beseitigt, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satz folgt der griechischen Aussagefolge weitgehend, verwendet aber für den Infinitiv λαβεῖν einen natürlichen deutschen dass-Satz. Die feste biblische Wendung „durch seinen Namen“ bleibt bewusst unerklärt stehen.
