    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: fromm
  rationale: Das Wort bezeichnet eine ehrfürchtige, im religiösen Leben sichtbare Haltung. »Fromm« ist im Deutschen knapp, geläufig und dem gehobenen biblischen Register angemessen.
- source_word: φοβούμενος τὸν θεὸν
  choice: fürchtete Gott
  rationale: Die verbale Form und die biblische Rede von ehrfürchtiger Gottesfurcht bleiben erhalten. Die Formulierung kann zugleich den möglichen zeitgeschichtlichen Anklang an einen nichtjüdischen Verehrer des Gottes Israels tragen.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: zusammen mit seinem ganzen Haus
  rationale: οἶκος bezeichnet hier den gesamten Haushalt beziehungsweise Hausverband, nicht nur ein Gebäude. »Sein ganzes Haus« ist eine verständliche und bibelsprachlich vertraute Bezeichnung dafür.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: gab viele Almosen
  rationale: Obwohl ποιέω wörtlich »tun« bedeutet, bezeichnet die feste Verbindung mit ἐλεημοσύνη konkret das Geben wohltätiger Gaben. »Viele Almosen geben« ist im Deutschen idiomatischer als »viele Almosen tun«.
- source_word: τῷ λαῷ
  choice: dem Volk
  rationale: Der Dativ bezeichnet die Empfänger beziehungsweise Begünstigten. Im Zusammenhang der Apostelgeschichte liegt bei »dem Volk« wahrscheinlich das jüdische Volk nahe, ohne dass dies im Haupttext erklärend ergänzt werden muss.
- source_word: δεόμενος τοῦ θεοῦ
  choice: betete zu Gott
  rationale: δέομαι kann »bitten« oder »flehen« bedeuten; in dieser Beschreibung der Frömmigkeit gibt »zu Gott beten« den Sinn natürlich und klar wieder.
- source_word: διὰ παντός
  choice: beständig
  rationale: Die Wendung bezeichnet fortdauernde beziehungsweise regelmäßig wiederkehrende Praxis. »Beständig« bewahrt die Stärke des Ausdrucks, ohne zwingend eine in jedem Augenblick ununterbrochene Handlung zu behaupten.
theological_decisions:
- issue: Bezeichnung des Kornelius als einen Menschen, der Gott fürchtet
  choice: fürchtete Gott
  alternative: war gottesfürchtig / war ein Gottesfürchtiger
  rationale: Die Übersetzung bewahrt zunächst die gewöhnliche Bedeutung ehrfürchtiger Gottesbeziehung und die verbale Gestalt des Griechischen. Zugleich wird nicht ausgeschlossen, dass die Wendung als erkennbare Bezeichnung für einen Nichtjuden gebraucht ist, der den Gott Israels verehrte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »Gott« folgt der griechischen Aussage und hält die beiden Aspekte seiner Frömmigkeit klar auseinander. »Sein ganzes Haus« ist bewusst als Bezeichnung des gesamten Hausverbands gewählt.
