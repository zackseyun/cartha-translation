translation:
  language: de
  text: Er war fromm und fürchtete Gott, zusammen mit seinem ganzen Haushalt[a]; er gab dem Volk viele Almosen[b] und betete beständig zu Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »war gottesfürchtig«. Die Wendung kann zugleich eine geläufige Bezeichnung für einen Nichtjuden sein, der den Gott Israels verehrte.'
