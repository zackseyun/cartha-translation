    issue: γλώσσαις ist im Haupttext als „in Sprachen“ wiedergegeben.
    rationale: Diese Wahl kann im Deutschen eher konkrete menschliche Sprachen nahelegen. „In Zungen“ bewahrt die kontextuelle idiomatische Formulierung und die offene Bedeutung besser; „in Sprachen“ gehört als lexikalische Alternative in die Fußnote.
  - severity: low
    issue: ἀπεκρίθη ist als „sagte“ wiedergegeben.
    rationale: „Sagte“ ist möglich, lässt aber den im griechischen ἀπεκρίθη liegenden Anschluss bzw. die Reaktion entfallen. „Antwortete“ ist im Deutschen hier natürlich und quellentreuer.
