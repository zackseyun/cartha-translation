  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: de
  text: 'Denn sie hörten, wie sie in Zungen[a] redeten und Gott priesen. Daraufhin antwortete Petrus:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Sprachen“. Das griechische Wort kann sowohl „Zungen“ als auch „Sprachen“ bedeuten; die Art dieses Redens wird hier nicht näher festgelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: sie hörten
  rationale: Das Imperfekt bezeichnet das andauernde Wahrnehmen; die idiomatische deutsche Konstruktion „sie hörten, wie …“ gibt dies natürlich wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Aussage ein.
- source_word: αὐτῶν
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor genannten Menschen, ohne sie im Vers interpretierend näher zu bestimmen.
- source_word: λαλούντων
  choice: redeten
  rationale: „Reden“ ist eine natürliche Entsprechung zu λαλέω und passt zur Konstruktion mit „hören“.
- source_word: γλώσσαις
  choice: in Sprachen
  rationale: γλῶσσα kann sowohl die Zunge als auch eine Sprache bezeichnen. „In Sprachen reden“ bleibt im Deutschen verständlich und vermeidet eine vorschnelle Festlegung auf die Art des geistgewirkten Redens; die traditionelle Alternative steht in der Fußnote.
- source_word: μεγαλυνόντων
  choice: priesen
  rationale: μεγαλύνω bedeutet hier, Gottes Größe zu verkünden bzw. ihn zu verherrlichen. „Gott preisen“ ist im modernen Deutsch natürlicher als „Gott groß machen“ und bewahrt die Bedeutung im Lobpreiskontext.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Direktes Objekt von μεγαλυνόντων; die übliche deutsche Wiedergabe.
- source_word: τότε
  choice: Daraufhin
  rationale: τότε markiert hier den anschließenden, durch das Wahrgenommene veranlassten Redebeitrag des Petrus.
- source_word: ἀπεκρίθη
  choice: sagte
  rationale: ἀποκρίνομαι kann eine Reaktion einleiten, auch wenn keine ausdrückliche Frage vorausgeht. „Sagte“ klingt hier im Deutschen natürlicher als „antwortete“, ohne den reaktiven Zusammenhang aufzulösen.
- source_word: Πέτρος
  choice: Petrus
  rationale: Übliche deutsche Namensform.
theological_decisions:
- issue: Deutung von γλώσσαις im Zusammenhang geistgewirkten Redens
  choice: in Sprachen
  alternative: in Zungen
  rationale: Der griechische Ausdruck bezeichnet sprachliches Reden, legt an dieser Stelle aber nicht für sich allein fest, ob bekannte menschliche Sprachen, ekstatisches Reden oder beides gemeint ist. Der Haupttext bleibt weit; die traditionelle Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist für gewöhnliche Leser verständlich, bewahrt aber die lexikalische und theologische Offenheit von γλώσσαις.
