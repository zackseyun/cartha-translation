review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur und die übrigen Verben sind zutreffend wiedergegeben. Bei γλώσσαις ist jedoch „in Sprachen“ als Haupttext im Deutschen stärker auf (bestimmbare) Sprachen festgelegt und bildet zudem die im Kontext etablierte Ausdrucksweise λαλεῖν γλώσσαις weniger gut ab. „Antwortete“ gibt ἀπεκρίθη genauer wieder als das abgeschwächte „sagte“.
  naturalness: „Denn sie hörten, wie sie … redeten“ ist natürliches modernes Standarddeutsch. „Daraufhin antwortete Petrus“ ist auch ohne vorausgehende ausdrückliche Frage idiomatisch und wahrt den reaktiven Charakter des griechischen Verbs.
  terminology: Die traditionelle, in diesem Kontext auch im Deutschen verständliche Wendung „in Zungen reden“ sollte im Haupttext stehen. Die Fußnote mit „in Sprachen“ erhält die lexikalische Alternative und vermeidet eine Festlegung über die Art der Rede.
  issues:
