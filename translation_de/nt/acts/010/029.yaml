  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: de
  text: 'Darum bin ich auch ohne Einwand gekommen, als ich zu euch bestellt wurde.[a] Nun frage ich also: Aus welchem Grund habt ihr mich zu euch bestellt?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne zu widersprechen“. Auch möglich: „ohne Zögern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Kürzer: „Warum habt ihr mich zu euch bestellt?“ Wörtlicher: „Aus welchem Grund habt ihr mich zu euch bestellt?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Darum … auch
  rationale: Bewahrt sowohl den Folgerungszusammenhang von διό als auch die leicht verstärkende bzw. additive Kraft von καί in natürlichem Deutsch.
- source_word: ἀναντιρρήτως
  choice: ohne Widerspruch
  rationale: Gibt den Sinn des Adverbs, nicht zu widersprechen oder Einwände zu erheben, eng und zugleich verständlich wieder.
- source_word: ἦλθον
  choice: bin ich … gekommen
  rationale: Direkte und natürliche Wiedergabe des Aorists von ἔρχομαι.
- source_word: μεταπεμφθείς
  choice: als ich gerufen wurde
  rationale: Drückt das passive Partizip idiomatisch aus; gemeint ist, dass Petrus auf Veranlassung anderer herbeigerufen wurde.
- source_word: πυνθάνομαι οὖν
  choice: Nun frage ich
  rationale: οὖν leitet hier folgernd und zugleich überleitend die Nachfrage ein; „nun“ passt zum deutschen Gesprächsfluss.
- source_word: τίνι λόγῳ
  choice: Aus welchem Grund
  rationale: Bewahrt die ausdrückliche Frage nach dem Grund, statt sie lediglich mit „warum“ zusammenzuziehen.
- source_word: μετεπέμψασθέ με
  choice: habt ihr mich rufen lassen
  rationale: Das Medium bezeichnet das Veranlassen, jemanden zu holen bzw. nach jemandem zu schicken. „Rufen lassen“ ist im Deutschen natürlich und bewahrt diesen kausativen Zug.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Verwendung desselben griechischen Verbstamms wird durch die verwandten Formulierungen „gerufen wurde“ und „rufen lassen“ erkennbar gehalten; die zweite Formulierung macht deutlicher, dass die Angeredeten das Herbeiholen veranlassten.
