- from: 'Darum bin ich auch ohne Widerspruch gekommen, als ich gerufen wurde.[a] Nun frage ich: Aus welchem Grund habt ihr mich rufen lassen?[b]'
  to: 'Darum bin ich auch ohne Einwand gekommen, als ich zu euch bestellt wurde.[a] Nun frage ich also: Aus welchem Grund habt ihr mich zu euch bestellt?[b]'
  rationale: Die Revision ersetzt die missverständliche kausative Wendung „mich rufen lassen“ durch „mich zu euch bestellen“. Damit werden sowohl das passive μεταπεμφθείς als auch das mittlere μετεπέμψασθε klar und parallel wiedergegeben. „Ohne Einwand“ ist eine natürliche, quellennähere Wiedergabe von ἀναντιρρήτως; die alternative Nuance wird in der Fußnote erhalten.
