review_pass:
  verdict: revise
  source_fidelity: 'Die logische Folgerung (διὸ καί), das widerstandslose Kommen (ἀναντιρρήτως), die passive Vorladung (μεταπεμφθείς) und die ausdrückliche Frage nach dem Grund (τίνι λόγῳ) sind im Entwurf grundsätzlich zutreffend wiedergegeben. „Rufen lassen“ ist jedoch für μετεπέμψασθε mit der Person als Objekt missverständlich: Es kann nahelegen, dass die Angeredeten Petrus einen Ruf ausführen ließen, statt dass sie ihn zu sich bestellen ließen.'
  naturalness: „Ohne Widerspruch“ ist verständlich, aber „ohne Einwand“ ist im modernen Standarddeutsch für die gemeinte fehlende Gegenrede idiomatischer. „Zu sich bestellen“ ist sowohl für die passive als auch für die mittlere Form klar, natürlich und bewahrt die Wiederaufnahme desselben griechischen Verbs.
  terminology: Keine theologischen oder namensbezogenen Fragen. „Bestellen“ ist hier im Sinn von „zu sich beordern/kommen lassen“ zu verstehen und gibt μεταπέμπομαι präziser wieder als das ambige „rufen lassen“.
  issues:
  - severity: medium
    issue: „habt ihr mich rufen lassen?“ ist semantisch und idiomatisch mehrdeutig.
    rationale: μετεπέμψασθε με bedeutet „ihr habt nach mir geschickt / mich zu euch bestellen lassen“. Die deutsche Formulierung kann dagegen bedeuten, dass jemand Petrus laut rufen sollte. „Habt ihr mich zu euch bestellt?“ macht die Richtung und den Aufforderungscharakter klar.
  - severity: low
    issue: Die Fußnote a nennt nicht die im englischen Audit hervorgehobene mögliche Deutung „ohne Zögern“.
    rationale: Die Hauptübersetzung kann den präziseren Sinn „ohne Einwand“ wählen; die Fußnote sollte die im griechischen Adverb mögliche glattere Alternative „ohne Zögern“ transparent dokumentieren.
