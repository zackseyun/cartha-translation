  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: de
  text: Als nun der Engel, der zu ihm gesprochen hatte, weggegangen war, rief er zwei seiner Hausbediensteten[a] und einen frommen Soldaten aus dem Kreis derer, die ihm ständig zur Verfügung standen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwei seiner Haussklaven“. Das griechische Wort bezeichnet Menschen, die als Diener oder Sklaven zu einem Haushalt gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als nun
  rationale: Leitet den zeitlichen Rahmen ein; „nun“ gibt δέ leicht fortführend wieder, ohne einen starken Gegensatz einzutragen.
- source_word: ἀπῆλθεν
  choice: weggegangen war
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass das Weggehen des Engels dem Rufen vorausging.
- source_word: ὁ ἄγγελος
  choice: der Engel
  rationale: Der Zusammenhang beschreibt einen himmlischen Boten in der Vision des Kornelius; daher ist „Engel“ hier angemessener als das allgemeinere „Bote“.
- source_word: ὁ λαλῶν αὐτῷ
  choice: der mit ihm gesprochen hatte
  rationale: Der Relativsatz bezeichnet den Engel als denjenigen, der Kornelius angesprochen hatte. Die deutsche Vorzeitigkeit klingt hier natürlicher als eine wörtliche Verlaufsform.
- source_word: φωνήσας
  choice: rief er …
  rationale: Das Aoristpartizip wird als finites Verb wiedergegeben, damit der im Griechischen in Vers 8 weitergeführte Satz in diesem Vers natürlich lesbar bleibt; „zu sich“ ist durch „rufen“ und die folgenden Akkusativobjekte impliziert.
- source_word: δύο τῶν οἰκετῶν
  choice: zwei seiner Hausdiener
  rationale: οἰκέτης bezeichnet einen im Haushalt dienenden Menschen und kann auch einen Haussklaven meinen. „Hausdiener“ bewahrt den häuslichen Bezug; die Alternative wird in der Fußnote genannt. „Seiner“ ergibt sich aus dem Kontext.
- source_word: στρατιώτην εὐσεβῆ
  choice: einen frommen Soldaten
  rationale: εὐσεβής bezeichnet ehrfürchtige religiöse Hingabe. „Fromm“ gibt dies wieder, ohne den spezielleren Ausdruck „gottesfürchtig“ einzutragen.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: aus dem Kreis derer, die ihm ständig zur Verfügung standen
  rationale: Die Wendung ist partitativ und bezeichnet die Gruppe, aus der der Soldat ausgewählt wurde. προσκαρτερέω enthält hier den Gedanken beständiger persönlicher Dienstbereitschaft.
theological_decisions:
- issue: Bedeutung von ἄγγελος im Zusammenhang
  choice: Engel als himmlischer Bote
  alternative: Bote im allgemeinen Sinn
  rationale: Der unmittelbare Zusammenhang von Apostelgeschichte 10 schildert die Vision des Kornelius und weist eindeutig auf einen übernatürlichen Gesandten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt gut verständlich, obwohl der griechische Satz in Vers 8 weitergeführt wird. Die soziale Spannweite von οἰκέτης wird nicht eingeebnet, sondern durch die Fußnote offengehalten.
