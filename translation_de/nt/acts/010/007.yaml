  - severity: low
    issue: „mit ihm gesprochen hatte“
    rationale: λαλεῖν αὐτῷ bedeutet hier genauer „zu ihm sprechen“. Die Änderung vermeidet die zusätzliche Nuance eines wechselseitigen Gesprächs.
