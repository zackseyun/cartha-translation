  naturalness: Der Satz ist klares, modernes Standarddeutsch und behält einen würdigen Erzählton. „Sieh“ ist als knapper Aufmerksamkeitsruf für Ἰδού gut verständlich, ohne die archaischere Form „Siehe“ zu verwenden.
