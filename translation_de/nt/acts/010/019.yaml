id: ACT.10.19
reference: Acts 10:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: de
  text: 'Während Petrus noch über die Vision nachdachte, sagte der Geist zu ihm: »Sieh, Männer suchen dich.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Männer fragen nach dir.«'
    reason: Lexikalische Alternative zu ζητοῦντές σε; im Deutschen kann die Wendung kontextgemäß auch idiomatisch mit „nach dir fragen“ wiedergegeben werden.
lexical_decisions:
- source_word: διενθυμουμένου
  choice: noch … nachdachte
  rationale: Das Partizip bezeichnet ein anhaltendes, inneres Erwägen. „über … nachdachte“ ist im modernen Deutsch natürlich; „noch“ verdeutlicht den im Erzählzusammenhang fortdauernden Vorgang.
- source_word: περὶ τοῦ ὁράματος
  choice: über die Vision
  rationale: Die Präposition περί wird ausdrücklich mit „über“ wiedergegeben; „Vision“ ist eine klare und im Zusammenhang passende Wiedergabe von ὅραμα.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der bestimmte Ausdruck bezeichnet im Zusammenhang den göttlichen Geist. Die Übersetzung fügt „Heilige“ nicht hinzu, da ἅγιον hier nicht steht.
- source_word: εἶπεν αὐτῷ
  choice: sagte … zu ihm
  rationale: Dies entspricht der schlichten griechischen Formulierung und ist idiomatisches Standarddeutsch.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Ἰδού lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. „Sieh“ wahrt diese Funktion in einem würdigen, aber nicht altertümlichen Register.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἀνήρ bezeichnet hier konkret männliche Erwachsene und wird daher nicht geschlechtsneutral wiedergegeben.
- source_word: ζητοῦντές σε
  choice: suchen dich
  rationale: ζητέω bedeutet hier, dass die Männer Petrus ausfindig machen wollen. „suchen dich“ bleibt nahe am Wortlaut und ist verständlich; die idiomatischere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von τὸ πνεῦμα
  choice: „der Geist“ als der Heilige Geist, der zu Petrus spricht
  alternative: ein unbestimmter Geist oder eine innere geistige Regung
  rationale: Im Zusammenhang von Apostelgeschichte 10 lenkt der göttliche Geist Petrus. „der Geist“ bewahrt diese Aussage, ohne das im griechischen Text fehlende Adjektiv „heilig“ einzufügen.
- issue: Geschlechtsspezifische Wiedergabe von ἄνδρες
  choice: Männer
  alternative: Leute; Besucher
  rationale: Der griechische Ausdruck bezeichnet ausdrücklich männliche Personen; diese konkrete Angabe bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Erzählfluss, ohne unnatürlich zu wirken. „Sieh“ gibt den Aufmerksamkeitsruf Ἰδού knapper und gegenwärtiger wieder als das altertümliche „Siehe“.
