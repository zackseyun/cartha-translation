source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: de
  text: Am folgenden Tag kam er nach Cäsarea.[a] Kornelius erwartete sie und hatte seine Verwandten und engen Freunde zusammengerufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht zunächst das Verb in der Einzahl („er kam“), später jedoch das Fürwort in der Mehrzahl („sie“). Wahrscheinlich steht Petrus als Hauptperson im Vordergrund, während Kornelius ihn und seine Begleiter erwartete.
    reason: Die grammatische Spannung zwischen singularischem Verb und pluralischem Pronomen wird im Haupttext bewahrt und erklärt.
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Am folgenden Tag
  rationale: Die idiomatische Zeitangabe bezeichnet den nächsten Tag in der Erzählfolge; δέ wird durch den natürlichen Fortgang des deutschen Satzes wiedergegeben.
- source_word: εἰσῆλθεν εἰς τὴν Καισάρειαν
  choice: kam er nach Cäsarea
  rationale: Das singularische Aoristverb wird bewahrt. Bei einer Stadt ist „nach Cäsarea kommen“ im Deutschen natürlicher als „in Cäsarea eintreten“ und gibt die Ankunft sachgerecht wieder.
- source_word: ὁ δὲ Κορνήλιος
  choice: Kornelius
  rationale: δέ markiert einen leichten Wechsel des Erzählfokus; die deutsche Satzfolge macht diesen Übergang ohne zusätzliches „aber“ oder „nun“ deutlich.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: erwartete sie bereits
  rationale: Die periphrastische Imperfektform beschreibt eine andauernde Erwartung. Das ausdrücklich pluralische αὐτούς wird mit „sie“ erhalten; „bereits“ verdeutlicht die bestehende Situation, ohne den Sinn zu verändern.
- source_word: συγκαλεσάμενος
  choice: hatte … zusammengerufen
  rationale: Das Aoristpartizip bezeichnet hier sinnvoll eine Handlung, die vor dem Warten abgeschlossen war; das Plusquamperfekt bildet diese zeitliche Beziehung natürlich ab.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: seine Verwandten
  rationale: „Verwandte“ ist die klare, moderne Entsprechung für συγγενεῖς.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: engen Freunde
  rationale: ἀναγκαῖος bezeichnet bei φίλοι vertraute beziehungsweise nahestehende Freunde, nicht wörtlich „notwendige“ Freunde.
