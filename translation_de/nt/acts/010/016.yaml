  text: Das geschah dreimal, und sofort wurde der Gegenstand[a] in den Himmel[b] hinaufgenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Tuch«. Das griechische Wort bezeichnet allgemein ein Gefäß, Gerät oder einen Gegenstand; aus dem Zusammenhang geht hervor, dass hier das tuchartige Gebilde gemeint ist.'
