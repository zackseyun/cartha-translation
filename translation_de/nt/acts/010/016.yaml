lexical_decisions:
- source_word: τοῦτο
  choice: Das
  rationale: Das sächliche Demonstrativpronomen verweist auf den zuvor geschilderten Vorgang und klingt im modernen deutschen Erzählstil natürlich.
- source_word: δὲ
  choice: —
  rationale: Die schwache weiterführende Partikel wird durch den natürlichen Satzanschluss wiedergegeben und benötigt hier kein eigenes deutsches Wort.
- source_word: ἐγένετο
  choice: geschah
  rationale: Die ereignisbezogene Bedeutung von γίνομαι wird knapp und idiomatisch wiedergegeben.
- source_word: ἐπὶ τρίς
  choice: dreimal
  rationale: Die Wendung bezeichnet eine dreifache Wiederholung; »dreimal« ist die klare, heutige Entsprechung.
- source_word: καὶ εὐθὺς
  choice: und sofort
  rationale: Bewahrt sowohl die Verknüpfung als auch den unverzüglichen Übergang im Erzählablauf.
- source_word: ἀνελήμφθη
  choice: wurde … hinaufgenommen
  rationale: Die Form ist passiv und bezeichnet eine Bewegung nach oben. Die Wiedergabe wahrt beides, ohne den Handelnden zu ergänzen.
- source_word: τὸ σκεῦος
  choice: das Behältnis
  rationale: σκεῦος ist ein weiter Begriff für ein Gefäß, Behältnis oder einen Gegenstand. »Behältnis« bleibt relativ unspezifisch; das aus dem Kontext naheliegende »Tuch« wird als Alternative vermerkt.
- source_word: εἰς τὸν οὐρανόν
  choice: in den Himmel
  rationale: Die Präposition εἰς bezeichnet die Bewegung hinein beziehungsweise hinauf. Im Zusammenhang der Vision liegt »Himmel« näher, während die mögliche Bedeutung »Himmel/Luftraum« in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bedeutung von οὐρανός in der Vision des Petrus
  choice: Himmel
  alternative: Himmel im Sinn von Luftraum
  rationale: Der Gegenstand kehrt in der Offenbarungsvision in den Bereich zurück, aus dem er herabkam. »Himmel« passt zu diesem Zusammenhang, ohne die lexikalisch mögliche räumliche Bedeutung zu verschweigen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der Satz bleibt nahe an der knappen griechischen Struktur; »Behältnis« bewahrt die Unbestimmtheit von σκεῦος, während die Fußnoten die kontextuelle und semantische Spannweite sichtbar machen.
