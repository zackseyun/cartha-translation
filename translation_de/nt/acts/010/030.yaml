  to: 'Und Kornelius sagte: »Vor vier Tagen, genau um diese Stunde, betete ich zur neunten Stunde[a] in meinem Haus, und siehe, ein Mann stand vor mir in einem leuchtenden Gewand.«'
  rationale: Die Revision entfernt allein die interpretierende Ergänzung »plötzlich« und gibt ἰδού mit »und siehe« wieder. Dadurch bleibt die anschauliche Markierung des griechischen Berichts erhalten, ohne eine nicht gesicherte zeitliche Nuance hinzuzufügen.
