    issue: »plötzlich« ist eine nicht ausdrücklich im Ausgangstext enthaltene Verstärkung.
    rationale: ἰδού signalisiert Aufmerksamkeit und Lebendigkeit der Schilderung, behauptet aber nicht zwingend einen plötzlichen Vorgang. Die Ergänzung sollte deshalb entfallen; »siehe« bildet die Partikelfunktion ohne Bedeutungszuwachs ab.
  revised_text: 'Und Kornelius sagte: »Vor vier Tagen, genau um diese Stunde, betete ich zur neunten Stunde[a] in meinem Haus, und siehe, ein Mann stand vor mir in einem leuchtenden Gewand.«'
