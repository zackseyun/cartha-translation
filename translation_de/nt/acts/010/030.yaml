source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: de
  text: 'Und Kornelius sagte: »Vor vier Tagen, genau um diese Stunde, betete ich zur neunten Stunde[a] in meinem Haus, und siehe, ein Mann stand vor mir in einem leuchtenden Gewand.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: etwa um drei Uhr nachmittags.'
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: sagte
  rationale: Der Aorist dient als gewöhnliche narrative Redeeinleitung; »sagte« ist im Deutschen natürlich.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Vor vier Tagen, genau um diese Stunde
  rationale: Die Wendung bezeichnet den entsprechenden Zeitpunkt vier Tage zuvor. Diese Wiedergabe ist idiomatisches Deutsch und bewahrt sowohl den Abstand von vier Tagen als auch den Bezug auf dieselbe Stunde.
- source_word: ἤμην ... προσευχόμενος
  choice: betete ich
  rationale: Die periphrastische Imperfektform beschreibt eine damals andauernde Handlung. Das deutsche Präteritum gibt dies im Zusammenhang natürlich wieder.
- source_word: τὴν ἐνάτην
  choice: zur neunten Stunde
  rationale: Die antike Zeitangabe bleibt im Haupttext erhalten; ihre ungefähre moderne Entsprechung wird in einer Fußnote erklärt.
- source_word: ἐν τῷ οἴκῳ μου
  choice: in meinem Haus
  rationale: οἶκος bezeichnet hier den konkreten Aufenthaltsort; »Haus« ist die direkte und natürliche Entsprechung.
- source_word: ἰδοὺ
  choice: Da ... plötzlich
  rationale: ἰδού hebt das unerwartete, anschauliche Eintreten hervor. Die deutsche Konstruktion mit »Da« und »plötzlich« gibt diese Erzählfunktion natürlich wieder.
- source_word: ἀνὴρ
  choice: ein Mann
  rationale: ἀνήρ bezeichnet hier die männlich erscheinende Gestalt ausdrücklich als Mann.
- source_word: ἔστη ἐνώπιόν μου
  choice: stand ... vor mir
  rationale: Die Formulierung bewahrt die konkrete Aussage, dass die Gestalt vor Kornelius Stellung nahm bzw. dort stand.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: in einem leuchtenden Gewand
  rationale: ἐσθής bezeichnet Kleidung bzw. ein Gewand, λαμπρός dessen auffallende Helligkeit oder seinen Glanz. »Leuchtendes Gewand« erhält die visuelle Wirkung in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe der Zeitangabe τὴν ἐνάτην
  choice: zur neunten Stunde
  alternative: gegen drei Uhr nachmittags
  rationale: Die quellensprachliche antike Stundenzählung bleibt im Haupttext sichtbar; die moderne Entsprechung steht zur Verständlichkeit in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist flüssig formuliert, ohne die antike Zeitangabe oder die anschauliche Erscheinung einzuebnen.
