source:
  edition: SBLGNT
  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: de
  text: 'Ihr wisst selbst, was in ganz Judäa geschehen ist[a]: Es nahm seinen Anfang in Galiläa, nach der Taufe, die Johannes verkündete[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Botschaft, die sich in ganz Judäa verbreitete«. Das griechische Wort kann »Wort«, »Botschaft«, »Sache« oder »Geschehen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »beginnend von Galiläa«. Die griechische Partizipialkonstruktion ist syntaktisch ungewöhnlich, bezeichnet aber klar Galiläa als Ausgangspunkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: Ihr wisst selbst
  rationale: Das ausdrücklich gesetzte Pronomen ὑμεῖς verleiht Nachdruck; „selbst“ gibt diese Betonung im Deutschen natürlich wieder. οἴδατε hat hier präsentische Bedeutung.
- source_word: τὸ γενόμενον ῥῆμα
  choice: was … geschehen ist
  rationale: ῥῆμα kann „Wort“, „Botschaft“, „Sache“ oder „Geschehen“ bezeichnen. Zusammen mit γενόμενον und der geografischen Ausbreitung ist eine ereignishafte Wiedergabe im Deutschen am natürlichsten; die mögliche Bedeutung „Botschaft“ bleibt in einer Fußnote sichtbar.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: in ganz Judäa
  rationale: κατά mit dem Genitiv bezeichnet hier die Erstreckung über das gesamte Gebiet. „In ganz Judäa“ ist idiomatisches modernes Deutsch.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: Es nahm seinen Anfang in Galiläa
  rationale: Die griechische Partizipialkonstruktion ist syntaktisch locker. Der selbstständige deutsche Satz bewahrt den klaren Sinn des Ausgangspunkts, ohne eine grammatische Zuordnung dogmatisch festzulegen. Deutsch verwendet bei Ortsangaben zum Beginn natürlicherweise „in“ statt des wörtlichen „von“.
- source_word: μετὰ τὸ βάπτισμα
  choice: nach der Taufe
  rationale: μετά mit Akkusativ hat temporale Bedeutung; „nach der Taufe“ ist direkt und sachlich.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: die Johannes verkündete
  rationale: κηρύσσω bezeichnet öffentliches Verkündigen oder Ausrufen. Die Formulierung bewahrt, dass Johannes die Taufe verkündete, ohne ergänzend zu behaupten, er habe sie lediglich vollzogen.
theological_decisions:
- issue: Bedeutung von ῥῆμα in der Zusammenfassung des Petrus
  choice: Im Haupttext ereignishaft als „was … geschehen ist“ wiedergegeben.
  alternative: „das Wort/die Botschaft, die sich in ganz Judäa verbreitete“
  rationale: Der Zusammenhang weist auf den öffentlich bekannten Verlauf der Ereignisse um Jesus, doch ῥῆμα kann zugleich „Wort“ oder „Botschaft“ bedeuten. Die Fußnote erhält diese echte lexikalische Mehrdeutigkeit.
- issue: Bezug und Form von ἀρξάμενος
  choice: 'Als neuer Satz wiedergegeben: „Es nahm seinen Anfang in Galiläa“.'
  alternative: 'Partizipial: „beginnend von Galiläa“ oder bezogen auf eine implizite Person'
  rationale: Das maskuline Partizip steht syntaktisch auffällig neben dem sächlichen ῥῆμα. Die Übersetzung gibt den eindeutigen örtlich-zeitlichen Sinn wieder, ohne die schwierige Kongruenz künstlich aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Ihr“ entspricht der Anrede einer Mehrzahl. Der Doppelpunkt und der neue Satz glätten die im Griechischen lockere Partizipialfügung, während beide Fußnotenmarker im Haupttext erscheinen.
