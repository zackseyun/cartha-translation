source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: de
  text: Während Petrus noch innerlich darüber ratlos war, was die Vision, die er gesehen hatte, wohl zu bedeuten hatte[a], siehe, da standen die von Kornelius gesandten Männer am Tor[b], nachdem sie sich nach Simons Haus erkundigt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „was die Vision, die er gesehen hatte, wohl sei“. Im Zusammenhang geht es wahrscheinlich um ihre Bedeutung oder Tragweite.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Eingangstor“. Das griechische Wort kann das Tor oder den Eingangsbereich eines Hauses bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Während … noch
  rationale: Leitet den zeitlichen Hintergrund mit leichter narrativer Fortführung ein; „noch“ macht die Gleichzeitigkeit im Deutschen natürlich deutlich, ohne ein nicht vorhandenes „nun“ einzuführen.
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: innerlich ratlos war
  rationale: Bewahrt sowohl die innere Überlegung als auch die anhaltende starke Unsicherheit des Imperfekts.
- source_word: τί ἂν εἴη
  choice: was … wohl bedeuten sollte
  rationale: Im Zusammenhang fragt Petrus nach der Bedeutung der Vision. „Wohl“ gibt die durch ἄν markierte Ungewissheit wieder; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: die Vision, die er gesehen hatte
  rationale: Gibt das vorausliegende Sehen der Vision klar und in natürlicher deutscher Zeitfolge wieder.
- source_word: ἰδοὺ
  choice: siehe, da
  rationale: Erhält den aufmerksamkeitslenkenden, anschaulichen Erzählmarker; „da“ bindet ihn idiomatisch in den deutschen Satz ein.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: die Männer, die Kornelius gesandt hatte
  rationale: Identifiziert die Personen als erwachsene Männer und gibt das passive Gesandtsein natürlich im Aktiv mit Kornelius als ausdrücklich genanntem Urheber wieder.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: Sie hatten sich nach dem Haus Simons erkundigt
  rationale: Der vorzeitige Aoristpartizip wird als eigener Satz wiedergegeben, wodurch Reihenfolge und Lesbarkeit gewahrt bleiben. Die Wendung bedeutet, durch Nachfragen das Haus ausfindig zu machen.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: standen … am Eingangstor
  rationale: „Standen“ bewahrt die örtliche Darstellung des Verbs; „Eingangstor“ gibt πυλών als Tor beziehungsweise Eingangsanlage eines Hauses präzise wieder.
theological_decisions:
- issue: Bezug von τί ἂν εἴη auf die Vision
  choice: was die Vision … wohl bedeuten sollte
  alternative: was die Vision … wohl sei
  rationale: Der Kontext legt die Frage nach Sinn und Bedeutung nahe, doch die wörtlich mögliche ontologische Formulierung wird nicht verschwiegen, sondern in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert; die zeitliche Abfolge bleibt erhalten. „Siehe, da“ bewahrt die erzählerische Lebendigkeit, ohne altertümliches Satzgefüge.
