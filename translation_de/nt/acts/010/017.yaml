revisions:
- from: Während Petrus noch innerlich ratlos war, was die Vision, die er gesehen hatte, wohl bedeuten sollte[a], siehe, da standen die Männer, die Kornelius gesandt hatte, am Eingangstor. Sie hatten sich nach dem Haus Simons erkundigt[b].
  to: Während Petrus noch innerlich darüber ratlos war, was die Vision, die er gesehen hatte, wohl zu bedeuten hatte[a], siehe, da standen die von Kornelius gesandten Männer am Tor[b], nachdem sie sich nach Simons Haus erkundigt hatten.
  rationale: Die Revision beseitigt die mögliche Sollensnuance von „bedeuten sollte“, bindet die vorzeitige Erkundigung wieder klar an das Auftreten der Männer und setzt den Hinweis zu πυλών an den passenden Anker. Die Ambiguität von τί ἂν εἴη bleibt in Fußnote a erhalten.
