review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den zeitlichen Rahmen, die innere Ratlosigkeit, die Bedeutung der Vision, die von Kornelius gesandten Männer und ihr Auftreten am πυλών insgesamt gut. „Bedeuten sollte“ kann jedoch im Deutschen eine Sollens- bzw. Zwecknuance hervorrufen, die τί ἂν εἴη nicht verlangt. Die vorzeitige Erkundigung sollte zudem im Satz enger mit dem Auftreten am Tor verbunden bleiben.
  naturalness: Der Entwurf ist überwiegend natürlich und angemessen würdig. „Während Petrus noch innerlich darüber ratlos war, was ... wohl zu bedeuten hatte“ ist idiomatischer und semantisch präziser als „wohl bedeuten sollte“. Eine einheitliche Satzgestaltung mit „nachdem“ macht die zeitliche Abfolge ohne unnötigen zweiten Satz klar.
  terminology: „Vision“, „Kornelius“, „Simon“ und „Tor“ sind passend. „Von Kornelius gesandt“ bewahrt die passive Formulierung des Griechischen. Für πυλών ist „Tor“ eine klare moderne Wiedergabe; „Eingangstor“ bleibt als Alternative in der Fußnote möglich.
