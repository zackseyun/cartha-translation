  - severity: low
    issue: Reihenfolge von κοινόν καὶ ἀκάθαρτον umgestellt
    rationale: Die Umstellung ist nicht sinnentstellend, aber die Reihenfolge „unheiliges und unreines“ kann die begriffliche Differenz und den griechischen Wortlaut unmittelbarer abbilden.
