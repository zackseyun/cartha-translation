  source_fidelity: 'Die Wiedergabe von Μηδαμῶς, κύριε und οὐδέποτε ist treffend. Die Übersetzung von κοινόν als „nicht zum Verzehr erlaubt“ verschiebt jedoch die Aussage: Das griechische Wort bezeichnet hier einen kultischen Status („gemein“/profan, im Sinn von unheilig oder entweiht), nicht unmittelbar ein Speiseverbot. Zudem stellt der Haupttext die Reihenfolge der beiden griechischen Begriffe um.'
  naturalness: „Auf keinen Fall, Herr!“ und die anschließende Begründung sind modernes, würdiges und idiomatisches Deutsch. „Unheiliges und Unreines“ ist in diesem kultischen Kontext klar, natürlich und weniger umschreibend als „unrein und nicht zum Verzehr erlaubt“.
  terminology: „Unheilig“ gibt κοινόν im kultischen Kontrast angemessen wieder; „unrein“ entspricht ἀκάθαρτον. Das mit καί ausgedrückte „und“ bleibt erhalten, ohne die beiden Kategorien zu einer einzigen Vorschrift zu reduzieren.
