source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: de
  text: 'Petrus aber sagte: »Auf keinen Fall, Herr! Denn ich habe noch nie etwas Unheiliges und Unreines gegessen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »etwas Gemeines und Unreines«. »Gemein« bezeichnet hier nicht etwas Alltägliches, sondern etwas kultisch Profanes beziehungsweise Unheiliges.'
    reason: Die Anmerkung erläutert die kultische Bedeutung von κοινόν, ohne sie im Haupttext fälschlich auf ein ausdrücklich formuliertes Verzehrverbot zu reduzieren.
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Auf keinen Fall
  rationale: Gibt die entschiedene Zurückweisung idiomatisch und mit der nötigen Stärke wieder.
- source_word: κύριε
  choice: Herr
  rationale: Bewahrt die direkte Anrede und lässt offen, ob hier vor allem respektvolle Anrede oder die Anerkennung göttlicher Autorität im Vordergrund steht.
- source_word: κοινὸν καὶ ἀκάθαρτον
  choice: unrein und nicht zum Verzehr erlaubt
  rationale: κοινός bezeichnet hier kultisch profaniert bzw. nicht als rein geltend, nicht bloß etwas Gewöhnliches; ἀκάθαρτος bedeutet unrein. Die Formulierung macht den Speisekontext verständlich, ohne die beiden Begriffe gleichzusetzen.
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für Petrus’ Weigerung natürlich ein.
theological_decisions:
- issue: Verhältnis von κοινόν und ἀκάθαρτον
  choice: Die beiden mit καί verbundenen Merkmale werden kumulativ wiedergegeben.
  alternative: »unrein oder nicht zum Verzehr erlaubt«
  rationale: Der SBLGNT-Text liest καί, nicht ἤ. Deshalb wird die echte textliche Aussage »und« bewahrt, während die Fußnote die begriffliche Spannweite erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt entschieden, aber nicht umgangssprachlich. Der Speisekontext wird verständlich gemacht; die kultische Fachbedeutung bleibt durch die Fußnote nachvollziehbar.
