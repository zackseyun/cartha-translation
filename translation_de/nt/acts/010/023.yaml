id: ACT.10.23
reference: Acts 10:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: de
  text: Da bat er sie herein und nahm sie als Gäste auf.[a] Am nächsten Tag stand er auf und machte sich mit ihnen auf den Weg. Auch einige Brüder[b] aus Joppe gingen mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beherbergte sie“; das griechische Verb bezeichnet hier, dass er ihnen als Gästen Unterkunft gewährte.'
    reason: lexical_alternative
  - marker: b
    text: „Brüder“ gibt die maskuline Pluralform ἀδελφῶν wieder. Im frühchristlichen Sprachgebrauch kann das Wort bisweilen Glaubensgeschwister allgemein bezeichnen, also „Brüder und Schwestern“.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: bat er sie herein
  rationale: Das mediale Partizip bezeichnet, dass Petrus die Männer zu sich hereinbat. Die Formulierung ist natürlich und bewahrt die konkrete Einladung ins Haus.
- source_word: οὖν
  choice: Da
  rationale: Die Partikel markiert die erzählerische Folge aus dem vorangehenden Gespräch; „Da“ gibt dies im modernen deutschen Erzählstil unaufdringlich wieder.
- source_word: ἐξένισεν
  choice: nahm sie als Gäste auf
  rationale: ξενίζω bezeichnet hier gewährte Gastfreundschaft einschließlich Unterkunft. „Als Gäste aufnehmen“ ist idiomatisch und in diesem Zusammenhang hinreichend konkret; die Fußnote nennt die ausdrückliche Bedeutung „beherbergen“.
- source_word: Τῇ δὲ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Natürliche deutsche Wiedergabe der temporalen Wendung und des leichten narrativen Übergangs durch δέ.
- source_word: ἀναστὰς ἐξῆλθεν
  choice: stand er auf und machte sich ... auf den Weg
  rationale: „Stand auf“ bewahrt ἀναστάς, während „machte sich auf den Weg“ die im Kontext gemeinte Abreise durch ἐξῆλθεν natürlich ausdrückt, ohne beide Verben zusammenzuziehen.
- source_word: σὺν αὐτοῖς
  choice: mit ihnen
  rationale: Schlichte und genaue Wiedergabe der Begleitung.
- source_word: τινες τῶν ἀδελφῶν
  choice: einige Brüder
  rationale: τινες ist indefinit („einige“); das maskuline ἀδελφῶν wird formal als „Brüder“ wiedergegeben, während die mögliche weitere frühchristliche Verwendung in einer Fußnote erläutert wird.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: aus Joppe
  rationale: Die Präpositionalphrase bezeichnet Herkunft beziehungsweise Zugehörigkeit zum Ort. „Joppe“ ist die im Deutschen etablierte biblische Namensform.
- source_word: συνῆλθον αὐτῷ
  choice: gingen mit ihm
  rationale: Im Reisekontext bedeutet συνέρχομαι, dass die Brüder Petrus begleiteten. „Gingen mit ihm“ ist klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe von ἀδελφῶν in möglicherweise weiter gefasstem gemeindlichem Sprachgebrauch
  choice: Brüder
  alternative: Brüder und Schwestern; Glaubensgeschwister
  rationale: Die maskuline Pluralform wird im Haupttext bewahrt. Da ἀδελφοί im frühchristlichen Sprachgebrauch mitunter die Gemeinschaft der Glaubenden umfassender bezeichnen kann, wird diese echte Bedeutungsbreite in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit flüssigem Erzählrhythmus. Die Satzteilung macht den Ablauf verständlich, ohne inhaltliche Beziehungen aufzulösen. Beide Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Aussage.
