source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: de
  text: 'Doch Petrus richtete ihn auf[a] und sagte: »Steh auf[b]! Auch ich selbst bin ein Mensch.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hob ihn auf“ beziehungsweise „half ihm auf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Erhebe dich!“ beziehungsweise „Komm hoch!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: richtete ihn auf
  rationale: ἐγείρω bezeichnet hier, dass Petrus den vor ihm niedergefallenen Kornelius wieder aufrichtet. „Richtete ihn auf“ bewahrt die konkrete körperliche Handlung, ohne die genaue Art der Hilfe näher festzulegen.
- source_word: Ἀνάστηθι
  choice: Steh auf!
  rationale: Der Aoristimperativ von ἀνίστημι fordert Kornelius unmittelbar dazu auf, sich zu erheben. „Steh auf!“ ist im heutigen Deutsch natürlich und passt zum körperlichen Vorgang.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: Auch ich selbst
  rationale: καί drückt die Einbeziehung („auch“) aus, während αὐτός das Pronomen betont. „Auch ich selbst“ erhält beides und unterstreicht die gemeinsame Menschlichkeit.
- source_word: ἄνθρωπός εἰμι
  choice: bin ein Mensch
  rationale: ἄνθρωπος bezeichnet hier Petrus als Menschen. „Ein Mensch“ ist im Deutschen natürlicher und geschlechtsübergreifender als „ein Mann“ und fügt kein interpretierendes „nur“ hinzu.
- source_word: δὲ
  choice: Doch
  rationale: δέ setzt Petrus’ Reaktion in einen milden Gegensatz zu Kornelius’ Niederfallen im vorhergehenden Vers. „Doch“ gibt diesen korrigierenden Kontrast würdig und knapp wieder.
theological_decisions:
- issue: Petrus’ Reaktion auf die ehrerbietige Niederwerfung
  choice: Der Wortlaut zeigt, dass Petrus die Handlung zurückweist und dabei auf seine mit Kornelius geteilte Menschlichkeit verweist.
  alternative: Die Aussage kann enger als schlichte Demut verstanden werden, ohne dass daraus eine weitergehende Lehre über Verehrung abgeleitet wird.
  rationale: „Steh auf! Auch ich selbst bin ein Mensch“ bewahrt die klare Korrektur des Petrus, ohne eine umfassende Lehre über Anbetung oder kirchliche Ämter in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und bestimmt. „Auch ich selbst“ erhält die im Griechischen erkennbare Betonung, obwohl „Auch ich bin ein Mensch“ idiomatisch ebenfalls möglich wäre.
