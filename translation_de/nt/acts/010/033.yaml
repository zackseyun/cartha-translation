id: ACT.10.33
reference: Acts 10:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: de
  text: Darum ließ ich sofort[a] nach dir schicken, und du hast gut daran getan, zu kommen. Nun sind wir also alle hier vor Gott, um alles zu hören, was dir vom Herrn[b] aufgetragen worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unverzüglich“ bzw. „ohne zu zögern“.'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang ist mit „dem Herrn“ wahrscheinlich Jesus gemeint; manche verstehen die Bezeichnung hier allgemeiner als Bezug auf Gott.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: sofort
  rationale: Die adverbiale Wendung bezeichnet unverzügliches Handeln. „Sofort“ ist im heutigen Deutsch natürlich und gibt die Dringlichkeit präzise wieder.
- source_word: οὖν
  choice: Darum / also
  rationale: Das erste οὖν zieht die Folgerung aus dem zuvor Gesagten; in νῦν οὖν kennzeichnet es den Übergang zum Zweck der Versammlung. Die unterschiedlichen deutschen Wiedergaben entsprechen der jeweiligen Funktion im Satz.
- source_word: ἔπεμψα πρὸς σέ
  choice: ließ ich nach dir schicken
  rationale: Wörtlich wurde zu Petrus gesandt; im Kontext schickte Kornelius Boten, um ihn holen zu lassen. Die deutsche Wendung gibt diesen Sinn natürlich wieder, ohne Petrus selbst zum direkten Objekt von ἔπεμψα zu machen.
- source_word: καλῶς ἐποίησας παραγενόμενος
  choice: du hast gut daran getan zu kommen
  rationale: Die idiomatische Formulierung drückt Zustimmung zu Petrus’ Kommen aus und bildet die Verbindung von Hauptverb und Partizip natürlich ab.
- source_word: πάντες ἡμεῖς
  choice: wir ... alle
  rationale: Die Stellung bewahrt die ausdrückliche Einbeziehung aller Versammelten.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe, würdevolle Wendung bewahrt den feierlichen Gedanken des bewussten Stehens in Gottes Gegenwart.
- source_word: πάρεσμεν
  choice: sind ... hier
  rationale: „Hier sein“ ist die natürliche moderne Entsprechung für „anwesend sein“.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: alles, was dir ... aufgetragen worden ist
  rationale: „Aufgetragen“ vermittelt die autoritative Anweisung, klingt im Kontext einer zu überbringenden Botschaft jedoch natürlicher als „befohlen“.
- source_word: ὑπὸ τοῦ κυρίου
  choice: vom Herrn
  rationale: Die Formulierung hält sich an den griechischen Wortlaut und legt den Bezug von κύριος nicht ausdrücklich fest.
theological_decisions:
- issue: Bezug von τοῦ κυρίου („des Herrn“)
  choice: „vom Herrn“ ohne ausdrückliche Identifizierung
  alternative: „von Gott“ oder interpretierend „vom Herrn Jesus“
  rationale: Im Zusammenhang kann „der Herr“ Jesus bezeichnen; wegen des unmittelbar vorausgehenden „vor Gott“ ist jedoch auch ein allgemeiner Bezug auf Gott erwogen worden. Der Ausgangstext nennt nur „den Herrn“, daher bleibt diese Spannung in der Übersetzung erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzführung bleibt nahe am griechischen Gedankengang, vermeidet jedoch unnatürliche Wörtlichkeit.
