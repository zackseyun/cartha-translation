  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: de
  text: Und er befahl uns, dem Volk zu verkünden und eindringlich zu bezeugen, dass dieser der von Gott bestimmte Richter über Lebende und Tote ist[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der von Gott eingesetzte Richter über Lebende und Tote«.'
    reason: Lexikalische Alternative für ὁ ὡρισμένος.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: befahl
  rationale: Das Verb bezeichnet einen verbindlichen, autoritativen Auftrag; »befahl« bewahrt diese Stärke.
- source_word: κηρύξαι
  choice: zu verkünden
  rationale: Das Verb meint öffentliches Ausrufen oder Bekanntmachen; »verkünden« ist natürlich und vermeidet die mögliche Verengung von »predigen« auf eine Predigt.
- source_word: τῷ λαῷ
  choice: dem Volk
  rationale: Der bestimmte Ausdruck bezeichnet im Kontext das jüdische Volk, ohne dass der Vers selbst ausdrücklich »Israel« nennt.
- source_word: διαμαρτύρασθαι
  choice: eindringlich zu bezeugen
  rationale: Die Form bezeichnet nachdrückliches, ernstes Zeugnis; »eindringlich« gibt die verstärkte Aussagekraft idiomatisch wieder.
- source_word: οὗτός
  choice: er
  rationale: Das Demonstrativpronomen weist betont auf Jesus zurück. Im Deutschen ist »er« in diesem Satz natürlicher als das schwerfällige »dieser ist derjenige«, ohne den Bezug zu verändern.
- source_word: ὁ ὡρισμένος
  choice: der ... bestimmte
  rationale: Das perfekte Passivpartizip bezeichnet den von Gott festgelegten beziehungsweise eingesetzten Träger des Richteramtes mit fortdauerndem Status.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: Die Präpositionalfügung bezeichnet bei der passiven Form eindeutig Gott als Handelnden.
- source_word: κριτὴς
  choice: Richter
  rationale: »Richter« gibt das Prädikatsnomen direkt wieder; »Richter über« ist in modernem Deutsch eine natürliche Verbindung.
- source_word: ζώντων καὶ νεκρῶν
  choice: über Lebende und Tote
  rationale: Die substantivierten Adjektive erfassen die umfassende Reichweite des Richteramtes knapp und feierlich.
theological_decisions:
- issue: Göttliche Bestimmung Jesu zum Richter
  choice: der von Gott bestimmte Richter über Lebende und Tote
  alternative: der von Gott eingesetzte Richter über Lebende und Tote
  rationale: Die Übersetzung wahrt die ausdrückliche Aussage, dass Gott Jesus als universalen Richter bestimmt hat, ohne sie durch spätere dogmatische Begrifflichkeit auszubauen. »Bestimmt« hält zudem die Bedeutungsbreite von ὁρίζω zwischen Festlegung, Bezeichnung und Einsetzung offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallelen Infinitive und der feierliche Ausdruck »Lebende und Tote« bleiben erhalten; unnötige kirchliche Fachsprache wird vermieden.
