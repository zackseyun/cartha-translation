  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: de
  text: 'Da ging Petrus zu den Männern hinunter und sagte: »Seht, ich bin der, den ihr sucht. Aus welchem Grund seid ihr hier?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: ging … hinunter
  rationale: Das Aoristpartizip bezeichnet, dass Petrus von seinem erhöhten Aufenthaltsort zu den Besuchern hinunterging. Die finite deutsche Form fügt sich natürlich in die Erzählung ein und bewahrt die Richtungsangabe.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter und bezeichnet keinen starken Gegensatz. „Da“ gibt den Fortgang im Deutschen knapp und natürlich wieder.
- source_word: πρὸς τοὺς ἄνδρας
  choice: zu den Männern
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung auf die Männer zu.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: ἰδού ist ein aufmerksamkeitslenkender Ausdruck. „Seht“ bewahrt diesen auffordernden Charakter in würdiger, verständlicher Sprache.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: ich bin der, den ihr sucht
  rationale: Die Formulierung gibt die Identifikation und den Relativsatz eng am griechischen Text wieder, ohne altertümlich zu klingen.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: Aus welchem Grund seid ihr hier?
  rationale: Die Wiedergabe erhält das ausdrückliche Substantiv αἰτία („Grund, Ursache“) und gibt πάρεστε als gegenwärtige Anwesenheit wieder.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit natürlichem Erzählfluss und würdiger direkter Rede. Die ausdrückliche Frage nach dem „Grund“ wurde gegenüber dem knapperen „Warum seid ihr hier?“ bewahrt; ein Fußnotenapparat ist dafür nicht erforderlich.
