id: ACT.9.7
reference: Acts 9:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: de
  text: Die Männer, die mit ihm unterwegs waren, standen sprachlos da; sie hörten zwar die Stimme[a], sahen aber niemanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Laut. Das griechische Wort kann sowohl „Stimme“ als auch „Laut“ bedeuten; vergleiche Apostelgeschichte 22,9.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Die Männer
  rationale: δέ ist hier ein schwaches Bindewort; der Zusammenhang und die zwar–aber-Konstruktion geben die Fortführung beziehungsweise den Kontrast im Deutschen ausreichend wieder.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: die mit ihm unterwegs waren
  rationale: συνοδεύω bezeichnet das Begleiten auf einer Reise. Die Wendung ist im modernen Deutschen natürlich und bewahrt den Reisekontext.
- source_word: εἱστήκεισαν
  choice: standen … da
  rationale: Der Plusquamperfektstamm von ἵστημι hat hier statische Bedeutung. „standen da“ beschreibt ihren Zustand idiomatisch, ohne zusätzlich zu behaupten, sie seien stehen geblieben.
- source_word: ἐνεοί
  choice: sprachlos
  rationale: ἐνεός bezeichnet Sprachlosigkeit beziehungsweise Unfähigkeit zu sprechen; „sprachlos“ lässt zugleich das im Erzählzusammenhang naheliegende Erschrecken anklingen.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: sie hörten zwar die Stimme
  rationale: φωνή bezeichnet häufig eine Stimme, kann aber auch einen Laut meinen. „Stimme“ ist die naheliegende Wiedergabe; die echte lexikalische Alternative wird in einer Fußnote offengehalten. μέν wird zusammen mit δέ durch „zwar … aber“ abgebildet.
- source_word: μηδένα δὲ θεωροῦντες
  choice: sahen aber niemanden
  rationale: θεωρέω bedeutet hier „sehen“ oder „wahrnehmen“, und μηδένα bezieht sich auf keine sichtbare Person. Die Formulierung ist klar und natürlich.
theological_decisions:
- issue: Scheinbare Spannung zwischen Apostelgeschichte 9,7 und 22,9 darüber, was die Begleiter des Saulus hörten
  choice: φωνή im Haupttext mit „Stimme“ wiedergeben und die Bedeutung „Laut“ in einer Fußnote nennen
  alternative: Im Haupttext „Laut“ schreiben, um zwischen dem Wahrnehmen eines Lautes und dem Hören beziehungsweise Verstehen einer Stimme zu unterscheiden
  rationale: Der griechische Ausdruck lässt beide Bedeutungen zu. Die Übersetzung „Stimme“ folgt dem naheliegenden Wortsinn und bewahrt die Spannung zu Apostelgeschichte 22,9, statt sie durch eine harmonisierende Festlegung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Strichpunkt hält die eng verbundenen Partizipialangaben im selben Satz; „zwar … aber“ bildet die griechische μέν–δέ-Gegenüberstellung klar ab.
