  variant: modern standard German
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: de
  text: Und das wurde in ganz Joppe bekannt, und viele glaubten an den Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: dies wurde ... bekannt
  rationale: Die unpersönliche Wendung bezeichnet das Bekanntwerden des zuvor berichteten Geschehens. „Dies wurde bekannt“ ist im Deutschen natürlich und lässt offen, wer die Nachricht verbreitete.
- source_word: δὲ
  choice: Und
  rationale: δέ führt hier die Erzählung mit einem schwachen Anschluss weiter; „Und“ gibt diese Funktion unaufdringlich wieder.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: in ganz Joppe
  rationale: κατά mit dem Genitiv bezeichnet hier die Verbreitung über das gesamte Gebiet der Stadt. „In ganz Joppe“ ist natürlich und bewahrt die umfassende Aussage von ὅλης.
- source_word: Ἰόππης
  choice: Joppe
  rationale: „Joppe“ ist die im Deutschen herkömmliche neutestamentliche Form des Ortsnamens.
- source_word: ἐπίστευσαν
  choice: kamen zum Glauben
  rationale: Der Aorist beschreibt hier im Erzählzusammenhang das Eintreten des Glaubens. „Kamen zum Glauben“ gibt diesen Ereignisaspekt natürlicher wieder als das potenziell zuständliche „glaubten“.
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv lässt sich knapp und genau mit „viele“ wiedergeben, ohne „Menschen“ ergänzen zu müssen.
- source_word: ἐπὶ τὸν κύριον
  choice: an den Herrn
  rationale: Bei πιστεύω bezeichnet ἐπί mit Akkusativ die Person, auf die sich Glaube und Vertrauen richten. Die idiomatische deutsche Verbindung lautet „an den Herrn glauben“.
- source_word: κύριον
  choice: Herrn
  rationale: „Herr“ bewahrt sowohl den ehrenden Titel als auch sein christologisches Gewicht im Kontext der Apostelgeschichte.
theological_decisions:
- issue: Wiedergabe von πιστεύω mit ἐπὶ τὸν κύριον
  choice: kamen zum Glauben an den Herrn
  alternative: glaubten an den Herrn
  rationale: Die gewählte Formulierung bewahrt den persönlichen Bezug des Glaubens auf den Herrn und macht zugleich den Ereignischarakter des Aorists sichtbar, ohne den Begriff durch eine engere dogmatische Deutung festzulegen.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Meister
  rationale: „Herr“ entspricht dem üblichen neutestamentlichen Titel und bewahrt dessen christologische Tragweite; „Meister“ wäre hier semantisch zu eng.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Satz folgt dem schlichten Erzählstil des griechischen Textes. Keine Fußnoten erforderlich.
