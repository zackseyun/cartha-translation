  to: Da stand Petrus auf und ging mit ihnen. Als er angekommen war, führten sie ihn hinauf in das Zimmer im Obergeschoss. Alle Witwen standen weinend bei ihm[a] und zeigten ihm die Untergewänder und Obergewänder[b], die Dorkas[c] angefertigt hatte, als sie noch bei ihnen war.
