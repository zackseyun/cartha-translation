source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: de
  text: Da stand Petrus auf und ging mit ihnen. Als er angekommen war, führten sie ihn hinauf in das Zimmer im Obergeschoss. Alle Witwen standen weinend bei ihm[a] und zeigten ihm die Untergewänder und Obergewänder[b], die Dorkas[c] angefertigt hatte, als sie noch bei ihnen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stellten sich neben ihn“ beziehungsweise „vor ihn“. Das griechische Verb bezeichnet hier ihr Aufstellen bei Petrus, legt die genaue räumliche Anordnung aber nicht eindeutig fest.'
    reason: lexical_alternative
  - marker: b
    text: Die beiden griechischen Begriffe unterscheiden ein am Körper getragenes Gewand von einem darüber getragenen oder sonstigen äußeren Kleidungsstück.
    reason: cultural_note
  - marker: c
    text: Dorkas ist der griechische Name der Frau, die in Apostelgeschichte 9,36 auch Tabita genannt wird.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand … auf
  rationale: Das Aoristpartizip bezeichnet hier die einleitende Reaktion des Petrus; „stand auf“ gibt die Bewegung natürlich und präzise wieder.
- source_word: συνῆλθεν αὐτοῖς
  choice: ging mit ihnen
  rationale: Im Zusammenhang bedeutet συνέρχομαι, dass Petrus die Boten begleitete. Die Wendung ist im Deutschen klar und idiomatisch.
- source_word: παραγενόμενον
  choice: als er angekommen war
  rationale: Das Partizip hat temporale Funktion und bezeichnet die Ankunft vor dem Hinaufführen.
- source_word: ἀνήγαγον
  choice: führten sie ihn hinauf
  rationale: Die Übersetzung bewahrt sowohl das Begleiten als auch die aufwärtsgerichtete Bewegung.
- source_word: ὑπερῷον
  choice: Zimmer im Obergeschoss
  rationale: Diese moderne, allgemein verständliche Formulierung bezeichnet den Raum im oberen Stockwerk, ohne das heute ungebräuchliche „Obergemach“ zu verwenden.
- source_word: παρέστησαν αὐτῷ
  choice: traten … zu ihm
  rationale: Die Formulierung gibt wieder, dass die Witwen sich in unmittelbarer Nähe zu Petrus aufstellten, ohne die mögliche räumliche Nuance „vor“ oder „neben“ ihm zu verengen.
- source_word: πᾶσαι αἱ χῆραι
  choice: alle Witwen
  rationale: χήρα bezeichnet eindeutig eine Witwe; πᾶσαι hebt die gesamte anwesende Gruppe hervor.
- source_word: κλαίουσαι
  choice: weinend
  rationale: Das Präsenspartizip schildert ihre andauernde Trauer und lässt sich knapp und würdig adverbial wiedergeben.
- source_word: ἐπιδεικνύμεναι
  choice: zeigten ihm
  rationale: Das Verb beschreibt das vorzeigende Präsentieren der Kleidungsstücke; das explizite „ihm“ macht den Bezug im Deutschen klar.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: Unter- und Obergewänder
  rationale: Die Wiedergabe wahrt den Unterschied zwischen dem am Körper getragenen χιτών und dem darüber getragenen beziehungsweise allgemeiner äußeren ἱμάτιον.
- source_word: ὅσα ἐποίει
  choice: die … angefertigt hatte
  rationale: Das Imperfekt beschreibt ihre frühere Tätigkeit; das deutsche Plusquamperfekt fügt sich in den zeitlichen Rückblick ein, ohne zwingend eine besondere Gewohnheitsbedeutung festzulegen.
- source_word: μετ’ αὐτῶν οὖσα
  choice: als sie noch bei ihnen war
  rationale: Die Formulierung bewahrt den zeitlichen und gemeinschaftlichen Sinn; „noch“ entspricht im Deutschen natürlich der Perspektive nach ihrem Tod.
