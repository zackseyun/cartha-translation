  - severity: low
    issue: Die Fußnotenalternative „für die Sache meines Namens“ ist unnatürlich und nicht als gleichwertige deutsche Übersetzungsalternative geeignet.
    rationale: Sie klingt künstlich und kann durch eine knappe, idiomatische Alternativangabe ersetzt werden.
