id: ACT.9.16
reference: Acts 9:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: de
  text: Denn ich werde ihm zeigen, wie viel er um meines Namens willen[a] leiden muss.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für meinen Namen“; das heißt: wegen meines Namens oder für die Sache meines Namens.'
    reason: Die Präposition ὑπέρ kann hier Anlass, Zweck oder Eintreten für den Namen bezeichnen.
lexical_decisions:
- source_word: ἐγὼ γὰρ
  choice: Denn ich
  rationale: „Denn“ bewahrt die begründende Verbindung zum vorherigen Vers. Das Personalpronomen ist im Deutschen für die finite Verbform erforderlich; eine zusätzliche Verstärkung wie „ich selbst“ würde den griechischen Nachdruck möglicherweise überzeichnen.
- source_word: ὑποδείξω αὐτῷ
  choice: werde ihm zeigen
  rationale: Die Wendung gibt Futur, indirektes Objekt und die direkte Bedeutung von ὑποδείκνυμι natürlich und präzise wieder.
- source_word: ὅσα
  choice: wie viel
  rationale: Im Zusammenhang mit Leiden bezeichnet ὅσα idiomatisch dessen Ausmaß. „Wie viel“ ist im Deutschen natürlicher als das formal mögliche „was alles“.
- source_word: δεῖ αὐτὸν … παθεῖν
  choice: er … leiden muss
  rationale: Die deutsche Konstruktion bewahrt die Notwendigkeit von δεῖ, ohne näher festzulegen, ob sie als Bestimmung, Vorsehung oder anderweitige Notwendigkeit zu verstehen ist.
- source_word: ὑπὲρ τοῦ ὀνόματός μου
  choice: für meinen Namen
  rationale: Die knappe Formulierung bewahrt die semantische Weite von ὑπέρ sowie die biblische Bedeutung von „Name“ als Ausdruck der Person, Autorität und öffentlichen Zugehörigkeit zu Jesus.
theological_decisions:
- issue: Art der durch δεῖ ausgedrückten Notwendigkeit
  choice: muss
  alternative: ist dazu bestimmt
  rationale: Der griechische Wortlaut stellt eine Notwendigkeit fest, definiert aber nicht ausdrücklich deren genaue metaphysische oder heilsgeschichtliche Art. „Muss“ erhält diese Spannung.
- issue: Bedeutungsumfang von „meinem Namen“
  choice: meinen Namen
  alternative: mich
  rationale: 'Die wörtliche Rede vom Namen wird beibehalten, weil sie mehr umfassen kann als einen bloßen Ersatz für die Person: auch Autorität, Bekenntnis und Zugehörigkeit schwingen mit.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die Formulierung bleibt nahe am griechischen Text, ohne unnatürliche griechische Syntax nachzuahmen.
