id: ACT.9.10
reference: Acts 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: de
  text: 'In Damaskus lebte ein Jünger namens Hananias. Der Herr sagte in einer Vision zu ihm: »Hananias!« Er antwortete: »Hier bin ich, Herr.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: In Damaskus lebte
  rationale: Das Imperfekt von εἰμί führt einen neuen Handlungsteilnehmer ein, während δέ einen leichten erzählerischen Übergang markiert. Im Deutschen ergibt die Umstellung mit »lebte« einen natürlichen Szenenbeginn, ohne ein zeitliches »nun« hinzuzufügen.
- source_word: τις μαθητὴς
  choice: ein Jünger
  rationale: τις führt eine zuvor unbekannte Person unbestimmt ein. Der deutsche unbestimmte Artikel gibt dies natürlich wieder; »ein gewisser Jünger« wäre unnötig betont.
- source_word: ἐν Δαμασκῷ
  choice: in Damaskus
  rationale: Schlichte Ortsangabe mit ἐν und Dativ; der eingebürgerte deutsche Ortsname wird verwendet.
- source_word: ὀνόματι Ἁνανίας
  choice: namens Hananias
  rationale: Der Dativ ὀνόματι dient idiomatisch zur Namensangabe. »namens Hananias« ist knapp und natürlich.
- source_word: ἐν ὁράματι
  choice: in einer Vision
  rationale: Die Wendung bezeichnet die Weise, in der der Herr Hananias anspricht; »in einer Vision« ist im modernen Deutschen klar und idiomatisch.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Der bestimmte Artikel wird bewahrt; im Zusammenhang bezeichnet die Formulierung den auferstandenen Jesus.
- source_word: εἶπεν πρὸς αὐτόν
  choice: sagte ... zu ihm
  rationale: λέγω mit πρός und Akkusativ wird direkt und idiomatisch mit »zu jemandem sagen« wiedergegeben.
- source_word: Ἁνανία
  choice: Hananias
  rationale: Der Vokativ des Eigennamens wird mit der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: Ἰδοὺ ἐγώ
  choice: Hier bin ich
  rationale: Die feste Antwortformel drückt Anwesenheit und Bereitschaft aus. »Hier bin ich« gibt ihre Funktion in natürlichem Deutsch besser wieder als ein wörtliches »Siehe, ich«.
- source_word: κύριε
  choice: Herr
  rationale: Obwohl κύριε je nach Kontext auch eine höfliche Anrede sein kann, richtet sich Hananias hier an den göttlichen Sprecher der Vision; »Herr« ist daher sachgerecht.
theological_decisions:
- issue: Bezug von ὁ κύριος und κύριε in der Vision
  choice: Beide werden mit »Herr« wiedergegeben und beziehen sich im Erzählzusammenhang auf den auferstandenen Jesus.
  alternative: Eine allgemeinere göttliche Anrede oder beim Vokativ »mein Herr« beziehungsweise »Herr!«
  rationale: Der Fortgang von Apostelgeschichte 9 identifiziert den Sprecher als den Herrn, der Hananias wegen Saulus beauftragt. Die Übersetzung »Herr« bewahrt den christologischen Gehalt, ohne den Namen Jesus erklärend in den Vers einzufügen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die beiden griechisch mit καί verbundenen Hauptaussagen werden zur natürlichen deutschen Erzählführung in getrennten Sätzen wiedergegeben. Keine Fußnoten erforderlich.
