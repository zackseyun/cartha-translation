id: ACT.9.34
reference: Acts 9:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: de
  text: 'Und Petrus sagte zu ihm: „Äneas, Jesus, der Messias,[a] heilt dich. Steh auf und mach dir selbst dein Bett.“ Und sofort stand er auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰᾶταί
  choice: heilt
  rationale: Das griechische Präsens bezeichnet hier die wirksame Heilungszusage. „Heilt“ gibt die Form direkt wieder, ohne sie als Verlauf oder bereits abgeschlossenes Ergebnis festzulegen.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός ist hier als Titel Jesu zu verstehen. „Der Messias“ macht diesen Titelgehalt im heutigen Deutsch deutlich; die traditionelle Wiedergabe „Christus“ bleibt in der Fußnote erhalten.
- source_word: ἀνάστηθι
  choice: Steh auf
  rationale: Die natürliche neuhochdeutsche Aufforderung passt zur Situation des zuvor Bettlägerigen und bewahrt den unmittelbaren Befehlscharakter.
- source_word: στρῶσον σεαυτῷ
  choice: mach dir selbst dein Bett
  rationale: στρώννυμι bezeichnet das Herrichten oder Ausbreiten der Schlafstätte. Die idiomatische Wendung „das Bett machen“ ist klar; „dir selbst“ bewahrt das reflexive σεαυτῷ und betont die wiedergewonnene Fähigkeit.
- source_word: εὐθέως
  choice: sofort
  rationale: „Sofort“ gibt die unverzügliche Reaktion knapp und natürlich wieder.
- source_word: ἀνέστη
  choice: stand er auf
  rationale: Die Formulierung greift den vorangehenden Befehl sprachlich auf und schildert dessen unmittelbare Erfüllung.
- source_word: Αἰνέα
  choice: Äneas
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Heilungszusage
  choice: Jesus, der Messias
  alternative: Jesus Christus
  rationale: Die Wiedergabe als Titel bewahrt die Bedeutung von Χριστός, ohne „Christus“ wie einen bloßen Namensbestandteil erscheinen zu lassen. Die Apposition mit Kommas ist idiomatisches Deutsch und entspricht dem artikellosen griechischen Titelgebrauch.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und kraftvoll; „mach dir selbst dein Bett“ bewahrt sowohl die alltagssprachliche Natürlichkeit als auch die im griechischen Reflexivpronomen betonte eigene Tätigkeit.
