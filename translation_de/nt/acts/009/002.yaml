  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: de
  text: und bat ihn um Briefe an die Synagogen in Damaskus, damit er, falls er Menschen fände, die dem Weg[a] angehörten – Männer wie Frauen –, sie gefesselt nach Jerusalem bringe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Weg gehörten“ oder „Anhänger des Weges waren“. Das Griechische verwendet hier eine frühe Bezeichnung für die christliche Bewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: erbat von ihm
  rationale: Die Verbindung von αἰτέω mit παρά und Genitiv bezeichnet eine Bitte an die Person, von der etwas erbeten wird. „Erbat von ihm“ ist knapp, würdevoll und erhält die Herkunft der Briefe.
- source_word: ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: Briefe an die Synagogen in Damaskus
  rationale: Die beiden Präpositionalgruppen bezeichnen Damaskus als Zielort und die Synagogen als Adressaten. Die deutsche Formulierung gibt dies natürlich wieder, ohne den nur kontextuell erschließbaren Gedanken einer Vollmacht ausdrücklich hinzuzufügen.
- source_word: ὅπως ἐάν
  choice: damit … wenn
  rationale: ὅπως drückt den Zweck aus, während ἐάν mit dem Konjunktiv die Bedingung beziehungsweise Möglichkeit markiert. „damit … wenn“ bewahrt beides.
- source_word: τινας
  choice: Menschen
  rationale: Das indefinite Pronomen bezeichnet hier beliebige Personen. „Menschen“ ist im Deutschen natürlicher als „irgendwelche“ als substantivischer Ausdruck und wird durch „Männer wie Frauen“ näher bestimmt.
- source_word: τῆς ὁδοῦ ὄντας
  choice: die zum Weg gehörten
  rationale: Die genitivische Wendung bezeichnet die Zugehörigkeit zu der frühchristlichen Bewegung. „zum Weg gehörten“ bewahrt den historischen Titel, ohne ihn vorschnell als bloßes „Christen“ aufzulösen.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: Männer wie Frauen
  rationale: τε καὶ verbindet beide ausdrücklich genannten Gruppen. Die Formulierung erhält die Aussage, dass Saulus Männer und Frauen gleichermaßen festnehmen wollte.
- source_word: δεδεμένους
  choice: gefesselt
  rationale: Das Perfektpartizip Passiv von δέω bezeichnet den Zustand des Gebundenseins. „gefesselt“ ist direkt und legt nicht fest, ob Ketten, Stricke oder andere Fesseln gemeint sind.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: nach Jerusalem bringen könnte
  rationale: ἄγω mit εἰς bezeichnet das Verbringen an einen Zielort. Der Konjunktiv steht im Zweckgefüge; „bringen könnte“ gibt die beabsichtigte Möglichkeit idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von τῆς ὁδοῦ als frühchristliche Bewegungsbezeichnung
  choice: zum Weg gehörten
  alternative: Anhänger des Weges waren
  rationale: „der Weg“ bleibt als historischer Titel erhalten. Die gewählte Form bewahrt zugleich die Zugehörigkeitskonstruktion des Griechischen und vermeidet eine stärker deutende Umschreibung.
- issue: Ausdrückliche Nennung von Männern und Frauen
  choice: Männer wie Frauen
  alternative: sowohl Männer als auch Frauen
  rationale: Die Übersetzung erhält die im Griechischen hervorgehobene Reichweite der geplanten Verfolgung und ersetzt die beiden Gruppen nicht durch einen unspezifischen Sammelbegriff.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbat“ trägt dem erzählerischen und institutionellen Zusammenhang Rechnung, ohne unnötig amtssprachlich zu wirken. Der Gedankenstrich hebt die ausdrücklich genannten Männer und Frauen hervor; der Zusatz „dort“ macht im Deutschen klar, dass das Finden in Damaskus gemeint ist.
