  naturalness: „Und er war mit ihnen in Jerusalem, ging dort ein und aus und sprach freimütig im Namen des Herrn“ ist modernes, würdiges Standarddeutsch. „Dort“ bindet „ein und aus“ eindeutig an Jerusalem als Ort des Wirkens.
