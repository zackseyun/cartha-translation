id: ACT.9.28
reference: Acts 9:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: de
  text: Und er war mit ihnen in Jerusalem, ging dort ein und aus und sprach freimütig im Namen des Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: er ging bei ihnen … ein und aus
  rationale: Die fortdauernde Gemeinschaft wird zusammen mit den folgenden Partizipien idiomatisch wiedergegeben. „Bei ihnen“ bewahrt die Bedeutung der Zugehörigkeit, ohne ausdrücklich einen Wohnaufenthalt anzunehmen.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: ging … ein und aus
  rationale: Die feste Wendung bezeichnet freie, regelmäßige Bewegung innerhalb der Gemeinschaft. Die deutsche Formulierung bewahrt das Bild und klingt zugleich natürlich.
- source_word: εἰς Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: εἰς hat hier im Zusammenhang mit „ein- und ausgehen“ lokativen Sinn und bezeichnet Jerusalem als Wirkungsbereich, nicht wiederholte Eintritte in die Stadt.
- source_word: παρρησιαζόμενος
  choice: sprach unerschrocken
  rationale: Das Verb bezeichnet freimütiges, offenes und furchtloses Reden. „Unerschrocken“ bringt den Mut deutlich zum Ausdruck, ohne den Inhalt des Redens zu ergänzen.
- source_word: ἐν τῷ ὀνόματι
  choice: im Namen
  rationale: Die biblische Wendung kann Bevollmächtigung, Repräsentation und Bekenntnis einschließen. Die direkte Wiedergabe hält diese Bedeutungsbreite offen.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: κύριος wird als Titel übersetzt. Obwohl im Kontext Jesus gemeint ist, wird der griechische Wortlaut nicht durch den Eigennamen präzisiert.
theological_decisions:
- issue: Bezug von „des Herrn“
  choice: Der Titel „des Herrn“ bleibt im Haupttext stehen; im Kontext bezieht er sich auf Jesus.
  alternative: „im Namen Jesu“
  rationale: Der griechische Text hat κυρίου und nicht Ἰησοῦ. Die Übersetzung bewahrt daher den christologischen Titel und löst ihn nicht stillschweigend in einen Eigennamen auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle, aber weiterhin verständliche Wendung „ein und aus gehen“ bewahrt die Bildlichkeit des Griechischen; „unerschrocken“ gibt die freimütige Kühnheit prägnant wieder.
