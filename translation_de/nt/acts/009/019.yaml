  text: καὶ λαβὼν τροφὴν ⸀ἐνίσχυσεν. Ἐγένετο ⸀δὲ μετὰ τῶν ἐν Δαμασκῷ μαθητῶν ἡμέρας τινὰς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/019.yaml
  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: de
  text: Nachdem er etwas gegessen hatte, kam er wieder zu Kräften. Er war dann einige Tage mit den Jüngern in Damaskus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: Nachdem er etwas gegessen hatte
  rationale: Die Wendung bezeichnet die Aufnahme von Nahrung; die idiomatische deutsche Formulierung gibt die zeitliche Abfolge des Aoristpartizips natürlich wieder.
- source_word: ἐνίσχυσεν
  choice: kam er wieder zu Kräften
  rationale: Im Zusammenhang mit Sauls vorausgegangenem Fasten drückt das Verb aus, dass seine körperliche Kraft zurückkehrte. Die Formulierung ist idiomatisch und bewahrt den resultativen Sinn.
- source_word: Ἐγένετο δὲ
  choice: Dann blieb er
  rationale: Ἐγένετο δὲ dient hier als erzählerischer Übergang. Zusammen mit der folgenden Zeitangabe lässt sich der andauernde Aufenthalt im Deutschen natürlich mit „Dann blieb er“ ausdrücken.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: bei den Jüngern in Damaskus
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft beziehungsweise Zusammensein. „Bei“ ist im Zusammenhang eines mehrtägigen Aufenthalts natürlich; „in Damaskus“ kann sowohl den Ort des Zusammenseins als auch die dortigen Jünger bezeichnen.
- source_word: ἡμέρας τινάς
  choice: einige Tage
  rationale: Der Akkusativ bezeichnet die Dauer; τινάς lässt die genaue Zahl offen. „Einige Tage“ bewahrt diese Unbestimmtheit.
