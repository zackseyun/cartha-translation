id: ACT.9.13
reference: Acts 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: de
  text: 'Doch Hananias erwiderte: »Herr, ich habe von vielen über diesen Mann gehört, wie viel Böses[a] er deinen Heiligen in Jerusalem angetan hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was für böse Taten«.'
    reason: Das griechische ὅσα κακά kann sowohl das Ausmaß als auch die Vielzahl beziehungsweise Art der bösen Taten hervorheben.
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: Doch Hananias erwiderte
  rationale: δέ markiert hier einen leicht gegensätzlichen Fortgang, da Hananias zögernd auf den Auftrag reagiert. »Erwiderte« gibt ἀπεκρίθη in natürlichem Erzählstil wieder.
- source_word: Κύριε
  choice: Herr
  rationale: Die Anrede gilt im unmittelbaren Zusammenhang dem auferstandenen Jesus und bewahrt sowohl den respektvollen als auch den theologischen Gehalt von κύριος.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: ich habe von vielen … gehört
  rationale: Das deutsche Perfekt klingt in direkter Rede natürlich und bringt zum Ausdruck, dass die erhaltenen Berichte für Hananias’ gegenwärtigen Einwand relevant sind. »Von vielen« wahrt die knappe, unbestimmte Formulierung des Griechischen.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: über diesen Mann
  rationale: Direkte und idiomatische Wiedergabe von περί mit Genitiv und dem Demonstrativpronomen.
- source_word: ὅσα κακὰ
  choice: wie viel Böses
  rationale: Die Formulierung bringt das Ausmaß der bösen Taten idiomatisch zum Ausdruck, ohne die Wendung auf eine genaue Anzahl einzelner Taten festzulegen.
- source_word: τοῖς ἁγίοις σου
  choice: deinen Heiligen
  rationale: »Heilige« ist die etablierte neutestamentliche Bezeichnung für die zu Christus gehörenden Gläubigen und bewahrt den Possessivbezug σου.
- source_word: ἐποίησεν
  choice: angetan hat
  rationale: Im Deutschen verbindet sich »Böses antun« natürlich mit einem Dativobjekt und gibt den schädigenden Sinn der Aussage im Kontext präziser wieder als das steifere »getan hat«.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Standardmäßige lokale Wiedergabe.
theological_decisions:
- issue: Bezug und Aussagekraft von Κύριε in der Anrede des Hananias
  choice: direkte Anrede Jesu als »Herr«
  alternative: »Gebieter« oder eine lediglich höfliche Anrede
  rationale: Im unmittelbaren Kontext antwortet Hananias dem auferstandenen Jesus in einer Vision. »Herr« entspricht daher dem Erzählzusammenhang, ohne über dessen Aussage hinauszugehen.
- issue: Bezeichnung der Gläubigen als τοῖς ἁγίοις σου
  choice: »deinen Heiligen«
  alternative: »den Menschen, die zu dir gehören« oder »deinen heiligen Leuten«
  rationale: Die substantivierte Bezeichnung »Heilige« erhält den neutestamentlichen Sprachgebrauch und die ausdrückliche Zugehörigkeit zum Herrn, ohne eine spätere kirchliche Sonderklasse zu behaupten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt natürlich; »wie viel Böses … angetan hat« vermeidet eine unidiomatische, übermäßig wörtliche Formulierung.
