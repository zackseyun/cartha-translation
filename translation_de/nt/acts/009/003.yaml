  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: de
  text: Als er unterwegs war und sich Damaskus näherte, geschah es, dass ihn plötzlich ein Licht vom Himmel[a] umstrahlte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort οὐρανός kann den Himmel als göttlichen Bereich oder den sichtbaren Himmel bezeichnen; in diesem Zusammenhang weist „Himmel“ wahrscheinlich auf den göttlichen Ursprung des Lichtes hin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Als er unterwegs war
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv bezeichnet eine gleichzeitig verlaufende Handlung. Die milde fortführende Funktion von δέ ergibt sich im Deutschen aus dem Erzählfluss und braucht kein eigenes »nun«.
- source_word: ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: und sich Damaskus näherte
  rationale: Die griechische Wendung mit ἐγένετο und Akkusativ mit Infinitiv wird idiomatisch wiedergegeben. Der durative Aspekt von ἐγγίζειν bleibt durch »sich näherte« erhalten; der Dativ bezeichnet den Ort, dem er nahe kam.
- source_word: ἐξαίφνης τε
  choice: plötzlich
  rationale: ἐξαίφνης bezeichnet den unvermittelten Eintritt des Geschehens. Die leichte Verknüpfung durch τε wird bereits durch den deutschen Satzbau geleistet.
- source_word: αὐτὸν περιήστραψεν φῶς
  choice: umstrahlte ihn ein Licht
  rationale: περιαστράπτω bezeichnet ein ringsum aufleuchtendes oder strahlendes Licht. »umstrahlte« gibt die ihn umgebende Wirkung prägnant und natürlich wieder.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: οὐρανός kann Himmel oder Luftraum bedeuten; im Offenbarungskontext von Lukas–Apostelgeschichte liegt »Himmel« als Hinweis auf den göttlichen Ursprung näher.
theological_decisions:
- issue: Bedeutung von οὐρανός im Offenbarungskontext
  choice: vom Himmel
  alternative: vom Himmel her / vom Firmament
  rationale: »Himmel« bewahrt die wahrscheinliche Aussage über den göttlichen Ursprung des Lichtes, ohne diesen Ursprung ausdrücklich auszudeuten. Die lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die lukanische, im Deutschen schwerfällige Konstruktion mit »es geschah« wurde idiomatisch geglättet, ohne den zeitlichen Ablauf oder die Plötzlichkeit des Ereignisses zu verändern.
