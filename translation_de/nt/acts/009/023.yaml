id: ACT.9.23
reference: Acts 9:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: de
  text: Als aber viele Tage vergangen waren[b], verschworen sich[c] die Juden[a], ihn zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch „die Juden“; im Zusammenhang ist eine bestimmte Gruppe gemeint, die sich Saulus widersetzte, nicht ausnahmslos jeder jüdische Mensch.
    reason: cultural_note
  - marker: b
    text: 'Oder: „sich erfüllt hatten“ beziehungsweise „voll geworden waren“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „berieten sie miteinander“ beziehungsweise „planten sie gemeinsam“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als aber
  rationale: ὡς leitet hier einen temporalen Nebensatz ein; δέ markiert den erzählerischen Übergang mit einer leichten Gegenüberstellung. „Als aber“ gibt beides knapp und natürlich wieder.
- source_word: ἐπληροῦντο
  choice: vergangen waren
  rationale: Bei „Tagen“ als Subjekt bezeichnet das passive πληρόω idiomatisch das Ablaufen beziehungsweise Vollwerden einer Zeitspanne. „Vergangen waren“ ist im Deutschen natürlich und wahrt den zeitlichen Sinn.
- source_word: ἡμέραι ἱκαναί
  choice: viele Tage
  rationale: ἱκαναί bezeichnet hier eine beträchtliche Anzahl beziehungsweise eine längere Zeit, nicht bloß eine ausreichende Anzahl. „Viele Tage“ bildet die griechische Formulierung klar ab.
- source_word: συνεβουλεύσαντο
  choice: verschworen sich
  rationale: Das Verb bezeichnet eine gemeinsame Beratung oder Planung; der folgende Tötungszweck macht die feindliche Absicht ausdrücklich. „Verschworen sich“ vermittelt die gemeinschaftliche geheime Planung in idiomatischem Deutsch.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Der griechische Text nennt die Gruppe ohne nähere Einschränkung „die Juden“. Die Übersetzung bewahrt diese Formulierung; eine Fußnote verhindert eine pauschale Deutung auf alle jüdischen Menschen.
- source_word: ἀνελεῖν
  choice: zu töten
  rationale: ἀναιρέω bedeutet hier, jemandem das Leben zu nehmen. „Töten“ ist direkt und fügt keine im Verb selbst nicht ausdrücklich enthaltene rechtliche Wertung hinzu.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich im Zusammenhang eindeutig auf Saulus.
theological_decisions:
- issue: Wiedergabe von οἱ Ἰουδαῖοι in einem feindseligen Erzählzusammenhang
  choice: die Juden
  alternative: die Judäer; die jüdischen Führer
  rationale: Die Übersetzung bewahrt die ausdrückliche, nicht weiter eingegrenzte Bezeichnung des Ausgangstextes. Da der Vers weder nur Führungspersonen nennt noch eine geografische Präzisierung verlangt, werden solche Deutungen nicht in den Haupttext aufgenommen. Die Fußnote stellt zugleich klar, dass im Kontext eine bestimmte Gegnerschaft gemeint ist und keine unterschiedslose Aussage über alle Juden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung bleibt nah am griechischen Aufbau, ohne unnatürlich zu wirken. Die Formulierung wahrt die zeitliche Bildlichkeit und die kollektive feindliche Planung; kontextuell notwendige Präzisierungen stehen in den Fußnoten statt als interpretierende Zusätze im Haupttext.
