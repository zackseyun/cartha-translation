  text: καὶ ἦν ἡμέρας τρεῖς μὴ βλέπων, καὶ οὐκ ἔφαγεν οὐδὲ ἔπιεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: de
  text: Drei Tage lang konnte er nichts sehen[a], und er aß und trank nichts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »war er nicht sehend«. Gemeint ist, dass Saul nicht sehen konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Drei Tage lang
  rationale: Der Akkusativ bezeichnet die Zeitdauer. Die deutsche Wendung gibt sie natürlich wieder; das in dieser Konstruktion wenig selbstständige ἦν muss nicht eigens mit »war« abgebildet werden.
- source_word: μὴ βλέπων
  choice: konnte er nichts sehen
  rationale: Das Partizip bedeutet wörtlich »nicht sehend«. Die gewählte Formulierung drückt Sauls Unfähigkeit zu sehen idiomatisch aus, ohne im Haupttext das stärkere Adjektiv »blind« einzuführen.
- source_word: οὐκ ἔφαγεν οὐδὲ ἔπιεν
  choice: er aß und trank nichts
  rationale: Die verbundenen Verneinungen werden in natürlichem Deutsch als gemeinsame Verneinung beider Verben wiedergegeben.
