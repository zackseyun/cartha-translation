  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: de
  text: 'Da ging Hananias hin, trat in das Haus ein, legte ihm die Hände auf und sagte: „Bruder Saul, der Herr Jesus, der dir auf dem Weg erschienen ist, auf dem du unterwegs warst[a], hat mich gesandt, damit du wieder sehen kannst[b] und mit dem Heiligen Geist erfüllt wirst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Weg, auf dem du herkamst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit du dein Augenlicht wiedererlangst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Da ging ... hin
  rationale: δέ führt die Erzählung weiter; „Da“ nimmt im Deutschen den Folgezusammenhang natürlich auf. „ging ... hin“ gibt ἀπέρχομαι ohne unnötige Betonung des Weggehens wieder.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: trat in das Haus ein
  rationale: Eine natürliche und zugleich eng am griechischen Bewegungsausdruck orientierte Wiedergabe.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: legte ihm die Hände auf
  rationale: Bewahrt die körperliche Handlung und entspricht der geläufigen deutschen biblischen Wendung.
- source_word: Σαοὺλ ἀδελφέ
  choice: Bruder Saul
  rationale: Gibt den Vokativ direkt, würdevoll und im Deutschen idiomatisch wieder, ohne die genaue Grundlage der brüderlichen Anrede näher festzulegen.
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: der Herr hat mich gesandt
  rationale: Das Perfekt wird mit dem deutschen Perfekt wiedergegeben und wahrt die fortbestehende Bedeutung der Sendung.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: Jesus, der dir ... erschienen ist
  rationale: Ἰησοῦς steht als nachgestellte Identifizierung zu „der Herr“; die appositionelle, spannungsreiche Wortfolge des Griechischen bleibt erhalten. Das passive ὀφθείς wird idiomatisch als „erschienen“ wiedergegeben.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: auf dem Weg ..., auf dem du herkamst
  rationale: Bewahrt den relativen Anschluss und den durativen Bewegungsaspekt des Imperfekts, ohne das Ziel ausdrücklich hinzuzufügen.
- source_word: ὅπως
  choice: damit
  rationale: Kennzeichnet den Zweck der Sendung klar und natürlich.
- source_word: ἀναβλέψῃς
  choice: du wieder sehen kannst
  rationale: Im Kontext bezeichnet das Verb die Wiedererlangung des Sehvermögens; die Formulierung bleibt näher am Bild des Sehens als das abstraktere „dein Augenlicht wiedererlangen“.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: mit dem Heiligen Geist erfüllt wirst
  rationale: Die deutsche Fügung verlangt „mit“; „der Heilige Geist“ ist die natürliche Wiedergabe der eindeutigen Referenz trotz fehlenden griechischen Artikels.
theological_decisions:
- issue: Beziehung von „Jesus“ zu „der Herr“
  choice: „der Herr hat mich gesandt – Jesus, der dir ... erschienen ist –“
  alternative: „der Herr Jesus, der dir ... erschienen ist, hat mich gesandt“
  rationale: Die gewählte Fassung bewahrt die griechische Wortfolge, in der „Jesus“ nach „hat mich gesandt“ steht und „der Herr“ identifiziert. Die Alternative ist glatter, löst aber die syntaktische Spannung stärker auf.
- issue: Artikel bei πνεύματος ἁγίου
  choice: „mit dem Heiligen Geist“
  alternative: „mit Heiligem Geist“
  rationale: Der fehlende griechische Artikel erzwingt keine unbestimmte Bedeutung. Im Kontext der Apostelgeschichte ist der göttliche Geist gemeint; mit Artikel ist dies im modernen Deutsch am natürlichsten.
- issue: Bedeutung der Anrede ἀδελφέ
  choice: „Bruder Saul“ ohne nähere Ausdeutung
  alternative: Eine ausdrücklich christliche oder ethnische Umschreibung
  rationale: Die Anrede vermittelt Nähe und Annahme, doch der Vers allein legt nicht abschließend fest, ob der Schwerpunkt auf gemeinsamer Zugehörigkeit zu Israel oder auf entstehender christlicher Gemeinschaft liegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählton. Die eingeschobene Identifizierung Jesu wird durch Gedankenstriche kenntlich gemacht; dadurch bleibt die auffällige griechische Syntax erhalten, ohne unverständlich zu werden. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Wendungen.
