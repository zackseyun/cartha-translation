    rationale: Im Griechischen identifiziert Ἰησοῦς den zuvor genannten κύριος. Die deutsche Einschubkonstruktion nach dem finiten Verb ist stilistisch holprig und kann den Eindruck einer nachträglichen, lose angehängten Benennung erwecken. Die vorangestellte Formulierung „der Herr Jesus“ gibt dieselbe Identifikation klar wieder.
  - severity: low
