    rationale: „auf dem Weg ..., auf dem du herkamst“ ist zwar möglich, aber die Wiederholung und „herkamst“ klingen hier weniger natürlich. „auf dem Weg, auf dem du unterwegs warst“ bewahrt den durativen Bewegungsaspekt von ἤρχου; die nähere Alternative kann in der Fußnote stehen.
