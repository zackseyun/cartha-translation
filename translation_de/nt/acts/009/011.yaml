source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: de
  text: 'Der Herr sagte zu ihm: „Steh auf und geh zur Straße namens ‚Die Gerade‘ und suche im Haus des Judas nach einem Mann namens Saulus aus Tarsus, denn siehe, er betet.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: der Herr
  rationale: Bewahrt die übliche neutestamentliche Wiedergabe des Titels, ohne die im unmittelbaren Kontext erkennbare Identität des Sprechers im Vers ausdrücklich zu ergänzen.
- source_word: Ἀναστὰς πορεύθητι
  choice: Steh auf und geh
  rationale: Das aoristische Partizip ist eng mit dem folgenden Imperativ verbunden; die deutsche imperativische Reihung ist natürlich und gibt den Handlungsbeginn klar wieder.
- source_word: ῥύμην
  choice: Straße
  rationale: Bezeichnet hier eine innerstädtische Straße und wird im modernen Deutsch am klarsten mit „Straße“ wiedergegeben.
- source_word: τὴν καλουμένην Εὐθεῖαν
  choice: die ‚Die Gerade‘ heißt
  rationale: Gibt die Benennungskonstruktion wieder und kennzeichnet Εὐθεῖαν als Straßennamen; der Artikel innerhalb des deutschen Namens sorgt für eine natürliche substantivische Form.
- source_word: ζήτησον
  choice: Suche ... nach
  rationale: ζητέω fordert hier dazu auf, eine bestimmte Person aufzusuchen beziehungsweise nach ihr zu fragen; „nach ... suchen“ vermeidet die zu starke Aussage „finden“.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: im Haus des Judas
  rationale: Gibt den Ort der Suche nah an der griechischen Konstruktion wieder und klingt zugleich natürlich.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: einem Mann namens Saulus aus Tarsus
  rationale: ὀνόματι führt den Namen ein, während Ταρσέα die Herkunft bezeichnet. Die Ergänzung „einem Mann“ macht die deutsche Formulierung idiomatisch, ohne zusätzliche inhaltliche Festlegung.
- source_word: ἰδοὺ γὰρ
  choice: denn sieh
  rationale: „denn“ bewahrt die begründende Funktion von γάρ, während „sieh“ die aufmerksamkeitslenkende Kraft von ἰδού wiedergibt, ohne den gehobenen Ton von „siehe“ zu erzwingen.
- source_word: προσεύχεται
  choice: er betet
  rationale: Das deutsche Präsens bezeichnet in diesem Kontext natürlich die gerade stattfindende Handlung; „er ist am Beten“ wäre weniger würdig und stilistisch schwerfälliger.
theological_decisions:
- issue: Referent von κύριος
  choice: „der Herr“ ohne erklärende Erweiterung
  alternative: „der Herr Jesus“
  rationale: Der Kontext identifiziert den Sprecher, doch der vorliegende griechische Vers hat nur κύριος. Die Übersetzung bewahrt diese Form und fügt den Namen Jesus nicht in den Haupttext ein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und handlungsorientiert. Kein Fußnotenmarker ist erforderlich, da „aus Tarsus“ die Funktion des Herkunftsadjektivs Ταρσέα im Haupttext transparent wiedergibt.
