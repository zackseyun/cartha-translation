revisions:
- from: 'Der Herr sagte zu ihm: „Steh auf und geh zu der Straße, die ‚Die Gerade‘ heißt. Suche dort im Haus des Judas nach einem Mann namens Saulus aus Tarsus; denn sieh, er betet.“'
  to: 'Der Herr sagte zu ihm: „Steh auf und geh zur Straße namens ‚Die Gerade‘ und suche im Haus des Judas nach einem Mann namens Saulus aus Tarsus, denn siehe, er betet.“'
  rationale: Die Revision entfernt eine nicht ausdrücklich im Ausgangstext enthaltene Ortsdeixis, verbindet die γάρ-Begründung wieder enger mit dem Hauptsatz und glättet die Wiedergabe des Straßennamens. Inhalt, Ambiguitäten und theologischer Titelgebrauch bleiben unverändert. Für Ταρσέα ist keine Fußnote erforderlich, weil „aus Tarsus“ die Herkunftsbezeichnung transparent wiedergibt.
