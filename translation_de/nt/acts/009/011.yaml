    rationale: Das griechische ἐν οἰκίᾳ Ἰούδα lokalisiert die Suche im Haus des Judas, enthält aber kein eigenständiges „dort“. Die Streichung hält die Übersetzung enger am Ausgangstext.
  - severity: low
    issue: Satztrennung und Formulierung von ἰδοὺ γάρ
    rationale: ἰδοὺ γάρ bildet im Griechischen eine zusammenhängende aufmerksamkeitslenkende Begründung. Ein Komma statt Punkt und „denn siehe“ geben diese Verbindung klarer wieder.
  - severity: low
    issue: Straßenname syntaktisch schwerfällig
    rationale: „die Straße, die ‚Die Gerade‘ heißt“ ist wegen der wiederholten Artikelstruktur stilistisch sperrig. „die Straße namens ‚Die Gerade‘“ bewahrt die Benennung und ist natürlicher.
