  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: de
  text: Doch steh auf und geh in die Stadt; dir wird gesagt werden, was du tun musst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Die adversative Konjunktion markiert den Übergang zu Jesu Anweisung; „Doch“ ist hier knapp, natürlich und würdevoll.
- source_word: ἀνάστηθι
  choice: steh auf
  rationale: Der Aorist-Imperativ fordert Saul unmittelbar auf, sich vom Boden zu erheben.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: geh in die Stadt
  rationale: Das idiomatische deutsche „in die Stadt gehen“ gibt die gerichtete Bewegung von εἰσέρχομαι mit εἰς natürlich wieder; „tritt in die Stadt ein“ wäre unnötig steif.
- source_word: λαληθήσεταί σοι
  choice: Dort wird dir gesagt werden
  rationale: Das Passiv und die ungenannte handelnde Person bleiben erhalten. „Dort“ stellt im Deutschen den durch die Stadtangabe gegebenen Ortsbezug klar, ohne den Inhalt zu erweitern.
- source_word: ὅ τί
  choice: was
  rationale: Das Relativ-Interrogativum leitet den Inhalt dessen ein, was Saul gesagt werden wird; „was“ ist die natürliche deutsche Entsprechung.
- source_word: σε δεῖ ποιεῖν
  choice: was du tun musst
  rationale: „musst“ bewahrt die starke Notwendigkeit beziehungsweise Verpflichtung von δεῖ, ohne deren Ursprung näher festzulegen.
theological_decisions:
- issue: Bedeutung von δεῖ im Zusammenhang göttlicher Weisung
  choice: musst
  alternative: zu tun hast; tun sollst
  rationale: „musst“ erhält die starke Notwendigkeit, die δεῖ ausdrückt, lässt aber offen, wie göttliche Bestimmung und menschliche Verantwortung zueinander stehen.
- issue: Ungenannte handelnde Person beim Passiv λαληθήσεταί
  choice: Passiv ohne genannten Urheber
  alternative: jemand wird dir sagen
  rationale: Der griechische Text nennt nicht, wer Saul unterweisen wird. Die deutsche Passivform bewahrt diese Offenheit.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. Die beiden Imperative bleiben direkt; die passive Formulierung bewahrt die Zurückhaltung des griechischen Textes.
