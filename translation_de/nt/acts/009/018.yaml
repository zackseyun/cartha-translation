source:
  edition: SBLGNT
  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: de
  text: Sofort fiel ihm etwas wie Schuppen von den Augen[a], und er konnte wieder sehen. Dann stand er auf und wurde getauft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihm fiel etwas wie Schuppen von den Augen.« Die griechische Formulierung verwendet einen Vergleich und sagt nicht, dass es buchstäbliche Schuppen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die unmittelbare zeitliche Abfolge im modernen Deutschen knapp und natürlich wieder.
- source_word: ἀπέπεσαν
  choice: fiel ... von ...
  rationale: Das Verb bezeichnet ein Herab- oder Abfallen; die deutsche Konstruktion mit »von den Augen« gibt die Ablösung idiomatisch wieder.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: ihm ... von den Augen
  rationale: Der possessive Bezug wird im Deutschen natürlich durch den Dativ »ihm« ausgedrückt.
- source_word: ὡς λεπίδες
  choice: etwas wie Schuppen
  rationale: ὡς kennzeichnet einen Vergleich, ohne die Erscheinung als buchstäbliche Schuppen zu bestimmen; »etwas wie« bewahrt diese Offenheit.
- source_word: ἀνέβλεψεν
  choice: er konnte wieder sehen
  rationale: Im Heilungskontext bezeichnet ἀναβλέπω die Wiederherstellung des Sehvermögens, nicht bloß ein Aufblicken.
- source_word: τε καὶ
  choice: und ... Dann
  rationale: Die Konnektoren verbinden die wiedergewonnene Sicht mit der anschließenden Handlung; die deutsche Satzfolge macht den Ablauf klar.
- source_word: ἀναστάς
  choice: stand er auf
  rationale: Das Aoristpartizip bezeichnet hier die nächste Handlung in der Erzählfolge.
- source_word: ἐβαπτίσθη
  choice: ließ sich taufen
  rationale: Diese im Deutschen übliche Wiedergabe des passiven Taufverbs bezeichnet den Empfang der Taufe, ohne eine bestimmte Taufweise festzulegen.
theological_decisions:
- issue: Konfessionell neutrale Wiedergabe von βαπτίζω
  choice: ließ sich taufen
  alternative: wurde getauft / ließ sich untertauchen
  rationale: »Ließ sich taufen« ist natürliches Deutsch und legt weder die Taufweise noch eine konfessionelle Deutung fest. »Untertauchen« wäre hier unnötig modespezifisch.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Erzählregister. Kurze Hauptsätze bilden die rasche Abfolge der Ereignisse ab.
