  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: de
  text: 'Er fiel zu Boden und hörte eine Stimme, die zu ihm sagte: »Saul, Saul, warum verfolgst du mich?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: Er fiel zu Boden
  rationale: Der Aoristpartizipialausdruck bezeichnet im Zusammenhang eine dem Hören vorausgehende Begleithandlung. Ein selbstständiger deutscher Satz gibt den Ablauf natürlich wieder; »zu Boden« entspricht der Bewegung auf den Boden.
- source_word: ἤκουσεν φωνὴν
  choice: hörte eine Stimme
  rationale: Da unmittelbar verständliche Rede folgt, bedeutet φωνή hier »Stimme« und nicht lediglich »Laut« oder »Geräusch«.
- source_word: λέγουσαν αὐτῷ
  choice: die zu ihm sagte
  rationale: Die attributive Partizipialkonstruktion wird im Deutschen natürlich als Relativsatz wiedergegeben und leitet die direkte Rede ein.
- source_word: Σαοὺλ Σαούλ
  choice: Saul, Saul
  rationale: Der Personenname und seine rhetorisch bedeutsame Wiederholung werden bewahrt.
- source_word: τί
  choice: warum
  rationale: τί wird in dieser Verbindung adverbial gebraucht und fragt nach dem Grund.
- source_word: με
  choice: mich
  rationale: Das direkte Objekt bleibt ohne erklärende Erweiterung erhalten und bewahrt die pointierte Identifikation des Sprechers mit den Verfolgten.
- source_word: διώκεις
  choice: verfolgst du
  rationale: Das Präsens bezeichnet Sauls fortdauerndes feindliches Vorgehen. »Verfolgen« ist hier im Deutschen idiomatisch und kontextgerecht.
theological_decisions:
- issue: Identifikation des Sprechers mit den von Saul Angegriffenen
  choice: Die direkte Formulierung »mich« bleibt unverändert stehen.
  alternative: Erklärende Wiedergaben wie »meine Leute« oder »meine Anhänger«
  rationale: Der Vers selbst identifiziert den Sprecher unmittelbar mit der verfolgten Gemeinschaft. Diese theologische Spannung soll im Text erhalten und nicht durch eine Paraphrase aufgelöst werden.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der griechische Partizipialbeginn wird für einen natürlichen deutschen Erzählfluss als koordinierte Handlung wiedergegeben; die direkte Anrede bleibt knapp und eindringlich.
