  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: πεσὼν ἐπὶ τὴν γῆν als „fiel zu Boden“, ἤκουσεν φωνήν als „hörte eine Stimme“ und die direkte Anrede einschließlich der Wiederholung des Namens. Die deutsche Satzkoordination gibt den begleitend-vorangehenden Aoristpartizipialausdruck idiomatisch wieder, ohne eine unzulässige zusätzliche Aussage einzuführen. „Warum verfolgst du mich?“ trifft τί με διώκεις präzise.'
