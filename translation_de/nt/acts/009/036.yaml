  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: de
  text: In Joppe lebte eine Jüngerin namens Tabita[a]; übersetzt heißt sie Dorkas. Sie tat viele gute Werke und gab immer wieder Almosen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dorkas ist die griechische Übersetzung des aramäischen Namens Tabita; beide Namen bedeuten »Gazelle«.
    reason: Die Anmerkung erläutert die im Text genannte Übersetzung des Namens und gibt dessen Bedeutung wieder.
lexical_decisions:
- source_word: μαθήτρια
  choice: Jüngerin
  rationale: Das griechische Substantiv ist ausdrücklich feminin. Das natürliche deutsche Wort »Jüngerin« gibt dies präzise wieder.
- source_word: ὀνόματι Ταβιθά
  choice: namens Tabita
  rationale: »Namens« ist eine natürliche und genaue Wiedergabe der griechischen Namensformel; der Personenname folgt der im Deutschen üblichen Form.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: Übersetzt heißt dieser Name Dorkas
  rationale: Die Formulierung macht deutlich, dass Dorkas die griechische Entsprechung des semitischen Namens Tabita ist, nicht lediglich eine Sachbezeichnung.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: reich an guten Werken
  rationale: »Reich an« vermittelt die bezeichnete Fülle idiomatisch; »gute Werke« bewahrt die direkte lexikalische Bedeutung.
- source_word: ἐλεημοσυνῶν ὧν ἐποίει
  choice: unterstützte Bedürftige immer wieder mit ihren Gaben
  rationale: ἐλεημοσύνη bezeichnet fürsorgliche Gaben beziehungsweise Almosen. Die Umformung ist im heutigen Deutsch natürlich, und »immer wieder« bringt den gewohnheitsmäßigen Aspekt des Imperfekts ἐποίει zum Ausdruck.
- source_word: Ἐν Ἰόππῃ δέ
  choice: In Joppe
  rationale: Der Ortsname wird in seiner üblichen deutschen Form wiedergegeben. Das schwache erzählerische δέ benötigt hier keinen eigenen deutschen Ausdruck.
theological_decisions:
- issue: Die ausdrücklich feminine Bezeichnung μαθήτρια
  choice: Jüngerin
  alternative: weiblicher Jünger
  rationale: »Jüngerin« bewahrt die im Griechischen ausdrücklich feminine Form vollständig und klingt zugleich natürlich; eine umständliche Umschreibung ist unnötig.
- issue: Bedeutungsumfang von ἐλεημοσύνη
  choice: Gaben zur Unterstützung Bedürftiger
  alternative: Almosen; Taten der Barmherzigkeit
  rationale: Die gewählte Formulierung wahrt den konkreten Bezug auf fürsorgliches Geben, ohne den Ausdruck auf Geldzahlungen oder eine institutionelle Praxis zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Satzstruktur wurde behutsam geglättet, damit die Verbindung von guten Werken und wiederholter Unterstützung Bedürftiger natürlich klingt; der fortdauernde beziehungsweise gewohnheitsmäßige Charakter des griechischen Imperfekts bleibt erhalten.
