id: ACT.9.35
reference: Acts 9:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: de
  text: Alle Bewohner von Lydda und der Scharonebene[a] sahen ihn, und sie wandten sich dem Herrn zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Scharon“ oder „die Ebene von Scharon“.'
    reason: lexical_alternative
  - marker: b
    text: „Wandten sich dem Herrn zu“ kann auch mit „kehrten zum Herrn zurück“ oder, stärker deutend, mit „wurden zum Herrn bekehrt“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: sahen
  rationale: Der Aorist von ὁράω bezeichnet hier am natürlichsten die unmittelbare Wahrnehmung des geheilten Äneas.
- source_word: πάντες οἱ κατοικοῦντες
  choice: alle Bewohner
  rationale: Das substantivierte Partizip bezeichnet die dort Wohnenden; „alle Bewohner“ ist im Deutschen natürlich und bewahrt die umfassende Aussage von πάντες.
- source_word: Λύδδα
  choice: Lydda
  rationale: Die übliche deutsche Wiedergabe des Ortsnamens wird beibehalten.
- source_word: τὸν Σαρῶνα
  choice: die Scharonebene
  rationale: Σαρών bezeichnet hier die Küstenebene beziehungsweise Region Scharon. „Scharonebene“ macht den geografischen Bezug für heutige Leser klar, ohne die Aussage inhaltlich einzuengen.
- source_word: οἵτινες
  choice: und sie
  rationale: Die Wiederaufnahme durch „und sie“ gibt den erzählerischen Fortgang im Deutschen klar und flüssig wieder.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: wandten sich dem Herrn zu
  rationale: Diese Formulierung bewahrt das biblische Bild einer Hinwendung in Glaube und Umkehr, ohne mit „kehrten zurück“ einen früheren Zustand oder mit „wurden bekehrt“ eine bestimmte dogmatische Auslegung vorauszusetzen.
- source_word: κύριον
  choice: Herrn
  rationale: „Herr“ ist die angemessene Wiedergabe des neutestamentlichen Titels κύριος; eine ausdrückliche Ergänzung „Jesus“ steht nicht im griechischen Text.
theological_decisions:
- issue: Bezug von „dem Herrn“
  choice: dem Herrn
  alternative: dem Herrn Jesus
  rationale: Im Zusammenhang ist sehr wahrscheinlich Jesus gemeint; da der Ausgangstext jedoch nur τὸν κύριον bietet, wird der Name nicht erläuternd ergänzt.
- issue: Bedeutungsumfang von ἐπέστρεψαν
  choice: wandten sich … zu
  alternative: kehrten … zurück; wurden bekehrt
  rationale: „Wandten sich … zu“ lässt sowohl den Umkehr- als auch den Glaubensaspekt erkennen, ohne eine frühere Zugehörigkeit oder eine konfessionell geprägte Bekehrungsterminologie festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Ortsbezeichnungen folgen dem etablierten deutschen Bibelgebrauch; die Wiederholung „und sie“ macht den Bezug von οἵτινες eindeutig.
