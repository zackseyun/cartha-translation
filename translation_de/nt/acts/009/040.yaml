source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: de
  text: 'Petrus aber schickte alle hinaus. Dann kniete er nieder und betete. Darauf wandte er sich dem Leichnam zu und sagte: »Tabita, steh auf!« Da öffnete sie die Augen, und als sie Petrus sah, setzte sie sich auf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκβαλὼν ... ἔξω πάντας
  choice: schickte alle hinaus
  rationale: Gibt das Entfernen aller Anwesenden natürlich wieder, ohne die mögliche, hier aber nicht notwendige Gewaltnuance von »hinaustreiben« zu überbetonen.
- source_word: θεὶς τὰ γόνατα
  choice: kniete ... nieder
  rationale: Natürliche deutsche Wiedergabe der griechischen Wendung für das Niederknien.
- source_word: προσηύξατο
  choice: betete
  rationale: Direkte und übliche Entsprechung des Verbs προσεύχομαι.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: wandte er sich dem Körper zu
  rationale: Bewahrt sowohl die körperliche Hinwendung als auch die neutrale Bedeutung von σῶμα; »Leichnam« wäre kontextuell möglich, aber lexikalisch enger und angesichts der unmittelbar folgenden Wiederbelebung weniger passend.
- source_word: Ταβιθά
  choice: Tabita
  rationale: Im modernen deutschen Bibelgebrauch geläufige Transliteration des Namens.
- source_word: ἀνάστηθι
  choice: steh auf
  rationale: Natürliches, gegenwärtiges Deutsch; kann im Kontext sowohl das Aufrichten als auch die Wiederherstellung zum Leben ausdrücken, ohne durch das gehobenere »erhebe dich« zusätzliche Feierlichkeit einzutragen.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: öffnete sie die Augen
  rationale: Direkte, idiomatische Wiedergabe.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: als sie Petrus sah
  rationale: Die temporale Auflösung des Partizips wahrt die Handlungsfolge und klingt im Deutschen natürlich.
- source_word: ἀνεκάθισεν
  choice: setzte sie sich auf
  rationale: Bezeichnet das Aufsetzen aus liegender Haltung und ist im Deutschen eindeutig und idiomatisch.
- source_word: δὲ
  choice: aber / da
  rationale: Das erste δέ markiert den Übergang mit leichter Gegenüberstellung; das zweite führt die Folgehandlung weiter. Die zusätzlichen Satzanschlüsse »Dann« und »Darauf« gliedern die griechische Partizipialkette natürlich.
theological_decisions:
- issue: Wiedergabe des Befehls ἀνάστηθι im Kontext der Wiederbelebung
  choice: steh auf
  alternative: erhebe dich
  rationale: »Steh auf« bewahrt die lexikalische Offenheit des Befehls und ist würdig sowie modern. Der Auferstehungsbezug ergibt sich aus dem Erzählzusammenhang und muss nicht durch eine feierlichere Formulierung verstärkt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Erzählsätzen. Die griechischen Partizipien werden zur besseren Verständlichkeit teilweise als finite Verben und zeitliche Anschlüsse wiedergegeben. Keine Fußnote ist nötig; die englische Fußnote ist offenbar falsch platziert, da ihr Inhalt ἀνάστηθι betrifft, der Marker im englischen Haupttext jedoch nach »outside« steht.
