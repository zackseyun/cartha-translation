- from: 'Petrus aber schickte alle hinaus. Dann kniete er nieder und betete. Darauf wandte er sich dem Körper zu und sagte: »Tabita, steh auf!« Da öffnete sie die Augen, und als sie Petrus sah, setzte sie sich auf.'
  to: 'Petrus aber schickte alle hinaus. Dann kniete er nieder und betete. Darauf wandte er sich dem Leichnam zu und sagte: »Tabita, steh auf!« Da öffnete sie die Augen, und als sie Petrus sah, setzte sie sich auf.'
  rationale: Die Revision beschränkt sich auf die Ersetzung von »Körper« durch »Leichnam«. Sie berücksichtigt den unmittelbaren Erzählkontext und die natürliche deutsche Ausdrucksweise, während sie die Wahl des griechischen σῶμα nicht überinterpretiert. Eine Fußnote ist nicht erforderlich. Der englische Audit-Hinweis zur falsch gesetzten Fußnotenmarkierung verlangt keine deutsche Fußnote, da der deutsche Entwurf keinen Marker enthält.
