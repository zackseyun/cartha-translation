review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Aussagen des griechischen Textes zuverlässig wieder: Petrus entfernt alle Anwesenden, kniet zum Gebet nieder, wendet sich anschließend dem toten Körper zu, spricht Tabita an, und sie öffnet die Augen und setzt sich auf. »Schickte alle hinaus«, »kniete nieder«, »betete«, »steh auf« und »setzte sich auf« sind angemessene Wiedergaben. Im gegebenen Kontext bezeichnet σῶμα jedoch den Leichnam der zuvor Verstorbenen; die deutsche Formulierung »dem Körper« klingt hierfür unidiomatisch und kann missverständlich sachlich-medizinisch wirken.'
  naturalness: Die kurzen Erzählsätze entsprechen modernem Standarddeutsch und dem würdigen, nüchternen Register. »Leichnam« ist im Deutschen in diesem Kontext wesentlich natürlicher als »Körper«, ohne den griechischen Ausdruck unzulässig zu dramatisieren.
  terminology: »Petrus« und »Tabita« entsprechen dem üblichen deutschen Bibelgebrauch. »Steh auf!« ist eine moderne, treffende Wiedergabe von ἀνάστηθι und wahrt dessen semantische Offenheit. Für σῶμα ist hier »Leichnam« als kontextgemäße deutsche Entsprechung vorzuziehen.
  issues:
  - severity: low
    issue: »dem Körper« für πρὸς τὸ σῶμα
    rationale: Obwohl σῶμα lexikalisch »Körper« bedeutet, ist bei einer bereits verstorbenen Person »Leichnam« im modernen Deutschen die idiomatische und kontextuell eindeutige Wiedergabe. Die Änderung betrifft nicht die Aussage, sondern verbessert Natürlichkeit und Präzision.
