  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: de
  text: Saulus aber stand vom Boden auf. Obwohl seine Augen geöffnet waren[a], sah er nichts. Da führten sie ihn an der Hand und brachten ihn nach Damaskus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Bei geöffneten Augen sah er nichts.“ Die griechische Konstruktion hebt den Kontrast hervor: Seine Augen waren geöffnet, doch er konnte nichts sehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: stand ... auf
  rationale: 'Der passive Aorist von ἐγείρω wird hier im Erzählzusammenhang intransitiv gebraucht: Saulus erhebt sich vom Boden. „stand ... auf“ ist natürliches modernes Deutsch.'
- source_word: ἀπὸ τῆς γῆς
  choice: vom Boden
  rationale: γῆ bezeichnet hier den Boden, auf den Saulus gefallen war, nicht die Erde im kosmischen Sinn oder ein geografisches Land.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: Obwohl seine Augen geöffnet waren
  rationale: 'Der Genitivus absolutus bezeichnet einen Begleitumstand; der Zusammenhang legt einen konzessiven Gegensatz nahe: Die Augen waren geöffnet, dennoch sah Saulus nichts.'
- source_word: οὐδὲν ἔβλεπεν
  choice: sah er nichts
  rationale: Die Formulierung gibt den vollständigen Ausfall des Sehens direkt und idiomatisch wieder und bleibt nah am Griechischen.
- source_word: χειραγωγοῦντες
  choice: führten sie ihn an der Hand
  rationale: χειραγωγέω bezeichnet konkret das Führen an der Hand, besonders bei einer Person, die Führung benötigt.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: brachten ihn nach Damaskus
  rationale: εἰσάγω bezeichnet das Hineinbringen oder Hineinführen. Nach „führten ... an der Hand“ vermeidet „brachten“ eine unnötige Wiederholung; bei Städten ist „nach Damaskus“ im Deutschen die natürliche Richtungsangabe.
- source_word: δὲ
  choice: aber / obwohl / da
  rationale: Die drei Vorkommen von δέ markieren Fortgang und leichten Gegensatz. Im Deutschen werden ihre jeweiligen Diskursfunktionen idiomatisch differenziert wiedergegeben, ohne jedes Vorkommen mechanisch gleich zu übersetzen.
- source_word: Σαῦλος
  choice: Saulus
  rationale: Die im deutschen Bibel- und Allgemeingebrauch etablierte Namensform wird verwendet.
- source_word: Δαμασκόν
  choice: Damaskus
  rationale: Die etablierte deutsche Form des Ortsnamens wird verwendet.
