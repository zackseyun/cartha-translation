revisions:
- from: Barnabas aber nahm sich seiner an und brachte ihn zu den Aposteln. Er berichtete ihnen, wie Saulus unterwegs den Herrn gesehen und wie der Herr zu ihm gesprochen hatte, und wie Saulus in Damaskus freimütig im Namen von Jesus gesprochen hatte.
  to: Barnabas aber nahm ihn mit und brachte ihn zu den Aposteln. Er berichtete ihnen, wie Saulus unterwegs den Herrn gesehen hatte, dass der Herr zu ihm gesprochen hatte und wie Saulus in Damaskus freimütig im Namen Jesu gesprochen hatte.
  rationale: Die Revision ersetzt die interpretativ fürsorgliche Wendung durch eine natürliche Wiedergabe der konkreten Handlung von ἐπιλαβόμενος und verwendet die im modernen bibelnahen Standarddeutsch idiomatische Form „im Namen Jesu“. Die expliziten Subjekte bleiben zur Klarheit der berichteten Ereignisse erhalten; Aussagegehalt und Ambiguität des Ausgangstextes werden nicht verändert.
