source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: de
  text: Barnabas aber nahm ihn mit und brachte ihn zu den Aposteln. Er berichtete ihnen, wie Saulus unterwegs den Herrn gesehen hatte, dass der Herr zu ihm gesprochen hatte und wie Saulus in Damaskus freimütig im Namen Jesu gesprochen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: nahm sich seiner an
  rationale: Das Medium von ἐπιλαμβάνομαι kann ein Ergreifen bzw. Sich-Annehmen ausdrücken. Im Kontext gibt die idiomatische deutsche Wendung die unterstützende Initiative des Barnabas natürlich wieder, ohne ein gewaltsames Packen nahezulegen.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: brachte ihn zu den Aposteln
  rationale: ἄγω bedeutet hier führen bzw. bringen; „brachte“ beschreibt natürlich, dass Barnabas Saulus den Aposteln zuführte.
- source_word: διηγήσατο αὐτοῖς
  choice: berichtete ihnen
  rationale: διηγέομαι bezeichnet ein zusammenhängendes Erzählen oder Berichten. „berichtete“ bewahrt diesen Gehalt in würdigem, modernem Deutsch.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: wie Saulus unterwegs
  rationale: ἐν τῇ ὁδῷ bezieht sich auf die Reise nach Damaskus. „unterwegs“ ist idiomatisch und vermeidet eine Verwechslung mit „dem Weg“ als Bezeichnung der christlichen Bewegung.
- source_word: εἶδεν τὸν κύριον
  choice: den Herrn gesehen hatte
  rationale: κύριος wird mit dem christologisch gewichtigen Titel „Herr“ wiedergegeben. Das deutsche Plusquamperfekt ordnet das Ereignis natürlich in Barnabas’ rückblickenden Bericht ein.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: wie der Herr zu ihm gesprochen hatte
  rationale: Der Herr ist grammatisch und kontextuell das naheliegende Subjekt. Die Wiederholung des Subjekts beseitigt im Deutschen eine störende Pronomenmehrdeutigkeit, ohne den Sinn zu erweitern.
- source_word: ἐπαρρησιάσατο
  choice: freimütig ... gesprochen hatte
  rationale: παρρησιάζομαι bezeichnet freies, offenes und mutiges Reden. „freimütig gesprochen“ bewahrt diese Bedeutungsbreite besser als das spezifischere „gepredigt“.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: im Namen von Jesus
  rationale: Die Formulierung bewahrt das biblische Idiom des Redens in Verbindung mit Jesu Namen und Autorität. „von Jesus“ ist in modernem Deutsch klarer als die potenziell missverständliche Genitivform „im Namen Jesu“.
theological_decisions:
- issue: Bezug von „der Herr“ im Damaskuserlebnis
  choice: „der Herr“ bezeichnet Jesus
  alternative: allgemeiner Gottesbezug
  rationale: Der unmittelbare Zusammenhang von Apostelgeschichte 9 identifiziert den Erscheinenden als den auferstandenen Jesus; der Vers schließt zudem mit dem Reden „im Namen von Jesus“. Der Titel „Herr“ bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Namen „Saulus“ und „der Herr“ werden zur Klärung der im Griechischen möglichen Pronomenbezüge wiederholt. Keine Fußnote erforderlich.
