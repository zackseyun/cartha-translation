id: ACT.9.22
reference: Acts 9:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: de
  text: Saulus aber wurde immer stärker und brachte die Juden, die in Damaskus lebten, in Verwirrung, indem er nachwies, dass dieser der Messias[a] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: wurde immer stärker
  rationale: Die Verbindung aus μᾶλλον und dem Imperfekt gibt eine fortschreitende, zunehmende Stärkung wieder. Die Formulierung bleibt offen dafür, ob Saulus aus eigener Kraft erstarkte oder gestärkt wurde.
- source_word: συνέχυννεν
  choice: brachte … in Verwirrung
  rationale: Das Verb bezeichnet ein Verwirren oder Aus-dem-Konzept-Bringen; die Wendung bewahrt seine deutliche Wirkung im Zusammenhang der Auseinandersetzung.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: die Juden, die in Damaskus lebten
  rationale: Die natürliche deutsche Wiedergabe begrenzt die Aussage ausdrücklich auf die dort lebenden Juden.
- source_word: συμβιβάζων
  choice: indem er nachwies
  rationale: 'Das Partizip beschreibt, wodurch Saulus sie in Verwirrung brachte: Er fügte Argumente oder Belege zu einer überzeugenden Schlussfolgerung zusammen.'
- source_word: οὗτός
  choice: dieser
  rationale: Das Demonstrativpronomen wird gegenüber einem bloßen „er“ bewahrt und verweist mit Nachdruck auf Jesus.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός ist hier ein Titel für den erwarteten Gesalbten und wird daher in seinem jüdisch-messianischen Sinn wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: der Messias
  alternative: der Christus
  rationale: 'Der bestimmte Artikel und die Aussage, die Saulus nachweist, zeigen den titularen Gebrauch: Jesus wird als der verheißene Gesalbte identifiziert. Die Alternative bleibt in der Fußnote sichtbar.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wurde immer stärker“ ist bewusst natürlich und lässt die im griechischen Medium/Passiv nicht vollständig festgelegte Ursache der Stärkung offen. „Dieser“ bewahrt den demonstrativen Nachdruck, ohne den nicht ausdrücklich genannten Namen Jesus in den Vers einzufügen.
