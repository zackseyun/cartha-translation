id: ACT.9.29
reference: Acts 9:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: de
  text: Er redete mit den Hellenisten[a] und führte Streitgespräche mit ihnen; sie aber versuchten, ihn zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: griechischsprachige Juden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: Er sprach
  rationale: Das Imperfekt bezeichnet hier eine fortdauernde oder wiederholte Tätigkeit. Im Deutschen kann das Präteritum diesen Erzählaspekt natürlich wiedergeben.
- source_word: τε καὶ
  choice: und
  rationale: Die Verbindung koordiniert die beiden Tätigkeiten, ohne dass im Deutschen eine schwerfällige Wiedergabe wie „sowohl … als auch“ nötig ist.
- source_word: συνεζήτει
  choice: führte Streitgespräche
  rationale: Das Verb bezeichnet eine engagierte, kontroverse Auseinandersetzung und ist stärker als ein neutrales „diskutieren“.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: zu den Hellenisten … mit ihnen
  rationale: Bei Rede und Auseinandersetzung bezeichnet πρός die persönliche Interaktion. Die deutsche Satzgestaltung verteilt die Beziehung idiomatisch auf „zu“ und „mit“.
- source_word: Ἑλληνιστάς
  choice: Hellenisten
  rationale: Der Gruppenname bleibt erhalten; eine Fußnote erklärt, dass hier griechischsprachige Juden gemeint sind.
- source_word: οἱ δὲ
  choice: sie aber
  rationale: „Aber“ macht den Gegensatz zwischen Sauls Reden und ihrer feindseligen Reaktion deutlich.
- source_word: ἐπεχείρουν
  choice: versuchten
  rationale: Das Imperfekt deutet auf ein anhaltendes oder wiederholtes Unternehmen. „Versuchten“ ist im deutschen Erzählstil natürlich und bewahrt die Bedeutung des beabsichtigten Handelns.
- source_word: ἀνελεῖν αὐτόν
  choice: ihn zu töten
  rationale: ἀναιρέω bedeutet in diesem Zusammenhang eindeutig, jemanden zu töten; die Formulierung ist klar und unmittelbar.
theological_decisions:
- issue: Identität der Ἑλληνισταί
  choice: Hellenisten, in der Fußnote als griechischsprachige Juden erklärt
  alternative: Griechen oder allgemein griechischsprachige Menschen
  rationale: Der Sprachgebrauch der Apostelgeschichte, besonders Apostelgeschichte 6,1, weist auf eine jüdische, griechischsprachige Gruppe hin. Der Gruppenname im Text bewahrt zugleich die historische Bezeichnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Streitgespräche führen“ gibt die kontroverse Intensität wieder, ohne umgangssprachlich zu wirken. Der Semikolon markiert den scharfen Gegensatz der Reaktion.
