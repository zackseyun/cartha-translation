id: ACT.9.14
reference: Acts 9:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: de
  text: Und hier hat er von den führenden Priestern die Vollmacht, alle zu fesseln, die deinen Namen anrufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck ist eine in der Bibel übliche Wendung für das Anrufen oder Invokieren einer Person, oft im Gebet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: hier
  rationale: Das Ortsadverb bezeichnet Damaskus, wo Hananias spricht; „hier“ ist die natürliche und genaue Wiedergabe.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Gemeint ist eine von den führenden Priestern erteilte amtliche Befugnis; „Vollmacht“ gibt diesen delegierten Charakter präzise wieder.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: von den führenden Priestern
  rationale: παρά mit Genitiv bezeichnet die Quelle der Vollmacht. Der Plural ἀρχιερεῖς meint hier die Jerusalemer Führung aus dem Kreis der Oberpriester und priesterlichen Würdenträger; „führende Priester“ ist im modernen Deutsch verständlicher als „Hohepriester“ im Plural.
- source_word: δῆσαι
  choice: zu fesseln
  rationale: Die Wiedergabe bewahrt das konkrete Bild des Bindens und lässt zugleich im Zusammenhang die beabsichtigte Festnahme erkennen.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: alle, die … anrufen
  rationale: Das substantivierte Partizip bezeichnet ausnahmslos diejenigen, die Jesu Namen anrufen. „anrufen“ bewahrt den biblischen Ausdruck für eine religiöse Anrufung.
- source_word: τὸ ὄνομά σου
  choice: deinen Namen
  rationale: Die direkte Wiedergabe erhält sowohl die personale Anrede Jesu als auch die biblische Bedeutung des Namens als Ausdruck der Person und ihrer Autorität.
theological_decisions:
- issue: Bedeutung der an Jesus gerichteten Wendung „deinen Namen anrufen“
  choice: Die Wendung wird als „die deinen Namen anrufen“ beibehalten.
  alternative: „die zu dir beten“ oder „die sich zu dir bekennen“
  rationale: Der griechische Ausdruck kann Anrufung im Gebet und zugleich Zugehörigkeit beziehungsweise Berufung auf die angerufene Person einschließen. Die idiomnahe Übersetzung bewahrt diese theologische Dichte, ohne sie auf nur eine Dimension festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Führende Priester“ vermeidet das im Deutschen missverständliche pluralische „Hohepriester“; „fesseln“ bewahrt die Bildsprache des Ausgangstextes.
