  verdict: revise
  source_fidelity: Der Vers gibt ὧδε („hier“), die von den ἀρχιερεῖς erteilte ἐξουσία („Vollmacht“), δῆσαι („fesseln“) und die umfassende substantivierte Partizipialgruppe („alle, die ... anrufen“) zuverlässig wieder. „Führende Priester“ ist eine verständliche Wiedergabe der institutionellen Gruppe der ἀρχιερεῖς und vermeidet das im Deutschen missverständliche pluralische „Hohepriester“.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und hat einen angemessen würdevollen, nicht künstlich archaisierenden Registerton.
  terminology: „Vollmacht“, „fesseln“ und besonders „deinen Namen anrufen“ treffen die griechische Ausdrucksweise gut. Die Fußnotenalternative „die sich auf deinen Namen berufen“ ist jedoch keine gleichwertige Wiedergabe von ἐπικαλεῖσθαι τὸ ὄνομα; sie verschiebt die konkrete Anrufung zu einer Berufung bzw. einem Anspruch auf Autorität.
