  verdict: revise
  source_fidelity: Die Wiedergabe von δέ, ἔτι, „Jünger des Herrn“ und „Hoher Priester“ ist grundsätzlich zutreffend. „Morddrohungen“ gibt jedoch φόνος nicht als eigenständigen zweiten Genitiv neben ἀπειλῆς wieder, sondern verschmilzt beide Begriffe zu einer einzigen Aussage. Der Text bezeichnet Saulus sowohl als drohend als auch als auf Tötung/Mord ausgerichtet.
  naturalness: „Drohungen und Morddrohungen“ wirkt im Deutschen zudem redundant. Die unten vorgeschlagene Fassung ist modernes Standarddeutsch und bringt die zwei Elemente des griechischen Ausdrucks verständlich zum Ausdruck, ohne zu behaupten, Saulus habe bereits jemanden getötet.
  terminology: „Jünger des Herrn“ und „Hoher Priester“ sind angemessen. „Mord“ bewahrt die Schärfe von φόνος; die Fußnote vermerkt die mögliche weitere Bedeutung „Tötung“.
