  - severity: low
    issue: Die Verbindung „Drohungen und Morddrohungen“ ist redundant.
    rationale: Das Deutsche nennt zweimal Drohungen, obwohl der Ausgangstext zwei verschiedene, wenn auch eng verbundene Begriffe hat.
