source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: de
  text: Saulus aber stieß noch immer Drohungen gegen die Jünger des Herrn aus und war auf Mord[a] aus; er ging zum Hohen Priester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tötung“. Das griechische Wort φόνος kann „Mord“ oder allgemeiner „Tötung“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet die Rückkehr der Erzählung zu Saulus mit einem leichten Kontrast zum vorherigen Abschnitt.
- source_word: ἔτι
  choice: noch immer
  rationale: Drückt aus, dass Saulus seine feindselige Haltung weiterhin hegte.
- source_word: ἐμπνέων ἀπειλῆς καὶ φόνου
  choice: stieß noch immer Drohungen und Morddrohungen … aus
  rationale: Bewahrt das anschauliche Atembild in natürlichem Deutsch. Da man nicht idiomatisch „Mord ausstößt“, gibt „Morddrohungen“ die enge Verbindung von φόνος mit dem Drohen verständlich wieder, ohne bereits vollzogene Tötungen zu behaupten.
- source_word: εἰς τοὺς μαθητὰς
  choice: gegen die Jünger
  rationale: εἰς bezeichnet hier im feindseligen Zusammenhang die Ausrichtung gegen die Jünger.
- source_word: μαθητὰς
  choice: Jünger
  rationale: Etablierte und sachlich genaue Bezeichnung für die Anhänger Jesu in der Apostelgeschichte.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Der Genitiv beschreibt die Zugehörigkeit der Jünger; „Herr“ ist hier die angemessene Wiedergabe von κύριος.
- source_word: προσελθὼν τῷ ἀρχιερεῖ
  choice: ging zum Hohen Priester
  rationale: Gibt die Annäherung idiomatisch wieder. Obwohl προσελθών formal ein Partizip ist, bereitet es die im nächsten Vers folgende Bitte vor.
theological_decisions:
- issue: Bezug und Wiedergabe von κυρίου
  choice: Jünger des Herrn
  alternative: Jünger des Meisters
  rationale: Der Genitiv bezieht sich am natürlichsten auf „Jünger“; „Herr“ entspricht dem Sprachgebrauch von Lukas–Apostelgeschichte und lässt den christologischen Titel stehen.
- issue: Bedeutung von φόνος im Atembild
  choice: Morddrohungen
  alternative: Mord / Töten
  rationale: φόνος bezeichnet Mord oder Tötung. Im Zusammenhang mit ἀπειλή und dem bildhaften ἐμπνέων bezeichnet es Saulus’ mörderische Drohhaltung; „Morddrohungen“ vermeidet die missverständliche Aussage, er habe bereits Morde ausgestoßen oder begangen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das kräftige Bild des Ausstoßens bewahrt die Anschaulichkeit von ἐμπνέων, während „Morddrohungen“ den griechischen Ausdruck in verständliches deutsches Idiom überführt.
