  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: de
  text: Doch seine Jünger nahmen ihn bei Nacht und ließen ihn durch die Mauer[a] in einem großen Korb[b] hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch eine Öffnung in der Mauer“. Wörtlich steht im Griechischen „durch die Mauer“; wahrscheinlich ist eine Öffnung oder ein Fenster in der Stadtmauer gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen stehen hier zwei Ausdrücke für das Herablassen. Diese anschauliche Doppelung hebt die Art der Flucht hervor; im deutschen Haupttext sind beide zu einer Wendung zusammengezogen.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: nahmen
  rationale: Das Aoristpartizip leitet die konkrete Rettungsaktion der Jünger ein. „Nahmen“ bleibt nah am Griechischen, ohne ein nicht ausdrücklich genanntes Ergreifen überzubetonen.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier eine leichte Gegenüberstellung zur zuvor geschilderten Verschwörung. „Doch“ gibt diese erzählerische Wendung knapp und natürlich wieder.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Die Übersetzung gibt sowohl μαθηταί als auch das ausdrücklich vorhandene Possessivpronomen αὐτοῦ wieder.
- source_word: νυκτός
  choice: bei Nacht
  rationale: Der Genitiv der Zeit wird mit der knappen, leicht gehobenen und im Deutschen geläufigen Wendung „bei Nacht“ wiedergegeben.
- source_word: διὰ τοῦ τείχους
  choice: durch die Mauer
  rationale: διά mit Genitiv bezeichnet die Bewegung hindurch. Der Wortlaut nennt weder ausdrücklich eine Öffnung noch die Stadt; deshalb bleibt die Übersetzung bewusst nah am Griechischen.
- source_word: καθῆκαν αὐτόν
  choice: ließen ihn … hinab
  rationale: καθίημι bezeichnet hier das Herablassen aus einer Höhe. „Hinabließen“ ist im Deutschen klar und idiomatisch.
- source_word: χαλάσαντες
  choice: ließen … hinab (mit καθῆκαν zusammengezogen)
  rationale: Das Partizip beschreibt überlappend die Art und Weise des Herablassens. Eine doppelte Wiedergabe wäre im Deutschen schwerfällig; die Verdichtung wird in Fußnote [b] kenntlich gemacht.
- source_word: ἐν σπυρίδι
  choice: in einem großen Korb
  rationale: σπυρίς bezeichnet einen Korb, typischerweise einen größeren. Die Größenangabe verdeutlicht zugleich, dass darin ein Mensch hinabgelassen werden konnte.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem erzählerischem Rhythmus. Die ungewöhnliche Wendung „durch die Mauer“ bleibt zur Wahrung der Offenheit des Ausgangstextes stehen und wird durch eine Fußnote erläutert.
