base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: de
  text: 'Er sagte: „Wer bist du, Herr[a]?“ Der antwortete: „Ich bin Jesus, den du verfolgst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier auch als respektvolle Anrede verstanden werden, etwa im Sinn von „Sir“.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Er sagte
  rationale: Der Aorist wird als schlichtes Erzählpräteritum wiedergegeben. Das schwach verbindende δέ muss im Deutschen nicht eigens ausgedrückt werden, da der Erzählfluss ohne „und“ natürlicher ist.
- source_word: Τίς εἶ
  choice: Wer bist du
  rationale: Direkte und idiomatische Wiedergabe der Frage aus Interrogativpronomen und Kopula.
- source_word: κύριε
  choice: Herr
  rationale: „Herr“ bewahrt die übliche Wiedergabe von κύριος und passt zur ehrfürchtigen Anrede des himmlischen Sprechers; die hier ebenfalls mögliche höfliche Anrede „mein Herr“ wird in der Fußnote genannt.
- source_word: ὁ δέ
  choice: Der antwortete
  rationale: Das substantivierte Artikelgefüge mit δέ markiert den Sprecherwechsel. „Der antwortete“ macht diesen im Deutschen klar und gibt die dialogische Funktion von εἶπεν sinngemäß wieder.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ich bin Jesus
  rationale: Die ausdrückliche Selbstbezeichnung wird unmittelbar und ohne zusätzliche theologische Deutung wiedergegeben.
- source_word: ὃν σὺ διώκεις
  choice: den du verfolgst
  rationale: Das Relativpronomen bezieht sich auf Jesus; „verfolgen“ ist die etablierte und kontextgerechte Wiedergabe feindseliger Verfolgung. Das explizite σὺ wird durch das notwendige „du“ ausgedrückt, ohne künstliche typografische Betonung.
theological_decisions:
- issue: Bedeutung von κύριε in Sauls Anrede vor der Selbstoffenbarung des Sprechers
  choice: Herr
  alternative: mein Herr / Herr im Sinn einer respektvollen Anrede
  rationale: κύριε kann sowohl eine ehrerbietige Anrede als auch den Hoheitstitel „Herr“ bezeichnen. Der Haupttext bewahrt mit „Herr“ die theologische Spannung der Offenbarungsszene, während die Fußnote davor schützt, Saul bereits an dieser Stelle zwingend ein voll entfaltetes Bekenntnis zuzuschreiben.
- issue: Identifikation Jesu mit den von Saul Verfolgten
  choice: den du verfolgst
  alternative: keine abschwächende Umschreibung wie „dessen Anhänger du verfolgst“
  rationale: Der griechische Text bezeichnet Jesus selbst als den Verfolgten. Diese theologisch bedeutsame Identifikation wird bewahrt und nicht erklärend auf seine Anhänger beschränkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Dialogcharakter bleibt erhalten; „Der antwortete“ vermeidet im Deutschen die schwerfällige Wiederholung „Und er sagte“ und kennzeichnet den Sprecherwechsel klar.
