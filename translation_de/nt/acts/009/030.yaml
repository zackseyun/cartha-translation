id: ACT.9.30
reference: Acts 9:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: de
  text: Als die Brüder[a] davon erfuhren, brachten sie ihn nach Cäsarea hinab und schickten ihn weiter nach Tarsus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Brüder und Schwestern“ beziehungsweise „Glaubensgeschwister“. Im Griechischen steht „Brüder“; hier kann damit die Gemeinschaft der Glaubenden insgesamt gemeint sein.
    reason: Lexikalische Alternative und möglicher inklusiver Bedeutungsumfang von ἀδελφοί.
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: als sie davon erfuhren
  rationale: Das Aoristpartizip bezeichnet den Umstand, der die folgenden Handlungen auslöste. Das im Griechischen unausgesprochene Objekt ergibt sich aus dem vorherigen Vers; „davon“ stellt diesen Bezug im Deutschen natürlich her.
- source_word: οἱ ἀδελφοὶ
  choice: die Brüder
  rationale: Die maskuline Pluralform wird im Haupttext formal wiedergegeben. Da ἀδελφοί im Kontext auch die Gemeinschaft der Glaubenden insgesamt bezeichnen kann, wird diese mögliche inklusive Bedeutung in einer Fußnote erläutert.
- source_word: κατήγαγον
  choice: brachten sie ihn … hinab
  rationale: κατάγω bezeichnet hier das Hinabbringen beziehungsweise Hinabführen, wahrscheinlich in Richtung Küste. „Hinab“ bewahrt die Richtungsangabe des griechischen Verbs.
- source_word: Καισάρειαν
  choice: Cäsarea
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens; der Zusammenhang lässt das an der Küste gelegene Cäsarea erkennen.
- source_word: ἐξαπέστειλαν
  choice: schickten ihn weiter
  rationale: Das zusammengesetzte Verb bezeichnet das Weg- oder Aussenden. „Weiter“ passt zur erzählten Reiserichtung von Cäsarea nach Tarsus und klingt im modernen Deutsch natürlich.
- source_word: Ταρσόν
  choice: Tarsus
  rationale: Gebräuchliche deutsche Wiedergabe des Stadtnamens.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφοί in einer wahrscheinlich gemischten Gemeinde
  choice: die Brüder
  alternative: die Brüder und Schwestern; die Glaubensgeschwister
  rationale: Der Haupttext bewahrt die grammatisch maskuline Form des Griechischen, ohne auszuschließen, dass die gesamte Gemeinschaft der Glaubenden gemeint ist. Diese kontextuell mögliche inklusive Bedeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzählregister. Die Satzstruktur folgt dem griechischen Handlungsablauf; „davon“ macht den im Ausgangstext impliziten Rückbezug verständlich.
