  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: de
  text: 'Doch der Herr sagte zu ihm: „Geh! Denn dieser Mann ist mein auserwähltes Werkzeug, um meinen Namen vor Nichtjuden[a], vor Königen und vor den Söhnen Israels[b] zu tragen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Völkern“.
    reason: lexical_alternative
  - marker: b
    text: „Die Söhne Israels“ sind eine traditionelle biblische Bezeichnung für das Volk Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: Die übliche und kontextuell passende Wiedergabe des Titels; hier bezeichnet er den auferstandenen Jesus, der mit göttlicher Autorität spricht.
- source_word: Πορεύου
  choice: Geh!
  rationale: Ein natürlicher deutscher Imperativ, der die unmittelbare Aufforderung knapp und deutlich wiedergibt.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: ist mein auserwähltes Werkzeug
  rationale: Die bildliche Bedeutung von σκεῦος als Mittel für einen bestimmten Zweck wird im heutigen Deutsch durch „Werkzeug“ verständlich ausgedrückt. „Auserwählt“ bewahrt die ausdrückliche göttliche Auswahl, ohne eine spätere Lehrsystematik einzutragen.
- source_word: τοῦ βαστάσαι τὸ ὄνομά μου
  choice: das meinen Namen … tragen soll
  rationale: Der finale Infinitiv bezeichnet den Zweck der Auswahl. „Meinen Namen tragen“ erhält die biblische Bildsprache und ihre Bezüge zu öffentlichem Zeugnis und vertretener Autorität.
- source_word: ἐνώπιον
  choice: vor
  rationale: Die knappe räumlich-öffentliche Formulierung passt zum Zeugnis vor den genannten Gruppen.
- source_word: ἐθνῶν
  choice: Nichtjuden
  rationale: Im Kontrast zu den Söhnen Israels sind hier am wahrscheinlichsten nichtjüdische Menschen gemeint. „Nichtjuden“ ist im modernen Deutsch klar; die wörtlichere Alternative „Völker“ bleibt in einer Fußnote sichtbar.
- source_word: βασιλέων
  choice: Könige
  rationale: Die genaue und natürliche Wiedergabe des griechischen Ausdrucks.
- source_word: υἱῶν Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die traditionelle biblische Familienbezeichnung wird formal bewahrt; eine Fußnote erklärt ihren kollektiven Bezug auf das Volk Israel.
- source_word: τε … καὶ … τε
  choice: und … und
  rationale: Die drei Gruppen werden im Deutschen durch eine natürliche koordinierende Reihung verbunden.
theological_decisions:
- issue: Mögliche dogmatische Überdeutung von ἐκλογῆς
  choice: „mein auserwähltes Werkzeug“
  alternative: „mein Werkzeug der Erwählung“ / „mein erwähltes Gefäß“
  rationale: Der Vers spricht eindeutig von Gottes Auswahl dieses Mannes für einen Auftrag. Die gewählte Formulierung bewahrt diese Aussage, ohne sie auf eine spätere Lehre über individuelle Erwählung festzulegen.
- issue: Bedeutungsumfang von „meinen Namen tragen“
  choice: Die Metapher wörtlich erhalten
  alternative: „mich bekannt machen“ / „für mich Zeugnis ablegen“
  rationale: Eine erklärende Paraphrase würde die Mehrdeutigkeit von Name, Vertretung, Bekenntnis und Verkündigung unnötig verengen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die traditionelle Wendung „Söhne Israels“ und die Metapher vom Tragen des Namens bleiben erhalten; weniger geläufige oder mehrdeutige Ausdrücke werden knapp in Fußnoten erläutert.
