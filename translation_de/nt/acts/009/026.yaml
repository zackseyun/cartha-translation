id: ACT.9.26
reference: Acts 9:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: de
  text: Als er nach Jerusalem gekommen war, versuchte er, sich den Jüngern anzuschließen.[a] Doch sie hatten alle Angst vor ihm, weil sie nicht glaubten, dass er ein Jünger war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sich eng an die Jünger zu halten.'
    reason: Lexikalische Alternative für κολλᾶσθαι, das ein enges Sich-Anschließen oder Sich-Halten an eine Gruppe ausdrücken kann.
lexical_decisions:
- source_word: Παραγενόμενος δὲ εἰς Ἰερουσαλήμ
  choice: Als er nach Jerusalem gekommen war
  rationale: Das Aoristpartizip bezeichnet den zeitlich vorausgehenden Umstand. Das Plusquamperfekt gibt diese Abfolge im Deutschen natürlich wieder; δέ dient hier vor allem dem Fortgang der Erzählung und muss nicht eigens mit „aber“ übersetzt werden.
- source_word: ἐπείραζεν
  choice: versuchte er
  rationale: Das Imperfekt beschreibt einen Versuch im Verlauf. „Versuchte“ ist im Deutschen idiomatisch und vermeidet die hier unpassende Bedeutung „versuchen/auf die Probe stellen“ im Sinn einer Versuchung.
- source_word: κολλᾶσθαι τοῖς μαθηταῖς
  choice: sich den Jüngern anzuschließen
  rationale: κολλάομαι bezeichnet ein Sich-Anschließen oder enges Sich-Halten an andere. Die gewählte Formulierung gibt den sozialen und gemeinschaftlichen Sinn wieder, ohne eine formale Mitgliedschaft vorauszusetzen.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: Doch sie hatten alle Angst vor ihm
  rationale: καί leitet hier eine inhaltlich gegensätzliche Entwicklung ein; „doch“ macht diesen Zusammenhang im Deutschen deutlich. Das Pronomen „sie“ bezieht sich natürlich auf die Jünger.
- source_word: μὴ πιστεύοντες
  choice: weil sie nicht glaubten
  rationale: Das verneinte Präsenspartizip nennt den Grund ihrer Angst. Ein kausaler Nebensatz ist im modernen Deutschen klarer und bewahrt diese Funktion.
- source_word: ὅτι ἐστὶν μαθητής
  choice: dass er ein Jünger war
  rationale: Obwohl im Griechischen Präsens steht, ist im deutschen abhängigen Aussagesatz nach einem vergangenen Erzählverb die zeitlich angepasste Form „war“ natürlich; der Aussagegehalt bleibt unverändert.
theological_decisions:
- issue: Art von Sauls angestrebter Verbindung mit den Gläubigen in Jerusalem
  choice: „sich den Jüngern anzuschließen“
  alternative: „sich an die Jünger zu halten“ oder „sich eng mit den Jüngern zu verbinden“
  rationale: Der Text beschreibt Sauls Bemühen, von der Gemeinschaft der Jünger angenommen zu werden. Er bezeichnet keinen förmlichen kirchlichen Aufnahmeakt und sollte nicht mit späteren institutionellen Kategorien überfrachtet werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau ist natürlich, die kausale Beziehung wird ausdrücklich gemacht, und der gemeinschaftliche Sinn von κολλᾶσθαι bleibt ohne institutionelle Überdeutung erhalten.
