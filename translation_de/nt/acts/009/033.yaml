  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: de
  text: Dort fand er einen Mann namens Äneas, der seit acht Jahren auf einer Liege lag; er war gelähmt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: Dort fand er
  rationale: Die Formulierung gibt die erzählerische Fortführung durch δέ und die Ortsangabe ἐκεῖ in natürlichem Deutsch wieder, ohne einen stärkeren zeitlichen Übergang einzutragen.
- source_word: ἄνθρωπόν τινα
  choice: einen Mann
  rationale: τις führt hier eine zuvor nicht genannte Person ein. Im Deutschen wirkt „einen gewissen Mann“ unnötig steif; der unbestimmte Artikel erfüllt dieselbe Erzählfunktion.
- source_word: ὀνόματι Αἰνέαν
  choice: namens Äneas
  rationale: Die Dativkonstruktion mit ὀνόματι wird idiomatisch mit „namens“ wiedergegeben; der griechische Personenname erscheint in seiner etablierten deutschen Form.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: seit acht Jahren
  rationale: Die Wendung bezeichnet einen bis zum erzählten Zeitpunkt andauernden Zeitraum. „Seit acht Jahren“ drückt diese Dauer im Deutschen präzise aus.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: auf einer Liege lag
  rationale: Die Übersetzung bewahrt das konkrete Bild des griechischen Textes. κράβαττος bezeichnet ein einfaches Bett, eine Liege oder Schlafmatte; „Liege“ ist verständlich, ohne eine moderne medizinische Bettlägerigkeit in das einzelne Wort hineinzulesen.
- source_word: ὃς ἦν παραλελυμένος
  choice: er war gelähmt
  rationale: Der Relativsatz beschreibt einen fortdauernden Zustand. Nach dem vorausgehenden Relativsatz vermeidet ein mit Semikolon angeschlossener Hauptsatz eine schwerfällige Verschachtelung und bewahrt die eigenständige Aussage.
theological_decisions:
- issue: Art und Ursache der Lähmung
  choice: gelähmt
  alternative: ein Gelähmter / von einer Lähmung betroffen
  rationale: Der Text nennt den körperlichen Zustand, erklärt aber weder dessen medizinische Ursache noch deutet er ihn theologisch. Die knappe Wiedergabe wahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist klar und erzählerisch knapp; das konkrete Bild der Liege bleibt erhalten, sodass keine erläuternde Fußnote erforderlich ist.
