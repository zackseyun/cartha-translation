  source_fidelity: 'Der Text gibt alle wesentlichen Elemente wieder: die Ortsangabe, das Finden eines Mannes namens Äneas, die achtjährige Dauer seines Liegens auf einer Liege sowie seinen Zustand der Lähmung. „Seit acht Jahren“ bildet die bis zum erzählten Zeitpunkt andauernde Dauer angemessen ab. Die konkrete κράβαττος-Bedeutung bleibt mit „Liege“ erhalten.'
