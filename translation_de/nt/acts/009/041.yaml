id: ACT.9.41
reference: Acts 9:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: de
  text: Dann reichte er ihr die Hand und richtete sie auf.[a] Darauf rief er die Heiligen und die Witwen und stellte sie ihnen lebend vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „half ihr auf“ bzw. „ließ sie aufstehen“. Das griechische Verb kann bedeuten, jemanden aufzurichten oder zum Aufstehen zu bringen; in diesem Zusammenhang klingt zugleich Auferstehungssprache an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: reichte er ihr die Hand
  rationale: Die Formulierung gibt die natürliche griechische Wendung für das unterstützende Ausstrecken der Hand im Deutschen klar und würdevoll wieder.
- source_word: ἀνέστησεν
  choice: richtete sie auf
  rationale: Die Wiedergabe bezeichnet unmittelbar das Aufrichten beziehungsweise Aufstehenlassen und bewahrt zugleich den möglichen Anklang an die Auferstehungssprache.
- source_word: φωνήσας
  choice: rief er
  rationale: Das Aoristpartizip bezeichnet hier das Herbeirufen der genannten Personen vor dem anschließenden Vorstellen Tabitas.
- source_word: τοὺς ἁγίους
  choice: die Heiligen
  rationale: Dies ist die direkte neutestamentliche Bezeichnung für die zu Gottes Volk Gehörenden; „Gläubigen“ wäre stärker deutend.
- source_word: τὰς χήρας
  choice: die Witwen
  rationale: Die eigene Nennung der Witwen wird entsprechend dem griechischen Text und ihrer Bedeutung im vorausgehenden Zusammenhang beibehalten.
- source_word: παρέστησεν
  choice: stellte sie ihnen ... vor
  rationale: παρίστημι bezeichnet hier, dass Petrus Tabita vor die herbeigerufenen Menschen treten lässt beziehungsweise sie ihnen präsentiert.
- source_word: ζῶσαν
  choice: lebend
  rationale: Das prädikative Partizip betont ihren nunmehr lebendigen Zustand; „lebend“ fügt sich idiomatisch in „stellte sie ihnen lebend vor“.
theological_decisions:
- issue: Wiedergabe des auferstehungsbezogenen Verbs ἀνέστησεν im Erzählzusammenhang
  choice: richtete sie auf
  alternative: half ihr auf / ließ sie aufstehen / erweckte sie
  rationale: „Richtete sie auf“ bleibt beim unmittelbar beschriebenen körperlichen Handeln, ohne den im Verb möglichen Anklang an Auferstehungssprache auszublenden. „Erweckte sie“ würde hier dagegen nahelegen, dass erst diese Handlung die Wiederbelebung bewirkte, obwohl sie nach dem vorangehenden Vers bereits die Augen geöffnet hatte.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bildet die zeitliche Abfolge der griechischen Partizipien natürlich ab; „die Heiligen“ wahrt die neutestamentliche Begrifflichkeit.
