source:
  edition: SBLGNT
  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: de
  text: Doch ihr Anschlag wurde Saulus bekannt. Sie beobachteten außerdem Tag und Nacht die Tore[a], um ihn zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stadttore“. Im Griechischen steht nur „die Tore“; dass die Tore der Stadt gemeint sind, ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: wurde … bekannt
  rationale: Die unpersönliche Passivkonstruktion bleibt erhalten und nennt keinen Vermittler, durch den Saulus von dem Anschlag erfuhr.
- source_word: ἐπιβουλή
  choice: Anschlag
  rationale: Das Wort bezeichnet hier einen feindlichen Plan gegen Saulus; „Anschlag“ passt zum ausdrücklich genannten Tötungsziel.
- source_word: παρετηροῦντο
  choice: überwachten
  rationale: Das Imperfekt bezeichnet eine andauernde Beobachtung. „Überwachten“ gibt die gezielte Kontrolle der Ausgänge wieder, ohne das Verb auf bloßes Bewachen zu verengen.
- source_word: πύλας
  choice: die Tore
  rationale: Der griechische Text nennt schlicht „die Tore“; aus dem Zusammenhang ergibt sich, dass die Stadttore von Damaskus gemeint sind.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: Tag und Nacht
  rationale: Die geläufige deutsche Wendung gibt die fortgesetzte Überwachung zu beiden Tageszeiten natürlich wieder.
- source_word: ὅπως
  choice: um
  rationale: Der finale Infinitivsatz bringt den Zweck der Überwachung in natürlichem modernem Deutsch klar zum Ausdruck.
- source_word: ἀνέλωσιν
  choice: ihn zu töten
  rationale: ἀναιρέω bedeutet in diesem Zusammenhang eindeutig, jemanden umzubringen; „töten“ ist direkt und sachlich.
- source_word: δὲ
  choice: Doch
  rationale: „Doch“ markiert den Gegensatz zwischen dem Mordplan und der Tatsache, dass Saulus davon Kenntnis erhielt.
- source_word: καὶ
  choice: außerdem
  rationale: Das Wort fügt zur Planung die weitere Maßnahme der Torüberwachung hinzu.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die passive Formulierung vermeidet eine nicht im Text genannte Informationsquelle. Der Fußnotenmarker steht unmittelbar bei „Tore“, da sich die Erläuterung auf dieses Wort bezieht.
