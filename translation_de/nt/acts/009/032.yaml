id: ACT.9.32
reference: Acts 9:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: de
  text: Als Petrus überall unterwegs war, kam er auch zu den Heiligen hinab, die in Lydda wohnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: durch das ganze Gebiet zog
  rationale: Das substantivlose πάντων ist im Zusammenhang räumlich zu verstehen. Die Wiedergabe vermeidet das im Deutschen missverständliche „durch sie alle“ und lässt offen, welche Orte der Reise genau gemeint sind.
- source_word: κατελθεῖν
  choice: kam … zu
  rationale: Das Verb bezeichnet hier das Aufsuchen bzw. Hinabgehen zu den Gläubigen in Lydda. Natürliches Deutsch verlangt nicht zwingend die topografische Angabe „hinab“.
- source_word: τοὺς ἁγίους
  choice: den Heiligen
  rationale: Die etablierte neutestamentliche Bezeichnung für die Gläubigen wird bewahrt; sie meint hier die christliche Gemeinschaft in Lydda.
- source_word: Λύδδα
  choice: Lydda
  rationale: Die geläufige deutsche Form des antiken Ortsnamens wird verwendet.
theological_decisions:
- issue: Bedeutung von „die Heiligen“
  choice: den Heiligen
  alternative: den Gläubigen
  rationale: Die formnähere Wiedergabe erhält die frühchristliche Gemeinschaftsbezeichnung, ohne eine besondere geistliche Elite nahezulegen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Das griechische Ἐγένετο δὲ wird nicht mit einer schwerfälligen Ereignisformel wiedergegeben; die deutsche Satzfügung trägt den erzählerischen Übergang natürlich mit.
