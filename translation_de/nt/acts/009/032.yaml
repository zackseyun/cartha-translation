  source_fidelity: Die Wiedergabe von τοὺς ἁγίους als „den Heiligen“ und des Ortsnamens ist zutreffend. „Durch das ganze Gebiet“ legt jedoch ein einzelnes abgegrenztes Gebiet stärker fest als das elliptische διὰ πάντων („durch alle [Orte] / überall“). Außerdem bleibt die Richtungsnuance von κατελθεῖν in „kam … zu“ unberücksichtigt.
  naturalness: Der Entwurf ist klar und gut lesbar. „Überall unterwegs war“ und „hinabkam“ sind im modernen Standarddeutsch natürlich und bewahren zugleich die Offenheit beziehungsweise Bewegungsrichtung des griechischen Textes.
