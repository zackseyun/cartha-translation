  source_fidelity: Der Entwurf gibt εὐθέως, den Lokativ und Plural in „in den Synagogen“, das direkte Objekt τὸν Ἰησοῦν sowie den Inhaltssatz zutreffend wieder. „Dieser“ bewahrt den identifizierenden Nachdruck von οὗτός, ohne einen nicht im Text stehenden Zusatz einzuführen. „Der Sohn Gottes“ entspricht ὁ υἱὸς τοῦ θεοῦ präzise. Das deutsche Präteritum „verkündete“ ist im erzählenden Register eine vertretbare Wiedergabe des Imperfekts; die Fußnote weist angemessen auf die mögliche einsetzende bzw. fortdauernde Nuance hin.
