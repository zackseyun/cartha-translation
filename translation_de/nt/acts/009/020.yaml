  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: de
  text: 'Und sofort verkündete er in den Synagogen Jesus: Dieser ist der Sohn Gottes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und sofort begann er in den Synagogen Jesus zu verkünden: Dieser ist der Sohn Gottes.« Das griechische Verb bezeichnet öffentliches Verkünden; die Imperfektform kann hier auch den Beginn oder Fortgang der Tätigkeit hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die unverzügliche zeitliche Abfolge prägnant und in natürlichem modernem Deutsch wieder.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: in den Synagogen
  rationale: Bewahrt die lokale Bedeutung der Präposition und den Plural des griechischen Textes.
- source_word: ἐκήρυσσεν
  choice: verkündete
  rationale: Gibt den Sinn öffentlicher Bekanntmachung bzw. Proklamation wieder. Das Imperfekt kann je nach Kontext auch als einsetzende oder fortdauernde Tätigkeit verstanden werden.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Behält Jesus wie im Griechischen als direktes Objekt bei, ohne das nicht ausdrücklich vorhandene »über« einzufügen.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen den Inhalt der Verkündigung natürlich und klar ein.
- source_word: οὗτός
  choice: Dieser
  rationale: Bewahrt die nachdrückliche identifizierende Kraft des Demonstrativpronomens und verweist eindeutig auf Jesus.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Entspricht der bestimmten, christologischen Titulierung des griechischen Ausdrucks ohne interpretierende Erweiterung.
theological_decisions:
- issue: Christologischer Titel in Saulus’ Verkündigung
  choice: der Sohn Gottes
  alternative: Gottes Sohn
  rationale: Die gewählte Form gibt den bestimmten griechischen Ausdruck direkt wieder und bewahrt sein christologisches Gewicht.
- issue: Nachdrückliche Identifizierung durch οὗτός
  choice: Dieser ist der Sohn Gottes
  alternative: Er ist der Sohn Gottes
  rationale: »Dieser« erhält den demonstrativen Nachdruck des Ausgangstextes, bleibt im Deutschen verständlich und identifiziert Jesus ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kompakte Formulierung »Jesus verkünden« bewahrt die Struktur und den christologischen Fokus des griechischen Textes; der Doppelpunkt vermeidet ein im Deutschen schwerfälliges »dass dieser«.
