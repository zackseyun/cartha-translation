translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Partizipialkonstruktion; die direkte Rede bleibt knapp und eindringlich. Die echte Bedeutungsbreite von ὀκνέω wird im Haupttext und in der Fußnote bewahrt.
