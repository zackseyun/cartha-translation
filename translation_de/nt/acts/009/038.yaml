  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: de
  text: 'Da Lydda nahe bei Joppe lag, schickten die Jünger, als sie hörten, dass Petrus dort war, zwei Männer zu ihm mit der dringenden Bitte: „Zögere nicht[a], zu uns zu kommen!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Säume nicht, zu uns zu kommen!“ Das Verb kann sowohl Zögern als auch Verzögerung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Da Lydda nahe bei Joppe lag
  rationale: Der Genitivus absolutus beschreibt den Hintergrund und legt hier einen ursächlichen Zusammenhang mit dem Handeln der Jünger nahe. „Da“ gibt dies knapp und natürlich wieder; δέ erfordert an dieser Stelle keinen eigenen deutschen Diskursmarker.
- source_word: Λύδδας / Ἰόππῃ
  choice: Lydda / Joppe
  rationale: „Lydda“ ist die übliche neutestamentliche Namensform; „Joppe“ ist die im Deutschen eingebürgerte biblische Form des griechischen Ἰόππη.
- source_word: οἱ μαθηταὶ ἀκούσαντες
  choice: hörten die Jünger
  rationale: Das aoristische Partizip bezeichnet den Umstand, der ihrem Senden vorausgeht. Ein finiter deutscher Satz ist hier natürlicher und hält die zeitliche Abfolge offen genug.
- source_word: ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: dass Petrus dort war
  rationale: ἐν αὐτῇ verweist auf Lydda und wird idiomatisch mit „dort“ wiedergegeben. Das griechische Präsens steht innerhalb des vom Hören abhängigen Inhalts; im Deutschen ist nach dem Vergangenheitsverb „hörten“ das Präteritum natürlich.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: Sie schickten zwei Männer zu ihm
  rationale: Die Formulierung bildet Verb, Zahl und Ziel der Sendung direkt und in gegenwärtigem Standarddeutsch ab.
- source_word: παρακαλοῦντες
  choice: und baten ihn dringend
  rationale: παρακαλέω bezeichnet hier eine nachdrückliche Bitte. „Baten ihn dringend“ trifft den Ernst, ohne die emotionale Stärke von „anflehen“ einzutragen.
- source_word: Μὴ ὀκνήσῃς
  choice: Zögere nicht
  rationale: ὀκνέω kann sowohl Zögern aus Zurückhaltung als auch Säumen bzw. Verzögerung bezeichnen. Das deutsche „zögern“ bewahrt diese Bedeutungsbreite weitgehend.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: zu uns zu kommen
  rationale: Die Wendung bezeichnet die Reise bis zum Aufenthaltsort der Sprechenden. „Zu uns zu kommen“ ist die natürliche deiktische Wiedergabe, ohne einen unnötig wörtlichen Durchgang auszudrücken.
