id: ACT.9.12
reference: Acts 9:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: de
  text: und er hat in einer Vision einen Mann namens Hananias gesehen, der hereinkam und ihm die Hände auflegte, damit er wieder sehen kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit er sein Augenlicht wiedererlangen kann«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: hat … gesehen
  rationale: Der Aorist bezeichnet das bereits erfolgte Sehen; das deutsche Perfekt ist in gegenwärtiger Erzählrede natürlich und wahrt die fortdauernde Bedeutung der Vision.
- source_word: ἐν ὁράματι
  choice: in einer Vision
  rationale: Die Präpositionalphrase bezeichnet den Rahmen beziehungsweise das Medium des Sehens.
- source_word: ἄνδρα … Ἁνανίαν ὀνόματι
  choice: einen Mann namens Hananias
  rationale: Die Wendung identifiziert den Mann auf natürliche Weise mit seinem Namen; die traditionelle deutsche Namensform lautet Hananias.
- source_word: εἰσελθόντα
  choice: der hereinkam
  rationale: Das Partizip beschreibt die in der Vision gesehene Handlung; ein Relativsatz klingt im Deutschen natürlich und legt keine unnötig strenge zeitliche Abfolge fest.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: ihm die Hände auflegte
  rationale: Die vertraute biblische Wendung gibt die körperliche Handlung wieder, ohne ihre theologische Bedeutung näher festzulegen.
- source_word: ὅπως
  choice: damit
  rationale: Leitet hier einen Zwecksatz ein und entspricht natürlichem modernem Deutsch.
- source_word: ἀναβλέψῃ
  choice: wieder sehen konnte
  rationale: Im Zusammenhang von Saulus’ Blindheit bezeichnet das Verb die Wiedererlangung des Sehvermögens; die Formulierung bleibt näher am Bild des Sehens als eine abstraktere Wiedergabe.
theological_decisions:
- issue: Bedeutung der Handauflegung
  choice: ihm die Hände auflegte
  alternative: seine Hände auf ihn legte
  rationale: Der griechische Text nennt die Handlung, erklärt sie an dieser Stelle aber nicht als Sakrament, Ordination oder bestimmte charismatische Methode. Die geläufige Wendung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt entsprechend dem griechischen Satzanschluss mit »und«. Das Perfekt passt zur direkten Rede des unmittelbaren Kontextes; der Relativsatz gibt die beiden griechischen Partizipien flüssig wieder.
