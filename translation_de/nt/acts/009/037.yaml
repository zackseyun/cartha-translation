  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: de
  text: In jenen Tagen geschah es, dass sie krank wurde und starb. Nachdem man sie gewaschen hatte, legte man sie in einen Raum im Obergeschoss.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »in ein Obergemach«. Das griechische Wort bezeichnet allgemein einen Raum in einem oberen Stockwerk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: In jenen Tagen geschah es
  rationale: Die Wendung führt ein neues Ereignis in der Erzählung ein. Die Übersetzung bleibt nah am griechischen Ausdruck, ohne ein nicht ausdrücklich vorhandenes »nun« einzufügen.
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: dass sie krank wurde und starb
  rationale: Die griechische Infinitivkonstruktion wird in natürlichem Deutsch als dass-Satz wiedergegeben; die Abfolge von Erkrankung und Tod bleibt erhalten.
- source_word: λούσαντες
  choice: Nachdem man sie gewaschen hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Niederlegen vorausging. Das unbestimmte »man« gibt die im Griechischen nicht genannten Handelnden natürlich wieder.
- source_word: ἔθηκαν αὐτὴν
  choice: legten man sie
  rationale: τίθημι bezeichnet hier im Zusammenhang mit dem Tod das Niederlegen beziehungsweise Aufbahren des Körpers; »legte« passt besser als das allgemeinere »stellte« oder »setzte«.
- source_word: ἐν ὑπερῴῳ
  choice: in ein Zimmer im Obergeschoss
  rationale: ὑπερῷον bezeichnet einen Raum in einem oberen Stockwerk. Die Formulierung ist räumlich klar und vermeidet den Eindruck, es handle sich um einen bestimmten, bereits bekannten Raum.
theological_decisions:
- issue: Ob ὑπερῴῳ traditionell als »Obergemach« oder als allgemeine räumliche Angabe wiederzugeben ist
  choice: in ein Zimmer im Obergeschoss
  alternative: in ein Obergemach
  rationale: Der Ausdruck ist nicht lehrmäßig festgelegt und trägt im Griechischen keinen bestimmten Artikel. Die gewählte Fassung gibt daher den gewöhnlichen räumlichen Sinn wieder, ohne einen besonderen bekannten Ort anzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt erzählerisch klar; altertümliche Ausdrücke werden im Haupttext vermieden, während die traditionelle Wiedergabe in der Fußnote genannt wird.
