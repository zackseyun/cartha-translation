id: ACT.9.31
reference: Acts 9:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: de
  text: So hatte nun die Gemeinde[a] in ganz Judäa, Galiläa und Samarien Frieden und wurde aufgebaut. Sie lebte in der Furcht des Herrn und unter dem Zuspruch des Heiligen Geistes[b] und nahm immer weiter zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „die Gemeinden“ statt „die Gemeinde“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „unter der Ermutigung“, „unter dem Trost“ oder „unter der Ermahnung durch den Heiligen Geist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: die Gemeinde
  rationale: Der SBLGNT bietet den kollektiven Singular. „Gemeinde“ ist im modernen Deutsch verständlich und kann hier die eine Kirche beziehungsweise Gemeinde in allen genannten Gebieten bezeichnen; die bedeutende Pluralvariante wird in einer Fußnote bewahrt.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: in ganz Judäa, Galiläa und Samarien
  rationale: κατά mit Genitiv bezeichnet hier die räumliche Ausdehnung; „in ganz“ gibt zugleich ὅλης natürlich wieder und bezieht sich sinngemäß auf alle drei Regionen.
- source_word: εἶχεν εἰρήνην
  choice: hatte Frieden
  rationale: Die direkte deutsche Wendung bewahrt εἰρήνη und umfasst sowohl das Nachlassen der Verfolgung als auch geordnete Verhältnisse, ohne dies näher festzulegen.
- source_word: οἰκοδομουμένη
  choice: wurde aufgebaut
  rationale: Die fortlaufende passive Form und das Bild des Bauens bleiben erhalten. Der Kontext macht deutlich, dass es um die Stärkung und Festigung der Gemeinde geht.
- source_word: πορευομένη
  choice: lebte
  rationale: Das Partizip bezeichnet hier die Lebensführung. „Lebte“ ist im heutigen Deutsch natürlicher als das wörtliche „wandelte“, ohne die ethische Bedeutung zu verlieren.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: in der Furcht des Herrn
  rationale: Die traditionelle und quellennah formulierte Wendung bewahrt die theologische Tiefe und legt φόβος nicht einseitig als Angst oder nur als Ehrfurcht aus.
- source_word: κυρίου
  choice: Herr
  rationale: „Herr“ ist die übliche Wiedergabe von κύριος. Der mögliche Bezug auf Jesus wird nicht über den griechischen Wortlaut hinaus ausdrücklich festgelegt.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: im Beistand des Heiligen Geistes
  rationale: παράκλησις umfasst Ermutigung, Trost und Zuspruch. „Beistand“ klingt natürlich, passt zur stärkenden Wirksamkeit des Geistes und lässt mehr von der Bedeutungsbreite offen als eine enge Festlegung.
- source_word: ἐπληθύνετο
  choice: wuchs immer weiter
  rationale: Die Form bezeichnet eine fortdauernde Zunahme. „Wuchs immer weiter“ ist idiomatisches Deutsch und gibt den numerischen Zuwachs im Kontext wieder, ohne die Gemeinde sprachlich zu verdinglichen.
theological_decisions:
- issue: Zahl und Bezug von ἐκκλησία
  choice: 'kollektiver Singular: „die Gemeinde“'
  alternative: 'Pluralvariante: „die Gemeinden“'
  rationale: Der vorgegebene SBLGNT-Text sowie die zugehörigen Partizipien und Verben stehen im Singular. Die textkritisch wichtige Plurallesart wird in einer Fußnote genannt.
- issue: Bedeutung der „Furcht des Herrn“
  choice: Die quellennah formulierte Wendung bleibt im Haupttext bestehen.
  alternative: „in Ehrfurcht vor dem Herrn“
  rationale: φόβος kann hier ehrfürchtige, gehorsame Gottesfurcht bezeichnen. Eine interpretierende Ersetzung durch „Ehrfurcht“ würde die biblische Ausdrucksweise und ihre Spannung verengen.
- issue: Bedeutung von παράκλησις beim Heiligen Geist
  choice: Beistand
  alternative: Ermutigung, Trost oder Ermahnung
  rationale: Das Wort besitzt eine echte semantische Breite. „Beistand“ passt zum stärkenden Handeln des Geistes, während die Fußnote wichtige Alternativen ausdrücklich offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde gegenüber dem langen griechischen Periodensatz leicht gegliedert. „Furcht des Herrn“ bewahrt die traditionelle theologische Ausdrucksweise; „lebte“ vermeidet das heute altertümliche „wandelte“. Alle Fußnotenmarker stehen im Haupttext.
