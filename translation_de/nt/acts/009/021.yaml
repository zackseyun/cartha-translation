id: ACT.9.21
reference: Acts 9:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: de
  text: 'Alle, die ihn hörten, waren außer sich vor Staunen und sagten: »Ist das nicht der Mann, der in Jerusalem gegen diejenigen verheerend vorging, die diesen Namen anrufen[a]? Und war er nicht gerade deshalb hierhergekommen, um sie gefesselt zu den obersten Priestern zu bringen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Diesen Namen« meint den Namen Jesu. »Den Namen anrufen« ist eine biblische Ausdrucksweise dafür, sich im Gebet und Bekenntnis an ihn zu wenden.
    reason: Die Fußnote klärt den im griechischen Text unausgesprochenen Bezug und erläutert die idiomatische Wendung, ohne den Haupttext interpretierend zu erweitern.
lexical_decisions:
- source_word: ἐξίσταντο
  choice: waren außer sich vor Staunen
  rationale: Gibt die starke, andauernde Bestürzung des Imperfekts wieder und klingt im modernen Deutschen natürlich.
- source_word: πάντες οἱ ἀκούοντες
  choice: Alle, die ihn hörten
  rationale: Das im Zusammenhang erschlossene Objekt »ihn« macht den deutschen Satz klar, ohne den Sinn zu erweitern.
- source_word: πορθήσας
  choice: der ... alle vernichten wollte
  rationale: Das Verb bezeichnet verheerendes, zerstörerisches Vorgehen. Die deutsche Wendung wahrt die Stärke, ohne zu behaupten, dass die Betroffenen tatsächlich vernichtet wurden.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: alle, die diesen Namen anrufen
  rationale: Bewahrt die biblische Ausdrucksweise für das gläubige Anrufen beziehungsweise Bekennen des Namens.
- source_word: ἐληλύθει
  choice: war ... hierhergekommen
  rationale: Das Plusquamperfekt des griechischen Verbs wird im Deutschen entsprechend wiedergegeben.
- source_word: δεδεμένους
  choice: gefesselt
  rationale: Gibt den durch das Perfektpartizip bezeichneten Zustand knapp wieder, ohne Ketten als konkrete Fesselungsart hinzuzufügen.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: zu den führenden Priestern zu bringen
  rationale: Gibt die Bewegung zu den zuständigen priesterlichen Autoritäten natürlich wieder.
- source_word: ἀρχιερεῖς
  choice: führende Priester
  rationale: Bezeichnet den Kreis der obersten priesterlichen Autoritäten und vermeidet das missverständliche deutsche Pluralwort »Hohepriester«.
theological_decisions:
- issue: Bezug von »diesen Namen«
  choice: Die indirekte Formulierung »diesen Namen« bleibt im Haupttext erhalten.
  alternative: »den Namen Jesu«
  rationale: Der griechische Text nennt Jesus hier nicht ausdrücklich; der Bezug ist aus dem Kontext klar, und die rhetorische sowie theologische Spannung bleibt gewahrt.
- issue: Stärke von πορθέω
  choice: »vernichten wollte«
  alternative: »verfolgte« oder »verwüstete«
  rationale: »Verfolgte« wäre zu schwach, während ein schlichtes »vernichtete« den Erfolg der Handlung nahelegen könnte. Die gewählte Formulierung bezeichnet Sauls zerstörerisches Vorgehen und dessen Ziel.
- issue: Rhetorische Form des zweiten Satzteils
  choice: als zweite verneinte Frage wiedergegeben
  alternative: 'als Feststellung: »Er war doch gerade deshalb ... gekommen«'
  rationale: Das griechische Fragezeichen umfasst den gesamten Ausspruch; die zweite Frage erhält das erstaunte Nachhaken der Sprecher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt lebendig; »führende Priester« ist für heutige Leser verständlicher als das potenziell missverständliche »Hohepriester«.
