  source_fidelity: 'Die Wiedergabe des Erstaunens, der rhetorischen Fragen, von »diesem Namen«, des Plusquamperfekts und von δεδεμένους ist grundsätzlich treffend. Nicht quellentreu ist jedoch »alle vernichten wollte« für πορθήσας: Das aoristische Partizip beschreibt Sauls bereits ausgeübtes verheerendes Vorgehen, nicht lediglich seine Absicht; außerdem steht im Griechischen kein »alle« bei denjenigen, die den Namen anrufen.'
  naturalness: Der Text ist überwiegend modernes, verständliches Standarddeutsch. »gegen ... verheerend vorging« ist idiomatisch und gibt die Stärke des Verbs wieder, ohne eine vollständige Vernichtung der Betroffenen zu behaupten. »obersten Priestern« ist in der Zielkultur klarer als »führenden Priestern« und wahrt die institutionelle Funktion von ἀρχιερεῖς.
  terminology: »Diesen Namen anrufen« bewahrt die absichtlich indirekte, biblisch geprägte Formulierung. »Oberste Priester« gibt den Plural ἀρχιερεῖς als Kreis führender priesterlicher Autoritäten wieder, ohne den irreführenden Eindruck mehrerer amtierender einzelner Hohepriester zu erzeugen.
