base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: de
  text: Und Petrus blieb viele Tage in Joppe bei einem gewissen Simon[a], einem Gerber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Haus eines gewissen Simon“. Die griechische Präposition kann einen Aufenthalt bei jemandem in dessen Haus bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: Petrus blieb
  rationale: Die Konstruktion ἐγένετο mit Infinitiv wird im Deutschen natürlich durch das finite Hauptverb „blieb“ wiedergegeben. Das Subjekt Petrus wird aus dem unmittelbaren Zusammenhang ergänzt, um einen idiomatischen deutschen Satz zu bilden.
- source_word: δὲ
  choice: Und
  rationale: δέ führt die Erzählung mit einem leichten Anschluss weiter; „Und“ gibt dies schlicht wieder.
- source_word: ἡμέρας ἱκανὰς
  choice: noch viele Tage
  rationale: ἱκανάς bezeichnet hier eine beträchtliche Zeitspanne. „Viele Tage“ ist präzise und idiomatisch; „noch“ verdeutlicht im Deutschen den fortgesetzten Aufenthalt, ohne eine neue Sachinformation einzuführen.
- source_word: ἐν Ἰόππῃ
  choice: in Joppe
  rationale: „Joppe“ ist die im Deutschen gebräuchliche biblische Namensform für Ἰόππη.
- source_word: παρά τινι Σίμωνι
  choice: bei einem gewissen Simon
  rationale: παρά mit Dativ kann den Aufenthalt bei einer Person beziehungsweise in ihrem Haus bezeichnen. τινι bleibt mit „einem gewissen“ als unbestimmte Einführung erhalten.
- source_word: βυρσεῖ
  choice: einem Gerber
  rationale: βυρσεύς bezeichnet spezifisch einen Handwerker, der Tierhäute gerbt; „Gerber“ ist die genaue und geläufige deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Eigenname „Petrus“ wird zur natürlichen Subjektwiederaufnahme aus dem Kontext ergänzt. Die Apposition „einem Gerber“ bewahrt die knappe Struktur des griechischen Textes.
