  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: de
  text: Da ich aber bei der Untersuchung dieser Angelegenheiten ratlos war,[a] fragte ich, ob er nach Jerusalem gehen und dort in diesen Angelegenheiten vor Gericht gestellt werden wolle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da ich aber wegen der Auseinandersetzung über diese Angelegenheiten ratlos war«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ob er bereit sei, nach Jerusalem zu gehen und dort in diesen Angelegenheiten vor Gericht gestellt zu werden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: da ich … ratlos war
  rationale: Das Partizip bezeichnet Ratlosigkeit oder Unsicherheit. Die kausale Wiedergabe mit „da“ passt zum Zusammenhang, in dem Festus sein weiteres Vorgehen begründet.
- source_word: ζήτησιν
  choice: bei der Untersuchung
  rationale: Das Wort kann eine Untersuchung, Erörterung oder Auseinandersetzung bezeichnen. Im rechtlich-administrativen Zusammenhang ist „Untersuchung“ passend; die mögliche Bedeutung „Auseinandersetzung“ bleibt in der Fußnote erhalten.
- source_word: περὶ τούτων
  choice: dieser Angelegenheiten / darüber
  rationale: „Diese Angelegenheiten“ entspricht dem sachlich-rechtlichen Zusammenhang. Beim zweiten Vorkommen vermeidet „darüber“ eine schwerfällige Wiederholung, ohne den Bezug zu verändern.
- source_word: ἔλεγον
  choice: fragte ich
  rationale: Wörtlich steht „sagte ich“, doch die folgende indirekte Frage mit εἰ macht deutlich, dass Festus eine Frage stellte.
- source_word: εἰ βούλοιτο
  choice: ob er … wolle
  rationale: Der Optativ steht in indirekter Rede. „Wolle“ gibt Wunsch bzw. Absicht in gehobenem, aber gegenwärtigem Standarddeutsch wieder; die Nuance der Bereitschaft wird in der Fußnote genannt.
- source_word: πορεύεσθαι
  choice: gehen
  rationale: „Gehen“ ist die natürliche deutsche Entsprechung für die hier gemeinte Reisebewegung.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: κἀκεῖ
  choice: und dort
  rationale: Die koordinierte Ortsangabe wird unmittelbar und natürlich wiedergegeben.
- source_word: κρίνεσθαι
  choice: gerichtet werden
  rationale: Die passive Form bezeichnet eine rechtliche Beurteilung. „Gerichtet werden“ bewahrt den breiteren Sinn, ohne den Vorgang ausdrücklich auf eine bestimmte Prozessform einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-sachlichem Ton. Die etwas formellere indirekte Rede „wolle“ entspricht der erzählten Rede des Festus; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten bewahrt.
