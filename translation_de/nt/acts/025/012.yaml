  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: de
  text: 'Nachdem Festus sich mit dem Rat beraten hatte, antwortete er: »Du hast dich auf den Kaiser berufen; zum Kaiser wirst du gehen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vor den Kaiser wirst du kommen.« Die Wendung kann im rechtlichen Sinn das Erscheinen vor dem Gericht des Kaisers bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Leitet in der Erzählung knapp und natürlich den nächsten Vorgang ein.
- source_word: συλλαλήσας μετὰ τοῦ συμβουλίου
  choice: besprach sich … mit dem Rat
  rationale: Gibt das vorausgehende beratende Gespräch wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Entspricht dem üblichen erzählenden Gebrauch und wahrt den förmlichen Ton der Rechtsszene.
- source_word: Καίσαρα
  choice: den Kaiser
  rationale: Καῖσαρ bezeichnet hier den römischen Kaiser als Rechtsinstanz; im Deutschen ist die etablierte Titelbezeichnung natürlicher als die Namensform »Cäsar«.
- source_word: ἐπικέκλησαι
  choice: du hast dich … berufen
  rationale: Das Perfekt des Mediums hat hier den juristischen Sinn, durch Berufung die Zuständigkeit des Kaisers anzurufen.
- source_word: ἐπὶ Καίσαρα πορεύσῃ
  choice: zum Kaiser wirst du gehen
  rationale: Bewahrt das ausdrücklich verwendete Bewegungsverb und die gerichtliche Zielrichtung, ohne das nicht ausgesprochene »geschickt werden« einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem erzählerischem Satzbau und verständlicher juristischer Ausdrucksweise. Die direkte Rede bleibt bestimmt, ohne durch »sollst« eine zusätzliche normative Nuance einzutragen.
