- from: 'Da besprach sich Festus mit dem Rat und antwortete: »Du hast dich auf den Kaiser berufen; zum Kaiser wirst du gehen.«[a]'
  to: 'Nachdem Festus sich mit dem Rat beraten hatte, antwortete er: »Du hast dich auf den Kaiser berufen; zum Kaiser wirst du gehen.«[a]'
