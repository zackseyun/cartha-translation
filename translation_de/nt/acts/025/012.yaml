review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die zeitliche Abfolge von τότε und dem vorzeitigen Aoristpartizip συλλαλήσας, das beratende Gespräch mit dem Rat, die juristische Berufung auf den Kaiser sowie die anschließende Bewegung zum Kaiser zutreffend wieder. „Zum Kaiser wirst du gehen“ bewahrt das Bewegungsverb πορεύσῃ und legt keine nicht ausdrücklich genannte Versendung nahe.
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Standarddeutsch. Eine explizit temporale Partizipialauflösung mit „Nachdem … beraten hatte“ bildet die griechische Vorzeitigkeit noch klarer und liest sich in einer Rechtsszene besonders flüssig.
  terminology: „Sich auf den Kaiser berufen“ ist hier eine passende deutsche juristische Wiedergabe von ἐπικέκλησαι. „Der Kaiser“ ist als deutsche Bezeichnung der römischen Rechtsinstanz idiomatisch. „Rat“ ist für συμβούλιον ausreichend neutral und fügt kein Possessivpronomen hinzu.
  issues:
  - severity: low
    issue: Position des Fußnotenankers
    rationale: Die Fußnote erläutert ausschließlich die alternative Wiedergabe von ἐπὶ Καίσαρα πορεύσῃ. Der Anker sollte daher unmittelbar bei „zum Kaiser wirst du gehen“ stehen, nicht erst nach dem gesamten Zitat.
  - severity: low
    issue: Vorzeitigkeit von συλλαλήσας
    rationale: Die koordinierende Formulierung „besprach sich … und antwortete“ ist möglich, aber „Nachdem … beraten hatte, antwortete er“ macht die durch den Aoristpartizip ausgedrückte vorausgehende Beratung eindeutiger.
  revised_text: 'Nachdem Festus sich mit dem Rat beraten hatte, antwortete er: »Du hast dich auf den Kaiser berufen; zum Kaiser wirst du gehen.«[a]'
  revised_footnotes:
  - marker: a
    text: 'Oder: »Vor den Kaiser wirst du kommen.« Die Wendung kann im rechtlichen Sinn das Erscheinen vor dem Gericht des Kaisers bezeichnen.'
    reason: alternative_reading
