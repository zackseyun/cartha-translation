id: ACT.25.6
reference: Acts 25:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: de
  text: Nachdem er sich nicht länger als acht oder zehn Tage bei ihnen aufgehalten hatte, ging er hinab nach Cäsarea. Am nächsten Tag nahm er auf dem Richterstuhl Platz[a] und befahl, Paulus vorzuführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „setzte er sich auf den Richterstuhl“. Das griechische Wort βῆμα bezeichnet den erhöhten amtlichen Sitz beziehungsweise den Gerichtsplatz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: Nachdem er sich … bei ihnen aufgehalten hatte
  rationale: Das temporale Aoristpartizip bezeichnet eine dem Hinabgehen vorausgehende Handlung. „Sich bei ihnen aufhalten“ gibt διατρίβω ἐν αὐτοῖς natürlich und präzise wieder.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: nicht länger als acht oder zehn Tage
  rationale: Die Formulierung bewahrt den verneinten Vergleich und die im Ausdruck „acht oder zehn“ liegende ungefähre Zeitangabe.
- source_word: καταβὰς εἰς Καισάρειαν
  choice: ging er hinab nach Cäsarea
  rationale: „Hinabgehen“ erhält die übliche geografische Richtungsangabe für die Reise von Jerusalem nach Cäsarea; der griechische Name wird in der gebräuchlichen deutschen Form wiedergegeben.
- source_word: τῇ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Klare und idiomatische Wiedergabe der Zeitangabe für den Tag nach der Ankunft.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: nahm er auf dem Richterstuhl Platz
  rationale: βῆμα bezeichnet hier den erhöhten amtlichen Gerichtssitz. „Auf dem Richterstuhl Platz nehmen“ vermittelt sowohl die konkrete Sitzhandlung als auch den gerichtlichen Rahmen.
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: befahl, Paulus vorzuführen
  rationale: ἐκέλευσεν bezeichnet eine amtliche Anordnung; das passive ἀχθῆναι wird im deutschen Gerichtskontext idiomatisch mit „vorführen“ wiedergegeben.
