    issue: „Weil“ legt einen Kausalzusammenhang fest.
    rationale: τοῦ ... ἐπικαλεσαμένου ist ein Genitivus absolutus und dient hier vor allem dem erzählerischen Übergang. Eine zeitlich-kontextuelle Wiedergabe mit „Als ... jedoch“ ist quellennäher und vermeidet eine unnötige Festlegung.
  - severity: low
    issue: „Berufung eingelegt und beantragt hatte“ zerlegt die griechische Konstruktion unnötig in zwei Verben.
    rationale: Das Partizip ἐπικαλεσαμένου mit Infinitiv bezeichnet die Berufung mit ihrem beantragten Ziel. Eine Formulierung mit „Berufung eingelegt hatte, bis ... gehalten zu werden“ gibt dies direkter wieder.
  revised_text: Als Paulus jedoch Berufung eingelegt hatte, bis zur Entscheidung des Kaisers in Gewahrsam gehalten zu werden, ordnete ich an, ihn in Gewahrsam zu halten, bis ich ihn zum Kaiser schicke.
