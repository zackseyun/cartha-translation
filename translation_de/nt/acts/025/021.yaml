  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: de
  text: Als Paulus jedoch Berufung eingelegt hatte, bis zur Entscheidung des Kaisers in Gewahrsam gehalten zu werden, ordnete ich an, ihn in Gewahrsam zu halten, bis ich ihn zum Kaiser schicke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: Berufung eingelegt und beantragt hatte
  rationale: Im römischen Rechtskontext bezeichnet das Medium einen förmlichen Rechtsbehelf. Die Formulierung macht zugleich deutlich, dass sich der folgende Infinitiv auf den beantragten weiteren Gewahrsam bezieht.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: in Gewahrsam gehalten zu werden / in Gewahrsam zu halten
  rationale: τηρέω bezeichnet hier amtliche Verwahrung. „In Gewahrsam halten“ gibt den rechtlichen Kontext natürlich und in beiden Vorkommen einheitlich wieder.
- source_word: διάγνωσιν
  choice: Entscheidung
  rationale: Das Substantiv bezeichnet hier eine richterliche Prüfung beziehungsweise Entscheidung. „Entscheidung“ wahrt die Breite, ohne einen bestimmten Verfahrensablauf festzulegen.
- source_word: Σεβαστοῦ
  choice: des Kaisers
  rationale: Σεβαστός ist hier der griechische Kaisertitel, der dem lateinischen Augustus entspricht. „Kaiser“ vermittelt seine Funktion im modernen Deutschen klar und vermeidet das missverständliche „des Erhabenen“.
- source_word: ἀναπέμψω
  choice: ich … schicke
  rationale: Das Verb bezeichnet hier die Weiterleitung an die höhere kaiserliche Instanz. „Schicken“ ist idiomatisch; die Richtungskomponente muss im Deutschen nicht eigens ausgedrückt werden.
- source_word: πρὸς Καίσαρα
  choice: zum Kaiser
  rationale: Καῖσαρ fungiert hier als Herrschertitel. „Zum Kaiser“ ist im Deutschen natürlich und gibt den historischen Rechtskontext klar wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Rechtssprache. Die Wiederholung von „in Gewahrsam“ wird beibehalten, weil sie der Wiederholung von τηρέω entspricht und den amtlichen Vorgang präzise bezeichnet.
