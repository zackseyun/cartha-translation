source:
  edition: SBLGNT
  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: de
  text: 'Dabei erbaten sie von ihm eine Gefälligkeit zulasten von Paulus: Er solle ihn nach Jerusalem holen lassen.[a] Zugleich planten sie einen Hinterhalt, um ihn unterwegs zu töten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er solle ihn nach Jerusalem kommen lassen.“ Das griechische Verb kann bedeuten, jemanden kommen oder holen zu lassen beziehungsweise zu sich zu bestellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι
  choice: erbaten sie
  rationale: Das präsentische Partizip knüpft an das Subjekt des vorherigen Verses an. „erbaten“ gibt die nachdrückliche Bitte in natürlichem Deutsch wieder.
- source_word: χάριν κατ’ αὐτοῦ
  choice: eine Gefälligkeit zulasten von Paulus
  rationale: χάρις bezeichnet hier eine erbetene Gunst oder Konzession; κατ’ αὐτοῦ hat im Zusammenhang eine gegen Paulus gerichtete, nachteilige Bedeutung. Die Namensnennung klärt die sonst im Deutschen schwer verständliche Pronomenfolge.
- source_word: ὅπως μεταπέμψηται αὐτὸν
  choice: Er solle ihn … holen lassen
  rationale: ὅπως mit dem Konjunktiv bezeichnet den Inhalt beziehungsweise Zweck der Bitte. Das mediale μεταπέμπομαι bedeutet hier, jemanden herbeiholen oder bringen zu lassen.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Natürliche deutsche Wiedergabe der Richtungsangabe.
- source_word: ἐνέδραν ποιοῦντες
  choice: Zugleich planten sie einen Hinterhalt
  rationale: Das Partizip bezeichnet eine gleichzeitig mit der Bitte verfolgte Handlung. „einen Hinterhalt planen“ ist im Deutschen idiomatisch und bildet die noch vorbereitete Falle angemessen ab.
- source_word: ἀνελεῖν
  choice: um ihn … zu töten
  rationale: Der Infinitiv bezeichnet hier eindeutig die beabsichtigte Tötung, ohne eine zusätzliche rechtliche oder moralische Wertung einzutragen.
- source_word: κατὰ τὴν ὁδόν
  choice: unterwegs
  rationale: Prägnante und natürliche Wiedergabe für eine Tat entlang des Reisewegs.
