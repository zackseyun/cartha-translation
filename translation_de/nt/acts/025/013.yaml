  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: de
  text: Nachdem einige Tage vergangen waren, kamen König Agrippa und Berenike nach Cäsarea, um Festus zu begrüßen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Nachdem einige Tage vergangen waren
  rationale: Der Genitivus absolutus gibt den zeitlichen Hintergrund an. Das schwach verbindende δέ muss im Deutschen nicht eigens wiedergegeben werden; der Satzanschluss bleibt durch den Kontext erkennbar.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: König Agrippa
  rationale: Die im Deutschen natürliche Verbindung von Titel und Eigenname bewahrt βασιλεύς als wirklichen Königstitel.
- source_word: Βερνίκη
  choice: Berenike
  rationale: Berenike ist die im Deutschen übliche, dem griechischen Namen nahestehende Form.
- source_word: κατήντησαν
  choice: kamen
  rationale: Das Verb bezeichnet hier das Eintreffen an einem Reiseziel. In Verbindung mit »nach Cäsarea« ist »kamen« natürlich und präzise.
- source_word: εἰς Καισάρειαν
  choice: nach Cäsarea
  rationale: εἰς bezeichnet bei einem Bewegungsverb das Ziel; bei Städtenamen wird dies im Deutschen idiomatisch mit »nach« ausgedrückt.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: um Festus zu begrüßen
  rationale: Das Aoristpartizip bezeichnet hier plausibel die Absicht beziehungsweise den begleitenden Anlass des Kommens. »begrüßen« gibt ἀσπάζομαι wieder, ohne eine besondere höfische Förmlichkeit hinzuzufügen.
- source_word: Φῆστον
  choice: Festus
  rationale: Festus ist die etablierte deutsche Form des römischen Namens.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die leichte narrative Verbindung durch δέ wird nicht mit einem zusätzlichen »Nun« oder »Aber« überladen.
