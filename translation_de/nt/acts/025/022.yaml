base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: de
  text: 'Da sagte Agrippa zu Festus: „Ich selbst würde den Mann gern hören.[a]“ „Morgen“, sagt er,[b] „wirst du ihn hören.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch ich würde den Mann gern hören.“ καὶ αὐτός kann neben der Betonung „ich selbst“ auch „auch ich“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht das historische Präsens: „sagt er“. Manche Übersetzungen glätten es zu „sagte er“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wirst du ihn sprechen hören“. Der griechische Ausdruck kann bedeuten, dass Agrippa den Mann unmittelbar sprechen hört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας δὲ πρὸς τὸν Φῆστον
  choice: Da sagte Agrippa zu Festus
  rationale: δέ führt die Erzählung weiter; im Deutschen gibt „Da“ den Fortgang natürlich wieder. Die elliptische griechische Konstruktion mit πρός wird idiomatisch durch „sagte … zu“ ergänzt.
- source_word: Ἐβουλόμην
  choice: würde … gern einmal
  rationale: Der Imperfekt von βούλομαι bezeichnet hier höflich bzw. zurückhaltend einen Wunsch. Die deutsche Formulierung ist natürlich und bewahrt diesen Ton, ohne einen bloß vergangenen, bereits aufgegebenen Wunsch zu behaupten.
- source_word: καὶ αὐτὸς
  choice: ich selbst
  rationale: Die Verbindung kann das Subjekt hervorheben; „ich selbst“ bewahrt diese Betonung. Eine additive Deutung („auch ich“) bleibt möglich und wird in der Fußnote genannt.
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: den Mann gern einmal hören
  rationale: ἀκούω mit dem Genitiv bezeichnet hier, die betreffende Person unmittelbar sprechen zu hören. „Den Mann hören“ bleibt nah am griechischen Ausdruck; „einmal“ macht die deutsche Wunschformulierung idiomatisch, ohne eine Wiederholung auszuschließen oder zu behaupten.
- source_word: Αὔριον, φησίν
  choice: „Morgen“, sagt er
  rationale: Das historische Präsens φησίν wird als „sagt er“ erhalten und vermittelt die lebendige Erzählweise.
- source_word: ἀκούσῃ αὐτοῦ
  choice: wirst du ihn hören
  rationale: Das Futur mit dem Genitivpronomen kann direkt als „ihn hören“ wiedergegeben werden; im Kontext bedeutet es, Paulus selbst sprechen zu hören.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der höflich-zurückhaltende Wunsch Agrippas wird idiomatisch formuliert; das historische Präsens bleibt erhalten. Die echte Mehrdeutigkeit von καὶ αὐτός und ἀκούσῃ αὐτοῦ wird nicht im Haupttext überladen, sondern in Fußnoten dokumentiert.
