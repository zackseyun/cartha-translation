  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: de
  text: Als er eingetroffen war, stellten sich die aus Jerusalem herabgekommenen Juden[a] um ihn herum[b] und brachten viele schwere Anschuldigungen gegen ihn vor, die sie nicht beweisen konnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäer“. Das griechische Wort kann sowohl die jüdische Volks- und Religionszugehörigkeit als auch die Herkunft aus Judäa bezeichnen. Hier sind jüdische Ankläger aus Jerusalem gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „umringten ihn“. Das griechische Verb bezeichnet ein Sich-Herumstellen und kann in dieser Gerichtsszene zugleich den Eindruck bedrängenden Auftretens vermitteln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Als er eingetroffen war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand. Die Formulierung gibt die Abfolge natürlich wieder, ohne das Subjekt über den Kontext hinaus ausdrücklich zu benennen.
- source_word: περιέστησαν αὐτόν
  choice: stellten sich … um ihn herum
  rationale: Die Wendung bewahrt das konkrete Bild des Umherstehens und lässt zugleich den im gerichtlichen Zusammenhang mitschwingenden Druck erkennen, ohne eine feindselige Handlung stärker auszumalen als der griechische Text.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: die aus Jerusalem herabgekommenen Juden
  rationale: Ἰουδαῖοι kann je nach Kontext Juden oder Judäer bezeichnen. Hier geht es um jüdische Ankläger aus Jerusalem; die Herkunftsangabe ist durch „aus Jerusalem“ bereits ausdrücklich enthalten. „Herabgekommen“ bewahrt die antike geografische Ausdrucksweise.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: viele schwere Anschuldigungen
  rationale: αἰτιώματα bezeichnet förmliche Anklagepunkte beziehungsweise Anschuldigungen; βαρέα hebt deren Schwere hervor. Die deutsche Formulierung ist verständlich und dem gerichtlichen Kontext angemessen.
- source_word: καταφέροντες
  choice: brachten … gegen ihn vor
  rationale: Das Partizip beschreibt im juristischen Zusammenhang das Erheben oder Vorbringen von Anklagen. „Gegen ihn vorbringen“ ist im Deutschen idiomatisch und macht den Bezug eindeutig.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: die sie nicht beweisen konnten
  rationale: ἰσχύω mit Infinitiv drückt Fähigkeit oder Vermögen aus, ἀποδείκνυμι das Erbringen eines Beweises. Die Wiedergabe erhält die fortdauernde Unfähigkeit der Ankläger im Verfahren, ohne zusätzliche Motive zu unterstellen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer juristischer Ausdrucksweise. Die antike Richtungsangabe „aus Jerusalem herabgekommen“ bleibt erhalten; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten kenntlich gemacht.
