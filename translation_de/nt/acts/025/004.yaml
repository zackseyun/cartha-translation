  text: ὁ μὲν οὖν Φῆστος ἀπεκρίθη τηρεῖσθαι τὸν Παῦλον ⸂εἰς Καισάρειαν⸃, ἑαυτὸν δὲ μέλλειν ἐν τάχει ἐκπορεύεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: de
  text: Festus antwortete darauf, Paulus werde in Cäsarea festgehalten; er selbst werde aber in Kürze abreisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Worte „in Cäsarea“ (griechisch: εἰς Καισάρειαν) sind im griechischen Text unsicher überliefert.'
    reason: Die Wortgruppe ist in der SBLGNT-Ausgabe eingeklammert und daher als textkritisch unsicher zu kennzeichnen.
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: in Gewahrsam gehalten werde
  rationale: Das Passiv bezeichnet hier im gerichtlichen Kontext, dass Paulus weiterhin behördlich festgehalten wird; „in Gewahrsam“ macht diesen Sinn natürlich und präzise deutlich.
- source_word: εἰς Καισάρειαν
  choice: in Cäsarea
  rationale: 'Trotz der Richtungspräposition εἰς verlangt der Zusammenhang einen Ortsbezug: Paulus befindet sich bereits in Cäsarea und wird dort festgehalten. Diese Wiedergabe folgt dem idiomatischen Sinn.'
- source_word: ἐν τάχει ἐκπορεύεσθαι
  choice: in Kürze dorthin aufbrechen
  rationale: Die Wendung bezeichnet ein baldiges Weggehen beziehungsweise Aufbrechen. „Dorthin“ erschließt aus dem Zusammenhang das Ziel Cäsarea, ohne es als ausdrücklich wiederholte Angabe im griechischen Satz auszugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die indirekte Rede wird durch den Konjunktiv I wiedergegeben; „jedoch“ bildet die fortführend-kontrastive Partikelverbindung μὲν οὖν im Kontext natürlich ab.
