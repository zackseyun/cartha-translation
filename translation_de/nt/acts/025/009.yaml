    rationale: θέλων bezeichnet Festus’ Beweggrund in einer Partizipialkonstruktion. Die Verbindung darf motivisch erkennbar sein, sollte aber nicht als eigenständige, ausdrücklich folgernde Behauptung ausgestaltet werden.
  - severity: medium
    issue: „dich ... richten lassen“ ist semantisch und idiomatisch unscharf.
    rationale: Das deutsche Reflexivgefüge kann ein freiwilliges Zulassen oder Veranlassen nahelegen. κριθῆναι ist ein gerichtlicher Passivinfinitiv; „gerichtet werden“ bildet ihn unmittelbar ab.
  - severity: low
    issue: Singular „in dieser Sache“ statt Plural.
    rationale: περὶ τούτων verweist auf mehrere vorliegende Angelegenheiten beziehungsweise Streitpunkte. Der deutsche Plural bewahrt diese Offenheit genauer.
