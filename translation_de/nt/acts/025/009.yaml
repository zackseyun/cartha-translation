revisions:
- from: 'Festus aber wollte den Juden[a] einen Gefallen tun. Deshalb wandte er sich an Paulus und fragte: „Willst du nach Jerusalem hinaufgehen und dich dort in dieser Sache vor mir richten lassen?“[b]'
  to: 'Festus aber wollte den Juden[a] einen Gefallen tun und sagte zu Paulus: „Willst du nach Jerusalem hinaufgehen und dort in diesen Angelegenheiten vor mir gerichtet werden?“[b]'
  rationale: Die Revision ersetzt die leicht überdeutlich kausale Satzverknüpfung durch eine deutsche Koordination, die Festus’ Motiv weiterhin erkennen lässt. Das gerichtliche Passiv wird ohne die im Deutschen missverständliche Konstruktion „sich richten lassen“ wiedergegeben. Zugleich wird der Plural von περὶ τούτων gewahrt; die Fußnotenanker bleiben korrekt am jeweiligen Bezugsausdruck gesetzt.
  reviewer_model: gpt-5.6-terra
