  source_fidelity: Die Vorlage gibt den Sinn im Wesentlichen wieder. Die kausale Explikation „Deshalb“ ist jedoch stärker und glatter als die griechische Partizipialkonstruktion; außerdem kann „sich ... richten lassen“ im Deutschen nahelegen, Paulus solle eine Entscheidung lediglich zulassen oder beantragen, statt den gerichtlichen Passivvorgang auszudrücken.
  naturalness: „Dich dort ... richten lassen“ klingt im modernen Standarddeutsch prozessual weniger klar als das einfache Passiv „dort ... gerichtet werden“. Die revidierte Satzfügung ist natürlich, würdig und bewahrt den Fragecharakter.
  terminology: „den Juden“ bleibt als formnahe Wiedergabe von τοῖς Ἰουδαίοις bestehen; die Kontextfußnote grenzt den narrativen Bezug angemessen ein. „In diesen Angelegenheiten“ gibt den griechischen Plural περὶ τούτων genauer wieder als der Singular „in dieser Sache“.
