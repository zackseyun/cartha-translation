source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: de
  text: 'Festus aber wollte den Juden[a] einen Gefallen tun und sagte zu Paulus: „Willst du nach Jerusalem hinaufgehen und dort in diesen Angelegenheiten vor mir gerichtet werden?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „den Juden“ sind hier im Zusammenhang die jüdischen Ankläger beziehungsweise führenden Vertreter gemeint, die das Verfahren gegen Paulus betrieben, nicht unterschiedslos alle jüdischen Menschen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „… und dort in diesen Angelegenheiten vor mir verhandelt werden?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: wollte
  rationale: Das Partizip bezeichnet Festus’ Beweggrund. Die finite Wiedergabe ist im modernen Deutschen natürlich und bewahrt den intentionalen Sinn.
- source_word: τοῖς Ἰουδαίοις
  choice: den Juden
  rationale: Dies entspricht dem griechischen Wortlaut. Der Erzählzusammenhang grenzt die Bezeichnung auf die jüdischen Ankläger beziehungsweise führenden Vertreter ein; dies wird in einer Fußnote erläutert.
- source_word: χάριν καταθέσθαι
  choice: einen Gefallen tun
  rationale: Die idiomatische Wendung bezeichnet das Erweisen einer Gunst. Die deutsche Formulierung ist natürlich und unterstellt nicht stärker als der griechische Text ein berechnendes Sich-Einschmeicheln.
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: wandte er sich an Paulus und fragte
  rationale: Die griechische narrative Redeformel wird flüssig wiedergegeben; da unmittelbar eine Frage folgt, ist „fragte“ im Deutschen präzise und natürlich.
- source_word: Θέλεις
  choice: Willst du
  rationale: Die direkte Frage nach Paulus’ Willen wird knapp und formnah wiedergegeben.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: nach Jerusalem hinaufgehen
  rationale: „Hinaufgehen“ bewahrt die übliche geografische und erzählerische Perspektive bei Reisen nach Jerusalem.
- source_word: περὶ τούτων
  choice: in dieser Sache
  rationale: Der Plural verweist zusammenfassend auf die verhandelten Streitpunkte. Die idiomatische deutsche Wendung bleibt bewusst allgemein und ergänzt nicht ausdrücklich „Anklagen“.
- source_word: κριθῆναι
  choice: dich richten lassen
  rationale: Das Passiv von κρίνω hat hier gerichtlichen Sinn. Die Formulierung wahrt die mögliche Spannweite zwischen gerichtet und vor Gericht verhandelt.
- source_word: ἐπ’ ἐμοῦ
  choice: vor mir
  rationale: Die Wendung kann Festus’ Gegenwart oder amtliche Zuständigkeit bezeichnen. „Vor mir“ bewahrt diese Offenheit, ohne ihn ausdrücklich als alleinigen Richter darzustellen.
theological_decisions:
- issue: Mögliche antijüdische Pauschalisierung von „den Juden“
  choice: Die direkte Entsprechung „den Juden“ bleibt im Haupttext erhalten und wird kontextuell erläutert.
  alternative: den jüdischen Anklägern; den jüdischen führenden Männern; den Judäern
  rationale: Der griechische Text verwendet die breitere ethnoreligiöse Bezeichnung. Eine Ersetzung im Haupttext würde den Bezug interpretierend verengen; die Fußnote verhindert zugleich, dass die Aussage auf alle jüdischen Menschen bezogen wird.
- issue: Reichweite der gerichtlichen Wendung κριθῆναι ἐπ’ ἐμοῦ
  choice: „dich … vor mir richten lassen“
  alternative: „dich … von mir richten lassen“; „deinen Fall … vor mir verhandeln lassen“
  rationale: Die gewählte Fassung bewahrt die Spannung zwischen gerichtlicher Beurteilung und Verhandlung unter Festus’ Vorsitz, ohne seine genaue prozessuale Rolle über den Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählsyntax. „Hinaufgehen“ erhält die traditionelle geografische Perspektive, während „in dieser Sache“ die im Griechischen offen bezeichneten Streitpunkte natürlich zusammenfasst.
