  text: ἐνεφάνισάν ⸀τε αὐτῷ ⸂οἱ ἀρχιερεῖς⸃ καὶ οἱ πρῶτοι τῶν Ἰουδαίων κατὰ τοῦ Παύλου, καὶ παρεκάλουν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: de
  text: Da trugen ihm die obersten Priester und die führenden Männer der Juden ihre Sache gegen Paulus vor[a] und drängten ihn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unterrichteten ihn über Paulus“ oder „brachten vor ihm Anklagen gegen Paulus vor“. Das griechische Verb kann allgemein bedeuten, eine Angelegenheit bekannt zu machen; hier hat es wahrscheinlich einen rechtlichen Beiklang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: trugen … ihre Sache … vor
  rationale: Das Verb bezeichnet das Bekanntmachen einer Angelegenheit gegenüber einer zuständigen Person und hat hier im Verfahren vor dem Statthalter einen rechtlichen Beiklang. Die Formulierung gibt diesen wieder, ohne eine förmliche Anklage zu unterstellen.
- source_word: τε
  choice: Da
  rationale: Die Partikel bindet den Satz an den vorhergehenden Erzählzusammenhang an. „Da“ stellt im Deutschen einen natürlichen narrativen Anschluss her.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen bezieht sich im Kontext auf Festus.
- source_word: οἱ ἀρχιερεῖς
  choice: die obersten Priester
  rationale: Bezeichnet die führende Jerusalemer Priesterschaft und entspricht der in einer modernen deutschen Bibelsprache verständlichen Gruppenbezeichnung.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: die führenden Männer der Juden
  rationale: πρῶτοι bezeichnet hier gesellschaftlich oder politisch herausragende Personen. „Führende Männer“ bewahrt sowohl den Statusbezug als auch die maskuline Form des griechischen Ausdrucks.
- source_word: κατὰ τοῦ Παύλου
  choice: gegen Paulus
  rationale: κατά mit Genitiv drückt hier die gegen Paulus gerichtete, anklagende Haltung aus.
- source_word: παρεκάλουν
  choice: drängten
  rationale: Das Imperfekt legt ein anhaltendes oder wiederholtes Bitten nahe. „Drängten“ passt zur nachdrücklichen Einflussnahme in diesem politisch-rechtlichen Zusammenhang.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich erneut auf Festus, den Adressaten ihres Drängens.
