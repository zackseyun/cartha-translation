  source_fidelity: 'Die Übersetzung gibt die Satzglieder und ihren Sinn zuverlässig wieder: τέ wird als narrativer Anschluss („Da“) angemessen aufgenommen; ἐνεφάνισαν erhält mit „trugen … ihre Sache … vor“ die im Kontext naheliegende rechtlich gefärbte, aber nicht auf eine formelle Anklage verengte Bedeutung. „gegen Paulus“ und „drängten ihn“ entsprechen dem adversativen κατά und dem imperfektischen παρεκάλουν. Der offene Satzschluss bewahrt die Fortsetzung in V. 3.'
