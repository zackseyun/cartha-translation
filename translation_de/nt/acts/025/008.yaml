id: ACT.25.8
reference: Acts 25:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: de
  text: 'Paulus verteidigte sich: „Ich habe mich weder gegen das Gesetz der Juden[a] noch gegen den Tempel noch gegen den Kaiser in irgendeiner Weise versündigt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe weder gegen das Gesetz der Juden noch gegen den Tempel noch gegen den Kaiser irgendein Unrecht begangen.“'
    reason: Lexikalische Alternative, die den forensischen Sinn von ἥμαρτον stärker hervorhebt.
lexical_decisions:
- source_word: τοῦ Παύλου ἀπολογουμένου
  choice: Paulus verteidigte sich
  rationale: Die Genitivus-absolute-Konstruktion beschreibt Paulus’ forensische Verteidigung. Die deutsche Formulierung ist natürlich und bewahrt den gerichtlichen Sinn von ἀπολογέομαι.
- source_word: ὅτι
  choice: durch Doppelpunkt und direkte Rede wiedergegeben
  rationale: ὅτι führt hier den Inhalt der Verteidigung ein. Im Deutschen gibt ein Doppelpunkt mit direkter Rede diese Funktion idiomatisch wieder.
- source_word: νόμον τῶν Ἰουδαίων
  choice: das Gesetz der Juden
  rationale: Die Formulierung bewahrt die Genitivkonstruktion und vermeidet eine unnötige Festlegung auf eine ausschließlich ethnische, regionale oder religiöse Nuance.
- source_word: ἱερόν
  choice: den Tempel
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise den Tempelbezirk; „Tempel“ ist im Deutschen die übliche und hinreichend genaue Wiedergabe.
- source_word: Καίσαρα
  choice: den Kaiser
  rationale: Καῖσαρ fungiert in diesem Zusammenhang als Herrschertitel. „Kaiser“ ist für heutige deutschsprachige Leser unmittelbar verständlich und bewahrt den rechtlich-politischen Bezug.
- source_word: τι
  choice: in irgendeiner Weise
  rationale: Das Indefinitpronomen verstärkt zusammen mit dem verneinten dreifachen Bezug die umfassende Zurückweisung jeder Verfehlung.
- source_word: ἥμαρτον
  choice: habe mich … versündigt
  rationale: Die Wiedergabe bewahrt die moralisch-religiöse Wortkomponente von ἁμαρτάνω, ist mit „gegen“ idiomatisch und bleibt zugleich im forensischen Zusammenhang verständlich.
- source_word: οὔτε … οὔτε … οὔτε
  choice: weder … noch … noch
  rationale: Die dreifache deutsche Korrelativkonstruktion bildet die drei gleichgeordneten Verneinungen klar und natürlich ab.
theological_decisions:
- issue: Rechtliche gegenüber moralischer Nuance von ἥμαρτον
  choice: „mich … versündigt“
  alternative: „gegen … verstoßen“ / „mich … schuldig gemacht“
  rationale: Der Kontext ist gerichtlicher Art, doch ἁμαρτάνω trägt weiterhin die Bedeutung des Sündigens beziehungsweise Sich-Verfehlens. Die gewählte Formulierung erhält diese Spannung, statt die Aussage auf einen technischen Rechtsverstoß zu reduzieren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der Satz folgt der dreifachen Struktur des Griechischen; die direkte Rede wird im Deutschen idiomatisch durch einen Doppelpunkt eingeleitet.
