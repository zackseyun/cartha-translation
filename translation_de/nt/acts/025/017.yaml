  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: de
  text: Als sie nun hier zusammengekommen waren, schob ich die Sache nicht auf, sondern nahm am nächsten Tag auf dem Richterstuhl[a] Platz und befahl, den Mann vorführen zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Gerichtstribüne“. Das griechische Wort bezeichnet den offiziellen Gerichtssitz beziehungsweise die Plattform, von der aus Gericht gehalten wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: als sie … zusammengekommen waren
  rationale: Der Aoristpartizip im Genitiv bildet einen Genitivus absolutus und bezeichnet das vorausgehende Zusammenkommen der an der Anklage Beteiligten.
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet hier die Fortführung und Folgerung innerhalb der Rede des Festus; „nun“ klingt im Deutschen natürlich und wahrt den Zusammenhang.
- source_word: ἐνθάδε
  choice: hier
  rationale: Direkte und idiomatische Wiedergabe des lokalen Adverbs.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: schob ich die Sache nicht auf
  rationale: Die Wendung bedeutet, keinen Aufschub der Verhandlung zu veranlassen. Die deutsche Formulierung ist natürlich und erhält den verwaltungsrechtlichen Sinn, ohne eine förmliche Vertagung ausdrücklich in den Text hineinzulesen.
- source_word: τῇ ἑξῆς
  choice: gleich am nächsten Tag
  rationale: Die substantivierte Wendung bezeichnet im Kontext den folgenden Tag. „Gleich“ verdeutlicht im Deutschen den ausdrücklich genannten fehlenden Aufschub, ohne einen zusätzlichen Zeitraum einzuführen.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: nahm … auf dem Richterstuhl Platz
  rationale: βῆμα bezeichnet hier den amtlichen Gerichtssitz beziehungsweise die Gerichtstribüne. Die gewählte Formulierung ist würdig, verständlich und dem gerichtlichen Kontext angemessen.
- source_word: ἐκέλευσα
  choice: befahl
  rationale: Gibt die amtliche Anordnung des Statthalters knapp und präzise wieder.
- source_word: ἀχθῆναι
  choice: vorführen zu lassen
  rationale: Das passive ἄγω bedeutet, dass der Mann zu Festus beziehungsweise vor das Gericht gebracht werden sollte. „Vorführen lassen“ ist im deutschen Gerichtskontext idiomatisch, ohne „herein“ als nicht ausdrücklich bezeichnete Richtung hinzuzufügen.
- source_word: τὸν ἄνδρα
  choice: den Mann
  rationale: Entspricht der direkten Bezeichnung des Paulus im griechischen Text und ergänzt weder „Angeklagten“ noch eine andere nur aus dem Kontext erschlossene Rolle.
