id: ACT.25.19
reference: Acts 25:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: de
  text: Vielmehr hatten sie einige Streitfragen mit ihm über ihre eigene Religion[a] und über einen gewissen Jesus, der gestorben war und von dem Paulus behauptete, er lebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihren eigenen Aberglauben«. Das griechische Wort kann neutral eine Religion bezeichnen oder aus der Sicht eines Außenstehenden abwertend gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: Streitfragen
  rationale: Das Wort bezeichnet strittige Angelegenheiten, nicht bloß neutrale Fragen; »Streitfragen« bewahrt den sachlichen und zugleich kontroversen Sinn.
- source_word: δέ
  choice: Vielmehr
  rationale: Im Zusammenhang steht ein berichtigender Gegensatz zu den erwarteten Anklagen wegen Verbrechen; »vielmehr« gibt diesen Übergang im Deutschen natürlich wieder.
- source_word: τινα
  choice: einige
  rationale: Der unbestimmte Zusatz wird in Verbindung mit dem Plural ζητήματα idiomatisch und ohne unnötige Präzisierung wiedergegeben.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: über ihre eigene Religion
  rationale: δεισιδαιμονία kann neutral »Religion« oder abwertend »Aberglaube« bedeuten. »Religion« vermeidet eine im heutigen Deutsch womöglich zu starke Abwertung; »ihre eigene« wahrt die Distanz des römischen Sprechers.
- source_word: εἶχον πρὸς αὐτόν
  choice: hatten sie ... mit ihm
  rationale: Die Formulierung beschreibt strittige Punkte zwischen den Anklägern und Paulus, ohne hier einen zusätzlichen juristischen Fachsinn einzutragen.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: und über einen gewissen Jesus
  rationale: τινος mit dem Namen zeigt die distanzierte und wenig vertraute Bezugnahme des Festus; »einen gewissen Jesus« erhält diese Perspektive.
- source_word: τεθνηκότος
  choice: der gestorben war
  rationale: Das Perfektpartizip bezeichnet den aus dem Tod hervorgegangenen Zustand; die deutsche Formulierung ist natürlich und bildet den Gegensatz zu »er lebe«.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: von dem Paulus behauptete, er lebe
  rationale: φάσκω berichtet eine Behauptung, ohne dass Festus sie sich zu eigen macht. Der Konjunktiv der indirekten Rede wahrt sowohl seine Distanz als auch die Aussage, Jesus sei lebendig.
theological_decisions:
- issue: Wiedergabe von δεισιδαιμονία in der Rede des Festus
  choice: Religion
  alternative: Aberglaube; Religionsausübung
  rationale: Der Vers gibt die Sicht eines römischen Amtsträgers auf den jüdischen Glauben wieder. »Religion« vermeidet eine stärkere moderne Herabsetzung, als der griechische Ausdruck zwingend verlangt; seine mögliche abwertende Färbung wird in der Fußnote offengelegt.
- issue: Formulierung der Auferstehungsaussage
  choice: von dem Paulus behauptete, er lebe
  alternative: von dem Paulus sagte, er sei am Leben
  rationale: Hier berichtet Festus über die Aussage des Paulus; der Erzähler bestätigt sie in diesem Satzteil nicht unmittelbar. »behauptete« spiegelt φάσκω und die Außenperspektive, ohne die andernorts bezeugte Auferstehung zu verneinen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Streitfragen« und »ein gewisser Jesus« bewahren den leicht formellen Ton und die distanzierte Perspektive des Festus; der Konjunktiv »er lebe« kennzeichnet natürliche indirekte Rede.
