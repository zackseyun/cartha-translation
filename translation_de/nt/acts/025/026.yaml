  terminology: „Herr“ ist hier als nichttheologischer Herrschertitel korrekt kleinzuschreiben; die Erklärung „der Kaiser“ in der Fußnote ist sachgerecht. „Untersuchung“ ist für ἀνάκρισις im rechtlich-administrativen Kontext passend. „König Agrippa“ und die amtliche Ausdrucksweise sind angemessen.
