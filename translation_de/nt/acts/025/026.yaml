  variant: modern standard German
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: de
  text: Über ihn habe ich meinem Herrn[a] nichts Bestimmtes zu schreiben. Deshalb habe ich ihn vor euch allen und besonders vor dir, König Agrippa, vorgeführt, damit ich nach der Untersuchung etwas habe, was ich schreiben kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Kaiser. Der griechische Text lautet wörtlich „meinem Herrn“ und verwendet κύριος als Herrschertitel im kaiserlichen Kontext.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: nichts Bestimmtes
  rationale: ἀσφαλές bezeichnet etwas Sicheres, Verlässliches oder Bestimmtes. Im amtlich-rechtlichen Zusammenhang fehlt Festus eine konkrete, belastbare Angabe für seinen Bericht.
- source_word: τῷ κυρίῳ
  choice: meinem Herrn
  rationale: κύριος wird lexikalisch als „Herr“ bewahrt; im vorliegenden imperialen Kontext ist damit der Kaiser gemeint.
- source_word: προήγαγον αὐτὸν
  choice: habe ich ihn … vorgeführt
  rationale: Das Verb bezeichnet hier das Vorführen beziehungsweise Präsentieren einer Person vor einer versammelten Gruppe.
- source_word: ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ
  choice: euch allen und besonders dir
  rationale: Die Übersetzung erhält den Wechsel vom pluralischen Publikum zur besonderen Anrede Agrippas im Singular.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: nach erfolgter Untersuchung
  rationale: ἀνάκρισις bezeichnet eine rechtliche Untersuchung, Anhörung oder Befragung; der Genitivus absolutus wird natürlich temporal wiedergegeben.
- source_word: σχῶ τί γράψω
  choice: etwas zu schreiben habe
  rationale: Die deutsche Formulierung gibt die idiomatische Verbindung von „haben“ und dem Inhalt dessen, was geschrieben werden soll, knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in einem nichttheologischen imperialen Kontext
  choice: meinem Herrn
  alternative: dem Kaiser
  rationale: „Meinem Herrn“ bewahrt die Ausdrucksform des griechischen Textes, ohne κύριος hier als Gottes- oder Christustitel zu verstehen. Eine Fußnote benennt den gemeinten römischen Kaiser ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit amtlich-rechtlichem Klang. Die Satzstruktur bleibt gut verständlich; der Gegensatz zwischen der gesamten Versammlung und Agrippa wird ausdrücklich erhalten.
