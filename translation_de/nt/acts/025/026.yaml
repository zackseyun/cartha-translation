    rationale: σχῶ τί γράψω bedeutet, dass Festus nach der Untersuchung etwas haben möge, das er schreiben kann. Die vorgeschlagene Formulierung drückt diesen Zweck klarer aus und vermeidet die mögliche Lesart einer bloßen Schreibverpflichtung.
