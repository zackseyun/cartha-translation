base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: de
  text: Darum sollen diejenigen unter euch, die dazu in der Lage sind,[a] mit mir hinabgehen und ihn anklagen, falls sich bei diesem Mann etwas Unrechtes findet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die einflussreichen Männer unter euch“, „eure führenden Männer“ oder „die unter euch Vollmacht haben“. Das griechische Wort kann mächtig, angesehen oder zu etwas fähig bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „falls bei dem Mann etwas Unrechtes ist“. Die Wendung bezeichnet nicht ausdrücklich eine von ihm begangene Tat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Darum sollen diejenigen ...
  rationale: οὖν führt die Folgerung beziehungsweise Fortsetzung ein; „Darum“ gibt dies in natürlichem Deutsch wieder. Der substantivierte Ausdruck wird im ganzen Satz idiomatisch abgebildet.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: diejenigen unter euch, die dazu in der Lage sind
  rationale: δυνατοί kann mächtig, einflussreich oder fähig bedeuten. Die Hauptfassung bewahrt die im Kontext echte Mehrdeutigkeit möglichst weit und bezeichnet diejenigen, die Festus begleiten und als Ankläger auftreten können; mögliche soziale oder amtliche Konnotationen stehen in der Fußnote.
- source_word: φησίν
  choice: nicht eigens wiedergegeben
  rationale: Das eingeschobene „sagt er“ kennzeichnet die Redezuweisung. Da der Vers bereits Teil der wiedergegebenen Rede des Festus ist, wäre eine ausdrückliche Wiedergabe im Deutschen schwerfällig und sachlich unnötig.
- source_word: συγκαταβάντες
  choice: mit mir hinabgehen
  rationale: Das Partizip bezeichnet das gemeinsame Hinabgehen. „Mit mir“ gibt die σύν-Komponente wieder; „hinabgehen“ bewahrt die konventionelle geografische Ausdrucksweise für den Weg von Jerusalem nach Cäsarea.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: falls dieser Mann etwas Unrechtes getan hat
  rationale: ἄτοπον bezeichnet etwas Ungehöriges, Verkehrtes oder Unrechtes, ohne zwingend ein bestimmtes Verbrechen zu benennen. Die idiomatische deutsche Formulierung wahrt den konditionalen Vorbehalt, ohne Schuld vorauszusetzen.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: sollen ... ihn anklagen
  rationale: κατηγορέω bedeutet in diesem Rechtskontext „anklagen“ beziehungsweise „Beschuldigungen vorbringen“. Der griechische Imperativ der dritten Person wird natürlich mit „sollen“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die juristische Situation bleibt deutlich, doch ἄτοπον wird nicht vorschnell als konkretes Verbrechen präzisiert. Die Mehrdeutigkeit von δυνατοί wird in der Hauptfassung offengehalten und in der Fußnote erläutert.
