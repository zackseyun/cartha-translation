id: ACT.25.27
reference: Acts 25:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: de
  text: Denn es scheint mir unvernünftig, einen Gefangenen zu schicken, ohne auch die gegen ihn erhobenen Anklagepunkte anzugeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »genau zu benennen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: unvernünftig
  rationale: Das Wort bezeichnet hier etwas, das der Vernunft oder sachgerechtem Vorgehen widerspricht. »Unvernünftig« gibt das administrative Urteil des Festus natürlich wieder, ohne es mit »absurd« unnötig zu verschärfen.
- source_word: δοκεῖ μοι
  choice: es scheint mir
  rationale: Die unpersönliche griechische Wendung und ihr persönlich-abwägender Ton bleiben so erhalten.
- source_word: πέμποντα
  choice: zu schicken
  rationale: Der participiale Ausdruck bezeichnet die Begleitumstände des Handelns. Im Deutschen verbindet der Infinitiv die Handlung idiomatisch mit dem Urteil »unvernünftig«.
- source_word: δέσμιον
  choice: einen Gefangenen
  rationale: Dies ist im rechtlichen Zusammenhang die klare und übliche Bezeichnung für eine Person in Gewahrsam.
- source_word: μὴ καὶ
  choice: ohne auch
  rationale: Diese Formulierung gibt sowohl die Verneinung als auch die hinzufügende Kraft von καί in natürlichem Deutsch wieder.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: die gegen ihn erhobenen Anklagepunkte
  rationale: Im gerichtlichen Kontext bezeichnet αἰτία die gegen jemanden vorgebrachten Anklagegründe. Der Plural wird durch »Anklagepunkte« präzise und idiomatisch wiedergegeben.
- source_word: σημᾶναι
  choice: anzugeben
  rationale: σημαίνω bedeutet hier, die Anklagepunkte mitzuteilen oder kenntlich zu machen. »Anzugeben« passt zum formellen Verwaltungskontext, ohne ausdrücklich eine erschöpfende Auflistung vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sachlich-rechtlichem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch »ohne auch« idiomatisch gestaltet.
