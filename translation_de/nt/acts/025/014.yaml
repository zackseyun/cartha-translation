revisions:
- from: 'Als sie mehrere Tage dort verbracht hatten, legte Festus dem König die Angelegenheit des Paulus dar und sagte: »Da ist ein Mann, den Felix als Gefangenen zurückgelassen hat.«'
  to: 'Während sie sich dort mehrere Tage aufhielten, trug Festus dem König die Angelegenheit des Paulus vor und sagte: »Ein Mann ist von Felix als Gefangener zurückgelassen worden.«'
  rationale: Die Revision stellt den durativen Hintergrund des Imperfekts διέτριβον durch „Während ... sich aufhielten“ wieder her und gibt καταλελειμμένος als Perfektpassiv wieder. Sie behält die offene, sachliche Bezeichnung „Angelegenheit des Paulus“ bei und ergänzt keine über den griechischen Text hinausgehende juristische oder theologische Deutung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:43:33Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung wird zutreffend wiedergegeben. Das griechische Imperfekt διέτριβον bildet jedoch den zeitlichen Hintergrund („während sie ... blieben“) und nicht eine vor Festus’ Handlung abgeschlossene Vorzeitigkeit. Außerdem ist καταλελειμμένος ein Perfektpassiv; eine passive deutsche Form wahrt den fortdauernden Zustand genauer.
  naturalness: Der Entwurf ist gut verständliches modernes Standarddeutsch. „Während sie sich dort mehrere Tage aufhielten“ bildet den Erzählzusammenhang idiomatischer und präziser als „Als sie ... verbracht hatten“.
  terminology: „dem König“, „die Angelegenheit des Paulus“ und „als Gefangener“ sind angemessen. „Angelegenheit“ lässt die griechische, nicht ausschließlich juristisch festgelegte Wendung τὰ κατὰ τὸν Παῦλον offen.
  issues:
  - severity: medium
    issue: Zeitliches Verhältnis bei διέτριβον
    rationale: „Als sie mehrere Tage dort verbracht hatten“ versteht das imperfektische Verweilen als abgeschlossene Vorzeitigkeit. Der griechische Satz stellt Festus’ Mitteilung während des mehrtägigen Aufenthalts dar.
  - severity: low
    issue: Diathese und Aspekt bei καταλελειμμένος
    rationale: „den Felix ... zurückgelassen hat“ ist verständlich, gibt aber das griechische Perfektpassiv weniger unmittelbar wieder. „ist von Felix ... zurückgelassen worden“ bewahrt Passiv und resultierenden Zustand.
  revised_text: 'Während sie sich dort mehrere Tage aufhielten, trug Festus dem König die Angelegenheit des Paulus vor und sagte: »Ein Mann ist von Felix als Gefangener zurückgelassen worden.«'
