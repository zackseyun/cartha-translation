  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: de
  text: 'Während sie sich dort mehrere Tage aufhielten, trug Festus dem König die Angelegenheit des Paulus vor und sagte: »Ein Mann ist von Felix als Gefangener zurückgelassen worden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: mehrere Tage
  rationale: Der Komparativ πλείους bezeichnet in dieser Zeitangabe idiomatisch eine nicht geringe, aber unbestimmte Zahl von Tagen. „Mehrere Tage“ ist im Deutschen natürlich und vermeidet einen unpassenden strikten Vergleich.
- source_word: διέτριβον
  choice: verbracht hatten
  rationale: διατρίβω bezeichnet hier das Verweilen beziehungsweise Zubringen von Zeit an einem Ort. Zusammen mit „mehrere Tage“ ergibt „dort verbracht hatten“ eine natürliche deutsche Formulierung.
- source_word: ἀνέθετο
  choice: legte … dar
  rationale: Das Medium ἀνατίθεμαι meint, jemandem eine Sache zur Erwägung vorzulegen oder darzustellen. „legte … dar“ bewahrt mehr als eine bloße Mitteilung.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: die Angelegenheit des Paulus
  rationale: Die Wendung bezeichnet die Paulus betreffenden Umstände, hier insbesondere seine Rechtssache. Der Singular „Angelegenheit“ ist idiomatisch, ohne den griechischen Ausdruck stärker als nötig juristisch festzulegen.
- source_word: Ἀνήρ τίς ἐστιν
  choice: Da ist ein Mann
  rationale: τίς führt eine bestimmte, zunächst nicht näher benannte Person ein. „Da ist ein Mann“ gibt dies in natürlicher direkter Rede wieder; „ein gewisser Mann“ klänge im heutigen Deutsch unnötig distanziert.
- source_word: καταλελειμμένος
  choice: zurückgelassen hat
  rationale: 'Das Perfektpartizip beschreibt eine zurückliegende Handlung mit fortdauerndem Ergebnis: Felix ließ den Mann zurück, und er befindet sich weiterhin dort.'
- source_word: δέσμιος
  choice: als Gefangenen
  rationale: δέσμιος bezeichnet einen Gefangenen. Die prädikative Fügung „als Gefangenen zurückgelassen“ macht seinen fortbestehenden Status klar.
- source_word: βασιλεῖ
  choice: dem König
  rationale: Der griechische Text nennt hier nur den Titel; die Identität Agrippas ergibt sich aus dem Kontext.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die juristische Färbung des Zusammenhangs bleibt in „Angelegenheit“ erkennbar, wird aber nicht durch das enger festlegende Wort „Rechtsfall“ überbestimmt.
