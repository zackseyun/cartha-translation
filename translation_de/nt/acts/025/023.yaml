    issue: „angesehensten Männern“ enthält einen Superlativ.
    rationale: Das griechische κατ’ ἐξοχήν kennzeichnet die Männer als hervorragend oder angesehen, verlangt aber nicht die Bedeutung „die angesehensten“. Der Superlativ engt bzw. verstärkt die Aussage unnötig ein.
  - severity: low
    issue: „Audienzsaal“ kann den Handlungsort missverständlich kennzeichnen.
    rationale: ἀκροατήριον ist ein Ort des Anhörens bzw. einer öffentlichen amtlichen Verhandlung. „Verhandlungssaal“ trifft diesen Kontext im modernen Deutschen unmittelbarer.
