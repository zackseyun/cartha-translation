source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: de
  text: Am folgenden Tag kamen nun Agrippa und Berenike mit großem Prunk[a] und betraten zusammen mit den Militärtribunen und den angesehenen Männern der Stadt[b] den Verhandlungssaal. Auf Befehl des Festus wurde Paulus hereingeführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großem Gepränge“ oder „mit großer Prachtentfaltung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den führenden Männern der Stadt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Am folgenden Tag ... nun
  rationale: Die temporale Dativfügung bezeichnet den folgenden Tag; „nun“ gibt οὖν als erzählerischen Übergang natürlich wieder.
- source_word: ἐλθόντος
  choice: kamen
  rationale: Das Aoristpartizip im Genitivus absolutus wird im Deutschen idiomatisch als finites Verb wiedergegeben.
- source_word: Ἀγρίππα ... Βερνίκης
  choice: Agrippa und Berenike
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Namensformen.
- source_word: μετὰ πολλῆς φαντασίας
  choice: mit großem Prunk
  rationale: φαντασία bezeichnet hier eine eindrucksvolle, demonstrative öffentliche Prachtentfaltung; „Prunk“ ist prägnant und wahrt den leicht ostentativen Ton.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: betraten ... den Audienzsaal
  rationale: ἀκροατήριον bezeichnet einen Saal für eine offizielle Anhörung; „Audienzsaal“ ist verständlich und passt zum öffentlichen, amtlichen Rahmen.
- source_word: σύν τε χιλιάρχοις
  choice: zusammen mit den Militärtribunen
  rationale: χιλίαρχοι sind im römischen Kontext hochrangige Militärbefehlshaber; „Militärtribunen“ ist historisch präzise. τε koordiniert diese Gruppe mit der folgenden, ohne im Deutschen ein ausdrückliches „sowohl“ zu verlangen.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: den angesehensten Männern der Stadt
  rationale: κατ’ ἐξοχήν kennzeichnet Personen von besonderem Rang oder Ansehen; die maskuline Referenz des griechischen Textes bleibt erhalten.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: Auf Befehl des Festus
  rationale: Der zweite Genitivus absolutus wird als knappe deutsche Präpositionalfügung wiedergegeben und bewahrt den amtlichen Autoritätscharakter von κελεύω.
- source_word: ἤχθη ὁ Παῦλος
  choice: wurde Paulus hereingeführt
  rationale: Das Passiv von ἄγω zeigt, dass Paulus von anderen in den Saal geführt wurde; „hereingeführt“ ist für die Szene natürlich.
