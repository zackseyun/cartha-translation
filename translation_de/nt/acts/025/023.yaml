revisions:
- from: Am folgenden Tag kamen nun Agrippa und Berenike mit großem Prunk[a] und betraten zusammen mit den Militärtribunen und den angesehensten Männern der Stadt[b] den Audienzsaal. Auf Befehl des Festus wurde Paulus hereingeführt.
  to: Am folgenden Tag kamen nun Agrippa und Berenike mit großem Prunk[a] und betraten zusammen mit den Militärtribunen und den angesehenen Männern der Stadt[b] den Verhandlungssaal. Auf Befehl des Festus wurde Paulus hereingeführt.
  rationale: Der unbegründete Superlativ wurde zu „angesehenen“ abgeschwächt, damit die Rangbezeichnung des griechischen Textes ohne zusätzliche Exklusivität wiedergegeben wird. Ferner wurde „Audienzsaal“ durch „Verhandlungssaal“ ersetzt, um den Charakter des ἀκροατήριον als Ort einer amtlichen Anhörung klarer zu treffen. Die Fußnotenanker bleiben an den jeweiligen lexikalischen Entscheidungen erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:43:40Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die zeitliche Einordnung, das Eintreffen Agrippas und Berenikes, die demonstrative Pracht, das gemeinsame Betreten des Saals, die beiden begleitenden Gruppen sowie den Befehl des Festus und das passive Hereinführen des Paulus zutreffend wieder. „Angesehensten“ ist jedoch ein nicht im griechischen Text angelegter Superlativ; κατ’ ἐξοχήν bezeichnet ausgezeichnete bzw. angesehene Männer, ohne notwendig eine exklusive Spitzengruppe („die angesehensten“) zu meinen.
  naturalness: Der Satzbau ist für modernes Standarddeutsch klar und die Aufteilung in zwei Sätze ist problemlos. „Verhandlungssaal“ ist in diesem amtlichen Anhörungskontext idiomatischer und präziser als „Audienzsaal“, das im Deutschen eher eine formelle Audienz bei einem Herrscher bezeichnet.
  terminology: Die Namensformen Agrippa, Berenike, Festus und Paulus sind im Deutschen etabliert. „Militärtribunen“ ist für χιλίαρχοι im römischen Kontext sachgerecht. „Prunk“ vermittelt die öffentliche, ostentative Pracht von φαντασία angemessen.
  issues:
