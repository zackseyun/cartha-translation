  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: de
  text: 'Paulus aber sagte: »Ich stehe vor dem Gericht des Kaisers; hier muss über mich gerichtet werden. Den Juden habe ich kein Unrecht getan, wie auch du selbst sehr wohl weißt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βῆμα
  choice: Gericht
  rationale: Das Wort bezeichnet hier den amtlichen Richterstuhl und damit das kaiserliche Gericht. »Gericht« gibt die rechtliche Institution im heutigen Deutsch natürlich wieder.
- source_word: Καίσαρος
  choice: des Kaisers
  rationale: Καῖσαρ ist hier der römische Herrschertitel. »Des Kaisers« ist im Deutschen klarer und idiomatischer als eine bloße Übernahme von »Caesar«.
- source_word: ἑστώς εἰμι
  choice: ich stehe
  rationale: Die Umschreibung aus perfektem Partizip und εἰμί betont den gegenwärtigen rechtlichen Stand des Paulus. »Ich stehe vor« bewahrt zugleich das Bild und die juristische Bedeutung.
- source_word: οὗ
  choice: hier
  rationale: Das Relativadverb verweist auf das kaiserliche Gericht als zuständige Instanz. »Hier« schließt im Deutschen natürlich an den vorangehenden Satz an.
- source_word: δεῖ
  choice: muss
  rationale: δεῖ bezeichnet eine sachliche oder rechtliche Notwendigkeit. »Muss« bringt den Anspruch auf die zuständige Gerichtsbarkeit knapp und deutlich zum Ausdruck.
- source_word: κρίνεσθαι
  choice: über mich gerichtet werden
  rationale: Der passive Infinitiv steht in einem gerichtlichen Zusammenhang. Die Formulierung bleibt nah am griechischen Verb und ist im Deutschen verständlich.
- source_word: Ἰουδαίους
  choice: den Juden
  rationale: Der Ausdruck bezeichnet hier diejenigen, denen Paulus den Anklagen zufolge Unrecht getan haben soll. Die direkte Wiedergabe vermeidet eine unbelegte Verengung auf Behörden oder Bewohner Judäas.
- source_word: οὐδὲν ἠδίκησα
  choice: habe ich kein Unrecht getan
  rationale: ἀδικέω umfasst Unrecht tun, schädigen oder sich vergehen. »Kein Unrecht getan« bewahrt die moralische und rechtliche Weite der Aussage.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: wie auch du selbst sehr wohl weißt
  rationale: καὶ σὺ hebt Festus hervor, während κάλλιον mit ἐπιγινώσκεις ein besonders sicheres oder genaues Wissen ausdrückt. »Sehr wohl weißt« gibt diese pragmatische Kraft idiomatisch wieder, ohne den Komparativ unnatürlich wörtlich abzubilden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Sprache bleibt klar und allgemein verständlich; die Satzstellung hebt wie im Griechischen den gegenwärtigen Stand des Paulus vor dem kaiserlichen Gericht hervor.
