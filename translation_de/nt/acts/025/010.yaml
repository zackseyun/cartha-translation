  source_fidelity: 'Der Entwurf gibt die juristische Aussage des griechischen Textes treffend wieder: Paulus befindet sich vor dem kaiserlichen Gericht, das der angemessene Ort für seine Beurteilung ist; er bestreitet, den Juden Unrecht getan zu haben. „Hier“ ist als idiomatische Aufnahme von οὗ („wo“) vertretbar, und „muss“ vermittelt die in δεῖ ausgedrückte rechtlich-sachliche Notwendigkeit angemessen.'
  naturalness: Modernes, klares und würdiges Standarddeutsch. Die Formulierungen „vor dem Gericht des Kaisers“, „über mich gerichtet werden“ und „sehr wohl weißt“ sind im Kontext natürlich und verständlich.
  terminology: „Gericht des Kaisers“ gibt βῆμα Καίσαρος als kaiserliches Tribunal sachgerecht wieder. „Den Juden“ folgt dem griechischen Ἰουδαίους ohne unbegründete Einschränkung auf bestimmte Gruppen. Die rechtliche und moralische Weite von οὐδὲν ἠδίκησα bleibt in „kein Unrecht getan“ erhalten.
