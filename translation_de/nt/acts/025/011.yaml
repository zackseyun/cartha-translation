source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: de
  text: Wenn ich also Unrecht tue und etwas begangen habe, das den Tod verdient, weigere ich mich nicht zu sterben. Wenn aber keine der Anschuldigungen zutrifft, die diese Männer gegen mich erheben, kann mich niemand ihnen als Gefälligkeit ausliefern.[a] Ich berufe mich auf den Kaiser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kann mich niemand ihnen aus Gefälligkeit preisgeben.“ Das griechische Verb verbindet das Ausliefern mit dem Gedanken, jemandem einen Gefallen zu tun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: Unrecht tue
  rationale: Das Präsens wird als gegenwärtiger Zustand bzw. fortdauernd relevante Handlung wiedergegeben; die Formulierung wahrt zugleich den moralischen und rechtlichen Sinn.
- source_word: ἄξιον θανάτου
  choice: das den Tod verdient
  rationale: Die Wendung bezeichnet etwas, das die Todesstrafe rechtfertigt, ohne die Aussage auf eine rein technische Rechtsformel zu verengen.
- source_word: πέπραχά τι
  choice: etwas begangen habe
  rationale: Das Perfekt bezeichnet eine abgeschlossene Tat mit gegenwärtiger Relevanz; „begangen“ passt natürlich in den rechtlichen Zusammenhang.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: weigere ich mich nicht zu sterben
  rationale: παραιτέομαι bedeutet hier ablehnen oder sich weigern; die Wiedergabe bewahrt Paulus’ bedingte Bereitschaft, ein rechtmäßiges Todesurteil anzunehmen.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: an den Anschuldigungen dieser Männer gegen mich nichts dran ist
  rationale: Die idiomatische Wendung drückt aus, dass die Anklagen keine Substanz haben, ohne ausdrücklich „wahr“ in den Text einzufügen.
- source_word: χαρίσασθαι
  choice: ihnen zuliebe ausliefern
  rationale: Das Verb verbindet das Übergeben mit dem Gedanken einer Gefälligkeit; im gerichtlichen Kontext geht es darum, Paulus seinen Anklägern als Zugeständnis preiszugeben.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Ich berufe mich auf den Kaiser
  rationale: Die Formulierung bezeichnet den technischen Rechtsakt der Berufung an den römischen Kaiser und ist im Deutschen juristisch und verständlich.
- source_word: μὲν οὖν ... δὲ
  choice: Wenn ich nun ... Wenn aber
  rationale: Die Partikeln gliedern zwei gegensätzliche Bedingungen; diese deutsche Struktur gibt Argumentationsgang und Kontrast natürlich wieder.
theological_decisions:
- issue: Rechtliche Bedeutung von Paulus’ Aussage über Tod und Berufung
  choice: Paulus erkennt unter der ausdrücklich gesetzten Bedingung tatsächlicher Schuld die Todesfolge an, bestreitet aber jedes Recht, ihn bei haltlosen Anschuldigungen seinen Gegnern als Gefälligkeit auszuliefern.
  alternative: Die Aussage könnte als rein rhetorisch verstanden werden, ohne irgendeine Anerkennung der Rechtmäßigkeit eines Todesurteils.
  rationale: Der griechische Text formuliert eine echte Bedingung und anschließend einen kontrastierenden Rechtsanspruch. Die Übersetzung wahrt diese Spannung, ohne daraus eine allgemeine Lehre über die Todesstrafe abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer juristischer Färbung. „Nichts dran ist“ ist bewusst allgemeinverständlich und idiomatisch; „ihnen zuliebe ausliefern“ bewahrt sowohl den Vorgang der Übergabe als auch den Gefälligkeitsaspekt.
