  naturalness: Der Entwurf ist überwiegend natürliches modernes Standarddeutsch. „Nichts dran ist“ ist verständlich, wirkt gegenüber dem sonst würdigen juristischen Register aber etwas umgangssprachlich. Die revidierte Formulierung ist präziser und registergerechter.
  terminology: „Unrecht tue“, „den Tod verdient“, „begangen habe“, „ausliefern“ und „Ich berufe mich auf den Kaiser“ sind angemessen. „Als Gefälligkeit“ bewahrt bei χαρίσασθαι den entscheidenden Konzessions- bzw. Gefälligkeitsaspekt.
