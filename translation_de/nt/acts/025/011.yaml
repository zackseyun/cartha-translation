    rationale: Die Wendung ist idiomatisch, aber leicht umgangssprachlich. Eine Formulierung mit „zutreffen“ passt besser zum gerichtlichen Kontext und bildet die Behauptung, die Anklagepunkte hätten keinen Bestand, klar ab.
