  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: de
  text: Als Festus nun in die Provinz gekommen war[a], zog er drei Tage später von Cäsarea nach Jerusalem hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nachdem Festus die Provinz betreten hatte«; dem Zusammenhang nach möglicherweise: »nachdem er die Verwaltung der Provinz übernommen hatte«. Das griechische Partizip bezeichnet sein Eintreffen in der Provinz und kann im Kontext zugleich den Beginn seiner Amtsführung andeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φῆστος
  choice: Festus
  rationale: Der Personenname wird nach üblicher deutscher Konvention wiedergegeben.
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet den Fortgang der Erzählung und knüpft natürlich an den vorherigen Zusammenhang an.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: nachdem … sein Amt in der Provinz angetreten hatte
  rationale: Die Wendung bezeichnet Festus’ Eintreffen in seinem Amtsbereich und kann zugleich den Beginn seiner dortigen Amtsführung einschließen. Die Übersetzung macht den administrativen Kontext verständlich, ohne die örtliche Bedeutung ganz aufzugeben.
- source_word: ἐπαρχείᾳ
  choice: Provinz
  rationale: Bezeichnet hier den römischen Verwaltungsbezirk.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: drei Tage später
  rationale: Gibt die zeitliche Abfolge von μετά mit Akkusativ natürlich und präzise wieder.
- source_word: ἀνέβη
  choice: zog … hinauf
  rationale: Bewahrt die herkömmliche geografische Ausdrucksweise für eine Reise nach Jerusalem und klingt im Deutschen natürlich.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: Natürliche deutsche Richtungsangabe für das Reiseziel.
- source_word: ἀπὸ Καισαρείας
  choice: von Cäsarea
  rationale: Gibt den Ausgangspunkt der Reise präzise wieder.
