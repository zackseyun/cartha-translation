source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: de
  text: 'Und Festus sagt: „König Agrippa und alle Männer, die mit uns hier anwesend sind: Ihr seht diesen Mann. Wegen dieses Mannes hat sich die ganze Menge der Juden[a] sowohl in Jerusalem als auch hier an mich gewandt; sie schrien, er dürfe nicht länger leben[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gesamte Menge der Juden“. Der griechische Ausdruck ist eine kollektive Bezeichnung und gibt Festus’ Zusammenfassung des Widerstands wieder; er muss nicht ausnahmslos jeden einzelnen Juden meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „er solle nicht mehr am Leben bleiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: sagt
  rationale: Das historische Präsens des griechischen Erzählstils bleibt erhalten und verleiht der Szene Unmittelbarkeit; auch im Deutschen ist es hier gut verständlich.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: alle Männer, die mit uns hier anwesend sind
  rationale: Die Wiedergabe bezeichnet die gemeinsam anwesenden männlichen Teilnehmer der förmlichen Versammlung und bleibt im modernen Deutschen natürlich.
- source_word: θεωρεῖτε τοῦτον
  choice: Ihr seht diesen Mann
  rationale: Festus lenkt die Aufmerksamkeit der Versammlung auf Paulus; „seht“ gibt das Präsens anschaulich und ohne altertümliches „siehe“ wieder.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: die ganze Menge der Juden
  rationale: πλῆθος ist eine kollektive Bezeichnung für eine Menge beziehungsweise größere Gruppe. Die Formulierung bewahrt Festus’ rhetorische Zusammenfassung, ohne den Ausdruck eigenmächtig auf die jüdischen Führer einzuengen.
- source_word: ἐνέτυχόν μοι
  choice: ist … bei mir vorstellig geworden
  rationale: Die Wendung bezeichnet hier das förmliche Herantreten mit einem Anliegen und passt zum rechtlich-administrativen Rahmen.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: sowohl in Jerusalem als auch hier
  rationale: Die korrelative griechische Konstruktion wird unmittelbar und idiomatisch wiedergegeben; „hier“ bezeichnet Cäsarea.
- source_word: βοῶντες
  choice: Sie schrien
  rationale: Das Verb bezeichnet lautes, nachdrückliches Rufen. Ein eigener deutscher Satz macht den Bezug auf die zuvor genannte Menge klar.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: er dürfe nicht länger leben
  rationale: Der abhängige Konjunktiv gibt die von der Menge erhobene Forderung wieder, ohne daraus eine technisch formulierte Todesstrafe zu machen.
theological_decisions:
- issue: Die feindselige Bezeichnung „die Juden“ im gerichtlichen Zusammenhang
  choice: Die ausdrückliche ethnisch-politische Gruppenbezeichnung des griechischen Textes bleibt als „der Juden“ erhalten; πλῆθος wird kollektiv als „Menge“ wiedergegeben und durch eine Fußnote erläutert.
  alternative: jüdische Führer; alle Juden; die jüdische Volksmenge
  rationale: Der Ausgangstext nennt ausdrücklich τῶν Ἰουδαίων und erlaubt keine lautlose Einschränkung auf die Führungsschicht. Zugleich ist die Aussage eine rhetorische Zusammenfassung des Festus und muss nicht ausnahmslos jeden einzelnen Juden meinen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit förmlichem Ton für die öffentliche Ansprache. Das historische Präsens wurde bewahrt. Die rechtliche Färbung von ἐντυγχάνω erscheint in „bei mir vorstellig geworden“, während das heftige βοῶντες bewusst mit „schrien“ wiedergegeben wird.
