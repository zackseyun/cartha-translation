source:
  edition: SBLGNT
  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: de
  text: Ihnen antwortete ich, es sei bei den Römern nicht üblich, einen Menschen aus Gefälligkeit auszuliefern[a], bevor der Beschuldigte seinen Anklägern von Angesicht zu Angesicht gegenüberstehe und Gelegenheit erhalte, sich gegen die Anklage zu verteidigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Menschen als Gefälligkeit preiszugeben“; das griechische Verb kann bedeuten, jemanden als Gefälligkeit beziehungsweise zur Erfüllung eines Gesuchs preiszugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: üblich
  rationale: Das Prädikat „es ist … üblich“ gibt den etablierten römischen Rechtsbrauch natürlich und präzise wieder.
- source_word: Ῥωμαίοις
  choice: bei den Römern
  rationale: Der Dativ bezeichnet die Römer als Träger dieses Rechtsbrauchs; „bei den Römern“ ist im Deutschen idiomatisch und vermeidet die engere Deutung „römische Behörden“.
- source_word: χαρίζεσθαί
  choice: aus Gefälligkeit auszuliefern
  rationale: χαρίζομαι verbindet hier die Übergabe einer Person mit dem Gedanken, damit einem Gesuch zu entsprechen. Die Formulierung bewahrt sowohl den justiziellen als auch den Gefälligkeitsaspekt.
- source_word: τινα ἄνθρωπον
  choice: einen Menschen
  rationale: Die indefinite Wendung meint in diesem Rechtssatz einen beliebigen Menschen. „Einen Menschen“ wahrt das ausdrücklich vorhandene ἄνθρωπον und funktioniert generisch.
- source_word: ὁ κατηγορούμενος
  choice: der Beschuldigte
  rationale: Das substantivierte Partizip bezeichnet die Person, gegen die eine Anschuldigung erhoben wird; „Beschuldigter“ ist verständlich und rechtssprachlich passend.
- source_word: κατὰ πρόσωπον
  choice: von Angesicht zu Angesicht
  rationale: Die feste Wendung bewahrt das Bild unmittelbarer persönlicher Gegenüberstellung und passt zum förmlichen Register.
- source_word: τόπον ... ἀπολογίας λάβοι
  choice: Gelegenheit erhalten habe, sich … zu verteidigen
  rationale: τόπος bezeichnet hier keine räumliche Stelle, sondern Gelegenheit oder Spielraum; die verbale Wiedergabe von ἀπολογία klingt im modernen Deutschen natürlich.
- source_word: περὶ τοῦ ἐγκλήματος
  choice: gegen die Anklage
  rationale: ἔγκλημα bezeichnet den erhobenen rechtlichen Vorwurf. Im Deutschen ist „sich gegen die Anklage verteidigen“ idiomatischer als eine wörtliche Wiedergabe mit „hinsichtlich“.
