source:
  edition: SBLGNT
  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: de
  text: Als seine Ankläger auftraten, brachten sie gegen ihn keine Anklage wegen der bösen Taten vor, die ich vermutet hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »keine Anklage wegen der unrechten Dinge, die ich vermutet hatte«. Das griechische Wort bezeichnet allgemein böse oder unrechte Dinge beziehungsweise Taten; im Rechtskontext kann es sich auf behauptetes Fehlverhalten beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: gegen ihn
  rationale: Im Zusammenhang mit einer erhobenen Anklage gibt „gegen ihn“ den Bezug auf Paulus im natürlichen deutschen Rechtsgebrauch wieder.
- source_word: σταθέντες
  choice: als … auftraten
  rationale: Das temporale Aoristpartizip bezeichnet hier das Auftreten der Ankläger zur Darlegung ihres Falls; „auftraten“ ist im Deutschen idiomatischer als ein wörtliches „sich hinstellten“.
- source_word: οἱ κατήγοροι
  choice: seine Ankläger
  rationale: κατήγοροι bezeichnet die Personen, die in einem Rechtsverfahren Anschuldigungen vorbringen.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: brachten … keine Anklage … vor
  rationale: Die forensische Wendung bedeutet, eine Anklage oder Beschuldigung vorzubringen.
- source_word: ὧν ἐγὼ ὑπενόουν
  choice: wegen der …, die ich vermutet hatte
  rationale: Der Relativsatz beschreibt die Art von Vorwürfen, mit denen Festus gerechnet hatte; das Plusquamperfekt gibt die gegenüber dem Bericht vorzeitige Erwartung natürlich wieder.
- source_word: πονηρῶν
  choice: Vergehen
  rationale: Das substantivierte neutrale Pluraladjektiv bezeichnet hier schlechte oder unrechte Taten. „Vergehen“ passt zum Rechtskontext, ohne ausschließlich technisch definierte Straftaten zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung hält den Rechtskontext fest, während die Fußnote die allgemeinere Bedeutung von πονηρῶν bewahrt.
