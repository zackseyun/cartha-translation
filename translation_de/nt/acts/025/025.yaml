  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: de
  text: Ich aber stellte fest, dass er nichts getan hatte, was den Tod verdiente. Da er selbst Berufung an den Kaiser[a] eingelegt hatte, entschied ich, ihn zu schicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Augustus“. Der griechische Titel Σεβαστός bezeichnet hier den römischen Kaiser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: stellte fest
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Verb die nach einer Prüfung gewonnene Einschätzung des Festus. „stellte fest“ ist natürlich und lässt offen, wie förmlich diese Feststellung rechtlich war.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: nichts ..., was den Tod verdiente
  rationale: Die Formulierung bleibt nahe am Griechischen und vermeidet die stärker ausdeutende Wiedergabe „was die Todesstrafe verdiente“.
- source_word: πεπραχέναι
  choice: getan hatte
  rationale: Das Perfekt bezeichnet hier die Handlungen, die Paulus vorgeworfen wurden. „getan hatte“ gibt den weiten Sinn wieder, ohne ein bestimmtes Verbrechen vorauszusetzen.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: Da er selbst jedoch ... angerufen hatte
  rationale: Der Genitivus absolutus nennt den Umstand beziehungsweise Grund für die Entscheidung des Festus; „selbst“ bewahrt die Hervorhebung durch αὐτοῦ ... τούτου.
- source_word: ἐπικαλεσαμένου
  choice: angerufen hatte
  rationale: Im römischen Rechtskontext meint das Verb die Berufung auf die höhere kaiserliche Instanz. „den Kaiser anrufen“ ist im Deutschen eine verständliche rechtliche Formulierung und bewahrt etwas von der Bildlichkeit des griechischen Verbs.
- source_word: τὸν Σεβαστόν
  choice: den Kaiser
  rationale: Σεβαστός ist hier der griechische Kaisertitel, der dem lateinischen Augustus entspricht. „Kaiser“ bezeichnet für heutige Leser klar das Amt und vermeidet die Verwechslung mit dem ersten Kaiser Augustus.
- source_word: ἔκρινα
  choice: entschied ich
  rationale: Das Verb bezeichnet hier die amtliche Entscheidung des Festus; „entschied“ ist im modernen Deutschen klarer als das mehrdeutige „urteilte“.
- source_word: πέμπειν
  choice: ihn zu schicken
  rationale: Das im Griechischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen zur natürlichen und eindeutigen Formulierung ergänzt.
