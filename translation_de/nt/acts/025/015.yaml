- from: Als ich nach Jerusalem kam, brachten die führenden Priester und die Ältesten der Juden bei mir ihre Vorwürfe gegen ihn vor und forderten seine Verurteilung.[a]
  to: Als ich nach Jerusalem kam, legten mir die Hohenpriester und die Ältesten der Juden die Sache gegen ihn vor und beantragten seine Verurteilung.[a]
  rationale: Die Revision vermeidet die nicht ausdrücklich genannte Ergänzung „ihre Vorwürfe“, verwendet mit „Hohenpriester“ die etablierte Bezeichnung für ἀρχιερεῖς und gibt das petitionierende αἰτούμενοι mit dem im Rechtskontext passenden „beantragten“ wieder. Der Bezug auf Paulus sowie die gegen ihn gerichtete beantragte καταδίκη bleiben erhalten.
