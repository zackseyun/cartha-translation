source:
  edition: SBLGNT
  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: de
  text: Als ich nach Jerusalem kam, legten mir die Hohenpriester und die Ältesten der Juden die Sache gegen ihn vor und beantragten seine Verurteilung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und beantragten ein Urteil gegen ihn“; auch möglich: „und beantragten einen Schuldspruch gegen ihn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: gegen ihn
  rationale: Der Relativausdruck verweist auf Paulus und bezeichnet die ihn betreffende Angelegenheit. Im Deutschen wird dieser Bezug zusammen mit dem rechtlichen Vorbringen durch „ihre Vorwürfe gegen ihn“ natürlich und ausdrücklich wiedergegeben.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: Als ich nach Jerusalem kam
  rationale: Der Genitivus absolutus mit γίνομαι und einer Richtungsangabe bezeichnet hier die Ankunft in Jerusalem; die gewählte Formulierung ist idiomatisch und zeitlich eindeutig.
- source_word: ἐνεφάνισαν
  choice: brachten bei mir ihre Vorwürfe vor
  rationale: Das Verb bezeichnet hier eine Mitteilung beziehungsweise Anzeige gegenüber einer Amtsperson. Im rechtlich-administrativen Zusammenhang gibt diese Wendung den Vorgang natürlicher wieder als das allgemeinere „informierten mich“.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen priesterlichen Autoritäten und nicht mehrere amtierende Hohepriester. „Führende Priester“ ist im modernen Deutsch verständlich und sachlich präzise.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: die Ältesten der Juden
  rationale: Die Formulierung bewahrt die genitivische Zuordnung und bezeichnet die jüdischen Leitungspersonen, ohne sie weiter einzuengen.
- source_word: αἰτούμενοι
  choice: forderten
  rationale: Das Partizip bezeichnet ihre zugleich mit dem Vorbringen erhobene Forderung. „Forderten“ entspricht in diesem amtlichen Zusammenhang der nachdrücklichen Bitte um eine Entscheidung.
- source_word: κατ’ αὐτοῦ
  choice: gegen ihn
  rationale: κατά mit Genitiv hat hier die adversative rechtliche Bedeutung und bezeichnet das gegen Paulus gerichtete Vorgehen.
- source_word: καταδίκην
  choice: seine Verurteilung
  rationale: καταδίκη bezeichnet einen rechtlich verurteilenden Entscheid. „Verurteilung“ bewahrt die gerichtliche Bedeutung, ohne genauer zwischen Schuldspruch und Strafurteil zu entscheiden.
