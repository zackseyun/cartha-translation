  variant: modern standard German
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: de
  text: Barnabas und Saulus aber kehrten nach Jerusalem[a] zurück, nachdem sie den Dienst erfüllt hatten. Sie nahmen Johannes mit, der Markus genannt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »aus Jerusalem« statt »nach Jerusalem«.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: kehrten … zurück
  rationale: Der Aorist von ὑποστρέφω bezeichnet hier eine Rückkehr; „kehrten zurück“ ist im Deutschen präzise und natürlich.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Das in der vorgegebenen SBLGNT-Ausgabe stehende εἰς bezeichnet regulär das Ziel einer Bewegung und wird daher mit „nach Jerusalem“ wiedergegeben.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: nachdem sie den Dienst erfüllt hatten
  rationale: πληρόω bedeutet hier „erfüllen/zu Ende führen“, während διακονία den ihnen übertragenen Dienst bezeichnet. Die temporale Auflösung gibt das vorzeitige Partizip natürlich wieder.
- source_word: διακονίαν
  choice: den Dienst
  rationale: „Dienst“ bewahrt die Breite des griechischen Begriffs. Der Zusammenhang weist auf die Unterstützung der Gemeinde hin, doch eine Spezifizierung als „Hilfsmission“ würde diese Deutung in den Haupttext eintragen.
- source_word: συμπαραλαβόντες
  choice: Sie nahmen … mit
  rationale: Das zusammengesetzte Partizip bezeichnet, dass Johannes als Begleiter mitgenommen wurde. Ein eigener deutscher Satz vermeidet eine schwerfällige Partizipialkonstruktion.
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: Johannes …, der Markus genannt wurde
  rationale: Die passive Form von ἐπικαλέω bedeutet hier „genannt werden“. Die Wiedergabe bleibt transparent und fügt kein im Griechischen unausgedrücktes „auch“ hinzu.
theological_decisions:
- issue: Textvariante bei der Richtungsangabe
  choice: nach Jerusalem
  alternative: aus Jerusalem
  rationale: Der bereitgestellte SBLGNT-Text liest εἰς Ἰερουσαλήμ („nach Jerusalem“). Die im Erzählzusammenhang naheliegende und handschriftlich belegte Lesart ἐξ Ἰερουσαλήμ („aus Jerusalem“) wird wegen ihrer erheblichen Auswirkung auf den Sinn in einer Fußnote dokumentiert, ohne den Ausgangstext stillschweigend zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht die griechische Partizipialfolge gut verständlich, ohne ihren zeitlichen Zusammenhang oder die begleitende Handlung zu verändern. „Dienst“ bleibt bewusst weiter gefasst als „Hilfsdienst“.
