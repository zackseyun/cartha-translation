id: ACT.12.17
reference: Acts 12:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: de
  text: 'Doch er gab ihnen mit der Hand ein Zeichen, still zu sein, und erzählte ihnen, wie der Herr ihn aus dem Gefängnis herausgeführt hatte. Dann sagte er: „Berichtet Jakobus und den Brüdern[a] davon.“ Darauf ging er hinaus und begab sich an einen anderen Ort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Brüdern und Schwestern“. Das griechische Wort lautet „Brüder“ und kann je nach Zusammenhang die weitere Gemeinschaft der Glaubenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: er gab ihnen mit der Hand ein Zeichen, still zu sein
  rationale: Die Formulierung gibt die körperliche Geste und deren Zweck natürlich wieder, ohne die genaue Handbewegung näher zu bestimmen.
- source_word: διηγήσατο
  choice: erzählte ihnen
  rationale: Das Verb bezeichnet einen zusammenhängenden, näheren Bericht. „Erzählte“ ist im Deutschen natürlich und bewahrt den narrativen Charakter.
- source_word: πῶς
  choice: wie
  rationale: „Wie“ leitet entsprechend dem Griechischen den Inhalt des Berichts ein und lässt die Art und Weise der Befreiung im Blick.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die übliche Entsprechung wahrt den Titel und legt nicht fest, ob hier speziell Jesus oder Gott allgemein gemeint ist.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: aus dem Gefängnis herausgeführt hatte
  rationale: „Herausgeführt“ bildet die Bewegungsrichtung des Verbs ab; das Plusquamperfekt macht die zeitliche Vorordnung zur Erzählung deutlich.
- source_word: Ἀπαγγείλατε
  choice: Berichtet
  rationale: Der Imperativ fordert dazu auf, die wichtige Nachricht zuverlässig weiterzugeben.
- source_word: Ἰακώβῳ
  choice: Jakobus
  rationale: Dies ist die etablierte deutsche Namensform im neutestamentlichen Gebrauch.
- source_word: τοῖς ἀδελφοῖς
  choice: den Brüdern
  rationale: Die formale maskuline Pluralform wird im Haupttext bewahrt; eine mögliche inklusive Bedeutung für die Glaubensgemeinschaft wird in der Fußnote genannt.
- source_word: ταῦτα
  choice: davon
  rationale: Das idiomatische deutsche Pronomen bezieht sich klar auf die zuvor geschilderten Ereignisse, ohne schwerfälliges „diese Dinge“.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: ging er hinaus und begab sich
  rationale: 'Die Wiedergabe erhält beide Bewegungselemente: das Verlassen des Ortes und den anschließenden Weg an ein anderes Ziel.'
- source_word: εἰς ἕτερον τόπον
  choice: an einen anderen Ort
  rationale: Die Formulierung wahrt die unbestimmte Ortsangabe des griechischen Textes.
theological_decisions:
- issue: Bezug von κύριος
  choice: „der Herr“, ohne nähere Identifizierung
  alternative: ausdrücklich „Jesus“ oder „Gott“
  rationale: Der griechische Text spezifiziert den Referenten nicht. Die Übersetzung bewahrt diese theologische Offenheit.
- issue: Umfang von τοῖς ἀδελφοῖς
  choice: „den Brüdern“ mit erklärender Fußnote
  alternative: „den Brüdern und Schwestern“ oder „den Glaubensgeschwistern“ im Haupttext
  rationale: Die gewählte Fassung wahrt die grammatische Form des Ausgangstextes, ohne auszuschließen, dass kontextuell die weitere Gemeinschaft der Glaubenden gemeint ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt eng am griechischen Ablauf; idiomatische Wendungen wie „davon“ vermeiden unnötige Wörtlichkeit.
