id: ACT.12.12
reference: Acts 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: de
  text: Als ihm das klar geworden war, ging er zum Haus von Maria, der Mutter von Johannes, der Markus genannt wurde[a]. Dort waren viele versammelt und beteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der auch Markus genannt wurde«. Das Griechische bezeichnet Markus als einen weiteren Namen des Johannes, enthält aber kein ausdrückliches Wort für »auch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδών
  choice: Als ihm das klar geworden war
  rationale: Das Aoristpartizip von συνοράω bezeichnet hier, im Anschluss an Vers 11, dass Petrus seine Lage vollständig erfasst. Die deutsche Formulierung ist natürlich und macht den aus dem Kontext ergänzten Bezug mit »das« deutlich.
- source_word: τε
  choice: nicht eigens wiedergegeben
  rationale: τέ verbindet den Satz nur leicht mit dem vorherigen Geschehen. Der Zusammenhang wird im Deutschen bereits durch die einleitende Zeitangabe natürlich ausgedrückt.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: ging er zum Haus
  rationale: Die Verbindung bezeichnet eine Bewegung auf einen Ort zu. »Ging … zum Haus« entspricht der Erzählperspektive und vermeidet die deiktische Färbung von »kam«.
- source_word: τῆς Μαρίας
  choice: von Maria
  rationale: Der Personenname wird in seiner üblichen deutschen biblischen Form wiedergegeben; die Konstruktion mit »von« klingt im heutigen Deutsch natürlich.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: der Mutter von Johannes
  rationale: Die Genitivbeziehung identifiziert Maria eindeutig und wird in modernem Standarddeutsch klar wiedergegeben.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: der Markus genannt wurde
  rationale: Das passive Partizip identifiziert Johannes durch einen weiteren Namen. Die Wiedergabe bleibt eng am Wortlaut und fügt kein im Griechischen nicht ausdrücklich vorhandenes »auch« ein.
- source_word: οὗ
  choice: Dort
  rationale: Das Relativadverb verweist auf Marias Haus. Die Aufteilung in zwei Sätze ergibt klares, natürliches Deutsch, ohne den Ortsbezug zu verändern.
- source_word: ἱκανοὶ
  choice: viele
  rationale: Der substantivische Plural bezeichnet eine beträchtliche Zahl von Menschen. »Viele« ist knapp, verständlich und sachlich angemessen.
- source_word: ἦσαν … συνηθροισμένοι
  choice: waren … versammelt
  rationale: Die Verbindung aus Imperfekt und Perfektpartizip beschreibt den aus einem vorausgegangenen Zusammenkommen entstandenen Zustand.
- source_word: καὶ προσευχόμενοι
  choice: und beteten
  rationale: Das Partizip bezeichnet ihre gleichzeitig andauernde Tätigkeit. Das deutsche Präteritum gibt diese fortlaufende Handlung im Erzählzusammenhang idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die längere griechische Periode wird zur besseren Verständlichkeit in zwei Sätze gegliedert; Personenbezüge, zeitlicher Ablauf und die fortdauernde Gebetstätigkeit bleiben erhalten.
