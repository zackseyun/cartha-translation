  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: de
  text: 'Die Menschenmenge rief immer wieder: „Das ist die Stimme eines Gottes und nicht die eines Menschen!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist die Stimme Gottes und nicht die eines Menschen!“ Das Griechische lässt auch diese Wiedergabe zu; im Zusammenhang ist jedoch „eines Gottes“ wahrscheinlicher, weil die heidnische Menschenmenge Herodes göttliche Ehren erweist.'
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: die Menschenmenge
  rationale: Bezeichnet hier die versammelte Öffentlichkeit beziehungsweise Volksmenge, nicht ein formelles politisches Gremium. „Menschenmenge“ ist im modernen Deutsch natürlich und passt zur öffentlichen Huldigung.
- source_word: ἐπεφώνει
  choice: rief immer wieder
  rationale: Der Imperfekt stellt das Rufen als andauernd oder wiederholt dar. „Rief immer wieder“ gibt diesen imperfektiven Aspekt verständlich wieder.
- source_word: Θεοῦ
  choice: eines Gottes
  rationale: Im heidnischen Kontext der Huldigung Herodes ist die artikellose Genitivform am ehesten unbestimmt zu verstehen. Die Übersetzung bewahrt zugleich die substantivische Form und den Gegensatz zu „eines Menschen“.
- source_word: φωνὴ
  choice: die Stimme
  rationale: Die griechische Nominalphrase ist ein Ausruf ohne ausdrücklich gesetztes Verb. Die deutsche Formulierung mit „Das ist“ macht den Ausruf natürlich, während „Stimme“ die direkte Bedeutung erhält.
- source_word: ἀνθρώπου
  choice: eines Menschen
  rationale: Bewahrt den singularischen, substantivischen Gegensatz zu „eines Gottes“ und ist im Deutschen idiomatischer sowie inklusiver als „eines Mannes“.
theological_decisions:
- issue: Ob Θεοῦ mit „Gottes“ oder „eines Gottes“ wiederzugeben ist
  choice: eines Gottes
  alternative: Gottes
  rationale: Die heidnische Menschenmenge schreibt Herodes göttlichen Rang zu; der Kontext legt daher eine unbestimmte Wiedergabe nahe. Da das artikellose Θεοῦ allein die Frage nicht eindeutig entscheidet, wird die mögliche bestimmte Lesart in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fortdauernde Charakter des Zurufs wird ausdrücklich wiedergegeben; die knappe griechische Ausrufkonstruktion wird für natürliches Deutsch mit „Das ist“ ergänzt.
