  variant: modern standard German
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: de
  text: Als es Tag wurde, entstand unter den Soldaten große Unruhe darüber, was wohl aus Petrus geworden war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Als es Tag wurde
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Übergang. Die deutsche Formulierung ist natürlich und gibt δέ hier ohne ein zusätzliches, unnötiges Diskurswort wieder.
- source_word: τάραχος οὐκ ὀλίγος
  choice: große Unruhe
  rationale: Die Litotes bedeutet eine beträchtliche Unruhe. Im Deutschen ist „nicht geringe Unruhe“ möglich, wirkt aber weniger natürlich; „große Unruhe“ vermittelt die gemeinte Stärke klar.
- source_word: ἐν τοῖς στρατιώταις
  choice: unter den Soldaten
  rationale: στρατιώταις bezeichnet wörtlich Soldaten; ἐν kennzeichnet hier die Gruppe, in der die Unruhe entstand.
- source_word: τί ἄρα
  choice: darüber, was wohl
  rationale: ἄρα verleiht der indirekten Frage einen Ton des Rätselns oder Folgerns. Das deutsche Modalwort „wohl“ bewahrt diese Nuance.
- source_word: ὁ Πέτρος
  choice: Petrus
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: ἐγένετο
  choice: aus Petrus geworden war
  rationale: In der Verbindung τί ... ἐγένετο bezeichnet das Verb idiomatisch, was aus einer Person geworden beziehungsweise was mit ihr geschehen ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte griechische Litotes wird zugunsten einer flüssigen und unmittelbar verständlichen deutschen Intensivform wiedergegeben; die Unsicherheit in ἄρα bleibt durch „wohl“ erhalten.
