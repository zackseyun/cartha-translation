translation:
  language: de
  text: Und er tötete Jakobus[a], den Bruder des Johannes, mit dem Schwert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ Jakobus töten“ beziehungsweise „ließ Jakobus hinrichten“. Das griechische Verb besagt, dass Herodes den Tod des Jakobus herbeiführte; der Zusammenhang kann auf eine amtlich angeordnete Hinrichtung hindeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: tötete
  rationale: ἀναιρέω bezeichnet hier das Herbeiführen des Todes. „Tötete“ gibt die Aussage klar wieder, ohne ausdrücklich festzulegen, ob Herodes die Tat eigenhändig beging oder eine Hinrichtung anordnete.
- source_word: δὲ
  choice: Und
  rationale: δέ führt die Erzählung weiter. „Und“ bewahrt den schlichten Anschluss, ohne einen stärkeren Gegensatz auszudrücken.
- source_word: Ἰάκωβον
  choice: Jakobus
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: den Bruder des Johannes
  rationale: Die Apposition bestimmt näher, welcher Jakobus gemeint ist, und folgt in natürlichem Deutsch eng der griechischen Struktur.
- source_word: μαχαίρῃ
  choice: mit dem Schwert
  rationale: μάχαιρα bezeichnet ein Schwert oder Kurzschwert; der Dativ ist instrumental. „Mit dem Schwert“ erhält das konkrete Bild und ist idiomatisches Deutsch.
theological_decisions:
- issue: Art von Herodes’ Handlung
  choice: Die Hauptfassung spricht schlicht vom Töten und bestimmt den Vorgang nicht ausdrücklich als gerichtliche Hinrichtung.
  alternative: „Er ließ Jakobus hinrichten“ oder „Er ließ Jakobus töten“
  rationale: Das Verb ἀνεῖλεν besagt, dass Herodes den Tod des Jakobus herbeiführte, und μαχαίρῃ nennt das Mittel. Der Zusammenhang legt staatlich angeordnete Verfolgung nahe, doch der Vers selbst hebt ein rechtliches Verfahren nicht ausdrücklich hervor. Die offenere Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Text, ohne unnatürlich zu wirken; die Fußnote erhält die mögliche amtlich-juristische Nuance, ohne sie im Haupttext festzuschreiben.
