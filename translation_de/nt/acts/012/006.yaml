  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: de
  text: In jener Nacht, als Herodes ihn gerade vorführen wollte[a], schlief Petrus zwischen zwei Soldaten, mit zwei Ketten gefesselt. Vor der Tür bewachten Wachen das Gefängnis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn herauszuführen“. Das griechische Verb kann das Heraus- oder Vorführen zu einem öffentlichen Auftreten oder zu einem Gerichtsverfahren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Vor der Tür hielten Wachen die Wache.“ Das griechische Wort φυλακή kann je nach Zusammenhang „Gefängnis/Haft“ oder „Wache/Bewachung“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: kurz davorstand
  rationale: Die Form von μέλλω bezeichnet hier eine unmittelbar bevorstehende Handlung. „Kurz davorstand“ gibt diese zeitliche Nähe deutlicher wieder als ein bloßes „wollte“.
- source_word: προαγαγεῖν αὐτόν
  choice: ihn vorzuführen
  rationale: προάγω bezeichnet hier das Heraus- beziehungsweise Vorführen des Gefangenen zu einem öffentlichen Verfahren. „Vorführen“ ist im deutschen Justiz- und Haftkontext natürlich und bewahrt den Zielbezug, ohne das genaue Verfahren festzulegen.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: in genau jener Nacht
  rationale: Die demonstrative Wendung hebt diese bestimmte Nacht hervor; „genau jener“ erhält den Nachdruck und die erzählerische Spannung.
- source_word: κοιμώμενος
  choice: schlief
  rationale: Das Partizip beschreibt den andauernden Schlafzustand. Im Deutschen gibt das Präteritum im narrativen Zusammenhang diesen Verlauf natürlich wieder.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: zwischen zwei Soldaten
  rationale: Die räumliche Anordnung wird direkt und idiomatisch wiedergegeben.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: mit zwei Ketten gefesselt
  rationale: Die Verbindung gibt sowohl den bestehenden Zustand des Gefesseltseins als auch das Mittel der Fesselung prägnant wieder.
- source_word: φύλακες
  choice: Wachen
  rationale: „Wachen“ bezeichnet im Gefängniskontext verständlich die mit der Bewachung beauftragten Personen und vermeidet die unmittelbare Wiederholung von „bewachten“ als derselben Wortwurzel nicht vollständig, bleibt aber natürlich.
- source_word: πρὸ τῆς θύρας
  choice: vor der Tür
  rationale: Die Präpositionalphrase wird räumlich genau und in natürlichem Deutsch wiedergegeben.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: bewachten das Gefängnis
  rationale: τηρέω trägt den Sinn des Bewachens, während φυλακή hier im Kontext den Haftort bezeichnet. Die Formulierung ist knapp und klar.
