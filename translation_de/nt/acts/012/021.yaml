base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: de
  text: An einem bestimmten Tag zog Herodes ein königliches Gewand[a] an, nahm auf dem Podium[b] Platz und sprach öffentlich zu ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: königliche Kleidung. Das griechische Wort kann allgemein Kleidung oder prächtige Gewandung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Richterstuhl, Tribüne oder Plattform. Das griechische Wort bezeichnet häufig einen offiziellen Sitz oder eine erhöhte Plattform.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: An einem festgesetzten Tag
  rationale: τακτός bezeichnet hier einen festgelegten oder bestimmten Zeitpunkt. „Festgesetzt“ gibt den formellen Charakter des Anlasses wieder; das anknüpfende δέ wird im Deutschen durch den Erzählfortgang ausreichend vermittelt.
- source_word: ἐνδυσάμενος
  choice: zog ... an
  rationale: Das idiomatische deutsche Verb bewahrt die aktive Handlung des reflexiv gebrauchten Aoristpartizips und lässt die zeitliche Abfolge natürlich erkennen.
- source_word: ἐσθῆτα βασιλικὴν
  choice: ein königliches Gewand
  rationale: ἐσθής bezeichnet Kleidung oder Gewandung; „Gewand“ ist würdig und verständlich, ohne mehrere einzelne Roben vorauszusetzen.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: nahm auf der Tribüne Platz
  rationale: Die Formulierung verbindet das Sichsetzen mit βῆμα als erhöhtem Ort eines offiziellen öffentlichen Auftritts, ohne zwingend eine Gerichtsverhandlung anzunehmen.
- source_word: ἐδημηγόρει
  choice: hielt ... eine öffentliche Rede
  rationale: δημηγορέω bezeichnet das öffentliche Reden vor einer Versammlung. Das deutsche Präteritum ist erzählerisch natürlich; der Kontext stellt die Rede als im Gang befindliche Handlung dar.
- source_word: πρὸς αὐτούς
  choice: vor ihnen
  rationale: Die Wendung bezeichnet hier die Ausrichtung der Rede an die anwesende Zuhörerschaft; „vor ihnen“ klingt im Zusammenhang einer öffentlichen Ansprache natürlich.
