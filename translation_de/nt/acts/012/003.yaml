revisions:
- from: Als er sah, dass dies den Juden[a] gefiel, ließ er auch Petrus festnehmen. (Es waren gerade die Tage des Festes der ungesäuerten Brote[b].)
  to: Als er sah, dass dies den Juden[a] gefiel, ging er dazu über, auch Petrus festnehmen zu lassen. (Es waren gerade die Tage des Festes der ungesäuerten Brote[b].)
  rationale: Die Revision präzisiert die Fortsetzungsbedeutung von προσέθετο und korrigiert die lexikalische Fußnote, ohne die im griechischen Text offene Referenz von Ἰουδαίοις einzuengen. Die Bezeichnung des Festes und die parenthetische Zeitangabe bleiben erhalten.
