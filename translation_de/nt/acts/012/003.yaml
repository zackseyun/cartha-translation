review_pass:
  verdict: revise
  source_fidelity: Der Haupttext gibt die Abfolge und den Sinn des griechischen Satzes im Wesentlichen korrekt wieder. „ließ ... festnehmen“ ist jedoch weniger unmittelbar als προσέθετο συλλαβεῖν und kann unnötig eine Ausführung durch Beauftragte hervorheben. „ging er dazu über, auch Petrus festnehmen zu lassen“ bewahrt die Fortsetzungsnuance von προσέθετο, ohne den Sinn zu verändern.
  naturalness: Der Entwurf ist gut verständliches modernes Standarddeutsch. „Es waren gerade die Tage des Festes der ungesäuerten Brote“ ist verständlich, aber „Es waren aber die Tage der Ungesäuerten Brote“ wäre zu wörtlich; die vorhandene, natürliche Formulierung kann mit einer kleinen Straffung beibehalten werden.
  terminology: '„Juden“, „Petrus“ und „Fest der ungesäuerten Brote“ sind sachgerecht. In der Fußnote ist „Judäern“ als Alternative zu Ἰουδαίοις problematisch: Das deutsche Wort bezeichnet gewöhnlich Bewohner Judäas und ist keine gleichwertige, neutrale Wiedergabe der hier möglichen Bedeutung „Judeans“. Die Erläuterung sollte stattdessen von einer möglichen kontextuellen Bedeutung als „Bewohner Judäas“ sprechen, ohne diese als Übersetzungsalternative auszugeben.'
  issues:
