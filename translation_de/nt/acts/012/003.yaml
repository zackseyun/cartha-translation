    issue: Die Fußnote nennt „den Judäern“ als Übersetzungsalternative.
    rationale: „Judäer“ ist im heutigen Deutsch semantisch enger als Ἰουδαῖοι und lenkt auf eine bloß regionale Herkunft. Die Quelle lässt zwar je nach Kontext auch einen geographisch-politischen Bezug zu, aber dieser ist hier nicht als gleichrangige deutsche Übersetzungsoption zu behaupten.
  - severity: low
    issue: „ließ ... festnehmen“ schwächt die unmittelbare Handlungsfortsetzung von προσέθετο συλλαβεῖν leicht ab.
    rationale: Die Konstruktion bedeutet, dass Herodes zusätzlich die Festnahme des Petrus veranlasste bzw. dazu überging. Eine Formulierung mit „ging ... dazu über“ bildet die idiomatische Fortsetzungsnuance expliziter ab.
