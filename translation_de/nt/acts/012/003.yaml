  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: de
  text: Als er sah, dass dies den Juden[a] gefiel, ging er dazu über, auch Petrus festnehmen zu lassen. (Es waren gerade die Tage des Festes der ungesäuerten Brote[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Zusammenhang auch einen Bezug zu Judäa oder zu jüdischen Führungspersonen haben; hier steht jedoch einfach „den Juden“.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die an das Passa anschließende Festzeit, in der ungesäuertes Brot gegessen wurde.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Als er sah
  rationale: Das Aoristpartizip bezeichnet hier am natürlichsten den zeitlichen Umstand, der der nächsten Handlung des Herodes vorausgeht. „Als er sah“ gibt diese Abfolge in klarem, modernem Deutsch wieder.
- source_word: ἀρεστόν ἐστιν
  choice: dass dies … gefiel
  rationale: Die idiomatische deutsche Verbalkonstruktion gibt den Sinn „angenehm bzw. willkommen sein“ natürlich wieder; „dies“ verweist auf das unmittelbar zuvor berichtete Vorgehen gegen Jakobus.
- source_word: τοῖς Ἰουδαίοις
  choice: den Juden
  rationale: Der griechische Ausdruck wird in seiner unbeschränkten lexikalischen Bedeutung wiedergegeben. Der Vers selbst grenzt die Gruppe weder ausdrücklich auf Judäer noch auf jüdische Führungspersonen ein.
- source_word: προσέθετο συλλαβεῖν
  choice: ließ … festnehmen
  rationale: προστίθημι mit Infinitiv bedeutet hier, dass Herodes mit einer weiteren entsprechenden Maßnahme fortfuhr. Im Deutschen bringt „auch“ die Fortsetzung und Erweiterung des Vorgehens ausreichend zum Ausdruck; συλλαβεῖν bezeichnet in diesem obrigkeitlichen Zusammenhang eine Festnahme.
- source_word: καὶ Πέτρον
  choice: auch Petrus
  rationale: καί stellt Petrus als weiteres Ziel neben Jakobus; „auch Petrus“ bewahrt diese additive Bedeutung.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Es waren gerade die Tage des Festes der ungesäuerten Brote
  rationale: Die Formulierung bewahrt die zeitliche Hintergrundangabe und den spezifischen jüdischen Festbegriff. „gerade“ macht die situative Funktion des griechischen δέ im natürlichen Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίοις in der Apostelgeschichte
  choice: den Juden
  alternative: den Judäern; den jüdischen Führern
  rationale: Der Wortlaut schränkt die Bezugsgruppe nicht ausdrücklich geografisch oder auf Führungspersonen ein. Die allgemeinere Wiedergabe bewahrt diese Offenheit, ohne eine engere Auslegung in den Haupttext einzutragen.
- issue: Wiedergabe von τῶν ἀζύμων
  choice: Fest der ungesäuerten Brote
  alternative: Passafest
  rationale: Der griechische Text nennt ausdrücklich die Tage der ungesäuerten Brote und nicht einfach das Passa. Die verwandten, aber unterscheidbaren Festbezeichnungen werden daher nicht gleichgesetzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Klammer bewahrt die eingeschobene Zeitangabe des griechischen Textes. Der kulturelle Fußnotenmarker steht bei dem Ausdruck, den er erläutert.
