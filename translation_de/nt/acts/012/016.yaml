id: ACT.12.16
reference: Acts 12:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἐπέμενεν κρούων· ἀνοίξαντες δὲ εἶδαν αὐτὸν καὶ ἐξέστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: de
  text: Petrus aber klopfte beharrlich weiter.[a] Als sie öffneten,[b] sahen sie ihn und waren außer sich vor Staunen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hörte nicht auf zu klopfen“ oder „klopfte immer weiter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Nachdem sie geöffnet hatten“. Was geöffnet wurde, wird im griechischen Text nicht eigens genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: klopfte beharrlich weiter
  rationale: Die Verbindung aus dem Imperfekt ἐπέμενεν und dem gleichzeitigen Partizip κρούων bezeichnet ein anhaltendes beziehungsweise wiederholtes Klopfen. Die deutsche Formulierung gibt Dauer und Beharrlichkeit natürlich wieder.
- source_word: ἀνοίξαντες
  choice: als sie öffneten
  rationale: Das Aoristpartizip wird entsprechend dem erzählerischen Ablauf temporal wiedergegeben. Ein Objekt wie „die Tür“ oder „das Tor“ wird nicht ergänzt, da es im griechischen Text nicht ausdrücklich steht und aus dem Zusammenhang hervorgeht.
- source_word: εἶδαν αὐτόν
  choice: sahen sie ihn
  rationale: Die schlichte narrative Bedeutung von ὁράω wird ohne unnötige Verstärkung wiedergegeben.
- source_word: ἐξέστησαν
  choice: waren außer sich vor Staunen
  rationale: ἐξίστημι bezeichnet hier eine starke, überwältigende Verwunderung. Die Formulierung bewahrt diese Intensität, ohne Angst oder Schrecken in den Text einzutragen.
- source_word: δὲ
  choice: aber / als
  rationale: Das erste δέ markiert den Gegensatz zur vorausgehenden Situation und wird mit „aber“ wiedergegeben. Das zweite δέ wird in die natürliche temporale Satzverknüpfung aufgenommen.
- source_word: Πέτρος
  choice: Petrus
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Beharrlich weiter“ verdeutlicht den durativen Sinn, während „außer sich vor Staunen“ die Stärke der Reaktion bewahrt. Die Auslassung eines ergänzten Objekts bei „öffneten“ erhält die Formulierung des Ausgangstextes und vermeidet eine unnötige Festlegung auf Tür oder Tor.
