id: ACT.12.11
reference: Acts 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: de
  text: 'Da kam Petrus zu sich[a] und sagte: »Jetzt weiß ich wirklich, dass der Herr seinen Engel gesandt und mich aus der Hand des Herodes[b] und von allem befreit hat, was das jüdische Volk erwartete.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wieder ganz bei sich«; wörtlich: »in sich selbst gekommen«.'
    reason: lexical_alternative
  - marker: b
    text: '»Aus der Hand« bedeutet hier: aus der Macht oder Gewalt.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: »von der ganzen Erwartung des jüdischen Volkes«; gemeint ist alles, was es mit Petrus geschehen zu sehen erwartete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: Da kam Petrus zu sich
  rationale: Die deutsche Wendung »zu sich kommen« bewahrt das griechische Bild und bezeichnet hier die Rückkehr zu voller bewusster Wahrnehmung nach dem zuvor wie eine Vision erlebten Geschehen.
- source_word: ἀληθῶς
  choice: wirklich
  rationale: »Wirklich« gibt die nachdrückliche Gewissheit des Petrus in natürlichem modernem Deutsch wieder.
- source_word: ἐξαπέστειλεν
  choice: gesandt
  rationale: »Gesandt« entspricht dem Verb im erzählerisch-biblischen Register, ohne das Präfix durch ein unnatürliches »hinausgesandt« zu überzeichnen.
- source_word: κύριος
  choice: der Herr
  rationale: Die Wiedergabe bleibt bei der unbestimmten Bezeichnung des griechischen Textes und legt den Bezug nicht ausdrücklich auf Gott oder den auferstandenen Jesus fest.
- source_word: ἄγγελον
  choice: Engel
  rationale: Der Erzählzusammenhang bezeichnet eindeutig einen himmlischen Boten; daher ist »Engel« angemessen.
- source_word: ἐξείλατό με
  choice: mich … befreit hat
  rationale: Das Verb bezeichnet die rettende Herausnahme aus Gefahr beziehungsweise Gewalt. »Befreit« passt konkret zur Gefangenschaft und schließt beide anschließenden ἐκ-Ergänzungen natürlich ein.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: aus der Hand des Herodes
  rationale: Die traditionelle und im Deutschen verständliche Wendung bewahrt das Körperbild; »Hand« steht hier für Macht oder Gewalt.
- source_word: πάσης τῆς προσδοκίας
  choice: von allem …, was … erwartete
  rationale: 'Die Formulierung gibt den Sinn der substantivischen Wendung natürlich wieder: Petrus wurde dem gesamten erwarteten Ausgang entzogen. Sie vermeidet das im Deutschen missverständliche abstrakte »von aller Erwartung«.'
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: das jüdische Volk
  rationale: Dies ist die natürliche deutsche Wiedergabe der Genitivverbindung und bezeichnet in diesem Kontext die jüdische Bevölkerung, deren Erwartung zuvor in Vers 4 angedeutet wird.
theological_decisions:
- issue: Bezug von κύριος
  choice: der Herr
  alternative: Gott; der auferstandene Jesus
  rationale: Der griechische Text präzisiert den Bezug nicht. »Der Herr« bewahrt diese Offenheit und vermeidet eine theologische Festlegung, die der Vers selbst nicht ausdrücklich vornimmt.
- issue: Bedeutung der Befreiung von πάσης τῆς προσδοκίας
  choice: von allem befreit, was das jüdische Volk erwartete
  alternative: von der ganzen Erwartung des jüdischen Volkes
  rationale: Gemeint ist wahrscheinlich das von der Bevölkerung erwartete Schicksal des Petrus. Die Übersetzung macht den syntaktischen Sinn verständlich, ohne den konkreten erwarteten Ausgang – etwa Verurteilung oder Hinrichtung – über den Text hinaus festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das idiomatische »zu sich kommen« und die bildhafte »Hand des Herodes« bewahren zentrale Bilder des griechischen Textes; die schwerfällige Genitivfolge am Versende wird behutsam in natürliches Deutsch überführt.
