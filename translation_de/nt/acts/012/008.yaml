source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: de
  text: 'Der Engel sagte zu ihm: »Binde dir den Gürtel um[a] und zieh deine Sandalen an!« Er tat es. Dann sagt[b] der Engel zu ihm: »Leg dir deinen Mantel um[c] und folge mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gürte dich.« Das griechische Verb meint, dass man sich den Gürtel umbindet und sich so bereitmacht.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen »sagt«; dieses historische Präsens gestaltet die Erzählung lebendig.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Wirf dir deinen Mantel um.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: Engel
  rationale: Im erzählerischen Zusammenhang ist ein himmlisches Wesen gemeint; daher ist »Engel« hier natürlicher und genauer als das allgemeinere »Bote«.
- source_word: Ζῶσαι
  choice: Gürte dich
  rationale: Der Aorist-Medium-Imperativ bezeichnet das Umschließen beziehungsweise Bereitmachen mit einem Gürtel. »Gürte dich« ist knapp und bewahrt das konkrete antike Bild; die Fußnote erläutert es in heutigem Deutsch.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: zieh deine Sandalen an
  rationale: Die Wendung fordert zum Anlegen des Schuhwerks auf. »Zieh deine Sandalen an« ist idiomatisches modernes Deutsch.
- source_word: ἐποίησεν δὲ οὕτως
  choice: Er tat es
  rationale: οὕτως fasst den Vollzug der vorangehenden Befehle zusammen; »Er tat es« gibt dies knapp und natürlich wieder.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens wird trotz der vergangenen Erzählung beibehalten, um den historischen Präsenswechsel und seine erzählerische Unmittelbarkeit erkennen zu lassen.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Leg deinen Mantel um
  rationale: ἱμάτιον bezeichnet hier das äußere Gewand beziehungsweise den Mantel, und περιβάλλω drückt das Umlegen um den Körper aus. Die Formulierung ist zugleich natürlich und bildgetreu.
- source_word: ἀκολούθει μοι
  choice: folge mir
  rationale: Die direkte Wiedergabe bewahrt sowohl die konkrete Aufforderung zur Bewegung als auch den im Neuen Testament wiederkehrenden Ausdruck des Folgens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und knapp. Das leicht traditionelle »Gürte dich« erhält das antike Handlungsbild, wird aber unmittelbar in einer Fußnote erklärt. Das historische Präsens in λέγει bleibt sichtbar; zur eindeutigen Referenz wird das Subjekt als »der Engel« wiederholt.
