id: ACT.12.5
reference: Acts 12:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: de
  text: Petrus wurde also im Gefängnis festgehalten; doch die Gemeinde betete anhaltend[a] für ihn zu Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „inständig“. Das griechische Adverb kann die Intensität oder die Beharrlichkeit des Gebets hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: wurde … festgehalten
  rationale: Der Imperfekt Passiv bezeichnet einen andauernden Zustand beziehungsweise fortlaufenden Gewahrsam. „Wurde festgehalten“ bewahrt Passiv und Dauer, ohne die Art der Bewachung unnötig zu präzisieren.
- source_word: ἐν τῇ φυλακῇ
  choice: im Gefängnis
  rationale: Die Wendung bezeichnet hier den Ort der Haft; „im Gefängnis“ ist im modernen Standarddeutsch natürlich und sachlich.
- source_word: προσευχὴ … ἦν … γινομένη
  choice: betete
  rationale: Die periphrastische Konstruktion beschreibt fortdauerndes Beten. Zusammen mit „anhaltend“ gibt das finite deutsche Verb den Verlauf natürlicher wieder als das schwerfällige „Gebet wurde dargebracht“.
- source_word: ἐκτενῶς
  choice: anhaltend
  rationale: Das Adverb kann sowohl intensive Ernsthaftigkeit als auch beharrliche Dauer hervorheben. „Anhaltend“ passt zur fortdauernden Gebetssituation; „inständig“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: die Gemeinde
  rationale: ἐκκλησία bezeichnet hier die christliche Gemeinschaft. „Gemeinde“ ist im Deutschen idiomatisch und vermeidet die mögliche institutionelle Verengung von „Kirche“.
- source_word: πρὸς τὸν θεόν
  choice: zu Gott
  rationale: πρός bezeichnet die Ausrichtung des Gebets; „zu Gott beten“ ist die natürliche deutsche Verbindung.
- source_word: περὶ αὐτοῦ
  choice: für ihn
  rationale: Im Kontext der Fürbitte gibt „für ihn“ den Sinn von περί mit Genitiv klar und idiomatisch wieder.
- source_word: μὲν οὖν … δὲ
  choice: also … doch
  rationale: Die Partikeln führen die Erzählung weiter und stellen der Haft des Petrus das Gebet der Gemeinde gegenüber. „Also … doch“ bewahrt diese milde Kontrastierung.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία
  choice: Gemeinde
  alternative: Kirche; Versammlung
  rationale: Gemeint ist die christliche Gemeinschaft, die für Petrus betet. „Gemeinde“ ist im deutschen Kontext sachgerecht, natürlich und konfessionell nicht unnötig festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt erzählerisch knapp; der Gegensatz zwischen Petrus’ fortdauernder Haft und dem fortdauernden Gebet der Gemeinde wird klar herausgestellt.
