  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: die feindselige Haltung, das einmütige Herantreten, die vorausgehende Einflussnahme auf Blastus, das Friedensgesuch und dessen wirtschaftliche Begründung. „Für sich gewonnen“ wahrt angemessen, dass der Gegenstand des Überzeugens im Griechischen nicht benannt wird. „Herrschaftsgebiet des Königs“ ist eine plausible, verständliche Entfaltung des substantivierten βασιλική, ohne unnötige historische Präzisierung.'
  naturalness: Modernes Standarddeutsch, flüssig und angemessen erzählerisch. „Sie aber“ bildet den griechischen Anschluss δέ natürlich ab; die Satzteilung nach „zu ihm“ verbessert die Lesbarkeit. Der Pluperfektanschluss „Nachdem sie … für sich gewonnen hatten“ macht die zeitliche Vorordnung des aoristischen Partizips idiomatisch deutlich.
  terminology: Die Ortsnamen und der Personenname sind im Deutschen etabliert. Die Umschreibung „Einwohner von Tyrus und Sidon“ ist klar und sachgerecht. Die Amtsbeschreibung für Blastus ist quellentreu und wird durch die Fußnote sinnvoll kulturell erläutert. „Frieden“ trifft εἰρήνη im diplomatischen Kontext.
