translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Geschlossen“ gibt die gemeinsame Absicht idiomatisch wieder; „für sich gewonnen“ wahrt, dass der griechische Text den genauen Inhalt der Einflussnahme auf Blastus nicht nennt. Die Semikolonverbindung macht den begründenden Zusammenhang des Friedensgesuchs deutlich.
