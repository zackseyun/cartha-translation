language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: de
  text: Er war den Einwohnern von Tyrus und Sidon gegenüber äußerst feindselig[a]. Sie aber kamen geschlossen zu ihm. Nachdem sie Blastus, den für das Schlafgemach des Königs zuständigen Beamten[b], für sich gewonnen hatten, baten sie um Frieden; denn ihr Land wurde aus dem Herrschaftsgebiet des Königs mit Lebensmitteln versorgt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er war sehr zornig auf die Einwohner von Tyrus und Sidon.“ Das griechische Wort bezeichnet heftigen Zorn oder ausgeprägte Feindseligkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den, der über das Schlafgemach des Königs gesetzt war“; gemeint ist vermutlich ein Hofbeamter mit Zugang zu den privaten Gemächern des Königs.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „denn ihr Gebiet bezog seine Nahrungsmittel aus dem königlichen Land.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: war … gegenüber äußerst feindselig
  rationale: Das seltene Verb bezeichnet heftigen Zorn beziehungsweise eine ausgeprägt feindselige Haltung. Die Wiedergabe bewahrt die Intensität und lässt offen, ob sich die Feindschaft bereits in einem konkreten Konflikt äußerte.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: den Einwohnern von Tyrus und Sidon
  rationale: Die griechischen Volksbezeichnungen meinen die Bewohner der beiden Städte beziehungsweise ihrer Gebiete. Die Umschreibung ist im heutigen Deutsch natürlicher als „Tyrer und Sidonier“.
- source_word: ὁμοθυμαδόν
  choice: geschlossen
  rationale: Das Adverb bezeichnet gemeinsames, auf dasselbe Ziel gerichtetes Handeln. „Geschlossen“ drückt mehr als bloße gleichzeitige Anwesenheit aus, ohne zwingend formale Einstimmigkeit zu behaupten.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: kamen … zu ihm
  rationale: Die Wendung bezeichnet hier ihr Erscheinen beziehungsweise Herantreten bei Herodes und wird idiomatisch wiedergegeben.
- source_word: πείσαντες
  choice: für sich gewonnen hatten
  rationale: Das Partizip bezeichnet eine dem Friedensgesuch vorausgehende erfolgreiche Einflussnahme auf Blastus. Da der Gegenstand des Überzeugens nicht genannt ist, vermeidet „für sich gewonnen“ eine künstliche Ergänzung.
- source_word: Βλάστον
  choice: Blastus
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: den für das Schlafgemach des Königs zuständigen Beamten
  rationale: Die wörtlich auf das königliche Schlafgemach bezogene Amtsbeschreibung weist auf einen Hofbeamten mit Zugang zum privaten Bereich des Königs. Die Übersetzung ist verständlich und vermeidet das heute missverständliche „Kämmerer“.
- source_word: ᾐτοῦντο εἰρήνην
  choice: baten sie um Frieden
  rationale: Der Imperfekt beschreibt ihr fortgesetztes beziehungsweise nachdrückliches Ersuchen; im Deutschen vermittelt die einfache Präteritalform im Erzählzusammenhang den Vorgang natürlich.
- source_word: διὰ τὸ τρέφεσθαι
  choice: denn … wurde … mit Lebensmitteln versorgt
  rationale: Die Konstruktion mit διά und substantiviertem Infinitiv gibt den Grund an. Im Kontext bezeichnet τρέφω die Versorgung mit Nahrung.
- source_word: αὐτῶν τὴν χώραν
  choice: ihr Land
  rationale: χώρα bezeichnet hier das Gebiet der Einwohner von Tyrus und Sidon. „Land“ ist knapp, natürlich und geopolitisch nicht unnötig präzise.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: aus dem Herrschaftsgebiet des Königs
  rationale: Das substantivisch gebrauchte Adjektiv βασιλική verweist wahrscheinlich auf königliches Gebiet beziehungsweise königlichen Besitz. „Herrschaftsgebiet“ gibt diese Ellipse verständlich wieder, ohne es mit dem zuvor genannten Land gleichzusetzen.
