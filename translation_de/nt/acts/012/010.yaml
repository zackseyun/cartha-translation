id: ACT.12.10
reference: Acts 12:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: de
  text: Nachdem sie die erste und die zweite Wache passiert hatten, kamen sie zu dem eisernen Tor, das in die Stadt führte und sich ihnen von selbst[a] öffnete. Nachdem sie hinausgegangen waren, gingen sie eine Straße weit[b], und sofort verließ der Engel ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von allein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „eine Straße“. Wahrscheinlich gingen sie die Strecke einer Straße weit, bevor der Engel Petrus verließ.'
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Nachdem sie … vorbeigegangen waren
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Erreichen des Tores vorausgeht. Die temporale Formulierung gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: φυλακὴν … πρώτην … καὶ δευτέραν
  choice: am ersten und am zweiten Wachposten
  rationale: Im Zusammenhang sind aufeinanderfolgende bewachte Stellen gemeint. „Wachposten“ bezeichnet diese Kontrollpunkte klarer als das abstrakte „Wache“.
- source_word: πύλην τὴν σιδηρᾶν
  choice: dem eisernen Tor
  rationale: Die Materialangabe wird in üblicher deutscher Wortstellung wiedergegeben.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: das in die Stadt führte
  rationale: Das Partizip beschreibt, wohin das Tor Zugang gewährte; die finite Relativkonstruktion klingt im Deutschen natürlich.
- source_word: αὐτομάτη
  choice: von selbst
  rationale: Die Formulierung bewahrt die Aussage, dass sich das Tor ohne menschliches Zutun öffnete, ohne die modernen technischen Nebenbedeutungen von „automatisch“ einzutragen.
- source_word: ἠνοίγη αὐτοῖς
  choice: Es öffnete sich ihnen
  rationale: Das griechische Passiv und der Dativ werden idiomatisch wiedergegeben; das Tor bleibt Subjekt des Vorgangs.
- source_word: ἐξελθόντες
  choice: Sie gingen hinaus
  rationale: Das Aoristpartizip führt die nächste abgeschlossene Handlung der Erzählung ein. Ein selbstständiger deutscher Satz hält die rasche Erzählfolge klar.
- source_word: προῆλθον ῥύμην μίαν
  choice: gingen … eine Straße weit
  rationale: Die Wendung bezeichnet wahrscheinlich die zurückgelegte Strecke. „Eine Straße weit“ bewahrt zugleich die ungewöhnliche knappe Ausdrucksweise des Griechischen.
- source_word: εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: da verließ ihn der Engel sofort
  rationale: „Sofort“ gibt εὐθέως wieder; „verließ ihn“ ist eine natürliche deutsche Entsprechung für das Sich-Entfernen des Engels.
theological_decisions:
- issue: Art und Ursache der Toröffnung
  choice: Es öffnete sich ihnen von selbst
  alternative: Es wurde für sie geöffnet / es öffnete sich automatisch
  rationale: Der Text schildert das außergewöhnliche Geschehen, nennt an dieser Stelle aber keinen Handelnden. Die Übersetzung bewahrt diese Zurückhaltung und vermeidet eine technisch-mechanische Deutung.
- issue: Bedeutung von φυλακή
  choice: Wachposten
  alternative: Wache / Gefängnis
  rationale: Der Erzählzusammenhang legt aufeinanderfolgende Sicherungsstellen nahe. Die Übersetzung vermeidet die sachlich unwahrscheinliche Vorstellung mehrerer Gefängnisse, ohne zusätzliche Einzelheiten über deren Bauart einzuführen.
- issue: Reichweite von ῥύμην μίαν
  choice: eine Straße weit
  alternative: eine Straße entlang / in eine Straße
  rationale: Der Akkusativ kann die zurückgelegte Strecke bezeichnen. Die gewählte Fassung hält diese wahrscheinliche Bedeutung fest; die Fußnote weist auf den knappen griechischen Wortlaut hin.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzgliederung vermeidet einen überladenen Periodensatz, bewahrt aber die schnelle Abfolge der griechischen Erzählung. Beide Fußnotenmarker stehen unmittelbar an den erklärten Wendungen.
