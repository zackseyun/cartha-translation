  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: de
  text: Und Petrus ging hinaus und folgte ihm. Er wusste nicht, dass das, was durch den Engel geschah, tatsächlich geschah, sondern meinte, eine Vision zu sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Da ging Petrus hinaus
  rationale: Das vorzeitige Aoristpartizip wird im natürlichen deutschen Erzählstil als finites Verb wiedergegeben. Der Name Petrus verdeutlicht das im Zusammenhang eindeutige Subjekt, ohne den Sinn zu verändern.
- source_word: ἠκολούθει
  choice: folgte ihm
  rationale: Das Imperfekt bezeichnet die fortdauernde Handlung. „Folgte“ ist im deutschen Erzählstil natürlich; das ergänzte „ihm“ macht den im Kontext eindeutigen Bezug auf den Engel transparent.
- source_word: οὐκ ᾔδει
  choice: Er wusste nicht
  rationale: Direkte und allgemein verständliche Wiedergabe der fehlenden Kenntnis beziehungsweise Einsicht.
- source_word: ἀληθές
  choice: wirklich
  rationale: Im Gegensatz zur vermeintlichen Vision geht es um die Wirklichkeit des Geschehens; „wirklich“ trifft diesen erfahrungsbezogenen Sinn besser als das abstraktere „wahr“.
- source_word: τὸ γινόμενον
  choice: das, was … geschah
  rationale: Die substantivierte Partizipialform bezeichnet das sich ereignende Geschehen. Das Präteritum fügt sich natürlich in die deutsche Erzählung ein.
- source_word: διὰ τοῦ ἀγγέλου
  choice: durch den Engel
  rationale: διά mit Genitiv bezeichnet hier vermittelte Urheberschaft beziehungsweise Mittelwirkung. „Durch den Engel“ bewahrt diese Nuance, ohne eine weitergehende Aussage über eigenständige Macht des Engels einzutragen.
- source_word: ἐδόκει
  choice: meinte
  rationale: Das Verb bezeichnet hier Petrus’ subjektive Annahme. „Meinte“ ist idiomatisch und lässt den Gegensatz zur tatsächlichen Wirklichkeit klar hervortreten.
- source_word: ὅραμα
  choice: eine Vision
  rationale: „Vision“ ist die übliche, verständliche Wiedergabe für eine außergewöhnliche oder offenbarende Schau, ohne zusätzliche Deutung.
- source_word: βλέπειν
  choice: zu sehen
  rationale: Der Infinitiv wird formal und zugleich natürlich mit „zu sehen“ wiedergegeben.
theological_decisions:
- issue: Art des Wirkens des Engels
  choice: durch den Engel
  alternative: von dem Engel
  rationale: Die gewählte Formulierung erhält die durch διά mit Genitiv ausgedrückte vermittelte Agency und vermeidet eine über den Text hinausgehende Festlegung.
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Kurze Hauptsätze sorgen für Verständlichkeit; die Spannung zwischen realem Geschehen und vermeintlicher Vision bleibt unverändert erhalten.
