  source_fidelity: Die Übersetzung gibt die Abfolge von Hinausgehen und Folgen, Petrus’ mangelnde Erkenntnis, den Kontrast zwischen tatsächlichem Geschehen und Vision sowie die durch διά mit Genitiv ausgedrückte Mittler-/Agentivnuance zutreffend wieder. „Durch den Engel“ ist hierfür angemessen.
  naturalness: „Da ging Petrus hinaus“ ist möglich, aber das einleitende „Da“ fügt gegenüber dem schlichten καί einen stärkeren zeitlichen Anschluss hinzu. Vor allem ist „dass das, was … geschah, wirklich war“ im Deutschen zwar verständlich, aber wenig idiomatisch. „… tatsächlich geschah“ gibt den im Kontext gemeinten Wirklichkeitskontrast natürlich wieder.
  terminology: „Petrus“, „Engel“ und „Vision“ entsprechen dem etablierten modernen deutschen biblischen Sprachgebrauch. Die Formulierung vermeidet eine weitergehende theologische Deutung der Rolle des Engels.
