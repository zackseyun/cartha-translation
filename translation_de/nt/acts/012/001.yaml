  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: de
  text: Um jene Zeit ging König Herodes gegen einige aus der Gemeinde vor, um ihnen Schaden zuzufügen.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zu jener Zeit“; „Etwa um jene Zeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „legte Hand an einige“. Die Wendung bezeichnet ein feindseliges Vorgehen gegen einige aus der Gemeinde.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „um ihnen Übles anzutun“; „um sie schlecht zu behandeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Um jene Zeit
  rationale: κατά mit einer Zeitangabe im Akkusativ bezeichnet hier ungefähr den betreffenden Zeitraum. „Um jene Zeit“ ist im Deutschen natürlich und lässt den leichten Übergang durch δέ unaufdringlich mitklingen.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: ging ... gegen ... vor
  rationale: Die wörtliche Wendung „legte die Hände an“ bezeichnet im Kontext feindseliges Vorgehen. Die deutsche Wiedergabe bewahrt die Bedeutungsbreite, ohne das Handeln vorschnell auf eine Verhaftung zu beschränken.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: König Herodes
  rationale: Die im Deutschen übliche Titelform gibt die griechische Apposition klar und würdig wieder.
- source_word: κακῶσαί
  choice: um ihnen Gewalt anzutun
  rationale: Das Verb bezeichnet, dass jemandem Übles oder Schaden zugefügt wird. Die Formulierung passt zum herrscherlichen Vorgehen und legt sich nicht auf den engeren Fachbegriff „verfolgen“ fest.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: einige aus der Gemeinde
  rationale: Die Wendung bezeichnet einige Personen, die zur christlichen Gemeinschaft gehören. „Aus der Gemeinde“ ist knapp und natürlich.
- source_word: ἐκκλησία
  choice: Gemeinde
  rationale: In diesem Zusammenhang bezeichnet das Wort die örtliche christliche Gemeinschaft. „Gemeinde“ ist im modernen Deutschen verständlich und bildet stärker als „Kirche“ die Gruppe von Menschen ab.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία
  choice: Gemeinde
  alternative: Kirche; Versammlung
  rationale: Gemeint ist die christliche Gemeinschaft. „Gemeinde“ vermeidet eine mögliche Verengung auf Institution oder Gebäude, während „Versammlung“ im heutigen Deutsch zu situationsbezogen wirken kann.
- issue: Art des feindseligen Vorgehens
  choice: gegen einige ... vor, um ihnen Gewalt anzutun
  alternative: ließ einige ... verhaften; verfolgte einige
  rationale: Der griechische Ausdruck und der Zweckinfinitiv lassen verschiedene Formen schädigenden Vorgehens zu. Die Übersetzung hält diese Breite offen und nimmt die in den Folgeversen konkretisierten Maßnahmen nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig; die gewaltsame Handlung wird klar benannt, ohne sie enger zu bestimmen, als es der griechische Text erlaubt. Sämtliche Fußnotenmarker stehen im Haupttext.
