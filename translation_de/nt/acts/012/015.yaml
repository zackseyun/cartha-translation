id: ACT.12.15
reference: Acts 12:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: de
  text: 'Doch sie sagten zu ihr: »Du bist nicht bei Verstand!« Sie aber bestand darauf, dass es so sei. Da sagten sie immer wieder: »Es ist sein Engel.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sein Engel«. Gemeint sein könnte sein Schutzengel oder ein Engel, der ihn vertritt; nach einer anderen Deutung: sein Geist beziehungsweise Gespenst.'
    reason: Die knappe griechische Formulierung lässt offen, welche Vorstellung die Sprechenden genau mit Petrus’ »Engel« verbanden.
lexical_decisions:
- source_word: Μαίνῃ
  choice: Du bist nicht bei Verstand
  rationale: Die idiomatische Wendung gibt den Vorwurf des Verrücktseins kräftig, aber ohne unnötig klinische oder abwertende Sprache im modernen Deutsch wieder.
- source_word: διϊσχυρίζετο
  choice: sie bestand darauf
  rationale: Das Imperfekt und die verstärkende Bedeutung des Verbs bezeichnen ihr anhaltendes, nachdrückliches Beharren.
- source_word: οὕτως ἔχειν
  choice: dass es so sei
  rationale: Die natürliche deutsche Wendung entspricht der Aussage, dass die Sache sich tatsächlich so verhalte; der Konjunktiv fügt sich in die indirekte Rede ein.
- source_word: ἔλεγον
  choice: sie sagten immer wieder
  rationale: Das Imperfekt lässt hier fortgesetztes oder wiederholtes Reden erkennen, was durch »immer wieder« deutlich wird.
- source_word: ἄγγελός
  choice: Engel
  rationale: Im Kontext ist am ehesten ein übernatürliches Wesen gemeint; zugleich ist »Engel« die direkte und übliche Entsprechung, ohne dessen genaue Rolle festzulegen.
- source_word: αὐτοῦ
  choice: sein
  rationale: Der Genitiv wird in der Verbindung ὁ ἄγγελος αὐτοῦ natürlich als deutsches Possessivpronomen wiedergegeben.
theological_decisions:
- issue: Bedeutung von »sein Engel«
  choice: Die offene Formulierung »sein Engel« bleibt im Haupttext erhalten.
  alternative: sein Schutzengel; ein ihn vertretender Engel; sein Geist bzw. Gespenst
  rationale: Der griechische Text erklärt die Vorstellung der Sprechenden nicht näher. Eine Ausdeutung im Haupttext würde eine bestimmte angelologische oder anthropologische Auffassung eintragen und die echte Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Rede wird aspektuell sichtbar gemacht; die nicht erklärte Aussage über Petrus’ Engel bleibt bewusst offen.
