  to: Doch das Wort Gottes wuchs weiter und verbreitete sich.[a]
  rationale: Die Revision erhält den Kontrast von δέ mit „Doch“, die fortlaufende Entwicklung der beiden Imperfekte mit „wuchs weiter“ und „verbreitete sich“ und vor allem das gemeinsame Subjekt „das Wort Gottes“. Sie vermeidet die nicht im Text genannte Aussage, das Wort habe Menschen gewonnen.
