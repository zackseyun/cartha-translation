  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: de
  text: Doch das Wort Gottes wuchs weiter und verbreitete sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Doch das Wort Gottes wuchs und mehrte sich.“ Oder: „Doch Gottes Botschaft wuchs weiter und verbreitete sich.“'
    reason: Die Fußnote dokumentiert die bildhafte, formnähere Wiedergabe von ἐπληθύνετο und eine mögliche lexikalische Alternative für λόγος, ohne die Hauptfassung inhaltlich zu verengen.
lexical_decisions:
- source_word: λόγος
  choice: Wort
  rationale: „Wort Gottes“ bewahrt die wiederkehrende lukanische Wendung und ihre breite Bedeutung als von Gott kommende, verkündigte Botschaft.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: 'Der Genitiv wird natürlich als Zugehörigkeit beziehungsweise Herkunft wiedergegeben: das Wort, das Gott gehört und von ihm kommt.'
- source_word: ηὔξανεν
  choice: breitete sich immer weiter aus
  rationale: Der Imperfekt bezeichnet einen fortlaufenden Vorgang. Bei einer verkündigten Botschaft gibt „sich ausbreiten“ das bildhafte „wachsen“ in natürlichem Deutsch wieder.
- source_word: ἐπληθύνετο
  choice: gewann immer mehr Menschen
  rationale: Das medial-passive Imperfekt von πληθύνω bedeutet „sich vermehren/zahlreicher werden“. Im Zusammenhang sind die zunehmende Wirkung des Wortes und die wachsende Zahl der Glaubenden gemeint; die Formulierung macht dies verständlich, ohne die beiden Verben gleichzusetzen.
- source_word: δὲ
  choice: Doch
  rationale: '„Doch“ kennzeichnet den deutlichen Gegensatz zum unmittelbar zuvor berichteten Tod des Herodes: Der Verfolger vergeht, Gottes Wort schreitet weiter voran.'
theological_decisions:
- issue: Ob λόγος τοῦ θεοῦ wörtlich als „das Wort Gottes“ oder dynamischer als „Gottes Botschaft“ wiederzugeben ist
  choice: das Wort Gottes
  alternative: Gottes Botschaft
  rationale: Die traditionelle, weiterhin verständliche Wendung bewahrt Lukas’ wiederkehrenden Sprachgebrauch sowie die schriftbezogene und verkündigende Bedeutungsweite von λόγος.
- issue: Ob ἐπληθύνετο auf das Wort selbst oder auf die Zahl der Glaubenden bezogen auszudrücken ist
  choice: gewann immer mehr Menschen
  alternative: vermehrte sich
  rationale: Grammatisch bleibt „das Wort Gottes“ Subjekt beider Verben; sachlich beschreibt „sich vermehren“ wahrscheinlich seine wachsende Verbreitung und Wirkung. Die gewählte Fassung macht die Wirkung verständlich, während die Fußnote die formnähere Alternative erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ stellt den narrativen Kontrast knapp heraus. Die Hauptfassung vermeidet das im Deutschen ungewöhnliche Bild eines sich vermehrenden Wortes, während die Fußnote die griechische Metapher transparent hält.
