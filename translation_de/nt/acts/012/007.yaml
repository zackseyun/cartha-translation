source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: de
  text: 'Und siehe, ein Engel des Herrn trat zu ihm[a], und ein Licht leuchtete in dem Raum[b]. Er schlug Petrus an die Seite, weckte ihn und sagte: »Steh schnell auf!« Und die Ketten fielen ihm von den Händen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »stand bei ihm« oder »erschien plötzlich«. Das griechische Verb kann sowohl die Nähe als auch ein unvermitteltes Erscheinen betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gemach«. Der griechische Ausdruck ist allgemein; im Gefängniskontext kann ein Gefängnisraum oder eine Zelle gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: und sieh
  rationale: Bewahrt den lebhaften, aufmerksamkeitslenkenden Charakter des griechischen Erzählmarkers und bleibt zugleich verständlich.
- source_word: ἄγγελος κυρίου
  choice: ein Engel des Herrn
  rationale: Gibt die Genitivverbindung natürlich wieder und lässt offen, ob Zugehörigkeit oder Sendung im Vordergrund steht.
- source_word: ἐπέστη
  choice: plötzlich stand ... bei ihm
  rationale: Erfasst sowohl das Dabeistehen als auch das häufig mitschwingende unvermittelte Erscheinen; „bei ihm“ macht die räumliche Nähe im Kontext deutlich.
- source_word: φῶς ἔλαμψεν
  choice: ein Licht leuchtete
  rationale: Direkte und idiomatische Wiedergabe der Verbindung von Substantiv und Verb.
- source_word: ἐν τῷ οἰκήματι
  choice: in dem Gefängnisraum
  rationale: Der griechische Ausdruck bezeichnet allgemein einen Raum; die kontextuelle Präzisierung macht die Gefängnisszene klar, ohne zwingend eine moderne Einzelzelle vorauszusetzen.
- source_word: πατάξας τὴν πλευρὰν
  choice: stieß Petrus in die Seite
  rationale: Gibt die körperliche Einwirkung deutlich, aber im Zusammenhang des Aufweckens natürlich wieder.
- source_word: ἤγειρεν αὐτόν
  choice: weckte ihn
  rationale: Der Kontext zeigt, dass ἐγείρω hier das Aufwecken des schlafenden Petrus bezeichnet.
- source_word: Ἀνάστα ἐν τάχει
  choice: Steh schnell auf!
  rationale: Natürliche moderne Aufforderung, welche die Dringlichkeit des griechischen Ausdrucks wahrt.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: Da fielen ihm die Ketten von den Händen
  rationale: Bewahrt das plötzliche Herabfallen und gibt χεῖρες formal als „Hände“ statt deutender als „Handgelenke“ wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in ἄγγελος κυρίου
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ entspricht dem üblichen neutestamentlichen Gebrauch und fügt der Genitivverbindung keine zusätzliche konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sieh“ erhält die erzählerische Lebendigkeit des Originals; „Gefängnisraum“ vermeidet die möglicherweise zu enge Vorstellung einer modernen Einzelzelle.
