revisions:
- from: 'Und sieh: Plötzlich stand ein Engel des Herrn bei ihm[a], und ein Licht leuchtete in dem Gefängnisraum[b]. Der Engel stieß Petrus in die Seite, weckte ihn und sagte: »Steh schnell auf!« Da fielen ihm die Ketten von den Händen.'
  to: 'Und siehe, ein Engel des Herrn trat zu ihm[a], und ein Licht leuchtete in dem Raum[b]. Er schlug Petrus an die Seite, weckte ihn und sagte: »Steh schnell auf!« Und die Ketten fielen ihm von den Händen.'
  rationale: Die Revision entfernt die nicht zwingende explizite Zeitnuance »plötzlich« aus dem Haupttext, erhält sie aber transparent in der Fußnote. Sie gibt οἴκημα weniger einengend und idiomatischer wieder und präzisiert die körperliche Handlung mit einer im Deutschen natürlichen, dem griechischen πατάξας angemessenen Formulierung. Die Fußnotenanker bleiben an den jeweils erläuterten Ausdrücken.
