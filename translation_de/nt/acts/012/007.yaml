    rationale: οἴκημα ist ein allgemeiner Ausdruck für Raum/Gemach. Der Gefängniskontext erlaubt »Zelle«, doch »Raum« bewahrt die lexikalische Offenheit und die Anmerkung kann die kontextuelle Einordnung nennen.
