  source_fidelity: Die Fassung gibt den Satzbau und die zentralen Aussagen insgesamt zutreffend wieder. »Plötzlich« im Haupttext legt jedoch eine Nuance von ἐπέστη fest, die zwar möglich ist, aber nicht ausdrücklich ausgedrückt werden muss und in der Anmerkung besser als Alternative verbleibt. »Raum« wahrt bei οἴκημα die allgemeine Bedeutung; der Gefängniskontext ist bereits bekannt.
  naturalness: »Und siehe« ist als bewusst erzählerisch-markierte, dennoch verständliche Wiedergabe von ἰδού im modernen würdigen Standarddeutsch geeigneter als das etwas gesprochensprachliche »Und sieh«. »Er schlug Petrus an die Seite« ist für das Wecken idiomatisch und wahrt die stärkere körperliche Einwirkung von πατάξας.
  terminology: »Ein Engel des Herrn« und »Herrn« für κυρίου sind angemessen. »Ketten« und »Händen« geben ἁλύσεις und χεῖρες ohne zusätzliche Deutung wieder.
