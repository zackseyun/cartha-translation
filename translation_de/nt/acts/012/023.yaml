base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: de
  text: Sofort schlug ihn jedoch ein Engel des Herrn, weil er Gott nicht die Ehre gab[a]. Er wurde von Würmern zerfressen[b] und starb[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil er Gott die Ehre nicht erwies“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „wurmzerfressen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verschied er“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Sofort
  rationale: Das Adverb bezeichnet ein Geschehen ohne Verzögerung. „Sofort“ ist gegenwärtiges, natürliches Deutsch und bewahrt die Plötzlichkeit des Gerichts.
- source_word: ἐπάταξεν
  choice: schlug
  rationale: Das Verb bedeutet „schlagen“ oder „treffen“. „Schlug“ gibt die Handlung klar wieder, ohne mit „schlug nieder“ den später ausdrücklich genannten Tod vorwegzunehmen.
- source_word: ἄγγελος κυρίου
  choice: ein Engel des Herrn
  rationale: ἄγγελος steht ohne Artikel; daher ist hier die unbestimmte Wiedergabe vorzuziehen. „Des Herrn“ wahrt die übliche biblische Titulatur.
- source_word: ἀνθ’ ὧν
  choice: weil
  rationale: Die Wendung gibt den Grund für das Gericht an. „Weil“ drückt diese kausale Beziehung idiomatisch und eindeutig aus.
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: weil er Gott nicht die Ehre gab
  rationale: Die natürliche deutsche Wendung „Gott die Ehre geben“ bewahrt den Gedanken, dass Gott die ihm zustehende Ehre nicht zuerkannt wurde.
- source_word: γενόμενος σκωληκόβρωτος
  choice: Er wurde von Würmern zerfressen
  rationale: Die Formulierung gibt sowohl das Werden aus γενόμενος als auch das drastische Bild des seltenen Adjektivs σκωληκόβρωτος verständlich wieder, ohne eine medizinische Erklärung hinzuzufügen.
- source_word: ἐξέψυξεν
  choice: starb
  rationale: Das Verb bezeichnet das Aushauchen des Lebens und damit den Tod. „Starb“ ist die klare, natürliche Wiedergabe im modernen Deutschen.
theological_decisions:
- issue: Art und zeitlicher Ablauf des Gerichts
  choice: Der Tod wird als göttliches Gericht dargestellt, das durch einen Engel vermittelt wird; der genaue medizinische und zeitliche Ablauf bleibt offen.
  alternative: Die Aussage entweder als rein natürlichen Tod in religiöser Sprache oder als Tod genau im Augenblick des Schlages auszulegen.
  rationale: Der Text nennt ausdrücklich einen Engel des Herrn als Handelnden und die verweigerte Ehre Gottes als Grund. Die anschließende Partizipialkonstruktion erwähnt das Zerfressenwerden durch Würmer und den Tod, erlaubt aber keine weitergehende medizinische oder chronologische Rekonstruktion.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe, plötzliche Erzählweise und das drastische Bild des griechischen Textes bleiben erhalten; konfessionelle oder medizinische Deutungen werden nicht ergänzt.
