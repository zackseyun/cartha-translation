translation_notes:
  register: 'Modernes, würdiges Erzählungsdeutsch. Der Satzbau bewahrt die komische Dramatik des griechischen Textes: Rhoda erkennt Petrus, lässt ihn vor Freude dennoch draußen stehen und läuft zuerst hinein.'
