  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: de
  text: Als sie Petrus an der Stimme erkannte, öffnete sie vor Freude das Tor[a] nicht, sondern lief hinein und meldete, Petrus stehe vor dem Tor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Toreingang“ beziehungsweise „die äußere Tür“; gemeint ist der Zugang von der Straße zum Grundstück.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „meldete, Petrus stehe vor dem Tor“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου
  choice: als sie Petrus an der Stimme erkannte
  rationale: Die Formulierung gibt die beim Hören erfolgende Wiedererkennung idiomatisch wieder; der Genitiv bezeichnet Petrus als den, dessen Stimme erkannt wird.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: vor Freude
  rationale: Die Präpositionalphrase drückt den Grund ihres Handelns aus. „Vor Freude“ ist im Deutschen natürlich und bewahrt die lebhafte Erzählweise.
- source_word: οὐκ ἤνοιξεν
  choice: öffnete ... nicht
  rationale: ἀνοίγω bedeutet schlicht „öffnen“; eine Präzisierung als „aufschließen“ wäre vom griechischen Text nicht gedeckt.
- source_word: πυλῶνα / πυλῶνος
  choice: Tor
  rationale: πυλών bezeichnet hier den äußeren Zugang von der Straße zum Grundstück oder Hausbereich; „Tor“ ist dafür eine knappe, natürliche Entsprechung.
- source_word: εἰσδραμοῦσα
  choice: lief hinein
  rationale: Das Partizip bezeichnet eine schnelle Bewegung nach innen und erhält so das Erzähltempo.
- source_word: ἀπήγγειλεν
  choice: meldete
  rationale: ἀπαγγέλλω bezeichnet das Überbringen einer Nachricht; „meldete“ passt zum gehobenen, aber verständlichen Erzählregister.
- source_word: ἑστάναι
  choice: stehe
  rationale: Der perfekte Infinitiv hat stative Bedeutung. In der indirekten Rede gibt der Konjunktiv I diese fortdauernde Lage prägnant wieder.
- source_word: πρὸ τοῦ πυλῶνος
  choice: draußen vor dem Tor
  rationale: πρό mit Genitiv bedeutet „vor“. „Draußen“ verdeutlicht im Deutschen den im Kontext vorausgesetzten Gegensatz zu ihrem Hineinlaufen, ohne den Ort inhaltlich zu verändern.
