  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: de
  text: Als er an die Tür des Torhauses klopfte, kam eine junge Dienerin[a] namens Rhode, um zu horchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Sklavin“. Das griechische Wort παιδίσκη kann eine junge weibliche Hausbedienstete oder Sklavin bezeichnen; hier steht ihre Aufgabe im Haushalt im Vordergrund, während ihr rechtlicher Status offenbleibt.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Als er … klopfte
  rationale: Der Aoristpartizip mit δέ führt den nächsten Vorgang der Erzählung ein. „Als er … klopfte“ gibt den zeitlichen Zusammenhang natürlich wieder.
- source_word: θύραν τοῦ πυλῶνος
  choice: die Tür des Torgebäudes
  rationale: θύρα bezeichnet die Tür, πυλών den Torbau beziehungsweise Eingangsbereich eines Hauses. Die Formulierung bewahrt beide Bestandteile und passt zu einem größeren Stadthaus.
- source_word: προσῆλθε
  choice: kam
  rationale: προσέρχομαι bedeutet hier, dass sich die Person der Tür nähert; im Deutschen ist „kam“ in Verbindung mit der folgenden Zweckangabe natürlich.
- source_word: παιδίσκη
  choice: Dienerin
  rationale: Das Wort kann eine junge weibliche Hausbedienstete oder Sklavin bezeichnen. „Dienerin“ drückt ihre Funktion im Haushalt aus, ohne ihren rechtlichen Status festzulegen; die Alternative wird in der Fußnote genannt.
- source_word: ὑπακοῦσαι
  choice: um zu hören, wer da war
  rationale: ὑπακούω bedeutet wörtlich „hören“ und kann an einer Tür idiomatisch „auf das Klopfen reagieren“ heißen. Die deutsche Wendung macht die Situation verständlich, ohne vorwegzunehmen, dass die Tür geöffnet wurde.
- source_word: ὀνόματι Ῥόδη
  choice: namens Rhode
  rationale: Der Dativ ὀνόματι führt den Namen ein. „Rhode“ ist die im Deutschen eingebürgerte Form des griechischen Namens Ῥόδη.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Torgebäude“ bildet den häuslichen Eingangsbereich präziser ab als das möglicherweise missverständliche „Tor“; „um zu hören, wer da war“ entspricht dem antiken Reagieren auf ein Klopfen, ohne ein Öffnen der Tür zu behaupten.
