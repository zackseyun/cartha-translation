  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: de
  text: Herodes suchte nach ihm, fand ihn aber nicht. Daraufhin verhörte er die Wachen und befahl, sie abzuführen.[a] Dann zog er von Judäa hinab nach Cäsarea und hielt sich dort auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck bedeutet wörtlich, dass sie abgeführt oder weggeführt werden sollten. Im Zusammenhang ist wahrscheinlich gemeint, dass sie zur Hinrichtung abgeführt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν
  choice: ließ nach ihm suchen, fand ihn aber nicht
  rationale: Die beiden Aoristpartizipien bezeichnen Handlungen, die dem Verhör vorausgehen. Die finite deutsche Form gibt die Abfolge natürlich wieder; ἐπιζητέω bezeichnet hier eine gezielte Suche.
- source_word: ἀνακρίνας
  choice: verhörte
  rationale: Das Verb bezeichnet in diesem Zusammenhang eine amtliche beziehungsweise gerichtliche Befragung. „Verhörte“ bringt den Zwangs- und Untersuchungscharakter klarer zum Ausdruck als das allgemeinere „befragte“.
- source_word: τοὺς φύλακας
  choice: die Wachen
  rationale: Gemeint sind die mit der Bewachung des Petrus betrauten Männer. „Wachen“ ist im modernen Deutschen knapp und eindeutig.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: befahl, sie abzuführen
  rationale: ἀπάγω bedeutet zunächst „wegführen/abführen“. Eine Hinrichtung ist im Kontext sehr wahrscheinlich, wird vom griechischen Ausdruck jedoch nur impliziert. Der Haupttext bewahrt deshalb die sprachliche Offenheit; die Fußnote erläutert die wahrscheinliche Folge.
- source_word: κατελθὼν ἀπὸ τῆς Ἰουδαίας εἰς Καισάρειαν
  choice: Dann zog er von Judäa hinab nach Cäsarea
  rationale: „Hinabziehen“ bewahrt die antike geografische Ausdrucksweise für den Weg aus dem judäischen Hochland zur Küstenstadt Cäsarea.
- source_word: διέτριβεν
  choice: hielt sich dort auf
  rationale: Der Imperfekt beschreibt einen andauernden Aufenthalt. „Hielt sich dort auf“ gibt diesen durativen Sinn in würdigem, natürlichem Deutsch wieder.
theological_decisions:
- issue: Ob ἀπαχθῆναι ausdrücklich als Hinrichtungsbefehl wiederzugeben ist
  choice: befahl, sie abzuführen
  alternative: befahl, sie zur Hinrichtung abzuführen / befahl, sie hinzurichten
  rationale: Der Kontext legt die Hinrichtung der Wachen nahe, doch das griechische Verb benennt sie nicht ausdrücklich. Um die echte lexikalische Spannung nicht stillschweigend aufzulösen, bleibt der Haupttext formal näher an der Quelle und erklärt die wahrscheinliche Bedeutung in einer Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die partizipienreiche griechische Satzstruktur wurde für einen natürlichen deutschen Lesefluss in Hauptsätze aufgelöst. Die im Ausgangstext implizite, aber nicht ausdrücklich genannte Hinrichtung bleibt als solche in der Fußnote kenntlich.
