id: ACT.12.4
reference: Acts 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: de
  text: Nachdem er ihn festgenommen hatte, brachte er ihn ins Gefängnis und übergab ihn vier Abteilungen von Soldaten[a], die ihn bewachen sollten. Er hatte vor, ihn nach dem Passafest[b] vor das Volk zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vier Vierergruppen von Soldaten“, also vier Abteilungen mit jeweils vier Soldaten.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet das Passa; in einigen älteren Übersetzungen steht hier „Ostern“.
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: nachdem er ihn festgenommen hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Einsperren vorausgeht. „Festgenommen“ gibt die Ingewahrsamnahme in natürlichem modernem Deutsch wieder.
- source_word: ἔθετο εἰς φυλακήν
  choice: brachte er ihn ins Gefängnis
  rationale: Die Wendung wird idiomatisch wiedergegeben; „Gefängnis“ bewahrt den sachlich-erzählenden Ton.
- source_word: παραδοὺς
  choice: übergab ihn
  rationale: Das Partizip bezeichnet die Übergabe in die Obhut beziehungsweise Bewachung durch die Soldaten.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: vier Abteilungen von Soldaten
  rationale: „Abteilungen“ ist verständlich und militärisch passend; die genaue Stärke von jeweils vier Soldaten wird in der Fußnote bewahrt.
- source_word: φυλάσσειν αὐτόν
  choice: die ihn bewachen sollten
  rationale: Der finale Infinitiv wird als deutscher Zwecksatz wiedergegeben und bezeichnet den Auftrag der Soldaten.
- source_word: βουλόμενος
  choice: Er hatte vor
  rationale: Die Form drückt Herodes’ beabsichtigtes Vorgehen aus, ohne einen stärkeren Beschluss zu behaupten, als der Text erkennen lässt.
- source_word: μετὰ τὸ πάσχα
  choice: nach dem Passafest
  rationale: πάσχα bezeichnet hier das jüdische Passa; „Passafest“ ist im Deutschen eindeutig und kontextgerecht.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: ihn vor das Volk zu bringen
  rationale: Die Formulierung gibt das öffentliche Vorführen wieder, ohne ausdrücklich ein Gerichtsverfahren oder eine Hinrichtung in den Wortlaut einzutragen.
- source_word: λαῷ
  choice: das Volk
  rationale: Die einfache Wiedergabe lässt den Ausdruck wie im Griechischen allgemein und bezeichnet die versammelte Öffentlichkeit beziehungsweise Bevölkerung.
theological_decisions:
- issue: Wiedergabe von πάσχα
  choice: Passafest
  alternative: Ostern
  rationale: Das griechische πάσχα bezeichnet das Passa. „Ostern“ beruht an dieser Stelle auf späterer Übersetzungstradition und ist nicht die unmittelbare lexikalische Bedeutung.
- issue: Zweck des öffentlichen Vorführens
  choice: vor das Volk zu bringen
  alternative: dem Volk zur Hinrichtung vorzuführen
  rationale: Der Zusammenhang kann eine Hinrichtung nahelegen, doch der Vers selbst nennt sie nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die beiden griechischen Partizipien werden zur besseren Lesbarkeit teils als Nebensatz, teils als koordinierter Hauptsatz wiedergegeben. Sachverhalte, die nur aus dem Kontext erschlossen werden könnten, werden nicht in den Haupttext aufgenommen.
