  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: de
  text: Als ich aber zu sprechen begann,[a] fiel der Heilige Geist auf sie, wie er am Anfang auch auf uns gefallen war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als ich anfing zu sprechen.“ Die griechische Konstruktion kann den Zeitpunkt oder die Gleichzeitigkeit hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: „Am Anfang“ bezieht sich wahrscheinlich auf die anfängliche Ausgießung des Geistes auf die Jünger, also auf das Pfingstgeschehen.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: Als ich aber zu sprechen begann
  rationale: Die Verbindung aus ἐν und substantiviertem Infinitiv bezeichnet hier die Gleichzeitigkeit. „Als ich … begann“ ist im Deutschen natürlich und zeigt, dass der Geist gleich zu Beginn des Redens kam; δέ wird mit „aber“ wiedergegeben.
- source_word: ἐπέπεσεν
  choice: fiel … auf
  rationale: Die anschauliche Wendung ἐπιπίπτω ἐπί bezeichnet in der Apostelgeschichte das machtvolle Kommen des Geistes auf Menschen. „Fiel auf“ erhält dieses Bild, ohne die Art des Geschehens weiter auszudeuten.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Dies ist die sachgerechte und im heutigen Standarddeutsch übliche Wiedergabe.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: genauso wie … auch auf uns
  rationale: „Genauso wie“ bewahrt den ausdrücklichen engen Vergleich; „auch“ gibt καί wieder. Das bereits genannte Verb „fiel“ ist im Deutschen sinngemäß mitzudenken.
- source_word: ἐν ἀρχῇ
  choice: am Anfang
  rationale: Die Formulierung bewahrt den zeitlichen Bezug, ohne ihn im Haupttext ausdrücklich mit Pfingsten gleichzusetzen.
theological_decisions:
- issue: Bezug von ἐν ἀρχῇ („am Anfang“)
  choice: Die zeitlich offene Formulierung „am Anfang“ bleibt im Haupttext erhalten.
  alternative: „Damals, zu Pfingsten“ oder allgemein „zuerst“.
  rationale: Im Zusammenhang liegt der Beginn der Geistausgießung unter den Jüngern, besonders das Pfingstgeschehen, nahe. Der griechische Wortlaut nennt Pfingsten jedoch nicht ausdrücklich, weshalb die Übersetzung diese Deutung nicht in den Haupttext einträgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Aussage „der Heilige Geist fiel auf sie“ wurde trotz ihrer leichten Fremdheit bewahrt, weil sie dem markanten griechischen Ausdruck entspricht. Die Wortstellung stellt den Vergleich zwischen „ihnen“ und „uns“ klar heraus.
