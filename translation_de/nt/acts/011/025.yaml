  text: Dann brach er nach Tarsus auf, um Saul zu suchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um nach Saul zu suchen“ oder „um Saul aufzusuchen“.'
