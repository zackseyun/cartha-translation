lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ging
  rationale: Der Aorist von ἐξέρχομαι bezeichnet hier im Zusammenhang eine Ortsveränderung. Im Deutschen gibt „ging“ die Bewegung natürlich wieder; „ging hinaus“ würde ohne ausdrücklich genannten Ausgangsort schwerfällig wirken.
- source_word: δὲ
  choice: Dann
  rationale: δέ führt die Erzählung hier mit einer milden Verknüpfung weiter, ohne einen deutlichen Gegensatz auszudrücken. „Dann“ entspricht natürlichem deutschem Erzählstil.
- source_word: εἰς Ταρσόν
  choice: nach Tarsus
  rationale: εἰς bezeichnet bei einem Bewegungsverb das Ziel. Für Städtenamen ist „nach Tarsus“ die idiomatische deutsche Wiedergabe.
- source_word: ἀναζητῆσαι
  choice: um … zu suchen
  rationale: Der Aoristinfinitiv bezeichnet den Zweck des Gehens. „suchen“ ist klar und bewahrt die mögliche Nachdrücklichkeit des mit ἀνά- gebildeten Verbs, ohne bereits ausdrücklich zu sagen, dass Saul gefunden wurde.
- source_word: Σαῦλον
  choice: Saul
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
