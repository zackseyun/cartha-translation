  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: de
  text: Da beschlossen die Jünger, jeder nach seinen Möglichkeiten, den Brüdern[b], die in Judäa wohnten, eine Unterstützung zu schicken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »je nachdem, wie gut es jemandem ging«; gemeint ist: entsprechend dem, was jeder aufbringen konnte.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Brüdern« sind hier die Glaubenden in Judäa gemeint; der männliche Plural kann dabei auch Frauen einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: die Jünger
  rationale: Der in der Apostelgeschichte etablierte Ausdruck bezeichnet die Schüler und Anhänger Jesu.
- source_word: καθὼς εὐπορεῖτό τις
  choice: jeder nach seinen Möglichkeiten
  rationale: Die Wendung bezeichnet den jeweiligen materiellen Spielraum; zusammen mit ἕκαστος wird ihr distributiver Sinn natürlich wiedergegeben.
- source_word: ὥρισαν
  choice: beschlossen
  rationale: ὁρίζω bezeichnet hier eine bewusste, gemeinsame Entscheidung.
- source_word: εἰς διακονίαν πέμψαι
  choice: eine Unterstützung zu schicken
  rationale: διακονία bezeichnet im Zusammenhang konkrete Hilfe; im Deutschen gibt die Verbindung mit πέμψαι den gemeinten Hilfsbeitrag idiomatisch wieder, ohne seine genaue Form festzulegen.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς
  choice: den Brüdern, die in Judäa wohnten
  rationale: Die substantivierte Partizipialkonstruktion wird als natürlicher Relativsatz wiedergegeben; ἀδελφοῖς bleibt als formal männlicher Verwandtschaftsbegriff erhalten.
theological_decisions:
- issue: Umfang des gemeinschaftlichen Ausdrucks ἀδελφοῖς
  choice: den Brüdern
  alternative: den Brüdern und Schwestern; den Glaubensgeschwistern
  rationale: Die Übersetzung wahrt die männliche Form des griechischen Ausdrucks, während eine Fußnote darauf hinweist, dass er im frühchristlichen Sprachgebrauch die gesamte, möglicherweise gemischte Glaubensgemeinschaft bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt den gemeinsamen Beschluss und anschließend die nach den jeweiligen Mitteln bemessene Beteiligung heraus. »Unterstützung« vermittelt die konkrete Hilfeleistung natürlicher als das in diesem Zusammenhang missverständliche »Dienst«.
