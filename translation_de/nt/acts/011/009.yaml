  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂φωνὴ ἐκ δευτέρου⸃ ἐκ τοῦ οὐρανοῦ· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: de
  text: 'Doch zum zweiten Mal antwortete eine Stimme aus dem Himmel: »Was Gott gereinigt hat, sollst du nicht für unrein erklären.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »sollst du nicht für gemein oder profan erklären«; im Zusammenhang ist damit die Einstufung als kultisch unrein gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das deponentische Verb bedeutet hier „antwortete“ beziehungsweise „erwiderte“ und passt zur erzählten Abfolge.
- source_word: φωνὴ
  choice: eine Stimme
  rationale: Die artikellose Nominalphrase wird ohne nähere Bestimmung wiedergegeben und legt den Sprecher nicht über den griechischen Text hinaus fest.
- source_word: ἐκ δευτέρου
  choice: zum zweiten Mal
  rationale: Die feste Wendung bezeichnet die zweite Wiederholung und wird im Deutschen idiomatisch so ausgedrückt.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel
  rationale: Im Zusammenhang der Vision bezeichnet οὐρανός den Himmel als Herkunft der Stimme, nicht lediglich den sichtbaren Luftraum.
- source_word: Ἃ
  choice: Was
  rationale: Das substantivierte sächliche Relativpronomen im Plural lässt sich im Deutschen natürlich und umfassend mit „Was“ wiedergeben.
- source_word: ἐκαθάρισεν
  choice: gereinigt hat
  rationale: Das Verb bezeichnet Gottes vollzogene Reinigung; das deutsche Perfekt bringt die abgeschlossene Handlung mit fortdauernder Geltung natürlich zum Ausdruck.
- source_word: σὺ μὴ κοίνου
  choice: sollst du nicht für unrein erklären
  rationale: Das ausdrücklich gesetzte σὺ wird durch die Stellung von „du“ bewahrt. κοινόω bezeichnet im jüdischen Reinheitszusammenhang die Einstufung als gewöhnlich, profan beziehungsweise kultisch unrein; „für unrein erklären“ vermittelt diesen Sinn im heutigen Deutsch verständlich.
theological_decisions:
- issue: Bedeutungsumfang der Reinheitssprache bei κοινόω
  choice: für unrein erklären
  alternative: für gemein beziehungsweise profan erklären
  rationale: „Gemein“ wäre formal näher an κοινόω, wird im modernen Deutsch jedoch meist als „niederträchtig“ oder „gewöhnlich“ verstanden und könnte irreführen. Die Hauptfassung gibt daher die kultische Einstufung verständlich wieder; die wörtlichere Kategorie „gemein/profan“ bleibt in der Fußnote sichtbar, sodass der Gegensatz zwischen Gottes Reinigung und menschlicher Einordnung nicht eingeebnet wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist klar und knapp gehalten; die ungewöhnliche Reinheitskategorie des griechischen Textes wird im Haupttext verständlich und in der Fußnote formal genauer wiedergegeben.
