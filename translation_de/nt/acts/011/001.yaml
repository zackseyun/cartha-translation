id: ACT.11.1
reference: Acts 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: de
  text: Die Apostel und die Brüder[a], die in ganz Judäa lebten, hörten, dass auch die Nichtjuden das Wort Gottes angenommen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Brüder und Schwestern“; das griechische Wort lautet „Brüder“ und kann hier die Glaubenden insgesamt bezeichnen.
    reason: Lexikalische Alternative und Hinweis auf den möglichen inklusiven Bedeutungsumfang.
lexical_decisions:
- source_word: Ἤκουσαν
  choice: hörten
  rationale: Der Aorist von ἀκούω bezeichnet hier das Bekanntwerden einer Nachricht. „Hörten“ gibt die Wahrnehmung dieser Nachricht unmittelbar und idiomatisch wieder.
- source_word: δὲ
  choice: nicht ausdrücklich wiedergegeben
  rationale: δέ markiert hier einen lockeren narrativen Übergang, keinen deutlichen Gegensatz. Im modernen Deutschen ist dafür am Satzanfang kein eigenes Bindewort nötig.
- source_word: οἱ ἀπόστολοι
  choice: die Apostel
  rationale: Der etablierte Ausdruck bezeichnet in der Apostelgeschichte die anerkannte Gruppe der Apostel.
- source_word: οἱ ἀδελφοὶ
  choice: die Brüder
  rationale: Die grammatisch maskuline Pluralform wird formnah wiedergegeben; dass der Ausdruck die Glaubensgemeinschaft einschließlich Frauen bezeichnen kann, wird in einer Fußnote erläutert.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: in ganz Judäa
  rationale: 'Die knappe Ortsangabe gibt den distributiven Sinn von κατά wieder: Die Brüder befanden sich über Judäa verteilt.'
- source_word: Ἰουδαίαν
  choice: Judäa
  rationale: Dies ist die gebräuchliche deutsche Bezeichnung der Region.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet den Inhalt dessen ein, was die Apostel und Brüder hörten.
- source_word: καὶ
  choice: auch
  rationale: '„Auch“ bewahrt den additiven Akzent: Neben Juden hatten nun ebenso Nichtjuden Gottes Wort angenommen.'
- source_word: τὰ ἔθνη
  choice: die Nichtjuden
  rationale: Im Kontext bezeichnet τὰ ἔθνη Menschen aus den Völkern außerhalb des Judentums. „Nichtjuden“ ist im heutigen Deutsch klarer und weniger missverständlich als „Heiden“.
- source_word: ἐδέξαντο
  choice: angenommen hatten
  rationale: δέχομαι bezeichnet hier die positive Aufnahme der verkündigten Botschaft. Das Plusquamperfekt macht natürlich deutlich, dass dies vor dem Bekanntwerden geschah.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die traditionelle und weiterhin verständliche Wendung bewahrt den frühchristlichen Ausdruck für die von Gott kommende verkündigte Botschaft.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφοὶ in der Glaubensgemeinschaft
  choice: Brüder mit erläuternder Fußnote
  alternative: Brüder und Schwestern; Glaubensgeschwister
  rationale: „Brüder“ wahrt die grammatische Form des griechischen Textes, während die Fußnote offenlegt, dass der Ausdruck hier wahrscheinlich die Glaubenden insgesamt und damit auch Frauen einschließt.
- issue: Wiedergabe von τὰ ἔθνη
  choice: Nichtjuden
  alternative: Völker; Heiden
  rationale: Der Zusammenhang handelt von der Aufnahme nichtjüdischer Menschen in die glaubende Gemeinschaft. „Nichtjuden“ benennt diesen Gegensatz präzise, ohne die heute oft abwertende Nebenbedeutung von „Heiden“ einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah an der griechischen Satzstruktur, vermeidet jedoch einen im Deutschen unnötigen einleitenden Diskursmarker. „Nichtjuden“ dient der unmittelbaren Verständlichkeit; „das Wort Gottes“ bewahrt die biblische Ausdrucksweise.
