  to: Ich schaute aufmerksam hinein, betrachtete es genau und sah die vierfüßigen Tiere der Erde, die wilden Tiere, die Kriechtiere[a] und die Vögel des Himmels.
  rationale: Die einzige Änderung ersetzt die interpretierend ergänzende Angabe »alles« durch »es«. Dadurch bleibt der Bezug auf das zuvor genannte Tuch beziehungsweise Behältnis erhalten und der Text folgt dem Griechischen enger, ohne an natürlichem Deutsch zu verlieren.
