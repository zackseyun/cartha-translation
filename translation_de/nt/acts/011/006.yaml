source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: de
  text: Ich schaute aufmerksam hinein, betrachtete es genau und sah die vierfüßigen Tiere der Erde, die wilden Tiere, die Kriechtiere[a] und die Vögel des Himmels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alles, was kriecht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: hinein
  rationale: Die Wendung bezieht sich auf das zuvor genannte Behältnis im Gesicht. Bei ἀτενίζω bezeichnet εἰς die Richtung des Blicks; »hinein« gibt dies im Deutschen knapp und natürlich wieder.
- source_word: ἀτενίσας
  choice: Ich schaute aufmerksam
  rationale: Das Partizip bezeichnet einen konzentrierten, anhaltend gerichteten Blick. »Aufmerksam schauen« ist modern und würdevoll, ohne die übermäßig harte Nuance von »starren«.
- source_word: κατενόουν
  choice: betrachtete alles genau
  rationale: Das Imperfekt beschreibt eine fortdauernde, prüfende Wahrnehmung und bleibt so vom anschließenden punktuellen εἶδον unterschieden. Das ergänzte »alles« hat als Bezug den Inhalt des Behältnisses und vermeidet im Deutschen eine schwerfällige Wiederholung von »es«.
- source_word: εἶδον
  choice: sah
  rationale: Die einfache Vergangenheitsform bildet den Aorist klar ab und unterscheidet das Wahrnehmen vom vorausgehenden genauen Betrachten.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: die vierfüßigen Tiere der Erde
  rationale: Die Formulierung bewahrt die konkrete Einteilung des griechischen Textes sowie dessen Anklang an biblische Schöpfungs- und Reinheitskategorien.
- source_word: τὰ θηρία
  choice: die wilden Tiere
  rationale: »Wilde Tiere« gibt θηρία verständlich wieder und wahrt die Unterscheidung von der allgemeineren Gruppe der vierfüßigen Tiere.
- source_word: τὰ ἑρπετά
  choice: die Kriechtiere
  rationale: »Kriechtiere« ist eine natürliche deutsche Sammelbezeichnung und breiter als das biologisch enger gefasste »Reptilien«. Die noch allgemeinere Alternative »alles, was kriecht« wird in der Fußnote genannt.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel des Himmels
  rationale: »Vögel« ist in diesem Tierkatalog die natürliche Wiedergabe von πετεινά. »Des Himmels« erhält die traditionelle biblische Kategorienbildung, ohne hier den jenseitigen Himmel zu bezeichnen.
