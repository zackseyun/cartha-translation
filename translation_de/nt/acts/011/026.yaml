id: ACT.11.26
reference: Acts 11:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: de
  text: Als er ihn gefunden hatte, brachte er ihn nach Antiochia. Ein ganzes Jahr lang kamen sie mit der Gemeinde zusammen[a] und lehrten eine große Zahl von Menschen. In Antiochia wurden die Jünger zum ersten Mal Christen genannt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „versammelten sie sich in der Gemeinde“. Gemeint ist wahrscheinlich das Zusammenkommen mit der christlichen Gemeinschaft, nicht ein Kirchengebäude.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wurden zuerst Christen genannt“. Wer ihnen diese Bezeichnung gab, sagt der griechische Text nicht.'
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: als er ihn gefunden hatte
  rationale: Das temporale Gefüge gibt das vorzeitige Aoristpartizip im Deutschen natürlich und in der richtigen Handlungsfolge wieder.
- source_word: ἤγαγεν
  choice: brachte er ihn
  rationale: ἄγω bezeichnet hier, dass Barnabas Saulus nach Antiochia bringt; „brachte“ ist im Kontext natürlicher als „führte“.
- source_word: ἐνιαυτὸν ὅλον
  choice: ein ganzes Jahr lang
  rationale: Die temporale Akkusativangabe wird klar und idiomatisch wiedergegeben.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: kamen sie mit der Gemeinde zusammen
  rationale: Die Wiedergabe versteht ἐκκλησία als christliche Gemeinschaft und vermeidet den irreführenden Eindruck eines Kirchengebäudes; die mögliche Nuance „versammelten sich in der Gemeinde“ bleibt in der Fußnote sichtbar.
- source_word: ἐκκλησίᾳ
  choice: Gemeinde
  rationale: In diesem Zusammenhang bezeichnet ἐκκλησία die örtliche christliche Gemeinschaft; „Gemeinde“ ist im modernen Deutschen eindeutig und natürlich.
- source_word: ὄχλον ἱκανόν
  choice: eine große Zahl von Menschen
  rationale: ἱκανός bezeichnet hier eine beträchtliche Menge. Die natürliche deutsche Wendung vermeidet das möglicherweise unpassende Bild einer Menschenmenge während des gesamten Lehrdienstes.
- source_word: χρηματίσαι
  choice: wurden … genannt
  rationale: Das Verb bezeichnet hier die öffentliche Benennung oder Bezeichnung einer Gruppe; die passive Form bewahrt, dass der Namensgeber nicht genannt wird.
- source_word: πρώτως
  choice: zum ersten Mal
  rationale: Die Wendung bezeichnet den ersten belegten Gebrauch der Gruppenbezeichnung und ist im Deutschen eindeutig.
- source_word: Χριστιανούς
  choice: Christen
  rationale: Χριστιανοί ist eine etablierte Gruppenbezeichnung. „Christen“ ist das natürliche und semantisch entsprechende deutsche Äquivalent; eine etymologisierende Neubildung wäre irreführend.
theological_decisions:
- issue: Wiedergabe der Gruppenbezeichnung Χριστιανούς trotz möglicher Übersetzung von Χριστός als „Messias“
  choice: Christen
  alternative: Messianer
  rationale: Hier steht nicht lediglich der Titel Χριστός, sondern die bereits als Gruppenname gebrauchte Bildung Χριστιανοί. „Christen“ bewahrt die erkennbare historische Bezeichnung, ohne eine besondere konfessionelle Deutung einzutragen.
- issue: Nicht genannter Urheber der Bezeichnung
  choice: wurden … Christen genannt
  alternative: nannten sich Christen
  rationale: Die griechische Form benennt nicht, wer die Bezeichnung vergab. Die passive Wiedergabe wahrt diese Offenheit und behauptet weder Selbstbezeichnung noch Fremdbezeichnung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Gemeinde“ vermeidet die im Deutschen bei „Kirche“ naheliegende Gebäudebedeutung. Die Satzteilung hebt die erstmalige Benennung der Jünger hervor, ohne eine stärkere syntaktische Betonung einzutragen, als der griechische Text verlangt.
