  text: ὃ καὶ ἐποίησαν ἀποστείλαντες πρὸς τοὺς πρεσβυτέρους διὰ χειρὸς Βαρναβᾶ καὶ Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: de
  text: Das taten sie auch und schickten die Gabe durch Barnabas und Saulus an die Ältesten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand von Barnabas und Saulus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: Das taten sie auch
  rationale: Das neutrale Relativpronomen ὃ verweist auf die im vorigen Vers beschlossene Hilfeleistung. Die deutsche Wendung gibt den Rückbezug knapp und natürlich wieder; καί wird hier als hervorhebendes „auch“ verstanden.
- source_word: ἀποστείλαντες
  choice: und schickten
  rationale: Das Aoristpartizip bezeichnet die Handlung, durch die der zuvor gefasste Beschluss ausgeführt wurde. Eine koordinierte deutsche Verbform klingt natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: implicit object from context
  choice: die Gabe
  rationale: Im Griechischen bleibt das Objekt unausgesprochen und ist aus Vers 29 als Unterstützung für die Geschwister erschließbar. „Die Gabe“ macht den deutschen Satz verständlich, ohne Art oder Umfang der Hilfe näher festzulegen.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: an die Ältesten
  rationale: πρεσβύτεροι bezeichnet hier anerkannte Leiter der Gemeinde. „Älteste“ ist im Deutschen verständlich und entspricht dem frühchristlichen Sprachgebrauch.
- source_word: διὰ χειρὸς
  choice: durch
  rationale: Die griechische Wendung bezeichnet die vermittelnde Tätigkeit beauftragter Überbringer. „Durch“ gibt die Funktion im modernen Deutsch idiomatisch wieder; der wörtliche Ausdruck wird in einer Fußnote dokumentiert.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Barnabas und Saulus
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Formen; Σαῦλος wird als „Saulus“ wiedergegeben.
