source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: de
  text: 'Doch ich sagte: »Auf keinen Fall, Herr! Denn noch nie ist etwas Unheiliges oder Unreines in meinen Mund gekommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Auf keinen Fall
  rationale: Gibt die nachdrückliche Zurückweisung natürlich und deutlich wieder.
- source_word: κοινὸν
  choice: Unheiliges
  rationale: κοινός bezeichnet hier im Gegensatz zu kultisch Heiligem etwas Profanes beziehungsweise kultisch Unzulässiges; »gewöhnlich« wäre im Deutschen missverständlich.
- source_word: ἀκάθαρτον
  choice: Unreines
  rationale: Bewahrt den kultisch-religiösen Sinn von »unrein« im Zusammenhang der Speisevorschriften.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: ist … in meinen Mund gekommen
  rationale: Folgt der bildhaften Formulierung des Griechischen, ohne sie unnötig zu »gegessen« zu glätten.
theological_decisions:
- issue: Verhältnis von κοινόν und ἀκάθαρτον
  choice: »Unheiliges oder Unreines« als zwei unterscheidbare, aber zusammengehörige Kategorien
  alternative: »Verunreinigtes oder Unreines« beziehungsweise eine zusammengezogene Kategorie
  rationale: Die disjunktive Formulierung mit ἢ bleibt erhalten; zugleich wird kein bestimmtes späteres System kultischer Kategorien in den Text hineingelesen.
- issue: Anrede κύριε
  choice: Herr
  alternative: Herr! als bloße höfliche Anrede ohne christologischen Bezug
  rationale: Die Übersetzung bewahrt die Anrede und lässt offen, wie genau Petrus den Sprecher in der Vision zu diesem Zeitpunkt versteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich natürlich; »Unheiliges« und »Unreines« bewahren den kultischen Kontext, ohne altertümlich zu wirken.
