  source_fidelity: Die Übersetzung gibt die entschiedene Ablehnung (Μηδαμῶς), die Anrede κύριε, die Begründung ὅτι sowie die temporale Aussage οὐδέποτε sachgerecht wieder. »Unheiliges oder Unreines« bewahrt die vom Griechischen unterschiedenen Kategorien κοινόν und ἀκάθαρτον sowie ihre Reihenfolge. »Ist ... in meinen Mund gekommen« entspricht der bildhaften griechischen Wendung, ohne den Sinn zu verändern.
