  source_fidelity: 'Die Grundstruktur ist zutreffend: χεὶρ κυρίου wird als traditionsreiches Bild bewahrt, μετ’ αὐτῶν korrekt mit „mit ihnen“ wiedergegeben, und ἐπέστρεψεν ἐπὶ τὸν κύριον angemessen als Hinwendung zum Herrn. „zum Glauben kamen“ ist jedoch gegenüber πιστεύσας stärker inchoativ als der griechische Text; „glaubten“ gibt das Partizip unmittelbarer wieder, ohne eine Entwicklung oder zeitliche Abfolge einzutragen.'
  naturalness: „Und die Hand des Herrn war mit ihnen“ sowie „eine große Zahl von Menschen, die glaubten, wandte sich dem Herrn zu“ sind natürliches modernes Standarddeutsch mit angemessen würdigem Register. Der Relativsatz ist klar und bildet die kollektive Funktion des artikulären Partizips idiomatisch ab.
  terminology: „Hand des Herrn“ und „Herr“ sind sachgerecht und bewahren sowohl die biblische Bildsprache als auch die im griechischen Wortlaut offene Referenz von κύριος. „wandte sich dem Herrn zu“ trifft den Bekehrungs- bzw. Hinwendungssinn von ἐπιστρέφω ἐπί, ohne „Buße“ oder eine Rückkehr zu einer früheren Beziehung zu ergänzen.
