  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: de
  text: Und die Hand des Herrn war mit ihnen[a], und eine große Zahl von Menschen, die glaubten[b], wandte sich dem Herrn zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »die Hand des Herrn« ist ein biblisches Bild für seine wirksame Macht oder Gunst.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die gläubig geworden waren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: die Hand des Herrn
  rationale: Die wörtliche Wiedergabe bewahrt das biblische Bild für die wirksame Macht und Gunst des Herrn sowie seine intertextuellen Bezüge.
- source_word: κύριος
  choice: Herr
  rationale: Der feste Titel wird beibehalten; der mögliche Bezug auf Jesus wird nicht durch eine ausdrückliche Ergänzung festgelegt.
- source_word: μετ’ αὐτῶν
  choice: mit ihnen
  rationale: μετά mit Genitiv bezeichnet hier am natürlichsten die begleitende Gegenwart und Unterstützung des Herrn.
- source_word: πολύς τε ἀριθμός
  choice: eine große Zahl von Menschen
  rationale: Die Formulierung gibt die nominale Mengenangabe idiomatisch wieder; „von Menschen“ macht den im Griechischen vorausgesetzten Personenbezug im Deutschen deutlich.
- source_word: ὁ πιστεύσας
  choice: die zum Glauben kamen
  rationale: Das substantivierte Aoristpartizip bezeichnet kollektiv diejenigen, die glaubten. Die Formulierung ist im modernen Deutsch natürlich, ohne das zeitliche Verhältnis zum Sich-Zuwenden eindeutig festzulegen.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: wandte sich dem Herrn zu
  rationale: Die Wendung bewahrt den Sinn einer Hinwendung beziehungsweise Bekehrung, ohne ausdrücklich „Buße“ hinzuzufügen oder durch „kehrte zurück“ eine frühere Beziehung vorauszusetzen.
theological_decisions:
- issue: Bezug von κύριος in diesem Zusammenhang
  choice: In beiden Fällen schlicht „Herr“
  alternative: Den Herrn ausdrücklich als Jesus oder allgemeiner als Gott bestimmen
  rationale: Der Kontext kann besonders bei der Bekehrung auf Jesus weisen, doch der griechische Text nennt nur „den Herrn“. Die Übersetzung bewahrt diese Offenheit.
- issue: Verhältnis von Glauben und Hinwendung
  choice: Natürliche Relativsatzkonstruktion mit einer Fußnote zur möglichen vorzeitigen Nuance
  alternative: „Nachdem sie zum Glauben gekommen waren, wandten sie sich dem Herrn zu“
  rationale: Das Aoristpartizip kann vorzeitig verstanden werden, legt aber nicht zwingend eine scharf getrennte Abfolge fest. Der Haupttext lässt die enge Verbindung beider Vorgänge bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das traditionelle Bild „Hand des Herrn“ bleibt erhalten; unnötige theologische Explizierungen werden vermieden.
