  naturalness: „Er wird dir Worte sagen“ ist verständlich und idiomatisch. „Dein ganzes Haus“ ist zwar bibelsprachlich geläufig, wird heute aber leicht als Gebäude verstanden. „Dein gesamter Haushalt“ ist klar und natürlich.
  terminology: „gerettet werdet“ gibt σωθήσῃ im Kontext angemessen wieder, ohne den Begriff dogmatisch zu präzisieren. Die Fußnote sollte die formnähere Alternative zu ἐν οἷς klar und ohne die missverständliche Doppelung von „durch die/durch welche“ angeben.
