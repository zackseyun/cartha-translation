base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: de
  text: Er wird dir Worte sagen, durch die du und dein gesamter Haushalt gerettet werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in denen“. Die griechische Wendung kann hier die Worte als das Mittel bezeichnen, durch das Rettung kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Er
  rationale: Das Relativpronomen bezieht sich auf den zuvor genannten Mann; am Beginn des selbstständig wiedergegebenen Satzes ist im Deutschen „Er“ natürlich und eindeutig.
- source_word: λαλήσει
  choice: wird … sagen
  rationale: λαλέω bezeichnet hier das mündliche Übermitteln einer Botschaft. In Verbindung mit „Worte“ ist „Worte sagen“ im heutigen Deutsch natürlicher als „Worte sprechen“.
- source_word: ῥήματα
  choice: Worte
  rationale: Der konkrete Plural des Griechischen bleibt erhalten; „Botschaft“ wäre glatter, würde aber die Form des Ausgangstextes verallgemeinern.
- source_word: πρὸς σὲ
  choice: dir
  rationale: Bei einem Verb des Sagens gibt der deutsche Dativ die Ausrichtung auf den Angesprochenen idiomatisch wieder.
- source_word: ἐν οἷς
  choice: durch die
  rationale: 'ἐν ist hier am ehesten instrumental zu verstehen: Die angekündigten Worte sind das Mittel, durch das Rettung kommt. Eine Fußnote hält die formal näheren Alternativen offen.'
- source_word: σωθήσῃ
  choice: gerettet werdet
  rationale: Der Aorist Konjunktiv steht im Relativsatz nach einem futurischen Hauptverb und hat Zukunftsbezug. σῴζω trägt im Kontext der Evangeliumsverkündigung den Sinn „retten“.
- source_word: σὺ καὶ πᾶς ὁ οἶκός σου
  choice: du und dein ganzes Haus
  rationale: „Haus“ kann im Deutschen wie οἶκος die Hausgemeinschaft beziehungsweise Familie bezeichnen und bewahrt die biblische Bild- und Ausdrucksweise. Das finite Verb steht wegen des zusammengesetzten Subjekts im Plural.
theological_decisions:
- issue: Bedeutung der Rettung im Zusammenhang mit dem Haus des Kornelius
  choice: „gerettet werdet“
  alternative: „befreit werdet“
  rationale: Der Zusammenhang handelt von der Verkündigung des Evangeliums und von Rettung. Die Wiedergabe benennt dies, ohne über den Vers hinaus den genauen Heilsvorgang dogmatisch auszuarbeiten.
- issue: Reichweite von „dein ganzes Haus“
  choice: Die gesamte Hausgemeinschaft wird als Umfang der Verheißung genannt.
  alternative: Eine Formulierung, die automatische Rettung jedes Angehörigen unabhängig von dessen Reaktion ausdrücklich behauptet oder verneint.
  rationale: Der griechische Text nennt die Hausgemeinschaft insgesamt, erläutert in diesem Vers aber nicht die Beteiligung jedes Einzelnen. Diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dein ganzes Haus“ ist bewusst knapp und biblisch geprägt, bleibt aber als Bezeichnung der Hausgemeinschaft verständlich. Der Fußnotenmarker steht unmittelbar nach dem Satz.
