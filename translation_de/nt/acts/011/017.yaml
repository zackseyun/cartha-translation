    rationale: Das griechische ὡς καὶ ἡμῖν bedeutet hier idiomatisch „wie uns“ bzw. „ebenso wie uns“. Das deutsche „auch“ ist nicht falsch, wirkt in dieser Position jedoch weniger flüssig und ist nicht erforderlich.
