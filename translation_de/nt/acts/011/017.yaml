  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: de
  text: Wenn Gott ihnen also dieselbe Gabe gegeben hat wie uns, die wir an den Herrn Jesus, den Messias, geglaubt haben[a] – wer war ich denn, dass ich Gott hätte hindern können?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie uns, als wir an den Herrn Jesus, den Messias, glaubten“. Das griechische Partizip kann neben der beschreibenden auch zeitlich wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: dieselbe Gabe
  rationale: ἴσην bezeichnet hier die Gleichheit bzw. Gleichwertigkeit der Gabe; „dieselbe Gabe“ gibt den Vergleich im Deutschen natürlich wieder.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: die wir an den Herrn Jesus, den Messias, geglaubt haben
  rationale: Das dativische Partizip stimmt mit ἡμῖν überein und wird möglichst formnah beschreibend wiedergegeben. ἐπί mit Akkusativ bezeichnet hier die Ausrichtung des Glaubens auf Jesus.
- source_word: κύριον
  choice: Herrn
  rationale: κύριος fungiert in der christologischen Bezeichnung als Hoheitstitel Jesu.
- source_word: Χριστόν
  choice: den Messias
  rationale: Χριστός trägt hier erkennbar Titelfunktion. „Messias“ bewahrt den Bedeutungsgehalt; der deutsche Artikel und die Apposition sorgen für eine natürliche Formulierung.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: wer war ich, dass ich ... hätte ... können?
  rationale: Die rhetorische Selbstzurücknahme und der durch δυνατός ausgedrückte fehlende Anspruch bzw. die fehlende Möglichkeit werden idiomatisch bewahrt.
- source_word: κωλῦσαι τὸν θεόν
  choice: Gott hätte hindern können
  rationale: 'Die auffällige direkte Aussage des Griechischen bleibt erhalten: Widerstand gegen dieses Geschehen wäre ein Hindern Gottes selbst gewesen.'
theological_decisions:
- issue: Wiedergabe von Χριστόν in κύριον Ἰησοῦν Χριστόν
  choice: den Herrn Jesus, den Messias
  alternative: den Herrn Jesus Christus
  rationale: „Messias“ erhält die aktive Titelfunktion von Χριστός, ohne den Ausdruck als bloßen Namensbestandteil zu behandeln.
- issue: Bezug und Sinn des Partizips πιστεύσασιν
  choice: 'beschreibend: „uns, die wir ... geglaubt haben“'
  alternative: 'temporal: „uns, als wir ... glaubten“'
  rationale: Das Partizip stimmt grammatisch mit ἡμῖν überein. Die beschreibende Wiedergabe wahrt diese Struktur und vermeidet, die zeitliche Beziehung stärker festzulegen, als es der griechische Wortlaut verlangt.
- issue: Modale bzw. irreale Nuance von ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι
  choice: „wer war ich, dass ich Gott hätte hindern können?“
  alternative: „wer war ich, dass ich Gott hindern konnte?“
  rationale: Der deutsche Konjunktiv II bringt die rhetorische Unmöglichkeit natürlichen Ausdruck, ohne die Aussage abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt der griechischen Argumentation nahe, während Gedankenstrich und Konjunktiv die rhetorische Schlussfrage im Deutschen natürlich gestalten.
