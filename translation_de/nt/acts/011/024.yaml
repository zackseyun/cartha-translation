id: ACT.11.24
reference: Acts 11:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: de
  text: Denn er war ein guter Mann, erfüllt vom Heiligen Geist und von Glauben.[a] Und eine große Zahl von Menschen wurde dem Herrn hinzugefügt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Treue“. Das griechische Wort kann sowohl „Glaube“ als auch „Treue“ oder „Vertrauen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Würdigung des Barnabas ein und bewahrt den erklärenden Zusammenhang.
- source_word: ἀνὴρ ἀγαθὸς
  choice: ein guter Mann
  rationale: Gibt die ausdrücklich männliche Bezeichnung für Barnabas und die allgemeine moralische Wertung direkt und natürlich wieder.
- source_word: πλήρης πνεύματος ἁγίου
  choice: erfüllt vom Heiligen Geist
  rationale: Natürliches modernes Deutsch für die Charakterisierung; πνεῦμα ἅγιον bezeichnet im lukanischen Sprachgebrauch den Heiligen Geist.
- source_word: πίστεως
  choice: Glauben
  rationale: „Glaube“ ist hier eine naheliegende Wiedergabe; die ebenfalls mögliche Nuance „Treue“ wird in der Fußnote offengehalten.
- source_word: προσετέθη
  choice: wurde … hinzugefügt
  rationale: Bewahrt die Passivform und die in der Apostelgeschichte gebräuchliche Vorstellung des Hinzugefügtwerdens.
- source_word: ὄχλος ἱκανὸς
  choice: eine große Zahl von Menschen
  rationale: Gibt die beträchtliche Menge idiomatisch wieder; „Menschen“ verdeutlicht, dass Personen und nicht eine abstrakte Größe gemeint sind.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Bewahrt den ausdrücklich genannten Bezugspunkt des griechischen Textes, ohne ihn durch „Gemeinde“ zu ersetzen.
theological_decisions:
- issue: Bedeutung von πνεύματος ἁγίου
  choice: der Heilige Geist als göttlicher Geist
  alternative: ein heiliger Geist oder eine heilige Gesinnung
  rationale: Im Sprachgebrauch von Lukas und der Apostelgeschichte bezeichnet die Wendung regelmäßig den Heiligen Geist; der Kontext beschreibt Barnabas als vom Geist geprägten Jünger.
- issue: Nuance von πίστεως
  choice: Glauben
  alternative: Treue oder Vertrauenswürdigkeit
  rationale: Der Kontext lässt sowohl gläubiges Vertrauen als auch treuen Charakter anklingen. Der Haupttext verwendet die übliche Wiedergabe „Glaube“, während die Fußnote die echte lexikalische Möglichkeit „Treue“ bewahrt.
- issue: Bezug von προσετέθη … τῷ κυρίῳ
  choice: Menschen wurden dem Herrn hinzugefügt
  alternative: Menschen schlossen sich der Gemeinde an
  rationale: Der griechische Text nennt ausdrücklich den Herrn als Bezugspunkt. Die Zugehörigkeit zur Gemeinde mag mitgemeint sein, soll den Wortlaut jedoch nicht ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „erfüllt vom Heiligen Geist und von Glauben“ ist idiomatisch und bewahrt die parallelen Genitivangaben. „Eine große Zahl von Menschen“ vermeidet das im Deutschen hier schwerfällige „eine beträchtliche Volksmenge“.
