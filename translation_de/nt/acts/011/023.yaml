id: ACT.11.23
reference: Acts 11:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: de
  text: Als er dort ankam und die Gnade Gottes[a] sah, freute er sich und ermutigte sie alle immer wieder, mit festem Herzen beim Herrn zu bleiben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sein kann die sichtbar gewordene Wirkung der Gnade Gottes unter ihnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: dem Herrn treu zu bleiben; auch: dem Herrn ergeben zu bleiben.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: als er dort ankam
  rationale: Das Aoristpartizip bezeichnet Barnabas’ Eintreffen am Ort; die temporale Wiedergabe ist im Deutschen natürlich.
- source_word: ἰδὼν
  choice: sah
  rationale: Das gewöhnliche Verb des Sehens bleibt erhalten, ohne die im Kontext mögliche Wahrnehmung von Gottes Wirken auszudeuten.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: die Gnade Gottes
  rationale: Die Formulierung bewahrt das theologische Gewicht von χάρις und lässt offen, wie Gottes Gnade konkret sichtbar wurde.
- source_word: ἐχάρη
  choice: freute er sich
  rationale: Eine natürliche und würdevolle Wiedergabe der Freude Barnabas’.
- source_word: παρεκάλει
  choice: ermutigte ... immer wieder
  rationale: Das Imperfekt bezeichnet ein fortgesetztes oder wiederholtes Handeln; παρακαλέω umfasst hier ermutigendes und mahnendes Zureden.
- source_word: πάντας
  choice: sie alle
  rationale: Bezieht sich im Kontext auf sämtliche dortigen Gläubigen und folgt dem griechischen Ausdruck knapp.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: mit festem Herzen
  rationale: Gibt den entschlossenen Vorsatz des inneren Menschen in verständlichem modernem Deutsch wieder, ohne die Wendung unnötig zu vergegenständlichen.
- source_word: προσμένειν
  choice: beim Herrn zu bleiben
  rationale: προσμένω mit Dativ bezeichnet das fortgesetzte Festhalten an beziehungsweise Bleiben bei einer Person; die Wiedergabe wahrt die Beziehungsmetapher.
- source_word: τῷ κυρίῳ
  choice: beim Herrn
  rationale: Der Titel κύριος wird traditionsgemäß und kontextgerecht mit „Herr“ wiedergegeben, ohne den Referenten im Text erklärend auszuschreiben.
theological_decisions:
- issue: Bedeutung von „die Gnade Gottes“
  choice: Die griechische Wendung wird unverändert als „die Gnade Gottes“ bewahrt.
  alternative: Paraphrase als „was Gott in seiner Gnade getan hatte“
  rationale: Im Kontext ist wohl Gottes sichtbar gewordenes gnädiges Wirken gemeint; die direkte Wiedergabe erhält jedoch die semantische und theologische Weite.
- issue: Bedeutung von προσμένειν τῷ κυρίῳ
  choice: „beim Herrn zu bleiben“ als fortdauernde Verbundenheit
  alternative: „dem Herrn treu zu bleiben“ oder „dem Herrn ergeben zu bleiben“
  rationale: Die gewählte Fassung folgt der Beziehungsmetapher des griechischen Ausdrucks besonders eng und legt die Verbundenheit nicht ausschließlich als Treue oder innere Hingabe aus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Mit festem Herzen“ ist idiomatischer als das formnahe „mit dem Vorsatz des Herzens“; „immer wieder“ macht den durativen Charakter des Imperfekts hörbar.
