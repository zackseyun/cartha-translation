  variant: modern standard German
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: de
  text: Die Nachricht über sie drang der Gemeinde in Jerusalem zu Ohren[a], und sie sandte Barnabas bis nach Antiochia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Nachricht wurde von der Gemeinde in Jerusalem gehört«; wörtlich: »wurde in die Ohren der Gemeinde in Jerusalem gehört«.'
    reason: Das griechische Passiv mit der Wendung „in die Ohren“ ist im Deutschen nur unnatürlich wörtlich wiederzugeben; die Fußnote legt Bild und Satzform offen, ohne ein im Ausgangstext nicht enthaltenes „gebracht“ einzuführen.
lexical_decisions:
- source_word: ἠκούσθη … εἰς τὰ ὦτα
  choice: drang … zu Ohren
  rationale: Die deutsche Wendung gibt das griechische Hör-Idiom natürlich wieder, bewahrt dessen Bildsprache und lässt erkennen, dass die Nachricht der Gemeinde bekannt wurde.
- source_word: ὁ λόγος
  choice: die Nachricht
  rationale: Im Erzählzusammenhang bezeichnet λόγος die Kunde über die zuvor geschilderten Menschen und Ereignisse, nicht eine Rede oder ausdrücklich das verkündigte Wort.
- source_word: τῆς ἐκκλησίας τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: der Gemeinde in Jerusalem
  rationale: „Gemeinde“ bezeichnet hier die christliche Gemeinschaft; die attributive Partizipialfügung wird im Deutschen natürlich als Ortsangabe wiedergegeben.
- source_word: περὶ αὐτῶν
  choice: über sie
  rationale: Die persönliche Mehrzahl bleibt erhalten, ohne den möglichen Bezug auf die zuvor erwähnten Menschen und die mit ihnen verbundenen Vorgänge enger festzulegen.
- source_word: ἐξαπέστειλαν
  choice: sie sandte
  rationale: Das grammatische Subjekt wird auf die kollektiv verstandene „Gemeinde“ bezogen. Der Singular ist im Deutschen die natürliche Kongruenzform und benennt keine bestimmte Leitungsgruppe.
- source_word: Βαρναβᾶν
  choice: Barnabas
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: ἕως Ἀντιοχείας
  choice: bis nach Antiochia
  rationale: „Bis nach“ bildet die durch ἕως ausgedrückte räumliche Erstreckung beziehungsweise das Ziel genauer ab als ein bloßes „nach“ und klingt idiomatisch.
theological_decisions:
- issue: Handelndes Subjekt bei der Aussendung des Barnabas
  choice: 'Die Gemeinde in Jerusalem handelt kollektiv: „sie sandte“.'
  alternative: Bestimmte, im Text nicht genannte Leiter der Gemeinde sandten ihn.
  rationale: Das nächste ausdrückliche Bezugswort ist „Gemeinde“. Apostel, Älteste oder eine andere Leitungsgruppe werden in diesem Vers nicht als Subjekt genannt und daher nicht ergänzt.
- issue: Bezug von περὶ αὐτῶν
  choice: „über sie“ bleibt als persönlicher Bezug offen.
  alternative: „darüber“ beziehungsweise „über diese Ereignisse“.
  rationale: Das Pronomen steht im Maskulinum Plural und verweist am ehesten auf die zuvor erwähnten Menschen, kann im Zusammenhang aber zugleich die Vorgänge um sie einschließen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu Ohren dringen“ bewahrt das Quellenbild ohne Steifheit. Der Satz beginnt nicht mit einem ergänzten „Nun“, da im griechischen Text kein entsprechendes Zeitadverb steht; δέ wird durch die natürliche Fortführung des Erzählzusammenhangs getragen.
