source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: de
  text: 'Als sie das hörten, schwiegen sie und verherrlichten Gott und sagten: »Dann hat Gott also auch den Nichtjuden[a] die Umkehr zum Leben geschenkt[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »den Völkern«. Gemeint sind hier Menschen, die keine Juden sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »die Umkehr, die zum Leben führt« oder »die Umkehr, die Leben bewirkt«. Der griechische Ausdruck kann Ziel oder Ergebnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Als sie das hörten
  rationale: Der Aoristpartizipialausdruck bezeichnet den vorausgehenden Umstand; δέ ist als schwacher Anschluss im natürlichen deutschen Satzfluss mit enthalten. Das singularische »das« verweist idiomatisch auf den gesamten vorangegangenen Bericht.
- source_word: ἡσύχασαν
  choice: beruhigten sie sich
  rationale: Im Kontext endet ihr Einwand beziehungsweise ihre Auseinandersetzung. »Beruhigten sich« gibt dieses Verstummen wieder, ohne lediglich äußere Lautlosigkeit auszudrücken.
- source_word: ἐδόξασαν τὸν θεόν
  choice: priesen Gott
  rationale: »Priesen« ist im modernen Deutschen eine natürliche und würdige Wiedergabe des Lobens beziehungsweise Verherrlichens Gottes.
- source_word: λέγοντες
  choice: Sie sagten
  rationale: Der griechische Partizipialanschluss wird für einen klaren, natürlichen deutschen Satzbau als finites Verb wiedergegeben.
- source_word: Ἄρα καὶ
  choice: Dann hat Gott also auch
  rationale: »Dann … also« bringt den folgernden Charakter von ἄρα zum Ausdruck; »auch« bewahrt die inklusive Hervorhebung von καί.
- source_word: τοῖς ἔθνεσιν
  choice: den Nichtjuden
  rationale: ἔθνη bezeichnet hier Menschen außerhalb des jüdischen Volkes, nicht politische Nationen. »Nichtjuden« ist im heutigen Deutsch unmittelbar verständlich.
- source_word: τὴν μετάνοιαν
  choice: die Umkehr
  rationale: »Umkehr« erfasst die im neutestamentlichen Gebrauch gemeinte grundlegende Sinnes- und Lebenswendung besser als das engere oder altertümlich wirkende »Buße« und bewahrt durch den Artikel die Bestimmtheit des griechischen Ausdrucks.
- source_word: εἰς ζωὴν
  choice: die zum Leben führt
  rationale: Die Relativkonstruktion gibt die Ziel- beziehungsweise Ergebnisrichtung von εἰς natürlich wieder, ohne eindeutig zwischen Ziel und Folge zu entscheiden.
- source_word: ἔδωκεν
  choice: hat … geschenkt
  rationale: Das Perfekt ist im Deutschen eine natürliche Wiedergabe des abgeschlossenen Handelns mit gegenwärtiger Bedeutung. »Geschenkt« wahrt, dass Gott die Umkehr gibt.
theological_decisions:
- issue: Umkehr als Gabe Gottes
  choice: »Gott … hat … die Umkehr geschenkt«
  alternative: »Gott gab … die Umkehr« oder eine Formulierung, die nur menschliche Eigeninitiative betont
  rationale: Der griechische Text stellt ausdrücklich Gott als Geber der μετάνοια dar. Die Übersetzung bewahrt diese Aussage, ohne daraus ein weitergehendes dogmatisches System über göttliches und menschliches Handeln abzuleiten.
- issue: Bedeutung von εἰς ζωήν
  choice: »die zum Leben führt«
  alternative: »zum Leben«, »für das Leben« oder »die Leben bewirkt«
  rationale: Die Formulierung wahrt die ziel- beziehungsweise ergebnisbezogene Spannung der Präposition εἰς und legt nicht genauer fest, als es der griechische Ausdruck erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Nichtjuden« vermeidet das heute weniger allgemein verständliche »Heiden«. »Umkehr« ist zugänglich und inhaltlich umfassender als eine bloße Meinungsänderung. Die direkte Rede ist klar gegliedert; alle Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
