  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: de
  text: Das geschah dreimal, und alles wurde wieder in den Himmel hinaufgezogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: und alles wurde wieder in den Himmel hinaufgenommen.'
    reason: Lexikalische Alternative für ἀνεσπάσθη; „hinaufgenommen“ gibt die Aufwärtsbewegung idiomatischer wieder, während „hinaufgezogen“ das Bild stärker bewahrt.
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Das geschah
  rationale: Das Demonstrativpronomen verweist auf den zuvor geschilderten Vorgang, ohne ausdrücklich „Vision“ hinzuzufügen. Das schwache δέ wird durch den natürlichen Satzzusammenhang und das spätere „und“ wiedergegeben.
- source_word: ἐπὶ τρίς
  choice: dreimal
  rationale: Die Wendung bezeichnet eine dreifache Wiederholung; „dreimal“ ist die natürliche moderne deutsche Entsprechung.
- source_word: ἀνεσπάσθη πάλιν
  choice: wurde wieder … hinaufgezogen
  rationale: Die passive Form und die nach oben gerichtete Bewegung bleiben erhalten, ohne den Handelnden zu benennen. „Hinaufgezogen“ bewahrt zudem das anschauliche Bild des zuvor erwähnten Behältnisses.
- source_word: ἅπαντα
  choice: alles
  rationale: Das substantivierte Neutrum bezeichnet umfassend den gesamten Inhalt beziehungsweise Vorgang, ohne ihn enger als „Tiere“ oder „Tuch“ festzulegen.
- source_word: εἰς τὸν οὐρανόν
  choice: in den Himmel
  rationale: „In den Himmel“ erhält die durch εἰς ausgedrückte Zielrichtung und passt zum visionären Zusammenhang.
theological_decisions:
- issue: Bezug von ἅπαντα im Bericht über die Vision
  choice: alles
  alternative: das Ganze; alle Tiere
  rationale: Der griechische Ausdruck ist umfassend, legt den konkreten Bezug in diesem Vers aber nicht enger fest. „Alles“ bewahrt diese Offenheit.
- issue: Bedeutung von οὐρανός
  choice: Himmel
  alternative: Luftraum; Himmel im Sinn des sichtbaren Himmels
  rationale: Der visionäre Kontext spricht für „Himmel“, ohne zusätzliche Aussagen über dessen Beschaffenheit einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die knappe Satzstruktur und das Passiv des griechischen Textes bleiben erhalten.
