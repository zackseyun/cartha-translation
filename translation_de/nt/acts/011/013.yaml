  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Inhalt des griechischen Textes zuverlässig wieder: Cornelius berichtet, den Engel in seinem Haus stehend und redend gesehen zu haben; die beiden Imperative bleiben erhalten. Das im ersten Imperativ nicht ausgedrückte Objekt wird nicht durch eine sachlich mögliche, aber hier nicht ausdrücklich vorhandene Ergänzung wie »Männer« eingeführt.'
