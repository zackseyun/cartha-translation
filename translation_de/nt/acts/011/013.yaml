id: ACT.11.13
reference: Acts 11:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: de
  text: 'Und er berichtete uns, wie er den Engel in seinem Haus stehen und sagen gesehen hatte: »Schick nach Joppe und lass Simon holen, der Petrus genannt wird.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: Das Aoristverb bezeichnet das Übermitteln eines Berichts; »berichtete« passt zum erzählenden Zusammenhang und bleibt sachlich.
- source_word: δὲ
  choice: Und
  rationale: δέ führt hier die Erzählung mit einer leichten Verknüpfung fort, ohne einen starken Gegensatz auszudrücken.
- source_word: πῶς
  choice: wie
  rationale: »wie« bewahrt die im Griechischen ausgedrückte Art beziehungsweise den Inhalt des Berichts, statt die Aussage zu einem bloßen »dass« einzuebnen.
- source_word: εἶδεν
  choice: gesehen hatte
  rationale: Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass das Sehen zeitlich vor dem Berichten lag.
- source_word: τὸν ἄγγελον
  choice: den Engel
  rationale: Der bestimmte Artikel verweist im Zusammenhang auf den bereits erwähnten Engel aus der Vision des Kornelius.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: in seinem Haus
  rationale: »Haus« gibt den räumlichen Sinn von οἶκος direkt und idiomatisch wieder.
- source_word: σταθέντα καὶ εἰπόντα
  choice: stehen und sagen
  rationale: Die beiden koordinierten Partizipien werden in die deutsche Infinitivkonstruktion nach »sehen« eingebunden; so bleiben Haltung und Rede des Engels eng verbunden.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: Schick nach Joppe
  rationale: Das Objekt des Imperativs bleibt wie im griechischen Text unausgesprochen. »nach Joppe« ist die natürliche deutsche Richtungsangabe bei einer Stadt.
- source_word: μετάπεμψαι
  choice: lass … holen
  rationale: Das mediale Verb bedeutet, jemanden holen beziehungsweise zu sich kommen zu lassen. »lass … holen« drückt dies in natürlichem modernem Deutsch aus.
- source_word: τὸν ἐπικαλούμενον Πέτρον
  choice: Simon, der Petrus genannt wird
  rationale: Die attributive Partizipialform identifiziert Simon anhand seines gebräuchlichen weiteren Namens; die Formulierung folgt dieser Funktion klar und unmittelbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an Syntax und Erzählfluss des griechischen Textes. Die doppelte Imperativfolge bleibt erhalten, ohne das im ersten Imperativ unausgesprochene Objekt durch »Männer« zu ergänzen.
