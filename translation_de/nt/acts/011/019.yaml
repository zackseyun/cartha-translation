  rationale: Die Revision ersetzt die im Deutschen unnatürliche Doppelung „außer den Juden allein“ durch „ausschließlich Juden“. Damit wird die exklusive, durch μόνον verstärkte Begrenzung der Adressaten klar wiedergegeben. Die übrigen zurückhaltenden und quellentreuen Entscheidungen bleiben erhalten.
