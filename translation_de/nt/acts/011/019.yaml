revisions:
- from: Die nun wegen der Bedrängnis, die im Zusammenhang mit Stephanus entstanden war, zerstreut worden waren, zogen bis nach Phönizien, Zypern und Antiochia. Sie verkündeten das Wort[a] niemandem außer den Juden allein.[b]
