id: ACT.11.19
reference: Acts 11:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: de
  text: Diejenigen nun, die wegen der Bedrängnis, die im Zusammenhang mit Stephanus entstanden war, zerstreut worden waren, zogen bis nach Phönizien, Zypern und Antiochia und verkündeten das Wort[a] ausschließlich Juden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Das Wort“ bezeichnet hier die verkündete Botschaft über Jesus; auch: „die Botschaft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Ausdruck ist nachdrücklich: „nur zu Juden“ oder „zu Juden allein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν διασπαρέντες
  choice: Die nun ... zerstreut worden waren
  rationale: Das substantivierte Aoristpassiv-Partizip bezeichnet die zuvor Zerstreuten; das Plusquamperfekt gibt die Vorzeitigkeit gegenüber dem Hauptverb natürlich wieder. μὲν οὖν wird durch „nun“ als erzählerische Wiederaufnahme dargestellt, ohne ein im Deutschen unvollständiges Gegensatzpaar zu erzeugen.
- source_word: ἀπὸ τῆς θλίψεως
  choice: wegen der Bedrängnis
  rationale: ἀπό bezeichnet hier den Anlass beziehungsweise die Ursache der Zerstreuung. „Bedrängnis“ wahrt die breitere Bedeutung von θλῖψις und legt sich nicht ausschließlich auf „Verfolgung“ fest.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: die im Zusammenhang mit Stephanus entstanden war
  rationale: Die Formulierung erhält den Zusammenhang mit dem Fall des Stephanus, ohne ἐπί vorschnell ausschließlich kausal als „wegen Stephanus“ oder ausschließlich zeitlich als „nach Stephanus“ zu bestimmen.
- source_word: διῆλθον ἕως
  choice: zogen bis nach
  rationale: Das Verb beschreibt die Reisebewegung, ἕως deren geografische Ausdehnung. „zogen bis nach“ ist im Deutschen natürlich und quellennah.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Phönizien, Zypern und Antiochia
  rationale: Verwendet die geläufigen deutschen Namen der Region, der Insel und der Stadt.
- source_word: μηδενὶ λαλοῦντες τὸν λόγον
  choice: Sie verkündeten das Wort niemandem
  rationale: Der griechische Begleitumstand wird zur besseren deutschen Lesbarkeit als eigener Satz wiedergegeben. „verkündeten“ erfasst im Kontext das öffentliche Mitteilen; „das Wort“ bewahrt Lukas’ wiederkehrende Kurzbezeichnung für die Botschaft.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: außer den Juden allein
  rationale: „allein“ erhält die ausdrückliche Einschränkung durch μόνον, obwohl „außer“ den Ausschluss bereits signalisiert.
theological_decisions:
- issue: Art des feindlichen Drucks nach dem Geschehen um Stephanus
  choice: Bedrängnis
  alternative: Verfolgung
  rationale: Der Kontext handelt von Verfolgung, doch θλῖψις ist lexikalisch weiter. „Bedrängnis“ bewahrt diesen Bedeutungsumfang.
- issue: Bezug der Bedrängnis auf Stephanus
  choice: im Zusammenhang mit Stephanus
  alternative: wegen Stephanus
  rationale: Die gewählte Fassung bewahrt die mögliche kausale beziehungsweise assoziative Spannung von ἐπὶ Στεφάνῳ, ohne Stephanus selbst als alleinige Ursache festzuschreiben.
- issue: Bedeutung von τὸν λόγον
  choice: das Wort
  alternative: die Botschaft
  rationale: „Das Wort“ erhält die für die Apostelgeschichte charakteristische Ausdrucksweise. Eine Fußnote erläutert, dass damit die verkündete Botschaft über Jesus gemeint ist.
- issue: Beschränkung der Verkündigung auf Juden
  choice: außer den Juden allein
  alternative: nur zu den Juden
  rationale: Die Fassung bildet die doppelte griechische Einschränkung εἰ μή μόνον sichtbar ab, ohne daraus eine weitergehende theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird nach der Reisezielangabe geteilt, um die Verständlichkeit zu erhöhen. „Bedrängnis“ und „das Wort“ halten die Ausdrucksweise bewusst quellennah; die Fußnoten erläutern die kontextuelle Bedeutung und die emphatische Einschränkung.
