  text: Ἐν ταύταις δὲ ταῖς ἡμέραις κατῆλθον ἀπὸ Ἱεροσολύμων προφῆται εἰς Ἀντιόχειαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: de
  text: In diesen Tagen kamen Propheten aus Jerusalem nach Antiochia hinab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gingen Propheten aus Jerusalem nach Antiochia hinab«. Das griechische Verb kann je nach Erzählperspektive mit »kamen hinab« oder »gingen hinab« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: In diesen Tagen
  rationale: Die Wendung setzt einen zeitlichen Rahmen. Das schwach verbindende δέ muss im Deutschen nicht eigens wiedergegeben werden; so bleibt der Satz natürlich, ohne ein nicht ausdrücklich vorhandenes »nun« einzuführen.
- source_word: κατῆλθον
  choice: kamen … hinab
  rationale: κατέρχομαι bezeichnet eine Bewegung nach unten und kann je nach Erzählperspektive mit »hinabkommen« oder »hinabgehen« wiedergegeben werden. »Kamen … hinab« beschreibt hier natürlich die Ankunft am genannten Ziel und bewahrt zugleich die räumliche Komponente.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: aus Jerusalem
  rationale: Bei Städten ist »aus« im Deutschen die natürliche Wiedergabe des Ausgangspunkts; der griechisch morphologisch plurale Ortsname wird standardgemäß als »Jerusalem« wiedergegeben.
- source_word: προφῆται
  choice: Propheten
  rationale: »Propheten« ist die direkte und im frühchristlichen Zusammenhang angemessene Wiedergabe, ohne ihre Aufgabe näher festzulegen.
- source_word: εἰς Ἀντιόχειαν
  choice: nach Antiochia
  rationale: εἰς bezeichnet die Bewegung zum Ziel; bei Städtenamen ist »nach Antiochia« idiomatisches Standarddeutsch.
theological_decisions:
- issue: Bedeutung von »Propheten« im Kontext der Gemeinden von Jerusalem und Antiochia
  choice: Das Wort προφῆται wird schlicht mit »Propheten« wiedergegeben.
  alternative: prophetische Lehrer; inspirierte Boten
  rationale: Der griechische Text bestimmt Art und Umfang ihres Dienstes hier nicht näher. Die breite Bezeichnung wahrt diese Offenheit und vermeidet eine konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt den zeitlichen Auftakt und lässt »hinab« als trennbaren Verbteil natürlich am Satzende stehen.
