  source_fidelity: 'Der Text gibt den Vorwurf vollständig und in seiner Struktur treffend wieder: „und sagten“ bildet λέγοντες im deutschen Erzählstil angemessen ab; „Du bist zu … gegangen“ gibt εἰσῆλθες πρὸς idiomatisch wieder; „unbeschnittenen Männern“ bewahrt die ausdrücklich körperlich-kultische Bezeichnung ἀκροβυστίαν ἔχοντας; und „hast mit ihnen gegessen“ entspricht συνέφαγες αὐτοῖς einschließlich des gemeinsamen Essens.'
  naturalness: Modernes, klares Standarddeutsch. Die direkte Rede und die knappe, vorwurfsvolle Formulierung klingen natürlich. Eine wörtlichere Wiedergabe wie „bist hineingegangen zu“ wäre im Deutschen weniger idiomatisch und ist nicht erforderlich.
  terminology: „Unbeschnittene Männer“ ist gegenüber einer Deutung als „Nichtjuden“ oder „Heiden“ quellennäher und erhält die im Vorwurf markierte Bundes- und Reinheitsgrenze. „Männer“ entspricht ἄνδρας und sollte nicht verallgemeinert werden.
