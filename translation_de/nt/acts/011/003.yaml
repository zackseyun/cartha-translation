  text: λέγοντες ὅτι ⸂Εἰσῆλθες πρὸς ἄνδρας ἀκροβυστίαν ἔχοντας καὶ συνέφαγες⸃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: de
  text: 'und sagten: „Du bist zu unbeschnittenen Männern gegangen und hast mit ihnen gegessen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Präsenspartizip knüpft an den vorherigen Erzählzusammenhang an; im natürlichen Deutschen wird diese Verbindung durch einen koordinierten Hauptsatz wiedergegeben.
- source_word: ὅτι
  choice: direkte Rede
  rationale: ὅτι leitet hier den Wortlaut des Vorwurfs ein; deutsche Anführungszeichen geben dies idiomatisch wieder.
- source_word: Εἰσῆλθες πρὸς
  choice: du bist zu … gegangen
  rationale: Die Wendung bezeichnet das Hineingehen beziehungsweise den Besuch bei Personen. „Zu … gegangen“ ist natürlich und bewahrt die im Vorwurf betonte Annäherung.
- source_word: ἄνδρας
  choice: Männern
  rationale: ἀνήρ bezeichnet hier ausdrücklich männliche Personen und wird daher nicht zu „Menschen“ verallgemeinert.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: unbeschnittenen
  rationale: Die griechische Wendung bedeutet wörtlich „Vorhaut habend“ und bezeichnet aus jüdischer Sicht Unbeschnittene. Das adjektivische „unbeschnitten“ ist im Deutschen klar und bewahrt die bundes- und gemeinschaftsbezogene Schärfe des Vorwurfs.
- source_word: καὶ συνέφαγες αὐτοῖς
  choice: und hast mit ihnen gegessen
  rationale: Das zusammengesetzte Verb συνεσθίω bezeichnet gemeinsames Essen; „mit ihnen gegessen“ ist direkt und idiomatisch.
theological_decisions:
- issue: Ob ἀκροβυστίαν ἔχοντας deutend mit „Nichtjuden“ oder quellennäher mit „unbeschnitten“ wiederzugeben ist
  choice: unbeschnittenen Männern
  alternative: nichtjüdischen Männern / Heiden
  rationale: Der Vorwurf wird ausdrücklich anhand des Bundeszeichens der Beschneidung formuliert. „Unbeschnitten“ erhält diese soziale und theologische Spannung, ohne die Bezeichnung stillschweigend ethnisch auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die syntaktisch natürliche Koordination „und sagten“ bildet den griechischen Partizipialanschluss ab; der Vorwurf bleibt knapp und direkt.
