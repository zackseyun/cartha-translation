  yaml_path: translation/nt/acts/011/004.yaml
  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: de
  text: 'Petrus aber begann, ihnen der Reihe nach zu berichten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος
  choice: begann
  rationale: Das adverbial gebrauchte Aoristpartizip wird im Deutschen idiomatisch als finites Verb zusammen mit der Haupthandlung wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier einen milden Gegensatz beziehungsweise den Übergang von der Anklage zu Petrus’ Antwort.
- source_word: Πέτρος
  choice: Petrus
  rationale: Für den Personennamen wird die im Deutschen etablierte biblische Namensform verwendet.
- source_word: ἐξετίθετο
  choice: legte … dar
  rationale: Das Imperfekt bezeichnet das ausführliche Darlegen oder Erklären eines Sachverhalts; „darlegen“ ist natürlich und bewahrt das Bild des geordneten Vortragens.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ Plural verweist auf die Gesprächspartner aus dem vorherigen Kontext.
- source_word: καθεξῆς
  choice: alles der Reihe nach
  rationale: Das Adverb betont die geordnete Abfolge des Berichts. „Der Reihe nach“ gibt dies präzise und idiomatisch wieder; „alles“ dient als natürliches deutsches Objekt zu „darlegen“, ohne einen neuen Sachinhalt einzuführen.
- source_word: λέγων
  choice: 'Er sagte:'
  rationale: Das präsentische Partizip leitet den folgenden direkten Bericht ein. Ein eigener deutscher Satz ist hier flüssiger und erfüllt dieselbe diskursive Funktion.
