  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: de
  text: Als Petrus aber nach Jerusalem hinaufging, stritten die aus der Beschneidung[a] mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die aus der Beschneidung“. Der Ausdruck bezeichnet eine durch ihre Verbindung mit der Beschneidung gekennzeichnete Gruppe; auch möglich: „die zur Beschneidung Gehörenden“ oder, im Kontext, „die beschnittenen Gläubigen“.'
    reason: lexikalische Alternative und Bewahrung der Mehrdeutigkeit bei der Gruppenbestimmung
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als … aber
  rationale: δέ kennzeichnet hier den Fortgang der Erzählung mit einer leichten Gegenüberstellung; die im Deutschen natürliche Konstruktion „Als … aber“ bewahrt diese Funktion.
- source_word: ἀνέβη
  choice: hinaufkam
  rationale: ἀναβαίνω bezeichnet bei Jerusalem idiomatisch die Bewegung hinauf zur Stadt. Da die folgenden Personen in Jerusalem sind, passt „hinaufkam“ zur erzählten Perspektive und erhält zugleich die topografische Wendung.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: διεκρίνοντο
  choice: stritten
  rationale: Das Imperfekt von διακρίνω bezeichnet hier ein gegen Petrus gerichtetes verbales Streiten beziehungsweise Einwenden, nicht bloß inneren Zweifel. „Stritten … mit ihm“ ist prägnant und natürlich.
- source_word: πρὸς αὐτόν
  choice: mit ihm
  rationale: πρός mit Akkusativ bezeichnet bei einem Verb des Streitens die Person, mit der die Auseinandersetzung geführt wird.
- source_word: οἱ ἐκ περιτομῆς
  choice: die aus der Beschneidung
  rationale: Die bewusst quellennähere Formulierung erhält die Zuordnung der Gruppe zur Beschneidung, ohne sie ausdrücklich als formelle Partei oder pauschal als alle jüdischen Gläubigen zu bestimmen; die Fußnote erläutert das ungewöhnliche Deutsch.
theological_decisions:
- issue: Bestimmung von οἱ ἐκ περιτομῆς
  choice: eine durch ihre Verbindung mit der Beschneidung bezeichnete Gruppe
  alternative: alle jüdischen Gläubigen allgemein oder eine formell organisierte „Beschneidungspartei“
  rationale: Der griechische Ausdruck kennzeichnet Personen anhand der Beschneidung, legt aber weder den genauen Umfang der Gruppe noch ihren formellen Organisationsgrad eindeutig fest. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die aus der Beschneidung“ ist absichtlich quellennah und wird durch die Fußnote verständlich gemacht; eine stärker konfessionell oder parteipolitisch gefärbte Bezeichnung wird vermieden.
