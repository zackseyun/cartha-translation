id: ACT.11.20
reference: Acts 11:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: de
  text: Einige von ihnen aber waren Männer aus Zypern und Kyrene; als sie nach Antiochia kamen, sprachen sie auch zu den Hellenisten[a] und verkündigten die gute Nachricht vom Herrn Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben hier »Griechen« statt »Hellenisten«. Falls diese Lesart ursprünglich ist, richtete sich ihre Rede an Nichtjuden und nicht nur an griechischsprachige Juden.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: einige
  rationale: Bezeichnet einen nicht näher bestimmten Teil der zuvor erwähnten Gruppe und entspricht natürlichem modernem Deutsch.
- source_word: ἄνδρες
  choice: Männer
  rationale: Das griechische Substantiv bezeichnet hier ausdrücklich erwachsene Männer und wird daher geschlechtsgenau wiedergegeben.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: aus Zypern und Kyrene
  rationale: Die Herkunftsadjektive werden im Deutschen idiomatisch als Herkunftsangabe ausgedrückt.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: Als sie nach Antiochia kamen
  rationale: Das Aoristpartizip wird als temporaler Nebensatz natürlich und sinngemäß wiedergegeben.
- source_word: ἐλάλουν
  choice: sprachen
  rationale: Der Imperfekt beschreibt fortdauerndes oder wiederholtes Reden; im erzählenden deutschen Präteritum ergibt sich dieser Verlauf aus dem Zusammenhang.
- source_word: καὶ
  choice: auch
  rationale: Das Wort erweitert hier wahrscheinlich den Kreis der Angesprochenen und wird daher adjunktiv wiedergegeben.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: zu den Hellenisten
  rationale: Der Haupttext folgt dem SBLGNT und bewahrt zugleich die historisch-lexikalische Bezeichnung; die bedeutende Variante »Griechen« wird in einer Fußnote dokumentiert.
- source_word: εὐαγγελιζόμενοι
  choice: verkündeten ihnen die gute Nachricht
  rationale: Die Form beschreibt Art und Inhalt ihres Redens; die Wiedergabe ist verständlich und erhält den Verkündigungscharakter.
- source_word: τὸν κύριον Ἰησοῦν
  choice: vom Herrn Jesus
  rationale: κύριος wird als christologischer Titel mit »Herr« wiedergegeben; der Genitiv nach »gute Nachricht« drückt den Bezug aus, ohne eindeutig zwischen Inhalt und Gegenstand zu entscheiden.
theological_decisions:
- issue: Identität der Ἑλληνισταί und Textvariante Ἕλληνας
  choice: Im Haupttext steht entsprechend dem SBLGNT »Hellenisten«.
  alternative: Eine bedeutende Handschriftenlesart hat »Griechen« und bezeichnet damit Nichtjuden.
  rationale: Die Entscheidung folgt der vorgegebenen griechischen Edition, ohne die für die Ausweitung der Mission bedeutsame alternative Lesart zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Hellenisten« bleibt als historischer Ausdruck stehen und wird durch die Fußnote erläutert. Die Satzteilung verbessert die Verständlichkeit, ohne den Gedankengang zu verändern.
