  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: de
  text: 'Und ich hörte auch eine Stimme, die zu mir sagte: »Steh auf, Petrus, schlachte und iss!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάς
  choice: Steh auf
  rationale: Das idiomatische deutsche »Steh auf« gibt das partizipiale Ἀναστάς als direkten Auftakt des Befehls natürlich und präzise wieder.
- source_word: θῦσον
  choice: schlachte
  rationale: Im Zusammenhang mit Tieren bezeichnet θύω hier das Töten zum Verzehr; »schlachte« bewahrt diesen konkreten Sinn besser als das allgemeinere »töte«.
- source_word: φάγε
  choice: iss
  rationale: Der Aoristimperativ wird mit dem knappen deutschen Imperativ »iss« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdevolle Standardsprache. Die Satzfolge und direkte Rede bleiben nahe am Griechischen; »schlachte« erhält die konkrete, kultisch beziehungsweise speisebezogen anklingende Wortwahl, ohne sie deutend auszuweiten.
