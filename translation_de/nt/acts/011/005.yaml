    rationale: Die beiden griechischen Partizipien beschreiben dieselbe beobachtete Abwärtsbewegung aus komplementären Blickwinkeln. Im Deutschen lässt sich dies natürlicher in einer Relativkonstruktion verbinden, ohne den Sinn zu verändern.
