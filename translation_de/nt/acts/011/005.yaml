review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt Ort, Gebet, Vision, das unbestimmte σκεῦός τι, den Vergleich mit einem großen Tuch, das Herablassen aus dem Himmel und die Annäherung bis zu Petrus insgesamt zutreffend wieder. „In einer Verzückung“ ist jedoch für ἐν ἐκστάσει im modernen Standarddeutsch weniger klar und kann unangemessen einen freudig-emotionalen Zustand nahelegen. „In Trance“ gibt den visionären Ausnahmezustand genauer und zeitgemäßer wieder. Die Umstellung verbindet das Herabkommen und Herablassen ohne die im Deutschen unnötig holprige Dopplung zweier Hauptsätze.
  naturalness: „Ich war … und betete, als ich … sah“ bildet die Gleichzeitigkeit des griechischen Partizips natürlich ab. „In Trance“ ist heutiges, verständliches Standarddeutsch. Die Relativkonstruktion beim Gegenstand macht die Bildabfolge flüssig und bewahrt zugleich die unbestimmte Benennung.
  terminology: „Joppe“ ist die etablierte deutsche biblische Namensform. „Vision“ ist für ὅραμα passend. „Gegenstand“ wahrt die Weite von σκεῦος; die Fußnote nennt „Gefäß“ als mögliche engere Lesart. „An vier Ecken“ ist für τέσσαρσιν ἀρχαῖς idiomatisch und sachgerecht.
