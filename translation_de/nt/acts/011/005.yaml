source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: de
  text: 'Ich war in der Stadt Joppe und betete, als ich in Trance eine Vision sah: Ein Gegenstand[a], ähnlich einem großen Tuch, wurde an vier Ecken[b] vom Himmel herabgelassen und kam bis zu mir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gefäß“. Das griechische Wort kann allgemein einen Gegenstand, ein Gerät oder einen Behälter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an vier Enden“. Das griechische Wort bezeichnet hier die äußersten Punkte des herabgelassenen Gegenstands.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: Ich war in der Stadt Joppe und betete
  rationale: Die Formulierung bewahrt die ausdrücklich genannte Stadt und gibt das gleichzeitig stattfindende Gebet in natürlichem Deutsch wieder. „Joppe“ ist die im deutschen Bibelgebrauch etablierte Namensform.
- source_word: ἐν ἐκστάσει
  choice: in einer Verzückung
  rationale: „Verzückung“ bezeichnet hier einen außergewöhnlichen visionären Bewusstseinszustand, ohne das griechische Wort auf bloße Begeisterung oder Freude zu reduzieren.
- source_word: ὅραμα
  choice: eine Vision
  rationale: „Vision“ ist eine klare gegenwärtige Wiedergabe für eine übernatürliche Schau und bleibt von dem bezeichneten Zustand der Verzückung unterschieden.
- source_word: σκεῦός τι
  choice: ein Gegenstand
  rationale: σκεῦος ist ein weiter Begriff für einen Gegenstand, ein Gerät oder Gefäß. „Gegenstand“ wahrt die Unbestimmtheit, bevor der Vergleich mit einem Tuch folgt.
- source_word: ὡς ὀθόνην μεγάλην
  choice: ähnlich einem großen Tuch
  rationale: ὀθόνη bezeichnet ein großes Stoffstück beziehungsweise Tuch; „Tuch“ erzeugt im Deutschen ein natürlicheres Bild als das mehrdeutige „Laken“.
- source_word: τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: an vier Enden vom Himmel herabgelassen
  rationale: ἀρχαί meint hier die äußersten Punkte oder Enden. Die passive Form wird bewahrt, ohne einen Handelnden hinzuzufügen.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: kam bis zu mir
  rationale: „Bis zu mir“ gibt die durch ἄχρι bezeichnete räumliche Begrenzung genauer wieder als lediglich „zu mir“.
theological_decisions:
- issue: Wiedergabe der visionären Erfahrung
  choice: in einer Verzückung eine Vision
  alternative: in Trance eine Erscheinung
  rationale: 'Die Übersetzung hält ἔκστασις und ὅραμα als zwei unterschiedliche Elemente auseinander: den außergewöhnlichen Zustand und das darin Gesehene. Sie deutet weder die Ursache noch die genaue psychische Beschaffenheit näher aus.'
- issue: Unausgesprochener Handelnder beim Herablassen
  choice: wurde ... vom Himmel herabgelassen
  alternative: Gott ließ ... vom Himmel herab
  rationale: Der griechische Passivsatz nennt den Handelnden nicht. Die Übersetzung bewahrt diese Offenheit und fügt keine ausdrückliche Identifikation hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung entlastet die lange griechische Periode, ohne ihre zeitliche und bildliche Abfolge zu verändern.
