  to: 'Ich war in der Stadt Joppe und betete, als ich in Trance eine Vision sah: Ein Gegenstand[a], ähnlich einem großen Tuch, wurde an vier Ecken[b] vom Himmel herabgelassen und kam bis zu mir.'
