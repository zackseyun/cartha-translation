source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: de
  text: 'Da erinnerte ich mich an das Wort des Herrn, wie er sagte: »Johannes taufte mit Wasser; ihr aber werdet im Heiligen Geist[a] getauft werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit dem Heiligen Geist«. Die griechische Präposition kann hier sowohl im Sinn von »in« als auch von »mit« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: ich erinnerte mich
  rationale: Das deponentisch gebrauchte Aoristverb bezeichnet hier schlicht das Erinnern; die reflexive deutsche Wendung ist natürlich und genau.
- source_word: δὲ
  choice: Da
  rationale: δέ führt eine leichte narrative Weiterentwicklung ein. »Da« gibt den Anschluss im Deutschen idiomatisch wieder, ohne einen starken Gegensatz zu erzeugen.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: an das Wort des Herrn
  rationale: ῥῆμα meint hier ein gesprochenes Wort beziehungsweise einen Ausspruch. »Das Wort des Herrn« bewahrt die biblische Prägung und die Autorität des zitierten Jesuswortes.
- source_word: ὡς ἔλεγεν
  choice: wie er gesagt hatte
  rationale: Das Imperfekt stellt das frühere Sagen aus der Perspektive des Erinnerns dar. Das deutsche Plusquamperfekt macht die zeitliche Vorordnung natürlich deutlich, ohne eine gewohnheitsmäßige Wiederholung zu behaupten.
- source_word: Ἰωάννης μὲν ἐβάπτισεν ὕδατι
  choice: Johannes taufte mit Wasser
  rationale: »Taufen« ist der kontextuell etablierte Ausdruck; der bloße Dativ ὕδατι bezeichnet hier am natürlichsten das Mittel und wird mit »mit Wasser« wiedergegeben.
- source_word: ὑμεῖς δὲ βαπτισθήσεσθε
  choice: ihr aber werdet ... getauft werden
  rationale: Das ausdrückliche ὑμεῖς und die Partikelfolge μὲν ... δὲ markieren den Gegensatz zwischen Johannes und den Angesprochenen. Das Futur Passiv wird formal bewahrt.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: ἐν kann hier räumlich beziehungsweise sphärisch oder instrumental verstanden werden. Der Haupttext gibt die Konstruktion mit »im« wieder; die ebenfalls mögliche Übersetzung »mit dem« steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im Kontext bezeichnet κύριος Jesus als den autoritativen Sprecher. »Herr« ist die geläufige, gewichtige und konfessionell nicht einengende Wiedergabe.
- issue: Bedeutung der Präposition ἐν in ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  alternative: mit dem Heiligen Geist
  rationale: Die griechische Präposition lässt sowohl eine sphärisch-lokative als auch eine instrumentale Deutung zu. Der Haupttext wahrt die Formulierung mit »im«; die Fußnote erhält die sachlich mögliche Alternative, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist gut verständlich und hält zugleich den Gegensatz des griechischen μὲν ... δὲ fest. Die Fußnotenmarke steht unmittelbar nach dem betroffenen Zitat.
