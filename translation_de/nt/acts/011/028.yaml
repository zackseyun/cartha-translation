- from: Einer von ihnen, ein Mann namens Agabus, stand auf und kündigte durch den Geist an, dass eine große Hungersnot über die ganze bewohnte Welt kommen werde[a]. Sie trat dann zur Zeit des Claudius ein.
  to: Einer von ihnen namens Agabus stand auf und kündigte durch den Geist an, dass eine große Hungersnot über die ganze bewohnte Welt bevorstehe[a]. Sie trat zur Zeit des Claudius ein.
  rationale: Die Revision stellt die Nuance von μέλλειν ἔσεσθαι mit »bevorstehe« wieder her, entfernt die unbelegte Ergänzung »dann« und strafft die Personenbezeichnung. Der Umfang von οἰκουμένη bleibt im Haupttext bewusst offen; die Fußnote dokumentiert die kontextuell mögliche römisch-imperiale Lesart.
