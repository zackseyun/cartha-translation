    issue: μέλλειν ἔσεσθαι wird nicht hinreichend abgebildet.
    rationale: »kommen werde« kennzeichnet lediglich Zukunft. »bevorstehe« gibt die mit μέλλω + Infinitiv verbundene Erwartungs- bzw. Bevorstehensnuance wieder, ohne einen exakt bestimmbaren zeitlichen Abstand zu behaupten.
  - severity: low
    issue: Das Wort »dann« ergänzt einen zeitlichen Anschluss.
    rationale: ἥτις ἐγένετο bestätigt lediglich, dass die angekündigte Hungersnot eintrat; ein zusätzliches »dann« ist nicht nötig und kann entfallen.
