id: ACT.11.28
reference: Acts 11:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: de
  text: Einer von ihnen namens Agabus stand auf und kündigte durch den Geist an, dass eine große Hungersnot über die ganze bewohnte Welt bevorstehe[a]. Sie trat zur Zeit des Claudius ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ganze Welt«; in Lukas und der Apostelgeschichte kann »bewohnte Welt« auch enger die römische Welt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand auf
  rationale: Das Aoristpartizip leitet die Handlung des Agabus in der Versammlung ein. »Stand auf« ist natürliches modernes Deutsch und bewahrt den konkreten Handlungssinn.
- source_word: εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος
  choice: Einer von ihnen, ein Mann namens Agabus
  rationale: Die Formulierung gibt die Identifizierung klar und idiomatisch wieder; »ein Mann« macht im Deutschen den Anschluss mit »namens Agabus« flüssig, ohne zusätzliche inhaltliche Aussage.
- source_word: ἐσήμανεν
  choice: kündigte … an
  rationale: σημαίνω bedeutet anzeigen, kundtun oder zu erkennen geben. Im Zusammenhang einer zukünftigen Hungersnot bringt »ankündigte« den prädiktiven Sinn natürlich zum Ausdruck, ohne eine bestimmte Form der Offenbarung festzulegen.
- source_word: διὰ τοῦ πνεύματος
  choice: durch den Geist
  rationale: διά mit Genitiv bezeichnet hier Mittel oder Vermittlung. »Durch den Geist« bleibt nahe an der griechischen Formulierung; die Großschreibung weist kontextgemäß auf den Heiligen Geist.
- source_word: λιμὸν μεγάλην
  choice: eine große Hungersnot
  rationale: Die Wiedergabe entspricht unmittelbar dem Substantiv λιμός und dem Adjektiv μεγάλην und vermeidet eine unnötige Deutung als ausschließlich »schwer«.
- source_word: μέλλειν ἔσεσθαι
  choice: kommen werde
  rationale: Die Konstruktion drückt bevorstehende beziehungsweise erwartete Zukunft aus. Der deutsche Konjunktiv I fügt sich natürlich in die indirekte Ankündigung ein.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: über die ganze bewohnte Welt
  rationale: οἰκουμένη bezeichnet wörtlich die bewohnte Welt und kann im Kontext von Lukas und Apostelgeschichte besonders die römische Welt meinen. Die Haupttextfassung wahrt den weiteren lexikalischen Umfang.
- source_word: ἥτις ἐγένετο
  choice: Sie trat dann … ein
  rationale: Der Relativsatz bestätigt das Eintreffen der angekündigten Hungersnot. Ein neuer Satz mit »Sie trat … ein« ist im Deutschen klar und natürlich; »dann« verdeutlicht lediglich den erzählerischen Anschluss.
- source_word: ἐπὶ Κλαυδίου
  choice: zur Zeit des Claudius
  rationale: ἐπί mit Genitiv bezeichnet in chronologischen Angaben die Zeit unter einer Herrscherperson. Die Formulierung ist präzise und setzt das im Griechischen nicht ausdrücklich vorhandene Wort »Regierung« nicht voraus.
theological_decisions:
- issue: Bezug von τοῦ πνεύματος
  choice: Der Heilige Geist ist gemeint; daher »Geist« mit Großschreibung.
  alternative: Eine weniger bestimmte, geistgewirkte Eingebung.
  rationale: In prophetischen Zusammenhängen der Apostelgeschichte bezeichnet »der Geist« gewöhnlich den Heiligen Geist. Die Übersetzung wahrt zugleich die knappe Ausdrucksweise des Ausgangstextes.
- issue: Umfang von οἰκουμένη
  choice: Im Haupttext lexikalisch offen als »die ganze bewohnte Welt« wiedergegeben.
  alternative: »die ganze Welt« oder spezifischer »die ganze römische Welt«.
  rationale: Der Ausdruck kann die bewohnte Welt im weiten Sinn bezeichnen, in Lukas–Apostelgeschichte jedoch auch einen imperial-römischen Bezugsrahmen haben. Die Fußnote bewahrt diese Spannweite, ohne sie im Haupttext vorschnell einzuengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau wurde für natürliche deutsche Lesbarkeit leicht gegliedert; die sachliche und theologische Offenheit des griechischen Textes bleibt erhalten.
