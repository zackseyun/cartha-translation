id: ACT.11.11
reference: Acts 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: de
  text: 'Und sieh da: Genau in diesem Augenblick[a] kamen drei Männer zu dem Haus, in dem wir waren; sie waren aus Cäsarea zu mir geschickt worden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sogleich; oder: gerade da.'
    reason: Lexikalische Alternativen für ἐξαυτῆς, das die Unmittelbarkeit des Geschehens hervorhebt.
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh da
  rationale: Bewahrt die aufmerksamkeitslenkende, die Erzählung belebende Funktion des griechischen Ausdrucks, ohne altertümlich zu wirken.
- source_word: ἐξαυτῆς
  choice: genau in diesem Augenblick
  rationale: Gibt die unmittelbare zeitliche Verknüpfung mit dem zuvor berichteten Geschehen idiomatisch und nachdrücklich wieder.
- source_word: τρεῖς ἄνδρες
  choice: drei Männer
  rationale: Direkte und kontextgerechte Wiedergabe von Zahlwort und Personenbezeichnung.
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: kamen zu dem Haus
  rationale: Drückt das Eintreffen am genannten Ort in natürlichem Deutsch aus, ohne die mögliche Nuance plötzlichen Erscheinens zu überzeichnen.
- source_word: ἐν ᾗ ἦμεν
  choice: in dem wir waren
  rationale: Bleibt bei der schlichten Ortsangabe des Griechischen und ergänzt nicht deutend „wohnten“ oder „zu Gast waren“.
- source_word: ἀπεσταλμένοι
  choice: sie waren … geschickt worden
  rationale: Die passive Vorzeitigkeit des Partizips wird durch das Plusquamperfekt klar und natürlich wiedergegeben.
- source_word: ἀπὸ Καισαρείας
  choice: aus Cäsarea
  rationale: Bezeichnet idiomatisch den Herkunftsort der Gesandten.
- source_word: πρός με
  choice: zu mir
  rationale: Gibt Petrus als Ziel und Adressaten der Sendung unmittelbar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. „Sieh da“ erhält die lebendige Diskursmarkierung; der Doppelpunkt macht ihre hinweisende Funktion deutlich. Das griechische Partizip wird für bessere Verständlichkeit in einen mit Semikolon angeschlossenen Hauptsatz aufgelöst.
