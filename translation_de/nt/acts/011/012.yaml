source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: de
  text: Der Geist aber sagte mir, ich solle mit ihnen gehen, ohne einen Unterschied zu machen[a]. Auch diese sechs Brüder kamen mit mir, und wir gingen in das Haus des Mannes hinein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne zu zögern“ oder „ohne zu zweifeln“. Das griechische Partizip kann sowohl „keinen Unterschied zu machen“ als auch „nicht zu zögern“ oder „nicht zu zweifeln“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: der Geist
  rationale: Der bestimmte Ausdruck bezeichnet im Zusammenhang der göttlichen Weisung den Heiligen Geist; „der Geist“ bewahrt zugleich den Wortlaut, der „heilig“ hier nicht ausdrücklich enthält.
- source_word: εἶπεν ... μοι
  choice: sagte mir
  rationale: Die Verbindung mit dem Infinitiv wird im Deutschen natürlich als indirekte Aufforderung mit „ich solle“ wiedergegeben.
- source_word: συνελθεῖν αὐτοῖς
  choice: mit ihnen gehen
  rationale: συνέρχομαι bezeichnet hier das Begleiten der Männer; diese Formulierung ist klar und idiomatisch.
- source_word: μηδὲν διακρίναντα
  choice: ohne Unterschied zu machen
  rationale: διακρίνω kann unterscheiden, zweifeln oder zögern bedeuten. Im Zusammenhang der Überschreitung der Grenze zwischen Juden und Nichtjuden liegt „keinen Unterschied machen“ nahe; die anderen Möglichkeiten bleiben in der Fußnote erhalten.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: diese sechs Brüder
  rationale: Die sechs Begleiter sind männlich; „Brüder“ gibt ἀδελφοί hier sachgerecht wieder, und „diese“ entspricht οὗτοι.
- source_word: εἰσήλθομεν
  choice: wir gingen ... hinein
  rationale: Die trennbare deutsche Wendung gibt das Eintreten natürlich und erzählerisch wieder.
- source_word: εἰς τὸν οἶκον τοῦ ἀνδρός
  choice: in das Haus des Mannes
  rationale: Die Formulierung bewahrt das ausdrücklich genannte ἀνήρ und klingt im Deutschen würdig und verständlich.
theological_decisions:
- issue: Bedeutung von μηδὲν διακρίναντα in Petrus’ Bericht
  choice: ohne Unterschied zu machen
  alternative: ohne zu zögern / ohne zu zweifeln
  rationale: Der unmittelbare Zusammenhang betrifft Petrus’ Umgang mit Nichtjuden und stützt die Bedeutung, keinen Unterschied zwischen Menschengruppen zu machen. Da das griechische Partizip ebenso ein inneres Schwanken oder Zweifeln bezeichnen kann, werden diese Deutungen nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung bildet die indirekte Weisung natürlich ab; die genuine Mehrdeutigkeit von διακρίνω wird durch die Fußnote bewahrt.
