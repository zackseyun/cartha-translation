id: ACT.24.1
reference: Acts 24:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: de
  text: Fünf Tage später kam der Hohe Priester Hananias mit einigen Ältesten und einem gewissen Redner namens Tertullus herab. Sie erhoben beim Statthalter Anklage gegen Paulus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Redner“ kann hier auch „Anwalt“ oder „juristischer Sprecher“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Fünf Tage später
  rationale: μετά mit Akkusativ bezeichnet die nach fünf Tagen verstrichene Zeit. Die leichte Fortführungsfunktion von δέ wird im natürlichen deutschen Erzählfluss nicht eigens markiert.
- source_word: κατέβη
  choice: kam … herab
  rationale: Bewahrt die Richtungsangabe von Jerusalem nach Cäsarea und entspricht der erzählerischen Perspektive am Zielort.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: der Hohe Priester Hananias
  rationale: Bezeichnet das jüdische Hohepriesteramt; der Name wird nach gängiger deutscher Bibeltradition als Hananias wiedergegeben.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: mit einigen Ältesten
  rationale: τινῶν ist unbestimmt; die Ältesten sind hier jüdische Führungspersonen, nicht christliche Gemeindeälteste.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: einem gewissen Redner namens Tertullus
  rationale: ῥήτωρ kann einen öffentlichen Redner oder juristischen Sprecher bezeichnen. „Redner“ bewahrt die lexikalische Breite; „einem gewissen“ gibt die Unbestimmtheit von τινός wieder.
- source_word: ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: Sie erhoben beim Statthalter Anklage gegen Paulus
  rationale: Im gerichtlichen Zusammenhang bezeichnet ἐμφανίζω eine förmliche Anzeige oder Anklage. „Beim Statthalter“ gibt den Dativ idiomatisch wieder, κατά mit Genitiv die gegen Paulus gerichtete Anklage.
