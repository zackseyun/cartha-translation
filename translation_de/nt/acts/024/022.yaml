base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: de
  text: 'Felix aber, der über den Weg genauer Bescheid wusste, vertagte die Verhandlung[a] und sagte: »Wenn der Befehlshaber Lysias herabkommt, werde ich über euren Fall entscheiden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hielt sie hin«; das griechische Verb kann bedeuten, die Beteiligten hinzuhalten oder eine gerichtliche Entscheidung beziehungsweise Verhandlung aufzuschieben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο … αὐτούς
  choice: vertagte die Verhandlung
  rationale: Das Verb bezeichnet hier das Aufschieben einer gerichtlichen Entscheidung. Obwohl αὐτούς wörtlich auf die Beteiligten verweist, gibt »vertagte die Verhandlung« den juristischen Sinn im natürlichen Deutschen klar wieder; die Fußnote bewahrt die formnähere Möglichkeit.
- source_word: ἀκριβέστερον εἰδὼς
  choice: der … genauer Bescheid wusste
  rationale: Die Formulierung erhält die komparative Bedeutung von ἀκριβέστερον und klingt zugleich gegenwärtig und verständlich.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: über den Weg
  rationale: »Der Weg« bleibt als frühchristliche Bezeichnung erhalten, ohne sie im Haupttext erklärend durch »christliche Bewegung« zu ersetzen.
- source_word: Ὅταν … καταβῇ
  choice: Wenn … herabkommt
  rationale: Ὅταν mit Aorist Konjunktiv bezeichnet hier ein erwartetes künftiges Eintreffen. »Herabkommt« bewahrt die antike geographische Ausdrucksweise.
- source_word: χιλίαρχος
  choice: Befehlshaber
  rationale: Der Ausdruck bezeichnet einen hohen römischen Offizier. »Befehlshaber« ist verständlich, ohne den weniger geläufigen Fachbegriff »Tribun« vorauszusetzen.
- source_word: διαγνώσομαι τὰ καθ’ ὑμᾶς
  choice: werde ich über euren Fall entscheiden
  rationale: Die Wiedergabe macht den gerichtlichen Zusammenhang idiomatisch deutlich und erfasst διαγνώσομαι als rechtliche Entscheidung nach Prüfung.
theological_decisions:
- issue: Bedeutung von »der Weg«
  choice: Die Bezeichnung bleibt wörtlich und als Eigenbezeichnung erkennbar.
  alternative: die christliche Bewegung
  rationale: Der griechische Text verwendet die in der Apostelgeschichte mehrfach belegte Bezeichnung ἡ ὁδός. Eine erklärende Auflösung im Haupttext würde die Bildsprache und historische Benennung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für natürliche Lesbarkeit leicht umgestellt. »Der Weg« bleibt als historische frühchristliche Bezeichnung unaufgelöst; »herabkommt« bewahrt die Perspektive des Ausgangstextes.
