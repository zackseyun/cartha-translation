  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: de
  text: Nach mehreren Jahren kam ich, um meinem Volk Spenden für Bedürftige zu bringen und Opfergaben darzubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Nach mehreren Jahren … nun
  rationale: διά mit dem Genitiv bezeichnet hier einen verstrichenen Zeitraum; πλειόνων ist idiomatisch als „mehreren“ wiedergegeben. „nun“ bildet die leicht fortführende Kraft von δέ natürlich ab, ohne einen starken Gegensatz auszudrücken.
- source_word: ἐλεημοσύνας
  choice: Spenden für Bedürftige
  rationale: ἐλεημοσύνη bezeichnet hier wohltätige Gaben an Bedürftige. Die Formulierung ist im heutigen Deutsch klarer als „Almosen“ und bewahrt den konkreten Sinn.
- source_word: ποιήσων
  choice: zu bringen
  rationale: ποιέω bildet mit ἐλεημοσύνας die Wendung „Almosen geben/wohltätige Gaben leisten“. Im Zusammenhang mit εἰς τὸ ἔθνος μου ist „bringen“ eine natürliche Wiedergabe des beabsichtigten Handelns.
- source_word: εἰς τὸ ἔθνος μου
  choice: meinem Volk
  rationale: ἔθνος bezeichnet hier das jüdische Volk, dem Paulus selbst angehört. „meinem Volk“ klingt im Deutschen natürlicher als „meiner Nation“ und gibt den Bezug eindeutig wieder.
- source_word: παρεγενόμην
  choice: kam ich
  rationale: παραγίνομαι bezeichnet hier das Eintreffen beziehungsweise Kommen; „kam ich“ ist knapp und idiomatisch.
- source_word: προσφοράς
  choice: Opfergaben darzubringen
  rationale: προσφοράς bezeichnet Gaben, häufig im kultischen Sinn. „Opfergaben“ lässt die genaue Art offen, während „darzubringen“ die im Griechischen mit dem vorausgehenden Zwecksatz koordinierte Handlung im Deutschen natürlich ausdrückt.
theological_decisions:
- issue: Art der von Paulus nach Jerusalem gebrachten Hilfe
  choice: Spenden für Bedürftige
  alternative: Almosen
  rationale: Die Entscheidung ist vor allem lexikalisch. Sie macht den wohltätigen Zweck deutlich, ohne eine konfessionell geprägte Praxis vorauszusetzen.
- issue: Bezug von προσφοράς
  choice: Opfergaben
  alternative: Gaben
  rationale: Der kultische Bedeutungsbereich des Wortes wird kenntlich gemacht, doch die genaue Art der Opfergaben bleibt entsprechend dem griechischen Text unbestimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung unterscheidet klar zwischen den Spenden für das jüdische Volk und den Opfergaben; „nun“ trägt die schwache Fortführung durch δέ.
