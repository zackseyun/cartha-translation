id: ACT.24.9
reference: Acts 24:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συνεπέθεντο δὲ καὶ οἱ Ἰουδαῖοι φάσκοντες ταῦτα οὕτως ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/009.yaml
  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: de
  text: Auch die Juden schlossen sich den Anschuldigungen an[a] und versicherten, dass es sich so verhielt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch die Juden schlossen sich dem Angriff an und behaupteten, dass es sich so verhielt.“'
    reason: Das Verb kann sowohl die Unterstützung einer Anklage als auch das gemeinsame Angreifen ausdrücken.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: schlossen sich den Anschuldigungen an
  rationale: Das Verb kann ein gemeinsames Angreifen oder ein unterstützendes Hinzutreten bezeichnen. Im gerichtlichen Zusammenhang geht es darum, dass die anwesenden Juden die zuvor vorgebrachten Anschuldigungen unterstützten. Die Formulierung bewahrt den forensischen Sinn, ohne einen körperlichen Angriff nahezulegen.
- source_word: δὲ
  choice: Auch …
  rationale: δέ führt die Erzählung mit einer milden Verknüpfung fort; im Deutschen wird seine verbindende Funktion zusammen mit καί natürlich durch die Satzstellung und „auch“ wiedergegeben.
- source_word: καὶ
  choice: Auch
  rationale: καί kennzeichnet die Juden als weitere Beteiligte an der Anklage.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die Bezeichnung meint hier die beim Verfahren anwesende jüdische Partei. „Die Juden“ entspricht dem griechischen Ausdruck, ohne die Referenz unnötig geografisch einzuengen.
- source_word: φάσκοντες
  choice: und versicherten
  rationale: Das Partizip bezeichnet ihre nachdrückliche Behauptung, dass die Vorwürfe zuträfen. „Versicherten“ passt zum gerichtlichen Kontext und gibt die feste Behauptung wieder, ohne ihre Wahrheit vorwegzunehmen.
- source_word: ταῦτα
  choice: es
  rationale: Das deutsche Pronomen nimmt idiomatisch die zuvor genannten Anschuldigungen auf. Eine formalere Wiedergabe mit „diese Dinge“ wäre im heutigen Deutsch schwerfällig.
- source_word: οὕτως ἔχειν
  choice: dass es sich so verhielt
  rationale: Die griechische Wendung bedeutet idiomatisch, dass etwas so ist beziehungsweise sich so verhält. Wegen des erzählerischen Präteritums ist „verhielt“ natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die gerichtliche Situation wird mit „Anschuldigungen“ klar erkennbar gemacht; die Fußnote bewahrt die stärkere, adversative Bedeutungsmöglichkeit des griechischen Verbs.
