source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: de
  text: Einige Tage später kam Felix mit Drusilla, seiner eigenen Frau, die Jüdin war. Er ließ Paulus zu sich holen und hörte ihm zu, als dieser über den Glauben an den Messias Jesus sprach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Einige Tage später
  rationale: Die zeitliche Wendung bedeutet wörtlich „nach einigen Tagen“; die gewählte Form ist im modernen deutschen Erzählstil natürlicher. δέ markiert hier lediglich den Fortgang der Erzählung und braucht kein eigenes Wort.
- source_word: παραγενόμενος
  choice: kam
  rationale: Das Partizip bezeichnet das Kommen beziehungsweise Eintreffen des Felix und wird als untergeordnete Handlung zum Hauptverb wiedergegeben.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: mit seiner Frau Drusilla
  rationale: σύν bezeichnet Begleitung. ἰδίᾳ macht die Beziehung eindeutig possessiv; „seiner Frau“ ist im Deutschen idiomatisch, während „seiner eigenen Frau“ hier unnatürlich betont wäre.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: die Jüdin war
  rationale: Die partizipiale Beschreibung wird durch einen Relativsatz klar und knapp wiedergegeben. „Jüdin“ entspricht der femininen Form Ἰουδαία und lässt die im Kontext mögliche ethnische und religiöse Zugehörigkeit offen.
- source_word: μετεπέμψατο τὸν Παῦλον
  choice: Er ließ Paulus holen
  rationale: Das Medium μεταπέμπομαι bedeutet, jemanden zu sich rufen beziehungsweise holen zu lassen. Die deutsche Formulierung bewahrt, dass Felix den Auftrag dazu gab.
- source_word: ἤκουσεν αὐτοῦ
  choice: hörte ihm zu
  rationale: ἀκούω mit dem Genitiv kann das aufmerksame Anhören einer Person bezeichnen. Im Zusammenhang einer Darlegung ist „hörte ihm zu“ natürlicher und genauer als bloß „hörte ihn“.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: als er über den Glauben an den Messias Jesus sprach
  rationale: περί mit Genitiv bezeichnet das Thema des Gehörten. Die explizite Sprechformulierung macht im Deutschen verständlich, worin das Anhören bestand, ohne den Aussagegehalt zu erweitern. πίστις mit εἰς bezeichnet hier Glauben beziehungsweise Vertrauen, das auf eine Person gerichtet ist.
- source_word: Χριστὸν Ἰησοῦν
  choice: den Messias Jesus
  rationale: Χριστός trägt hier Titelfunktion und wird daher mit „Messias“ übersetzt; die griechische Reihenfolge bleibt erhalten.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias Jesus
  alternative: Christus Jesus; Jesus, den Messias
  rationale: „Messias“ macht den Titelcharakter von Χριστός transparent und bewahrt zugleich die Reihenfolge des griechischen Ausdrucks. „Christus Jesus“ ist kirchlich vertrauter, lässt den Titel für heutige Leser jedoch leichter wie einen Namen erscheinen.
- issue: Bedeutung von πίστις in der Verbindung mit εἰς
  choice: Glaube an den Messias Jesus
  alternative: Vertrauen auf den Messias Jesus
  rationale: πίστις mit εἰς und Akkusativ bezeichnet am natürlichsten eine auf Jesus gerichtete Glaubens- beziehungsweise Vertrauenshaltung. „Glaube“ ist die etablierte und sachlich offene Hauptwiedergabe; die mögliche Nuance „Vertrauen“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die lange griechische Satzstruktur wird in zwei Sätze gegliedert. Der Titel „Messias“ bleibt ausdrücklich erkennbar; konfessionell geprägte Zusätze werden vermieden.
