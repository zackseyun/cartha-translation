revisions:
- from: Einige Tage später kam Felix mit seiner Frau Drusilla, die Jüdin war. Er ließ Paulus holen und hörte ihm zu, als er über den Glauben an den Messias Jesus sprach.[a]
  to: Einige Tage später kam Felix mit Drusilla, seiner eigenen Frau, die Jüdin war. Er ließ Paulus zu sich holen und hörte ihm zu, als dieser über den Glauben an den Messias Jesus sprach.
  rationale: Die Revision bewahrt die zeitliche Abfolge und die Aussage des griechischen Satzes, gibt das possessiv-emphatische ἰδίᾳ mit „seiner eigenen Frau“ wieder und beseitigt die deutsche Pronomenmehrdeutigkeit. Die explizite Wiedergabe des Sprechens ist eine notwendige idiomatische Entfaltung von „hörte ihm zu ... über“ und fügt keinen neuen Sachinhalt hinzu. Nicht erforderliche Alternativfußnoten werden entfernt.
