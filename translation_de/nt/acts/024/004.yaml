source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: de
  text: Doch damit ich dich nicht noch länger aufhalte, bitte ich dich, uns in deiner Güte kurz anzuhören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufgrund deiner Nachsicht« / »in deiner Milde«. Das griechische Wort kann Güte, Billigkeit, Milde oder Nachsicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Doch damit … nicht
  rationale: Gibt den milden Gegensatz von δέ und die verneinte Zweckangabe von ἵνα natürlich und zugleich quellennah wieder.
- source_word: ἐπὶ πλεῖόν
  choice: noch länger
  rationale: Die Wendung bezeichnet hier eine weitere zeitliche Beanspruchung des Statthalters.
- source_word: σε ἐγκόπτω
  choice: ich dich … aufhalte
  rationale: ἐγκόπτω bedeutet hindern oder aufhalten; im Rahmen der förmlichen Anhörung geht es darum, nicht noch mehr Zeit des Angeredeten in Anspruch zu nehmen.
- source_word: παρακαλῶ
  choice: ich bitte dich
  rationale: Entspricht der höflichen, eindringlichen Bitte in dieser respektvollen Gerichtsrede, ohne im modernen Deutschen übertrieben unterwürfig zu wirken.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: dich, uns … anzuhören
  rationale: Bewahrt die direkte Bitte an Felix und gibt ἀκούω mit Genitiv im rechtlichen Kontext idiomatisch als »jemanden anhören« wieder.
- source_word: συντόμως
  choice: kurz
  rationale: Bezeichnet die zugesagte Kürze der folgenden Darlegung.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: in deiner Güte
  rationale: ἐπιείκεια umfasst Güte, Milde, Nachsicht und Billigkeit. »In deiner Güte« bewahrt den ehrerbietigen Appell, ohne die Bedeutung ausschließlich auf richterliche Milde festzulegen.
