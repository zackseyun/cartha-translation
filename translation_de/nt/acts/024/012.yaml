source:
  edition: SBLGNT
  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: de
  text: Sie haben mich weder im Tempel dabei angetroffen, wie ich mit jemandem stritt[a] oder eine Menschenmenge zusammenbrachte[b], noch in den Synagogen noch irgendwo in der Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ich mit jemandem diskutierte“ oder „eine Auseinandersetzung führte“. Das griechische Verb kann ein Gespräch, eine Erörterung oder einen Streit bezeichnen; im Zusammenhang mit dem Vorwurf öffentlicher Unruhe liegt ein kontroverser Sinn nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Menschenauflauf verursachte“. Der griechische Ausdruck bezeichnet das Zusammenbringen einer Menge oder das Hervorrufen öffentlicher Unruhe, setzt aber nicht unbedingt einen gewaltsamen Aufstand voraus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: Tempel
  rationale: ἱερόν bezeichnet hier den Tempelbereich insgesamt, nicht speziell das innere Heiligtum. „Tempel“ ist dafür die natürliche deutsche Wiedergabe.
- source_word: εὗρόν με
  choice: sie haben mich … angetroffen
  rationale: Im forensischen Zusammenhang geht es darum, dass die Ankläger Paulus bei keinem der behaupteten Vorgänge beobachtet beziehungsweise angetroffen haben.
- source_word: πρός τινα διαλεγόμενον
  choice: wie ich mit jemandem stritt
  rationale: διαλέγομαι kann ein Gespräch, eine Erörterung oder eine Auseinandersetzung bezeichnen. Der Kontext einer Verteidigung gegen den Vorwurf öffentlicher Unruhestiftung legt hier die stärker kontroverse Bedeutung nahe, ohne sie als einzig mögliche festzuschreiben.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: eine Menschenmenge in Aufruhr brachte
  rationale: Die Wendung beschreibt das Verursachen eines Menschenauflaufs oder einer öffentlichen Unruhe. Die Formulierung gibt den Störungsaspekt wieder, ohne einen gewaltsamen Aufstand oder eine vollständige Ausschreitung vorauszusetzen.
- source_word: ὄχλου
  choice: eine Menschenmenge
  rationale: Das artikellose ὄχλου bezeichnet hier eine unbestimmte Ansammlung von Menschen. „Menschenmenge“ vermeidet die zu starke gewaltsame Nebenbedeutung von „Mob“.
- source_word: συναγωγαῖς
  choice: Synagogen
  rationale: Dies ist die übliche und sachlich genaue Wiedergabe von συναγωγή in diesem jüdischen Umfeld.
- source_word: κατὰ τὴν πόλιν
  choice: sonst irgendwo in der Stadt
  rationale: κατά mit Akkusativ erstreckt die Verneinung räumlich über die Stadt. Im Deutschen bringt „sonst irgendwo in der Stadt“ idiomatisch zum Ausdruck, dass Paulus an keinem Ort der Stadt bei solchen Handlungen angetroffen wurde.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt die dreifache Ortsverneinung des griechischen Textes, formuliert sie jedoch idiomatisch. Die Fußnoten halten die Bedeutungsbreite von διαλέγομαι und ἐπίστασιν ποιοῦντα ὄχλου offen.
