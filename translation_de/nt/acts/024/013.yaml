base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: de
  text: Auch können sie dir nicht beweisen, was sie mir jetzt vorwerfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dir darlegen“ oder „dir nachweisen“; das griechische Verb kann bedeuten, etwas vorzulegen oder festzustellen, hier im Sinn, eine Anklage zu erhärten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Auch … nicht
  rationale: Die fortführende Verneinung knüpft an die vorherige Aussage an und klingt im modernen Deutschen natürlich.
- source_word: παραστῆσαι
  choice: beweisen
  rationale: Das Verb kann wörtlich „vorlegen“ oder „darstellen“ bedeuten; im gerichtlichen Zusammenhang bezeichnet es hier das Erhärten beziehungsweise Beweisen eines Vorwurfs.
- source_word: δύνανταί
  choice: können
  rationale: Gibt die ausgedrückte Fähigkeit unmittelbar und idiomatisch wieder.
- source_word: σοι
  choice: dir
  rationale: Entspricht dem Dativ und bewahrt die direkte Anrede an Felix, ohne den rechtlichen Kontext zusätzlich auszudeuten.
- source_word: περὶ ὧν
  choice: was
  rationale: Die kompakte deutsche Relativkonstruktion gibt die Dinge beziehungsweise Sachverhalte wieder, auf die sich die Anklage bezieht.
- source_word: νυνὶ
  choice: jetzt
  rationale: Bewahrt den ausdrücklichen Gegenwartsbezug.
- source_word: κατηγοροῦσίν μου
  choice: sie mir … vorwerfen
  rationale: „Jemandem etwas vorwerfen“ gibt den Anklagesinn im Kontext natürlich wieder; die fortdauernde gegenwärtige Handlung wird zusammen mit „jetzt“ deutlich.
