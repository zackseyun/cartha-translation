  text: δυναμένου σου ⸀ἐπιγνῶναι, ὅτι οὐ πλείους εἰσίν μοι ἡμέραι ⸀δώδεκα ἀφ’ ἧς ἀνέβην προσκυνήσων ⸀εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: de
  text: Wie du feststellen kannst, sind es nicht mehr als zwölf Tage, seit ich nach Jerusalem hinaufging, um anzubeten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: Wie du selbst feststellen kannst
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet Felix’ Möglichkeit, den Sachverhalt zu ermitteln. „Feststellen“ passt zum gerichtlichen Zusammenhang; „wie“ bewahrt den begleitenden, nicht ausdrücklich kausalen Sinn. „selbst“ macht den Bezug des griechischen σου im Deutschen natürlich deutlich.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: sind es nicht mehr als zwölf Tage
  rationale: Die idiomatische Zeitangabe wird in natürlichem Deutsch als begrenzte verstrichene Zeitspanne wiedergegeben, ohne den Sinn durch eine wörtliche Nachbildung von μοι zu verdunkeln.
- source_word: ἀφ’ ἧς
  choice: seit
  rationale: Die Verbindung markiert den Anfangspunkt der genannten Zeitspanne; „seit“ ist dafür die natürliche deutsche Entsprechung.
- source_word: ἀνέβην
  choice: ich hinauf ... ging
  rationale: Die traditionelle räumliche Rede vom Hinaufgehen nach Jerusalem bleibt erhalten.
- source_word: προσκυνήσων
  choice: um anzubeten
  rationale: Das Futurpartizip bezeichnet den Zweck der Reise. Das nicht ausdrücklich genannte Objekt der Anbetung wird auch im Deutschen nicht ergänzt.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Bei Städtenamen ist „nach“ die natürliche deutsche Wiedergabe des Ziels.
theological_decisions: []
