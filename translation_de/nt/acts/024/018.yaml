  source_fidelity: Die Grundbedeutung wird getroffen. Das perfektische Passivpartizip ἡγνισμένον beschreibt jedoch Paulus als in einem bereits gereinigten Zustand vorgefunden; „nachdem ich mich gereinigt hatte“ verschiebt dies zu einer aktiven, zeitlichen Nebenhandlung. Zudem gibt „unter Aufruhr“ μετὰ θορύβου nicht idiomatisch wieder.
  naturalness: „Dabei fanden sie mich im Tempel gereinigt vor“ ist modernes, natürliches Standarddeutsch und bildet den vorgefundenen Zustand klar ab. „Ohne Menschenmenge und ohne Aufruhr“ ist für die doppelte griechische Verneinung idiomatischer als die Mischung „weder ... noch unter Aufruhr“.
  terminology: „Tempel“ ist als reguläre Wiedergabe von ἱερόν angemessen; die Fußnote erläutert sachgerecht, dass „gereinigt“ eine rituelle Reinigung meint. „Aufruhr“ gibt θόρυβος im forensischen Kontext treffend wieder.
