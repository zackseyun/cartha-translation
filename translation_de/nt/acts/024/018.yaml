- from: Dabei fanden sie mich im Tempel, nachdem ich mich gereinigt hatte,[a] weder mit einer Menschenmenge noch unter Aufruhr.
  to: Dabei fanden sie mich im Tempel gereinigt vor,[a] ohne Menschenmenge und ohne Aufruhr.
  rationale: Die Revision bewahrt die anaphorische Offenheit von ἐν αἷς durch „Dabei“, gibt das perfektische Passivpartizip als vorgefundenen gereinigten Zustand wieder und ersetzt die im Deutschen unnatürliche Konstruktion „noch unter Aufruhr“ durch eine semantisch genaue doppelte Verneinung. Die vorhandene Fußnotenverankerung bleibt unmittelbar bei „gereinigt“ und erklärt den kultischen Sinn ohne Überinterpretation.
