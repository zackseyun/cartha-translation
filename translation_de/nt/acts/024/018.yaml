  text: ἐν ⸀αἷς εὗρόν με ἡγνισμένον ἐν τῷ ἱερῷ, οὐ μετὰ ὄχλου οὐδὲ μετὰ θορύβου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: de
  text: Dabei fanden sie mich im Tempel gereinigt vor,[a] ohne Menschenmenge und ohne Aufruhr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Gereinigt“ bezieht sich auf eine rituelle beziehungsweise zeremonielle Reinigung. Auch möglich: „Dabei fanden sie mich gereinigt im Tempel.“'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: Dabei
  rationale: Die relative Wendung nimmt die zuvor genannten Vorgänge auf. „Dabei“ gibt diesen anaphorischen und zeitlich-umständlichen Bezug im Deutschen natürlich wieder, ohne ihn unnötig festzulegen.
- source_word: εὗρόν με
  choice: fanden sie mich
  rationale: 'Dies entspricht dem gewöhnlichen erzählerischen Sinn: Sie trafen Paulus im Tempel an.'
- source_word: ἡγνισμένον
  choice: nachdem ich mich gereinigt hatte
  rationale: Das Perfektpartizip bezeichnet einen erreichten Zustand nach vollzogener ritueller Reinigung. Die deutsche Formulierung macht den vorausgehenden Vollzug verständlich; die kultische Bedeutung wird in der Fußnote erläutert.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den Tempelbereich, nicht speziell das innere Heiligtum. „Im Tempel“ ist die übliche natürliche Wiedergabe.
- source_word: οὐ μετὰ ὄχλου
  choice: weder mit einer Menschenmenge
  rationale: ὄχλος bedeutet eine Menge von Menschen. „Menschenmenge“ ist neutral und unterstellt anders als „Mob“ keine Gewalttätigkeit.
- source_word: οὐδὲ μετὰ θορύβου
  choice: noch unter Aufruhr
  rationale: θόρυβος bezeichnet Lärm, Unruhe oder öffentlichen Tumult. „Unter Aufruhr“ passt zum Kontext der gerichtlichen Verteidigung.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Dabei“ vermeidet das im Deutschen unklare „in diesen Dingen“. Die paarige Verneinung „weder … noch“ bildet die griechische Konstruktion natürlich ab.
