  source_fidelity: Die drei Themen entsprechen dem griechischen Text. „das kommende Gericht“ gibt τοῦ κρίματος τοῦ μέλλοντος angemessen und ohne unzulässige Festlegung wieder. Die Wiedergabe von μετακαλέσομαί σε als „werde ich dich wieder rufen lassen“ fügt jedoch einen nicht geforderten Wiederholungsaspekt hinzu; das Verb bedeutet hier „zu sich rufen lassen / vorladen“.
  naturalness: „Für jetzt kannst du gehen“ ist verständlich, aber weniger idiomatisch und schwächt den Imperativ πορεύου. „Fürs Erste geh“ ist modernes, natürliches Standarddeutsch und bewahrt Felix’ knappe Anweisung.
  terminology: „Gerechtigkeit“, „Selbstbeherrschung“ und „kommendes Gericht“ sind treffend, geläufig und theologisch nicht einengend.
  issues:
