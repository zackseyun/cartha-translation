id: ACT.24.25
reference: Acts 24:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: de
  text: 'Als er aber über Gerechtigkeit, Selbstbeherrschung und das kommende Gericht sprach, bekam Felix Angst und erwiderte: »Fürs Erste geh. Wenn sich eine Gelegenheit ergibt, werde ich dich zu mir rufen lassen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: als er … sprach
  rationale: Das Partizip bezeichnet hier Paulus’ fortlaufende Darlegung beziehungsweise Erörterung. „Sprach“ ist im Deutschen natürlich und lässt den dialogischen Charakter des Verbs offen.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: Entspricht dem breiten Bedeutungsfeld von δικαιοσύνη und wahrt sowohl die ethische als auch die theologische Dimension.
- source_word: ἐγκρατείας
  choice: Selbstbeherrschung
  rationale: Gibt die Beherrschung eigener Begierden und Impulse in geläufigem modernem Deutsch wieder.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: das kommende Gericht
  rationale: Die attributive Konstruktion bezeichnet das noch bevorstehende Gericht; „Gericht“ bewahrt die mögliche Bedeutung von Urteil und Gerichtsgeschehen.
- source_word: ἔμφοβος γενόμενος
  choice: bekam … Angst
  rationale: Gibt das Eintreten des Erschreckens idiomatisch und deutlich wieder.
- source_word: Τὸ νῦν ἔχον
  choice: Für jetzt
  rationale: Die idiomatische Wendung bedeutet „für den gegenwärtigen Augenblick“ und markiert Felix’ Aufschub knapp.
- source_word: καιρὸν … μεταλαβών
  choice: Wenn ich Gelegenheit finde
  rationale: Drückt aus, dass Felix später einen passenden Zeitpunkt beziehungsweise eine Gelegenheit erlangen will, ohne Gewissheit über deren Eintritt hinzuzufügen.
- source_word: μετακαλέσομαί σε
  choice: werde ich dich wieder rufen lassen
  rationale: Das Verb bezeichnet ein erneutes Herbeirufen; „rufen lassen“ passt zu Felix’ amtlicher Stellung und bewahrt den Wiederholungsaspekt.
theological_decisions:
- issue: Bezug und Charakter des kommenden Gerichts
  choice: das kommende Gericht
  alternative: das künftige Urteil
  rationale: Die Übersetzung wahrt die eschatologische Aussage, ohne festzulegen, ob κρίμα vorrangig den Vorgang des Richtens oder dessen Urteil bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber idiomatisch geglättet. Keine konfessionellen Zusätze oder erklärenden Erweiterungen.
