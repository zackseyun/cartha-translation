source:
  edition: SBLGNT
  text: πάντῃ τε καὶ πανταχοῦ ἀποδεχόμεθα, κράτιστε Φῆλιξ, μετὰ πάσης εὐχαριστίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/003.yaml
  text: In every way and everywhere we acknowledge this[a], most excellent Felix, with all gratitude.
translation:
  language: de
  text: Dies erkennen wir in jeder Hinsicht und überall mit aller Dankbarkeit an, hochgeehrter Felix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies nehmen wir … an“ beziehungsweise „Dies heißen wir … willkommen“. Das griechische Verb kann „annehmen“, „willkommen heißen“ oder „anerkennen“ bedeuten; hier ist wahrscheinlich die öffentliche Anerkennung der Felix zugeschriebenen Wohltaten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντῃ
  choice: in jeder Hinsicht
  rationale: Das Adverb bezeichnet hier die umfassende Weise bzw. den vollen Umfang der Anerkennung und bildet mit πανταχοῦ ein rhetorisches Paar.
- source_word: τε καὶ
  choice: und
  rationale: Die Verbindung verknüpft die beiden Adverbialbestimmungen; im Deutschen gibt schlichtes „und“ die korrelative Funktion natürlich wieder.
- source_word: πανταχοῦ
  choice: überall
  rationale: Die örtliche Bedeutung und der umfassende Geltungsanspruch werden knapp und idiomatisch bewahrt.
- source_word: ἀποδεχόμεθα
  choice: erkennen wir … an
  rationale: Im forensisch-rhetorischen Zusammenhang geht es um die dankbare öffentliche Anerkennung der zuvor Felix zugeschriebenen Wohltaten. Das vorangestellte „Dies“ ergänzt das im Griechischen unausgesprochene Objekt, ohne den Bezug enger festzulegen.
- source_word: κράτιστε
  choice: hochgeehrter
  rationale: Die ehrende Anrede für einen hohen Amtsträger wird in natürlichem, würdevollem Deutsch wiedergegeben. „Vortrefflichster“ wäre formaler, klingt heute jedoch unnatürlich.
- source_word: Φῆλιξ
  choice: Felix
  rationale: Der Personenname folgt der im Deutschen etablierten Form.
- source_word: μετὰ πάσης εὐχαριστίας
  choice: mit großer Dankbarkeit
  rationale: Die Wendung bezeichnet eine umfassende bzw. volle Dankbarkeit. „Mit aller Dankbarkeit“ wäre formnäher, aber im heutigen Deutsch weniger idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem höfischen Ton einer förmlichen Gerichtsrede. Die rhetorische Breite von πάντῃ … πανταχοῦ bleibt erhalten; die mögliche Bedeutungsbreite von ἀποδεχόμεθα wird in der Fußnote kenntlich gemacht.
