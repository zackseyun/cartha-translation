id: ACT.24.26
reference: Acts 24:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: de
  text: Zugleich hoffte er, dass Paulus ihm Geld geben würde[a]. Deshalb ließ er ihn auch häufiger holen und unterhielt sich mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, dem Zusammenhang nach genauer: Er hoffte auf Bestechungsgeld von Paulus. Im Griechischen steht lediglich „Geld“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: Zugleich
  rationale: Die Wendung bezeichnet Gleichzeitigkeit mit dem zuvor Erzählten. „Zugleich“ gibt dies knapp und natürlich wieder.
- source_word: ἐλπίζων
  choice: hoffte er
  rationale: Das Präsenspartizip beschreibt die fortdauernde Erwartung des Felix parallel zu seinem wiederholten Handeln.
- source_word: χρήματα
  choice: Geld
  rationale: Das Wort bedeutet ausdrücklich „Geld“. Ein Bestechungsgeld ist im Zusammenhang deutlich nahegelegt, lexikalisch aber nicht eigens bezeichnet.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: dass Paulus ihm Geld geben würde
  rationale: Die aktive deutsche Form ist natürlicher als eine wörtliche Passivkonstruktion und bewahrt Paulus eindeutig als erwartete Quelle des Geldes.
- source_word: διὸ καὶ
  choice: Deshalb ... auch
  rationale: „Deshalb“ erhält den Folgezusammenhang; „auch“ bildet καί ab, ohne die deutsche Satzstellung zu belasten.
- source_word: πυκνότερον
  choice: häufiger
  rationale: Der Komparativ bezeichnet eine gesteigerte Häufigkeit.
- source_word: μεταπεμπόμενος
  choice: ließ er ihn ... holen
  rationale: Die mediale Form bezeichnet das Veranlassen, jemanden kommen zu lassen. Im Haftkontext ist „holen lassen“ idiomatisch und anschaulich.
- source_word: ὡμίλει αὐτῷ
  choice: unterhielt sich mit ihm
  rationale: Das Verb bezeichnet hier wiederholte persönliche Gespräche, nicht eine formelle Rede.
theological_decisions:
- issue: Ob Felix’ korruptes Motiv im Haupttext ausdrücklich als Bestechung bezeichnet werden soll
  choice: Im Haupttext steht das quellennahe „Geld“; die wahrscheinliche Bestechungsabsicht wird in einer Fußnote erläutert.
  alternative: „Er hoffte auf Bestechungsgeld von Paulus“ oder „er hoffte, Paulus werde ihn bestechen“
  rationale: Der Zusammenhang legt Bestechung stark nahe, doch χρήματα bedeutet lediglich „Geld“. Die Übersetzung soll die Implikation erkennbar machen, ohne sie als expliziten Wortlaut auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig und verständlich; „Geld“ bewahrt die lexikalische Zurückhaltung des griechischen Textes, während die Fußnote die kontextuelle Bestechungsabsicht benennt.
