revisions:
- from: Deshalb[a] bemühe auch ich mich, vor Gott und den Menschen jederzeit ein Gewissen ohne Anstoß zu haben.
  to: Deshalb[a] bemühe ich selbst mich, vor Gott und den Menschen stets ein unsträfliches Gewissen zu haben.
  rationale: Die Revision ersetzt die missverständliche Wendung »Gewissen ohne Anstoß« durch das idiomatische und quellentreue »unsträfliches Gewissen«. Sie macht zudem die Betonung von αὐτός mit »ich selbst« sichtbarer und setzt διὰ παντός mit »stets« an eine natürliche deutsche Satzposition. Der Bezug von ἐν τούτῳ bleibt durch die Fußnote offen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:02:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den fortdauernden Aspekt von διὰ παντός grundsätzlich zutreffend wieder. »Deshalb« ist für ἐν τούτῳ im Kontext vertretbar; die Fußnote bewahrt die sachlich-rückverweisende Möglichkeit. Bei ἀπρόσκοπον ist jedoch »Gewissen ohne Anstoß« im Deutschen semantisch schief: Es kann nahelegen, das Gewissen selbst nehme keinen Anstoß, während der griechische Ausdruck ein Gewissen meint, das keinen Anlass zu Anstoß bzw. Vorwurf gibt. »Unsträflich« ist hierfür eine etablierte, präzise und natürliche Entsprechung, ohne Sündlosigkeit zu behaupten.'
  naturalness: Der Entwurf ist insgesamt flüssiges modernes Standarddeutsch. Die Stellung von »jederzeit« ist möglich, aber »stets« am Ende klingt in diesem knappen, feierlichen Satz natürlicher. »Ich selbst« bringt außerdem die durch αὐτός gegebene Hervorhebung klarer zum Ausdruck als das bloße Personalpronomen.
  terminology: »Gott«, »Menschen« und »Gewissen« sind sachgerecht. »Unsträfliches Gewissen« trifft ἀπρόσκοπον im deutschen biblisch-ethischen Register besser als »Gewissen ohne Anstoß« und vermeidet eine missverständliche Zuordnung des Anstoßes zum Gewissen als handelndem Subjekt.
  issues:
  - severity: medium
    issue: »ein Gewissen ohne Anstoß« ist mehrdeutig und im Deutschen nicht idiomatisch genug.
    rationale: Die Formulierung kann so verstanden werden, dass das Gewissen selbst keinen Anstoß nimmt. ἀπρόσκοπον bezeichnet hier das Gewissen als frei von Anlass zu Anstoß bzw. Vorwurf gegenüber Gott und Menschen. »Unsträflich« gibt dies idiomatisch wieder, ohne über den griechischen Befund hinauszugehen.
  - severity: low
    issue: Die Hervorhebung von αὐτός ist nur abgeschwächt sichtbar.
    rationale: »Auch ich« bildet καί ab, aber »ich selbst« gibt die explizite emphatische Verwendung von αὐτός deutlicher und weiterhin natürlich wieder.
  revised_text: Deshalb[a] bemühe ich selbst mich, vor Gott und den Menschen stets ein unsträfliches Gewissen zu haben.
  revised_footnotes:
