source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: de
  text: Deshalb[a] bemühe ich selbst mich, vor Gott und den Menschen stets ein unsträfliches Gewissen zu haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Darin.'
    reason: Die griechische Wendung ἐν τούτῳ kann sowohl folgernd (»deshalb«) als auch sachlich rückbezüglich (»darin«) verstanden werden.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Deshalb
  rationale: Die Wendung greift die zuvor genannte Hoffnung auf die Auferstehung auf und bezeichnet hier am natürlichsten den daraus folgenden Beweggrund. Die formal mögliche Wiedergabe »Darin« bleibt in der Fußnote erhalten.
- source_word: καὶ αὐτός
  choice: auch ich
  rationale: »Auch« gibt καί wieder, während das ausdrücklich gesetzte Pronomen αὐτός durch »ich« hervorgehoben wird. Die deutsche Wortstellung vermittelt die Betonung natürlich und ohne unnötige Schwerfälligkeit.
- source_word: ἀσκῶ
  choice: bemühe mich
  rationale: Das Verb bezeichnet eingeübtes, zielgerichtetes Bemühen. »Bemühe mich« ist im heutigen Deutsch natürlich und bewahrt den Gedanken an anhaltende persönliche Anstrengung.
- source_word: ἀπρόσκοπον
  choice: ohne Anstoß
  rationale: Das Adjektiv kann das bezeichnen, was keinen Anstoß verursacht oder keinen Anlass zum Straucheln gibt. »Ein Gewissen ohne Anstoß« bewahrt diese Bild- und Bedeutungsbreite besser als das stärker deutende »rein« oder »schuldlos«.
- source_word: συνείδησιν
  choice: Gewissen
  rationale: »Gewissen« ist die sachlich und sprachlich übliche deutsche Entsprechung für das innere moralische Bewusstsein.
- source_word: ἔχειν
  choice: zu haben
  rationale: Der Infinitiv bezeichnet das Ziel des Bemühens und wird unmittelbar mit »zu haben« wiedergegeben.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: vor Gott und den Menschen
  rationale: πρός bezeichnet hier die Beziehung beziehungsweise Verantwortlichkeit gegenüber Gott und den Mitmenschen. »Vor Gott und den Menschen« ist prägnant, würdig und idiomatisch; ἀνθρώπους meint Menschen allgemein.
- source_word: διὰ παντός
  choice: jederzeit
  rationale: Die Wendung bezeichnet fortdauernde Geltung. Die Stellung bei »ein Gewissen ... zu haben« lässt erkennen, dass Paulus diesen Gewissensstand beständig anstrebt.
theological_decisions:
- issue: Bezug und Folgerungswert von ἐν τούτῳ
  choice: Deshalb
  alternative: Darin
  rationale: Der Zusammenhang mit der unmittelbar zuvor genannten Auferstehungshoffnung legt eine begründende beziehungsweise folgernde Aussage nahe. Da die griechische Wendung zugleich örtlich oder sachlich als »darin« verstanden werden kann, wird diese Offenheit nicht verschwiegen.
- issue: Bedeutung von ἀπρόσκοπον in Verbindung mit dem Gewissen
  choice: ein Gewissen ohne Anstoß
  alternative: ein schuldloses Gewissen
  rationale: Der Text behauptet nicht ausdrücklich absolute Sündlosigkeit, sondern beschreibt ein Gewissen, das in der Beziehung zu Gott und Menschen keinen Anstoß bietet. Die gewählte Formulierung vermeidet eine stärkere dogmatische Festlegung.
- issue: Generischer Sinn von ἀνθρώπους
  choice: den Menschen
  alternative: den Männern
  rationale: ἀνθρώπους bezeichnet hier Menschen allgemein und nicht ausschließlich männliche Personen. Das moderne deutsche »Menschen« gibt diesen Umfang genau wieder.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Formulierung bleibt nahe an der griechischen Satzstruktur, ohne hölzern zu wirken; die echte Mehrdeutigkeit des einleitenden Ausdrucks wird durch die Fußnote bewahrt.
