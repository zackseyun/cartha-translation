  source_fidelity: 'Die Grundbedeutung wird getroffen: Paulus bekennt seine Zugehörigkeit zum „Weg“, weist die gegnerische Bezeichnung „Sekte“ nicht als deren eigene Wertung zurück und betont den Dienst für den Gott der Vorfahren sowie den Glauben an die Schriften. Die Wendung „indem ich dem Weg folge“ verschiebt jedoch die syntaktische und inhaltliche Zuordnung: Im Griechischen bezeichnet „gemäß dem Weg“ die Weise, in der Paulus Gott dient, nicht einen zusätzlichen Vorgang, durch den er ihm dient.'
  naturalness: Der Entwurf ist verständliches modernes Standarddeutsch. „Dem Weg … gemäß diene ich“ ist etwas formeller, aber für den gerichtlichen Kontext würdig, natürlich und näher am griechischen Bezug.
  terminology: „Der Weg“, „Sekte“, „dem Gott meiner Vorfahren dienen“, „Gesetz“ und „Propheten“ sind sachgerecht. Die Fußnote zur Bedeutung von πατρῴῳ θεῷ muss am Ausdruck „Gott meiner Vorfahren“ stehen, nicht am Satz über Gesetz und Propheten.
