source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: de
  text: 'Doch dies bekenne ich dir: Dem Weg, den sie eine Sekte[a] nennen, gemäß diene ich dem Gott meiner Vorfahren[b] und glaube allem, was im Gesetz und in den Propheten geschrieben steht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann eine Partei, Richtung oder Sekte bezeichnen; die spätere Bedeutung „Irrlehre“ ist hier nicht zwingend.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dem angestammten Gott“; gemeint ist der Gott, den die Vorfahren Israels verehrten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: das bekenne ich
  rationale: Gibt das offene, förmliche Bekenntnis des Paulus vor Felix wieder, ohne ein Schuldeingeständnis auszudrücken.
- source_word: κατὰ τὴν ὁδόν
  choice: indem ich dem Weg folge
  rationale: Bewahrt „der Weg“ als Bezeichnung der frühen Jesusbewegung; die Formulierung gibt κατά als Ausrichtung beziehungsweise Übereinstimmung natürlich wieder.
- source_word: αἵρεσιν
  choice: Sekte
  rationale: Bezeichnet hier eine religiöse Gruppierung aus Sicht ihrer Gegner; „Irrlehre“ würde die spätere dogmatische Bedeutung anachronistisch eintragen.
- source_word: λατρεύω
  choice: ich diene
  rationale: Das Verb bezeichnet religiösen Dienst beziehungsweise Gottesverehrung. „Dem Gott … dienen“ bewahrt diese kultische Bedeutung und klingt im Deutschen natürlich.
- source_word: τῷ πατρῴῳ θεῷ
  choice: dem Gott meiner Vorfahren
  rationale: Gibt den angestammten, von den israelitischen Vorfahren verehrten Gott wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes „unser“ einzufügen.
- source_word: πιστεύων πᾶσι τοῖς ... γεγραμμένοις
  choice: und glaube alles, was ... geschrieben steht
  rationale: Gibt den begleitenden Partizipialsatz verständlich wieder und bewahrt die umfassende Aussage πᾶσι.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις γεγραμμένοις
  choice: was im Gesetz und in den Propheten geschrieben steht
  rationale: Bewahrt die geläufigen Bezeichnungen der jüdischen Schriftbereiche und bildet die leicht unterschiedliche griechische Konstruktion idiomatisch ab.
theological_decisions:
- issue: Verhältnis des Weges zum Glauben Israels
  choice: Paulus beschreibt seinen Dienst nach dem Weg als Dienst an dem Gott seiner Vorfahren und als verbunden mit dem Glauben an Gesetz und Propheten.
  alternative: Den Weg als vom Judentum getrennte Religion oder als Abkehr von Israels Gott darzustellen.
  rationale: Der griechische Text betont ausdrücklich die Kontinuität mit dem angestammten Gott und den Schriften Israels, während zugleich die gegnerische Bezeichnung „Sekte“ stehen bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber dem langen griechischen Satz vorsichtig gegliedert. „Der Weg“ bleibt als historische Selbstbezeichnung erhalten; „Sekte“ wird wegen möglicher moderner Nebenbedeutungen erläutert. Alle Fußnotenmarker stehen im Haupttext.
