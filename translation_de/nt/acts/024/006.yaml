  source_fidelity: Der Haupttext gibt ὃς ... ἐπείρασεν βεβηλῶσαι und ὃν ... ἐκρατήσαμεν inhaltlich zutreffend wieder. „den Tempel“ ist als übliche Kurzform für ἱερόν vertretbar; „entweihen“ trifft die kultische Anschuldigung präzise. Das adversative „doch“ hat jedoch im vorgelegten griechischen Text keine Grundlage; καί verbindet die beiden Aussagen.
  naturalness: „Er versuchte sogar, den Tempel zu entweihen, und wir ergriffen ihn.“ ist modernes, gut verständliches Standarddeutsch und bewahrt den forensisch-anklagenden Duktus. Die Wiederaufnahme durch „ihn“ ist natürlich.
  terminology: „Tempel“ und „entweihen“ sind sachgerecht. „Ergriffen“ gibt ἐκρατήσαμεν als körperlich-feindseliges Zugreifen passend wieder, ohne die stärker institutionelle Bedeutung von „verhafteten“ einzutragen. Die Fußnote sollte die längere Variante als Handschriftenlesart und deren variierenden Wortlaut kenntlich machen; „entriss“ kann die in manchen Formen genannte Gewalt sprachlich etwas zu stark und zu bestimmt darstellen.
