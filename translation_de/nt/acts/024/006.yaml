  text: Er versuchte sogar, den Tempel zu entweihen[a], und wir ergriffen ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen hier einen längeren Text hinzu: Sie wollten Paulus nach ihrem Gesetz richten, doch der Befehlshaber Lysias kam und nahm ihn ihnen mit großer Gewalt weg. Der Wortlaut variiert.'
