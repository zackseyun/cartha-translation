lexical_decisions:
- source_word: ὃς
  choice: Er
  rationale: Das Relativpronomen bezieht sich auf Paulus. Da der Vers als Ausschnitt einer Anklagerede wiedergegeben wird, klingt ein selbstständiges „Er“ im modernen Deutschen natürlicher als ein anschließendes „der“.
- source_word: καὶ
  choice: sogar
  rationale: 'Hier verstärkt καί die Anschuldigung: Paulus habe sogar versucht, den Tempel zu entweihen.'
- source_word: τὸ ἱερὸν
  choice: den Tempel
  rationale: Ἱερόν bezeichnet hier den gesamten Tempelbezirk, nicht ausschließlich das innere Heiligtum. „Den Tempel“ ist die geläufige und verständliche deutsche Wiedergabe.
- source_word: ἐπείρασεν
  choice: versuchte
  rationale: Das Verb bezeichnet hier den Versuch, die im Infinitiv genannte Handlung auszuführen.
- source_word: βεβηλῶσαι
  choice: zu entweihen
  rationale: Βεβηλόω bezeichnet das Profanieren beziehungsweise Verletzen der Heiligkeit. „Entweihen“ gibt die gegen Paulus erhobene kultische Anschuldigung präzise und idiomatisch wieder.
- source_word: ὃν
  choice: ihn
  rationale: Das Akkusativpronomen nimmt Paulus als Objekt der folgenden Handlung wieder auf.
- source_word: ἐκρατήσαμεν
  choice: wir ergriffen ihn
  rationale: Κρατέω bedeutet hier, jemanden zu packen oder festzunehmen. „Ergriffen“ bewahrt die unmittelbare, handgreifliche Färbung besser als das stärker amtlich klingende „verhafteten“.
theological_decisions:
- issue: Textform von Apostelgeschichte 24,6 gegenüber der längeren byzantinischen Lesart
  choice: Übersetzt wird ausschließlich der kürzere SBLGNT-Text, der mit „doch wir ergriffen ihn“ endet.
  alternative: Einige Handschriften schließen an, dass sie Paulus nach ihrem Gesetz richten wollten und der Befehlshaber Lysias ihn ihnen mit Gewalt entriss; der genaue Wortlaut variiert.
  rationale: Der vorgegebene griechische Ausgangstext bietet die kürzere Lesart. Die längere Überlieferung wird daher nicht in den Haupttext aufgenommen, sondern als textkritische Variante in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entweihen“ erhält den kultischen Ernst der Anklage; „ergriffen“ wahrt deren handgreiflichen Charakter. Das verbindende δέ fehlt im griechischen Ausgangstext; daher sollte zwischen den beiden mit καί verbundenen Aussagen eher „und“ als „doch“ stehen.
