  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: de
  text: 'Als Paulus hereingerufen worden war, begann Tertullus ihn anzuklagen und sagte: »Da wir durch dich großen Frieden genießen und durch deine Umsicht[b] Reformen[a] für dieses Volk zustande kommen,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verbesserungen« oder »korrigierende Maßnahmen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Vorsorge« beziehungsweise »vorausschauende Verwaltung«. Das griechische Wort bezeichnet hier die umsichtige Planung und Amtsführung eines Herrschers, nicht notwendigerweise göttliche Vorsehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Als Paulus hereingerufen worden war
  rationale: Der Genitivus absolutus beschreibt den vorausgehenden Umstand. Das im Kontext eindeutige Pronomen wird mit „Paulus“ wiedergegeben; „hereingerufen“ passt zur gerichtlichen Anhörung.
- source_word: ἤρξατο κατηγορεῖν
  choice: begann … anzuklagen
  rationale: Bewahrt die inchoative Konstruktion und den rechtlichen Sinn von κατηγορέω, ohne das stärker deutende „strafrechtlich verfolgen“ zu verwenden.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: Da wir … großen Frieden genießen
  rationale: „Genießen“ gibt den idiomatischen Sinn von τυγχάνω mit Genitiv natürlich wieder; „da“ macht die hier rhetorisch-kausale Funktion des Partizips deutlich.
- source_word: διὰ σοῦ
  choice: durch dich
  rationale: Gibt διά mit Genitiv als Mittel beziehungsweise persönliche Vermittlung direkt wieder und erhält die schmeichelnde Rhetorik.
- source_word: διορθωμάτων
  choice: Reformen
  rationale: Das Wort bezeichnet Verbesserungen oder korrigierende Maßnahmen; „Reformen“ passt prägnant zum politisch-administrativen Zusammenhang.
- source_word: γινομένων τῷ ἔθνει τούτῳ
  choice: für dieses Volk durchgeführt werden
  rationale: „Durchgeführt werden“ ist eine natürliche deutsche Wiedergabe des Zustandekommens administrativer Maßnahmen. „Volk“ bezeichnet hier das jüdische Volk, ohne ἔθνος als „Heiden“ misszuverstehen.
- source_word: διὰ τῆς σῆς προνοίας
  choice: durch deine Umsicht
  rationale: „Umsicht“ bezeichnet das vorausschauende, kluge Regierungshandeln eines menschlichen Amtsträgers und vermeidet den im Deutschen meist theologischen Beiklang von „Vorsehung“.
theological_decisions:
- issue: Wiedergabe von πρόνοια im nichttheologischen Verwaltungskontext
  choice: Umsicht
  alternative: Vorsorge; vorausschauende Verwaltung; Vorsehung
  rationale: Tertullus lobt die vorausschauende Amtsführung des Statthalters Felix. „Umsicht“ wahrt diesen Sinn, ohne dem Text eine Aussage über göttliche Vorsehung zu unterlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher juristisch-administrativer Wortwahl. Die schmeichelnde Förmlichkeit der Rede bleibt erhalten. Der Vers endet syntaktisch offen mit einem Komma, da der Satz in Apostelgeschichte 24,3 weitergeht.
