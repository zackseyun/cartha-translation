id: ACT.24.23
reference: Acts 24:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: de
  text: Dann befahl er dem Hauptmann, Paulus in Gewahrsam zu halten, ihm aber eine gewisse Erleichterung[a] zu gewähren und keinen von seinen Leuten[b] daran zu hindern, ihm zu dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm eine gewisse Freiheit zu lassen“. Das griechische Wort kann Erleichterung, Schonung oder eine Lockerung strenger Haft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von den Seinen“. Gemeint sind Menschen aus dem Kreis von Paulus, etwa Begleiter oder Unterstützer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: Dann befahl er
  rationale: Das aoristische Partizip wird für einen natürlichen deutschen Erzählfluss als finites Verb wiedergegeben; der Bezug auf Felix ergibt sich aus dem Kontext.
- source_word: τῷ ἑκατοντάρχῃ
  choice: dem Hauptmann
  rationale: Bezeichnet den römischen Zenturio. „Hauptmann“ ist die geläufige, historisch verständliche deutsche Wiedergabe.
- source_word: τηρεῖσθαι αὐτόν
  choice: Paulus in Gewahrsam zu halten
  rationale: τηρέω bezeichnet hier das Bewachen beziehungsweise Festhalten in behördlichem Gewahrsam. Der Name „Paulus“ macht den deutschen Satz eindeutig.
- source_word: ἔχειν τε ἄνεσιν
  choice: ihm aber eine gewisse Erleichterung zu gewähren
  rationale: ἄνεσις kann Erleichterung, Schonung oder Lockerung bezeichnen. Im Kontext geht es um gelockerte Haftbedingungen, nicht um vollständige Freiheit; „eine gewisse“ wahrt diese Begrenzung.
- source_word: τε ... καὶ
  choice: aber ... und
  rationale: Die beiden Anordnungen werden koordiniert; „aber“ lässt zugleich den sachlichen Gegensatz zwischen Gewahrsam und Erleichterung natürlich hervortreten.
- source_word: μηδένα κωλύειν
  choice: keinen ... daran zu hindern
  rationale: Gibt die umfassende Verneinung und die Bedeutung von κωλύω als hindern idiomatisch wieder.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: von seinen Leuten
  rationale: Die substantivierte Wendung meint Menschen aus Paulus’ eigenem Kreis, ohne festzulegen, ob es Freunde, Angehörige oder andere Unterstützer waren.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: ihm zu dienen
  rationale: 'Die Formulierung bewahrt die Breite von ὑπηρετέω: praktische Hilfe oder persönliche Versorgung, ohne den Inhalt stärker als der griechische Text festzulegen.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die amtliche Anordnung bleibt knapp; „Erleichterung“ samt Fußnote bewahrt die Bedeutungsbreite von ἄνεσις, und „seine Leute“ vermeidet eine unbegründete Festlegung auf Familie oder Freunde.
