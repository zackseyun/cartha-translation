  yaml_path: translation/nt/acts/024/007.yaml
  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: de
  text: Doch[a] der Kommandant Lysias kam und führte ihn mit großer Gewalt aus unseren Händen fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers – ebenso wie das Ende von Vers 6 und der Anfang von Vers 8 – fehlt in den frühesten griechischen Handschriften, darunter Papyrus 74 aus dem 3. Jahrhundert sowie der Codex Sinaiticus und der Codex Vaticanus aus dem 4. Jahrhundert, und auch in frühen koptischen Übersetzungen. Überliefert ist er in der byzantinischen Mehrheitstradition, der lateinischen Tradition und späteren griechischen Handschriften. Wahrscheinlich handelt es sich um eine frühe redaktionelle Erweiterung, die das Eingreifen des römischen Kommandanten im Bericht vor Felix schildert.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: kam
  rationale: Das Partizip Aorist bezeichnet hier das Eintreffen des Lysias; die Wiedergabe als finites Verb ergibt einen natürlichen deutschen Erzählfluss.
- source_word: χιλίαρχος
  choice: Kommandant
  rationale: Der Ausdruck bezeichnet hier einen römischen Militärtribunen, wörtlich einen Befehlshaber über tausend Mann. „Kommandant“ ist verständlich und vermittelt seine hohe militärische Stellung.
- source_word: μετὰ πολλῆς βίας
  choice: mit großer Gewalt
  rationale: Die Wendung beschreibt erheblichen körperlichen Zwang. „Gewalt“ bewahrt die Stärke des griechischen βία, ohne bereits eine moralische Bewertung des Vorgehens festzulegen.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: entriss ihn uns
  rationale: Die idiomatische Formulierung gibt das Wegführen aus ihrer Gewalt prägnant wieder und erhält die anklagende Perspektive der Sprecher.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ bildet den adversativen Anschluss ab; „entriss ihn uns“ ist natürlicher als eine wörtliche Wiedergabe mit „aus unseren Händen“ und bewahrt zugleich den Vorwurf des Redners.
