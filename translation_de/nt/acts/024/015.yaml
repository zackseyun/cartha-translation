  verdict: revise
  source_fidelity: Die Übersetzung gibt die Zukunftsaussage einer Auferstehung sowie die ausdrückliche Einbeziehung von Gerechten und Ungerechten zuverlässig wieder. »Hoffnung auf Gott« ist als religiös geprägte, auch im modernen Standarddeutsch verständliche Wendung für ἐλπίδα εἰς τὸν θεόν vertretbar. Bei προσδέχονται sollte jedoch die gemeinsame Ausrichtung der Hoffnung in idiomatischer deutscher Syntax ausgedrückt werden.
  naturalness: Der Entwurf ist insgesamt verständlich, aber »die auch diese Männer selbst erwarten« wirkt mit »Hoffnung« als Bezugswort im Deutschen semantisch und syntaktisch schwerfällig. »Auch diese Männer selbst teilen sie« ist natürlich und bringt die im Kontext betonte gemeinsame Erwartung klar zum Ausdruck.
  terminology: »Auferstehung«, »Gerechte« und »Ungerechte« sind präzise und im angemessen würdigen Register gewählt. Die Fußnote sollte die näher am griechischen Verb liegenden Alternativen transparent machen, ohne die kontextuell naheliegende Bedeutung festzulegen.
