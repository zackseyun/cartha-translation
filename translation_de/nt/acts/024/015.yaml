  text: ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, ἀνάστασιν μέλλειν ⸀ἔσεσθαι δικαίων τε καὶ ἀδίκων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: de
  text: 'Dabei setze ich meine Hoffnung auf Gott; auch diese Männer selbst teilen sie: Es wird eine Auferstehung sowohl der Gerechten als auch der Ungerechten geben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch diese Männer selbst erwarten sie« oder »nehmen sie an«. Das Verb kann sowohl erwartungsvolles Entgegensehen als auch Annehmen bedeuten; hier hebt es die gemeinsame Hoffnung beziehungsweise Überzeugung hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων
  choice: Dabei habe ich die Hoffnung
  rationale: Bewahrt die substantivische Wendung und den partizipialen Anschluss an den Kontext, klingt dabei aber in modernem Deutsch natürlich.
- source_word: εἰς τὸν θεόν
  choice: auf Gott
  rationale: Bei »Hoffnung haben« bezeichnet εἰς die Ausrichtung beziehungsweise den Gegenstand der Hoffnung; »Hoffnung auf Gott« ist idiomatisch und quellennah.
- source_word: καὶ αὐτοὶ οὗτοι
  choice: auch diese Männer selbst
  rationale: Gibt sowohl καί als auch das betonte αὐτοί und das hinweisende οὗτοι wieder und passt zur gerichtlichen Situation.
- source_word: προσδέχονται
  choice: erwarten
  rationale: Der Kontext und die Grundbedeutung des Verbs sprechen für ein erwartungsvolles Entgegensehen. Die mögliche Nuance des Anerkennens wird in der Fußnote bewahrt.
- source_word: ἀνάστασιν
  choice: Auferstehung
  rationale: Der etablierte und präzise deutsche Ausdruck für das Auferstehen der Toten.
- source_word: μέλλειν ἔσεσθαι
  choice: dass es … geben wird
  rationale: Gibt die zukünftige Erwartung natürlich wieder, ohne durch »unmittelbar bevorstehen« eine im Kontext nicht zwingende zeitliche Nähe einzutragen.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: sowohl der Gerechten als auch der Ungerechten
  rationale: Bewahrt die durch τε καί markierte Einbeziehung beider moralisch unterschiedenen Gruppen.
theological_decisions:
- issue: Umfang und Art der angekündigten Auferstehung
  choice: eine Auferstehung sowohl der Gerechten als auch der Ungerechten
  alternative: eine allgemeine Auferstehung ohne ausdrückliche moralische Unterscheidung
  rationale: Der griechische Text nennt ausdrücklich beide Gruppen. Die Übersetzung bewahrt diese Spannung, ohne Aussagen über zeitliche Abfolge, Gericht oder ein bestimmtes Lehrsystem hinzuzufügen.
- issue: Bedeutung von προσδέχονται
  choice: erwarten
  alternative: anerkennen
  rationale: Das Verb kann erwartungsvolles Warten oder Annehmen bezeichnen. »Erwarten« folgt seiner zukunftsbezogenen Kraft im Zusammenhang; die alternative Nuance wird offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt eng am griechischen Satzbau, vermeidet jedoch unnatürliche Wörtlichkeit. »Diese Männer« entspricht dem forensischen Kontext; »Ungerechte« bewahrt den klaren Gegensatz zu »Gerechte«.
