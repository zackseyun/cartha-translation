id: ACT.24.5
reference: Acts 24:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: de
  text: 'Wir haben nämlich festgestellt, dass dieser Mann eine Plage ist: Er stiftet unter allen Juden in der ganzen bewohnten Welt Aufstände an und ist außerdem ein Wortführer der Gruppierung der Nazoräer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: eine Plage
  rationale: Bewahrt die scharfe, bildhafte Anklage, Paulus sei eine gesellschaftlich verderbliche und gefährliche Person.
- source_word: κινοῦντα στάσεις
  choice: Aufstände anstiftet
  rationale: στάσεις bezeichnet hier im Rahmen der Anklage mehr als bloße Unruhe, nämlich Aufruhr bzw. Aufstände; κινεῖν wird idiomatisch mit „anstiften“ wiedergegeben.
- source_word: οἰκουμένην
  choice: bewohnte Welt
  rationale: Gibt den damaligen Ausdruck für die bewohnte bzw. römisch geprägte Welt formal und verständlich wieder.
- source_word: πρωτοστάτην
  choice: Wortführer
  rationale: Bezeichnet eine führende Person; „Wortführer“ passt zum anklagenden Kontext, ohne eine präzisere Amtsstellung zu behaupten.
- source_word: αἱρέσεως
  choice: Gruppierung
  rationale: Das Wort bezeichnet hier eine religiöse Partei oder Richtung. „Gruppierung“ vermeidet die im heutigen Deutsch meist abwertende und dogmatisch verengte Bedeutung von „Sekte“.
- source_word: Ναζωραίων
  choice: Nazoräer
  rationale: Bewahrt die spezifische griechische Bezeichnung der Jesusbewegung und unterscheidet sie von der gewöhnlichen deutschen Einwohnerbezeichnung „Nazarener“.
theological_decisions:
- issue: Charakterisierung der Jesusbewegung durch αἵρεσις
  choice: Gruppierung
  alternative: Sekte
  rationale: Die Aussage steht in der Anklagerede des Tertullus. Die Übersetzung soll diese historische Einordnung wiedergeben, ohne die moderne theologische Wertung des Wortes „Sekte“ als Erzählerurteil zu importieren.
translation_notes:
  register: Moderne, würdevolle und klar verständliche Gerichtssprache. Die aggressive Rhetorik der Anklage bleibt in „eine Plage“ und „Aufstände anstiftet“ erhalten; der Satzfluss wurde durch einen Doppelpunkt natürlich gestaltet.
