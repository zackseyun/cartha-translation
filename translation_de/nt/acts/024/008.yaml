source:
  edition: SBLGNT
  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: de
  text: Von ihm wirst du selbst, nachdem du ihn verhört hast, Klarheit über all das gewinnen können, dessen wir ihn anklagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften enthalten in den Versen 6–8 zusätzlich den Bericht, der Kommandant Lysias habe Paulus gewaltsam weggeführt und den Anklägern befohlen, vor Felix zu erscheinen. Dieser Wortlaut steht nicht im SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: Von ihm
  rationale: παρά mit dem Genitiv bezeichnet hier die Quelle der Auskunft. „Von ihm“ ist im Deutschen natürlich und lässt erkennen, dass Felix die Informationen von Paulus selbst erhalten kann.
- source_word: δυνήσῃ
  choice: kannst du
  rationale: Das Futur von δύναμαι drückt die bestehende Möglichkeit im folgenden Verhör aus. Das deutsche Präsens „kannst du“ gibt dies in dieser Zusicherung idiomatisch wieder.
- source_word: αὐτὸς
  choice: selbst
  rationale: Das betonte Pronomen hebt hervor, dass Felix sich persönlich ein Urteil bilden kann.
- source_word: ἀνακρίνας
  choice: wenn du ihn verhörst
  rationale: ἀνακρίνω bezeichnet im gerichtlichen Zusammenhang eine förmliche Befragung oder Untersuchung. „Verhören“ passt zum forensischen Kontext; die temporale beziehungsweise mittelbezogene Beziehung des Aoristpartizips wird mit „wenn“ natürlich wiedergegeben.
- source_word: περὶ πάντων τούτων
  choice: alles über die Anschuldigungen
  rationale: περί mit dem Genitiv bedeutet „über/betreffs“. „Alles“ wahrt πάντων, während „die Anschuldigungen“ den Rückbezug von τούτων im unmittelbaren Rechtskontext verständlich ausdrückt.
- source_word: ἐπιγνῶναι
  choice: erfahren
  rationale: ἐπιγινώσκω bedeutet hier, durch Untersuchung zu verlässlicher Kenntnis zu gelangen. „Erfahren“ ist modernes, natürliches Deutsch, ohne eine übersteigerte intensive Bedeutung einzutragen.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: die wir gegen ihn erheben
  rationale: κατηγορέω mit dem Genitiv bezeichnet das Anklagen. In Verbindung mit dem ausdrücklich ergänzten Bezugswort „Anschuldigungen“ ist „gegen ihn erheben“ idiomatisch und erhält den juristischen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarem Gerichtsbezug. Die Anrede folgt dem griechischen Singular. Der lange griechische Relativsatz wird leicht geglättet, ohne Aussageelemente auszulassen; die mögliche temporale oder modale Nuance des Partizips bleibt im Deutschen offen genug.
