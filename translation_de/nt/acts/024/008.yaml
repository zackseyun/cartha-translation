    issue: „alles über die Anschuldigungen“ ersetzt „all dies, dessen wir ihn anklagen“ durch die Anschuldigungen als Gegenstand der Erkenntnis.
    rationale: περὶ πάντων τούτων bezeichnet die zuvor vorgetragenen Sachverhalte/Vorwürfe; der Relativsatz ὧν … κατηγοροῦμεν αὐτοῦ qualifiziert diese. Die Revision erhält diese Satzbeziehung.
  - severity: low
    issue: „kannst du“ neutralisiert das Futur δυνήσῃ.
    rationale: Präsens ist im Deutschen nicht unmöglich, doch „wirst du ... können“ gibt die zukünftige gerichtliche Gelegenheit und Zusicherung genauer wieder.
