  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: ἢ als »Oder«, die nachdrückliche Bezugnahme αὐτοὶ οὗτοι als »diese Männer hier … selbst«, den Imperativ εἰπάτωσαν als Aufforderung, τί ἀδίκημα als Frage nach einem konkret festgestellten Unrecht sowie στάντος μου ἐπὶ τοῦ συνεδρίου als Auftreten vor dem Hohen Rat. Die Wiedergabe wahrt die rechtlich-rhetorische Herausforderung des Paulus.'
