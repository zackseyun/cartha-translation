  terminology: »Unrecht« ist für ἀδίκημα ausreichend weit und vermeidet eine ungebührliche Einschränkung auf einen formalen Straftatbestand. »Hoher Rat« ist im Kontext von συνέδριον sachlich präzise. Die Fußnote nennt transparent die weniger spezifische lexikalische Wiedergabe »Rat« und erklärt die historische Referenz.
