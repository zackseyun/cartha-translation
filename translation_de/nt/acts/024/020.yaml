  text: ἢ αὐτοὶ οὗτοι εἰπάτωσαν τί ⸀εὗρον ἀδίκημα στάντος μου ἐπὶ τοῦ συνεδρίου
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/020.yaml
  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: de
  text: Oder diese Männer hier sollen selbst sagen, welches Unrecht sie festgestellt haben, als ich vor dem Hohen Rat stand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »vor dem Rat«. Das griechische Wort συνέδριον bezeichnet hier den jüdischen Hohen Rat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet in Paulus’ Verteidigung eine alternative Aufforderung ein und gibt die schlichte Verknüpfung des Griechischen natürlich wieder.
- source_word: αὐτοὶ οὗτοι
  choice: diese Männer hier sollen selbst
  rationale: Bewahrt sowohl den hinweisenden als auch den betonten Charakter der Wortgruppe in idiomatischem Deutsch.
- source_word: εἰπάτωσαν
  choice: sollen … sagen
  rationale: Gibt den Imperativ der dritten Person als bestimmte Aufforderung in natürlichem deutschem Rechts- und Redestil wieder.
- source_word: τί εὗρον
  choice: welches … sie festgestellt haben
  rationale: Im forensischen Zusammenhang bezeichnet εὗρον das Ermitteln oder Feststellen eines konkreten Fehlverhaltens; das Perfekt ist im Deutschen für den vergangenen Vorgang mit gegenwärtiger Relevanz natürlich.
- source_word: ἀδίκημα
  choice: Unrecht
  rationale: Bezeichnet eine unrechte Tat oder ein Vergehen, ohne die Aussage unnötig auf eine förmliche Straftat zu verengen.
- source_word: στάντος μου
  choice: als ich … stand
  rationale: Gibt den temporalen Sinn der Partizipialkonstruktion knapp und natürlich wieder.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: vor dem Hohen Rat
  rationale: Das συνέδριον ist hier der jüdische Hohe Rat; die etablierte deutsche Bezeichnung ist verständlich und sachlich präzise.
