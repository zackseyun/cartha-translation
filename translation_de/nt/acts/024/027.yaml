id: ACT.24.27
reference: Acts 24:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: de
  text: Als aber zwei Jahre vergangen waren, wurde Felix von Porzius Festus abgelöst. Weil Felix sich die Gunst der Juden sichern wollte,[a] ließ er Paulus gefesselt zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Juden einen Gefallen tun wollte«. Die griechische Wendung kann sowohl bedeuten, ihnen eine Gunst zu erweisen, als auch, sich ihr Wohlwollen zu sichern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: Als aber zwei Jahre vergangen waren
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Rahmen. Die natürliche deutsche Wendung gibt das Vollenden des Zweijahreszeitraums sachgerecht wieder.
- source_word: ἔλαβεν διάδοχον
  choice: wurde ... abgelöst
  rationale: Die wörtliche Formulierung »erhielt einen Nachfolger« wird im Deutschen idiomatisch als Amtsnachfolge ausgedrückt.
- source_word: Πόρκιον Φῆστον
  choice: Porzius Festus
  rationale: Die Namen folgen der im Deutschen gebräuchlichen biblischen Form.
- source_word: θέλων τε χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: Weil Felix sich die Gunst der Juden sichern wollte
  rationale: Das Partizip bezeichnet das Motiv für Felix' Handeln. Die Wendung χάριτα καταθέσθαι kann auf das Gewinnen beziehungsweise Bewahren von Wohlwollen oder auf das Erweisen einer Gunst zielen; der Haupttext gibt die im Kontext gut passende relationale Bedeutung wieder, die Fußnote wahrt die Alternative.
- source_word: κατέλιπε
  choice: ließ ... zurück
  rationale: Das Verb bezeichnet, dass Felix Paulus beim Ausscheiden aus dem Amt in dessen bestehendem Zustand zurückließ.
- source_word: δεδεμένον
  choice: gefesselt
  rationale: Das perfekte Passivpartizip hebt den fortdauernden Zustand hervor, ohne ihn allgemeiner als bloße Haft zu umschreiben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde gegenüber dem langen griechischen Satz leicht gegliedert; Motiv, Amtswechsel und Paulus’ fortdauernde Fesselung bleiben klar erhalten.
