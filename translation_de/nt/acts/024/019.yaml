id: ACT.24.19
reference: Acts 24:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: de
  text: Doch einige Juden aus Asia[a] hätten vor dir erscheinen und mich anklagen[b] müssen, wenn sie etwas gegen mich vorzubringen hätten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Asia“ bezeichnet hier die römische Provinz im Westen Kleinasiens, nicht den heutigen Kontinent Asien.
    reason: cultural_note
  - marker: b
    text: 'Oder: „gegen mich Anklage erheben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Doch einige
  rationale: „Doch“ gibt den Gegensatz zum vorher Gesagten wieder; „einige“ bezeichnet eine nicht näher bestimmte Gruppe.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: aus Asia
  rationale: Gemeint ist die römische Provinz Asia. Der historische Eigenname bleibt im Text erhalten und wird in einer Fußnote erklärt.
- source_word: Ἰουδαῖοι
  choice: Juden
  rationale: Natürliche und sachlich genaue Wiedergabe der substantivierten Bezeichnung.
- source_word: ἔδει
  choice: hätten … müssen
  rationale: Die Konstruktion bringt eine in der Vergangenheit bestehende, aber nicht erfüllte Verpflichtung angemessen zum Ausdruck.
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: vor dir erscheinen
  rationale: Im gerichtlichen Zusammenhang bezeichnet die Wendung das persönliche Erscheinen vor dem zuständigen Amtsträger.
- source_word: κατηγορεῖν
  choice: mich anklagen
  rationale: Das Verb hat hier forensischen Sinn; „anklagen“ ist knapp, verständlich und dem gerichtlichen Kontext angemessen.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: wenn sie etwas gegen mich vorzubringen hätten
  rationale: Der Konjunktiv bewahrt den bedingten, potenziellen Charakter des griechischen Optativs und legt „etwas“ nicht unnötig auf eine förmliche Anklage fest.
