source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: de
  text: 'oder wegen dieses einen Ausrufs, den ich, als ich in ihrer Mitte stand, ausstieß: »Wegen der Auferstehung der Toten stehe ich heute vor euch vor Gericht.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen dieser einen Äußerung« beziehungsweise »wegen dieser einen Stimme«; das griechische Wort kann sowohl die Äußerung selbst als auch die Stimme oder den Ruf bezeichnen, mit der sie vorgebracht wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Auferstehung von den Toten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: Äußerung
  rationale: Im Zusammenhang mit περί und dem folgenden Inhalt bezeichnet φωνή hier am ehesten das konkret Ausgesprochene. »Äußerung« bewahrt zugleich den Bezug auf eine mündliche Verlautbarung.
- source_word: ἐκέκραξα
  choice: ich ausrief
  rationale: κράζω bezeichnet ein lautes öffentliches Rufen. »ausrief« ist im Deutschen natürlich, würdevoll und gibt die nachdrückliche Lautstärke wieder.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: als ich unter ihnen stand
  rationale: Die partizipiale Wendung beschreibt Paulus’ Standort und die Begleitumstände seiner Äußerung; »unter ihnen« erhält den räumlichen Sinn.
- source_word: ἀναστάσεως νεκρῶν
  choice: Auferstehung der Toten
  rationale: Die Genitivverbindung wird direkt und im Deutschen idiomatisch wiedergegeben. Sie lässt die im Vers allgemein formulierte Auferstehungsaussage bestehen.
- source_word: κρίνομαι
  choice: stehe ich … vor Gericht
  rationale: Das Präsens Passiv bezeichnet die gegenwärtige gerichtliche Beurteilung. Die deutsche Wendung ist idiomatisch und bewahrt den juristischen Sinn, auch wenn sie die Passivform nicht formal nachbildet.
- source_word: ἐφ’ ὑμῶν
  choice: vor euch
  rationale: Im gerichtlichen Kontext bezeichnet ἐπί mit Genitiv das Erscheinen vor einer Autorität oder einem Tribunal. »vor euch« vermeidet die Festlegung, dass die Angesprochenen allein die Handelnden des Urteils sind.
- source_word: ἢ
  choice: oder
  rationale: Die Konjunktion knüpft an die vorangehende Verteidigung an und lässt offen, ob Paulus diesen einen möglichen Anklagepunkt als Ausnahme nennt.
- source_word: μιᾶς ταύτης
  choice: dieser einen
  rationale: Die Wortfolge hebt Einzahl und Bestimmtheit hervor; »dieser einen« tut dies knapp und natürlich.
- source_word: σήμερον
  choice: heute
  rationale: Direkte und idiomatische Wiedergabe des temporalen Adverbs.
theological_decisions:
- issue: Gegenstand des umstrittenen Anklagepunkts
  choice: Die Formulierung bleibt allgemein bei der »Auferstehung der Toten«.
  alternative: Die Aussage ausdrücklich auf die Auferstehung Jesu zu beziehen.
  rationale: περὶ ἀναστάσεως νεκρῶν nennt hier allgemein die Auferstehung der Toten. Obwohl die Apostelgeschichte diese Hoffnung mit Jesu Auferstehung verbindet, soll die Übersetzung die Aussage dieses Verses nicht eigenmächtig verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Äußerung« ist für den Bezug auf den Inhalt präzise, während »ausrief« die öffentliche, laute Rede erhält. Die wörtlichere Konstruktion »werde ich gerichtet« wurde zugunsten des natürlichen gerichtssprachlichen Ausdrucks »stehe ich vor Gericht« vermieden.
