source:
  edition: SBLGNT
  text: Ἀπεκρίθη ⸀τε ὁ Παῦλος νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν· Ἐκ πολλῶν ἐτῶν ὄντα σε κριτὴν τῷ ἔθνει τούτῳ ἐπιστάμενος ⸀εὐθύμως τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: de
  text: 'Darauf antwortete Paulus, nachdem der Statthalter ihm ein Zeichen gegeben hatte zu sprechen: »Da ich weiß, dass du diesem Volk seit vielen Jahren als Richter bist, bringe ich meine Verteidigung in eigener Sache zuversichtlich[a] vor.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bereitwillig« bzw. »guten Mutes«. Das Adverb kann Bereitschaft, Mut oder frohe Zuversicht ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: Darauf antwortete
  rationale: ἀποκρίνομαι bezeichnet das Antworten; τε verbindet den Satz leicht mit dem Fortgang der Erzählung. »Darauf« gibt diesen Anschluss im modernen Deutschen natürlich wieder.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: nachdem der Statthalter ihm ein Zeichen gegeben hatte zu sprechen
  rationale: Der Genitivus absolutus wird als temporaler Nebensatz wiedergegeben. νεύω kann ein Nicken oder allgemeiner ein Zeichen bezeichnen; die Formulierung bewahrt die körperliche Signalhandlung, ohne sie unnötig auf ein Nicken festzulegen.
- source_word: ἡγεμόνος
  choice: Statthalter
  rationale: Gemeint ist Felix als römischer Provinzstatthalter; »Statthalter« ist im deutschen historischen Kontext präzise und allgemein verständlich.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: seit vielen Jahren
  rationale: Die Wendung bezeichnet eine in der Vergangenheit begonnene und fortdauernde Zeitspanne.
- source_word: ὄντα σε κριτὴν τῷ ἔθνει τούτῳ
  choice: dass du diesem Volk seit vielen Jahren als Richter dienst
  rationale: Die partizipiale Konstruktion beschreibt Felix’ langjährige richterliche Funktion. Der Dativ τῷ ἔθνει wird natürlich mit »diesem Volk« wiedergegeben; »als Richter dienen« vermeidet das im Deutschen missverständliche »Richter über dieses Volk«.
- source_word: ἔθνει
  choice: Volk
  rationale: ἔθνος kann »Volk« oder »Nation« bedeuten. Hier ist das jüdische Volk unter Felix’ Zuständigkeit gemeint; »Volk« klingt im Deutschen natürlicher und wahrt den Bezug.
- source_word: ἐπιστάμενος
  choice: Da ich weiß
  rationale: Das Partizip nennt den Grund für Paulus’ Bereitschaft zur Verteidigung. Ein kausaler Nebensatz macht diesen Zusammenhang im Deutschen klar.
- source_word: εὐθύμως
  choice: zuversichtlich
  rationale: Das Adverb kann Bereitwilligkeit, guten Mut oder frohe Zuversicht ausdrücken. »Zuversichtlich« passt zum gerichtlichen Kontext, ohne bloße emotionale Freude zu unterstellen; die alternative Nuance wird in der Fußnote genannt.
- source_word: τὰ περὶ ἐμαυτοῦ
  choice: in eigener Sache
  rationale: Die Wendung bezeichnet die Paulus selbst betreffenden Angelegenheiten. »In eigener Sache« ist idiomatisch und bewahrt den gerichtlichen Ton.
- source_word: ἀπολογοῦμαι
  choice: bringe ich meine Verteidigung … vor
  rationale: ἀπολογέομαι ist ein forensischer Ausdruck. Diese Wiedergabe vermittelt eine förmliche Verteidigungsrede und klingt im modernen Deutschen natürlich.
