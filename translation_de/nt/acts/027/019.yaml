  text: καὶ τῇ τρίτῃ αὐτόχειρες τὴν σκευὴν τοῦ πλοίου ⸀ἔρριψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: de
  text: Am dritten Tag warfen sie eigenhändig die Schiffsausrüstung über Bord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warfen sie selbst die Ausrüstung des Schiffes hinaus“.'
    reason: Lexikalische Alternative für αὐτόχειρες und eine formalere Wiedergabe von σκευή und ἔρριψαν.
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: Am dritten Tag
  rationale: Der Dativ mit der Ordinalzahl ist temporal gebraucht; „Am dritten Tag“ gibt den im Griechischen vorausgesetzten Zeitbezug im Deutschen natürlich wieder.
- source_word: αὐτόχειρες
  choice: eigenhändig
  rationale: Das prädikativ gebrauchte Wort betont, dass die Beteiligten die Arbeit persönlich, mit eigenen Händen, ausführten. „Eigenhändig“ bewahrt diese stärkere Betonung knapp und idiomatisch.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: die Schiffsausrüstung
  rationale: σκευή bezeichnet im nautischen Zusammenhang die Ausrüstung beziehungsweise das Gerät des Schiffes. Das Kompositum ist im Deutschen natürlich und vermeidet die zu enge Festlegung auf Takelage.
- source_word: ἔρριψαν
  choice: warfen … über Bord
  rationale: Das Verb bedeutet „werfen“. „Über Bord“ macht die im Seefahrtskontext vorausgesetzte Richtung idiomatisch deutlich, ohne die Handlung weiter auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Eigenhändig“ erhält die ausdrückliche Betonung persönlicher Beteiligung; „Schiffsausrüstung“ bleibt sachlich und hinreichend weit.
