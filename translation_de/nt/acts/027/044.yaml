source:
  edition: SBLGNT
  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: de
  text: 'Die Übrigen aber: die einen auf Planken, die anderen auf einigen Gegenständen vom Schiff. Und so geschah es, dass alle sicher an Land kamen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass alle gerettet an Land gelangten“ / „dass alle sicher das Ufer erreichten“. Das griechische Verb bezeichnet hier die körperliche Rettung aus dem Schiffbruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: die Übrigen
  rationale: Bezeichnet die übrigen Menschen, die im vorhergehenden Vers noch nicht genannt wurden; im Deutschen natürlich und präzise.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: die einen ... die anderen
  rationale: Gibt die korrelative Aufteilung der übrigen Personen in zwei Gruppen idiomatisch wieder.
- source_word: ἐπὶ σανίσιν
  choice: auf Planken
  rationale: σανίς bezeichnet ein Brett oder eine Planke; „Planken“ passt anschaulich zum Schiffbruch.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: auf irgendwelchen Teilen vom Schiff
  rationale: τινων bleibt unbestimmt und bezeichnet verschiedene Gegenstände oder Teile, die vom Schiff stammten; die Formulierung vermeidet eine nicht belegte nähere Festlegung.
- source_word: οὕτως
  choice: so
  rationale: Fasst die unmittelbar zuvor beschriebene Art der Rettung knapp zusammen.
- source_word: ἐγένετο
  choice: geschah es
  rationale: Bewahrt den narrativen Ergebnischarakter der griechischen Wendung in würdigem, geläufigem Deutsch.
- source_word: πάντας διασωθῆναι
  choice: dass alle sicher ... kamen
  rationale: Gibt die vollständige körperliche Rettung aus der Gefahr wieder, ohne unnötige heilsgeschichtliche Nebenbedeutungen einzutragen.
- source_word: ἐπὶ τὴν γῆν
  choice: an Land
  rationale: Im maritimen Kontext ist „an Land“ die natürliche deutsche Entsprechung für das Erreichen festen Bodens.
theological_decisions:
- issue: Mögliche soteriologische Nebenbedeutung von διασωθῆναι
  choice: „dass alle sicher an Land kamen“ als körperliche Rettung aus dem Schiffbruch
  alternative: „dass alle gerettet an Land kamen“ / „dass alle sich ans Ufer retteten“
  rationale: Der unmittelbare Zusammenhang bezeichnet das Überleben des Schiffbruchs. Die gewählte Formulierung macht diesen Sinn klar, ohne eine geistliche Erlösung zu behaupten; die Fußnote nennt mögliche nähere Wiedergaben.
translation_notes:
  register: Modernes Standarddeutsch mit natürlichem, würdigem Erzählton. Der Vers setzt syntaktisch den vorhergehenden Satz fort; „die Übrigen aber“ bewahrt diesen Anschluss. Die Unbestimmtheit von τινων wird mit „irgendwelchen Teilen“ erhalten.
