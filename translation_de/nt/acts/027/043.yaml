id: ACT.27.43
reference: Acts 27:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: de
  text: Der Hauptmann aber wollte Paulus retten und hielt sie deshalb von ihrem Vorhaben ab.[a] Er befahl denen, die schwimmen konnten, als Erste über Bord zu springen und an Land zu gehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das im vorherigen Vers genannte Vorhaben der Soldaten, die Gefangenen zu töten.
    reason: contextual_clarification
  - marker: b
    text: 'Wörtlich: „sich als Erste hinabzuwerfen und an Land hinauszugehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: Hauptmann
  rationale: Bezeichnet einen römischen Zenturio. „Hauptmann“ ist die im Deutschen etablierte, allgemein verständliche Wiedergabe des militärischen Dienstgrades.
- source_word: βουλόμενος διασῶσαι τὸν Παῦλον
  choice: wollte Paulus retten
  rationale: Das Partizip bezeichnet den Wunsch beziehungsweise die Absicht des Hauptmanns; διασῴζω meint hier, Paulus lebend durch die Gefahr zu bringen.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: hielt sie deshalb von ihrem Vorhaben ab
  rationale: Die Konstruktion bezeichnet das Verhindern eines beabsichtigten Handelns. „Vorhaben“ verweist auf den Plan der Soldaten aus dem vorherigen Vers, ohne ihn im Haupttext erneut auszudeuten.
- source_word: ἐκέλευσέν τε
  choice: Er befahl
  rationale: κελεύω bezeichnet eine verbindliche Anweisung; der neue Satz sorgt im Deutschen für einen natürlichen Erzählfluss.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: denen, die schwimmen konnten
  rationale: Die Formulierung bezeichnet die Gruppe an Bord, die schwimmfähig war.
- source_word: ἀπορίψαντας πρώτους
  choice: als Erste über Bord zu springen
  rationale: Wörtlich geht es um das Sich-Hinabwerfen vom Schiff; „über Bord springen“ gibt die konkrete Handlung und πρώτους die zeitliche Reihenfolge idiomatisch wieder.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: an Land zu gehen
  rationale: Die Wendung beschreibt die Bewegung aus dem Wasser auf das Land und bleibt näher am griechischen Ausdruck als das stärker ergebnisorientierte „das Ufer zu erreichen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hauptmann“ wahrt die etablierte biblische Bezeichnung für den römischen Zenturio; die militärische Befehlslage bleibt klar. Die beiden griechischen Verbhandlungen werden zur besseren deutschen Lesbarkeit auf zwei Sätze verteilt.
