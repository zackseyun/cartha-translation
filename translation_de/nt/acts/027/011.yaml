id: ACT.27.11
reference: Acts 27:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: de
  text: Doch der Hauptmann ließ sich eher vom Steuermann und vom Schiffseigner überzeugen als von dem, was Paulus sagte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: Hauptmann
  rationale: Der im deutschen Bibel- und Geschichtsgebrauch geläufige Ausdruck bezeichnet hier den römischen Zenturio natürlich und prägnant.
- source_word: κυβερνήτῃ
  choice: Steuermann
  rationale: Das Wort bezeichnet im maritimen Zusammenhang den für Steuerung und Navigation Verantwortlichen und bleibt klar vom Schiffseigner unterschieden.
- source_word: ναυκλήρῳ
  choice: Schiffseigner
  rationale: Die Wiedergabe bezeichnet den Eigentümer beziehungsweise verantwortlichen Betreiber des Schiffes und wahrt die Unterscheidung zum κυβερνήτης.
- source_word: μᾶλλον ἐπείθετο
  choice: ließ sich eher … überzeugen
  rationale: Diese Formulierung gibt die Bedeutung von πείθομαι und den Vergleich mit μᾶλλον idiomatisch und präzise wieder.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: von dem, was Paulus sagte
  rationale: Die substantivierte Passivkonstruktion bezieht sich auf die von Paulus geäußerte Warnung beziehungsweise seinen Rat; die natürliche deutsche Formulierung wahrt diesen Bezug.
- source_word: δὲ
  choice: Doch
  rationale: Die Konjunktion markiert den Gegensatz zur vorangehenden Warnung des Paulus.
- source_word: ἢ
  choice: als
  rationale: Dies ist der reguläre deutsche Vergleichsausdruck in Verbindung mit „eher“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hauptmann“ ist historisch-biblisch geläufig; „Steuermann“ und „Schiffseigner“ unterscheiden die beiden Funktionen klar. Die Satzstellung ist natürlich, ohne die Aussage gegenüber dem griechischen Text auszudeuten.
