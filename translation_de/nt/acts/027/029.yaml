base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: de
  text: Aus Furcht, dass sie auf felsige Stellen auflaufen könnten,[a] warfen sie vom Heck vier Anker aus und beteten darum, dass es Tag würde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass sie auf raue Stellen auflaufen könnten« beziehungsweise »dass sie an schroffe Felsen getrieben würden«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »beteten, dass es Tag werde«; gemeint ist, dass sie den Tagesanbruch herbeisehnten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί τε
  choice: Aus Angst
  rationale: Gibt das begleitende Partizip als Motivation für die folgenden Handlungen natürlich und knapp wieder.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: wir könnten auf felsige Stellen getrieben werden
  rationale: Die Wendung beschreibt im nautischen Zusammenhang die Befürchtung, dass das Schiff auf gefährliches, raues Gelände beziehungsweise Felsen gerät; die passive Formulierung passt zum treibenden Schiff im Sturm.
- source_word: ἐκ πρύμνης
  choice: vom Heck
  rationale: „Heck“ ist die präzise und allgemein verständliche deutsche Bezeichnung für den hinteren Teil des Schiffes.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: warfen sie … vier Anker aus
  rationale: Natürliches deutsches nautisches Idiom; das vorzeitige Partizip wird in die koordinierte Erzählfolge integriert.
- source_word: ηὔχοντο
  choice: beteten darum
  rationale: εὔχομαι bezeichnet hier am ehesten ein Gebet; „darum“ bindet den folgenden Infinitivsatz idiomatisch an.
- source_word: ἡμέραν γενέσθαι
  choice: dass es Tag würde
  rationale: Bewahrt die anschauliche Formulierung des Griechischen und entspricht dem in der nächtlichen Gefahr ersehnten Tagesanbruch.
theological_decisions:
- issue: Bedeutung von ηὔχοντο
  choice: beteten darum
  alternative: wünschten sich / sehnten sich danach
  rationale: Das Verb kann je nach Kontext „beten“ oder „wünschen“ bedeuten. Hier ist „beteten“ lexikalisch gut begründet, ohne das Ziel oder den Adressaten des Gebets näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher nautischer Terminologie. Die Satzstruktur bleibt erzählerisch flüssig; die lexikalische Spannung zwischen Beten und sehnsüchtigem Wünschen wird in der Fußnote erläutert.
