id: ACT.27.24
reference: Acts 27:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: de
  text: 'Er sagte: »Hab keine Angst, Paulus! Du musst vor den Kaiser treten. Und sieh: Gott hat dir alle geschenkt, die mit dir fahren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Hab keine Angst
  rationale: Natürliche, direkte Wiedergabe des griechischen Verbots im modernen Standarddeutsch.
- source_word: Καίσαρί
  choice: vor den Kaiser
  rationale: Καῖσαρ bezeichnet hier den römischen Kaiser als Person und Amtsträger.
- source_word: δεῖ παραστῆναι
  choice: musst ... treten
  rationale: Bewahrt die im unpersönlichen δεῖ ausgedrückte Notwendigkeit und gibt παραστῆναι idiomatisch als persönliches Erscheinen vor dem Kaiser wieder.
- source_word: ἰδοὺ
  choice: sieh
  rationale: Erhält das aufmerksamkeitslenkende Signal des griechischen Textes in knapper, würdiger Form.
- source_word: κεχάρισταί σοι
  choice: hat dir ... geschenkt
  rationale: Das Perfekt von χαρίζομαι bezeichnet eine bereits gewährte, gnädige Gabe; die Formulierung lässt den Zusammenhang von Paulus’ Bitte und Gottes Gewährung offen.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: alle ..., die mit dir fahren
  rationale: Gibt die gegenwärtige gemeinsame Seereise klar und natürlich wieder.
theological_decisions:
- issue: Bedeutung von κεχάρισταί σοι im Blick auf die Mitreisenden
  choice: Gott hat dir alle geschenkt
  alternative: Gott hat dir das Leben aller gewährt
  rationale: 'Die knappere Form folgt der griechischen Konstruktion und bewahrt ihre Spannung: Die Mitreisenden werden Paulus als von Gott gewährte Gabe zugesprochen, ohne die Aussage ausdrücklich auf ihre Rettung einzuengen, die sich erst aus dem Kontext ergibt.'
translation_notes:
  register: Direkte, verständliche und zugleich würdige Rede. »Kaiser« ist im Deutschen idiomatischer als eine bloße Übernahme von »Caesar«. Die Anrede bleibt durch Ausrufezeichen klar gegliedert.
