  source_fidelity: 'Die Übersetzung gibt alle tragenden Elemente des griechischen Textes wieder: das Verbot μὴ φοβοῦ, die Notwendigkeit des Erscheinens vor dem Kaiser, das hervorhebende ἰδού sowie das Perfekt κεχάρισταί und die Gruppe aller mit Paulus Mitsegelnden. „Gott hat dir alle geschenkt“ bewahrt bewusst die knappe, im Griechischen nicht weiter ausgeführte Aussage.'
