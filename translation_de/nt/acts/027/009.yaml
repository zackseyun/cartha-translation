  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: de
  text: Da inzwischen viel Zeit vergangen war und die Seefahrt bereits gefährlich geworden war, weil sogar das Fasten[a] schon vorüber war, riet Paulus ihnen[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich das jährliche Fasten am jüdischen Versöhnungstag. Es fiel in eine Jahreszeit, in der die Seefahrt zunehmend gefährlich wurde.
    reason: cultural_note
  - marker: b
    text: Der Satz wird in Vers 10 mit dem Inhalt von Paulus’ Rat fortgesetzt.
    reason: discourse_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Da inzwischen viel Zeit vergangen ... war
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet einen beträchtlichen Zeitablauf; die Formulierung ist im Deutschen natürlich und bewahrt den zeitlichen Zusammenhang.
- source_word: ὄντος ἤδη ἐπισφαλοῦς
  choice: bereits gefährlich geworden war
  rationale: ἐπισφαλής bezeichnet hier die inzwischen eingetretene Gefährlichkeit; im Deutschen gibt „geworden“ den narrativen Übergang idiomatisch wieder, ohne den Sinn zu verstärken.
- source_word: τοῦ πλοὸς
  choice: die Seefahrt
  rationale: πλοῦς meint hier das Reisen beziehungsweise Fahren zur See, nicht das Schiff selbst. „Seefahrt“ lässt offen, ob die konkrete Reise oder das Segeln unter den saisonalen Bedingungen im Vordergrund steht.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: weil sogar das Fasten schon vorüber war
  rationale: Die Konstruktion mit διά und substantiviertem Infinitiv gibt den Grund an; „sogar“ bildet καί ab, und „schon vorüber war“ wahrt den vollendeten Aspekt.
- source_word: τὴν νηστείαν
  choice: das Fasten
  rationale: Der bestimmte Singular verweist wahrscheinlich auf das bekannte jährliche jüdische Fasten am Versöhnungstag. Die Übersetzung bewahrt die Bezeichnung des griechischen Textes, während die Fußnote den kulturellen Bezug erläutert.
- source_word: παρῄνει
  choice: riet Paulus ihnen
  rationale: παραινέω bedeutet raten, zureden oder ermahnen. „riet ... ihnen“ leitet die folgende Rede natürlich ein, ohne eine stärkere Warnnuance festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Satzstruktur bleibt wegen des Übergangs zur direkten Rede in Vers 10 bewusst offen. „Das Fasten“ erhält keine konfessionell geprägte Ausdeutung; die wahrscheinliche historische Identifikation steht in der Fußnote.
