translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller direkter Rede. Nautisches »auslaufen« ist idiomatisch und präzise. Die etwas formelle Anrede »Ihr Männer« bewahrt die ausdrückliche männliche Gruppenanrede des griechischen Textes.
