  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: de
  text: 'Nachdem sie lange Zeit nichts gegessen hatten[a], stand Paulus mitten unter ihnen auf und sagte: »Ihr Männer, ihr hättet auf mich hören[b] und nicht von Kreta auslaufen sollen. Dann hättet ihr euch diesen Schaden und Verlust[c] erspart.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nachdem sie lange gefastet hatten.« Das griechische Wort kann sowohl Nahrungsmangel als auch den Verzicht auf Essen bezeichnen; im Zusammenhang des Sturms ist längeres Nichtessen wahrscheinlicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mir gehorchen«. Das Verb kann das Befolgen einer Anweisung oder das Gehorchen gegenüber einer Autorität bezeichnen; hier geht es darum, Paulus’ Rat zu beachten.'
    reason: lexical_alternative
  - marker: c
    text: Mit »Schaden und Verlust« können erlittene Schädigung und materieller Verlust unterschieden sein; die genaue Abgrenzung bleibt im Griechischen offen.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Nachdem sie lange Zeit nichts gegessen hatten
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Begleitumstand. ἀσιτία kann Nahrungsmangel oder den Verzicht auf Nahrung meinen; im Zusammenhang des Sturms liegt längeres Nichtessen näher als religiöses Fasten.
- source_word: τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: stand Paulus mitten unter ihnen auf
  rationale: Die Formulierung gibt sowohl das Aufstehen beziehungsweise Einnehmen einer Stellung als auch den öffentlichen Platz innerhalb der Gruppe in natürlichem Deutsch wieder; »da/dann« muss neben dem vorangestellten Temporalsatz nicht eigens ausgedrückt werden.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: Ihr Männer, ihr hättet … sollen
  rationale: Der Imperfekt von δεῖ bezeichnet hier eine in der Vergangenheit versäumte Pflicht oder kluge Handlungsweise. Die direkte Anrede bleibt geschlechtsspezifisch und würdevoll erhalten.
- source_word: πειθαρχήσαντάς μοι
  choice: auf mich hören
  rationale: πειθαρχέω kann »gehorchen« oder »einer Weisung folgen« bedeuten. Im Kontext von Paulus’ zuvor erteiltem Rat ist »auf mich hören« natürlich, ohne seine formale Befehlsgewalt vorauszusetzen.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: nicht von Kreta auslaufen
  rationale: ἀνάγω ist hier ein nautischer Fachausdruck für das Auslaufen beziehungsweise In-See-Stechen.
- source_word: κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: Dann hättet ihr euch diesen Schaden und Verlust erspart
  rationale: κερδαίνω wird hier idiomatisch im Sinn des Vermeidens beziehungsweise Sich-Ersparens eines Nachteils verstanden. »Schaden und Verlust« wahrt die zwei griechischen Begriffe, ohne ihre genaue Abgrenzung vorschnell festzulegen.
