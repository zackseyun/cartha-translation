id: ACT.27.5
reference: Acts 27:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: de
  text: Nachdem wir das offene Meer vor der Küste von Kilikien und Pamphylien durchsegelt hatten, kamen wir nach Myra in Lykien hinab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gelangten wir nach Myra in Lykien“. Das griechische Verb bedeutet wörtlich „kamen hinab“, kann in Reiseberichten aber auch die Ankunft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: das offene Meer
  rationale: πέλαγος bezeichnet hier spezifisch die offene See und nicht lediglich das Meer im Allgemeinen.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: vor der Küste von Kilikien und Pamphylien
  rationale: κατά mit dem Akkusativ bezeichnet in diesem geografischen Zusammenhang den Seeweg entlang beziehungsweise vor den genannten Küstenregionen. Die Formulierung ist im Deutschen natürlich und macht die Lage des Seewegs deutlich.
- source_word: διαπλεύσαντες
  choice: nachdem wir ... durchsegelt hatten
  rationale: Das Aoristpartizip bezeichnet eine vor der Haupthandlung abgeschlossene Fahrt. Der temporale Nebensatz bildet diese Abfolge in natürlichem Deutsch ab.
- source_word: κατήλθομεν
  choice: kamen wir ... hinab
  rationale: Die Wiedergabe bewahrt die Richtungsangabe des griechischen Verbs κατέρχομαι, obwohl es in Reiseberichten auch allgemein die Ankunft bezeichnen kann.
- source_word: Μύρα τῆς Λυκίας
  choice: Myra in Lykien
  rationale: Der Genitiv ordnet Myra der Landschaft Lykien zu; im modernen Deutschen ist die Ortsangabe mit „in“ idiomatisch.
- source_word: τε
  choice: nicht eigens wiedergegeben
  rationale: Die schwache verbindende Funktion von τε wird durch den fortlaufenden deutschen Erzählzusammenhang ausreichend ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nautische Präzision von πέλαγος und die Richtungsbedeutung von κατήλθομεν bleiben erhalten; die griechische Partizipialkonstruktion wird zur besseren Verständlichkeit als temporaler Nebensatz wiedergegeben.
