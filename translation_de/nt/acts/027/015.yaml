  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: de
  text: Als das Schiff vom Wind erfasst wurde und nicht gegen den Wind halten konnte, gaben wir nach[a] und wurden fortgetrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wir gaben dem Wind nach“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναρπασθέντος
  choice: vom Sturm erfasst wurde
  rationale: Das passive Partizip bezeichnet ein plötzliches Ergriffenwerden durch eine äußere Kraft. „Vom Sturm erfasst“ ist im Deutschen natürlich; „Sturm“ verdeutlicht die im Kontext wirkende Kraft, ohne die anschließende Bewegung vorwegzunehmen.
- source_word: πλοίου
  choice: das Schiff
  rationale: „Schiff“ ist in diesem erzählerischen Zusammenhang die natürliche moderne Entsprechung.
- source_word: μὴ δυναμένου
  choice: nicht … konnte
  rationale: Die partizipiale Unfähigkeit wird im Deutschen idiomatisch durch eine finite Verbform wiedergegeben.
- source_word: ἀντοφθαλμεῖν
  choice: gegen den Wind halten
  rationale: Das Verb meint hier nautisch, dem Wind die Stirn zu bieten beziehungsweise den Kurs gegen ihn zu halten. Die Formulierung ist verständlich und bewahrt das Bild des Widerstands.
- source_word: ἀνέμῳ
  choice: den Wind
  rationale: Das Substantiv bedeutet schlicht „Wind“; die Stärke ergibt sich aus dem Zusammenhang.
- source_word: ἐπιδόντες
  choice: gaben wir nach
  rationale: Das Partizip beschreibt das Aufgeben des Widerstands gegen Wind und Strömung. „Nachgeben“ trifft diese bewusste Reaktion knapp und natürlich.
- source_word: ἐφερόμεθα
  choice: ließen uns treiben
  rationale: Das Imperfekt Passiv bezeichnet eine fortdauernde Bewegung unter äußerer Einwirkung. Die deutsche reflexive Wendung gibt zugleich das Zulassen und das Getriebenwerden idiomatisch wieder.
- source_word: δέ
  choice: Als
  rationale: Die griechische narrative Fortführung wird in der deutschen Satzfügung natürlich durch den einleitenden Temporalsatz getragen; ein zusätzliches „und“ wäre unnötig.
