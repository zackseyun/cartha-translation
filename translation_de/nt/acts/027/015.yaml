- from: Als das Schiff vom Sturm erfasst wurde und nicht gegen den Wind halten konnte, gaben wir nach und ließen uns treiben.
  to: Als das Schiff vom Wind erfasst wurde und nicht gegen den Wind halten konnte, gaben wir nach[a] und wurden fortgetrieben.
  rationale: Die Revision vermeidet die nicht ausdrücklich im griechischen Wortlaut enthaltene Verstärkung „Sturm“, gibt das passive ἐφερόμεθα mit „wurden fortgetrieben“ unmittelbarer wieder und ergänzt einen korrekt verankerten Hinweis zur möglichen expliziten Wiedergabe von ἐπιδόντες. Bedeutung, Ereignisfolge und Erzählregister bleiben erhalten.
