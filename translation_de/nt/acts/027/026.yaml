  text: εἰς νῆσον δέ τινα δεῖ ἡμᾶς ἐκπεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/026.yaml
  text: But we must run aground on some island[a].
translation:
  language: de
  text: Doch wir müssen auf irgendeiner Insel stranden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an irgendeine Insel getrieben werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς
  choice: auf
  rationale: In Verbindung mit dem nautischen ἐκπεσεῖν gibt „auf … stranden“ die gerichtete Bewegung idiomatisch und natürlich wieder.
- source_word: νῆσον
  choice: Insel
  rationale: Das Substantiv bezeichnet eindeutig eine Insel.
- source_word: δέ
  choice: Doch
  rationale: δέ kennzeichnet hier einen milden Gegensatz beziehungsweise eine Fortführung; „Doch“ passt zum Kontrast mit der zuvor zugesagten Rettung.
- source_word: τινα
  choice: irgendeiner
  rationale: Das Indefinitpronomen lässt die Insel unbestimmt; „irgendeiner“ bewahrt diese Unbestimmtheit in natürlichem Deutsch.
- source_word: δεῖ
  choice: müssen
  rationale: δεῖ drückt Notwendigkeit aus; „müssen“ erhält deren volle Aussagekraft knapp und idiomatisch.
- source_word: ἡμᾶς
  choice: wir
  rationale: Der griechische Akkusativ fungiert als Subjekt des Infinitivs nach δεῖ; im Deutschen verlangt die finite Form „müssen“ den Nominativ „wir“.
- source_word: ἐκπεσεῖν
  choice: stranden
  rationale: Im nautischen Zusammenhang kann ἐκπίπτω das Auflaufen beziehungsweise Getriebenwerden an Land bezeichnen. „Stranden“ ist eine prägnante, natürliche Wiedergabe, ohne die Art des Vorgangs unnötig festzulegen.
theological_decisions: []
