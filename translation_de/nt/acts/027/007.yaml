  - severity: low
    issue: Fußnote a konkretisiert die Annäherung an Knidos zu stark
    rationale: Der griechische Genitivus absolutus nennt den Wind als Hindernis, ohne das Ziel einer etwaigen Annäherung ausdrücklich zu benennen. Die Anmerkung soll deshalb bei der allgemeinen Bedeutung des verhinderten Weiterkommens bleiben.
