source:
  edition: SBLGNT
  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: de
  text: Viele Tage lang kamen wir nur langsam voran und erreichten mit Mühe die Höhe von Knidos. Da der Wind uns nicht weiterkommen ließ,[a] segelten wir im Schutz Kretas an Salmone vorbei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »da der Wind uns nicht zuließ«. Gemeint ist, dass der Wind ein weiteres Vorankommen verhinderte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »segelten wir unter Kreta«; gemeint ist die windgeschützte Seite der Insel.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες
  choice: Viele Tage lang kamen wir nur langsam voran
  rationale: Die Wendung bezeichnet eine längere Zeitspanne, während βραδυπλοοῦντες langsames Vorankommen auf See ausdrückt. Die deutsche Formulierung ist natürlich und bewahrt den nautischen Zusammenhang.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: erreichten mit Mühe die Höhe von Knidos
  rationale: μόλις hebt die Mühsal beziehungsweise das knappe Gelingen hervor; κατά mit dem Ortsnamen bezeichnet hier nautisch eine Position auf der Höhe von Knidos.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Da der Wind uns nicht weiterfahren ließ
  rationale: Der Genitivus absolutus nennt den Grund für die Kursänderung. προσεάω kann hier das Zulassen des weiteren Vorankommens oder der Annäherung bezeichnen; der Haupttext gibt den Zusammenhang idiomatisch wieder, die Fußnote erhält die Mehrdeutigkeit.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: segelten wir … im Schutz Kretas weiter
  rationale: ὑποπλέω bezeichnet in diesem nautischen Kontext das Segeln auf der windgeschützten Seite einer Insel. Die Formulierung vermeidet schwer verständliche Fachsprache.
- source_word: κατὰ Σαλμώνην
  choice: bei Salmone
  rationale: κατά bezeichnet hier die Lage bei beziehungsweise vor diesem Küstenpunkt; „bei Salmone“ ist im Deutschen klar und lässt die genaue nautische Relation offen.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Knidos / Kreta / Salmone
  rationale: Die Ortsnamen folgen den im modernen Deutschen üblichen Formen.
theological_decisions: []
