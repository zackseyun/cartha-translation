  to: Viele Tage lang kamen wir nur langsam voran und erreichten mit Mühe die Höhe von Knidos. Da der Wind uns nicht weiterkommen ließ,[a] segelten wir im Schutz Kretas an Salmone vorbei.[b]
  rationale: Die Revision klärt die syntaktische und geografische Beziehung zwischen der Fahrt unter dem Schutz Kretas und Salmone. Sie bewahrt die zeitliche Dauer, das langsame Vorankommen, die Schwierigkeit bei Knidos sowie den durch den Wind erzwungenen Kurswechsel. Die Fußnote zu a vermeidet eine nicht ausdrücklich markierte Festlegung auf Knidos als Ziel der Annäherung.
