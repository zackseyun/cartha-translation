  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: de
  text: Am nächsten Tag liefen wir Sidon an. Julius behandelte Paulus freundlich[a] und erlaubte ihm, zu seinen Freunden zu gehen, um Fürsorge zu erhalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „menschlich“ oder „human“. Das griechische Wort bezeichnet ein menschenfreundliches, wohlwollendes Verhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Fürsorge zu erhalten“. Gemeint sein kann allgemein benötigte Hilfe oder Betreuung durch seine Freunde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: Am nächsten Tag
  rationale: Der temporale Dativ bezeichnet im fortlaufenden Reisebericht den folgenden Tag; die Formulierung ist natürlich und wahrt die zeitliche Abfolge.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: liefen wir Sidon an
  rationale: 'κατάγω hat hier einen seemännischen Sinn: Ein Schiff läuft einen Hafen an. Die deutsche Wendung gibt Verb und Zielangabe präzise und idiomatisch wieder.'
- source_word: φιλανθρώπως ... χρησάμενος
  choice: behandelte Paulus menschlich
  rationale: Das Adverb bezeichnet ein menschenfreundliches, wohlwollendes oder humanes Verhalten, besonders bedeutsam gegenüber einem Gefangenen. „Menschlich“ erhält diesen Akzent; die Fußnote nennt die natürlichere Alternative „freundlich“.
- source_word: ἐπέτρεψεν
  choice: erlaubte ihm
  rationale: Das Verb bezeichnet ausdrücklich das Gewähren einer Erlaubnis und passt zu Julius’ amtlicher Aufsicht über Paulus.
- source_word: πρὸς τοὺς φίλους πορευθέντι
  choice: zu seinen Freunden zu gehen
  rationale: Der Artikel verweist kontextuell auf Paulus’ Freunde beziehungsweise Bekannte in Sidon. Das Partizip wird als von „erlaubte“ abhängige Handlung idiomatisch mit einem Infinitiv wiedergegeben.
- source_word: ἐπιμελείας τυχεῖν
  choice: sich von ihnen versorgen zu lassen
  rationale: Die Verbindung bedeutet, Fürsorge, Betreuung oder benötigte Hilfe zu erhalten. Die reflexive deutsche Formulierung drückt die praktische Unterstützung durch die Freunde natürlich aus, ohne ihre Art näher festzulegen.
