  text: εὔθυμοι δὲ γενόμενοι πάντες καὶ αὐτοὶ προσελάβοντο τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/036.yaml
  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: de
  text: Da fassten sie alle Mut und nahmen ebenfalls Nahrung zu sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Auch sie selbst nahmen Nahrung zu sich«; damit wird betont, dass die anderen dem Beispiel des Paulus folgten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: fassten … Mut
  rationale: Die idiomatische deutsche Wendung gibt den Übergang zu neuer Zuversicht bzw. besserer Stimmung im Zusammenhang natürlich wieder, ohne die Lage mit „fröhlich“ zu verharmlosen.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter und bezeichnet eher die anschließende Reaktion als einen starken Gegensatz.
- source_word: γενόμενοι
  choice: fassten
  rationale: Zusammen mit εὔθυμοι bezeichnet das Partizip den Eintritt in einen neuen inneren Zustand; „Mut fassen“ gibt dies idiomatisch wieder.
- source_word: πάντες
  choice: sie alle
  rationale: Die Formulierung bewahrt die Betonung der gesamten Gruppe an Bord.
- source_word: καὶ αὐτοὶ
  choice: ebenfalls
  rationale: Die additive und emphatische Verbindung zeigt, dass nun auch die anderen dem Beispiel des Paulus folgten.
- source_word: προσελάβοντο
  choice: nahmen … zu sich
  rationale: In Verbindung mit τροφῆς bedeutet das Verb, Nahrung zu sich zu nehmen; die Wiedergabe ist im modernen Deutsch natürlich und bleibt nahe am griechischen Ausdruck.
- source_word: τροφῆς
  choice: Nahrung
  rationale: Das Wort bezeichnet hier Essen beziehungsweise Nahrung; „Nahrung“ passt zur Wendung „zu sich nehmen“ und zum würdevollen Erzählstil.
