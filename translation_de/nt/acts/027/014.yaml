base_translation:
  language: en
  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: de
  text: Doch nicht lange danach brach ein orkanartiger Wind, der Eurakylon[b] genannt wird, über sie herein[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brach gegen sie los«. Das griechische Pronomen bezieht sich wahrscheinlich auf die Insel Kreta; die genaue räumliche Beziehung kann jedoch unterschiedlich verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lesen »Euroklydon« statt »Eurakylon«. Der Name bezeichnet wahrscheinlich einen heftigen Nordostwind.
    reason: textual_variant
lexical_decisions:
- source_word: μετ’ οὐ πολὺ δὲ
  choice: Doch kurz darauf
  rationale: Die Wendung bezeichnet einen kurzen zeitlichen Abstand; δέ markiert zugleich die widrige Wendung der Erzählung.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: stürzte … von der Insel herab
  rationale: Bei einem Wind als Subjekt beschreibt ἔβαλεν mit κατά eine heftige Bewegung. Das feminine αὐτῆς bezieht sich im Kontext am ehesten auf die Insel Kreta; die deutsche Formulierung macht diesen Bezug verständlich, ohne ein Schiff als Ziel zu ergänzen.
- source_word: ἄνεμος τυφωνικὸς
  choice: orkanartiger Wind
  rationale: τυφωνικός bezeichnet einen heftigen, wirbelnden Sturm. »Orkanartig« ist im modernen Deutschen natürlich und vermeidet die irreführende Gleichsetzung mit dem meteorologisch engeren Begriff »Taifun«.
- source_word: ὁ καλούμενος Εὐρακύλων
  choice: der Eurakylon genannt wird
  rationale: Der griechische Text behandelt die Bezeichnung als Eigennamen; »Eurakylon« gibt die Form Εὐρακύλων unmittelbar wieder.
