  variant: modern standard German
source:
  edition: SBLGNT
  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: de
  text: Nur mit Mühe fuhren wir an ihrer Küste entlang[a] und kamen zu einem Ort namens Schönhafen, in dessen Nähe die Stadt Lasäa lag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nur mit Mühe segelten wir an ihr entlang“. Das griechische Wort ist ein nautischer Ausdruck für die Fahrt entlang der Küste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: nur mit Mühe
  rationale: Gibt wieder, dass die Fahrt nur unter großen Schwierigkeiten gelang, und passt natürlich zur geschilderten gefährlichen Seereise.
- source_word: τε
  choice: und
  rationale: Verbindet den Satz mit dem vorausgehenden Erzählverlauf, ohne die Partikel im Deutschen zu überzeichnen.
- source_word: παραλεγόμενοι
  choice: fuhren … an ihrer Küste entlang
  rationale: Das Partizip ist hier ein nautischer Ausdruck für die Fahrt entlang einer Küstenlinie. Die deutsche Formulierung ist klar und präzise.
- source_word: αὐτὴν
  choice: ihrer Küste
  rationale: Das Pronomen bezieht sich im Kontext auf Kreta. Die explizite Wiedergabe als Küste macht den nautischen Sinn im Deutschen verständlich, ohne den Bezug zu verändern.
- source_word: ἤλθομεν
  choice: kamen
  rationale: Schlichte, erzählerisch natürliche Wiedergabe des Verbs der Bewegung.
- source_word: εἰς τόπον τινά
  choice: zu einem Ort
  rationale: Bewahrt die Unbestimmtheit von τινά; das zusätzliche ‚gewissen‘ wäre im modernen Deutsch unnötig schwerfällig.
- source_word: καλούμενον
  choice: namens
  rationale: Natürliche deutsche Einführung eines Ortsnamens.
- source_word: Καλοὺς Λιμένας
  choice: Schönhafen
  rationale: Gibt den bedeutungstragenden griechischen Ortsnamen Καλοὶ Λιμένες in einer etablierten, verständlichen deutschen Form wieder.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: in dessen Nähe die Stadt Lasäa lag
  rationale: Das Relativpronomen wird auf den Ort Schönhafen bezogen; ἐγγύς bezeichnet räumliche Nähe. ‚Lag‘ ist bei einer Stadt idiomatischer als ‚war‘. Der Eigenname wird in geläufiger deutscher Form wiedergegeben.
