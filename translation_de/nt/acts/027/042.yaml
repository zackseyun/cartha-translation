  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: de
  text: Die Soldaten beschlossen jedoch, die Gefangenen zu töten, damit niemand wegschwimmen und entkommen würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: fassten ... den Plan
  rationale: Gibt die idiomatische Wendung natürlich wieder und bewahrt den Sinn, dass unter den Soldaten ein Vorhaben entstand.
- source_word: τοὺς δεσμώτας
  choice: die Gefangenen
  rationale: Im Kontext bezeichnet δεσμώτης inhaftierte Personen; „Gefangene“ ist die klare, geläufige deutsche Entsprechung.
- source_word: ἐκκολυμβήσας
  choice: wegschwimmen
  rationale: Das Präfix ἐκ- bezeichnet hier das Schwimmen fort beziehungsweise aus der Gefahrensituation heraus.
- source_word: διαφύγῃ
  choice: entkommen
  rationale: Trifft den Sinn des erfolgreichen Entrinnens und lässt die Abfolge „wegschwimmen und entkommen“ bestehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das adversative δέ wird mit „jedoch“ wiedergegeben. Der verneinte Zwecksatz μή τις erscheint idiomatisch als „damit keiner ... konnte“, ohne die Absicht der Soldaten als tatsächlich verwirklicht darzustellen.
