  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: de
  text: Und dort fand der Hauptmann ein alexandrinisches Schiff, das nach Italien fuhr, und ließ uns an Bord gehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: Dort
  rationale: Das Wort bedeutet „und dort“ beziehungsweise „dort auch“. Im flüssigen deutschen Erzählstil kann die verbindende Bedeutung im Satzzusammenhang mitgetragen werden.
- source_word: εὑρὼν
  choice: fand
  rationale: Das vorzeitige Aoristpartizip wird natürlich als finite Verbform wiedergegeben; die anschließende Handlung bleibt durch „und“ klar erkennbar.
- source_word: ἑκατοντάρχης
  choice: Hauptmann
  rationale: „Hauptmann“ ist die traditionelle, allgemein verständliche deutsche Bezeichnung für den römischen Offiziersrang; „Zenturio“ wäre fachsprachlich genauer, aber weniger allgemeinsprachlich.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: ein alexandrinisches Schiff
  rationale: Die Formulierung bewahrt die geografische Kennzeichnung des Schiffes, ohne über Herkunft, Heimathafen oder Registrierung hinauszugehen.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: das nach Italien fuhr
  rationale: Das Präsenspartizip mit Zielangabe bezeichnet Kurs beziehungsweise Bestimmungsort. „Nach Italien fuhr“ ist im Deutschen natürlich und für ein Schiff eindeutig.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: brachte uns an Bord
  rationale: 'Die Wendung gibt den kausativen Sinn des Verbs klar und idiomatisch wieder: Der Hauptmann veranlasste, dass sie das Schiff bestiegen.'
