source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: de
  text: 'Paulus sagte zu dem Zenturio und den Soldaten: »Wenn diese Männer nicht auf dem Schiff bleiben, könnt ihr nicht gerettet werden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Sicherheit gebracht werden«. Gemeint ist hier die Rettung aus der Seenot, also das körperliche Überleben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: Hauptmann
  rationale: Die traditionelle und im deutschen Bibelstil verständliche Bezeichnung für den römischen Zenturio; sie gibt den militärischen Rang knapp wieder.
- source_word: οὗτοι
  choice: diese Männer
  rationale: Das Demonstrativpronomen verweist im Zusammenhang auf die Seeleute, die das Schiff verlassen wollten. „Männer“ macht den Bezug im Deutschen natürlich deutlich.
- source_word: μείνωσιν
  choice: bleiben
  rationale: Direkte, gegenwärtige und idiomatische Wiedergabe von μένω in der Bedingung.
- source_word: πλοίῳ
  choice: Schiff
  rationale: πλοῖον bezeichnet hier das größere seetüchtige Fahrzeug der Reise; „Schiff“ ist die sachlich passende deutsche Bezeichnung.
- source_word: σωθῆναι
  choice: gerettet werden
  rationale: Bewahrt die breite Bedeutung von σῴζω. Im unmittelbaren Zusammenhang bezeichnet das Verb die Rettung aus der lebensgefährlichen Lage und damit das physische Überleben.
- source_word: οὐ δύνασθε
  choice: könnt ihr nicht
  rationale: Natürliche und direkte Wiedergabe der verneinten Möglichkeitsform; die hervorgehobene Anrede ὑμεῖς wird durch „ihr“ erhalten.
theological_decisions:
- issue: Ob σωθῆναι ausdrücklich als körperliches Überleben oder mit dem weiteren Begriff „gerettet werden“ wiederzugeben ist.
  choice: gerettet werden
  alternative: überleben können / in Sicherheit gebracht werden
  rationale: Der Kontext legt eindeutig eine Rettung aus Seenot nahe, doch das griechische Verb ist der allgemeinere Ausdruck für „retten“. Die Übersetzung bewahrt diese lexikalische Weite, während die Fußnote den konkreten Bezug erklärt, ohne eine Aussage über ewiges Heil einzutragen.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. „Hauptmann“ ist im deutschen Bibelgebrauch vertraut; „Zenturio“ wäre historisch technischer. Die direkte Warnung bleibt knapp und nachdrücklich.
