  variant: modern standard German
source:
  edition: SBLGNT
  text: κορεσθέντες ⸀δὲ τροφῆς ἐκούφιζον τὸ πλοῖον ἐκβαλλόμενοι τὸν σῖτον εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: de
  text: Nachdem sie sich satt gegessen hatten, begannen sie, das Schiff zu erleichtern, indem sie den Weizen ins Meer warfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Getreide“. Das griechische Wort kann Getreide allgemein bezeichnen, meint hier aber wahrscheinlich Weizen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: Nachdem sie sich satt gegessen hatten
  rationale: Das Aoristpartizip bezeichnet hier einen dem Erleichtern des Schiffes vorausgehenden Vorgang; die genitivische Ergänzung τροφῆς wird in natürlichem Deutsch durch „sich satt essen“ wiedergegeben.
- source_word: δὲ
  choice: Nachdem …, begannen sie
  rationale: δέ führt die Erzählung leicht weiter. Im Deutschen genügt hier der durch den temporalen Nebensatz hergestellte Anschluss; ein zusätzliches „und“ wäre möglich, aber stilistisch entbehrlich.
- source_word: ἐκούφιζον
  choice: begannen sie, das Schiff zu erleichtern
  rationale: Der Imperfekt kann den Verlauf oder den Beginn der Handlung hervorheben. Die inchoative Wiedergabe passt zum anschließenden Partizip, das die Art und Weise erklärt.
- source_word: τὸ πλοῖον
  choice: das Schiff
  rationale: „Schiff“ ist im Kontext der Seereise die sachlich und idiomatisch passende Entsprechung.
- source_word: ἐκβαλλόμενοι
  choice: indem sie … warfen
  rationale: Das präsentische Partizip drückt hier das Mittel beziehungsweise die Art und Weise aus, durch die sie das Schiff erleichterten.
- source_word: τὸν σῖτον
  choice: den Weizen
  rationale: σῖτος kann Getreide allgemein bezeichnen, meint im vorliegenden antiken Transportkontext jedoch wahrscheinlich Weizen; die spezifische Wiedergabe bleibt durch eine Fußnote abgesichert.
- source_word: εἰς τὴν θάλασσαν
  choice: ins Meer
  rationale: Natürliche und genaue Wiedergabe der gerichteten Präpositionalphrase.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. „Sich satt essen“ gibt den Sinn natürlich wieder; „das Schiff erleichtern“ bewahrt die maritime Ausdrucksweise. Die aspektuelle Nuance des Imperfekts wird mit „begannen“ sichtbar gemacht.
