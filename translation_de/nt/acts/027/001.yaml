reference: Acts 27:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: de
  text: Als beschlossen wurde, dass wir nach Italien absegeln sollten, übergab man Paulus und einige andere Gefangene einem Zenturio namens Julius von der Augusteischen Kohorte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kaiserlichen Kohorte“; möglicherweise auch: „Kohorte von Sebaste“. Die griechische Bezeichnung σπείρης Σεβαστῆς enthält einen Titel, der mit Augustus beziehungsweise dem Kaiser verbunden ist; welche militärische Einheit genau gemeint ist, ist unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: Als beschlossen wurde
  rationale: Der Aorist Passiv bezeichnet hier unpersönlich eine getroffene Entscheidung. Die Formulierung bewahrt den passiven, amtlichen Sinn und verbindet den Satz natürlich mit dem folgenden Geschehen.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν
  choice: dass wir nach Italien absegeln sollten
  rationale: Der substantivierte Infinitiv gibt den Inhalt des Beschlusses an. „Absegeln“ wahrt die maritime Bedeutung von ἀποπλεῖν; „wir“ erhält die Ich/Wir-Perspektive des Erzählers.
- source_word: παρεδίδουν
  choice: übergab man
  rationale: Das unbestimmte „man“ entspricht dem im Griechischen nicht genannten handelnden Subjekt. „Übergeben“ bezeichnet passend die förmliche Übertragung des Gewahrsams.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Paulus und einige andere Gefangene
  rationale: Die Zusammengehörigkeit von Paulus und den weiteren Gefangenen bleibt klar; im Deutschen wäre eine mechanische Wiedergabe von τε … καί durch „sowohl … als auch“ unnötig schwerfällig.
- source_word: ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ
  choice: einem Hauptmann namens Julius
  rationale: „Hauptmann“ ist die geläufige und verständliche deutsche Bezeichnung für einen römischen Zenturio. Der unbestimmte Artikel entspricht seiner erstmaligen Einführung.
- source_word: σπείρης Σεβαστῆς
  choice: der zur Augusteischen Kohorte gehörte
  rationale: Die Genitivverbindung bezeichnet die militärische Einheit des Julius. „Augusteisch“ gibt den Titelcharakter von Σεβαστή relativ direkt wieder; eine Fußnote wahrt die historische Unsicherheit über die genaue Einheitsbezeichnung.
theological_decisions:
- issue: Historisch unsichere Wiedergabe von σπείρης Σεβαστῆς
  choice: Augusteische Kohorte
  alternative: kaiserliche Kohorte; Kohorte von Sebaste
  rationale: Die Wendung ist historisch, nicht lehrmäßig bedeutsam. Die gewählte Fassung bleibt nahe am griechischen Titel, ohne die genaue Identität der Einheit als sicher auszugeben; Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der griechischen Erzählbewegung, vermeidet jedoch unnötig steife Amts- und Militärsprache. Das einleitende δέ wird nicht eigens mit „nun“ wiedergegeben, da der natürliche deutsche Anschluss durch „Als“ hinreichend markiert ist.
