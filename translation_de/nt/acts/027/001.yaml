  source_fidelity: Der Satz gibt den unpersönlichen Beschluss (ἐκρίθη), die Wir-Perspektive, die förmliche Übergabe in Gewahrsam sowie die Zuordnung des Julius zu einer σπεῖρα zuverlässig wieder. Die historische Ungewissheit von Σεβαστῆς wird angemessen durch die Fußnote markiert.
  naturalness: „Als beschlossen wurde“ und „übergab man“ sind idiomatisches modernes Standarddeutsch. „Zenturio“ ist gegenüber „Hauptmann“ die präzisere und zugleich geläufige Bezeichnung für ἑκατοντάρχης in einem ausdrücklich römischen Zusammenhang; „Hauptmann“ kann unnötig eine moderne bzw. traditionelle deutsche Rangentsprechung nahelegen.
  terminology: „Augusteische Kohorte“ ist als nahe Wiedergabe der Bezeichnung vertretbar, sollte aber wegen der unsicheren historischen Identifikation erläutert bleiben. Die Fußnote sollte die tatsächlich vorliegende griechische Wortgruppe σπείρης Σεβαστῆς benennen, nicht nur eine isolierte, flektierte Form.
