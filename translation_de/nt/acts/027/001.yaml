    rationale: Die Erläuterung nennt lediglich „das griechische Wort Σεβαστή“, während im Text die Wortgruppe σπείρης Σεβαστῆς steht. Eine Formulierung mit der vollständigen Wortgruppe ist philologisch klarer.
