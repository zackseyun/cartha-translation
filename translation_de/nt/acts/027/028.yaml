  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: de
  text: Sie loteten die Tiefe[a] und maßen zwanzig Faden[b]. Nachdem sie ein kurzes Stück weitergefahren waren, loteten sie erneut und maßen fünfzehn Faden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Lot auswerfen“; dabei wurde die Wassertiefe mit einem an einer Leine befestigten Lot gemessen.'
    reason: lexical_alternative
  - marker: b
    text: Ein Faden entspricht ungefähr 1,8 Metern.
    reason: measurement_clarification
lexical_decisions:
- source_word: βολίσαντες
  choice: sie loteten die Tiefe
  rationale: Das Verb bezeichnet das Messen der Wassertiefe mit einem Lot. „Die Tiefe loten“ ist im Deutschen sachlich genau und zugleich verständlicher als die wörtlichere Formulierung „das Lot auswerfen“.
- source_word: εὗρον
  choice: sie stellten … fest
  rationale: Im Zusammenhang gibt das Verb das durch die Lotung ermittelte Ergebnis an. „Feststellen“ klingt dafür im Deutschen natürlicher als das wörtliche „finden“.
- source_word: ὀργυιὰς
  choice: Faden
  rationale: Die ὀργυιά ist hier ein nautisches Längenmaß von ungefähr 1,8 Metern und entspricht dem deutschen „Faden“.
- source_word: εἴκοσι
  choice: zwanzig
  rationale: Direkte Wiedergabe der Zahl.
- source_word: βραχὺ
  choice: ein kurzes Stück
  rationale: Das adverbial gebrauchte Wort bezeichnet hier die kurze Strecke bis zur nächsten Lotung.
- source_word: διαστήσαντες
  choice: nachdem sie … weitergefahren waren
  rationale: Im erzählerischen Zusammenhang bezeichnet das Partizip das Zurücklegen einer weiteren Strecke. „Weitergefahren“ macht die im Kontext vorausgesetzte Bewegung des Schiffes idiomatisch deutlich.
- source_word: πάλιν
  choice: erneut
  rationale: Gibt die Wiederholung der Lotung knapp und natürlich wieder.
- source_word: δεκαπέντε
  choice: fünfzehn
  rationale: Direkte Wiedergabe der Zahl.
- source_word: καὶ … δὲ … καὶ
  choice: … und …; nachdem …, … erneut und …
  rationale: Die Konnektoren gliedern vor allem die zeitliche Abfolge; der deutsche Satz gibt diese Abfolge natürlich wieder, ohne einen unnötig starken Gegensatz einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Erzählsprache. Der nautische Fachausdruck „loten“ bleibt erhalten, wird aber durch „die Tiefe“ und eine Fußnote allgemein verständlich gemacht; das historische Maß „Faden“ wird nicht stillschweigend in Meter umgerechnet.
