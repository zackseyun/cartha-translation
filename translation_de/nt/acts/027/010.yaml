source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: de
  text: 'und sagte zu ihnen: „Männer, ich erkenne, dass die Fahrt mit schwerem Unheil und großem Verlust verbunden sein wird[a] – nicht nur an der Ladung und dem Schiff, sondern auch an unserem Leben[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mit gewaltsamer Bedrängnis und großem Schaden verbunden sein wird“. Das griechische Wort kann die heftige Not oder Schädigung bezeichnen, die mit der Fahrt einhergeht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unsere Seelen“; hier ist damit angesichts der Gefahr von Schiffbruch und Tod unser Leben gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: und sagte zu ihnen
  rationale: Das Partizip führt als Begleitumstand die direkte Rede ein. Im Deutschen gibt eine finite Verbform den fortlaufenden Erzählzusammenhang natürlich wieder.
- source_word: Ἄνδρες
  choice: Männer
  rationale: Die direkte Anrede gibt den maskulinen Plural von ἀνήρ knapp und ohne eine zusätzliche Höflichkeitsnuance wieder.
- source_word: θεωρῶ
  choice: ich erkenne
  rationale: θεωρέω bezeichnet hier keine bloße visuelle Wahrnehmung, sondern eine aufgrund der Lage gewonnene Einschätzung.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: schweres Unheil und großen Verlust mit sich bringen
  rationale: ὕβρις bezeichnet in diesem Zusammenhang eine schwere, gewaltsame Schädigung oder Notlage, ζημία Verlust beziehungsweise Schaden. Die gewählte Formulierung ist idiomatisch und bewahrt die beiden Aspekte.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: nicht nur für die Ladung und das Schiff, sondern auch für
  rationale: Die Genitive hängen sinngemäß von Unheil und Verlust ab. „Für“ macht im Deutschen verständlich, wen oder was der drohende Verlust betrifft.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: unser Leben
  rationale: ψυχή meint angesichts von Schiffbruch und Todesgefahr das physische Leben; der Singular „unser Leben“ ist im Deutschen kollektiv und idiomatisch.
- source_word: μέλλειν ἔσεσθαι
  choice: wird … mit sich bringen
  rationale: Die Konstruktion bezeichnet das nach Paulus’ Einschätzung bevorstehende Ergebnis. Die deutsche Zukunftsform vermittelt diese Erwartung natürlich.
- source_word: τὸν πλοῦν
  choice: die Fahrt
  rationale: πλοῦς bezeichnet die Seefahrt; im bereits gegebenen nautischen Kontext ist „die Fahrt“ knapp und eindeutig.
theological_decisions:
- issue: Bedeutung von ψυχή
  choice: unser Leben
  alternative: unsere Seelen
  rationale: Im Kontext einer drohenden Schiffskatastrophe geht es um den Verlust des irdischen Lebens, nicht um eine Aussage über den immateriellen Teil des Menschen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „Männer“ bewahrt die Form des griechischen Textes; die Wendung „mit sich bringen“ vermeidet eine schwerfällige Nachbildung der griechischen Konstruktion, ohne deren Aussage abzuschwächen.
