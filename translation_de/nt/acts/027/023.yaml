id: ACT.27.23
reference: Acts 27:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: de
  text: Denn in dieser Nacht trat ein Engel des Gottes, dem ich gehöre[a] und dem ich auch diene[b], zu mir
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dessen ich bin“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den ich auch anbete“; das griechische Verb bezeichnet den religiösen Dienst oder die Verehrung, die Gott erwiesen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: trat … zu mir
  rationale: Die Wendung gibt das plötzliche Nahetreten und die Gegenwart des Engels bei Paulus natürlich wieder, ohne sie zum bloßen Erscheinen abzuschwächen.
- source_word: γάρ
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für Paulus’ Zuversicht im Zusammenhang ein.
- source_word: ταύτῃ τῇ νυκτί
  choice: in dieser Nacht
  rationale: Die demonstrative Zeitangabe bezeichnet unmittelbar die betreffende, gerade vergangene oder gegenwärtige Nacht; im Deutschen ist „in dieser Nacht“ natürlich und hinreichend bestimmt.
- source_word: τοῦ θεοῦ
  choice: des Gottes
  rationale: Der Genitiv bestimmt „Engel“ und wird durch die anschließenden Relativsätze näher erläutert.
- source_word: οὗ εἰμι
  choice: dem ich gehöre
  rationale: Die wörtliche Aussage „dessen ich bin“ wird in gegenwärtigem Deutsch als Zugehörigkeit verständlich wiedergegeben.
- source_word: ᾧ καὶ λατρεύω
  choice: dem ich auch diene
  rationale: λατρεύω bezeichnet hier den auf Gott gerichteten religiösen Dienst. „diene“ bewahrt die Dienstkomponente; die kultische Bedeutung wird in der Fußnote erläutert.
- source_word: ἄγγελος
  choice: ein Engel
  rationale: Der Erzählzusammenhang meint einen übernatürlichen Boten Gottes, nicht einen menschlichen Gesandten.
theological_decisions:
- issue: Wiedergabe von οὗ εἰμι
  choice: dem ich gehöre
  alternative: dessen ich bin
  rationale: Die gewählte Formulierung bewahrt die Aussage von Gottes Anspruch auf Paulus, ohne eine weitergehende dogmatische Bestimmung einzutragen.
- issue: Wiedergabe von λατρεύω
  choice: dem ich auch diene
  alternative: den ich auch anbete
  rationale: Das Verb kann kultischen Dienst beziehungsweise Gottesverehrung bezeichnen. „diene“ hält das breitere Bedeutungsspektrum offen; die mögliche Wiedergabe mit „anbete“ wird als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält „ein Engel des Gottes“ zusammen und lässt die beiden Relativsätze Gott näher bestimmen. Der Vers bleibt entsprechend dem griechischen Satzbau für die Fortsetzung im nächsten Vers offen.
