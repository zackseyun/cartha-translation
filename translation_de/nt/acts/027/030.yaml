id: ACT.27.30
reference: Acts 27:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: de
  text: Als aber die Seeleute versuchten, vom Schiff zu fliehen, und das Beiboot unter dem Vorwand ins Meer hinabließen, vom Bug aus Anker ausbringen zu wollen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ ναυτῶν
  choice: Als aber die Seeleute
  rationale: „Seeleute“ ist eine natürliche, allgemein verständliche Bezeichnung für die Schiffsbesatzung; die Genitivkonstruktion wird passend zum abhängigen Satzgefüge als temporaler Nebensatz wiedergegeben.
- source_word: ζητούντων φυγεῖν
  choice: versuchten, ... zu fliehen
  rationale: ζητέω mit Infinitiv bezeichnet hier den Versuch bzw. die Absicht; „zu fliehen“ bewahrt die deutliche Aussage, dass sie das Schiff heimlich verlassen wollten.
- source_word: ἐκ τοῦ πλοίου
  choice: vom Schiff
  rationale: Natürliche deutsche Wiedergabe der Bewegung weg vom Schiff.
- source_word: χαλασάντων τὴν σκάφην
  choice: das Beiboot ... hinabließen
  rationale: σκάφη bezeichnet hier das kleinere Boot des Schiffes. „Beiboot“ ist im Deutschen präziser und geläufiger als „Skiff“; χαλάω wird mit „hinablassen“ treffend wiedergegeben.
- source_word: εἰς τὴν θάλασσαν
  choice: ins Meer
  rationale: Direkte und idiomatische Wiedergabe.
- source_word: προφάσει
  choice: unter dem Vorwand
  rationale: Das Wort bezeichnet hier einen vorgeschobenen, nicht den wahren Grund; „unter dem Vorwand“ ist klar und idiomatisch.
- source_word: ὡς ... μελλόντων
  choice: sie wollten
  rationale: Die Konstruktion bezeichnet die vorgebliche Absicht. Im Deutschen gibt der Konjunktiv-II-Ersatz mit „wollten“ nach „unter dem Vorwand“ den behaupteten Plan knapp und natürlich wieder.
- source_word: ἐκ πρῴρης
  choice: vom Bug aus
  rationale: „Bug“ ist die heute übliche nautische Bezeichnung für den vorderen Teil des Schiffes; „aus“ verdeutlicht den Ausgangspunkt der Handlung.
- source_word: ἀγκύρας ... ἐκτείνειν
  choice: Anker ausbringen
  rationale: „Anker ausbringen“ ist eine natürliche nautische Wiedergabe des in diesem Zusammenhang gebrauchten ἐκτείνω und bewahrt den Plural.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher nautischer Terminologie. Das abschließende Komma bleibt erhalten, weil der griechische Vers syntaktisch in Vers 31 weitergeführt wird. Keine Fußnoten nötig, da „Beiboot“ und „Bug“ die jeweiligen Bedeutungen präzise und ohne wesentlichen Bedeutungsverlust wiedergeben.
