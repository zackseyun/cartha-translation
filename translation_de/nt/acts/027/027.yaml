id: ACT.27.27
reference: Acts 27:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: de
  text: Als die vierzehnte Nacht gekommen war und wir auf dem Adriatischen Meer[a] umhergetrieben wurden, vermuteten die Seeleute gegen Mitternacht, dass sich ihnen ein Stück Land näherte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der antike Name „Adria“ konnte ein größeres Meeresgebiet im zentralen Mittelmeer bezeichnen und war nicht auf die heutige Adria beschränkt.
    reason: cultural_note
  - marker: b
    text: Wörtlich steht das Land als das sich den Seeleuten Näh­ernde da; gemeint ist, dass sie Land in ihrer Nähe wahrnahmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: die vierzehnte Nacht gekommen war
  rationale: Die Zeitangabe bezeichnet den Eintritt der vierzehnten Nacht; die deutsche Formulierung gibt den idiomatischen Gebrauch von γίνομαι natürlich wieder.
- source_word: διαφερομένων ἡμῶν
  choice: wir ... umhergetrieben wurden
  rationale: Das passive Partizip beschreibt eine fortdauernde, nicht selbst gesteuerte Bewegung; im Sturmzusammenhang trifft „umhergetrieben“ den Sinn.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: auf dem Adriatischen Meer
  rationale: Die Bezeichnung wird verständlich geografisch wiedergegeben; der weitere Umfang des antiken Namens wird in der Fußnote erläutert.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: gegen Mitternacht
  rationale: Die Wendung bezeichnet ungefähr die Mitte der Nacht und ist mit „gegen Mitternacht“ knapp und idiomatisch wiedergegeben.
- source_word: ὑπενόουν
  choice: vermuteten
  rationale: Das Verb bezeichnet eine noch unsichere Wahrnehmung oder Schlussfolgerung. Der Imperfekt trägt hier vor allem den fortlaufenden Erzählhintergrund; ein ausdrücklich inchoatives „begannen zu vermuten“ ist nicht zwingend.
- source_word: οἱ ναῦται
  choice: die Seeleute
  rationale: „Seeleute“ ist eine natürliche, moderne und geschlechtsübergreifend als Gruppenbezeichnung verständliche Entsprechung.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: dass sich ihnen Land näherte
  rationale: Die griechische Konstruktion stellt das unbestimmte Land als das sich Nähernde dar. Das Deutsche bewahrt diese Perspektive, ohne mit „irgendein Land“ unnatürlich zu klingen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzstruktur bleibt nahe am griechischen Ablauf, wird aber für flüssiges Deutsch leicht gegliedert. Die ungewohnte Perspektive, nach der sich das Land den Seeleuten nähert, bleibt im Haupttext erhalten und wird in der Fußnote erklärt.
