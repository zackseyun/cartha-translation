  naturalness: Die Sprache ist modernes, gut lesbares Standarddeutsch. „Näher an Kreta entlangsegeln“ ist im nautischen Erzählzusammenhang natürlich genug und präziser als „dicht an der Küste Kretas entlangsegeln“.
  terminology: „Südwind“, „Vorhaben“ und „den Anker lichten“ sind treffend und registergerecht. „Meinten“ erhält den vorläufigen, subjektiven Charakter von δόξαντες.
