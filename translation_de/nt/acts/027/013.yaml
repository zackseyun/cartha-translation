  rationale: Die Revision ersetzt „dicht an der Küste Kretas“ durch „näher an Kreta“, damit die komparative Bedeutung von ἆσσον erhalten bleibt und der im Griechischen nicht ausdrücklich genannte Bezugspunkt nicht unnötig festgelegt wird. Die übrige Übersetzung bleibt quellentreu und idiomatisch.
