  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: de
  text: Als nun ein leichter Südwind aufkam, meinten sie, ihr Vorhaben verwirklicht zu haben. Sie lichteten den Anker[a] und segelten näher an Kreta entlang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie hoben [den Anker]“; gemeint ist das Lichten des Ankers.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und fuhren näher an der Küste Kretas entlang“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος ... νότου
  choice: ein leichter Südwind aufkam
  rationale: Die Wendung bezeichnet das Einsetzen eines sanft oder leicht wehenden Südwinds; „aufkam“ gibt den kontextuellen Beginn natürlich wieder.
- source_word: δόξαντες
  choice: meinten sie
  rationale: Das Verb bezeichnet hier ihre subjektive Einschätzung, nicht gesicherte Gewissheit.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: ihr Vorhaben verwirklicht zu haben
  rationale: Die Verbindung drückt aus, dass sie ihr beabsichtigtes Ziel beziehungsweise ihren Plan bereits erreicht oder gesichert glaubten. „Verwirklicht“ ist im Deutschen idiomatisch, ohne den genauen Gegenstand des Vorhabens festzulegen.
- source_word: ἄραντες
  choice: sie lichteten den Anker
  rationale: Das wörtliche „hochheben“ hat hier den nautischen Sinn des Ankerlichtens; das im Griechischen ausgelassene Objekt ergibt sich aus dem Zusammenhang.
- source_word: ἆσσον
  choice: dicht an der Küste
  rationale: Das Adverb bedeutet „näher“; im nautischen Zusammenhang ist die Nähe zur Küste gemeint.
- source_word: παρελέγοντο τὴν Κρήτην
  choice: segelten ... an der Küste Kretas entlang
  rationale: Das nautische Verb bezeichnet das Entlangfahren an einer Küste. Die ausdrückliche Nennung der Küste macht den deutschen Satz klar und natürlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Nautische Begriffe werden verständlich und präzise wiedergegeben; die subjektive, später als irrig erkennbare Einschätzung der Seeleute bleibt durch „meinten“ erhalten.
