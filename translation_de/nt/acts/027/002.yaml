source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: de
  text: Wir gingen an Bord eines Schiffes aus Adramyttion, das zu Orten entlang der Küste der Provinz Asia[a][b] segeln sollte, und stachen in See. Aristarch, ein Makedonier aus Thessalonich, war bei uns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die römische Provinz Asia im Westen Kleinasiens, nicht der heutige Kontinent Asien.
    reason: cultural_note
  - marker: b
    text: 'Oder: „zu den Häfen entlang der Küste der Provinz Asia“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: Wir gingen an Bord
  rationale: Das aoristische Partizip bezeichnet im nautischen Zusammenhang das Besteigen eines Schiffes und wird als vorausgehende Handlung natürlich wiedergegeben.
- source_word: δὲ
  choice: und
  rationale: δέ führt hier die Erzählung weiter, ohne einen deutlichen Gegensatz auszudrücken.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: eines Schiffes aus Adramyttion
  rationale: Das Adjektiv kennzeichnet das Schiff wahrscheinlich nach seinem Herkunfts- oder Heimathafen; die deutsche Herkunftsangabe ist klarer als eine ungebräuchliche Adjektivbildung.
- source_word: μέλλοντι πλεῖν
  choice: das … anlaufen sollte
  rationale: μέλλω mit Infinitiv bezeichnet hier die vorgesehene unmittelbar bevorstehende Fahrt. Zusammen mit den Zielorten ist „anlaufen sollte“ idiomatisches nautisches Deutsch.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: Orte entlang der Küste Asias
  rationale: Die Wendung bezeichnet mehrere Zielorte entlang der Provinz Asia. Der Küstenbezug ergibt sich aus dem Reiseweg per Schiff; „Orte“ bewahrt gegenüber „Häfen“ die allgemeinere Bedeutung von τόπους.
- source_word: Ἀσίαν
  choice: Asia
  rationale: Gemeint ist die römische Provinz Asia im Westen Kleinasiens. Der historische Eigenname bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: ἀνήχθημεν
  choice: stachen in See
  rationale: Die Passivform von ἀνάγω ist hier ein üblicher nautischer Ausdruck für das Auslaufen aus einem Hafen.
- source_word: ὄντος σὺν ἡμῖν Ἀριστάρχου
  choice: Bei uns war Aristarch
  rationale: Der Genitivus absolutus nennt einen begleitenden Umstand. Die eigenständige Satzform gibt ihn in natürlichem Deutsch wieder.
- source_word: Μακεδόνος Θεσσαλονικέως
  choice: ein Makedonier aus Thessalonich
  rationale: Die beiden Angaben bezeichnen Region und Herkunftsstadt des Aristarch und lassen sich so ohne Häufung ungebräuchlicher Einwohnerbezeichnungen wiedergeben.
