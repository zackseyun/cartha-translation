revisions:
- from: Wir gingen an Bord eines Schiffes aus Adramyttion, das Orte entlang der Küste Asias[a][b] anlaufen sollte, und stachen in See. Bei uns war Aristarch, ein Makedonier aus Thessalonich.
  to: Wir gingen an Bord eines Schiffes aus Adramyttion, das zu Orten entlang der Küste der Provinz Asia[a][b] segeln sollte, und stachen in See. Aristarch, ein Makedonier aus Thessalonich, war bei uns.
  rationale: Die Revision ersetzt das zu spezifische „anlaufen“ durch „segeln“, bewahrt damit die allgemeine Bedeutung von τόπους und lässt die mögliche Einengung auf Häfen in der Fußnote. Die historische Bezeichnung wird mit „Provinz Asia“ grammatisch und sachlich klar gefasst; der Fußnotenanker für die lexikalische Alternative wird bei der betroffenen Ortsangabe gesetzt.
  reviewer_model: gpt-5.6-terra
