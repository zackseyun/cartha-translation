  source_fidelity: Der Haupttext gibt διὸ, den Imperativ εὐθυμεῖτε, die ausdrücklich männliche Anrede ἄνδρες, πιστεύω mit Dativ, den Inhaltssatz mit ὅτι sowie die Vergleichsformel οὕτως ... καθ’ ὃν τρόπον treffend wieder. »Es genauso kommen wird« ist eine natürliche Wiedergabe von οὕτως ἔσται; »wie es mir gesagt worden ist« wahrt das Perfektpassiv von λελάληταί μοι.
  naturalness: Der Vers ist flüssiges modernes Standarddeutsch. »Darum fasst Mut, ihr Männer!« ist eine idiomatische, zugleich dem ernsten Kontext angemessene Anrede. Auch »ich glaube Gott, dass ...« ist im Deutschen verständlich und bewahrt die im Griechischen vorliegende Verbindung von προσωπlichem Vertrauen und dem Glauben an die mitgeteilte Zusage.
  terminology: '»Ich glaube Gott« ist hier vorzugswürdig, weil πιστεύω τῷ θεῷ nicht lediglich allgemeinen Gottesglauben, sondern Gott Glauben schenken meint. Die Fußnote sollte diese Nuance idiomatischer und präziser ausdrücken: nicht »Glauben an das von ihm Gesagte«, sondern »Gott Glauben schenken« bzw. »ihm vertrauen«.'
