  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: de
  text: Darum fasst Mut, ihr Männer! Denn ich glaube Gott[a], dass es genauso kommen wird, wie es mir gesagt worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ich vertraue Gott«. Die griechische Konstruktion kann sowohl betonen, dass Paulus Gott Glauben schenkt, als auch, dass er ihm vertraut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der unmittelbar zuvor gegebenen Zusage und klingt im modernen Deutsch natürlich.
- source_word: εὐθυμεῖτε
  choice: fasst Mut
  rationale: Der Imperativ fordert inmitten der Gefahr zu Zuversicht und innerer Festigkeit auf; die Wendung ist verständlich und idiomatisch.
- source_word: ἄνδρες
  choice: ihr Männer
  rationale: Gibt die direkte Anrede einer männlichen Gruppe ausdrücklich wieder.
- source_word: πιστεύω τῷ θεῷ
  choice: ich glaube Gott
  rationale: Die Konstruktion mit dem Dativ bezeichnet hier, dass Paulus Gott Glauben schenkt beziehungsweise ihm vertraut. Die knappe Wiedergabe bewahrt sowohl den persönlichen als auch den auf Gottes Zusage bezogenen Sinn.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was Paulus glaubt, nicht den Grund seines Glaubens.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: es genauso kommen wird, wie
  rationale: Bringt die genaue Übereinstimmung zwischen dem angekündigten Wort und dem künftigen Geschehen klar und natürlich zum Ausdruck.
- source_word: λελάληταί μοι
  choice: es mir gesagt worden ist
  rationale: Bewahrt das Passiv und gibt den vorausgegangenen Ausspruch als weiterhin maßgebliche Mitteilung wieder.
theological_decisions:
- issue: Wiedergabe von πιστεύω τῷ θεῷ
  choice: ich glaube Gott
  alternative: ich vertraue Gott
  rationale: Der Dativ kann sowohl das Vertrauen auf Gott als auch das Glaubenschenken gegenüber seinem Wort hervorheben. Der Haupttext wahrt die unmittelbare grammatische Beziehung, während die Fußnote die echte Bedeutungsnuance sichtbar macht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Fasst Mut« vermeidet die altertümliche Wendung »Seid guten Mutes«; »ihr Männer« erhält die geschlechtsspezifische direkte Anrede des Ausgangstextes.
