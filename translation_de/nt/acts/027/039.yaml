base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: de
  text: Als es Tag wurde, erkannten sie das Land nicht. Sie bemerkten aber eine Bucht mit einem Strand. Sie planten, das Schiff, wenn möglich, in die Bucht auf den Strand zu treiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Schiff auflaufen zu lassen«. Das griechische Verb bezeichnet hier, dass man das Schiff gezielt ans Ufer beziehungsweise auf den Strand treibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Als es Tag wurde
  rationale: Gibt den zeitlichen Nebensatz natürlich und eng am griechischen Wortlaut wieder; δέ wirkt hier als leichter Erzählübergang und braucht kein zusätzliches deutsches »nun«.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: erkannten sie das Land nicht
  rationale: ἐπιγινώσκω bezeichnet hier das Wiedererkennen oder Identifizieren; »Land« bewahrt die Breite von γῆ, während der Zusammenhang die Küste beziehungsweise den Ort meint.
- source_word: κόλπον δέ τινα κατενόουν
  choice: Sie bemerkten aber eine Bucht
  rationale: κόλπος bezeichnet im nautischen Zusammenhang eine Bucht; κατανοέω drückt aufmerksames Wahrnehmen aus. Der unbestimmte Artikel gibt τινα im Deutschen idiomatisch wieder.
- source_word: ἔχοντα αἰγιαλόν
  choice: mit einem Strand
  rationale: αἰγιαλός bezeichnet Strand oder Ufer. »Strand« ist konkret, ohne eine sandige Beschaffenheit hinzuzufügen, die der griechische Text nicht ausdrücklich nennt.
- source_word: εἰς ὃν
  choice: dort
  rationale: Das deutsche Ortsadverb nimmt die zuvor genannte Bucht als Ziel auf und gibt die Richtungsangabe εἰς idiomatisch wieder.
- source_word: ἐβουλεύοντο
  choice: Sie planten
  rationale: βουλεύομαι kann beraten, beabsichtigen oder planen bedeuten; hier bezeichnet es die Absicht bezüglich des weiteren Vorgehens mit dem Schiff.
- source_word: εἰ δύναιντο
  choice: wenn möglich
  rationale: Die Formulierung bewahrt die durch εἰ mit dem Optativ ausgedrückte Möglichkeit beziehungsweise Unsicherheit knapp und natürlich.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: das Schiff auf den Strand zu setzen
  rationale: ἐξωθέω bezeichnet ein Hinausdrängen oder -treiben; nautisch ist gemeint, das Schiff gezielt ans Ufer beziehungsweise auf den Strand zu bringen.
