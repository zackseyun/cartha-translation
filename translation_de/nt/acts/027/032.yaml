  yaml_path: translation/nt/acts/027/032.yaml
  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: de
  text: Da kappten die Soldaten die Leinen des Beiboots und ließen es abtreiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb bedeutet wörtlich „heraus- oder wegfallen“ und kann im nautischen Zusammenhang bedeuten, dass ein losgemachtes Boot abtreibt.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Kennzeichnet knapp und natürlich den nächsten Schritt in der Erzählung.
- source_word: ἀπέκοψαν
  choice: kappten
  rationale: Das deutsche Verb bezeichnet im Zusammenhang mit Leinen präzise das Durchtrennen und Losmachen.
- source_word: οἱ στρατιῶται
  choice: die Soldaten
  rationale: Direkte und im Kontext eindeutige Wiedergabe des Subjekts.
- source_word: τὰ σχοινία
  choice: die Leinen
  rationale: Im seemännischen Zusammenhang ist „Leinen“ natürlicher und genauer als das allgemeinere „Seile“.
- source_word: τῆς σκάφης
  choice: des Beiboots
  rationale: σκάφη bezeichnet hier das kleinere, zum Schiff gehörende Boot; „Beiboot“ macht diese Beziehung im Deutschen klar.
- source_word: εἴασαν αὐτὴν
  choice: ließen es
  rationale: Gibt die Konstruktion mit ἐάω und dem auf das Boot bezogenen Pronomen knapp und idiomatisch wieder.
- source_word: ἐκπεσεῖν
  choice: abtreiben
  rationale: Im nautischen Kontext bezeichnet das Verb das Sichentfernen des losgemachten Bootes; „abtreiben“ ist natürlich, ohne eine gezielte Handlung zu unterstellen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Kappen“, „Leinen“ und „Beiboot“ sind verständliche nautische Begriffe; die Fußnote bewahrt die bildhaftere Grundbedeutung von ἐκπίπτω.
