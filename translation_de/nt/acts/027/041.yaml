  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: de
  text: Doch sie gerieten an eine Stelle, wo zwei Gewässer zusammentrafen[a], und ließen das Schiff auf Grund laufen. Der Bug setzte sich fest und blieb unbeweglich, das Heck aber wurde von der Wucht auseinandergebrochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an eine Stelle zwischen zwei Gewässern«. Der seltene griechische Ausdruck kann einen Kanal, eine Sandbank oder eine Stelle bezeichnen, an der zwei Gewässer oder Strömungen zusammentreffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: sie gerieten an
  rationale: Das Aoristpartizip bezeichnet hier die unvermittelte, widrige Begegnung des Schiffes mit der Stelle; „gerieten an“ ist natürlich und legt den genauen nautischen Vorgang nicht unnötig fest.
- source_word: τόπον διθάλασσον
  choice: eine Stelle, wo zwei Wasser zusammentrafen
  rationale: Das seltene διθάλασσος bezeichnet eine mit zwei Meeren, Gewässern oder Strömungen verbundene Stelle. „Zwei Wasser“ bewahrt die Unbestimmtheit besser als das geografisch enger wirkende „zwei Meere“; die Fußnote nennt mögliche Deutungen.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: ließen das Schiff auf Grund laufen
  rationale: ἐπικέλλω ist ein nautischer Ausdruck für das Aufgrundsetzen oder Stranden eines Schiffes.
- source_word: πρῷρα
  choice: der Bug
  rationale: Der übliche moderne deutsche nautische Ausdruck für den vorderen Teil eines Schiffes.
- source_word: ἐρείσασα
  choice: bohrte sich fest
  rationale: ἐρείδω bezeichnet festes Aufsetzen oder Feststemmen. Im Zusammenhang vermittelt „bohrte sich fest“ anschaulich, dass der Bug festsaß, ohne ein bestimmtes Material zu ergänzen.
- source_word: ἔμεινεν ἀσάλευτος
  choice: blieb unbeweglich
  rationale: Die Wendung besagt, dass der Bug fest an seinem Platz blieb und nicht bewegt wurde.
- source_word: πρύμνα
  choice: das Heck
  rationale: Der geläufige moderne nautische Ausdruck für den hinteren Teil des Schiffes.
- source_word: ἐλύετο
  choice: wurde auseinandergebrochen
  rationale: Das Imperfekt Passiv beschreibt einen fortschreitenden Zerfall unter äußerer Einwirkung; die deutsche Verlaufsbedeutung ergibt sich im Kontext.
- source_word: ὑπὸ τῆς βίας
  choice: von der Wucht
  rationale: βία bedeutet Kraft, Gewalt oder Wucht. „Von der Wucht“ lässt wie der griechische Text offen, ob ausdrücklich Wellen, Brandung oder Strömung gemeint sind.
