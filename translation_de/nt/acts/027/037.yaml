base_translation:
  language: en
  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: de
  text: Wir waren insgesamt 276 Menschen an Bord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Wir waren aber alle Seelen im Schiff, 276.« »Seelen« bedeutet hier »Menschen« oder »Personen«, nicht speziell unkörperliche Seelen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: wir waren
  rationale: Die erste Person Plural wird im Deutschen natürlich und unmittelbar wiedergegeben; zugleich bleibt Lukas als Teil der Reisegruppe sprachlich sichtbar.
- source_word: δὲ
  choice: unübersetzt
  rationale: Die schwache fortführende Partikel verlangt hier im Deutschen kein eigenes Übergangswort; der narrative Zusammenhang trägt die Verbindung.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: insgesamt … Menschen
  rationale: ψυχαί bezeichnet hier die Personen an Bord, nicht speziell unkörperliche Seelen. »Insgesamt« gibt den zusammenfassenden Sinn von πᾶσαι wieder.
- source_word: ἐν τῷ πλοίῳ
  choice: an Bord
  rationale: Die idiomatische deutsche Wendung gibt den Aufenthaltsort im Schiff natürlich und präzise wieder.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: Die Ziffern bewahren die genaue Zahl und sind in modernem Deutsch gut lesbar.
theological_decisions:
- issue: Bedeutung von ψυχαί
  choice: Menschen
  alternative: Seelen
  rationale: Im Kontext einer Zählung bezeichnet ψυχή die einzelne Person beziehungsweise das menschliche Leben. »Seelen« könnte hier unnötig eine Aussage über den immateriellen Teil des Menschen nahelegen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Formulierung »Wir waren« bewahrt die griechische Erzählperspektive; »an Bord« ist gegenüber »im Schiff« die natürlichere heutige Ausdrucksweise.
