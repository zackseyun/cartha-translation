  text: νησίον δέ τι ὑποδραμόντες καλούμενον ⸀Καῦδα ⸂ἰσχύσαμεν μόλις⸃ περικρατεῖς γενέσθαι τῆς σκάφης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: de
  text: Doch als wir im Windschatten einer kleinen Insel namens Kauda[a] entlangsegelten, konnten wir das Beiboot kaum sichern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als wir unter dem Schutz einer kleinen Insel namens Kauda entlangsegelten“. Der griechische Ausdruck ist nautisch und bezeichnet das Segeln auf der windgeschützten Seite einer Insel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: einer kleinen Insel
  rationale: Das Diminutiv νησίον bezeichnet eine kleine Insel; die deutsche Formulierung ist natürlich und bewahrt diesen Sinn.
- source_word: δέ
  choice: und
  rationale: δέ markiert hier einen leichten erzählerischen Übergang; im Deutschen verbindet „und“ den Satz natürlich mit dem vorausgehenden Geschehen, ohne einen stärkeren Gegensatz einzutragen.
- source_word: ὑποδραμόντες
  choice: im Schutz ... entlangliefen
  rationale: Das Verb ist hier nautisch gebraucht und bezeichnet das Fahren auf der windabgewandten, geschützten Seite einer Insel.
- source_word: καλούμενον Καῦδα
  choice: namens Kauda
  rationale: Die Wendung identifiziert die Insel knapp und idiomatisch mit ihrem Namen; „Kauda“ gibt Καῦδα wieder.
- source_word: ἰσχύσαμεν μόλις
  choice: konnten ... nur mit Mühe
  rationale: Die Verbindung beschreibt, dass etwas gerade noch beziehungsweise unter großer Schwierigkeit gelang.
- source_word: περικρατεῖς γενέσθαι
  choice: unter Kontrolle bringen
  rationale: Die Wendung bedeutet, Gewalt oder Kontrolle über etwas zu erlangen; hier geht es darum, das mitgeführte Boot zu fassen und zu sichern.
- source_word: τῆς σκάφης
  choice: das Beiboot
  rationale: σκάφη bezeichnet hier das kleinere, zum Schiff gehörende Boot, das offenbar hinterhergezogen wurde; „Beiboot“ ist im Deutschen klar und sachgerecht.
