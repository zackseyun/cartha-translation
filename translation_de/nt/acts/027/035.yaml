id: ACT.27.35
reference: Acts 27:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: de
  text: Nachdem er das gesagt hatte, nahm er Brot, dankte Gott vor den Augen aller[a], brach es und begann zu essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in Gegenwart aller.'
    reason: Lexikalische Alternative für ἐνώπιον πάντων; die Wendung kann sowohl anschaulich als »vor den Augen aller« als auch allgemeiner als »in Gegenwart aller« wiedergegeben werden.
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Nachdem er das gesagt hatte
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung; die Formulierung gibt die Abfolge in natürlichem modernem Deutsch wieder. δέ wird durch den fließenden Satzanschluss ausreichend abgebildet.
- source_word: λαβὼν ἄρτον
  choice: nahm er Brot
  rationale: ἄρτον ist artikellos und wird daher nicht unnötig als ganzer Laib oder als bestimmte Brotmenge festgelegt.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: dankte Gott
  rationale: Die knappe deutsche Wendung gibt εὐχαριστέω mit dem Dativobjekt klar und idiomatisch wieder.
- source_word: ἐνώπιον πάντων
  choice: vor den Augen aller
  rationale: Die Formulierung bewahrt den öffentlichen Charakter der Danksagung und entspricht der räumlich-anschaulichen Bedeutung von ἐνώπιον.
- source_word: κλάσας
  choice: brach es
  rationale: Das Pronomen bezieht sich eindeutig auf das zuvor genannte Brot und ist im Deutschen zur natürlichen Satzbildung erforderlich.
- source_word: ἤρξατο ἐσθίειν
  choice: begann zu essen
  rationale: Die Verbindung aus ἄρχομαι und Infinitiv bezeichnet den Beginn der Handlung und wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Möglicher eucharistischer Anklang der Abfolge »Brot nehmen – danken – brechen – essen«
  choice: Die Handlungen werden als schlichte Bestandteile der erzählten Mahlzeit wiedergegeben.
  alternative: Eine stärker liturgisch geprägte Formulierung könnte den Anklang an das Abendmahl hervorheben.
  rationale: Die Wortfolge kann an andere neutestamentliche Mahlszenen erinnern, doch der Vers bezeichnet das Geschehen nicht ausdrücklich als Abendmahl. Die Übersetzung lässt den möglichen Anklang bestehen, ohne eine sakramentale Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Partizipialkette des Griechischen wird in einen flüssigen deutschen Satz überführt, ohne die zeitliche Abfolge oder den öffentlichen Charakter der Handlung zu verlieren.
