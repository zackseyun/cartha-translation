source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: de
  text: Da der Hafen zum Überwintern ungeeignet war, beschloss die Mehrheit, von dort auszulaufen, um, wenn möglich, Phönix zu erreichen und dort zu überwintern – einen Hafen Kretas, der nach Südwesten und Nordwesten ausgerichtet ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die abschließenden Richtungsangaben sind schwer zu deuten. Traditionell werden sie mit „nach Südwesten und Nordwesten“ wiedergegeben; die zweite kann genauer „Westnordwesten“ bedeuten. Möglicherweise bezeichnen die Angaben nicht die Ausrichtung des Hafens, sondern die Richtungen, aus denen die Winde kamen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: ungeeignet
  rationale: Bezeichnet den Hafen als für den beabsichtigten Zweck, das Überwintern, nicht gut geeignet; die moderne deutsche Formulierung ist klar und sachgerecht.
- source_word: πρὸς παραχειμασίαν
  choice: zum Überwintern
  rationale: Gibt die Zweckbestimmung knapp und natürlich wieder.
- source_word: οἱ πλείονες
  choice: die Mehrheit
  rationale: Der substantivierte Komparativ bezeichnet den größeren Teil der beteiligten Gruppe, ohne diese näher zu bestimmen.
- source_word: ἔθεντο βουλήν
  choice: beschloss
  rationale: Die idiomatische Wendung bezeichnet einen gemeinsam gefassten Entschluss.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: von dort auszulaufen
  rationale: ἀνάγω ist hier ein nautischer Fachausdruck für das Ablegen beziehungsweise Auslaufen.
- source_word: εἴ πως δύναιντο
  choice: um nach Möglichkeit
  rationale: Die Formulierung bewahrt die in εἴ πως mit dem Optativ ausgedrückte Unsicherheit und Hoffnung, klingt im Deutschen aber natürlicher als ein wörtliches „wenn sie irgendwie könnten“.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: Phönix zu erreichen
  rationale: Das Partizip bezeichnet das Gelangen an das Reiseziel; „erreichen“ ist im Reisebericht idiomatisch.
- source_word: Φοίνικα
  choice: Phönix
  rationale: Die eingebürgerte deutsche Wiedergabe des Namens des kretischen Hafens lautet „Phönix“.
- source_word: παραχειμάσαι
  choice: dort zu überwintern
  rationale: Gibt das Verbringen der Wintersaison am erhofften Ziel präzise und knapp wieder.
- source_word: λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: Dieser Hafen Kretas ist nach Südwesten und Nordwesten ausgerichtet
  rationale: Die Apposition wird zur besseren Verständlichkeit als eigener Satz wiedergegeben. Die traditionellen Richtungsangaben bleiben im Haupttext erhalten; ihre genaue nautisch-geografische Deutung ist umstritten.
