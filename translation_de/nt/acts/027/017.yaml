id: ACT.27.17
reference: Acts 27:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἣν ἄραντες βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον· φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν, χαλάσαντες τὸ σκεῦος, οὕτως ἐφέροντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: de
  text: Nachdem sie es hochgezogen hatten, setzten sie Stütztaue ein und umgürteten damit das Schiff. Weil sie fürchteten, auf die Syrte[a] aufzulaufen, ließen sie das Schiffsgerät[b] hinab und wurden so dahingetrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Syrte war ein wegen seiner Untiefen und Sandbänke berüchtigtes Seegebiet vor der nordafrikanischen Küste.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ließen sie die Takelage hinab“ beziehungsweise „ließen sie den Treibanker hinab“. Das griechische Wort bedeutet allgemein „Gerät“ oder „Ausrüstung“; welcher Teil der Schiffsausrüstung gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Nachdem sie es hochgezogen hatten
  rationale: Das Relativpronomen bezieht sich auf das Beiboot aus dem vorhergehenden Vers; der deutsche Satz nimmt es natürlich mit „es“ auf. Der Aoristpartizip bezeichnet die vorausgehende Handlung.
- source_word: βοηθείαις ἐχρῶντο
  choice: setzten sie Stütztaue ein
  rationale: βοήθειαι bezeichnet hier im nautischen Zusammenhang Hilfs- bzw. Verstärkungsmittel, wahrscheinlich Taue zur Stabilisierung des Rumpfes.
- source_word: ὑποζωννύντες τὸ πλοῖον
  choice: umgürteten damit das Schiff
  rationale: Die Wiedergabe bewahrt das konkrete Bild des griechischen Verbs und bezeichnet das Herumführen von Tauen zur Verstärkung des Schiffsrumpfes.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: auf die Syrte aufzulaufen
  rationale: ἐκπίπτω beschreibt hier die Gefahr, auf die berüchtigten Untiefen der Syrte verschlagen zu werden; „auflaufen“ ist im Deutschen nautisch klar.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: ließen sie das Schiffsgerät hinab
  rationale: σκεῦος ist allgemein „Gerät/Ausrüstung“. Das genaue nautische Objekt bleibt unsicher; „Schiffsgerät“ erhält diese Unbestimmtheit, statt einen Treibanker als sicher vorauszusetzen.
- source_word: οὕτως ἐφέροντο
  choice: wurden so dahingetrieben
  rationale: Der Imperfekt Passiv schildert die fortdauernde Bewegung unter äußerer Gewalt, hier durch Wind und See.
theological_decisions: []
