source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: de
  text: Und nun rate ich euch, guten Mutes zu sein[a]; denn keiner von euch wird sein Leben verlieren[b]; verloren geht nur das Schiff.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mut zu fassen“ oder „zuversichtlich zu sein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn es wird keinen Verlust an Leben unter euch geben.“ Das griechische Wort ψυχή bezeichnet hier das leibliche Leben, nicht ausdrücklich die Seele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: jetzt
  rationale: Die idiomatische Zeitangabe leitet die gegenwärtige Ermahnung ein; „jetzt“ ist im Deutschen knapp und natürlich.
- source_word: παραινῶ
  choice: ich ermahne euch
  rationale: Das Verb bezeichnet einen nachdrücklichen Rat oder eine Ermahnung. „Ermahnen“ bewahrt die Ernsthaftigkeit der Aufforderung, ohne einen Befehl daraus zu machen.
- source_word: εὐθυμεῖν
  choice: guten Mutes zu sein
  rationale: Das Verb meint, Mut zu haben beziehungsweise zuversichtlich zu sein. Die gewählte Wendung ist würdig, verständlich und passt zur Gefahrensituation.
- source_word: ἀποβολὴ ψυχῆς
  choice: sein Leben verlieren
  rationale: ἀποβολή bezeichnet hier Verlust und ψυχή das leibliche Leben. Die persönliche Formulierung gibt den Sinn im Deutschen klar wieder, ohne ψυχή als immaterielle „Seele“ festzulegen.
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: keiner von euch wird … verlieren
  rationale: Diese natürliche deutsche Konstruktion bewahrt die umfassende Verneinung und bezeichnet die Gruppe, aus der niemand ums Leben kommen wird.
- source_word: πλὴν τοῦ πλοίου
  choice: nur das Schiff wird verloren gehen
  rationale: 'Die elliptische Ausnahme wird im Deutschen ausdrücklich ergänzt: Nicht Menschenleben, sondern allein das Schiff wird verloren gehen.'
theological_decisions:
- issue: Bedeutung von ψυχή
  choice: Leben
  alternative: Seele
  rationale: Im Zusammenhang einer drohenden Schiffskatastrophe bezeichnet ψυχή das physische Leben. „Seele“ könnte hier irreführend eine Aussage über den immateriellen Teil des Menschen nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung bleibt pastoral und nachdrücklich; die elliptische Aussage über den Verlust des Schiffes wird für natürliche deutsche Verständlichkeit explizit formuliert.
