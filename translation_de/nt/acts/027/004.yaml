base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: de
  text: Und von dort stachen wir in See und segelten an der windgeschützten Seite Zyperns entlang, weil die Winde uns entgegenstanden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Von dort
  rationale: Gibt καί plus ἐκεῖθεν im fortlaufenden deutschen Erzählstil natürlich wieder; die Satzverknüpfung wird durch den Kontext ausreichend getragen.
- source_word: ἀναχθέντες
  choice: liefen wir aus
  rationale: Das Partizip von ἀνάγω bezeichnet hier im nautischen Gebrauch das Auslaufen beziehungsweise In-See-Stechen. Die deutsche finite Reihung gibt die zeitlich vorausgehende Handlung flüssig wieder.
- source_word: ὑπεπλεύσαμεν
  choice: segelten im Schutz von
  rationale: Das nautische ὑποπλέω bezeichnet das Segeln auf der windgeschützten Seite einer Insel. Die Formulierung ist präzise und zugleich für heutige Leser verständlich.
- source_word: τὴν Κύπρον
  choice: Zypern
  rationale: Übliche deutsche Namensform der Insel Κύπρος.
- source_word: διὰ τὸ ... εἶναι
  choice: weil
  rationale: διά mit substantiviertem Infinitiv drückt hier den Grund aus; „weil“ ist die klare und natürliche deutsche Entsprechung.
- source_word: τοὺς ἀνέμους
  choice: die Winde
  rationale: Direkte Wiedergabe des griechischen Plurals.
- source_word: ἐναντίους
  choice: uns entgegenstanden
  rationale: Gibt die widrige Richtung der Winde idiomatisch wieder. Das im Griechischen nicht eigens ausgedrückte „uns“ ergibt sich aus der Situation und ist im Deutschen für die natürliche Formulierung angebracht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der nautische Sinn wird ohne unnötige Fachsprache ausgedrückt; „im Schutz von Zypern“ bewahrt die Aussage, dass die Route an der windgeschützten Seite der Insel entlangführte.
