  text: σφοδρῶς δὲ χειμαζομένων ἡμῶν τῇ ἑξῆς ἐκβολὴν ἐποιοῦντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/018.yaml
  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: de
  text: Während wir vom Sturm heftig hin und her geworfen wurden, warfen sie am folgenden Tag Ladung über Bord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sie machten einen Auswurf«. Das ist eine nautische Wendung für das Überbordwerfen von Ladung, um das Schiff zu erleichtern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: heftig
  rationale: Das Adverb verstärkt die Gewalt des Sturms; »heftig« ist im Deutschen natürlich und gibt die gefährliche Intensität wieder.
- source_word: χειμαζομένων
  choice: vom Sturm hin und her geworfen wurden
  rationale: Das passive Partizip bezeichnet, dass man einem Sturm ausgesetzt und von ihm bedrängt wird. Die Formulierung bewahrt den passiven Sinn und macht die Wirkung des Sturms anschaulich.
- source_word: τῇ ἑξῆς
  choice: am nächsten Tag
  rationale: Natürliche Wiedergabe der festen Zeitangabe für den folgenden Tag.
- source_word: ἐκβολὴν ἐποιοῦντο
  choice: warfen sie Ladung über Bord
  rationale: Die griechische nautische Wendung bezeichnet das Auswerfen von Gegenständen zur Erleichterung des Schiffes. »Ladung« ist im Kontext sachgerecht ergänzt; der Imperfekt schildert die einsetzende beziehungsweise andauernde Handlung, ohne dass »begannen« ausdrücklich im Griechischen steht.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die nautische Handlung wird idiomatisch wiedergegeben; die im Griechischen nicht ausdrücklich genannte Ladung wird durch eine Fußnote kenntlich gemacht.
