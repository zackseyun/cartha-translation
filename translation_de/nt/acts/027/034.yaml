source:
  edition: SBLGNT
  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: de
  text: Darum bitte ich euch eindringlich, etwas zu essen, denn das dient eurer Rettung[a]. Keinem von euch wird nämlich auch nur ein Haar vom Kopf verloren gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eurem Überleben“. Das griechische Wort kann „Rettung“, „Heil“, „Bewahrung“ oder „Überleben“ bedeuten; hier geht es im Zusammenhang um die körperliche Rettung aus der Lebensgefahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Lage und klingt im modernen Deutschen natürlich.
- source_word: παρακαλῶ
  choice: bitte ich euch eindringlich
  rationale: Gibt den nachdrücklichen, zugleich ermutigenden Appell des Paulus wieder, ohne unnötig förmlich zu wirken.
- source_word: μεταλαβεῖν τροφῆς
  choice: etwas zu essen
  rationale: Gibt die idiomatische Bedeutung ‚Nahrung zu sich nehmen‘ klar und natürlich wieder.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: denn das dient eurer Rettung
  rationale: Die Formulierung gibt Nutzen und Ziel der Nahrungsaufnahme wieder. ‚Rettung‘ bewahrt die Bedeutungsbreite von σωτηρία, während der Kontext auf das körperliche Überleben weist.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: Keinem von euch wird nämlich
  rationale: Bewahrt die verteilende Aussage und verbindet die Begründung idiomatisch mit dem vorherigen Satz.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: auch nur ein Haar vom Kopf
  rationale: Die geläufige deutsche Wendung drückt die emphatische Zusicherung völliger Unversehrtheit aus und berücksichtigt ἀπό mit ‚vom‘.
- source_word: ἀπολεῖται
  choice: verloren gehen
  rationale: Passt im Deutschen natürlich zum Bild eines Haares und gibt hier die intransitive Bedeutung von ἀπόλλυμι wieder.
theological_decisions:
- issue: Bedeutung von σωτηρία im Kontext
  choice: Rettung mit kontextuellem Bezug auf körperliches Überleben
  alternative: Heil; Bewahrung; Überleben
  rationale: Die unmittelbare Situation ist die Lebensgefahr auf See. ‚Rettung‘ erhält jedoch mehr von der Bedeutungsbreite des griechischen Wortes als eine vollständige Auflösung zu ‚Überleben‘; die Fußnote erläutert den konkreten Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Zusicherung mit dem Haar bleibt anschaulich erhalten; ‚Rettung‘ wahrt die lexikalische Spannung, während die Fußnote den situativen Sinn erklärt.
