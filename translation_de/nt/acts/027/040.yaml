  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: de
  text: Nachdem sie die Anker gelöst hatten, ließen sie sie im Meer zurück. Zugleich lösten sie die Haltetaue der Steuerruder und hissten das Vorsegel[a] in den Wind; so hielten sie auf den Strand zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Bugsegel“ oder „das Toppsegel“; möglicherweise ist eine andere Segelart gemeint. Die genaue Bedeutung des seltenen griechischen nautischen Ausdrucks ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: kappten
  rationale: Das Partizip bezeichnet eine vorausgehende Handlung. Zusammen mit dem Zurücklassen der Anker im Meer ist gemeint, dass man sie vom Schiff löste; „kappten“ gibt die endgültige Aufgabe der Anker natürlich und prägnant wieder.
- source_word: τὰς ἀγκύρας
  choice: die Anker
  rationale: Direkte Wiedergabe des nautischen Substantivs im Akkusativ Plural.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: ließen sie im Meer zurück
  rationale: ἐάω bedeutet hier „gehen lassen/zurücklassen“; der Bezug auf die zuvor genannten Anker bleibt im Deutschen eindeutig.
- source_word: ἅμα ἀνέντες
  choice: Zugleich lösten sie
  rationale: ἅμα kennzeichnet die Gleichzeitigkeit, während ἀνίημι hier das Lösen zuvor befestigter Taue bezeichnet.
- source_word: τὰς ζευκτηρίας τῶν πηδαλίων
  choice: die Haltetaue der Steuerruder
  rationale: ζευκτηρίαι ist ein seltenes nautisches Wort für Verbindungen oder Befestigungen. „Haltetaue“ ist verständlich und passt dazu, dass die paarigen Steuerruder für den Sturm festgebunden gewesen waren.
- source_word: ἐπάραντες
  choice: hissten
  rationale: Im Zusammenhang mit einem Segel ist „hissen“ die natürliche deutsche Wiedergabe von „emporheben“.
- source_word: τὸν ἀρτέμωνα
  choice: das Vorsegel
  rationale: Der seltene nautische Fachausdruck bezeichnet wahrscheinlich ein vorn am Schiff gesetztes Segel; die genaue Segelart bleibt jedoch unsicher und wird in einer Fußnote kenntlich gemacht.
- source_word: τῇ πνεούσῃ
  choice: in den Wind
  rationale: Das substantivierte feminine Partizip bezeichnet sinngemäß den wehenden Wind. „In den Wind“ ist im Deutschen eine natürliche Verbindung mit dem Hissen beziehungsweise Setzen eines Segels.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: so hielten sie auf den Strand zu
  rationale: κατέχω hat hier den nautischen Sinn, Kurs auf ein Ziel zu halten; αἰγιαλός bezeichnet den Strand beziehungsweise Uferstreifen.
