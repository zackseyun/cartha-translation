id: ACT.27.20
reference: Acts 27:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: de
  text: Da viele Tage lang weder Sonne noch Sterne zu sehen waren und ein heftiger Sturm auf uns lastete, schwand von da an jede Hoffnung, dass wir gerettet würden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass wir heil davonkämen“. Das griechische Verb kann „retten“ oder „bewahren“ bedeuten; hier geht es um die körperliche Rettung aus dem Sturm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: zu sehen waren
  rationale: Die Form bezeichnet hier das Sichtbarwerden beziehungsweise Scheinen der Himmelskörper; im Zusammenhang der Navigation ist „zu sehen waren“ natürlich und präzise.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: viele Tage lang
  rationale: Die Wendung drückt eine längere Zeitspanne aus und wird im Deutschen idiomatisch mit „viele Tage lang“ wiedergegeben.
- source_word: χειμῶνός
  choice: Sturm
  rationale: Im maritimen Kontext bezeichnet das Wort stürmisches Wetter, nicht die Jahreszeit Winter.
- source_word: οὐκ ὀλίγου
  choice: heftig
  rationale: Die griechische Litotes bedeutet wörtlich „nicht gering“. „Heftig“ gibt ihre verstärkende Wirkung in natürlichem modernem Deutsch wieder.
- source_word: ἐπικειμένου
  choice: auf uns lastete
  rationale: Das Partizip vermittelt anhaltenden, bedrängenden Druck; „auf uns lastete“ bewahrt dieses Bild.
- source_word: λοιπὸν
  choice: schließlich
  rationale: Das Adverb markiert den nun eingetretenen Endzustand nach der anhaltenden Bedrängnis.
- source_word: περιῃρεῖτο
  choice: schwand
  rationale: Der Imperfekt beschreibt einen fortschreitenden Verlust. „Schwand“ gibt diesen Vorgang knapp und idiomatisch wieder.
- source_word: ἐλπὶς πᾶσα
  choice: jede Hoffnung
  rationale: Die Wendung bringt die vollständige Hoffnungslosigkeit zum Ausdruck.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: dass wir gerettet würden
  rationale: Der substantivierte Infinitiv bezeichnet den Inhalt der Hoffnung. Die Formulierung ist natürlich und wahrt die semantische Breite von σῴζω.
theological_decisions:
- issue: Bedeutung von σῴζεσθαι im Bericht über die Seereise
  choice: körperliche Rettung vor Tod beziehungsweise Schiffbruch, im Text mit „gerettet würden“ wiedergegeben
  alternative: dass wir heil davonkämen
  rationale: Der unmittelbare Zusammenhang handelt vom Überleben auf See, nicht von geistlicher Erlösung. „Gerettet“ wahrt dennoch die lexikalische Breite des Verbs, während der Kontext seine konkrete Bedeutung klärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzfluss ist gegenüber der griechischen Partizipialstruktur natürlich gegliedert; die fortschreitende Hoffnungslosigkeit des Imperfekts wird durch „schwand“ ausgedrückt.
