source:
  edition: SBLGNT
  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: de
  text: 'Bis es Tag werden sollte, forderte Paulus alle immer wieder auf, etwas zu essen, und sagte: »Heute ist der vierzehnte Tag, seit ihr wartend[a] ohne Essen ausharrt und nichts zu euch genommen habt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in banger Erwartung«. Das griechische Partizip kann Erwartung oder Warten bezeichnen; im Zusammenhang mit dem Sturm kann auch eine angespannte, bange Erwartung gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: Als es allmählich Tag werden sollte
  rationale: Die Wendung bezeichnet die Zeit unmittelbar vor Tagesanbruch. Die deutsche Formulierung gibt den zeitlichen Verlauf und das bevorstehende Tageslicht natürlich wieder, ohne den griechischen Ausdruck unidiomatisch nachzubilden.
- source_word: παρεκάλει
  choice: drängte ... immer wieder
  rationale: Der Imperfekt bezeichnet ein anhaltendes oder wiederholtes Zureden; „drängte ... immer wieder“ bewahrt diese durative Kraft.
- source_word: ἅπαντας
  choice: alle
  rationale: Gemeint sind ausnahmslos alle an Bord; „alle“ ist umfassend und im Deutschen natürlich.
- source_word: μεταλαβεῖν τροφῆς
  choice: etwas zu essen
  rationale: Die Verbindung bedeutet, Nahrung zu sich zu nehmen. „Etwas zu essen“ gibt den partitivischen Sinn klar und idiomatisch wieder.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Heute ist schon der vierzehnte Tag
  rationale: Dies erhält die Hervorhebung des gegenwärtigen vierzehnten Tages; „schon“ verdeutlicht im Deutschen die inzwischen verstrichene Dauer.
- source_word: προσδοκῶντες
  choice: in banger Erwartung
  rationale: Das Partizip bezeichnet Erwartung oder Warten. Im Kontext des Sturms liegt eine angespannte Erwartung nahe; „bang“ macht diese Kontextnuance kenntlich, ohne sie als einzig mögliche lexikalische Bedeutung auszugeben.
- source_word: ἄσιτοι διατελεῖτε
  choice: ohne Essen ausharrt
  rationale: ἄσιτοι bezeichnet den Zustand, nichts gegessen zu haben, nicht notwendig religiöses Fasten; διατελεῖτε betont das fortgesetzte Verharren in diesem Zustand.
- source_word: μηθὲν προσλαβόμενοι
  choice: nichts zu euch nehmt
  rationale: Die Formulierung bewahrt die ergänzende Aussage, dass sie nichts aufgenommen beziehungsweise gegessen haben, und vermeidet eine übermäßig wörtliche, schwerfällige Konstruktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortdauernde Handlung des Imperfekts wird durch „immer wieder“ ausgedrückt. „Fasten“ wurde vermieden, da es freiwilligen religiösen Verzicht nahelegen könnte. Die mögliche emotionale Nuance von προσδοκῶντες wird im Text kontextgerecht wiedergegeben und durch eine Fußnote als nicht zwingende Alternative transparent gemacht.
