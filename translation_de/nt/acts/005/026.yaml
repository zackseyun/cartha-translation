revisions:
- from: Da ging der Hauptmann des Tempels mit den Wachen hin und holte sie, jedoch ohne Gewalt anzuwenden; denn sie fürchteten sich davor, vom Volk gesteinigt zu werden.
  to: Da ging der Tempelhauptmann mit den Wachen hin und führte sie herbei, jedoch ohne Gewalt anzuwenden; denn sie fürchteten, vom Volk gesteinigt zu werden.
  rationale: Die Revision ersetzt die weniger idiomatische Amtsbezeichnung durch „Tempelhauptmann“, gibt ἤγαγεν mit „führte sie herbei“ genauer wieder und glättet die deutsche Furchtkonstruktion. Die Mehrdeutigkeit, wer genau gesteinigt werden könnte, bleibt wie im griechischen Passiv unaufgelöst.
