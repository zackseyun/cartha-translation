  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: de
  text: Da ging der Tempelhauptmann mit den Wachen hin und führte sie herbei, jedoch ohne Gewalt anzuwenden; denn sie fürchteten, vom Volk gesteinigt zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατηγὸς
  choice: Hauptmann des Tempels
  rationale: Der Ausdruck bezeichnet hier den für Ordnung und Sicherheit im Tempel zuständigen Amtsträger, nicht einen römischen Feldherrn. Die ausdrückliche Ergänzung „des Tempels“ macht die Funktion im Deutschen klar.
- source_word: ὑπηρέταις
  choice: Wachen
  rationale: Gemeint sind die untergeordneten Kräfte, die den Tempelhauptmann bei der Festnahme beziehungsweise Vorführung begleiten. „Wachen“ ist im Kontext klarer als das allgemeinere „Diener“.
- source_word: τότε ἀπελθὼν
  choice: Da ging ... hin
  rationale: Das Partizip schildert zusammen mit dem Hauptverb die Abfolge der Handlung. Die finite deutsche Form gibt diese natürlich wieder.
- source_word: ἤγαγεν αὐτούς
  choice: holte sie
  rationale: ἄγω kann „führen“ oder „bringen“ bedeuten. Im Zusammenhang gingen der Hauptmann und die Wachen zu den Aposteln und führten sie zum Hohen Rat; „holte sie“ gibt dies natürlich wieder, ohne ein im Vers nicht ausdrücklich genanntes Ziel hinzuzufügen.
- source_word: οὐ μετὰ βίας
  choice: jedoch ohne Gewalt anzuwenden
  rationale: Die Wendung beschreibt die Art des Vorgehens und verneint gewaltsamen Zwang. Die deutsche Formulierung ist eindeutig und idiomatisch.
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: denn sie fürchteten sich davor, vom Volk ...
  rationale: Der Grund für den Gewaltverzicht ist die Furcht vor der Reaktion des Volkes. Die Formulierung verbindet das Objekt der Furcht natürlich mit dem folgenden befürchteten Geschehen.
- source_word: μὴ λιθασθῶσιν
  choice: gesteinigt zu werden
  rationale: μή mit dem Konjunktiv nach einem Verb des Fürchtens bezeichnet das befürchtete Ergebnis. Das Passiv und die Todesart bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Amtsbezug von στρατηγός wird im Haupttext ausdrücklich gemacht, sodass keine Fußnote nötig ist. Der Satz bewahrt die kausale Beziehung und benennt weder zusätzliche Akteure noch ein im griechischen Text unausgesprochenes Ziel.
