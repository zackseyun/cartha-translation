review_pass:
  verdict: revise
  source_fidelity: 'Der Sinn des griechischen Textes wird weitgehend getroffen: Der Tempelhauptmann geht mit seinen untergeordneten Kräften, führt die Apostel ohne Gewaltanwendung herbei, weil sie eine Steinigung durch das Volk fürchten. „Holte sie“ ist jedoch weniger präzise als ἤγαγεν, das hier das Herbeiführen bzw. Führen bezeichnet.'
  naturalness: Der Satz ist verständlich und modern, doch „sie fürchteten sich davor, vom Volk gesteinigt zu werden“ ist mit dem vorausweisenden „davor“ unnötig umständlich. „Denn sie fürchteten, vom Volk gesteinigt zu werden“ ist idiomatischer und bewahrt die im Griechischen offene Benennung der bedrohten Personen.
  terminology: „Tempelhauptmann“ ist im Deutschen die knappere und etabliertere Bezeichnung für στρατηγός in diesem Kontext. „Wachen“ ist für ὑπηρέταις im Kontext vertretbar. Eine Fußnote ist nicht erforderlich.
  issues:
  - severity: low
    issue: „Hauptmann des Tempels“ ist weniger idiomatisch als „Tempelhauptmann“.
    rationale: Die Zusammensetzung bezeichnet die konkrete Jerusalemer Tempelfunktion klar und vermeidet zugleich die militärische Assoziation eines gewöhnlichen „Hauptmanns“.
  - severity: medium
    issue: „holte sie“ schwächt die Führungs- bzw. Vorführungsnuance von ἤγαγεν ab.
    rationale: ἄγω bezeichnet hier nicht bloß das Abholen, sondern das Herbeiführen der Apostel durch den Hauptmann und seine Begleiter.
  - severity: low
    issue: Die Furchtformulierung mit „davor“ ist stilistisch schwerfällig.
    rationale: Die direkte Infinitivkonstruktion ist natürliches modernes Deutsch und gibt die befürchtete Folge präzise wieder.
  revised_text: Da ging der Tempelhauptmann mit den Wachen hin und führte sie herbei, jedoch ohne Gewalt anzuwenden; denn sie fürchteten, vom Volk gesteinigt zu werden.
