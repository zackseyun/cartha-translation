  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: de
  text: Und wir sind Zeugen dieser Dinge[a] – ebenso der Heilige Geist[b], den Gott denen gegeben hat, die ihm gehorchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieser Worte« beziehungsweise »dieser Aussagen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und der Heilige Geist«; die Aussage »ist Zeuge« ist aus dem vorhergehenden Satzteil mitzudenken.'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: Zeugen
  rationale: Die übliche und natürliche Wiedergabe im Zusammenhang des apostolischen Augenzeugenzeugnisses in der Apostelgeschichte.
- source_word: ῥημάτων
  choice: Ereignisse
  rationale: ῥῆμα kann »Wort«, »Aussage«, »Sache« oder ein Geschehen bezeichnen. Hier verweist der Ausdruck auf die zuvor berichteten Heilstaten; »Ereignisse« ist im Deutschen natürlich, während eine Fußnote die echte Bedeutungsbreite erhält.
- source_word: πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Die etablierte, gegenwärtige deutsche Bezeichnung; der bestimmte Artikel und die attributive Heiligkeitsbezeichnung werden bewahrt.
- source_word: ὃ
  choice: den
  rationale: Das griechische Relativpronomen ist wegen des grammatisch sächlichen πνεῦμα sächlich. Im Deutschen ist »Geist« männlich, daher ist das auf den Heiligen Geist bezogene Relativpronomen grammatisch »den«.
- source_word: ἔδωκεν
  choice: gegeben hat
  rationale: Das deutsche Perfekt gibt den griechischen Aorist idiomatisch wieder und lässt die fortdauernde Relevanz der Gabe im Zusammenhang erkennen, ohne sie ausdrücklich auszudeuten.
- source_word: πειθαρχοῦσιν
  choice: gehorchen
  rationale: πειθαρχέω bezeichnet das Gehorchen gegenüber einer Autorität. »Gehorchen« ist klar und knüpft unmittelbar an Apostelgeschichte 5,29 an.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Pronomen verweist eindeutig auf Gott zurück und bewahrt die pronominale Form des griechischen Textes.
theological_decisions:
- issue: Der Heilige Geist als Mitzeuge neben den Aposteln
  choice: »ebenso der Heilige Geist«; die gemeinsame Aussage »ist Zeuge« wird aus dem ersten Satzteil ergänzt.
  alternative: »und der Heilige Geist [ist Zeuge]«
  rationale: Der zweite, verblose Satzteil übernimmt natürlich das Prädikat des ersten. »Ebenso« macht diese Ellipse im Deutschen verständlich, ohne zusätzliche theologische Inhalte einzuführen.
- issue: Personaler Bezug auf den Heiligen Geist
  choice: 'Das Relativpronomen lautet entsprechend dem deutschen Genus von »Geist«: »den«.'
  alternative: Eine sachliche Form entsprechend dem griechischen Neutrum
  rationale: Das Neutrum der griechischen Form folgt dem grammatischen Genus von πνεῦμα. Die deutsche Grammatik verlangt beim maskulinen »Geist« die Form »den«; daraus wird keine über den Text hinausgehende dogmatische Aussage abgeleitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich verdeutlicht die elliptische Fortführung, ohne den griechischen Satz auszubauen. »Ereignisse« vermeidet das im Deutschen missverständliche »Worte«, während die Fußnote die lexikalische Offenheit dokumentiert.
