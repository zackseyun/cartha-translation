source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: de
  text: Auch die Menge aus den Städten rings um Jerusalem strömte zusammen[a] und brachte Kranke und Menschen, die von unreinen Geistern bedrängt wurden[b]. Sie alle wurden geheilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Auch die Menge aus den Städten rings um Jerusalem kam zusammen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: gequält wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: strömten … zusammen
  rationale: Das Imperfekt bezeichnet ein fortdauerndes oder wiederholtes Zusammenkommen. „Strömten zusammen“ gibt dies im Deutschen natürlich wieder.
- source_word: τὸ πλῆθος
  choice: die Menschen
  rationale: Das kollektive Singularwort bezeichnet eine große Menschenmenge. Zusammen mit „strömten … zusammen“ vermittelt „die Menschen“ diesen Sinn natürlich und ermöglicht die sinngemäße pluralische Weiterführung des griechischen Satzes.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: aus den Städten rings um Jerusalem
  rationale: πέριξ bezeichnet die Ortschaften in der Umgebung Jerusalems. „Städte rings um Jerusalem“ bewahrt den geografischen Bezug ohne die missverständliche Formulierung „Städte Jerusalems“.
- source_word: φέροντες
  choice: Sie brachten
  rationale: Das Partizip beschreibt, was die zusammenströmenden Menschen taten. Ein neuer Hauptsatz ist im modernen Deutschen klar und natürlich.
- source_word: ἀσθενεῖς
  choice: Kranke
  rationale: Im Heilungszusammenhang bezeichnet ἀσθενεῖς körperlich kranke Menschen.
- source_word: ὀχλουμένους
  choice: Menschen, die … bedrängt wurden
  rationale: Das Verb bezeichnet eine belastende oder quälende Einwirkung. „Bedrängt“ wahrt die Aussage, ohne ihre Stärke unnötig festzulegen.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: von unreinen Geistern
  rationale: Die traditionelle und sachlich genaue Wendung bewahrt sowohl den personalen Bezug als auch die Reinheitsvorstellung von ἀκάθαρτος.
- source_word: οἵτινες
  choice: sie alle
  rationale: Das Relativpronomen greift die beiden zuvor genannten Gruppen auf. Die koordinierende Wiedergabe ist im Deutschen flüssiger und lässt den Bezug auf alle Gebrachten erkennen.
- source_word: ἐθεραπεύοντο
  choice: wurden geheilt
  rationale: Die passive Form bleibt erhalten. Im Erzählzusammenhang kann das deutsche Präteritum den fortlaufenden beziehungsweise wiederholten Vorgang natürlich ausdrücken.
- source_word: ἅπαντες
  choice: alle
  rationale: „Alle“ bewahrt die uneingeschränkte Gesamtaussage über die Kranken und Bedrängten, die gebracht wurden.
theological_decisions:
- issue: Wiedergabe von πνευμάτων ἀκαθάρτων
  choice: unreine Geister
  alternative: unreine Mächte
  rationale: Der Ausdruck bezeichnet in Lukas und der Apostelgeschichte personale böse Geister. „Unreine Geister“ bewahrt die biblische Ausdrucksweise, ohne sie psychologisch oder metaphorisch umzudeuten.
- issue: Bezugsbereich von ἅπαντες
  choice: sie alle wurden geheilt
  alternative: alle wurden geheilt
  rationale: Die Stellung macht deutlich, dass die Gesamtheit der zuvor genannten Kranken und von unreinen Geistern Bedrängten gemeint ist, ohne über die Aussage der Szene hinauszugehen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die Aufteilung in zwei Sätze löst die im Griechischen mögliche, im Deutschen aber schwerfällige Verbindung eines kollektiven Singulars mit einem pluralischen Partizip. Die Imperfektformen werden durch den Kontext und „strömten zusammen“ als fortlaufendes beziehungsweise wiederholtes Geschehen erkennbar.
