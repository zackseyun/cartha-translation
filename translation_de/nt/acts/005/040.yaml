id: ACT.5.40
reference: Acts 5:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: de
  text: Sie riefen die Apostel herein, schlugen sie und befahlen ihnen, nicht im Namen Jesu[a] zu sprechen. Dann ließen sie sie frei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über den Namen Jesu“ oder „aufgrund des Namens Jesu“. Die griechische Wendung kann sowohl das Reden über Jesus als auch das Reden in seiner Vollmacht einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: sie riefen … herein
  rationale: Das Aoristpartizip bezeichnet eine der Aufforderung vorausgehende Handlung. Die finite Wiedergabe ist im Deutschen natürlich und macht die Abfolge klar.
- source_word: τοὺς ἀποστόλους
  choice: die Apostel
  rationale: „Apostel“ ist in Apostelgeschichte die etablierte und kontextuell präzise Bezeichnung für die beauftragten Zeugen.
- source_word: δείραντες
  choice: schlugen sie
  rationale: δέρω bezeichnet Schlagen oder Verprügeln. „Schlugen sie“ bewahrt die Breite des Verbs, ohne eine bestimmte Form gerichtlicher Auspeitschung vorauszusetzen.
- source_word: παρήγγειλαν
  choice: befahlen ihnen
  rationale: παραγγέλλω bezeichnet hier eine verbindliche Anordnung. „Befahlen“ gibt deren Nachdruck in klarem, modernem Deutsch wieder.
- source_word: μὴ λαλεῖν
  choice: nicht … zu sprechen
  rationale: μή mit dem Infinitiv gibt den Inhalt des Verbots an. „Zu sprechen“ passt zum öffentlichen und formellen Kontext.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: im Namen Jesu
  rationale: 'Die vertraute Wendung bewahrt die mögliche Bedeutungsspanne: mit Bezug auf Jesus, unter Berufung auf ihn oder in seiner Vollmacht.'
- source_word: ἀπέλυσαν
  choice: ließen sie frei
  rationale: ἀπολύω bezeichnet hier die Freilassung aus Gewahrsam oder Einschränkung. „Ließen sie frei“ ist idiomatisches und sachlich passendes Deutsch.
theological_decisions:
- issue: Wiedergabe der Wendung ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: im Namen Jesu
  alternative: über den Namen Jesu; aufgrund des Namens Jesu
  rationale: Die Wendung kann in der Apostelgeschichte sowohl den Bezug auf Jesus als auch das Auftreten in seiner Vollmacht umfassen. Die Hauptübersetzung erhält diese theologische Bedeutungsbreite, statt sie auf nur einen Aspekt festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die kurzen finiten Verben bilden die rasche Handlungsfolge des griechischen Satzes ab; der letzte Vorgang steht zur besseren Lesbarkeit in einem eigenen Satz.
