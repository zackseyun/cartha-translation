id: ACT.5.21
reference: Acts 5:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: de
  text: Als sie dies hörten, gingen sie bei Tagesanbruch in den Tempelbezirk und lehrten. Als aber der Hohepriester und die, die bei ihm waren, eintrafen, beriefen sie den Hohen Rat und die gesamte Ältestenschaft der Söhne Israels[a] ein und schickten zum Gefängnis, um die Apostel herbeibringen zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »die gesamte Ältestenschaft Israels«. Das genaue Verhältnis dieser Bezeichnung zum »Hohen Rat« ist nicht eindeutig.'
    reason: Die Fußnote bietet eine idiomatischere Wiedergabe von τῶν υἱῶν Ἰσραήλ und bewahrt zugleich die mögliche appositionelle beziehungsweise expansive Beziehung der beiden Ratsbezeichnungen.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Als sie das hörten
  rationale: Das Aoristpartizip bezeichnet hier eine vorausgehende Handlung und verweist auf den Befehl des Engels im vorigen Vers.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: bei Tagesanbruch
  rationale: Die Zeitangabe bezeichnet die frühe Morgendämmerung; die gewählte Formulierung ist präzise und natürlich.
- source_word: εἰς τὸ ἱερὸν
  choice: in den Tempelbezirk
  rationale: ἱερόν bezeichnet den gesamten Tempelkomplex und nicht nur das eigentliche Heiligtum; „Tempelbezirk“ macht diesen Unterschied deutlich.
- source_word: ἐδίδασκον
  choice: lehrten dort
  rationale: Der Imperfekt beschreibt eine andauernde Tätigkeit; im Deutschen ergibt sich der fortlaufende Charakter aus dem Erzählzusammenhang.
- source_word: Παραγενόμενος
  choice: trafen ... ein
  rationale: Das Aoristpartizip führt das Eintreffen des Hohen Priesters als nächstes Ereignis ein.
- source_word: οἱ σὺν αὐτῷ
  choice: seine Begleiter
  rationale: Die knappe Wendung bezeichnet die bei ihm befindliche Gruppe, ohne deren Identität genauer festzulegen.
- source_word: συνεκάλεσαν
  choice: beriefen ... ein
  rationale: Das Verb bezeichnet das Zusammenrufen beziehungsweise Einberufen eines Gremiums.
- source_word: τὸ συνέδριον
  choice: den Hohen Rat
  rationale: Im Kontext bezeichnet συνέδριον das oberste jüdische Ratsgremium; „Hoher Rat“ ist der geläufige deutsche historische Ausdruck.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: die gesamte Ältestenschaft der Söhne Israels
  rationale: γερουσία bezeichnet eine Körperschaft von Ältesten. Die Übersetzung bewahrt sowohl den institutionellen Sinn als auch die ausdrücklich familiär-nationale Formulierung „Söhne Israels“.
- source_word: δεσμωτήριον
  choice: Gefängnis
  rationale: Dies ist die übliche und sachlich passende deutsche Entsprechung für den Ort der Haft.
- source_word: ἀχθῆναι αὐτούς
  choice: um die Apostel holen zu lassen
  rationale: Der passive Infinitiv drückt nach „schickten“ den Zweck aus. „Holen zu lassen“ gibt die indirekte Veranlassung idiomatisch wieder; „die Apostel“ verdeutlicht das im Griechischen nur pronominal bezeichnete Bezugswort aus dem Kontext.
theological_decisions:
- issue: Wiedergabe von τῶν υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  alternative: Israels / der Israeliten
  rationale: Die ausdrücklich männliche, traditionelle Volksbezeichnung wird bewahrt, ohne sie zu einer geschlechtsneutralen Form zu glätten. Eine idiomatischere Wiedergabe wird in der Fußnote genannt.
- issue: Verhältnis von συνέδριον und γερουσία
  choice: Hoher Rat und gesamte Ältestenschaft
  alternative: Hoher Rat, das heißt die gesamte Ältestenschaft
  rationale: Das καί lässt formal eine koordinierende Wiedergabe zu, während das genaue Verhältnis der beiden Bezeichnungen nicht eindeutig ist. Der Haupttext löst die mögliche appositionelle Spannung daher nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tempelbezirk“ unterscheidet den Gesamtkomplex vom eigentlichen Heiligtum. „Hoher Rat“ ist verständlicher und im Deutschen historisch geläufiger als das Fremdwort „Sanhedrin“. „Unterdessen“ markiert den im Text angelegten Szenenwechsel, ohne zusätzliche Sachinformation einzuführen.
