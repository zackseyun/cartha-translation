    issue: »Unterdessen« ist interpretierend.
    rationale: δέ leitet hier den nächsten Handlungsschritt ein, besagt aber nicht zwingend, dass das Eintreffen des Hohepriesters während des Lehrens geschah.
  - severity: low
    issue: »Hohe Priester« sollte als »Hohepriester« geschrieben werden.
    rationale: Die Zusammensetzung ist die im modernen Deutschen übliche historische und bibelsprachliche Bezeichnung für ἀρχιερεύς.
