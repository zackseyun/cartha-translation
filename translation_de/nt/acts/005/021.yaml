revisions:
- from: Als sie das hörten, gingen sie bei Tagesanbruch in den Tempelbezirk und lehrten dort. Unterdessen trafen der Hohe Priester und seine Begleiter ein. Sie beriefen den Hohen Rat und die gesamte Ältestenschaft der Söhne Israels[a] ein und schickten zum Gefängnis, um die Apostel holen zu lassen.
  to: Als sie dies hörten, gingen sie bei Tagesanbruch in den Tempelbezirk und lehrten. Als aber der Hohepriester und die, die bei ihm waren, eintrafen, beriefen sie den Hohen Rat und die gesamte Ältestenschaft der Söhne Israels[a] ein und schickten zum Gefängnis, um die Apostel herbeibringen zu lassen.
  rationale: Die Revision entfernt die nicht ausdrücklich vom griechischen Text geforderte zeitliche Nuance von »Unterdessen«, verwendet die idiomatische Bezeichnung »Hohepriester« und gibt οἱ σὺν αὐτῷ ohne mögliche Einengung als »die, die bei ihm waren« wieder. Die koordinierende, bewusst nicht harmonisierende Wiedergabe von συνέδριον und γερουσία sowie der Fußnotenanker bleiben erhalten.
