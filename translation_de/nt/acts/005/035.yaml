  register: Modernes, würdiges Standarddeutsch. Die förmliche Anrede bleibt erhalten; die Warnung wird idiomatisch formuliert, während die Fußnote die ungewöhnlichere griechische Satzstruktur und den reflexiven Ausdruck sichtbar macht.
