source:
  edition: SBLGNT
  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Ihr Männer Israels, seid vorsichtig[a] mit dem, was ihr mit diesen Männern tun wollt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Gebt auf euch selbst acht im Hinblick auf diese Männer, was ihr zu tun im Begriff seid.“ Das Griechische hebt damit die Selbstvorsicht ausdrücklich hervor.'
    reason: Die Fußnote macht den reflexiven Ausdruck προσέχετε ἑαυτοῖς sowie die bei μέλλετε anklingende Bevorstehendheit sichtbar, ohne die im Deutschen ungewohnte griechische Satzfügung in die Hauptübersetzung zu übernehmen.
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Und er sagte zu ihnen
  rationale: τέ verbindet die Aussage locker mit dem vorhergehenden Erzählverlauf; „und“ gibt diese schlichte Verknüpfung wieder. πρός mit dem Akkusativ bezeichnet bei einem Verb des Sagens die Angesprochenen.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ihr Männer Israels
  rationale: Die förmliche männliche Anrede wird bewahrt. „Ihr Männer Israels“ ist im Deutschen verständlich und gibt sowohl ἄνδρες als auch die Zugehörigkeit zu Israel wieder.
- source_word: προσέχετε ἑαυτοῖς
  choice: überlegt euch gut
  rationale: Die Wendung fordert zu vorsichtiger Selbstprüfung auf. Im Zusammenhang einer bevorstehenden Entscheidung drückt „überlegt euch gut“ die Warnung natürlich aus, ohne die Aussage als bloßes Nachdenken abzuschwächen.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: mit diesen Männern
  rationale: ἐπί mit dem Dativ bezeichnet hier die Personen, auf die sich die gebotene Vorsicht bezieht. „Mit diesen Männern“ bleibt neutraler als das stärker deutende „gegen diese Männer“.
- source_word: τί μέλλετε πράσσειν
  choice: was ihr … tun wollt
  rationale: μέλλω mit Infinitiv weist auf eine bevorstehende oder beabsichtigte Handlung. „tun wollt“ gibt in diesem Entscheidungszusammenhang die Absicht natürlich wieder; πράσσειν wird schlicht mit „tun“ übersetzt.
theological_decisions: []
