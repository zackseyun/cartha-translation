source:
  edition: SBLGNT
  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: de
  text: Der Gott unserer Väter hat Jesus auferweckt[a], den ihr getötet habt, indem ihr ihn ans Holz gehängt habt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: erweckt. Das Verb kann hier die Auferweckung bezeichnen; „von den Toten“ steht in diesem Vers jedoch nicht ausdrücklich im griechischen Text.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: an einen Baum. Das griechische Wort kann „Holz“ oder „Baum“ bedeuten; hier bezieht es sich auf Jesu Kreuzigung. Wahrscheinlich klingt 5. Mose 21,23 an.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Der Gott unserer Väter
  rationale: Die bestimmte Form und die biblische Bundesformel werden bewahrt. „Väter“ entspricht dem ausdrücklich maskulinen πατέρων und erhält den Bezug auf Israels Vorfahren.
- source_word: ἤγειρεν
  choice: hat … auferweckt
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Verb Jesu Auferweckung. Die Formulierung fügt jedoch nicht ausdrücklich „von den Toten“ hinzu; eine Fußnote hält die weitere Bedeutung von ἐγείρω offen.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Die im Deutschen übliche Namensform.
- source_word: διεχειρίσασθε
  choice: getötet habt
  rationale: Das Verb bezeichnet hier gewaltsames Töten. Die direkte Formulierung gibt den Vorwurf klar und ohne beschönigende Umschreibung wieder.
- source_word: κρεμάσαντες
  choice: indem ihr ihn … hängtet
  rationale: Der Aoristpartizipialsatz beschreibt hier die Art beziehungsweise das Mittel der Tötung; „indem“ bildet diesen Zusammenhang natürlich ab.
- source_word: ἐπὶ ξύλου
  choice: ans Holz
  rationale: „Holz“ bewahrt die besondere Wortwahl ξύλον und den wahrscheinlichen Anklang an 5. Mose 21,23. Es bezeichnet hier das Kreuz, ohne den griechischen Ausdruck durch „Kreuz“ zu ersetzen.
theological_decisions:
- issue: Ob ἤγειρεν ausdrücklich als Auferstehung oder allgemeiner als Erwecken verstanden werden soll
  choice: auferweckt
  alternative: erweckt
  rationale: Der Zusammenhang nach Jesu Tötung legt die Auferstehung stark nahe. Da der Vers selbst „von den Toten“ nicht ausdrücklich enthält, wird diese Ergänzung vermieden und die lexikalische Alternative in einer Fußnote genannt.
- issue: Ob ξύλον unmittelbar mit „Kreuz“ wiederzugeben ist
  choice: ans Holz
  alternative: an einen Baum; ans Kreuz
  rationale: Die Wiedergabe „Holz“ erhält die Wortwahl des griechischen Textes und den wahrscheinlichen Bezug auf den Fluchspruch in 5. Mose 21,23. „Kreuz“ wäre kontextuell richtig, aber stärker deutend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung „Gott unserer Väter“ und das biblisch geprägte „ans Holz hängen“ erhalten die intertextuellen Bezüge, während der Satzbau klar und allgemein verständlich bleibt.
