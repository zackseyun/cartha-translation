  text: ἀναστάντες δὲ οἱ νεώτεροι συνέστειλαν αὐτὸν καὶ ἐξενέγκαντες ἔθαψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/006.yaml
  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: de
  text: Da standen die jüngeren Männer[a] auf, wickelten ihn ein, trugen ihn hinaus und begruben ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die jungen Männer“. Das griechische Wort νεώτεροι ist der Form nach ein Komparativ und kann „die jüngeren Männer“, aber auch allgemeiner „die jungen Männer“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: standen ... auf
  rationale: Das Aoristpartizip von ἀνίστημι bezeichnet hier das Aufstehen, um tätig zu werden. Die finite deutsche Form fügt sich natürlich in die Handlungsfolge ein.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung weiter. „Da“ gibt den unmittelbaren zeitlich-narrativen Anschluss im Deutschen idiomatisch wieder.
- source_word: οἱ νεώτεροι
  choice: die jüngeren Männer
  rationale: νεώτεροι ist formal ein Komparativ und kann die jüngeren Männer von älteren Anwesenden unterscheiden. Diese Nuance wird im Haupttext bewahrt; die allgemeinere Bedeutung wird in der Fußnote genannt.
- source_word: συνέστειλαν
  choice: wickelten ihn ein
  rationale: συστέλλω bezeichnet in diesem Zusammenhang wahrscheinlich das Zusammennehmen oder Einwickeln des Leichnams vor dem Hinaustragen und Begraben. „Wickelten ihn ein“ bleibt konkret, ohne eine umfassende Bestattungsvorbereitung hineinzulesen.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bezieht sich auf Hananias und wird direkt wiedergegeben.
- source_word: ἐξενέγκαντες
  choice: trugen ihn hinaus
  rationale: Das Aoristpartizip von ἐκφέρω bezeichnet hier das Hinaustragen des Leichnams. Die finite Form ergibt eine natürliche deutsche Reihung.
- source_word: ἔθαψαν
  choice: begruben ihn
  rationale: θάπτω bedeutet „begraben“. Die schlichte deutsche Entsprechung passt zum nüchternen Erzählstil.
theological_decisions: []
