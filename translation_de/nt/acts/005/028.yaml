source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: de
  text: 'und sagte: „Wir haben euch strengstens befohlen, nicht in diesem Namen zu lehren. Und seht, ihr habt Jerusalem mit eurer Lehre erfüllt und wollt das Blut dieses Mannes über uns bringen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: uns für den Tod dieses Mannes verantwortlich machen. Die bildhafte griechische Wendung spricht davon, sein Blut über uns zu bringen, und bezeichnet damit Blutschuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das Partizip führt die direkte Rede fort und wird im Deutschen im Zusammenhang natürlich als finites Verb wiedergegeben.
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Wir haben euch strengstens befohlen
  rationale: Die Verbindung des Substantivs mit dem stammverwandten Verb verstärkt den Befehl. „Strengstens befohlen“ gibt diese Emphase in natürlichem Deutsch wieder.
- source_word: μὴ διδάσκειν
  choice: nicht … zu lehren
  rationale: Die Formulierung bezeichnet den Inhalt des Verbots, ohne zusätzlich auszulegen, dass eine bereits andauernde Tätigkeit beendet werden sollte.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: in diesem Namen
  rationale: Die Wendung bewahrt die für die Apostelgeschichte wichtige Verbindung von Name, Vollmacht und öffentlichem Auftreten, ohne sie auf „über diesen Namen“ oder „unter Berufung auf diesen Namen“ festzulegen.
- source_word: ἰδοὺ
  choice: Und seht
  rationale: „Seht“ gibt den hinweisenden und vorwurfsvollen Ton in modernem, würdigem Deutsch wieder.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: Ihr habt Jerusalem … erfüllt
  rationale: Das Perfekt bezeichnet eine vollendete Handlung mit fortdauernder Wirkung; zugleich bleibt das Bild des griechischen Textes erhalten.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: mit eurer Lehre
  rationale: Der Genitiv nach „erfüllen“ wird im Deutschen natürlich mit „mit“ wiedergegeben. „Lehre“ bezeichnet sowohl den Inhalt als auch das Lehren.
- source_word: βούλεσθε
  choice: wollt
  rationale: Das Verb drückt hier Absicht beziehungsweise Willen aus. „Wollt“ ist direkt, natürlich und passt zum anklagenden Ton.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: über uns bringen
  rationale: Die Formulierung erhält das räumliche Bild und damit die idiomatische Vorstellung, Schuld oder Haftung auf jemanden zu laden.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: das Blut dieses Menschen
  rationale: Die wörtlich-bildhafte Redeweise bezeichnet Verantwortung für den Tod des Mannes und bewahrt zugleich die distanzierende Bezeichnung „dieser Mensch“.
theological_decisions:
- issue: Bedeutung von „das Blut dieses Menschen über uns bringen“
  choice: Das Bild der Blutschuld bleibt im Haupttext erhalten.
  alternative: „uns für den Tod dieses Menschen verantwortlich machen“
  rationale: Die griechische Wendung meint, jemandem die Verantwortung für einen gewaltsamen Tod beziehungsweise Blutschuld zuzuschreiben. Die bildhafte Formulierung bewahrt die theologische Spannung; die Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, direktem Ton. Die anklagende Schärfe der Rede und die Bildsprache des griechischen Textes bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden.
