  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Aufmerksamkeitsruf „Seht“ bewahrt die Direktheit der Meldung; die Tempelterminologie bleibt knapp und wird durch die Fußnote präzisiert.
