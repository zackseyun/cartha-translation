source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: de
  text: 'Doch da kam jemand und berichtete ihnen: »Seht, die Männer, die ihr ins Gefängnis gebracht habt, stehen im Tempel[a] und lehren das Volk.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Tempelbezirk«. Das griechische ἱερόν bezeichnet die gesamte Tempelanlage und nicht speziell das innere Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος δέ τις
  choice: Doch da kam jemand
  rationale: Die Wendung gibt das Eintreffen eines unbestimmten Boten und zugleich die überraschende Wendung der Erzählung natürlich wieder.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: berichtete ihnen
  rationale: Das Verb bezeichnet die Übermittlung einer Nachricht; „berichtete“ passt zum formellen Umfeld der Amtsträger.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Der Aufmerksamkeitsruf hebt die überraschende Nachricht hervor, ohne altertümlich zu klingen.
- source_word: οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: die Männer, die ihr ins Gefängnis gebracht habt
  rationale: „Ins Gefängnis gebracht“ gibt das wörtliche Setzen beziehungsweise Unterbringen im Gefängnis in natürlichem Deutsch wieder.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den gesamten Tempelbezirk; die knappe traditionelle Wiedergabe bleibt im Text, während die genauere räumliche Bedeutung in der Fußnote erläutert wird.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: stehen … und lehren das Volk
  rationale: Die beiden koordinierten Partizipien werden eng am griechischen Satzbau und zugleich idiomatisch wiedergegeben.
theological_decisions: []
