  source_fidelity: Die Übersetzung gibt die zeitliche Abfolge, das öffentliche Auftreten des Judas, die kausative Gewinnung einer Gefolgschaft, seinen nicht näher bestimmten Untergang sowie die Zerstreuung seiner Überzeugten zuverlässig wieder. „Zog Leute auf seine Seite“ trifft ἀπέστησε … ὀπίσω αὐτοῦ, ohne einen ausdrücklich formulierten Aufstand hinzuzufügen. „Kam um“ bewahrt die Offenheit von ἀπώλετο.
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen sachlich-erzählendem Register. „Trat … auf“, „zog Leute auf seine Seite“ und „wurden zerstreut“ sind idiomatisch. „Sich von ihm überzeugen ließen“ ist eine natürliche und hinreichend genaue Wiedergabe von ἐπείθοντο αὐτῷ.
  terminology: „Judas der Galiläer“ ist die geläufige deutsche Namensform. „Volkszählung“ ist für ἀπογραφή passend; die Fußnote wahrt die mögliche Bedeutung einer amtlichen Registrierung. Die Fußnotenanker stehen an den jeweils einschlägigen Textstellen.
