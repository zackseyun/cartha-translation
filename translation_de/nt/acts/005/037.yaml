id: ACT.5.37
reference: Acts 5:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: de
  text: Danach[a] trat Judas der Galiläer zur Zeit der Volkszählung[b] auf und zog Leute auf seine Seite.[c] Auch er kam um, und alle, die sich von ihm überzeugen ließen, wurden zerstreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Nach diesem“. Die Wendung kann auf die zuvor genannte Person oder auf das zuvor geschilderte Geschehen zurückverweisen.'
    reason: source_ambiguity
  - marker: b
    text: 'Oder: „zur Zeit der amtlichen Registrierung“. Das griechische Wort kann eine Volkszählung oder eine behördliche Erfassung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „brachte Leute dazu, sich ihm anzuschließen“. Das Verb kann ausdrücken, dass Menschen von ihrer bisherigen Bindung abgebracht wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Danach
  rationale: Die Wendung bezeichnet hier eine zeitliche Abfolge. „Danach“ ist im Deutschen natürlich und lässt offen, ob auf die zuvor genannte Person oder auf das geschilderte Ereignis zurückverwiesen wird.
- source_word: ἀνέστη
  choice: trat … auf
  rationale: Im Zusammenhang bezeichnet das Verb das öffentliche Hervortreten eines Anführers, nicht eine Auferstehung. „Trat auf“ gibt diesen Sinn idiomatisch wieder.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Judas der Galiläer
  rationale: Die appositionelle Herkunftsbezeichnung wird eng am Griechischen und in geläufiger deutscher Form wiedergegeben.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: zur Zeit der Volkszählung
  rationale: Die griechische Zeitangabe wird in natürlichem Deutsch wiedergegeben. ἀπογραφή kann eine Volkszählung oder allgemeiner eine amtliche Registrierung bezeichnen.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: zog Leute auf seine Seite
  rationale: Die Formulierung bewahrt den kausativen Sinn des Verbs und deutet den Wechsel der Gefolgschaft an, ohne ausdrücklich einen Aufstand in den Text hineinzulesen.
- source_word: λαὸν
  choice: Leute
  rationale: Das artikellose Kollektiv bezeichnet hier eine unbestimmte Zahl von Menschen, nicht notwendig das ganze Volk.
- source_word: κἀκεῖνος
  choice: Auch er
  rationale: Dies gibt die verbindende und hervorhebende Bedeutung von „und auch jener“ knapp und natürlich wieder.
- source_word: ἀπώλετο
  choice: kam um
  rationale: Die Wendung bezeichnet seinen Tod beziehungsweise Untergang, ohne die vom griechischen Text nicht genannte Todesart festzulegen.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: alle, die sich von ihm überzeugen ließen
  rationale: Die Wiedergabe erhält die Bedeutung von πείθω und unterscheidet sie von der vorangehenden Aussage über seine Gefolgschaft.
- source_word: διεσκορπίσθησαν
  choice: wurden zerstreut
  rationale: Die passive Verbform und das Bild der Auflösung der Gruppe werden direkt wiedergegeben.
theological_decisions:
- issue: Historisch-politische Einordnung der Bewegung des Judas
  choice: Der Vers beschreibt sein Auftreten und das Gewinnen von Anhängern, ohne ihn ausdrücklich als Anführer eines Aufstands zu bezeichnen.
  alternative: „Er führte Leute in den Aufstand“ oder eine ähnlich ausdrücklich politische Formulierung.
  rationale: Obwohl Judas historisch mit einem Aufstand verbunden wird, verwendet dieser Satz keinen ausdrücklichen Ausdruck für Rebellion. Die Übersetzung vermeidet daher eine über den Wortlaut hinausgehende politische Präzisierung.
- issue: Art des Todes von Judas
  choice: „kam um“
  alternative: „wurde getötet“
  rationale: ἀπώλετο sagt aus, dass Judas zugrunde ging beziehungsweise starb, nennt hier aber nicht ausdrücklich die Art oder den Urheber seines Todes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Trat … auf“, „zog Leute auf seine Seite“ und „kam um“ sind natürlich, ohne unnötige Umgangssprachlichkeit oder eine über den Ausgangstext hinausgehende politische beziehungsweise theologische Deutung.
