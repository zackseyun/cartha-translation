id: ACT.5.1
reference: Acts 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: de
  text: Doch ein Mann namens Hananias verkaufte zusammen mit seiner Frau Saphira ein Grundstück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „einen Besitz“ beziehungsweise „Eigentum“. Das griechische Wort kann einen Besitz im weiten Sinn oder ein Stück Grundbesitz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ … τις
  choice: ein Mann
  rationale: Die Verbindung führt eine bislang nicht näher bestimmte männliche Person in die Erzählung ein. Im Deutschen gibt der unbestimmte Artikel dies natürlich wieder; „ein gewisser Mann“ wäre unnötig schwerfällig.
- source_word: δέ
  choice: Doch
  rationale: δέ setzt diesen Bericht in einen milden, aber erkennbaren Gegensatz zum unmittelbar vorausgehenden positiven Beispiel des Barnabas.
- source_word: Ἁνανίας ὀνόματι
  choice: namens Hananias
  rationale: ὀνόματι bildet hier die übliche Wendung zur Namensangabe. „Namens Hananias“ ist knapp und idiomatisch; der Name folgt der etablierten deutschen biblischen Form.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: zusammen mit seiner Frau Saphira
  rationale: σύν bezeichnet Begleitung beziehungsweise gemeinsames Handeln. γυνή ist aufgrund des Possessivbezugs eindeutig als „Frau“ im Sinn von Ehefrau zu verstehen. Die deutsche Namensform „Saphira“ ist etabliert.
- source_word: ἐπώλησεν
  choice: verkaufte
  rationale: Der Aorist von πωλέω bezeichnet im Erzählzusammenhang ein abgeschlossenes Verkaufsgeschehen und wird natürlich mit dem deutschen Präteritum wiedergegeben.
- source_word: κτῆμα
  choice: ein Grundstück
  rationale: κτῆμα kann allgemein einen Besitz oder konkret Grundbesitz bezeichnen. Der Zusammenhang von Apostelgeschichte 4–5 legt unbewegliches Eigentum nahe; „Grundstück“ ist konkret und natürlich, während die breitere Bedeutung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Erzählerischer Gegensatz zum Beispiel des Barnabas
  choice: δέ mit „Doch“ wiedergeben
  alternative: „Nun“ oder „Und“ als schwächeren Übergang verwenden
  rationale: Der unmittelbare Zusammenhang stellt das Handeln von Hananias und Saphira dem vorausgehenden Beispiel des Barnabas gegenüber. „Doch“ bewahrt diese Kontrastwirkung, ohne das folgende Urteil vorwegzunehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung hält Hananias als grammatisches Subjekt deutlich fest und gibt zugleich durch „zusammen mit“ die Beteiligung Saphiras wieder, ohne mehr über ihre jeweilige Rolle auszusagen, als der Vers erkennen lässt.
