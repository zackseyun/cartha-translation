  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: de
  text: Doch der Hohepriester erhob sich. Er und alle, die zu ihm gehörten – nämlich die Partei der Sadduzäer[a] – wurden von Neid[b] erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Sekte“ beziehungsweise „Richtung der Sadduzäer“. Das griechische Wort bezeichnet eine Partei, Schule oder religiöse Gruppierung.
    reason: lexical_alternative
  - marker: b
    text: Oder „Eifersucht“. Das griechische Wort kann auch „Eifer“ bedeuten; hier spricht der Zusammenhang für einen feindseligen Beweggrund.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: erhob sich
  rationale: Das Aoristpartizip von ἀνίστημι leitet hier das entschlossene Handeln des Hohepriesters ein. „Erhob sich“ bewahrt sowohl das Bild als auch die erzählerische Dynamik.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert einen leichten Gegensatz zur zuvor geschilderten positiven Wirkung des apostolischen Wirkens.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohepriester
  rationale: Dies ist die übliche und sachlich genaue deutsche Bezeichnung für das hier im Singular genannte Amt.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: alle, die zu ihm gehörten
  rationale: Die Formulierung bezeichnet die mit dem Hohepriester verbundene Gruppe, ohne den genauen institutionellen Status ihrer Mitglieder festzulegen.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: nämlich die Partei der Sadduzäer
  rationale: Die appositionelle Wendung bestimmt die mit dem Hohepriester verbundene Gruppe näher. „Partei“ bezeichnet hier eine religiöse Richtung innerhalb des damaligen Judentums und vermeidet die spätere dogmatische Bedeutung von „Häresie“.
- source_word: ἐπλήσθησαν
  choice: wurden … erfüllt
  rationale: Die Passivform mit Genitiv wird als die geläufige Wendung „von etwas erfüllt werden“ wiedergegeben.
- source_word: ζήλου
  choice: Eifersucht
  rationale: ζῆλος kann Eifer, Eifersucht oder Neid bezeichnen. Der feindselige Zusammenhang spricht hier für die negative Bedeutung „Eifersucht“.
theological_decisions:
- issue: Wiedergabe von αἵρεσις
  choice: Partei
  alternative: Sekte; Richtung
  rationale: Gemeint ist eine erkennbare religiöse Gruppierung innerhalb des Judentums, nicht zwingend eine als Irrlehre verurteilte Gemeinschaft. „Partei“ bewahrt diesen sozialen und religiösen Sinn ohne spätere kirchengeschichtliche Wertung.
- issue: Wiedergabe von ζῆλος im Kontext
  choice: Eifersucht
  alternative: Neid; Eifer
  rationale: Das Wort ist an sich mehrdeutig und kann auch positiven Eifer bezeichnen. Die anschließende Verfolgung der Apostel verlangt hier jedoch eine negative Deutung; die Fußnote hält die lexikalische Spannweite sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufteilung in zwei Sätze löst die lange griechische Satzstruktur verständlich auf, ohne die handelnden Personen oder den Zusammenhang zwischen ihrem Auftreten und ihrer Eifersucht zu verändern.
