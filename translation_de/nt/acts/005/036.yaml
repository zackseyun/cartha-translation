base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: de
  text: Denn vor einiger Zeit trat Theudas auf und behauptete, er sei jemand von Bedeutung.[a] Ihm schlossen sich etwa vierhundert Männer an.[b] Er wurde getötet, und alle, die sich von ihm hatten überzeugen lassen,[c] wurden zerstreut und kamen zu nichts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „indem er sagte, er sei jemand“. Die griechische Wendung meint, dass er sich als bedeutende Persönlichkeit ausgab.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Etwa vierhundert Männer hielten sich zu ihm“ oder „Etwa vierhundert Männer schlugen sich auf seine Seite“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „alle, die ihm folgten“. Wörtlicher: „alle, die von ihm überzeugt wurden“ oder „alle, die sich von ihm überzeugen ließen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: Denn vor einiger Zeit
  rationale: πρό mit dem Genitiv bezeichnet eine frühere Zeit; γάρ führt die Begründung in Gamaliëls Argument fort. Die natürliche deutsche Wendung gibt den zeitlichen Abstand wieder, ohne ihn genauer festzulegen.
- source_word: ἀνέστη
  choice: trat ... auf
  rationale: Hier bezeichnet ἀνίστημι das öffentliche Hervortreten eines Anführers, nicht eine Auferstehung. „trat auf“ ist im Deutschen klar und idiomatisch.
- source_word: Θευδᾶς
  choice: Theudas
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: behauptete, er sei jemand von Bedeutung
  rationale: Die idiomatische Verbindung τινα ἑαυτόν drückt den Anspruch aus, eine bedeutende Persönlichkeit zu sein. Die Formulierung macht diesen Sinn verständlich, ohne eine konkrete Rolle oder Würde hinzuzufügen.
- source_word: ᾧ προσεκλίθη
  choice: Ihm schlossen sich ... an
  rationale: Das Passiv von προσκλίνω bezeichnet hier das Sich-Anschließen oder Sich-Halten an einen Anführer. Die deutsche Wendung bewahrt diese freiwillige Ausrichtung.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: etwa vierhundert Männer
  rationale: ὡς kennzeichnet eine ungefähre Zahl; ἀνδρῶν bezeichnet in diesem Zusammenhang ausdrücklich Männer. Die kompakte Wiedergabe ist natürlich und vollständig.
- source_word: ὃς ἀνῃρέθη
  choice: Er wurde getötet
  rationale: ἀναιρέω bedeutet hier töten oder beseitigen. Das Passiv und die sachliche Erzählweise bleiben erhalten.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: alle, die sich von ihm hatten überzeugen lassen
  rationale: Die Form von πείθω bezeichnet Menschen, die von Theudas gewonnen oder überzeugt worden waren. Die Übersetzung erhält diese Nuance deutlicher als das allgemeinere „folgten“.
- source_word: διελύθησαν
  choice: wurden zerstreut
  rationale: διαλύω beschreibt die Auflösung und Zerstreuung der Anhängerschaft. Das Passiv wird beibehalten.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: ihre Bewegung verlief im Nichts
  rationale: Die Wendung bedeutet, dass das Unternehmen scheiterte und wirkungslos wurde. Das ergänzte „ihre Bewegung“ macht im Deutschen den sachlichen Bezug verständlich, ohne den Ausgang inhaltlich zu verändern.
theological_decisions:
- issue: Historische Angabe über Theudas innerhalb von Gamaliëls Rede
  choice: Die Aussage wird ohne historische Harmonisierung als Bestandteil von Gamaliëls Argument wiedergegeben.
  alternative: Die Formulierung mit Unsicherheitsmerkmalen versehen oder an außerbiblische historische Rekonstruktionen angleichen.
  rationale: Der griechische Text berichtet das Beispiel in Gamaliëls Rede ohne ausdrückliche Einschränkung. Die Übersetzung soll weder Zweifel noch eine Harmonisierung in den Text hineintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wahrt Gamaliëls nüchterne Argumentation. „trat auf“ vermeidet ein im Deutschen missverständliches „stand auf“; die Fußnoten bewahren die idiomatischen und lexikalischen Alternativen.
