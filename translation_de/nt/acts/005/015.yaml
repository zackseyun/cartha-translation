source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: de
  text: Das führte dazu, dass man die Kranken sogar auf die Straßen hinaustrug und sie auf Liegen und Matten[a] legte, damit, wenn Petrus vorbeikam, auch nur sein Schatten auf einen von ihnen fallen könnte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Betten und Lagerstätten“. Das Griechische unterscheidet zwei Arten von Liege- oder Schlafunterlagen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Vers beschreibt die Absicht der Menschen: Sie legten die Kranken so hin, damit auch nur der Schatten des Petrus auf einen von ihnen fallen könnte. Er sagt an dieser Stelle nicht ausdrücklich, dass der Schatten selbst heilte.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Das führte dazu, dass
  rationale: Gibt die konsekutive Bedeutung wieder und knüpft den Vers als Folge an den vorausgehenden Zusammenhang an.
- source_word: καὶ εἰς τὰς πλατείας
  choice: sogar auf die Straßen
  rationale: Das emphatische καί wird mit „sogar“ ausgedrückt; πλατεῖαι bezeichnet hier breite Straßen oder öffentliche Freiflächen.
- source_word: ἐκφέρειν
  choice: hinaustrug
  rationale: Bezeichnet das körperliche Hinausbringen der Kranken aus den Häusern in den öffentlichen Raum.
- source_word: τοὺς ἀσθενεῖς
  choice: die Kranken
  rationale: Im Heilungskontext bezeichnet ἀσθενεῖς kranke oder gebrechliche Menschen.
- source_word: τιθέναι
  choice: legte
  rationale: Natürliche Wiedergabe für das Platzieren kranker Menschen auf Unterlagen.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: auf Liegen und Matten
  rationale: Bewahrt die Unterscheidung zwischen zwei Arten von tragbaren Liege- oder Schlafunterlagen in verständlichem Deutsch.
- source_word: ἵνα
  choice: damit
  rationale: Drückt den beabsichtigten Zweck aus, ohne dessen Erfüllung bereits zu behaupten.
- source_word: ἐρχομένου Πέτρου
  choice: wenn Petrus vorbeikam
  rationale: Der Genitivus absolutus beschreibt Petrus beim Vorübergehen; die deutsche Form passt zu dem wiederholt erwarteten Vorgang.
- source_word: κἂν
  choice: wenigstens
  rationale: 'Kennzeichnet die erhoffte minimale Berührung: Zumindest der Schatten sollte einen Kranken erreichen.'
- source_word: ἡ σκιά
  choice: sein Schatten
  rationale: Wörtliche Bezeichnung für den Schatten des zuvor genannten Petrus.
- source_word: ἐπισκιάσῃ
  choice: auf ... fiel
  rationale: Natürliches modernes Deutsch für das Fallen eines Schattens auf jemanden; die Möglichkeits- und Zwecknuance bleibt durch „damit“ erhalten.
- source_word: τινὶ αὐτῶν
  choice: auf einen von ihnen
  rationale: Gibt den indefiniten Singular innerhalb der genannten Gruppe genauer wieder als das pluralische „einige“.
theological_decisions:
- issue: Ob der Vers dem Schatten des Petrus selbst heilende Kraft zuschreibt
  choice: Die Formulierung berichtet nur die Absicht beziehungsweise Hoffnung der Menschen.
  alternative: Eine Wiedergabe, die ausdrücklich behauptet, der Schatten habe die Kranken geheilt.
  rationale: ἵνα mit dem Konjunktiv beschreibt hier den Zweck ihres Handelns. Der Vers sagt nicht ausdrücklich, dass der Schatten selbst eine Heilung bewirkte.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur wahrt sowohl den Folgezusammenhang von ὥστε als auch die mit ἵνα ausgedrückte Absicht. „Auf einen von ihnen“ bewahrt den indefiniten Singular von τινὶ genauer.
