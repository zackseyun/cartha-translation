  naturalness: Der Satz ist im modernen Standarddeutsch gut verständlich. Mit „damit, wenn Petrus vorbeikam, auch nur sein Schatten … fallen könnte“ wird die Zweck- und Möglichkeitsstruktur idiomatisch und klar. Die Formulierung vermeidet weiterhin die Behauptung, der Schatten habe tatsächlich geheilt.
