source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: de
  text: Nach etwa drei Stunden kam seine Frau herein, ohne zu wissen, was geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Nach
  rationale: Die idiomatische Erzählformel mit dem milden Anschluss δέ leitet den nächsten Vorgang ein. Im Deutschen wird ihr Übergangscharakter natürlich durch die vorangestellte Zeitangabe und den fortlaufenden Kontext wiedergegeben; ein zusätzliches „Nun“ ist nicht nötig.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: nach etwa drei Stunden
  rationale: διάστημα bezeichnet eine Zeitspanne; ὡς bei einer Maßangabe signalisiert hier eine ungefähre Dauer. Die knappe deutsche Form ist natürlich und bewahrt die Annäherung.
- source_word: καὶ ἡ γυνὴ αὐτοῦ
  choice: kam auch seine Frau
  rationale: γυνή bezeichnet im Kontext die Ehefrau des Hananias. καί wird mit „auch“ wiedergegeben und bindet ihr Eintreten als nächsten zugehörigen Vorgang in die Erzählung ein.
- source_word: μὴ εἰδυῖα
  choice: ohne zu wissen
  rationale: Das Partizip beschreibt ihren Wissensstand beim Eintreten. Die deutsche Infinitivkonstruktion gibt diesen begleitenden Umstand idiomatisch wieder.
- source_word: τὸ γεγονὸς
  choice: was geschehen war
  rationale: Das substantivierte Perfektpartizip verweist auf das bereits eingetretene Geschehen. Das Plusquamperfekt macht die Vorzeitigkeit im Deutschen deutlich.
- source_word: εἰσῆλθεν
  choice: kam … herein
  rationale: Das Verb bezeichnet das Hineingehen beziehungsweise Eintreten. „kam herein“ passt natürlich zur erzählten Szene und wahrt die Bewegung in den Raum.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, ungekünsteltem Erzählton. Keine Fußnote erforderlich, da die für die Übersetzung relevante Annäherung durch „etwa“ unmittelbar ausgedrückt wird.
