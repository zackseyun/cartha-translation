  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: de
  text: 'Und jetzt sage ich euch: Haltet euch von diesen Menschen fern und lasst sie in Ruhe! Denn wenn dieser Plan oder dieses Werk von Menschen stammt[a], wird es zunichtegemacht[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: menschlichen Ursprungs ist; wörtlich: aus Menschen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: wird es zerstört; wird es aufgelöst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: jetzt
  rationale: Die idiomatische Zeitangabe leitet Gamaliëls gegenwärtigen Rat ein; „jetzt“ ist im modernen Deutsch natürlich und gibt die Diskursfunktion knapp wieder.
- source_word: ἀπόστητε
  choice: Haltet euch ... fern
  rationale: Der Aorist-Imperativ fordert hier Abstand und Nichteinmischung. „Haltet euch ... fern“ vermittelt diese praktische Bedeutung verständlich und idiomatisch.
- source_word: ἄφετε αὐτούς
  choice: lasst sie in Ruhe
  rationale: Im Zusammenhang geht es darum, nicht weiter gegen die Männer vorzugehen. Die Wendung gibt den idiomatischen Sinn von ἀφίημι treffend wieder.
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι führt die Begründung für Gamaliëls Rat ein; „denn“ stellt diesen erklärenden Zusammenhang natürlich her.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: wenn ... von Menschen stammt
  rationale: ἐξ bezeichnet Herkunft oder Ursprung. „Von Menschen stammt“ bewahrt den Gegensatz zum göttlichen Ursprung im folgenden Vers und verwendet „Menschen“ im generischen Sinn.
- source_word: βουλή
  choice: Plan
  rationale: βουλή bezeichnet hier einen Plan, eine Absicht oder ein Vorhaben. „Plan“ ist klar und bildet mit „Werk“ ein verständliches Begriffspaar.
- source_word: ἔργον
  choice: Werk
  rationale: ἔργον kann Tat, Tätigkeit, Werk oder Unternehmen bedeuten. „Werk“ wahrt die breite Bedeutung und den traditionellen, zugleich verständlichen Ausdruck.
- source_word: καταλυθήσεται
  choice: wird es zunichtegemacht
  rationale: Die Form ist Futur Passiv und bezeichnet Auflösung, Vernichtung oder das Scheitern eines Unternehmens. Die deutsche Formulierung erhält den passiven Sinn und lässt den Handelnden unausgesprochen.
theological_decisions:
- issue: Herkunftsangabe ἐξ ἀνθρώπων
  choice: von Menschen stammt
  alternative: menschlichen Ursprungs ist
  rationale: Die Formulierung bewahrt den im folgenden Vers ausdrücklich werdenden Gegensatz zwischen menschlichem und göttlichem Ursprung. „Menschen“ gibt den generischen Plural wieder, ohne ihn auf männliche Personen zu verengen.
- issue: Nicht genannter Handelnder bei καταλυθήσεται
  choice: wird es zunichtegemacht
  alternative: wird es scheitern
  rationale: Das Passiv lässt offen, wodurch oder durch wen der Plan beziehungsweise das Werk zunichtegemacht wird. So wird keine ausdrückliche Aussage über unmittelbares göttliches Eingreifen in den Vers hineingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Imperative sind direkt, aber nicht unnötig schroff. Der Doppelbegriff „Plan oder Werk“ sowie das unpersönliche Passiv bleiben erhalten; die Fußnoten markieren echte lexikalische Alternativen.
