reference: Acts 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: de
  text: 'Petrus aber sagte: »Hananias, warum hat der Satan dein Herz erfüllt, sodass du den Heiligen Geist belogen und etwas vom Erlös des Grundstücks für dich zurückbehalten hast?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Näher am griechischen Wortlaut: »… dein Herz dazu gebracht, den Heiligen Geist zu belügen und etwas vom Verkaufspreis des Landstücks für dich zurückzubehalten?«'
    reason: Die Fußnote gibt die Infinitivkonstruktion mit ihrem ausdrücklich genannten Subjekt („dich“) idiomatisch wieder und dokumentiert zugleich die engeren Alternativen „Verkaufspreis“ und „Landstück“.
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Petrus aber sagte
  rationale: δέ markiert hier eine leichte adversative Wendung. Die Nachstellung von »aber« ist im Deutschen natürlich und bewahrt den Kontrast.
- source_word: διὰ τί
  choice: warum
  rationale: Die übliche und idiomatische Wiedergabe der direkten Frage.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: hat der Satan dein Herz erfüllt
  rationale: Die Metapher des griechischen Textes wird bewahrt, ohne sie als vollständige Beherrschung oder unwiderstehlichen Zwang auszudeuten.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: sodass du den Heiligen Geist belogen hast
  rationale: Der resultative beziehungsweise konsekutive Zusammenhang mit »dein Herz erfüllt« wird in natürlichem Deutsch ausgedrückt. Der Personenakkusativ bei ψεύδομαι wird direkt mit »jemanden belügen« wiedergegeben.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: den Heiligen Geist
  rationale: Die übliche gegenwärtige deutsche Bezeichnung; Kasus und bestimmte Form entsprechen der griechischen Konstruktion.
- source_word: νοσφίσασθαι
  choice: etwas … für dich zurückbehalten hast
  rationale: Das Verb bezeichnet ein heimliches Zurückbehalten zum eigenen Nutzen. »Für dich« macht den medialen beziehungsweise eigennützigen Sinn verständlich, ohne Unterschlagung als juristischen Tatbestand einzutragen.
- source_word: ἀπὸ τῆς τιμῆς
  choice: vom Erlös
  rationale: τιμή bezeichnet hier im Zusammenhang des Verkaufs den erzielten Preis beziehungsweise Erlös; ἀπό zeigt an, dass nur ein Teil davon zurückbehalten wurde.
- source_word: τοῦ χωρίου
  choice: des Grundstücks
  rationale: χωρίον kann Grundstück, Landstück oder Feld bedeuten. »Grundstück« passt zum verkauften Besitz und vermeidet eine unnötige Festlegung auf ein landwirtschaftliches Feld.
theological_decisions:
- issue: Wirken Satans und Verantwortung des Hananias
  choice: Die Aussage »hat der Satan dein Herz erfüllt« wird wörtlich-metaphorisch beibehalten.
  alternative: Warum hast du zugelassen, dass Satan von dir Besitz ergreift?
  rationale: Der Text nennt Satan als handelndes Subjekt und spricht Hananias zugleich verantwortlich an. Er erklärt weder dämonische Besessenheit noch hebt er die menschliche Verantwortung auf; diese Spannung bleibt erhalten.
- issue: Lüge gegenüber dem Heiligen Geist
  choice: »den Heiligen Geist belogen«
  alternative: den Heiligen Geist getäuscht / in Gegenwart des Heiligen Geistes gelogen
  rationale: Die direkte personale Beziehung der griechischen Formulierung wird gewahrt, ohne eine zusätzliche dogmatische Erklärung einzufügen.
- issue: Verhältnis der beiden Infinitive zur Herzensfüllung
  choice: Beide Handlungen werden durch »sodass du … und … hast« als zusammengehörige Folge ausgedrückt.
  alternative: um den Heiligen Geist zu belügen und … zurückzubehalten
  rationale: Die Infinitive können Zweck oder Folge bezeichnen. »Sodass« ist im Deutschen im Kontext der bereits vollzogenen Tat natürlich, legt aber keinen göttlichen oder satanischen Zwang nahe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Herz-Metapher bleibt erhalten. »Erlös des Grundstücks« klingt im Verkaufskontext natürlicher als »Preis des Landes«; die engere lexikalische Alternative wird in der Fußnote genannt. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Zitat.
