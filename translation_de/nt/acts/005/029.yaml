  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: de
  text: 'Doch Petrus und die Apostel antworteten: »Man muss Gott mehr gehorchen als Menschen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: antworteten
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine erzählerische Antwortformel. Das natürliche deutsche »antworteten« gibt ihre Funktion wieder, ohne das griechische »antwortend sagten sie« schwerfällig nachzubilden.
- source_word: δὲ
  choice: Doch
  rationale: δέ führt hier eine milde Gegenüberstellung zur vorausgehenden Forderung der Behörden ein. »Doch« wahrt diesen adversativen Übergang.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: Petrus und die Apostel
  rationale: Die geläufigen deutschen Formen bezeichnen Petrus und die anerkannte Gruppe der Apostel.
- source_word: Πειθαρχεῖν
  choice: gehorchen
  rationale: πειθαρχέω bezeichnet den Gehorsam gegenüber einer Autorität. »gehorchen« ist im Deutschen klar und kontextgerecht.
- source_word: δεῖ
  choice: Man muss
  rationale: δεῖ drückt Notwendigkeit beziehungsweise Verpflichtung aus. Der unpersönliche deutsche Ausdruck wahrt die allgemeine Form des griechischen Satzes, schließt die Sprecher aber im Kontext ein.
- source_word: θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet die Person, der Gehorsam gebührt.
- source_word: μᾶλλον ἢ
  choice: mehr ... als
  rationale: Die direkte Vergleichskonstruktion bildet den griechischen Komparativ präzise ab und bewahrt die rhetorische Spannung des Satzes.
- source_word: ἀνθρώποις
  choice: Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, im Kontext besonders menschliche Autoritäten, im Gegensatz zu Gott. Das moderne deutsche »Menschen« ist formgetreu, inklusiv und natürlich.
theological_decisions:
- issue: Verhältnis des Gehorsams gegenüber Gott und menschlichen Autoritäten
  choice: »Gott mehr gehorchen als Menschen«
  alternative: »Gott statt den Menschen gehorchen«
  rationale: Das griechische μᾶλλον ἢ ist wörtlich vergleichend. Die gewählte Fassung bewahrt diese Form und lässt die Spannung bestehen, ohne daraus ausdrücklich eine uneingeschränkte Verwerfung jeder menschlichen Autorität zu machen.
- issue: Reichweite von ἀνθρώποις
  choice: Menschen
  alternative: menschlichen Autoritäten
  rationale: Der unmittelbare Kontext betrifft Autoritäten, doch das griechische Wort selbst bedeutet allgemein »Menschen«. Die Übersetzung belässt die allgemeinere Aussage im Haupttext und vermeidet eine kontextuelle Präzisierung, die den Wortlaut verengen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, einprägsame Gegenüberstellung des griechischen Satzes bleibt erhalten; »Man muss« klingt natürlich und wahrt zugleich die unpersönliche Notwendigkeitskonstruktion.
