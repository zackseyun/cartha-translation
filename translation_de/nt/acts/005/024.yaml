id: ACT.5.24
reference: Acts 5:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: de
  text: Als aber der Befehlshaber der Tempelwache und die führenden Priester diese Worte hörten, waren sie darüber völlig ratlos und fragten sich, was daraus wohl werden würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „was dabei wohl herauskommen würde“. Die griechische Wendung fragt nach dem möglichen Ausgang oder Ergebnis der Lage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als aber
  rationale: Gibt sowohl den zeitlichen Anschluss durch ὡς als auch die leichte narrative Weiterführung beziehungsweise Gegenüberstellung durch δέ natürlich wieder.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: der Befehlshaber der Tempelwache
  rationale: στρατηγός bezeichnet hier den verantwortlichen Kommandanten; die Ergänzung „der Tempelwache“ macht seine Zuständigkeit im modernen Deutsch klarer als das missverständliche „Befehlshaber des Tempels“.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die hohepriesterliche Führungsschicht und nicht mehrere gleichzeitig amtierende Hohepriester. Die Formulierung ist verständlich und historisch angemessen.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Bewahrt die konkrete Ausdrucksweise des Griechischen; gemeint ist die soeben übermittelte Meldung.
- source_word: διηπόρουν
  choice: waren sie völlig ratlos
  rationale: Das Verb bezeichnet starke, anhaltende Unsicherheit. Die deutsche Formulierung gibt auch den durativen Aspekt des Imperfekts angemessen wieder.
- source_word: περὶ αὐτῶν
  choice: darüber
  rationale: 'Lässt den Bezug des Pronomens bewusst offen: Er kann die gehörten Worte oder die darin berichteten Vorgänge umfassen.'
- source_word: τί ἂν γένοιτο τοῦτο
  choice: was daraus wohl werden würde
  rationale: „Wohl“ und der Konjunktiv geben die durch ἄν mit dem Optativ ausgedrückte Unsicherheit über den Ausgang der Lage idiomatisch wieder.
