  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: de
  text: 'Petrus aber sagte zu ihr: „Warum habt ihr euch abgesprochen, den Geist des Herrn auf die Probe zu stellen? Sieh, die Füße derer, die deinen Mann begraben haben, sind an der Tür, und sie werden dich hinaustragen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί ὅτι συνεφωνήθη ὑμῖν
  choice: Warum habt ihr miteinander vereinbart
  rationale: Die griechische Wendung fragt vorwurfsvoll nach dem Grund; das Passiv von συμφωνέω mit ὑμῖν bezeichnet eine gegenseitige Absprache. „Miteinander vereinbart“ wahrt den Sinn der Kollusion, ohne das stärker deutende „verschworen“ einzutragen.
- source_word: πειράσαι
  choice: auf die Probe zu stellen
  rationale: πειράζω kann „versuchen“, „prüfen“ oder „auf die Probe stellen“ bedeuten. Beim Geist des Herrn gibt „auf die Probe stellen“ den herausfordernden, vermessenen Charakter idiomatisch wieder.
- source_word: τὸ πνεῦμα κυρίου
  choice: den Geist des Herrn
  rationale: Die Genitivverbindung wird unmittelbar wiedergegeben und lässt den in Apostelgeschichte 5 naheliegenden Bezug auf den Heiligen Geist bestehen, ohne „heilig“ ergänzend einzutragen.
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf wird modern und zugleich würdevoll wiedergegeben; er bewahrt die Unmittelbarkeit der Ankündigung.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: die Füße derer, die … begraben haben
  rationale: Die anschauliche Metonymie des griechischen Textes bleibt erhalten. „Schritte“ wäre idiomatischer, würde aber das konkrete Bild verändern.
- source_word: τὸν ἄνδρα σου
  choice: deinen Mann
  rationale: ἀνήρ bezeichnet im Zusammenhang Saphiras Ehemann; „deinen Mann“ ist im modernen Deutschen die natürliche Bezeichnung.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: an der Tür
  rationale: Die Formulierung bezeichnet die unmittelbare Anwesenheit am Eingang und entspricht natürlichem Deutsch.
- source_word: ἐξοίσουσίν σε
  choice: sie werden auch dich hinaustragen
  rationale: ἐκφέρω bedeutet hier „hinaustragen“. Das im Deutschen eingefügte „auch“ verdeutlicht die im Zusammenhang offenkundige Parallelität zum Mann, ohne „Leichnam“ ausdrücklich zu ergänzen.
theological_decisions:
- issue: Bezug von „Geist des Herrn“
  choice: Die griechische Formulierung „Geist des Herrn“ wird unverändert in ihrer Beziehungsaussage bewahrt.
  alternative: Ausdrückliche Wiedergabe als „Heiliger Geist“ oder allgemein als geistige Gegenwart des Herrn.
  rationale: Der Zusammenhang mit Apostelgeschichte 5,3 spricht stark für den Heiligen Geist. Dennoch wird die Vorlage nicht interpretierend zu „Heiliger Geist“ erweitert.
- issue: Stärke des Vorwurfs gegen das Ehepaar
  choice: „miteinander vereinbart“
  alternative: „sich miteinander verschworen“
  rationale: Der Zusammenhang zeigt eine schuldhafte gemeinsame Absprache, doch συμφωνέω bezeichnet lexikalisch zunächst das Übereinkommen. Die moralische Schwere ergibt sich aus dem Gegenstand der Absprache.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, direktem Erzählton. Die markante Bildsprache „die Füße derer“ bleibt trotz ihrer leichten Fremdheit erhalten. Es sind keine textkritischen oder lexikalisch notwendigen Fußnoten erforderlich; die im englischen Konsultationstext angegebenen Fußnotenmarker scheinen dort inhaltlich vertauscht und wurden daher nicht übernommen.
