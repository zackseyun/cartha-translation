  to: 'Petrus aber sagte zu ihr: „Warum habt ihr euch abgesprochen, den Geist des Herrn auf die Probe zu stellen? Sieh, die Füße derer, die deinen Mann begraben haben, sind an der Tür, und sie werden dich hinaustragen.“'
