review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Sinn des griechischen Textes insgesamt zuverlässig wieder: Petrus spricht Saphira an, tadelt die gemeinsame Absprache, den Geist des Herrn zu prüfen, und kündigt an, dass dieselben Personen sie hinaustragen werden. Das zusätzliche „auch“ in „auch dich“ ist jedoch im Griechischen nicht ausgedrückt und sollte nicht ergänzt werden.'
  naturalness: „Warum habt ihr miteinander vereinbart“ ist im modernen Standarddeutschen syntaktisch und idiomatisch holprig. „Warum habt ihr euch abgesprochen“ drückt die gegenseitige Vereinbarung natürlich und treffend aus. „Sieh“ ist als markierter direkter Aufmerksamkeitsruf möglich; „Sieh“ wird beibehalten.
  terminology: „Geist des Herrn“, „auf die Probe zu stellen“, „deinen Mann“, „an der Tür“ und „hinaustragen“ sind terminologisch und im Register angemessen. Die konkrete Bildsprache „die Füße derer“ bewahrt die Formulierung der Vorlage. Die englischen Fußnoten sind tatsächlich falsch zugeordnet und bieten keine notwendige Fußnote für den deutschen Text.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe von συνεφωνήθη ὑμῖν
    rationale: „Warum habt ihr miteinander vereinbart“ ist im Deutschen keine natürliche Konstruktion. „Warum habt ihr euch abgesprochen“ gibt die gegenseitige Absprache wieder, ohne das stärker wertende „verschworen“ einzutragen.
  - severity: low
    issue: Ergänzung von „auch“
    rationale: Das griechische ἐξοίσουσίν σε lautet schlicht „sie werden dich hinaustragen“. Die Parallelität mit dem Ehemann ist kontextuell klar, wird aber nicht durch ein ausdrückliches „auch“ markiert.
  revised_text: 'Petrus aber sagte zu ihr: „Warum habt ihr euch abgesprochen, den Geist des Herrn auf die Probe zu stellen? Sieh, die Füße derer, die deinen Mann begraben haben, sind an der Tür, und sie werden dich hinaustragen.“'
