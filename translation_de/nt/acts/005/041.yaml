  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: de
  text: So gingen sie nun vom Rat weg und freuten sich darüber, dass sie für würdig befunden worden waren, um des Namens[a] willen entehrt zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um des Namens Jesu willen«. Im Griechischen steht ehrfürchtig verkürzt nur »der Name«.'
    reason: Die Fußnote macht die kontextuell naheliegende Auflösung kenntlich, ohne den im griechischen Wortlaut nicht ausdrücklich genannten Bezug zu behaupten.
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: gingen … weg
  rationale: Das Imperfekt schildert ihr Fortgehen als Teil des fortlaufenden Geschehens. »Gingen … weg« ist im modernen Deutschen natürlich und vermeidet die punktuellere Wiedergabe »verließen«.
- source_word: χαίροντες
  choice: und freuten sich darüber
  rationale: Das Präsenspartizip bezeichnet die begleitende Haltung beim Fortgehen. Die finite Verbindung ist im Deutschen flüssig; »darüber« nimmt den folgenden ὅτι-Satz natürlich auf.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: vom Rat weg
  rationale: Die Wendung bedeutet wörtlich »vom Angesicht/aus der Gegenwart des Rates«. Die gewählte Fassung gibt das Entfernen aus dessen Gegenwart idiomatisch wieder, ohne die griechische Wendung hölzern nachzubilden.
- source_word: συνεδρίου
  choice: Rat
  rationale: συνέδριον bezeichnet hier das führende jüdische Ratsgremium. »Rat« übersetzt den Gattungsbegriff unmittelbar; »Hoher Rat« wäre als historische Benennung ebenfalls möglich, ist aber expliziter als das griechische Wort selbst.
- source_word: κατηξιώθησαν
  choice: für würdig befunden worden waren
  rationale: Der passive Aorist bezeichnet, dass sie als würdig beurteilt wurden. Das Plusquamperfekt macht im Deutschen deutlich, dass diese Würdigung ihrem freudigen Fortgehen vorausliegt.
- source_word: ὑπὲρ
  choice: um … willen
  rationale: ὑπέρ bezeichnet hier den Grund beziehungsweise Bezug der erlittenen Schmach. »Um … willen« bringt diesen Sinn prägnant und idiomatisch zum Ausdruck.
- source_word: τοῦ ὀνόματος
  choice: des Namens
  rationale: Der griechische Text verwendet absolut »der Name« als ehrfürchtige Kurzbezeichnung. Die Übersetzung bewahrt diese implizite, theologisch gewichtige Ausdrucksweise.
- source_word: ἀτιμασθῆναι
  choice: entehrt zu werden
  rationale: Der passive Infinitiv bezeichnet, dass ihnen Unehre zugefügt wurde. »Entehrt zu werden« bewahrt sowohl das Passiv als auch den antiken Gegensatz von Ehre und Schande.
theological_decisions:
- issue: Absoluter Gebrauch von »der Name«
  choice: »des Namens« im Haupttext beibehalten
  alternative: »um des Namens Jesu willen« oder »um seines Namens willen«
  rationale: τοῦ ὀνόματος nennt den Bezug nicht ausdrücklich. Im Kontext ist Jesus gemeint, doch die ehrfürchtige Verkürzung des Ausgangstextes soll samt ihrer theologischen Spannung erhalten bleiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch »und freuten sich darüber« natürlich deutsch gestaltet.
