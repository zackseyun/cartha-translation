  source_fidelity: Der Haupttext gibt den zeitlichen Sinn von ἀκούσαντες, die heftige feindselige Reaktion von διεπρίοντο und den Tötungsvorsatz (ἐβούλοντο ἀνελεῖν αὐτούς) treffend wieder. Das leichte δέ ist durch den Erzählanschluss hinreichend abgedeckt. Die Fußnote ist jedoch nicht quellentreu, weil »es schnitt ihnen durchs Herz« ein im Griechischen nicht vorhandenes »Herz« ergänzt und daher nicht als wörtliche Alternative gelten kann.
