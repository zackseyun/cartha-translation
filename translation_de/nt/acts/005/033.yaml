  text: Οἱ δὲ ⸀ἀκούσαντες διεπρίοντο καὶ ἐβούλοντο ἀνελεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/033.yaml
  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: de
  text: Als sie das hörten, gerieten sie außer sich vor Wut[a] und wollten sie töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie wurden durchsägt«; das Bild beschreibt eine äußerst heftige, feindselige Erregung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Als sie
  rationale: Das substantivierte οἱ verweist auf die zuvor genannte Ratsversammlung. Die leichte Weiterführung beziehungsweise Wendung durch δέ wird im Deutschen durch den einsetzenden Temporalsatz natürlich ausgedrückt; ein zusätzliches „aber“ wäre möglich, aber nicht nötig.
- source_word: ἀκούσαντες
  choice: sie das hörten
  rationale: Das Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben. „Das“ nimmt den unmittelbar vorausgehenden Inhalt der Rede auf.
- source_word: διεπρίοντο
  choice: gerieten sie außer sich vor Wut
  rationale: Das bildhafte Verb bezeichnet wörtlich ein Durchsägt- oder Durchschnittenwerden, hier jedoch eine heftige, feindselige Erregung. Die Formulierung macht Intensität und Zorn deutlich, ohne die im Deutschen missverständliche Wendung „ins Herz getroffen“ zu verwenden.
- source_word: ἐβούλοντο
  choice: wollten
  rationale: Das Imperfekt bezeichnet ihren anhaltenden Willen beziehungsweise ihre Absicht; „wollten“ ist präzise und natürlich.
- source_word: ἀνελεῖν
  choice: töten
  rationale: ἀναιρέω bedeutet in diesem Zusammenhang, jemanden ums Leben zu bringen. „Töten“ gibt dies direkt und klar wieder.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen bezieht sich auf die Apostel und wird im Deutschen schlicht mit „sie“ wiedergegeben.
theological_decisions:
- issue: Deutung der heftigen Reaktion des Hohen Rates
  choice: als feindselige Wut wiedergegeben
  alternative: „bis ins Innerste getroffen“ beziehungsweise „ins Herz getroffen“
  rationale: Der unmittelbare Tötungswunsch zeigt, dass hier keine reumütige innerliche Überführung gemeint ist. Dennoch bleibt das körperlich-schneidende Bild in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Bildlichkeit des griechischen Verbs wird zugunsten unmittelbarer Verständlichkeit im Haupttext sinngemäß und in der Fußnote formnah wiedergegeben.
