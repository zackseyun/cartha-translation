id: ACT.5.34
reference: Acts 5:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: de
  text: Da stand im Hohen Rat ein Pharisäer namens Gamaliel auf, ein Gesetzeslehrer, der beim ganzen Volk in hohem Ansehen stand. Er ordnete an, die Männer für kurze Zeit hinauszubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς δέ
  choice: Da stand ... auf
  rationale: Das Partizip bezeichnet Gamaliels öffentliches Aufstehen; δέ führt die neue Wendung der Erzählung ein. „Da“ verbindet beides natürlich im Deutschen.
- source_word: ἐν τῷ συνεδρίῳ
  choice: im Hohen Rat
  rationale: συνέδριον bezeichnet hier das jüdische Leitungsgremium. „Hoher Rat“ ist die etablierte, verständliche deutsche Bezeichnung und genauer als das unspezifische „Rat“.
- source_word: Φαρισαῖος ὀνόματι Γαμαλιήλ
  choice: ein Pharisäer namens Gamaliel
  rationale: Natürliche und genaue Wiedergabe der Einführung einer neuen Person.
- source_word: νομοδιδάσκαλος
  choice: ein Gesetzeslehrer
  rationale: Das Kompositum bezeichnet jemanden, der das Gesetz lehrt. „Gesetzeslehrer“ ist prägnant und im biblischen Zusammenhang verständlich.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: der beim ganzen Volk in hohem Ansehen stand
  rationale: τίμιος bezeichnet hier öffentliche Wertschätzung; die Formulierung gibt die Beziehung zum ganzen Volk idiomatisch wieder, ohne „Israel“ hinzuzufügen.
- source_word: ἐκέλευσεν
  choice: Er ordnete an
  rationale: κελεύω drückt in dieser gerichtlichen Situation eine verbindliche, autoritative Anweisung aus.
- source_word: ἔξω βραχὺ ... ποιῆσαι
  choice: für kurze Zeit hinauszubringen
  rationale: Die griechische Wendung bedeutet idiomatisch, die Betreffenden vorübergehend nach draußen bringen zu lassen.
- source_word: τοὺς ἀνθρώπους
  choice: die Männer
  rationale: Gemeint sind in diesem Kontext die männlichen Apostel, die vor dem Rat stehen; „Männer“ bewahrt diese konkrete Referenz.
theological_decisions:
- issue: Geschlechtsspezifische Referenz von τοὺς ἀνθρώπους
  choice: die Männer
  alternative: die Menschen / die Personen
  rationale: Der unmittelbare Kontext identifiziert die Betreffenden als die männlichen Apostel. Eine geschlechtsneutrale Wiedergabe würde die konkrete Referenz abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte Bezeichnung „Hoher Rat“ macht den institutionellen Bezug transparent; Satzbau und Wortwahl bleiben für heutige Leser leicht verständlich.
