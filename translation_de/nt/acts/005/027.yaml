  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγαγόντες δὲ αὐτοὺς ἔστησαν ἐν τῷ συνεδρίῳ. καὶ ἐπηρώτησεν αὐτοὺς ὁ ἀρχιερεὺς
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: de
  text: Nachdem man sie hereingebracht hatte, stellte man sie vor den Hohen Rat[a], und der Hohepriester befragte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor das Synedrium«. Das griechische Wort bezeichnet hier das jüdische Leitungsgremium.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Nachdem man sie hereingebracht hatte
  rationale: Das substantivisch nicht ausdrücklich genannte Subjekt des aoristischen Partizips wird im Deutschen unpersönlich wiedergegeben. Die Vorzeitigkeit gegenüber ἔστησαν wird durch den nachdem-Satz klar ausgedrückt.
- source_word: δὲ
  choice: —
  rationale: δέ führt die Erzählung hier nur leicht weiter. Im natürlichen deutschen Zusammenhang ist kein eigener Konnektor nötig.
- source_word: ἔστησαν
  choice: stellte man sie vor
  rationale: Die transitive Bedeutung von ἵστημι ist hier »hinstellen/aufstellen«. Die Wendung bewahrt die konkrete gerichtliche Szene und klingt im Deutschen natürlich.
- source_word: ἐν τῷ συνεδρίῳ
  choice: vor den Hohen Rat
  rationale: συνέδριον bezeichnet hier das jüdische Leitungsgremium. In Verbindung mit »stellen« gibt »vor« die funktionale Bedeutung der griechischen Ortsangabe idiomatisch wieder; »Hoher Rat« ist die geläufige deutsche Sachbezeichnung.
- source_word: ἐπηρώτησεν
  choice: befragte
  rationale: ἐπερωτάω bedeutet fragen oder befragen. »befragte« entspricht dem förmlichen gerichtlichen Zusammenhang, ohne die Schärfe von »verhörte« vorwegzunehmen.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohe Priester
  rationale: Präzise und im Deutschen übliche Wiedergabe des amtlichen Titels ἀρχιερεύς in diesem Zusammenhang.
theological_decisions:
- issue: Wiedergabe von συνέδριον
  choice: Hoher Rat
  alternative: Synedrium; Rat
  rationale: Gemeint ist das oberste jüdische Ratsgremium. »Hoher Rat« benennt den historischen Referenten für heutige deutsche Leser verständlich, während die Fußnote die stärker formnahe Alternative nennt; daraus wird keine weitergehende Aussage über Zuständigkeit oder Zusammensetzung abgeleitet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die knappe gerichtliche Erzählweise und vermeidet das stärker wertende »verhörte«.
