  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: de
  text: Von den Übrigen wagte es jedoch niemand, sich ihnen anzuschließen; vielmehr hielt das Volk sie in hohem Ansehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: Von den Übrigen jedoch
  rationale: Gibt den partitiven Genitiv und den Kontrast von δέ wieder, ohne die nicht näher bestimmte Bezugsgruppe von λοιποί festzulegen.
- source_word: ἐτόλμα
  choice: wagte es
  rationale: Entspricht der Bedeutung von τολμάω und klingt im modernen Deutsch natürlich.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: sich ihnen anzuschließen
  rationale: Das Verb bezeichnet wörtlich ein enges Sich-Anheften; im Zusammenhang ist der soziale Anschluss gemeint. Die Wiedergabe lässt offen, ob eine formelle Zugehörigkeit vorausgesetzt ist.
- source_word: ἀλλ’
  choice: doch
  rationale: 'Markiert den Gegensatz: Trotz der Scheu vor einem Anschluss begegnete das Volk ihnen mit hoher Wertschätzung.'
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: das Volk schätzte sie hoch
  rationale: Gibt die idiomatische Bedeutung von μεγαλύνω als Hochachtung beziehungsweise hohe Wertschätzung wieder und bewahrt ὁ λαός als „das Volk“.
theological_decisions:
- issue: Identität der „Übrigen“ und des Pronomens „ihnen“
  choice: Die Referenten bleiben wie im griechischen Text unbestimmt.
  alternative: „Die übrigen Außenstehenden“ beziehungsweise ausdrücklich „den Aposteln“ oder „der Gemeinde“
  rationale: Der Vers selbst benennt weder die genaue Gruppe der „Übrigen“ noch den Bezug von „ihnen“ ausdrücklich; eine Präzisierung würde eine Auslegung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt den Gegensatz des griechischen Textes, ohne unnötige Altertümlichkeit oder interpretierende Ergänzungen.
