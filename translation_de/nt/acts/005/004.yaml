id: ACT.5.4
reference: Acts 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: de
  text: Gehörte es nicht dir, solange es unverkauft war? Und stand es nicht auch nach dem Verkauf zu deiner Verfügung? Warum hast du dir diese Sache im Herzen vorgenommen? Du hast nicht Menschen, sondern Gott belogen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: Solange es unverkauft blieb, blieb es …
  rationale: Die Wiedergabe bewahrt die auffällige Wiederholung von μένω und bezeichnet den fortdauernden Zustand vor dem Verkauf.
- source_word: σοὶ
  choice: dein Eigentum
  rationale: Der Dativ bezeichnet hier idiomatisch die Zugehörigkeit; „dein Eigentum“ macht im Deutschen den rechtmäßigen Besitz klar.
- source_word: πραθὲν
  choice: als es verkauft war
  rationale: Ein temporaler Nebensatz gibt das passive Aoristpartizip natürlich und präzise wieder.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: stand … in deiner Verfügungsgewalt
  rationale: ἐξουσία bezeichnet hier das Recht und die Freiheit, über etwas zu bestimmen. „Verfügungsgewalt“ bewahrt diesen rechtmäßigen Entscheidungsspielraum.
- source_word: τί ὅτι
  choice: Warum
  rationale: Die idiomatische Frage hat tadelnden Nachdruck; im heutigen Deutschen trägt „Warum“ diesen Sinn ohne schwerfällige Nachbildung.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: hast du dir … in den Sinn gesetzt
  rationale: Die Wendung bezeichnet einen innerlich gefassten Vorsatz. „Sich etwas in den Sinn setzen“ ist natürlich und bewahrt die Vorstellung einer bewussten inneren Festlegung.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: diese Sache
  rationale: πρᾶγμα bleibt relativ allgemein. „Diese Sache“ lässt den Zusammenhang ihr moralisches Gewicht bestimmen, ohne „Plan“ oder „Betrug“ einzutragen.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Du hast nicht Menschen, sondern Gott belogen
  rationale: ψεύδομαι mit Dativ bedeutet „jemanden belügen“. „Menschen“ gibt ἀνθρώποις geschlechtsübergreifend wieder und erhält den scharfen Gegensatz zu Gott.
theological_decisions:
- issue: Bezug auf Gott im unmittelbaren Zusammenhang mit dem Heiligen Geist in Vers 3
  choice: Die Aussage wird schlicht mit „Gott“ wiedergegeben.
  alternative: „Gott, das heißt den Heiligen Geist“
  rationale: Der Vers selbst sagt τῷ θεῷ. Die Beziehung zum Heiligen Geist ergibt sich aus dem unmittelbaren Kontext und soll nicht durch einen erklärenden Zusatz im Bibeltext festgelegt werden.
- issue: Eigentumsrecht und Entscheidungsfreiheit über Besitz und Verkaufserlös
  choice: „dein Eigentum“ und „in deiner Verfügungsgewalt“
  alternative: Eine schwächere Wiedergabe, die nur faktischen Besitz, aber kein Verfügungsrecht erkennen lässt
  rationale: Petrus setzt voraus, dass Hananias weder zum Verkauf noch zur vollständigen Abgabe des Erlöses gezwungen war. Sein Vergehen war der Betrug, nicht das Behalten von Eigentum an sich.
- issue: Generische Bedeutung von ἀνθρώποις
  choice: Menschen
  alternative: Männer
  rationale: ἀνθρώποις meint hier Menschen allgemein. „Menschen“ ist im modernen Deutschen präzise und erhält den rhetorischen Gegensatz „Menschen … Gott“.
- issue: Unausgesprochenes Subjekt nach πραθέν
  choice: Der Erlös wird im Text genannt und durch eine Fußnote als kontextuell erschlossene Ergänzung ausgewiesen.
  alternative: Das grammatische Subjekt ohne Ergänzung als das verkaufte Grundstück verstehen
  rationale: Sinngemäß geht es nach dem Verkauf um das Geld, über das Hananias verfügen konnte. Da „Erlös“ im Griechischen nicht ausdrücklich steht, wird die Ergänzung transparent markiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen bleiben erhalten. Die Wiederholung von „blieb“ bildet die griechische Wortwiederholung nach; „Verfügungsgewalt“ ist präzise, aber noch allgemein verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der erschlossenen Ergänzung.
