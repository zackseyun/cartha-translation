revisions:
- from: Solange es unverkauft blieb, blieb es da nicht dein Eigentum? Und als es verkauft war, stand der Erlös[a] nicht in deiner Verfügungsgewalt? Warum hast du dir diese Sache in den Sinn gesetzt? Du hast nicht Menschen, sondern Gott belogen.
  to: Gehörte es nicht dir, solange es unverkauft war? Und stand es nicht auch nach dem Verkauf zu deiner Verfügung? Warum hast du dir diese Sache im Herzen vorgenommen? Du hast nicht Menschen, sondern Gott belogen.
  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext genannte Einfügung „der Erlös“ und erhält damit die vom griechischen Satz gelassene Referenzoffenheit. Zugleich werden die Fragen, Hananias' Verfügungsrecht, die Herz-Metaphorik und der scharfe Kontrast „Menschen, sondern Gott“ in natürlichem modernem Standarddeutsch bewahrt.
