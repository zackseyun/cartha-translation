    issue: „der Erlös“ ist im Haupttext ergänzt.
    rationale: Im griechischen Text wird nach πραθέν kein Substantiv wie „Erlös/Geld“ genannt. Der Kontext kann auf den Erlös weisen, aber die Formulierung bewahrt absichtlich einen nicht weiter spezifizierten Bezug. Die Ergänzung sollte daher entfallen, statt lediglich per Fußnote offengelegt zu werden.
  - severity: low
    issue: Die Fußnote bezeichnet die deutsche Formulierung nicht präzise als Übersetzungsentscheidung.
    rationale: 'Die Fußnote erklärt zwar die Ergänzung, doch ihre Formulierung „Wörtlich: stand es nicht in deiner Verfügungsgewalt?“ lässt die im griechischen Satz vorhandene zeitliche und partizipiale Struktur unberücksichtigt. Nach Wegfall der nicht notwendigen Ergänzung ist keine Fußnote erforderlich.'
  revised_text: Gehörte es nicht dir, solange es unverkauft war? Und stand es nicht auch nach dem Verkauf zu deiner Verfügung? Warum hast du dir diese Sache im Herzen vorgenommen? Du hast nicht Menschen, sondern Gott belogen.
