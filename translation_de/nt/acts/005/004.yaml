  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird überwiegend korrekt wiedergegeben: Das Eigentum beziehungsweise das nach dem Verkauf Verfügbare unterlag Hananias'' eigener Verfügungsgewalt, und der Gegensatz lautet Menschen gegenüber Gott. Die ausdrückliche Einfügung „der Erlös“ in den Haupttext geht jedoch über den griechischen Wortlaut hinaus. Das Partizip πραθέν und das anschließende implizite Neutrum lassen den konkreten Bezug im Griechischen unausgesprochen; der Kontext legt zwar den Verkaufserlös nahe, doch sollte diese Konkretisierung nicht in den Bibeltext eingetragen werden.'
  naturalness: „Stand es nicht auch nach dem Verkauf zu deiner Verfügung?“ ist modernes, klares Standarddeutsch und gibt die rhetorische Frage idiomatisch wieder. „Im Herzen vorgenommen“ bewahrt die Bildsprache von ἐν τῇ καρδίᾳ σου und bleibt in würdigem, verständlichem Deutsch natürlich.
  terminology: „Gehörte es nicht dir?“, „zu deiner Verfügung“, „Menschen“ und „Gott“ sind sachgerecht. „Menschen“ gibt ἀνθρώποις geschlechtsübergreifend wieder, ohne den Kontrast zu Gott abzuschwächen. Es ist keine theologische Erläuterung in den Text einzutragen.
  issues:
