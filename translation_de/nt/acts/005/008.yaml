    issue: ἀπεκρίθη ist als „fragte“ wiedergegeben.
    rationale: Das Verb bezeichnet hier Petrus’ Antwort beziehungsweise Erwiderung an Saphira, nicht lediglich das Stellen einer Frage. Die anschließende Frage kann im Deutschen dennoch unverändert bleiben.
  - severity: low
    issue: Die lexikalische Spannweite von χωρίον ist nicht durch einen Fußnotenanker ausgewiesen.
    rationale: „Grundstück“ ist eine gute Kontextwahl, doch χωρίον kann auch „Landbesitz“ oder „Feld“ bezeichnen. Eine knappe Alternative erhöht die Transparenz ohne den Haupttext zu belasten.
