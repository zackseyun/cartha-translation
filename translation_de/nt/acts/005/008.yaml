  text: ἀπεκρίθη δὲ ⸂πρὸς αὐτὴν⸃ ⸀Πέτρος· Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν· Ναί, τοσούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: de
  text: 'Petrus aber antwortete ihr: „Sag mir: Habt ihr das Grundstück[a] für diesen Betrag verkauft?“ Sie aber sagte: „Ja, für diesen Betrag.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Landbesitz“ oder „Feld“ (griechisch χωρίον).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν
  choice: Petrus aber fragte sie
  rationale: Das formelhafte ἀπεκρίθη leitet hier eine Reaktion im Dialog ein; zusammen mit dem folgenden Imperativ und der Frage klingt „fragte sie“ im modernen Deutschen natürlicher als „antwortete ihr“, obwohl Petrus auf die vorausgehende Situation reagiert. δέ wird mit „aber“ als erzählerische Wendung bewahrt.
- source_word: Εἰπέ μοι
  choice: Sag mir
  rationale: Der Aoristimperativ von λέγω mit μοι wird direkt und idiomatisch als „Sag mir“ wiedergegeben.
- source_word: εἰ
  choice: Habt ihr …?
  rationale: εἰ leitet eine indirekte Ja-Nein-Frage ein. Nach „Sag mir“ ist im Deutschen eine direkte Frage natürlich und erhält den Sinn.
- source_word: τοσούτου
  choice: für diesen Betrag
  rationale: Der Ausdruck verweist auf die zuvor genannte Geldsumme. „Für diesen Betrag“ ist klar, modern und wird in Frage und Antwort gleichlautend wiederholt.
- source_word: τὸ χωρίον
  choice: das Grundstück
  rationale: χωρίον bezeichnet hier ein abgegrenztes Stück Land beziehungsweise einen Grundbesitz. „Grundstück“ passt zum Verkaufskontext, ohne genauer als der griechische Ausdruck zu werden.
- source_word: ἀπέδοσθε
  choice: habt ihr … verkauft
  rationale: ἀποδίδωμι kann im geschäftlichen Zusammenhang „verkaufen“ bedeuten. Die Pluralform wird als „ihr“ bewahrt und bezieht Saphira zusammen mit Hananias ein.
- source_word: Ναί
  choice: Ja
  rationale: Schlichte Bejahung der Frage.
theological_decisions: []
