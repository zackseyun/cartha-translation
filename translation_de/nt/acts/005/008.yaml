review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἀπεκρίθη als „fragte“ schwächt die explizite Gesprächsreaktion des griechischen Verbs ab. Da Petrus tatsächlich eine Frage stellt, ist dies verständlich, doch „antwortete ihr“ gibt den Wortlaut genauer wieder. Die Pluralform in „Habt ihr“ bewahrt ἀπέδοσθε. „Grundstück“ ist für χωρίον im Kontext angemessen, sollte aber wegen der möglichen Bedeutungen als Landbesitz/Feld mit einer Fußnote kenntlich gemacht werden.
  naturalness: Der Satz ist ansonsten klar und modernes Standarddeutsch. „Petrus aber antwortete ihr“ ist in erzählender Bibelprosa natürlich genug und source-näher als „fragte sie“. Die direkte Frage nach „Sag mir:“ ist idiomatisch.
  terminology: „Grundstück“ und „für diesen Betrag“ sind sachgerecht. Die Wiederholung von „für diesen Betrag“ bewahrt die nachdrückliche Wiederaufnahme von τοσούτου. Es sind keine theologischen Fachbegriffe betroffen.
