  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: de
  text: Da fiel sie sofort zu seinen Füßen nieder und starb. Als die jungen Männer hereinkamen, fanden sie sie tot. Sie trugen sie hinaus und begruben sie neben ihrem Mann.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: sofort
  rationale: Gibt die unmittelbare zeitliche Folge natürlich und präzise wieder.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: vor seinen Füßen
  rationale: Natürliche deutsche Ortsangabe; der Bezug des Pronomens bleibt wie im Kontext auf Petrus gerichtet.
- source_word: ἐξέψυξεν
  choice: starb
  rationale: Bezeichnet idiomatisch das Aushauchen des Lebens; „starb“ ist im modernen Deutsch klar und entspricht der vom Kontext bestätigten Bedeutung.
- source_word: οἱ νεανίσκοι
  choice: die jungen Männer
  rationale: Direkte, gegenwärtig verständliche Wiedergabe der Bezeichnung.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: neben ihrem Mann
  rationale: πρός bezeichnet hier im Bestattungskontext die räumliche Nähe; „neben“ ist natürlich und eindeutig.
