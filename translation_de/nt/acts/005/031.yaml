id: ACT.5.31
reference: Acts 5:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: de
  text: Diesen hat Gott zu seiner Rechten[a] als Anführer und Retter erhöht, um Israel Umkehr und Vergebung der Sünden zu schenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch seine rechte Hand“. Die griechische Formulierung kann instrumental verstanden werden; wahrscheinlich bezeichnet sie hier jedoch die Erhöhung auf den höchsten Ehrenplatz zur Rechten Gottes.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: Diesen
  rationale: Das vorangestellte Demonstrativpronomen ist betont und verweist ausdrücklich auf Jesus; „Diesen“ bewahrt diese Hervorhebung.
- source_word: ἀρχηγὸν
  choice: Anführer
  rationale: Das Wort bezeichnet jemanden, der an der Spitze steht und führt. „Anführer“ ist modern und verständlich und passt hier zur Verbindung mit „Retter“ sowie zum Kontext der Erhöhung.
- source_word: σωτῆρα
  choice: Retter
  rationale: „Retter“ gibt σωτήρ natürlich wieder und bewahrt sowohl den Gedanken der Rettung als auch das theologische Gewicht der Aussage.
- source_word: ὕψωσεν
  choice: erhöht
  rationale: Gemeint ist Gottes Erhebung Jesu in eine Stellung der Ehre und Vollmacht, nicht lediglich seine Auferweckung.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: zu seiner Rechten
  rationale: Die Formulierung gibt die wahrscheinlich gemeinte Erhöhung an Gottes rechte Seite als Ehren- und Vollmachtsstellung wieder; die grammatisch mögliche instrumentale Deutung wird in der Fußnote bewahrt.
- source_word: τοῦ δοῦναι
  choice: um … zu schenken
  rationale: Der artikulierte Infinitiv bezeichnet hier den Zweck. „Um … zu schenken“ ist natürliches Deutsch und bringt zugleich den Gabecharakter zum Ausdruck.
- source_word: μετάνοιαν
  choice: Umkehr
  rationale: „Umkehr“ bezeichnet hier nicht bloß eine gedankliche Meinungsänderung, sondern die entschiedene Hinwendung zu Gott; es ist in modernem Deutsch klarer als das teils kirchensprachliche „Buße“.
- source_word: τῷ Ἰσραὴλ
  choice: Israel
  rationale: Israel ist der Empfänger dessen, was Gott durch den erhöhten Jesus schenkt.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: Vergebung der Sünden
  rationale: Dies ist die klare und etablierte deutsche Wiedergabe der neutestamentlichen Wendung.
theological_decisions:
- issue: Bedeutung der Erhöhung Jesu zur Rechten Gottes
  choice: Gott erhöhte Jesus in die Ehren- und Vollmachtsstellung zu seiner Rechten.
  alternative: Gott erhöhte Jesus durch seine rechte Hand.
  rationale: Der Kontext und der neutestamentliche Sprachgebrauch der Thronerhöhung sprechen für die örtlich-assoziative Deutung. Da der griechische Dativ auch instrumental verstanden werden kann, bleibt diese Möglichkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die betonte Demonstrativform, der Zweckcharakter des Infinitivs und die Mehrdeutigkeit von τῇ δεξιᾷ αὐτοῦ bleiben erhalten; „Umkehr“ vermeidet sowohl eine bloß mentale Verengung als auch unnötig kirchensprachliche Ausdrucksweise.
