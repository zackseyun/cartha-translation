  source_fidelity: Der Satz gibt Ankunft, erfolglose Suche im bestimmten Gefängnis, Rückkehr und Bericht sachgerecht wieder. Die explizite Wiederaufnahme „die Apostel“ ist aus dem unmittelbaren Kontext eindeutig gedeckt und verhindert die im Deutschen bei „sie“ mögliche Rückbezüglichkeit auf das Subjekt. „Diener“ ist für ὑπηρέται jedoch zu weit und kann im heutigen Deutsch primär persönliche oder häusliche Dienstboten bezeichnen; im Kontext sind amtliche Beauftragte gemeint.
  naturalness: Die Satzfolge ist flüssig und der Doppelpunkt ist richtig, da der Bericht in Vers 23 folgt. „Beamte“ ist hier modernes, natürliches Deutsch und macht die institutionelle Funktion erkennbar, ohne „Tempelwache“ als nicht ausdrücklich im Vers genannte Einengung einzutragen.
