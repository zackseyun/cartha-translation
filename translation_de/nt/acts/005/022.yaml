  yaml_path: translation/nt/acts/005/022.yaml
  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: de
  text: 'Doch als die Beamten eintrafen, fanden sie die Apostel nicht im Gefängnis. Da kehrten sie zurück und berichteten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: eintrafen
  rationale: Das Partizip bezeichnet die Ankunft der Diener am Gefängnis; „eintrafen“ ist im modernen Deutschen natürlich und präzise.
- source_word: ὑπηρέται
  choice: Diener
  rationale: Der Ausdruck bezeichnet hier amtliche Bedienstete der jüdischen Führung. „Diener“ bewahrt die Breite des griechischen Begriffs, ohne die nicht ausdrücklich genannte Zuordnung als Tempelwache in den Text einzutragen.
- source_word: οὐχ εὗρον
  choice: fanden … nicht
  rationale: Dies ist die direkte und idiomatische Wiedergabe im erzählenden Zusammenhang.
- source_word: αὐτούς
  choice: die Apostel
  rationale: Das deutsche Pronomen „sie“ könnte sich unmittelbar auf die Diener beziehen. Die Wiederaufnahme des eindeutigen Bezugs aus dem Kontext verhindert diese Mehrdeutigkeit.
- source_word: ἐν τῇ φυλακῇ
  choice: im Gefängnis
  rationale: Die bestimmte Form bezeichnet das bereits erwähnte Gefängnis; „im Gefängnis“ gibt dies idiomatisch wieder.
- source_word: ἀναστρέψαντες
  choice: kehrten sie zurück
  rationale: Im Kontext bedeutet das Partizip, dass die Diener zu den Auftraggebern zurückgingen.
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Das Verb bezeichnet das Überbringen einer Nachricht beziehungsweise eines amtlichen Berichts.
- source_word: δέ … δέ
  choice: Doch … Da
  rationale: Das erste δέ hebt den Gegensatz zur erwarteten Auffindung hervor; das zweite führt die anschließende Reaktion fort, was im Deutschen natürlich mit „Da“ ausgedrückt wird.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die amtliche Funktion der ὑπηρέται bleibt erkennbar, wird aber nicht enger als der griechische Text mit „Tempelwache“ bestimmt. Der Doppelpunkt hält den Satz für den in Vers 23 folgenden Bericht offen.
