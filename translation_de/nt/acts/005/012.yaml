source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: de
  text: Durch die Hände der Apostel geschahen unter dem Volk viele Zeichen und Wunder, und sie waren alle einmütig[a] in der Säulenhalle Salomos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: alle gemeinsam. Das griechische Wort betont das gemeinsame, von Einigkeit geprägte Zusammensein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Kolonnade Salomos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: Durch die Hände der Apostel
  rationale: Bewahrt die konkrete griechische Ausdrucksweise und gibt διά mit dem Genitiv als Mittel beziehungsweise vermittelnde Urheberschaft wieder.
- source_word: δὲ
  choice: und
  rationale: δέ führt hier die Erzählung weiter und bezeichnet keinen starken Gegensatz; „und“ verbindet die Aussage im Deutschen natürlich mit dem Zusammenhang.
- source_word: ἐγίνετο
  choice: geschahen
  rationale: Der Imperfekt beschreibt fortdauerndes oder wiederholtes Geschehen. „Geschahen“ ist im Deutschen idiomatisch und lässt offen, dass die Zeichen durch die Apostel gewirkt wurden.
- source_word: σημεῖα καὶ τέρατα πολλὰ
  choice: viele Zeichen und Wunder
  rationale: Gibt die feste lukanische Wortverbindung ohne den deutenden Zusatz „übernatürlich“ oder „mirakulös“ wieder; πολλά bezieht sich auf die gesamte Wortgruppe.
- source_word: ἐν τῷ λαῷ
  choice: unter dem Volk
  rationale: Bezeichnet den Bereich, in dem die Zeichen und Wunder geschahen, ohne die ethnische Identität des Volkes über den Wortlaut hinaus näher festzulegen.
- source_word: ὁμοθυμαδὸν
  choice: einmütig
  rationale: Bringt die gemeinsame Ausrichtung und Geschlossenheit der Gruppe zum Ausdruck; die mögliche Betonung des bloßen Zusammenseins wird in der Fußnote genannt.
- source_word: ἅπαντες
  choice: alle
  rationale: Gibt den umfassenden Sinn knapp und natürlich wieder, ohne den im Griechischen unausgesprochenen Bezug der Personengruppe näher festzulegen.
- source_word: Στοᾷ Σολομῶντος
  choice: Säulenhalle Salomos
  rationale: στοά bezeichnet eine überdachte Säulenhalle. Diese Wiedergabe ist anschaulich, verständlich und weniger fachsprachlich als „Kolonnade“.
theological_decisions:
- issue: Bezug von „sie waren alle“
  choice: Das Pronomen „sie“ bleibt ohne ausdrückliche nähere Bestimmung.
  alternative: Entweder nur die Apostel oder die gesamte Gemeinschaft der Glaubenden ausdrücklich zu nennen.
  rationale: Der griechische Text lässt den Bezug unausgesprochen. Die Übersetzung bewahrt diese echte Mehrdeutigkeit und legt sich nicht auf eine der möglichen Gruppen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wendung „durch die Hände“ bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser verständlich. Die implizite Bezugsgruppe von „sie“ wird bewusst nicht erläutert.
