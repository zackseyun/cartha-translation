  source_fidelity: Die Übersetzung gibt die zentrale Mittel-/Agentivangabe „durch die Hände der Apostel“, das Imperfektgeschehen, die Vielzahl der „Zeichen und Wunder“, den Wirkungsbereich „unter dem Volk“, die umfassende Gruppenangabe und den Ort zutreffend wieder. Der nicht ausdrücklich bestimmte Bezug von „sie“ bleibt wie im Griechischen offen.
