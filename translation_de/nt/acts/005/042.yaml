  - severity: low
    issue: Die Fußnote bezeichnet eine nicht eigentlich formal nähere Umschreibung als „näher am griechischen Wortlaut“.
    rationale: „die gute Nachricht von Jesus, dem Messias“ verändert die Konstruktion zu einer Genitivverbindung und kann zudem anders verstanden werden. Die belastbare idiomatische Alternative „Jesus als den Messias zu verkünden“ genügt.
