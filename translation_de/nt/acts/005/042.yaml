id: ACT.5.42
reference: Acts 5:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: de
  text: 'Und Tag für Tag hörten sie nicht auf, im Tempel und von Haus zu Haus zu lehren und die gute Nachricht zu verkünden: Jesus ist der Messias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus als den Messias zu verkünden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: Und Tag für Tag
  rationale: Die adverbiale Wendung gibt die fortlaufende, regelmäßige Tätigkeit wieder; τε knüpft den Satz an den vorherigen Bericht an.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den Tempelbereich; „im Tempel“ ist im Deutschen knapp und natürlich, ohne den Ausdruck unnötig auf die inneren Tempelräume einzuengen.
- source_word: κατ’ οἶκον
  choice: von Haus zu Haus
  rationale: κατά mit dem Singular οἶκον hat distributiven Sinn und bezeichnet die Tätigkeit in einzelnen Häusern.
- source_word: οὐκ ἐπαύοντο
  choice: hörten sie … nicht auf
  rationale: Das Imperfekt bezeichnet eine anhaltende Tätigkeit; die deutsche Wendung ist gegenwärtig und idiomatisch.
- source_word: διδάσκοντες
  choice: zu lehren
  rationale: Die übliche und sachlich genaue Wiedergabe von διδάσκω; der Infinitiv schließt sich natürlich an „aufhören“ an.
- source_word: εὐαγγελιζόμενοι
  choice: die gute Nachricht zu verkünden
  rationale: Die Form bezeichnet das Verkünden einer guten Botschaft; die Wiedergabe bleibt verständlich und erhält den Verkündigungscharakter.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: Jesus ist der Messias
  rationale: Χριστός fungiert als Titel und wird daher mit „Messias“ übersetzt. Nach εὐαγγελιζόμενοι kann die Akkusativphrase idiomatisch als Inhalt der Verkündigung wiedergegeben werden.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: An dieser Stelle bezeichnet Χριστός den Titel des gesalbten Retters und nicht bloß einen namenähnlichen Bestandteil; „Messias“ macht diesen Titelgehalt für heutige Leser deutlich.
- issue: Syntaktische Funktion von τὸν χριστὸν Ἰησοῦν
  choice: 'Inhaltssatz: „Jesus ist der Messias“'
  alternative: 'Objektsphrase: „Jesus, den Messias“ / „Jesus als den Messias“'
  rationale: Die Akkusativphrase kann formal als Objekt zu εὐαγγελιζόμενοι verstanden werden. Der Inhaltssatz gibt im Deutschen den wahrscheinlichen Verkündigungsinhalt natürlich wieder; die formal nähere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tag für Tag“ und „hörten … nicht auf“ vermitteln den fortdauernden Charakter. Die Doppelangabe „im Tempel“ und „von Haus zu Haus“ bleibt erhalten; die Interpunktion macht den Inhalt der Verkündigung deutlich, ohne die syntaktische Alternative zu verschweigen.
