  verdict: revise
  source_fidelity: Der Entwurf gibt die zeitliche Kontinuität, die beiden Wirkungsorte, das fortgesetzte Lehren und Verkündigen sowie den messianischen Inhalt zutreffend wieder. Die Stellung von „weder … noch“ ist jedoch im Deutschen semantisch und syntaktisch weniger klar als die griechische Koordination der Ortsangaben.
  naturalness: „hörten sie weder im Tempel noch von Haus zu Haus auf“ ist schwerfällig und kann nahelegen, dass das Nichtaufhören jeweils alternativ für die Orte behauptet wird. „hörten sie nicht auf, im Tempel und von Haus zu Haus zu lehren und die gute Nachricht zu verkünden“ ist modernes, idiomatisches Standarddeutsch und bildet die Satzstruktur klarer ab.
  terminology: „Messias“ gibt χριστός als Titel sachgerecht wieder. „die gute Nachricht verkünden“ ist eine natürliche und treffende Wiedergabe von εὐαγγελίζεσθαι. Der Inhaltssatz wahrt die mögliche inhaltliche Auffassung von τὸν χριστὸν Ἰησοῦν; die objektnahe Alternative soll knapp in der Fußnote erhalten bleiben.
  issues:
