  source_fidelity: 'Die Übersetzung gibt die Struktur und den Sinn des griechischen Textes zuverlässig wieder: ἐγένετο φόβος μέγας ist idiomatisch als „große Furcht kam über“ formuliert, und die zweifache Ausrichtung mit ἐπί wird durch „über … und über …“ bewahrt. „Davon hörten“ ist im Deutschen eine natürliche kontextbezogene Wiedergabe von ταῦτα und bezieht sich auf die unmittelbar zuvor berichteten Vorgänge.'
