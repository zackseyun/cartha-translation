id: ACT.5.11
reference: Acts 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: de
  text: Und große Furcht kam über die ganze Gemeinde[a] und über alle, die davon hörten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Versammlung“ oder „Kirche“ für „Gemeinde“ (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: kam über
  rationale: Mit φόβος als Subjekt und ἐπί mit Akkusativ gibt „kam über“ die ereignishafte Wendung natürlich und treffend wieder.
- source_word: φόβος μέγας
  choice: große Furcht
  rationale: Im unmittelbaren Zusammenhang mit dem Gericht an Hananias und Saphira bezeichnet φόβος ernsthafte Furcht; μέγας wird direkt mit „große“ wiedergegeben.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: über die ganze Gemeinde
  rationale: ἐκκλησία bezeichnet hier die Gemeinschaft der Glaubenden. „Gemeinde“ ist im modernen Deutschen natürlich und bewahrt den gemeinschaftlichen Bezug; ὅλην bleibt als „ganze“ erhalten.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: alle, die davon hörten
  rationale: Die substantivierte Partizipialwendung wird idiomatisch als Relativsatz wiedergegeben. „Davon“ bezieht sich natürlich auf die zuvor berichteten Ereignisse, auch wenn das griechische ταῦτα formal pluralisch ist.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία
  choice: Gemeinde
  alternative: Versammlung; Kirche
  rationale: „Gemeinde“ bezeichnet im deutschen neutestamentlichen Sprachgebrauch die Gemeinschaft der Glaubenden, ohne vorrangig ein Gebäude oder eine spätere Institution anzudeuten. Die Alternativen bleiben lexikalisch möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Parallelismus („über … und über …“), während „davon hörten“ im Deutschen natürlicher ist als „diese Dinge hörten“.
