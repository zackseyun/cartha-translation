  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: de
  text: Und noch mehr Menschen, die an den Herrn glaubten, wurden hinzugefügt – große Scharen von Männern und Frauen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schlossen sich an“ beziehungsweise „kamen hinzu“. Das griechische Verb beschreibt einen fortdauernden Zuwachs; seine passive Form kann andeuten, dass Gott sie hinzufügte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: Doch immer mehr
  rationale: δέ führt den Bericht weiter und hat im Zusammenhang eine leicht kontrastierende Wirkung; μᾶλλον verstärkt den fortgesetzten Zuwachs.
- source_word: προσετίθεντο
  choice: wurden hinzugefügt
  rationale: Die Form bezeichnet einen fortdauernden Vorgang und lässt im Passiv offen, wer die Menschen hinzufügte; zugleich kann der Zusammenhang Gott als Handelnden nahelegen.
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: Menschen, die an den Herrn glaubten
  rationale: Das substantivisch gebrauchte Partizip bezeichnet die Glaubenden; der Dativ benennt den Herrn als Ziel ihres Vertrauens. Die Umschreibung ist im modernen Deutsch klar und natürlich.
- source_word: πλήθη
  choice: große Scharen
  rationale: Der Plural hebt die beträchtliche Zahl der Hinzugefügten hervor. „Scharen“ bewahrt die Anschaulichkeit besser als die abstraktere Wiedergabe „große Zahlen“.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: von Männern und Frauen
  rationale: Die Genitive erläutern, aus wem die großen Scharen bestanden; die korrelative Verbindung schließt ausdrücklich beide Gruppen ein.
theological_decisions:
- issue: Bezug von τῷ κυρίῳ
  choice: „der Herr“ bleibt als Titel stehen und wird als Ziel des Glaubens wiedergegeben.
  alternative: Den Titel im Haupttext ausdrücklich mit „Jesus“ aufzulösen.
  rationale: Im Kontext der Apostelgeschichte ist wahrscheinlich Jesus gemeint. Die Übersetzung bewahrt jedoch die Bezeichnung des griechischen Textes und legt den Referenten nicht durch eine Ergänzung fest.
- issue: Diathese und Aspekt von προσετίθεντο
  choice: 'Fortdauerndes passives Geschehen: „wurden hinzugefügt“.'
  alternative: 'Intransitiv oder medial: „schlossen sich an“ beziehungsweise „kamen hinzu“.'
  rationale: Die passive Wiedergabe erhält die mögliche Andeutung göttlichen Handelns, ohne Gott ausdrücklich als Subjekt einzusetzen, und bildet den fortlaufenden Zuwachs ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschen, die … glaubten“ vermeidet das substantivierte und teils gruppensprachlich wirkende „Gläubige“. Der Gedankenstrich gibt die erläuternde Apposition „große Scharen …“ wieder.
