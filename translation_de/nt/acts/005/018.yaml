  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: de
  text: Sie nahmen die Apostel fest und brachten sie in öffentlichem Gewahrsam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das öffentliche Gefängnis“. Der griechische Ausdruck kann allgemein amtliche Verwahrung oder Haft bezeichnen und muss sich nicht ausschließlich auf ein Gefängnisgebäude beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: ergriffen
  rationale: Die Wendung bedeutet in diesem feindlichen Zusammenhang, dass die Apostel gewaltsam festgenommen wurden. „Ergriffen“ gibt den idiomatischen Sinn natürlich wieder, ohne die im Deutschen missverständliche wörtliche Formulierung „legten die Hände auf“ zu verwenden.
- source_word: ἀποστόλους
  choice: Apostel
  rationale: In der Apostelgeschichte ist dies die etablierte Bezeichnung für die von Jesus beauftragten Gesandten, nicht bloß für Boten im allgemeinen Sinn.
- source_word: ἔθεντο
  choice: brachten
  rationale: τίθημι bedeutet hier, jemanden in einen Zustand beziehungsweise an einen Ort des Gewahrsams zu versetzen. „Brachten“ ist in Verbindung mit „in Gewahrsam“ idiomatisches modernes Deutsch.
- source_word: ἐν τηρήσει
  choice: in … Gewahrsam
  rationale: τήρησις kann Bewachung, Verwahrung oder Haft bezeichnen. „Gewahrsam“ wahrt die allgemeinere Bedeutung und legt sich nicht unnötig auf ein bestimmtes Gefängnisgebäude fest.
- source_word: δημοσίᾳ
  choice: öffentlichen
  rationale: Das Adjektiv bestimmt τηρήσει näher und bezeichnet wahrscheinlich offiziellen beziehungsweise allgemeinen öffentlichen Gewahrsam. Die Übersetzung erhält diese Modifikation, ohne sie als „staatlich“ zu überdeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ergriffen“ vermittelt die feindliche Festnahme klar; „öffentlicher Gewahrsam“ erhält die lexikalische Weite des griechischen Ausdrucks.
