id: ACT.5.19
reference: Acts 5:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: de
  text: 'Doch ein Engel des Herrn öffnete in der Nacht die Türen des Gefängnisses, führte sie hinaus und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: ein Engel
  rationale: Das artikellose Substantiv wird im Deutschen natürlich unbestimmt wiedergegeben. Der Kontext einer übernatürlichen Befreiung spricht für ein himmlisches Wesen, nicht für einen menschlichen Boten.
- source_word: κυρίου
  choice: des Herrn
  rationale: „Herr“ ist die sachgerechte und eingebürgerte Wiedergabe von κύριος; die Verbindung „Engel des Herrn“ bewahrt zudem die geläufige biblische Ausdrucksweise.
- source_word: διὰ νυκτός
  choice: in der Nacht
  rationale: Die Konstruktion mit διά und Genitiv ist hier temporal. „In der Nacht“ ist im modernen Deutschen klar und idiomatisch.
- source_word: ἤνοιξε
  choice: öffnete
  rationale: ἀνοίγω bezeichnet schlicht das Öffnen. „Schloss auf“ würde ein nicht ausdrücklich genanntes Entriegeln hinzufügen.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: die Türen des Gefängnisses
  rationale: Die Wiedergabe entspricht der griechischen Wortgruppe und lässt offen, um welche einzelnen Gefängnistüren es sich handelte.
- source_word: ἐξαγαγών
  choice: führte sie hinaus
  rationale: Das Partizip von ἐξάγω beschreibt, dass der Engel sie nach draußen brachte. „Führte sie hinaus“ ist natürliches Deutsch und passt zur handelnden Person.
- source_word: τε
  choice: und
  rationale: τέ verbindet hier die Handlung des Hinausführens locker mit dem anschließenden Sprechen; „und“ gibt dies unaufdringlich wieder.
- source_word: εἶπεν
  choice: sagte
  rationale: Der narrative Aorist von λέγω wird idiomatisch mit „sagte“ wiedergegeben; der Doppelpunkt weist auf den folgenden Redeinhalt voraus.
theological_decisions:
- issue: Wesen des ἄγγελος im Kontext
  choice: himmlischer Engel
  alternative: menschlicher Bote
  rationale: Die übernatürliche Öffnung des Gefängnisses und die Befreiung der Apostel legen einen himmlischen Engel nahe. Daher steht „Engel“ und nicht „Bote“.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ bewahrt sowohl den üblichen theologischen Sprachgebrauch als auch die feste biblische Wendung „Engel des Herrn“, ohne die genaue Referenz innerhalb dieses Verses zusätzlich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am griechischen Erzählfluss; der Doppelpunkt trägt die Rede in Vers 20 weiter. Keine Fußnoten erforderlich.
