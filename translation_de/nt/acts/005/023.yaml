  rationale: Die Übersetzung korrigiert die semantische Verschiebung von Sicherheit zu Sorgfalt. „Sicher verschlossen“ gibt sowohl den fortbestehenden verschlossenen Zustand als auch die hervorgehobene Absicherung natürlich wieder. Die nicht ausgedrückte Ergänzung zu „öffneten“ bleibt wie im Ausgangstext offen.
