    issue: „mit größter Sorgfalt verschlossen“ für κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
    rationale: „Sorgfalt“ bezeichnet vor allem gewissenhaftes Handeln; ἀσφάλεια bezeichnet hier die Sicherheit/Absicherung des verschlossenen Gefängnisses. Die Formulierung sollte daher die sichere Sicherung, nicht die Ausführungsweise des Verschließens, hervorheben.
  revised_text: 'Sie berichteten: „Wir fanden das Gefängnis sicher verschlossen[a] und die Wachen an den Türen stehen. Doch als wir öffneten, fanden wir drinnen niemanden.“'
