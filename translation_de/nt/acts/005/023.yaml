  text: λέγοντες ὅτι ⸀Τὸ δεσμωτήριον εὕρομεν κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ καὶ τοὺς φύλακας ἑστῶτας ⸀ἐπὶ τῶν θυρῶν, ἀνοίξαντες δὲ ἔσω οὐδένα εὕρομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: de
  text: 'Sie berichteten: „Wir fanden das Gefängnis sicher verschlossen[a] und die Wachen an den Türen stehen. Doch als wir öffneten, fanden wir drinnen niemanden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollständig gesichert“. Der griechische Ausdruck betont, dass das Gefängnis in jeder Hinsicht gesichert vorgefunden wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμωτήριον
  choice: Gefängnis
  rationale: Bezeichnet hier den Ort der Verwahrung; „Gefängnis“ ist die natürliche und sachlich passende standarddeutsche Entsprechung.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: mit größter Sorgfalt verschlossen
  rationale: Das Perfektpartizip beschreibt den fortbestehenden verschlossenen Zustand; ἐν πάσῃ ἀσφαλείᾳ hebt hervor, dass alle gebotenen Sicherungsmaßnahmen getroffen waren.
- source_word: φύλακας ἑστῶτας
  choice: die Wachen … stehen
  rationale: Bewahrt das anschauliche Detail des griechischen Textes, ohne das bloße Stehen ausdrücklich als formelle Postierung auszudeuten.
- source_word: ἐπὶ τῶν θυρῶν
  choice: an den Türen
  rationale: Gibt die räumliche Nähe der Wachen zu den Türen idiomatisch wieder.
- source_word: ἀνοίξαντες
  choice: als wir öffneten
  rationale: Das Aoristpartizip wird natürlich temporal wiedergegeben. Da im Griechischen kein Objekt genannt ist, bleibt auch im Deutschen offen, ob unmittelbar die Türen oder das Gefängnis als Ganzes gemeint sind.
- source_word: ἔσω
  choice: drinnen
  rationale: Natürliche adverbiale Wiedergabe des Innenraums des Gefängnisses.
- source_word: οὐδένα
  choice: niemanden
  rationale: Klare standarddeutsche Entsprechung des negativen Indefinitpronomens.
- source_word: λέγοντες ὅτι
  choice: 'Sie berichteten:'
  rationale: Knüpft an die Amtsträger des vorhergehenden Verses an und führt ihren Bericht in natürlichem Deutsch als direkte Rede ein.
theological_decisions: []
