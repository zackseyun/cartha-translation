- from: Geht hin, stellt euch in den Tempelbezirk[a] und verkündet dem Volk alle Worte dieses Lebens.[b]
  to: Geht hin, stellt euch im Tempelbezirk[a] auf und redet zum Volk alle Worte dieses Lebens.[b]
  rationale: Die Revision behebt die unpassende Richtungsangabe bei der Wiedergabe von ἐν τῷ ἱερῷ und ersetzt die leicht stärker deutende Wiedergabe „verkündet“ durch das allgemeinere „redet“. Sie erhält die Befehlsfolge, die Mehrdeutigkeit von „dieses Lebens“, den Registerton sowie alle Fußnotenanker und Fußnoteninformationen.
