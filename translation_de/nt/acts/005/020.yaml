  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: de
  text: Geht hin, stellt euch im Tempelbezirk[a] auf und redet zum Volk alle Worte dieses Lebens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Tempelhöfen“; das griechische Wort bezeichnet den Tempelkomplex, nicht speziell das innere Heiligtum.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über dieses Leben“ beziehungsweise „dieser Lebensweise“. Gemeint sein kann das im Evangelium verkündete Leben.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Geht hin
  rationale: Der Imperativ fordert zum Aufbruch und anschließenden Handeln auf. „Geht hin“ ist im Deutschen direkt, natürlich und der Bewegungskomponente des Verbs angemessen.
- source_word: σταθέντες
  choice: stellt euch
  rationale: Das Aoristpartizip bezeichnet hier wahrscheinlich eine Begleithandlung zum folgenden Imperativ. Die finite Koordination gibt die Befehlsfolge im Deutschen idiomatisch wieder.
- source_word: λαλεῖτε
  choice: verkündet
  rationale: Im Zusammenhang des öffentlichen Redens zum Volk bezeichnet das Verb ein vernehmbares Mitteilen der Botschaft. „Verkündet“ ist hier natürlicher als „redet“, ohne den Inhalt näher auszudeuten.
- source_word: ἐν τῷ ἱερῷ
  choice: in den Tempelbezirk
  rationale: ἱερόν meint den gesamten Tempelkomplex und nicht speziell das innere Heiligtum. „Tempelbezirk“ macht diese räumliche Bedeutung im Deutschen deutlich.
- source_word: τῷ λαῷ
  choice: dem Volk
  rationale: Die Wiedergabe bleibt allgemein und entspricht dem bestimmten λαός, ohne ausdrücklich eine ethnische oder situative Präzisierung hinzuzufügen.
- source_word: πάντα τὰ ῥήματα
  choice: alle Worte
  rationale: Die Formulierung bildet sowohl πάντα als auch ῥήματα eng ab und vermeidet die interpretierende Zusammenfassung „die ganze Botschaft“.
- source_word: τῆς ζωῆς ταύτης
  choice: dieses Lebens
  rationale: Die Genitivverbindung bleibt kompakt und mehrdeutig. Sie kann auf das im Evangelium verkündete Leben, das neue Leben oder die lebensspendende Botschaft hinweisen, ohne dass der Text dies ausdrücklich festlegt.
theological_decisions:
- issue: Bedeutung von τῆς ζωῆς ταύτης („dieses Lebens“)
  choice: Die offene Formulierung „dieses Lebens“ wird beibehalten.
  alternative: „über dieses Leben“, „dieser Lebensweise“ oder „von der lebensspendenden Botschaft“
  rationale: Der griechische Ausdruck verbindet die Worte mit „diesem Leben“, bestimmt die Art der Beziehung aber nicht näher. Eine erklärende Übersetzung würde die theologische Offenheit unnötig auf eine Deutung beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Befehlsfolge ist gut verständlich; „Tempelbezirk“ vermeidet das mögliche Missverständnis, die Apostel sollten sich in das innere Heiligtum stellen. Die ungewöhnliche Wendung „Worte dieses Lebens“ bleibt bewusst erhalten, um die Mehrdeutigkeit des griechischen Genitivs nicht aufzulösen.
