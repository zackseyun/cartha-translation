  - severity: low
    issue: καί bei der Mitwisserschaft kann sichtbarer markiert werden
    rationale: Die Aussage der Mitwisserschaft ist vorhanden, doch „ebenfalls“ macht das einschließende καί natürlich erkennbar, ohne eine überzogene Deutung einzutragen.
