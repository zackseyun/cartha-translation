base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: de
  text: Er behielt etwas vom Verkaufserlös für sich zurück[a]; seine Frau wusste ebenfalls davon. Einen Teil davon brachte er und legte ihn den Aposteln zu Füßen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zweigte heimlich etwas vom Verkaufserlös für sich ab“. Das griechische Verb bezeichnet ein unredliches Zurückbehalten zum eigenen Nutzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „legte ihn bei den Füßen der Apostel nieder“.'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: behielt … für sich zurück
  rationale: Das Medium νοσφίζομαι bezeichnet hier ein unredliches, verheimlichtes Zurückbehalten zum eigenen Nutzen. Die deutsche Formulierung gibt den negativen Sinn wieder, ohne eine bestimmte juristische Kategorie wie Veruntreuung festzulegen.
- source_word: ἀπὸ τῆς τιμῆς
  choice: einen Teil des Verkaufserlöses
  rationale: τιμή bezeichnet in diesem Zusammenhang den beim Verkauf erzielten Geldbetrag. „Verkaufserlös“ ist im Deutschen eindeutiger als das wörtlichere „Preis“; „einen Teil“ ergibt sich aus dem Zusammenhang und der Konstruktion mit ἀπό.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: seine Frau wusste davon
  rationale: Der Genitivus absolutus nennt einen begleitenden Umstand und macht deutlich, dass die Frau von dem Zurückbehalten wusste. „Auch“ wird im Deutschen nicht eigens gesetzt, weil es hier schwerfällig und potenziell missverständlich wäre; der einschließende Sinn des καί bleibt durch die ausdrücklich genannte Mitwisserschaft erhalten.
- source_word: ἐνέγκας
  choice: brachte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der finiten Handlung des Hinlegens vorausgeht. Eine koordinierte deutsche Verbform gibt den natürlichen Erzählfluss wieder.
- source_word: μέρος τι
  choice: einen gewissen Teil
  rationale: μέρος τι bezeichnet einen nicht näher bestimmten Anteil. „Einen gewissen Teil“ bewahrt diese Unbestimmtheit und folgt der griechischen Ausdrucksweise eng.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: legte ihn den Aposteln zu Füßen
  rationale: Die konkrete räumliche Wendung wird bewahrt und zugleich idiomatisch deutsch formuliert. Sie beschreibt, wie das Geld vor den Aposteln niedergelegt wurde.
theological_decisions:
- issue: Moralischer Gehalt von Hananias’ Handlung
  choice: Das Verb wird als unredliches Zurückbehalten wiedergegeben.
  alternative: Er behielt einen Teil des Geldes zurück.
  rationale: νοσφίζομαι und der unmittelbare Erzählzusammenhang kennzeichnen die Handlung als verborgenes Zurückbehalten zum eigenen Vorteil, nicht als bloß neutrale Verfügung über einen Teil des Geldes. Die Formulierung wahrt diese negative Wertung, ohne zusätzliche dogmatische oder juristische Aussagen einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Gedankenstriche heben die begleitende Mitwisserschaft der Frau hervor, ohne den Satzfluss unnötig aufzubrechen. Die konkrete Wendung „zu Füßen“ hält die Bildsprache des griechischen Textes fest.
