  source_fidelity: 'Die Übersetzung trifft die wesentlichen Aussagen des griechischen Textes: das unredliche Zurückbehalten vom Verkaufsertrag, die Mitwisserschaft der Frau, das Bringen eines unbestimmten Anteils und das Niederlegen zu Füßen der Apostel. Die doppelte Wiedergabe von „Teil“ im bisherigen Haupttext ist jedoch stilistisch unnötig und verwischt die unterschiedliche Funktion von ἀπὸ τῆς τιμῆς und μέρος τι.'
  naturalness: Der Satz ist grundsätzlich verständlich und im angemessenen erzählenden Register gehalten. „Einen Teil des Verkaufserlöses … einen gewissen Teil“ wirkt jedoch wiederholend; „einen gewissen Teil“ ist zudem weniger natürlich als „einen Teil davon“. Eine klar gegliederte Satzfolge ist im modernen Standarddeutsch flüssiger.
  terminology: „Verkaufserlös“ gibt τιμή im vorliegenden Verkaufskontext sachgerecht wieder. „Für sich zurückbehalten“ bewahrt die negative, eigennützige Konnotation von ἐνοσφίσατο, ohne die stärker juristisch festgelegte Aussage „unterschlagen“ in den Haupttext einzutragen. „Zu Füßen der Apostel“ erhält die konkrete Bildsprache von παρὰ τοὺς πόδας τῶν ἀποστόλων.
