revisions:
- from: Er behielt einen Teil des Verkaufserlöses für sich zurück[a] – seine Frau wusste davon –, brachte einen gewissen Teil und legte ihn den Aposteln zu Füßen.[b]
  to: Er behielt etwas vom Verkaufserlös für sich zurück[a]; seine Frau wusste ebenfalls davon. Einen Teil davon brachte er und legte ihn den Aposteln zu Füßen.[b]
  rationale: Die Revision beseitigt die stilistisch störende Wiederholung von „Teil“, ohne den Sinn zu verändern. „Etwas vom Verkaufserlös“ entspricht der Absonderung aus dem Verkaufsertrag; „einen Teil davon“ gibt den danach genannten unbestimmten Anteil wieder. Die Mitwisserschaft der Frau und die bildhafte Ortsangabe bleiben erhalten.
