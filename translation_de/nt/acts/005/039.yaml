  - severity: low
    issue: Missverständliche Fußnotenalternative „Gotteskämpfer“
    rationale: Das deutsche Kompositum kann ohne Kontext auch positiv verstanden werden. Eine unmissverständliche Alternative sollte die gegen Gott gerichtete Bedeutung markieren.
