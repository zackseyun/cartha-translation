  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: de
  text: Wenn es aber von Gott ist, werdet ihr sie nicht zu Fall bringen können.[a] Vielleicht werdet ihr sonst sogar als Kämpfer gegen Gott dastehen.[b] Da ließen sie sich von ihm überzeugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werdet ihr sie nicht vernichten können“ oder „werdet ihr sie nicht beseitigen können“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Gottesbekämpfer“; auch: „Gegner Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: von Gott
  rationale: ἐκ bezeichnet hier Ursprung oder Herkunft; „von Gott“ gibt dies im Deutschen natürlich und präzise wieder.
- source_word: δυνήσεσθε
  choice: werdet ihr … können
  rationale: Die Futurform bezeichnet künftige Fähigkeit oder Möglichkeit und wird durch das deutsche Futur ausdrücklich bewahrt.
- source_word: καταλῦσαι
  choice: zu Fall bringen
  rationale: Das Verb bezeichnet hier das Zerschlagen oder Scheiternlassen der betreffenden Personen beziehungsweise ihres Wirkens; „zu Fall bringen“ passt zum oppositionellen Kontext, ohne völlige Vernichtung zu behaupten.
- source_word: αὐτούς
  choice: sie
  rationale: Das maskuline Pluralpronomen verweist am natürlichsten auf die Apostel; die deutsche Form bewahrt den personalen Bezug.
- source_word: μήποτε
  choice: Sonst könntet ihr sogar
  rationale: μήποτε leitet eine warnende Möglichkeit ein. Diese Formulierung gibt die Vorsicht und die unerwünschte mögliche Folge in natürlichem Deutsch wieder.
- source_word: θεομάχοι
  choice: Menschen …, die gegen Gott kämpfen
  rationale: Das zusammengesetzte Wort bezeichnet wörtlich „Gotteskämpfer“, also Menschen, die gegen Gott kämpfen; die Relativsatzform ist im modernen Deutsch verständlicher und bewahrt den Ernst der Aussage.
- source_word: εὑρεθῆτε
  choice: euch … als … erweisen
  rationale: Das Passiv von εὑρίσκω bedeutet hier, als etwas befunden zu werden oder sich als etwas herauszustellen; „sich erweisen“ ist idiomatisch und sachlich genau.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: Da ließen sie sich von ihm überzeugen
  rationale: Das Passiv von πείθω zeigt, dass der Rat Gamaliels sie überzeugte; „da“ verbindet die Reaktion natürlich mit seiner Warnung.
theological_decisions:
- issue: Bezugswort von αὐτούς in der Aussage darüber, wen sie nicht zu Fall bringen können
  choice: Das Pronomen bezieht sich am unmittelbarsten auf die Apostel.
  alternative: Es kann im weiteren Sinn ihre Bewegung oder ihr Werk einschließen, anknüpfend an „dieses Vorhaben oder dieses Werk“ in Vers 38.
  rationale: Das griechische Pronomen ist maskulin und steht im Plural, weshalb der personale Bezug am nächsten liegt. Die Übersetzung bewahrt diesen Bezug, ohne Gamaliels Aussage zu einer allgemeinen Zusage für jede religiöse Bewegung auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt gut verständlich, während Futur, Warncharakter und der personale Bezug des griechischen Pluralpronomens erhalten bleiben.
