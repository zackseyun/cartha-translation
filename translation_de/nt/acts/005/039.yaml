revisions:
- from: Wenn es aber von Gott ist, werdet ihr sie nicht zu Fall bringen können.[a] Sonst könntet ihr euch sogar als Menschen erweisen, die gegen Gott kämpfen.[b] Da ließen sie sich von ihm überzeugen.
  to: Wenn es aber von Gott ist, werdet ihr sie nicht zu Fall bringen können.[a] Vielleicht werdet ihr sonst sogar als Kämpfer gegen Gott dastehen.[b] Da ließen sie sich von ihm überzeugen.
  rationale: Die Revision glättet die deutsche Syntax und gibt εὑρεθῆτε mit „dastehen“ idiomatisch als mögliches Sich-herausstellen wieder. „Vielleicht“ und „sonst“ bewahren den warnenden, möglichen Ausgang von μήποτε. Der personale Bezug von „sie“ bleibt erhalten; die Fußnote wird semantisch eindeutig formuliert.
