  source_fidelity: 'Der Haupttext gibt die Abfolge und Aussage des Griechischen zuverlässig wieder: Hananias hört, fällt und stirbt; anschließend entsteht große Furcht. Die Todesursache wird zutreffend nicht erklärt. „Davon hörten“ legt jedoch stärker als das objektlos verwendete griechische Partizip nahe, dass die Betreffenden erst von dem Ereignis berichtweise hörten. Die Formulierung sollte die offene Bezugsweite wahren.'
  naturalness: Der Text ist modernes, gut lesbares Standarddeutsch mit angemessenem erzählerischem Ton. „Fiel ... zu Boden“ und „große Furcht“ sind natürlich. In der Fußnote ist „tat seinen letzten Atemzug“ im Deutschen keine idiomatische Wendung.
  terminology: „Hananias“ entspricht der geläufigen deutschen biblischen Namensform. „Furcht“ ist als Wiedergabe von φόβος passend und legt weder bloße Angst noch ausschließlich Ehrfurcht fest. Die Fußnote sollte die Bildsprache von ἐξέψυξεν idiomatisch ausdrücken.
