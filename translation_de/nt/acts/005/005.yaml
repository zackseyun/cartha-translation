  to: Als Hananias diese Worte hörte, fiel er zu Boden und starb.[a] Da kam große Furcht über alle, die es hörten.
  rationale: Die Revision beseitigt die unidiomatische Fußnotenformulierung und vermeidet mit „es hörten“ die sachlich stärkere Einengung von „davon hörten“. Bedeutung, Erzählton und die im Ausgangstext offene Erklärung des Todes bleiben unverändert.
