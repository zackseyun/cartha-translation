  - severity: low
    issue: „tat seinen letzten Atemzug“ ist nicht idiomatisch.
    rationale: Als deutsche Wendung wäre allenfalls „tat seinen letzten Atemzug“ verständlich, aber stilistisch fehlerhaft bzw. unüblich. „hauchte sein Leben aus“ bewahrt die lexikalische Bildlichkeit ausreichend; „gab den Geist auf“ bietet eine etablierte alternative Umschreibung.
