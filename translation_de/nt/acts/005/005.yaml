id: ACT.5.5
reference: Acts 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: de
  text: Als Hananias diese Worte hörte, fiel er zu Boden und starb.[a] Da kam große Furcht über alle, die es hörten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »hauchte sein Leben aus«; auch: »gab den Geist auf«.'
    reason: Die Fußnote bewahrt die konkrete Bildhaftigkeit von ἐξέψυξεν, während der Haupttext klares modernes Deutsch verwendet.
lexical_decisions:
- source_word: ἀκούων
  choice: Als ... hörte
  rationale: Das Präsenspartizip wird hier natürlich als temporaler Nebensatz wiedergegeben und bezeichnet den Anlass beziehungsweise Zeitpunkt des folgenden Geschehens.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier vor allem den Fortgang der Erzählung. Der Übergang wird im Deutschen durch die Satzfolge ausreichend deutlich; ein ausdrückliches „aber“ wäre stärker kontrastierend als nötig.
- source_word: ὁ Ἁνανίας
  choice: Hananias
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition wiedergegeben; der Artikel bleibt im Deutschen unübersetzt.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Gemeint sind die unmittelbar zuvor gesprochenen Worte des Petrus. „Diese Worte“ ist präzise, würdig und idiomatisch.
- source_word: πεσὼν
  choice: fiel er zu Boden
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende beziehungsweise sie begleitende Handlung. Die Formulierung bewahrt das konkrete körperliche Bild.
- source_word: ἐξέψυξεν
  choice: starb
  rationale: Das Verb bezeichnet wörtlich das Aushauchen des Lebens. „Starb“ gibt die Bedeutung in klarem modernem Deutsch wieder; die bildhaftere Bedeutung wird in der Fußnote erhalten.
- source_word: καὶ ἐγένετο φόβος μέγας
  choice: Da kam große Furcht
  rationale: Die Konstruktion beschreibt das Einsetzen einer starken Furcht als Folge des Ereignisses. „Da“ macht diesen erzählerischen Zusammenhang natürlich deutlich.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: über alle, die davon hörten
  rationale: Das substantivierte Partizip bezeichnet alle Hörenden. „Davon“ lässt offen, ob sie das Geschehen unmittelbar hörten oder später davon erfuhren, und macht den deutschen Bezug verständlich.
theological_decisions:
- issue: Ursache und Art des Todes von Hananias
  choice: Der unmittelbare Tod wird berichtet, ohne seinen Mechanismus näher zu bestimmen.
  alternative: Entweder ein natürlicher Tod durch Schock oder eine ausdrückliche direkte Tötung durch Gott.
  rationale: Der griechische Text sagt, dass Hananias zu Boden fiel und starb, erklärt aber an dieser Stelle nicht ausdrücklich, auf welche Weise der Tod verursacht wurde. Die Übersetzung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Furcht“ bewahrt gegenüber „Angst“ die mögliche Dimension erschütterter Ehrfurcht, ohne sie festzulegen.
