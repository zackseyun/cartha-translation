base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: de
  text: Wir beschlossen einmütig[a], Männer[b] auszuwählen und sie zusammen mit unseren geliebten Barnabas und Paulus zu euch zu senden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nachdem wir einmütig geworden waren“; auch möglich: „eines Sinnes“.'
