  - marker: b
    text: Gemeint sind männliche Abgesandte; im Griechischen steht ausdrücklich „Männer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: Da beschlossen wir
  rationale: Die deutsche Wendung gibt das gemeinsame, wohlüberlegte Urteil idiomatisch wieder. „Da“ bindet den Satz an die vorausgehende Begründung des Briefes an, ohne die Aussage zu verstärken.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: einmütig
  rationale: ὁμοθυμαδόν bezeichnet die Übereinstimmung der Gruppe. Das mit γενομένοις ausgedrückte Zustandekommen dieser Einmütigkeit wird in einer Fußnote als mögliche ausführlichere Wiedergabe kenntlich gemacht.
- source_word: ἐκλεξαμένοις ἄνδρας
  choice: Männer auszuwählen
  rationale: Die Konstruktion wird im Deutschen natürlich an „beschlossen“ angeschlossen. ἄνδρας bezeichnet hier ausdrücklich männliche Personen, nämlich die später genannten Judas und Silas.
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: sie … zu euch zu senden
  rationale: Das Pronomen „sie“ nimmt die ausgewählten Männer auf und macht die deutsche Satzfügung eindeutig.
- source_word: σὺν
  choice: zusammen mit
  rationale: Die Formulierung drückt die Begleitung klar und natürlich aus.
- source_word: τοῖς ἀγαπητοῖς ἡμῶν
  choice: unseren geliebten
  rationale: Die Wiedergabe bewahrt den herzlichen und zugleich würdevollen Beziehungsausdruck.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Barnabas und Paulus
  rationale: Die Namen folgen der im Deutschen üblichen biblischen Form.
theological_decisions:
- issue: Gemeinschaftlicher Beratungston des Jerusalemer Schreibens
  choice: „Da beschlossen wir einmütig“ als Ausdruck eines gemeinsamen, wohlüberlegten Entschlusses
  alternative: „Es schien uns gut“ oder „Wir hielten es für gut“
  rationale: ἔδοξεν ἡμῖν bezeichnet hier gemeinschaftliche Billigung beziehungsweise Beschlussfassung. Die gewählte deutsche Form ist idiomatisch, ohne dem Satz eine über den griechischen Wortlaut hinausgehende lehramtliche Autorität zuzuschreiben.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur ist gegenüber dem griechischen Partizipialgefüge geglättet, während Einmütigkeit, Auswahl und Sendung als Bestandteile des gemeinsamen Entschlusses erhalten bleiben.
