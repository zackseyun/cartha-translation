  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: de
  text: 'Und damit stimmen die Worte der Propheten überein, wie geschrieben steht:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Natürliche Verknüpfung mit Jakobus’ vorheriger Aussage und der nun folgenden Schriftbegründung.
- source_word: τούτῳ
  choice: damit
  rationale: Das deutsche „damit übereinstimmen“ gibt die Dativkonstruktion mit συμφωνέω idiomatisch wieder und lässt den Rückbezug des Demonstrativpronomens bewusst offen.
- source_word: συμφωνοῦσιν
  choice: stimmen … überein
  rationale: Entspricht dem Sinn „übereinstimmen, im Einklang sein“ und ist im modernen Standarddeutsch natürlich.
- source_word: οἱ λόγοι
  choice: die Worte
  rationale: Bezeichnet hier die schriftlich überlieferten prophetischen Äußerungen; „Worte“ ist direkt, würdig und verständlich.
- source_word: τῶν προφητῶν
  choice: der Propheten
  rationale: Der Genitiv bezeichnet die prophetischen Worte nach Urheberschaft beziehungsweise Herkunft.
- source_word: καθὼς
  choice: wie
  rationale: Leitet die entsprechende Schriftanführung natürlich ein; im Deutschen ist die feste Formel „wie geschrieben steht“ idiomatischer als „genau wie“.
- source_word: γέγραπται
  choice: geschrieben steht
  rationale: Gängige und präzise deutsche Wiedergabe der perfektisch-passiven Schriftformel; sie vermittelt die fortdauernde Geltung des Geschriebenen.
theological_decisions:
- issue: Bezug von τούτῳ in der Rede des Jakobus
  choice: Das neutrale „damit“ verweist allgemein auf den unmittelbar zuvor geschilderten Sachverhalt beziehungsweise die Aussage.
  alternative: Ausdrückliche Festlegung auf die Hinwendung der Nichtjuden, auf die Aussage des Petrus oder auf einen bestimmten Heilsplan Gottes.
  rationale: Der griechische Text benennt den Bezug nicht genauer. Die Übersetzung bewahrt diese Offenheit und vermeidet eine dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich und bewahrt zugleich die Hervorhebung des Rückbezugs. Keine Fußnote ist nötig, da „damit übereinstimmen“ die griechische Dativkonstruktion eindeutig und idiomatisch abbildet.
