  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: de
  text: Männern, die ihr Leben für den Namen unseres Herrn Jesus, des Messias, eingesetzt haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die ihr Leben hingegeben haben“; gemeint ist, dass sie sich tödlicher Gefahr ausgesetzt haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώποις
  choice: Männern
  rationale: Der Dativ Plural knüpft an den Satzbau des vorangehenden Verses an und bezeichnet konkret Barnabas und Paulus; daher ist die geschlechtsspezifische Wiedergabe hier sachgemäß.
- source_word: παραδεδωκόσι
  choice: die … eingesetzt haben
  rationale: Das Perfektpartizip von παραδίδωμι bedeutet wörtlich „übergeben/hingeben“. Zusammen mit „ihr Leben“ bezeichnet es hier die Bereitschaft, sich tödlicher Gefahr auszusetzen. „Ihr Leben einsetzen“ gibt diesen idiomatischen Sinn natürlich wieder, ohne einen bereits eingetretenen Tod zu behaupten.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ihr Leben
  rationale: ψυχή bezeichnet hier das leibliche Leben beziehungsweise die eigene Person in tödlicher Gefahr, nicht eine vom Körper unterschiedene „Seele“.
- source_word: ὑπὲρ
  choice: für
  rationale: Mit dem Genitiv bezeichnet ὑπέρ hier den Grund beziehungsweise die Sache, derentwegen sie sich der Gefahr aussetzten.
- source_word: τοῦ ὀνόματος
  choice: den Namen
  rationale: Die wörtliche Wiedergabe bewahrt die biblische Bedeutungsfülle von Person, Autorität und Ehre.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: „Herr“ ist die natürliche und christologisch gewichtige Wiedergabe von κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός ist der Titel „Messias“. Die Apposition mit Kommas und bestimmtem Artikel macht das im Deutschen idiomatisch deutlich, obwohl der griechische Eigenname samt Titel hier keinen Artikel trägt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in der Titelfolge τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: des Messias
  alternative: Christus
  rationale: Χριστός trägt hier weiterhin den Sinn des Titels „Messias“. „Jesus, des Messias“ bewahrt diese Bedeutung und vermeidet, den Titel bloß wie einen zweiten Namen erscheinen zu lassen.
- issue: Stärke der Aussage παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: ihr Leben eingesetzt haben
  alternative: ihr Leben hingegeben haben
  rationale: Der Ausdruck beschreibt eine tatsächliche Selbstgefährdung bis hin zur Todesgefahr, sagt aber nicht, dass Barnabas und Paulus bereits gestorben sind. Die gewählte Formulierung erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist ein Satzfragment, weil er syntaktisch an Apostelgeschichte 15,25 anschließt; der Dativ „Männern“ wurde deshalb beibehalten. Die Formulierung „für den Namen“ wahrt bewusst den biblischen Klang.
