  variant: modern standard German
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: de
  text: Warum stellt ihr denn jetzt Gott auf die Probe, indem ihr den Jüngern ein Joch auf den Nacken legt, das weder unsere Vorfahren noch wir tragen konnten?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Joch“ ist ein Bild für eine auferlegte Verpflichtung; im Zusammenhang geht es um Forderungen, die den Jüngern auferlegt werden.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: jetzt also
  rationale: Gibt sowohl den zeitlichen Bezug von νῦν als auch die folgernde Kraft von οὖν in natürlichem modernem Deutsch wieder.
- source_word: τί πειράζετε τὸν θεόν
  choice: warum stellt ihr Gott ... auf die Probe
  rationale: In der rhetorischen Frage entspricht τί idiomatisch „warum“; „auf die Probe stellen“ bewahrt die Bedeutung des Ausdrucks mit πειράζω.
- source_word: ἐπιθεῖναι
  choice: indem ihr ... legt
  rationale: Der Infinitiv erläutert, worin das Erproben Gottes besteht; die Konstruktion mit „indem“ macht diesen Zusammenhang im Deutschen klar.
- source_word: ζυγὸν ἐπὶ τὸν τράχηλον
  choice: ein Joch auf den Nacken
  rationale: Bewahrt das anschauliche Bild des griechischen Textes, ohne es im Haupttext deutend durch „Pflicht“ oder „Last“ zu ersetzen.
- source_word: τῶν μαθητῶν
  choice: den Jüngern
  rationale: „Jünger“ ist im Kontext der Apostelgeschichte die geläufige und sachgemäße Wiedergabe von μαθηταί.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: weder unsere Vorfahren noch wir
  rationale: πατέρες bezeichnet hier frühere Generationen Israels; „Vorfahren“ ist im heutigen Deutsch eindeutig und natürlich.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: tragen konnten
  rationale: Gibt die Fähigkeit ausdrückende Verbindung idiomatisch wieder und hält zugleich die Joch-Metapher aufrecht.
theological_decisions:
- issue: Bedeutung des Jochs
  choice: Die Metapher bleibt unaufgelöst stehen und bezeichnet eine auferlegte Verpflichtung.
  alternative: Das Joch ausdrücklich mit dem gesamten mosaischen Gesetz oder enger mit Beschneidung und zugehörigen Forderungen gleichsetzen.
  rationale: Der unmittelbare Zusammenhang betrifft Anforderungen an nichtjüdische Gläubige; der Vers selbst bestimmt den Umfang des Jochs jedoch nicht ausdrücklich. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe der Frage und das konkrete Bild des Jochs werden bewahrt; „Vorfahren“ vermeidet die mögliche moderne Fehlauffassung, nur die unmittelbaren Väter seien gemeint.
