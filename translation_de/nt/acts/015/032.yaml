source:
  edition: SBLGNT
  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: de
  text: Judas und Silas, die selbst Propheten waren, ermutigten die Brüder[a] ausführlich und stärkten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Brüder und Schwestern“. Das griechische Wort lautet „Brüder“ und kann hier die ganze Gemeinschaft der Glaubenden bezeichnen.'
    reason: 'Lexikalische Alternative: möglicher inklusiver Bezug des maskulinen Plurals.'
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Die im deutschen Neuen Testament übliche Namensform für diese Person; sie unterscheidet nicht künstlich zwischen identischen griechischen Namensformen.
- source_word: τε καὶ
  choice: und
  rationale: Verbindet Judas und Silas eng miteinander; das schlichte „und“ ist im Deutschen natürlich und gibt die Koordination angemessen wieder.
- source_word: Σιλᾶς
  choice: Silas
  rationale: Die etablierte deutsche Wiedergabe des Personennamens.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: die auch selbst Propheten waren
  rationale: Gibt die begleitende Partizipialkonstruktion sowie die Betonung durch καὶ αὐτοὶ wieder. „Auch selbst“ lässt erkennen, dass Judas und Silas persönlich Propheten waren, ohne die Konstruktion unnötig kausal festzulegen.
- source_word: προφῆται
  choice: Propheten
  rationale: Direkte, geläufige Wiedergabe, die die bezeichnete Rolle nicht abschwächt oder umschreibt.
- source_word: διὰ λόγου πολλοῦ
  choice: ausführlich
  rationale: Die wörtliche Wendung „durch viel Rede/Wort“ bezeichnet hier ausgedehntes Reden. „Ausführlich“ ist natürliches modernes Deutsch und bewahrt den Umfang ihrer mündlichen Ermutigung.
- source_word: παρεκάλεσαν
  choice: ermutigten
  rationale: παρακαλέω umfasst Ermutigen, Ermahnen und Zusprechen. Im Zusammenhang mit der anschließenden Stärkung ist „ermutigten“ verständlich und pastoral passend, ohne den Aufrufcharakter völlig auszuschließen.
- source_word: τοὺς ἀδελφοὺς
  choice: die Brüder
  rationale: Bewahrt die grammatisch maskuline Form des griechischen Ausdrucks. Da dieser im frühchristlichen Sprachgebrauch die gesamte Glaubensgemeinschaft einschließlich Frauen bezeichnen kann, erläutert eine Fußnote den möglichen inklusiven Bezug.
- source_word: ἐπεστήριξαν
  choice: stärkten sie
  rationale: Gibt das Festigen oder Starkmachen klar wieder und hält die zweite Handlung von der vorausgehenden Ermutigung unterschieden.
theological_decisions:
- issue: Bezug von ἀδελφοὺς auf eine möglicherweise gemischte Glaubensgemeinschaft
  choice: die Brüder
  alternative: die Brüder und Schwestern; die Glaubenden
  rationale: Der griechische Text hat die maskuline Pluralform „Brüder“, die im damaligen christlichen Sprachgebrauch häufig die gesamte Gemeinschaft einschließen konnte. Der Haupttext wahrt die Form; die Fußnote macht die mögliche inklusive Bedeutung sichtbar.
- issue: Bedeutungsbreite von παρακαλέω
  choice: ermutigten
  alternative: ermahnten; sprachen ihnen zu
  rationale: Der Kontext erlaubt sowohl ermutigendes Zusprechen als auch eindringliches Ermahnen. „Ermutigten“ passt zur anschließenden Stärkung, ohne eine besondere Lehrtradition einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Ausgangstext, ist aber flüssig. „Ausführlich“ vermeidet die unnatürliche wörtliche Form „mit vielen Worten“; „auch selbst“ bewahrt die Hervorhebung der prophetischen Rolle.
