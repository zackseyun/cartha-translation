revisions:
- from: Da wir gehört haben, dass einige aus unserer Mitte aufgebrochen sind und euch mit ihren Worten beunruhigt und innerlich verunsichert haben[a] – ihnen hatten wir keinen Auftrag erteilt[b] –,
  to: Da wir gehört haben, dass einige aus unserer Mitte hervorgegangen sind und euch durch ihre Worte beunruhigt und zutiefst verunsichert haben[a], denen wir keine Weisung gegeben hatten[b],
  rationale: Die Revision ersetzt die unpräzise Bewegungsformulierung, beseitigt die inhaltlich unzutreffende Fußnote und gibt den abschließenden Relativsatz ohne künstliche Parenthese wieder. Sie bewahrt die offene Satzstruktur des Briefes, die kausale Einleitung, die doppelte Wirkung der Worte und die fehlende Autorisierung der betreffenden Personen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:03Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Kausalsatz, die Herkunft der betreffenden Personen, die durch Worte verursachte Beunruhigung und die fehlende Weisung der Absender im Wesentlichen zutreffend wieder. „Aufgebrochen“ ist jedoch für ἐξελθόντες weniger präzise, da es vor allem den Beginn einer Reise bezeichnet; „aus unserer Mitte hervorgegangen sind“ bildet Herkunft und Weggang sachgerechter ab. Die doppelte Wiedergabe von ἐτάραξαν und ἀνασκευάζοντες als „beunruhigt und innerlich verunsichert“ ist möglich, aber die Fußnote behauptet für ἀνασκευάζοντες eine wörtliche Bedeutung, die der griechische Ausdruck nicht hat.
  naturalness: Der Satz ist grundsätzlich flüssig und angemessen würdevoll. Die Gedankenstriche machen den griechischen Relativsatz unnötig zu einem parenthetischen Einschub. Eine direkte koordinierende Formulierung ist im modernen Deutsch klarer und wahrt den Bezug auf „einige“ eindeutig.
  terminology: „Keinen Auftrag erteilt“ ist als kontextuelle Wiedergabe von οἷς οὐ διεστειλάμεθα vertretbar, jedoch etwas stärker institutionalisierend als „nichts angeordnet“ bzw. „keine Weisung gegeben“. „Keine Weisung gegeben“ erhält den Befehls-/Anweisungscharakter von διαστέλλομαι, ohne eine bestimmte kirchenrechtliche Struktur einzutragen. Für ψυχή ist „euch ... zutiefst verunsichert“ idiomatisch; eine Fußnote kann die wörtliche Formulierung „eure Seelen“ korrekt ausweisen.
  issues:
  - severity: medium
    issue: Die Fußnote a bietet eine unzutreffende wörtliche Wiedergabe.
    rationale: ἀνασκευάζοντες bedeutet hier etwa „verwirren“, „in Unruhe versetzen“ oder „aus dem Konzept bringen“; „eure Seelen aus dem Gleichgewicht gebracht“ ist keine wörtliche Übersetzung und verschiebt die Bildlichkeit.
  - severity: low
    issue: „Aufgebrochen sind“ ist für ἐξελθόντες semantisch enger als der griechische Ausdruck.
    rationale: Das Partizip bezeichnet das Herausgehen/Weggehen aus der Gruppe. „Aufbrechen“ kann zwar passen, betont aber den Reisebeginn und klingt ohne Zielangabe etwas markiert.
  - severity: low
    issue: Die Gedankenstriche behandeln den Relativsatz als Einschub.
    rationale: οἷς οὐ διεστειλάμεθα ist ein unmittelbar anschließender Relativsatz über die genannten Männer. Eine direkte Formulierung liest sich natürlicher und lässt die griechische Satzführung besser erkennen.
