source:
  edition: SBLGNT
  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: de
  text: Da wir gehört haben, dass einige aus unserer Mitte hervorgegangen sind und euch durch ihre Worte beunruhigt und zutiefst verunsichert haben[a], denen wir keine Weisung gegeben hatten[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eure Seelen“. Gemeint sind die Adressaten in ihrem inneren Erleben und in ihrer ganzen Person.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denen wir nichts angeordnet hatten“ oder „denen wir keinen Auftrag erteilt hatten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Da
  rationale: Leitet in natürlichem Deutsch den Grund für die folgende Erklärung ein und bewahrt die kausale Funktion.
- source_word: ἠκούσαμεν
  choice: wir gehört haben
  rationale: Das deutsche Perfekt gibt den erhaltenen Bericht mit seiner gegenwärtigen Bedeutung im Briefzusammenhang idiomatisch wieder.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: einige aus unserer Mitte aufgebrochen sind
  rationale: „Aus unserer Mitte“ bezeichnet die Herkunft aus der Jerusalemer Gruppe; „aufgebrochen“ bewahrt den Gedanken des Weggehens, ohne ein im Griechischen nicht ausdrücklich genanntes Ziel hinzuzufügen.
- source_word: ἐτάραξαν
  choice: beunruhigt
  rationale: Drückt die verursachte Unruhe oder Erschütterung klar und in angemessenem pastoralem Ton aus.
- source_word: λόγοις
  choice: mit ihren Worten
  rationale: Gibt den instrumentalen Dativ natürlich wieder; das Possessivpronomen ist im Deutschen zur eindeutigen Zuordnung idiomatisch.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: innerlich verunsichert
  rationale: Gibt die starke Wirkung auf das innere Leben der Angesprochenen verständlich wieder, ohne ψυχή auf bloße Gefühle oder auf einen technisch-metaphysischen Seelenbegriff einzuengen.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: ihnen hatten wir keinen Auftrag erteilt
  rationale: Macht den Bezug des Relativpronomens auf die zuvor genannten Personen eindeutig und wahrt die ausdrückliche Verneinung einer Beauftragung durch die Jerusalemer Gemeinde beziehungsweise ihre Leiter.
theological_decisions:
- issue: Fehlende Beauftragung der Unruhestifter
  choice: ihnen hatten wir keinen Auftrag erteilt
  alternative: denen wir nichts angeordnet hatten
  rationale: Die Formulierung hält fest, dass diese Personen nicht im Auftrag der Absender handelten. Sie vermeidet zugleich, über den Wortlaut hinaus eine bestimmte kirchenrechtliche Struktur vorauszusetzen.
- issue: Bedeutung von ψυχή in der Wendung τὰς ψυχὰς ὑμῶν
  choice: innerlich
  alternative: eure Seelen
  rationale: ψυχή bezeichnet hier die betroffenen Personen in ihrem inneren Leben. „Innerlich“ bewahrt diesen Sinn in heutigem Deutsch, ohne die Aussage ausschließlich auf Emotionen zu beschränken oder eine Leib-Seele-Lehre einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als abhängiger, in den folgenden Vers hineinführender Briefsatz offen. Gedankenstriche verdeutlichen den eingeschobenen Hinweis auf die fehlende Beauftragung, ohne ein im Griechischen nicht vorhandenes „obwohl“ einzuführen.
