  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: de
  text: 'Nach eingehender Diskussion stand Petrus auf und sagte zu ihnen: „Brüder[a], ihr wisst, dass Gott mich schon vor langer Zeit[b] unter euch dazu erwählt hat, dass die Nichtjuden[c] durch meinen Mund die Botschaft des Evangeliums hören und glauben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Männer, Brüder“. Die griechische Anrede steht im maskulinen Plural; als herkömmliche Anrede kann sie auch einen größeren vertretenen Personenkreis betreffen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von frühen Tagen an“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Völker“. Gemeint sind hier Menschen aus den nichtjüdischen Völkern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: Nachdem es zu einer langen Debatte gekommen war
  rationale: Der Genitivus absolutus bezeichnet den vorausgehenden Umstand. „Debatte“ gibt die eingehende, kontroverse Beratung im Kontext natürlich wieder, ohne offene Feindseligkeit zu unterstellen.
- source_word: ἀναστὰς
  choice: stand ... auf
  rationale: Das Aoristpartizip beschreibt die der Rede vorausgehende konkrete Handlung des Petrus.
- source_word: Ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Die knappe Anrede bewahrt die maskuline Form und den familiären Ton; die ausführlichere wörtliche Alternative wird in der Fußnote genannt.
- source_word: ἐπίστασθε
  choice: ihr wisst
  rationale: Dies ist die direkte und natürliche Wiedergabe des bereits vorhandenen Wissens der Angesprochenen.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: schon vor langer Zeit
  rationale: Die Wendung verweist im Zusammenhang auf eine deutlich frühere Phase der jungen Gemeinde. Die idiomatische Formulierung vermeidet das im Deutschen missverständliche „seit alten Tagen“.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: Gott ... unter euch die Wahl getroffen hat
  rationale: Die Formulierung erhält ἐν ὑμῖν als „unter euch“ und gibt ἐξελέξατο wieder, ohne das nicht ausdrücklich genannte Petrus als direktes Objekt grammatisch einzusetzen.
- source_word: διὰ τοῦ στόματός μου
  choice: durch meinen Mund
  rationale: Die bildhafte Instrumentalform des Griechischen bleibt erhalten und hebt Petrus als Verkündiger hervor.
- source_word: τὰ ἔθνη
  choice: die Nichtjuden
  rationale: Im Kontext des Apostelkonzils sind Menschen aus den Völkern im Unterschied zu Juden gemeint. „Nichtjuden“ ist im modernen Deutsch unmittelbar verständlich; die allgemeinere Bedeutung steht in der Fußnote.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: die Botschaft des Evangeliums
  rationale: λόγος bezeichnet hier die verkündete Botschaft. Diese Wiedergabe ist natürlich und bewahrt zugleich den etablierten Begriff „Evangelium“.
- source_word: ἀκοῦσαι ... καὶ πιστεῦσαι
  choice: hören und glauben sollten
  rationale: Die koordinierten Aoristinfinitive werden parallel wiedergegeben. „Glauben“ bleibt ohne ergänzendes Objekt stehen, wie im Griechischen.
theological_decisions:
- issue: Geschlechtsspezifische Anrede Ἄνδρες ἀδελφοί
  choice: Brüder
  alternative: Männer, Brüder; Brüder und Schwestern
  rationale: „Brüder“ bewahrt Form und Gemeinschaftston der konventionellen maskulinen Anrede. „Brüder und Schwestern“ würde eine im Wortlaut nicht vorhandene Ergänzung vornehmen; die mögliche repräsentative Reichweite wird in der Fußnote erläutert.
- issue: Referenz von τὰ ἔθνη
  choice: die Nichtjuden
  alternative: die Völker
  rationale: Die Beratung in Apostelgeschichte 15 betrifft ausdrücklich nichtjüdische Glaubende. Die kontextuelle Wiedergabe erhält die heilsgeschichtlich wichtige Unterscheidung, während die breitere lexikalische Möglichkeit in der Fußnote dokumentiert wird.
- issue: Syntax von ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: Gott hat unter euch die Wahl getroffen
  alternative: Gott hat mich unter euch erwählt; Gott hat unter euch erwählt
  rationale: Im überlieferten griechischen Wortlaut fehlt ein ausdrückliches Objekt zu „erwählen“. Die gewählte Form wahrt diese syntaktische Offenheit, während der folgende Ausdruck „durch meinen Mund“ Petrus’ Rolle erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des Griechischen, wird aber idiomatisch gegliedert. „Botschaft des Evangeliums“ vermeidet das im heutigen Deutsch sperrige „Wort des Evangeliums“. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Formulierung.
