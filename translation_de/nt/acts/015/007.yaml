  terminology: „Brüder“, „Nichtjuden“ und „Botschaft des Evangeliums“ sind im Kontext passend. „Nichtjuden“ gibt τὰ ἔθνη kontextgerecht wieder; die lexikalische Alternative „Völker“ wird in einer Fußnote dokumentiert. Die Zeitangabe erhält eine eigene Fußnote für „von frühen Tagen an“, damit die weniger idiomatische, aber mögliche Nähe zum griechischen Wortlaut nachvollziehbar bleibt.
