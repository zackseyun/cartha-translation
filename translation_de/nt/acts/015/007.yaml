revisions:
- from: 'Nachdem es zu einer langen Debatte gekommen war, stand Petrus auf und sagte zu ihnen: „Brüder[a], ihr wisst, dass Gott schon vor langer Zeit unter euch die Wahl getroffen hat, dass durch meinen Mund die Nichtjuden[b] die Botschaft des Evangeliums hören und glauben sollten.“'
  to: 'Nach eingehender Diskussion stand Petrus auf und sagte zu ihnen: „Brüder[a], ihr wisst, dass Gott mich schon vor langer Zeit[b] unter euch dazu erwählt hat, dass die Nichtjuden[c] durch meinen Mund die Botschaft des Evangeliums hören und glauben.“'
  rationale: Die Revision ersetzt die unidiomatische und semantisch abgeschwächte Umschreibung von ἐξελέξατο durch „mich ... dazu erwählt hat“. Das explizite „mich“ ist keine zusätzliche theologische Deutung, sondern die im Deutschen notwendige Entfaltung des im griechischen Kontext eindeutig implizierten Bezugs auf Petrus. Die Zweckbestimmung bleibt mit „dass ... hören und glauben“ erhalten. Fußnotenmarker sind unmittelbar an den jeweiligen Ausdrücken verankert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:03Z'
