  source_fidelity: 'Die Übersetzung trifft den Sinn des Verses weitgehend: die vorausgehende ausführliche Beratung, Petrus’ Aufstehen, die Anrede, die Kenntnis der Anwesenden, die nichtjüdischen Völker sowie das Hören und Glauben. Die Wendung „unter euch die Wahl getroffen hat“ gibt ἐξελέξατο jedoch nicht angemessen wieder und erzeugt im Deutschen eine sachlich-abstrakte und syntaktisch missverständliche Konstruktion. Obwohl das griechische Objekt von „erwählte“ nicht ausgedrückt ist, wird Petrus durch „durch meinen Mund“ eindeutig als der Erwählte erschlossen; im Deutschen ist die Ergänzung „mich“ zur verständlichen Wiedergabe erforderlich.'
