id: ACT.15.3
reference: Acts 15:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: de
  text: Nachdem die Gemeinde sie also auf den Weg begleitet hatte, zogen sie durch Phönizien und Samarien und berichteten ausführlich von der Umkehr der Nichtjuden[a]. Damit bereiteten sie allen Brüdern große Freude[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Bekehrung der Nichtjuden“; wörtlicher: „von der Umkehr der Völker“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Brüdern“ sind hier wahrscheinlich die Glaubenden insgesamt gemeint, einschließlich der Frauen.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: bei der Weiterreise geholfen hatte
  rationale: προπέμπω bezeichnet häufig, jemanden für die Weiterreise zu begleiten, auszurüsten oder anderweitig zu unterstützen. Die Formulierung bewahrt diese Reisehilfe, ohne eine konkrete Art der Unterstützung festzulegen.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: Im Kontext der Apostelgeschichte bezeichnet ἐκκλησία die örtliche christliche Gemeinschaft; „Gemeinde“ ist dafür im modernen Standarddeutsch natürlich und präzise.
- source_word: διήρχοντο
  choice: zogen sie durch
  rationale: Das Imperfekt schildert die fortlaufende Reise durch die beiden Gebiete. „zogen … durch“ passt zum erzählenden Register.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: durch Phönizien und Samarien
  rationale: Die eng verbindende Konstruktion τε … καί wird im Deutschen natürlich durch „und“ wiedergegeben; „durch“ gilt für beide Regionen.
- source_word: ἐκδιηγούμενοι
  choice: berichteten ausführlich
  rationale: Das zusammengesetzte Verb bezeichnet ein eingehendes Erzählen oder Berichten; „ausführlich“ erhält diese verstärkende Nuance.
- source_word: ἐπιστροφὴν
  choice: Umkehr
  rationale: „Umkehr“ bewahrt das Bild des Sich-Hinwendens und ist im religiösen Kontext verständlich, ohne den Ausdruck unnötig als späteren Fachbegriff festzulegen.
- source_word: τῶν ἐθνῶν
  choice: der Nichtjuden
  rationale: Im Zusammenhang von Apostelgeschichte 15 sind Menschen aus den Völkern im Unterschied zu Juden gemeint. „Nichtjuden“ macht diesen Gegensatz heutigen Lesern unmittelbar verständlich.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: bereiteten … große Freude
  rationale: Die griechische Wendung mit ποιέω wird idiomatisch und mit ihrer verursachenden Bedeutung wiedergegeben.
- source_word: ἀδελφοῖς
  choice: Brüdern
  rationale: Die grammatisch maskuline Bezeichnung bleibt im Haupttext sichtbar. Eine Fußnote erläutert, dass hier wahrscheinlich die Glaubensgemeinschaft einschließlich der Frauen gemeint ist.
theological_decisions:
- issue: Bedeutung von ἐπιστροφή bei der Aufnahme der Nichtjuden
  choice: Umkehr
  alternative: Bekehrung
  rationale: „Umkehr“ gibt die Hinwendung der Nichtjuden zu Gott wieder und bewahrt zugleich die bildhafte Offenheit des griechischen Ausdrucks. „Bekehrung“ wäre kontextuell möglich, klingt jedoch stärker nach einem feststehenden theologischen Fachbegriff.
- issue: Referenz von ἀδελφοί in der Glaubensgemeinschaft
  choice: Brüder mit erläuternder Fußnote
  alternative: Brüder und Schwestern / Glaubensgeschwister
  rationale: Die Wiedergabe erhält die maskuline Form des Ausgangstextes, während die Fußnote den wahrscheinlich umfassenden Bezug auf männliche und weibliche Glaubende klarstellt.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der erste Satz bildet die fortlaufende Reisebewegung ab; der zweite hebt die Wirkung des Berichts klar hervor. Die Formulierungen vermeiden konfessionelle Sonderbegriffe und bewahren die in ἐπιστροφή liegende Spannung zwischen bildhafter „Umkehr“ und religiöser „Bekehrung“.
