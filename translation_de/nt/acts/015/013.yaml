base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: de
  text: 'Nachdem sie aufgehört hatten zu reden[a], antwortete Jakobus: »Männer und Brüder[b], hört mir zu!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem sie still geworden waren.“ Der griechische Ausdruck bezeichnet den Zeitpunkt, nachdem die vorherigen Redner zu sprechen aufgehört hatten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Männer, Brüder“. Die Wendung ist eine förmliche, an Männer gerichtete Anrede.'
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Nachdem sie aufgehört hatten zu reden
  rationale: μετά mit dem substantivierten Infinitiv bezeichnet die nachfolgende Zeit; σιγάω meint hier, dass die vorherigen Redner ihr Sprechen beendeten. Die Formulierung ist im Deutschen klar und natürlich.
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: ἀποκρίνομαι bedeutet gewöhnlich „antworten“ oder „erwidern“. „Antwortete“ bewahrt den Zusammenhang der vorausgehenden Beratungsreden.
- source_word: Ἰάκωβος
  choice: Jakobus
  rationale: Für Ἰάκωβος ist „Jakobus“ die etablierte deutsche Namensform im Neuen Testament.
- source_word: λέγων
  choice: durch den Doppelpunkt wiedergegeben
  rationale: Das Partizip leitet die direkte Rede ein. Ein Doppelpunkt gibt diese Funktion im modernen Deutschen natürlicher wieder als das schwerfällige „indem er sagte“.
- source_word: Ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Die beiden maskulinen Vokative bilden eine förmliche Anrede. „Brüder“ ist im heutigen Deutschen die natürliche Wiedergabe; die wörtliche Form und ihr männlicher Charakter werden in der Fußnote offengelegt.
- source_word: ἀκούσατέ μου
  choice: hört mir zu
  rationale: Der Imperativ fordert zu aufmerksamem Hören auf. „Hört mir zu“ ist idiomatisch und bewahrt die direkte Aufforderung.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Versammlung
  choice: „Brüder“ im Haupttext, mit Erläuterung der wörtlichen doppelten männlichen Anrede in einer Fußnote
  alternative: „Ihr Männer, Brüder“ beziehungsweise „Männer und Brüder“
  rationale: ἄνδρες und ἀδελφοί sind beide maskuline Vokative. Eine mechanische Doppelung klingt im modernen Deutschen jedoch missverständlich oder unnatürlich. „Brüder“ bewahrt die ausdrücklich männliche Anrede, während die Fußnote die vollständige griechische Form dokumentiert, ohne sie zu verallgemeinern.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt ersetzt die im Deutschen unnötig schwere Wiedergabe von λέγων. Die direkte Rede bleibt knapp und nachdrücklich.
