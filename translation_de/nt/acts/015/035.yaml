  rationale: Die Revision stellt „das Wort des Herrn“ unmittelbar als gemeinsames Objekt von „lehrten und verkündeten“ heraus. Damit bleibt der griechische Satzbau in seiner Aussage erhalten, ohne die unidiomatische und missverständliche Apposition „die gute Nachricht, das Wort des Herrn“ zu verwenden. „Zusammen mit vielen anderen“ gibt μετὰ καὶ ἑτέρων πολλῶν weiterhin natürlich wieder.
