id: ACT.15.35
reference: Acts 15:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: de
  text: Paulus und Barnabas aber blieben in Antiochia[a] und lehrten und verkündeten zusammen mit vielen anderen das Wort des Herrn[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verbrachten einige Zeit in Antiochia«. Das griechische Verb kann hervorheben, dass sie sich dort eine Zeit lang aufhielten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verkündeten das Evangelium«. Das griechische Verb bezeichnet das Verkündigen einer guten Nachricht.'
    reason: lexical_alternative
  - marker: c
    text: '»Das Wort des Herrn« ist in der Apostelgeschichte eine geläufige Bezeichnung für die Botschaft des Herrn; möglich ist auch: »die Botschaft des Herrn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: blieben
  rationale: Das Imperfekt bezeichnet einen andauernden Aufenthalt. »Blieben« ist natürlich und bewahrt den durativen Sinn; die mögliche Nuance »verbrachten einige Zeit« wird in der Fußnote genannt.
- source_word: διδάσκοντες
  choice: lehrten
  rationale: Die finite Wiedergabe bildet die fortdauernde, den Aufenthalt begleitende Tätigkeit in natürlichem Deutsch ab.
- source_word: εὐαγγελιζόμενοι
  choice: verkündeten die gute Nachricht
  rationale: Das Verb bezeichnet das Bekanntmachen einer guten Nachricht. Diese Formulierung ist gegenwärtig und verständlich, ohne den spezifischen Bedeutungsgehalt aufzugeben.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: zusammen mit vielen anderen
  rationale: Die Formulierung macht deutlich, dass Paulus und Barnabas diese Tätigkeit nicht allein ausübten, und gibt die additive Kraft von καί idiomatisch wieder.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: λόγος kann »Wort« oder »Botschaft« bedeuten. »Das Wort des Herrn« bewahrt die in der Apostelgeschichte wiederkehrende Ausdrucksweise und ihre literarisch-theologische Verbindung.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Der Titel κύριος wird ohne weitergehende Festlegung seines Bezugs als »Herr« wiedergegeben.
theological_decisions:
- issue: Bezug von »Herr« in »das Wort des Herrn«
  choice: Die griechische Titulierung wird neutral als »des Herrn« bewahrt.
  alternative: »das Wort des Herrn Jesus« oder »die Botschaft Gottes«
  rationale: In der Apostelgeschichte kann »der Herr« besonders auf Jesus weisen; der griechische Text nennt hier jedoch nur den Titel κύριος. Eine ausdrückliche Identifizierung würde die vorhandene Offenheit auflösen.
- issue: Verhältnis von »gute Nachricht verkünden« und »Wort des Herrn«
  choice: »das Wort des Herrn« steht als Apposition und bezeichnet den Inhalt des Lehrens und Verkündigens.
  alternative: Nur auf »die gute Nachricht verkündeten« beziehen
  rationale: Die beiden Partizipien διδάσκοντες und εὐαγγελιζόμενοι teilen sich das Akkusativobjekt τὸν λόγον τοῦ κυρίου. Die deutsche Satzgestaltung soll den Bezug auf beide Tätigkeiten ermöglichen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die finite Wiedergabe der griechischen Partizipien vermeidet eine schwerfällige deutsche Satzstruktur. »Antiochia« folgt der etablierten deutschen Namensform.
