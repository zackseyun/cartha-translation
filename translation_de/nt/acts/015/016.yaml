id: ACT.15.16
reference: Acts 15:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: de
  text: Danach werde ich zurückkehren und das eingestürzte Zelt Davids[a][b] wieder aufbauen; seine Trümmer werde ich wieder aufbauen und es wieder aufrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Hütte Davids“. Das griechische Wort bezeichnet ein Zelt und kann je nach Zusammenhang auch eine heilige Zeltwohnung meinen.'
    reason: lexical_alternative
  - marker: b
    text: Das „Zelt Davids“ ist ein prophetisches Bild für die Wiederherstellung, die mit Davids Linie oder Königtum verbunden ist.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Die zeitliche Abfolge wird in natürlichem modernem Deutsch wiedergegeben. Das wörtlichere „Nach diesen Dingen“ wäre möglich, klingt hier jedoch unnötig schwerfällig.
- source_word: ἀναστρέψω
  choice: werde ich zurückkehren
  rationale: Das Verb bezeichnet hier am ehesten ein Zurückkehren oder Sich-wieder-Zuwenden. „Zurückkehren“ bewahrt die Ich-Form der göttlichen Verheißung, ohne das Ziel der Rückkehr näher festzulegen.
- source_word: ἀνοικοδομήσω
  choice: werde ich … wieder aufbauen
  rationale: Das Verb bezeichnet erneutes Bauen beziehungsweise Wiederaufbauen und erhält so das Bild der Wiederherstellung.
- source_word: σκηνὴν Δαυὶδ
  choice: das Zelt Davids
  rationale: σκηνή bedeutet wörtlich „Zelt“ und kann je nach Zusammenhang auch eine heilige Zeltwohnung bezeichnen. „Zelt Davids“ bewahrt die prophetische Metapher, ohne sie vorschnell als Dynastie oder Königreich auszudeuten.
- source_word: τὴν πεπτωκυῖαν
  choice: das eingestürzte
  rationale: Das Perfektpartizip beschreibt den fortbestehenden Zustand nach dem Fallen. Bei einem Zelt gibt „eingestürzt“ dieses Bild im Deutschen natürlicher wieder als „gefallen“.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: seine Trümmer
  rationale: Das substantivierte neutrale Pluralpartizip bezeichnet das Niedergerissene oder Zerstörte. „Seine Trümmer“ gibt diesen kollektiven Sinn knapp und idiomatisch wieder.
- source_word: ἀνορθώσω
  choice: werde ich … wieder aufrichten
  rationale: Das Verb bedeutet aufrichten, gerade richten oder wiederherstellen. „Wieder aufrichten“ bewahrt hier sowohl das konkrete Zeltbild als auch den Gedanken der Wiederherstellung.
- source_word: αὐτήν
  choice: es
  rationale: Das Pronomen bezieht sich auf die im Griechischen feminine σκηνή. Im Deutschen ist „Zelt“ sächlich, daher lautet der natürliche Rückbezug „es“.
theological_decisions:
- issue: Metaphorische Bedeutung des „Zeltes Davids“
  choice: Die Metapher „Zelt Davids“ bleibt im Haupttext erhalten.
  alternative: Davids Königshaus; Davids zerfallenes Königtum
  rationale: Die prophetische Formulierung weist auf eine mit Davids Linie oder Herrschaft verbundene Wiederherstellung hin, benennt diese Deutung aber nicht unmittelbar. Die bildhafte und theologisch offene Ausdrucksweise des griechischen Textes wird deshalb nicht durch eine auslegende Umschreibung ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt durch das Semikolon eng am dreigliedrigen Aufbau der griechischen Verheißung; die wiederholte Formulierung „wieder aufbauen“ wird bewusst beibehalten.
