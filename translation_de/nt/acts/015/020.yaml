id: ACT.15.20
reference: Acts 15:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: de
  text: sondern ihnen zu schreiben, dass sie sich von den Verunreinigungen im Zusammenhang mit Götzen[a], von sexueller Unmoral[b], von Ersticktem[c] und von Blut fernhalten sollen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „von den Verunreinigungen der Götzen“; gemeint sind Verunreinigungen im Zusammenhang mit Götzen. Manche Übersetzungen geben enger „Götzenopferfleisch“ wieder, doch der griechische Ausdruck ist hier weiter.
    reason: lexical_alternative
  - marker: b
    text: Oder „Unzucht“; der griechische Begriff kann sexuelle Unmoral allgemein bezeichnen. Manche verstehen ihn hier enger als verbotene sexuelle Verbindungen.
    reason: alternative_reading
  - marker: c
    text: Gemeint ist etwas von einem Tier, das erstickt wurde und dessen Blut daher nicht ordnungsgemäß abgelassen worden war.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: ihnen zu schreiben
  rationale: Das Verb bezeichnet hier im Zusammenhang des Jerusalemer Beschlusses eine schriftliche Mitteilung. „Ihnen zu schreiben“ ist natürlich und bewahrt den brieflichen Sinn.
- source_word: ἀπέχεσθαι
  choice: sich … fernhalten
  rationale: Die mediale Form bedeutet, sich einer Sache zu enthalten. „Sich fernhalten“ ist im heutigen Deutsch klar und passt zu allen Gliedern der Aufzählung.
- source_word: ἀλισγημάτων
  choice: Verunreinigungen
  rationale: Das seltene Wort bezeichnet kultische Verunreinigung oder Befleckung. „Verunreinigungen“ bewahrt diesen Sinn, ohne die Formulierung vorschnell auf bestimmte Speisen einzuengen.
- source_word: τῶν εἰδώλων
  choice: durch Götzen
  rationale: Der Genitiv bezeichnet die Zuordnung beziehungsweise Ursache der Verunreinigungen. „Durch Götzen“ macht den Zusammenhang im Deutschen verständlich, lässt den genauen Umfang des Verbots aber offen.
- source_word: πορνείας
  choice: sexueller Unmoral
  rationale: πορνεία kann sexuelle Unmoral allgemein bezeichnen. Die Wiedergabe ist modern und verständlich und beschränkt den Begriff nicht auf außerehelichen Geschlechtsverkehr.
- source_word: τοῦ πνικτοῦ
  choice: Ersticktem
  rationale: Das substantivierte Adjektiv bezeichnet ein ersticktes Tier beziehungsweise Fleisch von einem Tier, dessen Blut nicht abgelassen wurde. „Ersticktem“ bildet die knappe griechische Ausdrucksweise nach, ohne „Fleisch“ in den Haupttext einzufügen.
- source_word: τοῦ αἵματος
  choice: Blut
  rationale: Die knappe Wiedergabe entspricht dem griechischen Ausdruck und vermeidet es, die konkrete Art des Gebrauchs über den Wortlaut hinaus festzulegen.
theological_decisions:
- issue: Umfang des mit Götzen verbundenen Verbots
  choice: „Verunreinigungen durch Götzen“
  alternative: „Götzenopferfleisch“
  rationale: Der griechische Ausdruck ist weiter als die spezifische Bezeichnung für Götzenopferfleisch. Die gewählte Fassung bewahrt den kultischen Zusammenhang und vermeidet eine unbelegte Verengung.
- issue: Bedeutung von πορνεία im Aposteldekret
  choice: „sexuelle Unmoral“ als weiter Ausdruck
  alternative: „Unzucht“ oder spezifisch „verbotene sexuelle Verbindungen“
  rationale: Der Begriff kann allgemein sexuelle Verfehlungen oder in diesem Zusammenhang enger verbotene Verbindungen meinen. Der Haupttext hält diese Auslegungsfrage offen.
- issue: Geltungsweise der genannten Verbote
  choice: Die Verbote werden ohne Aussage über Dauer oder theologischen Status wiedergegeben.
  alternative: Deutung als zeitweilige Tischgemeinschaftsregeln oder als dauerhaft für alle Glaubenden bindende Gebote
  rationale: Der Vers nennt die Forderungen, entscheidet aber nicht ausdrücklich zwischen diesen weitergehenden theologischen Deutungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform schließt mit „sondern“ an den vorausgehenden Vers an. Die knappe Reihung des Griechischen bleibt erhalten; erklärungsbedürftige kultische und semantische Fragen werden in Fußnoten behandelt.
