id: ACT.15.30
reference: Acts 15:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: de
  text: Nachdem sie verabschiedet worden waren[a], zogen sie nach Antiochia hinab[b]. Dort riefen sie die ganze Versammlung zusammen[c] und übergaben ihr den Brief.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem sie entlassen worden waren.“ Das griechische Wort kann sowohl die formelle Verabschiedung als auch die Aussendung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Hinab“ gibt die Richtungsangabe des griechischen Verbs wieder; Jerusalem liegt höher als Antiochia.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Menge“ oder „die Gemeinschaft“. Gemeint ist die in Antiochia versammelte Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: Nachdem sie verabschiedet worden waren
  rationale: Das Partizip bezeichnet hier ihre formelle Entlassung beziehungsweise Aussendung durch die Jerusalemer Versammlung. „Verabschiedet“ ist im Deutschen natürlich und lässt beide Aspekte anklingen.
- source_word: κατῆλθον
  choice: zogen sie ... hinab
  rationale: Die Wiedergabe bewahrt die Richtungsangabe des griechischen Verbs und passt zur Reise vom höher gelegenen Jerusalem nach Antiochia.
- source_word: συναγαγόντες
  choice: riefen sie ... zusammen
  rationale: Das Aoristpartizip bezeichnet eine der Briefübergabe vorausgehende Handlung. Die finite Form mit „Dort“ gibt die Abfolge in natürlichem Deutsch wieder.
- source_word: τὸ πλῆθος
  choice: die ganze Gemeinschaft
  rationale: Gemeint ist im Kontext die versammelte Gruppe der Gläubigen in Antiochia. „Gemeinschaft“ ist verständlich und vermeidet sowohl das unnatürliche „Menge“ als auch eine zu stark institutionelle Festlegung.
- source_word: ἐπέδωκαν
  choice: übergaben
  rationale: Das Verb bezeichnet die förmliche Aushändigung des Schreibens an die versammelte Gemeinschaft.
- source_word: ἐπιστολήν
  choice: den Brief
  rationale: „Brief“ ist die übliche moderne deutsche Entsprechung und passt zum in den vorherigen Versen wiedergegebenen Schreiben.
theological_decisions:
- issue: Bezug von τὸ πλῆθος
  choice: die ganze Gemeinschaft
  alternative: die Versammlung; die Menge
  rationale: Der Kontext legt die Gemeinschaft der Gläubigen nahe, ohne eindeutig einen technischen kirchlichen Begriff zu verlangen. Die Fußnote erhält die mögliche allgemeinere Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung in zwei Sätze vermeidet eine schwerfällige Folge von Partizipialkonstruktionen; „ihr“ verdeutlicht idiomatisch, dass der Brief der zusammengerufenen Gemeinschaft übergeben wurde.
