  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: de
  text: Als sie den Brief gelesen hatten, freuten sie sich über die Ermutigung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „freuten sie sich über den Zuspruch“. Das griechische Wort kann auch „Ermahnung“ oder „Trost“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Als sie den Brief gelesen hatten
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Freude vorausgeht. Das im Griechischen nicht ausdrücklich genannte Objekt wird aus dem unmittelbaren Zusammenhang als „der Brief“ ergänzt; dies ist im Deutschen klarer als ein bloßes „ihn“.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ stellt hier nur eine leichte erzählerische Verbindung her. Im natürlichen Deutschen ist kein ausdrückliches Bindewort nötig.
- source_word: ἐχάρησαν
  choice: freuten sie sich
  rationale: χαίρω bezeichnet hier aktive Freude; „sich freuen“ gibt die übliche Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: ἐπὶ
  choice: über
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass beziehungsweise Grund der Freude. „Sich über etwas freuen“ ist die idiomatische deutsche Entsprechung und lässt Anlass und Ursache angemessen zusammenklingen.
- source_word: τῇ παρακλήσει
  choice: die Ermutigung
  rationale: παράκλησις kann Ermutigung, Zuspruch, Trost oder Ermahnung bedeuten. Im Zusammenhang beschreibt „Ermutigung“ am besten die stärkende Wirkung des Briefes, ohne die weiteren Bedeutungsnuancen auszuschließen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Den Brief“ wird zur Klarheit aus dem unmittelbaren Kontext ergänzt. Die Fußnote bewahrt die Bedeutungsbreite von παράκλησις.
