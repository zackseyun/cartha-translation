id: ACT.15.6
reference: Acts 15:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: de
  text: Da kamen die Apostel und die Ältesten zusammen, um über diese Frage zu beraten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »versammelten sich« beziehungsweise »traten zusammen«. Das griechische Verb steht formal im Passiv (»wurden versammelt«), kann hier aber natürlich das Zusammenkommen der Gruppe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »um wegen dieses Wortes zu sehen«. »Wort« bezeichnet hier die Angelegenheit oder Streitfrage, um die es ging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: kamen … zusammen
  rationale: Der Aorist Passiv von συνάγω kann in diesem Zusammenhang natürlich das Zusammentreten einer Gruppe bezeichnen. Die deutsche Formulierung gibt den Vorgang idiomatisch wieder, ohne ein äußeres Zusammenrufen zu behaupten.
- source_word: τε
  choice: Da
  rationale: Die Partikel verbindet den Satz leicht mit dem vorausgehenden Streitgespräch. „Da“ markiert in natürlichem Deutsch den erzählerischen Fortgang, ohne eine stärkere Schlussfolgerung auszudrücken.
- source_word: οἱ ἀπόστολοι
  choice: die Apostel
  rationale: Der etablierte Ausdruck bezeichnet hier die anerkannten apostolischen Leiter.
- source_word: οἱ πρεσβύτεροι
  choice: die Ältesten
  rationale: Gemeint sind anerkannte Leiter der Jerusalemer Gemeinde, nicht lediglich ältere Männer. „Älteste“ wahrt diese Bedeutung, ohne spätere Amtsstrukturen einzutragen.
- source_word: ἰδεῖν
  choice: zu beraten
  rationale: Das wörtliche „zu sehen“ bezeichnet hier die prüfende und abwägende Befassung mit der Streitfrage. „Beraten“ ist im Kontext einer Zusammenkunft natürlich und nimmt das Ergebnis nicht vorweg.
- source_word: περὶ τοῦ λόγου τούτου
  choice: über diese Frage
  rationale: λόγος bezeichnet hier die zuvor aufgeworfene Angelegenheit beziehungsweise Streitfrage. „Diese Frage“ knüpft klar an den Kontext an.
theological_decisions:
- issue: Institutionelle Bedeutung von πρεσβύτεροι
  choice: „Älteste“ ohne nähere konfessionelle Amtsbestimmung
  alternative: „Presbyter“ als technischer Ausdruck eines später entwickelten Kirchenamtes
  rationale: Der Text nennt anerkannte Leiter der Jerusalemer Gemeinde, legt aber keine spätere Kirchenverfassung fest.
- issue: Zweck der Zusammenkunft
  choice: „um über diese Frage zu beraten“
  alternative: „um diese Frage zu entscheiden“
  rationale: ἰδεῖν bezeichnet zunächst die prüfende Befassung mit der Angelegenheit; eine Übersetzung mit „entscheiden“ würde an dieser Stelle das Ergebnis vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zusammenkommen“ und „beraten“ sind allgemein verständlich; „Älteste“ bleibt als etablierte biblische Leitungsbezeichnung erhalten. Die beiden Fußnoten bewahren die formale Passivgestalt und die wörtliche Wendung mit λόγος.
