id: ACT.15.11
reference: Acts 15:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: de
  text: Vielmehr glauben wir, durch die Gnade des Herrn Jesus gerettet zu werden – auf dieselbe Weise wie auch sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »auf dieselbe Weise wie auch jene«. Gemeint sind im Zusammenhang die Menschen aus den anderen Völkern.'
    reason: referent_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: Vielmehr
  rationale: Markiert den starken Gegensatz zum zuvor genannten untragbaren Joch und klingt im Deutschen natürlich.
- source_word: διὰ τῆς χάριτος
  choice: durch die Gnade
  rationale: διά mit Genitiv bezeichnet hier das Mittel; die bestimmte Nominalgruppe bleibt erhalten.
- source_word: χάριτος
  choice: Gnade
  rationale: Gibt den etablierten Sinn göttlicher, rettender Zuwendung präzise wieder.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: des Herrn Jesus
  rationale: 'Der Genitiv bestimmt »Gnade« näher: die Gnade, die vom Herrn Jesus ausgeht beziehungsweise ihm zugehört.'
- source_word: πιστεύομεν
  choice: wir glauben
  rationale: Gibt die Überzeugung der Sprecher ohne zusätzliche dogmatische Auslegung wieder.
- source_word: σωθῆναι
  choice: gerettet zu werden
  rationale: Bewahrt die griechische Infinitivkonstruktion und lässt offen, ob der Schwerpunkt auf gegenwärtiger Gewissheit oder zukünftiger Vollendung liegt.
- source_word: καθ’ ὃν τρόπον
  choice: auf dieselbe Weise wie
  rationale: Gibt den Vergleich der Art und Weise klar und idiomatisch wieder.
- source_word: κἀκεῖνοι
  choice: auch sie
  rationale: Bewahrt καί (»auch«) und die Richtung des griechischen Vergleichs; das Prädikat ist aus dem vorangehenden Satzteil zu ergänzen.
theological_decisions:
- issue: Richtung des Vergleichs
  choice: »wir« werden auf dieselbe Weise gerettet wie »auch sie«
  alternative: Sie werden ebenso gerettet wie wir
  rationale: Die griechische Wortfolge nimmt die Rettung der nichtjüdischen Glaubenden als Vergleichspunkt für »uns«, also die jüdischen Glaubenden. Diese auffällige Richtung wird nicht umgekehrt.
- issue: Zeitlicher Bezug von σωθῆναι
  choice: 'Infinitivisch und zeitlich nicht ausdrücklich festgelegt: »gerettet zu werden«'
  alternative: »dass wir gerettet werden« oder »dass wir gerettet werden werden«
  rationale: Der Aoristinfinitiv bezeichnet hier nicht von sich aus eindeutig eine deutsche Zukunftsform. Die Formulierung bewahrt die Spannung zwischen Rettungsgewissheit und ihrer Vollendung.
- issue: Rettung durch Gnade
  choice: Rettung »durch die Gnade des Herrn Jesus« ohne dogmatische Erweiterung
  alternative: Erweiterungen wie »allein aus Gnade« oder zusätzliche Aussagen über Werke
  rationale: Der Vers nennt ausdrücklich die Gnade als Mittel der Rettung, formuliert hier aber keine weitergehende konfessionelle Lehrformel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vielmehr« trägt den starken Gegensatz; der Gedankenstrich gliedert den langen Satz. Die auffällige Vergleichsrichtung des griechischen Textes bleibt erhalten.
