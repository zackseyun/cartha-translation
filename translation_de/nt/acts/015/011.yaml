  verdict: approve
  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Satzes wieder: den starken Gegensatz (ἀλλὰ), das Mittel der Rettung (διὰ τῆς χάριτος), die Zuordnung zu »dem Herrn Jesus«, πιστεύομεν mit dem passiven Infinitiv σωθῆναι sowie die bewusst auffällige Vergleichsrichtung »wir … wie auch sie«. Die infinitivische Formulierung »gerettet zu werden« ist für σωθῆναι genau und vermeidet eine nicht ausdrücklich morphologisch markierte deutsche Zukunftsform.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Satzstellung ist klar; der Gedankenstrich macht die angehängte Vergleichsbestimmung gut lesbar. Die elliptische Ergänzung bei »wie auch sie« ist im Deutschen idiomatisch und entspricht der griechischen Ellipse.
  terminology: »Gnade«, »Herr Jesus« und »gerettet werden« sind etablierte, sachlich angemessene Wiedergaben ohne konfessionelle Zusätze. »Vielmehr« trägt den kontrastiven Nachdruck des Kontextes angemessen.
