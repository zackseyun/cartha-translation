source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: de
  text: 'Einige Tage später sagte Paulus zu Barnabas: »Lass uns nun zurückkehren und die Brüder[a] in jeder Stadt besuchen, in der wir das Wort des Herrn verkündet haben, und sehen, wie es ihnen geht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Brüdern und Schwestern«. Im Griechischen steht »Brüder«; die männliche Bezeichnung kann hier stellvertretend die ganze Gemeinschaft der Glaubenden einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Einige Tage später
  rationale: Die Wendung bezeichnet einen unbestimmten späteren Zeitpunkt. Diese Formulierung ist im modernen Deutschen natürlich und bleibt hinsichtlich der Dauer offen.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: sagte Paulus zu Barnabas
  rationale: Dies gibt das schlichte εἶπεν πρὸς unmittelbar und idiomatisch wieder.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Lass uns nun zurückkehren und … nach den Brüdern sehen
  rationale: Das Partizip Ἐπιστρέψαντες wird zusammen mit dem hortativen Konjunktiv als gemeinsame Aufforderung wiedergegeben. δὴ erhält durch „nun“ seine nachdrückliche, vorwärtsdrängende Funktion; ἐπισκέπτομαι bezeichnet hier einen von Anteilnahme getragenen Besuch.
- source_word: τοὺς ἀδελφοὺς
  choice: die Brüder
  rationale: Die maskuline familiäre Bezeichnung des griechischen Textes bleibt erhalten. Da sie hier wahrscheinlich die gesamte örtliche Glaubensgemeinschaft einschließlich Frauen bezeichnet, wird dies in einer Fußnote erläutert.
- source_word: κατὰ πόλιν πᾶσαν
  choice: in jeder Stadt
  rationale: Die distributive Konstruktion mit κατά wird knapp und natürlich wiedergegeben.
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: in der wir … verkündet haben
  rationale: καταγγέλλω bezeichnet eine öffentliche oder ausdrückliche Verkündigung; „verkündet“ trifft diesen Sinn.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: das Wort des Herrn
  rationale: Die traditionelle und zugleich genaue Formulierung bewahrt λόγος als „Wort“ und κύριος als „Herr“, ohne die Genitivbeziehung enger festzulegen.
- source_word: πῶς ἔχουσιν
  choice: wie es ihnen geht
  rationale: Die griechische Redewendung fragt nach dem Zustand oder Ergehen der Menschen; die deutsche Wendung ist klar und idiomatisch.
theological_decisions:
- issue: Bezeichnung einer wahrscheinlich gemischtgeschlechtlichen Glaubensgemeinschaft mit ἀδελφοί
  choice: Brüder im Haupttext mit erläuternder Fußnote
  alternative: Brüder und Schwestern; Glaubenden
  rationale: So bleibt die sprachliche Gestalt des griechischen Textes sichtbar, während die wahrscheinlich einschließende Referenz nicht verschwiegen wird.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ entspricht dem neutestamentlichen Gebrauch und bewahrt die christologische beziehungsweise theologische Tragweite, ohne sie hier näher aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt einladend und zielgerichtet. „Nach den Brüdern sehen“ verbindet den Gedanken des Besuchs mit fürsorglichem Interesse und führt natürlich zu „wie es ihnen geht“.
