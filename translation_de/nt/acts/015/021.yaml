- from: Denn Mose hat seit alters in jeder Stadt Menschen, die ihn verkünden[a], wobei er an jedem Sabbat in den Synagogen vorgelesen wird.
  to: Denn Mose hat seit alten Zeiten in jeder Stadt Verkündiger, und er wird jeden Sabbat in den Synagogen vorgelesen[a].
  rationale: Die Revision ersetzt die missverständliche „wobei“-Konstruktion durch eine natürliche koordinierte Formulierung. Dadurch bleiben das Passiv und die metonymische Personifizierung erhalten, während die nicht ausdrücklich markierte Beziehung des griechischen Partizips nicht als kausal festgelegt wird. Die Fußnote wurde an den revidierten Wortlaut angeglichen und präzisiert die Metonymie.
