  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: de
  text: Denn Mose hat seit alten Zeiten in jeder Stadt Verkündiger, und er wird jeden Sabbat in den Synagogen vorgelesen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich heißt es: „Mose … solche, die ihn verkünden … er wird vorgelesen.“ „Mose“ steht hier metonymisch für die mit ihm verbundenen Schriften beziehungsweise das mosaische Gesetz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Die im Deutschen eingebürgerte Namensform; zugleich bleibt die metonymische Redeweise des griechischen Textes erhalten.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet den Satz als Begründung beziehungsweise Erläuterung des vorausgehenden Urteils.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: seit alters
  rationale: Gibt die zeitliche Bedeutung einer seit längst vergangenen Generationen bestehenden Praxis natürlich und würdig wieder.
- source_word: κατὰ πόλιν
  choice: in jeder Stadt
  rationale: Das distributive κατά mit Singular bezeichnet eine Verteilung über die einzelnen Städte.
- source_word: τοὺς κηρύσσοντας αὐτόν
  choice: Menschen, die ihn verkünden
  rationale: κηρύσσω bezeichnet öffentliches Verkünden. Das Pronomen „ihn“ bewahrt die metonymische Personifizierung des Mose.
- source_word: ἔχει
  choice: hat
  rationale: Der griechische Präsens bezeichnet einen fortbestehenden Zustand; zusammen mit „seit alters“ ist diese Dauer im Deutschen klar.
- source_word: κατὰ πᾶν σάββατον
  choice: an jedem Sabbat
  rationale: Die distributive Wendung bezeichnet die regelmäßige Wiederholung an jedem Sabbat.
- source_word: ἀναγινωσκόμενος
  choice: wobei er … vorgelesen wird
  rationale: Die Formulierung wahrt den passiven, begleitenden Charakter des Partizips, ohne seine Beziehung ausdrücklich auf einen kausalen Sinn festzulegen.
theological_decisions:
- issue: Metonymische Bezeichnung der mosaischen Schriften als „Mose“
  choice: Die persönlichen Bezüge „Mose“, „ihn“ und „er“ bleiben im Haupttext erhalten.
  alternative: „Das Gesetz des Mose“ oder „die Schriften des Mose“ ausdrücklich einzusetzen.
  rationale: Der griechische Text nennt Mose selbst und gebraucht seinen Namen metonymisch für die mit ihm verbundenen Schriften beziehungsweise das Gesetz. Die Beibehaltung wahrt die Ausdrucksweise und vermeidet eine interpretierende Präzisierung im Haupttext.
- issue: Sinnbeziehung des Partizips ἀναγινωσκόμενος
  choice: Mit „wobei“ als begleitender Umstand wiedergegeben.
  alternative: 'Kausal: „da/weil er … vorgelesen wird“; rein koordinierend: „und er wird … vorgelesen“.'
  rationale: Das Partizip lässt die genaue logische Beziehung offen. „Wobei“ erhält diese Offenheit besser als eine ausdrücklich kausale Wiedergabe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. „Seit alters“ ist bewusst knapp und gehoben, aber weiterhin geläufig; die ungewöhnliche persönliche Rede von Mose wird wegen der Quellennähe beibehalten und durch die Fußnote erklärt.
