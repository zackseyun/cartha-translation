review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Satzes wieder: die begründende Funktion von γάρ, die lange zeitliche Dauer, die Verteilung auf die Städte, die metonymische Rede von Mose, die regelmäßige Sabbatlesung und das Passiv von ἀναγινωσκόμενος. Die logische Nuance des Partizips sollte nicht stärker kausal festgelegt werden, als der griechische Wortlaut es verlangt.'
  naturalness: „Wobei er … vorgelesen wird“ ist in diesem Satzbau schwerfällig und stellt im Deutschen eine unklare Beziehung zwischen den Verkündigern und der Lesung her. Eine koordinierte Wiedergabe ist flüssiger und lässt die vom Partizip lediglich nahegelegte Beziehung offen. „Seit alten Zeiten“ ist zudem im modernen Standarddeutsch klarer als „seit alters“, ohne den Sinn zu verändern.
  terminology: „Mose“ ist die übliche deutsche Namensform. Die metonymischen Pronomen bleiben sachgerecht erhalten; die Fußnote erklärt sie, ohne den Haupttext interpretierend zu erweitern. „Verkündiger“ gibt κηρύσσοντας knapp und idiomatisch wieder.
  issues:
  - severity: medium
    issue: Unklare und schwerfällige Anbindung durch „wobei“
    rationale: „Wobei“ bezeichnet im Deutschen gewöhnlich einen begleitenden Umstand zu einem klaren Bezugsereignis. Hier wirkt es, als beziehe sich die Lesung auf die „Menschen“ oder als erkläre es deren Tätigkeit; der griechische Partizipialanschluss bezieht sich dagegen auf „Mose“ und lässt die genaue Sinnrelation offen.
