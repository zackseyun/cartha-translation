id: ACT.15.4
reference: Acts 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: de
  text: Als sie in Jerusalem ankamen, wurden sie von der Gemeinde, den Aposteln und den Ältesten willkommen geheißen, und sie berichteten alles, was Gott mit ihnen getan hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „was Gott durch sie getan hatte“ oder „was Gott unter ihnen getan hatte“. Wörtlich steht im Griechischen „mit ihnen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Als sie in Jerusalem ankamen
  rationale: Das Aoristpartizip bezeichnet den zeitlichen Umstand vor den Hauptverben. Die milde Weiterführung durch δέ wird in die natürliche deutsche Satzfügung aufgenommen.
- source_word: παρεδέχθησαν
  choice: wurden sie … willkommen geheißen
  rationale: Die Passivform bezeichnet hier die freundliche Aufnahme durch die Jerusalemer Gemeinschaft; die Wendung ist im modernen Deutsch natürlich und bewahrt den gastlichen Sinn.
- source_word: ἀπὸ τῆς ἐκκλησίας
  choice: von der Gemeinde
  rationale: ἀπό bezeichnet beim Passiv die aufnehmende Personengruppe. „Gemeinde“ gibt ἐκκλησία hier als örtliche Gemeinschaft der Glaubenden wieder, ohne an ein Gebäude denken zu lassen.
- source_word: τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: den Aposteln und den Ältesten
  rationale: „Älteste“ bezeichnet in diesem gemeindlichen Zusammenhang anerkannte Verantwortliche und vermeidet konfessionell enger gefasste Amtsbezeichnungen.
- source_word: ἀνήγγειλάν τε
  choice: und sie berichteten
  rationale: Das Verb bezeichnet das Mitteilen eines Berichts; τε verbindet diesen Vorgang mit der vorausgehenden Aufnahme.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: alles, was Gott … getan hatte
  rationale: „Alles, was“ gibt ὅσα knapp und vollständig wieder. Das Plusquamperfekt macht deutlich, dass Gottes Wirken dem Bericht vorausging.
- source_word: μετ’ αὐτῶν
  choice: mit ihnen
  rationale: μετά mit dem Genitiv bedeutet grundsätzlich „mit“. Diese Wiedergabe bewahrt die offene Aussage über die Verbindung zwischen Gottes Handeln und den Boten.
theological_decisions:
- issue: Die in μετ’ αὐτῶν ausgedrückte Beziehung zwischen Gottes Handeln und den Boten
  choice: was Gott mit ihnen getan hatte
  alternative: was Gott durch sie getan hatte / was Gott unter ihnen getan hatte
  rationale: Der griechische Ausdruck lässt offen, ob besonders Begleitung, menschliche Vermittlung oder der Bereich des Wirkens hervorgehoben wird. „Mit ihnen“ wahrt diese Spannung und stellt Gott als Handelnden heraus, ohne die Rolle der Boten enger festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Gemeinde“ ist kontextgerecht und vermeidet die mögliche Gebäudebedeutung von „Kirche“.
