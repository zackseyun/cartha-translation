  source_fidelity: 'Die Hauptaussage ist zutreffend wiedergegeben: Gott unterscheidet nicht zwischen »uns« und »ihnen«, und die Herzen der letzteren werden durch Glauben gereinigt. »Durch den Glauben« ist möglich, doch das artikellose griechische τῇ πίστει wird im Deutschen ohne Artikel idiomatischer und weniger spezifizierend wiedergegeben.'
