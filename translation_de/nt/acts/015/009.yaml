    rationale: Das Griechische hat bei πίστει keinen Artikel. »Durch Glauben« ist im Deutschen idiomatisch, wahrt die generische Formulierung und vermeidet eine unnötige Spezifizierung.
  - severity: low
    issue: Formulierung der Fußnote
    rationale: »Wörtlich auch« ist für die bisherige Alternative nicht passend. Die Fußnote wird als zulässige deutsche Alternative mit Hinweis auf die instrumentale Funktion des Dativs formuliert.
