  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: de
  text: Und er machte keinen Unterschied zwischen uns und ihnen, indem er ihre Herzen durch Glauben[a] reinigte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »durch den Glauben«. Der griechische Dativ kann hier das Mittel oder Instrument bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: machte keinen Unterschied
  rationale: Die idiomatische Verbindung bezeichnet, dass Gott zwischen den beiden Gruppen keine Unterscheidung vornahm. Die deutsche Wendung ist natürlich und bewahrt den Sinn von οὐθὲν zusammen mit dem Verb.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: zwischen uns und ihnen
  rationale: Gibt die Gegenüberstellung der beiden Gruppen klar wieder; τε … καί verlangt hier im Deutschen keine zusätzliche Hervorhebung.
- source_word: τῇ πίστει
  choice: durch den Glauben
  rationale: Der Dativ bezeichnet hier am wahrscheinlichsten das Mittel beziehungsweise Instrument der Reinigung. »Glaube« bewahrt die übliche Bedeutung von πίστις; der bestimmte Artikel ist im Deutschen in dieser Wendung natürlich.
- source_word: καθαρίσας
  choice: wobei er … reinigte
  rationale: Die Formulierung gibt das aoristische Partizip als begleitende Handlung wieder, ohne seine genaue zeitliche oder logische Beziehung zum Hauptverb unnötig festzulegen.
- source_word: τὰς καρδίας αὐτῶν
  choice: ihre Herzen
  rationale: »Herzen« bewahrt das biblische Bild für das innere Wesen der betreffenden Menschen und gibt den Plural sowie den Rückbezug auf die Nichtjuden wieder.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: In diesem Kontext bezeichnet πίστις am ehesten den Glauben beziehungsweise das gläubige Vertrauen. »Treue« ist grammatisch möglich, wird hier aber weder durch eine Genitivverbindung noch durch den Zusammenhang nahegelegt.
- issue: Verhältnis der Reinigung zur fehlenden Unterscheidung
  choice: begleitende Handlung mit »wobei«
  alternative: 'vorzeitige Handlung: »nachdem er … gereinigt hatte«; modale Handlung: »indem er … reinigte«'
  rationale: Das griechische aoristische Partizip lässt die genaue semantische Beziehung offen. »Wobei« vermeidet es, die Aussage ausschließlich temporal, kausal oder modal festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geläufige Wendung »keinen Unterschied machen« ist allgemein verständlich; »wobei« erhält die offene Beziehung des Partizips möglichst weitgehend.
