  terminology: »Glauben« für πίστις und »Herzen« für καρδίας sind sachgerecht. Die Fußnote sollte nicht »Wörtlich auch« sagen, wenn die angeführte Form im Wesentlichen nur die deutsche Artikelvariante betrifft.
