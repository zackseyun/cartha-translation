id: ACT.15.1
reference: Acts 15:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: de
  text: 'Und einige kamen aus Judäa herab und lehrten die Brüder[a]: »Wenn ihr euch nicht nach dem Brauch des Mose beschneiden lasst, könnt ihr nicht gerettet werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Brüder und Schwestern«. Im Griechischen steht »Brüder«; wahrscheinlich ist damit die glaubende Gemeinschaft einschließlich der Frauen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Und
  rationale: Bewahrt den einfachen erzählerischen Anschluss und den parataktischen Stil des Lukas.
- source_word: τινες
  choice: einige
  rationale: Gibt das unbestimmte maskuline Pluralpronomen natürlich wieder, ohne das im Griechischen nicht ausdrücklich stehende Substantiv »Männer« hinzuzufügen.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: kamen aus Judäa herab
  rationale: Gibt Herkunft und Bewegungsrichtung wieder; »herab« entspricht der antiken geografisch-jerusalemitischen Perspektive und der Erzählperspektive am Zielort.
- source_word: ἐδίδασκον
  choice: lehrten
  rationale: Natürliches deutsches Erzähltempus; der Kontext lässt die fortlaufende Tätigkeit erkennen, ohne eine schwerfällige Verlaufsform zu erzwingen.
- source_word: τοὺς ἀδελφοὺς
  choice: die Brüder
  rationale: Entspricht dem maskulinen griechischen Ausdruck; seine wahrscheinlich inklusive gemeinschaftliche Verwendung wird in der Fußnote erläutert.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: Wenn ihr euch nicht … beschneiden lasst
  rationale: Natürliche Wiedergabe der negativen Bedingung und des passiven Vorgangs; im Deutschen drückt »sich beschneiden lassen« idiomatisch aus, dass die Handlung an den Angesprochenen vollzogen wird.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: nach dem Brauch des Mose
  rationale: ἔθος bezeichnet einen überlieferten Brauch oder eine geltende Sitte; »nach« gibt den Maßstab des Dativs knapp und idiomatisch wieder.
- source_word: οὐ δύνασθε σωθῆναι
  choice: könnt ihr nicht gerettet werden
  rationale: Bewahrt sowohl die Aussage der Unmöglichkeit als auch den soteriologischen Passivbegriff, ohne die strittige Behauptung zu kommentieren.
theological_decisions:
- issue: Bedeutung von σωθῆναι im Streit um die Beschneidung
  choice: gerettet werden
  alternative: befreit werden
  rationale: Der Zusammenhang behandelt die behauptete Heilsnotwendigkeit der Beschneidung. »Gerettet werden« erhält diese soteriologische Tragweite, ohne eine konfessionelle Heilslehre einzutragen.
- issue: Gemeinschaftlicher Umfang von ἀδελφοὺς
  choice: die Brüder mit erläuternder Fußnote
  alternative: die Brüder und Schwestern; die Gläubigen
  rationale: Der Haupttext bleibt bei der formalen maskulinen Bezeichnung des Griechischen; die wahrscheinlich inklusive Referenz auf die glaubende Gemeinschaft wird transparent in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die direkte Rede bleibt klar und zugespitzt; echte theologische Spannung wird nicht durch eine erklärende Ergänzung im Haupttext aufgelöst.
