id: ACT.15.22
reference: Acts 15:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: de
  text: 'Da hielten es die Apostel und die Ältesten zusammen mit der ganzen Gemeinde für gut, Männer aus ihrer Mitte auszuwählen und sie mit Paulus und Barnabas nach Antiochia zu senden: Judas, genannt Barsabbas, und Silas, Männer, die unter den Brüdern eine führende Stellung einnahmen.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Männer, die unter den Brüdern als Leiter galten.“'
    reason: lexical_alternative
  - marker: b
    text: „Brüder“ bezeichnet hier wahrscheinlich die Gemeinschaft der Glaubenden insgesamt, einschließlich der Frauen.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: da beschlossen
  rationale: Gibt im Beratungskontext das gemeinsam gewonnene Urteil natürlich wieder, ohne einen förmlichen Erlass anzunehmen.
- source_word: πρεσβυτέροις
  choice: die Ältesten
  rationale: Eingebürgerte, verständliche Bezeichnung für anerkannte Leiter der frühchristlichen Gemeinde.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: zusammen mit der ganzen Gemeinde
  rationale: Bewahrt die ausdrückliche Beteiligung der gesamten christlichen Gemeinschaft; „Gemeinde“ ist im Deutschen hier natürlicher als „Kirche“.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: Männer aus ihrer Mitte auszuwählen
  rationale: Gibt die männliche Bezeichnung ἄνδρας und die Herkunft der Abgesandten aus der Jerusalemer Gemeinschaft präzise wieder.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: sie … nach Antiochia zu senden
  rationale: Natürliche deutsche Wiedergabe des Infinitivs; das Pronomen benennt die ausgewählten Männer als Objekt des Sendens.
- source_word: τὸν καλούμενον Βαρσαββᾶν
  choice: genannt Barsabbas
  rationale: Knapp und idiomatisch; bewahrt die Funktion des Beinamens.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: Männer, die unter den Brüdern eine führende Stellung einnahmen
  rationale: Drückt anerkannte Leitung aus, ohne daraus zwingend einen formalen Amtstitel zu machen.
- source_word: ἀδελφοῖς
  choice: Brüdern
  rationale: Bewahrt die grammatisch männliche Form; der wahrscheinlich umfassendere Gemeinschaftsbezug wird in einer Fußnote erläutert.
theological_decisions:
- issue: Umfang der Beteiligung der Gemeinde an der Entscheidung
  choice: Apostel und Älteste beschlossen zusammen mit der ganzen Gemeinde.
  alternative: Nur Apostel und Älteste beschlossen, während die Gemeinde lediglich anwesend war.
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ bezieht die ganze Gemeinde am natürlichsten in die gemeinsame Beurteilung sowie in Auswahl und Sendung ein, ohne ein bestimmtes Modell der Gemeindeleitung festzulegen.
- issue: Bedeutungsumfang von ἀδελφοῖς
  choice: „Brüder“ im Haupttext mit erläuternder Fußnote zum wahrscheinlich umfassenden Gemeinschaftsbezug.
  alternative: „Brüder und Schwestern“ oder „Gläubige“ unmittelbar im Haupttext.
  rationale: Die Übersetzung wahrt die männliche Ausgangsform, macht jedoch transparent, dass der Ausdruck im frühchristlichen Sprachgebrauch die Gemeinschaft der Glaubenden insgesamt bezeichnen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber für flüssige deutsche Lesbarkeit geordnet. „Beschlossen“ ist idiomatischer als „es schien gut“, während „zusammen mit der ganzen Gemeinde“ die gemeinschaftliche Urteilsbildung ausdrücklich bewahrt.
