  rationale: Die Revision stellt den ausdrücklichen Zeugnischarakter von ἐμαρτύρησεν wieder her. „Für sie“ gibt die auf die genannten Personen bezogene Dativfunktion idiomatisch wieder; „ihnen“ bleibt bei der Gabe des Geistes erhalten. Die griechische Ellipse im abschließenden Vergleich wird im Deutschen verständlich bewahrt.
