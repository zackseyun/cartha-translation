id: ACT.15.8
reference: Acts 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: de
  text: Und Gott, der die Herzen kennt, legte für sie Zeugnis ab, indem er ihnen den Heiligen Geist gab, ebenso wie uns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδιογνώστης
  choice: der die Herzen kennt
  rationale: Das seltene Kompositum bezeichnet den, der die Herzen beziehungsweise das Innere der Menschen kennt. Der Relativsatz ist im modernen Deutsch natürlich und bewahrt die göttliche Eigenschaft.
- source_word: θεὸς
  choice: Gott
  rationale: Die übliche Wiedergabe von θεός; καρδιογνώστης wird attributiv durch den folgenden Relativsatz ausgedrückt.
- source_word: ἐμαρτύρησεν
  choice: bestätigte sie
  rationale: 'μαρτυρέω hat hier eine bezeugende und bestätigende Funktion: Gott bekräftigte die Annahme der Betreffenden durch die Gabe des Geistes. „Bestätigte sie“ gibt den argumentativen Sinn im Deutschen natürlich wieder, ohne den Referenten näher zu bestimmen als der griechische Text.'
- source_word: αὐτοῖς
  choice: sie / ihnen
  rationale: Der Dativ bezieht sich im Kontext auf die nichtjüdischen Glaubenden. Im Deutschen verlangt „bestätigen“ ein Akkusativobjekt; beim Geben wird derselbe Referent mit „ihnen“ aufgenommen.
- source_word: δοὺς
  choice: indem er ... gab
  rationale: Das Aoristpartizip bezeichnet hier das Mittel beziehungsweise die Weise, durch die Gott sein Zeugnis gab. „Indem“ macht diesen Zusammenhang klar.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: den Heiligen Geist
  rationale: Übliche und sachgemäße moderne Wiedergabe der festen Bezeichnung.
- source_word: καθὼς καὶ ἡμῖν
  choice: genauso wie uns
  rationale: Die griechische Wendung ist elliptisch; das Geben wird aus dem vorangehenden Partizip ergänzt. Die knappe deutsche Form bewahrt diese Ellipse verständlich.
theological_decisions:
- issue: Gottes Bestätigung durch die Gabe des Geistes
  choice: Gottes Zeugnis wird als Bestätigung der betreffenden Menschen durch die gleiche Gabe des Heiligen Geistes dargestellt.
  alternative: „Gott legte für sie Zeugnis ab“ wäre formnäher, könnte im Deutschen aber missverständlich nach einem Zeugnis zugunsten ihrer Aussagen klingen.
  rationale: Der Kontext zeigt, dass Gottes Geistgabe ihre Annahme bezeugt. Die Übersetzung fügt weder eine ethnische Bezeichnung noch weitergehende Aussagen über Bund oder Heilsordnung ein.
- issue: Referent von αὐτοῖς
  choice: Das Pronomen bleibt als „sie/ihnen“ stehen.
  alternative: „die Nichtjuden“ oder „die Menschen aus den Völkern“ könnte den Kontext ausdrücklich machen.
  rationale: Der griechische Vers nennt den Referenten nur pronominal; seine Identität ergibt sich aus dem Zusammenhang und soll nicht interpretierend in den Vers eingefügt werden.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die Formulierung bleibt nah an der griechischen Argumentationsstruktur und vermeidet konfessionell geprägte Zusätze.
