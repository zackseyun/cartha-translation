  yaml_path: translation/nt/acts/015/034.yaml
  text: But[a] it seemed good to Silas to remain there.
translation:
  language: de
  text: Silas aber hielt es für gut, dort zu bleiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter Papyrus 74 aus dem 3. Jahrhundert sowie der Codex Sinaiticus und der Codex Vaticanus aus dem 4. Jahrhundert, und auch in frühen koptischen Übersetzungen. Er steht in der byzantinischen Mehrheitstradition, in einigen späteren alexandrinischen und westlichen Handschriften sowie in der lateinischen und syrischen Überlieferung. Vermutlich fügte ihn ein späterer Abschreiber ein, um zu erklären, weshalb Silas in Vers 40 noch in Antiochia war und sich Paulus anschließen konnte, obwohl Vers 33 berichtet, dass Judas und Silas abreisten.
    reason: textual_critical
lexical_decisions:
- source_word: ἔδοξε (δοκέω)
  choice: hielt es für gut
  rationale: Die unpersönliche Konstruktion mit dem Dativ τῷ Σίλᾳ bezeichnet, was Silas für richtig beziehungsweise gut erachtete. Die Formulierung bewahrt den griechischen Satzbau weitgehend und klingt zugleich natürlich auf Deutsch.
- source_word: ἐπιμεῖναι (ἐπιμένω)
  choice: zu bleiben
  rationale: Das Verb bezeichnet hier das weitere Verweilen an einem Ort; „zu bleiben“ gibt den Zusammenhang klar und idiomatisch wieder.
- source_word: αὐτοῦ
  choice: dort
  rationale: Das Wort wird adverbial als Ortsangabe gebraucht und verweist im Kontext auf Antiochia zurück.
- source_word: δέ
  choice: aber
  rationale: Die Konjunktion markiert hier einen Gegensatz beziehungsweise eine abweichende Handlung des Silas gegenüber der zuvor erwähnten Abreise.
theological_decisions:
- issue: Textkritischer Status des gesamten Verses
  choice: Der Vers wird gemäß der vorgegebenen byzantinischen Ausgangsausgabe im Haupttext wiedergegeben und mit einer textkritischen Fußnote versehen.
  alternative: Den Vers aus dem Haupttext auslassen oder in Klammern setzen.
  rationale: Der Vers steht im Robinson-Pierpont-Text, fehlt jedoch in den frühesten wichtigen griechischen Zeugen. Die Fußnote macht diese erhebliche Überlieferungsfrage transparent, ohne sie im Wortlaut des Haupttextes stillschweigend zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hielt es für gut“ wahrt die griechische Ausdrucksweise, ohne altertümlich zu wirken; „dort zu bleiben“ ist knapp und allgemein verständlich.
