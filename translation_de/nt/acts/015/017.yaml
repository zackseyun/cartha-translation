  source_fidelity: Die Wiedergabe von ἔθνη als „Völker“ ist vertretbar und die Alternative „Nichtjuden“ ist zutreffend erläutert. „Ja“ für καί legt jedoch eine erläuternde Beziehung fest, die der griechische Wortlaut nicht ausdrücklich markiert. Außerdem bezeichnet „ausgerufen“ im Deutschen eher ein öffentliches Proklamieren; die Namensformel ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου drückt hier aus, dass Gottes Name über diesen Völkern genannt worden ist bzw. sie nach seinem Namen genannt sind.
  naturalness: „Der Rest der Menschen“ ist im heutigen Standarddeutsch klarer als „die übrigen Menschen“, das auch bloß „die anderen Menschen“ bedeuten kann. Die Formulierung „über die mein Name genannt worden ist“ ist sowohl verständlicher als auch für die griechische Namensformel angemessener als „über denen mein Name ausgerufen worden ist“.
  terminology: „Herr“, „Völker“ und die prophetische Formel „spricht der Herr“ sind registergerecht. Die Fußnote zu ἔθνη bewahrt die im Kontext naheliegende Lesart „Nichtjuden“, ohne die weitere Bedeutung von ἔθνη zu unterdrücken.
