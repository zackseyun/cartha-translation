    rationale: ἐπικαλέω in dieser passivischen Formel bezieht sich auf das Genanntwerden des göttlichen Namens über einer Personengruppe und ihre damit ausgedrückte Zugehörigkeit. „Ausrufen“ legt dagegen eine öffentliche Verkündigung nahe.
