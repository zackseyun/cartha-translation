  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: de
  text: damit der Rest der Menschen den Herrn sucht und alle Völker[a], über die mein Name genannt worden ist[b], spricht der Herr[c], der dies tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Nichtjuden“. Das griechische Wort ἔθνη kann „Völker“ oder im jüdischen Sprachgebrauch „Nichtjuden“ bedeuten. Im Zusammenhang des Apostelkonzils steht die Aufnahme von Nichtjuden im Vordergrund.'
    reason: alternative_reading
  - marker: b
    text: 'Sinngemäß auch: „die nach meinem Namen genannt sind“. Wörtlich steht im Griechischen: „über die mein Name gerufen worden ist“.'
    reason: lexical_alternative
  - marker: c
    text: Diese Worte greifen Amos 9,12 in einer Form auf, die der griechischen Überlieferung der Heiligen Schriften entspricht; dort liegt der Akzent auf den Völkern, über die der Name des Herrn genannt ist.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: damit
  rationale: Leitet mit dem Konjunktiv den beabsichtigten Zweck beziehungsweise das Ergebnis ein und klingt im modernen Deutsch natürlich.
- source_word: ἐκζητήσωσιν
  choice: suchen
  rationale: Gibt den Aorist Konjunktiv idiomatisch wieder; eine mögliche Intensivierung des Kompositums wird nicht überbetont.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: die übrigen Menschen
  rationale: κατάλοιποι bezeichnet die Verbleibenden beziehungsweise Übrigen. Diese Wiedergabe ist natürlich und bewahrt die offene Beziehung zwischen Menschheit und Völkern, ohne einen technisch-theologischen Begriff einzutragen.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Entspricht der üblichen und kontextgerechten Wiedergabe von κύριος in der prophetischen Anführung.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: ἔθνη bezeichnet Völker und kann im jüdischen Sprachgebrauch speziell die nichtjüdischen Völker meinen. „Alle Völker“ bewahrt die Breite des prophetischen Wortlauts; der kontextuelle Sinn wird in der Fußnote erläutert.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: über denen mein Name ausgerufen worden ist
  rationale: Bewahrt das auffällige Passiv und die Präpositionalkonstruktion des griechischen Idioms, während es auf Deutsch verständlich bleibt. Der Ausdruck bezeichnet göttliche Zugehörigkeit beziehungsweise Inanspruchnahme.
- source_word: λέγει κύριος
  choice: spricht der Herr
  rationale: „Spricht der Herr“ ist die vertraute, würdevolle deutsche Formel prophetischer Rede und bewahrt das Präsens.
- source_word: ποιῶν ταῦτα
  choice: der dies tut
  rationale: Bezieht das Partizip eindeutig auf den Herrn und gibt seine fortdauernde Wirksamkeit knapp und natürlich wieder.
theological_decisions:
- issue: Bedeutung von ἔθνη im Zusammenhang der Aufnahme Nichtjuden
  choice: Völker
  alternative: Nichtjuden
  rationale: Der unmittelbare Zusammenhang legt Nichtjuden nahe, doch „Völker“ bewahrt sowohl die lexikalische Breite als auch den Klang der prophetischen Anführung. Die kontextuelle Zuspitzung wird nicht verschwiegen, sondern in einer Fußnote genannt.
- issue: Verhältnis von οἱ κατάλοιποι τῶν ἀνθρώπων zu πάντα τὰ ἔθνη
  choice: die übrigen Menschen, ja, alle Völker
  alternative: der Rest der Menschheit und alle Nichtjuden
  rationale: „Ja“ kann καί erläuternd beziehungsweise verstärkend wiedergeben, ohne endgültig festzulegen, ob die zweite Wendung ausschließlich additiv oder näherbestimmend zu verstehen ist.
- issue: Göttliche Namensformel
  choice: über denen mein Name ausgerufen worden ist
  alternative: die nach meinem Namen genannt sind
  rationale: Die gewählte Form wahrt das griechische Bild und die theologische Spannung von Benennung, Zugehörigkeit und göttlichem Anspruch, statt sie auf eine einzige Deutung zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Redeformel „spricht der Herr“ bleibt erhalten. „Die übrigen Menschen“ vermeidet eine unnötig fachsprachliche Festlegung durch „Überrest“, während die Fußnoten die lexikalische und intertextuelle Spannung transparent machen.
