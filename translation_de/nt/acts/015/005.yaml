id: ACT.15.5
reference: Acts 15:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: de
  text: 'Doch einige aus der Partei[a] der Pharisäer, die zum Glauben gekommen waren, standen auf und sagten: „Man muss sie beschneiden und ihnen befehlen, das Gesetz des Mose zu halten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für „Partei“ kann auch „Richtung“ oder „Sekte“ stehen. Das griechische Wort bezeichnet hier eine anerkannte Gruppierung oder Schule, nicht notwendig eine „Häresie“ im späteren kirchlichen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: standen auf
  rationale: Die Wendung gibt die konkrete Handlung in der Versammlung natürlich wieder, ohne sie bereits als förmlichen Widerspruch oder Protest auszudeuten.
- source_word: τινες
  choice: einige
  rationale: Das unbestimmte Pluralpronomen wird ohne eine im Griechischen nicht ausdrücklich genannte Geschlechtsangabe wiedergegeben.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: aus der Partei der Pharisäer
  rationale: αἵρεσις bezeichnet hier eine anerkannte Richtung oder Gruppierung. „Partei“ vermeidet die spätere technische Bedeutung von „Häresie“; „Sekte“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: πεπιστευκότες
  choice: die zum Glauben gekommen waren
  rationale: Das Perfektpartizip bezeichnet einen vorausgegangenen Glaubensschritt mit fortdauerndem Ergebnis. Die verbale Wiedergabe bewahrt zugleich die Spannung, dass diese Glaubenden weiterhin Beschneidung und Gesetzesobservanz fordern.
- source_word: λέγοντες
  choice: und sagten
  rationale: Die finite deutsche Form verbindet die Rede natürlich mit dem Aufstehen und verstärkt den Ton nicht unnötig.
- source_word: δεῖ
  choice: Man muss
  rationale: Die unpersönliche Notwendigkeit wird idiomatisch und mit ihrer verpflichtenden Kraft wiedergegeben; worauf diese Notwendigkeit beruht, bleibt wie im Griechischen unausgesprochen.
- source_word: περιτέμνειν αὐτούς
  choice: sie beschneiden
  rationale: Die aktive Infinitivkonstruktion folgt der griechischen Form und bezeichnet die nichtjüdischen Glaubenden als Objekt der geforderten Beschneidung.
- source_word: παραγγέλλειν
  choice: ihnen befehlen
  rationale: „Befehlen“ bewahrt den autoritativen Gehalt des Verbs und ist stärker als bloßes Unterweisen.
- source_word: τε τηρεῖν
  choice: zu halten
  rationale: τηρέω bezeichnet hier das Befolgen beziehungsweise Einhalten des Gesetzes. „Das Gesetz halten“ ist im Deutschen verständlich und prägnant.
- source_word: τὸν νόμον Μωϋσέως
  choice: das Gesetz des Mose
  rationale: Die direkte Genitivwiedergabe ist natürlich, würdig und weniger fachsprachlich als „mosaisches Gesetz“.
theological_decisions:
- issue: Bedeutung von αἵρεσις im jüdischen Gruppenkontext
  choice: Partei
  alternative: Richtung oder Sekte
  rationale: Gemeint ist eine erkennbare Gruppierung innerhalb des damaligen Judentums, nicht Häresie im späteren kirchlichen Sinn. „Partei“ vermeidet diese anachronistische Wertung.
- issue: Aussagekraft von πεπιστευκότες
  choice: die zum Glauben gekommen waren
  alternative: die gläubig geworden waren / die glaubten
  rationale: Die verbale Perfektwiedergabe stellt sie tatsächlich als Menschen dar, die zum Glauben gekommen waren, ohne die daraus entstehende theologische Spannung zu glätten oder die Echtheit ihres Glaubens zu beurteilen.
- issue: Bezug der geforderten Handlungen
  choice: Man muss sie beschneiden und ihnen befehlen, das Gesetz des Mose zu halten
  alternative: Sie müssen beschnitten und angewiesen werden, das Gesetz des Mose zu halten
  rationale: Die aktive Fassung bleibt näher an den griechischen Infinitiven. Zugleich wird nicht ergänzt, wer den Befehl ausführen soll; der Zusammenhang macht die Forderung ausreichend klar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede macht die erhobene Forderung klar, ohne ihr durch Wörter wie „beharrten“ oder „verlangten“ einen stärkeren Ton zu geben, als der griechische Text ausdrücklich erkennen lässt. Der Fußnotenmarker [a] steht im Haupttext am Satzende und erläutert „Partei“.
