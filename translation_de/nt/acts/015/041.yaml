  text: διήρχετο δὲ τὴν Συρίαν καὶ ⸀τὴν Κιλικίαν ἐπιστηρίζων τὰς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: de
  text: Er zog durch Syrien und Kilikien und stärkte die Gemeinden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: zog durch
  rationale: Der Imperfekt bezeichnet das fortlaufende Durchreisen der beiden Regionen. „zog durch“ ist im Deutschen natürlich und gibt die Bewegung durch ein Gebiet treffend wieder.
- source_word: δὲ
  choice: und
  rationale: δέ führt hier die Erzählung mit einer leichten Verknüpfung fort; „und“ gibt diese Funktion unaufdringlich wieder.
- source_word: Συρίαν
  choice: Syrien
  rationale: Übliche deutsche Bezeichnung der Region.
- source_word: Κιλικίαν
  choice: Kilikien
  rationale: Übliche deutsche Bezeichnung der Region.
- source_word: ἐπιστηρίζων
  choice: stärkte
  rationale: Das Partizip bezeichnet die begleitende Tätigkeit, durch die die Gemeinden gefestigt wurden. „stärkte“ bewahrt die umfassende Bedeutung, ohne sie auf bloße Ermutigung zu verengen.
- source_word: ἐκκλησίας
  choice: Gemeinden
  rationale: ἐκκλησίαι bezeichnet hier die örtlichen christlichen Gemeinschaften. „Gemeinden“ ist dafür im modernen deutschen Bibel- und Allgemeingebrauch klar und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper narrativer Satzführung. Das griechische Partizip wurde als koordiniertes finites Verb wiedergegeben, was im Deutschen natürlicher klingt und die Gleichzeitigkeit im Kontext ausreichend wahrt.
