  text: ἀπεστάλκαμεν οὖν Ἰούδαν καὶ Σιλᾶν, καὶ αὐτοὺς διὰ λόγου ἀπαγγέλλοντας τὰ αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: de
  text: Darum haben wir Judas und Silas gesandt; sie selbst werden dasselbe mündlich[a] mitteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „durch Wort“; gemeint ist eine mündliche Mitteilung zusätzlich zu dem Schreiben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: haben wir … gesandt
  rationale: Das deutsche Perfekt gibt die vollzogene Sendung mit ihrer gegenwärtigen Bedeutung im Briefzusammenhang natürlich wieder.
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem zuvor gefassten und schriftlich mitgeteilten Beschluss; „Darum“ ist im heutigen Deutsch klar und würdig.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Judas und Silas
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Formen.
- source_word: αὐτοὺς
  choice: sie selbst
  rationale: Bewahrt die ausdrückliche Hervorhebung der beiden Boten als persönliche Bestätiger des Schreibens.
- source_word: διὰ λόγου
  choice: mündlich
  rationale: Die Wendung bezeichnet hier die Mitteilung durch gesprochenes Wort im Unterschied zum überbrachten Schreiben.
- source_word: ἀπαγγέλλοντας
  choice: werden … mitteilen
  rationale: Das präsentische Partizip beschreibt im Zusammenhang der Sendung die bevorstehende Tätigkeit der Boten; eine finite Zukunftsform ist im Deutschen klar und natürlich.
- source_word: τὰ αὐτά
  choice: dasselbe
  rationale: Gibt den Rückverweis auf den gleichen Inhalt des Schreibens knapp wieder, ohne ihn interpretierend auf „Botschaft“ oder „Beschluss“ festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Briefstil. Der Semikolon-Satz bewahrt die enge Verbindung beider Aussagen, während „sie selbst“ die im Griechischen ausgedrückte Hervorhebung klar wiedergibt.
