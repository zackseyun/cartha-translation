  variant: modern standard German
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ⸀ἐβούλετο συμπαραλαβεῖν ⸀καὶ τὸν Ἰωάννην τὸν καλούμενον Μᾶρκον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: de
  text: Barnabas aber wollte auch Johannes mitnehmen, der Markus genannt wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Johannes, der auch Markus genannt wurde.“'
    reason: 'Lexikalisch-syntaktische Alternative: Das „auch“ kann im Deutschen sinngemäß mit der zweiten Namensbezeichnung verbunden werden, obwohl es im Griechischen unmittelbar die Mitnahme des Johannes hervorhebt.'
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Barnabas
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier einen milden Gegensatz zum zuvor geäußerten Vorhaben des Paulus.
- source_word: ἐβούλετο
  choice: wollte
  rationale: Das Imperfekt von βούλομαι bezeichnet den Wunsch beziehungsweise die Absicht des Barnabas, ohne eine förmliche Beschlussfassung auszudrücken.
- source_word: συμπαραλαβεῖν
  choice: mitnehmen
  rationale: Das zusammengesetzte Verb bezeichnet, jemanden als Begleiter in eine Gruppe oder auf eine Reise mitzunehmen; „mitnehmen“ ist im modernen Deutsch natürlich und präzise.
- source_word: καὶ
  choice: auch
  rationale: 'Beim Objekt hat καί additive und leicht hervorhebende Kraft: Barnabas wollte Johannes ebenfalls mitnehmen.'
- source_word: Ἰωάννην
  choice: Johannes
  rationale: Der Personenname wird in der üblichen deutschen biblischen Form wiedergegeben.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: der Markus genannt wurde
  rationale: Die partizipiale Wendung bezeichnet den weiteren Namen des Johannes. Die Formulierung wahrt, dass καί grammatisch eher zu Johannes als zur Namensangabe gehört.
- source_word: Μᾶρκον
  choice: Markus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
