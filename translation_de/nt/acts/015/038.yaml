  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: de
  text: Paulus bestand jedoch darauf, diesen Mann[a] nicht mitzunehmen, der sich aus Pamphylien von ihnen getrennt hatte und nicht mit ihnen zu dem Werk gegangen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesen Mann nicht mitzunehmen, der sich von ihnen abgewandt hatte“. Das griechische Wort kann hier stärker verstanden werden; der Haupttext bleibt mit „sich von ihnen getrennt hatte“ zurückhaltender.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: bestand darauf
  rationale: Das Imperfekt bezeichnet im Streitkontext Paulus’ nachdrückliches Urteil; „bestand darauf“ gibt diese Stärke natürlich wieder.
- source_word: ἀποστάντα
  choice: sich von ihnen getrennt hatte
  rationale: Das Partizip von ἀφίσταμαι bezeichnet ein Sichentfernen oder Zurückweichen. Die Formulierung wahrt den möglichen negativen Beiklang, ohne bereits eindeutig „im Stich lassen“ oder „desertieren“ festzulegen.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: sich in Pamphylien von ihnen getrennt hatte
  rationale: Die erste ἀπό-Verbindung bezeichnet die Trennung von Paulus und Barnabas; die zweite verweist im Zusammenhang auf Pamphylien als Ausgangspunkt beziehungsweise Ort der Trennung. Idiomatisches Deutsch gibt dies am klarsten mit „in Pamphylien“ wieder.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: nicht mit ihnen … gegangen war
  rationale: Die Wendung bezeichnet, dass er sie auf dem weiteren Weg nicht begleitet hatte.
- source_word: εἰς τὸ ἔργον
  choice: an die Arbeit
  rationale: „An die Arbeit gehen“ ist eine natürliche deutsche Wiedergabe der zielgerichteten Bewegung εἰς τὸ ἔργον und bewahrt „die Arbeit“, ohne sie ausdrücklich als „Mission“ auszudeuten.
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: diesen Mann nicht mitzunehmen
  rationale: „Mitnehmen“ trifft den Sinn des zusammengesetzten Verbs im Reisekontext; „diesen Mann“ bewahrt die demonstrative Kraft von τοῦτον.
