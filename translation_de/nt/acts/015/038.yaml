  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. „Zu dem Werk“ ist hier etwas formeller, aber natürlich genug und bildet εἰς τὸ ἔργον genauer ab als „an die Arbeit“, das im Deutschen auch den Beginn einer Tätigkeit nahelegen kann.
