id: ACT.15.28
reference: Acts 15:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: de
  text: Denn der Heilige Geist und wir haben es für gut gehalten, euch keine weitere Last aufzuerlegen außer diesen notwendigen Dingen:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn der Heilige Geist und wir haben beschlossen“. Die griechische Wendung kann auch als förmliche Entscheidungsformel wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „außer diesen unerlässlichen Anforderungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: haben es für gut gehalten
  rationale: Die deutsche Entscheidungsformel gibt sowohl den deliberativen Ton als auch den tatsächlichen Beschluss wieder, ohne ihn als bloße Meinung abzuschwächen.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: der Heilige Geist
  rationale: Der Dativ gehört zur Formel ἔδοξεν und bezeichnet den Heiligen Geist als persönlich Handelnden beziehungsweise Zustimmenden.
- source_word: καὶ ἡμῖν
  choice: und wir
  rationale: Die koordinierte Formulierung bewahrt die Parallelität zwischen dem Heiligen Geist und der versammelten Leitung; die deutsche Konstruktion verlangt hier den Nominativ.
- source_word: μηδὲν πλέον
  choice: keine weitere
  rationale: In Verbindung mit βάρος bezeichnet πλέον eine über die genannten Forderungen hinausgehende Last.
- source_word: ἐπιτίθεσθαι ὑμῖν
  choice: euch … aufzuerlegen
  rationale: Auflegen beziehungsweise auferlegen entspricht dem Bild einer Last; „auferlegen“ ist im heutigen Deutsch für Verpflichtungen besonders natürlich.
- source_word: βάρος
  choice: Last
  rationale: Das Wort bezeichnet hier bildlich auferlegte Verpflichtungen; „Last“ bewahrt diese Metapher knapp und verständlich.
- source_word: πλὴν
  choice: außer
  rationale: Die Präposition führt nach der Verneinung die begrenzte Ausnahme ein.
- source_word: τούτων τῶν ἐπάναγκες
  choice: diesen notwendigen Dingen
  rationale: Die möglichst offene Wiedergabe verweist auf die anschließend genannten Bestimmungen, ohne ihre Art vorwegnehmend als zeitlose Grundwahrheiten oder als umfassende Gesetzesordnung zu deuten.
theological_decisions:
- issue: Verhältnis des Heiligen Geistes zum Beschluss der Versammlung
  choice: „Der Heilige Geist und wir haben es für gut gehalten“ stellt die Zustimmung des Geistes und die der Versammlung koordiniert dar.
  alternative: „Der Heilige Geist und wir haben beschlossen“ beziehungsweise eine rein menschliche Konsensformel.
  rationale: Die Übersetzung wahrt die persönliche Mitwirkung des Heiligen Geistes und zugleich den idiomatischen, deliberativen Charakter von ἔδοξεν, ohne beide Instanzen miteinander gleichzusetzen oder die Aussage auf menschliche Rhetorik zu reduzieren.
- issue: Reichweite der Forderungen an nichtjüdische Glaubende
  choice: Es wird keine weitere Last außer den anschließend genannten notwendigen Dingen auferlegt.
  alternative: Völlige Freiheit von jeder Verpflichtung oder umfassende Verpflichtung auf das mosaische Gesetz.
  rationale: Die Formulierung bewahrt die im Text gesetzte Begrenzung und lässt die genaue Art und Reichweite der folgenden Forderungen vom Kontext bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich und bewahrt die koordinierte Nennung des Heiligen Geistes und der menschlichen Versammlung. „Notwendige Dinge“ hält die sachliche Offenheit des griechischen Ausdrucks fest; die Fußnoten dokumentieren stärker beschlussorientierte und verpflichtungsbezogene Alternativen.
