id: ACT.15.14
reference: Acts 15:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: de
  text: Simeon[a] hat berichtet, wie Gott sich zuerst den Nichtjuden[b] zuwandte, um aus ihnen ein Volk für seinen Namen zu nehmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Simon«. Jakobus gebraucht hier die Namensform »Simeon«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »aus den Völkern«; im Zusammenhang sind Nichtjuden gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung bezeichnet ein Volk in besonderer Beziehung zu Gottes Namen.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Simeon
  rationale: Die im Ausgangstext stehende Namensform wird beibehalten und nicht an das geläufigere »Simon« angeglichen.
- source_word: ἐξηγήσατο
  choice: hat berichtet
  rationale: Das Verb bezeichnet hier das Darlegen beziehungsweise Erzählen eines Geschehens; im Zusammenhang fasst Jakobus den unmittelbar zuvor gegebenen Bericht zusammen.
- source_word: καθὼς
  choice: wie
  rationale: Nach einem Verb des Berichtens führt καθώς natürlich den Inhalt und Verlauf des Berichteten ein.
- source_word: πρῶτον
  choice: zuerst
  rationale: Das Wort kennzeichnet den anfänglichen Schritt des göttlichen Handelns an den Nichtjuden, ohne den zeitlichen Bezug weiter festzulegen.
- source_word: ἐπεσκέψατο
  choice: sich … zuwandte
  rationale: Die Wendung gibt den Gedanken einer fürsorglichen, zielgerichteten göttlichen Hinwendung in natürlichem modernem Deutsch wieder. Das wörtlichere »besuchte« wäre hier missverständlich.
- source_word: λαβεῖν
  choice: zu gewinnen
  rationale: Der Infinitiv drückt den Zweck der Hinwendung Gottes aus. »Gewinnen« vermittelt in diesem Zusammenhang das Herausnehmen beziehungsweise Sich-Zueignen eines Volkes natürlicher als das isolierte »nehmen«.
- source_word: ἐξ ἐθνῶν
  choice: aus ihnen
  rationale: Das Pronomen greift die zuvor genannten Nichtjuden auf; die Präposition ἐξ bleibt durch »aus« erkennbar und bezeichnet die Herkunft des Volkes.
- source_word: ἐθνῶν
  choice: Nichtjuden
  rationale: Im Zusammenhang von Apostelgeschichte 15 bezeichnet ἔθνη die Menschen außerhalb des jüdischen Volkes. »Nichtjuden« macht diesen Gegensatz im heutigen Deutsch klar.
- source_word: λαὸν
  choice: ein Volk
  rationale: »Volk« bewahrt die biblische und bundestheologische Bedeutung, ohne eine bloß ethnische Gruppe zu bezeichnen.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: für seinen Namen
  rationale: Die formal nahe Wiedergabe erhält die gewichtige biblische Redeweise und deutet sie nicht vorschnell als bloßes »für sich selbst« oder »zur Ehre seines Namens« aus.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν als »Nichtjuden« oder »Völker«
  choice: Nichtjuden
  alternative: Völker
  rationale: Im unmittelbaren Zusammenhang geht es um die Aufnahme von Menschen, die keine Juden sind. »Nichtjuden« wahrt den für die Beratung in Apostelgeschichte 15 entscheidenden Gegensatz.
- issue: Deutung von τῷ ὀνόματι αὐτοῦ
  choice: für seinen Namen
  alternative: für sich selbst
  rationale: Die quellennähere Formulierung bewahrt die offene, theologisch dichte Beziehung zwischen Gottes Namen, Zugehörigkeit und Identität, statt sie auf eine einzige Erklärung zu reduzieren.
- issue: Wiedergabe der göttlichen Zuwendung in ἐπεσκέψατο
  choice: sich … zuwandte
  alternative: … besuchte
  rationale: »Sich zuwenden« vermittelt Gottes zielgerichtetes und gnädiges Eingreifen, ohne im Deutschen die Vorstellung eines gewöhnlichen Besuchs hervorzurufen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang; unnatürliche oder missverständliche Wörtlichkeit wird vermieden. Alle Fußnotenmarker stehen im Haupttext.
