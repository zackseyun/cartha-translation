revisions:
- from: Simeon[a] hat berichtet, wie Gott sich zuerst den Nichtjuden[b] zuwandte, um aus ihnen ein Volk für seinen Namen zu gewinnen[c].
  to: Simeon[a] hat berichtet, wie Gott sich zuerst den Nichtjuden[b] zuwandte, um aus ihnen ein Volk für seinen Namen zu nehmen[c].
  rationale: Die Revision berichtigt die unvollständige wörtliche Fußnote zu ἐξ ἐθνῶν, ersetzt die leicht interpretierende Wiedergabe »zu gewinnen« durch das quellennähere »zu nehmen« und formuliert die Erklärung zu »für seinen Namen« weniger festlegend. Satzbau, Register und die kontextgerechte Wiedergabe von ἔθνη als »Nichtjuden« bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Haupttext gibt den Gedankengang und die zentralen Begriffe des griechischen Textes im Wesentlichen treffend wieder: Συμεών bleibt als »Simeon« erhalten, ἐθνῶν ist im Kontext angemessen als »Nichtjuden« konkretisiert, und »für seinen Namen« bewahrt die dichte Formulierung τῷ ὀνόματι αὐτοῦ. Die Fußnote b ist jedoch als wörtliche Angabe nicht korrekt, da ἐξ ἐθνῶν »aus den Völkern/Nationen« bedeutet, nicht lediglich »den Völkern«.'
  naturalness: Der Satz ist natürliches modernes Standarddeutsch und wahrt einen angemessen sachlich-biblischen Ton. »Sich ... zuwandte« ist eine idiomatische Wiedergabe von ἐπεσκέψατο. »Zu gewinnen« ist kontextuell möglich, hat aber gegenüber λαβεῖν eine leicht stärker werbende bzw. resultative Nuance; »zu nehmen« ist hier quellennäher und im biblischen Register noch verständlich.
  terminology: »Nichtjuden«, »Volk« und »für seinen Namen« sind im Kontext von Apostelgeschichte 15 angemessen. Die Erklärung zu Fußnote c sollte die Bedeutung nicht abschließend auf Besitz und Namensidentifikation festlegen, sondern den idiomatischen Ausdruck als besondere Beziehung zu Gottes Namen erläutern.
  issues:
  - severity: medium
    issue: Fußnote b bezeichnet die griechische Wendung unvollständig als wörtlich.
    rationale: Im Text steht ἐξ ἐθνῶν, also »aus den Völkern/Nationen« beziehungsweise kontextuell »aus den Nichtjuden«. »Den Völkern« lässt die Präposition ἐξ unberücksichtigt.
  - severity: low
    issue: »zu gewinnen« ist etwas freier als λαβεῖν.
    rationale: λαβεῖν bedeutet primär »nehmen/erhalten«. »Gewinnen« ist verständlich, kann aber einen stärker aktiven Gewinnungs- oder Bekehrungsakzent nahelegen. »Zu nehmen« wahrt die knappe, offene Formulierung des Ausgangstextes besser.
  - severity: low
    issue: Fußnote c erklärt die Wendung zu festgelegt.
    rationale: τῷ ὀνόματι αὐτοῦ ist eine dichte biblische Formel. Zugehörigkeit und Verbindung mit Gottes Namen sind naheliegend, doch die Erklärung sollte als Erläuterung der Beziehung formuliert sein, nicht als vollständige Umschreibung.
  revised_text: Simeon[a] hat berichtet, wie Gott sich zuerst den Nichtjuden[b] zuwandte, um aus ihnen ein Volk für seinen Namen zu nehmen[c].
