id: ACT.15.33
reference: Acts 15:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: de
  text: Nachdem sie einige Zeit dort verbracht hatten, wurden sie von den Brüdern[a] in Frieden zu denen entlassen, die sie gesandt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von den Brüdern und Schwestern«. Im Griechischen steht »Brüder«; hier ist damit wahrscheinlich die ganze Gemeinschaft der Glaubenden gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: Nachdem sie einige Zeit dort verbracht hatten
  rationale: Die griechische Wendung bedeutet idiomatisch, eine gewisse Zeit zu verbringen beziehungsweise zu bleiben. »Dort« ist im Griechischen nicht ausdrücklich genannt, ergibt sich aber aus dem Aufenthalt in Antiochia und macht den deutschen Satz natürlich.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches, fortführendes Bindewort. Der deutsche Satzanschluss benötigt kein ausdrückliches »und« oder »dann«.
- source_word: ἀπελύθησαν
  choice: wurden ... entlassen
  rationale: Das Passiv bezeichnet hier die förmliche und freundliche Verabschiedung der Abgesandten, nicht eine Befreiung aus Gewahrsam.
- source_word: μετ’ εἰρήνης
  choice: in Frieden
  rationale: Die geläufige deutsche Wendung bewahrt den Gedanken eines friedlichen, von Wohlwollen getragenen Abschieds.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: von den Brüdern
  rationale: Die Übersetzung wahrt zunächst die maskuline Form des griechischen Ausdrucks; sein wahrscheinlich inklusiver Bezug auf die Glaubensgemeinschaft wird in der Fußnote erläutert.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: zu denen, die sie gesandt hatten
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die sie zuvor ausgesandt hatten. Das Plusquamperfekt bildet dieses zeitliche Verhältnis im Deutschen klar ab; »zurück« wird nicht ergänzt, da es nicht ausdrücklich im Griechischen steht.
theological_decisions:
- issue: Inklusive Bedeutung von ἀδελφοί
  choice: Brüder im Haupttext mit inklusiver Erläuterung in der Fußnote
  alternative: Brüder und Schwestern; Glaubensgeschwister
  rationale: Der griechische Text verwendet die maskuline Pluralform, die hier wahrscheinlich die ganze glaubende Gemeinschaft einschließt. Haupttext und Fußnote bewahren gemeinsam sowohl die sprachliche Form als auch den kontextuellen Umfang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Ablauf, während »einige Zeit dort verbracht« und »in Frieden« idiomatisches Deutsch bieten.
