reference: Acts 15:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: de
  text: Da schwieg die ganze Versammlung und hörte Barnabas und Paulus zu, die berichteten, alles, was Gott durch sie unter den Nichtjuden[a] an Zeichen und Wundern getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Völkern“. Im Zusammenhang der Jerusalemer Beratung sind hier die Nichtjuden gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: Da schwieg
  rationale: Der Aorist bezeichnet hier den Eintritt der Stille als erzählerischen Übergang; „Da schwieg“ gibt dies in natürlichem Deutsch wieder.
- source_word: πᾶν τὸ πλῆθος
  choice: die ganze Versammlung
  rationale: Gemeint ist die versammelte Gemeinschaft bei der Beratung in Jerusalem; „Versammlung“ passt besser zum Kontext als „Menge“.
- source_word: ἤκουον
  choice: hörte … zu
  rationale: Der Imperfekt beschreibt anhaltendes, aufmerksames Hören; „zuhören“ bringt diese aktive Aufmerksamkeit zum Ausdruck.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Barnabas und Paulus
  rationale: Die Namen folgen den im Deutschen etablierten biblischen Formen.
- source_word: ἐξηγουμένων
  choice: die berichteten
  rationale: Das Partizip bezeichnet das ausführliche Erzählen bzw. Darlegen von Geschehnissen; „berichteten“ ist klar und deutet keine zusätzliche Auslegung an.
- source_word: ὅσα
  choice: welche
  rationale: In Verbindung mit „Zeichen und Wunder“ leitet das Wort hier Umfang und Inhalt des Berichts ein, ohne eine darüber hinausgehende Gruppe von Taten anzunehmen.
- source_word: ἐποίησεν ὁ θεὸς
  choice: Gott … getan hatte
  rationale: Gott bleibt ausdrücklich das Subjekt; das Plusquamperfekt ordnet die zuvor geschehenen Taten natürlich in den Bericht ein.
- source_word: σημεῖα καὶ τέρατα
  choice: Zeichen und Wunder
  rationale: Die traditionelle und verständliche Wiedergabe bewahrt das lukanische Begriffspaar ohne den Zusatz „übernatürlich“ oder „wunderbar“.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Nichtjuden
  rationale: Im Kontext des Jerusalemer Treffens bezeichnet ἔθνεσιν Menschen aus den Völkern im Unterschied zu Juden. „Nichtjuden“ ist im heutigen Deutsch unmittelbar verständlich; „Völker“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: δι’ αὐτῶν
  choice: durch sie
  rationale: διά mit Genitiv kennzeichnet Barnabas und Paulus als die Handelnden, durch die Gott wirkte, während Gott der primäre Akteur bleibt.
theological_decisions:
- issue: Göttliches Wirken in der Mission
  choice: Gott wird als derjenige dargestellt, der die Zeichen und Wunder durch Barnabas und Paulus tat.
  alternative: Barnabas und Paulus werden als die primären Urheber der Zeichen und Wunder verstanden.
  rationale: ὁ θεός ist das Subjekt von ἐποίησεν; δι’ αὐτῶν bezeichnet Barnabas und Paulus als die von Gott gebrauchten Vermittler. Die Übersetzung bewahrt diese syntaktische Gewichtung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, bleibt aber mündlich gut verständlich. „Nichtjuden“ vermeidet das heute teils erklärungsbedürftige „Heiden“.
