  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: de
  text: Darum bin ich der Ansicht, dass wir den Menschen aus den Völkern, die sich Gott zuwenden, keine Schwierigkeiten machen sollen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Menschen aus den nichtjüdischen Völkern. Das griechische Wort kann „Völker“ bedeuten und bezeichnet hier Nichtjuden, die sich Gott zuwenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der unmittelbar vorausgehenden Begründung des Jakobus und klingt im heutigen Deutsch natürlich.
- source_word: ἐγὼ κρίνω
  choice: bin ich der Ansicht
  rationale: Gibt das ausdrücklich gesetzte Ich und das wohlüberlegte Urteil wieder, ohne bereits einen förmlichen Rechtsspruch anzudeuten.
- source_word: μὴ παρενοχλεῖν
  choice: dass wir … keine Schwierigkeiten machen sollen
  rationale: Der von κρίνω abhängige Infinitiv bezeichnet den Inhalt des Urteils. Die Formulierung vermittelt die praktische Empfehlung an die Versammlung und gibt das Verursachen von Belastungen oder Hindernissen idiomatisch wieder.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: denen aus den Völkern
  rationale: Bewahrt sowohl den persönlichen Bezug des substantivierten Ausdrucks als auch die Herkunftsangabe mit ἀπό.
- source_word: ἐθνῶν
  choice: Völkern
  rationale: Die Grundbedeutung bleibt sichtbar; im jüdischen Kontext sind damit Menschen aus den nichtjüdischen Völkern gemeint. Eine Fußnote erläutert diesen Sinn.
- source_word: ἐπιστρέφουσιν
  choice: die sich … zuwenden
  rationale: Das Präsenspartizip bezeichnet Menschen, die sich gegenwärtig Gott zuwenden. Die Wiedergabe bewahrt das Bewegungsbild und vermeidet einen späteren technischen Bekehrungsbegriff.
- source_word: ἐπὶ τὸν θεόν
  choice: Gott zuwenden
  rationale: In Verbindung mit ἐπιστρέφω bezeichnet die Wendung die Ausrichtung auf Gott; im Deutschen wird dies natürlich in das trennbare Verb eingebunden.
theological_decisions:
- issue: Persönliches Urteil des Jakobus oder gemeinschaftlich umzusetzende Empfehlung
  choice: „bin ich der Ansicht, dass wir … keine Schwierigkeiten machen sollen“
  alternative: „urteile ich, ihnen … keine Schwierigkeiten zu machen“
  rationale: Das griechische ἐγὼ κρίνω ist ausdrücklich erste Person Singular, während der Infinitiv den Inhalt eines Urteils bezeichnet, das die Versammlung praktisch umsetzen soll. Die Übersetzung wahrt beides, ohne dem Satz eine förmlichere Amtsgewalt aufzuzwingen.
- issue: Bedeutung von ἔθνη im jüdisch-christlichen Kontext
  choice: „Völker“ mit erläuternder Fußnote
  alternative: „Nichtjuden“
  rationale: „Völker“ erhält die lexikalische Breite und lässt zugleich durch den Kontext und die Fußnote erkennen, dass hier Menschen aus den nichtjüdischen Völkern gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Keine Schwierigkeiten machen“ ist allgemein verständlich und gibt παρενοχλεῖν natürlicher wieder als das stärkere „belästigen“. Die Satzstellung hält die Folgerung und das persönliche Urteil des Jakobus deutlich fest.
