  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: de
  text: Da kam es zu einer so heftigen Auseinandersetzung, dass sie sich voneinander trennten.[a] Barnabas nahm Markus mit und segelte nach Zypern ab,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem so heftigen Streit“. Das griechische Wort kann eine starke Erregung, Reizung oder einen scharfen Zusammenstoß bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Da kam es zu
  rationale: Gibt den milden erzählerischen Anschluss durch δέ und das Eintreten eines neuen Geschehens durch ἐγένετο in natürlichem modernem Deutsch wieder.
- source_word: παροξυσμὸς
  choice: heftige Auseinandersetzung
  rationale: Bezeichnet hier einen scharfen, intensiven Konflikt; die Formulierung wahrt die Stärke des Ausdrucks, ohne den Vorgang zu moralisieren.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: dass sie sich voneinander trennten
  rationale: Die Folgebeziehung von ὥστε mit Infinitiv wird im Deutschen idiomatisch durch einen konsekutiven dass-Satz ausgedrückt.
- source_word: τόν τε Βαρναβᾶν
  choice: Barnabas
  rationale: τε leitet den ersten Teil der in Vers 40 fortgesetzten Gegenüberstellung ein; ein neuer deutscher Hauptsatz hält den Erzählfluss klar, ohne einen stärkeren Gegensatz einzutragen.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: nahm Markus mit
  rationale: Das Partizip bezeichnet eine Begleithandlung zum Auslaufen; „mitnehmen“ macht den Sinn von παραλαμβάνω natürlich und präzise deutlich.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: segelte nach Zypern ab
  rationale: „Absegeln“ bewahrt sowohl die Seereise als auch die in ἐκπλέω enthaltene Aufbruchs- beziehungsweise Wegbewegung.
theological_decisions:
- issue: Darstellung des Konflikts zwischen apostolischen Mitarbeitern
  choice: Der Konflikt wird unverhüllt als „heftige Auseinandersetzung“ bezeichnet.
  alternative: „Meinungsverschiedenheit“ oder „Streit“
  rationale: Der Text berichtet einen realen und intensiven Zusammenstoß. Die Übersetzung soll diese Spannung weder harmonisierend abschwächen noch durch stärker wertende Sprache verschärfen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Hauptsätze bilden den griechischen Satzbau lesefreundlich ab; die sachliche Darstellung wahrt die erzählerische und theologische Spannung.
