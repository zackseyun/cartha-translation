lexical_decisions:
- source_word: γνωστὰ
  choice: bekannt
  rationale: Das prädikativ gebrauchte Adjektiv steht in einem verblosen Satz. »Bekannt« gibt es unmittelbar wieder, ohne die im Griechischen nicht ausdrücklich enthaltene verbale Bedeutung »bekannt gemacht« einzutragen.
- source_word: ἀπ’
  choice: seit
  rationale: ἀπό bezeichnet hier den zeitlichen Ausgangspunkt. Im Deutschen gibt »seit« die Verbindung mit einer fortdauernden Geltung natürlich und knapp wieder.
- source_word: αἰῶνος
  choice: alters
  rationale: In dieser Zeitangabe bezeichnet αἰών eine weit zurückliegende Vergangenheit. Die feste Wendung »seit alters« bewahrt die Kürze des griechischen Textes, ohne ihn ausdrücklich zu »von Ewigkeit her« zu verstärken.
theological_decisions:
- issue: Zeitliche Reichweite des Bekanntseins in der knappen Aussage
  choice: Die Wendung als »seit alters bekannt« wiedergeben, ohne sie zu einer ausdrücklichen Aussage über ewiges Vorherwissen auszubauen.
  alternative: »von Ewigkeit her bekannt« oder die längere Lesart »der dies seit alters bekannt macht«
  rationale: Der SBLGNT-Text lautet äußerst knapp γνωστὰ ἀπ’ αἰῶνος. Die Übersetzung wahrt diese Kürze und lässt weitergehende Formulierungen abweichenden Textüberlieferungen beziehungsweise theologischen Folgerungen vorbehalten.
translation_notes:
  register: Knappes, würdiges Standarddeutsch. Die idiomatische Wendung »seit alters« entspricht der komprimierten Form des griechischen Zitats; die Kleinschreibung folgt dem syntaktischen Anschluss an den vorhergehenden Vers.
