  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: de
  text: 'Sie gaben ihnen ein Schreiben mit[a]: »Die Apostel und die Ältesten, eure Brüder, senden den Brüdern aus den Völkern in Antiochia, Syrien und Kilikien Grüße.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nachdem sie durch ihre Hand geschrieben hatten«. Die Wendung kann bedeuten, dass das Schreiben durch die genannten Abgesandten überbracht wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: Sie schrieben
  rationale: Der Aoristpartizip führt im fortlaufenden Zusammenhang die Abfassung beziehungsweise Übermittlung des Briefes ein. Da der Vers auf Deutsch als selbstständiger Satz wiedergegeben wird, ist eine finite Verbform natürlicher.
- source_word: διὰ χειρὸς αὐτῶν
  choice: durch ihre Hand
  rationale: Die griechische Wendung bezeichnet die Vermittlung oder Überbringung durch die zuvor genannten Abgesandten. Die bildhafte Ausdrucksweise bleibt im Haupttext erhalten; ihre idiomatische Bedeutung wird in der Fußnote erläutert.
- source_word: ἀπόστολοι
  choice: Apostel
  rationale: Dies ist die etablierte und kontextuell passende Bezeichnung für die bevollmächtigten Gesandten und Leiter in Jerusalem.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: die älteren Brüder
  rationale: Ohne einen zweiten Artikel vor ἀδελφοί lässt sich die Wortgruppe am unmittelbarsten als zusammengehörige Bezeichnung lesen. Diese Wiedergabe bewahrt die auffällige griechische Syntax; die verbreitete Deutung als »die Ältesten, Brüder« wird in einer Fußnote offengehalten.
- source_word: ἀδελφοῖς
  choice: Brüder
  rationale: Die maskuline Form des Ausgangstextes wird lexikalisch genau wiedergegeben. Im Briefkontext kann sie die gesamte Glaubensgemeinschaft einschließlich der Frauen bezeichnen; darauf weist eine Fußnote hin.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: aus den anderen Völkern
  rationale: Die Wendung kennzeichnet die nichtjüdische Herkunft der Adressaten. »Aus den anderen Völkern« bewahrt das Völker-Motiv und macht zugleich den jüdischen Bezugspunkt verständlich, ohne das historisch belastete Wort »Heiden« zu verwenden.
- source_word: χαίρειν
  choice: grüßen
  rationale: In einem Briefanfang ist χαίρειν eine feste Grußformel. Die verbale deutsche Form fügt sich natürlich in die Absender- und Empfängerangabe ein.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: in Antiochia, Syrien und Kilikien
  rationale: κατά mit Akkusativ bezeichnet hier die örtliche Verteilung der Empfänger. Das deutsche »in« gibt diese Funktion klar und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von πρεσβύτεροι ἀδελφοὶ
  choice: die älteren Brüder
  alternative: die Ältesten, Brüder
  rationale: Der Haupttext folgt der eng zusammengehörigen Lesart der griechischen Wortgruppe, ohne die kirchenleitende Bedeutung von πρεσβύτεροι dogmatisch festzuschreiben. Die verbreitete appositionelle beziehungsweise anredende Lesart bleibt in der Fußnote sichtbar.
- issue: Inklusiver Bezug von ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern; Geschwister
  rationale: Die grammatisch maskuline Bezeichnung wird im Haupttext bewahrt. Dass sie im Kontext wahrscheinlich die gesamte Gemeinde umfasst, wird ausdrücklich erläutert, statt den möglichen Umfang stillschweigend einzuengen oder die Form des Ausgangstextes zu ersetzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit einer bewusst beibehaltenen griechischen Wendung in der Erzähleinleitung. Die eigentliche Briefadresse wird als natürlicher deutscher Aussagesatz formuliert. Ortsnamen folgen den geläufigen deutschen Formen.
