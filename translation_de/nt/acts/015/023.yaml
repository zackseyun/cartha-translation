revisions:
- from: 'Sie schrieben durch ihre Hand[a]: »Die Apostel und die älteren Brüder[b] grüßen die Brüder[c] aus den anderen Völkern in Antiochia, Syrien und Kilikien.«'
  to: 'Sie gaben ihnen ein Schreiben mit[a]: »Die Apostel und die Ältesten, eure Brüder, senden den Brüdern aus den Völkern in Antiochia, Syrien und Kilikien Grüße.«'
  rationale: Die Einleitung wird kontextgemäß und idiomatisch wiedergegeben, während die Fußnote die griechische Wendung διὰ χειρὸς αὐτῶν transparent macht. Die Absender werden als »Apostel und Älteste« bezeichnet; »eure Brüder« gibt die appositionelle Funktion von ἀδελφοί in natürlichem Deutsch wieder, ohne eine besondere Amtslehre zu behaupten. Die Empfänger sind ohne den Zusatz »anderen« als »Brüder aus den Völkern« wiedergegeben. Die Fußnoten b und c bleiben als erforderliche Erläuterungen erhalten, auch wenn in der geglätteten Satzform nur der Anker a gesetzt ist.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:15Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von γράψαντες διὰ χειρὸς αὐτῶν als »Sie schrieben durch ihre Hand« ist im Deutschen weder idiomatisch noch klar und verdeckt den kontextuellen Sinn der schriftlichen Mitgabe durch die Abgesandten. »Ältere Brüder« legt πρεσβύτεροι primär als Altersangabe aus, obwohl das Wort im Kontext von Apostelgeschichte 15 sehr wahrscheinlich die Ältesten bezeichnet. »Andere Völker« fügt zudem einen im griechischen Text nicht ausdrücklich vorhandenen Vergleich hinzu.
  naturalness: Die revidierte Fassung verwendet für die erzählerische Einleitung eine natürliche deutsche Formulierung. Die Briefadresse bleibt bewusst knapp und formelhaft, wird aber als deutscher Grußsatz lesbar.
  terminology: »Älteste« gibt πρεσβύτεροι im gemeindlichen Kontext treffend wieder, ohne dessen institutionelle Ausgestaltung zu bestimmen. »Aus den Völkern« bildet ἐξ ἐθνῶν ohne die zusätzliche Wertung oder den Zusatz »anderen« ab. Beide Vorkommen von ἀδελφοί bleiben als »Brüder« erhalten; die mögliche inklusive Referenz wird erläutert.
  issues:
  - severity: high
    issue: »älteren Brüder« für πρεσβύτεροι ἀδελφοί
    rationale: Die Formulierung verschiebt πρεσβύτεροι in Richtung bloßen Lebensalters und ist im unmittelbaren Kontext der Jerusalemer »Apostel und Ältesten« sachlich irreführend. Die genaue syntaktische Beziehung zu ἀδελφοί kann in der Fußnote als strittig kenntlich bleiben.
  - severity: medium
    issue: »aus den anderen Völkern« für τοῖς ἐξ ἐθνῶν
    rationale: »Anderen« ist keine explizite Komponente des griechischen Ausdrucks. »Aus den Völkern« wahrt die knappe, jüdisch geprägte Gegenüberstellung des Textes ohne einen zusätzlichen Vergleich einzutragen.
  - severity: medium
    issue: Unidiomatische Einleitung »Sie schrieben durch ihre Hand«
    rationale: Die wörtliche Übertragung der griechischen Hand-Wendung ist im modernen Deutsch nicht verständlich. Der Kontext weist auf ein den Delegierten mitgegebenes Schreiben; die wörtliche Wendung kann in einer Fußnote erklärt werden.
  revised_text: 'Sie gaben ihnen ein Schreiben mit[a]: »Die Apostel und die Ältesten, eure Brüder, senden den Brüdern aus den Völkern in Antiochia, Syrien und Kilikien Grüße.«'
  revised_footnotes:
