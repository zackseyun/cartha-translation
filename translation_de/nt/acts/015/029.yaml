  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: de
  text: euch von Götzenopferfleisch[a], von Blut, von Ersticktem[b] und von sexueller Unmoral[c] fernzuhalten. Wenn ihr euch davor bewahrt, werdet ihr richtig handeln. Lebt wohl![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dingen, die Götzen geopfert wurden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fleisch von erstickten Tieren“ beziehungsweise „erdrosselten Tieren“.'
    reason: lexical_alternative
  - marker: c
    text: Der griechische Begriff kann allgemein sexuelles Fehlverhalten bezeichnen. Manche verstehen ihn hier im Licht der Verbote im 3. Buch Mose enger, etwa als unerlaubte sexuelle Verbindungen.
    reason: alternative_reading
  - marker: d
    text: 'Auch: „Bleibt gesund!“ Der griechische Ausdruck ist eine übliche Schlussformel in Briefen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: euch … fernzuhalten
  rationale: Der Infinitiv gibt den Inhalt der Anweisung wieder. „Sich von etwas fernhalten“ ist im modernen Deutsch natürlich und bewahrt den Sinn des bewussten Meidens.
- source_word: εἰδωλοθύτων
  choice: Götzenopferfleisch
  rationale: Der Ausdruck bezeichnet Götzen geopferte Dinge, im Zusammenhang besonders Speise beziehungsweise Fleisch. Das geläufige Kompositum ist prägnant; die breitere Form steht in der Fußnote.
- source_word: αἵματος
  choice: Blut
  rationale: Die knappe Wiedergabe entspricht dem griechischen Ausdruck, ohne die Art des Verbots im Text weiter auszudeuten.
- source_word: πνικτῶν
  choice: Ersticktem
  rationale: Das substantivierte Adjektiv bezeichnet Ersticktes, besonders Fleisch von Tieren, deren Blut nicht abgelassen wurde. Die Wiedergabe bewahrt die knappe und leicht offene Form des Griechischen.
- source_word: πορνείας
  choice: sexueller Unmoral
  rationale: Der Ausdruck hat einen breiten Bedeutungsumfang. Diese Wiedergabe vermeidet eine ungerechtfertigte Beschränkung auf eine einzelne Form sexuellen Fehlverhaltens.
- source_word: ἐξ ὧν διατηροῦντες ἑαυτούς
  choice: Wenn ihr euch davor bewahrt
  rationale: Die griechische Partizipialkonstruktion wird als natürliche deutsche Bedingung wiedergegeben; „davor“ verweist klar auf die gesamte vorherige Liste.
- source_word: εὖ πράξετε
  choice: handelt ihr richtig
  rationale: Die Wendung bezeichnet hier das rechte, angemessene Tun. „Handelt ihr richtig“ ist im Deutschen klarer als das potenziell mehrdeutige „wird es euch gut gehen“.
- source_word: ἔρρωσθε
  choice: Lebt wohl!
  rationale: Der Imperativ dient als konventionelle Schlussformel eines Briefes. „Lebt wohl!“ bewahrt zugleich einen leichten Anklang an das Wohlergehen.
theological_decisions:
- issue: Bedeutung von πορνεία im Aposteldekret
  choice: Im Haupttext breit als „sexuelle Unmoral“ wiedergegeben.
  alternative: Enger als „Unzucht“ oder als unerlaubte Verbindungen im Licht von Levitikus 18 verstanden.
  rationale: Der Vers selbst grenzt den Begriff nicht ausdrücklich auf ein bestimmtes sexuelles Vergehen oder bestimmte unerlaubte Verbindungen ein. Die breite lexikalische Bedeutung bleibt daher im Haupttext erhalten, während die kontextuell engere Deutung in der Fußnote genannt wird.
- issue: Reichweite von εἰδωλόθυτα und πνικτά
  choice: Im Haupttext mit „Götzenopferfleisch“ und „Ersticktem“ wiedergegeben.
  alternative: Allgemeiner „Götzen geopferte Dinge“ und „erdrosselte Tiere/Fleisch von erstickten Tieren“.
  rationale: Der Speisekontext legt Fleisch nahe, doch die griechischen substantivierten Formen sind nicht vollständig darauf beschränkt. Die Fußnoten halten die formal breiteren Möglichkeiten offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer knappen, brieflichen Schlussformel. Der Satz beginnt entsprechend dem gelieferten Verssegment mit einem Infinitivanschluss; „handelt ihr richtig“ vermeidet eine missverständliche Erfolgs- oder Heilszusage. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
