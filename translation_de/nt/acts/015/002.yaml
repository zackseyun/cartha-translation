id: ACT.15.2
reference: Acts 15:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: de
  text: Als es aber zwischen Paulus und Barnabas und ihnen zu heftigem Streit und eingehender Auseinandersetzung gekommen war,[a] bestimmten sie, dass Paulus und Barnabas sowie einige andere aus ihrer Mitte wegen dieser Angelegenheit zu den Aposteln und Ältesten nach Jerusalem hinaufgehen sollten.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kein geringer Streit und keine geringe Auseinandersetzung“. Das Griechische betont durch diese Ausdrucksweise das Ausmaß des Konflikts.'
    reason: lexical_alternative
  - marker: b
    text: „Nach Jerusalem hinaufgehen“ ist die im Griechischen übliche Ausdrucksweise für eine Reise nach Jerusalem.
    reason: cultural_note
  - marker: c
    text: 'Oder: „wegen dieser Streitfrage“ oder „betreffs dieser Frage“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: Als es aber ... gekommen war
  rationale: Der Genitivus absolutus bezeichnet den vorausgehenden zeitlichen und begleitenden Umstand; die Formulierung gibt zugleich die weiterführende Kraft von δέ wieder.
- source_word: στάσεως καὶ ζητήσεως οὐκ ὀλίγης
  choice: zu einem heftigen Streit und einer ausführlichen Auseinandersetzung
  rationale: στάσις bezeichnet ernsthaften Konflikt, während ζήτησις die intensive Erörterung oder Debatte hervorhebt. Das griechische οὐκ ὀλίγης ist eine Litotes; im Haupttext wird ihre verstärkende Wirkung natürlich deutsch wiedergegeben, die Form in der Fußnote erläutert.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: zwischen Paulus und Barnabas und ihnen
  rationale: Die Konstruktion bezeichnet die beteiligten Parteien. „Ihnen“ verweist im unmittelbaren Zusammenhang auf die Männer aus Judäa, ohne eine stärkere Gegnerschaft einzutragen, als der Text verlangt.
- source_word: ἔταξαν
  choice: bestimmten sie
  rationale: τάσσω bezeichnet hier die geordnete Festlegung beziehungsweise Beauftragung von Abgesandten. „Bestimmten“ bewahrt dies, ohne eine bestimmte Kirchenverfassung vorauszusetzen.
- source_word: ἀναβαίνειν
  choice: hinaufgehen sollten
  rationale: Das Verb bedeutet wörtlich „hinaufgehen“ und ist die übliche Ausdrucksweise für eine Reise nach Jerusalem; diese räumlich-kulturelle Wendung bleibt erhalten.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: einige andere aus ihrer Mitte
  rationale: Die Wendung bezeichnet weitere Personen, die aus der örtlichen Gemeinschaft als Vertreter ausgewählt wurden, ohne Geschlecht oder Amt näher festzulegen.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: die Apostel und Ältesten
  rationale: Beide im Kontext von Acts etablierten Bezeichnungen werden in ihrer üblichen und verständlichen Form wiedergegeben.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: um diese Streitfrage zu klären
  rationale: ζήτημα bezeichnet die strittige Frage. Die finale deutsche Fassung macht idiomatisch deutlich, worum es bei der Reise ging; die formalere Alternative „wegen dieser Streitfrage“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bestimmung der Streitparteien
  choice: Der Streit wird als zwischen Paulus und Barnabas einerseits und „ihnen“ andererseits dargestellt; „ihnen“ verweist auf die Männer aus Judäa aus Vers 1.
  alternative: Paulus und Barnabas gerieten mit ihnen in heftigen Streit und eine ausführliche Auseinandersetzung.
  rationale: Die Wiedergabe folgt dem unmittelbaren narrativen Bezug und vermeidet es, weitergehende lehrmäßige oder institutionelle Folgerungen in den Text einzutragen.
- issue: Institutionelle Aussagekraft von ἔταξαν
  choice: „bestimmten sie“ bezeichnet eine gemeinschaftliche, geordnete Entsendung.
  alternative: „sie beschlossen“ oder „sie ordneten an“
  rationale: Die Übersetzung zeigt, dass Vertreter festgelegt wurden, ohne entweder den bloßen Beschluss oder eine hierarchische Anordnung stärker zu behaupten, als der griechische Text erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auseinandersetzung“ unterscheidet die intensive Erörterung vom eigentlichen „Streit“. Die Litotes wird zugunsten unmittelbarer Verständlichkeit im Haupttext aufgelöst und in der Fußnote transparent gemacht.
