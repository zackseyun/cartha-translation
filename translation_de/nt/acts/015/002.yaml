revisions:
- from: Als es aber zu einem heftigen Streit und einer ausführlichen Auseinandersetzung zwischen Paulus und Barnabas und ihnen gekommen war,[a] bestimmten sie, dass Paulus und Barnabas sowie einige andere aus ihrer Mitte zu den Aposteln und Ältesten nach Jerusalem hinaufgehen sollten,[b] um diese Streitfrage zu klären.[c]
  to: Als es aber zwischen Paulus und Barnabas und ihnen zu heftigem Streit und eingehender Auseinandersetzung gekommen war,[a] bestimmten sie, dass Paulus und Barnabas sowie einige andere aus ihrer Mitte wegen dieser Angelegenheit zu den Aposteln und Ältesten nach Jerusalem hinaufgehen sollten.[b][c]
  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext enthaltene Aussage, die Delegierten sollten die Streitfrage „klären“, und gibt περὶ neutral mit „wegen dieser Angelegenheit“ wieder. Zugleich wird die deutsche Wiedergabe der litotisch verstärkten Auseinandersetzung präzisiert. Fußnotenanker und -inhalt bleiben dem jeweiligen griechischen Ausdruck zugeordnet.
