id: ACT.15.40
reference: Acts 15:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: de
  text: Paulus aber wählte Silas aus und brach auf, nachdem die Brüder[b] ihn der Gnade des Herrn anvertraut hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nachdem die Brüder ihn der Gnade des Herrn übergeben beziehungsweise anbefohlen hatten.'
    reason: lexical_alternative
  - marker: b
    text: »Brüder« kann hier je nach Zusammenhang die ganze Gemeinschaft der Glaubenden, einschließlich der Frauen, bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den leichten Gegensatz zu dem Aufbruch von Barnabas im vorhergehenden Vers.
- source_word: ἐπιλεξάμενος
  choice: wählte … aus
  rationale: Das Aoristpartizip bezeichnet die persönliche Auswahl des Silas durch Paulus vor dem Aufbruch; die finite Wiedergabe ist im Deutschen natürlich.
- source_word: Σιλᾶν
  choice: Silas
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: ἐξῆλθεν
  choice: brach auf
  rationale: Im Reisebericht bezeichnet das Verb das Aufbrechen beziehungsweise Sich-auf-den-Weg-Machen.
- source_word: παραδοθεὶς
  choice: anvertraut hatten
  rationale: Das passive Partizip beschreibt hier, dass Paulus von der Gemeinde der fürsorglichen Gnade des Herrn übergeben wurde. Die aktive Umformung mit den ausdrücklich genannten Handelnden ergibt natürliches Deutsch, ohne den Sinn zu verändern.
- source_word: τῇ χάριτι
  choice: der Gnade
  rationale: Bewahrt den theologischen Begriff χάρις, statt ihn mit »gnädiger Fürsorge« aufzulösen.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Gibt den christlichen Titel κύριος wieder, ohne seinen hier nicht ausdrücklich bestimmten Referenten näher festzulegen.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: die Brüder
  rationale: Bewahrt die grammatisch maskuline Form des Ausgangstextes; eine Fußnote weist auf den möglichen weiteren gemeinschaftlichen Bezug hin.
theological_decisions:
- issue: Referent von »der Herr«
  choice: des Herrn
  alternative: des Herrn Jesus; Gottes
  rationale: Der griechische Text nennt nur κύριος und legt den Referenten an dieser Stelle nicht ausdrücklich fest. Die Übersetzung bewahrt diese Offenheit.
- issue: Umfang von »Brüder«
  choice: Brüder im Haupttext mit erläuternder Fußnote
  alternative: Brüder und Schwestern; Glaubensgeschwister
  rationale: ἀδελφῶν ist grammatisch maskulin, kann im frühchristlichen Sprachgebrauch jedoch die gesamte Gemeinschaft einschließlich Frauen bezeichnen. Die Übersetzung bewahrt die Form und erläutert die mögliche Reichweite.
translation_notes:
  register: 'Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur wird für natürliches Deutsch leicht umgeformt: Das griechische Passivpartizip mit Agens wird als aktiver Nebensatz wiedergegeben. Die milde Gegenüberstellung durch δὲ und die begriffliche Offenheit von »Gnade« und »Herr« bleiben erhalten.'
