  variant: modern standard German
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: de
  text: Nimm diese Männer mit, reinige dich zusammen mit ihnen und übernimm ihre Kosten, damit sie sich den Kopf scheren können. Dann werden alle erkennen, dass an dem, was ihnen über dich berichtet worden ist[a], nichts dran ist, sondern dass auch du selbst nach dem Gesetz lebst und es hältst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „worin sie über dich unterrichtet worden sind“. Das griechische Verb kann „unterweisen“ oder allgemeiner „informieren“ bedeuten; hier bezieht es sich auf Aussagen, die über Paulus verbreitet wurden.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann bedeuten, in Übereinstimmung mit einer Vorgabe zu leben oder ihr zu folgen. Gemeint ist ein Leben, das sich am Gesetz ausrichtet und es hält.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Nimm diese Männer mit
  rationale: Das Partizip παραλαβών ist dem Imperativ untergeordnet und wird im Deutschen natürlich als weitere Aufforderung wiedergegeben. „Männer“ ergibt sich aus den vier Männern im vorhergehenden Vers.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: reinige dich zusammen mit ihnen
  rationale: ἁγνίζω bezeichnet hier eine rituelle Reinigung; die reflexive Formulierung gibt den Sinn des Imperativs idiomatisch wieder.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: übernimm ihre Kosten
  rationale: Gemeint ist, die mit ihrem Gelübde verbundenen Ausgaben für sie zu tragen.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: damit sie sich den Kopf scheren lassen können
  rationale: Der zukünftige Indikativ nach ἵνα drückt hier Zweck beziehungsweise beabsichtigte Folge aus. Der griechische Singular „den Kopf“ ist distributiv und kann im Deutschen ebenso natürlich stehen.
- source_word: γνώσονται πάντες
  choice: Dann werden alle erkennen
  rationale: „Dann“ verdeutlicht den Folgezusammenhang; γινώσκω bezeichnet hier das aufgrund des sichtbaren Handelns gewonnene Erkennen.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: was ihnen über dich berichtet worden ist
  rationale: κατηχέω kann „unterweisen“ oder allgemeiner „informieren“ bedeuten. Im Zusammenhang geht es um verbreitete Aussagen über Paulus; „berichtet“ lässt offen, wie förmlich diese vermittelt wurden.
- source_word: οὐδέν ἐστιν
  choice: dass ... nichts dran ist
  rationale: Die geläufige deutsche Wendung bringt zum Ausdruck, dass die Behauptungen keinen Bestand haben, ohne ihren genauen Inhalt auszudeuten.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: sondern dass auch du selbst dich an das Gesetz hältst und danach lebst
  rationale: στοιχέω bezeichnet ein ausgerichtetes, regelgemäßes Leben, während φυλάσσω τὸν νόμον das Halten des Gesetzes ausdrückt. Die Formulierung bewahrt beide Aspekte in natürlichem Deutsch sowie die Betonung von καὶ αὐτός.
- source_word: νόμον
  choice: das Gesetz
  rationale: Der Kontext weist auf das jüdische Gesetz; die schlichte Wiedergabe vermeidet den interpretierenden Zusatz „mosaisch“.
theological_decisions:
- issue: Paulus’ Verhältnis zum Gesetz in dieser Erzählung
  choice: 'Die Aussage wird als Beschreibung seines erkennbaren Verhaltens wiedergegeben: „auch du selbst dich an das Gesetz hältst und danach lebst“.'
  alternative: „auch du selbst ordnungsgemäß wandelst und das Gesetz hältst“
  rationale: Der Vers beschreibt, welchen Schluss andere aus der Teilnahme des Paulus an der Reinigung und aus seiner Kostenübernahme ziehen sollen. Die Übersetzung entscheidet nicht darüber hinaus, wie diese Handlung mit seinen sonstigen Aussagen über das Gesetz theologisch zu harmonisieren ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Nichts dran“ ist eine natürliche, klare Redewendung; die rituelle und rechtliche Begrifflichkeit bleibt dennoch erkennbar. Beide Fußnotenmarker stehen an den jeweils erläuterten Formulierungen.
