id: ACT.21.39
reference: Acts 21:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: de
  text: 'Paulus aber sagte: »Ich bin ein Jude aus Tarsus in Kilikien, Bürger einer nicht unbedeutenden Stadt. Ich bitte dich: Erlaube mir, zum Volk zu sprechen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος μέν εἰμι Ἰουδαῖος
  choice: Ich bin ein Jude
  rationale: Im Deutschen ist die substantivische Selbstbezeichnung natürlich und gibt die ethnisch-religiöse Identität klar wieder. ἄνθρωπος muss in dieser Konstruktion nicht eigens mit »Mann« wiedergegeben werden; μέν hebt die Selbstvorstellung hervor, ohne hier zwingend ein eigenes Wort zu verlangen.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: aus Tarsus in Kilikien
  rationale: Die Herkunftsbezeichnung wird in natürlichem modernem Deutsch wiedergegeben; die Bürgerstellung folgt entsprechend der griechischen Wortfolge mit πολίτης.
- source_word: οὐκ ἀσήμου πόλεως
  choice: einer nicht unbedeutenden Stadt
  rationale: Bewahrt die Litotes des griechischen Ausdrucks, statt sie zu »einer bedeutenden Stadt« zu glätten.
- source_word: πολίτης
  choice: Bürger
  rationale: Bezeichnet die städtische Zugehörigkeit beziehungsweise Bürgerstellung und ist genauer als »Einwohner«.
- source_word: δέομαι δέ σου
  choice: Ich bitte dich
  rationale: Gibt die eindringliche, respektvolle Bitte in idiomatischem Deutsch wieder; »ich flehe dich an« wäre in diesem Kontext zu stark.
- source_word: ἐπίτρεψόν μοι
  choice: Erlaube mir
  rationale: Passt als höfliche Bitte an einen militärischen Befehlshaber und klingt gegenwärtiger als »gestatte mir«.
- source_word: λαλῆσαι πρὸς τὸν λαόν
  choice: zum Volk zu sprechen
  rationale: Gibt λαός als »Volk« wieder und erhält damit den möglichen gemeinschaftlichen Bezug über eine bloße Menschenmenge hinaus.
theological_decisions:
- issue: Bedeutung von Ἰουδαῖος
  choice: Jude
  alternative: Judäer
  rationale: Da Paulus anschließend Tarsus in Kilikien als seine Herkunft nennt, bezeichnet Ἰουδαῖος hier am ehesten seine ethnisch-religiöse Identität und nicht seine Herkunft aus Judäa.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Selbstvorstellung und die griechische Litotes bleiben erhalten; unnötig amtssprachliche oder altertümliche Formulierungen werden vermieden.
