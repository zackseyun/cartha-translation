  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: de
  text: 'Was aber die Nichtjuden betrifft, die zum Glauben gekommen sind: Wir haben ihnen geschrieben, nachdem wir beschlossen hatten, dass sie sich von Götzenopferfleisch, von Blut, von Fleisch von erstickten Tieren und von sexueller Unmoral fernhalten sollen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir haben gesandt“. Das griechische Verb nennt nicht, was gesandt wurde; der Zusammenhang verweist auf das Schreiben mit dem Beschluss aus Apostelgeschichte 15.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν
  choice: Was aber die Nichtjuden betrifft, die zum Glauben gekommen sind
  rationale: περὶ δὲ leitet mit leichter Gegenüberstellung ein neues Thema ein. ἔθνη bezeichnet hier Nichtjuden; die Umschreibung vermeidet das heute missverständliche „Heiden“. Der Perfektpartizip πεπιστευκότων beschreibt Menschen, die zum Glauben gekommen sind und nun Glaubende sind.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: Wir haben ihnen geschrieben
  rationale: Das betonte ἡμεῖς wird durch „Wir“ bewahrt. ἀπεστείλαμεν lässt das Gesandte unausgesprochen; im Zusammenhang von Apostelgeschichte 15 ist die schriftliche Mitteilung gemeint. „ihnen geschrieben“ ist im Deutschen idiomatisch, ohne ausdrücklich ein im Vers nicht genanntes Substantiv wie „Brief“ einzusetzen.
- source_word: κρίναντες
  choice: und entschieden
  rationale: Der Aoristpartizip bezeichnet die dem Senden zugrunde liegende Entscheidung. Eine koordinierte Wiedergabe ist im Deutschen natürlicher als „nachdem wir entschieden hatten“ und erhält den sachlichen Sinn.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: dass sie sich … fernhalten sollen
  rationale: Die mediale Form trägt den reflexiven Gedanken des Sich-Hütens bzw. Sich-Fernhaltens. „sollen“ gibt den Inhalt des gefassten Beschlusses verständlich wieder.
- source_word: εἰδωλόθυτον
  choice: Götzenopferfleisch
  rationale: Das Wort bezeichnet hier Speise, besonders Fleisch, das mit einem Götzenopfer verbunden ist. Der etablierte deutsche Ausdruck ist präzise und knapp.
- source_word: αἷμα
  choice: Blut
  rationale: Die knappe Form des griechischen Textes wird bewahrt; eine ausdrückliche Ergänzung wie „dem Genuss von“ wäre auslegend.
- source_word: πνικτόν
  choice: Fleisch erstickter Tiere
  rationale: πνικτόν meint Nahrung von Tieren, die durch Ersticken getötet wurden und deren Blut nicht abfloss. Die konkrete deutsche Formulierung ist verständlicher als das substantivierte „Ersticktes“.
- source_word: πορνείαν
  choice: sexueller Unmoral
  rationale: πορνεία bezeichnet unerlaubtes sexuelles Verhalten in einem breiten Sinn. „sexuelle Unmoral“ wahrt diese Breite besser als das engere oder altertümliche „Unzucht“.
theological_decisions:
- issue: Geltung und Begründung der vier Verbote
  choice: Die vier Bestimmungen werden ohne zeitliche oder systematisch-theologische Einordnung wiedergegeben.
  alternative: Sie ausdrücklich als vorübergehende Regeln für Tischgemeinschaft oder als dauerhaftes universales Gebot zu kennzeichnen.
  rationale: Der Vers wiederholt den Inhalt des früheren Beschlusses, erklärt hier aber weder dessen gesamte Begründung noch Reichweite oder Geltungsdauer.
- issue: Deutung von πορνεία
  choice: Allgemein als „sexuelle Unmoral“ wiedergegeben.
  alternative: Den Ausdruck auf eine bestimmte Form sexuellen Fehlverhaltens oder auf verbotene Verwandtschaftsehen zu beschränken.
  rationale: Der unmittelbare Vers legt keine solche spezifische Eingrenzung eindeutig fest; die Übersetzung sollte diese Auslegungsfrage nicht vorentscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nichtjuden“ wurde dem potenziell abwertend oder religionsgeschichtlich missverständlichen „Heiden“ vorgezogen. Die Liste bleibt knapp und parallel; die einzige Fußnote kennzeichnet die im Deutschen idiomatisch ergänzte Art der Mitteilung.
