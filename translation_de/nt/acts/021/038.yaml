  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: de
  text: Du bist also nicht der Ägypter, der vor einiger Zeit einen Aufstand angezettelt und die viertausend Sikarier[a] in die Wüste hinausgeführt hat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dolchmänner“ beziehungsweise „Attentäter“. Das griechische Wort bezeichnet die Sikarier, eine Gruppe, die für Anschläge mit verborgenen Dolchen bekannt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Dann bist du also nicht
  rationale: Die Verbindung leitet eine Schlussfolgerung in Frageform ein. „Dann ... also nicht“ gibt diese Folgerung im modernen Deutschen natürlich wieder.
- source_word: ὁ Αἰγύπτιος
  choice: der Ägypter
  rationale: Der Artikel kennzeichnet eine dem Sprecher bekannte oder berüchtigte Person; „der Ägypter“ bewahrt diese Bestimmtheit.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: vor einiger Zeit
  rationale: Die Wendung bezeichnet eine nicht lange zurückliegende Zeit, ohne eine genaue Zahl von Tagen festzulegen.
- source_word: ἀναστατώσας
  choice: einen Aufstand angezettelt
  rationale: Im politischen Zusammenhang bezeichnet das Verb das Erregen von Unruhe beziehungsweise eines Aufstands; „angezettelt“ ist verständlich und bewahrt die aktive Anstiftung.
- source_word: ἐξαγαγὼν εἰς τὴν ἔρημον
  choice: in die Wüste hinausgeführt
  rationale: Die Wiedergabe erhält sowohl die leitende Handlung als auch die Bewegung hinaus in ein unbewohntes Gebiet.
- source_word: τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων
  choice: die viertausend Sikarier
  rationale: Der griechische Ausdruck bezeichnet die bestimmte Gruppe von viertausend Männern, die zu den Sikariern gehörten. Die historische Gruppenbezeichnung bleibt im Text erhalten und wird in der Fußnote erklärt.
theological_decisions: []
