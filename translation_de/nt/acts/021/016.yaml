id: ACT.21.16
reference: Acts 21:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: de
  text: Auch einige der Jünger aus Cäsarea zogen mit uns. Sie brachten uns zu Mnason, einem Zyprer und Jünger der ersten Zeit,[a] bei dem wir zu Gast sein sollten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem langjährigen Jünger“. Der Ausdruck kann bedeuten, dass Mnason schon seit der frühen Zeit der Jesusbewegung Jünger war.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Sie führten uns zu Mnason …, bei dem wir Unterkunft finden sollten“, oder: „Sie nahmen uns mit zum Haus Mnasons.“ Das griechische Partizip und das Verb für die Aufnahme als Gast lassen eng verwandte Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν
  choice: Auch einige der Jünger aus Cäsarea zogen mit uns
  rationale: 'Der Genitiv τῶν μαθητῶν ist partitiv: Einige aus der Gruppe der Jünger begleiteten die Reisenden. „zogen mit uns“ gibt die gemeinsame Reise natürlich wieder.'
- source_word: ἄγοντες
  choice: Sie brachten uns zu
  rationale: 'Das Partizip beschreibt, welche Aufgabe die mitreisenden Jünger übernahmen: Sie führten beziehungsweise brachten die Gruppe zu ihrem Gastgeber.'
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: zu Mnason, einem Zyprer
  rationale: τινι führt den zuvor nicht genannten Mnason unbestimmt ein. Im Deutschen wirkt die bloße Namensnennung mit anschließender Apposition natürlicher als „zu einem gewissen Mnason“; Κυπρίῳ bezeichnet seine Herkunft aus Zypern.
- source_word: ἀρχαίῳ μαθητῇ
  choice: Jünger der ersten Zeit
  rationale: ἀρχαῖος kann hier einen Jünger aus der frühen Zeit der Bewegung oder einen langjährigen Jünger bezeichnen. Die Formulierung wahrt den zeitlichen Bezug, ohne Mnason ausdrücklich zu einem der allerersten Jünger zu erklären.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: bei dem wir zu Gast sein sollten
  rationale: ξενίζω bezeichnet hier die Aufnahme und Unterbringung als Gäste; der Konjunktiv steht im Zusammenhang mit der beabsichtigten Unterkunft.
theological_decisions:
- issue: Zeitliche Bedeutung von ἀρχαίῳ μαθητῇ
  choice: Jünger der ersten Zeit
  alternative: langjähriger Jünger
  rationale: Der griechische Ausdruck lässt offen, ob vor allem Mnasons Zugehörigkeit seit der frühen Anfangszeit oder schlicht deren lange Dauer betont wird. Der Haupttext bewahrt den historischen Klang; die Fußnote nennt die andere naheliegende Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Zwei Hauptsätze vermeiden eine schwerfällige Partizipialkonstruktion. „zu Gast sein“ ist allgemein verständlich und bildet den Gedanken der gewährten Unterkunft natürlicher ab als das gehobene „Herberge nehmen“.
