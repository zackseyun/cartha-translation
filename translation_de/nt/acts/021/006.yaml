  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: de
  text: Nachdem wir voneinander Abschied genommen hatten[a], gingen wir an Bord des Schiffes; sie aber kehrten nach Hause[b] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem wir uns voneinander verabschiedet hatten.“ Der griechische Ausdruck kann sowohl eine Begrüßung als auch einen Abschied bezeichnen; der Zusammenhang spricht hier für einen Abschied.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu dem Ihren“ beziehungsweise „zu ihren eigenen Orten“. Gemeint ist ihr Zuhause oder ihr eigener Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: wir voneinander Abschied genommen hatten
  rationale: Das Verb kann je nach Zusammenhang ein Begrüßen oder Verabschieden bezeichnen. Da die Gruppen nun auseinandergehen, ist hier der Abschied gemeint; „voneinander Abschied nehmen“ gibt zudem die Gegenseitigkeit von ἀλλήλους wieder.
- source_word: ἐνέβημεν
  choice: gingen wir an Bord
  rationale: Das Verb bezeichnet hier das Betreten eines Schiffes. „An Bord gehen“ ist im modernen Deutschen die natürliche, präzise Wendung.
- source_word: πλοῖον
  choice: Schiff
  rationale: Der Ausdruck kann ein Boot oder Schiff bezeichnen. Im Zusammenhang der Seereise in der Apostelgeschichte ist „Schiff“ eine passende, etablierte Wiedergabe.
- source_word: ὑπέστρεψαν
  choice: kehrten sie ... zurück
  rationale: Die Wiedergabe entspricht der schlichten Bewegungsangabe des griechischen Verbs und wahrt den Erzählstil.
- source_word: εἰς τὰ ἴδια
  choice: nach Hause
  rationale: Wörtlich bezeichnet die idiomatische Wendung „das Eigene“ beziehungsweise „die eigenen Orte“. Im Kontext meint sie den eigenen Wohn- oder Lebensbereich; „nach Hause“ ist dafür natürliches Deutsch.
theological_decisions: []
