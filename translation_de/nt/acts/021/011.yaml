id: ACT.21.11
reference: Acts 21:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: de
  text: 'Er kam zu uns, nahm den Gürtel des Paulus, band sich selbst die Füße und die Hände und sagte: „So spricht der Heilige Geist[a]: Den Mann, dem dieser Gürtel gehört,[b] werden die Juden in Jerusalem auf diese Weise fesseln und in die Hände der Nichtjuden ausliefern.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das sagt der Heilige Geist.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „[derjenige], dessen dieser Gürtel ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζώνην
  choice: Gürtel
  rationale: „Gürtel“ ist die klare, gegenwärtige deutsche Bezeichnung für das um die Taille getragene Kleidungsstück und passt zur symbolischen Handlung.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: band sich selbst Füße und Hände
  rationale: Das Reflexivpronomen bezieht sich natürlich auf Agabus als Handelnden. „Band“ bewahrt zudem die sprachliche Verbindung zum späteren „fesseln“.
- source_word: Τάδε λέγει
  choice: So spricht
  rationale: Die Formulierung bewahrt den feierlichen, aus prophetischen Aussprüchen bekannten Charakter und ist im Deutschen idiomatisch.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Dies ist die etablierte und gegenwärtige deutsche Wiedergabe.
- source_word: Τὸν ἄνδρα
  choice: Den Mann
  rationale: Die Wiedergabe entspricht dem bestimmten griechischen Ausdruck und erhält die prophetische Formulierung.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: dem dieser Gürtel gehört
  rationale: Die Formulierung gibt die Besitzbeziehung natürlich und genau wieder.
- source_word: οὕτως
  choice: auf diese Weise
  rationale: Der Ausdruck verweist ausdrücklich auf die unmittelbar zuvor vollzogene symbolische Fesselung.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Der griechische Text nennt allgemein „die Juden“; eine Einschränkung auf Führungspersonen wäre eine nicht ausdrücklich vorhandene Präzisierung.
- source_word: παραδώσουσιν
  choice: werden … ausliefern
  rationale: „Ausliefern“ bezeichnet passend die feindliche Übergabe in die Gewalt einer anderen Gruppe.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: in die Hände der Nichtjuden
  rationale: Die biblische Machtmetapher „in die Hände“ bleibt erhalten; ἔθνη bezeichnet hier im Gegensatz zu den Juden die nichtjüdischen Menschen beziehungsweise Behörden.
theological_decisions:
- issue: Prophetische Formel als unmittelbare Rede des Geistes
  choice: So spricht der Heilige Geist
  alternative: Das sagt der Heilige Geist
  rationale: Die gewählte Form bewahrt die feierliche prophetische Sprachform und den im Text erhobenen Autoritätsanspruch, ohne ihn weiter auszudeuten.
- issue: Bezug von ἑαυτοῦ
  choice: Agabus band sich selbst Füße und Hände
  alternative: Agabus band Paulus Füße und Hände
  rationale: Das Reflexivpronomen bezieht sich grammatisch am natürlichsten auf das Subjekt des Partizips, also auf Agabus. Die Handlung wird damit als prophetische Zeichenhandlung wiedergegeben.
- issue: Bedeutung von ἐθνῶν im jüdisch-römischen Zusammenhang
  choice: Nichtjuden
  alternative: Heiden / Völker
  rationale: „Nichtjuden“ bringt den hier entscheidenden Gegensatz zu „den Juden“ klar zum Ausdruck, ohne die im heutigen Deutsch mögliche abwertende Nebenbedeutung von „Heiden“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die prophetische Formel bleibt bewusst feierlich. Die Fußnotenmarker stehen jeweils direkt bei der betreffenden Formulierung; die im englischen Beratungstext offenbar verrutschte Zuordnung wurde sachgerecht berichtigt.
