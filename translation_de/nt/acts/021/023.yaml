source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: de
  text: 'Tu deshalb, was wir dir sagen: Bei uns sind vier Männer, die ein Gelübde auf sich genommen haben[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die ein Gelübde haben“; gemeint ist, dass sie durch ein Gelübde gebunden sind.'
    reason: lexical_alternative
  - marker: b
    text: Der weitere Zusammenhang kann auf ein Nasiräergelübde hindeuten; in diesem Vers steht jedoch nur „ein Gelübde“.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν ποίησον
  choice: Tu deshalb
  rationale: οὖν kennzeichnet die Folgerung aus dem Vorangehenden; τοῦτο wird im Deutschen natürlich durch den anschließenden Inhalt des Gebots aufgenommen.
- source_word: ὅ σοι λέγομεν
  choice: was wir dir sagen
  rationale: Die Relativkonstruktion bezeichnet den Inhalt des Gebots und lässt sich im Deutschen direkt und idiomatisch wiedergeben.
- source_word: εἰσὶν ἡμῖν
  choice: Bei uns sind
  rationale: Die Existenzkonstruktion mit Dativ bezeichnet hier das Vorhandensein im Umfeld der Sprecher. „Bei uns sind“ klingt im Deutschen natürlicher und weniger besitzanzeigend als „wir haben“.
- source_word: ἄνδρες τέσσαρες
  choice: vier Männer
  rationale: ἀνήρ bezeichnet hier männliche erwachsene Personen; „Männer“ ist die natürliche und präzise Wiedergabe.
- source_word: εὐχὴν ἔχοντες ἀφ’ ἑαυτῶν
  choice: die ein Gelübde auf sich genommen haben
  rationale: Die deutsche Wendung gibt verständlich wieder, dass die Männer selbst durch ein Gelübde gebunden sind. Sie bewahrt den Bezug auf sie selbst, ohne im Haupttext die Art des Gelübdes näher festzulegen.
theological_decisions:
- issue: Art des Gelübdes
  choice: Im Haupttext steht allgemein „ein Gelübde“.
  alternative: „ein Nasiräergelübde“
  rationale: Der weitere Zusammenhang kann an ein Nasiräergelübde denken lassen, doch der Vers selbst nennt lediglich εὐχή, also ein Gelübde. Die genauere Bestimmung soll daher nicht in den Haupttext eingetragen werden.
- issue: Nuance von εὐχὴν ἔχοντες ἀφ’ ἑαυτῶν
  choice: „ein Gelübde auf sich genommen haben“
  alternative: „unter einem eigenen Gelübde stehen“
  rationale: Die gewählte Formulierung ist idiomatisches Deutsch und bringt die persönliche Bindung der Männer zum Ausdruck. Sie behauptet nicht mehr über Anlass oder genaue Form des Gelübdes, als der griechische Text erkennen lässt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Satzbau. „Tu“ bewahrt die knappe Form des Imperativs; „Bei uns sind“ gibt die griechische Dativkonstruktion natürlich wieder. Die Fußnoten sichern die formale Nähe und bewahren die im Vers verbleibende Offenheit über die Art des Gelübdes.
