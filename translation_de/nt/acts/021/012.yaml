id: ACT.21.12
reference: Acts 21:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: de
  text: Als wir das hörten, baten wir und die Einheimischen ihn eindringlich, nicht nach Jerusalem hinaufzugehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „drängten wir und die Einheimischen ihn, nicht nach Jerusalem hinaufzugehen.“ Das Verb kann sowohl ein eindringliches Bitten als auch ein dringendes Zureden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: Als wir das hörten
  rationale: Die Wendung führt den zeitlichen Anlass mit leichter Fortführung der Erzählung ein. Das singularische deutsche „das“ verweist natürlich auf den zuvor berichteten prophetischen Inhalt, ohne den Sinn des griechischen Plurals ταῦτα einzuengen.
- source_word: παρεκαλοῦμεν
  choice: baten … eindringlich
  rationale: παρακαλέω bezeichnet hier angesichts der angekündigten Gefahr ein ernstes Bitten oder Drängen. Das Imperfekt legt ein anhaltendes Bemühen nahe; „baten … eindringlich“ gibt diese Intensität in natürlichem Deutsch wieder.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: wir und die Einheimischen
  rationale: 'Die Konstruktion nennt zwei gemeinsam handelnde Gruppen: den Erzählerkreis und die Menschen des betreffenden Ortes. „Einheimische“ ist knapp, verständlich und registergerecht.'
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: ihn …, nicht … hinaufzugehen
  rationale: Der artikulierte Infinitiv mit μή bezeichnet den Inhalt der Bitte. Das Pronomen bezieht sich auf Paulus; die deutsche Infinitivkonstruktion bildet den Zusammenhang klar ab.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Bei Städtenamen ist „nach“ die natürliche deutsche Richtungsangabe.
- source_word: ἀναβαίνειν
  choice: hinaufzugehen
  rationale: Die Richtungsangabe „hinauf“ bewahrt die im Griechischen übliche Vorstellung des Hinaufziehens nach Jerusalem.
theological_decisions:
- issue: Richtungsidiom für die Reise nach Jerusalem
  choice: nach Jerusalem hinaufzugehen
  alternative: nach Jerusalem zu gehen
  rationale: Das griechische ἀναβαίνειν wird ausdrücklich wiedergegeben. So bleibt das traditionelle geografisch-kulturelle Richtungsidiom erhalten, ohne ihm eine zusätzliche theologische Bedeutung zuzuschreiben.
- issue: Stärke des Appells
  choice: baten … eindringlich
  alternative: drängten ihn
  rationale: Der Kontext trägt den Sinn ernsten Flehens, doch das Verb allein legt nicht ausschließlich eine bestimmte emotionale Abstufung fest. Die Hauptfassung ist natürlich und kontextgerecht; die Fußnote hält die lexikalische Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Ablauf, während „Als wir das hörten“ und „baten … eindringlich“ natürlich deutsch formuliert sind. Der Marker [a] steht im Haupttext unmittelbar nach dem vollständigen Satz.
