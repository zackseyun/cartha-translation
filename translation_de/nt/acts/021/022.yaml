base_translation:
  language: en
  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: de
  text: Was ist nun zu tun?[a] Sie werden bestimmt hören, dass du gekommen bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was ist es nun?« Die griechische Wendung fragt hier danach, was angesichts der Lage zu tun ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Was ist nun zu tun?
  rationale: Wörtlich lautet die Wendung etwa »Was ist es nun?«; im Zusammenhang fragt sie idiomatisch nach dem angesichts der Lage gebotenen Vorgehen. Die gewählte Fassung gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: πάντως
  choice: bestimmt
  rationale: Das Adverb unterstreicht hier die Gewissheit des angekündigten Geschehens. »Bestimmt« ist in diesem Satz natürlich und bewahrt den Nachdruck.
- source_word: ἀκούσονται
  choice: sie werden hören
  rationale: Die griechische Futurform ist hier aktivisch zu verstehen. Das im Zusammenhang erschließbare Subjekt wird im Deutschen mit »sie« ausgedrückt.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was sie hören werden, nicht eine Begründung.
- source_word: ἐλήλυθας
  choice: du gekommen bist
  rationale: Das Perfekt bezeichnet Paulus’ vollzogene Ankunft mit gegenwärtigem Ergebnis. Das deutsche Perfekt bildet dies angemessen ab.
