id: ACT.21.29
reference: Acts 21:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: de
  text: Denn sie hatten zuvor Trophimus, den Epheser, mit ihm in der Stadt gesehen und meinten, Paulus habe ihn in den Tempel[a] hineingebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier die gesamte Tempelanlage beziehungsweise den Tempelbezirk bezeichnen, nicht nur das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν … προεωρακότες
  choice: sie hatten zuvor … gesehen
  rationale: Die periphrastische Konstruktion bezeichnet ein Sehen, das zeitlich vor der geschilderten Annahme lag; das deutsche Plusquamperfekt mit „zuvor“ gibt dies klar wieder.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: Trophimus, den Epheser
  rationale: Die Apposition bezeichnet Trophimus nach seiner Herkunft und bewahrt die griechische Bestimmtheit in natürlichem Deutsch.
- source_word: ἐν τῇ πόλει σὺν αὐτῷ
  choice: mit ihm in der Stadt
  rationale: „Mit ihm“ gibt σύν mit Dativ direkt wieder; das Pronomen bezieht sich im Kontext auf Paulus. „In der Stadt“ bezeichnet Jerusalem als städtischen Raum im Unterschied zum Tempelbereich.
- source_word: ἐνόμιζον
  choice: meinten
  rationale: Das Verb bezeichnet hier eine aus der vorherigen Beobachtung gezogene, aber nicht gesicherte Schlussfolgerung. „Meinten“ bleibt neutral und idiomatisch.
- source_word: εἰς τὸ ἱερὸν
  choice: in den Tempel
  rationale: „Tempel“ ist die geläufige deutsche Wiedergabe; eine Fußnote hält fest, dass ἱερόν den Tempelkomplex beziehungsweise dessen Bezirke bezeichnen kann.
- source_word: εἰσήγαγεν
  choice: habe … hineingebracht
  rationale: Der Konjunktiv I kennzeichnet die inhaltlich abhängige Annahme der Menge, während „hineingebracht“ die gerichtete Bewegung des griechischen Verbs ausdrückt.
theological_decisions:
- issue: Bedeutungsumfang von ἱερόν in der Anschuldigung gegen Paulus
  choice: Im Haupttext „Tempel“, ergänzt durch eine erläuternde Fußnote
  alternative: „Tempelbezirk“ oder „Tempelanlage“ im Haupttext
  rationale: ἱερόν kann den gesamten heiligen Tempelkomplex samt Vorhöfen bezeichnen und ist nicht auf das innere Heiligtum beschränkt. Die geläufige Formulierung im Haupttext wahrt die Lesbarkeit; die Fußnote erhält die historische und lexikalische Genauigkeit, ohne die konkrete Grenzziehung über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der erklärenden Funktion von γάρ mit „Denn“ und verwendet für die berichtete Annahme natürlichen deutschen Konjunktiv I.
