  verdict: revise
  source_fidelity: 'Der Haupttext gibt die Abfolge und die Einzelhandlungen zutreffend wieder: Der χιλίαρχος nähert sich, ergreift Paulus, lässt ihn mit zwei Ketten fesseln und stellt Fragen nach seiner Identität und seinen Taten. Das einleitende „Dann“ vor „erkundigte er sich“ legt jedoch eine stärker zeitlich nachgeordnete Handlung nahe, während καί die Befragung schlicht an die vorausgehenden Handlungen anschließt und das Imperfekt eine andauernde Befragung schildert.'
  naturalness: „Trat ... heran“, „nahm ihn fest“ und „befahl, ihn ... zu fesseln“ sind idiomatisch und angemessen. Eine durch „und“ angeschlossene Wiedergabe der Befragung folgt dem deutschen Erzählfluss und dem griechischen Satzanschluss besser als „Dann“.
  terminology: „Befehlshaber“ ist als verständliche Wiedergabe von χιλίαρχος geeignet; die Fußnote bietet „Militärtribun“ als präzisere Alternative. „Ketten“ gibt ἁλύσεις sachgerecht wieder. Die indirekten Fragen im Konjunktiv I sind korrekt und natürlich.
