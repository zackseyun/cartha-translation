source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: de
  text: Da trat der Befehlshaber[a] heran, nahm ihn fest und befahl, ihn mit zwei Ketten[b] zu fesseln, und erkundigte sich, wer er sei und was er getan habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Militärtribun«. Das griechische Wort bezeichnet einen hohen römischen Offizier, wörtlich einen »Befehlshaber über tausend«.'
    reason: lexical_alternative
  - marker: b
    text: Die »zwei Ketten« erinnern möglicherweise an die Prophezeiung in Apostelgeschichte 21,11, nach der Paulus in Jerusalem gefesselt werden würde.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: Befehlshaber
  rationale: Das Wort bezeichnet hier den römischen Militärtribunen, der eine Kohorte befehligte. »Befehlshaber« ist verständlich, wahrt den militärischen Rangcharakter und vermeidet einen erklärungsbedürftigen Fachausdruck im Haupttext.
- source_word: ἐγγίσας
  choice: trat … heran
  rationale: Das vorzeitige Partizip beschreibt, wie der Befehlshaber sich Paulus nähert, bevor er ihn ergreift. Die Formulierung ist im deutschen Erzählstil natürlich.
- source_word: ἐπελάβετο αὐτοῦ
  choice: nahm ihn fest
  rationale: Im Zusammenhang des militärischen Zugriffs bezeichnet die Wendung ein körperliches Ergreifen mit dem Ziel der Festnahme. »Nahm ihn fest« gibt die Funktion der Handlung idiomatisch wieder.
- source_word: ἐκέλευσε δεθῆναι
  choice: befahl, ihn … zu fesseln
  rationale: Die Formulierung bewahrt den autoritativen Befehl und gibt den passiven Infinitiv im Deutschen natürlich wieder.
- source_word: ἁλύσεσι δυσί
  choice: mit zwei Ketten
  rationale: ἅλυσις bezeichnet besonders im Haftkontext eine Kette. Die wörtlich-nahe Wiedergabe erhält zugleich die mögliche Verbindung zu Apostelgeschichte 21,11.
- source_word: ἐπυνθάνετο
  choice: erkundigte er sich
  rationale: Das Imperfekt stellt die laufende Befragung inmitten des Tumults dar. »Erkundigte sich« drückt das forschende Fragen natürlich aus, ohne ein Ergebnis vorwegzunehmen.
- source_word: τίς εἴη
  choice: wer er sei
  rationale: Der Optativ steht in einer indirekten Frage nach einem Vergangenheitstempus. Der deutsche Konjunktiv I kennzeichnet die indirekte Frage klar und idiomatisch.
- source_word: τί ἐστιν πεποιηκώς
  choice: was er getan habe
  rationale: Die periphrastische Perfektform bezeichnet eine vollendete Handlung mit fortdauernder Relevanz. Das deutsche Perfekt im Konjunktiv gibt dies innerhalb der indirekten Frage angemessen wieder.
theological_decisions:
- issue: Möglicher Bezug der zwei Ketten auf die Prophezeiung in Apostelgeschichte 21,11
  choice: Die zwei Ketten werden ohne ausdrückliche Deutung im Haupttext wiedergegeben; eine Fußnote weist vorsichtig auf den möglichen Bezug hin.
  alternative: Den Bezug im Haupttext ausdrücklich als Erfüllung kennzeichnen.
  rationale: Der Wortlaut nennt zwei Ketten, erklärt sie an dieser Stelle aber nicht ausdrücklich als Erfüllung der Prophezeiung. Die zurückhaltende Fußnote bewahrt diesen möglichen literarisch-theologischen Zusammenhang, ohne ihn dem Text aufzuzwingen.
translation_notes:
  register: Moderner, würdevoller Erzählstil mit allgemein verständlichem militärischem Titel. Die indirekten Fragen stehen im Konjunktiv I; Fachterminologie und der mögliche innerbiblische Bezug werden in Fußnoten erläutert.
