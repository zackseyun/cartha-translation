source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: de
  text: Wir beendeten die Seereise von Tyrus und kamen nach Ptolemais. Nachdem wir die Brüder[a] begrüßt hatten, blieben wir einen Tag bei ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Brüder und Schwestern«. Im Griechischen steht »Brüder«, ein maskuliner Plural, der im Zusammenhang auch die Gemeinschaft der Gläubigen insgesamt bezeichnen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Wir
  rationale: Das ausdrücklich gesetzte Pronomen hebt die Reisegruppe als Subjekt hervor; δέ führt die Erzählung weiter. Im natürlichen Deutschen genügt hier „Wir“, ohne einen künstlichen Gegensatz einzuführen.
- source_word: τὸν πλοῦν διανύσαντες
  choice: beendeten die Seereise
  rationale: διανύω bezeichnet das Vollenden einer Strecke oder Reise, πλοῦς eine Fahrt zur See. Die finite Wiedergabe ist im Deutschen flüssiger und wahrt den Sinn des abgeschlossenen ersten Handlungsschritts.
- source_word: ἀπὸ Τύρου
  choice: von Tyrus
  rationale: ἀπό bezeichnet unmittelbar den Ausgangspunkt der Reise.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: kamen nach Ptolemaïs
  rationale: καταντάω bezeichnet im Reisekontext das Erreichen eines Zielortes; εἰς markiert das Ziel. „Nach … kommen“ ist dafür natürliches Standarddeutsch.
- source_word: ἀσπασάμενοι
  choice: Nachdem wir … begrüßt hatten
  rationale: Der Aoristpartizip bezeichnet hier eine der folgenden Hauptaussage vorausgehende Handlung. Der temporale Nebensatz bildet diese Abfolge klar ab.
- source_word: τοὺς ἀδελφοὺς
  choice: die Brüder
  rationale: Das griechische maskuline Pluralwort bezeichnet hier Angehörige der christlichen Gemeinschaft und kann im Kontext auch Frauen einschließen. Der Haupttext bewahrt die konkrete Form; eine Fußnote erläutert den möglichen umfassenderen Bezug.
- source_word: ἐμείναμεν ἡμέραν μίαν
  choice: blieben wir einen Tag
  rationale: μένω bedeutet „bleiben“ oder „sich aufhalten“; der Akkusativ ἡμέραν μίαν gibt die Zeitdauer an.
- source_word: παρ’ αὐτοῖς
  choice: bei ihnen
  rationale: παρά mit Dativ bezeichnet hier den Aufenthalt bei beziehungsweise in der Gemeinschaft mit Personen; „bei ihnen“ gibt den räumlichen und persönlichen Bezug idiomatisch wieder.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφοὺς innerhalb der christlichen Gemeinschaft
  choice: die Brüder
  alternative: die Brüder und Schwestern; die Gläubigen
  rationale: Die grammatisch maskuline Form wird im Haupttext beibehalten, ohne auszuschließen, dass das Wort hier die örtliche Gemeinschaft einschließlich weiblicher Gläubiger meint. Diese echte sprachlich-kontextuelle Spannweite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die längere griechische Satzperiode wird zur besseren Verständlichkeit in zwei Sätze gegliedert; Handlungsfolge, Ortsangaben und erzählerische Wir-Perspektive bleiben erhalten.
