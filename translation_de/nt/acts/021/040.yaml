review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die beiden Genitivabsolute, Paulus' Standort auf den Stufen, das Handzeichen, das Eintreten der Stille und die Ansprache in der Ἑβραΐδι διαλέκτῳ sachgerecht wieder. Die Fußnote bewahrt zutreffend die sprachgeschichtliche Offenheit zwischen der wörtlichen Bezeichnung und einem möglichen aramäischen Bezug.
  naturalness: Die doppelte Formulierung „redete er sie … an und sagte“ ist im Deutschen unnötig schwerfällig. Das Partizip λέγων wird idiomatisch und vollständig durch einen Doppelpunkt vor der folgenden direkten Rede wiedergegeben. Die Benennung des aus dem unmittelbaren Kontext bekannten Befehlshabers verhindert zudem die im Deutschen störende Häufung mehrdeutiger Personalpronomen.
  terminology: „Volk“, „Stufen“ und „auf Hebräisch“ sind angemessen. „Hebräisch“ folgt der griechischen Bezeichnung im Haupttext, ohne die mögliche aramäische Referenz voreilig festzulegen.
