  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: de
  text: 'Als der Befehlshaber ihm die Erlaubnis gegeben hatte, stand Paulus auf den Stufen und gab dem Volk mit der Hand ein Zeichen. Als große Stille eingetreten war, sprach er sie auf Hebräisch[a] an:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »auf Aramäisch«. Im Griechischen steht »in der hebräischen Sprache oder Mundart«; damit kann hier die örtliche semitische Umgangssprache gemeint sein, die gewöhnlich Aramäisch genannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Als er ihm die Erlaubnis gegeben hatte
  rationale: Der Genitivus absolutus bezieht sich auf den Befehlshaber aus dem vorangehenden Zusammenhang. Die Formulierung gibt den zeitlichen Sinn idiomatisch wieder und lässt den Bezug des Pronomens im Deutschen bestehen.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: stand Paulus auf den Stufen
  rationale: Das Perfektpartizip beschreibt die Position des Paulus; ἀναβαθμοί bezeichnet die Stufen beziehungsweise die Treppe zur Kaserne.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: gab dem Volk mit der Hand ein Zeichen
  rationale: κατασείω bezeichnet hier eine Handbewegung, mit der Paulus Aufmerksamkeit beziehungsweise Ruhe herstellt. Die Übersetzung bleibt zurückhaltend und natürlich.
- source_word: τῷ λαῷ
  choice: dem Volk
  rationale: λαός wird direkt mit »Volk« wiedergegeben; der Kontext macht deutlich, dass die versammelten Menschen gemeint sind.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Als große Stille eingetreten war
  rationale: Der zweite Genitivus absolutus beschreibt das Eintreten weitgehender Ruhe. »Große Stille« bewahrt die Stärke von πολλῆς.
- source_word: προσεφώνησεν
  choice: redete er sie … an
  rationale: Das Verb bezeichnet das öffentliche Anreden einer Gruppe. Die deutsche Wendung passt zum anschließenden Beginn der Rede.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: auf Hebräisch
  rationale: Die Hauptübersetzung bewahrt die ausdrückliche griechische Bezeichnung »hebräische Sprache/Mundart«. Dass damit im damaligen Umfeld möglicherweise Aramäisch gemeint ist, wird in einer Fußnote offengelegt.
- source_word: λέγων
  choice: 'und sagte:'
  rationale: Das Partizip leitet die im nächsten Vers folgende direkte Rede ein; im modernen Deutschen ist eine finite Anschlussform natürlich und transparent.
