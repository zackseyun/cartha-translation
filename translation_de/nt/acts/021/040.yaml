  - severity: low
    issue: Mehrdeutige Pronomen am Satzanfang
    rationale: „Als er ihm …“ ist bei zwei männlichen Referenten weniger klar als nötig. Die kontextuell ausdrücklich bekannte Bezeichnung „der Befehlshaber“ klärt den Bezug, ohne den Sinn zu verändern.
