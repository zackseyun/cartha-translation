base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: de
  text: Als wir in Jerusalem ankamen, nahmen uns die Brüder[a] freudig auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Brüder und Schwestern. Das griechische Wort lautet „Brüder“, kann aber auch die Gemeinschaft der Glaubenden insgesamt bezeichnen.'
