lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα
  choice: Als wir nach Jerusalem gekommen waren
  rationale: Der Genitivus absolutus beschreibt hier den zeitlichen Umstand der Ankunft. Die Formulierung gibt das Ziel mit „nach Jerusalem“ idiomatisch wieder und bewahrt durch das Plusquamperfekt die Vorzeitigkeit gegenüber dem anschließenden Aufnehmen.
- source_word: ἀσμένως
  choice: freudig
  rationale: Das Adverb bezeichnet eine bereitwillige, von Freude geprägte Aufnahme. „Freudig“ ist präzise und weniger deutend als „herzlich“.
- source_word: ἀπεδέξαντο
  choice: nahmen … auf
  rationale: ἀποδέχομαι bezeichnet hier die gastfreundliche Aufnahme von Personen. „aufnehmen“ ist im Deutschen natürlich und wahrt den konkreten zwischenmenschlichen Sinn.
- source_word: οἱ ἀδελφοί
  choice: die Brüder
  rationale: Die Übersetzung bewahrt die maskuline Form des griechischen Ausdrucks. Im frühchristlichen Sprachgebrauch kann er zugleich die Gemeinschaft der Glaubenden einschließlich Frauen bezeichnen; darauf weist die Fußnote hin.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von οἱ ἀδελφοί für die christliche Gemeinschaft in Jerusalem
  choice: die Brüder
  alternative: die Brüder und Schwestern; die Glaubenden
  rationale: Der Haupttext folgt der ausdrücklichen Form des griechischen Substantivs, ohne dessen mögliche inklusive Reichweite zu verengen. Die Fußnote erhält diese sachlich wichtige Mehrdeutigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Freudig aufnahmen“ bleibt nah am griechischen Ausdruck und klingt zugleich natürlich.
