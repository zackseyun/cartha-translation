id: ACT.21.4
reference: Acts 21:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: de
  text: Nachdem wir die Jünger ausfindig gemacht hatten, blieben wir sieben Tage dort. Durch den Geist sagten sie Paulus immer wieder, er solle nicht nach Jerusalem hinaufgehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: Der Geist offenbarte ihnen, was Paulus bevorstand; daraus schlossen sie, er solle nicht nach Jerusalem weiterreisen.'
    reason: Die Formulierung kann entweder das gesamte Verbot als durch den Geist vermittelt bezeichnen oder eine durch den Geist gegebene Offenbarung voraussetzen, aus der die Jünger selbst ihre Warnung ableiteten.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Nachdem wir … ausfindig gemacht hatten
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Suche mit erfolgreichem Ergebnis. „Ausfindig machen“ gibt die gegenüber einfachem εὑρίσκω verstärkte Bedeutung natürlich wieder.
- source_word: τοὺς μαθητάς
  choice: die Jünger
  rationale: Die übliche und sachlich genaue Wiedergabe von μαθηταί in der Apostelgeschichte; der bestimmte Artikel bleibt erhalten.
- source_word: ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά
  choice: blieben wir sieben Tage dort
  rationale: ἐπιμένω bedeutet hier „bleiben“; αὐτοῦ ist lokales „dort“, und der Akkusativ bezeichnet die Zeitdauer.
- source_word: οἵτινες … ἔλεγον
  choice: sagten sie … immer wieder
  rationale: Das Pronomen verweist auf die Jünger zurück. „Immer wieder“ bildet den durativen beziehungsweise wiederholten Aspekt des Imperfekts ἔλεγον ab.
- source_word: διὰ τοῦ πνεύματος
  choice: Durch den Geist
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Wirksamkeit. „Der Geist“ bewahrt die Formulierung des Griechischen, ohne das nicht ausdrücklich vorhandene Adjektiv „Heilige“ einzufügen.
- source_word: μὴ ἐπιβαίνειν εἰς Ἱεροσόλυμα
  choice: er solle nicht nach Jerusalem hinaufgehen
  rationale: Der Infinitiv nach einem Verb des Sagens wird im Deutschen natürlich als indirekte Rede mit Konjunktiv wiedergegeben. „Hinaufgehen“ wahrt sowohl die Reisebewegung als auch die traditionelle Richtungsangabe nach Jerusalem.
theological_decisions:
- issue: Verhältnis der durch den Geist vermittelten Aussage zum Entschluss des Paulus, nach Jerusalem zu reisen
  choice: Durch den Geist sagten sie Paulus immer wieder, er solle nicht nach Jerusalem hinaufgehen.
  alternative: Der Geist offenbarte das bevorstehende Leiden; die Jünger selbst folgerten daraus, Paulus solle nicht weiterreisen.
  rationale: Der Haupttext gibt die grammatisch naheliegende Verknüpfung von διὰ τοῦ πνεύματος mit ἔλεγον wieder. Die Fußnote macht die mögliche Unterscheidung zwischen Offenbarungsinhalt und menschlicher Schlussfolgerung sichtbar und erhält so die Spannung zu Apostelgeschichte 19,21 und 20,22–23, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Ausfindig gemacht“ ist präziser als schlichtes „gefunden“; „immer wieder“ macht den imperfektiven Verlauf hörbar. Die indirekte Rede mit „solle“ ist idiomatisch und vermeidet die schwerfällige Infinitivkonstruktion.
