  verdict: approve
  source_fidelity: Der Text gibt die Abfolge des aoristischen Partizips (ἀνευρόντες), das lokale αὐτοῦ („dort“), die siebentägige Dauer sowie den wiederholten Charakter von ἔλεγον treffend wieder. „Durch den Geist“ bewahrt die syntaktische und theologische Offenheit von διὰ τοῦ πνεύματος. „Nicht nach Jerusalem hinaufgehen“ gibt μὴ ἐπιβαίνειν εἰς Ἱεροσόλυμα angemessen wieder.
  naturalness: Flüssiges modernes Standarddeutsch in einem passenden erzählerischen Register. Die indirekte Rede mit „er solle“ und die Stellung von „immer wieder“ sind idiomatisch. „Ausfindig gemacht“ ist leicht gehoben, aber natürlich und für ἀνευρόντες sachgerecht.
  terminology: „Jünger“, „der Geist“ und „Jerusalem“ sind konsistent und fachlich angemessen. Es wird weder „Heiliger“ ergänzt noch die Aussage konfessionell festgelegt. Der Fußnotentext erläutert die mögliche Deutung, ohne sie dem Haupttext aufzuzwingen.
