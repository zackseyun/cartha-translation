  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: de
  text: Dieser Mann hatte vier jungfräuliche Töchter, die prophetisch redeten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vier unverheiratete Töchter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: Dieser Mann
  rationale: Der Dativ Singular von οὗτος verweist im unmittelbaren Zusammenhang auf Philippus. Zusammen mit ἦσαν bildet er eine Besitzkonstruktion; „Dieser Mann hatte“ ist im Deutschen natürlich und macht den Rückbezug deutlich.
- source_word: δὲ
  choice: —
  rationale: δέ ist hier eine schwache fortführende Partikel. Der Zusammenhang wird im Deutschen durch den Satzfluss ausreichend ausgedrückt.
- source_word: ἦσαν
  choice: hatte
  rationale: Die griechische Konstruktion τούτῳ ... ἦσαν θυγατέρες bedeutet wörtlich etwa „diesem waren Töchter“ und wird idiomatisch als Besitzangabe wiedergegeben.
- source_word: θυγατέρες
  choice: Töchter
  rationale: Dies ist die gewöhnliche und genaue deutsche Entsprechung im familiären Sinn.
- source_word: τέσσαρες
  choice: vier
  rationale: Die Kardinalzahl bestimmt unmittelbar die Töchter.
- source_word: παρθένοι
  choice: unverheiratete
  rationale: παρθένος bezeichnet hier Frauen, die nicht verheiratet sind, und kann ausdrücklich ihre Jungfräulichkeit einschließen. „Unverheiratete“ gibt den sozialen Status natürlich wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: προφητεύουσαι
  choice: die prophetisch redeten
  rationale: Das präsentische aktive Partizip im Femininum Plural beschreibt die Töchter durch ihre fortdauernde oder charakteristische Tätigkeit. „Prophetisch redeten“ ist verständlicher und weniger missverständlich als das im heutigen Deutsch teils auf Zukunftsvoraussage verengte „prophezeiten“.
theological_decisions:
- issue: Wiedergabe von παρθένοι bei Frauen, die prophetisch reden
  choice: unverheiratete
  alternative: jungfräuliche
  rationale: Der Vers nennt sowohl ihren Lebensstand als auch ihre prophetische Tätigkeit, stellt aber keinen theologischen Zusammenhang zwischen beidem her. „Unverheiratete“ vermeidet eine nachträgliche Wertung der Jungfräulichkeit; die wörtlichere Lesart bleibt in der Fußnote sichtbar.
- issue: Art der prophetischen Tätigkeit
  choice: die prophetisch redeten
  alternative: die prophezeiten
  rationale: Die Formulierung bezeichnet prophetisches Reden, ohne dessen Inhalt auf Zukunftsvoraussagen einzuengen oder eine darüber hinausgehende Amtslehre in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich, wahrt den Rückbezug auf Philippus und erhält durch die Fußnote die engere lexikalische Bedeutung von παρθένοι.
