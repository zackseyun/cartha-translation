id: ACT.21.1
reference: Acts 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: de
  text: Nachdem wir uns von ihnen losgerissen hatten und in See gestochen waren, nahmen wir geraden Kurs und kamen nach Kos, am folgenden Tag nach Rhodos und von dort nach Patara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Nachdem
  rationale: Die griechische Erzählformel leitet das nächste Geschehen zeitlich ein. „Nachdem“ verbindet sich im Deutschen natürlich mit den folgenden Handlungen, ohne die Formel unnötig wörtlich wiederzugeben.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: wir uns von ihnen losgerissen hatten
  rationale: ἀποσπάω bezeichnet ein gewaltsames oder schmerzliches Losreißen und ist stärker als ein neutrales „Abschied nehmen“. Die reflexive Form gibt im Kontext die schwierige Trennung treffend wieder.
- source_word: ἀναχθῆναι
  choice: in See gestochen waren
  rationale: Das Verb wird hier nautisch gebraucht und bedeutet, vom Land abzulegen beziehungsweise aufs Meer hinauszufahren. „In See stechen“ ist eine geläufige deutsche Wendung.
- source_word: εὐθυδρομήσαντες
  choice: nahmen wir geraden Kurs
  rationale: Das nautische Verb bezeichnet das Fahren auf geradem Kurs. Die Wiedergabe bewahrt sowohl die Seefahrtssprache als auch die Aussage über die direkte Route.
- source_word: ἤλθομεν εἰς
  choice: kamen nach
  rationale: Bei Reiseangaben ist „nach … kommen“ eine knappe und natürliche deutsche Entsprechung.
- source_word: Κῶ
  choice: Kos
  rationale: „Kos“ ist die heute übliche deutsche Schreibweise des Inselnamens.
- source_word: τῇ δὲ ἑξῆς
  choice: am folgenden Tag
  rationale: Die temporale Wendung bezeichnet den unmittelbar folgenden Tag und wird so idiomatisch und präzise wiedergegeben.
- source_word: Ῥόδον
  choice: Rhodos
  rationale: „Rhodos“ ist die etablierte deutsche Namensform.
- source_word: κἀκεῖθεν
  choice: und von dort
  rationale: Die Zusammenziehung aus καί und ἐκεῖθεν verbindet die nächste Reiseetappe ausdrücklich mit der vorherigen.
- source_word: Πάταρα
  choice: Patara
  rationale: „Patara“ ist die etablierte deutsche Umschrift des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit verständlicher nautischer Ausdrucksweise. Die emotionale Stärke des Abschieds wird durch „losgerissen“ bewahrt; der Reisebericht bleibt knapp und flüssig. Auf eine Fußnote zur Schreibweise von Kos wurde verzichtet, da „Kos“ im Deutschen die übliche Form ist und die englische Alternative für die deutsche Fassung keinen sachlichen Mehrwert bietet.
