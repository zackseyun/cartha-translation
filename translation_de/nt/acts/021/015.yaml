base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: de
  text: Nach diesen Tagen machten wir uns reisefertig[a] und zogen hinauf nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „packten wir unsere Sachen“ beziehungsweise „trafen wir Vorbereitungen“. Das griechische Wort kann allgemein das Bereitmachen für die Reise bezeichnen und muss sich nicht nur auf das Packen des Gepäcks beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Nach diesen Tagen
  rationale: μετά mit dem Akkusativ bezeichnet die zeitliche Folge. Die knappe Formulierung bleibt nah am Griechischen und verweist auf den unmittelbar zuvor genannten Zeitraum.
- source_word: ἐπισκευασάμενοι
  choice: machten wir uns reisefertig
  rationale: Das Partizip bezeichnet hier die Vorbereitung beziehungsweise Ausrüstung für die Reise. „Sich reisefertig machen“ ist natürliches Deutsch und legt sich nicht unnötig darauf fest, dass ausschließlich das Packen des Gepäcks gemeint ist.
- source_word: ἀνεβαίνομεν
  choice: zogen hinauf
  rationale: Der Imperfekt schildert die Reise in der Vergangenheit. „Hinaufziehen“ bewahrt die im Verb enthaltene Aufwärtsbewegung nach Jerusalem und passt zum gehobenen, aber verständlichen Erzählstil.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: εἰς bezeichnet die Bewegung auf die Stadt zu; im Deutschen ist „nach Jerusalem“ bei Städten die natürliche Wiedergabe.
