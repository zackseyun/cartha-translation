  source_fidelity: 'Der Text gibt die griechische Syntax und Handlung zuverlässig wieder: ἐκινήθη als städtischer Aufruhr, συνδρομὴ τοῦ λαοῦ als Zusammenlaufen des Volkes, das gewaltsame Ergreifen des Paulus sowie das unverzügliche Schließen der Zugänge. „Schleppten“ ist für εἷλκον angemessen; das griechische Verb steht tatsächlich im Imperfekt, ungeachtet der widersprüchlichen Bemerkung im englischen Revisionsprotokoll.'
