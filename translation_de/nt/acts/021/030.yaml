id: ACT.21.30
reference: Acts 21:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: de
  text: Die ganze Stadt geriet in Aufruhr, und das Volk lief zusammen. Sie packten Paulus und schleppten ihn aus dem Tempelbezirk; sofort wurden die Türen[a] geschlossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Tore“. Gemeint sind die verschließbaren Zugänge des Tempelbezirks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: geriet in Aufruhr
  rationale: Das Passiv von κινέω bezeichnet hier im Zusammenhang eine kollektive Erregung der Stadt. „Geriet in Aufruhr“ gibt dies natürlich wieder, ohne eine bloß räumliche Bewegung anzunehmen.
- source_word: τε
  choice: und
  rationale: Die schwach verbindende Partikel wird im Deutschen passend durch „und“ wiedergegeben.
- source_word: ἡ πόλις ὅλη
  choice: die ganze Stadt
  rationale: Die Wendung bewahrt den umfassenden Bezug und ist zugleich idiomatisches Deutsch.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: das Volk lief zusammen
  rationale: συνδρομή bezeichnet das Zusammenlaufen beziehungsweise plötzliche Zusammenströmen. Die verbale deutsche Fassung drückt diesen Vorgang klar und knapp aus.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: sie packten Paulus
  rationale: Das Partizip bezeichnet ein kräftiges Ergreifen. Die Beiordnung mit dem folgenden Verb gibt die enge zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: εἷλκον αὐτόν
  choice: schleppten ihn
  rationale: Das Imperfekt schildert das fortlaufende gewaltsame Ziehen. Das deutsche Präteritum „schleppten“ vermittelt die Handlung natürlich, ohne eine im Deutschen schwerfällige Verlaufsform zu erzwingen.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: aus dem Tempelbezirk
  rationale: ἱερόν bezeichnet hier den gesamten Tempelkomplex beziehungsweise seine Höfe, nicht speziell das innere Heiligtum. „Tempelbezirk“ macht diese räumliche Bedeutung direkt verständlich.
- source_word: εὐθέως
  choice: sofort
  rationale: „Sofort“ ist eine klare, gegenwärtige Entsprechung für die unmittelbare zeitliche Folge.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: die Türen wurden geschlossen
  rationale: Die Passivkonstruktion und der Grundsinn von θύραι werden formal bewahrt. Da im Tempelkontext auch Zugangstore gemeint sein können, wird diese Möglichkeit in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Hauptsätze bewahren das rasche Handlungstempo. „Tempelbezirk“ verdeutlicht unmittelbar den Umfang von ἱερόν; die mögliche Wiedergabe von θύραι als „Tore“ bleibt in der Fußnote erhalten.
