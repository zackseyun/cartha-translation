  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: de
  text: Während wir noch mehrere Tage dort blieben, kam aus Judäa ein Prophet namens Agabus herab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: während wir … dort blieben
  rationale: Das präsentische Partizip im Genitivus absolutus hat hier temporale Funktion. Das unausgesprochene Subjekt sind im Kontext Paulus und seine Begleiter; daher ist die erzählerische Wiedergabe mit „wir“ angemessen. „Dort blieben“ bezeichnet das fortgesetzte Verweilen am zuvor genannten Ort.
- source_word: δὲ
  choice: während
  rationale: δέ markiert einen leichten Fortgang der Erzählung. Im Deutschen lässt es sich zusammen mit dem temporalen Genitivus absolutus natürlich durch „während“ wiedergeben, ohne ein zusätzliches „aber“ oder „nun“ zu erzwingen.
- source_word: ἡμέρας πλείους
  choice: noch mehrere Tage
  rationale: Der Akkusativ bezeichnet die Zeitdauer. πλείους kann wörtlich „mehr“ heißen, meint hier aber weitere beziehungsweise mehrere Tage; „noch mehrere Tage“ bewahrt diesen weiterführenden Sinn in natürlichem Deutsch.
- source_word: κατῆλθέν
  choice: kam … herab
  rationale: Der Aorist von κατέρχομαι enthält eine Richtungsangabe. „Kam herab“ bewahrt die antike geographische Perspektive der Reise aus Judäa an die Küste und entspricht dem Standort der Erzählgruppe.
- source_word: τις
  choice: ein
  rationale: Das Indefinitpronomen führt eine neue Person ein. Im Deutschen wird die Unbestimmtheit idiomatisch durch „ein Prophet“ ausgedrückt.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: aus Judäa
  rationale: Die Präpositionalfügung bezeichnet den Herkunftsort. „Aus Judäa“ ist die natürliche deutsche Wiedergabe.
- source_word: προφήτης
  choice: ein Prophet
  rationale: Die direkte Wiedergabe erhält die im Text ausdrücklich genannte prophetische Rolle des Agabus, ohne sie auszudeuten.
- source_word: ὀνόματι Ἅγαβος
  choice: namens Agabus
  rationale: Der Dativ ὀνόματι bildet eine geläufige Namensformel. „Namens Agabus“ ist knapp, würdig und im modernen Standarddeutsch verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nah am griechischen Ablauf; „herab“ erhält die räumliche Perspektive des Ausgangstextes.
