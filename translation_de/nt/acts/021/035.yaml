  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: de
  text: Als er aber an die Stufen[a] kam, kam es wegen der Gewalt der Menge dazu, dass er von den Soldaten getragen wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den Stufen ist wahrscheinlich die Treppe gemeint, die zur römischen Kaserne hinaufführte; siehe Apostelgeschichte 21,34.37.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Die Soldaten mussten ihn wegen der Gewalt der Menge tragen.“ Der griechische Ausdruck beschreibt zunächst das eingetretene Geschehen; im Zusammenhang kann er zugleich die durch die Gewalt der Menge entstandene Notwendigkeit hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als er aber
  rationale: ὅτε leitet den temporalen Nebensatz ein; δέ wird mit dem leicht weiterführenden „aber“ wiedergegeben, ohne einen starken Gegensatz auszudrücken.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: an die Stufen kam
  rationale: γίνομαι mit ἐπί und Akkusativ bezeichnet hier idiomatisch das Gelangen an einen Ort.
- source_word: ἀναβαθμούς
  choice: Stufen
  rationale: Das Wort bezeichnet Stufen beziehungsweise eine Treppe; „Stufen“ ist im Erzählzusammenhang klar und quellennah.
- source_word: συνέβη βαστάζεσθαι αὐτὸν
  choice: mussten die Soldaten ihn … tragen
  rationale: Die Konstruktion beschreibt die infolge der Lage eingetretene Notwendigkeit. Im Deutschen gibt „mussten … tragen“ diesen Zusammenhang natürlicher wieder als das schwerfällige „es geschah, dass er getragen wurde“.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: die Soldaten
  rationale: Der griechische Urheber der Passivhandlung wird bei der natürlichen deutschen Aktivkonstruktion zum Subjekt.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: wegen der Gewalt der Menge
  rationale: διά mit Akkusativ bezeichnet den Grund; βία meint gewaltsamen Druck oder Gewalt, und ὄχλος wird neutral als „Menge“ wiedergegeben.
