id: ACT.21.20
reference: Acts 21:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: de
  text: 'Als sie das hörten, verherrlichten sie Gott. Dann sagten sie zu ihm: »Du siehst, Bruder, wie viele Zehntausende[a] es unter den Juden[b] gibt, die zum Glauben gekommen sind; und sie alle sind voller Eifer für das Gesetz.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: »wie viele Tausende«. Das griechische Wort kann Zehntausender-Einheiten oder eine sehr große Zahl bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unter den Judäern«, wenn die Bezeichnung geografisch statt ethnisch-religiös verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Als sie das hörten
  rationale: Das aoristische Partizip bezeichnet den zeitlichen Anlass; das im Griechischen unausgesprochene Objekt wird aus dem vorangehenden Bericht natürlich mit »das« aufgenommen.
- source_word: ἐδόξαζον
  choice: verherrlichten sie Gott
  rationale: »Verherrlichen« bewahrt den Sinn, Gott Ehre zu geben, und gibt das Imperfekt als fortlaufende beziehungsweise einsetzende Reaktion wieder.
- source_word: εἶπόν τε αὐτῷ
  choice: Dann sagten sie zu ihm
  rationale: Die Verbindung mit τε führt die nächste Reaktion im Erzählfluss an; »dann« klingt im Deutschen natürlicher als eine Häufung von »und«.
- source_word: Θεωρεῖς
  choice: Du siehst
  rationale: Die direkte, rhetorische Aufforderung lenkt die Aufmerksamkeit des Paulus auf eine offenkundige Lage.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Der Vokativ richtet sich an den konkreten männlichen Adressaten Paulus.
- source_word: πόσαι μυριάδες
  choice: wie viele Zehntausende
  rationale: μυριάς bezeichnet wörtlich eine Einheit von zehntausend, kann aber auch allgemein eine sehr große Zahl ausdrücken. »Zehntausende« erhält die starke Größenangabe; die weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: unter den Juden
  rationale: Im Zusammenhang steht die ethnisch-religiöse Zugehörigkeit der Glaubenden und ihr Verhältnis zum mosaischen Gesetz im Vordergrund; die geografische Deutung bleibt als Alternative in der Fußnote erhalten.
- source_word: τῶν πεπιστευκότων
  choice: die zum Glauben gekommen sind
  rationale: Das Perfekt bezeichnet Menschen, die gläubig geworden sind und sich weiterhin in diesem Zustand befinden.
- source_word: ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: sie alle sind voller Eifer für das Gesetz
  rationale: Die Formulierung gibt die starke, fortbestehende Hingabe wieder und ist im heutigen Deutsch natürlicher als »Eiferer des Gesetzes«.
theological_decisions:
- issue: Bezugsrahmen von ἐν τοῖς Ἰουδαίοις
  choice: unter den Juden
  alternative: unter den Judäern
  rationale: Der Kontext hebt die jüdische Identität und den Eifer für das mosaische Gesetz hervor, ohne eine rein geografische Beschränkung eindeutig festzulegen. Die mögliche geografische Lesart wird daher nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Zahlwert von μυριάδες
  choice: Zehntausende
  alternative: sehr viele Tausende / eine sehr große Zahl
  rationale: Das Wort kann konkrete Zehntausender-Einheiten oder weniger genau eine sehr große Menge bezeichnen. Der Haupttext bewahrt die anschauliche Stärke des griechischen Ausdrucks, während die Fußnote seine semantische Weite offenhält.
- issue: Verhältnis der jüdischen Glaubenden zum Gesetz
  choice: voller Eifer für das Gesetz
  alternative: Eiferer für das Gesetz
  rationale: Die Übersetzung beschreibt ihre starke Bindung, ohne über den griechischen Text hinaus zu bestimmen, wie dieser Gesetzeseifer theologisch zu bewerten ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Anrede »Bruder« und der Ausdruck »das Gesetz« bleiben erhalten; semantische Mehrdeutigkeiten bei der Zahlbezeichnung und bei »Juden/Judäern« werden durch unmittelbar zugeordnete Fußnoten sichtbar gemacht.
