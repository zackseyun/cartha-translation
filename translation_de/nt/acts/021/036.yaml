  text: ἠκολούθει γὰρ τὸ πλῆθος τοῦ λαοῦ ⸀κράζοντες· Αἶρε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: de
  text: 'Denn die Menschenmenge folgte ihm und schrie: »Weg mit ihm!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bring ihn weg!«'
    reason: Lexikalische Alternative für Αἶρε αὐτόν; die Wendung fordert seine Entfernung und lässt im feindseligen Zusammenhang die Art der Beseitigung unbestimmt.
lexical_decisions:
- source_word: ἠκολούθει
  choice: folgte
  rationale: Der Imperfekt beschreibt das fortdauernde Folgen in der damaligen Situation; im Deutschen gibt das Präteritum dies im Erzählzusammenhang natürlich wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion bewahrt den erklärenden Anschluss an den vorhergehenden Vers.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: die Menschenmenge
  rationale: Die Formulierung bezeichnet die Menge aus dem Volk kollektiv und ohne die abwertende Nebenbedeutung von »Mob« oder »Pöbel«.
- source_word: κράζοντες
  choice: schrie
  rationale: Das Partizip bezeichnet die das Folgen begleitende lautstarke Handlung. Obwohl es im Griechischen im Plural steht und sich sinngemäß auf die Menschen in der kollektiv bezeichneten Menge bezieht, verlangt das deutsche Singularsubjekt »Menschenmenge« ein Verb im Singular.
- source_word: Αἶρε αὐτόν
  choice: Weg mit ihm!
  rationale: Der Imperativ von αἴρω ist hier eine feindselige Forderung, Paulus zu beseitigen beziehungsweise fortzuschaffen, nicht die Aufforderung, ihn lediglich hochzuheben. Die idiomatische deutsche Wendung erhält die Wucht und lässt den genauen Umfang der Forderung offen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Menschenmenge« vermeidet sowohl das schwerfällige »Menge des Volkes« als auch eine unbegründet abwertende Charakterisierung.
