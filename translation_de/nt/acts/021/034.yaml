id: ACT.21.34
reference: Acts 21:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: de
  text: Doch die einen in der Menge riefen dies, die anderen jenes. Da er wegen des Tumults nichts Sicheres erfahren konnte, befahl er, Paulus in die Kaserne[a] zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die römischen Militärunterkünfte, wahrscheinlich innerhalb des Festungskomplexes, der an das Tempelgelände angrenzte.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: Doch die einen in der Menge riefen dies, die anderen jenes
  rationale: Die Wendung gibt den verteilenden Gegensatz ἄλλοι … ἄλλο τι und das andauernde laute Rufen des Imperfekts natürlich wieder. „Menge“ bleibt gegenüber „Mob“ wertneutral.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: Da er … nicht erfahren konnte
  rationale: Der Genitivus absolutus bezeichnet hier den Grund für den folgenden Befehl; γνῶναι meint im Zusammenhang das Ermitteln einer Information.
- source_word: τὸ ἀσφαλές
  choice: nichts Sicheres
  rationale: Die substantivierte Form bezeichnet das Verlässliche oder sicher Feststellbare. Die Formulierung wahrt diese Bedeutung, ohne sie enger als „Tatsachen“ oder „Wahrheit“ festzulegen.
- source_word: διὰ τὸν θόρυβον
  choice: wegen des Tumults
  rationale: θόρυβος bezeichnet hier nicht nur Lärm, sondern eine lautstarke, ungeordnete Unruhe.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: befahl er, Paulus … zu bringen
  rationale: Die Formulierung bildet den entschiedenen Befehl und den passiven Sinn des Infinitivs idiomatisch ab. Der Name macht den im Deutschen sonst missverständlichen Rückbezug von αὐτόν eindeutig, ohne einen neuen Handlungsträger einzuführen.
- source_word: εἰς τὴν παρεμβολήν
  choice: in die Kaserne
  rationale: Im Kontext bezeichnet παρεμβολή das römische Militärquartier im Festungskomplex bei der Tempelanlage; „Kaserne“ ist dafür die klarste moderne Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gegenüberstellung „dies … jenes“ spiegelt die widersprüchlichen Rufe; „nichts Sicheres erfahren“ bewahrt die Bedeutungsbreite von τὸ ἀσφαλές. Der kulturell erklärungsbedürftige Ausdruck „Kaserne“ erhält eine Fußnote.
