  source_fidelity: Die Übersetzung gibt den distributiven Gegensatz von ἄλλοι ... ἄλλο τι, den andauernden Charakter des Imperfekts ἐπεφώνουν, den kausalen Genitivus absolutus sowie die vorsichtige Bedeutung von τὸ ἀσφαλές treffend wieder. „Nichts Sicheres erfahren“ wahrt die im Griechischen bestehende Offenheit zwischen gesicherter Sachlage und zuverlässiger Information. Die Ergänzung „Paulus“ verdeutlicht den im Kontext eindeutigen Bezug von αὐτόν, ohne den Sinn zu verändern.
