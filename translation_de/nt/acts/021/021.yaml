id: ACT.21.21
reference: Acts 21:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: de
  text: Doch man hat ihnen über dich berichtet, du würdest alle Juden, die unter den Völkern leben, lehren, sich von Mose abzuwenden[a][b], indem du ihnen sagst, sie sollten ihre Kinder nicht beschneiden und nicht nach den überlieferten Bräuchen leben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du würdest Abfall von Mose lehren“. Das griechische Substantiv ἀποστασία bezeichnet Abfall, Lossagung oder Abkehr.'
    reason: lexical_alternative
  - marker: b
    text: „Mose“ steht hier für das mosaische Gesetz und die überlieferte jüdische Lebensordnung.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: „nicht nach den Bräuchen wandeln“. Gemeint ist, das Leben nicht nach ihnen auszurichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: man hat ihnen … berichtet
  rationale: Das Passiv bezeichnet hier eine mündlich vermittelte Information über Paulus. Die unpersönliche deutsche Wendung gibt den Berichtssinn natürlich wieder, ohne dessen Wahrheit zu bestätigen.
- source_word: ἀποστασίαν … ἀπὸ Μωϋσέως
  choice: sich von Mose abzuwenden
  rationale: ἀποστασία bezeichnet Abfall, Lossagung oder Abkehr. Die verbale Wendung ist in modernem Deutsch natürlicher als „Abfall von Mose“ und bewahrt die Schärfe des Vorwurfs.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: alle Juden, die unter den Völkern leben
  rationale: Die Formulierung bezeichnet die in der nichtjüdischen Welt lebenden Juden. „Unter den Völkern“ erhält den Bezug von ἔθνη und klingt zugleich verständlich.
- source_word: λέγων
  choice: indem du ihnen sagst
  rationale: Das Partizip erläutert, wie beziehungsweise mit welchem Inhalt Paulus angeblich lehrt.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: sie sollten ihre Kinder nicht beschneiden
  rationale: Die Konstruktion wird im Deutschen idiomatisch mit „ihre Kinder“ wiedergegeben. „Kinder“ bewahrt τέκνα, statt es erklärend auf „Söhne“ zu verengen.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: nicht nach den überlieferten Bräuchen leben
  rationale: περιπατεῖν bezeichnet metaphorisch die Lebensführung. „Leben“ ist im heutigen Deutsch natürlicher als „wandeln“; „überliefert“ verdeutlicht den Charakter der ἔθη als angestammte jüdische Bräuche.
theological_decisions:
- issue: Charakter des Vorwurfs gegen Paulus hinsichtlich Mose
  choice: 'Als berichteten Vorwurf wiedergeben: Paulus „würde … lehren, sich von Mose abzuwenden“.'
  alternative: „Du lehrst den Abfall von Mose“ beziehungsweise „die Abkehr vom Gesetz des Mose“.
  rationale: Der Vers referiert eine über Paulus verbreitete Behauptung und bestätigt sie nicht als erzählerisches oder theologisches Urteil. Der Konjunktiv „würdest“ markiert im Deutschen die berichtete Rede, ohne die Schärfe des Vorwurfs abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv kennzeichnet die Aussage als weitergegebenen Vorwurf. Die Hauptfassung vermeidet das heute stark fachsprachlich-theologisch klingende „Apostasie“, erhält aber dessen Bedeutung in Fußnote [a].
