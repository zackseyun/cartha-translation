id: ACT.21.8
reference: Acts 21:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: de
  text: Am nächsten Tag brachen wir auf und kamen nach Cäsarea. Wir gingen in das Haus des Evangelisten Philippus, der einer der Sieben war,[a] und blieben bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist einer der sieben Männer, die zuvor in Jerusalem für einen Dienst ausgewählt worden waren (siehe Apostelgeschichte 6,3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Die geläufige deutsche Zeitangabe gibt die zeitliche Fortsetzung der Erzählung natürlich wieder; δέ muss dabei nicht eigens übersetzt werden.
- source_word: ἐξελθόντες
  choice: brachen wir auf
  rationale: Im Reisebericht bezeichnet das Partizip das Verlassen des bisherigen Aufenthaltsorts. „Aufbrechen“ ist im modernen Deutschen idiomatisch und bewahrt die Abfolge vor dem Hauptverb.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: kamen nach Cäsarea
  rationale: Die Wendung bezeichnet das Gelangen an das Reiseziel. „Nach Cäsarea kommen“ ist eine natürliche und genaue deutsche Wiedergabe.
- source_word: Καισάρειαν
  choice: Cäsarea
  rationale: Dies ist die etablierte deutsche Form des Ortsnamens; eine Präzisierung als Cäsarea Maritima steht nicht im griechischen Text.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: Wir gingen in das Haus
  rationale: Das griechische Partizip wird zur besseren Lesbarkeit als neuer Hauptsatz wiedergegeben, wobei die zeitliche Reihenfolge der Handlungen erhalten bleibt.
- source_word: Φιλίππου
  choice: Philippus
  rationale: „Philippus“ ist die etablierte deutsche Form des griechischen Personennamens.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: des Evangelisten
  rationale: „Evangelist“ ist die etablierte und sachlich genaue Wiedergabe von εὐαγγελιστής und bewahrt den bezeichnungsartigen Charakter des Ausdrucks.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: der einer von den Sieben war
  rationale: Die Formulierung bewahrt den Rückverweis auf die bekannte Siebenergruppe, ohne daraus eine spätere Amtsbezeichnung abzuleiten.
- source_word: ἐμείναμεν
  choice: blieben
  rationale: Im Zusammenhang der Aufnahme in einem Haus bezeichnet das Verb den dortigen Aufenthalt; „blieben“ ist knapp, natürlich und quellentreu.
- source_word: παρ’ αὐτῷ
  choice: bei ihm
  rationale: Bei μένω bezeichnet παρά mit Dativ den Aufenthalt bei einer Person; „bei ihm“ ist die idiomatische deutsche Entsprechung.
theological_decisions:
- issue: Bezeichnung des Philippus als einer von den Sieben
  choice: „der einer von den Sieben war“ mit erläuternder Fußnote
  alternative: „der zu den sieben Männern gehörte“ oder eine ausdrückliche Bezeichnung als Diakon
  rationale: Der Text verweist wahrscheinlich auf die in Apostelgeschichte 6 ausgewählten sieben Männer, bezeichnet ihr Amt hier jedoch nicht näher. Die Übersetzung erhält den historischen Rückverweis und vermeidet eine nachträgliche kirchenamtliche Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechischen Partizipialfügungen werden in natürliche deutsche Satzfolgen überführt. Die Großschreibung „die Sieben“ kennzeichnet die bereits bekannte Gruppe, ohne ihr einen über den Text hinausgehenden Amtstitel zu geben.
