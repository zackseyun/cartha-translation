source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: de
  text: Er nahm sofort Soldaten und Zenturionen mit und eilte zu ihnen hinunter. Als sie den Befehlshaber[a] und die Soldaten sahen, hörten sie auf, Paulus zu schlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Militärtribun«; das griechische Wort bezeichnet hier einen römischen Befehlshaber einer Kohorte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: sofort
  rationale: Die adverbiale Wendung bezeichnet unverzügliches Handeln; „sofort“ ist natürliches, modernes Deutsch und bewahrt die Dringlichkeit.
- source_word: παραλαβὼν
  choice: nahm … mit
  rationale: Das Partizip beschreibt, dass der Befehlshaber Soldaten und Hauptleute zu seinem Einsatz mitnahm; „nahm … mit“ gibt dies idiomatisch und präzise wieder.
- source_word: στρατιώτας
  choice: Soldaten
  rationale: Das Wort bezeichnet hier einzelne Angehörige des Militärs; „Soldaten“ ist die direkte und allgemein verständliche Entsprechung.
- source_word: ἑκατοντάρχας
  choice: Hauptleute
  rationale: Der Ausdruck bezeichnet römische Zenturionen. „Hauptleute“ ist eine geläufige deutsche Wiedergabe des historischen Ranges und bleibt für heutige Leser verständlich.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: lief zu ihnen hinunter
  rationale: Die Formulierung vermittelt schnelle Bewegung auf die Menge zu und aufgrund der örtlichen Situation zugleich eine Bewegung abwärts; „lief zu ihnen hinunter“ wahrt beide Aspekte ohne eine feindselige Absicht hinzuzufügen.
- source_word: χιλίαρχον
  choice: Obersten
  rationale: Der Begriff bezeichnet den römischen Befehlshaber einer Kohorte. „Oberst“ ist eine knappe, traditionelle und verständliche funktionale Entsprechung; die Fußnote erläutert den historischen Rang.
- source_word: ἐπαύσαντο
  choice: hörten … auf
  rationale: Das Verb bezeichnet das Beenden einer laufenden Handlung; „hörten … auf“ ist im Deutschen natürlich.
- source_word: τύπτοντες
  choice: zu schlagen
  rationale: Das Partizip bezeichnet fortgesetzte Schläge. In Verbindung mit „aufhören“ gibt „zu schlagen“ die andauernde Gewalttätigkeit idiomatisch wieder.
