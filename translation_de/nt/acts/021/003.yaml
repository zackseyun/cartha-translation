source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: de
  text: Nachdem wir Zypern erblickt und es links liegen gelassen hatten[a], segelten wir weiter nach Syrien und liefen Tyrus an[b]; denn dort löschte das Schiff gerade seine Ladung[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »es auf der linken Seite zurückgelassen hatten«; Zypern blieb also während der Weiterfahrt links vom Schiff.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »kamen nach Tyrus hinab« bzw. »erreichten Tyrus«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »denn dort wurde das Schiff entladen« bzw. »dort war das Schiff gerade dabei, seine Ladung zu löschen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: Nachdem wir Zypern in Sicht bekommen ... hatten
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Segeln vorausgeht. »In Sicht bekommen« gibt den Reise- und Seefahrtskontext natürlich wieder.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: links liegen gelassen hatten
  rationale: εὐώνυμος bezeichnet hier die linke Seite. Die Formulierung besagt, dass Zypern beim Vorbeisegeln links vom Schiff blieb; sie ist im Deutschen idiomatisch, ohne unnötig nautische Fachsprache zu verwenden.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: segelten wir weiter nach Syrien
  rationale: Das Imperfekt stellt die fortdauernde Seereise dar; »weiter« bringt diesen Verlauf knapp zum Ausdruck.
- source_word: κατήλθομεν εἰς Τύρον
  choice: liefen Tyrus an
  rationale: κατέρχομαι bedeutet wörtlich »hinabkommen/-gehen«, wird im Reise- und Seefahrtszusammenhang aber natürlich mit dem Erreichen bzw. Anlaufen eines Ortes wiedergegeben. Die wörtlichere Richtungsaussage bleibt in einer Fußnote erhalten.
- source_word: ἐκεῖσε
  choice: dort
  rationale: Das Adverb verweist auf Tyrus als den Ort, an dem die Ladung gelöscht werden sollte.
- source_word: τὸ πλοῖον ἦν ἀποφορτιζόμενον
  choice: das Schiff sollte ... löschen
  rationale: Die periphrastische Konstruktion bezeichnet den dort stattfindenden bzw. vorgesehenen Löschvorgang. Bei einem Schiff ist »Ladung löschen« die idiomatische deutsche Wendung; die grammatisch mögliche passive Auffassung wird in der Fußnote bewahrt.
- source_word: τὸν γόμον
  choice: seine Ladung
  rationale: γόμος bezeichnet die Fracht bzw. Ladung eines Schiffes. Das Possessivpronomen stellt den natürlichen Bezug zum Schiff her.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit verständlicher Reiseschilderung. »Tyrus anlaufen« und »Ladung löschen« sind etablierte, noch gut verständliche Begriffe der Seefahrt. Die syntaktische Abfolge des Griechischen und die Begründung mit γάρ bleiben erhalten; echte Deutungsmöglichkeiten der Entladekonstruktion werden nicht vereinheitlicht, sondern in der Fußnote ausgewiesen.
