  to: 'Da antwortete Paulus: „Was tut ihr da, dass ihr weint und mir das Herz brecht? Denn ich bin bereit, mich in Jerusalem für den Namen des Herrn Jesus nicht nur fesseln zu lassen, sondern auch zu sterben.“'
  rationale: Die Revision ergänzt „Denn“ als notwendige Wiedergabe von γάρ und verbindet die beiden partizipialen Handlungen natürlich mit der Frage. Die Stellung von „in Jerusalem“ und „für den Namen des Herrn Jesus“ lässt beide Infinitive mit umschließen und bewahrt damit die Aussage des griechischen Satzes.
