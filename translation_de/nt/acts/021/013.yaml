  source_fidelity: 'Die Grundbedeutung ist treffend wiedergegeben: Paulus antwortet auf das Weinen, erklärt seine Bereitschaft zur Fesselung und zum Tod in Jerusalem und bewahrt die Wendung „für den Namen des Herrn Jesus“. Das im Griechischen ausdrücklich gesetzte γάρ („denn“) fehlt jedoch; „doch“ ersetzt seine begründende Funktion nicht angemessen.'
  naturalness: Das Deutsch ist modern und gut verständlich. Die Umformung der Partizipien in finite Sätze ist idiomatisch. Mit „dass ihr weint und mir das Herz brecht“ wird ihr enger Bezug auf die Frage klarer und die Interpunktion weniger fragmentiert.
  terminology: „Herr Jesus“ gibt κύριος sachgerecht wieder. „Für den Namen des Herrn Jesus“ bewahrt die absichtlich bildhafte biblische Ausdrucksweise, ohne sie konfessionell einzuengen.
