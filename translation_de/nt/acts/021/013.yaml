  revised_text: 'Da antwortete Paulus: „Was tut ihr da, dass ihr weint und mir das Herz brecht? Denn ich bin bereit, mich in Jerusalem für den Namen des Herrn Jesus nicht nur fesseln zu lassen, sondern auch zu sterben.“'
