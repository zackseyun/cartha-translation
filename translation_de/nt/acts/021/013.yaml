source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: de
  text: 'Da antwortete Paulus: „Was tut ihr da, dass ihr weint und mir das Herz brecht? Denn ich bin bereit, mich in Jerusalem für den Namen des Herrn Jesus nicht nur fesseln zu lassen, sondern auch zu sterben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: Da antwortete Paulus
  rationale: „Da“ gibt τότε im Erzählfluss natürlich wieder; „antwortete“ entspricht dem üblichen narrativen Gebrauch von ἀποκρίνομαι.
- source_word: Τί ποιεῖτε
  choice: Was tut ihr da?
  rationale: Die direkte Frage bleibt erhalten; „da“ macht den emotionalen Protest im heutigen Deutsch idiomatisch, ohne ihn als Warum-Frage auszudeuten.
- source_word: κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν
  choice: Ihr weint und brecht mir das Herz!
  rationale: Die koordinierten Partizipien werden als natürliche deutsche Folgesätze wiedergegeben. „Das Herz brechen“ bewahrt das starke emotionale Bild von συνθρύπτω verständlich und würdig.
- source_word: οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν
  choice: nicht nur fesseln zu lassen, sondern sogar zu sterben
  rationale: Die passive Bedeutung von δεθῆναι bleibt ausdrücklich erhalten; „sogar“ gibt die steigernde Kraft von καὶ vor ἀποθανεῖν wieder.
- source_word: εἰς Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Im Deutschen bezeichnet „in Jerusalem“ idiomatisch den Ort des erwarteten Gefesseltwerdens und Sterbens; ein Richtungsbezug wird hier nicht erzwungen.
- source_word: ἑτοίμως ἔχω
  choice: Ich bin bereit
  rationale: Natürliche und präzise Wiedergabe der griechischen Bereitschaftsformel.
- source_word: ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ
  choice: für den Namen des Herrn Jesus
  rationale: Bewahrt die biblisch gewichtige Rede vom „Namen“ und gibt ὑπέρ knapp als „für“ wieder.
theological_decisions:
- issue: Wiedergabe von κύριος als Titel Jesu
  choice: der Herr Jesus
  alternative: der Meister Jesus
  rationale: „Herr“ ist die etablierte, sachgerechte Wiedergabe des christologischen Titels κύριος und schwächt dessen Gewicht nicht ab.
- issue: Bewahrung der Wendung „der Name“
  choice: für den Namen des Herrn Jesus
  alternative: um des Herrn Jesus willen
  rationale: Die Übersetzung lässt die biblische Metonymie stehen, in der der Name für Jesu Person, Autorität und die mit ihm verbundene Sache steht, statt sie auf eine einzelne Bedeutung zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Ausruf nach der Frage trägt die emotionale Spannung, ohne die Aussage auszuschmücken. Keine Fußnote ist nötig, da die Metapher „das Herz brechen“ und die Wendung „für den Namen“ im Deutschen verständlich bleiben.
