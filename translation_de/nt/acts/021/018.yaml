source:
  edition: SBLGNT
  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: de
  text: Am folgenden Tag ging Paulus mit uns zu Jakobus, und alle Ältesten kamen dorthin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und alle Ältesten waren anwesend“. Das griechische Verb kann entweder ihr Eintreffen oder ihre Anwesenheit hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: Am folgenden Tag
  rationale: Die idiomatische Zeitangabe bezeichnet den nächsten beziehungsweise folgenden Tag; „Am folgenden Tag“ ist im modernen Deutschen natürlich.
- source_word: εἰσῄει
  choice: ging … hinein
  rationale: Das Imperfekt von εἴσειμι bezeichnet eine Bewegung nach innen. „ging … hinein“ bewahrt diese Richtungsnuance, ohne den nicht ausdrücklich genannten Ort zu ergänzen.
- source_word: σὺν ἡμῖν
  choice: mit uns
  rationale: σύν mit Dativ bezeichnet hier eindeutig Begleitung.
- source_word: πρὸς Ἰάκωβον
  choice: zu Jakobus
  rationale: πρός mit Akkusativ bezeichnet die Bewegung zu einer Person; weitere Angaben zu dessen Identität oder Aufenthaltsort stehen nicht im Text.
- source_word: πάντες τε
  choice: und alle
  rationale: τέ verbindet den Satzteil mit leichter koordinierender Kraft; schlichtes „und“ gibt dies im Deutschen angemessen wieder.
- source_word: παρεγένοντο
  choice: kamen dorthin
  rationale: παραγίνομαι kann das Eintreffen oder die daraus folgende Anwesenheit bezeichnen. „kamen dorthin“ gibt die dynamische Grundbedeutung wieder; die mögliche statische Auffassung wird in der Fußnote bewahrt.
- source_word: οἱ πρεσβύτεροι
  choice: die Ältesten
  rationale: „Älteste“ ist die transparente und konfessionell neutrale Bezeichnung für die anerkannten Gemeindeleiter.
theological_decisions:
- issue: Identität und Rolle des Ἰάκωβον
  choice: Nur den Personennamen „Jakobus“ wiedergeben.
  alternative: „Jakobus, der Bruder des Herrn“ oder „Jakobus, der Leiter der Gemeinde in Jerusalem“
  rationale: Der Vers selbst nennt keine nähere Identifikation. Eine Ergänzung würde Kontextwissen in den Haupttext eintragen.
- issue: Kirchlicher Sinn von οἱ πρεσβύτεροι
  choice: „die Ältesten“ ohne konfessionelle Präzisierung
  alternative: „die Presbyter“ oder „die Gemeindeleiter“
  rationale: Der Ausdruck bezeichnet anerkannte Leiter der Jerusalemer Gemeinde, legt aber keine spätere konfessionelle Amtsordnung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Formulierung „zu Jakobus hinein“ erhält die im griechischen Verb enthaltene Bewegung nach innen, ohne einen nicht genannten Ort wie ein Haus oder einen Versammlungsraum einzuführen.
