  source_fidelity: 'Die Zeitangabe, Begleitung, Zielperson und „Älteste“ sind treffend wiedergegeben. „Alle Ältesten kamen dorthin“ ist als dynamische Wiedergabe von παρεγένοντο möglich; die Fußnote wahrt zutreffend die alternative Lesart „waren anwesend“. Die Verbindung „zu Jakobus hinein“ ist jedoch im Deutschen semantisch und syntaktisch unnatürlich: „hinein“ bezieht sich gewöhnlich auf einen genannten bzw. klaren Raum, nicht unmittelbar auf eine Person. Das griechische εἰσῄει rechtfertigt keine solche deutschen Konstruktion.'
