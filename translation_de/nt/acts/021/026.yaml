id: ACT.21.26
reference: Acts 21:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: de
  text: Da nahm Paulus die Männer mit sich. Am folgenden Tag reinigte er sich gemeinsam mit ihnen und ging in den Tempel[a]. Dabei meldete er den Abschluss der Reinigungstage an, bis für jeden Einzelnen von ihnen die Opfergabe dargebracht wurde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet den gesamten Tempelbezirk, nicht speziell das innere Heiligtum.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „geopfert wurde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: nahm Paulus die Männer mit sich
  rationale: „Mit sich nehmen“ gibt die begleitende Bedeutung des Partizips im Deutschen natürlich und vollständig wieder.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: Am folgenden Tag
  rationale: Eine klare und idiomatische Wiedergabe der Zeitangabe.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: reinigte er sich gemeinsam mit ihnen
  rationale: Der Zusammenhang bezeichnet rituelle Reinigung; die reflexive Form wahrt die mögliche mediale Bedeutung und klingt im Deutschen natürlich.
- source_word: εἰσῄει
  choice: ging
  rationale: Der deutsche Erzählstil gibt das griechische Imperfekt hier am natürlichsten mit dem Präteritum wieder. Eine Verlaufsform wie „war im Begriff hineinzugehen“ würde eine im Kontext nicht sichere Bedeutungsnuance hinzufügen.
- source_word: τὸ ἱερόν
  choice: den Tempel
  rationale: „Tempel“ ist die übliche verständliche Wiedergabe; ἱερόν bezeichnet hier den Tempelbezirk und nicht ausschließlich das innere Heiligtum, was die Fußnote erläutert.
- source_word: διαγγέλλων
  choice: Dabei meldete er … an
  rationale: Die Formulierung lässt den förmlichen beziehungsweise verfahrensbezogenen Charakter der Mitteilung erkennen.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: den Abschluss der Reinigungstage
  rationale: Die knappe Formulierung bezeichnet das Erreichen des vorgeschriebenen Endes der rituellen Reinigungszeit.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die direkte Wiedergabe bewahrt die syntaktische Beziehung und die gewisse Härte beziehungsweise Deutungsoffenheit der griechischen Formulierung.
- source_word: προσηνέχθη
  choice: dargebracht wurde
  rationale: Im kultischen Zusammenhang bezeichnet προσφέρω das Darbringen einer Opfergabe; „dargebracht“ ist präzise, würdig und nicht unnötig eng.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: für jeden Einzelnen von ihnen
  rationale: Die Formulierung bewahrt sowohl den stellvertretenden beziehungsweise begünstigenden Bezug von ὑπέρ als auch die ausdrückliche Einzelbezogenheit.
- source_word: ἡ προσφορά
  choice: die Opfergabe
  rationale: „Opfergabe“ bildet den kultischen Sinn ab, ohne die konkrete Art der Gabe weiter festzulegen.
theological_decisions:
- issue: Bedeutung der Teilnahme des Paulus an der jüdischen Reinigung
  choice: Die Teilnahme wird sachlich als erzähltes Geschehen wiedergegeben.
  alternative: Durch wertende Zusätze eine Bestätigung oder Ablehnung der fortdauernden Geltung des Tempelkults anzudeuten.
  rationale: Der Vers berichtet das Handeln des Paulus, entscheidet aber nicht ausdrücklich die weitergehenden theologischen Fragen zur Geltung des Gesetzes oder des Tempelkults.
- issue: Aspekt von εἰσῄει
  choice: Natürliches deutsches Präteritum „ging“
  alternative: Eine ausdrücklich fortschreitende oder wiederholte Handlung formulieren, etwa „ging immer wieder hinein“.
  rationale: Das griechische Imperfekt lässt eine Verlaufs- oder Wiederholungsnuance zu, legt sie an dieser Stelle jedoch nicht eindeutig fest. Eine stärkere deutsche Ausformulierung würde die Ambiguität unnötig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der lange griechische Satz wurde zur besseren Lesbarkeit in mehrere deutsche Sätze gegliedert; die zeitliche Verknüpfung mit „bis“ bleibt erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, auf den sich die Anmerkung bezieht.
