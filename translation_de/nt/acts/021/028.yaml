  naturalness: „der überall alle gegen das Volk, das Gesetz und diesen Ort lehrt“ ist im modernen Standarddeutsch syntaktisch holprig und kann missverständlich wirken, weil „alle gegen … lehren“ keine klare deutsche Konstruktion ist. Die Infinitivkonstruktion stellt den gemeinten Vorwurf idiomatisch und vollständig dar.
  terminology: „das Gesetz“, „Griechen“, „Tempel“ und „entweiht“ sind kontextgerecht. Die Fußnote zu ἱερόν ist sachlich richtig und angemessen am Wort „Tempel“ verankert.
