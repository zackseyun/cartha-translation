id: ACT.21.28
reference: Acts 21:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: de
  text: 'Sie schrien: „Ihr Männer von Israel, helft! Das ist der Mann, der alle überall lehrt, sich gegen das Volk, das Gesetz und diesen Ort zu stellen. Darüber hinaus hat er sogar Griechen in den Tempel[a] gebracht und diesen heiligen Ort entweiht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet hier den gesamten Tempelbezirk mit seinen Vorhöfen, nicht speziell das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: und riefen
  rationale: Das Präsenspartizip bezeichnet die Art ihres Auftretens. Im fortlaufenden deutschen Satz gibt „und riefen“ den lauten, dringlichen Ruf natürlich wieder.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ihr Männer von Israel
  rationale: Die Anrede ist ausdrücklich maskulin und richtet sich an israelitische Männer; die gewählte Form ist würdig und im Deutschen verständlich.
- source_word: βοηθεῖτε
  choice: helft!
  rationale: Der Imperativ enthält kein ausdrückliches Objekt. „Helft!“ vermeidet daher den Zusatz „uns“.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Das ist der Mann
  rationale: Die identifizierende Aussage behält so ihren anklagenden Nachdruck.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: der ... gegen das Volk, das Gesetz und diesen Ort lehrt
  rationale: κατά mit Genitiv bezeichnet hier Gegnerschaft. „Das Gesetz“ meint im Kontext das jüdische beziehungsweise mosaische Gesetz, ohne dass die Übersetzung dies zusätzlich ausdeutet.
- source_word: πάντας πανταχῇ διδάσκων
  choice: der überall alle ... lehrt
  rationale: Die Kombination bewahrt die rhetorische Totalität von πάντας und πανταχῇ und ist zugleich natürliches Deutsch.
- source_word: ἔτι τε καὶ
  choice: Darüber hinaus ... sogar
  rationale: Die Formulierung führt steigernd eine weitere Anschuldigung ein; „sogar“ gibt die verstärkende Wirkung von καί wieder.
- source_word: Ἕλληνας
  choice: Griechen
  rationale: Das Wort bezeichnet ausdrücklich Griechen und wird nicht zum allgemeineren „Nichtjuden“ erweitert.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: hat ... Griechen in den Tempel gebracht
  rationale: Der Aorist wird in der erhobenen Anschuldigung idiomatisch mit dem Perfekt wiedergegeben. ἱερόν bezeichnet den Tempelbezirk; diese Präzisierung steht in der Fußnote.
- source_word: κεκοίνωκεν
  choice: hat ... entweiht
  rationale: κοινόω bezeichnet im kultischen Zusammenhang das Unrein- beziehungsweise Profanmachen. „Entweiht“ bringt die behauptete Verletzung der Heiligkeit klar zum Ausdruck.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: diesen heiligen Ort
  rationale: Die Formulierung wahrt sowohl den Demonstrativakzent als auch den kultischen Begriff der Heiligkeit.
theological_decisions:
- issue: Bezug von τοῦ νόμου
  choice: „das Gesetz“ als kontextueller Verweis auf das mosaische Gesetz
  alternative: „die Tora“ oder ein allgemeineres „Gesetz“ ohne bestimmten Artikel
  rationale: Im Jerusalemer Tempelkontext bezieht sich die Anklage auf das für Israel maßgebliche Gesetz. Die schlichte Wiedergabe „das Gesetz“ macht den Bezug verständlich, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Bedeutungsumfang von ἱερόν
  choice: „Tempel“ im Haupttext mit erläuternder Fußnote zum Tempelbezirk
  alternative: „Tempelbezirk“ oder „Tempelvorhöfe“ unmittelbar im Haupttext
  rationale: „Tempel“ ist die natürliche deutsche Bezeichnung; die Fußnote verhindert zugleich eine Verwechslung mit dem engeren inneren Heiligtum, für das eher ναός stünde.
- issue: Status der Aussage über die Entweihung
  choice: als Anschuldigung der Rufenden ohne bestätigende Zusätze wiedergegeben
  alternative: durch Formulierungen wie „angeblich“ ausdrücklich distanzieren
  rationale: Der Vers berichtet die Anklage in direkter Rede. Die Übersetzung sollte weder ihre Wahrheit bestätigen noch durch einen nicht vorhandenen Zusatz vorweg beurteilen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt erregt und anklagend, ohne umgangssprachlich zu werden. Der Fußnotenmarker [a] steht unmittelbar bei „Tempel“, dem erläuterten Ausdruck.
