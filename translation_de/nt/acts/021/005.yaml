id: ACT.21.5
reference: Acts 21:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: de
  text: Als die Zeit gekommen war, diese Tage zu Ende zu bringen,[a] brachen wir auf und zogen weiter. Alle begleiteten uns mit ihren Frauen und Kindern bis vor die Stadt hinaus. Am Strand knieten wir nieder[b] und beteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als wir die vorgesehenen Tage beendet hatten“.'
    reason: Die griechische Konstruktion kann entweder den Eintritt des Zeitpunkts oder den Abschluss des Aufenthalts in den Vordergrund stellen.
  - marker: b
    text: 'Wörtlich: „setzten wir die Knie auf den Strand“.'
    reason: Die wörtliche Form macht das griechische Idiom sichtbar; gemeint ist das Niederknien zum Gebet.
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: Als die Zeit gekommen war, diese Tage zu Ende zu bringen
  rationale: Die Wendung mit ἐγένετο und Infinitiv bezeichnet den Eintritt des Zeitpunktes; ἐξαρτίσαι bedeutet hier, einen festgesetzten Zeitraum abzuschließen. „Diese Tage“ bewahrt den konkreten Bezug.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: brachen wir auf und zogen weiter
  rationale: Die Formulierung gibt sowohl den Aufbruch als auch die anschließend fortgesetzte Reise natürlich wieder.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Alle begleiteten uns
  rationale: προπέμπω bezeichnet hier das begleitende Geleit beim Abschied; die Alternative „gaben uns das Geleit“ wird in der Fußnote genannt.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: mit ihren Frauen und Kindern
  rationale: Im Zusammenhang mit πάντων im Maskulinum und der Darstellung ganzer Familien ist „ihren Frauen“ die wahrscheinlichste kontextuelle Bedeutung.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: bis vor die Stadt hinaus
  rationale: Die Wiedergabe bewahrt die räumliche Bewegung bis zu einem Punkt außerhalb der Stadtgrenze und klingt im Deutschen natürlich.
- source_word: θέντες τὰ γόνατα
  choice: knieten wir nieder
  rationale: Die wörtliche Wendung „die Knie setzen“ ist ein griechisches Idiom für das Niederknien.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: Am Strand
  rationale: αἰγιαλός bezeichnet den Strand beziehungsweise das Ufer am Meer; „Strand“ ist im Kontext klar und modern.
- source_word: προσευξάμενοι
  choice: und beteten
  rationale: Das Partizip wird als weitere Handlung der erzählenden Wir-Gruppe natürlich mit einem finiten Verb wiedergegeben.
theological_decisions: []
