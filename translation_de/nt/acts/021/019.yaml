id: ACT.21.19
reference: Acts 21:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: de
  text: Nachdem er sie begrüßt hatte, berichtete er der Reihe nach, was Gott durch seinen Dienst unter den Nichtjuden[a] getan hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »unter den Völkern«; gemeint sind hier die nichtjüdischen Menschen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »legte er im Einzelnen dar, was Gott durch seinen Dienst unter den Nichtjuden getan hatte.« Das griechische Verb und die Wendung »der Reihe nach« beschreiben einen ausführlichen Bericht über die einzelnen Vorgänge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Nachdem er sie begrüßt hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem anschließenden Bericht vorausgeht. Die Formulierung ist im modernen Deutsch natürlich und bewahrt die zeitliche Abfolge.
- source_word: ἐξηγεῖτο
  choice: berichtete er
  rationale: Das Imperfekt stellt das ausführliche Berichten als fortlaufenden Vorgang dar. Zusammen mit »der Reihe nach« gibt »berichtete« den Sinn wieder, ohne einen im Griechischen nicht ausdrücklich markierten Beginn einzuführen.
- source_word: καθ’ ἓν ἕκαστον
  choice: der Reihe nach
  rationale: Die Wendung unterstreicht, dass Paulus die einzelnen Vorgänge nacheinander darlegte. »Der Reihe nach« ist idiomatisch und wahrt die distributive Bedeutung.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: was Gott ... getan hatte
  rationale: Die Übersetzung weist Gott ausdrücklich als Handelnden aus; das Plusquamperfekt fügt sich natürlich in die rückblickende Erzählung ein.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Nichtjuden
  rationale: Im Kontext bezeichnet ἔθνη die Völker außerhalb Israels beziehungsweise nichtjüdische Menschen. »Nichtjuden« ist unmittelbar verständlich und vermeidet, dass »Völker« rein geopolitisch verstanden wird.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: durch seinen Dienst
  rationale: διά mit dem Genitiv kennzeichnet hier das Mittel. »Dienst« gibt διακονία verständlich wieder, ohne unnötig den Eindruck eines kirchlichen Amtes zu erwecken.
theological_decisions:
- issue: Urheberschaft und Vermittlung im Missionsbericht
  choice: Gott wird als der Handelnde dargestellt; der Dienst des Paulus ist das Mittel seines Handelns.
  alternative: Paulus berichtete von dem, was er selbst unter den Nichtjuden vollbracht hatte.
  rationale: ὁ θεὸς ist ausdrücklich das Subjekt von ἐποίησεν, während διὰ τῆς διακονίας αὐτοῦ den Dienst des Paulus als Mittel bezeichnet. Die Übersetzung wahrt sowohl Gottes Handeln als auch die menschliche Mitwirkung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Nichtjuden« ist allgemein verständlicher als das fachsprachlichere »Heiden«; »Dienst« vermeidet eine unnötige Amtskonnotation. Die Fußnotenmarker stehen jeweils an der einschlägigen Stelle im Haupttext.
