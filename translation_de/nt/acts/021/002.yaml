- from: Dann fanden wir ein Schiff, das nach Phönizien übersetzte[a]. Wir gingen an Bord und stachen in See.
  to: Nachdem wir ein Schiff gefunden hatten, das nach Phönizien fuhr[a], gingen wir an Bord und stachen in See.
  rationale: Die Änderung ersetzt die im Deutschen missverständliche Formulierung „übersetzte“ durch die natürliche und quellentreue Aussage „nach Phönizien fuhr“. Die temporale Einleitung macht die Vorzeitigkeit des ersten Partizips deutlich; „gingen wir an Bord und stachen in See“ erhält die nachfolgende Handlungsfolge. Die Fußnote bewahrt sowohl die idiomatische Deutung als Zielangabe als auch den verbaleren Sinn von διαπερῶν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:59:29Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge von Finden, An-Bord-Gehen und Auslaufen sowie Ziel und nautischen Sinn von ἀνήχθημεν zutreffend wieder. „übersetzte“ ist jedoch bei einem Schiff ohne ergänztes Objekt im heutigen Standarddeutsch missverständlich und kann nahelegen, das Schiff habe Personen oder Fracht übergesetzt, statt selbst die Überfahrt nach Phönizien zu machen.
  naturalness: „Wir gingen an Bord und stachen in See“ ist idiomatisch und angemessen. „ein Schiff, das nach Phönizien übersetzte“ klingt dagegen unnatürlich. Eine temporale Einleitung bildet die beiden griechischen Aoristpartizipien klar und flüssig ab.
  terminology: „Schiff“, „Phönizien“, „an Bord gehen“ und „in See stechen“ sind sachgerecht. Die Fußnote sollte die mögliche idiomatischere Zielangabe als Alternative ausweisen, ohne die bildhafte bzw. verbale Aussage von διαπερῶν zu überdehnen.
  issues:
  - severity: medium
    issue: „das nach Phönizien übersetzte“
    rationale: Das Verb „übersetzen“ wird im modernen Deutsch bei Schiffen gewöhnlich transitiv gebraucht („jemanden/etwas übersetzen“) oder bezeichnet einen Fährdienst. Für die selbstständige Fahrt des Schiffs ist „nach Phönizien fuhr“ bzw. „hinüberfuhr“ eindeutig und natürlich.
