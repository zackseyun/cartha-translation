  text: καὶ εὑρόντες πλοῖον διαπερῶν εἰς Φοινίκην ἐπιβάντες ἀνήχθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: de
  text: Nachdem wir ein Schiff gefunden hatten, das nach Phönizien fuhr[a], gingen wir an Bord und stachen in See.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein nach Phönizien bestimmtes Schiff“. Wörtlich beschreibt das Griechische ein Schiff, das „nach Phönizien hinüberfuhr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: Dann fanden wir
  rationale: Der Aoristpartizip bezeichnet eine Handlung, die dem An-Bord-Gehen und Auslaufen vorausgeht. Die finite Form mit „dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: πλοῖον
  choice: ein Schiff
  rationale: Die übliche und kontextgerechte Bezeichnung für ein seetüchtiges Fahrzeug im Mittelmeerraum.
- source_word: διαπερῶν
  choice: das ... übersetzte
  rationale: Das Präsenspartizip beschreibt die Fahrt des Schiffes. „Übersetzen“ bewahrt den Gedanken des Hinüberfahrens, ohne bloß die Bestimmung des Schiffes auszudrücken.
- source_word: εἰς Φοινίκην
  choice: nach Phönizien
  rationale: εἰς bezeichnet hier das Ziel; bei geografischen Namen ist „nach“ die natürliche deutsche Entsprechung.
- source_word: ἐπιβάντες
  choice: Wir gingen an Bord
  rationale: Im nautischen Zusammenhang bedeutet ἐπιβαίνω, ein Schiff zu besteigen. Die finite Wiedergabe ist im Deutschen klar und erhält die Handlungsfolge.
- source_word: ἀνήχθημεν
  choice: stachen in See
  rationale: ἀνάγω ist hier nautisch im Sinn von „auslaufen“ oder „in See stechen“ gebraucht. Die gewählte Wendung ist idiomatisch, würdig und präzise.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die griechische Partizipienfolge wird zur besseren Lesbarkeit teilweise in finite Hauptsätze aufgelöst; die zeitliche Abfolge bleibt erhalten.
