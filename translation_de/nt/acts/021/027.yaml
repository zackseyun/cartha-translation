  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: de
  text: Als die sieben Tage beinahe zu Ende waren, sahen die Juden aus der Provinz Asia ihn im Tempel[a], brachten die ganze Menge in Aufruhr[b] und ergriffen ihn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Tempel“ ist hier der gesamte Tempelbezirk gemeint, nicht nur das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Sie versetzten die ganze Menge in Verwirrung.“ Das griechische Verb kann sowohl Aufruhr als auch Verwirrung ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „legten die Hände auf ihn“; gemeint ist ein gewaltsames Ergreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Als nun die sieben Tage fast vollendet waren
  rationale: Die Formulierung bewahrt den zeitlichen Rahmen, die unmittelbar bevorstehende Vollendung und den Rückbezug von δέ; „fast vollendet“ klingt im Deutschen natürlicher als eine wörtliche Konstruktion mit „im Begriff sein“.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: die Juden aus der Provinz Asia
  rationale: Ἀσία bezeichnet hier die römische Provinz, nicht den modernen Kontinent. Die ausdrückliche Nennung der Provinz verhindert dieses Missverständnis; „Asia“ unterscheidet den antiken Eigennamen vom heutigen „Asien“.
- source_word: θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ
  choice: sahen ihn ... im Tempel
  rationale: Das griechische Partizip wird für einen natürlichen deutschen Satz als finites Verb wiedergegeben. „Tempel“ bezeichnet hier den Tempelbezirk insgesamt, was eine Fußnote erläutert.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: Sie brachten die ganze Menschenmenge in Aufruhr
  rationale: συγχέω kann sowohl Verwirrung als auch Erregung und Unruhe bezeichnen. „in Aufruhr bringen“ passt zum folgenden gewaltsamen Zugriff, ohne die lexikalische Mehrdeutigkeit völlig zu verengen.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: ergriffen ihn
  rationale: Die griechische Wendung bedeutet hier, dass sie Paulus gewaltsam in ihre Gewalt brachten. „Ergriffen“ gibt den idiomatischen Sinn im heutigen Deutsch klarer wieder als das missverständliche „legten Hand an ihn“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde nach „Tempel“ geteilt, um die dichte griechische Partizipialkonstruktion verständlich wiederzugeben. „Menschenmenge“ vermeidet die in manchen Zusammenhängen abwertende Färbung von „Menge“ oder „Mob“.
