  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: de
  text: 'Als Paulus gerade in die Kaserne hineingeführt werden sollte, sagte er zu dem Tribun[a]: »Darf ich dir etwas sagen?« Der erwiderte: »Du kannst Griechisch?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kommandant«. Der griechische Ausdruck bezeichnet einen römischen Militäroffizier und wird traditionell mit »Tribun« wiedergegeben.'
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: Als Paulus gerade … hineingebracht werden sollte
  rationale: Die temporale Konstruktion gibt die unmittelbar bevorstehende, passive Handlung natürlich wieder.
- source_word: παρεμβολή
  choice: Kaserne
  rationale: Im Jerusalemer Kontext bezeichnet das Wort das römische Militärquartier, wahrscheinlich im Festungskomplex.
- source_word: χιλίαρχος
  choice: Tribun
  rationale: Der historische Titel bezeichnet hier einen höheren römischen Offizier; »Tribun« ist knapp und sachlich präzise.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: Darf ich dir etwas sagen?
  rationale: Die idiomatische deutsche Höflichkeitsfrage bewahrt den Sinn der griechischen Frage nach Erlaubnis.
- source_word: Ἑλληνιστὶ γινώσκεις
  choice: Du kannst Griechisch?
  rationale: Im Sprachkontext bezeichnet γινώσκω die Kenntnis beziehungsweise Beherrschung des Griechischen; die Wortstellung vermittelt die überraschte Rückfrage natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfliche Bitte wird idiomatisch formuliert; die überraschte Reaktion des Tribuns erscheint als knappe Rückfrage.
