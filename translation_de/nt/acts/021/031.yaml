  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: de
  text: Während sie ihn zu töten suchten, erreichte den Befehlshaber der Kohorte[a] die Meldung, dass ganz Jerusalem in Aufruhr war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Kohorte war eine römische Militäreinheit; ihr Befehlshaber war ein Militärtribun.
    reason: cultural_note
  - marker: b
    text: 'Oder: »in Verwirrung« oder »in Unruhe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: Während sie versuchten, ihn zu töten
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet eine andauernde, zur Haupthandlung gleichzeitige Handlung. „Versuchten“ gibt ζητέω in diesem Zusammenhang natürlich wieder; „ihn zu töten“ entspricht der direkten Bedeutung von ἀποκτείνω.
- source_word: ἀνέβη φάσις
  choice: erreichte ... die Meldung
  rationale: Wörtlich steigt die Meldung zum Befehlshaber hinauf, wohl zur höher gelegenen Burg Antonia. Im Deutschen gibt „erreichte ... die Meldung“ die idiomatische Bedeutung klar wieder, ohne eine im Zieltext missverständliche räumliche Formulierung zu erzwingen.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: den Befehlshaber der Kohorte
  rationale: χιλίαρχος bezeichnet hier den römischen Militärtribunen, der die σπεῖρα befehligte. „Befehlshaber“ ist allgemein verständlich; „Kohorte“ bewahrt die historische Bezeichnung der militärischen Einheit.
- source_word: ὅτι ὅλη συγχύννεται Ἰερουσαλήμ
  choice: dass ganz Jerusalem in Aufruhr war
  rationale: „Ganz Jerusalem“ bewahrt die knappe Metonymie des Griechischen. συγχύννεται beschreibt eine gegenwärtige Verwirrung beziehungsweise Unruhe; „in Aufruhr war“ passt zum öffentlichen Tumult des Zusammenhangs.
theological_decisions: []
