  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: de
  text: 'Da er sich aber nicht überzeugen ließ, wurden wir still und sagten: »Der Wille des Herrn geschehe.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Da er sich aber nicht umstimmen ließ
  rationale: Der Genitivus absolutus beschreibt den Umstand beziehungsweise Grund für die folgende Reaktion. »Sich nicht umstimmen lassen« gibt im Zusammenhang wieder, dass Paulus den Bitten der anderen nicht nachgab, ohne das weniger natürliche deutsche »sich nicht überzeugen lassen« zu erzwingen.
- source_word: ἡσυχάσαμεν
  choice: gaben wir nach[a]
  rationale: Das Verb bezeichnet hier das Aufhören mit dem Zureden und den Verzicht auf weiteren Widerspruch. »Wir gaben nach« ist im Deutschen natürlich und trifft die Handlung im Kontext; die wörtlichere Bedeutung »wir wurden still« bleibt in der Fußnote erhalten.
- source_word: εἰπόντες
  choice: und sagten
  rationale: Der Aoristpartizip wird als koordinierter deutscher Satz wiedergegeben, was den zeitlichen und inhaltlichen Anschluss an die Haupthandlung klar und idiomatisch ausdrückt.
- source_word: Τοῦ κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird natürlich mit »des Herrn« wiedergegeben. »Herr« bewahrt die übliche, im Griechischen nicht weiter präzisierte Bezeichnung.
- source_word: τὸ θέλημα
  choice: der Wille
  rationale: »Wille« ist die direkte und in dieser ergebenen Aussage passende Wiedergabe von θέλημα.
- source_word: γινέσθω
  choice: geschehe
  rationale: Der Imperativ von γίνομαι drückt die Zustimmung dazu aus, dass der Wille des Herrn Wirklichkeit werden soll. Das gehobene, aber allgemein verständliche »geschehe« bewahrt die knappe gebetsartige Formulierung.
theological_decisions:
- issue: Bezug und Wiedergabe von κύριος
  choice: Herr
  alternative: Meister
  rationale: »Herr« ist die natürliche biblische Wiedergabe von κύριος. Obwohl im Erzählzusammenhang wahrscheinlich Jesus gemeint ist, nennt der griechische Text den Bezug nicht ausdrücklich; deshalb wird »Jesus« nicht ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung ist natürlich und knapp; »geschehe« bewahrt bewusst den feierlichen, ergebenen Ton der griechischen Aussage.
