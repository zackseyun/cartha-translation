  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: de
  text: 'Und er sagte zu mir: »Geh! Denn ich werde dich weit weg zu den Nichtjuden[a] senden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Völkern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: er sagte zu mir
  rationale: λέγω mit πρός und Akkusativ leitet hier die an Paulus gerichtete direkte Rede ein; die Formulierung ist natürlich und bewahrt den Erzählstil.
- source_word: Πορεύου
  choice: Geh!
  rationale: Der Imperativ von πορεύομαι ist eine knappe Aufforderung zum Fortgehen; »Geh!« gibt sie klar und idiomatisch wieder.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet die Aufforderung. »Denn« verbindet Befehl und Begründung in einem würdigen, natürlichen deutschen Stil.
- source_word: ἐγὼ
  choice: ich
  rationale: Das ausdrücklich gesetzte griechische Pronomen betont den Sendenden; im Deutschen trägt »ich werde dich … senden« diese Aussage, ohne künstliche Hervorhebung.
- source_word: εἰς ἔθνη
  choice: zu den Nichtjuden
  rationale: Im Kontext der Sendung des Paulus bezeichnet ἔθνη Menschen außerhalb des jüdischen Volkes. »Nichtjuden« macht diesen Gegensatz im heutigen Deutsch unmittelbar verständlich; die lexikalisch mögliche Wiedergabe »Völker« bleibt in der Fußnote erhalten.
- source_word: μακρὰν
  choice: weit weg
  rationale: Das Adverb bezeichnet räumliche Ferne und wird mit der im Deutschen natürlichen Wendung »weit weg« wiedergegeben.
- source_word: ἐξαποστελῶ σε
  choice: ich werde dich … senden
  rationale: Die Zukunftsform von ἐξαποστέλλω bezeichnet das Aussenden; »dich senden« bewahrt sowohl die Handlung als auch den Sendungscharakter, ohne zusätzliche Deutung.
theological_decisions:
- issue: Bedeutung von ἔθνη im Kontext der apostolischen Sendung
  choice: Nichtjuden
  alternative: Völker
  rationale: Der unmittelbare Zusammenhang in der Apostelgeschichte handelt von der Sendung des Paulus zu Menschen außerhalb Israels. »Nichtjuden« bewahrt diesen heilsgeschichtlichen und gesellschaftlichen Gegensatz, während »Völker« als echte lexikalische Alternative in der Fußnote genannt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und nachdrücklich; konfessionell geprägte Fachausdrücke werden vermieden.
