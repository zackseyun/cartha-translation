id: ACT.22.11
reference: Acts 22:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: de
  text: Und weil ich wegen des Glanzes jenes Lichtes[a] nicht sehen konnte, kam ich, von denen, die bei mir waren, an der Hand geführt, nach Damaskus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wegen der Herrlichkeit jenes Lichtes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: nicht sehen konnte
  rationale: Im Zusammenhang mit dem blendenden Licht bezeichnet das Imperfekt die anhaltende Unfähigkeit zu sehen, nicht nur die Unfähigkeit, das Licht anzublicken.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: wegen des Glanzes jenes Lichtes
  rationale: δόξα bezeichnet hier die sichtbare, blendende Ausstrahlung des Lichtes. „Glanz“ ist im Deutschen natürlich und bewahrt mehr von der Bedeutungsweite als das rein physikalische „Helligkeit“; die wörtlichere Alternative „Herrlichkeit“ wird in der Fußnote genannt.
- source_word: χειραγωγούμενος
  choice: an der Hand geführt
  rationale: Die Formulierung gibt die im Verb ausdrücklich enthaltene Handführung anschaulich und idiomatisch wieder.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: von denen, die bei mir waren
  rationale: Die transparente Wiedergabe bewahrt die relationale Formulierung des Griechischen, ohne die Gruppe näher zu bestimmen.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: kam … nach Damaskus
  rationale: Bei Städten ist „nach Damaskus kommen“ die natürliche deutsche Richtungsangabe und gibt die Bewegung zum Ziel angemessen wieder.
- source_word: ὡς δὲ
  choice: Und weil
  rationale: 'ὡς führt hier den Umstand mit kausaler Wirkung ein: Weil Paulus nicht sehen konnte, musste er an der Hand geführt werden; δέ setzt die Erzählung fort.'
theological_decisions:
- issue: Wiedergabe von δόξα in einem theophanischen Zusammenhang
  choice: Glanz
  alternative: Herrlichkeit; Helligkeit
  rationale: „Glanz“ bezeichnet hier die sichtbare Ausstrahlung, die Paulus blendete, ohne die mögliche theologische Resonanz von δόξα völlig auszublenden. Die formalere Wiedergabe „Herrlichkeit“ bleibt als Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Partizipialkonstruktion wird natürlich in den Satz eingebettet; „an der Hand geführt“ bewahrt das anschauliche Detail des griechischen Textes.
