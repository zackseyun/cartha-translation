translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzfolge ist im Deutschen geglättet, ohne Angaben des griechischen Textes auszulassen; die Wiederholung von »zu mir« bewahrt das ausdrückliche μοι.
