base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: de
  text: 'Er kam zu mir, trat neben mich und sagte zu mir: »Bruder Saul, werde wieder sehend!«[a] Noch in derselben Stunde wurde ich wieder sehend und blickte ihn an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier in beiden Vorkommen mit »wieder sehend werden« wiedergegebene griechische Verb kann auch »aufblicken« bedeuten. Der Zusammenhang von Blindheit und Heilung spricht hier für die Wiederherstellung des Sehvermögens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμὲ
  choice: Er kam zu mir
  rationale: Das finite deutsche Verb gibt das aoristische Partizip natürlich wieder und bewahrt die Bewegung hin zu Paulus.
- source_word: ἐπιστὰς
  choice: trat neben mich
  rationale: Das Partizip bezeichnet hier das Herantreten und Einnehmen eines Platzes bei Paulus; die dynamische Formulierung ist im Deutschen natürlicher als »neben mir stehend«.
- source_word: Σαοὺλ ἀδελφέ
  choice: Bruder Saul
  rationale: Der Vokativ wird als direkte, gemeinschaftliche Anrede wiedergegeben; der Name folgt der üblichen deutschen Form.
- source_word: ἀνάβλεψον
  choice: werde wieder sehend
  rationale: Im Zusammenhang von Sauls Blindheit bezeichnet das Verb die Wiederherstellung des Sehvermögens, nicht bloß ein Aufblicken.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: noch in derselben Stunde
  rationale: Die Formulierung bewahrt den ausdrücklichen Zeitbezug und vermittelt zugleich idiomatisch die Unmittelbarkeit des Geschehens.
- source_word: ἀνέβλεψα
  choice: wurde ich wieder sehend
  rationale: Die gleiche deutsche Wendung wie beim Imperativ bildet die Wiederholung des griechischen Verbs ab und passt zum Heilungskontext.
- source_word: εἰς αὐτόν
  choice: blickte ihn an
  rationale: Die Wiedergabe erhält die auf Ananias gerichtete Blickrichtung, statt nur festzustellen, dass Paulus ihn sah.
