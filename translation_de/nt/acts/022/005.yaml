source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: de
  text: 'Das können mir auch der Hohe Priester und der ganze Ältestenrat bezeugen: Von ihnen erhielt ich auch Briefe an die Brüder in Damaskus[a], und ich war auf dem Weg dorthin, um auch die, die dort waren, gefesselt nach Jerusalem zu bringen, damit sie bestraft würden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die Brüder und Schwestern“. Im Griechischen steht „Brüder“; in manchen Zusammenhängen kann damit eine größere Gemeinschaft gemeint sein.'
    reason: Lexikalische Alternative und möglicher inklusiver Bedeutungsumfang von ἀδελφοί.
lexical_decisions:
- source_word: ὡς καὶ
  choice: Wie … auch
  rationale: Leitet die bestätigende Berufung auf Zeugen ein und bewahrt die vergleichend-bekräftigende Funktion in natürlichem Deutsch.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohe Priester
  rationale: Die übliche deutsche Bezeichnung für das führende priesterliche Amt in diesem historischen Zusammenhang.
- source_word: μαρτυρεῖ μοι
  choice: mir … bezeugen können
  rationale: Gibt die verfügbare Bestätigung von Paulus’ Aussage idiomatisch wieder; der Dativ μοι wird mit „mir“ bewahrt.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: der gesamte Ältestenrat
  rationale: Bezeichnet das Gremium der Ältesten, nicht lediglich ältere Männer; „Ältestenrat“ ist klar und sachgerecht.
- source_word: παρ’ ὧν
  choice: Von ihnen
  rationale: Bezieht sich gemeinsam auf den Hohen Priester und den Ältestenrat und klingt im Deutschen natürlich.
- source_word: ἐπιστολὰς
  choice: Briefe
  rationale: Bewahrt die grundlegende lexikalische Bedeutung; der amtliche Charakter ergibt sich aus dem Zusammenhang.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: an die Brüder
  rationale: Gibt die maskuline Pluralform unmittelbar wieder. Die mögliche gemeinschaftsbezogene oder inklusive Bedeutung wird in der Fußnote offengehalten.
- source_word: εἰς Δαμασκὸν ἐπορευόμην
  choice: machte mich auf den Weg dorthin
  rationale: Gibt die begonnene und fortdauernde Bewegung nach Damaskus in natürlichem erzählerischem Deutsch wieder.
- source_word: ἄξων
  choice: um … zu bringen
  rationale: Der futurische Partizipialsatz bezeichnet hier den Zweck der Reise.
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: die dortigen Anhänger
  rationale: „Anhänger“ ergänzt nur das im Deutschen erforderliche Bezugswort für die substantivierte griechische Wendung; gemeint sind die dort befindlichen Angehörigen der verfolgten Gruppe.
- source_word: δεδεμένους
  choice: gefesselt
  rationale: Bewahrt den Zustand als Festgenommene, ohne eine bestimmte Art von Ketten vorauszusetzen.
- source_word: ἵνα τιμωρηθῶσιν
  choice: damit sie bestraft würden
  rationale: Gibt den beabsichtigten Strafvollzug klar wieder, ohne eine im Text nicht genannte Strafe festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern; Glaubensgeschwister; jüdische Volksgenossen
  rationale: Die männliche Form des Ausgangstextes bleibt im Haupttext sichtbar. Da ἀδελφοί je nach Kontext eine umfassendere Gemeinschaft bezeichnen kann und hier wahrscheinlich die Adressaten der amtlichen Schreiben in Damaskus meint, wird diese Offenheit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hoher Priester“ und „Ältestenrat“ sind historisch verständlich; die Satzführung bleibt nah am griechischen Gedankengang, ohne unnötig wörtlich zu wirken.
