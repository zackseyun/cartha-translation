revisions:
- from: Wie mir auch der Hohe Priester und der gesamte Ältestenrat bezeugen können. Von ihnen erhielt ich auch Briefe an die Brüder in Damaskus[a] und machte mich auf den Weg dorthin, um auch die dortigen Anhänger gefesselt nach Jerusalem zu bringen, damit sie bestraft würden.
  to: 'Das können mir auch der Hohe Priester und der ganze Ältestenrat bezeugen: Von ihnen erhielt ich auch Briefe an die Brüder in Damaskus[a], und ich war auf dem Weg dorthin, um auch die, die dort waren, gefesselt nach Jerusalem zu bringen, damit sie bestraft würden.'
  rationale: Die Revision vervollständigt den einleitenden deutschen Satz, ohne den rückverweisenden Charakter von ὡς καί zu verlieren. Sie entfernt die nicht im griechischen Wortlaut enthaltene Einengung „Anhänger“ und übersetzt τοὺς ἐκεῖσε ὄντας neutral. Die übrigen zentralen Begriffe und die Fußnotenverankerung bleiben erhalten.
