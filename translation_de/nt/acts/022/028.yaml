id: ACT.22.28
reference: Acts 22:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: de
  text: 'Der Tribun erwiderte: „Ich habe dieses Bürgerrecht für eine große Summe erworben.“ Paulus aber sagte: „Ich bin sogar als Bürger geboren.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich aber bin sogar geboren worden“; das Bürgerrecht ist aus dem Zusammenhang zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: Tribun
  rationale: Bezeichnet hier den römischen Militärtribunen, der eine größere Truppeneinheit befehligte; „Tribun“ ist historisch präzise und im Deutschen etabliert.
- source_word: πολλοῦ κεφαλαίου
  choice: für eine große Summe
  rationale: Die Genitivverbindung bezeichnet idiomatisch einen hohen Geldbetrag; die Formulierung ist natürlich und wahrt den finanziellen Sinn.
- source_word: πολιτείαν
  choice: Bürgerrecht
  rationale: Gemeint ist in diesem Zusammenhang der rechtliche Status des römischen Bürgers. „Bürgerrecht“ passt zum Erwerb dieses Status und ist im Deutschen idiomatisch.
- source_word: ἐκτησάμην
  choice: habe … erworben
  rationale: Das Medium bezeichnet das Erlangen für sich selbst. „Erworben“ bewahrt die Bedeutung, ohne den Vorgang über das im Satz genannte Entgelt hinaus als direkten Kauf festzulegen.
- source_word: καὶ γεγέννημαι
  choice: Ich bin sogar als Bürger geboren
  rationale: Das Perfekt bezeichnet einen durch Geburt bestehenden Status; „sogar“ gibt das kontrastierende καί wieder, und „als Bürger“ ergänzt das aus dem Kontext erschlossene Prädikativum.
- source_word: δέ
  choice: aber
  rationale: Bei Paulus markiert δέ den Gegensatz zwischen erworbenem und angeborenem Bürgerrecht; die erste Instanz wird natürlich durch „erwiderte“ in den Dialog eingebunden.
- source_word: ἔφη
  choice: sagte
  rationale: Schlichte und genaue Wiedergabe des neutralen Redeverbs ohne zusätzliche rhetorische Färbung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tribun“ bewahrt die historische Amtsbezeichnung; die Wiederholung von „aber“ wird auf die inhaltlich entscheidende Kontraststelle beschränkt. Der im Griechischen unausgesprochene Bezug auf das Bürgerrecht wird im Haupttext natürlich als „als Bürger“ ausgedrückt und in der Fußnote transparent gemacht.
