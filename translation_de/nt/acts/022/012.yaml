  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: de
  text: Ein gewisser Mann, Hananias, der nach dem Gesetz fromm war und bei allen dort lebenden Juden[a] in gutem Ruf stand,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Judäern«, wenn die Bezeichnung ethnisch-geografisch und nicht religiös-gemeinschaftlich verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: Hananias
  rationale: Der Personenname wird in der im Deutschen bibelsprachlich etablierten Form wiedergegeben.
- source_word: δέ
  choice: unmarkiert
  rationale: Die schwache fortführende beziehungsweise leicht kontrastierende Funktion ergibt sich im Deutschen natürlich aus dem Zusammenhang; ein ausdrückliches »aber« würde hier zu stark wirken.
- source_word: τις ἀνὴρ
  choice: ein Mann namens Hananias
  rationale: Die Wendung führt einen bestimmten, bisher nicht genannten Mann ein. Die natürliche deutsche Konstruktion mit »namens« bewahrt diese Funktion, ohne das schwerfällige »ein gewisser Mann«.
- source_word: εὐλαβής
  choice: fromm
  rationale: »Fromm« bezeichnet hier verständlich und würdig religiöse Ehrfurcht und gewissenhafte Lebensführung.
- source_word: κατὰ τὸν νόμον
  choice: nach dem Gesetz
  rationale: Die Formulierung bindet seine Frömmigkeit ausdrücklich an das jüdische Gesetz und bleibt nahe am Griechischen.
- source_word: μαρτυρούμενος
  choice: in gutem Ruf stand
  rationale: Das passive Partizip bezeichnet das positive Zeugnis anderer über Hananias; diese idiomatische Wiedergabe erfasst den öffentlichen guten Leumund.
- source_word: ὑπὸ πάντων
  choice: bei allen
  rationale: In Verbindung mit »in gutem Ruf stehen« gibt »bei allen« die umfassende Gruppe der Zeugnisgebenden natürlich wieder.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: allen dort lebenden Juden
  rationale: Das Partizip bezeichnet die am aus dem Kontext bekannten Ort ansässige jüdische Bevölkerung; »dort« macht den im Deutschen benötigten Ortsbezug deutlich.
theological_decisions:
- issue: Bedeutung von Ἰουδαίων
  choice: Juden
  alternative: Judäer
  rationale: Gemeint ist hier die jüdische Bevölkerung von Damaskus als religiös-ethnische Gemeinschaft, nicht vorrangig eine Herkunft aus der Landschaft Judäa. Die alternative ethnisch-geografische Nuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzform bleibt als Teilsatz offen, entsprechend dem Versanschluss im Kontext.
