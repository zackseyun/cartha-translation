id: ACT.22.7
reference: Acts 22:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: de
  text: 'Ich fiel zu Boden und hörte eine Stimme, die zu mir sagte: »Saul, Saul, warum verfolgst du mich?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: Ich fiel
  rationale: Der Aorist Aktiv Indikativ, 1. Person Singular von πίπτω, bezeichnet ein abgeschlossenes Geschehen und wird im Deutschen natürlich mit dem Präteritum wiedergegeben.
- source_word: τε
  choice: nicht gesondert wiedergegeben
  rationale: Die enklitische Partikel verbindet den Satz mit dem vorhergehenden Zusammenhang; im Deutschen wird diese Verknüpfung durch den Erzählfluss und das folgende »und« ausreichend ausgedrückt.
- source_word: εἰς τὸ ἔδαφος
  choice: zu Boden
  rationale: Dies ist die natürliche deutsche Wendung für das Fallen auf den Erdboden; »auf die Erde« wäre hier weniger idiomatisch.
- source_word: ἤκουσα
  choice: hörte
  rationale: Der Aorist Aktiv Indikativ von ἀκούω wird als abgeschlossenes Ereignis im Präteritum wiedergegeben.
- source_word: φωνῆς
  choice: eine Stimme
  rationale: Der Genitiv nach ἀκούω wird im Deutschen idiomatisch als Akkusativobjekt übersetzt. Da die Stimme anschließend spricht, ist »Stimme« präziser als das allgemeinere »Laut«.
- source_word: λεγούσης μοι
  choice: die zu mir sagte
  rationale: Das präsentische Partizip bezieht sich auf »Stimme« und bezeichnet gleichzeitiges Sprechen; der Dativ μοι wird ausdrücklich durch »zu mir« bewahrt.
- source_word: Σαοὺλ Σαούλ
  choice: Saul, Saul
  rationale: Der Personenname und seine emphatische Wiederholung in der direkten Anrede werden bewahrt.
- source_word: τί
  choice: warum
  rationale: τί fragt in Verbindung mit einer Handlung idiomatisch nach deren Grund und wird daher natürlich mit »warum« übersetzt.
- source_word: με
  choice: mich
  rationale: Das direkte Objekt in der ersten Person wird ohne erklärende Erweiterung wiedergegeben.
- source_word: διώκεις
  choice: verfolgst du
  rationale: διώκω bezeichnet in diesem feindseligen Zusammenhang das Verfolgen beziehungsweise Verfolgenlassen von Menschen. Das deutsche Präsens bewahrt die laufende Handlung und ist in der Frage idiomatisch.
theological_decisions:
- issue: Beziehung des Sprechers zu Sauls Vorgehen gegen die Glaubenden
  choice: Das unmittelbare »mich« bleibt ohne erklärende Erweiterung stehen.
  alternative: Deutende Umschreibungen wie »meine Leute« oder »meine Anhänger«.
  rationale: Die theologische Spannung liegt gerade darin, dass der Sprecher Sauls Verfolgung der Glaubenden als Verfolgung seiner selbst bezeichnet. Diese Aussage darf weder abgeschwächt noch erklärend aufgelöst werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist knapp und eindringlich; die Wiederholung des Namens bleibt erhalten.
