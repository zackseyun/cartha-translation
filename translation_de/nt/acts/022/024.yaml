id: ACT.22.24
reference: Acts 22:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: de
  text: Der Tribun befahl, ihn in die Kaserne[a] zu bringen, und ordnete an, ihn unter Geißelhieben zu verhören[b], um herauszufinden, weshalb sie so gegen ihn schrien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »in das Lager« oder »in die Festung«. Gemeint sind hier die römischen Militärquartiere in Jerusalem.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich etwa: »ihn durch Geißelhiebe untersuchen«. Das Griechische verbindet die Untersuchung ausdrücklich mit dem Auspeitschen als Verhörmethode.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: Tribun
  rationale: Der Ausdruck bezeichnet hier einen ranghohen römischen Offizier. »Tribun« ist historisch präzise und im Deutschen verständlich.
- source_word: παρεμβολή
  choice: Kaserne
  rationale: Im Jerusalemer Zusammenhang sind die römischen Militärquartiere, wohl im Bereich der Festung Antonia, gemeint. »Kaserne« gibt die Funktion natürlich wieder.
- source_word: εἰσάγεσθαι
  choice: hineinzubringen
  rationale: Der passive Infinitiv zeigt, dass Paulus von anderen ins Innere gebracht werden sollte.
- source_word: εἴπας
  choice: und ordnete an
  rationale: Das Partizip führt eine weitere Anweisung des Tribuns ein. Die koordinierte Formulierung ist im modernen Deutschen klar und wahrt den Befehlscharakter.
- source_word: μάστιξιν
  choice: unter Geißelhieben
  rationale: Der Dativ bezeichnet das Mittel des Verhörs; die Pluralform verweist auf die Schläge mit einer Geißel. Die Formulierung macht die gewaltsame Methode ausdrücklich.
- source_word: ἀνετάζεσθαι
  choice: zu verhören
  rationale: Das Verb bezeichnet eine Untersuchung oder Befragung. In Verbindung mit Geißelhieben ist »verhören« im Deutschen natürlich, ohne die ausdrücklich genannte Foltermethode abzuschwächen.
- source_word: ἐπιγνῷ
  choice: um herauszufinden
  rationale: Der Zwecksatz beschreibt das Ziel des Tribuns, den Grund für den Aufruhr zu ermitteln.
- source_word: δι’ ἣν αἰτίαν
  choice: weshalb
  rationale: Die Wendung fragt nach dem Grund. »Weshalb« ist prägnant und führt keinen förmlichen juristischen Anklagepunkt ein.
- source_word: οὕτως
  choice: so
  rationale: Das Adverb bewahrt knapp den Bezug auf die Art oder Heftigkeit des Geschreis.
- source_word: ἐπεφώνουν αὐτῷ
  choice: sie so gegen ihn schrien
  rationale: Der Imperfekt beschreibt das anhaltende Geschrei; »gegen ihn« bringt dessen feindselige Ausrichtung zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die historisch präzise Amtsbezeichnung »Tribun« bleibt erhalten; die Gewaltsamkeit des angeordneten Verhörs wird weder verhüllt noch ausgeschmückt.
