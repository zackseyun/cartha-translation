id: ACT.22.14
reference: Acts 22:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: de
  text: 'Er aber sagte: »Der Gott unserer Väter hat dich dazu bestimmt[a], seinen Willen zu erkennen, den Gerechten[b] zu sehen und eine Stimme aus seinem Mund zu hören.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat dich ausgewählt«. Das griechische Verb kann die Auswahl oder Bestimmung für einen Auftrag bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Der Gerechte« ist hier ein Titel für Jesus. Das griechische Wort kann auch »rechtschaffen« bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: hat dich dazu bestimmt
  rationale: Das Verb bezeichnet hier die Auswahl beziehungsweise Bestimmung einer Person für einen Auftrag. »Dazu bestimmt« verbindet diese Bedeutung natürlich mit den folgenden Infinitiven, ohne eine zeitliche Vorherbestimmung ausdrücklich in den Text einzutragen.
- source_word: γνῶναι
  choice: zu erkennen
  rationale: Das deutsche »erkennen« gibt γινώσκω in diesem Zusammenhang natürlich wieder und kann sowohl das Erlangen als auch den Besitz von Erkenntnis umfassen.
- source_word: τὸ θέλημα αὐτοῦ
  choice: seinen Willen
  rationale: »Wille« bewahrt die übliche und breite Bedeutung von θέλημα, ohne sie auf »Plan« oder »Absicht« zu verengen.
- source_word: ἰδεῖν
  choice: zu sehen
  rationale: »Sehen« ist die klare, gegenwärtige Entsprechung und vermeidet das unnötig gehobene »schauen«.
- source_word: τὸν δίκαιον
  choice: den Gerechten
  rationale: Der substantivierte Ausdruck erscheint in der Apostelgeschichte als Bezeichnung für Jesus. »Der Gerechte« bewahrt sowohl den Titelcharakter als auch die Bedeutung von δίκαιος.
- source_word: ἀκοῦσαι φωνὴν
  choice: eine Stimme zu hören
  rationale: Das artikellose φωνή wird angemessen unbestimmt wiedergegeben. Der Zusatz »aus seinem Mund« zeigt, dass verständliche Rede und nicht bloß ein Geräusch gemeint ist.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: aus seinem Mund
  rationale: Die konkrete Ausdrucksweise des Griechischen wird bewahrt und hebt das unmittelbare Reden hervor.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Der Gott unserer Väter
  rationale: Die Formulierung bewahrt den ausdrücklich maskulinen, bundestheologisch geprägten Ausdruck und die Verbindung mit Israels Vätern.
theological_decisions:
- issue: Ob τὸν δίκαιον als christologischer Titel oder nur als beschreibendes Adjektiv wiederzugeben ist
  choice: Als Titel »der Gerechte« für Jesus wiedergegeben
  alternative: »der gerechte Mann« oder unmarkiert »der Gerechte« lediglich beschreibend verstehen
  rationale: Die parallele Verwendung in Apostelgeschichte 3,14 und 7,52 stützt den Titelcharakter. Die deutsche Substantivierung bewahrt ihn, ohne zusätzliche Identifikation in den Haupttext einzufügen.
- issue: Ob »unsere Väter« geschlechtsneutral als »unsere Vorfahren« wiederzugeben ist
  choice: »unsere Väter« beibehalten
  alternative: »unsere Vorfahren«
  rationale: πατέρων bezeichnet ausdrücklich die Väter und gehört hier zu einer festen, heilsgeschichtlich geprägten Wendung. »Vorfahren« wäre verständlich, würde jedoch die Formulierung verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der dreifachen Infinitivreihe des griechischen Textes. »Aus seinem Mund« bleibt als anschauliche, im Deutschen verständliche Wendung erhalten.
