    issue: προέτειναν ... τοῖς ἱμᾶσιν ist als »mit den Riemen festbanden« wiedergegeben.
    rationale: Das Verb bezeichnet hier das Ausstrecken beziehungsweise Ausspannen als Vorbereitung der Auspeitschung. Reines Festbinden gibt diesen Bestandteil nicht hinreichend wieder.
  - severity: low
    issue: ἀκατάκριτον ist mit »ohne Urteil« wiedergegeben.
    rationale: Die Formulierung ist verständlich, aber »ohne vorher verurteilt worden zu sein« stellt genauer klar, dass das Fehlen einer gerichtlichen Verurteilung gemeint ist, nicht allgemein das Fehlen irgendeines Urteils.
