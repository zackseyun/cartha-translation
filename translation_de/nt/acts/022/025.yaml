source:
  edition: SBLGNT
  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: de
  text: 'Als sie ihn aber mit Riemen zum Auspeitschen ausspannten, sagte Paulus zu dem Hauptmann, der dabeistand: »Dürft ihr einen römischen Bürger auspeitschen, ohne dass er vorher verurteilt worden ist?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: mit den Riemen festbanden
  rationale: Die Wendung bezeichnet das Festbinden beziehungsweise Ausspannen zur bevorstehenden Geißelung. »Mit den Riemen festbanden« gibt Vorbereitung und Mittel natürlich wieder, ohne den Vorgang unnötig auszumalen.
- source_word: ἑστῶτα
  choice: der dabeistand
  rationale: Das Partizip beschreibt den in unmittelbarer Nähe stehenden Hauptmann; »dabeistand« ist knapp und idiomatisch.
- source_word: ἑκατόνταρχον
  choice: Hauptmann
  rationale: »Hauptmann« ist die im deutschen Bibel- und Allgemeinwortschatz etablierte Bezeichnung für den römischen centurio.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: einen römischen Bürger
  rationale: Wörtlich steht »einen römischen Menschen/Mann«; im rechtlichen Zusammenhang bezeichnet Ῥωμαῖον jedoch den geschützten Status des römischen Bürgers. Die deutsche Wiedergabe macht den für die Frage entscheidenden Rechtsstatus klar.
- source_word: ἀκατάκριτον
  choice: ohne Urteil
  rationale: Das Wort bezeichnet jemanden, über den kein verurteilendes Gerichtsurteil ergangen ist. »Ohne Urteil« ist im Deutschen prägnant und rechtlich verständlich.
- source_word: ἔξεστιν ὑμῖν
  choice: Dürft ihr
  rationale: Die Formulierung fragt nach der rechtlichen Zulässigkeit. »Dürft ihr« klingt natürlich und bewahrt den juridischen Sinn.
- source_word: μαστίζειν
  choice: auspeitschen
  rationale: Das Verb bezeichnet eine schwere körperliche Züchtigung durch Schläge mit einer Peitsche; »auspeitschen« ist modern, klar und ausreichend stark.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und rechtlich zugespitzt. »Noch dazu« gibt die koordinierende Kraft von καὶ vor ἀκατάκριτον idiomatisch wieder: Nicht nur sein römisches Bürgerrecht, sondern zusätzlich das fehlende Urteil verschärft den Einwand.'
