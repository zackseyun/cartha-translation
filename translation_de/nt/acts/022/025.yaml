  to: 'Als sie ihn aber mit Riemen zum Auspeitschen ausspannten, sagte Paulus zu dem Hauptmann, der dabeistand: »Dürft ihr einen römischen Bürger auspeitschen, ohne dass er vorher verurteilt worden ist?«'
