review_pass:
  verdict: revise
  source_fidelity: Die rechtliche Zuspitzung mit »römischen Bürger«, die Frage nach der Zulässigkeit und die nicht erfolgte Verurteilung sind zutreffend wiedergegeben. »Mit den Riemen festbanden« reduziert προέτειναν jedoch auf das Binden und lässt das Ausstrecken/Ausspannen für die Geißelung unberücksichtigt.
  naturalness: Die vorgeschlagene Fassung ist modernes, klares Standarddeutsch. »Mit Riemen zum Auspeitschen ausspannten« ist idiomatisch genug und benennt den im griechischen Ausdruck enthaltenen Vorgang präziser.
  terminology: »Hauptmann« ist als etablierte deutsche Bezeichnung für ἑκατόνταρχος akzeptabel. »Römischer Bürger« gibt im Rechtskontext den Sinn von ἄνθρωπον Ῥωμαῖον angemessen wieder. »Auspeitschen« und »nicht verurteilt« sind sachlich und rechtlich klar.
  issues:
