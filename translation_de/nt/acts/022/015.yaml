  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: de
  text: Denn du wirst für ihn[a] vor allen Menschen ein Zeuge dessen sein, was du gesehen und gehört hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Zeuge“. Der griechische Dativ kann hier in mehreren eng verwandten Bedeutungen verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι leitet hier die Begründung beziehungsweise Erläuterung des vorausgehenden Auftrags ein; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: ἔσῃ
  choice: du wirst … sein
  rationale: Die Futurform von εἰμί wird als schlichtes deutsches Futur wiedergegeben.
- source_word: μάρτυς
  choice: ein Zeuge
  rationale: μάρτυς bezeichnet jemanden, der aufgrund eigener Wahrnehmung Zeugnis ablegt; der unbestimmte Artikel ist im Deutschen idiomatisch erforderlich.
- source_word: αὐτῷ
  choice: für ihn
  rationale: Der Dativ bezeichnet wahrscheinlich denjenigen, für den beziehungsweise in dessen Sache Paulus Zeugnis ablegen wird. „Für ihn“ ist im Deutschen verständlich, ohne den Bezug über das im Kontext Gegebene hinaus zu bestimmen.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: vor allen Menschen
  rationale: πρός mit Akkusativ bezeichnet hier die Menschen, denen gegenüber das Zeugnis abgelegt wird. „Vor allen Menschen“ ist in Verbindung mit „Zeuge sein“ natürlich und bewahrt die öffentliche Ausrichtung; ἀνθρώπους meint Menschen allgemein.
- source_word: ὧν
  choice: dessen, was
  rationale: Der Genitiv des Relativpronomens bezeichnet den Inhalt des Zeugnisses. Die deutsche Verbindung „Zeuge dessen, was“ bildet dies präzise und würdig ab.
- source_word: ἑώρακας
  choice: du gesehen hast
  rationale: Das griechische Perfekt verweist auf die fortwirkende Bedeutung des Gesehenen; im deutschen Nebensatz ist das Perfekt die natürliche Entsprechung.
- source_word: καὶ ἤκουσας
  choice: und gehört hast
  rationale: Der Aorist wird zusammen mit dem vorausgehenden Perfekt als Teil der eigenen Erfahrung wiedergegeben; die koordinierte deutsche Perfektform ist idiomatisch.
theological_decisions:
- issue: Funktion und Bezug von αὐτῷ im Auftrag an Paulus
  choice: '„für ihn“: Paulus soll für den Herrn beziehungsweise Jesus Zeugnis ablegen.'
  alternative: '„ihm“: Der Dativ kann enger und formal neutraler wiedergegeben werden, ohne ausdrücklich eine Stellvertretungs- oder Vorteilsbedeutung auszudrücken.'
  rationale: Der unmittelbare Kontext legt nahe, dass der Herr beziehungsweise Jesus derjenige ist, für den Paulus vor anderen Zeugnis ablegt. Da der griechische Dativ jedoch mehrere eng verwandte Funktionen zulässt, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Zeuge dessen“ ist leicht gehoben, bildet aber die griechische Inhaltsangabe präzise und knapp ab. „Menschen“ gibt den generischen Sinn von ἀνθρώπους ohne geschlechtliche Verengung wieder.
