  terminology: „Herr“ bewahrt die im Kontext beabsichtigte christologische Gewichtung von κύριος. „Bestimmt“ gibt τέτακται angemessen als bereits bestehende Festlegung wieder, ohne den nicht ausdrücklich genannten Handelnden oder ein weitergehendes theologisches System festzulegen. Die Fußnote bietet mit „aufgetragen“ eine legitime, etwas stärker direktive Alternative.
