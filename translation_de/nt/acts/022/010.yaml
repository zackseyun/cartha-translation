  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zuverlässig wieder: die deliberative Frage Τί ποιήσω, die Anrede und Identifikation als κύριος, die zweigliedrige Aufforderung Ἀναστὰς πορεύου, das Ziel Damaskus, die ungenannte passive Mitteilung an Paulus sowie den umfassenden und bereits festgesetzten Charakter von τέτακταί σοι ποιῆσαι. „Nach Damaskus“ ist bei einem Stadtnamen idiomatisch und ohne relevanten Bedeutungsverlust.'
