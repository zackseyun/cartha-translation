id: ACT.22.10
reference: Acts 22:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: de
  text: 'Da sagte ich: »Was soll ich tun, Herr?« Der Herr antwortete mir: »Steh auf und geh nach Damaskus. Dort wird dir alles gesagt werden, was dir zu tun bestimmt ist.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was dir zu tun aufgetragen ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: Was soll ich tun
  rationale: Der deliberative Aorist Konjunktiv bittet um Weisung für das weitere Handeln. „Was soll ich tun?“ gibt dies im heutigen Deutsch natürlich und präzise wieder.
- source_word: κύριε / ὁ ... κύριος
  choice: Herr / der Herr
  rationale: In der erzählten Begegnung auf dem Weg nach Damaskus bezeichnet κύριος Jesus. „Herr“ bewahrt den christologischen Gehalt, ohne ihn weiter auszudeuten.
- source_word: Ἀναστὰς πορεύου
  choice: Steh auf und geh
  rationale: Das Partizip Ἀναστὰς bildet mit dem Imperativ eine Handlungsfolge. Die koordinierte deutsche Form ist natürlich und erhält beide Aufforderungen.
- source_word: εἰς Δαμασκόν
  choice: nach Damaskus
  rationale: Bei Städten ist „nach“ die natürliche deutsche Wiedergabe einer gerichteten Bewegung; der Gedanke des Hineingehens muss hier nicht eigens markiert werden.
- source_word: κἀκεῖ σοι λαληθήσεται
  choice: Dort wird dir ... gesagt werden
  rationale: Die passive Form mit σοι wird im Deutschen ebenso passiv und ohne genannten Sprecher wiedergegeben. Damit bleibt offen, durch wen Paulus die Weisung erhalten wird.
- source_word: περὶ πάντων ὧν τέτακταί σοι ποιῆσαι
  choice: alles ..., was dir zu tun bestimmt ist
  rationale: Die Formulierung gibt den umfassenden Inhalt von πάντων wieder und bewahrt beim Perfekt Passiv τέτακται den Gedanken einer bereits festgelegten, weiterhin geltenden Aufgabe, ohne den unausgesprochenen Handelnden zu benennen.
theological_decisions:
- issue: Tragweite von τέτακται für göttliche Bestimmung und Berufung
  choice: was dir zu tun bestimmt ist
  alternative: was dir zu tun aufgetragen ist
  rationale: „Bestimmt“ bewahrt die passive Aussage, dass Paulus’ künftige Aufgaben bereits festgelegt sind, ohne eine bestimmte Prädestinationslehre einzutragen. „Aufgetragen“ wäre stärker auf einen ausdrücklichen Befehl eingeengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich natürlich; das Passiv im letzten Satz bewahrt die im Griechischen nicht ausdrücklich genannte handelnde Instanz.
