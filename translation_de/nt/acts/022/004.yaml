id: ACT.22.4
reference: Acts 22:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: de
  text: Ich verfolgte diesen Weg[a] bis zum Tod[b], indem ich sowohl Männer als auch Frauen fesselte und in Gefängnisse einlieferte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „diesen Weg“. In der Apostelgeschichte dient „der Weg“ wiederholt als Bezeichnung für die christliche Bewegung.
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann Verfolgung bis hin zum Tod oder mit tödlichen Folgen bezeichnen. Sie legt nicht fest, auf welche Weise diese tödliche Reichweite zustande kam.
    reason: lexical_clarification
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: diesen Weg
  rationale: ὁδός bedeutet wörtlich „Weg“ und dient in der Apostelgeschichte zugleich als Bezeichnung für die christliche Bewegung. Die wörtliche Wiedergabe bewahrt beide Ebenen.
- source_word: ἐδίωξα
  choice: ich verfolgte
  rationale: διώκω bezeichnet hier feindselige Verfolgung. „Verfolgte“ gibt den Zusammenhang klar und idiomatisch wieder.
- source_word: ἄχρι θανάτου
  choice: bis zum Tod
  rationale: Die Wendung bezeichnet die tödliche Reichweite beziehungsweise äußerste Härte der Verfolgung, ohne ausdrücklich festzulegen, dass Paulus selbst Menschen tötete.
- source_word: δεσμεύων
  choice: indem ich … fesselte
  rationale: Die konkrete Bedeutung des Partizips („binden, fesseln“) bleibt erhalten; die deutsche Nebensatzkonstruktion gibt den begleitenden Vorgang natürlich wieder.
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: in Gefängnisse einlieferte
  rationale: Die Formulierung bringt das Übergeben in staatlichen Gewahrsam idiomatisch zum Ausdruck und bewahrt den Plural φυλακάς.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: Männer wie Frauen
  rationale: Die Wendung schließt beide Gruppen ausdrücklich ein und gibt die rhetorische Spannweite knapp und natürlich wieder.
theological_decisions:
- issue: ὁδός als gewöhnliches Substantiv oder Bezeichnung der christlichen Bewegung
  choice: „diesen Weg“ im Haupttext, mit erläuternder Fußnote
  alternative: „diese Bewegung“ oder „diesen neuen Glaubensweg“
  rationale: In der Apostelgeschichte bezeichnet „der Weg“ wiederholt die christliche Glaubensbewegung. Die wörtliche Form vermeidet eine konfessionell oder institutionell engere Festlegung.
- issue: Reichweite von ἄχρι θανάτου
  choice: „bis zum Tod“
  alternative: „bis aufs Blut“ oder „mit tödlicher Härte“
  rationale: 'Die knappe Form bewahrt die Spannung des griechischen Ausdrucks: Gemeint ist Verfolgung bis hin zu tödlichen Folgen, ohne Paulus in diesem Satz ausdrücklich als unmittelbaren Täter von Tötungen zu bezeichnen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipien werden durch einen natürlichen „indem“-Satz wiedergegeben; die konkrete Bildsprache des Fesselns und der Plural „Gefängnisse“ bleiben erhalten.
