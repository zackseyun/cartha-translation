source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: de
  text: Ihr Männer, Brüder und Väter, hört jetzt meine Verteidigung an, die ich vor euch vorbringe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Hört jetzt meine Verteidigungsrede an, die ich an euch richte.'
    reason: „Verteidigungsrede“ gibt ἀπολογία als förmliche Rede expliziter wieder; „an euch richte“ macht den Bezug von πρὸς ὑμᾶς deutlich.
lexical_decisions:
- source_word: Ἄνδρες
  choice: Ihr Männer
  rationale: Der Vokativ redet die männlichen Zuhörer ausdrücklich an. „Ihr Männer“ ist im Deutschen eine natürliche Form der direkten Anrede und bewahrt die Geschlechtsangabe des griechischen Ausdrucks.
- source_word: ἀδελφοὶ
  choice: Brüder
  rationale: In der Anrede bezeichnet der Ausdruck die männlichen Volks- und Glaubensgenossen. „Brüder“ gibt die Form knapp und ohne zusätzliche Deutung wieder.
- source_word: πατέρες
  choice: Väter
  rationale: Der Ausdruck ehrt die älteren oder angesehenen Männer unter den Zuhörern. „Väter“ erhält das Bild der respektvollen Anrede, ohne daraus ein formelles Ältestenamt abzuleiten.
- source_word: ἀκούσατέ
  choice: hört
  rationale: Der Imperativ fordert die Zuhörer unmittelbar zum aufmerksamen Anhören auf. „Hört“ entspricht dem feierlichen Ton einer öffentlichen Rede.
- source_word: ἀπολογίας
  choice: was ich zu meiner Verteidigung … sage
  rationale: ἀπολογία meint hier eine Verteidigung beziehungsweise Verteidigungsrede, nicht eine Entschuldigung. Die deutsche Satzform gibt den Sinn natürlich wieder und verbindet die Verteidigung klar mit dem folgenden Sprechen.
- source_word: πρὸς ὑμᾶς
  choice: vor euch
  rationale: Die Wendung bezeichnet die Zuhörer, an die Paulus seine Verteidigung richtet. „Vor euch“ passt idiomatisch zur öffentlichen Verteidigungsrede und bewahrt den relationalen Bezug.
- source_word: νυνὶ
  choice: jetzt
  rationale: „Jetzt“ gibt die betonte zeitliche Unmittelbarkeit von νυνί in heutigem Standarddeutsch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle öffentliche Rede. Die ungewöhnliche dreigliedrige Anrede „Ihr Männer, Brüder und Väter“ bleibt bewusst erhalten; die Satzkonstruktion wird dagegen für verständliches heutiges Deutsch idiomatisch entfaltet.
