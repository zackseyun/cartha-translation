source:
  edition: SBLGNT
  text: Ἤκουον δὲ αὐτοῦ ἄχρι τούτου τοῦ λόγου καὶ ἐπῆραν τὴν φωνὴν αὐτῶν λέγοντες· Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον, οὐ γὰρ καθῆκεν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: de
  text: 'Sie hörten ihm bis zu dieser Äußerung zu; dann erhoben sie ihre Stimmen und riefen: »Weg mit einem solchen Menschen von der Erde![a] Denn es gehört sich nicht, dass er lebt![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Forderung zielt darauf, ihn zu töten. Auch möglich: »Schafft einen solchen Menschen von der Erde weg!«'
    reason: Die räumlich formulierte griechische Wendung meint im Zusammenhang seine Beseitigung aus dem Bereich der Lebenden.
  - marker: b
    text: 'Auch möglich: »Denn er sollte nicht leben.«'
    reason: καθῆκεν bezeichnet, was angemessen oder gehörig ist; die Formulierung ist keine bloße Aussage über rechtliche Erlaubnis.
lexical_decisions:
- source_word: Ἤκουον
  choice: Sie hörten ihm … zu
  rationale: Das Imperfekt bezeichnet das bis zu diesem Punkt andauernde Zuhören; die deutsche Wendung mit »bis zu« vermittelt diesen Verlauf natürlich.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: bis zu dieser Äußerung
  rationale: λόγος bezeichnet hier die konkrete Aussage beziehungsweise den Punkt in der Rede, der den Aufruhr auslöst, nicht bloß ein einzelnes Wort.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: Dann erhoben sie ihre Stimmen
  rationale: Die Formulierung bewahrt das griechische Bild des Erhebens der Stimme und gibt den Wechsel zum lauten Protest wieder. »Dann« drückt den erzählerischen Anschluss natürlich aus.
- source_word: λέγοντες
  choice: und riefen
  rationale: Im Kontext lauter, gemeinsamer Stimmen gibt »riefen« die Funktion des Partizips natürlicher wieder als das neutrale »sagten«.
- source_word: Αἶρε … τὸν τοιοῦτον
  choice: Weg mit so einem
  rationale: Die knappe deutsche Ausrufform entspricht dem feindseligen Befehl, diesen Menschen zu beseitigen, und erhält den verächtlichen Ton von τὸν τοιοῦτον.
- source_word: ἀπὸ τῆς γῆς
  choice: von der Erde
  rationale: Die ungewöhnlich starke Wendung bleibt nah am Griechischen und macht deutlich, dass nicht nur Entfernung aus der Versammlung, sondern Beseitigung aus dem Bereich der Lebenden verlangt wird.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: Denn er darf nicht leben
  rationale: καθήκω bezeichnet, was sich gehört, angemessen oder zulässig ist. Die deutsche Formulierung gibt die normative Aussage und ihre im Kontext tödliche Forderung knapp und idiomatisch wieder.
theological_decisions:
- issue: Stärke der Todesforderung
  choice: Die Aussage wird als ausdrückliche Forderung nach seinem Tod wiedergegeben.
  alternative: Bloße Aufforderung, Paulus aus dem Land oder aus der Versammlung zu entfernen.
  rationale: Die Verbindung von »von der Erde« mit »er darf nicht leben« zeigt, dass die Menge seine Tötung fordert; dies ergibt sich aus dem Text selbst und ist keine konfessionelle Deutung.
- issue: Normative Bedeutung von καθῆκεν
  choice: »er darf nicht leben«
  alternative: »es gehörte sich nicht, dass er lebte« / »er hätte nicht leben dürfen«
  rationale: Die Hauptfassung wahrt den Sinn des Angemessenen beziehungsweise Zulässigen, ohne eine Begründung wie Schuld oder Verdienst hinzuzufügen. Die formnähere Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Der Ausruf der Menge ist bewusst knapp und scharf. Die ungewöhnliche Wendung »von der Erde« bleibt erhalten, während Fußnoten ihre Bedeutung und die formnähere Alternative erläutern.
