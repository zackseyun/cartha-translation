id: ACT.22.18
reference: Acts 22:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: de
  text: 'und ich sah ihn, wie er zu mir sagte: »Beeil dich und geh schnell aus Jerusalem hinaus, denn sie werden dein Zeugnis über mich nicht annehmen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν
  choice: ich sah
  rationale: Der Infinitiv setzt in der griechischen Erzählkonstruktion den Bericht über die Vision fort. Im Deutschen gibt eine finite Form den Zusammenhang natürlich wieder.
- source_word: αὐτὸν λέγοντά μοι
  choice: ihn, wie er zu mir sagte
  rationale: Die Formulierung bewahrt das Pronomen und gibt das auf αὐτόν bezogene Partizip in natürlichem Deutsch wieder.
- source_word: Σπεῦσον
  choice: Beeil dich
  rationale: Der Aoristimperativ drückt unmittelbare Dringlichkeit aus; die gewählte Form ist modern und eindringlich.
- source_word: ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ
  choice: geh schnell aus Jerusalem hinaus
  rationale: Die Wiedergabe erhält sowohl den Befehl zum Verlassen als auch die durch ἐν τάχει verstärkte Eile und die gerichtete Bewegung aus der Stadt heraus.
- source_word: διότι
  choice: denn
  rationale: Die Konjunktion führt die Begründung des Befehls ein; »denn« verbindet direkte Rede im Deutschen flüssig und klar.
- source_word: οὐ παραδέξονταί
  choice: sie werden … nicht annehmen
  rationale: παραδέχομαι bezeichnet hier das zustimmende Annehmen oder Geltenlassen des Zeugnisses.
- source_word: σου μαρτυρίαν περὶ ἐμοῦ
  choice: dein Zeugnis über mich
  rationale: »Zeugnis« bewahrt den bezeugenden und verkündigenden Sinn von μαρτυρία; περί mit Genitiv bezeichnet den Gegenstand dieses Zeugnisses.
theological_decisions:
- issue: Bezug des Pronomens αὐτόν
  choice: Das Pronomen wird als »ihn« beibehalten.
  alternative: Den Bezug durch »den Herrn« oder »Jesus« ausdrücklich benennen.
  rationale: Der vorausgehende Kontext macht den Sprecher erkennbar, doch der griechische Vers selbst verwendet ein Pronomen. Die Übersetzung vermeidet daher eine erklärende Ergänzung im Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Dringlichkeit von Σπεῦσον und ἐν τάχει bleibt durch »Beeil dich« und »schnell« erhalten. Das einleitende »und« wahrt den Anschluss an den vorausgehenden Satz.
