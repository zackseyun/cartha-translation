source:
  edition: SBLGNT
  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: de
  text: 'Da trat der Militärtribun[a] zu ihm und sagte: »Sag mir: Bist du römischer Bürger?« Er antwortete: »Ja.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kommandant«. Das griechische Wort bezeichnet einen römischen Offizier, der gewöhnlich eine Kohorte befehligte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: trat … zu ihm
  rationale: Das Aoristpartizip bezeichnet die Annäherung vor dem Sprechen; die deutsche Erzählform gibt die Handlung natürlich und präzise wieder.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter und bezeichnet keinen starken Gegensatz. »Da« ist in diesem Zusammenhang ein natürlicher narrativer Anschluss.
- source_word: χιλίαρχος
  choice: Militärtribun
  rationale: Der Ausdruck bezeichnet hier den römischen Offizier, der eine Kohorte befehligte. »Militärtribun« ist historisch präziser als das allgemeinere »Kommandant«.
- source_word: εἶπεν αὐτῷ
  choice: fragte
  rationale: Da unmittelbar eine Frage folgt, gibt »fragte« die kommunikative Funktion des griechischen »sagte zu ihm« im Deutschen idiomatisch wieder; der Bezug auf Paulus bleibt durch »zu ihm« in der vorangehenden Wendung klar.
- source_word: Λέγε μοι
  choice: Sag mir
  rationale: Die Verbindung aus Imperativ und Dativpronomen wird im Deutschen natürlich mit »Sag mir« wiedergegeben.
- source_word: σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen eine gewisse Hervorhebung. Im Deutschen wird diese durch die direkte, zugespitzte Frage hinreichend vermittelt.
- source_word: Ῥωμαῖος
  choice: römischer Bürger
  rationale: Das substantivierte Adjektiv meint im Kontext den rechtlichen Status des römischen Bürgerrechts. Die deutsche Wendung »Römer« könnte dagegen vor allem ethnisch oder geografisch verstanden werden.
- source_word: Ναί
  choice: Ja
  rationale: Die knappe bejahende Antwort entspricht unmittelbar dem griechischen Wortlaut, ohne eine Ergänzung einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper Erzählführung. Die historisch-rechtliche Bedeutung von Ῥωμαῖος wird im Haupttext verständlich ausgedrückt; die Amtsbezeichnung bleibt präzise und wird durch eine Fußnote erläutert.
