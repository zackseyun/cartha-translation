  to: »Ich bin ein Jude, geboren in Tarsus in Kilikien, aber in dieser Stadt zu Füßen Gamaliëls[a] aufgewachsen und aufs Genaueste im Gesetz der Vorfahren[b] unterwiesen, voller Eifer für Gott, wie ihr alle es heute seid.«
