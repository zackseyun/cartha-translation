  naturalness: Der Text ist insgesamt flüssiges modernes Standarddeutsch. „aufs Genaueste im Gesetz der Vorfahren unterwiesen“ gibt die mit κατὰ ἀκρίβειαν bezeichnete gründliche beziehungsweise strenge Ausbildung idiomatischer und genauer wieder als „mit aller Genauigkeit im Gesetz ... unterwiesen“.
  terminology: „Jude“, „Gesetz der Vorfahren“, „Gamaliel“ und „Eifer für Gott“ sind sachgerecht. „Gesetz der Vorfahren“ wahrt den nicht näher spezifizierten, ancestralischen Bezug von πατρῷος, ohne ein Possessivpronomen hinzuzufügen.
