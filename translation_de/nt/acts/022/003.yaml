id: ACT.22.3
reference: Acts 22:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: de
  text: »Ich bin ein Jude, geboren in Tarsus in Kilikien, aber in dieser Stadt zu Füßen Gamaliëls[a] aufgewachsen und aufs Genaueste im Gesetz der Vorfahren[b] unterwiesen, voller Eifer für Gott, wie ihr alle es heute seid.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »zu Füßen Gamaliëls«; dies bezeichnet die Ausbildung bei einem Lehrer.
    reason: cultural_note
  - marker: b
    text: 'Oder: »im angestammten Gesetz« beziehungsweise »im väterlichen Gesetz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: ein Jude
  rationale: Die im Deutschen natürliche Selbstbezeichnung gibt die jüdische Identität klar wieder; dass Paulus ein erwachsener Mann ist, ergibt sich aus Sprecher und Zusammenhang, sodass „ein jüdischer Mann“ unnötig schwerfällig wäre.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: geboren in Tarsus in Kilikien
  rationale: Die Formulierung gibt Geburtsort und Region klar und in modernem Deutsch wieder.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: aber in dieser Stadt … aufgewachsen
  rationale: ἀνατρέφω bezeichnet hier das Aufwachsen beziehungsweise die Erziehung; „aber“ markiert den Gegensatz zum auswärtigen Geburtsort.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: zu Füßen Gamaliëls
  rationale: Die anschauliche Lehrer-Schüler-Wendung bleibt erhalten und wird durch eine kulturelle Fußnote erklärt.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: mit aller Genauigkeit … unterwiesen
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken gründlicher Ausbildung als auch den der Genauigkeit und strengen Übereinstimmung.
- source_word: τοῦ πατρῴου νόμου
  choice: im Gesetz der Vorfahren
  rationale: „Der Vorfahren“ gibt den ererbten beziehungsweise angestammten Charakter des Gesetzes wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: voller Eifer für Gott
  rationale: Die Formulierung bezeichnet leidenschaftlichen religiösen Eifer, ohne die mögliche politische Nebenbedeutung von „Zelot“ einzutragen.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: so wie ihr alle es heute seid
  rationale: Die Formulierung wahrt den direkten Vergleich und die rhetorische Verbundenheit mit den Zuhörern.
theological_decisions:
- issue: Bezeichnung des überlieferten jüdischen Gesetzes
  choice: Gesetz der Vorfahren
  alternative: väterliches Gesetz; Gesetz unserer Vorfahren
  rationale: Die gewählte Form wahrt den Bezug auf das angestammte Gesetz und vermeidet zugleich, das nicht ausdrücklich gesetzte „unserer“ in den Haupttext aufzunehmen. Die Verbundenheit mit den jüdischen Zuhörern bleibt durch die gesamte Rede erkennbar.
- issue: Charakterisierung von Paulus’ Eifer
  choice: voller Eifer für Gott
  alternative: ein Eiferer für Gott; Gott ergeben
  rationale: „Voller Eifer“ bewahrt die Intensität von ζηλωτής, ohne daraus eine technische Zugehörigkeit zu einer politischen oder religiösen Gruppierung zu machen oder den Eifer zu bloßer Ergebenheit abzuschwächen.
- issue: Bildhafte Beschreibung der Ausbildung bei Gamaliel
  choice: zu Füßen Gamaliëls
  alternative: unter Gamaliel; von Gamaliel unterrichtet
  rationale: Das historische Lehrer-Schüler-Bild ist im Deutschen verständlich und kann dank der Fußnote bewahrt werden, ohne seine Bedeutung festzulegen oder zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer mündlicher Redeform. Der Satzbau folgt der argumentativen Bewegung des Griechischen, wird aber zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert. Die traditionelle Wendung „zu Füßen“ bleibt mit Erklärung erhalten.
