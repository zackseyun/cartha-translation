id: ACT.22.16
reference: Acts 22:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: de
  text: Und nun, warum zögerst du? Steh auf, lass dich taufen und wasche deine Sünden ab; rufe seinen Namen an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem du seinen Namen anrufst“ oder „wobei du seinen Namen anrufst“. Das griechische Partizip kann das Anrufen als Mittel oder als begleitenden Umstand ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: warum zögerst du?
  rationale: Die Verbindung ist hier idiomatisch als drängende Frage gegen weiteren Aufschub zu verstehen. „Warum zögerst du?“ gibt Ton und Sinn natürlich wieder.
- source_word: ἀναστὰς
  choice: Steh auf
  rationale: Das Aoristpartizip begleitet die folgenden Imperative und wird im Deutschen natürlich als weitere Aufforderung wiedergegeben.
- source_word: βάπτισαι
  choice: lass dich taufen
  rationale: Der mediale Imperativ wird idiomatisch mit „lass dich taufen“ wiedergegeben; dies bewahrt sowohl die Aufforderung als auch das Empfangen der Taufe.
- source_word: ἀπόλουσαι τὰς ἁμαρτίας σου
  choice: wasche deine Sünden ab
  rationale: Die mediale Form bezeichnet das Abwaschen beziehungsweise Reinigen von den Sünden. Die direkte Formulierung wahrt das eindringliche Bild des griechischen Textes.
- source_word: ἐπικαλεσάμενος
  choice: indem du … anrufst
  rationale: Das Aoristpartizip kann begleitenden Umstand oder Mittel ausdrücken. „Indem“ stellt die enge Verbindung dar, ohne die gesamte theologische Beziehung zwischen Taufe, Abwaschen und Anrufen abschließend festzulegen.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: seinen Namen
  rationale: Der griechische Text hat das Pronomen αὐτοῦ. Daher wird kein ausdrücklicher Titel wie „des Herrn“ ergänzt.
theological_decisions:
- issue: Verhältnis von Taufe, Abwaschen der Sünden und Anrufen seines Namens
  choice: Die Abfolge der Aufforderungen und die enge Verbindung des Partizips werden bewahrt, ohne eine umfassende Sakramentenlehre in den Vers hineinzulesen.
  alternative: Man kann das Partizip allgemeiner begleitend mit „wobei du seinen Namen anrufst“ verstehen; andere Deutungen beziehen die Sündenabwaschung besonders auf die Taufe oder besonders auf das Anrufen.
  rationale: Der griechische Satz verbindet zwei Imperative mit einem Partizip, bestimmt aber nicht alle theologischen Beziehungen ausdrücklich. Die Übersetzung erhält diese Spannung; die Fußnote nennt die grammatische Alternative.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem und dringlichem Ton. „Lass dich taufen“ ist natürlicher als eine formale Nachbildung des griechischen Mediums; „wasche deine Sünden ab“ bewahrt das kräftige Bild. Der Fußnotenmarker steht nach dem Satzteil, auf den sich die grammatische Erläuterung bezieht.
