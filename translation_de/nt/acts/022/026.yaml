  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: de
  text: 'Als der Hauptmann das hörte, ging er zum Kommandanten, meldete es ihm und sagte: »Was hast du vor zu tun?[a] Dieser Mann ist nämlich römischer Bürger.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was willst du jetzt tun?« Der griechische Ausdruck kann sowohl eine beabsichtigte als auch eine unmittelbar bevorstehende Handlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Dieser Mann ist Römer.« Gemeint ist hier, dass er das römische Bürgerrecht besitzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Als ... das hörte
  rationale: Das Aoristpartizip bezeichnet den vorausgehenden Umstand; die temporale Wiedergabe ist im Deutschen natürlich und präzise.
- source_word: ἑκατοντάρχης
  choice: Hauptmann
  rationale: Geläufige deutsche Bezeichnung für den römischen Rang eines Zenturios; sie bleibt verständlich, ohne den Rang zu verallgemeinern.
- source_word: προσελθὼν
  choice: ging er zu
  rationale: Gibt die Bewegung zu dem übergeordneten Offizier idiomatisch wieder.
- source_word: τῷ χιλιάρχῳ
  choice: zum Kommandanten
  rationale: χилίαρχος bezeichnet hier den ranghöheren römischen Befehlshaber; »Kommandant« ist verständlicher als eine transliterierte oder erklärungsbedürftige Amtsbezeichnung.
- source_word: ἀπήγγειλεν
  choice: meldete es ihm
  rationale: Passt zum militärischen Kontext und macht den Empfänger, der im griechischen Dativ steht, im Deutschen ausdrücklich.
- source_word: λέγων
  choice: und sagte
  rationale: Eine finite Koordination bildet das griechische Partizip in natürlichem modernem Deutsch ab.
- source_word: Τί μέλλεις ποιεῖν;
  choice: Was hast du vor zu tun?
  rationale: μέλλω mit Infinitiv kann sowohl beabsichtigtes als auch unmittelbar bevorstehendes Handeln ausdrücken. Die Hauptfassung wahrt die Absichtskomponente; eine Fußnote nennt die imminente Lesart.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Dieser Mann ist nämlich
  rationale: »Dieser Mann« entspricht der konkreten männlichen Referenz; »nämlich« gibt die begründende Funktion von γάρ im natürlichen deutschen Satzanschluss wieder.
- source_word: Ῥωμαῖός ἐστιν
  choice: ist römischer Bürger
  rationale: Im rechtlichen Kontext bezeichnet »Römer« den Besitz des römischen Bürgerrechts. Die explizite Wiedergabe verhindert ein ethnisches oder geografisches Missverständnis.
