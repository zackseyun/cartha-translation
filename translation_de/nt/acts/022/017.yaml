  terminology: „Trance“ ist als moderne, sachliche Wiedergabe von ἐν ἐκστάσει genauer und bewahrt den visionären Charakter ohne zusätzliche devotional geprägte Färbung. Die Fußnote zu „Tempel“ erklärt ἱερόν zutreffend als Anlage bzw. Bezirk statt als inneres Heiligtum.
