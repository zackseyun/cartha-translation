  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: de
  text: Nachdem ich nach Jerusalem zurückgekehrt war, geschah es, als ich im Tempel[a] betete, dass ich in Trance geriet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die Tempelanlage beziehungsweise den Tempelbezirk, nicht speziell das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: 'Oder: „in Verzückung geriet“. Wörtlich etwa: „in einen Zustand der Ekstase kam“; gemeint ist das Eintreten in einen visionären Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: geschah es
  rationale: Die unpersönliche Erzählformel leitet das nächste Erlebnis des Paulus ein. Im Deutschen wird seine persönliche Beteiligung durch den anschließenden Ich-Satz natürlich mit ausgedrückt.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: als ich nach Jerusalem zurückgekehrt war
  rationale: Das Aoristpartizip bezeichnet hier die der Vision vorausgehende Rückkehr; das Plusquamperfekt macht diese zeitliche Abfolge klar.
- source_word: καὶ προσευχομένου μου
  choice: und im Tempel betete
  rationale: Die Konstruktion bezeichnet eine gleichzeitig andauernde Handlung. Im gemeinsamen temporalen Nebensatz ergibt sich eine natürliche deutsche Formulierung.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den Tempelbereich beziehungsweise die Tempelanlage. Die geläufige Übersetzung „Tempel“ bleibt lesbar; die genauere Bedeutung wird in der Fußnote erläutert.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: dass ich in Verzückung geriet
  rationale: Die Verbindung bezeichnet das Eintreten in einen außergewöhnlichen visionären Zustand. „In Verzückung geraten“ gibt sowohl den Zustandswechsel als auch den biblisch-visionären Zusammenhang idiomatisch wieder.
theological_decisions:
- issue: Art des Erlebnisses des Paulus (ἐκστάσει)
  choice: Verzückung
  alternative: Trance; visionärer Zustand
  rationale: Der Vers berichtet einen außergewöhnlichen Zustand während des Gebets, erklärt aber dessen genaue Beschaffenheit nicht. „Verzückung“ wahrt diese Offenheit und fügt keine weitergehende psychologische oder theologische Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist gegenüber der griechischen Konstruktion geglättet, ohne die zeitliche Abfolge oder die Offenheit hinsichtlich der Art des visionären Erlebnisses aufzulösen.
