id: ACT.22.29
reference: Acts 22:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: de
  text: Darum ließen die Männer, die ihn verhören wollten[a], sofort von ihm ab. Auch der Tribun[b] bekam Angst, als er erkannte, dass Paulus römischer Bürger war und dass er ihn gefesselt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Zusammenhang genauer: „die ihn unter Auspeitschung verhören wollten“. Das griechische Verb kann eine amtliche Untersuchung bezeichnen; aus dem vorherigen Vers geht hervor, auf welche Weise sie erfolgen sollte.'
    reason: lexical_alternative
  - marker: b
    text: Oder „der Kommandant“. Der griechische Titel bezeichnet einen römischen Offizier, der dem Rang nach etwa tausend Soldaten befehligte, auch wenn die tatsächliche Truppenstärke unterschiedlich sein konnte.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Darum … sofort
  rationale: „Darum“ gibt den folgernden Anschluss wieder, während „sofort“ die unverzügliche Reaktion natürlich ausdrückt.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: ließen … von ihm ab
  rationale: Die idiomatische Wendung bezeichnet, dass die Männer ihr Vorhaben unverzüglich aufgaben und sich von Paulus zurückzogen.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: die ihn verhören wollten
  rationale: Die Formulierung gibt die unmittelbar bevorstehende amtliche Untersuchung natürlich wieder; dass sie nach dem Kontext unter Auspeitschung erfolgen sollte, wird in der Fußnote erläutert.
- source_word: χιλίαρχος
  choice: Tribun
  rationale: „Tribun“ ist eine knappe, historisch passende Bezeichnung für den römischen Offizier; seine militärische Funktion wird in der Fußnote erklärt.
- source_word: ἐφοβήθη
  choice: bekam Angst
  rationale: Die Formulierung erfasst den Eintritt der Furcht als Reaktion auf die neue Erkenntnis.
- source_word: ἐπιγνοὺς
  choice: als er erkannte
  rationale: Das Partizip bezeichnet hier das volle Erfassen der rechtlich bedeutsamen Lage und hat zugleich zeitlich-kausalen Sinn.
- source_word: Ῥωμαῖός ἐστιν
  choice: Paulus römischer Bürger war
  rationale: Gemeint ist der rechtliche Bürgerstatus, nicht bloß ethnische oder geografische Herkunft. Der Name „Paulus“ klärt im Deutschen den Pronomenbezug.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: dass er ihn gefesselt hatte
  rationale: Das Perfekt bezeichnet eine bereits vollzogene Fesselung mit fortbestehender Bedeutung. Die direkte Wiedergabe vermeidet eine unnötige kausative Ergänzung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Tribun“ bewahrt das historische Kolorit; die Fußnote macht die Funktion für heutige Leser verständlich. Die amtliche und gewaltsame Färbung von ἀνετάζειν wird nicht in den Haupttext hineingezwungen, sondern kontextgerecht in der Fußnote offengelegt.
