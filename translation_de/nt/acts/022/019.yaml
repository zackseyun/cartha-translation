source:
  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: de
  text: 'Und ich sagte: »Herr, sie selbst wissen doch, dass ich die, die an dich glauben, Synagoge für Synagoge ins Gefängnis warf und schlug.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Synagogen … die, die dir vertrauen«. Die griechische Wendung ist distributiv und bezeichnet ein wiederholtes Vorgehen an mehreren Synagogen; »glauben« kann hier auch den Sinn von »vertrauen« haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: Und ich sagte
  rationale: κἀγώ ist die Zusammenziehung von καὶ ἐγώ; zusammen mit εἶπον ergibt sich natürlich und quellengetreu „Und ich sagte“.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος richtet sich hier an Jesus. „Herr“ bewahrt sowohl die respektvolle Anrede als auch das christologische Gewicht.
- source_word: αὐτοὶ ἐπίστανται
  choice: sie selbst wissen doch
  rationale: „sie selbst“ erhält die ausdrückliche Betonung von αὐτοί; „doch“ macht im Deutschen die argumentative Berufung auf ihr eigenes Wissen natürlich hörbar.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: ins Gefängnis warf und schlug
  rationale: Die periphrastische Imperfektkonstruktion beschreibt wiederholtes bzw. gewohnheitsmäßiges Handeln in der Vergangenheit. Der distributive Zusammenhang trägt diese Wiederholung; „schlug“ vermeidet die Engführung auf eine förmliche Auspeitschung.
- source_word: κατὰ τὰς συναγωγάς
  choice: Synagoge für Synagoge
  rationale: κατά mit Akkusativ ist hier distributiv. Die Formulierung gibt das wiederholte Vorgehen an mehreren Synagogen prägnant und natürlich wieder.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: die, die an dich glauben
  rationale: Das substantivierte Präsenspartizip bezeichnet die Glaubenden; πιστεύω ἐπί mit Akkusativ drückt den auf Jesus gerichteten Glauben bzw. das Vertrauen aus.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede Jesu
  choice: Herr
  alternative: Meister
  rationale: „Herr“ entspricht dem üblichen Bedeutungsumfang von κύριος und bewahrt in der Visionserzählung die christologische Spannung, ohne sie weiter auszudeuten.
- issue: Wiedergabe von πιστεύω ἐπί
  choice: an dich glauben
  alternative: dir vertrauen
  rationale: „an dich glauben“ ist im Deutschen die natürliche biblische Formulierung und lässt den Bedeutungsanteil des Vertrauens bestehen; die Alternative wird in der Fußnote genannt.
- issue: Aspekt der früheren Verfolgung
  choice: Synagoge für Synagoge ins Gefängnis warf und schlug
  alternative: immer wieder ins Gefängnis warf und schlug
  rationale: Die Verbindung aus periphrastischem Imperfekt und distributivem κατὰ τὰς συναγωγάς bezeichnet fortgesetztes bzw. wiederholtes Handeln. Die gewählte Form bewahrt zugleich den örtlich-distributiven Zug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Synagoge für Synagoge“ bildet die distributive griechische Wendung idiomatisch ab; die Satzstellung rückt die Betroffenen als gemeinsames Objekt von Gefangensetzung und Schlägen klar hervor.
