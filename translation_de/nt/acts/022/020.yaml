    rationale: αὐτὸς ... καί betont Paulus’ eigene Beteiligung. „Auch ich selbst stand dabei“ vermittelt dies klarer als „stand auch ich selbst dabei“, das im Deutschen leichter additiv zu anderen Personen verstanden wird.
  - severity: low
    issue: Fußnotenformulierung zur lexikalischen Alternative
    rationale: Die Alternative sollte als traditionelle, kontextbezogene Lesart transparent sein und ohne die missverständliche Formulierung auskommen, das griechische Wort bedeute in diesem Vers einfach „Märtyrer“.
