revisions:
- from: Und als das Blut deines Zeugen Stephanus[a] vergossen wurde, stand auch ich selbst dabei, billigte es und bewachte die Mäntel derer, die ihn töteten.
  to: Und als das Blut deines Zeugen Stephanus[a] vergossen wurde, stand auch ich selbst dabei, billigte dies und bewachte die Mäntel derer, die ihn töteten.
  rationale: Die geringfügige Umstellung von „auch ich selbst“ macht die im Griechischen hervorgehobene persönliche Beteiligung des Sprechers deutlicher. Die Fußnote wird sprachlich gestrafft und beschreibt die mögliche traditionelle Bedeutung von μάρτυς präzise, ohne sie dem Grundsinn im Haupttext vorzuziehen. Der übrige Text ist quellentreu und idiomatisch und bleibt unverändert.
