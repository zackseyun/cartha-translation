source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: de
  text: Und als das Blut deines Zeugen Stephanus[a] vergossen wurde, stand auch ich selbst dabei, billigte dies und bewachte die Mäntel derer, die ihn töteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Märtyrers«. Das griechische Wort bedeutet grundsätzlich »Zeuge«; im christlichen Sprachgebrauch wurde es besonders für Menschen verwendet, die wegen ihres Zeugnisses sterben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: vergossen wurde
  rationale: Der Imperfekt Passiv beschreibt das Geschehen im Verlauf. »Vergossen wurde« ist im Deutschen die natürliche und zugleich bildhafte Wendung für gewaltsam fließendes Blut.
- source_word: αἷμα
  choice: Blut
  rationale: Direkte und kontextgemäße Entsprechung.
- source_word: μάρτυρός
  choice: Zeugen
  rationale: μάρτυς bezeichnet zunächst einen Zeugen. Die spätere christliche Bedeutung »Märtyrer« ist angesichts des gewaltsamen Todes naheliegend, wird aber nicht anstelle des grundlegenden Wortsinns in den Haupttext gesetzt.
- source_word: ἐφεστὼς
  choice: stand dabei
  rationale: Die Form bezeichnet hier das anwesende Dabeistehen und wird knapp und natürlich wiedergegeben.
- source_word: συνευδοκῶν
  choice: billigte es
  rationale: Das Partizip drückt Zustimmung beziehungsweise ausdrückliche Billigung aus; das ergänzte »es« macht den Bezug auf die Tötung im Deutschen klar.
- source_word: φυλάσσων
  choice: bewachte
  rationale: φυλάσσω bezeichnet ein Bewachen oder Hüten und passt konkret zu den abgelegten Kleidungsstücken.
- source_word: ἱμάτια
  choice: Mäntel
  rationale: Gemeint sind äußere Kleidungsstücke; »Mäntel« ist anschaulicher und kontextuell genauer als das allgemeine »Kleider«.
- source_word: ἀναιρούντων
  choice: die ihn töteten
  rationale: ἀναιρέω bedeutet in diesem Zusammenhang töten beziehungsweise ums Leben bringen. »Töteten« ist klar und fügt keine über den Ausdruck hinausgehende rechtliche oder moralische Wertung hinzu.
- source_word: αὐτὸς
  choice: auch ich selbst
  rationale: Die betonte pronominale Form wird im Zusammenhang mit καί durch »auch ich selbst« wiedergegeben.
theological_decisions:
- issue: Wiedergabe von μάρτυς als Bezeichnung für Stephanus
  choice: Zeuge
  alternative: Märtyrer
  rationale: Der grundlegende griechische Wortsinn ist »Zeuge«. Obwohl Stephanus aufgrund seines Todes traditionell als Märtyrer bezeichnet wird und das Wort diese Bedeutung später annahm, soll diese Entwicklung die offene Bedeutungsbeziehung im Vers nicht verdrängen; die Alternative wird daher in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der Abfolge des griechischen Textes, ohne unnatürlich zu wirken. Die wiederholten Handlungen werden mit koordinierten Verben klar und eindringlich dargestellt.
