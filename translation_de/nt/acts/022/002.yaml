id: ACT.22.2
reference: Acts 22:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: de
  text: 'Als sie aber hörten, dass er sie auf Hebräisch[a] ansprach, wurden sie noch stiller. Und er sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist Aramäisch gemeint; im Griechischen steht „in der hebräischen Sprache“, womit hier die örtliche semitische Sprache Judäas bezeichnet sein kann.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Als sie aber hörten
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben; δέ markiert die leichte narrative Wendung mit „aber“.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: auf Hebräisch
  rationale: Die Formulierung gibt die ausdrückliche Bezeichnung des griechischen Textes knapp und idiomatisch wieder, ohne die mögliche aramäische Referenz in den Haupttext einzutragen.
- source_word: προσεφώνει αὐτοῖς
  choice: er sie … ansprach
  rationale: Das Imperfekt bezeichnet die an die Menge gerichtete Rede; „ansprach“ ist im Deutschen natürlich und wahrt die gerichtete Kommunikation.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: wurden sie noch stiller
  rationale: Die griechische Wendung bedeutet wörtlich, dass sie mehr Ruhe gewährten; die deutsche Formulierung gibt Idiom und Steigerung verständlich wieder.
- source_word: καὶ φησίν
  choice: 'Und er sagte:'
  rationale: Das historische Präsens wird entsprechend natürlicher deutscher Erzählweise im Präteritum wiedergegeben; der Doppelpunkt leitet die folgende Rede ein.
theological_decisions:
- issue: Referenz von τῇ Ἑβραΐδι διαλέκτῳ
  choice: „Hebräisch“ im Haupttext beibehalten
  alternative: Die Wendung unmittelbar als „Aramäisch“ übersetzen
  rationale: Der griechische Wortlaut bezeichnet die Sprache als „hebräisch“, kann im damaligen Kontext jedoch die örtliche semitische Sprache, möglicherweise Aramäisch, meinen. Die Übersetzung bewahrt den Wortlaut und nennt die historische Mehrdeutigkeit in einer Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Auf Hebräisch“ ist idiomatischer als „in hebräischer Sprache“; die echte sprachgeschichtliche Mehrdeutigkeit bleibt durch die Fußnote erhalten.
