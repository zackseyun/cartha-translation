  text: ⸀κραυγαζόντων ⸀τε αὐτῶν καὶ ῥιπτούντων τὰ ἱμάτια καὶ κονιορτὸν βαλλόντων εἰς τὸν ἀέρα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/023.yaml
  text: And as they were shouting and throwing off their cloaks and flinging dust into the air,[a]
translation:
  language: de
  text: Während sie schrien, ihre Gewänder warfen[a] und Staub in die Luft schleuderten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Gewänder wegwarfen“ oder „ihre Gewänder von sich warfen“. Das Griechische kann sowohl das Wegwerfen als auch ein aufgeregtes Werfen der Gewänder bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: während sie schrien
  rationale: Das präsentische Partizip beschreibt eine andauernde, gleichzeitig mit den folgenden Handlungen ablaufende Tätigkeit. „Schrien“ gibt den lauten öffentlichen Aufruhr natürlich wieder.
- source_word: τε
  choice: und
  rationale: τέ verbindet hier das erste Partizip mit den weiteren koordinierten Handlungen; im Deutschen ist „und“ die natürliche Entsprechung.
- source_word: αὐτῶν
  choice: sie
  rationale: Der griechische Genitiv wird in der deutschen Nebensatzkonstruktion idiomatisch als ausdrückliches Subjekt wiedergegeben.
- source_word: ῥιπτούντων
  choice: wegwarfen
  rationale: Das Verb bezeichnet Werfen oder Schleudern. „Wegwarfen“ bewahrt die mögliche Vorstellung, dass die Gewänder von sich geworfen wurden, ohne „auszogen“ in den Text einzutragen.
- source_word: τὰ ἱμάτια
  choice: ihre Gewänder
  rationale: ἱμάτια kann Obergewänder oder allgemein Kleidungsstücke bezeichnen. „Gewänder“ erhält die lexikalische Offenheit besser als das engere „Umhänge“.
- source_word: κονιορτόν
  choice: Staub
  rationale: Die direkte und im Kontext natürliche deutsche Entsprechung.
- source_word: βαλλόντων
  choice: schleuderten
  rationale: „Schleuderten“ vermittelt die heftige, aufgebrachte Bewegung und vermeidet eine unmittelbare Wiederholung von „werfen“.
- source_word: εἰς τὸν ἀέρα
  choice: in die Luft
  rationale: Die übliche und genaue deutsche Wiedergabe der Präpositionalphrase.
