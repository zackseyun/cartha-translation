  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: de
  text: Als ich unterwegs war und mich Damaskus näherte, umstrahlte mich gegen Mittag plötzlich ein helles Licht[a] vom Himmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein gewaltiges Licht“. Der griechische Ausdruck kann die Größe oder die Intensität des Lichts hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι πορευομένῳ
  choice: Als ich unterwegs war
  rationale: Die griechische Ereignisformel mit Dativ und Partizip wird im Deutschen natürlich als einleitender temporaler Nebensatz wiedergegeben; die Ich-Perspektive und der fortdauernde Reisevorgang bleiben erhalten.
- source_word: καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: und mich Damaskus näherte
  rationale: ἐγγίζω mit Dativ bezeichnet die Annäherung an einen Ort. Die Formulierung ist gegenwärtiges Standarddeutsch und bewahrt die parallelen Partizipialhandlungen.
- source_word: περὶ μεσημβρίαν
  choice: gegen Mittag
  rationale: Gibt die ungefähre Zeitangabe idiomatisch wieder.
- source_word: ἐξαίφνης
  choice: plötzlich
  rationale: Bewahrt das unvermittelte Eintreten des Geschehens.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Bewahrt im Kontext der Offenbarungserfahrung den möglichen transzendenten Ursprung besser als die rein meteorologische Wiedergabe „vom Himmel herab/aus dem Himmelsraum“.
- source_word: περιαστράψαι
  choice: umstrahlte mich
  rationale: Das zusammengesetzte Verb bezeichnet ein ringsum erfolgendes Aufleuchten; „umstrahlte“ gibt die räumliche Umfassung prägnant und würdig wieder.
- source_word: φῶς ἱκανὸν
  choice: ein helles Licht
  rationale: ἱκανός kann hier beträchtliche Stärke oder Größe ausdrücken. „Helles Licht“ vermittelt im Deutschen natürlich die Lichtintensität; die Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von οὐρανός in ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  alternative: vom Himmel her / aus dem Himmelsraum
  rationale: „Himmel“ erhält sowohl die räumliche als auch die im Kontext naheliegende transzendente Bedeutung, ohne die göttliche Herkunft ausdrücklich über den Wortlaut hinaus zu bestimmen.
translation_notes:
  register: Natürliches, modernes und zugleich würdevolles Erzähldeutsch. Die griechische Ereignisformel wird nicht schwerfällig mit „Es geschah mir“ nachgebildet, sondern durch einen deutschen temporalen Satz ausgedrückt. Der Fußnotenmarker steht nach dem vollständigen Satz, da er sich auf „ein helles Licht“ bezieht.
