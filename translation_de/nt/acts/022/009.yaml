id: ACT.22.9
reference: Acts 22:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: de
  text: Die bei mir waren, sahen zwar das Licht, hörten aber die Stimme dessen, der zu mir redete, nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verstanden die Stimme nicht“. In Apostelgeschichte 9,7 heißt es, dass die Begleiter des Paulus die Stimme beziehungsweise den Laut hörten. Gemeint sein könnte, dass sie zwar einen Laut hörten, den Sprecher aber nicht verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Die bei mir waren
  rationale: Gibt die substantivierte Partizipialkonstruktion natürlich und ohne die im Griechischen nicht ausdrücklich genannte Ergänzung „Männer“ wieder. Der Gegensatz wird im Deutschen durch „zwar … aber“ ausgedrückt.
- source_word: τὸ μὲν φῶς
  choice: das Licht
  rationale: φῶς bedeutet hier schlicht „Licht“. Eine Ergänzung wie „helle“ wäre zwar aus dem Kontext verständlich, steht aber nicht in diesem Vers.
- source_word: ἐθεάσαντο
  choice: sahen
  rationale: θεάομαι bezeichnet hier das Wahrnehmen mit den Augen. „Sahen“ ist im modernen Deutsch klar und natürlich, ohne eine besondere Absicht des Betrachtens einzutragen.
- source_word: τὴν δὲ φωνὴν
  choice: die Stimme
  rationale: φωνή kann „Stimme“ oder „Laut/Geräusch“ bedeuten. Wegen der näheren Bestimmung „dessen, der zu mir redete“ ist „Stimme“ hier vorzuziehen.
- source_word: οὐκ ἤκουσαν
  choice: hörten … nicht
  rationale: ἀκούω bedeutet gewöhnlich „hören“, kann je nach Zusammenhang aber auch das verstehende Hören bezeichnen. Die direkte Bedeutung bleibt im Haupttext erhalten; die mögliche Nuance „verstanden nicht“ wird in der Fußnote genannt.
- source_word: τοῦ λαλοῦντός μοι
  choice: dessen, der zu mir redete
  rationale: Die Formulierung bewahrt den Bezug der Stimme auf eine redende Person und gibt das durative Partizip idiomatisch wieder. „Zu mir“ entspricht dem Dativ μοι.
theological_decisions:
- issue: Scheinbare Spannung zu Apostelgeschichte 9,7 hinsichtlich dessen, was die Begleiter des Paulus hörten
  choice: Im Haupttext steht, dass sie die Stimme nicht hörten; die mögliche Bedeutung „nicht verstanden“ wird in einer Fußnote bewahrt.
  alternative: Sie verstanden die Stimme nicht beziehungsweise hörten zwar einen Laut, verstanden aber den Sprecher nicht.
  rationale: Der griechische Wortlaut dieses Verses legt zunächst „die Stimme nicht hören“ nahe. Zugleich lassen die Bedeutungsfelder von ἀκούω und φωνή eine Unterscheidung zwischen dem Wahrnehmen eines Lautes und dem Verstehen einer Stimme zu. Die Übersetzung löst die Spannung zu Apostelgeschichte 9,7 daher nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „zwar … aber“ bildet den griechischen Gegensatz μέν … δέ deutlich und natürlich ab. Keine altertümlichen Wörter und keine konfessionell geprägte Deutung.
