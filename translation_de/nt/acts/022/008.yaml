source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: de
  text: 'Ich antwortete: »Wer bist du, Herr[a]?« Da sagte er zu mir: »Ich bin Jesus, der Nazarener[b], den du verfolgst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herr« im Sinn einer höflichen Anrede (etwa: »mein Herr«). Das griechische Wort kann sowohl eine respektvolle Anrede als auch den Titel »Herr« bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Jesus von Nazaret«; auch übersetzbar: »Jesus, der Nazoräer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: Ich antwortete
  rationale: Das deponente Aoristverb ἀποκρίνομαι wird direkt und natürlich mit »antworten« wiedergegeben.
- source_word: Τίς εἶ
  choice: Wer bist du?
  rationale: Die griechische Frage wird in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: κύριε
  choice: Herr
  rationale: »Herr« wahrt die übliche Wiedergabe von κύριος und zugleich die mögliche christologische Bedeutung im Erzählzusammenhang; die höfliche Anrede »mein Herr« bleibt als Alternative in einer Fußnote erhalten.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Da sagte er zu mir
  rationale: λέγω mit πρὸς ἐμέ bedeutet idiomatisch »zu mir sagen«; »Da« gibt die anschließende Verknüpfung durch τε in flüssigem Deutsch wieder.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ich bin Jesus
  rationale: Die unmittelbare Selbstidentifikation wird ohne erklärenden Zusatz wiedergegeben.
- source_word: ὁ Ναζωραῖος
  choice: der Nazarener
  rationale: Die substantivierte Herkunftsbezeichnung wird formnah und im Deutschen verständlich mit »der Nazarener« wiedergegeben.
- source_word: ὃν σὺ διώκεις
  choice: den du verfolgst
  rationale: διώκω bezeichnet hier feindselige Verfolgung. Das deutsche Präsens bildet die fortdauernde Handlung natürlich ab; das betonte σὺ wird durch die reguläre Formulierung ausreichend vermittelt.
theological_decisions:
- issue: Wiedergabe von κύριε in der Anrede des Saulus
  choice: Herr
  alternative: 'mein Herr; als höfliche Anrede sinngemäß auch: Herr'
  rationale: Saulus kennt die Identität des Sprechers noch nicht vollständig. κύριε kann daher respektvolle Anrede oder Hoheitstitel sein. Der Haupttext behält »Herr« bei und lässt diese Spannung stehen; die Fußnote erläutert die höfliche Bedeutungsmöglichkeit.
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die direkte Rede ist natürlich gestaltet; Herkunftsbezeichnung und mehrdeutige Anrede werden im Haupttext knapp gehalten und durch Fußnoten abgesichert.
