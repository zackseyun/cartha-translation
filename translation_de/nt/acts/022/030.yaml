id: ACT.22.30
reference: Acts 22:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: de
  text: Am folgenden Tag aber wollte der Kommandant mit Sicherheit erfahren, was Paulus von den Juden[a] vorgeworfen wurde. Deshalb ließ er ihn los und befahl den führenden Priestern und dem gesamten Hohen Rat[b], zusammenzukommen. Dann brachte er Paulus hinunter und stellte ihn vor sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den jüdischen Führern“ oder „von den Judäern“. Wörtlich steht im Griechischen „von den Juden“; im Zusammenhang sind die Ankläger des Paulus gemeint, nicht unterschiedslos alle jüdischen Menschen.'
    reason: lexical_alternative
  - marker: b
    text: Der „Hohe Rat“ war das oberste jüdische Ratsgremium in Jerusalem, auch Sanhedrin genannt.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Am folgenden Tag aber
  rationale: Die temporale Dativwendung bezeichnet den folgenden Tag; δέ markiert einen leichten Fortgang beziehungsweise Übergang der Erzählung.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: wollte ... mit Sicherheit erfahren
  rationale: Die Formulierung gibt sowohl die Absicht des Kommandanten als auch sein Verlangen nach verlässlicher Gewissheit natürlich wieder.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: was Paulus von den Juden vorgeworfen wurde
  rationale: Die passive Konstruktion und der Inhalt der Beschuldigung bleiben erhalten. Der Name Paulus verdeutlicht im Deutschen den Bezug des Pronomens, ohne den Sinn einzuengen.
- source_word: ἔλυσεν αὐτόν
  choice: ließ er ihn los
  rationale: λύω kann lösen, losbinden oder freilassen bedeuten. Die knappe Formulierung bewahrt diese kontextuelle Bedeutungsbreite und behauptet nicht, Paulus sei aus dem römischen Gewahrsam entlassen worden.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: befahl ... zusammenzukommen
  rationale: κελεύω mit Infinitiv bezeichnet eine verbindliche Anordnung; die deutsche Form ist klar und dem amtlichen Rahmen angemessen.
- source_word: τοὺς ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen priesterlichen Autoritäten und nicht mehrere gleichzeitig amtierende Hohepriester.
- source_word: πᾶν τὸ συνέδριον
  choice: den gesamten Hohen Rat
  rationale: συνέδριον bezeichnet hier das oberste jüdische Ratsgremium in Jerusalem; „Hoher Rat“ ist die geläufige und verständliche deutsche Bezeichnung, πᾶν wird mit „gesamten“ wiedergegeben.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: Dann brachte er Paulus hinunter
  rationale: Das Aoristpartizip bezeichnet die der Aufstellung vorausgehende Bewegung, wahrscheinlich von der Burg beziehungsweise Kaserne zum Versammlungsort.
- source_word: ἔστησεν εἰς αὐτούς
  choice: stellte ihn vor sie
  rationale: Die Wendung bezeichnet, dass Paulus in offizieller Weise in die Gegenwart des versammelten Gremiums gestellt wurde.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίων in der Apostelgeschichte
  choice: von den Juden
  alternative: von den jüdischen Führern / von den Judäern
  rationale: Der griechische Text nennt ausdrücklich „die Juden“. Im unmittelbaren Zusammenhang sind damit die Ankläger des Paulus gemeint, nicht unterschiedslos alle jüdischen Menschen. Die Hauptübersetzung wahrt die lexikalische Form, während die Fußnote die kontextuelle Reichweite verdeutlicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. „Kommandant“ macht das im Kontext eindeutige, im griechischen Vers jedoch nur pronominal bezeichnete Subjekt verständlich. Die Übersetzung bleibt nah an der amtlichen und erzählerischen Sprache des Ausgangstextes.
