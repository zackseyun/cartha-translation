id: ACT.13.45
reference: Acts 13:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: de
  text: Als aber die Juden die Menschenmengen sahen[a], wurden sie von Eifersucht erfüllt[b]. Sie widersprachen dem, was Paulus sagte[c], und lästerten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist hier die örtliche jüdische Gruppe, die Paulus in dieser Szene entgegentritt, nicht das jüdische Volk insgesamt.
    reason: cultural_note
  - marker: b
    text: 'Oder: »von Eifer erfüllt«; der Zusammenhang spricht hier für die negative Bedeutung »Eifersucht«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »dem, was von Paulus gesagt wurde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: als ... sahen
  rationale: Das Aoristpartizip wird als temporaler Nebensatz wiedergegeben; so klingt der Satz natürlich und die zeitliche Beziehung zur Haupthandlung bleibt erhalten.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier den Kontrast zur positiven Reaktion im vorausgehenden Zusammenhang.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die Wiedergabe folgt der ausdrücklichen Bezeichnung im griechischen Text, ohne sie interpretierend auf »Führer« einzuengen; eine Fußnote grenzt den Bezug auf die örtliche Gruppe der Szene ein.
- source_word: τοὺς ὄχλους
  choice: die Menschenmengen
  rationale: Die Form ist Plural und bezeichnet die zahlreich versammelten Menschen; »Menschenmengen« bewahrt den Plural und ist im Deutschen klar.
- source_word: ἐπλήσθησαν ζήλου
  choice: wurden sie von Eifersucht erfüllt
  rationale: ζῆλος kann Eifer oder Eifersucht bedeuten. Die feindselige Reaktion im Kontext spricht hier für »Eifersucht«; die Formulierung erhält zugleich das Bild des Erfülltwerdens.
- source_word: ἀντέλεγον
  choice: sie widersprachen
  rationale: Der Imperfekt bezeichnet die fortdauernde beziehungsweise wiederholte Gegenrede. Das deutsche Präteritum gibt dies im Erzählzusammenhang natürlich wieder.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: dem, was Paulus sagte
  rationale: Das substantivierte Passivpartizip bezeichnet den Inhalt der Äußerungen des Paulus. Die aktive deutsche Form ist idiomatisch, ohne den Sinn einzuengen.
- source_word: βλασφημοῦντες
  choice: und lästerten
  rationale: Das begleitende Partizip wird als koordinierte Handlung wiedergegeben. »Lästern« bewahrt die starke religiöse und ehrverletzende Bedeutung, ohne ein im Text nicht genanntes Objekt hinzuzufügen.
theological_decisions:
- issue: Mögliche antijüdische Verallgemeinerung von οἱ Ἰουδαῖοι
  choice: die Juden, mit erklärender Fußnote zur örtlichen Bezugsgruppe
  alternative: die jüdischen Führer / die Judäer
  rationale: Der Wortlaut wird nicht interpretierend verengt. Zugleich macht die Fußnote deutlich, dass die konkrete jüdische Gruppe gemeint ist, die Paulus in dieser Szene entgegentritt, nicht das jüdische Volk insgesamt.
- issue: Bedeutung von ζῆλος
  choice: Eifersucht
  alternative: Eifer
  rationale: Der unmittelbare Zusammenhang – die Reaktion auf die Menschenmengen, der Widerspruch und das Lästern – legt die negative Bedeutung nahe; die lexikalische Mehrdeutigkeit wird in einer Fußnote bewahrt.
- issue: Objekt des Läster ns
  choice: kein Objekt ergänzt
  alternative: sie lästerten Paulus / Gott / die Botschaft
  rationale: Der griechische Text nennt kein ausdrückliches Objekt. Die Übersetzung bewahrt diese Offenheit und vermeidet eine theologische Festlegung, die über den Wortlaut hinausgeht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung verhindert eine schwerfällige Partizipienkette. »Lästern« erhält die Stärke des griechischen Ausdrucks, während das nicht genannte Objekt offenbleibt.
