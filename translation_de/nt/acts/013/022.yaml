  terminology: „König“, „Isai“, „Mann nach meinem Herzen“ und „alle meine Absichten ausführen“ sind passende, etablierte bzw. verständliche Wiedergaben. Die Fußnote zu „nach meinem Herzen“ sollte die traditionelle Wendung erläutern, ohne ihre Bedeutung einseitig auf einen bestimmten theologischen Deutungssatz festzulegen.
