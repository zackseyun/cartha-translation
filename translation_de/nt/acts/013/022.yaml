  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: de
  text: 'Nachdem er ihn abgesetzt hatte, erhob er David für sie zum König. Von ihm gab er auch Zeugnis und sagte: »Ich habe David gefunden, den Sohn Isais, einen Mann nach meinem Herzen[a], der alle meine Absichten ausführen wird[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Mann gemäß meinem Herzen“. Die traditionelle Wendung „nach meinem Herzen“ gibt die Bildsprache des Griechischen wieder.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort steht im Plural und kann Gottes Willensentschlüsse, Wünsche oder Vorhaben bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: nachdem er ihn abgesetzt hatte
  rationale: Im Zusammenhang bezeichnet das Verb Gottes Entfernung Sauls aus dem Königsamt. „Abgesetzt“ macht diesen konkreten Sinn im Deutschen klar, ohne über Sauls weiteres Schicksal zu entscheiden.
- source_word: ἤγειρεν
  choice: ließ er … auftreten
  rationale: ἐγείρω bezeichnet hier das Hervortretenlassen beziehungsweise Erwecken eines Herrschers, nicht eine Auferweckung von den Toten. „Auftreten lassen“ bewahrt mehr von diesem Bild als das enger deutende „einsetzen“ und ist im modernen Deutschen verständlich.
- source_word: αὐτοῖς
  choice: für sie
  rationale: Der Dativ bezeichnet hier Israel als die begünstigte Gruppe, für die Gott David zum König hervortreten ließ.
- source_word: εἰς βασιλέα
  choice: als König
  rationale: Die Verbindung bezeichnet Davids Rolle beziehungsweise das Ergebnis seines Hervortretens.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: Über ihn legte er auch Zeugnis ab und sagte
  rationale: Der Relativsatz bezieht sich inhaltlich auf das Zeugnis über David. Diese deutsche Formulierung gibt μαρτυρέω wieder und vermeidet das missverständliche „zu ihm“.
- source_word: Εὗρον
  choice: Ich habe … gefunden
  rationale: Das Perfekt ist im Deutschen für eine abgeschlossene Handlung mit fortbestehender Bedeutung natürlich.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: den Sohn Isais
  rationale: Der elliptische Genitiv bezeichnet David idiomatisch als Sohn Isais.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: einen Mann nach meinem Herzen
  rationale: Die geläufige deutsche Wendung wahrt das Bild des griechischen Textes. Sie bezeichnet Übereinstimmung mit Gottes innerem Wollen und muss nicht auf gefühlsmäßige Zuneigung verengt werden.
- source_word: ὃς ποιήσει πάντα τὰ θελήματά μου
  choice: der alle meine Absichten ausführen wird
  rationale: „Absichten“ gibt den Plural θελήματα wieder und bezeichnet die verschiedenen Willensentschlüsse oder Vorhaben Gottes; „ausführen“ entspricht im Zusammenhang dem Vollbringen dieser Absichten.
theological_decisions:
- issue: Bedeutung der Charakterisierung Davids
  choice: ein Mann nach meinem Herzen
  alternative: ein Mann, der meinem Herzen entspricht
  rationale: Die gewählte Form bewahrt das Herzbild und die genuine Offenheit der Aussage. Der anschließende Relativsatz verbindet sie mit Davids Tun, ohne sie vollständig darauf zu reduzieren.
- issue: Bedeutung von ἐγείρω bei Davids Königtum
  choice: ließ er David … als König auftreten
  alternative: setzte er David … als König ein
  rationale: Die Formulierung vermeidet im Deutschen eine irreführende Auferstehungsassoziation, bewahrt aber den Gedanken, dass Gott David hervortreten ließ, statt nur einen formalen Ernennungsakt zu bezeichnen.
- issue: Plural von θελήματα
  choice: alle meine Absichten
  alternative: alles, was ich will
  rationale: Der Plural des griechischen Textes wird sichtbar erhalten, ohne die Aussage als mehrere voneinander unabhängige göttliche Willen missverständlich wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Abfolge, wird jedoch zur besseren Verständlichkeit in zwei Hauptsätze gegliedert. „Isai“ folgt der etablierten deutschen Namensform; der Genitiv lautet „Isais“.
