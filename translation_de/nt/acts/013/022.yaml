    rationale: Die Aussage, es sei „gemeint“ sei ausschließlich Übereinstimmung mit Gottes innerem Wollen, verengt die offene Bildsprache stärker als der Text verlangt. Eine neutrale lexikalische Erläuterung wahrt die Mehrdeutigkeit.
