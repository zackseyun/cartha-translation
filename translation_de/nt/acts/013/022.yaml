  source_fidelity: '„ließ er David … als König auftreten“ gibt ἤγειρεν εἰς βασιλέα nicht hinreichend wieder: Es bezeichnet Gottes Erhebung/Einsetzung Davids zum König, nicht bloß dessen öffentliches Auftreten. „erhob … zum König“ bewahrt die bildhafte und biblische Ausdrucksweise und macht die königliche Bestimmung klar. Die übrigen zentralen Bezüge sind sachgerecht: Saul wird aus dem Königsamt entfernt, David ist für Israel König, und θελήματά μου wird mit dem Plural „Absichten“ angemessen wiedergegeben.'
