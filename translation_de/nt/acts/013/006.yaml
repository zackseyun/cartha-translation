id: ACT.13.6
reference: Acts 13:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: de
  text: Nachdem sie die ganze Insel bis nach Paphos durchzogen hatten, stießen sie auf einen gewissen Mann, einen Magier und falschen Propheten, einen Juden namens Bar-Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name kann auch „Barjesus“ geschrieben werden. Vermutlich ist er ein semitischer Vatersname mit der Bedeutung „Sohn Jesu“ oder „Sohn Josuas“.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντες
  choice: Nachdem sie … durchzogen hatten
  rationale: Das vorzeitige aoristische Partizip bezeichnet eine Handlung, die dem Hauptverb vorausgeht. Die Formulierung gibt zugleich das Durchqueren der Insel wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ führt hier die Erzählung nur leicht weiter; der deutsche Satzanschluss ist auch ohne ein ausdrückliches „und“ natürlich und vollständig.
- source_word: ὅλην τὴν νῆσον
  choice: die ganze Insel
  rationale: Dies entspricht direkt dem Umfangsausdruck des griechischen Textes und ist im Deutschen idiomatisch.
- source_word: ἄχρι Πάφου
  choice: bis nach Paphos
  rationale: ἄχρι kennzeichnet Paphos als räumlichen Endpunkt; bei Städtenamen ist „bis nach“ natürliches Standarddeutsch.
- source_word: εὗρον
  choice: stießen sie auf
  rationale: Im Reisebericht bezeichnet εὗρον die Begegnung beziehungsweise das Antreffen des Mannes. „Stießen … auf“ klingt hier natürlicher als das möglicherweise nach gezielter Suche klingende „fanden“.
- source_word: ἄνδρα τινὰ
  choice: einen gewissen Mann
  rationale: „gewissen“ bewahrt die leicht individualisierende Unbestimmtheit von τινά, ohne dem Mann eine zusätzliche Eigenschaft zuzuschreiben.
- source_word: μάγον
  choice: einen Magier
  rationale: „Magier“ ist verständlich und wahrt die lexikalische Breite von μάγος. „Zauberer“ würde die Art seiner Betätigung stärker festlegen.
- source_word: ψευδοπροφήτην
  choice: falschen Propheten
  rationale: Die feste deutsche Bezeichnung gibt sowohl den prophetischen Anspruch als auch dessen Falschheit transparent wieder.
- source_word: Ἰουδαῖον
  choice: einen Juden
  rationale: Die substantivische Apposition bezeichnet den Mann als Juden; ein speziell geografischer Sinn „Judäer“ ist hier nicht gefordert.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: namens Bar-Jesus
  rationale: Die knappe deutsche Namensformel gibt die griechische Wendung natürlich wieder. Der Eigenname wird transliteriert und nicht übersetzt.
theological_decisions:
- issue: Wiedergabe des Namens Βαριησοῦ
  choice: Bar-Jesus
  alternative: Barjesus; Sohn Jesu beziehungsweise Sohn Josuas
  rationale: Der Text verwendet die Form als Eigennamen. Die Transliteration vermeidet eine Festlegung darauf, welche deutsche Form des semitischen Namenselements gemeint ist; der Bindestrich macht dessen patronymische Struktur lesbarer.
- issue: Bedeutung von μάγος
  choice: Magier
  alternative: Zauberer
  rationale: „Magier“ erhält die mögliche Bedeutungsbreite des Ausdrucks, während der unmittelbare Zusatz „falscher Prophet“ die negative Beurteilung des Mannes bereits deutlich macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionale Reihung des griechischen Textes bleibt erhalten; der etwas markierte Ausdruck „ein gewisser Mann“ bewahrt die Nuance von τινά.
