id: ACT.13.47
reference: Acts 13:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: de
  text: 'Denn so hat uns der Herr geboten: »Ich habe dich als Licht für die Völker[a] eingesetzt, damit du bis ans äußerste Ende der Erde[b] zum Heil wirst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als Licht für die Nichtjuden. Das griechische Wort kann sowohl „Völker“ als auch „Nichtjuden“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: bis an die Enden der Erde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: Denn so
  rationale: Die Verbindung begründet die vorausgehende Aussage und leitet die maßgebliche Schriftstelle ein. „Denn so“ gibt sowohl γάρ als auch οὕτως knapp und natürlich wieder.
- source_word: ἐντέταλται ἡμῖν
  choice: hat uns … geboten
  rationale: Das Perfekt bezeichnet einen ergangenen Befehl, der weiterhin gilt. Die deutsche Perfektform bewahrt diese gegenwärtige Verbindlichkeit.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die übliche Gottesbezeichnung wahrt den autoritativen und theologischen Gehalt der Schriftanführung.
- source_word: Τέθεικά σε
  choice: Ich habe dich … eingesetzt
  rationale: Das Perfekt von τίθημι bezeichnet hier eine bleibende Bestimmung oder Beauftragung. „Eingesetzt“ ist im Deutschen natürlicher als das wörtliche „gesetzt“ und bleibt nahe am Sinn.
- source_word: εἰς φῶς ἐθνῶν
  choice: als Licht für die Völker
  rationale: Das erste εἰς bezeichnet die Bestimmung zu einer Aufgabe. „Völker“ bewahrt den kollektiven, weltweiten Horizont des Jesajazitats; die mögliche Bedeutung „Nichtjuden“ wird in einer Fußnote genannt.
- source_word: τοῦ εἶναί σε
  choice: damit du … wirst
  rationale: Der artikulierte Infinitiv drückt Zweck beziehungsweise Ergebnis aus. „Damit“ macht diesen Zusammenhang im modernen Deutsch klar.
- source_word: εἰς σωτηρίαν
  choice: zur Rettung
  rationale: Die knappe Formulierung wahrt die Spannung, ob die angesprochene Gestalt selbst als Rettung bezeichnet wird oder der Rettung dient, ohne ausdrücklich ein Mittel oder einen Vorgang einzufügen.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: bis ans äußerste Ende der Erde
  rationale: Die griechische Wendung steht im Singular und bezeichnet den entferntesten Bereich der Erde. „Äußerstes Ende“ gibt ἔσχατον ausdrücklich wieder und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bezug und Anwendung des Jesajazitats auf Paulus und Barnabas
  choice: Das Zitat bleibt in der zweiten Person Singular und wird nicht erläuternd auf Paulus und Barnabas umformuliert.
  alternative: Das Zitat im Plural direkt auf die Missionare beziehen oder Sprecher und Adressaten ausdrücklich benennen.
  rationale: Der griechische Text führt die Schrift im Singular an und lässt das Verhältnis zwischen der Gestalt im Jesajazitat und dem apostolischen Auftrag unausgeführt. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Bedeutung von εἰς σωτηρίαν
  choice: „zur Rettung“
  alternative: „damit du Rettung bringst“ oder „als Retter“
  rationale: Die gewählte Fassung vermeidet es, die angesprochene Person ausdrücklich nur zum Übermittler oder unmittelbar zum Retter zu erklären, da der griechische Ausdruck beides nicht näher entfaltet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Schriftzitat, ohne unnatürlich wörtlich zu werden. „Zur Rettung wirst“ ist bewusst kompakt gehalten, um die Aussage nicht interpretierend auf „Rettung bringen“ zu verengen.
