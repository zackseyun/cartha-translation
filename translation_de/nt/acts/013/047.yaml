  rationale: Lediglich die Wiedergabe von εἰς σωτηρίαν wird von „zur Rettung“ zu „zum Heil“ angepasst. Dadurch wird die deutsche Formulierung idiomatischer und das im Schriftzitat passende theologische Register gewahrt, ohne die knappe und theologisch offene Aussage des Griechischen interpretierend zu erweitern. Die Stellung der Ortsangabe vor der Prädikation erleichtert zudem das Lesen, ohne den Sinn zu verändern.
