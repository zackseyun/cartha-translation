  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ καθελὼν ἔθνη ἑπτὰ ἐν γῇ Χανάαν ⸀κατεκληρονόμησεν τὴν γῆν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: de
  text: Nachdem er sieben Völker im Land Kanaan vernichtet hatte, gab er den Israeliten deren Land als Erbe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „teilte er ihnen deren Land als Erbbesitz zu“. Das griechische Verb kann die Zuteilung oder Verteilung eines Erbes betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: vernichtet hatte
  rationale: Das Partizip von καθαιρέω bezeichnet hier Gottes gewaltsames Beseitigen der kanaanitischen Völker. „Vernichten“ gibt die Aussage klar und in natürlichem Deutsch wieder; „stürzen“ wäre weniger eindeutig.
- source_word: ἔθνη ἑπτὰ
  choice: sieben Völker
  rationale: ἔθνη kann „Völker“ oder „Nationen“ bedeuten. Für die antiken Bevölkerungsgruppen Kanaans ist „Völker“ im Deutschen natürlicher.
- source_word: ἐν γῇ Χανάαν
  choice: im Land Kanaan
  rationale: Die Übersetzung bewahrt das ausdrücklich vorhandene γῇ („Land“) und folgt zugleich geläufigem deutschen Sprachgebrauch.
- source_word: κατεκληρονόμησεν
  choice: gab ... als Erbe
  rationale: Das Verb bezeichnet die Zuteilung beziehungsweise Übertragung als Erbbesitz. Die Formulierung bewahrt das Erbmotiv und ist im Deutschen verständlich.
- source_word: τὴν γῆν αὐτῶν
  choice: deren Land
  rationale: αὐτῶν verweist auf die sieben zuvor genannten Völker. „Deren Land“ macht diesen Bezug eindeutig und vermeidet, dass „ihr Land“ irrtümlich auf die Israeliten bezogen wird.
theological_decisions:
- issue: Subjekt und unausgesprochener Empfänger des Erbes
  choice: Gott ist das Subjekt beider Handlungen; die Israeliten werden als Empfänger ausdrücklich genannt.
  alternative: „... teilte er ihr Land als Erbe zu“, ohne den Empfänger zu nennen.
  rationale: Der unmittelbare Zusammenhang erzählt von Gottes Handeln an Israel. Im Griechischen bleibt der Empfänger unausgesprochen, ist aber aus dem historischen und syntaktischen Zusammenhang erschließbar. „den Israeliten“ ist daher eine transparente Verdeutlichung und keine zusätzliche Lehrfestlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Völker“ ist gegenüber „Nationen“ im kanaanitischen Zusammenhang idiomatischer; „deren Land“ hält den Rückbezug klar. Der Fußnotenmarker steht unmittelbar nach dem Satz.
