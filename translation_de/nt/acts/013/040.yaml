  text: βλέπετε οὖν μὴ ⸀ἐπέλθῃ τὸ εἰρημένον ἐν τοῖς προφήταις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: de
  text: 'Gebt also acht, dass nicht über euch kommt, was in den prophetischen Schriften[a] gesagt ist:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „in den Propheten“; gemeint sind wahrscheinlich die prophetischen Schriften. Möglich ist auch: „durch die Propheten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Gebt acht
  rationale: Der Imperativ in der zweiten Person Plural warnt die Angesprochenen eindringlich. „Gebt acht“ ist im modernen Deutschen natürlich und bewahrt den mahnenden Charakter.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet knapp und idiomatisch die Folgerung aus der vorausgehenden Verkündigung und Warnung.
- source_word: μὴ ἐπέλθῃ
  choice: dass nicht über euch kommt
  rationale: μή mit dem Aorist Konjunktiv nach dem Imperativ formuliert eine abwehrende Warnung. Die Wendung bewahrt sowohl die Negation als auch das Bild eines drohenden Geschehens, das über die Hörer kommt.
- source_word: τὸ εἰρημένον
  choice: was … gesagt ist
  rationale: Die substantivierte Perfekt-Passiv-Form bezeichnet das Gesagte als weiterhin gültige Aussage. „Was … gesagt ist“ gibt dies knapp und schriftbezogen wieder.
- source_word: ἐν τοῖς προφήταις
  choice: bei den Propheten
  rationale: Die deutsche Wendung verweist natürlich auf die prophetischen Schriften als den Ort, an dem die folgende Warnung steht, ohne den Bezug auf die Propheten als Sprecher völlig auszuschließen.
theological_decisions:
- issue: Bezug von „den Propheten“
  choice: Die prophetischen Schriften als Schriftkorpus
  alternative: Die Propheten vor allem als menschliche Sprecher
  rationale: Da unmittelbar ein Zitat aus Habakuk folgt, liegt der Bezug auf das in den prophetischen Schriften Überlieferte nahe. „Bei den Propheten“ hält zugleich die Verbindung zu den prophetischen Sprechern offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit mahnendem und zugleich würdigem Ton. Der Doppelpunkt leitet wie im griechischen Text das folgende Prophetenzitat ein.
