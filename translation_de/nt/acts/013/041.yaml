id: ACT.13.41
reference: Acts 13:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: de
  text: Seht her, ihr Verächter[a], staunt und geht zugrunde[b]! Denn ich vollbringe in euren Tagen ein Werk, ein Werk, das ihr gewiss nicht glauben werdet, wenn es euch jemand ausführlich erzählt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Spötter«. Das griechische Wort bezeichnet Menschen, die etwas geringschätzen oder verächtlich behandeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verschwindet« beziehungsweise »werdet vernichtet«. Das Zitat folgt Habakuk 1,5 in der griechischen Fassung und enthält eine eindringliche Warnung vor dem Untergang.'
    reason: alternative_reading
  - marker: c
    text: Das griechische Verb kann auch »vollständig berichten« oder »im Einzelnen erzählen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Seht her
  rationale: Der Aoristimperativ fordert nachdrücklich zur Aufmerksamkeit auf. »Seht her« ist gegenwärtiges, natürliches Deutsch und bewahrt den prophetischen Nachdruck.
- source_word: καταφρονηταί
  choice: Verächter
  rationale: Das Wort bezeichnet Menschen, die etwas geringschätzen oder mit Verachtung behandeln. »Verächter« bildet diesen Grundsinn genauer ab als das stärker auf Spott eingeengte »Spötter«.
- source_word: θαυμάσατε
  choice: staunt
  rationale: Der Imperativ bezeichnet erschrockenes oder verwundertes Staunen und bewahrt hier den scharfen, prophetischen Ton.
- source_word: ἀφανίσθητε
  choice: geht zugrunde
  rationale: Die passive Imperativform warnt vor Vernichtung beziehungsweise Untergang. »Geht zugrunde« ist idiomatisch und lässt zugleich den Anklang an Verschwinden und Verderben erkennen.
- source_word: ἔργον
  choice: Werk
  rationale: »Werk« ist die etablierte und hinreichend weite Bezeichnung für ein bedeutsames göttliches Handeln.
- source_word: ἐργάζομαι ἐγώ
  choice: ich vollbringe
  rationale: Das ausdrücklich gesetzte ἐγώ betont Gottes eigenes Handeln. »Ich vollbringe« verbindet sich im Deutschen natürlich mit »ein Werk« und gibt die zielgerichtete Handlung würdig wieder.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: in euren Tagen
  rationale: Die Wendung bewahrt die zeitliche Nähe und die unmittelbare Anrede.
- source_word: οὐ μὴ πιστεύσητε
  choice: ihr gewiss nicht glauben werdet
  rationale: Die Verbindung οὐ μή mit dem Aoristsubjunktiv drückt eine besonders starke Verneinung aus; »gewiss nicht« gibt diesen Nachdruck in natürlichem Deutsch wieder.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: wenn es euch jemand ausführlich erzählt
  rationale: ἐκδιηγέομαι kann ein eingehendes oder vollständiges Berichten bezeichnen. »Ausführlich erzählt« macht diese Nuance sichtbar, ohne den Satz unnötig auszubauen.
theological_decisions:
- issue: Schärfe der prophetischen Warnung im Habakuk-Zitat
  choice: Die Gerichtswarnung mit »geht zugrunde« und die nachdrückliche Verneinung mit »gewiss nicht glauben« unverändert scharf wiedergeben.
  alternative: »Verschwindet« für eine formal engere Wiedergabe oder eine abgeschwächte Formulierung ohne ausdrücklichen Untergang verwenden.
  rationale: Der Kontext warnt feierlich davor, Gottes Handeln verächtlich zurückzuweisen. Die Übersetzung darf weder die Gerichtsdimension noch den Nachdruck des Unglaubens mildern, soll aber die lexikalische Alternative in einer Fußnote offenhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die imperativische Dreierfolge bleibt knapp und eindringlich; altertümliche Wörter und konfessionell geprägte Zusätze werden vermieden.
