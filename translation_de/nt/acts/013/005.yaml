review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzglieder und den Sinn des griechischen Textes insgesamt zuverlässig wieder. Die Formulierung „Auch Johannes hatten sie“ kann im Deutschen jedoch nahelegen, Johannes selbst sei zusätzlich zu anderen Personen gemeint; καί fügt hier primär den Besitz bzw. das Bei-sich-Haben Johannes hinzu.
  naturalness: „Als sie nach Salamis gekommen waren“ ist verständlich, aber „Als sie in Salamis ankamen“ ist im modernen Standarddeutsch idiomatischer und bildet die temporale Funktion des Partizips klar ab. „Sie hatten auch Johannes als Helfer bei sich“ ist eine natürliche, eindeutige Satzstellung.
  terminology: „Wort Gottes“, „Synagogen der Juden“ und „Helfer“ sind sachgerecht. Die Fußnote sollte moderne, tatsächlich einschlägige Alternativen zu ὑπηρέτης bieten; „Gehilfe“ wirkt heute veraltet.
  issues:
