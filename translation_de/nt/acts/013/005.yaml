    issue: Stellung von „Auch Johannes“
    rationale: Die Voranstellung kann das additive „auch“ auf Johannes selbst fokussieren. Eine Stellung nach dem Verb gibt εἶχον δὲ καὶ Ἰωάννην eindeutiger wieder.
  - severity: low
    issue: Unnatürliche Vorvergangenheit und Fußnotenalternative „Gehilfen“
    rationale: „Ankamen“ ist für die temporale Partizipialkonstruktion flüssiger. „Gehilfe“ ist im gegenwärtigen Standarddeutsch überwiegend veraltet.
