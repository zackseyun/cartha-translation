  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: de
  text: Als sie in Salamis ankamen, verkündeten sie das Wort Gottes in den Synagogen der Juden. Sie hatten auch Johannes als Helfer bei sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Assistenten“, „als Diener“ oder „als Begleiter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: als sie nach Salamis gekommen waren
  rationale: Die Verbindung des Aoristpartizips von γίνομαι mit einer Ortsangabe bezeichnet hier idiomatisch das Eintreffen in Salamis. Die temporale Wiedergabe ist im Deutschen natürlich und bewahrt das Verhältnis zur folgenden Haupthandlung.
- source_word: κατήγγελλον
  choice: verkündeten
  rationale: καταγγέλλω bezeichnet ein öffentliches Bekanntmachen oder Verkünden. „Verkündeten“ trifft den feierlich-öffentlichen Charakter, ohne die Tätigkeit auf eine Predigtform einzuengen.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die traditionelle, transparente Formulierung bewahrt die Genitivverbindung und lässt offen, ob besonders Gottes Botschaft, Offenbarung oder gesprochenes Wort im Blick ist.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: in den Synagogen der Juden
  rationale: „Synagogen“ ist hier die präzise Bezeichnung. Ἰουδαῖοι meint in diesem Zusammenhang die jüdische ethnisch-religiöse Gemeinschaft, nicht speziell Bewohner Judäas.
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: Auch Johannes hatten sie … dabei
  rationale: Die Voranstellung von „Auch“ gibt die additive Kraft von καί wieder; „dabei“ macht die Reise- und Begleitsituation in natürlichem Deutsch deutlich, ohne eine zusätzliche Rolle einzuführen.
- source_word: ὑπηρέτην
  choice: als Helfer
  rationale: ὑπηρέτης bezeichnet einen untergeordneten Helfer, Assistenten oder Diener. „Helfer“ ist im heutigen Deutsch verständlich und vermeidet sowohl moderne Berufsassoziationen von „Assistent“ als auch die möglicherweise zu starke Unterordnung in „Diener“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am griechischen Text; der zweite Satz wird für natürliche deutsche Lesbarkeit eigenständig formuliert. Der Fußnotenmarker steht unmittelbar bei der übersetzungsbedingten Rollenbezeichnung.
