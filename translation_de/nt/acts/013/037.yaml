  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Kontrast des griechischen Textes zuverlässig wieder: ὃν als substantiviertes Relativpronomen, δέ als kontrastierendes „Doch“, Gottes Handeln im Aorist von ἐγείρω sowie die Negation „hat die Verwesung nicht gesehen“. „Auferweckt hat“ trifft im unmittelbaren Kontext den Auferstehungssinn präzise. Die bildhafte Wendung „die Verwesung sehen“ bewahrt den Bezug zu Psalm 16.'
  naturalness: „Doch der, den Gott auferweckt hat, hat die Verwesung nicht gesehen“ ist modernes, verständliches und zugleich würdiges Standarddeutsch. Die Wiederholung von „hat“ ist grammatisch und stilistisch unauffällig; die bewusst bibelsprachliche Formulierung bleibt gut verständlich.
  terminology: „Auferweckt“ ist für ἤγειρεν im Kontext angemessen, und „Verwesung“ ist eine präzise Wiedergabe von διαφθορά in Bezug auf den körperlichen Zerfall. Die Fußnote bietet mit „Verfall“ eine vertretbare lexikalische Alternative und erläutert sachgerecht den Bezug zur griechischen Psalmüberlieferung.
