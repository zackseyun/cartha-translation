  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: de
  text: Doch der, den Gott auferweckt hat, hat die Verwesung[a] nicht gesehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Verfall“. Das griechische Wort bezeichnet hier den körperlichen Zerfall und greift die Formulierung aus Psalm 16,10 in der griechischen Übersetzung auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: der, den
  rationale: Das Relativpronomen nimmt die zuvor behandelte Person, Jesus, auf; die substantivierte Formulierung ist im Deutschen klar und bildet die Objektfunktion von ὃν natürlich ab.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier den Gegensatz zu David, der starb und die Verwesung sah.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Die im Deutschen idiomatische Wiedergabe des artikulierten θεός lautet in diesem Zusammenhang schlicht „Gott“.
- source_word: ἤγειρεν
  choice: auferweckt hat
  rationale: Im unmittelbaren Gegensatz zu Davids Tod und Verwesung bezeichnet ἐγείρω hier Gottes Auferweckung Jesu von den Toten.
- source_word: οὐκ εἶδεν
  choice: hat … nicht gesehen
  rationale: Die wörtliche Wendung „die Verwesung sehen“ bewahrt den sprachlichen Anschluss an Psalm 16 und bleibt im Deutschen verständlich.
- source_word: διαφθοράν
  choice: Verwesung
  rationale: Das Wort bezeichnet hier angesichts von Tod, Grab und Auferweckung den körperlichen Zerfall; „Verwesung“ ist präzise und verständlich.
theological_decisions:
- issue: Bedeutung von ἤγειρεν im Auferstehungskontext
  choice: „auferweckt hat“, bezogen auf Gottes Auferweckung Jesu von den Toten
  alternative: „erweckt/auftreten lassen“ im Sinn von berufen oder in Erscheinung treten lassen
  rationale: Der unmittelbare Kontrast gilt David, der starb und Verwesung sah. Dass der von Gott Auferweckte die Verwesung nicht sah, macht den Auferstehungssinn hier kontextuell maßgeblich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ stellt den knappen Kontrast zu David her; „die Verwesung sehen“ bewahrt bewusst die biblische Bildsprache und den Bezug zum unmittelbar zuvor angeführten Psalm.
