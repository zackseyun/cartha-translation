id: ACT.13.15
reference: Acts 13:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: de
  text: 'Nach der Lesung aus dem Gesetz und den Propheten ließen die Synagogenvorsteher ihnen sagen: »Brüder[a], wenn jemand von euch ein Wort der Ermutigung[b] für das Volk hat, dann sprecht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Männer, Brüder«; eine respektvolle, familiäre Anrede.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein Wort der Ermahnung«. Das griechische Wort kann sowohl Ermutigung als auch Ermahnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: Lesung
  rationale: Im Zusammenhang des Synagogengottesdienstes bezeichnet das Wort das öffentliche Vorlesen der Schrift; »Lesung« ist im Deutschen natürlich und präzise.
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: aus dem Gesetz und den Propheten
  rationale: Die Wendung bezeichnet die anerkannten Schriftbereiche. Das im Deutschen bei »Lesung« idiomatische »aus« gibt den Sinn treffend wieder.
- source_word: ἀπέστειλαν … πρὸς αὐτοὺς
  choice: ließen … ihnen sagen
  rationale: Mit der anschließenden direkten Rede geht es um die Übermittlung einer Aufforderung. Diese Formulierung ist natürlicher als ein wörtliches »sandten zu ihnen«.
- source_word: ἀρχισυνάγωγοι
  choice: Synagogenvorsteher
  rationale: Bezeichnet die für Ordnung und Ablauf in der Synagoge verantwortlichen Leiter, nicht weltliche Herrscher.
- source_word: Ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Die knappe Anrede bewahrt den respektvollen, familiären Ton; die wörtlichere Form wird in einer Fußnote angegeben.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν λόγος
  choice: wenn jemand von euch ein Wort … hat
  rationale: Gibt die etwas unpersönliche griechische Konstruktion in natürlichem modernem Deutsch wieder, ohne ihren bedingten Charakter zu verändern.
- source_word: λόγος παρακλήσεως
  choice: Wort der Ermutigung
  rationale: παράκλησις umfasst sowohl Ermutigung als auch ermahnenden Zuspruch. Die gewählte Formulierung bleibt weit genug; die Alternative wird in der Fußnote genannt.
- source_word: πρὸς τὸν λαόν
  choice: für das Volk
  rationale: Bezeichnet die versammelte Gemeinde als Adressatin des Beitrags.
- source_word: λέγετε
  choice: dann sprecht
  rationale: Der Imperativ im Plural fordert Paulus und seine Begleiter dazu auf, zur Versammlung zu reden; »dann« macht die deutsche Bedingungsfolge natürlich.
theological_decisions:
- issue: Geschlechtsspezifische Anrede im Synagogengottesdienst
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Ἄνδρες ἀδελφοί ist ausdrücklich maskulin und richtet sich hier an die männlichen Besucher, die zum Sprechen eingeladen werden. Daher wird die Anrede nicht verallgemeinert.
- issue: Bedeutung von παράκλησις
  choice: Ermutigung
  alternative: Ermahnung
  rationale: Das griechische Wort kann ermutigenden wie ermahnenden Zuspruch bezeichnen. Der Haupttext wählt die im Einladungskontext natürliche Wiedergabe, während die Fußnote die echte Bedeutungsbreite offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzführung ist idiomatisch, während die Schriftbezeichnungen und die Mehrdeutigkeit von παράκλησις erhalten bleiben.
