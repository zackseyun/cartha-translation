source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: de
  text: 'Paulus und Barnabas sagten freimütig: „Euch musste das Wort Gottes zuerst verkündet werden. Weil ihr es zurückweist und euch selbst des ewigen Lebens nicht für würdig erachtet, seht: Wir wenden uns nun den Nichtjuden zu.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Völkern“. Im Gegensatz zur jüdischen Synagogengemeinde sind hier Nichtjuden gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: offen und mutig
  rationale: Das Partizip bezeichnet freimütiges, unerschrockenes Reden. Die adverbiale Wiedergabe verbindet es natürlich mit εἶπαν, ohne den Gedanken auf bloße Lautstärke oder Kühnheit zu verengen.
- source_word: Ὑμῖν ἦν ἀναγκαῖον
  choice: Euch musste
  rationale: Die Konstruktion drückt die Notwendigkeit aus, dass diese Zuhörer die Botschaft zuerst hören sollten. „Musste“ ist im Deutschen natürlich und bewahrt den starken Notwendigkeitscharakter.
- source_word: πρῶτον
  choice: zuerst
  rationale: Kennzeichnet die zeitliche beziehungsweise heilsgeschichtliche Priorität dieser Hörerschaft, ohne eine darüber hinausgehende Erklärung in den Text einzutragen.
- source_word: λαληθῆναι τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes … verkündet werden
  rationale: λαλέω bedeutet grundlegend „reden“, doch beim Wort Gottes bezeichnet der passive Infinitiv hier dessen öffentliche Mitteilung. „Verkündet“ ergibt im Deutschen einen natürlichen und kontextgerechten Satz.
- source_word: ἀπωθεῖσθε αὐτόν
  choice: ihr es … zurückweist
  rationale: ἀπωθέομαι bezeichnet ein Wegstoßen oder entschiedenes Zurückweisen. Das Pronomen „es“ verweist grammatisch auf „das Wort Gottes“.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτούς
  choice: euch selbst … nicht für würdig erachtet
  rationale: 'Die Formulierung bewahrt die reflexive Aussage: Durch ihre Reaktion fällen die Angesprochenen ein Urteil über sich selbst. „Erachten“ gibt κρίνετε hier idiomatisch wieder.'
- source_word: ἰδού
  choice: seht
  rationale: Der Aufmerksamkeitsruf wird ausdrücklich wiedergegeben und hebt die nun angekündigte Wendung hervor.
- source_word: στρεφόμεθα εἰς τὰ ἔθνη
  choice: wir wenden uns nun den anderen Völkern zu
  rationale: „Völker“ wahrt den Grundsinn von ἔθνη; „anderen“ macht im unmittelbaren Gegensatz zur jüdischen Synagogengemeinde verständlich, dass nichtjüdische Menschen gemeint sind. „Nun“ verdeutlicht die im Präsens angekündigte Wende.
theological_decisions:
- issue: Bedeutung von τὰ ἔθνη im heilsgeschichtlichen Zusammenhang
  choice: die anderen Völker
  alternative: die Nichtjuden / die Heiden
  rationale: Der Kontext stellt die Synagogenzuhörer den nichtjüdischen Völkern gegenüber. „Die anderen Völker“ bewahrt den ethnischen Grundsinn und macht den Gegensatz verständlich, ohne die im heutigen Deutsch teils abwertend oder religiös anders klingende Bezeichnung „Heiden“ zu verwenden.
- issue: Aussage von οὐκ ἀξίους κρίνετε ἑαυτούς τῆς αἰωνίου ζωῆς
  choice: euch selbst des ewigen Lebens nicht für würdig erachtet
  alternative: von Paulus für des ewigen Lebens unwürdig erklärt
  rationale: Das Griechische weist das Urteilen ausdrücklich den Hörern selbst zu. Die Übersetzung wahrt diese reflexive Spannung und macht daraus kein von Paulus gesprochenes objektives Verdammungsurteil.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Offen und mutig“ gibt die Freimütigkeit des Redens verständlich wieder. „Das Wort Gottes“ hält die etablierte biblische Wendung fest; „verkündet“ vermeidet den im Deutschen schwerfälligen Passivsatz „gesprochen werden“. Der Doppelpunkt nach „seht“ bewahrt den hervorgehobenen Übergang.
