source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: de
  text: Als die Nichtjuden dies hörten, freuten sie sich und priesen das Wort des Herrn, und alle, die zum ewigen Leben bestimmt waren[a], glaubten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf das ewige Leben ausgerichtet waren“. Das griechische Partizip wird unterschiedlich verstanden; die passive Wiedergabe „bestimmt waren“ liegt grammatisch am nächsten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: Als … das hörten
  rationale: Das adverbiale Präsenspartizip bezeichnet den begleitenden Umstand. Im Deutschen gibt ein temporaler Nebensatz dies natürlich wieder; „das“ nimmt die zuvor verkündete Aussage aus dem Zusammenhang auf.
- source_word: τὰ ἔθνη
  choice: die Menschen aus den anderen Völkern
  rationale: Gemeint sind im Kontext die nichtjüdischen Zuhörer. Diese Formulierung bewahrt den Bezug auf „Völker“, ohne das heute leicht abwertend klingende Wort „Heiden“ zu verwenden.
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: freuten sie sich und priesen
  rationale: Die beiden Imperfektformen schildern die einsetzende beziehungsweise andauernde Reaktion. Das deutsche Präteritum ist hier natürlich und fügt keine zwingend inchoative Nuance wie „begannen“ hinzu.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: das Wort des Herrn
  rationale: „Wort“ bewahrt die biblische Ausdrucksweise und bezeichnet hier die verkündete Botschaft; „Herr“ gibt κύριος in diesem christlichen Kontext angemessen wieder.
- source_word: ἐπίστευσαν
  choice: glaubten
  rationale: Der Aorist wird knapp und ohne interpretierende Erweiterung wiedergegeben.
- source_word: ὅσοι
  choice: alle, die
  rationale: Die quantitative Bedeutung wird in natürlichem Deutsch mit „alle, die“ wiedergegeben.
- source_word: τεταγμένοι
  choice: bestimmt waren
  rationale: Das Perfektpartizip Passiv von τάσσω bezeichnet am naheliegendsten einen bestehenden Zustand infolge einer Bestimmung oder Einordnung. „Bestimmt waren“ wahrt die passive Form, ohne den Vers zu einer weitergehenden Lehrformel auszubauen.
- source_word: εἰς ζωὴν αἰώνιον
  choice: zum ewigen Leben
  rationale: „Zum“ gibt εἰς mit seiner Zielrichtung knapp und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von τεταγμένοι im Verhältnis von Bestimmung und menschlicher Glaubensantwort
  choice: zum ewigen Leben bestimmt waren
  alternative: auf das ewige Leben ausgerichtet waren
  rationale: Die passive Bedeutung „bestimmt/eingeordnet“ entspricht Form und Kontext am unmittelbarsten. Da das Wort jedoch auch als Ausrichtung oder innere Bereitschaft verstanden worden ist, wird diese Möglichkeit in einer Fußnote genannt, ohne die theologische Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschen aus den anderen Völkern“ vermeidet das missverständliche oder abwertend wirkende „Heiden“ und macht zugleich den jüdisch-nichtjüdischen Gegensatz des Zusammenhangs deutlich.
