id: ACT.13.4
reference: Acts 13:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: de
  text: So zogen sie, vom Heiligen Geist ausgesandt, hinunter nach Seleukia und segelten von dort nach Zypern ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτοὶ
  choice: sie
  rationale: Das ausdrücklich gesetzte Pronomen trägt eine leichte Hervorhebung. Im Deutschen gibt „So zogen sie“ diese im Zusammenhang natürlich wieder, ohne das schwerere „sie selbst“ zu erzwingen.
- source_word: μὲν οὖν
  choice: So
  rationale: Die Verbindung führt die Erzählung folgernd aus der vorherigen Aussendung weiter. „So“ ist im modernen deutschen Erzählstil natürlicher als ein starres „daher“; μέν verlangt hier keine eigene Wiedergabe.
- source_word: ἐκπεμφθέντες
  choice: ausgesandt
  rationale: Das Partizip ist passiv und bezeichnet eine der Hauptbewegung vorausgehende Aussendung. Die Konstruktion „vom Heiligen Geist ausgesandt“ wahrt die Agensangabe und fügt sich idiomatisch in den Satz ein.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: vom Heiligen Geist
  rationale: ὑπό mit Genitiv bezeichnet den Handelnden. Die Großschreibung entspricht dem persönlichen göttlichen Akteur im Kontext der Apostelgeschichte und üblichem deutschem Sprachgebrauch.
- source_word: κατῆλθον
  choice: zogen … hinunter
  rationale: Das Verb bezeichnet eine Bewegung hinab, hier wahrscheinlich zur Küste. „zogen … hinunter“ bewahrt den konkreten Richtungssinn und klingt bei einer Reisegruppe natürlich.
- source_word: εἰς Σελεύκειαν
  choice: nach Seleukia
  rationale: Bei einer Stadt als Reiseziel ist „nach“ idiomatisches Deutsch. Der Ortsname wird in der im Deutschen gebräuchlichen Form „Seleukia“ wiedergegeben.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Die Ortsangabe bezeichnet den Ausgangspunkt der anschließenden Seereise und wird unmittelbar und idiomatisch übersetzt.
- source_word: τε
  choice: und
  rationale: Die enklitische Konjunktion verbindet die zweite Reisehandlung mit der ersten; schlichtes „und“ bildet ihre erzählerische Funktion angemessen ab.
- source_word: ἀπέπλευσαν
  choice: segelten … ab
  rationale: Das Kompositum bezeichnet das Aufbrechen beziehungsweise Wegsegeln. „segelten … ab“ erhält gegenüber bloßem „segelten“ den Gedanken der Abfahrt.
- source_word: εἰς Κύπρον
  choice: nach Zypern
  rationale: Für die Insel als Reiseziel ist „nach Zypern“ die natürliche deutsche Form.
theological_decisions:
- issue: Wiedergabe von ἁγίου πνεύματος
  choice: dem Heiligen Geist
  alternative: dem heiligen Geist
  rationale: Im Erzählzusammenhang handelt der Geist als persönlicher göttlicher Akteur, der aussendet. Die konventionelle Großschreibung „Heiliger Geist“ macht diesen Referenten kenntlich, ohne über die im Text ausgesagte Urheberschaft hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Satzstellung hält die Aussendung durch den Heiligen Geist eng bei den ausgesandten Personen und bewahrt zugleich die beiden aufeinanderfolgenden Reisehandlungen.
