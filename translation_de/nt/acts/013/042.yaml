review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Genitivus absolutus, Imperfekt von παρακαλέω, den passiven Infinitiv und die Zeitangabe im Wesentlichen zutreffend wieder. »die anderen« fügt jedoch eine im SBLGNT-Text nicht vorhandene Abgrenzung der handelnden Gruppen ein und löst damit die bewusst erhaltene Referenzoffenheit teilweise auf.
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch. Ohne »die anderen« bleibt die Wiederholung von »sie/ihnen« zwar referenziell offen, entspricht aber gerade der Offenheit des griechischen Textes und ist sprachlich tragfähig.
  terminology: »eindringlich baten«, »am nächsten Sabbat« und »diese Worte« sind angemessen. »Sabbat« ist die übliche sachgerechte Bezeichnung. Keine theologisch geprägte Terminologie ist problematisch.
