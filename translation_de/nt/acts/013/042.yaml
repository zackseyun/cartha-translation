  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: de
  text: Als sie hinausgingen[a], baten sie eindringlich darum, dass ihnen am nächsten Sabbat diese Worte gesagt würden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften formulieren ausführlicher: »Als Paulus und Barnabas hinausgingen, baten die Leute eindringlich darum …«'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Als sie weggingen, baten sie darum, dass ihnen diese Dinge am kommenden Sabbat gesagt würden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων δὲ αὐτῶν
  choice: Als sie hinausgingen
  rationale: Der Genitivus absolutus wird als gleichzeitiger temporaler Nebensatz wiedergegeben. Das Pronomen bleibt unbestimmt und legt nicht ausdrücklich fest, wer hinausging.
- source_word: παρεκάλουν
  choice: baten die anderen eindringlich
  rationale: Der Imperfekt bezeichnet ein anhaltendes oder wiederholtes Bitten; »eindringlich bitten« trifft hier die Stärke von παρακαλέω. Im Deutschen muss das unausgesprochene Subjekt vom zuvor genannten »sie« unterscheidbar gemacht werden; »die anderen« wahrt die Rollenverteilung, ohne eine Gruppe namentlich festzulegen.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: am nächsten Sabbat
  rationale: Die Wendung bezeichnet in diesem Zusammenhang den folgenden Sabbat; die gewählte Formulierung ist natürliches modernes Deutsch.
- source_word: λαληθῆναι αὐτοῖς
  choice: dass ihnen … gesagt würden
  rationale: Der passive Infinitiv mit Dativ wird idiomatisch durch einen dass-Satz im Passiv wiedergegeben.
- source_word: τὰ ῥήματα ταῦτα
  choice: diese Worte
  rationale: Die Wiedergabe bleibt nahe an ῥήματα und verweist auf die zuvor gehaltene Rede, ohne sie deutend als »Botschaft« zu bezeichnen.
theological_decisions:
- issue: Bezug der Pronomen und textkritische Explizierung der Beteiligten
  choice: Der Haupttext nennt weder Paulus und Barnabas noch das Volk ausdrücklich, sondern unterscheidet nur zwischen den Hinausgehenden und »den anderen«.
  alternative: 'Einige Handschriften formulieren ausdrücklich: Paulus und Barnabas gingen hinaus, und die Leute baten darum.'
  rationale: Der SBLGNT-Text bietet lediglich αὐτῶν und ein unausgesprochenes Subjekt zu παρεκάλουν. Die Übersetzung soll die Beteiligten daher nicht genauer identifizieren, als es der gewählte griechische Text tut; zugleich erfordert verständliches Deutsch eine erkennbare Unterscheidung der beiden Gruppen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Ablauf nahe, vermeidet aber ein im Deutschen missverständliches doppeltes »sie«. Sämtliche Fußnotenmarker stehen im Haupttext.
