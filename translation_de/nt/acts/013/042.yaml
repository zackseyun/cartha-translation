    rationale: Das griechische παρεκάλουν hat kein ausdrücklich genanntes Subjekt. »die anderen« behauptet eine Gegenüberstellung zu den Hinausgehenden, die der SBLGNT-Text nicht markiert. Der englische Audit Trail hält die Mehrdeutigkeit mit »they« ausdrücklich fest.
  - severity: low
    issue: Die lexikalische Alternativfußnote wiederholt »die anderen«
    rationale: Auch die Fußnote sollte die alternative Wiedergabe von Ἐξιόντων und ῥήματα bieten, ohne zusätzlich eine nicht im Ausgangstext ausgedrückte Gruppentrennung einzuführen.
