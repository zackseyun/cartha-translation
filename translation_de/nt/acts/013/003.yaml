  verdict: approve
  source_fidelity: Die Übersetzung gibt die Abfolge von τότε, den drei aoristischen Partizipien und ἀπέλυσαν zuverlässig wieder. „Daraufhin“ trifft den anschließenden bzw. folgernden Charakter von τότε. „Fasteten und beteten sie, legten ihnen die Hände auf und ließen sie ziehen“ erhält die im Deutschen natürlich darstellbare Reihenfolge der vorbereitenden Handlungen vor dem Weggehen. „Ließen sie ziehen“ ist für ἀπέλυσαν kontextgemäß und wahrt dessen Spielraum gegenüber einer stärker interpretierenden Wiedergabe wie „sandten sie aus“.
  naturalness: Modernes Standarddeutsch, flüssig und mit angemessen sachlich-würdigem Erzählton. Die Wortstellung und die idiomatische Wendung „jemandem die Hände auflegen“ sind natürlich.
  terminology: „Die Hände auflegen“ bewahrt die konkrete Handlung und legt weder Weihe noch Ordination oder eine bestimmte sakramentale Deutung fest. Die Fußnote bietet sinnvolle lexikalische Alternativen zu ἀπέλυσαν und erklärt die kontextuelle Nuance, ohne sie als alleinige Bedeutung auszugeben.
