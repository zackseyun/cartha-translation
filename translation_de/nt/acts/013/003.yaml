id: ACT.13.3
reference: Acts 13:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε νηστεύσαντες καὶ προσευξάμενοι καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: de
  text: Daraufhin fasteten und beteten sie, legten ihnen die Hände auf und ließen sie ziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entließen sie« beziehungsweise dem Zusammenhang nach: »schickten sie auf den Weg«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Daraufhin
  rationale: Kennzeichnet natürlich die zeitliche und folgerichtige Reaktion auf die zuvor ergangene Weisung.
- source_word: νηστεύσαντες καὶ προσευξάμενοι
  choice: fasteten und beteten sie
  rationale: Die vorzeitigen Aoristpartizipien werden in einer flüssigen deutschen Satzfolge wiedergegeben; die Handlungen gehen dem Hauptverb sachlich voraus.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: legten ihnen die Hände auf
  rationale: Bewahrt die konkrete, im Deutschen geläufige Wendung, ohne ihre kirchenrechtliche oder sakramentale Bedeutung näher festzulegen.
- source_word: ἀπέλυσαν
  choice: ließen sie ziehen
  rationale: Gibt den Grundsinn des Freigebens bzw. Entlassens wieder und passt dazu, dass Barnabas und Saulus zur Reise aufbrechen; vermeidet zugleich, eine formale Aussendung stärker auszudrücken als das griechische Verb.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ gehört zur Wendung der Handauflegung; das Objekt des Hauptverbs ist im Deutschen durch »sie« aus dem Zusammenhang aufgenommen.
theological_decisions:
- issue: Bedeutung der Handauflegung
  choice: Die Handlung wird beschreibend als »legten ihnen die Hände auf« wiedergegeben.
  alternative: Weihe, Ordination, Segnung oder formelle Beauftragung
  rationale: Der Vers nennt die Handlung, bestimmt aber ihren genauen sakramentalen oder kirchenrechtlichen Charakter nicht.
- issue: Charakter des Wegschickens
  choice: »ließen sie ziehen«
  alternative: »sandten sie aus« oder »entließen sie«
  rationale: Die Übersetzung bewahrt die lexikalische Offenheit von ἀπολύω. Im Zusammenhang handelt es sich um das Freigeben zum Missionsauftrag, ohne dass das Verb allein dessen gesamte theologische Bedeutung ausdrückt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die koordinierte Satzfolge klingt natürlich und wahrt die Abfolge von Fasten, Gebet, Handauflegung und Aufbruch.
