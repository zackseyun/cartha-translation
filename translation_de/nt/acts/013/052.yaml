  text: οἵ ⸀τε μαθηταὶ ἐπληροῦντο χαρᾶς καὶ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: de
  text: Und die Jünger wurden mit Freude und dem Heiligen Geist erfüllt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Imperfekt kann auch ein fortdauerndes oder wiederholtes Geschehen ausdrücken: „wurden immer wieder mit Freude und dem Heiligen Geist erfüllt.“'
    reason: Aspektalternative zu ἐπληροῦντο
lexical_decisions:
- source_word: οἵ τε
  choice: Und die
  rationale: τε führt die Erzählung verbindend fort. Das schlichte „Und“ gibt diese Anschlussfunktion im Deutschen natürlich wieder.
- source_word: μαθηταὶ
  choice: Jünger
  rationale: „Jünger“ ist die im neutestamentlichen Zusammenhang etablierte und hier sachlich passende Bezeichnung für die Glaubenden.
- source_word: ἐπληροῦντο
  choice: wurden … erfüllt
  rationale: Die Form ist Imperfekt Passiv. Die deutsche Wendung bewahrt das Passiv; der fortdauernde oder wiederholte Aspekt wird in einer Fußnote erläutert, da „wurden immer wieder erfüllt“ den griechischen Aspekt bereits stärker festlegen würde.
- source_word: χαρᾶς
  choice: mit Freude
  rationale: Nach πληρόω bezeichnet der Genitiv den Inhalt der Erfüllung; im Deutschen ist „mit Freude“ die natürliche Entsprechung.
- source_word: πνεύματος ἁγίου
  choice: dem Heiligen Geist
  rationale: Im Kontext der Apostelgeschichte bezeichnet die artikellose griechische Wendung den göttlichen Heiligen Geist. Der bestimmte Artikel ist im Deutschen idiomatisch.
theological_decisions:
- issue: Ob πνεύματος ἁγίου persönlich als „der Heilige Geist“ oder unpersönlich-qualitativ als „heiliger Geist“ wiederzugeben ist
  choice: dem Heiligen Geist
  alternative: mit heiligem Geist
  rationale: Der Sprachgebrauch der Apostelgeschichte und der unmittelbare Missionskontext sprechen für den persönlich verstandenen göttlichen Geist. Die griechische Artikellosigkeit allein macht die Wendung nicht unbestimmt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem biblischem Register. Die Satzstellung bleibt nah am Griechischen, ohne unnatürlich zu wirken; die aspektuelle Offenheit des Imperfekts wird nicht im Haupttext überbestimmt.
