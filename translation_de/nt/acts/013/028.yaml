id: ACT.13.28
reference: Acts 13:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: de
  text: Und obwohl sie keinen Grund für ein Todesurteil fanden[a], baten sie Pilatus, ihn hinrichten zu lassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keine Anklage fanden, die den Tod verdient hätte“, oder: „keine rechtliche Grundlage für die Todesstrafe fanden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihn töten zu lassen“; wörtlicher: „dass er getötet werde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: keinen Grund für ein Todesurteil
  rationale: αἰτία kann Ursache, Anklagepunkt oder Rechtsgrund bezeichnen. Im gerichtlichen Zusammenhang meint die Wendung einen Grund, der ein Todesurteil rechtfertigen würde. Die gewählte Formulierung gibt diesen rechtlichen Sinn in natürlichem Deutsch wieder.
- source_word: εὑρόντες
  choice: obwohl sie … fanden
  rationale: 'Das Aoristpartizip bezeichnet einen der Haupthandlung vorausgehenden Begleitumstand. Der Kontext legt einen konzessiven Sinn nahe: Trotz des fehlenden Grundes verlangten sie Jesu Hinrichtung.'
- source_word: ᾐτήσαντο
  choice: baten sie
  rationale: αἰτέω bedeutet hier bitten oder ersuchen. Zusammen mit Pilatus als Adressaten und dem Infinitiv bezeichnet es eine an ihn gerichtete Forderung, ohne dass ein stärkeres Verb in den Text eingetragen werden muss.
- source_word: Πιλᾶτον
  choice: Pilatus
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: ihn hinrichten zu lassen
  rationale: ἀναιρέω bedeutet in diesem gerichtlichen Kontext töten beziehungsweise hinrichten. Die Konstruktion mit Pilatus als Adressaten der Bitte wird idiomatisch durch „hinrichten zu lassen“ ausgedrückt.
- source_word: καὶ
  choice: Und
  rationale: καί führt den Erzählgang schlicht weiter; „Und“ bewahrt diese verbindende Funktion.
theological_decisions:
- issue: Konzessive Wiedergabe des Partizipialsatzes
  choice: Und obwohl sie keinen Grund für ein Todesurteil fanden
  alternative: Und als sie keinen Grund für ein Todesurteil fanden / Und nachdem sie keinen Grund für ein Todesurteil gefunden hatten
  rationale: Die griechische Partizipialkonstruktion markiert die Beziehung nicht ausdrücklich als konzessiv. Im Zusammenhang besteht jedoch ein deutlicher Gegensatz zwischen dem fehlenden Rechtsgrund und der anschließenden Bitte um Hinrichtung. „Obwohl“ macht diese im Kontext liegende Spannung sichtbar, ohne sie theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Färbung des Satzes bleibt erhalten; zugleich wird die im Kontext erkennbare Spannung durch „obwohl“ natürlich und verständlich ausgedrückt.
