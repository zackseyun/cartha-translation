  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: de
  text: Nachdem sie alles ausgeführt hatten, was über ihn geschrieben stand, nahmen sie ihn vom Holz[a] herab und legten ihn in ein Grab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bedeutet »Holz« oder »Baum« und kann hier das hölzerne Hinrichtungsinstrument bezeichnen; daher auch »Kreuz«. Die Wortwahl kann an 5. Mose 21,23 erinnern.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nachdem
  rationale: Die Verbindung leitet zeitlich zum nächsten Geschehen über. »Nachdem« gibt die Vorzeitigkeit im Deutschen klar und natürlich wieder.
- source_word: ἐτέλεσαν
  choice: ausgeführt hatten
  rationale: τελέω bezeichnet hier das Zuendebringen bzw. Vollziehen dessen, was geschrieben war. »Ausgeführt hatten« bewahrt den Bezug auf das Handeln der genannten Menschen, ohne die mögliche Erfüllungsdimension auszuschließen.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: alles, was über ihn geschrieben stand
  rationale: Die Formulierung gibt den umfassenden Bezug auf das bereits schriftlich Festgehaltene idiomatisch wieder; »über ihn« entspricht περὶ αὐτοῦ.
- source_word: καθελόντες
  choice: nahmen sie ihn … herab
  rationale: Das vorzeitige Aoristpartizip wird im Deutschen als anschließende finite Handlung wiedergegeben. Das Pronomen »ihn« ist aus dem Zusammenhang eindeutig und für natürliches Deutsch erforderlich.
- source_word: ἀπὸ τοῦ ξύλου
  choice: vom Holz
  rationale: ξύλον bedeutet »Holz« oder »Baum« und kann das hölzerne Hinrichtungsinstrument bezeichnen. »Holz« wahrt die besondere griechische Wortwahl und ihren möglichen Schriftanklang, statt sie im Haupttext mit »Kreuz« zu harmonisieren.
- source_word: ἔθηκαν
  choice: legten
  rationale: τίθημι bedeutet allgemein »setzen, stellen, legen«; bei der Bestattung eines Leichnams ist »legten« die natürliche deutsche Wiedergabe.
- source_word: εἰς μνημεῖον
  choice: in ein Grab
  rationale: μνημεῖον bezeichnet hier eine Grabanlage bzw. ein Grab. »Grab« ist im modernen Standarddeutsch klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe von ξύλον im Passionszusammenhang
  choice: Holz
  alternative: Kreuz; Baum
  rationale: Der griechische Text hat ξύλον, nicht σταυρός. »Holz« bewahrt die lexikalische Gestalt und den möglichen Anklang an 5. Mose 21,23. Dass sachlich das Kreuz als Hinrichtungsinstrument gemeint ist, wird in der Fußnote erläutert.
- issue: Bedeutungsnuance von ἐτέλεσαν
  choice: ausgeführt hatten
  alternative: erfüllt hatten; vollendet hatten
  rationale: Die Formulierung lässt erkennen, dass menschliche Handlungen das schriftlich Vorausgesagte zur Ausführung brachten, ohne durch »erfüllt« den theologischen Erfüllungsaspekt stärker festzulegen, als das Verb allein verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge ist flüssig, während »vom Holz« die markante Ausdrucksweise des griechischen Textes bewahrt; die notwendige Erklärung steht in der Fußnote.
