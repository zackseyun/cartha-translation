revisions:
- from: Und wir verkünden euch die gute Nachricht von der Verheißung, die an die Väter ergangen ist.[a]
  to: Und wir selbst verkünden euch die Verheißung, die an die Väter ergangen ist, als gute Nachricht.[a]
  rationale: Die Revision stellt die Verheißung unmittelbar als den Inhalt dar, der als gute Nachricht verkündet wird, statt sie lediglich als Gegenstand einer Nachricht erscheinen zu lassen. „Wir selbst“ gibt die Hervorhebung des ausdrücklich gesetzten griechischen Pronomens wieder. Die übrigen Entscheidungen, einschließlich der Fußnotenverankerung, bleiben erhalten.
