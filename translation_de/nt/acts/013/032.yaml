  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: de
  text: Und wir selbst verkünden euch die Verheißung, die an die Väter ergangen ist, als gute Nachricht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Vorfahren“. Wörtlich steht im Griechischen „die Väter“, eine heilsgeschichtliche Bezeichnung für Israels Vorväter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den einfachen Anschluss an den vorausgehenden Gedankengang, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen wird durch „wir“ wiedergegeben. Ein zusätzliches „selbst“ klänge im Deutschen kontrastiver, als der Zusammenhang zwingend verlangt.
- source_word: ὑμᾶς
  choice: euch
  rationale: Beim deutschen Verb „verkünden“ wird der angesprochene Personenkreis idiomatisch als Dativobjekt ausgedrückt.
- source_word: εὐαγγελιζόμεθα
  choice: verkünden … die gute Nachricht
  rationale: Gibt den Sinn des Verkündigens einer guten Botschaft natürlich wieder, ohne auf kirchliche Fachsprache angewiesen zu sein.
- source_word: τὴν … ἐπαγγελίαν
  choice: die Verheißung
  rationale: „Verheißung“ bezeichnet hier treffend Gottes verbindliche Zusage und entspricht dem biblischen, aber weiterhin verständlichen deutschen Sprachgebrauch.
- source_word: πρὸς τοὺς πατέρας
  choice: an die Väter
  rationale: „An“ bezeichnet im Deutschen idiomatisch die Empfänger der Verheißung. „Die Väter“ bewahrt die männliche, heilsgeschichtliche Bezeichnung des griechischen Textes, ohne ein nicht vorhandenes Possessivpronomen einzufügen.
- source_word: γενομένην
  choice: die … ergangen ist
  rationale: Die Formulierung gibt das attributive Partizip als eine Verheißung wieder, die an die Väter gelangte beziehungsweise ihnen gegeben wurde. Sie nimmt die im folgenden Vers genannte Erfüllung nicht vorweg.
theological_decisions:
- issue: Wiedergabe von πατέρες
  choice: die Väter
  alternative: die Vorfahren
  rationale: Der Ausgangstext verwendet ausdrücklich die männliche Familienbezeichnung und meint im heilsgeschichtlichen Zusammenhang Israels Väter. Die verständlichere, geschlechtsübergreifend wirkende Alternative „Vorfahren“ wird in der Fußnote genannt, aber nicht an die Stelle des konkreteren Ausgangsausdrucks gesetzt.
- issue: Bezug von γενομένην
  choice: die an die Väter ergangen ist
  alternative: die den Vätern gegeben wurde / die an den Vätern erfüllt wurde
  rationale: Das Partizip beschreibt hier die an die Väter gelangte beziehungsweise ihnen gegebene Verheißung. „Erfüllt“ würde die Aussage des folgenden Verses vorwegnehmen und daher zu viel in diesen Vers hineintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gute Nachricht“ bleibt allgemein verständlich; „Verheißung“ und „die Väter“ bewahren den biblisch-heilsgeschichtlichen Klang. Die Satzstellung ist natürlich und folgt zugleich eng der Gedankenführung des griechischen Textes.
