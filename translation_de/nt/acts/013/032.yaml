review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Anschluss, den Adressaten, das Verkündigen, die Verheißung und deren Bezug auf die Väter im Wesentlichen zutreffend wieder. Die Präposition „von“ in „die gute Nachricht von der Verheißung“ legt jedoch eher eine Nachricht über die Verheißung nahe, während die Verheißung selbst das Objekt dessen ist, was als gute Nachricht verkündet wird. Das explizite ἡμεῖς darf im Deutschen angemessen durch „wir selbst“ markiert werden.
  naturalness: „An die Väter ergangen ist“ ist verständlich, wirkt aber leicht amtlich. Die vorgeschlagene Satzstellung mit „als gute Nachricht“ ist modernes, klares Standarddeutsch und bildet die griechische Objektstruktur präziser ab.
  terminology: „Verheißung“ und „Väter“ sind für den Kontext treffend. Die Fußnote bewahrt die mögliche idiomatischere Alternative „Vorfahren“, ohne den im Griechischen stehenden Ausdruck im Haupttext zu ersetzen.
  issues:
  - severity: medium
    issue: „die gute Nachricht von der Verheißung“
    rationale: Die Verbindung mit „von“ kann die Verheißung zum bloßen Thema der guten Nachricht machen. Im Griechischen ist „die Verheißung“ direktes Objekt von εὐαγγελιζόμεθα; sie wird als gute Nachricht verkündet.
  - severity: low
    issue: Die Hervorhebung von ἡμεῖς fehlt.
    rationale: Da das Personalpronomen im Griechischen ausdrücklich gesetzt ist, ist „wir selbst“ eine angemessene, nicht übermäßig starke Wiedergabe der Betonung.
  revised_text: Und wir selbst verkünden euch die Verheißung, die an die Väter ergangen ist, als gute Nachricht.[a]
