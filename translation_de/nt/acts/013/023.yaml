id: ACT.13.23
reference: Acts 13:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: de
  text: 'Aus dessen Nachkommenschaft hat Gott für Israel, wie verheißen, einen Retter hervorgebracht: Jesus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου
  choice: dessen
  rationale: Das Genitivpronomen verweist knapp und eindeutig auf David im vorausgehenden Vers.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: aus dessen Nachkommenschaft
  rationale: σπέρμα bezeichnet hier die davidische Abstammung; „Nachkommenschaft“ ist im modernen Deutsch natürlich und bewahrt den genealogischen Sinn.
- source_word: κατ’ ἐπαγγελίαν
  choice: wie verheißen
  rationale: Die Wendung drückt Übereinstimmung mit einer vorausgegangenen Verheißung aus, ohne diese im Haupttext näher zu bestimmen.
- source_word: ἤγαγεν
  choice: hat ... gebracht
  rationale: Dies gibt die Grundbedeutung von ἄγω wieder und vermeidet „erweckt“, das fälschlich als Hinweis auf die Auferstehung verstanden werden könnte.
- source_word: τῷ Ἰσραήλ
  choice: Israel
  rationale: Der deutsche Dativ ohne Präposition gibt τῷ Ἰσραήλ idiomatisch wieder und lässt sowohl die Ziel- als auch die Begünstigtennuance erkennen.
- source_word: σωτῆρα
  choice: einen Retter
  rationale: „Retter“ ist die natürliche und theologisch angemessene Wiedergabe des Titels σωτήρ.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Der Personenname wird gemäß der üblichen deutschen Namensform wiedergegeben.
theological_decisions:
- issue: Bezug Jesu zur davidischen Verheißung
  choice: Der Text verbindet Jesu Herkunft aus Davids Nachkommenschaft mit Gottes Verheißung, ohne diese näher auszuführen.
  alternative: 'Explizit formulieren: „in Erfüllung der Verheißung an David“.'
  rationale: Das Griechische nennt weder ausdrücklich „Erfüllung“ noch David als Empfänger der Verheißung in diesem Satz; die knappe Formulierung bewahrt die Aussage und vermeidet erklärende Zusätze.
- issue: Textvariante bei σωτῆρα Ἰησοῦν
  choice: '„einen Retter gebracht: Jesus“'
  alternative: '„Jesus als Retter gebracht“; nach einer abweichenden Lesart: „Rettung gebracht“.'
  rationale: Der SBLGNT-Haupttext liest σωτῆρα Ἰησοῦν. Die Apposition wird im Deutschen durch den Doppelpunkt klar und würdig ausgedrückt; die relevante Variante wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung folgt natürlichem Deutsch; „wie verheißen“ ist idiomatischer als das steifere „gemäß Verheißung“. Der Doppelpunkt kennzeichnet Jesus eindeutig als den genannten Retter.
