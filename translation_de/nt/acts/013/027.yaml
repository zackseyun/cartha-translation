id: ACT.13.27
reference: Acts 13:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: de
  text: Denn die Einwohner Jerusalems und deren führende Männer erfüllten, indem sie ihn nicht erkannten und verurteilten, die Worte der Propheten, die an jedem Sabbat vorgelesen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: die Einwohner Jerusalems
  rationale: Die substantivisch gebrauchte Partizipialgruppe bezeichnet die in Jerusalem lebenden Menschen; „die Einwohner Jerusalems“ ist knapp, natürlich und präzise.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: ihre führenden Männer
  rationale: ἄρχοντες meint hier die maßgeblichen politischen und religiösen Führungspersonen. „Führende Männer“ bewahrt den historischen Personenbezug und klingt im Deutschen natürlicher als „Herrscher“.
- source_word: τοῦτον
  choice: ihn
  rationale: Das griechische Demonstrativpronomen verweist auf Jesus. Das deutsche „diesen“ wäre an dieser Stelle auffällig und potenziell abwertend; „ihn“ gibt den Referenten im laufenden Satz natürlich wieder.
- source_word: ἀγνοήσαντες
  choice: haben ihn nicht erkannt
  rationale: Im Kontext geht es um das Verkennen der Identität und Bedeutung Jesu, nicht lediglich um fehlende Kenntnis.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: die Worte der Propheten
  rationale: φωνάς bedeutet wörtlich „Stimmen“, bezeichnet hier jedoch die verlesenen prophetischen Aussagen. „Worte“ ist im Deutschen für schriftlich überlieferte und vorgelesene Prophetie natürlich.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: die an jedem Sabbat vorgelesen werden
  rationale: Das Passivpartizip beschreibt die regelmäßige öffentliche Schriftlesung; „vorgelesen“ macht diesen Kontext deutlicher als bloß „gelesen“.
- source_word: κρίναντες
  choice: Indem sie ihn verurteilten
  rationale: κρίνω bezeichnet im Kontext das richterliche Verurteilen Jesu; die Konstruktion mit „indem“ gibt den instrumentalen Zusammenhang mit der Erfüllung wieder.
- source_word: ἐπλήρωσαν
  choice: erfüllten sie
  rationale: πληρόω bezeichnet hier die Erfüllung prophetischer Aussagen durch das Geschehen.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage und wird im Deutschen idiomatisch mit „Denn“ wiedergegeben.
theological_decisions:
- issue: Art des Nichterkennens Jesu
  choice: haben ihn nicht erkannt
  alternative: kannten ihn nicht
  rationale: Die Formulierung lässt das schuldhafte Verkennen Jesu anklingen, ohne eine völlige Unkenntnis seiner Person zu behaupten.
- issue: Verhältnis von Verurteilung und Prophetenerfüllung
  choice: Indem sie ihn verurteilten, erfüllten sie
  alternative: sie verurteilten ihn und erfüllten
  rationale: Die instrumentale Wiedergabe wahrt den Zusammenhang, dass gerade ihre Verurteilung Jesu die regelmäßig verlesenen prophetischen Aussagen erfüllte, ohne daraus eine bewusste Absicht zur Erfüllung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satzbau wird zur besseren Verständlichkeit in zwei Sätze gegliedert; der erklärende Anschluss durch „Denn“ bleibt erhalten. „Sabbat“ bewahrt den jüdischen historischen Kontext.
