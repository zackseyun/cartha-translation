source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: de
  text: Der Gott dieses Volkes, Israel, erwählte unsere Väter[a]. Er machte das Volk während seines Aufenthalts als Fremdvolk im Land Ägypten groß[b] und führte es mit erhobenem Arm[c] von dort heraus[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Vorfahren“. Wörtlich: „unsere Väter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „er erhöhte das Volk“ beziehungsweise „er ließ das Volk zahlreich werden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „mit hohem Arm“; eine Wendung aus der Exodusüberlieferung für Gottes machtvolle Befreiung.'
    reason: cultural_note
  - marker: d
    text: 'Oder: „brachte es von dort heraus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: Der Gott dieses Volkes Israel
  rationale: Bewahrt die feierliche genitivische und appositionelle Struktur des Griechischen; „Israel“ bleibt als Eigenname stehen.
- source_word: ἐξελέξατο
  choice: erwählte
  rationale: Gibt die heilsgeschichtlich geprägte Wahlhandlung idiomatisch und würdig wieder, ohne den medialen Aspekt eigens auszudeuten.
- source_word: τοὺς πατέρας ἡμῶν
  choice: unsere Väter
  rationale: Entspricht dem ausdrücklich männlichen πατέρας und dem patriarchalisch-heilsgeschichtlichen Kontext; die verständliche Alternative „Vorfahren“ wird in der Fußnote genannt.
- source_word: ὕψωσεν
  choice: ließ ... groß werden
  rationale: Hält die mögliche Bedeutungsbreite zwischen zahlenmäßigem Wachstum und Erhöhung beziehungsweise Erstarkung offen.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: während seines Aufenthalts als Fremde im Land Ägypten
  rationale: Macht den Fremdlingsstatus von παροικία sichtbar und bewahrt zugleich die ausdrückliche Wendung „Land Ägypten“.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: mit erhobenem Arm
  rationale: Bewahrt das Exodusbild möglichst unmittelbar; seine Bedeutung als Ausdruck machtvoller Befreiung wird in der Fußnote erklärt.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: führte es ... von dort heraus
  rationale: Das deutsche Singularpronomen nimmt „das Volk“ wieder auf; „von dort“ verweist natürlich auf Ägypten und gibt die Herausführung klar wieder.
theological_decisions:
- issue: Bezeichnung der Vorfahren Israels
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die Übersetzung wahrt das konkrete πατέρες und den patriarchalischen Bezug, ohne die allgemeinere Verständnisalternative zu verschweigen.
- issue: Bedeutung von ὕψωσεν in Ägypten
  choice: ließ das Volk groß werden
  alternative: erhöhte das Volk / ließ das Volk zahlreich werden
  rationale: Die Formulierung legt sich nicht ausschließlich auf gesellschaftliche Erhöhung oder zahlenmäßige Vermehrung fest und bewahrt so die echte lexikalische Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem heilsgeschichtlichem Ton. Die Satzteilung erhöht die Lesbarkeit, ohne den gedanklichen Zusammenhang aufzulösen. Bildsprache und Mehrdeutigkeit des Ausgangstextes bleiben erhalten.
