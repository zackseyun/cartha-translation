  source_fidelity: Der Entwurf gibt die Abfolge und den Sinn des griechischen Satzes insgesamt zuverlässig wieder. Die Wiedergabe von ὕψωσεν mit „ließ ... groß werden“ ist jedoch im Deutschen stärker auf einen Entwicklungsprozess festgelegt, während das Verb hier auch Erhöhung bzw. Erstarken bezeichnen kann. Außerdem ist „seines Aufenthalts als Fremde“ nicht kongruent und idiomatisch nicht gelungen, da sich das Singular-Kollektiv „Volk“ nicht stimmig mit dem prädikativen Plural „Fremde“ verbindet.
  naturalness: Die Satzteilung ist gut lesbar und dem würdigen Register angemessen. „Dieses Volkes Israel“ benötigt zur klaren Apposition ein Komma. „Während seines Aufenthalts als Fremdvolk“ gibt die Lage als ansässige Fremde natürlich und verständlich wieder.
  terminology: „erwählte“, „unsere Väter“, „Land Ägypten“ und „mit erhobenem Arm“ sind für den Kontext und das Register angemessen. Die Fußnoten bewahren die relevanten lexikalischen Alternativen und erläutern das Exodusbild, ohne es dogmatisch einzuengen.
