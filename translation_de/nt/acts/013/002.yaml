id: ACT.13.2
reference: Acts 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: de
  text: 'Während sie dem Herrn dienten[a] und fasteten, sagte der Heilige Geist: »Sondert mir nun Barnabas und Saulus für das Werk aus, zu dem ich sie berufen habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »während sie dem Herrn gottesdienstlich dienten« beziehungsweise »während sie den Herrn anbeteten«. Das griechische Verb bezeichnet einen Dienst, der gottesdienstliche oder liturgische Züge haben kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: dem Herrn dienten
  rationale: Das Verb bezeichnet einen Dienst, der hier im Zusammenhang mit Fasten gottesdienstliche oder anbetende Züge trägt. „Dienten“ bewahrt den weiteren Sinn; die Fußnote nennt die engere mögliche Wiedergabe.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Der Dativ bezeichnet den Herrn als denjenigen, dem dieser Dienst gilt; die deutsche Dativkonstruktion ist natürlich und quellennah.
- source_word: νηστευόντων
  choice: fasteten
  rationale: Die finite Wiedergabe fügt sich natürlich in den deutschen Temporalsatz und stellt die Gleichzeitigkeit beider Tätigkeiten dar.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Dies ist die geläufige moderne deutsche Wiedergabe und erhält den Heiligen Geist ausdrücklich als sprechendes Subjekt.
- source_word: Ἀφορίσατε
  choice: Sondert ... aus
  rationale: Die trennbare Verbform bezeichnet das Absondern für einen besonderen Zweck, ohne einen technischen Akt der Ordination vorauszusetzen.
- source_word: δή
  choice: nun
  rationale: „Nun“ gibt den nachdrücklichen beziehungsweise unmittelbaren Zug der Partikel knapp und idiomatisch wieder.
- source_word: μοι
  choice: mir
  rationale: Der Dativ bezeichnet denjenigen, für den die Aussonderung erfolgt; „mir“ ist im Deutschen prägnant und natürlich.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnabas und Saulus
  rationale: Die Namen folgen den im Deutschen etablierten biblischen Namensformen.
- source_word: εἰς τὸ ἔργον
  choice: für das Werk
  rationale: „Werk“ wahrt die Weite von ἔργον und vermeidet die vorschnelle Einengung auf ein kirchliches Amt oder eine bestimmte Missionsform.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: zu dem ich sie berufen habe
  rationale: Das Perfekt bezeichnet einen bereits ergangenen Ruf mit fortbestehender Geltung; „berufen habe“ vermittelt dies idiomatisch und erhält die Bezugnahme auf das Werk.
theological_decisions:
- issue: Bedeutung von λειτουργούντων im Zusammenhang gemeinschaftlicher Frömmigkeit und Beauftragung
  choice: dem Herrn dienten
  alternative: den Herrn anbeteten / Gottesdienst für den Herrn hielten
  rationale: Der Ausdruck kann gottesdienstlich geprägten Dienst bezeichnen, legt aber weder ausschließlich Anbetung noch eine bestimmte liturgische Form fest. Haupttext und Fußnote bewahren diese Bedeutungsbreite.
- issue: Der Heilige Geist als sprechendes Subjekt
  choice: der Heilige Geist sagte
  alternative: keine unpersönliche Umschreibung
  rationale: Der griechische Text stellt den Heiligen Geist unmittelbar als den Sprechenden dar; diese personale Aussage bleibt unverändert erhalten.
- issue: Art der Aussonderung für das Werk
  choice: Sondert mir ... für das Werk aus
  alternative: Ernennt ... zum Dienst
  rationale: Der Text beschreibt eine göttliche Aussonderung und Beauftragung, benennt jedoch weder eine Ordination noch ein technisches kirchliches Amt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dienten“ ist allgemein verständlich und wird durch die Fußnote gegen eine rein alltägliche Lesart abgesichert. „Sondert ... aus“ erhält den feierlichen Auftragston, während „nun“ die im Griechischen ausgedrückte Nachdrücklichkeit sichtbar macht.
