id: ACT.13.39
reference: Acts 13:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: de
  text: In ihm wird jeder, der glaubt, gerechtgesprochen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch diesen wird jeder, der glaubt, gerechtgesprochen.“ Die griechische Wendung ἐν τούτῳ kann wörtlicher mit „in/durch diesen“ wiedergegeben werden und bezieht sich auf Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: In ihm
  rationale: Der Demonstrativausdruck verweist im unmittelbaren Zusammenhang auf Jesus. „In ihm“ gibt den persönlichen, anaphorischen Bezug im Deutschen natürlich wieder und bewahrt zugleich die Präposition.
- source_word: πᾶς ὁ πιστεύων
  choice: jeder, der glaubt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden Glaubenden. Die gewählte Formulierung ist idiomatisches modernes Deutsch und gibt den generischen Sinn klar wieder.
- source_word: δικαιοῦται
  choice: wird … gerechtgesprochen
  rationale: Die Wendung bewahrt den rechtlich-forensischen Sinn von δικαιόω und ist im heutigen Deutsch verständlicher als das fachsprachlichere „wird gerechtfertigt“, ohne den Ausdruck auf bloßen Freispruch zu verengen.
theological_decisions:
- issue: Bezug von ἐν τούτῳ
  choice: 'persönlicher Bezug auf Jesus: „In ihm“'
  alternative: „Durch diesen“ oder wörtlicher „in diesem“
  rationale: Der vorausgehende Kontext spricht von Jesus als dem, durch den Vergebung verkündet wird. Der persönliche Bezug folgt dem Gedankengang, während die Fußnote die mögliche instrumentale Wiedergabe sichtbar hält.
- issue: Wiedergabe von δικαιοῦται
  choice: 'forensisch: „wird gerechtgesprochen“'
  alternative: „wird gerechtfertigt“, „wird für gerecht erklärt“ oder „wird freigesprochen“
  rationale: Die Formulierung erhält den rechtlich-forensischen Gehalt und die Spannung des Zusammenhangs, ohne Rechtfertigung als moralische Umgestaltung auszulegen. „Freigesprochen“ wäre zu eng, „für gerecht erklärt“ stärker auslegend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gerechtgesprochen“ ist allgemein verständlich und bewahrt den forensischen Sinn; die Satzstellung hält „In ihm“ als christologischen Schwerpunkt am Anfang.
