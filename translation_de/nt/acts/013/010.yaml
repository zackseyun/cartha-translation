id: ACT.13.10
reference: Acts 13:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: de
  text: 'Und er sagte: „Du bist voll von jeder Art von Täuschung und jeder Art von Skrupellosigkeit, Sohn des Teufels, Feind aller Gerechtigkeit[a]! Willst du nicht aufhören, die geraden Wege des Herrn zu verdrehen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feind aller Rechtschaffenheit“. Das griechische Wort kann je nach Zusammenhang Gerechtigkeit oder moralische Rechtschaffenheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: voll von jeder Art von Täuschung
  rationale: πλήρης mit Genitiv bezeichnet das Erfüllt- oder Geprägtsein von etwas. Die Formulierung gibt die umfassende Kraft von παντός idiomatisch wieder; δόλος bezeichnet Täuschung, Arglist oder betrügerische Hinterlist.
- source_word: πάσης ῥᾳδιουργίας
  choice: jeder Art von Skrupellosigkeit
  rationale: ῥᾳδιουργία meint gewissenloses, niederträchtiges oder betrügerisches Handeln. „Skrupellosigkeit“ ist im modernen Deutsch verständlich und wahrt den Unterschied zu δόλος, ohne den Ausdruck zu allgemeiner „Bosheit“ abzuschwächen.
- source_word: υἱὲ διαβόλου
  choice: Sohn des Teufels
  rationale: υἱέ bedeutet wörtlich „Sohn“. Die biblische Wendung kann Zugehörigkeit oder sittliche Ähnlichkeit ausdrücken; die wörtliche Wiedergabe bewahrt die Schärfe der Anrede.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: Feind aller Gerechtigkeit
  rationale: δικαιοσύνη bezeichnet hier das moralisch Rechte und Aufrichtige. „Gerechtigkeit“ ist die natürliche deutsche Entsprechung und lässt zugleich den möglichen Bezug auf gerechtes Handeln offen.
- source_word: οὐ παύσῃ
  choice: Willst du nicht aufhören
  rationale: Das Futur steht in einer vorwurfsvollen rhetorischen Frage. Diese Formulierung ist im Deutschen natürlicher als das starre „Wirst du nicht aufhören“ und fügt nicht die Verstärkung „nie“ oder „endlich“ hinzu.
- source_word: διαστρέφων
  choice: zu verdrehen
  rationale: διαστρέφω bedeutet verdrehen, verzerren oder vom richtigen Verlauf abbringen. „Verdrehen“ führt das Bild der geraden Wege passend fort.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: die geraden Wege des Herrn
  rationale: ὁδοί kann konkrete und übertragene Wege bezeichnen; εὐθείας hebt ihre Geradheit und Richtigkeit hervor. Die Wiedergabe wahrt das Wegbild und den attributiven Nachdruck.
- source_word: Ὦ
  choice: Du bist
  rationale: Ὦ leitet eine nachdrückliche direkte Anrede ein. Statt des im heutigen Deutsch altertümlich wirkenden „O“ eröffnet „Du bist“ die Reihe der Anklagen natürlich und mit vergleichbarer Unmittelbarkeit.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der Zusammenhang kann sowohl das moralisch Rechte als auch gerechtes Handeln umfassen. „Gerechtigkeit“ bewahrt diesen breiten biblischen Bedeutungsraum; die stärker charakterbezogene Lesart wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit scharfer, direkter Anrede. Das Wegbild sowie die rhetorische Frage des griechischen Textes bleiben erhalten; altertümliche Formen wie „O“ und unnötige Verstärkungen werden vermieden.
