lexical_decisions:
- source_word: καί
  choice: Und
  rationale: Der gewöhnliche Anschluss führt die geschichtliche Erzählung fort.
- source_word: ὡς
  choice: etwa
  rationale: Bei einer Zeitangabe bezeichnet ὡς eine ungefähre Dauer.
- source_word: τεσσερακονταετῆ χρόνον
  choice: vierzig Jahre lang
  rationale: Die deutsche Wendung gibt die bezeichnete Zeitspanne natürlich und genau wieder.
- source_word: ἐτροποφόρησεν
  choice: ertrug
  rationale: Die Lesart des SBLGNT bedeutet hier am ehesten, dass Gott das widerspenstige Volk ertrug; die wichtige abweichende Lesart wird in der Fußnote bewahrt.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Pronomen bezieht sich auf das Volk Israel.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: Die traditionelle und sachlich passende Bezeichnung bewahrt den biblisch-geografischen Bezug der Wüstenwanderung.
theological_decisions:
- issue: Gottes Handeln an Israel während der Wüstenzeit
  choice: ertrug er sie
  alternative: sorgte er für sie
  rationale: Der vorgegebene griechische Haupttext liest ἐτροποφόρησεν und stützt damit den Sinn „ertragen“. Die fürsorgliche Deutung beruht auf einer bedeutenden Textvariante und wird daher transparent in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ertrug“ ist natürlicher als „hielt sie aus“, bewahrt aber den schwierigen Sinn der gedruckten griechischen Lesart. Der Fußnotenmarker steht unmittelbar nach dem Satz.
