id: ACT.13.30
reference: Acts 13:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: de
  text: Doch Gott hat ihn von den Toten auferweckt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel markiert hier den deutlichen Gegensatz zur vorausgehenden menschlichen Handlung. „Doch“ gibt diesen Kontrast natürlich und prägnant wieder.
- source_word: θεὸς
  choice: Gott
  rationale: Das Substantiv bezeichnet eindeutig Gott als handelndes Subjekt.
- source_word: ἤγειρεν
  choice: hat … auferweckt
  rationale: ἐγείρω bezeichnet in diesem Auferstehungskontext das Erwecken vom Tod. Das deutsche Perfekt klingt in gegenwärtiger Standardsprache natürlich; „auferweckt“ macht den Auferstehungsbezug klar, ohne den Text auszudeuten.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bezieht sich im unmittelbaren Zusammenhang auf Jesus.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Die feste biblische Wendung gibt das Hervorkommen aus dem Bereich beziehungsweise Kreis der Toten idiomatisch wieder und bewahrt die knappe Form des Griechischen.
theological_decisions:
- issue: Formulierung der Auferstehung
  choice: Doch Gott hat ihn von den Toten auferweckt.
  alternative: Doch Gott hat ihn aus den Toten auferweckt.
  rationale: Die gewählte Formulierung schreibt die Auferweckung Jesu ausdrücklich Gottes Handeln zu und bewahrt die Aussage des griechischen Textes. „Aus den Toten“ bildet ἐκ formaler ab, klingt im modernen Deutschen jedoch ungewohnt; „von den Toten“ ist die etablierte, verständliche Wendung und fügt keine weitergehende Deutung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und der starke Gegensatz zum vorherigen Geschehen bleiben erhalten; Fußnoten sind für diesen Vers nicht erforderlich.
