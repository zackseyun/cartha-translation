source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: de
  text: 'Darum sollt ihr wissen, Brüder[a]: Durch diesen[b] wird euch die Vergebung der Sünden verkündet. Und von allem, wovon ihr durch das Gesetz des Mose nicht gerechtfertigt werden konntet …[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Anrede kann im Blick auf die versammelte Zuhörerschaft auch Frauen einschließen: „Brüder und Schwestern“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Jesus, von dem unmittelbar zuvor die Rede war.
    reason: cross_reference
  - marker: c
    text: Der vorgelegte griechische Textausschnitt endet hier mitten im Satz; dessen Fortsetzung gehört nach der üblichen Verseinteilung zu Apostelgeschichte 13,39.
    reason: source_boundary
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Darum sollt ihr wissen
  rationale: Gibt die unpersönliche Imperativkonstruktion in natürlichem, zugleich nachdrücklichem Deutsch wieder; „darum“ entspricht οὖν.
- source_word: ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die maskuline Form und die familiäre Anrede, ohne die im Deutschen schwerfällige wörtliche Doppelung „Männer, Brüder“.
- source_word: διὰ τούτου
  choice: durch diesen
  rationale: Bewahrt das maskuline Demonstrativpronomen und den Rückbezug auf Jesus, ohne das im Griechischen nicht ausdrücklich stehende Substantiv „Mann“ einzufügen.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: die Vergebung der Sünden
  rationale: Ist die klare und im heutigen Deutsch etablierte Wiedergabe in diesem Zusammenhang.
- source_word: καταγγέλλεται
  choice: wird … verkündet
  rationale: Gibt das Passiv und den öffentlichen Verkündigungscharakter des Verbs wieder.
- source_word: ἀπὸ πάντων ὧν
  choice: von allem, wovon
  rationale: Bewahrt die wiederholte Präposition idiomatisch und lässt den syntaktischen Anschluss an δικαιωθῆναι erkennen.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: durch das Gesetz des Mose
  rationale: Versteht ἐν hier im Zusammenhang mit δικαιωθῆναι instrumental; „durch“ ist präzise und natürlich.
- source_word: δικαιωθῆναι
  choice: gerechtfertigt werden
  rationale: Bewahrt den etablierten theologischen und forensischen Gehalt des Verbs, ohne ihn auf moralische Veränderung zu verengen.
theological_decisions:
- issue: Bedeutung von δικαιωθῆναι im Verhältnis zum Gesetz des Mose
  choice: gerechtfertigt werden
  alternative: für gerecht erklärt beziehungsweise freigesprochen werden
  rationale: „Gerechtfertigt“ erhält die theologische Spannung und den forensischen Sinn; die Alternativen erläutern, ohne den Begriff im Haupttext einseitig festzulegen.
- issue: Geschlechtliche Reichweite der Anrede ἄνδρες ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die Hauptfassung bewahrt die grammatisch maskuline Anrede; eine mögliche inklusive Reichweite auf die versammelte Zuhörerschaft wird in der Fußnote offengehalten.
- issue: Unvollständige Syntax des bereitgestellten griechischen Ausschnitts
  choice: Satzabbruch mit Auslassungspunkten kenntlich machen
  alternative: Den vollständigen Satz aus Apostelgeschichte 13,39 ergänzen
  rationale: Die vorgelegte Quelle reicht über den üblichen Vers 38 hinaus in den folgenden Satz, endet jedoch vor dessen Hauptaussage. Nicht überlieferte Wörter werden deshalb nicht stillschweigend ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist gut verständlich, hält aber mit „gerechtfertigt“ einen zentralen und mehrschichtigen theologischen Begriff fest. Der Doppelpunkt gliedert die feierliche Ankündigung natürlich; der abschließende Satzabbruch bildet die tatsächliche Grenze des bereitgestellten griechischen Ausgangstextes ab.
