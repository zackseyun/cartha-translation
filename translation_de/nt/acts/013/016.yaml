source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: de
  text: 'Da stand Paulus auf, gab mit der Hand ein Zeichen und sagte: »Ihr Männer Israels und ihr, die ihr Gott fürchtet[a], hört zu!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Gottesfürchtigen«. Gemeint sind wahrscheinlich Nichtjuden, die mit der Synagoge verbunden waren und den Gott Israels verehrten.'
    reason: Lexikalische Alternative und kontextuelle Erläuterung der Gruppenbezeichnung.
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand … auf
  rationale: Das Aoristpartizip bezeichnet hier die konkrete Bewegung des Paulus vor seiner Rede. »Aufstehen« ist im modernen Deutsch natürlich und präzise.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung weiter, ohne einen starken Gegensatz auszudrücken. »Da« stellt im Deutschen einen flüssigen narrativen Anschluss her.
- source_word: κατασείσας τῇ χειρὶ
  choice: gab mit der Hand ein Zeichen
  rationale: Die Wendung bezeichnet eine Handbewegung, mit der Paulus Aufmerksamkeit oder Ruhe signalisiert. Die Formulierung ist idiomatisch und legt die genaue Bewegung nicht unnötig fest.
- source_word: εἶπεν
  choice: sagte
  rationale: Das übliche deutsche Erzählverb leitet die direkte Rede sachgerecht ein.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ihr Männer aus Israel
  rationale: Die Anrede bewahrt sowohl das ausdrücklich männliche ἄνδρες als auch die Zugehörigkeit zu Israel und klingt im heutigen Deutsch verständlich und würdig.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: ihr, die ihr Gott fürchtet
  rationale: Die Wiedergabe erhält den verbalen Charakter des Partizips und bleibt für heutige Leser unmittelbar verständlich, ohne im Haupttext vorschnell einen technischen Gruppennamen zu verwenden.
- source_word: ἀκούσατε
  choice: hört zu
  rationale: Der Aoristimperativ fordert zum aufmerksamen Zuhören auf. »Hört zu!« ist direkt, natürlich und dem feierlichen Redeanlass angemessen.
theological_decisions:
- issue: Anrede an Israeliten und an eine zweite, gottesfürchtige Gruppe im Synagogengottesdienst
  choice: »Ihr Männer aus Israel und ihr, die ihr Gott fürchtet«
  alternative: »Ihr Männer aus Israel und ihr Gottesfürchtigen«
  rationale: Der griechische Text unterscheidet Israeliten von einer zweiten Gruppe, die als Gott fürchtend beschrieben wird und im Kontext wahrscheinlich aus nichtjüdischen Besuchern der Synagoge bestand. Die Übersetzung bewahrt diese Unterscheidung, ohne die kontextuelle Identifizierung im Haupttext dogmatisch festzuschreiben.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die direkte Anrede bleibt ausdrücklich männlich, wie es ἄνδρες verlangt. Der Fußnotenmarker steht unmittelbar bei der erläuterten Wendung.
