  source_fidelity: 'Der Text gibt die Satzbewegung und alle wesentlichen Elemente des Griechischen zuverlässig wieder: Jesus als Referent, die über viele Tage erfolgten Erscheinungen, die Begleiter auf dem Weg von Galiläa nach Jerusalem, ihre gegenwärtige Zeugenschaft und deren Ausrichtung auf „das Volk“. „Erschien“ ist für ὤφθη in diesem Kontext idiomatisch und sachgerecht; die formalere passive Wiedergabe wird zutreffend als Alternative vermerkt. Die Aufteilung in zwei Sätze verändert die Aussage nicht.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem Register. „Viele Tage lang“, „hinaufgezogen waren“ und „Sie sind jetzt … seine Zeugen“ sind flüssig. „Vor dem Volk“ ist im Deutschen eine etablierte und hier passende Wiedergabe der öffentlichen, auf das Volk gerichteten Zeugenschaft.
  terminology: „Zeugen“ bewahrt den zentralen Begriff μάρτυρες ohne konfessionelle Überformung. „Dem Volk“ lässt, wie das Griechische, die Bezeichnung unexpandiert; die Fußnote erläutert den im Kontext wahrscheinlichen Bezug auf das jüdische Volk bzw. Israel, ohne ihn in den Haupttext einzutragen. Die Fußnote zu „erschien“ wahrt die lexikalische Alternative „wurde gesehen“.
