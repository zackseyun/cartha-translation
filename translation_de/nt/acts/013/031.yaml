id: ACT.13.31
reference: Acts 13:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: de
  text: Er erschien[a] viele Tage lang denen, die mit ihm von Galiläa nach Jerusalem hinaufgezogen waren. Sie sind jetzt vor dem Volk[b] seine Zeugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde viele Tage lang gesehen“. Das griechische Verb kann besonders im Zusammenhang mit Erscheinungen des Auferstandenen formal so wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Mit „dem Volk“ ist hier im Zusammenhang wahrscheinlich das jüdische Volk, also Israel, gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Er
  rationale: Das Relativpronomen bezieht sich auf Jesus im vorhergehenden Vers. Da der Vers als eigenständiger Satz wiedergegeben wird, nimmt „Er“ den Bezug im Deutschen natürlich und eindeutig auf.
- source_word: ὤφθη
  choice: erschien
  rationale: Die passive Aoristform von ὁράω wird im Zusammenhang mit Auferstehungserscheinungen idiomatisch mit „erschien“ wiedergegeben. Die formal nähere Möglichkeit „wurde gesehen“ bleibt in einer Fußnote erhalten.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: viele Tage lang
  rationale: Die Präposition mit Akkusativ bezeichnet hier die zeitliche Dauer. „Viele Tage lang“ ist präzise und natürliches Deutsch.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: denen, die mit ihm … hinaufgezogen waren
  rationale: Das Partizip bezeichnet die Menschen, die Jesus auf dem Weg begleiteten. Das Plusquamperfekt macht deutlich, dass diese Reise den Erscheinungen vorausging; „hinaufgezogen“ bewahrt die Richtungsangabe von ἀναβαίνω.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: von Galiläa nach Jerusalem
  rationale: Die Ausgangs- und Zielangabe wird direkt und ohne erläuternde Erweiterung wiedergegeben.
- source_word: οἵτινες νῦν εἰσὶν
  choice: Sie sind jetzt
  rationale: Der neue Satz gibt den identifizierenden Relativanschluss klar wieder. „Jetzt“ bewahrt den zeitlichen Gegensatz zwischen den damaligen Erscheinungen und ihrer gegenwärtigen Zeugenschaft.
- source_word: μάρτυρες αὐτοῦ
  choice: seine Zeugen
  rationale: Der Genitiv bezeichnet ihre Beziehung zu Jesus und zugleich den Gegenstand ihres Zeugnisses. „Seine Zeugen“ ist knapp, idiomatisch und lässt diese Nuance bestehen.
- source_word: πρὸς τὸν λαόν
  choice: vor dem Volk
  rationale: πρός mit Akkusativ richtet die Zeugenschaft auf ihre öffentliche Zielgruppe. „Vor dem Volk“ drückt im Deutschen die Zeugenschaft gegenüber dieser Öffentlichkeit natürlich aus.
- source_word: λαόν
  choice: Volk
  rationale: Im Kontext ist wahrscheinlich das jüdische Volk beziehungsweise Israel gemeint. Da der griechische Text lediglich λαός sagt, bleibt der Haupttext ebenso unausgeführt.
theological_decisions:
- issue: Art der Sprache über die Erscheinungen des Auferstandenen
  choice: Er erschien
  alternative: Er wurde viele Tage lang gesehen
  rationale: „Erschien“ ist in diesem Kontext die natürliche Bedeutung von ὤφθη und bezeichnet die wirkliche Begegnung mit den Zeugen, ohne die genaue Art des Erscheinens über den Wortlaut hinaus festzulegen.
- issue: Bezugsbereich von „dem Volk“
  choice: dem Volk
  alternative: dem Volk Israel
  rationale: Der Zusammenhang weist auf Israel beziehungsweise das jüdische Volk, doch der Ausgangstext nennt Israel hier nicht ausdrücklich. Die allgemeinere Formulierung erhält die sprachliche Offenheit und erläutert den wahrscheinlichen Bezug in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste lange griechische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert. „Hinaufgezogen“ bewahrt die antike Reise- und Richtungssprache für den Weg nach Jerusalem, ohne altertümlich zu wirken.
