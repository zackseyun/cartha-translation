id: ACT.13.1
reference: Acts 13:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: de
  text: 'In Antiochia gab es in der dortigen Gemeinde Propheten und Lehrer: Barnabas, Simeon, genannt Niger[a], Lucius aus Kyrene[b], Manaën, einen engen Gefährten des Tetrarchen Herodes[c], und Saulus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Niger“ ist ein lateinischer Beiname und bedeutet „schwarz“.
    reason: lexical_alternative
  - marker: b
    text: Kyrene war eine Stadt in Nordafrika.
    reason: cultural_note
  - marker: c
    text: 'Oder möglicherweise: „der Pflegebruder des Tetrarchen Herodes“ oder „einer, der mit dem Tetrarchen Herodes aufgewachsen war“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: gab es
  rationale: Die Wendung führt die vorhandenen Personen ein. Das milde δέ braucht im Deutschen hier keinen ausdrücklich wiedergegebenen Gegensatzmarker.
- source_word: κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: in der dortigen Gemeinde
  rationale: Die idiomatische Ortsangabe bezeichnet die in Antiochia bestehende örtliche christliche Gemeinschaft; „Gemeinde“ ist im modernen Deutschen klar und vermeidet die mögliche Verwechslung mit einem Gebäude.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: Propheten und Lehrer
  rationale: Die unmittelbare Wiedergabe wahrt die im Text genannten Tätigkeiten beziehungsweise Rollen, ohne spätere Amtsstrukturen einzutragen.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Simeon, genannt Niger
  rationale: „Simeon“ gibt die Namensform Συμεών wieder; „Niger“ bleibt als lateinischer Beiname unübersetzt, während seine Bedeutung in einer Fußnote erläutert wird.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lucius aus Kyrene
  rationale: Das Herkunftsadjektiv bezeichnet Lucius als Mann aus Kyrene; diese Formulierung ist im Deutschen natürlicher als „der Kyrenäer“.
- source_word: Μαναήν
  choice: Manaën
  rationale: Die Schreibweise macht die getrennte Aussprache der aufeinanderfolgenden Vokale sichtbar und entspricht einer gebräuchlichen deutschen Namensform.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: mit dem Tetrarchen Herodes
  rationale: Der griechische Text nennt Herodes mit seinem Herrschertitel, ohne den historischen Zusatz „Antipas“ einzufügen.
- source_word: σύντροφος
  choice: der zusammen mit … aufgewachsen war
  rationale: Das Wort bezeichnet hier wahrscheinlich eine durch gemeinsames Aufwachsen begründete Beziehung. Die Formulierung wahrt diesen Kern, ohne die engere und unsichere Deutung „Pflegebruder“ festzuschreiben.
theological_decisions:
- issue: Art der Dienste in der Gemeinde von Antiochia
  choice: „Propheten und Lehrer“ als die im Text genannten Rollen wiedergeben
  alternative: Die Begriffe als genau definierte Ämter einer späteren kirchlichen Ordnung formulieren
  rationale: Der Vers benennt diese Menschen als Propheten und Lehrer, legt aber keine spätere institutionelle Ämterstruktur fest.
- issue: Beziehung Manaëns zu Herodes
  choice: „der zusammen mit dem Tetrarchen Herodes aufgewachsen war“
  alternative: „Pflegebruder des Tetrarchen Herodes“ oder „enger Vertrauter des Tetrarchen Herodes“
  rationale: σύντροφος legt gemeinsames Aufwachsen nahe, bestimmt die genaue soziale oder verwandtschaftliche Beziehung jedoch nicht eindeutig. Die Fußnote bewahrt die engeren Möglichkeiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Namensliste bleibt knapp und rhythmisch; „Gemeinde“ bezeichnet hier die örtliche christliche Gemeinschaft. Alle erläuterungsbedürftigen historischen und lexikalischen Angaben stehen in Fußnoten.
