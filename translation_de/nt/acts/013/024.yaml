id: ACT.13.24
reference: Acts 13:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: de
  text: Bevor er kam[a], hatte Johannes dem ganzen Volk Israel eine Taufe der Umkehr[b] verkündet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vor seiner Ankunft«; wörtlich etwa: »vor dem Angesicht seines Eintritts« — eine Wendung für das Vorausgehen vor jemandes Kommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine Taufe zur Umkehr«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: hatte … verkündet
  rationale: Das substantivisch bezogene Aoristpartizip bezeichnet eine vorausgehende öffentliche Verkündigung. Das Plusquamperfekt gibt die zeitliche Vorordnung im Deutschen natürlich wieder; die Stellung vor dem Kommen wird bereits durch den folgenden Ausdruck benannt.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: Bevor er kam
  rationale: Die wörtlich schwerfällige Wendung »vor dem Angesicht seines Eintritts« ist eine idiomatische Bezeichnung dafür, dass Johannes seinem Kommen vorausging. Die verbale Wiedergabe ist klares, natürliches Deutsch und bewahrt das Pronomen des griechischen Textes.
- source_word: εἰσόδου
  choice: kam
  rationale: εἴσοδος kann »Eintritt«, »Ankunft« oder »Kommen« bedeuten. Hier bezeichnet es im Zusammenhang das Kommen beziehungsweise Auftreten Jesu.
- source_word: βάπτισμα μετανοίας
  choice: eine Taufe der Umkehr
  rationale: Der Genitiv wird eng am Griechischen wiedergegeben. »Umkehr« bezeichnet eine grundlegende Sinnes- und Lebenswende und ist im heutigen Deutsch verständlicher als das enger oder missverständlich klingende »Buße«.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: dem ganzen Volk Israel
  rationale: Die Dativwendung bezeichnet die Adressaten der Verkündigung. »Dem ganzen Volk Israel« bewahrt sowohl den umfassenden Sinn von παντί als auch λαός als Volk.
- source_word: Ἰωάννου
  choice: Johannes
  rationale: Die im deutschen Bibelgebrauch etablierte Namensform für Ἰωάννης.
theological_decisions:
- issue: Bezug von αὐτοῦ in der Aussage über sein Kommen
  choice: Das Pronomen bleibt als »er« erhalten und bezieht sich im Kontext auf Jesus, den zuvor genannten Retter.
  alternative: Den Namen »Jesus« im Vers ausdrücklich ergänzen.
  rationale: Apostelgeschichte 13,23–25 identifiziert den Bezug hinreichend. Die Übersetzung wahrt die pronominale Form des griechischen Verses, ohne einen Namen einzufügen.
- issue: Verhältnis von Taufe und Umkehr in βάπτισμα μετανοίας
  choice: »Taufe der Umkehr«
  alternative: »Taufe zur Umkehr«
  rationale: Der Genitiv lässt das genaue Verhältnis offen. Die gewählte Form bewahrt diese Spannung und legt nicht ausdrücklich fest, ob die Taufe auf Umkehr zielt oder sie ausdrückt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Sprachgebrauch, während die zeitliche Abfolge, der umfassende Adressatenkreis und die Offenheit der Genitivverbindung erhalten bleiben.
