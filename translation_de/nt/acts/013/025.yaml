- from: 'Und als Johannes seinen Lauf vollendete[a], sagte er immer wieder: »Für wen haltet ihr mich? Ich bin es nicht. Doch seht: Nach mir kommt einer, dem die Sandalen von den Füßen zu lösen ich nicht würdig bin.«'
  to: 'Und als Johannes dabei war, seinen Lauf[a] zu vollenden, sagte er immer wieder: »Für wen haltet ihr mich? Ich bin es nicht.[b] Doch seht: Nach mir kommt einer, dessen Sandalen von seinen Füßen zu lösen ich nicht würdig bin.[c]«'
  rationale: Die Revision macht den Verlaufsaspekt von ἐπλήρου deutlicher und glättet die Satzstellung, ohne den Inhalt zu verändern. Sie ergänzt die in den eigenen Entscheidungen vorgesehene, korrekt an der elliptischen Verneinung verankerte Erläuterung und übernimmt die relevante textkritische Transparenz zur nicht im Haupttext stehenden Ergänzung „Riemen“.
