  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: de
  text: 'Und als Johannes dabei war, seinen Lauf[a] zu vollenden, sagte er immer wieder: »Für wen haltet ihr mich? Ich bin es nicht.[b] Doch seht: Nach mir kommt einer, dessen Sandalen von seinen Füßen zu lösen ich nicht würdig bin.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Lauf“ bezeichnet bildlich den Johannes aufgetragenen Lebens- und Dienstweg.
    reason: metaphor_clarification
  - marker: b
    text: Der griechische Text lässt die von Johannes verneinte Identität ungenannt. Der Zusammenhang weist auf den Messias hin.
    reason: implicit_identity
  - marker: c
    text: Einige Handschriften und Übersetzungen präzisieren „die Sandalen … zu lösen“ zu „den Riemen seiner Sandalen zu lösen“. Der hier zugrunde gelegte griechische Text nennt keinen „Riemen“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: seinen Lauf vollendete
  rationale: Die Wendung bewahrt die Metapher des δρόμος für den von Gott gegebenen Lebens- und Dienstweg. Der durative Aspekt des Imperfekts wird durch den einleitenden zeitlichen Zusammenhang ausreichend vermittelt.
- source_word: ἔλεγεν
  choice: sagte er immer wieder
  rationale: Das Imperfekt kann wiederholtes beziehungsweise fortdauerndes Reden in der zusammenfassenden Darstellung von Johannes’ Zeugnis ausdrücken.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Für wen haltet ihr mich?
  rationale: Die natürliche deutsche Identitätsfrage gibt ὑπονοεῖτε als vermutende Zuschreibung wieder; trotz des griechischen τί ist im Deutschen bei einer Person »für wen« idiomatisch.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Ich bin es nicht
  rationale: Die knappe Ellipse bleibt erhalten, einschließlich der emphatischen Verneinung, ohne den im Kontext wahrscheinlichen Messiasbezug im Haupttext ausdrücklich einzusetzen.
- source_word: ἀλλ’ ἰδοὺ
  choice: Doch seht
  rationale: »Seht« bewahrt die aufmerksamkeitslenkende Funktion von ἰδού in modernem, würdigem Deutsch; »doch« markiert den Gegensatz.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: Nach mir kommt einer
  rationale: Die Wortstellung ist natürlich und bewahrt das präsentische, unmittelbar bevorstehende Kommen sowie das im Griechischen implizite Subjekt.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: dem die Sandalen von den Füßen zu lösen
  rationale: Der Plural »Sandalen« ist im Deutschen bei beiden Füßen idiomatisch. »Von den Füßen lösen« bildet den gedruckten Text ab, ohne den dort nicht vorhandenen Begriff »Riemen« einzufügen.
- source_word: ἄξιος
  choice: würdig
  rationale: »Würdig« gibt die Aussage über Rang und Eignung in der Demutsformel transparent wieder.
theological_decisions:
- issue: Die von Johannes in οὐκ εἰμὶ ἐγώ verneinte Identität
  choice: Ich bin es nicht
  alternative: Ich bin nicht der Messias
  rationale: Der Kontext weist auf die messianische Identität, doch der griechische Haupttext nennt sie an dieser Stelle nicht ausdrücklich. Die Übersetzung bewahrt deshalb die Ellipse und erläutert den wahrscheinlichen Bezug in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp; »Doch seht« vermeidet sowohl archaisches »siehe« als auch umgangssprachliches »schaut mal«. Sämtliche Fußnotenmarker erscheinen im Haupttext.
