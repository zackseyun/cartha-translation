    issue: Der imperfektische Aspekt von ἐπλήρου ist im deutschen Haupttext abgeschwächt.
    rationale: „Als ... vollendete“ kann wie ein punktueller Abschluss gelesen werden. „Als Johannes dabei war, seinen Lauf zu vollenden“ gibt den im Verlauf stehenden Vorgang klarer wieder.
  - severity: medium
    issue: Die angekündigte Fußnote zur elliptisch verneinten Identität fehlt.
    rationale: Die theologischen Entscheidungen sagen ausdrücklich, der wahrscheinliche Messiasbezug werde in einer Fußnote erläutert. Die vorhandene Fußnote erklärt stattdessen nur „Lauf“. Ein korrekt verankerter Hinweis kann den Kontext erläutern, ohne „Messias“ in den Haupttext einzutragen.
  - severity: low
    issue: Die Variantenanmerkung aus dem englischen Audit Trail zu „Riemen“ fehlt.
    rationale: Der griechische Haupttext enthält kein Wort für „Riemen“. Eine Fußnote kann dies dokumentieren und zugleich transparent machen, weshalb der deutsche Haupttext diesen Begriff nicht ergänzt.
