source:
  edition: SBLGNT
  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: de
  text: Etwa vierhundertfünfzig Jahre lang.[a] Und danach gab er ihnen Richter bis zu Samuel, dem Propheten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder bei einer anderen Zuordnung der Zeitangabe: „Dann gab er ihnen etwa vierhundertfünfzig Jahre lang Richter bis zu Samuel, dem Propheten.“ Die Zuordnung der Zeitangabe im griechischen Text ist hier umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: etwa
  rationale: Vor einer Zahl kennzeichnet ὡς die Angabe als ungefähr; „etwa“ gibt diese Näherung natürlich wieder.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: vierhundertfünfzig Jahre lang
  rationale: Die Dativform bezeichnet hier eine Zeitspanne; „Jahre lang“ macht diese Funktion im Deutschen deutlich.
- source_word: καὶ μετὰ ταῦτα
  choice: Danach
  rationale: Die Wendung markiert die zeitliche Abfolge. „Danach“ ist im modernen Deutsch natürlich und erfasst den Sinn, ohne das schwerfällige „nach diesen Dingen“.
- source_word: ἔδωκεν
  choice: gab er ihnen
  rationale: „Gab“ bewahrt das biblische Bild von Gottes Gewährung bzw. Bereitstellung; „ihnen“ ergänzt das aus dem Zusammenhang erkennbare indirekte Objekt für natürliches Deutsch.
- source_word: κριτὰς
  choice: Richter
  rationale: Der Ausdruck bezeichnet die Richter Israels in der Zeit vor dem Königtum und entspricht der etablierten historischen Bezeichnung.
- source_word: ἕως
  choice: bis zu
  rationale: Die Präposition bezeichnet den Endpunkt der Richterzeit und lässt sich vor einem Personennamen idiomatisch mit „bis zu“ wiedergeben.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: Samuel, dem Propheten
  rationale: Die genitivische Apposition bezeichnet Samuel nach seiner Funktion; nach „bis zu“ verlangt das Deutsche den Dativ.
theological_decisions:
- issue: Zuordnung der Zeitangabe „etwa vierhundertfünfzig Jahre“ in einem textkritisch und syntaktisch schwierigen Vers
  choice: Die Zeitangabe steht entsprechend dem vorgegebenen SBLGNT-Text als eigener, an den vorausgehenden Zusammenhang anschließender Satzteil; danach folgt die Gabe der Richter bis Samuel.
  alternative: 'Die Zeitangabe wird mit der Richterzeit verbunden: „Dann gab er ihnen etwa vierhundertfünfzig Jahre lang Richter, bis zu Samuel, dem Propheten.“'
  rationale: Die vorgegebene griechische Textgestalt stellt die Zeitangabe vor καὶ μετὰ ταῦτα. Die Übersetzung folgt dieser Anordnung und legt die umstrittene syntaktische Beziehung nicht stillschweigend anders fest; die verbreitete Alternative wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Anfangsformulierung bewahrt die auffällige Gliederung des griechischen Ausgangstextes; die alternative syntaktische Verbindung wird transparent in der Fußnote genannt.
