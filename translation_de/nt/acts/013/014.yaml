source:
  edition: SBLGNT
  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: de
  text: Sie aber zogen von Perge aus weiter und kamen nach Antiochia in Pisidien[a]. Am Sabbat gingen sie in die Synagoge und setzten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das pisidische Antiochia“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Sie aber
  rationale: δέ führt die Reiseerzählung mit leichter Gegenüberstellung weiter; das ausdrücklich gesetzte αὐτοὶ wird durch „sie“ wiedergegeben, ohne im Deutschen unnatürlich „sie selbst“ zu betonen.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: zogen von Perge aus weiter
  rationale: Das Partizip von διέρχομαι bezeichnet hier das Fortsetzen der Reise von Perge aus. „zogen … weiter“ ist idiomatisch und wahrt den erzählerischen Bewegungssinn.
- source_word: παρεγένοντο
  choice: kamen nach
  rationale: παραγίνομαι bezeichnet im Reisekontext das Eintreffen an einem Ort; mit Städtenamen ist „nach … kommen“ natürliches Standarddeutsch.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Antiochia in Pisidien
  rationale: Die Formulierung identifiziert dieses Antiochia durch die Region und bildet die griechische Wendung klar und eng nach.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: gingen sie in die Synagoge
  rationale: Das griechische Partizip wird für einen natürlichen deutschen Satz als finites Verb wiedergegeben. „in die Synagoge gehen“ trifft die gerichtete Bewegung von εἰσέρχομαι mit εἰς.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: Am Sabbat
  rationale: Die griechische idiomatische Wendung mit dem formal pluralischen σαββάτων bezeichnet den Sabbattag; „am Sabbat“ ist im Deutschen präzise und geläufig.
- source_word: ἐκάθισαν
  choice: setzten sich
  rationale: Der Aorist bezeichnet die vollzogene Handlung des Sichsetzens; „setzten sich“ gibt den Eintritt in den sitzenden Zustand natürlicher wieder als „saßen“.
theological_decisions: []
