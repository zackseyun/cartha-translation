id: ACT.13.33
reference: Acts 13:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: de
  text: 'dass Gott dies für unsere Nachkommen erfüllt hat[a], indem er Jesus erweckte[b], wie es auch im zweiten Psalm geschrieben steht: »Du bist mein Sohn; heute habe ich dich gezeugt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Handschriften haben: „für uns, ihre Kinder“.'
    reason: textual_variant
  - marker: b
    text: Der griechische Ausdruck kann bedeuten, dass Gott Jesus von den Toten auferweckte; er kann aber auch meinen, dass Gott Jesus auftreten ließ oder als Retter einsetzte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: erfüllt hat
  rationale: Das Perfekt bezeichnet eine vollendete Tat mit fortdauernder Bedeutung; „erfüllt hat“ bewahrt außerdem die in Lukas–Apostelgeschichte wichtige Sprache von Verheißung und Erfüllung.
- source_word: ταύτην
  choice: dies
  rationale: Das Pronomen verweist auf die zuvor genannte Verheißung. „Dies“ gibt den griechischen Wortlaut wieder, ohne hier ein nicht ausdrücklich vorhandenes Substantiv einzufügen.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: für unsere Kinder
  rationale: Der Dativ bezeichnet die Begünstigten der Erfüllung; τέκνα kann sowohl Kinder als auch Nachkommen bezeichnen. Die Lesart des vorgelegten SBLGNT wird im Haupttext wiedergegeben, die wichtige Textvariante in einer Fußnote.
- source_word: ἀναστήσας Ἰησοῦν
  choice: indem er Jesus erweckte
  rationale: Die adverbiale Wiedergabe des Aoristpartizips ist im Deutschen natürlich. „Erweckte“ lässt im biblischen Sprachgebrauch sowohl einen Bezug auf die Auferweckung als auch auf Gottes Hervortretenlassen beziehungsweise Berufung Jesu zu; die Bedeutungsbreite wird in der Fußnote erläutert.
- source_word: γέγραπται
  choice: geschrieben steht
  rationale: Dies ist die geläufige deutsche Wiedergabe der perfektisch-passiven Schriftformel und bringt die fortdauernde Geltung des Geschriebenen zum Ausdruck.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: im zweiten Psalm
  rationale: Die Formulierung folgt der griechischen Zählungsangabe eng und klingt zugleich natürlich.
- source_word: Υἱός μου εἶ σύ
  choice: Du bist mein Sohn
  rationale: Die übliche deutsche Wortstellung gibt die eindeutige Identifikation würdig und verständlich wieder.
- source_word: σήμερον γεγέννηκά σε
  choice: heute habe ich dich gezeugt
  rationale: „Gezeugt“ gibt γεννάω direkt wieder und bewahrt das intertextuelle sowie christologische Gewicht von Psalm 2,7, ohne die Aussage erklärend umzudeuten.
theological_decisions:
- issue: Bedeutung von ἀναστήσας Ἰησοῦν in diesem Zusammenhang
  choice: „indem er Jesus erweckte“, um die Spannung zwischen Auferweckung und Gottes Hervortretenlassen beziehungsweise Einsetzen Jesu nicht im Haupttext zu entscheiden
  alternative: „indem er Jesus von den Toten auferweckte“ oder „indem er Jesus auftreten ließ“
  rationale: Der folgende Vers spricht ausdrücklich von der Auferweckung von den Toten; zugleich kann ἀνίστημι in der Apostelgeschichte Gottes Erwecken beziehungsweise Auftretenlassen eines Retters oder Führers bezeichnen. Die Übersetzung soll diese Auslegungsfrage nicht stillschweigend festlegen.
- issue: Christologische Aussage von „heute habe ich dich gezeugt“
  choice: Das Zitat wird ohne deutende Erweiterung direkt wiedergegeben.
  alternative: Eine erklärende Wiedergabe als Inthronisation, Annahme zum Sohn oder Bestätigung durch die Auferstehung
  rationale: Psalm 2,7 wird zitiert, ohne dass die Übersetzung spätere Debatten entscheiden sollte. Der direkte Wortlaut bewahrt die theologische Spannung und vermeidet eine konfessionelle Einengung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftzitat. Der Hauptsatz bleibt eng am griechischen Aufbau, ohne unnatürlich zu wirken. Die mehrdeutige Wendung zu Jesu Erweckung wird nicht dogmatisch vereindeutigt.
