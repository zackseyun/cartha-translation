  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: de
  text: Sie aber schüttelten den Staub von ihren Füßen gegen sie ab und gingen nach Ikonion.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Abschütteln des Staubes von den Füßen war eine symbolische Handlung der Abgrenzung und ein Zeugnis gegen diejenigen, die die Botschaft ablehnten.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sie aber
  rationale: δέ kennzeichnet hier einen leichten Gegensatz beziehungsweise den Fortgang der Erzählung. Der substantivierte Partizipialausdruck bezieht sich auf Paulus und Barnabas; im Deutschen ist „sie“ natürlich.
- source_word: ἐκτιναξάμενοι
  choice: schüttelten … ab
  rationale: Das aoristische mediale Partizip von ἐκτινάσσω bezeichnet das kräftige Abschütteln. Für natürliches Deutsch wird es als finites Verb wiedergegeben.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: den Staub von ihren Füßen
  rationale: κονιορτός bezeichnet losen Staub; der Genitiv τῶν ποδῶν wird im Deutschen idiomatisch als Herkunftsangabe „von ihren Füßen“ ausgedrückt.
- source_word: ἐπ’ αὐτοὺς
  choice: gegen sie
  rationale: ἐπί mit Akkusativ trägt bei dieser symbolischen Handlung eine gegen die Betroffenen gerichtete, zeugnishafte Bedeutung. „Gegen sie“ bewahrt diese knappe und zugleich offene Formulierung.
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: zogen weiter nach Ikonion
  rationale: ἔρχομαι bezeichnet hier die Bewegung zu einem genannten Ziel. „zogen weiter“ fügt sich natürlich in den Reisebericht ein, während „nach Ikonion“ εἰς idiomatisch wiedergibt.
theological_decisions:
- issue: Symbolische Handlung des Staubabschüttelns
  choice: Die Handlung wird im Haupttext schlicht als gegen die Betroffenen gerichtete Geste wiedergegeben.
  alternative: „als Zeugnis gegen sie“ oder „zum Zeichen des Gerichts über sie“
  rationale: Der biblische und kulturelle Zusammenhang verleiht der Geste eine Bedeutung der Abgrenzung und des Zeugnisses. Der griechische Wortlaut benennt jedoch nur Handlung und Ausrichtung; die weitergehende Erklärung gehört daher in die Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Satzstruktur und die leichte adversative Nuance von δέ bleiben erhalten.
