revisions:
- from: 'Dass er ihn aber von den Toten auferweckt hat, sodass er nicht mehr zur Verwesung zurückkehren sollte, hat er so ausgesprochen: »Ich werde euch die heiligen, zuverlässigen Gaben Davids geben.«[a]'
  to: 'Dass er ihn aber von den Toten auferweckt hat und dieser nicht mehr zur Verwesung zurückkehren wird, hat er folgendermaßen gesagt: »Ich werde euch die heiligen, zuverlässigen Gaben Davids geben.«[a]'
