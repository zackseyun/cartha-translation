id: ACT.13.34
reference: Acts 13:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: de
  text: 'Dass er ihn aber von den Toten auferweckt hat und dieser nicht mehr zur Verwesung zurückkehren wird, hat er folgendermaßen gesagt: »Ich werde euch die heiligen, zuverlässigen Gaben Davids geben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die heiligen [Dinge] Davids, die zuverlässigen«. Die Formulierung zitiert Jesaja 55,3 und kann die heiligen und verlässlichen Gaben oder Verheißungen bezeichnen, die mit David verbunden sind. Traditionell auch: »die zuverlässigen Gnadenerweise Davids«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: er ihn von den Toten auferweckt hat
  rationale: Die feste deutsche Wendung gibt im Zusammenhang die Auferweckung durch Gott klar und natürlich wieder.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν
  choice: sodass er nicht mehr zur Verwesung zurückkehren sollte
  rationale: Die finale bzw. konsekutive Nuance der Partizipialkonstruktion bleibt offen; „Verwesung“ bezeichnet hier verständlich den körperlichen Zerfall.
- source_word: οὕτως εἴρηκεν
  choice: hat er so ausgesprochen
  rationale: Das Perfekt wird als weiterhin maßgebliches Schriftwort wiedergegeben; „so“ leitet das folgende Zitat knapp ein.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: die heiligen, zuverlässigen Gaben Davids
  rationale: Das substantivierte Neutrum Plural ist elliptisch. „Gaben“ bewahrt den Charakter verheißener Wohltaten, während beide Adjektive ausdrücklich wiedergegeben werden; die Beziehung zu David bleibt wie im Griechischen mehrdeutig.
theological_decisions:
- issue: Bedeutung von τὰ ὅσια Δαυὶδ τὰ πιστά im Zitat aus Jesaja 55,3
  choice: die heiligen, zuverlässigen Gaben Davids
  alternative: die zuverlässigen Gnadenerweise für David; die heiligen und verlässlichen Verheißungen an David
  rationale: Die Formulierung kann auf die mit David verbundenen Bundeswohltaten bzw. Verheißungen weisen. Der Haupttext legt weder Besitz- noch Zielbeziehung des Genitivs enger fest als der griechische Wortlaut; eine Fußnote nennt die wichtigsten Auslegungsmöglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, vermeidet jedoch unnatürliche Wörtlichkeit. Die ungewöhnliche Wendung des Jesajazitats wird im Haupttext lesbar formuliert und in der Fußnote transparent gemacht.
