review_pass:
  verdict: revise
  source_fidelity: 'Die Auferweckung „von den Toten“ ist zutreffend wiedergegeben. Die Formulierung „sodass er ... zurückkehren sollte“ verfehlt jedoch die Aussage von μηκέτι μέλλοντα ὑποστρέφειν: Sie macht aus der nicht mehr bevorstehenden bzw. künftigen Rückkehr eine Folge- oder Zweckbestimmung und schwächt sie durch „sollte“ ab. Der Bezug auf die Schriftrede in οὕτως εἴρηκεν sollte idiomatischer formuliert werden.'
  naturalness: Der bisherige einleitende Dass-Satz ist als schriftsprachliche Konstruktion möglich, doch „hat er so ausgesprochen“ klingt im modernen Standarddeutsch unnötig ungewohnt. „hat er folgendermaßen gesagt“ ist klar und dem Schriftzitat angemessen.
  terminology: „Verwesung“ trifft διαφθορά im Auferstehungskontext. „die heiligen, zuverlässigen Gaben Davids“ ist als lesbare Wiedergabe vertretbar, sollte aber durch eine präzisere Fußnote als elliptische, aus Jesaja 55,3 stammende Formulierung kenntlich gemacht werden. Die Fußnotenalternative „Gnadenerweise für David“ legt die Beziehung enger fest als der griechische Genitiv und wird daher nicht beibehalten.
  issues:
  - severity: medium
    issue: „sodass er nicht mehr zur Verwesung zurückkehren sollte“
    rationale: „Sodass“ legt eine konsekutive Beziehung nahe, und „sollte“ ist hier modal bzw. abgeschwächt. Der griechische Ausdruck besagt vielmehr, dass der Auferweckte nicht mehr zur Verwesung zurückkehren wird bzw. dazu bestimmt ist, nicht mehr zurückzukehren.
  - severity: low
    issue: „hat er so ausgesprochen“
    rationale: Die Wiedergabe ist verständlich, aber im heutigen Deutsch weniger natürlich als eine übliche Einleitung eines Schriftzitats wie „hat er folgendermaßen gesagt“.
  - severity: low
    issue: 'Fußnote: „die zuverlässigen Gnadenerweise für David“'
    rationale: Diese Alternative bestimmt den Genitiv Δαυίδ als Zielbeziehung („für David“) und kann damit eine Auslegung stärker festlegen als der griechische Wortlaut.
  revised_text: 'Dass er ihn aber von den Toten auferweckt hat und dieser nicht mehr zur Verwesung zurückkehren wird, hat er folgendermaßen gesagt: »Ich werde euch die heiligen, zuverlässigen Gaben Davids geben.«[a]'
