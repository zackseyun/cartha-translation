  rationale: Die Überarbeitung beseitigt die unnatürliche Anrede „ihr unter euch“ und erhält zugleich die offene, beschreibende Bedeutung von φοβούμενοι τὸν θεόν. Sie folgt für ἡμῖν dem vorgegebenen SBLGNT-Text und bewahrt die abweichende Lesart ausschließlich in der Fußnote. Die Genitivverbindung bei λόγος τῆς σωτηρίας wird enger abgebildet, ohne das moderne Register zu beeinträchtigen.
