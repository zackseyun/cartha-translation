source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: de
  text: Ihr Brüder, ihr Söhne aus Abrahams Geschlecht und diejenigen unter euch, die Gott fürchten:[a] An uns ist die Botschaft dieser Rettung gesandt worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »die Gottesfürchtigen unter euch«. Die Wendung kann sich besonders auf nichtjüdische Synagogenbesucher beziehen, die den Gott Israels verehrten; sie kann aber auch einfach beschreibend verstanden werden.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »das Wort dieser Rettung«. Einige griechische Handschriften lesen statt »uns«: »euch«.'
    reason: textual_and_lexical_note
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ihr Brüder
  rationale: Die natürliche deutsche Anrede bewahrt die ausdrücklich maskuline Form des Griechischen. Das vorangestellte ἄνδρες wird im Deutschen nicht hölzern als »Männer« wiederholt; die mögliche weitere Reichweite der öffentlichen Anrede wird in der Fußnote genannt.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: ihr Söhne aus dem Geschlecht Abrahams
  rationale: »Söhne« gibt υἱοί ausdrücklich wieder; »Geschlecht Abrahams« bezeichnet hier Abstammung und Volkszugehörigkeit, ohne das heute missverständliche Wort »Rasse« zu verwenden.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: ihr unter euch, die ihr Gott fürchtet
  rationale: Die Formulierung bleibt beschreibend und gibt φοβούμενοι transparent mit »fürchtet« wieder. Sie lässt zugleich offen, ob die Wendung als Bezeichnung nichtjüdischer Synagogenanhänger gebraucht wird.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der Sendung. Die Voranstellung von »Uns« bewahrt die Hervorhebung im griechischen Satz.
- source_word: ὁ λόγος
  choice: die Botschaft
  rationale: λόγος bezeichnet im Verkündigungszusammenhang die mitgeteilte Botschaft; »Botschaft« ist im modernen Deutsch natürlicher als »Wort«, während die wörtlichere Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: τῆς σωτηρίας ταύτης
  choice: von dieser Rettung
  rationale: Die Genitivverbindung bezeichnet Inhalt beziehungsweise Gegenstand der Botschaft. »Rettung« ist verständlich und gibt σωτηρία konkret wieder, ohne den theologischen Gehalt abzuschwächen.
- source_word: ἐξαπεστάλη
  choice: ist ... gesandt worden
  rationale: Das deutsche Perfekt Passiv gibt die vollzogene Sendung mit ihrer Bedeutung für die gegenwärtige Redesituation idiomatisch wieder.
theological_decisions:
- issue: Bezeichnung der Gottesfürchtigen im Publikum
  choice: 'Beschreibend: »die ihr Gott fürchtet«'
  alternative: »die Gottesfürchtigen unter euch« als möglicherweise halbtechnische Bezeichnung
  rationale: Die beschreibende Übersetzung bewahrt den unmittelbaren Sinn und legt nicht zwingend fest, dass ein historischer Gruppenname vorliegt; der synagogale Hintergrund wird in der Fußnote erläutert.
- issue: Geschlechtsspezifische Anrede
  choice: »Ihr Brüder«
  alternative: »Brüder und Schwestern« oder wörtlich »Männer, Brüder«
  rationale: Die Übersetzung wahrt die grammatisch maskuline Anrede, ohne über den Wortlaut hinaus ausdrücklich Frauen hinzuzufügen. Dass die öffentliche Anrede einen weiteren Zuhörerkreis einschließen kann, bleibt in der Fußnote sichtbar.
- issue: Bezugsgröße des Empfängerpronomens ἡμῖν
  choice: »Uns ist ... gesandt worden«
  alternative: 'Nach einer gut bezeugten Textvariante: »Euch ist ... gesandt worden«'
  rationale: Der vorgelegte SBLGNT-Text liest ἡμῖν und wird daher im Haupttext als »uns« übersetzt. Die Variante ὑμῖν betrifft unmittelbar die Adressaten der Heilsbotschaft und wird nicht stillschweigend harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede wird rhythmisch gegliedert; die Voranstellung von »Uns« erhält den Nachdruck des griechischen ἡμῖν. »Rettung« ist allgemein verständlicher und konkreter als das stärker kirchensprachliche »Heil«.
