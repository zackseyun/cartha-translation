  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: de
  text: Am folgenden Sabbat[a] kam fast die ganze Stadt zusammen, um das Wort des Herrn[b] zu hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Am nächsten Sabbat“ oder „Am darauffolgenden Sabbat“.'
    reason: lexical_alternative
  - marker: b
    text: „Das Wort des Herrn“ kann auch im Sinn von „die Botschaft des Herrn“ oder, im Kontext, „die Botschaft über den Herrn“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: Am folgenden Sabbat
  rationale: Die Dativkonstruktion bezeichnet den Zeitpunkt. „Am folgenden Sabbat“ ist im Deutschen natürlich und gibt ἐρχομένῳ wieder, ohne genauer festzulegen, ob „der nächste“ oder allgemeiner „der darauffolgende“ Sabbat gemeint ist. Das schwach weiterführende δέ muss hier nicht eigens mit „aber“ wiedergegeben werden.
- source_word: σχεδὸν
  choice: fast
  rationale: σχεδόν bedeutet „fast“ oder „beinahe“; „fast die ganze Stadt“ ist die geläufige deutsche Formulierung.
- source_word: πᾶσα ἡ πόλις
  choice: die ganze Stadt
  rationale: Die Wendung bezeichnet idiomatisch und wohl verallgemeinernd die Bevölkerung der Stadt, nicht zwingend ausnahmslos jeden Einzelnen.
- source_word: συνήχθη
  choice: kam zusammen
  rationale: Der Aorist Passiv von συνάγω hat hier intransitive Bedeutung. „Kam zusammen“ klingt natürlich und bewahrt den Gedanken einer Versammlung.
- source_word: ἀκοῦσαι
  choice: um … zu hören
  rationale: Der Infinitiv bezeichnet den Zweck des Zusammenkommens. „Hören“ ist die direkte und kontextgerechte Wiedergabe.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: λόγος kann „Wort“, „Botschaft“ oder „Rede“ bedeuten. „Das Wort“ bewahrt den in der Apostelgeschichte wiederkehrenden Sprachgebrauch für die verkündigte Botschaft.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal als „des Herrn“ wiedergegeben. So bleibt offen, ob Herkunft, Zugehörigkeit oder Inhalt der Botschaft im Vordergrund steht.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die natürliche und traditionsübergreifend verständliche Wiedergabe von κύριος und engt den Bezug nicht über den griechischen Text hinaus ein.
- issue: Bedeutung von „das Wort des Herrn“
  choice: Die Genitivverbindung bleibt unverändert erhalten.
  alternative: „die Botschaft des Herrn“ oder „die Botschaft über den Herrn“
  rationale: Die Formulierung kann die vom Herrn stammende, ihm zugehörige oder ihn betreffende Botschaft bezeichnen. Die wörtliche Genitivverbindung bewahrt diese sich überlagernden Bedeutungsnuancen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung ist flüssig; „das Wort des Herrn“ bewahrt bewusst die traditionelle Formulierung und ihre Mehrdeutigkeit.
