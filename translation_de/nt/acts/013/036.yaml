  verdict: revise
  source_fidelity: Die Grundstruktur mit dem vorzeitigen Aoristpartizip, dem Schlafbild für den Tod und dem wörtlich-rhetorischen „die Verwesung sehen“ wird zutreffend wiedergegeben. „Zu seiner Zeit“ schwächt jedoch ἰδίᾳ γενεᾷ („in seiner eigenen Generation“) ab. „Wurde zu seinen Vätern gelegt“ fügt zudem das im Griechischen nicht ausgedrückte Moment des Begräbnisses/Legens hinzu; προσετέθη bezeichnet das Hinzugefügt- bzw. Versammeltwerden zu den Vätern.
  naturalness: „Entschlief“ ist bewusst bibelsprachlich, aber weiterhin verständlich und hier als Wiedergabe des griechischen Euphemismus angemessen. „In seiner eigenen Generation Gottes Plan dienen“ und „zu seinen Vätern versammelt werden“ sind klare, würdige und idiomatische Formulierungen.
  terminology: „Gottes Plan“ gibt βουλή in modernem Standarddeutsch natürlich als Gottes Absicht bzw. Vorhaben wieder. „Zu seinen Vätern versammelt“ wahrt den biblisch-semitischen Charakter des Ausdrucks besser als „gelegt“, ohne eine konkrete Bestattung zu behaupten.
  issues:
  - severity: medium
    issue: „zu seiner Zeit“ statt „in seiner eigenen Generation“
    rationale: Die Formulierung gibt den Eigenbezug und das Substantiv γενεά nur verallgemeinert zeitlich wieder. „In seiner eigenen Generation“ ist quellenäher und im Deutschen natürlich.
  - severity: medium
    issue: „wurde zu seinen Vätern gelegt“
    rationale: „gelegt“ ist keine Entsprechung von προσετέθη und kann ein nicht ausdrücklich genanntes Begräbnis nahelegen. „Wurde zu seinen Vätern versammelt“ gibt die idiomatische Aussage vom Beitritt zu den Vorfahren im Tod angemessener wieder.
