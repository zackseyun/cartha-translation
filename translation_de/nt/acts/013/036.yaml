  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: de
  text: Denn nachdem David in seiner eigenen Generation Gottes Plan gedient hatte[a], entschlief er[b], wurde zu seinen Vätern versammelt[c] und sah die Verwesung[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gottes Ratschluss“.'
    reason: lexical_alternative
  - marker: b
    text: „Entschlief“ ist eine biblische Umschreibung für „starb“.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „wurde seinen Vätern hinzugefügt“; eine hebräisch geprägte Wendung dafür, dass er im Tod zu seinen Vorfahren kam.'
    reason: lexical_alternative
  - marker: d
    text: 'Das heißt: Sein Körper verweste; siehe den Gegensatz im folgenden Vers.'
    reason: cross_reference
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ … τῇ τοῦ θεοῦ βουλῇ
  choice: zu seiner Zeit dem Ratschluss Gottes
  rationale: Beide Dativgruppen können syntaktisch unterschiedlich auf ὑπηρετήσας bezogen werden. Der Haupttext versteht τῇ τοῦ θεοῦ βουλῇ als Ergänzung zu „dienen“ und ἰδίᾳ γενεᾷ zeitlich im Sinn von „zu seiner Zeit“. Die ebenfalls gut mögliche Zuordnung „seiner Generation dienen – nach Gottes Ratschluss“ bleibt in der Fußnote erhalten.
- source_word: ὑπηρετήσας
  choice: nachdem … gedient hatte
  rationale: Das Aoristpartizip bezeichnet hier eine dem Entschlafen vorausgehende Tätigkeit. Die finite deutsche Konstruktion ist natürlich und macht die zeitliche Abfolge klar.
- source_word: βουλή
  choice: Ratschluss
  rationale: „Ratschluss“ gibt Gottes Willen beziehungsweise Absicht würdevoll und im Deutschen verständlich wieder, ohne ihn auf bloßen Rat zu reduzieren.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Die traditionelle, noch verständliche Wendung bewahrt das griechische Schlafbild als verhüllende Bezeichnung für den Tod.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: wurde zu seinen Vätern gelegt
  rationale: Diese idiomatische Wiedergabe bewahrt den semitisch geprägten Ausdruck vom Hinzukommen zu den Vorfahren im Tod. Sie ist im Deutschen natürlicher als das wörtliche „wurde hinzugefügt“.
- source_word: εἶδεν διαφθοράν
  choice: sah die Verwesung
  rationale: Die direkte Formulierung erhält die Verbindung zur zuvor zitierten Psalmaussage und den Gegensatz zum folgenden Vers. Gemeint ist, dass Davids Körper verweste.
theological_decisions:
- issue: Syntaktische Zuordnung der beiden Dativgruppen
  choice: David diente zu seiner Zeit dem Ratschluss Gottes
  alternative: David diente nach Gottes Ratschluss seiner eigenen Generation
  rationale: Die griechische Wortstellung und Kasusfügung lassen beide Deutungen zu. Der Haupttext folgt der in diesem Zusammenhang naheliegenden Auffassung von βουλή als dem Gegenstand des Dienens; die alternative Deutung wird ausdrücklich dokumentiert, statt die echte Mehrdeutigkeit aufzulösen.
- issue: Bildhafte Bezeichnung von Davids Tod
  choice: entschlief
  alternative: starb
  rationale: Das griechische Verb verwendet bewusst das Schlafbild. Seine Beibehaltung wahrt die biblische Ausdrucksweise, ohne daraus eine weitergehende Lehraussage über den Zustand der Toten abzuleiten.
- issue: διαφθορά im Gegensatz zum folgenden Vers
  choice: sah die Verwesung
  alternative: verweste
  rationale: Die quellennähere Wendung bewahrt den rhetorischen Anschluss an die Psalmenauslegung und den Gegensatz zu dem, der keine Verwesung sah.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entschlief“, „Ratschluss“ und „zu seinen Vätern gelegt“ sind bewusst bibelsprachlich, bleiben aber verständlich. Die Satzstruktur wurde gegenüber dem Griechischen leicht entfaltet, damit Abfolge und Hauptaussage im Deutschen klar sind.
