  rationale: Die Revision erhält den bibelsprachlichen Registerton und die Abfolge des griechischen Satzes, stellt aber „eigene Generation“ ausdrücklich wieder her. Sie ersetzt außerdem das nicht quellengedeckte „gelegt“ durch „versammelt“, eine etablierte und sinngetreue deutsche Wiedergabe des idiomatischen Hinzugefügtwerdens zu den Vätern. Die Fußnote zur behaupteten Satzmehrdeutigkeit wird durch eine belastbare lexikalische Alternative ersetzt.
