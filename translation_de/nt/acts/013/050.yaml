id: ACT.13.50
reference: Acts 13:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: de
  text: Die Juden aber wiegelten die angesehenen gottesfürchtigen Frauen[a] und die führenden Männer der Stadt auf. Sie entfachten eine Verfolgung gegen Paulus und Barnabas und vertrieben sie aus ihrem Gebiet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die angesehenen frommen Frauen“. Der Ausdruck kann Frauen bezeichnen, die den Gott Israels verehrten, möglicherweise nichtjüdische Personen aus dem Umfeld der Synagoge.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus ihrem Bezirk“ beziehungsweise „über ihre Grenzen hinaus“. Das griechische Wort kann sowohl territoriale Grenzen als auch das von ihnen umschlossene Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Die Juden aber
  rationale: δέ markiert den Gegensatz zur vorausgehenden positiven Aufnahme der Botschaft; die Nachstellung von „aber“ entspricht natürlichem, würdevollem Deutsch.
- source_word: παρώτρυναν
  choice: wiegelten … auf
  rationale: Gibt die aktive, feindselige Anstiftung idiomatisch und kräftig wieder.
- source_word: τὰς σεβομένας γυναῖκας
  choice: die gottesfürchtigen Frauen
  rationale: Das Partizip bezeichnet in der Apostelgeschichte häufig Menschen, die den Gott Israels verehrten, oft nichtjüdische Personen im Umfeld der Synagoge. „Gottesfürchtig“ wahrt den religiösen Bezug, ohne ihren genauen Status festzulegen.
- source_word: τὰς εὐσχήμονας
  choice: angesehenen
  rationale: Bezeichnet gesellschaftliche Achtung, respektable Stellung oder Prominenz; „angesehen“ ist im Deutschen natürlich und deckt diese Bedeutungsbreite gut ab.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: die führenden Männer der Stadt
  rationale: πρῶτοι meint hier die im städtischen Rang führenden Personen; die maskuline Referenz des griechischen Ausdrucks bleibt erhalten.
- source_word: ἐπήγειραν διωγμὸν
  choice: entfachten eine Verfolgung
  rationale: Die Verbindung bezeichnet das Hervorrufen einer Verfolgung. „Entfachten“ gibt die verursachende und eskalierende Kraft natürlich wieder, ohne die Wiederholung von „aufwiegeln“.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: gegen Paulus und Barnabas
  rationale: ἐπί mit Akkusativ bezeichnet zusammen mit διωγμός die feindliche Zielrichtung.
- source_word: ἐξέβαλον
  choice: vertrieben
  rationale: Bewahrt den gewaltsamen beziehungsweise zwingenden Sinn von ἐκβάλλω und klingt in diesem territorialen Zusammenhang natürlich.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: aus ihrem Gebiet
  rationale: ὅρια kann die Grenzen selbst oder das von ihnen umschlossene Gebiet bezeichnen. „Gebiet“ passt zum städtischen Herrschafts- beziehungsweise Einflussbereich und bewahrt die räumliche Bedeutungsbreite.
theological_decisions:
- issue: Religiöser Status der σεβόμεναι γυναῖκες
  choice: gottesfürchtige Frauen
  alternative: fromme Frauen / Frauen, die Gott verehrten
  rationale: Der Ausdruck weist auf die Verehrung des Gottes Israels hin, legt aber nicht eindeutig fest, ob es sich um Proselytinnen oder um nichtjüdische Sympathisantinnen der Synagoge handelte. Die Übersetzung vermeidet diese Festlegung; die Fußnote erläutert die verbleibende Offenheit.
- issue: Geschlechtliche Markierung bei τοὺς πρώτους τῆς πόλεως
  choice: die führenden Männer der Stadt
  alternative: die führenden Persönlichkeiten der Stadt / die Stadtobersten
  rationale: Der griechische Text verwendet ausdrücklich eine maskuline Pluralform. „Männer“ bewahrt diese Angabe, ohne über ihre konkreten Ämter zu spekulieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung verhindert eine schwerfällige Häufung von „und“, ohne die Abfolge oder den Zusammenhang der Handlungen zu verändern. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
