  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: de
  text: Das Wort des Herrn aber breitete sich in der ganzen Gegend aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Botschaft des Herrn.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: breitete sich … aus
  rationale: Der Imperfekt bezeichnet einen fortdauernden Vorgang in der Vergangenheit. Die idiomatische deutsche Formulierung gibt das Geschehen natürlich wieder; obwohl das griechische Verb formal passiv ist, lässt sich der Vorgang im Deutschen hier passend reflexiv ausdrücken.
- source_word: δὲ
  choice: aber
  rationale: δέ führt die Erzählung mit einer milden Weiterführung fort. „Aber“ bewahrt zugleich den im Kontext wahrnehmbaren Gegensatz zur vorausgehenden Verfolgung, ohne ihn stark zu betonen.
- source_word: ὁ λόγος
  choice: das Wort
  rationale: λόγος bezeichnet hier die verkündete Botschaft. „Das Wort“ bewahrt den wiederkehrenden lukanischen Ausdruck und seine theologische Resonanz; die Bedeutungsalternative wird in der Fußnote genannt.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal bewahrt. „Herr“ gibt κύριος in diesem christologisch geprägten Zusammenhang angemessen und traditionsübergreifend wieder.
- source_word: δι’ ὅλης τῆς χώρας
  choice: in der ganzen Gegend
  rationale: διά mit Genitiv beschreibt hier die Ausbreitung durch das gesamte Gebiet. „In der ganzen Gegend“ ist modernes, natürliches Deutsch und vermeidet die Vorstellung eines modernen Nationalstaats.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ bewahrt die christologische und biblische Resonanz des Ausdrucks, ohne ihn auf bloße Autoritätssprache zu verengen.
- issue: Wiedergabe von λόγος als Verkündigungsbegriff
  choice: Wort
  alternative: Botschaft
  rationale: „Wort“ erhält die charakteristische lukanische Redeweise; „Botschaft“ verdeutlicht zwar den Sinn, würde aber die literarische und theologische Mehrdeutigkeit stärker festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der griechischen Wortfolge nicht starr, bewahrt aber den fortdauernden Verlauf, den milden Anschluss durch δέ und die lukanische Wendung „das Wort des Herrn“.
