revisions:
- from: Dieser stand in Diensten des Prokonsuls Sergius Paulus, eines verständigen Mannes. Der ließ Barnabas und Saulus zu sich rufen, weil er das Wort Gottes hören wollte.[a]
  to: Er war beim Prokonsul Sergius Paulus, einem verständigen Mann. Dieser rief Barnabas und Saulus zu sich und wünschte, das Wort Gottes zu hören.[a]
  rationale: Die Revision entfernt die unbelegte Aussage eines Dienstverhältnisses und bewahrt die von σύν offen gelassene Beziehung. Zugleich gibt sie die Initiative des Prokonsuls und sein ausdrückliches Interesse am Hören der Botschaft in einer dem griechischen Satzbau nahen, idiomatischen Form wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:57:32Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἀνθύπατος als „Prokonsul“, συνετός als „verständig“, den Namen sowie „das Wort Gottes“ ist sachgerecht. „stand in Diensten des“ geht jedoch über σύν („mit, bei“) hinaus und behauptet ein Dienstverhältnis, das der griechische Text nicht ausdrückt. Die kausale Verbindung „weil“ und die Abschwächung zu „wollte“ bilden ἐπεζήτησεν ἀκοῦσαι weniger unmittelbar ab als eine koordinierte Wiedergabe des entschiedenen Wunsches.
  naturalness: „Er war beim Prokonsul“ ist im erzählerischen Kontext natürlich und wahrt die offene Art der Verbindung. „Dieser rief Barnabas und Saulus zu sich und wünschte, … zu hören“ ist modernes Standarddeutsch und bildet die Wiederaufnahme durch οὗτος sowie die Abfolge des griechischen Satzes klar ab.
  terminology: „Prokonsul“, „Sergius Paulus“, „Barnabas“, „Saulus“, „verständig“ und „das Wort Gottes“ sind angemessen. Die Fußnotenalternative „die Botschaft Gottes“ ist möglich; sie ist als kommunikativere Alternative zu λόγος τοῦ θεοῦ korrekt gekennzeichnet.
  issues:
  - severity: medium
    issue: „stand in Diensten des Prokonsuls“ für σὺν τῷ ἀνθυπάτῳ
    rationale: Die Formulierung legt ein abhängiges Dienst- oder Amtsverhältnis nahe. σύν bezeichnet lediglich das Zusammensein bzw. die Verbindung mit dem Prokonsul und lässt die genaue Beziehung offen.
  - severity: low
    issue: „weil er das Wort Gottes hören wollte“ für ἐπεζήτησεν ἀκοῦσαι
    rationale: Die Konstruktion macht den Wunsch des Prokonsuls zur Begründung des Rufens und „wollte“ ist etwas schwächer. Der griechische Text reiht die Handlungen aneinander und betont sein Bemühen bzw. seinen Wunsch, das Wort Gottes zu hören.
  revised_text: Er war beim Prokonsul Sergius Paulus, einem verständigen Mann. Dieser rief Barnabas und Saulus zu sich und wünschte, das Wort Gottes zu hören.[a]
