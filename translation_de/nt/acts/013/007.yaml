source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: de
  text: Er war beim Prokonsul Sergius Paulus, einem verständigen Mann. Dieser rief Barnabas und Saulus zu sich und wünschte, das Wort Gottes zu hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Botschaft Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν τῷ ἀνθυπάτῳ
  choice: stand in Diensten des Prokonsuls
  rationale: σύν bezeichnet hier die Verbindung des zuvor genannten Elymas mit dem Amtsträger. Im Deutschen macht „stand in Diensten“ diese Zugehörigkeit im Kontext natürlich deutlich; ἀνθύπατος wird mit dem präzisen römischen Amtstitel „Prokonsul“ wiedergegeben.
- source_word: ἀνδρὶ συνετῷ
  choice: eines verständigen Mannes
  rationale: συνετός bezeichnet Einsicht, Verstand oder Klugheit. „verständig“ bewahrt die positive, aber nicht ausdrücklich moralische Charakterisierung.
- source_word: οὗτος
  choice: Der
  rationale: Das Demonstrativpronomen greift Sergius Paulus nach der eingeschobenen Beschreibung wieder auf. „Der“ erhält diese hervorgehobene Wiederaufnahme natürlicher als ein bloßes „er“.
- source_word: προσκαλεσάμενος
  choice: ließ … zu sich rufen
  rationale: Das mediale Partizip bezeichnet, dass der Prokonsul Barnabas und Saulus zu sich rufen ließ. Die Formulierung passt zu seiner amtlichen Stellung, ohne einen Zwang zu behaupten.
- source_word: ἐπεζήτησεν ἀκοῦσαι
  choice: weil er … hören wollte
  rationale: ἐπιζητέω drückt hier ein ernsthaftes Verlangen oder Bemühen aus. Die deutsche Nebensatzkonstruktion gibt den Zusammenhang idiomatisch wieder.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die Wendung bezeichnet die von Gott kommende bzw. ihn betreffende verkündigte Botschaft. „das Wort Gottes“ bleibt eng am griechischen Ausdruck und bewahrt die vertraute biblische Formulierung.
- source_word: Σεργίῳ Παύλῳ
  choice: Sergius Paulus
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnabas und Saulus
  rationale: Die Personennamen werden nach den etablierten deutschen biblischen Namensformen wiedergegeben.
theological_decisions:
- issue: Bedeutung von λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  alternative: die Botschaft Gottes
  rationale: Die traditionellere Wiedergabe bildet die Genitivverbindung formal ab und legt nicht fest, ob der Genitiv vor allem Ursprung, Inhalt oder Zugehörigkeit bezeichnet. Eine Fußnote nennt die kommunikativ deutlichere Alternative.
- issue: Nuance von συνετός
  choice: verständig
  alternative: klug; einsichtsvoll
  rationale: „verständig“ bezeichnet Urteils- und Auffassungsvermögen, ohne Sergius Paulus ausdrücklich eine geistliche oder moralische Tugend zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz schließt als Relativsatz inhaltlich an Vers 6 an; „Dieser“ hält diesen Anschluss sichtbar. Die amtliche Stellung des Prokonsuls und seine Initiative werden klar, ohne den Ton unnötig zu verschärfen.
