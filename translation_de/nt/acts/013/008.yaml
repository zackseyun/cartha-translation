id: ACT.13.8
reference: Acts 13:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: de
  text: Doch Elymas, der Magier – so wird nämlich sein Name übersetzt[a] –, widersetzte sich ihnen und versuchte, den Prokonsul vom Glauben abzubringen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elymas wird hier als übersetzter oder gedeuteter Name erklärt; seine genaue Herleitung ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung kann sowohl bedeuten, ihn vom christlichen Glauben wegzuführen, als auch, ihn davon abzuhalten, gläubig zu werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθίστατο
  choice: widersetzte sich
  rationale: Das Imperfekt beschreibt seinen fortdauernden Widerstand; „sich widersetzen“ gibt den adversativen Sinn natürlich und präzise wieder.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zur zuvor geschilderten aufgeschlossenen Haltung des Prokonsuls.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Bewahrt den griechischen Rückverweis auf die zuvor genannten Verkündiger, ohne sie unnötig erneut zu benennen.
- source_word: Ἐλύμας
  choice: Elymas
  rationale: Der Personenname wird in der üblichen deutschen Form transliteriert.
- source_word: ὁ μάγος
  choice: der Magier
  rationale: „Magier“ ist verständlich und lässt die Bedeutungsbreite von μάγος eher offen als das stärker negativ festgelegte „Zauberer“.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: so wird nämlich sein Name übersetzt
  rationale: Gibt die erklärende Parenthese und den Sinn von μεθερμηνεύεται als Übersetzen beziehungsweise Deuten eines Namens wieder.
- source_word: ζητῶν
  choice: und versuchte
  rationale: Das Partizip bezeichnet die mit seinem Widerstand verbundene Absicht; eine finite Koordination ist im Deutschen natürlicher.
- source_word: διαστρέψαι
  choice: abzubringen
  rationale: Bei einer Person als Objekt und ἀπό mit Bezugspunkt bedeutet das Verb hier, jemanden von etwas wegzuwenden; „abbringen“ ist idiomatisch und klar.
- source_word: τὸν ἀνθύπατον
  choice: den Prokonsul
  rationale: Bewahrt den präzisen römischen Amtstitel.
- source_word: ἀπὸ τῆς πίστεως
  choice: vom Glauben
  rationale: Der Artikel und der Zusammenhang können auf den christlichen Glauben als bestimmten Bezug verweisen; zugleich bleibt die deutsche Wendung für den Vorgang des Glaubens offen.
theological_decisions:
- issue: Wiedergabe von πίστις
  choice: vom Glauben
  alternative: vom Glauben an die Botschaft / davon abzuhalten zu glauben
  rationale: „Glaube“ ist die direkte und theologisch nicht vorschnell festgelegte Wiedergabe. Der griechische Artikel kann den christlichen Glauben bezeichnen, während der Kontext zugleich eine glaubende Reaktion meinen kann; diese Spannung wird in der Fußnote benannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parenthese wird mit Gedankenstrichen kenntlich gemacht; „Magier“ vermeidet eine unnötig verschärfte Wertung, und „Prokonsul“ erhält die historische Amtsbezeichnung.
