id: ACT.13.13
reference: Acts 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: de
  text: Nachdem Paulus und seine Begleiter[a] von Paphos aus in See gestochen waren, kamen sie nach Perge in Pamphylien. Johannes aber verließ sie und kehrte nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die um Paulus«; oder: »die Leute um Paulus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: Nachdem … in See gestochen waren
  rationale: Das Partizip von ἀνάγω bezeichnet im Zusammenhang einer Seereise das Ablegen beziehungsweise In-See-Stechen. Die deutsche Wiedergabe bewahrt den maritimen Sinn und gibt die zeitliche Beziehung zum Hauptverb natürlich wieder.
- source_word: οἱ περὶ Παῦλον
  choice: die Männer um Paulus
  rationale: Die Wendung οἱ περὶ mit Akkusativ bezeichnet die zu einer Person gehörende Gruppe. »Die Männer um Paulus« bleibt nahe am griechischen Ausdruck; die geläufigere Alternative »Paulus und seine Begleiter« wird in der Fußnote genannt.
- source_word: ἦλθον
  choice: kamen
  rationale: ἔρχομαι kann je nach Erzählperspektive »kommen« oder »gehen« bedeuten. »Kamen« entspricht hier dem Zielpunkt der Reise und klingt im deutschen Reisebericht natürlich.
- source_word: Πέργην τῆς Παμφυλίας
  choice: nach Perge in Pamphylien
  rationale: Der Genitiv ordnet Perge der Landschaft Pamphylien zu; im Deutschen wird diese Ortsbeziehung idiomatisch mit »in Pamphylien« ausgedrückt.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: verließ sie
  rationale: ἀποχωρέω bezeichnet ein Weggehen oder Sich-Entfernen. »Verließ sie« ist knapp und neutral und unterstellt Johannes kein im Vers ungenanntes Motiv.
- source_word: ὑπέστρεψεν
  choice: kehrte … zurück
  rationale: ὑποστρέφω bedeutet regelmäßig »zurückkehren«; die gewählte Form ist im deutschen Erzählstil klar und würdig.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Verwendet wird die im Deutschen etablierte Form des Ortsnamens.
theological_decisions:
- issue: Bewertung von Johannes’ Fortgang
  choice: Die Handlung wird neutral mit »verließ sie« wiedergegeben.
  alternative: »trennte sich von ihnen« oder wertend »ließ sie im Stich«
  rationale: Der Vers nennt weder das Motiv noch eine moralische Bewertung seines Fortgangs. Ein späterer Konflikt über dieses Ereignis rechtfertigt es nicht, die Wertung bereits hier in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bildet die zeitliche Abfolge des griechischen Partizips ab, ohne unnatürlich zu wirken. Der Gruppenbezug um Paulus bleibt sichtbar, und Johannes’ Weggang wird bewusst ohne zusätzliche moralische Deutung formuliert.
