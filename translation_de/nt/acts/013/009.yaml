  source_fidelity: 'Die Übersetzung gibt alle Bestandteile des griechischen Textes sachgerecht wieder: Σαῦλος als „Saulus“, δέ als die milde Wendung „aber“, die zusätzliche Namensangabe mit „der auch Paulus hieß“, πλησθεὶς πνεύματος ἁγίου als „war vom Heiligen Geist erfüllt“ sowie ἀτενίσας εἰς αὐτόν als „blickte ihn unverwandt an“. Die finite deutsche Satzgestaltung ist eine natürliche Wiedergabe der griechischen Partizipien und fügt keine Aussage über Zeitpunkt oder Ursache hinzu.'
