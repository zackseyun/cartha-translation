  terminology: „Saulus“ und „Paulus“ entsprechen den etablierten deutschen biblischen Namensformen. „Der Heilige Geist“ ist im lukanischen Kontext terminologisch und sachlich angemessen. „Hieß“ bezeichnet einen weiteren Namen, ohne eine Umbenennung zu unterstellen.
