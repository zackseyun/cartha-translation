id: ACT.13.9
reference: Acts 13:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: de
  text: Saulus aber, der auch Paulus hieß, war vom Heiligen Geist erfüllt und blickte ihn unverwandt an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulus
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: δέ
  choice: aber
  rationale: Kennzeichnet hier eine leichte Gegenüberstellung beziehungsweise narrative Wendung zu Saulus’ Reaktion.
- source_word: ὁ καὶ Παῦλος
  choice: der auch Paulus hieß
  rationale: Die appositionelle Wendung führt Paulus als weiteren Namen des Saulus ein, ohne einen Namenswechsel oder dessen Grund zu behaupten.
- source_word: πλησθεὶς
  choice: war … erfüllt
  rationale: Gibt das passive Partizip natürlich wieder und bewahrt, dass die Erfüllung an Saulus geschieht.
- source_word: πνεύματος ἁγίου
  choice: vom Heiligen Geist
  rationale: Nach „erfüllt“ ist „vom Heiligen Geist erfüllt“ idiomatisches Deutsch und bezeichnet im lukanischen Zusammenhang den göttlichen Geist.
- source_word: ἀτενίσας
  choice: blickte … unverwandt an
  rationale: Bringt den anhaltenden, festen Blick des Verbs prägnant und in würdigem modernem Deutsch zum Ausdruck.
- source_word: εἰς αὐτόν
  choice: ihn … an
  rationale: Bei ἀτενίζω bezeichnet εἰς mit Akkusativ das Ziel des Blicks; das Pronomen bezieht sich im Zusammenhang auf Elymas.
theological_decisions:
- issue: Wiedergabe von πνεύματος ἁγίου
  choice: der Heilige Geist
  alternative: ein heiliger Geist
  rationale: Der Sprachgebrauch der Apostelgeschichte und der Zusammenhang göttlicher Befähigung weisen auf den göttlichen Heiligen Geist als bestimmten Referenten.
- issue: Verhältnis der Namen Saulus und Paulus
  choice: der auch Paulus hieß
  alternative: der auch Paulus genannt wurde
  rationale: Die Formulierung wahrt die Aussage eines zusätzlichen Namens und vermeidet die unbelegte Annahme, an dieser Stelle werde eine Umbenennung vollzogen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Unverwandt“ bewahrt die Intensität des Blicks, ohne die härtere Nebenbedeutung von „anstarren“. Die griechischen Partizipien werden für einen natürlichen deutschen Vers als koordinierte Prädikate wiedergegeben.
