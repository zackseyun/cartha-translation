id: ACT.13.35
reference: Acts 13:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: de
  text: 'Darum sagt er auch an einer anderen Stelle[a]: »Du wirst nicht zulassen, dass dein Heiliger[b] die Verwesung[c] sieht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einem anderen Psalm« beziehungsweise »in einem anderen Abschnitt«; im Griechischen steht lediglich »in einem anderen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dein Getreuer«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »das Verderben« beziehungsweise »den Zerfall«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Darum
  rationale: Im Zusammenhang leitet διότι eine Folgerung aus dem zuvor Gesagten ein; »Darum« gibt diese argumentative Funktion natürlich wieder.
- source_word: καὶ
  choice: auch
  rationale: καί fügt einen weiteren Schriftbeleg hinzu.
- source_word: ἐν ἑτέρῳ
  choice: an einer anderen Stelle
  rationale: Das griechische Substantiv ist ausgelassen. Die offene Wiedergabe bewahrt diese Ellipse besser, als ausdrücklich »Psalm« einzusetzen, obwohl das Zitat aus einem Psalm stammt.
- source_word: λέγει
  choice: sagt er
  rationale: Der Präsensgebrauch der Schriftzitationsformel bleibt erhalten; das unausgesprochene Subjekt kann im Kontext auf Gott bezogen werden.
- source_word: Οὐ δώσεις … ἰδεῖν
  choice: Du wirst nicht zulassen, dass … sieht
  rationale: δίδωμι mit Infinitiv hat hier die idiomatische Bedeutung »zulassen«; die Konstruktion ergibt zugleich natürliches modernes Deutsch.
- source_word: τὸν ὅσιόν σου
  choice: dein Heiliger
  rationale: ὅσιος bezeichnet hier den Gott zugehörigen heiligen beziehungsweise treuen Menschen. »dein Heiliger« wahrt die traditionelle, im Kontext christologische Ausdrucksweise; die Alternative wird vermerkt.
- source_word: διαφθοράν
  choice: Verwesung
  rationale: Im Auferstehungszusammenhang bezeichnet διαφθορά den körperlichen Zerfall. »Verwesung« ist im Deutschen präzise und verständlich, während »Verderben« die breitere lexikalische Möglichkeit wahrt.
theological_decisions:
- issue: Christologischer Bezug des Psalmzitats
  choice: »dein Heiliger« mit Großschreibung
  alternative: »dein heiliger/treuer Diener«
  rationale: Paulus bezieht das Zitat im unmittelbaren Zusammenhang auf Jesus. Die substantivische Großschreibung ist zudem reguläre deutsche Orthografie und macht keine über den Kontext hinausgehende dogmatische Festlegung.
- issue: Ergänzung des ausgelassenen Nomens nach ἐν ἑτέρῳ
  choice: »an einer anderen Stelle«
  alternative: »in einem anderen Psalm«
  rationale: Der griechische Text sagt nur »in einem anderen«. Die offene Formulierung bewahrt die echte syntaktische Unbestimmtheit, während die Fußnote auf die mögliche kontextuelle Ergänzung hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede folgt der sachlich-feierlichen Sprache eines Schriftzitats, ohne unnötig altertümliche Wendungen. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erklärten Formulierung.
