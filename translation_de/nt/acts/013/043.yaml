  to: Als die Synagogenversammlung beendet war[a], folgten viele von den Juden und den gottesfürchtigen Proselyten Paulus und Barnabas. Diese redeten mit ihnen und versuchten sie zu überzeugen, in der Gnade Gottes zu bleiben[b].
