source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: de
  text: Als die Synagogenversammlung beendet war[a], folgten viele von den Juden und den gottesfürchtigen Proselyten Paulus und Barnabas. Diese redeten mit ihnen und versuchten sie zu überzeugen, in der Gnade Gottes zu bleiben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als die Versammlung in der Synagoge sich aufgelöst hatte.“ Das griechische Wort kann hier die versammelte Gemeinschaft beziehungsweise ihre Zusammenkunft bezeichnen, nicht das Gebäude.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie dazu zu bewegen, in der Gnade Gottes zu bleiben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: Als die Synagogenversammlung beendet war
  rationale: Der Genitivus absolutus bezeichnet den vorausgehenden Umstand. συναγωγή meint hier dem Kontext nach die versammelte Gemeinde beziehungsweise ihre Zusammenkunft, nicht das Gebäude; „beendet“ gibt λυθείσης in natürlichem Deutsch wieder.
- source_word: ἠκολούθησαν
  choice: folgten
  rationale: Das Verb bezeichnet hier unmittelbar, dass die Menschen Paulus und Barnabas nach der Zusammenkunft nachgingen.
- source_word: πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: viele von den Juden und den gottesfürchtigen Proselyten
  rationale: „Viele von“ bildet den partitiven Genitiv ab. προσήλυτοι sind zum Judentum Übergetretene, während σεβόμενοι ihre religiöse Frömmigkeit oder Gottesverehrung kennzeichnet; „gottesfürchtig“ bewahrt beides, ohne sie mit bloßen Sympathisanten des Judentums gleichzusetzen.
- source_word: οἵτινες
  choice: Diese
  rationale: Das Relativpronomen bezieht sich auf Paulus und Barnabas. Ein neuer Satz mit „Diese“ vermeidet im Deutschen einen schwerfälligen Relativsatz und hält den Bezug eindeutig.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: redeten ihnen weiter zu
  rationale: Das Partizip bezeichnet begleitendes, an die Nachfolgenden gerichtetes Reden; die Vorsilbe προς- kann den Gedanken weiteren Zuredens tragen.
- source_word: ἔπειθον αὐτοὺς
  choice: ermahnten sie
  rationale: Der Imperfekt zeigt fortdauerndes Einwirken. Im Zusammenhang ist πείθω als eindringliches Zureden beziehungsweise Ermahnen zu verstehen, ohne einen bereits erzielten Überzeugungserfolg zu behaupten.
- source_word: προσμένειν τῇ χάριτι τοῦ θεοῦ
  choice: bei der Gnade Gottes zu bleiben
  rationale: προσμένω mit Dativ bedeutet, bei etwas zu bleiben oder darin fortzufahren. „Bei der Gnade Gottes bleiben“ ist verständlich und lässt offen, ob besonders Gottes gnädiges Handeln, sein Gnadenerweis oder das davon geprägte Leben im Blick steht.
theological_decisions:
- issue: Bedeutung von „Gnade Gottes“ in der apostolischen Ermahnung
  choice: bei der Gnade Gottes zu bleiben
  alternative: an der Botschaft von Gottes Gnade festzuhalten / in Gottes Gunst zu bleiben
  rationale: Die griechische Formulierung kann Gottes gnädiges Handeln und den dadurch bestimmten Lebensbereich umfassen. Die offene Wendung wird beibehalten, statt sie auf eine Lehrbotschaft oder einen bestimmten dogmatischen Begriff von Gunst einzuengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Proselyten“ wird als präziser historisch-religiöser Begriff beibehalten; der Zusatz „gottesfürchtig“ gibt σεβομένων wieder. Die Satzteilung sorgt für einen eindeutigen Bezug von οἵτινες auf Paulus und Barnabas.
