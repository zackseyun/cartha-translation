base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: de
  text: Und danach baten sie um einen König[a], und Gott gab ihnen Saul, den Sohn Kischs, einen Mann aus dem Stamm Benjamin, für vierzig Jahre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und von dort baten sie um einen König.“ Der einleitende Ausdruck kann in der geschichtlichen Abfolge als Übergangsangabe dienen.'
    reason: lexical_alternative
  - marker: b
    text: Die Angabe „für vierzig Jahre“ wirft für manche Leser im Vergleich mit den Angaben des Alten Testaments chronologische Fragen auf. Die Übersetzung gibt die Formulierung des Lukas unverändert wieder.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Und danach
  rationale: Das zusammengezogene καὶ ἐκεῖθεν leitet hier den nächsten Abschnitt der geschichtlichen Abfolge ein. Das natürliche deutsche „Und danach“ bewahrt den Übergangscharakter, ohne eine unpassende räumliche Bewegung zu erzwingen.
- source_word: ᾐτήσαντο
  choice: baten sie um
  rationale: Die mediale Form bezeichnet die Bitte des Volkes für sich selbst. „Baten … um“ ist natürlich und gibt den Vorgang wieder, ohne den Ton durch „forderten“ unnötig zu verschärfen.
- source_word: βασιλέα
  choice: einen König
  rationale: Der artikellose Akkusativ bezeichnet die gewünschte Art von Herrscher; der unbestimmte Artikel ist im Deutschen angemessen.
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Da gab ihnen Gott
  rationale: Die gewöhnliche Bedeutung von δίδωμι wird mit „gab“ bewahrt; „gewährte“ oder „setzte ein“ wären stärker deutend. „Da“ stellt den folgerichtigen Anschluss her.
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: Saul, den Sohn des Kisch
  rationale: Die Apposition wird in natürlichem Standarddeutsch mit bestimmtem Artikel wiedergegeben; die Namensform „Kisch“ entspricht der etablierten deutschen Bibeltradition.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: einen Mann aus dem Stamm Benjamin
  rationale: ἀνήρ bezeichnet hier einen einzelnen erwachsenen Mann; ἐκ drückt seine Herkunft aus dem Stamm Benjamin aus.
- source_word: ἔτη τεσσεράκοντα
  choice: für vierzig Jahre
  rationale: Der Akkusativ bezeichnet eine Zeitdauer. Die Formulierung lässt die Wendung am unmittelbar vorausgehenden Geben Sauls hängen, wie es der griechische Satz nahelegt.
theological_decisions:
- issue: Bezug der Zeitangabe ἔτη τεσσεράκοντα
  choice: „für vierzig Jahre“ wird auf Gottes Gabe Sauls als König bezogen.
  alternative: Die Zeitangabe könnte im Rahmen der Geschichtszusammenfassung lockerer verstanden werden; außerdem werden im Vergleich mit alttestamentlichen Angaben chronologische Fragen gesehen.
  rationale: Die griechische Wortfolge verbindet die Dauer am natürlichsten mit der unmittelbar vorausgehenden Aussage über Saul. Die Übersetzung bewahrt diese Formulierung und versucht nicht, mögliche chronologische Spannungen harmonisierend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die logische Verbindung des griechischen Satzes aufzulösen. Beide Fußnotenmarker stehen im Haupttext.
