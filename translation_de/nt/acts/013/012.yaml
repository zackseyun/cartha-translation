id: ACT.13.12
reference: Acts 13:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: de
  text: Als der Prokonsul nun sah, was geschehen war, glaubte er[a], voller Staunen über die Lehre des Herrn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „glaubte er“; ein Gegenstand des Glaubens wird im griechischen Text nicht ausdrücklich genannt.'
    reason: theologische_und_syntaktische_offenheit
  - marker: b
    text: 'Oder: „die Lehre vom Herrn“ beziehungsweise „die vom Herrn stammende Lehre“. Der griechische Genitiv lässt mehrere Deutungen zu.'
    reason: alternative_lesart
lexical_decisions:
- source_word: τότε
  choice: nun
  rationale: Kennzeichnet den zeitlich-folgernden Fortgang der Erzählung; „nun“ fügt sich im Deutschen natürlich in den einleitenden Als-Satz ein.
- source_word: ἰδὼν
  choice: als … sah
  rationale: Das Aoristpartizip von ὁράω wird idiomatisch als temporaler Nebensatz wiedergegeben, ohne seinen zeitlichen Zusammenhang mit dem Hauptverb aufzulösen.
- source_word: ὁ ἀνθύπατος
  choice: der Prokonsul
  rationale: Bewahrt die genaue römische Amtsbezeichnung statt des allgemeineren „Statthalter“.
- source_word: τὸ γεγονός
  choice: was geschehen war
  rationale: Das substantivierte Perfektpartizip bezeichnet das bereits eingetretene und nun sichtbare Geschehen.
- source_word: ἐπίστευσεν
  choice: glaubte er
  rationale: Gibt πιστεύω ohne ergänztes Objekt knapp wieder und vermeidet es, ein im griechischen Text nicht ausdrücklich genanntes Glaubensobjekt einzufügen.
- source_word: ἐκπλησσόμενος
  choice: voller Staunen
  rationale: Gibt den begleitenden Zustand des Subjekts natürlich wieder und bewahrt die starke Reaktion des Erstaunens.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: über die Lehre
  rationale: Bezeichnet den Anlass beziehungsweise Gegenstand des Staunens; „über“ ist in dieser Verbindung idiomatisches Deutsch.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Die Genitivkonstruktion bleibt erhalten und lässt offen, ob die Lehre vom Herrn stammt, ihm zugehört oder ihn zum Inhalt hat.
theological_decisions:
- issue: πιστεύω ohne ausdrücklich genanntes Objekt
  choice: „glaubte er“ ohne Ergänzung
  alternative: „kam er zum Glauben“ oder „glaubte er an den Herrn“
  rationale: Der Zusammenhang legt christlichen Glauben nahe, doch der Ausgangstext nennt kein Objekt. Die knappe Wiedergabe wahrt diese Offenheit.
- issue: Bedeutung des Genitivs in „τῇ διδαχῇ τοῦ κυρίου“
  choice: „die Lehre des Herrn“
  alternative: „die Lehre vom Herrn“ oder „die vom Herrn stammende Lehre“
  rationale: Der griechische Genitiv kann unter anderem Herkunft, Zugehörigkeit oder Inhalt bezeichnen. Die deutsche Genitivform bewahrt diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der genaue historische Amtstitel wird beibehalten; unnötige kirchliche Fachsprache wird vermieden.
