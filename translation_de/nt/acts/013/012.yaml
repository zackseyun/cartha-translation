  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Satzes zuverlässig wieder: τότε wird mit „nun“ anschlussfähig wiedergegeben, ἰδών idiomatisch durch den Als-Satz, ἀνθύπατος präzise als „Prokonsul“, und τὸ γεγονός als bereits geschehenes Ereignis. „glaubte er“ bewahrt zutreffend das im Griechischen nicht ausgedrückte Objekt von ἐπίστευσεν. „voller Staunen über“ gibt ἐκπλησσόμενος ἐπὶ angemessen als begleitende Reaktion wieder.'
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und besitzt einen passenden erzählenden Registerton. Die Stellung von „nun“ im einleitenden Als-Satz ist zwar leicht gehoben, aber natürlich und klar.
  terminology: „Prokonsul“ wahrt die historische Amtsbezeichnung. „Lehre des Herrn“ entspricht dem griechischen Genitiv, ohne dessen mögliche Nuancen auf eine Herkunfts- oder Inhaltsdeutung festzulegen. „Herr“ ist als Wiedergabe von κύριος konsistent.
