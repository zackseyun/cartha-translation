id: ACT.13.11
reference: Acts 13:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: de
  text: 'Und nun, sieh: Die Hand des Herrn ist über dir. Du wirst blind sein und die Sonne eine Zeit lang[a] nicht sehen. Sofort fielen Nebel und Finsternis auf ihn, und er ging umher und suchte nach Menschen, die ihn an der Hand führten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: bis zu einer Zeit; gemeint ist eine begrenzte, nicht näher bestimmte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt den auffordernden, Aufmerksamkeit weckenden Charakter in einer natürlichen und dennoch würdigen modernen Form.
- source_word: χεὶρ κυρίου
  choice: die Hand des Herrn
  rationale: Das biblische Bild bleibt erhalten; im Zusammenhang bezeichnet es das wirksame Eingreifen des Herrn im Gericht, ohne dies bereits in den Haupttext hineinzudeuten.
- source_word: ἔσῃ τυφλὸς
  choice: du wirst blind sein
  rationale: Gibt die Futurverbindung mit prädikativem Adjektiv direkt wieder und lässt offen, dass der Zustand nun eintritt.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: die Sonne … nicht sehen
  rationale: Bewahrt den konkreten Bezug auf die Sonne, statt verallgemeinernd von Tageslicht zu sprechen.
- source_word: ἄχρι καιροῦ
  choice: eine Zeit lang
  rationale: Drückt idiomatisch eine begrenzte, aber nicht näher bestimmte Dauer aus.
- source_word: παραχρῆμα
  choice: sofort
  rationale: Gibt das unmittelbare Eintreten des angekündigten Geschehens knapp und natürlich wieder.
- source_word: ἀχλὺς καὶ σκότος
  choice: Nebel und Finsternis
  rationale: Erhält sowohl das Bild einer die Sicht trübenden Erscheinung als auch die stärkere Dunkelheit.
- source_word: περιάγων
  choice: er ging umher
  rationale: Bleibt nahe an der Bewegungsbedeutung des Partizips und vermeidet, das kontextuell naheliegende Tasten ausdrücklich in den Text einzutragen.
- source_word: ἐζήτει χειραγωγούς
  choice: suchte Menschen, die ihn an der Hand führten
  rationale: Gibt die konkrete Bedeutung von χειραγωγός verständlich wieder; gesucht werden Personen, die einen anderen an der Hand leiten.
theological_decisions:
- issue: Bedeutung der „Hand des Herrn“
  choice: Das Bild wird wörtlich als „die Hand des Herrn“ bewahrt.
  alternative: „Das Gericht des Herrn trifft dich“ oder „Der Herr schlägt dich“
  rationale: Der Kontext macht ein göttliches Gericht deutlich, doch die Übersetzung soll das biblische Bild erhalten und seine Bedeutung nicht durch eine engere Paraphrase ersetzen.
- issue: Kraft der Präposition ἐπί in χεὶρ κυρίου ἐπὶ σέ
  choice: „gegen dich“
  alternative: „auf dir“ oder „über dir“
  rationale: Im gerichtlichen Kontext gibt „gegen dich“ die feindlich-gerichtete Wirkung idiomatisch wieder, ohne das Bild der Hand aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Ton. „Sieh“ ist gegenwärtiger als „siehe“, behält aber den deiktischen Nachdruck. Die Satzfolge wurde im Deutschen leicht gegliedert, ohne den Inhalt oder die Abfolge zu verändern.
