id: ACT.20.27
reference: Acts 20:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: de
  text: Denn ich habe mich nicht gescheut, euch den ganzen Ratschluss Gottes[a] zu verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den ganzen Plan Gottes; auch: den ganzen Willen Gottes oder Gottes ganze Absicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und wird im Deutschen natürlich mit »Denn« wiedergegeben.
- source_word: ὑπεστειλάμην
  choice: habe mich nicht davor gescheut
  rationale: Die mediale Form bezeichnet hier ein Zurückweichen oder Sich-Zurückhalten. »Sich nicht scheuen« bewahrt diesen Gedanken in natürlichem Deutsch und entspricht dem ähnlichen Ausdruck in Apostelgeschichte 20,20.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: zu verkünden
  rationale: Der artikulierte Infinitiv mit μή ergänzt das Verb und bezeichnet, wovor Paulus nicht zurückwich. ἀναγγέλλω kann »berichten«, »bekannt machen« oder »verkünden« bedeuten; »verkünden« passt zum feierlichen Lehrkontext.
- source_word: πᾶσαν
  choice: den ganzen
  rationale: Beim singularischen βουλή hebt πᾶσαν die Vollständigkeit dessen hervor, was Paulus verkündet hat.
- source_word: βουλὴν
  choice: Ratschluss
  rationale: βουλή kann Rat, Absicht, Plan oder Willensbeschluss bezeichnen. »Ratschluss« hält diese Bedeutungsbreite im theologischen Zusammenhang eher offen als die engeren Alternativen »Plan« oder »Wille«.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv bezeichnet den Ratschluss als von Gott ausgehend beziehungsweise Gott zugehörig.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Adressaten der Verkündigung, hier die Ältesten aus Ephesus.
theological_decisions:
- issue: Bedeutung von βουλὴ τοῦ θεοῦ
  choice: der ganze Ratschluss Gottes
  alternative: der ganze Plan Gottes; der ganze Wille Gottes; Gottes ganze Absicht
  rationale: Die Wendung kann Gottes Beschluss, Heilsabsicht, Plan oder Willen hervorheben. »Ratschluss« bewahrt diese theologische Spannung, ohne den griechischen Ausdruck auf eine einzelne konfessionelle Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ratschluss« ist etwas gehoben, im biblisch-theologischen Zusammenhang jedoch verständlich und geeignet, die Bedeutungsbreite von βουλή zu erhalten.
