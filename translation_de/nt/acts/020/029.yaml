  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: de
  text: Ich weiß, dass nach meinem Weggang[a] gefährliche Wölfe[b] in eure Mitte eindringen werden, die die Herde nicht verschonen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach meiner Ankunft/meinem Kommen«; im Zusammenhang ist der Weggang des Paulus gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »grausame Wölfe«. Das griechische Adjektiv kann hier harte, bedrückende oder gewaltsame Gefährlichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Ich weiß
  rationale: Gibt die sichere Kenntnis des Paulus direkt und natürlich wieder, ohne sie zu einer bloßen Vermutung abzuschwächen.
- source_word: εἰσελεύσονται … εἰς ὑμᾶς
  choice: werden … bei euch eindringen
  rationale: Bewahrt die Bewegung hinein in die Gemeinschaft und bringt zugleich den bedrohlichen Charakter des Eindringens idiomatisch zum Ausdruck.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: nach meinem Weggang
  rationale: Obwohl ἄφιξις gewöhnlich Ankunft oder Kommen bezeichnet, verlangt der Zusammenhang hier den Gedanken an die Zeit nach dem Fortgehen des Paulus. Eine Fußnote bewahrt die ungewöhnliche wörtliche Form.
- source_word: λύκοι βαρεῖς
  choice: wilde Wölfe
  rationale: Behält das eindringliche Bild der Wölfe bei. βαρεῖς bezeichnet hier nicht körperliche Schwere, sondern gefährliche, harte oder gewaltsame Strenge; „wilde“ ist dafür im modernen Deutsch klar und natürlich.
- source_word: μὴ φειδόμενοι τοῦ ποιμνίου
  choice: die Herde nicht verschonen
  rationale: Gibt das Partizip als beschreibenden Relativsatz wieder und bewahrt die pastorale Metapher sowie die Rücksichtslosigkeit der Bedrohung.
theological_decisions:
- issue: Identität der Wölfe
  choice: Die Metapher „Wölfe“ bleibt im Haupttext unaufgelöst.
  alternative: falsche Lehrer; Verfolger; zerstörerische Männer
  rationale: Der Vers selbst bestimmt nicht ausdrücklich, auf welche Personengruppe das Bild zielt. Die offene Bildsprache bewahrt die rhetorische Kraft und vermeidet eine theologische Verengung.
- issue: Bedeutung von ἄφιξις im Zusammenhang
  choice: Wiedergabe als „Weggang“ mit Fußnote zur wörtlichen Bedeutung
  alternative: Ankunft; Kommen
  rationale: Der unmittelbare Zusammenhang spricht von der Gefahr, die nach der Abwesenheit des Paulus eintreten wird. Die kontextuelle Wiedergabe macht den Sinn verständlich, während die Fußnote die auffällige lexikalische Spannung offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig und gut verständlich; die Hirtenmetaphorik und die im Griechischen vorhandene Spannung bei ἄφιξις bleiben erhalten.
