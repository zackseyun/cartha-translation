  terminology: „Unschuldig am Blut“ bewahrt das Blut-/Blutschuld-Bild, ohne es zu einer bloßen Paraphrase von Verantwortung aufzulösen. Die Hesekiel-Anspielung bleibt vorsichtig als Wahrscheinlichkeit formuliert.
