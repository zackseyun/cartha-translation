- from: 'Darum bezeuge ich euch am heutigen Tag: Ich bin rein vom Blut aller Menschen.[a][b]'
  to: 'Darum bezeuge ich euch heute: Ich bin unschuldig am Blut aller Menschen.[a][b]'
  rationale: Die Revision ersetzt die im Deutschen weniger idiomatische Formulierung „rein vom Blut“ durch „unschuldig am Blut“. Dadurch wird die schuldrechtliche Kraft der griechischen Wendung klar und natürlich wiedergegeben, ohne das Blutbild oder die im Kontext anklingende Wächtermetaphorik auszudeuten. Die wörtlichere Alternative wird in Fußnote a bewahrt. Außerdem wird „am heutigen Tag“ zu dem modernen, quellentreuen „heute“ gestrafft.
