  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: de
  text: 'Darum bezeuge ich euch heute: Ich bin unschuldig am Blut aller Menschen.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich bin rein vom Blut aller Menschen.“ Die griechische Wendung meint, dass Paulus hinsichtlich anderer frei von Schuld oder Verantwortung ist.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung erinnert wahrscheinlich an das Bild vom Wächter bei Hesekiel, der Blutschuld auf sich lädt, wenn er nicht warnt (siehe Hesekiel 3,18–19; 33,6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: Darum
  rationale: Kennzeichnet im Zusammenhang die Folgerung aus Paulus’ zuvor beschriebener treuer Verkündigung; zugleich ist es natürliches, gehobenes Deutsch.
- source_word: μαρτύρομαι
  choice: bezeuge ich
  rationale: Gibt den feierlichen und persönlichen Zeugnischarakter des medialen Verbs wieder, ohne einen engeren gerichtlichen Rahmen vorauszusetzen.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: am heutigen Tag
  rationale: Bewahrt den feierlichen, semitisch geprägten Ausdruck deutlicher als das schlichtere „heute“.
- source_word: καθαρός εἰμι ἀπὸ τοῦ αἵματος
  choice: Ich bin rein vom Blut
  rationale: Folgt dem griechischen Bild und bewahrt den biblischen Anklang an Blutschuld; die Fußnote erklärt den gemeinten Sinn der Schuld- und Verantwortungsfreiheit.
- source_word: πάντων
  choice: aller Menschen
  rationale: Das substantivierte Maskulinum Plural bezeichnet im Kontext Personen. „Aller Menschen“ ist im Deutschen klarer als das isolierte „aller“, ohne den Kreis weiter einzugrenzen.
theological_decisions:
- issue: Bedeutung von „rein vom Blut aller Menschen“
  choice: Die bildhafte Aussage von Freiheit von Schuld beziehungsweise Verantwortung bleibt im Haupttext erhalten.
  alternative: „Ich bin nicht schuldig am Tod irgendeines Menschen“ oder „Ich trage für keinen von euch Schuld“
  rationale: Der Ausdruck greift wahrscheinlich die Wächtertexte in Hesekiel auf und bezieht sich im Kontext darauf, dass Paulus seine Pflicht zur Warnung und Verkündigung erfüllt hat. Eine ausdeutende Paraphrase würde das Bild verengen und seine theologische Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst feierlicher Satzprägung. Der Doppelpunkt gliedert die Zeugnisformel natürlich. Das konkrete Blutbild des Ausgangstextes bleibt erhalten und wird nicht im Haupttext paraphrasiert.
