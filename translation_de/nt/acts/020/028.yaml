  terminology: „Herde“/„hütet“ ist kohärent; „Aufseher“ vermeidet die anachronistische Festlegung auf ein späteres Amtsverständnis von „Bischof“. „Gemeinde“ ist für ἐκκλησία in diesem Kontext angemessen. Die Fußnote behandelt sowohl die Textvariante „des Herrn“ als auch die Auslegungsoptionen zu τοῦ ἰδίου ausgewogen.
