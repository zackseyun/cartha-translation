id: ACT.20.28
reference: Acts 20:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: de
  text: Gebt auf euch selbst und auf die ganze Herde acht, in der euch der Heilige Geist als Aufseher eingesetzt hat, damit ihr die Gemeinde Gottes[a] hütet, die er sich durch das Blut seines Eigenen[b] erworben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „Gemeinde des Herrn“ statt „Gemeinde Gottes“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „die er sich durch das Blut seines eigenen Sohnes erworben hat“; traditionell auch: „die er sich durch sein eigenes Blut erworben hat“. Wörtlich steht im Griechischen „durch das Blut seines Eigenen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: Gebt … acht
  rationale: Der Präsensimperativ fordert zu anhaltender Wachsamkeit auf. Die deutsche Wendung ist natürlich und schließt durch „auf euch selbst“ die reflexive Ausrichtung ausdrücklich ein.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: auf die ganze Herde
  rationale: „Herde“ bewahrt das pastorale Bild; „die ganze“ gibt παντί im Deutschen idiomatisch wieder.
- source_word: ἐν ᾧ
  choice: in der
  rationale: 'Die Formulierung folgt dem räumlich-gemeinschaftlichen Bild: Die Aufseher sind innerhalb der Herde eingesetzt, nicht über ihr stehend beschrieben.'
- source_word: ἔθετο
  choice: eingesetzt hat
  rationale: τίθημι bezeichnet hier die Zuweisung einer Aufgabe oder Stellung; „eingesetzt“ ist klar und vermeidet eine unnötig institutionelle Zuspitzung.
- source_word: ἐπισκόπους
  choice: als Aufseher
  rationale: „Aufseher“ gibt die leitende und beaufsichtigende Funktion wieder, ohne die spätere Amtsbezeichnung „Bischöfe“ in den Text einzutragen.
- source_word: ποιμαίνειν
  choice: damit ihr … hütet
  rationale: „Hüten“ erhält das mit „Herde“ verbundene Hirtenbild. Der Zwecksatz gibt den finalen Infinitiv im natürlichen Deutschen wieder.
- source_word: ἐκκλησίαν
  choice: Gemeinde
  rationale: Hier bezeichnet ἐκκλησία die versammelte Gemeinschaft der Glaubenden. „Gemeinde“ ist im modernen deutschen Bibelstil verständlich und weniger gebäudebezogen als „Kirche“.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Die Übersetzung folgt dem SBLGNT-Haupttext θεοῦ. Die bedeutende Variante κυρίου wird in einer Fußnote genannt.
- source_word: περιεποιήσατο
  choice: sich … erworben hat
  rationale: Die mediale Form trägt den Sinn des Erwerbens für sich selbst. „Erworben“ bewahrt diesen Sinn, ohne das Bild ausdrücklich auf einen Kaufvorgang zu verengen.
- source_word: διὰ τοῦ αἵματος
  choice: durch das Blut
  rationale: διά mit Genitiv bezeichnet hier das Mittel; „durch“ wahrt zugleich die sühne- und opfertheologische Aussage.
- source_word: τοῦ ἰδίου
  choice: seines Eigenen
  rationale: Das substantivierte Adjektiv wird bewusst ohne Ergänzung wiedergegeben. „Seines Eigenen“ ist im Deutschen markiert, aber verständlich und bewahrt die Frage, ob „Sohn“ zu ergänzen ist oder die Wendung als „sein eigenes Blut“ verstanden werden soll.
theological_decisions:
- issue: Bezug und Bedeutung von τοῦ αἵματος τοῦ ἰδίου
  choice: „durch das Blut seines Eigenen“ im Haupttext
  alternative: „durch das Blut seines eigenen Sohnes“ oder traditionell „durch sein eigenes Blut“
  rationale: Der griechische Wortlaut nennt nach ἰδίου kein Substantiv. Die Hauptfassung bewahrt diese christologisch gewichtige Knappheit, statt „Sohn“ stillschweigend zu ergänzen oder die Wörter syntaktisch zu „sein eigenes Blut“ umzustellen. Die natürlichen deutschen Deutungen werden in der Fußnote offengelegt.
- issue: Textvariante θεοῦ / κυρίου
  choice: „Gemeinde Gottes“
  alternative: „Gemeinde des Herrn“
  rationale: Der vorgelegte SBLGNT-Text liest θεοῦ; die gut bezeugte Variante wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hirtenmetaphorik wird durch „Herde“ und „hüten“ zusammenhängend erhalten. „Aufseher“ übersetzt die Funktion, ohne spätere kirchliche Amtsstrukturen vorauszusetzen. Die ungewöhnliche Formulierung „seines Eigenen“ ist absichtlich markiert, um die echte syntaktische und christologische Spannung des griechischen Textes nicht im Haupttext aufzulösen.
