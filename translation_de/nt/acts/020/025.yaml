id: ACT.20.25
reference: Acts 20:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: de
  text: 'Und nun, seht: Ich weiß, dass ihr alle, unter denen ich umhergezogen bin und das Reich verkündet habe, mein Angesicht nicht wiedersehen werdet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: seht
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter des griechischen Ausdrucks in einer natürlichen, würdevollen deutschen Form.
- source_word: τὸ πρόσωπόν μου
  choice: mein Angesicht
  rationale: Gibt die konkrete und zugleich feierliche Wendung wörtlich wieder; gemeint ist, Paulus persönlich wiederzusehen.
- source_word: διῆλθον
  choice: umhergezogen bin
  rationale: Drückt die Bewegung des Paulus durch die betreffenden Orte beziehungsweise unter den Menschen angemessen aus.
- source_word: κηρύσσων
  choice: verkündet habe
  rationale: Gibt die öffentliche Bekanntmachung wieder, ohne unnötig konfessionelle Färbung.
- source_word: τὴν βασιλείαν
  choice: das Reich
  rationale: Bewahrt die knappe Form des SBLGNT, das hier keinen ausdrücklichen Zusatz wie „Gottes“ enthält.
theological_decisions:
- issue: Bezug von „das Reich“
  choice: Den Ausdruck ohne Ergänzung wiedergeben
  alternative: „das Reich Gottes“
  rationale: Der vorliegende griechische Text liest lediglich τὴν βασιλείαν. Der aus dem Kontext erschließbare Bezug wird nicht in den Haupttext eingefügt.
- issue: Reichweite von ὑμεῖς πάντες
  choice: „ihr alle“
  alternative: „keiner von euch“
  rationale: 'Die positive Satzstruktur des Griechischen wird erhalten: Alle Angesprochenen werden Paulus nicht wiedersehen. Inhaltlich entspricht dies „keiner von euch“, ohne die grammatische Perspektive umzubauen.'
translation_notes:
  register: Modernes Standarddeutsch mit feierlichem Abschiedston. „Seht“ erhält den Diskursmarker ἰδοὺ; „Angesicht“ trägt der würdevollen, persönlichen Aussage Rechnung. Die Satzstellung wurde für gute Verständlichkeit behutsam geglättet.
