review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den Aufbau und die zentralen Begriffe insgesamt gut. »wenn man so arbeitet« gibt κοπιῶντας jedoch zu allgemein wieder; das Verb bezeichnet hier angestrengtes Arbeiten bzw. Mühen. »an die Worte ... denken« ist schwächer und weniger präzise als μνημονεύειν, das ausdrücklich Erinnern meint.
  naturalness: Der Satz ist gut verständlich und idiomatisch. »sich so abmüht« und »sich an die Worte ... erinnert« sind ebenso natürlich und genauer. Die knappe, im Deutschen vertraute Schlussformulierung ist trotz ihres gehobenen Tons als Jesuswort angemessen.
  terminology: »den Schwachen« wahrt die offene Reichweite von τῶν ἀσθενούντων. »beistehen« ist eine passende Wiedergabe von ἀντιλαμβάνεσθαι; die Fußnote nennt zu Recht die mögliche Nuance nachhaltiger Unterstützung. »Herr Jesus« und die Betonung »Er selbst« sind zutreffend.
  issues:
  - severity: medium
    issue: κοπιῶντας ist mit »wenn man so arbeitet« abgeschwächt.
    rationale: Das Partizip κοπιῶντας trägt den Aspekt mühevollen, angestrengten Arbeitens. »sich so abmüht« bewahrt diese Nuance, ohne eine bestimmte Art von Arbeit zu ergänzen.
  - severity: low
    issue: μνημονεύειν ist mit »an ... denken« nicht ganz präzise wiedergegeben.
    rationale: Das Verb bedeutet erinnern bzw. im Gedächtnis behalten. »sich an die Worte ... erinnern« bildet dies im modernen Deutsch klarer ab.
