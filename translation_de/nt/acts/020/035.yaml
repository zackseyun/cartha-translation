  to: 'In allem habe ich euch gezeigt, dass man, indem man sich so abmüht, den Schwachen beistehen[a] und sich an die Worte des Herrn Jesus erinnern muss. Er selbst hat gesagt: »Geben ist seliger als Nehmen.«'
