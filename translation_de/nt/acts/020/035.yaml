id: ACT.20.35
reference: Acts 20:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: de
  text: 'In allem habe ich euch gezeigt, dass man, indem man sich so abmüht, den Schwachen beistehen[a] und sich an die Worte des Herrn Jesus erinnern muss. Er selbst hat gesagt: »Geben ist seliger als Nehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Schwachen unterstützen«. Das griechische Verb kann eine anhaltende Unterstützung bezeichnen, nicht nur eine einmalige Hilfe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: In allem
  rationale: 'Adverbial zu ὑπέδειξα verstanden: Paulus verweist umfassend auf sein Beispiel.'
- source_word: ὑπέδειξα
  choice: habe ich euch gezeigt
  rationale: Gibt das Zeigen und Vorleben knapp und natürlich wieder, ohne den Aspekt des Beispiels unnötig auszuschreiben.
- source_word: οὕτως κοπιῶντας
  choice: wenn man so arbeitet
  rationale: Bewahrt den Rückbezug auf Paulus’ Arbeitsweise und vermittelt die anstrengende Tätigkeit in natürlichem Deutsch.
- source_word: δεῖ
  choice: muss
  rationale: Drückt die im Griechischen bezeichnete Notwendigkeit beziehungsweise Verpflichtung klar aus.
- source_word: ἀντιλαμβάνεσθαι
  choice: beistehen
  rationale: Bezeichnet tätige Hilfe und kann auch fortdauernde Unterstützung einschließen.
- source_word: τῶν ἀσθενούντων
  choice: den Schwachen
  rationale: Lässt offen, ob körperlich, wirtschaftlich, sozial oder geistlich Schwache gemeint sind.
- source_word: μνημονεύειν τε
  choice: und an ... denken
  rationale: Gibt die koordinierte Aufforderung idiomatisch wieder; gemeint ist, Jesu Worte im Gedächtnis zu behalten.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: die Worte des Herrn Jesus
  rationale: Direkte und würdige Wiedergabe der erinnerten Äußerung Jesu.
- source_word: αὐτὸς εἶπεν
  choice: Er selbst hat gesagt
  rationale: Erhält die ausdrückliche Betonung von αὐτός.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Geben ist seliger als Nehmen
  rationale: Prägnante, im Deutschen vertraute Formulierung, die den Vergleich und μακάριον angemessen bewahrt.
theological_decisions:
- issue: Bedeutungsumfang von »den Schwachen«
  choice: Breit als »den Schwachen« wiedergegeben
  alternative: den Armen; den Kranken; den im Glauben Schwachen
  rationale: ἀσθενούντων ist semantisch weit. Der Zusammenhang von Arbeit, Hilfe und Geben deutet auf unterstützungsbedürftige Menschen, legt aber keine einzelne Art der Schwäche eindeutig fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die sprichwortartige Schlussaussage wird bewusst knapp gehalten; »seliger« bewahrt den religiös-ethischen Gehalt von μακάριον.
