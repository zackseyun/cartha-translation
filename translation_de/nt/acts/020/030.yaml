source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: de
  text: Und aus eurer eigenen Mitte werden Männer hervortreten, die Verdreh­tes reden, um die Jünger hinter sich herzuziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: aus eurer eigenen Mitte
  rationale: Die Formulierung bewahrt die emphatische Aussage, dass die Gefahr aus der Gemeinschaft selbst kommen wird, und klingt zugleich natürlich im modernen Deutschen.
- source_word: ἀναστήσονται
  choice: werden aufstehen
  rationale: Das Futur wird beibehalten; „aufstehen“ kann hier idiomatisch das Hervortreten solcher Männer bezeichnen, ohne den Sinn unnötig einzuengen.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἀνήρ ist ausdrücklich maskulin und wird daher nicht zu „Menschen“ oder „Personen“ neutralisiert.
- source_word: λαλοῦντες διεστραμμένα
  choice: die verdrehte Dinge sagen
  rationale: Die substantivisch gebrauchte neutrale Pluralform bezeichnet Aussagen, die vom Geraden oder Wahren abgebogen beziehungsweise entstellt sind. „Verdrehte Dinge“ ist anschaulich, weit genug und im heutigen Deutsch verständlich.
- source_word: τοῦ ἀποσπᾶν
  choice: um ... herzuziehen
  rationale: Der artikulierte Infinitiv bezeichnet den Zweck. „Herziehen“ bewahrt das Bild eines Wegziehens aus einer bisherigen Bindung und verbindet sich natürlich mit „hinter sich“.
- source_word: τοὺς μαθητὰς
  choice: die Jünger
  rationale: „Jünger“ ist in der Apostelgeschichte die etablierte Bezeichnung für die Nachfolger Jesu.
- source_word: ὀπίσω ἑαυτῶν
  choice: hinter sich
  rationale: Die Wendung bezeichnet hier Nachfolge beziehungsweise persönliche Gefolgschaft. „Hinter sich herziehen“ gibt dieses Bild im Deutschen idiomatisch wieder.
theological_decisions:
- issue: Art der Aussagen der falschen Lehrer
  choice: verdrehte Dinge
  alternative: verkehrte Dinge; entstellte Dinge
  rationale: Der griechische Ausdruck warnt allgemein vor einer Verfälschung, ohne eine bestimmte Irrlehre oder ausschließlich moralische Verkehrtheit festzulegen.
- issue: Geschlechtsbezogene Wiedergabe von ἄνδρες
  choice: Männer
  alternative: Menschen; Personen
  rationale: Die spezifisch maskuline Bezeichnung des griechischen Textes bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Verbindung „hinter sich herziehen“ ist natürlich und bewahrt sowohl den Gedanken der Trennung als auch den einer auf die Männer selbst ausgerichteten Gefolgschaft.
