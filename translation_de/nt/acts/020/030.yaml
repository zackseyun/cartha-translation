- from: Und aus eurer eigenen Mitte werden Männer aufstehen, die verdrehte Dinge sagen, um die Jünger hinter sich herzuziehen.
  to: Und aus eurer eigenen Mitte werden Männer hervortreten, die Verdreh­tes reden, um die Jünger hinter sich herzuziehen.
  rationale: Die Revision ersetzt allein die im modernen Deutschen weniger idiomatische Wendung „Männer aufstehen“ durch „Männer hervortreten“ und glättet „verdrehte Dinge sagen“ zu „Verdrehtes reden“. Bedeutung, Register, Geschlechterbezug und die offene inhaltliche Reichweite der verdrehten Aussagen bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:59:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt alle zentralen Elemente des griechischen Textes wieder: die betonte Herkunft aus der eigenen Gemeinschaft, das zukünftige Hervortreten von Männern, das Reden von Verdrehungen sowie den Zweck, die Jünger in die eigene Gefolgschaft zu ziehen. „Hinter sich herzuziehen“ bewahrt den Zug- und Trennungsgedanken von ἀποσπᾶν und die Ausrichtung auf die betreffenden Männer.'
  naturalness: „Männer werden aufstehen“ ist zwar verständlich, bezeichnet im heutigen Deutschen jedoch vorrangig ein körperliches Aufstehen und ist für das Auftreten künftiger Personen weniger idiomatisch. „Männer werden hervortreten“ trifft den Kontext klarer und bleibt bildlich zurückhaltend. „Verdrehtes reden“ ist modernes, natürliches Deutsch und gibt das substantivische neutrale Plural διεστραμμένα angemessen als Kategorie von Aussagen wieder.
  terminology: „Männer“ wahrt die maskuline Spezifizierung von ἄνδρες. „Jünger“ entspricht dem etablierten Sprachgebrauch der Apostelgeschichte. „Verdrehtes“ vermeidet es, die nicht näher bestimmte Abweichung auf eine bestimmte Irrlehre oder moralische Kategorie festzulegen.
  issues:
