  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: de
  text: Von Milet aus schickte er nach Ephesus[a] und ließ die Ältesten der Gemeinde zu sich rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische lässt offen, ob Paulus eine Nachricht oder Boten nach Ephesus schickte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: Von Milet aus
  rationale: ἀπό mit Genitiv bezeichnet den Ausgangsort. δέ ist hier ein schwaches Fortsetzungssignal und muss im natürlichen deutschen Erzählfluss nicht eigens wiedergegeben werden.
- source_word: πέμψας εἰς Ἔφεσον
  choice: schickte er eine Nachricht nach Ephesus
  rationale: Das Aoristpartizip bezeichnet die dem Hauptereignis vorausgehende bzw. damit verbundene Entsendung nach Ephesus. Da das griechische Objekt unausgesprochen bleibt, macht »eine Nachricht« den implizierten Kommunikationsvorgang verständlich, ohne bestimmte Boten festzulegen.
- source_word: μετεκαλέσατο
  choice: ließ … zu sich rufen
  rationale: Das Medium bezeichnet ein Herbeirufen im eigenen Interesse beziehungsweise zu sich. Die Wendung gibt sowohl den veranlassten Ruf als auch das Ziel bei Paulus natürlich wieder.
- source_word: τοὺς πρεσβυτέρους
  choice: die Ältesten
  rationale: Im Kontext von Apostelgeschichte bezeichnet πρεσβύτεροι anerkannte Leitungspersonen der christlichen Gemeinschaft, nicht lediglich ältere Männer.
- source_word: τῆς ἐκκλησίας
  choice: der Gemeinde
  rationale: ἐκκλησία bezeichnet hier die örtliche christliche Gemeinschaft. »Gemeinde« ist im modernen Deutschen natürlich und vermeidet die mögliche Vorstellung eines Kirchengebäudes oder einer späteren Konfessionsstruktur.
theological_decisions:
- issue: Bedeutung von πρεσβυτέρους im gemeindlichen Kontext
  choice: Leitungspersonen, bezeichnet als »Älteste«
  alternative: ältere Männer der Gemeinde; Presbyter als Fachbezeichnung
  rationale: Der Erzählzusammenhang und der Sprachgebrauch der Apostelgeschichte weisen auf anerkannte Gemeindeleiter. »Älteste« bewahrt die frühchristliche Bezeichnung, ohne eine spätere konfessionelle Amtsordnung vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge ist idiomatisch geglättet; »ließ … zu sich rufen« bewahrt den medialen Sinn von μετεκαλέσατο. Der Fußnotenmarker [a] steht im Haupttext.
