- from: Und nun vertraue ich euch Gott und dem Wort seiner Gnade an[a], das die Kraft hat, aufzubauen und das Erbe unter allen Geheiligten zu geben.
  to: Und nun vertraue ich euch Gott und dem Wort seiner Gnade an, das[a] die Kraft hat, euch aufzubauen und euch das Erbe zusammen mit allen Geheiligten zu geben.
  rationale: Die Korrektur repariert die fehlerhafte Fußnote, setzt ihren Anker an die tatsächlich mehrdeutige Konstruktion und formuliert die Teilhabe am Erbe im modernen Deutschen eindeutig. Die syntaktisch mögliche Bezugnahme des Partizips entweder auf das Wort der Gnade oder auf Gott bleibt ausdrücklich erhalten.
