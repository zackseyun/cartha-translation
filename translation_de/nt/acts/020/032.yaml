source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: de
  text: Und nun vertraue ich euch Gott und dem Wort seiner Gnade an, das[a] die Kraft hat, euch aufzubauen und euch das Erbe zusammen mit allen Geheiligten zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Die Wendung „das die Kraft hat“ bezieht sich auf Gott: „der die Kraft hat“; dann ist Gott vor allem als der Handelnde gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: vertraue ich … an
  rationale: Das mediale Verb bezeichnet hier, dass Paulus die Angesprochenen der Obhut Gottes übergibt. „Jemanden jemandem anvertrauen“ ist im modernen Deutschen natürlich und sachlich genau.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet nach παρατίθεμαι denjenigen, dem Paulus die Angesprochenen anvertraut.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: dem Wort seiner Gnade
  rationale: Die Wiedergabe bewahrt die Genitivfügung und das theologische Gewicht von λόγος; gemeint sein kann das wirksame verkündigte Wort beziehungsweise die Botschaft von Gottes Gnade.
- source_word: τῷ δυναμένῳ
  choice: das die Kraft hat
  rationale: Der Singular kann grammatisch auf das unmittelbar vorausgehende „Wort seiner Gnade“ bezogen werden, ohne die Wirksamkeit von Gott zu lösen. Die alternative Beziehung auf Gott wird in der Fußnote bewahrt.
- source_word: οἰκοδομῆσαι
  choice: aufzubauen
  rationale: Das Bauwort wird metaphorisch für die geistliche Förderung gebraucht. Der im Kontext naheliegende Gegenstand bleibt wie im Griechischen unausgesprochen.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: das Erbe … zu geben
  rationale: Die Formulierung gibt das direkte Objekt ausdrücklich wieder und lässt den Empfänger wie im Griechischen aus dem Zusammenhang hervorgehen.
- source_word: κληρονομίαν
  choice: das Erbe
  rationale: „Erbe“ ist die geläufige, prägnante Wiedergabe und bewahrt den biblisch-theologischen Nachklang eines von Gott gewährten Anteils.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: unter allen Geheiligten
  rationale: „Geheiligten“ bildet das passive Partizip ab; „unter“ gibt ἐν in seiner Bedeutung einer Zugehörigkeit beziehungsweise Gemeinschaft knapp wieder.
theological_decisions:
- issue: Bezugswort von τῷ δυναμένῳ („der/das die Kraft hat“)
  choice: 'Im Haupttext wird die Wendung auf „das Wort seiner Gnade“ bezogen: „das die Kraft hat“.'
  alternative: 'Die Wendung kann vor allem auf Gott bezogen werden: „der die Kraft hat“.'
  rationale: Beide Beziehungen sind syntaktisch möglich. Für „Wort“ spricht das unmittelbar vorausgehende Bezugswort und die im Neuen Testament bezeugte Wirksamkeit des Wortes; für „Gott“ spricht seine Rolle als persönlicher Geber des Erbes. Die Fußnote erhält diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der griechischen Satzstruktur, vermeidet jedoch unnatürliche Archaismen. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Fügung.
