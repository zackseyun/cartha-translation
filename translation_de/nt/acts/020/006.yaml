  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: de
  text: Wir aber stachen nach den Tagen des Festes der Ungesäuerten Brote von Philippi in See und kamen in fünf Tagen[a] zu ihnen nach Troas. Dort blieben wir sieben Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: innerhalb von fünf Tagen. Der griechische Ausdruck bezeichnet die Dauer der Reise bis zur Ankunft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: fuhren … ab
  rationale: Das Verb bezeichnet die Abfahrt mit einem Schiff. Im Zusammenhang macht „fuhren … ab“ die Schiffsreise natürlich deutlich, ohne ein im Deutschen schwerfälliges „segelten hinaus“ zu verwenden.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: nach den Tagen der ungesäuerten Brote
  rationale: Die Formulierung bewahrt die ausdrückliche Zeitangabe des Griechischen und die traditionelle, allgemein verständliche Bezeichnung der Festtage.
- source_word: ἀπὸ Φιλίππων
  choice: von Philippi
  rationale: „Von“ gibt ἀπό als Ausgangspunkt der Reise idiomatisch wieder; der Ortsname wird im Deutschen konventionell als „Philippi“ geschrieben.
- source_word: ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα
  choice: kamen … zu ihnen nach Troas
  rationale: Die Übersetzung wahrt sowohl die Bewegung zu den vorausgereisten Personen als auch das Reiseziel Troas und klingt im Deutschen natürlich.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: innerhalb von fünf Tagen
  rationale: ἄχρι mit der Zeitspanne bezeichnet hier die Dauer bis zur Ankunft. „Innerhalb von fünf Tagen“ gibt diesen Endpunkt wieder, ohne „nach fünf Tagen“ einzutragen.
- source_word: οὗ
  choice: Dort
  rationale: Das Relativadverb verweist auf Troas zurück. Ein neuer Satz mit „Dort“ ist im modernen Deutsch klar und flüssig.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: blieben wir sieben Tage
  rationale: διατρίβω bezeichnet in diesem Reisebericht den Aufenthalt an einem Ort; „blieben“ ist eine natürliche und genaue Wiedergabe.
theological_decisions: []
