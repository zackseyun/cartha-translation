  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: de
  text: 'Besonders schmerzte sie, was er gesagt hatte[a]: Sie würden sein Angesicht nicht mehr sehen[b]. Und sie begleiteten ihn zum Schiff[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „über das Wort, das er gesprochen hatte“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „sein Angesicht nicht mehr sehen“, eine persönliche Ausdrucksweise dafür, ihn nicht wiederzusehen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „geleiteten sie ihn zum Schiff“ beziehungsweise „brachten sie ihn zum Schiff“. Das Verb kann eine Begleitung zum Abschied, auch als Zeichen der Ehrerbietung, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: schmerzte sie
  rationale: Das Partizip bezeichnet starken inneren Schmerz oder Kummer. Die verbale Wendung klingt im modernen Deutsch natürlich und bewahrt die emotionale Intensität.
- source_word: μάλιστα
  choice: besonders
  rationale: Kennzeichnet den wichtigsten Grund ihres Schmerzes knapp und idiomatisch.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: was er gesagt hatte
  rationale: Gibt Ursache und Vorzeitigkeit natürlich wieder. Die wörtlichere Formulierung „über das Wort, das er gesprochen hatte“ wäre im Deutschen unnötig schwerfällig.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt den Inhalt des Gesagten im Deutschen klar und unmittelbar ein.
- source_word: οὐκέτι μέλλουσιν
  choice: würden … nicht mehr
  rationale: Der Konjunktiv II gibt die Zukunft aus der Perspektive der Vergangenheit idiomatisch wieder; „nicht mehr“ bewahrt οὐκέτι, ohne es zum stärkeren „nie wieder“ auszuweiten.
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: sein Angesicht … sehen
  rationale: Bewahrt die ausdrückliche, persönliche Bildsprache von πρόσωπον. „Angesicht“ ist würdevoll und verständlich, wenn auch gehobener als „Gesicht“.
- source_word: προέπεμπον
  choice: begleiteten sie ihn
  rationale: Das Imperfekt beschreibt die begleitende Abschiedshandlung. „Begleiteten“ ist natürlich und lässt den möglichen ehrenden Charakter offen.
- source_word: εἰς τὸ πλοῖον
  choice: zum Schiff
  rationale: „Zum Schiff“ entspricht dem Ziel der Begleitung und passt zum maritimen Zusammenhang.
