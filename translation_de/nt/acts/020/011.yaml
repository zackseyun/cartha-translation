  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: de
  text: Dann ging er wieder hinauf, brach das Brot[a] und aß[b]. Nachdem er noch lange bis zum Morgengrauen gesprochen hatte, brach er auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „brach Brot“. Die griechische Wendung kann sich auf eine gemeinsame Mahlzeit beziehen; manche verstehen sie hier als Hinweis auf das Herrenmahl.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: „kostete“. Im Zusammenhang kann das griechische Wort allgemein Nahrungsaufnahme bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: ging er wieder hinauf
  rationale: Das Partizip von ἀναβαίνω bezeichnet die Bewegung nach oben. Im Erzählzusammenhang war Paulus zuvor hinuntergegangen und kehrt nun in den oberen Raum zurück; „wieder“ macht diesen Zusammenhang natürlich verständlich, ohne „Treppe“ oder „Obergeschoss“ ausdrücklich in den Text einzutragen.
- source_word: κλάσας τὸν ἄρτον
  choice: brach das Brot
  rationale: Die konkrete Formulierung mit Artikel wird formal nah wiedergegeben. Sie lässt offen, ob eine gewöhnliche gemeinsame Mahlzeit, eine Mahlgemeinschaft mit eucharistischen Bezügen oder ausdrücklich das Herrenmahl gemeint ist.
- source_word: γευσάμενος
  choice: aß
  rationale: γεύομαι kann wörtlich „kosten“ bedeuten, bezeichnet im Zusammenhang einer Mahlzeit aber auch das Essen beziehungsweise die Nahrungsaufnahme. „aß“ ist hier natürlich und vermeidet den irreführenden Eindruck, Paulus habe nur einen kleinen Bissen probiert.
- source_word: ἐφ’ ἱκανόν
  choice: noch lange
  rationale: Die Wendung bezeichnet eine beträchtliche Zeitdauer. „noch lange“ verbindet die ausgedehnte Unterhaltung idiomatisch mit dem vorausgehenden nächtlichen Geschehen.
- source_word: ὁμιλήσας
  choice: sich mit ihnen unterhalten hatte
  rationale: ὁμιλέω bezeichnet hier ein längeres Reden oder Gespräch. Die reflexive deutsche Wendung bringt den gesprächsartigen Charakter natürlich zum Ausdruck; „mit ihnen“ ist aus dem erzählerischen Zusammenhang erschlossen.
- source_word: ἄχρι αὐγῆς
  choice: bis zum Morgengrauen
  rationale: αὐγή bezeichnet die Morgendämmerung beziehungsweise den Tagesanbruch. „Morgengrauen“ ist präzise, verständlich und stilistisch würdig.
- source_word: οὕτως ἐξῆλθεν
  choice: brach er auf
  rationale: ἐξέρχομαι bezeichnet hier das Fortgehen. „aufbrechen“ passt zum Abschluss des längeren Aufenthalts. Das rückverweisende οὕτως wird durch die abschließende Satzfolge idiomatisch vermittelt, statt schwerfällig mit „auf diese Weise“ wiedergegeben zu werden.
theological_decisions:
- issue: Ob κλάσας τὸν ἄρτον ausdrücklich das Herrenmahl bezeichnet
  choice: Neutral als „brach das Brot“ wiedergegeben
  alternative: Als ausdrückliche Feier des Herrenmahls oder ausschließlich als gewöhnliche Mahlzeit verstanden
  rationale: Die Wendung kann in der Apostelgeschichte eucharistische Anklänge haben, legt in diesem Vers allein aber keine eindeutige sakramentale Deutung fest. Die Übersetzung bewahrt daher die theologische Offenheit des griechischen Textes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Partizipialfolge des Griechischen wird in zwei natürliche deutsche Sätze gegliedert. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
