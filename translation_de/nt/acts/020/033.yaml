  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: de
  text: Ich habe von niemandem Silber, Gold oder Kleidung begehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe von niemandem Silber, Gold oder Kleidung gewünscht.“'
    reason: Lexikalische Alternative für ἐπεθύμησα; das Verb kann sowohl ethisch zugespitzt „begehren“ als auch allgemeiner „wünschen“ bedeuten.
lexical_decisions:
- source_word: ἀργυρίου
  choice: Silber
  rationale: Das Substantiv bezeichnet wörtlich Silber. Zusammen mit Gold und Kleidung nennt es konkrete wertvolle Besitztümer; daher wird die konkrete Bedeutung bewahrt.
- source_word: χρυσίου
  choice: Gold
  rationale: Direkte und natürliche Wiedergabe des mit Silber und Kleidung koordinierten Substantivs.
- source_word: ἱματισμοῦ
  choice: Kleidung
  rationale: Bezeichnet Kleidung beziehungsweise Gewänder. „Kleidung“ ist im modernen Standarddeutsch natürlich und angemessen würdevoll.
- source_word: οὐδενὸς
  choice: von irgendjemandem
  rationale: Der Genitiv bezeichnet hier die Person, der die genannten Dinge gehören. Nach der Verneinung gibt „von irgendjemandem“ die Bedeutung idiomatisch als „von niemandem“ wieder, ohne die Zuordnung nur an das letzte Listenglied zu binden.
- source_word: ἐπεθύμησα
  choice: begehrt
  rationale: ἐπιθυμέω kann allgemein „verlangen“ oder ethisch zugespitzt „begehren“ bedeuten. Im Kontext von Paulus’ Abgrenzung gegen Habgier trifft „begehrt“ die negative moralische Färbung, ohne den Sinn auszuweiten.
- source_word: ἢ ... ἢ ... ἢ
  choice: weder ... noch ... noch
  rationale: In Verbindung mit der Verneinung ist die deutsche Korrelationsform „weder … noch … noch“ idiomatisch und bewahrt die dreigliedrige Aufzählung.
theological_decisions:
- issue: Moralische Nuance von ἐπιθυμέω bei fremdem Besitz
  choice: „begehrt“ als ethisch gefärbte Wiedergabe
  alternative: „verlangt“ oder „gewünscht“ als neutralere Wiedergabe
  rationale: Der Zusammenhang ist Paulus’ Verteidigung seiner Lauterkeit und Freiheit von Habgier. „Begehrt“ gibt den wahrscheinlich negativen ethischen Sinn wieder; die Fußnote bewahrt zugleich die neutralere lexikalische Möglichkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die konkrete Reihe „Silber, Gold, Kleidung“ bleibt erhalten; „begehrt“ vermittelt die moralische Spannung des Zusammenhangs.
