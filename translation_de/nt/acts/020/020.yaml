source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: de
  text: wie ich nicht davor zurückgeschreckt bin, euch alles zu verkünden, was euch nützt, und euch öffentlich und von Haus zu Haus zu lehren,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ich nichts von dem zurückgehalten habe, was euch nützt, indem ich es euch verkündete und euch öffentlich und in den Häusern lehrte.“'
    reason: Gibt die alternative Bedeutung von ὑπεστειλάμην im Sinn von „zurückhalten/vorenthalten“ wieder und vermerkt die weniger distributive, ortsbezogene Auffassung von κατ’ οἴκους.
lexical_decisions:
- source_word: ὡς
  choice: wie
  rationale: Leitet im Zusammenhang den Inhalt von Paulus’ Rückblick ein und schließt natürlich an den vorangehenden Satz an.
- source_word: οὐδὲν ὑπεστειλάμην
  choice: ich nichts … zurückgehalten habe
  rationale: Das mediale ὑποστέλλω bezeichnet hier, dass Paulus sich nicht zurückhielt beziehungsweise nichts vorenthielt. Die deutsche Formulierung ist natürlich und lässt den Akzent auf dem Nichtvorenthalten nützlicher Lehre liegen.
- source_word: τῶν συμφερόντων
  choice: von dem, was euch nützt
  rationale: συμφέρω bezeichnet das Nützliche oder Förderliche. Die Formulierung wahrt den breiten Sinn, ohne ihn ausdrücklich auf geistlichen Nutzen einzuengen.
- source_word: τοῦ μὴ ἀναγγεῖλαι ὑμῖν
  choice: sondern es euch verkündet
  rationale: Der negierte artifizielle Infinitiv erläutert, worin Paulus sich nicht zurückhielt. Im Deutschen gibt die positive Fortführung mit „sondern“ die verschachtelte griechische Negation klar und idiomatisch wieder.
- source_word: ἀναγγεῖλαι
  choice: verkündet
  rationale: ἀναγγέλλω bedeutet bekannt machen, berichten oder verkünden. „Verkündet“ passt zum Dienstkontext, ohne den Ausdruck unnötig zu spezialisieren.
- source_word: διδάξαι
  choice: gelehrt
  rationale: Gibt διδάσκω direkt und verständlich wieder und bewahrt das Lehren als eine mit dem Verkünden koordinierte Tätigkeit.
- source_word: δημοσίᾳ
  choice: öffentlich
  rationale: Entspricht der adverbialen Bedeutung und bezeichnet den Dienst in öffentlichen Zusammenhängen.
- source_word: κατ’ οἴκους
  choice: in den Häusern
  rationale: κατά mit dem Akkusativ Plural kann distributiv verstanden werden. „In den Häusern“ ist im modernen Deutsch natürlich und bewahrt den Gegensatz zum öffentlichen Lehren, ohne zwingend eine fortlaufende Besuchsroute auszudrücken.
theological_decisions:
- issue: Bedeutung des Nützlichen
  choice: breit als „was euch nützt“ wiedergegeben
  alternative: ausdrücklich „was euch geistlich nützt“
  rationale: Der Dienstkontext legt geistlichen und pastoralen Nutzen nahe, doch der griechische Ausdruck selbst bleibt breiter. Die Übersetzung fügt deshalb keine ausdrückliche theologische Einschränkung hinzu.
- issue: Verhältnis von Verkündigen und Lehren
  choice: als zwei koordinierte Tätigkeiten unter Paulus’ Nichtzurückhalten wiedergegeben
  alternative: das Lehren dem Inhalt des Verkündigens unterordnen
  rationale: Die beiden Infinitive ἀναγγεῖλαι und διδάξαι stehen koordiniert; die Übersetzung erhält diese Struktur, ohne eine dogmatische Unterscheidung oder Gleichsetzung zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfügung ist gegenüber dem Griechischen behutsam entflochten; „sondern“ macht die Reichweite der Negation verständlich. „In den Häusern“ klingt natürlicher als „hausweise“, während die Fußnote die traditionelle distributive Alternative bewahrt.
