source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: de
  text: Ein junger Mann namens Eutychus saß in der Fensteröffnung. Während Paulus lange sprach, sank er in tiefen Schlaf. Vom Schlaf überwältigt, fiel er vom dritten Stockwerk hinunter, und man hob ihn tot auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „man nahm ihn tot auf“. Das griechische Verb kann „aufheben“ oder „aufnehmen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: Ein junger Mann … saß
  rationale: Die präsentische Partizipialkonstruktion beschreibt die fortdauernde Sitzhaltung. Das indefinite τις muss im Deutschen nicht eigens mit „ein gewisser“ wiedergegeben werden; „ein junger Mann“ ist natürlich und bewahrt die Unbestimmtheit.
- source_word: ὀνόματι Εὔτυχος
  choice: namens Eutychus
  rationale: Idiomatísche deutsche Wiedergabe des Dativs ὀνόματι mit dem Eigennamen.
- source_word: ἐπὶ τῆς θυρίδος
  choice: in der Fensteröffnung
  rationale: θυρίς bezeichnet hier die Fensteröffnung. Die Formulierung verdeutlicht seine gefährliche Position, ohne einen im Griechischen nicht ausdrücklich genannten Fenstersims einzuführen.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: sank er in tiefen Schlaf
  rationale: καταφέρομαι beschreibt ein fortschreitendes Niedersinken beziehungsweise Überwältigtwerden; die deutsche Wendung bildet den Vorgang anschaulich und natürlich ab.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: Während Paulus lange sprach
  rationale: Der Genitivus absolutus bezeichnet den begleitenden Umstand. διαλέγομαι meint hier ausführliches Reden, und ἐπὶ πλεῖον dessen längere Dauer.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: Schließlich vom Schlaf überwältigt
  rationale: Das Aoristpartizip bezeichnet den entscheidenden Moment, nachdem das vorherige langsame Einschlafen geschildert wurde. „Schließlich“ macht diesen Übergang im Deutschen deutlich.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: fiel er aus dem dritten Stock hinunter
  rationale: τρίστεγον bezeichnet die dritte Etage; κάτω hebt die Bewegung nach unten hervor. Die Formulierung ist in modernem Deutsch klar und idiomatisch.
- source_word: ἤρθη νεκρός
  choice: wurde tot aufgehoben
  rationale: Das passive αἴρω kann hier „aufheben“ beziehungsweise „aufnehmen“ bedeuten. νεκρός wird ohne abschwächenden Zusatz direkt mit „tot“ wiedergegeben.
theological_decisions:
- issue: Ob νεκρός als tatsächlicher Tod oder nur als scheinbarer Tod wiederzugeben ist
  choice: tot
  alternative: scheinbar tot / wie tot
  rationale: Der griechische Text bezeichnet Eutychus ohne Unsicherheitsmarker als νεκρός. Eine Abschwächung würde eine interpretierende Einschränkung einführen und die narrative sowie theologische Spannung des Textes mindern.
- issue: Wie eindeutig ἤρθη aufzufassen ist
  choice: aufgehoben
  alternative: aufgenommen / weggetragen
  rationale: Der Kontext legt das Aufheben nach dem Sturz nahe, doch das Verb αἴρω besitzt einen weiteren Bedeutungsumfang. Die Hauptfassung wählt die naheliegende Bedeutung; die Fußnote hält die lexikalische Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, gut verständlichen Sätzen. Die Partizipien des griechischen Satzes werden teilweise in finite Satzformen überführt, während Ablauf und Wiederholung des Schlafmotivs erhalten bleiben.
