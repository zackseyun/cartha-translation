revisions:
- from: Ein junger Mann namens Eutychus saß in der Fensteröffnung. Während Paulus lange sprach, sank er in tiefen Schlaf. Schließlich vom Schlaf überwältigt, fiel er aus dem dritten Stock hinunter und wurde tot aufgehoben.[a]
  to: Ein junger Mann namens Eutychus saß in der Fensteröffnung. Während Paulus lange sprach, sank er in tiefen Schlaf. Vom Schlaf überwältigt, fiel er vom dritten Stockwerk hinunter, und man hob ihn tot auf.[a]
  rationale: Die Revision verbessert ausschließlich die idiomatische deutsche Wiedergabe des griechischen Passivs ἤρθη und präzisiert die dazugehörige lexikalische Fußnote. Bedeutung, Erzählablauf, Ambiguität des Verbs und die ausdrückliche Aussage, dass Eutychus tot war, bleiben erhalten.
