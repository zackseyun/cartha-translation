  text: Καὶ ταῦτα εἰπὼν θεὶς τὰ γόνατα αὐτοῦ σὺν πᾶσιν αὐτοῖς προσηύξατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: de
  text: Nachdem er das gesagt hatte, kniete er mit ihnen allen nieder und betete.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Nachdem …
  rationale: Die einfache griechische Verknüpfung wird im Deutschen zusammen mit dem vorzeitigen Partizip natürlich als temporaler Anschluss wiedergegeben; ein zusätzliches „Und“ wäre hier stilistisch schwerfällig.
- source_word: ταῦτα εἰπὼν
  choice: Nachdem er das gesagt hatte
  rationale: Das adverbiale Aoristpartizip bezeichnet eine Handlung, die dem Niederknien und Beten vorausgeht. Das singularische „das“ ist im modernen Deutsch die natürliche Entsprechung für „diese Dinge“.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: kniete er … nieder
  rationale: Wörtlich steht „seine Knie setzend/legend“; die Wendung bezeichnet idiomatisch das Niederknien. Die Übersetzung vermeidet die nicht geforderte Vorstellung eines plötzlichen Fallens auf die Knie.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: mit ihnen allen
  rationale: σύν mit dem Dativ bezeichnet Begleitung; πᾶσιν betont, dass die gesamte anwesende Gruppe einbezogen war.
- source_word: προσηύξατο
  choice: betete
  rationale: Das Verb προσεύχομαι ist die übliche Bezeichnung für das Beten und wird direkt und natürlich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Partizipialkonstruktion wird in einen natürlichen temporalen Nebensatz aufgelöst; der knappe narrative Stil bleibt erhalten.
