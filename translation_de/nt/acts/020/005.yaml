  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: de
  text: Diese Männer waren vorausgegangen und warteten in Troas auf uns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diese gingen voraus und warteten in Troas auf uns.“'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Diese Männer
  rationale: Das Demonstrativpronomen im maskulinen Plural verweist auf die zuvor genannten Begleiter. „Diese Männer“ macht den Bezug im Deutschen natürlich und eindeutig.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches verbindendes Glied. Der Zusammenhang wird im Deutschen auch ohne ausdrückliche Konjunktion natürlich erkennbar.
- source_word: προσελθόντες
  choice: waren vorausgegangen
  rationale: Das Partizip bezeichnet im Zusammenhang der Reise, dass die genannten Begleiter der Erzählergruppe vorangingen. Das Plusquamperfekt gibt die Vorzeitigkeit gegenüber ihrem Warten klar wieder.
- source_word: ἔμενον
  choice: warteten … auf
  rationale: μένω bedeutet grundsätzlich „bleiben“; mit dem Personenobjekt ἡμᾶς bezeichnet es hier kontextgemäß das Warten auf die Ankunft der Gruppe. Das Präteritum bildet den andauernden Aspekt des Imperfekts angemessen ab.
- source_word: ἡμᾶς
  choice: uns
  rationale: Direkte Wiedergabe des Personalpronomens der ersten Person Plural als Objekt.
- source_word: ἐν Τρῳάδι
  choice: in Troas
  rationale: Natürliche deutsche Ortsangabe für ἐν mit dem Ortsnamen im Dativ.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Wendung „auf uns warten“ gibt den Sinn des im Griechischen wörtlich verwendeten Verbs „bleiben“ im Reisekontext wieder.
