  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: de
  text: 'Paulus aber ging hinunter, warf sich über ihn, umschlang ihn und sagte: »Seid nicht beunruhigt,[a] denn sein Leben ist in ihm.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geratet nicht in Aufruhr.« Das griechische Verb kann sowohl Bestürzung als auch lärmende Unruhe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: »Seine Seele ist in ihm.« Das griechische Wort ψυχή kann »Leben«, »Selbst« oder »Seele« bedeuten. Paulus’ Aussage lässt offen, ob der junge Mann nicht tot gewesen war oder ob sein Leben wiederhergestellt worden war.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς δὲ ὁ Παῦλος
  choice: Paulus aber ging hinunter
  rationale: Das vorangestellte »aber« gibt die leichte Weiterführung beziehungsweise den Kontrast von δέ wieder; »ging hinunter« bewahrt die räumliche Richtung des Aoristpartizips in natürlichem Deutsch.
- source_word: ἐπέπεσεν αὐτῷ
  choice: warf sich über ihn
  rationale: Die Formulierung bezeichnet eine intensive körperliche Bewegung auf den jungen Mann zu und bewahrt zugleich den möglichen Anklang an prophetische Erweckungserzählungen besser als eine rein abschwächende Umschreibung.
- source_word: συμπεριλαβὼν
  choice: umschlang ihn
  rationale: Das Verb beschreibt ein umfassendes In-die-Arme-Nehmen. »Umschlang ihn« ist knapp, körperlich anschaulich und in gehobenem modernem Deutsch verständlich.
- source_word: Μὴ θορυβεῖσθε
  choice: Seid nicht beunruhigt
  rationale: θορυβέω kann innere Bestürzung wie auch äußere Unruhe bezeichnen. Die deutsche Wendung lässt beide Aspekte anklingen, ohne zwingend einen lautstarken Aufruhr zu behaupten.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: denn sein Leben
  rationale: ψυχή bezeichnet hier im unmittelbaren Zusammenhang von Tod und Lebendigkeit am natürlichsten das Leben. »Leben« vermeidet eine unnötige Festlegung auf eine bestimmte Lehre über die Seele.
- source_word: ἐν αὐτῷ ἐστιν
  choice: ist in ihm
  rationale: Die wörtlich-nahe Wiedergabe bewahrt die Offenheit des Griechischen und legt nicht fest, ob das Leben fortbestand oder wiederhergestellt worden war.
theological_decisions:
- issue: Bedeutung von ψυχή im Zusammenhang von Leben und Tod
  choice: Im Haupttext mit »Leben« wiedergegeben.
  alternative: »Seele«
  rationale: Der Kontext fragt nach dem körperlichen Zustand des jungen Mannes. »Leben« entspricht hier dem üblichen Bedeutungsumfang von ψυχή, ohne eine weitergehende anthropologische Aussage einzutragen.
- issue: Ob Eutychus nicht wirklich tot war oder wieder zum Leben kam
  choice: Die Aussage »sein Leben ist in ihm« bleibt im Haupttext neutral.
  alternative: Deutende Wiedergaben wie »er lebt« oder »sein Leben ist in ihn zurückgekehrt«
  rationale: Der griechische Wortlaut erklärt nicht ausdrücklich, ob sein Leben fortbestand oder wiederhergestellt wurde. Diese theologische und erzählerische Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge löst die griechischen Partizipien natürlich auf, erhält aber die körperliche Anschaulichkeit und die mögliche intertextuelle Resonanz. Die Fußnotenmarker stehen jeweils unmittelbar an der betreffenden Aussage.
