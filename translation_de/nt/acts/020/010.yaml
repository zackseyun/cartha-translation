  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. Eine durchgehende Reihung mit »und sagte« entspricht dem griechischen Ablauf unmittelbarer als das ergänzende »Dann sagte er« und liest sich ebenso natürlich.
  terminology: »Leben« ist für ψυχή in diesem Kontext angemessen; die lexikalische Alternative »Seele« bleibt in der Fußnote dokumentiert. »Aufruhr« bildet die mögliche Bedeutung von θορυβεῖσθε gut ab.
