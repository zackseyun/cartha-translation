id: ACT.20.3
reference: Acts 20:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: de
  text: Nachdem er dort drei Monate verbracht hatte, planten die Juden[a] einen Anschlag gegen ihn, als er im Begriff war, nach Syrien auszulaufen. Daher beschloss er, durch Mazedonien zurückzukehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „die Juden“ ist hier die an dem Anschlag beteiligte Gruppe gemeint, nicht das jüdische Volk als Ganzes.
    reason: Kontextuelle und kulturelle Klarstellung, um eine pauschale ethnische Deutung zu vermeiden.
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Nachdem er dort drei Monate verbracht hatte
  rationale: ποιέω mit einer Zeitangabe bedeutet idiomatisch, einen Zeitraum zu verbringen. „Dort“ wird sinngemäß aus dem vorherigen Vers ergänzt und bezeichnet Griechenland.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: schmiedeten … einen Anschlag gegen ihn
  rationale: Der Genitivus absolutus beschreibt den Umstand, der Paulus zur Änderung seiner Reiseroute veranlasste. ἐπιβουλή bezeichnet einen feindseligen Plan oder Anschlag; die aktive deutsche Form gibt den ausdrücklich genannten Urheber natürlich wieder.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: die Juden
  rationale: Die Formulierung entspricht dem ausdrücklichen Wortlaut des Griechischen. Der Kontext begrenzt den Bezug auf die an diesem Anschlag beteiligte Gruppe; eine Fußnote schützt vor einer pauschalen ethnischen Deutung.
- source_word: μέλλοντι ἀνάγεσθαι
  choice: als er gerade … auslaufen wollte
  rationale: μέλλω drückt eine unmittelbar bevorstehende Handlung aus; ἀνάγομαι bedeutet im Zusammenhang einer Seereise „auslaufen“ oder „in See stechen“.
- source_word: εἰς τὴν Συρίαν
  choice: nach Syrien
  rationale: εἰς bezeichnet hier das Ziel der geplanten Seereise.
- source_word: ἐγένετο γνώμης
  choice: Da beschloss er
  rationale: Die Wendung bezeichnet das Fassen eines Entschlusses. „Da“ verbindet den Entschluss natürlich mit der zuvor geschilderten Lage, ohne die Beziehung übermäßig auszudeuten.
- source_word: τοῦ ὑποστρέφειν
  choice: zurückzukehren
  rationale: Der artikulierte Infinitiv nennt den Inhalt des Entschlusses; ὑποστρέφω bedeutet hier „zurückkehren“.
- source_word: διὰ Μακεδονίας
  choice: durch Mazedonien
  rationale: διά mit Genitiv bezeichnet den Reiseweg.
theological_decisions:
- issue: Bezug der Formulierung „die Juden“ in einer Konflikterzählung
  choice: Die wörtliche Formulierung „die Juden“ bleibt im Haupttext erhalten und wird durch eine kontextbezogene Fußnote erläutert.
  alternative: „jüdische Gegner“ oder „einige Juden“
  rationale: Der griechische Text sagt ausdrücklich τῶν Ἰουδαίων. Eine Umschreibung im Haupttext würde diese Formulierung abschwächen; zugleich darf sie nicht unzulässig auf das gesamte jüdische Volk bezogen werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. „Auslaufen“ ist im Kontext der Seereise präzise und geläufig; „einen Anschlag schmieden“ gibt die feindliche Planung idiomatisch wieder.
