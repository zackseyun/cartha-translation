base_translation:
  language: en
  yaml_path: translation/nt/acts/020/008.yaml
  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: de
  text: In dem oberen Raum, in dem wir versammelt waren, gab es viele Lampen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fackeln“. Das griechische Wort kann auch „Fackeln“ bezeichnen; in diesem Innenraum sind jedoch eher Lampen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches Bindewort. Der deutsche Erzählfluss benötigt an dieser Stelle weder ein ausdrückliches „aber“ noch ein zeitliches „nun“.
- source_word: λαμπάδες
  choice: Lampen
  rationale: λαμπάς kann Lampe oder Fackel bezeichnen. In einem Innenraum sind Lampen wahrscheinlicher.
- source_word: ἱκαναὶ
  choice: viele
  rationale: ἱκανός bezeichnet hier eine beträchtliche Anzahl; „viele“ ist klar und idiomatisch.
- source_word: ὑπερῴῳ
  choice: Raum im Obergeschoss
  rationale: ὑπερῷον bezeichnet einen Raum im oberen Teil eines Hauses. Die Formulierung ist im modernen Deutsch eindeutig und natürlich.
- source_word: οὗ
  choice: in dem
  rationale: Das relative Ortsadverb wird passend zum vorausgehenden „Raum“ als lokaler Relativsatz wiedergegeben.
- source_word: συνηγμένοι
  choice: versammelt
  rationale: Das Perfektpartizip beschreibt die Gruppe als zusammengekommen und weiterhin beisammen.
- source_word: ἦσαν ... ἦμεν
  choice: brannten ... waren
  rationale: Die Imperfektformen schildern den bestehenden Hintergrund der Szene. Bei Lampen gibt „brannten“ den gemeinten Zustand im Deutschen natürlicher wieder als das wörtliche „waren“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Umstellung mit „brannten viele Lampen“ vermeidet das schwerfällige „Es waren viele Lampen“ und macht ohne inhaltliche Ergänzung deutlich, dass es sich um Lichtquellen in Gebrauch handelt.
