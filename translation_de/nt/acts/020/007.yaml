source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: de
  text: Am ersten Tag der Woche, als wir zusammengekommen waren, um das Brot zu brechen[a], sprach Paulus mit ihnen; da er am nächsten Tag abreisen wollte[b], dehnte er seine Rede bis Mitternacht aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann ein gemeinsames Mahl bezeichnen und zugleich auf das Herrenmahl hinweisen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Paulus sprach mit ihnen, da er am nächsten Tag abreisen wollte, und dehnte seine Rede bis Mitternacht aus.“'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: Am ersten Tag der Woche
  rationale: Die Wendung ist eine geläufige griechische Bezeichnung für den ersten Wochentag. δέ wird als leichter Anschluss im Deutschen nicht eigens wiedergegeben.
- source_word: συνηγμένων ἡμῶν
  choice: als wir zusammengekommen waren
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Begleitumstand und bewahrt mit „wir“ die Erzählperspektive.
- source_word: κλάσαι ἄρτον
  choice: um das Brot zu brechen
  rationale: Der Infinitiv bezeichnet den Zweck. Die wörtlich verständliche Redewendung lässt offen, ob vor allem ein gemeinsames Mahl oder ausdrücklich das Herrenmahl gemeint ist.
- source_word: διελέγετο αὐτοῖς
  choice: sprach Paulus mit ihnen
  rationale: Das Imperfekt bezeichnet ein andauerndes Sprechen; „mit ihnen“ bewahrt den möglichen dialogischen Zug von διαλέγομαι, ohne eine Predigtform vorauszusetzen.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: Weil er am nächsten Tag abreisen wollte
  rationale: μέλλω mit Infinitiv bezeichnet das unmittelbar Bevorstehende; im Reisekontext ist „abreisen“ natürlich. Das Partizip kann hier plausibel den Grund für die lange Rede angeben.
- source_word: παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου
  choice: dehnte er seine Rede bis Mitternacht aus
  rationale: παρατείνω bedeutet verlängern oder ausdehnen; λόγος bezeichnet hier den gesprochenen Vortrag beziehungsweise die Rede.
theological_decisions:
- issue: Bedeutung von κλάσαι ἄρτον in der frühchristlichen Versammlung
  choice: „das Brot zu brechen“
  alternative: „das Herrenmahl zu feiern“ oder „gemeinsam zu essen“
  rationale: Die Formulierung kann ein Gemeinschaftsmahl bezeichnen und zugleich Anklänge an das Herrenmahl tragen. Die Übersetzung bewahrt diese Offenheit.
- issue: Monologischer oder dialogischer Charakter von διελέγετο
  choice: „sprach ... mit ihnen“
  alternative: „predigte ihnen“ oder „sprach zu ihnen“
  rationale: διαλέγομαι kann Austausch oder eingehende Unterweisung bezeichnen. „Mit ihnen sprechen“ vermeidet eine unbelegte Festlegung auf eine rein monologische Predigt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Satzteilung erhöht die Lesbarkeit, ohne die logischen Beziehungen des griechischen Satzes aufzugeben.
