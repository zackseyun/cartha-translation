  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: de
  text: nur dass der Heilige Geist mir von Stadt zu Stadt[a] bezeugt und sagt, dass Fesseln[b] und Bedrängnisse auf mich warten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in jeder Stadt“. Die griechische Wendung ist distributiv und bezeichnet ein wiederholtes Zeugnis an aufeinanderfolgenden Orten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Bande“. „Fesseln“ bewahrt das konkrete Bild des griechischen Ausdrucks, der hier auf Gefangenschaft hinweist.'
    reason: lexical_alternative
  - marker: c
    text: Einige Handschriften unterscheiden sich geringfügig hinsichtlich der Stellung beziehungsweise des Vorkommens von „mich“ bei „Bedrängnisse“. Der Sinn bleibt, dass Fesseln und Bedrängnisse Paulus bevorstehen.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: nur dass
  rationale: Leitet die einzige Einschränkung zur Aussage des vorangehenden Verses ein und bewahrt die ausnehmende beziehungsweise einschränkende Kraft der Wendung.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Die übliche, klare Wiedergabe der bestimmten griechischen Wortgruppe im modernen Standarddeutsch.
- source_word: κατὰ πόλιν
  choice: in jeder Stadt
  rationale: Die distributive Verbindung von κατά mit einem Substantiv im Singular bezeichnet ein wiederholtes Geschehen an den jeweiligen Orten. Die Übersetzung ist idiomatisch, ohne zwingend eine ausnahmslose Gesamtheit zu behaupten.
- source_word: διαμαρτύρεταί μοι
  choice: mir bezeugt
  rationale: Bewahrt den Sinn eines nachdrücklichen Bezeugens. „Mich warnt“ wäre stärker deutend, da der Inhalt zunächst eine Vorhersage ist.
- source_word: λέγον
  choice: und sagt
  rationale: Das Partizip führt den Inhalt des Zeugnisses ein; die Beiordnung ergibt im Deutschen einen natürlichen Satzfluss.
- source_word: δεσμὰ
  choice: Fesseln
  rationale: Bewahrt das konkrete Bild des griechischen Ausdrucks und lässt zugleich den übertragenen Bezug auf Gefangenschaft erkennen.
- source_word: θλίψεις
  choice: Bedrängnisse
  rationale: Gibt Druck, Not und belastende Leiden würdig und verständlich wieder, ohne den Ausdruck zu verharmlosen oder fachsprachlich einzuengen.
- source_word: με
  choice: auf mich
  rationale: Der Akkusativ wird im Deutschen durch die feste Verbindung „auf jemanden warten“ wiedergegeben und auf beide koordinierten Substantive bezogen.
- source_word: μένουσιν
  choice: warten auf
  rationale: Drückt in diesem Zusammenhang natürlich aus, dass Fesseln und Bedrängnisse Paulus bevorstehen.
theological_decisions:
- issue: Handlungsweise des Heiligen Geistes
  choice: Der Heilige Geist wird als handelndes Subjekt dargestellt, das Paulus etwas bezeugt und sagt.
  alternative: Der Ausdruck könnte als unpersönliche geistliche Einwirkung verstanden werden.
  rationale: Die Verben des Bezeugens und Sagens schreiben dem Heiligen Geist im Vers personale Handlungsfähigkeit zu; die Übersetzung bewahrt diese Darstellung, ohne zusätzliche dogmatische Aussagen einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers beginnt als syntaktische Fortsetzung des vorhergehenden Satzes mit Kleinschreibung. „Bedrängnisse“ ist gehoben, aber allgemein verständlich; „Fesseln“ hält das anschauliche Bild fest.
