  text: ἤγαγον δὲ τὸν παῖδα ζῶντα, καὶ παρεκλήθησαν οὐ μετρίως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: de
  text: Sie nahmen den Jungen lebend mit und wurden außerordentlich getröstet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: brachten ... mit sich
  rationale: Das Aoristverb ἄγω kann je nach Blickrichtung »führen«, »bringen« oder »mitnehmen« bedeuten. »Brachten ... mit sich« gibt die Bewegung wieder, ohne ein im Griechischen nicht genanntes Ziel wie »nach Hause« einzufügen.
- source_word: παῖδα
  choice: Jungen
  rationale: παῖς kann ein Kind, einen Jungen oder einen Diener bezeichnen. Hier ist Eutychus gemeint, der zuvor als νεανίας bezeichnet wurde; »Junge« passt zum Kontext, ohne ein Dienstverhältnis anzudeuten.
- source_word: ζῶντα
  choice: lebend
  rationale: Das Partizip beschreibt prädikativ den Zustand des Jungen, als sie ihn mit sich brachten. »Lebend« bewahrt diese knappe und nachdrückliche Aussage.
- source_word: παρεκλήθησαν
  choice: waren ... getröstet
  rationale: παρακαλέω kann ermutigen, trösten oder stärken bedeuten. Nach dem Sturz und der Wiederherstellung des Eutychus steht hier der Trost der Anwesenden im Vordergrund.
- source_word: οὐ μετρίως
  choice: sehr
  rationale: Die litotische Wendung bedeutet wörtlich »nicht mäßig« und sinngemäß »sehr« oder »in hohem Maß«. »Sehr« ist im modernen Deutschen klar und natürlich.
theological_decisions:
- issue: Art der Wiederherstellung des Eutychus
  choice: Die Formulierung »lebend« bleibt ohne erklärenden Zusatz stehen.
  alternative: Durch einen Zusatz ausdrücklich von Auferweckung oder bloßer Genesung sprechen.
  rationale: Der Vers betont, dass der Junge lebte, benennt hier aber nicht eigens, wie sein Zustand theologisch einzuordnen ist. Die Übersetzung löst diese Spannung daher nicht durch einen Zusatz auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Verstärkung οὐ μετρίως wird klar als »sehr« wiedergegeben; die mögliche Bewegungsrichtung von ἤγαγον bleibt durch eine Fußnote sichtbar.
