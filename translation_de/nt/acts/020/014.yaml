  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: de
  text: Als er in Assos mit uns zusammentraf[a], nahmen wir ihn an Bord und fuhren nach Mytilene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich uns in Assos anschloss“ beziehungsweise „in Assos mit uns zusammenkam“. Das griechische Verb kann ein Treffen oder Zusammenkommen bezeichnen; hier geht es darum, dass Paulus dort wieder zur Reisegruppe stieß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: mit uns zusammentraf
  rationale: Das Verb bezeichnet hier im Reisebericht am natürlichsten das Zusammentreffen beziehungsweise Wiederzusammenkommen des Paulus mit der Schiffsgruppe. „Zusammentraf“ ist im Deutschen idiomatisch und bewahrt die lexikalische Offenheit.
- source_word: ἡμῖν
  choice: mit uns
  rationale: Der Dativ bezeichnet die Reisegruppe, mit der Paulus in Assos zusammentraf.
- source_word: εἰς τὴν Ἆσσον
  choice: in Assos
  rationale: Obwohl εἰς gewöhnlich eine Richtung ausdrückt, verlangt das deutsche Verb „zusammentreffen“ hier idiomatisch eine Ortsangabe. Gemeint ist das Zusammentreffen in Assos.
- source_word: ἀναλαβόντες
  choice: nahmen wir ihn an Bord
  rationale: Im Zusammenhang der Schiffsreise bedeutet das Partizip, dass die Gruppe Paulus auf das Schiff aufnahm. Die Wiedergabe macht den aus dem Kontext klaren nautischen Bezug natürlich verständlich.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist auf Paulus, der im vorhergehenden Zusammenhang genannt ist.
- source_word: ἤλθομεν
  choice: fuhren
  rationale: Der allgemeine Bewegungsbegriff wird aufgrund des eindeutig nautischen Zusammenhangs idiomatisch mit „fuhren“ wiedergegeben.
- source_word: εἰς Μιτυλήνην
  choice: nach Mitylene
  rationale: Bei einem Ortsnamen ist „nach“ die natürliche deutsche Wiedergabe der Zielrichtung.
theological_decisions: []
