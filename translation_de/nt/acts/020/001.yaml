id: ACT.20.1
reference: Acts 20:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: de
  text: Nachdem der Aufruhr vorüber war, ließ Paulus die Jünger zu sich rufen. Er ermutigte sie, verabschiedete sich von ihnen[a] und brach nach Mazedonien auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begrüßte sie“. Das griechische Wort kann sowohl ein Begrüßen als auch – wie hier im Zusammenhang eines Aufbruchs – ein Abschiednehmen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: Nachdem der Aufruhr vorüber war
  rationale: Die Konstruktion mit μετά und substantiviertem Infinitiv bezeichnet die zeitliche Folge. „Aufruhr“ gibt den öffentlichen Tumult in Ephesus treffend wieder; „vorüber war“ klingt im Deutschen natürlich.
- source_word: μεταπεμψάμενος
  choice: ließ ... zu sich rufen
  rationale: Das mediale Verb bezeichnet, dass Paulus nach den Jüngern schicken ließ, damit sie zu ihm kamen. Die Formulierung gibt diese Richtung genauer wieder als bloßes „rief“.
- source_word: τοὺς μαθητὰς
  choice: die Jünger
  rationale: „Jünger“ bewahrt Lukas’ übliche Bezeichnung für die Menschen, die Jesus nachfolgen, statt sie allgemeiner als „Gläubige“ zu bezeichnen.
- source_word: παρακαλέσας
  choice: ermutigte sie
  rationale: παρακαλέω kann ermahnen, ermutigen oder trösten bedeuten. Nach dem Aufruhr und im Rahmen des Abschieds trifft „ermutigte“ die stärkende Funktion, ohne den Sinn unnötig zu verengen.
- source_word: ἀσπασάμενος
  choice: verabschiedete sich von ihnen
  rationale: ἀσπάζομαι bezeichnet gewöhnlich das Grüßen, kann im Kontext des Aufbruchs aber das Abschiednehmen meinen. Hier macht der anschließende Reisebeginn diese kontextuelle Bedeutung wahrscheinlich.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: brach nach Mazedonien auf
  rationale: Die Verbindung bezeichnet das Verlassen des Ortes mit dem Ziel, nach Mazedonien zu reisen. „brach ... auf“ ist eine natürliche deutsche Reisewendung und schließt das Ziel knapp ein.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge wurde gegenüber der griechischen Partizipienkette gegliedert, ohne die zeitliche Abfolge zu verändern.
