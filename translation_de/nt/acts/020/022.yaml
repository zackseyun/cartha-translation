id: ACT.20.22
reference: Acts 20:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: de
  text: 'Und nun: Seht, im Geist gebunden[a] gehe ich nach Jerusalem, ohne zu wissen, was mir dort begegnen wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „im eigenen Geist gebunden“; die griechische Wendung kann sich auf Paulus’ eigenen Geist oder auf den Heiligen Geist beziehen. Sinngemäß könnte sie auch „vom Geist gedrängt“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: seht
  rationale: Gibt den hervorhebenden und aufmerksamkeitslenkenden Charakter der Partikel in einer heutigen, würdigen Anrede an die versammelten Zuhörer wieder.
- source_word: δεδεμένος
  choice: gebunden
  rationale: Bewahrt das Bild des griechischen Perfektpartizips von δέω und legt nicht vorschnell fest, ob eine innere Bindung oder ein vom Geist ausgehender Zwang gemeint ist.
- source_word: τῷ πνεύματι
  choice: im Geist
  rationale: Gibt die Dativwendung eng wieder und lässt eher als „vom Geist“ offen, ob der Heilige Geist, Paulus’ eigener Geist oder eine durch den Geist bewirkte Bindung gemeint ist.
- source_word: πορεύομαι
  choice: gehe ich
  rationale: Natürliche deutsche Wiedergabe der gegenwärtigen beziehungsweise unmittelbar bevorstehenden Bewegung nach Jerusalem.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: was mir dort begegnen wird
  rationale: Bewahrt das griechische Bild dessen, was Paulus in Jerusalem entgegentreten wird, und klingt zugleich natürlich im Deutschen.
- source_word: μὴ εἰδώς
  choice: ohne zu wissen
  rationale: Gibt die begleitende Partizipialkonstruktion klar und idiomatisch wieder.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Bezug von τῷ πνεύματι
  choice: „im Geist“, wobei der Heilige Geist wahrscheinlich gemeint ist
  alternative: „im eigenen Geist“ oder stärker deutend „vom Geist gedrängt“
  rationale: Der Sprachgebrauch der Apostelgeschichte und der unmittelbare Kontext sprechen für den Heiligen Geist. Die griechische Dativkonstruktion entscheidet die Frage jedoch nicht eindeutig; daher bleibt die Spannung im Haupttext erhalten und wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Seht“ erhält die nachdrückliche Übergangsfunktion von ἰδοὺ; „im Geist gebunden“ bewahrt bewusst die Mehrdeutigkeit des Ausgangstextes.
