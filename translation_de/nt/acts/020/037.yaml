lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: Da brachen sie alle in heftiges Weinen aus
  rationale: Die Formulierung gibt den beträchtlichen Umfang des Weinens und die Beteiligung aller natürlich und eindringlich wieder. Das δέ markiert hier den Fortgang der Erzählung und wird mit „Da“ idiomatisch aufgenommen.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: fielen Paulus um den Hals
  rationale: Die geläufige deutsche Wendung bewahrt das ausdrückliche Halsmotiv des griechischen Ausdrucks und bezeichnet zugleich verständlich die innige Umarmung.
- source_word: κατεφίλουν αὐτόν
  choice: küssten ihn immer wieder
  rationale: Das Imperfekt bezeichnet ein andauerndes oder wiederholtes Küssen; „immer wieder“ macht diesen Aspekt deutlich. Das verstärkende καταφιλέω wird durch die wiederholte, innige Handlung angemessen wiedergegeben, ohne eine zusätzliche Deutung einzutragen.
