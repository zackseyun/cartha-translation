id: ACT.20.4
reference: Acts 20:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: de
  text: Mit ihm reisten Sopater, der Sohn des Pyrrhus, aus Beröa, ferner Aristarch und Sekundus aus Thessalonich[a], Gaius aus Derbe und Timotheus sowie Tychikus und Trophimus aus Asia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von den Thessalonichern“, das heißt: aus ihrer Mitte.'
    reason: lexical_alternative
  - marker: b
    text: Asia bezeichnet hier die römische Provinz dieses Namens, nicht den heutigen Kontinent Asien.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: reisten mit ihm
  rationale: Das Imperfekt von συνέπομαι bezeichnet das Mitreisen bzw. Begleiten. „Mit ihm reisten“ ist im Deutschen bei einer Aufzählung natürlich und gibt den Reisezusammenhang klar wieder.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sopater, der Sohn des Pyrrhus, aus Beröa
  rationale: Der Genitiv Πύρρου wird am natürlichsten als Vatersname verstanden; Βεροιαῖος bezeichnet Sopaters Herkunft aus Beröa.
- source_word: Θεσσαλονικέων
  choice: aus Thessalonich
  rationale: Der Genitiv Plural ordnet Aristarch und Sekundus den Thessalonichern zu. Die idiomatische deutsche Herkunftsangabe lautet „aus Thessalonich“; die wörtlichere Form wird in einer Fußnote genannt.
- source_word: Γάϊος Δερβαῖος
  choice: Gaius aus Derbe
  rationale: Δερβαῖος ist eine geografische Herkunftsbezeichnung, die im modernen Deutschen natürlich mit „aus Derbe“ wiedergegeben wird.
- source_word: Ἀσιανοὶ
  choice: aus Asia
  rationale: Gemeint ist die römische Provinz Asia. Der historische Eigenname „Asia“ bewahrt diese geografische Bedeutung besser als das moderne „Asien“.
- source_word: δέ ... δέ ... δέ
  choice: ferner ... sowie
  rationale: Die wiederholten Partikeln gliedern die nacheinander hinzugefügten Personengruppen. Die gewählten deutschen Verknüpfungen erhalten diese additive Struktur, ohne die Aufzählung schwerfällig zu machen.
