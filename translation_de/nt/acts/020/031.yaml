id: ACT.20.31
reference: Acts 20:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: de
  text: 'Darum seid wachsam und denkt daran: Drei Jahre lang habe ich Nacht und Tag nicht aufgehört, jeden Einzelnen unter Tränen zu ermahnen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu warnen“. Das griechische Verb kann sowohl ermahnende Unterweisung als auch korrigierendes Warnen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorhergehenden Warnung und klingt im modernen Deutsch natürlich.
- source_word: γρηγορεῖτε
  choice: seid wachsam
  rationale: Der Präsensimperativ fordert zu anhaltender Wachsamkeit auf; die Formulierung bewahrt das Bild des Wachens, ohne altertümlich zu wirken.
- source_word: μνημονεύοντες
  choice: und denkt daran
  rationale: Gibt das begleitende Partizip idiomatisch wieder und verbindet die gebotene Wachsamkeit mit der Erinnerung an Paulus’ Beispiel.
- source_word: ὅτι
  choice: Doppelpunkt
  rationale: Der Doppelpunkt leitet im Deutschen natürlich den Inhalt dessen ein, woran sie denken sollen.
- source_word: τριετίαν
  choice: Drei Jahre lang
  rationale: Gibt den Akkusativ der zeitlichen Ausdehnung klar und idiomatisch wieder.
- source_word: νύκτα καὶ ἡμέραν
  choice: Nacht und Tag
  rationale: Bewahrt die Reihenfolge und den Ausdruck fortwährenden Einsatzes im griechischen Text.
- source_word: οὐκ ἐπαυσάμην
  choice: habe ich nicht aufgehört
  rationale: Gibt die verneinte Aussage über Paulus’ unablässiges Handeln in natürlichem modernem Deutsch wieder.
- source_word: μετὰ δακρύων
  choice: unter Tränen
  rationale: Drückt die Begleitung durch Tränen idiomatisch aus und erhält die emotionale Intensität.
- source_word: νουθετῶν
  choice: zu ermahnen
  rationale: Erfasst sowohl Unterweisung als auch korrigierende Warnung und bewahrt den persönlichen, seelsorgerlichen Nachdruck.
- source_word: ἕνα ἕκαστον
  choice: jeden Einzelnen
  rationale: Bewahrt die distributive Betonung der persönlichen Zuwendung zu jeder einzelnen Person.
theological_decisions:
- issue: Seelsorgerliche Bedeutung von νουθετῶν
  choice: zu ermahnen
  alternative: zu warnen / zurechtzuweisen
  rationale: „Ermahnen“ lässt sowohl die unterweisende als auch die korrigierend warnende Seite offen und verengt Paulus’ Dienst nicht auf bloße Warnung oder Tadel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit Doppelpunkt vermeidet eine schwerfällige dass-Konstruktion; „jeden Einzelnen“ erhält die persönliche Betonung des Ausgangstextes.
