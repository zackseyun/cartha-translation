  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: de
  text: indem ich sowohl Juden als auch Griechen eindringlich die Umkehr zu Gott und den Glauben an unseren Herrn Jesus[a] bezeugte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Vertrauen auf unseren Herrn Jesus.'
    reason: Lexikalische Alternative für πίστις; „Vertrauen“ hebt die persönliche Ausrichtung des Glaubens hervor.
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: indem ich … eindringlich bezeugte
  rationale: Das Verb bezeichnet ein nachdrückliches, ernstes Bezeugen. „Eindringlich bezeugte“ bewahrt sowohl den Zeugnischarakter als auch das besondere Gewicht der Aussage; die finite Form fügt sich im Deutschen natürlich in den fortlaufenden Satz ein.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: Juden wie Griechen
  rationale: Die Paarformel gibt beide ausdrücklich genannten Gruppen wieder. „Griechen“ wahrt Lukas’ Wortwahl und verallgemeinert sie nicht zu „Heiden“.
- source_word: μετάνοιαν
  choice: die Umkehr
  rationale: „Umkehr“ bezeichnet eine grundlegende Neuausrichtung des Denkens und Lebens und vermeidet sowohl die Verengung auf bloße Reue als auch auf eine rein gedankliche Meinungsänderung.
- source_word: εἰς θεόν
  choice: zu Gott
  rationale: εἰς drückt hier die Richtung beziehungsweise Ausrichtung der Umkehr aus. „Umkehr zu Gott“ ist im Deutschen klar und natürlich.
- source_word: πίστιν
  choice: den Glauben
  rationale: „Glaube“ ist die übliche und sachlich angemessene Wiedergabe von πίστις. Da Jesus ausdrücklich als Gegenüber und Ziel genannt wird, ist auch „Vertrauen“ möglich und wird in der Fußnote bewahrt.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: an unseren Herrn Jesus
  rationale: In Verbindung mit πίστις bezeichnet εἰς die Person, auf die sich der Glaube richtet. Idiomatisches Deutsch lautet „Glaube an“. „Herr“ bewahrt das christologische Gewicht von κύριος.
theological_decisions:
- issue: Wiedergabe von πίστις in der Wendung πίστιν εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: Glaube an unseren Herrn Jesus
  alternative: Vertrauen auf unseren Herrn Jesus
  rationale: Der Haupttext verwendet die etablierte Wiedergabe „Glaube“, ohne den persönlichen Vertrauensaspekt auszuschließen. Weil Jesus ausdrücklich das Ziel des Glaubens ist, liegt hier nicht die Debatte um eine Genitivverbindung wie πίστις Χριστοῦ vor. Die lexikalisch mögliche Nuance „Vertrauen“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die partizipiale Verknüpfung wird mit „indem ich“ natürlich wiedergegeben. „Juden wie Griechen“ erhält die lukanische Paarformel; „Umkehr“ und „Glaube“ bewahren die theologischen Begriffe, ohne sie konfessionell zu verengen.
