source:
  edition: SBLGNT
  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: de
  text: 'Als sie zu ihm kamen, sagte er zu ihnen: »Ihr selbst wisst, wie ich von dem ersten Tag an, als ich Asia[a] betrat, die ganze Zeit unter euch gelebt habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist die römische Provinz Asia im Westen Kleinasiens, nicht der heutige Kontinent Asien. Der griechische Ausdruck kann auch wiedergegeben werden: »wie ich vom ersten Tag an, als ich Asia betrat, die ganze Zeit bei euch gewesen bin.«'
    reason: Die Anmerkung erklärt den historischen Ortsnamen und bewahrt die lexikalische Möglichkeit, dass der Ausdruck neben Paulus’ Lebensführung seine fortwährende Anwesenheit betont.
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: bei ihm angekommen waren
  rationale: Die Wendung bezeichnet die Ankunft der Ältesten bei Paulus und klingt im Deutschen natürlich.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Ihr selbst wisst
  rationale: Das ausdrücklich gesetzte Pronomen Ὑμεῖς wird durch »selbst« betont wiedergegeben; ἐπίστασθε bezeichnet ihr persönliches Wissen aus eigener Erfahrung.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: vom ersten Tag an, an dem ich … betrat
  rationale: Die Formulierung bewahrt den zeitlichen Ausgangspunkt und die anschauliche Bedeutung von ἐπιβαίνω, ohne im Deutschen schwerfällig zu wirken.
- source_word: εἰς τὴν Ἀσίαν
  choice: die Provinz Asia
  rationale: »Asia« wird als historischer Eigenname beibehalten und durch »Provinz« eindeutig vom modernen Kontinent Asien unterschieden.
- source_word: μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: wie ich mich … die ganze Zeit unter euch verhalten habe
  rationale: Die Übersetzung gibt die im Zusammenhang naheliegende Aussage über Paulus’ Lebensführung wieder; »unter euch« bezeichnet sein Leben in ihrer Mitte. Die mögliche Betonung seiner fortwährenden Anwesenheit bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von ἐγενόμην in Verbindung mit μεθ’ ὑμῶν
  choice: wie ich mich … unter euch verhalten habe
  alternative: wie ich … die ganze Zeit bei euch gewesen bin
  rationale: Der folgende Rückblick entfaltet Paulus’ Lebens- und Dienstweise, weshalb eine Aussage über sein Verhalten im Kontext besonders naheliegt. Da der griechische Ausdruck zugleich sein fortwährendes Zusammensein mit ihnen bezeichnen kann, wird diese Alternative nicht ausgeschlossen, sondern als Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Anrede wird mit »Ihr selbst« bewahrt. »Sich verhalten« ist verständlicher und weniger umgangssprachlich als »wie ich gelebt habe«, während die alternative Lesart zur Anwesenheit in der Fußnote dokumentiert wird.
