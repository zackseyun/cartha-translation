source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: de
  text: 'Doch mein eigenes Leben ist mir nicht kostbar[a], wenn ich nur meinen Lauf[b] und den Dienst vollenden kann, den ich vom Herrn Jesus empfangen habe: das Evangelium von der Gnade Gottes zu bezeugen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich erachte mein Leben für mich selbst nicht als kostbar.“ Das griechische Wort kann auch „Seele“ bedeuten. Hier bezeichnet „Leben“ die Bereitschaft des Paulus, angesichts seines Auftrags auch den Tod auf sich zu nehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinen Wettlauf“. Das griechische Wort bezeichnet eine zu durchlaufende Strecke oder einen Lauf, der bis zum Ziel geführt wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nachdrücklich Zeugnis abzulegen“. Das griechische Verb kann ein ernstes oder feierliches Bezeugen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι … τιμίαν ἐμαυτῷ
  choice: ist mir nicht kostbar
  rationale: Die natürliche deutsche Formulierung bewahrt den Gedanken der persönlichen Wertschätzung, ohne Paulus eine allgemeine Geringschätzung des Lebens zuzuschreiben.
- source_word: ψυχήν
  choice: Leben
  rationale: Im Zusammenhang mit drohendem Leiden und Tod bezeichnet ψυχή das irdische Leben; „Seele“ könnte hier irreführend einen Leib-Seele-Gegensatz nahelegen.
- source_word: ὡς τελειῶσαι
  choice: wenn ich nur … vollenden kann
  rationale: Die komprimierte Konstruktion bringt das alles bestimmende Ziel des Paulus zum Ausdruck. „Wenn ich nur“ gibt diesen Nachdruck im Deutschen natürlich wieder, ohne sie auf einen bloßen Zwecksatz festzulegen.
- source_word: δρόμον
  choice: Lauf
  rationale: „Lauf“ bewahrt das Bild einer zurückzulegenden Strecke und lässt wie das Griechische sowohl an einen Lebensweg als auch an einen Wettlauf denken.
- source_word: διακονίαν
  choice: Dienst
  rationale: Gemeint ist der von Jesus übertragene Auftrag. „Dienst“ ist verständlich, lexikalisch nah und weniger institutionell geprägt als „Amt“.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: vom Herrn Jesus
  rationale: παρά mit Genitiv bezeichnet hier die Quelle des empfangenen Dienstes; der Titel κύριος wird als „Herr“ wiedergegeben.
- source_word: διαμαρτύρασθαι
  choice: zu bezeugen
  rationale: Das Verb bezeichnet ein nachdrückliches, ernstes Zeugnis. „Bezeugen“ ist im Haupttext prägnant; die mögliche Verstärkung wird in der Fußnote genannt.
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: das Evangelium von der Gnade Gottes
  rationale: 'Die Formulierung erhält die Offenheit der Genitivverbindung: Das Evangelium ist von Gottes Gnade geprägt und hat sie zugleich zum Inhalt.'
theological_decisions:
- issue: Bedeutung von ψυχή in der Selbstaussage des Paulus
  choice: Leben
  alternative: Seele
  rationale: Der Kontext handelt von der Bereitschaft des Paulus, Leiden und Tod auf sich zu nehmen, um seinen Auftrag abzuschließen. „Leben“ vermeidet einen hier nicht ausgedrückten Gegensatz zwischen Körper und immaterieller Seele.
- issue: Sinn von ὡς τελειῶσαι
  choice: wenn ich nur … vollenden kann
  alternative: damit ich … vollende / um … zu vollenden
  rationale: Die Wendung bezeichnet das vorrangige Anliegen des Paulus, lässt sich aber grammatisch auch stärker final verstehen. Die gewählte Fassung wahrt den rhetorischen Nachdruck und die syntaktische Spannung.
- issue: Bezug des Genitivs τῆς χάριτος τοῦ θεοῦ
  choice: von der Gnade Gottes
  alternative: über Gottes Gnade
  rationale: Die formal offene Wiedergabe legt nicht einseitig fest, ob der Genitiv vor allem Inhalt oder Kennzeichen des Evangeliums bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metapher „Lauf“ und die offene Wendung „Evangelium von der Gnade Gottes“ bleiben erhalten; konfessionell oder institutionell enger gefärbte Begriffe werden vermieden.
