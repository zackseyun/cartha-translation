  source_fidelity: 'Die Übersetzung gibt die Abfolge korrekt wieder: Die Wir-Gruppe ging Paulus voraus zum Schiff, stach nach Assos in See und beabsichtigte, ihn dort an Bord zu nehmen. Der Kontrast zwischen der Seereise der Gruppe und Paulus’ Landweg ist gewahrt. Die aktiv formulierte Deutung von διατεταγμένος ἦν als „hatte er es angeordnet“ ist kontextuell gut begründet; die formale Passivlesart wird sachgerecht in der Fußnote offengehalten.'
  naturalness: Der Text ist idiomatisches modernes Standarddeutsch. „Zum Schiff gehen“, „nach Assos in See stechen“ und „an Bord nehmen“ sind klar und erzählerisch angemessen. „Zu Fuß dorthin gehen“ ist verständlich und bewahrt den ausdrücklich hervorgehobenen persönlichen Landweg.
  terminology: „Paulus“ und „Assos“ sind etablierte deutsche Namensformen. Die nautischen Ausdrücke sind treffend. Die Fußnoten erläutern die grammatische Passivform und die Bedeutungsbreite von πεζεύειν ohne eine theologische oder konfessionelle Festlegung.
