id: ACT.20.13
reference: Acts 20:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: de
  text: Wir aber gingen voraus zum Schiff und stachen nach Assos in See. Dort wollten wir Paulus an Bord nehmen; denn so hatte er es angeordnet,[a] da er selbst zu Fuß dorthin gehen wollte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn so war es angeordnet worden“. Die griechische Form ist grammatisch passiv; im Zusammenhang liegt jedoch nahe, dass Paulus selbst diese Anweisung gegeben oder diese Regelung getroffen hatte.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „da er selbst über Land reisen wollte“. Das griechische Verb kann das Reisen zu Fuß bezeichnen und stellt jedenfalls den Landweg der Schiffsreise der Gruppe gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: gingen voraus
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Auslaufen vorausging, und bringt zugleich zum Ausdruck, dass die Reisegruppe Paulus vorausging.
- source_word: ἐπὶ τὸ πλοῖον
  choice: zum Schiff
  rationale: Bei einer Bewegung kann ἐπί das Hinauf- oder Anbordgehen bezeichnen. Im Deutschen klingt „zum Schiff“ nach „gingen voraus“ natürlich; das anschließende „stachen … in See“ setzt das Besteigen des Schiffes voraus.
- source_word: ἀνήχθημεν
  choice: stachen … in See
  rationale: ἀνάγω ist hier nautisch gebraucht und bedeutet, mit einem Schiff abzulegen beziehungsweise in See zu stechen.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: nach Assos
  rationale: Die Präposition bezeichnet mit dem nautischen Bewegungsverb das Reiseziel. „Nach Assos“ ist dafür die natürliche deutsche Form.
- source_word: ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον
  choice: Dort wollten wir Paulus an Bord nehmen
  rationale: μέλλω drückt hier eine Absicht aus. ἀναλαμβάνω bedeutet im Reise- und Schiffskontext, jemanden aufzunehmen; „an Bord nehmen“ macht diesen Sinn klar. Das ablativische ἐκεῖθεν wird idiomatisch durch „dort … an Bord nehmen“ wiedergegeben.
- source_word: διατεταγμένος ἦν
  choice: so hatte er es angeordnet
  rationale: Die periphrastische Passivform bezeichnet eine zuvor getroffene Festlegung. Der Zusammenhang legt Paulus als denjenigen nahe, der die Anweisung oder Vereinbarung getroffen hatte; die formale passive Lesart bleibt in einer Fußnote erhalten.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: da er selbst zu Fuß dorthin gehen wollte
  rationale: πεζεύω bezeichnet im Gegensatz zur Schiffsreise den Weg über Land und kann insbesondere das Reisen zu Fuß meinen. αὐτός ist betont und wird mit „selbst“ wiedergegeben; μέλλω bezeichnet die Absicht.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier den milden Gegensatz zwischen der vorausfahrenden Wir-Gruppe und Paulus, der einen anderen Reiseweg nahm.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdevolle Erzählsprache. „In See stechen“ und „an Bord nehmen“ bewahren den nautischen Zusammenhang. Die Ambiguität der passiven Anordnungsform sowie die mögliche Bandbreite von πεζεύειν werden durch Fußnoten offengehalten.
