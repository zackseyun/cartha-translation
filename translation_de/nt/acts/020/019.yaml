id: ACT.20.19
reference: Acts 20:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: de
  text: Ich diente dem Herrn mit aller Demut, mit Tränen und unter Prüfungen[a], die mir durch die Anschläge der Juden[b] widerfuhren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Versuchungen“ beziehungsweise „Erprobungen“; hier sind äußere Bedrängnisse gemeint, die aus dem Widerstand gegen Paulus entstanden.
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind bestimmte jüdische Gegner, die Anschläge gegen Paulus planten, nicht die Juden insgesamt.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: Ich diente
  rationale: Das Präsenspartizip beschreibt Paulus’ fortdauernden Dienst als begleitende Lebens- und Handlungsweise. Für einen verständlichen deutschen Vers wird es verbal wiedergegeben; „dienen“ bewahrt die Hingabe, ohne den Sklavenstatus unnötig in den Vordergrund zu rücken.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: „Herr“ entspricht dem Titel κύριος und lässt wie der griechische Text unausgesprochen, dass hier im Kontext am ehesten Jesus gemeint ist.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: mit aller Demut
  rationale: Die Formulierung bewahrt sowohl die begleitende Art des Dienstes als auch die verstärkende umfassende Bedeutung von πάσης.
- source_word: δακρύων
  choice: Tränen
  rationale: Die konkrete Pluralform erhält die emotionale Anschaulichkeit von Paulus’ Aussage.
- source_word: πειρασμῶν
  choice: Prüfungen
  rationale: Im Zusammenhang mit feindlichen Anschlägen bezeichnet das Wort äußere Bedrängnisse oder Bewährungsproben, nicht vorrangig Verlockungen zur Sünde.
- source_word: τῶν συμβάντων μοι
  choice: die mir … widerfuhren
  rationale: Die attributive Partizipialkonstruktion bestimmt die Prüfungen als Ereignisse, die Paulus persönlich trafen; „widerfuhren“ ist präzise und würdevoll.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: durch die Anschläge
  rationale: 'ἐν kann hier instrumental beziehungsweise ursächlich verstanden werden: Die Anschläge waren der Umstand oder das Mittel, durch das die Prüfungen über Paulus kamen.'
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Dies ist die direkte Wiedergabe von Ἰουδαίων. Der Zusammenhang begrenzt die Aussage auf die konkreten jüdischen Gegner, die gegen Paulus Anschläge planten.
theological_decisions:
- issue: Mögliche antijüdische Verallgemeinerung von „der Juden“
  choice: Die direkte Wiedergabe „der Juden“ wird beibehalten und durch eine Fußnote auf die konkreten jüdischen Gegner des Paulus begrenzt.
  alternative: der jüdischen Führer; der Judäer
  rationale: Der griechische Wortlaut nennt Ἰουδαίων und schränkt die Gruppe nicht ausdrücklich auf Führungspersonen ein. Zugleich erlaubt der Kontext keine Aussage über alle Juden; die Fußnote verhindert diese Verallgemeinerung, ohne den Haupttext interpretierend umzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Formulierung „mit aller Demut, mit Tränen und unter Prüfungen“ ist natürlich verständlich und bewahrt die drei begleitenden Umstände des Dienstes. Das finite „Ich diente“ gibt das griechische Partizip in einem eigenständig lesbaren Vers wieder.
