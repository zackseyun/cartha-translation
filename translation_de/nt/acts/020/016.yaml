id: ACT.20.16
reference: Acts 20:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: de
  text: Denn Paulus hatte beschlossen, an Ephesus vorbeizusegeln[a], um sich nicht in Asia aufhalten zu müssen. Er beeilte sich nämlich, wenn möglich[b], am Pfingsttag in Jerusalem zu sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Asia« ist hier die römische Provinz im Westen Kleinasiens gemeint, nicht der heutige Kontinent Asien.
    reason: cultural_note
  - marker: b
    text: 'Oder: »am Pfingsttag in Jerusalem einzutreffen«. Die griechische Formulierung kann entweder betonen, dass Paulus an diesem Tag dort sein wollte, oder dass er dann dort eintreffen wollte.'
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: hatte beschlossen
  rationale: Das Plusquamperfekt gibt eine bereits zuvor gefasste, feste Entscheidung im natürlichen Deutschen wieder.
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: an Ephesus vorbeizusegeln
  rationale: Die Wiedergabe bewahrt ausdrücklich den Seeweg und klingt im Deutschen idiomatisch.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: damit er sich nicht länger … aufhalten musste
  rationale: Die idiomatische Konstruktion bezeichnet das Vermeiden eines zeitraubenden Aufenthalts; „länger“ bringt den Aspekt des Zeitverbrauchs natürlich zum Ausdruck.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: in Asia
  rationale: Der historische Eigenname der römischen Provinz bleibt im Text erhalten; eine Fußnote grenzt ihn vom modernen Kontinent Asien ab.
- source_word: ἔσπευδεν
  choice: Er beeilte sich
  rationale: Das Imperfekt beschreibt sein fortdauerndes Bemühen um rasches Vorankommen.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: wenn möglich
  rationale: Die knappe deutsche Wendung gibt die im Griechischen ausgedrückte Bedingtheit idiomatisch wieder.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: am Pfingsttag
  rationale: Dies ist die geläufige und präzise deutsche Bezeichnung des betreffenden Festtags.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: in Jerusalem zu sein
  rationale: Die Formulierung bezeichnet natürlich das angestrebte Ergebnis, ohne die mögliche Nuance des Eintreffens auszuschließen; diese wird in einer Fußnote genannt.
theological_decisions:
- issue: Zeitlicher Bezug von γενέσθαι εἰς Ἱεροσόλυμα mit τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: am Pfingsttag in Jerusalem zu sein
  alternative: am Pfingsttag in Jerusalem einzutreffen
  rationale: Die griechische Formulierung kann das Anwesendsein zu diesem Zeitpunkt oder das Eintreffen an diesem Tag hervorheben. Der Haupttext wählt die im Kontext natürliche Zielangabe und bewahrt die Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Der historische Provinzname „Asia“ bleibt stehen und wird erläutert; die zeitliche Mehrdeutigkeit des letzten Satzteils wird nicht stillschweigend aufgelöst.
