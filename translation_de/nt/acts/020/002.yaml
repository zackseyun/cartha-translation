    rationale: Das griechische αὐτούς bedeutet lediglich „sie“. Obwohl der Kontext wahrscheinlich Glaubende bzw. Jünger meint, werden sie in diesem Vers nicht benannt. „Sie“ bewahrt die Vorlage und vermeidet eine unnötige Einengung.
  - severity: low
    issue: 'Fußnote: „mit vielem Wort“'
    rationale: Die Formulierung ist zwar formal am Singular orientiert, im modernen Deutschen aber unidiomatisch. „Mit viel Rede“ gibt die wörtliche Bildlichkeit verständlicher wieder; zudem sollte die mögliche ermahnende Nuance von παρακαλέω als Alternative erkennbar bleiben.
