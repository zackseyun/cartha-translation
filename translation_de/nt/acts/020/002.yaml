  text: διελθὼν δὲ τὰ μέρη ἐκεῖνα καὶ παρακαλέσας αὐτοὺς λόγῳ πολλῷ ἦλθεν εἰς τὴν Ἑλλάδα
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: de
  text: Nachdem er jene Gegenden durchzogen und sie mit vielen Worten ermutigt hatte,[a] kam er nach Griechenland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausführlich zugesprochen“ oder „eindringlich ermahnt“. Wörtlich: „mit viel Rede“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Nachdem er … durchzogen … hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Ankunft in Griechenland vorausgeht. Die Konstruktion mit „nachdem“ gibt diese zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: τὰ μέρη ἐκεῖνα
  choice: jene Gegenden
  rationale: μέρη bezeichnet hier geografische Gebiete. „Jene Gegenden“ ist idiomatisch und bewahrt den rückverweisenden Charakter von ἐκεῖνα.
- source_word: παρακαλέσας
  choice: ermutigt
  rationale: παρακαλέω kann je nach Zusammenhang ermutigen, ermahnen oder trösten bedeuten. Bei Paulus’ Besuch der Gemeinden gibt „ermutigt“ den weiten seelsorgerlichen Sinn wieder, ohne ihn unnötig auf Ermahnung zu verengen.
- source_word: αὐτοὺς
  choice: die Gläubigen
  rationale: Das Pronomen bezieht sich sinngemäß auf die Menschen in den zuvor genannten Gemeinden. Das Bezugswort wird zur Klarheit im Deutschen ausdrücklich genannt.
- source_word: λόγῳ πολλῷ
  choice: mit vielen Worten
  rationale: Die Formulierung bildet den griechischen Ausdruck nahezu wörtlich ab und bleibt verständlich. Gemeint sein kann auch ausführliches oder eindringliches Zusprechen; diese Bedeutungsbreite wird in der Fußnote genannt.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: kam er nach Griechenland
  rationale: ἔρχομαι bezeichnet hier die Bewegung zum Ziel. Im Deutschen ist „nach Griechenland kommen“ natürlicher als eine wörtliche Wiedergabe mit „in“.
- source_word: δὲ
  choice: nicht gesondert wiedergegeben
  rationale: Die schwache weiterführende Funktion von δέ ist in der deutschen Satzverknüpfung mit „Nachdem“ ausreichend enthalten.
