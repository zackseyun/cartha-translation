source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: de
  text: Von dort segelten wir weiter und kamen am nächsten Tag auf die Höhe von Chios[a]. Am folgenden Tag legten wir in Samos an[b], und einen Tag später kamen wir nach Milet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Chios gegenüber«; gemeint ist eine Position vor beziehungsweise auf der Höhe der Insel, nicht unbedingt eine Landung dort.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »machten wir bei Samos halt«. Das griechische Verb ist ein Ausdruck aus der Seefahrt und kann das Heranfahren oder Anlegen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Von dort
  rationale: Die Krasis aus καί und ἐκεῖθεν setzt den Reisebericht fort und bezeichnet zugleich den Ausgangspunkt. Im Deutschen stellt der neue Satz den Zusammenhang auch ohne ein ausdrückliches »und« natürlich her.
- source_word: ἀποπλεύσαντες
  choice: segelten wir weiter
  rationale: Das Aoristpartizip bezeichnet das Ablegen beziehungsweise die Weiterfahrt auf dem Seeweg. Die finite Wiedergabe fügt sich natürlich in die deutsche Reiseroute ein.
- source_word: τῇ ἐπιούσῃ
  choice: am nächsten Tag
  rationale: Der temporale Dativ bezeichnet den unmittelbar folgenden Tag.
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: kamen wir auf die Höhe von Chios
  rationale: καταντάω bezeichnet hier das Erreichen einer Position, während ἄντικρυς eine Lage Chios gegenüber angibt. »Auf die Höhe von Chios« ist im deutschen nautischen Zusammenhang verständlich und behauptet keine Landung auf der Insel.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: Am folgenden Tag
  rationale: Die Wendung führt die chronologische Folge mit dem nächsten Reisetag fort.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: legten wir in Samos an
  rationale: παραβάλλω wird hier nautisch gebraucht und bezeichnet das Heranfahren beziehungsweise Anlegen; die Formulierung lässt die genaue Dauer des Aufenthalts offen.
- source_word: τῇ δὲ ἐχομένῃ
  choice: einen Tag später
  rationale: Die substantivierte Partizipialwendung bezeichnet den wiederum anschließenden Tag. Die deutsche Formulierung macht die gestufte Tagesfolge klar.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: kamen wir nach Milet
  rationale: Die schlichte Reiseformulierung gibt das Verb mit der durch εἰς bezeichneten Zielrichtung natürlich wieder.
- source_word: Χίου / Σάμον / Μίλητον
  choice: Chios / Samos / Milet
  rationale: Die Ortsnamen folgen ihren etablierten deutschen Formen.
theological_decisions: []
