  text: αὐτοὶ γινώσκετε ὅτι ταῖς χρείαις μου καὶ τοῖς οὖσι μετ’ ἐμοῦ ὑπηρέτησαν αἱ χεῖρες αὗται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: de
  text: Ihr selbst wisst, dass diese Hände für meine Bedürfnisse und für die derer, die bei mir waren, gesorgt haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass diese Hände meinen Bedürfnissen und denen derer, die bei mir waren, gedient haben.« Das griechische Verb bezeichnet praktischen Dienst oder Hilfe und kann hier materielle Versorgung durch Handarbeit einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: selbst
  rationale: Das ausdrücklich gesetzte Pronomen verstärkt das im Verb enthaltene Subjekt; »ihr wisst selbst« bewahrt diese Betonung natürlich.
- source_word: γινώσκετε
  choice: wisst
  rationale: Das Präsens bezeichnet hier die unmittelbare Kenntnis der Zuhörer von Paulus’ Verhalten.
- source_word: ταῖς χρείαις μου
  choice: für meinen Lebensunterhalt
  rationale: χρεία bezeichnet hier im Zusammenhang mit der Arbeit seiner Hände die materiellen Bedürfnisse; »Lebensunterhalt« gibt diesen praktischen Sinn idiomatisch wieder.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: für den meiner Begleiter
  rationale: Die substantivierte Wendung meint diejenigen, die bei Paulus waren. »meine Begleiter« ist knapp und natürlich, ohne ihre genauere Stellung festzulegen; »den« nimmt den Lebensunterhalt auch für sie auf.
- source_word: ὑπηρέτησαν
  choice: gearbeitet haben
  rationale: Das Verb bedeutet dienen oder Hilfe leisten. Mit »diese Hände« und den materiellen Bedürfnissen als Bezug gibt »gearbeitet haben« die konkrete Art dieses Dienstes im Deutschen natürlich wieder, ohne die Versorgungswirkung auszublenden.
- source_word: αἱ χεῖρες αὗται
  choice: diese Hände
  rationale: Die demonstrative Formulierung wird unmittelbar bewahrt und verweist anschaulich auf Paulus’ eigene Handarbeit.
