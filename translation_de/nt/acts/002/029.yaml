id: ACT.2.29
reference: Acts 2:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: de
  text: 'Ihr Männer und Brüder,[a] ich darf freimütig zu euch über den Patriarchen David sprechen: Er ist sowohl gestorben als auch begraben worden, und sein Grab ist bis zum heutigen Tag bei uns.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Männer, Brüder«; eine feierliche doppelte Anrede. Auch möglich: »Brüder«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ihr Männer, Brüder
  rationale: Beide maskulinen Vokative werden bewahrt. Die im Deutschen etwas markierte Doppelanrede spiegelt die feierliche Anrede an die versammelten israelitischen Männer wider.
- source_word: ἐξὸν εἰπεῖν
  choice: ich darf … sprechen
  rationale: Die Wendung bezeichnet Erlaubnis beziehungsweise Freiheit zum Sprechen, nicht bloß die Fähigkeit dazu.
- source_word: μετὰ παρρησίας
  choice: offen
  rationale: παρρησία bezeichnet hier freimütiges, unverhülltes Reden. „Offen“ ist im heutigen Deutsch natürlich und erfasst den Gedanken der freien Rede.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: über den Patriarchen David
  rationale: „Patriarch“ gibt den Titel präzise wieder; ein nicht ausdrücklich vorhandenes „unseren“ wird nicht ergänzt.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: Er ist gestorben und begraben worden
  rationale: Die beiden Tatsachen werden klar und idiomatisch wiedergegeben. Das doppelte καί hebt beide hervor, verlangt im Deutschen aber nicht zwingend „sowohl … als auch“.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: sein Grab
  rationale: μνῆμα bezeichnet hier die bekannte Begräbnisstätte Davids; „Grab“ ist im Deutschen natürlich und sachlich passend.
- source_word: ἔστιν ἐν ἡμῖν
  choice: ist … bei uns
  rationale: Die Formulierung bezeichnet die fortdauernde örtliche Gegenwart der Grabstätte im Lebensraum der Sprecher und Hörer.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: bis zum heutigen Tag
  rationale: Dies ist eine natürliche und genaue Wiedergabe der zeitlichen Wendung.
theological_decisions:
- issue: Geschlechtsgenaue Wiedergabe der doppelten Anrede
  choice: Ihr Männer, Brüder
  alternative: Brüder; Brüder und Schwestern
  rationale: Der griechische Text enthält ausdrücklich die beiden maskulinen Vokative ἄνδρες und ἀδελφοί. Die Hauptübersetzung bewahrt beide, ohne Frauen ausdrücklich in eine grammatisch maskuline Anrede hineinzulesen; die Fußnote erklärt die Funktion der Wendung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Doppelanrede bleibt aus Quelltexttreue erhalten; der übrige Satz ist bewusst flüssig und mündlich verständlich formuliert.
