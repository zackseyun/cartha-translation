id: ACT.2.31
reference: Acts 2:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: de
  text: 'Da er dies voraussah, sprach er über die Auferstehung des Messias[a]: Er wurde weder dem Totenreich überlassen[b], noch sah sein Fleisch Verwesung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Christos, traditionell „Christus“; hier als Titel im Sinn von „Messias“, dem Gesalbten.
    reason: alternative_reading
  - marker: b
    text: 'Auch: „im Totenreich zurückgelassen“. Griechisch Hades; gemeint ist das Reich der Toten, nicht eigens der endgültige Ort des Gerichts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Da er dies voraussah
  rationale: 'Das Aoristpartizip bezeichnet ein vorheriges Erkennen. Die kausale Wiedergabe mit „da“ passt zum Gedankengang: David konnte so sprechen, weil er prophetisch voraussah, was kommen würde. „Dies“ wird aus dem Zusammenhang ergänzt.'
- source_word: ἐλάλησεν περὶ τῆς ἀναστάσεως
  choice: sprach er über die Auferstehung
  rationale: λαλέω wird schlicht mit „sprechen“ wiedergegeben; περί mit Genitiv bedeutet „über, von“. Die Formulierung ist natürlich und bleibt nah an der griechischen Struktur.
- source_word: τοῦ χριστοῦ
  choice: des Messias
  rationale: Χριστός ist hier im Rahmen von Petrus’ Schriftauslegung als Titel des verheißenen Gesalbten gebraucht. „Messias“ macht diesen Titelsinn im modernen Deutschen deutlich.
- source_word: οὔτε ἐγκατελείφθη εἰς ᾅδην
  choice: Er wurde weder dem Totenreich überlassen
  rationale: ἐγκαταλείπω bedeutet „zurücklassen, verlassen, preisgeben“. In Verbindung mit εἰς ᾅδην gibt „dem Totenreich überlassen“ die Zielrichtung wieder und klingt im Deutschen idiomatisch. „Totenreich“ bezeichnet den Bereich der Toten, ohne ihn mit dem endgültigen Strafort gleichzusetzen.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: sein Fleisch
  rationale: σάρξ bezeichnet hier konkret die leibliche Existenz. „Fleisch“ erhält die Ausdrucksweise des Psalmzitats und dessen betont körperlichen Bezug.
- source_word: εἶδεν διαφθοράν
  choice: sah … Verwesung
  rationale: Die bildhafte Wendung „Verwesung sehen“ wird bewahrt. Im Zusammenhang mit dem Fleisch bezeichnet διαφθορά den körperlichen Zerfall.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: In Petrus’ Schriftbeweis steht der Titel des erwarteten Gesalbten im Vordergrund. Die traditionelle Wiedergabe „Christus“ bleibt sachlich möglich und wird in der Fußnote genannt.
- issue: Wiedergabe von ᾅδης
  choice: Totenreich
  alternative: Hades
  rationale: „Totenreich“ vermittelt heutigen deutschen Lesern unmittelbar den Sinn des griechischen Begriffs und vermeidet die irreführende Gleichsetzung mit „Hölle“ als endgültigem Gerichtsort. Die griechische Bezeichnung wird in der Fußnote dokumentiert.
- issue: Verhältnis von εἰς zu ἐγκατελείφθη
  choice: dem Totenreich überlassen
  alternative: im Totenreich zurückgelassen
  rationale: Die gewählte Formulierung bildet die durch εἰς ausgedrückte Zielrichtung ab. Aufgrund der idiomatischen Verbindung mit dem Passiv von ἐγκαταλείπω ist auch eine örtliche Wiedergabe möglich; diese Spannung wird nicht verschwiegen.
- issue: Wiedergabe von σάρξ
  choice: Fleisch
  alternative: Leib
  rationale: Hier liegt kein ethischer Gegensatz zwischen Fleisch und Geist vor, sondern ein konkreter körperlicher Bezug. „Fleisch“ wahrt zugleich die sprachliche Form des Schriftzitats.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt übersichtlich und folgt dem argumentativen Ton der Rede. „Totenreich“ ist verständlicher als die bloße Transliteration „Hades“, während die Fußnote den griechischen Ausdruck und die mögliche örtliche Wiedergabe offenlegt.
