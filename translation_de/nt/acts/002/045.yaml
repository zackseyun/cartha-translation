  source_fidelity: Die Imperfekte ἐπίπρασκον und διεμέριζον werden mit „verkauften immer wieder“ und „verteilten“ angemessen als wiederholte bzw. fortlaufende Praxis wiedergegeben. „Grundstücke“ ist für κτήματα jedoch zu eng, da das Wort zwar häufig Grund- oder Immobilienbesitz, aber allgemeiner erworbene Besitztümer bezeichnen kann. „Das Erlöste“ legt für αὐτά den Verkaufserlös fest, während das griechische Pronomen lediglich auf die zuvor genannten Dinge zurückverweist und die genaue sachliche Referenz offenlässt.
  naturalness: Der Satz ist insgesamt gut verständlich. „Je nachdem, wer etwas nötig hatte“ ist natürliches modernes Deutsch. Die Folge „Grundstücke und Besitz“ wirkt jedoch begrifflich unnötig verengt, und „das Erlöste“ ist eine interpretierende Singularbildung anstelle des pluralischen griechischen Pronomens.
  terminology: „Besitztümer“ und „sonstigen Besitz“ bewahren die Unterscheidung der beiden griechischen Begriffe ohne κτήματα auf Grundstücke zu beschränken. Das unmarkierte „sie“ für αὐτά lässt offen, ob die genannten Güter selbst oder kontextuell deren Verkaufsertrag im Blick ist. Die Formulierung bleibt rein beschreibend und macht keine Aussage über eine verpflichtende Aufhebung privaten Eigentums.
