    rationale: κτήματα kann insbesondere Grundbesitz meinen, bezeichnet aber nicht ausschließlich einzelne Grundstücke. „Besitztümer“ ist weiter und erhält die mögliche Bedeutung von Besitz- bzw. Vermögensgegenständen.
  - severity: medium
    issue: „Das Erlöste“ legt die Referenz von αὐτά stärker fest als der Ausgangstext.
    rationale: Das Pronomen ist formal pluralisch und verweist auf die genannten Güter; dass deren Erlös verteilt wurde, ist kontextuell naheliegend, aber nicht ausdrücklich gesagt. Ein deutsches Pronomen bewahrt diese Offenheit besser.
