source:
  edition: SBLGNT
  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: de
  text: Sie verkauften immer wieder ihre Besitztümer und ihren sonstigen Besitz und verteilten sie[a] an alle, je nachdem, wer etwas nötig hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Pronomen lautet wörtlich „sie“ und kann sich auf die genannten Güter beziehen; dem Zusammenhang nach kann auch das aus ihrem Verkauf Erlangte mitgemeint sein.
    reason: Die Fußnote erläutert die im Ausgangstext vorhandene, im Deutschen mit „sie“ bewahrte Referenzoffenheit.
lexical_decisions:
- source_word: κτήματα
  choice: Grundstücke
  rationale: Der Ausdruck bezeichnet erworbenen Besitz, häufig Land- oder Immobilienbesitz. „Grundstücke“ wahrt im Deutschen die wahrscheinliche Unterscheidung zum allgemeineren ὑπάρξεις.
- source_word: ὑπάρξεις
  choice: Besitz
  rationale: Der Ausdruck bezeichnet vorhandene Güter beziehungsweise das, was jemand besitzt. „Besitz“ ist natürlich und bleibt gegenüber „Grundstücke“ weiter gefasst.
- source_word: ἐπίπρασκον
  choice: verkauften immer wieder
  rationale: Der Imperfekt stellt das Verkaufen als fortlaufende oder wiederholte Handlung dar; „immer wieder“ macht diesen Aspekt im Deutschen deutlich.
- source_word: διεμέριζον
  choice: verteilten
  rationale: Das Verb bezeichnet hier das Aufteilen beziehungsweise Zuweisen innerhalb der Gemeinschaft. „Verteilten“ ist idiomatisch und legt den genauen Vorgang nicht unnötig fest.
- source_word: αὐτά
  choice: das Erlöste
  rationale: Das Pronomen verweist formal auf die genannten Güter, sachlich aber wahrscheinlich auf das durch ihren Verkauf Erlangte. Die Fußnote hält die wörtlichere Bezugsmöglichkeit offen.
- source_word: πᾶσιν
  choice: an alle
  rationale: Der Dativ bezeichnet die Empfänger allgemein im gemeinschaftlichen Kontext; „an alle“ gibt dies knapp wieder.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: je nachdem, wer etwas nötig hatte
  rationale: Die Formulierung bewahrt den unbestimmten individuellen Bezug und drückt aus, dass sich die Verteilung nach dem jeweiligen Bedarf richtete.
theological_decisions:
- issue: Art der Gütergemeinschaft der Glaubenden
  choice: Der Vers beschreibt ein fortlaufendes beziehungsweise wiederholtes Verkaufen und bedarfsorientiertes Verteilen.
  alternative: Der Vers fordert ausdrücklich die vollständige und dauerhafte Abschaffung jedes Privateigentums für alle Christen.
  rationale: Die Imperfektformen beschreiben eine wiederholte Praxis; der Vers formuliert jedoch weder ausdrücklich eine universale Vorschrift noch die vollständige Aufhebung privaten Eigentums. Die Übersetzung bleibt deshalb beschreibend und lässt die theologische Spannung bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Immer wieder“ bildet den imperfektiven Aspekt sichtbar ab; „etwas nötig hatte“ ist natürlich und vermeidet unnötig abstrakte Sprache.
