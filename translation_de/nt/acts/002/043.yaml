  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: de
  text: Und Furcht kam über alle[a], und durch die Apostel geschahen viele Wunder und Zeichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über jede Seele“; auch: „Schauder/Staunen ergriff alle“.'
    reason: Die Fußnote dokumentiert die bildhafte griechische Formulierung und weist auf den Bedeutungsbereich von φόβος hin, ohne ihn als ausschließlich ehrfürchtige Reaktion festzulegen.
lexical_decisions:
- source_word: Ἐγίνετο δὲ ... φόβος
  choice: Da kam Furcht
  rationale: Das Imperfekt von γίνομαι mit φόβος beschreibt hier das Aufkommen beziehungsweise Fortbestehen einer Reaktion. „Da kam Furcht“ gibt den erzählerischen Anschluss und die entstehende Wirkung natürlich wieder, ohne einen starken Gegensatz in δέ hineinzulesen.
- source_word: πάσῃ ψυχῇ
  choice: über jeden Menschen
  rationale: Wörtlich steht „über jede Seele“. Im Deutschen bezeichnet „jeden Menschen“ idiomatisch jede einzelne Person und vermeidet den möglichen Eindruck, nur ein vom Menschen abtrennbarer Seelenteil sei gemeint; die Bildhaftigkeit des griechischen Ausdrucks wird in der Fußnote dokumentiert.
- source_word: φόβος
  choice: Furcht
  rationale: φόβος kann sowohl Furcht als auch ehrfürchtiges Staunen bezeichnen. „Furcht“ ist die direkte Entsprechung und bewahrt die Spannung, ohne die Reaktion ausschließlich als positive Ehrfurcht auszulegen.
- source_word: πολλά τε τέρατα καὶ σημεῖα
  choice: viele Wunder und Zeichen
  rationale: „Wunder“ gibt den Staunen erregenden Charakter von τέρατα wieder, während „Zeichen“ die hinweisende Bedeutung von σημεῖα wahrt. Die geläufige Paarung hält beide Aspekte auseinander.
- source_word: διὰ τῶν ἀποστόλων
  choice: durch die Apostel
  rationale: διά mit Genitiv bezeichnet vermittelnde Urheberschaft beziehungsweise Instrumentalität. „Durch die Apostel“ lässt offen, beziehungsweise legt nahe, dass sie die menschlichen Vermittler und nicht zwingend die letztgültigen Urheber sind.
- source_word: ἐγίνετο
  choice: geschahen
  rationale: Beim zweiten Vorkommen bezeichnet γίνομαι das wiederholte oder fortdauernde Geschehen der Wunder und Zeichen. Das deutsche Imperfekt „geschahen“ ist natürlich und bewahrt den Ereignischarakter, ohne eine im Griechischen nicht ausdrücklich vorhandene Passivform einzuführen.
theological_decisions:
- issue: Bedeutungsumfang von φόβος als Reaktion auf das Wirken Gottes
  choice: Furcht
  alternative: Ehrfurcht / ehrfürchtiges Staunen
  rationale: „Furcht“ bewahrt die mögliche Spannung zwischen Erschrecken und ehrfürchtigem Staunen. Eine Festlegung auf „Ehrfurcht“ würde die Mehrdeutigkeit des griechischen Wortes interpretierend verengen.
- issue: Urheberschaft der Wunder und Zeichen
  choice: durch die Apostel
  alternative: von den Aposteln
  rationale: Die Formulierung mit „durch“ entspricht διά mit Genitiv und bewahrt die Unterscheidung zwischen den Aposteln als Vermittlern und Gott als implizitem letztgültigem Urheber.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die traditionelle Wortpaarung „Wunder und Zeichen“ bleibt erhalten. Die Fußnote wahrt sowohl die wörtliche Ausdrucksweise als auch die echte Bedeutungsbreite von φόβος.
