  to: Und Furcht kam über alle[a], und durch die Apostel geschahen viele Wunder und Zeichen.
  rationale: Die Revision glättet zwei geringfügige stilistische Unebenheiten und bewahrt dabei die Aussage, die erzählerische Offenheit von δέ und die semantische Spannung von φόβος. Die Ankerstruktur bleibt unverändert.
