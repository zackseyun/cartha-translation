    issue: „Da“ für δέ
    rationale: δέ führt hier vor allem den Erzählzusammenhang fort. „Da“ kann eine stärker markierte zeitliche Folge nahelegen, die nicht erforderlich ist.
  - severity: low
    issue: „über jeden Menschen“ ist stilistisch schwerfällig
    rationale: Die griechische Wendung „über jede Seele“ meint idiomatisch alle Personen. „über alle“ gibt dies im Deutschen natürlicher wieder, ohne den Sinn einzuengen.
  - severity: low
    issue: Fußnotenalternative „Ehrfurcht“ verengt die Nuance
    rationale: φόβος kann angesichts außergewöhnlicher Ereignisse Furcht und erschüttertes Staunen umfassen. „Ehrfurcht“ ist möglich, lenkt aber stärker zu einer positiven religiösen Auslegung als „Schauder“ oder „Staunen“.
