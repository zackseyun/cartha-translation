  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: de
  text: Und sie wurden alle mit dem Heiligen Geist erfüllt und begannen, in anderen Sprachen[a] zu sprechen, wie der Geist ihnen gab auszusprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in anderen Zungen«. Das griechische Wort kann sowohl »Zungen« als auch »Sprachen« bedeuten; der folgende Zusammenhang zeigt, dass die Zuhörer die Rede als wirkliche menschliche Sprachen verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: wurden erfüllt
  rationale: Der Aorist Passiv von πίμπλημι bezeichnet hier das Erfülltwerden mit dem Geist; die deutsche Wendung ist natürlich und bewahrt die passive Form.
- source_word: πάντες
  choice: alle
  rationale: Gibt die ausdrücklich betonte Gesamtheit der anwesenden Gruppe knapp und genau wieder.
- source_word: πνεύματος ἁγίου
  choice: mit dem Heiligen Geist
  rationale: Der artikellose griechische Ausdruck bezeichnet im Kontext von Apostelgeschichte 2 den bestimmten göttlichen Geist; im Deutschen verlangt die idiomatische Verbindung den Artikel.
- source_word: ἤρξαντο λαλεῖν
  choice: begannen … zu reden
  rationale: Bewahrt den einsetzenden Charakter der Handlung und klingt in modernem Standarddeutsch natürlich.
- source_word: ἑτέραις γλώσσαις
  choice: in anderen Sprachen[a]
  rationale: γλῶσσα kann sowohl Zunge als auch Sprache bezeichnen. Im Deutschen würde „Zungen“ leicht bereits eine besondere religiöse Deutung nahelegen; „Sprachen“ ist angesichts von Apostelgeschichte 2,6–11 die natürliche kontextuelle Wiedergabe, während die Fußnote die lexikalische Alternative offenlegt.
- source_word: καθὼς
  choice: so, wie
  rationale: Kennzeichnet die Weise beziehungsweise Maßgabe ihres Redens in klarem Deutsch.
- source_word: ἐδίδου
  choice: gab … ein
  rationale: Das Imperfekt beschreibt die fortlaufende Befähigung durch den Geist. Die deutsche idiomatische Wendung gibt den Sinn von „gewähren/geben“ im Zusammenhang mit hervorgebrachter Rede wieder.
- source_word: ἀποφθέγγεσθαι
  choice: es … eingab
  rationale: Das Verb bezeichnet ein vernehmliches, hervorgebrachtes Sprechen. Die idiomatische Gesamtkonstruktion vermeidet das unnatürliche „ihnen das Aussprechen gab“, ohne den Inhalt als Prophetie oder als vorformulierte Worte näher zu bestimmen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Gibt den Dativ als Empfänger der vom Geist gewährten Sprechbefähigung wieder.
theological_decisions:
- issue: Ob πνεύματος ἁγίου persönlich-bestimmt oder als unbestimmter „heiliger Geist“ wiederzugeben ist.
  choice: mit dem Heiligen Geist
  alternative: mit heiligem Geist
  rationale: Der folgende Satzteil nennt den Geist als handelndes Gegenüber, und der Zusammenhang identifiziert ihn mit dem zuvor verheißenen göttlichen Geist. Die bestimmte, großgeschriebene Form gibt diesen Erzählzusammenhang wieder, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
- issue: Ob γλώσσαις mit „Zungen“ oder „Sprachen“ wiederzugeben ist.
  choice: in anderen Sprachen[a]
  alternative: in anderen Zungen
  rationale: Das griechische Wort lässt beide Wiedergaben zu. Der unmittelbar folgende Bericht schildert, dass die Zuhörer ihre jeweiligen Sprachen erkannten. „Sprachen“ ist daher im Deutschen kontextuell klarer und weniger konfessionell vorgeprägt; die Fußnote bewahrt die lexikalische Offenheit des Einzelwortes.
- issue: Wie die vom Geist gewährte Rede in ἀποφθέγγεσθαι zu charakterisieren ist.
  choice: wie der Geist es ihnen eingab
  alternative: wie der Geist ihnen auszusprechen gab
  rationale: Die gewählte Form bezeichnet eine vom Geist ermöglichte Äußerung, ohne sie enger als Prophetie, Ekstase oder bloße Aussprache zu bestimmen. Die Alternative wäre formnäher, im heutigen Deutsch jedoch schwerfällig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In anderen Sprachen“ vermeidet die im heutigen religiösen Sprachgebrauch vorgeprägte Wendung „in anderen Zungen“; die Fußnote hält die wörtlichere Alternative sichtbar. „Der Geist es ihnen eingab“ ist idiomatischer als eine formale Nachbildung mit „aussprechen“, ohne die geistgewirkte Befähigung inhaltlich näher festzulegen.
