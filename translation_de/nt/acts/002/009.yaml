  variant: modern standard German
source:
  edition: SBLGNT
  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: de
  text: Parther und Meder und Elamiter sowie die Bewohner Mesopotamiens, Judäas und Kappadoziens[b], des Pontus und Asiens[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die römische Provinz Asien im Westen Kleinasiens, nicht der heutige Kontinent.
    reason: cultural_note
  - marker: b
    text: Die griechische Verbindung τε καί kann hier einfach mit „und“ oder mit leicht ergänzendem Sinn („sowie“) wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται
  choice: Parther und Meder und Elamiter
  rationale: Die gebräuchlichen deutschen Volksnamen geben die drei Ethnonyme wieder; das wiederholte „und“ bewahrt den aufzählenden Rhythmus des Griechischen.
- source_word: οἱ κατοικοῦντες
  choice: die Bewohner
  rationale: Das substantivierte Präsenspartizip bezeichnet die Menschen, die in den anschließend genannten Gebieten wohnen. „Die Bewohner“ ist knappes, natürliches Standarddeutsch.
- source_word: τὴν Μεσοποταμίαν
  choice: Mesopotamiens
  rationale: Der etablierte deutsche Gebietsname wird in die natürliche Genitivkonstruktion mit „Bewohner“ eingebunden.
- source_word: Ἰουδαίαν
  choice: Judäas
  rationale: „Judäa“ ist die geläufige deutsche Bezeichnung der Region; der Genitiv erhält die geografische Aussage.
- source_word: τε καὶ
  choice: und
  rationale: Die Verbindung verknüpft Judäa und Kappadozien, möglicherweise mit leicht ergänzendem Nachdruck. Im Deutschen ist „und“ hier am natürlichsten; die Nuance wird in einer Fußnote festgehalten.
- source_word: Καππαδοκίαν
  choice: Kappadoziens
  rationale: Gebräuchliche deutsche Form des antiken Gebietsnamens.
- source_word: Πόντον
  choice: des Pontus
  rationale: „Pontus“ ist die etablierte deutsche Form; der Artikel macht den Genitiv in der Aufzählung klar und idiomatisch.
- source_word: τὴν Ἀσίαν
  choice: Asiens
  rationale: Die vertraute deutsche Namensform bleibt im Haupttext erhalten; eine Fußnote erklärt, dass die römische Provinz und nicht der heutige Kontinent gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „und“ am Versanfang folgt bewusst dem griechischen Aufzählungsstil; bei den Ortsnamen sorgt die Genitivkonstruktion für flüssiges Deutsch. Das abschließende Komma bleibt erhalten, weil der Satz im folgenden Vers weitergeht.
