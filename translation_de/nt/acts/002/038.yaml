  source_fidelity: Der deutsche Text gibt die Imperative Μετανοήσατε und βαπτισθήτω sowie die distributive Singularform ἕκαστος ὑμῶν zuverlässig wieder. „auf den Namen Jesu, des Messias“ ist im deutschen Taufsprachgebrauch eine tragfähige, bewusst nicht weiter spezifizierende Wiedergabe von ἐπὶ τῷ ὀνόματι. „zur Vergebung eurer Sünden“ entspricht εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν unmittelbar und lässt die umstrittene Verhältnisbestimmung offen. Die Zukunftsverheißung und „Gabe des Heiligen Geistes“ sind vollständig und treffend wiedergegeben.
  naturalness: Modernes Standarddeutsch mit angemessen würdigem, aber nicht archaischem Register. „Kehrt um“ ist klar und idiomatisch; „jeder von euch lasse sich … taufen“ bewahrt die griechische Verteilung und ist zugleich flüssig. Die Apposition „Jesu, des Messias“ ist grammatisch und stilistisch gut verständlich.
  terminology: „Messias“ gibt die hier aktive Titelfunktion von Χριστός sachgerecht wieder. „Heiliger Geist“, „Vergebung“ und „Gabe“ sind etablierte, theologisch belastbare deutsche Begriffe. Die Fußnote nennt „Jesu Christi“ zutreffend als traditionelle alternative Wiedergabe, ohne den Sinngehalt des Titels zu verdecken.
