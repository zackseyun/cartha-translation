source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: de
  text: 'Petrus sagte zu ihnen: „Kehrt um, und jeder von euch lasse sich auf den Namen Jesu, des Messias,[a] taufen zur Vergebung eurer Sünden.[b] Und ihr werdet die Gabe des Heiligen Geistes empfangen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesu Christi“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“; im Deutschen kann es hier auch traditionell mit „Christus“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: „Zur Vergebung eurer Sünden“ gibt die griechische Wendung unmittelbar wieder. Wie die Taufe hier zur Vergebung in Beziehung steht, wird unterschiedlich verstanden; die Übersetzung entscheidet diese Frage nicht über den Wortlaut hinaus.
    reason: theological_tension
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Kehrt um
  rationale: Der Aorist-Imperativ Plural ruft zu einer entschiedenen Umkehr auf. „Kehrt um“ ist gegenwärtiges, verständliches Deutsch und bewahrt sowohl die innere Neuorientierung als auch die praktische Abkehr vom bisherigen Weg.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: jeder von euch lasse sich … taufen
  rationale: Die Formulierung gibt den passiven Imperativ in der dritten Person Singular und die verteilende Bedeutung von ἕκαστος innerhalb der angesprochenen Gruppe natürlich wieder.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: auf den Namen
  rationale: „Auf den Namen“ entspricht der Präposition ἐπί mit Dativ und ist im deutschen Taufzusammenhang geläufig. Die Wendung legt nicht einseitig fest, ob Grundlage, Autorität oder Bekenntnis im Vordergrund steht.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός hat in der messianischen Verkündigung von Apostelgeschichte 2 deutlich Titelfunktion. „Messias“ bewahrt diese Bedeutung; die Genitiv-Apposition ergibt im Deutschen eine würdige und genaue Formulierung.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: zur Vergebung eurer Sünden
  rationale: Die Formulierung gibt εἰς ἄφεσιν knapp und unmittelbar wieder, behält den Plural „Sünden“ bei und entscheidet nicht über die näher zu bestimmende Beziehung zwischen Taufe und Vergebung.
- source_word: λήμψεσθε τὴν δωρεὰν
  choice: ihr werdet die Gabe … empfangen
  rationale: Der Futur-Indikativ wird als klare Verheißung wiedergegeben; „Gabe“ ist die natürliche Entsprechung von δωρεά.
- source_word: τοῦ ἁγίου πνεύματος
  choice: des Heiligen Geistes
  rationale: Dies ist die übliche moderne deutsche Wiedergabe und bewahrt das theologische Gewicht des Ausdrucks.
theological_decisions:
- issue: Verhältnis von Taufe und Sündenvergebung in εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: „zur Vergebung eurer Sünden“ ohne deutenden Zusatz
  alternative: „damit euch eure Sünden vergeben werden“ oder „wegen der Vergebung eurer Sünden“
  rationale: Die direkte Formulierung bewahrt die theologische Spannung des griechischen Textes und legt weder eine bestimmte sakramentale Wirksamkeit noch eine rein symbolische oder rückbezügliche Deutung fest.
- issue: Wiedergabe von Χριστοῦ
  choice: „des Messias“
  alternative: „Christi“
  rationale: Im unmittelbaren Kontext von Petrus’ Verkündigung ist Χριστός als messianischer Titel erkennbar. „Messias“ macht den Titelgehalt für heutige Leser sichtbar, während „Christus“ als traditionelle Alternative in der Fußnote genannt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Kehrt um“ vermeidet das heute teils missverständliche oder altertümlich wirkende „Tut Buße“. Die Satzstruktur bleibt eng am griechischen Gedankengang.
