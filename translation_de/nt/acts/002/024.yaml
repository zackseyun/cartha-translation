id: ACT.2.24
reference: Acts 2:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: de
  text: Ihn hat Gott auferweckt, indem er die Wehen des Todes löste[a]; denn es war unmöglich, dass er vom Tod festgehalten wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet besonders Geburtswehen, kann aber auch heftige Schmerzen oder Qualen meinen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich „von ihm“; das Pronomen bezieht sich am natürlichsten auf den Tod: Der Tod konnte ihn nicht festhalten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: Ihn
  rationale: Das Relativpronomen nimmt Jesus aus dem vorhergehenden Vers wieder auf. Im Deutschen ergibt ein selbstständiger Satz mit „Ihn“ einen natürlichen Anschluss und bewahrt zugleich die Hervorhebung des Objekts.
- source_word: ἀνέστησεν
  choice: hat auferweckt
  rationale: Das Verb bezeichnet hier Gottes Handeln, durch das Jesus von den Toten auferstand. „Auferweckt“ ist im Deutschen klar, geläufig und weniger missverständlich als das bloße „aufgerichtet“.
- source_word: λύσας
  choice: indem er … löste
  rationale: Das Aoristpartizip kann die Art und Weise beziehungsweise die begleitende Handlung ausdrücken. „Indem“ macht diesen Zusammenhang in natürlichem Deutsch deutlich, während „löste“ das konkrete Bild des Lösens bewahrt.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: die Wehen des Todes
  rationale: ὠδῖνες bezeichnet besonders Geburtswehen, kann aber auch heftige Schmerzen oder Qualen meinen. „Wehen des Todes“ erhält das auffällige griechische Bild, ohne es auf eine einzige Deutung zu verengen.
- source_word: καθότι
  choice: denn
  rationale: Die Konjunktion führt die Begründung für Gottes Handeln ein. „Denn“ verbindet die Aussagen in gehobenem, aber gegenwärtigem Deutsch natürlich.
- source_word: οὐκ ἦν δυνατὸν
  choice: es war unmöglich
  rationale: Die unpersönliche Konstruktion wird knapp und idiomatisch wiedergegeben; sie bewahrt die uneingeschränkte Aussage des griechischen Textes.
- source_word: κρατεῖσθαι
  choice: festgehalten wurde
  rationale: Das Passiv von κρατέω bezeichnet hier das Festhalten beziehungsweise In-der-Gewalt-Behalten. „Festgehalten“ erhält dieses Bild ohne erklärende Erweiterung.
- source_word: ὑπ’ αὐτοῦ
  choice: vom Tod
  rationale: Das maskuline Pronomen bezieht sich syntaktisch und inhaltlich am natürlichsten auf den unmittelbar zuvor genannten Tod. Die Wiederaufnahme des Substantivs ist im Deutschen klarer als „von ihm“; die wörtliche Pronomenform wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Bezug von ὑπ’ αὐτοῦ
  choice: 'Das Pronomen wird im Haupttext auf den Tod bezogen: „vom Tod“.'
  alternative: Wörtlich „von ihm“; formal könnte ein anderer maskuliner Bezug erwogen werden.
  rationale: θάνατος ist der nächste passende Bezug, und der Satz erklärt, dass der Tod Jesus nicht festhalten konnte. Die klare deutsche Wiedergabe folgt diesem natürlichen Zusammenhang, während die Fußnote die Form des griechischen Textes offenlegt.
- issue: Bedeutung von ὠδῖνας
  choice: „Wehen“ im Haupttext
  alternative: „Schmerzen“, „Qualen“ oder „Geburtswehen“
  rationale: Das griechische Wort trägt die konkrete Bedeutung von Geburtswehen, kann jedoch weiter schwere Schmerzen bezeichnen. „Wehen“ wahrt das ungewöhnliche Bild und seine mögliche intertextuelle Spannung, statt es zu einer abstrakten Aussage über Todesqualen zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung „Ihn hat Gott“ bewahrt die Hervorhebung des griechischen Relativobjekts. Das markante Bild „die Wehen des Todes lösen“ bleibt bewusst stehen; die Fußnote erläutert seine lexikalische Spannweite.
