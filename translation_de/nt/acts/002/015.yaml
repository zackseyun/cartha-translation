source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: de
  text: Denn diese sind nicht betrunken, wie ihr meint, denn es ist die dritte Stunde des Tages.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das entspricht nach damaliger jüdischer Zeitrechnung etwa neun Uhr morgens.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn ... nicht
  rationale: γάρ knüpft erklärend an den vorherigen Vers an; „denn“ bewahrt den argumentativen Zusammenhang, während „nicht“ die Verneinung wiedergibt.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: wie ihr meint
  rationale: ὑπολαμβάνω bezeichnet hier ein Meinen oder Annehmen. „Wie ihr meint“ ist natürliches modernes Deutsch und erhält die direkte Anrede.
- source_word: οὗτοι
  choice: diese
  rationale: Das Demonstrativpronomen verweist unmittelbar auf die beschuldigte Gruppe, ohne mit „Männer“ oder „Leute“ eine im Griechischen nicht ausdrücklich genannte Bezeichnung hinzuzufügen.
- source_word: μεθύουσιν
  choice: sind betrunken
  rationale: Der Präsens Indikativ beschreibt im Zusammenhang den unterstellten Zustand der Trunkenheit; „sind betrunken“ ist die natürliche deutsche Entsprechung.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: es ist ja erst die dritte Stunde des Tages
  rationale: Das zweite γάρ begründet die Zurückweisung des Vorwurfs und wird idiomatisch mit „ja“ ausgedrückt. „Erst“ macht die im Argument implizierte frühe Tageszeit deutlich, ohne die antike Zeitangabe im Haupttext zu ersetzen.
- source_word: ὥρα τρίτη
  choice: die dritte Stunde
  rationale: Die antike jüdische Zeitangabe bleibt im Haupttext erhalten; ihre ungefähre heutige Entsprechung wird in der Fußnote erklärt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt nah an der griechischen Argumentationsfolge; das doppelte γάρ wird ohne schwerfällige Wiederholung durch „denn“ und „ja“ wiedergegeben.
