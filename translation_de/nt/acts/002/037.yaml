  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: de
  text: 'Als sie das hörten, traf es sie ins Herz[a], und sie sagten zu Petrus und den übrigen Aposteln: »Was sollen wir tun, Brüder[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es ging ihnen durchs Herz.« Der griechische Ausdruck beschreibt ein scharfes inneres Getroffenwerden, etwa tiefe Erschütterung oder Bedrängnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Männer, Brüder«. Dies ist eine herkömmliche Anrede; je nach Zusammenhang kann sie einfach »Brüder« bedeuten oder sich an eine ganze Gruppe richten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Als sie das hörten
  rationale: Das Aoristpartizip leitet die Reaktion auf die vorangehende Rede des Petrus ein. Das im Deutschen ergänzte »das« ergibt sich unmittelbar aus dem Kontext. δέ markiert hier vor allem den Fortgang der Erzählung und braucht keine eigene Wiedergabe.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: wurden sie ins Herz getroffen
  rationale: Die Formulierung bewahrt das griechische Bild eines scharfen inneren Getroffenwerdens und lässt offen, ob dabei vor allem Überführung, Erschütterung oder Bedrängnis gemeint ist.
- source_word: εἶπόν τε
  choice: und sagten
  rationale: τε verbindet die Äußerung eng mit der vorherigen Reaktion. »Sagten« übersetzt λέγω direkt, ohne die Frage vorwegnehmend als »fragten« zu deuten.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: zu Petrus und den übrigen Aposteln
  rationale: »Die übrigen Apostel« gibt λοιπούς präzise wieder und unterscheidet Petrus von den anderen Aposteln, ohne ihn aus deren Kreis herauszulösen.
- source_word: Τί ποιήσωμεν
  choice: Was sollen wir tun
  rationale: Der deliberative Aorist Konjunktiv erfragt den gebotenen weiteren Weg. »Was sollen wir tun?« ist dafür die natürliche heutige deutsche Formulierung.
- source_word: ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: »Brüder« bewahrt die familiäre Anrede ἀδελφοί und vermeidet die im Deutschen unnatürliche Doppelung »Männer, Brüder«. Die ausdrücklich männliche Form und eine mögliche weiter gefasste Anredefunktion werden in der Fußnote erläutert.
theological_decisions:
- issue: Reichweite der männlichen Anrede ἄνδρες ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern; ihr Männer, Brüder
  rationale: Der Haupttext bewahrt die grammatisch männliche Anrede, ohne stillschweigend eine inklusive Form einzusetzen. Da eine solche konventionelle Gruppenanrede je nach Kontext auch repräsentativ gebraucht sein kann, wird diese Möglichkeit in der Fußnote offengehalten.
- issue: Art der inneren Reaktion
  choice: ins Herz getroffen
  alternative: tief im Herzen erschüttert; ins Herz geschnitten
  rationale: Das Bild des Durchbohrens beziehungsweise scharfen Getroffenwerdens bleibt erhalten. Die Übersetzung legt nicht fest, ob der Schwerpunkt theologisch auf Schuldüberführung oder psychologisch auf Erschütterung und Bedrängnis liegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Metapher des griechischen Textes bleibt erhalten; unnatürliche Wörtlichkeit und konfessionell festgelegte Deutungen werden vermieden.
