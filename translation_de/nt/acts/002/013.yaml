  text: ἕτεροι δὲ ⸀διαχλευάζοντες ἔλεγον ὅτι Γλεύκους μεμεστωμένοι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: de
  text: 'Andere aber spotteten und sagten: »Sie sind voll von süßem Wein.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »neuem Wein«. Das griechische Wort bezeichnet süßen, frischen Wein beziehungsweise Most.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: Andere
  rationale: Das substantivierte Adjektiv bezeichnet eine andere Gruppe innerhalb der Menge; »Andere« ist im Deutschen knapp und natürlich.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier den Gegensatz zur vorausgehenden Reaktion.
- source_word: διαχλευάζοντες
  choice: spotteten
  rationale: Das Partizip bezeichnet höhnisches Verspotten. Die finite Beiordnung klingt im Deutschen natürlich und bewahrt den begleitenden Charakter der Handlung.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der Imperfekt beschreibt ein andauerndes beziehungsweise wiederholtes Reden. Im Zusammenhang gibt das deutsche Präteritum dies ausreichend wieder, ohne unnatürlich schwer zu wirken.
- source_word: ὅτι
  choice: direkte Rede
  rationale: ὅτι leitet hier den Inhalt ihrer Äußerung ein; eine direkte Rede ist im Deutschen idiomatisch und entspricht dem Sinn.
- source_word: Γλεύκους
  choice: süßem Wein
  rationale: γλεῦκος bezeichnet süßen, frischen Wein beziehungsweise Most. »Süßer Wein« ist verständlich und lexikalisch genauer als das möglicherweise nur zeitlich verstandene »neuer Wein«.
- source_word: μεμεστωμένοι εἰσίν
  choice: Sie sind voll
  rationale: Die periphrastische Perfektkonstruktion bezeichnet den bestehenden Zustand, mit dem Getränk angefüllt zu sein; »voll von« bewahrt zudem die Anspielung auf Trunkenheit.
