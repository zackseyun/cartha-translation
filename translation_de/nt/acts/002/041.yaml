id: ACT.2.41
reference: Acts 2:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: de
  text: So wurden diejenigen, die sein Wort annahmen, getauft, und an jenem Tag kamen etwa dreitausend Seelen[a] hinzu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Menschen oder Personen. Das griechische Wort für »Seelen« bezeichnet hier Menschen, die gezählt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: So wurden diejenigen, die
  rationale: „So“ gibt den folgernden und zugleich erzählerisch weiterführenden Charakter der Partikelverbindung natürlich wieder; „diejenigen, die“ bildet das substantivierte Partizip verständlich ab.
- source_word: ἀποδεξάμενοι
  choice: annahmen
  rationale: Das Verb bezeichnet die positive Aufnahme der verkündeten Botschaft. „Annahmen“ wahrt diese Zustimmung, ohne zusätzliche Vorstellungen über Art oder Tiefe der Reaktion einzutragen.
- source_word: τὸν λόγον αὐτοῦ
  choice: sein Wort
  rationale: Gemeint ist die von Petrus verkündete Botschaft. „Sein Wort“ bleibt eng am griechischen Ausdruck und ist im Kontext verständlich; „seine Botschaft“ wäre eine mögliche freiere Wiedergabe.
- source_word: ἐβαπτίσθησαν
  choice: wurden getauft
  rationale: Die passive Aoristform wird direkt und ereignisbezogen wiedergegeben, ohne Aussagen über Taufweise oder Taufwirkung hinzuzufügen.
- source_word: προσετέθησαν
  choice: kamen hinzu
  rationale: Die Form bezeichnet das Hinzukommen beziehungsweise die Eingliederung weiterer Menschen. „Kamen hinzu“ ist im Deutschen natürlich und lässt das im Vers nicht ausdrücklich genannte Bezugsobjekt offen.
- source_word: ψυχαὶ
  choice: Seelen
  rationale: „Seelen“ bildet den griechischen Ausdruck formal ab. Da das Wort hier Menschen als gezählte Personen bezeichnet und nicht zwingend eine anthropologische Aussage macht, wird dies in einer Fußnote erläutert.
- source_word: ὡσεὶ τρισχίλιαι
  choice: etwa dreitausend
  rationale: „Etwa“ gibt die durch ὡσεί bezeichnete ungefähre Zahl knapp und idiomatisch wieder.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der temporalen Wendung und bewahrt den Rückbezug auf den berichteten Pfingsttag.
theological_decisions:
- issue: Bezugsobjekt von „kamen hinzu“
  choice: Das Bezugsobjekt bleibt unausgesprochen.
  alternative: „wurden ihnen hinzugefügt“ oder „kamen zur Gemeinde hinzu“
  rationale: Der Zusammenhang legt die Gemeinschaft der Glaubenden nahe, doch der griechische Vers nennt sie an dieser Stelle nicht ausdrücklich. Die Übersetzung vermeidet daher eine weitergehende ekklesiologische Präzisierung.
- issue: Anthropologische Bedeutung von ψυχαί
  choice: „Seelen“ im Haupttext mit erklärender Fußnote
  alternative: „Menschen“ oder „Personen“ direkt im Haupttext
  rationale: Die formale Entsprechung bewahrt die Ausdrucksweise des Ausgangstextes. Die Fußnote verhindert zugleich, dass „Seelen“ unnötig als technische Aussage über einen immateriellen Teil des Menschen verstanden wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfügung bleibt nah am griechischen Gedankengang, ohne unnatürliche griechische Wortstellung nachzuahmen.
