  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: de
  text: Diesen Mann, der nach dem festgelegten Plan und Vorherwissen Gottes ausgeliefert worden war, habt ihr getötet, indem ihr ihn durch die Hand von gesetzlosen Menschen ans Kreuz genagelt habt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zu Tode gebracht. Im Griechischen steht „durch die Hand“ im Singular; auch möglich: „durch die Hände gesetzloser Menschen“ oder sinngemäß „mithilfe gesetzloser Menschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: diesen Mann
  rationale: Das Akkusativ-Demonstrativpronomen verweist in der Rede des Petrus nachdrücklich auf Jesus. „Diesen Mann“ ist im Deutschen natürlich und bewahrt den hinweisenden Charakter.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: nach dem festgelegten Plan
  rationale: Der Dativ bezeichnet hier Maßgabe oder Grundlage. ὡρισμένῃ bezeichnet etwas Festgelegtes oder Bestimmtes, βουλή einen Plan, Beschluss oder Ratschluss. „Festgelegter Plan“ ist klar und gibt die göttliche Absicht wieder, ohne altertümlich zu klingen.
- source_word: καὶ προγνώσει
  choice: und Vorherwissen
  rationale: πρόγνωσις bezeichnet das Wissen im Voraus. „Vorherwissen“ ist präzise und lässt das Verhältnis zum festgelegten Plan offen, statt es systematisch auszudeuten.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv bezieht sich sowohl auf den festgelegten Plan als auch auf das Vorherwissen.
- source_word: ἔκδοτον
  choice: ausgeliefert worden war
  rationale: Das Verbaladjektiv bezeichnet jemanden, der übergeben oder ausgeliefert wurde. Die Relativsatzkonstruktion ergibt einen natürlichen deutschen Satz und erhält den passiven Sinn, ohne einen im Ausdruck nicht genannten unmittelbaren Handelnden einzusetzen.
- source_word: διὰ χειρὸς ἀνόμων
  choice: durch die Hand gesetzloser Menschen
  rationale: διά mit Genitiv bezeichnet vermittelte Handlung oder Urheberschaft. Die Einzahl „Hand“ folgt dem griechischen Ausdruck; „gesetzlos“ bewahrt die mögliche Beziehung zum Gesetz und reduziert den Ausdruck nicht allgemein auf „böse“.
- source_word: προσπήξαντες
  choice: ans Kreuz geschlagen
  rationale: Das Partizip bedeutet befestigen oder annageln. Im Hinrichtungskontext ist „ans Kreuz geschlagen“ eine natürliche und historisch klare Wiedergabe.
- source_word: ἀνείλατε
  choice: habt ihr … getötet
  rationale: ἀναιρέω bedeutet hier töten beziehungsweise zu Tode bringen. „Getötet“ bewahrt die direkte Anklage des Petrus.
theological_decisions:
- issue: Verhältnis von Gottes bestimmtem Plan und menschlicher Verantwortung
  choice: Sowohl Gottes festgelegter Plan und sein Vorherwissen als auch die verantwortliche Tat der Angeredeten werden ausdrücklich wiedergegeben.
  alternative: Entweder die göttliche Festlegung abzuschwächen oder die Verantwortung allein den gesetzlosen Menschen zuzuschreiben.
  rationale: 'Der griechische Text stellt beides nebeneinander: Jesus wurde nach Gottes festgelegtem Plan und Vorherwissen ausgeliefert, zugleich sagt Petrus zu seinen Zuhörern: „ihr … habt … getötet“. Die Übersetzung bewahrt diese Spannung, ohne sie zugunsten eines theologischen Systems aufzulösen.'
- issue: Bedeutungsumfang von ἀνόμων
  choice: gesetzloser Menschen
  alternative: böser Menschen oder Menschen ohne das Gesetz
  rationale: „Gesetzlos“ lässt offen, ob vor allem Menschen außerhalb des jüdischen Gesetzes, Menschen, die gegen Gottes Gesetz handeln, oder beide Aspekte gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der griechischen Anklagestruktur, wird aber durch einen Relativsatz für heutige Leser verständlich gegliedert. Die ungewöhnliche Einzahl „durch die Hand“ bleibt wegen ihres Bildes vermittelter menschlicher Handlung im Haupttext erhalten und wird in der Fußnote erläutert.
