id: ACT.2.42
reference: Acts 2:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: de
  text: Sie widmeten sich beständig der Lehre der Apostel und der Gemeinschaft[a], dem Brechen des Brotes[b] und den Gebeten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Teilen“, „der Teilhabe“ oder „der Verbundenheit“.'
    reason: lexical_alternative
  - marker: b
    text: „Das Brechen des Brotes“ kann gemeinsame Mahlzeiten allgemein bezeichnen; viele verstehen darunter hier auch das Herrenmahl.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „den feststehenden Gebeten“; der bestimmte Artikel kann auf bekannte Gebetszeiten oder Gebetsformen hinweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: Sie widmeten sich beständig
  rationale: Die Verbindung aus Imperfekt und Partizip beschreibt ein fortdauerndes, gewohnheitsmäßiges und beharrliches Verhalten. „Widmeten sich beständig“ gibt sowohl den anhaltenden Aspekt als auch die Verbindlichkeit wieder.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: der Lehre der Apostel
  rationale: „Lehre“ ist im Deutschen natürlich und bezeichnet hier das von den Aposteln vermittelte Unterweisen, ohne den stärker systematischen Klang von „Lehrsatz“ oder „Doktrin“.
- source_word: τῇ κοινωνίᾳ
  choice: der Gemeinschaft
  rationale: „Gemeinschaft“ bewahrt die Breite von κοινωνία als gemeinsames Leben, Teilen und Teilhaben. Engere Deutungen wie Gütergemeinschaft oder sakramentale Kommunion werden nicht in den Haupttext eingetragen.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: dem Brechen des Brotes
  rationale: Die konkrete griechische Wendung bleibt erhalten. Sie kann gemeinsame Mahlzeiten bezeichnen und in diesem Zusammenhang auch das Mahl des Herrn einschließen, ohne dass der Ausdruck allein dies eindeutig festlegt.
- source_word: ταῖς προσευχαῖς
  choice: den Gebeten
  rationale: Der bestimmte Artikel und der Plural werden wiedergegeben. Dies kann auf bekannte Gebetszeiten oder feststehende Gebetsformen hinweisen, muss aber nicht darauf beschränkt werden.
theological_decisions:
- issue: Ob κλάσις τοῦ ἄρτου ausdrücklich als Herrenmahl oder Eucharistie wiederzugeben ist
  choice: dem Brechen des Brotes
  alternative: dem Herrenmahl; der Eucharistie; den gemeinsamen Mahlzeiten einschließlich des Herrenmahls
  rationale: Der Ausdruck kann in Lukas–Apostelgeschichte gewöhnliche Mahlgemeinschaft bezeichnen und im christlichen Kontext zugleich das Herrenmahl einschließen. Die offene Formulierung vermeidet eine konfessionelle Vorentscheidung.
- issue: Ob κοινωνία auf Gütergemeinschaft oder sakramentale Kommunion einzugrenzen ist
  choice: der Gemeinschaft
  alternative: dem Teilen; der Teilhabe; der Gütergemeinschaft; der Kommunion
  rationale: Das Wort umfasst gemeinsames Leben und Teilhabe und kann materielle wie geistliche Dimensionen einschließen. Der Haupttext bewahrt diese Bedeutungsbreite.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die vier Dativglieder bilden eine klare, dem griechischen Satz entsprechende Reihe. „Beständig“ vermeidet altertümliches „verharrten“, bewahrt aber den Gedanken an fortgesetzte Treue.
