    rationale: κατὰ Κυρήνην bezeichnet hier die nach bzw. im Raum von Kyrene gelegenen Teile Libyens; „in der Gegend von“ lässt den regionalen Bezug offen.
  - severity: low
    issue: Die Fußnote enthält mit „gemeint sind“ eine kontextuelle Erläuterung, statt die lexikalische Alternative knapp zu kennzeichnen.
    rationale: Die Anmerkung soll die vom Partizip ausgedrückte Aufenthaltsnuance erläutern, ohne zusätzlich festzulegen, was der Text nur kontextuell voraussetzt.
