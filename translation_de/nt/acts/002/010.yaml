  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: de
  text: Phrygien und Pamphylien, Ägypten und die Gebiete Libyens in der Gegend von Kyrene sowie die Römer, die sich dort aufhielten[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die sich dort vorübergehend aufhaltenden Römer«; auch: »römische Besucher«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: Phrygien und Pamphylien
  rationale: Die herkömmlichen deutschen Namen der beiden Landschaften; τε καὶ verbindet sie innerhalb der Aufzählung schlicht miteinander.
- source_word: Αἴγυπτον
  choice: Ägypten
  rationale: Der geläufige deutsche Ländername.
- source_word: τὰ μέρη τῆς Λιβύης
  choice: die Gebiete Libyens
  rationale: μέρη bezeichnet hier Teile beziehungsweise Regionen eines größeren geografischen Raums; „Gebiete“ klingt im Deutschen natürlich und vermeidet die missverständliche Wörtlichkeit „Teile“.
- source_word: τῆς κατὰ Κυρήνην
  choice: bei Kyrene
  rationale: κατά mit dem Ortsnamen ordnet die gemeinten Gebiete Libyens räumlich Kyrene zu, ohne genaue politische Grenzen festzulegen.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: die hier weilenden Römer
  rationale: ἐπιδημοῦντες bezeichnet Menschen, die sich gegenwärtig, möglicherweise nur zeitweilig, an dem genannten Ort aufhalten. „Hier weilend“ bewahrt dies, ohne sie zwingend als Touristen oder als dauerhaft Ansässige zu bestimmen.
