  source_fidelity: Die geografische Aufzählung ist zutreffend wiedergegeben. Für τῆς κατὰ Κυρήνην ist „in der Gegend von Kyrene“ etwas genauer als „bei Kyrene“, da die griechische Wendung eine regionale Zuordnung ausdrückt, nicht notwendig unmittelbare Nähe. οἱ ἐπιδημοῦντες bezeichnet in Jerusalem anwesende bzw. sich dort aufhaltende Römer; die Formulierung sollte dies ohne den leicht gehobenen und heute unnatürlichen Ausdruck „hier weilend“ wiedergeben.
  naturalness: „Hier weilenden“ wirkt in moderner Standardsprache literarisch-archaisch. „die Römer, die sich dort aufhielten“ ist idiomatisch und bewahrt die offene zeitliche Nuance; die Fußnote kann die vorübergehende Aufenthaltsbedeutung ausdrücklich kenntlich machen.
  terminology: „Phrygien“, „Pamphylien“, „Ägypten“, „Libyen“ und „Kyrene“ sind die üblichen deutschen geografischen Bezeichnungen. „Gebiete Libyens“ gibt τὰ μέρη angemessen wieder.
