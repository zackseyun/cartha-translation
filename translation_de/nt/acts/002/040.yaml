source:
  edition: SBLGNT
  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: de
  text: 'Und mit vielen weiteren Worten legte er eindringlich Zeugnis ab und redete ihnen immer wieder zu[a]: »Lasst euch aus dieser verkehrten Generation retten!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ermahnte sie immer wieder“.'
    reason: Die Bedeutung von παρακαλέω umfasst je nach Zusammenhang Zureden, Ermahnen und dringendes Auffordern.
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: mit vielen weiteren Worten
  rationale: Die Wendung gibt sowohl ἑτέροις („weitere/andere“) als auch πλείοσιν („viele/mehr“) idiomatisch wieder und bezeichnet das Mittel beziehungsweise die Begleitumstände seines fortgesetzten Redens.
- source_word: διεμαρτύρατο
  choice: legte er eindringlich Zeugnis ab
  rationale: διαμαρτύρομαι bezeichnet nachdrückliches, ernstes Bezeugen. „Eindringlich Zeugnis ablegen“ bewahrt den Zeugencharakter, ohne das Verb auf bloßes Warnen zu verengen.
- source_word: παρεκάλει
  choice: redete ihnen immer wieder zu
  rationale: Das Imperfekt beschreibt fortgesetztes oder wiederholtes Zureden. Die Formulierung ist natürlich und wahrt die auffordernde Kraft von παρακαλέω.
- source_word: αὐτούς
  choice: ihnen
  rationale: Das griechische Akkusativobjekt wird entsprechend der deutschen Konstruktion „jemandem zureden“ als Dativ wiedergegeben und bezeichnet die Zuhörenden des Petrus.
- source_word: Σώθητε
  choice: Lasst euch retten
  rationale: Der passive Imperativ wird im Deutschen natürlich durch „Lasst euch retten“ wiedergegeben. So bleiben sowohl die passive Perspektive als auch der echte Aufruf zur Reaktion erhalten.
- source_word: ἀπὸ
  choice: aus
  rationale: Bei „retten“ bezeichnet ἀπό die Trennung von der genannten Generation; „aus“ ist hier idiomatischer als „von“.
- source_word: γενεᾶς
  choice: Generation
  rationale: „Generation“ bewahrt die gewöhnliche Bedeutung von γενεά und den biblischen Anklang; gemeint sind die zeitgenössischen Menschen als moralisch gekennzeichnete Gemeinschaft.
- source_word: σκολιᾶς
  choice: verkehrten
  rationale: σκολιός bedeutet wörtlich „krumm“ und metaphorisch moralisch verdreht. „Verkehrt“ ist im Deutschen eine natürliche, würdige Wiedergabe dieser Metapher.
theological_decisions:
- issue: Genus Verbi und Handlungsträgerschaft bei Σώθητε
  choice: Lasst euch retten
  alternative: Rettet euch aus dieser verkehrten Generation
  rationale: Der griechische Imperativ ist passiv. Die gewählte Fassung vermeidet die Aussage autonomer Selbstrettung, ohne den im Imperativ enthaltenen Aufruf zu einer wirklichen Reaktion abzuschwächen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. „Legte eindringlich Zeugnis ab“ hält den feierlich-nachdrücklichen Ton; „redete ihnen immer wieder zu“ bildet den durativen Aspekt natürlich ab. Der passive Imperativ wird ohne unnötige dogmatische Festlegung bewahrt.
