base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: de
  text: 'Und es wird geschehen: Jeder, der den Namen des Herrn anruft, wird gerettet werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer auch immer den Namen des Herrn anruft.“ Die Worte greifen Joel 3,5 (in manchen Zählungen Joel 2,32) auf, wo „der Herr“ für JHWH steht; in der Apostelgeschichte führt Petrus das Zitat im Rahmen seiner Verkündigung über Jesus an.'
    reason: Alternative Wiedergabe von πᾶς ὃς ἐάν; Hinweis auf die alttestamentliche Herkunft und den bewusst offenen Bezug von „Herr“.
lexical_decisions:
- source_word: ἔσται
  choice: es wird geschehen
  rationale: Das Futur von εἰμί steht hier in einer einleitenden prophetischen Formel. „Es wird geschehen“ bewahrt den feierlichen Schriftton und ist zugleich modernes, verständliches Deutsch.
- source_word: πᾶς ὃς ἐὰν
  choice: jeder, der
  rationale: Die Konstruktion bezeichnet eine unbestimmte, umfassende Bedingung. „Jeder, der“ gibt ihren universalen Sinn natürlich wieder.
- source_word: ἐπικαλέσηται
  choice: anruft
  rationale: In Verbindung mit „dem Namen“ bezeichnet ἐπικαλέομαι das vertrauensvolle beziehungsweise verehrende Anrufen. „Anrufen“ bewahrt den biblischen Ausdruck, ohne unnötig altertümlich zu wirken.
- source_word: τὸ ὄνομα
  choice: den Namen
  rationale: Die wörtliche Wiedergabe erhält die feste biblische Wendung „den Namen … anrufen“ und ihre religiösen und bundesbezogenen Anklänge.
- source_word: κυρίου
  choice: des Herrn
  rationale: κύριος wird als „Herr“ wiedergegeben. Der Genitiv entspricht in der festen deutschen Wendung „den Namen des Herrn“ dem griechischen τὸ ὄνομα κυρίου.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Das Futur Passiv von σῴζω umfasst Rettung und Heil. „Wird gerettet werden“ bewahrt die passive Form und die im Kontext vorhandene heilsgeschichtliche Bedeutung.
theological_decisions:
- issue: Bezug von „Herr“ im Joel-Zitat innerhalb der Apostelgeschichte
  choice: κύριος im Haupttext mit „der Herr“ wiedergeben, ohne den Bezug ausdrücklich festzulegen.
  alternative: Im ursprünglichen Joel-Kontext JHWH; in der christologisch geprägten Verkündigung des Petrus möglicherweise beziehungsweise zugleich auf Jesus bezogen.
  rationale: Der griechische Text nennt lediglich „Herr“. Das Zitat verweist auf Joel, wo JHWH gemeint ist, steht in Apostelgeschichte 2 jedoch in einer auf Jesus ausgerichteten Verkündigung. Die Übersetzung bewahrt diese theologische Spannung, statt sie im Haupttext aufzulösen.
translation_notes:
  register: Moderner, würdevoller Standardstil mit leicht feierlichem Schriftton. Der Doppelpunkt macht die einleitende Formel im Deutschen klar; „anrufen“ und „gerettet werden“ bewahren die etablierte biblische Ausdrucksweise.
