id: ACT.2.11
reference: Acts 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: de
  text: Sowohl Juden als auch Proselyten, Kreter und Araber – wir hören sie in unseren eigenen Sprachen[a] von den großen Taten Gottes reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Zungen“. Das griechische Wort kann sowohl „Zungen“ als auch „Sprachen“ bedeuten; hier spricht der Zusammenhang für erkennbare menschliche Sprachen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: Juden
  rationale: Im Zusammenhang bezeichnet das Wort das jüdische Volk innerhalb der Aufzählung, nicht nur Bewohner Judäas.
- source_word: τε καὶ
  choice: wie auch
  rationale: Gibt die verbindende und leicht korrelative Kraft der Wendung im Deutschen natürlich wieder.
- source_word: προσήλυτοι
  choice: Proselyten
  rationale: Bezeichnet hier Nichtjuden, die zum Judentum übergetreten sind; der etablierte Fachbegriff ist präziser als das allgemeinere „Bekehrte“.
- source_word: Κρῆτες καὶ Ἄραβες
  choice: Kreter und Araber
  rationale: Die üblichen modernen deutschen Bezeichnungen für die genannten Volksgruppen.
- source_word: ἀκούομεν λαλούντων αὐτῶν
  choice: wir hören sie … reden
  rationale: Bildet die Wahrnehmungskonstruktion mit dem Partizip idiomatisch ab, ohne den Inhalt stärker als im Griechischen als Verkündigung zu deuten.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: in unseren eigenen Sprachen
  rationale: Der unmittelbare Kontext legt erkennbare menschliche Sprachen nahe; „eigenen“ bewahrt die Betonung durch ἡμετέραις.
- source_word: τὰ μεγαλεῖα τοῦ θεοῦ
  choice: von den großen Taten Gottes
  rationale: Gibt die machtvollen, bemerkenswerten Taten Gottes natürlich wieder; die Verbindung mit „von … reden“ ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutung von γλώσσαις im Pfingstbericht
  choice: erkennbare menschliche Sprachen
  alternative: Zungen beziehungsweise ekstatische oder nichtmenschliche Rede
  rationale: Die unmittelbar vorausgehende Schilderung betont, dass Menschen aus verschiedenen Gebieten die Rede jeweils in ihrer eigenen Sprache hören. Die Übersetzung folgt diesem erzählerischen Zusammenhang, während die Fußnote die lexikalische Alternative offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bewahrt den Übergang von der abschließenden Aufzählung zur gemeinsamen Reaktion der Zuhörer. „Proselyten“ bleibt wegen seiner historischen Präzision erhalten.
