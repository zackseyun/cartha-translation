id: ACT.2.22
reference: Acts 2:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: de
  text: 'Ihr Männer Israels, hört diese Worte: Jesus, den Nazarener[a], einen Mann, den Gott euch gegenüber durch Machttaten[b], Wunder und Zeichen beglaubigt hat, die Gott durch ihn in eurer Mitte getan hat, wie ihr selbst wisst –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus von Nazaret“ beziehungsweise „Jesus, den Nazoräer“. Die griechische Bezeichnung Ναζωραῖος lässt mehrere natürliche Wiedergaben zu.'
    reason: lexical_alternative
  - marker: b
    text: „Machttaten“ kann hier auch mit „Krafttaten“ oder sinngemäß mit „Wundertaten“ wiedergegeben werden. Das griechische δυνάμεις bezeichnet machtvolle Taten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ihr Männer Israels
  rationale: Die Anrede bewahrt sowohl das ausdrücklich männliche ἄνδρες als auch die Bezeichnung der Angeredeten als Israeliten und klingt im Deutschen feierlich, aber verständlich.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: hört diese Worte
  rationale: Die Formulierung gibt den Aufforderungscharakter und den Plural λόγους unmittelbar wieder, ohne ihn deutend zu „Botschaft“ zusammenzufassen.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jesus, den Nazarener
  rationale: „Der Nazarener“ erhält den beschreibenden beziehungsweise titelartigen Charakter von Ναζωραῖος; die geläufige Alternative „Jesus von Nazaret“ wird in der Fußnote genannt.
- source_word: ἄνδρα
  choice: einen Mann
  rationale: Die ausdrückliche Bezeichnung Jesu als Mann wird weder verallgemeinert noch ausgelassen.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: einen Mann, den Gott vor euch … ausgewiesen hat
  rationale: „Ausgewiesen“ vermittelt öffentliche Bestätigung beziehungsweise Beglaubigung; „vor euch“ bringt den Bezug auf die angesprochene Öffentlichkeit zum Ausdruck, ohne ihn mit „in eurer Mitte“ gleichzusetzen.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: durch Machttaten, Wunder und Zeichen
  rationale: „Machttaten“ macht den Kraftaspekt von δυνάμεις sichtbar und bewahrt zugleich die dreigliedrige Formel.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: die Gott durch ihn … tat
  rationale: Gott bleibt wie im Griechischen das ausdrückliche Subjekt, während Jesus durch δι’ αὐτοῦ als vermittelnder Handelnder bezeichnet wird.
- source_word: ἐν μέσῳ ὑμῶν
  choice: in eurer Mitte
  rationale: Die Wendung gibt das räumlich-öffentliche Idiom anschaulich und natürlich wieder.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: wie ihr selbst wisst
  rationale: „Selbst“ bewahrt die Hervorhebung durch αὐτοί.
theological_decisions:
- issue: Christologische Aussage von ἄνδρα
  choice: „einen Mann“ im Haupttext beibehalten
  alternative: „einen Menschen“ oder Auslassung der Bezeichnung
  rationale: Der griechische Text bezeichnet Jesus ausdrücklich als ἄνδρα. Die Übersetzung bewahrt diese Aussage über seine wirkliche Menschlichkeit, ohne daraus eine Aussage gegen seine Göttlichkeit abzuleiten.
- issue: Handlungsträger bei den Machttaten, Wundern und Zeichen
  choice: Gott als Subjekt und Jesus als vermittelnde Person wiedergeben
  alternative: Jesus allein als Subjekt der Taten formulieren
  rationale: ὁ θεός ist ausdrücklich das Subjekt von ἐποίησεν, während δι’ αὐτοῦ die Vermittlung durch Jesus ausdrückt. Diese Spannung darf nicht zugunsten einer systematischen Vereinfachung eingeebnet werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Redeton. Die Satzfolge bleibt wegen des Anschlusses an den folgenden Vers offen; der Gedankenstrich signalisiert diese Fortsetzung. Beide Fußnotenmarker stehen an den jeweils erläuterten Stellen im Haupttext.
