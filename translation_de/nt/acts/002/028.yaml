source:
  edition: SBLGNT
  text: ἐγνώρισάς μοι ὁδοὺς ζωῆς, πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: de
  text: Du hast mir die Wege des Lebens gezeigt; du wirst mich mit Freude erfüllen vor deinem Angesicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit deinem Angesicht“; gemeint ist: in deiner Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: Du hast mir … gezeigt
  rationale: Das Aoristverb γνωρίζω bedeutet hier, jemandem etwas bekanntzumachen bzw. zu zeigen. Das deutsche Perfekt ist in gegenwärtigem Standarddeutsch natürlich und gibt mit dem Dativ „mir“ die Satzbeziehung klar wieder.
- source_word: ὁδοὺς ζωῆς
  choice: die Wege des Lebens
  rationale: „Wege“ bewahrt den Plural von ὁδούς und vermeidet eine vorschnelle Festlegung darauf, ob die Wege vom Leben geprägt sind oder zum Leben führen. „Des Lebens“ gibt den mehrdeutigen Genitiv ζωῆς formal angemessen wieder.
- source_word: πληρώσεις με εὐφροσύνης
  choice: du wirst mich mit Freude erfüllen
  rationale: Die Zukunftsform πληρώσεις wird direkt als „wirst … erfüllen“ wiedergegeben; der Genitiv εὐφροσύνης bezeichnet den Inhalt der Erfüllung. „Freude“ ist natürlich, würdig und umfasst die fröhliche, freudige Bedeutung des Substantivs.
- source_word: μετὰ τοῦ προσώπου σου
  choice: vor deinem Angesicht
  rationale: Die Wendung lautet wörtlich „mit deinem Angesicht“, bezeichnet aber die unmittelbare persönliche Gegenwart. „Vor deinem Angesicht“ bewahrt das Bild des Gesichts und ist im Deutschen verständlich und würdevoll, ohne die Formulierung auf den abstrakteren Begriff „Gegenwart“ zu reduzieren.
theological_decisions:
- issue: Gottesgegenwart in der Wendung μετὰ τοῦ προσώπου σου
  choice: vor deinem Angesicht
  alternative: in deiner Gegenwart / mit deiner Gegenwart
  rationale: Die bildhafte Rede vom Angesicht bleibt erhalten und vermittelt zugleich die persönliche Nähe Gottes. Damit wird die theologisch gewichtige Aussage über Freude in Gottes unmittelbarer Gegenwart nicht abgeschwächt oder weitergehend ausgelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Vor deinem Angesicht“ ist leicht gehoben, erhält jedoch bewusst das konkrete Bild des griechischen Ausdrucks. Die Zeichensetzung folgt dem Parallelismus des Verses.
