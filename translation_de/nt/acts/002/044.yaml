  text: πάντες δὲ οἱ ⸀πιστεύοντες ⸂ἦσαν ἐπὶ τὸ αὐτὸ καὶ⸃ εἶχον ἅπαντα κοινά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: de
  text: Alle Gläubigen aber waren zusammen[a] und hatten alles gemeinsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „waren am selben Ort“. Die griechische Wendung kann das Zusammensein beziehungsweise das Versammeltsein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Alle
  rationale: Bewahrt die umfassende Aussage über die gesamte im substantivierten Partizip bezeichnete Gruppe.
- source_word: δὲ
  choice: aber
  rationale: Markiert den fortführenden Übergang mit einer leichten Gegenüberstellung; im Deutschen ist „Alle aber“ in diesem erzählenden Zusammenhang würdig und verständlich, ohne einen starken Gegensatz zu erzwingen.
- source_word: οἱ πιστεύοντες
  choice: die glaubten
  rationale: Gibt das substantivierte Präsenspartizip unmittelbar und natürlich wieder. Der Kontext bezeichnet damit die Gemeinschaft der Glaubenden, ohne das Griechische unnötig in eine feste Gruppenbezeichnung umzuwandeln.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: waren zusammen
  rationale: Die Wendung kann Gemeinschaft beziehungsweise Versammeltsein ausdrücken und zugleich örtlich verstanden werden. „Waren zusammen“ wahrt diese Bedeutungsbreite; die örtliche Alternative steht in der Fußnote.
- source_word: εἶχον
  choice: hatten
  rationale: Das Imperfekt wird im natürlichen deutschen Erzählstil mit dem Präteritum wiedergegeben; der andauernde Zustand ergibt sich aus dem Zusammenhang.
- source_word: ἅπαντα κοινά
  choice: hatten alles gemeinsam
  rationale: Eine natürliche, genaue Wiedergabe der gemeinsamen Verfügung über alles, ohne über den Wortlaut hinaus ein bestimmtes wirtschaftliches System festzulegen.
theological_decisions:
- issue: Art des gemeinschaftlichen Besitzes und Lebens
  choice: Der Vers beschreibt, dass die Glaubenden alles gemeinsam hatten.
  alternative: Der Vers schreibt allen christlichen Gemeinschaften ausdrücklich ein bestimmtes Wirtschaftssystem vor.
  rationale: Der griechische Text berichtet beschreibend über den Zustand und die Praxis dieser Gemeinschaft; er formuliert hier weder einen Befehl noch ausdrücklich eine allgemeingültige Ordnung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die knappe Satzstruktur des Griechischen bleibt erhalten; echte Mehrdeutigkeit der Wendung ἐπὶ τὸ αὐτό wird durch eine Fußnote sichtbar gemacht.
