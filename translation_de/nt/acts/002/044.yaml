  source_fidelity: Der Entwurf gibt πάντες, die idiomatische Wendung ἦσαν ἐπὶ τὸ αὐτό, das imperfektische ἦσαν/εἶχον im erzählenden Präteritum und ἅπαντα κοινά sachgerecht wieder. „die glaubten“ kann jedoch im Deutschen leicht auf einen abgeschlossenen früheren Glaubensakt verweisen, während das substantivierte Präsenspartizip οἱ πιστεύοντες die gegenwärtige Gruppe der Glaubenden bezeichnet.
  naturalness: „Alle Gläubigen aber“ ist modernes, klares Standarddeutsch und bewahrt zugleich die Gruppierung des griechischen Ausdrucks. „Waren zusammen“ und „hatten alles gemeinsam“ sind idiomatisch. Die Fußnote wird sprachlich geglättet.
  terminology: „Gläubige“ ist hier eine angemessene, theologisch nicht überladene Bezeichnung für οἱ πιστεύοντες. Die Übersetzung bleibt deskriptiv und legt keine bestimmte Wirtschafts- oder Besitzordnung fest.
