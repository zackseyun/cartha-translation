  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες καὶ ⸀διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες· Τί ⸀θέλει τοῦτο εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: de
  text: 'Alle waren erstaunt und ratlos. Sie sagten zueinander: „Was hat das zu bedeuten?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Was will dies sein?“ Gemeint ist: „Was bedeutet das?“ oder „Welche Bedeutung hat das?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: waren erstaunt
  rationale: Das Verb bezeichnet hier anhaltendes Staunen angesichts des außergewöhnlichen Geschehens. „Waren erstaunt“ ist im modernen Deutsch natürlich und vermeidet die missverständliche etymologische Wiedergabe „waren außer sich“.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ führt die Erzählung hier nur leicht weiter. Die Satzfolge stellt diesen Zusammenhang im Deutschen bereits natürlich her; ein ausdrückliches „und“ oder „aber“ wäre unnötig oder zu stark.
- source_word: πάντες
  choice: Alle
  rationale: „Alle“ bewahrt die ausdrückliche umfassende Aussage des griechischen Textes.
- source_word: διηπόρουν
  choice: waren ratlos
  rationale: Das Verb beschreibt anhaltende Verwirrung und Unsicherheit. „Ratlos“ ist gegenwärtiges, verständliches Deutsch und ergänzt das vorausgehende Staunen, ohne beide Reaktionen gleichzusetzen.
- source_word: ἄλλος πρὸς ἄλλον
  choice: zueinander
  rationale: Dies ist die natürliche deutsche Wiedergabe der wechselseitigen Wendung.
- source_word: λέγοντες
  choice: Sie sagten
  rationale: Der griechische Partizipialsatz wird für einen natürlichen deutschen Erzählstil als eigener Hauptsatz wiedergegeben. „Sagten“ bleibt gegenüber dem ausdrücklich fragenden Inhalt neutral.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Was hat das zu bedeuten?
  rationale: Die griechische Wendung fragt idiomatisch nach Bedeutung oder Tragweite des Geschehens. Die deutsche Formulierung ist natürlich und bewahrt den offenen, fragenden Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der griechische Partizipialsatz wurde zur besseren Lesbarkeit in einen zweiten Hauptsatz aufgelöst; die beiden Reaktionen Staunen und Ratlosigkeit bleiben klar unterschieden.
