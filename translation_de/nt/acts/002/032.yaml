  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: de
  text: Diesen Jesus hat Gott auferweckt; dessen sind wir alle Zeugen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Diesen Jesus
  rationale: Das vorangestellte Demonstrativpronomen bewahrt den nachdrücklichen, rückverweisenden Charakter der griechischen Formulierung und klingt zugleich natürlich.
- source_word: ἀνέστησεν
  choice: hat auferweckt
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Verb die Auferstehung. „Auferweckt“ gibt sowohl den transitiven Sinn als auch Gott als handelndes Subjekt eindeutig wieder.
- source_word: ὁ θεός
  choice: Gott
  rationale: Das ausdrücklich genannte Subjekt wird schlicht und direkt beibehalten.
- source_word: οὗ
  choice: dafür
  rationale: Das griechische Relativpronomen knüpft an Jesus und seine Auferweckung an. Im heutigen Deutsch bezeichnet „dafür“ idiomatisch den Gegenstand des Zeugnisses, ohne den Bezug auf das unmittelbar zuvor Gesagte aufzulösen.
- source_word: πάντες ἡμεῖς
  choice: wir alle
  rationale: Die betonte Verbindung wird in natürlicher deutscher Wortfolge wiedergegeben.
- source_word: ἐσμεν μάρτυρες
  choice: sind … Zeugen
  rationale: Die nominale griechische Konstruktion bleibt erhalten und bezeichnet Personen, die die bezeugte Auferweckung bestätigen.
theological_decisions:
- issue: Aussage über die Auferstehung
  choice: Gott hat diesen Jesus auferweckt
  alternative: Gott ließ diesen Jesus auferstehen
  rationale: Die gewählte Fassung schreibt die Auferweckung unmittelbar Gott zu und bewahrt die transitive Form des griechischen Verbs, ohne zusätzliche dogmatische Erläuterung.
- issue: Gegenstand des Zeugnisses
  choice: dafür sind wir alle Zeugen
  alternative: dessen sind wir alle Zeugen
  rationale: „Dafür“ bezieht das Zeugnis natürlich auf die soeben ausgesagte Auferweckung Jesu. „Dessen“ wäre formal näher am Genitiv, klingt im modernen Deutsch jedoch steif und könnte unklarer wirken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau erhält die Hervorhebung von „Diesen Jesus“; das Semikolon macht die enge Folgerelation der beiden Aussagen deutlich.
