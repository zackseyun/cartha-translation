review_pass:
  verdict: revise
  source_fidelity: „Diesen Jesus hat Gott auferweckt“ gibt τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός präzise wieder. Im zweiten Teilsatz ist dafür jedoch als Bezugsausdruck zu stark auf die Auferweckung als Sachverhalt festgelegt. Das griechische maskuline Relativpronomen οὗ nimmt unmittelbar „diesen Jesus“ auf. „Dessen“ erhält diesen Personenbezug, ohne auszuschließen, dass das Zeugnis besonders seine Auferweckung betrifft.
  naturalness: Die revidierte Formulierung ist würdiges, verständliches modernes Standarddeutsch. „Dessen sind wir alle Zeugen“ ist in einem biblisch-öffentlichen Register idiomatisch und knapper als eine umschreibende Konstruktion.
  terminology: „Auferweckt“ trifft den im Kontext eindeutig auf die Auferstehung bezogenen transitiven Sinn von ἀνέστησεν. „Zeugen“ bewahrt μάρτυρες als Personenbezeichnung. Eine Fußnote zur Bedeutung von „auferweckt“ ist im Deutschen nicht erforderlich.
  issues:
  - severity: medium
    issue: Der Ausdruck „dafür“ ersetzt den personenbezogenen Relativanschluss durch einen ausschließlich sachbezogenen Verweis.
    rationale: οὗ ist maskulin und bezieht sich grammatisch auf Ἰησοῦν. Zwar ist die Auferweckung der konkrete Inhalt des Zeugnisses, doch die Übersetzung sollte den unmittelbaren Bezug auf Jesus nicht einengen oder tilgen.
  revised_text: Diesen Jesus hat Gott auferweckt; dessen sind wir alle Zeugen.
