id: ACT.2.19
reference: Acts 2:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: de
  text: 'Und ich werde oben am Himmel Wunder geschehen lassen und unten auf der Erde Zeichen: Blut und Feuer und Rauchdampf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Rauchwolke«; wörtlicher: »Dampf von Rauch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: werde … geschehen lassen
  rationale: Das griechische »geben« bezeichnet hier idiomatisch das Hervorbringen bzw. Gewähren der angekündigten Wunder und Zeichen. Die deutsche Wendung ist natürlich und bewahrt Gott als handelndes Subjekt.
- source_word: τέρατα
  choice: Wunder
  rationale: Bezeichnet außergewöhnliche, Staunen oder Erschrecken hervorrufende Erscheinungen; »Wunder« erhält zudem die geläufige Verbindung mit »Zeichen«, ohne die Phänomene auf Heilungswunder einzuengen.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: oben am Himmel
  rationale: Gibt sowohl οὐρανός als auch ἄνω wieder und bildet einen natürlichen, räumlichen Gegensatz zu »unten auf der Erde«.
- source_word: σημεῖα
  choice: Zeichen
  rationale: Bewahrt den Sinn bedeutungsvoller, auf etwas hinweisender Erscheinungen und die biblisch geläufige Verbindung »Wunder und Zeichen«.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: unten auf der Erde
  rationale: Der kosmische Gegensatz zum Himmel legt für γῆ »Erde« statt »Land« nahe; ἐπί und κάτω werden mit »auf« und »unten« wiedergegeben.
- source_word: αἷμα
  choice: Blut
  rationale: Direkte Wiedergabe des konkreten apokalyptischen Bildes.
- source_word: πῦρ
  choice: Feuer
  rationale: Direkte Wiedergabe des konkreten apokalyptischen Bildes.
- source_word: ἀτμίδα καπνοῦ
  choice: Rauchdampf
  rationale: Gibt sowohl den Dampf bzw. Dunst (ἀτμίς) als auch den Rauch (καπνός) knapp wieder und bleibt näher am griechischen Ausdruck als »Rauchwolke«.
theological_decisions:
- issue: Kosmische Ortsangaben im Joel-Zitat
  choice: oben am Himmel … unten auf der Erde
  alternative: oben am Firmament … unten auf dem Land
  rationale: Der umfassende Gegensatz von Himmel und Erde entspricht der kosmisch-apokalyptischen Bildwelt und vermeidet eine unnötige Verengung auf Wetterphänomene oder ein bestimmtes Land.
- issue: Art der angekündigten Phänomene
  choice: Wunder … Zeichen
  alternative: Wunderzeichen … Vorzeichen
  rationale: Die beiden griechischen Begriffe bleiben unterscheidbar; der Text entscheidet nicht ausdrücklich, ob die Erscheinungen ausschließlich übernatürliche Wunder oder zugleich endzeitliche Vorzeichen sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Höhen- und Tiefenstruktur des griechischen Textes bleibt erhalten; der Doppelpunkt macht deutlich, dass Blut, Feuer und Rauchdampf die angekündigten Erscheinungen näher entfalten.
