  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: de
  text: Als dieses Geräusch entstand[a], kam die Menge zusammen und war verwirrt, denn jeder Einzelne hörte sie in seiner eigenen Sprache[b] sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als dieser Laut entstand«. Das griechische Wort kann einen Laut, ein Geräusch oder eine Stimme bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in seiner eigenen Mundart« beziehungsweise »in seinem eigenen Dialekt«. Das griechische Wort kann sowohl eine Sprache als auch eine regionale Mundart bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ τῆς φωνῆς ταύτης
  choice: Als dieses Geräusch entstand
  rationale: Der Genitivus absolutus bezeichnet hier einen zeitlichen Umstand. φωνή kann »Laut«, »Geräusch« oder »Stimme« bedeuten; im Zusammenhang ist ein hörbares Phänomen gemeint, ohne dass eine Stimme vorausgesetzt werden sollte.
- source_word: συνῆλθε τὸ πλῆθος
  choice: strömte die Menge zusammen
  rationale: συνέρχομαι beschreibt das Zusammenkommen an einem Ort. »Strömte … zusammen« ist im Deutschen eine natürliche Wendung für die rasche Ansammlung einer Menschenmenge.
- source_word: συνεχύθη
  choice: war verwirrt
  rationale: Die Passivform bezeichnet Verwirrung oder Bestürzung. »War verwirrt« bewahrt die Bedeutung, ohne die Stärke des Ausdrucks unnötig zu steigern.
- source_word: ἤκουον εἷς ἕκαστος
  choice: jeder Einzelne hörte
  rationale: Die emphatische distributive Formulierung wird mit »jeder Einzelne« wiedergegeben. Das Imperfekt beschreibt das fortdauernde Hören; im Deutschen vermittelt das Präteritum dies im Erzählzusammenhang hinreichend.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: in seiner eigenen Sprache
  rationale: διάλεκτος kann eine Sprache oder eine regionale Mundart bezeichnen. »Sprache« ist hier allgemeinverständlich und passt zu den anschließend genannten Herkunftsgebieten; die engere Wiedergabe wird in einer Fußnote erhalten.
- source_word: λαλούντων αὐτῶν
  choice: sie … sprechen
  rationale: Die Formulierung lässt die Identität der bereits im Kontext genannten Sprechenden unverändert und fügt keine engere Bestimmung wie »Apostel« hinzu.
theological_decisions:
- issue: Art des Sprachwunders
  choice: Die Menge hört die Sprechenden jeweils in der eigenen Sprache; der Vers legt nicht näher fest, wie das Wunder zustande kommt.
  alternative: Der Vers könnte als ausschließliches Hörwunder oder ausschließliches Sprechwunder ausgedeutet werden.
  rationale: Die Übersetzung bewahrt die Aussage des griechischen Textes, ohne die nicht ausdrücklich erklärte Wirkungsweise des Geschehens dogmatisch festzulegen.
- issue: Distributive Einzahl
  choice: jeder Einzelne … in seiner eigenen Sprache
  alternative: alle … in ihren eigenen Sprachen
  rationale: Die Einzahl gibt εἷς ἕκαστος und τῇ ἰδίᾳ διαλέκτῳ genau wieder und betont die persönliche Wahrnehmung jedes Einzelnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Ablauf, klingt jedoch natürlich; lexikalische Mehrdeutigkeiten werden in den Fußnoten offengehalten.
