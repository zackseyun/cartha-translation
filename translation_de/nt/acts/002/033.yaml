reference: Acts 2:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: de
  text: Nachdem er also zur Rechten Gottes erhöht worden war[a] und vom Vater die Verheißung des Heiligen Geistes empfangen hatte[b], hat er das ausgegossen, was ihr selbst seht und hört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem er also durch die rechte Hand Gottes erhöht worden war“. Der griechische Dativ kann die Stellung zur Rechten Gottes oder das Mittel der Erhöhung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „und vom Vater den verheißenen Heiligen Geist empfangen hatte“. Die griechische Wendung kann sowohl den Geist als verheißene Gabe als auch die auf den Geist bezogene Verheißung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: zur Rechten Gottes
  rationale: Der Dativ wird im Haupttext lokal verstanden und bezeichnet Jesu Erhöhung auf den Ehrenplatz an Gottes rechter Seite; dies passt zum folgenden Zitat aus Psalm 110. Die instrumentale Deutung bleibt in Fußnote [a] erhalten.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ markiert in natürlichem Deutsch die Folgerung aus der vorausgehenden Argumentation, ohne bloß zeitlich zu klingen.
- source_word: ὑψωθεὶς
  choice: erhöht worden ist
  rationale: Das passive Partizip bezeichnet die von Gott bewirkte Erhöhung Jesu; „erhöht“ bewahrt den hier gemeinten Gedanken von Erhebung und Einsetzung in eine hohe Stellung.
- source_word: τήν τε ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: die Verheißung des Heiligen Geistes
  rationale: 'Die formnahe Wiedergabe bewahrt die genitivische Mehrdeutigkeit: Gemeint sein kann der verheißene Geist selbst oder die auf den Geist bezogene Verheißung. Fußnote [b] nennt die idiomatische Alternative.'
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: vom Vater … empfangen hat
  rationale: „Vom Vater“ gibt παρά mit Genitiv als Herkunft wieder; die Perfektform ordnet das Empfangen dem anschließenden Ausgießen vorausgehend zu.
- source_word: ἐξέχεεν
  choice: hat … ausgegossen
  rationale: Das deutsche Perfekt bezeichnet die vollzogene Handlung, deren sicht- und hörbare Folgen gegenwärtig vorliegen.
- source_word: τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: dies …, was ihr selbst seht und hört
  rationale: „Dies“ wahrt die knappe, nicht weiter ausgedeutete Referenz des Griechischen; „ihr selbst“ erhält die Betonung des ausdrücklich gesetzten Pronomens ὑμεῖς.
theological_decisions:
- issue: Bezeichnet τῇ δεξιᾷ eine Erhöhung zu Gottes rechter Seite oder durch Gottes rechte Hand?
  choice: zur Rechten Gottes
  alternative: durch die rechte Hand Gottes
  rationale: Der Kontext der Erhöhung und das unmittelbar folgende Zitat aus Psalm 110 sprechen für die lokale Deutung. Da der griechische Dativ auch instrumental verstanden werden kann, wird diese Möglichkeit nicht ausgeschlossen, sondern in Fußnote [a] dokumentiert.
- issue: Bezeichnet „die Verheißung des Heiligen Geistes“ den Geist als verheißenes Geschenk oder eine Verheißung über den Geist?
  choice: die Verheißung des Heiligen Geistes
  alternative: den verheißenen Heiligen Geist
  rationale: Die formnahe Haupttextfassung lässt die syntaktische und theologische Spannung bestehen. Der folgende Hinweis auf das Ausgießen legt den Geist als verheißene Gabe nahe, zwingt aber nicht dazu, den Genitiv im Haupttext eindeutig so aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktionen wurden zur besseren Verständlichkeit als Nebensatz mit koordiniertem Verb wiedergegeben. „Zur Rechten Gottes“ bewahrt die traditionelle biblische Bildsprache, während beide echten Mehrdeutigkeiten durch Fußnoten offengehalten werden.
