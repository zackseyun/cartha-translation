  naturalness: Die Formulierung „Nachdem er nun“ lässt οὖν im Deutschen eher zeitlich als folgernd wirken. „Also“ gibt den inferenziellen Anschluss klarer wieder. Außerdem ist „das ausgegossen, was …“ im modernen Standarddeutsch idiomatischer als „dies ausgegossen, was …“.
