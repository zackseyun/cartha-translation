id: ACT.2.30
reference: Acts 2:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: de
  text: Da David nun ein Prophet war und wusste, dass Gott ihm mit einem Eid geschworen hatte, einen seiner leiblichen Nachkommen[a] auf Davids Thron zu setzen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jemanden von der Frucht seiner Lende“.'
    reason: Die Fußnote bewahrt das konkrete griechische Abstammungsbild, während der Haupttext die idiomatische Bedeutung natürlich wiedergibt.
lexical_decisions:
- source_word: προφήτης
  choice: Prophet
  rationale: Die übliche und kontextgemäße Bezeichnung für einen Menschen, der aufgrund göttlicher Offenbarung spricht.
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet hier die Folgerung aus der vorausgehenden Aussage über David; im Deutschen stellt „nun“ den argumentativen Anschluss natürlich her.
- source_word: ὑπάρχων
  choice: weil David … war
  rationale: Das Partizip bezeichnet einen begleitenden Umstand mit naheliegender kausaler Bedeutung. Die ausdrückliche Wiederaufnahme Davids verhindert im Deutschen ein unklares Pronomen.
- source_word: εἰδὼς
  choice: wusste
  rationale: Das koordinierte Partizip wird in der deutschen Satzstruktur als finites Verb wiedergegeben, ohne seinen Sinn zu verändern.
- source_word: ὅρκῳ ὤμοσεν
  choice: mit einem Eid geschworen hatte
  rationale: Gibt sowohl das Substantiv „Eid“ als auch das Verb „schwören“ wieder und bewahrt so die feierliche Bekräftigung.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: einen seiner leiblichen Nachkommen
  rationale: Gibt die idiomatische Bedeutung der wörtlichen Wendung „von der Frucht seiner Lende“ verständlich wieder und bewahrt durch „leiblich“ den Gedanken physischer Abstammung.
- source_word: καθίσαι
  choice: zu setzen
  rationale: 'Der Infinitiv hat hier kausative Bedeutung: Gott setzt beziehungsweise erhebt den Nachkommen auf den Thron.'
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: auf seinen Thron
  rationale: Natürliche deutsche Wiedergabe der Thronbesteigung; das Possessivpronomen bezieht sich im Kontext am ehesten auf David.
theological_decisions:
- issue: Messianische Königsverheißung an David
  choice: Die dynastische Verheißung wird als Einsetzung eines leiblichen Nachkommen auf Davids Thron wiedergegeben, ohne in diesem Vers ausdrücklich „Messias“ einzufügen.
  alternative: „den Messias auf seinen Thron zu setzen“
  rationale: Der Zusammenhang bezieht die Verheißung auf Jesus; der Vers selbst spricht jedoch in der Sprache von Abstammung und Thron. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wegen des folgenden Verses syntaktisch offen und endet daher mit einem Komma. Die kausale Partizipialkonstruktion wird für gute Verständlichkeit als Nebensatz wiedergegeben.
