    issue: „an meine rechte Seite“ für ἐκ δεξιῶν μου
    rationale: Die griechische Formel bezeichnet den Ehrenplatz zur Rechten. „Zu meiner Rechten“ ist im Deutschen die feste, klare Entsprechung; „an meine rechte Seite“ ist semantisch weniger idiomatisch und kann eine bloß körperliche Seite nahelegen.
  - severity: low
    issue: Ungewöhnliche Wortstellung „Denn nicht David ist ...“
    rationale: Die Voranstellung von „nicht David“ erzeugt eine stärkere Exklusivität, als der griechische Satz notwendig markiert. „Denn David ist nicht ...“ bewahrt die Verneinung und ist natürlicher.
  - severity: low
