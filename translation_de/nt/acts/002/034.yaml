  rationale: Die Revision verbessert die idiomatische und semantisch präzise Wiedergabe der Thronformel durch „zu meiner Rechten“, glättet die deutsche Wortstellung und richtet den Fußnotenanker am englischen Audit-Trail aus. Aussagegehalt, Präsens bei „sagt“, Plural „die Himmel“ und die griechisch orientierte Wiedergabe beider Vorkommen von κύριος als „Herr“ bleiben erhalten.
