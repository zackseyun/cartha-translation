source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: de
  text: 'Denn David ist nicht in die Himmel[a] hinaufgestiegen, sondern er selbst sagt: »Der Herr sprach zu meinem Herrn: ›Setz dich zu meiner Rechten,‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Psalm 110,1. Im hebräischen Text steht für den ersten »Herrn« der Gottesname JHWH; vgl. »Der HERR sprach zu meinem Herrn.«
    reason: Die Fußnote weist auf die hebräische Grundlage des Zitats hin, ohne die zweimalige Verwendung von κύριος im griechischen Ausgangstext im Haupttext zu verändern.
lexical_decisions:
- source_word: ἀνέβη
  choice: ist … hinaufgestiegen
  rationale: Das Aoristverb bezeichnet hier das Hinaufsteigen in den himmlischen Bereich. Die Formulierung ist im modernen Deutsch natürlich und bewahrt zugleich den räumlichen und heilsgeschichtlichen Bezug.
- source_word: τοὺς οὐρανούς
  choice: die Himmel
  rationale: Der griechische Plural wird bewahrt. Obwohl im Deutschen auch der Singular »Himmel« idiomatisch wäre, erhält »die Himmel« die biblische Ausdrucksweise und die Form des Ausgangstextes.
- source_word: λέγει δὲ αὐτός
  choice: sondern er selbst sagt
  rationale: Im Zusammenhang bildet δέ einen Gegensatz zur Aussage, David sei nicht hinaufgestiegen; »sondern« gibt diesen im Deutschen klar wieder. »Er selbst« bewahrt die intensive Funktion von αὐτός, und das Präsens führt das Schriftwort als gegenwärtig geltende Aussage ein.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Der griechische Text hat κύριος. Daher steht im Haupttext »der Herr«; dass im hebräischen Psalm an dieser Stelle der Gottesname JHWH steht, wird in der Fußnote erläutert.
- source_word: τῷ κυρίῳ μου
  choice: zu meinem Herrn
  rationale: Auch das zweite κύριος wird als »Herr« wiedergegeben. So bleiben die Wiederholung im Griechischen und die christologische Spannung in der Argumentation des Petrus erhalten.
- source_word: Κάθου
  choice: Setz dich
  rationale: Die Aufforderung wird in natürlichem, direktem Deutsch wiedergegeben. »Setz dich« ist heute idiomatischer als das gehobenere »Setze dich«.
- source_word: ἐκ δεξιῶν μου
  choice: an meine rechte Seite
  rationale: Die Wendung bezeichnet den Ehren- und Herrschaftsplatz rechts von jemandem. »An meine rechte Seite« ist im modernen Deutsch klar und vermeidet die weniger natürliche körperliche Vorstellung von »an meine rechte Hand«.
theological_decisions:
- issue: Wiedergabe der beiden Vorkommen von κύριος im Zitat aus Psalm 110,1
  choice: 'Beide werden im Haupttext mit »Herr« wiedergegeben: »Der Herr sprach zu meinem Herrn«.'
  alternative: »Der HERR sprach zu meinem Herrn«, um beim ersten Vorkommen den hebräischen Gottesnamen sichtbar zu machen.
  rationale: Der vorliegende griechische Ausgangstext verwendet an beiden Stellen κύριος. Der Haupttext folgt daher der griechischen Form, während die hebräische Grundlage mit JHWH beim ersten Vorkommen in einer Fußnote offengelegt wird. Dadurch bleiben sowohl die Quellenpriorität als auch die theologische Bedeutung des Psalmzitats gewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer Schriftzitat-Struktur. Der griechische Plural »die Himmel« und die Hervorhebung »er selbst« wurden formal bewahrt; idiomatische Wendungen wurden dort gewählt, wo eine wörtliche Übertragung im Deutschen unnatürlich wäre.
