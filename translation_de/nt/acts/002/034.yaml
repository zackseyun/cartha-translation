  source_fidelity: 'Der Entwurf gibt die Aussage des griechischen Textes insgesamt zutreffend wieder: David ist nicht in die Himmel hinaufgestiegen; Petrus führt dann Davids eigenes Psalmwort im Präsens ein. Die zweimalige Wiedergabe von κύριος mit „Herr“ wahrt die Wiederholung des griechischen Ausgangstextes.'
  naturalness: „Denn David ist nicht in die Himmel hinaufgestiegen“ ist im modernen Standarddeutsch natürlicher als die vorangestellte, stark markierte Formulierung „Denn nicht David ist ...“. Für ἐκ δεξιῶν μου ist „zu meiner Rechten“ die etablierte deutsche biblische und zugleich idiomatische Wendung; „an meine rechte Seite“ ist weniger präzise und klingt körperlich-räumlich.
  terminology: „die Himmel“, „Herr“ und „Setz dich“ sind angemessen. Die Fußnote wahrt korrekt den Unterschied zwischen dem griechischen κύριος und dem im hebräischen Psalm zugrunde liegenden Gottesnamen JHWH, ohne diesen in den Haupttext einzutragen.
  issues:
