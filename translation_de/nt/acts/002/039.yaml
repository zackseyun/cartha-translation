    issue: Der Haupttext setzt προσκαλέσηται als „rufen wird“ ins Futur und verwendet die unidiomatische Konstruktion „so vielen, wie ... rufen wird“.
    rationale: ὅσους ἂν mit Aoristkonjunktiv bezeichnet eine unbestimmte, umfassende Gruppe; ein deutsches Präsens im Relativsatz („die ... beruft“) gibt dies natürlicher wieder. Die neue Formulierung vermeidet zudem eine unnötige Zukunftsfixierung.
  - severity: low
