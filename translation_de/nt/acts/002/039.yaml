  source_fidelity: Die Grundgliederung und die zentralen Begriffe sind zutreffend wiedergegeben. Die Formulierung „so vielen, wie der Herr, unser Gott, rufen wird“ ist jedoch im Deutschen syntaktisch schwerfällig und verschiebt den indefinit-generischen Charakter von ὅσους ἂν προσκαλέσηται unnötig in ein bloßes Futur. „beruft“ gibt προσκαλέσηται als persönliches Herbeirufen/Be-rufen idiomatisch wieder, ohne „zu sich“ ausdrücklich hinzuzufügen.
  naturalness: „Euch gilt die Verheißung“ ist gutes modernes Standarddeutsch. Die Reihung „und euren Kindern und allen“ kann durch die Zusammenfassung „euch, euren Kindern und allen“ natürlicher und zugleich eng am griechischen Dativanschluss formuliert werden. Der abschließende Relativsatz wird mit „allen, die ... beruft“ klar und flüssig.
  terminology: „Verheißung“, „Kinder“, „fern“ und „der Herr, unser Gott“ sind angemessen und bewahren Register und Terminologie. Die Fußnote sollte die Deutung von εἰς μακράν nicht mit den für eine Übersetzung zu fachsprachlichen und potenziell lenkenden Ausdrücken „heilsgeschichtlich beziehungsweise bundestheologisch“ festlegen; „in ihrer Beziehung zu Gott fern“ erhält die Auslegungsoffenheit verständlicher. Bei προσκαλέσηται ist „berufen“ hier eine natürliche Wiedergabe, nicht die Einführung einer Lehre über die Art dieses Rufens.
  issues:
