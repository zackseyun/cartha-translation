source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: de
  text: Denn euch, euren Kindern und allen, die fern sind, gilt die Verheißung – allen, die der Herr, unser Gott, beruft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung „die fern sind“ kann Menschen in geografischer Entfernung, Menschen, die in ihrer Beziehung zu Gott fern sind, oder beides meinen. Wörtlich: „so viele, wie der Herr, unser Gott, herbeiruft“; auch möglich: „zu sich ruft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ bewahrt den begründenden Anschluss an die vorangehende Aufforderung und ist im Deutschen natürlich.
- source_word: ἐπαγγελία
  choice: die Verheißung
  rationale: Das Substantiv bezeichnet ausdrücklich die Verheißung, nicht unmittelbar die verheißene Gabe. „Verheißung“ wahrt zudem den biblischen Klang.
- source_word: ὑμῖν ... ἐστιν
  choice: euch gilt
  rationale: Die idiomatische deutsche Wendung gibt wieder, dass die Verheißung für die Angesprochenen bestimmt ist, ohne einen Besitzanspruch stärker auszudrücken als der griechische Text.
- source_word: τέκνοις
  choice: Kindern
  rationale: „Kinder“ bewahrt den natürlichen familiären Sinn und legt weder ein bestimmtes Alter noch ausschließlich spätere Nachkommen fest.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: allen, die fern sind
  rationale: Die Formulierung erhält sowohl die räumliche als auch die mögliche heilsgeschichtliche beziehungsweise bundestheologische Bedeutungsoffenheit.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: so vielen, wie ... rufen wird
  rationale: „So vielen, wie“ bildet den unbestimmt umfassenden Relativausdruck ab. Das Futur gibt den auf noch unbestimmte Personen gerichteten Subjunktiv im Deutschen natürlich wieder; „zu sich“ wird nicht ergänzt, da es nicht ausdrücklich im Text steht.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: der Herr, unser Gott
  rationale: Die appositionale Gottesbezeichnung und das Possessivpronomen werden unmittelbar bewahrt.
theological_decisions:
- issue: Bedeutungsumfang von „denen, die fern sind“
  choice: Die Wendung bleibt weit und unbestimmt.
  alternative: Nur geografisch entfernte Juden oder ausschließlich Heiden.
  rationale: Der Ausdruck kann geografische Entfernung, heilsgeschichtliche beziehungsweise bundestheologische Ferne oder beides bezeichnen. Der Vers selbst erzwingt keine Verengung.
- issue: Art des göttlichen Rufens
  choice: Schlicht „rufen wird“, ohne nähere systematische Bestimmung.
  alternative: „wirksam berufen wird“ oder „einladen wird“.
  rationale: Der griechische Text nennt Gottes Rufen, erklärt hier aber nicht dessen genaue Wirkweise. Die Übersetzung vermeidet daher konfessionelle Festlegungen.
- issue: Beziehung des abschließenden Relativsatzes zum Vorhergehenden
  choice: Durch Gedankenstrich als erläuternde beziehungsweise begrenzende Bestimmung kenntlich gemacht.
  alternative: Der Relativsatz könnte allein auf „alle, die fern sind“ bezogen oder als nähere Bestimmung aller zuvor genannten Gruppen verstanden werden.
  rationale: Die syntaktische Reichweite ist auslegungsfähig. Die Interpunktion macht den qualifizierenden Charakter sichtbar, ohne eindeutig festzulegen, dass nur die zuletzt genannte Gruppe betroffen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verheißung“ und „der Herr, unser Gott“ erhalten den biblischen Sprachklang; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich.
