  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: de
  text: Plötzlich kam vom Himmel ein Brausen wie von einem heftig dahinfahrenden Wind[a], und es erfüllte das ganze Haus, in dem sie saßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Geräusch wie von einer kraftvoll bewegten Luftströmung“. Das Griechische vergleicht das Geräusch mit kraftvoll bewegter Luft; es sagt nicht ausdrücklich, dass tatsächlich Wind da war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: kam
  rationale: Gibt die ereignishafte Konstruktion ἐγένετο … ἦχος im Deutschen idiomatisch wieder, ohne sie zum bloßen Vorhandensein abzuflachen.
- source_word: ἄφνω
  choice: plötzlich
  rationale: Drückt die unvermittelte, abrupte Art des Geschehens in natürlichem Standarddeutsch aus.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Bewahrt den in Lukas–Apostelgeschichte naheliegenden himmlischen Ursprung; „vom Himmel“ ist im Deutschen natürlicher als „aus dem Himmel“.
- source_word: ἦχος
  choice: ein Brausen
  rationale: Bezeichnet hier einen hörbaren, kräftigen Laut und verbindet sich natürlich mit dem folgenden Windvergleich. „Geräusch“ wäre neutraler, aber weniger anschaulich; dass kein tatsächlicher Wind behauptet wird, bleibt durch „wie von“ gewahrt.
- source_word: ὥσπερ
  choice: wie von
  rationale: Kennzeichnet klar einen Vergleich und setzt das Brausen nicht mit einem tatsächlichen Wind gleich.
- source_word: φερομένης
  choice: dahinfahrenden
  rationale: Gibt die Bewegung des Getragen- beziehungsweise Dahingetriebenwerdens in Verbindung mit bewegter Luft idiomatisch und würdig wieder.
- source_word: πνοῆς
  choice: Wind
  rationale: Im Zusammenhang mit βιαίας und dem hörbaren Vergleich bezeichnet πνοή am ehesten bewegte Luft beziehungsweise Wind, nicht menschlichen Atem.
- source_word: βιαίας
  choice: heftig
  rationale: Vermittelt die Kraft und Gewalt von βίαιος in natürlichem Deutsch, ohne zwingend zerstörerische Gewalt anzudeuten.
- source_word: ἐπλήρωσεν
  choice: es erfüllte
  rationale: Behält das Brausen als grammatischen Bezugspunkt bei und gibt die vollständige Ausbreitung im Haus prägnant wieder.
- source_word: ὅλον τὸν οἶκον
  choice: das ganze Haus
  rationale: Natürliche, genaue Wiedergabe der durch ὅλον bezeichneten Gesamtheit.
- source_word: οὗ ἦσαν καθήμενοι
  choice: in dem sie saßen
  rationale: Gibt den Ort und die andauernde Körperhaltung in klarem modernem Deutsch wieder.
theological_decisions:
- issue: Art des mit Wind verglichenen Phänomens
  choice: Der Haupttext spricht von einem Brausen „wie von“ einem heftig dahinfahrenden Wind.
  alternative: Ein tatsächlicher heftiger Wind erfüllte das Haus.
  rationale: ὥσπερ markiert ausdrücklich einen Vergleich. Die Übersetzung wahrt daher die Möglichkeit, dass nur ein windähnliches Brausen beschrieben wird, und behauptet keinen tatsächlichen Wind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Brausen“ bewahrt die akustische Anschaulichkeit, während „wie von“ die Vergleichsstruktur und damit die sachliche sowie theologische Zurückhaltung des griechischen Textes deutlich macht.
