  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/035.yaml
  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: de
  text: bis ich deine Feinde zum Schemel für deine Füße mache.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »bis ich deine Feinde als Schemel deiner Füße setze«.'
    reason: lexical_alternative
  - marker: b
    text: Dieses Zitat stammt aus Psalm 110,1.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: bis
  rationale: Die Verbindung bezeichnet den zukünftigen Zeitpunkt, bis zu dem die vorausgehende Aussage gilt. Das schlichte »bis« gibt diese zeitliche Bedeutung im Deutschen natürlich wieder.
- source_word: θῶ
  choice: mache
  rationale: τίθημι bedeutet grundsätzlich »setzen, stellen, legen«; zusammen mit dem prädikativen Akkusativ ὑποπόδιον wird die Wendung im Deutschen idiomatisch mit »zum Schemel machen« wiedergegeben.
- source_word: τοὺς ἐχθρούς σου
  choice: deine Feinde
  rationale: Die direkte Wiedergabe bewahrt sowohl den persönlichen Bezug als auch den königlich-politischen Sinn des Psalmzitats.
- source_word: ὑποπόδιον
  choice: Schemel
  rationale: »Schemel« ist die geläufige deutsche Bezeichnung für einen Fußschemel und erhält das konkrete Bild der Unterwerfung.
- source_word: τῶν ποδῶν σου
  choice: für deine Füße
  rationale: Der Genitiv gehört zur festen Wendung »Schemel der/für die Füße«. »Für deine Füße« klingt im modernen Deutsch natürlich und bewahrt das Bild, ohne es erklärend als »unter deine Füße« aufzulösen.
theological_decisions:
- issue: Königliches Unterwerfungsbild im Zitat aus Psalm 110,1
  choice: Das konkrete Bild »zum Schemel für deine Füße« bleibt erhalten.
  alternative: bis ich deine Feinde vollständig unter deine Herrschaft zwinge
  rationale: Die bildhafte Formulierung trägt den königlichen und messianischen Zusammenhang des Psalmzitats. Eine ausdeutende Umschreibung würde die Metapher auflösen und mehr Interpretation in den Haupttext eintragen, als der griechische Wortlaut ausdrücklich enthält.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die im Deutschen geläufige Bildform »zum Schemel für deine Füße machen« wahrt die Nähe zum griechischen Wortlaut und zugleich einen natürlichen Satzbau.
