  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: de
  text: In Jerusalem lebten Juden[a], fromme Männer aus jedem Volk unter dem Himmel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäer“. Hier spricht die Herkunft aus jedem Volk jedoch für „Juden“ im umfassenderen ethnisch-religiösen Sinn.'
    reason: alternative_reading
  - marker: b
    text: „Unter dem Himmel“ ist eine biblische Wendung für „auf der ganzen Welt“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: Es lebten aber
  rationale: δέ ist ein schwaches erzählerisches Bindewort. „Aber“ hält den Anschluss sichtbar, ohne einen starken Gegensatz zu erzwingen; zusammen mit κατοικοῦντες ergibt sich im Deutschen natürlich „es lebten“.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: in Jerusalem … lebten
  rationale: κατοικέω bezeichnet das Wohnen beziehungsweise ansässige Leben an einem Ort, nicht bloß einen vorübergehenden Aufenthalt.
- source_word: Ἰουδαῖοι
  choice: Juden
  rationale: Der Zusammenhang mit der Herkunft aus jedem Volk spricht für die umfassende ethnisch-religiöse Bedeutung und nicht nur für Bewohner Judäas.
- source_word: ἄνδρες εὐλαβεῖς
  choice: fromme Männer
  rationale: ἄνδρες bezeichnet ausdrücklich Männer; εὐλαβεῖς beschreibt ehrfürchtige, gewissenhafte Frömmigkeit. „Fromme Männer“ ist präzise und allgemein verständlich.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: aus jedem Volk
  rationale: ἔθνος kann hier Völker beziehungsweise ethnisch-geografische Herkunftsgruppen bezeichnen. „Volk“ vermeidet die moderne staatsrechtliche Engführung von „Nation“.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: unter dem Himmel
  rationale: Die wörtliche biblische Wendung bleibt erhalten; sie bezeichnet idiomatisch die ganze Welt.
theological_decisions:
- issue: Bedeutung von Ἰουδαῖοι
  choice: Juden
  alternative: Judäer
  rationale: Da die Männer aus jedem Volk stammen und sich in Jerusalem aufhalten, sind Diasporajuden gemeint; die rein regionale Wiedergabe „Judäer“ wäre hier zu eng.
- issue: Geschlechtsspezifische Wiedergabe von ἄνδρες
  choice: Männer
  alternative: Menschen
  rationale: Das griechische Wort ist ausdrücklich maskulin. Die Übersetzung bewahrt diese Angabe, ohne über den Text hinauszugehen.
- issue: Reichweite von „unter dem Himmel“
  choice: Bildhafte Wendung beibehalten
  alternative: aus der ganzen Welt
  rationale: Die traditionelle kosmische Ausdrucksweise bleibt sichtbar, während die Fußnote ihre idiomatische Bedeutung erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt die appositionelle Näherbestimmung „fromme Männer“, bleibt aber gut lesbar. Das schwache δέ wird mit „aber“ wiedergegeben, ohne einen scharfen Gegensatz zu behaupten.
