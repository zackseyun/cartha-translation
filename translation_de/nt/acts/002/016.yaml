  text: ἀλλὰ τοῦτό ἐστιν τὸ εἰρημένον διὰ τοῦ προφήτου Ἰωήλ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/016.yaml
  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: de
  text: 'Sondern das ist es, was durch den Propheten Joel gesagt worden ist:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sondern
  rationale: Die Konjunktion korrigiert die vorausgehende Fehldeutung der Menge. Nach der impliziten Verneinung in Vers 15 gibt „sondern“ den Gegensatz im Deutschen natürlich wieder.
- source_word: τοῦτό ἐστιν
  choice: hier geschieht
  rationale: Wörtlich steht „dies ist“. Im Deutschen verbindet „hier geschieht, was …“ das gegenwärtige Geschehen idiomatisch mit dem angekündigten Prophetenwort, ohne die Aussage als bloße Bedeutungserklärung abzuschwächen.
- source_word: τὸ εἰρημένον
  choice: was … gesagt worden ist
  rationale: Das substantivierte Perfekt-Passiv-Partizip bezeichnet das früher ausgesprochene und weiterhin maßgebliche Wort. Das deutsche Perfektpassiv bewahrt sowohl die passive Form als auch den fortwirkenden Bezug.
- source_word: διὰ τοῦ προφήτου Ἰωήλ
  choice: durch den Propheten Joel
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise mittelbare Urheberschaft. „Durch“ wahrt Joels Rolle als prophetischer Vermittler, ohne ihn ausdrücklich als letzte Quelle der Botschaft darzustellen.
theological_decisions:
- issue: Verhältnis des Pfingstgeschehens zur Joel-Prophetie
  choice: „hier geschieht, was … gesagt worden ist“
  alternative: „dies ist, was … gesagt wurde“
  rationale: Die Wiedergabe stellt die von Petrus behauptete Entsprechung zwischen dem gegenwärtigen Ereignis und dem Prophetenwort fest, legt aber nicht über den Vers hinaus fest, ob damit jede Einzelheit der Prophetie vollständig und abschließend erfüllt ist.
- issue: Prophetische Vermittlung in διὰ τοῦ προφήτου Ἰωήλ
  choice: „durch den Propheten Joel“
  alternative: „vom Propheten Joel“
  rationale: „Durch“ erhält die im griechischen Ausdruck erkennbare Vermittlerrolle Joels und lässt die Frage nach dem letzten Urheber offen, statt sie im Wortlaut ausdrücklich auszuformulieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Sondern“ nimmt die Korrektur aus dem unmittelbaren Zusammenhang auf; „hier geschieht“ vermeidet die im Deutschen schwerfällige Gleichsetzung „dies ist, was“, während die Fußnote den griechischen Satzbau sichtbar hält.
