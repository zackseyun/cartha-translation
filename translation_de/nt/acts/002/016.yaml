  naturalness: „Sondern das ist es, was ... gesagt worden ist“ ist modernes, verständliches Standarddeutsch und bewahrt die Satzfunktion des griechischen Originals. Es ist etwas formnäher als „hier geschieht“, aber weder ungrammatisch noch unnatürlich.
