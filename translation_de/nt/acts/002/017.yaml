id: ACT.2.17
reference: Acts 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: de
  text: 'Und es wird geschehen in den letzten Tagen, sagt Gott: Ich werde von meinem Geist auf alle Menschen[a] ausgießen. Eure Söhne und eure Töchter werden prophetisch reden, eure jungen Männer werden Visionen sehen, und eure alten Männer werden Träume haben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf alles Fleisch“; eine prophetische Wendung für alle Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „werden Träume träumen“.'
    reason: source_form
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: in den letzten Tagen
  rationale: Die geläufige eschatologische Wendung wird natürlich und ohne nähere zeitliche Festlegung wiedergegeben.
- source_word: ἐκχεῶ ἀπὸ τοῦ πνεύματός μου
  choice: werde ich von meinem Geist ... ausgießen
  rationale: Bewahrt sowohl das Bild des Ausgießens als auch die Präposition ἀπό („von“), ohne eine Teilung des Geistes zu behaupten.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: auf alle Menschen
  rationale: Die prophetisch-semitische Wendung bezeichnet hier Menschen umfassend; im Deutschen vermittelt „alle Menschen“ den gemeinten Sinn natürlicher, während die wörtliche Bildsprache in der Fußnote erhalten bleibt.
- source_word: προφητεύσουσιν
  choice: werden prophetisch reden
  rationale: Gibt die Tätigkeit verständlich wieder, ohne sie auf bloße Zukunftsvorhersage zu verengen.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: eure jungen Männer
  rationale: Bewahrt die männliche Bezeichnung und den altersbezogenen Gegensatz zu den alten Männern.
- source_word: ὁράσεις ὄψονται
  choice: werden Visionen sehen
  rationale: Natürliche deutsche Wiedergabe der griechischen Verbindung aus „Visionen“ und „sehen“.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: eure alten Männer
  rationale: Der Zusammenhang stellt Altersgruppen einander gegenüber; „Älteste“ könnte fälschlich ein Amt bezeichnen.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: werden Träume haben
  rationale: Idiomatisches modernes Deutsch für die griechische figura etymologica; die formnähere Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Reichweite von ἐπὶ πᾶσαν σάρκα
  choice: alle Menschen
  alternative: alles Fleisch
  rationale: Die Wendung schließt Menschen über die anschließend genannten Geschlechts- und Altersgruppen hinweg ein. Die Übersetzung verdeutlicht diese Breite, ohne eine Aussage über ausnahmslos jedes Individuum hinzuzufügen.
- issue: Referent von πνεῦμα
  choice: Geist mit Großschreibung
  alternative: Geist mit Kleinschreibung
  rationale: Da Gott von „meinem Geist“ spricht, bezeichnet das Wort im Kontext Gottes Geist; die Großschreibung entspricht dem deutschen theologischen Sprachgebrauch.
- issue: Bedeutung von προφητεύω
  choice: prophetisch reden
  alternative: weissagen
  rationale: „Prophetisch reden“ lässt Art und Inhalt des Redens offen und vermeidet die heute häufige Verengung von „weissagen“ auf Zukunftsvorhersagen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und die parallelen Gruppen des griechischen Textes bleiben erkennbar; schwer verständliche prophetische Idiomatik wird im Haupttext sinngetreu und in den Fußnoten formnäher wiedergegeben.
