    issue: „weithin sichtbare“ für ἐπιφανῆ
    rationale: Die Formulierung legt eine räumlich weithin sichtbare Erscheinung nahe. ἐπιφανής bedeutet hier eher hervortretend, offenkundig, bemerkenswert oder herrlich; die räumliche Nuance ist nicht im griechischen Wort angelegt.
  - severity: low
