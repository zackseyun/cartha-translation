  source_fidelity: Die Grundstruktur, die drastische Bildsprache und das Zeitverhältnis sind zutreffend wiedergegeben. „wird sich verwandeln“ ist jedoch reflexiv und gibt die passive Form μεταστραφήσεται weniger genau wieder. „weithin sichtbare“ verengt ἐπιφανής zudem auf räumliche Sichtbarkeit; das Wort bezeichnet eher etwas Hervortretendes, Offenkundiges oder Herrliches/Beeindruckendes.
  naturalness: „Die Sonne wird in Finsternis verwandelt werden und der Mond in Blut“ ist trotz der Passivform im prophetischen Register gut verständlich und erhält den griechischen Parallelismus. „Der große und herrliche Tag des Herrn“ ist idiomatisches, würdiges modernes Standarddeutsch.
  terminology: „Tag des Herrn“ bewahrt die etablierte prophetische Wendung ἡμέρα κυρίου. „Herrliche“ ist für ἐπιφανῆ als Haupttext im Einklang mit der englischen Audit-Entscheidung möglich; die Fußnote sichert die Bedeutungsnuancen „offenkundig“ und „hervorragend/bedeutend“, ohne eine Auslegung festzulegen.
