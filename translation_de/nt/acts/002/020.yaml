revisions:
- from: Die Sonne wird sich in Finsternis verwandeln und der Mond in Blut, bevor der große und weithin sichtbare[a] Tag des Herrn kommt.
  to: Die Sonne wird in Finsternis verwandelt werden und der Mond in Blut, bevor der große und herrliche[a] Tag des Herrn kommt.
  rationale: Die Revision bewahrt die passive Transformationsbildsprache und korrigiert die zu enge räumliche Lesart von ἐπιφανής. Die traditionelle, im modernen Deutsch weiterhin verständliche Wendung „große und herrliche Tag des Herrn“ entspricht dem erhöhten prophetischen Register; die Fußnote hält weitere lexikalisch vertretbare Nuancen offen.
