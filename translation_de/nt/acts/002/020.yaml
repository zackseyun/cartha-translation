source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: de
  text: Die Sonne wird in Finsternis verwandelt werden und der Mond in Blut, bevor der große und herrliche[a] Tag des Herrn kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »offenkundige«, »bedeutende« oder »eindrucksvolle«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: wird sich verwandeln
  rationale: Das deutsche reflexive Passiväquivalent gibt den zukünftigen Zustandswechsel natürlich wieder, ohne dessen Ursache näher zu bestimmen.
- source_word: εἰς σκότος
  choice: in Finsternis
  rationale: Die Verbindung mit εἰς bezeichnet den eintretenden Zustand; „in Finsternis“ bewahrt das Übergangsbild und den prophetischen Ton.
- source_word: εἰς αἷμα
  choice: in Blut
  rationale: Die bewusst drastische Bildsprache des Griechischen bleibt erhalten; eine Deutung als bloß „blutrot“ wird vermieden.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: bevor … kommt
  rationale: Diese natürliche deutsche Konstruktion gibt das zeitliche Verhältnis präzise wieder.
- source_word: ἡμέραν κυρίου
  choice: Tag des Herrn
  rationale: Die feste prophetische Wendung bleibt erhalten und wird nicht mit einer Bezeichnung für den Sonntag verwechselt.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ entspricht κύριος und wahrt zugleich den alttestamentlichen Anklang der zitierten Joel-Stelle.
- source_word: μεγάλην
  choice: große
  rationale: „Groß“ ist die direkte, im prophetischen Zusammenhang angemessene Wiedergabe.
- source_word: ἐπιφανῆ
  choice: weithin sichtbare
  rationale: ἐπιφανής bezeichnet hier vor allem etwas deutlich Erscheinendes, Sichtbares oder Eindrucksvolles. „Weithin sichtbar“ ist modernes, würdiges Deutsch und bewahrt diesen Aspekt, ohne die Bedeutung ausschließlich als „herrlich“ festzulegen.
theological_decisions:
- issue: Die prophetische Wendung ἡμέραν κυρίου im Joel-Zitat innerhalb der Rede des Petrus
  choice: Tag des Herrn
  alternative: Tag, der dem Herrn gehört / Herrentag
  rationale: „Tag des Herrn“ bewahrt den etablierten prophetischen Ausdruck für Gottes entscheidendes Eingreifen und vermeidet eine vorschnelle Gleichsetzung mit dem christlichen Sonntag.
- issue: Die Bedeutung von ἐπιφανῆ im endzeitlichen Zusammenhang
  choice: weithin sichtbare
  alternative: herrliche / offenbar werdende / eindrucksvolle
  rationale: Das Adjektiv kann Sichtbarkeit, offenkundiges Erscheinen oder eindrucksvolle Herrlichkeit bezeichnen. Die Hauptfassung hebt den im Wort angelegten Erscheinungscharakter hervor; die Fußnote hält die weitere Bedeutungsbreite offen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Klang. Die parallele Bildsprache („Sonne … Finsternis“, „Mond … Blut“) und die traditionelle Wendung „Tag des Herrn“ bleiben erhalten.
