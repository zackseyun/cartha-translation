  source_fidelity: Der Haupttext gibt die erstaunte Frage, die distributive Aussage („jeder von uns“) und die Bedeutung von ἰδίᾳ διαλέκτῳ angemessen wieder. Das ergänzte „sie“ ist aus dem unmittelbaren Kontext verständlich und im Deutschen zur klaren Ergänzung von „hört“ vertretbar. Die Fußnote sollte jedoch bei einer als wörtlicher gekennzeichneten Alternative die pluralische Perspektive des griechischen Textes („unserer/unserem“, „wir“) beibehalten, statt sie in die distributive Singularform des Haupttexts umzusetzen.
