base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: de
  text: Und wie kommt es, dass jeder von uns sie in seiner eigenen Muttersprache hört?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »… in unserem eigenen Dialekt, in dem wir geboren wurden.«'
    reason: lexikalische Alternative und Bewahrung der ausdrücklichen Form des griechischen Relativsatzes
lexical_decisions:
- source_word: πῶς
  choice: wie kommt es, dass
  rationale: Die Wendung gibt die erstaunte Frage idiomatisch und zugleich quellennah wieder.
- source_word: ἡμεῖς … ἕκαστος
  choice: jeder von uns
  rationale: Diese distributive Formulierung bewahrt sowohl die ausdrückliche Einbeziehung der Sprecher als auch den Bezug auf jeden Einzelnen.
- source_word: ἀκούομεν
  choice: hört
  rationale: Das Verb wird im Deutschen wegen des distributiven Subjekts »jeder von uns« im Singular wiedergegeben. Das ergänzte Pronomen »sie« macht das im Kontext vorausgesetzte Objekt verständlich.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν
  choice: in seiner eigenen Muttersprache
  rationale: »Muttersprache« vermittelt im heutigen Deutsch knapp und natürlich die durch den Relativsatz erläuterte Sprache beziehungsweise Sprechweise, die jemand von Geburt und Herkunft her kennt. »eigenen« gibt ἰδίᾳ wieder.
- source_word: διαλέκτῳ
  choice: Sprache
  rationale: διάλεκτος kann hier »Sprache« oder »Dialekt« bezeichnen. Im Haupttext vermeidet »Muttersprache« die heute möglicherweise zu enge, fachsprachliche Bedeutung von »Dialekt«; die Alternative bleibt in der Fußnote sichtbar.
