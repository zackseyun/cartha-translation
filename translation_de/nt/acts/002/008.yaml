translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die erstaunte Frage klingt natürlich; die mögliche Bedeutung »Dialekt« und die wörtliche Geburtsformulierung werden nicht unterdrückt, sondern in der Fußnote bewahrt.
