id: ACT.2.36
reference: Acts 2:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: de
  text: 'Darum soll das ganze Haus Israel mit Gewissheit wissen: Gott hat ihn zum Herrn und zum Messias gemacht – diesen Jesus, den ihr gekreuzigt habt.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus«. Das griechische Χριστός (Christos) ist hier als Titel gebraucht und bedeutet »Messias«.'
    reason: alternative_reading
  - marker: b
    text: Die Aussage steht im Zusammenhang mit Jesu Auferweckung und Erhöhung (Apostelgeschichte 2,32–35). Das griechische Verb kann je nach Zusammenhang auch mit »eingesetzt« oder »bestimmt« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: mit Gewissheit
  rationale: Gibt die nachdrücklich betonte Sicherheit der Aussage wieder und klingt im Deutschen würdig und verständlich.
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Beweisführung über Auferstehung und Erhöhung Jesu.
- source_word: γινωσκέτω
  choice: soll ... wissen
  rationale: Bewahrt den Aufforderungscharakter des Imperativs, ohne ihn unnötig zu verschärfen.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: das ganze Haus Israel
  rationale: Erhält die biblische, korporative Bezeichnung für Israel, statt sie zu »ganz Israel« zu verflachen.
- source_word: κύριον
  choice: Herrn
  rationale: Bewahrt den Hoheitstitel und seinen Bezug zum unmittelbar zuvor angeführten Schriftwort.
- source_word: Χριστόν
  choice: Messias
  rationale: Im an Israel gerichteten Zusammenhang steht die Titelfunktion im Vordergrund; »Messias« macht diese Bedeutung unmittelbar verständlich.
- source_word: ἐποίησεν
  choice: hat ... gemacht
  rationale: Gibt den gewöhnlichen lexikalischen Sinn direkt wieder; die deutsche Konstruktion verlangt idiomatisch »zum Herrn ... zum Messias gemacht«.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: diesen Jesus
  rationale: Bewahrt die hinweisende und nachdrückliche Identifizierung des geschichtlichen Jesus.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: den ihr gekreuzigt habt
  rationale: Gibt die direkte Anklage und die ausdrückliche Hervorhebung des angesprochenen »ihr« knapp wieder.
theological_decisions:
- issue: Bedeutung von »Gott hat ihn ... zum Herrn und zum Messias gemacht«
  choice: Die Formulierung wird im Haupttext lexikalisch direkt wiedergegeben; eine Fußnote erläutert ihren Bezug auf Jesu Erhöhung und öffentliche Einsetzung.
  alternative: »Gott hat ihn zum Herrn und Messias eingesetzt« oder eine Lesart als Veränderung seines Wesens.
  rationale: »Gemacht« bewahrt die sprachliche Kraft von ἐποίησεν. Der Zusammenhang handelt von Auferweckung und Erhöhung; eine stärker deutende Wiedergabe wie »eingesetzt« würde diese Auslegung bereits in den Haupttext eintragen, während eine Wesensveränderung vom Vers nicht ausgesagt wird.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: In der Rede an das Haus Israel ist Χριστός deutlich als Titel gebraucht. Die geläufige Form »Christus« bleibt als Übersetzungsalternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der biblische Ausdruck »das ganze Haus Israel« bleibt erhalten. Der Gedankenstrich stellt das nachgestellte, betonte »diesen Jesus« heraus; die direkte Anklage »den ihr gekreuzigt habt« bleibt ungemildert.
