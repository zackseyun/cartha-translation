    issue: Fußnote b enthält eine konfessionell-theologische Absicherung, die der Vers selbst nicht ausdrücklich aussagt.
    rationale: Der Kontext von Apg 2 spricht von Jesu Auferweckung und Erhöhung; daher kann die Wendung im Rahmen seiner Erhöhung verstanden werden. Eine Aussage über eine Veränderung oder Nichtveränderung seines „göttlichen Wesens“ wird jedoch weder durch ἐποίησεν noch durch den unmittelbaren Satz ausdrücklich formuliert. Die Fußnote sollte die Kontextbeziehung erläutern, ohne eine ontologische Kontroverse zu entscheiden.
