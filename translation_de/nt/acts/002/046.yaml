id: ACT.2.46
reference: Acts 2:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: de
  text: Tag für Tag hielten sie sich einmütig im Tempelbereich[a] auf. In den Häusern brachen sie Brot[b] und nahmen ihre Mahlzeiten[c] mit Jubel und schlichtem Herzen[d] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die Tempelanlage, nicht speziell das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: „Brot brechen“ kann gewöhnliche gemeinsame Mahlzeiten bezeichnen; manche verstehen die Wendung hier zugleich als Hinweis auf das Herrenmahl.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Nahrung“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „mit aufrichtigem Herzen“ oder „mit großzügigem Herzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die distributive Wendung bezeichnet ein fortgesetztes tägliches Geschehen; „Tag für Tag“ gibt diesen Verlauf natürlich wieder.
- source_word: προσκαρτεροῦντες
  choice: kamen … zusammen
  rationale: Das Partizip beschreibt hier ihr beharrliches, regelmäßiges Zusammenkommen am folgenden Ort; die fortlaufende Bedeutung wird zusammen mit „Tag für Tag“ idiomatisch ausgedrückt.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Das Wort bezeichnet gemeinsames Wollen und innere Übereinstimmung, ohne vollständige Gleichförmigkeit zu behaupten.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempelbereich
  rationale: ἱερόν meint die gesamte Tempelanlage und nicht speziell das innere Heiligtum.
- source_word: κλῶντές … ἄρτον
  choice: brachen sie das Brot
  rationale: Die geläufige Wendung bleibt erhalten und wird weder ausschließlich als gewöhnliche Mahlzeit noch ausdrücklich als Herrenmahl festgelegt.
- source_word: κατ’ οἶκον
  choice: in den Häusern
  rationale: Die distributive Form bezeichnet das Geschehen in verschiedenen Privathäusern; „in den Häusern“ ist im Deutschen natürlicher als „von Haus zu Haus“.
- source_word: μετελάμβανον τροφῆς
  choice: nahmen ihre Mahlzeiten … ein
  rationale: Die unvollendete Verbform beschreibt wiederholtes gemeinsames Essen; „Mahlzeiten einnehmen“ ist idiomatisch und bildet τροφή im Kontext konkret ab.
- source_word: ἐν ἀγαλλιάσει
  choice: mit Jubel
  rationale: ἀγαλλίασις bezeichnet ausgeprägte, frohlockende Freude; „Jubel“ bewahrt die stärkere Färbung besser als bloße „Freude“.
- source_word: ἀφελότητι καρδίας
  choice: mit schlichtem Herzen
  rationale: Die seltene Wendung kann Schlichtheit, Aufrichtigkeit oder ungekünstelte Offenheit bezeichnen. Die nahe Wiedergabe bewahrt diese Bedeutungsbreite.
theological_decisions:
- issue: Ob „das Brot brechen“ ausdrücklich das Herrenmahl bezeichnet
  choice: Die weitere Wendung „das Brot brechen“ bleibt im Haupttext stehen.
  alternative: Die Wendung ausschließlich auf gewöhnliche gemeinsame Mahlzeiten oder ausdrücklich auf das Herrenmahl beziehen.
  rationale: Der unmittelbare Zusammenhang spricht vom Essen, doch die lukanische Wendung kann zugleich einen Bezug zur christlichen Mahlgemeinschaft einschließlich des Herrenmahls anklingen lassen. Der Text sollte diese Spannung nicht entscheiden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur wurde für natürliches Deutsch in zwei Hauptsätze gegliedert. „Tempelbereich“ vermeidet die irreführende Beschränkung auf das innere Heiligtum; die seltene Herzenswendung bleibt bewusst offen.
