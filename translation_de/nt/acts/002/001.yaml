source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: de
  text: Als der Pfingsttag sich erfüllte[a], waren sie alle zusammen an einem Ort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als der Pfingsttag vollständig gekommen war.“'
    reason: 'Lexikalisch-grammatische Alternative: Die griechische Formulierung kann das Sich-Erfüllen des Tages oder dessen vollständiges Eintreten hervorheben.'
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: sich seiner Vollendung näherte
  rationale: Der präsentische Passivinfinitiv in der Zeitkonstruktion ἐν τῷ bezeichnet einen im Gang befindlichen Vorgang. Die Formulierung bewahrt diese Verlaufsnuance und klingt im Deutschen natürlicher als eine wörtliche passive Wiedergabe.
- source_word: πεντηκοστῆς
  choice: Pfingsttag
  rationale: Πεντηκοστή ist im neutestamentlichen Kontext die geläufige griechische Bezeichnung des jüdischen Wochenfestes; „Pfingsttag“ ist dafür die etablierte und verständliche deutsche Entsprechung.
- source_word: πάντες
  choice: alle
  rationale: Das Wort bezeichnet die Gesamtheit der aus dem vorherigen Zusammenhang erschlossenen Gruppe.
- source_word: ὁμοῦ
  choice: gemeinsam
  rationale: Das Adverb bezeichnet das Zusammensein der Gruppe. „Gemeinsam“ gibt diese soziale Nuance klar wieder.
- source_word: ἐπὶ τὸ αὐτό
  choice: am selben Ort
  rationale: Die Wendung kann Zusammengehörigkeit oder räumliches Beisammensein ausdrücken. Da ὁμοῦ bereits das gemeinsame Zusammensein bezeichnet, bewahrt „am selben Ort“ die mögliche räumliche Nuance ohne bloße Wiederholung.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts von ἦσαν
  choice: sie waren alle
  alternative: alle waren
  rationale: Das griechische Subjekt wird aus dem vorhergehenden Erzählzusammenhang erschlossen. Das deutsche Pronomen sorgt für natürlichen Satzbau, ohne die betreffende Gruppe genauer festzulegen.
- issue: Zeitliche Bedeutung von συμπληροῦσθαι
  choice: der Tag näherte sich seiner Vollendung
  alternative: der Tag war vollständig gekommen
  rationale: Die gewählte Fassung erhält den durativen beziehungsweise prozesshaften Aspekt der griechischen Konstruktion und entscheidet nicht vorschnell für eine ausschließlich abgeschlossene Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Pfingsttag“ ist allgemein verständlich; „sich seiner Vollendung näherte“ hält die ungewöhnliche, theologisch offene Zeitformulierung des griechischen Textes erkennbar, während die Fußnote die traditionelle resultative Deutung nennt.
