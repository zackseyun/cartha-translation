id: ACT.2.18
reference: Acts 2:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: de
  text: Ja, sogar über meine Sklaven und Sklavinnen werde ich in jenen Tagen von meinem Geist ausgießen[a], und sie werden prophetisch reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich aus meinem Geist ausgießen“. Das Griechische sagt wörtlich „von meinem Geist“ und kann dabei eine partitive Nuance haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: Ja, sogar
  rationale: Die Partikelverbindung setzt einen nachdrücklichen, steigernden Akzent. „Ja, sogar“ gibt diese Hervorhebung im Deutschen natürlich wieder.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: über meine Sklaven und über meine Sklavinnen
  rationale: Die maskuline und feminine Form werden ausdrücklich unterschieden. „Sklaven“ und „Sklavinnen“ bewahren zudem den im Kontext bedeutsamen niedrigen gesellschaftlichen Status.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: in jenen Tagen
  rationale: Die Wendung gibt sowohl den zeitlichen Bezug als auch die demonstrative Bestimmung knapp und idiomatisch wieder.
- source_word: ἐκχεῶ ἀπὸ τοῦ πνεύματός μου
  choice: werde ich von meinem Geist ausgießen
  rationale: „Ausgießen“ erhält das Bild reichlicher göttlicher Gabe; „von meinem Geist“ bildet die Präposition ἀπό ab und lässt deren partitive beziehungsweise herkunftsbezogene Nuance offen.
- source_word: προφητεύσουσιν
  choice: sie werden prophetisch reden
  rationale: Die Formulierung gibt die Tätigkeit verständlich wieder, ohne sie auf bloße Zukunftsvorhersage zu verengen.
theological_decisions:
- issue: Wiedergabe von δοῦλος und δούλη im Zusammenhang der Geistausgießung
  choice: Sklaven und Sklavinnen
  alternative: Diener und Dienerinnen
  rationale: Die ausdrückliche Nennung beider Geschlechter und der niedrige soziale Rang tragen zur Aussage über die umfassende Geistausgießung bei. „Sklaven“ bewahrt diese soziale Schärfe deutlicher als „Diener“.
- issue: Wiedergabe von ἀπὸ τοῦ πνεύματός μου
  choice: von meinem Geist
  alternative: von meinem Geist etwas / aus meinem Geist
  rationale: Die gewählte Form hält sich eng an ἀπό und bewahrt die Spannung zwischen einer partitiven und einer herkunftsbezogenen Lesart, ohne eine weitergehende Aussage über das Wesen des Geistes einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Paarung „Sklaven und Sklavinnen“ erhält sowohl den sozialen Nachdruck als auch die ausdrückliche Geschlechterdifferenz des griechischen Textes. „Prophetisch reden“ ist für heutige Leser verständlicher als „prophezeien“ und vermeidet die Verengung auf Vorhersagen.
