id: ACT.2.26
reference: Acts 2:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: de
  text: 'Darum freute sich mein Herz, und meine Zunge jubelte; ja, auch mein Fleisch wird in Hoffnung wohnen.[a]


    [a] Oder: »Auch mein Leib wird in Hoffnung ruhen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch mein Leib wird in Hoffnung ruhen.«'
    reason: Lexikalische und bildliche Alternative für ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι; »Leib« und »ruhen« verdeutlichen den körperlichen Bezug, deuten das Wohnbild aber stärker.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Die Wendung bezeichnet den Grund für die folgende Freude. »Darum« gibt den kausalen Zusammenhang knapp und natürlich wieder.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: freute sich mein Herz
  rationale: Die mediale Bedeutung des formal passiven Aorists wird im Deutschen idiomatisch reflexiv wiedergegeben; »Herz« bewahrt das biblische Bild für den inneren Menschen.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: meine Zunge jubelte
  rationale: Das Verb bezeichnet überschwängliche Freude. »Jubelte« bringt diese Stärke zum Ausdruck, während »Zunge« das poetische Bild des griechischen Textes erhält.
- source_word: ἔτι δὲ καὶ
  choice: ja, auch
  rationale: Die Formulierung führt den Gedanken weiter und hebt das Folgende hervor. »Ja, auch« bildet beide Funktionen in natürlichem Deutsch ab.
- source_word: ἡ σάρξ μου
  choice: mein Fleisch
  rationale: σάρξ bezeichnet hier die leibliche Existenz und nicht eine sündige Wesensart. »Fleisch« erhält den konkreten anthropologischen Ausdruck und seine Spannung im Auferstehungskontext.
- source_word: κατασκηνώσει
  choice: wird wohnen
  rationale: Das Verb trägt das Bild des Wohnens oder Sich-Niederlassens. »Wird wohnen« bewahrt dieses Bild, ohne es vorschnell als Ruhen im Tod auszulegen.
- source_word: ἐπ’ ἐλπίδι
  choice: in Hoffnung
  rationale: Die Präpositionalphrase bezeichnet Hoffnung als tragenden Grund oder Bereich. »In Hoffnung« ist verständlich und lässt diese Nuancen offen.
theological_decisions:
- issue: σάρξ in einem Auferstehungskontext
  choice: mein Fleisch
  alternative: mein Leib
  rationale: Der Ausdruck ist hier leiblich-anthropologisch, nicht ethisch gemeint. »Fleisch« entspricht dem griechischen Wortlaut und vermeidet, die Aussage bereits auf den neutraleren Begriff »Leib« festzulegen; die verständlichere Alternative wird in der Fußnote genannt.
- issue: Bedeutung von κατασκηνώσει ἐπ’ ἐλπίδι
  choice: wird in Hoffnung wohnen
  alternative: wird in Hoffnung ruhen
  rationale: Die Hauptfassung erhält das Bild sicheren Wohnens und lässt offen, wie es im Zusammenhang von Tod und Auferstehung genau zu verstehen ist. »Ruhen« ist eine traditionelle, stärker deutende Möglichkeit und wird deshalb als Alternative ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter poetischer Parallelität. »Herz«, »Zunge« und »Fleisch« erhalten die Körperbilder des griechischen Textes; »ja, auch« gibt die Steigerung lesbar wieder.
