source:
  edition: SBLGNT
  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: de
  text: Sie lobten Gott und waren beim ganzen Volk angesehen. Der Herr aber fügte Tag für Tag diejenigen, die gerettet wurden, zu ihrer Gemeinschaft[a] hinzu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung kann hier im Sinn von Aufnahme in die Gemeinschaft verstanden werden, aber auch „zusammen“ oder „an demselben Ort“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: Sie lobten Gott
  rationale: Das Präsenspartizip beschreibt die fortdauernde Tätigkeit der Gemeinschaft. Im Deutschen führt ein finites Verb den Satz natürlich weiter und bewahrt im Kontext den durativen Sinn.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: waren beim ganzen Volk angesehen
  rationale: Die Wendung bezeichnet hier, dass die Gemeinschaft die Gunst beziehungsweise das Wohlwollen des gesamten Volkes genoss; die gewählte Formulierung ist modern und idiomatisch, ohne eine von der Gemeinschaft ausgehende Gunst auszudrücken.
- source_word: ὁ δὲ κύριος
  choice: Der Herr aber
  rationale: κύριος wird seinem christologischen Gebrauch entsprechend mit „der Herr“ wiedergegeben; δέ markiert einen leichten Übergang beziehungsweise Gegensatz und wird mit „aber“ sichtbar gehalten.
- source_word: προσετίθει
  choice: fügte ... hinzu
  rationale: Das Imperfekt bezeichnet hier ein fortgesetztes beziehungsweise wiederholtes Hinzufügen; „Tag für Tag“ macht diesen Verlauf im Deutschen deutlich.
- source_word: τοὺς σῳζομένους
  choice: diejenigen, die gerettet wurden
  rationale: Das passive Präsenspartizip stellt die Betroffenen als Empfänger des rettenden Handelns dar. In Verbindung mit dem vergangenen Erzählrahmen gibt der deutsche Nebensatz den fortlaufenden Vorgang idiomatisch wieder, ohne daraus eine statische Bezeichnung wie „die Geretteten“ zu machen.
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die distributive Wendung bezeichnet ein wiederholtes Geschehen an aufeinanderfolgenden Tagen und wird so natürlich und prägnant wiedergegeben.
- source_word: ἐπὶ τὸ αὐτό
  choice: zu ihrer Gemeinschaft
  rationale: Im Anschluss an προσετίθει liegt die Ergänzung zur bereits versammelten Gemeinschaft nahe. Da die griechische Wendung auch „zusammen“ oder „an demselben Ort“ bedeuten kann, wird diese echte Mehrdeutigkeit in der Fußnote ausgewiesen.
theological_decisions:
- issue: Aspekt und Heilstheologie in τοὺς σῳζομένους
  choice: diejenigen, die gerettet wurden
  alternative: die gerettet werden; die Geretteten
  rationale: Die Form wahrt das passive rettende Handeln und vermeidet die Verengung auf eine bloß statische Gruppe. Der deutsche Vergangenheitsrahmen erfordert keine Entscheidung über weitergehende konfessionelle Fragen zur Heilsordnung.
- issue: Bezug und Bedeutung von ἐπὶ τὸ αὐτό
  choice: zu ihrer Gemeinschaft
  alternative: zusammen; an demselben Ort
  rationale: Der Zusammenhang mit „hinzufügen“ spricht für die Aufnahme in die bestehende Gemeinschaft. Die lexikalisch mögliche lokale beziehungsweise gemeinschaftliche Bedeutung bleibt durch die Fußnote ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktionen werden für einen natürlichen deutschen Erzählfluss finit wiedergegeben; die fortdauernde Handlung wird durch „Tag für Tag“ getragen. Die Fußnotenmarkierung steht unmittelbar bei der interpretierenden Wiedergabe der mehrdeutigen Schlusswendung.
