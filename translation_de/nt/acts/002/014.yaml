  variant: modern standard German
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: de
  text: 'Petrus aber stellte sich mit den Elf hin, erhob seine Stimme und sprach zu ihnen: »Ihr Männer aus Judäa[a] und ihr alle, die ihr in Jerusalem wohnt: Dies sollt ihr wissen, und hört aufmerksam auf meine Worte!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihr jüdischen Männer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς δὲ ὁ Πέτρος
  choice: Petrus aber stellte sich … hin
  rationale: Das Aoristpartizip von ἵστημι eröffnet die Szene mit einer bewussten Körperhaltung bzw. einem öffentlichen Auftreten. „Stellte sich hin“ bleibt nahe am griechischen Ausdruck; δέ markiert den Übergang und leichten Gegensatz zur vorherigen Spottrede.
- source_word: σὺν τοῖς ἕνδεκα
  choice: mit den Elf
  rationale: σύν mit Dativ bezeichnet Begleitung. Die knappe Formulierung ist im Deutschen natürlich und macht deutlich, dass Petrus nicht allein auftritt.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: erhob seine Stimme
  rationale: Die feste Wendung bezeichnet lautes, öffentlich vernehmbares Sprechen. Die deutsche Formulierung bewahrt Bild und Funktion.
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: sprach zu ihnen
  rationale: Das Verb bezeichnet hier ein vernehmliches, öffentliches Sich-Äußern und kann einen feierlichen Ton tragen. „Sprach zu ihnen“ vermeidet eine zusätzliche theologische Deutung; die besondere öffentliche Wirkung ergibt sich bereits aus dem Erheben der Stimme und der folgenden Rede.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Ihr Männer aus Judäa
  rationale: ἄνδρες wird als ausdrücklich männliche Anrede wiedergegeben. Ἰουδαῖοι kann hier regional („aus Judäa“) oder ethnisch-religiös („jüdisch“) verstanden werden; die Hauptfassung folgt der im Kontext naheliegenden regionalen Lesart und nennt die Alternative in einer Fußnote.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: ihr alle, die ihr in Jerusalem wohnt
  rationale: Die direkte Anrede klingt im modernen Deutschen natürlicher als eine substantivierte Partizipialkonstruktion und bewahrt sowohl πάντες als auch den durativen Sinn von κατοικοῦντες.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: Dies sollt ihr wissen
  rationale: Die imperativische Konstruktion mit ἔστω wird klar und würdig wiedergegeben. Die Formulierung bewahrt den Charakter einer nachdrücklichen Bekanntgabe.
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: hört aufmerksam auf meine Worte
  rationale: ἐνωτίζομαι fordert nicht bloß akustisches Hören, sondern bewusstes Aufmerken. „Aufmerksam hören“ gibt diese Stärke in natürlichem modernem Deutsch wieder; „meine Worte“ entspricht unmittelbar τὰ ῥήματά μου.
theological_decisions:
- issue: Geografische oder ethnisch-religiöse Bedeutung von Ἰουδαῖοι
  choice: Ihr Männer aus Judäa
  alternative: Ihr jüdischen Männer
  rationale: Beide Bedeutungen sind sprachlich möglich. Im Pfingstkontext und neben den in Jerusalem Wohnenden ist die regionale Wiedergabe gut begründet, doch die ethnisch-religiöse Lesart darf nicht ausgeschlossen werden und wird daher in der Fußnote bewahrt.
- issue: Möglicher feierlich-inspirierter Beiklang von ἀπεφθέγξατο
  choice: sprach zu ihnen
  alternative: verkündete ihnen / sprach feierlich zu ihnen
  rationale: Das seltene Verb kann gewichtige oder vom Geist gewirkte Rede bezeichnen, doch der einzelne Ausdruck zwingt keine ausdrückliche Inspirationsaussage. Die Hauptfassung gibt den öffentlichen Sprechakt wieder, ohne den theologischen Beiklang zu verstärken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Anrede wird idiomatisch gestaltet; weder altertümliche Wendungen wie „leiht meinen Worten euer Ohr“ noch konfessionell geprägte Zusätze werden verwendet.
