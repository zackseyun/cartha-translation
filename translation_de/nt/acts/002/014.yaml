  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Textes zuverlässig wieder: Petrus tritt mit den Elf hervor, erhebt seine Stimme und richtet eine öffentliche Aufforderung an die Angeredeten. „Stellte sich … hin“ ist eine angemessene deutsche Wiedergabe von Σταθείς; „erhob seine Stimme“ entspricht der idiomatischen griechischen Wendung. Die Imperative „Dies sollt ihr wissen“ und „hört aufmerksam auf meine Worte“ bewahren Nachdruck und Aufforderungscharakter.'
  naturalness: Modernes Standarddeutsch mit passendem öffentlichem und würdigem Register. Die direkte Anrede „Ihr Männer aus Judäa und ihr alle, die ihr in Jerusalem wohnt“ ist klar und idiomatisch. „Hört aufmerksam auf meine Worte“ ist natürlich und gibt den appellativen Charakter von ἐνωτίσασθε gut wieder.
