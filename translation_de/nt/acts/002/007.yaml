id: ACT.2.7
reference: Acts 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: de
  text: 'Da waren sie außer sich und staunten. Sie sagten: »Seht[a], sind nicht alle diese, die da sprechen, Galiläer?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Siehe« oder »Schaut«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: waren außer sich
  rationale: Das Imperfekt beschreibt anhaltendes überwältigtes Erstaunen. »Außer sich sein« bewahrt die starke Wirkung des Verbs, ohne eine Ursache hinzuzufügen.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung mit einem milden Anschluss weiter. »Da« klingt im deutschen Erzählzusammenhang natürlich.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die beiden Reaktionen und bewahrt ihre kumulative Wirkung.
- source_word: ἐθαύμαζον
  choice: staunten
  rationale: Das Verb bezeichnet Staunen oder Verwunderung. »Staunten« ist gegenwärtiges, idiomatisches Deutsch und bleibt vom stärkeren Ausdruck »waren außer sich« unterscheidbar.
- source_word: λέγοντες
  choice: Sie sagten
  rationale: Das Partizip leitet den Inhalt ihrer Äußerung ein. Ein neuer Hauptsatz ist im modernen Deutschen natürlicher als eine schwerfällige partizipiale Konstruktion.
- source_word: Οὐχ
  choice: sind nicht
  rationale: Die mit οὐχ eingeleitete Frage erwartet Zustimmung. Die deutsche negative Frage gibt diese Erwartung wieder.
- source_word: ἰδοὺ
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel lenkt den Blick auf die offenkundige Beobachtung. »Seht« ist verständlich und weniger altertümlich als »Siehe«.
- source_word: πάντες οὗτοί
  choice: alle diese
  rationale: Die Formulierung bezeichnet die gesamte angesprochene Gruppe, ohne ausdrücklich »Männer« hinzuzufügen.
- source_word: οἱ λαλοῦντες
  choice: die da sprechen
  rationale: Die substantivierte Präsenspartizipialform bezeichnet die gerade Sprechenden. »Da« verleiht der deutschen Relativkonstruktion eine natürliche deiktische Nuance.
- source_word: Γαλιλαῖοι
  choice: Galiläer
  rationale: Dies ist die direkte regionale Herkunftsbezeichnung; die im Zusammenhang erkennbare Überraschung wird nicht erklärend erweitert.
theological_decisions:
- issue: Soziale oder regionale Nebenbedeutung von »Galiläer«
  choice: Die bloße Herkunftsbezeichnung »Galiläer« bleibt stehen.
  alternative: Eine Erklärung wie »ungebildete Galiläer« oder »Galiläer aus dem Norden« in den Text aufzunehmen.
  rationale: Der Vers nennt die galiläische Herkunft als Grund der Verwunderung, erklärt aber nicht ausdrücklich, weshalb sie überraschend ist. Eine soziale, sprachliche oder bildungsbezogene Deutung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Reaktionsverben werden getrennt wiedergegeben, damit ihre kumulative Stärke erhalten bleibt; die rhetorische Frage und die nicht erklärte Bedeutung der galiläischen Herkunft bleiben offen.
