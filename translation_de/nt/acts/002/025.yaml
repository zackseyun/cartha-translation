id: ACT.2.25
reference: Acts 2:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: de
  text: 'Denn David sagt über ihn: »Ich sah den Herrn allezeit vor mir[a], denn er ist an meiner rechten Seite, damit ich nicht ins Wanken gerate.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich sah den Herrn im Voraus immer vor mir.« Das griechische Verb kann in manchen Zusammenhängen »vorhersehen« bedeuten; die umgebenden Wendungen sprechen hier jedoch eher für ein beständiges Sich-vor-Augen-Halten.'
    reason: lexical_alternative
  - marker: b
    text: Petrus zitiert Psalm 16,8. Im hebräischen Text steht an dieser Stelle der Gottesname, der traditionell mit »der HERR« wiedergegeben wird.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: sagt über ihn
  rationale: In dieser Einleitungsformel bezeichnet εἰς αὐτόν denjenigen, auf den sich Davids Aussage bezieht, nicht den direkt Angesprochenen.
- source_word: Προορώμην
  choice: ich sah … vor mir
  rationale: Im Zusammenhang mit ἐνώπιόν μου und διὰ παντός bezeichnet das Verb ein fortwährendes Sich-vor-Augen-Halten; die Dauer wird im Deutschen natürlich durch »allezeit« ausgedrückt.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Die Übersetzung folgt dem griechischen κύριον, ohne den Bezug im Text durch »der HERR« oder »der Messias« näher festzulegen.
- source_word: ἐνώπιόν μου διὰ παντός
  choice: allezeit vor mir
  rationale: Bewahrt die räumlich-relationale Bildsprache und gibt die beständige Dauer in natürlichem, würdigem Deutsch wieder.
- source_word: ἐκ δεξιῶν μού
  choice: an meiner rechten Seite
  rationale: Gibt die Stellung rechts neben dem Sprecher idiomatisch wieder und lässt die damit verbundene Vorstellung von Beistand bestehen.
- source_word: ἵνα μὴ σαλευθῶ
  choice: damit ich nicht ins Wanken gerate
  rationale: Bewahrt die Zweck- oder Folgebeziehung von ἵνα und gibt das bildhafte σαλεύω natürlich wieder.
theological_decisions:
- issue: Bezug von »dem Herrn« im Psalmzitat, wie Petrus es verwendet
  choice: »den Herrn« ohne nähere Identifizierung
  alternative: »den HERRN« oder »den Messias«
  rationale: Petrus deutet den Psalm christologisch; das Zitat selbst hat jedoch κύριον. Die Übersetzung wahrt diese Spannung, statt die Identität im Wortlaut ausdrücklich festzulegen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. »Allezeit« erhält den psalmischen Klang, ohne altertümliche Satzformen zu verwenden; »ins Wanken geraten« vermittelt die Stabilitätsmetapher idiomatisch.
