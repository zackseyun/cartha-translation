  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: de
  text: Und ihnen erschienen Zungen wie Feuer, die sich verteilten; auf jedem Einzelnen von ihnen ließ sich eine nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich teilende Zungen wie von Feuer« oder: »Zungen, gleichsam aus Feuer«. Der griechische Wortlaut hebt sowohl die sichtbare Erscheinung als auch ihre Verteilung unter ihnen hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: erschienen
  rationale: 'Der Aorist Passiv von ὁράω hat hier intransitive Bedeutung: Etwas wurde für sie sichtbar. »Erschienen« gibt dies im Deutschen natürlich wieder.'
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet diejenigen, denen die Erscheinung sichtbar wurde.
- source_word: διαμεριζόμεναι
  choice: die sich verteilten
  rationale: Das feminine Partizip im Plural bezieht sich auf γλῶσσαι. Die reflexive Form wahrt die mögliche Bedeutung eines Teilungs- oder Verteilungsvorgangs, ohne genauer festzulegen, wie dieser geschah.
- source_word: γλῶσσαι
  choice: Zungen
  rationale: »Zungen« bewahrt sowohl das sichtbare, zungenförmige Bild als auch die sprachliche Resonanz im folgenden Zusammenhang; »Flammen« würde diese Verbindung einebnen.
- source_word: ὡσεὶ πυρός
  choice: wie Feuer
  rationale: ὡσεὶ kennzeichnet einen Vergleich und keine Gleichsetzung. »Wie Feuer« ist idiomatisch und behauptet nicht, dass die Erscheinung tatsächlich Feuer war.
- source_word: ἐκάθισεν
  choice: es ließ sich … nieder
  rationale: Der griechische Singular wird bewusst beibehalten. Das unpersönlich-kollektive »es« kann sich auf die gesamte Erscheinung oder ihre verteilte Gestalt beziehen, ohne die syntaktische Spannung durch einen deutschen Plural aufzulösen.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: auf jedem Einzelnen von ihnen
  rationale: 'Die Formulierung erhält den nachdrücklichen distributiven Sinn: Die Erscheinung erreichte jede einzelne anwesende Person.'
theological_decisions:
- issue: Art der Erscheinung zu Pfingsten
  choice: Die Erscheinung wird als »Zungen wie Feuer« wiedergegeben, nicht als buchstäbliches Feuer und nicht ausschließlich als Sprachen.
  alternative: Feuerflammen; Sprachen wie Feuer
  rationale: Der griechische Text verwendet mit ὡσεὶ einen Vergleich und mit γλῶσσαι ein Wort, das sowohl das sichtbare Bild als auch den Bezug zum anschließenden Reden trägt. Die Übersetzung legt die Erscheinung weder auf echtes Feuer noch vorschnell allein auf menschliche Sprachen fest.
- issue: Singular des abschließenden Verbs
  choice: Der Singular von ἐκάθισεν wird mit »es ließ sich … nieder« bewahrt.
  alternative: »sie ließen sich … nieder« mit Bezug auf die Zungen
  rationale: Der auffällige Wechsel vom pluralischen Subjekt zum singularischen Verb kann die Erscheinung als ein verteiltes Ganzes darstellen. Eine Angleichung an den Plural würde diese echte Spannung des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. »Zungen« erhält bewusst die Bild- und Bedeutungsverbindung zum folgenden Sprachwunder; der ungewöhnliche Singular im zweiten Satzteil bleibt zur Wahrung der griechischen Mehrdeutigkeit stehen.
