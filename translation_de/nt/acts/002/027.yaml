id: ACT.2.27
reference: Acts 2:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: de
  text: Denn du wirst meine Seele nicht dem Hades überlassen[a] und nicht zulassen, dass dein Heiliger[b] die Verwesung[c] sieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Totenreich«. Die hebräische Vorlage dieses Zitats hat »Scheol«; im griechischen Text steht »Hades«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »dein Getreuer« bzw. »dein Frommer«.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der körperliche Zerfall, die Verwesung.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: überlassen
  rationale: Im Zusammenhang mit einem Ort oder Zustand gibt das deutsche »überlassen« den Sinn wieder, jemanden dort zurückzulassen bzw. preiszugeben, und verbindet sich natürlich mit dem Dativ.
- source_word: τὴν ψυχήν μου
  choice: meine Seele
  rationale: »Seele« bewahrt die Ausdrucksweise des Psalmzitats und dessen anthropologische Offenheit; »mein Leben« oder »mich« wären ebenfalls möglich, würden die Formulierung aber stärker auslegen.
- source_word: εἰς ᾅδην
  choice: dem Hades
  rationale: ᾅδης bezeichnet hier den Totenbereich und sollte nicht mit »Hölle« gleichgesetzt werden. Wegen der deutschen Verbindung »jemanden einem Ort oder Bereich überlassen« steht idiomatisch der Dativ, obwohl das Griechische εἰς verwendet.
- source_word: δώσεις ... ἰδεῖν
  choice: zulassen, dass ... sieht
  rationale: δίδωμι mit Infinitiv hat hier erlaubenden Sinn. Die Konstruktion mit »zulassen, dass« ist im modernen Deutsch klar und bewahrt das folgende Bild des Sehens.
- source_word: τὸν ὅσιόν σου
  choice: dein Heiliger
  rationale: ὅσιος kann »heilig«, »fromm« oder »treu« bezeichnen. »Dein Heiliger« erhält sowohl die lexikalische Bedeutung als auch die christologische Bezugnahme im Kontext von Apostelgeschichte 2.
- source_word: ἰδεῖν διαφθοράν
  choice: die Verwesung sieht
  rationale: Die wörtliche Bildsprache »sehen« bleibt erhalten; »Verwesung« bezeichnet im Kontext präzise den körperlichen Zerfall und vermeidet die moralische Nebenbedeutung von »Verderben«.
theological_decisions:
- issue: Wiedergabe von ᾅδης im Auferstehungskontext
  choice: Hades
  alternative: Totenreich; Scheol; Grab
  rationale: »Hades« folgt dem griechischen Text und vermeidet die spätere Gleichsetzung mit der Hölle. Die hebräische Vorlage des Zitats hat »Scheol«; dies wird in einer Fußnote kenntlich gemacht.
- issue: Christologische Bezeichnung τὸν ὅσιόν σου
  choice: dein Heiliger
  alternative: dein Getreuer; dein Frommer
  rationale: Der Kontext bezieht das Psalmwort auf Jesus. »Dein Heiliger« wahrt diese erkennbare Bezugnahme, ohne die mögliche Bedeutung »Getreuer« zu verschweigen.
- issue: Bedeutung von ψυχή im Psalmzitat
  choice: Seele
  alternative: Leben; mich selbst
  rationale: Die Übersetzung bewahrt die traditionelle und formal naheliegende Ausdrucksweise, ohne daraus eine präzise Lehre über Leib und Seele abzuleiten; die Aussage bleibt in ihrer semantischen Offenheit stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Psalmzitat, wird aber durch »zulassen, dass« idiomatisch gestaltet. Fachbegriffe und mehrdeutige theologische Aussagen werden nicht vereinheitlicht oder konfessionell ausgelegt.
