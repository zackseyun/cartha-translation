source:
  edition: SBLGNT
  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: de
  text: 'Sie waren aber untereinander uneins und gingen auseinander, nachdem Paulus noch ein abschließendes Wort[a] gesagt hatte: »Treffend hat der Heilige Geist durch den Propheten Jesaja zu euren Vätern[b] gesprochen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Wort«; gemeint ist hier eine abschließende Äußerung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu euren Vorfahren«. Wörtlich steht »zu euren Vätern«; gemeint sind Israels Vorväter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: Sie waren aber untereinander uneins
  rationale: Die Zustandsbeschreibung wird in natürlichem Deutsch als Hauptsatz wiedergegeben. »Untereinander uneins« bewahrt den Gedanken gegenseitiger Meinungsverschiedenheit, ohne das Partizip eindeutig kausal festzulegen.
- source_word: ἀπελύοντο
  choice: gingen auseinander
  rationale: Das Imperfekt beschreibt die sich auflösende Versammlung beziehungsweise den einsetzenden Aufbruch. »Gingen auseinander« ist idiomatisch und lässt den Vorgang erkennen.
- source_word: εἰπόντος τοῦ Παύλου
  choice: nachdem Paulus … gesagt hatte
  rationale: Der Genitivus absolutus bezeichnet hier am natürlichsten das zeitliche Verhältnis. »Gesagt« entspricht εἰπόντος und wird nicht mit dem späteren ἐλάλησεν vermischt.
- source_word: ῥῆμα ἓν
  choice: noch ein abschließendes Wort
  rationale: Wörtlich steht »ein Wort«; im Zusammenhang handelt es sich um Paulus’ abschließende Äußerung vor dem Weggehen der Zuhörer. »Noch« und »abschließend« machen diese Gesprächsfunktion verständlich, während die Fußnote den Wortlaut transparent hält.
- source_word: Καλῶς
  choice: Treffend
  rationale: Das Adverb bewertet die Aussage des Heiligen Geistes als passend beziehungsweise zutreffend. »Treffend« ist in dieser Einleitung natürlich und vermeidet das im Deutschen missverständliche »gut gesprochen«.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Dies ist die etablierte und sachgerechte deutsche Wiedergabe der bestimmten griechischen Bezeichnung.
- source_word: ἐλάλησεν
  choice: hat … gesprochen
  rationale: »Gesprochen« gibt λαλέω direkt wieder und passt zur prophetischen Rede, die anschließend zitiert wird.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: durch den Propheten Jesaja
  rationale: διά mit Genitiv bezeichnet die vermittelnde Person. Die deutsche Formulierung bewahrt Jesajas Rolle als prophetischer Mittler.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: zu euren Vätern
  rationale: Die Übersetzung erhält die konkrete maskuline Verwandtschaftsbezeichnung des griechischen Textes; gemeint sind Israels Vorväter.
theological_decisions:
- issue: Wirken des Heiligen Geistes in prophetischer Rede
  choice: Der Heilige Geist hat durch den Propheten Jesaja gesprochen
  alternative: Jesaja hat unter dem Einfluss des Heiligen Geistes gesprochen
  rationale: Der griechische Satz nennt ausdrücklich den Heiligen Geist als Sprechenden und Jesaja als vermittelnde Person. Diese Zuordnung wird nicht abgeschwächt oder systematisch erweitert.
- issue: Bezug von »euren Vätern«
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: πατέρας bedeutet wörtlich »Väter« und verweist hier auf die Väter beziehungsweise Vorväter Israels. Die konkrete Ausdrucksweise bleibt im Text erhalten; die weitere Bedeutung wird in der Fußnote erläutert.
- issue: Bewertung der prophetischen Aussage durch καλῶς
  choice: Treffend
  alternative: Mit Recht
  rationale: Beide Möglichkeiten drücken eine positive Bewertung aus. »Treffend« lässt offen, ob vor allem die sachliche Richtigkeit oder die genaue Passung auf die gegenwärtigen Hörer betont wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Satzform vermeidet es, den griechischen Partizipialsatz unnötig eindeutig als Ursache oder Zeitangabe festzulegen. Der Doppelpunkt und das offene Anführungszeichen zeigen, dass die in Vers 25 beginnende Rede im folgenden Vers weitergeht.
