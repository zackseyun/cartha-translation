source:
  edition: SBLGNT
  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: de
  text: Nachdem sie mich verhört hatten, wollten sie mich freilassen, weil kein Grund für ein Todesurteil gegen mich vorlag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil sie keine Anklage gegen mich fanden, die den Tod verdient hätte.“'
    reason: 'Lexikalische Alternative: αἰτία kann im gerichtlichen Zusammenhang sowohl den Rechtsgrund als auch die Anklage bezeichnen.'
lexical_decisions:
- source_word: οἵτινες
  choice: sie
  rationale: Das Relativpronomen nimmt im Deutschen natürlich die zuvor genannten römischen Behörden auf; eine verstärkende Wiedergabe ist im Zusammenhang nicht erforderlich.
- source_word: ἀνακρίναντές με
  choice: Nachdem sie mich verhört hatten
  rationale: Die temporale Vorzeitigkeit des Aoristpartizips wird ausdrücklich wiedergegeben. „Verhört“ trifft den gerichtlichen Untersuchungskontext besser als das allgemeinere „untersucht“.
- source_word: ἐβούλοντο
  choice: wollten
  rationale: Das Imperfekt bezeichnet ihren damaligen Willen beziehungsweise ihre Absicht; „wollten“ ist klar und idiomatisch.
- source_word: ἀπολῦσαι
  choice: mich freilassen
  rationale: Im rechtlichen Zusammenhang bezeichnet das Verb die Entlassung aus dem Gewahrsam.
- source_word: διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν
  choice: weil … kein Grund für ein Todesurteil vorlag
  rationale: Die Konstruktion mit διά und substantiviertem Infinitiv ist kausal. αἰτία θανάτου bezeichnet hier einen rechtlich zureichenden Grund für eine Verurteilung zum Tod.
- source_word: ἐν ἐμοί
  choice: bei mir
  rationale: Die knappe Wendung bewahrt die Beziehung auf Paulus, ohne das griechische „in mir“ unnatürlich zu übertragen; der forensische Sinn ergibt sich aus dem Kontext.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der gerichtliche Kontext bleibt deutlich, ohne unnötig technische Rechtssprache zu verwenden; die mögliche Bedeutung von αἰτία als „Anklage“ wird in der Fußnote bewahrt.
