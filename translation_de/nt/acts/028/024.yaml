  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: de
  text: Und einige ließen sich von dem Gesagten überzeugen, andere aber glaubten nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: schenkten dem keinen Glauben.'
    reason: Lexikalische Alternative zu „glaubten nicht“; sie gibt ἠπίστουν idiomatisch wieder, ohne ausdrücklich eine bewusste Weigerung zu behaupten.
lexical_decisions:
- source_word: ἐπείθοντο
  choice: ließen sich … überzeugen
  rationale: Die imperfektische Form beschreibt die Reaktion auf Paulus’ Darlegungen, ohne sie ausdrücklich mit rettendem Glauben gleichzusetzen. Die deutsche Wendung bewahrt zudem die mögliche passive beziehungsweise mediale Färbung.
- source_word: τοῖς λεγομένοις
  choice: von dem Gesagten
  rationale: Das substantivierte Präsenspartizip bezeichnet den Inhalt dessen, was vorgetragen wurde. „Von dem Gesagten“ ist natürliches Deutsch und hält den Bezug allgemein, wie es der griechische Text tut.
- source_word: ἠπίστουν
  choice: glaubten nicht
  rationale: Diese Wiedergabe bildet den unmittelbaren Gegensatz zu denen ab, die sich überzeugen ließen, ohne die im Verb mögliche Deutung als bewusste Weigerung unnötig festzuschreiben.
- source_word: οἱ μὲν … οἱ δὲ
  choice: einige … andere aber
  rationale: Die korrelative Konstruktion teilt die Zuhörerschaft in zwei Gruppen und hebt deren gegensätzliche Reaktionen hervor.
- source_word: καὶ
  choice: Und
  rationale: „Und“ verbindet den Satz schlicht mit dem vorausgehenden Bericht, ohne einen weitergehenden logischen Zusammenhang einzutragen.
theological_decisions:
- issue: Art des Gegensatzes zwischen den Reaktionen
  choice: Der Vers unterscheidet zwischen Menschen, die sich von Paulus’ Darlegungen überzeugen ließen, und solchen, die nicht glaubten.
  alternative: Die erste Gruppe besteht ausdrücklich aus wahrhaft Geretteten, die zweite aus willentlich verhärteten Ungläubigen.
  rationale: Der griechische Wortlaut beschreibt hier die unterschiedlichen unmittelbaren Reaktionen auf die Botschaft, bestimmt aber nicht ausdrücklich den endgültigen geistlichen Zustand jedes Einzelnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau bleibt knapp und bewahrt den deutlichen Gegensatz des griechischen Textes.
