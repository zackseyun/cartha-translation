  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: de
  text: Als wir in Rom ankamen, durfte Paulus für sich wohnen, zusammen mit dem Soldaten, der ihn bewachte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als wir in Rom ankamen, durfte Paulus für sich bleiben, zusammen mit einem Soldaten, der ihn bewachte.“'
    reason: μένεῖν kann in diesem Zusammenhang mit „wohnen“ oder „bleiben“ wiedergegeben werden. Der griechische Artikel bei „Soldat“ kann im Deutschen je nach Kontext bestimmt oder unbestimmt formuliert werden.
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Als
  rationale: Ὅτε leitet den zeitlichen Nebensatz ein. Das schwach verbindende δέ muss im natürlichen Deutschen nicht eigens wiedergegeben werden.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: wir nach Rom hineingekommen waren
  rationale: Die Formulierung bewahrt die Bewegungsrichtung von εἰσέρχομαι mit εἰς. Das Plusquamperfekt entspricht im deutschen Satzgefüge natürlich der vorzeitigen Ankunft.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: wurde Paulus erlaubt
  rationale: Die unpersönliche Passivkonstruktion gibt die Paulus gewährte Erlaubnis eng am Griechischen und dennoch idiomatisch wieder.
- source_word: μένειν
  choice: zu wohnen
  rationale: Im Zusammenhang mit Paulus’ Unterbringung in Rom bezeichnet μένειν nicht nur ein kurzes Verweilen, sondern seinen erlaubten Aufenthalt; „wohnen“ ist hier natürlich, ohne eigene Räumlichkeiten ausdrücklich vorauszusetzen.
- source_word: καθ’ ἑαυτόν
  choice: für sich
  rationale: Die Wendung bezeichnet eine von anderen Gefangenen getrennte Unterbringung. „Für sich“ vermeidet den Widerspruch, den „allein“ angesichts des anwesenden Soldaten nahelegen könnte.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: zusammen mit dem Soldaten, der ihn bewachte
  rationale: σύν bezeichnet Begleitung; der substantivisch-attributive Ausdruck mit Artikel weist auf den ihm zugeteilten, bestimmten Soldaten hin.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, während „für sich wohnen“ die gesonderte Unterbringung natürlich ausdrückt.
