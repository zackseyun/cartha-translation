  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: de
  text: 'Sie aber sagten zu ihm: „Wir haben weder Briefe aus Judäa über dich erhalten, noch hat irgendeiner der Brüder[a], der gekommen ist, etwas Böses[b] über dich berichtet oder gesagt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ kann hier jüdische Volksgenossen aus Judäa bezeichnen; der Text nennt sie nicht ausdrücklich christliche Gläubige.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „etwas Schlechtes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: Sie aber sagten zu ihm
  rationale: Bewahrt die leichte weiterführende beziehungsweise kontrastierende Kraft von δέ und gibt πρός nach einem Redeverb idiomatisch wieder.
- source_word: οὔτε ... οὔτε
  choice: weder ... noch
  rationale: Die korrelative Verneinung des Griechischen wird in natürlichem Deutsch erhalten.
- source_word: γράμματα
  choice: Briefe
  rationale: Im Zusammenhang bezeichnet γράμματα schriftliche Mitteilungen, nicht Schriften oder Bildung.
- source_word: ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας
  choice: aus Judäa ... erhalten
  rationale: δέχομαι bezeichnet hier den Empfang von Korrespondenz; die Herkunftsangabe wird idiomatisch mit „aus Judäa“ wiedergegeben.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: einer der Brüder, die gekommen sind
  rationale: Die Formulierung wahrt die unbestimmte Einzelperson innerhalb der Gruppe und gibt das Angekommensein wieder, ohne das im Griechischen nicht ausdrücklich vorhandene „hierher“ hinzuzufügen.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: etwas ... berichtet oder gesagt
  rationale: Die beiden Verben werden leicht unterschieden, ohne im Deutschen eine unnatürliche Formulierung zu erzeugen.
- source_word: πονηρόν
  choice: etwas Böses
  rationale: Die substantivierte Verwendung des Neutrums wird formal nah und verständlich wiedergegeben; „Böses“ erhält die stärkere Wertung gegenüber bloß „Schlechtem“.
theological_decisions:
- issue: Bezug von τῶν ἀδελφῶν
  choice: „der Brüder“ ohne nähere Bestimmung
  alternative: „der jüdischen Brüder“ oder „der christlichen Brüder“
  rationale: Im Kontext können Glaubens- beziehungsweise Volksgenossen aus Judäa gemeint sein. Der griechische Text kennzeichnet sie nicht ausdrücklich als christliche Gläubige; deshalb bleibt die mögliche Zuordnung offen.
- issue: Bedeutungsstärke von πονηρόν
  choice: „etwas Böses“
  alternative: „etwas Schlechtes“ oder „etwas Nachteiliges“
  rationale: „Böses“ entspricht der gewöhnlichen moralisch negativen Bedeutung, während der Kontext auch eine nachteilige Aussage oder Beschuldigung zulassen kann; diese Nuance wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Korrelativgefüge, ist aber flüssig lesbar. Das etwas formellere „etwas Böses“ wahrt die Stärke von πονηρόν; die sachlich mildere Alternative wird in der Fußnote genannt.
