  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: de
  text: Sie erwiesen uns auch vielfache Ehre[a], und als wir in See stachen[b], gaben sie uns alles mit, was wir brauchten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie ehrten uns mit vielen Ehren.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als wir ausliefen“. Das griechische Wort ist hier ein nautischer Ausdruck für den Beginn einer Schiffsreise.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Sie legten das für die Bedürfnisse Nötige auf“; im Zusammenhang ist gemeint: auf das Schiff.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: sie erwiesen uns vielfache Ehre
  rationale: Die Formulierung bewahrt die konkrete Vorstellung vielfältiger Ehrungen, vermeidet im Deutschen aber die schwerfällige wörtliche Wiederholung „ehrten uns mit vielen Ehren“.
- source_word: ἀναγομένοις
  choice: als wir in See stachen
  rationale: Das Partizip von ἀνάγω bezeichnet hier im nautischen Zusammenhang den Beginn einer Schiffsreise.
- source_word: ἐπέθεντο τὰ πρὸς τὰς χρείας
  choice: gaben sie uns alles mit, was wir brauchten
  rationale: Die natürliche deutsche Formulierung gibt den Sinn wieder, dass die benötigten Vorräte beziehungsweise Gegenstände für die Abreise bereit- und auf das Schiff gelegt wurden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vielfache Ehre“ hält den konkreten Ehrbegriff des Griechischen fest; „gaben sie uns alles mit“ ist idiomatisch und macht die Versorgung bei der Abreise klar, ohne Einzelheiten hinzuzufügen.
