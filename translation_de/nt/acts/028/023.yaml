id: ACT.28.23
reference: Acts 28:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: de
  text: Nachdem sie mit ihm einen Tag vereinbart hatten, kamen noch mehr von ihnen zu ihm in seine Unterkunft.[a] Ihnen erklärte er das Reich Gottes[b] und bezeugte es eindringlich; zugleich suchte er sie anhand des Gesetzes des Mose und der Propheten von Jesus zu überzeugen[c] – vom Morgen bis zum Abend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu seinem Quartier“ beziehungsweise „an den Ort, an dem er wohnte“. Das griechische Wort bezeichnet eine Unterkunft oder Wohngelegenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „legte er das Reich Gottes dar“ beziehungsweise „führte er es ihnen aus“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „überzeugte er sie“. Das griechische Partizip kann die Tätigkeit des Überzeugens oder das Bemühen darum hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: Nachdem sie mit ihm einen Tag vereinbart hatten
  rationale: Die Wendung bezeichnet idiomatisch die Vereinbarung eines bestimmten Tages. Das Dativpronomen αὐτῷ wird natürlich mit „mit ihm“ wiedergegeben.
- source_word: εἰς τὴν ξενίαν
  choice: in seine Unterkunft
  rationale: ξενία bezeichnet hier die Unterkunft beziehungsweise den Ort, an dem Paulus als Gast oder Mieter wohnte; „Unterkunft“ ist präzise und allgemein verständlich.
- source_word: πλείονες
  choice: noch mehr von ihnen
  rationale: Die komparative Form wird bewahrt und auf die zuvor genannten jüdischen Repräsentanten beziehungsweise ihre Gruppe bezogen.
- source_word: ἐξετίθετο
  choice: erklärte er
  rationale: Das Imperfekt beschreibt die fortlaufende Darlegung. „Erklärte“ ist modernes, verständliches Deutsch; die enger formale Alternative „legte dar“ wird in der Fußnote genannt.
- source_word: διαμαρτυρόμενος
  choice: legte davon eindringlich Zeugnis ab
  rationale: Das Partizip bezeichnet nachdrückliches beziehungsweise ernstes Bezeugen. „Eindringlich“ gibt diese verstärkte Aussagekraft wieder, ohne einen besonderen liturgischen Ton einzutragen.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Dies ist die etablierte, transparente deutsche Entsprechung und bewahrt die sachliche wie theologische Offenheit des Ausdrucks.
- source_word: πείθων τε αὐτοὺς
  choice: zugleich suchte er sie ... zu überzeugen
  rationale: Die Form beschreibt fortgesetztes Überzeugen beziehungsweise werbendes Bemühen, ohne im Vers ausdrücklich den Erfolg bei allen Hörern festzustellen. Die alternative resultative Wiedergabe wird in der Fußnote erhalten.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: von Jesus
  rationale: In Verbindung mit „überzeugen“ ist „von Jesus überzeugen“ natürliches heutiges Deutsch und gibt den Gegenstand der Argumentation wieder.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: anhand des Gesetzes des Mose und der Propheten
  rationale: ἀπό bezeichnet hier die schriftgemäße Grundlage beziehungsweise Quelle der Argumentation. „Anhand“ drückt diese Funktion idiomatisch aus; τε ... καί verbindet beide Schriftbereiche.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: vom Morgen bis zum Abend
  rationale: Die zeitliche Ausdehnung wird direkt, klar und ohne die nicht zwingende Präzisierung „von der Morgendämmerung“ wiedergegeben.
theological_decisions:
- issue: Verhältnis zwischen dem Reich Gottes und dem Zeugnis über Jesus
  choice: Beide Gegenstände erscheinen als Teile derselben fortlaufenden Schriftauslegung und Bezeugung.
  alternative: Das Reich Gottes und Jesus könnten als zwei voneinander unabhängige Themen verstanden werden.
  rationale: Die Syntax verbindet die Erklärung und Bezeugung des Reiches Gottes mit dem Überzeugen hinsichtlich Jesu innerhalb eines einzigen Vorgangs. Die Übersetzung wahrt diese Verbindung, ohne sie zu einem weitergehenden theologischen System auszubauen.
- issue: Erfolg des Überzeugens
  choice: „suchte ... zu überzeugen“ lässt offen, wie viele Hörer tatsächlich überzeugt wurden.
  alternative: „überzeugte sie“ kann das Partizip formaler und möglicherweise resultativ wiedergeben.
  rationale: Der unmittelbare Vers betont Paulus’ fortgesetzte persuasive Tätigkeit; der Erfolg wird erst im folgenden Kontext differenziert. Die Fußnote bewahrt die grammatisch mögliche stärkere Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Das Semikolon trennt die eng verbundenen Aspekte der langen griechischen Periode, und der Gedankenstrich hebt die außergewöhnliche zeitliche Dauer hervor. Traditionell verständliche biblische Ausdrücke wie „Reich Gottes“, „Gesetz des Mose“ und „die Propheten“ bleiben erhalten.
