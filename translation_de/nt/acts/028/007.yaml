source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: de
  text: In der Umgebung jenes Ortes gab es Ländereien[a], die Publius gehörten, dem führenden Mann der Insel[b], der uns aufnahm und uns drei Tage lang gastfreundlich beherbergte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Landgüter“ oder „Grundstücke“. Das griechische Wort χωρία bezeichnet hier Landbesitz in der Umgebung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem höchsten Mann der Insel“. Möglicherweise handelt es sich um einen örtlichen Titel; der griechische Text nennt jedenfalls seine führende Stellung.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „der uns aufnahm und uns drei Tage lang freundlich Gastfreundschaft gewährte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: In der Umgebung jenes Ortes
  rationale: Gibt die räumliche Bedeutung von περὶ τὸν τόπον natürlich wieder; δέ ist hier ein leichter Erzählanschluss und muss im Deutschen nicht eigens markiert werden.
- source_word: ὑπῆρχεν χωρία
  choice: lagen Landgüter
  rationale: χωρία bezeichnet hier Grundstücke beziehungsweise Landbesitz; „Landgüter“ wahrt den Plural und passt zum Besitz eines führenden Inselbewohners. „lagen“ ergibt mit der Ortsangabe idiomatisches Deutsch.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: dem führenden Mann der Insel
  rationale: πρῶτος bezeichnet hier Rang oder herausgehobene Stellung, möglicherweise auch einen örtlichen Titel. Die Übersetzung bildet dies ab, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: ὀνόματι Ποπλίῳ
  choice: Publius
  rationale: Der Dativ mit ὀνόματι nennt den Namen des Besitzers; im umgestellten deutschen Satz genügt der Eigenname. „Publius“ ist die übliche Form des lateinischen Namens.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: Er nahm uns auf
  rationale: Das Partizip bezeichnet die gastliche Aufnahme und wird für einen natürlichen deutschen Satz als eigener Hauptsatz wiedergegeben.
- source_word: τρεῖς ἡμέρας
  choice: drei Tage lang
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer.
- source_word: φιλοφρόνως ἐξένισεν
  choice: beherbergte uns ... freundlich
  rationale: ξενίζω bezeichnet die Beherbergung als Gäste; φιλοφρόνως beschreibt sie als freundlich beziehungsweise zuvorkommend.
