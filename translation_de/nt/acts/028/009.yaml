id: ACT.28.9
reference: Acts 28:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: de
  text: Nachdem dies geschehen war, kamen auch die übrigen Menschen auf der Insel, die an Krankheiten litten[a], und wurden geheilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Krankheiten hatten“; auch möglich: „krank waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Nachdem dies geschehen war
  rationale: Der Genitivus absolutus bezeichnet die zeitliche Folge; die Formulierung ist natürlich und bewahrt den erzählerischen Übergang durch δέ.
- source_word: οἱ λοιποί
  choice: die übrigen Menschen
  rationale: λοιποί bezeichnet die anderen beziehungsweise verbleibenden Personen neben dem zuvor erwähnten Fall; „Menschen“ macht die substantivische Wendung im Deutschen klar.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: auf der Insel
  rationale: Die Präpositionalwendung bestimmt den Aufenthaltsort der betreffenden Menschen; „auf der Insel“ entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: ἔχοντες ἀσθενείας
  choice: die an Krankheiten litten
  rationale: Die Formulierung gibt den konkreten Plural ἀσθενείας wieder und klingt im heutigen Deutsch natürlicher als das wörtliche „Krankheiten hatten“.
- source_word: προσήρχοντο
  choice: kamen
  rationale: Der Imperfekt beschreibt das wiederholte Herankommen im Verlauf des Geschehens. Ein Ziel wie „zu ihm“ wird nicht ergänzt, da es im Griechischen nicht ausdrücklich genannt ist.
- source_word: ἐθεραπεύοντο
  choice: wurden geheilt
  rationale: Die passive Form und der fortlaufende beziehungsweise wiederholte Vorgang bleiben gewahrt; „wurden geheilt“ ist klar und würdevoll.
- source_word: καὶ
  choice: auch
  rationale: Das zweite καί verbindet diese Heilungen mit dem unmittelbar zuvor berichteten Ereignis und wird im Deutschen idiomatisch mit „auch“ wiedergegeben.
