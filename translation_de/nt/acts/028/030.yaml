id: ACT.28.30
reference: Acts 28:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἐνέμεινεν ⸀δὲ διετίαν ὅλην ἐν ἰδίῳ μισθώματι, καὶ ἀπεδέχετο πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: de
  text: Er blieb zwei volle Jahre in einer von ihm selbst gemieteten Unterkunft[a] und nahm alle auf, die zu ihm hereinkamen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinem eigenen gemieteten Haus“. Das griechische Wort μίσθωμα bezeichnet gemietete Räumlichkeiten und legt nicht eindeutig fest, um welche Art von Unterkunft es sich handelte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle, die zu ihm kamen“. Wörtlicher ist von denen die Rede, die „zu ihm hineinkamen“, vermutlich in seine Unterkunft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: er blieb
  rationale: Das Aoristverb bezeichnet hier das Verbleiben beziehungsweise den fortgesetzten Aufenthalt an einem Ort. „Er blieb“ ist natürlich, präzise und weniger interpretierend als „er wohnte“.
- source_word: δὲ
  choice: und
  rationale: δέ führt die Erzählung hier als schwaches Bindewort weiter und bezeichnet keinen deutlichen Gegensatz. „Und“ gibt diesen Zusammenhang angemessen wieder.
- source_word: διετίαν ὅλην
  choice: zwei volle Jahre
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer; ὅλην betont, dass Paulus den gesamten Zeitraum von zwei Jahren dort blieb.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: in einer von ihm selbst gemieteten Unterkunft
  rationale: μίσθωμα bezeichnet gemietete Räumlichkeiten. Die Formulierung wahrt die Aussage von ἰδίῳ, ohne festzulegen, ob es sich um ein ganzes Haus oder eine Wohnung handelte.
- source_word: ἀπεδέχετο
  choice: nahm ... auf
  rationale: Der Imperfekt beschreibt ein fortgesetztes beziehungsweise wiederholtes Verhalten. „Nahm ... auf“ vermittelt hier den gastfreundlichen Empfang von Besuchern.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: alle, die zu ihm hereinkamen
  rationale: 'Die Wiedergabe erhält die räumliche Nuance von εἰσπορεύομαι: Die Besucher kamen in seine Unterkunft hinein und zu ihm.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unterkunft“ vermeidet eine unbegründete Festlegung auf Haus oder Wohnung; „hereinkamen“ bewahrt die räumliche Bedeutung des griechischen Partizips.
