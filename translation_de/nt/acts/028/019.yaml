  terminology: „Die Juden“, „Einspruch erhoben“, „auf den Kaiser berufen“ und „mein Volk“ sind im Kontext angemessen. Die kulturelle Fußnote sollte nicht ohne Not „Ankläger“ ergänzen, da ἀντιλέγοντες selbst lediglich Gegner bzw. Widersprechende bezeichnet.
