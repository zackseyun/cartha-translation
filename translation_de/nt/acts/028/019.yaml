source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: de
  text: Doch da die Juden Einspruch erhoben[a][b], sah ich mich gezwungen, mich auf den Kaiser zu berufen – nicht weil ich meinem Volk etwas vorzuwerfen hätte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während die Juden Widerstand leisteten“ beziehungsweise „da die Juden widersprachen“.'
    reason: lexical_alternative
  - marker: b
    text: „Die Juden“ bezeichnet hier im rechtlichen Zusammenhang die jüdischen Gegner des Paulus, nicht pauschal alle jüdischen Menschen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: da … Einspruch erhoben
  rationale: Das Partizip im Genitivus absolutus bezeichnet hier den Umstand, der Paulus zu seinem Schritt veranlasste. „Einspruch erhoben“ ist im rechtlichen Zusammenhang idiomatisch; die mögliche zeitliche oder allgemeinere Bedeutung wird in einer Fußnote bewahrt.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet einen milden Gegensatz beziehungsweise eine Weiterführung gegenüber der vorangehenden Aussage.
- source_word: τῶν Ἰουδαίων
  choice: die Juden
  rationale: Gibt die unpräzisierte Formulierung des griechischen Textes direkt wieder. Der Zusammenhang beschränkt den Bezug auf die jüdischen Gegner beziehungsweise Ankläger des Paulus; dies wird in einer Fußnote erläutert.
- source_word: ἠναγκάσθην
  choice: sah ich mich gezwungen
  rationale: Bewahrt den passiven Ausdruck von äußerem Druck oder auferlegter Notwendigkeit und klingt zugleich natürlich im Deutschen.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: mich auf den Kaiser zu berufen
  rationale: Entspricht dem rechtlichen Fachausdruck für die Berufung an den Kaiser und bewahrt den im Griechischen verwendeten Titel.
- source_word: οὐχ ὡς
  choice: nicht als hätte ich
  rationale: Gibt die nachgeschobene Klarstellung wieder, ohne sie stärker kausal festzulegen als der griechische Ausdruck.
- source_word: τοῦ ἔθνους μου
  choice: gegen mein Volk
  rationale: ἔθνος bezeichnet hier die eigene ethnisch-nationale Gemeinschaft des Paulus. „Mein Volk“ ist im heutigen Deutsch natürlicher als „meine Nation“ und wahrt den korporativen Sinn.
- source_word: ἔχων τι κατηγορεῖν
  choice: etwas vorzubringen
  rationale: Im Zusammenhang mit „gegen mein Volk“ vermittelt die Formulierung den forensischen Sinn einer belastenden Anschuldigung, ohne im Deutschen schwerfällig zu wirken.
theological_decisions:
- issue: Bezug der potenziell sensiblen Bezeichnung „die Juden“
  choice: Die direkte Wiedergabe „die Juden“ bleibt im Haupttext erhalten und wird kontextuell erläutert.
  alternative: „die jüdischen Ankläger“, „die jüdischen Führer“ oder „die Judäer“
  rationale: Der griechische Text schränkt die Bezeichnung nicht ausdrücklich auf Führer ein. Im Erzählzusammenhang sind jedoch die jüdischen Gegner beziehungsweise Ankläger des Paulus gemeint, nicht das jüdische Volk insgesamt. Eine Fußnote wahrt sowohl die Textnähe als auch die sachgerechte Einordnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einem dem rechtlichen Zusammenhang angemessenen Ton. Der Satzbau bleibt gut verständlich, während die Spannung zwischen äußerem Zwang und Paulus’ fehlender Anklageabsicht erhalten bleibt.
