    rationale: Der unmittelbare griechische Ausdruck nennt Juden, die widersprachen bzw. Widerstand leisteten; eine ausdrückliche Bezeichnung als Ankläger steht in diesem Vers nicht. „Jüdische Gegner des Paulus“ erläutert den Kontext ohne diese zusätzliche Einengung.
