  to: Doch da die Juden Einspruch erhoben[a][b], sah ich mich gezwungen, mich auf den Kaiser zu berufen – nicht weil ich meinem Volk etwas vorzuwerfen hätte.
  rationale: Die Revision schärft den durch κατηγορεῖν geforderten forensischen Vorwurfscharakter, ohne die Aussage zu erweitern. Die Fußnote bleibt sensibel und kontextbezogen, vermeidet jedoch die im Vers nicht ausdrücklich genannte Bezeichnung „Ankläger“.
