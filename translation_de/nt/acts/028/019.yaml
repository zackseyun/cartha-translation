  source_fidelity: 'Der Grundzug ist zutreffend: Der Genitivus absolutus bezeichnet den Anlass bzw. die Begleitumstände, Paulus wurde zum Appell an den Kaiser gezwungen, und die abschließende Verneinung grenzt eine Anklage gegen sein eigenes Volk aus. „Etwas vorzubringen“ ist jedoch weniger eindeutig forensisch als κατηγορεῖν; die Revision macht den Vorwurfs-/Anklagesinn ausdrücklich.'
