id: ACT.28.14
reference: Acts 28:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: de
  text: Dort fanden wir Brüder[a] und wurden eingeladen, sieben Tage bei ihnen zu bleiben. Und so kamen wir nach Rom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“. Im Griechischen steht „Brüder“; hier sind wahrscheinlich die Glaubensgeschwister allgemein gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Dort
  rationale: Das lokale Relativadverb verweist auf den zuvor genannten Ort Puteoli; am Satzanfang ist „Dort“ im modernen Deutschen natürlich.
- source_word: εὑρόντες
  choice: fanden wir
  rationale: Das Aoristpartizip hat dasselbe Subjekt wie das Hauptverb und wird zur natürlichen Wiedergabe der Handlungsfolge als finite Verbform übersetzt.
- source_word: ἀδελφοὺς
  choice: Brüder
  rationale: Die griechische maskuline Form wird lexikalisch genau wiedergegeben; im Zusammenhang bezeichnet sie sehr wahrscheinlich die dortigen Glaubensgeschwister allgemein.
- source_word: παρεκλήθημεν
  choice: wurden eingeladen
  rationale: Das Passiv von παρακαλέω bezeichnet hier im Kontext gewährter Gastfreundschaft am natürlichsten eine Einladung beziehungsweise Bitte.
- source_word: παρ’ αὐτοῖς ἐπιμεῖναι
  choice: bei ihnen zu bleiben
  rationale: παρά mit Dativ bezeichnet hier den Aufenthalt bei den örtlichen Glaubenden; ἐπιμένω bedeutet im Reisekontext „bleiben“.
- source_word: ἡμέρας ἑπτά
  choice: sieben Tage
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer; im Deutschen ist keine zusätzliche Präposition erforderlich.
- source_word: καὶ οὕτως
  choice: Und so
  rationale: Die Formulierung bewahrt den anschließenden beziehungsweise folgernden Übergang der Reiseerzählung in natürlichem Deutsch.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: kamen wir nach Rom
  rationale: ἔρχομαι mit εἰς bezeichnet das Erreichen des Ziels; bei Städtenamen ist „nach Rom kommen“ idiomatisches Deutsch.
theological_decisions:
- issue: Referent von ἀδελφοὺς
  choice: Brüder, im Sinn der örtlichen Glaubensgeschwister
  alternative: leibliche Brüder oder jüdische Landsleute allgemein
  rationale: In diesem Reise- und Gastfreundschaftskontext bezeichnet „Brüder“ in der Apostelgeschichte am ehesten Angehörige der christlichen Gemeinschaft. Der Haupttext bewahrt dennoch die konkrete griechische Bezeichnung, während die Fußnote den wahrscheinlich inklusiven Bezug erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Struktur der Reiseerzählung und der Übergang „Und so“ bleiben erhalten; „bei ihnen“ gibt die Gastfreundschaft idiomatisch wieder.
