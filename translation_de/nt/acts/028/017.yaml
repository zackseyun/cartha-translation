  to: 'Drei Tage später rief er die führenden Männer der Juden[a] zusammen. Als sie zusammengekommen waren, sagte er zu ihnen: »Brüder[b], obwohl ich nichts gegen das Volk oder die von den Vätern überlieferten Bräuche[c] getan habe, wurde ich als Gefangener aus Jerusalem in die Hände der Römer übergeben[d].«'
