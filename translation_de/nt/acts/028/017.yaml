id: ACT.28.17
reference: Acts 28:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: de
  text: 'Drei Tage später rief er die führenden Männer der Juden[a] zusammen. Als sie zusammengekommen waren, sagte er zu ihnen: »Brüder[b], obwohl ich nichts gegen das Volk oder die von den Vätern überlieferten Bräuche[c] getan habe, wurde ich als Gefangener aus Jerusalem in die Hände der Römer übergeben[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die führenden Vertreter der Juden«; wörtlicher: »die Ersten unter den Juden«.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Brüder« spricht Paulus hier die führenden jüdischen Männer an, die er zusammengerufen hatte.
    reason: cultural_note
  - marker: c
    text: 'Oder: »die überlieferten Bräuche der Vorfahren«; wörtlicher: »die väterlichen Bräuche«.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: »wurde ich als Gefangener aus Jerusalem in die Hände der Römer übergeben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Drei Tage später
  rationale: Die lukanische Übergangsformel mit Zeitangabe wird im modernen Deutschen natürlich wiedergegeben, ohne ein im Griechischen nicht ausdrücklich vorhandenes »nun« einzuführen.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: ließ er ... zusammenrufen
  rationale: 'Das Medium und der Kontext erlauben eine veranlassende Wiedergabe: Paulus lässt die örtlichen Repräsentanten zu sich rufen; »zusammenrufen« bewahrt den Sammlungssinn des συν-Präfixes.'
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: die führenden Männer der Juden
  rationale: πρῶτοι bezeichnet hier gesellschaftlichen Rang beziehungsweise führende Stellung, nicht zeitliche Reihenfolge; die männliche Bezeichnung passt zu den angeredeten ἄνδρες ἀδελφοί.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Als sie zusammengekommen waren
  rationale: Der Genitivus absolutus wird als natürlicher deutscher Temporalsatz wiedergegeben.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Ihr Brüder
  rationale: Die direkte Anrede wahrt die solidarische Bedeutung von ἀδελφοί und den männlichen Adressatenkreis. Das ausdrücklich gesetzte ἐγώ wird im anschließenden »ich« aufgenommen; ein zusätzliches »Ich, ihr Brüder« wäre im heutigen Deutsch schwerfällig.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: obwohl ich nichts gegen ... getan habe
  rationale: 'Das Partizip wird im Kontext konzessiv verstanden: Trotz der behaupteten Unschuld wurde Paulus ausgeliefert.'
- source_word: τῷ λαῷ
  choice: das Volk
  rationale: Gemeint ist das jüdische Volk. Da im Griechischen kein Possessivpronomen steht, wird keines ergänzt.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: die von den Vätern überlieferten Bräuche
  rationale: Die Formulierung bringt sowohl den Begriff der Bräuche als auch deren Herkunft aus der Tradition der Vorfahren zum Ausdruck, ohne ein modernes Konzept bloßer Gewohnheiten nahezulegen.
- source_word: δέσμιος
  choice: als Gefangener
  rationale: Das Prädikatsnomen bezeichnet den rechtlich-kustodialen Status des Paulus.
- source_word: ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: wurde ich in Jerusalem ... den Römern übergeben
  rationale: »Übergeben« gibt den rechtlich-kustodialen Sinn von παραδίδωμι idiomatisch wieder. Die Ortsformulierung bezeichnet Jerusalem als Ausgangspunkt der Übergabe; im Deutschen ist »in Jerusalem ... übergeben« hier natürlich und sachlich zutreffend.
theological_decisions:
- issue: Wiedergabe von ἀδελφοί in der direkten Anrede
  choice: Ihr Brüder
  alternative: Brüder und Schwestern
  rationale: Paulus spricht die zuvor zusammengerufenen führenden jüdischen Männer an. Die maskuline Wiedergabe erhält sowohl die Form des Ausgangstextes als auch den konkreten Adressatenkreis.
- issue: Sinn des Partizips οὐδὲν ἐναντίον ποιήσας
  choice: 'konzessiv: »obwohl ich nichts ... getan habe«'
  alternative: 'modal/umständlich: »ohne etwas ... getan zu haben«'
  rationale: Der Zusammenhang hebt den Gegensatz zwischen Paulus’ behaupteter Unschuld und seiner Übergabe an die Römer hervor. Die konzessive Fassung macht diesen im Satz angelegten Gegensatz sichtbar, ohne ihn theologisch weiter auszudeuten.
- issue: Bezug von τῷ λαῷ
  choice: das Volk
  alternative: unser Volk
  rationale: Der Kontext identifiziert das jüdische Volk eindeutig, doch der griechische Text enthält kein ausdrückliches Possessiv. Die Übersetzung vermeidet daher eine unnötige Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählung beginnt ohne künstlichen Diskursmarker. Direkte Rede ist klar und mündlich verständlich, bleibt aber dem rechtlich-kustodialen Ton des griechischen Textes verpflichtet. Sämtliche Fußnotenmarker stehen an der jeweils erläuterten Textstelle.
