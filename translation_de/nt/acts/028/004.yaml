id: ACT.28.4
reference: Acts 28:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: de
  text: 'Als die Inselbewohner sahen, wie das Tier an seiner Hand hing, sagten sie zueinander: »Dieser Mensch ist bestimmt ein Mörder. Obwohl er aus dem Meer gerettet wurde, hat die Gerechtigkeit[a] ihn nicht am Leben gelassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier die vergeltende Gerechtigkeit als handelnde Macht bezeichnen; möglicherweise dachten die Inselbewohner dabei an eine Göttin.
    reason: Kulturelle und theologische Erläuterung der Personifikation von δίκη, ohne die mögliche mythologische Identifikation im Haupttext festzulegen.
lexical_decisions:
- source_word: βάρβαροι
  choice: Inselbewohner
  rationale: Der griechische Ausdruck bezeichnet hier die nicht griechisch sprechenden Einheimischen Maltas, ohne das heutige abwertende Urteil von »Barbaren«; »Inselbewohner« gibt den Bezug im Kontext natürlich wieder.
- source_word: κρεμάμενον
  choice: hing
  rationale: Das Partizip beschreibt anschaulich, dass das Tier an Paulus’ Hand hing, ohne genauer festzulegen, ob es baumelte oder sich festklammerte.
- source_word: τὸ θηρίον
  choice: das Tier
  rationale: Das Substantiv ist allgemein und bedeutet »Tier« oder »Geschöpf«; die nähere Bestimmung als Schlange ergibt sich aus dem Kontext, wird hier aber nicht vorweggenommen.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: sagten sie zueinander
  rationale: Die Formulierung bildet den wechselseitigen Austausch ausdrücklich ab; der deutsche Erzählstil kann den griechischen Imperfekt natürlich mit dem Präteritum wiedergeben.
- source_word: Πάντως
  choice: bestimmt
  rationale: Das Wort drückt die feste Schlussfolgerung der Inselbewohner aus; »bestimmt« klingt in direkter Rede natürlich und bewahrt ihre Gewissheit.
- source_word: φονεύς
  choice: ein Mörder
  rationale: Dies ist die klare und übliche deutsche Entsprechung für jemanden, der einen Mord begangen hat.
- source_word: διασωθέντα
  choice: gerettet wurde
  rationale: Das Verb bezeichnet das sichere Durchkommen aus einer tödlichen Gefahr. Im unmittelbaren Zusammenhang ist »aus dem Meer gerettet« eindeutig und trägt keine notwendige heilsgeschichtliche Zusatzbedeutung ein.
- source_word: ἡ δίκη
  choice: die Gerechtigkeit
  rationale: Die Gerechtigkeit erscheint hier als vergeltende, handelnde Macht. Der bestimmte Artikel und die Handlung bewahren die Personifikation auch ohne typografische Festlegung auf einen Eigennamen.
- source_word: ζῆν οὐκ εἴασεν
  choice: nicht am Leben gelassen
  rationale: Die idiomatische deutsche Wendung gibt wieder, dass die personifizierte Gerechtigkeit ihm nach Ansicht der Sprecher das Weiterleben verweigert habe.
- source_word: ἐκ τῆς θαλάσσης
  choice: aus dem Meer
  rationale: ἐκ bezeichnet die Herkunft beziehungsweise das Herauskommen aus dem Meer; die Formulierung ist präzise und im Deutschen natürlich.
theological_decisions:
- issue: Personifikation von δίκη
  choice: »die Gerechtigkeit« als handelnde Macht, erläutert durch eine Fußnote
  alternative: »Dike«, »die Göttin der Gerechtigkeit« oder unpersönlich »die Vergeltung«
  rationale: Der Text gibt die Deutung der Inselbewohner wieder und lässt offen, ob eine konkrete Göttin oder allgemeiner eine personifizierte vergeltende Gerechtigkeit gemeint ist. Die Übersetzung wahrt diese Spannung, ohne die berichtete heidnische Vorstellung als Urteil des Erzählers auszugeben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Inselbewohner« vermeidet die heute irreführende wörtliche Wiedergabe »Barbaren«. Die direkte Rede ist idiomatisch formuliert, während die personifizierte Gerechtigkeit und die Kausalspannung des griechischen Satzes erhalten bleiben.
