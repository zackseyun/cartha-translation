id: ACT.28.29
reference: Acts 28:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: robinson-pierpont-2005-byzantine
  text: Καὶ ταῦτα αὐτοῦ εἰπόντος, ἀπῆλθον οἱ Ἰουδαῖοι, πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: de
  text: Nachdem er dies gesagt hatte,[a] gingen die Juden weg; untereinander führten sie eine heftige Auseinandersetzung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser ganze Vers fehlt in den frühesten griechischen Handschriften, darunter Papyrus 74 aus dem 3. Jahrhundert sowie der Codex Sinaiticus und der Codex Vaticanus aus dem 4. Jahrhundert, und auch in frühen koptischen Übersetzungen. Er steht jedoch in der byzantinischen Mehrheitstradition sowie in frühen lateinischen und syrischen Übersetzungen. Wahrscheinlich handelt es sich um eine spätere Ergänzung von Abschreibern, die den Bericht über den Weggang der Juden abrunden sollte.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: Auseinandersetzung
  rationale: Das Wort bezeichnet eine Diskussion, Debatte oder einen Streit. „Heftige Auseinandersetzung“ gibt zusammen mit πολλήν die Intensität und die Uneinigkeit der Beteiligten wieder, ohne körperlichen Streit anzudeuten.
- source_word: ἀπέρχομαι
  choice: weggehen
  rationale: Das geläufige Bewegungsverb wird mit „gingen … weg“ natürlich und dem erzählenden Zusammenhang angemessen wiedergegeben.
- source_word: ἐν ἑαυτοῖς
  choice: untereinander
  rationale: Die Wendung bezeichnet hier eine Auseinandersetzung innerhalb der Gruppe und wird im Deutschen knapp und idiomatisch mit „untereinander“ wiedergegeben.
theological_decisions: []
