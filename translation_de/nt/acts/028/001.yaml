lexical_decisions:
- source_word: διασωθέντες
  choice: Nachdem wir gerettet waren
  rationale: Das Aorist-Passiv-Partizip bezeichnet die vorangegangene sichere Rettung aus der Gefahr des Schiffbruchs. Die Formulierung wahrt den passiven Sinn und klingt im modernen Deutschen natürlich.
- source_word: τότε
  choice: durch die zeitliche Konstruktion „Nachdem …, erfuhren wir“ wiedergegeben
  rationale: Die zeitliche Abfolge ist im deutschen Satz bereits eindeutig markiert; ein zusätzliches „dann“ wäre möglich, aber stilistisch entbehrlich.
- source_word: ἐπέγνωμεν
  choice: erfuhren wir
  rationale: Das Verb bezeichnet hier das Erlangen einer zuvor unbekannten Information, nämlich des Inselnamens.
- source_word: Μελίτη
  choice: Malta
  rationale: Malta ist die herkömmliche deutsche Namensform der mit Μελίτη bezeichneten Insel.
- source_word: ἡ νῆσος
  choice: die Insel
  rationale: Direkte und natürliche Entsprechung der griechischen Nominalgruppe.
- source_word: καλεῖται
  choice: heißt
  rationale: Das griechische Präsens Passiv wird mit dem im Deutschen idiomatischen Namensausdruck „heißt“ wiedergegeben und behält dabei die Gegenwartsform bei.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die anfängliche griechische Konjunktion Καί wird nicht eigens wiedergegeben, da der Vers im Deutschen als neuer Satz natürlich anschließt; die zeitliche Abfolge von Partizip und Hauptverb bleibt klar.
