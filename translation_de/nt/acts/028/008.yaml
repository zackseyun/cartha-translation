id: ACT.28.8
reference: Acts 28:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: de
  text: Es geschah aber, dass der Vater des Publius mit Fieberanffällen und Ruhr krank darniederlag. Paulus ging zu ihm hinein, betete, legte ihm die Hände auf und heilte ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Es geschah aber, dass
  rationale: Gibt die lukanische Erzählüberleitung samt der verbindenden Kraft von δέ wieder, ohne ein nicht ausdrücklich vorhandenes zeitliches »nun« einzuführen.
- source_word: τὸν πατέρα τοῦ Ποπλίου
  choice: der Vater des Publius
  rationale: Entspricht der griechischen Genitivkonstruktion und klingt im Deutschen natürlich.
- source_word: πυρετοῖς
  choice: mit Fieberanfällen
  rationale: Bewahrt den ausdrücklich gesetzten Plural und legt wiederkehrende fiebrige Episoden nahe, ohne die Erkrankung genauer zu diagnostizieren.
- source_word: δυσεντερίῳ
  choice: Ruhr
  rationale: Ist die geläufige moderne deutsche Bezeichnung für Dysenterie und gibt den medizinischen Sinn knapp wieder.
- source_word: συνεχόμενον κατακεῖσθαι
  choice: daniederlag
  rationale: Bündelt das Liegen und das fortdauernde Ergriffensein von der Krankheit in einer natürlichen, würdigen deutschen Formulierung.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθών
  choice: Paulus ging zu ihm hinein
  rationale: Macht sowohl das Eintreten als auch die Hinwendung zu dem Kranken deutlich.
- source_word: προσευξάμενος
  choice: betete
  rationale: Die vorzeitige Handlung ist durch die deutsche Abfolge der Verben klar; eine schwerfällige Partizipialkonstruktion ist unnötig.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: legte ihm die Hände auf
  rationale: Die übliche und genaue deutsche Wiedergabe der Geste; der Plural »Hände« bleibt erhalten.
- source_word: ἰάσατο αὐτόν
  choice: heilte ihn
  rationale: Gibt die Heilung direkt wieder, ohne Art, Zeitpunkt oder Wirkweise näher festzulegen.
theological_decisions:
- issue: Art der durch Paulus bewirkten Heilung
  choice: Die Abfolge von Gebet, Handauflegung und Heilung wird ohne weitere Deutung erzählt.
  alternative: Die Heilung ausdrücklich als augenblickliches Wunder oder als sakramentale Handlung bezeichnen.
  rationale: Der griechische Text bezeugt die Heilung, bestimmt aber weder ausdrücklich ihre Geschwindigkeit noch versieht er sie hier mit einer technischen theologischen Bezeichnung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. »Daniederlag« ist leicht gehoben, aber weiterhin geläufig und bildet die knappe griechische Krankheitsbeschreibung gut ab.
