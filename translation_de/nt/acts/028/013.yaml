  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: de
  text: Von dort legten wir ab[a] und kamen nach Rhegion. Am folgenden Tag kam ein Südwind auf, und am zweiten Tag erreichten wir Puteoli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem wir den Anker gelichtet hatten“. Das griechische Wort περιελόντες ist hier nautisch gebraucht und kann speziell das Lichten des Ankers oder allgemeiner das Ablegen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Von dort
  rationale: Natürlicher räumlicher Übergang in einer Reiseerzählung; gibt den Bezug auf den zuvor genannten Ort klar wieder.
- source_word: περιελόντες
  choice: legten wir ab
  rationale: Das Partizip steht hier in nautischem Zusammenhang und bezeichnet das Losmachen beziehungsweise Aufbrechen des Schiffes. „Ablegen“ ist im modernen Deutschen natürlich und bewahrt die etwas allgemeinere Bedeutung.
- source_word: κατηντήσαμεν
  choice: kamen
  rationale: Das Verb bezeichnet das Gelangen an ein Ziel; „kamen nach“ fügt sich natürlich in den Erzählfluss.
- source_word: Ῥήγιον
  choice: Rhegion
  rationale: Transliteration des antiken griechischen Ortsnamens.
- source_word: μετὰ μίαν ἡμέραν
  choice: Am folgenden Tag
  rationale: Idiomatiche deutsche Wiedergabe der zeitlichen Angabe „nach einem Tag“, ohne den Ablauf zu verändern.
- source_word: ἐπιγενομένου νότου
  choice: kam Südwind auf
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet einen eintretenden Begleitumstand; „aufkommen“ ist für Wind im Deutschen natürlich.
- source_word: δευτεραῖοι
  choice: am zweiten Tag
  rationale: Bewahrt die ausdrückliche Angabe des griechischen Textes, dass das Ziel am zweiten Tag erreicht wurde.
- source_word: ἤλθομεν
  choice: erreichten wir
  rationale: Mit einem Reiseziel ist „erreichen“ natürlich und verdeutlicht die Ankunft, ohne zusätzliche Bedeutung einzutragen.
- source_word: Ποτιόλους
  choice: Puteoli
  rationale: Übliche lateinische Namensform des antiken Ortes im Deutschen.
