id: ACT.28.27
reference: Acts 28:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: de
  text: Denn das Herz dieses Volkes ist abgestumpft; mit ihren Ohren hören sie nur schwer, und ihre Augen haben sie verschlossen, damit sie nicht etwa[a] mit den Augen sehen und mit den Ohren hören und mit dem Herzen verstehen und umkehren[b] und ich sie heile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sonst könnten sie mit den Augen sehen und mit den Ohren hören und mit dem Herzen verstehen und umkehren, und ich würde sie heilen.“ Die griechische Verbindung kann hier sowohl eine Verhinderung als auch die andernfalls mögliche Folge ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: „Umkehren“ kann auch mit „zurückkehren“ oder im Zusammenhang mit „sich bekehren“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: ist abgestumpft
  rationale: Das Verb bedeutet wörtlich, dick oder fett zu werden, und bezeichnet hier bildlich innere Unempfindlichkeit. „Ist abgestumpft“ gibt diesen Sinn in natürlichem Deutsch wieder, ohne ihn rein erklärend aufzulösen.
- source_word: καρδία
  choice: Herz
  rationale: „Herz“ bewahrt den biblischen anthropologischen Begriff und die begriffliche Verbindung zu „mit dem Herzen verstehen“.
- source_word: βαρέως ἤκουσαν
  choice: mit ihren Ohren hören sie nur schwer
  rationale: Das idiomatische Präsens entspricht der in der Jesaja-Anführung beschriebenen anhaltenden Haltung; „nur schwer hören“ gibt den Sinn des wörtlich schweren Hörens verständlich wieder.
- source_word: ἐκάμμυσαν
  choice: ihre Augen haben sie verschlossen
  rationale: Das Verb bezeichnet das Schließen der Augen. Das Perfekt formuliert im Deutschen den gegenwärtig wirksamen Zustand natürlich.
- source_word: μήποτε
  choice: damit sie nicht etwa
  rationale: Die Wendung bewahrt die mögliche Zweck- beziehungsweise Verhinderungsnuance der griechischen Konjunktion und damit die Spannung des Zitats. Eine weniger stark finale Lesart wird in der Fußnote genannt.
- source_word: ἐπιστρέψωσιν
  choice: umkehren
  rationale: „Umkehren“ bewahrt die Richtungs- und Bekehrungsmetaphorik, ohne den Ausdruck auf einen konfessionell geprägten Fachbegriff zu verengen.
- source_word: ἰάσομαι
  choice: ich sie heilen werde
  rationale: Der griechische Futur wird formal als Zukunft wiedergegeben; die Gedankenfolge bleibt trotz der im Deutschen markierten Verhinderungsklausel erkennbar.
theological_decisions:
- issue: Göttliche Absicht im Jesaja-Zitat
  choice: μήποτε mit „damit sie nicht etwa“ wiedergeben
  alternative: „sonst könnten sie … und ich würde sie heilen“
  rationale: Die gewählte Fassung erhält die im griechischen Zitat mögliche starke Zweck- oder Verhinderungsnuance und damit die Spannung zwischen Gericht und menschlicher Verantwortlichkeit, ohne diese systematisch zu erklären. Die alternative konditionale Auffassung wird in einer Fußnote bewahrt.
- issue: Bedeutung von ἐπιστρέψωσιν
  choice: umkehren
  alternative: sich bekehren; zurückkehren
  rationale: „Umkehren“ lässt sowohl die bildhafte Richtungsänderung als auch den kontextuellen geistlichen Sinn offen und vermeidet unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau des Jesaja-Zitats bleibt erhalten. Die ungewöhnliche theologische Spannung wird nicht geglättet; die Hauptfassung folgt der stärkeren μήποτε-Nuance, während die alternative konditionale Lesart transparent dokumentiert wird.
