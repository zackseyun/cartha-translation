  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: de
  text: Als Paulus aber eine Menge Reisig zusammengesammelt und auf das Feuer gelegt hatte, kam wegen der Hitze[a] eine Viper hervor und heftete sich an seine Hand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Hitze“. Die griechische Präposition kann wörtlicher so wiedergegeben werden; wahrscheinlich bezeichnet sie hier jedoch die Ursache: Die Viper kam wegen der Hitze des Feuers hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „packte seine Hand“; möglicherweise auch: „biss ihn in die Hand“. Das griechische Verb bedeutet allgemein, sich an etwas zu heften oder etwas zu ergreifen, und legt die genaue Art des Kontakts nicht ausdrücklich fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: zusammengesammelt hatte
  rationale: Das Aoristpartizip im Genitivus absolutus bezeichnet hier eine vorausgehende Handlung des Paulus. Im Zusammenhang mit Brennmaterial bedeutet das Verb natürlich „zusammensammeln“, nicht wörtlich „zusammendrehen“.
- source_word: φρυγάνων τι πλῆθος
  choice: eine Menge Reisig
  rationale: φρύγανα bezeichnet trockenes Kleinholz beziehungsweise Gestrüpp als Brennmaterial; τι πλῆθος nennt eine unbestimmte Menge. „Eine Menge Reisig“ gibt beides knapp und natürlich wieder.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: auf das Feuer gelegt hatte
  rationale: Das zweite Aoristpartizip setzt die vorausgehende Handlung fort. πυρά bezeichnet hier das entzündete Feuer; „auf das Feuer legen“ ist im Deutschen idiomatisch.
- source_word: ἔχιδνα
  choice: eine Viper
  rationale: ἔχιδνα bezeichnet spezifisch eine Viper beziehungsweise Giftschlange und sollte nicht zum allgemeinen „Schlange“ verflacht werden.
- source_word: ἀπὸ τῆς θέρμης
  choice: wegen der Hitze
  rationale: 'ἀπό kann räumlich „von/aus“ bedeuten, bezeichnet hier aber wahrscheinlich den auslösenden Grund: Die Hitze trieb die Viper hervor. Die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.'
- source_word: ἐξελθοῦσα
  choice: kam … hervor
  rationale: Das Partizip beschreibt das Hervorkommen der Viper. „Hervorkommen“ ist in diesem Kontext natürlich und bewahrt die räumliche Vorstellung.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: heftete sich an seine Hand
  rationale: καθάπτω kann „ergreifen“ oder „sich festheften“ bedeuten. Die Formulierung bewahrt das Bild des Anhaftens, ohne ausdrücklich festzulegen, ob der Erzähler mit dem Verb selbst den Biss bezeichnet.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Vorzeitigkeit der beiden Handlungen des Paulus wird durch das Plusquamperfekt ausgedrückt. „Reisig“ ist präziser als das allgemeinere „Stöcke“, und die mögliche Mehrdeutigkeit von ἀπό sowie καθάπτω bleibt durch Fußnoten erhalten.
