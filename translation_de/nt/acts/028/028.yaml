  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: de
  text: 'Darum sollt ihr wissen: Dieses Heil Gottes[a] ist zu den Nichtjuden gesandt worden; auch sie werden hören[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieses Heil von Gott.“ Der griechische Genitiv lässt mehrere eng verwandte Deutungen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auch sie werden darauf hören.“ Das griechische Verb kann je nach Zusammenhang bloßes Hören oder aufmerksames, bereitwilliges Hören bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Darum sollt ihr wissen
  rationale: Die natürliche deutsche Wendung bewahrt sowohl den Folgerungscharakter von οὖν als auch den öffentlichen, nachdrücklichen Aussagecharakter der griechischen Konstruktion.
- source_word: τοῖς ἔθνεσιν
  choice: zu den Nichtjuden
  rationale: Im vorliegenden jüdisch-nichtjüdischen Gegensatz bezeichnet ἔθνη Menschen außerhalb des jüdischen Volkes. „Nichtjuden“ ist im heutigen Standarddeutsch klarer als „Heiden“ und kontextuell genauer als „Völker“.
- source_word: ἀπεστάλη
  choice: ist ... gesandt worden
  rationale: Das deutsche Perfekt gibt die abgeschlossene Sendung mit fortdauernder Bedeutung natürlich wieder und bewahrt das Passiv.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: Dieses Heil Gottes
  rationale: σωτήριον wird substantivisch als „Heil“ wiedergegeben. Der Genitiv „Gottes“ bleibt bewusst offen dafür, ob Herkunft, Zugehörigkeit oder Wirken Gottes im Vordergrund steht.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: sie werden auch hören
  rationale: „Hören“ bewahrt die lexikalische Offenheit von ἀκούω. Der Kontext kann ein aufmerksames oder bereitwilliges Hören nahelegen, ohne dass dies im Haupttext ausdrücklich festgelegt wird; καί wird mit „auch“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von σωτήριον im Zusammenhang
  choice: „Heil“ statt „Heilsbotschaft“
  alternative: Heilsbotschaft
  rationale: Der griechische Ausdruck bezeichnet unmittelbar das Heil. Obwohl der Zusammenhang dessen Verkündigung einschließt, würde „Heilsbotschaft“ die Aussage erklärend verengen.
- issue: Verhältnis des Heils zu Gott im Genitiv τοῦ θεοῦ
  choice: „Heil Gottes“
  alternative: Heil von Gott
  rationale: Die eng verwandten Möglichkeiten des griechischen Genitivs werden im Haupttext nicht einseitig auf die Herkunft festgelegt.
- issue: Kraft von ἀκούσονται
  choice: „werden ... hören“
  alternative: werden ... darauf hören
  rationale: Der Kontext legt empfängliches Hören nahe, doch das schlichte „hören“ bewahrt die sprachliche und theologische Spannung, statt die Reaktion der Nichtjuden stärker auszudeuten als der Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nichtjuden“ vermeidet die heute oft missverständliche oder abwertend wirkende Bezeichnung „Heiden“. Die Satzstellung ist natürlich, während Passiv, Folgerung und die Mehrdeutigkeit zentraler Ausdrücke erhalten bleiben.
