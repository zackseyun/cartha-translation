  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: de
  text: Wir liefen Syrakus[a] an und blieben drei Tage dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nachdem wir in Syrakus an Land gegangen waren«. Das griechische Verb ist hier im Sinn der Seefahrt gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: wir liefen … an
  rationale: κατάγω hat in diesem Reise- und Seefahrtskontext den Sinn, einen Hafen anzulaufen beziehungsweise dort anzulanden. Die finite deutsche Wendung gibt das vorzeitige Partizip natürlich wieder.
- source_word: εἰς Συρακούσας
  choice: Syrakus
  rationale: Bei »einen Hafen anlaufen« wird das Ziel im Deutschen ohne Präposition ausgedrückt. »Syrakus« ist die übliche deutsche Namensform.
- source_word: ἐπεμείναμεν
  choice: blieben … dort
  rationale: Das Verb bezeichnet das Bleiben oder Verweilen. »Dort« nimmt den zuvor genannten Ort natürlich wieder auf.
- source_word: ἡμέρας τρεῖς
  choice: drei Tage
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer; im Deutschen ist bei »bleiben« keine zusätzliche Präposition nötig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nautische Wendung »einen Hafen anlaufen« bewahrt den konkreten Reisecharakter des griechischen Textes; die Satzstruktur wurde für natürliches Deutsch leicht geglättet.
