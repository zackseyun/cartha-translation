  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: de
  text: Er verkündete das Reich Gottes und lehrte über den Herrn Jesus, den Messias[a], mit allem Freimut und ungehindert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“. Das griechische Wort Χριστός kann als Titel („Messias“) oder in manchen Zusammenhängen als namensähnliche Bezeichnung („Christus“) gebraucht werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: Er verkündete
  rationale: Das präsentische Partizip beschreibt die fortdauernde Tätigkeit des Paulus. Da der Vers im Deutschen als eigenständiger Satz wiedergegeben wird, wird es idiomatisch in eine finite Verbform überführt; „verkündete“ bewahrt den öffentlichen, proklamierenden Sinn.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die etablierte deutsche Wendung ist natürlich und lässt sowohl den Herrschaftsbereich als auch Gottes wirksames Königtum anklingen.
- source_word: διδάσκων τὰ περὶ
  choice: und lehrte, was … betrifft
  rationale: Die koordinierte Tätigkeit des Lehrens bleibt erhalten. Die Formulierung gibt die griechische Wendung τὰ περὶ verständlich und ohne inhaltliche Ergänzungen wieder.
- source_word: τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: den Herrn Jesus, den Messias
  rationale: „Herr“ bewahrt κύριος als christologischen Titel. „Messias“ macht die Titelbedeutung von Χριστός sichtbar; die Apposition ist im Deutschen natürlicher als „Jesus Messias“.
- source_word: μετὰ πάσης παρρησίας
  choice: mit allem Freimut
  rationale: „Freimut“ bezeichnet offenes, furchtloses und zuversichtliches Reden; „allem“ gibt die verstärkende Kraft von πάσης wieder.
- source_word: ἀκωλύτως
  choice: ungehindert
  rationale: Das abschließende Adverb wird knapp und betont am Satzende wiedergegeben und bewahrt so den wirkungsvollen Abschluss der Apostelgeschichte.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Titelfolge Ἰησοῦ Χριστοῦ
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Χριστός kann hier weiterhin als Titel verstanden werden. „Messias“ legt dessen semantischen Gehalt offen, während die geläufige namensähnliche Wiedergabe „Christus“ als echte Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die finite Form macht das griechische Partizip im Zusammenhang eines deutschen Einzelsatzes natürlich lesbar. Der Gedankenstrich bündelt die beiden abschließenden Bestimmungen, ohne ihre mögliche Beziehung zu beiden Tätigkeiten unnötig festzulegen.
