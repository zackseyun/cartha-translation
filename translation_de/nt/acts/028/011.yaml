id: ACT.28.11
reference: Acts 28:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: de
  text: Nach drei Monaten stachen wir mit einem alexandrinischen Schiff in See, das auf der Insel überwintert hatte. Es trug die Dioskuren[a] als Schiffszeichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Dioskuren sind Kastor und Pollux, die mythischen Zwillingssöhne des Zeus.
    reason: Erklärung einer heute wenig bekannten mythologischen Eigenbezeichnung.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Nach drei Monaten
  rationale: μετά mit Akkusativ bezeichnet einen Zeitpunkt nach Ablauf einer Frist. Das schwach verbindende δέ muss im natürlichen Deutschen nicht eigens wiedergegeben werden.
- source_word: ἀνήχθημεν
  choice: stachen wir … in See
  rationale: ἀνάγω ist hier nautisch gebraucht und bedeutet, vom Land abzulegen beziehungsweise in See zu stechen.
- source_word: ἐν πλοίῳ … Ἀλεξανδρίνῳ
  choice: mit einem alexandrinischen Schiff
  rationale: Die Wendung bezeichnet das Schiff als Verkehrsmittel; Ἀλεξανδρίνῳ weist auf seine Herkunft aus Alexandria hin. „Mit“ ist im Deutschen idiomatischer als eine wörtliche Wiedergabe von ἐν.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: das auf der Insel überwintert hatte
  rationale: Das Perfektpartizip von παραχειμάζω bezeichnet einen abgeschlossenen Winteraufenthalt mit fortbestehender Relevanz. „Auf der Insel“ entspricht dem deutschen Sprachgebrauch; aus dem Kontext ist Malta gemeint.
- source_word: παρασήμῳ Διοσκούροις
  choice: Es trug die Dioskuren als Schiffszeichen
  rationale: παράσημος bezeichnet ein kennzeichnendes Emblem oder Zeichen. „Schiffszeichen“ wahrt die mögliche Bandbreite und legt sich weniger stark als „Galionsfigur“ auf die konkrete Ausführung oder Position fest. Διόσκουροι wird als Eigenbezeichnung „Dioskuren“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des heidnischen Schiffszeichens Διοσκούροις
  choice: die Dioskuren
  alternative: Kastor und Pollux; die Zwillingsgötter
  rationale: Die Eigenbezeichnung bildet den griechischen Ausdruck präzise ab, ohne den berichteten heidnischen Bezug zu billigen oder interpretierend umzubenennen. Eine Fußnote erklärt den heutigen Lesern den mythologischen Bezug.
- issue: Konkrete Gestalt des παράσημον
  choice: Schiffszeichen
  alternative: Galionsfigur; Wahrzeichen
  rationale: Der griechische Ausdruck bezeichnet ein Kennzeichen oder Emblem, sagt aber nicht eindeutig, dass es sich um eine am Bug angebrachte Figur handelte. Die Übersetzung bewahrt diese sachliche Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Partizipialkonstruktion. „In See stechen“ ist eine geläufige nautische Wendung; „Schiffszeichen“ bleibt gegenüber der konkreteren, aber nicht sicheren Deutung „Galionsfigur“ bewusst zurückhaltend.
