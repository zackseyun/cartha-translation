  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: de
  text: Aus diesem Grund also habe ich euch gebeten, euch zu sehen und mit euch zu sprechen; denn wegen der Hoffnung Israels[a] trage ich diese Kette.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israels Hoffnung“. Wahrscheinlich bezieht sich dies auf die Bundes- und Auferstehungshoffnung, die Paulus verkündet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Aus diesem Grund also
  rationale: Bewahrt sowohl die ausdrückliche Begründung als auch die folgernde Partikel, ohne im Deutschen unnötig schwerfällig zu klingen.
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν
  choice: habe ich euch gebeten, mich mit euch treffen … zu können
  rationale: Gibt die Bitte und das beabsichtigte persönliche Zusammentreffen in natürlichem Deutsch wieder. Die Formulierung berücksichtigt, dass Paulus als Gefangener die Begegnung nicht selbst frei arrangieren konnte.
- source_word: προσλαλῆσαι
  choice: mit euch sprechen
  rationale: Bringt den wechselseitigen, persönlichen Gesprächscharakter zum Ausdruck und vermeidet den Eindruck einer bloß einseitigen Ansprache.
- source_word: ἕνεκεν γὰρ
  choice: denn wegen
  rationale: Erhält sowohl die begründende Funktion von γάρ als auch die kausale Bedeutung von ἕνεκεν in knapper, idiomatischer Form.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: der Hoffnung Israels
  rationale: Bewahrt die kompakte Genitivverbindung und legt nicht fest, ob vor allem die Bundes-, messianische oder Auferstehungshoffnung gemeint ist.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: trage ich diese Kette
  rationale: Gibt das konkrete Bild des Verbs περίκειμαι und den Singular ἅλυσιν anschaulich wieder, ohne die Wendung abstrakt als bloße Gefangenschaft aufzulösen.
theological_decisions:
- issue: Bedeutung der „Hoffnung Israels“
  choice: die Hoffnung Israels
  alternative: Israels Auferstehungshoffnung; die Israel verheißene Hoffnung; Israels messianische Hoffnung
  rationale: Die Wendung kann die Bundesverheißungen, die Auferstehung und die messianische Erfüllung in Jesus anklingen lassen, benennt im griechischen Text aber keine dieser Bedeutungen ausdrücklich. Die Übersetzung hält diese theologische Dichte und Offenheit fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leichte Häufung „Aus diesem Grund also“ spiegelt die doppelte logische Markierung des griechischen Textes. „Diese Kette tragen“ bewahrt das körperlich-konkrete Bild der Haft.
