  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: de
  text: Er aber schüttelte das Tier[a] ins Feuer ab und erlitt keinen Schaden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das wilde Tier“; das griechische Wort ist allgemein, doch aus dem Zusammenhang geht hervor, dass eine Schlange gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Er aber
  rationale: Der Artikel steht pronominal und verweist auf Paulus. Die Partikeln markieren den Fortgang der Erzählung und einen leichten Gegensatz zur erwarteten Wirkung; „Er aber“ gibt dies knapp und natürlich wieder.
- source_word: ἀποτινάξας
  choice: schüttelte ... ab
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Im Deutschen lässt sich die Abfolge idiomatisch durch zwei koordinierte Verben ausdrücken.
- source_word: τὸ θηρίον
  choice: das Tier
  rationale: θηρίον ist eine allgemeine Bezeichnung für ein Tier, häufig ein wildes oder gefährliches. Der Kontext bezeichnet es näher als Schlange; die Übersetzung bewahrt jedoch die allgemeinere Wortwahl dieses Verses.
- source_word: εἰς τὸ πῦρ
  choice: ins Feuer
  rationale: Die Richtungsangabe εἰς mit Akkusativ wird direkt und idiomatisch wiedergegeben.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: erlitt keinen Schaden
  rationale: Die deutsche feste Verbindung gibt sowohl πάσχω als auch die Verneinung von etwas Schädlichem präzise und natürlich wieder.
