  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: de
  text: Die Einheimischen erwiesen uns außergewöhnliche Freundlichkeit[a]. Denn sie entzündeten ein Feuer und nahmen uns alle freundlich auf, weil der Regen eingesetzt hatte und weil es kalt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „keine gewöhnliche Menschenfreundlichkeit“. Das griechische Wort für „Einheimische“ bezeichnet hier nichtgriechischsprachige Bewohner; es impliziert nicht notwendigerweise Unzivilisiertheit oder Wildheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: die Einheimischen
  rationale: Das Wort bezeichnet hier die nicht griechischsprachigen Bewohner der Insel, ohne dass damit notwendig Unzivilisiertheit gemeint ist. „Einheimische“ gibt den Bezug im heutigen Deutsch neutral wieder.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: außergewöhnliche Menschenfreundlichkeit
  rationale: Die verneinende Wendung bedeutet idiomatisch „keine gewöhnliche“, also außergewöhnliche Menschenfreundlichkeit. „Menschenfreundlichkeit“ bewahrt die Bedeutung von φιλανθρωπία und passt zu der konkret erwiesenen Fürsorge.
- source_word: παρεῖχον
  choice: erwiesen
  rationale: Mit φιλανθρωπία bezeichnet das Verb das tätige Erweisen einer wohlwollenden Haltung; „erwiesen“ ist im Deutschen natürlich und präzise.
- source_word: ἅψαντες ... πυρὰν
  choice: zündeten ... ein Feuer an
  rationale: Die Verbindung bezeichnet das Entfachen eines Feuers. Die finite Wiedergabe macht den begründenden Zusammenhang nach γάρ im Deutschen flüssig.
- source_word: προσελάβοντο
  choice: nahmen ... bei sich auf
  rationale: Das Medium bezeichnet hier gastfreundliches Aufnehmen. Die Formulierung lässt offen, ob darüber hinaus eine Unterbringung gemeint ist, und passt zum Sammeln am Feuer.
- source_word: πάντας ἡμᾶς
  choice: uns alle
  rationale: Die Wortfolge bewahrt die Betonung, dass niemand von der Aufnahme ausgeschlossen wurde.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: weil der Regen eingesetzt hatte
  rationale: Das Perfektpartizip beschreibt Regen, der eingetreten war und anhielt. „Eingesetzt hatte“ gibt diesen resultativen und fortdauernden Sinn idiomatisch wieder.
- source_word: διὰ τὸ ψῦχος
  choice: weil es kalt war
  rationale: Die verbale Formulierung ist natürliches modernes Deutsch und gibt den Grundwert „wegen der Kälte“ unverändert wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Begründung des griechischen διὰ ... καὶ διὰ bleibt durch „weil ... und weil ...“ hörbar; γάρ wird mit „nämlich“ wiedergegeben.
