source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: de
  text: Wir halten es jedoch für angemessen, von dir zu hören, was du denkst. Was diese Gruppierung betrifft, ist uns bekannt, dass ihr überall widersprochen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: wir halten es für angemessen
  rationale: Gibt das höflich-formelle Urteil über die Angemessenheit des Gesprächs wieder, ohne einen Anspruch oder eine Forderung auszudrücken.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: von dir selbst zu hören
  rationale: Bewahrt die Nuance, dass die Sprecher Paulus unmittelbar und nicht nur Berichte über ihn hören wollen.
- source_word: ἃ φρονεῖς
  choice: was du denkst
  rationale: Natürliches modernes Deutsch für die Ansichten beziehungsweise Auffassung des Paulus.
- source_word: αἱρέσεως
  choice: Glaubensrichtung
  rationale: Bezeichnet hier eine religiöse Gruppierung oder Strömung, ohne den späteren technischen Sinn von »Häresie« einzutragen.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: ist uns bekannt
  rationale: Erhält die unpersönliche, formelle Ausdrucksweise des griechischen Textes.
- source_word: πανταχοῦ
  choice: überall
  rationale: Gibt die umfassende Ortsangabe knapp und idiomatisch wieder.
- source_word: ἀντιλέγεται
  choice: ihr wird widersprochen
  rationale: Bewahrt den passiven und ausdrücklich sprachlichen Charakter des Verbs besser als das allgemeinere »sie wird abgelehnt«.
theological_decisions:
- issue: Wiedergabe von αἵρεσις
  choice: Glaubensrichtung
  alternative: Sekte; Partei; Bewegung; Irrlehre
  rationale: Im Kontext bezeichnet das Wort die von Außenstehenden wahrgenommene christliche Gruppierung, nicht zwingend eine lehrmäßige Abweichung im späteren kirchengeschichtlichen Sinn. »Glaubensrichtung« ist im modernen Deutsch verständlich und vermeidet die stark abwertenden Nebenbedeutungen von »Sekte« sowie den anachronistischen Sinn von »Irrlehre«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelle Höflichkeit der Sprecher bleibt erhalten; die etwas markierte Passivform »ihr wird widersprochen« bildet die sprachliche Opposition des Originals bewusst ab.
