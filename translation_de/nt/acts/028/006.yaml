source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: de
  text: Sie erwarteten, dass er anschwellen oder plötzlich tot umfallen würde. Doch nachdem sie lange gewartet und beobachtet hatten, dass ihm nichts Ungewöhnliches widerfuhr[a], änderten sie ihre Meinung und sagten, er sei ein Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ihm nichts Außergewöhnliches“ oder „dass ihm nichts zustieß, was nicht in Ordnung war“ widerfuhr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: sie erwarteten
  rationale: Der Imperfekt bezeichnet ihre anhaltende Erwartung; die deutsche Formulierung ist natürlich und bewahrt diesen durativen Sinn.
- source_word: μέλλειν
  choice: würde
  rationale: In Verbindung mit den Infinitiven bezeichnet μέλλω das erwartete, unmittelbar bevorstehende Geschehen; der deutsche Konjunktiv in der indirekten Erwartung gibt dies flüssig wieder.
- source_word: πίμπρασθαι
  choice: anschwellen
  rationale: Im Zusammenhang mit dem Schlangenbiss bezeichnet das Verb am ehesten eine körperliche Schwellung, nicht ein wörtliches Brennen.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: plötzlich tot umfallen
  rationale: Die Wendung schildert einen unvermittelten Zusammenbruch mit dem Tod als Ergebnis; die deutsche Wortfolge gibt Bewegung, Ergebnis und Plötzlichkeit klar wieder.
- source_word: ἐπὶ πολὺ
  choice: nachdem sie lange gewartet hatten
  rationale: Die idiomatische Wendung bezeichnet eine längere Zeitspanne und lässt sich mit den Genitivpartizipien natürlich als Temporalsatz wiedergeben.
- source_word: θεωρούντων
  choice: beobachtet hatten
  rationale: Das Verb bezeichnet aufmerksames Zuschauen; „beobachten“ bewahrt diesen Aspekt deutlicher als das bloße „sehen“.
- source_word: μηδὲν ἄτοπον
  choice: nichts Ungewöhnliches
  rationale: ἄτοπος kann etwas Seltsames, Außergewöhnliches oder Ungehöriges bezeichnen. Hier bleibt „nichts Ungewöhnliches“ bewusst breit und legt nicht ausdrücklich „nichts Schädliches“ fest.
- source_word: εἰς αὐτὸν γινόμενον
  choice: ihm … widerfuhr
  rationale: Die idiomatische deutsche Wendung beschreibt prägnant, dass an ihm keine ungewöhnliche Folge eintrat.
- source_word: μεταβαλόμενοι
  choice: änderten sie ihre Meinung
  rationale: Das mediale Partizip bezeichnet hier einen Wechsel ihrer Einschätzung oder Schlussfolgerung.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der Imperfekt kann fortgesetztes oder einsetzendes Reden anzeigen. Im Deutschen lässt „sagten“ den Aspekt offen, ohne den Beginn mit „fingen an“ stärker festzulegen.
- source_word: θεόν
  choice: ein Gott
  rationale: Das artikellose θεόν ist im polytheistischen Umfeld der Inselbewohner am besten indefinit wiedergegeben; es bezeichnet ihre irrige Einordnung des Paulus als einen Gott.
theological_decisions:
- issue: Wiedergabe von αὐτὸν εἶναι θεόν ohne eine spätere christologische oder paulinische Aussage in den Bericht einzutragen
  choice: er sei ein Gott
  alternative: er sei Gott; er sei göttlich
  rationale: Der Text berichtet die irrige Schlussfolgerung der heidnischen Inselbewohner. Der Kontext und das artikellose θεόν sprechen für die indefinite Wiedergabe „ein Gott“, ohne Paulus mit dem einen Gott gleichzusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Partizipialkonstruktion wurde natürlich als Temporalsatz entfaltet; die indirekte Rede steht im Konjunktiv I.
