- from: Und von dort kamen uns die Brüder und Schwestern[a], nachdem sie von uns gehört hatten, bis zum Forum des Appius und zu den Drei Tavernen entgegen. Als Paulus sie sah, dankte er Gott und fasste Mut.
  to: Und von dort kamen uns die Brüder[a], nachdem sie von uns gehört hatten, bis zum Forum des Appius und zu den Drei Tavernen entgegen. Als Paulus sie sah, dankte er Gott und fasste Mut.
  rationale: Die einzige notwendige Änderung betrifft die Wiedergabe von οἱ ἀδελφοί. „Die Brüder“ bewahrt die Form des griechischen Textes und die in der englischen Auditspur gewählte Zurückhaltung; die Fußnote erhält die mögliche inklusive Bedeutung, ohne sie als eindeutige Aussage des Haupttextes festzulegen. Alle übrigen Formulierungen können unverändert bleiben.
