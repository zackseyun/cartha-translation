source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: de
  text: Und von dort kamen uns die Brüder[a], nachdem sie von uns gehört hatten, bis zum Forum des Appius und zu den Drei Tavernen entgegen. Als Paulus sie sah, dankte er Gott und fasste Mut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die Brüder. Das griechische Wort kann in diesem Zusammenhang die Glaubensgeschwister insgesamt, also auch Frauen, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Und von dort
  rationale: Gibt καί + ἐκεῖθεν als natürliche räumliche Fortführung des Reiseberichts wieder.
- source_word: οἱ ἀδελφοὶ
  choice: die Brüder und Schwestern[a]
  rationale: Bezeichnet hier die christlichen Glaubensgeschwister; im Deutschen macht die inklusive Wiedergabe den wahrscheinlichen Bezug auf die örtliche Gemeinde verständlich, während die Fußnote die maskuline griechische Form offenlegt.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: nachdem sie von uns gehört hatten
  rationale: Bewahrt die zeitliche Funktion des Partizips und gibt τὰ περὶ ἡμῶν idiomatisch wieder, ohne ausdrücklich »Nachricht« hinzuzufügen.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: kamen uns … entgegen
  rationale: Natürliche deutsche Entsprechung der Wendung für das Entgegengehen, um Ankommende zu begrüßen.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: bis zum Forum des Appius und zu den Drei Tavernen
  rationale: »Bis« wahrt die durch ἄχρι bezeichnete räumliche Ausdehnung; die Ortsnamen werden in etablierten deutschen Formen wiedergegeben.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: Als Paulus sie sah
  rationale: Löst Relativpronomen und Partizip als natürliche temporale Satzkonstruktion auf; »sie« verweist auf die zuvor genannten Glaubensgeschwister.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: dankte er Gott
  rationale: Gibt den vorausgehenden Partizipialvorgang knapp und würdig als finites Verb wieder.
- source_word: ἔλαβε θάρσος
  choice: fasste Mut
  rationale: Ist die idiomatische deutsche Entsprechung von wörtlich »nahm/empfing Mut« und bewahrt Paulus als handelndes Subjekt.
theological_decisions:
- issue: Inklusive Bedeutung von ἀδελφοί
  choice: Brüder und Schwestern mit Fußnote zur griechischen Form
  alternative: Brüder; Glaubensgeschwister
  rationale: Der Ausdruck kann im gemeindlichen Zusammenhang Männer und Frauen einschließen. Die Hauptfassung macht diesen kommunalen Bezug in heutigem Deutsch deutlich; die Fußnote bewahrt Transparenz über den Wortlaut und seine mögliche engere Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am griechischen Reisebericht; geläufige Wendungen wie »entgegenkommen«, »Gott danken« und »Mut fassen« sorgen für natürliche Verständlichkeit.
