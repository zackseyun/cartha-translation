  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: de
  text: 'indem er sagte: »Geh zu diesem Volk und sag: Ihr werdet zwar hören, aber keinesfalls verstehen; und ihr werdet zwar sehen, aber keinesfalls erkennen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Hören werdet ihr hören und keinesfalls verstehen; und sehend werdet ihr sehen und keinesfalls sehen.« Die Wiederholungen sind nachdrückliche, hebräisch geprägte Ausdrucksweisen im griechischen Jesajazitat. Das letzte »sehen« kann hier auch inneres Erkennen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: indem er sagte
  rationale: Das Präsenspartizip knüpft das Zitat an den vorausgehenden Satz an; die finite deutsche Wendung ist natürlich und bewahrt diese Verknüpfung.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: Geh zu diesem Volk
  rationale: Die schlichte Imperativform gibt den idiomatischen Bewegungsbefehl wieder; »dieses Volk« erhält den kollektiven prophetischen Bezug.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Mit den Ohren werdet ihr hören
  rationale: Die Wendung bildet die Verbindung von Hören und Nichtverstehen verständlich ab und lässt zugleich den semitisch geprägten Nachdruck des griechischen Zitats anklingen.
- source_word: οὐ μὴ συνῆτε
  choice: doch keinesfalls verstehen
  rationale: »Keinesfalls« gibt die nachdrückliche Verneinung οὐ μή wieder; »verstehen« entspricht dem inneren Erfassen von συνίημι.
- source_word: βλέποντες βλέψετε
  choice: mit offenen Augen werdet ihr sehen
  rationale: Die Formulierung wahrt den emphatischen Nachdruck und bezeichnet tatsächliches Sehen, ohne im Deutschen eine schwer verständliche bloße Wortwiederholung zu erzwingen.
- source_word: οὐ μὴ ἴδητε
  choice: doch keinesfalls erkennen
  rationale: »Erkennen« bringt im Kontext die gegenüber dem äußeren Sehen fehlende innere Wahrnehmung zum Ausdruck; die mögliche wörtliche Wiedergabe mit »sehen« bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Das Jesajazitat stellt äußeres Hören und Sehen dem inneren Begreifen gegenüber.
  choice: Die Schlussverben werden mit »verstehen« und »erkennen« wiedergegeben.
  alternative: Im letzten Glied »sehen« verwenden und damit die griechische Wiederholung enger abbilden.
  rationale: Die Übersetzung bewahrt die Spannung zwischen sinnlicher Wahrnehmung und ausbleibender Einsicht, ohne die prophetische Aussage konfessionell auszudeuten; die lexikalische Mehrdeutigkeit des letzten Verbs wird angemerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Parallelstruktur und die starke Verneinung bleiben erkennbar, während unnatürliche deutsche Wortwiederholungen im Haupttext vermieden und in der Fußnote dokumentiert werden.
