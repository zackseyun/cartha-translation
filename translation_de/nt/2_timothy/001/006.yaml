  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: de
  text: Aus diesem Grund erinnere ich dich daran, die Gabe Gottes, die durch das Auflegen meiner Hände in dir ist, neu zu entfachen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wieder anzufachen“. Das griechische Verb greift das Bild eines Feuers auf, das erneut zu voller Flamme gebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Aus diesem Grund
  rationale: Die geläufige deutsche Wendung bewahrt den rückbezüglichen, begründenden Zusammenhang des griechischen Ausdrucks.
- source_word: ἀναμιμνῄσκω
  choice: ich erinnere dich daran
  rationale: Gibt das Präsens mit dem persönlichen Objekt und dem anschließenden Infinitiv idiomatisch und genau wieder.
- source_word: σε ἀναζωπυρεῖν
  choice: die Gabe … neu zu entfachen
  rationale: Das Verb bezeichnet das erneute Anfachen beziehungsweise Auflodern eines Feuers. „Neu entfachen“ erhält das Bild in natürlichem modernem Deutsch.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: die Gabe Gottes
  rationale: „Gabe“ gibt χάρισμα klar wieder, ohne die Art der Gabe über den Text hinaus als besondere Kategorie festzulegen.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: die … in dir ist
  rationale: Bewahrt die Aussage, dass die Gabe gegenwärtig in Timotheus ist, in einer natürlichen deutschen Relativkonstruktion.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: durch das Auflegen meiner Hände
  rationale: „Durch“ gibt διά mit Genitiv als Mittel oder Vermittlung wieder; „Auflegen der Hände“ bezeichnet den im Text genannten rituellen Vorgang.
theological_decisions:
- issue: Verhältnis der Gabe zum Handauflegen des Paulus
  choice: die durch das Auflegen meiner Hände in dir ist
  alternative: die in dir ist durch das Auflegen meiner Hände
  rationale: Die Formulierung erhält die instrumentale Aussage des griechischen Textes, ohne eine weiter ausgearbeitete sakramentale Lehre hineinzulesen. Zugleich vermeidet die Wortstellung im Deutschen den möglichen Eindruck, „durch das Auflegen“ beziehe sich auf das bloße Sein statt auf die Vermittlung der Gabe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Feuer-Metapher bleibt erhalten; die theologische Spannung der Vermittlung „durch“ das Handauflegen wird nicht aufgelöst.
