lexical_decisions:
- source_word: ἀλλὰ
  choice: sondern
  rationale: Der Gegensatz korrigiert das im vorausgehenden Zusammenhang beschriebene beschämte Abwenden anderer; nach einer vorausgehenden Verneinung ist „sondern“ im Deutschen idiomatisch.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: als er in Rom war
  rationale: Die zeitlich verstandene Aoristpartizipialkonstruktion bezeichnet hier seinen Aufenthalt in Rom. Diese Wiedergabe bleibt näher an der offenen Formulierung als eine ausdrückliche Festlegung auf seine Ankunft.
- source_word: σπουδαίως
  choice: eifrig
  rationale: Das Adverb bezeichnet ernsthaften, nachdrücklichen Einsatz; „eifrig“ ist in Verbindung mit einer Suche natürlich und prägnant.
- source_word: ἐζήτησέν με
  choice: suchte er nach mir
  rationale: ζητέω bezeichnet hier die zielgerichtete Suche nach einer Person.
- source_word: καὶ εὗρεν
  choice: und fand mich
  rationale: Das im zweiten Verb nicht wiederholte Objekt wird im Deutschen zur Klarheit ergänzt.
