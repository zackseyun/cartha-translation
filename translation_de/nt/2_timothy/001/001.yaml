id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: de
  text: Paulus, durch Gottes Willen Apostel des Messias Jesus[a], gemäß der Verheißung des Lebens, das im Messias Jesus ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus Jesus“; ebenso beim zweiten Vorkommen von „Messias Jesus“ in diesem Vers.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Die im Deutschen herkömmliche und natürliche Form des Personennamens.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: In der paulinischen Selbstbezeichnung ist der etablierte Amtstitel gemeint; allgemeinere Wiedergaben wie „Bote“ oder „Gesandter“ würden diesen Sprachgebrauch einebnen.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  rationale: Χριστός wird hier als Titel verstanden und daher mit „Messias“ übersetzt. Die Stellung vor „Jesus“ folgt der griechischen Wortfolge und bewahrt den Titelcharakter.
- source_word: διὰ θελήματος θεοῦ
  choice: durch Gottes Willen
  rationale: διά mit dem Genitiv bezeichnet hier die göttliche Veranlassung beziehungsweise Bevollmächtigung. Die Formulierung ist im Deutschen knapp und idiomatisch.
- source_word: κατ’ ἐπαγγελίαν
  choice: gemäß der Verheißung
  rationale: κατά mit dem Akkusativ drückt hier Übereinstimmung oder Entsprechung aus. „Gemäß“ erhält den Bezug der apostolischen Berufung auf Gottes Verheißung, ohne ihn enger auszudeuten.
- source_word: ζωῆς
  choice: des Lebens
  rationale: Der Genitiv hängt von „Verheißung“ ab. Der bestimmte Ausdruck wird durch den folgenden Attributsatz näher bezeichnet.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: das im Messias Jesus ist
  rationale: Der Artikel mit der Präpositionalgruppe bestimmt das Leben näher. Die Wiedergabe bewahrt die relationale und theologisch offene Bedeutung von ἐν.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Die Übersetzung „Messias“ macht den Titelgehalt von Χριστός sichtbar. Das im Deutschen kirchlich geläufigere „Christus“ bleibt als vertretbare Alternative in der Fußnote erhalten.
- issue: Bezug von κατ’ ἐπαγγελίαν ζωῆς
  choice: „gemäß der Verheißung des Lebens“ bleibt syntaktisch auf die apostolische Selbstbezeichnung bezogen
  alternative: Deutende Wiedergaben wie „beauftragt, das verheißene Leben zu verkünden“
  rationale: Der griechische Ausdruck lässt die genaue Art des Bezugs offen. Eine explizite Ergänzung wie „zu verkünden“ würde eine plausible Deutung in den Haupttext eintragen, die dort nicht ausdrücklich steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform einer antiken Briefüberschrift und das abschließende Komma werden beibehalten, da der Satz im folgenden Vers weitergeführt wird.
