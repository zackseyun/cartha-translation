id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: de
  text: Schäme dich also nicht für das Zeugnis über unseren Herrn[a] und auch nicht für mich, seinen Gefangenen. Leide vielmehr für das Evangelium mit[b], entsprechend der Kraft Gottes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das Zeugnis unseres Herrn“. Der griechische Genitiv kann auch das Zeugnis bezeichnen, das vom Herrn ausgeht.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Nimm teil am Leiden für das Evangelium.“ Das griechische Verb drückt aus, gemeinsam mit anderen Schweres zu erleiden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „durch die Kraft Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν ἐπαισχυνθῇς
  choice: Schäme dich also nicht
  rationale: οὖν stellt die Folgerung aus dem vorherigen Zusammenhang her; die Verneinung mit dem Aorist-Konjunktiv wird als natürliche deutsche Aufforderung wiedergegeben.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: das Zeugnis über unseren Herrn
  rationale: „Zeugnis“ bewahrt die Substantivform. Der Genitiv wird im Kontext wahrscheinlich objektiv verstanden, bleibt aber in einer Fußnote als echte Alternative dokumentiert.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: und auch nicht für mich, seinen Gefangenen
  rationale: Die Ergänzung „für“ ist im Deutschen nach „sich schämen“ idiomatisch. „Seinen Gefangenen“ bewahrt die Zuordnung zu dem Herrn, ohne deren genaue Art enger festzulegen.
- source_word: συγκακοπάθησον
  choice: Leide vielmehr mit
  rationale: Die Wiedergabe bewahrt sowohl das Erleiden von Schwerem als auch den durch συν- bezeichneten Gedanken gemeinsamer Teilhabe.
- source_word: τῷ εὐαγγελίῳ
  choice: für das Evangelium
  rationale: Der griechische Dativ ist gedrängt. Im Deutschen bezeichnet „für das Evangelium“ natürlich den Anlass beziehungsweise die Sache, um derentwillen gelitten wird; die gemeinschaftliche Bedeutung liegt bereits in „leide mit“.
- source_word: κατὰ δύναμιν θεοῦ
  choice: entsprechend der Kraft Gottes
  rationale: 'Die Formulierung wahrt den Spielraum von κατά: Maßstab, Maß oder Übereinstimmung, ohne vorschnell ausschließlich ein Mittel auszudrücken.'
theological_decisions:
- issue: Beziehung des Zeugnisses zu „unserem Herrn“
  choice: Zeugnis über unseren Herrn
  alternative: Zeugnis unseres Herrn
  rationale: Der Kontext spricht wahrscheinlich vom christlichen Zeugnis, dessen Inhalt der Herr ist. Da der griechische Genitiv auch das vom Herrn ausgehende Zeugnis bezeichnen kann, wird diese Möglichkeit in der Fußnote erhalten.
- issue: Bedeutung von „seinen Gefangenen“
  choice: Die possessive Beziehung zum Herrn bleibt stehen.
  alternative: seinen Gefangenen = den um seinetwillen Gefangenen
  rationale: Die Formulierung wahrt die im Genitiv ausgedrückte Zugehörigkeit beziehungsweise Verbindung, ohne sie allein kausal zu erklären.
- issue: Beziehung des Leidens zum Evangelium
  choice: mit leiden für das Evangelium
  alternative: mit dem Evangelium leiden / am Leiden für das Evangelium teilnehmen
  rationale: Das Deutsche trennt die gemeinsame Teilhabe („mit leiden“) idiomatisch von der Sache, für die gelitten wird („für das Evangelium“), ohne einen bestimmten Mit-Leidenden ausdrücklich einzusetzen.
- issue: Funktion der Kraft Gottes
  choice: entsprechend der Kraft Gottes
  alternative: durch die Kraft Gottes
  rationale: Die Übersetzung erhält die mögliche Bedeutung von Kraft als Maßstab oder Maß und legt sie nicht ausschließlich als bewirkendes Mittel aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leide mit“ ist bewusst knapp und erhält den Gemeinschaftsaspekt des griechischen Verbs; „entsprechend der Kraft Gottes“ wahrt die semantische Offenheit von κατά.
