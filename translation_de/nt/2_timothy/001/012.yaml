id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: de
  text: Aus diesem Grund erleide auch ich all das. Doch ich schäme mich nicht; denn ich weiß, wem ich vertraut habe[a], und bin überzeugt, dass er imstande ist, mein anvertrautes Gut[b] bis zu jenem Tag[c] zu bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wem ich geglaubt habe“; sinngemäß: „auf wen ich mein Vertrauen gesetzt habe“.'
    reason: lexical_alternative
  - marker: b
    text: Der Ausdruck bezeichnet etwas, das jemand einem anderen zur sicheren Verwahrung übergibt. Gemeint sein kann entweder das, was Paulus Gott anvertraut hat, oder das, was Paulus selbst anvertraut worden ist.
    reason: alternative_reading
  - marker: c
    text: Gemeint ist der künftige Tag des endgültigen Gerichts und der Rechtfertigung durch Gott.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Aus diesem Grund
  rationale: Gibt die kausale Rückbindung idiomatisch und zugleich eng am griechischen Ausdruck wieder.
- source_word: καὶ ταῦτα πάσχω
  choice: erleide auch ich all das
  rationale: „Erleiden“ gibt πάσχω prägnant wieder; „all das“ ist im Deutschen eine natürliche kollektive Wiedergabe des pluralischen Demonstrativpronomens ταῦτα, ohne die Leiden näher zu bestimmen.
- source_word: οὐκ ἐπαισχύνομαι
  choice: ich schäme mich nicht
  rationale: Entspricht dem üblichen reflexiven deutschen Ausdruck und bezeichnet hier Paulus’ Haltung angesichts seines Leidens.
- source_word: οἶδα
  choice: ich weiß
  rationale: Das formal perfektische οἶδα hat präsentische, stative Bedeutung.
- source_word: ᾧ πεπίστευκα
  choice: wem ich vertraut habe
  rationale: „Vertrauen“ gibt den persönlichen Bezug des Dativs mit πιστεύω im heutigen Deutsch natürlicher wieder als „jemandem glauben“. Die Perfektform bewahrt den Gedanken eines vollzogenen und fortwirkenden Vertrauens.
- source_word: πέπεισμαι
  choice: bin überzeugt
  rationale: Die Perfekt-Passivform bezeichnet eine gefestigte, fortbestehende Überzeugung.
- source_word: δυνατός ἐστιν
  choice: er imstande ist
  rationale: Gibt Fähigkeit und Wirksamkeit würdig und idiomatisch wieder, ohne den unausgesprochenen Bezug ausdrücklich als Gott oder Christus zu identifizieren.
- source_word: τὴν παραθήκην μου
  choice: mein anvertrautes Gut
  rationale: Bewahrt das Bild eines zur sicheren Verwahrung übergebenen Gutes und lässt zusammen mit der Fußnote offen, ob es Paulus anvertraut wurde oder ob Paulus es einem anderen anvertraut hat.
- source_word: φυλάξαι
  choice: zu bewahren
  rationale: Passt zum Bild des anvertrauten Gutes und umfasst schützen, sicher verwahren und erhalten.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: bis zu jenem Tag
  rationale: Gibt die zeitlich nach vorn gerichtete Aussage wieder; die Kleinschreibung vermeidet eine typografische Vorentscheidung.
theological_decisions:
- issue: Bezug von ᾧ und unausgesprochenes Subjekt von δυνατός ἐστιν
  choice: Der persönliche Bezug bleibt mit „wem“ und „er“ unausgesprochen.
  alternative: Den Bezug ausdrücklich als Gott oder Christus Jesus benennen.
  rationale: Der griechische Satz nennt den Bezug nicht ausdrücklich. Der Kontext legt Gott beziehungsweise Christus nahe, doch die Übersetzung bewahrt den Grad an Bestimmtheit des Ausgangstextes.
- issue: Bedeutungsrichtung von παραθήκη μου
  choice: „mein anvertrautes Gut“ bewahrt die Mehrdeutigkeit im Haupttext.
  alternative: Entweder das Paulus anvertraute Evangelium beziehungsweise sein Dienst oder das von Paulus Gott anvertraute Leben beziehungsweise Heil ausdrücklich nennen.
  rationale: Die Genitivverbindung legt nicht eindeutig fest, wer wem das Gut anvertraut hat. Eine eindeutige Ausformulierung würde eine umstrittene Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Kurze, klare Satzglieder tragen den argumentativen Nachdruck. „Anvertrautes Gut“ bewahrt bewusst das antike Verwahrungsbild und seine inhaltliche Offenheit.
