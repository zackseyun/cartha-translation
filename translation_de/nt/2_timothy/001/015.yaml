source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: de
  text: 'Du weißt: Alle, die in der Provinz Asia[a] sind, haben sich von mir abgewandt[b], darunter Phygelus und Hermogenes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Asia“ bezeichnet hier die römische Provinz im Westen Kleinasiens, nicht den heutigen Kontinent Asien.
    reason: cultural_note
  - marker: b
    text: 'Oder: „haben mich verlassen“ / „haben mich im Stich gelassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας τοῦτο ὅτι
  choice: 'Du weißt:'
  rationale: Οἶδας bezeichnet gegenwärtiges Wissen; τοῦτο und der folgende ὅτι-Satz werden im natürlichen Deutschen knapp durch einen Doppelpunkt wiedergegeben.
- source_word: ἀπεστράφησάν με
  choice: haben sich von mir abgewandt
  rationale: Die Formulierung bewahrt das griechische Bild des Sich-Abwendens und lässt offen, ob vor allem persönliche Distanzierung, fehlende Unterstützung oder Verlassen gemeint ist.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: Alle in der Provinz Asia
  rationale: „Alle“ erhält die umfassende Aussage des πάντες, ohne ihren kontextuell relevanten Personenkreis ausdrücklich einzuengen. „Provinz Asia“ verhindert eine Verwechslung mit dem modernen Kontinent.
- source_word: ὧν ἐστιν
  choice: darunter
  rationale: Das idiomatische „darunter“ kennzeichnet die beiden Genannten als Angehörige beziehungsweise Beispiele der zuvor genannten Gruppe.
- source_word: Φύγελος καὶ Ἑρμογένης
  choice: Phygelus und Hermogenes
  rationale: Die Personennamen werden in ihren etablierten deutschen Formen wiedergegeben.
theological_decisions:
- issue: Reichweite von „alle in der Provinz Asia“
  choice: Die uneingeschränkte Formulierung „alle“ bleibt im Haupttext erhalten, wobei der Zusammenhang den gemeinten Personenkreis bestimmt.
  alternative: Ausdrückliche Eingrenzung auf alle Mitarbeiter, Unterstützer oder Christen in Asia; oder Deutung als bloße Übertreibung.
  rationale: Das griechische πάντες klingt umfassend, kann aber kontextuell begrenzt sein. Eine nähere Bestimmung im Haupttext würde eine im Ausgangstext nicht ausdrücklich genannte Gruppe festlegen.
- issue: Art des Abwendens
  choice: „haben sich von mir abgewandt“
  alternative: „haben mich verlassen“ oder „haben mich im Stich gelassen“
  rationale: Die bildnahe Wiedergabe wahrt die Spannung zwischen relationaler Abkehr und konkreter Verweigerung von Beistand, ohne den Vorgang stärker auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Briefstil. Der Doppelpunkt macht die Inhaltsbeziehung knapp sichtbar. Die Bezeichnung „Provinz Asia“ ist historisch präzise; die Fußnote erläutert sie. Die Marker [a] und [b] stehen unmittelbar bei den jeweils erklärten Ausdrücken.
