lexical_decisions:
- source_word: ἐπιποθῶν
  choice: Ich sehne mich danach
  rationale: Das Präsenspartizip bezeichnet ein starkes, anhaltendes persönliches Verlangen. Die Formulierung ist im modernen Deutsch natürlich und bewahrt die emotionale Intensität.
- source_word: σε ἰδεῖν
  choice: dich zu sehen
  rationale: Der Infinitiv bezeichnet, worauf sich die Sehnsucht richtet. „Dich zu sehen“ ist direkt und idiomatisch.
- source_word: μεμνημένος
  choice: und erinnere mich
  rationale: Das Perfektpartizip bezeichnet einen fortdauernden Zustand des Erinnerns. Im Deutschen verbindet die finite Wendung den Gedanken natürlich mit dem vorangehenden Satzteil.
- source_word: σου τῶν δακρύων
  choice: an deine Tränen
  rationale: Der Genitiv bezieht die Tränen unmittelbar auf Timotheus. „Deine Tränen“ bleibt konkret und vermeidet die interpretativere Wiedergabe „dein Weinen“.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Zielbeziehung der Klausel knapp und natürlich wieder.
- source_word: χαρᾶς
  choice: mit Freude
  rationale: Der Genitiv bei πληρόω wird im Deutschen idiomatisch als „mit Freude erfüllt“ wiedergegeben.
- source_word: πληρωθῶ
  choice: ich erfüllt werde
  rationale: Die passive Konjunktivform wird in der deutschen Zwecksatzkonstruktion angemessen mit „damit ich ... erfüllt werde“ wiedergegeben.
