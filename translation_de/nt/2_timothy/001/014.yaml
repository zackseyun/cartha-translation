id: 2TI.1.14
reference: 2 Timothy 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: de
  text: Bewahre das gute anvertraute Gut durch den Heiligen Geist, der in uns wohnt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das edle anvertraute Gut“; sinngemäß auch: „was dir anvertraut worden ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mithilfe des Heiligen Geistes, der in uns lebt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: das gute anvertraute Gut
  rationale: παραθήκη bezeichnet etwas, das zur sicheren Verwahrung anvertraut wurde. „Anvertrautes Gut“ bewahrt das Bild eines wertvollen Treuguts und klingt im Deutschen natürlicher als „Depositum“. καλὴν wird schlicht mit „gut“ wiedergegeben, ohne die mögliche Nuance unnötig auf „edel“ oder „kostbar“ festzulegen.
- source_word: φύλαξον
  choice: Bewahre
  rationale: Der Aorist-Imperativ fordert zu entschlossenem, aktivem Schützen auf. „Bewahre“ passt idiomatisch zu einem anvertrauten Gut und umfasst sowohl Hüten als auch Schützen.
- source_word: διὰ πνεύματος ἁγίου
  choice: durch den Heiligen Geist
  rationale: διά mit Genitiv bezeichnet hier Mittel oder Wirksamkeit. „Durch“ erhält diese instrumentale Bedeutung, ohne die Eigenwirksamkeit Timotheus’ oder die des Geistes einseitig aufzulösen.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: der in uns wohnt
  rationale: Das Präsenspartizip bezeichnet die fortdauernde Gegenwart des Geistes. „In uns wohnt“ ist verständlich, würdig und vermeidet technischen theologischen Jargon.
theological_decisions:
- issue: Bezug des „guten anvertrauten Gutes“
  choice: Die Formulierung bleibt allgemein und metaphorisch; sie wird weder ausdrücklich mit dem Evangelium noch mit dem Dienstauftrag gleichgesetzt.
  alternative: „die dir anvertraute Botschaft“ oder „deinen anvertrauten Dienstauftrag“
  rationale: Der Zusammenhang legt das apostolische Evangelium als Bezug nahe, doch der griechische Ausdruck benennt den Inhalt nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
- issue: Verhältnis zwischen Timotheus’ Bewahren und dem Wirken des Heiligen Geistes
  choice: „durch den Heiligen Geist“ bewahrt die instrumentale Formulierung des griechischen Textes.
  alternative: „mit der Hilfe des Heiligen Geistes“ oder „vom Heiligen Geist“
  rationale: Die erste Alternative schwächt die Aussage möglicherweise zu bloßer Unterstützung ab, die zweite könnte den Imperativ an Timotheus verdunkeln. Die Hauptfassung hält beides zusammen.
- issue: Umfang von „uns“
  choice: Das Pronomen bleibt als „uns“ stehen, ohne es auf Paulus und Timotheus oder auf alle Glaubenden einzugrenzen.
  alternative: „in uns Glaubenden“ oder „in dir und mir“
  rationale: ἡμῖν lässt den konkreten und den weiteren gemeinschaftlichen Bezug offen. Eine erklärende Eingrenzung würde mehr sagen als der Ausgangstext.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. „Anvertrautes Gut“ erhält die Treuhandmetapher, während „Bewahre“ den aktiven Schutzauftrag natürlich ausdrückt. Sämtliche Fußnotenmarker stehen im Haupttext.
