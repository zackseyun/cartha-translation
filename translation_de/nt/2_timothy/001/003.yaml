source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: de
  text: Ich danke Gott, dem ich – wie schon meine Vorfahren – mit reinem Gewissen diene[a][b]; denn ich denke in meinen Gebeten unablässig an dich, Nacht und Tag[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verehre“ oder „heiligen Dienst leiste“. Das griechische Verb kann den religiösen Dienst oder die Verehrung bezeichnen, die Gott gilt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „von den Vorfahren her“. Die Wendung kann die Kontinuität mit dem überlieferten Glauben und Gottesdienst der Vorfahren ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „das Gedenken an dich in meinen Gebeten habe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Ich danke Gott
  rationale: Die griechische Wendung χάριν ἔχω mit Dativ bezeichnet Dank gegenüber jemandem. „Ich danke Gott“ ist im Deutschen idiomatisch und bewahrt den unmittelbaren Sinn.
- source_word: ᾧ λατρεύω
  choice: dem ich … diene
  rationale: λατρεύω bezeichnet den religiösen Dienst beziehungsweise die Verehrung, die Gott gilt. „dienen“ hält die Bedeutung weiter als das enger klingende „anbeten“.
- source_word: ἀπὸ προγόνων
  choice: wie schon meine Vorfahren
  rationale: Die Wiedergabe drückt die wahrscheinlich gemeinte Kontinuität mit dem Glauben und Gottesdienst der Vorfahren natürlich aus. Die wörtlichere, mehrdeutige Form wird in der Fußnote genannt.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: mit reinem Gewissen
  rationale: Die Präpositionalphrase beschreibt die Art des Dienens. „Mit reinem Gewissen“ ist klares, gegenwärtiges Standarddeutsch.
- source_word: ὡς
  choice: während
  rationale: ὡς verbindet den Dank mit dem fortwährenden Gedenken im Gebet. „während“ erhält den begleitenden Zusammenhang, ohne ihn ausdrücklich als Ursache auszulegen.
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: ich unablässig … an dich denke
  rationale: Die substantivische griechische Wendung wird als natürliche deutsche Verbalkonstruktion wiedergegeben; „unablässig“ bewahrt den nachdrücklichen Gedanken der Beständigkeit.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: in meinen Gebeten
  rationale: δέησις kann besonders eine Bitte oder ein Flehen bezeichnen. Im Kontext ist „Gebete“ natürlich und ausreichend weit.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Nacht und Tag
  rationale: Die geläufige deutsche Wendung entspricht der griechischen Reihenfolge und bezeichnet fortgesetzte Regelmäßigkeit.
theological_decisions:
- issue: Paulus’ Verhältnis zum Glauben seiner Vorfahren in ἀπὸ προγόνων
  choice: Der Gottesdienst des Paulus steht in Kontinuität mit dem seiner Vorfahren.
  alternative: „von meinen Vorfahren her“ oder „seit meinen Vorfahren“
  rationale: „Wie schon meine Vorfahren“ macht die naheliegende Kontinuität verständlich, ohne eine Abkehr vom Glauben Israels zu unterstellen. Die sprachliche Mehrdeutigkeit der Ausgangsform bleibt in der Fußnote sichtbar.
- issue: Bedeutungsumfang von λατρεύω
  choice: dienen
  alternative: verehren oder anbeten
  rationale: Das Verb kann sowohl heiligen Dienst als auch Gottesverehrung bezeichnen. „Dienen“ bewahrt hier den weiteren Bedeutungsumfang und legt den Ausdruck nicht ausschließlich auf kultische Anbetung fest.
- issue: Verknüpfung durch ὡς
  choice: während
  alternative: indem, wenn oder wie
  rationale: Die genaue logische Beziehung ist nicht völlig eindeutig. „Während“ stellt das fortwährende Gebetsgedenken als begleitenden Umstand des Dankens dar, ohne eine ausdrücklich kausale Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parenthese „wie schon meine Vorfahren“ macht den Satz trotz seiner dichten griechischen Struktur gut verständlich. „Unablässig“ und „Nacht und Tag“ erhalten den feierlichen Nachdruck, ohne altertümlich zu wirken.
