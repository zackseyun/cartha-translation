id: 2TI.1.13
reference: 2 Timothy 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: de
  text: Halte an dem Muster der gesunden Worte fest, die du von mir gehört hast – in dem Glauben und der Liebe, die im Messias Jesus sind.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Treue und Liebe“. Das griechische Wort für „Glaube“ kann auch „Treue“ oder „Vertrauen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Halte an dem Muster der gesunden Worte fest, die du von mir über den Glauben und die Liebe im Messias Jesus gehört hast.“ Die griechische Satzkonstruktion kann Glauben und Liebe entweder als die Art des Festhaltens oder als Inhalt der Worte verstehen lassen.'
    reason: alternative_reading
  - marker: c
    text: 'Traditionelle Wiedergabe: „Christus Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: Muster
  rationale: Das Substantiv bezeichnet eine vorgegebene Form, Skizze oder ein Modell, an dem man sich orientiert. „Muster“ bewahrt diese Bedeutung, ohne sie auf eine bloße Zusammenfassung oder ein abstraktes Lehrsystem zu verengen.
- source_word: ἔχε
  choice: Halte … fest
  rationale: Wörtlich bedeutet das Verb „habe“. Der Imperativ fordert hier dazu auf, das genannte Muster zu bewahren und daran festzuhalten; die gewählte Wendung gibt diese Kraft in natürlichem Deutsch wieder.
- source_word: ὑγιαινόντων λόγων
  choice: der gesunden Worte
  rationale: ὑγιαίνω verwendet das Bild des Gesundseins für zuverlässige, heilsame Lehre. „Gesunde Worte“ bewahrt sowohl dieses Bild als auch den Plural λόγων („Worte“) und ist weniger auslegend als „gesunde Lehre“.
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: die du von mir gehört hast
  rationale: παρά mit dem Genitiv bezeichnet hier die Quelle. Der Relativsatz bezieht sich grammatisch auf die „Worte“.
- source_word: ἐν πίστει
  choice: in dem Glauben
  rationale: πίστις wird primär mit „Glaube“ wiedergegeben. Die Präposition kann hier den Bereich oder die Art und Weise des Festhaltens bezeichnen. Die mögliche Bedeutung „Treue“ wird in einer Fußnote bewahrt.
- source_word: καὶ ἀγάπῃ
  choice: und der Liebe
  rationale: ἀγάπη wird sachgerecht und unmittelbar mit „Liebe“ übersetzt.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: die im Messias Jesus sind
  rationale: Der attributive Ausdruck bezieht sich dem Sinn nach gemeinsam auf Glaube und Liebe. Die knappe Formulierung bleibt nahe am Griechischen und vermeidet Zusätze wie „verwurzelt“, die das Verhältnis stärker auslegen würden.
- source_word: Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  rationale: Χριστός trägt hier weiterhin den Sinn des Titels „Messias“. Die traditionelle Wiedergabe „Christus Jesus“ wird als Alternative in der Fußnote genannt.
theological_decisions:
- issue: Bezug von ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ
  choice: Die Wortgruppe beschreibt den Bereich beziehungsweise die Art und Weise, in der Timotheus an dem Muster festhalten soll.
  alternative: 'Die Wortgruppe kann inhaltlich zu den gesunden Worten gezogen werden: Worte über den Glauben und die Liebe im Messias Jesus.'
  rationale: Die griechische Stellung lässt beide Bezüge zu. Der Aufforderungszusammenhang spricht eher für eine Beschreibung des Festhaltens; die andere syntaktisch mögliche Lesart wird jedoch ausdrücklich in einer Fußnote erhalten.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Treue oder Vertrauen
  rationale: „Glaube“ ist in diesem Zusammenhang die naheliegende Wiedergabe, doch das griechische Wort kann auch „Treue“ oder „Vertrauen“ bezeichnen. Diese Bedeutungsbreite soll nicht verschwiegen werden.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Da Χριστός als Titel verstanden werden kann, macht „Messias“ seine Bedeutung unmittelbar sichtbar. Die im Deutschen traditionelle, stärker namensähnliche Form „Christus“ bleibt in einer Fußnote zugänglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gesunde Worte“ ist bewusst bildhaft und leicht ungewohnt, weil es die Metapher des griechischen Textes erhält. Der Gedankenstrich macht den wahrscheinlich adverbialen Bezug von „in dem Glauben und der Liebe“ lesbar, ohne die alternative syntaktische Deutung auszuschließen.
