source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: de
  text: Weil ich an deinen ungeheuchelten Glauben erinnert worden bin, der zuerst in deiner Großmutter Lois und deiner Mutter Eunike wohnte, bin ich überzeugt, dass er auch in dir wohnt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Dabei erinnere ich mich
  rationale: Die Wendung bezeichnet das Empfangen bzw. Aufnehmen einer Erinnerung. Im Deutschen gibt die finite, idiomatische Form den Sinn natürlich wieder, ohne eine äußere Erinnerung ausdrücklich vorauszusetzen.
- source_word: ἀνυποκρίτου πίστεως
  choice: ungeheuchelten Glauben
  rationale: ἀνυπόκριτος bedeutet wörtlich ungeheuchelt, also frei von Verstellung; die traditionelle deutsche Formulierung ist präzise und verständlich.
- source_word: ἐνῴκησεν
  choice: wohnte
  rationale: Das Verb bedeutet innewohnen oder wohnen und zeichnet den Glauben als bleibend gegenwärtig, nicht bloß als gelegentliche Haltung.
- source_word: μάμμῃ
  choice: Großmutter
  rationale: Die familiäre Bezeichnung meint hier eindeutig die Großmutter; eine verniedlichende Wiedergabe wäre im heutigen deutschen Bibelregister unpassend.
- source_word: πέπεισμαι
  choice: ich bin überzeugt
  rationale: Das Perfekt bezeichnet eine gefestigte, fortbestehende Überzeugung.
theological_decisions:
- issue: Persönlicher Glaube über mehrere Generationen
  choice: 'Die Aussage bleibt bildhaft: Derselbe ungeheuchelte Glaube wohnte in Lois und Eunike und wohnt auch in Timotheus.'
  alternative: Eine vererbte oder automatisch übertragene Glaubenszugehörigkeit ausdrücklich formulieren.
  rationale: Der Text beschreibt die generationenübergreifende Gegenwart des Glaubens, erklärt aber nicht, auf welche Weise Timotheus dazu kam; diese Offenheit wird bewahrt.
- issue: Ergänzung des Verbs im letzten Satzteil
  choice: „wohnt“ wird zur natürlichen deutschen Satzvollständigkeit wiederholt.
  alternative: „dass er auch in dir ist“
  rationale: Im Griechischen ist das Verb im letzten Glied elliptisch mitzudenken. Die Wiederaufnahme von „wohnt“ bewahrt das Bild von ἐνῴκησεν.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namen folgen den im Deutschen üblichen Formen Lois und Eunike. Das Wohnbild des griechischen Verbs bleibt erhalten; unnötige erklärende Zusätze werden vermieden.
