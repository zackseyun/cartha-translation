  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: de
  text: der uns gerettet und mit einer heiligen Berufung berufen hat[a] – nicht nach unseren Werken, sondern nach seinem eigenen Vorsatz und seiner Gnade. Diese Gnade wurde uns im Messias Jesus[b] vor ewigen Zeiten[c] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zu einer heiligen Berufung“ oder „durch eine heilige Berufung“. Der griechische Dativ lässt mehrere Deutungen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Χριστός wird hier als Titel mit „Messias“ wiedergegeben; traditionell: „in Christus Jesus“.'
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „bevor die Zeiten begannen“ oder sinngemäßer: „bevor die Zeit begann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: gerettet hat
  rationale: Das Aoristpartizip von σῴζω wird mit dem im paulinischen Zusammenhang üblichen und theologisch gewichtigen Verb „retten“ wiedergegeben.
- source_word: καλέσαντος κλήσει ἁγίᾳ
  choice: mit einem heiligen Ruf berufen hat
  rationale: Die Verbindung wahrt das griechische Wortspiel zwischen καλέω und κλῆσις. „Mit“ lässt die genaue Funktion des Dativs eher offen als eine eindeutig instrumentale oder finale Wiedergabe.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: nicht nach unseren Werken
  rationale: „Nach“ bildet κατά als Maßstab oder Grundlage knapp ab; „Werke“ bleibt als paulinischer Schlüsselbegriff erhalten.
- source_word: ἰδίαν πρόθεσιν
  choice: seinem eigenen Vorsatz
  rationale: „Vorsatz“ bezeichnet eine festgesetzte Absicht und entspricht dem theologischen Gebrauch von πρόθεσις, ohne den Gedanken zu einem detaillierten Plan auszuweiten.
- source_word: χάριν
  choice: Gnade
  rationale: „Gnade“ ist die etablierte und kontextuell angemessene Wiedergabe des paulinischen Begriffs χάρις.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: Diese Gnade wurde uns ... gegeben
  rationale: Das feminine Partizip bezieht sich grammatisch auf χάριν. Die Wiederaufnahme mit „Diese Gnade“ beseitigt im Deutschen eine mögliche unklare Zuordnung, ohne den Aussagegehalt zu erweitern.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός wird als bedeutungstragender Titel mit „Messias“ übersetzt; „im“ erhält zugleich die paulinische ἐν-Formulierung.
- source_word: πρὸ χρόνων αἰωνίων
  choice: vor ewigen Zeiten
  rationale: Die Wendung bildet die ungewöhnliche Verbindung von χρόνοι und αἰώνιος verständlich und relativ nah am Griechischen ab, ohne sie zur glatteren Deutung „bevor die Zeit begann“ umzuschreiben.
theological_decisions:
- issue: Funktion des Dativs κλήσει ἁγίᾳ
  choice: mit einem heiligen Ruf
  alternative: zu einer heiligen Berufung; durch einen heiligen Ruf
  rationale: Der griechische Dativ kann Begleitung beziehungsweise Art und Weise, Ziel/Bezug oder Mittel nahelegen. Der Haupttext entscheidet diese Mehrdeutigkeit nicht unnötig.
- issue: Χριστός als Titel oder namensähnlicher Bestandteil
  choice: Messias Jesus
  alternative: Christus Jesus; Jesus, der Messias
  rationale: Die Wiedergabe mit „Messias“ macht den Titelgehalt sichtbar. Die Wortfolge bleibt nahe an Χριστῷ Ἰησοῦ und erhält die feste paulinische Formel.
- issue: Zeitliche Aussage von πρὸ χρόνων αἰωνίων
  choice: vor ewigen Zeiten
  alternative: bevor die Zeiten begannen; bevor die Zeit begann
  rationale: Die gewählte Form bewahrt die Spannung der griechischen Wendung, statt sie ausdrücklich als Aussage über einen Beginn der Zeit auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Relativsatz an Vers 8 anschlussfähig. Der Gedankenstrich gliedert den langen Satz, und der zweite Satz nennt „Gnade“ erneut, damit der grammatische Bezug des griechischen femininen Partizips im Deutschen eindeutig bleibt.
