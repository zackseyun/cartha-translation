source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: de
  text: Der Herr schenke ihm, an jenem Tag Erbarmen vom Herrn zu finden[a][b] — und du weißt besser, wie viel er in Ephesus gedient hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beim Herrn“. Die griechische Präposition kann hier die Herkunft des Erbarmens bezeichnen; manche verstehen sie als Betonung der Gegenwart beim Herrn.'
    reason: lexical_alternative
  - marker: b
    text: „Jener Tag“ bezeichnet im Neuen Testament häufig den kommenden Tag des göttlichen Gerichts oder der Rechtfertigung.
    reason: cross_reference
  - marker: c
    text: 'Oder: „was er alles in Ephesus an Diensten geleistet hat“. Die griechische Wendung fasst den Umfang seines Dienstes zusammen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος
  choice: Der Herr schenke ihm
  rationale: Der Optativ drückt einen Wunsch oder ein Gebet aus. Der deutsche Konjunktiv „schenke“ gibt diese Funktion natürlich und würdig wieder.
- source_word: εὑρεῖν ἔλεος
  choice: Erbarmen zu finden
  rationale: Bewahrt die griechische Wendung und ist im Deutschen verständlich; „Erbarmen“ trifft ἔλεος in diesem Kontext.
- source_word: παρὰ κυρίου
  choice: beim Herrn
  rationale: παρά mit Genitiv kann Herkunft oder die Nähe beziehungsweise Gegenwart bei jemandem bezeichnen. „Beim Herrn“ bewahrt hier die mögliche Gegenwartsnuance und vermeidet die im Deutschen schwer verständliche unmittelbare Folge „der Herr ... vom Herrn“; die Quellenlesart wird in der Fußnote genannt.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: an jenem Tag
  rationale: Idiomatiche deutsche Zeitangabe, die den eschatologischen Bezug andeutet, ohne ihn auslegend festzulegen.
- source_word: ὅσα
  choice: wie viel
  rationale: Fasst natürlich das Ausmaß des Dienstes zusammen; möglich ist auch eine sachbezogene Wiedergabe wie „was er alles“.
- source_word: διηκόνησεν
  choice: gedient hat
  rationale: Gibt den Aorist von διακονέω klar und gegenwärtig verständlich wieder, ohne den Dienst unnötig kirchenamtlich einzuengen.
- source_word: βέλτιον σὺ γινώσκεις
  choice: du weißt besser
  rationale: Erhält den Komparativ βέλτιον, ohne einen im Griechischen unausgesprochenen Vergleich wie „als ich“ ausdrücklich hinzuzufügen.
theological_decisions:
- issue: Bezug der zweimaligen Bezeichnung κύριος
  choice: Beide Vorkommen werden als „Herr“ wiedergegeben, ohne Vater und Sohn ausdrücklich zu unterscheiden.
  alternative: Das erste „Herr“ auf Christus und das zweite auf den Vater beziehen oder beide auf Christus beziehen.
  rationale: Der griechische Text nimmt keine ausdrückliche Unterscheidung vor; die Übersetzung soll diese theologische Offenheit erhalten.
- issue: Bedeutung von „jenem Tag“
  choice: Die konventionelle Wendung bleibt ohne erklärende Erweiterung im Haupttext stehen.
  alternative: „am Tag des Gerichts“ oder „am letzten Tag“.
  rationale: Ein eschatologischer Gerichts- oder Rechtfertigungstag ist wahrscheinlich gemeint, wird hier aber nicht ausdrücklich benannt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelregister. Der Konjunktiv „schenke“ kennzeichnet den Gebetswunsch; „gedient hat“ bleibt bewusst allgemein und praktisch.
