id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: de
  text: die aber jetzt durch die Erscheinung unseres Retters Jesus, des Messias,[a] offenbar geworden ist. Er hat dem Tod die Macht genommen und durch das Evangelium Leben und Unvergänglichkeit ans Licht gebracht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus Christus«. Das griechische Χριστός kann als Titel (»Messias«) oder als namensähnliche Bezeichnung (»Christus«) gebraucht werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Unsterblichkeit«. Das griechische Wort betont Unvergänglichkeit, also Freiheit von Verfall und Verderben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: sichtbar geworden ist
  rationale: Das passive Partizip bezieht sich auf die Gnade im vorigen Vers. Die finite Form stellt im Deutschen den natürlichen Satzanschluss her; „sichtbar geworden“ bewahrt den Gedanken des Offenbarwerdens.
- source_word: ἐπιφανείας
  choice: Erscheinung
  rationale: „Erscheinung“ ist im christologischen Zusammenhang natürlich und gibt das sichtbare historische Auftreten Jesu wieder, ohne das Fremdwort „Epiphanie“ zu verwenden.
- source_word: σωτῆρος
  choice: Retters
  rationale: „Retter“ ist die geläufige und genaue deutsche Wiedergabe des christologischen Titels.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός behält hier nach dem Titel „unseres Retters“ deutlich seinen Titelcharakter. Die Apposition mit Kommas ist idiomatisches Deutsch und vermeidet den Eindruck eines Familiennamens.
- source_word: καταργήσαντος
  choice: hat dem Tod die Macht genommen
  rationale: Die Wendung gibt das Außerkraftsetzen beziehungsweise Unwirksammachen wieder und wahrt die Spannung zwischen dem entscheidenden Sieg über den Tod und seiner gegenwärtig noch erfahrbaren Wirklichkeit.
- source_word: θάνατον
  choice: Tod
  rationale: Direkte und kontextgerechte Wiedergabe.
- source_word: φωτίσαντος
  choice: ans Licht gebracht
  rationale: Die deutsche Redewendung vermittelt natürlich den Gedanken des Offenlegens und Bekanntmachens.
- source_word: ζωὴν
  choice: Leben
  rationale: Direkte Wiedergabe, die das heilsgeschichtliche und eschatologische Gewicht nicht erklärend erweitert.
- source_word: ἀφθαρσίαν
  choice: Unvergänglichkeit
  rationale: Das Wort bezeichnet Freiheit von Verfall und Verderben. „Unvergänglichkeit“ ist im Deutschen präziser und natürlicher als „Unverderblichkeit“; „Unsterblichkeit“ bleibt als verbreitete Alternative in der Fußnote erhalten.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: durch das Evangelium
  rationale: „Evangelium“ ist etabliert und verständlich; „durch“ bewahrt διά mit Genitiv als Mittel.
- source_word: μὲν ... δὲ
  choice: zwei koordinierte Aussagen
  rationale: Die Gegenüberstellung von Entmachtung des Todes und Offenbarung von Leben wird im Deutschen durch die parallele Satzstruktur natürlich ausgedrückt, ohne ein steifes „einerseits … andererseits“.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, der Messias
  alternative: Jesus Christus
  rationale: Im Anschluss an „unseres Retters“ bleibt der Titelgehalt von Χριστός erkennbar. Die Fußnote dokumentiert die mögliche namensähnliche Wiedergabe.
- issue: Aussage von καταργήσαντος über den Tod
  choice: dem Tod die Macht genommen
  alternative: den Tod abgeschafft
  rationale: Die gewählte Formulierung bringt den entscheidenden Sieg stark zum Ausdruck, ohne festzulegen, dass der Tod in der gegenwärtigen Erfahrung bereits völlig aufgehört habe zu existieren.
- issue: Bedeutung von ἀφθαρσίαν
  choice: Unvergänglichkeit
  alternative: Unsterblichkeit
  rationale: „Unvergänglichkeit“ bewahrt den Akzent auf Freiheit von Verfall; die geläufige Alternative wird zur Transparenz in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers wird als grammatischer Anschluss an Vers 9 formuliert. Ein Punkt teilt die lange griechische Partizipialkonstruktion in zwei gut verständliche deutsche Sätze; die theologischen Bezüge bleiben erhalten.
