id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: de
  text: 'An Timotheus, geliebtes Kind: Gnade, Erbarmen und Frieden von Gott, dem Vater, und von Jesus, dem Messias[a], unserem Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus Jesus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: geliebtes
  rationale: Gibt die liebevolle und zugleich gewichtige Anrede wieder; „lieb“ wäre leichter und weniger prägnant.
- source_word: τέκνῳ
  choice: Kind
  rationale: Bewahrt die bildliche geistliche Kindschaft, ohne das allgemeinere τέκνον unnötig als „Sohn“ zu verengen.
- source_word: χάρις
  choice: Gnade
  rationale: Entspricht dem etablierten paulinischen Grußbegriff und seinem theologischen Gehalt.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: Hält den Begriff neben Gnade und Frieden eigenständig fest; „Erbarmen“ ist im modernen Deutsch natürlich und würdevoll.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Bewahrt sowohl die zwischenmenschliche als auch die heilsgeschichtliche Tragweite des Ausdrucks.
- source_word: θεοῦ πατρὸς
  choice: Gott, dem Vater
  rationale: Gibt die Apposition wieder, ohne das im Griechischen hier nicht stehende „unser“ zu ergänzen.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Jesus, dem Messias
  rationale: Übersetzt Χριστός als Titel und ordnet die Wortgruppe für natürliches modernes Deutsch um; der Eigenname Jesus bleibt unverändert.
- source_word: κυρίου
  choice: Herrn
  rationale: Bewahrt die Autoritätsbezeichnung und ihre christologische Bedeutung.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ Ἰησοῦ
  choice: Jesus, dem Messias
  alternative: Christus Jesus
  rationale: Χριστός bezeichnet den gesalbten König und wird daher in seiner titelhaften Bedeutung mit „Messias“ übersetzt. Die Umstellung samt Apposition vermeidet das im Deutschen ungebräuchliche „Messias Jesus“, ohne den Bezug zu verändern.
- issue: Bezug von τοῦ κυρίου ἡμῶν
  choice: unserem Herrn als Apposition zu Jesus, dem Messias
  alternative: keine sachlich abweichende Hauptlesart
  rationale: Kasus, Wortstellung und die übliche Grußformel beziehen „unserem Herrn“ auf Jesus Christus; die deutsche Apposition bildet diesen Bezug klar ab.
translation_notes:
  register: Moderne, würdevolle Briefsprache. Die knappe Anrede ohne ergänztes „mein“ folgt dem griechischen Wortlaut. Das zweite „von“ wurde zur natürlichen und eindeutigen deutschen Koordination ergänzt.
