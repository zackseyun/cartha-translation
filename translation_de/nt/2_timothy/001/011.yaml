  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ ⸀διδάσκαλος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: de
  text: Dafür bin ich als Verkündiger[a], Apostel und Lehrer eingesetzt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Herold. Das griechische Wort bezeichnet einen beauftragten öffentlichen Ausrufer oder Verkündiger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Dafür
  rationale: Die Formulierung verweist knapp und idiomatisch auf das zuvor genannte Evangelium zurück und gibt den Zweck- beziehungsweise Bezugsaspekt von εἰς wieder, ohne den Bezug im Vers selbst unnötig auszudeuten.
- source_word: ἐτέθην
  choice: bin ich … eingesetzt worden
  rationale: Das Passiv von τίθημι bezeichnet hier angesichts der folgenden Rollen eine Beauftragung oder Einsetzung, nicht eine räumliche Platzierung.
- source_word: ἐγώ
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen eine gewisse Hervorhebung. Im Deutschen ergibt sich durch die Wortstellung „bin ich“ bereits eine natürliche Betonung; „ich selbst“ wäre hier überzeichnet.
- source_word: κῆρυξ
  choice: Verkündiger
  rationale: κῆρυξ bezeichnet einen beauftragten öffentlichen Ausrufer oder Herold. „Verkündiger“ ist im heutigen Deutsch verständlich und bewahrt den Gedanken öffentlicher, autorisierter Bekanntmachung besser als das enger kirchlich geprägte „Prediger“.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: In der paulinischen Selbstbezeichnung ist dies der etablierte Titel; die allgemeineren Wiedergaben „Bote“ oder „Gesandter“ würden den erkennbaren Rollenbegriff abschwächen.
- source_word: διδάσκαλος
  choice: Lehrer
  rationale: Die übliche Bedeutung „Lehrer“ passt klar und natürlich in die Reihe der drei Beauftragungen.
theological_decisions:
- issue: Wiedergabe von κῆρυξ als allgemeiner kirchlicher „Prediger“ oder als beauftragter öffentlicher Verkündiger
  choice: Verkündiger
  alternative: Prediger; Herold
  rationale: „Verkündiger“ stellt den im griechischen Wort enthaltenen Gedanken einer beauftragten öffentlichen Proklamation heraus, ohne daraus ein später definiertes Kirchenamt zu machen. „Herold“ wäre bildnäher, wirkt im modernen Deutsch jedoch historisierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Dreierreihe des griechischen Satzes bleibt erhalten. „Dafür“ bewahrt den Rückverweis auf den vorangehenden Zusammenhang, während „eingesetzt worden“ den Charakter der Beauftragung natürlich ausdrückt.
