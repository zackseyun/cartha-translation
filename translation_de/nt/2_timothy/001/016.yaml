id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: de
  text: Der Herr schenke der Hausgemeinschaft des Onesiphorus Barmherzigkeit, denn er hat mir oft neue Kraft gegeben und sich meiner Kette[a] nicht geschämt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meiner Gefangenschaft; wörtlich: meiner Kette.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: schenke
  rationale: Der Aorist Optativ drückt einen Wunsch beziehungsweise ein Gebet aus; der deutsche Konjunktiv Präsens gibt dies natürlich und würdig wieder.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: Die traditionelle, weiterhin verständliche Wiedergabe bezeichnet hier Gottes erbarmende Zuwendung in einer Notlage.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Der Ausdruck steht als göttlicher Titel; die Übersetzung lässt offen, auf wen genau er sich bezieht.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: dem Haus des Onesiphorus
  rationale: Haus kann wie οἶκος die Hausgemeinschaft beziehungsweise Familie bezeichnen und bewahrt zugleich die Ausdrucksweise des griechischen Textes.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion führt die Begründung des Segenswunsches ein; denn klingt in diesem Satz natürlicher als weil.
- source_word: πολλάκις
  choice: oft
  rationale: Knappes und idiomatisches Äquivalent für die wiederholte Handlung.
- source_word: ἀνέψυξεν
  choice: erquickt
  rationale: Das Verb bezeichnet das Verschaffen von Erleichterung oder neuer Kraft. Erquickt erhält das Bild und passt zum würdigen biblischen Register, ohne die Bedeutung auf bloße Ermutigung zu verengen.
- source_word: τὴν ἅλυσίν μου
  choice: meiner Kette
  rationale: Der Singular und das konkrete Bild werden bewahrt; gemeint sein kann metonymisch die Gefangenschaft.
- source_word: οὐκ ἐπαισχύνθη
  choice: sich ... nicht geschämt
  rationale: Die deponentische Form bezeichnet soziale beziehungsweise moralische Scham; die reflexive deutsche Wendung ist idiomatisch.
theological_decisions:
- issue: Bezug von „der Herr“ im Segenswunsch
  choice: Der Herr
  alternative: Gott, der Vater; der Herr Jesus
  rationale: Der griechische Text nennt lediglich ὁ κύριος. Die Übersetzung bestimmt den Bezug nicht näher und bewahrt damit die genuine Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus“ bezeichnet hier die Hausgemeinschaft oder Familie. „Erquickt“ bewahrt die Bildlichkeit von ἀναψύχω; der Satzbau bleibt klar und gut lesbar.
