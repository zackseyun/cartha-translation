id: 2TI.1.7
reference: 2 Timothy 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: de
  text: Denn Gott hat uns nicht einen Geist der Feigheit[a] gegeben, sondern der Kraft, der Liebe und der Besonnenheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Mutlosigkeit“ oder „Ängstlichkeit“; das griechische Wort meint feige Furchtsamkeit, nicht Furcht im Allgemeinen.
    reason: lexical_alternative
  - marker: b
    text: Oder „Selbstbeherrschung“, „Selbstdisziplin“ oder „gesundes Urteilsvermögen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn ... nicht
  rationale: γάρ knüpft den Satz begründend an die vorausgehende Aufforderung an; „denn“ gibt diesen Zusammenhang natürlich wieder, während οὐ die Aussage verneint.
- source_word: ἔδωκεν
  choice: hat ... gegeben
  rationale: Das griechische Aorist bezeichnet hier die vollzogene Gabe Gottes. Das deutsche Perfekt ist in gegenwärtiger Standardsprache natürlich und bewahrt den Bezug ihrer Wirkung auf die Gegenwart.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der Gabe und kann im Deutschen unmittelbar mit „uns“ wiedergegeben werden.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Die Bezeichnung ist im Deutschen ohne Artikel idiomatisch.
- source_word: πνεῦμα
  choice: einen Geist
  rationale: Die Formulierung bewahrt den qualitativen Sinn eines von Gott gegebenen Geistes beziehungsweise einer prägenden Haltung, ohne ausdrücklich „den Heiligen Geist“ einzusetzen.
- source_word: δειλίας
  choice: Feigheit
  rationale: δειλία bezeichnet nicht gewöhnliche Furcht, sondern mutlose oder feige Ängstlichkeit und trägt einen deutlich negativen Beiklang.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach einer verneinten Aussage bringt „sondern“ den starken Gegensatz im Deutschen präziser zum Ausdruck als „aber“.
- source_word: δυνάμεως
  choice: Kraft
  rationale: δύναμις bezeichnet wirksame Kraft oder Befähigung; „Kraft“ ist in diesem Zusammenhang natürlich und vermeidet mögliche politische Nebenbedeutungen von „Macht“.
- source_word: ἀγάπης
  choice: Liebe
  rationale: „Liebe“ ist die direkte und gegenwärtig verständliche Entsprechung von ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: Besonnenheit
  rationale: Der seltene Ausdruck umfasst vernünftige Selbststeuerung, gesundes Urteilsvermögen und Selbstdisziplin. „Besonnenheit“ hält diese mentale und praktische Bedeutungsbreite besser offen als das engere „Selbstbeherrschung“.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: „einen Geist“ als qualitativ beschriebene, von Gott gegebene Wirklichkeit oder Haltung
  alternative: „den Geist“ als ausdrückliche Bezeichnung des Heiligen Geistes
  rationale: Das artikellose πνεῦμα und die abhängigen Genitive beschreiben die Qualität des Geistes. Der unmittelbare Satzbau verlangt keine ausdrückliche Identifikation mit dem Heiligen Geist. Zugleich bleibt durch das Wort „Geist“ und die Herkunft der Gabe von Gott eine solche Beziehung möglich; sie wird nicht ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Genitivreihe „der Feigheit ... der Kraft, der Liebe und der Besonnenheit“ bildet die knappe Parallelstruktur des griechischen Textes nach. „Besonnenheit“ ist allgemein verständlich und bewahrt die Bedeutungsbreite des seltenen σωφρονισμός.
