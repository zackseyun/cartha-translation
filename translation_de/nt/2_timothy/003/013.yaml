source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: de
  text: Böse Menschen und Betrüger[a] aber werden es immer schlimmer treiben[b] und andere irreführen und selbst irregeführt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für »Betrüger« steht ein griechisches Wort, das auch »Scharlatane« oder »Verführer« bedeuten und in manchen Zusammenhängen Anklänge an Zauberei oder Quacksalberei haben kann.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »werden zum Schlechteren fortschreiten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: böse
  rationale: Bezeichnet hier moralische Verderbtheit, nicht bloß eine geringe Qualität.
- source_word: δὲ
  choice: aber
  rationale: Gibt den Gegensatz zum vorangehenden Gedanken natürlich wieder.
- source_word: ἄνθρωποι
  choice: Menschen
  rationale: Der Plural bezeichnet allgemein menschliche Personen und ist nicht auf Männer beschränkt.
- source_word: γόητες
  choice: Betrüger
  rationale: Bezeichnet betrügerische Schwindler; mögliche Anklänge an Zauberei oder Quacksalberei werden nicht überbetont.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: werden es immer schlimmer treiben
  rationale: Gibt die ironische Bewegung des »Fortschreitens« zum Schlechteren in natürlichem Deutsch wieder.
- source_word: πλανῶντες
  choice: indem sie andere irreführen
  rationale: Bewahrt den fortdauernden aktiven Vorgang und macht das mitgedachte Objekt im Deutschen verständlich.
- source_word: πλανώμενοι
  choice: selbst irregeführt werden
  rationale: Bewahrt die passive Form und die Spannung, dass die Irreführenden ihrerseits irregeführt werden.
theological_decisions:
- issue: Generische Bedeutung von ἄνθρωποι
  choice: Menschen
  alternative: Männer
  rationale: Der Kontext spricht allgemein von bösen Personen; eine Beschränkung auf männliche Personen wäre sachlich unbegründet.
- issue: Bedeutungsumfang von γόητες
  choice: Betrüger
  alternative: Scharlatane; Verführer; Zauberer
  rationale: Der Zusammenhang betont Täuschung und moralisch-religiösen Betrug. »Betrüger« wahrt dies, ohne eine ausdrücklich okkulte Tätigkeit zu behaupten.
- issue: Aktive und passive Täuschung
  choice: sie führen andere irre und werden selbst irregeführt
  alternative: sie verführen und verirren sich
  rationale: Die passive Form πλανώμενοι bleibt erhalten; damit wird nicht entschieden, wer oder was sie irreführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung »es immer schlimmer treiben« vermittelt die negative Entwicklung; die Fußnote bewahrt die wörtliche Bewegungsmetapher und die Bedeutungsbreite von γόητες.
