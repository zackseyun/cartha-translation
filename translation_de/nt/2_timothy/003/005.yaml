  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: de
  text: Sie haben zwar eine Form der Gottesfurcht[a], deren Kraft sie aber verleugnet haben. Von solchen Menschen wende dich ab![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Anschein von Gottesfurcht“. Das griechische Wort kann Form, Ausprägung oder Erscheinung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Halte dich von solchen Menschen fern!“ Das griechische Verb bedeutet, sich von jemandem abzuwenden oder ihn zu meiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: Sie haben
  rationale: Das Partizip beschreibt weiterhin die zuvor genannten Menschen. Ein selbstständiger deutscher Satz ist hier natürlicher als eine partizipiale Konstruktion.
- source_word: μόρφωσιν
  choice: eine äußere Form
  rationale: μόρφωσις bezeichnet Form, Ausprägung oder Erscheinungsbild. „Äußere Form“ macht den Gegensatz zur verleugneten Kraft verständlich, ohne bloßen Schein zwingend vorauszusetzen.
- source_word: εὐσεβείας
  choice: der Gottesfurcht
  rationale: εὐσέβεια bezeichnet in den Pastoralbriefen eine auf Gott ausgerichtete ehrfürchtige Lebenshaltung. „Gottesfurcht“ ist würdig und im Deutschen verständlicher als das heute teils missverständliche „Gottseligkeit“.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: verleugnen aber deren Kraft
  rationale: „deren Kraft“ bewahrt den Bezug auf die Gottesfurcht und lässt offen, worin ihre wirksame Kraft genau besteht.
- source_word: ἠρνημένοι
  choice: verleugnen
  rationale: Das Perfektpartizip bezeichnet eine vollzogene und fortbestehende Verweigerung. Im Deutschen gibt das Präsens im Zusammenhang diese feste Haltung idiomatisch wieder.
- source_word: καὶ τούτους ἀποτρέπου
  choice: Von solchen Menschen wende dich ab!
  rationale: Das mediale Imperativverb fordert Timotheus auf, sich selbst von den bezeichneten Menschen abzuwenden. „solchen Menschen“ gibt den Rückverweis von τούτους natürlich wieder.
theological_decisions:
- issue: Gegensatz zwischen äußerer Religiosität und wirksamer Wirklichkeit
  choice: „eine äußere Form der Gottesfurcht … deren Kraft“
  alternative: „den Anschein von Gottesfurcht … ihre Kraft“
  rationale: Die Formulierung bewahrt den Gegensatz zwischen sichtbarer religiöser Gestalt und fehlender wirksamer Kraft, ohne diese Kraft ausschließlich als Wunderkraft, moralische Veränderung oder Wirken des Heiligen Geistes festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gottesfurcht“ wurde dem veralteten oder missverständlichen „Gottseligkeit“ vorgezogen; die direkte Aufforderung bleibt kraftvoll und gut verständlich.
