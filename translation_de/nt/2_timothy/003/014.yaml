  naturalness: „Du aber bleibe … und weißt“ verbindet einen Imperativ mit einem Indikativ durch „und“ und ist im Deutschen syntaktisch bzw. stilistisch unerquicklich. Eine adverbiale Anbindung wie „da du weißt“ gibt das griechische Partizip εἰδώς natürlich wieder. Die Formulierung „dessen du gewiss geworden bist“ ist klar und modernes würdiges Standarddeutsch.
  terminology: „Du aber“, „bleibe bei dem“ und „gelernt hast“ sind treffend. Die Änderung zu „gewiss geworden bist“ bewahrt den Bezug auf die Verlässlichkeit bzw. Gewissheit des Gelernten, ohne eine bestimmte Person als Überzeugenden einzutragen. Die textkritische Anmerkung muss ausdrücklich sagen, dass Singular und Plural im Griechischen stehen, weil deutsches „von wem“ die Zahl nicht sichtbar macht.
