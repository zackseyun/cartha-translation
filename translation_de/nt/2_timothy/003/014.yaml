  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: de
  text: Du aber bleibe bei dem, was du gelernt hast und dessen du gewiss geworden bist,[a] da du weißt, von wem du es gelernt hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wovon du überzeugt worden bist“.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lesen im Griechischen den Singular („von wem“), häufig auf Paulus bezogen. Die hier zugrunde gelegte pluralische Lesart kann allgemeiner auf die Lehrer des Timotheus weisen.
    reason: textual_variant
lexical_decisions:
- source_word: σὺ δὲ
  choice: Du aber
  rationale: Das ausdrücklich gesetzte Pronomen σὺ hebt Timotheus kontrastierend von den zuvor beschriebenen Menschen ab; δέ führt diesen Gegensatz weiter.
- source_word: μένε ἐν οἷς
  choice: bleibe bei dem, was
  rationale: Der Präsensimperativ fordert zu anhaltendem Festhalten auf. „Bei etwas bleiben“ ist im modernen Deutschen idiomatisch und bewahrt den Gedanken des Verharrens bei den empfangenen Lehren.
- source_word: ἔμαθες
  choice: du gelernt hast
  rationale: Das Perfekt gibt im Deutschen natürlich wieder, dass Timotheus früher unterwiesen wurde und das Gelernte weiterhin maßgeblich ist.
- source_word: ἐπιστώθης
  choice: wovon du überzeugt worden bist
  rationale: Die Passivform bezeichnet hier am ehesten das Erlangen gefestigter Gewissheit hinsichtlich des Gelernten. Die Formulierung bewahrt zugleich das Passiv und vermeidet die weniger wahrscheinliche Deutung „was dir anvertraut wurde“.
- source_word: εἰδὼς
  choice: und weißt
  rationale: Die koordinierende Wiedergabe ist im Deutschen flüssig und lässt das genaue Verhältnis des Partizips zum Hauptsatz offen, statt es ausdrücklich kausal mit „weil“ oder „da“ festzulegen.
- source_word: παρὰ τίνων
  choice: von wem
  rationale: παρά mit Genitiv bezeichnet die Quelle. Das deutsche „von wem“ ist hinsichtlich der Zahl äußerlich offen und benennt die Lehrer nicht über den Wortlaut hinaus.
- source_word: ἔμαθες
  choice: du es gelernt hast
  rationale: Das ergänzte „es“ nimmt im Deutschen idiomatisch den zuvor genannten Lehrinhalt wieder auf, ohne einen neuen Sachgehalt einzuführen.
theological_decisions:
- issue: Bezug und Numerus von παρὰ τίνων
  choice: Im Haupttext steht offen „von wem“; die zugrunde gelegte Lesart ist der Plural.
  alternative: Einige Handschriften bieten den Singular, der häufig auf Paulus bezogen wird.
  rationale: Der SBLGNT folgt dem Plural und kann damit mehrere Lehrer des Timotheus im Blick haben. Da der Vers diese Personen nicht ausdrücklich nennt und die deutsche Formulierung den Bezug offenlassen kann, werden weder Paulus allein noch bestimmte weitere Personen in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bleibe bei“ ist natürlicher als das wörtlichere „bleibe in“, während die Aufforderung zum beharrlichen Festhalten erhalten bleibt. Der Satzanschluss mit „und weißt“ bewahrt die Offenheit des griechischen Partizips.
