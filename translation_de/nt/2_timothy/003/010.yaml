id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: de
  text: Du aber bist meiner Lehre, meinem Lebenswandel, meinem Vorsatz, meinem Glauben[a], meiner Geduld, meiner Liebe und meiner Ausdauer genau gefolgt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meiner Treue“. Das griechische Wort kann hier sowohl Glauben als auch Treue bezeichnen.'
    reason: Alternative Bedeutungsnuance von πίστις; die Mehrdeutigkeit soll nicht stillschweigend aufgelöst werden.
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Du aber
  rationale: Das ausdrückliche „Du“ bewahrt die Betonung des Pronomens Σὺ; „aber“ gibt den Kontrast zum vorangehenden Abschnitt wieder.
- source_word: παρηκολούθησάς
  choice: bist … genau gefolgt
  rationale: παρακολουθέω bezeichnet hier ein genaues Mitverfolgen und Sich-Anschließen. Die Formulierung ist im Deutschen natürlich und lässt sowohl aufmerksame Kenntnis als auch Nachfolge anklingen.
- source_word: μου
  choice: meiner / meinem
  rationale: Das Genitivpronomen wird possessiv auf die folgenden Glieder bezogen; die deutschen Formen richten sich nach Genus und Kasus der jeweiligen Substantive.
- source_word: διδασκαλίᾳ
  choice: Lehre
  rationale: „Lehre“ ist eine knappe, geläufige Wiedergabe für den Inhalt dessen, was Paulus lehrte.
- source_word: ἀγωγῇ
  choice: Lebenswandel
  rationale: ἀγωγή bezeichnet die Lebensführung beziehungsweise das Verhalten. „Lebenswandel“ erfasst die umfassende Art zu leben und passt zum würdevollen Register.
- source_word: προθέσει
  choice: Vorsatz
  rationale: πρόθεσις meint hier die feste Absicht oder Zielsetzung; „Vorsatz“ bewahrt diesen entschlossenen Sinn.
- source_word: πίστει
  choice: Glauben
  rationale: πίστις kann hier sowohl Glauben als auch Treue bezeichnen. „Glauben“ steht im Haupttext; die ebenfalls plausible Bedeutung „Treue“ wird in der Fußnote bewahrt.
- source_word: μακροθυμίᾳ
  choice: Geduld
  rationale: μακροθυμία bezeichnet lang anhaltende Geduld, besonders gegenüber Menschen oder unter Provokation. „Geduld“ ist modernes, verständliches Deutsch.
- source_word: ἀγάπῃ
  choice: Liebe
  rationale: „Liebe“ ist die natürliche und etablierte Wiedergabe von ἀγάπη.
- source_word: ὑπομονῇ
  choice: Ausdauer
  rationale: ὑπομονή betont standhaftes Ausharren unter Belastung. „Ausdauer“ unterscheidet den Begriff von der zuvor genannten μακροθυμία („Geduld“).
theological_decisions:
- issue: Bedeutung von πίστις in der Tugendaufzählung
  choice: Glauben
  alternative: Treue; Vertrauen
  rationale: Im Zusammenhang sind sowohl persönlicher Glaube beziehungsweise Vertrauen als auch Zuverlässigkeit oder Treue möglich. Der Haupttext entscheidet sich für „Glauben“, ohne die Alternative auszuschließen; „Treue“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Aufzählung bleibt erhalten; „Geduld“ und „Ausdauer“ unterscheiden die beiden griechischen Begriffe μακροθυμία und ὑπομονή. Der Fußnotenmarker steht unmittelbar bei „Glauben“, auf das sich die sachliche Anmerkung bezieht.
