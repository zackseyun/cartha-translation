review_pass:
  verdict: revise
  source_fidelity: Der Satz gibt Umfang (πάντες), den willentlichen Charakter (οἱ θέλοντες), die künftige Verfolgung (διωχθήσονται) und die offene ἐν-Beziehung grundsätzlich korrekt wieder. „Christus“ übernimmt jedoch die gräzisierte Titelform statt Χριστός als „Messias“ wiederzugeben.
  naturalness: Die Satzfügung ist verständlich und standardsprachlich. „ein Leben in Gottesfurcht führen“ ist idiomatisch, aber etwas umständlicher als die griechische Formulierung. Das deutsche Futurpassiv „werden ... verfolgt werden“ ist trotz der Wiederholung von „werden“ korrekt und hier zur Wiedergabe des Futurs angemessen.
  terminology: „Messias Jesus“ macht den Titelcharakter von Χριστός transparent und entspricht der auditierbaren englischen Entscheidung „Messiah Jesus“. „gottesfürchtig“ gibt εὐσεβῶς in modernem Deutsch knapp und religiös-moralisch angemessen wieder, ohne eine konfessionelle Auslegung hinzuzufügen.
