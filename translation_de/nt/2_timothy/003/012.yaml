source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: de
  text: Und tatsächlich werden alle, die in Messias Jesus gottesfürchtig leben wollen, verfolgt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ … δὲ
  choice: Und tatsächlich
  rationale: Die Partikelverbindung knüpft an den vorherigen Zusammenhang an und unterstreicht zugleich bestätigend die folgende Aussage, ohne einen starken Gegensatz auszudrücken.
- source_word: πάντες οἱ θέλοντες
  choice: alle, die … führen wollen
  rationale: Die substantivierte Partizipialgruppe bezeichnet umfassend alle Menschen mit diesem Lebenswillen; „wollen“ gibt den volitionalen Sinn von θέλω natürlich wieder.
- source_word: ζῆν εὐσεβῶς
  choice: ein Leben in Gottesfurcht führen
  rationale: Das Adverb εὐσεβῶς bezeichnet eine von Ehrfurcht und Hingabe an Gott geprägte Lebensweise. Die Formulierung ist in modernem Deutsch verständlich und vermeidet das heute leicht missverständliche „fromm leben“.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Christus Jesus
  rationale: ἐν bezeichnet hier die Lebenssphäre beziehungsweise Verbundenheit mit Jesus. „Christus Jesus“ ist die im Deutschen eingebürgerte, würdige Wiedergabe und lässt den messianischen Titel im Ausdruck erkennbar.
- source_word: διωχθήσονται
  choice: werden … verfolgt werden
  rationale: Das Futur Passiv wird unmittelbar wiedergegeben und bewahrt die bestimmte Aussage des griechischen Textes.
theological_decisions:
- issue: Bedeutung von ἐν Χριστῷ Ἰησοῦ
  choice: in Christus Jesus
  alternative: in der Verbundenheit mit Christus Jesus
  rationale: Die knappe Formulierung bewahrt die theologisch dichte und im Griechischen genuine Offenheit zwischen Zugehörigkeit, Gemeinschaft und Lebenssphäre, statt sie auf eine einzige Erklärung festzulegen.
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: Messias
  rationale: „Christus Jesus“ ist im modernen deutschen Bibel- und Allgemeingebrauch eine verständliche feste Titelform. Sie vermeidet die im Deutschen ungewöhnliche Wortfolge „Messias Jesus“, ohne den Titelcharakter ausdrücklich zu leugnen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Der Satz bleibt bestimmt und universal; seine theologische Spannung wird nicht abgeschwächt.
