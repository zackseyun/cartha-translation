source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: de
  text: Denn die Menschen werden selbstsüchtig, geldgierig, prahlerisch, überheblich, beleidigend[a], den Eltern ungehorsam, undankbar und unheilig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „verleumderisch“ oder „gotteslästerlich“. Das griechische Wort kann schmähende oder ehrverletzende Rede gegen Menschen oder gegen Gott bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: werden … sein
  rationale: Das Futur von εἰμί wird im Deutschen natürlich mit „werden … sein“ wiedergegeben; die Satzklammer umfasst dabei die gesamte Aufzählung.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die erklärende Verbindung zum vorhergehenden Vers, ohne sie stärker kausal auszudeuten.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: Die grammatisch maskuline Pluralform bezeichnet hier Menschen allgemein und ist nicht auf Männer beschränkt.
- source_word: φίλαυτοι
  choice: selbstsüchtig
  rationale: Das Wort bezeichnet eine verkehrte, eigennützige Selbstliebe. „Selbstsüchtig“ ist im heutigen Deutsch klarer und natürlicher als das wörtlichere „selbstliebend“.
- source_word: φιλάργυροι
  choice: geldgierig
  rationale: Das Kompositum bedeutet wörtlich „geldliebend“. „Geldgierig“ gibt den negativen moralischen Sinn prägnant und idiomatisch wieder.
- source_word: ἀλαζόνες
  choice: prahlerisch
  rationale: Der Ausdruck bezeichnet Menschen, die großtun oder sich mit ihren Ansprüchen hervortun; „prahlerisch“ passt zum knappen Stil der Lasterliste.
- source_word: ὑπερήφανοι
  choice: überheblich
  rationale: „Überheblich“ vermittelt den eindeutig negativen Sinn von Hochmut und grenzt das Wort von einem möglicherweise positiv verstandenen „stolz“ ab.
- source_word: βλάσφημοι
  choice: verleumderisch
  rationale: Der Ausdruck kann ehrverletzende, schmähende Rede gegen Menschen oder gegen Gott bezeichnen. „Verleumderisch“ passt zum zwischenmenschlichen Gepräge der Liste; die größere Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: den Eltern ungehorsam
  rationale: Die Dativverbindung wird im Deutschen idiomatisch mit „jemandem ungehorsam“ wiedergegeben.
- source_word: ἀχάριστοι
  choice: undankbar
  rationale: Dies ist die klare und geläufige Entsprechung für fehlende Dankbarkeit.
- source_word: ἀνόσιοι
  choice: unheilig
  rationale: „Unheilig“ erhält die religiös-moralische Aussage, dass Ehrfurcht vor dem Heiligen und die entsprechende Haltung fehlen.
theological_decisions:
- issue: Generischer Umfang von οἱ ἄνθρωποι
  choice: die Menschen
  alternative: die Männer
  rationale: Der Ausdruck bezieht sich allgemein auf Menschen; eine Beschränkung auf männliche Personen wäre sachlich unbegründet.
- issue: Bedeutungsumfang von βλάσφημοι
  choice: verleumderisch
  alternative: gotteslästerlich oder beleidigend
  rationale: Das griechische Wort kann Schmährede gegen Menschen ebenso wie Lästerung gegen Gott bezeichnen. Die Haupttextwahl folgt dem wahrscheinlichen sozialen Bezug der Lasterliste, während die Fußnote die echte semantische Offenheit festhält.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem Rhythmus einer Lasterliste. Die Adjektivreihe bleibt leicht verständlich; das einzige erklärungsbedürftige, semantisch mehrdeutige Wort erhält eine Fußnote.
