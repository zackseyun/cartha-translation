  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: de
  text: Jede Schrift[a] ist von Gott eingegeben und nützlich zur Lehre, zur Zurechtweisung, zur Korrektur und zur Erziehung in der Gerechtigkeit.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die ganze Schrift“. Das griechische πᾶσα γραφή kann distributiv („jede Schrift“) oder kollektiv („die ganze Schrift“) verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Jede von Gott eingegebene Schrift ist auch nützlich zur Lehre, zur Zurechtweisung, zur Korrektur und zur Erziehung in der Gerechtigkeit.“'
    reason: alternative_reading
  - marker: c
    text: „Gerechtigkeit“ kann in manchen paulinischen Zusammenhängen auch den Bereich des Rechts und der Gerechtigkeit bezeichnen; hier geht es um die Formung zu einem Leben in Gerechtigkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Jede Schrift
  rationale: Die artikellose Wendung kann distributiv („jede Schrift“) oder kollektiv („die ganze Schrift“) verstanden werden. „Jede Schrift“ bildet die griechische Form unmittelbar ab; im Zusammenhang mit Vers 15 bezeichnet γραφή die heiligen Schriften, nicht beliebige Schriftstücke.
- source_word: θεόπνευστος
  choice: von Gott eingegeben
  rationale: Das Wort bezeichnet die Schrift als von Gott hervorgebracht, wörtlich etwa „von Gott gehaucht“. „Von Gott eingegeben“ ist im Deutschen natürlich und würdevoll, ohne eine bestimmte spätere Inspirationstheorie festzulegen.
- source_word: ὠφέλιμος
  choice: nützlich
  rationale: „Nützlich“ gibt den Gedanken des Förderlichen und Zweckdienlichen klar und in modernem Deutsch wieder.
- source_word: πρὸς διδασκαλίαν
  choice: zum Lehren
  rationale: Die Formulierung umfasst die Tätigkeit und den Inhalt des Lehrens und vermeidet eine Verengung auf ein festes Lehrsystem.
- source_word: ἐλεγμόν
  choice: zur Überführung
  rationale: Der Ausdruck meint das Aufdecken und Erweisen von Irrtum oder Schuld. „Überführung“ bewahrt diesen korrigierenden Sinn und unterscheidet ihn von der folgenden Zurechtbringung.
- source_word: ἐπανόρθωσιν
  choice: zur Zurechtbringung
  rationale: Das Substantiv bezeichnet das Wiederaufrichten beziehungsweise In-Ordnung-Bringen. „Zurechtbringung“ gibt diesen wiederherstellenden Aspekt deutlicher wieder als bloße Zurechtweisung.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: zur Erziehung in Gerechtigkeit
  rationale: παιδεία bezeichnet anhaltende Formung, Unterweisung und nötigenfalls Disziplin. „Erziehung“ bringt diesen umfassenden Bildungsprozess zum Ausdruck; „Gerechtigkeit“ bewahrt den üblichen theologischen Begriff, wobei hier besonders rechtschaffenes Leben gemeint ist.
theological_decisions:
- issue: Syntaktisches Verhältnis von θεόπνευστος und ὠφέλιμος zu πᾶσα γραφή
  choice: 'Beide Adjektive werden prädikativ verstanden: „Jede Schrift ist von Gott eingegeben und nützlich.“'
  alternative: „Jede von Gott eingegebene Schrift ist auch nützlich …“
  rationale: Die prädikative Lesart versteht beide Adjektive als parallele Aussagen über die Schrift und passt gut zum Fortgang in Vers 17. Die attributive Deutung ist grammatisch möglich und wird deshalb in einer Fußnote bewahrt.
- issue: Distributive oder kollektive Bedeutung von πᾶσα γραφή
  choice: „Jede Schrift“
  alternative: „Die ganze Schrift“
  rationale: Ohne Artikel liegt die distributive Wiedergabe formal näher. Da im Kontext die heiligen Schriften als zusammengehörige Größe im Blick stehen können, bleibt die kollektive Lesart ausdrücklich in einer Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die vier parallelen Zweckangaben des Griechischen bleiben erkennbar. „Zurechtbringung“ ist bewusst gewählt, um den wiederherstellenden Sinn von ἐπανόρθωσις gegenüber der vorausgehenden Überführung zu erhalten.
