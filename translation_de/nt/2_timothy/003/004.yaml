lexical_decisions:
- source_word: προδόται
  choice: Verräter
  rationale: Das Substantiv bezeichnet Menschen, die andere verraten oder treulos ausliefern. „Verräter“ ist in einer deutschen Lasterliste knapp, natürlich und moralisch gewichtig.
- source_word: προπετεῖς
  choice: unbesonnen
  rationale: Das Wort beschreibt impulsives, vorschnelles Handeln ohne Rücksicht auf die Folgen. „Unbesonnen“ gibt diese Bedeutung in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: τετυφωμένοι
  choice: aufgeblasen
  rationale: Das Perfektpassivpartizip bezeichnet einen anhaltenden Zustand der Verblendung oder Überheblichkeit. „Aufgeblasen“ bewahrt das griechische Bild und ist zugleich idiomatisch verständlich.
- source_word: φιλήδονοι
  choice: die das Vergnügen … lieben
  rationale: Das zusammengesetzte Adjektiv bezeichnet Menschen, deren Liebe dem Vergnügen gilt. Die verbale Formulierung klingt im Deutschen natürlicher als „Vergnügungsliebhaber“ und ermöglicht die parallele Gegenüberstellung mit der Liebe zu Gott.
- source_word: μᾶλλον ἢ
  choice: mehr … als
  rationale: Die Vergleichskonstruktion kann eine stärkere Zuneigung beziehungsweise Bevorzugung ausdrücken. „Mehr … als“ bewahrt die Vergleichsform, ohne sie zu einem absoluten Ausschluss umzudeuten.
- source_word: φιλόθεοι
  choice: Gott lieben
  rationale: Das zusammengesetzte Adjektiv bezeichnet Menschen, die Gott lieben. Die Wendung steht parallel zu „das Vergnügen … lieben“ und erhält so den rhetorischen Gegensatz.
theological_decisions:
- issue: Vergleich oder ausschließender Gegensatz zwischen Vergnügungsliebe und Gottesliebe
  choice: „die das Vergnügen mehr lieben als Gott“
  alternative: „die das Vergnügen statt Gott lieben“
  rationale: μᾶλλον ἢ kann eine Präferenz ausdrücken. „Mehr … als“ erhält die echte Vergleichsspannung des griechischen Textes und vermeidet, stillschweigend einen ausschließlich binären Gegensatz festzulegen.
- issue: Bildhafte oder abstrakte Wiedergabe von τετυφωμένοι
  choice: „aufgeblasen“
  alternative: „eingebildet“ oder „überheblich“
  rationale: Die bildhafte Wiedergabe wahrt die Ausdrucksweise des Ausgangstextes, ohne dem Begriff eine zusätzliche lehrmäßige Bedeutung zu geben.
