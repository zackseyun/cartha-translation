id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: de
  text: meinen Verfolgungen und Leiden, wie sie mir in Antiochia, in Ikonion und in Lystra widerfuhren — was für Verfolgungen ich ertragen habe; und aus all dem hat mich der Herr[b] gerettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus allem“ beziehungsweise „aus all diesen Bedrängnissen“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „der Herr“ ist wahrscheinlich der Herr Jesus gemeint; im griechischen Text steht jedoch nur „der Herr“.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς διωγμοῖς / οἵους διωγμούς
  choice: meinen Verfolgungen / was für Verfolgungen
  rationale: „Verfolgungen“ bezeichnet hier feindselige Bedrängung wegen Auftrag und Glauben. „Was für“ gibt die qualitative und wohl ausrufende Kraft von οἵους wieder.
- source_word: τοῖς παθήμασιν
  choice: Leiden
  rationale: „Leiden“ bewahrt die breite Bedeutung des griechischen Wortes und legt die Erfahrungen nicht einseitig als äußere Not oder körperlichen Schmerz aus.
- source_word: οἷά μοι ἐγένετο
  choice: wie sie mir … widerfuhren
  rationale: Die Formulierung bezieht sich natürlich auf die zuvor genannten Verfolgungen und Leiden und gibt den beispielhaften Rückblick idiomatisch wieder.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: in Antiochia, in Ikonion und in Lystra
  rationale: Die etablierten deutschen Namensformen werden verwendet; die wiederholte Präposition erhält den aufzählenden Rhythmus weitgehend.
- source_word: ὑπήνεγκα
  choice: ich ertragen habe
  rationale: Das Verb bezeichnet das standhafte Tragen beziehungsweise Erdulden unter Druck; „ertragen“ ist präzise und natürlich.
- source_word: ἐκ πάντων
  choice: aus ihnen allen
  rationale: Die Formulierung wahrt die mit ἐκ ausgedrückte Vorstellung der Rettung aus sämtlichen genannten Bedrängnissen, ohne zu behaupten, Paulus sei ihnen jeweils von vornherein entzogen worden.
- source_word: ἐρρύσατο
  choice: hat … gerettet
  rationale: Das Verb bezeichnet konkrete Rettung aus Gefahr. „Gerettet“ ist im modernen Deutsch verständlich und lässt die Art der Rettung offen.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Der griechische Titel wird direkt wiedergegeben, ohne den im Text nicht ausdrücklich genannten Namen „Jesus“ einzufügen.
theological_decisions:
- issue: Bezug von „der Herr“
  choice: Im Haupttext steht nur „der Herr“.
  alternative: „der Herr Jesus“
  rationale: Im paulinischen Zusammenhang ist wahrscheinlich Jesus gemeint; der griechische Text nennt jedoch nur ὁ κύριος. Die Übersetzung bewahrt diese sprachliche Offenheit.
- issue: Art der Rettung aus den Verfolgungen
  choice: „aus ihnen allen … gerettet“
  alternative: „vor ihnen allen bewahrt“
  rationale: ἐκ bezeichnet Rettung aus den Bedrängnissen und muss nicht bedeuten, dass Paulus jedes Leiden vermied. Die gewählte Fassung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch die Aufzählung aus dem vorherigen Vers fort; deshalb beginnt er mit „meinen“. Der Gedankenstrich und der Ausruf geben die nachdrückliche Wiederaufnahme der Verfolgungen wieder.
