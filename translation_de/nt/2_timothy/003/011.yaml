  to: meinen Verfolgungen und Leiden, wie sie mir in Antiochia, in Ikonion und in Lystra widerfuhren — was für Verfolgungen ich ertragen habe; und aus all dem hat mich der Herr[b] gerettet.[a]
  rationale: 'Die kollektive Wiedergabe „aus all dem“ verbessert die idiomatische Verständlichkeit und umfasst weiterhin sämtliche genannten Verfolgungen und Leiden. Die Fußnotenanker werden an die jeweils erläuterte Stelle gesetzt: [a] bei der Rettung „aus all dem“ und [b] bei „der Herr“. Die ungewöhnliche Wiederaufnahme „was für Verfolgungen ich ertragen habe“ bleibt im Text; sie gibt die qualitative, möglicherweise ausrufende Kraft von οἵους διωγμούς wieder, ohne sie durch ein Ausrufezeichen festzulegen.'
