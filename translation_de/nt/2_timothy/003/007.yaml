  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: de
  text: die immerzu lernen und doch nie zur Erkenntnis der Wahrheit[a] gelangen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur vollen Erkenntnis der Wahrheit«. Das griechische Wort kann eine vertiefte oder vollständigere Erkenntnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: immerzu
  rationale: Bezeichnet eine fortwährende oder ständig wiederholte Tätigkeit und bildet einen prägnanten Gegensatz zu »nie«.
- source_word: μανθάνοντα
  choice: lernen
  rationale: Das Präsenspartizip beschreibt einen andauernden Lernvorgang, ohne die Art der Unterweisung näher festzulegen.
- source_word: μηδέποτε
  choice: nie
  rationale: Bewahrt den scharfen zeitlichen Gegensatz zu πάντοτε in natürlichem Deutsch.
- source_word: εἰς ἐπίγνωσιν
  choice: zur Erkenntnis
  rationale: Die Verbindung bezeichnet das Erreichen beziehungsweise Eintreten in Erkenntnis; »zur Erkenntnis gelangen« ist im Deutschen idiomatisch und bewahrt die Bewegungsmetapher.
- source_word: ἀληθείας
  choice: der Wahrheit
  rationale: Der Genitiv hängt von ἐπίγνωσιν ab. »Der Wahrheit« entspricht im paulinischen Zusammenhang der gemeinten maßgeblichen Wahrheit, ohne ihren Inhalt hier weiter festzulegen.
- source_word: ἐλθεῖν
  choice: gelangen
  rationale: Gibt das Bild des Ankommens in der deutschen Wendung »zur Erkenntnis gelangen« natürlich wieder.
- source_word: δυνάμενα
  choice: können
  rationale: Drückt die Fähigkeit beziehungsweise Möglichkeit aus und stimmt grammatisch mit den im vorherigen Vers genannten Frauen überein.
theological_decisions:
- issue: Bedeutungsnuance von ἐπίγνωσις
  choice: Erkenntnis
  alternative: volle Erkenntnis
  rationale: ἐπίγνωσις kann eine vertiefte oder vollständige Erkenntnis bezeichnen. Im Kontext liegt der Nachdruck jedoch darauf, dass trotz ständigen Lernens keine wirkliche Erkenntnis der Wahrheit erreicht wird. Die stärkere Nuance wird deshalb als mögliche Übersetzung in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als abhängiger Satzteil formuliert, da die Partizipien im Griechischen auf die im vorherigen Vers genannten Frauen zurückverweisen. »Immerzu … und doch nie« gibt den rhetorischen Kontrast klar und natürlich wieder.
