  text: ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: de
  text: ohne familiäre Zuneigung, unversöhnlich[a], verleumderisch[b], ohne Selbstbeherrschung, brutal, ohne Liebe zum Guten[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „unerbittlich“; das Wort kann Menschen bezeichnen, die zu keiner Aussöhnung oder Friedensvereinbarung bereit sind.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort διάβολοι bedeutet hier „verleumderisch“ oder „Verleumder“; es bezeichnet an dieser Stelle nicht den Teufel.
    reason: lexical_alternative
  - marker: c
    text: Oder „Feinde des Guten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: ohne familiäre Zuneigung
  rationale: Das Wort bezeichnet das Fehlen der natürlichen, besonders innerhalb der Familie erwarteten Zuneigung. Die Wiedergabe bewahrt diesen engeren Sinn besser als das allgemeinere „lieblos“.
- source_word: ἄσπονδοι
  choice: unversöhnlich
  rationale: Das Adjektiv beschreibt Menschen, die zu keiner Aussöhnung oder Friedensvereinbarung bereit sind. „Unversöhnlich“ ist im modernen Deutsch klar und lässt sowohl die fehlende Versöhnungsbereitschaft als auch den Gedanken der Unerbittlichkeit anklingen.
- source_word: διάβολοι
  choice: verleumderisch
  rationale: In dieser Aufzählung von Lastern ist der Plural eine menschliche Charakterisierung und bedeutet „verleumderisch“ beziehungsweise „Verleumder“, nicht „Teufel“.
- source_word: ἀκρατεῖς
  choice: ohne Selbstbeherrschung
  rationale: Das Wort bezeichnet fehlende Herrschaft über die eigenen Begierden und Impulse. Diese Formulierung ist verständlich und bildet den privativischen Sinn angemessen ab.
- source_word: ἀνήμεροι
  choice: brutal
  rationale: Das Adjektiv bedeutet „ungezähmt“, „wild“ oder „grausam“. „Brutal“ ist eine natürliche, prägnante Bezeichnung für das hier gemeinte rücksichtslose und ungezähmte Verhalten.
- source_word: ἀφιλάγαθοι
  choice: ohne Liebe zum Guten
  rationale: Das zusammengesetzte Wort bezeichnet das Fehlen der Liebe zu dem, was gut ist. Die Wiedergabe wahrt diese privative Bedeutung, ohne sie vorschnell zur aktiven Feindschaft zu steigern.
theological_decisions:
- issue: Bedeutung von διάβολοι in der Lasteraufzählung
  choice: menschliche Verhaltensbeschreibung „verleumderisch“
  alternative: „Teufel“ oder „teuflisch“
  rationale: Form, Numerus und Zusammenhang kennzeichnen Menschen durch ein Laster. Eine Wiedergabe mit „Teufel“ könnte irreführend als Aussage über ihr Wesen oder als Hinweis auf dämonische Wesen verstanden werden.
- issue: Stärke von ἀφιλάγαθοι
  choice: „ohne Liebe zum Guten“
  alternative: „Feinde des Guten“
  rationale: Die gewählte Formulierung erhält zunächst die wörtliche Verneinung der Liebe zum Guten. Die stärkere traditionelle Deutung wird als mögliche Alternative in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige und knapp gereihte Lasterbegriffe. Die substantivisch-abstrakten Umschreibungen bei ἄστοργοι, ἀκρατεῖς und ἀφιλάγαθοι machen die privative Wortbildung verständlich. „Brutal“ ist gegenwärtiger und idiomatischer als „wild“ oder „ungezähmt“. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, auf den sie sich beziehen.
