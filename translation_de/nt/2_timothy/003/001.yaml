  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: de
  text: 'Das aber sollst du wissen: In den letzten Tagen werden schwere Zeiten kommen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gefährliche Zeiten“ oder „harte Zeiten“. Das griechische Adjektiv kann Zeiten bezeichnen, die schwierig, gefährlich oder bedrückend sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: das
  rationale: Das neutrale Demonstrativpronomen verweist voraus auf den mit ὅτι eingeleiteten Inhalt; in der deutschen Wendung „Das sollst du wissen“ klingt es natürlich.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen leichten Gegensatz beziehungsweise eine Weiterführung gegenüber dem vorangehenden Zusammenhang; „aber“ bewahrt diese Wendung, ohne sie zu stark zu machen.
- source_word: γίνωσκε
  choice: sollst du wissen
  rationale: Der Imperativ Präsens richtet eine nachdrückliche Aufforderung an Timotheus. Die deutsche Konstruktion mit „sollen“ ist idiomatisch und gibt den auffordernden Charakter würdig wieder.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι führt den Inhalt dessen ein, was Timotheus wissen soll. Ein Doppelpunkt gibt diese Funktion im Deutschen natürlicher wieder als ein anschließendes „dass“.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: in den letzten Tagen
  rationale: Die etablierte eschatologische Wendung bleibt eng am griechischen Ausdruck und legt dessen zeitliche Reichweite nicht näher fest.
- source_word: ἐνστήσονται
  choice: werden … kommen
  rationale: Das Futur von ἐνίστημι bezeichnet hier das Eintreten beziehungsweise Gegenwärtigwerden der Zeiten. „werden … kommen“ ist im Deutschen klar und idiomatisch.
- source_word: καιροὶ
  choice: Zeiten
  rationale: καιρός bezeichnet bestimmte Zeitabschnitte oder Zeitlagen. „Zeiten“ passt natürlich zur vorliegenden Aussage, ohne den Begriff unnötig zu präzisieren.
- source_word: χαλεποί
  choice: schwere
  rationale: χαλεπός kann schwierig, hart, gefährlich oder bedrückend bedeuten. „schwere“ ist im modernen Deutsch natürlich und bewahrt die breite Bedeutung; die mögliche Gefährlichkeit wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Bedeutung von „den letzten Tagen“
  choice: Die eschatologische Wendung „in den letzten Tagen“ wird beibehalten, ohne sie ausschließlich auf die unmittelbar vor der Wiederkunft Christi liegende Zeit einzugrenzen.
  alternative: Die Wendung könnte entweder speziell die letzte Phase vor dem Ende oder weiter gefasst die bereits angebrochene endzeitliche Epoche bezeichnen.
  rationale: Der griechische Text entscheidet an dieser Stelle nicht zwischen diesen theologischen Einordnungen. Die Übersetzung bewahrt daher die Spannung und führt kein bestimmtes Endzeitsystem ein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung hebt die Aufforderung hervor; die Lexik bleibt nah am Ausgangstext, ohne unnatürlich zu wirken.
