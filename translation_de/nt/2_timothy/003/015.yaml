source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: de
  text: und dass du von frühester Kindheit an die heiligen Schriften[a] kennst, die dich weise machen können zur Rettung durch den Glauben an den Messias Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „heilige Schriften“; auch: „heilige Texte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: von frühester Kindheit an
  rationale: βρέφος bezeichnet ein sehr junges Kind bis hin zum Säugling. Die Formulierung bewahrt diesen starken zeitlichen Sinn, ohne im Deutschen unnatürlich zu wirken.
- source_word: ἱερὰ γράμματα
  choice: die heiligen Schriften
  rationale: Die Wendung bezeichnet die als heilig geltenden schriftlichen Texte, die Timotheus kannte. „Heilige Schriften“ ist im Deutschen klar und würdevoll; die wörtlichere Nuance „heilige Schriften/Schriftstücke“ wird in der Fußnote offengelegt.
- source_word: οἶδας
  choice: du kennst
  rationale: οἶδα hat trotz seiner Perfektform gegenwärtige Bedeutung. Zusammen mit „von frühester Kindheit an“ bezeichnet es eine seit damals bestehende Vertrautheit.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: die dich weise machen können
  rationale: Das attributive Partizip bezieht sich auf die Schriften; σοφίζω bedeutet hier, Weisheit zu vermitteln beziehungsweise jemanden weise zu machen.
- source_word: εἰς σωτηρίαν
  choice: zur Rettung
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis. „Zur Rettung“ hält diese Zielrichtung knapp und unmittelbar fest.
- source_word: διὰ πίστεως
  choice: durch den Glauben
  rationale: πίστις bezeichnet in dieser Konstruktion am natürlichsten den Glauben beziehungsweise das Vertrauen des Menschen; die mögliche Deutung als Treue wird in der Fußnote bewahrt.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: an den Messias Jesus
  rationale: Bei πίστις gibt ἐν hier den Bezug des Glaubens an. Χριστός wird als bedeutungsvoller Titel mit „Messias“ wiedergegeben.
theological_decisions:
- issue: Χριστός als Titel oder als nameähnliches Element
  choice: der Messias Jesus
  alternative: Christus Jesus
  rationale: Χριστός trägt hier weiterhin seinen Titelsinn. „Messias“ macht diese Bedeutung für heutige Leser unmittelbar sichtbar.
- issue: Bedeutung von πίστεως in διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: durch den Glauben an den Messias Jesus
  alternative: durch die Treue des Messias Jesus
  rationale: Die Konstruktion bezeichnet am wahrscheinlichsten den auf Jesus gerichteten Glauben. Da πίστις jedoch auch „Treue“ bedeuten kann, bleibt diese theologisch relevante, wenn auch weniger wahrscheinliche Möglichkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang mit „und dass“ bleibt erhalten, weil der Vers syntaktisch an den vorausgehenden Zusammenhang anschließt. Die Formulierung folgt eng dem griechischen Gedankengang, ohne unnötig altertümlich zu klingen.
