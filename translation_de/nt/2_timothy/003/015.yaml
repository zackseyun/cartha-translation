  verdict: revise
  source_fidelity: 'Der Haupttext gibt den griechischen Satzbau und Sinn insgesamt zuverlässig wieder: ἀπὸ βρέφους wird mit „von frühester Kindheit an“ angemessen wiedergegeben, οἶδας hat gegenwärtigen Sinn, und die heiligen Schriften sind als diejenigen dargestellt, die weise machen können. „Durch den Glauben an den Messias Jesus“ gibt die wahrscheinlichste und syntaktisch naheliegende Deutung von διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ wieder.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und bewahrt mit „und dass“ sinnvoll den Anschluss an den vorausgehenden Satz. „Zur Rettung“ ist verständlich und zielgerichtet; „Messias Jesus“ ist als bewusste Titelübersetzung gut lesbar.
  terminology: '„Messias Jesus“ bewahrt den Titelsinn von Χριστός. „Heilige Schriften“ ist in diesem Kontext eine etablierte und sachgemäße Wiedergabe von ἱερὰ γράμματα. Die Fußnote zu diesem Ausdruck sollte jedoch nicht „Schriftstücke“ als gleichrangige Alternative anbieten; das wäre im Kontext unnötig verengt und im Deutschen unidiomatisch. Die Fußnote zur angeblichen „Treue des Messias Jesus“ ist durch die vorliegende griechische Konstruktion nicht hinreichend gestützt: τῆς ἐν Χριστῷ Ἰησοῦ beschreibt den Glauben als in Christus Jesus verortet, nicht als Jesu Treue mittels eines Possessivgenitivs.'
  issues:
  - severity: medium
    issue: Die Fußnote b bietet „durch die Treue des Messias Jesus“ als Lesart an.
    rationale: Im griechischen Text steht keine Formulierung wie πίστεως Χριστοῦ („Glaube/Treue Christi“), die eine Debatte über subjektiven oder objektiven Genitiv begründen könnte. Die Präpositionalfügung τῆς ἐν Χριστῷ Ἰησοῦ modifiziert πίστις. Die Fußnote erzeugt daher eine nicht vom Wortlaut getragene Mehrdeutigkeit.
  - severity: low
    issue: Die Fußnote a nennt „heilige Schriftstücke“ als Alternative.
    rationale: γράμματα kann außerhalb dieses Kontextes schriftliche Stücke oder Buchstaben bezeichnen; in der festen, schriftbezogenen Wendung ἱερὰ γράμματα ist „Schriften“ jedoch passend. „Schriftstücke“ wirkt im Deutschen sachlich verengt und ist keine hilfreiche gleichrangige Alternative.
  revised_text: und dass du von frühester Kindheit an die heiligen Schriften[a] kennst, die dich weise machen können zur Rettung durch den Glauben an den Messias Jesus.
  revised_footnotes:
