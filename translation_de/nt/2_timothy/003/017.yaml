base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: de
  text: damit der Mensch Gottes[a] zu jedem guten Werk fähig und ausgerüstet ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mensch Gottes“ steht im Griechischen in der maskulinen Einzahl und ist wahrscheinlich eine bekannte biblische Bezeichnung. Im Zusammenhang kann sie besonders Gottes Diener meinen, lässt sich aber auch weiter auf einen durch die Schrift geprägten Menschen beziehen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „völlig ausgerüstet“. Das griechische Partizip bezeichnet jemanden, der gründlich vorbereitet oder mit allem Nötigen versehen worden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zwecksatz ein, der an Vers 16 anschließt, und gibt die finale Bedeutung im heutigen Deutsch natürlich wieder.
- source_word: ἄρτιος
  choice: vollständig befähigt
  rationale: Bezeichnet hier jemanden, der den Anforderungen gewachsen beziehungsweise für seine Aufgabe tauglich ist. Die Wiedergabe vermeidet das missverständliche „vollkommen“, das im Deutschen moralische Sündlosigkeit nahelegen könnte.
- source_word: ᾖ
  choice: ist
  rationale: Im deutschen mit „damit“ eingeleiteten Zwecksatz ist der Indikativ die natürliche Entsprechung des griechischen Konjunktivs.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: der Mensch Gottes
  rationale: Bewahrt die grammatisch maskuline Singularform und die erkennbare biblische Bezeichnung, ohne sie auf „Mann“ zu verengen. Der Ausdruck kann im Zusammenhang besonders Gottes Diener bezeichnen, ist aber breiter anwendbar.
- source_word: πρὸς πᾶν ἔργον ἀγαθόν
  choice: für jedes gute Werk
  rationale: Gibt die Ausrichtung beziehungsweise Eignung für jede Art guten Handelns knapp und nah am griechischen Ausdruck wieder.
- source_word: ἐξηρτισμένος
  choice: ausgerüstet
  rationale: Das Perfektpartizip beschreibt einen Zustand, der durch gründliche Vorbereitung oder Ausstattung erreicht wurde. „Ausgerüstet“ ist prägnant und idiomatisch; die Vollständigkeit wird bereits durch „vollständig befähigt“ mitgetragen.
theological_decisions:
- issue: Bedeutungsumfang von ὁ τοῦ θεοῦ ἄνθρωπος
  choice: der Mensch Gottes
  alternative: der Mann Gottes; ein Mensch, der Gott gehört
  rationale: Die Formulierung ist im Griechischen maskulin und erinnert an eine feste biblische Bezeichnung, die im unmittelbaren Zusammenhang besonders einen Diener Gottes meinen kann. „Mensch Gottes“ wahrt diese Form und lässt zugleich die mögliche weitere Anwendung offen.
- issue: Verhältnis von ἄρτιος und ἐξηρτισμένος
  choice: vollständig befähigt und … ausgerüstet
  alternative: tüchtig, … völlig ausgerüstet
  rationale: Die beiden eng verwandten Ausdrücke werden unterschieden, ohne eine Aussage über moralische Vollkommenheit einzutragen. Die koordinierte deutsche Formulierung macht den erreichten Zustand verständlich, legt aber keine zusätzliche theologische Stufung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der Struktur des griechischen Zwecksatzes, vermeidet jedoch missverständliches „vollkommen“ und erläutert die traditionelle Bezeichnung „Mensch Gottes“ in einer Fußnote.
