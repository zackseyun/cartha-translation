  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: de
  text: Wie Jannes und Jambres sich Mose widersetzten[a], so widersetzen sich auch diese Männer der Wahrheit – Menschen mit verdorbenem Denken, im Hinblick auf den Glauben unbewährt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mose Widerstand leisteten“ … „der Wahrheit Widerstand leisten“.'
    reason: lexical_alternative
  - marker: b
    text: „Der Glaube“ kann hier besonders den christlichen Glauben beziehungsweise die apostolische Botschaft bezeichnen, nicht nur persönliches Vertrauen.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: Wie
  rationale: Die Wendung leitet einen Vergleich ein. Im Deutschen gibt die paarige Konstruktion „Wie …, so …“ die Entsprechung natürlich wieder; δέ braucht hier als schwacher Übergang keinen eigenen Ausdruck.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Jannes und Jambres
  rationale: Die Eigennamen werden nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: sich widersetzten / widersetzen sich
  rationale: Das Verb bezeichnet aktiven Widerstand. Die gleiche deutsche Wortwahl bewahrt die Parallelität; Präteritum und Präsens bilden die griechischen Zeitformen angemessen ab.
- source_word: Μωϋσεῖ
  choice: Mose
  rationale: Übliche deutsche Namensform; der Dativ ergibt sich aus „sich jemandem widersetzen“.
- source_word: οὕτως καὶ οὗτοι
  choice: so … auch diese Männer
  rationale: Bewahrt die vergleichende Korrelation und macht den im Kontext männlichen Bezug von οὗτοι deutlich.
- source_word: τῇ ἀληθείᾳ
  choice: der Wahrheit
  rationale: Die bestimmte Form bleibt erhalten, ohne den Ausdruck im Haupttext ausdrücklich auf die Evangeliumsbotschaft einzuengen.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: Menschen, deren Denken verdorben ist
  rationale: Der resultative Zustand des Perfektpartizips und der Akkusativ der Hinsicht werden in klarem modernem Deutsch wiedergegeben. „Denken“ erfasst hier die geistige und sittliche Dimension von νοῦς.
- source_word: ἀδόκιμοι
  choice: nicht bewährt
  rationale: Das Wort bezeichnet Menschen, die einer Prüfung nicht standhalten beziehungsweise sich nicht als anerkannt erweisen. „Nicht bewährt“ erhält dieses Prüfmotiv, ohne vorschnell ein endgültiges Verwerfungsurteil auszudrücken.
- source_word: περὶ τὴν πίστιν
  choice: im Blick auf den Glauben
  rationale: περί mit Akkusativ bezeichnet hier den Bezugsbereich. Die Formulierung lässt offen, ob πίστις primär den christlichen Glaubensinhalt oder Glauben im weiteren Sinn meint.
theological_decisions:
- issue: Bezug von „der Wahrheit“ und „dem Glauben“
  choice: Beide Wendungen bleiben im Haupttext weit gefasst.
  alternative: Sie ausdrücklich als Evangelium beziehungsweise apostolische Glaubenslehre paraphrasieren.
  rationale: Der Zusammenhang mit Irrlehrern legt die christliche Botschaft und den überlieferten Glauben nahe; der griechische Wortlaut formuliert jedoch nicht so eng. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von ἀδόκιμοι
  choice: „nicht bewährt“
  alternative: „verworfen“, „untauglich“ oder „disqualifiziert“
  rationale: Die gewählte Formulierung erhält den Gedanken des Nichtbestehens einer Prüfung und vermeidet es, die genaue Art oder Endgültigkeit des Urteils stärker festzulegen als der Ausgangstext.
- issue: Geschlecht des Referenten
  choice: „diese Männer“ für οὗτοι, anschließend stilistisch „Menschen“ für ἄνθρωποι
  alternative: Durchgehend geschlechtsneutral „diese Menschen“ beziehungsweise durchgehend „Männer“
  rationale: Der Kontext bezeichnet konkrete männliche Gegner. „Diese Männer“ macht dies sichtbar; „Menschen“ ist zugleich eine natürliche Wiedergabe von ἄνθρωποι und verändert den Referenten nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Vergleichsstruktur „Wie …, so …“ bewahrt die rhetorische Parallelität. Zwei Hauptsätze vermeiden eine schwerfällige Häufung von Nachträgen; Fach- oder konfessionell geprägte Formulierungen werden vermieden.
