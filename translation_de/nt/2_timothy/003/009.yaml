  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: de
  text: Doch sie werden nicht weiter vorankommen[a]; denn ihre Torheit wird allen offenkundig werden, wie auch die jener Männer offenkundig wurde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keine weiteren Fortschritte machen“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Jannes und Jambres, die im vorhergehenden Vers genannt werden.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: werden … vorankommen
  rationale: προκόπτω bezeichnet ein Voranschreiten oder Fortschreiten. „Vorankommen“ bewahrt das Bild, ohne einen positiven Fortschritt der Irrlehrer anzudeuten.
- source_word: ἐπὶ πλεῖον
  choice: nicht weiter
  rationale: Die Wendung bedeutet „weiter“ oder „in größerem Maß“. Zusammen mit der Verneinung ist „nicht weiter“ natürlich und präzise.
- source_word: ἄνοια
  choice: Unvernunft
  rationale: ἄνοια bezeichnet mangelndes Verständnis, Unverstand oder Torheit. „Unvernunft“ gibt hier die intellektuelle und moralische Dimension in verständlichem Gegenwartsdeutsch wieder.
- source_word: ἔκδηλος
  choice: offensichtlich
  rationale: Das Wort bedeutet „offenkundig“ oder „deutlich erkennbar“. „Offensichtlich“ ist modern und entspricht der Aussage, dass ihr Unverstand öffentlich erkennbar wird.
- source_word: πᾶσιν
  choice: für alle
  rationale: Der Dativ bezeichnet diejenigen, für die etwas erkennbar wird. „Für alle“ bewahrt den umfassenden Geltungsbereich.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: so wie es auch bei jenen Männern der Fall war
  rationale: 'Die griechische Aussage ist elliptisch: Der feminine Artikel verweist auf ἄνοια zurück, und ἐκείνων bezeichnet die zuvor genannten Männer. Die deutsche Formulierung gibt den Vergleich natürlich wieder, ohne die Namen in den Haupttext einzufügen.'
theological_decisions:
- issue: Bezug von ἐκείνων
  choice: „jene Männer“ verweist im unmittelbaren Zusammenhang auf Jannes und Jambres aus Vers 8.
  alternative: Allgemeiner Verweis auf frühere Irrlehrer oder Gegner der Wahrheit.
  rationale: Der direkte Kontext nennt unmittelbar zuvor Jannes und Jambres. Die Übersetzung „jene Männer“ wahrt den anaphorischen Bezug, während die Fußnote ihn erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Argumentation, wird aber idiomatisch formuliert. Die genuine Ellipse im letzten Teilsatz wird natürlich aufgelöst; der unmittelbare Bezug wird in einer Fußnote erläutert.
