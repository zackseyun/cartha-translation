id: 2TI.3.6
reference: 2 Timothy 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: de
  text: Denn zu ihnen gehören jene, die sich in die Häuser einschleichen und schwache Frauen[a] gefangen nehmen[b] – Frauen, die mit Sünden beladen sind und von vielerlei Begierden getrieben werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ist eine abwertende Verkleinerungsform von „Frauen“. Gemeint ist hier eine beeinflussbare Gruppe von Frauen, nicht Frauen allgemein.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in ihre Gewalt bringen“; das griechische Verb gebraucht das Bild des Gefangennehmens.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von Begierden verschiedenster Art fortgerissen werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: zu ihnen gehören
  rationale: Die Wendung bezeichnet Personen, die zu der zuvor beschriebenen Gruppe gehören; die deutsche Formulierung gibt diesen Zusammenhang natürlich wieder.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: die sich in die Häuser einschleichen
  rationale: „Sich einschleichen“ bewahrt den Beiklang eines heimlichen, unlauteren Eindringens. „Häuser“ entspricht dem konkreten Ausdruck οἰκίας, ohne die soziale Dimension des häuslichen Bereichs auszuschließen.
- source_word: αἰχμαλωτίζοντες
  choice: gefangen nehmen
  rationale: Die Formulierung erhält das Bild des Ergreifens und Wegführens von Gefangenen und bezeichnet hier die Unterwerfung unter den Einfluss der beschriebenen Personen.
- source_word: γυναικάρια
  choice: schwache Frauen
  rationale: Das griechische Diminutiv ist abwertend und bezeichnet in diesem Zusammenhang eine besonders beeinflussbare Gruppe von Frauen, nicht Frauen allgemein. „Schwache Frauen“ vermittelt die kontextuelle Verletzlichkeit; die sprachliche Abwertung des griechischen Ausdrucks wird in einer Fußnote offengelegt.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: mit Sünden beladen
  rationale: Das Perfektpartizip beschreibt einen bestehenden Zustand infolge angehäufter Sünden. „Beladen“ wahrt sowohl das Bild der Last als auch den resultativen Sinn.
- source_word: ἀγόμενα
  choice: getrieben werden
  rationale: Das Passiv bezeichnet ein Bestimmt- oder Fortbewegtwerden durch innere Begierden. „Getrieben werden“ ist im Deutschen natürlich und bewahrt die passive Abhängigkeit.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: von vielerlei Begierden
  rationale: „Begierden“ gibt den im Zusammenhang negativen Sinn von ἐπιθυμίαι wieder; „vielerlei“ bewahrt die Vielfalt, die ποικίλαις ausdrückt.
theological_decisions:
- issue: Abwertende Bezeichnung γυναικάρια
  choice: „schwache Frauen“ mit erklärender Fußnote
  alternative: „Frauenfigürchen“, „einfältige Frauen“ oder „leicht beeinflussbare Frauen“
  rationale: Die Wiedergabe soll die abwertende und kontextbezogene Bezeichnung einer anfälligen Gruppe erkennen lassen, ohne daraus eine allgemeine Aussage über Frauen zu machen. Eine rein wörtliche deutsche Verkleinerungsform wäre unnatürlich und könnte körperliche Kleinheit nahelegen.
- issue: Zielbereich von οἰκίας
  choice: „Häuser“
  alternative: „Haushalte“ oder „Häuser und Familien“
  rationale: Der griechische Ausdruck kann im Kontext über das Gebäude hinaus den häuslichen Lebensbereich einschließen. „Häuser“ bleibt quellennah und lässt diese soziale Bedeutung offen, statt sie ausdrücklich festzulegen.
- issue: Bild der Gefangennahme
  choice: „gefangen nehmen“
  alternative: „in ihre Gewalt bringen“
  rationale: Die militärische Gefangenschaftsmetaphorik des Verbs wird bewahrt, ohne genauer festzulegen, welcher Art die daraus folgende Kontrolle ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jene, die“ hält den Satz übersichtlich; der Gedankenstrich verdeutlicht, dass die folgenden Partizipien die Frauen beschreiben. Die scharfe Kritik des Ausgangstextes bleibt erhalten, wird aber nicht zu einer pauschalen Aussage über Frauen ausgeweitet.
