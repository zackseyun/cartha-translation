id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: de
  text: 'Doch das feste Fundament Gottes steht und trägt dieses Siegel[a]: »Der Herr kennt die, die ihm gehören«, und: »Jeder, der den Namen des Herrn nennt[b], wende sich vom Unrecht ab.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und trägt diese Aufschrift«. Das mit »Siegel« übersetzte Wort kann das kennzeichnende Siegel einschließlich seiner Aufschrift bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Namen des Herrn anruft«. Wörtlich steht im Griechischen »den Namen des Herrn nennt«; die Wendung kann das Anrufen des Herrn oder das Bekenntnis der Zugehörigkeit zu ihm ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Doch
  rationale: Kennzeichnet den nachdrücklichen Gegensatz zur vorausgehenden Erörterung der Irrlehre, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: στερεὸς θεμέλιος τοῦ θεοῦ
  choice: das feste Fundament Gottes
  rationale: Bewahrt das Bild eines beständigen, tragfähigen Fundaments und lässt die genaue Beziehung des Genitivs »Gottes« offen.
- source_word: ἕστηκεν
  choice: steht
  rationale: 'Gibt den resultativen Zustandsaspekt des griechischen Perfekts knapp und idiomatisch wieder: Das Fundament steht fest und bleibt bestehen.'
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: trägt dieses Siegel
  rationale: Bewahrt das Bild eines kennzeichnenden und beglaubigenden Siegels; die mögliche Nuance einer Siegelaufschrift wird in der Fußnote genannt.
- source_word: Ἔγνω κύριος
  choice: Der Herr kennt
  rationale: Das Präsens gibt im Zitat die bleibende, zeitübergreifende Kenntnis des Herrn im Deutschen natürlich wieder.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: die, die ihm gehören
  rationale: Drückt die im Griechischen bezeichnete Zugehörigkeit klar aus, ohne sie näher theologisch zu bestimmen.
- source_word: Ἀποστήτω ἀπὸ ἀδικίας
  choice: wende sich vom Unrecht ab
  rationale: Vermittelt den Aufforderungscharakter und die entschiedene Trennung von moralisch Verwerflichem. »Unrecht« bewahrt die breite Bedeutung von ἀδικία und ist im modernen Deutsch natürlicher als »Ungerechtigkeit«.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: Jeder, der den Namen des Herrn nennt
  rationale: Erhält die auffällige Wiederholung von »Name/nennen« und damit die sprachliche Gestalt des Ausgangstextes; die idiomatische Deutung als Anrufung wird in der Fußnote geboten.
theological_decisions:
- issue: Bezug von »der Herr« in den beiden Siegelworten
  choice: Beide Vorkommen werden ohne nähere Festlegung mit »der Herr« wiedergegeben.
  alternative: Beide ausdrücklich auf Gott den Vater oder auf Christus beziehen beziehungsweise zwischen den beiden Vorkommen unterscheiden.
  rationale: κύριος bleibt im griechischen Text ohne ausdrückliche Präzisierung. Die alttestamentliche Zitatformel steht in einem christlichen Zusammenhang; die Übersetzung bewahrt diese mögliche mehrschichtige Bezugnahme.
- issue: Bedeutung des Fundaments Gottes
  choice: Das Bild wird als »Fundament Gottes« übersetzt, ohne dessen konkrete Identität zu erklären.
  alternative: Das Fundament ausdrücklich mit der Gemeinde, der Wahrheit, dem Evangelium oder Gottes Erwählung gleichsetzen.
  rationale: Der Vers selbst identifiziert das Fundament nicht ausdrücklich. Eine Konkretisierung würde eine Auslegung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur und die beiden feierlichen Siegelworte bleiben erkennbar, während »Doch«, »steht«, »gehören« und »vom Unrecht abwenden« für heutige Leser natürlich verständlich sind. Die Fußnotenmarker stehen jeweils unmittelbar an der betreffenden Formulierung.
