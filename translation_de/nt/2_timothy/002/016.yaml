  revision_rationale: Die Revision stellt den Plural der griechischen Nominalgruppe her, beseitigt damit die deutsche Inkongruenz zum folgenden „sie“ und formuliert die Steigerung zu ἀσέβεια idiomatischer. Die knappe, im griechischen Text bestehende Unbestimmtheit des Subjekts von προκόψουσιν bleibt erhalten.
