  source_fidelity: Die Wiedergabe trifft βεβήλους („unheilig/profan“), κενοφωνίας („leere Rede“) und den negativen Fortschrittsgedanken von προκόπτειν grundsätzlich gut. Der griechische Akkusativ steht jedoch im Plural (τὰς … κενοφωνίας), was in der deutschen Fassung mit dem singularischen „Gerede“ und dem folgenden Plural „sie“ unnötig unklar wird. Eine pluralische deutsche Wiedergabe wahrt außerdem die im Griechischen offene Referenz von προκόψουσιν.
  naturalness: „Unheilige, leere Reden“ ist modernes, verständliches Standarddeutsch. „Zu immer größerer Gottlosigkeit fortschreiten“ gibt ἐπὶ πλεῖον ἀσεβείας idiomatisch und mit der beabsichtigten negativen Fortschrittsmetaphorik wieder.
  terminology: „Unheilig“ und „Gottlosigkeit“ bewahren den religiös-moralischen Gehalt von βεβήλους beziehungsweise ἀσεβείας. Sie setzen keine konfessionelle Auslegung voraus.
  issues:
  - severity: medium
    issue: Numerus- und Bezugsproblem zwischen „das … Gerede“ und „sie“
    rationale: Die griechische Nominalgruppe τὰς βεβήλους κενοφωνίας ist pluralisch. Das deutsche Singular-Kollektivum „Gerede“ bietet für das anschließende pluralische „sie“ keinen unmittelbaren grammatischen Bezug und wirkt dadurch unnatürlich. Der Plural „Reden“ bildet den griechischen Numerus ab und lässt den im Ausgangstext nicht ausdrücklich bestimmten Bezug des Verbsubjekts weiterhin offen.
  - severity: low
    issue: „in der Gottlosigkeit voranschreiten“ ist weniger idiomatisch
    rationale: Die Formulierung ist verständlich, doch „zu immer größerer Gottlosigkeit fortschreiten“ gibt die Steigerung von ἐπὶ πλεῖον im Deutschen klarer und natürlicher wieder.
  revised_text: Meide aber unheilige, leere Reden[a]; denn sie werden zu immer größerer Gottlosigkeit fortschreiten.
