source:
  edition: SBLGNT
  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: de
  text: Meide aber unheilige, leere Reden[a]; denn sie werden zu immer größerer Gottlosigkeit fortschreiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gottloses Geschwätz«, »nichtige Redereien« oder »hohle Reden«.'
    reason: Lexikalische Alternativen für βεβήλους κενοφωνίας; sie heben jeweils den unheiligen beziehungsweise inhaltsleeren Charakter unterschiedlich hervor.
lexical_decisions:
- source_word: βεβήλους
  choice: unheilige
  rationale: Das Wort bezeichnet, was nicht heilig beziehungsweise dem Heiligen entgegengesetzt ist. »Unheilig« bewahrt den religiös-moralischen Gehalt, ohne eine konfessionelle Deutung einzutragen.
- source_word: κενοφωνίας
  choice: leere Gerede
  rationale: Der Ausdruck bezeichnet inhalts- oder wertloses Reden. »Leeres Gerede« ist im heutigen Deutsch verständlich und gibt das Bild leerer Rede natürlich wieder.
- source_word: περιΐστασο
  choice: Meide
  rationale: Der mediale Imperativ fordert Timotheus auf, sich davon fernzuhalten. »Meide« ist knapp, idiomatisch und hinreichend bestimmt.
- source_word: ἐπὶ πλεῖον
  choice: immer weiter
  rationale: Die Wendung bezeichnet eine zunehmende Entwicklung. »Immer weiter« verbindet sich natürlich mit »voranschreiten« und wahrt die Steigerung.
- source_word: προκόψουσιν
  choice: werden … voranschreiten
  rationale: Das Verb bezeichnet Fortschreiten; hier wird es bewusst für eine negative geistlich-moralische Entwicklung gebraucht.
- source_word: ἀσεβείας
  choice: Gottlosigkeit
  rationale: »Gottlosigkeit« gibt die fehlende Ehrfurcht vor Gott in klarem modernem Deutsch wieder und bewahrt den religiös-moralischen Ernst.
- source_word: δὲ
  choice: aber
  rationale: »Aber« markiert den Gegensatz zur vorausgehenden Ermahnung.
theological_decisions:
- issue: Ob nur nutzloses Reden oder zugleich religiös-moralisch verwerfliche Rede gemeint ist
  choice: »unheilige, leere Gerede« bewahrt sowohl die Inhaltsleere als auch den Gegensatz zum Heiligen.
  alternative: »leeres Geschwätz« oder »gottloses Gerede«
  rationale: βεβήλους und κενοφωνίας tragen zwei zusammengehörige Bedeutungsaspekte. Die Übersetzung lässt keinen davon weg und vermeidet zugleich, βεβήλους vollständig mit der späteren »Gottlosigkeit« gleichzusetzen.
- issue: Bezug des unausgedrückten Subjekts von προκόψουσιν
  choice: Das griechische Pluralpronomen wird mit »sie« wiedergegeben, ohne den Bezug ausdrücklich festzulegen.
  alternative: »Denn solche Leute werden …« oder »denn solches Reden wird …«
  rationale: Die Verbform ist pluralisch, während der genaue Bezug aus dem Zusammenhang erschlossen werden muss. »Sie« bewahrt diese knappe Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gerede« ist allgemein verständlich, während »unheilig« den religiösen Gegensatz deutlich hält. Die Wortstellung bei »immer weiter … voranschreiten« klingt natürlich und erhält die negative Fortschrittsmetaphorik des griechischen Textes.
