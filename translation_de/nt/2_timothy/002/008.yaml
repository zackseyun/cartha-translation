  to: 'Behalte Jesus, den Messias[a], im Gedächtnis: Er ist von den Toten auferweckt worden und stammt aus dem Geschlecht Davids[b], nach meinem Evangelium.'
  rationale: Die Revision stellt die präpositionale Wendung κατὰ τὸ εὐαγγέλιόν μου mit „nach meinem Evangelium“ quellentreu wieder, verwendet für die davidische Abstammung die klare idiomatische Wendung „aus dem Geschlecht Davids“ und trennt die Fußnotenanker nach ihren jeweiligen griechischen Begriffen. Das deutsche Passiv „ist … auferweckt worden“ wahrt die Aussagekraft von ἐγηγερμένον, ohne einen Handelnden hinzuzufügen.
