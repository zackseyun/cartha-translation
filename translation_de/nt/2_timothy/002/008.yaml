source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: de
  text: 'Behalte Jesus, den Messias[a], im Gedächtnis: Er ist von den Toten auferweckt worden und stammt aus dem Geschlecht Davids[b], nach meinem Evangelium.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“. Das griechische Χριστός kann „Christus“ oder „Messias“ bedeuten; hier wird die Titelfunktion mit „Messias“ wiedergegeben.'
    reason: lexikalische Alternative zu Χριστός
  - marker: b
    text: 'Wörtlich: „aus dem Samen Davids“.'
    reason: lexikalische Alternative zu σπέρμα
lexical_decisions:
- source_word: Μνημόνευε
  choice: Halte dir … vor Augen
  rationale: Der Präsensimperativ fordert zu einem fortdauernden bewussten Erinnern auf. Die Wendung ist im heutigen Deutsch natürlicher und kräftiger als das missverständliche „Erinnere dich an“.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, den Messias
  rationale: Χριστός trägt im Zusammenhang mit der davidischen Abstammung deutlich Titelfunktion. Die Apposition macht diese Bedeutung auf Deutsch verständlich; „Christus“ bleibt als mögliche traditionelle Wiedergabe in der Fußnote genannt.
- source_word: ἐγηγερμένον ἐκ νεκρῶν
  choice: Er ist von den Toten auferweckt worden
  rationale: Das Perfekt Passiv bezeichnet Jesus als den von Gott Auferweckten mit fortdauerndem Ergebnis. Der deutsche Satz wahrt das Passiv und ist klarer als eine gedrängte Partizipialkonstruktion.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: stammt aus der Nachkommenschaft Davids
  rationale: σπέρμα bedeutet wörtlich „Same“, bezeichnet hier aber genealogische Abstammung. „Nachkommenschaft“ bewahrt das Herkunftsbild angemessen und klingt würdig sowie verständlich.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: so lautet mein Evangelium
  rationale: κατά bezeichnet hier die Übereinstimmung mit beziehungsweise den Inhalt von Paulus’ Evangeliumsverkündigung. Die Formulierung verbindet die beiden vorausgehenden Aussagen natürlich mit „mein Evangelium“, ohne ein anderes oder privates Evangelium anzudeuten.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Die Verbindung mit der Abstammung von David hebt den Titel und seine messianische Bedeutung hervor. „Messias“ macht diese Bedeutung unmittelbar sichtbar, während die traditionelle Wiedergabe „Christus“ als echte Alternative in der Fußnote erhalten bleibt.
- issue: Kraft des Perfekt Passiv ἐγηγερμένον
  choice: ist … auferweckt worden
  alternative: ist auferstanden
  rationale: Die passive Form des Griechischen wird bewahrt und das fortdauernde Ergebnis der Auferweckung durch das deutsche Perfekt ausgedrückt, ohne den im Text nur implizierten Handelnden ausdrücklich einzusetzen.
- issue: Bedeutung von „mein Evangelium“
  choice: mein Evangelium
  alternative: das Evangelium, das ich verkündige
  rationale: Der Possessivausdruck wird direkt bewahrt. Die Formulierung wird nicht dahin ausgedeutet, Paulus verkündige ein von der apostolischen Botschaft verschiedenes Evangelium.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt löst die griechischen Partizipialfügungen in einen klaren Hauptsatz auf; der Gedankenstrich bindet die abschließende Wendung natürlich an. Der einzige Fußnotenmarker [a] steht im Haupttext.
