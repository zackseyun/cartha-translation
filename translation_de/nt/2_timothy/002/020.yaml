  source_fidelity: 'Der Text gibt die Gliederung und den Kontrast des griechischen Satzes zuverlässig wieder: μεγάλης οἰκίας als „großes Haus“, σκεύη als „Gefäße“, die Materialgruppen sowie εἰς τιμήν/εἰς ἀτιμίαν als „zur Ehre/zur Unehre“. Das ergänzte „bestimmt“ macht die im Deutschen sonst stark elliptische Zweckbeziehung idiomatisch deutlich, ohne den Sinn unzulässig festzulegen. Das einleitende δέ muss im Deutschen nicht eigens abgebildet werden.'
