  terminology: „Gefäße“ bewahrt die Breite von σκεύη. „Ton“ ist als Materialbezeichnung für ὀστράκινα vertretbar und verständlich. „Ehre/Unehre“ erhält den im Griechischen absichtlich abstrakten Gegensatz und vermeidet eine konfessionell oder funktional einengende Auslegung.
