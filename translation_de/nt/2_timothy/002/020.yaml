source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: de
  text: In einem großen Haus gibt es nicht nur Gefäße aus Gold und Silber, sondern auch solche aus Holz und Ton. Die einen sind zur Ehre bestimmt, die anderen aber zur Unehre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die einen dienen einem ehrenvollen Zweck, die anderen einem unehrenhaften.“ Wörtlicher steht im Griechischen: „die einen zur Ehre, die anderen zur Unehre“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: einem großen Haus
  rationale: Die Wendung bezeichnet ein großes beziehungsweise bedeutendes Haus; „großes Haus“ bewahrt das Bild natürlich und ohne zusätzliche Wertung.
- source_word: σκεύη
  choice: Gefäße
  rationale: „Gefäße“ ist im Haushaltsbild verständlich und bewahrt zugleich die metaphorische Offenheit des griechischen Begriffs besser als engere Wörter wie „Geräte“ oder „Utensilien“.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: aus Gold und Silber
  rationale: Die Adjektive geben das Material an; im Deutschen ist die Formulierung mit „aus“ natürlich und eindeutig.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: solche aus Holz und Ton
  rationale: ὀστράκινος bezeichnet aus gebranntem Ton hergestellte Gegenstände. „Ton“ ist präzise und allgemein verständlich; „solche“ vermeidet eine schwerfällige Wiederholung von „Gefäße“.
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: Die einen ... die anderen aber ...
  rationale: Diese deutsche Korrelativkonstruktion gibt den Gegensatz von μέν und δέ klar und idiomatisch wieder.
- source_word: εἰς τιμήν
  choice: zur Ehre bestimmt
  rationale: „Zur Ehre“ bewahrt das abstrakte Substantiv τιμή und damit die Spannung zwischen Ansehen und Verwendungszweck; „bestimmt“ macht die Zielrichtung von εἰς im Deutschen verständlich.
- source_word: εἰς ἀτιμίαν
  choice: zur Unehre
  rationale: „Zur Unehre“ hält den ausdrücklichen Gegensatz zu „zur Ehre“ aufrecht und vermeidet die interpretierende Verengung auf gewöhnlichen oder unehrenhaften Gebrauch.
- source_word: δὲ (initial)
  choice: nicht eigens wiedergegeben
  rationale: Das einleitende δέ markiert hier einen leichten Übergang. Ein deutsches „aber“ oder „nun“ am Versanfang würde den Gegensatz beziehungsweise die zeitliche Nuance stärker markieren, als es der Zusammenhang verlangt.
theological_decisions:
- issue: Ob τιμή/ἀτιμία funktional als ehrenvoller/unehrenhafter Gebrauch oder wörtlicher als Ehre/Unehre wiederzugeben ist
  choice: „zur Ehre ... zur Unehre“ im Haupttext
  alternative: „zu ehrenvollem Gebrauch ... zu unehrenhaftem Gebrauch“
  rationale: Die abstrakten griechischen Substantive werden beibehalten, sodass die rhetorische und theologische Spannung zum folgenden Vers nicht vorschnell auf bloße Haushaltsfunktionen reduziert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Haushaltsbild bleibt anschaulich; die Formulierung „zur Ehre ... zur Unehre“ bewahrt bewusst die Mehrdeutigkeit zwischen Status und Verwendungszweck.
