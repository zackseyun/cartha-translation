  terminology: „Fesseln“ und „gefesselt“ bewahren die beabsichtigte bildliche Verbindung von δεσμῶν und δέδεται. „Das Wort Gottes“ ist angemessen weit und legt den Referenten nicht unzulässig fest. Die unterschiedlichen Alternativen zu ἐν ᾧ und κακοῦργος sollten getrennt und an der jeweiligen Stelle verankert werden.
