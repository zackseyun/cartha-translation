  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: de
  text: für das[a] ich leide, bis hin zu Fesseln – als Verbrecher[b]. Aber das Wort Gottes ist nicht gefesselt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dem“ oder „dessentwegen“. Gemeint ist wahrscheinlich das in Vers 8 erwähnte Evangelium.'
    reason: Alternative Wiedergabe und möglicher Bezug von ἐν ᾧ.
  - marker: b
    text: 'Oder: „als Übeltäter“.'
    reason: Lexikalische Alternative zu κακοῦργος.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: für das
  rationale: Die Relativverbindung bezieht sich wahrscheinlich auf das in Vers 8 genannte Evangelium und bezeichnet hier idiomatisch den Grund des Leidens. „Für das“ ist natürlich und wahrt den Rückbezug.
- source_word: κακοπαθῶ
  choice: ich Leid ertrage
  rationale: Das Verb bezeichnet das Erleiden von Mühsal oder Bedrängnis. Die Formulierung gibt den andauernden Charakter des Präsens würdig und verständlich wieder.
- source_word: μέχρι δεσμῶν
  choice: bis hin zu Fesseln
  rationale: μέχρι bezeichnet das erreichte Ausmaß; δεσμά meint wörtlich Fesseln und kann metonymisch Haft bezeichnen. Das konkrete Bild bleibt erhalten.
- source_word: ὡς κακοῦργος
  choice: wie ein Verbrecher
  rationale: κακοῦργος bezeichnet einen Übeltäter beziehungsweise Straftäter. Im Zusammenhang von Fesseln und Haft ist „Verbrecher“ die klare gegenwärtige Entsprechung; die lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: ἀλλὰ
  choice: Aber
  rationale: Die Konjunktion setzt der Gefangenschaft des Paulus nachdrücklich die Ungebundenheit des Wortes Gottes entgegen.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Diese Wiedergabe bewahrt die Breite von λόγος und legt nicht fest, ob speziell die Evangeliumsbotschaft, die Verkündigung oder Gottes Wort allgemeiner gemeint ist.
- source_word: οὐ δέδεται
  choice: ist nicht gefesselt
  rationale: Das Perfekt Passiv bezeichnet einen bestehenden Zustand. „Ist nicht gefesselt“ bewahrt den bildhaften und pointierten Gegensatz zu den Fesseln des Paulus.
theological_decisions:
- issue: Bedeutungsumfang von „das Wort Gottes“
  choice: das Wort Gottes
  alternative: die Botschaft des Evangeliums; die Schrift
  rationale: Der unmittelbare Zusammenhang weist besonders auf das verkündigte Evangelium, doch die griechische Wendung ist weiter. Die Übersetzung wahrt diese Offenheit.
- issue: Bezug und Funktion von ἐν ᾧ
  choice: 'kausal auf das Evangelium bezogen: „für das“'
  alternative: 'sphärisch: „in dem“; ausdrücklich kausal: „dessentwegen“'
  rationale: Der wahrscheinlichste Bezug ist das Evangelium aus Vers 8. Die griechische Präposition kann dabei Sphäre oder Ursache anklingen lassen; die Fußnote hält diese Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Fesselmotivs verbindet die Gefangenschaft des Paulus pointiert mit der Aussage, dass Gottes Wort nicht gefesselt ist.
