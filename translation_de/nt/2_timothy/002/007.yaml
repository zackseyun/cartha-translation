- from: Denk über das nach, was ich sage[a]; denn der Herr[b] wird dir in allem Verständnis geben.
  to: Denk über das nach, was ich sage[a]; denn der Herr[b] wird dir in allen Dingen Verständnis geben.
  rationale: Die Übersetzung bleibt eng am griechischen Wortlaut, verbessert aber die deutsche Satzfügung, damit „in allen Dingen“ klar die Reichweite des geschenkten Verständnisses bezeichnet. Die Fußnote zu „der Herr“ wird lediglich idiomatischer gefasst und wahrt ausdrücklich die textliche Offenheit.
