  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: de
  text: Denk über das nach, was ich sage[a]; denn der Herr[b] wird dir in allen Dingen Verständnis geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verstehe, was ich sage.“ Das Verb kann sowohl das Nachdenken als auch das Verstehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen wird „der Herr“ nicht näher bestimmt. Gemeint sein kann speziell der Herr Jesus oder allgemeiner Gott.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Denk über … nach
  rationale: Der Präsensimperativ fordert Timotheus zu fortgesetztem, aktivem Nachdenken auf. Die Formulierung ist im modernen Deutsch natürlich und lässt zugleich die mögliche Bedeutungsnuance „verstehen“ erkennen, die in der Fußnote genannt wird.
- source_word: ὃ
  choice: was
  rationale: Das substantivisch gebrauchte Relativpronomen bezeichnet den Inhalt des Gesagten; „was“ ist dafür die natürliche deutsche Entsprechung.
- source_word: λέγω
  choice: ich sage
  rationale: Das Präsens verweist auf die unmittelbar vorangehende bzw. gegenwärtige Unterweisung des Paulus. „Ich sage“ ist im Deutschen idiomatisch und prägnant.
- source_word: δώσει
  choice: wird … geben
  rationale: Das Futur formuliert eine Zusage. „Wird geben“ bildet δίδωμι schlicht und unmittelbar ab.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ kennzeichnet die folgende Aussage als Begründung für die Aufforderung zum Nachdenken.
- source_word: σοι
  choice: dir
  rationale: Der Dativ bezeichnet den Empfänger der Gabe und wird direkt mit „dir“ wiedergegeben.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die Wiedergabe bewahrt die Bezeichnung des griechischen Textes, ohne den nicht ausdrücklich genannten Referenten enger als Gott oder Jesus Christus zu bestimmen.
- source_word: σύνεσιν
  choice: Verständnis
  rationale: „Verständnis“ bezeichnet hier die von dem Herrn geschenkte Fähigkeit, den Sinn zu erfassen, und entspricht dem breiten Bedeutungsumfang von σύνεσις.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die Formulierung bewahrt den umfassenden Charakter des Ausdrucks, ohne ihn auf bestimmte Lehrfragen einzuengen.
theological_decisions:
- issue: Referent von „der Herr“ (ὁ κύριος)
  choice: „der Herr“ ohne nähere Bestimmung
  alternative: „der Herr Jesus“ oder „Gott“
  rationale: Der griechische Wortlaut nennt nur „den Herrn“. Auch wenn der Ausdruck im paulinischen Sprachgebrauch häufig Jesus bezeichnet, soll die Übersetzung die hier verbleibende Offenheit nicht auflösen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Aufforderung „Denk … nach“ ist direkt und verständlich; „denn“ bewahrt den begründenden Zusammenhang. Die beiden Fußnoten folgen in der Reihenfolge ihrer Marker im Haupttext.
