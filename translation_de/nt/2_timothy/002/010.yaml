id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: de
  text: Darum ertrage ich alles um der Erwählten[a] willen, damit auch sie das Heil erlangen, das im Messias Jesus[b] ist, zusammen mit ewiger Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Auserwählten“. Das griechische Wort lautet ἐκλεκτούς.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: „Christus Jesus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Die Wendung verweist begründend auf den vorausgehenden Zusammenhang. „Darum“ ist knapp, natürlich und bewahrt den kausal-folgernden Bezug.
- source_word: πάντα ὑπομένω
  choice: ertrage ich alles
  rationale: ὑπομένω bezeichnet standhaftes Ausharren unter Belastungen; „ertragen“ gibt dies hier natürlich wieder. πάντα hat umfassenden Sinn und wird mit „alles“ bewahrt.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: um der Erwählten willen
  rationale: διά mit Akkusativ bezeichnet hier den Zweck beziehungsweise das Handeln zugunsten anderer. „Um … willen“ bewahrt diesen Sinn und gibt ἐκλεκτούς substantivisch als „die Erwählten“ wieder.
- source_word: ἵνα καὶ αὐτοὶ
  choice: damit auch sie
  rationale: ἵνα leitet den Zweck ein; καί hat additiven Sinn, während αὐτοί die betreffenden Personen hervorhebt. Die natürliche deutsche Wortfolge bewahrt diese Aussage.
- source_word: σωτηρίας τύχωσιν
  choice: das Heil erlangen
  rationale: τυγχάνω mit Genitiv bedeutet „erlangen“ oder „teilhaftig werden“. „Das Heil erlangen“ ist idiomatisch, würdig und lässt die Aussage über Gottes Erwählung und menschliches Erlangen unaufgelöst nebeneinanderstehen.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: das im Messias Jesus ist
  rationale: Der Artikel mit der Präpositionalphrase bestimmt σωτηρία näher. „Im Messias Jesus“ wahrt sowohl den Titelgehalt von Χριστός als auch die paulinische In-Christus-Sprache.
- source_word: μετὰ δόξης αἰωνίου
  choice: zusammen mit ewiger Herrlichkeit
  rationale: μετά mit Genitiv drückt Begleitung aus. „Zusammen mit“ macht deutlich, dass die ewige Herrlichkeit das Heil begleitet, ohne die syntaktische Zuordnung dogmatisch weiter auszudeuten.
theological_decisions:
- issue: Wiedergabe von ἐκλεκτούς
  choice: die Erwählten
  alternative: die Auserwählten; die Erwählten/Erwählten
  rationale: „Die Erwählten“ gibt den Wahlgedanken des griechischen Ausdrucks direkt wieder, ohne eine bestimmte Lehre über Ursprung, Zeitpunkt oder Bedingungen der Erwählung einzutragen. „Auserwählten“ wäre ebenfalls möglich, ist aber im Deutschen stärker traditionell-theologisch geprägt.
- issue: Wiedergabe von Χριστῷ als Titel
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Χριστός trägt hier weiterhin den Titelgehalt „Messias“. Die Übersetzung macht diesen Gehalt sichtbar; die traditionelle Form „Christus Jesus“ wird als Alternative ausgewiesen.
- issue: Bezug von μετὰ δόξης αἰωνίου
  choice: Das Heil wird als von ewiger Herrlichkeit begleitet dargestellt.
  alternative: Die Präpositionalphrase könnte beim linearen Lesen enger an „Messias Jesus“ angeschlossen erscheinen.
  rationale: Semantisch und syntaktisch liegt es am nächsten, „mit ewiger Herrlichkeit“ auf das Erlangen des in Messias Jesus befindlichen Heils zu beziehen. Die Formulierung wahrt jedoch die kompakte griechische Struktur und vermeidet eine ausführende Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch „zusammen mit“ am Schluss lesbarer. Theologisch gewichtige Begriffe werden nicht paraphrasierend abgeschwächt; echte Spannungen zwischen Erwählung, Leiden und dem Erlangen des Heils bleiben bestehen.
