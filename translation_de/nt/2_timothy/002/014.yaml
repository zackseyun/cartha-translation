id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: de
  text: Erinnere sie immer wieder an diese Dinge und schärfe ihnen vor dem Herrn[a] eindringlich ein, nicht um Worte zu streiten, denn das ist zu nichts nütze[b] und führt zum Verderben der Zuhörenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vor dem Herrn“ bezeichnet den Herrn als Zeugen, ohne ausdrücklich festzulegen, ob hier besonders der Herr Jesus oder allgemeiner Gott gemeint ist.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „ist zu nichts nütze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: diese Dinge
  rationale: Der substantivierte neutrale Plural verweist auf die vorausgehenden Aussagen zurück und bleibt in seiner Mehrzahl erhalten.
- source_word: ὑπομίμνῃσκε
  choice: Erinnere sie immer wieder
  rationale: Der Präsensimperativ legt eine fortgesetzte oder wiederholte Handlung nahe; „immer wieder“ gibt dies in natürlichem Deutsch wieder. Das Objekt „sie“ ist aus dem Zusammenhang ergänzt.
- source_word: διαμαρτυρόμενος
  choice: schärfe ihnen … eindringlich ein
  rationale: Das Partizip bezeichnet ein ernstes, nachdrückliches Einschärfen oder feierliches Beschwören. Die gewählte Formulierung wahrt die Stärke und klingt im pastoralen Zusammenhang natürlich.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: vor dem Herrn
  rationale: Die feste Wendung bezeichnet das Handeln in der Gegenwart und unter der Zeugenschaft des Herrn; die knappe Form wahrt die Offenheit des Titels κύριος.
- source_word: μὴ λογομαχεῖν
  choice: nicht um Worte zu streiten
  rationale: Das Verb bezeichnet einen Wortstreit beziehungsweise ein Streiten über Wörter; die Übersetzung ist verständlich und bewahrt den abwertenden Sinn.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: Das nützt nichts
  rationale: Die Wendung verneint jeden Nutzen. Ein eigener kurzer Satz gibt die Wertung idiomatisch wieder, ohne sie abzuschwächen.
- source_word: ἐπὶ καταστροφῇ
  choice: führt zum Verderben
  rationale: Die Präpositionalwendung benennt die schädliche Folge des Wortstreits. „Verderben“ erhält die starke Bedeutung von καταστροφή, ohne eine spezifische Art des Schadens festzulegen.
- source_word: τῶν ἀκουόντων
  choice: der Zuhörenden
  rationale: Das substantivierte Präsenspartizip bezeichnet die Personen, die dem Streit zuhören. „Zuhörenden“ bildet den laufenden Vorgang knapp und inklusiv ab.
theological_decisions:
- issue: Bezug von κύριος
  choice: der Herr
  alternative: Gott; der Herr Jesus
  rationale: Der griechische Text nennt nur „den Herrn“. Obwohl κύριος in den Pastoralbriefen häufig Jesus bezeichnet, legt der Vers den Bezug nicht ausdrücklich fest; der Titel bleibt deshalb unaufgelöst.
- issue: Art des Verderbens der Zuhörenden
  choice: Verderben
  alternative: Zerrüttung; Untergang
  rationale: καταστροφή ist stark, bestimmt jedoch nicht ausdrücklich, ob vor allem geistiger, moralischer oder anderer Schaden gemeint ist. „Verderben“ bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Aufforderung wird klar und mündlich verständlich formuliert; „Wortstreit“ als mögliches Fachwort wird zugunsten der natürlichen Wendung „um Worte streiten“ vermieden. Die Satzteilung macht Nutzenlosigkeit und schädliche Folge deutlich, ohne die Aussage inhaltlich zu erweitern.
