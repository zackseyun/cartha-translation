  text: καὶ ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: de
  text: Und was sie sagen[a], wird wie Wundbrand um sich greifen.[b] Zu ihnen gehören Hymenäus und Philetus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: ihr Wort; auch ihre Rede oder ihre Botschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung bedeutet wörtlicher: wird Raum gewinnen beziehungsweise seinen Lauf nehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος αὐτῶν
  choice: was sie sagen
  rationale: λόγος bezeichnet hier im Zusammenhang mit dem Gerede und der Irrlehre der vorhergehenden und folgenden Verse ihre Äußerungen beziehungsweise Rede. Die Formulierung ist natürliches modernes Deutsch und legt nicht vorschnell fest, ob eine einzelne Aussage oder ihre gesamte Botschaft gemeint ist.
- source_word: ὡς γάγγραινα
  choice: wie Wundbrand
  rationale: γάγγραινα bezeichnet Wundbrand (Gangrän). „Wundbrand“ bewahrt das konkrete Krankheitsbild und ist allgemein verständlicher als der medizinische Fachausdruck „Gangrän“; „Krebs“ wäre weniger genau.
- source_word: νομὴν ἕξει
  choice: wird … um sich greifen
  rationale: Die griechische Wendung beschreibt bildhaft, dass etwas Raum gewinnt beziehungsweise sich ausbreitet. In Verbindung mit Wundbrand gibt „um sich greifen“ die fortschreitende und zerstörerische Wirkung idiomatisch wieder.
- source_word: ὧν ἐστιν
  choice: Zu ihnen gehören
  rationale: Die relative Wendung nennt Hymenäus und Philetus als Angehörige beziehungsweise Beispiele der zuvor angesprochenen Gruppe.
- source_word: Ὑμέναιος
  choice: Hymenäus
  rationale: Im Deutschen etablierte Transliteration des Personennamens.
- source_word: Φίλητος
  choice: Philetus
  rationale: Im Deutschen etablierte Transliteration des Personennamens.
theological_decisions:
- issue: Bildhafte Wirkung der Krankheit
  choice: Die Rede der Irrlehrer greift zerstörerisch um sich.
  alternative: Die Wendung möglichst wörtlich als „wird Weide/Raum haben“ wiederzugeben.
  rationale: Die Übersetzung erhält das Krankheitsbild und seine Warnung vor fortschreitender Schädigung, ohne die Art oder das Ausmaß der Wirkung über den griechischen Text hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Was sie sagen“ ist verständlich und kontextgerecht; „Wundbrand“ hält das drastische medizinische Bild fest. Die idiomatische Wendung „um sich greifen“ vermittelt die Ausbreitung, ohne die Metapher unnötig auszudeuten.
