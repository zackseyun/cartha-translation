source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: de
  text: Doch fliehe die jugendlichen Begierden[a] und strebe nach Gerechtigkeit[b], Glauben[c], Liebe und Frieden – gemeinsam mit denen, die den Herrn aus reinem Herzen anrufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leidenschaften der Jugend“. Der griechische Ausdruck meint allgemein Begierden, die für die Jugend kennzeichnend sein können, nicht nur sexuelles Verlangen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann sowohl moralische Rechtschaffenheit als auch gerechtes Handeln bezeichnen.
    reason: semantic_range
  - marker: c
    text: 'Oder: „Treue“. Das griechische Wort kann je nach Zusammenhang Glauben, Vertrauen oder Treue bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: die Begierden der Jugend
  rationale: Die Wendung bezeichnet Begierden oder starke Wünsche, die für die Jugend kennzeichnend sein können, ohne sie auf sexuelles Begehren zu beschränken.
- source_word: φεῦγε
  choice: fliehe
  rationale: Der Imperativ bewahrt die eindringliche Bildsprache und bezeichnet entschiedenes, fortgesetztes Meiden.
- source_word: δίωκε
  choice: strebe nach
  rationale: Im ethischen Zusammenhang bezeichnet das Verb ein aktives, anhaltendes Verfolgen eines Ziels; „strebe nach“ ist im modernen Deutschen natürlich und wahrt den Gegensatz zu „fliehe“.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die natürliche deutsche Wiedergabe und kann sowohl moralische Rechtschaffenheit als auch gerechtes Verhalten umfassen.
- source_word: πίστιν
  choice: Glauben
  rationale: „Glauben“ wahrt die übliche Bedeutung von πίστις; in der Tugendreihe bleibt zugleich die Nuance der Treue möglich und wird in einer Fußnote genannt.
- source_word: ἀγάπην
  choice: Liebe
  rationale: Die direkte und im neutestamentlichen Sprachgebrauch etablierte Entsprechung.
- source_word: εἰρήνην
  choice: Frieden
  rationale: Die direkte und kontextgemäße Wiedergabe innerhalb der Tugendreihe.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: gemeinsam mit denen, die den Herrn … anrufen
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft oder Verbindung; „gemeinsam mit“ macht deutlich, dass das Streben zusammen mit anderen geschieht.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: aus reinem Herzen
  rationale: Die Formulierung wahrt ἐκ als Angabe des inneren Ursprungs und klingt im Deutschen natürlich.
theological_decisions:
- issue: Umfang der „Begierden der Jugend“
  choice: Breite, für die Jugend kennzeichnende Begierden, nicht ausschließlich sexuelles Verlangen
  alternative: Vor allem sexuelle Leidenschaften
  rationale: Der griechische Ausdruck ist nicht auf Sexualität eingegrenzt; der weitere Zusammenhang betrifft umfassend Charakter und Lebensführung.
- issue: Bedeutung von πίστις in der Tugendreihe
  choice: Glauben im Haupttext
  alternative: Treue oder Vertrauenswürdigkeit
  rationale: „Glauben“ ist die übliche Wiedergabe, doch die ethische Tugendreihe lässt auch „Treue“ als plausible Nuance zu; diese bleibt in der Fußnote sichtbar.
- issue: Bezug von „gemeinsam mit denen“
  choice: Das Streben geschieht in Gemeinschaft mit Menschen, die den Herrn aus reinem Herzen anrufen
  alternative: Nur der Frieden soll gemeinsam mit ihnen angestrebt werden
  rationale: Die Stellung am Satzende kann syntaktisch näher bei „Frieden“ erscheinen, doch μετά kann die gesamte Aufforderung zum Streben begleiten. Die deutsche Formulierung bewahrt diesen weiten Bezug, ohne ihn dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Imperative „fliehe“ und „strebe“ erhalten den energischen Gegensatz des griechischen Textes. Der Gedankenstrich gliedert den langen Satz, ohne seinen syntaktischen Zusammenhang aufzulösen.
