  source_fidelity: Die Übersetzung gibt Bedingung und Folgerung (ἐὰν οὖν), den reflexiven Reinigungsvorgang, das Gefäßbild, die Partizipien und die Ausrichtung auf jedes gute Werk zuverlässig wieder. „Herr des Hauses“ legt jedoch das im Kontext vorhandene Hausbild stärker im Wortlaut aus als τῷ δεσπότῃ selbst; „seinem Herrn“ gibt die Besitz- und Autoritätsrelation des griechischen Dativs wieder, ohne die Metapher zusätzlich zu erläutern.
  naturalness: Der Satz ist modernes, würdevolles Standarddeutsch und bewahrt die knappe, bildhafte Reihung des Griechischen. „Dem Herrn des Hauses nützlich“ ist verständlich, aber „seinem Herrn nützlich“ ist ebenso idiomatisch und textnäher.
  terminology: „Gefäß“, „zur Ehre“, „geheiligt“ und „zu jedem guten Werk bereit“ sind angemessen. Die Fußnotenalternative „für Gott ausgesondert“ fügt Gott ausdrücklich ein, obwohl der Vers ihn nicht nennt; „ausgesondert“ ist die sichere lexikalische Alternative zu „geheiligt“.
