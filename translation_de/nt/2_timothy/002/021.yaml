id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: de
  text: Wenn sich nun jemand von diesen Dingen reinigt, wird er ein Gefäß zur Ehre[a] sein, geheiligt[b], seinem Herrn nützlich und zu jedem guten Werk bereit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu ehrenvollem Gebrauch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ausgesondert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Wenn … nun
  rationale: „Wenn“ bewahrt die Bedingung, „nun“ den folgernden Anschluss an den vorangehenden Zusammenhang.
- source_word: τις
  choice: jemand
  rationale: Das indefinite Pronomen ist allgemein und bezeichnet jede beliebige Person.
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: sich … von diesen Dingen reinigt
  rationale: Die Formulierung wahrt den reflexiven Vorgang und den Rückverweis von τούτων, ohne dessen Bezug vorschnell auf Personen oder Handlungen festzulegen.
- source_word: σκεῦος
  choice: Gefäß
  rationale: „Gefäß“ erhält das Bild vom großen Haus und seinen unterschiedlichen Haushaltsgegenständen aus Vers 20.
- source_word: εἰς τιμήν
  choice: zur Ehre
  rationale: Die knappe Wendung bildet den Gegensatz zu ἀτιμία in Vers 20 ab und lässt sowohl den ehrbaren Status als auch den ehrenvollen Gebrauch anklingen.
- source_word: ἡγιασμένον
  choice: geheiligt
  rationale: Das Partizip bezeichnet einen durch Heiligung entstandenen und fortbestehenden Zustand; „geheiligt“ wahrt den theologischen und passiven Gehalt.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: dem Herrn des Hauses nützlich
  rationale: „Herr des Hauses“ macht die Autoritätsbeziehung des δεσπότης innerhalb des Haushaltsbildes natürlich verständlich, ohne den göttlichen Bezug auszuschließen.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: zu jedem guten Werk bereit
  rationale: Die Formulierung gibt die umfassende Reichweite von πᾶν und den Zustand des Vorbereitetseins klar und idiomatisch wieder.
theological_decisions:
- issue: Bezug von ἀπὸ τούτων
  choice: von diesen Dingen
  alternative: von diesen Menschen
  rationale: Der griechische Genitiv Plural kann im Zusammenhang auf das zuvor Genannte verweisen, ohne ausdrücklich zwischen Personen, Lehren oder unehrenhaften Dingen zu entscheiden. Die neutrale Wiedergabe erhält diese Offenheit.
- issue: Bedeutung von εἰς τιμήν
  choice: zur Ehre
  alternative: zu ehrenvollem Gebrauch
  rationale: Die wörtlichere Fassung bewahrt die Spannung zwischen ehrenvollem Status und ehrenvoller Verwendung im Gefäßbild; die stärker deutende Lesart steht in der Fußnote.
- issue: Wiedergabe von ἡγιασμένον
  choice: geheiligt
  alternative: für Gott ausgesondert
  rationale: „Geheiligt“ wahrt sowohl die Heiligkeitsvorstellung als auch den passiven Ergebniszustand, ohne die Bedeutung ausschließlich als funktionale Aussonderung zu erklären.
- issue: Identität des δεσπότης
  choice: Herr des Hauses
  alternative: Gebieter
  rationale: Im Haushaltsbild ist ein Hausherr gemeint, dessen letztlicher Bezug auf Gott beziehungsweise den Herrn naheliegt. Die Übersetzung wahrt das Bild, ohne die Referenz dogmatisch enger festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bildsprache „Gefäß“ und der theologische Ausdruck „geheiligt“ bleiben erhalten; „Herr des Hauses“ verdeutlicht zugleich den unmittelbaren metaphorischen Zusammenhang.
