lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: mit Sanftmut
  rationale: Die Präpositionalphrase bezeichnet die Art und Weise. „Sanftmut“ ist würdevoll und bewahrt die Bedeutung einer milden, beherrschten Haltung, ohne Schwäche anzudeuten.
- source_word: παιδεύοντα
  choice: zurechtweisen
  rationale: Im Zusammenhang geht es um korrigierende Unterweisung von Menschen, die Widerstand leisten, nicht vorrangig um Bestrafung oder Disziplinierung.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: die, die sich ihm widersetzen
  rationale: Das Partizip bezeichnet Personen, die sich in Opposition stellen. „ihm“ wird aus dem vorangehenden Bezug auf den Diener des Herrn ergänzt und in einer Fußnote als kontextuelle Verdeutlichung kenntlich gemacht.
- source_word: μήποτε
  choice: vielleicht
  rationale: Mit dem Aorist Konjunktiv drückt μήποτε hier eine vorsichtige Möglichkeit aus. „Vielleicht“ bewahrt die Ungewissheit, ohne die Aussage zu einem bloßen Wunsch oder einer sicheren Folge zu machen.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: schenkt Gott ihnen
  rationale: δίδωμι bezeichnet hier idiomatisch ein Gewähren oder Schenken. Die deutsche Wortstellung stellt Gott wie im Griechischen eindeutig als Handelnden dar.
- source_word: μετάνοιαν
  choice: Umkehr
  rationale: „Umkehr“ gibt μετάνοια als grundlegende innere Neuausrichtung wieder und vermeidet eine Verengung auf bloße Reue oder eine rein intellektuelle Meinungsänderung.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: die zur Erkenntnis der Wahrheit führt
  rationale: εἰς bezeichnet Ziel oder Ergebnis. Die Formulierung macht die Bewegung hin zur vollen Anerkennung der Wahrheit in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Göttliches Handeln und menschliche Umkehr
  choice: Gott bleibt ausdrücklich derjenige, der Umkehr schenken kann; „vielleicht“ bewahrt zugleich die vorsichtige, nicht systematisierende Aussage des Satzes.
  alternative: Eine deterministische Wiedergabe oder eine Formulierung, die Gottes Handeln auf menschliche Selbstkorrektur reduziert.
  rationale: Der griechische Text schreibt Gott das Schenken der Umkehr zu, erklärt aber nicht abschließend, wie sich dieses Handeln zur menschlichen Verantwortung verhält. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Der Vers bleibt als syntaktische Fortsetzung des vorangehenden Satzes kleingeschrieben; die zweite Satzhälfte wird zur besseren Lesbarkeit als eigenständiger Satz wiedergegeben.
