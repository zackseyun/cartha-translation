  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: de
  text: Doch weise törichte und unkundige Streitfragen[a] zurück, denn du weißt, dass sie Streit hervorbringen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Fragen“, „Untersuchungen“ oder „Auseinandersetzungen“; das griechische Wort kann auch eine ernsthafte Untersuchung bezeichnen, meint hier aber wahrscheinlich streitsüchtige Debatten.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „zeugen“ oder „gebären“; das Bild beschreibt, dass solche Streitfragen Streit verursachen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: törichte
  rationale: „Töricht“ gibt den Mangel an Einsicht wieder, ohne unnötig beleidigend oder umgangssprachlich zu klingen.
- source_word: ἀπαιδεύτους
  choice: ungebildete
  rationale: Das Adjektiv bezeichnet etwas Ununterrichtetes beziehungsweise nicht durch Schulung Geprägtes. Die bewusst ungewöhnliche Verbindung mit „Streitfragen“ bewahrt die Ausdrucksweise des griechischen Textes.
- source_word: ζητήσεις
  choice: Streitfragen
  rationale: Das Wort kann Fragen oder Untersuchungen bezeichnen, meint im Zusammenhang jedoch Auseinandersetzungen, die nicht auf ehrliche Erkenntnis, sondern auf Streit hinauslaufen.
- source_word: παραιτοῦ
  choice: weise … zurück
  rationale: Der Imperativ fordert dazu auf, solche Auseinandersetzungen abzulehnen und sich nicht auf sie einzulassen.
- source_word: εἰδὼς
  choice: du weißt ja
  rationale: Die finite deutsche Wendung gibt das begründende Partizip natürlich wieder und macht deutlich, dass die folgende Einsicht den Befehl stützt.
- source_word: γεννῶσι
  choice: hervorbringen
  rationale: „Hervorbringen“ vermittelt die ursächliche Bedeutung und lässt zugleich etwas von der griechischen Zeugungs- beziehungsweise Geburtsmetapher erkennen.
- source_word: μάχας
  choice: Streit
  rationale: Im Zusammenhang geht es um verbale und zwischenmenschliche Auseinandersetzungen, nicht vorrangig um körperliche Kämpfe.
- source_word: δὲ
  choice: Doch
  rationale: „Doch“ kennzeichnet den milden Gegensatz zur vorhergehenden Aufforderung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung „ungebildete Streitfragen“ bewahrt die Spannung der griechischen Beschreibung; „du weißt ja“ macht den begründenden Zusammenhang idiomatisch deutlich.
