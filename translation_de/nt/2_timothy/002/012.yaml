source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: de
  text: Wenn wir standhaft bleiben, werden wir auch mit ihm herrschen; wenn wir ihn verleugnen[a], wird auch er uns verleugnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »uns von ihm lossagen« / »wird auch er sich von uns lossagen«.'
    reason: Lexikalische Alternative für ἀρνέομαι; die Alternative macht den möglichen Sinn des Lossagens beziehungsweise Nichtanerkennens sichtbar, während die Wiederholung in beiden Satzhälften erhalten bleibt.
lexical_decisions:
- source_word: ὑπομένομεν
  choice: standhaft bleiben
  rationale: Das Verb bezeichnet hier beharrliches Ausharren unter Bedrängnis oder Leiden. »Standhaft bleiben« ist modernes, verständliches Deutsch und bewahrt den fortdauernden Charakter, ohne eine weitergehende dogmatische Deutung einzutragen.
- source_word: συμβασιλεύσομεν
  choice: werden wir auch mit ihm herrschen
  rationale: Das zusammengesetzte Verb bedeutet, gemeinsam mit jemandem zu herrschen. »Mit ihm« gibt den aus dem Zusammenhang erschlossenen Bezug auf Christus wieder; »herrschen« bewahrt die königliche Bildsprache.
- source_word: ἀρνησόμεθα
  choice: wenn wir ihn verleugnen
  rationale: ἀρνέομαι kann »leugnen«, »verleugnen« oder »sich lossagen von« bedeuten. Bei einer Person ist »jemanden verleugnen« im Deutschen natürlich und entspricht der neutestamentlichen Warnsprache. Das im Griechischen unausgedrückte Objekt »ihn« wird aus dem Zusammenhang ergänzt.
- source_word: κἀκεῖνος
  choice: wird auch er
  rationale: Die Zusammenziehung aus καί und ἐκεῖνος markiert die entsprechende Reaktion der anderen Seite. Die Wortstellung »auch er« erhält diese Gegenseitigkeit und klingt zugleich natürlich.
- source_word: ἀρνήσεται ἡμᾶς
  choice: wird auch er uns verleugnen
  rationale: Die Wiederholung von »verleugnen« bildet die bewusste Wiederholung desselben griechischen Verbs ab und bewahrt so die zugespitzte Gegenseitigkeit der Warnung.
theological_decisions:
- issue: Tragweite der Warnung im zweiten Bedingungssatz
  choice: 'Die Aussage wird als unmittelbare, ernsthafte Warnung wiedergegeben: »wenn wir ihn verleugnen, wird auch er uns verleugnen«.'
  alternative: Die Verleugnung ausschließlich als Verlust von Lohn zu deuten oder den Bedingungssatz als rein hypothetisch abzuschwächen.
  rationale: Der griechische Text stellt zwei ausgewogene Bedingungssätze nebeneinander und lässt die Tragweite der Verleugnung unausgeführt. Die Übersetzung bewahrt daher die Schärfe und theologische Spannung, ohne die Debatten über Abfall, Bewahrung oder Lohn vorzuentscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die Wiederholung von »verleugnen« bewahren die prägnante Form des überlieferten Spruchs. Das Semikolon bildet die enge Verbindung und zugleich den Gegensatz der beiden Bedingungssätze ab.
