id: 2TI.2.2
reference: 2 Timothy 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: de
  text: Und was du von mir vor vielen Zeugen[a] gehört hast, das vertraue treuen Menschen[b] an, die fähig sein werden, auch andere zu lehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Gegenwart vieler Zeugen“; möglicherweise auch: „durch viele Zeugen“. Die griechische Wendung kann die öffentliche Vermittlung der Lehre vor anwesenden Zeugen oder, weniger wahrscheinlich, deren Vermittlung durch Zeugen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „treuen Männern“. Das griechische Wort für „Menschen“ steht hier in der maskulinen Pluralform, kann aber Menschen allgemein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: was
  rationale: Das substantivisch gebrauchte Relativpronomen bezeichnet den Inhalt dessen, was Timotheus gehört hat; „was“ ist im Deutschen natürlich und präzise.
- source_word: ἤκουσας
  choice: du gehört hast
  rationale: Der Aorist verweist auf den früheren Empfang der Lehre; im Deutschen gibt das Perfekt dies idiomatisch wieder.
- source_word: παρ’ ἐμοῦ
  choice: von mir
  rationale: Bei ἀκούω bezeichnet παρά mit Genitiv die Quelle des Gehörten.
- source_word: διὰ πολλῶν μαρτύρων
  choice: vor vielen Zeugen
  rationale: 'διά mit Genitiv kann hier die begleitenden Umstände bezeichnen: Paulus lehrte öffentlich, während viele Zeugen zugegen waren. Die mögliche instrumentale Deutung wird in der Fußnote bewahrt.'
- source_word: ταῦτα
  choice: das
  rationale: Das deutsche Demonstrativpronomen greift den zuvor genannten Lehrinhalt ausdrücklich wieder auf, ohne die schwerfällige Formulierung „diese Dinge“.
- source_word: παράθου
  choice: vertraue … an
  rationale: Der Imperativ bezeichnet das Übergeben eines anvertrauten Gutes in die Obhut anderer und bewahrt damit den Gedanken verantwortlicher Weitergabe.
- source_word: πιστοῖς
  choice: treuen
  rationale: πιστός kann sowohl Treue als auch Zuverlässigkeit bezeichnen; „treu“ hält diese Bedeutungsbreite offen.
- source_word: ἀνθρώποις
  choice: Menschen
  rationale: ἄνθρωπος kann Menschen allgemein bezeichnen. „Menschen“ gibt diese lexikalische Breite wieder; die grammatisch maskuline Form und die mögliche Übersetzung „Männer“ werden in der Fußnote vermerkt.
- source_word: οἵτινες
  choice: die
  rationale: Das qualitative Relativpronomen kennzeichnet die Art der auszuwählenden Menschen; im Deutschen wird diese Nuance durch den folgenden Eignungssatz hinreichend deutlich.
- source_word: ἱκανοὶ
  choice: fähig
  rationale: ἱκανός bezeichnet ausreichende Befähigung oder Tauglichkeit für eine Aufgabe; „fähig“ ist klar und vermeidet den möglichen amtlichen Beiklang von „qualifiziert“.
- source_word: ἔσονται
  choice: sein werden
  rationale: Die Zukunftsform wird ausdrücklich bewahrt und beschreibt ihre Fähigkeit zur weiteren Unterweisung.
- source_word: ἑτέρους
  choice: andere
  rationale: Die knappe Wiedergabe entspricht dem unbestimmten Plural und lässt offen, welche weiteren Personen gemeint sind.
- source_word: διδάξαι
  choice: zu lehren
  rationale: Der Aoristinfinitiv bezeichnet die Aufgabe, den empfangenen Lehrinhalt an weitere Menschen zu vermitteln.
theological_decisions:
- issue: Geschlechtliche Reichweite von πιστοῖς ἀνθρώποις
  choice: treuen Menschen
  alternative: treuen Männern
  rationale: ἄνθρωπος ist anders als ἀνήρ nicht spezifisch auf erwachsene Männer beschränkt, steht hier jedoch in grammatisch maskuliner Pluralform. Der Haupttext bewahrt die mögliche allgemeine Reichweite; die Fußnote nennt die enger geschlechtsspezifische Wiedergabe, ohne die Frage dogmatisch zu entscheiden.
- issue: Funktion der vielen Zeugen
  choice: vor vielen Zeugen
  alternative: durch viele Zeugen
  rationale: Im Zusammenhang ist am ehesten an öffentlich vermittelte Lehre in Gegenwart vieler Zeugen zu denken. Da διά mit Genitiv auch Vermittlung oder Mittel ausdrücken kann, bleibt diese weniger wahrscheinliche Deutung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Korrelativkonstruktion „was …, das …“ bildet den griechischen Rückbezug klar ab. „Anvertrauen“ vermittelt den Gedanken verantwortlicher Weitergabe, ohne kirchlichen Fachjargon.
