  variant: modern standard German
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: de
  text: Du nun, mein Kind, lass dich stärken[a] in der Gnade, die in Jesus, dem Messias, ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde stark“. „Lass dich stärken“ gibt deutlicher wieder, dass die Stärke empfangen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus Jesus“. Das griechische Χριστός bedeutet „Messias“ beziehungsweise „Gesalbter“; traditionell wird es mit „Christus“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ
  choice: Du
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen Nachdruck und hebt Timotheus gegenüber dem zuvor Erwähnten hervor.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ gibt den folgernden und zugleich überleitenden Charakter von οὖν in natürlichem Deutsch wieder.
- source_word: τέκνον μου
  choice: mein Kind
  rationale: τέκνον bezeichnet ein Kind, nicht eigens einen Sohn, und drückt hier die enge geistliche Beziehung aus.
- source_word: ἐνδυναμοῦ
  choice: lass dich stärken
  rationale: Die mediale bzw. passive Imperativform legt nahe, dass die Stärke empfangen und nicht aus eigener Kraft erzeugt wird. Die Formulierung ist im Deutschen natürlich und bewahrt diese Nuance.
- source_word: ἐν τῇ χάριτι
  choice: in der Gnade
  rationale: Die Wiedergabe mit „in“ erhält die mögliche Überschneidung von Bereich und Mittel, ohne sie vorschnell auf „durch“ festzulegen.
- source_word: χάριτι
  choice: Gnade
  rationale: „Gnade“ ist hier die sachlich und theologisch passende deutsche Entsprechung für χάρις und kann sowohl Gottes unverdiente Zuwendung als auch ihre stärkende Wirksamkeit umfassen.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: die im Messias Jesus ist
  rationale: Der attributive Ausdruck bestimmt die Gnade näher als diejenige, die in Jesus, dem Messias, gegenwärtig bzw. begründet ist. Die knappe Form bewahrt außerdem die griechische Wortfolge.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός ist seinem Bedeutungsgehalt nach der Titel „Messias“ bzw. „Gesalbter“. „Messias“ macht diesen Titel im Deutschen sichtbar, statt ihn lediglich in der traditionellen Form „Christus“ zu übernehmen.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Übliche deutsche Form des Eigennamens Ἰησοῦς.
theological_decisions:
- issue: Genus Verbi und Handelnder bei ἐνδυναμοῦ
  choice: '„lass dich stärken“: Timotheus soll Stärke empfangen.'
  alternative: „sei stark“ oder „stärke dich“
  rationale: Die mediale bzw. passive Form lässt eine empfangende Bedeutung zu; diese passt zu der anschließenden Bestimmung „in der Gnade“. Die Übersetzung benennt den Handelnden dennoch nicht ausdrücklich und vermeidet damit eine Überbestimmung.
- issue: Wiedergabe von Χριστός
  choice: „Messias Jesus“
  alternative: „Christus Jesus“
  rationale: Die Übersetzung als „Messias“ bewahrt die Bedeutung des griechischen Titels. Die traditionelle Form „Christus“ bleibt als mögliche Wiedergabe in der Fußnote genannt.
- issue: Bedeutung von ἐν bei der Gnade
  choice: „in der Gnade“
  alternative: „durch die Gnade“
  rationale: „In“ hält offen, ob die Gnade vor allem als Bereich, Grundlage oder Mittel der Stärkung verstanden wird, und bewahrt so die Spannung des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die bildhafte Rede von einem geistlichen Kind bleiben erhalten. „Lass dich stärken“ ist idiomatisch und wahrt die wahrscheinlich rezeptive Nuance; „Messias Jesus“ folgt bewusst dem griechischen Titel und der dortigen Namensfolge.
