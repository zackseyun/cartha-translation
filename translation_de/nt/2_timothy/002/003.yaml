  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Textes wieder: den imperativischen Aufruf zum gemeinsamen Leiden (συγκακοπάθησον), den Vergleich, das Bild des guten Soldaten und die Zuordnung zu Christus/Messias Jesus. Die nicht ausdrücklich genannte Person der gemeinsamen Leidensgemeinschaft wird im Haupttext zutreffend nicht ergänzt.'
