lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Leide mit
  rationale: Der Aorist Aktiv Imperativ in der 2. Person Singular fordert zum gemeinsamen Tragen von Leid und Mühsal auf. „Leide mit“ gibt die durch συν- ausgedrückte Teilhabe knapp wieder, ohne ausdrücklich „mit mir“ zu ergänzen.
- source_word: ὡς
  choice: wie
  rationale: Die Vergleichspartikel bezeichnet hier die Art und Weise, in der Timotheus mitleiden soll.
- source_word: καλὸς
  choice: guter
  rationale: Im Zusammenhang mit „Soldat“ bezeichnet καλός anerkennenswerte Tüchtigkeit und Bewährung; „gut“ ist natürlich und vermeidet eine Überdeutung.
- source_word: στρατιώτης
  choice: Soldat
  rationale: Dies ist die gewöhnliche Bezeichnung für einen Soldaten und bewahrt das militärische Bild.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός trägt hier weiterhin den Sinn eines Titels. „Messias“ gibt dessen semantischen Gehalt im Deutschen wieder; der Genitiv markiert die Zugehörigkeit des Soldaten.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Die etablierte deutsche Form des Personennamens Ἰησοῦς; im griechischen Genitiv steht sie zusammen mit Χριστοῦ.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  alternative: Christi Jesu
  rationale: Die gewählte Form übersetzt Χριστός als Titel und gibt Ἰησοῦς als Namen wieder. Die traditionelle Form „Christi Jesu“ ist im Deutschen geläufiger, lässt den Titelcharakter von Χριστός jedoch weniger deutlich hervortreten.
- issue: Mit wem Timotheus leiden soll
  choice: 'ohne ausdrückliche Ergänzung: „Leide mit“'
  alternative: „Leide mit mir“
  rationale: Das Präfix συν- bezeichnet gemeinsames Leiden, nennt den Mitbeteiligten aber nicht ausdrücklich. Der Zusammenhang kann Paulus nahelegen; die Übersetzung lässt die im Wortlaut bestehende Offenheit bestehen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. „Leide mit“ bewahrt die Prägnanz des Imperativs und den gemeinschaftlichen Sinn des griechischen Verbs. „Soldat“ erhält das militärische Bild; „des Messias Jesus“ ist bewusst titelbetont, auch wenn „Christi Jesu“ im kirchlichen Sprachgebrauch vertrauter klingt.
