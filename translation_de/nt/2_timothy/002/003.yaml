  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: de
  text: Leide als guter Soldat des Messias Jesus mit[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ertrage mit mir Mühsal wie ein guter Soldat des Messias Jesus.“'
    reason: lexical_alternative
  - marker: b
    text: Griechisch „Christus Jesus“; hier als „Messias Jesus“ wiedergegeben, weil Χριστός als Titel gebraucht wird.
