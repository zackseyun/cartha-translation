  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: de
  text: die von der Wahrheit abgeirrt sind[a], indem sie behaupten, die Auferstehung sei schon geschehen[b], und den Glauben einiger erschüttern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die hinsichtlich der Wahrheit das Ziel verfehlt haben“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ihre Behauptung, die Auferstehung liege bereits in der Vergangenheit; wie sie diese Lehre im Einzelnen verstanden, sagt der Vers nicht.
    reason: theological_clarification
  - marker: c
    text: 'Oder: „untergraben“ oder „umstürzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: die
  rationale: Das Relativpronomen knüpft an die zuvor genannten Irrlehrer an; „die“ ist im Deutschen natürlich und trägt beide Prädikate.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: von der Wahrheit abgeirrt sind
  rationale: Die Verbindung bezeichnet ein Verfehlen beziehungsweise Abirren in Bezug auf die Wahrheit. Die gewählte Formulierung gibt das Bild idiomatisch wieder.
- source_word: λέγοντες
  choice: indem sie sagen
  rationale: Das Partizip erläutert, worin beziehungsweise wodurch ihr Abirren sichtbar wird, ohne diese Beziehung enger festzulegen.
- source_word: ἀνάστασιν ἤδη γεγονέναι
  choice: die Auferstehung sei schon geschehen
  rationale: Der abhängige Konjunktiv markiert die berichtete Behauptung; das Perfekt bezeichnet die Auferstehung als angeblich bereits eingetretenes Ereignis mit gegenwärtiger Bedeutung.
- source_word: ἀνατρέπουσιν
  choice: erschüttern
  rationale: Das Verb kann „umstürzen“, „untergraben“ oder „zerrütten“ bedeuten. „Erschüttern“ bezeichnet hier verständlich die fortdauernde schädliche Wirkung auf den Glauben, ohne vollständigen Glaubensverlust zwingend zu behaupten.
- source_word: τήν τινων πίστιν
  choice: den Glauben mancher Menschen
  rationale: πίστις wird mit dem sachlich naheliegenden „Glauben“ wiedergegeben; τινων bezeichnet eine unbestimmte Gruppe.
theological_decisions:
- issue: Bedeutung der Behauptung, die Auferstehung sei schon geschehen
  choice: Die falsche Behauptung wird ohne nähere Ausdeutung wiedergegeben.
  alternative: Sie ausdrücklich als rein geistliche Auferstehung oder als Leugnung einer künftigen leiblichen Auferstehung erklären.
  rationale: Der Vers nennt den Inhalt der Lehre, erläutert aber nicht ihr vollständiges theologisches System. Die Übersetzung bewahrt diese Grenze.
- issue: Bedeutung von πίστις
  choice: Glauben
  alternative: Vertrauen
  rationale: „Glauben“ ist hier die natürliche und theologisch offene Wiedergabe; „Vertrauen“ wäre möglich, würde den Bedeutungsbereich aber stärker einengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Satz bleibt als Relativsatz an den vorausgehenden Kontext angeschlossen; „sei“ kennzeichnet die Aussage als berichtete Behauptung.
