  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: de
  text: und sie wieder zur Besinnung kommen und der Schlinge des Teufels entkommen, nachdem sie von ihm lebend gefangen genommen worden sind[b], um seinen Willen zu tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem sie von ihm gefangen genommen worden sind, um dessen Willen zu tun.“ Manche beziehen „dessen“ nicht auf den Teufel, sondern auf Gott.'
    reason: alternative_reading
  - marker: b
    text: Das mit „lebend gefangen genommen“ wiedergegebene Verb kann allgemeiner mit „gefangen genommen“ übersetzt werden, bezeichnet im Griechischen jedoch genauer das Lebendfangen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: wieder zur Besinnung kommen
  rationale: Das Verb bezeichnet wörtlich das erneute Nüchternwerden und übertragen die Rückkehr zu klarem Denken. „Wieder zur Besinnung kommen“ gibt dieses Bild im modernen Deutsch natürlich wieder.
- source_word: ἐκ τῆς … παγίδος
  choice: der Schlinge … entkommen
  rationale: Die Präposition ἐκ bezeichnet die Bewegung aus der Falle heraus. Im Deutschen bringt „der Schlinge entkommen“ sowohl das Bild als auch den Gedanken der Befreiung verständlich zum Ausdruck.
- source_word: τοῦ διαβόλου
  choice: des Teufels
  rationale: διάβολος bezeichnet hier den Teufel als persönliche Gestalt, nicht lediglich einen Verleumder.
- source_word: ἐζωγρημένοι
  choice: lebendig gefangen worden sind
  rationale: ζωγρέω bezeichnet genauer das Lebendfangen. Das Perfektpartizip beschreibt einen durch die Gefangennahme entstandenen Zustand.
- source_word: ὑπ’ αὐτοῦ
  choice: von ihm
  rationale: Das Pronomen bezieht sich am naheliegendsten auf den unmittelbar zuvor genannten Teufel. Die pronominale Form bewahrt die Ausdrucksweise des Griechischen.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: um seinen Willen zu tun
  rationale: Die griechische Wendung bezeichnet die Ausrichtung auf den Willen des Genannten. Die finale Formulierung ist im Deutschen natürlich; der umstrittene Bezug von ἐκείνου wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bezugswort von ἐκείνου in εἰς τὸ ἐκείνου θέλημα
  choice: 'Das Pronomen wird im Haupttext auf den Teufel bezogen: „um seinen Willen zu tun“.'
  alternative: Das Pronomen kann auf Gott bezogen werden, sodass die Gefangenen letztlich für Gottes Willen gewonnen beziehungsweise zu ihm zurückgeführt werden.
  rationale: Der Teufel ist das nächste ausdrücklich genannte Bezugswort und daher syntaktisch die naheliegende Deutung. Da der Wechsel zu Gott jedoch eine alte und grammatisch mögliche Auslegung ist, wird die Spannung nicht stillschweigend beseitigt, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas gedrängte griechische Konstruktion wird durch einen koordinierten Ausdruck („zur Besinnung kommen und … entkommen“) verständlich gemacht, ohne das Bild der Schlinge oder den resultierenden Zustand der Gefangenschaft aufzugeben.
