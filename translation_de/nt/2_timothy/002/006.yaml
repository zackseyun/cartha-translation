  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: de
  text: Der Bauer, der sich abmüht, muss als Erster einen Anteil an der Ernte erhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Der sich abmühende Bauer muss zuerst an den Erträgen Anteil haben.“ Die Formulierung kann außerdem so verstanden werden, dass der Bauer zuerst arbeiten muss, bevor er von den Erträgen nimmt; grammatisch liegt jedoch näher, dass er als Erster daran Anteil erhalten soll.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: κοπιῶντα (κοπιάω)
  choice: der sich abmüht
  rationale: Das Partizip bezeichnet anstrengende, mühevolle Arbeit. Die Formulierung ist natürliches modernes Deutsch und bewahrt den Nachdruck auf dem Einsatz des Bauern.
- source_word: γεωργὸν (γεωργός)
  choice: Bauer
  rationale: Das Wort bezeichnet jemanden, der den Boden bestellt. „Bauer“ ist die klare und gebräuchliche moderne Entsprechung.
- source_word: δεῖ
  choice: muss
  rationale: δεῖ drückt Notwendigkeit oder Verpflichtung aus; „muss“ gibt diese Aussage knapp und deutlich wieder.
- source_word: πρῶτον
  choice: als Erster
  rationale: Im Satz bezieht sich πρῶτον am natürlichsten auf die vorrangige Beteiligung des Bauern am Ertrag. „Als Erster“ macht diese Rangfolge im Deutschen deutlich.
- source_word: τῶν καρπῶν (καρπός)
  choice: an der Ernte
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet καρποί die erzeugten Feldfrüchte beziehungsweise den Ertrag. „Ernte“ ist hier eine verständliche deutsche Sammelbezeichnung.
- source_word: μεταλαμβάνειν (μεταλαμβάνω)
  choice: einen Anteil … erhalten
  rationale: Das Verb bedeutet, an etwas Anteil zu haben oder davon zu nehmen. Zusammen mit dem Genitiv bringt „einen Anteil … erhalten“ den partitivischen Sinn klar zum Ausdruck.
theological_decisions:
- issue: Sinn der sprichwortartigen Aussage und Bezug von πρῶτον
  choice: Wer sich bei der Arbeit abmüht, soll vorrangig am Ertrag dieser Arbeit beteiligt werden.
  alternative: Der Bauer muss zuerst arbeiten, bevor er von der Ernte nimmt.
  rationale: Wortstellung und Syntax verbinden πρῶτον am natürlichsten mit μεταλαμβάνειν, also mit dem Anteilnehmen, nicht mit dem zeitlichen Beginn der Arbeit. Die alternative Deutung wird wegen der knappen griechischen Formulierung in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich abmühen“ bewahrt die Vorstellung anstrengender Arbeit; „einen Anteil an der Ernte erhalten“ ist klarer und natürlicher als das formellere „an den Erträgen Anteil haben“.
