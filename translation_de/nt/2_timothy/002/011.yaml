  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: de
  text: Diese Aussage ist zuverlässig:[a] Wenn wir nämlich mit ihm gestorben sind,[b] werden wir auch mit ihm leben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieses Wort ist treu“ oder „Dieser Ausspruch ist verlässlich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wenn wir mitgestorben sind“; das griechische zusammengesetzte Verb bezeichnet ein gemeinsames Sterben mit Christus.'
    reason: lexical_alternative
  - marker: c
    text: Das zukünftige Leben mit Christus kann sich auf Auferstehungsleben, auf Teilhabe an seinem Leben oder auf beides beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: zuverlässig
  rationale: Das prädikative Adjektiv bezeichnet die Aussage als verlässlich und glaubwürdig. „Zuverlässig“ gibt die feste Wendung in natürlichem, heutigem Deutsch wieder, ohne die mögliche Bedeutung „treu“ völlig auszuschließen.
- source_word: ὁ λόγος
  choice: diese Aussage
  rationale: In der Formel πιστὸς ὁ λόγος bezeichnet λόγος einen knappen, einprägsamen Ausspruch. „Diese Aussage“ verweist hier natürlich auf den folgenden Satz; „das Wort“ wäre im Deutschen mehrdeutig und weniger idiomatisch.
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: „Wenn“ erhält die Bedingung, während „denn“ die begründende beziehungsweise erläuternde Funktion von γάρ gegenüber der Zuverlässigkeitsformel wiedergibt.
- source_word: συναπεθάνομεν
  choice: wir mit ihm gestorben sind
  rationale: Das Kompositum συναποθνῄσκω drückt gemeinsames Sterben aus. Das im Zusammenhang vorausgesetzte Gegenüber ist Christus. Das deutsche Perfekt ist in einer gegenwartsbezogenen Bedingung natürlich und legt die genaue zeitliche Einordnung nicht unnötig fest.
- source_word: καὶ
  choice: auch
  rationale: „Auch“ bringt die Entsprechung zwischen gemeinsamem Sterben und gemeinsamem Leben deutlich und idiomatisch zum Ausdruck.
- source_word: συζήσομεν
  choice: werden wir auch mit ihm leben
  rationale: Die Futurform und das Präfix συν- werden beide sichtbar wiedergegeben. „Mit ihm leben“ bleibt offen für die volle zeitliche und theologische Reichweite der Aussage.
theological_decisions:
- issue: Unausgesprochenes Gegenüber der συν-Komposita
  choice: In beiden Verben „mit ihm“ ergänzen und auf Christus beziehen.
  alternative: 'Die Beziehung unausgesprochen lassen: „wenn wir gestorben sind, werden wir auch leben“.'
  rationale: Die συν-Komposita bezeichnen gemeinsames Sterben und Leben; der christusbezogene Zusammenhang macht Christus zum naheliegenden Gegenüber. Die Ergänzung verdeutlicht den im Griechischen enthaltenen Beziehungssinn, ohne eine zusätzliche Lehraussage einzuführen.
- issue: Zeitliche und theologische Reichweite des Lebens mit Christus
  choice: Allgemein mit „werden wir auch mit ihm leben“ übersetzen.
  alternative: Ausschließlich auf das künftige Auferstehungsleben oder ausschließlich auf gegenwärtige geistliche Teilhabe beziehen.
  rationale: Das Futur weist deutlich nach vorn, doch die knappe Formulierung erläutert die Art und Reichweite dieses Lebens nicht näher. Die Übersetzung bewahrt diese Offenheit, statt sie konfessionell oder systematisch einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Diese Aussage ist zuverlässig“ gibt die einleitende Formel verständlich wieder; der folgende Parallelismus bleibt knapp und einprägsam. Das Perfekt „gestorben sind“ ist in der deutschen Bedingung natürlich, während „werden … leben“ das griechische Futur klar bewahrt.
