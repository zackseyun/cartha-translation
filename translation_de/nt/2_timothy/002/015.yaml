  variant: modern standard German
source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: de
  text: 'Bemühe dich mit allem Ernst, dich vor Gott als bewährt zu erweisen: als einen Arbeiter, der sich nicht zu schämen braucht und das Wort der Wahrheit richtig behandelt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „richtig lehrt“; wörtlicher: „gerade schneidet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: Bemühe dich mit allem Ernst
  rationale: Der Aoristimperativ fordert zu entschlossenem, ernsthaftem Einsatz auf. Die Wendung ist kräftiger als ein bloßes „Bemühe dich“, ohne die umgangssprachliche Färbung von „Tu dein Bestes“.
- source_word: σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ
  choice: dich vor Gott als bewährt zu erweisen
  rationale: Die Formulierung gibt das Sich-Gott-Zur-Verfügung-Stellen beziehungsweise Sich-vor-Gott-Präsentieren in natürlichem Deutsch wieder und bewahrt bei δόκιμος den Gedanken bestandener Prüfung. „Vor Gott“ macht die Beziehung des Dativs zu παραστῆσαι idiomatisch deutlich.
- source_word: ἐργάτην
  choice: einen Arbeiter
  rationale: „Arbeiter“ erhält das Tätigkeitsbild des griechischen Substantivs und ist in modernem Standarddeutsch klar verständlich.
- source_word: ἀνεπαίσχυντον
  choice: der sich nicht zu schämen braucht
  rationale: Die Wendung bezeichnet nicht bloß ein subjektives Gefühl der Unbefangenheit, sondern einen Arbeiter, der keinen berechtigten Anlass zur Scham hat.
- source_word: ὀρθοτομοῦντα
  choice: richtig behandelt
  rationale: Das seltene Verb bedeutet wörtlich etwa „gerade schneiden“. Im Kontext bezeichnet es den sachgemäßen, zuverlässigen Umgang mit der Botschaft, ohne die Bedeutung vorschnell auf das Lehren allein einzuengen.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: das Wort der Wahrheit
  rationale: Die Wiedergabe bewahrt die Genitivverbindung und den paulinischen Ausdruck; zugleich bleibt sie im Deutschen verständlich und theologisch offen.
theological_decisions:
- issue: Bedeutung von ὀρθοτομοῦντα im Dienstkontext
  choice: das Wort der Wahrheit richtig behandelt
  alternative: 'das Wort der Wahrheit richtig lehrt; wörtlicher: das Wort der Wahrheit gerade schneidet'
  rationale: Das Partizip beschreibt wahrscheinlich den richtigen und zuverlässigen Umgang mit der Wahrheitsbotschaft insgesamt. Die Hauptfassung bleibt bewusst breit; die Fußnote bewahrt sowohl die engere Auslegung auf das Lehren als auch das ungewöhnliche Bild des griechischen Verbs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt ordnet die beiden näheren Bestimmungen dem Sich-vor-Gott-Erweisen zu. Die Formulierung vermeidet veraltetes Amtsdeutsch und erhält zugleich das Bild des Arbeiters.
