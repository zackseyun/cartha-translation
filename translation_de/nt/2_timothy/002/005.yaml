  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: de
  text: Und auch wenn jemand als Wettkämpfer antritt, wird er nicht mit dem Siegeskranz ausgezeichnet, wenn er nicht regelgerecht[a] kämpft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ordnungsgemäß“ oder „gesetzmäßig“. Das griechische Wort kann „gesetzmäßig“ oder „ordnungsgemäß“ bedeuten und bezieht sich hier wahrscheinlich auf die Regeln des Wettkampfs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: an einem Wettkampf teilnimmt / kämpft
  rationale: Das Verb ἀθλέω bezeichnet die Teilnahme an einem athletischen Wettkampf. Die variierte deutsche Wiedergabe hält das Wettkampfbild lebendig und vermeidet eine schwerfällige Wiederholung.
- source_word: τις
  choice: jemand
  rationale: Das indefinite Pronomen ist allgemein und ohne geschlechtliche Einschränkung gebraucht; „jemand“ gibt dies natürlich wieder.
- source_word: στεφανοῦται
  choice: wird mit dem Siegeskranz ausgezeichnet
  rationale: Das Passiv bezeichnet die Verleihung des Kranzes an den Sieger. „Siegeskranz“ macht den antiken Wettkampfbezug deutlicher als das im Deutschen leicht königlich verstandene „gekrönt“.
- source_word: νομίμως
  choice: regelgerecht
  rationale: Das Adverb bedeutet gesetzmäßig beziehungsweise ordnungsgemäß und bezieht sich hier im Wettkampfbild wahrscheinlich auf die geltenden Regeln.
- source_word: καὶ
  choice: auch, im Zusammenhang durch „Und wenn“ implizit eingebunden
  rationale: καί führt neben den vorangehenden Bildern einen weiteren Vergleich an. Im natürlichen Deutschen wird seine additive Funktion zusammen mit δέ durch den Anschluss „Und wenn“ hinreichend vermittelt.
- source_word: δὲ
  choice: Und
  rationale: δέ markiert einen leichten Übergang zum nächsten Beispiel, keinen starken Gegensatz.
theological_decisions:
- issue: Bedeutung des Siegeskranzes
  choice: Das Bild einer Auszeichnung im Wettkampf bleibt bestehen, ohne die Belohnung näher zu bestimmen.
  alternative: Den Siegeskranz ausdrücklich als endzeitlichen Lohn oder als Anerkennung des Dienstes deuten.
  rationale: Der Vers selbst konkretisiert die übertragene Bedeutung des Kranzes nicht; eine solche Festlegung würde die offene Bildsprache theologisch verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die athletische Bildwelt wird ausdrücklich bewahrt; „Siegeskranz“ verhindert eine irreführende königliche Assoziation. Der Fußnotenmarker steht an der Aussage, deren lexikalische Nuance erläutert wird.
