id: 2TI.2.4
reference: 2 Timothy 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: de
  text: Wer als Soldat dient, verstrickt sich nicht in die Geschäfte des täglichen Lebens[a], damit er dem gefällt, der ihn angeworben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in zivile Beschäftigungen“. Das Griechische stellt den Militärdienst den gewöhnlichen Geschäften und Beschäftigungen des Lebens gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς στρατευόμενος
  choice: Wer als Soldat dient
  rationale: Die deutsche Relativkonstruktion gibt die allgemeine Aussage idiomatisch wieder und bewahrt den fortdauernden Sinn des Partizips στρατευόμενος.
- source_word: ἐμπλέκεται
  choice: verstrickt sich
  rationale: Die Formulierung bewahrt das anschauliche Bild eines hinderlichen Verwickeltwerdens und ist im modernen Deutsch natürlich.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: in die Geschäfte des täglichen Lebens
  rationale: πραγματεῖαι bezeichnet Beschäftigungen, Geschäfte oder Angelegenheiten; βίος verweist hier auf das gewöhnliche tägliche Leben beziehungsweise den Lebensunterhalt. Die Wiedergabe erhält die Breite des Ausdrucks, ohne ihn vorschnell auf zivile Erwerbstätigkeit zu beschränken.
- source_word: ἵνα
  choice: damit
  rationale: Die Konjunktion kennzeichnet den Zweck der ungeteilten Ausrichtung.
- source_word: τῷ στρατολογήσαντι
  choice: dem, der ihn angeworben hat
  rationale: Die Wendung gibt das substantivierte Aoristpartizip transparent wieder, ohne einen im Griechischen nicht genannten militärischen Rang einzuführen.
- source_word: ἀρέσῃ
  choice: gefällt
  rationale: Der Konjunktiv steht nach ἵνα in einem Zwecksatz; im Deutschen drückt der mit „damit“ eingeleitete Satz diesen Zweck bereits eindeutig aus.
theological_decisions:
- issue: Reichweite des militärischen Bildes
  choice: Das Bild eines Soldaten, der sich nicht in die Geschäfte des täglichen Lebens verstrickt, wird unmittelbar beibehalten.
  alternative: Den Ausdruck ausdrücklich als „zivile Beschäftigungen“ wiedergeben oder direkt auf Prioritäten im Dienst übertragen.
  rationale: Der griechische Text formuliert ein militärisches Vergleichsbild, legt seine konkrete Anwendung in diesem Vers aber nicht weiter aus. Die Übersetzung sollte das Bild bewahren, statt seine theologische Anwendung vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wer als Soldat dient“ vermeidet eine unnötig geschlechtsspezifische Verengung und klingt natürlicher als eine wörtliche Partizipialkonstruktion. „Geschäfte des täglichen Lebens“ ist bewusst breit gehalten; die Fußnote nennt die stärker militärisch kontrastierende Alternative.
