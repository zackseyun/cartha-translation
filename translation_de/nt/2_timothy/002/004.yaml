review_pass:
  verdict: approve
  source_fidelity: Der Entwurf gibt die universale Aussage von οὐδείς στρατευόμενος idiomatisch wieder. „verstrickt sich“ trifft ἐμπλέκεται bildhaft und angemessen; „Geschäfte des täglichen Lebens“ bildet die bewusst breite Wendung ταῖς τοῦ βίου πραγματείαις ab, ohne sie auf Erwerbsarbeit oder eine konkrete Anwendung zu verengen. Der Zwecksatz und „der ihn angeworben hat“ entsprechen ἵνα sowie τῷ στρατολογήσαντι ἀρέσῃ.
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die generische Formulierung „Wer als Soldat dient“ ist idiomatisch; „sich in die Geschäfte des täglichen Lebens verstricken“ ist verständlich und bewahrt das Bild der Behinderung durch Verwicklung.
  terminology: „Soldat“, „angeworben“ und „Geschäfte des täglichen Lebens“ sind terminologisch tragfähig. Die Fußnotenalternative „zivile Beschäftigungen“ ist als mögliche, stärker kontrastierende Wiedergabe korrekt; sie wird nicht unzulässig als alleinige Bedeutung ausgegeben.
