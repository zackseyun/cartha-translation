source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: de
  text: Ein Diener[a] des Herrn aber soll nicht streiten, sondern allen gegenüber freundlich sein, fähig zu lehren und geduldig, wenn ihm Unrecht widerfährt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Zusammenhang auch »Sklave« bedeuten.
    reason: lexikalische Alternative zu δοῦλος; sie entspricht dem englischen Audit-Trail, ohne die kontextgerechte Hauptwiedergabe »Diener« zu verdrängen.
  - marker: b
    text: 'Das griechische Wort kann auch bedeuten: »ohne nachtragend zu sein« oder »Unrecht ertragend«.'
    reason: Das seltene ἀνεξίκακος umfasst geduldiges Ertragen von Unrecht und das Ausbleiben einer nachtragenden oder vergeltenden Reaktion.
lexical_decisions:
- source_word: δοῦλον
  choice: Diener
  rationale: δοῦλος kann je nach Zusammenhang »Diener« oder »Sklave« bezeichnen. Hier steht das vom Dienst für den Herrn erwartete Verhalten im Vordergrund; »Diener« ist deshalb im Deutschen natürlich und sachgerecht.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal und idiomatisch mit »des Herrn« wiedergegeben; κύριος bezeichnet hier den Herrn, dem der Diener zugehört und dient.
- source_word: οὐ δεῖ μάχεσθαι
  choice: soll nicht streiten
  rationale: δεῖ drückt eine verbindliche Anforderung aus. μάχεσθαι meint in diesem Zusammenhang vor allem streitsüchtiges Auseinandersetzen, nicht notwendig körperliches Kämpfen.
- source_word: ἤπιον
  choice: freundlich
  rationale: ἤπιος bezeichnet ein mildes, sanftes und umgängliches Verhalten. »Freundlich« bildet den Gegensatz zum Streiten in natürlichem modernem Deutsch ab.
- source_word: πρὸς πάντας
  choice: zu allen
  rationale: Die Wendung bezeichnet die uneingeschränkte Reichweite dieses Verhaltens und wird knapp und idiomatisch wiedergegeben.
- source_word: διδακτικόν
  choice: fähig zu lehren
  rationale: διδακτικός meint zum Lehren befähigt oder geschickt, nicht »belehrbar«.
- source_word: ἀνεξίκακον
  choice: geduldig, wenn ihm Unrecht widerfährt
  rationale: Das seltene Adjektiv bezeichnet die Bereitschaft, erlittenes Unrecht ohne gereizte Vergeltung zu ertragen. Die ausformulierte Wiedergabe macht diesen Sinn verständlich.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Zusammenhang einer Dienstanweisung
  choice: Diener
  alternative: Sklave
  rationale: Der Vers betont die Haltung und das Verhalten dessen, der dem Herrn dient, nicht ausdrücklich seinen gesellschaftlichen Status. »Diener« vermeidet eine unnötige Verengung, während die mögliche stärkere Zugehörigkeitsnuance von δοῦλος in der Fußnote erhalten bleibt.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« ist die sachlich und traditionsübergreifend angemessene Wiedergabe; der Kontext verlangt keine abweichende Spezifizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Reihung der geforderten Eigenschaften. »Soll nicht« gibt die verpflichtende Kraft von οὐ δεῖ wieder, ohne unnötig schroff zu wirken. Der Fußnotenmarker steht unmittelbar nach der Wendung, die er erläutert.
