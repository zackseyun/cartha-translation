id: 2TI.2.13
reference: 2 Timothy 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: de
  text: Wenn wir untreu sind[a], bleibt er treu[b], denn er kann sich selbst nicht verleugnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn wir nicht glauben« beziehungsweise »wenn wir ohne Glauben sind«. Das griechische Verb kann Unglauben oder Untreue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bleibt er zuverlässig«. »Treu« bewahrt den Gegensatz zu »untreu«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: wir untreu sind
  rationale: ἀπιστέω kann sowohl »nicht glauben« als auch »untreu sein« bedeuten. »Untreu sind« bewahrt im Deutschen den Gegensatz zu πιστός und lässt den Bezug auf Unglauben beziehungsweise Untreue offen.
- source_word: πιστὸς
  choice: treu
  rationale: »Treu« erhält die bewusste Gegenüberstellung zu ἀπιστοῦμεν und bezeichnet seine bleibende Verlässlichkeit, ohne näher festzulegen, wie sie sich hier auswirkt.
- source_word: μένει
  choice: bleibt
  rationale: »Bleibt« ist die direkte, natürliche Wiedergabe und drückt fortdauernde Beständigkeit aus.
- source_word: ἀρνήσασθαι
  choice: verleugnen
  rationale: »Verleugnen« gibt die starke relationale Bedeutung von ἀρνέομαι wieder und ist in diesem Zusammenhang idiomatischer als das bloße »leugnen«.
- source_word: ἑαυτὸν
  choice: sich selbst
  rationale: Das Reflexivpronomen bezieht sich auf ἐκεῖνος und wird im Deutschen unmittelbar mit »sich selbst« wiedergegeben.
- source_word: οὐ δύναται
  choice: kann … nicht
  rationale: Diese Formulierung gibt eine Unmöglichkeit wieder, nicht lediglich fehlende Bereitschaft.
theological_decisions:
- issue: Bedeutung seiner Treue angesichts menschlicher Untreue
  choice: Der Vers bekräftigt, dass seine Treue fortbesteht, weil er sich selbst nicht verleugnen kann; der Haupttext legt nicht fest, ob hier vor allem Rettung, Erfüllung von Verheißungen oder auch die Verwirklichung angekündigten Gerichts gemeint ist.
  alternative: Die Aussage kann ausschließlich als Zusage fortdauernder Rettung oder ausschließlich als Hinweis auf die zuverlässige Ausführung von Gericht verstanden werden.
  rationale: Der griechische Wortlaut betont seine Beständigkeit, entscheidet die konkrete heilvolle oder gerichtliche Auswirkung jedoch nicht ausdrücklich. Die Übersetzung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die Wiederholung »untreu/treu« bildet den griechischen Gegensatz hörbar ab; die Fußnoten dokumentieren die echte lexikalische Mehrdeutigkeit.
