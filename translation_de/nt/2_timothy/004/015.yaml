  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: de
  text: Nimm auch du dich vor ihm in Acht, denn er hat sich unseren Worten heftig widersetzt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: vor ihm
  rationale: Das Relativpronomen verweist auf Alexander im vorherigen Vers. Im Deutschen wird es innerhalb der idiomatischen Wendung „sich vor jemandem in Acht nehmen“ mit „vor ihm“ wiedergegeben.
- source_word: καὶ σὺ
  choice: auch du
  rationale: Die Formulierung hebt Timotheus zusätzlich zu Paulus hervor; „auch du“ bewahrt diese Betonung in natürlicher deutscher Wortstellung.
- source_word: φυλάσσου
  choice: nimm dich … in Acht
  rationale: Der Präsensimperativ im Medium fordert zu anhaltender persönlicher Vorsicht auf. „Sich vor jemandem in Acht nehmen“ gibt den Warncharakter klar und idiomatisch wieder.
- source_word: λίαν
  choice: heftig
  rationale: Das Adverb verstärkt den Widerstand. „Heftig“ verbindet sich im Deutschen natürlich mit „sich widersetzen“ und drückt dessen hohe Intensität aus.
- source_word: ἀντέστη
  choice: hat sich … widersetzt
  rationale: Der Aorist von ἀνθίστημι bezeichnet ein entschiedenes Entgegentreten oder Widerstehen. Das deutsche Perfekt ist in heutiger Sprache natürlich und wahrt den vergangenen Bezug.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: unseren Worten
  rationale: Die wörtlich nahe Wiedergabe lässt offen, ob konkrete Äußerungen, Verkündigung, Zeugnis oder Lehre gemeint sind, statt den Kontext enger festzulegen, als es der griechische Ausdruck tut.
theological_decisions:
- issue: Bedeutungsumfang von „unseren Worten“
  choice: Die offene Formulierung „unseren Worten“ bleibt im Haupttext erhalten.
  alternative: „unserer Botschaft“, „unserer Verkündigung“ oder „unserer Lehre“
  rationale: Der griechische Ausdruck legt nicht fest, ob Paulus speziell Gerichtszeugnis, öffentliche Verkündigung oder lehrhafte Rede meint. Die Übersetzung wahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Warnung ist direkt und verständlich formuliert; die sachliche Offenheit von λόγοι wird ohne erklärende Einengung bewahrt.
