id: 2TI.4.13
reference: 2 Timothy 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: de
  text: Wenn du kommst, bring den Mantel[a] mit, den ich in Troas bei Karpus zurückgelassen habe, ebenso die Bücher[b], besonders die Pergamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche verstehen das griechische Wort als Bücherhülle oder Behälter für Schriftrollen; gewöhnlich bezeichnet es jedoch ein äußeres Kleidungsstück.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Schriftrollen«. Das griechische Wort kann Schriftrollen oder ähnliche schriftliche Unterlagen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: Mantel
  rationale: Das Wort bezeichnet am ehesten ein äußeres Kleidungsstück, wohl einen Mantel. Die vorgeschlagene Bedeutung „Bücherhülle“ ist möglich, aber deutlich weniger wahrscheinlich.
- source_word: ἀπέλιπον
  choice: zurückgelassen habe
  rationale: Die Wiedergabe macht den Sinn von ἀπολείπω idiomatisch und präzise deutlich.
- source_word: παρὰ Κάρπῳ
  choice: bei Karpus
  rationale: παρά mit Dativ bezeichnet hier den Ort beziehungsweise die Verwahrung bei einer Person.
- source_word: ἐρχόμενος
  choice: Wenn du kommst
  rationale: Das Partizip ist temporal auf den Imperativ bezogen und wird im Deutschen natürlich als Nebensatz wiedergegeben.
- source_word: φέρε
  choice: bring ... mit
  rationale: Der Imperativ fordert Timotheus auf, die genannten Gegenstände auf seiner Reise zu Paulus mitzunehmen.
- source_word: τὰ βιβλία
  choice: die Bücher
  rationale: βιβλία kann Bücher beziehungsweise Schriftstücke in Rollenform bezeichnen; „Bücher“ ist die offene und geläufige Wiedergabe.
- source_word: μάλιστα
  choice: besonders
  rationale: Das Wort hebt die Pergamente innerhalb der erbetenen Gegenstände hervor.
- source_word: τὰς μεμβράνας
  choice: die Pergamente
  rationale: μεμβράνα bezeichnet Schreibmaterial oder Schriftstücke aus präparierter Tierhaut; „Pergamente“ ist die übliche präzise Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Briefstil. „Ebenso“ verbindet die weiteren Gegenstände natürlich mit dem vorangestellten Mantel; die Fußnoten bewahren die wesentlichen lexikalischen Alternativen.
