  text: Τυχικὸν δὲ ἀπέστειλα εἰς Ἔφεσον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: de
  text: Tychikus aber schickte ich nach Ephesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Tychikus schickte ich nach Ephesus“ beziehungsweise „Tychikus nun schickte ich nach Ephesus“; das griechische Bindewort δέ kann eine einfache Fortführung, einen Übergang oder einen leichten Gegensatz markieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Tychikus
  rationale: Der Personenname steht im Akkusativ und wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: Die Konjunktion markiert hier einen Übergang und kann zugleich einen leichten Gegensatz zum vorherigen Satz ausdrücken; „aber“ bewahrt diese Möglichkeit, ohne einen starken Kontrast zu erzwingen.
- source_word: ἀπέστειλα
  choice: schickte ich
  rationale: Der Aorist Aktiv Indikativ, 1. Person Singular, wird natürlich mit dem deutschen Präteritum wiedergegeben. Die Wortstellung hält Tychikus als anknüpfendes Satzthema im Vordergrund.
- source_word: εἰς
  choice: nach
  rationale: Bei Städten bezeichnet εἰς das Ziel einer Bewegung; im Deutschen ist dafür „nach“ idiomatisch.
- source_word: Ἔφεσον
  choice: Ephesus
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Nennung von Tychikus spiegelt die griechische Informationsstruktur; „schickte“ ist gegenüber dem förmlicheren „sandte“ im heutigen Deutsch natürlicher.
