  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: de
  text: Doch der Herr stand mir bei und gab mir Kraft, damit durch mich die Verkündigung vollständig verkündet würde und alle Völker[a] sie hörten. Und ich wurde aus dem Rachen des Löwen gerettet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Nichtjuden“. Das griechische Wort kann sowohl „Völker“ als auch „Nichtjuden“ bedeuten; hier sind wahrscheinlich die nichtjüdischen Völker als Hörer der guten Botschaft gemeint.'
    reason: lexical_alternative
  - marker: b
    text: „Aus dem Rachen des Löwen“ kann bildlich die Rettung aus tödlicher Gefahr bezeichnen; ein bestimmter Gegner oder eine konkrete Todesart wird damit nicht eindeutig benannt.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Doch der Herr
  rationale: δέ markiert den Gegensatz zum vorherigen Vers; κύριος wird ohne nähere Bestimmung als „der Herr“ wiedergegeben.
- source_word: μοι παρέστη
  choice: stand mir bei
  rationale: Die Wendung bezeichnet unterstützende Gegenwart und wird im Deutschen natürlich mit „beistehen“ ausgedrückt.
- source_word: ἐνεδυνάμωσέν με
  choice: gab mir Kraft
  rationale: ἐνδυναμόω bedeutet stärken oder mit Kraft ausstatten; die Formulierung ist natürlich und bewahrt den Sinn.
- source_word: ἵνα δι’ ἐμοῦ
  choice: damit durch mich
  rationale: ἵνα drückt hier Zweck beziehungsweise beabsichtigtes Ergebnis aus; διά mit Genitiv bezeichnet Vermittlung oder Mittel.
- source_word: τὸ κήρυγμα
  choice: die Verkündigung
  rationale: κήρυγμα kann sowohl die öffentliche Verkündigung als auch ihre Botschaft bezeichnen; „Verkündigung“ wahrt diese Spannweite.
- source_word: πληροφορηθῇ
  choice: ganz ausgerichtet würde
  rationale: Das Passiv kann hier das vollständige Ausführen beziehungsweise Zu-Ende-Bringen der Verkündigung bezeichnen. „Ganz ausgerichtet“ verbindet Vollständigkeit mit dem Vorgang des öffentlichen Verkündens, ohne den Sinn auf bloßes Sprechen zu verengen.
- source_word: ἀκούσωσιν πάντα τὰ ἔθνη
  choice: alle Völker sie hörten
  rationale: ἔθνη kann „Völker“ oder „Nichtjuden“ bedeuten. „Völker“ bewahrt die sprachliche Breite; das Pronomen „sie“ verdeutlicht im Deutschen, dass die Verkündigung gehört wird.
- source_word: ἐρρύσθην
  choice: ich wurde … gerettet
  rationale: ῥύομαι bezeichnet die Rettung oder Befreiung aus einer Gefahr.
- source_word: ἐκ στόματος λέοντος
  choice: aus dem Rachen des Löwen
  rationale: Die bildhafte Formulierung bleibt erhalten. „Rachen“ ist für das Maul eines gefährlichen Tieres idiomatisch, ohne die mögliche Metapher auszudeuten.
theological_decisions:
- issue: Bezug von κύριος
  choice: „der Herr“ ohne ausdrückliche Identifizierung
  alternative: Jesus Christus ausdrücklich nennen oder allgemeiner „Gott“ einsetzen
  rationale: Der Zusammenhang kann auf Christus weisen, doch der griechische Text nennt den Bezug nicht ausdrücklich; die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung von πάντα τὰ ἔθνη
  choice: „alle Völker“ im Text
  alternative: „alle Nichtjuden“
  rationale: ἔθνη besitzt sowohl eine ethnisch-nationale als auch eine auf Nichtjuden bezogene Bedeutung. Der Haupttext wahrt die volle lexikalische Breite; die Fußnote nennt die kontextuell plausible Alternative.
- issue: Bedeutung des Löwenrachens
  choice: Das Bild wird wörtlich beibehalten
  alternative: Deutung auf Nero, Satan, eine Hinrichtung durch Tiere oder allgemein tödliche Gefahr
  rationale: Der Text legt den konkreten Bezug nicht fest. Eine ausdrückliche Identifizierung würde eine umstrittene historische oder theologische Deutung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am griechischen Gedankengang, wird aber für flüssiges Deutsch in zwei Sätze gegliedert. Bildsprache und wesentliche Mehrdeutigkeiten bleiben erhalten.
