  text: Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν καὶ τὸν Ὀνησιφόρου οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: de
  text: Grüße Priska und Aquila und das Haus des Onesiphorus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Haus“ ist hier wahrscheinlich die Hausgemeinschaft beziehungsweise der Haushalt des Onesiphorus gemeint.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Grüße
  rationale: Der Aorist-Medium-Imperativ von ἀσπάζομαι ist hier eine direkte briefliche Aufforderung, Grüße auszurichten. „Grüße“ gibt die Imperativform knapp und natürlich wieder, ohne eine im Verb nicht ausdrücklich bezeichnete besondere Herzlichkeit hinzuzufügen.
- source_word: Πρίσκαν
  choice: Priska
  rationale: Der griechische Text bietet Πρίσκαν, die Akkusativform von Πρίσκα. „Priska“ ist die im Deutschen übliche direkte Wiedergabe dieses Namens und bewahrt die hier verwendete Namensform.
- source_word: Ἀκύλαν
  choice: Aquila
  rationale: „Aquila“ ist die etablierte deutsche Wiedergabe des Eigennamens Ἀκύλας.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: das Haus des Onesiphorus
  rationale: οἶκος kann das Haus, den Haushalt oder die Hausgemeinschaft bezeichnen. Die traditionelle und im Deutschen verständliche Wendung „das Haus des Onesiphorus“ bewahrt diese Bedeutungsbreite besser als „Familie“, das auf Verwandte verengt wäre.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die Satzstruktur folgt der schlichten brieflichen Aufforderung des griechischen Textes. „Haus“ erhält die Mehrdeutigkeit von οἶκος; die Fußnote erläutert den im Grußzusammenhang wahrscheinlichen sozialen Sinn.
