source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: de
  text: Du aber bewahre in allem einen klaren Kopf, ertrage Leid, tu das Werk eines Evangelisten und führe deinen Dienst vollständig aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erfülle deinen Dienst ganz.“ Das griechische Verb betont, dass der Dienst vollständig ausgeführt und zu Ende gebracht werden soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Du aber
  rationale: Das ausdrücklich gesetzte Pronomen betont Timotheus; δέ stellt ihn in Kontrast zu den zuvor beschriebenen Menschen. „Du aber“ gibt beides knapp und natürlich wieder.
- source_word: νῆφε
  choice: bewahre … einen klaren Kopf
  rationale: Das Verb bedeutet wörtlich, nüchtern zu sein, wird im Neuen Testament jedoch bildlich für geistige Klarheit, Selbstbeherrschung und Besonnenheit gebraucht. Die deutsche Wendung vermittelt diese Haltung unter Druck, ohne den Satz auf Alkoholabstinenz einzuengen.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die Wendung bezieht sich am natürlichsten auf νῆφε und bewahrt die umfassende, hinsichtlich Situationen oder Zeiten nicht weiter festgelegte Aussage.
- source_word: κακοπάθησον
  choice: ertrage Leid
  rationale: Der Imperativ fordert dazu auf, leidvolle Bedrängnis anzunehmen und standhaft durchzustehen. „Ertrage Leid“ ist gegenwärtiges, würdiges Deutsch und wahrt sowohl das Leiden als auch das Ausharren.
- source_word: ἔργον ποίησον
  choice: tu das Werk
  rationale: Die schlichte idiomatische Verbindung wird ebenso schlicht wiedergegeben und behält die direkte Aufforderung bei.
- source_word: εὐαγγελιστοῦ
  choice: eines Evangelisten
  rationale: Das Substantiv bezeichnet jemanden, der die gute Botschaft verkündet. „Evangelist“ ist im Deutschen etabliert und bildet die unbestimmte griechische Genitivverbindung sachgerecht ab.
- source_word: τὴν διακονίαν σου
  choice: deinen Dienst
  rationale: διακονία bezeichnet einen Dienst oder eine übertragene Aufgabe. „Dienst“ ist im Deutschen natürlich, verständlich und weniger institutionell verengt als „Amt“, bleibt hier aber durch den Kontext klar auf Timotheus’ Evangeliumsauftrag bezogen.
- source_word: πληροφόρησον
  choice: erfülle … ganz
  rationale: Das Verb verlangt, den übertragenen Dienst vollständig auszuführen beziehungsweise zur vollen Erfüllung zu bringen. Das hinzugefügte „ganz“ macht diesen Vollständigkeitsaspekt sichtbar.
theological_decisions:
- issue: Charakter von Timotheus’ διακονία
  choice: „Dienst“ als kontextuell bestimmter Evangeliumsauftrag
  alternative: „Dienstauftrag“ oder „Dienst am Evangelium“
  rationale: Der unmittelbare Zusammenhang bestimmt den Dienst als Verkündigungs- und Leitungsaufgabe, doch der griechische Ausdruck selbst enthält hier keine Amtsbezeichnung. „Dienst“ bewahrt die Breite des Wortes und vermeidet eine konfessionelle Festlegung.
- issue: Bedeutung von εὐαγγελιστής
  choice: „Evangelist“ als Bezeichnung eines Verkündigers der guten Botschaft
  alternative: „Verkündiger der guten Botschaft“
  rationale: Die etablierte Bezeichnung wird beibehalten, ohne daraus eine später definierte kirchliche Amtsstruktur abzuleiten.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Reihe kurzer Imperative spiegelt den eindringlichen Charakter des griechischen Auftrags. „Einen klaren Kopf bewahren“ ist bewusst idiomatisch; „Dienst“ wahrt gegenüber „Amt“ die lexikalische und theologische Offenheit.
