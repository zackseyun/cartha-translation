    rationale: „Erfülle deinen Dienst ganz“ ist möglich, kann im Deutschen aber eher nach dem Erfüllen einer Pflicht klingen. „Führe deinen Dienst vollständig aus“ gibt die Vollständigkeit der Ausführung und den Abschlussaspekt des Verbs klarer wieder.
  - severity: low
    issue: Fußnote wiederholt nahezu die beabsichtigte Haupttextaussage
    rationale: Nach der Revision sollte die Fußnote eine echte Alternative wie „Erfülle deinen Dienst ganz“ nennen und den Bedeutungsumfang knapp erläutern.
