  verdict: revise
  source_fidelity: Der Entwurf gibt die vier Imperative, den Kontrast in σὺ δέ und die umfassende Bestimmung ἐν πᾶσιν zutreffend wieder. „Einen klaren Kopf bewahren“ ist eine angemessene idiomatische Wiedergabe des hier bildlich gebrauchten νῆφε. „Dienst“ bewahrt die Offenheit von διακονία. Bei πληροφόρησον ist „erfülle deinen Dienst ganz“ zwar verständlich, bildet den Aspekt des vollständigen Ausführens bzw. Zu-Ende-Bringens jedoch weniger präzise und weniger idiomatisch ab als „führe ... vollständig aus“.
  naturalness: Der Satz ist insgesamt modernes, klares Standarddeutsch und die Imperativfolge funktioniert gut. „Führe deinen Dienst vollständig aus“ ist in diesem Kontext natürlicher und eindeutiger als „erfülle deinen Dienst ganz“.
  terminology: „Evangelist“ ist als etablierte, nicht weiter institutionalisierende Bezeichnung passend. „Dienst“ ist für διακονία sachgerecht und vermeidet eine unnötige Einengung auf ein kirchliches Amt. Die Fußnote sollte die gewählte Formulierung nicht als bloße Alternative wiederholen, sondern eine tatsächliche lexikalische Alternative bieten.
  issues:
