source:
  edition: SBLGNT
  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: de
  text: Ich habe den guten Kampf gekämpft, den Lauf vollendet und den Glauben bewahrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe die Treue bewahrt« oder »Ich bin treu geblieben.« Das griechische τὴν πίστιν kann den Glauben, möglicherweise den christlichen Glauben, bezeichnen, aber auch die bewahrte Treue beziehungsweise Glaubenstreue.'
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: den guten Kampf
  rationale: ἀγών bezeichnet einen Kampf, Wettkampf oder ein Ringen. »Den guten Kampf« ist im Deutschen natürlich und bewahrt sowohl die kämpferische Metapher als auch die Wertung durch καλός.
- source_word: ἠγώνισμαι
  choice: habe … gekämpft
  rationale: Das Perfekt von ἀγωνίζομαι bezeichnet einen vollbrachten Kampf mit fortdauernder Bedeutung. Das deutsche Perfekt gibt dies idiomatisch wieder.
- source_word: δρόμον
  choice: den Lauf
  rationale: δρόμος kann die Laufbahn oder den Wettlauf bezeichnen. »Lauf« erhält das athletische Bild und kann zugleich den vollendeten Lebens- und Dienstweg anklingen lassen, ohne ihn ausdrücklich festzulegen.
- source_word: τετέλεκα
  choice: vollendet
  rationale: Das Perfekt von τελέω bezeichnet das Erreichen des Endes. »Vollendet« ist knapp, würdig und passt idiomatisch zu »den Lauf«.
- source_word: πίστιν
  choice: den Glauben
  rationale: Der Artikel und der Zusammenhang erlauben die Deutung als den bewahrten christlichen Glauben. Zugleich kann πίστις hier Glaubenstreue beziehungsweise Treue bezeichnen; diese echte Mehrdeutigkeit wird in der Fußnote offengehalten.
- source_word: τετήρηκα
  choice: bewahrt
  rationale: τηρέω kann bewahren, halten oder hüten bedeuten. »Bewahrt« lässt sowohl das Festhalten am Glauben als auch dessen treue Wahrung anklingen.
theological_decisions:
- issue: Bedeutung von τὴν πίστιν
  choice: den Glauben
  alternative: die Treue gehalten / treu geblieben
  rationale: »Den Glauben« ist aufgrund des bestimmten Artikels und des pastoralen Kontextes eine naheliegende Lesart. Die Wendung kann jedoch auch die persönliche Glaubenstreue ausdrücken; deshalb wird diese Möglichkeit nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige, parallele Aussage des griechischen Textes bleibt erhalten; das wiederholte Hilfsverb wird im Deutschen aus Gründen natürlicher Satzführung nur beim ersten Glied gesetzt.
