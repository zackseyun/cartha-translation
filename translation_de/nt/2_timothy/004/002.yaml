  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: de
  text: Verkünde das Wort! Steh bereit, ob es gelegen oder ungelegen kommt. Weise zurecht, tadle, ermahne[a] – mit aller Geduld und Unterweisung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ermutige“ oder „fordere eindringlich auf“. Das griechische Verb kann sowohl auffordernd als auch ermutigend gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: Verkünde
  rationale: Der Imperativ bezeichnet das öffentliche, autoritative Bekanntmachen einer Botschaft. „Verkünde“ ist im modernen Deutschen natürlich und bewahrt diesen Sinn.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: Die Formulierung lässt offen, in welchem genauen Verhältnis die apostolische Botschaft, das Evangelium und die zuvor genannten heiligen Schriften stehen. „Das Wort“ wahrt diese inhaltliche Breite.
- source_word: ἐπίστηθι
  choice: Tritt dafür ein
  rationale: Das Verb kann je nach Zusammenhang gegenwärtig sein, bereitstehen, herantreten oder mit Nachdruck bei einer Sache bleiben bedeuten. „Tritt dafür ein“ gibt hier den beharrlichen Handlungsauftrag wieder, ohne ihn nur auf innere Bereitschaft zu verengen.
- source_word: εὐκαίρως ἀκαίρως
  choice: ob es gelegen kommt oder ungelegen
  rationale: Das pointierte Adverbpaar bezeichnet günstige beziehungsweise ungünstige Zeit oder Gelegenheit. Die deutsche Wendung erhält die rhetorische Gegenüberstellung.
- source_word: ἔλεγξον
  choice: Weise zurecht
  rationale: Das Verb umfasst das Aufdecken von Schuld mit dem Ziel der Überführung und Korrektur. „Weise zurecht“ gibt die korrigierende Kraft verständlich wieder.
- source_word: ἐπιτίμησον
  choice: tadle
  rationale: Das Verb bezeichnet einen ernsten, missbilligenden Verweis und ist gegenüber dem vorherigen Korrekturwort schärfer.
- source_word: παρακάλεσον
  choice: ermutige
  rationale: Das Verb kann ermahnen, eindringlich auffordern, ermutigen oder trösten bedeuten. „Ermutige“ ergänzt hier die beiden korrigierenden Imperative, während die Fußnote die auffordernde Bedeutung offenhält.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: mit aller Geduld
  rationale: μακροθυμία bezeichnet geduldiges, langmütiges Verhalten gegenüber Menschen; πάσῃ verstärkt die umfassende Forderung.
- source_word: καὶ διδαχῇ
  choice: und Unterweisung
  rationale: διδαχή bezeichnet Lehre beziehungsweise Unterweisung. „Unterweisung“ macht deutlich, dass die genannten Handlungen mit geduldigem Lehren verbunden sein sollen.
theological_decisions:
- issue: Bedeutungsumfang von „das Wort“
  choice: Die Wendung bleibt unentfaltet als „das Wort“ stehen.
  alternative: die Botschaft; das Evangelium; die Schrift
  rationale: Der Kontext verbindet den Auftrag mit den heiligen Schriften und der apostolischen Verkündigung, doch λόγος wird in diesem Vers nicht ausdrücklich auf nur eine dieser Bezeichnungen eingegrenzt.
- issue: Kraft von παρακάλεσον
  choice: ermutige
  alternative: ermahne; fordere eindringlich auf; sprich zu
  rationale: Das griechische Verb vereint auffordernde und stärkende Aspekte. Der Haupttext hebt die stärkende Seite hervor; die Fußnote bewahrt die auffordernde Möglichkeit.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, eindringlichen Imperativen. Die ausgewogene Reihe aus Korrektur, Tadel und Ermutigung sowie der abschließende Hinweis auf Geduld und Unterweisung bleiben erhalten.
