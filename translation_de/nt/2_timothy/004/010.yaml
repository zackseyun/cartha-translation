  variant: modern standard German
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: de
  text: Denn Demas hat mich verlassen, weil er das gegenwärtige Zeitalter lieb gewonnen hat, und ist nach Thessalonich gegangen; Kreszenz nach Galatien, Titus nach Dalmatien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Bewahrt die begründende Verbindung zur vorausgehenden Aussage und klingt im Deutschen natürlich.
- source_word: ἐγκατέλιπεν
  choice: hat mich verlassen
  rationale: Gibt das schuldhaft gefärbte Zurücklassen wieder, ohne ausdrücklich einen Abfall vom Glauben zu behaupten.
- source_word: ἀγαπήσας
  choice: nachdem er … lieb gewonnen hatte
  rationale: Die partizipiale Verknüpfung bleibt erkennbar; zugleich wird die naheliegende, aber nicht zwingend ausdrücklich markierte Kausalität nicht vollständig festgeschrieben.
- source_word: τὸν νῦν αἰῶνα
  choice: die gegenwärtige Weltzeit
  rationale: „Weltzeit“ erhält sowohl den zeitlichen als auch den ethischen Klang von αἰών und vermeidet eine Verengung auf die physische Welt.
- source_word: ἐπορεύθη
  choice: ist … gegangen / ging
  rationale: Eine schlichte Bewegungsangabe entspricht dem griechischen Verb und passt zur Aufzählung der Reiseziele.
- source_word: Θεσσαλονίκην
  choice: Thessalonich
  rationale: Im Deutschen gebräuchliche Form des Ortsnamens.
- source_word: Κρήσκης
  choice: Kreszenz
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: Γαλατίαν
  choice: Galatien
  rationale: Im Deutschen gebräuchliche Form des Regionsnamens.
- source_word: Τίτος
  choice: Titus
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: Δαλματίαν
  choice: Dalmatien
  rationale: Im Deutschen gebräuchliche Form des Regionsnamens.
theological_decisions:
- issue: Ob Demas’ Weggang als Glaubensabfall oder nur als Verlassen des Paulus wiederzugeben ist
  choice: „hat mich verlassen“ mit negativer Färbung, aber ohne ausdrückliche Aussage über einen endgültigen Glaubensabfall
  alternative: Eine stärkere Formulierung wie „ist vom Glauben abgefallen“
  rationale: Der Vers tadelt Demas’ Liebe zur gegenwärtigen Weltzeit und sein Verlassen des Paulus, erklärt aber nicht ausdrücklich, dass er endgültig vom Glauben abgefallen sei.
- issue: Ob der Weggang von Kreszenz und Titus ebenso negativ wie der von Demas zu verstehen ist
  choice: Für Kreszenz und Titus wird das neutrale Verb „ging“ ergänzt
  alternative: Die griechische Ellipse so wiedergeben, dass „verlassen“ auf alle drei Personen bezogen werden könnte
  rationale: Im Griechischen sind bei Kreszenz und Titus Verben ausgelassen. Die neutrale Ergänzung vermeidet es, die negative Wertung über Demas unbelegt auf die beiden anderen zu übertragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur hält die enge Verbindung von Demas’ Verlassen, seiner Liebe zur gegenwärtigen Weltzeit und seiner Reise fest; bei Kreszenz und Titus wird die griechische Ellipse zur besseren Verständlichkeit behutsam ergänzt.
