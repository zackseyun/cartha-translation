source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: de
  text: Der Herr wird mich vor jeder bösen Tat retten und mich sicher in sein himmlisches Reich bringen.[a] Ihm sei die Herrlichkeit für immer und ewig.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Näher am griechischen Wortlaut: „und mich in sein himmlisches Reich retten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in die Zeitalter der Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: wird … retten
  rationale: ῥύομαι bezeichnet das Retten oder Befreien aus einer Bedrohung. „Retten“ ist gegenwärtig, verständlich und lässt offen, auf welche Weise der Herr aus dem Bösen herausführt.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: aus jedem bösen Tun
  rationale: ἔργον kann „Werk“, „Tat“ oder „Tun“ bedeuten. „Böses Tun“ gibt den moralischen Sinn natürlich wieder, während „aus“ die mit ἀπό bezeichnete Befreiung bewahrt.
- source_word: σώσει εἰς
  choice: mich sicher … bringen
  rationale: σῴζω trägt den Sinn von Rettung und Bewahrung; εἰς bezeichnet hier das Ziel. Die deutsche Wendung gibt die sichere Hinführung idiomatisch wieder, ohne das Zielverhältnis aufzugeben; die wörtlichere Alternative steht in der Fußnote.
- source_word: τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: sein himmlisches Reich
  rationale: βασιλεία kann Königsherrschaft oder Reich bezeichnen. Mit εἰς und dem Adjektiv ἐπουράνιος ist „in sein himmlisches Reich“ im Deutschen klar und natürlich.
- source_word: ᾧ ἡ δόξα
  choice: Ihm sei die Herrlichkeit
  rationale: Die nominale doxologische Formel wird als ehrfürchtige Zuschreibung wiedergegeben, ohne ein im Griechischen nicht ausdrücklich gesetztes Verb inhaltlich zu überladen.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Dies ist die natürliche deutsche Entsprechung der verstärkten griechischen Ewigkeitsformel.
- source_word: ἀμήν
  choice: Amen
  rationale: Die im Deutschen etablierte liturgische Umschrift wird beibehalten.
theological_decisions:
- issue: Verhältnis zwischen Rettung aus bösem Tun und endgültiger Bewahrung
  choice: Die Übersetzung unterscheidet die Rettung aus jedem bösen Tun von der sicheren Hinführung in das himmlische Reich.
  alternative: Den Vers als ausdrückliche Zusage verstehen, Paulus werde vor dem leiblichen Tod bewahrt.
  rationale: Die Verbindung von ῥύσεται mit σώσει εἰς und dem himmlischen Reich erlaubt eine Zuversicht auf endgültige Rettung, ohne ausdrücklich festzulegen, dass Paulus einer Hinrichtung entgehen werde. Die Spannung bleibt erhalten.
- issue: Bedeutung von βασιλεία
  choice: Reich
  alternative: Königsherrschaft
  rationale: „Reich“ passt hier zum durch εἰς bezeichneten Ziel, ohne auszuschließen, dass βασιλεία zugleich Gottes Herrschaft meint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Böses Tun“ vermeidet das heute leicht künstlich wirkende „böses Werk“; „sicher … bringen“ ist idiomatisch, während die Fußnote die ungewöhnliche griechische Verbindung von σῴζω und εἰς sichtbar hält.
