  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur, die Zukunftsformen, die Zielrichtung von εἰς sowie die abschließende Doxologie zuverlässig wieder. „Aus jedem bösen Tun retten“ ist jedoch im Deutschen weniger passend für ἀπὸ παντὸς ἔργου πονηροῦ: Es klingt, als müsse Paulus aus einem bereits ausgeübten Tun herausgeholt werden. „Vor jeder bösen Tat retten“ bildet die Abwendung von jeder bösen Handlung natürlicher ab, ohne die im Ausdruck mögliche näher bestimmte Zuordnung des Bösen aufzulösen.'
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. „Sicher in sein himmlisches Reich bringen“ ist idiomatisch und gibt die mit σώσει εἰς ausgedrückte Rettung bis zum Ziel angemessen wieder. Die Änderung von „aus“ zu „vor“ verbessert die Kollokation deutlich.
  terminology: „Herr“, „himmlisches Reich“, „Herrlichkeit“ und „Amen“ sind angemessen und konsistent. Die Fußnote zu σώσει εἰς kennzeichnet die weniger idiomatische, quellennähere deutsche Möglichkeit zutreffend. Die Ewigkeitsformel ist natürlich wiedergegeben; die Fußnote bewahrt ihre wörtliche Gestalt.
  issues:
  - severity: low
    issue: „aus jedem bösen Tun retten“ ist semantisch und idiomatisch weniger präzise.
    rationale: Bei einer Rettung „aus“ einem Tun liegt im Deutschen nahe, dass die Person bereits in dieses Tun verstrickt ist. Das griechische ἀπό bezeichnet hier schlicht die Rettung beziehungsweise Bewahrung weg von „jeder bösen Tat“. „Vor“ ist im Deutschen die natürliche Verbindung mit „retten“ und wahrt den Sinn.
  revised_text: Der Herr wird mich vor jeder bösen Tat retten und mich sicher in sein himmlisches Reich bringen.[a] Ihm sei die Herrlichkeit für immer und ewig.[b] Amen.
