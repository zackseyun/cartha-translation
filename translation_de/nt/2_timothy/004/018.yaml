revisions:
- from: Der Herr wird mich aus jedem bösen Tun retten und mich sicher in sein himmlisches Reich bringen.[a] Ihm sei die Herrlichkeit für immer und ewig.[b] Amen.
  to: Der Herr wird mich vor jeder bösen Tat retten und mich sicher in sein himmlisches Reich bringen.[a] Ihm sei die Herrlichkeit für immer und ewig.[b] Amen.
  rationale: Die einzige Änderung ersetzt die im Deutschen unnatürliche und potenziell missverständliche Verbindung „aus jedem bösen Tun retten“ durch „vor jeder bösen Tat retten“. Dadurch bleibt die Aussage auf jede böse Handlung bezogen und die Rettung beziehungsweise Bewahrung davon wird klar ausgedrückt. Die übrige Formulierung und die Fußnoten sind quellentreu und idiomatisch.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:43:57Z'
