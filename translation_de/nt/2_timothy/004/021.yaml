source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: de
  text: Bemühe dich, vor dem Winter zu kommen. Es grüßen dich Eubulus, Pudens, Linus, Claudia und alle Brüder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Brüder und Schwestern“ beziehungsweise „alle Glaubensgeschwister“. Im Griechischen steht „Brüder“; in diesem Zusammenhang kann damit die größere Gemeinschaft der Glaubenden gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Bemühe dich
  rationale: Der Aoristimperativ von σπουδάζω fordert zu ernsthaftem, entschlossenem Bemühen auf. „Bemühe dich“ ist im Deutschen natürlich und würdig; die zeitliche Dringlichkeit ergibt sich zusätzlich aus „vor dem Winter“.
- source_word: πρὸ χειμῶνος
  choice: vor dem Winter
  rationale: πρό mit Genitiv bezeichnet einen Zeitpunkt vor einer Jahreszeit. Im Deutschen ist „vor dem Winter“ die idiomatische Wiedergabe.
- source_word: ἐλθεῖν
  choice: zu kommen
  rationale: Der Infinitiv ergänzt Σπούδασον und bezeichnet Timotheus’ Kommen zu Paulus. „Kommen“ gibt ἔρχομαι direkt wieder.
- source_word: Ἀσπάζεταί σε … καὶ …
  choice: Es grüßen dich …
  rationale: ἀσπάζομαι bezeichnet im brieflichen Zusammenhang das Ausrichten eines Grußes. Die zusammenfassende deutsche Konstruktion mit pluralischem Verb gibt die Reihe der grüßenden Personen flüssig wieder.
- source_word: Εὔβουλος
  choice: Eubulus
  rationale: Der Personenname wird in seiner etablierten deutschen Form transliteriert.
- source_word: Πούδης
  choice: Pudens
  rationale: Der Personenname wird entsprechend der etablierten deutschen Bibeltradition als „Pudens“ wiedergegeben.
- source_word: Λίνος
  choice: Linus
  rationale: Der Personenname wird in seiner etablierten deutschen Form transliteriert.
- source_word: Κλαυδία
  choice: Claudia
  rationale: Der Personenname wird in seiner etablierten deutschen Form transliteriert.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: alle Brüder
  rationale: Die griechische Form ist maskuliner Plural und bedeutet wörtlich „alle Brüder“. Da ἀδελφοί im frühchristlichen Sprachgebrauch auch eine gemischte Gemeinschaft von Glaubenden bezeichnen kann, wird diese mögliche weitere Bedeutung in einer Fußnote bewahrt.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφοί bei einer wahrscheinlich größeren christlichen Gemeinschaft
  choice: alle Brüder
  alternative: alle Brüder und Schwestern; alle Glaubensgeschwister
  rationale: Der Haupttext bewahrt die grammatisch maskuline Form des Ausgangstextes. Zugleich wird nicht ausgeschlossen, dass die Bezeichnung hier die gesamte örtliche Gemeinschaft einschließlich Frauen meint; diese echte referenzielle Offenheit wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die knappe persönliche Aufforderung und der briefliche Grußcharakter bleiben erhalten; die Namensreihe wird ohne unnötige Wiederholung von „und“ natürlich formuliert.
