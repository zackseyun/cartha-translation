  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: de
  text: Denn es wird eine Zeit kommen, in der sie die gesunde Lehre[a] nicht ertragen werden, sondern sich nach ihren eigenen Begierden Lehrer über Lehrer suchen werden, wobei ihnen die Ohren jucken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heilsame Unterweisung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „mit juckendem Gehör“. Das Bild beschreibt das Verlangen, das zu hören, was den eigenen Wünschen entspricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: eine Zeit
  rationale: καιρός bezeichnet hier eine kommende Zeit oder Phase; „eine Zeit“ gibt die unbestimmte Form des Griechischen natürlich wieder.
- source_word: ὑγιαινούσης διδασκαλίας
  choice: gesunde Lehre
  rationale: „Gesund“ bewahrt die griechische Metapher, während „Lehre“ διδασκαλία im Kontext verständlich und ohne unnötige konfessionelle Festlegung wiedergibt.
- source_word: οὐκ ἀνέξονται
  choice: nicht ertragen werden
  rationale: ἀνέχομαι bedeutet ertragen, aushalten oder dulden; „nicht ertragen“ ist würdig, geläufig und erhält die Aussage einer ablehnenden Haltung.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: nach ihren eigenen Begierden
  rationale: ἐπιθυμίαι meint hier eigene, das Handeln bestimmende Verlangen. „Begierden“ wahrt die negative Wertung, ohne den Ausdruck auf sexuelles Begehren zu beschränken.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: werden sie sich immer mehr Lehrer suchen
  rationale: Das reflexive „sich“ gibt ἑαυτοῖς wieder; „immer mehr“ vermittelt die Häufung und das Übermaß von ἐπισωρεύω in natürlichem Deutsch.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: weil ihnen die Ohren jucken
  rationale: Die deutsche Wendung bewahrt das anschauliche Bild des Griechischen und bezeichnet das Verlangen nach Aussagen, die man gern hört. Die kausale Verbindung macht die motivierende Funktion des Partizips verständlich.
theological_decisions:
- issue: Wiedergabe von διδασκαλία im Kontext der Pastoralbriefe
  choice: Lehre
  alternative: Unterweisung
  rationale: „Lehre“ ist im Deutschen verständlich und umfasst den Inhalt des Lehrens, ohne eine bestimmte konfessionelle Systematik einzutragen.
- issue: Verhältnis des Partizips κνηθόμενοι zum Hauptsatz
  choice: weil ihnen die Ohren jucken
  alternative: wobei ihnen die Ohren jucken
  rationale: Das Partizip kann begleitend oder begründend verstanden werden. Die gewählte Fassung gibt die naheliegende motivierende Beziehung idiomatisch wieder; die Fußnote bewahrt das Bild und erklärt seine Bedeutung, ohne festzulegen, welche konkreten Aussagen gesucht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gesundheitsmetapher bei ὑγιαίνω und das Bild der juckenden Ohren bleiben erhalten. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
