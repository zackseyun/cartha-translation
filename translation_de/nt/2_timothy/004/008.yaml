id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: de
  text: Von nun an liegt der Kranz der Gerechtigkeit für mich bereit[a]. Ihn wird mir der Herr, der gerechte Richter, an jenem Tag verleihen – und nicht nur mir, sondern auch allen, die sein Erscheinen liebgewonnen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann auch einen Kranz meinen, der als gerechte Anerkennung verliehen wird oder in Gerechtigkeit besteht.
    reason: Bewahrt die Mehrdeutigkeit der griechischen Genitivverbindung ὁ τῆς δικαιοσύνης στέφανος.
lexical_decisions:
- source_word: λοιπὸν
  choice: Von nun an
  rationale: Im Anschluss an den vollendeten Lauf bezeichnet der Ausdruck das, was für Paulus künftig noch aussteht; die zeitliche Bedeutung wird natürlich wiedergegeben.
- source_word: ἀπόκειταί
  choice: liegt … bereit
  rationale: Das Verb bezeichnet etwas, das zurückgelegt beziehungsweise aufbewahrt ist. Die Formulierung bewahrt den gegenwärtigen Zustand und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit „aufbewahrt“.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: der Kranz der Gerechtigkeit
  rationale: „Kranz“ entspricht dem antiken Siegeskranz besser als das heute meist königlich verstandene „Krone“. Die Genitivverbindung bleibt bewusst offen und wird nicht als Lohn für Gerechtigkeit oder als aus Gerechtigkeit bestehender Kranz festgelegt.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: Die übliche deutsche Entsprechung bewahrt sowohl die moralisch-religiöse als auch die forensische Bedeutungsbreite des griechischen Wortes.
- source_word: ἀποδώσει
  choice: wird … verleihen
  rationale: Im Bild des Siegeskranzes bezeichnet das Verb die angemessene Zuerkennung. „Verleihen“ ist idiomatisch und vermeidet den im Deutschen leicht vergeltend klingenden Ausdruck „vergelten“.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: an jenem Tag
  rationale: Dies ist die natürliche deutsche Zeitangabe und bewahrt den endzeitlichen Bezug.
- source_word: ὁ δίκαιος κριτής
  choice: der gerechte Richter
  rationale: Die Apposition kennzeichnet den Herrn als denjenigen, der gerecht urteilt; die formale Nähe zum griechischen Ausdruck bleibt erhalten.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: allen, die … liebgewonnen haben
  rationale: Das Perfekt bezeichnet eine bis in die Gegenwart bestehende Haltung. „Liebgewonnen haben“ drückt diese erworbene und fortdauernde Zuneigung im Deutschen deutlicher aus als das schlichte „geliebt haben“.
- source_word: ἐπιφάνειαν
  choice: Erscheinen
  rationale: Die direkte Wiedergabe erhält den Gedanken des sichtbaren Offenbarwerdens, ohne ihn auf den allgemeineren Begriff „Wiederkunft“ zu verengen.
- source_word: κύριος / αὐτοῦ
  choice: der Herr / sein
  rationale: Der Titel und das rückbezügliche Pronomen werden entsprechend dem griechischen Text wiedergegeben; der Kontext legt Jesus Christus nahe, ohne dass dies paraphrasierend in den Haupttext eingefügt wird.
theological_decisions:
- issue: Bedeutung von „Kranz der Gerechtigkeit“
  choice: Die Genitivverbindung bleibt unaufgelöst.
  alternative: Kranz als Lohn für Gerechtigkeit; Kranz, der in Gerechtigkeit besteht; Kranz der Rechtfertigung oder gerechten Anerkennung
  rationale: Der griechische Genitiv lässt mehrere sachlich verwandte Deutungen zu. Keine davon wird im Haupttext einseitig festgelegt.
- issue: Bezug von „der Herr“
  choice: Der Titel bleibt als „der Herr“ stehen; im Kontext weist er wahrscheinlich auf Jesus Christus.
  alternative: Gott allgemein
  rationale: Das unmittelbar folgende „sein Erscheinen“ spricht im Sprachgebrauch der Pastoralbriefe stark für Christus. Die Übersetzung bewahrt dennoch die Ausdrucksweise des Ausgangstextes.
- issue: Liebe zum Erscheinen
  choice: Als bleibende, bis zur Gegenwart entwickelte Zuneigung wiedergegeben.
  alternative: Ein einmaliger vergangener Akt des Liebens; bloße Erwartung des Erscheinens
  rationale: Das griechische Perfektpartizip bezeichnet eine Haltung, die entstanden ist und fortbesteht, ohne näher festzulegen, wie sie sich äußert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kranz“ macht das antike Bild eines Siegeskranzes verständlich; Gedankenstrich und Satzteilung sorgen trotz der dichten griechischen Syntax für einen natürlichen Lesefluss.
