id: 2TI.4.14
reference: 2 Timothy 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: de
  text: Alexander, der Metallhandwerker,[a] hat mir viel Böses angetan.[b] Der Herr wird ihm nach seinen Taten vergelten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alexander, der Kupferschmied.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „hat mir viel Böses erwiesen“; sinngemäß auch: „hat mir großen Schaden zugefügt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Einige Handschriften lesen: „Der Herr vergelte ihm nach seinen Taten.“'
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: Metallhandwerker
  rationale: Das Wort bezeichnet einen Handwerker, der Metall – häufig Kupfer oder Bronze – bearbeitet. „Metallhandwerker“ ist im heutigen Deutsch verständlich und vermeidet eine nicht gesicherte Festlegung auf ein bestimmtes Metall.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: hat mir viel Böses angetan
  rationale: Die Wendung bezeichnet hier böses beziehungsweise schädigendes Verhalten gegenüber Paulus. Die idiomatische deutsche Formulierung gibt den Sinn klar wieder, ohne die Aussage auf bloßen materiellen Schaden zu verengen.
- source_word: ἀποδώσει
  choice: wird … vergelten
  rationale: Der Futur Indikativ bezeichnet im Haupttext eine künftige Vergeltung. „Vergelten“ bewahrt den Gedanken einer den Taten entsprechenden Erwiderung.
- source_word: κύριος
  choice: der Herr
  rationale: Der bestimmte Ausdruck ὁ κύριος wird entsprechend seiner eindeutigen personalen Verwendung mit „der Herr“ wiedergegeben.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: nach seinen Taten
  rationale: Die Formulierung bleibt eng am griechischen Ausdruck und ist zugleich natürliches modernes Deutsch; sie bezeichnet eine Vergeltung, die sich an seinem Handeln bemisst.
theological_decisions:
- issue: Aussage oder Wunsch bei der Vergeltung durch den Herrn
  choice: Der Herr wird ihm … vergelten
  alternative: Der Herr vergelte ihm …
  rationale: Der Text des SBLGNT bietet ἀποδώσει, einen Futur Indikativ, und formuliert damit eine Aussage. Die abweichende Wunschform wird wegen der handschriftlichen Variante in einer Fußnote bewahrt, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Hauptsatz verwendet die geläufige Wendung „Böses antun“, während die Fußnote die ungewöhnlichere Bildlichkeit des griechischen Verbs erkennen lässt. Die Satzteilung macht die knappe Warnung und die anschließende Aussage über Gottes Vergeltung gut verständlich.
