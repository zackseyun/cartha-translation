  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: de
  text: Denn ich werde bereits als ein Trankopfer ausgegossen[a], und die Zeit meines Aufbruchs[b] ist gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Ich werde bereits ausgegossen.« Das griechische Verb ruft das Bild einer Trankspende hervor, die als Opfer ausgegossen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Abreise« oder »Loslösung«. »Aufbruch« ist hier eine bildhafte Bezeichnung für den Tod.'
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: werde … wie ein Trankopfer ausgegossen
  rationale: Das Verb bezeichnet das Ausgießen einer Trankspende. Die Formulierung macht das Opferbild im Deutschen verständlich, ohne es zur direkten Aussage »ich sterbe« aufzulösen.
- source_word: ἤδη
  choice: bereits
  rationale: Kennzeichnet das Geschehen als schon gegenwärtig beziehungsweise im Gang.
- source_word: καιρός
  choice: Zeit
  rationale: Bezeichnet hier den entscheidenden, eingetretenen Zeitpunkt; »Zeit« ist im Satz natürlich und lässt diesen Zusammenhang erkennen.
- source_word: ἀναλύσεώς
  choice: Aufbruchs
  rationale: ἀνάλυσις kann Aufbruch, Loslösung oder Freigabe bezeichnen. »Aufbruch« gibt das Bild eines Weggehens idiomatisch wieder und bewahrt die verhüllende Rede vom Tod.
- source_word: ἐφέστηκεν
  choice: ist gekommen
  rationale: Das Perfekt beschreibt, dass der entscheidende Zeitpunkt herangekommen und nun gegenwärtig ist.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorhergehenden Zusammenhang.
theological_decisions:
- issue: Bildhafte Beschreibung von Paulus’ bevorstehendem Tod
  choice: Paulus beschreibt seinen bevorstehenden Tod mit dem Bild einer ausgegossenen Trankspende und als »Aufbruch«.
  alternative: Die Aussage könnte allgemeiner auf sein Leiden bezogen oder mit »Ich werde schon geopfert« ausdrücklich gedeutet werden.
  rationale: Die Verbindung von σπένδομαι und ἀνάλυσις weist stark auf den bevorstehenden Tod. Die Übersetzung bewahrt jedoch beide Bilder, statt sie durch die Deutung »Ich werde bald sterben« zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Wie ein Trankopfer« verdeutlicht die im griechischen Verb enthaltene Opfermetapher; »Aufbruch« bleibt verständlich und bewahrt zugleich die bildhafte Offenheit des Ausgangstextes.
