  text: Σπούδασον ἐλθεῖν πρός με ταχέως·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/009.yaml
  text: Make every effort to come to me quickly[a].
translation:
  language: de
  text: Setze alles daran, schnell zu mir zu kommen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bemühe dich, bald zu mir zu kommen.«'
    reason: 'Lexikalische Alternative: σπουδάζω kann mit »sich bemühen« wiedergegeben werden, und ταχέως kann je nach Akzent »schnell« oder »bald« bedeuten.'
lexical_decisions:
- source_word: Σπούδασον
  choice: Setze alles daran
  rationale: Der Aorist-Imperativ von σπουδάζω bezeichnet ernsthaftes, entschlossenes Bemühen. »Setze alles daran« gibt diesen Nachdruck in natürlichem Deutsch wieder, ohne die Bedeutung auf bloße Eile zu verengen.
- source_word: ἐλθεῖν
  choice: zu kommen
  rationale: Der Aorist-Infinitiv von ἔρχομαι hängt von Σπούδασον ab. In Verbindung mit πρός με ist »zu mir zu kommen« die natürliche deutsche Wiedergabe.
- source_word: πρός
  choice: zu
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung auf eine Person hin; zusammen mit »kommen« ist »zu mir« idiomatisch und präzise.
- source_word: με
  choice: mir
  rationale: Das Personalpronomen der ersten Person Singular steht nach πρός im Akkusativ. Die deutsche Präposition »zu« verlangt den Dativ, daher lautet die idiomatische Entsprechung »mir«.
- source_word: ταχέως
  choice: schnell
  rationale: Das Adverb kann Schnelligkeit oder zeitliche Dringlichkeit ausdrücken. »Schnell« hält es von dem bereits durch Σπούδασον bezeichneten entschlossenen Bemühen unterschieden; die mögliche Wiedergabe »bald« wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: 'Modernes, klares und zugleich würdiges Standarddeutsch. Die Formulierung bewahrt die zwei unterscheidbaren Akzente des griechischen Satzes: entschlossenes Bemühen und dringliche Schnelligkeit.'
