  source_fidelity: 'Die Übersetzung gibt alle zentralen Elemente des griechischen Textes sachgerecht wieder: τῇ πρώτῃ μου ἀπολογίᾳ als „bei meiner ersten Verteidigung“, οὐδείς μοι παρεγένετο als „stand mir niemand bei“, ἀλλὰ πάντες με ἐγκατέλιπον als „alle ließen mich im Stich“ und den benediktiven passiven Optativ μὴ αὐτοῖς λογισθείη als „Möge es ihnen nicht angerechnet werden“. Der nicht ausdrücklich genannte Gegenstand des Anrechnens bleibt angemessen implizit.'
