id: 2TI.4.16
reference: 2 Timothy 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: de
  text: Bei meiner ersten Verteidigung stand mir niemand bei[a], sondern alle ließen mich im Stich. Möge es ihnen nicht angerechnet werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »fand sich niemand bei mir ein«; gemeint ist, dass niemand erschien, um Paulus bei seiner Verteidigung zu unterstützen. »Verteidigung« kann hier auch eine erste gerichtliche Anhörung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Es soll ihnen nicht zugerechnet werden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: Verteidigung
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Wort die formelle Verteidigung beziehungsweise verantwortende Rede vor einer Behörde. „Verteidigung“ bewahrt den forensischen Sinn und klingt im Deutschen natürlich.
- source_word: πρώτῃ
  choice: ersten
  rationale: Das Adjektiv bezeichnet die erste Gelegenheit oder Phase der Verteidigung, ohne näher festzulegen, ob es sich um eine Vorverhandlung handelte.
- source_word: παρεγένετο
  choice: stand mir … bei
  rationale: Wörtlich bezeichnet das Verb das Hinzukommen oder Anwesendsein. Mit dem Dativ und in diesem Kontext geht es um persönliche Anwesenheit zur Unterstützung; „stand mir bei“ gibt diese Bedeutung idiomatisch wieder.
- source_word: οὐδείς
  choice: niemand
  rationale: Direkte und stilistisch passende Wiedergabe des verneinten Indefinitpronomens.
- source_word: ἐγκατέλιπον
  choice: ließen mich im Stich
  rationale: Das Verb bezeichnet das Zurücklassen oder Verlassen eines Menschen in einer Notlage. Die deutsche Wendung drückt sowohl das Fortbleiben als auch die versagte Unterstützung klar aus.
- source_word: λογισθείη
  choice: Möge es … nicht angerechnet werden
  rationale: Der passive Optativ mit μή formuliert einen Wunsch. „Anrechnen“ bewahrt das Bild des Zurechnens von Schuld, ohne den nicht ausdrücklich genannten Gegenstand übermäßig zu bestimmen.
theological_decisions:
- issue: Ton und Aussage des abschließenden Wunsches für diejenigen, die Paulus verlassen haben
  choice: „Möge es ihnen nicht angerechnet werden.“ als gebetsähnlicher Wunsch, dass ihnen dieses Verhalten nicht als Schuld zugerechnet wird
  alternative: „Es soll ihnen nicht angerechnet werden.“ als abgeschwächte Aufforderung oder permissive Formulierung
  rationale: Der Aorist Passiv Optativ λογισθείη mit μή drückt am natürlichsten einen Wunsch aus. Die Übersetzung wahrt die Nähe zur Sprache der Vergebung, ohne genauer festzulegen, wer anrechnet oder welche weiteren theologischen Folgen gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gerichtliche Situation bleibt durch „Verteidigung“ erkennbar; „stand mir bei“ und „ließen mich im Stich“ geben die persönliche und soziale Dimension idiomatisch wieder. Der abschließende Optativ wird als feierlicher Wunsch mit „Möge“ erhalten.
