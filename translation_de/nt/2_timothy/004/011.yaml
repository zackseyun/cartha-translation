id: 2TI.4.11
reference: 2 Timothy 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: de
  text: Nur Lukas ist bei mir. Nimm Markus zu dir und bring ihn mit, denn er ist mir für den Dienst[a] nützlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann allgemein „Dienst“ oder „Hilfe“ bedeuten; hier ist wahrscheinlich die Mitarbeit am Dienst für das Evangelium gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: Lukas
  rationale: Die im Deutschen gebräuchliche Form des Personennamens.
- source_word: μόνος
  choice: nur
  rationale: Bringt natürlich und deutlich zum Ausdruck, dass Lukas der einzige bei Paulus verbliebene Begleiter ist.
- source_word: μετ’ ἐμοῦ
  choice: bei mir
  rationale: Gibt die durch μετά mit Genitiv bezeichnete Begleitung in diesem Zusammenhang idiomatisch wieder.
- source_word: Μᾶρκον
  choice: Markus
  rationale: Die im Deutschen gebräuchliche Form des Personennamens.
- source_word: ἀναλαβὼν
  choice: nimm … zu dir
  rationale: Das Partizip bezeichnet, dass Timotheus Markus zunächst aufnehmen beziehungsweise zu sich nehmen soll, bevor er ihn mitbringt.
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: bring ihn mit
  rationale: Gibt die Aufforderung, Markus in der eigenen Begleitung herzubringen, knapp und idiomatisch wieder.
- source_word: γάρ μοι
  choice: denn er ist mir
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ; „mir“ gibt den persönlichen Bezug des Dativs μοι wieder.
- source_word: εὔχρηστος
  choice: nützlich
  rationale: Entspricht der Bedeutung „brauchbar, hilfreich, von Nutzen“ und bleibt nah am griechischen Ausdruck.
- source_word: εἰς διακονίαν
  choice: für den Dienst
  rationale: „Dienst“ bewahrt die mögliche Bedeutungsbreite von διακονία, ohne vorschnell einen förmlichen kirchlichen Dienst oder ein Amt festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von διακονία
  choice: Dienst
  alternative: Dienst am Evangelium; Verkündigungsdienst
  rationale: Der Zusammenhang legt Mitarbeit an Paulus’ Auftrag nahe, doch das griechische Wort selbst kann allgemein Dienst oder Hilfe bezeichnen. Die Hauptübersetzung hält diese Offenheit fest.
translation_notes:
  register: Modernes, klares Standarddeutsch in würdigem Briefstil. Die knappen Sätze und die persönliche Dringlichkeit des griechischen Textes bleiben erhalten.
source_grounding:
  english_pob_role: consult_only
