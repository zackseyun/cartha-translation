  source_fidelity: 'Der deutsche Text gibt alle Satzelemente des griechischen Textes zutreffend wieder: Erastus blieb in Korinth, während Paulus Trophimus krank in Milet zurückließ. Die personale Zuordnung von ἀπέλιπον (»ließ ich«) und das auf Trophimus bezogene Partizip ἀσθενοῦντα (»krank«) sind klar erhalten.'
