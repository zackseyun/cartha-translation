  text: Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ⸀ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: de
  text: Erastus blieb in Korinth; Trophimus aber ließ ich krank in Milet zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Trophimus aber ließ ich in Milet zurück, als er krank war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔραστος
  choice: Erastus
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: ἔμεινεν
  choice: blieb
  rationale: Der Aorist von μένω bezeichnet hier das Bleiben an einem Ort; „blieb“ ist natürlich und präzise.
- source_word: ἐν Κορίνθῳ
  choice: in Korinth
  rationale: Die Präposition ἐν ist hier lokal gebraucht; „in Korinth“ entspricht dem heutigen deutschen Sprachgebrauch.
- source_word: Τρόφιμον
  choice: Trophimus
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet einen leichten Gegensatz zwischen den beiden Reiseangaben; die Nachstellung von „aber“ klingt im Deutschen würdevoll und natürlich.
- source_word: ἀπέλιπον
  choice: ließ ich … zurück
  rationale: Die erste Person Singular des Aorists von ἀπολείπω bedeutet hier, jemanden an einem Ort zurückzulassen. Das Verb wird im Deutschen idiomatisch als trennbares Verb wiedergegeben.
- source_word: ἐν Μιλήτῳ
  choice: in Milet
  rationale: Die Präposition ἐν ist lokal gebraucht; „Milet“ ist die übliche deutsche Namensform.
- source_word: ἀσθενοῦντα
  choice: krank
  rationale: Das präsentische Partizip bezieht sich auf Trophimus und bezeichnet seinen Zustand zu dem Zeitpunkt, als Paulus ihn zurückließ. „krank“ ist im Kontext treffender als das allgemeinere „schwach“.
