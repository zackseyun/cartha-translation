source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: de
  text: 'Ich beschwöre dich eindringlich vor Gott und Christus Jesus, der Lebende und Tote richten wird[a], und bei seiner Erscheinung und seinem Reich[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „der im Begriff ist, Lebende und Tote zu richten“; μέλλω kann bevorstehendes oder künftiges Geschehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, näher an der knappen griechischen Verknüpfung: „und seine Erscheinung und sein Reich“.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Ich beschwöre dich eindringlich
  rationale: Im Zusammenhang des feierlichen Auftrags bezeichnet das Verb eine nachdrückliche, verbindliche Beschwörung. Das im Griechischen unausgedrückte Objekt wird aus dem unmittelbaren Kontext als „dich“ ergänzt.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ gibt knapp und idiomatisch die Bedeutung „in der Gegenwart, im Angesicht von“ wieder.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Christus Jesus
  rationale: Die im Deutschen eingebürgerte Form bewahrt sowohl den Titelcharakter von Χριστός als auch die feierliche Wortstellung des griechischen Textes.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: der … richten wird
  rationale: Die deutsche Futurform gibt die auf das kommende Gericht gerichtete Aussage natürlich wieder. μέλλω kann zusätzlich den Sinn „im Begriff stehen“ oder „dazu bestimmt sein“ tragen; diese Nuance wird in einer Fußnote offengehalten.
- source_word: ζῶντας καὶ νεκρούς
  choice: Lebende und Tote
  rationale: Die substantivierten Formen entsprechen unmittelbar dem Griechischen und bezeichnen umfassend beide Gruppen.
- source_word: ἐπιφάνειαν
  choice: Erscheinung
  rationale: „Erscheinung“ ist die direkte und im eschatologischen Zusammenhang geläufige Wiedergabe, ohne die Art des sichtbaren Offenbarwerdens näher festzulegen.
- source_word: βασιλείαν
  choice: Reich
  rationale: „Reich“ ist die etablierte deutsche Wiedergabe und lässt sowohl Herrschaftsbereich als auch königliche Herrschaft anklingen.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: und bei seiner Erscheinung und seinem Reich
  rationale: Die Akkusative werden als weitere Größen verstanden, bei denen der feierliche Auftrag erteilt wird. Weil die griechische Verknüpfung syntaktisch knapp und mehrdeutig ist, wird die formalere Alternative in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Verbindung Χριστὸς Ἰησοῦ
  choice: Christus Jesus
  alternative: Messias Jesus
  rationale: „Christus Jesus“ ist im modernen Standarddeutsch die natürliche, würdige Form und lässt „Christus“ weiterhin als messianischen Titel erkennen. „Messias Jesus“ würde den Titelcharakter deutlicher aussprechen, wirkt in dieser festen Verbindung jedoch ungewöhnlich.
- issue: Bedeutungsgehalt von μέλλω in der Aussage über das Gericht
  choice: der … richten wird
  alternative: der im Begriff ist, … zu richten; der dazu bestimmt ist, … zu richten
  rationale: Das Futur wahrt den sicheren Zukunftsbezug, ohne einen vom Kontext nicht eindeutig festgelegten unmittelbaren Zeitpunkt zu behaupten. Die mögliche Nuance von Nähe oder Bestimmung bleibt durch die Fußnote sichtbar.
- issue: Syntaktische Funktion von „seine Erscheinung und sein Reich“
  choice: 'als Erweiterung der feierlichen Beschwörungsformel: „bei …“'
  alternative: 'bloße Koordination: „und seine Erscheinung und sein Reich“'
  rationale: Die Ergänzung „bei“ ergibt im Deutschen einen verständlichen feierlichen Auftrag und erklärt die Akkusative plausibel. Die knappe griechische Konstruktion lässt jedoch eine formalere, implizitere Auffassung zu, die nicht verschwiegen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ich beschwöre dich eindringlich“ trägt dem feierlichen Charakter des apostolischen Auftrags Rechnung; „bei seiner Erscheinung und seinem Reich“ bleibt verständlich, während die Fußnote die syntaktische Offenheit des Griechischen bewahrt.
