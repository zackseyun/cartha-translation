id: 2TI.4.22
reference: 2 Timothy 4:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: de
  text: Der Herr sei mit deinem Geist.[a] Die Gnade sei mit euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wechselt die Anrede vom Singular („deinem Geist“) zum Plural („mit euch“).
    reason: Der Numeruswechsel zeigt, dass der erste Segenswunsch Timotheus persönlich gilt, der abschließende Gnadenwunsch jedoch einen weiteren Adressatenkreis einschließt.
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ entspricht dem üblichen neutestamentlichen Gebrauch von κύριος und lässt den im Segensgruß vorausgesetzten bestimmten Bezug bestehen, ohne den Namen Jesus ergänzend einzufügen.
- source_word: μετὰ
  choice: sei mit
  rationale: Im Griechischen fehlt ein ausdrückliches Verb. Der deutsche Segenswunsch verlangt idiomatisch „sei“; damit wird der implizite Wunschcharakter wiedergegeben, ohne zusätzlichen Inhalt einzutragen.
- source_word: πνεύματός
  choice: Geist
  rationale: Der Bezug „deinem“ spricht hier für Timotheus’ menschlichen Geist. Die Kleinschreibung vermeidet eine unnötige Gleichsetzung mit dem Heiligen Geist.
- source_word: σου
  choice: deinem
  rationale: Die Singularform wird bewahrt, da der erste Segenswunsch Timotheus persönlich gilt.
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ ist die sachlich und theologisch angemessene Wiedergabe des paulinischen Segensbegriffs χάρις; „Gunst“ wäre in diesem Schlussgruß zu schwach.
- source_word: ὑμῶν
  choice: euch
  rationale: Das deutsche „euch“ gibt den Plural eindeutig wieder. Ein ergänzendes „allen“ ist nicht nötig und steht nicht ausdrücklich im griechischen Text.
theological_decisions:
- issue: Bezug von „der Herr“
  choice: Der Titel wird als wahrscheinlich auf den Herrn Jesus bezogen verstanden, aber nicht durch die Einfügung seines Namens vereindeutigt.
  alternative: Allgemeiner Bezug auf Gott.
  rationale: In paulinischen Briefschlüssen bezeichnet „der Herr“ häufig Jesus. Die Übersetzung bewahrt jedoch die Ausdrucksweise und mögliche Offenheit des griechischen Textes.
- issue: Wechsel zwischen Singular und Plural
  choice: Der erste Satz richtet sich an Timotheus persönlich, der zweite an eine Mehrzahl von Adressaten.
  alternative: Beide Sätze ausschließlich auf Timotheus beziehen.
  rationale: Das Griechische wechselt ausdrücklich von σου, Singular, zu ὑμῶν, Plural. Dieser literarisch und theologisch bedeutsame Wechsel wird im Deutschen mit „deinem“ und „euch“ erhalten.
translation_notes:
  register: Moderner, würdevoller Segensstil. „Sei mit“ macht den im verblosen griechischen Satz implizierten Wunsch im Deutschen natürlich verständlich. Der Plural „euch“ genügt ohne das im Ausgangstext nicht ausdrücklich vorhandene „allen“.
