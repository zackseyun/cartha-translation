id: 2TI.4.4
reference: 2 Timothy 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: de
  text: Sie werden ihr Ohr von der Wahrheit abwenden und sich den Mythen[a] zuwenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: erfundenen Geschichten; traditionell: Fabeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: der Wahrheit
  rationale: Der bestimmte Artikel wird bewahrt; die Formulierung bleibt bewusst weiter als „der gesunden Lehre“ oder „dem Evangelium“.
- source_word: ἀκοὴν
  choice: ihr Ohr
  rationale: ἀκοή bezeichnet das Hören beziehungsweise das Gehör. Die deutsche Wendung „sein Ohr von etwas abwenden“ gibt das Bild verständlich und würdig wieder; „ihr Hören“ wäre im Deutschen unnatürlich.
- source_word: ἀποστρέψουσιν
  choice: werden ... abwenden
  rationale: Die aktive, willentliche Bewegung weg von der Wahrheit sowie die Futurform werden erhalten.
- source_word: μύθους
  choice: Mythen
  rationale: „Mythen“ ist das direkte, heute verständliche Äquivalent; „Fabeln“ wäre ebenfalls möglich, kann aber enger oder altertümlicher wirken.
- source_word: ἐκτραπήσονται
  choice: sich ... zuwenden
  rationale: Die mediale beziehungsweise passive Form wird idiomatisch wiedergegeben. Im Zusammenhang mit ἐπί bezeichnet sie eine Hinwendung zu den Mythen, ohne eine fremde Verursachung festzulegen.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: von ... und ... den ... zu
  rationale: Die gegensätzlichen Richtungen – weg von der Wahrheit und hin zu den Mythen – werden klar bewahrt; „und“ verbindet die im Deutschen bereits durch die Präpositionen markant kontrastierten Sätze natürlich.
theological_decisions:
- issue: Bedeutung von „der Wahrheit“ im Kontext
  choice: der Wahrheit
  alternative: der gesunden Lehre; der Wahrheit des Evangeliums
  rationale: Obwohl der Kontext an apostolische Unterweisung denken lässt, wird der allgemeinere Ausdruck des griechischen Textes nicht konfessionell oder interpretierend verengt.
- issue: Verantwortlichkeit bei der Hinwendung zu den Mythen
  choice: sich den Mythen zuwenden
  alternative: zu den Mythen abgelenkt werden
  rationale: Die griechische Form lässt eine mediale oder passive Nuance zu. Die gewählte idiomatische Wiedergabe lässt die genaue Frage der Verursachung offen und entspricht dem Bewegungsbild.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „ihr Ohr ... abwenden“ bewahrt das griechische Hörbild, während die parallelen Verben „abwenden“ und „zuwenden“ den Richtungsgegensatz prägnant ausdrücken.
