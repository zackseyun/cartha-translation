  source_fidelity: 'Die Übersetzung gibt die Richtungsbewegung des griechischen μέν...δέ-Gegensatzes präzise wieder: Abwendung von „der Wahrheit“ und Hinwendung zu „den Mythen“. „Ihr Ohr“ ist eine im Deutschen idiomatische Wiedergabe von τὴν ἀκοήν und bewahrt das Hörbild. „Sich den Mythen zuwenden“ ist im Kontext eine natürliche Wiedergabe von ἐπὶ τοὺς μύθους ἐκτραπήσονται, ohne eine externe Verursachung zu behaupten.'
  naturalness: Modernes, würdiges und flüssiges Standarddeutsch. Die Parallelität von „abwenden“ und „zuwenden“ macht den Kontrast klar, ohne die Formulierung unnötig wörtlich wirken zu lassen.
  terminology: „Der Wahrheit“ bewahrt den bestimmten und bewusst nicht näher eingegrenzten Ausdruck ἀλήθεια. „Mythen“ ist die direkte moderne Entsprechung für μύθοι; die Fußnote nennt mit „Fabeln“ eine etablierte Alternative. Namen oder konfessionell spezifizierende Begriffe kommen nicht vor.
