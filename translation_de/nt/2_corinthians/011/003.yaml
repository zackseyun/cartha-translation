source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: de
  text: Ich fürchte aber, dass euer Denken irgendwie von der Aufrichtigkeit und Reinheit, die auf den Messias[a] ausgerichtet sind, abgebracht und verdorben werden könnte, wie die Schlange Eva durch ihre List täuschte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Aufrichtigkeit (auch: Schlichtheit oder ungeteilten Hingabe) und Reinheit gegenüber dem Messias“.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lassen „und Reinheit“ aus.
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Ich fürchte aber, dass … irgendwie … werden könnte
  rationale: Die deutsche Konstruktion gibt die anhaltende Sorge und die durch μή πως ausgedrückte befürchtete Möglichkeit natürlich wieder.
- source_word: ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν
  choice: wie die Schlange Eva … täuschte
  rationale: „Schlange“ bewahrt den Bezug auf Genesis; „täuschte“ gibt den Kern des Verbs klar wieder.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: durch ihre List
  rationale: Die Präpositionalphrase bezeichnet hier das Mittel; „List“ vermittelt die betrügerische Schlauheit von πανουργία.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: euer Denken … verdorben … werden könnte
  rationale: „Euer Denken“ gibt den kollektiven Plural νοήματα idiomatisch wieder; die Passivform und die Möglichkeit des schädlichen Verderbens bleiben erhalten.
- source_word: ἀπὸ τῆς ἁπλότητος καὶ τῆς ἁγνότητος
  choice: von der Aufrichtigkeit und Reinheit … abgebracht
  rationale: Mit „abgebracht“ wird die durch ἀπό bezeichnete Entfernung im Deutschen deutlich. „Aufrichtigkeit“ bewahrt den ethischen Sinn von ἁπλότης, während „Reinheit“ ἁγνότης angemessen wiedergibt.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: gegenüber dem Messias
  rationale: Die Formulierung bezieht beide Eigenschaften auf die auf Christus gerichtete Haltung; Χριστός wird hier als Titel mit „Messias“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστόν
  choice: dem Messias
  alternative: Christus
  rationale: Χριστός hat hier titularen Gehalt. „Messias“ macht diesen Sinn im modernen Deutsch transparent, ohne die Person anders zu bestimmen.
- issue: Bedeutung von ἁπλότης
  choice: Aufrichtigkeit
  alternative: Schlichtheit; Einfalt; ungeteilte Hingabe
  rationale: Im Zusammenhang bezeichnet das Wort eine unverstellte, ungeteilte Ausrichtung. „Aufrichtigkeit“ ist verständlich und vermeidet die heute leicht abwertende Bedeutung von „Einfalt“; die wichtige Nuance ungeteilter Hingabe wird in der Fußnote erhalten.
- issue: Textvariante καὶ τῆς ἁγνότητος
  choice: „und Reinheit“ im Haupttext aufgenommen
  alternative: Auslassung von „und Reinheit“
  rationale: Der vorgegebene SBLGNT-Text enthält die Wörter; die kürzere Lesart wird als Textvariante in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält den Vergleich mit Eva klar zusammen; „euer Denken“ ist natürlicher als der formale Plural „eure Gedanken“, und „abgebracht“ verdeutlicht die im Griechischen ausgedrückte Entfernung von einer auf den Messias gerichteten Haltung.
