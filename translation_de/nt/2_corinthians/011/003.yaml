revisions:
- from: Ich fürchte aber, dass, wie die Schlange Eva durch ihre List täuschte, auch euer Denken irgendwie verdorben und von der Aufrichtigkeit und Reinheit gegenüber dem Messias[a] abgebracht werden könnte.[b]
  to: Ich fürchte aber, dass euer Denken irgendwie von der Aufrichtigkeit und Reinheit, die auf den Messias[a] ausgerichtet sind, abgebracht und verdorben werden könnte, wie die Schlange Eva durch ihre List täuschte.[b]
  rationale: Die Revision erhält alle Bestandteile des SBLGNT-Textes, formuliert die befürchtete Abwendung und Verderbnis im Deutschen jedoch enger als einen zusammengehörigen Vorgang. Die Relativkonstruktion verdeutlicht, dass die Ausrichtung auf den Messias beide genannten Eigenschaften bestimmt. Die Fußnotenanker bleiben an den einschlägigen Textstellen; die Variante zu „und Reinheit“ bleibt dokumentiert.
