review_pass:
  verdict: revise
  source_fidelity: Der Entschluss zur Fortsetzung (ποιῶ καὶ ποιήσω), die doppelte ἀφορμή und die Finalstruktur sind grundsätzlich erfasst. „suchen“ schwächt jedoch θέλω („wollen/begehren“) ab, und „als solche dastehen“ ist gegenüber dem passiven εὑρεθῶσιν stärker deutend als nötig.
  naturalness: Der Entwurf ist überwiegend verständlich, doch „denen ... diesen Anlass zu nehmen“ ist semantisch und stilistisch weniger klar, weil „Anlass“ im Deutschen leicht als Grund verstanden wird. Die Formulierung mit „Gelegenheit“ und „befunden werden“ ist natürlicher und näher am Satzbau des Griechischen.
  terminology: „Gelegenheit“ trifft ἀφορμή in diesem Zusammenhang besser als „Anlass“ und bewahrt die Wiederholung. Die Fußnote sollte die möglichen Nuancen „Anlass“ und „Vorwand“ nennen. „Befunden werden“ gibt εὑρεθῶσιν angemessen wieder, ohne eine konkrete Art der Prüfung einzutragen.
  issues:
  - severity: medium
    issue: θέλοντες wird mit „suchen“ wiedergegeben.
    rationale: θέλοντες bedeutet primär „die wollen/begehren“. Zwar kann „suchen“ im Kontext plausibel sein, fügt aber eine aktive Suchhandlung hinzu und schwächt den Wortlaut. „eine Gelegenheit haben wollen“ erhält die Aussage ohne diese Verschiebung.
  - severity: medium
    issue: „als solche dastehen“ deutet εὑρεθῶσιν aus.
    rationale: Das Passiv εὑρεθῶσιν bedeutet „befunden werden/sich erweisen“. „Dastehen“ ist möglich, legt aber stärker eine Bewertung oder öffentliche Wahrnehmung nahe. Die direkte passive Wiedergabe wahrt die Offenheit.
  - severity: low
    issue: „Anlass“ ist als Hauptwiedergabe von ἀφορμή weniger präzise.
    rationale: „Anlass“ kann einen Grund oder Auslöser bezeichnen; hier geht es um eine entzogene Möglichkeit bzw. Gelegenheit. „Gelegenheit“ ist im Deutschen klarer und lässt „Vorwand“ als kontextuelle Alternative offen.
  revised_text: Was ich aber tue, werde ich auch weiterhin tun, um denen, die eine Gelegenheit haben wollen, die Gelegenheit zu nehmen, damit sie in dem, dessen sie sich rühmen, als solche befunden werden, die ebenso sind wie wir.
  revised_footnotes:
  - marker: a
    text: Oder „Anlass“ oder „Vorwand“; ebenso bei der zweiten Wiedergabe von „Gelegenheit“ (griechisch ἀφορμή).
    reason: lexical_alternative
