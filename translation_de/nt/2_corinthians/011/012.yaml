source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: de
  text: Was ich aber tue, werde ich auch weiterhin tun, um denen, die eine Gelegenheit haben wollen, die Gelegenheit zu nehmen, damit sie in dem, dessen sie sich rühmen, als solche befunden werden, die ebenso sind wie wir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Was ich aber tue, werde ich auch weiterhin tun
  rationale: Präsens und Futur bezeichnen Paulus’ gegenwärtiges Handeln und seinen Entschluss, daran festzuhalten. „Weiterhin“ gibt diesen Zusammenhang idiomatisch wieder.
- source_word: ἐκκόψω
  choice: diesen Anlass zu nehmen
  rationale: Das Verb bedeutet wörtlich „abschneiden“ und hier übertragen, jemandem eine Möglichkeit oder Grundlage zu entziehen. Die deutsche Wendung ist natürlich und bewahrt die Zielrichtung.
- source_word: ἀφορμή
  choice: Anlass
  rationale: ἀφορμή kann Gelegenheit, Anlass, Ausgangspunkt oder Vorwand bedeuten. „Anlass“ ist im Deutschen hinreichend neutral und lässt die genaue polemische Nuance offen.
- source_word: τῶν θελόντων ἀφορμήν
  choice: denen, die einen Anlass suchen
  rationale: Die Formulierung erhält die zugespitzte Aussage und gibt θέλω kontextgerecht mit „suchen“ wieder, ohne den Gegenstand näher festzulegen.
- source_word: ἐν ᾧ καυχῶνται
  choice: in dem, dessen sie sich rühmen
  rationale: Die Wendung bezeichnet den Bereich oder Sachverhalt ihres Rühmens und bleibt bewusst allgemein.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: als solche dastehen, die genauso sind wie wir
  rationale: εὑρεθῶσιν bezeichnet, wie sie sich bei einer Prüfung tatsächlich erweisen beziehungsweise dastehen. Der Vergleich mit Paulus und seinen Mitarbeitern bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Art des von Paulus’ Gegnern gesuchten ἀφορμή
  choice: Im Haupttext neutral mit „Anlass“ wiedergegeben.
  alternative: „Gelegenheit“ oder polemischer „Vorwand“
  rationale: Der Kontext ist polemisch, doch das Substantiv allein legt „Vorwand“ nicht zwingend fest. Die neutrale Wiedergabe bewahrt die Offenheit; die Alternativen stehen in der Fußnote.
- issue: Sinn des Vergleichs καθὼς καὶ ἡμεῖς
  choice: Die Aussage bleibt als beabsichtigtes Gleichsein mit Paulus und seinen Mitarbeitern formuliert.
  alternative: Explizite Deutung als Gleichheit hinsichtlich unentgeltlicher Verkündigung oder apostolischer Arbeit
  rationale: Der unmittelbare Vers benennt den genauen Vergleichspunkt nicht ausdrücklich. Eine Konkretisierung würde die im Griechischen bestehende Spannung auflösen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit natürlicher Satzführung. Die Wiederholung von ἀφορμή wird durch „Anlass … diesen Anlass“ sichtbar gehalten; die polemische Mehrdeutigkeit wird in der Fußnote bewahrt.
