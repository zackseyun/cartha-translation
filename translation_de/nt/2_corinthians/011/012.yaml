- from: Was ich aber tue, werde ich auch weiterhin tun, um denen, die einen Anlass[a] suchen, diesen Anlass zu nehmen, damit sie in dem, dessen sie sich rühmen, als solche dastehen, die genauso sind wie wir.
  to: Was ich aber tue, werde ich auch weiterhin tun, um denen, die eine Gelegenheit haben wollen, die Gelegenheit zu nehmen, damit sie in dem, dessen sie sich rühmen, als solche befunden werden, die ebenso sind wie wir.
  rationale: Die Revision gibt θέλοντες mit „haben wollen“ wieder, erhält die zweimalige Verwendung von ἀφορμή mit „Gelegenheit“ und ersetzt die interpretativere Wendung „als solche dastehen“ durch das dem griechischen Passiv entsprechende „als solche befunden werden“. Die Vergleichsaussage bleibt bewusst allgemein.
