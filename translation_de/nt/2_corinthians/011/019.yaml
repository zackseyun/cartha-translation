translation:
  language: de
  text: Denn ihr ertragt die Unvernünftigen gern[a] – ihr, die ihr klug seid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „duldet die Unvernünftigen gern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Paulus spricht ironisch: Der Kontrast zwischen den „Unvernünftigen“ und den als klug Angeredeten macht den Tadel deutlich; im Zusammenhang sind damit die von den Korinthern geduldeten Leiter gemeint.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡδέως
  choice: gern
  rationale: Das Adverb bezeichnet bereitwilliges oder erfreutes Hinnehmen. „Gern“ ist im modernen Deutsch natürlich und trägt hier den ironischen Ton.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion führt die Begründung oder Erläuterung zum vorhergehenden Gedanken ein; „denn“ bewahrt diese Verknüpfung knapp und idiomatisch.
- source_word: ἀνέχεσθε
  choice: ertragt
  rationale: Das Verb bedeutet, jemanden auszuhalten oder zu dulden. „Ertragt“ ist prägnant, würdig und lässt die Alternative „duldet“ offen.
- source_word: τῶν ἀφρόνων
  choice: die Unvernünftigen
  rationale: Der substantivierte Ausdruck bezeichnet unverständige oder törichte Personen. „Die Unvernünftigen“ bewahrt den direkten Gegensatz zu φρόνιμοι, ohne das im heutigen Deutsch besonders harte Schimpfwort „Narren“ zu verwenden.
- source_word: φρόνιμοι
  choice: klug
  rationale: Das Wort bezeichnet kluge, verständige oder besonnene Menschen. „Klug“ bildet einen natürlichen Gegensatz zu „unvernünftig“ und lässt Paulus’ Ironie erkennen.
- source_word: ὄντες
  choice: die ihr doch … seid
  rationale: Das Partizip wird als Relativkonstruktion wiedergegeben. „Doch“ macht den im Zusammenhang erkennbaren ironischen Kontrast verständlich, ohne ihn zu einer ausdrücklich kausalen oder konzessiven Aussage festzulegen.
theological_decisions:
- issue: Paulus’ ironische Anrede an die Korinther
  choice: Die Aussage bleibt formal eine Bezeichnung der Korinther als klug; Gedankenstrich und Ausrufezeichen lassen den ironischen Gegensatz hervortreten.
  alternative: 'Die Ironie ausdrücklich paraphrasieren, etwa: „weil ihr euch ja für so klug haltet“.'
  rationale: Der griechische Text sagt nicht ausdrücklich, dass die Korinther sich selbst für klug halten. Die Übersetzung sollte die Ironie erkennbar machen, aber diese Deutung nicht in den Haupttext eintragen.
- issue: Semantische Beziehung des Partizips ὄντες
  choice: Mit „die ihr doch klug seid“ wird die partizipiale Aussage bewahrt, ohne sie eindeutig kausal oder konzessiv festzulegen.
  alternative: „weil ihr klug seid“ oder „obwohl ihr klug seid“.
  rationale: Das Partizip lässt die genaue logische Beziehung unausgesprochen; diese echte Mehrdeutigkeit soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung und Zeichensetzung tragen Paulus’ scharfe Ironie, während die Fußnoten die lexikalische Alternative und den rhetorischen Zusammenhang erläutern.
