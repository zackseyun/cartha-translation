  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: de
  text: Denn wenn jemand kommt und einen anderen Jesus verkündet, den wir nicht verkündet haben, oder wenn ihr einen anderen Geist[a] empfangt, den ihr nicht empfangen habt, oder ein anderes Evangelium annehmt, das ihr nicht angenommen habt, dann ertragt ihr das nur zu bereitwillig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen andersartigen Geist“. Das griechische Wort kann „anderer“ oder „andersartig“ bedeuten. Wer oder was mit diesem Geist genau gemeint ist, bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „dann ertragt ihr es gut“. Die Aussage ist im Zusammenhang wahrscheinlich ironisch: Die Korinther dulden eine solche Botschaft bereitwillig.'
    reason: tone_and_lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν γὰρ
  choice: Denn wenn
  rationale: Die Wendung leitet eine begründende Bedingung ein. „Denn wenn“ gibt den argumentativen Zusammenhang natürlich wieder, ohne die griechischen Partikeln unnötig nachzuahmen.
- source_word: ὁ ἐρχόμενος
  choice: jemand kommt
  rationale: Das substantivierte Präsenspartizip bezeichnet hier allgemein eine Person, die bei den Korinthern auftritt. „Jemand kommt“ ist idiomatisches modernes Deutsch und bewahrt den im Zusammenhang unbestimmten Bezug.
- source_word: ἄλλον Ἰησοῦν
  choice: einen anderen Jesus
  rationale: ἄλλος bezeichnet hier einen weiteren beziehungsweise anders dargestellten Jesus. Die Formulierung wahrt, dass dieselbe Namensbezeichnung verwendet wird, aber eine abweichende Verkündigung gemeint ist.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: verkündet / verkündet haben
  rationale: „Verkünden“ gibt das öffentliche Bekanntmachen von κηρύσσω angemessen wieder und funktioniert in beiden Satzteilen natürlich.
- source_word: πνεῦμα ἕτερον
  choice: einen andersartigen Geist
  rationale: ἕτερος hebt im Zusammenhang den Gegensatz zu dem zuvor empfangenen Geist hervor. „Andersartig“ macht den qualitativen Unterschied sichtbar, ohne den genauen Bezug des Geistes festzulegen.
- source_word: λαμβάνετε / ἐλάβετε
  choice: empfangt / empfangen habt
  rationale: λαμβάνω bezeichnet hier das Empfangen dessen, was vermittelt wird. Die einheitliche Wiedergabe wahrt die bewusste Wiederholung des griechischen Textes.
- source_word: εὐαγγέλιον ἕτερον
  choice: ein andersartiges Evangelium
  rationale: „Evangelium“ ist die etablierte und präzise Wiedergabe von εὐαγγέλιον. „Andersartig“ unterstreicht den sachlichen Gegensatz zur zuvor angenommenen Botschaft.
- source_word: ἐδέξασθε
  choice: angenommen habt
  rationale: δέχομαι kann ein annehmendes Aufnehmen bezeichnen. „Annehmen“ bleibt idiomatisch und unterscheidet sich sinnvoll vom vorangehenden λαμβάνω, „empfangen“.
- source_word: καλῶς ἀνέχεσθε
  choice: dann lasst ihr euch das nur allzu bereitwillig gefallen
  rationale: 'ἀνέχομαι bedeutet, etwas zu ertragen oder sich gefallen zu lassen. καλῶς ist hier im Kontext ironisch: Paulus tadelt die auffällige Bereitschaft der Korinther, eine abweichende Verkündigung zu dulden. „Nur allzu bereitwillig“ macht diesen Ton verständlich, ohne den Sinn auszubauen.'
theological_decisions:
- issue: Bezug von πνεῦμα ἕτερον
  choice: Allgemein als „einen andersartigen Geist“ wiedergegeben
  alternative: eine verfälschte Darstellung des Heiligen Geistes; ein dämonischer Geist; eine andere geistliche Haltung oder Erfahrung
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, welche dieser Möglichkeiten gemeint ist. Die Übersetzung bewahrt diese theologische Offenheit.
- issue: Ton von καλῶς ἀνέχεσθε
  choice: Als ironischer Tadel wiedergegeben
  alternative: wörtliches Lob oder neutrale Feststellung
  rationale: Der Zusammenhang zeigt, dass Paulus die Korinther wegen ihrer Duldsamkeit gegenüber rivalisierender Verkündigung kritisiert. Die Formulierung lässt den ironischen Ton erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der dreifachen griechischen Gegenüberstellung, bleibt aber durch die abschließende Folgerung gut verständlich. Kirchlich vertraute Kernbegriffe wie „Jesus“, „Geist“ und „Evangelium“ bleiben erhalten; konfessionelle Deutungen werden nicht eingetragen.
