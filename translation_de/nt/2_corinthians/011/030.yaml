  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: de
  text: Wenn ich mich rühmen muss, will ich mich dessen rühmen, was zu meiner Schwäche gehört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „will ich mich der Dinge meiner Schwäche rühmen“; idiomatischer auch: „will ich mich meiner Schwächen rühmen“. Die ungewöhnliche griechische Wendung kann Schwächen selbst oder Dinge und Umstände bezeichnen, die zu Paulus’ Schwäche gehören.'
    reason: Die Fußnote erläutert die ungewöhnliche Genitivkonstruktion und wahrt ihre Bedeutungsspannweite.
lexical_decisions:
- source_word: Εἰ
  choice: Wenn
  rationale: Bewahrt die Form der griechischen Bedingung, ohne sie vorschnell kausal als „da“ oder „weil“ auszulegen.
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: mich rühmen / will ich mich … rühmen
  rationale: „Sich rühmen“ ist die natürliche und im paulinischen Sprachgebrauch etablierte deutsche Entsprechung; die Wiederholung erhält den rhetorischen Parallelismus.
- source_word: δεῖ
  choice: muss
  rationale: Gibt die vom unpersönlichen Verb ausgedrückte Notwendigkeit knapp und kräftig wieder.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: dessen …, was meine Schwäche zeigt
  rationale: Die substantivierte neutrale Mehrzahl bezeichnet Dinge oder Umstände, die zu Paulus’ Schwäche gehören beziehungsweise sie erkennen lassen. Die Formulierung ist im Deutschen verständlich, ohne die Wendung vollständig zu „meinen Schwächen“ einzuebnen.
- source_word: ἀσθενείας
  choice: Schwäche
  rationale: „Schwäche“ ist die klare, kontextgerechte Wiedergabe und umfasst mehr als bloße körperliche Gebrechlichkeit.
theological_decisions:
- issue: Art von Paulus’ Rühmen
  choice: Die paradoxe Ausrichtung des Rühmens auf das, was seine Schwäche zeigt, bleibt ohne dogmatische Ausdeutung stehen.
  alternative: „Ich will mich meiner Schwächen rühmen“ oder eine erklärende Umschreibung des theologischen Sinns.
  rationale: Der Vers stellt gewöhnlichem Rühmen ein Rühmen im Bereich der Schwäche gegenüber. Die Übersetzung soll diese Spannung bewahren und nicht durch Kommentar auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewöhnliche griechische Genitivkonstruktion wird im Haupttext verständlich wiedergegeben; die Fußnote dokumentiert die wörtlichere Form und die idiomatische Alternative.
