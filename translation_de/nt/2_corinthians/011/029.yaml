  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: de
  text: Wer ist schwach, ohne dass auch ich schwach bin? Wer wird zu Fall gebracht, ohne dass ich brenne?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ich brenne nicht?“ Das griechische Bild kann starke innere Erregung ausdrücken, etwa Schmerz, Eifer oder Empörung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: ist schwach / bin schwach
  rationale: ἀσθενέω bezeichnet Schwäche in einem weiten körperlichen, sozialen oder geistlichen Sinn. „Schwach“ bewahrt diese Bedeutungsbreite und bringt zugleich Paulus’ solidarische Anteilnahme zum Ausdruck.
- source_word: σκανδαλίζεται
  choice: kommt zu Fall
  rationale: Das Passiv beschreibt bildhaft, dass jemand zu Fall gebracht beziehungsweise in geistliche oder moralische Gefahr geführt wird. Die deutsche Wendung ist natürlich und lässt offen, ob Anstoß, Sünde oder Abfall gemeint ist.
- source_word: πυροῦμαι
  choice: brenne
  rationale: Das Verb bedeutet wörtlich „brennen“ beziehungsweise „in Brand gesetzt werden“ und bezeichnet hier starke innere Erregung. Die unergänzte Metapher vermeidet es, diese eindeutig als Empörung, Schmerz oder Eifer festzulegen.
- source_word: τίς
  choice: wer
  rationale: τίς leitet zwei rhetorische Fragen über Personen ein; „wer“ ist die direkte und natürliche Entsprechung.
- source_word: καὶ οὐκ ἐγώ
  choice: ohne dass auch ich …
  rationale: Die deutsche Konstruktion gibt die enge solidarische Beteiligung wieder und hebt mit „auch ich“ das ausdrücklich gesetzte ἐγώ hervor, ohne unnatürlich zu klingen.
theological_decisions:
- issue: Art von Paulus’ Reaktion in πυροῦμαι
  choice: Die Metapher „brennen“ bleibt im Haupttext ohne Festlegung auf eine bestimmte Emotion erhalten.
  alternative: „vor Empörung brennen“, „vor Schmerz brennen“ oder „innerlich entflammt sein“
  rationale: Der Text betont Paulus’ intensive persönliche Anteilnahme, bestimmt aber nicht eindeutig, ob sein inneres Brennen vor allem Empörung, Schmerz oder Eifer ausdrückt. Die offene Metapher bewahrt diese Spannung.
- issue: Bedeutungsumfang von σκανδαλίζεται
  choice: „kommt zu Fall“ bewahrt das Bild eines geistlichen oder moralischen Sturzes.
  alternative: „nimmt Anstoß“, „wird zur Sünde verleitet“ oder „wird zu Fall gebracht“
  rationale: Das griechische Passiv lässt sowohl die Einwirkung anderer als auch das erfahrene Straucheln erkennen, ohne das genaue Ergebnis abschließend zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen rhetorischen Fragen werden idiomatisch mit „ohne dass“ gestaltet; die bildhafte und in ihrer emotionalen Nuance offene Aussage „ich brenne“ bleibt erhalten.
