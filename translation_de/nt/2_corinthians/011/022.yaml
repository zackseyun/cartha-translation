  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: de
  text: Sind sie Hebräer? Ich auch. Sind sie Israeliten? Ich auch. Sind sie Abrahams Nachkommen[a]? Ich auch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Abrahams Same“. Das griechische Wort steht im Singular und wird kollektiv gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: Hebräer
  rationale: Die etablierte ethnisch-religiöse Bezeichnung bewahrt sowohl den Bezug auf jüdische Herkunft und Identität als auch die knappe rhetorische Parallelität.
- source_word: κἀγώ
  choice: Ich auch
  rationale: Die knappe Verbindung aus καί und ἐγώ wird im Deutschen idiomatisch und betont wiedergegeben; die dreimalige Wiederholung erhält Paulus’ zugespitzten Rhythmus.
- source_word: Ἰσραηλῖται
  choice: Israeliten
  rationale: Die Bezeichnung für Angehörige Israels als Bundesvolk bleibt von „Hebräer“ und „Abrahams Nachkommen“ unterschieden.
- source_word: σπέρμα Ἀβραάμ
  choice: Abrahams Nachkommen
  rationale: Diese Formulierung ist im heutigen Deutsch natürlich und gibt den kollektiven Sinn wieder. Der Singular und die Bildlichkeit von σπέρμα werden in der Fußnote kenntlich gemacht.
- source_word: εἰσιν
  choice: Sind sie
  rationale: Die Kopula wird in den jeweils eingeleiteten rhetorischen Fragen ausdrücklich wiedergegeben; in den knappen Antworten ist sie gemäß natürlichem deutschen Sprachgebrauch elliptisch enthalten.
theological_decisions:
- issue: Unterscheidung der drei Bezeichnungen jüdischer Identität
  choice: Die drei Bezeichnungen „Hebräer“, „Israeliten“ und „Abrahams Nachkommen“ werden getrennt beibehalten.
  alternative: Alle drei Ausdrücke unter einer allgemeinen Bezeichnung wie „Juden“ oder „Nachkommen Abrahams“ zusammenfassen.
  rationale: Die Häufung überlappender, aber nicht völlig gleichbedeutender Identitäts- und Herkunftsbezeichnungen trägt Paulus’ Argument. Eine Vereinheitlichung würde diese rhetorische und sachliche Abstufung einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Fragen und die dreimal wiederholte elliptische Antwort „Ich auch“ bewahren den energischen, zugespitzten Ton des griechischen Textes. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die lexikalische Erläuterung bezieht.
