  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: de
  text: Warum? Weil ich euch nicht liebe? Gott weiß.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gott weiß.« Dem Zusammenhang nach ist die unausgesprochene Antwort, dass Paulus sie liebt; im Griechischen bleibt sie jedoch unausgesprochen.'
    reason: Die Fußnote erläutert die griechische Ellipse und die kontextuell naheliegende Antwort, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: διὰ τί
  choice: Warum?
  rationale: Die knappe, idiomatische Frage gibt die rhetorische Kraft des griechischen Ausdrucks unmittelbar wieder.
- source_word: ὅτι
  choice: Weil
  rationale: Nach »Warum?« leitet ὅτι hier die als Frage formulierte mögliche Begründung ein; »weil« entspricht dem natürlichen deutschen Gedankengang.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: ich euch nicht liebe
  rationale: Die Verneinung, das Verb »lieben« und das direkte Objekt werden vollständig und natürlich wiedergegeben.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Übliche deutsche Wiedergabe von θεός; der griechische Artikel wird beim Eigennamengebrauch im Deutschen nicht ausgedrückt.
- source_word: οἶδεν
  choice: weiß es
  rationale: Das deutsche »es« verweist auf die im Kontext stehende Frage, ohne die im Griechischen unausgesprochene Antwort ausdrücklich zu ergänzen.
theological_decisions:
- issue: Ob die positive Antwort auf die rhetorische Frage im Schlusssatz ausdrücklich ergänzt werden soll
  choice: Gott weiß es.
  alternative: Gott weiß, dass ich euch liebe.
  rationale: Der griechische Text sagt lediglich »Gott weiß«. »Es« ermöglicht idiomatisches Deutsch, bewahrt aber die Ellipse und vermeidet, die kontextuell naheliegende positive Antwort in den Haupttext einzutragen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die beiden rhetorischen Fragen bleiben erhalten; die abschließende Berufung auf Gottes Wissen wird idiomatisch, aber mit bewahrter inhaltlicher Offenheit formuliert.
