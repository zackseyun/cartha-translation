id: 2CO.11.9
reference: 2 Corinthians 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: de
  text: Und als ich bei euch war und Mangel litt, fiel ich niemandem zur Last[a]; denn die Brüder[b], die aus Mazedonien kamen, glichen aus, was mir fehlte. In jeder Hinsicht habe ich mich davor gehütet, euch zur Last zu fallen, und werde es auch weiterhin tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung meint hier besonders, jemanden finanziell zu belasten.
    reason: lexical_alternative
  - marker: b
    text: „Brüder“ gibt eine maskuline Pluralform wieder. Paulus kann dieses Wort je nach Zusammenhang auch weiter für Glaubensgeschwister gebrauchen; hier sind wahrscheinlich bestimmte Mitarbeiter aus Mazedonien gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: als ich bei euch war
  rationale: Die partizipiale Wendung bezeichnet hier natürlich den zeitlichen Umstand von Paulus’ persönlicher Anwesenheit.
- source_word: ὑστερηθεὶς
  choice: Mangel litt
  rationale: Das Passivpartizip bezeichnet eine erfahrene, im Zusammenhang vor allem materielle Bedürftigkeit. „Mangel litt“ ist knapp, verständlich und wahrt den Bezug zum folgenden ὑστέρημα.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: fiel ich niemandem zur Last
  rationale: καταναρκάω bezeichnet hier, jemandem zur Last zu fallen, besonders in finanzieller Hinsicht. Die deutsche Redewendung gibt den relationalen und wirtschaftlichen Sinn idiomatisch wieder.
- source_word: τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν
  choice: denn … glichen aus, was mir fehlte
  rationale: Die Formulierung gibt sowohl den bestehenden Mangel als auch dessen ergänzende Deckung wieder, ohne den Gegenstand des Mangels enger festzulegen, als es der griechische Text tut.
- source_word: οἱ ἀδελφοὶ
  choice: die Brüder
  rationale: Die maskuline Pluralform wird im Haupttext geschlechtsgenau wiedergegeben. Eine mögliche weitere paulinische Verwendungsbreite wird in der Fußnote kenntlich gemacht.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: die aus Mazedonien kamen
  rationale: Das Aoristpartizip wird als natürlicher deutscher Relativsatz wiedergegeben; die Herkunft der Helfenden bleibt ausdrücklich erhalten.
- source_word: ἐν παντί
  choice: in jeder Hinsicht
  rationale: Die adverbiale Wendung drückt umfassenden Geltungsbereich aus. „In jeder Hinsicht“ klingt im Deutschen natürlicher als das wörtlichere „in allem“.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: mich davor gehütet, euch zur Last zu fallen
  rationale: Die komprimierte griechische Wendung bezeichnet, dass Paulus sich den Adressaten gegenüber nicht belastend verhielt. Die deutsche Entfaltung verbindet sich natürlich mit τηρέω.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: habe ich mich davor gehütet … und werde es auch weiterhin tun
  rationale: τηρέω bezeichnet das Bewahren oder konsequente Einhalten eines Zustands. Die Zukunftsform bringt die ausdrücklich angekündigte Fortsetzung idiomatisch zum Ausdruck.
theological_decisions:
- issue: Geschlechtsbezogene Wiedergabe von ἀδελφοί
  choice: die Brüder
  alternative: die Geschwister / die Brüder und Schwestern
  rationale: Die griechische Form ist maskulin; zudem kann der Zusammenhang konkrete aus Mazedonien angereiste Mitarbeiter meinen. Weil Paulus ἀδελφοί andernorts auch weiter für Glaubensgeschwister gebrauchen kann, wird diese Möglichkeit nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Art der Belastung durch Paulus’ Unterhalt
  choice: zur Last fallen
  alternative: finanziell belasten / von jemandem abhängig sein
  rationale: Der Kontext spricht deutlich von materiellem Mangel und dessen Deckung. Die allgemeinere Redewendung bewahrt dennoch die Bild- und Bedeutungsbreite von καταναρκάω und ἀβαρής, ohne die Aussage auf eine bestimmte Form finanzieller Unterstützung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit idiomatischer Satzführung. Die Wiederholung von „zur Last fallen“ bewahrt die begriffliche Verbindung zwischen καταναρκάω und ἀβαρής. Die Formulierung „was mir fehlte“ lässt die genaue Art des Mangels entsprechend dem griechischen Text offen, während der Zusammenhang den materiellen Bezug erkennen lässt.
