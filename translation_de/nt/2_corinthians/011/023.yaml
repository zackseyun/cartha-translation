source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: de
  text: 'Sind sie Diener des Messias[a]? Ich rede wie von Sinnen: Ich noch mehr! In Mühen weit mehr, in Gefängnissen weit mehr, unter Schlägen über die Maßen, oft in Todesgefahren[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: „Diener Christi“.'
    reason: Traditionelle alternative Wiedergabe des Titels Χριστός.
  - marker: b
    text: 'Wörtlich: „oft in Toden“; gemeint sind wahrscheinlich wiederholte Begegnungen mit dem Tod oder tödliche Gefahren.'
    reason: Die auffällige Mehrzahl des griechischen Ausdrucks wird in der verständlichen Hauptübersetzung sinngemäß wiedergegeben und hier wörtlich dokumentiert.
lexical_decisions:
- source_word: διάκονοι
  choice: Diener
  rationale: „Diener“ gibt den allgemeinen Dienstbegriff wieder und vermeidet die stärker kirchenamtliche Färbung von „Amtsträger“ oder „Geistliche“.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist hier als Titel im Genitiv gebraucht; „Messias“ macht seine Bedeutung transparent. Die traditionelle Wiedergabe „Christus“ wird in einer Fußnote genannt.
- source_word: παραφρονῶν λαλῶ
  choice: Ich rede wie von Sinnen
  rationale: Die Formulierung bewahrt Paulus’ selbstkritische Kennzeichnung seines Redens als wahnsinnig wirkend, ohne unnötig medizinisch oder umgangssprachlich zu klingen.
- source_word: ὑπὲρ ἐγώ
  choice: Ich noch mehr!
  rationale: Die knappe Ellipse und der gesteigerte Vergleich des Griechischen bleiben erhalten; aus dem Zusammenhang ist „Diener des Messias“ zu ergänzen.
- source_word: ἐν κόποις περισσοτέρως
  choice: In Mühen weit mehr
  rationale: „Mühen“ bezeichnet anstrengende Arbeit und Strapazen; „weit mehr“ gibt die vergleichende Steigerung knapp und idiomatisch wieder.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: in Gefangenschaften weit mehr
  rationale: Der Plural weist auf wiederholte Haftzeiten hin. „Gefangenschaften“ wahrt diese Mehrzahl deutlicher als das allgemeinere „im Gefängnis“.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: unter Schlägen über die Maßen
  rationale: πληγαί bezeichnet hier zugefügte Schläge, ohne ausschließlich eine bestimmte Form der Auspeitschung festzulegen; „über die Maßen“ erhält die starke Steigerung.
- source_word: ἐν θανάτοις πολλάκις
  choice: oft in Todesgefahren
  rationale: Der ungewöhnliche griechische Plural „Tode“ bezeichnet wahrscheinlich wiederholte Situationen tödlicher Gefahr. Die Hauptübersetzung vermittelt den Sinn verständlich; die wörtliche Ausdrucksweise wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: des Christus
  rationale: Das Wort fungiert hier als Titel. „Messias“ legt dessen Bedeutung offen, während „Christus“ als traditionelle Wiedergabe in der Fußnote erhalten bleibt.
- issue: Elliptischer Vorrangssatz ὑπὲρ ἐγώ
  choice: Ich noch mehr!
  alternative: Ich bin es noch mehr!
  rationale: Die knappe Form lässt wie das Griechische offen, worin Paulus den Vergleich genau zuspitzt, auch wenn der Kontext den Dienst des Messias nahelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper rhetorischer Zuspitzung. Die Satzellipse „Ich noch mehr!“ und die abgestufte Leidensliste spiegeln Paulus’ erregte, bewusst anstößige Redeweise; veraltete oder konfessionell belastete Amtsbegriffe werden vermieden.
