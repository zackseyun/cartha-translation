  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: de
  text: 'Noch einmal sage ich: Niemand soll mich für einen Narren[a] halten. Wenn nicht, dann nehmt mich zumindest als einen Narren an, damit auch ich mich ein wenig rühmen kann.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für töricht halten“ / „wie einen törichten Menschen“. Das griechische Adjektiv ἄφρων kann adjektivisch („töricht“, „unvernünftig“) oder substantivisch („ein Narr“) wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Noch einmal sage ich
  rationale: Gibt die Wiederholung des Appells knapp, natürlich und mit dem direkten Ton des griechischen Präsens wieder.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: Niemand soll mich für unvernünftig halten
  rationale: Das deutsche Muster „für … halten“ entspricht δοκέω mit Infinitiv idiomatisch; „unvernünftig“ bewahrt die wertende Bedeutung von ἄφρων, ohne sie unnötig zu verschärfen.
- source_word: εἰ δὲ μή γε
  choice: Wenn aber doch
  rationale: 'Die elliptische Wendung meint hier: Falls die Adressaten der vorigen Aufforderung nicht folgen, sollen sie Paulus zumindest in der zugestandenen Rolle annehmen. „Wenn aber doch“ macht diesen Anschluss im Deutschen verständlich.'
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: dann nehmt mich wenigstens wie einen Unvernünftigen an
  rationale: „Wenigstens“ bringt die einräumende Kraft von κἂν zur Geltung; „annehmen“ ist im heutigen Deutsch für δέχομαι natürlicher als „aufnehmen“ oder „empfangen“.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: damit auch ich mich ein wenig rühmen kann
  rationale: Bewahrt den Zweckgedanken von ἵνα, die Hervorhebung durch κἀγώ und die für den Zusammenhang wichtige Sprache des Sich-Rühmens.
theological_decisions:
- issue: Paulus’ ironische Selbstbezeichnung mit ἄφρων und sein Rühmen
  choice: Die Sprache von Unvernunft und Sich-Rühmen bleibt ausdrücklich erhalten.
  alternative: Die Aussage als „unklug reden“ oder als bloße Selbstverteidigung abschwächen.
  rationale: Paulus übernimmt ironisch die ihm zugeschriebene Rolle, um sein folgendes Rühmen einzuleiten. Die rhetorische und theologische Spannung soll nicht durch eine glättende Umschreibung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht im Plural, wie es der griechische Imperativ δέξασθε verlangt. Der Doppelpunkt gliedert den erneuten Appell; der zweite Satz gibt die elliptische griechische Bedingung verständlich wieder.
