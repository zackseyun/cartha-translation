  source_fidelity: 'Der Entwurf gibt alle Satzelemente des griechischen Textes sachgerecht wieder: die koordinierte Bezeichnung Gottes, den Genitiv »des Herrn Jesus«, das Prädikat »weiß«, den doxologischen Einschub und den Inhaltssatz »dass ich nicht lüge«. Der Einschub ist zutreffend auf Gott und nicht auf Jesus bezogen. »In Ewigkeit gepriesen« gibt εἰς τοὺς αἰῶνας idiomatisch und dem Register entsprechend wieder.'
  naturalness: »Der Gott und Vater des Herrn Jesus – er ist in Ewigkeit gepriesen – weiß, dass ich nicht lüge« ist klares, würdiges modernes Standarddeutsch. Die Gedankenstriche und das wiederaufnehmende »er« machen die appositionale Struktur verständlich, ohne den Satzfluss wesentlich zu belasten.
  terminology: »Gott und Vater«, »Herr Jesus«, »gepriesen« und »in Ewigkeit« sind treffende und im deutschen Bibelregister etablierte Wiedergaben. Es wird kein im griechischen Text fehlendes »unser« ergänzt. Die Fußnote kennzeichnet die wörtlichere Alternative angemessen, ohne die Hauptübersetzung zu stören.
