id: 2CO.11.31
reference: 2 Corinthians 11:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: de
  text: Der Gott und Vater des Herrn Jesus – er ist in Ewigkeit gepriesen[a] – weiß, dass ich nicht lüge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in die Zeitalter«; sinngemäß auch: »für alle Zeiten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Der Gott und Vater
  rationale: Der eine Artikel umfasst beide Substantive. Die feste Wendung bleibt vollständig erhalten und gibt dem feierlichen Bekenntnis sein Gewicht.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: des Herrn Jesus
  rationale: κύριος wird als Titel mit »Herr« wiedergegeben. Ein Possessivpronomen wie »unseres« steht nicht im griechischen Text und wird daher nicht ergänzt.
- source_word: οἶδεν
  choice: weiß
  rationale: Das Verb bedeutet unmittelbar »wissen«. Obwohl die Aussage wie eine feierliche Berufung auf Gott wirkt, wird sie nicht deutend zu »ist mein Zeuge« erweitert.
- source_word: ὁ ὢν εὐλογητὸς
  choice: er ist gepriesen
  rationale: Die eingeschobene Beschreibung bezieht sich auf Gott. Die selbstständige deutsche Formulierung vermeidet den grammatisch naheliegenden, aber sachlich falschen Bezug eines Relativsatzes auf »Jesus«.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die geläufige doxologische Wendung vermittelt die unbegrenzte Dauer natürlich und würdig; die wörtlichere Bildsprache wird in der Fußnote genannt.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier den Inhalt dessen ein, was Gott weiß, nicht eine Begründung.
- source_word: οὐ ψεύδομαι
  choice: ich nicht lüge
  rationale: Die präsentische Aussage wird in natürlichem modernem Deutsch als »ich lüge nicht« wiedergegeben.
theological_decisions:
- issue: Verhältnis von »Gott und Vater« zu »dem Herrn Jesus«
  choice: Die Wendung wird unverändert relational als »der Gott und Vater des Herrn Jesus« wiedergegeben.
  alternative: Eine glättende Paraphrase, welche die im Text ausgesagte personale Unterscheidung abschwächt.
  rationale: Die Übersetzung bewahrt die sprachliche und theologische Spannung des Ausgangstextes, ohne sie konfessionell auszudeuten oder abzuschwächen.
- issue: Bezug und Zeichensetzung des doxologischen Einschubs
  choice: Der Einschub »er ist in Ewigkeit gepriesen« wird durch Gedankenstriche klar auf Gott bezogen.
  alternative: Ein Relativsatz wie »der in Ewigkeit gepriesen ist«, der im Deutschen missverständlich auf den unmittelbar vorausgehenden Namen Jesus bezogen werden könnte.
  rationale: Die griechische Nominativform ὁ ὢν bezieht den Einschub auf das Satzsubjekt »der Gott und Vater«, nicht auf den genitivischen Ausdruck »des Herrn Jesus«. Die Zeichensetzung und die wiederholte Pronominalform machen diesen Bezug eindeutig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kurze doxologische Einschub bleibt als solcher hörbar; die Formulierung vermeidet sowohl altertümliches »gelobt sei« als auch einen missverständlichen Relativsatz.
