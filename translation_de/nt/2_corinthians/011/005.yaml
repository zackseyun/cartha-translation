  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: de
  text: Denn ich meine, den »Superaposteln«[a] in nichts nachzustehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den höchst angesehenen Aposteln«. Die griechische Wendung kann entweder ironisch (»Superapostel«) oder als sachliche Bezeichnung besonders angesehener Apostel verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: ich bin überzeugt
  rationale: Das Verb bezeichnet hier ein abwägendes Dafürhalten. »Ich bin überzeugt« klingt im modernen Deutschen natürlich und gibt die bestimmte Selbsteinschätzung des Paulus wieder, ohne bloßes Vermuten auszudrücken.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet oder erläutert die vorausgehende Aussage; »Denn« bildet diesen argumentativen Anschluss knapp und idiomatisch ab.
- source_word: μηδὲν
  choice: in nichts
  rationale: μηδέν wird beim Infinitiv adverbial gebraucht und besagt, dass Paulus in keinerlei Hinsicht zurücksteht. »In nichts« bewahrt sowohl die Emphase als auch die knappe Form des Griechischen.
- source_word: ὑστερηκέναι
  choice: nachstehe
  rationale: ὑστερέω bezeichnet im Vergleich ein Zurückstehen oder Unterlegensein. »Nachstehen« ist in dieser Konstruktion präzise, idiomatisch und erhält den Vergleichscharakter.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: diesen »Superaposteln«
  rationale: ὑπερλίαν verstärkt ἀπόστολοι außergewöhnlich stark und ist im Kontext wahrscheinlich ironisch. »Superapostel« bewahrt die rhetorische Schärfe; die Anführungszeichen signalisieren Ironie, ohne das Urteil durch »sogenannt« ausdrücklich in den Text einzutragen. »Diesen« stellt den kontextuellen Bezug auf die betreffenden Personen natürlich her.
theological_decisions:
- issue: Ob τῶν ὑπερλίαν ἀποστόλων ironisch die Gegner des Paulus oder ernsthaft besonders angesehene Apostel bezeichnet
  choice: Im Haupttext »diesen ›Superaposteln‹« als wahrscheinlich ironische Bezeichnung
  alternative: »den höchst angesehenen Aposteln« als ernsthafte Bezeichnung führender Apostel
  rationale: Der unmittelbare polemische Zusammenhang legt Ironie nahe. Da die griechische Wendung jedoch auch ohne Ironie verstanden werden kann, wird die alternative Deutung in einer Fußnote offengehalten und nicht dogmatisch ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist knapp und argumentativ; die mögliche Ironie wird im Haupttext sichtbar gemacht, während die echte Deutungsambiguität durch die Fußnote erhalten bleibt.
