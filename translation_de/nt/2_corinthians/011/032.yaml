  naturalness: Die revidierte Formulierung ist klares, modernes und zugleich würdiges Standarddeutsch. „Ethnarch“ ist als historischer Titel fachsprachlich, aber verständlich genug; die Fußnote erläutert ihn knapp.
  terminology: „Ethnarch“ bewahrt den besonderen Amtstitel, ohne ein konkreteres oder anderes Verwaltungsamt zu unterstellen. „Ergreifen“ bleibt gegenüber dem rechtlich engeren „festnehmen“ offen und entspricht πιάσαι. „Stadt der Damaszener“ erhält die auffällige genitivische Formulierung des Griechischen.
