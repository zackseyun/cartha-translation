    rationale: Der Begriff kann zwar eine ähnliche Verwaltungsfunktion nahelegen, bezeichnet aber nicht notwendig denselben historischen Amtstitel. „Ethnarch“ ist hier die genauere, nicht weiter interpretierende Wiedergabe.
  - severity: low
    issue: „festzunehmen“ ist gegenüber πιάσαι enger und behördlicher.
    rationale: πιάσαι bezeichnet allgemein das Ergreifen oder Fassen. „Ergreifen“ bewahrt diese Offenheit, ohne eine förmliche Verhaftung vorauszusetzen.
