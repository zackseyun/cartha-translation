  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: de
  text: In Damaskus bewachte der Ethnarch des Königs Aretas die Stadt der Damaszener,[a] um mich zu ergreifen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stadt Damaskus“. Wörtlich: „die Stadt der Damaszener“. Ein Ethnarch war ein Herrscher oder Verwalter über eine Volksgruppe oder ein Gebiet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: In Damaskus
  rationale: Die Präposition ἐν mit dem Dativ bezeichnet hier den Ort; „in Damaskus“ ist die natürliche deutsche Wiedergabe.
- source_word: ἐθνάρχης
  choice: Statthalter
  rationale: ἐθνάρχης bezeichnet einen Herrscher oder Verwalter über eine Volksgruppe beziehungsweise ein Gebiet. „Statthalter“ vermittelt die historische Verwaltungsfunktion verständlicher als das im Deutschen wenig geläufige „Ethnarch“.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: des Königs Aretas
  rationale: Der Genitiv ordnet den Statthalter König Aretas zu; die formnahe deutsche Genitivkonstruktion bleibt natürlich und lässt das genaue Amtsverhältnis offen.
- source_word: ἐφρούρει
  choice: ließ … bewachen
  rationale: Das Imperfekt bezeichnet eine fortdauernde Handlung in der Vergangenheit. Im Deutschen drückt die kausative Form idiomatisch aus, dass der Amtsträger die Überwachung veranlasste, ohne ihn als persönlich Wachenden darzustellen.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: die Stadt der Damaszener
  rationale: Diese Wiedergabe bewahrt den auffälligen Genitiv Plural Δαμασκηνῶν („der Damaszener“) und damit die Formulierung der griechischen Textfassung.
- source_word: πιάσαι με
  choice: um mich festzunehmen
  rationale: Der Aoristinfinitiv bezeichnet den Zweck der Bewachung. „Festnehmen“ gibt die beabsichtigte Ergreifung einer Person in diesem behördlichen Zusammenhang natürlich wieder, ohne das Ergebnis vorwegzunehmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Statthalter“ vermeidet den für viele Leser unverständlichen Fachtitel „Ethnarch“, während „Stadt der Damaszener“ die ungewöhnliche Ausdrucksweise des griechischen Textes wahrt.
