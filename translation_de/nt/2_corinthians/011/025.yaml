  - severity: low
    issue: Die Fußnote stellt »in der Tiefe«/»im tiefen Meer« als Alternative zu »auf hoher See« dar.
    rationale: Da diese Ausdrücke dem griechischen βυθός näher entsprechen, sollten sie im Haupttext stehen; »auf hoher See« kann, wenn überhaupt, als weiter gefasste Alternative genannt werden.
