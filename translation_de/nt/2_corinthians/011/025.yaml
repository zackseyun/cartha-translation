  rationale: Die Revision beschränkt sich auf ἐν τῷ βυθῷ und die dazugehörige Fußnote. »In der Tiefe« gibt βυθός unmittelbar wieder, ohne festzulegen, ob Paulus im Wasser, auf einem Wrackteil oder in anderer Weise im tiefen Meer ausharrte. Die übrigen Formulierungen bleiben unverändert, da sie den griechischen Text präzise und idiomatisch wiedergeben.
