  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: de
  text: Dreimal wurde ich mit Ruten geschlagen, einmal wurde ich gesteinigt, dreimal erlitt ich Schiffbruch; eine Nacht und einen Tag habe ich in der Tiefe[a] verbracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im tiefen Meer«; möglicherweise: »auf hoher See«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: dreimal
  rationale: Die übliche adverbiale Wiedergabe bezeichnet eine dreifache Wiederholung und wird an beiden Stellen einheitlich verwendet.
- source_word: ἐραβδίσθην
  choice: wurde ich mit Ruten geschlagen
  rationale: Das Passiv von ῥαβδίζω bezeichnet ausdrücklich das Schlagen mit Ruten; die Nennung des Instruments bewahrt die Genauigkeit des griechischen Ausdrucks.
- source_word: ἅπαξ
  choice: einmal
  rationale: Natürliche und genaue deutsche Entsprechung für das einmalige Geschehen.
- source_word: ἐλιθάσθην
  choice: wurde ich gesteinigt
  rationale: Die etablierte, knappe deutsche Wiedergabe von λιθάζω im Kontext gewaltsamer Steinigung.
- source_word: ἐναυάγησα
  choice: erlitt ich Schiffbruch
  rationale: Idiomatiches Deutsch, das das von ναυαγέω bezeichnete Ereignis präzise ausdrückt.
- source_word: νυχθήμερον
  choice: eine Nacht und einen Tag
  rationale: Bewahrt die im griechischen Substantiv enthaltene Abfolge von Nacht und Tag, ohne sie modernisierend auf exakt 24 Stunden festzulegen.
- source_word: ἐν τῷ βυθῷ
  choice: auf hoher See
  rationale: βυθός bezeichnet hier die tiefe beziehungsweise offene See. Im Zusammenhang eines Schiffbruchs ist »auf hoher See« natürliches modernes Deutsch, ohne die genaue Lage des Paulus näher festzulegen.
- source_word: πεποίηκα
  choice: habe ich … verbracht
  rationale: ποιέω kann mit einer Zeitangabe idiomatisch »Zeit verbringen« bedeuten; das Perfekt wird durch das deutsche Perfekt angemessen wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhythmischer Reihung. Die traditionelle Wendung »mit Ruten geschlagen« bleibt wegen ihrer Präzision erhalten; »auf hoher See« gibt den maritimen Sinn im heutigen Deutsch natürlich wieder, während die Fußnote die wörtlichere räumliche Alternative bewahrt.
