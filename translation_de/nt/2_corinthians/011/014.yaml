  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: de
  text: Und das ist kein Wunder, denn der Satan selbst verkleidet sich als Engel des Lichts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verwandelt sich in einen Engel des Lichts«. Das griechische Verb bedeutet wörtlicher »sich verwandeln« oder »seine Gestalt verändern«; hier bezieht es sich wahrscheinlich auf eine täuschende Erscheinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der Anschluss an den vorherigen Vers wird mit dem gewöhnlichen deutschen Bindewort bewahrt.
- source_word: οὐ θαῦμα
  choice: das ist kein Wunder
  rationale: Die idiomatische Wendung gibt die Bedeutung »das ist nicht überraschend« natürlich und würdevoll wieder.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: selbst der Satan
  rationale: »selbst« bewahrt die intensive Funktion von αὐτός; der Artikel ist im Deutschen vor »Satan« idiomatisch möglich und entspricht hier dem griechischen Ausdruck.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet knapp und klar die Begründung für die vorherige Aussage.
- source_word: μετασχηματίζεται
  choice: verstellt sich
  rationale: Bezeichnet im Kontext eine täuschende Veränderung der äußeren Erscheinung oder Rolle, ohne eine ontologische Verwandlung zu behaupten.
- source_word: εἰς
  choice: als
  rationale: Gibt zusammen mit dem Verb die angenommene Erscheinung oder Rolle im Deutschen idiomatisch wieder.
- source_word: ἄγγελον
  choice: ein Engel
  rationale: Im übernatürlichen Zusammenhang ist »Engel« gegenüber dem allgemeineren »Bote« eindeutig vorzuziehen.
- source_word: φωτός
  choice: des Lichts
  rationale: Die Genitivkonstruktion bewahrt das prägnante biblische Bild.
theological_decisions:
- issue: Art der Veränderung Satans
  choice: Täuschende Selbstdarstellung als Engel des Lichts
  alternative: Tatsächliche Verwandlung in einen Engel des Lichts
  rationale: Der unmittelbare Kontext handelt von Täuschung durch falsche Apostel. »verstellt sich« bildet diesen Sinn gut ab, während die Fußnote die wörtlichere und offenere Übersetzungsmöglichkeit festhält.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Stil. »verstellt sich« ist allgemein verständlich und erhält den Gedanken der Täuschung; die Fußnote bewahrt die lexikalische Spannweite des griechischen Verbs.
