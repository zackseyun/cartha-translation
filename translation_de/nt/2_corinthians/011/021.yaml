  to: Zu unserer Schande sage ich das[a], als wären wir schwach gewesen[b]. Doch worin auch immer jemand etwas wagt[c] – ich rede töricht[d] –, auch ich wage es.
  rationale: Die Revision ersetzt allein die im modernen Deutsch sperrige Wendung „in Unvernunft“ durch das natürliche „töricht“ und glättet den anaphorischen Schlussteil. Die Ironie, die Vergangenheits-/Anscheinsnuance von „als wären wir schwach gewesen“ und die Ellipse hinsichtlich dessen, was jemand wagt, bleiben erhalten.
