  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: de
  text: Zu unserer Schande sage ich das[a], als wären wir schwach gewesen[b]. Doch worin auch immer jemand etwas wagt[c] – ich rede töricht[d] –, auch ich wage es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zur Unehre sage ich es“; die griechische Wendung kann Schande, Unehre oder Herabsetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als wären wir schwach“. Paulus formuliert im Zusammenhang seiner „törichten“ Rede ironisch.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „worin auch immer jemand wagt“. Nach dem Zusammenhang ist besonders das Rühmen gemeint.'
    reason: implicit_context
  - marker: d
    text: 'Oder: „in Torheit rede ich“ oder „ich rede wie ein Unvernünftiger“; traditionell: „ich rede wie ein Narr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: Zu unserer Schande
  rationale: Die idiomatische Wendung bezeichnet hier Schande beziehungsweise Herabsetzung und passt zu Paulus’ ironischem Eingeständnis, er und seine Mitarbeiter hätten schwach gewirkt.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: als wären wir schwach gewesen
  rationale: Die Formulierung bewahrt den Anschein beziehungsweise die ironische Einräumung; das Perfekt wird im Deutschen natürlich mit einer rückblickenden Vergangenheitsform wiedergegeben.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: Doch worin auch immer jemand etwas wagt
  rationale: Die Wiedergabe lässt wie der griechische Wortlaut den Gegenstand des Wagens unausgesprochen. Der Kontext legt das Rühmen nahe, doch die Übersetzung ergänzt es nicht stillschweigend.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: ich rede in Unvernunft
  rationale: Die substantivische Form bewahrt die Wendung des Ausgangstextes und Paulus’ selbstkritischen Einschub, ohne ihn ausdrücklich als Person einen Narren zu nennen.
- source_word: τολμῶ κἀγώ
  choice: das wage auch ich
  rationale: Die Formulierung erhält die Wiederholung von τολμάω und macht durch „das“ den natürlichen Rückbezug auf das zuvor genannte Wagnis deutlich.
theological_decisions:
- issue: Ironische Rede von der Schwachheit des Paulus
  choice: 'Die Aussage wird als vergleichende, ironische Einräumung formuliert: „als wären wir schwach gewesen“.'
  alternative: 'Eine unmittelbare Feststellung: „dass wir schwach gewesen sind“.'
  rationale: ὡς ὅτι und der Zusammenhang der sogenannten Narrenrede sprechen für eine ironische Perspektive. Dennoch wird nicht erklärt, in welchem Sinn Paulus tatsächlich schwach war oder nicht war.
- issue: Ergänzung des im Kontext vorausgesetzten Rühmens
  choice: Der Haupttext lässt das Objekt von „wagt“ offen.
  alternative: „Worin auch immer jemand sich zu rühmen wagt“.
  rationale: Das Rühmen ist im Zusammenhang naheliegend, steht in diesem Satzteil jedoch nicht ausdrücklich. Die offenere Wiedergabe wahrt die sprachliche Ellipse und die Wiederholung des Verbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewöhnliche Formulierung „in Unvernunft“ erhält bewusst Paulus’ markierten rhetorischen Einschub; die Gedankenstriche bilden dessen parenthetischen Charakter ab.
