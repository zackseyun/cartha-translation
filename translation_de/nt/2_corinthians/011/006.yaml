  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: de
  text: Doch selbst wenn ich im Reden ungeschult bin[a], bin ich es doch nicht in der Erkenntnis. Sondern wir haben euch dies in jeder Hinsicht und in allem deutlich gemacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Sprechen ungeübt“, das heißt ohne geschliffene rhetorische Gewandtheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Formulierung ist gedrängt und kann auch verstanden werden: „Wir haben euch dies in jeder Hinsicht vor allen Menschen deutlich gemacht“ oder: „Wir haben euch dies in jeder Hinsicht unter allen Umständen deutlich gemacht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης
  choice: ungeschult
  rationale: Im Gegensatz zur Erkenntnis bezeichnet das Wort hier mangelnde rhetorische Ausbildung oder Gewandtheit, nicht allgemeine Unwissenheit.
- source_word: τῷ λόγῳ
  choice: im Reden
  rationale: Der Dativ bezeichnet hier den Bereich des Sprechens beziehungsweise des rhetorischen Vortrags; „im Reden“ ist natürlich und wahrt den Gegensatz zur Erkenntnis.
- source_word: γνώσει
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt den sachlichen Gehalt von γνῶσις wieder und bildet einen klaren Gegensatz zu rhetorischer Schulung.
- source_word: φανερώσαντες
  choice: haben wir … deutlich gemacht
  rationale: Das aoristische Partizip trägt hier die Aussage des verkürzten Satzes; eine finite deutsche Form gibt diese Funktion verständlich wieder.
- source_word: ἐν παντί
  choice: in jeder Hinsicht
  rationale: Die Wendung bezeichnet umfassende Weise oder Reichweite, ohne sie auf einen bestimmten Bereich einzuengen.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die knappe Formulierung kann sachlich auf alle Dinge oder Umstände bezogen werden; die Übersetzung bewahrt diese breite Lesart.
- source_word: εἰς ὑμᾶς
  choice: euch
  rationale: Die Korinther sind die Adressaten beziehungsweise der Zielpunkt dessen, was offenkundig gemacht wurde; der deutsche Dativ ist hier idiomatisch.
theological_decisions:
- issue: Sinn von Paulus’ Selbstaussage über seine Redefähigkeit
  choice: Paulus räumt fehlende rhetorische Schulung oder Gewandtheit ein, nicht fehlende Erkenntnis.
  alternative: Paulus bezeichnet sich als allgemein ungebildet oder spricht ausschließlich ironisch, ohne irgendeinen Mangel einzuräumen.
  rationale: Der ausdrückliche Gegensatz zwischen λόγος und γνῶσις sowie der Zusammenhang mit konkurrierenden Rednern sprechen für eine Aussage über die Form seines Vortrags, nicht über Wahrheit, Autorität oder allgemeine Bildung.
- issue: Bezug des abschließenden Satzes
  choice: „dies“ lässt den genauen Bezug offen und bezeichnet, was Paulus und seine Mitarbeiter den Korinthern deutlich gemacht haben.
  alternative: Das Pronomen wird ausdrücklich allein auf Paulus’ Erkenntnis bezogen.
  rationale: Der griechische Satz nennt kein ausdrückliches Objekt. Die neutrale Formulierung vermeidet es, den möglichen Bezug unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den scharfen Gegensatz zwischen rhetorischer Fähigkeit und Erkenntnis. Die doppelte umfassende Wendung „in jeder Hinsicht und in allem“ spiegelt ἐν παντί … ἐν πᾶσιν, während die Fußnote die Mehrdeutigkeit der zweiten Wendung offenhält.
