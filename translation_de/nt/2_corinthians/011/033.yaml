  text: καὶ διὰ θυρίδος ἐν σαργάνῃ ἐχαλάσθην διὰ τοῦ τείχους καὶ ἐξέφυγον τὰς χεῖρας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/033.yaml
  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: de
  text: Durch ein Fenster wurde ich in einem Korb durch die Mauer hinabgelassen und entkam seinen Händen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch eine Öffnung wurde ich in einem Seilkorb durch die Mauer hinabgelassen und entkam seinem Zugriff.“'
    reason: Lexikalische Alternativen für θυρίς, σαργάνη und die idiomatische Wendung „seinen Händen entkommen“.
lexical_decisions:
- source_word: θυρίδος
  choice: Fenster
  rationale: θυρίς bezeichnet ein Fenster oder eine kleinere Öffnung. „Fenster“ ist hier die natürliche und hinreichend genaue deutsche Wiedergabe.
- source_word: σαργάνῃ
  choice: Korb
  rationale: σαργάνη bezeichnet einen geflochtenen Behälter, möglicherweise aus Seilen oder Weiden. „Korb“ ist im Deutschen klar und natürlich; die mögliche Materialspezifizierung wird in der Fußnote bewahrt.
- source_word: ἐχαλάσθην
  choice: wurde ich … hinabgelassen
  rationale: Das Passiv von χαλάω bezeichnet hier das Hinablassen, wohl mithilfe eines Seils. „hinabgelassen“ gibt sowohl die Richtung als auch die passive Form präzise wieder.
- source_word: διὰ τοῦ τείχους
  choice: durch die Mauer
  rationale: Die Präpositionalfügung bezeichnet den Weg durch die Mauer beziehungsweise durch eine darin befindliche Öffnung. „Stadtmauer“ wäre kontextuell plausibel, ist im griechischen Text aber nicht ausdrücklich spezifiziert.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: entkam seinen Händen
  rationale: Die bewusst bildhafte Formulierung folgt dem griechischen Ausdruck für das Entkommen aus jemandes Zugriff oder Macht und bleibt im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Wortfolge und Bildsprache des griechischen Textes. Die Wiederholung von „durch“ bildet das doppelte διά ab, ohne unnatürlich zu wirken.
