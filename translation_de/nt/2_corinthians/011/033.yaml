  terminology: „Fenster“, „Korb“ und „hinabgelassen“ sind treffend. Die Fußnote wahrt sachgerecht die möglichen Nuancen „Öffnung“ und „Seilkorb“ sowie die idiomatische Alternative „seinem Zugriff“, ohne eine historische oder konfessionelle Deutung vorzugeben.
