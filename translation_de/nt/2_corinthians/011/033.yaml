  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Satzes zuverlässig wieder: die Fensteröffnung (θυρίς), den Korb (σαργάνη), das passive Hinablassen (ἐχαλάσθην), die zweimalige διά-Konstruktion sowie das bildhafte Entkommen „seinen Händen“. Die Formulierung „durch die Mauer“ ist eng am griechischen διὰ τοῦ τείχους und lässt, wie der Kontext nahelegt, die Fortbewegung durch eine Öffnung der Mauer erkennen, ohne „Stadtmauer“ ungesichert einzutragen.'
