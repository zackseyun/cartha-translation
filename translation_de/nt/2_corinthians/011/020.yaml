base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: de
  text: Denn ihr ertragt es[a], wenn jemand euch versklavt, wenn jemand euch verschlingt, wenn jemand etwas von euch nimmt[b], wenn jemand sich selbst erhöht, wenn jemand euch ins Gesicht schlägt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr duldet es“ oder „ihr lasst es euch gefallen“.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Wörtlich: „nimmt“; im Griechischen steht kein Objekt. Im Zusammenhang ist wahrscheinlich ein ausbeuterisches Nehmen gemeint.'
    reason: lexikalische Offenheit
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: ihr ertragt es
  rationale: Das Präsens beschreibt, was die Korinther tatsächlich dulden. „Ihr ertragt es“ ist natürliches, heutiges Deutsch und bewahrt den vorwurfsvoll-ironischen Ton; „es“ ist im Deutschen sinngemäß ergänzt.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ erhält die begründende Verbindung zum vorausgehenden Gedankengang.
- source_word: καταδουλοῖ
  choice: versklavt
  rationale: Das Verb bezeichnet das Unterwerfen in Sklaverei oder Knechtschaft. „Versklavt“ gibt diese starke Bedeutung knapp wieder, ohne sie abzuschwächen.
- source_word: κατεσθίει
  choice: verschlingt
  rationale: Das bildhafte Verb schildert ausbeuterisches Aufzehren. „Verschlingt“ bewahrt das drastische Bild.
- source_word: λαμβάνει
  choice: euch ausnimmt
  rationale: Das allein stehende Verb bedeutet grundsätzlich „nimmt“; im Kontext ist offensichtlich ausbeuterisches Nehmen gemeint. „Euch ausnimmt“ ist idiomatisches Deutsch, während die Fußnote die lexikalische Offenheit kenntlich macht.
- source_word: ἐπαίρεται
  choice: sich selbst erhöht
  rationale: Die mediale Form bezeichnet hier Selbsterhöhung oder hochmütiges Auftreten. Die reflexive Formulierung bleibt nahe an der griechischen Ausdrucksweise.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: euch ins Gesicht schlägt
  rationale: Die Formulierung bewahrt die konkrete körperliche Misshandlung und Demütigung, ohne die Art des Schlages auf eine Ohrfeige einzuengen.
- source_word: εἴ τις
  choice: wenn jemand
  rationale: Die wiederholte Bedingungsform wird beibehalten, da sie den eindringlichen rhetorischen Rhythmus des Verses trägt.
theological_decisions:
- issue: Ironischer Vorwurf und Identität der Täter
  choice: Der Vers wird als vorwurfsvoll-ironische Beschreibung der von den Korinthern geduldeten Misshandlung wiedergegeben, ohne die Täter im Haupttext ausdrücklich als falsche Apostel oder Lehrer zu bezeichnen.
  alternative: Die Täter im Vers ausdrücklich als falsche Apostel oder falsche Lehrer benennen.
  rationale: Der Zusammenhang legt diese Identifizierung nahe, doch der griechische Wortlaut dieses Verses nennt nur die Handlungen. Die Übersetzung bewahrt daher die rhetorische Spannung, ohne eine kontextuelle Erklärung in den Text einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fünf parallelen „wenn jemand“-Sätze erhalten den anklagenden Rhythmus. Kräftige Bilder wie „versklavt“, „verschlingt“ und „ins Gesicht schlägt“ werden nicht abgeschwächt.
