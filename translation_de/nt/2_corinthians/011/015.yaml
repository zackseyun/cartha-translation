id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: de
  text: Darum ist es nicht verwunderlich, wenn auch seine Diener sich als Diener der Gerechtigkeit[a] tarnen. Ihr Ende wird ihren Taten entsprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann Gerechtigkeit, Rechtschaffenheit oder das, was recht ist, bezeichnen. Hier geht es um den Anschein, im Dienst des Rechten zu stehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: es ist nicht verwunderlich
  rationale: Die Wendung bezeichnet etwas, das nicht erstaunlich oder bemerkenswert ist. Die deutsche Formulierung gibt den idiomatischen Sinn natürlich wieder.
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorherigen Vers und bewahrt den logischen Zusammenhang.
- source_word: διάκονοι
  choice: Diener
  rationale: Gemeint sind hier die in Satans Dienst stehenden Personen. „Diener“ ist verständlich und vermeidet den möglichen kirchenamtlichen Beiklang von „Amtsträger“ oder „Diakone“.
- source_word: μετασχηματίζονται
  choice: sich … tarnen
  rationale: Das Verb bezeichnet hier eine täuschende Veränderung der äußeren Erscheinung oder Selbstdarstellung, nicht eine innere Verwandlung.
- source_word: ὡς
  choice: als
  rationale: Leitet die Rolle beziehungsweise Erscheinung ein, die sie vortäuschen.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die Bedeutungsbreite des griechischen Begriffs zwischen rechtem Handeln, Rechtschaffenheit und Gerechtigkeit. Im Zusammenhang geht es um den täuschenden Anschein, dem Rechten zu dienen.
- source_word: τὸ τέλος
  choice: ihr Ende
  rationale: Bezeichnet das letztliche Ergebnis beziehungsweise das ihnen bevorstehende Geschick im Gericht.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: wird ihren Taten entsprechen
  rationale: Gibt die Aussage idiomatisch wieder, dass ihr endgültiges Geschick in einem angemessenen Verhältnis zu ihrem Handeln stehen wird.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη in der paulinischen Wendung
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; Recht
  rationale: Das deutsche „Gerechtigkeit“ lässt sowohl die moralische als auch die rechtliche Dimension offen. Der Kontext betont den vorgetäuschten Dienst für das, was recht ist, ohne die Bedeutungsbreite dogmatisch einzuengen.
- issue: Gericht nach den Werken
  choice: Ihr Ende wird ihren Taten entsprechen
  alternative: Ihr Ende wird nach ihren Werken sein
  rationale: Die Formulierung bewahrt die Korrespondenz zwischen ihrem Handeln und ihrem endgültigen Geschick, ohne über die Aussage des Verses hinaus eine umfassende Lehre über Verdienst oder Rechtfertigung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich als … tarnen“ nimmt den Täuschungszusammenhang des vorherigen Verses auf; „Taten“ ist im heutigen Deutsch natürlicher als „Werke“, ohne die Gerichtsaussage abzuschwächen.
