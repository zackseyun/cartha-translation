  source_fidelity: 'Die Übersetzung gibt alle zentralen Elemente präzise wieder: ἄλλας ἐκκλησίας als „andere Gemeinden“, das bewusst starke ἐσύλησα als „ausgeraubt“, das instrumentale Partizip λαβών mit „indem ich … annahm“, ὀψώνιον sachgerecht als „Unterstützung“ sowie den Zweckbezug von πρὸς τὴν ὑμῶν διακονίαν als „um euch zu dienen“. Die ironisch-hyperbolische Schärfe des Verbs bleibt erhalten, ohne einen tatsächlichen Diebstahl zu behaupten.'
