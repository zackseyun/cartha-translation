  text: ἄλλας ἐκκλησίας ἐσύλησα λαβὼν ὀψώνιον πρὸς τὴν ὑμῶν διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/008.yaml
  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: de
  text: Andere Gemeinden habe ich ausgeraubt, indem ich Unterstützung von ihnen annahm, um euch zu dienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: Lohn oder Sold.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: andere Gemeinden
  rationale: Im paulinischen Sprachgebrauch bezeichnet ἐκκλησία hier örtliche christliche Gemeinden. „Gemeinden“ ist im modernen Deutschen natürlich und vermeidet die mögliche Verengung von „Kirchen“ auf Gebäude oder Institutionen.
- source_word: ἐσύλησα
  choice: habe ich ausgeraubt
  rationale: Das starke Verb συλάω bedeutet berauben oder ausplündern. „Ausgeraubt“ bewahrt die bewusst zugespitzte, ironische Ausdrucksweise des Paulus, ohne sie zu glätten.
- source_word: λαβὼν
  choice: indem ich … annahm
  rationale: Das Aoristpartizip erläutert, wodurch das bildhafte „Ausrauben“ geschah. Die Konstruktion mit „indem“ gibt diesen instrumentalen Zusammenhang im Deutschen klar wieder.
- source_word: ὀψώνιον
  choice: Unterstützung
  rationale: ὀψώνιον kann Sold, Lohn oder Unterhalt bezeichnen. Im Zusammenhang meint es finanzielle oder materielle Versorgung für den Dienst; „Unterstützung“ ist idiomatisch und vermeidet den zu engen Eindruck eines Arbeitsverhältnisses. Die wörtlichere Alternative steht in der Fußnote.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: um euch zu dienen
  rationale: πρός mit Akkusativ bezeichnet hier Ziel oder Zweck. Die Formulierung macht natürlich und kontextgemäß deutlich, dass Paulus die Korinther bediente, nicht dass sie ihm einen Dienst leisteten.
theological_decisions:
- issue: Rhetorische Aussage, Paulus habe andere Gemeinden ausgeraubt
  choice: Die provokante Raubmetapher als ironische beziehungsweise hyperbolische Zuspitzung beibehalten.
  alternative: Die Aussage zu „anderen Gemeinden etwas wegnehmen“ oder „von anderen Gemeinden Unterstützung annehmen“ abschwächen.
  rationale: Der Zusammenhang handelt von empfangener Unterstützung, nicht von einem tatsächlichen Diebstahl. Dennoch ist das griechische Verb bewusst stark; eine Abschwächung würde die rhetorische Spannung in Paulus’ Verteidigung seines Dienstes mindern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die ungewöhnlich scharfe Formulierung „ausgeraubt“ ist wegen der bewussten paulinischen Ironie erhalten; „Unterstützung“ hält den Versorgungskontext klar.
