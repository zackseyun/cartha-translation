id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: de
  text: 'So gewiss die Wahrheit des Messias in mir ist: Dieses Rühmen wird mir in den Gebieten Achajas nicht verwehrt werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist schwer eindeutig wiederzugeben. Auch möglich: »Dieses Rühmen wird im Blick auf mich nicht zum Schweigen gebracht« oder »Dieses Rühmen wird mir nicht verschlossen werden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: die Wahrheit des Messias
  rationale: Der Genitiv bleibt bewusst offen für die Wahrheit, die dem Messias gehört oder mit ihm verbunden ist. Die Formulierung folgt der griechischen Konstruktion, ohne sie näher auszudeuten.
- source_word: ἐν ἐμοὶ
  choice: in mir
  rationale: Die direkte räumliche Wendung bewahrt den feierlichen, bekräftigenden Charakter der Aussage.
- source_word: ὅτι
  choice: Doppelpunkt nach der Bekräftigungsformel
  rationale: ὅτι leitet hier den Inhalt der feierlichen Bekräftigung ein. Im Deutschen gibt ein Doppelpunkt diese Funktion natürlicher wieder als ein zusätzliches »dass«.
- source_word: καύχησις
  choice: Rühmen
  rationale: »Rühmen« bezeichnet hier sowohl den Vorgang als auch den Inhalt des Sich-Rühmens und ist in diesem Zusammenhang würdevoller und natürlicher als »Prahlen«.
- source_word: φραγήσεται
  choice: wird nicht verwehrt werden
  rationale: Das Futur Passiv von φράσσω bezeichnet wörtlich ein Verschließen oder Absperren. »Verwehrt werden« erhält den passiven Sinn und gibt das Bild im Deutschen verständlich wieder.
- source_word: εἰς ἐμὲ
  choice: mir
  rationale: 'Der schwierige griechische Bezugsausdruck wird idiomatisch als betroffene Person wiedergegeben: Paulus wird dieses Rühmen nicht verwehrt. Die Fußnote hält andere mögliche Nuancen offen.'
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: in den Gebieten Achajas
  rationale: Der Plural κλίμασι bezeichnet Gebiete oder Landesteile; die Übersetzung bewahrt diese Mehrzahl.
- source_word: Ἀχαΐας
  choice: Achaja
  rationale: Dies ist die im Deutschen etablierte Form des Namens der römischen Provinz.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: des Christus
  rationale: Χριστός bezeichnet den Gesalbten und kann hier als Titel verstanden werden. »Messias« macht diese Titelfunktion transparent; »Christus« bleibt eine sprachlich und traditionsgeschichtlich mögliche Wiedergabe.
- issue: Art der Wahrheit in ἀλήθεια Χριστοῦ
  choice: die Wahrheit des Messias
  alternative: die Wahrhaftigkeit des Messias
  rationale: Die formale Genitivkonstruktion bewahrt die mögliche Beziehung zum Messias, ohne festzulegen, ob vor allem die christliche Wahrheit, die Wahrheit, die ihm eigen ist, oder seine Wahrhaftigkeit gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Formel »So gewiss …« bringt den feierlichen Bekräftigungscharakter idiomatisch zum Ausdruck. »Rühmen« vermeidet den ausschließlich negativen Klang von »Prahlen«, während »verwehrt werden« das Passiv des griechischen Verbs bewahrt.
