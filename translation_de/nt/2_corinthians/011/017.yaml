  source_fidelity: Der Entwurf gibt die Satzstruktur und die wesentlichen Begriffe insgesamt zutreffend wieder. „hier“ ist jedoch im griechischen Text nicht ausgedrückt. Vor allem legt „nach der Art des Herrn“ die mögliche Weise-Bedeutung von κατὰ κύριον stärker fest als nötig; „nach dem Herrn“ bewahrt die offene Bezugsnuance (Maßstab, Autorität oder Herkunft) besser.
  naturalness: „Was ich sage, sage ich nicht nach dem Herrn“ ist als bewusst markierte paulinische Formulierung verständlich und würdig. „sondern wie in Unvernunft“ ist im Deutschen leicht holprig, spiegelt aber die durch ὡς und ἐν markierte Ausdrucksweise angemessen wider. „in dieser Zuversicht des Rühmens“ bleibt eng am griechischen, ist aber schwerfällig; „bei diesem zuversichtlichen Rühmen“ ist natürlich und lässt ὑπόστασις als Haltung/Basis offen genug.
  terminology: „Herr“ und „Rühmen“ sind angemessen. „Unvernunft“ kann ἀφροσύνη wiedergeben. Die Fußnote zu ὑπόστασις sollte bei der vorgeschlagenen Haupttextform nicht mehr ausschließlich von „Zuversicht“ sprechen, sondern die Bedeutungsbreite des griechischen Begriffs erläutern.
