  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext vorhandene Ergänzung „hier“ und wahrt bei κατὰ κύριον die sachlich wichtige Ambiguität im Haupttext. Die Schlusswendung wird in modernes, verständliches Deutsch überführt, ohne eine der diskutierten Bedeutungen von ὑπόστασις endgültig festzulegen; die Fußnote hält die Alternativen fest.
