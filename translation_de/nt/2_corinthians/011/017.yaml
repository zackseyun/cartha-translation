source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: de
  text: Was ich sage, sage ich nicht nach dem Herrn[a], sondern wie in Unvernunft[b], bei diesem zuversichtlichen Rühmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht als ein Wort vom Herrn“; auch möglich: „nicht nach dem Maßstab des Herrn“ oder „nicht nach der Art des Herrn“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „sondern gleichsam in Unvernunft“; sinngemäß: „sondern wie ein Narr“.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann hier auch „Grundlage“, „Angelegenheit“ oder „Unterfangen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: Was ich hier sage
  rationale: Die Wendung bezeichnet den Inhalt von Paulus’ gegenwärtiger Rede. „Hier“ macht den Bezug im modernen Deutsch natürlich deutlich, ohne neuen Sachinhalt einzuführen.
- source_word: οὐ κατὰ κύριον λαλῶ
  choice: sage ich nicht nach der Art des Herrn
  rationale: κατά mit Akkusativ bezeichnet hier wahrscheinlich Maßstab oder Weise. Die Formulierung bleibt offen dafür, ob Paulus an die Art, den Maßstab oder die Autorität des Herrn denkt.
- source_word: κύριον
  choice: Herrn
  rationale: Im Kontext bezieht sich κύριος am natürlichsten auf Jesus; die übliche Wiedergabe „Herr“ bewahrt diesen Bezug ohne erläuternden Zusatz.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: sondern wie in Unvernunft
  rationale: Die ungewöhnliche Formulierung wahrt die Abschwächung durch ὡς und macht Paulus nicht unmittelbar mit einem Unvernünftigen gleich. „Unvernunft“ ist würdig und verständlich, wenn auch bewusst weniger idiomatisch als „wie ein Narr“.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: in dieser Zuversicht
  rationale: ὑπόστασις kann hier eine zuversichtliche Haltung, Grundlage oder Angelegenheit bezeichnen. „Zuversicht“ passt zum rhetorischen Auftreten beim Rühmen, ohne die lexikalische Unsicherheit ganz aufzulösen.
- source_word: τῆς καυχήσεως
  choice: des Rühmens
  rationale: Der substantivierte Infinitiv bewahrt den Vorgangscharakter von καύχησις und den Genitivanschluss an „Zuversicht“.
theological_decisions:
- issue: Bedeutung von κατὰ κύριον
  choice: Paulus kennzeichnet die Weise seines folgenden Rühmens als nicht der Art oder dem Maßstab des Herrn entsprechend.
  alternative: Paulus könnte sagen, dass diese Worte nicht als unmittelbares Wort oder Gebot des Herrn gesprochen werden.
  rationale: Der griechische Ausdruck lässt mehrere Nuancen zu. Der Haupttext bevorzugt den Bezug auf Art oder Maßstab, während die Fußnote die mögliche Herkunfts- oder Autoritätsnuance bewahrt; eine Aussage gegen Inspiration oder Wahrhaftigkeit wird nicht hineingelesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst markierte Wendung „wie in Unvernunft“ hält sich eng an die ungewöhnliche griechische Ausdrucksweise; Fußnoten bieten idiomatischere und lexikalisch mögliche Alternativen. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
