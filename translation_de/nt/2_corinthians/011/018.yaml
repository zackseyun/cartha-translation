  text: ἐπεὶ πολλοὶ καυχῶνται ⸀κατὰ σάρκα, κἀγὼ καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: de
  text: Da viele sich nach dem Fleisch rühmen[a], werde auch ich mich rühmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach menschlichen Maßstäben« oder »auf rein menschliche Weise«.'
    reason: lexikalische Alternative zur idiomatischen Wendung κατὰ σάρκα
lexical_decisions:
- source_word: ἐπεὶ
  choice: Da
  rationale: Leitet den Grund für Paulus’ ironisch angekündigtes Vorgehen ein und gibt die kausale Bedeutung im Deutschen natürlich wieder.
- source_word: πολλοὶ
  choice: viele
  rationale: Gibt die quantitative Aussage schlicht und unmittelbar wieder.
- source_word: καυχῶνται
  choice: sich rühmen
  rationale: Passt zum polemisch-ironischen Zusammenhang und ermöglicht die Wiedergabe der Wiederholung desselben Verbs im zweiten Satzteil.
- source_word: κατὰ σάρκα
  choice: nach dem Fleisch
  rationale: Bewahrt den paulinischen Ausdruck und seine theologische Spannung, ohne ihn im Haupttext auf eine einzige Deutung wie »nach menschlichen Maßstäben« festzulegen.
- source_word: κἀγὼ
  choice: auch ich
  rationale: Gibt die Verbindung von καί und ἐγώ samt der rhetorischen Entsprechung zu den Vielen natürlich wieder.
- source_word: καυχήσομαι
  choice: werde ich mich rühmen
  rationale: Gibt das Futur wieder und bewahrt die bewusste Wiederholung von καυχάομαι.
theological_decisions:
- issue: Wiedergabe von σάρξ in κατὰ σάρκα
  choice: nach dem Fleisch
  alternative: nach menschlichen Maßstäben; auf rein menschliche Weise
  rationale: Die wörtlichere Fassung erhält den vielschichtigen paulinischen Begriff und lässt offen, ob vor allem menschliche Maßstäbe, äußerliche Vorzüge oder eine rein menschliche Betrachtungsweise gemeint sind. Die idiomatischen Deutungsmöglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sich rühmen« bewahrt den rhetorischen und biblischen Ton, bleibt aber allgemein verständlich. Die Stellung »auch ich« spiegelt den Nachdruck des griechischen κἀγώ.
