lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: Von den Juden
  rationale: ὑπό mit Genitiv bezeichnet hier die handelnden Personen beziehungsweise die Quelle der Bestrafung. „Von den Juden“ bewahrt diese Aussage, ohne eine bestimmte jüdische Behörde vorauszusetzen.
- source_word: πεντάκις
  choice: fünfmal
  rationale: Die direkte und natürliche Wiedergabe des Adverbs hält die Betonung der wiederholten Erfahrung fest.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: vierzig Schläge weniger einen
  rationale: Die Formulierung bewahrt die griechische Ausdrucksweise „vierzig weniger einen“. „Schläge“ wird aus dem Zusammenhang der körperlichen Bestrafung ergänzt.
- source_word: ἔλαβον
  choice: erhielt ich
  rationale: λαμβάνω bedeutet hier „empfangen/erhalten“ im Sinn des Erleidens einer Strafe. „Erhielt ich“ gibt das Verb knapp und idiomatisch wieder, ohne es zu „erduldete“ auszudeuten.
