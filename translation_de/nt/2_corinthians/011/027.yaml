  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: de
  text: in Mühe und Beschwerde, in vielen schlaflosen Nächten, in Hunger und Durst, in häufigem Fasten[a], in Kälte und Blöße[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung bezeichnet häufiges oder wiederholtes Fasten; ob es freiwillig geschah oder durch die Umstände erzwungen war, sagt der Text nicht.
    reason: lexical_alternative
  - marker: b
    text: Oder „Nacktheit“. Gemeint sein kann hier auch unzureichende Kleidung und damit das Ausgesetztsein gegenüber der Witterung.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: Mühe
  rationale: Das Wort bezeichnet anstrengende Arbeit und Mühsal. „Mühe“ ist natürliches, heutiges Deutsch und bewahrt den Gedanken körperlicher oder seelischer Anstrengung.
- source_word: μόχθῳ
  choice: Beschwerde
  rationale: Das Wort überschneidet sich mit κόπος, hebt aber stärker die belastende Härte hervor. „Beschwerde“ erhält die kumulative Paarung, ohne beide Begriffe gleich wiederzugeben.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: in vielen schlaflosen Nächten
  rationale: ἀγρυπνία bezeichnet Wachsein oder Schlaflosigkeit; der Plural mit πολλάκις wird im Deutschen idiomatisch als wiederholte schlaflose Nächte ausgedrückt.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: in Hunger und Durst
  rationale: Die beiden Dative benennen erlittene Zustände. Die Formulierung bewahrt die knappe Reihung und die Wiederholung von ἐν.
- source_word: ἐν νηστείαις πολλάκις
  choice: in häufigem Fasten
  rationale: νηστεία bezeichnet Fasten beziehungsweise Nahrungsenthaltung. Da zuvor bereits Hunger genannt wird, bleibt die lexikalische Unterscheidung erhalten; ob das Fasten freiwillig oder durch die Umstände erzwungen war, lässt der Text offen.
- source_word: ἐν ψύχει
  choice: in Kälte
  rationale: ψῦχος bezeichnet Kälte als erlittenen Zustand; „in Kälte“ fügt sich prägnant in die Aufzählung ein.
- source_word: γυμνότητι
  choice: Blöße
  rationale: γυμνότης kann Nacktheit oder einen Zustand unzureichender Bekleidung bezeichnen. „Blöße“ bleibt näher an der Breite des griechischen Ausdrucks als eine ausschließlich deutende Wiedergabe und passt zur Verbindung mit Kälte.
theological_decisions:
- issue: Bedeutung von νηστείαις in der Leidensaufzählung
  choice: Fasten
  alternative: Hunger beziehungsweise unfreiwilliger Nahrungsmangel
  rationale: Der Ausdruck bezeichnet lexikalisch Fasten, während λιμός bereits Hunger nennt. Die Übersetzung wahrt diese Unterscheidung und erläutert in der Fußnote, dass Freiwilligkeit oder Zwang nicht ausdrücklich bestimmt werden.
- issue: Bedeutung von γυμνότητι
  choice: Blöße
  alternative: Nacktheit oder unzureichende Kleidung und Ausgesetztsein
  rationale: Im Zusammenhang mit Kälte kann mangelnde Bekleidung gemeint sein, doch der griechische Begriff kann auch Nacktheit bezeichnen. Die Hauptübersetzung bewahrt diese Offenheit; die Fußnote erläutert die mögliche kontextuelle Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, rhythmischer Reihung. Die wiederholte Präposition „in“ bildet die griechische Struktur ab. „Blöße“ bewahrt die Mehrdeutigkeit von γυμνότης, ohne den Kontext vorschnell auf bloße Witterungsexposition festzulegen.
