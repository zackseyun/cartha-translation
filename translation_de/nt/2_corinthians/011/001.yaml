  text: Ὄφελον ἀνείχεσθέ μου μικρόν ⸀τι ⸀ἀφροσύνης· ἀλλὰ καὶ ἀνέχεσθέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: de
  text: Ich wünschte, ihr würdet mich ein wenig in meiner Torheit ertragen.[a] Doch ja, ertragt mich!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein wenig in meiner Unvernunft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: Ich wünschte
  rationale: Gibt den unerfüllten bzw. eindringlichen Wunsch idiomatisch und ohne altertümlichen Ton wieder.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: ihr würdet … ertragen / ertragt mich bitte
  rationale: ἀνέχομαι bezeichnet hier das geduldige Hinnehmen einer Person oder ihres Verhaltens. Die Wiederholung des Verbs bleibt erhalten; die zweite Formulierung gibt den erneuten Appell natürlich wieder.
- source_word: μου
  choice: von mir / mich
  rationale: Der Genitiv gehört zu ἀνέχομαι. Im ersten Satz macht „von mir“ die Unvernunft als die des Paulus kenntlich; im zweiten verlangt natürliches Deutsch „mich“.
- source_word: μικρόν τι
  choice: ein wenig
  rationale: Bewahrt die rhetorische Verkleinerung knapp und idiomatisch.
- source_word: ἀφροσύνης
  choice: Unvernunft
  rationale: Bezeichnet törichtes bzw. unvernünftiges Verhalten. „Unvernunft“ passt zu Paulus’ ironischer Selbstcharakterisierung und klingt im modernen Deutsch würdig; „Torheit“ bleibt als Alternative in der Fußnote.
- source_word: ἀλλὰ καὶ
  choice: Ja
  rationale: Die Verbindung nimmt den Wunsch nachdrücklich auf und führt ihn als direkten Appell weiter. „Ja“ gibt diese bestätigende Verstärkung im Deutschen natürlicher wieder als ein wörtliches „aber auch“.
theological_decisions:
- issue: Paulus bezeichnet sein bevorstehendes Reden als ἀφροσύνη
  choice: Die rhetorische Selbstcharakterisierung als „Unvernunft“ bleibt stehen.
  alternative: Die Aussage als bloßen Scherz, Unsinn oder angeblich echte moralische Torheit aufzulösen.
  rationale: Der Zusammenhang eröffnet Paulus’ ironisches Rühmen. Die Übersetzung bewahrt die Spannung, ohne sie dogmatisch oder psychologisch zu erklären.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem rhetorischem Ton. Der erste Satz wahrt die Wunschform, der zweite den nachdrücklichen direkten Appell.
