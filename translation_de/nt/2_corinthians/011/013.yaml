source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: de
  text: Denn solche Leute sind falsche Apostel, betrügerische Arbeiter, die sich als Apostel des Messias[a] ausgeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christi“ beziehungsweise „von Christus“. Das griechische Χριστός bedeutet „Messias“ und kann zugleich wie ein Name gebraucht werden.'
    reason: Bewahrt die mögliche stärker nameartige Wiedergabe des griechischen Titels, während der Haupttext dessen Bedeutung sichtbar macht.
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet die erklärende Begründung zum vorausgehenden Gedankengang und entspricht dem griechischen Satzanschluss knapp und natürlich.
- source_word: οἱ τοιοῦτοι
  choice: solche Leute
  rationale: Bezeichnet die eben beschriebene Gruppe. Die Formulierung ist im modernen Deutsch natürlich, ohne über das Griechische hinaus ausdrücklich „Männer“ einzusetzen.
- source_word: ψευδαπόστολοι
  choice: falsche Apostel
  rationale: Gibt das zusammengesetzte Substantiv transparent als Menschen wieder, die zu Unrecht apostolische Autorität beanspruchen.
- source_word: ἐργάται δόλιοι
  choice: betrügerische Arbeiter
  rationale: Bewahrt sowohl die Tätigkeitsbezeichnung als auch die moralische Kennzeichnung durch Täuschung und Arglist.
- source_word: μετασχηματιζόμενοι εἰς
  choice: die sich als … ausgeben
  rationale: Drückt im Kontext die täuschende Annahme einer äußeren Rolle aus, ohne eine innere Wesensverwandlung zu behaupten.
- source_word: ἀποστόλους Χριστοῦ
  choice: Apostel des Messias
  rationale: Der Genitiv bezeichnet Zugehörigkeit beziehungsweise Beauftragung; Χριστός wird hier in seinem erkennbaren Titelsinn mit „Messias“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / von Christus
  rationale: 'In der Verbindung „Apostel des Χριστός“ bleibt der Titelsinn deutlich: Gemeint sind Gesandte, die zum Messias gehören und ihn vertreten. Die Alternative „Christus“ ist traditionell und lexikalisch ebenfalls möglich, lässt den Titelinhalt im heutigen Deutsch jedoch weniger deutlich hervortreten.'
- issue: Bedeutung von μετασχηματιζόμενοι
  choice: die sich als … ausgeben
  alternative: die sich als … verkleiden / tarnen
  rationale: Die Form bezeichnet hier eine täuschende äußere Selbstdarstellung. „Sich ausgeben als“ hält fest, dass der beanspruchte apostolische Status falsch ist, ohne eine körperliche Verkleidung nahezulegen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. „Solche Leute“ ist natürlicher als „solche Männer“ oder „solche“, und „sich als … ausgeben“ vermittelt die im Zusammenhang entscheidende betrügerische Selbstdarstellung.
