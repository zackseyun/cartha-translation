- from: Denn ich eifere um euch mit Gottes Eifer[a]; ich habe euch ja mit einem einzigen Mann verlobt, um euch dem Messias als reine Jungfrau zuzuführen[b].
  to: Denn ich eifere um euch mit Gottes Eifer[a]; ich habe euch ja einem einzigen Mann verlobt, um euch dem Messias als reine Jungfrau vorzustellen[b].
  rationale: Die Revision berichtigt die deutsche Rektion von „jemanden jemandem verloben“, ohne das eheliche Bild oder die betonte Bindung an einen Mann zu verändern. „Vorstellen“ gibt das feierlich-zielgerichtete παραστῆσαι unmittelbar wieder. Fußnote b wird auf die tatsächliche lexikalische Alternative zu „Messias“ beschränkt.
