  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: de
  text: Denn ich eifere um euch mit Gottes Eifer[a]; ich habe euch ja einem einzigen Mann verlobt, um euch dem Messias als reine Jungfrau vorzustellen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit göttlichem Eifer“. Die griechische Formulierung kann Gottes eigenen Eifer oder einen von Gott geprägten Eifer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλῶ
  choice: ich eifere um
  rationale: Das Verb bezeichnet hier keinen kleinlichen Neid, sondern leidenschaftliche, schützende Sorge. „Um euch eifern“ bewahrt diese positive und zugleich exklusive Färbung im Verlobungsbild.
- source_word: θεοῦ ζήλῳ
  choice: mit Gottes Eifer
  rationale: 'Die Genitivverbindung bleibt bewusst offen: Der Eifer kann Gott gehören, von ihm ausgehen oder seinem Wesen entsprechen. „Gottes Eifer“ gibt die Form knapp und unmittelbar wieder.'
- source_word: ἡρμοσάμην
  choice: ich habe ... verlobt
  rationale: Das Verb bezeichnet im Zusammenhang das Versprechen beziehungsweise Zuführen zur Ehe. „Verlobt“ erhält das konkrete Ehebild in natürlichem Deutsch.
- source_word: ἑνὶ ἀνδρὶ
  choice: mit einem einzigen Mann
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten. „Mit einem einzigen Mann verlobt“ ist idiomatisch und hebt die im Zahlwort betonte Ausschließlichkeit hervor, ohne den noch zukünftigen Ehestand vorwegzunehmen.
- source_word: παρθένον ἁγνήν
  choice: als reine Jungfrau
  rationale: Die Wendung erhält sowohl das Brautbild als auch die Aussage von Reinheit und ungeteilter Treue.
- source_word: παραστῆσαι
  choice: zuzuführen
  rationale: Im Hochzeitsbild meint das Verb das feierliche Vorstellen beziehungsweise Übergeben der Braut. „Zuzuführen“ klingt im Deutschen natürlich und bewahrt den zielgerichteten, zeremoniellen Sinn.
- source_word: τῷ Χριστῷ
  choice: dem Messias
  rationale: Mit Artikel und innerhalb des Braut-Bräutigam-Bildes ist Χριστός als Titel verständlich; daher „dem Messias“.
theological_decisions:
- issue: Art des Eifers
  choice: Paulus beschreibt eine schützende, von Gott bestimmte Eifersucht beziehungsweise einen solchen Eifer.
  alternative: Paulus spricht lediglich von seinem eigenen intensiven Einsatz für die Gemeinde.
  rationale: θεοῦ ζήλῳ und das exklusive Ehebild legen einen göttlichen beziehungsweise gottgemäßen Eifer nahe. Die Übersetzung lässt die genaue Genitivbeziehung offen.
- issue: Bezug von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der bestimmte Artikel und die Rolle als Bräutigam lassen den Titelcharakter hervortreten; „Christus“ bleibt als geläufige Wiedergabe möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konnektoren γάρ ... γάρ werden mit „Denn ... ja“ wiedergegeben, um die begründende Struktur ohne schwerfällige Wiederholung von „denn“ zu erhalten. Das durchgehende Verlobungs- und Brautbild bleibt ausdrücklich bestehen.
