review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird gut getroffen: ζηλῶ/ζῆλος ist im ehelichen Bild angemessen mit „eifern/Eifer“ wiedergegeben; „Gottes Eifer“ lässt die Genitivbeziehung offen. Das Brautbild, die Reinheit und der Titel „Messias“ bleiben erhalten. Allerdings verlangt ἡρμοσάμην ... ἑνὶ ἀνδρί hier im Deutschen die Konstruktion „jemanden einem Mann verloben“, nicht „mit einem Mann verloben“.'
  naturalness: „Denn ich eifere um euch mit Gottes Eifer“ ist in einem würdevollen modernen Bibelregister verständlich. „Einem einzigen Mann verlobt“ ist nach Korrektur der Präposition idiomatisch. „Vorstellen“ gibt παραστῆσαι präzise und natürlich wieder; „zuführen“ ist zwar möglich, wirkt aber weniger neutral und ist semantisch enger.
  terminology: '„Messias“ entspricht dem titelhaften τῷ Χριστῷ und der vorgegebenen Terminologie. „Reine Jungfrau“ bewahrt παρθένον ἁγνήν. Die Fußnote b muss als bloße terminologische Alternative formuliert werden: „Christus vorzustellen“ suggeriert dagegen eine abweichende Verbformulierung und lässt die Alternative unklar.'
  issues:
  - severity: medium
    issue: „mit einem einzigen Mann verlobt“
    rationale: 'Das Deutsche verwendet bei der transitiven Bedeutung von „verloben“ in diesem Kontext den Dativ der Person, der jemand versprochen wird: „jemanden einem Mann verloben“. Die Fassung mit „mit“ verschiebt die Konstruktion in Richtung einer beiderseitigen Verlobung und bildet die Rolle des Paulus als Handelnder weniger genau ab.'
  - severity: low
    issue: Fußnote b ist unpräzise formuliert
    rationale: 'Die englische Audit-Fußnote bietet lediglich „Christ/Christus“ als Alternative zu „Messias“. „Oder: ‚Christus vorzustellen‘“ vermischt diese Alternative mit dem Verb und erklärt nicht klar, welcher Ausdruck betroffen ist.'
  revised_text: Denn ich eifere um euch mit Gottes Eifer[a]; ich habe euch ja einem einzigen Mann verlobt, um euch dem Messias als reine Jungfrau vorzustellen[b].
