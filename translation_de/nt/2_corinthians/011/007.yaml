  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: de
  text: Oder habe ich eine Sünde begangen[a], indem ich mich erniedrigte, damit ihr erhöht würdet, weil ich euch das Evangelium Gottes unentgeltlich[b] verkündigt habe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »habe ich gesündigt«; wörtlich lautet die griechische Wendung: »habe ich eine Sünde getan/gemacht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ohne Bezahlung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Oder
  rationale: Leitet eine rhetorische Alternative beziehungsweise Frage im Anschluss an den vorherigen Gedankengang ein und bewahrt Paulus’ zugespitzten Stil.
- source_word: ἁμαρτίαν ἐποίησα
  choice: habe ich eine Sünde begangen
  rationale: Gibt die griechische Wendung wörtlichkeitsnah und zugleich idiomatisch wieder; die moralische Kategorie »Sünde« bleibt ausdrücklich erhalten.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: als ich mich selbst erniedrigte
  rationale: Gibt das adverbiale Partizip natürlich wieder und bewahrt den reflexiven Sinn sowie den Gegensatz zum Erhöhtwerden der Adressaten.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: damit ihr erhöht würdet
  rationale: Bewahrt den Zwecksatz, das Passiv und den rhetorischen Gegensatz zwischen Paulus’ Erniedrigung und der Erhöhung der Korinther.
- source_word: ὅτι
  choice: weil
  rationale: Kennzeichnet verständlich den Grund beziehungsweise den Inhalt der vermeintlichen Sünde, ohne die Beziehung stärker auszudeuten.
- source_word: δωρεὰν
  choice: unentgeltlich
  rationale: Drückt präzise aus, dass Paulus keine Bezahlung verlangte, und entspricht einem würdigen modernen Register.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: das Evangelium Gottes
  rationale: Bewahrt die Genitivkonstruktion und die geläufige paulinische Ausdrucksweise.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: ich euch … verkündigt habe
  rationale: Gibt die öffentliche Mitteilung der guten Botschaft in natürlichem, kirchlich nicht unnötig verengtem Deutsch wieder.
theological_decisions:
- issue: Paulus’ rhetorische Frage zu Erniedrigung und finanzieller Unterstützung
  choice: Die Frage wird direkt und mit ihrer ironischen Spannung wiedergegeben, ohne ein Urteil über die Vergütung geistlicher Dienste hinzuzufügen.
  alternative: Eine Paraphrase, die ausdrücklich einen apostolischen Rechtsanspruch behauptet oder die Ironie zu einer bloßen Entschuldigung abschwächt.
  rationale: Der griechische Text fragt zugespitzt, ob Paulus durch seine Selbsterniedrigung und die unentgeltliche Verkündigung gesündigt habe. Diese Spannung soll stehen bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Spannung und die rhetorische Schärfe bleiben erhalten; »erniedrigte/erhöht würdet« bildet den griechischen Gegensatz sichtbar ab.
