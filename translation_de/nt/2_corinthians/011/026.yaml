    text: 'Oder: „von meinen eigenen Volksgenossen“. Das Griechische sagt wörtlich: „aus [meiner] eigenen Volkszugehörigkeit/Verwandtschaft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder erklärend: „unter falschen Glaubensbrüdern“. Das griechische Wort bedeutet wörtlich „falsche Brüder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: oft auf Reisen
  rationale: Die idiomatische deutsche Wendung gibt die wiederholte Reisetätigkeit natürlich wieder und bewahrt den knappen Auftakt der Aufzählung.
- source_word: κινδύνοις
  choice: in Gefahren
  rationale: Die wiederholte Formulierung erhält die eindringliche, sich steigernde Satzstruktur des Griechischen.
- source_word: ποταμῶν
  choice: durch Flüsse
  rationale: Der Genitiv bezeichnet hier Quelle oder Art der Gefahr. Die Übersetzung lässt wie der griechische Text offen, ob etwa Strömungen, Hochwasser oder Überquerungen gemeint sind.
- source_word: λῃστῶν
  choice: durch Räuber
  rationale: „Räuber“ ist eine klare, allgemein verständliche Wiedergabe von λῃσταί; „Banditen“ wäre ebenfalls möglich.
- source_word: ἐκ γένους
  choice: durch mein eigenes Volk
  rationale: γένος bezeichnet hier die eigene ethnische Herkunftsgruppe des Paulus. „Mein eigenes Volk“ macht den impliziten Bezug verständlich, ohne ausdrücklich „Juden“ in den Haupttext einzutragen.
- source_word: ἐξ ἐθνῶν
  choice: durch Nichtjuden
  rationale: Im Gegensatz zu Paulus’ eigenem Volk bezeichnet ἔθνη Menschen aus den anderen Völkern. „Nichtjuden“ stellt diesen Kontrast in heutigem Deutsch unmittelbar und ohne kirchlichen Fachausdruck dar.
- source_word: ἐν πόλει
  choice: in der Stadt
  rationale: Der Singular wird entsprechend dem griechischen Wortlaut bewahrt und kann allgemein beziehungsweise distributiv verstanden werden.
- source_word: ἐν ἐρημίᾳ
  choice: in der Wildnis
  rationale: „Wildnis“ deckt das Bedeutungsspektrum von ἐρημία als unbewohnte, einsame oder wüstenartige Gegend besser ab als das engere „Wüste“.
- source_word: ἐν θαλάσσῃ
  choice: auf dem Meer
  rationale: Dies ist für Gefahren während einer Seereise die natürliche deutsche Wendung und entspricht dem örtlichen Sinn der Präposition.
- source_word: ἐν ψευδαδέλφοις
  choice: unter falschen Brüdern
  rationale: Die Wiedergabe folgt dem ausdrücklich maskulinen Kompositum ψευδάδελφοι und bewahrt dessen scharfe, spannungsreiche Bezeichnung, ohne die Echtheit des Glaubens näher auszudeuten.
theological_decisions:
- issue: Bezeichnung der ψευδάδελφοι
  choice: unter falschen Brüdern
  alternative: unter Menschen, die sich fälschlich als Glaubensgeschwister ausgeben
  rationale: Der Haupttext bleibt bei der wörtlich nahen, grammatisch maskulinen Bezeichnung. Eine erklärende Umschreibung würde genauer festlegen, worin ihre Falschheit besteht, obwohl der Ausgangstext dies offenlässt.
- issue: Gegenüberstellung von ἐκ γένους und ἐξ ἐθνῶν
  choice: durch mein eigenes Volk / durch Nichtjuden
  alternative: durch meine Volksgenossen / durch die Völker
  rationale: Die gewählte Form gibt den ethnischen Gegensatz verständlich wieder, ohne ihn ausdrücklich mit zusätzlichen theologischen Kategorien zu füllen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die neunfache Wiederholung von „in Gefahren“ bewahrt den rhetorischen Nachdruck und die kumulative Wirkung des griechischen Textes; die Formulierung bleibt als Teil des fortlaufenden Satzes kleingeschrieben und endet mit einem Komma.
