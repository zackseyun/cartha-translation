  text: oft auf Reisen, in Gefahren durch Flüsse, in Gefahren durch Räuber, in Gefahren von Seiten meines eigenen Volkes[a], in Gefahren von Seiten der Nichtjuden, in Gefahren in der Stadt, in Gefahren in der Wildnis, in Gefahren auf dem Meer, in Gefahren unter falschen Brüdern[b],
  philosophy: optimal-equivalence
  footnotes:
