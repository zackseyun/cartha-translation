base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: de
  text: Abgesehen von allem anderen[a] lastet täglich der Druck auf mir:[b] die Sorge um alle Gemeinden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Neben allem Übrigen«; oder: »Abgesehen von dem, was unerwähnt bleibt«; möglicherweise auch: »Abgesehen von den äußeren Dingen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »liegt täglich die Belastung auf mir«; wörtlicher auch: »das tägliche Andrängen gegen mich«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »die Angst um alle Gemeinden«; auch: »die Fürsorge für alle Gemeinden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: Abgesehen von dem, was sonst noch hinzukommt
  rationale: Die schwierige Wendung bezeichnet das, was neben der zuvor aufgezählten Not noch besteht oder hinzukommt. Die Übersetzung hält den Bezug bewusst offen und legt sich weder ausschließlich auf äußere Umstände noch auf unerwähnte Einzelheiten fest.
- source_word: ἐπίστασίς μοι
  choice: lastet ... der Druck auf mir
  rationale: ἐπίστασις kann ein Andrängen oder einen Druck bezeichnen. Zusammen mit dem Dativ μοι wird die persönliche Belastung natürlich wiedergegeben, ohne einen buchstäblichen Menschenandrang anzunehmen.
- source_word: ἡ καθ’ ἡμέραν
  choice: täglich
  rationale: Die attributive Wendung bezeichnet den Tag für Tag wiederkehrenden Charakter des Drucks.
- source_word: ἡ μέριμνα
  choice: die Sorge
  rationale: Sorge bewahrt sowohl die fürsorgliche als auch die belastende Seite des Ausdrucks, ohne ihn vorschnell als moralisch problematische Angst zu deuten.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: um alle Gemeinden
  rationale: Im paulinischen Zusammenhang bezeichnet ἐκκλησία die christlichen Ortsgemeinden; im modernen Deutschen ist Gemeinden hier natürlicher und eindeutiger als Kirchen.
theological_decisions:
- issue: Charakter der μέριμνα des Paulus
  choice: die Sorge um alle Gemeinden
  alternative: die Angst um alle Gemeinden; die Fürsorge für alle Gemeinden
  rationale: Sorge erhält die Spannung zwischen verantwortlicher pastoraler Fürsorge und emotionaler Belastung, ohne eine sündhafte Angst zu unterstellen oder die Belastung abzuschwächen.
- issue: Verhältnis von ἐπίστασις und μέριμνα
  choice: Die Sorge wird durch den Doppelpunkt als nähere Erläuterung des täglichen Drucks dargestellt.
  alternative: Druck und Sorge als zwei voneinander getrennte Belastungen wiedergeben
  rationale: Die appositionelle Struktur des Griechischen legt nahe, dass die Sorge um die Gemeinden den täglichen Druck näher bestimmt; die Satzzeichnung macht dies sichtbar, ohne eine strikte dogmatische Aussage daraus abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Hauptsatz bildet die gedrängte griechische Struktur lesbar nach. »Gemeinden« entspricht dem üblichen paulinischen Sinn von ἐκκλησίαι; die Fußnoten dokumentieren die echten lexikalischen Alternativen und die Unsicherheit der ungewöhnlichen Wendungen.
