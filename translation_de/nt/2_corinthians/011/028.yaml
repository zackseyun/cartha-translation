  source_fidelity: Die Wiedergabe von ἐπίστασις als „Druck“ und von μέριμνα als „Sorge“ ist sachgerecht; auch die appositionelle Erklärung der Sorge als Inhalt des täglichen Drucks wird durch den Doppelpunkt gut sichtbar. Die Formulierung „was sonst noch hinzukommt“ kann jedoch einen zeitlichen oder sachlichen Zuwachs nahelegen, den χωρὶς τῶν παρεκτός nicht ausdrücklich enthält. Die griechische, elliptische Wendung bezeichnet allgemeiner „alles Übrige“ bzw. die nicht eigens genannten Dinge.
  naturalness: „Abgesehen von allem anderen“ ist im modernen Standarddeutsch knapp, idiomatisch und wahrt die beabsichtigte Offenheit besser. „Täglich lastet der Druck auf mir“ ist natürlich und behält die gedrängte Satzform bei.
  terminology: „Gemeinden“ ist im paulinischen Kontext eine angemessene moderne Wiedergabe von ἐκκλησίαι. „Sorge“ bewahrt bei μέριμνα sowohl die belastende als auch die fürsorgliche Nuance, ohne sie zu einer psychologischen „Angst“ oder bloßen administrativen „Fürsorge“ einzuengen.
