  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: de
  text: Als Mitarbeiter bitten wir euch auch eindringlich, die Gnade Gottes nicht vergeblich zu empfangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: Als Gottes Mitarbeiter
  rationale: Das Partizip bezeichnet gemeinsames Wirken. Aus dem unmittelbaren Zusammenhang über Gottes versöhnendes Handeln und den apostolischen Dienst ist Gott der wahrscheinlich mitgemeinte Partner; Deutsch erlaubt eine natürliche Wiedergabe als Rollenangabe. Die Ergänzung wird wegen der grammatischen Offenheit des Griechischen durch eine Fußnote kenntlich gemacht.
- source_word: δὲ
  choice: deshalb
  rationale: δέ markiert hier einen milden Übergang. „Deshalb“ stellt im Deutschen den engen gedanklichen Anschluss an 5,20 und die dortige Bitte heraus, ohne einen Gegensatz zu erzeugen.
- source_word: καὶ
  choice: —
  rationale: Das additive καί ist im natürlichen deutschen Satzfluss zusammen mit dem Übergang in „deshalb“ aufgenommen; ein zusätzliches „auch“ wäre möglich, aber stilistisch schwerfälliger.
- source_word: παρακαλοῦμεν
  choice: bitten wir euch eindringlich
  rationale: παρακαλέω bezeichnet hier einen ernsthaften Appell. „Eindringlich bitten“ ist modern, klar und kräftiger als ein bloßes „bitten“, ohne das weniger allgemeinsprachliche „ermahnen“ vorauszusetzen.
- source_word: μὴ
  choice: nicht
  rationale: Die Verneinung gehört zur Infinitivkonstruktion und wird direkt mit „nicht“ wiedergegeben.
- source_word: εἰς κενὸν
  choice: vergeblich
  rationale: Die Wendung bedeutet „ohne Wirkung“ oder „ohne Ergebnis“. „Vergeblich“ bewahrt ihre knappe rhetorische Kraft.
- source_word: τὴν χάριν
  choice: die Gnade
  rationale: χάρις bezeichnet hier Gottes gnädiges Handeln beziehungsweise seine Gabe. „Gnade“ ist die präzise und im paulinischen Sprachgebrauch gewichtige deutsche Entsprechung.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird unmittelbar als „Gottes“ wiedergegeben und nicht deutender als „von Gott“.
- source_word: δέξασθαι
  choice: Empfangt
  rationale: δέχομαι bedeutet „empfangen“ oder „annehmen“. Der deutsche Imperativ bildet den Inhalt des griechischen AcI nach παρακαλοῦμεν natürlich und unmittelbar ab.
- source_word: ὑμᾶς
  choice: euch / implizites ihr in „Empfangt“
  rationale: Das Akkusativsubjekt des Infinitivs erscheint zunächst als Objekt von „bitten“ und wird im anschließenden deutschen Aufforderungssatz als angesprochenes „ihr“ ausgedrückt.
theological_decisions:
- issue: Mit wem Paulus und seine Mitarbeiter zusammenwirken
  choice: „Als Gottes Mitarbeiter“ versteht den unausgesprochenen Partner im Kontext als Gott.
  alternative: „Als Mitarbeiter“ oder „Indem wir mitwirken“ lässt den Partner unausgesprochen; möglich ist auch ein gemeinsames Wirken der apostolischen Mitarbeiter untereinander.
  rationale: Der vorausgehende Abschnitt stellt Gottes Versöhnungshandeln und den von ihm übertragenen Botschafterdienst in den Mittelpunkt (5,18–20). Gott ist daher der wahrscheinlichste Bezug, doch da συνεργοῦντες selbst kein Objekt nennt, bleibt die offenere Lesart in der Fußnote erhalten.
- issue: Die Möglichkeit, Gottes Gnade „vergeblich“ zu empfangen
  choice: Die spannungsreiche Formulierung wird ohne dogmatische Erklärung direkt bewahrt.
  alternative: Eine deutende Wiedergabe wie „ohne dass sie in eurem Leben Wirkung zeigt“ würde den Sinn konkretisieren.
  rationale: Der Vers erklärt nicht ausdrücklich, worin das vergebliche Empfangen besteht. Eine Konkretisierung würde eine theologische Deutung in den Haupttext eintragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Doppelpunkt macht den Inhalt des Appells klar und vermeidet eine schwerfällige deutsche Infinitivkonstruktion. „Gottes Mitarbeiter“ ist verständlich und kontextuell begründet; die Fußnote bewahrt die echte syntaktische Offenheit.
