source:
  edition: SBLGNT
  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: de
  text: Darum geht aus ihrer Mitte fort und sondert euch ab, sagt der Herr, und berührt nichts Unreines[a]; und auch ich werde euch aufnehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung greift prophetische Sprache des Alten Testaments auf, besonders Jesaja 52,11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang knapp und natürlich.
- source_word: ἐξέλθατε ἐκ μέσου αὐτῶν
  choice: geht aus ihrer Mitte hinaus
  rationale: Bewahrt den räumlichen und sozialen Trennungsgedanken sowie den entschiedenen Aufforderungscharakter des Aoristimperativs.
- source_word: ἀφορίσθητε
  choice: sondert euch ab
  rationale: Gibt den passivischen Imperativ im Deutschen idiomatisch wieder, ohne die geforderte Abgrenzung inhaltlich näher zu bestimmen.
- source_word: λέγει κύριος
  choice: sagt der Herr
  rationale: Entspricht der prophetischen Zitationsformel und gibt κύριος im neutestamentlichen Kontext mit »Herr« wieder.
- source_word: ἀκαθάρτου μὴ ἅπτεσθε
  choice: berührt nichts Unreines
  rationale: Das substantivierte neutrale Adjektiv wird natürlich als »nichts Unreines« wiedergegeben; »berührt« bewahrt die Reinheits- und Trennungsbildsprache.
- source_word: κἀγὼ εἰσδέξομαι ὑμᾶς
  choice: dann werde auch ich euch aufnehmen
  rationale: »auch ich« erhält die Betonung von κἀγώ; »aufnehmen« bezeichnet eine wohlwollende Annahme. »Dann« macht den im Deutschen natürlichen Anschluss deutlich, ohne eine weitergehende Aussage einzuführen.
theological_decisions:
- issue: Wiedergabe von κύριος in einem prophetischen Zitat mit alttestamentlichem Hintergrund
  choice: Herr
  alternative: HERR; Gebieter
  rationale: Der griechische neutestamentliche Text hat κύριος. »Herr« bewahrt diese Form, ohne die alttestamentliche Gottesnamenschreibung in den Text einzutragen.
- issue: Reichweite des Absonderungsgebots
  choice: sondert euch ab
  alternative: seid abgesondert; lasst euch aussondern
  rationale: Die Formulierung bewahrt die nachdrückliche Aufforderung zur Abgrenzung, legt aber nicht fest, dass damit völliger Rückzug von allen Außenstehenden gemeint sei.
- issue: Verhältnis zwischen Aufforderung und göttlicher Aufnahme
  choice: dann werde auch ich euch aufnehmen
  alternative: und ich werde euch aufnehmen
  rationale: Das griechische καί verbindet die Aussagen; der deutsche Anschluss mit »dann« lässt die antwortende Verheißung erkennen, ohne sie als Verdienst- oder Heilsbedingung näher auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der prophetische Zitatcharakter bleibt hörbar; zugleich werden ungewöhnlich steife Wendungen wie »aus der Mitte von ihnen« vermieden.
