  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: de
  text: Und ich werde euch Vater sein[a], und ihr werdet mir Söhne und Töchter sein, spricht der Herr, der Allmächtige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich werde euch zum Vater sein, und ihr werdet mir zu Söhnen und Töchtern sein.“ Das Griechische verwendet hier eine Wendung für eine wechselseitige Beziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: ich werde euch Vater sein
  rationale: Die deutsche Wendung gibt die griechische Bundesformel knapp und natürlich wieder und bewahrt zugleich die relationale Dativkonstruktion. Der Verzicht auf den unbestimmten Artikel ist bei der prädikativen Beziehungsbezeichnung „Vater“ idiomatisch.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: ihr werdet mir … sein
  rationale: Das ausdrückliche „ihr“ wahrt die Gegenüberstellung und die wechselseitige Struktur der Zusage; „mir“ bildet μοι unmittelbar ab.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: Söhne und Töchter
  rationale: Der griechische Text nennt beide Gruppen ausdrücklich. „Kinder“ wäre flüssig, würde aber die betonte Nennung der Töchter einebnen.
- source_word: λέγει
  choice: spricht
  rationale: „Spricht“ ist im Deutschen eine gegenwärtige, würdige und vertraute Wiedergabe der Schriftzitat-Formel, ohne den Präsenscharakter aufzugeben.
- source_word: κύριος
  choice: der Herr
  rationale: „Herr“ ist hier die sachgemäße Wiedergabe des göttlichen Titels κύριος.
- source_word: παντοκράτωρ
  choice: der Allmächtige
  rationale: Das substantivierte „der Allmächtige“ gibt παντοκράτωρ als eigenständigen göttlichen Titel präzise und idiomatisch wieder.
theological_decisions:
- issue: Ausdruck der gegenseitigen Bundesbeziehung
  choice: „ich werde euch Vater sein … ihr werdet mir Söhne und Töchter sein“
  alternative: „ich werde für euch ein Vater sein … ihr werdet für mich Söhne und Töchter sein“
  rationale: Die gewählte Form bewahrt die relationale Symmetrie des Griechischen in natürlichem Deutsch, ohne die Aussage als bloße Funktion oder Rolle umzudeuten.
- issue: Ausdrückliche Einbeziehung beider Geschlechter
  choice: „Söhne und Töchter“
  alternative: „Kinder“
  rationale: Die explizite Paarung υἱοὺς καὶ θυγατέρας wird erhalten; so bleibt die markierte Einbeziehung der Töchter sichtbar.
- issue: Wiedergabe des göttlichen Titels κύριος παντοκράτωρ
  choice: „der Herr, der Allmächtige“
  alternative: „der allmächtige Herr“
  rationale: Die Apposition lässt beide griechischen Titel erkennbar und vermeidet es, παντοκράτωρ lediglich als Eigenschaftsadjektiv zu behandeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die feierliche Zitat-Formel bleiben erhalten; unnötig altertümliche Formen werden vermieden.
