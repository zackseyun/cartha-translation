  source_fidelity: Der Haupttext bewahrt die beiden Körperbilder und die resultative Aussage der griechischen Perfektformen im Wesentlichen. »Unser Herz ist weit geworden« gibt πεπλάτυνται vertretbar wieder. In Fußnote b entfernt jedoch »weit geöffnet« das Bild des Weitwerdens/Weitgemachtwerdens zugunsten eines anderen Bildes und »für euch« zieht die Präpositionalbestimmung aus dem ersten Satzteil ohne ausdrückliche Grundlage in den zweiten hinüber.
  naturalness: »Unser Mund hat sich euch gegenüber geöffnet« ist bewusst bildhaft und im würdevollen modernen Standarddeutsch noch verständlich; die idiomatische Paraphrase in Fußnote a ist hilfreich. »Unser Herz ist weit geworden« ist leicht poetisch, aber als bewahrte Metapher tragfähig. Die bisherige zweite Fußnote klingt dagegen teils unidiomatisch und unnötig interpretierend.
