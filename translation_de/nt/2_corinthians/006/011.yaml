base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: de
  text: Unser Mund hat sich euch gegenüber geöffnet[a], ihr Korinther; unser Herz ist weit geworden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß: »Wir haben offen zu euch gesprochen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Unser Herz hat sich geweitet« oder »Unser Herz ist weit.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: Mund
  rationale: Die wörtliche Wiedergabe bewahrt Paulus’ körperliches Bild und die rhetorische Verbindung mit dem »Herzen« im zweiten Satzteil.
- source_word: ἀνέῳγεν
  choice: hat sich … geöffnet
  rationale: Die Perfektform bezeichnet einen aus vorausgegangenem Geschehen entstandenen gegenwärtigen Zustand. Die deutsche Formulierung erhält sowohl diesen Aspekt als auch das Bild des geöffneten Mundes.
- source_word: πρὸς ὑμᾶς
  choice: euch gegenüber
  rationale: Die Wendung gibt die Ausrichtung der offenen Rede auf die Adressaten natürlich wieder und passt im Deutschen zum Verb »sich öffnen«.
- source_word: Κορίνθιοι
  choice: ihr Korinther
  rationale: Der Vokativ wird als direkte, persönliche Anrede wiedergegeben; das ergänzte »ihr« macht diese Funktion im modernen Deutschen deutlich.
- source_word: καρδία
  choice: Herz
  rationale: »Herz« bewahrt das zentrale biblische Bild für das Innere und die Zuneigung und entspricht dem körperlichen Bild »Mund«.
- source_word: πεπλάτυνται
  choice: ist weit geworden
  rationale: Die Formulierung bildet die Grundbedeutung »weit machen/werden« und den resultierenden Zustand der griechischen Perfektform ab, ohne die Metapher erklärend aufzulösen.
theological_decisions:
- issue: Bildsprache für die Offenheit und Zuneigung des Paulus
  choice: Die Bilder vom geöffneten Mund und vom weit gewordenen Herzen bleiben im Haupttext erhalten.
  alternative: »Wir haben offen zu euch gesprochen, ihr Korinther; unser Herz steht euch weit offen.«
  rationale: Die metaphorische Spannung zwischen Rede und innerer Weite gehört zur Rhetorik des griechischen Textes. Eine rein sinngemäße Wiedergabe wäre verständlicher, würde aber die beiden aufeinander bezogenen Körperbilder teilweise auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Bildsprache des griechischen Textes wird bewusst bewahrt; die Fußnoten bieten idiomatischere Lesarten.
