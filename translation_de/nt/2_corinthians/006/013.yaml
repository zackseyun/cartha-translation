  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: de
  text: Als entsprechende Erwiderung[a] – ich sage es wie zu Kindern – weitet auch ihr euch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Gegenleistung“, „als Vergeltung“ oder „als Erwiderung in gleicher Weise“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werdet weit gemacht“ bzw. „weitet euch“. Im Zusammenhang geht es um eine weite, liebevolle und aufnahmebereite Haltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: Als gleiche Erwiderung
  rationale: ἀντιμισθία bezeichnet eine entsprechende Gegenleistung oder wechselseitige Antwort. „Erwiderung“ gibt hier die von Paulus erbetene entsprechende Reaktion wieder, ohne einen finanziellen Lohn anzudeuten; αὐτήν wird durch „gleiche“ ausgedrückt. Das schwach weiterführende δέ muss im Deutschen nicht eigens mit einem scharfen „aber“ wiedergegeben werden.
- source_word: ὡς τέκνοις λέγω
  choice: ich rede zu euch wie zu Kindern
  rationale: Die Formulierung bewahrt die familiäre Anrede, ohne das im Griechischen nicht ausdrücklich vorhandene Possessivpronomen „meinen“ hinzuzufügen. „Zu euch“ macht im Deutschen den Bezug auf die Angeredeten natürlich deutlich.
- source_word: πλατύνθητε
  choice: öffnet euch weit
  rationale: Das Verb bedeutet wörtlich „weit werden/weit gemacht werden“. Im Zusammenhang bezeichnet es eine weite, aufnahmebereite Zuwendung. Die reflexive deutsche Wendung bewahrt das Bild, ohne das nicht ausdrücklich genannte Wort „Herzen“ in den Haupttext einzufügen.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: 'Die Wendung betont die Gegenseitigkeit: Wie Paulus und seine Mitarbeiter sich geöffnet haben, sollen es auch die Korinther tun.'
theological_decisions:
- issue: Ob Paulus die Angeredeten ausdrücklich als seine Kinder bezeichnet
  choice: „wie zu Kindern“ ohne „meinen“
  alternative: „wie zu meinen Kindern“
  rationale: Der Zusammenhang vermittelt einen väterlichen Ton, doch im griechischen Text steht kein Possessivpronomen. Die Übersetzung wahrt daher die familiäre Beziehung, ohne sie ausdrücklich possessiv zu formulieren.
- issue: Ob das Herz als Gegenstand des Sichöffnens ausdrücklich genannt wird
  choice: „öffnet euch weit“
  alternative: „öffnet eure Herzen weit“
  rationale: Der Kontext in Vers 11–12 legt die Herzen als Bezug nahe, doch in diesem Vers selbst steht das Wort nicht. Die gewählte Form wahrt die Bildsprache und lässt den kontextuellen Bezug offen erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parenthese bildet den knappen, eindringlichen Satzbau des Griechischen nach. Unnatürliche Wörtlichkeit („werdet weit“) wird im Haupttext vermieden, aber in der Fußnote dokumentiert.
