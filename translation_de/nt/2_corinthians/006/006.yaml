id: 2CO.6.6
reference: 2 Corinthians 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: de
  text: in Reinheit, in Erkenntnis, in Geduld, in Freundlichkeit, im Heiligen Geist[a], in ungeheuchelter Liebe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einem heiligen Geist“, wenn damit eine heilige innere Haltung statt des Heiligen Geistes gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: Reinheit
  rationale: ἁγνότης bezeichnet umfassend sittliche Reinheit oder Lauterkeit. „Reinheit“ ist natürlich und verengt den Sinn nicht auf sexuelle Enthaltsamkeit.
- source_word: γνώσει
  choice: Erkenntnis
  rationale: γνῶσις meint hier Wissen beziehungsweise geistliches und praktisches Verstehen. „Erkenntnis“ ist im paulinischen Zusammenhang treffend und im Deutschen geläufig.
- source_word: μακροθυμίᾳ
  choice: Geduld
  rationale: μακροθυμία bezeichnet lang anhaltende Geduld gegenüber Menschen oder Belastungen. „Geduld“ ist die klarste moderne Entsprechung.
- source_word: χρηστότητι
  choice: Freundlichkeit
  rationale: χρηστότης bezeichnet gütiges, wohlwollendes Verhalten. „Freundlichkeit“ gibt die zwischenmenschliche Qualität verständlich wieder.
- source_word: πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: Die Wortverbindung bezeichnet im paulinischen Sprachgebrauch wahrscheinlich den göttlichen Heiligen Geist; wegen der Verschmelzung von „in dem“ lautet die natürliche Form „im“.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: in ungeheuchelter Liebe
  rationale: ἀνυπόκριτος bedeutet frei von Heuchelei oder Verstellung. „Ungeheuchelte Liebe“ bewahrt die deutliche negative Wortbildung und klingt würdig und natürlich.
- source_word: ἐν
  choice: in / im
  rationale: Das wiederholte ἐν bezeichnet Sphäre, Mittel oder Art und Weise. Die Wiederholung von „in“ bewahrt den rhetorischen Rhythmus; vor „dem Heiligen Geist“ wird idiomatisch „im“ verwendet.
theological_decisions:
- issue: Bezug von πνεύματι ἁγίῳ
  choice: der göttliche Heilige Geist
  alternative: ein heiliger Geist im Sinn einer heiligen inneren Haltung
  rationale: Paulinischer Sprachgebrauch und Kontext sprechen eher für den Heiligen Geist. Da die artikellose griechische Form auch als Beschreibung einer heiligen Haltung verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote erhalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die anaphorische Wiederholung von ἐν wird weitgehend mit „in“ bewahrt; „ungeheuchelt“ gibt die Schärfe von ἀνυπόκριτος genauer wieder als das weichere „aufrichtig“.
