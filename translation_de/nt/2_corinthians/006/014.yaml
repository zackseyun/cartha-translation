source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: de
  text: Lasst euch nicht mit Ungläubigen in ein ungleiches Joch einspannen.[a] Denn was haben Gerechtigkeit[b] und Gesetzlosigkeit miteinander gemein? Oder welche Gemeinschaft hat das Licht mit der Finsternis?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet ein ungleiches Zusammenspannen. Das Bild erinnert an verschiedenartige Zugtiere unter einem Joch; vgl. 5. Mose 22,10.
    reason: Metapher und Querverweis
  - marker: b
    text: Das griechische Wort kann hier auch den Sinn von »gerechtem Handeln« oder »Recht« tragen.
    reason: Lexikalische Alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Lasst euch nicht … spannen
  rationale: Die verneinte Präsensform hat auffordernden, warnenden Charakter. Im Deutschen lässt sich γίνεσθε zusammen mit dem Jochbild natürlich durch „Lasst euch nicht … spannen“ wiedergeben, ohne die dynamische Bedeutung auf ein bloßes „Seid nicht“ zu reduzieren.
- source_word: ἑτεροζυγοῦντες
  choice: unter ein ungleiches Joch
  rationale: Die Wendung bewahrt das Bild verschiedenartiger beziehungsweise nicht zusammenpassender Zugtiere unter demselben Joch; sie klingt im Deutschen würdig und verständlich.
- source_word: ἀπίστοις
  choice: mit Ungläubigen
  rationale: Das substantivierte Adjektiv bezeichnet hier Menschen, die nicht glauben; „mit“ entspricht der durch das Jochbild ausgedrückten Verbindung.
- source_word: μετοχὴ
  choice: miteinander gemein haben
  rationale: μετοχή bezeichnet gemeinsames Teilhaben oder Anteilhaben. Die idiomatische Frage „Was haben … miteinander gemein?“ gibt den Gedanken klar wieder und unterscheidet ihn sprachlich von κοινωνία.
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl den ethisch-religiösen Sinn als auch den möglichen Aspekt gerechten Handelns ab und steht hier im direkten Gegensatz zu ἀνομία.
- source_word: ἀνομίᾳ
  choice: Gesetzlosigkeit
  rationale: Die direkte Wiedergabe wahrt den Bezug auf die Missachtung des Gesetzes und den scharfen Gegensatz zu δικαιοσύνη.
- source_word: κοινωνία
  choice: Gemeinschaft
  rationale: „Gemeinschaft“ gibt die enge Verbindung und gemeinsame Teilhabe natürlich wieder.
- source_word: φωτὶ
  choice: das Licht
  rationale: Die bildhafte Gegenüberstellung wird wörtlich bewahrt; der deutsche bestimmte Artikel ist idiomatisch.
- source_word: πρὸς σκότος
  choice: mit der Finsternis
  rationale: In dieser Beziehungsfrage wird πρός im Deutschen natürlich mit „mit“ wiedergegeben; „Finsternis“ erhält den feierlichen metaphorischen Kontrast.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη im paulinischen Gegensatz
  choice: Gerechtigkeit
  alternative: gerechtes Handeln / Recht
  rationale: „Gerechtigkeit“ ist die offene und etablierte deutsche Entsprechung, ohne den Ausdruck ausschließlich auf zugerechnete Gerechtigkeit, persönliche Tugend oder soziale Rechtspflege festzulegen. Eine Fußnote weist auf den möglichen handlungsbezogenen Sinn hin.
- issue: Reichweite des Verbotsbildes vom ungleichen Joch
  choice: Metapher ohne ausdrückliche Festlegung auf Ehe, Kult oder Geschäftsbeziehungen
  alternative: explizite Eingrenzung auf eine bestimmte Art von Verbindung
  rationale: Der griechische Vers nennt keine einzelne gesellschaftliche Institution. Die Übersetzung bewahrt daher die umfassende Metapher und vermeidet eine konfessionell oder auslegungsgeschichtlich bedingte Verengung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelregister. Das Jochbild bleibt erhalten; altertümliche Syntax und eine sachlich nicht begründete Eingrenzung des Verbots werden vermieden.
