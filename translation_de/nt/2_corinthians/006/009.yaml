lexical_decisions:
- source_word: ὡς
  choice: als
  rationale: Bewahrt die wiederholte rhetorische Struktur und führt jede paradoxe Charakterisierung knapp ein.
- source_word: ἀγνοούμενοι
  choice: Unbekannte
  rationale: Gibt das passive Nichtgekannt- oder Nichtanerkanntwerden prägnant wieder und bildet einen klaren Gegensatz zu ἐπιγινωσκόμενοι.
- source_word: ἐπιγινωσκόμενοι
  choice: Anerkannte
  rationale: Erfasst hier das Erkannt- und Anerkanntwerden, ohne den Sinn auf öffentliche Berühmtheit zu verengen.
- source_word: ἀποθνῄσκοντες
  choice: Sterbende
  rationale: Bewahrt den durativen Charakter des Präsenspartizips und den knappen Gegensatz zu »wir leben«.
- source_word: ἰδοὺ
  choice: siehe
  rationale: Erhält den markanten Aufmerksamkeitsruf in würdigem, bibelsprachlich vertrautem Deutsch.
- source_word: ζῶμεν
  choice: wir leben
  rationale: Entspricht dem schlichten Präsens und hält die paradoxe Zuspitzung fest.
- source_word: παιδευόμενοι
  choice: Ge­züchtigte
  rationale: »Gezüchtigt« bezeichnet im heutigen gehobenen Deutsch korrigierende oder erzieherische Zurechtweisung und passt zum Leiden, ohne ausdrücklich eine bestimmte göttliche Straflehre festzulegen.
- source_word: μὴ θανατούμενοι
  choice: nicht getötet
  rationale: Gibt die passive Aussage natürlich und deutlich wieder und unterscheidet sie vom vorausgehenden »Sterbende«.
theological_decisions:
- issue: Sinn von παιδευόμενοι im Zusammenhang des Leidens
  choice: Ge­züchtigte
  alternative: Erzogene / Zurechtgewiesene
  rationale: Die Formulierung lässt offen, ob vor allem korrigierende Züchtigung oder formende Erziehung gemeint ist. Die Fußnote macht diese Spannweite sichtbar, ohne das Leiden eindeutig als Strafe zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Reihung der paulinischen Gegensätze. »Siehe« erhält den abrupten rhetorischen Akzent; Gedankenstriche markieren die eingeschobene Zuspitzung. Die substantivierten Partizipien spiegeln die griechische Parallelstruktur.
