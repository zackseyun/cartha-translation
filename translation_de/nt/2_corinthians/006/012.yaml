  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: de
  text: Bei uns ist es für euch nicht eng, sondern in eurem eigenen Herzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr seid nicht in uns eingeengt, sondern in euren eigenen inneren Regungen.“'
    reason: Die Anmerkung bewahrt die zweimalige Formulierung mit „in“ sowie die bildlich-affektive Bedeutung von σπλάγχνα.
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: habt … zu wenig Raum
  rationale: Das Verb bezeichnet wörtlich das Beengtsein in einem engen Raum und hier bildlich eine innere oder zwischenmenschliche Begrenzung. Die Formulierung bewahrt das Raumbild in natürlichem Deutsch und wird sinngemäß auf beide Satzhälften bezogen.
- source_word: ἐν ἡμῖν
  choice: in uns
  rationale: 'Die örtlich formulierte Präposition wird bewusst formal als „in uns“ wiedergegeben: Bei Paulus und seinen Mitarbeitern fehlt es nicht an Raum für die Korinther. So bleibt auch der Parallelismus mit der zweiten Präpositionalphrase erhalten.'
- source_word: δὲ
  choice: sondern
  rationale: Nach der Verneinung kennzeichnet δέ hier einen scharfen Gegensatz; im Deutschen stellt „sondern“ diesen Kontrast idiomatisch heraus.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: in eurem eigenen Herzen
  rationale: σπλάγχνα bezeichnet wörtlich die inneren Organe und bildlich das Innerste als Sitz tiefer Gefühle und Zuneigung. „Herz“ ist dafür im heutigen Deutschen die natürliche, würdige Entsprechung; „eigenen“ hebt hervor, dass die Enge bei den Adressaten liegt.
- source_word: οὐ
  choice: nicht
  rationale: Direkte Wiedergabe der Verneinung im ersten Satzteil.
theological_decisions:
- issue: Bildliche Bedeutung von σπλάγχνα
  choice: Das Wort bezeichnet das emotionale Innerste der Korinther, natürlich als „Herz“ ausgedrückt.
  alternative: Wörtlich „Eingeweide“ oder abstrakter „Zuneigung/Gefühle“.
  rationale: Der Zusammenhang handelt von wechselseitiger Offenheit und Zuneigung. „Herz“ erhält die körperlich-räumliche Metapher, ohne im Deutschen missverständlich oder befremdlich zu klingen.
- issue: Bezug von ἐν ἡμῖν
  choice: 'Die räumliche Formulierung „in uns“ bleibt erhalten: In Paulus und seinen Mitarbeitern ist es für die Korinther nicht eng.'
  alternative: 'Ursächlich „durch uns“: Paulus und seine Mitarbeiter beschränken die Korinther nicht.'
  rationale: Beide Deutungen sind sachlich eng verbunden. Die formalere Wiedergabe bewahrt jedoch den Parallelismus ἐν ἡμῖν / ἐν τοῖς σπλάγχνοις ὑμῶν und die Raummetaphorik des griechischen Satzes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die knappe antithetische Struktur und das räumliche Wortbild des griechischen Textes werden bewahrt; die Fußnote dokumentiert die mögliche ursächliche Lesart und eine weniger bildhafte Alternative.
