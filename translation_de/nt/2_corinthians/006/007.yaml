translation:
  language: de
  text: im Wort der Wahrheit, in Gottes Kraft; mit den Waffen der Gerechtigkeit[a] in der rechten und der linken Hand[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Waffen des Rechts“.'
    reason: lexical_alternative
  - marker: b
    text: Die Bezeichnungen „rechte“ und „linke“ stehen im Griechischen ohne ausdrücklich genanntes Bezugswort. Die Übersetzung ergänzt aufgrund des Waffenbildes „Hand“.
