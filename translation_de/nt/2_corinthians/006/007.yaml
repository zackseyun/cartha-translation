lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: Wort der Wahrheit
  rationale: Die Formulierung bewahrt die griechische Genitivverbindung und lässt sowohl wahrhaftige Verkündigung als auch die Botschaft der Wahrheit anklingen.
- source_word: δυνάμει θεοῦ
  choice: Gottes Kraft
  rationale: Die knappe deutsche Genitivkonstruktion gibt den Sinn natürlich wieder und wahrt den parallelen Aufbau der beiden mit ἐν eingeleiteten Wendungen.
- source_word: διὰ
  choice: mit
  rationale: διά mit Genitiv bezeichnet hier das Mittel. Im Deutschen drückt „mit“ den instrumentalen Sinn bei Waffen natürlicher aus als das schwerfällige „durch“.
- source_word: ὅπλων
  choice: Waffen
  rationale: ὅπλα bezeichnet militärische Ausrüstung beziehungsweise Kampfmittel und kann offensiven wie defensiven Gebrauch einschließen. „Waffen“ erhält das militärische Bild in verständlicher Sprache.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ gibt das breite paulinische Bedeutungsspektrum wieder, ohne die Wendung auf gesellschaftliche Rechtsprechung oder auf eine bestimmte dogmatische Deutung zu verengen.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: in der rechten und der linken Hand
  rationale: Die substantivierten Adjektive nennen wörtlich das Rechte und das Linke; aus dem Waffenbild sind im Deutschen sinnvollerweise die Hände zu ergänzen. Die Formulierung vermittelt die Vorstellung beidseitiger Ausrüstung und voller Bereitschaft.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη in der paulinischen Waffenmetapher
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ wahrt die übliche und semantisch umfassende Wiedergabe. „Recht“ ist möglich, würde den Ausdruck hier jedoch stärker auf den Aspekt der Rechtmäßigkeit oder Rechtspflege verengen.
- issue: Funktion der Waffen in der rechten und linken Hand
  choice: Das Bild bleibt offen für offensive und defensive Ausrüstung
  alternative: Eine feste Zuordnung der rechten Hand zum Angriff und der linken zur Verteidigung
  rationale: Der griechische Text nennt lediglich rechts und links und legt keine bestimmte Funktion der beiden Seiten ausdrücklich fest. Daher wird die verbreitete Deutung als Angriffs- und Verteidigungsbereitschaft nur als mögliche Bildwirkung erläutert, nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Kleinschreibung am Anfang und das abschließende Komma entsprechen dem fortlaufenden Satz des Kontextes. Der Rhythmus der Aufzählung wird durch „im …, in …; mit …“ erhalten; „mit“ gibt die instrumentale Bedeutung von διά im Deutschen idiomatisch wieder.
