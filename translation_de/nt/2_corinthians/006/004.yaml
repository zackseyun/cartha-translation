  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: de
  text: 'sondern wir erweisen uns in allem als Diener Gottes: in großer Standhaftigkeit, in Bedrängnissen, in Nöten, in bedrängenden Lagen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Ängsten«. Das griechische Wort bezeichnet wörtlich Enge und meint schwer bedrängende, einengende Lagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: sondern
  rationale: Der starke Gegensatz zur vorausgehenden Verneinung wird im Deutschen nach »nicht« natürlich mit »sondern« wiedergegeben.
- source_word: ἐν παντί
  choice: in allem
  rationale: Die breite adverbiale Wendung kann Umstände oder Hinsichten umfassen; »in allem« bewahrt diese Offenheit.
- source_word: συνιστάνοντες ἑαυτούς
  choice: wir empfehlen uns
  rationale: συνίστημι kann sowohl empfehlen als auch sich als etwas erweisen bedeuten. »Wir empfehlen uns« bleibt nah an der Formulierung und passt zum paulinischen Kontext.
- source_word: ὡς θεοῦ διάκονοι
  choice: als Diener Gottes
  rationale: διάκονοι bezeichnet hier Menschen im Dienst Gottes, ohne zwingend ein institutionelles Amt auszudrücken.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: in großer Standhaftigkeit
  rationale: ὑπομονή meint beharrliches Ausharren unter Belastung; »Standhaftigkeit« gibt dies prägnant wieder und erhält die wiederholte ἐν-Struktur.
- source_word: θλίψεσιν
  choice: Bedrängnissen
  rationale: Das Wort bezeichnet Druck und leidvolle Bedrückung; »Bedrängnisse« ist gewichtig und im modernen Bibeldeutsch verständlich.
- source_word: ἀνάγκαις
  choice: Nöten
  rationale: Gemeint sind zwingende, bedrückende Notlagen; »Nöte« ist knapp und natürlich.
- source_word: στενοχωρίαις
  choice: ausweglosen Lagen
  rationale: Das Wort zeichnet bildlich eine bedrängte, eingeengte Lage. Die Wendung unterscheidet den Ausdruck von den vorausgehenden Nöten, ohne das Bild wörtlich zu überzeichnen.
theological_decisions:
- issue: Bedeutung von διάκονοι im Dienstkontext
  choice: Diener Gottes
  alternative: Beauftragte Gottes; Gottes Mitarbeiter
  rationale: »Diener« betont den Dienst für Gott und vermeidet, dem Ausdruck ein späteres kirchliches Amtsverständnis aufzuerlegen.
- issue: Funktion von συνιστάνοντες ἑαυτούς
  choice: wir empfehlen uns
  alternative: wir erweisen uns
  rationale: Der griechische Ausdruck kann Empfehlung und tatsächlichen Erweis verbinden. Die Hauptfassung wahrt die sprachliche Nähe, ohne die Bewährung durch Leiden auszublenden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anaphorische Folge »in …, in …« folgt bewusst der griechischen Struktur. »Standhaftigkeit« vermeidet das heute oft zu schwache Verständnis von »Geduld«; »Diener« vermeidet unnötige Amtskonnotationen.
