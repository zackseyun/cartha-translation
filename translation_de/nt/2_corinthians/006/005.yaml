  source_fidelity: Die sechsfachen ἐν-Phrasen und die pluralische Aufzählung werden vollständig wiedergegeben. „Schlägen“, „Gefängnissen“, „Unruhen“, „Mühen“, „durchwachten Nächten“ und „Fasten“ treffen die jeweiligen griechischen Begriffe sachgerecht. Besonders „Unruhen“ bewahrt bei ἀκαταστασίαις die mögliche Bedeutungsspanne von Tumulten/Aufruhr bis Unordnung, ohne sie unzulässig zu präzisieren. „Fasten“ lässt die im Kontext nicht sicher entscheidbare Frage nach freiwilligem religiösem Fasten oder erzwungenem Nahrungsmangel offen.
  naturalness: Die knappe Reihung ist im modernen Standarddeutsch flüssig und angemessen. Die variierte Präpositionwahl ist idiomatisch und beeinträchtigt die erkennbare Parallelstruktur nicht. „Durchwachten Nächten“ ist eine besonders natürliche Wiedergabe von ἀγρυπνίαις.
  terminology: Die Wortwahl ist registergerecht und nicht konfessionell einengend. Es bestehen keine Namens- oder theologischen Terminologiefragen. Fußnoten sind weder im Ausgangstext vorhanden noch für die Übersetzung erforderlich.
