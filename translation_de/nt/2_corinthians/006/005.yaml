  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: de
  text: unter Schlägen, in Gefängnissen, bei Unruhen, unter Mühen, in durchwachten Nächten, beim Fasten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: Schlägen
  rationale: Bezeichnet hier körperliche Schläge beziehungsweise Misshandlungen; die knappe deutsche Wiedergabe bewahrt die Reihung.
- source_word: φυλακαῖς
  choice: Gefängnissen
  rationale: Der Plural bezeichnet wiederholte oder verschiedene Inhaftierungen.
- source_word: ἀκαταστασίαις
  choice: Unruhen
  rationale: Das Wort kann Unordnung, Aufruhr oder Tumulte bezeichnen. „Unruhen“ erhält die Breite, ohne ausschließlich organisierte Ausschreitungen anzunehmen.
- source_word: κόποις
  choice: Mühen
  rationale: Bezeichnet anstrengende, erschöpfende Arbeit beziehungsweise Strapazen; „Mühen“ passt zur knappen Aufzählung.
- source_word: ἀγρυπνίαις
  choice: durchwachten Nächten
  rationale: Gemeint sind Zeiten des Wachbleibens oder Schlafentzugs; die idiomatische Formulierung macht die wiederholte Erfahrung deutlich.
- source_word: νηστείαις
  choice: Fasten
  rationale: Kann freiwilliges Fasten oder unfreiwilligen Nahrungsmangel bezeichnen. Die formnahe Wiedergabe „Fasten“ bewahrt diese mögliche Spannung im Kontext.
theological_decisions:
- issue: Art des Fastens
  choice: beim Fasten
  alternative: bei Hungerzeiten / bei Nahrungsmangel
  rationale: νηστείαις lässt hier offen, ob religiöses Fasten, freiwilliger Verzicht oder situationsbedingter Nahrungsmangel gemeint ist; „Fasten“ legt das Motiv nicht ausdrücklich fest.
- issue: Charakter der ἀκαταστασίαις
  choice: bei Unruhen
  alternative: bei Aufständen / in Tumulten
  rationale: Der Kontext benennt Bedrängnisse, entscheidet aber nicht eindeutig, ob Paulus an politischen Aufruhr, Menschenaufläufe oder allgemeine Unordnung denkt.
translation_notes:
  register: Knappe, rhythmische Reihung in modernem Standarddeutsch. Die wechselnden Präpositionen („unter“, „in“, „bei“) klingen natürlicher als sechsmal „in“ und geben die instrumentale beziehungsweise situative Breite von ἐν wieder, ohne die Parallelstruktur aufzugeben.
