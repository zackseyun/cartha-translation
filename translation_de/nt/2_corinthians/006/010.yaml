source:
  edition: SBLGNT
  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: de
  text: als Trauernde, doch immer froh; als Arme, die doch viele reich machen[a]; als Menschen, die nichts haben und doch alles besitzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »viele bereichern«. Der Zusammenhang legt nahe, dass der Reichtum nicht in erster Linie materiell zu verstehen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Aussage ist bewusst paradox: Äußerer Besitzlosigkeit steht der umfassende Anspruch gegenüber, alles zu besitzen.'
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: als
  rationale: Das wiederholte »als« bewahrt die vergleichende Rahmung der drei paradoxen Aussagen, ohne bloßen Anschein zwingend festzuschreiben.
- source_word: λυπούμενοι
  choice: Trauernde
  rationale: Die substantivierte Partizipform gibt den anhaltenden Zustand knapp wieder und lässt offen, wodurch die Trauer verursacht wird.
- source_word: ἀεὶ δὲ χαίροντες
  choice: doch immer voller Freude
  rationale: »Doch« bringt den Gegensatz zum Ausdruck; »immer voller Freude« ist natürliches modernes Deutsch und vermittelt die fortdauernde Freude des Partizips χαίροντες.
- source_word: πτωχοὶ
  choice: Arme
  rationale: Die schlichte Wiedergabe lässt sowohl tatsächliche materielle Armut als auch apostolische Niedrigkeit zu.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: die aber viele reich machen
  rationale: Die Formulierung gibt die kausative Bedeutung von πλουτίζω transparent wieder. Sie bestimmt nicht ausdrücklich, worin der Reichtum besteht.
- source_word: μηδὲν ἔχοντες
  choice: als Menschen, die nichts haben
  rationale: Die Ergänzung »Menschen« sorgt im Deutschen für einen natürlichen Anschluss und bewahrt die Aussage äußerer Besitzlosigkeit.
- source_word: καὶ πάντα κατέχοντες
  choice: und doch alles besitzen
  rationale: κατέχω bezeichnet hier im Kontrast zu »nichts haben« tatsächliches Besitzen beziehungsweise Innehaben. »Doch« macht den im Zusammenhang klaren Gegensatz idiomatisch sichtbar.
theological_decisions:
- issue: Art des Reichtums und Besitzes in den paulinischen Paradoxien
  choice: Reichtum und Besitz werden im Haupttext ohne ausdrückliche Einschränkung als »geistlich« wiedergegeben.
  alternative: »viele geistlich reich machen« und »in Christus alles besitzen«
  rationale: Der Zusammenhang legt einen nicht bloß materiellen, in Christus begründeten Reichtum nahe. Der griechische Text nennt diese Deutung jedoch nicht ausdrücklich; deshalb bleibt seine theologische Spannung im Haupttext erhalten.
- issue: Bedeutung des wiederholten ὡς
  choice: Die drei Aussagen werden mit »als« eingeleitet.
  alternative: »als ob« oder »scheinbar«
  rationale: »Als ob« könnte nahelegen, Trauer, Armut und Besitzlosigkeit seien unwirklich. »Als« erhält die rhetorische Gegenüberstellung, ohne über den Wirklichkeitsstatus der jeweiligen Seite zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Parallelstruktur und die steigernde Folge der Gegensätze bleiben erhalten. Der erste Gegensatz wird idiomatisch formuliert, während die wiederholten »als«-Rahmungen deutlich hörbar bleiben.
