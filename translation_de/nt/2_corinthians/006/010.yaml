  naturalness: Die Formulierung ist weitgehend flüssiges modernes Standarddeutsch. »Als Trauernde, doch immer froh« ist knapper, idiomatisch und näher an der griechischen Partizipialstruktur als »doch immer voller Freude«.
  terminology: »Trauernde«, »Arme«, »reich machen« und »alles besitzen« sind angemessen. Die Fußnote zu »reich machen« darf den wahrscheinlichen nichtmateriellen Sinn vorsichtig als Kontextbeobachtung kennzeichnen, sollte ihn aber nicht in den Haupttext eintragen.
