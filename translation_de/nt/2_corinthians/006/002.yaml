source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: de
  text: 'Denn er sagt: „Zu einer günstigen Zeit habe ich dich erhört[a], und an einem Tag der Rettung habe ich dir geholfen.“ Siehe, jetzt ist eine besonders günstige Zeit; siehe[b], jetzt ist ein Tag der Rettung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „habe ich dich wohlwollend angehört“. Das Verb kann ein Hören bezeichnen, das Annahme oder eine Antwort einschließt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Jetzt ist die günstige Zeit … jetzt ist der Tag der Rettung.“ Im Griechischen stehen die Wendungen hier ohne Artikel; im Deutschen ist je nach Verständnis auch die bestimmte Form möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Denn er sagt
  rationale: γάρ begründet den vorausgehenden Aufruf; das persönliche „er sagt“ wahrt Gott als den in der Schrift redenden Sprecher.
- source_word: Καιρῷ δεκτῷ
  choice: Zu einer willkommenen Zeit
  rationale: καιρός bezeichnet einen passenden oder bestimmten Zeitpunkt; δεκτός hat hier den Sinn „willkommen, günstig“. Die Formulierung bleibt bewusst unbestimmt.
- source_word: ἐπήκουσά σου
  choice: habe ich dich erhört
  rationale: ἐπακούω bezeichnet ein Hören, das Annahme oder Reaktion einschließt. „Erhört“ gibt diesen Antwortcharakter im Deutschen knapp und idiomatisch wieder, ohne eine konkrete Art der Antwort hinzuzufügen.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: an einem Tag der Rettung
  rationale: Die artikellose Wendung wird unbestimmt wiedergegeben. „Rettung“ ist im heutigen Deutsch verständlich und bewahrt den umfassenden Sinn von σωτηρία.
- source_word: ἐβοήθησά σοι
  choice: habe ich dir geholfen
  rationale: βοηθέω bedeutet helfen oder zu Hilfe kommen; die schlichte Formulierung ist quellennah und natürlich.
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird mit dem würdigen, aber heute noch verständlichen „Sieh“ wiedergegeben; dadurch bleibt die zweimalige rhetorische Hervorhebung erhalten.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: eine besonders willkommene Zeit
  rationale: εὐπρόσδεκτος bezeichnet etwas sehr Willkommenes oder besonders Annehmbares. „Besonders willkommen“ unterscheidet die Steigerung von δεκτός, ohne sie zu überzeichnen.
- source_word: ἡμέρα σωτηρίας
  choice: ein Tag der Rettung
  rationale: Auch diese Wendung ist im Griechischen artikellos. Die unbestimmte Wiedergabe wahrt die Form und lässt zugleich den dringlichen Gegenwartsbezug bestehen.
theological_decisions:
- issue: Bestimmte oder unbestimmte Wiedergabe von καιρός und ἡμέρα σωτηρίας
  choice: 'Unbestimmte Formulierungen: „zu einer willkommenen Zeit“, „an einem/ein Tag der Rettung“'
  alternative: „zur willkommenen/gnädigen Zeit“ und „am/der Tag der Rettung“
  rationale: Die betreffenden griechischen Nominalgruppen stehen ohne Artikel. Eine bestimmte Wiedergabe ist kontextuell möglich, wird vom Wortlaut aber nicht erzwungen; die unbestimmte Form vermeidet eine unnötige eschatologische Festlegung.
- issue: Subjekt von λέγει
  choice: 'Persönlich: „er sagt“'
  alternative: 'Unpersönlich: „es heißt“ oder „die Schrift sagt“'
  rationale: Das Zitat hat einen göttlichen Sprecher. Die persönliche Wiedergabe erhält diese theologische Textur, ohne den Namen Gottes ergänzend in den Vers einzutragen.
- issue: Wiedergabe von σωτηρία
  choice: „Rettung“
  alternative: „Heil“
  rationale: Beide sind möglich. „Rettung“ ist für heutige Leser unmittelbarer verständlich und bewahrt den Handlungs- und Befreiungscharakter des griechischen Begriffs; „Heil“ bleibt als traditionsreiche Alternative möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ erhält die feierliche Dringlichkeit von ἰδού, ohne das altertümlichere „siehe“ zu verwenden. Die Wiederholung und die Parallelstruktur des griechischen Textes bleiben erhalten.
