  naturalness: „Willkommene Zeit“ und besonders „besonders willkommene Zeit“ wirken im modernen Standarddeutsch ungewohnt und können primär den Wunsch der Empfangenden ausdrücken. „(Besonders) günstige Zeit“ ist eine natürliche zeitbezogene Formulierung und bewahrt die Dringlichkeit des Verses. „Siehe“ ist als feste literarisch-feierliche Entsprechung von ἰδού hier klarer als das eher gesprochensprachlich-direktive „Sieh“.
  terminology: „Rettung“ ist für σωτηρία möglich und verständlich. Die unbestimmte Wiedergabe bleibt angesichts der artikellosen griechischen Ausdrücke vertretbar; die Fußnote macht die ebenfalls mögliche bestimmte deutsche Fassung transparent, ohne eine theologische Festlegung zu erzwingen.
