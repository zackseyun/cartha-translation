  source_fidelity: Die Übersetzung gibt die wiederholte Umstandsangabe διὰ mit „durch“ angemessen wieder und bewahrt die beiden Gegenüberstellungen δόξα/ἀτιμία sowie δυσφημία/εὐφημία. „als Verführer angesehen und doch wahrhaftig“ vermittelt die durch ὡς markierte Zuschreibung und den Kontrast zu ἀληθεῖς zuverlässig, ohne den Vorwurf zu übernehmen.
  naturalness: Modernes, würdiges und gut lesbares Standarddeutsch. Die parallele Struktur des griechischen Textes bleibt erkennbar. „Üble Nachrede und Anerkennung“ ist idiomatisch, auch wenn „Lob“ oder „guter Ruf“ die zweite Seite etwas unmittelbarer spiegeln würden; eine Änderung ist nicht erforderlich.
  terminology: „Ehre und Schande“ ist für den sozialen Gegensatz angemessen; „Verführer“ trifft πλάνοι im vorliegenden Kontext. „Wahrhaftig“ gibt ἀληθεῖς als prädikative Gegenbehauptung natürlich wieder. Die Fußnoten erklären die relevanten lexikalischen und syntaktischen Alternativen sachgerecht.
