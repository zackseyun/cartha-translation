base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/008.yaml
  text: through honor and dishonor[a], through slander and praise; regarded as deceivers and yet true[c][b],
translation:
  language: de
  text: durch Ehre und Schande[a], durch üble Nachrede und Anerkennung[b]; als Verführer angesehen und doch wahrhaftig[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Herrlichkeit und Unehre“. Das griechische Wort für „Ehre“ kann auch „Herrlichkeit“ bedeuten; hier steht wahrscheinlich das öffentliche Ansehen im Vordergrund.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „durch schlechten Ruf und guten Ruf“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „als Verführer und Wahrhaftige“. Gemeint ist der Gegensatz zwischen dem Urteil anderer und dem, was Paulus und seine Mitarbeiter tatsächlich sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: durch
  rationale: Mit den Genitiven bezeichnet διά die Umstände, durch die hindurch sich der Dienst vollzieht. Die Wiederholung bewahrt zugleich den rhetorischen Parallelismus.
- source_word: δόξης
  choice: Ehre
  rationale: Im Gegensatz zu ἀτιμία hat δόξα hier vor allem den gesellschaftlichen Sinn öffentlicher Ehre beziehungsweise öffentlichen Ansehens; „Ehre“ bildet zudem ein klares Gegensatzpaar mit „Schande“.
- source_word: ἀτιμίας
  choice: Schande
  rationale: Das Wort bezeichnet gesellschaftliche Entehrung oder Unehre. „Schande“ ist im Deutschen natürlich und bringt den öffentlichen Ansehensverlust deutlich zum Ausdruck.
- source_word: δυσφημίας
  choice: üble Nachrede
  rationale: Der Ausdruck umfasst abwertende Rede und einen schlechten Ruf. „Üble Nachrede“ bewahrt den sprachlichen Aspekt, ohne zwingend zu behaupten, jede negative Äußerung sei nachweislich verleumderisch.
- source_word: εὐφημίας
  choice: Anerkennung
  rationale: Als Gegenstück zu δυσφημία bezeichnet das Wort günstige Äußerung beziehungsweise guten Ruf. „Anerkennung“ klingt im modernen Deutsch natürlich und erfasst die positive öffentliche Beurteilung.
- source_word: ὡς
  choice: als … angesehen
  rationale: ὡς führt hier die Fremdwahrnehmung ein. Die Formulierung macht deutlich, dass „Verführer“ eine Beurteilung von außen ist, während der Gegensatz die tatsächliche Wahrhaftigkeit betont.
- source_word: πλάνοι
  choice: Verführer
  rationale: Im Kontext sind Menschen gemeint, denen vorgeworfen wird, andere irrezuführen. „Verführer“ gibt diese Anschuldigung knapp und verständlich wieder.
- source_word: ἀληθεῖς
  choice: wahrhaftig
  rationale: Das Adjektiv steht in scharfem Gegensatz zu πλάνοι. „Wahrhaftig“ bezeichnet die tatsächliche Aufrichtigkeit beziehungsweise Echtheit der Apostel, ohne die Aussage unnötig einzuengen.
theological_decisions:
- issue: Ob der letzte Gegensatz als Unterschied zwischen Fremdwahrnehmung und Wirklichkeit ausdrücklich kenntlich gemacht werden soll
  choice: „als Verführer angesehen und doch wahrhaftig“
  alternative: „als Verführer und Wahrhaftige“
  rationale: Das ergänzte „angesehen“ verdeutlicht die in ὡς angelegte Perspektive, ohne den Vorwurf als Tatsache zu bestätigen. „Doch“ bringt den rhetorischen Gegensatz idiomatisch zum Ausdruck und bewahrt die Spannung zwischen öffentlichem Urteil und apostolischer Wirklichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei ausgewogenen Gegensatzpaare und die wiederholte Präposition „durch“ bleiben erhalten. Der Versausschnitt endet mit einem Komma, weil der griechische Satz im folgenden Vers weitergeführt wird.
