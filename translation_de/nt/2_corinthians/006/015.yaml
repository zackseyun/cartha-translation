  rationale: Die Revision glättet ausschließlich die deutsche Idiomatik und wählt mit „Einklang“ eine kontextuell treffendere Entsprechung für συμφώνησις. Bedeutung, rhetorische Form, Ambiguität und Fußnoteninformation des Ausgangstextes bleiben erhalten.
