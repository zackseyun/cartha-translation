    rationale: Die Formulierung „hat ... gemeinsam mit“ bindet „gemeinsam“ weniger klar an den Anteil. „hat ... mit ... gemeinsam“ ist im Deutschen die natürliche Wendung und gibt die gemeinsame Teilhabe aus μερίς μετά weiterhin wieder.
  - severity: low
    issue: „Übereinstimmung“ ist für συμφώνησις weniger anschaulich als „Einklang“
    rationale: „Einklang“ bezeichnet die gefragte Harmonie bzw. Vereinbarkeit in der scharfen Gegenüberstellung unmittelbar und ist modernes, würdevolles Standarddeutsch.
