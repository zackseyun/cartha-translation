source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: de
  text: Und welcher Einklang besteht zwischen dem Messias und Beliar[a]? Oder welchen Anteil hat ein Glaubender mit einem Ungläubigen gemeinsam?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beliar: griechisch Βελιάρ; auch die Namensform „Belial“ ist gebräuchlich.'
    reason: Alternative Namensform
lexical_decisions:
- source_word: συμφώνησις
  choice: Übereinstimmung
  rationale: Das seltene Substantiv bezeichnet Einklang, Einvernehmen oder Vereinbarkeit. „Übereinstimmung“ ist im Deutschen natürlich und bewahrt den Gedanken einer möglichen Gemeinsamkeit in der rhetorischen Gegenüberstellung.
- source_word: Χριστοῦ
  choice: dem Messias
  rationale: Χριστός steht hier in einer grundsätzlichen Gegenüberstellung mit Beliar und hat daher deutlich titularen Charakter. „Messias“ gibt diesen Titel wieder.
- source_word: Βελιάρ
  choice: Beliar
  rationale: Der Eigenname wird entsprechend der griechischen Form Βελιάρ transliteriert; die geläufigere Nebenform „Belial“ wird in einer Fußnote genannt.
- source_word: μερίς
  choice: Anteil
  rationale: μερίς bezeichnet einen Teil oder Anteil. „Anteil“ erhält die Vorstellung gemeinsamer Teilhabe, die durch die Verbindung mit μετά ausgedrückt wird.
- source_word: πιστῷ
  choice: ein Glaubender
  rationale: Das substantivierte Adjektiv bezeichnet hier einen Menschen, der glaubt. „Ein Glaubender“ bildet die formale Gegenüberstellung zu „einem Ungläubigen“ ab, ohne das Wort unnötig auf eine feste Gruppenzugehörigkeit zu verengen.
- source_word: ἀπίστου
  choice: einem Ungläubigen
  rationale: Im Gegensatz zu πιστός bezeichnet ἄπιστος hier einen nicht glaubenden Menschen. „Ungläubiger“ ist die natürliche deutsche substantivische Entsprechung.
- source_word: πρὸς
  choice: zwischen
  rationale: Bei einem Ausdruck gegenseitiger Übereinstimmung wird πρὸς im Deutschen idiomatisch durch „zwischen ... und ...“ wiedergegeben.
- source_word: μετὰ
  choice: gemeinsam mit
  rationale: μετά bezeichnet hier Verbindung beziehungsweise Gemeinschaft. „Gemeinsam mit“ macht die im Deutschen sonst etwas harte Konstruktion „Anteil mit“ verständlich, ohne eine bestimmte Art des Anteils festzulegen.
- source_word: δὲ
  choice: Und
  rationale: δέ führt die Reihe rhetorischer Fragen fort. „Und“ wahrt diesen additiven Zusammenhang, ohne einen stärkeren Gegensatz einzutragen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: In der antithetischen Gegenüberstellung fungiert Χριστός als Titel. „Messias“ bewahrt diesen titularen Sinn; „Christus“ wäre ebenfalls traditionell möglich, kann im Deutschen jedoch stärker wie ein Eigenname wirken.
- issue: Identität und Namensform von Βελιάρ
  choice: Beliar als unkommentierter Eigenname im Haupttext
  alternative: Belial; ausdrückliche Deutung als Satan
  rationale: Der griechische Text nennt lediglich Beliar. Die Übersetzung transliteriert den Namen, ohne die Identifikation im Haupttext interpretierend auszuweiten. Die alternative Namensform „Belial“ wird in der Fußnote bewahrt.
- issue: Bedeutung von πιστός und ἄπιστος
  choice: ein Glaubender / ein Ungläubiger
  alternative: ein Treuer / ein Untreuer
  rationale: Der unmittelbare Gegensatz legt hier Glauben beziehungsweise Unglauben nahe. Die mögliche weitere Bedeutungsnähe von πιστός zu „treu“ wird nicht in den Haupttext eingetragen, da sie in dieser Paarung weniger wahrscheinlich ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei parallelen rhetorischen Fragen und ihre scharfe Gegenüberstellung bleiben erhalten. „Welchen Anteil hat ... gemeinsam mit ...?“ ist bewusst etwas gehoben, aber gut verständlich und bildet μερίς μετά angemessen ab.
