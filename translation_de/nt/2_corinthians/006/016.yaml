id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: de
  text: 'Und welche Übereinstimmung besteht zwischen dem Tempel Gottes und Götzen? Denn wir sind der Tempel des lebendigen Gottes, wie Gott gesagt hat: »Ich werde unter ihnen wohnen[a] und unter ihnen umhergehen. Ich werde ihr Gott sein, und sie werden mein Volk sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in ihnen wohnen«. Das griechische ἐν kann hier »in« oder »unter« bedeuten; der gemeinschaftliche Bundeszusammenhang spricht für »unter ihnen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: Übereinstimmung
  rationale: Das Substantiv bezeichnet Zustimmung, Einvernehmen oder Übereinstimmung. »Übereinstimmung« ist im Deutschen klar, würdig und passt zur Reihe unvereinbarer Verbindungen im Kontext.
- source_word: ναῷ / ναὸς
  choice: Tempel
  rationale: ναός bezeichnet den Tempel beziehungsweise das Heiligtum und trägt hier die kultische Bildkraft. »Tempel« ist die allgemein verständliche Standardwiedergabe.
- source_word: εἰδώλων
  choice: Götzen
  rationale: Gemeint sind im religiös-polemischen Kontext heidnische Götzen, nicht wertneutral Bilder.
- source_word: ζῶντος
  choice: lebendigen
  rationale: 'Das Partizip bestimmt θεοῦ näher: »des lebendigen Gottes«. Die traditionelle und natürliche Formulierung stellt Gott den leblosen Götzen gegenüber.'
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: So hat Gott gesagt
  rationale: καθώς führt den Schriftbeleg ein. Das deutsche Perfekt klingt in moderner Standardsprache natürlich und gibt den vergangenen Sprechakt mit fortdauernder Geltung wieder.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: Ich werde unter ihnen wohnen
  rationale: ἐν mit dem Plural αὐτοῖς kann »in ihnen« oder im gemeinschaftlichen Sinn »unter ihnen« bedeuten. Der Bundeszusammenhang und das parallele »unter ihnen umhergehen« stützen hier die kollektive Wiedergabe.
- source_word: ἐμπεριπατήσω
  choice: unter ihnen umhergehen
  rationale: Die Wiedergabe bewahrt das anschauliche Bild der gegenwärtigen, sich bewegenden Nähe Gottes und entspricht dem Präfix ἐμ- sowie dem Bundesmotiv.
- source_word: ἔσομαι αὐτῶν θεός
  choice: Ich werde ihr Gott sein
  rationale: Dies ist im Deutschen die natürliche Form der Bundesformel und bewahrt den relationalen Genitiv.
- source_word: λαός
  choice: Volk
  rationale: Im Zusammenhang der Bundesformel bezeichnet λαός Gottes Volk als Gemeinschaft.
theological_decisions:
- issue: Gemeinschaftliche Tempelmetaphorik
  choice: wir sind der Tempel des lebendigen Gottes
  alternative: wir sind ein Tempel des lebendigen Gottes
  rationale: Das artikellose ναός steht als Prädikatsnomen und ist hier qualitativ beziehungsweise bestimmt zu verstehen. »Der Tempel« bringt die gemeinsame Identität der Gemeinde als Gottes Tempel zum Ausdruck.
- issue: Formulierung des göttlichen Wohnens
  choice: Ich werde unter ihnen wohnen
  alternative: Ich werde in ihnen wohnen
  rationale: Die Aussage richtet sich an die Gemeinschaft und nimmt alttestamentliche Bundes- und Gegenwartsmotive auf. »Unter ihnen« entspricht diesem kollektiven Sinn und dem parallelen »unter ihnen umhergehen«, während die mögliche Wiedergabe »in ihnen« in einer Fußnote erhalten bleibt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer rhetorischer Frage. Die Tempel- und Bundesbegriffe bleiben bewusst biblisch geprägt. Die Zeichensetzung gliedert das Zitat in natürliche deutsche Sätze, ohne seine Parallelstruktur aufzulösen.
