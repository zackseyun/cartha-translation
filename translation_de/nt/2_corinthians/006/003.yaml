source:
  edition: SBLGNT
  text: μηδεμίαν ἐν μηδενὶ διδόντες προσκοπήν, ἵνα μὴ μωμηθῇ ἡ διακονία,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: de
  text: Wir geben in keiner Hinsicht einen Anlass zum Anstoß[a], damit der Dienst nicht getadelt wird[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir geben in nichts einen Anstoß.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit der Dienst nicht in Misskredit gerät.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: keinen Anlass zum Anstoß
  rationale: Die Wendung bezeichnet etwas, woran andere Anstoß nehmen oder wodurch sie zu Fall kommen können. „Anlass zum Anstoß“ bewahrt das griechische Bild und klingt im Deutschen natürlich.
- source_word: ἐν μηδενί
  choice: in keiner Hinsicht
  rationale: 'Die Präpositionalphrase bezeichnet den umfassenden Bereich: in keiner Sache beziehungsweise unter keinem Gesichtspunkt. „In keiner Hinsicht“ gibt diesen Umfang idiomatisch wieder.'
- source_word: διδόντες
  choice: Wir geben
  rationale: Das Partizip setzt den vorausgehenden Satz syntaktisch fort. Für einen eigenständig verständlichen Vers wird es als finites Verb wiedergegeben; „geben“ bleibt nah am griechischen Ausdruck.
- source_word: ἵνα μὴ
  choice: damit ... nicht
  rationale: Die Formulierung bewahrt den möglichen Zweck- oder Ergebnissinn der griechischen Konstruktion, ohne ihn enger festzulegen.
- source_word: μωμηθῇ
  choice: getadelt wird
  rationale: Das passive Verb bedeutet, dass etwas bemängelt, getadelt oder in Misskredit gebracht wird. „Getadelt“ ist direkt und wahrt die Passivform.
- source_word: ἡ διακονία
  choice: der Dienst
  rationale: διακονία bezeichnet hier den von Paulus und seinen Mitarbeitern ausgeübten apostolischen Dienst. „Dienst“ ist verständlich und vermeidet, spätere Amtsstrukturen in den Ausdruck hineinzulesen.
theological_decisions:
- issue: Bedeutung von διακονία in der Selbstbeschreibung des Paulus
  choice: „der Dienst“ als der von Paulus und seinen Mitarbeitern ausgeübte apostolische Dienst
  alternative: „das Amt“ oder allgemeiner „die Dienstleistung“
  rationale: Der Zusammenhang betrifft die Ausführung des göttlichen Auftrags durch Paulus und seine Mitarbeiter. „Dienst“ erfasst dies, ohne den Begriff auf ein später institutionalisiertes Amt festzulegen.
- issue: Zweck oder Ergebnis bei ἵνα μὴ
  choice: „damit ... nicht“
  alternative: „sodass ... nicht“ oder „damit keinesfalls“
  rationale: ἵνα kann in diesem Zusammenhang Zweck und beabsichtigtes Ergebnis eng verbinden. Die deutsche Formulierung erhält diese Spannung, statt sie ausdrücklich auf nur eine Kategorie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem griechischen Partizip zu einem selbstständigen deutschen Hauptsatz entfaltet. Die Wiederholung „keiner ... Anlass“ gibt die umfassende Negation wieder, ohne unnatürlich zu wirken.
