base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: de
  text: 'Denn wir freuen uns, wenn wir schwach sind, ihr aber stark seid. Und das ist auch unser Gebet: eure Wiederherstellung.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Reifung“ oder „eure Vervollständigung“. Das griechische Wort kann Wiederherstellung, Zurüstung oder das Versetzen in einen angemessenen Zustand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: wir freuen uns
  rationale: Das Präsens bezeichnet die gegenwärtige Freude des Paulus; „sich freuen“ gibt den positiven Sinn natürlich und angemessen stark wieder.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt die begründende Verbindung zum vorausgehenden Zusammenhang.
- source_word: ὅταν
  choice: wenn
  rationale: Mit dem Konjunktiv hat die Wendung einen allgemeinen zeitlichen Sinn; „wenn“ ist im Deutschen natürlich.
- source_word: ἀσθενῶμεν
  choice: wir schwach sind
  rationale: Bewahrt die breite Bedeutung körperlicher, sozialer oder äußerlich wahrgenommener Schwäche, ohne den Kontext unnötig festzulegen.
- source_word: δυνατοὶ ἦτε
  choice: ihr aber stark seid
  rationale: „Stark“ bildet den natürlichen und im Griechischen ausdrücklich markierten Gegensatz zu „schwach“; „aber“ gibt δέ wieder.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: Darum beten wir auch
  rationale: εὔχομαι bedeutet hier im paulinischen Zusammenhang „beten“. „Darum“ nimmt das vorausweisende τοῦτο idiomatisch auf und leitet den Inhalt des Gebets ein.
- source_word: τὴν ὑμῶν κατάρτισιν
  choice: dass ihr wieder in Ordnung kommt
  rationale: Die Formulierung gibt den Gedanken des Wiederherstellens beziehungsweise Versetzens in den richtigen Zustand natürlich wieder und passt zum seelsorgerlich-korrigierenden Kontext; die Bedeutungsbreite wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von κατάρτισις im Blick auf das seelsorgerliche Ziel des Paulus
  choice: dass ihr wieder in Ordnung kommt
  alternative: dass ihr zur Reife gelangt; dass ihr vollständig zurechtgebracht werdet
  rationale: Die gewählte Wiedergabe lässt erkennen, dass Paulus auf einen richtigen, wiederhergestellten Zustand der Gemeinde zielt, ohne daraus eine technische Lehre von Vollkommenheit abzuleiten. Reifung und Vervollständigung bleiben lexikalisch mögliche Nuancen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gegensatz „schwach – stark“ bleibt knapp und deutlich. Die abstrakte Nominalform κατάρτισις wird zur besseren Verständlichkeit verbal wiedergegeben; ihre echte Bedeutungsbreite wird in der Fußnote ausgewiesen.
