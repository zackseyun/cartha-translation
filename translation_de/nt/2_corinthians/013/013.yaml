reference: 2 Corinthians 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: de
  text: Die Gnade von Jesus, dem Herrn und Messias,[a] und die Liebe Gottes und die Gemeinschaft des Heiligen Geistes[b] seien mit euch allen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Jesus Christus“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die Kommunion des Heiligen Geistes“ oder „die Teilhabe am Heiligen Geist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Der im Deutschen etablierte paulinische Segensbegriff bewahrt sowohl das theologische Gewicht als auch die Bedeutungsbreite des griechischen Wortes.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die natürliche und sachgerechte Wiedergabe des christologischen Titels κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός wird als Titel verstanden und daher mit „Messias“ übersetzt; die Apposition mit Artikel macht dies im Deutschen deutlich, ohne „Messias“ wie einen Nachnamen wirken zu lassen.
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die direkte und natürliche deutsche Entsprechung und passt zur Segensformel.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv bleibt unaufgelöst, sodass der Text nicht vorschnell auf „Gottes Liebe zu euch“ oder eine andere engere Deutung festgelegt wird.
- source_word: κοινωνία
  choice: Gemeinschaft
  rationale: „Gemeinschaft“ bewahrt die relationale und partizipative Bedeutungsbreite; mögliche Nuancen wie „Teilhabe“ werden in der Fußnote erhalten.
- source_word: ἁγίου πνεύματος
  choice: des Heiligen Geistes
  rationale: Dies ist die standardsprachliche deutsche Bezeichnung; der Genitiv des Ausgangstextes bleibt erhalten.
- source_word: μετὰ πάντων ὑμῶν
  choice: seien mit euch allen
  rationale: Das im Griechischen ausgelassene Verb wird entsprechend der deutschen Segensformel ergänzt. „Euch allen“ gibt πάντων ausdrücklich wieder; der Plural „seien“ bezieht sich natürlich auf die drei koordinierten Segensgaben.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ als christologischer Titel
  choice: Messias
  alternative: Christus
  rationale: Χριστός bezeichnet hier einen Titel. „Messias“ macht dessen Bedeutung transparent; die kirchlich traditionelle Wiedergabe „Christus“ bleibt als Alternative in der Fußnote erhalten.
- issue: Bedeutung von κοινωνία τοῦ ἁγίου πνεύματος
  choice: die Gemeinschaft des Heiligen Geistes
  alternative: die Teilhabe am Heiligen Geist
  rationale: Die Genitivverbindung kann Gemeinschaft, die der Geist wirkt oder schenkt, ebenso anklingen lassen wie Teilhabe am Geist. Die Hauptfassung bewahrt diese Offenheit; die Fußnote nennt die partizipative Alternative.
- issue: Bezug des Segenswunsches auf die drei Glieder
  choice: seien
  alternative: sei
  rationale: Im Griechischen ist kein Verb ausgedrückt. Im Deutschen stimmt der Plural grammatisch mit „Gnade“, „Liebe“ und „Gemeinschaft“ überein, ohne die Einheit der Segensformel theologisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Gestalt einer apostolischen Segensformel bleibt erkennbar. Die dreifache Koordination mit „und“ folgt der feierlichen Struktur des griechischen Textes; Fachjargon und konfessionelle Engführungen werden vermieden.
