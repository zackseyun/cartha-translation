revisions:
- from: Die Gnade des Herrn Jesus, des Messias,[a] und die Liebe Gottes und die Gemeinschaft des Heiligen Geistes[b] seien mit euch allen.
  to: Die Gnade von Jesus, dem Herrn und Messias,[a] und die Liebe Gottes und die Gemeinschaft des Heiligen Geistes[b] seien mit euch allen.
  rationale: Die Revision glättet die deutsche Titelkonstruktion und ersetzt in Fußnote b eine einseitig agentische Umschreibung durch zwei sprachlich und sachlich gedeckte Alternativen. Die offene Genitivbeziehung bei κοινωνία τοῦ ἁγίου πνεύματος bleibt im Haupttext erhalten.
