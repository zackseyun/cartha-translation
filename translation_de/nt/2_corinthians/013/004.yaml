source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: de
  text: Denn er wurde zwar in Schwachheit gekreuzigt[a], aber er lebt durch Gottes Kraft. Denn auch wir sind in ihm zwar schwach, aber wir werden mit ihm durch Gottes Kraft euch gegenüber leben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Schwachheit“. Das griechische ἐξ kann wörtlicher den Ausgangspunkt oder die Grundlage bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für euch“, „unter euch“ oder „in Bezug auf euch“. Die griechische Wendung εἰς ὑμᾶς ist knapp und kann Richtung, Beziehung oder Wirkung ausdrücken. „Wir werden mit ihm leben“ kann sich auf das künftige, von Christi Kraft bestimmte Wirken des Paulus euch gegenüber beziehen und zugleich weitergehende Auferstehungsthemen anklingen lassen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: wurde gekreuzigt
  rationale: Das Aoristpassiv wird mit der im Deutschen üblichen und präzisen Formulierung wiedergegeben.
- source_word: ἐξ ἀσθενείας
  choice: aus Schwachheit
  rationale: „Aus“ wahrt die Herkunfts- bzw. Grundlage-Nuance von ἐξ und erhält die sprachliche Parallele zum folgenden ἐκ δυνάμεως θεοῦ; die ungewohnte Formulierung wird in einer Fußnote erläutert.
- source_word: ζῇ
  choice: lebt
  rationale: Das Präsens bewahrt die fortdauernde verbale Aussage.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: aus Gottes Kraft
  rationale: Die wiederholte Präposition ἐκ wird parallel zu ἐξ ἀσθενείας übersetzt und stellt Schwachheit und Gottes Kraft einander gegenüber.
- source_word: ἀσθενοῦμεν
  choice: sind schwach
  rationale: Die Wiedergabe erhält die lexikalische Verbindung zu ἀσθένεια im ersten Satzteil.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die knappe paulinische Rede von der Verbundenheit mit Christus bleibt ohne ausdeutende Erweiterung erhalten.
- source_word: ζήσομεν
  choice: wir werden leben
  rationale: Die Futurform wird ausdrücklich bewahrt und weder allein auf gegenwärtigen Dienst noch allein auf die Auferstehung festgelegt.
- source_word: σὺν αὐτῷ
  choice: mit ihm
  rationale: Die Formulierung gibt die durch σύν bezeichnete Gemeinschaft bzw. Teilhabe natürlich wieder.
- source_word: εἰς ὑμᾶς
  choice: für euch
  rationale: Im Deutschen bringt „für euch“ den auf die Korinther gerichteten Bezug idiomatisch zum Ausdruck; die komprimierte und mehrdeutige griechische Wendung wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Bedeutung der Schwachheit Christi bei der Kreuzigung
  choice: Die Aussage wird als paradoxe Gegenüberstellung von Kreuzigung aus Schwachheit und Leben aus Gottes Kraft stehen gelassen.
  alternative: „In Schwachheit“ könnte stärker die Art oder den Bereich der Kreuzigung bezeichnen.
  rationale: Die Übersetzung bewahrt die Aussage des Textes, ohne daraus eine Verneinung der Gottheit oder Sündlosigkeit Christi abzuleiten oder solche dogmatischen Erläuterungen in den Vers einzutragen.
- issue: Bezug von „wir werden mit ihm leben“
  choice: Die Zukunftsaussage bleibt offen genug für die durch Christus wirksame apostolische Lebens- und Kraftentfaltung gegenüber den Korinthern sowie für den weiteren Auferstehungshorizont.
  alternative: Die Wendung könnte ausschließlich auf den gegenwärtigen apostolischen Dienst oder ausschließlich auf das künftige Auferstehungsleben bezogen werden.
  rationale: Der unmittelbare Kontext weist auf das Handeln gegenüber den Korinthern, während „mit ihm“ zugleich einen umfassenderen Anteil am Leben Christi anklingen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „aus …“ ist bewusst etwas markanter, um die formale Gegenüberstellung der griechischen Präpositionalphrasen zu erhalten. „Denn … zwar … aber“ bildet den argumentativen und kontrastiven Verlauf natürlich ab.
