source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: de
  text: 'Da ihr einen Beweis dafür sucht, dass der Messias in mir spricht[a]: Er ist euch gegenüber nicht schwach, sondern erweist sich in euch als mächtig[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass der Messias durch mich spricht«. Wörtlicher: »des in mir sprechenden Messias«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unter euch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Da ... ja
  rationale: Gibt den kausalen Bezug zum Kontext natürlich wieder und lässt zugleich erkennen, dass Paulus an die bereits bestehende Forderung der Korinther anknüpft.
- source_word: δοκιμήν
  choice: einen Beweis
  rationale: Bezeichnet hier den erweisenden Nachweis beziehungsweise die Bestätigung, nicht primär den Vorgang einer Prüfung.
- source_word: ζητεῖτε
  choice: ihr ... sucht
  rationale: Das Präsens beschreibt das fortdauernde Verlangen der Adressaten; im Deutschen ist das einfache Präsens idiomatisch.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: dafür, dass der Messias in mir spricht
  rationale: Die Genitivkonstruktion wird als natürliche deutsche Inhaltsergänzung zu »Beweis« wiedergegeben. ἐν ἐμοί bleibt mit »in mir« formal offen und wird nicht vorschnell als »durch mich« gedeutet.
- source_word: Χριστοῦ
  choice: der Messias
  rationale: Χριστός trägt hier erkennbar Titelcharakter; »Messias« bewahrt diese Bedeutung im modernen Deutschen.
- source_word: εἰς ὑμᾶς
  choice: euch gegenüber
  rationale: Drückt die relationale beziehungsweise gerichtete Bedeutung von εἰς im Deutschen idiomatisch aus.
- source_word: οὐκ ἀσθενεῖ
  choice: ist ... nicht schwach
  rationale: Bewahrt den ausdrücklichen Gegensatz von Schwachheit und Macht, der auch den weiteren Zusammenhang prägt.
- source_word: ἀλλὰ δυνατεῖ
  choice: sondern wirkt machtvoll
  rationale: Das seltene Verb bezeichnet wirksame Macht. Die verbale Wiedergabe klingt natürlicher als »ist mächtig« und erhält den dynamischen Sinn.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Entspricht der Präposition unmittelbar und bewahrt die mögliche innere wie auch gemeinschaftliche Dimension bei der pluralischen Anrede.
theological_decisions:
- issue: Titelcharakter von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Die Wiedergabe als »Messias« macht den Titelgehalt sichtbar, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Bedeutung von ἐν ἐμοί
  choice: in mir
  alternative: durch mich
  rationale: »In mir« folgt dem griechischen Wortlaut und hält offen, ob Christi Gegenwart in Paulus oder sein Sprechen durch Paulus im Vordergrund steht.
- issue: Bedeutung von ἐν ὑμῖν
  choice: in euch
  alternative: unter euch
  rationale: »In euch« bildet den griechischen Ausdruck direkt ab; »unter euch« ist wegen der pluralischen, gemeindlichen Anrede ebenfalls möglich. Eine Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gliedert den langen griechischen Satz klar, ohne seinen argumentativen Zusammenhang aufzulösen. »Wirkt machtvoll« wahrt den Gegensatz zu »schwach« und vermeidet schwerfällige Nominalformulierungen.
