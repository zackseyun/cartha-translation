id: 2CO.13.1
reference: 2 Corinthians 13:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: de
  text: 'Dies ist das dritte Mal, dass ich zu euch komme: »Durch die Aussage von zwei oder drei Zeugen wird jede Sache bestätigt werden.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auf die Aussage von zwei Zeugen oder drei hin wird jedes Wort feststehen.« Der griechische Wortlaut folgt eng 5. Mose 19,15 und verwendet eine rechtliche Ausdrucksweise.'
    reason: lexical_alternative
  - marker: b
    text: Anspielung auf 5. Mose 19,15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Dies ist das dritte Mal
  rationale: Die adverbial gebrauchte Wendung bezeichnet den dritten angekündigten Besuch; diese Formulierung ist im modernen Deutsch klar und natürlich.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: dass ich zu euch komme
  rationale: Das Präsens kann hier einen bevorstehenden Besuch ausdrücken und bewahrt zugleich die Unmittelbarkeit der Ankündigung.
- source_word: ἐπὶ στόματος
  choice: durch die Aussage von
  rationale: Die wörtliche Wendung »auf dem Mund« ist ein rechtlicher Semitismus. »Durch die Aussage von« gibt ihren forensischen Sinn verständlich wieder.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: zwei oder drei Zeugen
  rationale: Das καί gehört zur festen biblischen Formel und hat hier distributiven Sinn; im Deutschen lautet sie idiomatisch »zwei oder drei Zeugen«.
- source_word: σταθήσεται
  choice: wird … bestätigt werden
  rationale: Das Futur Passiv von ἵστημι bezeichnet im rechtlichen Zusammenhang das Feststehen beziehungsweise die Bestätigung einer Sache.
- source_word: πᾶν ῥῆμα
  choice: jede Sache
  rationale: ῥῆμα kann »Wort«, »Aussage« oder im juristischen Zusammenhang »Sache« bedeuten. »Jede Sache« bewahrt die breite rechtliche Aussage, ohne sie auf eine Anklage einzuengen.
theological_decisions:
- issue: Reichweite des deuteronomischen Rechtsgrundsatzes in Paulus’ disziplinarischem Zusammenhang
  choice: Die Aussage wird als allgemeiner Rechtsgrundsatz wiedergegeben, nach dem jede Sache durch mehrere Zeugen bestätigt wird.
  alternative: πᾶν ῥῆμα enger als »jede Anklage« oder wörtlicher als »jedes Wort« wiederzugeben.
  rationale: Paulus greift einen Schriftgrundsatz auf. Die Übersetzung sollte dessen rechtliche Tragweite bewahren, ohne ihn auf eine bestimmte kirchliche Anwendung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der rechtliche Charakter des Schriftzitats bleibt erkennbar; schwer verständliche Wörtlichkeit wird in der Hauptzeile vermieden und in Fußnote [a] dokumentiert.
