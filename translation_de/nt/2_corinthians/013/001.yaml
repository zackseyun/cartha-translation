  terminology: „Aussage“, „Zeugen“, „Sache“ und „bestätigt“ sind für den rechtlichen Kontext sachgerecht. Die Fußnote dokumentiert sowohl die stärker formnahe Möglichkeit „jedes Wort“ als auch die Anspielung auf 5. Mose 19,15.
