  source_fidelity: 'Die Übersetzung gibt Τρίτον τοῦτο idiomatisch als „Dies ist das dritte Mal“ wieder und bewahrt mit „dass ich zu euch komme“ den präsenshaften, auf den bevorstehenden Besuch bezogenen Ausdruck. Das Zitat trifft den rechtlichen Sinn von ἐπὶ στόματος, σταθήσεται und πᾶν ῥῆμα zuverlässig: Eine Sache wird aufgrund mehrerer Zeugenaussagen bestätigt. „zwei oder drei Zeugen“ gibt die feste, im Deutschen natürliche Formel angemessen wieder, ohne das griechische καί irreführend kumulativ zu verstehen.'
