source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: de
  text: Grüßt einander mit einem heiligen Kuss.[a] Es grüßen euch alle Heiligen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mit einem geheiligten Kuss“. Gemeint ist eine damals übliche Grußhandlung, die von Heiligkeit und christlicher Gemeinschaft geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: „Heilige“ bezeichnet hier die Glaubenden, also Gottes heiliges Volk, nicht nur eine besondere Gruppe später kirchlich anerkannter Personen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aorist-Imperativ in der zweiten Person Plural ist eine direkte Aufforderung. „Grüßt“ ist im Deutschen die knappe und natürliche Entsprechung.
- source_word: ἀλλήλους
  choice: einander
  rationale: Das reziproke Pronomen bezeichnet eine gegenseitige Handlung innerhalb der Gemeinde; „einander“ gibt dies idiomatisch wieder.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: mit einem heiligen Kuss
  rationale: Das instrumentale ἐν wird in dieser Grußformel natürlich mit „mit“ wiedergegeben. „Heilig“ bewahrt den religiös bestimmten Gemeinschaftscharakter, und „Kuss“ gibt φίλημα ohne verallgemeinernde Umschreibung wieder.
- source_word: ἀσπάζονται ὑμᾶς
  choice: Es grüßen euch
  rationale: Im brieflichen Zusammenhang bezeichnet das Präsens die Übermittlung von Grüßen. Die deutsche Satzstellung ist natürlich und bewahrt „euch“ als Pluralobjekt.
- source_word: οἱ ἅγιοι πάντες
  choice: alle Heiligen
  rationale: ἅγιοι ist bei Paulus eine übliche Bezeichnung für die Glaubenden als Gottes geheiligtes Volk. „Alle“ gibt πάντες vollständig wieder.
theological_decisions:
- issue: Wiedergabe von ἅγιοι als paulinische Gemeindebezeichnung
  choice: Heiligen
  alternative: die zu Gottes heiligem Volk gehören / die Glaubenden
  rationale: „Heilige“ erhält den paulinischen Schlüsselbegriff und seine theologische Aussage. Eine Fußnote verhindert zugleich das mögliche Missverständnis, hier sei nur eine später kirchlich anerkannte Sondergruppe gemeint.
- issue: Charakter des φιλήματι als christlicher Gruß
  choice: heiligen Kuss
  alternative: geheiligten Kuss / Friedenskuss
  rationale: „Heiliger Kuss“ entspricht dem griechischen Ausdruck unmittelbar und lässt offen, wie die konkrete kulturelle Grußhandlung heute anzuwenden ist. „Friedenskuss“ würde eine nicht ausdrücklich genannte liturgische Deutung eintragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem brieflichem Ton. Die traditionelle, aber weiterhin verständliche Wendung „heiliger Kuss“ bleibt erhalten; die Fußnoten erläutern kulturelle und begriffliche Missverständnisse.
