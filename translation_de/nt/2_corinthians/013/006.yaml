  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: de
  text: Doch ich hoffe, dass ihr erkennen werdet, dass wir nicht durch die Prüfung gefallen sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nicht unbewährt«; auch: »nicht als untauglich erwiesen«. Das griechische Adjektiv bezeichnet jemanden, der sich bei einer Prüfung nicht als bewährt erweist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: ich hoffe
  rationale: Das Präsens in der ersten Person Singular wird natürlich mit »ich hoffe« wiedergegeben und bewahrt die erwartungsvolle Ausrichtung der Aussage.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen milden Gegensatz zum vorausgehenden Gedanken. »Doch« gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: γνώσεσθε
  choice: ihr werdet erkennen
  rationale: Die Futurform bezeichnet die künftige Einsicht der Korinther. »Erkennen« passt hier besser als das statischere »wissen«, ohne einen längeren Erkenntnisprozess vorauszusetzen.
- source_word: ὅτι
  choice: dass
  rationale: Beide Vorkommen von ὅτι leiten Inhaltssätze ein; im Deutschen entspricht dem jeweils »dass«.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen wird mit »wir« wiedergegeben. Eine zusätzliche Hervorhebung ist im Deutschen nicht erforderlich.
- source_word: οὐκ ἐσμὲν
  choice: nicht … gefallen sind
  rationale: Die einfache Verneinung wird ohne Verstärkung bewahrt. Wegen der idiomatischen deutschen Wendung mit »durch die Prüfung fallen« wird die griechische Kopulakonstruktion verbal wiedergegeben.
- source_word: ἀδόκιμοι
  choice: durch die Prüfung gefallen
  rationale: Das Adjektiv bezeichnet Personen oder Dinge, die sich bei einer Prüfung nicht als bewährt erweisen. Die Formulierung macht das im Kontext vorherrschende Prüfungsmotiv verständlich, ohne die später theologisch belastete Wiedergabe »verworfen« zu verwenden.
theological_decisions:
- issue: Wiedergabe von ἀδόκιμοι im Zusammenhang von Prüfung, Bewährung und apostolischer Legitimität
  choice: nicht durch die Prüfung gefallen
  alternative: nicht unbewährt; nicht als untauglich erwiesen; nicht verworfen
  rationale: Die gewählte Formulierung hält am Bild einer Prüfung fest und bezeichnet ein negatives Prüfergebnis, ohne genauer festzulegen, ob vor allem die apostolische Echtheit, die Befähigung oder die Bewährung gemeint ist. »Verworfen« könnte dagegen eine weitergehende heilsgeschichtliche oder dogmatische Aussage nahelegen, die der Vers nicht ausdrücklich macht.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. »Durch die Prüfung fallen« ist idiomatisch und bewahrt das Prüfungsbild des unmittelbaren Zusammenhangs; die Fußnote nennt formal nähere Alternativen und erhält die Bedeutungsbreite.
