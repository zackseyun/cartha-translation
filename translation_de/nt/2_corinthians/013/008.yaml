    rationale: Die Antithese οὐ … ἀλλά trägt den Gegensatz, enthält aber kein separates Äquivalent zu „nur“. Da die Ellipse im Deutschen ohne „nur“ klar ist, sollte die Ergänzung entfallen.
  - severity: low
    issue: Die Fußnote erklärt eine eigene, vermeidbare Ergänzung und bietet eine „wörtlichere“ Fassung, die nicht nötig ist.
    rationale: Nach Streichung von „nur“ entspricht der Haupttext bereits der knappen Struktur des Griechischen hinreichend. Eine Fußnote ist weder für eine Textvariante noch für eine verbleibende Übersetzungsunsicherheit erforderlich.
