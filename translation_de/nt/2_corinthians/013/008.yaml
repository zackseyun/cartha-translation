  source_fidelity: Der Satz gibt γάρ, die Verneinung mit τι, die adversative Gegenüberstellung κατά/ὑπέρ sowie den bestimmten Ausdruck „die Wahrheit“ zutreffend wieder. Das zusätzliche „nur“ ist jedoch kein ausdrückliches Element des griechischen Textes. Die Konstruktion οὐ … ἀλλά stellt zwar exklusiv gegenüber, doch die deutsche Ellipse „sondern für die Wahrheit“ bildet diese knappe Form bereits ausreichend und genauer nach.
  naturalness: „Denn wir können nichts gegen die Wahrheit tun, sondern für die Wahrheit.“ ist modernes, verständliches und würdiges Standarddeutsch. Die Auslassung von „tun“ im zweiten Glied ist in der parallelen Gegenüberstellung natürlich.
  terminology: „Wahrheit“ sollte ohne doktrinäre Einengung beibehalten werden. „Gegen die Wahrheit“ und „für die Wahrheit“ bewahren die rhetorische und semantische Parallelität von κατὰ/ὑπέρ τῆς ἀληθείας.
