  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: de
  text: Denn wir können nichts gegen die Wahrheit tun, sondern für die Wahrheit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn … nichts
  rationale: γάρ begründet die vorausgehende Aussage; „Denn“ ist im Deutschen der natürliche knappe Anschluss. Die Verneinung οὐ wird zusammen mit τι idiomatisch durch „nichts“ wiedergegeben.
- source_word: δυνάμεθά
  choice: wir können
  rationale: δύναμαι bezeichnet Fähigkeit oder Vermögen. „Wir können“ ist direkt, natürlich und bewahrt den Aussagegehalt.
- source_word: τι
  choice: nichts
  rationale: Das indefinite τι wird unter der Verneinung im Deutschen idiomatisch mit „nichts“ wiedergegeben.
- source_word: κατὰ τῆς ἀληθείας
  choice: gegen die Wahrheit
  rationale: κατά mit Genitiv hat hier gegensätzliche Bedeutung. Der Artikel wird beibehalten, ohne „Wahrheit“ auf eine bestimmte Lehrformel einzuengen.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach einer verneinten Aussage kennzeichnet „sondern“ den starken Gegensatz im Deutschen genauer und natürlicher als „aber“.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: für die Wahrheit
  rationale: ὑπέρ drückt hier Unterstützung beziehungsweise Einsatz zugunsten der Wahrheit aus. „Für die Wahrheit“ erhält die knappe rhetorische Gegenüberstellung zu „gegen die Wahrheit“.
theological_decisions:
- issue: Bedeutung von „die Wahrheit“ in der Gegenüberstellung
  choice: „die Wahrheit“ wird ohne weitere Eingrenzung beibehalten
  alternative: „die Wahrheit des Evangeliums“ oder „das Wahre“
  rationale: Der griechische Wortlaut ist weiter als eine einzelne Lehrformel. Im Kontext schließt er die Wahrheit des Evangeliums ein, legt sich aber nicht ausdrücklich darauf allein fest.
- issue: Elliptische zweite Satzhälfte
  choice: „tun“ wird gedanklich aus der ersten Satzhälfte ergänzt; „nur“ verdeutlicht die ausschließende Gegenüberstellung
  alternative: „sondern für die Wahrheit“ ohne „nur“
  rationale: Das Griechische lässt das Verb in der zweiten Hälfte aus. Im Deutschen ist die Ellipse verständlich. „Nur“ macht die durch οὐ … ἀλλά ausgedrückte ausschließende Antithese natürlich deutlich, obwohl kein eigenes Wort für „nur“ steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Antithese „gegen die Wahrheit … für die Wahrheit“ bleibt erhalten; „sondern“ entspricht dem deutschen Sprachgebrauch nach einer Verneinung.
