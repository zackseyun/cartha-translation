reference: 2 Corinthians 13:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: de
  text: Deshalb schreibe ich dies, während ich abwesend bin, damit ich, wenn ich anwesend bin, nicht mit Härte vorgehen muss[a] – entsprechend der Vollmacht, die der Herr mir gegeben hat, zum Aufbauen und nicht zum Niederreißen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht streng handeln muss“; auch: „nicht scharf mit euch verfahren muss“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Erbauung und nicht zur Zerstörung“. Im Griechischen steht eine Bau-Metapher: aufbauen im Gegensatz zu niederreißen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: Gibt den folgernden Rückbezug auf den vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: ταῦτα
  choice: dies
  rationale: Das neutrale Pluralpronomen verweist hier zusammenfassend auf den Inhalt des Schreibens beziehungsweise die vorausgehenden Mahnungen; im Deutschen ist der singularische Sammelbezug „dies“ idiomatisch.
- source_word: ἀπὼν / παρὼν
  choice: während ich abwesend bin / wenn ich anwesend bin
  rationale: Bewahrt den betonten Gegensatz der beiden Partizipien und gibt ihre unterschiedlichen zeitlichen Bezüge in natürlichem Deutsch wieder.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: nicht mit Härte vorgehen muss
  rationale: ἀποτόμως bezeichnet ein scharfes oder strenges Vorgehen; χρήομαι wird im Zusammenhang idiomatisch als „vorgehen“ wiedergegeben. „muss“ macht die im Kontext liegende unerwünschte Notwendigkeit deutlich, ohne sie als Gewissheit darzustellen.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: entsprechend der Vollmacht
  rationale: κατά bezeichnet hier ein Handeln gemäß beziehungsweise im Rahmen der Paulus übertragenen Befugnis. „Vollmacht“ erfasst die anvertraute, legitimierte Autorität.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: zum Aufbauen und nicht zum Niederreißen
  rationale: Erhält den anschaulichen Gegensatz der griechischen Baumetapher und bleibt zugleich allgemein verständlich.
theological_decisions:
- issue: Bezug der Bezeichnung ὁ κύριος
  choice: der Herr
  alternative: ausdrückliche Identifizierung als Jesus oder eine allgemeinere göttliche Bezeichnung
  rationale: Der Vers selbst nennt lediglich „den Herrn“. Die Übersetzung bewahrt diese Bezeichnung, ohne den Bezug über den Wortlaut hinaus ausdrücklich festzulegen.
- issue: Zweck der Paulus verliehenen Vollmacht
  choice: zum Aufbauen und nicht zum Niederreißen
  alternative: zur Erbauung und nicht zur Zerstörung
  rationale: Die konkrete Baumetapher bleibt erhalten und verdeutlicht, dass die Vollmacht einem konstruktiven Zweck dient, ohne mögliche disziplinierende Ausübung grundsätzlich auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gegensatz zwischen Abwesenheit und Anwesenheit sowie die Baumetapher werden deutlich beibehalten. „Vollmacht“ ist gegenüber dem allgemeineren „Macht“ gewählt, weil es die vom Herrn verliehene Befugnis ausdrückt.
