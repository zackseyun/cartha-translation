source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: de
  text: Wir beten zu Gott, dass ihr nichts Böses tut – nicht damit wir als bewährt erscheinen[a], sondern damit ihr das Gute tut, auch wenn wir als nicht bewährt gelten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als erprobt“ beziehungsweise „als echt erwiesen“. Im Griechischen stehen hier und am Versende gegensätzliche Wörter aus dem Bereich des Prüfens und Bewährens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auch wenn wir nicht bewährt sind“ beziehungsweise „als untauglich erscheinen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεόν
  choice: Wir beten zu Gott
  rationale: εὔχομαι bezeichnet hier ein an Gott gerichtetes Gebet; δέ wird im Deutschen nicht eigens wiedergegeben, da der leichte Anschluss im Satzfluss hinreichend erkennbar ist.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: dass ihr nichts Böses tut
  rationale: Die Infinitivkonstruktion gibt den Inhalt des Gebets an. κακὸν μηδέν ist eine nachdrückliche Verneinung und wird natürlich mit „nichts Böses“ wiedergegeben.
- source_word: οὐχ ἵνα
  choice: nicht damit
  rationale: Die Formulierung leitet den von Paulus verneinten Zweck ein.
- source_word: δόκιμοι φανῶμεν
  choice: wir als bewährt erscheinen
  rationale: δόκιμος bezeichnet jemanden, der sich in einer Prüfung als echt oder tauglich erwiesen hat; φαίνω hebt hier das Erscheinen beziehungsweise Sichtbarwerden hervor.
- source_word: τὸ καλὸν ποιῆτε
  choice: ihr das Gute tut
  rationale: τὸ καλόν bezeichnet im ethischen Zusammenhang das Gute oder Rechte. „Das Gute tun“ wahrt die substantivische Form und klingt im Deutschen natürlich.
- source_word: ὡς ἀδόκιμοι ὦμεν
  choice: auch wenn wir als nicht bewährt gelten
  rationale: ἀδόκιμος bildet den ausdrücklichen Gegenbegriff zu δόκιμος. „Als nicht bewährt gelten“ wahrt diesen Gegensatz und lässt offen, ob Paulus vom äußeren Urteil oder vom tatsächlichen Ergebnis einer Prüfung spricht.
theological_decisions:
- issue: Bedeutung von ὡς ἀδόκιμοι
  choice: als nicht bewährt gelten
  alternative: als untauglich erscheinen / die Prüfung nicht bestehen
  rationale: Der unmittelbare Zusammenhang betrifft Prüfung, Bewährung und apostolische Anerkennung. Die Übersetzung vermeidet es, ἀδόκιμος als Aussage über endgültige Verwerfung zu deuten, legt den Ausdruck aber auch nicht ausschließlich auf bloßen Anschein fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortwahl „bewährt / nicht bewährt“ erhält den griechischen Gegensatz δόκιμοι / ἀδόκιμοι. Der Gedankenstrich gliedert den langen Satz, ohne seine argumentative Einheit aufzulösen.
