revisions:
- from: 'Ich habe es schon früher gesagt und sage es jetzt während meiner Abwesenheit im Voraus, wie damals, als ich zum zweiten Mal bei euch war: Denen, die früher gesündigt haben, und allen anderen sage ich: Wenn ich wiederkomme[a], werde ich euch nicht schonen.'
  to: 'Ich habe es schon zuvor gesagt und sage es jetzt, da ich abwesend bin, im Voraus – ebenso wie damals, als ich zum zweiten Mal bei euch anwesend war – denen, die früher gesündigt haben, und allen anderen: Wenn ich wiederkomme[a], werde ich euch nicht schonen.'
  rationale: Die Satzstellung wurde so angepasst, dass die griechische Gegenüberstellung „zum zweiten Mal anwesend“ und „jetzt abwesend“ klar als zwei Situationen derselben vorausgehenden Ankündigung erscheint. Die Bedeutung, Reichweite der Anrede und die bewusst offene Art der angekündigten Strenge bleiben unverändert. Die Fußnote unterscheidet präziser zwischen Wortlaut und kontextueller Besuchszählung.
