source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: de
  text: 'Ich habe es schon zuvor gesagt und sage es jetzt, da ich abwesend bin, im Voraus – ebenso wie damals, als ich zum zweiten Mal bei euch anwesend war – denen, die früher gesündigt haben, und allen anderen: Wenn ich wiederkomme[a], werde ich euch nicht schonen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang wohl: „wenn ich zum dritten Mal komme“. Wörtlich steht im Griechischen: „wenn ich wiederkomme“.'
    reason: Die Anmerkung erläutert die im Kontext naheliegende Zählung der Besuche, ohne sie als ausdrücklichen Wortlaut des griechischen Textes auszugeben.
lexical_decisions:
- source_word: προείρηκα
  choice: Ich habe es schon früher gesagt
  rationale: Das Perfekt bezeichnet eine frühere Äußerung mit fortdauernder Geltung. „Gesagt“ bewahrt die lexikalische Offenheit, ohne die kontextuelle Warnfunktion in das Verb selbst hineinzulegen.
- source_word: προλέγω
  choice: sage es … im Voraus
  rationale: Die Wiedergabe erhält den Bezug zum Verb „sagen“ und bringt zugleich den prospektiven Sinn von προλέγω zum Ausdruck.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: jetzt während meiner Abwesenheit … wie damals, als ich zum zweiten Mal bei euch war
  rationale: Die komprimierte griechische Gegenüberstellung von damaliger Anwesenheit und jetziger Abwesenheit wird in natürlichem Deutsch entfaltet, ohne eine weitere Einzelheit über den Besuch hinzuzufügen.
- source_word: τοῖς προημαρτηκόσιν
  choice: denen, die früher gesündigt haben
  rationale: Die Form verweist auf bereits zuvor begangene Sünden, lässt aber bewusst offen, ob seitdem Umkehr erfolgt ist.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: allen anderen
  rationale: Die Formulierung gibt die umfassende Bedeutung von πᾶσιν und die Abgrenzung der übrigen Adressaten idiomatisch wieder.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: wenn ich wiederkomme
  rationale: Dies entspricht der wörtlichen Aussage über ein erneutes Kommen. Die kontextuell mögliche Präzisierung als dritter Besuch bleibt der Fußnote vorbehalten.
- source_word: οὐ φείσομαι
  choice: werde ich euch nicht schonen
  rationale: „Nicht schonen“ gibt die angekündigte Härte direkt wieder. Das im Deutschen ergänzte „euch“ nimmt die unmittelbar zuvor angeredeten Gruppen auf, ohne eine bestimmte Form der Maßnahme festzulegen.
theological_decisions:
- issue: Reichweite der angekündigten Strenge
  choice: Die Warnung wird ausdrücklich an die früheren Sünder und an alle übrigen Adressaten gerichtet.
  alternative: Die Drohung könnte ausschließlich auf die zuvor sündigende Gruppe bezogen oder allgemeiner als nicht näher bestimmte apostolische Strenge verstanden werden.
  rationale: Die Syntax nennt beide Gruppen als Adressaten. Die Übersetzung legt jedoch weder eine konkrete Disziplinarmaßnahme noch ein bestimmtes kirchenrechtliches Verfahren fest.
- issue: Zählung des angekündigten Besuchs
  choice: Im Haupttext steht das formal nähere „wenn ich wiederkomme“.
  alternative: „Wenn ich zum dritten Mal komme.“
  rationale: Der griechische Wortlaut bezeichnet ein erneutes Kommen; dass es sich im Zusammenhang um einen dritten Besuch handelt, ist eine plausible kontextuelle Präzisierung, aber nicht ausdrücklich ausformuliert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bestimmtem Ton. Die Wiederholung von „gesagt/sage“ wahrt die Wortverwandtschaft des griechischen Textes; der Doppelpunkt gliedert den langen Satz, ohne seinen argumentativen Zusammenhang aufzulösen.
