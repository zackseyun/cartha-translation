  - severity: low
    issue: Die Fußnote nennt „zum dritten Mal“ eine genauere Formulierung.
    rationale: „Zum dritten Mal“ ist eine plausible Schlussfolgerung aus dem Kontext, aber keine genauere Wiedergabe der hier stehenden griechischen Wendung „wieder/erneut“. Die Anmerkung sollte diesen Unterschied klarer benennen.
