  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: de
  text: Prüft euch selbst, ob ihr im Glauben seid[a]; erprobt euch selbst. Oder erkennt ihr an euch selbst nicht, dass Jesus, der Messias, in euch[b] ist? Es sei denn, ihr habt die Prüfung nicht bestanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Im Glauben“ kann bedeuten, im christlichen Glauben zu stehen, oder echten persönlichen Glauben zu haben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: unter euch.'
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: Prüft
  rationale: Im Zusammenhang bezeichnet das Verb eine Selbstprüfung, nicht eine Versuchung. „Prüft“ gibt den evaluativen Sinn natürlich und präzise wieder.
- source_word: ἐν τῇ πίστει
  choice: im Glauben
  rationale: Die bestimmte griechische Wendung bleibt bewusst offen zwischen dem Bereich des christlichen Glaubens und echtem persönlichem Glauben; die deutsche Formulierung löst diese Spannung nicht auf.
- source_word: δοκιμάζετε
  choice: erprobt
  rationale: Das Verb steht parallel zu πειράζετε, betont jedoch stärker die Bewährung beziehungsweise Feststellung der Echtheit. „Erprobt“ bildet diese Nuance ab, ohne bloß „prüft“ zu wiederholen.
- source_word: ἐπιγινώσκετε ἑαυτούς
  choice: erkennt ihr an euch selbst nicht
  rationale: Die Formulierung bewahrt sowohl den verstärkten Erkenntnissinn des Verbs als auch das ausdrücklich reflexive ἑαυτούς und klingt im Deutschen verständlich.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  rationale: Χριστός wird hier als Titel verständlich gemacht; die Apposition ist in modernem Deutsch natürlicher als „Jesus Messias“.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Im Kontext der Selbstprüfung liegt die Gegenwart des Messias in den Adressaten nahe. Die mögliche gemeinschaftliche Bedeutung „unter euch“ wird in einer Fußnote bewahrt.
- source_word: εἰ μήτι ἀδόκιμοί ἐστε
  choice: Es sei denn, ihr besteht die Prüfung nicht
  rationale: Die Wendung wahrt die rhetorische Ausnahme und macht ἀδόκιμοι als Gegenbegriff zur erfolgreichen Prüfung verständlich, ohne die theologisch belastete Bezeichnung „verworfen“ zu verwenden.
theological_decisions:
- issue: Bedeutung von ἐν τῇ πίστει
  choice: im Glauben, mit bewusst offener Bedeutung
  alternative: dem christlichen Glauben treu bleiben beziehungsweise echten persönlichen Glauben besitzen
  rationale: Der griechische Ausdruck erlaubt sowohl eine objektiv-gemeinschaftliche als auch eine subjektive Nuance. Der Haupttext bewahrt diese Spannung; die Fußnote benennt sie.
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Hier kann Χριστός als bekenntnishafter Titel verstanden werden. „Messias“ erschließt dessen Bedeutung, ohne eine zusätzliche Lehrentscheidung einzutragen.
- issue: Bedeutung von ἐν ὑμῖν
  choice: in euch
  alternative: unter euch
  rationale: Der unmittelbare Aufruf zur Selbstprüfung begünstigt die personale Lesart, doch die Mehrzahl und die Präposition lassen auch eine gemeinschaftliche Lesart zu; diese steht in der Fußnote.
- issue: Bedeutung von ἀδόκιμοι
  choice: ihr besteht die Prüfung nicht
  alternative: ihr seid nicht bewährt / untauglich / verworfen
  rationale: Die gewählte Fassung erhält den Wortfeldbezug zum Prüfen und vermeidet, aus dem Vers eine über den Kontext hinausgehende Aussage endgültiger Verwerfung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei nahezu synonymen Prüfungsverben werden mit „prüfen“ und „erproben“ unterschieden. Die Schlussformulierung bleibt klar und idiomatisch und bewahrt zugleich den Zusammenhang mit dem griechischen Wortfeld der Bewährungsprüfung.
