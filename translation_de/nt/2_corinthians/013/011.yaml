  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: de
  text: Im Übrigen, Brüder und Schwestern,[a] freut euch, lasst euch zurechtbringen,[b] lasst euch ermutigen,[c] seid eines Sinnes,[d] lebt in Frieden, und der Gott der Liebe und des Friedens wird mit euch sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; die Anrede gilt hier der ganzen Gemeinde, also Männern und Frauen.
    reason: cultural_note
  - marker: b
    text: 'Auch: „lasst euch wiederherstellen“, „lasst euch vervollständigen“ oder „bringt euch in Ordnung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „nehmt Ermutigung beziehungsweise Ermahnung an“ oder „lasst euch trösten“.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „denkt dasselbe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: Im Übrigen
  rationale: Kennzeichnet den Übergang zum abschließenden Teil des Briefes. Anders als „Schließlich“ lässt die Formulierung offen, ob ein Schlussmarker oder „was das Übrige betrifft“ gemeint ist.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die maskuline Pluralform bezeichnet in dieser paulinischen Gemeindeanrede die Glaubensgeschwister insgesamt; im natürlichen heutigen Deutsch macht „Brüder und Schwestern“ diesen gemeinten Adressatenkreis sichtbar.
- source_word: χαίρετε
  choice: freut euch
  rationale: In der Reihe von Aufforderungen ist der imperativische Sinn wahrscheinlicher als die ebenfalls mögliche abschließende Grußformel „Lebt wohl“.
- source_word: καταρτίζεσθε
  choice: lasst euch zurechtbringen
  rationale: Bewahrt die passive beziehungsweise mediale Form und den Gedanken, in einen guten, geordneten Zustand gebracht oder wiederhergestellt zu werden, ohne Vollkommenheit zu behaupten.
- source_word: παρακαλεῖσθε
  choice: lasst euch ermutigen
  rationale: Gibt die passive beziehungsweise mediale Aufforderung natürlich wieder. Das Verb kann je nach Kontext auch Ermahnung oder Zuspruch bezeichnen.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: seid eines Sinnes
  rationale: Eine geläufige deutsche Wiedergabe des wörtlichen „denkt dasselbe“, die den Aufruf zu gemeinsamer Gesinnung ausdrückt, ohne völlige Gleichförmigkeit aller Ansichten zu behaupten.
- source_word: εἰρηνεύετε
  choice: lebt in Frieden
  rationale: Drückt die fortdauernde friedliche Lebensweise innerhalb der Gemeinschaft natürlich aus.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: der Gott der Liebe und des Friedens
  rationale: Entspricht direkt der griechischen Genitivverbindung und bewahrt ihre theologische Prägung.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: wird mit euch sein
  rationale: Gibt die Futurform als Verheißung in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Inklusiver Adressatenkreis von ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Obwohl das griechische Wort grammatisch maskulin ist, richtet sich die Anrede an die gesamte gemischte Gemeinde. Die ausgeschriebene inklusive Wiedergabe vermittelt im heutigen Deutsch die pragmatische Bedeutung genauer.
- issue: Verhältnis der Aufforderungen zur abschließenden Verheißung
  choice: Dann wird der Gott der Liebe und des Friedens mit euch sein.
  alternative: Und der Gott der Liebe und des Friedens wird mit euch sein.
  rationale: Das griechische καί kann hier den anschließenden Verheißungssatz mit einer folgernden Nuance verbinden. „Dann“ macht diesen Zusammenhang idiomatisch deutlich, ohne Gottes Gegenwart als verdienten Lohn darzustellen.
- issue: Bedeutung von καταρτίζεσθε
  choice: lasst euch zurechtbringen
  alternative: werdet vollkommen
  rationale: Die gewählte Fassung bewahrt den Gedanken der Wiederherstellung beziehungsweise Ordnung und vermeidet, eine Lehre von bereits erreichter sündloser Vollkommenheit in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, parallel gebauten Aufforderungen. Die reflexiven Umschreibungen erhalten bei den mehrdeutigen Passiv-/Mediumformen die empfangende Komponente. Auf altertümliche Formen und konfessionell geprägte Fachsprache wurde verzichtet.
