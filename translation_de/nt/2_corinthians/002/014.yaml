id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: de
  text: Gott aber sei Dank! Er führt uns im Messias allezeit im Triumphzug mit[a] und macht durch uns an jedem Ort den Duft[b] der Erkenntnis Gottes offenbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er triumphiert im Messias allezeit über uns.«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »das Aroma«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Dank
  rationale: Die feste Wendung Τῷ δὲ θεῷ χάρις ist im Deutschen idiomatisch und doxologisch mit »Gott aber sei Dank« wiederzugeben.
- source_word: θριαμβεύοντι
  choice: führt … im Triumphzug mit
  rationale: Die Wiedergabe bewahrt das konkrete Bild eines Triumphzuges und behandelt ἡμᾶς als direktes Objekt. Die mögliche Bedeutung »über jemanden triumphieren« bleibt in einer Fußnote erhalten.
- source_word: ἐν τῷ Χριστῷ
  choice: im Messias
  rationale: Χριστός wird hier als Titel verstanden; ἐν bezeichnet die Beziehung beziehungsweise den Wirkungsbereich im Messias.
- source_word: ὀσμὴν
  choice: Duft
  rationale: »Duft« gibt die Geruchsmetapher in natürlichem Deutsch wieder; das ebenfalls mögliche »Aroma« wird als lexikalische Alternative vermerkt.
- source_word: γνώσεως αὐτοῦ
  choice: der Erkenntnis Gottes
  rationale: Das Pronomen bezieht sich auf Gott. Die Wiederaufnahme mit »Gottes« vermeidet im Deutschen einen missverständlichen Pronomenbezug und bewahrt den Sinn der Genitivverbindung.
- source_word: φανεροῦντι
  choice: macht … offenbar
  rationale: Die Formulierung gibt den kausativen Sinn von φανερόω wieder, ohne die Duftmetapher durch ein zusätzliches Verb wie »verbreiten« umzudeuten.
- source_word: δι’ ἡμῶν
  choice: durch uns
  rationale: διά mit dem Genitiv bezeichnet hier Mittel beziehungsweise Vermittlung.
- source_word: ἐν παντὶ τόπῳ
  choice: an jedem Ort
  rationale: Die Formulierung bleibt der griechischen Einzelangabe nahe und ist zugleich idiomatisches modernes Deutsch.
theological_decisions:
- issue: Bedeutung von θριαμβεύω mit ἡμᾶς als Objekt
  choice: Gott führt Paulus und seine Mitarbeiter im Messias in seinem Triumphzug mit.
  alternative: Gott triumphiert im Messias über Paulus und seine Mitarbeiter.
  rationale: Der Haupttext erhält das anschauliche Bild des Triumphzuges und den Zusammenhang mit der anschließenden Duftmetapher. Da das Verb bei einem persönlichen Objekt auch das Triumphieren über Besiegte bezeichnen kann, wird diese theologisch spannungsreiche Möglichkeit nicht ausgeschlossen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Dank wird als eigenständiger Ausruf formuliert, danach folgt zur besseren Verständlichkeit ein neuer Satz. Das Bild des römischen Triumphzuges und die Geruchsmetapher bleiben sichtbar; konfessionell geprägte Zusätze werden vermieden.
