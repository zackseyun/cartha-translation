  source_fidelity: '„Damit wir nicht von Satan übervorteilt werden“ gibt ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ treffend wieder: die Final-/Verhütungsrelation, das Passiv und das semantische Feld des Übervorteiltwerdens bleiben erhalten. „Denn seine Absichten sind uns nicht unbekannt“ entspricht οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν, ohne die Bedeutung von νοήματα unzulässig einzuengen.'
