id: 2CO.2.11
reference: 2 Corinthians 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: de
  text: damit wir nicht von Satan übervorteilt werden[a]; denn seine Absichten[b] sind uns nicht unbekannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgenutzt“ oder „überlistet werden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Pläne“, „Gedanken“ oder „Vorhaben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Gibt die Zweck- bzw. Verhütungsabsicht der griechischen Fügung natürlich wieder, ohne sie stärker auf Zweck oder Folge festzulegen.
- source_word: πλεονεκτηθῶμεν
  choice: übervorteilt werden
  rationale: Das Passiv bezeichnet, dass jemand sich auf Kosten eines anderen einen Vorteil verschafft. „Übervorteilt werden“ bewahrt sowohl den Gedanken der Ausnutzung als auch den des Überlistens.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Der Personenname wird entsprechend dem üblichen deutschen biblischen Sprachgebrauch transliteriert.
- source_word: γὰρ
  choice: denn
  rationale: Leitet die Begründung für die vorangehende Aussage knapp und idiomatisch ein.
- source_word: νοήματα
  choice: Absichten
  rationale: Das Wort kann Gedanken, Vorhaben oder Pläne bezeichnen. Im Zusammenhang sind strategische, feindliche Absichten gemeint; „Absichten“ wahrt jedoch mehr von der lexikalischen Breite als „Machenschaften“.
- source_word: οὐ … ἀγνοοῦμεν
  choice: sind uns nicht unbekannt
  rationale: Bewahrt die betonte Verneinung und den Bezug auf Wissen bzw. Unwissen in einer natürlichen deutschen Formulierung.
theological_decisions:
- issue: Personale Darstellung Satans
  choice: „von Satan“ als handelnder Urheber des Übervorteilens
  alternative: unpersönliche Wiedergabe als bloße böse Macht
  rationale: Der griechische Text nennt Satan mit Artikel und Eigenname als Urheber; die Übersetzung wahrt diese grammatische personale Darstellung, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang; das Semikolon macht die begründende Beziehung deutlich. Die doppelte Verneinung in „nicht unbekannt“ wurde bewusst erhalten.
