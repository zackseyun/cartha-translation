id: 2CO.2.16
reference: 2 Corinthians 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: de
  text: Für die einen ein Geruch vom Tod zum Tod, für die anderen ein Geruch vom Leben zum Leben.[a] Und wer ist diesen Dingen gewachsen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendungen „vom Tod zum Tod“ und „vom Leben zum Leben“ können Ursprung und Ergebnis ausdrücken („aus dem Tod und zum Tod führend“ / „aus dem Leben und zum Leben führend“) oder eine verstärkende Charakterisierung sein.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Und wer ist dafür geeignet?“ beziehungsweise „ausreichend?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: Geruch
  rationale: „Geruch“ ist im modernen Deutschen natürlich und hinsichtlich der Wirkung offen. Anders als „Duft“ legt es nicht von vornherein einen angenehmen Geruch nahe und passt daher zu beiden Seiten des Gegensatzes.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: vom Tod zum Tod
  rationale: Die knappe, parallele Formulierung bewahrt sowohl die mögliche Bewegung von Ursprung zu Ergebnis als auch eine verstärkende Charakterisierung, ohne sie festzulegen.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: vom Leben zum Leben
  rationale: Die spiegelbildliche Wiedergabe erhält den bewussten Parallelismus des Griechischen und lässt die genaue Beziehung zwischen Ausgangspunkt und Ergebnis offen.
- source_word: πρὸς ταῦτα
  choice: diesen Dingen
  rationale: In Verbindung mit „gewachsen sein“ gibt „diesen Dingen“ den Plural ταῦτα idiomatisch wieder und bezieht die Frage auf die zuvor beschriebenen gewichtigen Zusammenhänge.
- source_word: ἱκανός
  choice: gewachsen
  rationale: Die feste Wendung „einer Sache gewachsen sein“ drückt natürliche und würdige Weise aus, ob jemand dafür hinreichend, geeignet oder befähigt ist.
theological_decisions:
- issue: Bedeutung der Wendungen „vom Tod zum Tod“ und „vom Leben zum Leben“
  choice: Die griechische Mehrdeutigkeit bleibt im Haupttext erhalten.
  alternative: „aus dem Tod und zum Tod führend“ beziehungsweise „aus dem Leben und zum Leben führend“ oder eine verstärkende Charakterisierung als todbringend beziehungsweise lebenspendend
  rationale: Der griechische Wortlaut entscheidet nicht eindeutig zwischen Ursprung und Ergebnis, Wirkung auf die Hörenden oder einer intensivierenden Beschreibung. Die knappe Wiedergabe wahrt diese Spannung.
- issue: Art der Hinlänglichkeit in der Schlussfrage
  choice: „wer ist diesen Dingen gewachsen?“
  alternative: „wer ist dafür geeignet/ausreichend?“
  rationale: Die Frage wird nicht ausdrücklich auf menschliche Eigenfähigkeit oder göttliche Befähigung festgelegt; die deutsche Formulierung erhält den rhetorischen und offenen Charakter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Geruch“ wahrt die neutrale Sinnesmetapher und vermeidet die positive Vorprägung von „Duft“. Der Parallelismus und die komprimierte Ausdrucksweise des griechischen Textes bleiben erhalten.
