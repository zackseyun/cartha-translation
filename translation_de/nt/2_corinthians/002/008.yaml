  text: διὸ παρακαλῶ ὑμᾶς κυρῶσαι εἰς αὐτὸν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/008.yaml
  text: Therefore I urge you to confirm your love for him.
translation:
  language: de
  text: Darum bitte ich euch, eure Liebe zu ihm zu bekräftigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: παρακαλῶ ὑμᾶς
  choice: bitte ich euch
  rationale: Im Kontext bezeichnet παρακαλέω eine eindringliche Bitte oder Aufforderung; »bitte« wahrt den persönlichen, nicht befehlenden Ton.
- source_word: κυρῶσαι
  choice: Bekräftigt
  rationale: Das Verb bedeutet hier, etwas verbindlich zu bestätigen bzw. wirksam zu bekräftigen. Der Imperativ nach »ich bitte euch« bildet die griechische Infinitivkonstruktion idiomatisch ab.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: ihm gegenüber eure Liebe
  rationale: »Ihm gegenüber« gibt die Zielrichtung von εἰς αὐτόν wieder; das im Deutschen nötige »eure« erschließt sich aus dem angesprochenen Plural, ohne den Sinn einzuengen.
theological_decisions:
- issue: Art und Gegenstand der Bestätigung
  choice: »Bekräftigt ihm gegenüber eure Liebe«
  alternative: »Bestätigt eure Liebe zu ihm«
  rationale: Die gewählte Fassung bewahrt den Gedanken einer erkennbaren, gemeinschaftlich vollzogenen Bekräftigung, ohne festzulegen, durch welche konkrete Handlung sie erfolgen muss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die im Griechischen durch den Infinitiv ausgedrückte Aufforderung transparent; keine Fußnote erforderlich.
