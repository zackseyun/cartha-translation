lexical_decisions:
- source_word: τοὐναντίον
  choice: im Gegenteil
  rationale: Kennzeichnet klar die Umkehr gegenüber dem zuvor erwartbaren Vorgehen und entspricht dem Kontrast des griechischen Ausdrucks.
- source_word: μᾶλλον
  choice: vielmehr
  rationale: Bewahrt die vergleichende, korrigierende Kraft und verbindet sich im Deutschen natürlich mit „im Gegenteil“.
- source_word: χαρίσασθαι
  choice: vergeben
  rationale: Im Zusammenhang mit Gemeindezucht und Wiederherstellung bezeichnet das Verb am ehesten das Gewähren von Vergebung; sein Gnadencharakter wird in der Fußnote kenntlich gemacht.
- source_word: παρακαλέσαι
  choice: trösten
  rationale: Die drohende übermäßige Trauer legt hier die Bedeutung „trösten“ nahe, ohne die weitere Bedeutung „ermutigen“ grundsätzlich auszuschließen.
- source_word: καταποθῇ
  choice: verschlungen wird
  rationale: Gibt die anschauliche Metapher des griechischen Verbs direkt und zugleich verständlich wieder.
- source_word: ὁ τοιοῦτος
  choice: ein solcher Mensch
  rationale: Bewahrt die unbestimmte, rückverweisende Ausdrucksweise, ohne Geschlecht oder Identität über den griechischen Text hinaus festzulegen.
- source_word: περισσοτέρᾳ λύπῃ
  choice: übermäßiger Trauer
  rationale: Drückt die im Kontext schädlich überhandnehmende Trauer in natürlichem modernen Deutsch aus; die formal mögliche Vergleichsbedeutung bleibt als Nuance bestehen.
