  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: de
  text: Denn wir sind für Gott der Duft des Messias unter denen, die gerettet werden, und unter denen, die zugrunde gehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert die vorausgehende Aussage; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Der Genitiv bezeichnet den Duft als dem Messias zugehörig oder von ihm geprägt. „Messias“ bewahrt hier den Titelcharakter von Χριστός.
- source_word: εὐωδία
  choice: Duft
  rationale: „Duft“ erhält das Geruchsbild in klarem, idiomatischem Deutsch, ohne die nicht ausdrücklich enthaltene Wertung „Wohlgeruch“ hinzuzufügen.
- source_word: τῷ θεῷ
  choice: für Gott
  rationale: Der Dativ bezeichnet Gott als denjenigen, für den bzw. in dessen Wahrnehmung dieser Duft besteht. „Für Gott“ ist im Deutschen natürlicher als das missverständliche „Gott gegenüber“.
- source_word: ἐν τοῖς σῳζομένοις
  choice: unter denen, die gerettet werden
  rationale: „Unter“ gibt ἐν bei einer Personengruppe idiomatisch wieder; das Präsenspartizip wird prozessual und ohne Festlegung auf einen menschlichen oder göttlichen Handlungsträger wiedergegeben.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: unter denen, die zugrunde gehen
  rationale: Die Formulierung bewahrt den fortdauernden bzw. sich vollziehenden Charakter des Präsenspartizips. „Zugrunde gehen“ lässt die im Verb liegende Spannung zwischen Verderben und Untergang bestehen, ohne unnötig „vernichtet werden“ festzulegen.
theological_decisions:
- issue: Prozessualer Aspekt von σῳζομένοις und ἀπολλυμένοις
  choice: „die gerettet werden“ und „die zugrunde gehen“
  alternative: „die Geretteten“ und „die Verlorenen“
  rationale: Die substantivierten Präsenspartizipien werden nicht zu statischen Gruppenbezeichnungen verflacht, sondern als gegenwärtige Vorgänge bzw. Wege wiedergegeben.
- issue: Bedeutung des Genitivs Χριστοῦ
  choice: „der Duft des Messias“
  alternative: „der Duft von Christus“ oder „messianischer Duft“
  rationale: Der einfache deutsche Genitiv bewahrt die mögliche Zugehörigkeits- und Herkunftsbeziehung, ohne sie enger zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Präposition „unter“ spiegelt die Parallelität der beiden griechischen ἐν-Phrasen und hält beide Gruppen ausdrücklich im selben Bezug zum Duft.
