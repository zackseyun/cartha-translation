  source_fidelity: 'Die Übersetzung gibt die korrelative Struktur von ᾧ … κἀγώ sowie das offene τι treffend wieder: „Wem ihr aber etwas vergebt, dem vergebe auch ich.“ Die Wiederholung von κεχάρισμαι wird korrekt als bereits vollzogene Vergebung wiedergegeben. Die eingeschobene, vorsichtige Bedingung εἴ τι bleibt durch „wenn ich überhaupt etwas vergeben habe“ erhalten. „Um euretwillen“ entspricht δι’ ὑμᾶς im Sinn des auf die Korinther bezogenen Beweggrunds bzw. Nutzens. „In der Gegenwart des Messias“ ist eine gut vertretbare Wiedergabe von ἐν προσώπῳ Χριστοῦ; die Fußnote wahrt die relevante alternative personale beziehungsweise repräsentative Deutung.'
