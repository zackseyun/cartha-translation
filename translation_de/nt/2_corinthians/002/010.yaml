id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: de
  text: Wem ihr aber etwas vergebt, dem vergebe auch ich. Denn was ich vergeben habe – wenn ich überhaupt etwas vergeben habe –, das habe ich um euretwillen in der Gegenwart des Messias vergeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Person des Messias“.'
    reason: Lexikalische Alternative für ἐν προσώπῳ Χριστοῦ; πρόσωπον kann sowohl Gegenwart/Angesicht als auch Person bezeichnen.
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: vergebt / vergeben habe
  rationale: Das Verb kann allgemein „gnädig schenken“ oder „Gunst erweisen“ bedeuten; im Zusammenhang von Zurechtweisung und Wiederherstellung bezeichnet es jedoch das Erlassen einer Verfehlung. „Vergeben“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: ᾧ … τι
  choice: Wem … etwas
  rationale: Das Dativ-Relativpronomen bezeichnet die Person, der vergeben wird; das Indefinitpronomen lässt den Gegenstand der Vergebung offen. Die deutsche Korrelativkonstruktion „Wem …, dem …“ bildet den Zusammenhang klar ab.
- source_word: κἀγώ
  choice: dem vergebe auch ich
  rationale: Die zusammengezogene Form bedeutet „auch ich“. Im Deutschen nimmt „dem vergebe auch ich“ die vorausgehende Handlung knapp und idiomatisch auf.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: was ich vergeben habe – wenn ich überhaupt etwas vergeben habe –
  rationale: Die Formulierung bewahrt den eingeschobenen, zurückhaltend-bedingten Charakter der griechischen Aussage. „Überhaupt“ macht die idiomatische Kraft von εἴ τι deutlich, ohne die Bedingung aufzulösen.
- source_word: δι’ ὑμᾶς
  choice: um euretwillen
  rationale: διά mit Akkusativ bezeichnet hier den auf die Korinther gerichteten Beweggrund beziehungsweise Nutzen. „Um euretwillen“ ist präzise, würdig und pastoral angemessen.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: in der Gegenwart des Messias
  rationale: πρόσωπον kann „Angesicht“, „Gegenwart“ oder „Person“ bezeichnen. „In der Gegenwart“ drückt am natürlichsten aus, dass Paulus vor dem Messias und unter dessen Blick handelt; die mögliche Bedeutung „in der Person“ bleibt in der Fußnote erhalten.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός wird hier als christologischer Titel verstanden. „Messias“ macht den Titelgehalt im Deutschen sichtbar, statt ihn wie einen Eigennamen erscheinen zu lassen.
theological_decisions:
- issue: Ob Χριστοῦ als Titel übersetzt oder in der traditionellen, namensähnlichen Form „Christus“ wiedergegeben werden soll.
  choice: des Messias
  alternative: Christi / von Christus
  rationale: In diesem Zusammenhang spricht nichts dafür, den Titelgehalt zurücktreten zu lassen. „Messias“ bewahrt die Bedeutung des griechischen Titels, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Ob ἐν προσώπῳ Χριστοῦ Gegenwart oder stellvertretendes Handeln bezeichnet.
  choice: in der Gegenwart des Messias
  alternative: in der Person des Messias
  rationale: Der Ausdruck ist semantisch mehrdeutig. Die Hauptfassung gibt die naheliegende Vorstellung des Handelns vor dem Angesicht des Messias wieder; die mögliche stellvertretende beziehungsweise personale Lesart wird nicht ausgeschlossen, sondern ausdrücklich angemerkt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die korrelative Form „Wem …, dem …“ und der Gedankenstrich bewahren die Struktur und die zurückhaltende Parenthese des griechischen Satzes. „Um euretwillen“ ist leicht gehoben, aber weiterhin allgemein verständlich.
