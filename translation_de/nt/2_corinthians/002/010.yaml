  terminology: „Vergeben“ trifft χαρίζομαι in diesem Kontext zuverlässig. „Messias“ gibt den Titelcharakter von Χριστός entsprechend der vorgegebenen Projektentscheidung wieder. Die Fußnote zu „in der Person des Messias“ ist sachlich, knapp und an der richtigen Stelle verankert; sie bewahrt die Mehrdeutigkeit von ἐν προσώπῳ, ohne eine Deutung als allein maßgeblich auszugeben.
