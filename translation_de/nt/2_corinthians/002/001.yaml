base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: de
  text: Denn ich habe für mich selbst beschlossen, nicht wieder in Traurigkeit[a] zu euch zu kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Traurigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: hatte … beschlossen
  rationale: Das Verb bezeichnet hier eine wohlüberlegte, feste persönliche Entscheidung. Das Plusquamperfekt stellt im Deutschen natürlich heraus, dass Paulus diesen Entschluss bereits vor seinem Schreiben gefasst hatte.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert den vorausgehenden Gedankengang.
- source_word: ἐμαυτῷ
  choice: für mich
  rationale: Der reflexive Dativ betont, dass Paulus die Entscheidung persönlich und nach eigener Überlegung traf.
- source_word: τοῦτο, τὸ μὴ … ἐλθεῖν
  choice: beschlossen, nicht … zu kommen
  rationale: Der artikulierte Infinitiv gibt den Inhalt des Entschlusses an. Im Deutschen ist die direkte Infinitivkonstruktion natürlicher als eine wörtliche Wiedergabe von τοῦτο.
- source_word: πάλιν
  choice: wieder
  rationale: Das Wort kennzeichnet eine Wiederholung und wird idiomatisch mit „wieder“ wiedergegeben.
- source_word: ἐν λύπῃ
  choice: in Traurigkeit
  rationale: Die Formulierung bewahrt die präpositionale Gestalt und lässt offen, ob vor allem der traurige Zustand des Paulus, das Verursachen von Traurigkeit oder die von Traurigkeit geprägte Begegnung gemeint ist.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: Bei einem Verb des Kommens bezeichnet πρός mit Akkusativ die Bewegung hin zu Personen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich offene Wendung „in Traurigkeit“ wurde beibehalten, damit die im Griechischen vorhandene Mehrdeutigkeit nicht vorschnell auf Paulus’ eigenen Gemütszustand oder auf die Wirkung seines Besuchs eingeengt wird.
