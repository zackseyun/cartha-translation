  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: de
  text: Wenn aber jemand Kummer verursacht hat, hat er nicht mich betrübt, sondern zumindest teilweise euch alle – damit ich nicht euch alle belaste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »… sondern euch alle, wenn auch nur teilweise – um nicht zu übertreiben.« Die Stellung von »zumindest teilweise« und die rhetorische Nuance von »belaste« sind im Griechischen nicht ganz eindeutig.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: Kummer verursacht hat / betrübt
  rationale: Das Perfekt bezeichnet eine geschehene Handlung mit fortwirkender Bedeutung. Die beiden deutschen Ausdrücke geben das Wortfeld von λυπέω natürlich wieder, auch wenn die formale Wortwiederholung nicht vollständig erhalten bleibt.
- source_word: οὐκ ἐμὲ
  choice: nicht mich
  rationale: Die knappe Wiedergabe erhält den ausdrücklichen Gegensatz, ohne ein nicht im Text stehendes »persönlich« hinzuzufügen.
- source_word: ἀπὸ μέρους
  choice: bis zu einem gewissen Grad
  rationale: Die adverbiale Wendung qualifiziert wahrscheinlich, in welchem Maß die ganze Gemeinde betroffen ist. Die Satzstellung bleibt jedoch mehrdeutig; darauf weist die Fußnote hin.
- source_word: ἵνα μὴ ἐπιβαρῶ
  choice: damit ich es nicht zu schwer ausdrücke
  rationale: 'ἐπιβαρέω bedeutet wörtlich »belasten«. Im Zusammenhang lässt sich die Wendung als rhetorische Abschwächung verstehen: Paulus will seine Aussage über die Betroffenheit aller nicht übermäßig stark formulieren.'
- source_word: πάντας ὑμᾶς
  choice: euch alle
  rationale: Die Wiedergabe bewahrt den umfassenden Bezug auf die ganze Gemeinde.
theological_decisions:
- issue: Bezug von ἀπὸ μέρους und Sinn von ἵνα μὴ ἐπιβαρῶ
  choice: Die Hauptfassung versteht ἀπὸ μέρους als Einschränkung der Betroffenheit der ganzen Gemeinde und ἐπιβαρῶ als rhetorisches »zu schwer ausdrücken«.
  alternative: 'Möglich ist auch: »sondern zum Teil – damit ich euch nicht alle belaste«; dabei kann ἀπὸ μέρους die Betroffenen eingrenzen und ἐπιβαρῶ das Belasten der Gemeinde bezeichnen.'
  rationale: Die griechische Wortstellung und der semantische Umfang von ἐπιβαρέω lassen mehrere Verknüpfungen zu. Die Übersetzung entscheidet vorsichtig für eine gut verständliche Lesart, während die Fußnote die echte syntaktisch-lexikalische Mehrdeutigkeit bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche bilden die vorsichtige Einschränkung des griechischen Satzes ab; die Fußnote legt die schwer auflösbare Syntax offen, ohne eine konfessionelle Deutung einzutragen.
