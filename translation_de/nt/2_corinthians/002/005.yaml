  naturalness: Die verschachtelte Gedankenstrich-Klammer der vorliegenden Fassung ist im Deutschen schwer nachvollziehbar. Eine knappe Abfolge mit »zumindest teilweise« und »euch alle belaste« ist modern, verständlich und wahrt zugleich die gedrängte Syntax.
  terminology: »Kummer verursacht« / »betrübt« ist angemessen und erhält die lexikalische Verbindung nur teilweise, aber natürlich. »Belaste« ist für ἐπιβαρῶ die naheliegende deutsche Entsprechung. »Euch alle« bewahrt πάντας ὑμᾶς.
