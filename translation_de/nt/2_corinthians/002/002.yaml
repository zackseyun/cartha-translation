  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: de
  text: Denn wenn ich euch traurig mache, wer macht mich dann froh, wenn nicht der, der durch mich traurig wird[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn nicht der, der meinetwegen traurig ist“. Das griechische ἐξ ἐμοῦ kann die Quelle oder Ursache bezeichnen: „durch mich“ oder „meinetwegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: traurig mache
  rationale: Die Wendung gibt die verursachende Bedeutung des Verbs in natürlichem, modernem Deutsch wieder und bleibt im Kontrast zum anschließenden Passiv transparent.
- source_word: εὐφραίνων
  choice: froh machen
  rationale: Die Infinitivwendung gibt das substantivierte Partizip idiomatisch wieder und bewahrt den Gegensatz zwischen Traurigkeit und Freude.
- source_word: τίς ὁ εὐφραίνων με
  choice: wer soll mich dann froh machen
  rationale: Die rhetorische Frage wird in natürlichem Deutsch ausgedrückt; „dann“ verdeutlicht die Folgerelation, ohne den Sinn festzulegen.
- source_word: ὁ λυπούμενος
  choice: der … traurig wird
  rationale: Das substantivierte Präsenspartizip im Passiv wird als gegenwärtig Betroffener wiedergegeben, ohne es unnötig in ein Perfekt umzudeuten.
- source_word: ἐξ ἐμοῦ
  choice: durch mich
  rationale: Die Formulierung wahrt die mögliche Bedeutung von Quelle beziehungsweise Ursache und klingt hier natürlicher als das wörtliche „aus mir“.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ markiert den erklärenden Anschluss an den vorhergehenden Gedankengang angemessen.
theological_decisions:
- issue: Beziehung zwischen Paulus als Ursache der Traurigkeit und der Person, die ihn erfreut
  choice: Die passive, gegenwartsbezogene Formulierung „der durch mich traurig wird“ bleibt erhalten.
  alternative: „den ich traurig gemacht habe“
  rationale: Das Griechische bezeichnet die betroffene Person mit einem passiven Präsenspartizip und nennt Paulus mit ἐξ ἐμοῦ als Quelle oder Ursache. Die Übersetzung sollte diese Spannung nicht durch eine eindeutige Vergangenheitsform auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „traurig machen/werden“ bildet den griechischen Wortstamm λυπ- erkennbar ab; „froh machen“ hält den rhetorischen Gegensatz klar.
