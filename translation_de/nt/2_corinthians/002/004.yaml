source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: de
  text: Denn aus großer Bedrängnis und Herzensangst heraus schrieb ich euch unter vielen Tränen – nicht damit ihr betrübt werdet, sondern damit ihr die Liebe erkennt, die ich in besonderem Maß zu euch habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Liebe, die ich in noch reicherem Maß zu euch habe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: aus großer Bedrängnis heraus
  rationale: ἐκ bezeichnet den inneren Ausgangspunkt des Schreibens; die Formulierung wahrt diesen Ursprungssinn und gibt die Schwere von θλῖψις wieder, ohne sie auf äußere Verfolgung einzuengen.
- source_word: συνοχῆς καρδίας
  choice: Herzensangst
  rationale: Die Wendung beschreibt eine innere Bedrängnis oder Beklemmung; „Herzensangst“ ist gegenwärtig, verständlich und emotional gewichtig.
- source_word: ἔγραψα
  choice: schrieb ich
  rationale: Der einfache Vergangenheitsbezug genügt; ein Hinweis auf einen bestimmten früheren Brief wird nicht in das Verb hineingetragen.
- source_word: διὰ πολλῶν δακρύων
  choice: unter vielen Tränen
  rationale: Dies ist eine natürliche deutsche Wiedergabe der begleitenden Umstände und bewahrt das Bild des tränenreichen Schreibens.
- source_word: λυπηθῆτε
  choice: ihr betrübt werdet
  rationale: Die passive Bedeutung und der Gedanke verursachter Trauer bleiben erhalten.
- source_word: γνῶτε
  choice: ihr erkennt
  rationale: „Erkennt“ kann sowohl das Wahrnehmen als auch das tiefere Begreifen der bereits vorhandenen Liebe ausdrücken.
- source_word: τὴν ἀγάπην
  choice: meine Liebe
  rationale: Die Umformung mit dem Possessivpronomen entspricht dem folgenden ἣν ἔχω und ergibt natürliches Deutsch.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: wie überaus groß meine Liebe zu euch ist
  rationale: Die Formulierung gibt die verstärkende Kraft von περισσοτέρως gut lesbar wieder, ohne zwingend einen Vergleich mit anderen Personen festzuschreiben.
theological_decisions:
- issue: Bezugsrichtung und Vergleichskraft von περισσοτέρως εἰς ὑμᾶς
  choice: wie überaus groß meine Liebe zu euch ist
  alternative: wie sehr ich gerade euch liebe
  rationale: περισσοτέρως kann die außergewöhnliche Intensität der Liebe oder eine besondere Ausrichtung auf die Korinther hervorheben. Der Haupttext betont die Intensität; die Fußnote bewahrt die mögliche kontrastive Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aus … heraus“ erhält den Ursprungssinn von ἐκ, während „unter vielen Tränen“ idiomatisch bleibt. Der Gedankenstrich macht den Gegensatz der beiden ἵνα-Sätze klar, ohne die Satzstruktur unnötig zu glätten.
