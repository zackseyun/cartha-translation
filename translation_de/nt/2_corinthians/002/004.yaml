  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und gut lesbar. „Unter vielen Tränen“ und „ihr betrübt werdet“ sind idiomatisch und angemessen. Die revidierte Formulierung bleibt ebenso natürlich.
