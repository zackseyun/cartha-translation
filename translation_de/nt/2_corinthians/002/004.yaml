  to: Denn aus großer Bedrängnis und Herzensangst heraus schrieb ich euch unter vielen Tränen – nicht damit ihr betrübt werdet, sondern damit ihr die Liebe erkennt, die ich in besonderem Maß zu euch habe.[a]
