source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: de
  text: Und genau dies schrieb ich euch, damit ich bei meinem Kommen nicht gerade durch diejenigen Kummer habe, an denen ich mich freuen sollte.[a] Dabei war ich hinsichtlich euch allen überzeugt, dass meine Freude die Freude von euch allen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von denen, von denen ich mich freuen sollte“. Die Wendung kann die Betreffenden als Anlass oder Quelle der erwarteten Freude bezeichnen.'
    reason: Die griechische Präposition ἀπό lässt die Beziehung der Personen zur Freude knapp; die Fußnote dokumentiert die nähere Formulierung, ohne die Bedeutung einseitig auf ein Verursachen festzulegen.
lexical_decisions:
- source_word: ἔγραψα
  choice: schrieb ich
  rationale: Der Aorist verweist im Zusammenhang am ehesten auf ein früheres Schreiben des Paulus und wird daher als schlichtes Präteritum wiedergegeben.
- source_word: τοῦτο αὐτό
  choice: genau dies
  rationale: Die betonte Wendung wird natürlich und zugleich nachdrücklich wiedergegeben.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: damit ich bei meinem Kommen nicht … betrübt würde
  rationale: Die Zweckkonstruktion bleibt erhalten; die idiomatische deutsche Verbform gibt λύπην σχῶ als erfahrenes Betrübtsein wieder.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: von denen …, über die ich mich freuen sollte
  rationale: Die Personen sind Quelle sowohl möglicher Betrübnis als auch der erwarteten Freude. Die Formulierung bleibt nahe am Griechischen, ohne ein ausdrückliches Verursachen der Freude einzutragen.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: Dabei vertraute ich euch allen
  rationale: Das Perfektpartizip bezeichnet eine bestehende Zuversicht. „Dabei“ bewahrt den begleitenden, semantisch offenen Anschluss besser als eine ausdrücklich kausale Wiedergabe.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: meine Freude die Freude von euch allen ist
  rationale: Die parallele Struktur des Griechischen wird bewahrt und die Aussage gemeinsamer Freude nicht enger als nötig gedeutet.
theological_decisions:
- issue: Beziehung des Partizips πεποιθώς zum Hauptsatz
  choice: begleitend mit „Dabei“
  alternative: 'kausal: „weil ich euch allen vertraute“'
  rationale: Das Griechische lässt den genauen logischen Bezug des Partizips offen. Die Übersetzung vermeidet daher, eine stärkere Kausalität festzulegen.
- issue: Sinn von πάντων ὑμῶν in der Schlussaussage
  choice: „die Freude von euch allen“
  alternative: „von euch allen geteilt wird“ oder „euch allen gehört“
  rationale: Der Genitiv kann eine gemeinsam geteilte beziehungsweise allen zugehörige Freude ausdrücken. Die formal offene Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bei meinem Kommen“ ist flüssiger als eine starre Nachbildung des griechischen Partizips; „Dabei“ wahrt die syntaktische Offenheit von πεποιθώς.
