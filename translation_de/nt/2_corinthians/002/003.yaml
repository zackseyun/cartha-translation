revisions:
- from: Und genau dies schrieb ich euch, damit ich bei meinem Kommen nicht von denen betrübt würde, über die ich mich freuen sollte.[a] Dabei vertraute ich euch allen, dass meine Freude die Freude von euch allen ist.
  to: Und genau dies schrieb ich euch, damit ich bei meinem Kommen nicht gerade durch diejenigen Kummer habe, an denen ich mich freuen sollte.[a] Dabei war ich hinsichtlich euch allen überzeugt, dass meine Freude die Freude von euch allen ist.
  rationale: Die Revision korrigiert die passive Bedeutungsverschiebung bei λύπην σχῶ und glättet die Fußnote. Die begleitende Verbindung des Perfektpartizips πεποιθὼς bleibt mit „Dabei“ offen. Die Schlussaussage wird weder als bloßes Zugehören noch als ausdrücklich kausal erzeugte oder ausschließlich geteilte Freude interpretiert.
  reviewer_model: gpt-5.6-terra
