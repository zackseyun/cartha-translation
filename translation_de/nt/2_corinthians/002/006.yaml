  text: Für einen solchen Mann genügt diese Strafe, die von der Mehrheit verhängt wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für einen solchen Mann genügt diese Maßregelung durch die meisten.“'
