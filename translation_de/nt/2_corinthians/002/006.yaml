lexical_decisions:
- source_word: ἱκανὸν
  choice: genügt
  rationale: Als prädikative Aussage gibt das Verb natürlich und präzise wieder, dass die Maßnahme ihr ausreichendes Maß erreicht hat.
- source_word: τῷ τοιούτῳ
  choice: für einen solchen Mann
  rationale: Die Wendung bezeichnet im Zusammenhang einen bestimmten männlichen Betroffenen. Die Formulierung ist im modernen Deutsch verständlich und wahrt den Bezug des maskulinen Singulars.
- source_word: ἐπιτιμία
  choice: Strafe
  rationale: Das Wort bezeichnet hier eine gemeinschaftlich auferlegte Sanktion. „Strafe“ macht den konkreten disziplinarischen Charakter deutlich, ohne die Maßnahme auf einen bloß mündlichen Tadel zu beschränken.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: die von der Mehrheit verhängt wurde
  rationale: „Von der Mehrheit“ bildet den Sinn von τῶν πλειόνων idiomatisch ab. „Verhängt wurde“ verdeutlicht im Deutschen die Beziehung zur Strafe, die im Griechischen durch die Präpositionalphrase ausgedrückt wird.
