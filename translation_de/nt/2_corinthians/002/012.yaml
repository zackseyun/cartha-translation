  terminology: „Evangelium“, „Messias“, „Tür“ und „im Herrn“ wahren Register, Bildsprache und paulinische Terminologie. „Messias“ gibt Χριστός transparent als Titel wieder, ohne den Genitiv näher auf „über“, „von“ oder „zugehörig zu“ festzulegen.
