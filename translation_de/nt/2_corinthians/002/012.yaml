  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: de
  text: Als ich aber nach Troas kam, für das Evangelium des Messias[a], und mir im Herrn eine Tür geöffnet worden war[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Christus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und mir im Herrn eine Tür offen stand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Als ich aber … kam
  rationale: Das Aoristpartizip wird im Zusammenhang temporal wiedergegeben. δέ markiert einen leichten Übergang; „aber“ hält diesen Anschluss sichtbar, ohne einen starken Gegensatz zu erzwingen.
- source_word: εἰς τὴν Τρῳάδα
  choice: nach Troas
  rationale: Natürliche deutsche Richtungsangabe bei einem Ortsnamen.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: um das Evangelium von Christus zu verkünden
  rationale: Das zweite εἰς bezeichnet hier den Zweck von Paulus’ Kommen. Im Deutschen benötigt die Konstruktion eine sinngemäße verbale Ergänzung; „zu verkünden“ macht den im Kontext vorausgesetzten Dienst am Evangelium verständlich. „von Christus“ bewahrt die mögliche Zugehörigkeits- und Inhaltsbeziehung des Genitivs besser als eine einseitige Festlegung.
- source_word: θύρας
  choice: eine Tür
  rationale: Das Bildwort wird beibehalten, statt es unmittelbar als „Gelegenheit“ auszulegen.
- source_word: ἀνεῳγμένης
  choice: geöffnet worden war
  rationale: Die passive Perfektform bezeichnet eine zuvor erfolgte Öffnung mit fortbestehendem Ergebnis.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die charakteristische paulinische Wendung bleibt erhalten; eine instrumentale Festlegung auf „durch den Herrn“ wird vermieden.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: Christus
  alternative: Messias
  rationale: Im modernen deutschen Sprachgebrauch ist „Christus“ hier die natürliche titularische Bezeichnung und entspricht der etablierten Form in der Wortgruppe „Evangelium von Christus“. Die Fußnote macht die transparente Bedeutungsalternative „Messias“ sichtbar.
- issue: Bezug von ἐν κυρίῳ
  choice: im Herrn
  alternative: durch den Herrn
  rationale: „Im Herrn“ bewahrt die syntaktische und theologische Offenheit der Präpositionalphrase; „durch den Herrn“ würde die Formulierung eindeutig instrumental deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als fortlaufender, in Vers 13 weitergeführter Satz bewusst mit Komma abgeschlossen. Die Türmetapher und die Wendung „im Herrn“ werden nicht erklärend aufgelöst.
