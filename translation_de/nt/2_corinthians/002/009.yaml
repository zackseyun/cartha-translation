  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: de
  text: Denn dazu habe ich auch geschrieben, um zu erkennen, wie ihr euch bewährt[a] – ob ihr in allem gehorsam seid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie erprobt ihr seid“; das Wort kann auch die Prüfung beziehungsweise deren erwiesenes Ergebnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: Denn gerade deshalb habe ich auch geschrieben
  rationale: „Gerade deshalb“ gibt εἰς τοῦτο idiomatisch und zweckbezogen wieder; „auch“ bewahrt die additive Kraft von καί. Das deutsche Perfekt ist in gegenwärtiger Standardsprache die natürliche Erzählform für den vergangenen Schreibakt.
- source_word: ἵνα γνῶ
  choice: Ich wollte erkennen
  rationale: Die Formulierung wahrt den Zweck des Schreibens und den Gedanken, durch ihr Verhalten zu einer Erkenntnis zu gelangen, ohne im Deutschen schwerfällig zu wirken.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: wie ihr euch bewährt
  rationale: δοκιμή kann sowohl die Erprobung als auch die dadurch erwiesene Bewährung bezeichnen. Die verbale Fassung ist natürliches Deutsch und lässt den Zusammenhang mit der folgenden Frage nach ihrem Gehorsam deutlich werden.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: ob ihr in allem gehorsam seid
  rationale: „Ob“ gibt die indirekte Frage nach γνῶ wieder; „in allem“ bewahrt den umfassenden Sinn von εἰς πάντα.
theological_decisions:
- issue: Bezug von δοκιμή auf Prüfung oder erwiesene Bewährung
  choice: Bewährung, mit Fußnote zur möglichen Bedeutung „Erprobtheit“ beziehungsweise „Prüfung“
  alternative: eure Erprobtheit / eure Prüfung
  rationale: Der Kontext des Gehorsams legt die im Verhalten sichtbar werdende Bewährung nahe, doch die lexikalische Spannung zwischen Vorgang und Ergebnis darf nicht vollständig aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt leitet den Zweck des Schreibens ein; der Gedankenstrich verbindet die Bewährung eng mit der erläuternden Frage nach umfassendem Gehorsam.
