  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: de
  text: Ich fand keine Ruhe in meinem Geist, weil ich meinen Bruder Titus[a] nicht antraf. Doch nachdem ich von ihnen Abschied genommen hatte, reiste ich nach Mazedonien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bruder“ bezeichnet Titus als Mitgläubigen.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: Ich fand keine Ruhe
  rationale: Die griechische Wendung bezeichnet im erzählenden Zusammenhang Paulus’ innere Unruhe. „Keine Ruhe finden“ ist im Deutschen natürlich und gibt den Sinn von ἄνεσις wieder, ohne ihn auf bloße Erleichterung zu verengen.
- source_word: τῷ πνεύματί μου
  choice: in meinem Geist
  rationale: Der Dativ kann den Bereich oder Bezug bezeichnen. „In meinem Geist“ bewahrt die innere, persönliche Dimension und legt nicht fest, ob stärker an Gemüt, Inneres oder Geist im theologischen Sinn zu denken ist.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: weil ich … Titus nicht antraf
  rationale: Der substantivierte Infinitiv mit μή nennt den Grund für die fehlende Ruhe. „Nicht antraf“ passt natürlich zu der Erwartung, Titus an einem bestimmten Ort zu finden, ohne ein Unvermögen hinzuzufügen.
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: meinen Bruder Titus
  rationale: Die deutsche Wortstellung ist idiomatisch und bewahrt die familiäre Bezeichnung für Titus als Mitchristen und Mitarbeiter.
- source_word: ἀλλὰ
  choice: Deshalb
  rationale: Das griechische ἀλλά stellt hier die tatsächliche Folge dem Ausbleiben der erhofften Begegnung gegenüber. Im Deutschen macht „Deshalb“ den im Zusammenhang erkennbaren Folgezusammenhang verständlich; die erzählerische Wendung bleibt erhalten.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: nahm ich Abschied von ihnen
  rationale: Die Wendung gibt das Partizip zeitlich und idiomatisch wieder. „Abschied nehmen“ ist modernes, würdevolles Deutsch.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: brach nach Mazedonien auf
  rationale: „Aufbrechen nach“ gibt die Abreise mit Zielangabe natürlich wieder und entspricht dem erzählerischen Aorist.
theological_decisions:
- issue: Bedeutung von πνεῦμα in „meinem Geist“
  choice: Die wörtlich-nahe Formulierung „in meinem Geist“ bleibt im Haupttext stehen.
  alternative: „innerlich“ oder „in meinem Inneren“
  rationale: Die Alternativen wären leichter verständlich, würden aber die mögliche anthropologische oder theologische Spannung des griechischen πνεῦμα einebnen.
- issue: Bezeichnung des Titus als Bruder
  choice: „mein Bruder“ wird als Beziehungsbezeichnung beibehalten und in einer Fußnote erläutert.
  alternative: „mein Glaubensbruder und Mitarbeiter“
  rationale: Eine ausdeutende Übersetzung würde „Mitarbeiter“ ausdrücklich in den Haupttext eintragen, obwohl dieses Wort im Vers nicht steht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung erhöht die Lesbarkeit; „Geist“ und „Bruder“ bewahren die Ausdrucksweise und Spannung des griechischen Textes.
