revisions:
- from: Ich fand keine Ruhe in meinem Geist, weil ich meinen Bruder Titus[a] nicht antraf. Deshalb nahm ich Abschied von ihnen[b] und brach nach Mazedonien auf.
  to: Ich fand keine Ruhe in meinem Geist, weil ich meinen Bruder Titus[a] nicht antraf. Doch nachdem ich von ihnen Abschied genommen hatte, reiste ich nach Mazedonien.
  rationale: Die Revision ersetzt die kausale Konjunktion durch einen adversativen Anschluss, der ἀλλά entspricht, und gibt das vorzeitige Partizip ἀποταξάμενος idiomatisch als „nachdem ich ... Abschied genommen hatte“ wieder. Die Fußnote erläutert „Bruder“ nahe am Wortlaut des Verses.
  reviewer_model: gpt-5.6-terra
