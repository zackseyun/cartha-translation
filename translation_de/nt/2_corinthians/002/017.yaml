  verdict: revise
  source_fidelity: Die Wiedergabe trifft den Sinn von καπηλεύοντες, ἐξ εἰλικρινείας, ἐκ θεοῦ, κατέναντι θεοῦ und ἐν Χριστῷ im Wesentlichen. Allerdings bleibt die zweimalige Vergleichs-/Charakterisierungsmarkierung ὡς im zweiten Satz in der vorliegenden Fassung unberücksichtigt. Das eingefügte „ja“ deutet zudem eine Steigerung an, die aus der Wiederholung von ἀλλά nicht zwingend folgt.
  naturalness: Der erste Satz ist klar und modernes Standarddeutsch. Im zweiten Satz ist „aus Lauterkeit, ja, von Gott her“ zwar verständlich, aber die Verknüpfung wirkt elliptisch und bildet die parallele griechische Konstruktion nur unvollständig ab. Eine Umstellung erlaubt eine natürliche deutsche Charakterisierung mit „als solche, die …“.
  terminology: „Das Wort Gottes“, „Lauterkeit“, „vor Gott“ und „im Messias“ sind angemessen. „Mit dem Wort Gottes Handel treiben“ bewahrt das Handelsbild und vermeidet eine einseitige Festlegung auf Verfälschung. Die Fußnote zu b erklärt die mögliche weitergehende Konnotation zutreffend.
