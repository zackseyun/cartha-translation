reference: 2 Corinthians 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: de
  text: Denn wir sind nicht wie die vielen[a], die mit dem Wort Gottes Handel treiben[b], sondern wir reden vor Gott[d] im Messias[e] als solche, die aus Lauterkeit[c] handeln, als solche, die von Gott her reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die meisten“ beziehungsweise „wie so viele andere“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann das gewinnorientierte Vermarkten und möglicherweise auch das Verfälschen einer Ware bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in Aufrichtigkeit“ beziehungsweise „aus aufrichtigen Beweggründen“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „in Gottes Gegenwart“ beziehungsweise „vor den Augen Gottes“.'
    reason: lexical_alternative
  - marker: e
    text: 'Traditionell: „in Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πολλοί
  choice: die vielen
  rationale: Die substantivierte Wendung wird bewusst nicht statistisch zu „die meisten“ zugespitzt. „Die vielen“ bewahrt den markanten Gegensatz zwischen Paulus und der angesprochenen Gruppe.
- source_word: καπηλεύοντες
  choice: die mit … Handel treiben
  rationale: Die Formulierung erhält das Bild des eigennützigen Händlers und den Vorwurf, Gottes Wort kommerziell auszunutzen, ohne die mögliche Nebenbedeutung des Verfälschens zum alleinigen Sinn zu machen.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Dies gibt die Genitivverbindung unmittelbar und in einer würdigen, im Deutschen vertrauten Form wieder.
- source_word: ἐξ εἰλικρινείας
  choice: aus Lauterkeit
  rationale: „Lauterkeit“ bezeichnet unverfälschte Aufrichtigkeit und bewahrt mit „aus“ den Herkunfts- beziehungsweise Beweggrundaspekt von ἐξ.
- source_word: ἐκ θεοῦ
  choice: von Gott her
  rationale: Die idiomatische deutsche Wendung bewahrt Gott als Ursprung des Redens, ohne das nicht ausdrücklich vorhandene „gesandt“ einzufügen.
- source_word: κατέναντι θεοῦ
  choice: vor Gott
  rationale: Die knappe Wendung vermittelt Reden in Gottes Gegenwart und unter seiner Beurteilung.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός wird hier als Titel des Gesalbten wiedergegeben. „Im Messias“ wahrt zugleich die prägnante paulinische ἐν-Formel, ohne sie erklärend aufzulösen.
- source_word: λαλοῦμεν
  choice: reden wir
  rationale: „Reden“ entspricht dem allgemeinen Verb λαλεῖν genauer als das stärker deutende „verkündigen“.
theological_decisions:
- issue: Bedeutung von ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus; in Gemeinschaft mit dem Messias
  rationale: Die knappe Form lässt die theologisch dichte Beziehungsaussage bewusst offen und deutet sie nicht ausschließlich als Gemeinschaft, Bevollmächtigung oder Zugehörigkeit. Der Titel Χριστός wird als „Messias“ übersetzt.
- issue: Ursprung und Aufrichtigkeit des apostolischen Redens
  choice: aus Lauterkeit, ja, von Gott her
  alternative: als aus Lauterkeit und als aus Gott; aufrichtig und von Gott gesandt
  rationale: Die Wiedergabe erhält beide Herkunftsangaben und ihre Steigerung, ohne aus ἐκ θεοῦ ausdrücklich eine Sendungsformel zu machen. Das zweimalige ὡς lässt sich im Deutschen an dieser Stelle nicht mechanisch wiederholen, ohne einen missverständlichen oder unnatürlichen Satz zu erzeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz bewahrt das Händlerbild, während der zweite die dichte griechische Abfolge in natürlichem Deutsch wiedergibt. „Ja“ markiert die erneute, steigernde Gegenüberstellung des zweiten ἀλλά, ohne eine sachliche Korrektur der ersten Herkunftsangabe anzudeuten.
