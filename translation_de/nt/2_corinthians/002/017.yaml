revisions:
- from: Denn wir sind nicht wie die vielen[a], die mit dem Wort Gottes Handel treiben[b]. Vielmehr reden wir aus Lauterkeit[c], ja, von Gott her, vor Gott[d] im Messias[e].
  to: Denn wir sind nicht wie die vielen[a], die mit dem Wort Gottes Handel treiben[b], sondern wir reden vor Gott[d] im Messias[e] als solche, die aus Lauterkeit[c] handeln, als solche, die von Gott her reden.
  rationale: Die Revision stellt die doppelte ὡς-Konstruktion durch die parallele Wendung „als solche, die …“ wieder her. „Handeln“ bei „aus Lauterkeit“ macht den motivierenden Herkunfts- bzw. Beweggrundaspekt idiomatisch, während „von Gott her reden“ die zweite Herkunftsangabe ohne die nicht ausdrücklich vorhandene Aussage „von Gott gesandt“ erhält. Die Reihenfolge „vor Gott im Messias“ bleibt als dichte paulinische Qualifikation des Redens bestehen.
