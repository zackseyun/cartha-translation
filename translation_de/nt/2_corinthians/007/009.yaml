source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: de
  text: Jetzt freue ich mich, nicht weil ihr betrübt wurdet, sondern weil eure Betrübnis euch zur Umkehr führte[a]. Denn ihr wurdet Gott gemäß betrübt[b], damit ihr durch uns in keiner Weise Schaden nehmt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sondern weil ihr zur Umkehr betrübt wurdet“.'
    reason: Die Fußnote zeigt die ungewöhnliche, zielgerichtete Formulierung des griechischen Textes, die im Haupttext für natürliches Deutsch umgestellt wurde.
  - marker: b
    text: 'Oder: „auf eine Gott entsprechende Weise“ oder „wie Gott es will“.'
    reason: κατὰ θεόν kann die Übereinstimmung mit Gottes Maßstab oder Willen beziehungsweise die Art der Betrübnis bezeichnen.
  - marker: c
    text: 'Wörtlicher: „von uns her“; statt „Schaden nehmen“ auch: „einen Verlust erleiden“.'
    reason: Die Fußnote bewahrt sowohl die Herkunftsnuance von ἐξ als auch die Bedeutungsbreite von ζημιόω.
lexical_decisions:
- source_word: νῦν χαίρω
  choice: Jetzt freue ich mich
  rationale: Gibt den zeitlichen Kontrast und die verbale Aussage knapp und in einem würdigen, natürlichen Deutsch wieder.
- source_word: ἐλυπήθητε
  choice: ihr wurdet betrübt / eure Betrübnis
  rationale: Bewahrt das Motiv der Betrübnis und grundsätzlich auch die passive Aussage; in der mittleren Satzhälfte vermeidet die substantivische Umformung eine im Deutschen schwer verständliche Wiederholung.
- source_word: εἰς μετάνοιαν
  choice: zur Umkehr führte
  rationale: „Umkehr“ gibt μετάνοια im moralisch-geistlichen Sinn wieder; „führte“ macht die von εἰς bezeichnete Ausrichtung beziehungsweise Folge in natürlichem Deutsch deutlich.
- source_word: κατὰ θεόν
  choice: Gott gemäß
  rationale: Die knappe formale Wiedergabe wahrt, dass die Betrübnis an Gott, seinem Willen oder seinem Maßstab ausgerichtet ist, ohne diese Beziehung im Haupttext enger festzulegen.
- source_word: ἵνα ἐν μηδενὶ ζημιωθῆτε
  choice: damit ihr … in keiner Hinsicht Schaden nehmen solltet
  rationale: Gibt den Zweck beziehungsweise das beabsichtigte Ergebnis von ἵνα sowie die umfassende Verneinung ἐν μηδενί wieder; „Schaden nehmen“ deckt die Verlust- und Schadensbedeutung von ζημιόω ab.
- source_word: ἐξ ἡμῶν
  choice: durch uns
  rationale: Im Deutschen bezeichnet „durch uns“ verständlich die von Paulus und seinen Mitarbeitern ausgehende Ursache; die formalere Herkunftsnuance von ἐξ wird in der Fußnote festgehalten.
theological_decisions:
- issue: Bedeutung von μετάνοια
  choice: Umkehr
  alternative: Sinnesänderung; Buße
  rationale: „Umkehr“ wahrt hier den moralisch-geistlichen Gehalt des griechischen Begriffs und ist zugleich gegenwärtig und allgemein verständlich. „Sinnesänderung“ wäre zu leicht rein gedanklich zu verstehen, während „Buße“ traditionsbedingt enger wirken kann.
- issue: Art der Betrübnis in κατὰ θεόν
  choice: Gott gemäß
  alternative: auf gottgemäße Weise; wie Gott es will
  rationale: Die Formulierung lässt offen, ob vor allem Gottes Maßstab, sein Wille oder die Gott entsprechende Art der Betrübnis gemeint ist, und löst die theologische Spannung nicht vorschnell auf.
- issue: Möglicher Schaden durch Paulus und seine Mitarbeiter
  choice: durch uns … Schaden nehmen
  alternative: von uns her einen Verlust erleiden
  rationale: Die Übersetzung bewahrt die Verantwortung beziehungsweise ursächliche Beteiligung der Absender, ohne die Art des Schadens genauer zu bestimmen, als es der griechische Text tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte griechische Passivkonstruktion wird teilweise idiomatisch umgeformt, ohne ihren gedanklichen Zusammenhang aufzugeben. „Gott gemäß“ bleibt bewusst etwas markant, um die offene Beziehung der Betrübnis zu Gott zu erhalten.
