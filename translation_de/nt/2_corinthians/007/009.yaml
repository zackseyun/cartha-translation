  to: Jetzt freue ich mich, nicht weil ihr betrübt wurdet, sondern weil eure Betrübnis euch zur Umkehr führte[a]. Denn ihr wurdet Gott gemäß betrübt[b], damit ihr durch uns in keiner Weise Schaden nehmt[c].
  rationale: Die einzige notwendige Korrektur beseitigt die im Deutschen irreführende deontische Nuance von „solltet“. „Damit ihr … Schaden nehmt“ gibt den von ἵνα ausgedrückten Zweck bzw. das angestrebte Ergebnis idiomatisch wieder, ohne die Bedeutung näher festzulegen. Die vorhandenen Fußnotenanker und Fußnotentexte bleiben sachlich und strukturell passend.
