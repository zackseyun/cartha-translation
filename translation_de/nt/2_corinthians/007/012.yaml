source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: de
  text: Wenn ich euch also auch geschrieben habe, dann nicht wegen dessen, der Unrecht getan hat, und auch nicht wegen dessen, dem Unrecht geschehen ist, sondern damit euer Eifer für uns bei euch vor Gott offenbar wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „damit unser Eifer für euch bei euch vor Gott offenbar wird“.'
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Wenn ich euch also auch
  rationale: „Also“ gibt den folgernden Charakter von ἄρα wieder; „auch wenn“ bzw. die deutsche Konstruktion „wenn ... auch“ bewahrt die konzessive Kraft von εἰ καί.
- source_word: ἔγραψα
  choice: geschrieben habe
  rationale: Das Perfekt ist im modernen Deutsch die natürliche Erzählform für den Rückblick auf den früheren Brief, ohne den Aorist aspektuell zu überdeuten.
- source_word: τοῦ ἀδικήσαντος
  choice: dessen, der Unrecht getan hatte
  rationale: Die substantivierte aktive Partizipialform wird transparent wiedergegeben; das Plusquamperfekt ordnet die Tat zeitlich vor dem Schreiben ein.
- source_word: τοῦ ἀδικηθέντος
  choice: dessen, dem Unrecht geschehen war
  rationale: Die passive Partizipialform und die Parallelität zum vorausgehenden Ausdruck bleiben erhalten, ohne die Art des Unrechts näher festzulegen.
- source_word: ἕνεκεν τοῦ φανερωθῆναι
  choice: damit ... offenbar würde
  rationale: Die Zweckangabe und der Passivcharakter von φανερωθῆναι werden in natürlichem, würdigem Deutsch bewahrt.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: euer Eifer
  rationale: σπουδή bezeichnet hier ernsthaften Einsatz beziehungsweise entschiedene Anteilnahme; „Eifer“ ist knapp und verständlich, ohne eine bestimmte Handlung zu unterstellen.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Die Ausrichtung des Eifers auf Paulus und seine Mitarbeiter wird schlicht und idiomatisch ausgedrückt.
- source_word: πρὸς ὑμᾶς
  choice: bei euch
  rationale: Die schwierige Wendung wird räumlich-sozial als Offenbarwerden im Kreis der Adressaten verstanden; dies bewahrt die syntaktische Spannung besser als eine eindeutige reflexive Auflösung.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe traditionelle Wendung bewahrt den Gedanken göttlicher Gegenwart und Bezeugung.
theological_decisions:
- issue: Bezug und Sinn von τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς
  choice: „euer Eifer für uns bei euch“
  alternative: „unser Eifer für euch bei euch“ beziehungsweise „euer Eifer für uns euch selbst gegenüber offenbar“
  rationale: Der Haupttext folgt der im SBLGNT gedruckten Lesart mit ὑμῶν und ἡμῶν und lässt die ungewöhnliche Verbindung mit πρὸς ὑμᾶς erkennbar, statt sie theologisch oder psychologisch zu glätten. Die bedeutende Textvariante wird in einer Fußnote dokumentiert.
- issue: Zweck des früheren Schreibens
  choice: Nicht primär zugunsten einer der beiden beteiligten Parteien, sondern zur Offenbarung des Eifers der Gemeinde
  alternative: Paulus bestreitet jedes Interesse an Täter oder Geschädigtem
  rationale: Die Gegenüberstellung beschreibt den hervorgehobenen Zweck des Schreibens; sie sollte nicht zu einer absoluten Aussage über Paulus’ fehlende Sorge um die Betroffenen verschärft werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte Satzstruktur folgt dem Gedankengang des griechischen Textes, bleibt aber durch klare Konnektoren verständlich. Der Fußnotenmarker [a] steht im Haupttext.
