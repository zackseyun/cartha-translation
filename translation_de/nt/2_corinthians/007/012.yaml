revisions:
- from: Wenn ich euch also auch geschrieben habe, dann nicht wegen dessen, der Unrecht getan hatte, und auch nicht wegen dessen, dem Unrecht geschehen war, sondern damit euer Eifer für uns bei euch vor Gott offenbar würde.[a]
  to: Wenn ich euch also auch geschrieben habe, dann nicht wegen dessen, der Unrecht getan hat, und auch nicht wegen dessen, dem Unrecht geschehen ist, sondern damit euer Eifer für uns bei euch vor Gott offenbar wird.[a]
  rationale: Die Revision vermeidet nicht im Ausgangstext geforderte zeitliche Präzisierungen bei den beiden Partizipien, glättet die deutsche Zweckkonstruktion und dokumentiert die relevante Handschriftenlesart präzise. Die syntaktische Spannung des SBLGNT-Texts bleibt mit „euer Eifer für uns bei euch“ bewusst erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:31:23Z'
review_pass:
  verdict: revise
  source_fidelity: Der Haupttext gibt die Konzessiv- und Zweckstruktur sowie die beiden substantivierten Partizipien sachgerecht wieder. Die Formulierung „bei euch“ wahrt bei der schwierigen Verbindung πρὸς ὑμᾶς eine angemessene Offenheit. Die Fußnote sollte die abweichende Lesart jedoch als Lesart und nicht lediglich „sinngemäß“ kennzeichnen.
  naturalness: Der Satz ist verständlich und im angemessen würdigen modernen Standarddeutsch formuliert. „geschrieben habe“ ist möglich; die zeitlich stärker festlegenden Plusquamperfektformen „getan hatte“ und „geschehen war“ sind hingegen nicht erforderlich.
  terminology: „Unrecht getan“ und „dem Unrecht geschehen ist“ sind idiomatisch und bewahren die aktive beziehungsweise passive Gegenüberstellung. „Eifer“ ist als knappe Wiedergabe von σπουδή vertretbar. „Offenbar wird“ ist in der damit-Konstruktion natürlicher als „offenbar würde“, ohne die Zweckangabe zu verändern.
  issues:
  - severity: low
    issue: Die Plusquamperfektformen legen eine zeitliche Vorzeitigkeit stärker fest als der griechische Aorist.
    rationale: Die Partizipien bezeichnen Täter und Geschädigten, ohne hier ausdrücklich eine zeitliche Abstufung gegenüber dem Schreiben zu markieren. Deutsche Perfektformen sind neutraler und natürlich.
  - severity: low
    issue: Die Fußnote bezeichnet die textkritische Alternative nur als „sinngemäß“.
    rationale: Bei einer ausgewiesenen Handschriftenvariante sollte klar gesagt werden, dass einige Handschriften so lesen; die alternative Formulierung kann dann vollständig wiedergegeben werden.
  revised_text: Wenn ich euch also auch geschrieben habe, dann nicht wegen dessen, der Unrecht getan hat, und auch nicht wegen dessen, dem Unrecht geschehen ist, sondern damit euer Eifer für uns bei euch vor Gott offenbar wird.[a]
  revised_footnotes:
