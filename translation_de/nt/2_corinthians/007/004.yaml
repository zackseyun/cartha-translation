source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: de
  text: Ich rede mit großer Freimütigkeit zu euch[a] und rühme mich sehr euretwegen. Ich bin von Ermutigung[b] erfüllt; in all unserer Bedrängnis fließe ich über vor Freude.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe großes Vertrauen zu euch.“ Das griechische Wort kann Freimütigkeit, offene Rede oder zuversichtliches Vertrauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Trost“. Das griechische Wort umfasst sowohl stärkende Ermutigung als auch tröstenden Zuspruch.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Trotz all unserer Bedrängnis fließe ich über vor Freude.“ Der griechische Ausdruck kann die Freude als mitten in der Bedrängnis überfließend beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: ganz offen reden
  rationale: Das Substantiv bezeichnet Freimütigkeit, Offenheit oder zuversichtliche Freiheit im Reden. Die verbale Wiedergabe klingt im modernen Deutschen natürlich und bewahrt hier den kommunikativen Bezug auf die Korinther.
- source_word: πρὸς ὑμᾶς
  choice: mit euch
  rationale: πρός mit Akkusativ bezeichnet hier die relationale Ausrichtung der Freimütigkeit. In Verbindung mit „offen reden“ ist „mit euch“ idiomatisches Deutsch.
- source_word: καύχησις
  choice: sich rühmen
  rationale: Die Wiedergabe bewahrt Paulus’ charakteristische Rühmenssprache und schwächt sie nicht zu bloßem Stolz oder Vertrauen ab.
- source_word: ὑπὲρ ὑμῶν
  choice: mit euch
  rationale: ὑπέρ mit Genitiv kann „für“ oder „über/wegen“ bedeuten. Das deutsche „sich mit jemandem rühmen“ drückt hier aus, dass die Korinther Anlass und Gegenstand seines Rühmens sind.
- source_word: πεπλήρωμαι
  choice: ich bin … erfüllt
  rationale: Das Perfekt Passiv bezeichnet einen gegenwärtigen Zustand als Ergebnis eines vorausliegenden Geschehens.
- source_word: παράκλησις
  choice: Ermutigung
  rationale: Der Ausdruck umfasst stärkenden Zuspruch ebenso wie Trost. „Ermutigung“ hält den stärkenden Aspekt im Vordergrund, ohne den Trostgehalt auszuschließen.
- source_word: ὑπερπερισσεύομαι
  choice: ich fließe über
  rationale: Das intensivierte Verb bezeichnet ein überreiches Maß. Die Formulierung bewahrt das anschauliche Bild des Überfließens.
- source_word: χαρά
  choice: Freude
  rationale: „Freude“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: bei all unserer Bedrängnis
  rationale: ἐπί mit Dativ beschreibt hier den begleitenden Umstand oder die Lage, in der die Freude überfließt. „Bei“ bewahrt das Nebeneinander von Freude und Leiden, ohne vorschnell ein rein adversatives „trotz“ einzusetzen.
- source_word: πολλή … πολλή
  choice: ganz … sehr
  rationale: Die Wiederholung betont jeweils ein hohes Maß. Wegen der unterschiedlichen deutschen Konstruktionen wird die Intensität idiomatisch mit „ganz offen“ und „sehr“ ausgedrückt.
theological_decisions:
- issue: Positive paulinische Rühmenssprache ohne moralische Umdeutung
  choice: καύχησις mit „sich rühmen“ wiedergeben
  alternative: „stolz sein“ oder „Vertrauen haben“
  rationale: Paulus gebraucht die Wortgruppe des Rühmens auch positiv und qualifiziert. „Sich rühmen“ erhält diese rhetorische und theologische Spannung, statt sie abzuschwächen.
- issue: Das Verhältnis von Freude und Bedrängnis
  choice: „bei all unserer Bedrängnis“
  alternative: „trotz all unserer Bedrängnis“
  rationale: Der griechische Ausdruck lässt die Freude mitten in der Bedrängnis überfließen. „Bei“ bewahrt dieses gleichzeitige Bestehen, während „trotz“ die Beziehung ausdrücklich adversativ festlegen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur des griechischen Satzanfangs wird zugunsten natürlicher deutscher Syntax leicht variiert; die Intensität, die paulinische Rühmenssprache und das Bild des Überfließens bleiben erhalten.
