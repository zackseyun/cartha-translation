base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: de
  text: Gebt uns Raum.[a] Wir haben niemandem Unrecht getan, niemanden verdorben[b], niemanden ausgenutzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nehmt uns auf“ oder „Öffnet eure Herzen für uns“. Wörtlich steht im Griechischen: „Gebt uns Raum“; wahrscheinlich wird damit das Beziehungsbild aus 6,11–13 fortgeführt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „niemanden zugrunde gerichtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Gebt … Raum
  rationale: Der Aorist-Imperativ von χωρέω fordert hier im Zusammenhang von 6,11–13 nicht zu einer räumlichen Bewegung, sondern zu relationaler Offenheit auf. „Gebt uns Raum“ bewahrt das griechische Bild und klingt zugleich natürlich.
- source_word: ἡμᾶς
  choice: uns
  rationale: Direktes Objekt des Imperativs; die schlichte Wiedergabe entspricht dem Griechischen.
- source_word: οὐδένα
  choice: niemandem / niemanden
  rationale: Die dreimalige Wiederholung wird zur Wahrung der nachdrücklichen Verneinung beibehalten; der Kasus richtet sich im Deutschen nach dem jeweiligen Verb.
- source_word: ἠδικήσαμεν
  choice: haben … Unrecht getan
  rationale: ἀδικέω bezeichnet, dass man sich jemandem gegenüber ungerecht verhält oder ihm Unrecht zufügt. Die Formulierung bleibt bewusst allgemein.
- source_word: ἐφθείραμεν
  choice: haben … zugrunde gerichtet
  rationale: φθείρω kann verderben, ruinieren oder zerstören bedeuten. „Zugrunde gerichtet“ gibt die starke, breite Bedeutung wieder, ohne die Art des Schadens ausdrücklich auf moralische Verführung oder materiellen Verlust festzulegen.
- source_word: ἐπλεονεκτήσαμεν
  choice: haben … ausgenutzt
  rationale: πλεονεκτέω bezeichnet das Übervorteilen oder Ausbeuten zum eigenen Vorteil. „Ausgenutzt“ ist modernes, verständliches Deutsch und beschränkt die Aussage nicht auf Finanzbetrug.
theological_decisions:
- issue: Art des Appells in Χωρήσατε ἡμᾶς
  choice: Ein relationaler Aufruf, Paulus und seinen Mitarbeitern Raum zu geben
  alternative: Eine allgemeinere Aufforderung, Paulus und seine Mitarbeiter aufzunehmen oder willkommen zu heißen
  rationale: Der unmittelbare Zusammenhang von 6,11–13 spricht von Weite und engem Raum in den inneren Regungen. Die Übersetzung bewahrt deshalb das Raumbild, ohne das im Vers selbst nicht ausdrücklich genannte „Herz“ in den Haupttext einzufügen.
- issue: Bedeutungsumfang von ἐφθείραμεν
  choice: zugrunde gerichtet
  alternative: verdorben oder ins Verderben geführt
  rationale: Das Verb kann umfassenden Ruin ebenso wie sittliche oder geistliche Verderbnis bezeichnen. Der Haupttext legt die genaue Art des Schadens nicht fest; die Fußnote hält die enger moralisch verstandene Möglichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige, nachdrückliche Wiederholung von „niemand-“ bleibt erhalten. Das Bild „Raum geben“ knüpft natürlich an den Kontext an; die drei Verben werden bewusst nicht zu einer einzigen allgemeinen Schadensaussage eingeebnet.
