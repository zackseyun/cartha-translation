  terminology: »Trost / getröstet« erhält die im Griechischen vorhandene Wortverwandtschaft. »Sehnsucht«, »Trauer«, »Eifer« und »für mich« sind angemessen; die vorhandenen Alternativangaben sind sinnvoll.
