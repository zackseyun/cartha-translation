reference: 2 Corinthians 7:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: de
  text: und nicht nur durch sein Kommen[a], sondern auch durch den Trost, den er im Blick auf euch erfahren hatte[b]. Er berichtete uns nämlich von eurer Sehnsucht, eurer Trauer[c] und eurem Eifer für mich, sodass ich mich noch mehr freute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Anwesenheit« beziehungsweise »seine Ankunft«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich kann die Wendung auch den Anlass bezeichnen: »wegen euch«; oder den Bezug: »über euch« bzw. »euch betreffend«. Für »Trost« und »erfahren hatte« auch: »Ermutigung« und »ermutigt worden war«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Klage«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: Kommen
  rationale: Im Zusammenhang mit der Reise des Titus bezeichnet παρουσία sein Eintreffen beziehungsweise Kommen. »Kommen« gibt den Ereignischarakter natürlich wieder; »Anwesenheit« bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: παρακλήσει / παρεκλήθη
  choice: Trost / getröstet worden war
  rationale: Die verwandten Substantiv- und Verbformen werden durch dieselbe deutsche Wortfamilie wiedergegeben. Der emotionale Zusammenhang legt »Trost« nahe, während »Ermutigung« ebenfalls möglich ist.
- source_word: ἐφ’ ὑμῖν
  choice: durch euch
  rationale: ἐπί mit Dativ kann hier die Korinther als Anlass beziehungsweise vermittelnde Ursache des Trostes bezeichnen. »Durch euch« ist knapp und lässt offen, ob ihr Verhalten oder die Nachricht über sie im Vordergrund steht.
- source_word: ἀναγγέλλων
  choice: Denn er berichtete
  rationale: Das Partizip erläutert, wodurch Paulus zusätzlich erfreut wurde. Ein eigener deutscher Satz mit »Denn« macht diesen Zusammenhang verständlich, ohne ihn inhaltlich zu verändern.
- source_word: ἐπιπόθησιν
  choice: Sehnsucht
  rationale: Das Wort bezeichnet ein starkes Verlangen und wird mit dem natürlichen, emotional kräftigen »Sehnsucht« wiedergegeben.
- source_word: ὀδυρμόν
  choice: Trauer
  rationale: Der Ausdruck bezeichnet schmerzliche, auch nach außen geäußerte Trauer. »Trauer« ist gegenwärtiges Standarddeutsch; »Klage« verdeutlicht alternativ den Ausdruck des Schmerzes.
- source_word: ζῆλον
  choice: Eifer
  rationale: »Eifer« entspricht der intensiven, engagierten Haltung, ohne deren genaue Ausrichtung über den Zusatz »für mich« hinaus festzulegen.
- source_word: ὑπὲρ ἐμοῦ
  choice: für mich
  rationale: Die knappe Wiedergabe wahrt die Breite der griechischen Wendung, die Einsatz, Sorge oder Parteinahme für Paulus bezeichnen kann.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: sodass ich mich noch mehr freute
  rationale: Die Formulierung gibt die resultative Bedeutung von ὥστε und die Steigerung durch μᾶλλον idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der verwandten Wörter »Trost/getröstet« bildet die griechische Wortverwandtschaft ab. Die lange griechische Satzstruktur wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
