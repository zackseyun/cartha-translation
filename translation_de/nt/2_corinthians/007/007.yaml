revisions:
- from: und nicht nur durch sein Kommen[a], sondern auch durch den Trost, mit dem er durch euch getröstet worden war[b]. Denn er berichtete uns von eurer Sehnsucht, eurer Trauer[c] und eurem Eifer für mich, sodass ich mich noch mehr freute.
  to: und nicht nur durch sein Kommen[a], sondern auch durch den Trost, den er im Blick auf euch erfahren hatte[b]. Er berichtete uns nämlich von eurer Sehnsucht, eurer Trauer[c] und eurem Eifer für mich, sodass ich mich noch mehr freute.
  rationale: Die Revision korrigiert die zu agentiv wirkende Wiedergabe von ἐφ’ ὑμῖν und ergänzt eine daran verankerte Fußnote, die die sachlich möglichen Nuancen transparent macht. »Erfahren hatte« ist gewählt, weil »im Blick auf euch getröstet worden war« im Deutschen unnötig schwerfällig wäre; die Fußnote erhält die alternative cognate Formulierung. Die übrigen Entscheidungen bleiben erhalten.
