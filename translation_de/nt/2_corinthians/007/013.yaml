source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: de
  text: Darum sind wir getröstet worden.[a] Zusätzlich zu unserem Trost haben wir uns über die Freude des Titus noch viel mehr gefreut, denn sein Geist ist durch euch alle erfrischt worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ermutigt worden“; die griechischen Wörter können in diesem Zusammenhang sowohl Trost als auch Ermutigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn sein Geist hat durch euch alle Ruhe gefunden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde beziehungsweise begründende Verknüpfung knapp und natürlich wieder.
- source_word: παρακεκλήμεθα
  choice: sind wir getröstet worden
  rationale: Das Perfekt Passiv bezeichnet eine erfolgte Tröstung mit fortwirkendem Ergebnis; „getröstet“ passt zum emotionalen Zusammenhang, ohne die mögliche Bedeutung „ermutigt“ auszuschließen.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: Zusätzlich zu unserem Trost
  rationale: Bringt zum Ausdruck, dass zu dem bereits erfahrenen Trost eine noch größere Freude hinzukam. Das δέ wird dabei als weiterführender Übergang verstanden.
- source_word: περισσοτέρως μᾶλλον
  choice: noch viel mehr
  rationale: Bewahrt die nachdrückliche Steigerung der beiden komparativischen Ausdrücke in natürlichem Deutsch.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: haben wir uns über die Freude von Titus … gefreut
  rationale: Die Wiederholung von Freude und Sichfreuen spiegelt die Wortverwandtschaft von χαίρω und χαρά; „über“ gibt den Anlass der Freude idiomatisch wieder.
- source_word: ἀναπέπαυται
  choice: ist … erquickt worden
  rationale: Gibt das Perfekt als eingetretene und fortwirkende Erholung beziehungsweise Stärkung wieder; die Alternative „hat Ruhe gefunden“ bleibt in der Fußnote erhalten.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: sein Geist
  rationale: Bewahrt die anthropologische Ausdrucksweise des Griechischen und bezeichnet hier Titus’ inneres Befinden.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: durch euch alle
  rationale: Gibt die von der gesamten Gemeinde ausgehende Wirkung in idiomatischem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von πνεῦμα in Bezug auf Titus
  choice: Titus’ menschlicher Geist beziehungsweise sein inneres Befinden
  alternative: der Heilige Geist
  rationale: Das Possessivpronomen αὐτοῦ und der Zusammenhang mit Titus’ Freude und Erholung sprechen für seinen eigenen Geist, nicht für den Heiligen Geist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der griechischen Satzbewegung, vermeidet jedoch unnötig schwerfällige Steigerungen. Die Fußnoten bewahren die wesentlichen lexikalischen Alternativen.
