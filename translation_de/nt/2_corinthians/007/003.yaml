  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: de
  text: Ich sage das nicht, um euch zu verurteilen[a]. Denn ich habe bereits gesagt, dass ihr in unseren Herzen seid – zum gemeinsamen Sterben und Leben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Verurteilung“ oder „mit dem Ziel einer Verurteilung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um gemeinsam zu sterben und gemeinsam zu leben“. Die griechische Wendung kann Ziel oder eng zugehörige Bestimmung ausdrücken und betont die Verbundenheit im Sterben wie im Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: um euch zu verurteilen
  rationale: Die Wendung bezeichnet Ziel oder Absicht. Die verbale Formulierung ist im modernen Deutschen natürlich und macht den im Zusammenhang gemeinten Bezug auf die Korinther deutlich.
- source_word: λέγω
  choice: Ich sage das
  rationale: Das ergänzte „das“ verweist idiomatisch auf die vorausgehenden Äußerungen des Paulus.
- source_word: προείρηκα
  choice: ich habe schon vorher gesagt
  rationale: Das Perfekt bezeichnet eine frühere Aussage, die weiterhin gilt; „schon vorher“ gibt den Präfix προ- und die fortdauernde Relevanz wieder.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: ihr seid in unseren Herzen
  rationale: Die Formulierung folgt dem griechischen Plural und bewahrt das Bild tiefer innerer Verbundenheit von Paulus und seinen Mitarbeitern mit den Korinthern.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: sodass wir gemeinsam sterben und gemeinsam leben
  rationale: „Sodass“ verbindet die Infinitivkonstruktion natürlich mit der Herzensverbundenheit, ohne die mögliche Ziel- oder Folgebedeutung endgültig festzulegen. Das wiederholte „gemeinsam“ gibt die συν-Präfixe beider Verben wieder und erhält den Parallelismus.
theological_decisions:
- issue: Ob das gemeinsame Sterben und Leben ausdrücklich als Bundes-, Ehe- oder Christusgemeinschaft auszulegen ist
  choice: Die Sprache umfassender persönlicher Solidarität bleibt ohne technische theologische Festlegung erhalten.
  alternative: Die Aussage ausdrücklich auf Bundestreue oder die Teilhabe an Christus beziehen.
  rationale: Der Text drückt eine weitreichende Verbundenheit aus, benennt hier aber keine engere theologische Kategorie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und das Herzensbild bleiben erhalten; „gemeinsam“ bildet die auffällige Parallelität der beiden griechischen Zusammensetzungen ab.
