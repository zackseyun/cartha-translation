  naturalness: Die Fassung ist überwiegend modernes, würdiges Standarddeutsch. „Zum gemeinsamen Sterben und Leben“ ist hier eine natürliche, knappe nominale Wiedergabe, die die parallelen griechischen Zusammensetzungen wahrt und die problematische Subjektfestlegung vermeidet.
  terminology: „Verurteilen“, „Herzen“, „Sterben“ und „Leben“ sind treffend und registergerecht. „Gemeinsam“ gibt in beiden Gliedern die Bedeutung der Präfixe συν-/συνα- erkennbar wieder. Es wird keine theologische Deutung über den Text hinaus eingeführt.
