  source_fidelity: 'Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben: die perfektische Vorzeitigkeit des Rühmens, das passive „nicht beschämt worden“, πάντα, die Wahrheitsformulierung und die Bestätigung des Rühmens. Die Beziehung zu Titus wird angemessen kontextuell verstanden, ohne den im Griechischen möglichen Spielraum zu leugnen.'
  naturalness: „etwas über euch gerühmt habe“ ist im heutigen Standarddeutsch nicht idiomatisch; üblich ist „mich … über euch gerühmt habe“ oder „etwas von euch gerühmt habe“. Auch „Wie wir zu euch alles“ ist weniger natürlich als „Wie wir euch alles“. „Vielmehr gilt:“ ist nicht nötig und macht die knappe korrelative Struktur schwerfälliger.
  terminology: „mich rühmen/Rühmen“ bildet die griechische Wortverbindung καυχάομαι/καύχησις gut ab und wahrt den rhetorischen, nicht voreilig moralisch wertenden Charakter. „beschämt worden“ gibt das Passiv sachgerecht wieder. „Titus gegenüber“ ist im Deutschen die klarere und kontextgerechte Wiedergabe; die Fußnote sichert „vor Titus“ als mögliche formalere Alternative.
