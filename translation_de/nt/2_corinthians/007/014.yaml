source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: de
  text: 'Denn wenn ich mich ihm gegenüber auch über euch gerühmt habe, bin ich nicht beschämt worden. Sondern: Wie wir euch alles in Wahrheit gesagt haben, so hat sich auch unser Rühmen Titus gegenüber[a] als wahr erwiesen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor Titus. Die Wendung ἡ ἐπὶ Τίτου kann das Rühmen in der Gegenwart des Titus oder ihm gegenüber bezeichnen. Im Zusammenhang geht es um das, was Paulus Titus über die Korinther gesagt hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι
  choice: gerühmt habe
  rationale: Das Verb καυχάομαι bezeichnet hier ein rühmendes, zuversichtliches Reden über die Korinther. „Sich rühmen“ bewahrt die Verbindung zum Substantiv καύχησις, ohne das Rühmen vorschnell als sündhaften Hochmut zu deuten.
- source_word: οὐ κατῃσχύνθην
  choice: bin ich nicht beschämt worden
  rationale: Die passive Form bezeichnet, dass Paulus durch sein Rühmen nicht bloßgestellt oder widerlegt wurde; sie meint nicht lediglich ein inneres Schamgefühl.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: wir zu euch alles in Wahrheit gesagt haben
  rationale: Die Wiedergabe erhält den umfassenden Sinn von πάντα und die betonte Formulierung ἐν ἀληθείᾳ. „Gesagt“ klingt im heutigen Deutsch natürlicher als „geredet“, ohne den Aussagegehalt einzuengen.
- source_word: ἡ καύχησις ἡμῶν
  choice: unser Rühmen
  rationale: „Rühmen“ gibt das Substantiv καύχησις wieder und erhält den Wortstammbezug zum vorausgehenden Verb κεκαύχημαι.
- source_word: ἡ ἐπὶ Τίτου
  choice: vor Titus
  rationale: ἐπί mit dem Genitiv kennzeichnet hier das Rühmen in der Gegenwart beziehungsweise gegenüber Titus. Der Zusammenhang macht deutlich, dass dessen Inhalt die Korinther waren.
- source_word: ἀλήθεια ἐγενήθη
  choice: hat sich als wahr erwiesen
  rationale: Die idiomatische deutsche Formulierung drückt aus, dass das Rühmen durch die tatsächlichen Ereignisse bestätigt wurde.
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι leitet eine Begründung beziehungsweise Erläuterung zum vorhergehenden Zusammenhang ein; „Denn“ bildet diese Funktion im Deutschen passend ab.
theological_decisions:
- issue: Charakter von Paulus’ Rühmen
  choice: Als „rühmen/Rühmen“ wiedergegeben
  alternative: „stolz sein/Stolz“ oder „Vertrauen haben/Vertrauen“
  rationale: Der paulinische Gebrauch kann berechtigtes, zuversichtliches Hervorheben bezeichnen und muss hier keinen sündhaften Hochmut meinen. Die stärkere, lexikalisch engere Wiedergabe lässt den Kontext die moralische Bewertung bestimmen.
- issue: Wahrheitsanspruch des apostolischen Redens
  choice: „alles in Wahrheit gesagt“
  alternative: „alles wahrheitsgemäß gesagt“
  rationale: Die Formulierung bewahrt die markante Gegenüberstellung zwischen dem Reden „in Wahrheit“ und dem Rühmen, das sich „als wahr“ erwies, ohne den Umfang von πάντα abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vielmehr gilt:“ macht den elliptischen griechischen Gegensatz natürlich lesbar und erhält zugleich die logische Parallelität. „Vor Titus“ ist knapp und formal nah; die Fußnote nennt die idiomatische Alternative.
