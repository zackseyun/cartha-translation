  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: de
  text: Denn auch wenn ich euch durch den Brief traurig gemacht habe, bereue ich es nicht. Auch wenn ich es bereut habe – denn ich sehe, dass jener Brief euch traurig gemacht hat, wenn auch nur für kurze Zeit[b]. –
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich: „für eine Stunde“; gemeint ist eine kurze Zeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: traurig gemacht habe / traurig gemacht hat
  rationale: λυπέω bezeichnet hier das Verursachen von Trauer oder Schmerz. „Traurig machen“ ist im heutigen Deutsch natürlich und bewahrt die emotionale Aussage.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: durch den Brief
  rationale: ἐν bezeichnet hier das Mittel. „Durch den Brief“ gibt diese instrumentale Bedeutung im Deutschen klar wieder.
- source_word: μεταμέλομαι / μετεμελόμην
  choice: bereue ich es nicht / habe ich es bereut
  rationale: Das Verb bezeichnet hier Bedauern beziehungsweise Reue über die schmerzliche Wirkung des Briefes. Die Wiedergabe bewahrt den Gegensatz zwischen Gegenwart und vergangenem Zustand, ohne moralische Umkehr auszudrücken.
- source_word: βλέπω
  choice: ich sehe
  rationale: Die direkte Wiedergabe ist idiomatisch und lässt offen, ob Paulus seine Wahrnehmung oder seine Einsicht betont.
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: jener Brief
  rationale: „Jener“ bewahrt die demonstrative und leicht distanzierende Kraft von ἐκείνη.
- source_word: πρὸς ὥραν
  choice: nur für kurze Zeit
  rationale: Die Wendung bedeutet idiomatisch eine begrenzte, kurze Dauer und ist nicht als exakt eine Stunde zu verstehen.
- source_word: ὅτι
  choice: Denn / denn
  rationale: Das erste ὅτι leitet die Begründung zum vorausgehenden Zusammenhang ein; das zweite verbindet Paulus' damaliges Bedauern mit seiner Wahrnehmung der Wirkung des Briefes.
- source_word: εἰ καὶ
  choice: auch wenn / wenn auch
  rationale: Die konzessionale Kraft der wiederholten Wendung bleibt erhalten, während die deutsche Wortstellung natürlich bleibt.
theological_decisions:
- issue: Bedeutung von μεταμέλομαι in Paulus' emotionaler Selbstaussage
  choice: Als „bereuen“ im Sinn nachträglichen Bedauerns wiedergegeben
  alternative: „Buße tun“ oder „umkehren“
  rationale: Der Zusammenhang behandelt Paulus' Reaktion auf die schmerzliche Wirkung seines Briefes, nicht ausdrücklich eine moralische oder religiöse Umkehr. Die Übersetzung vermeidet daher eine stärkere theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gegensatz zwischen gegenwärtigem Nichtbereuen und früherem Bedauern wird deutlich gehalten; der Gedankenfluss des Griechischen wird lesbar gegliedert, ohne seine Spannung aufzulösen.
