  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: de
  text: Denn auch als wir nach Mazedonien kamen, hatte unser Fleisch[a] keine Ruhe, sondern wir wurden in jeder Hinsicht bedrängt – von außen Kämpfe, von innen Ängste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Wir selbst fanden keine Ruhe. Wörtlich steht im Griechischen „unser Fleisch“, ein Ausdruck für menschliche leibliche Schwachheit und Bedrängnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Denn auch
  rationale: Die Wendung knüpft begründend und zugleich leicht nachdrücklich an den vorausgehenden Zusammenhang an.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: als wir nach Mazedonien kamen
  rationale: Der Genitivus absolutus wird natürlich als temporaler Nebensatz wiedergegeben; „nach Mazedonien“ entspricht idiomatischem Standarddeutsch.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: fand … keine Ruhe
  rationale: ἄνεσις bezeichnet Ruhe, Entlastung oder Erleichterung von Bedrängnis. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt das Bild fehlender Ruhe.
- source_word: ἡ σὰρξ ἡμῶν
  choice: unser Fleisch
  rationale: Die wörtliche Wiedergabe bewahrt die körperlich-menschliche Schwachheit und Bedrängnis des Ausdrucks, ohne σάρξ als moralisch „sündige Natur“ zu deuten. Eine idiomatische Erklärung steht in der Fußnote.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: Vielmehr wurden wir in jeder Hinsicht bedrängt
  rationale: Das passive Partizip bezeichnet umfassenden Druck oder Bedrängnis. „Vielmehr“ gibt den Gegensatz nach der Verneinung im Deutschen klar wieder.
- source_word: ἔξωθεν μάχαι
  choice: von außen Kämpfe
  rationale: μάχαι kann Kämpfe, Streitigkeiten oder Konflikte bezeichnen. Die knappe Wiedergabe lässt offen, welche konkreten Formen die äußere Auseinandersetzung annahm.
- source_word: ἔσωθεν φόβοι
  choice: von innen Ängste
  rationale: Die Formulierung bewahrt den prägnanten Parallelismus mit „von außen“ und gibt den Plural φόβοι wieder.
theological_decisions:
- issue: Bedeutung von σάρξ
  choice: unser Fleisch
  alternative: wir selbst / unser Leib
  rationale: Hier bezeichnet σάρξ nicht eine sündige Natur, sondern den Menschen in seiner leiblichen Schwachheit und Belastbarkeit. Die quellennähere Form bleibt im Haupttext; die Fußnote erschließt ihren Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der markierte Ausdruck „unser Fleisch“ bewahrt bewusst die Bildhaftigkeit des griechischen Textes; der abschließende Parallelismus bleibt knapp und eindringlich.
