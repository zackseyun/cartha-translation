source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: de
  text: 'Denn seht: Gerade diese Betrübnis nach Gottes Willen – welchen Ernst hat sie bei euch bewirkt! Ja, was für eine Verteidigung, was für eine Entrüstung, was für eine Furcht, was für eine Sehnsucht, was für einen Eifer, was für eine Ahndung![a] In jeder Hinsicht habt ihr bewiesen, dass ihr in dieser Sache rein seid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was für eine Bestrafung!“; das griechische Wort kann auch Vergeltung oder die Durchsetzung des Rechts bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Denn seht
  rationale: Bewahrt sowohl den begründenden Anschluss von γάρ als auch den nachdrücklichen Aufmerksamkeitsruf ἰδού in natürlichem Deutsch.
- source_word: αὐτὸ τοῦτο τὸ κατὰ θεὸν λυπηθῆναι
  choice: gerade diese Betrübnis nach Gottes Willen
  rationale: Das substantivierte λυπηθῆναι wird als „Betrübnis“ wiedergegeben. „Nach Gottes Willen“ macht κατὰ θεόν verständlich, ohne es lediglich als Eigenschaftswort zu glätten.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: welchen Ernst hat sie bei euch bewirkt
  rationale: κατεργάζομαι bezeichnet das Hervorbringen einer Wirkung; σπουδή meint hier ernsthafte, entschlossene Anteilnahme und nicht bloß Fleiß.
- source_word: ἀλλὰ
  choice: ja, was für
  rationale: Das wiederholte ἀλλά ist hier steigernd und aufzählend, nicht eigentlich gegensätzlich. Die wiederholte deutsche Wendung bildet den rhetorischen Nachdruck ab.
- source_word: ἀπολογίαν
  choice: Verteidigung
  rationale: Bezeichnet die verantwortliche Stellungnahme, mit der die Adressaten ihre Haltung zu dem Vergehen deutlich machten; die Übersetzung wahrt die Offenheit zwischen Rechtfertigung und Entlastung.
- source_word: ἀγανάκτησιν
  choice: Entrüstung
  rationale: Gibt den starken moralischen Unwillen wieder, ohne dessen genaues Objekt im Text festzulegen.
- source_word: φόβον
  choice: Furcht
  rationale: Das Objekt der Furcht bleibt im Griechischen unausgesprochen; die schlichte Wiedergabe bewahrt diese Mehrdeutigkeit.
- source_word: ἐπιπόθησιν
  choice: Sehnsucht
  rationale: Drückt ein starkes Verlangen aus, ohne ausdrücklich festzulegen, ob es vor allem Paulus oder der Wiederherstellung der Beziehung gilt.
- source_word: ζῆλον
  choice: Eifer
  rationale: Bewahrt die Kraft des Begriffs und unterscheidet ihn sprachlich von σπουδή („Ernst“).
- source_word: ἐκδίκησιν
  choice: Bereitschaft, für Recht zu sorgen
  rationale: ἐκδίκησις kann Vergeltung, Bestrafung oder die Durchsetzung des Rechts bezeichnen. Die Formulierung wahrt den entschlossenen korrektiven Sinn, ohne persönliche Rache zu unterstellen.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: In jeder Hinsicht habt ihr bewiesen, dass ihr in dieser Sache rein seid
  rationale: συνίστημι hat hier evidentiellen Sinn („erweisen“); ἁγνός bezeichnet ihre Reinheit beziehungsweise Unbescholtenheit in Bezug auf die behandelte Angelegenheit.
theological_decisions:
- issue: Bedeutung von κατὰ θεόν
  choice: nach Gottes Willen
  alternative: Gott gemäße Betrübnis / Betrübnis vor Gott
  rationale: Die Wendung beschreibt eine Betrübnis, die sich an Gott und seinem Willen ausrichtet. Die Übersetzung ist idiomatischer als „nach Gott“, legt aber weder eine besondere Frömmigkeitsqualität noch allein den Ursprung der Betrübnis fest.
- issue: Nuance von ἐκδίκησις im Zusammenhang mit Umkehr
  choice: Bereitschaft, für Recht zu sorgen
  alternative: Bestrafung / Vergeltung / Rechtsschaffung
  rationale: Der Begriff enthält einen deutlichen Gedanken der Ahndung oder Rechtsdurchsetzung. Die gewählte Formulierung vermeidet einerseits persönliche Rache, schwächt andererseits die entschlossene Reaktion auf das Unrecht nicht zu bloßer Selbstrechtfertigung ab.
- issue: Reinheit der Korinther in der Angelegenheit
  choice: in dieser Sache rein
  alternative: an der Sache schuldlos
  rationale: ἁγνούς muss nicht behaupten, dass die Gemeinde in jeder Hinsicht völlig schuldlos war; im Kontext besagt es, dass ihre Reaktion ihre bereinigte beziehungsweise unbescholtene Stellung in der konkreten Angelegenheit erwies.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Häufung des griechischen ἀλλά wird durch die wiederholte Wendung „was für“ hörbar gemacht, ohne eine unnatürliche Folge von „aber“ zu erzeugen. „Betrübnis“ hält den ernsten Ton und lässt sich von bloßer Traurigkeit unterscheiden.
