base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/016.yaml
  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: de
  text: Ich freue mich, dass ich in jeder Hinsicht zuversichtlich bin, was euch betrifft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich freue mich, weil ich in jeder Hinsicht zuversichtlich bin, was euch betrifft.«'
    reason: ὅτι kann neben einer Inhaltsergänzung auch kausal verstanden werden.
lexical_decisions:
- source_word: χαίρω
  choice: Ich freue mich
  rationale: Das Präsens wird natürlich und würdig wiedergegeben; »ich freue mich« bewahrt den verbalen Charakter, ohne unnötig feierlich zu klingen.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι führt hier am ehesten den Inhalt von Paulus’ Freude ein. Eine kausale Wiedergabe mit »weil« bleibt jedoch möglich.
- source_word: ἐν παντί
  choice: in jeder Hinsicht
  rationale: Die adverbiale Wendung bezeichnet einen umfassenden Geltungsbereich; »in jeder Hinsicht« ist im modernen Deutsch natürlicher als »in allem«.
- source_word: θαρρῶ
  choice: vertrauen kann
  rationale: Im Zusammenhang mit ἐν ὑμῖν bezeichnet das Verb Zuversicht oder Vertrauen gegenüber den Korinthern. Die Formulierung ist idiomatisch, ohne die Aussage auf eine bloße Stimmung zu reduzieren.
- source_word: ἐν ὑμῖν
  choice: euch
  rationale: In Verbindung mit »vertrauen« wird das griechische personale Bezugsverhältnis im Deutschen durch den Dativ ausgedrückt. Alternativ lässt es sich als »was euch betrifft« verstehen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Hauptfassung gibt die relationale Zuversicht idiomatisch wieder; die Fußnote bewahrt die syntaktische und semantische Alternative.
