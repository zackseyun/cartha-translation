  source_fidelity: Der Entwurf gibt die zentralen Begriffe und die inklusive Aufforderung zutreffend wieder. Die koordinierte Form „und die Heiligkeit ... vollenden“ glättet jedoch das griechische Partizip ἐπιτελοῦντες zu stark; dessen begleitende Art-und-Weise-Bezug sollte im Deutschen erkennbar bleiben.
  naturalness: „Da wir nun diese Verheißungen haben“ und die Anrede „Geliebte“ sind im würdigen modernen Bibelregister natürlich. „Wollen wir“ ist als inklusive Aufforderung möglich. Mit „und dabei ... zur Vollendung bringen“ wird der Schlussteil idiomatischer als mit dem etwas harten „die Heiligkeit ... vollenden“.
  terminology: „Verheißungen“, „Befleckung“, „Fleisch“, „Geist“, „Heiligkeit“ und „Gottesfurcht“ sind quellennah und theologisch nicht überdeutend. Die Erläuterung zu „Gottesfurcht“ wahrt den stärkeren Ausdruck φόβος, ohne ihn auf Angst zu reduzieren.
