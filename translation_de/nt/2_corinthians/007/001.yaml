reference: 2 Corinthians 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: de
  text: Da wir nun diese Verheißungen haben, Geliebte, wollen wir uns von jeder Befleckung des Fleisches und des Geistes reinigen und dabei die Heiligkeit in Gottesfurcht[a] zur Vollendung bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gottesfurcht“ meint ehrfürchtige Scheu vor Gott, nicht bloße Angst.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: diese Verheißungen
  rationale: Die Wendung verweist auf die unmittelbar vorausgehenden göttlichen Zusagen. „Verheißungen“ bewahrt deren feierlichen und heilsgeschichtlichen Klang.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ markiert innerhalb der einleitenden Folgerung „Da wir nun ...“ natürlich und deutlich den Schluss aus dem Vorangehenden.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Die Anrede gibt sowohl die herzliche Zuneigung als auch den würdevollen Briefstil wieder, ohne einen nicht ausdrücklich genannten Personenkreis wie „Freunde“ einzuführen.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: wollen wir uns ... reinigen
  rationale: Der hortative Konjunktiv schließt Paulus und die Adressaten gemeinsam in eine nachdrückliche Aufforderung ein. Im modernen Deutschen ist „wollen wir“ natürlicher als „lasst uns“.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: von jeder Befleckung
  rationale: „Befleckung“ erhält neben der moralischen auch die kultisch-religiöse Färbung des seltenen Substantivs μολυσμός.
- source_word: σαρκὸς καὶ πνεύματος
  choice: des Fleisches und des Geistes
  rationale: Die formale Gegenüberstellung wird bewahrt. „Fleisch“ bezeichnet hier im Gegensatz zum Geist die leibliche Seite des Menschen und nicht eindeutig eine „sündige Natur“.
- source_word: ἐπιτελοῦντες
  choice: vollenden
  rationale: Das Partizip bezeichnet das begleitende konsequente Zu-Ende-Führen. Die koordinierte deutsche Formulierung ist verständlich und lässt den Zusammenhang mit der Reinigung bestehen.
- source_word: ἁγιωσύνην
  choice: die Heiligkeit
  rationale: „Heiligkeit“ bezeichnet hier die heilige Beschaffenheit beziehungsweise Lebensführung und ist die klare, übliche Entsprechung.
- source_word: ἐν φόβῳ θεοῦ
  choice: in Gottesfurcht
  rationale: Das etablierte deutsche Kompositum wahrt den starken biblischen Ausdruck und umfasst ehrfürchtige Scheu, ohne ihn auf bloße Angst zu verengen.
theological_decisions:
- issue: Bedeutung von σάρξ in der Verbindung „Befleckung des Fleisches und des Geistes“
  choice: Wörtlich „Fleisch“, nicht „sündige Natur“.
  alternative: Leib; sündige Natur
  rationale: Die Gegenüberstellung mit „Geist“ weist auf die leibliche und innere Dimension des ganzen Menschen. Eine Festlegung auf die spezialisierte paulinische Bedeutung „sündige Natur“ wäre hier überinterpretierend.
- issue: Kraft des hortativen Konjunktivs καθαρίσωμεν
  choice: 'Inklusive Aufforderung: „wollen wir uns ... reinigen“.'
  alternative: Wir sollen uns reinigen; lasst uns uns reinigen
  rationale: Die erste Person Plural bezieht Paulus mit ein und hat auffordernde Kraft. Die gewählte Form gibt dies in natürlichem Deutsch wieder.
- issue: Sinn von φόβος gegenüber Gott
  choice: „Gottesfurcht“ mit erläuternder Fußnote.
  alternative: Ehrfurcht vor Gott
  rationale: „Gottesfurcht“ bewahrt die theologische Spannung und das Gewicht von φόβος, während die Fußnote klarstellt, dass mehr als bloßes Erschrecken gemeint ist.
- issue: Verhältnis von Reinigung und Vollendung der Heiligkeit
  choice: Als verbundene, gleichzeitig vollzogene Aufforderung wiedergegeben.
  alternative: „indem wir die Heiligkeit vollenden“; „und so die Heiligkeit vollenden“
  rationale: Das griechische Partizip kann Art und Weise beziehungsweise Begleitumstand ausdrücken. Die Koordination liest keine engere logische Beziehung in den Text hinein, als sprachlich sicher ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber mit „wollen wir“ idiomatisch formuliert. Die traditionellen Begriffe „Fleisch“, „Geist“, „Heiligkeit“ und „Gottesfurcht“ bewahren die biblische Bild- und Begriffswelt; Fußnoten erläutern nur echte Bedeutungs- beziehungsweise Syntaxfragen.
