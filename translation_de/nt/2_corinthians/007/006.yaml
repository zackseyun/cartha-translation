source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: de
  text: Doch Gott, der die Niedergedrückten tröstet, tröstete uns durch die Ankunft des Titus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: durch die Anwesenheit des Titus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zur zuvor geschilderten Bedrängnis; „Doch“ ist im Deutschen knapp, natürlich und würdevoll.
- source_word: ὁ παρακαλῶν
  choice: der … tröstet
  rationale: Das substantivisch gebrauchte Präsenspartizip beschreibt Gottes charakteristisches Handeln. „tröstet“ passt zum Zusammenhang von Bedrängnis und Trost und wahrt die Verbindung zum folgenden παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: die Niedergedrückten
  rationale: Im unmittelbaren Zusammenhang bezeichnet ταπεινός wahrscheinlich Menschen, die durch Bedrängnis erniedrigt oder mutlos geworden sind. „Niedergedrückten“ lässt sowohl die äußere Lage als auch ihre innere Wirkung anklingen, ohne eine Tugend der Demut vorauszusetzen.
- source_word: παρεκάλεσεν
  choice: tröstete
  rationale: Die Wiederholung desselben deutschen Verbs bildet die lexikalische Verbindung zu παρακαλῶν ab und entspricht der erfahrenen Erleichterung.
- source_word: ἐν τῇ παρουσίᾳ
  choice: durch die Ankunft
  rationale: παρουσία kann Gegenwart, Anwesenheit oder Ankunft bezeichnen. Hier steht die Ankunft des Titus als Mittel beziehungsweise Anlass des Trostes im Vordergrund.
- source_word: Τίτου
  choice: des Titus
  rationale: Übliche deutsche Form des Eigennamens im Genitiv.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Gott ist das ausdrücklich genannte Subjekt und wird in natürlicher deutscher Wortstellung wiedergegeben.
theological_decisions:
- issue: Bedeutung von τοὺς ταπεινοὺς im Zusammenhang
  choice: die Niedergedrückten
  alternative: die Demütigen; die Erniedrigten
  rationale: Der Kontext spricht von äußerer Bedrängnis und innerer Furcht. Daher liegt eine situationsbezogene Erniedrigung oder Niedergeschlagenheit näher als die moralische Eigenschaft der Demut. Die Fußnote bewahrt jedoch die breitere Bedeutungsweite.
- issue: Bedeutung von παρουσία
  choice: Ankunft
  alternative: Anwesenheit
  rationale: Der Zusammenhang hebt das Eintreffen des Titus hervor, doch παρουσία kann auch seine persönliche Anwesenheit bezeichnen; diese Ambiguität wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „tröstet/tröstete“ bildet die griechische Wortwiederholung ab. Der einzige Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den sich die Alternative bezieht.
