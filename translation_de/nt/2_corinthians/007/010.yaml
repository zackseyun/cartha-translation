source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: de
  text: Denn gottgemäße Traurigkeit[a] bewirkt eine Umkehr, die zum Heil führt und nicht zu bereuen ist;[b] die Traurigkeit der Welt aber bewirkt den Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Traurigkeit nach Gott“. Die griechische Wendung kann Traurigkeit bezeichnen, die an Gott ausgerichtet ist oder seinem Willen entspricht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bewirkt eine nicht zu bereuende Umkehr zum Heil“. Das griechische Wort „nicht zu bereuen“ kann unmittelbar die Umkehr näher bestimmen; möglich ist auch ein Bezug auf den gesamten Vorgang der zum Heil führenden Umkehr.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: die Gott entspricht
  rationale: Die Wendung gibt den Maßstab beziehungsweise die Ausrichtung der Traurigkeit an. Sie ist im Deutschen natürlich und bewahrt die wörtlichere Aussage „nach Gott“, ohne vorschnell eine bestimmte innere Frömmigkeit zu unterstellen.
- source_word: λύπη
  choice: Traurigkeit
  rationale: „Traurigkeit“ bezeichnet hier verständlich den schmerzlichen Gemütszustand und lässt sich in beiden Satzhälften parallel verwenden.
- source_word: μετάνοιαν
  choice: Umkehr
  rationale: „Umkehr“ bringt den moralisch-geistlichen Sinn von μετάνοια stärker zum Ausdruck als eine bloße Meinungsänderung und ist zugleich gegenwärtiges, allgemein verständliches Deutsch.
- source_word: εἰς σωτηρίαν
  choice: die zum Heil führt
  rationale: εἰς bezeichnet Ziel oder Ergebnis. Die Formulierung wahrt diese Richtung, ohne den genauen Heilsmechanismus über den Text hinaus festzulegen.
- source_word: ἀμεταμέλητον
  choice: nicht zu bereuen
  rationale: Das Adjektiv bedeutet „nicht zu bedauern/bereuen“. Seine syntaktische Zuordnung ist mehrdeutig; im Haupttext wird es naheliegend auf „Umkehr“ bezogen, die alternative Beziehung wird in der Fußnote vermerkt.
- source_word: ἐργάζεται
  choice: bewirkt
  rationale: Das Verb bezeichnet das Hervorbringen eines Ergebnisses. „Bewirkt“ ist präzise und idiomatisch.
- source_word: τοῦ κόσμου
  choice: der Welt
  rationale: Die genitivische Formulierung folgt dem griechischen Ausdruck enger als „weltlich“ und lässt dessen theologische Breite bestehen.
- source_word: θάνατον
  choice: Tod
  rationale: Die schlichte Wiedergabe bewahrt die offene Frage, ob vor allem geistlicher, endgültiger oder anderweitig verderblicher Tod gemeint ist.
- source_word: κατεργάζεται
  choice: bewirkt
  rationale: Obwohl das Verb gegenüber ἐργάζεται leicht verstärkt sein kann, sind beide hier semantisch eng verwandt. Die gleiche Wiedergabe erhält den rhetorischen Parallelismus.
theological_decisions:
- issue: Gegensatz zwischen zwei Arten von Traurigkeit
  choice: „Traurigkeit, die Gott entspricht“ und „Traurigkeit der Welt“
  alternative: „gottgewollte Traurigkeit“ und „weltliche Traurigkeit“
  rationale: Die gewählte Fassung wahrt den Gegensatz, ohne näher festzulegen, ob κατὰ θεόν Ursprung, Maßstab oder Übereinstimmung mit Gottes Willen bezeichnet.
- issue: Verhältnis von Umkehr und Heil
  choice: „eine Umkehr, die zum Heil führt“
  alternative: „Umkehr zum Heil“ oder „Umkehr, die Heil bewirkt“
  rationale: Die Übersetzung gibt Ziel beziehungsweise Ergebnis wieder, ohne Umkehr als eigenständige verdienstliche Ursache des Heils zu definieren.
- issue: Bedeutung von „Tod“
  choice: „Tod“ ohne nähere Bestimmung
  alternative: „geistlicher Tod“ oder „ewiger Tod“
  rationale: Der Vers selbst präzisiert die Art des Todes nicht; diese Offenheit bleibt erhalten.
- issue: Bezug von ἀμεταμέλητον
  choice: Im Haupttext auf „Umkehr“ bezogen
  alternative: Auf das Heil oder auf den ganzen Vorgang der zum Heil führenden Umkehr bezogen
  rationale: Kasus und Stellung legen den Bezug auf μετάνοιαν nahe, doch die Wortfolge erlaubt beim Lesen eine breitere Zuordnung. Die Fußnote bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den strengen Gegensatz und den verbalen Parallelismus des griechischen Textes; erklärungsbedürftige lexikalische und syntaktische Offenheiten stehen in knappen Fußnoten.
