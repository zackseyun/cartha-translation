id: 2CO.7.15
reference: 2 Corinthians 7:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: de
  text: Und seine Zuneigung zu euch ist umso größer, wenn er sich an den Gehorsam von euch allen erinnert und daran, wie ihr ihn mit Furcht und Zittern[a] aufgenommen habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Ehrfurcht und Zittern«. Die Wendung »Furcht und Zittern« bezeichnet bei Paulus ernsthafte, demütige Bereitschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: Zuneigung
  rationale: Das Wort bezeichnet wörtlich die inneren Organe, idiomatisch aber tiefe, herzliche Empfindungen. »Zuneigung« gibt diesen emotionalen Sinn im modernen Deutschen natürlich wieder.
- source_word: περισσοτέρως
  choice: umso größer
  rationale: Der komparative Gedanke wird idiomatisch ausgedrückt und mit der folgenden Erinnerung als Anlass für die verstärkte Zuneigung verbunden.
- source_word: εἰς ὑμᾶς
  choice: zu euch
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Zuneigung auf die korinthische Gemeinde.
- source_word: ἀναμιμνῃσκομένου
  choice: wenn er sich … erinnert
  rationale: Das Genitivpartizip beschreibt den begleitenden beziehungsweise auslösenden Umstand. Die Wiedergabe bewahrt den Bezug zu Titus und klingt im Deutschen natürlich.
- source_word: τὴν πάντων ὑμῶν ὑπακοήν
  choice: den Gehorsam von euch allen
  rationale: »Gehorsam« ist die direkte Bedeutung von ὑπακοή; »von euch allen« erhält die ausdrückliche Einbeziehung der ganzen Gemeinde.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: mit Furcht und Zittern
  rationale: Die formnahe, im paulinischen Sprachgebrauch bekannte Wendung bleibt erhalten. Ihre mögliche Bedeutung als ehrfürchtiger Ernst wird in der Fußnote erläutert, ohne die Spannung im Haupttext aufzulösen.
- source_word: ἐδέξασθε
  choice: aufgenommen habt
  rationale: Das Verb bezeichnet hier die Aufnahme beziehungsweise den Empfang des Titus. »Aufgenommen« ist im Deutschen natürlich und lässt sowohl Willkommenheißen als auch Annahme anklingen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen wird wie im griechischen Text beibehalten; sein Bezug auf Titus ist aus dem Zusammenhang ersichtlich.
theological_decisions:
- issue: Bedeutung von »Furcht und Zittern« bei der Aufnahme des Titus
  choice: Die paulinische Wendung wird im Haupttext als »Furcht und Zittern« bewahrt.
  alternative: »mit Ehrfurcht und Zittern«
  rationale: Im Kontext kann die Formulierung ehrfürchtigen Ernst und demütige Bereitschaft bezeichnen, ohne bloße panische Angst auszudrücken. Die formnahe Übersetzung lässt die genuine Bedeutungsweite offen; die Fußnote nennt die interpretierende Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem Griechischen behutsam gegliedert; »und daran« macht den inhaltlichen Anschluss des ὡς-Satzes verständlich. Die traditionelle Wendung »Furcht und Zittern« bleibt erhalten und wird knapp erläutert.
