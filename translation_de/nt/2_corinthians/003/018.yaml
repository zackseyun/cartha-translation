  terminology: „Herrlichkeit“, „Herr“, „Bild“, „unverhüllt“ und „verwandelt“ sind angemessene, moderne und zugleich bibelsprachlich tragfähige Wiedergaben. Die appositionelle Wiedergabe „der Herr, der Geist“ wahrt die Mehrdeutigkeit von ἀπὸ κυρίου πνεύματος, ohne sie dogmatisch aufzulösen.
