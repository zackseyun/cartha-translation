reference: 2 Corinthians 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: de
  text: Wir alle aber betrachten mit unverhülltem Gesicht wie in einem Spiegel die Herrlichkeit des Herrn[a] und werden in dasselbe Bild verwandelt, von Herrlichkeit zu Herrlichkeit, wie es vom Herrn, dem Geist, geschieht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Herrlichkeit des Herrn widerspiegeln“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „vom Herrn, der der Geist ist“; alternativ: „vom Geist des Herrn“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς δὲ πάντες
  choice: Wir alle aber
  rationale: Gibt Pronomen, Konjunktion und die ausdrückliche Gesamtheit knapp und in natürlicher deutscher Wortstellung wieder.
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: mit unverhülltem Gesicht
  rationale: Das Perfektpartizip bezeichnet den fortbestehenden Zustand nach der Enthüllung; der griechische kollektive Singular bleibt erhalten.
- source_word: τὴν δόξαν κυρίου
  choice: die Herrlichkeit des Herrn
  rationale: Gibt den Genitiv direkt wieder und übersetzt κύριος entsprechend dem üblichen biblischen Sprachgebrauch mit „Herr“.
- source_word: κατοπτριζόμενοι
  choice: schauen … wie in einem Spiegel
  rationale: Das Medium kann ein Schauen im Spiegel oder ein spiegelndes Widerspiegeln bezeichnen. Im Kontext liegt das Schauen nahe; die echte lexikalische Alternative wird in Fußnote [a] bewahrt.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: in dasselbe Bild
  rationale: Die direkte Wiedergabe wahrt die Verbindung zwischen der Herrlichkeit des Herrn und dem Bild, in das die Glaubenden verwandelt werden.
- source_word: μεταμορφούμεθα
  choice: werden … verwandelt
  rationale: Die passive Form bleibt erhalten. Das deutsche Präsens kann den im griechischen Präsens angelegten fortlaufenden Vorgang natürlich ausdrücken.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: von Herrlichkeit zu Herrlichkeit
  rationale: Bewahrt die knappe, offene Formulierung des Griechischen, ohne sie als Stufen oder Grade auszudeuten.
- source_word: καθάπερ
  choice: wie
  rationale: Im Deutschen ist „wie“ hier eine natürliche und hinreichend genaue vergleichende beziehungsweise modale Entsprechung.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: vom Herrn, dem Geist
  rationale: Die komprimierte griechische Fügung wird appositionell und ohne zusätzliche Kopula wiedergegeben; andere syntaktische Deutungen stehen in Fußnote [b].
- source_word: κύριος
  choice: Herr
  rationale: Entspricht dem etablierten, würdigen Standardäquivalent und passt an beiden Stellen des Verses.
theological_decisions:
- issue: Bedeutung von κατοπτριζόμενοι
  choice: die Herrlichkeit des Herrn wie in einem Spiegel schauen
  alternative: die Herrlichkeit des Herrn wie ein Spiegel widerspiegeln
  rationale: Der Zusammenhang von Wahrnehmung und Verwandlung stützt die Bedeutung „schauen“. Da das Verb auch reflektierendes Widerspiegeln bezeichnen kann, wird diese theologisch und bildlich bedeutsame Alternative nicht beseitigt, sondern in [a] genannt.
- issue: Verhältnis von κυρίου und πνεύματος
  choice: vom Herrn, dem Geist
  alternative: 'vom Herrn, der der Geist ist; oder: vom Geist des Herrn'
  rationale: Die griechische Schlusswendung ist knapp und syntaktisch mehrdeutig. Die appositionelle Haupttextfassung bleibt eng am Wortlaut und vermeidet eine stärker auslegende Festlegung; [b] dokumentiert die anderen möglichen Beziehungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, ohne unnatürlich zu wirken. Die wiederholte „Herrlichkeit“ und die offene Wendung „von Herrlichkeit zu Herrlichkeit“ werden bewusst bewahrt. Sämtliche Fußnotenmarker erscheinen im Haupttext.
