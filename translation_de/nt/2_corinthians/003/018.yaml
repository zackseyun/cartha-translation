- from: Wir alle aber schauen mit unverhülltem Gesicht wie in einem Spiegel die Herrlichkeit des Herrn[a] und werden in dasselbe Bild verwandelt, von Herrlichkeit zu Herrlichkeit, wie vom Herrn, dem Geist[b].
  to: Wir alle aber betrachten mit unverhülltem Gesicht wie in einem Spiegel die Herrlichkeit des Herrn[a] und werden in dasselbe Bild verwandelt, von Herrlichkeit zu Herrlichkeit, wie es vom Herrn, dem Geist, geschieht[b].
  rationale: Die Revision verbessert ausschließlich idiomatisches modernes Deutsch. „Betrachten“ verbindet sich natürlicher als „schauen“ mit „die Herrlichkeit“ und bewahrt die Deutung „wie in einem Spiegel schauen“. Die Fußnote zur alternativen Bedeutung von κατοπτριζόμενοι wird sprachlich gestrafft. Die minimale Ergänzung „wie es … geschieht“ macht die griechisch knappe Schlussformel im Deutschen tragfähig, ohne ihre syntaktische oder theologische Mehrdeutigkeit aufzulösen.
