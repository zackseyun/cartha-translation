source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: de
  text: Doch bis heute, sooft Mose[a] gelesen wird, liegt eine Decke auf ihrem Herzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die Schriften des Mose, besonders das Gesetz.
    reason: cultural_note
  - marker: b
    text: Im Griechischen steht „ihr Herz“ im Singular, wahrscheinlich als kollektiver Singular; sinngemäß wäre auch „auf ihren Herzen“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorherigen Gedanken knapp und natürlich.
- source_word: ἕως σήμερον
  choice: bis heute
  rationale: Gibt idiomatisch wieder, dass dieser Zustand bis in die Gegenwart fortbesteht.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: sooft … gelesen wird
  rationale: Die Verbindung mit ἄν und dem Präsens Konjunktiv bezeichnet einen unbestimmten, wiederkehrenden Fall; „sooft“ wahrt diese iterative Bedeutung.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Bewahrt die Metonymie des griechischen Textes, der mit „Mose“ dessen Schriften bezeichnet.
- source_word: κάλυμμα
  choice: eine Decke
  rationale: Passt zur durchgehenden Bildsprache von der Decke in diesem Kapitel und ist im Deutschen klar und würdevoll.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: auf ihrem Herzen
  rationale: Bewahrt den auffälligen Singular „Herz“ bei einem pluralischen Bezug; wahrscheinlich handelt es sich um einen kollektiven Singular.
- source_word: κεῖται
  choice: liegt
  rationale: Gibt das fortdauernde Ruhen oder Liegen der Decke unmittelbar wieder.
theological_decisions:
- issue: Ob ausdrücklich erklärt werden soll, dass „Mose“ das mosaische Gesetz beziehungsweise die Schriften des Mose meint
  choice: „Mose“ als Metonymie im Haupttext beibehalten
  alternative: „das Gesetz des Mose“ oder „die Schriften des Mose“ schreiben
  rationale: Der Ausgangstext sagt schlicht „Mose“. Die Beibehaltung wahrt seine Ausdrucksweise und vermeidet eine unnötige Festlegung; die metonymische Bedeutung wird in einer Fußnote erläutert.
- issue: Ob der kollektive Singular „Herz“ geglättet werden soll
  choice: Den Singular „ihrem Herzen“ beibehalten
  alternative: „auf ihren Herzen“
  rationale: Der griechische Text hat den Singular καρδία mit einem pluralischen Possessivbezug. Die deutsche Form ist verständlich und bewahrt die kollektive Zuspitzung, ohne sie dogmatisch auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Sooft“ bringt den wiederkehrenden Charakter präziser zum Ausdruck als ein bloßes „wenn“. Die Wortstellung bleibt natürlich und lässt zugleich den zeitlichen Fortbestand sowie das Bild der Decke hervortreten.
