  yaml_path: translation/nt/2_corinthians/003/012.yaml
  text: Since, then, we have such a hope, we act with great boldness,
translation:
  language: de
  text: Da wir nun eine solche Hoffnung haben, gehen wir mit großem Freimut vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „handeln wir mit großer Offenheit“; auch: „reden wir ganz offen“ oder „mit großer Kühnheit“.'
    reason: Lexikalische Alternativen für παρρησίᾳ sowie die im Kontext mögliche Ausprägung von χρώμεθα.
lexical_decisions:
- source_word: Ἔχοντες
  choice: Da wir ... haben
  rationale: Das Partizip wird im Zusammenhang kausal wiedergegeben. So klingt der Satz im Deutschen natürlich und der Begründungszusammenhang mit dem Hauptsatz bleibt erhalten.
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Gedankengang; zusammen mit „Da“ wird der schlussfolgernde Zusammenhang klar und idiomatisch ausgedrückt.
- source_word: τοιαύτην
  choice: eine solche
  rationale: Gibt die qualitative und rückverweisende Bedeutung des Demonstrativpronomens knapp und natürlich wieder.
- source_word: ἐλπίδα
  choice: Hoffnung
  rationale: Die übliche und kontextgerechte Wiedergabe für die auf Gottes Wirken gegründete, nach vorn gerichtete Zuversicht.
- source_word: πολλῇ
  choice: großer
  rationale: Verstärkt παρρησίᾳ; „große Offenheit“ wahrt die deutliche Intensivierung.
- source_word: παρρησίᾳ
  choice: Offenheit
  rationale: Das Wort kann Offenheit, Freimut oder Kühnheit bezeichnen. Im Zusammenhang mit dem unverhüllten Auftreten in den folgenden Versen bildet „Offenheit“ die Bild- und Gedankenführung gut ab, ohne den möglichen Bezug auf freimütiges Reden auszuschließen.
- source_word: χρώμεθα
  choice: treten wir ... auf
  rationale: Das Medium mit dem Dativ bedeutet, von etwas Gebrauch zu machen bzw. sich dadurch auszuzeichnen. „Mit ... auftreten“ ist im Deutschen natürlich und vermeidet das schwerfällige „Offenheit gebrauchen“.
theological_decisions:
- issue: Reichweite von παρρησία
  choice: Offenheit im Auftreten
  alternative: Freimut oder Kühnheit, besonders beim Reden
  rationale: Der Vers nennt kein ausdrückliches Objekt wie „Rede“. Daher bleibt die Übersetzung allgemein und bewahrt zugleich durch die Fußnote die mögliche kommunikative Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausale Partizipialkonstruktion wird in einen natürlichen Nebensatz aufgelöst. „Treten ... auf“ bewahrt die allgemeine Aussage über das Verhalten, während die Fußnote die Bedeutungsbreite zwischen Offenheit, Freimut und offenem Reden sichtbar hält.
