  source_fidelity: Die kausale Wiedergabe von ἔχοντες durch „Da wir ... haben“ und οὖν durch „nun“ gibt den Gedankenzusammenhang angemessen wieder. „Eine solche Hoffnung“ entspricht τοιαύτην ἐλπίδα. Die Verbindung χρᾶσθαι mit παρρησίᾳ besagt jedoch primär, dass man Freimut bzw. Kühnheit „gebraucht“ oder an den Tag legt. „Mit großer Offenheit auftreten“ ist möglich, verengt die Aussage aber auf öffentliches Auftreten und schwächt die Komponente des mutigen Freimuts etwas ab.
