id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: de
  text: Doch ihr Denken wurde verhärtet. Denn bis zum heutigen Tag bleibt beim Lesen des alten Bundes dieselbe Decke bestehen, ohne dass sie abgenommen wird, weil sie im Messias beseitigt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Satzteil kann auch auf den alten Bund bezogen werden: „weil er im Messias außer Kraft gesetzt wird.“ Die griechische Formulierung lässt den Bezug nicht ausdrücklich erkennen; die Hauptübersetzung versteht die Decke als das nächstliegende Bezugswort.'
    reason: Das unausgesprochene Subjekt von καταργεῖται ist syntaktisch nicht ausdrücklich genannt. Die Anmerkung wahrt diese relevante Mehrdeutigkeit, ohne eine im Griechischen nicht vorhandene Exklusivität hinzuzufügen.
lexical_decisions:
- source_word: ἐπωρώθη τὰ νοήματα αὐτῶν
  choice: ihr Denken wurde verhärtet
  rationale: Gibt den Passiv und die geistige Unempfänglichkeit wieder; „Denken“ bezeichnet hier ihr Wahrnehmungs- und Verständnisvermögen.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: Denn bis auf den heutigen Tag
  rationale: Bewahrt die ausdrückliche zeitliche Betonung und klingt im Deutschen würdig und natürlich.
- source_word: κάλυμμα
  choice: Decke
  rationale: Bewahrt das Bild einer verhüllenden Bedeckung und den Zusammenhang mit Mose; „Decke“ ist die in diesem Kontext natürliche deutsche Bezeichnung.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: beim Lesen
  rationale: Gibt die temporale Situation der Lesung knapp und idiomatisch wieder.
- source_word: παλαιᾶς διαθήκης
  choice: des alten Bundes
  rationale: διαθήκη bedeutet hier „Bund“; die traditionelle Wiedergabe „Altes Testament“ würde die lexikalische Aussage weniger unmittelbar wiedergeben.
- source_word: μὴ ἀνακαλυπτόμενον
  choice: ohne weggenommen zu werden
  rationale: Bezieht das Partizip auf die Decke und bewahrt den Gedanken, dass sie nicht entfernt wird; eine mechanische Wiedergabe mit „enthüllt“ wäre bei der Decke als Subjekt im Deutschen missverständlich.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Gibt Χριστός als Titel wieder und folgt der projektweiten Wiedergabe, ohne ihn als Eigennamen zu behandeln.
- source_word: καταργεῖται
  choice: wird beseitigt
  rationale: Drückt das passive Außerkraftsetzen beziehungsweise Entfernen aus und lässt sich bei der Decke als naheliegendem Bezug sinnvoll lesen.
theological_decisions:
- issue: Bezug von καταργεῖται
  choice: 'Das unausgesprochene Subjekt wird als „dieselbe Decke“ verstanden: „weil sie im Messias beseitigt wird“.'
  alternative: Der alte Bund wird im Messias außer Kraft gesetzt; möglich ist auch, die griechische Formulierung bewusst zwischen Decke und Bund schweben zu lassen.
  rationale: Die Decke ist das nächstliegende grammatische Bezugswort und steht im Mittelpunkt des Bildes. Da der griechische Satz jedoch einen Bezug auf den alten Bund nicht völlig ausschließt, wird diese gewichtige Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Die Bildsprache der Decke bleibt erhalten; „alter Bund“ folgt dem griechischen Wortlaut statt der traditionellen Bezeichnung „Altes Testament“.
