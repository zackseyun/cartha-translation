  terminology: „Messias“ folgt der vorgegebenen Wiedergabe von Χριστός. „Decke“ erhält das Bild aus dem unmittelbaren Mose-Kontext. Die Fußnote darf aus ὅτι jedoch kein exklusives „nur im Messias“ ableiten.
