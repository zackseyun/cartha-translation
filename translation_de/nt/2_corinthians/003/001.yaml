  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: de
  text: Fangen wir wieder an, uns selbst zu empfehlen? Oder brauchen wir etwa, wie manche, Empfehlungsschreiben an euch oder von euch?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα πάλιν
  choice: Fangen wir wieder an
  rationale: Die präsentische rhetorische Frage und der Wiederholungsaspekt von πάλιν werden in natürlichem modernem Deutsch bewahrt.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: uns selbst zu empfehlen
  rationale: Das Reflexivpronomen bleibt ausdrücklich erhalten; „empfehlen“ gibt das günstige Vorstellen oder Beglaubigen im Zusammenhang treffend wieder.
- source_word: ἢ μὴ χρῄζομεν
  choice: Oder brauchen wir etwa
  rationale: „Etwa“ lässt die durch μή signalisierte Erwartung einer verneinenden Antwort erkennen, ohne sie ausdrücklich vorwegzunehmen.
- source_word: ὥς τινες
  choice: wie manche
  rationale: Die unbestimmte Vergleichsgruppe wird knapp und idiomatisch wiedergegeben.
- source_word: συστατικῶν ἐπιστολῶν
  choice: Empfehlungsschreiben
  rationale: Der etablierte moderne Ausdruck bezeichnet Briefe, die jemanden vorstellen und für ihn bürgen.
- source_word: πρὸς ὑμᾶς ἢ ἐξ ὑμῶν
  choice: an euch oder von euch
  rationale: Die Richtungs- und Herkunftsangaben der Präpositionen werden unmittelbar und präzise wiedergegeben.
