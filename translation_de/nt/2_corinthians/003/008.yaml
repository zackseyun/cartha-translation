translation:
  language: de
  text: Wie viel mehr wird dann der Dienst des Geistes von Herrlichkeit geprägt sein?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wird … in Herrlichkeit sein“; auch möglich: „wird … mit Herrlichkeit verbunden sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὐχὶ μᾶλλον
  choice: Wie viel mehr … dann
  rationale: Die griechische rhetorische Frage erwartet nach dem Schluss vom Geringeren auf das Größere eine entschieden bejahende Antwort. Die deutsche Wendung gibt diese Steigerung natürlich wieder, ohne sie in eine bloße Aussage umzuwandeln.
- source_word: ἡ διακονία
  choice: der Dienst
  rationale: „Dienst“ bezeichnet hier den anvertrauten heilsgeschichtlichen Auftrag und bewahrt zugleich die Verbindung zum vorangehenden „Dienst“.
- source_word: τοῦ πνεύματος
  choice: des Geistes
  rationale: Der Kontext von Vers 6 spricht für den Heiligen Geist; die Großschreibung kennzeichnet diesen Bezug, ohne den Genitiv enger festzulegen.
- source_word: ἔσται
  choice: wird … sein
  rationale: Gibt das Futur von εἰμί in modernem Standarddeutsch wieder.
- source_word: ἐν δόξῃ
  choice: von Herrlichkeit geprägt
  rationale: Die Formulierung macht die durch ἐν ausgedrückte Sphäre beziehungsweise Kennzeichnung idiomatisch verständlich und bewahrt „Herrlichkeit“ als Leitwort des Abschnitts.
theological_decisions:
- issue: Bezug von πνεύματος
  choice: Geist als Heiliger Geist
  alternative: Geist in abstraktem oder unpersönlichem Sinn
  rationale: Der unmittelbare Gegensatz zwischen Buchstabe und Geist sowie die Aussage, dass der Geist lebendig macht (Vers 6), stützen den persönlichen Bezug auf den Heiligen Geist.
- issue: Bedeutung des Genitivs τοῦ πνεύματος
  choice: offen als „des Geistes“ wiedergegeben
  alternative: vom Geist bewirkter oder dem Geist zugehöriger Dienst
  rationale: Der griechische Genitiv kann Zugehörigkeit, Ursprung oder Kennzeichnung ausdrücken. Die Übersetzung legt diese Beziehung nicht unnötig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die Steigerung gegenüber Vers 7 bleiben erhalten; „Herrlichkeit“ wird als Schlüsselwort des Zusammenhangs beibehalten.
