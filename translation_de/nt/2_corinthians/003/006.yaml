  rationale: Die Übersetzung selbst benötigt keine inhaltliche Änderung. Die Revision setzt den Anker für die Geist/Geist-Alternative an beide einschlägigen Vorkommen, präzisiert die Begründung der Alternative und entschärft eine zu eng kontextualisierende Fußnotenparaphrase zu »Buchstabe«.
