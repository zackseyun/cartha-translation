source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: de
  text: Er hat uns auch befähigt, Diener eines neuen Bundes zu sein, nicht des Buchstabens, sondern des Geistes[a]. Denn der Buchstabe[b] tötet, der Geist[a] aber macht lebendig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder in beiden Fällen: »Geist« in einem allgemeineren Sinn. Der griechische Text kennzeichnet diese Bedeutungsunterscheidung nicht durch Groß- oder Kleinschreibung.'
    reason: alternative_reading
  - marker: b
    text: »Buchstabe« kann hier auch den geschriebenen Wortlaut meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: befähigt
  rationale: Gibt die von Gott bewirkte Eignung und Bevollmächtigung natürlich wieder, ohne bloße Zulänglichkeit oder eine formale Qualifikation anzudeuten.
- source_word: διακόνους
  choice: Diener
  rationale: Bewahrt den dienstbezogenen Sinn und vermeidet, ein späteres kirchliches Amtsverständnis einzutragen.
- source_word: καινῆς διαθήκης
  choice: eines neuen Bundes
  rationale: Entspricht der artikellosen griechischen Genitivverbindung und lässt zugleich den heilsgeschichtlichen Bezug in Paulus’ Argument erkennen.
- source_word: γράμματος / γράμμα
  choice: des Buchstabens / der Buchstabe
  rationale: Bewahrt Paulus’ knappen, pointierten Gegensatz; eine Wiedergabe als »geschriebenes Gesetz« oder »Gesetzesbuchstabe« wäre stärker deutend.
- source_word: πνεύματος / πνεῦμα
  choice: des Geistes / der Geist
  rationale: Im Zusammenhang des neuen Bundes ist am ehesten der Heilige Geist gemeint. Die Großschreibung zeigt diese Deutung an; die im Griechischen orthografisch nicht unterscheidbare Alternative wird in einer Fußnote bewahrt.
- source_word: ἀποκτέννει
  choice: tötet
  rationale: Gibt die direkte und eindringliche Aussage des griechischen Präsens wieder.
- source_word: ζῳοποιεῖ
  choice: macht lebendig
  rationale: Entspricht eng der aktiven, Leben schaffenden Bedeutung des Verbs und bildet einen prägnanten Gegensatz zu »tötet«.
theological_decisions:
- issue: Ob πνεῦμα als »Geist« im Sinn des Heiligen Geistes oder als »Geist« beziehungsweise »geistiger Sinn« zu verstehen ist
  choice: Geist (mit Großschreibung, als Heiliger Geist verstanden)
  alternative: Geist im allgemeineren Sinn; aufgrund identischer deutscher Schreibung nur durch die Fußnote ausdrücklich kenntlich gemacht
  rationale: Der Zusammenhang des neuen Bundes und die lebenspendende Tätigkeit sprechen am stärksten für den Heiligen Geist. Da die griechische Schrift diese Bedeutungen nicht durch Groß- und Kleinschreibung unterscheidet, bleibt die Alternative ausdrücklich vermerkt.
- issue: Bedeutungsumfang von γράμμα im Gegensatz zu πνεῦμα
  choice: Buchstabe
  alternative: geschriebener Wortlaut; geschriebenes Gesetz; Gesetzesbuchstabe
  rationale: »Buchstabe« erhält die zugespitzte Formulierung und ihre Deutungsoffenheit. Die Fußnote weist darauf hin, dass mehr als ein einzelnes Schriftzeichen gemeint sein kann, ohne den Ausdruck vorschnell auf eine bestimmte Gesetzestheologie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die griechische Satzstruktur. »Diener« ist allgemein verständlich und weniger amtssprachlich als »Amtsträger«. Der zweite Satz bleibt bewusst knapp und pointiert.
