source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: de
  text: Denn wenn der Dienst der Verurteilung von Herrlichkeit begleitet war, wie viel mehr ist dann der Dienst der Gerechtigkeit überreich an Herrlichkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονία
  choice: Dienst
  rationale: „Dienst“ bezeichnet hier natürlich und hinreichend weit die von Paulus einander gegenübergestellten heilsgeschichtlichen Dienste.
- source_word: κατάκρισις
  choice: Verurteilung
  rationale: Der Ausdruck wahrt den forensischen Sinn und bezeichnet das verurteilende Ergebnis, ohne ihn auf einen bloßen Vorgang des Urteilens zu reduzieren.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist im Zusammenhang mit 2. Mose und dem neuen Bund die etablierte, inhaltlich tragfähige Wiedergabe.
- source_word: πολλῷ μᾶλλον
  choice: wie viel mehr
  rationale: Die geläufige deutsche Steigerungsform gibt den Schluss vom Geringeren auf das Größere idiomatisch wieder.
- source_word: περισσεύω
  choice: überreich sein
  rationale: „Überreich sein“ bewahrt den Gedanken des Übermaßes und verbindet sich natürlich mit „an Herrlichkeit“.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ erhält die breite paulinische Bedeutung und lässt offen, ob zugerechnete, verliehene oder verwirklichte Gerechtigkeit im Vordergrund steht.
- source_word: τῇ διακονίᾳ … δόξα
  choice: der Dienst … war von Herrlichkeit begleitet
  rationale: Die griechische erste Hälfte ist ohne ausdrückliches Verb. Die ergänzte Formulierung gibt das Vorhandensein begleitender Herrlichkeit wieder, ohne „sein“ oder „haben“ als im Ausgangstext ausdrücklich gesetzt erscheinen zu lassen.
theological_decisions:
- issue: Genitivverbindungen τῆς κατακρίσεως und τῆς δικαιοσύνης
  choice: „der zur Verurteilung führt“ und „der zur Gerechtigkeit führt“
  alternative: „Dienst der Verurteilung“ und „Dienst der Gerechtigkeit“
  rationale: Die auflösende Wiedergabe macht den kontrastierenden Zusammenhang verständlich, ohne die Dienste unmittelbar mit Verurteilung beziehungsweise Gerechtigkeit gleichzusetzen. Das „führt“ benennt eine naheliegende Ergebnisbeziehung, beansprucht aber keine vollständige Definition.
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtfertigung
  rationale: „Gerechtigkeit“ bewahrt die semantische und theologische Offenheit des griechischen Begriffs; „Rechtfertigung“ würde ihn hier stärker forensisch festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext entfaltet die gedrängten griechischen Genitivverbindungen behutsam und bildet die asymmetrische Steigerung zwischen begleitender und überreicher Herrlichkeit ab.
