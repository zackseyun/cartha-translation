- from: Denn wenn der Dienst, der zur Verurteilung führt, von Herrlichkeit begleitet war, wie viel mehr ist dann der Dienst, der zur Gerechtigkeit führt, überreich an Herrlichkeit.[a]
  to: Denn wenn der Dienst der Verurteilung von Herrlichkeit begleitet war, wie viel mehr ist dann der Dienst der Gerechtigkeit überreich an Herrlichkeit.
  rationale: Die Revision ersetzt die interpretierende Umschreibung „führt zu“ durch die im Griechischen angelegte parallele Genitivkonstruktion. Dadurch bleibt die Bedeutung von κατάκρισις und δικαιοσύνη offen genug und der Kontrast der beiden Dienste tritt klarer hervor. Die entbehrliche Fußnote wird entfernt.
