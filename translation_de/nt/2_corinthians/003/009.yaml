review_pass:
  verdict: revise
  source_fidelity: Die Genitivverbindungen τῆς κατακρίσεως und τῆς δικαιοσύνης bezeichnen parallel die beiden Dienste. Die Wiedergabe „der zur … führt“ legt jeweils eine Ergebnisbeziehung aus, die zwar kontextuell naheliegt, aber in dieser Form nicht ausdrücklich im griechischen Text steht. Die direkte, parallele Genitivwiedergabe bewahrt die knappe Ausdrucksweise und Offenheit des Ausgangstextes besser. „von Herrlichkeit begleitet war“ gibt die verblose erste Satzhälfte idiomatisch und ohne unzulässige Zuspitzung wieder; „überreich an Herrlichkeit“ trifft περισσεύει δόξῃ angemessen.
  naturalness: Der revidierte Satz ist modernes, würdiges Standarddeutsch und erhält die rhetorische Steigerung „wenn … wie viel mehr“. Die direkte Parallelität „Dienst der Verurteilung / Dienst der Gerechtigkeit“ ist klar und stilistisch natürlich.
  terminology: „Dienst“, „Verurteilung“, „Herrlichkeit“ und „Gerechtigkeit“ sind sachgerecht. „Gerechtigkeit“ gibt δικαιοσύνη breit wieder und vermeidet eine konfessionell oder systematisch engere Festlegung wie „Rechtfertigung“.
  issues:
  - severity: medium
    issue: Interpretierende Auflösung der Genitive durch „der zur Verurteilung führt“ und „der zur Gerechtigkeit führt“
    rationale: Das griechische τῆς κατακρίσεως / τῆς δικαιοσύνης enthält keine explizite Verbverbindung „führt zu“. Diese Ergänzung verschiebt die knappe, parallele Benennung in eine bestimmte kausale Ergebnisrelation und sollte im Haupttext nicht hinzugefügt werden.
  - severity: low
    issue: Fußnote als angeblich wörtlichere Alternative
    rationale: Die Fußnote ist für den Text nicht erforderlich und bietet keine entscheidende, nicht im Haupttext ausdrückbare Textvariante. Zudem ist „verblieblose“ sprachlich fehlerhaft; gemeint wäre „verblose“.
  revised_text: Denn wenn der Dienst der Verurteilung von Herrlichkeit begleitet war, wie viel mehr ist dann der Dienst der Gerechtigkeit überreich an Herrlichkeit.
