  yaml_path: translation/nt/2_corinthians/003/004.yaml
  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: de
  text: Eine solche Zuversicht haben wir durch den Messias Gott gegenüber.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Christus“.'
    reason: Traditionelle Wiedergabe von Χριστός.
  - marker: b
    text: 'Oder wörtlicher: „auf Gott hin“; die Wendung kann die Ausrichtung auf Gott oder das Verhältnis zu Gott bezeichnen.'
    reason: πρὸς τὸν θεόν ist in dieser Verbindung semantisch nicht auf eine einzige deutsche Umschreibung festzulegen.
lexical_decisions:
- source_word: Πεποίθησιν
  choice: Vertrauen
  rationale: „Vertrauen“ gibt die gefestigte Zuversicht im Zusammenhang natürlich wieder, ohne lediglich ein subjektives Gefühl zu bezeichnen.
- source_word: δὲ τοιαύτην
  choice: Solches
  rationale: „Solches“ nimmt den vorherigen Gedankengang auf und bewahrt die qualitative Kraft von τοιαύτην; δέ bleibt als leichter Übergang im deutschen Satzfluss unausgedrückt.
- source_word: ἔχομεν
  choice: haben wir
  rationale: Die schlichte Wiedergabe entspricht dem gewöhnlichen Sinn von ἔχομεν.
- source_word: διὰ τοῦ Χριστοῦ
  choice: durch den Messias
  rationale: διά mit Genitiv bezeichnet hier die Vermittlung; Χριστός wird in seiner Titelfunktion als „Messias“ wiedergegeben.
- source_word: πρὸς τὸν θεόν
  choice: auf Gott hin
  rationale: Die Formulierung bewahrt die gerichtete, relationale Bedeutung von πρός und vermeidet, sie vorschnell als „vor Gott“ oder „bei Gott“ festzulegen.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: den Messias
  alternative: Christus
  rationale: Χριστός hat hier Titelfunktion. „Messias“ macht diese Bedeutung sichtbar; die traditionelle Form „Christus“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- issue: Bezug von πρὸς τὸν θεόν
  choice: auf Gott hin
  alternative: vor Gott
  rationale: Die gewählte Form wahrt die im Griechischen offene Ausrichtung auf Gott, statt sie ausschließlich als Rechenschaft oder Auftreten vor Gott zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Wendung „auf Gott hin“ ist bewusst gewählt, um die gerichtete Bedeutung des griechischen πρός und die damit verbundene Auslegungsoffenheit zu erhalten.
