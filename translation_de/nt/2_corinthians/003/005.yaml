  - severity: low
    issue: „Befähigung“ für ἱκανότης
    rationale: „Befähigung“ kann im Deutschen den Akt oder Prozess des Befähigens bezeichnen. „Fähigkeit“ bezeichnet unmittelbarer die im Text ausgesagte hinreichende Kompetenz bzw. Eignung.
