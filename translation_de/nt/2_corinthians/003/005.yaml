  source_fidelity: Der Entwurf trifft den Grundkontrast grundsätzlich, doch „uns etwas ... anzurechnen“ verschiebt λογίσασθαι in Richtung Selbstlob bzw. Anspruchserhebung. Das griechische Verb bezeichnet hier das Erwägen, Beurteilen oder Rechnen von etwas als aus einem selbst stammend. Außerdem ist „Befähigung“ eher der Vorgang des Befähigens als die gemeinte vorhandene Fähigkeit bzw. Eignung.
  naturalness: Die Satzstruktur ist verständlich, aber „uns etwas als aus uns selbst kommend anzurechnen“ klingt im heutigen Standarddeutsch semantisch enger und weniger natürlich als eine Formulierung mit „beurteilen“ oder „erwägen“. „Fähigkeit“ ist für ἱκανότης idiomatischer als „Befähigung“ und bewahrt zugleich die Verbindung zu „fähig“.
  terminology: „fähig/Fähigkeit“ gibt ἱκανοί/ἱκανότης konsistent und ohne unzulässige Einengung auf Amts- oder Dienstkompetenz wieder. Die Fußnoten werden an die Wörter bzw. Wendungen gesetzt, die sie tatsächlich erläutern.
