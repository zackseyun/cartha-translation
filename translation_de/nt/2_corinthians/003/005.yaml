source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: de
  text: Nicht dass wir von uns selbst her fähig wären[a], irgendetwas als aus uns selbst kommend zu beurteilen[b]; vielmehr kommt unsere Fähigkeit von Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für „fähig“ und „Fähigkeit“ sind auch „ausreichend“, „tauglich“, „Eignung“ oder „Tauglichkeit“ möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „irgendetwas als von uns selbst ausgehend zu erwägen“; auch: „zu rechnen“ oder „zu beurteilen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Nicht dass
  rationale: Die Wendung leitet eine klarstellende Einschränkung ein und wird im Deutschen natürlich mit „Nicht dass“ wiedergegeben.
- source_word: ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν
  choice: wir von uns aus fähig wären
  rationale: „Von uns aus“ bewahrt den Gedanken einer nicht selbstbegründeten Fähigkeit; „fähig“ ist gegenwärtiges, gut verständliches Deutsch.
- source_word: λογίσασθαί τι
  choice: uns etwas … anzurechnen
  rationale: λογίζομαι bezeichnet ein Erwägen, Berechnen oder Zurechnen. „Sich etwas anrechnen“ passt zum Herkunftsgedanken des folgenden Ausdrucks, ohne ihn auf bloßes Denken zu verengen.
- source_word: ὡς ἐξ αὑτῶν
  choice: als aus uns selbst kommend
  rationale: Die Formulierung macht die im Griechischen bezeichnete vermeintliche Herkunft deutlich und bleibt nahe an der syntaktischen Spannung des Satzes.
- source_word: ἡ ἱκανότης ἡμῶν
  choice: unsere Befähigung
  rationale: „Befähigung“ bezeichnet die ausreichende Fähigkeit oder Tauglichkeit und stellt den von Gott gegebenen Ursprung in den Vordergrund. Der Wortstammzusammenhang mit „fähig“ bleibt hörbar.
- source_word: ἐκ τοῦ θεοῦ
  choice: kommt von Gott
  rationale: Die natürliche deutsche Wendung bewahrt die klare Aussage, dass Gott die Quelle der Befähigung ist.
theological_decisions:
- issue: Reichweite der Aussage über menschliche Fähigkeit
  choice: Die Formulierung bleibt allgemein bei einer nicht aus dem Menschen selbst stammenden Fähigkeit.
  alternative: Die Aussage ausdrücklich auf die apostolische Diensttauglichkeit beschränken.
  rationale: Der Zusammenhang betrifft den apostolischen Dienst, doch der griechische Wortlaut ist weiter gefasst. Die Übersetzung trägt den Kontext nicht enger in den Vers ein, als dieser selbst formuliert.
- issue: Bedeutung von λογίσασθαι
  choice: „uns etwas … anzurechnen“ bewahrt den Gedanken geistiger Einschätzung und eigener Zuschreibung.
  alternative: „etwas zu denken/zu erwägen“ oder „etwas zu berechnen“.
  rationale: Das Verb ist mehrdeutig. Im Zusammenhang mit „aus uns selbst“ liegt eine Einschätzung beziehungsweise Zuschreibung nahe; die Fußnote hält die weiteren lexikalischen Möglichkeiten offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme des Wortstamms in „fähig/Befähigung“ bildet die griechische Verbindung zwischen ἱκανοί und ἱκανότης ab. Die Wortstellung setzt den Kontrast zwischen menschlicher Eigenquelle und Gottes Gabe deutlich um.
