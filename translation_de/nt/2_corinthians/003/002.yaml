  naturalness: „Ihr seid unser Brief, eingeschrieben in unseren Herzen, erkannt und gelesen von allen Menschen“ ist modernes, verständliches und dem würdigen Register angemessenes Standarddeutsch. Die Paarung „erkannt und gelesen“ ist als bewusste Entfaltung des Briefbildes natürlich.
