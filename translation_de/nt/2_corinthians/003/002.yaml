lexical_decisions:
- source_word: ἐπιστολή
  choice: Brief
  rationale: „Brief“ ist die klare, moderne deutsche Entsprechung für eine schriftliche Mitteilung und bewahrt das Bild des Verses.
- source_word: ἡμῶν
  choice: unser
  rationale: 'Der Genitiv bezeichnet Zugehörigkeit: Die Korinther sind bildlich der Brief des Paulus und seiner Mitarbeiter.'
- source_word: ὑμεῖς ἐστε
  choice: Ihr seid
  rationale: Die direkte Prädikatsaussage ist im Deutschen natürlich; das ausdrücklich gesetzte Pronomen bleibt erhalten.
- source_word: ἐγγεγραμμένη
  choice: eingeschrieben
  rationale: Das Perfektpartizip bezeichnet etwas, das eingeschrieben worden ist und eingeschrieben bleibt. „Eingeschrieben“ wahrt das Schriftbild stärker als das allgemeinere „geschrieben“.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: in unsere Herzen
  rationale: „In“ entspricht ἐν und ist mit „eingeschrieben“ im Deutschen idiomatisch; „Herzen“ bezeichnet hier das innere Denken, Wollen und Empfinden.
- source_word: γινωσκομένη
  choice: erkannt
  rationale: Das Verb kann „gekannt“ oder „erkannt“ bedeuten. „Erkannt“ ergibt zusammen mit „gelesen“ eine natürliche deutsche Paarung, ohne die mögliche Bedeutungsnähe zu „bekannt“ auszuschließen.
- source_word: ἀναγινωσκομένη
  choice: gelesen
  rationale: Die wörtliche Bedeutung „gelesen“ hält das Briefbild deutlich aufrecht.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: von allen Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein und nicht ausschließlich Männer; „alle Menschen“ gibt den umfassenden Ausdruck formal und verständlich wieder.
