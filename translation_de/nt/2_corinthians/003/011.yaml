base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: de
  text: Denn wenn schon das, was aufgehoben wird, mit Herrlichkeit verbunden war[a], wie viel mehr ist das Bleibende in Herrlichkeit!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch Herrlichkeit“. Oder: „wenn schon das, was zu Ende gebracht wird, mit Herrlichkeit verbunden war“. Für „aufgehoben wird“ sind auch „beseitigt wird“ oder, stärker kontextbezogen, „vergeht“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: das, was beseitigt wird
  rationale: Das substantivierte Partizip bezeichnet etwas, das unwirksam gemacht, aufgehoben oder zu Ende gebracht wird. „Beseitigt wird“ gibt den Vorgang direkt wieder, ohne das im Kontext mögliche Bild des Verblassens in den Haupttext einzutragen.
- source_word: διὰ δόξης
  choice: durch Herrlichkeit geschieht
  rationale: διά mit Genitiv wird formal als „durch“ wiedergegeben. Das ergänzte „geschieht“ macht die elliptische deutsche Formulierung verständlich, ohne die Herrlichkeit lediglich als Begleitumstand zu deuten.
- source_word: μένον
  choice: das Bleibende
  rationale: Das substantivierte Präsenspartizip bezeichnet das, was bleibt, fortbesteht oder Bestand hat. „Das Bleibende“ bewahrt die knappe Parallelstruktur.
- source_word: ἐν δόξῃ
  choice: in Herrlichkeit
  rationale: Die Präpositionalphrase wird direkt wiedergegeben und gegenüber „durch Herrlichkeit“ bewusst nicht angeglichen.
- source_word: πολλῷ μᾶλλον
  choice: wie viel mehr
  rationale: Die geläufige deutsche Steigerungsform gibt den verstärkten Vergleich idiomatisch wieder.
theological_decisions:
- issue: Gegenüberstellung des Vorläufigen und des Bleibenden
  choice: Die unbenannten substantivierten Partizipien bleiben unbenannt; der Vers spricht von „dem, was beseitigt wird“, und „dem Bleibenden“.
  alternative: Im Haupttext ausdrücklich vom alten und neuen Bund oder von ihren Diensten zu sprechen.
  rationale: Der unmittelbare Kontext legt diese Zuordnung nahe, doch der griechische Vers selbst nennt sie nicht. Die Übersetzung bewahrt daher die rhetorische Offenheit und fügt keine ausdrückliche Identifikation ein.
- issue: Bedeutung von καταργούμενον
  choice: „beseitigt wird“
  alternative: „vergeht“, „zu Ende gebracht wird“ oder „aufgehoben wird“
  rationale: Die gewählte Form wahrt den passiven, prozesshaften Charakter und legt weder ausschließlich ein allmähliches Verblassen noch eine bestimmte dogmatische Art der Aufhebung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antithetische Struktur des griechischen Satzes bleibt erhalten; das Ausrufezeichen bildet die rhetorische Steigerung ab. Der Fußnotenmarker steht unmittelbar bei der betroffenen ersten Satzhälfte.
