  terminology: „Aufgehoben wird“ ist für καταργούμενον präzise und im theologischen Register verständlich, ohne eine bestimmte dogmatische Folgerung festzulegen. „Das Bleibende“ und „in Herrlichkeit“ bewahren die knappe, kontrastierende Ausdrucksweise des Ausgangstextes.
