  source_fidelity: 'Die Gegenüberstellung der substantivierten Partizipien ist im Entwurf grundsätzlich zutreffend: καταργούμενον bezeichnet das Aufgehobene bzw. zu Ende Gebrachte, μένον das Bleibende. Die unbenannten Bezugsgrößen werden angemessen nicht zu „altem“ und „neuem Bund“ expliziert. Allerdings ist „durch Herrlichkeit geschieht“ im Deutschen semantisch und syntaktisch missverständlich: Es lässt Herrlichkeit wie die Ursache dafür erscheinen, dass etwas „geschieht“, obwohl der elliptische griechische Ausdruck die Herrlichkeit als Kennzeichen bzw. Begleitumstand des ersten Glieds kontrastiv zu ἐν δόξῃ hervorhebt.'
