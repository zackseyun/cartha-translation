source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: de
  text: Wenn aber schon der Dienst des Todes, mit Buchstaben in Steine eingraviert, mit Herrlichkeit kam, sodass die Söhne Israels[b] wegen der Herrlichkeit seines Angesichts, die verging[a], Mose nicht unverwandt ins Gesicht blicken konnten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die im Verschwinden begriffen war“ oder „die beseitigt wurde“.'
    reason: alternative_reading
  - marker: b
    text: „Die Söhne Israels“ kann auch mit „die Israeliten“ wiedergegeben werden; die maskuline Ausdrucksweise wurde beibehalten, um das Griechische genauer abzubilden.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: Dienst
  rationale: „Dienst“ bewahrt sowohl den Gedanken des Dienens als auch den eines anvertrauten Auftrags und passt zu Paulus’ Gegenüberstellung der beiden Dienste.
- source_word: τοῦ θανάτου
  choice: des Todes
  rationale: Der knappe Genitiv erhält Paulus’ zugespitzte Formulierung, ohne sie deutend zu „todbringend“ zu erweitern.
- source_word: ἐν γράμμασιν
  choice: mit Buchstaben
  rationale: Die Formulierung wahrt den Bezug auf das Geschriebene und die im Kontext angelegte Gegenüberstellung zum Geist; im Deutschen verbindet sie sich natürlich mit „eingraviert“.
- source_word: ἐντετυπωμένη λίθοις
  choice: in Steine eingraviert
  rationale: Das Partizip bezeichnet ein Einprägen oder Eingravieren. Der Plural „Steine“ bleibt näher am griechischen Wortlaut als die deutendere Wiedergabe „Steintafeln“.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: kam mit Herrlichkeit
  rationale: Diese Wiedergabe erhält den ereignishaften Sinn von ἐγενήθη und gibt ἐν δόξῃ in natürlichem Deutsch als begleitende Herrlichkeit wieder.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: sodass … nicht unverwandt … blicken konnten
  rationale: Die Ergebniskonstruktion bleibt erhalten; „unverwandt blicken“ bringt den anhaltenden, festen Blick von ἀτενίζω zum Ausdruck.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die traditionelle und quellennähere Wendung bildet den ausdrücklich maskulinen griechischen Ausdruck ab; eine Fußnote nennt die natürlichere kollektive Alternative.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: auf Moses Gesicht
  rationale: Die Formulierung ist im Deutschen idiomatisch und bewahrt den konkreten Bezug auf Moses Gesicht.
- source_word: καταργουμένην
  choice: die verging
  rationale: Im unmittelbaren Zusammenhang bezieht sich das Partizip auf die sichtbare Herrlichkeit von Moses Gesicht. „Verging“ lässt sowohl ihr Nachlassen als auch ihr Zu-Ende-Kommen anklingen, ohne die weitere theologische Aussage vollständig festzulegen.
theological_decisions:
- issue: Ob καταργουμένην als sichtbares Verblassen oder abstrakter als Beseitigung beziehungsweise Beendigung wiederzugeben ist.
  choice: einer Herrlichkeit, die verging
  alternative: einer Herrlichkeit, die beseitigt wurde / im Verschwinden begriffen war
  rationale: Der unmittelbare Bezug auf die Herrlichkeit von Moses Gesicht spricht für eine anschauliche Wiedergabe. „Verging“ bewahrt zugleich die Aussage von ihrer Vorläufigkeit und legt nicht ausschließlich fest, ob ein allmähliches Verblassen oder ein Zu-Ende-Kommen gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange paulinische Satzbau wird bewahrt, aber durch Gedankenstriche gegliedert. Das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeht.
