  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: de
  text: Doch sooft man sich dem Herrn zuwendet,[a] wird der Schleier entfernt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Doch wenn man sich dem Herrn zuwendet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: wird der Schleier weggenommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Doch sooft
  rationale: Die Verbindung leitet einen unbestimmten, potenziell wiederholten Zeitpunkt ein. „Sooft“ gibt diese iterative bzw. allgemeine Bedeutung knapp wieder; „doch“ bewahrt die weiterführende und kontrastierende Funktion von δέ.
- source_word: ἐπιστρέψῃ
  choice: sich … zuwendet
  rationale: Das Verb bezeichnet hier eine Hinwendung und bleibt damit weiter als eine ausdrücklich dogmatische Formulierung wie „sich bekehrt“. Der Aorist Konjunktiv wird nach dem unbestimmten Zeitausdruck im Deutschen natürlich im Präsens wiedergegeben.
- source_word: πρὸς κύριον
  choice: dem Herrn
  rationale: Bei „sich zuwenden“ steht das Ziel im Deutschen idiomatisch im Dativ. Die gerichtete Hinwendung von πρός bleibt dabei erhalten.
- source_word: κύριον
  choice: Herrn
  rationale: „Herr“ ist die sachgemäße Wiedergabe des Titels κύριος und wahrt den Bezug auf den Exodus-Kontext, ohne die genaue Identität innerhalb des unmittelbaren paulinischen Zusammenhangs ausdrücklich festzulegen.
- source_word: περιαιρεῖται
  choice: wird … entfernt
  rationale: Die passive Form bleibt erhalten, ohne einen handelnden Urheber hinzuzufügen. „Entfernt“ ist in modernem Deutsch natürlich; „weggenommen“ bleibt als nähere formale Alternative in der Fußnote erhalten.
- source_word: τὸ κάλυμμα
  choice: der Schleier
  rationale: „Schleier“ bezeichnet im Deutschen verständlich die Gesichtsverhüllung des Mose und trägt zugleich das im Abschnitt entwickelte Bild. Das allgemeinere „Bedeckung“ wäre weniger idiomatisch.
theological_decisions:
- issue: Das im Griechischen nicht ausdrücklich genannte Subjekt von ἐπιστρέψῃ
  choice: Unbestimmte Wiedergabe mit „man“
  alternative: „jemand“ oder ein aus dem Kontext ergänztes „Israel“
  rationale: Die Verbform enthält kein genanntes Substantiv als Subjekt. „Man“ bewahrt den allgemeinen, nicht näher festgelegten Bezug und vermeidet es, die Aussage ausdrücklich auf eine einzelne Person oder auf Israel als Kollektiv festzulegen.
- issue: Die Identität des „Herrn“ im Zusammenhang
  choice: Nur „der Herr“
  alternative: „Christus“ oder „der Herr, nämlich der Geist“
  rationale: Der Vers selbst hat lediglich κύριον. Die komplexe Beziehung zwischen Herr, Christus und Geist im weiteren Kontext wird daher nicht schon in der Übersetzung dieses Verses aufgelöst.
- issue: Der nicht genannte Handelnde beim Entfernen des Schleiers
  choice: Passiv ohne ergänzten Urheber
  alternative: „Der Herr entfernt den Schleier“ oder „Gott entfernt den Schleier“
  rationale: Das griechische Passiv nennt keinen Handelnden. Die deutsche Passivkonstruktion wahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sooft“ ist knapp und gut verständlich; „sich dem Herrn zuwenden“ wahrt die Bewegungsmetapher, ohne sie konfessionell als feststehenden Bekehrungsbegriff zu verengen.
