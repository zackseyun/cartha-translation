review_pass:
  verdict: approve
  source_fidelity: „Doch sooft man sich dem Herrn zuwendet“ gibt die indefinite, potenziell iterative Zeitangabe ἡνίκα δὲ ἐάν mit Aoristkonjunktiv angemessen wieder. „Sich ... zuwenden“ bildet ἐπιστρέφειν πρὸς nach, ohne die Wendung unnötig als ausdrückliche Bekehrung zu bestimmen. Das ungenannte Subjekt wird mit dem allgemeinen „man“ idiomatisch ergänzt, entsprechend der im englischen Audit gewählten allgemeinen Lesart. „wird der Schleier entfernt“ wahrt das unpersönliche Passiv von περιαιρεῖται und lässt den Handelnden offen.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und wahrt einen würdigen biblischen Registerton. „Sooft“ ist verständlich, prägnant und transportiert die wiederholte bzw. unbestimmt-allgemeine zeitliche Nuance besser als ein bloßes „wenn“.
  terminology: „Herr“ für κύριος und „Schleier“ für κάλυμμα sind kontextgerecht, insbesondere angesichts des Mose-Schleier-Motivs. Die Übersetzung legt weder die im Kontext diskutierte Identität des Herrn noch den Urheber der Entfernung aus.
