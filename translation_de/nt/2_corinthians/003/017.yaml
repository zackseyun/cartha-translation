id: 2CO.3.17
reference: 2 Corinthians 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: de
  text: Der Herr aber ist der Geist[a]; und wo der Geist des Herrn ist, da ist Freiheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage „Der Herr ist der Geist“ kann als enge, vom Zusammenhang bestimmte Identifikation verstanden werden, ohne damit theologisch abschließend festzulegen, wie das Verhältnis zwischen dem Herrn und dem Geist zu bestimmen ist.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ entspricht dem üblichen biblischen Gebrauch von κύριος und bewahrt den theologischen Gehalt der Aussage.
- source_word: πνεῦμα
  choice: Geist
  rationale: Die Großschreibung zeigt an, dass in beiden Vorkommen Gottes Geist gemeint ist; die Übersetzung legt jedoch die genaue theologische Beziehung nicht weiter aus.
- source_word: δὲ
  choice: aber / und
  rationale: Das erste δέ wird als „aber“ wiedergegeben und markiert den argumentativen Anschluss mit leichter Gegenüberstellung; das zweite wird im Deutschen natürlich durch „und“ aufgenommen.
- source_word: οὗ
  choice: wo
  rationale: „Wo“ gibt den lokativen Sinn knapp und idiomatisch wieder, ohne ihn zum ausdrücklicheren „überall, wo“ zu erweitern.
- source_word: ἐλευθερία
  choice: Freiheit
  rationale: „Freiheit“ ist die natürliche moderne Entsprechung und bewahrt das theologische Gewicht des griechischen Begriffs.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Der Herr aber ist der Geist
  rationale: Die Gleichsetzung wird ebenso direkt wie im Griechischen wiedergegeben. Die Wortstellung mit „aber“ klingt im Deutschen würdig und wahrt den argumentativen Anschluss.
- source_word: τὸ πνεῦμα κυρίου
  choice: der Geist des Herrn
  rationale: Die Genitivverbindung wird ausdrücklich beibehalten und bewahrt ihre biblischen Anklänge.
theological_decisions:
- issue: Die Aussage „Der Herr ist der Geist“ lässt sich theologisch unterschiedlich bestimmen.
  choice: Die Gleichsetzung wird im Haupttext ohne abschwächende Umschreibung wiedergegeben.
  alternative: Man kann sie als enge kontextuelle, funktionale oder heilsgeschichtliche Identifikation verstehen, ohne daraus eine erschöpfende Aussage über das Verhältnis von Herrn und Geist abzuleiten; zudem kann „der Herr“ hier insbesondere auf Christus oder allgemeiner auf Gott bezogen werden.
  rationale: Der griechische Text formuliert die Identifikation unmittelbar. Die Übersetzung bewahrt diese Spannung und überlässt ihre genauere dogmatische Bestimmung der Auslegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das korrelative „wo … da“ ist idiomatisch und verdeutlicht die Beziehung der beiden Satzteile, ohne den Sinn auszuweiten.
