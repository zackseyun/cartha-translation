revisions:
- from: Denn sogar das, was verherrlicht worden war, ist in dieser Hinsicht nicht verherrlicht, und zwar wegen der alles überragenden Herrlichkeit.
  to: Denn auch das Verherrlichte ist in dieser Hinsicht nicht verherrlicht worden wegen der alles überragenden Herrlichkeit.
  rationale: Die Revision gibt καὶ γάρ mit „Denn auch“ wieder, entfernt die nicht erforderliche Einfügung „und zwar“ und formuliert das zweite Perfektpassiv explizit. Die vergleichende, paradoxe Negation bleibt durch „in dieser Hinsicht“ gewahrt; weder der frühere Gegenstand noch ein Vergleichsobjekt wird über den griechischen Text hinaus spezifiziert.
