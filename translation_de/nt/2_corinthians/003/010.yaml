  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: de
  text: Denn auch das Verherrlichte ist in dieser Hinsicht nicht verherrlicht worden wegen der alles überragenden Herrlichkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn sogar
  rationale: „Denn“ bewahrt den begründenden Anschluss, während „sogar“ die verstärkende Kraft von καί wiedergibt und den paradoxen Vergleich hervorhebt.
- source_word: οὐ δεδόξασται
  choice: ist … nicht verherrlicht
  rationale: Das Perfekt Passiv und die Wortstammverbindung zu δόξα bleiben erhalten; dadurch wird die pointierte vergleichende Aussage nicht zu „hat keine Herrlichkeit“ abgeflacht.
- source_word: τὸ δεδοξασμένον
  choice: das, was verherrlicht worden war
  rationale: Die substantivierte Perfekt-Passiv-Partizipialform wird ohne ergänztes Bezugswort wiedergegeben. Das Plusquamperfekt markiert im Deutschen natürlich die vorausliegende Verherrlichung.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: in dieser Hinsicht
  rationale: Die idiomatische Formulierung begrenzt die Verneinung auf den vorliegenden Vergleich und vermeidet eine absolute Leugnung der früheren Herrlichkeit.
- source_word: εἵνεκεν
  choice: wegen
  rationale: „Wegen“ gibt den kausalen Zusammenhang knapp und natürlich wieder.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: der alles überragenden Herrlichkeit
  rationale: Das Partizip bezeichnet eine Herrlichkeit, die über das Vergleichene hinausgeht. „Alles“ ist idiomatisch, macht jedoch kein ausdrücklich im Griechischen genanntes Objekt fest und vermeidet so eine unnötige Auflösung der Ellipse.
- source_word: δόξα / δεδοξασμένον
  choice: verherrlicht … Herrlichkeit
  rationale: Die gemeinsame deutsche Wortwurzel bildet das griechische Wortspiel der δοξ-Wortgruppe sichtbar nach.
theological_decisions:
- issue: Bestreitet Paulus die Herrlichkeit des früheren Dienstes absolut oder nur vergleichsweise?
  choice: Die frühere Herrlichkeit gilt in der hier betrachteten Hinsicht angesichts der überragenden Herrlichkeit als nicht verherrlicht.
  alternative: Dem früheren Dienst wird jede wirkliche Herrlichkeit abgesprochen.
  rationale: ἐν τούτῳ τῷ μέρει schränkt die Verneinung ein; zudem bezeichnet der Kontext das Frühere ausdrücklich als verherrlicht. Die Spannung der paradoxen Aussage bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst paradoxe Wiederholung „verherrlicht … nicht verherrlicht“ folgt der griechischen Rhetorik; „und zwar“ verdeutlicht den begründenden Anschluss des letzten Satzglieds, ohne die Aussage theologisch auszubauen.
