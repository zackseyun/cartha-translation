review_pass:
  verdict: revise
  source_fidelity: 'Die Aussage wird grundsätzlich vergleichend verstanden und die δοξ-/„verherrlich-“-Wortverbindung wird zutreffend sichtbar gehalten. „Denn sogar“ trifft καὶ γάρ jedoch weniger genau als „Denn auch“: καί verstärkt hier den begründenden Anschluss, bedeutet aber nicht vorrangig „sogar“. Das ergänzende „und zwar“ hat keine ausdrückliche Grundlage im griechischen Satz.'
  naturalness: Die paradoxe Formulierung ist absichtlich und darf nicht geglättet werden. „Das Verherrlichte“ ist als substantiviertes Partizip im würdevollen Bibelregister verständlich; die vollständige Perfektpassivform „ist ... nicht verherrlicht worden“ ist dabei klarer als das prädikative „ist ... nicht verherrlicht“.
  terminology: „Herrlichkeit“ und „verherrlicht“ geben die gemeinsame δοξ-Wortgruppe angemessen wieder. „Alles überragend“ vermittelt ὑπερβαλλούσης natürlich, ohne ein im griechischen Text nicht genanntes Vergleichsobjekt festzulegen.
  issues:
  - severity: medium
    issue: „sogar“ für καὶ γάρ
    rationale: „Sogar“ legt nahe, dass ein überraschender Sonderfall hervorgehoben wird. In diesem Kontext ist „Denn auch“ die nähere und idiomatischere Wiedergabe der Verbindung καὶ γάρ.
  - severity: low
    issue: „und zwar“ ist hinzugefügt
    rationale: εἵνεκεν leitet schlicht den Grund ein. „Und zwar“ ist nicht nötig und verschiebt den Ton leicht in Richtung einer nachträglichen Erläuterung.
  - severity: low
    issue: Prädikative Form „ist ... nicht verherrlicht“
    rationale: Sie kann im Deutschen wie eine gegenwärtige Eigenschaft wirken. „Ist ... nicht verherrlicht worden“ bildet das griechische Perfektpassiv eindeutiger ab und erhält die rhetorische Wiederholung.
  revised_text: Denn auch das Verherrlichte ist in dieser Hinsicht nicht verherrlicht worden wegen der alles überragenden Herrlichkeit.
