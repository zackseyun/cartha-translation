source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: de
  text: Dabei wird offenbar, dass ihr ein Brief des Messias[a] seid, von uns vermittelt, geschrieben nicht mit Tinte, sondern mit dem Geist des lebendigen Gottes, nicht auf steinerne Tafeln, sondern auf Tafeln – Herzen aus Fleisch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Brief, der vom Messias stammt«. Der griechische Genitiv kann Herkunft oder Urheberschaft, aber auch Zugehörigkeit ausdrücken. Traditionell wird Χριστός mit »Christus« wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: »Herzen aus Fleisch« greift die alttestamentliche Verheißung eines neuen, empfänglichen Herzens auf; siehe besonders Hesekiel 11,19 und 36,26.
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: Dabei wird offenbar
  rationale: Das passive Partizip bezeichnet, dass die Korinther als Brief erkennbar bzw. offenbar werden; die Formulierung schließt natürlich an den vorherigen Satz an.
- source_word: ἐπιστολὴ
  choice: Brief
  rationale: Die geläufige moderne Entsprechung bewahrt das Bild ohne altertümliche Kirchensprache.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist ein Titel und wird bedeutungsgetreu mit „Messias“ wiedergegeben. Der deutsche Genitiv bewahrt die mögliche Bedeutung von Zugehörigkeit, Urheberschaft oder Herkunft, ohne sie einseitig festzulegen.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: durch unseren Dienst zustande gekommen
  rationale: Die passive Form bezeichnet die vermittelnde Dienstleistung des Paulus und seiner Mitarbeiter. Die Wendung vermeidet das missverständliche „von uns bedient“ und legt das Briefbild nicht auf bloßes Austragen fest.
- source_word: ἐγγεγραμμένη
  choice: geschrieben
  rationale: Die natürliche deutsche Entsprechung passt zum Gegensatz zwischen Tinte und Geist.
- source_word: μέλανι
  choice: Tinte
  rationale: Direkte und idiomatische Entsprechung innerhalb des Schreibbildes.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: mit dem Geist des lebendigen Gottes
  rationale: Der Zusammenhang weist auf Gottes Geist als Handelnden hin; die Formulierung erhält den instrumentalen Dativ und die Bezeichnung „lebendiger Gott“.
- source_word: πλαξὶν λιθίναις
  choice: steinerne Tafeln
  rationale: Natürliches Deutsch, das zugleich die Anspielung auf die Gesetzestafeln am Sinai bewahrt.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: 'auf Tafeln: auf Herzen aus Fleisch'
  rationale: 'Die Apposition wird durch den Doppelpunkt sichtbar: Die Tafeln sind die Herzen. „Aus Fleisch“ bewahrt den alttestamentlichen Bildkontrast, ohne σαρκίναις hier moralisch als „fleischlich“ zu deuten.'
theological_decisions:
- issue: Bedeutung des Genitivs Χριστοῦ
  choice: ein Brief des Messias
  alternative: ein Brief vom Messias / ein Brief Christi
  rationale: Der Genitiv kann Herkunft bzw. Urheberschaft oder Zugehörigkeit ausdrücken. „Des Messias“ bewahrt diese Offenheit besser als das eindeutigere „vom Messias“; „Messias“ gibt den Titel Χριστός inhaltlich wieder.
- issue: Bezug von πνεύματι
  choice: dem Geist des lebendigen Gottes
  alternative: dem spiritus/geist des lebendigen Gottes
  rationale: Der Gegensatz zu Tinte und der Zusammenhang des neuen Bundes sprechen deutlich für Gottes Geist, ohne dass ein Zusatz wie „Heiliger“ in den Text eingefügt wird.
- issue: Bild der Herzen aus Fleisch
  choice: 'Tafeln: Herzen aus Fleisch'
  alternative: Tafeln fleischerner Herzen / Tafeln aus Fleisch, nämlich Herzen
  rationale: Die Formulierung bewahrt sowohl das Tafelbild als auch die Anspielung auf die erneuerten Herzen bei Ezechiel und macht deutlich, dass „Fleisch“ hier Lebendigkeit und Empfänglichkeit gegenüber Stein bezeichnet, nicht sündige Gesinnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung des vorausgehenden Gedankens erkennbar. Ungewohnte, aber bedeutungstragende Bilder werden nicht geglättet; der Doppelpunkt macht die appositionale Beziehung zwischen „Tafeln“ und „Herzen“ verständlich.
