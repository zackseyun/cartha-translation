  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: de
  text: und nicht wie Mose, der sich immer wieder eine Decke über das Gesicht legte, damit die Israeliten[a] nicht unverwandt auf das Ende dessen blickten, was verging.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf das Ziel oder den Ausgang dessen, was zu Ende ging“.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: wie
  rationale: Leitet den Vergleich mit der vorausgehenden Aussage knapp und natürlich ein.
- source_word: ἐτίθει
  choice: legte sich immer wieder
  rationale: Gibt den durativen beziehungsweise wiederholten Aspekt des Imperfekts im Zusammenhang der Mose-Erzählung wieder.
- source_word: κάλυμμα
  choice: Decke
  rationale: Bezeichnet hier die Gesichtsbedeckung und entspricht dem vertrauten Wortlaut der Mose-Überlieferung; zugleich bleibt das Wort für die weitere Metaphorik des Abschnitts geeignet.
- source_word: ἐπὶ τὸ πρόσωπον αὐτοῦ
  choice: über das Gesicht
  rationale: Gibt die örtliche Beziehung und die natürliche deutsche Ausdrucksweise wieder; das reflexive „sich“ bei „legte“ macht deutlich, dass es sein eigenes Gesicht war.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: damit ... nicht unverwandt ... blickten
  rationale: Bewahrt sowohl den finalen Sinn der Konstruktion als auch die Bedeutung eines anhaltenden, festen Hinsehens in ἀτενίζω.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: die Israeliten
  rationale: Gibt die griechische Wendung „Söhne Israels“ idiomatisch und inklusiv als Bezeichnung des Volkes wieder; die wörtliche Form wird in einer Fußnote dokumentiert.
- source_word: εἰς τὸ τέλος
  choice: auf das Ende
  rationale: „Ende“ passt zur unmittelbaren Gegenüberstellung von Vergänglichem und Bleibendem, ohne die mögliche Bedeutung „Ziel/Ausgang“ zu verschweigen.
- source_word: τοῦ καταργουμένου
  choice: dessen, was verging
  rationale: Das substantivierte Partizip bezeichnet etwas, das außer Wirksamkeit tritt beziehungsweise zu Ende geht. „verging“ ist im Kontext natürlich und vermeidet eine unnötig starke dogmatische Festlegung wie „abgeschafft wurde“.
theological_decisions:
- issue: Bedeutung von τέλος τοῦ καταργουμένου
  choice: „das Ende dessen, was verging“
  alternative: „das Ziel/der Ausgang dessen, was zu Ende gebracht wurde“
  rationale: Der unmittelbare Kontext stellt das Vorübergehende dem Bleibenden gegenüber und spricht daher für das Ende beziehungsweise Aufhören. Da τέλος jedoch auch „Ziel“ oder „Ausgang“ und καταργουμένου ein Zu-Ende-Bringen bezeichnen kann, wird diese echte Mehrdeutigkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unverwandt blicken“ wahrt die Intensität des griechischen Verbs, ohne altertümlich zu wirken. Die Satzstruktur bleibt nahe am Griechischen, ist aber im Deutschen flüssig; beide Fußnotenmarker stehen an den jeweils einschlägigen Textstellen.
