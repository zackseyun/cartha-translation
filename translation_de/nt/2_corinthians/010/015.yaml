  to: Wir rühmen uns nicht über das Maß hinaus der Arbeit anderer, sondern hoffen, dass wir, wenn euer Glaube wächst, unter euch entsprechend unserem Wirkungsbereich[a] in reichem Maß[c] größeren Raum gewinnen werden.[b]
  rationale: Die Revision beseitigt die unnötige Verstärkung durch „noch weit“ und gibt εἰς περισσείαν mit „in reichem Maß“ eigenständig wieder. Sie verbessert die deutsche Kollokation bei „sich rühmen“ und setzt die Fußnotenanker an die jeweils erläuterten Ausdrücke. Die Übersetzung bleibt hinsichtlich der umstrittenen bzw. kontextuell mehrdeutigen Nuance von μεγαλυνθῆναι zurückhaltend; die Fußnote dokumentiert die wörtlich passive Form und beide kontextuell möglichen Akzente.
