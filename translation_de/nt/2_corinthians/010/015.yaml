translation:
  language: de
  text: Wir rühmen uns nicht über das Maß hinaus der Arbeit anderer, sondern hoffen, dass wir, wenn euer Glaube wächst, unter euch entsprechend unserem Wirkungsbereich[a] in reichem Maß[c] größeren Raum gewinnen werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unserem zugemessenen Maß entsprechend“ oder „unserer Richtschnur entsprechend“. Das griechische Wort bezeichnet hier einen abgegrenzten beziehungsweise bemessenen Wirkungsbereich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „dass wir unter euch groß gemacht werden“ oder „vergrößert werden“. Gemeint sein kann die Ausweitung von Paulus’ apostolischem Wirken; möglich ist auch der Nebenton, dass seine Bedeutung bei den Korinthern zunimmt.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „im Überfluss“ beziehungsweise „zu weiterer Ausdehnung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: Dabei rühmen wir uns nicht über das Maß hinaus
  rationale: Die Wendung bezeichnet ein Rühmen, das die gesetzten Grenzen überschreitet. „Über das Maß hinaus“ bewahrt das Maß- und Grenzbild des griechischen Textes und den Wortanschluss an den Zusammenhang.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: mit der mühevollen Arbeit anderer
  rationale: κόποι bezeichnet anstrengende Arbeit oder Mühe, ἀλλοτρίοις das, was anderen gehört. Die Formulierung macht natürlich verständlich, dass Paulus nicht die Arbeit anderer für sich beansprucht.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: Vielmehr hoffen wir
  rationale: Die verbale Wiedergabe ist im modernen Deutschen natürlicher als „Hoffnung habend“, ohne den Gehalt der nominalen griechischen Wendung zu verändern.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: wenn euer Glaube wächst
  rationale: Der Genitivus absolutus wird als zeitlich-bedingte Begleitumstandsangabe wiedergegeben. πίστις bezeichnet hier am ehesten den Glauben der korinthischen Gemeinde.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: dass wir … unter euch … noch weit größeren Raum gewinnen werden
  rationale: Die räumliche Metapher gibt im Zusammenhang die Ausweitung von Paulus’ Wirken wieder, lässt aber auch den möglichen Nebenton größerer Anerkennung unter den Korinthern bestehen. ἐν ὑμῖν wird syntaktisch mit μεγαλυνθῆναι verbunden.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: unserem Wirkungsbereich entsprechend
  rationale: κανών bezeichnet im unmittelbaren Zusammenhang den bemessenen Bereich apostolischer Tätigkeit, nicht einen späteren kirchlichen Kanon. „Wirkungsbereich“ ist verständlich und bewahrt die Vorstellung eines abgegrenzten Feldes.
- source_word: εἰς περισσείαν
  choice: noch weit größeren
  rationale: Die Formulierung bringt die auf weitere, reiche Ausdehnung gerichtete Bewegung von εἰς περισσείαν in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Bedeutung von μεγαλυνθῆναι im Blick auf den apostolischen Dienst
  choice: Die Wendung wird als Gewinnung eines größeren Raums für Paulus und sein Wirken unter den Korinthern wiedergegeben.
  alternative: Paulus werde von den Korinthern höher geachtet oder persönlich groß gemacht.
  rationale: Der Zusammenhang handelt von abgegrenzten Arbeitsfeldern und davon, sich nicht mit fremder Arbeit zu rühmen. Die räumliche Formulierung passt daher zur Ausweitung des apostolischen Wirkens, ohne einen möglichen Anerkennungsaspekt völlig auszuschließen.
- issue: Bedeutung von κανών
  choice: Wirkungsbereich
  alternative: Richtschnur, Regel oder zugemessenes Maß
  rationale: Im Kontext bezeichnet κανών einen bemessenen Tätigkeitsbereich. Die gewählte Übersetzung vermeidet sowohl die missverständliche Bedeutung „kirchlicher Kanon“ als auch eine unnötig abstrakte Formulierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Maß-, Grenz- und Raummetaphorik des Abschnitts bleibt erkennbar. Der einleitende Anschluss „Dabei“ trägt dem partizipialen Beginn des griechischen Verses Rechnung; die lange griechische Konstruktion wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
