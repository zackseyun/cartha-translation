base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: de
  text: und bereit sind, jeden Ungehorsam zu bestrafen[a], wenn euer Gehorsam vollständig ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu ahnden“ beziehungsweise „an jedem Ungehorsam Vergeltung zu üben“. Das griechische Verb kann auch das Durchsetzen von Recht oder Vergeltung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „erfüllt ist“ beziehungsweise „zur vollen Ausprägung gelangt ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: bereit sind
  rationale: Die griechische Wendung bezeichnet das Bereitsein beziehungsweise Bereithalten. „Bereit sind“ ist im Deutschen natürlich und bewahrt den partizipialen Anschluss an den vorhergehenden Zusammenhang.
- source_word: ἐκδικῆσαι
  choice: zu bestrafen
  rationale: Das Verb kann Vergeltung, Ahndung oder die Durchsetzung von Recht bezeichnen. Im Zusammenhang apostolischer Zurechtweisung gibt „bestrafen“ die beabsichtigte disziplinarische Maßnahme verständlich wieder, ohne persönliche Rache zu unterstellen.
- source_word: πᾶσαν παρακοήν
  choice: jeden Ungehorsam
  rationale: παρακοή bezeichnet Ungehorsam beziehungsweise die Weigerung zu gehorchen. „Jeden Ungehorsam“ wahrt die umfassende Aussage von πᾶσαν und bleibt knapp.
- source_word: ὅταν
  choice: wenn
  rationale: ὅταν mit dem Konjunktiv bezeichnet hier einen noch ausstehenden, zeitlich bedingten Fall. „Wenn“ bewahrt diese zeitlich-konditionale Offenheit besser als das stärker auf Unmittelbarkeit deutende „sobald“.
- source_word: πληρωθῇ
  choice: vollständig geworden ist
  rationale: Der passive Konjunktiv von πληρόω beschreibt, dass der Gehorsam sein volles Maß erreicht. Die Formulierung erhält sowohl den Vollendungsaspekt als auch die noch ausstehende Bedingung.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: euer Gehorsam
  rationale: Die natürliche possessive Wiedergabe entspricht dem griechischen Ausdruck und lässt offen, wie sich dieser Gehorsam im Einzelnen zeigt.
theological_decisions:
- issue: Art von Paulus’ angekündigtem Vorgehen gegen den Ungehorsam
  choice: Bestrafung beziehungsweise disziplinarische Ahndung von Ungehorsam
  alternative: Vergeltung oder Rache an Gegnern; endzeitliches göttliches Gericht
  rationale: Der unmittelbare Zusammenhang handelt von apostolischer Vollmacht und der Korrektur von Widerstand. „Bestrafen“ gibt diesen Zusammenhang wieder, ohne das Verb auf private Rache oder ausschließlich auf das Endgericht festzulegen.
- issue: Verhältnis zwischen dem Gehorsam der Gemeinde und der Ahndung des verbleibenden Ungehorsams
  choice: Die Ahndung erfolgt, wenn der Gehorsam der Adressaten vollständig geworden ist
  alternative: Die Aussage könne bedeuten, dass lediglich eine einzelne Gehorsamsforderung erfüllt worden ist
  rationale: Der Text nennt den Gehorsam der Adressaten als noch ausstehende zeitliche Bedingung, erklärt aber nicht genauer, worin seine Vollständigkeit besteht. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt bewusst als Fortsetzung des vorhergehenden Zusammenhangs erhalten. Die Formulierung vermeidet konfessionelle Festlegungen und bewahrt die zeitlich-konditionale sowie theologische Spannung des griechischen Textes.
