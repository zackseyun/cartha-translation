source:
  edition: SBLGNT
  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: de
  text: und alles Hohe, das sich gegen die Erkenntnis Gottes erhebt[a], und jeden Gedanken gefangen nehmen zum Gehorsam des Messias[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Erhebung“ oder „jede Anmaßung“ statt „alles Hohe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „des Gesalbten“; traditionell: „Christus“. Die Genitivverbindung kann auch als Gehorsam gegenüber dem Messias verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: alles Hochragende
  rationale: Die substantivierte Form bewahrt das Bild von etwas Erhöhtem oder Hochaufragendem, ohne den Ausdruck vorschnell auf menschlichen Hochmut, Ansprüche oder Argumente zu verengen. „Alles“ gibt den umfassenden Sinn von πᾶν wieder.
- source_word: ἐπαιρόμενον
  choice: das sich … erhebt
  rationale: Die Wendung gibt das Emporheben beziehungsweise Aufragen im Deutschen natürlich wieder. Das reflexive „sich erhebt“ bezeichnet hier das Auftreten als Widerstand, ohne ausdrücklich Eigenmächtigkeit oder Stolz als Ursache festzulegen.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: gegen die Erkenntnis Gottes
  rationale: „Erkenntnis Gottes“ wahrt die knappe Genitivverbindung und lässt offen, ob vor allem das Erkennen Gottes oder die auf Gott bezogene wahre Erkenntnis gemeint ist.
- source_word: αἰχμαλωτίζοντες
  choice: nehmen … gefangen
  rationale: Diese Formulierung erhält das anschauliche militärische Bild des Gefangennehmens.
- source_word: πᾶν νόημα
  choice: jeden Gedanken
  rationale: „Gedanke“ ist im Zusammenhang die natürliche Wiedergabe; der distributive Singular „jeden“ entspricht πᾶν und vermeidet die Verengung auf ausschließlich feindliche Pläne.
- source_word: εἰς τὴν ὑπακοὴν
  choice: damit er … gehorcht
  rationale: Die Zielsatzkonstruktion bringt die durch εἰς bezeichnete Ausrichtung auf den Gehorsam in natürlichem modernem Deutsch zum Ausdruck.
- source_word: τοῦ Χριστοῦ
  choice: dem Messias
  rationale: Χριστός bezeichnet den Gesalbten und wird hier als Titel verstanden. „Messias“ gibt diesen Titel im Deutschen verständlich wieder; der Dativ ist durch „gehorchen“ bedingt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: dem Messias
  alternative: Christus
  rationale: Der Ausdruck wird hier als Titel und nicht bloß als namensähnlicher Bestandteil verstanden. Die Fußnote nennt die im Deutschen traditionelle Wiedergabe, ohne die Titelfunktion im Haupttext zu verdecken.
- issue: Art des Widerstands in πᾶν ὕψωμα ἐπαιρόμενον
  choice: alles Hochragende, das sich … erhebt
  alternative: jede Anmaßung, die sich … auflehnt
  rationale: Der griechische Bildausdruck ist weiter als eine rein psychologische oder rhetorische „Anmaßung“. Die gewählte Fassung bewahrt diese Offenheit und die räumliche Bildsprache.
- issue: Zielrichtung von εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ
  choice: damit er dem Messias gehorcht
  alternative: in den Gehorsam des Messias
  rationale: Der Zielsatz versteht den Genitiv als die Person, der Gehorsam geleistet wird, und gibt die Zielrichtung von εἰς idiomatisch wieder. Eine formal mögliche, im Deutschen jedoch missverständliche Genitivkonstruktion könnte den Gehorsam des Messias selbst bezeichnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erhöhte Bildsprache des militärisch geprägten Zusammenhangs bleibt erhalten. Der Satzanfang und das abschließende Komma spiegeln wider, dass der vorgelegte griechische Text ein Satzfragment innerhalb des größeren Zusammenhangs ist.
