  naturalness: „Alles Hohe“ ist eine natürliche, zugleich bildhafte deutsche Formulierung. „Zum Gehorsam des Messias“ bewahrt die knappe, gehobene Ausdrucksweise und die Satzfragmentstruktur des griechischen Anschlusses.
  terminology: „Erkenntnis Gottes“ und „Messias“ sind angemessen. Die Fußnote zu Messias sollte nicht bloß „des Christus“ als griechische Form angeben, sondern die Bedeutung des Titels und die traditionelle deutsche Wiedergabe verständlich benennen.
