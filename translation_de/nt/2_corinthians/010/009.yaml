  yaml_path: translation/nt/2_corinthians/010/009.yaml
  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: de
  text: damit ich nicht den Eindruck erwecke, als wollte ich euch durch meine Briefe[a] einschüchtern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Briefe«; auch: »als wollte ich euch mit den Briefen Angst machen«.'
    reason: Bewahrt sowohl die wörtliche Form des Artikels als auch die unmittelbarere lexikalische Alternative für ἐκφοβεῖν.
lexical_decisions:
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Gibt die verneinte Zweck- beziehungsweise Folgekonstruktion mit dem Konjunktiv natürlich und unterordnend wieder; der genaue Anschluss ergibt sich aus dem vorausgehenden Satz.
- source_word: δόξω
  choice: es … aussieht
  rationale: δοκέω bedeutet hier „scheinen/den Anschein erwecken“. Die unpersönliche deutsche Wendung ist idiomatisch und bewahrt den Gedanken des äußeren Eindrucks.
- source_word: ὡς ἂν
  choice: als
  rationale: Leitet im Deutschen nach „es sieht so aus“ einen irreal beziehungsweise vergleichend wirkenden Satz ein und entspricht dem abschwächenden Sinn von ὡς ἂν.
- source_word: ἐκφοβεῖν
  choice: einschüchtern
  rationale: Das Verb bezeichnet ein starkes In-Angst-Versetzen. Im Kontext von Briefen und apostolischer Autorität trifft „einschüchtern“ die beabsichtigte Druck- oder Drohwirkung natürlich; „Angst machen“ bleibt als unmittelbarere Alternative in der Fußnote erhalten.
- source_word: ὑμᾶς
  choice: euch
  rationale: Wiedergabe des pluralischen direkten Objekts.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: durch meine Briefe
  rationale: διά mit Genitiv bezeichnet das Mittel. Der griechische Text sagt wörtlich „durch die Briefe“; „meine“ macht den im Kontext eindeutigen Bezug auf die Briefe des Paulus idiomatisch sichtbar, ohne den Sinn zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Vers bleibt als abhängiger Zwecksatz formuliert, wie im griechischen Kontext. „Als wollte ich“ gibt die beabsichtigte beziehungsweise so erscheinende Handlung idiomatisch wieder.
