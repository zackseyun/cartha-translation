source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: de
  text: Denn nicht derjenige, der sich selbst empfiehlt[a], ist anerkannt, sondern derjenige, den der Herr empfiehlt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sich selbst als geeignet hinstellt“ … „den der Herr als geeignet hinstellt“. Im Griechischen steht an beiden Stellen dasselbe Verb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: sich selbst empfiehlt / empfiehlt
  rationale: Im Zusammenhang mit Rühmen und Beurteilung bezeichnet συνίστημι das empfehlende Vorstellen einer Person. Die Wiederholung desselben deutschen Verbs bewahrt die bewusste Wiederholung im Griechischen.
- source_word: δόκιμος
  choice: anerkannt
  rationale: δόκιμος bezeichnet hier jemanden, der einer Prüfung standhält und deshalb als geeignet oder bewährt gilt. „Anerkannt“ bringt im Deutschen den Gegensatz zwischen eigener Empfehlung und der maßgeblichen Anerkennung durch den Herrn natürlich zum Ausdruck.
- source_word: κύριος
  choice: Herr
  rationale: Der übliche deutsche Titel gibt κύριος genau wieder, ohne den im Vers nicht ausdrücklich genannten Referenten näher festzulegen.
- source_word: ἑαυτόν
  choice: sich selbst
  rationale: Das reflexive Pronomen wird innerhalb der substantivierten Konstruktion natürlich und formgetreu wiedergegeben.
- source_word: ὃν
  choice: denjenigen, den
  rationale: Die Ergänzung „denjenigen“ macht den griechischen Gegensatz im Deutschen klar und stellt eine Person der anderen gegenüber.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ bewahrt die begründende Verbindung zum vorausgehenden Gedankengang.
theological_decisions:
- issue: Referent von ὁ κύριος
  choice: der Herr
  alternative: der Herr Jesus; Gott
  rationale: Im paulinischen Sprachgebrauch ist häufig Jesus gemeint, doch der Vers selbst sagt nur „der Herr“. Die Übersetzung legt den Referenten daher nicht über den Wortlaut hinaus fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallele Satzstruktur und die Wiederholung von „empfiehlt“ bilden den pointierten Gegensatz des griechischen Textes ab.
