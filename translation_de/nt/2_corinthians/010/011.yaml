    issue: Ausdrückliche Zukunftsform „werden wir ... zeigen“
    rationale: Das Prädikat ἐσμεν ist präsentisch. Der Kontext hat warnenden Bezug auf ein mögliches Kommen, doch der Vers formuliert zunächst die Behauptung einer Entsprechung. Die deutsche Zukunftsform sollte daher nicht explizit gemacht werden.
  - severity: medium
    issue: Zusatzgedanke „uns ... zeigen“
    rationale: Der griechische Text vergleicht, wie Paulus und seine Mitarbeiter „sind“ im Wort beziehungsweise in der Tat. Das reflexive Verb legt stärker ein bloßes Sich-Präsentieren nahe und wiederholt einen Aspekt, der im Ausgangstext nicht ausgedrückt ist.
