source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: de
  text: 'Ein solcher soll dies bedenken: Wie wir, wenn wir abwesend sind, in Briefen mit Worten auftreten, so handeln wir auch, wenn wir anwesend sind.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζέσθω
  choice: soll sich klarmachen
  rationale: Der Imperativ fordert dazu auf, den folgenden Sachverhalt ernsthaft zu bedenken und sich darauf einzustellen. Die Formulierung ist modern und bewahrt den nachdrücklichen Charakter.
- source_word: ὁ τοιοῦτος
  choice: ein solcher Mensch
  rationale: Die Wendung bezeichnet im Singular eine Person von der zuvor beschriebenen Art, ohne sie näher festzulegen.
- source_word: οἷοί ἐσμεν
  choice: wie wir uns … zeigen
  rationale: Die qualitative Vergleichskonstruktion beschreibt, wie Paulus und seine Mitarbeiter auftreten. Im Deutschen verbindet diese Wiedergabe die beiden Vergleichshälften natürlich.
- source_word: τῷ λόγῳ
  choice: mit Worten
  rationale: Der Dativ bezeichnet den Bereich beziehungsweise die Art des Auftretens. „Mit Worten“ bildet einen verständlichen Gegensatz zu „durch unser Handeln“.
- source_word: δι’ ἐπιστολῶν
  choice: in unseren Briefen
  rationale: διά mit Genitiv bezeichnet hier das Medium. Idiomatisches Deutsch beschreibt schriftliche Äußerungen als Worte „in“ Briefen; der Kontext macht deutlich, dass es sich um die Briefe des Paulus und seiner Mitarbeiter handelt.
- source_word: ἀπόντες
  choice: als Abwesende
  rationale: Das Partizip bezeichnet den begleitenden Umstand und wahrt die genaue Parallelität mit „als Anwesende“.
- source_word: τοιοῦτοι καί
  choice: so … auch
  rationale: Das korrelative „wie … so … auch“ bildet die qualitative Entsprechung der griechischen Konstruktion klar ab.
- source_word: παρόντες
  choice: als Anwesende
  rationale: Die Wiedergabe bewahrt den parallelen Gegensatz zu ἀπόντες.
- source_word: τῷ ἔργῳ
  choice: durch unser Handeln
  rationale: ἔργον steht hier im bewussten Gegensatz zu λόγος und bezeichnet das tatsächliche Tun. „Handeln“ ist in modernem Deutsch natürlicher als „Tat“, ohne den Gegensatz abzuschwächen.
theological_decisions:
- issue: Verhältnis zwischen dem brieflichen Auftreten und dem persönlichen Handeln des Paulus und seiner Mitarbeiter
  choice: Die Übersetzung gibt eine nachdrückliche Zusicherung wieder, dass ihr persönliches Handeln ihrem Auftreten in den Briefen entsprechen wird.
  alternative: Den Vers ausdrücklich als Drohung mit einer bestimmten künftigen Strafmaßnahme wiederzugeben.
  rationale: Der griechische Text behauptet eine Entsprechung zwischen Worten während der Abwesenheit und Handeln bei Anwesenheit, nennt jedoch keine konkrete Maßnahme. Die Übersetzung bewahrt diese Offenheit und den warnenden Ton.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Struktur „Wie … so … auch“ wahrt die Rhetorik des griechischen Satzes; „mit Worten … durch unser Handeln“ gibt den kompakten Gegensatz natürlich wieder.
