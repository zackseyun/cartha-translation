review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der Gegensatz von brieflichem Wort und persönlicher Tat sind getroffen. Die Formulierung „werden wir uns ... zeigen“ verschiebt jedoch die präsentische Aussage des griechischen Textes in eine ausdrückliche Zukunftsaussage und fügt mit dem reflexiven „uns zeigen“ einen nicht erforderlichen Aspekt der Selbstdarstellung hinzu.
  naturalness: „Als Abwesende/Anwesende“ und die doppelte Formulierung „uns ... zeigen“ wirken im modernen Standarddeutsch schwerfällig. Eine Konstruktion mit „wenn wir abwesend/anwesend sind“ ist klarer und wahrt den Parallelismus.
  terminology: „Ein solcher“ entspricht ὁ τοιοῦτος angemessen. „In Briefen mit Worten“ und „handeln“ machen den beabsichtigten Kontrast λόγῳ/ἔργῳ verständlich, ohne eine konkrete Maßnahme oder konfessionelle Deutung einzutragen.
