  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: de
  text: Denn selbst wenn ich mich noch etwas mehr unserer Vollmacht rühmen sollte, die der Herr uns gegeben hat, um euch aufzubauen und nicht niederzureißen[a], werde ich nicht beschämt dastehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und nicht zu eurer Zerstörung“. Das Griechische stellt Aufbauen und Niederreißen beziehungsweise Zerstörung einander gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werde ich nicht beschämt werden“ oder „werde ich mich nicht schämen müssen“. Die griechische Form kann die nicht eintretende Beschämung ausdrücken; je nach Kontext liegt der Akzent auf öffentlicher Bloßstellung oder auf Scham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Denn selbst wenn
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder, während „selbst wenn“ die hypothetische Bedingung mit der verstärkenden Nuance von τε natürlich ausdrückt.
- source_word: περισσότερόν τι
  choice: noch etwas mehr
  rationale: Die Formulierung bewahrt sowohl den Vergleich als auch die durch τι abgeschwächte, unbestimmte Steigerung.
- source_word: καυχήσωμαι
  choice: ich mich … rühmen sollte
  rationale: Der Konjunktiv nach ἐάν wird als hypothetische Bedingung wiedergegeben; „sich rühmen“ entspricht dem griechischen Ausdruck in diesem Zusammenhang.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: unserer Vollmacht
  rationale: „Vollmacht“ bezeichnet hier eine vom Herrn übertragene Befugnis und nicht bloß abstrakte Macht.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: die der Herr uns gegeben hat
  rationale: Das Relativpronomen bezieht sich auf die Vollmacht. Das ergänzte „uns“ ist im Deutschen durch „unserer Vollmacht“ sachlich gefordert und macht die Empfänger der übertragenen Vollmacht deutlich.
- source_word: εἰς οἰκοδομήν
  choice: um euch aufzubauen
  rationale: Die Wendung erhält das Bild des Bauens und nennt das im Zusammenhang erkennbare Objekt ausdrücklich.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: und nicht niederzureißen
  rationale: „Niederreißen“ hält den bildlichen Gegensatz zu „aufbauen“ aufrecht; eine wörtlichere Alternative wird in der Fußnote genannt.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: werde ich nicht beschämt werden
  rationale: Diese Wiedergabe wahrt die passive Form und lässt offen, ob die Beschämung als äußere Bloßstellung oder als erlebte Scham verstanden wird.
theological_decisions:
- issue: Wesen und Zweck apostolischer Vollmacht
  choice: Die Vollmacht ist vom Herrn übertragen und dient dazu, die Gemeinde aufzubauen, nicht sie niederzureißen.
  alternative: Die Aussage könnte einseitig als Ermächtigung zu zerstörerischer Gemeindezucht verstanden werden.
  rationale: Der ausdrückliche Gegensatz zwischen οἰκοδομή und καθαίρεσις stellt den aufbauenden Zweck in den Vordergrund, ohne die Realität oder mögliche strenge Ausübung der Vollmacht abzuschwächen.
- issue: Bedeutung von οὐκ αἰσχυνθήσομαι
  choice: „werde ich nicht beschämt werden“
  alternative: „werde ich mich nicht schämen müssen“
  rationale: Die Hauptfassung bildet das Passiv deutlicher ab; die Alternative bringt die mögliche auf das eigene Schamempfinden bezogene Nuance zum Ausdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vollmacht“ macht den übertragenen Charakter der Autorität deutlich; „aufbauen“ und „niederreißen“ bewahren den durchgehenden Baukontrast. Die Satzstruktur bleibt nahe am griechischen Gedankengang, ohne unnatürlich zu wirken.
