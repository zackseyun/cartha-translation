id: 2CO.10.2
reference: 2 Corinthians 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: de
  text: Doch ich bitte darum, dass ich, wenn ich anwesend bin, nicht mit jener Zuversicht kühn auftreten muss, mit der ich gegen einige vorzugehen gedenke, die meinen, wir lebten nach dem Fleisch[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach menschlichen Maßstäben lebten“.'
    reason: Lexikalische und kontextuelle Alternative für κατὰ σάρκα.
lexical_decisions:
- source_word: δέομαι
  choice: ich bitte darum
  rationale: Das Verb bezeichnet eine eindringliche Bitte. „Ich bitte darum“ klingt im modernen Deutschen ernst und würdig, ohne die stärkere emotionale Färbung von „ich flehe“ einzutragen.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: dass ich, wenn ich anwesend bin, nicht … kühn auftreten muss
  rationale: Die Konstruktion gibt den Inhalt der Bitte wieder. „Nicht … muss“ macht die im Kontext vorausgesetzte, aber unerwünschte Notwendigkeit idiomatisch deutlich.
- source_word: τῇ πεποιθήσει
  choice: mit jener Zuversicht
  rationale: Der Dativ bezeichnet die Zuversicht, mit der Paulus gegebenenfalls handelt. „Jener“ bindet sie natürlich an den folgenden Relativsatz.
- source_word: ᾗ λογίζομαι
  choice: mit der ich … vorzugehen gedenke
  rationale: λογίζομαι bezeichnet hier eine erwogene Absicht beziehungsweise Einschätzung. „Gedenke“ bewahrt den überlegten, noch zukünftigen Charakter.
- source_word: τολμῆσαι ἐπί τινας
  choice: gegen einige vorzugehen
  rationale: Die Wendung bezeichnet ein entschlossenes, gegen bestimmte Personen gerichtetes Handeln. „Vorgehen“ gibt die adversative Ausrichtung wieder, ohne eine konkrete Form der Konfrontation festzulegen.
- source_word: τοὺς λογιζομένους
  choice: die meinen
  rationale: Das Partizip bezeichnet das Urteil dieser Personen über Paulus und seine Mitarbeiter. „Meinen“ ist im heutigen Deutsch natürlich und trifft den Zusammenhang.
- source_word: κατὰ σάρκα
  choice: nach dem Fleisch
  rationale: Die formnahe Wiedergabe erhält den paulinisch bedeutsamen Begriff und lässt offen, ob körperlich-menschliche Begrenztheit, weltliche Maßstäbe oder eine moralische Wertung im Vordergrund stehen.
- source_word: περιπατοῦντας
  choice: wir lebten
  rationale: Das griechische Bild des Gehens bezeichnet hier die Lebensführung. Im Deutschen vermittelt „leben“ die Bedeutung natürlich; ein wörtliches „wandeln“ wäre heute weniger allgemein verständlich.
theological_decisions:
- issue: Bedeutung von σάρξ in κατὰ σάρκα
  choice: nach dem Fleisch
  alternative: nach menschlichen Maßstäben
  rationale: Die Hauptfassung bewahrt die theologische und rhetorische Mehrdeutigkeit von σάρξ. Die Alternative erläutert eine naheliegende kontextuelle Deutung, ohne sie zum alleinigen Sinn zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der argumentativen Spannung des griechischen Satzes, wurde aber für deutsche Leser geglättet. „Kühn auftreten“ und „gegen einige vorgehen“ vermeiden sowohl altertümliche Sprache als auch eine unnötig konkrete Auslegung der angekündigten Maßnahme.
