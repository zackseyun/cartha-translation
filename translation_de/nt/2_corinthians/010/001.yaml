source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: de
  text: 'Ich selbst, Paulus, bitte euch bei der Sanftmut und Milde des Messias: Ich, der ich in eurer Gegenwart demütig[a] bin, trete euch gegenüber aber kühn auf, wenn ich nicht bei euch bin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Demütig« könnte eine ironisch aufgegriffene Beschreibung dessen sein, was manche über Paulus bei persönlichen Begegnungen sagten; möglich sind auch »niedrig« oder, stärker deutend, »zaghaft«.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Ich selbst, Paulus
  rationale: Die betonte griechische Pronomenfolge und die ausdrückliche Namensnennung heben den persönlichen Charakter der Bitte hervor. δέ markiert hier den Übergang bzw. leichten Kontrast und wird im Deutschen durch die Satzstruktur aufgenommen, ohne ein unbelegtes zeitliches »nun« einzuführen.
- source_word: παρακαλῶ ὑμᾶς
  choice: bitte euch
  rationale: παρακαλέω bezeichnet hier eine eindringliche persönliche Bitte, nicht vorrangig einen Befehl; »bitte euch« ist natürlich und bewahrt den relationalen Ton.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: bei der Sanftmut und Milde
  rationale: διά mit Genitiv bezeichnet die Grundlage bzw. das Mittel des Appells. »Bei« gibt die feierliche Berufung idiomatisch wieder. »Sanftmut« und »Milde« unterscheiden die verwandten Eigenschaften, ohne sie künstlich zuzuspitzen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός fungiert als Titel; »Messias« gibt dessen Bedeutung wieder und erhält den messianischen Bezug.
- source_word: κατὰ πρόσωπον
  choice: wenn ich euch von Angesicht zu Angesicht begegne
  rationale: Die Wendung bedeutet im Gegensatz zu ἀπών die persönliche Gegenwart. Die konkrete Bildsprache »von Angesicht zu Angesicht« bleibt erhalten, wird aber durch »begegne« im Deutschen eindeutig auf die persönliche Anwesenheit bezogen.
- source_word: ταπεινὸς ἐν ὑμῖν
  choice: unter euch demütig
  rationale: »Demütig« wahrt den Grundsinn von ταπεινός und lässt offen, ob Paulus sich selbst beschreibt oder ironisch eine abwertende Charakterisierung seiner Gegner aufgreift.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: in der Abwesenheit euch gegenüber aber kühn auftrete
  rationale: Die Formulierung erhält den rhetorischen Gegensatz zwischen persönlicher Gegenwart und Abwesenheit. »Euch gegenüber« wahrt die Richtung von εἰς, ohne Feindseligkeit hineinzulesen; »kühn auftrete« gibt θαρρῶ als mutiges bzw. forsches Verhalten wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: des Christus
  rationale: Das Wort wird hier als Titel verstanden. »Messias« übersetzt den Titel und bewahrt seine jüdisch-messianische Bedeutung.
- issue: Ton von ταπεινός in der Selbstcharakterisierung des Paulus
  choice: demütig; mögliche Ironie wird in einer Fußnote offengehalten
  alternative: niedrig / zaghaft
  rationale: Der griechische Text kennzeichnet die Wendung nicht ausdrücklich als Zitat. Die Hauptübersetzung bewahrt daher den lexikalischen Sinn und löst nicht auf, ob Paulus eine gegnerische Behauptung ironisch aufnimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der persönliche und zugleich ironisch zugespitzte Ton wird bewahrt. Die konkrete Wendung »von Angesicht zu Angesicht« bleibt erhalten, während der Kontrast zur Abwesenheit idiomatisch formuliert ist.
