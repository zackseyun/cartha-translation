source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: de
  text: Denn wir wagen es nicht, uns einigen von denen zuzurechnen oder uns mit ihnen zu vergleichen, die sich selbst empfehlen[a]. Sie aber messen sich an sich selbst und vergleichen sich mit sich selbst[b] und sind ohne Einsicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns unter einige von denen einzureihen“; das griechische Verb bezeichnet hier die Einordnung in dieselbe Gruppe oder Kategorie.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „indem sie sich in sich selbst messen und sich selbst mit sich selbst vergleichen“. Gemeint ist offenbar, dass sie sich selbst zum Maßstab nehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: wir wagen es nicht
  rationale: Gibt die Weigerung beziehungsweise das ironisch formulierte Nicht-Wagen des Paulus natürlich und nah am Griechischen wieder.
- source_word: ἐγκρῖναι
  choice: uns … zuzurechnen
  rationale: Das Verb bezeichnet hier die Einordnung in eine Gruppe oder Kategorie. „Zurechnen“ ist im Deutschen verständlicher und idiomatischer als „klassifizieren“.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: vergleichen / vergleichen
  rationale: Bewahrt die natürliche Bedeutung und die rhetorische Wiederholung beider Vorkommen.
- source_word: ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων
  choice: uns einigen von denen …, die sich selbst empfehlen
  rationale: Die reflexive Wendung bezeichnet Selbstempfehlung; „einigen von denen“ erhält die durch τισιν ausgedrückte Einschränkung.
- source_word: ἀλλὰ αὐτοὶ
  choice: Doch … sie
  rationale: „Doch“ markiert den Gegensatz; das Subjekt „sie“ bezieht sich natürlich auf die zuvor genannten Menschen, die sich selbst empfehlen.
- source_word: ἐν ἑαυτοῖς
  choice: an sich selbst
  rationale: Die Formulierung wahrt die selbstbezogene Vergleichsbasis, ohne die mögliche wörtliche Nuance „unter/in sich selbst“ völlig aufzulösen.
- source_word: μετροῦντες
  choice: messen
  rationale: Erhält das griechische Bild des Messens als metaphorische Bewertung.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: sich mit sich selbst
  rationale: Bewahrt die auffällige Häufung der Reflexivformen und macht den selbstreferenziellen Vergleich deutlich.
- source_word: οὐ συνιᾶσιν
  choice: verstehen sie nichts
  rationale: Eine natürliche deutsche Wiedergabe des absoluten οὐ συνιᾶσιν; sie bringt den Mangel an Einsicht klar zum Ausdruck, ohne ein nicht genanntes Objekt festzulegen.
theological_decisions: []
