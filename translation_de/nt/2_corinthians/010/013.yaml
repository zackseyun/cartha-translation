id: 2CO.10.13
reference: 2 Corinthians 10:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: de
  text: Wir aber werden uns nicht über jedes Maß hinaus rühmen, sondern nach dem Maß des Bereichs, den Gott uns zugeteilt hat – ein Maß, das sogar bis zu euch reicht –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμετρα
  choice: über jedes Maß hinaus
  rationale: Die idiomatische Verbindung bezeichnet das Überschreiten angemessener Grenzen; zugleich bleibt das im Vers wiederholte Maß-Motiv erhalten.
- source_word: καυχησόμεθα
  choice: werden uns … rühmen
  rationale: „Sich rühmen“ gibt den polemischen Zusammenhang und die mögliche Bedeutung des Beanspruchens von Anerkennung direkt und in würdigem Gegenwartsdeutsch wieder.
- source_word: κατὰ τὸ μέτρον
  choice: nach dem Maß
  rationale: Die Formulierung bewahrt sowohl den Gedanken der Übereinstimmung mit einer gesetzten Begrenzung als auch die Wiederholung von μέτρον.
- source_word: κανόνος
  choice: Bereichs
  rationale: Im Zusammenhang von Zuteilung, Maß und räumlicher Erstreckung bezeichnet κανών am ehesten einen abgegrenzten, zugewiesenen Wirkungsbereich; „Bereich“ klingt im Deutschen natürlicher als „Grenze“ und vermeidet die anachronistische Wiedergabe „Kanon“.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: den Gott uns zugeteilt hat
  rationale: μερίζω bezeichnet hier das Zuteilen eines Anteils beziehungsweise Wirkungsbereichs; „zugeteilt“ erhält dieses Bild.
- source_word: μέτρου
  choice: ein Maß
  rationale: Die appositionelle beziehungsweise erläuternde Wiederaufnahme wird ausdrücklich wiedergegeben und bewahrt die auffällige Wiederholung des griechischen Wortes.
- source_word: ἐφικέσθαι
  choice: das … reicht
  rationale: Der Infinitiv beschreibt die Ausdehnung des zugeteilten Maßes; „reicht“ ist natürlich und verbindet sich unmittelbar mit „bis zu euch“.
- source_word: ἄχρι καὶ ὑμῶν
  choice: sogar bis zu euch
  rationale: „Bis zu“ gibt die räumliche Erstreckung wieder, während „sogar“ die Hervorhebung durch καί erhält.
theological_decisions:
- issue: Bedeutung von κανών in Paulus’ Aussage über seinen Dienst
  choice: Ein von Gott zugeteilter Wirkungsbereich, der die Korinther einschließt
  alternative: Eine Regel oder Norm, nach der Paulus sein Rühmen bemisst
  rationale: Der unmittelbare Zusammenhang wird von Maß, Zuteilung und Erstreckung bestimmt. Daher steht die Bedeutung eines zugewiesenen Bereichs im Vordergrund, ohne dass die zugrunde liegende Vorstellung einer gesetzten Begrenzung verloren geht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Maß“ bildet die markante μέτρον-Sprache nach. Der Gedankenstrich am Versende bleibt stehen, weil der griechische Satz in den folgenden Vers hinein weitergeführt wird.
