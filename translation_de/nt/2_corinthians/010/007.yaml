source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: de
  text: 'Ihr schaut auf das Äußere.[a] Wenn jemand sich sicher ist, dass er dem Messias gehört,[b] soll er bei sich noch einmal bedenken: So wie er dem Messias gehört, gehören auch wir ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher: „Ihr schaut auf das, was nach dem äußeren Erscheinungsbild ist.“ Möglich ist auch die Aufforderung: „Schaut auf das, was vor Augen liegt!“'
    reason: Die griechische Form βλέπετε kann Indikativ oder Imperativ sein; τὰ κατὰ πρόσωπον kann das äußerlich Sichtbare bezeichnen oder, weniger wahrscheinlich im Kontext, das unmittelbar Vorliegende.
  - marker: b
    text: 'Wörtlich: „dass er des Messias ist“; gemeint ist die Zugehörigkeit zum Messias.'
    reason: Die Fußnote macht die knappe griechische Genitivkonstruktion sichtbar.
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: auf den äußeren Anschein
  rationale: Die Wendung bezeichnet hier am ehesten das äußerlich Sichtbare beziehungsweise eine Beurteilung nach dem Anschein. Die Formulierung ist im modernen Deutschen natürlich, ohne den Gedanken unnötig auszudeuten.
- source_word: βλέπετε
  choice: ihr schaut
  rationale: Die Form kann formal als Indikativ oder Imperativ verstanden werden. Im Haupttext wird sie aufgrund des tadelnden Zusammenhangs als indikativische Feststellung wiedergegeben; die andere Möglichkeit steht in der Fußnote.
- source_word: πέποιθεν ἑαυτῷ
  choice: sich sicher ist
  rationale: Das Perfekt bezeichnet eine gefestigte Zuversicht. Die reflexive deutsche Wendung gibt den Bezug auf die eigene Person natürlich wieder, ohne zwingend Selbstvertrauen als Quelle dieser Zuversicht zu behaupten.
- source_word: Χριστοῦ εἶναι
  choice: dem Messias gehört
  rationale: Der Genitiv mit εἶναι drückt Zugehörigkeit aus. Χριστός wird als Titel mit „Messias“ wiedergegeben.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: soll er bei sich noch einmal bedenken
  rationale: Die Formulierung bewahrt den imperativischen Aufruf zu erneuter, persönlicher Überlegung und klingt zugleich idiomatisch.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: So wie er dem Messias gehört, gehören auch wir ihm
  rationale: Die im Griechischen elliptische Gegenüberstellung wird im Deutschen ergänzt. „Ihm“ vermeidet eine schwerfällige Wiederholung und bezeichnet eindeutig den Messias.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: dem Messias
  alternative: Christus
  rationale: Χριστός hat hier Titelfunktion. „Messias“ macht diese Funktion sichtbar und entspricht der Aussage über die Zugehörigkeit zu dem Gesalbten.
- issue: Art der Zugehörigkeit zu Christus
  choice: gehört
  alternative: ist des Messias
  rationale: „Gehört“ gibt den Genitiv der Zugehörigkeit klar wieder, ohne die Beziehung näher als institutionelle Mitgliedschaft, mystische Einheit oder Parteizugehörigkeit festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der tadelnde Ton bleibt zurückhaltend, aber deutlich. Die Hauptfassung folgt der wahrscheinlichsten indikativischen Lesart, während die grammatisch mögliche Aufforderung in der Fußnote bewahrt wird.
