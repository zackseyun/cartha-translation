id: 2CO.10.3
reference: 2 Corinthians 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν σαρκὶ γὰρ περιπατοῦντες οὐ κατὰ σάρκα στρατευόμεθα—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: de
  text: Denn obwohl wir im Fleisch leben[a], kämpfen wir nicht nach dem Fleisch—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn obwohl wir als Menschen leben, kämpfen wir nicht nach bloß menschlichen Maßstäben.«'
    reason: Lexikalische Alternative, die den kontextuellen Sinn von σάρξ und κατὰ σάρκα deutlicher ausdrückt, dabei aber die Wortwiederholung des griechischen Textes auflöst.
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: im Fleisch
  rationale: Die relativ formnahe Wiedergabe bewahrt den Kontrast zur zweiten Verwendung von σάρξ. Gemeint ist hier zunächst das gewöhnliche leiblich-menschliche Dasein, nicht eindeutig die »sündige Natur«.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet bzw. erläutert die vorausgehende Aussage; »Denn« gibt diesen argumentativen Anschluss natürlich wieder.
- source_word: περιπατοῦντες
  choice: obwohl wir … leben
  rationale: Das Partizip wird wegen des Gegensatzes zum Hauptsatz konzessiv wiedergegeben. »Leben« vermittelt den idiomatischen Sinn von περιπατέω im paulinischen Sprachgebrauch natürlicher als das im Deutschen missverständliche »wandeln«.
- source_word: οὐ κατὰ σάρκα
  choice: nicht nach dem Fleisch
  rationale: Die formnahe Wendung erhält die Wiederholung von σάρξ und lässt offen, ob besonders menschliche Maßstäbe, menschliche Mittel oder eine fleischlich bestimmte Handlungsweise gemeint sind.
- source_word: στρατευόμεθα
  choice: kämpfen wir
  rationale: Das Verb trägt ein militärisches Bild. »Kämpfen« ist im Deutschen natürlich und bewahrt dieses Bild, ohne den engeren Sinn bloßen Soldatendienstes aufzudrängen.
theological_decisions:
- issue: Wiedergabe der beiden Vorkommen von σάρξ
  choice: Beide Vorkommen werden im Haupttext mit »Fleisch« wiedergegeben.
  alternative: »im Körper … nicht nach menschlichen Maßstäben« oder »als schwache Menschen … nicht auf weltliche Weise«
  rationale: Die gleiche Wiedergabe bewahrt Paulus’ rhetorische Wiederholung und die Spannung zwischen leiblich-menschlichem Dasein und einer vom Fleisch bestimmten Art des Kampfes. »Sündige Natur« wäre an dieser Stelle zu eng und würde besonders das erste Vorkommen überdeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Im Fleisch« und »nach dem Fleisch« sind bewusst formnah und theologisch offen; die Fußnote bietet eine unmittelbar verständliche sinngemäße Alternative. Der Gedankenstrich am Versende zeigt den fortlaufenden Satz an.
