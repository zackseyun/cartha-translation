  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: de
  text: Denn wir überdehnen uns nicht, als hätten wir euch nicht erreicht, denn wir sind sogar mit dem Evangelium des Messias[a] bis zu euch gelangt —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: wir strecken uns nicht über unsere Grenzen hinaus
  rationale: Die Formulierung bewahrt das Bild eines unzulässigen Sich-Ausstreckens über den zugewiesenen Bereich hinaus und bleibt zugleich in modernem Deutsch verständlich.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: als hätten wir euch nicht erreicht
  rationale: Der irreale Vergleich bezeichnet die nur unterstellte Voraussetzung, unter der Paulus seine Grenzen überschreiten würde.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: denn … sind wir sogar bis zu euch gelangt
  rationale: „Sogar“ gibt das hervorgehobene καί wieder; „bis zu euch gelangt“ drückt die tatsächlich vollzogene Ausdehnung des Dienstes aus.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: mit dem Evangelium
  rationale: „Mit“ gibt hier natürlich wieder, dass Paulus die Korinther im Zuge seiner Evangeliumsverkündigung erreichte, ohne die mögliche Vorstellung eines Wirkungsbereichs unnötig festzulegen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός steht im Genitiv als messianischer Titel; „Messias“ erhält diesen Titelcharakter und bewahrt die offene Beziehung des Genitivs zum Evangelium.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: In der Verbindung „Evangelium des Messias“ bleibt der Titelgehalt von Χριστός erkennbar. „Christus“ ist die traditionelle, ebenfalls mögliche Wiedergabe und wird in der Fußnote genannt.
- issue: Beziehung des Genitivs τοῦ Χριστοῦ zu εὐαγγελίῳ
  choice: Evangelium des Messias
  alternative: Evangelium vom Messias
  rationale: 'Der deutsche Genitiv bewahrt die im Griechischen nicht ausdrücklich aufgelöste Beziehung: Das Evangelium kann dem Messias zugehören und zugleich von ihm handeln. „Vom Messias“ würde stärker auf den Inhalt festlegen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild des Sich-Ausstreckens bleibt erhalten; der abschließende Gedankenstrich zeigt an, dass der Satz im folgenden Vers weitergeführt wird.
