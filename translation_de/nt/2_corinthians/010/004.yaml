source:
  edition: SBLGNT
  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: de
  text: Denn die Waffen unseres Kampfes sind nicht fleischlich[a], sondern durch Gott mächtig[b] zum Niederreißen von Festungen – indem wir Argumente[c] niederreißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Fleisch bestimmt“; auch: „mit rein menschlichen Mitteln“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor Gott mächtig“; auch: „göttlich mächtig“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Überlegungen“, „Gedankengänge“ oder „Berechnungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: Waffen
  rationale: Bewahrt das konkrete militärische Bild und ist im modernen Deutsch die natürliche Entsprechung.
- source_word: στρατείας
  choice: mit denen wir kämpfen
  rationale: Gibt den Sinn von Kriegsführung bzw. Kampf idiomatisch wieder und vermeidet die im Deutschen schwerfällige Wendung „Waffen unserer Kriegsführung“.
- source_word: σαρκικὰ
  choice: fleischlich
  rationale: Bewahrt den paulinischen Bezug auf das Fleisch und legt die Bedeutung nicht vorschnell auf „weltlich“, „menschlich“ oder „sündig“ fest.
- source_word: δυνατὰ τῷ θεῷ
  choice: vor Gott mächtig
  rationale: Gibt den komprimierten Dativ möglichst unmittelbar wieder, ohne eine nicht eindeutige instrumentale Bedeutung („durch Gott“) in den Haupttext einzutragen.
- source_word: καθαίρεσιν
  choice: niederzureißen
  rationale: Erhält das anschauliche Bild vom Abtragen befestigter Anlagen und die Wortverbindung zum folgenden καθαιροῦντες.
- source_word: ὀχυρωμάτων
  choice: Festungen
  rationale: Ist eine klare und bildkräftige deutsche Entsprechung für befestigte Stellungen.
- source_word: λογισμοὺς
  choice: Gedankengebäude
  rationale: Bezeichnet hier zusammenhängende Überlegungen bzw. Argumentationssysteme und passt zugleich zum Bild des Niederreißens; die mögliche Wiedergabe „Überlegungen“ bleibt in der Fußnote sichtbar.
- source_word: καθαιροῦντες
  choice: indem wir … niederreißen
  rationale: Bewahrt das Partizip als erläuternde Fortführung und wiederholt bewusst das Verb, das bereits καθαίρεσιν wiedergibt.
theological_decisions:
- issue: Bedeutung von σαρκικὰ im Gegensatz zwischen menschlichen und göttlichen Kampfmitteln
  choice: fleischlich
  alternative: menschlich; weltlich; dem Fleisch entsprechend
  rationale: „Fleischlich“ erhält die paulinische Spannung und beschränkt den Ausdruck weder allein auf Sündhaftigkeit noch allein auf gewöhnliche menschliche Mittel.
- issue: Funktion des Dativs τῷ θεῷ in δυνατὰ τῷ θεῷ
  choice: vor Gott mächtig
  alternative: durch Gott mächtig; göttlich mächtig
  rationale: Der Dativ ist semantisch offen. Der Haupttext vermeidet daher, Gottes Wirken ausdrücklich als Mittel oder Quelle festzulegen; die geläufige instrumentale Deutung wird als Alternative vermerkt.
- issue: Bezug von λογισμοὺς καθαιροῦντες
  choice: 'als erläuternde Fortsetzung: „indem wir Gedankengebäude niederreißen“'
  alternative: als Beginn eines neuen Satzes in Vers 5
  rationale: Die vorgelegte Versabgrenzung nimmt die Wortgruppe in Vers 4 auf. Der Gedankenfluss bleibt dennoch offen, da das Partizip die Art des Niederreißens erläutert und syntaktisch in den folgenden Vers hineinwirkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das militärische Bild bleibt deutlich. „Gedankengebäude“ verbindet den intellektuellen Gehalt von λογισμοί mit dem Bild des Niederreißens, ohne den Ausdruck ausschließlich auf formale Argumente einzuengen.
