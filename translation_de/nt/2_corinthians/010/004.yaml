revisions:
- from: Denn die Waffen, mit denen wir kämpfen, sind nicht fleischlich[a], sondern vor Gott mächtig[b], um Festungen niederzureißen – indem wir Gedankengebäude[c] niederreißen.
  to: Denn die Waffen unseres Kampfes sind nicht fleischlich[a], sondern durch Gott mächtig[b] zum Niederreißen von Festungen – indem wir Argumente[c] niederreißen.
  rationale: Die Revision korrigiert die missverständliche deutsche Wirkung von „vor Gott mächtig“, ohne die diskutierte Deutung zu unterdrücken; diese bleibt als Fußnotenalternative sichtbar. Sie vermeidet zudem die überkonkrete Metapher „Gedankengebäude“ und glättet die Satzfügung. Der Text bewahrt sowohl die militärische Bildwelt als auch die lexikalische Verbindung zwischen „Niederreißen“ und „niederreißen“.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:31:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die militärische Metaphorik und die Wiederaufnahme von καθαιρέω sind grundsätzlich angemessen. „Vor Gott mächtig“ ist für δυνατὰ τῷ θεῷ jedoch im Deutschen semantisch irreführend: Es kann nahelegen, die Waffen hätten bei Gott Einfluss oder Ansehen. Die im Kontext naheliegende, auch im englischen Audit als bevorzugt ausgewiesene Gottesbezogenheit der Macht wird mit „durch Gott mächtig“ klarer wiedergegeben. „Gedankengebäude“ konkretisiert λογισμοί stärker als der griechische Ausdruck es verlangt; „Argumente“ wahrt im Kontext die polemisch-intellektuelle Bedeutung ohne zusätzliche Bildausgestaltung.'
  naturalness: „Die Waffen unseres Kampfes“ ist eine natürliche, knappe und dem griechischen Genitiv entsprechende Formulierung. Die Verbindung „um Festungen niederzureißen – indem wir … niederreißen“ ist syntaktisch weniger glatt, weil Zweckinfinitiv und erläuterndes Partizip unnötig unterschiedlich wiedergegeben werden. Die Revision vereinheitlicht dies idiomatisch und erhält die Wiederholung des Niederreißens.
  terminology: „Fleischlich“ sollte als paulinisch geprägter, bewusst nicht eingeengter Ausdruck beibehalten werden. „Festungen“ gibt ὀχυρώματα treffend wieder. Für λογισμοί ist „Argumente“ in diesem Zusammenhang eine angemessene Hauptlesart; die weiter gefassten Alternativen bleiben als Fußnote erhalten.
  issues:
  - severity: medium
    issue: „vor Gott mächtig“ für δυνατὰ τῷ θεῷ
    rationale: Die deutsche Wendung verschiebt den Sinn leicht zu „bei Gott einflussreich/anerkannt“. Der Dativ ist komprimiert und umstritten, doch „durch Gott mächtig“ gibt die im Kontext wahrscheinliche Gottesbezogenheit der Wirksamkeit klar und idiomatisch wieder; alternative Deutungen werden in der Fußnote bewahrt.
  - severity: medium
    issue: „Gedankengebäude“ für λογισμούς
    rationale: Die Wiedergabe fügt die Vorstellung eines ausgebauten gedanklichen Systems hinzu. λογισμοί kann zwar zusammenhängende Erwägungen meinen, bezeichnet hier aber unmittelbarer Argumente bzw. Gedankengänge.
  - severity: low
    issue: Uneinheitliche Wiedergabe der Konstruktion mit καθαίρεσιν und καθαιροῦντες
    rationale: „um … niederzureißen – indem wir … niederreißen“ wirkt im Deutschen unnötig verschachtelt. Die parallele Form „zum Niederreißen … – indem wir … niederreißen“ ist flüssiger und erhält die griechische Wortverbindung.
  revised_text: Denn die Waffen unseres Kampfes sind nicht fleischlich[a], sondern durch Gott mächtig[b] zum Niederreißen von Festungen – indem wir Argumente[c] niederreißen.
