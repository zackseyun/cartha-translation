source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: de
  text: 'Denn sie sagen[a]: »Seine Briefe sind gewichtig und kraftvoll, aber sein Auftreten in Person ist schwach, und seine Rede wird verachtet[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Denn er sagt«. Die griechische Singularform kann als eingeschobene Zitierformel eine stellvertretend angeführte Stimme bezeichnen; gemeint ist hier die berichtete Kritik an Paulus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine Rede gilt nichts«; auch: »seine Rede ist verächtlich« oder »von geringem Wert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι begründet bzw. erläutert hier die vorausgehende Aussage; »Denn« stellt diesen Zusammenhang im Deutschen natürlich her.
- source_word: Αἱ ἐπιστολαὶ
  choice: Seine Briefe
  rationale: ἐπιστολαί bezeichnet gewöhnliche schriftliche Korrespondenz. Das im Griechischen nicht ausdrücklich gesetzte Possessivpronomen ergibt sich im Zitat eindeutig aus dem Bezug auf Paulus.
- source_word: μέν ... δὲ
  choice: … aber …
  rationale: Die Partikelverbindung kennzeichnet den Gegensatz zwischen den Briefen und dem persönlichen Auftreten; im Deutschen genügt dafür ein natürliches »aber«.
- source_word: φησίν
  choice: jemand sagt
  rationale: Die Verbform ist Singular (»er/sie sagt«) und fungiert als eingeschobene Zitierformel. »Jemand sagt« bewahrt den Singular und macht zugleich deutlich, dass eine kritische Stimme repräsentativ angeführt wird.
- source_word: βαρεῖαι
  choice: gewichtig
  rationale: »Gewichtig« erhält das Bild des Gewichts und bezeichnet zugleich Ernst und Eindruckskraft.
- source_word: ἰσχυραί
  choice: kraftvoll
  rationale: Das Wort bezeichnet Stärke oder Wirksamkeit; »kraftvoll« passt idiomatisch zu Briefen und vermeidet die mögliche Unbeholfenheit von »stark«.
- source_word: ἡ παρουσία τοῦ σώματος
  choice: sein persönliches Auftreten
  rationale: Wörtlich geht es um die »Gegenwart des Körpers«, im Kontext also um Paulus, wenn er persönlich anwesend ist. »Persönliches Auftreten« gibt diesen Sinn natürlich wieder, ohne ihn bloß auf sein Aussehen zu verengen.
- source_word: ἀσθενής
  choice: schwach
  rationale: Die direkte Entsprechung lässt offen, ob körperliche Schwäche, mangelnde Eindruckskraft oder beides gemeint ist.
- source_word: ὁ λόγος
  choice: seine Rede
  rationale: Im Gegensatz zu den Briefen bezeichnet λόγος hier das mündliche Reden bzw. die Redeweise des Paulus.
- source_word: ἐξουθενημένος
  choice: verachtet
  rationale: Das Partizip bezeichnet etwas, das geringgeschätzt oder für bedeutungslos gehalten wird. »Verachtet« gibt die abwertende Beurteilung durch die Kritiker wieder, statt sie als objektive Eigenschaft darzustellen.
theological_decisions:
- issue: Die Kritik an Paulus darf nicht als Urteil des Erzählers erscheinen
  choice: 'Die Aussage wird als wörtlich angeführte Meinung einer nicht näher bestimmten Person wiedergegeben: »jemand sagt«.'
  alternative: »Denn sie sagen« oder formal »Denn er sagt«
  rationale: φησίν steht grammatisch im Singular, während der Zusammenhang eine unter den Kritikern vertretene Aussage erkennen lässt. »Jemand sagt« bewahrt beides, ohne die Kritik als bestätigte Tatsachenbehauptung erscheinen zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gewichtig und kraftvoll« erhält die rhetorische Paarung; »persönliches Auftreten« gibt die körperliche Anwesenheit idiomatisch wieder. Die Fußnoten sichern die formale Singularität von φησίν und die Bedeutungsbreite von ἐξουθενημένος.
