  verdict: revise
  source_fidelity: Die Wiedergabe der Briefe als »gewichtig und kraftvoll« trifft βαρεῖαι καὶ ἰσχυραί gut. »Jemand sagt« bildet φησίν zwar formal singularisch ab, ist im Deutschen jedoch unnötig individualisierend und gibt die im Kontext referierte Kritik weniger treffend wieder. »Sie sagen« gibt die Aussage als Bericht über die Kritiker natürlich wieder; die Singularform kann in einer Fußnote dokumentiert werden. »Persönliches Auftreten« ist möglich, doch »Auftreten in Person« bewahrt den Bezug auf παρουσία τοῦ σώματος deutlicher. Bei ἐξουθενημένος muss die passive, abwertende Beurteilung klar ausgedrückt werden; »seine Rede verachtet« ist kein vollständiger natürlicher deutscher Prädikatsausdruck.
  naturalness: Die Satzführung mit »Denn sie sagen:« und die direkte Rede sind modernes, idiomatisches Standarddeutsch. »Seine Rede wird verachtet« ist klar und natürlich; es vermeidet die unidiomatische Ellipse »seine Rede verachtet«.
  terminology: »Briefe«, »gewichtig«, »kraftvoll«, »Auftreten in Person«, »schwach« und »Rede« sind angemessen. Die Übersetzung kennzeichnet die negative Wertung bei ἐξουθενημένος als Urteil der Sprecher und nicht als Erzählerurteil.
