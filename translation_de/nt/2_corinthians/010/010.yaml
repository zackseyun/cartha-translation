  - severity: medium
    issue: »seine Rede verachtet« ist im Deutschen syntaktisch unvollständig bzw. unnatürlich.
    rationale: ἐξουθενημένος ist ein passives Partizip und bezeichnet, dass die Rede geringgeschätzt wird. »Seine Rede wird verachtet« gibt dies vollständig wieder.
