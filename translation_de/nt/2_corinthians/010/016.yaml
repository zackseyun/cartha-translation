  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: de
  text: um die gute Nachricht in den Gebieten jenseits von euch[a] zu verkünden und uns nicht im Bereich eines anderen[b] mit dem zu rühmen, was schon vorbereitet ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Ländern jenseits von euch“.'
    reason: lexical_alternative
  - marker: b
    text: „Bereich“ gibt hier das griechische κανών als abgegrenzten oder zugewiesenen Tätigkeitsbereich wieder, nicht als moralische „Regel“ oder späteren „Kanon“.
    reason: cultural_note
  - marker: c
    text: 'Gemeint sein kann: sich im Arbeitsfeld eines anderen nicht dessen zu rühmen, was dort bereits getan oder vorbereitet worden ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα
  choice: die Gebiete jenseits
  rationale: Das substantivierte Wort bezeichnet Gebiete, die über einen Bezugspunkt hinaus liegen. „Die Gebiete jenseits von euch“ gibt die geografische Ausrichtung idiomatisch wieder.
- source_word: ὑμῶν
  choice: von euch
  rationale: Der Genitiv bestimmt den Bezugspunkt für ὑπερέκεινα. Die Formulierung wahrt den direkten Bezug auf die Korinther, ohne ausdrücklich „euer Gebiet“ zu ergänzen.
- source_word: εὐαγγελίσασθαι
  choice: die gute Nachricht zu verkünden
  rationale: Die Wendung gibt die verbale Bedeutung verständlich und würdig wieder und bezeichnet hier Paulus’ missionarische Verkündigung.
- source_word: ἀλλοτρίῳ
  choice: eines anderen
  rationale: Das Adjektiv bezeichnet etwas, das einem anderen gehört. Der Genitiv macht den persönlichen Bezug natürlich deutlich, ohne ein Geschlecht hinzuzufügen.
- source_word: κανόνι
  choice: Wirkungskreis
  rationale: Im Zusammenhang bezeichnet κανών einen abgegrenzten oder zugewiesenen Tätigkeitsbereich. „Wirkungskreis“ vermeidet die hier unpassenden späteren Bedeutungen „Kanon“ und „Regel“.
- source_word: ἕτοιμα
  choice: was schon vorbereitet ist
  rationale: Das substantivierte Adjektiv bezeichnet das bereits Bereite oder Vorbereitete. Die Wiedergabe bleibt offen dafür, ob vorbereitete Voraussetzungen oder bereits geleistete Arbeit gemeint sind.
- source_word: καυχήσασθαι
  choice: uns … zu rühmen
  rationale: „Sich rühmen“ bewahrt den wiederkehrenden Ausdruck und die rhetorische Spannung des Abschnitts. Das Reflexivpronomen stellt im Deutschen den aus dem Zusammenhang erschlossenen pluralischen Sprecherbezug her.
- source_word: ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα
  choice: im Wirkungskreis eines anderen mit dem …, was schon vorbereitet ist
  rationale: Die komprimierte griechische Formulierung wird in natürlichem Deutsch wiedergegeben, ohne „Arbeit“ ausdrücklich in den Haupttext einzutragen. „Mit dem“ bringt den Bezug von εἰς auf den Gegenstand des Rühmens idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bedeutung von κανών im Zusammenhang von Paulus’ Dienst
  choice: abgegrenzter oder zugewiesener Wirkungskreis
  alternative: Regel, Maßstab oder Kanon
  rationale: Der unmittelbare Zusammenhang in 2. Korinther 10,13–15 handelt von Grenzen und Tätigkeitsbereichen des apostolischen Wirkens. Die Übersetzung vermeidet daher spätere oder sachfremde Bedeutungen.
- issue: Bezug von τὰ ἕτοιμα
  choice: das bereits Vorbereitete, wahrscheinlich im Blick auf den Dienst anderer
  alternative: allgemein das, was bereit ist, oder ausdrücklich bereits vollbrachte Arbeit
  rationale: Der Kontext legt die Arbeit anderer nahe, doch der griechische Ausdruck selbst sagt lediglich „das Bereite/Vorbereitete“. Der Haupttext bewahrt diese Offenheit; die Fußnote erläutert die kontextuelle Möglichkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzform bleibt als Infinitivkonstruktion erkennbar, weil der Vers syntaktisch an den vorausgehenden Zusammenhang anschließt. „Gute Nachricht“ vermeidet unnötige Kirchensprache; „Wirkungskreis“ ist zugleich natürlich und sachlich präzise.
