  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: de
  text: Wer sich aber rühmt, soll sich des Herrn rühmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wer sich aber rühmt, rühme sich im Herrn.“ Wahrscheinlich greift Paulus Jeremia 9,23 auf (in vielen englischen Ausgaben Jeremia 9,24).'
    reason: Formale Wiedergabe und Hinweis auf den wahrscheinlichen Schriftanklang; die Angabe vermeidet die fehlerhafte Verszählung der vorliegenden Fußnote.
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: Wer sich ... rühmt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein eine Person, die sich rühmt. Die deutsche Konstruktion mit „wer“ ist natürlich, inklusiv und bewahrt den allgemeinen Charakter.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen leichten Gegensatz zum unangebrachten Rühmen im vorausgehenden Zusammenhang.
- source_word: καυχώμενος / καυχάσθω
  choice: sich rühmt / soll sich rühmen
  rationale: Das reflexive „sich rühmen“ gibt καυχάομαι idiomatisch und mit seiner rhetorischen Schärfe wieder. „Soll“ vermittelt die auffordernde Kraft des Imperativs, ohne ihn unnötig zu verstärken.
- source_word: ἐν κυρίῳ
  choice: sich des Herrn rühmen
  rationale: Beim deutschen Verb „sich rühmen“ bezeichnet der Genitiv natürlich den Grund oder Gegenstand des Rühmens. So wird der Sinn von ἐν idiomatisch wiedergegeben und zugleich der Anklang an Jeremia bewahrt.
- source_word: κυρίῳ
  choice: des Herrn
  rationale: „Herr“ entspricht κύριος. Die Übersetzung legt nicht fest, ob im Anklang an Jeremia Gott oder im paulinischen Gebrauch ausdrücklich Jesus gemeint ist.
theological_decisions:
- issue: Bezug von κυρίῳ im Kontext eines Schriftanklangs
  choice: der Herr
  alternative: Gott; der Herr Jesus
  rationale: Der griechische Text nennt nur κύριος. Die Wiedergabe „der Herr“ bewahrt sowohl den alttestamentlichen Bezug als auch die paulinische christologische Resonanz, ohne die Mehrdeutigkeit aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und zugleich verständliche Wendung „sich des Herrn rühmen“ bildet die griechische Aussage idiomatisch ab; die Fußnote bietet die formal nähere Konstruktion „im Herrn“.
