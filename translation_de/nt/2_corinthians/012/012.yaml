source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: de
  text: Die Zeichen eines Apostels[a] wurden ja unter euch vollbracht – in aller Standhaftigkeit, durch Zeichen, Wunder und Machttaten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Apostels“, wenn die Formulierung ausdrücklich auf Paulus bezogen wird.'
    reason: alternative_reading
  - marker: b
    text: „Machttaten“ können auch mit „Kraftwirkungen“ oder sinngemäß mit „Wundern“ wiedergegeben werden; das griechische Wort betont machtvolle Taten.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: Die Zeichen … ja
  rationale: Das unverbundene μέν setzt eine bestätigende beziehungsweise einräumende Hervorhebung. Die Modalpartikel „ja“ gibt diesen Ton im Deutschen natürlich wieder, ohne einen nicht vorhandenen Gegensatz mit δέ zu ergänzen.
- source_word: τοῦ ἀποστόλου
  choice: eines Apostels
  rationale: Der Genitiv bezeichnet hier am ehesten die für einen Apostel kennzeichnenden Zeichen. „Eines Apostels“ wahrt zugleich die Möglichkeit, dass Paulus auf die Beglaubigung seines eigenen Aposteldienstes zielt.
- source_word: κατειργάσθη
  choice: wurden … vollbracht
  rationale: Die Passivform besagt, dass die Zeichen bewirkt beziehungsweise ausgeführt wurden, ohne den Handelnden ausdrücklich zu benennen. „Vollbracht“ ist im Kontext würdig und verständlich und erhält das Passiv.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Gemeint ist das Geschehen inmitten der korinthischen Gemeinde, nicht ein inneres Geschehen in einzelnen Personen.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: in aller Standhaftigkeit
  rationale: ὑπομονή bezeichnet beharrliches Ausharren unter Belastung. „Standhaftigkeit“ bringt diesen Sinn prägnant und in natürlichem Deutsch zum Ausdruck.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: durch Zeichen, Wunder und Machttaten
  rationale: Die Dreierformel wird in ihren einzelnen Begriffen bewahrt. „Machttaten“ gibt δυνάμεις als machtvolle, übernatürliche Taten wieder und vermeidet eine bloße Wiederholung von „Wunder“.
theological_decisions:
- issue: Bedeutung von „die Zeichen eines Apostels“
  choice: Die Formulierung bezeichnet Beglaubigungszeichen apostolischen Dienstes, die im Zusammenhang sowohl mit Standhaftigkeit als auch mit machtvollen Wundertaten erscheinen.
  alternative: Die Wendung bezeichnet ausschließlich Wunder als fest definierte Kennzeichen des Apostelamtes.
  rationale: Der Satz nennt zunächst die „Zeichen eines Apostels“ und fügt dann Standhaftigkeit sowie Zeichen, Wunder und Machttaten an. Die Übersetzung lässt die genaue syntaktische Beziehung dieser Angaben offen und legt keine über den Vers hinausgehende Liste apostolischer Kennzeichen fest.
- issue: Bestimmtheit von τοῦ ἀποστόλου
  choice: „eines Apostels“ als qualitative beziehungsweise generische Wiedergabe
  alternative: „des Apostels“ mit enger, ausdrücklicher Beziehung auf Paulus
  rationale: Der griechische bestimmte Artikel erlaubt im Deutschen beide Deutungsrichtungen. Im Kontext verteidigt Paulus zwar seinen eigenen Aposteldienst; die Wendung kann dennoch allgemein das für einen Apostel Kennzeichnende benennen. Die Hauptübersetzung wahrt diesen allgemeineren Sinn, die Fußnote die engere Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Zeichen“ entspricht dem griechischen Satzbau. Der Gedankenstrich macht die nachfolgende Entfaltung lesbar, ohne ihre genaue syntaktische Funktion abschließend festzulegen.
