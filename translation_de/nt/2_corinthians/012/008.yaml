lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: Darum
  rationale: ὑπέρ mit dem Genitiv bezeichnet hier die Angelegenheit beziehungsweise den Anlass des Bittens und verweist auf die zuvor genannte Bedrängnis. „Darum“ stellt diesen Rückbezug knapp und natürlich her.
- source_word: τρὶς
  choice: dreimal
  rationale: Das Adverb bezeichnet drei Gelegenheiten; „dreimal“ ist die klare und idiomatische moderne Wiedergabe.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Die Übersetzung gibt κύριος unmittelbar als „Herr“ wieder und nennt Jesus nicht ausdrücklich, da sein Name im griechischen Text nicht steht.
- source_word: παρεκάλεσα
  choice: bat ich … inständig
  rationale: παρακαλέω bezeichnet hier im Gebetskontext eine eindringliche Bitte. Die Verbindung „inständig bitten“ vermittelt den Ernst des Flehens in natürlichem Deutsch, ohne die Bedeutung zu übersteigern.
- source_word: ἵνα
  choice: es möge
  rationale: ἵνα leitet den Inhalt beziehungsweise das Ziel der Bitte ein. Der deutsche Konjunktiv mit „möge“ gibt die erbetene Handlung idiomatisch wieder.
- source_word: ἀποστῇ ἀπ’ ἐμοῦ
  choice: es möge von mir weichen
  rationale: ἀποστῇ bezeichnet ein Sich-Entfernen oder Weggehen. „Von mir weichen“ wahrt den würdevollen Ton und lässt mit dem unbestimmten „es“ offen, ob besonders der Dorn, die Bedrängnis oder der zuvor genannte Bote im Blick ist.
theological_decisions:
- issue: Bezug von „der Herr“
  choice: „den Herrn“ ohne ausdrückliche Ergänzung „Jesus“
  alternative: „den Herrn Jesus“
  rationale: Im Zusammenhang ist Jesus wahrscheinlich gemeint; der griechische Wortlaut nennt jedoch nur „den Herrn“. Die Übersetzung bewahrt diese sprachliche Zurückhaltung.
- issue: Unausgesprochenes Subjekt von ἀποστῇ
  choice: Neutrales „es“
  alternative: „er“, „der Bote“ oder „der Dorn“
  rationale: Das Subjekt des griechischen Verbs ist nur aus dem vorausgehenden Zusammenhang zu erschließen, der sowohl den „Dorn im Fleisch“ als auch einen „Boten Satans“ nennt. „Es“ vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung bleibt flüssig; „inständig bitten“ vermeidet sowohl archaisches „anflehen“ als auch ein zu schwaches schlichtes „bitten“. Die im Ausgangstext vorhandenen Mehrdeutigkeiten beim Bezug des Herrn und beim Subjekt des Weggehens bleiben erhalten.
