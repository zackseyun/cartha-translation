  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: de
  text: Seht, zum dritten Mal bin ich bereit, zu euch zu kommen[a], und ich werde euch nicht zur Last fallen[b]. Denn ich suche nicht euren Besitz, sondern euch. Denn nicht die Kinder sind verpflichtet, für die Eltern etwas zurückzulegen, sondern die Eltern für die Kinder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Seht, dieses dritte Mal bin ich bereit, zu euch zu kommen.«'
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete Verb kann besonders bedeuten, jemanden finanziell oder materiell zu belasten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Ein natürlicher, zugleich würdevoller Aufmerksamkeitsruf im modernen Deutschen; er bewahrt die Mehrzahlform des griechischen Imperativs.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: nun bin ich zum dritten Mal bereit, zu euch zu kommen
  rationale: Gibt die gegenwärtige Bereitschaft zu einem dritten geplanten Kommen idiomatisch wieder, ohne ausdrücklich zu behaupten, dass bereits zwei Besuche stattgefunden haben.
- source_word: καταναρκήσω
  choice: ich werde euch nicht zur Last fallen
  rationale: Die feste deutsche Wendung vermittelt die Belastung, die im Kontext besonders materiell oder finanziell gemeint sein kann.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: ich suche nicht euren Besitz, sondern euch
  rationale: Macht den pointierten Gegensatz zwischen dem Eigentum der Korinther und ihnen selbst klar und knapp verständlich.
- source_word: ὀφείλει
  choice: sind ... verpflichtet
  rationale: Gibt den Gedanken einer bestehenden Pflicht präzise und in natürlichem Deutsch wieder.
- source_word: θησαυρίζειν
  choice: etwas zurückzulegen
  rationale: Passt zum familiären Bild des Ansparens oder Vorsorgens, ohne den materiellen Sinn unnötig auf Geld allein zu verengen.
- source_word: γονεῦσιν / γονεῖς
  choice: Eltern
  rationale: Die griechische Bezeichnung umfasst beide Elternteile.
- source_word: τέκνα / τέκνοις
  choice: Kinder
  rationale: Entspricht der allgemeinen, geschlechtsübergreifenden Bedeutung des griechischen Ausdrucks.
theological_decisions:
- issue: Bedeutung der Angabe „zum dritten Mal“
  choice: Als dritte Bereitschaft beziehungsweise drittes geplantes Kommen formuliert
  alternative: Als sichere Aussage über einen bevorstehenden dritten tatsächlichen Besuch formulieren
  rationale: Die griechische Konstruktion verbindet „zum dritten Mal“ unmittelbar mit Paulus’ Bereitschaft zu kommen. Die Übersetzung bewahrt diese Aussage, ohne eine bestimmte Rekonstruktion seiner Reisegeschichte vorauszusetzen.
- issue: Art der Belastung
  choice: Allgemein „zur Last fallen“, mit Erläuterung des finanziellen Kontextes in der Fußnote
  alternative: Im Haupttext ausdrücklich „finanziell belasten“
  rationale: Das Verb bezeichnet hier wahrscheinlich materielle Beanspruchung, doch die allgemeinere Formulierung bewahrt seine Bildhaftigkeit und mögliche Bedeutungsbreite.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. „Seht“ bewahrt den direkten Aufmerksamkeitsruf; „zur Last fallen“ und „etwas zurücklegen“ sind geläufige Wendungen. Die beiden Fußnoten halten die syntaktische und lexikalische Mehrdeutigkeit transparent.
