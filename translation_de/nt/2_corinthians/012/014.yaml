  source_fidelity: 'Die Übersetzung gibt die zentralen Aussagen zutreffend wieder: Paulus kündigt seine gegenwärtige Bereitschaft zu einem dritten Kommen an, schließt aus, den Adressaten zur Last zu fallen, kontrastiert ihren Besitz mit ihnen selbst und formuliert das Bild von Eltern und Kindern angemessen. Das hinzugefügte „nun“ hat jedoch keine klare Grundlage im griechischen τοῦτο und sollte entfallen. Die wiederholte begründende Partikel γάρ wird am besten auch im letzten Satz mit „Denn“ wiedergegeben.'
  naturalness: „Seht“, „zur Last fallen“, „euren Besitz“ und „etwas zurücklegen“ sind modernes, verständliches Standarddeutsch. „Schließlich“ ist zwar möglich, verschiebt die zweite Begründung aber leicht in Richtung eines abschließenden Arguments; „Denn“ ist näher am Satzanschluss und ebenso natürlich.
  terminology: „Eltern“ und „Kinder“ entsprechen γονεῖς und τέκνα inklusiv und präzise. „Euren Besitz“ vermittelt τὰ ὑμῶν im beabsichtigten materiellen Kontrast klar. Die Fußnote zu καταναρκήσω erläutert die wahrscheinliche finanzielle bzw. materielle Nuance angemessen, ohne sie dem Haupttext aufzuzwingen.
