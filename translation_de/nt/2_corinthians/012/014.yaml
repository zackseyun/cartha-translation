  - severity: low
    issue: „Schließlich“ für γάρ im letzten Satz
    rationale: γάρ begründet den vorangehenden Satz erneut. „Denn“ bewahrt diese einfache argumentative Verknüpfung unmittelbarer als das stärker resümierende „Schließlich“.
