source:
  edition: SBLGNT
  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: de
  text: Und ich weiß von einem solchen Menschen – ob im Körper oder außerhalb des Körpers, weiß ich nicht[a]; Gott weiß es –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulus sagt nicht, ob dies im Körper oder getrennt vom Körper geschah.
    reason: Bewahrt die im griechischen Text ausdrücklich ungelöste Alternative, ohne sie als bloß »körperlich« zu paraphrasieren oder die Art des Vorgangs näher zu bestimmen.
lexical_decisions:
- source_word: οἶδα
  choice: ich weiß
  rationale: Die übliche Wiedergabe für kognitives Wissen; die Wiederholung von »wissen« bleibt erhalten.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: von einem solchen Menschen
  rationale: Im Deutschen verlangt »wissen« bei einer Person in diesem Sinn idiomatisch »von«. »Ein solcher Mensch« bewahrt die indirekte Bezugnahme, ohne die Person ausdrücklich mit Paulus gleichzusetzen.
- source_word: εἴτε ... εἴτε
  choice: ob ... oder
  rationale: Natürliche deutsche Entsprechung für die beiden offen gelassenen Möglichkeiten.
- source_word: ἐν σώματι
  choice: im Körper
  rationale: Formale und im gegebenen Gegensatz verständliche Wiedergabe; sie lässt die Art des Erlebnisses unbestimmt.
- source_word: χωρὶς τοῦ σώματος
  choice: außerhalb des Körpers
  rationale: χωρίς bezeichnet hier die Trennung vom Körper. Die Formulierung bildet einen klaren Gegensatz zu »im Körper«, ohne einen außerleiblichen Zustand als Tatsache zu behaupten.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: weiß ich nicht; Gott weiß es
  rationale: Der Gegensatz zwischen dem Nichtwissen des Paulus und Gottes Wissen wird durchgängig mit »wissen« wiedergegeben; »es« ist im Deutschen idiomatisch.
- source_word: θεὸς
  choice: Gott
  rationale: Eindeutige und übliche deutsche Wiedergabe.
theological_decisions:
- issue: Indirekte Selbstbezeichnung des Paulus und Art des Erlebnisses
  choice: Die Wendung »ein solcher Mensch« sowie die Alternative »im Körper oder außerhalb des Körpers« bleiben bestehen.
  alternative: Paulus ausdrücklich als die betreffende Person benennen oder den Vorgang als tatsächliches außerkörperliches Erlebnis darstellen.
  rationale: Der griechische Text wahrt rhetorische Distanz und entscheidet nicht, ob das Erlebnis körperlich oder vom Körper getrennt geschah. Diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche bewahren den eingeschobenen Charakter der Aussage. »Von einem solchen Menschen wissen« ist natürlicher als das wörtlichere, aber im Deutschen missverständliche »einen solchen Menschen kennen«.
