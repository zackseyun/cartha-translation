  to: Ich bin zum Narren geworden; ihr habt mich dazu gezwungen. Denn ich hätte von euch empfohlen werden sollen. Ich stand nämlich in nichts hinter den »Überaposteln« zurück[a], auch wenn ich nichts bin.
  rationale: Die alleinige Änderung entfernt die nicht im griechischen Text verankerte Nuance »eigentlich« und ersetzt die allgemeinere Form »hätte ... werden müssen« durch »hätte ... werden sollen«, das die erwartete, aber nicht erfüllte Empfehlung durch die Korinther genauer ausdrückt. Textstruktur, Ambiguität und Fußnotenanker bleiben erhalten.
