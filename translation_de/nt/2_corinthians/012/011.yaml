  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: de
  text: Ich bin zum Narren geworden; ihr habt mich dazu gezwungen. Denn ich hätte von euch empfohlen werden sollen. Ich stand nämlich in nichts hinter den »Überaposteln« zurück[a], auch wenn ich nichts bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den überaus bedeutenden Aposteln«. Der griechische Ausdruck ist stark steigernd und kann hier ironisch gemeint sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα ἄφρων
  choice: Ich bin zum Narren geworden
  rationale: Das Perfekt bezeichnet einen aus einem vorausgehenden Geschehen entstandenen gegenwärtigen Zustand; die substantivische Wiedergabe bewahrt zugleich Paulus’ ironische Selbstbeschreibung.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: ihr habt mich dazu gezwungen
  rationale: Das betonte ὑμεῖς wird durch die ausdrückliche Nennung von »ihr« bewahrt; »dazu« verweist natürlich auf das törichte Rühmen im Kontext.
- source_word: ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι
  choice: Denn eigentlich hätte ich von euch empfohlen werden müssen
  rationale: Die Formulierung gibt die nicht erfüllte Verpflichtung idiomatisch wieder. »Empfohlen« bezeichnet hier, dass die Korinther für Paulus hätten eintreten und ihn anerkennend darstellen sollen.
- source_word: οὐδὲν γὰρ ὑστέρησα
  choice: Ich stand nämlich in nichts … zurück
  rationale: Die deutsche Wendung bewahrt den Vergleichssinn von ὑστερέω und gibt das zweite γάρ natürlich mit »nämlich« wieder.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: den »Überaposteln«
  rationale: »Überapostel« erhält die starke Steigerung und lässt den im Kontext wahrscheinlichen ironisch-polemischen Klang erkennen, ohne ihn durch »sogenannt« ausdrücklich festzulegen.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: auch wenn ich nichts bin
  rationale: Die Wiedergabe bewahrt die konz مع?essive Form und Paulus’ pointierte Selbstaussage, ohne »nichts« zu »niemand« umzudeuten.
theological_decisions:
- issue: Bezug und rhetorische Kraft von τῶν ὑπερλίαν ἀποστόλων
  choice: »Überapostel« mit markierter rhetorischer Distanz
  alternative: »die überaus bedeutenden Apostel« als möglicherweise nichtironische Bezeichnung hoch angesehener Apostel
  rationale: Der Ausdruck ist stark emphatisch und im Zusammenhang wahrscheinlich ironisch oder polemisch. Die Übersetzung wahrt diese Spannung, ohne durch »sogenannt« die Ironie endgültig festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Begründung mit γάρ wird durch »Denn« und »nämlich« erkennbar gehalten. Die Anführungszeichen bei »Überaposteln« signalisieren rhetorische Distanz, während die Fußnote die echte Deutungsalternative offenhält.
