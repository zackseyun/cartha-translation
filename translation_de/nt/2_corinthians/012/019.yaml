id: 2CO.12.19
reference: 2 Corinthians 12:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: de
  text: Meint ihr schon die ganze Zeit, dass wir uns vor euch verteidigen? Vor Gott reden wir in Christus. Doch alles, ihr Geliebten, dient dazu, euch aufzubauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: schon die ganze Zeit
  rationale: Gibt im Zusammenhang die länger anhaltende Annahme der Leser idiomatisch wieder, nicht bloß einen weit zurückliegenden Zeitpunkt.
- source_word: δοκεῖτε
  choice: Meint ihr
  rationale: Gibt das Präsens in der rhetorischen Frage natürlich wieder; zusammen mit „schon die ganze Zeit“ bleibt der fortdauernde Charakter erhalten.
- source_word: ἀπολογούμεθα
  choice: wir würden uns … verteidigen
  rationale: Bewahrt den Gedanken der Selbstverteidigung; der Konjunktiv entspricht im Deutschen der als vermeintlich zurückgewiesenen Annahme.
- source_word: κατέναντι θεοῦ
  choice: Vor Gott
  rationale: Bezeichnet Gottes Gegenwart und die Rechenschaft vor ihm knapp und würdevoll.
- source_word: ἐν Χριστῷ
  choice: in Christus
  rationale: Die im Deutschen feststehende paulinische Wendung wahrt sowohl den Titel als auch die Vorstellung des Redens in der Verbundenheit mit Christus.
- source_word: λαλοῦμεν
  choice: reden wir
  rationale: Natürliches deutsches Präsens mit unmittelbarer Aussagekraft.
- source_word: τὰ δὲ πάντα
  choice: Doch alles
  rationale: δέ markiert hier den Übergang und einen leichten Gegensatz zur zurückgewiesenen Selbstverteidigung; „alles“ umfasst Paulus’ Reden und Handeln.
- source_word: ἀγαπητοί
  choice: ihr Geliebten
  rationale: Bewahrt die direkte, liebevolle Anrede und ihre Verbindung zum Wortfeld der Liebe.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: dient dazu, euch aufzubauen
  rationale: Gibt Zweck beziehungsweise Nutzen klar wieder und erhält das verständliche Bild des Aufbauens.
theological_decisions:
- issue: Wiedergabe von ἐν Χριστῷ
  choice: in Christus
  alternative: im Messias
  rationale: In der festen paulinischen Formel klingt Χριστός im Deutschen natürlich als „Christus“; „im Messias“ würde hier ungewohnt wirken und die Formel unnötig verengen.
- issue: Bezug von οἰκοδομή
  choice: euch aufzubauen
  alternative: zu eurer Erbauung
  rationale: Die aktive Form bewahrt die geistliche Aufbau-Metapher, bleibt aber für heutige Leser verständlicher als das kirchensprachlich geprägte „Erbauung“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt pointiert; die beiden folgenden Aussagen sind zur Wahrung des griechischen Gedankengangs getrennt. Keine unnötige Fach- oder Kirchensprache.
