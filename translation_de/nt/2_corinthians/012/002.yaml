  naturalness: Modernes, verständliches Standarddeutsch mit angemessen würdigem Register. Die eingeschobene ob-Konstruktion und die Gedankenstriche sind gut lesbar. „Im Messias“ ist bewusst quellennah und weniger traditionell als „in Christus“, aber im Rahmen der vorgegebenen Titelwiedergabe akzeptabel.
