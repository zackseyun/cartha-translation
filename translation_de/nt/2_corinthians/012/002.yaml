id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: de
  text: Ich kenne einen Mann im Messias[a], der vor vierzehn Jahren – ob im Körper, weiß ich nicht, oder außerhalb des Körpers, weiß ich nicht; Gott weiß es[b] – bis in den dritten Himmel[c] entrückt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: „in Christus“. Das griechische ἐν Χριστῷ verwendet den Titel „Christus“, das heißt „Messias“.'
    reason: alternative_reading
  - marker: b
    text: Paulus lässt ausdrücklich offen, ob dies im Körper oder außerhalb des Körpers geschah; Gott weiß es.
    reason: theological_tension
  - marker: c
    text: „Der dritte Himmel“ ist eine Ausdrucksweise antiker jüdischer Himmelsvorstellungen. Die Übersetzung behält sie bei, ohne sie durch eine Deutung zu ersetzen.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: Ich kenne
  rationale: Das Perfekt οἶδα hat im Koine-Griechischen präsentische Bedeutung. Bei einer Person ist „ich kenne“ im Deutschen die natürliche Entsprechung.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Das maskuline Singularwort bezeichnet hier einen bestimmten Mann; im Zusammenhang spricht Paulus offenbar verhüllend von sich selbst.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός ist hier ein Titel. „Messias“ gibt dessen Bedeutung wieder; die knappe Präpositionalkonstruktion bewahrt zugleich die paulinische Wendung, ohne sie als „mit dem Messias verbunden“ auszulegen.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: vor vierzehn Jahren
  rationale: Dies ist die idiomatische deutsche Wiedergabe der Zeitangabe mit πρό und Genitiv.
- source_word: εἴτε ἐν σώματι
  choice: ob im Körper
  rationale: Die Formulierung bewahrt den Gegensatz zu „außerhalb des Körpers“ und lässt die Art des Erlebnisses offen.
- source_word: ἐκτὸς τοῦ σώματος
  choice: außerhalb des Körpers
  rationale: Direkte und verständliche Entsprechung, die den räumlich formulierten Gegensatz des Griechischen erhält.
- source_word: ὁ θεὸς οἶδεν
  choice: Gott weiß es
  rationale: Das ergänzte „es“ ist im Deutschen idiomatisch; „allein“ wird nicht hinzugefügt, da es im Griechischen nicht ausdrücklich steht.
- source_word: ἁρπαγέντα
  choice: entrückt wurde
  rationale: Das passive Aoristpartizip wird für einen natürlichen deutschen Satz als finites Passiv wiedergegeben. „Entrückt“ bezeichnet hier ein plötzliches Hinwegnehmen nach oben, ohne die körperliche oder nichtkörperliche Art festzulegen.
- source_word: τὸν τοιοῦτον
  choice: der
  rationale: Das rückbezügliche „einen solchen“ wäre im Deutschen schwerfällig. Der Relativsatz nimmt denselben Mann eindeutig wieder auf.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: bis in den dritten Himmel
  rationale: „Bis in“ bildet sowohl ἕως als auch die als Ziel verstandene Wendung natürlich und präzise ab.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus
  rationale: Die Übersetzung gibt den Titel als „Messias“ wieder und bewahrt die prägnante paulinische In-Beziehung, statt sie deutend aufzulösen.
- issue: Art der Erfahrung des Paulus
  choice: Die zweimal ausgesprochene Ungewissheit bleibt erhalten.
  alternative: eine ausdrücklich körperliche Himmelfahrt oder eine ausdrücklich außerkörperliche Vision
  rationale: Der griechische Text entscheidet die Frage nicht und verweist das Wissen darüber ausdrücklich an Gott.
- issue: Bedeutung des „dritten Himmels“
  choice: Die kosmologische Wendung wird wörtlich bewahrt.
  alternative: höchster Himmel oder Paradies
  rationale: Eine erklärende Ersetzung würde die antike Ausdrucksweise und ihre mögliche Spannung zum folgenden Vers vorschnell auslegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche bilden den eingeschobenen Ausdruck der Ungewissheit ab; ein Semikolon vor „Gott weiß es“ macht dessen abschließende Funktion lesbar. „Im Messias“ ist bewusst quellennah und titelbezogen, auch wenn „in Christus“ im traditionellen deutschen Bibelregister geläufiger ist.
