  to: Ich kenne einen Mann im Messias[a], der vor vierzehn Jahren – ob im Körper, weiß ich nicht, oder außerhalb des Körpers, weiß ich nicht; Gott weiß es[b] – bis in den dritten Himmel[c] entrückt wurde.
  rationale: Die Übersetzung selbst kann unverändert bleiben. Ausschließlich Fußnote b wird wortlautnäher formuliert, damit sie die ausdrückliche Ungewissheit des Paulus erklärt, ohne mit „nur“ eine im griechischen Text nicht explizit formulierte Einschränkung hinzuzufügen.
