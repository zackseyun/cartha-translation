  to: Ich habe Titus gebeten, zu euch zu gehen, und den Bruder mit ihm gesandt. Hat Titus euch etwa ausgenutzt? Sind wir nicht im selben Geist[a] vorgegangen? Sind wir nicht denselben Spuren gefolgt?
  rationale: Die Zielergänzung „zu euch zu gehen“ macht die im unmittelbaren Kontext vorausgesetzte Sendung idiomatisch klar, ohne die Bedeutung zu verändern. „Im selben Geist vorgegangen“ ist modernes Standarddeutsch und erhält die offene Referenz von πνεῦμα. Die Fußnote formuliert beide Auslegungsmöglichkeiten neutral und klar.
