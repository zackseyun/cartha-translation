source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: de
  text: Ich habe Titus gebeten, zu euch zu gehen, und den Bruder mit ihm gesandt. Hat Titus euch etwa ausgenutzt? Sind wir nicht im selben Geist[a] vorgegangen? Sind wir nicht denselben Spuren gefolgt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch denselben Geist“. Gemeint sein kann dieselbe Haltung oder Gesinnung; möglich ist auch ein Bezug auf den Heiligen Geist.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα
  choice: Ich bat Titus eindringlich zu kommen
  rationale: Das Verb bezeichnet hier eine nachdrückliche Bitte im Zusammenhang mit Titus’ Auftrag. »Zu kommen« wird aus dem Sendungskontext idiomatisch ergänzt.
- source_word: συναπέστειλα
  choice: sandte den Bruder mit ihm
  rationale: Das zusammengesetzte Verb bezeichnet das Mitsenden einer weiteren Person; die deutsche Wendung gibt diese Beziehung klar wieder.
- source_word: τὸν ἀδελφόν
  choice: den Bruder
  rationale: Der bestimmte Artikel wird bewahrt, ohne ein im Griechischen nicht vorhandenes Possessivpronomen hinzuzufügen. Gemeint ist offenbar ein den Adressaten bekannter Glaubensbruder.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς
  choice: Hat Titus euch etwa ausgenutzt?
  rationale: μήτι kennzeichnet eine Frage, auf die eine verneinende Antwort erwartet wird; »etwa« signalisiert dies natürlich. »Ausgenutzt« wahrt die mögliche finanzielle oder materielle Dimension, ohne sie auf Betrug zu verengen.
- source_word: τῷ αὐτῷ πνεύματι
  choice: in demselben Geist
  rationale: Die Formulierung erhält die Mehrdeutigkeit zwischen derselben inneren Haltung und dem Wirken desselben Heiligen Geistes. Die Fußnote weist auf beide Möglichkeiten hin.
- source_word: περιεπατήσαμεν
  choice: gewandelt
  rationale: Das traditionelle, aber weiterhin verständliche Verb bewahrt Paulus’ Weg-Metapher und passt zur anschließenden Rede von Spuren.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: denselben Spuren gefolgt
  rationale: Die Wendung gibt das Bild von Fußspuren idiomatisch wieder und bezeichnet zugleich dieselbe Lebens- und Handlungsweise.
theological_decisions:
- issue: Bedeutung von τῷ αὐτῷ πνεύματι
  choice: »in demselben Geist« mit offener Referenz
  alternative: »durch denselben Geist« als ausdrücklicher Hinweis auf den Heiligen Geist oder »mit derselben Haltung« als rein menschliche Disposition
  rationale: Der unmittelbare Zusammenhang betont die übereinstimmende Lauterkeit von Paulus und Titus. Zugleich kann πνεῦμα auf den Heiligen Geist bezogen werden. Die Hauptformulierung und die Fußnote bewahren diese Spannung, statt sie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Gewandelt« bewahrt bewusst die paulinische Weg-Metapher; der übrige Satzbau ist gegenwärtig und allgemein verständlich.
