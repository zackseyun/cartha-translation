source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: de
  text: Darum habe ich Gefallen an Schwächen, an Schmähungen, an Nöten, an Verfolgungen und Bedrängnissen um des Messias willen[a]; denn wenn ich schwach bin, dann bin ich stark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „um Christi willen“ oder „um des Christus willen“.'
    reason: Alternative Wiedergabe von Χριστοῦ bei stärker namenartigem bzw. traditionellem Gebrauch.
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang und klingt im modernen Deutsch natürlich.
- source_word: εὐδοκῶ
  choice: habe ich Gefallen
  rationale: Gibt die positive Zustimmung bzw. das Wohlgefallen wieder, ohne die Aussage auf bloße Zufriedenheit oder Ergebung abzuschwächen.
- source_word: ἐν ἀσθενείαις
  choice: an Schwachheiten
  rationale: Bewahrt den Plural und den weiten Sinn menschlicher Schwäche, ohne ihn auf Krankheit zu verengen.
- source_word: ἐν ὕβρεσιν
  choice: an Misshandlungen
  rationale: ὕβρις bezeichnet hier entehrende, übergriffige Behandlung; „Misshandlungen“ erfasst mehr als nur verbale Beleidigungen.
- source_word: ἐν ἀνάγκαις
  choice: an Nöten
  rationale: Gibt bedrängende Zwangslagen knapp und idiomatisch wieder.
- source_word: ἐν διωγμοῖς
  choice: an Verfolgungen
  rationale: Entspricht dem klaren Sinn von Verfolgung, die Paulus erleidet.
- source_word: καὶ στενοχωρίαις
  choice: und Bedrängnissen
  rationale: Bewahrt das Bild von Enge und starkem Druck sowie die Intensität des Ausdrucks.
- source_word: ὑπὲρ Χριστοῦ
  choice: um des Messias willen
  rationale: ὑπέρ bezeichnet hier den Grund bzw. die Hingabe, derentwegen die Leiden getragen werden; „Messias“ wahrt den Titelcharakter von Χριστός.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: denn wenn ich schwach bin
  rationale: Das temporale ὅταν mit Konjunktiv hat allgemeinen Sinn; „wenn“ ist im Deutschen natürlich und lässt die wiederholte bzw. allgemeine Geltung erkennen.
- source_word: τότε δυνατός εἰμι
  choice: dann bin ich stark
  rationale: „Stark“ bildet den unmittelbaren Gegensatz zu „schwach“ und erhält die paradoxe Zuspitzung.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / Christus
  rationale: Hier kann Χριστός als Titel verstanden werden; „Messias“ macht diesen Titelcharakter sichtbar. Die traditionelle, im deutschen kirchlichen Sprachgebrauch geläufige Wiedergabe steht in der Fußnote, sodass die Spannung zwischen Titel und namenartigem Gebrauch nicht verdeckt wird.
- issue: Art der Stärke in τότε δυνατός εἰμι
  choice: bin ich stark
  alternative: bin ich mächtig / vermag ich etwas
  rationale: Der Text benennt nicht ausdrücklich, auf welche Weise die Stärke zustande kommt. Die knappe Formulierung bewahrt diese theologische Spannung und erklärt sie nicht über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konstruktion wurde mit „an“ beibehalten, um die Aufzählung rhythmisch zu gliedern. „Habe Gefallen“ erhält die provokante Stärke von εὐδοκῶ; „Misshandlungen“ vermeidet eine Verengung von ὕβρις auf bloße Worte.
