  terminology: „Visionen“, „Offenbarungen“ und „des Herrn“ sind angemessen. Der Fußnotenhinweis zur offenen Genitivbeziehung ist korrekt und sollte erhalten bleiben. „Nützlich“ trifft συμφέρον im Kontext ausreichend.
