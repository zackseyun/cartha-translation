source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: de
  text: Rühmen ist nötig, wenn es auch nicht nützlich ist; doch werde ich auf Visionen und Offenbarungen des Herrn[a] zu sprechen kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vom Herrn«. Der griechische Genitiv kann die Herkunft bezeichnen; »des Herrn« bewahrt jedoch die Formulierung und Mehrdeutigkeit des griechischen Textes genauer.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι δεῖ
  choice: Ich muss mich rühmen
  rationale: Der substantivierte Infinitiv mit δεῖ bezeichnet eine Notwendigkeit. Die persönliche deutsche Konstruktion ist natürlich und bewahrt den widerwilligen Ton im Zusammenhang.
- source_word: οὐ συμφέρον μέν
  choice: Es ist zwar nicht nützlich
  rationale: συμφέρον bezeichnet das, was nützt oder förderlich ist. »zwar« bildet zusammen mit »doch« die μέν-δέ-Gegenüberstellung ab.
- source_word: ἐλεύσομαι δὲ εἰς
  choice: doch ich komme nun auf … zu sprechen
  rationale: Im Kontext leitet Paulus zu einem neuen Thema über. Die idiomatische Formulierung gibt diese Diskursbewegung genauer wieder als das wörtliche »ich werde kommen«.
- source_word: ὀπτασίας
  choice: Visionen
  rationale: ὀπτασία bezeichnet eine übernatürliche Schau oder Vision; »Visionen« ist verständlich und entspricht dem Plural.
- source_word: ἀποκαλύψεις
  choice: Offenbarungen
  rationale: Der etablierte Ausdruck bewahrt die Vorstellung eines Enthüllens beziehungsweise göttlichen Bekanntmachens.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal bewahrt und kann sowohl Zugehörigkeit als auch Herkunft beziehungsweise Urheberschaft ausdrücken.
theological_decisions:
- issue: Beziehung von κυρίου zu »Visionen und Offenbarungen«
  choice: des Herrn
  alternative: vom Herrn
  rationale: Der griechische Genitiv legt seine genaue Beziehung nicht ausdrücklich fest. »des Herrn« bewahrt diese Mehrdeutigkeit besser, während »vom Herrn« eindeutig die Herkunft festlegen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die μέν-δέ-Struktur wird mit »zwar … doch« wiedergegeben; die thematische Überleitung ist idiomatisch formuliert.
