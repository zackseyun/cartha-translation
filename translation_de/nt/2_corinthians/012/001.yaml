  source_fidelity: 'Die Grundbedeutung wird treffend wiedergegeben: δεῖ bezeichnet Notwendigkeit, συμφέρον den Nutzen/Vorteil, und ἐλεύσομαι εἰς leitet zum folgenden Themenbereich über. Die Wiedergabe von μέν ... δέ mit „zwar ... doch“ ist sachgerecht. Allerdings glättet die Aufteilung in zwei Hauptsätze die im Griechischen zunächst unpersönliche Konstruktion „Rühmen ist nötig“ zu stark zu einer direkten Selbstreferenz. Eine nähere formale Entsprechung ist ohne unnatürliches Deutsch möglich.'
