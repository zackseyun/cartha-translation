source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: de
  text: 'Und er hat zu mir gesagt: »Meine Gnade genügt dir, denn Kraft kommt in Schwachheit zur Vollendung.«[a] Darum will ich mich umso lieber meiner Schwächen rühmen, damit die Kraft des Messias sich über mir niederlässt.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn Kraft wird in Schwachheit vollkommen.« Traditionell auch: »Denn meine Kraft wird in Schwachheit vollkommen.«'
    reason: lexical_and_traditional_translation_alternative
  - marker: b
    text: 'Auch: »damit die Kraft des Messias auf mir ruht«; das Bild klingt wörtlicher an: Sie schlägt ihr Zelt über mir auf.'
    reason: lexical_alternative
  - marker: c
    text: Traditionell wird Χριστός hier mit »Christus« wiedergegeben.
    reason: alternative_rendering
lexical_decisions:
- source_word: εἴρηκέν
  choice: hat gesagt
  rationale: Das griechische Perfekt bezeichnet eine vergangene Äußerung mit fortdauernder Geltung; das deutsche Perfekt gibt dies hier natürlich wieder.
- source_word: Ἀρκεῖ
  choice: genügt
  rationale: „Genügt“ ist knapp, idiomatisch und bewahrt den Gedanken der ausreichenden Gnade.
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ ist im paulinischen Zusammenhang die sachlich und theologisch angemessene Wiedergabe.
- source_word: δύναμις
  choice: Kraft
  rationale: „Kraft“ passt natürlich zur göttlichen Wirksamkeit und wahrt die Wiederholung desselben griechischen Substantivs in beiden Vershälften.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: Schwachheit / Schwachheiten
  rationale: 'Singular und Plural werden beibehalten: zuerst der allgemeine Grundsatz, dann die konkreten Schwachheiten des Paulus.'
- source_word: τελεῖται
  choice: kommt zur Vollendung
  rationale: Die Formulierung bewahrt den Ziel- und Vollendungssinn von τελέω, ohne die Aussage erklärend aufzulösen.
- source_word: ἥδιστα … μᾶλλον
  choice: umso lieber
  rationale: Die beiden Steigerungselemente werden in natürlichem Deutsch gemeinsam wiedergegeben.
- source_word: καυχήσομαι
  choice: will ich mich … rühmen
  rationale: „Sich rühmen“ bewahrt das für Paulus typische paradoxe Motiv des Rühmens.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: über mir Wohnung nimmt
  rationale: Die Wiedergabe erhält sowohl den Gedanken des Wohnens als auch die auf Paulus gerichtete räumliche Bildsprache; das wörtlichere Zeltmotiv wird in der Fußnote erläutert.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist hier als Titel verständlich; „Messias“ macht diesen Titelcharakter im Deutschen deutlich.
theological_decisions:
- issue: Fehlendes Possessivpronomen bei δύναμις im angegebenen SBLGNT-Text
  choice: denn Kraft kommt in Schwachheit zur Vollendung
  alternative: denn meine Kraft kommt in Schwachheit zur Vollendung
  rationale: Der vorgelegte griechische Haupttext enthält bei δύναμις kein μου. Deshalb wird „meine“ nicht stillschweigend ergänzt; die bekannte alternative Fassung wird in einer Fußnote genannt.
- issue: Aussage von τελεῖται über Kraft
  choice: kommt zur Vollendung
  alternative: wird vollkommen
  rationale: Die Übersetzung lässt die theologische Spannung stehen, dass Kraft gerade in Schwachheit ihr Ziel beziehungsweise ihre Vollendung erreicht, ohne eine vermeintliche Unvollkommenheit Gottes dogmatisch wegzuerklären.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / des Christus
  rationale: Der Titelcharakter wird sichtbar gemacht, ohne eine besondere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, während „umso lieber“ und „über mir Wohnung nimmt“ ein natürliches deutsches Sprachgefühl sichern. Die Anrede steht im vertraulichen Singular „dir“, entsprechend dem griechischen σοι.
