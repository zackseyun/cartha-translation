  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: de
  text: Denn wenn ich mich rühmen wollte, wäre ich nicht töricht, denn ich würde die Wahrheit sagen. Doch ich halte mich zurück, damit niemand mich höher einschätzt, als es dem entspricht, was er an mir sieht oder von mir hört[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „oder irgendetwas von mir hört“. Im Griechischen steht nach „hört“ ausdrücklich ein unbestimmtes „etwas“, das im Deutschen sinngemäß mitverstanden werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ... θελήσω καυχήσασθαι
  choice: wenn ich mich rühmen wollte
  rationale: Die konditionale Konstruktion mit ἐάν und Aorist Konjunktiv bezeichnet eine hypothetische Möglichkeit. Der deutsche Konjunktiv „wollte“ gibt diesen Sinn natürlich wieder; „sich rühmen“ wahrt zudem den paulinischen Zusammenhang des widerwilligen Eigenlobs.
- source_word: οὐκ ἔσομαι ἄφρων
  choice: wäre ich nicht unvernünftig
  rationale: Der prädikative Ausdruck bezeichnet hier törichtes bzw. unvernünftiges Verhalten. „Unvernünftig“ ist modernes, klares Deutsch und vermeidet eine unnötige Festlegung auf das substantivische „ein Narr“.
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: denn ich würde die Wahrheit sagen
  rationale: Das Futur steht innerhalb der hypothetischen Aussage. Der deutsche Konjunktiv bildet diese Abhängigkeit idiomatisch ab und bewahrt den ausdrücklichen Wahrheitsanspruch.
- source_word: φείδομαι δέ
  choice: Doch ich halte mich zurück
  rationale: Das Verb bezeichnet hier, dass Paulus auf weiteres Rühmen verzichtet. „Ich halte mich zurück“ ist verständlich und bringt die bewusste Selbstbeschränkung deutlicher zum Ausdruck als ein wörtliches „ich schone“.
- source_word: μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ
  choice: damit niemand höher von mir denkt, als es dem entspricht, was
  rationale: λογίζομαι bezeichnet eine Einschätzung oder Bewertung, während ὑπέρ das Überschreiten eines Maßstabs ausdrückt. Die Formulierung gibt den Vergleich in natürlichem Deutsch wieder, ohne ihn zu einer bloßen Meinungsäußerung zu verflachen.
- source_word: βλέπει με
  choice: er an mir sieht
  rationale: Die Formulierung bezeichnet das unmittelbar an Paulus Beobachtbare. „An mir sieht“ ist im Deutschen natürlicher als eine formale Nachbildung der griechischen Wortstellung.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: von mir hört
  rationale: ἐξ ἐμοῦ bezeichnet, was von Paulus ausgeht, wahrscheinlich seine eigenen Äußerungen. Im idiomatischen Deutsch kann das indefinite τι unausgedrückt bleiben; die Fußnote dokumentiert die ausdrücklichere Wiedergabe.
theological_decisions:
- issue: Das Verhältnis zwischen wahrheitsgemäßem Rühmen und dem bewussten Verzicht darauf
  choice: Paulus erklärt sein mögliches Rühmen aufgrund seines Wahrheitsgehalts für nicht unvernünftig, hält sich aber dennoch zurück, um eine überhöhte Einschätzung seiner Person zu verhindern.
  alternative: Die Aussage entweder als allgemeine Rechtfertigung des Rühmens oder als Verurteilung jedes Rühmens als falsch beziehungsweise sündig zu deuten.
  rationale: 'Der griechische Text hält beides zusammen: Das hypothetische Rühmen wäre wahrheitsgemäß, dennoch verzichtet Paulus darauf. Die Übersetzung bewahrt diese Spannung, ohne daraus eine weitergehende Lehraussage über jedes Rühmen abzuleiten.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt dem Gedankengang des griechischen Textes eng verbunden, wird aber an natürliches deutsches Vergleichsgefüge angepasst.
