source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: de
  text: 'Ich fürchte, dass mein Gott mich, wenn ich wiederkomme, bei euch demütigt[a] und dass ich um viele von denen trauern werde, die schon früher gesündigt und die Unreinheit, sexuelle Unmoral und Ausschweifung[b], die sie begangen haben, nicht bereut haben.


    [a] Oder: »vor euch erniedrigt«. Das griechische Verb kann sowohl »demütigen« als auch »erniedrigen« bedeuten; auch die Wendung »bei euch« kann hier im Sinn von »vor euch« verstanden werden.


    [b] Oder: »Zügellosigkeit«. Gemeint ist schamloses, ungehemmtes Verhalten, häufig mit sexueller Bedeutung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor euch erniedrigt«. Das griechische Verb kann sowohl »demütigen« als auch »erniedrigen« bedeuten; auch die Wendung »bei euch« kann hier im Sinn von »vor euch« verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Zügellosigkeit«. Gemeint ist schamloses, ungehemmtes Verhalten, häufig mit sexueller Bedeutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: wenn ich wiederkomme
  rationale: Der Genitivus absolutus bezeichnet im Zusammenhang mit der aus Vers 20 fortwirkenden Befürchtung den Zeitpunkt eines erneuten Besuchs. Die deutsche temporale Formulierung ist natürlich und gibt πάλιν als »wieder« wieder.
- source_word: ταπεινώσῃ με ὁ θεός μου
  choice: mein Gott mich … demütigt
  rationale: ταπεινόω kann »demütigen«, »erniedrigen« oder »niedrig machen« bedeuten. »Demütigt« wahrt die mögliche providenzielle Bedeutung, ohne die ebenfalls mögliche öffentliche Erniedrigung auszuschließen.
- source_word: πρὸς ὑμᾶς
  choice: vor euch
  rationale: Die Präposition bezeichnet hier wahrscheinlich den Bereich beziehungsweise die Gegenwart der korinthischen Gemeinde. »Vor euch« bringt den möglichen Beiklang einer Demütigung in ihrer Gegenwart zum Ausdruck; »bei euch« bleibt als Alternative in der Fußnote erhalten.
- source_word: πενθήσω
  choice: ich … trauern werde
  rationale: πενθέω bezeichnet tiefes Trauern oder Klagen. Das Futur wird beibehalten und in die aus dem vorherigen Vers fortgesetzte Befürchtung eingebettet.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: viele von denen, die schon früher gesündigt
  rationale: Die partitive Konstruktion wird ausdrücklich erhalten. Das Perfekt weist auf früher begangene Sünden mit fortdauernder Bedeutung hin; »schon früher gesündigt« gibt dies idiomatisch wieder.
- source_word: μὴ μετανοησάντων
  choice: nicht bereut haben
  rationale: μετανοέω bezeichnet Umdenken und Abkehr. Im unmittelbaren Satzanschluss an die genannten Taten ist »nicht bereut haben« modernes, verständliches Deutsch; es meint hier nicht bloß ein Gefühl des Bedauerns, sondern die ausgebliebene Abkehr.
- source_word: ἀκαθαρσίᾳ
  choice: Unreinheit
  rationale: »Unreinheit« bewahrt die breite moralische Bedeutung des griechischen Ausdrucks und lässt seine sexuelle Färbung im Kontext offen.
- source_word: πορνείᾳ
  choice: sexuelle Unmoral
  rationale: Der Ausdruck gibt πορνεία in verständlichem Gegenwartsdeutsch wieder, ohne ihn auf eine einzelne Form sexuellen Fehlverhaltens zu verengen.
- source_word: ἀσελγείᾳ
  choice: Ausschweifung
  rationale: ἀσέλγεια bezeichnet schamloses und ungehemmtes Verhalten, oft in sexueller Hinsicht. »Ausschweifung« wahrt sowohl die Zügellosigkeit als auch den Kontext der Lasterliste.
- source_word: ᾗ ἔπραξαν
  choice: die sie praktiziert haben
  rationale: πράσσω kann wiederholtes oder gewohnheitsmäßiges Tun bezeichnen. Der Relativsatz wird auf die zusammengehörige Reihe der genannten Verhaltensweisen bezogen.
theological_decisions:
- issue: Fortführung der Befürchtung aus Vers 20
  choice: »Ich fürchte, dass …« wird ausdrücklich aufgenommen und auf beide folgenden Aussagen bezogen.
  alternative: Eine formalere Fortsetzung mit »dass nicht etwa …« beziehungsweise »damit nicht …«
  rationale: Das einleitende μή setzt syntaktisch die in Vers 20 genannte Furcht fort. Da ein isolierter deutscher Vers diese Verbindung sonst nur schwer erkennen lässt, wird das implizite Verb ergänzt, ohne aus der Befürchtung eine sichere Vorhersage zu machen.
- issue: Bedeutungsumfang von μετανοέω
  choice: »nicht bereut haben« im Sinn ausgebliebener Umkehr
  alternative: »nicht umgekehrt sind« oder »keine Buße getan haben«
  rationale: Die Formulierung soll sowohl innere Sinnesänderung als auch Abkehr von den Taten umfassen. Das traditionell kirchliche »Buße tun« wird vermieden, da es im heutigen Deutsch missverständlich als Strafleistung verstanden werden kann.
- issue: Unterscheidung der drei Lasterbegriffe
  choice: »Unreinheit, sexuelle Unmoral und Ausschweifung«
  alternative: »Unreinheit, Unzucht und Zügellosigkeit«
  rationale: Die drei überlappenden, aber nicht identischen Begriffe bleiben als eigenständige Glieder erhalten. Keiner wird durch eine engere konfessionelle Definition festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Satzbau des griechischen Textes bleibt erkennbar, wird aber durch zwei parallele dass-Sätze lesbar gegliedert. Kirchliche Fachsprache wie »Buße tun« und heute altertümliches »Unzucht« werden vermieden. Die Fußnoten bewahren echte lexikalische und präpositionale Mehrdeutigkeit.
