  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: de
  text: 'Doch sei es so: Ich bin euch nicht zur Last gefallen.[a] Aber als Gerissener habe ich euch mit List gefangen.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das sei also zugestanden“ oder „Wie dem auch sei“. Paulus scheint den Punkt um des Arguments willen einzuräumen.'
    reason: lexical_alternative
  - marker: b
    text: Die Aussage „Als Gerissener habe ich euch mit List gefangen“ ist wahrscheinlich keine eigene Schulderklärung, sondern Paulus’ ironische Wiedergabe einer gegen ihn erhobenen Anschuldigung.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „habe ich euch durch Täuschung gefangen“ beziehungsweise „habe ich euch durch Täuschung ausgenutzt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Doch sei es so
  rationale: 'Die Wendung gibt die rhetorische Einräumung knapp und relativ formnah wieder: Paulus lässt einen Punkt um des Arguments willen gelten.'
- source_word: κατεβάρησα
  choice: bin euch nicht zur Last gefallen
  rationale: Das Verb bezeichnet im Zusammenhang eine materielle beziehungsweise finanzielle Belastung; die deutsche Wendung ist natürlich und bewahrt das Bild der Last.
- source_word: ὑπάρχων
  choice: weil ich so ... war
  rationale: Das Partizip wird als begleitender beziehungsweise begründender Umstand wiedergegeben. Im Haupttext bleibt die Formulierung als Teil der offenbar ironisch aufgegriffenen Anschuldigung erkennbar.
- source_word: πανοῦργος
  choice: gerissen
  rationale: Das Wort bezeichnet hier negativ gefärbte, skrupellose Schlauheit. „Gerissen“ ist verständlich und trägt den anklagenden Ton.
- source_word: δόλῳ
  choice: mit List
  rationale: Der instrumentale Dativ nennt das vermeintliche Mittel. „Mit List“ ist knapp und lässt den negativen Sinn erkennen, ohne den Satz unnötig auszudeuten.
- source_word: ἔλαβον
  choice: habe ich euch ... eingefangen
  rationale: λαμβάνω hat hier wahrscheinlich den Sinn, jemanden durch eine Strategie zu fangen oder in die Hand zu bekommen. „Eingefangen“ ist im Deutschen verständlicher als das unnatürliche „genommen“ und bewahrt das Bild.
theological_decisions:
- issue: Ob die Worte nach ἀλλά ein tatsächliches Eingeständnis oder die ironische Wiedergabe einer Anschuldigung sind
  choice: Die Anschuldigung wird im Haupttext direkt formuliert; eine Fußnote weist auf den wahrscheinlich ironischen Charakter hin.
  alternative: 'Den Haupttext ausdrücklich paraphrasieren: „Aber angeblich war ich gerissen und fing euch mit List ein.“'
  rationale: Der weitere Zusammenhang spricht dagegen, dass Paulus eigene Täuschung eingesteht. Eine direkte Wiedergabe erhält jedoch die rhetorische Spannung des griechischen Textes, statt die Ironie im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Einräumung und die scharfe, wahrscheinlich ironische Anschuldigung bleiben erhalten. „Zur Last fallen“ ist idiomatisch; „gerissen“ und „mit List eingefangen“ geben den negativen Ton verständlich wieder.
