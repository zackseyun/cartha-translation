source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: de
  text: Und wegen der außergewöhnlichen Größe der Offenbarungen wurde mir – damit ich mich nicht überhebe – ein Dorn im Fleisch gegeben[a], ein Bote Satans[b], um mich zu schlagen[c], damit ich mich nicht überhebe.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein spitzer Pfahl“ oder „ein Splitter im Fleisch“. Das griechische Wort σκόλοψ kann etwas Spitzes wie einen Dorn, Splitter oder Pfahl bezeichnen; das genaue Bild bleibt unbestimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Engel Satans“. Das griechische ἄγγελος kann „Bote“ oder „Engel“ bedeuten.'
    reason: alternative_reading
  - marker: c
    text: 'Auch: „um mich mit Fäusten zu schlagen“ oder „um mich zu misshandeln“. Das Verb κολαφίζω bezeichnet zunächst das Schlagen mit der Faust und kann fortgesetzte Misshandlung ausdrücken.'
    reason: lexical_alternative
  - marker: d
    text: Die Worte „damit ich mich nicht überhebe“ stehen im vorliegenden griechischen Text zweimal und werden deshalb an beiden Stellen wiedergegeben.
    reason: textual_transparency
lexical_decisions:
- source_word: ὑπερβολῇ
  choice: außergewöhnlichen Ausmaßes
  rationale: Die Formulierung gibt die außerordentliche Größe der Offenbarungen wieder, ohne eine wertende Deutung wie „Vorzüglichkeit“ einzutragen.
- source_word: ἀποκαλύψεων
  choice: Offenbarungen
  rationale: „Offenbarungen“ ist im paulinischen Zusammenhang die natürliche und präzise Wiedergabe für göttliche Enthüllungen oder Mitteilungen.
- source_word: διὸ
  choice: wegen … wurde
  rationale: Der folgernde Zusammenhang von διό wird in die deutsche Satzkonstruktion aufgenommen. So bleibt der Bezug zur außergewöhnlichen Größe der Offenbarungen klar.
- source_word: ὑπεραίρωμαι
  choice: ich mich nicht überhebe
  rationale: „Sich überheben“ bewahrt sowohl das Bild des Sich-Erhöhens als auch den Gedanken des Hochmuts. Die Wiederholung im griechischen Text bleibt erhalten.
- source_word: ἐδόθη μοι
  choice: wurde mir … gegeben
  rationale: Das Passiv lässt wie der griechische Text offen, wer der Gebende ist, und benennt weder Gott noch eine andere Instanz ausdrücklich.
- source_word: σκόλοψ
  choice: Dorn
  rationale: „Dorn“ ist eine verständliche, bildkräftige Wiedergabe. Da das Wort auch einen spitzen Pfahl oder Splitter bezeichnen kann, wird diese Unschärfe in einer Fußnote kenntlich gemacht.
- source_word: τῇ σαρκί
  choice: ins Fleisch
  rationale: Beim Bild eines eindringenden Dorns ist „ins Fleisch“ im Deutschen natürlicher als „im Fleisch“ und bewahrt den konkreten körperlichen Bildbereich, ohne die Art des Leidens festzulegen.
- source_word: ἄγγελος Σατανᾶ
  choice: ein Bote Satans
  rationale: „Bote“ erhält die Bedeutungsbreite von ἄγγελος und entscheidet nicht, ob ein übernatürliches Wesen oder ein anderer satanischer Beauftragter gemeint ist.
- source_word: κολαφίζῃ
  choice: der mich mit Schlägen bedrängen soll
  rationale: Die Wendung wahrt den konkreten Sinn des Schlagens und bringt zugleich die fortgesetzte Bedrängnis zum Ausdruck. Das maskuline „der“ bezieht sich grammatisch auf „Bote“, wie ἄγγελος im Griechischen das Subjekt der Zweckkonstruktion bildet.
theological_decisions:
- issue: Art des „Dorns im Fleisch“
  choice: Das Bild bleibt ohne nähere Bestimmung stehen.
  alternative: Krankheit, Verfolgung, innere Anfechtung oder dämonische Bedrängnis ausdrücklich benennen.
  rationale: Der Vers legt die genaue Gestalt des Leidens nicht fest. Eine Konkretisierung würde die im Text bestehende Offenheit beseitigen.
- issue: Urheber des Gegebenen
  choice: Das Passiv „wurde mir gegeben“ bleibt erhalten.
  alternative: „Gott gab mir“ oder „es wurde zugelassen“.
  rationale: Der Text nennt den Handelnden nicht ausdrücklich. Das Passiv bewahrt die Spannung zwischen nicht genannter übergeordneter Verfügung und dem Boten Satans.
- issue: Identität des ἄγγελος Σατανᾶ
  choice: „ein Bote Satans“
  alternative: „ein Engel Satans“ oder „ein menschlicher Abgesandter Satans“.
  rationale: Die Übersetzung legt die ontologische Identität des Boten nicht fest.
- issue: Doppelte Zweckangabe
  choice: Beide Vorkommen von „damit ich mich nicht überhebe“ werden wiedergegeben.
  alternative: Die zweite Formulierung als stilistische Wiederholung auslassen.
  rationale: Der vorgelegte griechische Text enthält die Aussage zweimal; die Wiederholung trägt zum Nachdruck des Verses bei und soll nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde für gute Verständlichkeit behutsam geordnet, während Passiv, Metapher, doppelte Zweckangabe und die Offenheit hinsichtlich Art und Urheber des Leidens erhalten bleiben.
