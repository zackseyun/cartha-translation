  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: de
  text: Im Blick auf einen solchen Menschen will ich mich rühmen[a]; im Blick auf mich selbst aber will ich mich nicht rühmen, außer in meinen Schwachheiten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Über einen solchen Menschen.“ Die griechische Präposition kann den Bezugsgegenstand des Rühmens allgemeiner bezeichnen. „Im Blick auf“ gibt dies im Deutschen wieder, ohne die Identität der Person festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „außer in den Schwachheiten“. Gemeint sein können menschliche Begrenztheit, Gebrechlichkeit oder Leiden, in denen Gottes Kraft sichtbar wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: für einen solchen Menschen
  rationale: ὑπέρ mit dem Genitiv bezeichnet hier die Person, auf die sich das Rühmen bezieht. „Für“ bewahrt die relationale Nuance und die rhetorische Distanzierung; „einen solchen Menschen“ gibt den indirekten Ausdruck natürlich wieder, ohne die Identitätsfrage aufzulösen.
- source_word: καυχήσομαι
  choice: will ich mich rühmen
  rationale: „Sich rühmen“ ist im modernen Deutschen die klare und im paulinischen Zusammenhang etablierte Wiedergabe von καυχάομαι; das Futur wird als „will ich“ wiedergegeben.
- source_word: ἐμαυτοῦ
  choice: für mich selbst
  rationale: Das Reflexivpronomen bildet den betonten Gegensatz zu „einem solchen Menschen“.
- source_word: εἰ μὴ
  choice: außer
  rationale: εἰ μή leitet hier eine Ausnahme und keine Bedingung ein.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: meiner Schwachheiten
  rationale: Das deutsche „sich einer Sache rühmen“ verlangt den Genitiv. „Schwachheiten“ kann körperliche Gebrechlichkeit, menschliche Begrenztheit und Leiden umfassen. Der persönliche Bezug ergibt sich aus dem Kontrast, obwohl im Griechischen kein Possessivpronomen steht.
theological_decisions:
- issue: Identität des „solchen Menschen“ und Gegenstand des erlaubten Rühmens
  choice: Die rhetorische Distanz zwischen „einem solchen Menschen“ und „mir selbst“ bleibt bestehen; Paulus lässt für sich nur das Rühmen seiner Schwachheiten zu.
  alternative: Der Ausdruck könnte als wörtlicher Hinweis auf eine andere Person verstanden oder die Aussage ausschließlich als allgemeiner theologischer Grundsatz gelesen werden.
  rationale: Der Kontext legt einen autobiografischen Bezug nahe, doch der Vers formuliert bewusst distanziert. Die Übersetzung entscheidet die Identitätsfrage nicht stillschweigend und erhält zugleich den persönlichen Bezug der Schwachheiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewöhnliche Formulierung „für einen solchen Menschen“ ist bewusst gewählt, um die relationale Bedeutung von ὑπέρ und Paulus’ rhetorische Distanzierung zu erhalten. Der zweite Satzteil folgt natürlichem deutschen Sprachgebrauch mit „sich seiner Schwachheiten rühmen“.
