  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: de
  text: Ich aber werde sehr gern für euch alles einsetzen und mich völlig verausgaben.[a] Wenn ich euch umso mehr liebe, werde ich dann weniger geliebt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für eure Seelen“; auch: „für euer Leben“ oder „für euch selbst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: sehr gern
  rationale: Der Superlativ bezeichnet größte Bereitwilligkeit; „sehr gern“ ist im heutigen Deutsch natürlich und bewahrt die Wärme der Aussage.
- source_word: δαπανήσω
  choice: mich aufwenden
  rationale: Das Verb trägt die Vorstellung des Ausgebens oder Einsetzens. Mit dem reflexiven Ausdruck wird im Deutschen verständlich, dass Paulus seine Mittel und Kräfte einsetzt, während die Verbindung zum folgenden intensivierten Verb erhalten bleibt.
- source_word: ἐκδαπανηθήσομαι
  choice: völlig aufwenden lassen
  rationale: 'Das verstärkte passive Verb steigert die Aussage: Paulus setzt nicht nur etwas ein, sondern lässt sich selbst vollständig verausgaben. „Völlig“ bildet die Intensivierung ab.'
- source_word: ὑπὲρ τῶν ψυχῶν ὑμῶν
  choice: für euch
  rationale: ψυχή bezeichnet hier wahrscheinlich die Personen beziehungsweise ihr Leben, nicht notwendig eine vom Körper getrennte Seele. Natürliches Deutsch gibt den personalen Sinn mit „für euch“ wieder; die wörtlicheren Möglichkeiten stehen in der Fußnote.
- source_word: εἰ
  choice: wenn
  rationale: „Wenn“ bewahrt die Form der rhetorischen Bedingung, ohne sie deutend als feststehende Begründung wiederzugeben.
- source_word: περισσοτέρως
  choice: umso mehr
  rationale: Der Komparativ bezeichnet ein gesteigertes Maß. Im Zusammenhang der rhetorischen Gegenüberstellung mit ἧσσον ist „umso mehr“ idiomatisch und prägnant.
- source_word: ἀγαπῶν
  choice: ich euch … liebe
  rationale: Das Partizip wird für einen natürlichen deutschen Bedingungssatz finit wiedergegeben.
- source_word: ἧσσον ἀγαπῶμαι
  choice: werde ich dann weniger geliebt
  rationale: Die passive Form und der Gegensatz zwischen größerer Liebe und geringerer Gegenliebe bleiben ausdrücklich erhalten; „dann“ verdeutlicht lediglich den rhetorischen Zusammenhang.
theological_decisions:
- issue: Bedeutung von ψυχή im Ausdruck τῶν ψυχῶν ὑμῶν
  choice: für euch
  alternative: für eure Seelen / für euer Leben
  rationale: Im Kontext bezeichnet der Plural die Menschen selbst beziehungsweise ihr Leben. „Für euch“ vermeidet eine nicht zwingend im Text angelegte Trennung von Seele und Körper, während eine Fußnote die echte lexikalische Spannweite offenhält.
- issue: Rhetorischer Status des mit εἰ eingeleiteten Satzes
  choice: Wenn ich euch umso mehr liebe
  alternative: Weil ich euch umso mehr liebe
  rationale: Die konditionale Form wird bewahrt. So bleibt offen, ob Paulus die Voraussetzung rhetorisch als zugestanden behandelt, ohne sie durch eine kausale Übersetzung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wurzel „aufwenden“ bildet das griechische Wortspiel zwischen δαπανήσω und ἐκδαπανηθήσομαι ab; „völlig“ kennzeichnet die Steigerung. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den sich die lexikalische Alternative bezieht.
