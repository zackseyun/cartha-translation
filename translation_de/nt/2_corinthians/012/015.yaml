  timestamp: '2026-07-15T02:32:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Bereitschaft des Paulus sowie die rhetorische Gegenüberstellung von größerer Liebe und geringerer Gegenliebe im Kern zutreffend wieder. „Mich ... aufwenden lassen“ ist jedoch keine sichere Wiedergabe von ἐκδαπανηθήσομαι: Es legt im Deutschen nahe, dass Paulus anderen gestattet, ihn zu verwenden, statt seine völlige Selbsthingabe bzw. Erschöpfung auszudrücken. Die revidierte Formulierung bewahrt die Steigerung vom Einsetzen eigener Mittel zum Sich-verausgaben.'
  naturalness: „Mich aufwenden“ und besonders „mich völlig aufwenden lassen“ wirken im modernen Standarddeutsch unidiomatisch. „Alles einsetzen und mich völlig verausgaben“ ist natürlich, würdig und wahrt die bildhafte Abfolge des griechischen Ausdrucks.
  terminology: „Für euch“ ist als kontextuelle Wiedergabe von ὑπὲρ τῶν ψυχῶν ὑμῶν vertretbar, sofern die Fußnote die wörtliche Formulierung und die wesentlichen lexikalischen Alternativen nennt. Die Fußnote wird an „euch“ verankert und um „euch selbst“ ergänzt.
  issues:
  - severity: medium
    issue: „mich völlig aufwenden lassen“ für ἐκδαπανηθήσομαι
    rationale: Die deutsche Konstruktion bedeutet gewöhnlich, sich von jemandem einsetzen oder benutzen zu lassen. Sie bildet weder die intendierte Selbstverausgabung noch die Steigerung gegenüber δαπανήσω idiomatisch ab.
  - severity: low
    issue: Fußnote nennt nicht ausdrücklich die personale Alternative
    rationale: Neben „Seelen“ und „Leben“ kann ψυχαί hier auch die Personen selbst meinen. „Für euch selbst“ macht diese im Audit Trail ausgewiesene Möglichkeit transparent.
  revised_text: Ich aber werde sehr gern für euch alles einsetzen und mich völlig verausgaben.[a] Wenn ich euch umso mehr liebe, werde ich dann weniger geliebt?
