revisions:
- from: Ich aber will mich sehr gern für euch aufwenden und völlig aufwenden lassen.[a] Wenn ich euch umso mehr liebe, werde ich dann weniger geliebt?
  to: Ich aber werde sehr gern für euch alles einsetzen und mich völlig verausgaben.[a] Wenn ich euch umso mehr liebe, werde ich dann weniger geliebt?
  rationale: Die Revision ersetzt die missverständliche Passivkonstruktion durch eine natürliche deutsche Wendung für die umfassende Selbstverausgabung. „Alles einsetzen“ und „mich völlig verausgaben“ geben die abgestufte, durch ἐκ- verstärkte Wortfolge wieder. Die rhetorische Bedingung mit „Wenn“ und die Vergleichsrelation bleiben erhalten.
