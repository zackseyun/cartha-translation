base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: de
  text: Habe ich euch etwa durch einen von denen, die ich zu euch gesandt habe, ausgenutzt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übervorteilt“ oder „betrogen“. Das griechische Verb bezeichnet das Sich-Verschaffen eines Vorteils auf Kosten eines anderen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: etwa …?
  rationale: μή leitet eine rhetorische Frage ein, auf die eine verneinende Antwort erwartet wird. Die deutsche Formulierung mit „etwa“ gibt diese Erwartung natürlich wieder.
- source_word: τινα ὧν
  choice: einen von denen, die
  rationale: 'Die Formulierung bewahrt den partitiven Sinn: Gemeint ist irgendeine Person aus der Gruppe der von Paulus Gesandten.'
- source_word: ἀπέσταλκα
  choice: ich … gesandt habe
  rationale: Das griechische Perfekt bezeichnet hier die von Paulus zu den Korinthern entsandten Personen; das deutsche Perfekt ist idiomatisch und hält den Bezug zur gegenwärtigen Diskussion offen.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: Dies ist die natürliche deutsche Wiedergabe der Richtung auf die korinthische Gemeinde hin.
- source_word: δι’ αὐτοῦ
  choice: durch einen von denen
  rationale: Das Singularpronomen bezieht sich distributiv auf „einen“ aus der zuvor genannten Gruppe. Die deutsche Satzstellung bindet „durch“ klar an die jeweilige gesandte Person.
- source_word: ἐπλεονέκτησα
  choice: ausgenutzt
  rationale: Das Verb bezeichnet, sich auf Kosten anderer einen Vorteil zu verschaffen. „Ausgenutzt“ ist modern, verständlich und lässt sowohl finanziellen Betrug als auch allgemeinere Übervorteilung zu.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen bezeichnet die korinthischen Gemeindeglieder als Gruppe.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage erwartet eine verneinende Antwort; „etwa“ macht dies im Deutschen kenntlich. „Ausgenutzt“ erhält die Spannweite des griechischen Verbs, ohne die Aussage ausschließlich auf einen rechtlich verstandenen Betrug festzulegen.
