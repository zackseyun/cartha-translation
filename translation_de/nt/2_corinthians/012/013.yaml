  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: de
  text: Denn in welcher Hinsicht seid ihr gegenüber den übrigen Gemeinden schlechtergestellt worden[a] – außer darin, dass ich selbst euch nicht zur Last gefallen bin[b]? Vergebt mir dieses Unrecht![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als geringer behandelt worden“. Das griechische Verb kann bedeuten, benachteiligt oder in eine schlechtere Stellung versetzt zu werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: Paulus belastete sie nicht finanziell, indem er keine Unterstützung von ihnen annahm.'
    reason: cultural_note
  - marker: c
    text: 'Paulus spricht ironisch: Das angebliche „Unrecht“ bestand darin, dass er ihnen nicht zur Last fiel.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: seid ihr … schlechtergestellt worden
  rationale: Das Passiv bezeichnet hier, in Verbindung mit dem Vergleich, eine Benachteiligung oder Behandlung als geringer. „Schlechtergestellt worden“ bewahrt sowohl die passive Form als auch den vergleichenden Sinn, ohne eine wesensmäßige Minderwertigkeit anzudeuten.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: gegenüber den übrigen Gemeinden
  rationale: ὑπέρ führt hier nach dem vergleichenden Verb den Vergleich ein. „Gegenüber“ ist im Deutschen idiomatisch; „die übrigen Gemeinden“ gibt λοιπαί präzise wieder.
- source_word: αὐτὸς ἐγώ
  choice: ich selbst
  rationale: Die Verbindung des verstärkenden Pronomens mit dem ausdrücklich gesetzten Personalpronomen hebt Paulus persönlich hervor. „Ich selbst“ erhält diesen Nachdruck.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: euch nicht zur Last gefallen bin
  rationale: καταναρκάω bezeichnet im Kontext eine materielle beziehungsweise finanzielle Belastung. Die deutsche Wendung ist natürlich und lässt die im Zusammenhang erkennbare finanzielle Bedeutung bestehen.
- source_word: χαρίσασθέ μοι
  choice: Vergebt mir
  rationale: χαρίζομαι kann „gnädig gewähren“ oder „vergeben“ bedeuten. Im ironischen Schluss ist „Vergebt mir“ die treffende und idiomatische Wiedergabe.
- source_word: τὴν ἀδικίαν ταύτην
  choice: dieses Unrecht
  rationale: ἀδικία bedeutet „Unrecht“ oder „Ungerechtigkeit“. „Dieses Unrecht“ bezeichnet knapp die soeben genannte, nur vermeintliche Verfehlung und wahrt die rhetorische Schärfe.
- source_word: τί γάρ ἐστιν ὃ
  choice: Denn in welcher Hinsicht
  rationale: Die Wendung leitet eine rhetorische Frage nach dem Punkt oder Bereich der vermeintlichen Benachteiligung ein. „Denn in welcher Hinsicht“ ist klares, gegenwärtiges Deutsch und bewahrt den begründenden Anschluss durch γάρ.
theological_decisions:
- issue: Paulus’ ironische Verteidigung wegen seiner Ablehnung finanzieller Unterstützung
  choice: Die Ironie wird durch die wörtlich zugespitzte Bitte „Vergebt mir dieses Unrecht!“ bewahrt, ohne sie im Haupttext ausdrücklich als Ironie zu kennzeichnen.
  alternative: Die Ironie durch einen Zusatz wie „dieses angebliche Unrecht“ oder eine Übertreibung ausdrücklich erläutern.
  rationale: Der griechische Text erzeugt die Ironie aus dem Zusammenhang und dem Kontrast zwischen Nichtbelastung und „Unrecht“. Eine explizite Kennzeichnung im Haupttext würde die rhetorische Spannung interpretierend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt knapp und verständlich; der Gedankenstrich verdeutlicht die zugespitzte Ausnahme. Die Ironie wird im Haupttext nicht paraphrasiert, sondern nur in der Fußnote erläutert.
