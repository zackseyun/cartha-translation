id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: de
  text: Denn ich fürchte, dass ich euch bei meinem Kommen vielleicht nicht so vorfinde, wie ich es wünsche, und dass ihr auch mich so vorfindet, wie ihr es nicht wünscht – dass es vielleicht Streit, Eifersucht, Wutausbrüche, selbstsüchtiges Streben, Verleumdungen, Getuschel[a], Aufgeblasenheit und Unordnung gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Klatsch.'
    reason: Lexikalische Alternative für ψιθυρισμοί; das Wort kann heimliches Gerede beziehungsweise Getuschel oder Klatsch bezeichnen.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: ich fürchte
  rationale: Gibt die gegenwärtige, anhaltende Sorge des Paulus unmittelbar und würdig wieder.
- source_word: μή πως
  choice: dass … vielleicht
  rationale: Bewahrt an beiden Stellen den Gedanken einer befürchteten Möglichkeit, ohne ihn als Gewissheit darzustellen.
- source_word: ἐλθὼν
  choice: bei meinem Kommen
  rationale: Versteht das Partizip im Kontext temporal und formuliert es in natürlichem Deutsch.
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: euch … nicht so vorfinde, wie ich es wünsche
  rationale: Bezieht die relative Wendung auf den Zustand beziehungsweise das Verhalten der Korinther und erhält die vorsichtige Aussage des Konjunktivs.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: dass ihr auch mich so vorfindet, wie ihr es nicht wünscht
  rationale: Eine aktive deutsche Formulierung gibt das passive griechische Gegenstück natürlich wieder und bewahrt zugleich die wechselseitige Struktur von vorfinden und vorgefunden werden.
- source_word: ἔρις
  choice: Streit
  rationale: Bezeichnet Zwietracht und Auseinandersetzungen innerhalb der Gemeinschaft in allgemein verständlicher Sprache.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Im Lasterkatalog ist die negative Bedeutung gemeint, nicht ein positiver Eifer.
- source_word: θυμοί
  choice: Wutausbrüche
  rationale: Der Plural bezeichnet wiederholte heftige Ausbrüche des Zorns.
- source_word: ἐριθεῖαι
  choice: selbstsüchtiges Streben
  rationale: Erfasst eigennütziges, parteiisches Vorwärtsstreben, ohne den Ausdruck unnötig auf politische Rivalität einzuengen.
- source_word: καταλαλιαί
  choice: Verleumdungen
  rationale: Bezeichnet herabsetzendes oder verleumderisches Reden über andere.
- source_word: ψιθυρισμοί
  choice: Getuschel
  rationale: Gibt heimliches, hinter vorgehaltener Hand erfolgendes abträgliches Reden anschaulich und modern wieder; die mögliche Wiedergabe „Klatsch“ wird in der Fußnote genannt.
- source_word: φυσιώσεις
  choice: Aufgeblasenheit
  rationale: Bewahrt das bildhafte Wort für selbstüberhebliche Haltung und entspricht dem paulinischen Sprachgebrauch.
- source_word: ἀκαταστασίαι
  choice: Unordnung
  rationale: Gibt Störungen und ungeordnete Zustände innerhalb der Gemeinde wieder; der Plural wird im Deutschen idiomatisch als Sammelbegriff formuliert.
theological_decisions:
- issue: Ton der befürchteten Begegnung
  choice: Paulus äußert Sorge über gegenseitige Enttäuschung und gemeinschaftsschädliche Verhaltensweisen.
  alternative: Die Aussage ausdrücklich als Androhung apostolischer Strenge oder als Hinweis auf den Einfluss falscher Lehrer formulieren.
  rationale: Der Vers nennt wechselseitiges Missfallen und einen Lasterkatalog, legt aber dessen weitergehende Ursache beziehungsweise die konkrete Gestalt der Reaktion des Paulus nicht ausdrücklich fest.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die spiegelbildliche Aussage über Paulus und die Korinther bleibt erhalten; der Lasterkatalog ist knapp und rhythmisch formuliert. Der Gedankenstrich markiert den Übergang von der gegenseitigen Befürchtung zur möglichen Aufzählung ihrer konkreten Erscheinungsformen.
