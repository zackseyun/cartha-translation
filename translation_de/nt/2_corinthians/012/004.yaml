  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes treffend wieder: das passive, nicht näher erklärte Entrücktwerden (ἡρπάγη), das Ziel „ins Paradies“, die ἄρρητα ῥήματα als „unaussprechliche Worte“ sowie die fehlende Erlaubnis für einen Menschen, sie auszusprechen. Die Spannung zwischen Unaussprechlichkeit und ausdrücklichem Sprechverbot bleibt gewahrt.'
  naturalness: „Er wurde ins Paradies entrückt und hörte unaussprechliche Worte, die ein Mensch nicht aussprechen darf“ ist idiomatisches, würdiges modernes Standarddeutsch. „Entrückt“ ist leicht gehoben, im biblischen Register jedoch präzise und gut verständlich.
