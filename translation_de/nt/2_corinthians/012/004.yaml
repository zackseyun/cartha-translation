id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: de
  text: Er wurde ins Paradies entrückt und hörte unaussprechliche Worte, die ein Mensch nicht aussprechen darf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: wurde entrückt
  rationale: Das Passiv bezeichnet ein plötzliches, von außen bewirktes Hinwegnehmen; „entrückt“ gibt dies im biblischen Zusammenhang knapp und würdig wieder.
- source_word: παράδεισον
  choice: Paradies
  rationale: Die geläufige deutsche Entsprechung bewahrt den theologischen Begriff, ohne seinen Bezug hier näher festzulegen.
- source_word: ἄρρητα ῥήματα
  choice: unaussprechliche Worte
  rationale: Die Formulierung erhält die mögliche Spannung zwischen dem sprachlich nicht Ausdrückbaren und dem nicht zur Äußerung Bestimmten; der folgende Relativsatz konkretisiert das Verbot.
- source_word: οὐκ ἐξὸν
  choice: nicht ... darf
  rationale: Die unpersönliche Wendung bezeichnet, dass etwas nicht gestattet beziehungsweise nicht zulässig ist.
- source_word: ἀνθρώπῳ
  choice: ein Mensch
  rationale: ἄνθρωπος ist hier generisch; „ein Mensch“ ist im modernen Deutsch eindeutig inklusiv und entspricht dem unbestimmten Singular.
- source_word: λαλῆσαι
  choice: aussprechen
  rationale: Im Zusammenhang mit gehörten „Worten“ bezeichnet das Verb deren mündliche Äußerung; „aussprechen“ bewahrt zudem die Wortverbindung.
theological_decisions:
- issue: Bezug und Bedeutung der unaussprechlichen Worte
  choice: Die Aussage bleibt ohne Erklärung, ob die Worte an sich unausdrückbar oder ihre Wiedergabe verboten ist.
  alternative: „Worte, die kein Mensch weitersagen darf“
  rationale: ἄρρητα kann „unaussprechlich“ bedeuten, während οὐκ ἐξὸν ausdrücklich fehlende Erlaubnis bezeichnet. Die Übersetzung bewahrt beide Aspekte und löst ihre Spannung nicht auf.
- issue: Identität des Handelnden beim Entrücken
  choice: Das göttliche Passiv bleibt als Passiv stehen.
  alternative: „Gott entrückte ihn“
  rationale: Der griechische Text nennt den Handelnden nicht ausdrücklich; eine Explizierung würde über die Formulierung hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur folgt dem griechischen Text. „Entrückt“ ist leicht gehobene biblische Sprache, hier aber semantisch präzise und allgemein verständlich.
