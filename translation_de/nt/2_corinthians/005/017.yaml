source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: de
  text: 'Daher gilt: Wenn jemand im Messias ist, dann ist da eine neue Schöpfung[a]. Das Alte ist vergangen; sieh, Neues ist entstanden[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dann ist er eine neue Schöpfung«. Wörtlich steht im Griechischen ohne Verb: »wenn jemand im Messias – neue Schöpfung«.'
    reason: alternative_reading
  - marker: b
    text: 'Einige Handschriften lesen sinngemäß: »Alles ist neu geworden.« Der hier zugrunde gelegte griechische Text lautet lediglich: »Neues ist entstanden«; ein ausdrückliches Wort für »alles« fehlt.'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Daher gilt
  rationale: Kennzeichnet eine Folgerung aus dem vorausgehenden Gedankengang und stellt den Zusammenhang im Deutschen klar und natürlich her.
- source_word: εἴ τις
  choice: wenn jemand
  rationale: Gibt die unbestimmte, allgemein geltende Bedingung ohne eine im Griechischen nicht beabsichtigte männliche Einschränkung wieder.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Bewahrt Χριστός als Titel und zugleich die für Paulus charakteristische Wendung des Seins im Messias.
- source_word: καινὴ κτίσις
  choice: dann ist da eine neue Schöpfung
  rationale: Die griechische Wendung enthält kein Verb. Diese behutsame Ergänzung lässt den Bezug auf die einzelne Person und den umfassenderen Anbruch neuer Schöpfung offen.
- source_word: τὰ ἀρχαῖα
  choice: das Alte
  rationale: Das substantivierte sächliche Pluraladjektiv wird im Deutschen idiomatisch als kollektives »das Alte« wiedergegeben, ohne seinen Umfang näher festzulegen.
- source_word: παρῆλθεν
  choice: ist vergangen
  rationale: Gibt den Aorist als eingetretenes Geschehen mit fortbestehender Bedeutung natürlich wieder.
- source_word: ἰδοὺ
  choice: sieh
  rationale: Erhält den aufmerksamkeitslenkenden und rhetorischen Nachdruck der griechischen Partikel in knapper Form.
- source_word: γέγονεν καινά
  choice: Neues ist entstanden
  rationale: Gibt das sächliche καινά substantivisch wieder und bringt bei γέγονεν sowohl das Eintreten als auch den daraus hervorgegangenen gegenwärtigen Zustand zum Ausdruck, ohne ein nicht ausdrücklich vorhandenes »alles« einzufügen.
theological_decisions:
- issue: Χριστῷ als Titel oder namensähnliche Bezeichnung
  choice: im Messias
  alternative: in Christus
  rationale: Die Wiedergabe als »Messias« macht den Titelcharakter von Χριστός sichtbar und bewahrt dessen heilsgeschichtliche Bedeutung in der paulinischen Formel.
- issue: Ergänzung der elliptischen Aussage καινὴ κτίσις
  choice: dann ist da eine neue Schöpfung
  alternative: dann ist er eine neue Schöpfung
  rationale: Da im Griechischen Subjekt und Verb fehlen, soll die Übersetzung die Aussage nicht ausschließlich auf die individuelle Person verengen. Die personenbezogene Deutung bleibt in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. »Sieh« bewahrt den rhetorischen Hinweischarakter von ἰδοὺ, ohne auf das altertümlichere »siehe« zurückzugreifen. Die griechische Ellipse und ihre theologische Weite werden im Haupttext und in der Fußnote sichtbar gehalten.
