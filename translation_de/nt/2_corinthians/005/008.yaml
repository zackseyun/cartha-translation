  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: de
  text: Aber wir sind zuversichtlich und möchten lieber vom Körper fern und beim Herrn zu Hause sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Körper abwesend und beim Herrn anwesend sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαρροῦμεν
  choice: wir sind zuversichtlich
  rationale: Das Präsens bezeichnet anhaltenden Mut beziehungsweise feste Zuversicht; die Formulierung ist modern und würdevoll.
- source_word: δὲ
  choice: Doch
  rationale: δέ führt den Gedankengang aus Vers 6 weiter und markiert zugleich eine leichte Spannung zur gegenwärtigen Lage; „Doch“ bewahrt diese flexible Anschlussfunktion.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet θαρροῦμεν und εὐδοκοῦμεν schlicht miteinander.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: möchten lieber
  rationale: In Verbindung mit μᾶλλον drückt εὐδοκοῦμεν eine bereitwillige Präferenz aus. „Möchten lieber“ klingt im Deutschen natürlich, ohne bloßes Wohlgefallen oder eine zwingende Entscheidung zu behaupten.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: fern vom Körper sein
  rationale: ἐκδημέω bezeichnet das Fernsein von der Heimat beziehungsweise dem Aufenthaltsort. Die Wiedergabe erhält das räumliche Bild und lässt „Körper“ wörtlich stehen, ohne ausdrücklich „sterben“ einzusetzen.
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: beim Herrn zu Hause sein
  rationale: ἐνδημέω bildet den bildhaften Gegenpol zu ἐκδημέω. „Beim Herrn zu Hause sein“ bewahrt sowohl das Heimatmotiv als auch die durch πρός bezeichnete persönliche Nähe.
theological_decisions:
- issue: Ob die Aussage ausdrücklich als Lehre über Tod, Himmel oder den Zwischenzustand formuliert werden soll
  choice: Das Bild vom Fernsein vom Körper und vom Zuhause beim Herrn bleibt ohne erklärende Zusätze erhalten.
  alternative: „sterben und danach im Himmel beim Herrn sein“
  rationale: Der Vers legt die Gegenüberstellung nahe, nennt jedoch weder den Tod noch den Himmel ausdrücklich. Die Übersetzung soll die theologische Aussagekraft bewahren, ohne die Bildsprache durch eine weitergehende Deutung zu ersetzen.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Bibelstil. „Körper“ gibt σῶμα unmittelbar wieder; „Leib“ wäre traditioneller, wirkt heute jedoch gehobener. Die Formulierung vermeidet konfessionelle Zusätze und bewahrt die räumliche Heimatmetaphorik.
