  naturalness: „Aber wir sind zuversichtlich und möchten lieber vom Körper fern und beim Herrn zu Hause sein“ ist modernes, flüssiges Standarddeutsch mit würdigem Bibelregister. Die parallele Stellung von „fern“ und „zu Hause“ lässt den griechischen Wortgegensatz gut erkennen.
  terminology: „Herr“ ist für κύριος die etablierte und quellentreue Wiedergabe. „Körper“ ist im heutigen Standarddeutsch klar und unmittelbarer als das stärker traditionell gefärbte „Leib“.
