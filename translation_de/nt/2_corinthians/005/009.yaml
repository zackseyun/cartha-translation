  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: de
  text: Darum setzen wir auch alles daran, ihm zu gefallen, ob wir zu Hause oder in der Fremde[a] sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aus dem Zusammenhang ausführlicher: „ob wir im Leib zu Hause oder fern vom Leib sind“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Erörterung über das Leben im Leib und das Sein beim Herrn; „Darum“ ist natürlich und prägnant.
- source_word: καὶ
  choice: auch
  rationale: Wahrt den anschließenden und leicht hervorhebenden Charakter der Partikel, ohne sie zu überdehnen.
- source_word: φιλοτιμούμεθα
  choice: setzen wir alles daran
  rationale: Gibt das ernsthafte Streben und den entschiedenen Ehrgeiz des Verbs in natürlichem, modernem Deutsch wieder.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: ob wir zu Hause oder in der Fremde sind
  rationale: Bewahrt das Bildpaar von Beheimatetsein und Fremdsein sowie die im Griechischen unausgesprochenen Ergänzungen; der Kontext erläutert den leiblichen Bezug.
- source_word: εὐάρεστοι
  choice: zu gefallen
  rationale: Gibt den relationalen Sinn von „wohlgefällig sein“ klar und idiomatisch wieder.
- source_word: αὐτῷ
  choice: ihm
  rationale: Entspricht dem griechischen Pronomen; der Bezug auf den Herrn ergibt sich aus dem Kontext.
- source_word: εἶναι
  choice: zu sein / zu gefallen
  rationale: Der Infinitiv vervollständigt das Ziel des Strebens; im Deutschen wird εὐάρεστοι εἶναι idiomatisch mit „zu gefallen“ wiedergegeben.
theological_decisions:
- issue: Ob die im Kontext erschließbare Ergänzung zu „zu Hause“ und „in der Fremde“ ausdrücklich in den Haupttext aufgenommen werden soll
  choice: Die knappe Formulierung „ob wir zu Hause oder in der Fremde sind“ bleibt im Haupttext erhalten.
  alternative: „ob wir im Leib zu Hause oder fern vom Leib sind“
  rationale: Die Verse 6–8 machen den Bezug zum Leib deutlich, doch Vers 9 selbst lässt die Ergänzungen unausgesprochen. Die knappe Wiedergabe bewahrt Form und Spannung des griechischen Textes; die Fußnote erklärt den Kontext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Alles daransetzen“ vermittelt die Entschiedenheit von φιλοτιμούμεθα verständlicher als das ungebräuchliche „ehrgeizig danach streben“. „In der Fremde“ erhält das räumliche Bild des griechischen Gegenbegriffs zu „zu Hause“.
