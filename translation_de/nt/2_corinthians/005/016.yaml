id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: de
  text: Daher beurteilen wir von jetzt an niemanden nach dem Fleisch[a]. Selbst wenn wir den Messias[b] nach dem Fleisch gekannt haben, kennen wir ihn doch jetzt nicht mehr auf diese Weise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus rein menschlicher Sicht“ oder „nach weltlichen Maßstäben“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch Christon; traditionell „Christus“. „Messias“ gibt hier die Bedeutung des Titels wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Daher
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang und wahrt den logischen Anschluss.
- source_word: ἀπὸ τοῦ νῦν
  choice: von jetzt an
  rationale: Natürliche deutsche Wiedergabe des zeitlichen Wendepunkts; zusammen mit „niemanden mehr“ wird der Übergang von der früheren zur gegenwärtigen Sichtweise deutlich.
- source_word: οὐδένα
  choice: niemanden
  rationale: Entspricht dem umfassenden, verneinten Akkusativobjekt.
- source_word: οἴδαμεν
  choice: beurteilen wir
  rationale: Im Zusammenhang mit κατὰ σάρκα bezeichnet das Verb nicht bloß persönliches Kennen, sondern die Art, wie Menschen wahrgenommen und eingeschätzt werden. „Beurteilen“ ist im Deutschen verständlich, ohne den Maßstab bereits auszudeuten.
- source_word: κατὰ σάρκα
  choice: nach dem Fleisch
  rationale: Bewahrt Paulus’ theologisch geprägten Ausdruck und seine Spannung. Eine Fußnote nennt verständliche sinngemäße Alternativen, ohne „Fleisch“ vorschnell mit sündiger Natur gleichzusetzen.
- source_word: εἰ καὶ
  choice: Selbst wenn
  rationale: Bewahrt die formal mögliche konditionale Nuance der konzessiven Wendung; „selbst wenn“ lässt offen, wie ausdrücklich Paulus ein früheres Kennen des Messias behauptet.
- source_word: ἐγνώκαμεν
  choice: gekannt haben
  rationale: Gibt das Perfekt als vergangenes Kennen mit Bezug auf die gegenwärtige Aussage wieder.
- source_word: Χριστόν
  choice: den Messias
  rationale: Gibt den Bedeutungsgehalt des Titels Χριστός wieder; der bestimmte Artikel ist im Deutschen bei der konkreten Bezeichnung Jesu idiomatisch erforderlich.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: kennen wir ihn doch jetzt nicht mehr auf diese Weise
  rationale: „Doch jetzt nicht mehr“ bewahrt den starken Gegensatz; das ergänzte „ihn“ nimmt den Messias auf, und „auf diese Weise“ macht deutlich, dass die Art des Kennens verneint wird.
theological_decisions:
- issue: Bedeutung von κατὰ σάρκα in Bezug auf Menschen und den Messias
  choice: nach dem Fleisch
  alternative: aus rein menschlicher Sicht; nach weltlichen Maßstäben
  rationale: Die Formulierung hält Paulus’ Begrifflichkeit und die Spannung zwischen früherer und neuer Wahrnehmung fest. Sie bestreitet nicht die wirkliche Menschheit Jesu, sondern bezeichnet eine unzureichende, bloß menschlich-irdische Weise der Einschätzung.
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Hier bezeichnet Χριστός Jesus mit seinem Titel. „Messias“ macht dessen semantischen Gehalt unmittelbar sichtbar, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Konzessive Aussage εἰ καὶ
  choice: Selbst wenn
  alternative: Obwohl; selbst wenn tatsächlich
  rationale: Die griechische Form kann konzessiv verstanden werden, lässt aber hinsichtlich der behaupteten Tatsächlichkeit eine gewisse Spannung bestehen. „Selbst wenn“ bewahrt diese Offenheit besser als das eindeutig faktische „obwohl“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nach dem Fleisch“ bleibt als prägnanter paulinischer Ausdruck im Haupttext erhalten und wird in der Fußnote erläutert. „Beurteilen“ sorgt im ersten Satz für natürliches Deutsch; im zweiten Satz wahrt „kennen“ den unmittelbaren Bezug auf das frühere Kennen des Messias.
