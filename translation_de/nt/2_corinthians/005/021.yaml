  rationale: Die Revision beschränkt sich auf eine sichere grammatische Korrektur im deutschen Finalsatz und auf die Straffung der Fußnote, damit die umstrittene Bedeutung von δικαιοσύνη θεοῦ nicht auslegend festgelegt wird. Die prägnante und theologisch offene Wiederholung von „Sünde“ bleibt unverändert.
