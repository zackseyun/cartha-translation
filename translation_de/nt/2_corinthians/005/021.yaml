source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: de
  text: Den, der Sünde nicht kannte, hat er für uns zur Sünde gemacht,[a] damit wir in ihm Gottes Gerechtigkeit werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Sündopfer gemacht“. Im Griechischen steht an beiden Stellen „Sünde“; manche verstehen das zweite Vorkommen im Sinn eines Opfers für die Sünde.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Gerechtigkeit von Gott“ oder „Recht Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν μὴ γνόντα ἁμαρτίαν
  choice: den, der Sünde nicht kannte
  rationale: Die Formulierung bewahrt die prägnante griechische Wendung und bezeichnet die persönliche Unberührtheit des Christus von Sünde, ohne sie erklärend zu „keine Sünde beging“ auszuweiten.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Die knappe Wiedergabe erhält den stellvertretenden und wohltätigen Bedeutungsspielraum von ὑπέρ, ohne ihn auf ein bestimmtes Sühneverständnis zu verengen.
- source_word: ἁμαρτίαν (zweites Vorkommen)
  choice: zur Sünde
  rationale: Die Wiederholung desselben Substantivs wie im Griechischen bewahrt Paulus’ schroffe, theologisch spannungsreiche Aussage. Die mögliche kultische Deutung wird in einer Fußnote genannt.
- source_word: ἐποίησεν
  choice: hat er … gemacht
  rationale: „Machen“ gibt ποιέω unmittelbar wieder und lässt die genaue Art des göttlichen Handelns offen.
- source_word: γενώμεθα
  choice: würden
  rationale: Im deutschen Finalsatz gibt „damit … würden“ den Aorist Konjunktiv natürlich wieder und bewahrt gegenüber einem statischen „seien“ den Gedanken des Werdens.
- source_word: δικαιοσύνη θεοῦ
  choice: Gottes Gerechtigkeit
  rationale: Die Genitivverbindung bleibt ebenso kompakt und mehrdeutig wie im Ausgangstext; Herkunft, Zugehörigkeit oder Bezug werden nicht einseitig festgelegt.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die charakteristische paulinische Wendung bleibt erhalten, ohne sie interpretierend zu „in Gemeinschaft mit ihm“ zu erweitern.
theological_decisions:
- issue: Bedeutung von „zur Sünde gemacht“
  choice: Die auffällige Aussage bleibt im Haupttext stehen, ohne zu unterstellen, Christus sei moralisch sündig geworden.
  alternative: „zum Sündopfer gemacht“
  rationale: Der erste Satzteil bekräftigt ausdrücklich seine Sündlosigkeit. Eine kultische Deutung ist möglich, doch der griechische Wortlaut wiederholt schlicht „Sünde“ und soll nicht im Haupttext vereindeutigt werden.
- issue: Bedeutung von δικαιοσύνη θεοῦ
  choice: „Gottes Gerechtigkeit“ bewahrt die offene Genitivkonstruktion.
  alternative: „Gerechtigkeit von Gott“ oder „Gottes Recht schaffende Gerechtigkeit“
  rationale: Die Formulierung kann Gottes eigene Gerechtigkeit, von Gott verliehene Gerechtigkeit oder eine von ihm bestimmte rechte Stellung bezeichnen. Der Haupttext entscheidet diese Debatte nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholung von „Sünde“ und die knappe paulinische Wendung „in ihm“ bleiben erhalten; Fußnoten erläutern echte lexikalische und theologische Mehrdeutigkeiten.
