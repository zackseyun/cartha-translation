    rationale: Diese Formulierung ist keine bloße lexikalische Alternative zu δικαιοσύνη und interpretiert die umstrittene Genitivverbindung stärker als der griechische Text. Eine knappe Angabe „Recht“ wahrt die Alternative ohne zusätzliche Auslegung.
