id: 2CO.5.15
reference: 2 Corinthians 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: de
  text: Und er ist für alle gestorben, damit diejenigen, die leben, nicht länger für sich selbst leben, sondern für den, der für sie gestorben und auferweckt worden ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: für alle
  rationale: ὑπέρ mit Genitiv bezeichnet hier Nutzen oder Stellvertretung. „Für alle“ ist natürliches Deutsch, bewahrt die Weite von πάντων und legt keine bestimmte Sühnetheorie fest.
- source_word: ἀπέθανεν
  choice: ist gestorben
  rationale: Das deutsche Perfekt gibt das vergangene Ereignis in heutigem Standarddeutsch natürlich wieder; das Subjekt „er“ ergibt sich aus dem Zusammenhang.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Ergebnisbeziehung knapp und idiomatisch wieder.
- source_word: οἱ ζῶντες
  choice: die Lebenden
  rationale: Der substantivierte Partizipialausdruck wird formal nah und zugleich verständlich wiedergegeben. Der Kontext bestimmt, wer mit den Lebenden gemeint ist.
- source_word: μηκέτι
  choice: nicht länger
  rationale: Die Formulierung bezeichnet das Ende einer bisherigen Lebensausrichtung.
- source_word: ἑαυτοῖς ζῶσιν
  choice: für sich selbst leben
  rationale: Der Dativ beschreibt die Ausrichtung des Lebens; „für sich selbst leben“ ist im Deutschen idiomatisch und erhält den Gegensatz.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: sondern für den, der ... gestorben und auferweckt worden ist
  rationale: Der Dativ setzt die ausgelassene Wendung „leben für“ fort. Der Relativsatz klingt im Deutschen natürlicher als eine substantivierte Partizipialkonstruktion.
- source_word: ἐγερθέντι
  choice: auferweckt worden ist
  rationale: Die passive Form bleibt ausdrücklich erhalten und lässt Gottes Handeln anklingen, ohne den Handelnden im Vers zu ergänzen.
- source_word: ὑπὲρ αὐτῶν
  choice: für sie
  rationale: Die Wiederholung von ὑπέρ wird durch dieselbe deutsche Präposition sichtbar gehalten.
theological_decisions:
- issue: Umfang und Bezug von πάντων / αὐτῶν
  choice: „alle“ und „sie“ ohne Einschränkung des Bezugs
  alternative: ausdrückliche Eingrenzung auf alle Menschen oder auf alle Glaubenden beziehungsweise von Christus Vertretenen
  rationale: Der Vers verwendet eine umfassende Formulierung, entscheidet aber die späteren theologischen Streitfragen über den Umfang des Sühnetodes nicht ausdrücklich.
- issue: Passiv bei ἐγερθέντι
  choice: „auferweckt worden ist“
  alternative: „auferstanden ist“
  rationale: Das Passiv entspricht der griechischen Form und wahrt die mögliche Betonung göttlichen Handelns, ohne ein Subjekt hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Gegensatz eng verbunden, ohne hölzern zu wirken. Das Perfekt entspricht dem üblichen deutschen Erzähl- und Aussagestil; das Auferweckungspassiv wird bewusst bewahrt.
