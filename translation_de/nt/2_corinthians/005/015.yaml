revisions:
- from: Und er ist für alle gestorben[a], damit die Lebenden nicht länger für sich selbst leben, sondern für den, der für sie gestorben und auferweckt worden ist.
  to: Und er ist für alle gestorben, damit diejenigen, die leben, nicht länger für sich selbst leben, sondern für den, der für sie gestorben und auferweckt worden ist.
  rationale: Die Revision beseitigt die mögliche deutsche Fehlassoziation von „die Lebenden“, ohne den offen bleibenden Bezug von οἱ ζῶντες theologisch einzuengen. Die Fußnote wird entfernt, weil „für“ den Grundtext idiomatisch und ausreichend genau wiedergibt; eine alternative Formulierung mit „an Stelle“ würde die semantische Bandbreite unnötig verengen.
