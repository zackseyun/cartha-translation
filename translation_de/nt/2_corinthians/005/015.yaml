review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzstruktur, den Zweckzusammenhang (ἵνα), den Gegensatz von Selbstbezug und Ausrichtung auf Christus sowie das Passiv von ἐγερθέντι zutreffend wieder. Das Präsenspartizip οἱ ζῶντες wird mit „die Lebenden“ jedoch missverständlich, da es im Deutschen primär die gegenwärtig Lebenden im Gegensatz zu Verstorbenen bezeichnen kann. „Diejenigen, die leben“ ist näher an der offenen, kontextabhängigen griechischen Formulierung.
  naturalness: Der Satz ist insgesamt flüssig und würdig. „Diejenigen, die leben“ ist im modernen Standarddeutsch in diesem Kontext klarer und natürlicher als „die Lebenden“.
  terminology: „Für alle“, „für sich selbst leben“, „auferweckt worden ist“ und die Wiederholung von „für sie“ sind angemessen. Die Fußnote sollte „an Stelle aller“ nicht als gleichrangige einfache Alternative zu ὑπέρ anbieten, weil dies die Stellvertretungsnuance stärker festlegt, als der Ausdruck selbst verlangt. Die passive Auferweckungsform ist korrekt und benötigt keine Fußnote.
  issues:
  - severity: medium
    issue: „die Lebenden“ für οἱ ζῶντες
    rationale: Die deutsche Substantivierung bezeichnet leicht eine Gruppe im biologischen Gegensatz zu den Toten. Das griechische substantivierte Präsenspartizip bleibt weiter und wird besser mit „diejenigen, die leben“ wiedergegeben.
  - severity: medium
    issue: Fußnotenalternative „an Stelle aller“
    rationale: „An Stelle“ kann als deutlich engerer substitutionärer Ausdruck gelesen werden. ὑπέρ mit Genitiv kann zwar Stellvertretung einschließen, bedeutet hier aber zunächst „für/zugunsten von, um ... willen“. Die Anmerkung sollte diese Nuance erläutern, ohne eine stärker festgelegte Übersetzung als bloße Alternative auszugeben.
  revised_text: Und er ist für alle gestorben, damit diejenigen, die leben, nicht länger für sich selbst leben, sondern für den, der für sie gestorben und auferweckt worden ist.
  revised_footnotes: []
