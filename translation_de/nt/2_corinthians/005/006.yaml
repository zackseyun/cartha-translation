  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: de
  text: 'Darum sind wir stets zuversichtlich und wissen: Solange wir im Leib zu Hause sind, sind wir fern vom Herrn[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Herrn abwesend“. Das griechische Verb ist der Gegenbegriff zu „zu Hause sein“ und kann auch mit „fort sein“ oder „abwesend sein“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: sind wir … zuversichtlich
  rationale: Das Präsenspartizip bezeichnet eine fortdauernde Haltung des Mutes und der Zuversicht. Eine finite Verbform ist im Deutschen natürlich und wahrt den Anschluss an den folgenden Satz.
- source_word: οὖν
  choice: Darum
  rationale: Die Konjunktion zieht eine Folgerung aus dem vorausgehenden Gedankengang. „Darum“ gibt diesen logischen Zusammenhang klar und idiomatisch wieder.
- source_word: πάντοτε
  choice: stets
  rationale: Das Adverb bezeichnet eine anhaltende, jederzeit bestehende Zuversicht; „stets“ ist knapp, gegenwärtig und würdevoll.
- source_word: εἰδότες
  choice: und wissen
  rationale: Das Perfektpartizip von οἶδα hat präsentische Bedeutung und drückt ein gefestigtes Wissen aus. Die finite Wiedergabe entspricht natürlichem Deutsch.
- source_word: ἐνδημοῦντες
  choice: solange wir … zu Hause sind
  rationale: Das Verb bezeichnet das Zuhause- beziehungsweise Im-eigenen-Land-Sein. „Zu Hause sein“ bewahrt das räumliche Bild und bildet den Gegenpol zu ἐκδημοῦμεν.
- source_word: ἐν τῷ σώματι
  choice: im Leib
  rationale: Die lokale Wendung bezeichnet die gegenwärtige leibliche Existenz. „Leib“ ist hier präzise und in modernem biblischem Deutsch gut verständlich.
- source_word: ἐκδημοῦμεν
  choice: sind wir fern
  rationale: Das Verb ist der Gegenbegriff zu ἐνδημέω und bezeichnet das Fortsein oder Abwesendsein von einem Ort. „Fern sein“ ist natürlich und erhält den räumlichen Gegensatz; die Fußnote nennt eine stärker bildentsprechende Alternative.
- source_word: ἀπὸ τοῦ κυρίου
  choice: vom Herrn
  rationale: ἀπό bezeichnet Trennung beziehungsweise Entfernung. κύριος wird entsprechend dem christologischen Kontext mit „Herr“ wiedergegeben.
theological_decisions:
- issue: Spannung zwischen gegenwärtiger leiblicher Existenz und dem Sein beim Herrn
  choice: Die gegenwärtige Existenz „im Leib“ wird als Zuhause-Sein im Leib und zugleich als Fernsein vom Herrn beschrieben.
  alternative: Die Formulierung aus Vers 8 („außerhalb des Leibes“ und „beim Herrn“) bereits hier einzutragen oder eine völlige Trennung von Christus zu behaupten.
  rationale: Die Übersetzung hält sich an den Gegensatz dieses Verses. Sie wahrt die Spannung zwischen der gegenwärtigen leiblichen Existenz und dem noch ausstehenden unmittelbaren Sein beim Herrn, ohne eine völlige Trennung von Christi gegenwärtiger Nähe zu lehren oder Aussagen des nächsten Verses vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt verdeutlicht, dass der folgende Satz den Inhalt des Wissens entfaltet. Das Bildpaar „zu Hause“/„fern“ bleibt verständlich, während die Fußnote den engeren sprachlichen Gegenklang der beiden griechischen Verben sichtbar macht.
