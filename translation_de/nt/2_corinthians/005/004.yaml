source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: de
  text: Denn auch wir seufzen, solange wir in diesem Zelt sind, unter der Last, weil wir nicht entkleidet, sondern überkleidet werden wollen[a], damit das Sterbliche[b] vom Leben verschlungen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem weiteren Gewand bekleidet werden“. Das griechische Verb legt nahe, dass über das bereits Getragene noch etwas angezogen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Sterblichkeit“. Das griechische substantivierte Neutrum kann sowohl das Sterbliche als auch die Sterblichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt den begründenden Anschluss an den vorherigen Gedanken; die zusätzliche Bekräftigung von γάρ ergibt sich im Deutschen hinreichend aus dem Satzgefüge.
- source_word: οἱ ὄντες ἐν τῷ σκήνει
  choice: solange wir in diesem Zelt sind
  rationale: „Zelt“ erhält das Bild für die gegenwärtige leibliche Existenz und den Zusammenhang des Abschnitts. „Solange“ gibt die zeitlich begrenzte Situation in natürlichem Deutsch wieder, ohne das Bild auszudeuten.
- source_word: στενάζομεν
  choice: seufzen wir
  rationale: „Seufzen“ bezeichnet hier hörbar ausgedrückte Bedrängnis und Sehnsucht; es ist im modernen Deutschen natürlicher als „stöhnen“, ohne den Ernst abzuschwächen.
- source_word: βαρούμενοι
  choice: unter der Last
  rationale: Die Formulierung erhält den passiven Gedanken des Beschwertseins und verbindet ihn idiomatisch mit dem Seufzen.
- source_word: ἐφ’ ᾧ
  choice: weil
  rationale: Die Wendung führt hier am ehesten den Grund beziehungsweise die nähere Erklärung des Seufzens ein. „Weil“ ist klar, lässt aber die genaue gedankliche Beziehung im Kontext bestehen.
- source_word: ἐκδύσασθαι
  choice: entkleidet werden
  rationale: Die passive deutsche Form passt zur Zustandsveränderung und bewahrt das Kleidungsbild, ohne es als körperlose Existenz auszulegen.
- source_word: ἐπενδύσασθαι
  choice: überkleidet werden
  rationale: Das zusammengesetzte Verb bezeichnet das Anziehen eines weiteren Kleidungsstücks über das bereits Getragene. „Überkleidet“ bewahrt diesen ungewöhnlichen, für Paulus wichtigen Bildzug.
- source_word: καταποθῇ
  choice: verschlungen wird
  rationale: „Verschlungen“ erhält das kräftige Bild der vollständigen Überwindung.
- source_word: τὸ θνητόν
  choice: das Sterbliche
  rationale: Das substantivierte Neutrum bleibt bewusst weit und kann das sterbliche Dasein beziehungsweise die Sterblichkeit bezeichnen, ohne den Bezug vorschnell einzuengen.
- source_word: ὑπὸ τῆς ζωῆς
  choice: vom Leben
  rationale: Die Formulierung gibt den Urheber der Überwindung wieder und erhält den unmittelbaren Gegensatz zwischen dem Sterblichen und dem Leben.
theological_decisions:
- issue: Kleidungsbild und Zwischenzustand
  choice: „entkleidet“ und „überkleidet“ bleiben als Bilder stehen.
  alternative: „Entkleidet“ ausdrücklich als körperlose Existenz und „überkleidet“ ausschließlich als Auferstehungsleib deuten.
  rationale: Der griechische Text beschreibt eine eschatologische Sehnsucht in Bildern, legt an dieser Stelle aber kein vollständiges Lehrschema über den Zwischenzustand fest. Die Übersetzung wahrt diese Spannung.
- issue: Bezugsweite von τὸ θνητόν
  choice: „das Sterbliche“
  alternative: „die Sterblichkeit“ oder ausdrücklich „der sterbliche Körper“
  rationale: Das substantivierte Adjektiv kann die sterbliche Existenz umfassend bezeichnen. Die gewählte Fassung vermeidet sowohl eine rein abstrakte als auch eine ausschließlich körperbezogene Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Zelt- und Kleidungsbild bleibt bewusst erhalten. „Überkleidet“ ist weniger alltäglich, aber sachlich präzise und wird durch die Fußnote erläutert.
