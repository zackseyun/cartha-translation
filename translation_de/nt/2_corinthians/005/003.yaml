translation:
  language: de
  text: Wenn wir denn auch bekleidet sind, werden wir nicht nackt vorgefunden werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… werden wir nicht unbekleidet vorgefunden werden.“'
