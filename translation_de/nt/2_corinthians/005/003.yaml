    rationale: ἐνδυσάμενοι steht hier ohne genanntes Objekt. Das Pronomen kann auf verschiedene Bilder des Kontextes festgelegt werden und ist insbesondere hinsichtlich des Genus nicht eindeutig. Eine objektlose Formulierung bewahrt die Offenheit des Textes.
  - severity: medium
    issue: καί bleibt im deutschen Haupttext unberücksichtigt.
