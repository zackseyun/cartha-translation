  naturalness: „Wenn wir denn auch bekleidet sind“ ist modernes, natürliches Standarddeutsch. „Nackt vorgefunden werden“ bewahrt die bildhafte und leicht formelhafte Sprache des Ausgangstextes angemessen.
  terminology: '„Bekleidet“ und „nackt“ erhalten die Metapher ohne dogmatische Festlegung. Die bisherige Fußnote ist sachlich nicht tragfähig: Sie behauptet eine textkritische Variante und gibt dabei „ausgezogen“ wieder, obwohl dies weder durch den vorgelegten SBLGNT-Text noch durch den englischen Audit Trail gedeckt ist.'
