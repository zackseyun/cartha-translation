lexical_decisions:
- source_word: εἴ γε
  choice: wenn … denn
  rationale: Bewahrt sowohl den bedingenden Charakter von εἴ als auch die bekräftigende Nuance von γε in natürlichem Deutsch.
- source_word: καὶ
  choice: nicht eigens wiedergegeben
  rationale: καί verstärkt beziehungsweise verbindet hier die Partizipialkonstruktion; eine gesonderte Wiedergabe mit „auch“ oder „sogar“ wäre im Deutschen missverständlich und unnötig schwerfällig.
- source_word: ἐνδυσάμενοι
  choice: angezogen haben
  rationale: Das Aorist-Medium bezeichnet wörtlich das Anziehen beziehungsweise Sich-Bekleiden. Die aktive deutsche Wendung bewahrt die Kleidungsmetapher und lässt den aus dem Kontext erschließbaren Gegenstand als Pronomen stehen.
- source_word: οὐ
  choice: nicht
  rationale: Entspricht der einfachen Verneinung des futurischen Prädikats.
- source_word: γυμνοὶ
  choice: nackt
  rationale: Gibt die Grundbedeutung direkt wieder und erhält die Spannung der Kleidungsmetapher, ohne sie theologisch auszudeuten.
- source_word: εὑρεθησόμεθα
  choice: werden … vorgefunden werden
  rationale: Bewahrt das Futur Passiv und klingt im Zusammenhang mit dem prädikativen „nackt“ natürlich und würdig.
theological_decisions:
- issue: Bedeutung der Metapher von Bekleidung und Nacktheit
  choice: Die Metapher bleibt unaufgelöst.
  alternative: „Nackt“ ausdrücklich als leiblosen Zwischenzustand, fehlenden Auferstehungsleib oder eschatologische Schande deuten.
  rationale: Der griechische Vers legt den genauen theologischen Bezug nicht ausdrücklich fest. Die Übersetzung bewahrt daher die Mehrdeutigkeit und Spannung.
- issue: Nicht ausdrücklich genanntes Objekt von ἐνδυσάμενοι
  choice: Mit „ihn“ auf das unmittelbar zuvor genannte himmlische Wohnhaus beziehungsweise die Behausung zurückverweisen.
  alternative: Passivisch „bekleidet worden sind“ übersetzen und das Objekt unausgesprochen lassen.
  rationale: Das Medium ist natürlicher als „angezogen haben“ wiederzugeben; das Pronomen stellt den Kontextbezug her, ohne die Metapher durch eine dogmatische Benennung zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Bedingung, Bekleidungsmetapher und zukünftiges Vorgefundenwerden klar zusammen. Der altertümliche Klang von „sofern anders“ wird vermieden.
