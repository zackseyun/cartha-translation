review_pass:
  verdict: revise
  source_fidelity: Der Entwurf trifft die Grundstruktur und die wichtigsten Begriffe gut. „Unseretwegen“ ist für ὑπὲρ ἡμῶν jedoch im heutigen Deutsch leicht kausal („wegen uns“) und gibt den Bezug des Rühmens auf Paulus und seine Mitarbeiter weniger klar wieder. „Über uns“ gibt den hier gemeinten Bezug angemessener wieder, ohne die mögliche apologetische Nuance auszudeuten. Die Gegenüberstellung von πρόσωπον und καρδία sollte zudem syntaktisch als Gegensatz der Grundlage beziehungsweise Sphäre des Rühmens erkennbar bleiben.
  naturalness: „Wir empfehlen uns euch nicht wieder selbst“ und „etwas entgegenzusetzen haben“ sind natürliches, würdiges Standarddeutsch. Die Formulierung „sich des äußeren Ansehens rühmen und nicht dessen, was im Herzen ist“ verschiebt die griechische Konstruktion unnötig zu zwei Gegenständen des Rühmens und klingt im zweiten Glied etwas schwer. „sich nach dem äußeren Anschein rühmen und nicht nach dem, was im Herzen ist“ ist idiomatischer und wahrt die offene Kontrastfigur.
  terminology: „empfehlen“, „Anlass“, „sich rühmen“ und „Herz“ sind treffend. Die Wiederholung von „rühmen“ bewahrt die rhetorische Verbindung von καύχημα und καυχάομαι. „Äußerer Anschein“ ist für ἐν προσώπῳ eine natürliche, nicht überpräzise Wiedergabe.
  issues:
  - severity: medium
    issue: „unseretwegen“ für ὑπὲρ ἡμῶν
    rationale: Im modernen Deutsch wird „unseretwegen“ vor allem kausal verstanden. Der griechische Ausdruck bezeichnet hier den Bezug des Rühmens auf Paulus und seine Mitarbeiter; „über uns“ ist klarer und bleibt im gegebenen Kontext angemessen offen.
  - severity: low
    issue: Syntax der Wendung „des äußeren Ansehens ... nicht dessen, was im Herzen ist“
    rationale: Die griechischen Präpositionalphrasen stehen parallel bei „sich rühmen“. Die überarbeitete Formulierung macht diesen Kontrast natürlicher sichtbar, ohne festzulegen, ob mit πρόσωπον bloßes Erscheinungsbild oder öffentliches Ansehen gemeint ist.
