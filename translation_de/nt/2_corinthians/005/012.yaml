source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: de
  text: Wir empfehlen uns euch nicht wieder selbst, sondern geben euch Anlass, euch über uns zu rühmen, damit ihr denen etwas entgegenzusetzen habt, die sich nach dem äußeren Anschein rühmen und nicht nach dem, was im Herzen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die sich im Angesicht rühmen und nicht im Herzen“. Gemeint sein kann das Rühmen aufgrund äußerer Erscheinung oder öffentlichen Ansehens im Gegensatz zu dem, was im Inneren ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: empfehlen
  rationale: Im paulinischen Zusammenhang bezeichnet das Verb hier das Empfehlen oder Beglaubigen einer Person; die reflexive Formulierung bewahrt zugleich den Gedanken der Selbstdarstellung.
- source_word: ἀφορμὴν
  choice: Anlass
  rationale: „Anlass“ gibt den Ausgangspunkt beziehungsweise die Gelegenheit zum Rühmen knapp und natürlich wieder.
- source_word: καυχήματος / καυχωμένους
  choice: sich rühmen
  rationale: Die einheitliche Wiedergabe erhält die auffällige Wortverbindung zwischen dem Rühmen der Korinther und dem Rühmen der Gegner.
- source_word: ὑπὲρ ἡμῶν
  choice: unseretwegen
  rationale: Die Wendung kann sowohl den Gegenstand als auch den zugunsten einer Person erfolgenden Bezug bezeichnen; „unseretwegen“ lässt diese Nuancen eher offen als eine ausdrücklich apologetische Umschreibung.
- source_word: ἵνα ἔχητε πρὸς
  choice: damit ihr ... etwas entgegenzusetzen habt
  rationale: Die knappe griechische Wendung impliziert, dass die Adressaten gegenüber den genannten Personen eine Erwiderung oder Grundlage zur Antwort haben sollen.
- source_word: ἐν προσώπῳ
  choice: des äußeren Ansehens
  rationale: Im Gegensatz zum Herzen bezeichnet πρόσωπον hier die sichtbare Außenseite beziehungsweise äußere Geltung; „äußeres Ansehen“ bewahrt sowohl Erscheinung als auch Reputation.
- source_word: καρδίᾳ
  choice: was im Herzen ist
  rationale: Die substantivierte deutsche Wendung macht den parallelen Gegenstand des Rühmens verständlich, ohne „Herz“ durch eine rein psychologische Deutung zu ersetzen.
theological_decisions:
- issue: Gegensatz ἐν προσώπῳ ... μὴ ἐν καρδίᾳ
  choice: äußeres Ansehen gegenüber dem, was im Herzen ist
  alternative: äußere Erscheinung gegenüber innerer Wirklichkeit
  rationale: Die Formulierung wahrt den Gegensatz zwischen dem Sichtbaren beziehungsweise sozial Geltenden und dem Inneren, ohne genauer festzulegen, ob Paulus vor allem Erscheinungsbild, öffentlichen Ruf, Aufrichtigkeit oder geistliche Wirklichkeit meint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Verwendung von „sich rühmen“ erhält die rhetorische Wiederholung des Griechischen; „etwas entgegenzusetzen haben“ macht die elliptische Zweckangabe verständlich, ohne den konkreten Inhalt der Antwort auszuformulieren.
