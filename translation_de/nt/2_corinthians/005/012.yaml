  to: Wir empfehlen uns euch nicht wieder selbst, sondern geben euch Anlass, euch über uns zu rühmen, damit ihr denen etwas entgegenzusetzen habt, die sich nach dem äußeren Anschein rühmen und nicht nach dem, was im Herzen ist.[a]
  rationale: Die Revision klärt den Bezug von ὑπὲρ ἡμῶν mit „über uns“ und glättet die deutsche Wiedergabe der parallelen Wendungen ἐν προσώπῳ und μὴ ἐν καρδίᾳ. Die Fußnote erhält die wörtliche Bildsprache und nennt die beiden naheliegenden Deutungsspielräume, ohne sie zu entscheiden.
