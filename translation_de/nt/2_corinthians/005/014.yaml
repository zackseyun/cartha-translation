id: 2CO.5.14
reference: 2 Corinthians 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: de
  text: 'Denn die Liebe des Messias drängt uns[a], weil wir zu dieser Überzeugung gelangt sind: Einer ist für alle gestorben; folglich sind alle gestorben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung kann die Liebe meinen, die vom Messias ausgeht, oder die Liebe zum Messias.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die natürliche heutige Entsprechung und bewahrt den zentralen neutestamentlichen Begriff ohne altertümliche Färbung.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet hier den Titel „Messias“. Der deutsche Genitiv wird im Haupttext beibehalten; seine mögliche subjektive oder objektive Beziehung wird in der Fußnote erläutert.
- source_word: συνέχει
  choice: drängt
  rationale: Das Verb bezeichnet hier eine starke, bestimmende Kraft. „Drängt“ ist prägnant, würdevoll und lässt offen, auf welche konkrete Handlung diese Kraft hinwirkt.
- source_word: κρίναντας τοῦτο
  choice: weil wir zu dieser Überzeugung gelangt sind
  rationale: Das Partizip nennt den gedanklichen Grund für die Aussage. Die Formulierung gibt sowohl die kausale Beziehung als auch das Ergebnis einer abwägenden Beurteilung natürlich wieder.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen natürlich den Inhalt der gewonnenen Überzeugung ein und entspricht funktional dem griechischen ὅτι nach κρίναντας τοῦτο.
- source_word: εἷς
  choice: Einer
  rationale: Die knappe, substantivische Form bewahrt die rhetorische Prägnanz des Griechischen, ohne den im Zusammenhang erkennbaren Bezug ausdrücklich zu ergänzen.
- source_word: ὑπὲρ πάντων
  choice: für alle
  rationale: „Für alle“ gibt die Bedeutung zugunsten beziehungsweise im Namen aller wieder, ohne ὑπέρ auf ein bestimmtes Modell der Stellvertretung einzuengen.
- source_word: ἄρα
  choice: folglich
  rationale: „Folglich“ kennzeichnet klar den logischen Schluss aus dem vorhergehenden Satzteil.
- source_word: οἱ πάντες ἀπέθανον
  choice: alle sind gestorben
  rationale: Die knappe Aussage wird ohne erklärende theologische Ergänzung wiedergegeben; das deutsche Perfekt klingt in diesem argumentativen Zusammenhang natürlich und bezeichnet ein Ereignis mit fortdauernder Bedeutung.
theological_decisions:
- issue: Genitiv in ἡ ἀγάπη τοῦ Χριστοῦ
  choice: Im Haupttext steht „die Liebe des Messias“; die naheliegende Lesart ist die Liebe, die vom Messias ausgeht.
  alternative: unsere Liebe zum Messias
  rationale: Der griechische Genitiv kann subjektiv oder objektiv verstanden werden. Da eine deutsche Formulierung beide Beziehungen nicht ebenso natürlich offenhält, bleibt die formnahe Wendung im Haupttext stehen und die andere mögliche Lesart wird in einer Fußnote genannt.
- issue: Bedeutung von „alle sind gestorben“
  choice: Die Aussage wird ohne Auslegung wörtlich und knapp wiedergegeben.
  alternative: Alle seien in repräsentativer Weise im Tod des Messias gestorben; oder „alle“ bezeichne hier insbesondere die mit ihm Verbundenen.
  rationale: Der Satz legt eine Beziehung zwischen dem Tod des Einen für alle und dem Tod aller nahe, erklärt deren genaue Art und Reichweite in diesem Vers jedoch nicht. Die Übersetzung entscheidet diese weitergehenden Fragen daher nicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, argumentativ prägnantem Ton. Die Satzstruktur bewahrt den engen logischen Zusammenhang des griechischen Textes; „Messias“ gibt Χριστός als Titel wieder.
