  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: de
  text: Der aber uns gerade dafür vorbereitet hat, ist Gott, der uns die Anzahlung des Geistes[a] gegeben hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Unterpfand, Bürgschaft oder erste Rate.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung kann bedeuten, dass der Geist selbst die Anzahlung ist, oder dass Gott eine Anzahlung gegeben hat, die verbürgt, was der Geist vollenden wird.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: vorbereitet hat
  rationale: Das Verb bezeichnet hier Gottes zielgerichtetes Wirken an den Glaubenden im Blick auf den zuvor genannten künftigen Zustand. „Vorbereitet“ ist natürlich und bewahrt diese Zielrichtung.
- source_word: εἰς αὐτὸ τοῦτο
  choice: gerade dafür
  rationale: Die Wendung verweist mit Nachdruck auf das unmittelbar zuvor Beschriebene; „gerade dafür“ gibt sowohl den Rückbezug als auch die Betonung idiomatisch wieder.
- source_word: θεός
  choice: Gott
  rationale: Gott wird ausdrücklich als derjenige bezeichnet, der die Glaubenden vorbereitet hat.
- source_word: δοὺς
  choice: der … gegeben hat
  rationale: Das Aoristpartizip wird im Deutschen natürlich als Relativsatz wiedergegeben und auf Gott bezogen.
- source_word: ἀρραβῶνα
  choice: Anzahlung
  rationale: Das Wort bezeichnet eine erste Teilzahlung, die den noch ausstehenden Rest verbürgt. „Anzahlung“ erhält sowohl das konkrete Bild als auch dessen Zusagecharakter.
- source_word: τοῦ πνεύματος
  choice: den Geist als Anzahlung
  rationale: 'Diese Wiedergabe versteht den Genitiv gemäß dem naheliegenden paulinischen Gebrauch appositionell: Der Geist selbst ist die gegebene Anzahlung. Eine Fußnote hält die grammatisch mögliche weniger bestimmte Deutung offen.'
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier eine leichte Weiterführung mit kontrastierendem Bezug zum Seufzen und Nicht-entkleidet-Werden der vorherigen Verse. „Aber“ macht den Zusammenhang im Deutschen knapp sichtbar, ohne einen zeitlichen Marker einzuführen.
theological_decisions:
- issue: Bedeutung der Anzahlung in Verbindung mit dem Geist
  choice: Der Geist selbst wird als gegenwärtige Anzahlung auf die künftige Vollendung verstanden.
  alternative: Gott hat eine Anzahlung gegeben, die verbürgt, was der Geist vollenden wird.
  rationale: Der paulinische Parallelgebrauch legt nahe, dass der Geist selbst die Gabe und Bürgschaft ist. Da die griechische Genitivverbindung eine gewisse Offenheit besitzt, wird die alternative Deutung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, der emphatische Rückbezug von εἰς αὐτὸ τοῦτο bleibt mit „gerade dafür“ erhalten. Der Haupttext gibt die wahrscheinlichste Deutung von τοῦ πνεύματος idiomatisch wieder; die echte Auslegungsbreite wird in Fußnote [b] bewahrt.
