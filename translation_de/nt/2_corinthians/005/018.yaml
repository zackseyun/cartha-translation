id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: de
  text: Das alles aber kommt von Gott[a], der uns durch den Messias[b] mit sich versöhnt und uns den Dienst der Versöhnung gegeben hat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alles aber“. Die Wendung kann umfassend gemeint sein oder sich besonders auf die unmittelbar zuvor genannten Wirklichkeiten beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „durch Christus“; hier als Titel „durch den Messias“ wiedergegeben.'
    reason: alternative_reading
  - marker: c
    text: „Uns“ kann die Glaubenden allgemein einschließen; im Zusammenhang hebt Paulus jedoch besonders den ihm und seinen Mitarbeitern übertragenen apostolischen Dienst hervor.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Das alles aber
  rationale: Der substantivierte Neutrum-Plural kann auf die unmittelbar zuvor genannten Wirklichkeiten zurückweisen; „das alles“ wahrt diesen Rückbezug. Das nachgestellte „aber“ gibt den milden Übergang durch δέ natürlich wieder, ohne einen zeitlichen Sinn einzuführen.
- source_word: ἐκ τοῦ θεοῦ
  choice: kommt von Gott
  rationale: ἐκ bezeichnet Ursprung oder Quelle. „Kommt von Gott“ ist klares, gegenwärtiges Deutsch und erhält diese Betonung.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: der uns mit sich versöhnt
  rationale: Das attributive Aoristpartizip wird als deutscher Relativsatz wiedergegeben. „Mit sich versöhnen“ ist die natürliche deutsche Entsprechung für die Wiederherstellung der Beziehung zu Gott.
- source_word: διὰ Χριστοῦ
  choice: durch den Messias
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise Mittel. Χριστός ist in dieser Aussage als Titel zu verstehen und wird daher mit „der Messias“ wiedergegeben.
- source_word: καὶ δόντος ἡμῖν
  choice: und uns … gegeben hat
  rationale: Das zweite koordinierte Aoristpartizip teilt das Subjekt Gott. Im Deutschen verbindet die finite Perfektform beide Handlungen flüssig und eindeutig.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: den Dienst der Versöhnung
  rationale: διακονία bezeichnet einen übertragenen beziehungsweise beauftragten Dienst. Der Genitiv benennt dessen Inhalt oder Kennzeichen; die knappe Formulierung bewahrt diese Offenheit.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: durch den Messias
  alternative: durch Christus
  rationale: Hier bezeichnet Χριστός die vermittelnde heilsgeschichtliche Rolle Jesu und trägt daher erkennbar Titelfunktion. „Messias“ macht diese Funktion im Deutschen sichtbar.
- issue: Bezugsweite von ἡμᾶς und ἡμῖν
  choice: uns
  alternative: uns Gläubigen allgemein / uns Aposteln und Mitarbeitern im Besonderen
  rationale: Der griechische Wortlaut legt die Bezugsgruppe nicht ausdrücklich fest. Der Zusammenhang umfasst die Versöhnung der Glaubenden, rückt beim übertragenen Dienst aber Paulus und seine Mitarbeiter besonders in den Blick. Die Übersetzung lässt diese Spannung bestehen.
- issue: Art des Genitivs τῆς καταλλαγῆς
  choice: Dienst der Versöhnung
  alternative: Dienst, der Versöhnung bewirkt / Botschaft der Versöhnung
  rationale: Der Genitiv kann den Inhalt oder das bestimmende Merkmal des Dienstes bezeichnen. Die formnahe Wendung vermeidet es, den Dienst vorschnell nur als Verkündigung oder als bewirkende Tätigkeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber mit einem natürlichen Relativsatz und deutschem Perfekt lesbar gestaltet. „Dienst“ ist kirchlich verständlich, ohne unnötig fachsprachlich zu wirken.
