  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: de
  text: Denn wir alle müssen vor dem Richterstuhl des Messias offenbar werden[a], damit jeder das empfängt, was ihm für sein Handeln durch den Leib zuteilwird[b] – sei es gut oder schlecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Richterstuhl des Messias erscheinen“. Das griechische Verb kann sowohl einfaches Erscheinen als auch öffentliches Offenbar- oder Aufgedecktwerden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch den Leib“. Gemeint sein kann Handeln mittels des Leibes beziehungsweise während des leiblichen Lebens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: offenbar werden
  rationale: Das passive Verb bezeichnet hier nicht nur ein Erscheinen, sondern kann das Offenbarwerden beziehungsweise Aufgedecktwerden vor dem Richterstuhl ausdrücken. Die Formulierung bewahrt diese stärkere forensische Bedeutung.
- source_word: βήματος
  choice: Richterstuhl
  rationale: βῆμα bezeichnet in diesem Zusammenhang den erhöhten Sitz beziehungsweise die Gerichtsplattform, von der aus ein Urteil ergeht. „Richterstuhl“ ist im Deutschen prägnant und wahrt den gerichtlichen Charakter.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist ursprünglich ein Titel und entspricht „Messias“. Der Genitiv bezeichnet hier den Richterstuhl, der dem Messias zugeordnet ist.
- source_word: κομίσηται
  choice: das empfängt
  rationale: Das Medium kann den Empfang dessen bezeichnen, was jemand entsprechend seinem Handeln erhält. Der folgende Ausdruck „was dem entspricht“ macht den vergeltenden Zusammenhang deutlich, ohne Art oder Ausgang des Gerichts näher festzulegen.
- source_word: τὰ διὰ τοῦ σώματος
  choice: was er im Leib getan hat
  rationale: Die knappe griechische Wendung verbindet das Empfangene mit dem Handeln durch den Leib. Im Deutschen bezeichnet „im Leib getan“ natürlich das Handeln während des leiblichen Lebens; die instrumentale Nuance wird in einer Fußnote erhalten.
- source_word: πρὸς ἃ ἔπραξεν
  choice: was dem entspricht, was er … getan hat
  rationale: πρός drückt hier Entsprechung oder Maßgabe aus. Die Wiedergabe erhält sowohl die persönliche Verantwortlichkeit des Handelnden als auch den Zusammenhang zwischen Handeln und Empfang.
- source_word: ἕκαστος
  choice: jeder
  rationale: Der distributive Singular betont die individuelle Verantwortlichkeit jedes Einzelnen.
- source_word: ἀγαθὸν
  choice: gut
  rationale: Die direkte, umfassende moralische Bezeichnung bildet den Gegensatz zu φαῦλον.
- source_word: φαῦλον
  choice: schlecht
  rationale: φαῦλος kann schlecht, geringwertig oder verwerflich bedeuten. „Schlecht“ wahrt den breiten Gegensatz zu „gut“, ohne die Bedeutung zwingend zu „böse“ zu verschärfen.
theological_decisions:
- issue: Art und Umfang des Gerichts vor dem Messias
  choice: Der gerichtliche Ernst, die gemeinsame Offenbarwerdung und die individuelle Entsprechung von Handeln und Empfang werden ausgesagt, ohne den Personenkreis oder die genaue Folge systematisch festzulegen.
  alternative: Das βῆμα ausschließlich als Belohnungsgericht für Gläubige oder ausschließlich als abschließendes Weltgericht ausdrücklich bestimmen.
  rationale: Der Vers selbst spricht von „wir alle“, Offenbarwerden und individuellem Empfang entsprechend dem Handeln, entscheidet aber nicht ausdrücklich zwischen späteren systematischen Modellen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Richterstuhl“ erhält die gerichtliche Bildsprache; „offenbar werden“ bewahrt die stärkere Bedeutung von φανερωθῆναι. Der Gedankenstrich vor dem abschließenden Gegensatz erleichtert den Satzfluss, ohne die Struktur inhaltlich zu verändern.
