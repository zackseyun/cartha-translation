review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung des Anschlusses »Denn«, der Lebensmetapher und des Gegensatzes von πίστις und εἶδος ist grundsätzlich zutreffend. »im Vertrauen auf den Glauben« gibt διὰ πίστεως jedoch nicht wieder: Die Formulierung fügt ein reflektierendes »Vertrauen auf« hinzu und macht den Glauben zum Gegenstand dieses Vertrauens. Das ist gegenüber dem knappen griechischen Ausdruck eine sachlich unnötige und im Deutschen unidiomatische Erweiterung.'
  naturalness: »Wir leben im Glauben, nicht im Schauen« ist modernes, verständliches und zugleich würdiges Standarddeutsch. Es wahrt die knappe parallele Antithese besser als die vorliegende Fassung.
  terminology: πίστις sollte hier schlicht als »Glauben« stehen. »Schauen« ist als knapper Gegenbegriff möglich; eine Fußnote sollte die lexikalisch mögliche Bedeutung von εἶδος als sichtbare Gestalt/Erscheinung absichern, ohne »äußere Erscheinung« zur alleinigen Deutung zu machen.
  issues:
  - severity: high
    issue: »im Vertrauen auf den Glauben«
    rationale: Die Wendung ist semantisch verschoben und stilistisch schwerfällig. Sie fügt gegenüber διὰ πίστεως eine zusätzliche Relation hinzu (Vertrauen, das sich auf Glauben richtet), statt den Glauben selbst als den maßgeblichen Bereich bzw. die Weise des Lebens zu benennen.
  - severity: low
    issue: Fußnote zur instrumentalen Form
    rationale: Die Fußnote bezeichnet »durch Glauben« als wörtlicher, obwohl die revidierte idiomatische Hauptfassung »im Glauben« den deutschen Gegenpol zu »im Schauen« bildet. Die Fußnote sollte vorrangig die Mehrdeutigkeit von εἶδος erläutern.
  revised_text: Denn wir leben im Glauben, nicht im Schauen –
