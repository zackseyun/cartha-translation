revisions:
- from: Denn wir leben im Vertrauen auf den Glauben[a], nicht im Schauen –
  to: Denn wir leben im Glauben, nicht im Schauen –
  rationale: Die Revision beseitigt die zusätzliche und missverständliche Beziehung in »im Vertrauen auf den Glauben«. »Im Glauben … im Schauen« ist eine idiomatische deutsche Wiedergabe der parallelen διά-Ausdrücke und erhält die prägnante paulinische Gegenüberstellung. Die Fußnote bewahrt die Bedeutungsspanne von εἶδος, ohne eine umstrittene Nuance festzulegen.
