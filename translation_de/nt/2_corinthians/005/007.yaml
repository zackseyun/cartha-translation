  text: Denn wir leben im Glauben, nicht im Schauen –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ πίστεως
  choice: im Vertrauen auf den Glauben
  rationale: διά mit Genitiv bezeichnet hier die Grundlage bzw. Art und Weise. Die Formulierung gibt πίστις als „Glauben“ wieder und macht zugleich in natürlichem Deutsch deutlich, dass das Leben darauf gründet.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage; „Denn“ bewahrt diesen erklärenden Anschluss knapp und idiomatisch.
- source_word: περιπατοῦμεν
  choice: wir leben
  rationale: περιπατέω bedeutet wörtlich „gehen“, wird hier aber metaphorisch für die Lebensführung gebraucht. „Wir leben“ vermittelt diesen Sinn im modernen Standarddeutsch natürlicher als „wir wandeln“.
- source_word: οὐ διὰ εἴδους
  choice: nicht im Schauen
  rationale: εἶδος kann sichtbare Gestalt, Erscheinung oder das Sehen bezeichnen. „Im Schauen“ bewahrt den knappen Gegensatz zum Glauben und vermeidet die mögliche Verengung von „Erscheinung“ auf bloßen äußeren Schein.
theological_decisions:
- issue: Wiedergabe von πίστις im paulinischen Zusammenhang
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Der Gegensatz zu εἶδος legt hier den Glauben als vertrauende Ausrichtung auf das noch nicht Sichtbare nahe. „Treue“ passt in diesem Zusammenhang weniger gut; der Vertrauensaspekt wird durch die deutsche Gesamtformulierung ausgedrückt, ohne πίστις ausschließlich darauf festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das altertümliche „wandeln“ wird vermieden; der Gedankenstrich am Versende bleibt erhalten, weil der Satz in den folgenden Vers übergeht.
