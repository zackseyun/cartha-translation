- from: Weil wir also die Furcht des Herrn kennen,[a] versuchen wir, Menschen zu überzeugen. Vor Gott aber sind wir offenbar, und ich hoffe, dass wir auch eurem Gewissen offenbar sind.[b]
  to: Da wir nun die Furcht des Herrn kennen,[a] überzeugen wir Menschen. Vor Gott aber sind wir offenbar geworden, und ich hoffe, dass wir auch in euren Gewissen offenbar geworden sind.[b]
  rationale: Die Revision korrigiert die untextliche Abschwächung von πείθομεν, erhält bei „in euren Gewissen“ die Pluralform des griechischen Textes und formuliert die Aussage über das Offenbarsein vor Gott idiomatischer. Die Perfektbedeutung bleibt durch „offenbar geworden“ in beiden parallelen Aussagen sichtbar. Die Fußnoten sind an den jeweils erläuterten Ausdrücken verankert und bewahren die angemessene semantische Offenheit von „Furcht des Herrn“.
