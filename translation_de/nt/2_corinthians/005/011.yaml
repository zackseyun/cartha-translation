source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: de
  text: Da wir nun die Furcht des Herrn kennen,[a] überzeugen wir Menschen. Vor Gott aber sind wir offenbar geworden, und ich hoffe, dass wir auch in euren Gewissen offenbar geworden sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Furcht des Herrn“ kann auch ehrfürchtige Scheu vor dem Herrn bezeichnen, besonders im Zusammenhang mit dem Richterstuhl im vorausgehenden Vers.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Gott aber sind wir offenbar geworden; ich hoffe aber, auch in euren Gewissen offenbar geworden zu sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: Weil wir also … kennen
  rationale: Das perfekte Partizip hat präsentische Bedeutung. Die kausale Wiedergabe mit „weil“ macht den natürlichen Zusammenhang mit dem Hauptverb im Deutschen deutlich; „also“ bewahrt den Rückbezug auf den vorausgehenden Gerichtskontext.
- source_word: τὸν φόβον τοῦ κυρίου
  choice: die Furcht des Herrn
  rationale: „Furcht“ bewahrt die Spannweite von ehrfürchtiger Scheu und Verantwortungsbewusstsein angesichts des in Vers 10 genannten Richterstuhls; eine bloße Wiedergabe mit „Ehrfurcht“ wäre zu eng.
- source_word: ἀνθρώπους πείθομεν
  choice: versuchen wir, Menschen zu überzeugen
  rationale: πείθω bezeichnet hier das Überzeugen bzw. Gewinnen von Menschen. Im Deutschen könnte „wir überzeugen Menschen“ den tatsächlichen Erfolg behaupten; „versuchen wir“ gibt die auf Menschen gerichtete Überzeugungsarbeit idiomatisch wieder, ohne ihr Ergebnis vorwegzunehmen.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: Vor Gott aber sind wir offenbar
  rationale: Das Perfekt Passiv bezeichnet einen eingetretenen Zustand völliger Offenheit bzw. Erkennbarkeit. „Vor Gott offenbar“ ist im Deutschen natürlicher als „Gott offenbar gemacht“ und vermeidet den missverständlichen Eindruck, Gott habe zuvor keine Kenntnis gehabt.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: eurem Gewissen
  rationale: Der griechische Plural bezieht sich auf das Gewissen der einzelnen Adressaten. Der distributive deutsche Singular mit Possessivpronomen ist idiomatisch und umfasst die ganze Gemeinde.
- source_word: πεφανερῶσθαι
  choice: offenbar sind
  rationale: Die deutsche Zustandsform wahrt die resultative Kraft des Perfekts und setzt die parallele Aussage über Gottes Kenntnis fort.
theological_decisions:
- issue: Bedeutung von „Furcht des Herrn“
  choice: „Furcht“ beibehalten
  alternative: „Ehrfurcht vor dem Herrn“
  rationale: Der unmittelbare Zusammenhang mit dem Gericht vor Christus spricht dafür, sowohl ehrfürchtige Scheu als auch ernstes Verantwortungsbewusstsein hörbar zu lassen.
- issue: Kraft von φανερόω gegenüber Gott und den Gewissen
  choice: „vor Gott … offenbar“ und „eurem Gewissen offenbar“
  alternative: „Gott bekannt gemacht“ bzw. „in euren Gewissen offenbar gemacht“
  rationale: Die gewählte Formulierung bezeichnet den offenliegenden Charakter des apostolischen Handelns, ohne eine Veränderung in Gottes Wissen oder eine zusätzliche dogmatische Aussage einzutragen.
- issue: Erfolg oder Absicht bei πείθομεν
  choice: „versuchen wir, Menschen zu überzeugen“
  alternative: „überzeugen wir Menschen“
  rationale: Die Formulierung beschreibt das auf Überzeugung gerichtete Wirken, ohne zu behaupten, dass jeder angesprochene Mensch tatsächlich überzeugt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für natürliche Lesbarkeit gegliedert; „offenbar“ hält die Parallelität der beiden Formen von φανερόω aufrecht. Die Fußnotenmarker stehen jeweils unmittelbar bei der erklärten Wendung.
