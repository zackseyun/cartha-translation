review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die elliptische Gegenüberstellung des griechischen Textes werden zutreffend wiedergegeben: γάρ durch „Denn“, εἴτε … εἴτε durch die wiederholte Konditionalkonstruktion sowie die auf Gott bzw. die Adressaten bezogenen Dative durch „für Gott“ und „für euch“. Die Übersetzung legt weder tatsächlichen Wahnsinn noch eine bestimmte Form religiöser Ekstase fest.'
  naturalness: „Außer uns sein“ ist im modernen Standarddeutsch in dieser Bedeutung nicht die reguläre idiomatische Wendung; erforderlich ist „außer sich sein“. „Bei klarem Verstand sein“ ist natürlich und bildet den Kontrast verständlich ab. Die ergänzten „dann“ sind möglich, aber nicht nötig; die knappe Konstruktion mit „so“ klingt idiomatisch und wahrt die rhetorische Prägnanz.
  terminology: „Außer sich“ und „bei klarem Verstand“ geben ἐξέστημεν bzw. σωφρονοῦμεν angemessen kontrastiv wieder. Die Alternative „von Sinnen“ ist passend. „Besonnen“ ist eine gute Alternative zu σωφρονοῦμεν; „vernünftig handeln“ ist hingegen interpretierend, da das Verb primär einen Zustand bzw. eine Haltung bezeichnet.
  issues:
  - severity: medium
    issue: Unidiomatische bzw. missverständliche Wiedergabe von ἐξέστημεν
    rationale: Die deutsche feste Wendung lautet „außer sich sein“, nicht „außer uns sein“. Ohne Reflexivpronomen kann „außer uns“ räumlich oder ausschließend verstanden werden und gibt die beabsichtigte Bedeutung nicht zuverlässig wieder.
  - severity: low
    issue: Fußnotenalternative „vernünftig handeln“
    rationale: Diese Formulierung verschiebt σωφρονοῦμεν von der Beschreibung eines besonnenen bzw. klaren Geisteszustands zu einer konkreten Handlungsweise. Sie sollte durch eine nähere lexikalische Alternative ersetzt werden.
