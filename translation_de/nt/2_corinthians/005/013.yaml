  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: de
  text: Denn wenn wir außer sich sind[a], so für Gott; wenn wir bei klarem Verstand sind[b], so für euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Sinnen sind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „besonnen sind“; „nüchternen Sinnes sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: wenn ... wenn
  rationale: Das wiederholte „wenn“ gibt die knappe rhetorische Gegenüberstellung im Deutschen natürlich wieder und bewahrt zugleich ihren Entweder-oder-Charakter.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die erklärende beziehungsweise begründende Verbindung zum vorausgehenden Gedanken.
- source_word: ἐξέστημεν
  choice: außer uns sind
  rationale: Die Wendung gibt den intransitiven Sinn von ἐξίστημι als „außer sich sein“ wieder, ohne festzulegen, ob Paulus tatsächliche Ekstase, den Eindruck von Unvernunft oder einen gegen ihn erhobenen Vorwurf meint.
- source_word: θεῷ
  choice: für Gott
  rationale: Der elliptische Dativ bezeichnet hier am ehesten Bezug oder Ausrichtung; „für Gott“ ist knapp und lässt die genaue Nuance offen.
- source_word: σωφρονοῦμεν
  choice: bei klarem Verstand sind
  rationale: Die Formulierung bildet einen verständlichen, unmittelbaren Gegensatz zu „außer uns“ und erfasst vernünftiges, besonnenes Denken.
- source_word: ὑμῖν
  choice: für euch
  rationale: Wie bei θεῷ gibt die Formulierung den elliptischen Dativ als Bezug beziehungsweise Nutzen wieder und wahrt die Parallelität.
theological_decisions:
- issue: Deutung von Paulus’ gegensätzlicher Selbstbeschreibung
  choice: Die Übersetzung stellt den möglichen Eindruck des Außersichseins der Besonnenheit gegenüber, ohne tatsächlichen Wahnsinn oder eine technische religiöse Ekstase zu behaupten.
  alternative: Man könnte den ersten Ausdruck ausdrücklich als ekstatische Erfahrung oder ausschließlich als gegnerischen Vorwurf deuten.
  rationale: Der griechische Wortlaut ist rhetorisch knapp und lässt Anlass sowie genaue Art des „Außersichseins“ unausgesprochen. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ergänzten Wörter „dann“ machen die stark elliptische Parallelkonstruktion verständlich, ohne zusätzliche inhaltliche Festlegung. Die Fußnotenmarker stehen unmittelbar bei den betreffenden Wendungen.
