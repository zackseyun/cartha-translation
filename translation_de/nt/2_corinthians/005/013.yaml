- from: Denn wenn wir außer uns sind[a], dann für Gott; wenn wir bei klarem Verstand sind[b], dann für euch.
  to: Denn wenn wir außer sich sind[a], so für Gott; wenn wir bei klarem Verstand sind[b], so für euch.
  rationale: Die Korrektur zu „außer sich sind“ ist für idiomatisches und semantisch eindeutiges Deutsch erforderlich. Die übrige Satzstruktur bleibt eng am griechischen, einschließlich seiner knappen Ellipse. Die zweite Fußnote wird auf lexikalisch nähere Alternativen beschränkt.
