source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: de
  text: 'Denn wir wissen: Wenn unser irdisches Zelthaus abgebrochen wird[a], haben wir[c] ein Bauwerk von Gott, ein nicht von Menschenhand gemachtes[b], ewiges Haus in den Himmeln[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zerstört“ beziehungsweise „abgebaut wird“. Das Verb kann das Niederreißen eines Bauwerks oder das Abbauen eines Zeltes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der Ausdruck bezeichnet etwas, das nicht von Menschenhand gemacht ist, und hebt so den göttlichen statt menschlichen Ursprung hervor.
    reason: lexical_alternative
  - marker: c
    text: Im Griechischen heißt es „haben wir“, nicht „werden wir haben“. So bleibt die Spannung zwischen gegenwärtigem Besitz und zukünftiger Verwirklichung bestehen.
    reason: alternative_reading
  - marker: d
    text: Wörtlich steht die Mehrzahl „in den Himmeln“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν γὰρ
  choice: Denn wir wissen
  rationale: „Wir wissen“ gibt die gefestigte Erkenntnis von οἴδαμεν natürlich wieder; „denn“ bewahrt die begründende Verbindung zum vorangehenden Gedankengang.
- source_word: ἐὰν ... καταλυθῇ
  choice: wenn ... abgebrochen wird
  rationale: Die Konstruktion bezeichnet einen künftigen möglichen Fall. „Abgebrochen“ kann sowohl das Niederreißen eines Hauses als auch das Abbauen eines Zeltes anklingen lassen und passt daher zum Mischbild.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: unser irdisches Zelthaus
  rationale: Das zusammengesetzte Wort „Zelthaus“ hält sowohl οἰκία („Haus“) als auch σκῆνος („Zelt“) sichtbar, ohne die Bildsprache vorschnell als „Körper“ auszulegen.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: einen Bau von Gott
  rationale: οἰκοδομή ist hier konkret als Bauwerk zu verstehen; „von Gott“ bildet ἐκ θεοῦ knapp ab und betont den göttlichen Ursprung.
- source_word: ἔχομεν
  choice: haben wir
  rationale: Die Präsensform wird beibehalten. Dadurch bleibt die Spannung zwischen gegenwärtigem Haben und zukünftiger Verwirklichung erhalten.
- source_word: οἰκίαν ἀχειροποίητον
  choice: ein nicht von Händen gemachtes Haus
  rationale: Die relativ wörtliche Formulierung bewahrt den biblischen Anklang des Ausdrucks ἀχειροποίητος und den Gegensatz zwischen göttlichem und menschlichem Ursprung.
- source_word: αἰώνιον
  choice: ewig
  rationale: „Ewig“ stellt die bleibende himmlische Behausung der vergänglichen irdischen gegenüber.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Der Plural des griechischen Textes bleibt erhalten, statt ihn zur geläufigeren Einzahl „im Himmel“ zu vereinheitlichen.
theological_decisions:
- issue: Bezug der Behausungsbilder
  choice: Die Haus-, Zelt- und Baubilder bleiben im Haupttext erhalten.
  alternative: Die Bildsprache unmittelbar mit „Körper“ wiedergeben.
  rationale: Der Text nennt den Körper nicht ausdrücklich, sondern verbindet bewusst Haus, Zelt und Bau. Eine direkte Wiedergabe als „Körper“ würde die Auslegung in den Haupttext verlagern und die Bildspannung glätten.
- issue: Zeitliche Bedeutung von ἔχομεν
  choice: Das Präsens „haben wir“ wird beibehalten.
  alternative: „werden wir haben“
  rationale: Das griechische Verb steht im Präsens. Ob es gegenwärtigen Besitz oder die Gewissheit einer zukünftigen Gabe ausdrückt, wird nicht durch eine Zukunftsform entschieden.
- issue: Charakter des himmlischen Hauses
  choice: „nicht von Händen gemacht“ bezeichnet seinen nichtmenschlichen, göttlichen Ursprung, ohne das Bild näher zu identifizieren.
  alternative: Das Haus ausdrücklich als Auferstehungsleib oder als himmlische Behausung deuten.
  rationale: Der Vers selbst lässt die genaue Zuordnung innerhalb der Bildsprache offen; die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zelthaus“ ist bewusst bildhaft und leicht ungewohnt, da es die auffällige Verbindung von Haus und Zelt im Ausgangstext wahrt. Die Satzstellung nach dem Doppelpunkt ist natürlich, während die zentralen Bilder und das Präsens eng am Griechischen bleiben.
