  terminology: »Messias« wahrt den Titelcharakter von Χριστός. »Verfehlungen« ist eine vertretbare moderne Wiedergabe von παραπτώματα; »Botschaft von der Versöhnung« gibt τὸν λόγον τῆς καταλλαγῆς idiomatisch wieder. Die Fußnote hält »Wort« als formalere Alternative fest.
