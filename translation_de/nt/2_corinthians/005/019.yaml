source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: de
  text: nämlich, dass Gott im Messias war[a] und die Welt mit sich versöhnte, ihnen ihre Verfehlungen nicht anrechnete und uns[b] die Botschaft von der Versöhnung[c] anvertraute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass Gott im Messias die Welt mit sich versöhnte«.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »und in uns das Wort der Versöhnung legte«; möglich ist auch: »unter uns« oder »uns«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »das Wort von der Versöhnung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: nämlich, dass
  rationale: Die Wendung leitet eine Erläuterung des vorausgehenden Gedankens ein. »Nämlich, dass« gibt diese Funktion in natürlichem, heutigem Deutsch wieder.
- source_word: θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων
  choice: Gott im Messias die Welt mit sich versöhnte
  rationale: ἦν mit dem Präsenspartizip καταλλάσσων bildet eine umschreibende Verbform. Die deutsche finite Form ist natürlicher als eine wörtliche Nachbildung und lässt ἐν Χριστῷ als »im Messias« stehen.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός bezeichnet hier den Titel des Gesalbten; »Messias« bewahrt dessen Bedeutungsgehalt.
- source_word: κόσμον
  choice: die Welt
  rationale: »Die Welt« ist die natürliche breite Entsprechung und engt den Bezug nicht ausdrücklich auf eine bestimmte Menschengruppe ein.
- source_word: καταλλάσσων ἑαυτῷ
  choice: mit sich versöhnte
  rationale: Die reflexive Wendung gibt die Richtung der Versöhnung auf Gott hin idiomatisch und genau wieder.
- source_word: μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν
  choice: ihnen ihre Verfehlungen nicht anrechnete
  rationale: »Anrechnen« bewahrt das Bild des Verbuchens; »Verfehlungen« bezeichnet konkrete schuldhafte Übertretungen, ohne den Ausdruck unnötig zu verengen.
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: und uns … anvertraute
  rationale: Die idiomatische Wiedergabe drückt aus, dass Gott die Verkündigung den apostolischen Zeugen übertrug. Die formalere örtliche Fassung von ἐν ἡμῖν wird in einer Fußnote bewahrt.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: die Botschaft von der Versöhnung
  rationale: λόγος bezeichnet hier den mitzuteilenden Inhalt. »Botschaft« ist im modernen Deutsch klarer als »Wort«, während die Fußnote die formalere Möglichkeit nennt.
theological_decisions:
- issue: Bezug und Wiedergabe von ἐν Χριστῷ
  choice: Gott versöhnte im Messias die Welt mit sich
  alternative: Gott war im Messias und versöhnte die Welt mit sich
  rationale: Die Hauptfassung versteht ἦν mit καταλλάσσων als umschreibende Verbform und bewahrt zugleich »im Messias«. Die Fußnote dokumentiert eine stärker wortgetreue Fassung, ohne die Beziehung zwischen Gottes Gegenwart und seinem versöhnenden Handeln dogmatisch auszudeuten.
- issue: Wiedergabe von ἐν ἡμῖν
  choice: uns … anvertraute
  alternative: in uns … niederlegte
  rationale: Die Hauptfassung gibt den im Zusammenhang naheliegenden Auftrag idiomatisch wieder; die Fußnote bewahrt die räumliche Formulierung des Griechischen und damit ihre mögliche theologische Nuance.
- issue: Bedeutung von λόγος in der Verkündigungsformel
  choice: Botschaft
  alternative: Wort
  rationale: »Botschaft« bezeichnet verständlich den Inhalt der Versöhnungsverkündigung. »Wort« bleibt als formalere Übersetzung möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Hauptfassung vermeidet eine im Deutschen schwerfällige Nachbildung der griechischen Partizipialkonstruktionen; Fußnoten halten die wesentlichen formalen und theologischen Mehrdeutigkeiten offen.
