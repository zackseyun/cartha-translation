id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: de
  text: 'Daher sind wir Gesandte für den Messias[a], als ob Gott durch uns an euch appellieren würde. Für den Messias bitten wir: Lasst euch mit Gott[b] versöhnen!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Christus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“, das heißt „Gesalbter“.
    reason: alternative_reading
  - marker: b
    text: Oder „zu Gott“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: für den Messias
  rationale: ὑπέρ mit dem Genitiv bezeichnet hier das Handeln für beziehungsweise im Auftrag einer anderen Person. „Für den Messias“ wahrt diese repräsentative Bedeutung, ohne sie stärker als der griechische Ausdruck festzulegen. Χριστός wird als Titel mit „Messias“ wiedergegeben.
- source_word: οὖν
  choice: Daher
  rationale: οὖν zieht eine Folgerung aus dem vorausgehenden Gedankengang über Gottes Versöhnungshandeln. „Daher“ markiert diesen Schluss klar und idiomatisch.
- source_word: πρεσβεύομεν
  choice: sind wir Gesandte
  rationale: πρεσβεύω bedeutet, als Gesandter oder Botschafter tätig zu sein. „Gesandte“ passt zum repräsentativen Auftrag und klingt im Deutschen würdig und natürlich.
- source_word: ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν
  choice: wobei es ist, als würde Gott durch uns eindringlich an euch appellieren
  rationale: Die Wiedergabe erhält die vergleichende Aussage von ὡς und stellt Gott als den durch die apostolischen Gesandten Handelnden dar. „Eindringlich appellieren“ gibt die dringliche, einladende Bedeutung von παρακαλέω im Zusammenhang wieder; „durch uns“ bewahrt die instrumentale Bedeutung von διά.
- source_word: δεόμεθα
  choice: bitten wir
  rationale: δέομαι bezeichnet eine ernsthafte, dringliche Bitte. Durch den Zusammenhang und den anschließenden Imperativ erhält das schlichte „bitten“ genügend Nachdruck, ohne altertümlich zu wirken.
- source_word: καταλλάγητε τῷ θεῷ
  choice: Lasst euch mit Gott versöhnen
  rationale: Der passive Imperativ wird im Deutschen idiomatisch mit „Lasst euch … versöhnen“ wiedergegeben. „Mit Gott“ entspricht der üblichen deutschen Rektion von „versöhnen“ und gibt die durch den griechischen Dativ bezeichnete Beziehung natürlich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός fungiert hier als Titel. „Messias“ macht dessen Bedeutung für heutige Leser unmittelbar sichtbar; die vertraute traditionelle Wiedergabe „Christus“ bleibt in einer Fußnote erhalten.
- issue: Stimme und Handlungsträgerschaft bei der Versöhnung
  choice: Lasst euch mit Gott versöhnen
  alternative: Versöhnt euch mit Gott
  rationale: 'Die passive Form bewahrt die Spannung des Textes: Die Angesprochenen erhalten einen Imperativ, doch die Versöhnung wird nicht als ihre eigenmächtige Leistung formuliert. Zugleich bleibt offen, wer im Passiv unmittelbar als Handelnder vorausgesetzt ist.'
- issue: Gottes Appell durch menschliche Gesandte
  choice: als würde Gott durch uns … appellieren
  alternative: da Gott durch uns appelliert
  rationale: Die mit ὡς ausgedrückte vergleichende Darstellungsweise wird nicht in eine unmarkierte direkte Behauptung umgeformt. So bleibt die sprachliche Spannung zwischen Gottes eigenem Appell und dem Dienst seiner Gesandten erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gesandte“ erhält das Bild offizieller Bevollmächtigung; „eindringlich appellieren“ und „Lasst euch … versöhnen“ sind allgemein verständlich. Die Wiederholung von „für den Messias“ bildet die Wiederholung des griechischen ὑπὲρ Χριστοῦ ab.
