  source_fidelity: 'Der Entwurf gibt die zentralen Bilder und die Satzbeziehung grundsätzlich treffend wieder: das Seufzen, die starke Sehnsucht, die „Behausung“ und ihre Herkunft „aus dem Himmel“ sowie die Bekleidungsmetapher. Das zusätzliche καὶ in καὶ γάρ bleibt jedoch unberücksichtigt; „auch“ sollte wiedergegeben werden. „Darin“ bewahrt den nicht ausdrücklich benannten, kontextabhängigen Bezug von ἐν τούτῳ idiomatischer als das im Deutschen unvollständige „in diesem“.'
  naturalness: '„Denn auch darin seufzen wir“ ist modernes, würdiges Standarddeutsch und schließt natürlich an den vorangehenden Vers an. „Behausung aus dem Himmel“ ist leicht gehoben, aber verständlich und erhält sowohl das Wohnbild als auch die Herkunftsangabe. '
  terminology: Die Begriffe „Behausung“, „aus dem Himmel“ und „anzuziehen“ sind angemessen. Sie legen weder die genaue Art der himmlischen Wirklichkeit noch eine bestimmte eschatologische Deutung fest. Die Fußnote sollte die Überzieh-Nuance präzise und idiomatisch ausdrücken.
  issues:
