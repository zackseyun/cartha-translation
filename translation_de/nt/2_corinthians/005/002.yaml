  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: de
  text: Denn auch darin seufzen wir und sehnen uns danach, unsere Behausung aus dem Himmel anzuziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „anzuziehen“ übersetzte Verb kann genauer bedeuten, etwas wie ein Obergewand über ein bereits angelegtes Kleidungsstück zu ziehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn
  rationale: Die Verbindung erläutert und bekräftigt die Aussage des vorherigen Verses. Im Deutschen gibt „Denn“ diese Funktion natürlich wieder; ein zusätzliches „ja“ wäre möglich, aber nicht erforderlich.
- source_word: ἐν τούτῳ
  choice: in diesem
  rationale: Die formal nahe Wiedergabe bewahrt den mehrdeutigen Bezug des Demonstrativpronomens. Gemeint ist im Zusammenhang wahrscheinlich das gegenwärtige Zelt beziehungsweise der gegenwärtige leibliche Zustand, doch der griechische Text nennt dies hier nicht ausdrücklich.
- source_word: στενάζομεν
  choice: seufzen wir
  rationale: „Seufzen“ bezeichnet verständlich die bedrängte, zugleich von Sehnsucht geprägte Regung; „stöhnen“ wäre körperlicher und im Deutschen weniger passend für diesen Zusammenhang.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: unsere Behausung aus dem Himmel
  rationale: „Behausung“ erhält das konkrete Wohnbild, während „aus dem Himmel“ die Herkunft bezeichnet und nicht bloß eine himmlische Eigenschaft ausdrückt.
- source_word: ἐπενδύσασθαι
  choice: anzuziehen
  rationale: Das Verb greift das Bild eines Kleidungsstücks auf und kann genauer das Darüberziehen bezeichnen. Die geläufige Haupttextform „anzuziehen“ wahrt das Bild; die besondere Nuance wird in der Fußnote genannt.
- source_word: ἐπιποθοῦντες
  choice: sehnen uns danach
  rationale: Die Form bezeichnet ein starkes, anhaltendes Verlangen, das gleichzeitig mit dem Seufzen besteht. Die verbale Wiedergabe ergibt einen natürlichen deutschen Satz.
theological_decisions:
- issue: Bedeutung der Behausung aus dem Himmel
  choice: Die Wohn- und Kleidungsbilder bleiben nebeneinander stehen, ohne die Behausung ausdrücklich als Auferstehungsleib, Zwischenzustand oder himmlische Heimat zu bestimmen.
  alternative: „unseren Auferstehungsleib aus dem Himmel anzuziehen“ oder „in unsere himmlische Heimat einzugehen“
  rationale: Der Vers verbindet selbst die Bilder von Behausung und Bekleidung und legt hier keine einzelne systematische Deutung eindeutig fest. Die Übersetzung bewahrt daher die Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Behausung“ ist leicht gehoben, erhält jedoch das konkrete Wohnbild und passt zum bildreichen Zusammenhang. Der Fußnotenmarker steht unmittelbar nach der Wendung, die er erläutert.
