    issue: Das καὶ in καὶ γάρ fehlt.
    rationale: Die Verbindung ist nicht nur begründend, sondern fügt auch eine bekräftigende bzw. anschließende Nuance hinzu. „Denn auch“ gibt dies ohne Überladung wieder.
  - severity: low
    issue: „in diesem“ wirkt ohne ein folgendes Bezugsnomen im Deutschen unvollständig.
    rationale: Das Griechische lässt das Bezugsobjekt offen; „darin“ ist im Deutschen idiomatisch und bewahrt diesen kontextabhängigen Bezug, ohne „Zelt“ oder „Leib“ in den Haupttext einzutragen.
  - severity: low
    issue: Die Formulierung „über das bereits Getragene“ in der Fußnote ist unidiomatisch.
    rationale: Gemeint ist ein Überziehen über ein bereits angelegtes Kleidungsstück; dies lässt sich klarer formulieren.
