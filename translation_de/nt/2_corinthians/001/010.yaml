    issue: „auch künftig“ im ersten Zukunftssatz
    rationale: ῥύσεται steht dort ohne ein Äquivalent zu „künftig“ oder „weiterhin“. Die zusätzliche zeitliche Nuance wird im letzten Satz durch καὶ ἔτι ausgedrückt und sollte nicht vorgezogen werden.
  - severity: low
    issue: Fußnotenwortwahl „gewaltigen“
    rationale: τηλικούτου bedeutet primär „so groß/so bedeutend“. „Gewaltig“ ist möglich, aber „so groß“ bildet die Formulierung der Ausgangssprache unmittelbarer ab.
  revised_text: Er hat uns aus so großer Todesgefahr gerettet und wird uns retten.[a] Auf ihn haben wir unsere Hoffnung gesetzt, dass er uns auch weiterhin retten wird.
