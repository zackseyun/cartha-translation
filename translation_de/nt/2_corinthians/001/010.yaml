reference: 2 Corinthians 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: de
  text: Er hat uns aus so großer Todesgefahr gerettet und wird uns retten.[a] Auf ihn haben wir unsere Hoffnung gesetzt, dass er uns auch weiterhin retten wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus einem so großen Tod«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου θανάτου
  choice: so großer Todesgefahr
  rationale: Die Wendung bezeichnet wörtlich einen »so großen Tod«, meint im Zusammenhang aber eine außerordentlich schwere, tödliche Gefahr. »So große Todesgefahr« bewahrt sowohl die Intensität als auch den Bezug zum Tod und klingt im Deutschen natürlich.
- source_word: ἐρρύσατο
  choice: hat ... gerettet
  rationale: Das Verb bezeichnet die Befreiung aus akuter Gefahr. »Gerettet« ist modern, anschaulich und im Zusammenhang idiomatisch.
- source_word: ῥύσεται
  choice: wird ... retten
  rationale: Die Wiederholung von »retten« bewahrt die lexikalische Verbindung mit ἐρρύσατο und gibt den Zukunftsbezug klar wieder.
- source_word: εἰς ὃν
  choice: Auf ihn
  rationale: In Verbindung mit ἐλπίζω bezeichnet εἰς das Ziel beziehungsweise den Gegenstand der Hoffnung. »Auf ihn« entspricht der natürlichen deutschen Wendung »auf jemanden hoffen«.
- source_word: ἠλπίκαμεν
  choice: haben wir unsere Hoffnung gesetzt
  rationale: Das Perfekt beschreibt ein gesetztes Vertrauen mit fortdauernder Wirkung. Die Formulierung bringt diese bleibende Ausrichtung natürlicher zum Ausdruck als das missverständliche »wir haben gehofft«.
- source_word: καὶ ἔτι
  choice: auch weiterhin
  rationale: Die Wortverbindung drückt zusätzliche und fortdauernde Rettung aus. »Auch weiterhin« erhält beide Nuancen, ohne eine einzelne weitere Rettung unnötig festzulegen.
theological_decisions:
- issue: Ob θάνατος wörtlich als »Tod« oder sinngemäß als tödliche Gefahr wiederzugeben ist
  choice: »Todesgefahr« im Haupttext, mit der wörtlicheren Wiedergabe in der Fußnote
  alternative: »aus einem so gewaltigen Tod«
  rationale: Im Deutschen bezeichnet »aus dem Tod retten« gewöhnlich die Befreiung nach eingetretenem Tod und könnte daher mehr festlegen, als der Zusammenhang verlangt. »Todesgefahr« gibt den wahrscheinlichen Sinn der griechischen Ausdrucksweise natürlich wieder; die Fußnote bewahrt das zugrunde liegende Bild.
- issue: Ob καὶ ἔτι eine einmalige erneute oder eine fortdauernde künftige Rettung bezeichnet
  choice: »auch weiterhin retten«
  alternative: »noch einmal retten«
  rationale: ἔτι kann »noch« oder »weiterhin« bedeuten. Die gewählte Fassung bewahrt die Erwartung künftiger Rettung, ohne sie auf genau ein weiteres Ereignis zu begrenzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die zweimalige Zukunftsaussage wird bewusst erhalten. Das Pronomen »Er« knüpft an Gott im vorausgehenden Zusammenhang an; »Auf ihn« wahrt den persönlichen Gegenstand der Hoffnung.
