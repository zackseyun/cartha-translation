id: 2CO.1.5
reference: 2 Corinthians 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: de
  text: Denn wie die Leiden Christi[a] zu uns überströmen, so strömt durch Christus auch unser Trost über.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Leiden um Christi willen«. Der griechische Ausdruck kann Leiden bezeichnen, die Christus zugehören, oder Leiden, die seinetwegen erduldet werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Aussage ein und bewahrt den kausalen Zusammenhang in natürlichem Deutsch.
- source_word: καθὼς ... οὕτως
  choice: wie ... so ... auch
  rationale: Gibt die korrelative Vergleichsstruktur klar und idiomatisch wieder.
- source_word: περισσεύει
  choice: überreich zu uns kommen / überreicher ... zuteilwerden
  rationale: Bewahrt in beiden Satzhälften den Gedanken überströmender Fülle, vermeidet aber eine im Deutschen unnatürliche identische Konstruktion.
- source_word: τὰ παθήματα
  choice: die Leiden
  rationale: Direkte, allgemein verständliche Wiedergabe, die sowohl Bedrängnisse als auch erduldetes Leiden umfasst.
- source_word: τοῦ Χριστοῦ
  choice: des Christus
  rationale: Hält den Genitiv formal offen und lässt sowohl Zugehörigkeit beziehungsweise Teilhabe als auch den Bezug auf um Christi willen erlittene Leiden erkennen; der Titelcharakter von Χριστός bleibt mit Artikel hörbar.
- source_word: εἰς ἡμᾶς
  choice: zu uns
  rationale: Bewahrt die gerichtete Aussage der Präposition, ohne das unnatürliche deutsche »in uns hinein« zu verwenden.
- source_word: διὰ τοῦ Χριστοῦ
  choice: durch Christus
  rationale: Gibt die vermittelnde Funktion von διά mit Genitiv knapp und genau wieder.
- source_word: ἡ παράκλησις ἡμῶν
  choice: uns ... Trost zuteil
  rationale: Gibt παράκλησις im leidensbezogenen Kontext pastoral als »Trost« wieder und versteht ἡμῶν natürlich als den Trost, den die Sprecher empfangen.
theological_decisions:
- issue: Bedeutung von »die Leiden des Christus«
  choice: Der Haupttext bewahrt den Genitiv und damit die Vorstellung von Leiden, die Christus zugehören und an denen seine Leute Anteil haben.
  alternative: Leiden, die um Christi willen erduldet werden; oder die Leiden, die Christus selbst erlitt und die sich nun in seinem Volk fortsetzen.
  rationale: Der griechische Genitiv bestimmt die Beziehung nicht eindeutig. Eine Fußnote nennt die naheliegende Zweck- beziehungsweise Bezugsdeutung, ohne die theologische Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Überreich« nimmt die Wiederholung von περισσεύει auf, während zwei idiomatisch verschiedene Verbfügungen einen schwerfälligen oder missverständlichen deutschen Satz vermeiden. »Des Christus« ist markierter als »Christi«, bewahrt hier jedoch bewusst den Titelcharakter und die offene Genitivbeziehung.
