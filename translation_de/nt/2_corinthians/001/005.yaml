  naturalness: »Überreicher Trost« wird im heutigen Deutsch als Komparativ verstanden (reicherer Trost) und ist zudem in dieser Form grammatisch bzw. stilistisch auffällig. Eine parallele Verbform mit »überströmen« gibt die Bildlichkeit des Griechischen klarer und natürlicher wieder.
  terminology: »Leiden Christi«, »Christus« und »Trost« sind etablierte, registergerechte Wiedergaben. »Leiden Christi« bewahrt die vom griechischen Genitiv eröffnete Deutungsspanne besser als das markierte »Leiden des Christus«.
