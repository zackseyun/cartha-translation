id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: de
  text: 'Paulus, nach Gottes Willen Apostel des Messias Jesus[a], und Timotheus, unser Bruder[b], an die Gemeinde Gottes in Korinth samt allen Heiligen in ganz Achaia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus Jesus.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: Timotheus, der Bruder.'
    reason: source_transparency
lexical_decisions:
- source_word: ἀπόστολος
  choice: Apostel
  rationale: „Apostel“ ist die etablierte und präzise Bezeichnung für den von Gott beauftragten Dienst des Paulus.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός hat hier in der amtlichen Selbstvorstellung des Paulus erkennbaren Titelsinn; die traditionelle Wiedergabe „Christus Jesus“ bleibt in einer Fußnote erhalten.
- source_word: διὰ θελήματος θεοῦ
  choice: nach Gottes Willen
  rationale: Die idiomatische deutsche Wendung gibt διά mit Genitiv in dieser Berufungsformel natürlich wieder und bezeichnet Gottes Willen als Grundlage des Apostelamts.
- source_word: Τιμόθεος ὁ ἀδελφός
  choice: Timotheus, unser Bruder
  rationale: Das griechische „der Bruder“ bezeichnet Timotheus als Glaubensbruder. „Unser Bruder“ ist im Deutschen in einer Briefanrede natürlich, ohne die gemeinte Beziehung zu verändern; die formnähere Wiedergabe wird in einer Fußnote genannt.
- source_word: ἐκκλησίᾳ
  choice: Gemeinde
  rationale: „Gemeinde“ ist im modernen deutschen Bibelstil die natürliche Bezeichnung für die örtliche Gemeinschaft der Glaubenden und passt zur paulinischen Briefanrede.
- source_word: ἁγίοις
  choice: Heiligen
  rationale: „Heilige“ ist die etablierte paulinische Bezeichnung für Gottes geheiligtes Volk und bewahrt den Bezug zur Heiligkeit.
- source_word: σὺν
  choice: samt
  rationale: „Samt“ gibt die einschließende Bedeutung von σύν knapp und in würdigem Briefstil wieder.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: in ganz Achaia
  rationale: Die Wendung folgt dem griechischen Umfangsausdruck eng und bezeichnet die gesamte römische Provinz Achaia.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Eingangsformel
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Der Titelsinn von Χριστός wird im Haupttext sichtbar gehalten; die traditionelle, ebenfalls mögliche Form steht in der Fußnote, ohne die christologische Aussage zu verändern.
- issue: Beziehungsbezeichnung für Timotheus
  choice: unser Bruder
  alternative: der Bruder
  rationale: Der bestimmte Artikel kennzeichnet Timotheus als den bekannten Glaubensbruder. Das Deutsche benötigt für eine natürliche Briefanrede eher die gemeinschaftliche Form „unser Bruder“; die wörtlichere Alternative wird offengelegt.
translation_notes:
  register: Moderner, würdiger deutscher Briefstil. Die Satzstruktur der griechischen Absender- und Empfängerformel bleibt erhalten; „Gemeinde“, „Apostel“ und „Heilige“ entsprechen dem etablierten deutschen Bibelwortschatz.
