  source_fidelity: 'Der Text gibt die griechische Absender- und Empfängerformel vollständig und in ihrer syntaktischen Zuordnung wieder: Paulus als Apostel aufgrund von Gottes Willen, Timotheus als Mitabsender, die Gemeinde Gottes in Korinth und alle Heiligen in ganz Achaia als Adressaten. „Unser Bruder“ ist gegenüber dem artikulierten ὁ ἀδελφός eine idiomatische, kontextuell sachgerechte Verdeutlichung; die formnähere Möglichkeit ist korrekt dokumentiert.'
  naturalness: Der Wortlaut ist modernes, würdiges Standarddeutsch und für eine paulinische Briefanrede gut lesbar. „Nach Gottes Willen Apostel“, „Gemeinde Gottes“, „Heilige“ und „samt“ haben einen angemessen bibelsprachlichen, aber nicht unverständlichen Registerton. „Des Messias Jesus“ ist als bewusste titelbetonte Wiedergabe verständlich und grammatisch möglich.
  terminology: 'Die zentralen Begriffe sind konsistent und angemessen wiedergegeben: ἀπόστολος mit „Apostel“, ἐκκλησία mit „Gemeinde“ und ἅγιοι mit „Heilige“. „Messias Jesus“ wahrt den Titelsinn von Χριστός; die traditionelle Alternative „Christus Jesus“ ist am zutreffenden Anker vermerkt. Die Fußnotenmarker sind korrekt platziert und die Fußnotentexte entsprechen ihren jeweiligen griechischen Bezugspunkten.'
