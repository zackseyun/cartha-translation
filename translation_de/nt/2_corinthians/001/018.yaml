id: 2CO.1.18
reference: 2 Corinthians 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πιστὸς δὲ ὁ θεὸς ὅτι ὁ λόγος ἡμῶν ὁ πρὸς ὑμᾶς οὐκ ⸀ἔστιν Ναὶ καὶ Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: de
  text: 'So gewiss Gott treu ist: Unsere Botschaft an euch ist nicht »Ja und Nein«.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Aber Gott ist treu, dass unser Wort an euch nicht Ja und Nein ist.« »Botschaft« kann auch mit »Wort« oder »Rede« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: treu
  rationale: Bezeichnet hier Gottes Verlässlichkeit; »treu« ist die natürliche und theologisch offene deutsche Wiedergabe.
- source_word: δὲ
  choice: So gewiss
  rationale: Im Zusammenhang bildet πιστὸς δὲ ὁ θεός mit ὅτι eine bekräftigende Wendung. »So gewiss« gibt ihre feierliche Aussagekraft im Deutschen natürlicher wieder als ein bloßes »aber«.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt den Inhalt der Bekräftigung ein und vermeidet die unnatürliche wörtliche Fügung »Gott ist treu, dass …«.
- source_word: λόγος
  choice: Botschaft
  rationale: Gemeint ist das, was Paulus und seine Mitarbeiter den Korinthern mitgeteilt haben. »Botschaft« ist hier idiomatischer als »Wort«, ohne den Sinn unnötig einzuengen.
- source_word: ἡμῶν
  choice: unsere
  rationale: Gibt den possessiven Genitiv direkt wieder.
- source_word: ὁ πρὸς ὑμᾶς
  choice: an euch
  rationale: Kennzeichnet die Botschaft als an die korinthische Gemeinde gerichtet.
- source_word: οὐκ ἔστιν
  choice: ist nicht
  rationale: Bewahrt das Präsens und die fortdauernde Geltung von Paulus’ Aussage.
- source_word: Ναὶ καὶ Οὔ
  choice: »Ja und Nein«
  rationale: Die wörtlich beibehaltene Paarung bewahrt den zugespitzten Gegensatz und deutet weder Wankelmut noch Widerspruch ausdrücklich in den Text hinein.
theological_decisions:
- issue: Wiedergabe der bekräftigenden Konstruktion πιστὸς δὲ ὁ θεὸς ὅτι
  choice: 'So gewiss Gott treu ist:'
  alternative: 'Aber Gott ist treu: Unsere Botschaft an euch ist nicht …'
  rationale: Die gewählte Fassung gibt Paulus’ Berufung auf Gottes Treue als feierliche Bekräftigung wieder, ohne ein kausales Verhältnis festzulegen. Die formalere adversative Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die bekräftigende Satzstruktur verständlich; »Ja und Nein« bleibt als markante Formulierung erhalten.
