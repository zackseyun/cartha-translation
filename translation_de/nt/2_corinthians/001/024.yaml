  terminology: „Glaube“ ist für πίστις an beiden Stellen konsistent und angemessen. „Freude“ und „fest stehen“ treffen die paulinische Ausdrucksweise. Die Fußnoten bewahren zulässige lexikalische bzw. grammatische Nuancen, ohne sie zum Hauptsinn zu machen.
