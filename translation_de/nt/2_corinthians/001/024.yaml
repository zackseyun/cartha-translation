  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: de
  text: Nicht dass wir über euren Glauben[a] herrschen, sondern wir arbeiten vielmehr an eurer Freude[b] mit; denn im Glauben steht ihr fest.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euer Vertrauen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sondern wir sind Mitarbeiter eurer Freude“; auch möglich: „wir arbeiten für eure Freude“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „denn durch den Glauben steht ihr fest“.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: κυριεύομεν
  choice: herrschen über
  rationale: Das Verb bezeichnet das Ausüben von Herrschaft oder Verfügungsgewalt. In der verneinten Form gibt „über … herrschen“ den Gedanken klar und würdig wieder, ohne eine umgangssprachlich überzeichnete Formulierung.
- source_word: ὑμῶν τῆς πίστεως
  choice: euren Glauben
  rationale: Der Genitiv wird im Deutschen idiomatisch als Objekt zu „herrschen über“ wiedergegeben. „Glaube“ ist hier die natürliche Hauptbedeutung; „Vertrauen“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: συνεργοί
  choice: wir arbeiten mit euch
  rationale: συνεργοί bezeichnet Mitwirkende oder Mitarbeiter. Die verbale Wiedergabe macht natürlich verständlich, dass Paulus und seine Begleiter nicht über der Gemeinde stehen, sondern gemeinsam mit ihr wirken. Die Ergänzung „mit euch“ ergibt sich aus dem Kontrast zur Herrschaft über ihren Glauben, ist aber nicht die einzig mögliche Zuordnung.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: an eurer Freude
  rationale: Der Genitiv kann die Freude als Bereich oder Ziel der gemeinsamen Arbeit bezeichnen. „An eurer Freude“ bewahrt diese Offenheit besser als eine stark finale Festlegung.
- source_word: τῇ γὰρ πίστει
  choice: durch den Glauben
  rationale: Der Dativ kann Mittel oder Grundlage ausdrücken. „Durch den Glauben“ gibt die instrumentale beziehungsweise begründende Lesart natürlich wieder; „im Glauben“ bleibt als mögliche Alternative vermerkt.
- source_word: ἑστήκατε
  choice: steht ihr fest
  rationale: Das Perfekt bezeichnet einen erreichten und fortdauernden festen Stand. Das deutsche Präsens mit „fest“ bringt diesen resultativen Zustand idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bedeutung von πίστις in beiden Vorkommen
  choice: Glaube
  alternative: Vertrauen; im Glauben
  rationale: Der Zusammenhang spricht vom glaubenden Stand der Korinther. „Glaube“ wahrt den üblichen paulinischen Ausdruck, während die mögliche Nuance „Vertrauen“ und die lokative Deutung des zweiten Dativs in den Fußnoten erhalten bleiben.
- issue: Verhältnis der Mitarbeiter zur Freude der Gemeinde
  choice: wir arbeiten mit euch an eurer Freude
  alternative: wir sind Mitarbeiter eurer Freude / Mitarbeiter für eure Freude
  rationale: Der Satz stellt gemeinsames Wirken der apostolischen Mitarbeiter einer Herrschaft über den Glauben gegenüber. Die gewählte Fassung bringt diesen Kontrast verständlich zum Ausdruck, ohne eine geistliche Verfügungsgewalt über die Gemeinde anzunehmen; die formal engere Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Parallelismus zwischen abgelehnter Herrschaft und gemeinsamer Arbeit bleibt deutlich; die griechischen Genitiv- und Dativkonstruktionen werden natürlich wiedergegeben, während echte Deutungsalternativen in den Fußnoten erhalten sind.
