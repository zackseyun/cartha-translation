source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: de
  text: Der aber uns zusammen mit euch in Christus[a] festigt und uns gesalbt hat, ist Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Christus“ bedeutet „der Gesalbte“ beziehungsweise „Messias“; im Griechischen besteht ein Wortzusammenhang mit „gesalbt hat“.
    reason: Die Fußnote macht das im Deutschen weniger unmittelbar erkennbare Wortspiel zwischen Χριστός und χρίω sichtbar.
lexical_decisions:
- source_word: βεβαιῶν
  choice: festigt
  rationale: Das Präsenspartizip bezeichnet fortdauerndes Festmachen oder Bestätigen. „Festigt“ ist im Deutschen natürlich und bewahrt diesen aktiven, durativen Sinn.
- source_word: σὺν ὑμῖν
  choice: zusammen mit euch
  rationale: Die Formulierung macht die gemeinsame Teilhabe des Paulus und seiner Mitarbeiter mit den Korinthern ausdrücklich sichtbar.
- source_word: εἰς Χριστόν
  choice: auf Christus hin
  rationale: „Auf Christus hin“ bewahrt die Richtungs- und Beziehungsnuance von εἰς besser als ein schlichtes „in“, ohne die Formulierung unnatürlich wörtlich als „in Christus hinein“ wiederzugeben.
- source_word: χρίσας
  choice: gesalbt hat
  rationale: Die Wiedergabe erhält die Wortverbindung zwischen χρίω („salben“) und Χριστός („der Gesalbte“) und vermeidet eine Verengung auf einen bestimmten Ritus.
- source_word: θεός
  choice: ist Gott
  rationale: Die deutsche Satzstellung lässt „Gott“ wie im Griechischen am Satzende hervortreten und macht es eindeutig zum Subjekt der beiden Handlungen.
theological_decisions:
- issue: Bedeutung von εἰς in εἰς Χριστόν
  choice: 'zielgerichtete und relationale Bedeutung: „auf Christus hin“'
  alternative: „in Christus“ beziehungsweise wörtlicher „in Christus hinein“
  rationale: Die griechische Präposition kann hier sowohl Ausrichtung auf Christus als auch die dadurch bestimmte Beziehung zu ihm ausdrücken. „Auf Christus hin“ wahrt diese Spannung, statt sie ausschließlich als statische Einbeziehung zu deuten.
- issue: Wortspiel zwischen Χριστόν und χρίσας
  choice: „Christus“ und „gesalbt“
  alternative: „Messias“ und „gesalbt“
  rationale: „Christus“ ist im modernen deutschen Bibelgebrauch die natürliche Wiedergabe von Χριστός und lässt durch die Fußnote zugleich die Bedeutung „der Gesalbte/Messias“ erkennen. Die unmittelbar folgende Salbungssprache bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktionen werden in einen flüssigen deutschen Relativsatz überführt; die Hervorhebung von „Gott“ am Satzende bleibt erhalten.
