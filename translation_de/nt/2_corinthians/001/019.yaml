id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: de
  text: Denn der Sohn Gottes, Jesus Christus, der unter euch durch uns verkündet wurde – durch mich und Silvanus und Timotheus –, ist nicht Ja und Nein geworden, sondern in ihm ist es Ja geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… war nicht Ja und Nein, sondern in ihm ist es Ja.“'
    reason: Die Verben γίνομαι und das Perfekt γέγονεν können im Zusammenhang auch zustandsbezogen wiedergegeben werden; diese Alternative klingt im Deutschen idiomatischer, bildet den Aspekt aber weniger ausdrücklich ab.
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: der Sohn Gottes
  rationale: Die natürliche deutsche Wortstellung bewahrt den titularen Ausdruck und sein volles christologisches Gewicht.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus Christus
  rationale: Die Verbindung steht hier als feste, namenähnliche Bezeichnung; im Deutschen ist „Jesus Christus“ die natürliche und sachlich genaue Wiedergabe.
- source_word: κηρυχθείς
  choice: verkündet wurde
  rationale: „Verkündet“ gibt den öffentlichen, heroldartigen Sinn von κηρύσσω in würdigem, geläufigem Deutsch wieder.
- source_word: ἐν ὑμῖν δι’ ἡμῶν
  choice: unter euch durch uns
  rationale: „Unter euch“ bezeichnet den Wirkungsbereich, während „durch uns“ die im griechischen διά ausgedrückte Vermittlung wahrt.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: durch mich und Silvanus und Timotheus
  rationale: Die Wiederholung von „durch“ bildet die griechische Konstruktion transparent ab und nennt Paulus sowie seine Mitarbeiter ausdrücklich.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: ist nicht Ja und Nein geworden
  rationale: Die Formulierung erhält sowohl das Werden-Verb ἐγένετο als auch die zugespitzte Ja-Nein-Rhetorik, ohne sie als bloße Wankelmütigkeit auszudeuten.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: sondern in ihm ist es Ja geworden
  rationale: Das Perfekt γέγονεν wird mit „ist ... geworden“ wiedergegeben; „in ihm“ und das offene Bezugswort „es“ bleiben erhalten, statt die Aussage interpretierend zu ergänzen.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Verbindung Ἰησοῦς Χριστός
  choice: Jesus Christus
  alternative: Jesus, der Messias
  rationale: In diesem Satz fungiert die Verbindung namenähnlich. „Jesus Christus“ ist im modernen Deutschen die natürliche feste Bezeichnung, ohne den messianischen Gehalt des Titels zu leugnen.
- issue: Deutung von Ja und Nein
  choice: Die rhetorischen Wörter „Ja“ und „Nein“ bleiben stehen
  alternative: „war nicht unbeständig, sondern zuverlässig“
  rationale: Paulus’ theologisch dichte Gegenüberstellung wird nicht in eine erklärende Charakterisierung aufgelöst.
- issue: Bezugsgröße des unpersönlichen Verbs in „in ihm ist es Ja geworden“
  choice: Das unbestimmte „es“ bleibt im Haupttext erhalten
  alternative: „in ihm ist das Ja Wirklichkeit geworden“
  rationale: Der griechische Text nennt kein ausdrückliches Subjekt; die Übersetzung bewahrt diese Offenheit und vermeidet eine interpretive Substantivierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt die erläuternde Nennung der Verkündiger ab. „Silvanus“ folgt der griechischen Namensform. Die ungewöhnliche Ja-Nein-Formulierung bleibt bewusst transparent und wird nicht geglättet.
