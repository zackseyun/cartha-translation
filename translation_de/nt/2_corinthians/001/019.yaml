  terminology: „Jesus Christus“ ist im Deutschen als feste personenbezeichnende Form natürlich und entspricht der namensähnlichen Verwendung von Ἰησοῦς Χριστός. „Silvanus“ folgt der griechischen Namensform; „Timotheus“ ist die etablierte deutsche Form. „Verkündet“ trifft κηρυχθείς angemessen. Die Fußnote ist korrekt an der idiomatischeren, aber aspektuell weniger ausdrücklichen Alternative verankert.
