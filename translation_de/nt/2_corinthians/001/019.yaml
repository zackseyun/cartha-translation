  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Ausdrücke des griechischen Textes eng wieder: den Titel „der Sohn Gottes“, die namenähnliche Verbindung „Jesus Christus“, die zweimalige διά-Vermittlung, das Aorist-„geworden“ bei οὐκ ἐγένετο sowie das Perfekt bei γέγονεν. Die bewusst transparente Gegenüberstellung „Ja und Nein“ wird nicht interpretierend zu „unbeständig“ o. Ä. aufgelöst.'
