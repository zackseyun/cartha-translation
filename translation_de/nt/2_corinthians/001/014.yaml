  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: de
  text: so wie ihr uns auch zum Teil erkannt habt[a], dass wir für euch ein Grund zum Rühmen sind, wie auch ihr für uns ein Grund zum Rühmen seid[b] am Tag unseres Herrn Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zu einem gewissen Grad“ oder „teilweise“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ruhm“ oder „Anlass zum Stolz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: erkannt habt
  rationale: „Erkannt habt“ gibt den Aorist natürlich wieder und lässt je nach Zusammenhang sowohl Wiedererkennen als auch ein gewonnenes Verständnis anklingen, ohne vollständige Erkenntnis zu behaupten.
- source_word: ἀπὸ μέρους
  choice: zum Teil
  rationale: Die feste deutsche Wendung bewahrt die Aussage einer begrenzten oder unvollständigen Erkenntnis und lässt deren Ausmaß offen.
- source_word: καύχημα
  choice: Ruhm
  rationale: „Ruhm“ ist im Deutschen eine natürliche substantivische Wiedergabe, die den Grund freudigen Rühmens bezeichnet und die gegenseitige Beziehung ausdrückt, ohne bloße Eitelkeit zu unterstellen.
- source_word: καθάπερ
  choice: so wie
  rationale: Die Formulierung erhält den ausdrücklichen wechselseitigen Vergleich zwischen Paulus und den Korinthern.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: am Tag unseres Herrn Jesus
  rationale: Dies bewahrt die etablierte eschatologische Wendung und gibt die Genitivverbindung direkt und würdig wieder.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist die angemessene standarddeutsche Wiedergabe des christologischen Titels in diesem Zusammenhang.
- source_word: καθὼς καὶ
  choice: so wie … ja
  rationale: „So wie“ stellt die Rückbindung an den vorherigen Gedanken her; „ja“ gibt die bekräftigende beziehungsweise additive Kraft von καί in natürlichem Deutsch wieder.
theological_decisions:
- issue: Paulus’ wechselseitige Verwendung von καύχημα
  choice: wir euer Ruhm sind, so wie auch ihr der unsere seid
  alternative: wir euer Grund zum Rühmen sind, so wie auch ihr der unsere seid
  rationale: Die knappe Form bewahrt Paulus’ gegenseitige eschatologische Ruhmes- beziehungsweise Rühmenssprache, ohne sie als selbstbezogene Überheblichkeit umzudeuten oder ihre Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanschluss bleibt entsprechend dem griechischen Zusammenhang offen; „zum Teil“ und „Ruhm“ erhalten die bewusste semantische Weite des Ausgangstextes.
