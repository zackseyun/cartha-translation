  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: de
  text: 'Ich aber rufe Gott als Zeugen gegen mich selbst[a] an: Um euch zu schonen, bin ich nicht wieder[b] nach Korinth gekommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „auf meine Seele“; möglich ist auch: „gegen mein eigenes Leben“. Gemeint ist eine feierliche Berufung auf Gott, bei der Paulus mit seiner eigenen Person einsteht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nicht mehr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Ich aber
  rationale: Bewahrt sowohl den leichten Gegensatz durch δέ als auch die ausdrückliche Hervorhebung des ἐγώ.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: ich rufe Gott als Zeugen … an
  rationale: Gibt die feierliche, eidähnliche Berufung auf Gott in natürlichem und zugleich würdigem Deutsch wieder.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: gegen mich selbst
  rationale: Bringt verständlich zum Ausdruck, dass Paulus sich mit seiner eigenen Person der Bezeugung Gottes stellt; die wörtlichere Wendung bleibt in der Fußnote erhalten.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen natürlich den Inhalt der feierlichen Beteuerung ein.
- source_word: φειδόμενος ὑμῶν
  choice: Um euch zu schonen
  rationale: Gibt das motivierende Partizip knapp und idiomatisch wieder.
- source_word: οὐκέτι ἦλθον
  choice: bin ich nicht wieder … gekommen
  rationale: Passt zum Zusammenhang einer unterbliebenen erneuten Reise nach Korinth, ohne die mögliche zeitliche Nuance von οὐκέτι zu verschweigen.
- source_word: εἰς Κόρινθον
  choice: nach Korinth
  rationale: Übliche deutsche Wiedergabe einer Bewegung zu einer Stadt.
theological_decisions:
- issue: Eidähnliche Selbstverpflichtung in ἐπὶ τὴν ἐμὴν ψυχήν
  choice: gegen mich selbst
  alternative: auf meine Seele / bei meinem Leben
  rationale: Die Übersetzung lässt den ernsten Charakter der Berufung auf Gott und die persönliche Haftung des Paulus bestehen, ohne eine bestimmte Lehre über die Beschaffenheit der Seele in den Ausdruck hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Aussage bleibt deutlich, während schwer verständliche wörtliche Formulierungen in die Fußnote verlagert werden. Die Wortstellung hebt wie im Griechischen zunächst Paulus selbst hervor.
