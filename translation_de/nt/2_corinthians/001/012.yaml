  - severity: medium
    issue: τοῦ θεοῦ in εἰλικρινείᾳ τοῦ θεοῦ im Haupttext eindeutig als Herkunft bestimmt
    rationale: „die von Gott kommt“ ist möglich, aber der Genitiv kann auch eine qualifizierende Bedeutung haben. Da die genaue Nuance nicht eindeutig ist, sollte der Haupttext die Mehrdeutigkeit nicht unnötig auflösen; die Fußnote kann die Optionen nennen.
