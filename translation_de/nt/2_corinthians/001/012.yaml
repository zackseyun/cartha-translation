id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: de
  text: 'Denn dies ist unser Grund zum Rühmen: das Zeugnis unseres Gewissens, dass wir uns in der Welt in Heiligkeit[a] und göttlicher Aufrichtigkeit[b] verhalten haben, nicht in fleischlicher Weisheit[c], sondern in der Gnade Gottes – und ganz besonders euch gegenüber.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „Schlichtheit“ statt „Heiligkeit“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Aufrichtigkeit, die von Gott kommt“; wörtlicher: „Aufrichtigkeit Gottes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „menschlicher Weisheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: Ruhm
  rationale: „Ruhm“ gibt den positiven Grund des Sich-Rühmens knapp und würdig wieder, ohne vorrangig an selbstgefälliges Prahlen denken zu lassen.
- source_word: μαρτύριον τῆς συνειδήσεως
  choice: das Zeugnis unseres Gewissens
  rationale: Die Formulierung bewahrt die innere Bezeugung durch das Gewissen und folgt der griechischen Genitivverbindung eng.
- source_word: ἁγιότητι
  choice: in Heiligkeit
  rationale: Dies entspricht dem SBLGNT-Haupttext und erhält den moralisch-religiösen Gehalt des Substantivs.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: in Aufrichtigkeit, die von Gott kommt
  rationale: „Aufrichtigkeit“ ist natürliches modernes Deutsch; der Zusatz gibt τοῦ θεοῦ plausibel als Herkunftsangabe wieder, ohne die Genitivbeziehung als eindeutig auszugeben.
- source_word: σοφίᾳ σαρκικῇ
  choice: in fleischlicher Weisheit
  rationale: Die Wiedergabe hält die für Paulus bedeutsame σάρξ-Wortgruppe sichtbar und vermeidet die Abschwächung zu bloß „menschlicher“ Weisheit.
- source_word: χάριτι θεοῦ
  choice: in der Gnade Gottes
  rationale: Die etablierte Formulierung bewahrt sowohl den theologischen Gehalt von χάρις als auch die Genitivkonstruktion.
- source_word: ἀνεστράφημεν
  choice: wir uns … verhalten haben
  rationale: Das Verb bezeichnet hier Lebensführung beziehungsweise Verhalten; die deutsche Wendung ist präzise und gegenwärtig.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: und ganz besonders euch gegenüber
  rationale: Dies bringt die verstärkende Vergleichsbedeutung und den relationalen Sinn von πρός idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bedeutung von τοῦ θεοῦ in εἰλικρινείᾳ τοῦ θεοῦ
  choice: 'als Herkunft: „Aufrichtigkeit, die von Gott kommt“'
  alternative: „gottgemäße Aufrichtigkeit“ oder formal „Aufrichtigkeit Gottes“
  rationale: Der Genitiv kann Herkunft oder Qualität bezeichnen. Die Hauptfassung versteht Gott als Ursprung, während die Fußnote die genuine Mehrdeutigkeit offenhält.
- issue: Anthropologische Bedeutung von σαρκικός
  choice: „fleischlich“
  alternative: „menschlich“ oder „weltlich“
  rationale: „Fleischlich“ bewahrt die paulinische Spannung zwischen einer vom Fleisch bestimmten Weisheit und der Gnade Gottes, ohne sie vorschnell auf allgemein menschliche oder weltliche Maßstäbe zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der Argumentation des griechischen Textes, wird jedoch durch Doppelpunkt und Gedankenstrich lesbar gegliedert. Die Schlüsselbegriffe „Heiligkeit“, „fleischlich“ und „Gnade Gottes“ bleiben erkennbar erhalten.
