revisions:
- from: 'Denn dies ist unser Ruhm: das Zeugnis unseres Gewissens, dass wir uns in der Welt in Heiligkeit[a] und in Aufrichtigkeit, die von Gott kommt,[b] verhalten haben, nicht in fleischlicher Weisheit[c], sondern in der Gnade Gottes – und ganz besonders euch gegenüber.'
  to: 'Denn dies ist unser Grund zum Rühmen: das Zeugnis unseres Gewissens, dass wir uns in der Welt in Heiligkeit[a] und göttlicher Aufrichtigkeit[b] verhalten haben, nicht in fleischlicher Weisheit[c], sondern in der Gnade Gottes – und ganz besonders euch gegenüber.'
  rationale: Die Revision ersetzt das potenziell missverständliche „Ruhm“ durch „Grund zum Rühmen“ und verwendet bei εἰλικρινείᾳ τοῦ θεοῦ die offenere Formulierung „göttliche Aufrichtigkeit“. Damit bleiben die im Griechischen mögliche Herkunfts- und Qualitätsnuance sowie die einschlägigen Fußnoten erhalten. Die textkritische Anmerkung zu ἁγιότητι und die Ankerzuordnung bleiben korrekt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:30:38Z'
