id: 2CO.1.11
reference: 2 Corinthians 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: de
  text: Auch ihr helft durch euer Gebet[c] für uns mit, damit viele Menschen[b] für die Gnadengabe danken, die uns durch viele zuteilgeworden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Satzbau ist an dieser Stelle mehrdeutig. Möglich ist auch: „… damit durch viele von vielen Menschen für die uns erwiesene Gnadengabe Dank gesagt wird.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „aus vielen Gesichtern“. Gemeint sind viele Menschen.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort bezeichnet besonders ein bittendes oder dringliches Gebet.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων καὶ ὑμῶν
  choice: Auch ihr helft … mit
  rationale: Die Formulierung gibt sowohl die Beteiligung der Adressaten als auch die gemeinschaftliche Kraft des Präfixes συν- natürlich wieder.
- source_word: ὑπὲρ ἡμῶν τῇ δεήσει
  choice: durch euer Gebet für uns
  rationale: Der Dativ bezeichnet hier das Mittel der Mithilfe; δέησις meint insbesondere ein bittendes, dringliches Gebet.
- source_word: ἐκ πολλῶν προσώπων
  choice: viele Menschen
  rationale: πρόσωπον bedeutet wörtlich „Gesicht“, bezeichnet in dieser Wendung jedoch Menschen beziehungsweise Personen.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: die Gnadengabe, die uns … zuteilgeworden ist
  rationale: χάρισμα bezeichnet eine aus Gnade gewährte Gabe; εἰς ἡμᾶς richtet diese Gabe auf Paulus und seine Begleiter.
- source_word: διὰ πολλῶν
  choice: durch viele
  rationale: Die zweite Nennung von „vielen“ bleibt erhalten, weil sie ausdrücklich im griechischen Text steht, auch wenn ihr syntaktischer Bezug umstritten ist.
- source_word: εὐχαριστηθῇ
  choice: danken
  rationale: Die passive griechische Form wird im Deutschen idiomatisch als aktive Dankhandlung ausgedrückt.
theological_decisions:
- issue: Geber der Gnadengabe
  choice: Der Geber wird nicht ausdrücklich genannt.
  alternative: „die uns von Gott gewährte Gnadengabe“
  rationale: Gott ist im Zusammenhang als Geber vorausgesetzt, wird in diesem Satzteil aber nicht ausdrücklich genannt; die Übersetzung vermeidet daher eine erklärende Ergänzung.
- issue: Bezug von διὰ πολλῶν
  choice: „durch viele“ wird auf das Zuteilwerden der Gnadengabe bezogen.
  alternative: „damit durch viele von vielen Menschen für die uns erwiesene Gnadengabe Dank gesagt wird“
  rationale: Die griechische Wortfolge ist schwierig und lässt den Bezug der Präpositionalphrase offen. Der Haupttext bietet eine lesbare Möglichkeit, während die Fußnote die andere verbreitete Zuordnung bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gnadengabe“ bewahrt den Zusammenhang von Gnade und Gabe; die doppelte Erwähnung von „vielen“ bleibt trotz der schwierigen griechischen Syntax sichtbar.
