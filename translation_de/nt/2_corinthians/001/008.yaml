  terminology: „Bedrängnis“, „über alle Maßen“, „über unsere Kraft hinaus“, „belastet“ und „am Weiterleben verzweifelten“ sind treffend. „Brüder und Schwestern“ ist als pragmatisch inklusive Gemeindeanrede vertretbar, sofern die Fußnote die maskuline griechische Form transparent dokumentiert. „Asia“ bleibt im Haupttext als Quellentoponym erhalten; die römische Provinzzuordnung wird erläutert.
