  to: 'Denn wir wollen euch, Brüder und Schwestern,[a] nicht im Unklaren lassen über unsere Bedrängnis, die uns in Asia[b] widerfahren ist: Wir wurden über alle Maßen, über unsere Kraft hinaus belastet, sodass wir sogar am Weiterleben verzweifelten.[c]'
