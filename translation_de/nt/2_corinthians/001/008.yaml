  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: de
  text: 'Denn wir wollen euch, Brüder und Schwestern,[a] nicht im Unklaren lassen über unsere Bedrängnis, die uns in Asia[b] widerfahren ist: Wir wurden über alle Maßen, über unsere Kraft hinaus belastet, sodass wir sogar am Weiterleben verzweifelten.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; der griechische maskuline Plural kann in dieser Gemeindeanrede Männer und Frauen einschließen.
    reason: cultural_note
  - marker: b
    text: Asia war eine römische Provinz im Westen Kleinasiens, nicht der heutige Kontinent Asien.
    reason: cultural_note
  - marker: c
    text: 'Oder: „sodass wir sogar daran verzweifelten, am Leben zu bleiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλομεν … ἀγνοεῖν
  choice: wir wollen nicht, dass ihr … nichts … wisst
  rationale: Die deutsche Negativkonstruktion gibt die volitionale Aussage und das Nichtwissen natürlich wieder, ohne das heute abwertend klingende „unwissend“ zu verwenden.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der grammatisch maskuline Plural dient hier als Anrede der christlichen Gemeinde; die inklusive Wiedergabe macht den wahrscheinlichen gemischten Adressatenkreis im modernen Deutschen verständlich. Eine Fußnote dokumentiert die Form des griechischen Ausdrucks.
- source_word: θλίψεως
  choice: Bedrängnis
  rationale: „Bedrängnis“ bewahrt sowohl den Gedanken großen Drucks als auch den ernsten Charakter der Not.
- source_word: τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: die uns in der Provinz Asia widerfahren ist
  rationale: „Widerfahren“ ist im Deutschen idiomatisch für eine erlittene Not. „Provinz Asia“ verhindert die Verwechslung mit dem heutigen Kontinent.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν
  choice: über alle Maßen und über unsere Kraft hinaus
  rationale: 'Die doppelte Steigerung wird erhalten: außergewöhnliches Ausmaß und Überschreitung der eigenen Belastbarkeit.'
- source_word: ἐβαρήθημεν
  choice: wir wurden … belastet
  rationale: Das Passiv und das Bild einer schweren Last bleiben gewahrt; „belastet“ ist zugleich gegenwärtiges, gut verständliches Deutsch.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: sodass wir sogar am Weiterleben verzweifelten
  rationale: Die Ergebniskonstruktion wird mit „sodass“ wiedergegeben. „Am Weiterleben verzweifeln“ erfasst idiomatisch, dass Paulus keinerlei Ausweg mehr zum Leben sah.
theological_decisions:
- issue: Inklusive Bedeutung von ἀδελφοί in der Gemeindeanrede
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Die griechische Form ist maskulin, kann aber eine gemischte Gemeinde einschließen. Die Haupttextfassung vermittelt diese pragmatische Reichweite, während die Fußnote die formale Gestalt transparent macht.
- issue: Stärke der Aussage ἐξαπορηθῆναι … τοῦ ζῆν
  choice: am Weiterleben verzweifelten
  alternative: sogar am Leben verzweifelten / völlig ratlos waren, ob wir überleben würden
  rationale: Die Fassung wahrt die existentielle Schärfe, ohne zu behaupten, Paulus habe das Leben moralisch verworfen oder den Tod gewünscht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den langen griechischen Satz verständlich, ohne seine Begründungs- und Ergebniskette aufzulösen. Die Formulierung bewahrt die rhetorische Steigerung und die existentielle Spannung.
