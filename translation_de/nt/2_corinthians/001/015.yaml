id: 2CO.1.15
reference: 2 Corinthians 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: de
  text: Und in dieser Zuversicht wollte ich zuerst[a] zu euch kommen, damit ihr eine zweite Wohltat[b] empfangen würdet,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: früher zu euch kommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: eine zweite Gnade; auch: eine zweite Gunst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: Zuversicht
  rationale: „Zuversicht“ gibt das feste Vertrauen wieder, auf dem Paulus seine Reiseabsicht gründete, und klingt im modernen Deutsch natürlich.
- source_word: ἐβουλόμην
  choice: wollte ich
  rationale: Das Imperfekt bezeichnet hier Paulus’ damaligen Willen beziehungsweise seine Absicht, ohne einen förmlich festgelegten Reiseplan vorauszusetzen.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: zuerst zu euch kommen
  rationale: 'πρότερον bezeichnet wahrscheinlich die vorgesehene Reihenfolge der Reise: Korinth sollte die erste Station sein. Die mögliche zeitliche Lesart „früher“ bleibt in einer Fußnote erhalten.'
- source_word: δευτέραν χάριν
  choice: eine zweite Wohltat
  rationale: χάρις bezeichnet in diesem Zusammenhang wahrscheinlich die Wohltat oder Gunst, die den Korinthern durch einen weiteren Besuch des Paulus zugutekäme. „Wohltat“ bewahrt den substantivischen Ausdruck und vermeidet eine vorschnelle Festlegung auf die heilsgeschichtliche Bedeutung „Gnade“.
- source_word: σχῆτε
  choice: empfangen würdet
  rationale: Obwohl ἔχω wörtlich „haben“ bedeutet, ist „eine Wohltat empfangen“ im Deutschen idiomatischer und gibt hier den resultativen Sinn angemessen wieder.
theological_decisions:
- issue: Bedeutung von χάρις im Ausdruck δευτέραν χάριν
  choice: Wohltat
  alternative: Gnade; Gunst
  rationale: Der unmittelbare Reisekontext legt einen Vorteil oder eine Wohltat durch Paulus’ Besuch nahe. Da χάρις jedoch auch „Gnade“ oder „Gunst“ bedeuten kann, wird diese echte lexikalische Spannweite nicht dogmatisch eingeengt, sondern in der Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Satzbau folgt dem griechischen Gedankengang eng, bleibt aber idiomatisch. Das abschließende Komma signalisiert, dass der Satz in Vers 16 weitergeführt wird.
