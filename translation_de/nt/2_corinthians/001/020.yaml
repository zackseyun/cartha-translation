  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: de
  text: 'Denn wie viele Verheißungen Gottes es auch gibt: In ihm ist das Ja.[a] Darum kommt auch durch ihn das Amen Gott zur Ehre durch uns.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ausführlicher könnte man übersetzen: „In ihm haben sie ihr Ja.“'
    reason: alternative_reading
  - marker: b
    text: „Amen“ ist ein aus dem Hebräischen übernommenes Bekräftigungswort und bedeutet etwa „wahrlich“ oder „so sei es“.
    reason: cultural_note
  - marker: c
    text: 'Oder, mit anderer Zuordnung der Schlusswendung: „durch uns zur Ehre Gottes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: so viele … es auch gibt
  rationale: Gibt die unbestimmte Gesamtheit aller Verheißungen idiomatisch wieder, ohne ihre Zahl näher festzulegen.
- source_word: ἐπαγγελίαι θεοῦ
  choice: Verheißungen Gottes
  rationale: „Verheißungen“ ist im Deutschen die natürliche, theologisch nicht einengende Bezeichnung für Gottes Zusagen; der Genitiv bleibt gewahrt.
- source_word: ἐν αὐτῷ τὸ Ναί
  choice: In ihm ist das Ja
  rationale: Bewahrt die knappe, rhetorische Ellipse des Griechischen und vermeidet die erklärende Ergänzung, die Verheißungen seien in Christus „erfüllt“.
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: Darum kommt auch durch ihn
  rationale: „Darum“ kennzeichnet die Folgerung; „durch ihn“ wahrt Christus als Mittler. Das ergänzte Verb „kommt“ ermöglicht einen natürlichen deutschen Satz, ohne die Richtung des Geschehens näher auszulegen.
- source_word: τὸ Ἀμὴν
  choice: das Amen
  rationale: Der im Deutschen eingebürgerte liturgische Ausdruck erhält die Parallele zum substantivierten „Ja“.
- source_word: τῷ θεῷ
  choice: zu Gott
  rationale: Gibt den Dativ als Empfänger beziehungsweise Ziel des Amen wieder und bewahrt die Richtung der Aussage.
- source_word: πρὸς δόξαν
  choice: zu seiner Ehre
  rationale: Drückt die Zielrichtung idiomatisch aus; „seiner“ bezieht die Ehre naheliegend auf Gott, während die mögliche syntaktische Zuordnung in einer Fußnote kenntlich bleibt.
- source_word: δι’ ἡμῶν
  choice: durch uns
  rationale: Bewahrt die weite Formulierung und ergänzt weder „Dienst“ noch eine andere nähere Bestimmung.
theological_decisions:
- issue: Soll die elliptische Aussage als Erfüllungsformel entfaltet werden?
  choice: Die knappe Formulierung „In ihm ist das Ja“ bleibt erhalten.
  alternative: „In ihm werden alle Verheißungen erfüllt“ oder „In ihm haben sie ihr Ja“.
  rationale: Erfüllung in Christus ist sachlich mitgemeint, wird im griechischen Wortlaut jedoch nicht ausdrücklich durch ein Verb bezeichnet. Die kompakte Aussage bewahrt die rhetorische und theologische Spannung.
- issue: Wie ist πρὸς δόξαν syntaktisch zu beziehen?
  choice: Im Haupttext wird es idiomatisch als Zielangabe „zu seiner Ehre“ wiedergegeben.
  alternative: 'Engere Verbindung mit „zu Gott“: „zur Ehre Gottes“.'
  rationale: Beide Auffassungen führen inhaltlich nahe zusammen; die Fußnote weist darauf hin, dass die griechische Fügung auch ausdrücklich als „zur Ehre Gottes“ verstanden werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markanten Substantivierungen „das Ja“ und „das Amen“ spiegeln bewusst den rhetorischen Parallelismus des griechischen Textes. Die ungewöhnliche Kürze von „In ihm ist das Ja“ bleibt als stilprägendes Merkmal erhalten.
