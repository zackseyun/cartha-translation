  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Die Hoffnung ist βεβαία („steht fest“), εἰδότες wird angemessen kausal mit „denn wir wissen“ entfaltet, und die Entsprechung von Teilhabe an Leiden und Trost bleibt erhalten. „Für euch“ ist für ὑπὲρ ὑμῶν in diesem Kontext vertretbar und entspricht der englischen Audit-Spur.'
