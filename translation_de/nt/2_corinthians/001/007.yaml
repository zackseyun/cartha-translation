source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: de
  text: 'Und unsere Hoffnung für euch steht fest, denn wir wissen: Wie ihr an den Leiden Anteil habt, so habt ihr auch am Trost Anteil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an der Ermutigung« statt »am Trost« (παράκλησις).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: Hoffnung
  rationale: Die übliche und transparente Wiedergabe bewahrt sowohl die Erwartung als auch das darin liegende Vertrauen.
- source_word: βεβαία
  choice: steht fest
  rationale: Die idiomatische Formulierung gibt den sicheren und verlässlichen Charakter der Hoffnung wieder.
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: ὑπέρ mit dem Genitiv bezeichnet hier die Ausrichtung auf die Korinther; »für euch« ist im Deutschen natürlich und knapp.
- source_word: εἰδότες
  choice: denn wir wissen
  rationale: Das Partizip nennt den Grund für die feste Hoffnung; die kausale Wiedergabe macht diesen Zusammenhang klar.
- source_word: ὡς ... οὕτως καί
  choice: Wie ... so ... auch
  rationale: Diese Form bewahrt die korrelative Struktur des griechischen Satzes und klingt zugleich natürlich.
- source_word: κοινωνοί
  choice: Anteil habt
  rationale: Das Substantiv bezeichnet Beteiligung oder Teilhabe. Die verbale deutsche Wiedergabe ist idiomatisch und lässt sich in beiden Satzhälften verwenden.
- source_word: παθημάτων
  choice: Leiden
  rationale: »Leiden« ist die klare, umfassende Entsprechung und passt zum unmittelbaren Kontext.
- source_word: παρακλήσεως
  choice: Trost
  rationale: Im Kontext von 2. Korinther 1 bezeichnet παράκλησις wiederholt tröstenden Zuspruch; »Trost« wahrt diese begriffliche Verbindung.
- source_word: '[elliptical second clause]'
  choice: habt ihr auch ... Anteil
  rationale: Im Griechischen wird die Aussage der ersten Satzhälfte in der zweiten nicht vollständig wiederholt. Die Ergänzung macht die Ellipse im Deutschen verständlich, ohne neuen Inhalt hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »Anteil habt« macht die griechische Parallelstruktur klar; der Doppelpunkt nach »wir wissen« führt natürlich in diese Gegenüberstellung ein.
