id: 2CO.1.17
reference: 2 Corinthians 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: de
  text: Als ich das also beabsichtigte, war ich da etwa leichtfertig? Oder fasse ich meine Pläne nach dem Fleisch[a], sodass es bei mir »Ja, ja« und »Nein, nein« heißt?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Nach dem Fleisch« kann hier bedeuten: nach rein menschlichen oder weltlichen Maßstäben.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sein kann, dass »Ja« und »Nein« bei ihm widersprüchlich nebeneinanderstehen oder dass sein Wort unbeständig ist.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: beabsichtigte
  rationale: Das Partizip nimmt auf die zuvor erwähnte Reiseabsicht zurück. »Beabsichtigte« ist natürliches Deutsch und wahrt den Willens- und Planungsaspekt.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: war ich da etwa leichtfertig?
  rationale: Die griechische Verbindung bezeichnet ein von Leichtfertigkeit oder Unbeständigkeit geprägtes Handeln. Die rhetorische Frage wird im Deutschen idiomatisch wiedergegeben.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: fasse ich meine Pläne
  rationale: Die deutsche Wendung gibt das planende Abwägen wieder. Die griechische Wiederholung lässt sich nicht vollständig bewahren, ohne schwerfällig zu klingen.
- source_word: κατὰ σάρκα
  choice: nach dem Fleisch
  rationale: Die paulinische Ausdrucksweise bleibt im Haupttext sichtbar; eine mögliche sinngemäße Deutung wird in der Fußnote erläutert.
- source_word: παρ’ ἐμοὶ
  choice: bei mir
  rationale: »Bei mir« bildet die personale Zuordnung knapp und natürlich ab, ohne sie auf Herkunft oder bloße Redeweise festzulegen.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: zugleich »Ja, ja« und »Nein, nein«
  rationale: Die Wiederholungen des griechischen Textes bleiben erhalten. »Zugleich« verdeutlicht in diesem rhetorischen Zusammenhang die widersprüchliche Verbindlichkeit, ohne den Wortlaut zu ersetzen.
theological_decisions:
- issue: Bedeutung von κατὰ σάρκα
  choice: nach dem Fleisch
  alternative: nach rein menschlichen Maßstäben / auf weltliche Weise
  rationale: »Fleisch« ist bei Paulus ein bedeutungsvoller und kontextabhängiger Begriff. Die formnahe Wiedergabe wahrt diese theologische Spannung; die Fußnote bietet eine verständliche Deutungsmöglichkeit.
- issue: Verhältnis von »Ja« und »Nein«
  choice: zugleich »Ja, ja« und »Nein, nein«
  alternative: sodass bei mir einmal »Ja, ja« und dann wieder »Nein, nein« gilt
  rationale: Der Vers kann den Vorwurf widersprüchlicher oder unbeständiger Planung aufgreifen. Der Haupttext lässt die prägnante Formulierung stehen und legt nicht unnötig fest, ob Gleichzeitigkeit oder wechselnde Unzuverlässigkeit im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und die markante paulinische Wendung »nach dem Fleisch« bleiben erhalten; schwerfällige griechische Wiederholungen werden nur dort geglättet, wo natürliches Deutsch es erfordert.
