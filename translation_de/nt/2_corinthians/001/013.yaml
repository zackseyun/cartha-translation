  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: de
  text: Denn wir schreiben euch nichts anderes als das, was ihr lest oder auch versteht. Ich hoffe aber, dass ihr es bis zum Ende verstehen werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ihr es vollständig verstehen werdet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: etwas anderes
  rationale: Das substantivierte Neutrum Plural wird im Deutschen nach dem verneinten Schreibverb idiomatisch mit „etwas anderes“ wiedergegeben und wahrt die Aussage, dass keine abweichende Botschaft verborgen ist.
- source_word: ἀναγινώσκετε
  choice: ihr lest
  rationale: Der einfache Präsens entspricht dem griechischen Präsens und gibt den gewöhnlichen Sinn des Lesens klar wieder.
- source_word: ἢ καὶ
  choice: oder auch
  rationale: Die Wiedergabe erhält das ausdrücklich vorhandene ἢ („oder“) und lässt die mögliche Steigerung durch καί bestehen, statt die Konstruktion stillschweigend in ein bloßes „und“ umzudeuten.
- source_word: ἐπιγινώσκετε / ἐπιγνώσεσθε
  choice: versteht / verstehen werdet
  rationale: Im Zusammenhang bezeichnet das Verb das Erfassen dessen, was im Brief gelesen wird. Die gleiche deutsche Wortwurzel bewahrt die Wiederaufnahme des Verbs im Futur.
- source_word: ἕως τέλους
  choice: bis zum Ende
  rationale: Die wörtlich-naheliegende zeitliche Formulierung bleibt im Haupttext erhalten; eine mögliche resultative Bedeutung im Sinn vollständigen Verstehens wird in der Fußnote genannt.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: Denn ... nichts anderes als
  rationale: Diese natürliche deutsche Korrelativkonstruktion bildet die ausschließende Aussage des Griechischen präzise ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „oder auch“ bewahrt die syntaktische Spannung des griechischen ἢ καὶ; die Wiederholung von „verstehen“ macht die lexikalische Verbindung zwischen Präsens und Futur sichtbar.
