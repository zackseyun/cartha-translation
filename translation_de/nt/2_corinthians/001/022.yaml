  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: de
  text: der uns auch versiegelt und die Anzahlung des Geistes[a] in unseren Herzen gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Unterpfand oder Garantie des Geistes. Gemeint ist eine erste Zahlung, die das noch Ausstehende verbürgt.'
    reason: Lexikalische Alternativen und knappe Erläuterung der kaufmännischen Metapher von ἀρραβών; die Genitivverbindung bleibt im Haupttext offen.
lexical_decisions:
- source_word: σφραγισάμενος
  choice: versiegelt
  rationale: Bewahrt das Bild des Versiegelns als Kennzeichnung, Beglaubigung oder Sicherung, ohne es im Haupttext auszudeuten.
- source_word: δοὺς
  choice: gegeben hat
  rationale: Das Aoristpartizip wird parallel zu σφραγισάμενος in eine natürliche deutsche Verbfügung überführt.
- source_word: ἀρραβῶνα
  choice: Anzahlung
  rationale: Der Ausdruck bezeichnet eine erste Zahlung, die den noch ausstehenden Rest verbürgt. „Anzahlung“ bewahrt das konkrete wirtschaftliche Bild in verständlichem modernem Deutsch.
- source_word: τοῦ πνεύματος
  choice: des Geistes
  rationale: Die knappe Genitivverbindung bleibt erhalten und wird nicht einseitig dahin aufgelöst, ob der Geist selbst die Anzahlung ist oder sie vermittelt.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: in unsere Herzen
  rationale: Im Deutschen ist bei „geben“ die Richtungsangabe idiomatisch; der Plural des griechischen Textes bleibt erhalten.
- source_word: ὁ καὶ ... καὶ
  choice: der uns auch ... und
  rationale: Das substantivierte Partizip wird als Relativsatz wiedergegeben, der natürlich an den vorangehenden Bezug auf Gott anschließt.
theological_decisions:
- issue: Bedeutung des Geistes als ἀρραβών
  choice: Anzahlung des Geistes
  alternative: Unterpfand des Geistes; Garantie des Geistes
  rationale: Die konkrete kaufmännische Metapher bleibt erhalten. Zugleich wird die kompakte Genitivform nicht dogmatisch vereindeutigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Anzahlung“ ist allgemein verständlich und weniger altertümlich als „Angeld“; die Satzform wahrt den Anschluss an den vorhergehenden Vers.
