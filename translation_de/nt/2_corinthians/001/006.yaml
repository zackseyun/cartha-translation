source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: de
  text: Wenn wir aber bedrängt werden, geschieht es zu eurem Trost und Heil; oder wenn wir getröstet werden, geschieht es zu eurem Trost[a][b], der im standhaften Ertragen derselben Leiden wirksam ist, die auch wir erleiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen die Worte „oder wenn wir getröstet werden, geschieht es zu eurem Trost“ aus.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Ermutigung“ statt „Trost“; entsprechend „ermutigt werden“ statt „getröstet werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: wir bedrängt werden
  rationale: Das Präsens Passiv bezeichnet fortdauernden Druck oder Bedrängnis. „Bedrängt werden“ ist gegenwärtiges, verständliches Deutsch und wahrt die Passivform.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: Trost / getröstet werden
  rationale: Im unmittelbaren Zusammenhang umfasst die Wortgruppe sowohl tröstenden Zuspruch als auch Stärkung. Die einheitliche Wiedergabe mit „Trost“ und „getröstet“ erhält die auffällige Wiederholung.
- source_word: σωτηρίας
  choice: Heil
  rationale: „Heil“ gibt σωτηρία in seinem breiten rettenden Sinn wieder und passt in würdigem modernem Bibeldeutsch natürlich zur Verbindung „Trost und Heil“.
- source_word: τῆς ἐνεργουμένης
  choice: der sich … auswirkt
  rationale: Die mediale Partizipialform bezeichnet wirksames Tätigsein. „Sich auswirken“ vermittelt diese Wirksamkeit idiomatisch, ohne die Ursache oder den Handelnden näher festzulegen.
- source_word: ἐν ὑπομονῇ
  choice: im standhaften Ertragen
  rationale: ὑπομονή bezeichnet beharrliche Ausdauer unter Belastung. Die Wendung verbindet diese Ausdauer natürlich mit den folgenden Leiden.
- source_word: τῶν αὐτῶν παθημάτων
  choice: derselben Leiden
  rationale: Die Formulierung wahrt die Identität beziehungsweise Gemeinsamkeit der Leiden von Paulus und den Adressaten.
- source_word: ὑπὲρ
  choice: zu
  rationale: In „zu eurem Trost und Heil“ bezeichnet „zu“ idiomatisch die auf die Korinther gerichtete förderliche Wirkung von ὑπέρ.
theological_decisions:
- issue: Bezug und Wirkungsweise des Trostes
  choice: „der sich im standhaften Ertragen … auswirkt“
  alternative: „der durch das standhafte Ertragen … wirksam ist“
  rationale: Die gewählte Form wahrt die Aussage, dass der Trost im Ausharren unter Leiden wirksam wird, ohne eine über den griechischen Wortlaut hinausgehende dogmatische Erklärung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch „geschieht es“ und „sich auswirkt“ idiomatisch gestaltet. Die Wiederholung von „Trost“ ist bewusst erhalten.
