id: 2CO.1.2
reference: 2 Corinthians 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: de
  text: Gnade und Friede seien mit euch von Gott, unserem Vater, und dem Herrn[b] Jesus, dem Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Jesus Christus“.'
    reason: lexical_alternative
  - marker: b
    text: „Herr“ kann in manchen Zusammenhängen auch mit „Gebieter“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ bewahrt sowohl den Charakter des paulinischen Grußes als auch das theologische Gewicht des Begriffs.
- source_word: ὑμῖν
  choice: seien mit euch
  rationale: Der griechische Dativ wird in der deutschen Grußformel natürlich und verständlich mit „seien mit euch“ wiedergegeben.
- source_word: εἰρήνη
  choice: Friede
  rationale: „Friede“ ist die etablierte biblische Wiedergabe und bewahrt die jüdischen und gesamtbiblischen Anklänge.
- source_word: ἀπὸ
  choice: von
  rationale: Die Präposition bezeichnet hier die Quelle von Gnade und Frieden; „von“ gibt dies knapp und eindeutig wieder.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Gott, unserem Vater
  rationale: Die Apposition macht im Deutschen klar, dass Gott als unser Vater bezeichnet wird, ohne die Beziehung umzudeuten.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist in diesem christologischen Gruß die natürliche und theologisch offene Standardwiedergabe von κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: „Messias“ übersetzt die titelbezogene Bedeutung von Χριστός; die Apposition ist im Deutschen idiomatischer als die bloße Folge „Jesus Messias“.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ im paulinischen Gruß
  choice: Messias
  alternative: Christus
  rationale: Die Übersetzung als „Messias“ macht die Bedeutung des griechischen Titels sichtbar. Die traditionelle Form „Christus“ bleibt in einer Fußnote als berechtigte Alternative genannt.
- issue: Christologische Wiedergabe von κυρίου
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ entspricht dem gehobenen biblischen Sprachgebrauch und lässt die christologische Tragweite des Titels bestehen, ohne sie erklärend festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ergänzte Verbform „seien mit euch“ macht die knappe griechische Grußformel im Deutschen natürlich verständlich. Die Wiederholung des bestimmten Artikels in „dem Herrn Jesus, dem Messias“ verdeutlicht die appositionelle Funktion von „Messias“.
