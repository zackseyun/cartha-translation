  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: de
  text: und über euch nach Mazedonien weiterzureisen, dann wieder von Mazedonien zu euch zu kommen und von euch nach Judäa weitergeleitet zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und von euch auf dem Weg nach Judäa unterstützt zu werden.“'
    reason: 'Lexikalische Alternative: προπέμπω kann im Reisekontext das Geleit und praktische Unterstützung für die Weiterreise einschließen.'
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: über euch
  rationale: διά mit Genitiv bezeichnet hier den Reiseweg über die Korinther; „über euch“ ist im Deutschen eine natürliche Routenangabe.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: nach Mazedonien weiterzureisen
  rationale: Das Verb bezeichnet ein Hindurch- oder Weiterreisen. Zusammen mit dem Reiseziel gibt „weiterzureisen“ den Reiseverlauf natürlich wieder, ohne einen bloßen Durchzug durch Mazedonien zu behaupten.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: dann wieder von Mazedonien zu euch zu kommen
  rationale: „wieder“ bewahrt die ausdrückliche Wiederholung; „dann“ macht die Abfolge verständlich. Ein zusätzliches „zurück“ wird vermieden, da es im Griechischen nicht ausdrücklich steht.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: mich von euch … weitergeleiten zu lassen
  rationale: Die Passivkonstruktion und die Handlung der Korinther bleiben erhalten. „weitergeleiten“ umfasst im antiken Reisekontext Begleitung und Unterstützung besser als das im Deutschen missverständliche „weiterschicken“.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: nach Judäa
  rationale: „nach“ ist bei einem Ländernamen die natürliche deutsche Wiedergabe des Reiseziels.
