review_pass:
  verdict: revise
  source_fidelity: 'Die Abfolge der geplanten Reise ist zutreffend wiedergegeben: über die Korinther nach Mazedonien, von dort erneut zu ihnen und anschließend nach Judäa. „Über euch“ kann hier, wie griechisch δι’ ὑμῶν, den Reiseweg über den Ort bzw. die Gemeinde der Adressaten bezeichnen. Die bisherige Formulierung „mich ... weitergeleiten zu lassen“ gibt das griechische Passiv jedoch unnötig als reflexive Lassen-Konstruktion wieder.'
  naturalness: Der Satz ist insgesamt gut verständlich und angemessen als Fortsetzung eines vorherigen Satzes. „Von euch ... weitergeleitet zu werden“ ist idiomatischer und bildet die passive Infinitivkonstruktion des Ausgangstextes unmittelbarer ab. Die Fußnote sollte die im Reisekontext naheliegende Unterstützung als Alternative nennen, ohne die Bedeutung auf bloße materielle Ausstattung einzuengen.
  terminology: „Mazedonien“ und „Judäa“ sind die passenden historischen geografischen Namen. „Weitergeleitet“ ist im heutigen Deutsch etwas technisch, bleibt mit dem Ziel „nach Judäa“ aber verständlich und wahrt die offene Bedeutung von προπεμφθῆναι; die Fußnote erläutert die mögliche Reiseunterstützung.
  issues:
  - severity: medium
    issue: „mich von euch nach Judäa weitergeleiten zu lassen“
    rationale: Die Formulierung verschiebt das passive προπεμφθῆναι („weitergeleitet/auf den Weg gesandt zu werden“) in eine reflexive Lassen-Konstruktion. Eine direkte Passivform ist quellennäher und stilistisch klarer.
  - severity: low
    issue: Fußnote beschränkt die Alternative auf „ausstatten“
    rationale: προπέμπω kann im Reisekontext materielle Versorgung einschließen, bezeichnet aber weitergehend das Geleit bzw. die Unterstützung für die Weiterreise. Die Alternative sollte diese Breite bewahren.
