id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: de
  text: der uns in all unserer Bedrängnis tröstet, damit wir die trösten können, die in irgendeiner Bedrängnis sind – durch den Trost, mit dem wir selbst von Gott getröstet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ermutigt … ermutigen … Ermutigung … ermutigt werden“. Im Griechischen wird im ganzen Vers dieselbe Wortfamilie verwendet; sie kann sowohl stärkenden Trost als auch Ermutigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: tröstet / trösten / Trost / getröstet werden
  rationale: Im Zusammenhang mit θλῖψις bezeichnet die Wortfamilie stärkenden Trost. Die konsequente Wiedergabe mit derselben deutschen Wortfamilie bewahrt die auffällige Wiederholung des Griechischen.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: in all unserer Bedrängnis
  rationale: „Bedrängnis“ gibt Druck, Not und Leiden gewichtig, aber in modernem Deutsch wieder; „in“ ist hier die natürliche idiomatische Entsprechung.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: damit wir … können
  rationale: Die Formulierung gibt den Zweck beziehungsweise die Folge natürlich wieder, ohne die im Griechischen mögliche Nuance zwischen beiden unnötig festzulegen.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: die in irgendeiner Bedrängnis sind
  rationale: 'Das zweite πάσῃ hat hier einen allgemein-distributiven Sinn: Menschen in jeder beliebigen Art von Bedrängnis.'
- source_word: αὐτοὶ
  choice: wir selbst
  rationale: Die Wiedergabe erhält die ausdrückliche Betonung des Pronomens.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: Bei der Passivform bezeichnet ὑπό den Handelnden; „von Gott“ ist dafür die natürliche deutsche Formulierung.
theological_decisions:
- issue: Bedeutungsumfang von παρακαλέω / παράκλησις
  choice: trösten / Trost
  alternative: ermutigen / Ermutigung; beistehen / Beistand
  rationale: In Verbindung mit Bedrängnis steht stärkender Trost im Vordergrund. Zugleich kann die griechische Wortfamilie auch Ermutigung und Beistand einschließen; diese Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wortfamilie „trösten/Trost“ bildet die griechische Wiederholung ab. Der Gedankenstrich gliedert den langen Satz, ohne seine syntaktische und theologische Einheit aufzulösen.
