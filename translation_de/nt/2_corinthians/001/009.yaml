source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: de
  text: Aber wir selbst hatten in uns das Todesurteil[a], damit wir nicht auf uns selbst vertrauten, sondern auf Gott, der die Toten auferweckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Entscheidung, dass wir sterben müssten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ja
  rationale: Hier verstärkt ἀλλά die vorherige Aussage und führt zugleich ihre zugespitzte Bestätigung ein. „Ja“ gibt diese emphatische Fortführung im Deutschen natürlicher wieder als ein bloßes „aber“.
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: wir selbst … in uns
  rationale: Die Wiedergabe erhält sowohl die ausdrückliche Betonung durch αὐτοί als auch den inneren, persönlichen Bezug von ἐν ἑαυτοῖς, ohne die Formulierung unnötig zu glätten.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: das Todesurteil
  rationale: ἀπόκριμα bezeichnet hier am ehesten eine feststehende Entscheidung oder einen Bescheid. „Todesurteil“ ist prägnant und bringt zum Ausdruck, dass der Tod für Paulus und seine Begleiter als entschieden erschien.
- source_word: ἐσχήκαμεν
  choice: hatten
  rationale: Das schlichte „hatten“ entspricht dem Verb ἔχω enger als „hatten empfangen“. Der deutsche Vergangenheitskontext vermittelt den erreichten, feststehenden Zustand, ohne ein im Griechischen nicht ausdrücklich genanntes Empfangen einzutragen.
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: damit wir nicht … vertrauten
  rationale: Die Konstruktion bezeichnet den Zweck beziehungsweise das Ergebnis, nicht auf sich selbst zu bauen. „Vertrauen auf“ ist im modernen Deutschen natürlich und bildet den anschließenden Gegensatz zu Gott klar ab.
- source_word: ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: auf uns selbst … sondern auf Gott
  rationale: Die parallele Präposition und der scharfe Gegensatz zwischen Selbstvertrauen und Vertrauen auf Gott bleiben deutlich erhalten.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: der die Toten auferweckt
  rationale: Die Formulierung bezeichnet Gott durch seine lebensschaffende Macht. „Die Toten auferweckt“ ist direkt, verständlich und bewahrt den Auferstehungsbezug.
theological_decisions:
- issue: Wiedergabe von τοὺς νεκρούς
  choice: die Toten
  alternative: tote Menschen
  rationale: Beides ist sprachlich möglich. „Die Toten“ ist genau, idiomatisch und bewahrt die biblische Aussage über Gottes Auferweckungsmacht, ohne sie auszuweiten.
- issue: Verhältnis von menschlicher Todesgewissheit und Gottes Auferweckungsmacht
  choice: Die Formulierung „Todesurteil“ bleibt stehen und wird unmittelbar dem Vertrauen auf den auferweckenden Gott gegenübergestellt.
  alternative: Die Todesgefahr als bloß subjektives Gefühl abschwächen
  rationale: Der griechische Text hält die als feststehend erfahrene Todesaussicht und Gottes Macht über den Tod in Spannung. Die Übersetzung löst diese Spannung nicht durch eine psychologisierende Abschwächung auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gegensatz, während „Ja“ und „Todesurteil“ eine natürliche und verständliche deutsche Formulierung ergeben.
