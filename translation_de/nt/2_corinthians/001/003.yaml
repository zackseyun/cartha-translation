  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: de
  text: Gepriesen sei Gott, der Vater unseres Herrn Jesus, des Messias[a], der Vater des Erbarmens[c] und Gott allen Trostes[d].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Gebieters“ für „Herrn“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „der Erbarmungen“; auch: „des Mitgefühls“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „jeglichen Zuspruchs“ beziehungsweise „aller Ermutigung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Gepriesen sei
  rationale: Gibt die prädikative doxologische Formel idiomatisch und würdevoll wieder, ohne sie in einen bloßen Imperativ umzudeuten.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: der Gott und Vater
  rationale: Der gemeinsame Artikel verbindet beide Bezeichnungen auf einen Referenten; die deutsche Form bewahrt diese enge Einheit.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist im neutestamentlichen christologischen Sprachgebrauch die natürliche und etablierte Wiedergabe von κύριος.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Die Wiedergabe als Titel macht die Bedeutung „Gesalbter/Messias“ sichtbar; die Apposition im Genitiv ist im Deutschen grammatisch eindeutig.
- source_word: οἰκτιρμῶν
  choice: des Erbarmens
  rationale: Das natürliche deutsche Abstraktum bezeichnet Gottes vielfältiges Erbarmen; die griechische Pluralform und ihre mögliche konkretere Nuance werden in der Fußnote offengelegt.
- source_word: παρακλήσεως
  choice: Trostes
  rationale: Im Zusammenhang von Bedrängnis und göttlicher Hilfe ist „Trost“ die natürlichste Wiedergabe; „Zuspruch“ und „Ermutigung“ gehören ebenfalls zum Bedeutungsumfang.
theological_decisions:
- issue: Wiedergabe des christologischen Titels Χριστός in Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  alternative: Jesus Christus
  rationale: Die Hauptfassung erhält den Titelcharakter und damit den Bedeutungsgehalt von Χριστός. Die traditionelle Namensform bleibt als vertretbare Alternative in der Fußnote erhalten.
- issue: Genitivkonstruktion πατὴρ τῶν οἰκτιρμῶν
  choice: Vater des Erbarmens
  alternative: Vater der Erbarmungen
  rationale: Die idiomatische deutsche Fassung lässt die Beziehung als Ursprung und Wesenskennzeichnung bewusst offen, statt sie durch „voller“ oder „Quelle“ auszudeuten; die formnähere Pluralfassung wird vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit doxologischem Klang. „Gepriesen sei“ und „Gott allen Trostes“ sind gehoben, aber allgemein verständlich. Die ungewöhnlichere griechische Pluralform bei οἰκτιρμῶν wird zugunsten eines natürlichen Haupttextes in einer Fußnote bewahrt.
