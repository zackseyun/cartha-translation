  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: de
  text: 'Das aber gilt: Wer sparsam sät, wird auch sparsam ernten; und wer reichlich sät, wird auch reichlich ernten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „auf/in Segnungen“. Das griechische Wort kann „Segen“ bedeuten und bezeichnet in diesem Zusammenhang idiomatisch ein reichliches oder großzügiges Maß.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Das aber gilt:'
  rationale: Τοῦτο weist pointiert auf den folgenden Grundsatz, während δέ den Gedankengang weiterführt oder leicht absetzt. „Das aber gilt“ ist im Deutschen natürlich und gibt die einleitende Funktion ohne ein nicht vorhandenes Zeitadverb wieder.
- source_word: ὁ σπείρων
  choice: Wer … sät
  rationale: Das substantivierte Partizip ist allgemein und sprichwörtlich gebraucht. Die deutsche Konstruktion mit „wer“ bildet diesen generischen Sinn idiomatisch ab.
- source_word: φειδομένως
  choice: sparsam
  rationale: Das Adverb bezeichnet hier ein begrenztes, knappes Maß. „Sparsam“ bewahrt den Maßaspekt, ohne die stärkere moralische Wertung von „geizig“ einzutragen.
- source_word: καὶ θερίσει
  choice: wird auch … ernten
  rationale: Das καί stellt die entsprechende Folge zum Säen heraus; „auch“ erhält diese Zuordnung und den Parallelismus.
- source_word: ἐπ’ εὐλογίαις
  choice: zum Segen
  rationale: Die Präpositionalphrase mit dem Substantiv εὐλογία ist idiomatisch und kann ein reichliches beziehungsweise großzügiges Maß bezeichnen. „Zum Segen“ bewahrt jedoch die ausdrückliche Segenssprache und ergibt zugleich eine verständliche deutsche Wendung.
- source_word: ἐπ’ εὐλογίαις … ἐπ’ εὐλογίαις
  choice: zum Segen … zum Segen
  rationale: Die identische Wiedergabe erhält die bewusste Wiederholung und die Entsprechung zwischen Säen und Ernten.
theological_decisions:
- issue: Bedeutung von εὐλογίαις im Bild von Säen und Ernten
  choice: Die Segenssprache wird mit „zum Segen“ im Haupttext erhalten.
  alternative: „reichlich“ oder „großzügig“
  rationale: Im Kontext großzügigen Gebens ist eine adverbiale Bedeutung wie „reichlich“ gut möglich. Das griechische Substantiv bezeichnet aber wörtlich „Segen“ und lässt eine theologisch gewichtete Mehrdeutigkeit bestehen. Die Wiedergabe behauptet keine mechanische Garantie materiellen Wohlstands.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlichem Rhythmus. Der wiederholte Ausdruck „zum Segen“ bewahrt die auffällige Segenssprache des Griechischen; die Fußnote nennt die geläufige idiomatische Deutung.
