source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: de
  text: Durch die Bewährung dieses Dienstes verherrlichen sie Gott für eure Unterordnung in eurem Bekenntnis zur guten Botschaft vom Messias[a] und für eure großzügige Beteiligung zugunsten von ihnen und allen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „für die Unterordnung eures Bekenntnisses zur guten Botschaft vom Messias“. Die griechische Genitivverbindung ist knapper und lässt das genaue Verhältnis von Unterordnung und Bekenntnis offen.'
    reason: Die natürlichere deutsche Wiedergabe macht einen möglichen Zusammenhang sichtbar, ohne die wörtliche, mehrdeutigere Konstruktion zu verbergen.
  - marker: b
    text: „Beteiligung“ gibt hier κοινωνία wieder und meint im Zusammenhang besonders großzügige materielle Beteiligung an der Sammlung zugunsten anderer, nicht nur Gemeinschaft im allgemeinen Sinn.
    reason: Der Kontext präzisiert die hier gemeinte konkrete und auf andere gerichtete Dimension von κοινωνία.
lexical_decisions:
- source_word: δοκιμῆς
  choice: Bewährung
  rationale: Das Wort bezeichnet hier das durch Erprobung sichtbar gewordene Echtheitszeugnis. „Bewährung“ bewahrt sowohl den Gedanken der Prüfung als auch den ihres positiven Ergebnisses.
- source_word: διακονίας
  choice: Dienstes
  rationale: Gemeint ist der praktische Hilfsdienst der Sammlung; „Dienst“ ist im Deutschen natürlich und lässt zugleich seine geistliche Bedeutung erkennen.
- source_word: δοξάζοντες τὸν θεὸν
  choice: preisen sie Gott
  rationale: Das Partizip wird zur Klarheit als finites Verb wiedergegeben. „Gott preisen“ ist im Deutschen die natürliche Wiedergabe des hier gemeinten öffentlichen Verherrlichens Gottes.
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: dass ihr euch mit eurem Bekenntnis … unterordnet
  rationale: Die verbale Formulierung vermeidet das unnatürliche „Unterordnung eures Bekenntnisses“, hält aber die enge Verbindung von Unterordnung und Bekenntnis aufrecht.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: der guten Botschaft vom Messias
  rationale: „Gute Botschaft“ gibt εὐαγγέλιον verständlich wieder; Χριστός wird als Titel mit „Messias“ übersetzt. Die Präposition εἰς wird im Deutschen durch den Dativ bei „sich unterordnen“ ausgedrückt.
- source_word: ἁπλότητι
  choice: Großzügigkeit
  rationale: Im Zusammenhang der Geldsammlung bezeichnet ἁπλότης offene, uneigennützige Freigebigkeit, nicht bloß Einfachheit oder Aufrichtigkeit.
- source_word: κοινωνίας
  choice: teilt
  rationale: Hier geht es um konkrete materielle Beteiligung. Das Verb „teilen“ klingt natürlich und erhält zugleich den weiteren Gedanken gemeinschaftlicher Teilhabe.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: mit ihnen und mit allen
  rationale: In Verbindung mit „teilen“ ist „mit“ die idiomatische deutsche Wiedergabe; „alle“ bewahrt die Weite der Aussage.
theological_decisions:
- issue: Bedeutung von Χριστοῦ
  choice: vom Messias
  alternative: von Christus
  rationale: Χριστός trägt hier weiterhin den Sinn eines Titels. „Messias“ macht diese Bedeutung sichtbar, ohne zusätzliche Lehrinhalte einzutragen.
- issue: Verhältnis von ὑποταγή und ὁμολογία
  choice: dass ihr euch mit eurem Bekenntnis … unterordnet
  alternative: für die Unterordnung eures Bekenntnisses unter die gute Botschaft
  rationale: Der Genitiv lässt das genaue Verhältnis sprachlich knapp und etwas offen. Die gewählte Fassung versteht das Bekenntnis als den Zusammenhang, in dem sich die Unterordnung zeigt, und vermeidet, dem Bekenntnis selbst menschliches Handeln zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satzbau wird weitgehend erhalten, aber idiomatisch geglättet. „Messias“ bewahrt den Titelcharakter von Χριστός; die Fußnoten kennzeichnen echte sprachliche Mehrdeutigkeit und den konkreten Sammlungskontext.
