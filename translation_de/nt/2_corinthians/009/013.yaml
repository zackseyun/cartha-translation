  terminology: „Gute Botschaft vom Messias“ bewahrt den Titelcharakter von Χριστός und ist sprachlich vertretbar. „Verherrlichen“ entspricht δοξάζειν etwas genauer als „preisen“, ohne den Registerton zu verändern. Die Fußnote zur materiellen Dimension von κοινωνία bleibt sachgerecht.
