revisions:
- from: Aufgrund der Bewährung dieses Dienstes preisen sie Gott dafür, dass ihr euch mit eurem Bekenntnis der guten Botschaft vom Messias unterordnet,[a] und für die Großzügigkeit, mit der ihr mit ihnen und mit allen teilt.[b]
  to: Durch die Bewährung dieses Dienstes verherrlichen sie Gott für eure Unterordnung in eurem Bekenntnis zur guten Botschaft vom Messias[a] und für eure großzügige Beteiligung zugunsten von ihnen und allen.[b]
  rationale: Die Revision bewahrt den vom griechischen Text gesetzten Bezug der großzügigen κοινωνία auf die Empfänger („sie und alle“) und reduziert zugleich die interpretierende Festlegung in der Verbindung von Unterordnung und Bekenntnis. Sie hält den modernen, würdevollen Registerton sowie die Übersetzung von Χριστός als „Messias“ bei.
