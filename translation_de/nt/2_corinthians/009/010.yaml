base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: de
  text: Derjenige aber, der dem Sämann Saatgut und Brot zur Nahrung bereitstellt, wird auch euer Saatgut bereitstellen und vermehren und die Erträge eurer Gerechtigkeit wachsen lassen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Früchte“ beziehungsweise „die Erzeugnisse eurer Gerechtigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Ernte eurer Gerechtigkeit“. Das griechische Wort δικαιοσύνη kann je nach Kontext auch Gerechtigkeit im Sinn von Recht und Gerechtigkeit bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἐπιχορηγῶν
  choice: Der aber, der … gibt
  rationale: Der substantivierte Partizipialausdruck bezeichnet den, der versorgt. „Gibt“ ist im Deutschen natürlich und bewahrt den Versorgungsgedanken; „aber“ gibt das schwach weiterführende δέ wieder, ohne einen nicht vorhandenen Zeitbegriff wie „nun“ einzuführen.
- source_word: σπόρον τῷ σπείροντι
  choice: dem Sämann Saatgut
  rationale: „Saatgut“ bezeichnet klar das zum Säen bestimmte Korn und erhält das landwirtschaftliche Bild; der substantivierte Partizip τῷ σπείροντι wird knapp mit „dem Sämann“ wiedergegeben.
- source_word: ἄρτον εἰς βρῶσιν
  choice: Brot zur Nahrung
  rationale: Die Formulierung gibt die Zweckbestimmung wieder und erhält den Gegensatz zwischen Saatgut zum Säen und Brot zum Verzehr.
- source_word: χορηγήσει καὶ πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: wird auch euer Saatgut geben und vermehren
  rationale: Die beiden Futurformen werden als göttliches zukünftiges Handeln wiedergegeben. „Vermehren“ bewahrt das Bild der sich vervielfachenden Saat.
- source_word: αὐξήσει τὰ γενήματα
  choice: die Erträge … wachsen lassen
  rationale: γενήματα bezeichnet Erzeugnisse bzw. Erträge; „wachsen lassen“ bildet das Wachstumsverb αὐξήσει anschaulich ab und passt zum landwirtschaftlichen Bild.
- source_word: δικαιοσύνης ὑμῶν
  choice: eurer Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die breite paulinische Bedeutung und legt den Ausdruck weder ausschließlich auf materiellen Gewinn noch ausschließlich auf einen bestimmten theologischen Status fest.
theological_decisions:
- issue: Bedeutung der „Erträge eurer Gerechtigkeit“
  choice: Bild für die Wirkungen und Früchte gerechter, großzügiger Lebensführung, ohne diese auf materiellen Lohn oder einen bestimmten Heilsstatus zu verengen
  alternative: materieller Segen infolge der Freigebigkeit; Früchte gerechten Handelns bzw. gelebter Gerechtigkeit
  rationale: Der Kontext behandelt großzügiges Geben und verwendet ein landwirtschaftliches Bild. Die offene Formulierung erhält sowohl den ethischen als auch den theologischen Bedeutungsraum.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die landwirtschaftliche Bildsprache bleibt erhalten. Die leicht markierte Anfangsstellung „Der aber, der …“ gibt δέ wieder, ohne ein zeitliches „nun“ hinzuzufügen.
