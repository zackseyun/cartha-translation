source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: de
  text: 'Denn ich kenne eure Bereitwilligkeit[a], deren ich mich bei den Mazedoniern rühme: Achaja ist seit dem vergangenen Jahr bereit[b], und euer Eifer hat die meisten von ihnen[c] angespornt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eure willige Bereitschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Die römische Provinz Achaja, zu der Korinth gehörte; der Name der Region steht hier für die dortigen Gläubigen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: die Mehrheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: Bereitwilligkeit
  rationale: Das Wort bezeichnet eine willige innere Bereitschaft und zugleich Eifer. „Bereitwilligkeit“ ist im Deutschen natürlich und vermeidet eine rein organisatorische Bedeutung.
- source_word: καυχῶμαι
  choice: ich rühme mich
  rationale: Die kräftige rhetorische Aussage des griechischen Verbs bleibt erhalten und wird nicht zu bloßem Lob oder Stolz abgeschwächt.
- source_word: ὑπὲρ ὑμῶν
  choice: euretwegen
  rationale: Im Zusammenhang mit καυχῶμαι bezeichnet die Wendung, dass Paulus sich zugunsten der Korinther beziehungsweise im Blick auf sie rühmt.
- source_word: Μακεδόσιν
  choice: bei den Mazedoniern
  rationale: Der Dativ bezeichnet die Menschen in Mazedonien, denen gegenüber Paulus sich rühmt; „bei“ ist hierfür idiomatisches Deutsch.
- source_word: Ἀχαΐα
  choice: Achaja
  rationale: Der ausdrücklich genannte Provinzname bleibt erhalten und steht im Zusammenhang stellvertretend für die dortigen Gemeinden, insbesondere Korinth.
- source_word: παρεσκεύασται
  choice: ist bereit
  rationale: Das Perfekt bezeichnet den fortbestehenden Zustand als Ergebnis vorausgegangener Vorbereitung. Zusammen mit „seit“ gibt „ist bereit“ diesen Zustand natürlich wieder.
- source_word: ἀπὸ πέρυσι
  choice: seit dem vergangenen Jahr
  rationale: Die Wendung beschreibt eine vom Vorjahr bis in die Gegenwart andauernde Zeitspanne.
- source_word: τὸ ὑμῶν ζῆλος
  choice: euer Eifer
  rationale: „Eifer“ bewahrt die Stärke und positive Bedeutung des Ausdrucks in diesem Zusammenhang.
- source_word: ἠρέθισε
  choice: hat … angespornt
  rationale: Das Verb bedeutet anregen oder reizen. Im positiven Zusammenhang bezeichnet „anspornen“ die motivierende Wirkung ohne unnötig negative Nebenbedeutung.
- source_word: τοὺς πλείονας
  choice: die meisten von ihnen
  rationale: Der Ausdruck meint die Mehrheit; „von ihnen“ macht den im Kontext gegebenen Bezug auf die Mazedonier verständlich.
theological_decisions:
- issue: Bezug von „Achaja“
  choice: Der geografische Name „Achaja“ bleibt stehen und bezeichnet metonymisch die dortigen Gläubigen beziehungsweise Gemeinden.
  alternative: „Ihr seid seit dem vergangenen Jahr bereit“ oder „Die Gläubigen in Achaja sind seit dem vergangenen Jahr bereit“.
  rationale: Der griechische Text nennt ausdrücklich Achaja. Die Beibehaltung wahrt sowohl den Wortlaut als auch die möglicherweise über Korinth hinausreichende regionale Aussage.
- issue: Stärke von Paulus’ Rühmen
  choice: καυχῶμαι wird ausdrücklich mit „ich rühme mich“ wiedergegeben.
  alternative: „ich spreche mit Stolz davon“ oder „ich lobe euch“.
  rationale: Die markante Selbstaussage des Paulus soll nicht abgeschwächt werden; der Gegenstand und die zugunsten der Adressaten gerichtete Funktion werden im Satz deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bereitwilligkeit“, „sich rühmen“ und „Eifer“ bewahren den rhetorischen Nachdruck, ohne altertümlich zu wirken. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
