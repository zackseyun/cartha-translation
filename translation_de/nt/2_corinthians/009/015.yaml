  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: de
  text: Gott sei Dank für seine unbeschreibliche Gabe[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unaussprechliche Gabe“. Das griechische Adjektiv bezeichnet etwas, das sich nicht vollständig beschreiben oder erzählen lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Dank sei
  rationale: In der Ausrufformel mit dem Dativ τῷ θεῷ bezeichnet χάρις hier Dank bzw. Lobpreis, nicht die dem Menschen erwiesene Gnade. Die deutsche Wendung „Gott sei Dank“ gibt den doxologischen Charakter natürlich wieder.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet den Empfänger des Dankes und ist in die feste deutsche Wendung „Gott sei Dank“ eingebunden.
- source_word: ἐπὶ
  choice: für
  rationale: ἐπί mit Dativ gibt hier den Grund oder Anlass des Dankes an. „Für“ ist im Deutschen knapp und idiomatisch.
- source_word: ἀνεκδιηγήτῳ
  choice: unbeschreibliche
  rationale: Das Adjektiv bezeichnet etwas, das sich nicht vollständig erzählen oder in Worte fassen lässt. „Unbeschreiblich“ ist gegenwärtig, verständlich und wahrt diese Bedeutungsweite.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Pronomen verweist am natürlichsten auf Gott zurück; die pronominale Form des Griechischen bleibt erhalten.
- source_word: δωρεᾷ
  choice: Gabe
  rationale: δωρεά bezeichnet ein frei gewährtes Geschenk. „Gabe“ passt zum würdigen Register und vermeidet die im Deutschen mögliche Betonung eines materiellen Geschenks, ohne den Ausdruck näher festzulegen.
theological_decisions:
- issue: Bezug von „seine unbeschreibliche Gabe“
  choice: Die Gabe wird als Gottes Gabe bezeichnet, aber nicht näher bestimmt.
  alternative: Ausdrückliche Deutung als Christus, als Heil beziehungsweise Gnade in Christus oder als Gottes gnädiges Wirken einschließlich der Freigebigkeit der Korinther.
  rationale: Der Vers selbst nennt lediglich Gottes Gabe. Der weitere Zusammenhang erlaubt mehrere miteinander verbundene Deutungen; die Übersetzung bewahrt diese Offenheit und trägt keine engere dogmatische Festlegung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste Wendung „Gott sei Dank“ ist allgemein verständlich; durch „für seine … Gabe“ bleibt sie eindeutig als an Gott gerichteter Dank und nicht als bloße Redensart erkennbar.
