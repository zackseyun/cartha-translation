  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: de
  text: Denn was nun den Dienst für die Heiligen[a] betrifft, ist es überflüssig, euch zu schreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Dienst, der auf die Heiligen ausgerichtet ist“. Die griechische Präposition kann hier die Zielrichtung oder die Begünstigten bezeichnen.'
