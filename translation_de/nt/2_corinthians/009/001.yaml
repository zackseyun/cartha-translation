lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Was nun … betrifft
  rationale: Περὶ eröffnet das Thema; μὲν γὰρ verbindet den Satz mit dem vorangehenden Zusammenhang und markiert zugleich einen Übergang. Die deutsche Wendung gibt diese Diskursfunktion natürlich wieder, ohne jedes Partikel einzeln abzubilden.
- source_word: διακονίας
  choice: Dienst
  rationale: διακονία bezeichnet hier den praktischen Hilfsdienst, insbesondere die Sammlung für bedürftige Glaubende. „Dienst“ bewahrt die von Paulus gewählte würdigende Bezeichnung und ist im Deutschen natürlicher und weniger institutionell als „Dienstleistung“ oder „Ministerium“.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: für die Heiligen
  rationale: εἰς kann hier Zielrichtung oder Begünstigte bezeichnen. Im Deutschen drückt „für“ den gemeinten Dienst zugunsten der Heiligen idiomatisch aus; die mögliche Nuance der Ausrichtung wird in der Fußnote festgehalten.
- source_word: ἁγίους
  choice: Heiligen
  rationale: ἅγιοι ist eine übliche paulinische Bezeichnung für die zu Gott gehörenden Glaubenden. „Heilige“ ist knapp, traditionsnah und lexikalisch präzise, ohne den Ausdruck paraphrasierend aufzulösen.
- source_word: περισσόν
  choice: überflüssig
  rationale: περισσόν bedeutet hier, dass weiteres Schreiben eigentlich nicht nötig beziehungsweise redundant ist. „Überflüssig“ erhält die rhetorische Zuspitzung stärker als das schlichtere „unnötig“.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: ist es überflüssig, euch darüber zu schreiben
  rationale: Die deutsche unpersönliche Konstruktion bildet die griechische Verbindung aus Dativ, εἰμί und substantiviertem Infinitiv natürlich ab. „darüber“ macht den thematischen Bezug im Deutschen eindeutig, ohne neue Sachinformation hinzuzufügen.
theological_decisions:
- issue: Bezeichnung der Empfänger des Hilfsdienstes
  choice: die Heiligen
  alternative: Gottes heiliges Volk / die Glaubenden
  rationale: Die traditionelle und unmittelbare Wiedergabe wahrt Paulus’ theologisch geprägte Bezeichnung, ohne sie konfessionell einzuengen oder erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt rhetorisch leicht gehoben, ist aber für heutige Leser verständlich. „Was nun … betrifft“ gibt den Themenübergang idiomatisch wieder; „überflüssig“ bewahrt Paulus’ pointierte Formulierung.
