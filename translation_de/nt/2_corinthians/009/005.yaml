source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: de
  text: Darum hielt ich es für nötig, die Brüder[a] zu bitten, uns voraus zu euch zu reisen und die von euch versprochene großzügige Gabe[b] im Voraus vorzubereiten, damit sie als großzügige Gabe bereitliegt und nicht als habgierige Forderung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geschwister“ beziehungsweise „Brüder und Schwestern“, falls die Bezeichnung hier inklusiv gemeint ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Segen“. Gemeint ist hier der zugesagte Beitrag der Korinther als großzügige Gabe.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort bezeichnet gewöhnlich „Habgier“ oder „Habsucht“. Im Kontrast zur großzügigen Gabe kann es hier eine habgierige Forderung beziehungsweise eine aus eigennützigem Gewinnstreben erhobene Forderung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: Darum hielt ich es für nötig
  rationale: Gibt die folgernde Partikel οὖν und das abwägende Urteil von ἡγησάμην natürlich wieder, ohne einen äußeren Zwang zu behaupten.
- source_word: παρακαλέσαι
  choice: zu bitten
  rationale: Im Zusammenhang bezeichnet das Verb eine nachdrückliche Bitte an die Abgesandten; „bitten“ klingt im modernen Deutsch natürlicher als „ermahnen“, ohne den Handlungsimpuls aufzugeben.
- source_word: τοὺς ἀδελφοὺς
  choice: die Brüder
  rationale: Bewahrt die grammatisch maskuline Bezeichnung; die mögliche inklusive Verwendung wird in einer Fußnote genannt.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: vor uns zu euch zu reisen
  rationale: Macht die aus dem Reisekontext hervorgehende Vorzeitigkeit beziehungsweise vorausgehende Reise verständlich.
- source_word: προκαταρτίσωσι
  choice: im Voraus vorzubereiten
  rationale: Spiegelt sowohl das Präfix προ- als auch den Gedanken des Fertigstellens vor Paulus’ Ankunft wider.
- source_word: τὴν προεπηγγελμένην εὐλογίαν ὑμῶν
  choice: die von euch versprochene großzügige Gabe
  rationale: Der Genitiv bezeichnet im Kontext die von den Korinthern zugesagte Sammlung. εὐλογία wird hier idiomatisch als freigebige Gabe verstanden; das wörtliche Bild „Segen“ bleibt in der Fußnote erhalten.
- source_word: οὕτως ὡς εὐλογίαν
  choice: So sollte sie als großzügige Gabe bereitliegen
  rationale: Bewahrt οὕτως und die Wiederholung von εὐλογία in verständlichem Deutsch.
- source_word: καὶ μὴ ὡς πλεονεξίαν
  choice: und nicht wie etwas, das man euch aus Habgier abverlangt hätte
  rationale: πλεονεξία bedeutet gewöhnlich Habgier oder Habsucht. Im Sammlungskontext kontrastiert Paulus eine freiwillig großzügige Gabe mit einer Gabe, die durch habgierigen Druck eingetrieben erscheint.
theological_decisions:
- issue: Referenz von ἀδελφοὺς
  choice: die Brüder
  alternative: die Geschwister beziehungsweise Brüder und Schwestern
  rationale: Die maskuline Form wird im Haupttext nicht stillschweigend neutralisiert. Zugleich bleibt offen, ob die Gruppenbezeichnung im damaligen Sprachgebrauch inklusiv gemeint ist.
- issue: Bedeutung von εὐλογία bei der Sammlung
  choice: großzügige Gabe
  alternative: Segen
  rationale: Im unmittelbaren Kontext bezeichnet εὐλογία den zugesagten Beitrag und charakterisiert ihn als Ausdruck der Großzügigkeit. Die Fußnote bewahrt die wörtliche Bedeutung und damit Paulus’ positive theologische Bildsprache.
- issue: Bedeutung von πλεονεξία im Kontrast zur Gabe
  choice: etwas, das man euch aus Habgier abverlangt hätte
  alternative: Habgier beziehungsweise Habsucht
  rationale: Die abstrakte Wiedergabe „als Habgier“ wäre im Deutschen schwer verständlich. Die gewählte Form bewahrt den Habgier-Aspekt und verdeutlicht zugleich, dass die Sammlung nicht wie eine unter Druck eingetriebene Abgabe erscheinen soll.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Wiederholung von εὐλογία bleibt als „großzügige Gabe“ erhalten; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
