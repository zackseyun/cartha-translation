review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die zentrale Sammlungsterminologie sind zutreffend wiedergegeben. Die Wiedergabe von πλεονεξία als ein hypothetisch „aus Habgier abverlangt hätte“ fügt jedoch einen unbestimmten Akteur sowie einen kontrafaktischen Vergangenheitsbezug hinzu, die der griechische Text nicht ausdrückt. Eine nominale Wiedergabe als „habgierige Forderung“ macht den Kontrast verständlich, ohne diese Zusätze.
  naturalness: Der Entwurf ist überwiegend natürliches modernes Standarddeutsch. „So sollte sie“ ist möglich, aber „damit sie bereitliegt“ bildet den Zweck der Vorausorganisation unmittelbarer ab. „Uns voraus“ ist idiomatischer und weniger schwerfällig als „vor uns zu euch zu reisen“.
  terminology: „Brüder“ mit inklusiver Alternative in der Anmerkung ist vertretbar. „Großzügige Gabe“ gibt εὐλογία im Kontext verständlich wieder und bewahrt die Wiederholung; die Fußnote dokumentiert angemessen die wörtliche Bedeutung „Segen“. Für πλεονεξία sollte der Wortlaut nicht „Erpressung“ oder ein tatsächlich erfolgtes Abverlangen behaupten.
  issues:
  - severity: medium
    issue: πλεονεξία wird durch „etwas, das man euch aus Habgier abverlangt hätte“ zu stark und zu spezifisch ausgelegt.
    rationale: Der griechische Ausdruck benennt Habgier bzw. eine habgierige Forderung; er nennt weder einen Handelnden noch eine hypothetische vergangene Forderung. Die Formulierung mit „man“, „euch“ und „hätte“ erweitert den Sinn.
  - severity: low
    issue: „So sollte sie“ schwächt die finale Beziehung von ἵνα ab.
    rationale: „Damit sie bereitliegt“ gibt den Zweck der vorausgehenden Vorbereitung direkter wieder und klingt im Deutschen flüssiger.
