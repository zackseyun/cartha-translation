revisions:
- from: Darum hielt ich es für nötig, die Brüder[a] zu bitten, vor uns zu euch zu reisen und die von euch versprochene großzügige Gabe[b] im Voraus vorzubereiten. So sollte sie als großzügige Gabe bereitliegen und nicht wie etwas, das man euch aus Habgier abverlangt hätte.[c]
  to: Darum hielt ich es für nötig, die Brüder[a] zu bitten, uns voraus zu euch zu reisen und die von euch versprochene großzügige Gabe[b] im Voraus vorzubereiten, damit sie als großzügige Gabe bereitliegt und nicht als habgierige Forderung.[c]
  rationale: Die Revision beseitigt die im Ausgangstext hinzugefügte kontrafaktische und agentbezogene Auslegung von πλεονεξία. Sie bewahrt zugleich den kontextuellen Kontrast zwischen einer freiwillig großzügigen Gabe und einer habgierigen Forderung, die Wiederholung von εὐλογία sowie die Zweckbeziehung des griechischen ἵνα-Satzes.
