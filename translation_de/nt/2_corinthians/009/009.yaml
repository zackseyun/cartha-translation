  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: de
  text: 'Wie geschrieben steht: »Er hat ausgestreut und den Armen gegeben; seine Gerechtigkeit[a] bleibt in Ewigkeit.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier auch das gerechte Handeln beziehungsweise die gerechte Tat des großzügigen Gebers bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: Die geläufige deutsche Zitierformel gibt die feste griechische Wendung natürlich und würdevoll wieder.
- source_word: Ἐσκόρπισεν
  choice: er hat großzügig ausgestreut
  rationale: »Ausgestreut« bewahrt das Bild des weiten Verteilens; »großzügig« verdeutlicht im Deutschen den im Zusammenhang gemeinten Akt des Gebens, ohne das Bild durch das sachlichere »verteilt« zu ersetzen.
- source_word: ἔδωκεν
  choice: und den Armen gegeben
  rationale: Das Perfekt ist in modernem Standarddeutsch für eine vergangene Handlung mit fortdauernder Bedeutung natürlich; das gemeinsame Hilfsverb »hat« verbindet beide Verben knapp und poetisch.
- source_word: τοῖς πένησιν
  choice: den Armen
  rationale: πένης bezeichnet Menschen mit geringen Mitteln; »den Armen« ist direkt, idiomatisch und kontextgemäß.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: seine Gerechtigkeit
  rationale: »Gerechtigkeit« bewahrt die breite Bedeutung von δικαιοσύνη und lässt sowohl die gerechte Haltung als auch das konkrete gerechte Handeln des Gebenden anklingen.
- source_word: μένει
  choice: bleibt
  rationale: »Bleibt« entspricht dem Grundsinn von μένω und drückt den Fortbestand klar und natürlich aus.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die feste deutsche Wendung wahrt den gehobenen, poetischen Ton des Schriftzitats und gibt die unbegrenzte Dauer wieder.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη im paulinischen Zusammenhang
  choice: Gerechtigkeit
  alternative: gerechtes Handeln
  rationale: Das deutsche »Gerechtigkeit« wahrt die lexikalische Verbindung zu δικαιοσύνη und legt nicht fest, ob vor allem Charakter, Verhalten oder die bleibende Anerkennung der gerechten Tat gemeint ist. Die Fußnote macht die ethisch-praktische Bedeutung ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischer Färbung für das Schriftzitat. Das Bild des Ausstreuens und die in »Gerechtigkeit« liegende Bedeutungsbreite bleiben erhalten.
