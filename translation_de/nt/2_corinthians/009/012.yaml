- from: Denn dieser Dienst erfüllt nicht nur den Mangel der Heiligen[a], sondern bewirkt auch überreich viele Danksagungen an Gott—
  to: Denn der Dienst dieser Hilfeleistung deckt nicht nur den Mangel der Heiligen[a], sondern führt auch zu einem Überfluss an Danksagungen an Gott—
  rationale: Die Revision bewahrt die erläuternde Funktion von „Denn“, die paulinische Bezeichnung „die Heiligen“ und den offenen Satzanschluss. Sie stellt die im Griechischen vorhandene Verbindung von Dienst und konkreter Hilfeleistung wieder her und ersetzt die unidiomatische Formulierung zu den Danksagungen durch eine natürliche, den Überfluss und den resultativen Zusammenhang wiedergebende Wendung.
