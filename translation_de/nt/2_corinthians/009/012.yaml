  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: de
  text: Denn der Dienst dieser Hilfeleistung deckt nicht nur den Mangel der Heiligen[a], sondern führt auch zu einem Überfluss an Danksagungen an Gott—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deckt das, was den Heiligen fehlt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet im Zusammenhang eine Begründung oder Erläuterung des vorher Gesagten ein.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: dieser Dienst
  rationale: Die wörtliche Doppelung „der Dienst dieser Dienstleistung“ wirkt im Deutschen schwerfällig. „Dieser Dienst“ bezeichnet natürlich die konkrete Sammlung, während die dienende Bedeutung beider Substantive erhalten bleibt.
- source_word: προσαναπληροῦσα
  choice: erfüllt
  rationale: Bezeichnet das Auffüllen beziehungsweise Decken dessen, was fehlt; zusammen mit „Mangel“ ist „erfüllt“ prägnant und verständlich.
- source_word: τὰ ὑστερήματα
  choice: den Mangel
  rationale: Bewahrt die Vorstellung dessen, was den Empfängern fehlt, enger als die stärker kontextualisierende Wiedergabe „Bedürfnisse“.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: Bewahrt Paulus’ übliche Bezeichnung für die Glaubenden und vermeidet eine interpretierende Umschreibung.
- source_word: περισσεύουσα
  choice: bewirkt auch überreich
  rationale: Gibt die Fülle beziehungsweise das Übermaß wieder und macht zugleich verständlich, dass der Dienst zahlreiche Danksagungen hervorbringt.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: viele Danksagungen an Gott
  rationale: διά bezeichnet hier plausibel die vermittelnde Wirkung beziehungsweise das Ergebnis; „an Gott“ kennzeichnet Gott als Empfänger des Dankes.
theological_decisions:
- issue: Wiedergabe von ἅγιοι
  choice: die Heiligen
  alternative: Gottes Volk; die heiligen Menschen
  rationale: „Die Heiligen“ hält an Paulus’ ekklesialem Sprachgebrauch fest, ohne den Ausdruck auf später förmlich kanonisierte Personen zu beschränken.
- issue: Verhältnis von Dienst und Danksagungen
  choice: bewirkt auch überreich viele Danksagungen an Gott
  alternative: ist auch überreich durch viele Danksagungen an Gott
  rationale: Die Formulierung macht die wahrscheinliche resultative Bedeutung verständlich, ohne die Danksagungen dem Dienstleistenden selbst zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich am Versende bleibt stehen, weil der griechische Satz in den folgenden Vers hinein weitergeführt wird.
