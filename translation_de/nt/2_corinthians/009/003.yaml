  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: de
  text: Ich habe jedoch die Brüder geschickt[a], damit sich unser Rühmen über euch in dieser Hinsicht[b] nicht als leer erweist[c] und damit ihr, wie ich sagte, vorbereitet seid.
