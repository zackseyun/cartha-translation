lexical_decisions:
- source_word: ἔπεμψα
  choice: ich habe … geschickt
  rationale: Der Aorist wird im erklärenden Zusammenhang als vollendete Handlung wiedergegeben. Da ein epistolarischer Aorist möglich ist, wird die präsentische Alternative in einer Fußnote genannt.
- source_word: τοὺς ἀδελφούς
  choice: die Brüder
  rationale: Gemeint sind die konkreten männlichen Abgesandten aus dem Zusammenhang; daher wird der grammatisch und sachlich passende maskuline Plural beibehalten.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: unser Rühmen über euch
  rationale: Die Formulierung bewahrt den Gedanken des Rühmens beziehungsweise des Grundes zum Rühmen und gibt ὑπὲρ ὑμῶν im Deutschen natürlich wieder.
- source_word: κενωθῇ
  choice: sich … als leer erweist
  rationale: Die Wendung erhält das Bild des Leerwerdens und ist zugleich verständliches modernes Deutsch. Die stärker resultative Alternative „zunichtewird“ steht in der Fußnote.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: in dieser Hinsicht
  rationale: μέρος bezeichnet hier keinen räumlichen Teil, sondern den betreffenden Gesichtspunkt, nämlich die Sammlung und die Bereitschaft der Korinther.
- source_word: καθὼς ἔλεγον
  choice: wie ich immer wieder gesagt habe
  rationale: Das Imperfekt kann fortgesetztes oder wiederholtes Reden anzeigen; „immer wieder gesagt habe“ macht diesen Aspekt im Deutschen deutlich.
- source_word: παρεσκευασμένοι ἦτε
  choice: ihr vorbereitet seid
  rationale: Die periphrastische Konstruktion bezeichnet den beabsichtigten Zustand des Vorbereitetseins. Der deutsche Präsenskonjunktiv wäre hier unnötig steif; der Indikativ steht natürlich im damit-Satz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rühmen“ bewahrt den paulinischen Leitbegriff, während die übrige Syntax für heutige Leser geglättet ist. Die zweimalige Zweckangabe mit ἵνα wird durch „damit … und damit“ transparent wiedergegeben.
