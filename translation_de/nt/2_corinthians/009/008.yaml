  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: de
  text: Gott aber kann euch jede Gnade im Überfluss schenken, damit ihr in allem jederzeit alles Nötige habt[a] und jedes gute Werk in reichem Maß tun könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „volle Genüge habt“. Das griechische Wort kann ausreichende Versorgung, Genüge oder Zufriedenheit bezeichnen. Hier geht es darum, dass Gott alles Erforderliche bereitstellt, nicht um unabhängige Selbstgenügsamkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ δὲ ὁ θεός
  choice: Gott aber kann
  rationale: Das Präsens betont Gottes Fähigkeit und Macht. „Aber“ gibt den leicht weiterführenden beziehungsweise kontrastierenden Anschluss von δέ wieder, ohne ihn zu überzeichnen.
- source_word: πᾶσαν χάριν
  choice: jede Gnade
  rationale: χάρις bezeichnet hier Gottes gnädige Zuwendung und Versorgung, die im Zusammenhang auch zum großzügigen Geben befähigt. „Gnade“ bewahrt die theologische Weite, statt den Ausdruck auf materielle Mittel zu verengen.
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: euch … im Überfluss schenken
  rationale: Die Formulierung gibt sowohl die auf die Adressaten gerichtete Bewegung als auch den Gedanken überreicher Fülle idiomatisch wieder. „Schenken“ entspricht in diesem Zusammenhang dem gnädigen Handeln Gottes, ohne χάρις auf eine einzelne Gabe festzulegen.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ wahrt den Zweck- beziehungsweise Folgebezug des griechischen Satzes.
- source_word: ἐν παντὶ πάντοτε
  choice: in allem jederzeit
  rationale: Die beiden umfassenden Angaben werden ausdrücklich beibehalten und lassen die Häufung der παν-Wörter erkennen.
- source_word: πᾶσαν αὐτάρκειαν ἔχοντες
  choice: alles Nötige habt
  rationale: αὐτάρκεια meint im Kontext ausreichende Versorgung beziehungsweise Genüge. Die natürliche deutsche Formulierung vermeidet den irreführenden Gedanken autonomer Selbstgenügsamkeit; die engere lexikalische Alternative steht in der Fußnote.
- source_word: περισσεύητε εἰς πᾶν ἔργον ἀγαθόν
  choice: jedes gute Werk in reichem Maß tun könnt
  rationale: Die Wiedergabe macht in natürlichem Deutsch deutlich, dass Gottes Versorgung zu reichlichem guten Handeln befähigt. „In reichem Maß“ nimmt das wiederholte Motiv des Überflusses auf.
theological_decisions:
- issue: Bedeutung von χάρις im Zusammenhang des Gebens
  choice: Gottes umfassende gnädige Zuwendung und Versorgung, einschließlich der Befähigung zur Großzügigkeit
  alternative: ausschließlich materielle Gabe oder bloßes Wohlwollen
  rationale: Der unmittelbare Kontext betrifft das Geben, doch χάρις bleibt weiter gefasst als finanzielle Versorgung. „Gnade“ bewahrt diese Breite.
- issue: Bedeutung von αὐτάρκεια
  choice: ausreichende, von Gott gewährte Versorgung
  alternative: innere Zufriedenheit oder unabhängige Selbstgenügsamkeit
  rationale: Der Satz stellt ausdrücklich Gott als den Versorgenden dar. Daher ist keine philosophische oder autonome Selbstgenügsamkeit gemeint; zugleich bleibt die mögliche Nuance „Genüge“ in der Fußnote sichtbar.
- issue: Verhältnis von Gottes Versorgung und guten Werken
  choice: Gottes überreiche Gnade befähigt die Empfänger zu reichlichem guten Handeln
  alternative: Gute Werke als Voraussetzung für Gottes Gnade
  rationale: Die ἵνα-Konstruktion stellt das gute Handeln als Ziel beziehungsweise Folge der göttlichen Versorgung dar, nicht als deren Vorbedingung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Häufung umfassender Ausdrücke („jede“, „in allem“, „jederzeit“, „alles“, „jedes“) und das Motiv überreicher Fülle bleiben erkennbar; schwerfällige Nominalformulierungen wie „alle Hinlänglichkeit“ werden vermieden.
