id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: de
  text: und in ihrem Gebet für euch sehnen sie sich nach euch wegen der überragenden Gnade Gottes, die auf euch ruht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und in ihrem Flehen für euch, wobei sie sich nach euch sehnen, wegen der überragenden Gnade Gottes auf euch“.'
    reason: Die Fußnote zeigt die verdichtete griechische Partizipialkonstruktion und die engere Bedeutung von δέησις, ohne sie im Haupttext unnatürlich nachzuahmen.
lexical_decisions:
- source_word: δέησις
  choice: Gebet
  rationale: Das Wort bezeichnet hier ein inständiges Bitten bzw. Fürbitten. „Gebet“ ist im modernen Deutsch natürlich und umfasst in diesem Zusammenhang die Fürbitte; die engere Nuance wird in der Fußnote genannt.
- source_word: αὐτῶν
  choice: ihrem
  rationale: 'Der Genitiv Plural bezieht sich auf die Empfänger der Gabe und wird zusammen mit δεήσει idiomatisch possessiv wiedergegeben: „in ihrem Gebet“.'
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: Ὑπέρ mit Genitiv bedeutet im Gebetskontext idiomatisch „für, zugunsten von“.
- source_word: ἐπιποθούντων
  choice: sehnen sie sich nach
  rationale: Das präsentische Partizip beschreibt ihr anhaltendes, herzliches Verlangen. Ein finites Verb ergibt im Deutschen einen klaren und natürlichen Satz.
- source_word: διὰ
  choice: wegen
  rationale: Διά mit Akkusativ gibt hier den Grund ihres Sehnens an.
- source_word: ὑπερβάλλουσαν
  choice: überragenden
  rationale: Die Wiedergabe bewahrt den Gedanken eines außergewöhnlichen, jedes gewöhnliche Maß übersteigenden Ausmaßes.
- source_word: χάριν
  choice: Gnade
  rationale: „Gnade“ bewahrt das paulinische theologische Gewicht von Gottes unverdienter Zuwendung und Wirksamkeit.
- source_word: ἐφ’ ὑμῖν
  choice: die auf euch ruht
  rationale: Die Relativkonstruktion macht den Bezug im Deutschen eindeutig und bewahrt zugleich das Bild der auf ihnen liegenden Gnade. Das im Griechischen nicht ausdrücklich vorhandene Verb ist idiomatisch ergänzt.
- source_word: καὶ
  choice: und
  rationale: Die einfache Konjunktion verbindet den Vers mit dem vorausgehenden Gedankengang.
theological_decisions:
- issue: Verhältnis von Gebet und Sehnsucht in der Syntax
  choice: Die Empfänger der Gabe beten für die Korinther und sehnen sich zugleich nach ihnen.
  alternative: Das Gebet kann stärker als Ausdruck oder Mittel ihrer Sehnsucht verstanden und entsprechend wörtlicher mit einer Partizipialkonstruktion wiedergegeben werden.
  rationale: 'Die griechische Formulierung ist verdichtet: Das Genitivpartizip ἐπιποθούντων gehört zu αὐτῶν. Die deutsche Auflösung in zwei verbale Aussagen bewahrt beide Handlungen, ohne ihr genaues Verhältnis über den Text hinaus festzulegen.'
- issue: Gottes Gnade „auf“ den Korinthern
  choice: „die auf euch ruht“ bewahrt die räumliche Metapher von ἐπί.
  alternative: „die euch geschenkt ist“ oder „die unter euch wirkt“ wäre deutender und würde Gabe bzw. Wirkung stärker hervorheben.
  rationale: Die gewählte Formulierung erhält die Bildsprache und vermeidet es, die Art der Gnadenwirkung näher zu bestimmen, als der griechische Text es tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebet“ und „sehnen sich“ sind allgemein verständlich; „überragende Gnade“ bewahrt den gehobenen paulinischen Ton. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Vers.
