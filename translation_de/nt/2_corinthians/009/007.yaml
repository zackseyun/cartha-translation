source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: de
  text: Jeder[a] soll geben, wie er es sich im Herzen vorgenommen hat, nicht aus Betrübnis[b] oder unter Zwang; denn Gott liebt einen fröhlichen Geber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jeder“ und die folgenden maskulinen Singularformen geben den repräsentativen Singular des Griechischen wieder; gemeint ist jede einzelne Person, nicht nur ein Mann.
    reason: cultural_note
  - marker: b
    text: 'Oder: „nicht widerwillig“. Das griechische Wort bezeichnet Betrübnis, Kummer oder Schmerz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Jeder
  rationale: Bewahrt den verteilenden Singular und klingt im Deutschen natürlich. Die Form ist hier allgemein auf jede einzelne Person bezogen, nicht ausschließlich auf Männer.
- source_word: καθὼς
  choice: wie
  rationale: Leitet den Maßstab für das Geben schlicht und idiomatisch ein.
- source_word: προῄρηται
  choice: es sich … vorgenommen hat
  rationale: Drückt einen bewussten, bereits gefassten Entschluss aus und ist im modernen Deutschen natürlicher als „beschlossen“ oder „im Voraus gewählt“.
- source_word: τῇ καρδίᾳ
  choice: im Herzen
  rationale: Bewahrt den biblischen Ausdruck für den inneren Ort des Wollens und Entscheidens, ohne ihn auf bloßes Denken zu verengen.
- source_word: μὴ ἐκ λύπης
  choice: nicht aus Betrübnis
  rationale: Gibt die Grundbedeutung von λύπη als Betrübnis, Kummer oder Schmerz wieder. Der kontextuelle Sinn „nicht widerwillig“ wird in einer Fußnote genannt.
- source_word: ἢ ἐξ ἀνάγκης
  choice: oder unter Zwang
  rationale: Erfasst in diesem Zusammenhang den Gedanken äußerer Nötigung oder auferlegter Notwendigkeit idiomatisch.
- source_word: ἱλαρὸν
  choice: fröhlichen
  rationale: Gibt die freudige und bereitwillige Haltung des Gebenden treffend wieder und entspricht dem etablierten deutschen Ausdruck.
- source_word: δότην
  choice: Geber
  rationale: Knappes und direktes deutsches Substantiv für eine Person, die gibt.
- source_word: ἀγαπᾷ
  choice: liebt
  rationale: Bewahrt die normale Bedeutung von ἀγαπάω und schwächt die Aussage nicht zu „hat Gefallen an“ ab.
- source_word: ὁ θεός
  choice: Gott
  rationale: Direkte Standardwiedergabe des bestimmten Subjekts.
theological_decisions:
- issue: Generisch maskuline Singularformen
  choice: Jeder … er … Geber
  alternative: Jede und jeder … / Alle sollen geben, wie sie …
  rationale: Der griechische Text richtet den Blick im repräsentativen Singular auf jede einzelne Person. Die deutsche Singularform bewahrt diese Struktur, ohne eine ausschließlich männliche Personengruppe zu bezeichnen; eine Fußnote macht dies ausdrücklich klar.
- issue: Bedeutung von λύπη beim Geben
  choice: nicht aus Betrübnis
  alternative: nicht widerwillig
  rationale: Die Hauptfassung bewahrt die lexikalische Spannung von λύπη („Betrübnis, Kummer, Schmerz“). „Widerwillig“ erklärt den naheliegenden Sinn im Kontext, würde aber die Bild- und Gefühlsdimension des griechischen Ausdrucks stärker festlegen.
- issue: Im Griechischen ergänztes Verb des Gebens
  choice: soll geben
  alternative: jeder, wie er es sich im Herzen vorgenommen hat
  rationale: Das Verb „geben“ ist aus dem unmittelbaren Zusammenhang zu ergänzen. Die deutsche Fassung macht die Aufforderung vollständig und natürlich, ohne den Sinn inhaltlich zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „Im Herzen“ und „fröhlicher Geber“ bewahren die biblische Ausdrucksweise; „unter Zwang“ ist gegenwärtig und unmittelbar verständlich.
