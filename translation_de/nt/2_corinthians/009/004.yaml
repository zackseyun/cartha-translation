source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: de
  text: 'damit wir nicht etwa, falls einige Mazedonier mit mir kommen und euch unvorbereitet antreffen, – um nicht zu sagen: ihr – in dieser Zuversicht[a] beschämt dastehen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei diesem Vorhaben« beziehungsweise »in dieser Angelegenheit«. Das griechische Wort kann hier auch die Grundlage der Zuversicht oder das konkrete Unternehmen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ganz zu schweigen von euch«. Paulus deutet an, dass auch die Korinther beschämt dastünden, wenn sie unvorbereitet wären.'
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: damit wir nicht etwa, falls
  rationale: Die Formulierung bewahrt sowohl den vorbeugenden beziehungsweise besorgten Sinn von μή πως als auch die Bedingung, die ἐάν einführt, und ist im Deutschen als Fortsetzung des vorhergehenden Satzes verständlich.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: einige Mazedonier mit mir kommen
  rationale: Der artikellose Plural bezeichnet hier eine unbestimmte mögliche Gruppe; »einige Mazedonier« gibt dies natürlich wieder, ohne eine bereits feststehende Gruppe vorauszusetzen.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: euch unvorbereitet antreffen
  rationale: ἀπαράσκευος bezeichnet mangelnde Vorbereitung. »Unvorbereitet antreffen« ist präzise und passt zum Kontext der noch bereitzustellenden Sammlung.
- source_word: καταισχυνθῶμεν
  choice: beschämt dastehen
  rationale: Die passive Form hat eine öffentliche und soziale Dimension. »Beschämt dastehen« vermittelt mehr als ein rein inneres Schamgefühl und klingt im modernen Deutsch natürlich.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen ist betont; seine Stellung vor der eingeschobenen Wendung erhält den Kontrast zu »ihr«.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: 'um nicht zu sagen: ihr'
  rationale: Die parenthetische Formulierung mildert die Aussage und deutet zugleich an, dass auch die Korinther von der Beschämung betroffen wären.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: in dieser Zuversicht
  rationale: ὑπόστασις bezeichnet hier wahrscheinlich die von Paulus bekundete Zuversicht hinsichtlich der Korinther. Die knappe Wiedergabe erhält zugleich die im Kontext verbleibende Bedeutungsweite.
theological_decisions:
- issue: Bedeutung von ὑπόστασις in diesem nichttechnischen paulinischen Zusammenhang
  choice: Zuversicht
  alternative: Vorhaben beziehungsweise Angelegenheit
  rationale: Der unmittelbare Kontext handelt von Paulus’ Zuversicht, dass die Korinther vorbereitet sein werden. »Zuversicht« vermeidet den späteren philosophisch-theologischen Sinn »Substanz«, während eine Fußnote die kontextuell möglichen sachbezogenen Deutungen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform schließt syntaktisch an den vorhergehenden Vers an. Der Gedankenstrich kennzeichnet den vorsichtig zugespitzten Einschub, ohne Paulus’ rhetorische Spannung aufzulösen.
