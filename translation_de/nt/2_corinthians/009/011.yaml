  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: de
  text: in jeder Hinsicht reich gemacht zu aller Freigebigkeit[a], die durch uns Dank an Gott bewirkt—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu aller Großzügigkeit“. Das griechische Wort kann in anderen Zusammenhängen auch „Aufrichtigkeit“ oder „Einfachheit“ bedeuten; hier spricht der Zusammenhang des Gebens für „Freigebigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: in jeder Hinsicht
  rationale: Die Wendung ist hier umfassend und idiomatisch zu verstehen; „in jeder Hinsicht“ bezeichnet die vielfältige Befähigung zum Geben.
- source_word: πλουτιζόμενοι
  choice: reich gemacht
  rationale: Die passive Form bleibt erhalten und lässt Gott als den aus dem Zusammenhang erschließbaren Handelnden erkennen, ohne materiellen Wohlstand als Selbstzweck zu behaupten.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: zu aller Großzügigkeit
  rationale: Im Zusammenhang der Geldsammlung bezeichnet ἁπλότης am ehesten freigebige, vorbehaltlose Großzügigkeit; εἰς drückt Ziel oder Ergebnis aus.
- source_word: ἥτις
  choice: die
  rationale: Das Relativpronomen bezieht sich auf die unmittelbar zuvor genannte Großzügigkeit und führt deren Wirkung an.
- source_word: κατεργάζεται
  choice: bewirkt
  rationale: Das Verb bezeichnet das Hervorbringen eines Ergebnisses; „bewirkt“ ist präzise und idiomatisch.
- source_word: δι’ ἡμῶν
  choice: durch uns
  rationale: διά mit Genitiv bezeichnet Vermittlung; die knappe Wiedergabe lässt wie im Griechischen offen, dass Paulus und seine Mitarbeiter die Gabe überbringen beziehungsweise verwalten.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: Dank an Gott
  rationale: Die substantivische Aussage bleibt erhalten und klingt im modernen Deutschen natürlicher als „Danksagung an Gott“.
theological_decisions:
- issue: Bedeutung von ἁπλότης im Zusammenhang der Sammlung
  choice: Großzügigkeit beziehungsweise Freigebigkeit beim Geben
  alternative: Einfachheit, Aufrichtigkeit oder Lauterkeit
  rationale: Der unmittelbare Zusammenhang mit materieller Versorgung, Geben und dem daraus entstehenden Dank an Gott spricht für konkrete Großzügigkeit. Die Fußnote bewahrt das weitere Bedeutungsspektrum des griechischen Wortes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktion und der Gedankenstrich bewahren den fragmentarischen Anschluss an den umliegenden Satz. „Reich gemacht“ erhält das Passiv und vermeidet eine eigenmächtige Festlegung des Handelnden im Vers selbst.
