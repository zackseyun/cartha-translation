  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: de
  text: Denn unsere vorübergehende leichte Bedrängnis bewirkt für uns über alles Maß hinaus ein ewiges Gewicht der Herrlichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einem alles überragenden Maß“. Wörtlich steht im Griechischen eine ungewöhnliche Steigerungsformel: „nach Übermaß bis zum Übermaß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: augenblickliche
  rationale: Das Wort bezeichnet das nur gegenwärtig bzw. kurzzeitig Bestehende. „Augenblicklich“ bildet im Deutschen einen klaren Gegensatz zu „ewig“, ohne die Bedrängnis als bedeutungslos darzustellen.
- source_word: ἐλαφρὸν
  choice: leichte
  rationale: „Leicht“ bewahrt den beabsichtigten bildhaften Gegensatz zu βάρος („Gewicht“).
- source_word: θλίψεως
  choice: Bedrängnis
  rationale: „Bedrängnis“ gibt den Gedanken von Druck, Not und Leiden wieder, ohne unnötige endzeitliche Nebenbedeutungen einzutragen.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: das jedes Maß übersteigt
  rationale: Die ungewöhnliche griechische Steigerungsformel drückt ein außerordentliches, kaum vergleichbares Übermaß aus. Die deutsche Fassung gibt diese intensive Wirkung natürlich wieder.
- source_word: αἰώνιον
  choice: ewiges
  rationale: „Ewig“ entspricht dem zeitlichen und eschatologischen Gegensatz zur augenblicklichen Bedrängnis.
- source_word: βάρος δόξης
  choice: Gewicht an Herrlichkeit
  rationale: Diese Formulierung erhält sowohl das Substantiv „Gewicht“ als auch den bewussten Gegensatz zwischen „leicht“ und „Gewicht“. „An Herrlichkeit“ ist im modernen Deutschen verständlicher als das mögliche, aber schwerfälligere „Gewicht von Herrlichkeit“.
- source_word: κατεργάζεται
  choice: bewirkt
  rationale: „Bewirkt“ drückt wirksames Hervorbringen beziehungsweise Herbeiführen aus und lässt den Zusammenhang zwischen gegenwärtiger Not und künftiger Herrlichkeit bestehen.
- source_word: ἡμῖν
  choice: für uns
  rationale: Der Dativ bezeichnet hier am natürlichsten die Begünstigten. „Für uns“ vermeidet die stärker deutende Vorstellung, die Herrlichkeit werde ausschließlich innerlich in den Leidenden hervorgebracht.
- source_word: ἡμῶν
  choice: unsere
  rationale: Der Genitiv ordnet die Bedrängnis Paulus und seinen Mitarbeitern zu; die schlichte possessive Wiedergabe entspricht dem Satzbau im Deutschen.
theological_decisions:
- issue: Verhältnis von Bedrängnis und Herrlichkeit
  choice: Die gegenwärtige Bedrängnis bewirkt für die Leidenden eine künftige, ewige Herrlichkeit.
  alternative: Die Bedrängnis verdient die Herrlichkeit als menschliche Leistung oder bewirkt lediglich gegenwärtige innere Reifung.
  rationale: Der Gegensatz zwischen „augenblicklich“ und „ewig“ weist auf eine eschatologische Herrlichkeit. „Bewirkt für uns“ erhält die starke Aussage des Textes, ohne eine Verdienstlehre hinzuzufügen oder das Ergebnis auf gegenwärtige Charakterbildung zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Metapher „Gewicht an Herrlichkeit“ wurde bewusst beibehalten, damit der rhetorische Gegensatz zwischen „leicht“ und „Gewicht“ sichtbar bleibt. Das Komma zwischen „augenblickliche“ und „leichte“ lässt beide Eigenschaften eigenständig hervortreten.
