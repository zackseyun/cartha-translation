  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: de
  text: Doch selbst wenn unsere gute Nachricht verhüllt ist, ist sie denen verhüllt, die verloren gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei denen, die verloren gehen“; wörtlicher: „unter denen, die verloren gehen“.'
    reason: Lexikalisch-syntaktische Alternativen für ἐν τοῖς ἀπολλυμένοις; die Fußnote bewahrt die mögliche sphärische Nuance von ἐν.
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: Und selbst wenn
  rationale: Gibt die konzessive Bedingung natürlich wieder; δέ führt den Gedankengang mit leichter Gegenüberstellung fort, καί verstärkt im Sinn von „selbst“.
- source_word: κεκαλυμμένον
  choice: verhüllt
  rationale: Bewahrt das Bild des Schleiers aus dem unmittelbaren Zusammenhang (3,14–16; 4,4) genauer als das allgemeinere „verborgen“.
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: unsere gute Nachricht
  rationale: Bewahrt das Possessivpronomen und gibt εὐαγγέλιον in allgemein verständlichem, modernem Deutsch wieder, ohne den Ausdruck erläuternd auszuweiten.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: unter denen, die verloren gehen
  rationale: „Unter“ bildet ἐν als Bereichs- beziehungsweise Bezugsangabe ab; „die verloren gehen“ bewahrt den prozesshaften Aspekt des Präsenspartizips und vermeidet die statische Festlegung „die Verlorenen“.
- source_word: ἐστὶν κεκαλυμμένον
  choice: so ist sie … verhüllt
  rationale: Die Wiederholung des Prädikats bleibt zur Wahrung der griechischen Betonung erhalten; „sie“ bezieht sich auf die gute Nachricht.
theological_decisions:
- issue: Bedeutung von ἀπολλυμένοις im paulinischen heilsgeschichtlichen Zusammenhang
  choice: die verloren gehen
  alternative: die verloren sind / die Verlorenen
  rationale: Die gewählte Formulierung bewahrt den fortschreitenden beziehungsweise andauernden Charakter des Partizips und lässt die theologische Spannung bestehen, statt sie in eine ausschließlich statische Kategorie aufzulösen.
- issue: Bezug von ἐν auf die Betroffenen
  choice: unter denen
  alternative: für diejenigen / bei denen
  rationale: „Unter denen“ wahrt am ehesten die räumlich-sphärische Ausdrucksweise des Griechischen; die mögliche relationale Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gute Nachricht“ ist unmittelbar verständlich; „verhüllt“ erhält zugleich das leitende Schleierbild. Das korrelative „wenn … so“ sorgt trotz der griechischen Wiederholung für einen klaren deutschen Satzbau.
