  verdict: revise
  source_fidelity: Die konzessiv-konditionale Einleitung, die zweimalige Betonung von „verhüllt“ und der prozesshafte Sinn von ἀπολλυμένοις sind im Entwurf grundsätzlich zutreffend wiedergegeben. Die Formulierung „unter denen verhüllt, die verloren gehen“ ist jedoch im Deutschen syntaktisch holprig und kann den Bezug von ἐν unnötig räumlich missverstehen lassen.
  naturalness: „Unter denen verhüllt, die …“ wirkt in modernem Standarddeutsch schwerfällig. „Denen verhüllt, die verloren gehen“ ist idiomatisch und gibt die relationale Aussage verständlich wieder, ohne den griechischen Ausdruck dogmatisch einzuengen.
  terminology: „Gute Nachricht“ ist als moderne Wiedergabe von εὐαγγέλιον vertretbar; „verhüllt“ wahrt das Schleiermotiv des Kontextes. „Die verloren gehen“ erhält den präsentischen, nicht statisch etikettierenden Charakter von ἀπολλυμένοις.
  issues:
