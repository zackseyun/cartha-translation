    issue: Unnatürliche Stellung und mögliche Überverräumlichung von „unter denen“
    rationale: Die Wiederholung „unter denen verhüllt, die verloren gehen“ ist zwar semantisch möglich, klingt aber unidiomatisch. Eine dativische Konstruktion macht im Deutschen klarer, dass die gute Nachricht für diese Personen verhüllt ist; die sphärische Nuance kann als Alternative in der Fußnote stehen.
