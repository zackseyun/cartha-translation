source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: de
  text: 'Denn Gott, der gesagt hat: »Aus der Finsternis wird Licht leuchten«, ist es, der in unseren Herzen aufgeleuchtet ist, um uns zur Erkenntnis der Herrlichkeit Gottes im Angesicht des Messias[a] zu erleuchten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Christou, traditionell »Christus«; »Messias« gibt den Titel wieder.
    reason: lexical_alternative
  - marker: b
    text: Die Aussage greift die Bildsprache des Schöpfungsberichts auf (1. Mose 1,3) und bezieht sie auf Gottes offenbarendes Wirken in den Herzen. »Im Angesicht des Messias« kann auch weiter gefasst als »in der Person des Messias« verstanden werden.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage; »Denn« wahrt den argumentativen Zusammenhang natürlich.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Gott, der gesagt hat
  rationale: Das substantivierte Partizip wird im Deutschen klar und idiomatisch durch einen Relativsatz wiedergegeben.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Aus der Finsternis soll Licht leuchten
  rationale: Die Wiedergabe erhält ἐκ, das Lichtmotiv und den futurischen Wortlaut des Schöpfungsanklangs. »Soll« entspricht hier einem von Gott ausgesprochenen, wirksamen Schöpfungswort, ohne die Form in einen Imperativ umzudeuten.
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: er ist es, der in unseren Herzen aufgeleuchtet ist
  rationale: Das wiederaufgenommene Relativpronomen wird zur Verdeutlichung der griechischen Satzführung ausdrücklich wiedergegeben. »Aufgeleuchtet ist« bewahrt das nichtkausative Lichtbild und bezeichnet Gottes Wirken im Inneren.
- source_word: πρὸς φωτισμὸν
  choice: damit … Licht verbreitet
  rationale: Die Zielangabe wird als natürlicher deutscher Finalsatz formuliert. Die verbale Wendung vermeidet das schwerfällige Abstraktum »Erleuchtung«, ohne das Lichtmotiv aufzugeben.
- source_word: τῆς γνώσεως τῆς δόξης τοῦ θεοῦ
  choice: die Erkenntnis der Herrlichkeit Gottes
  rationale: Die Genitivfolge bleibt eng am griechischen Ausdruck und lässt dessen mögliche Beziehungen offen.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: im Angesicht des Messias
  rationale: »Angesicht« bewahrt das konkrete Bild von Licht und sichtbarer Herrlichkeit. »Messias« gibt Χριστός als Titel wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / von Christus
  rationale: Χριστός bezeichnet seinem Ursprung und seiner Funktion nach den Gesalbten. »Messias« macht den Titel für heutige Leser sichtbar, ohne zusätzliche konfessionelle Deutung.
- issue: Bedeutung von ἐν προσώπῳ Χριστοῦ
  choice: im Angesicht des Messias
  alternative: in der Person Christi
  rationale: Die konkrete Wiedergabe passt zum unmittelbaren Bildfeld von Leuchten und Herrlichkeit. Die idiomatisch-abstraktere Deutung »in der Person« bleibt als mögliche Lesart in der Fußnote erhalten.
- issue: Bezug von πρὸς φωτισμὸν
  choice: 'Ziel des göttlichen Aufleuchtens: Die Erkenntnis verbreitet Licht'
  alternative: Gott schenkt Erleuchtung zur Erkenntnis
  rationale: Die gewählte Fassung folgt der nominalen Genitivverbindung eng, ohne festzulegen, ob φωτισμός stärker den Vorgang der Erleuchtung, das Licht selbst oder dessen Weitergabe bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildwörter »Finsternis«, »Licht«, »aufgeleuchtet« und »Angesicht« werden bewusst beibehalten. Die leichte Markierung »er ist es, der« macht die griechische Wiederaufnahme nach dem Zitat verständlich; der Finalsatz sorgt trotz der dichten Genitivfolge für lesbaren deutschen Satzbau.
