  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: de
  text: Darum verlieren wir nicht den Mut, da wir diesen Dienst haben, so wie uns Barmherzigkeit erwiesen wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Knüpft folgernd an den vorausgehenden Gedankengang an und entspricht natürlichem, würdigem Deutsch.
- source_word: τὴν διακονίαν ταύτην
  choice: diesen Dienst
  rationale: „Dienst“ gibt διακονία im paulinischen Zusammenhang klar und ohne unnötige kirchenamtliche Verengung wieder.
- source_word: καθὼς ἠλεήθημεν
  choice: weil uns Barmherzigkeit erwiesen worden ist
  rationale: Καθώς kann hier den Umstand beziehungsweise Grund bezeichnen, unter dem Paulus diesen Dienst empfangen hat. Die passive Form wahrt den unausgesprochenen göttlichen Handelnden.
- source_word: οὐκ ἐγκακοῦμεν
  choice: verlieren wir nicht den Mut
  rationale: Gibt das Nicht-Ermatten oder Nicht-Verzagen idiomatisch und verständlich wieder.
theological_decisions:
- issue: Verhältnis zwischen empfangener Barmherzigkeit und dem Dienst
  choice: kausale Wiedergabe mit „weil“
  alternative: „so wie uns Barmherzigkeit erwiesen worden ist“
  rationale: Im Kontext ist die Barmherzigkeit Gottes die Grundlage dafür, dass Paulus diesen Dienst hat und nicht verzagt. Die kausale Wiedergabe ist im Deutschen klar; die Vergleichsbedeutung von καθώς bleibt als mögliche Nuance anerkannt.
translation_notes:
  register: Modernes Standarddeutsch; klar, würdig und gemeinverständlich. Die Satzstellung stellt die Folgerung und das Nicht-Verzagen in den Vordergrund, ohne den Inhalt des griechischen Satzes zu verändern.
