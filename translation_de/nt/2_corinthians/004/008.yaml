  text: ἐν παντὶ θλιβόμενοι ἀλλ’ οὐ στενοχωρούμενοι, ἀπορούμενοι ἀλλ’ οὐκ ἐξαπορούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: de
  text: In jeder Hinsicht bedrängt, aber nicht in die Enge getrieben; ratlos, aber nicht ohne Ausweg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ratlos, aber nicht völlig ratlos“; das zweite griechische Wort steigert das erste und bezeichnet äußerste Ratlosigkeit beziehungsweise das völlige Fehlen eines Auswegs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: in jeder Hinsicht
  rationale: Die Wendung bezeichnet hier umfassenden Bereich bzw. Umstand, nicht notwendig eine räumliche Umfassung. „In jeder Hinsicht“ ist natürlich und wahrt diese Weite.
- source_word: θλιβόμενοι
  choice: bedrängt
  rationale: Das Partizip bezeichnet Druck und Bedrängnis. „Bedrängt“ bewahrt das Bild des äußeren Drucks und ermöglicht den Gegensatz zur verneinten Einengung.
- source_word: στενοχωρούμενοι
  choice: in die Enge getrieben
  rationale: Das Verb ruft wörtlich die Vorstellung eines engen Raumes hervor. Die idiomatische Wendung erhält dieses Bild und bezeichnet eine Bedrängnis, die keinen Bewegungsspielraum mehr lässt.
- source_word: ἀπορούμενοι
  choice: ratlos
  rationale: Das Wort bezeichnet, dass man keinen Rat oder gangbaren Weg weiß. „Ratlos“ ist knapp, gegenwärtig und verständlich.
- source_word: ἐξαπορούμενοι
  choice: ohne Ausweg
  rationale: Das Kompositum steigert ἀπορέω bis zum völligen Fehlen eines Auswegs. Zusammen mit der Negation gibt „nicht ohne Ausweg“ das Wortspiel und die Steigerung genauer wieder als eine psychologisch engere Wiedergabe mit „verzweifeln“.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: aber nicht … aber nicht
  rationale: Die wiederholte adversative Struktur trägt den Rhythmus und die beiden pointierten Gegensätze des Satzes.
theological_decisions:
- issue: Grad und Art der Steigerung im zweiten Gegensatzpaar
  choice: „ratlos, aber nicht ohne Ausweg“
  alternative: „verzweifelt, aber nicht zur Verzweiflung gebracht“ bzw. „ratlos, aber nicht verzweifelt“
  rationale: Die gewählte Fassung bewahrt die etymologische und rhetorische Beziehung zwischen ἀπορούμενοι und ἐξαπορούμενοι. Sie macht keine zusätzliche Aussage über einen technischen oder geistlichen Begriff der Verzweiflung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Partizipialstruktur und der parallele Rhythmus des Griechischen bleiben erhalten. „In die Enge getrieben“ und „ohne Ausweg“ bewahren die zusammengehörigen Raum- und Wegmetaphern, ohne die Spannung vorschnell psychologisch oder dogmatisch aufzulösen.
