source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: de
  text: Denn wir verkünden nicht uns selbst, sondern den Messias Jesus als Herrn[a], uns selbst aber als eure Sklaven[b] um Jesu willen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus Jesus als Herrn“. Χριστός kann hier auch namensähnlich mit „Christus“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Diener“. Das griechische δοῦλοι kann Sklaven oder Diener bezeichnen; „Sklaven“ hebt hier die starke Unterordnung im Gegensatz zu Jesus als Herrn hervor.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wegen Jesus“.'
    reason: translation_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: wir verkünden
  rationale: „Verkünden“ gibt den öffentlichen Bekanntmachungscharakter von κηρύσσω wieder, ohne den Ausdruck auf eine formelle Predigt einzuengen.
- source_word: ἑαυτοὺς
  choice: uns selbst
  rationale: Das Reflexivpronomen wird entsprechend seiner zweimaligen Verwendung beibehalten und hebt den Gegensatz zwischen dem Inhalt der Verkündigung und der dienenden Stellung der Verkündiger hervor.
- source_word: Χριστὸν Ἰησοῦν
  choice: Jesus, den Messias
  rationale: Χριστός wird als Titel verstanden und daher mit „Messias“ wiedergegeben. Die Umstellung in die im Deutschen natürliche Apposition „Jesus, den Messias“ wahrt den Sinn, auch wenn die griechische Wortfolge wörtlich „Messias Jesus“ lautet.
- source_word: κύριον
  choice: als Herrn
  rationale: „Herr“ ist die angemessene Wiedergabe von κύριος; „als“ lässt κύριον prädikativ auf Jesus bezogen sein, ohne ein im Griechischen nicht vorhandenes finites Verb einzufügen.
- source_word: δούλους
  choice: Sklaven
  rationale: „Sklaven“ bewahrt die starke Aussage der Unterordnung und den bewussten Gegensatz zu Jesus als „Herrn“. Das mögliche, im Deutschen mildere „Diener“ wird in einer Fußnote genannt.
- source_word: ὑμῶν
  choice: eure
  rationale: Der Genitiv bezeichnet hier die Beziehung der Unterordnung beziehungsweise des Dienstes gegenüber den korinthischen Gläubigen.
- source_word: διὰ Ἰησοῦν
  choice: um Jesu willen
  rationale: 'διά mit Akkusativ bezeichnet hier am ehesten Grund oder Beweggrund: Ihre Stellung gegenüber den Korinthern besteht wegen Jesus beziehungsweise um seinetwillen.'
theological_decisions:
- issue: Χριστός als Titel oder namensähnlicher Bestandteil
  choice: Jesus, den Messias
  alternative: Christus Jesus
  rationale: Die Formulierung hält die titelartige Bedeutung „Messias“ ausdrücklich fest. Da Χριστός in der Verbindung Χριστὸν Ἰησοῦν auch namensähnlich verstanden werden kann, wird „Christus Jesus“ als Alternative vermerkt.
- issue: Syntaktische Funktion von κύριον in Χριστὸν Ἰησοῦν κύριον
  choice: Jesus, den Messias, als Herrn
  alternative: Christus Jesus, den Herrn
  rationale: 'Die Hauptfassung versteht κύριον prädikativ: Verkündigt wird Jesus in seiner Stellung als Herr. Die alternative appositionelle Auffassung bleibt in der Fußnote sichtbar.'
- issue: Stärke von δοῦλοι im Verhältnis zu κύριον
  choice: Sklaven
  alternative: Diener
  rationale: Die stärkere Wiedergabe erhält die zugespitzte Unterordnung der Apostel im Gegensatz zur Herrschaft Jesu, ohne daraus eine über den Text hinausgehende Lehrbestimmung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den doppelten Gegensatz „nicht … sondern“ und „uns selbst aber“. „Um Jesu willen“ ist gehoben, aber weiterhin allgemein verständlich und entspricht dem biblischen Register; die transparentere Alternative steht in der Fußnote.
