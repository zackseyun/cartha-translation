  source_fidelity: Die Hauptfassung gibt die Kontraste des griechischen Satzes sowie die Wiederholung von ἑαυτούς zutreffend wieder. „verkünden“, „Sklaven“ und „um Jesu willen“ entsprechen κηρύσσομεν, δούλους und διά mit Akkusativ angemessen. Die Stellung und Kasusbeziehung von Χριστὸν Ἰησοῦν κύριον lassen sich im Deutschen jedoch klarer und näher am Ausgangstext darstellen.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „Jesus, den Messias, als Herrn“ ist zwar verständlich, trennt aber die beiden im Griechischen parallel als Akkusative stehenden christologischen Bezeichnungen unterschiedlich auf und wirkt dadurch stilistisch etwas konstruiert. „den Messias Jesus als Herrn“ ist in diesem bewusst titelbetonten Register klarer.
  terminology: „Messias“, „Herr“ und „Sklaven“ bewahren die gewählten theologischen und sozialen Schlüsselbegriffe ohne interpretierende Abschwächung. Die Alternative mit „Christus Jesus, den Herrn“ sollte nicht als eigene syntaktische Deutung präsentiert werden, da auch die Hauptfassung die griechische Prädikats-/Appositionsbeziehung nicht abschließend entscheidet.
