id: 2CO.4.16
reference: 2 Corinthians 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: de
  text: Darum verlieren wir nicht den Mut. Doch auch wenn unser äußerer Mensch verfällt, wird unser innerer Mensch Tag für Tag erneuert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird Tag für Tag erneuert“. Das griechische Präsenspassiv kann die fortlaufende Erneuerung hervorheben.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang knapp und natürlich.
- source_word: οὐκ ἐγκακοῦμεν
  choice: verlieren wir nicht den Mut
  rationale: Gibt das paulinische Idiom für das Nichtverzagen in natürlichem modernem Deutsch wieder.
- source_word: ἀλλ’ εἰ καὶ
  choice: Selbst wenn
  rationale: Bewahrt den konzessiven Sinn; der folgende Gegensatz wird im Deutschen durch „doch“ klar markiert.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: unser äußerer Mensch
  rationale: Erhält den bewussten Parallelismus mit dem „inneren Menschen“ und vermeidet eine vorschnelle anthropologische Ausdeutung.
- source_word: διαφθείρεται
  choice: zugrunde geht
  rationale: Bezeichnet hier einen fortschreitenden Verfall; die Präsensform lässt den andauernden Vorgang erkennen.
- source_word: ἀλλ’
  choice: doch
  rationale: Hebt den scharfen Gegensatz zwischen äußerem Verfall und innerer Erneuerung idiomatisch hervor.
- source_word: ὁ ἔσω ἡμῶν
  choice: unser innerer Mensch
  rationale: Ergänzt das im Griechischen elliptisch ausgelassene ἄνθρωπος und bewahrt die formale Entsprechung zum „äußeren Menschen“.
- source_word: ἀνακαινοῦται
  choice: wird erneuert
  rationale: Das passive Präsens bezeichnet eine fortdauernde Erneuerung, ohne den Handelnden ausdrücklich zu ergänzen.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: Tag für Tag
  rationale: Natürliche deutsche Wiedergabe der distributiven Wendung für einen täglich fortschreitenden Vorgang.
theological_decisions:
- issue: Anthropologischer Gegensatz zwischen ὁ ἔξω ἄνθρωπος und ὁ ἔσω
  choice: „äußerer Mensch“ und „innerer Mensch“
  alternative: „äußeres Wesen“ und „inneres Wesen“ oder „äußerer Mensch“ als ausdrücklicher Verweis auf den Körper
  rationale: Die Formulierung bewahrt die paulinische Gegenüberstellung, ohne daraus ein umfassendes Leib-Seele-Schema abzuleiten. Der Zusammenhang legt körperlichen Verfall und innere Erneuerung nahe, doch der Vers definiert die Begriffe nicht technisch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle, aber weiterhin verständliche Gegenüberstellung „äußerer Mensch / innerer Mensch“ wurde wegen des bewussten Parallelismus beibehalten.
