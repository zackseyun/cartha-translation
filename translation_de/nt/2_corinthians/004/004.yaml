reference: 2 Corinthians 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: de
  text: Bei ihnen hat der Gott dieses Zeitalters[b] den Verstand der Ungläubigen verblendet, sodass ihnen das Licht des Evangeliums von der Herrlichkeit des Messias, der das Ebenbild Gottes ist, nicht aufleuchtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass sie das Licht des Evangeliums von der Herrlichkeit des Messias nicht sehen“. Das seltene griechische Verb kann entweder das Aufleuchten des Lichts oder dessen Wahrnehmung betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Gott dieser Welt“. Das griechische Wort aiōn bedeutet gewöhnlich „Zeitalter“ und hebt hier die gegenwärtige gefallene Zeit hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Bei ihnen
  rationale: Die Wendung verweist auf die zuvor genannten Verlorengehenden beziehungsweise Ungläubigen. „Bei ihnen“ gibt diesen Bezug natürlich wieder, ohne ein innewohnendes Verhältnis anzudeuten.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: der Gott dieses Zeitalters
  rationale: αἰών bezeichnet hier vorrangig das gegenwärtige Zeitalter und nicht die geschaffene Welt. Die Formulierung bleibt stehen, ohne den im Text nicht genannten Referenten ausdrücklich als Satan zu bezeichnen.
- source_word: ἐτύφλωσεν
  choice: hat … verblendet
  rationale: Das deutsche Perfekt bringt die abgeschlossene Handlung mit ihrer fortdauernden Wirkung idiomatisch zum Ausdruck. „Verblendet“ passt im Deutschen zur geistigen Wahrnehmung.
- source_word: τὰ νοήματα τῶν ἀπίστων
  choice: den Verstand der Ungläubigen
  rationale: νοήματα bezeichnet hier das Denk- und Erkenntnisvermögen. Der griechische Plural wird im Deutschen idiomatisch als distributiver Singular wiedergegeben.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: sodass ihnen … nicht aufleuchtet
  rationale: Die Konstruktion kann Folge oder Absicht ausdrücken; „sodass“ bewahrt diese Offenheit weitgehend. Das seltene αὐγάζω wird hier als Leuchten des Evangeliumslichts verstanden; die Wahrnehmungsdeutung steht in der Fußnote.
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: das Licht des Evangeliums
  rationale: „Licht“ ist im Deutschen eine klare und bildgetreue Wiedergabe von φωτισμός in diesem Zusammenhang; „Evangelium“ ist der geläufige Ausdruck für εὐαγγέλιον.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: von der Herrlichkeit des Messias
  rationale: Die Genitivfolge kann als Inhalt beziehungsweise Gegenstand des Evangeliums verstanden werden. „Von der Herrlichkeit“ ergibt natürliches Deutsch und erhält die Beziehung zur Herrlichkeit des Messias. Χριστός wird als Titel mit „Messias“ wiedergegeben.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: der das Ebenbild Gottes ist
  rationale: „Ebenbild Gottes“ gibt die direkte christologische Aussage klar wieder und bewahrt den biblischen Anklang von εἰκών.
theological_decisions:
- issue: Referent von „der Gott dieses Zeitalters“
  choice: Die textliche Bezeichnung bleibt unverändert und wird nicht durch „Satan“ ersetzt.
  alternative: Ausdrückliche Identifizierung als Satan oder Deutung als unpersönliches Weltsystem.
  rationale: Die Formulierung weist wahrscheinlich auf eine persönliche böse Macht, doch der Vers selbst nennt sie nicht Satan. Die Übersetzung vermeidet sowohl erklärende Einfügung als auch Entpersonalisierung.
- issue: Bedeutung von αὐγάσαι mit φωτισμός
  choice: Das Licht des Evangeliums leuchtet den Ungläubigen nicht auf.
  alternative: Die Ungläubigen sehen beziehungsweise erkennen das Licht des Evangeliums nicht.
  rationale: Das seltene Verb lässt beide Auffassungen zu. Die Hauptfassung verbindet es mit dem Leuchten des Lichts; die echte lexikalische Mehrdeutigkeit wird in Fußnote [a] erhalten.
- issue: Christologische Aussage „Ebenbild Gottes“
  choice: Die direkte Aussage über den Messias wird ohne dogmatische Erweiterung wiedergegeben.
  alternative: Erklärende Präzisierung seiner Wesensbeziehung zu Gott.
  rationale: Der starke christologische Gehalt soll stehen bleiben, ohne spätere theologische Fachbegriffe in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bei ihnen“ ist idiomatisch und rückverweisend; „Verstand“ und „aufleuchtet“ sind allgemein verständlich. „Messias“ bewahrt den Titelcharakter von Χριστός. Sämtliche Fußnotenmarker erscheinen im Haupttext.
