  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die vier griechischen Partizipien und die beiden antithetischen Verbindungen „ἀλλ’ οὐκ“ präzise wieder: „verfolgt“ für διωκόμενοι, „nicht verlassen“ für ἐγκαταλειπόμενοι, „zu Boden geworfen“ für καταβαλλόμενοι und „nicht vernichtet“ für ἀπολλύμενοι. Die knappe partizipiale Reihung und die offene, nicht weiter spezifizierte Aussage des griechischen Textes bleiben erhalten.'
  naturalness: „verfolgt, aber nicht verlassen; zu Boden geworfen, aber nicht vernichtet“ ist idiomatisches, modernes und zugleich würdiges Standarddeutsch. Die parallele Struktur ist klar und der abschließende Beistrich ist als Anschluss an den fortlaufenden Satzkontext sachgerecht.
  terminology: Die Wortwahl ist treffend und registergerecht. „Verlassen“ wahrt gegenüber dem etwas umgangssprachlicheren „im Stich gelassen“ den gehobenen biblischen Ton, ohne altertümlich zu wirken. „Zu Boden geworfen“ gibt das Bild von καταβαλλόμενοι konkreter wieder als ein bloß psychologisch verstandenes „niedergeschlagen“. Die Entscheidung steht auch mit der englischen POB-Audit-Trail in Einklang, ohne deren Formulierung unnötig nachzubilden.
