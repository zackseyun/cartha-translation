lexical_decisions:
- source_word: διωκόμενοι
  choice: verfolgt
  rationale: Das Partizip bezeichnet hier feindselige Verfolgung. „Verfolgt“ ist im Deutschen natürlich, prägnant und wahrt die parallele Form.
- source_word: ἐγκαταλειπόμενοι
  choice: verlassen
  rationale: „Verlassen“ gibt das Zurückgelassen- oder Im-Stich-gelassen-Werden in würdigem, allgemein verständlichem Deutsch wieder, ohne unnötig altertümlich zu klingen.
- source_word: καταβαλλόμενοι
  choice: zu Boden geworfen
  rationale: Die Formulierung bewahrt das konkrete Bild des Niederwerfens und bildet einen klaren Gegensatz zur folgenden Aussage, dass daraus keine Vernichtung folgt.
- source_word: ἀπολλύμενοι
  choice: vernichtet
  rationale: Im Gegensatz zum Niedergeworfenwerden bezeichnet das Verb hier die endgültige Zerstörung. „Vernichtet“ erhält die starke Antithese.
- source_word: ἀλλ’ οὐκ
  choice: aber nicht
  rationale: Die knappe Verbindung erhält die zwei ausgewogenen Gegensätze und den Rhythmus des griechischen Textes.
theological_decisions:
- issue: Ob ἐγκαταλειπόμενοι stärker traditionssprachlich oder allgemeinverständlich wiedergegeben werden soll
  choice: verlassen
  alternative: im Stich gelassen
  rationale: „Verlassen“ wahrt die mögliche theologische Tragweite, ohne eine bestimmte intertextuelle oder konfessionelle Deutung festzuschreiben; „im Stich gelassen“ wäre idiomatischer, aber umgangssprachlicher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, paralleler Satzstruktur. Die konkreten passivischen Bilder und die Spannung zwischen schwerer Bedrängnis und ausbleibender endgültiger Vernichtung bleiben erhalten.
