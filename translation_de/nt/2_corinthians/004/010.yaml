  verdict: approve
  source_fidelity: Die Übersetzung gibt πάντοτε, die fortdauernde Tragmetapher von περιφέροντες, die parallelen Ausdrücke νέκρωσις/ζωή Jesu sowie die ἵνα-Konstruktion sachgerecht wieder. „Das Sterben Jesu“ ist für νέκρωσις im Kontext gut vertretbar und wird durch die Fußnote angemessen als gegenüber „Tod Jesu“ offene Entscheidung kenntlich gemacht. Das ergänzte „unserem“ in der ersten Leib-Wendung ist im Deutschen zur natürlichen Bezugnahme auf die Träger gerechtfertigt und legt keine problematische Deutung fest.
  naturalness: „Dabei tragen wir allezeit ... an unserem Leib“ ist würdiges, verständliches modernes Standarddeutsch. „Leib“ passt zum paulinischen, personal-leiblichen Register; „sichtbar wird“ ist eine idiomatische Wiedergabe von φανερωθῇ. „Allezeit“ ist leicht gehoben, aber weder veraltet noch unnatürlich und entspricht dem gewählten Register.
  terminology: Die Begriffe „Sterben“, „Leben“ und „Leib“ sind konsistent und theologisch nicht überbestimmt. Die Fußnote benennt die relevante lexikalische Bandbreite von νέκρωσις, ohne die Genitivbeziehung zu Jesus dogmatisch festzulegen. Der Fußnotenanker ist korrekt platziert.
