source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: de
  text: Dabei tragen wir allezeit das Sterben Jesu[a] an unserem Leib, damit auch das Leben Jesu an unserem Leib sichtbar wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Tod Jesu“. Das griechische Substantiv kann den Tod, den Todeszustand oder die Erfahrung des Sterbens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: allezeit
  rationale: Das Adverb bezeichnet eine beständige Begleitumständlichkeit. „Allezeit“ ist würdevoll, gut verständlich und knapper als „zu jeder Zeit“.
- source_word: τὴν νέκρωσιν
  choice: das Sterben
  rationale: νέκρωσις kann Tod, Todeszustand oder Sterbeprozess bezeichnen. Im Zusammenhang mit dem fortwährenden Tragen am Leib gibt „das Sterben“ die erfahrene Todeswirklichkeit natürlich wieder; „Tod“ bleibt als echte Alternative in der Fußnote erhalten.
- source_word: τοῦ Ἰησοῦ
  choice: Jesu
  rationale: Der Genitiv wird formal bewahrt, ohne näher festzulegen, ob vor allem Jesu historischer Tod oder die mit ihm verbundene Todeserfahrung gemeint ist.
- source_word: ἐν τῷ σώματι
  choice: an unserem Leib
  rationale: „Am Leib“ bezeichnet idiomatisch den Ort, an dem Leiden getragen und sichtbar werden. Obwohl das erste griechische Vorkommen kein ausdrückliches Possessivpronomen hat, ist der Träger durch das partizipiale „wir“ gegeben; „unserem“ macht dies im Deutschen natürlich verständlich.
- source_word: περιφέροντες
  choice: tragen wir
  rationale: Das Präsenspartizip beschreibt ein fortwährendes Mit-sich-Tragen. Die finite Wiedergabe passt zum deutschen Satzanschluss und erhält die verkörperte Tragmetapher.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die mögliche Zweck- beziehungsweise Folgerelation natürlich wieder, ohne sie stärker festzulegen.
- source_word: καὶ
  choice: auch
  rationale: „Auch“ wahrt die Entsprechung zwischen dem Sterben Jesu und seinem Leben.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: das Leben Jesu
  rationale: Die formale Parallelität zu „das Sterben Jesu“ bleibt erhalten; gemeint ist im Kontext das Leben des auferstandenen Jesus.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: an unserem Leib
  rationale: Der griechische Singular mit pluralischem Possessiv wird als kollektiver Singular beibehalten. So bleibt die rhetorische Parallelität beider Satzhälften erhalten.
- source_word: φανερωθῇ
  choice: sichtbar wird
  rationale: Die passive Form bezeichnet ein Offenbar- oder Sichtbarwerden. „Sichtbar wird“ ist gegenwärtiges, klares Deutsch und passt besonders zum leiblichen Zusammenhang.
theological_decisions:
- issue: Bedeutung von νέκρωσις in Bezug auf Jesus
  choice: „das Sterben Jesu“
  alternative: „den Tod Jesu“
  rationale: Das seltene Substantiv kann die Todeswirklichkeit beziehungsweise den Vorgang des Sterbens bezeichnen. „Sterben“ passt zum fortwährenden leiblichen Tragen, ohne die Beziehung zu Jesu Tod zu lösen; die Alternative „Tod“ wird nicht ausgeschlossen.
- issue: 'Verhältnis von ἵνα: Zweck oder Folge'
  choice: „damit“
  alternative: „sodass“
  rationale: ἵνα kann hier Zweck und Folge eng verbinden. „Damit“ bewahrt den Zielgedanken, ohne eine Aussage darüber einzuführen, wer diesen Zweck unmittelbar setzt.
- issue: Numerus und kollektiver Sinn von σώμα
  choice: Singular „unserem Leib“ in beiden Satzteilen
  alternative: Plural „unseren Leibern“ beziehungsweise „unseren Körpern“
  rationale: Der griechische Text verwendet an beiden Stellen den Singular. Dessen Beibehaltung schützt die Parallelität und lässt den gemeinschaftlich-apostolischen Sinn offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leib“ wahrt den leiblich-personalen und rhetorischen Charakter besser als das stärker anatomisch klingende „Körper“. Der einleitende Anschluss „Dabei“ macht die partizipiale Fortführung des vorangehenden Satzes im Deutschen lesbar.
