source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: de
  text: während wir unseren Blick nicht auf das richten, was man sieht, sondern auf das, was man nicht sieht. Denn das, was man sieht, ist vergänglich, das, was man nicht sieht, aber ewig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκοπούντων
  choice: auf … sehen
  rationale: Das Partizip bezeichnet das gezielte Richten der Aufmerksamkeit auf etwas. „Auf … sehen“ bewahrt das Bild des Sehens und fügt sich natürlich in den deutschen Satz ein.
- source_word: ἡμῶν
  choice: wir
  rationale: Der Genitiv bezeichnet das Subjekt des Partizips; im Deutschen wird er natürlich als Subjekt des Nebensatzes wiedergegeben.
- source_word: μὴ
  choice: nicht
  rationale: Die einfache Verneinung wird ohne die im Griechischen nicht enthaltene zeitliche Nuance „nicht mehr“ wiedergegeben.
- source_word: τὰ βλεπόμενα
  choice: was sichtbar ist
  rationale: Das substantivierte Partizip bezeichnet das, was gesehen wird beziehungsweise sichtbar ist. Die Formulierung bewahrt die konkrete Wahrnehmungssprache und lässt sich parallel wiederholen.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung gibt „sondern“ den scharfen Gegensatz im Deutschen idiomatisch wieder.
- source_word: τὰ μὴ βλεπόμενα
  choice: was nicht sichtbar ist
  rationale: Die verneinte substantivierte Partizipialform wird in genauer Parallelität zum sichtbaren Gegenstück wiedergegeben, ohne sie vorschnell als „geistlich“ zu deuten.
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aussage ein und bewahrt den argumentativen Zusammenhang.
- source_word: πρόσκαιρα
  choice: vergänglich
  rationale: Bezeichnet etwas, das nur für begrenzte Zeit besteht. „Vergänglich“ bildet im Deutschen einen klaren und würdigen Gegensatz zu „ewig“, ohne die stärkere Bedeutung „augenblicklich“ einzutragen.
- source_word: δέ
  choice: aber
  rationale: Kennzeichnet das zweite Glied des Gegensatzes; in der deutschen Wortstellung ist „was aber …“ natürlich und prägnant.
- source_word: αἰώνια
  choice: ewig
  rationale: Im Gegensatz zu πρόσκαιρα bezeichnet das Wort das dauerhaft Bleibende beziehungsweise zur kommenden Weltzeit Gehörende; „ewig“ ist hier die natürliche und etablierte Wiedergabe.
theological_decisions:
- issue: Gegensatz zwischen Sichtbarem und Nichtsichtbarem
  choice: „was sichtbar ist … was nicht sichtbar ist“
  alternative: „das Materielle … das Geistliche“ oder „die sichtbaren … die unsichtbaren Dinge“
  rationale: Paulus stellt Sichtbares und Nichtsichtbares einander gegenüber, ohne diese Kategorien ausdrücklich mit „materiell“ und „geistlich“ gleichzusetzen. Die Übersetzung bewahrt diese Offenheit und die rhetorische Parallelität.
- issue: Bedeutung von αἰώνια
  choice: „ewig“
  alternative: „zeitalterlang“ oder „zur kommenden Weltzeit gehörig“
  rationale: Der unmittelbare Gegensatz zu dem zeitlich begrenzten πρόσκαιρα hebt das dauerhaft Bleibende hervor. „Ewig“ gibt dies im Kontext knapp und sachgerecht wieder, ohne zusätzliche dogmatische Erläuterung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt syntaktisch an den vorausgehenden Zusammenhang angeschlossen; „während“ gibt die umstandsbezeichnende Funktion des griechischen Genitivus absolutus wieder. Die wiederholte Formulierung „was … sichtbar ist“ erhält die antithetische Struktur des Originals.
