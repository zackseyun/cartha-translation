  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: de
  text: So wirkt der Tod in uns, das Leben aber in euch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Folglich ist der Tod in uns wirksam, das Leben aber in euch.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: So
  rationale: Leitet hier die Folgerung aus den vorausgehenden Aussagen ein und ist im Deutschen knapp und natürlich.
- source_word: ὁ θάνατος
  choice: der Tod
  rationale: Der bestimmte Artikel entspricht hier gut dem griechischen Ausdruck; »Tod« bleibt bewusst unausgedeutet und umfasst die Todeswirklichkeit im apostolischen Leiden.
- source_word: ἐν ἡμῖν
  choice: in uns
  rationale: Gibt ἐν mit Dativ direkt wieder und bewahrt den körperlich-persönlichen sowie gemeinschaftlichen Bezug auf Paulus und seine Mitarbeiter.
- source_word: ἐνεργεῖται
  choice: wirkt
  rationale: Drückt die fortdauernde wirksame Tätigkeit idiomatisch aus, ohne die grammatische Form unnötig technisch wiederzugeben.
- source_word: ἡ δὲ ζωὴ
  choice: das Leben aber
  rationale: Die Nachstellung von »aber« bildet den knappen griechischen Gegensatz würdig und natürlich nach.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Bewahrt die genaue Parallelität zu »in uns« und lässt sowohl den gemeinschaftlichen als auch den persönlichen Bezug offen.
theological_decisions:
- issue: Bedeutung des Gegensatzes von Tod und Leben
  choice: Die knappen Begriffe »Tod« und »Leben« bleiben ohne erklärenden Zusatz stehen.
  alternative: Den Tod ausdrücklich als apostolisches Leiden und das Leben als geistliches Leben der Korinther auslegen.
  rationale: Der Zusammenhang verbindet Jesu Tod und Leben mit dem leiblichen Leiden der Apostel und der lebensspendenden Wirkung ihres Dienstes. Eine explizite Ausdeutung würde die Mehrschichtigkeit des Satzes unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die pointierte Parallelstruktur und der scharfe Gegensatz des griechischen Satzes werden bewahrt.
