id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: de
  text: Denn wir wissen, dass der, der Jesus auferweckt hat, auch uns mit Jesus auferwecken und uns zusammen mit euch vor sich stellen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen hier „den Herrn Jesus“ statt „Jesus“.
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: Denn wir wissen
  rationale: Das Partizip hat im Zusammenhang begründende Kraft. „Denn wir wissen“ gibt diese kausale Beziehung in natürlichem Deutsch wieder.
- source_word: ὁ ἐγείρας
  choice: der, der … auferweckt hat
  rationale: Die substantivierte Aoristpartizipialform bezeichnet Gott, ohne ihn im griechischen Satz ausdrücklich zu nennen. Die Wiedergabe wahrt diese Form und bleibt verständlich.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Dies folgt dem angegebenen SBLGNT-Haupttext. Die Lesart „den Herrn Jesus“ wird als Textvariante in der Fußnote dokumentiert.
- source_word: καὶ ἡμᾶς … ἐγερεῖ
  choice: wird auch uns … auferwecken
  rationale: „Auch“ bewahrt die additive Verbindung zwischen der Auferweckung Jesu und der künftigen Auferweckung der Glaubenden.
- source_word: σὺν Ἰησοῦ
  choice: mit Jesus
  rationale: σύν mit Dativ bezeichnet hier Gemeinschaft beziehungsweise Zusammengehörigkeit. Die Übersetzung vermeidet die unbelegte instrumentale Deutung „durch Jesus“.
- source_word: παραστήσει
  choice: wird … vor sich stellen
  rationale: Die Form bezeichnet ein Präsentieren oder Vor-eine-Person-Stellen. „Vor sich stellen“ macht das implizite Gegenüber zurückhaltend deutlich, ohne den eschatologischen Schauplatz näher festzulegen.
- source_word: σὺν ὑμῖν
  choice: zusammen mit euch
  rationale: Die Formulierung gibt die gemeinschaftliche Hoffnung des Paulus und der Korinther klar wieder.
theological_decisions:
- issue: Textvariante bei τὸν Ἰησοῦν
  choice: Im Haupttext steht gemäß SBLGNT „Jesus“.
  alternative: Einige Handschriften lesen „den Herrn Jesus“.
  rationale: Die textkritische Entscheidung wird nicht dogmatisch überhöht; die abweichende, gut bezeugte Lesart bleibt in einer Fußnote sichtbar.
- issue: Eschatologische Bedeutung von παραστήσει
  choice: Als künftiges gemeinsames Vor-Gott-Stellen wiedergegeben.
  alternative: Allgemeine Rechtfertigung oder ausdrücklich ein Erscheinen vor dem Richterstuhl Christi.
  rationale: Der Auferstehungszusammenhang legt eine eschatologische Präsentation nahe. Die Übersetzung lässt jedoch offen, welcher konkrete Gerichtsschauplatz gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „wir wissen“ gliedert den langen Satz verständlich. Die Wiederholung „der, der“ ist grammatisch eindeutig und bewahrt die substantivierte griechische Partizipialkonstruktion; „zusammen mit euch“ hebt die gemeinschaftliche Aussage natürlich hervor.
