source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: de
  text: Vielmehr haben wir uns von dem Verborgenen der Schande losgesagt. Wir führen unser Leben nicht in Arglist und verfälschen auch nicht das Wort Gottes[a], sondern empfehlen uns durch die offene Darlegung der Wahrheit vor Gott dem Gewissen jedes Menschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „panschen das Wort Gottes nicht“. Das griechische Verb kann das betrügerische Verfälschen durch Beimischung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „durch die Offenlegung der Wahrheit“. Der griechische Ausdruck bezeichnet, dass die Wahrheit unverdeckt erkennbar gemacht wird, und ist nicht auf mündliche Verkündigung beschränkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: haben wir uns … losgesagt
  rationale: Der Aorist im Medium bezeichnet eine entschiedene Abkehr. „Sich lossagen von“ ist im Deutschen natürlich und gewichtig.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: die verborgenen Dinge der Schande
  rationale: Die Genitivfügung bleibt erhalten und bezeichnet Verborgenes, das durch Schande gekennzeichnet ist, ohne es enger als bestimmte Praktiken auszulegen.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: Wir führen unser Leben nicht in Arglist
  rationale: Das bildhafte περιπατεῖν bezeichnet die Lebensführung. „Arglist“ gibt die moralisch verwerfliche, betrügerische Klugheit von πανουργία prägnant wieder.
- source_word: μηδὲ δολοῦντες
  choice: und verfälschen auch nicht
  rationale: Das Verb bezeichnet betrügerisches Verfälschen oder Verfälschen durch Beimischung. Die gewählte Formulierung ist verständlich und wahrt den Gedanken absichtlicher Manipulation.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die geläufige und zugleich offene Wiedergabe legt nicht unnötig fest, ob vor allem die verkündigte Botschaft oder Gottes Wort umfassender gemeint ist.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: machen die Wahrheit offen sichtbar
  rationale: φανέρωσις bezeichnet Offenbarwerden beziehungsweise Sichtbarmachen, nicht notwendig ausschließlich mündliche Verkündigung. Die verbale Wiedergabe klingt im heutigen Deutsch natürlicher als „durch die Offenbarung der Wahrheit“.
- source_word: συνιστάνοντες ἑαυτούς
  choice: empfehlen uns so
  rationale: συνίστημι bedeutet hier, sich als glaubwürdig zu erweisen oder zu empfehlen. „So“ macht den instrumentalen Zusammenhang mit dem offenen Sichtbarmachen der Wahrheit deutlich.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: jedem menschlichen Gewissen
  rationale: Die Formulierung bewahrt den distributiven Sinn von πᾶσαν und die allgemein-menschliche Bedeutung von ἀνθρώπων.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe Wendung bewahrt den Gedanken, dass Gott Zeuge und Richter des apostolischen Handelns ist.
theological_decisions:
- issue: Reichweite des Gegensatzes zwischen betrügerischem und wahrhaftigem Dienst
  choice: Der Text beschreibt die ethische Transparenz des apostolischen Dienstes und seinen Umgang mit Gottes Wort.
  alternative: Eine ausschließlich rhetorische Kritik oder eine umfassende technische Lehraussage über jeden Umgang mit der Schrift.
  rationale: Der unmittelbare Zusammenhang betrifft die Haltung und Verkündigung der Apostel. Die Übersetzung wahrt diese Reichweite, ohne eine engere oder umfassendere Lehrposition einzutragen.
- issue: Bedeutung von φανέρωσις
  choice: Offenes Sichtbarmachen der Wahrheit, ohne Beschränkung auf verbale Verkündigung.
  alternative: Ausschließlich „offene Verkündigung“ oder das theologisch stärker besetzte „Offenbarung“.
  rationale: Das Substantiv betont das Offenlegen beziehungsweise Sichtbarwerden. So bleibt die mögliche Verbindung von Wort und transparenter Lebensführung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erleichtert das Verständnis des langen griechischen Satzes. Paulinische Begriffe wie „Wort Gottes“, „Gewissen“ und „vor Gott“ bleiben erhalten; ungewöhnliche Quellmetaphern werden verständlich, aber nicht überdeutend wiedergegeben.
