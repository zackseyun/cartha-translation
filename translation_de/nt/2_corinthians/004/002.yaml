revisions:
- from: Vielmehr haben wir uns von den verborgenen Dingen der Schande losgesagt. Wir führen unser Leben nicht in Arglist und verfälschen auch nicht das Wort Gottes[a], sondern machen die Wahrheit offen sichtbar[b] und empfehlen uns so vor Gott jedem menschlichen Gewissen.
  to: Vielmehr haben wir uns von dem Verborgenen der Schande losgesagt. Wir führen unser Leben nicht in Arglist und verfälschen auch nicht das Wort Gottes[a], sondern empfehlen uns durch die offene Darlegung der Wahrheit vor Gott dem Gewissen jedes Menschen.[b]
  rationale: 'Die Überarbeitung stellt die im Griechischen ausgedrückte Mittelbeziehung ausdrücklich her: Durch die offene Darlegung der Wahrheit empfehlen die Sprecher sich dem Gewissen jedes Menschen. Zugleich ersetzt sie die im Deutschen weniger natürliche Wendung „die Wahrheit offen sichtbar machen“, ohne φανέρωσις mit „Verkündigung“ zu verengen. Die allgemeine und nicht näher bestimmte Formulierung für τὰ κρυπτὰ τῆς αἰσχύνης bleibt erhalten.'
