review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft den Sinn und die zentrale Glauben-/Reden-Parallele. Das einleitende »weil« legt jedoch die kausale Nuance des griechischen Partizips ἔχοντες stärker fest, als der Text sie grammatisch ausdrücklich bestimmt. Eine weniger festlegende Anbindung ist vorzuziehen.
  naturalness: Der Vers ist insgesamt gut verständlich und angemessen würdevoll. Mit Semikolon statt »und« wird die knappe rhetorische Folgerung des griechischen Satzes im Deutschen klarer wiedergegeben. Die Formulierung »sein eigenes Glauben« in der Fußnote ist idiomatisch und sachlich unglücklich.
  terminology: »Geist des Glaubens«, »glaubte/glauben« und »redete/reden« sind treffend. Die Fußnote zu »Geist« wahrt die mögliche Deutung als Heiligen Geist, ohne sie dem Haupttext aufzuzwingen.
  issues:
  - severity: medium
    issue: Die kausale Einleitung »weil wir … haben« bestimmt die Funktion von ἔχοντες zu stark.
    rationale: Das Partizip kann den Bezug zum folgenden Hauptsatz herstellen, ohne eine ausschließlich kausale Relation festzulegen. »Mit demselben Geist des Glaubens« bewahrt die Verbindung und lässt die Nuance offener.
  - severity: low
    issue: Fußnote b spricht von »sein eigenes Glauben und Reden«.
    rationale: Der Bezug ist missverständlich und die Nominalformulierung stilistisch schwach. Paulus setzt vielmehr das Glauben und Reden von sich und seinen Mitarbeitern zum Zeugnis des Psalmisten in Beziehung.
  revised_text: 'Doch mit demselben Geist des Glaubens – wie geschrieben steht: »Ich glaubte, darum redete ich« – glauben auch wir; darum reden auch wir[a].'
  revised_footnotes:
