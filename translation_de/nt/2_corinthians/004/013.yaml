  rationale: Die Revision vermeidet die nicht zwingend vorgegebene kausale Auslegung des Partizips, erhält die Ambiguität von πνεῦμα und gibt die Folgerung von διό sowie die hervorgehobene Entsprechung durch »auch wir« prägnant wieder. Die Fußnotenmarker wurden an die Reihenfolge der Fußnoten angepasst.
