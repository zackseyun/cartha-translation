  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: de
  text: 'Doch mit demselben Geist des Glaubens – wie geschrieben steht: »Ich glaubte, darum redete ich« – glauben auch wir; darum reden auch wir[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Geist des Glaubens« kann eine gemeinsame, vom Glauben geprägte Haltung meinen oder den Heiligen Geist als Ursprung und Träger des Glaubens.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: Doch weil wir … haben
  rationale: Das Partizip wird im Deutschen natürlich als begründender Nebensatz wiedergegeben. δέ markiert dabei den leichten Gegensatz beziehungsweise die Weiterführung des Gedankens.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: denselben Geist des Glaubens
  rationale: Die Genitivverbindung bleibt formal erhalten. »Geist« kann hier eine vom Glauben geprägte innere Haltung oder den Heiligen Geist bezeichnen; die Formulierung lässt diese Ambiguität bestehen.
- source_word: κατὰ τὸ γεγραμμένον
  choice: wie geschrieben steht
  rationale: Dies ist die geläufige, würdevolle deutsche Einleitungsformel für ein Schriftzitat.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: Ich glaubte, darum redete ich
  rationale: Die Verben und der Folgezusammenhang werden direkt und in derselben Zeitstufe wie im griechischen Zitat wiedergegeben.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: glauben auch wir
  rationale: Die Stellung von »auch wir« bewahrt die Betonung der Übereinstimmung mit dem Sprecher des Psalms.
- source_word: διὸ καὶ λαλοῦμεν
  choice: und darum reden auch wir
  rationale: »Darum« gibt die Folgerung wieder; »auch wir« erhält die rhetorische Parallele zum Zitat.
theological_decisions:
- issue: Bezeichnet πνεῦμα den Heiligen Geist oder eine gemeinsame, vom Glauben geprägte Haltung?
  choice: Geist des Glaubens
  alternative: 'Geist als innere Haltung des Glaubens; ausdrücklich: Heiliger Geist, der Glauben wirkt'
  rationale: Der unmittelbare Zusammenhang mit »Ich glaubte, darum redete ich« legt eine glaubensgeprägte Haltung nahe, doch der griechische Ausdruck schließt einen Bezug auf den Heiligen Geist nicht aus. Im Deutschen wird »Geist« als Substantiv ohnehin großgeschrieben; die Fußnote bewahrt daher die echte Mehrdeutigkeit.
- issue: Wiedergabe der Wortgruppe πιστεύω/πίστις
  choice: glaubte / glauben / Glaubens
  alternative: vertraute / vertrauen
  rationale: Die verwandte deutsche Wortgruppe erhält die sprachliche Verbindung im Vers und entspricht dem direkten Sinn, ohne die Bedeutung auf bloßes Fürwahrhalten zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kausale Auflösung des griechischen Partizips sorgt für einen natürlichen Satzfluss; Gedankenstriche grenzen das Schriftzitat klar ab. »Reden« bewahrt die Wiederholung desselben griechischen Verbs in Zitat und Anwendung.
