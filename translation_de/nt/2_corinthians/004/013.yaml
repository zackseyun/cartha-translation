    reason: alternative_reading
  - marker: b
    text: Paulus zitiert Psalm 116,10; in der Septuaginta steht die Stelle in Psalm 115,1. Er stellt damit das Glauben und Reden von sich und seinen Mitarbeitern neben das Zeugnis des Psalmisten.
    reason: cross_reference
