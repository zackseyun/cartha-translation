reference: 2 Corinthians 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: de
  text: Denn das alles geschieht um euretwillen, damit die Gnade durch immer mehr Menschen[a] zunimmt und den Dank zur Ehre Gottes überreich werden lässt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Vielen“ oder „durch eine größere Zahl“. Der griechische Ausdruck kann allgemein viele Menschen oder eine wachsende Zahl von Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: Denn das alles
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ. „Das alles“ gibt den umfassenden Ausdruck τὰ πάντα natürlich wieder und verweist zugleich auf das zuvor Gesagte.
- source_word: δι’ ὑμᾶς
  choice: um euretwillen
  rationale: διά mit Akkusativ bezeichnet hier den Nutzen beziehungsweise das Wohl der Adressaten; „um euretwillen“ bringt dies präzise und würdig zum Ausdruck.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ bewahrt den Zweck- beziehungsweise Ergebnissinn der griechischen Konjunktion.
- source_word: ἡ χάρις
  choice: die Gnade
  rationale: Der bestimmte Artikel wird im Deutschen natürlich beibehalten. „Gnade“ wahrt die theologische und semantische Weite des Begriffs.
- source_word: πλεονάσασα
  choice: zunimmt
  rationale: Das Partizip wird zur besseren Verständlichkeit als koordinierte Verbform wiedergegeben; die Vorstellung von Wachstum beziehungsweise Mehrung bleibt erhalten.
- source_word: διὰ τῶν πλειόνων
  choice: durch immer mehr Menschen
  rationale: Die Wiedergabe wahrt die instrumentale Präposition διά und bringt den komparativen Gedanken einer wachsenden Zahl von Menschen zum Ausdruck, ohne die möglichen Alternativen zu verschweigen.
- source_word: τὴν εὐχαριστίαν
  choice: der Dank
  rationale: Gemeint ist der an Gott gerichtete Dank. „Der Dank“ ist im heutigen Deutsch natürlicher als „die Danksagung“ und bewahrt den Sinn.
- source_word: περισσεύσῃ
  choice: überreich wird
  rationale: Die Formulierung gibt den Gedanken des Überflusses wieder und vermeidet das im Deutschen unnatürliche Bild, dass ein abstrakter Dank wörtlich „überfließt“.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: zur Ehre Gottes
  rationale: „Zur Ehre Gottes“ gibt die durch εἰς bezeichnete Zielrichtung idiomatisch und präzise wieder.
theological_decisions:
- issue: Bedeutung und Bezug der „Gnade“ im Zwecksatz
  choice: „Gnade“ bleibt als Gottes wirksame Zuwendung in ihrer ganzen Bedeutungsbreite stehen.
  alternative: Die Gnade ausdrücklich als rettende Gnade für neue Empfänger oder ausschließlich als Gottes Wirken im apostolischen Dienst bestimmen.
  rationale: Der Vers legt nicht eindeutig fest, ob vor allem die Ausbreitung der rettenden Gnade oder das gnädige Wirken Gottes durch den apostolischen Dienst gemeint ist. Die Übersetzung soll diese Spannung nicht auflösen.
- issue: Syntaktisches Verhältnis von Gnade und Dank
  choice: 'Die griechische Partizipialkonstruktion wird als Folge zweier eng verbundener Vorgänge wiedergegeben: Die Gnade nimmt zu, und der Dank wird überreich.'
  alternative: „Damit die Gnade … den Dank überreich werden lässt.“
  rationale: Die Alternative bildet eine mögliche transitive Auffassung von περισσεύω deutlicher ab. Die gewählte Fassung folgt der inhaltlichen Bewegung des Satzes in natürlichem Deutsch, ohne einen engeren kausativen Mechanismus festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Um euretwillen“ ist leicht gehoben, aber geläufig und präzise; „der Dank“ vermeidet unnötig kirchensprachliche Schwere.
