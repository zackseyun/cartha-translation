revisions:
- from: Doch diesen Schatz haben wir in Gefäßen aus Ton[a], damit deutlich wird, dass die außerordentliche Kraft von Gott kommt und nicht von uns.[b]
  to: Doch diesen Schatz haben wir in Gefäßen aus Ton[a], damit die überragende Kraft von Gott kommt und nicht von uns.[b]
  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen Text enthaltene Ergänzung „deutlich wird“. Sie bewahrt die Metapher, die Zwecknuance von ἵνα und den Kontrast der Kraft Gottes mit dem, was aus den Sprechenden selbst käme. Die Fußnoten bleiben an den jeweiligen Ausdrücken verankert und bieten eine sachliche, formnähere Alternative.
