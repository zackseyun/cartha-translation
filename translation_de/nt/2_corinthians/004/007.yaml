source:
  edition: SBLGNT
  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: de
  text: Doch diesen Schatz haben wir in Gefäßen aus Ton[a], damit die überragende Kraft von Gott kommt und nicht von uns.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in irdenen Gefäßen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder formnäher: „damit das Übermaß der Kraft Gottes sei und nicht aus uns stamme.“'
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: Doch ... haben wir
  rationale: Das Präsens wird als gegenwärtiger Besitz wiedergegeben; „doch“ markiert den Kontrast zum vorausgehenden Zusammenhang in natürlichem Deutsch.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: diesen Schatz
  rationale: Bewahrt Substantiv und Demonstrativpronomen und verweist damit zurück auf das zuvor beschriebene Licht beziehungsweise die Verkündigung, ohne die Metapher auszudeuten.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: in Gefäßen aus Ton
  rationale: ὀστράκινος bezeichnet etwas aus gebranntem Ton beziehungsweise Irdenware; σκεῦος ist ein Gefäß oder Behälter. Die Formulierung ist modern und hält das Bild schlichter, zerbrechlicher Gefäße fest.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die Zweck- beziehungsweise Folgewirkung der ἵνα-Konstruktion idiomatisch wieder.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: die außerordentliche Kraft
  rationale: Der attributive Ausdruck bildet die außergewöhnliche, jedes gewöhnliche Maß übersteigende Qualität der δύναμις natürlich ab, ohne im Deutschen die schwerfällige Nominalfügung „das Übermaß der Kraft“ zu erzwingen.
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: deutlich wird, dass ... von Gott kommt und nicht von uns
  rationale: Das griechische ᾖ mit Genitiv bezeichnet die Zugehörigkeit beziehungsweise Herkunft der Kraft, während ἐξ ausdrücklich die Quelle markiert. Die deutsche Formulierung macht den beabsichtigten Herkunftskontrast verständlich; „deutlich wird“ bringt die im Zweckzusammenhang liegende Erkennbarkeit zum Ausdruck.
theological_decisions:
- issue: Bedeutung der Metapher von Schatz und Tongefäßen
  choice: Die Metapher bleibt im Haupttext unerklärt.
  alternative: „diesen Schatz des Evangeliums“ beziehungsweise „in unseren gebrechlichen Körpern“
  rationale: Der Kontext legt Bezüge nahe, doch der Vers selbst nennt weder das Evangelium noch den Körper ausdrücklich. Eine Ausdeutung würde die Spannung des Bildes vorzeitig auflösen.
- issue: Bedeutung des ἵνα-Satzes
  choice: „damit deutlich wird“ als zweckorientierte Formulierung
  alternative: 'Reine Folge: „sodass deutlich ist“'
  rationale: ἵνα kann Zweck und Folge berühren. „Damit“ wahrt die Zwecknuance; „deutlich wird“ vermeidet zugleich die unnatürliche Aussage, die Kraft müsse erst Gottes Eigentum werden.
- issue: Genitiv τοῦ θεοῦ im Kontrast zu ἐξ ἡμῶν
  choice: 'Herkunft der Kraft: „von Gott kommt“'
  alternative: 'Zugehörigkeit: „Gottes ist“'
  rationale: Der folgende Ausdruck „nicht von uns“ stellt die Quelle in den Vordergrund. Die Fußnote hält die formal nähere Zugehörigkeitslesart offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Metapher bleibt knapp und unaufgelöst. „Gefäße aus Ton“ ist allgemein verständlich; „irdene Gefäße“ wird als traditionell-formale Alternative in der Fußnote bewahrt.
