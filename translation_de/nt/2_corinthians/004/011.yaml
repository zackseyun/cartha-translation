id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: de
  text: Denn wir, die wir leben, werden um Jesu willen[a] immer dem Tod ausgeliefert, damit auch das Leben Jesu in unserem sterblichen Fleisch[b] offenbar wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen Jesus“ beziehungsweise „für Jesus“.'
    reason: lexical_alternative
  - marker: b
    text: „Fleisch“ bezeichnet hier die sterbliche leibliche Existenz, nicht die „sündige Natur“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεί
  choice: immer
  rationale: Das Adverb bezeichnet eine fortdauernde oder immer wiederkehrende Lage. „Immer“ ist direkt, natürlich und lässt beide Nuancen zu.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ bewahrt den begründenden Anschluss an den vorherigen Vers, ohne die Beziehung näher auszudeuten.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: wir, die wir leben
  rationale: Die substantivierte Präsenspartizipialform wird so verständlich wiedergegeben; zugleich bleibt der betonte Gegensatz zum Tod erhalten.
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: werden dem Tod ausgeliefert
  rationale: Die Form ist Präsens Passiv und beschreibt ein fortdauerndes Ausgeliefertwerden. „Dem Tod ausgeliefert“ ist im Deutschen idiomatisch und bewahrt die Zielrichtung auf den Tod.
- source_word: διὰ Ἰησοῦν
  choice: um Jesu willen
  rationale: διά mit Akkusativ bezeichnet hier Ursache oder Beweggrund. „Um Jesu willen“ bringt dies würdig und knapp zum Ausdruck; die mögliche kausale Wiedergabe bleibt in der Fußnote sichtbar.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck- beziehungsweise Ergebniszusammenhang natürlich wieder, ohne ihn einseitig festzulegen.
- source_word: καί
  choice: auch
  rationale: „Auch“ erhält die Entsprechung zwischen dem Ausgeliefertwerden um Jesu willen und dem Offenbarwerden seines Lebens.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: das Leben Jesu
  rationale: Die Genitivverbindung bleibt eng an der griechischen Form und wahrt den theologischen Gegensatz zwischen Leben und Tod.
- source_word: φανερωθῇ
  choice: offenbar wird
  rationale: Das Passiv bleibt erhalten, ohne einen Handelnden hinzuzufügen. „Offenbar wird“ ist würdig, verständlich und näher am Sinn von φανερόω als eine rein visuelle Formulierung.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: in unserem sterblichen Fleisch
  rationale: „Fleisch“ bewahrt die konkrete Ausdrucksweise des Paulus. Das Adjektiv „sterblich“ macht deutlich, dass die leibliche, dem Tod ausgesetzte Existenz gemeint ist.
theological_decisions:
- issue: Bedeutung von σάρξ im paulinischen Zusammenhang
  choice: Fleisch im Sinn der sterblichen leiblichen Existenz
  alternative: Körper; sündige Natur
  rationale: Der unmittelbare Zusammenhang mit Sterblichkeit und Ausgeliefertwerden weist auf die verletzliche körperliche Existenz. „Sündige Natur“ würde hier eine ethisch-theologische Bedeutung eintragen, die der Satz nicht verlangt.
- issue: Bedeutung von διὰ Ἰησοῦν
  choice: um Jesu willen
  alternative: wegen Jesus; für Jesus
  rationale: Die Formulierung kann Ursache beziehungsweise Anlass und zugleich das Leiden in der Bindung an Jesus ausdrücken. Die Hauptfassung ist idiomatisch; die Fußnote bewahrt die echte Bedeutungsbreite.
- issue: Zweck oder Ergebnis bei ἵνα
  choice: damit
  alternative: sodass
  rationale: „Damit“ erhält die vorherrschende finale Kraft, kann im Zusammenhang jedoch auch die daraus hervorgehende Folge einschließen und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Um Jesu willen“ und „offenbar wird“ sind leicht gehoben, aber allgemein verständlich. Satzbau und Wiederholung von „Jesus“ bewahren den Nachdruck und die Spannung des griechischen Textes.
