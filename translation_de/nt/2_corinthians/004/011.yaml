  source_fidelity: 'Die Übersetzung gibt die griechischen Satzglieder und ihre Beziehungen zuverlässig wieder: γάρ („Denn“), das fortdauernde Passiv παραδιδόμεθα („werden ... ausgeliefert“), ἀεί („immer“), den kausalen Bezug von διὰ Ἰησοῦν („um Jesu willen“) sowie den finalen bzw. resultativen ἵνα-Satz („damit“). „Dem Tod ausgeliefert“ ist eine idiomatische deutsche Wiedergabe von εἰς θάνατον παραδιδόμεθα. Das Passiv von φανερωθῇ bleibt in „offenbar wird“ offen erhalten.'
