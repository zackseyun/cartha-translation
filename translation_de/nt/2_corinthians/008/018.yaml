  rationale: Die Revision ersetzt die unzulässig kausale Wiedergabe „wegen des Evangeliums“ durch „im Evangelium“, um den offenen Bedeutungsumfang von ἐν τῷ εὐαγγελίῳ zu erhalten. Sie gibt ἔπαινος als „Lob“ wieder und übernimmt den im Quelltext gesetzten Gedankenstrich. Die Fußnote bietet nur eine gleich offene lexikalische Alternative und vermeidet die nicht ausdrücklich genannte Einschränkung auf einen Dienst am Evangelium.
