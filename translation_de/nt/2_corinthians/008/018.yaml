  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: de
  text: Wir haben aber zusammen mit ihm den Bruder gesandt, dessen Lob im Evangelium in allen Gemeinden bekannt ist—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Anerkennung im Evangelium in allen Gemeinden bekannt ist“. Die Wendung „im Evangelium“ lässt offen, in welchem Sinn sein Lob mit dem Evangelium verbunden ist.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: wir haben … zusammen mit … gesandt
  rationale: Der Aorist bezeichnet hier eine vollzogene Sendung; die Zusammensetzung mit συν- drückt aus, dass der Bruder den zuvor genannten Mann begleitet.
- source_word: δὲ
  choice: aber
  rationale: δέ führt den Bericht mit einem milden Übergang fort. „Aber“ ist hier idiomatisch, ohne einen starken Gegensatz zu behaupten.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: μετά mit dem Genitiv bezeichnet Begleitung.
- source_word: τὸν ἀδελφόν
  choice: den Bruder
  rationale: Der bestimmte Ausdruck bezeichnet in diesem Reise- und Sendungskontext einen konkreten männlichen Glaubensbruder; ein nicht ausdrücklich vorhandenes „unseren“ wird nicht ergänzt.
- source_word: οὗ ὁ ἔπαινος
  choice: der … Anerkennung findet
  rationale: Die deutsche Verbalkonstruktion gibt den Sinn des nominalen griechischen Ausdrucks natürlich wieder. ἔπαινος kann Lob, Anerkennung oder Empfehlung bezeichnen.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: wegen des Evangeliums
  rationale: Die Präpositionalphrase verbindet die Anerkennung mit dem Evangelium. „Wegen“ gibt diesen Bezug verständlich wieder, ohne eine bestimmte Tätigkeit wie Predigen oder ein Amt einzutragen.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: in allen Gemeinden
  rationale: διά mit dem Genitiv beschreibt hier die Verbreitung durch die Gesamtheit der Gemeinden; idiomatisches Deutsch verwendet dafür „in allen Gemeinden“.
- source_word: ἐκκλησιῶν
  choice: Gemeinden
  rationale: Im paulinischen Zusammenhang sind örtliche christliche Gemeinschaften gemeint; „Gemeinden“ ist dafür im modernen Standarddeutsch klar und geläufig.
theological_decisions:
- issue: Identität und Status von ἀδελφός
  choice: „den Bruder“ als Bezeichnung eines bestimmten männlichen christlichen Mitarbeiters
  alternative: „den Glaubensbruder“ oder eine generische Wiedergabe als „den Mitchristen“
  rationale: Maskuliner Singular, bestimmter Artikel und Reisesituation weisen auf einen konkreten Mann. „Bruder“ bewahrt zugleich die frühchristliche Beziehungsbezeichnung.
- issue: Bedeutungsumfang von ἐν τῷ εὐαγγελίῳ
  choice: Der Bezug zum Evangelium bleibt allgemein und wird nicht auf eine bestimmte Dienstform eingeengt.
  alternative: „für seine Verkündigung des Evangeliums“ oder „für seine Arbeit am Evangelium“
  rationale: Der griechische Text nennt weder ausdrücklich Verkündigung noch Amt oder konkrete Tätigkeit. Eine engere Fassung würde mehr festlegen, als der Wortlaut hergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist flüssig, bewahrt aber die Unbestimmtheit hinsichtlich der konkreten Leistung des Bruders. Der Gedankenstrich der konsultierten englischen Fassung gehört nicht zum griechischen Wortlaut des Einzelverses und wurde daher nicht übernommen.
