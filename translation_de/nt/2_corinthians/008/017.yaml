  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: de
  text: Denn er nahm die Bitte an; doch weil er noch eifriger war, machte er sich aus eigenem Antrieb auf den Weg zu euch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet hier eine Begründung beziehungsweise Erläuterung zum Dank des vorherigen Verses ein und gibt die kausal-erklärende Kraft natürlich wieder.
- source_word: παράκλησιν
  choice: die Bitte
  rationale: Bezeichnet im unmittelbaren Zusammenhang die an Titus gerichtete Aufforderung oder Bitte, nicht in erster Linie Trost.
- source_word: ἐδέξατο
  choice: nahm … an
  rationale: Gibt die bereitwillige Annahme der Bitte idiomatisch und ohne zusätzliche Deutung wieder.
- source_word: σπουδαιότερος
  choice: noch eifriger
  rationale: Bewahrt die komparative Bedeutung des Adjektivs und bezeichnet den gesteigerten Eifer des Titus.
- source_word: ὑπάρχων
  choice: weil er … war
  rationale: Das Partizip wird als begleitender, wahrscheinlich begründender Umstand natürlich ins Deutsche übertragen.
- source_word: αὐθαίρετος
  choice: aus eigenem Antrieb
  rationale: Bringt zum Ausdruck, dass Titus freiwillig und aus eigener Initiative handelte.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: machte er sich … auf den Weg zu euch
  rationale: Gibt den Aufbruch und die Bewegung zu den Adressaten natürlicher und genauer wieder als ein bloßes „ging zu euch“; der griechische Aorist kann als brieflicher Aorist den aus Sicht der Leser bereits erfolgenden Besuch bezeichnen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt den Gegensatz zwischen der angenommenen Bitte und der darüber hinausgehenden eigenen Initiative des Titus. Keine Fußnote ist nötig, da die wichtigsten Sinnnuancen im Haupttext verständlich erhalten bleiben.
