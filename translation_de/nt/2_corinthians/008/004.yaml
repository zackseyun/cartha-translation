source:
  edition: SBLGNT
  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: de
  text: wobei sie uns mit großem Nachdruck um die Gnade und die Teilhabe am Dienst für die Heiligen baten—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um das Vorrecht, sich am Dienst für die Heiligen zu beteiligen.“'
    reason: χάρις und κοινωνία können im Zusammenhang der Sammlung idiomatisch als das gnädig gewährte Vorrecht zur Beteiligung verstanden werden; zugleich lässt der griechische Wortlaut beide Begriffe ausdrücklich nebeneinander stehen.
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: mit großem Nachdruck
  rationale: μετά mit Genitiv bezeichnet die begleitende Art und Weise. Im Zusammenhang mit δεόμενοι meint παράκλησις hier ein eindringliches Drängen oder Bitten, nicht Trost. „Mit großem Nachdruck“ gibt die Intensität natürlich wieder, ohne die folgende Bitte unnötig zu verdoppeln.
- source_word: δεόμενοι ἡμῶν
  choice: wobei sie uns … baten
  rationale: δέομαι bezeichnet ein inständiges Bitten oder Flehen; ἡμῶν nennt die angesprochenen Personen. Die Stärke des Verbs wird zusammen mit „mit großem Nachdruck“ ausgedrückt. Die Partizipialform wird durch „wobei“ an den vorausgehenden Satz angebunden.
- source_word: τὴν χάριν
  choice: die Gnade
  rationale: χάρις kann Gnade, Gunst oder Vorrecht bedeuten. „Gnade“ bewahrt Paulus’ charakteristische Wortwahl und deren theologischen Klang; im Kontext bezeichnet sie zugleich das gnädig gewährte Vorrecht, sich an der Sammlung zu beteiligen.
- source_word: τὴν κοινωνίαν
  choice: die Teilhabe
  rationale: κοινωνία bedeutet Gemeinschaft, Teilhabe oder Beteiligung. Hier steht die konkrete Beteiligung am Hilfsdienst im Vordergrund; „Teilhabe“ bewahrt zugleich den gemeinschaftlichen Beiklang.
- source_word: τῆς διακονίας
  choice: an diesem Dienst
  rationale: διακονία bezeichnet hier den praktischen Hilfsdienst. Der deutsche Anschluss „Teilhabe an“ verlangt eine entsprechende Umformung der griechischen Genitivkette. „diesem“ verdeutlicht idiomatisch den im Kontext bekannten Dienst, ohne einen neuen Referenten einzuführen.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: für die Heiligen
  rationale: Die präpositionale Wendung bestimmt den Dienst als auf die Heiligen ausgerichtet beziehungsweise ihnen zugutekommend. „für“ ist im Deutschen dafür natürlicher als „zu“.
theological_decisions:
- issue: Wiedergabe von ἅγιοι
  choice: die Heiligen
  alternative: Gottes heiliges Volk
  rationale: „Die Heiligen“ bewahrt Paulus’ Bezeichnung für die Glaubenden und die begriffliche Kontinuität. Gemeint ist keine später kanonisierte Sondergruppe, sondern die Glaubenden als Gottes geheiligtes Volk.
- issue: Verhältnis von χάρις und κοινωνία
  choice: „die Gnade und die Teilhabe“ als zwei koordinierte Begriffe bewahren
  alternative: „das Vorrecht, sich … zu beteiligen“ als einheitliche Umschreibung
  rationale: Der griechische Text verbindet zwei Akkusative mit καί. Die Hauptfassung erhält diese formale und theologische Spannung, während die Fußnote die kontextuell plausible zusammenfassende Deutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bewahrt den im Ausgangstext offenen Satzanschluss an den folgenden Kontext. Die Formulierung ist als Fortsetzung von Vers 3 syntaktisch abhängig und vermeidet deshalb einen künstlich abgeschlossenen Einzelsatz.
