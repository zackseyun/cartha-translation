translation:
  language: de
  text: Dabei treffen wir diese Vorsorge, damit uns niemand im Blick auf diese reiche Gabe[a], die von uns verwaltet wird, Vorwürfe macht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser reichlichen Spende“ oder „dieser Fülle“. Das griechische Wort kann eine großzügige oder umfangreiche Gabe bezeichnen.'
