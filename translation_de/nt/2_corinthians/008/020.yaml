  - marker: b
    text: 'Oder: „damit niemand uns im Blick auf diese reiche Gabe beanstandet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: Dabei treffen wir diese Vorsorge
  rationale: Das mediale Partizip bezeichnet hier eine vorbeugende Maßnahme, mit der möglicher Beanstandung vorgebeugt werden soll. „Vorsorge treffen“ gibt diesen Sinn im Deutschen natürlich wieder; „dabei“ bindet den Vers an den vorausgehenden Zusammenhang an.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: damit uns niemand … Vorwürfe macht
  rationale: μή mit dem Konjunktiv bezeichnet hier die beabsichtigte Vermeidung eines möglichen Vorwurfs. μωμάομαι bedeutet tadeln, beanstanden oder Vorwürfe machen.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: wegen dieser reichen Gabe
  rationale: ἐν bezeichnet hier den Bereich beziehungsweise Anlass möglicher Beanstandung. ἁδρότης meint Fülle, Großzügigkeit oder eine reichliche Gabe; im Kontext ist die umfangreiche Sammlung gemeint.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: die von uns verwaltet wird
  rationale: διακονέω bezeichnet in diesem Zusammenhang den verantwortlichen Dienst bei der Durchführung und Handhabung der Sammlung. „Verwaltet“ ist sachlich und verständlich, ohne einen besonderen kirchlichen Fachsinn einzutragen.
theological_decisions:
- issue: Paulus’ Anliegen beim Umgang mit der Sammlung
  choice: Der Vers betont vorbeugende Rechenschaft und den Schutz vor berechtigten oder möglichen Vorwürfen bei der Verwaltung der Gabe.
  alternative: Die Aussage lediglich als organisatorische Reisevorkehrung wiederzugeben.
  rationale: Die Konstruktion στελλόμενοι … μή τις … μωμήσηται richtet den Blick ausdrücklich auf eine vorbeugende Maßnahme gegen Beanstandung. Darüber hinausgehende lehrmäßige Folgerungen werden nicht in den Text aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Reiche Gabe“ hält den konkreten Sammlungskontext und zugleich die Bedeutungsbreite von ἁδρότης fest. Die Satzstellung macht den Anlass möglicher Vorwürfe klar, ohne die ethische Spannung abzuschwächen.
