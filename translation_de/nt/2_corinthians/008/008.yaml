  verdict: revise
  source_fidelity: Der Entwurf gibt ἐπιταγή, σπουδή, ἀγάπη, γνήσιον und δοκιμάζω grundsätzlich treffend wieder. Das „auch“ legt jedoch nahe, dass Paulus neben dem Erwähnen des Eifers anderer zusätzlich prüfe. Das griechische καί verbindet hier am natürlichsten die durch διά eingeleitete Bezugsgröße mit dem Prüfgegenstand; eine additive Aussage „ich prüfe auch“ ist nicht erforderlich.
  naturalness: „Ich sage das nicht als Gebot“ ist modernes, klares Standarddeutsch. Die Umstellung zu „indem ich durch den Eifer anderer ... prüfe“ bildet den partizipialen Zusammenhang idiomatisch und transparenter ab.
  terminology: „Gebot“, „Eifer“, „Liebe“, „Echtheit“ und „prüfen“ sind angemessen. „Andere“ sollte ohne bestimmten Artikel stehen, da ἑτέρων nicht näher bestimmt ist.
