  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: de
  text: Ich sage das nicht als Gebot, sondern indem ich durch den Eifer anderer die Echtheit eurer Liebe prüfe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Ernsthaftigkeit“, „Einsatzbereitschaft“ oder „den Fleiß anderer“. Das griechische Wort kann je nach Zusammenhang Eifer, Ernsthaftigkeit, Einsatzbereitschaft oder Fleiß bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: Gebot
  rationale: „Gebot“ gibt die autoritative Weisung natürlich wieder und bewahrt den Gegensatz zur freiwilligen, aus Liebe kommenden Großzügigkeit.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: durch den Eifer der anderen
  rationale: διά mit Genitiv bezeichnet hier am ehesten das Mittel bzw. den Anlass; „Eifer“ umfasst engagierte Ernsthaftigkeit und Bereitwilligkeit, ohne die anderen im Haupttext näher zu bestimmen.
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die direkte und kontextgerechte Wiedergabe; sie zeigt sich hier praktisch im Geben.
- source_word: τὸ ... γνήσιον
  choice: ob ... echt ist
  rationale: Die prädikative deutsche Formulierung gibt die substantivierte Wendung idiomatisch wieder und bewahrt den Gedanken der Echtheit.
- source_word: δοκιμάζων
  choice: prüfe ich
  rationale: Das Partizip bezeichnet eine mit dem Sagen verbundene Prüfung; ein finites Verb ist im Deutschen natürlich. „Prüfen“ lässt sowohl Erprobung als auch Feststellung der Bewährung offen.
- source_word: καί
  choice: auch
  rationale: „Auch“ bewahrt die additive Kraft von καί.
theological_decisions:
- issue: Paulus’ Haltung zur Aufforderung zum Geben
  choice: Paulus erklärt ausdrücklich, dass er nicht in Form eines Gebots spricht, sondern die Echtheit der Liebe der Korinther prüft.
  alternative: Paulus mildert lediglich ein dennoch verbindliches Gebot rhetorisch ab.
  rationale: οὐ κατ’ ἐπιταγὴν λέγω verneint ausdrücklich die Form eines autoritativen Gebots. Die Übersetzung bewahrt die Spannung zwischen apostolischer Autorität und freiwilligem, von Liebe getragenem Handeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, während „ob eure Liebe echt ist“ im Deutschen natürlicher klingt als das abstrakte „die Echtheit eurer Liebe“. Der Fußnotenmarker steht unmittelbar nach dem übersetzten Vers.
