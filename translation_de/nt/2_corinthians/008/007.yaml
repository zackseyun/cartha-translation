source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: de
  text: Doch wie ihr in allem überreich seid – im Glauben, im Reden, in der Erkenntnis, in allem Eifer und in der Liebe, die von uns kommt und in euch ist –, so sollt ihr auch in dieser Gnade[a][b] überreich sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „in eurer Liebe zu uns“. Die griechische Wendung ist schwierig; einige Handschriften haben eine Lesart, die „eure Liebe in uns“ ergibt.'
    reason: alternative_reading
  - marker: b
    text: Gemeint ist hier das gnädige Werk des Gebens.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: überreich seid / überreich sein
  rationale: Die wiederholte Wiedergabe bewahrt das Bild der Fülle und verbindet die bereits vorhandenen Gaben der Korinther mit der Aufforderung hinsichtlich der Sammlung.
- source_word: ἐν παντί
  choice: in allem
  rationale: Die umfassende Formulierung leitet die folgende Aufzählung natürlich ein, ohne den Bezug als Art und Weise oder Bereich einseitig festzulegen.
- source_word: πίστει
  choice: im Glauben
  rationale: „Glaube“ ist hier innerhalb der Aufzählung christlicher Gaben und Eigenschaften die naheliegende, theologisch offene Wiedergabe.
- source_word: λόγῳ
  choice: im Reden
  rationale: In dieser Aufzählung bezeichnet λόγος wahrscheinlich die Fähigkeit oder Gabe des sprachlichen Ausdrucks; „im Reden“ ist im Deutschen natürlicher als „im Wort“.
- source_word: γνώσει
  choice: in der Erkenntnis
  rationale: „Erkenntnis“ gibt den paulinischen Begriff in diesem Zusammenhang angemessen und idiomatisch wieder.
- source_word: πάσῃ σπουδῇ
  choice: in allem Eifer
  rationale: σπουδή bezeichnet ernsthaften, tätigen Einsatz; „Eifer“ ist knapp, verständlich und bewahrt die substantivische Struktur der Aufzählung.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: in der Liebe, die von uns kommt und in euch ist
  rationale: Diese Formulierung bildet die beiden Präpositionalangaben ἐξ ἡμῶν und ἐν ὑμῖν verständlich ab, ohne die schwierige Wendung stillschweigend zu „eurer Liebe zu uns“ umzudeuten.
- source_word: χάριτι
  choice: Gnade
  rationale: „Gnade“ erhält die theologische Tiefe von χάρις; eine Fußnote erläutert, dass hier konkret das gnädige Werk des Gebens gemeint ist.
theological_decisions:
- issue: Bedeutung von χάρις im Zusammenhang der Sammlung für die Heiligen
  choice: Im Haupttext steht „Gnade“, wobei der Zusammenhang auf das Werk des Gebens verweist.
  alternative: Gnadengabe; Werk der Gnade; Gabe
  rationale: Paulus gebraucht χάρις nicht bloß als finanziellen Fachausdruck. „Gnade“ bewahrt die theologische Dimension, während die Fußnote den konkreten Bezug erklärt.
- issue: Deutung von τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: Die Präpositionen werden als „die Liebe, die von uns kommt und in euch ist“ bewahrt.
  alternative: eure Liebe zu uns; unsere Liebe in euch
  rationale: Die Wendung ist syntaktisch schwierig und textkritisch umstritten. Der Haupttext folgt der angegebenen SBLGNT-Lesart, die Fußnote hält die geläufige alternative Deutung und Lesart offen.
- issue: Aufforderungscharakter von ἵνα ... περισσεύητε
  choice: „so sollt ihr ... überreich sein“
  alternative: seht zu, dass ihr ... überreich seid
  rationale: Der griechische ἵνα-Satz ist elliptisch und hat hier auffordernden Sinn. Die deutsche Soll-Form gibt diesen Sinn natürlich wieder, ohne ein im griechischen Text nicht ausdrücklich vorhandenes Verb wie „seht zu“ einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wendung „überreich“ bewahrt das Leitbild des griechischen Verbs; Gedankenstriche gliedern die längere Aufzählung. Die schwer verständliche Liebesformel wird vorsichtig entfaltet, aber nicht konfessionell oder dogmatisch vereindeutigt.
