  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: de
  text: Zusammen mit ihnen haben wir unseren Bruder gesandt, den wir in vielen Dingen oft als eifrig erprobt haben, der jetzt aber wegen seines großen Vertrauens zu euch[a] noch viel eifriger ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… der jetzt durch sein großes Vertrauen zu euch noch viel eifriger ist.“ Der Dativ kann hier begründend oder die Umstände bzw. das Mittel bezeichnend verstanden werden.'
    reason: syntaktische und lexikalische Alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: Zusammen mit ihnen haben wir … gesandt
  rationale: Der Aorist bezeichnet die vollzogene Sendung; das Präfix συν- wird durch „zusammen mit ihnen“ wiedergegeben. Das deutsche Perfekt ist im heutigen Standarddeutsch natürlich.
- source_word: ἀδελφὸν ἡμῶν
  choice: unseren Bruder
  rationale: Bewahrt die familiäre christliche Bezeichnung und den männlichen Singular, ohne unnötige erklärende Erweiterung.
- source_word: ἐδοκιμάσαμεν
  choice: wir haben ihn … geprüft und dabei … erlebt
  rationale: δοκιμάζω bezeichnet eine Prüfung, durch die sich die bewährte Haltung zeigt. Die Formulierung gibt sowohl den Vorgang als auch dessen Ergebnis wieder.
- source_word: ἐν πολλοῖς πολλάκις
  choice: oft und in vielen Angelegenheiten
  rationale: Gibt sowohl die Wiederholung (πολλάκις) als auch die Vielfalt der Situationen (ἐν πολλοῖς) klar und idiomatisch wieder.
- source_word: σπουδαῖον ὄντα
  choice: als zuverlässig und eifrig erlebt
  rationale: σπουδαῖος umfasst hier ernsthaften Einsatz, Eifer und gewissenhafte Zuverlässigkeit. Die Doppelung macht den aus der Prüfung hervorgegangenen Befund im Deutschen natürlich verständlich.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: Jetzt aber ist er noch viel eifriger
  rationale: Bewahrt den ausdrücklich stark gesteigerten Komparativ πολὺ σπουδαιότερον und die Verbindung zum zuvor genannten Eifer.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: weil er großes Vertrauen zu euch hat
  rationale: Der Dativ wird kausal verstanden und erklärt seinen gesteigerten Eifer. „Vertrauen zu euch“ bewahrt die auf die Korinther gerichtete Bedeutung von εἰς ὑμᾶς.
theological_decisions:
- issue: Bezug und Nuance von πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: Das große Vertrauen des Bruders zu den Korinthern begründet seinen gesteigerten Eifer.
  alternative: Gemeint sein könnte Paulus’ Vertrauen in die Korinther; außerdem kann πεποίθησις hier als Zuversicht oder mutiges Auftreten ihnen gegenüber verstanden werden.
  rationale: Der unmittelbare Satzbau bezieht die Wendung am natürlichsten auf den ungenannten Bruder und erklärt, weshalb er jetzt eifriger ist. Da Bezug und Nuance nicht völlig eindeutig sind, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der christliche Verwandtschaftsbegriff „Bruder“ bleibt erhalten. Die Satzstruktur wurde für gute Verständlichkeit in drei Sätze gegliedert, ohne den Gedankengang oder die Steigerung abzuschwächen.
