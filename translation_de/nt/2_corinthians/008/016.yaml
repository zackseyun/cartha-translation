  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: de
  text: Gott aber sei Dank, der Titus denselben Eifer für euch ins Herz legt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der denselben Eifer für euch im Herzen des Titus gibt“.'
    reason: Die Fußnote macht die formale Konstruktion mit δίδωμι und ἐν sichtbar, während der Haupttext sie idiomatisch deutsch wiedergibt.
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Gott aber sei Dank
  rationale: Die feste Dankesformel gibt den doxologischen Sinn von χάρις mit dem Dativ τῷ θεῷ idiomatisch wieder. δέ markiert dabei einen leichten Übergang beziehungsweise Gegensatz.
- source_word: τῷ διδόντι
  choice: der … ins Herz legt
  rationale: Das Partizip bezeichnet Gott als den gegenwärtig Handelnden. Im Deutschen ist „jemandem etwas ins Herz legen“ in Verbindung mit einer inneren Haltung natürlicher als die wörtliche Formulierung „im Herzen geben“.
- source_word: τὴν αὐτὴν σπουδὴν
  choice: denselben Eifer
  rationale: σπουδή bezeichnet hier engagierte, ernsthafte Anteilnahme. „Eifer“ ist knapp, würdevoll und verständlich; αὐτήν wird mit „denselben“ ausdrücklich bewahrt.
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: Die Wendung bezeichnet die auf die Korinther gerichtete Anteilnahme und wird im Deutschen natürlich mit „für euch“ wiedergegeben.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: Titus … ins Herz
  rationale: Die Zugehörigkeit des Herzens zu Titus wird durch die deutsche Dativkonstruktion ausgedrückt. Das Bild einer von Gott im Inneren bewirkten Haltung bleibt erhalten.
theological_decisions:
- issue: Göttliches Wirken und menschlicher Eifer
  choice: Gott legt Titus den Eifer ins Herz
  alternative: Titus entwickelt aus eigener Initiative Eifer
  rationale: Der griechische Text schreibt Gott ausdrücklich das Geben dieser inneren Haltung zu, ohne damit Titus’ eigenes verantwortliches Handeln aufzuheben oder näher systematisch zu erklären.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller paulinischer Dankesformel. Die Satzstruktur bleibt nahe am Griechischen, vermeidet jedoch eine im Deutschen unnatürliche Wiedergabe von δίδωμι mit ἐν.
