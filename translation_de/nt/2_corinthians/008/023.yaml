reference: 2 Corinthians 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: de
  text: 'Was Titus betrifft: Er ist mein Partner und Mitarbeiter für euch. Was unsere Brüder betrifft: Sie sind Abgesandte der Gemeinden[a], die Herrlichkeit des Messias[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Apostel der Gemeinden“. Das griechische Wort kann sowohl Apostel als auch beauftragte Boten oder Abgesandte bezeichnen; hier legt der Zusammenhang Vertreter der Gemeinden nahe.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Christi“. Das griechische Χριστός ist der Titel „Messias“ und wird traditionell auch mit „Christus“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου … εἴτε ἀδελφοὶ ἡμῶν
  choice: Was Titus betrifft … Was unsere Brüder betrifft
  rationale: Die doppelte elliptische Konstruktion εἴτε … εἴτε stellt zwei parallele Fälle vor. Die gewählte Form gibt diese Gliederung im heutigen Deutsch natürlich wieder, ohne ein im Deutschen missverständliches konditionales „wenn“ einzuführen.
- source_word: κοινωνὸς ἐμὸς
  choice: mein Partner
  rationale: κοινωνός bezeichnet jemanden, der mit einem anderen an einer Sache Anteil hat und gemeinschaftlich mitwirkt. „Partner“ bewahrt den relationalen und dienstbezogenen Sinn in verständlichem modernem Deutsch.
- source_word: εἰς ὑμᾶς συνεργός
  choice: Mitarbeiter für euch
  rationale: συνεργός bezeichnet einen Mitwirkenden bzw. Mitarbeiter. „Für euch“ gibt die auf die korinthische Gemeinde gerichtete Beziehung von εἰς ὑμᾶς knapp wieder, ohne den Gedanken zu „zu eurem Wohl“ auszuweiten.
- source_word: ἀδελφοὶ ἡμῶν
  choice: unsere Brüder
  rationale: Der grammatisch maskuline Plural bezieht sich im Zusammenhang auf die männlichen Abgesandten, die Paulus empfiehlt; deshalb wird er geschlechtsgenau als „unsere Brüder“ wiedergegeben.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: Abgesandte der Gemeinden
  rationale: ἀπόστολοι kann allgemein Beauftragte oder Gesandte bezeichnen. Im Kontext der von Gemeinden entsandten Vertreter für die Sammlung drückt „Abgesandte“ den Sinn aus, ohne ihnen stillschweigend ein bestimmtes kirchliches Amt zuzuschreiben.
- source_word: δόξα Χριστοῦ
  choice: die Herrlichkeit des Messias
  rationale: Die verblos-appositionelle Formulierung wird eng am Griechischen bewahrt. „Herrlichkeit“ gibt δόξα wieder; „Messias“ übersetzt Χριστός als Titel.
theological_decisions:
- issue: Bedeutung von ἀπόστολοι für die ungenannten Brüder
  choice: Abgesandte der Gemeinden
  alternative: Apostel der Gemeinden
  rationale: Der Sammlungskontext und der Genitiv „der Gemeinden“ sprechen für von Gemeinden beauftragte Vertreter. Da ἀπόστολοι jedoch auch mit „Apostel“ wiedergegeben werden kann, wird diese echte lexikalische Möglichkeit in einer Fußnote erhalten.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: Χριστός ist seinem Ursprung und seiner Funktion nach ein Titel. „Messias“ macht den Titelgehalt im Deutschen sichtbar; die traditionelle Wiedergabe „Christus“ wird als lexikalische Alternative vermerkt.
- issue: Bezug und Aussage von δόξα Χριστοῦ
  choice: 'appositionell: „die Herrlichkeit des Messias“'
  alternative: 'prädikativ bzw. idiomatisch: „sie gereichen dem Messias zur Ehre“'
  rationale: Der griechische Text enthält kein Verb und lässt die genaue Nuance der knappen Nominalphrase offen. Die direkte appositionelle Wiedergabe bewahrt diese Spannung, statt sie zu einer Aussage über erwiesene Ehre auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur macht die beiden elliptischen εἴτε-Glieder verständlich. Die ungewöhnlich knappe Apposition „die Herrlichkeit des Messias“ bleibt bewusst erhalten, damit die theologische und syntaktische Spannung des Ausgangstextes nicht durch eine erklärende Paraphrase aufgelöst wird.
