base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: de
  text: 'wie geschrieben steht: »Wer viel hatte, hatte nicht zu viel, und wer wenig hatte, hatte nicht zu wenig.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit Blick auf den Manna-Bericht in 2. Mose 16,18: »Wer viel sammelte, hatte keinen Überschuss, und wer wenig sammelte, hatte keinen Mangel.«'
    reason: Die Alternative macht den erzählerischen Hintergrund des Zitats deutlich, ohne sie unzutreffend als wörtlichere Übersetzung des griechischen Wortlauts auszugeben.
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: wie geschrieben steht
  rationale: Die geläufige deutsche Zitierformel gibt das griechische Perfekt als weiterhin gültiges schriftliches Zeugnis wieder.
- source_word: Ὁ τὸ πολὺ
  choice: Wer viel hatte
  rationale: Die substantivische Wendung bezeichnet die Person mit vielem. »Hatte« ist im Deutschen natürlich und fügt den in Paulus’ Wortlaut nicht ausdrücklich genannten Vorgang des Sammelns nicht in den Haupttext ein.
- source_word: ἐπλεόνασεν
  choice: hatte nicht zu viel
  rationale: Die Formulierung gibt den Gedanken eines Überschusses idiomatisch wieder und wahrt die pointierte Parallelität mit »hatte nicht zu wenig«.
- source_word: ὁ τὸ ὀλίγον
  choice: wer wenig hatte
  rationale: Die Wiedergabe entspricht parallel der Person mit wenig und erhält den Bezug auf Besitz beziehungsweise Versorgung.
- source_word: ἠλαττόνησεν
  choice: hatte nicht zu wenig
  rationale: Das Verb bezeichnet hier Mangel oder ein Zurückbleiben hinter dem Benötigten. Die Formulierung bildet den griechischen Gegensatz verständlich und prägnant ab.
theological_decisions:
- issue: Paulus’ Verwendung des Zitats aus 2. Mose 16,18 im Zusammenhang von Ausgleich und Freigebigkeit
  choice: Das Ergebnis der Versorgung wird mit »hatte« ausgedrückt, ohne »sammelte« in den Haupttext einzufügen.
  alternative: »Wer viel sammelte, hatte keinen Überschuss, und wer wenig sammelte, hatte keinen Mangel.«
  rationale: Der unmittelbare griechische Wortlaut bei Paulus nennt das Sammeln nicht ausdrücklich. Die gewählte Fassung wahrt daher seine Anwendung auf einen gerechten Ausgleich, während die Fußnote den engeren Bezug zum Manna-Bericht sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe antithetische Satzstruktur des griechischen Zitats bleibt erhalten; inklusive Relativformen vermeiden unnötige Geschlechtsmarkierung.
