id: 2CO.8.10
reference: 2 Corinthians 8:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: de
  text: 'Und hierin gebe ich euch meinen Rat[a]: Das ist nämlich gut für euch, die ihr schon im vorigen Jahr damit begonnen habt, es nicht nur zu tun, sondern es auch zu wollen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Einschätzung“ oder „mein Urteil“. Paulus spricht hier eine wohlüberlegte Empfehlung aus, statt sie als Befehl zu formulieren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dazu bereit zu sein“. Das Griechische unterscheidet den Willen beziehungsweise die Bereitschaft von der tatsächlichen Ausführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: Rat
  rationale: Im Zusammenhang bezeichnet das Wort eine wohlüberlegte Empfehlung oder Einschätzung, nicht einen ausdrücklichen Befehl. „Rat“ ist im modernen Deutschen natürlich und bewahrt diesen Unterschied.
- source_word: ἐν τούτῳ
  choice: hierin
  rationale: Die Wendung verweist knapp und natürlich auf die unmittelbar behandelte Angelegenheit, die Sammlung.
- source_word: δίδωμι
  choice: gebe ich euch
  rationale: Die wörtliche Grundbedeutung „geben“ lässt sich in der deutschen Verbindung „Rat geben“ idiomatisch wiedergeben; „euch“ verdeutlicht den im Kontext gegebenen Adressaten.
- source_word: συμφέρει
  choice: ist gut für
  rationale: Das Verb bezeichnet, was nützt oder von Vorteil ist. „Ist gut für euch“ ist klar, gegenwärtig und vermeidet einen unnötig geschäftlichen Beiklang.
- source_word: οἵτινες
  choice: die ihr
  rationale: Die relative Form kennzeichnet die Korinther als diejenigen, die bereits begonnen hatten, und bewahrt den Anschluss des griechischen Satzes.
- source_word: τὸ ποιῆσαι
  choice: es zu tun
  rationale: Gemeint ist die tatsächliche Durchführung des zuvor behandelten Sammlungsvorhabens; das Objekt bleibt wie im Griechischen aus dem Kontext erschließbar.
- source_word: τὸ θέλειν
  choice: es zu wollen
  rationale: Die Wiedergabe wahrt die Parallele der beiden substantivierten Infinitive und unterscheidet den inneren Willen von der tatsächlichen Ausführung, ohne die Bedeutung auf bloßes Gefühl oder Begehren zu verengen.
- source_word: προενήρξασθε
  choice: schon … damit begonnen habt
  rationale: Das Verb bezeichnet einen früher erfolgten Beginn. „Schon“ bringt zusammen mit der Zeitangabe diesen zeitlichen Vorsprung natürlich zum Ausdruck.
- source_word: ἀπὸ πέρυσι
  choice: im vorigen Jahr
  rationale: Die Wendung verweist hier auf das vorausgegangene Jahr. „Im vorigen Jahr“ bezeichnet den Beginn damals, ohne eine ununterbrochene Fortdauer stärker zu behaupten, als der Text erkennen lässt.
theological_decisions:
- issue: Gewicht von Paulus’ Aussage im Verhältnis zu seiner apostolischen Autorität
  choice: Paulus gibt einen ernsthaften, wohlüberlegten Rat und formuliert hier keinen ausdrücklichen Befehl.
  alternative: Paulus erlässt eine verbindliche Weisung.
  rationale: Der unmittelbare Zusammenhang unterscheidet zwischen einem Befehl und einer persönlichen Einschätzung beziehungsweise Empfehlung (vgl. 2 Kor 8,8.10). „Rat“ wahrt diese Spannung, ohne die apostolische Bedeutung seiner Worte abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem griechischen Gedankengang nahe, während „Rat geben“ und „ist gut für euch“ natürlich und allgemein verständlich formuliert sind.
