source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: de
  text: Denn wenn die Bereitschaft vorhanden ist[a], ist sie annehmbar entsprechend dem, was jemand hat[b], nicht entsprechend dem, was jemand nicht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bereitwilligkeit“ oder „Eifer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „entsprechend dem, was immer jemand haben mag … nicht entsprechend dem, was jemand nicht hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: Bereitschaft
  rationale: Das Wort bezeichnet eine willige, bereitwillige Haltung und passt im Zusammenhang zur Bereitschaft zu großzügigem Geben, ohne den Akzent einseitig auf emotionalen Eifer zu legen.
- source_word: πρόκειται
  choice: vorhanden ist
  rationale: In dieser Verbindung bezeichnet das Verb, dass die Bereitschaft tatsächlich da ist; eine wörtliche Wiedergabe wie „vorliegt“ wäre im Deutschen weniger natürlich.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: entsprechend dem, was jemand hat
  rationale: Die Formulierung gibt den Maßstab aufgrund der verfügbaren Mittel wieder. „Jemand“ bewahrt den allgemeinen Singular, ohne ein männliches Geschlecht einzutragen.
- source_word: εὐπρόσδεκτος
  choice: willkommen
  rationale: Das Adjektiv bedeutet „annehmbar“ oder „willkommen“. „Willkommen“ ist natürlich und lässt offen, bei wem die Bereitschaft beziehungsweise Gabe Annahme findet.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: nicht entsprechend dem, was jemand nicht hat
  rationale: 'Die parallele Formulierung erhält den ausdrücklichen Gegensatz des Griechischen: Maßstab ist das Vorhandene, nicht das Fehlende.'
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: „Denn“ bewahrt die begründende Verbindung zum Kontext, „wenn“ die konditionale Form des Satzes.
theological_decisions:
- issue: Bezug und Träger der Annahme
  choice: Die Übersetzung lässt wie der griechische Text offen, bei wem die Bereitschaft beziehungsweise Gabe willkommen ist.
  alternative: „ist sie vor Gott annehmbar“ oder „wird die Gabe angenommen“
  rationale: εὐπρόσδεκτος nennt weder ausdrücklich Gott oder die Gemeinde als annehmende Instanz noch ausdrücklich die Gabe als Subjekt. Die deutsche Fassung löst diese Offenheit nicht durch einen Zusatz auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Parallelität des griechischen Satzes bleibt sichtbar; zugleich wird mit „jemand“ ein natürlicher generischer Bezug hergestellt.
