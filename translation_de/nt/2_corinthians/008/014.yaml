source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: de
  text: Zur gegenwärtigen Zeit dient euer Überfluss dazu, ihrem Mangel abzuhelfen, damit auch ihr Überfluss eurem Mangel abhilft, damit Gleichheit entsteht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ausgleich“. Gemeint ist hier eine ausgewogene gegenseitige Versorgung, nicht notwendigerweise gleicher Besitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Zum jetzigen Zeitpunkt
  rationale: Gibt den situativen Sinn von καιρός natürlich wieder und bezieht die Aussage auf die gegenwärtige Lage.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: euer Überfluss
  rationale: Bezeichnet das, was über den eigenen Bedarf hinaus vorhanden ist, ohne es unnötig auf Geld zu verengen.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: soll ihrem Mangel abhelfen
  rationale: Die zielgerichtete Konstruktion εἰς mit ὑστέρημα wird idiomatisch als Versorgung eines bestehenden Mangels ausgedrückt.
- source_word: ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: damit auch ihr Überfluss einmal eurem Mangel abhilft
  rationale: Bewahrt Zweck und Gegenseitigkeit. „Einmal“ macht im Deutschen die mögliche umgekehrte künftige Lage verständlich, ohne sie zeitlich festzulegen.
- source_word: ὅπως γένηται ἰσότης
  choice: und so ein Ausgleich entsteht
  rationale: „Ausgleich“ erfasst im Zusammenhang die ausgewogene gegenseitige Versorgung und klingt natürlicher als eine möglicherweise missverständliche abstrakte „Gleichheit“.
theological_decisions:
- issue: Bedeutung von ἰσότης im Aufruf zum Geben
  choice: Ausgleich durch gegenseitige Versorgung
  alternative: Gleichheit; Gerechtigkeit
  rationale: Der unmittelbare Zusammenhang spricht vom wechselseitigen Abhelfen materiellen Mangels. Die Übersetzung formuliert keine allgemeine Theorie gleicher Besitztümer, sondern bewahrt den kontextuellen Gedanken eines fairen Ausgleichs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Begriffe „Überfluss“ und „Mangel“ erhalten die Gegenseitigkeit des griechischen Satzes; die etwas schwerfällige wörtliche Wiederholung von „für ihren/e euren Mangel sein“ wird idiomatisch mit „abhelfen“ wiedergegeben.
