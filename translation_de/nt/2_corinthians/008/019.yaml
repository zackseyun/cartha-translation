revisions:
- from: 'Und nicht nur das: Er wurde von den Gemeinden auch dazu bestimmt,[a] uns als Reisebegleiter bei dieser Gnadengabe[b] zu begleiten, die von uns verwaltet wird, zur Ehre des Herrn selbst[c] und als Ausdruck unserer Bereitwilligkeit –'
  to: 'Und nicht nur das: Er wurde von den Gemeinden auch dazu bestimmt,[a] als unser Reisebegleiter bei dieser Gnadengabe[b] mitzuwirken, die von uns verwaltet wird, zur Ehre des Herrn selbst[c] und zum Beweis unserer Bereitwilligkeit –'
  rationale: Die Revision entfernt die nicht im Griechischen angelegte Tautologie und formuliert die Rolle des von den Gemeinden Bestimmten idiomatisch. „Mitzuwirken“ macht die mit σύν bezeichnete Beteiligung an der Gnadengabe verständlich, ohne die Art dieser Tätigkeit näher festzulegen. Der zweite πρός-Ausdruck wird als „zum Beweis unserer Bereitwilligkeit“ wiedergegeben; dies wahrt die knappe, auf die erkennbare Bereitwilligkeit bezogene Aussage und vermeidet die Ergänzung „zu helfen“. Fußnotenanker und Fußnotentexte bleiben vollständig erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:31:34Z'
