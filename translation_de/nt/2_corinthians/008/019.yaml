source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: de
  text: 'Und nicht nur das: Er wurde von den Gemeinden auch dazu bestimmt,[a] als unser Reisebegleiter bei dieser Gnadengabe[b] mitzuwirken, die von uns verwaltet wird, zur Ehre des Herrn selbst[c] und zum Beweis unserer Bereitwilligkeit –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Gemeinden ausgewählt“ bzw. „gewählt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „mit dieser Gnade“; im Zusammenhang ist die Sammlung als Gnadengabe gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Die griechische Formulierung kann auch als „zur Ehre seines Herrn“ oder schlicht als „zur Ehre des Herrn“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: dazu bestimmt
  rationale: Das Partizip bezeichnet die Auswahl bzw. Beauftragung durch die Gemeinden, ohne zwingend ein modernes förmliches Wahlverfahren vorauszusetzen.
- source_word: ἐκκλησιῶν
  choice: Gemeinden
  rationale: Im paulinischen Zusammenhang sind örtliche christliche Gemeinden gemeint; „Gemeinden“ ist im modernen Deutschen natürlich.
- source_word: συνέκδημος
  choice: Reisebegleiter
  rationale: Das Wort bezeichnet jemanden, der gemeinsam mit anderen reist, hier im Rahmen der Sammlung.
- source_word: σὺν τῇ χάριτι ταύτῃ
  choice: bei dieser Gnadengabe
  rationale: χάρις bezeichnet hier die Sammlung als gnädige Gabe; „bei“ gibt die Begleitung im Zusammenhang mit der Gabe idiomatisch wieder, während die Fußnote die wörtlichere Möglichkeit bewahrt.
- source_word: διακονουμένῃ
  choice: verwaltet wird
  rationale: Gemeint ist die verantwortliche Durchführung und Handhabung der Sammlung durch Paulus und seine Mitarbeiter.
- source_word: πρὸς
  choice: zur … und als Ausdruck
  rationale: πρός bezeichnet Ziel oder Zweck. Im zweiten Glied ergibt sich im Deutschen sinnvoll, dass die Verwaltung zugleich die Bereitwilligkeit sichtbar macht.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: des Herrn selbst
  rationale: αὐτοῦ wird intensiv verstanden und betont den Herrn; die syntaktische Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: δόξαν
  choice: Ehre
  rationale: Im Deutschen bezeichnet „zur Ehre des Herrn“ idiomatisch das Ziel, dem Herrn Anerkennung und Verherrlichung zukommen zu lassen.
- source_word: προθυμίαν ἡμῶν
  choice: als Ausdruck unserer Bereitwilligkeit
  rationale: προθυμία bezeichnet willige Bereitschaft bzw. Eifer. Die Formulierung macht den elliptischen Anschluss natürlich, ohne „zu helfen“ ergänzend einzutragen.
theological_decisions:
- issue: Bedeutung und Bezug von αὐτοῦ in πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: „zur Ehre des Herrn selbst“, wobei αὐτοῦ verstärkend aufgefasst wird
  alternative: „zur Ehre seines Herrn“ oder schlicht „zur Ehre des Herrn“
  rationale: Die verdichtete griechische Wortgruppe lässt mehrere Deutungen zu. Die Hauptfassung bewahrt die mögliche Hervorhebung des Herrn; die Fußnote hält die echte syntaktische Mehrdeutigkeit offen.
- issue: Verhältnis von δόξαν und προθυμίαν als Ziele der Verwaltung
  choice: „zur Ehre … und als Ausdruck unserer Bereitwilligkeit“
  alternative: „zur Ehre … und zu unserer Bereitwilligkeit“
  rationale: Beide Akkusative hängen formal von πρός ab. Da „zu unserer Bereitwilligkeit“ im Deutschen unklar wäre, wird das zweite Ziel als sichtbarer Ausdruck der Bereitschaft wiedergegeben, ohne den praktischen Gegenstand weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bleibt erhalten, weil der griechische Satz in den folgenden Vers hineinführt. Die Wiederholung „Reisebegleiter … begleiten“ dient der klaren Zuordnung der Gabe zum gemeinsamen Reisen; die Fußnoten stehen unmittelbar an den jeweils betroffenen Ausdrücken.
