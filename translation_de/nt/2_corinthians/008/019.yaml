  terminology: „Gemeinden“, „Gnadengabe“, „verwalten“, „Herr“ und „Bereitwilligkeit“ sind angemessen. Die Fußnoten bewahren die lexikalische und syntaktische Offenheit bei χειροτονηθείς, χάρις und αὐτοῦ τοῦ κυρίου. Für den zweiten Zweckausdruck ist „zum Beweis unserer Bereitwilligkeit“ eine natürliche, kontextuell begründete Wiedergabe, ohne eine konkrete Hilfeleistung hinzuzufügen.
