  source_fidelity: 'Die Übersetzung gibt die wesentlichen Satzglieder zutreffend wieder: Bestimmung durch die Gemeinden, gemeinsame Reise im Zusammenhang mit der Gnadengabe, deren Verwaltung durch „uns“, sowie die beiden mit πρός verbundenen Zielaspekte. „Als Ausdruck unserer Bereitwilligkeit“ ist jedoch gegenüber dem elliptischen griechischen Akkusativ bereits eine deutende Umformung. Die deutsche Wiederholung „Reisebegleiter … begleiten“ ist zudem keine Entsprechung des griechischen Textes.'
