  naturalness: „Bereitschaft zum Wollen“ ist als bewusst nahe Wiedergabe des substantivierten Infinitivs vertretbar, klingt jedoch markiert. Die überarbeitete Satzstellung ist im modernen Standarddeutsch verständlich und bewahrt zugleich die rhetorische Symmetrie des Griechischen.
  terminology: „Ausführung zu Ende führen“ gibt τὸ ποιῆσαι ἐπιτελέσατε idiomatisch wieder. „Vollendung“ für τὸ ἐπιτελέσαι erhält die lexikalische Verbindung zu ἐπιτελέω. „Aus dem, was ihr habt“ bewahrt die offene Quellen- bzw. Maßangabe von ἐκ τοῦ ἔχειν, ohne über die vorhandenen Mittel hinauszugehen.
