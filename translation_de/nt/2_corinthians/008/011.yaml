    rationale: τὸ ποιῆσαι und ἐπιτελέσατε benennen sowohl die Ausführung als auch deren Zu-Ende-Führung. „Führt … die Ausführung zu Ende“ macht diesen Bezug sichtbar, ohne den Kontext unnötig auszuformulieren.
