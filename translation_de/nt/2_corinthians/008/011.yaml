  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: de
  text: Führt nun aber auch die Ausführung zu Ende[a], damit, wie die Bereitschaft zum Wollen da war, auch die Vollendung aus dem geschieht, was ihr habt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Vollendet nun aber auch das Tun.“'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: entsprechend den Mitteln, die euch gegenwärtig zur Verfügung stehen.'
    reason: clarification
lexical_decisions:
- source_word: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε
  choice: Bringt es nun auch zu Ende
  rationale: Die Formulierung gibt den Übergang zur gegenwärtigen Ausführung und den Aufruf wieder, das bereits begonnene Vorhaben vollständig umzusetzen. Das im Deutschen notwendige „es“ verweist auf die zuvor erwähnte Sammlung.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: die Bereitschaft zum Wollen
  rationale: „Bereitschaft“ erfasst die willige Entschlossenheit von προθυμία; „zum Wollen“ bewahrt den ausdrücklich volitionalen Gehalt des substantivierten Infinitivs, ohne ihn mit der eigentlichen Ausführung gleichzusetzen.
- source_word: τὸ ἐπιτελέσαι
  choice: der Abschluss
  rationale: Die nominale Wiedergabe erhält die Gegenüberstellung von Bereitschaft und Vollendung und greift die Bedeutung von ἐπιτελέω als Zu-Ende-Bringen auf.
- source_word: ἐκ τοῦ ἔχειν
  choice: aus dem, was ihr habt
  rationale: Die Übersetzung bewahrt die offene Quellen- beziehungsweise Maßangabe des Griechischen und lässt den unmittelbaren Kontext erkennen, dass die Gabe aus den vorhandenen Mitteln kommen soll.
theological_decisions:
- issue: Geben entsprechend den vorhandenen Mitteln
  choice: Die zugesagte Sammlung soll aus dem vollendet werden, was den Korinthern tatsächlich zur Verfügung steht.
  alternative: Ein allgemeiner Aufruf, jede gute Absicht ungeachtet der eigenen Mittel auszuführen.
  rationale: Der unmittelbare Zusammenhang handelt von der zugesagten Gabe, und ἐκ τοῦ ἔχειν begrenzt ihre Ausführung auf das Vorhandene, ohne eine Leistung über die eigenen Mittel hinaus zu fordern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wahrt die griechische Vergleichsstruktur, bleibt aber verständlich. „Bereitschaft zum Wollen“ ist bewusst etwas markiert, um die Spannung zwischen Absicht und tatsächlicher Ausführung nicht einzuebnen.
