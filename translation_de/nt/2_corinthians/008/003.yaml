  - severity: low
    issue: Die Fußnote bezeichnet „aus eigener Wahl“ als wörtlich.
    rationale: αὐθαίρετοι bedeutet hier „freiwillig/aus eigenem Entschluss, aus eigener Initiative“; eine als wörtlich etikettierte deutsche Formel ist weder erforderlich noch besonders treffend.
