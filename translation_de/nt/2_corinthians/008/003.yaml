  source_fidelity: Die Wiedergabe trifft den Sinn von κατὰ δύναμιν, der parenthetischen Bekräftigung μαρτυρῶ, παρὰ δύναμιν und αὐθαίρετοι insgesamt gut. Das ergänzte „sie gaben“ ist durch den unmittelbaren Kontext gedeckt. „Sogar“ ist jedoch keine notwendige Entsprechung von καί und verstärkt die Aussage über die im Griechischen ausgedrückte Steigerung „über ihre Kräfte hinaus“ hinaus.
  naturalness: „Denn sie gaben nach ihren Kräften – das bezeuge ich – und über ihre Kräfte hinaus, aus eigenem Antrieb“ ist natürliches, würdiges modernes Standarddeutsch. Der Einschub ist klar markiert.
  terminology: '„Nach ihren Kräften“ und „über ihre Kräfte hinaus“ bewahren die Wiederaufnahme von δύναμις und lassen den Begriff angemessen offen. „Aus eigenem Antrieb“ gibt αὐθαίρετοι idiomatisch als freiwillige Eigeninitiative wieder. Die Fußnotenformulierung „wörtlich: aus eigener Wahl“ ist als angebliche wörtliche Wiedergabe zu ungenau und im Deutschen wenig idiomatisch.'
