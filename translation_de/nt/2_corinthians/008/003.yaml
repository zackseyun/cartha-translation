lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι leitet hier eine Begründung bzw. Erläuterung zur Aussage des vorhergehenden Verses ein; „Denn“ gibt diese Diskursfunktion natürlich wieder.
- source_word: κατὰ δύναμιν
  choice: nach ihren Kräften
  rationale: κατά bezeichnet hier Maß oder Maßstab, δύναμις die vorhandene Leistungsfähigkeit. Die geläufige deutsche Wendung bewahrt diesen Sinn.
- source_word: μαρτυρῶ
  choice: das bezeuge ich
  rationale: Das Präsens ist eine eingeschobene, nachdrückliche persönliche Bestätigung des Paulus. Die Wortstellung kennzeichnet den Einschub klar.
- source_word: καὶ παρὰ δύναμιν
  choice: und sogar über ihre Kräfte hinaus
  rationale: παρά mit Akkusativ bezeichnet hier das Überschreiten einer Grenze. „Sogar“ bringt die steigernde Wirkung von καί im Kontrast zu κατὰ δύναμιν zum Ausdruck.
- source_word: αὐθαίρετοι
  choice: aus eigenem Antrieb
  rationale: Das prädikative Adjektiv bezeichnet ein Handeln aus eigener Initiative und ohne äußeren Zwang. Die Formulierung ist idiomatisch und vermeidet die mögliche Verengung auf bloße innere Bereitwilligkeit.
theological_decisions:
- issue: Elliptische Konstruktion bei αὐθαίρετοι
  choice: Das aus dem Zusammenhang erkennbare Verb „gaben“ wird am Satzanfang ergänzt und gilt auch für „aus eigenem Antrieb“.
  alternative: 'Formnäher, aber im Deutschen unvollständig: „aus eigenem Antrieb“ ohne ausdrücklich genanntes Verb.'
  rationale: Der griechische Text setzt die Handlung des Gebens aus dem Kontext von Vers 2–4 voraus. Die Ergänzung macht den deutschen Satz vollständig, ohne über den offenkundigen Zusammenhang hinauszugehen.
- issue: Bezug von κατὰ δύναμιν und παρὰ δύναμιν
  choice: 'Beide Wendungen werden parallel auf die Leistungsfähigkeit der Gemeinden bezogen: „nach ihren Kräften … über ihre Kräfte hinaus“.'
  alternative: „nach ihren Mitteln … über ihre Mittel hinaus“.
  rationale: Die Übersetzung mit „Kräften“ erhält die lexikalische und rhetorische Parallelität des griechischen δύναμις und lässt offen, ob besonders finanzielle Mittel oder allgemeine Leistungsfähigkeit im Blick sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich markiert den parenthetischen Charakter von „das bezeuge ich“. Die knappe, steigernde Struktur des Griechischen bleibt erhalten.
