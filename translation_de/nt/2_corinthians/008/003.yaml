  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: de
  text: Denn sie gaben nach ihren Kräften – das bezeuge ich – und über ihre Kräfte hinaus, aus eigenem Antrieb[a].
  philosophy: optimal-equivalence
