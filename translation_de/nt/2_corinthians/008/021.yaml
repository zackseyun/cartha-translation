  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: de
  text: Denn wir sind darauf bedacht, was gut ist[a], nicht nur vor dem Herrn, sondern auch vor den Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was ehrenhaft ist“ oder „was recht ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: wir achten auf
  rationale: προνοέω bezeichnet hier ein vorausschauendes Bedachtsein auf ein einwandfreies Vorgehen. „Wir achten auf“ ist im Deutschen natürlich und bringt die bewusste Sorgfalt bei der Verwaltung der Sammlung zum Ausdruck, ohne den Ausdruck auf bloße Absicht oder Vorsorge einzuengen.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorhergehende Aussage; „Denn“ bewahrt diesen erklärenden Anschluss knapp und idiomatisch.
- source_word: καλὰ
  choice: das, was gut ist
  rationale: Das substantivierte neutrale Plural καλὰ kann das Gute, Ehrenhafte oder Rechte bezeichnen. Die breite Wiedergabe „das, was gut ist“ bewahrt den moralischen Umfang; die im Zusammenhang naheliegende Bedeutung „ehrenhaft“ wird in der Fußnote genannt.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: nicht nur ... sondern auch
  rationale: Diese Wiedergabe erhält die ausgewogene Gegenüberstellung der griechischen Korrelativkonstruktion.
- source_word: ἐνώπιον
  choice: vor
  rationale: ἐνώπιον bedeutet „vor“ im Sinn von „in den Augen“ beziehungsweise „in der Gegenwart von“. Das wiederholte „vor“ ist knapp, würdevoll und bildet beide Beurteilungsebenen parallel ab.
- source_word: κυρίου
  choice: dem Herrn
  rationale: κύριος wird gemäß seiner üblichen neutestamentlichen Bedeutung mit „Herr“ wiedergegeben; der bestimmte Artikel ist im Deutschen erforderlich.
- source_word: ἀνθρώπων
  choice: den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, die das Verhalten beobachten und beurteilen, nicht ausschließlich Männer.
theological_decisions:
- issue: Ethische Bedeutungsbreite von καλὰ im Zusammenhang finanzieller Rechenschaft
  choice: Im Haupttext breit als „das, was gut ist“ wiedergegeben
  alternative: „das, was ehrenhaft ist“ oder „das, was recht ist“
  rationale: Der Vers betrifft ein Verhalten, das sowohl vor dem Herrn als auch im Urteil anderer Menschen untadelig sein soll. Die breite Haupttextfassung vermeidet eine unnötige Festlegung auf öffentliche Anerkennung, während die Fußnote die kontextuell starke Bedeutung „ehrenhaft“ festhält.
- issue: Verhältnis göttlicher und menschlicher Beurteilung
  choice: Die parallele Formulierung „nicht nur vor dem Herrn, sondern auch vor den Menschen“ bleibt unverändert erhalten
  alternative: Eine erklärende Wiedergabe wie „nicht nur in Gottes Augen, sondern auch in den Augen der Menschen“
  rationale: 'Die direkte Parallelität bewahrt die Spannung des Textes: Gewissenhaftes Handeln orientiert sich vorrangig am Herrn, soll aber zugleich auch gegenüber menschlichen Beobachtern nachvollziehbar und einwandfrei sein.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wir achten auf“ ist bewusst natürlicher als das schwerfällige „wir sind bedacht auf“, erhält jedoch den Gedanken sorgfältiger, vorausschauender Verantwortung. Die Wiederholung von „vor“ bewahrt den knappen Parallelismus des griechischen Textes.
