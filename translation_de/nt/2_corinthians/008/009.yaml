  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: de
  text: Denn ihr kennt die Gnade unseres Herrn Jesus Christus, dass er, obwohl er reich war, um euretwillen arm wurde, damit ihr durch seine Armut reich werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Christus“ bedeutet „Messias“ beziehungsweise „Gesalbter“. Im Satz wäre auch möglich: „unseres Herrn Jesus, des Messias“. „Reich“ und „arm“ sind hier wahrscheinlich bildlich gebraucht. Paulus bestimmt in diesem Vers nicht ausdrücklich, worin Christi Reichtum und Armut oder das Reichwerden der Glaubenden bestehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκετε
  choice: ihr kennt
  rationale: Das Präsens bezeichnet hier das bereits vorhandene Wissen der korinthischen Gemeinde; „ihr kennt“ ist im Deutschen natürlich und passt gut zum Akkusativobjekt „die Gnade“.
- source_word: χάριν
  choice: Gnade
  rationale: χάρις umfasst hier Christi gnädige Zuwendung und klingt zugleich in den Aufruf zur Großzügigkeit im Kontext hinein. „Gnade“ bewahrt diese theologische und ethische Weite.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die übliche und sachgerechte Wiedergabe des christologischen Titels κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: Im modernen deutschen Bibelregister ist „Jesus Christus“ die natürliche Wiedergabe. Eine Fußnote macht transparent, dass Χριστός seinem Titelgehalt nach „Messias“ bedeutet.
- source_word: δι’ ὑμᾶς
  choice: um euretwillen
  rationale: διά mit Akkusativ hat hier benefaktive Bedeutung. „Um euretwillen“ gibt „zu euren Gunsten/für euch“ würdig und prägnant wieder.
- source_word: ἐπτώχευσεν
  choice: wurde arm
  rationale: Das Verb bezeichnet den Eintritt in Armut. „Wurde arm“ bildet den Zustandswechsel natürlich ab, ohne dessen konkrete Gestalt über den griechischen Text hinaus festzulegen.
- source_word: πλούσιος ὤν
  choice: obwohl er reich war
  rationale: Das Partizip ist im Zusammenhang am besten konzessiv zu verstehen und bildet den scharfen Gegensatz zur folgenden Armut ab.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: durch seine Armut
  rationale: Der Dativ bezeichnet Mittel oder Vermittlung; „durch“ gibt diese instrumentale Bedeutung idiomatisch wieder. ἐκείνου wird natürlich als „seine“ ausgedrückt.
- source_word: πλουτήσητε
  choice: reich würdet
  rationale: Der Aorist Konjunktiv nach ἵνα drückt Ziel oder beabsichtigte Folge aus. „Reich würdet“ bewahrt die Wortantithese reich–arm–Armut–reich und vermeidet eine unnötige Passivierung.
theological_decisions:
- issue: Bedeutung von Christi Reichtum, seiner Armut und dem Reichwerden der Glaubenden
  choice: Die ökonomische Metaphorik bleibt im Haupttext unbestimmt erhalten.
  alternative: Den Reichtum ausdrücklich als vorweltliche göttliche Herrlichkeit und das Reichwerden ausdrücklich als geistliche Heilsgüter deuten.
  rationale: Paulus erläutert in diesem Vers nicht ausdrücklich, worin Reichtum und Armut jeweils bestehen. Der Kontext betrifft Großzügigkeit, während die Aussage zugleich eine umfassende christologische Dimension trägt. Die Übersetzung soll diese Spannung nicht auf eine einzelne dogmatische Erklärung verengen.
- issue: Χριστός als Titel oder fester Namensbestandteil
  choice: Im Haupttext „Christus“, mit der Titelbedeutung „Messias“ in einer Fußnote.
  alternative: Im Haupttext „Messias“.
  rationale: „Jesus Christus“ ist im modernen Standarddeutsch die vertraute und würdevolle Form, während die Fußnote verhindert, dass der Titelgehalt des griechischen Χριστός unsichtbar wird.
translation_notes:
  register: 'Modernes Standarddeutsch in würdigem, allgemein verständlichem Bibelregister. Die Satzstruktur wurde gegenüber dem Griechischen leicht gegliedert: Der Doppelpunkt gibt die erläuternde Funktion von ὅτι natürlich wieder. Die zentrale Antithese „reich – arm – Armut – reich“ bleibt vollständig sichtbar.'
