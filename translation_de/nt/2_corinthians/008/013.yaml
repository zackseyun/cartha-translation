  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: de
  text: Denn es geht nicht darum, dass andere Erleichterung haben und ihr in Bedrängnis geratet, sondern um Ausgleich[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gleichheit« beziehungsweise »gerechter Ausgleich«. Das griechische Wort bezeichnet ein ausgewogenes, faires Verhältnis, nicht unbedingt völlig gleichen Besitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ἵνα
  choice: Denn es soll nicht so sein, dass
  rationale: γάρ führt eine begründende Erläuterung ein. Die elliptische ἵνα-Konstruktion bezeichnet hier das verneinte Ziel; die deutsche Fassung ergänzt idiomatisch „es soll ... sein“, ohne ein ausdrückliches „ich meine“ in den griechischen Text einzutragen.
- source_word: ἄλλοις ἄνεσις
  choice: andere Erleichterung haben
  rationale: ἄνεσις bezeichnet hier die Entlastung von materiellem Druck, nicht bloß emotionalen Trost. Die prädikative Aussage wird im Deutschen natürlich verbal wiedergegeben.
- source_word: ὑμῖν θλῖψις
  choice: ihr in Bedrängnis geratet
  rationale: θλῖψις steht im Kontrast zu ἄνεσις und bezeichnet belastenden Druck oder Not. „In Bedrängnis geraten“ wahrt den praktischen und materiellen Kontext, ohne den Sinn auf völlige Verarmung zu verengen.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: sondern es soll einen Ausgleich geben
  rationale: ἰσότης kann Gleichheit, Ausgewogenheit oder Fairness bezeichnen. „Ausgleich“ passt im Deutschen zum Zusammenhang gegenseitiger materieller Unterstützung und vermeidet die Behauptung strikter Besitzgleichheit; ἐκ wird in der idiomatischen Zielaussage aufgenommen.
theological_decisions:
- issue: Bedeutung von ἰσότης bei materieller Unterstützung
  choice: Ausgleich
  alternative: Gleichheit; gerechter Ausgleich
  rationale: „Ausgleich“ bewahrt den Gedanken eines ausgewogenen Verhältnisses, ohne absolute Gleichheit der Besitztümer festzuschreiben. Die Fußnote hält die direktere lexikalische Alternative „Gleichheit“ ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität zwischen der Entlastung der anderen und der möglichen Bedrängnis der Adressaten bleibt erhalten; der Gedankenstrich zeigt an, dass der Satz in Vers 14 weitergeführt wird.
