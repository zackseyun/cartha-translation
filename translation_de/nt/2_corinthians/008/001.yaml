lexical_decisions:
- source_word: Γνωρίζομεν δὲ ὑμῖν
  choice: Wir möchten euch … bekannt machen
  rationale: γνωρίζομεν bedeutet „wir machen bekannt“; die modal formulierte deutsche Wendung ist ein natürlicher Briefeinstieg. δέ markiert hier lediglich einen leichten Übergang und muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der grammatisch maskuline Vokativ bezeichnet im paulinischen Gemeindegebrauch regelmäßig die angesprochene Gemeinschaft; die inklusive Wiedergabe macht den gemeinten Personenkreis in heutigem Deutsch deutlich. Die formal nähere Alternative steht in der Fußnote.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: die Gnade Gottes
  rationale: Die traditionelle und sachlich weite Wiedergabe bewahrt sowohl Gottes gnädiges Handeln als auch dessen Wirkung in der Freigebigkeit der Gemeinden.
- source_word: τὴν δεδομένην
  choice: die … geschenkt worden ist
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Gabe mit fortdauernder Wirkung. „Geschenkt“ passt idiomatisch zu „Gnade“, ohne diese auf eine Geldgabe zu verengen.
- source_word: ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας
  choice: den Gemeinden Mazedoniens
  rationale: ἐν kann hier den Wirkungs- oder Empfängerkreis bezeichnen. Der deutsche Dativ nach „geschenkt“ ist natürlich und lässt erkennen, dass Gottes Gnade in diesen Gemeinden wirksam wurde; ἐκκλησίαις wird kontextgemäß mit „Gemeinden“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von „Gnade Gottes“
  choice: Die offene Formulierung „Gnade Gottes“ bleibt erhalten und umfasst Gottes gnädiges Wirken sowie die dadurch hervorgebrachte Großzügigkeit.
  alternative: Die Wendung ausschließlich als konkrete Geldgabe oder ausschließlich als allgemeine göttliche Gunst zu verstehen.
  rationale: Der Kontext der Sammlung legt die Freigebigkeit nahe, doch χάρις benennt zugleich deren göttlichen Ursprung. Eine engere Übersetzung würde diese theologische Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gemeinden“ ist im paulinischen Kontext natürlicher als „Kirchen“. Der abschließende Doppelpunkt entspricht der einleitenden Funktion des Verses im fortlaufenden Satz; die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Formulierungen.
