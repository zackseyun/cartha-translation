revisions:
- from: Wir möchten euch, Brüder und Schwestern,[a] die Gnade Gottes bekannt machen, die den Gemeinden Mazedoniens geschenkt worden ist:[b]
  to: Wir machen euch, Brüder,[a] die Gnade Gottes bekannt, die den Gemeinden in Mazedonien zuteilgeworden ist:[b]
  rationale: Die Revision stellt den unmodalisierten Aussagecharakter von Γνωρίζομεν wieder her und bewahrt die maskuline Form von ἀδελφοί im Haupttext, ohne die wahrscheinliche inklusive Anredefunktion zu verschweigen. „Zuteilgeworden ist“ gibt δεδομένην als Perfektpassiv wieder und lässt die durch ἐν markierte Beziehung zu den Gemeinden offen. Der Doppelpunkt bleibt als Einleitung zum folgenden Satzgefüge erhalten.
