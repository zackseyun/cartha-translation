id: 2CO.8.6
reference: 2 Corinthians 8:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: de
  text: Deshalb baten wir Titus eindringlich, bei euch auch dieses Gnadenwerk[a] zum Abschluss zu bringen, wie er es zuvor begonnen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: diese Gnade; auch: dieses Werk der Gnade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: baten … eindringlich
  rationale: Im Zusammenhang wird Titus nachdrücklich dazu veranlasst, die bereits begonnene Aufgabe weiterzuführen. Die Formulierung gibt die Stärke von παρακαλέω natürlich wieder, ohne den Ton eines Befehls anzunehmen.
- source_word: καθὼς προενήρξατο
  choice: wie er es zuvor begonnen hatte
  rationale: „Zuvor“ bewahrt den zeitlichen Gehalt des zusammengesetzten Verbs προενάρχομαι; das Plusquamperfekt kennzeichnet den Beginn als bereits vorausliegend.
- source_word: ἐπιτελέσῃ
  choice: zum Abschluss zu bringen
  rationale: Die Wendung bezeichnet die Vollendung eines begonnenen Vorhabens und gibt den Zwecksinn des Aorist Konjunktiv nach ἵνα idiomatisch wieder.
- source_word: εἰς ὑμᾶς
  choice: bei euch
  rationale: Die Präposition bezeichnet hier die auf die korinthische Gemeinde gerichtete und in ihrer Mitte ausgeführte Tätigkeit. „Bei euch“ ist im Deutschen dafür natürlich und lässt den Bezug auf die Gemeinde erkennen.
- source_word: καὶ τὴν χάριν ταύτην
  choice: auch dieses Gnadenwerk
  rationale: „Gnadenwerk“ bewahrt den sprachlichen Bezug zu χάρις und macht zugleich deutlich, dass im Kontext eine konkrete, von Gnade geprägte Sammlung beziehungsweise Hilfeleistung gemeint ist. „Auch“ gibt das adjunktive καί wieder.
theological_decisions:
- issue: Bedeutung von χάρις im Zusammenhang der Sammlung
  choice: „Gnadenwerk“ als konkrete, von Gnade geprägte Hilfeleistung
  alternative: „diese Gnade“ im abstrakteren Sinn oder „diese Gabe“ mit stärkerem Blick auf die Spende
  rationale: Der unmittelbare Zusammenhang handelt von der Sammlung für die Heiligen. Zugleich rahmt Paulus diese praktische Hilfe ausdrücklich mit dem Begriff χάρις. „Gnadenwerk“ hält beide Aspekte zusammen, ohne χάρις lediglich auf Geld oder auf abstrakte göttliche Gnade zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Baten … eindringlich“ vermittelt Nachdruck ohne unnötig kirchensprachliches „ermahnten“. Der Satzbau ist gegenüber der griechischen Zweckkonstruktion geglättet, bewahrt aber Beginn, Vollendung und den Bezug auf die Gemeinde.
