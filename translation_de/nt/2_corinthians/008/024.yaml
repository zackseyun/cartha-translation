    issue: Die Wiedergabe von ἡμῶν καυχήσεως ὑπὲρ ὑμῶν als „für das, was wir über euch gerühmt haben“ verschiebt den Bezug.
    rationale: Das Griechische nennt koordiniert den Erweis „eurer Liebe“ und „unseres Rühmens über euch“. Die Fassung mit „was“ macht aus dem Rühmen vor allem eine nicht näher bestimmte gerühmte Aussage und ist im Deutschen zudem stilistisch holprig.
  revised_text: Zeigt ihnen also vor den Gemeinden[a] den Beweis[b] eurer Liebe und unseres Rühmens über euch.
