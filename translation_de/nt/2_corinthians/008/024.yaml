  verdict: revise
  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Die Korinther sollen den genannten Brüdern öffentlich vor den Gemeinden einen Erweis ihrer Liebe und des paulinischen Rühmens über sie geben. Die Umschreibung „das, was wir über euch gerühmt haben“ ist jedoch keine präzise oder idiomatische Entsprechung für ἡμῶν καυχήσεως ὑπὲρ ὑμῶν; sie lässt eher an den Inhalt einer gerühmten Aussage als an das Rühmen selbst denken.'
  naturalness: „Zeigt ihnen also vor den Gemeinden …“ ist klares modernes Standarddeutsch. „Unseres Rühmens über euch“ ist zwar leicht gehoben, aber verständlich, idiomatischer als die vorhandene Relativsatzumschreibung und bewahrt den paulinischen rhetorischen Begriff.
  terminology: „Beweis“ ist für ἔνδειξις vertretbar; „Erweis“ und „sichtbarer Beleg“ sind sinnvolle Alternativen. „Liebe“ und „Gemeinden“ sind passend. „Rühmen“ erhält die Verbindung zu καύχησις besser als eine inhaltliche Paraphrase.
  issues:
