  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: de
  text: Zeigt ihnen also vor den Gemeinden[a] den Beweis[b] eurer Liebe und unseres Rühmens über euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „im Angesicht der Gemeinden“; gemeint ist eine öffentliche Bekundung vor ihren Abgesandten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Erweis“ oder „sichtbarer Beleg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειξιν
  choice: Beweis
  rationale: ἔνδειξις bezeichnet einen Erweis oder sichtbaren Beleg, durch den etwas offenkundig wird. „Beweis“ ist hier knapp und verständlich; die Fußnote hält die weiteren Bedeutungsnuancen offen.
- source_word: ἀγάπης
  choice: Liebe
  rationale: Die übliche und kontextgemäße Wiedergabe von ἀγάπη; hier geht es um Liebe, die sich praktisch in der Sammlung erweist.
- source_word: καυχήσεως
  choice: das, was wir … gerühmt haben
  rationale: Die verbale Umschreibung gibt das substantivische καύχησις in natürlichem Deutsch wieder und bewahrt den Gedanken des Rühmens, ohne ihn zum bloßen Stolz oder Vertrauen abzuschwächen.
- source_word: ὑπὲρ ὑμῶν
  choice: über euch
  rationale: 'In Verbindung mit καύχησις bezeichnet ὑπέρ den Gegenstand des Rühmens: Paulus hat gegenüber anderen anerkennend von den Korinthern gesprochen.'
- source_word: εἰς αὐτοὺς
  choice: ihnen
  rationale: Das Pronomen verweist auf die zuvor genannten Brüder beziehungsweise Abgesandten der Gemeinden. Der Dativ ist im Deutschen die natürliche Ergänzung zu „zeigen“.
- source_word: ἐνδεικνύμενοι
  choice: Zeigt
  rationale: Das Partizip hat im Zusammenhang auffordernde beziehungsweise imperativische Kraft. „Zeigt“ ist gegenwärtig, klar und bewahrt den Gedanken des Sichtbarmachens.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: vor den Gemeinden
  rationale: Die Wendung bezeichnet ein Geschehen im Angesicht beziehungsweise in Gegenwart der Gemeinden, praktisch vor deren Vertretern. „Vor den Gemeinden“ bewahrt die öffentliche und repräsentative Dimension.
- source_word: οὖν
  choice: also
  rationale: οὖν zieht die Folgerung aus der vorausgehenden Empfehlung der Abgesandten. „Also“ stellt diesen Zusammenhang in natürlichem modernem Deutsch her.
theological_decisions:
- issue: Bezug des geforderten Beweises
  choice: Der Satz verbindet den Beweis sowohl mit der Liebe der Korinther als auch mit dem, was Paulus über sie gerühmt hat.
  alternative: „… und dafür, dass wir uns zu Recht euretwegen rühmen“
  rationale: Die Alternative verdeutlicht die sachliche Pointe, fügt mit „zu Recht“ jedoch eine nicht ausdrücklich ausgesprochene Bewertung hinzu. Die gewählte Fassung bleibt näher an den beiden koordinierten Genitiven des griechischen Textes und lässt ihre rhetorische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die Adressaten und den öffentlichen Rahmen früh heraus. Die Umschreibung „das, was wir über euch gerühmt haben“ vermeidet das im heutigen Deutsch schwer verständliche „unser Rühmen über euch“, ohne die paulinische Rhetorik abzuschwächen.
