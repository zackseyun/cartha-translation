id: 2CO.8.5
reference: 2 Corinthians 8:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: de
  text: Und sie gaben nicht nur so, wie wir erwartet hatten[a], sondern sie gaben sich selbst zuerst dem Herrn und dann uns – durch den Willen Gottes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie wir gehofft hatten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach dem Willen Gottes“ beziehungsweise „aufgrund des Willens Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ καθὼς ἠλπίσαμεν
  choice: Und sie gaben nicht nur so, wie wir erwartet hatten
  rationale: Die im Griechischen elliptische Wendung wird im Deutschen mit dem aus dem Zusammenhang ergänzten Verb „gaben“ und „nicht nur“ natürlich wiedergegeben. ἐλπίζω kann „hoffen“ oder kontextuell „erwarten“ bedeuten; hier bezeichnet „erwartet“ am klarsten die übertroffene Erwartung.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: sie gaben sich selbst
  rationale: Die reflexive Selbsthingabe bleibt ausdrücklich erhalten und wird nicht auf die Geldgabe oder bloße Einsatzbereitschaft reduziert.
- source_word: πρῶτον
  choice: zuerst
  rationale: „Zuerst“ bewahrt die zeitliche beziehungsweise sachliche Priorität, ohne zwischen diesen Nuancen zu entscheiden.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Der Dativ nach „sich geben“ wird im Deutschen direkt beibehalten; „Herr“ ist die angemessene Wiedergabe von κύριος.
- source_word: καὶ ἡμῖν
  choice: und dann uns
  rationale: „Dann“ verdeutlicht im natürlichen Deutschen die durch πρῶτον eröffnete Reihenfolge. Es kennzeichnet die nachgeordnete Hinwendung zu Paulus und seinen Mitarbeitern, ohne sie mit der Hingabe an den Herrn gleichzustellen.
- source_word: διὰ θελήματος θεοῦ
  choice: durch den Willen Gottes
  rationale: Die Formulierung bildet διά mit Genitiv eng ab und lässt offen, ob Gottes Wille als wirksames Mittel, Veranlassung oder maßgebliche Übereinstimmung verstanden wird.
theological_decisions:
- issue: Verhältnis der Hingabe an den Herrn zur Hingabe an Paulus und seine Mitarbeiter
  choice: Die Reihenfolge wird mit „zuerst … und dann“ sichtbar gemacht, ohne über den Wortlaut hinausgehende kirchliche Ansprüche abzuleiten.
  alternative: Man kann die Aussage als zweifache Hingabe verstehen, deren Hierarchie nur durch „zuerst“ angedeutet ist.
  rationale: πρῶτον und die Abfolge der beiden Dative geben dem Herrn den Vorrang; die Übersetzung wahrt zugleich die ungewöhnlich starke Aussage, dass sie sich auch den apostolischen Mitarbeitern gaben.
- issue: Bedeutung von διὰ θελήματος θεοῦ
  choice: durch den Willen Gottes
  alternative: nach dem Willen Gottes; aufgrund des Willens Gottes
  rationale: Die eng am Griechischen bleibende Formulierung bewahrt die Spannung zwischen göttlicher Wirksamkeit und Übereinstimmung mit Gottes Willen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ergänzung „nicht nur“ macht den im Griechischen durch ἀλλά ausgedrückten überbietenden Gegensatz idiomatisch verständlich; der Gedankenstrich bindet die abschließende Bestimmung an die gesamte Selbsthingabe. Sämtliche Fußnotenmarker stehen im Haupttext.
