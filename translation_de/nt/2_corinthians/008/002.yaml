base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: de
  text: Denn mitten in einer schweren Prüfung durch Bedrängnis sind ihre überreiche Freude und ihre abgrundtiefe Armut[a] zu einem Reichtum an Großzügigkeit[b] übergeströmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Armut bis in die Tiefe« beziehungsweise »ihre äußerste Armut«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu einem Reichtum ihrer Freigebigkeit«. Das griechische Wort kann auch »Schlichtheit« oder »aufrichtige, ungeteilte Gesinnung« bedeuten; hier bezieht es sich wahrscheinlich auf großzügiges Geben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: in schwerer Bedrängnis, durch die sie hart geprüft wurden
  rationale: Die Wiedergabe bewahrt sowohl die Bedrängnis als auch den Gedanken einer intensiven Prüfung und löst die griechische Genitivverbindung in natürliches modernes Deutsch auf.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: ihre überreiche Freude
  rationale: „Überreich“ gibt die Fülle von περισσεία wieder und hält zugleich die sprachliche Verbindung zum folgenden ἐπερίσσευσεν erkennbar.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: ihre abgrundtiefe Armut
  rationale: Die bildhafte Tiefe von κατὰ βάθους wird bewahrt; zugleich wird die verstärkende Bedeutung als äußerste Armut idiomatisch ausgedrückt.
- source_word: ἐπερίσσευσεν
  choice: ist … übergeströmt
  rationale: Das Bild überfließender Fülle und die resultative Bewegung zur εἰς-Angabe bleiben erhalten. Wegen des zusammengesetzten Subjekts verlangt natürliches Deutsch die Pluralform „sind … übergeströmt“.
- source_word: εἰς τὸ πλοῦτος
  choice: zu einem Reichtum
  rationale: „Zu“ drückt hier das Ergebnis aus; „Reichtum“ erhält das auffällige Paradox von äußerer Armut und reicher Freigebigkeit.
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: an Großzügigkeit
  rationale: Im unmittelbaren Zusammenhang der Geldsammlung bezeichnet ἁπλότης am wahrscheinlichsten uneigennütziges, großzügiges Geben. Die Fußnote bewahrt die weiteren möglichen Bedeutungen.
theological_decisions:
- issue: Bedeutung von ἁπλότης im Zusammenhang materiellen Gebens
  choice: Großzügigkeit
  alternative: Lauterkeit, Schlichtheit oder Einfalt des Herzens
  rationale: Der Kontext handelt von der Unterstützung Bedürftiger; daher liegt die Bedeutung „Großzügigkeit/Freigebigkeit“ nahe. Da das Wort zugleich ungeteilte, lautere Gesinnung bezeichnen kann, wird diese Spannung in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paradoxen Bilder von abgrundtiefer Armut, Reichtum und Überströmen bleiben erhalten; die dichte griechische Genitivkonstruktion wird für die allgemeine Verständlichkeit behutsam entfaltet.
