reference: Matthew 22:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: de
  text: 'und sagte: „Was denkt ihr über den Messias[a]? Wessen Sohn ist er?“ Sie antworteten ihm: „Davids.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Christus“. Das griechische Wort Χριστός (Christos) ist hier als messianischer Titel gebraucht.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: und fragte
  rationale: Das Partizip von λέγω leitet hier eine als Frage formulierte Äußerung Jesu ein. „Und fragte“ gibt die Funktion im deutschen Erzählfluss natürlicher wieder als das wörtliche „sagend“.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Was denkt ihr
  rationale: Die Wendung mit δοκέω und Dativ fragt idiomatisch nach Urteil oder Auffassung; „Was denkt ihr“ ist im modernen Deutsch klar und unmittelbar.
- source_word: περὶ τοῦ χριστοῦ
  choice: über den Messias
  rationale: Χριστός wird hier eindeutig als Titel innerhalb einer jüdischen Frage nach der messianischen Abstammung gebraucht. „Messias“ bewahrt diese Funktion.
- source_word: τίνος υἱός ἐστιν
  choice: Wessen Sohn ist er?
  rationale: Die Formulierung hält die Frage nach Sohnschaft beziehungsweise dynastischer Abstammung knapp und lässt deren genaue Tragweite offen.
- source_word: λέγουσιν αὐτῷ
  choice: Sie antworteten ihm
  rationale: Das historische Präsens wird in natürlichem deutschem Erzählstil als Präteritum wiedergegeben. Da die Äußerung unmittelbar auf Jesu Frage folgt, entspricht „antworteten“ ihrer Gesprächsfunktion, ohne den Inhalt zu erweitern.
- source_word: Τοῦ Δαυίδ
  choice: Davids
  rationale: Der griechische Genitiv ist eine elliptische Antwort, bei der „Sohn“ aus der Frage mitzudenken ist. Das selbstständige „Davids“ wahrt diese Kürze im Deutschen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: In diesem Zusammenhang bezeichnet Χριστός den erwarteten Gesalbten als Titel, nicht einen namenähnlichen Bestandteil. „Messias“ macht den jüdisch-messianischen Diskussionsrahmen deutlich; die traditionelle Alternative wird in der Fußnote genannt.
- issue: Bedeutung von „Sohn“
  choice: Wessen Sohn ist er?
  alternative: Von wem stammt er ab?
  rationale: Die direkte Wiedergabe mit „Sohn“ bewahrt sowohl die genealogische als auch die dynastisch-theologische Spannung, die Jesus im folgenden Gespräch aufgreift, statt sie auf bloße Abstammung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Partizipialkonstruktion ist idiomatisch in den Erzählfluss integriert; die Fragen und die knappe elliptische Antwort bleiben nah an Struktur und Spannung des griechischen Textes.
