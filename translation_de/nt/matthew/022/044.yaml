source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: de
  text: '»Der Herr sagte zu meinem Herrn: ›Setz dich zu meiner Rechten, bis ich deine Feinde unter deine Füße lege[a].‹«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach dem hebräischen Wortlaut von Psalm 110,1 auch: »bis ich deine Feinde zum Schemel für deine Füße mache«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος / τῷ κυρίῳ μου
  choice: der Herr / zu meinem Herrn
  rationale: Für beide Vorkommen wird derselbe Titel gewählt, weil auch der griechische Text nicht lexikalisch zwischen den beiden Bezugspersonen unterscheidet. »Meinem Herrn« bewahrt zugleich die relationale Aussage und das Gewicht des Psalmzitats.
- source_word: Εἶπεν
  choice: sagte
  rationale: Die schlichte Vergangenheitsform gibt den Aorist des gewöhnlichen Verbs λέγω natürlich und ohne unnötige Verstärkung wieder.
- source_word: Κάθου
  choice: Setz dich
  rationale: Der Imperativ wird im heutigen Standarddeutsch natürlich wiedergegeben; »Nimm Platz« wäre in diesem Herrschafts- und Einsetzungskontext zu alltäglich.
- source_word: ἐκ δεξιῶν μου
  choice: an meine rechte Seite
  rationale: Die Formulierung gibt den Ehren- und Herrschaftsplatz zur Rechten in natürlichem modernem Deutsch wieder. »Zu meiner Rechten« wäre formeller, aber ebenfalls möglich.
- source_word: ἕως ἂν θῶ
  choice: bis ich … lege
  rationale: Die Verbindung mit ἄν und Aorist Konjunktiv weist auf ein zukünftiges Eintreten hin. »Lege« passt idiomatisch zur anschließenden Ortsangabe.
- source_word: τοὺς ἐχθρούς σου
  choice: deine Feinde
  rationale: Dies ist die direkte, klare und gegenwärtig übliche Entsprechung.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: unter deine Füße
  rationale: Die Übersetzung folgt unmittelbar dem griechischen Wortlaut. Das Bild des Fußschemels stammt aus dem hebräischen Wortlaut von Psalm 110,1 und wird deshalb als textgeschichtliche Alternative in der Fußnote genannt.
theological_decisions:
- issue: Die zwei Vorkommen von κύριος im Zitat aus Psalm 110,1
  choice: Der Herr sagte zu meinem Herrn
  alternative: Der HERR sagte zu meinem Herrn; Der Herr sagte zu meinem Gebieter
  rationale: Der griechische Text verwendet für beide Bezugspersonen κύριος. Die gleiche deutsche Wiedergabe bewahrt diesen Befund und zugleich die Spannung, auf der Jesu Argument über die Stellung des Messias beruht. »HERR« würde den hinter dem ersten κύριος stehenden Gottesnamen des hebräischen Psalms sichtbar machen, aber eine Unterscheidung typografisch in den griechischen Wortlaut eintragen.
- issue: Unterwerfung der Feinde
  choice: bis ich deine Feinde unter deine Füße lege
  alternative: bis ich deine Feinde zum Schemel für deine Füße mache
  rationale: Der Haupttext folgt der konkreten Formulierung des griechischen Matthäustextes. Die Fußschemel-Fassung ist durch den hebräischen Psalm begründet, soll die griechische Formulierung jedoch nicht ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp gehalten und behält die rhetorische Schlussfrage des umgebenden Satzes durch das abschließende Fragezeichen bei. »An meine rechte Seite« ist verständlicher als das traditionellere »zu meiner Rechten«, ohne die Bedeutung des Ehren- und Herrschaftsplatzes zu verändern.
