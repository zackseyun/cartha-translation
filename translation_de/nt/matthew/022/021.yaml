id: MAT.22.21
reference: Matthew 22:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: de
  text: 'Sie sagten zu ihm: „Des Kaisers.“ Da sagte er zu ihnen: „Gebt also dem Kaiser zurück[a], was dem Kaiser gehört, und Gott, was Gott gehört.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebt dem Kaiser, was ihm zusteht“. Das griechische Verb kann „zurückgeben“, „entrichten“ oder „leisten, was geschuldet ist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν / λέγει
  choice: sie sagten / er sagte
  rationale: Die griechischen historischen Präsensformen werden für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben.
- source_word: Καίσαρος
  choice: Des Kaisers
  rationale: Der Genitiv antwortet knapp auf die vorausgehende Frage nach Bild und Aufschrift und bewahrt die elliptische Form des Griechischen.
- source_word: τότε
  choice: Da
  rationale: „Da“ markiert im Deutschen knapp und natürlich den nächsten Schritt im Gespräch.
- source_word: Ἀπόδοτε
  choice: Gebt … zurück
  rationale: ἀποδίδωμι bezeichnet hier das Zurückgeben beziehungsweise Leisten dessen, was jemandem zusteht; „zurückgeben“ bewahrt diesen Bedeutungsanteil in verständlichem Deutsch.
- source_word: οὖν
  choice: also
  rationale: Das Wort kennzeichnet die Folgerung aus ihrer Antwort und klingt in direkter Rede natürlicher als das formellere „daher“.
- source_word: τὰ Καίσαρος / τὰ τοῦ θεοῦ
  choice: was dem Kaiser gehört / was Gott gehört
  rationale: Diese idiomatische deutsche Form bewahrt den ausgewogenen Parallelismus und lässt den Umfang beider Ansprüche bewusst offen.
- source_word: Καίσαρι / τῷ θεῷ
  choice: dem Kaiser / Gott
  rationale: Die Dative bezeichnen die jeweiligen Empfänger dessen, was ihnen zusteht.
theological_decisions:
- issue: Reichweite staatlicher und göttlicher Ansprüche
  choice: Die parallele Aufforderung bleibt ohne politische oder systematisch-theologische Ausdeutung stehen.
  alternative: Den Satz entweder auf die Steuerzahlung zu beschränken oder als Anerkennung uneingeschränkter staatlicher Autorität zu formulieren.
  rationale: Der griechische Text unterscheidet zwischen dem Anspruch des Kaisers und dem Anspruch Gottes, bestimmt ihren Umfang hier aber nicht abschließend. Diese Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die knappe Antwort „Des Kaisers“ erhält die Ellipse des Ausgangstextes; der Hauptsatz wird idiomatisch formuliert, ohne seinen rhetorischen Parallelismus oder seine theologische Offenheit aufzulösen.
