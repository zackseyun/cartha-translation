  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: de
  text: Als sie das hörten, staunten sie. Dann ließen sie ihn stehen und gingen weg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Als sie das hörten
  rationale: Das adverbiale Aoristpartizip bezeichnet eine Handlung, die der Reaktion vorausgeht. Ein temporaler Nebensatz ist im modernen Deutsch natürlich; „das“ nimmt den im Zusammenhang vorausgehenden Ausspruch auf.
- source_word: ἐθαύμασαν
  choice: staunten sie
  rationale: θαυμάζω bezeichnet hier Verwunderung oder Staunen über Jesu Antwort. „staunten“ ist knapp, gegenwärtig und bewahrt den offenen Charakter der Reaktion.
- source_word: ἀφέντες αὐτόν
  choice: ließen sie ihn stehen
  rationale: ἀφίημι bedeutet in diesem Zusammenhang, jemanden zurückzulassen und sich von ihm zu entfernen. Die deutsche Wendung gibt dies natürlich wieder, ohne „allein“ hinzuzufügen.
- source_word: ἀπῆλθαν
  choice: gingen weg
  rationale: ἀπέρχομαι bezeichnet das Weggehen; „gingen weg“ ist schlicht und entspricht der erzählten Bewegung.
- source_word: καὶ ... καὶ
  choice: … . Dann … und
  rationale: Die wiederholte Koordination markiert eine zügige Handlungsfolge. Im Deutschen stellt die Satzteilung mit „Dann“ den Ablauf natürlicher dar, während das zweite „und“ erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die griechische Partizipialfolge wird zur besseren deutschen Lesbarkeit in finite Satzstrukturen überführt; die Reaktion wird nicht theologisch bewertet.
