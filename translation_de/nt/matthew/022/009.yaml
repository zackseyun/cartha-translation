  variant: modern standard German
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: de
  text: Geht also zu den Kreuzungen der Straßen[a] und ladet alle, die ihr findet, zur Hochzeitsfeier[b] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Wegkreuzungen“ oder „zu den Ausgängen der Straßen“; der griechische Ausdruck bezeichnet Orte, an denen Wege zusammenlaufen, sich verzweigen oder hinausführen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen der Plural „zu den Hochzeiten“; gemeint ist die Hochzeitsfeier beziehungsweise das Hochzeitsmahl.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: Geht
  rationale: Der präsentische Imperativ wird im Deutschen natürlich als unmittelbare Aufforderung wiedergegeben.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet in natürlichem modernem Deutsch die Folgerung aus der vorausgehenden Anweisung.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: zu den Kreuzungen der Straßen
  rationale: διέξοδοι bezeichnet hier Orte, an denen Straßen zusammenlaufen, sich verzweigen oder hinausführen. „Kreuzungen der Straßen“ ist verständlich, ohne die genaue räumliche Vorstellung stärker festzulegen als der griechische Ausdruck.
- source_word: ὅσους ἐὰν εὕρητε
  choice: alle, die ihr findet
  rationale: Die Formulierung bewahrt die uneingeschränkte Reichweite der griechischen Konstruktion und klingt im Deutschen natürlicher als eine wörtlich quantitative Wiedergabe.
- source_word: καλέσατε
  choice: ladet ... ein
  rationale: Im Zusammenhang einer Hochzeitsfeier bedeutet καλέω, jemanden einzuladen, nicht lediglich zu rufen.
- source_word: εἰς τοὺς γάμους
  choice: zur Hochzeitsfeier
  rationale: Der griechische Plural γάμοι bezeichnet idiomatisch die Hochzeitsfeier beziehungsweise das Hochzeitsmahl, nicht mehrere Hochzeiten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Pluralimperativ „Geht“ und „ladet ... ein“ entspricht der Anrede mehrerer Diener. Die Wortstellung hält die Aufforderung klar und gut verständlich.
