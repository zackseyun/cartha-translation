  terminology: „Brüder“, „Nachkommen“, „starb“ und „hinterließ“ sind treffend. Die Fußnote erläutert „Samen“ sachgerecht als genealogische Nachkommenschaft. „Schwagerehe“ ist der übliche verständliche Fachausdruck; die Erläuterung bleibt beschreibend und konfessionell neutral.
