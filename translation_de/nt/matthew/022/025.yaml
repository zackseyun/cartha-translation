source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: de
  text: Bei uns waren sieben Brüder. Der erste heiratete und starb; da er keine Nachkommen hatte,[a] hinterließ er seine Frau seinem Bruder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „da er keinen Samen hatte“. „Samen“ bezeichnet hier Nachkommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist die Schwagerehe: Der Bruder eines kinderlos verstorbenen Mannes sollte dessen Witwe heiraten, um dem Verstorbenen Nachkommen zu erwecken; siehe 5. Mose 25,5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: bei uns
  rationale: παρά mit Dativ bezeichnet hier Zugehörigkeit beziehungsweise Vorkommen innerhalb der von den Sadduzäern beschriebenen Gemeinschaft. „Bei uns“ ist im Deutschen natürlich und gibt die Wendung knapp wieder.
- source_word: ἑπτὰ ἀδελφοί
  choice: sieben Brüder
  rationale: Im Zusammenhang der Schwagerehe sind leibliche männliche Geschwister gemeint.
- source_word: ὁ πρῶτος
  choice: der erste
  rationale: πρῶτος bezeichnet die Reihenfolge, ohne ausdrücklich zu sagen, dass dieser Bruder der älteste war.
- source_word: γήμας
  choice: heiratete
  rationale: Das Aoristpartizip bezeichnet eine der Todeshandlung vorausgehende Eheschließung. Die finite deutsche Form gibt die zeitliche Abfolge natürlich wieder.
- source_word: ἐτελεύτησεν
  choice: starb
  rationale: Die direkte und klare Wiedergabe von τελευτάω vermeidet einen im Ausgangstext nicht angelegten Euphemismus.
- source_word: μὴ ἔχων σπέρμα
  choice: da er keine Nachkommen hatte
  rationale: σπέρμα bedeutet wörtlich „Samen“, bezeichnet hier jedoch im familienrechtlichen Zusammenhang Nachkommenschaft. „Nachkommen“ bewahrt den genealogischen Sinn.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: hinterließ er seine Frau
  rationale: ἀφίημι bedeutet hier, die Ehefrau beim Tod zurückzulassen, nicht sie zu verlassen oder sich von ihr zu scheiden. „Hinterließ“ macht diesen Zusammenhang im Deutschen eindeutig.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: seinem Bruder
  rationale: Der Dativ bezeichnet den überlebenden Bruder, dem die Witwe im Rahmen der vorausgesetzten Schwagerehe hinterlassen wurde; eine ausdrückliche Ergänzung wie „damit er sie heiratete“ steht jedoch nicht im griechischen Text.
theological_decisions:
- issue: Ob der Hintergrund der Schwagerehe im Haupttext ausdrücklich gemacht werden soll
  choice: Nur das im griechischen Text Gesagte wiedergeben und die rechtliche Voraussetzung in einer Fußnote erläutern.
  alternative: „Er hinterließ seine Frau seinem Bruder, damit dieser sie heiratete.“
  rationale: Der Hintergrund von Deuteronomium 25,5 ist vorausgesetzt, doch der Vers sagt nicht ausdrücklich „damit er sie heiratete“. Die knappe Form erhält diese Implizitheit und vermeidet eine erklärende Erweiterung des Haupttextes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Das einleitende δέ wird durch den Satzanschluss getragen und nicht eigens mit „nun“ wiedergegeben. Das Semikolon hält die eng verbundenen Handlungsschritte zusammen. Alle Fußnotenmarker stehen an der inhaltlich passenden Stelle im Haupttext.
