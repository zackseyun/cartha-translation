  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: de
  text: An jenem Tag kamen Sadduzäer zu ihm, die sagen, es gebe keine Auferstehung, und fragten ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: An jenem Tag
  rationale: Die Wendung ist eine gewöhnliche Zeitangabe. „An jenem Tag“ ist idiomatisches, modernes Deutsch und wahrt den Rückbezug.
- source_word: προσῆλθον αὐτῷ
  choice: kamen … zu ihm
  rationale: προσέρχομαι mit Dativ bezeichnet hier das Herantreten beziehungsweise Kommen zu einer Person. Die gewählte Formulierung ist natürlich und erzählerisch flüssig.
- source_word: Σαδδουκαῖοι
  choice: Sadduzäer
  rationale: Dies ist die im Deutschen etablierte Bezeichnung der jüdischen Gruppierung.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: die sagen, es gebe keine Auferstehung
  rationale: Das Partizip führt eine für die Sadduzäer kennzeichnende Auffassung an. Der Relativsatz gibt diese Funktion im Deutschen klar und natürlich wieder; der Konjunktiv markiert die Aussage als ihre Position.
- source_word: ἀνάστασιν
  choice: Auferstehung
  rationale: „Auferstehung“ ist in diesem Zusammenhang die etablierte und sachlich genaue Wiedergabe von ἀνάστασις.
- source_word: ἐπηρώτησαν αὐτόν
  choice: fragten ihn
  rationale: ἐπερωτάω bedeutet hier „fragen/befragen“. „Fragten ihn“ ist knapp, natürlich und lässt den herausfordernden Charakter der folgenden Frage aus dem Kontext hervorgehen.
theological_decisions:
- issue: Darstellung der sadduzäischen Ablehnung der Auferstehung
  choice: die sagen, es gebe keine Auferstehung
  alternative: wobei sie sagten, es gebe keine Auferstehung
  rationale: Die attributive Wiedergabe versteht das Partizip als nähere Kennzeichnung der Sadduzäer und entspricht ihrer im Kontext relevanten Lehrauffassung. Der Konjunktiv vermeidet, dass die Erzählstimme diese Auffassung selbst behauptet; weitere dogmatische Erläuterungen werden nicht hinzugefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Text, ohne unnatürlich zu wirken. Auf eine Fußnote wird verzichtet, weil der griechische Partizipialausdruck im deutschen Relativsatz präzise und verständlich wiedergegeben werden kann.
