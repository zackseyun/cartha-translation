source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: de
  text: 'Und er sagt zu ihm: »Freund, wie bist du hier hereingekommen, ohne ein Hochzeitsgewand zu tragen?« Er aber blieb stumm.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde zum Schweigen gebracht«. Das griechische Verb kann wörtlich auch »einen Maulkorb anlegen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Freund
  rationale: Die Anrede ist höflich, wirkt im Zusammenhang aber distanziert und tadelnd. »Freund« gibt diese Spannung natürlich wieder, ohne zusätzliche Feindseligkeit einzutragen.
- source_word: πῶς
  choice: wie
  rationale: Das Adverb fragt nach der Art oder Möglichkeit des Hineinkommens, nicht ausdrücklich nach dem Beweggrund.
- source_word: εἰσῆλθες ὧδε
  choice: bist du hier hereingekommen
  rationale: Die Form bezeichnet den vollzogenen Eintritt; die gewählte Formulierung ist im heutigen Deutsch natürlich und bewahrt den Ortsbezug.
- source_word: μὴ ἔχων
  choice: ohne … zu tragen
  rationale: Die partizipiale Wendung bezeichnet den begleitenden Umstand, dass dem Gast die entsprechende Kleidung fehlt. Im Deutschen ist »ohne … zu tragen« idiomatischer als »nicht habend«.
- source_word: ἔνδυμα γάμου
  choice: Hochzeitsgewand
  rationale: Die singularische Wendung bezeichnet ein zur Hochzeit gehörendes Kleidungsstück, ohne dessen genaue Art festzulegen.
- source_word: ἐφιμώθη
  choice: verstummte
  rationale: Das Passiv von φιμόω kann wörtlich »einen Maulkorb anlegen« und übertragen »zum Schweigen bringen« bedeuten. »Verstummte« gibt hier knapp und natürlich wieder, dass der Mann keine Antwort geben konnte; die passive und bildhafte Nuance wird in der Fußnote bewahrt.
theological_decisions:
- issue: Ton der Anrede an den unpassend gekleideten Gast
  choice: Höfliche, aber im Zusammenhang tadelnde Anrede »Freund«
  alternative: »Gefährte« oder eine ausdrücklich schroffere Anrede
  rationale: Der griechische Vokativ trägt in Matthäus eine distanzierte Spannung, verlangt aber keine offen feindselige Wiedergabe. »Freund« bewahrt die Ironie, ohne sie lehrmäßig auszudeuten.
- issue: Wiedergabe von ἐφιμώθη
  choice: Ergebnisorientiert »verstummte« im Haupttext
  alternative: 'Passiver und wörtlicher: »wurde zum Schweigen gebracht«'
  rationale: Der Zusammenhang hebt hervor, dass der Mann nicht antworten kann. Die flüssige Haupttextfassung lässt offen, ob sein Schweigen als innere Sprachlosigkeit oder als bewirktes Zum-Schweigen-Kommen akzentuiert wird; die Fußnote macht die passive und bildhafte Bedeutung sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der historische Präsenswechsel in λέγει wird mit »sagt« bewahrt. »Hochzeitsgewand« bleibt bewusst allgemein und legt weder die genaue Art des Kleidungsstücks noch seine symbolische Deutung fest.
