  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: de
  text: 'Wieder schickte er andere Sklaven[a] und sagte: »Sagt den Eingeladenen: ›Seht, ich habe mein Festmahl vorbereitet. Meine Stiere und das Mastvieh sind geschlachtet, und alles ist bereit. Kommt zur Hochzeitsfeier![b]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das griechische Wort kann je nach Zusammenhang Sklaven oder Diener bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Hochzeit“ beziehungsweise „zum Hochzeitsmahl“. Der griechische Plural kann die Hochzeitsfeierlichkeiten als Ganzes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν
  choice: Wieder schickte er
  rationale: Gibt die erneute, abgeschlossene Handlung in natürlichem deutschem Erzählstil wieder.
- source_word: ἄλλους δούλους
  choice: andere Sklaven
  rationale: δοῦλοι bezeichnet in diesem königlichen Haushaltskontext Menschen in rechtlich und sozial gebundener Stellung; „Sklaven“ bildet dies deutlicher ab als das allgemeinere „Diener“.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Sagt den Eingeladenen
  rationale: Die substantivierte deutsche Form gibt den vorausgegangenen Ruf beziehungsweise die bereits ausgesprochene Einladung knapp und verständlich wieder.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Zeitgemäßer, würdiger Aufmerksamkeitsruf ohne den altertümlichen Klang von „Siehe“.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: ich habe mein Festmahl vorbereitet
  rationale: ἄριστον bezeichnet eine bereitete Mahlzeit, häufig am früheren Teil des Tages; im Hochzeitskontext vermittelt „Festmahl“ den feierlichen Charakter, ohne eine genaue Tageszeit festzulegen. Das Perfekt wird durch das deutsche Perfekt mit gegenwärtigem Ergebnis wiedergegeben.
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: meine Stiere und das Mastvieh
  rationale: „Stiere“ bildet ταῦροι direkt ab; das substantivierte Adjektiv σιτιστά bezeichnet gemästete Tiere, ohne sie entgegen dem Griechischen als Kälber zu spezifizieren.
- source_word: τεθυμένα
  choice: sind geschlachtet
  rationale: Im Mahlkontext bezeichnet θύω das Schlachten der Tiere; „geopfert“ würde hier unnötig einen kultischen Sinn nahelegen.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Kommt zur Hochzeitsfeier
  rationale: Der substantivierte Plural γάμοι kann die Hochzeit mitsamt ihren Feierlichkeiten beziehungsweise dem Hochzeitsmahl bezeichnen.
theological_decisions:
- issue: Wiedergabe von δοῦλος im königlichen Gleichniskontext
  choice: Sklaven
  alternative: Diener
  rationale: Die sozial gebundene Stellung im Haushalt des Königs ist kontextuell erkennbar. Die Übersetzung hält diese historische Realität fest, ohne daraus eine zusätzliche theologische Aussage abzuleiten.
- issue: Umfang von τοὺς γάμους
  choice: Hochzeitsfeier
  alternative: Hochzeit; Hochzeitsmahl
  rationale: Der griechische Plural kann die Hochzeitsfeierlichkeiten insgesamt meinen. „Hochzeitsfeier“ bewahrt diesen weiteren Sinn; „Hochzeitsmahl“ wäre enger.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die direkte Rede ist klar verschachtelt; altertümliche Wendungen werden vermieden. „Mastvieh“ wahrt die fehlende Art- und Altersbestimmung des griechischen Ausdrucks.
