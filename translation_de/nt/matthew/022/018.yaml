  terminology: „Bosheit“ wahrt die Breite von πονηρία und vermeidet eine unnötige Festlegung allein auf „Absicht“. „Auf die Probe stellen“ ist für πειράζω im Kontext der Fangfrage treffend; die Fußnote dokumentiert die weiteren möglichen Nuancen. „Heuchler“ ist die etablierte, verständliche Wiedergabe.
