  source_fidelity: Die Übersetzung gibt γνοὺς ... τὴν πονηρίαν αὐτῶν mit „erkannte ihre Bosheit“ sachgerecht wieder. „Doch“ bildet die leichte kontrastive/fortführende Funktion von δέ angemessen ab. Die Frage „Warum stellt ihr mich auf die Probe ...?“ trifft die idiomatische kausale Bedeutung von τί und den kontextuell einschlägigen Sinn von πειράζω. „Ihr Heuchler“ entspricht ὑποκριταί unmittelbar.
