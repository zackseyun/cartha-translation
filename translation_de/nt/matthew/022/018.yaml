id: MAT.22.18
reference: Matthew 22:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: de
  text: 'Doch Jesus erkannte ihre Bosheit und sagte: »Warum stellt ihr mich auf die Probe[a], ihr Heuchler?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum versucht ihr mich?« Das griechische Verb kann je nach Zusammenhang »prüfen«, »erproben« oder »versuchen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: erkannte
  rationale: Das aoristische Partizip bezeichnet Jesu Wahrnehmung, die seinem Sprechen vorausgeht. »Erkannte« ist im Deutschen natürlich und gibt den situativen Sinn von γινώσκω treffend wieder.
- source_word: δὲ
  choice: Doch
  rationale: 'δέ markiert hier einen milden Gegensatz: Die Gegner treten mit einer Fangfrage an Jesus heran, doch er durchschaut sie.'
- source_word: πονηρίαν
  choice: Bosheit
  rationale: πονηρία bezeichnet moralische Schlechtigkeit und kann im Kontext auch eine böse oder arglistige Absicht meinen. »Bosheit« wahrt die lexikalische Breite, ohne das Substantiv ausdrücklich als bloße Absicht auszulegen.
- source_word: εἶπεν
  choice: sagte
  rationale: Die übliche und natürliche Wiedergabe des erzählenden Aorists von λέγω.
- source_word: Τί
  choice: Warum
  rationale: In dieser idiomatischen Frage drückt τί den Grund aus; »Warum« ist die natürliche deutsche Entsprechung.
- source_word: πειράζετε
  choice: stellt ihr mich auf die Probe
  rationale: πειράζω kann prüfen, erproben oder versuchen bedeuten. »Auf die Probe stellen« bewahrt hier den Prüfungssinn und passt zur feindseligen Fangfrage, ohne ausschließlich eine moralische Versuchung zu bezeichnen.
- source_word: ὑποκριταί
  choice: ihr Heuchler
  rationale: »Heuchler« ist die etablierte und kontextuell treffende Wiedergabe für Menschen, die Aufrichtigkeit vorspiegeln und dabei feindselige Absichten verbergen.
theological_decisions:
- issue: Jesu Erkenntnis der inneren Haltung seiner Gegner
  choice: Jesus erkannte ihre Bosheit.
  alternative: Jesus durchschaute ihre böse Absicht beziehungsweise ihre Arglist.
  rationale: Der Text schreibt Jesus eine zutreffende Erkenntnis des moralischen Charakters ihres Vorgehens zu. Die Übersetzung bewahrt diese Aussage, ohne daraus eine weitergehende dogmatische Behauptung abzuleiten.
- issue: Bedeutung von πειράζω in der Fangfrage
  choice: auf die Probe stellen
  alternative: versuchen
  rationale: Der unmittelbare Zusammenhang legt ein feindseliges Prüfen mit dem Ziel nahe, Jesus eine Falle zu stellen. Zugleich bleibt durch die Fußnote die mögliche Nuance des Versuchens sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Doch« bildet den leichten Gegensatz ab; »auf die Probe stellen« klingt natürlich und erhält die Bedeutungsbreite des griechischen Verbs.
