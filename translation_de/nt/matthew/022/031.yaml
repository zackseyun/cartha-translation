  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: de
  text: 'Was aber die Auferstehung der Toten betrifft: Habt ihr nicht gelesen, was Gott euch gesagt hat, als er sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Was aber … betrifft
  rationale: περί mit Genitiv führt das Thema ein; δέ markiert den Übergang und wird durch „aber“ zurückhaltend wiedergegeben, ohne einen starken Gegensatz zu erzeugen.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: die Auferstehung der Toten
  rationale: Die Genitivverbindung bezeichnet die Auferstehung der Verstorbenen; die geläufige deutsche Wendung folgt der griechischen Konstruktion eng.
- source_word: οὐκ ἀνέγνωτε
  choice: Habt ihr nicht gelesen
  rationale: Das Perfekt ist im Deutschen für die rhetorische Frage natürlich und hebt die bleibende Kenntnis der gelesenen Schrift hervor, ohne den griechischen Aorist übermäßig zu spezifizieren.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: was Gott zu euch gesagt hat
  rationale: Die aktive deutsche Form gibt göttliche Urheberschaft und die Adressierung an die Hörer klar und natürlich wieder; die Passivform „was euch von Gott gesagt wurde“ wäre formaler, aber schwerfälliger.
- source_word: λέγοντος
  choice: 'Er sagt:'
  rationale: Das Partizip leitet das folgende direkte Zitat ein. Ein neuer Hauptsatz klingt im modernen Deutsch natürlicher als das partizipiale „indem er spricht“ und bewahrt durch das Präsens die Form von λέγοντος.
theological_decisions:
- issue: Göttliche Urheberschaft und gegenwärtige Anrede durch die Schrift
  choice: „was Gott zu euch gesagt hat“
  alternative: „was euch von Gott gesagt wurde“
  rationale: Der Text stellt das Schriftwort ausdrücklich als Gottes Rede dar, die auch die gegenwärtigen Hörer anspricht. Die aktive Form bewahrt beide Aussagen, ohne eine weitergehende Inspirationstheorie einzutragen.
- issue: Auferstehung der Toten
  choice: „Auferstehung der Toten“
  alternative: „Auferstehung von den Toten“
  rationale: Der Genitiv bezeichnet hier die Toten als diejenigen, die auferstehen. Die Übersetzung hält diese Aussage fest, ohne die Formulierung stärker auf den Ausgang aus dem Totenreich auszurichten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweiteilige Wiedergabe von λέγοντος als „Er sagt:“ vermeidet eine im Deutschen steife Satzkonstruktion und führt klar in das Zitat des folgenden Verses.
