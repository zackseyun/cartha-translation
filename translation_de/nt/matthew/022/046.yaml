id: MAT.22.46
reference: Matthew 22:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: de
  text: Und niemand konnte ihm auch nur ein Wort antworten,[a] und von jenem Tag an wagte es niemand mehr, ihm Fragen zu stellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihm ein Wort antworten«; gemeint ist: »ihm auch nur ein einziges Wort antworten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: niemand
  rationale: Das negative Indefinitpronomen bezeichnet ausnahmslos alle Anwesenden; »niemand« ist die natürliche deutsche Entsprechung.
- source_word: ἐδύνατο
  choice: konnte
  rationale: Der Imperfekt von δύναμαι drückt die damalige Unfähigkeit aus; »konnte« ist im Deutschen idiomatisch und wahrt den Aspekt im Erzählzusammenhang.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: ihm auch nur ein Wort antworten
  rationale: Die Wendung bewahrt das ausdrücklich vorhandene λόγον und gibt mit »auch nur« die im negativen Satz naheliegende Bedeutung eines einzigen Wortes natürlich wieder. Die wörtlichere Form steht in der Fußnote.
- source_word: οὐδὲ
  choice: und … niemand
  rationale: Die zweite negative Aussage wird im Deutschen natürlich mit »und« und erneutem »niemand« angeschlossen; die steifere Form »noch« wird vermieden.
- source_word: ἐτόλμησέν τις
  choice: wagte es niemand
  rationale: τολμάω bezeichnet das Wagen einer Handlung. Wegen des vorangehenden οὐδέ ist die negative deutsche Formulierung sachgerecht.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: von jenem Tag an
  rationale: Die Wendung markiert den Ausgangspunkt eines fortdauernden Zustands und entspricht dem gehobenen, aber modernen Erzählregister.
- source_word: ἐπερωτῆσαι αὐτὸν
  choice: ihm Fragen zu stellen
  rationale: Im Kontext geht es um wiederholtes, prüfendes Befragen Jesu. »Fragen stellen« wahrt dies, ohne die stärkere Bedeutung »verhören« einzutragen.
- source_word: οὐκέτι
  choice: mehr
  rationale: Zusammen mit der negativen Form »niemand« bezeichnet »mehr« idiomatisch das Ende des bisherigen Fragens.
theological_decisions:
- issue: Erzählfunktion des Schweigens der Gegner nach Jesu Antwort
  choice: Die Unfähigkeit zu antworten und das Ende weiterer Fragen werden als erzählte Tatsachen wiedergegeben.
  alternative: Die Formulierung ausdrücklich als Beweis für Jesu überlegene Weisheit oder Autorität auszudeuten.
  rationale: Der Zusammenhang legt Jesu Überlegenheit in der Auseinandersetzung nahe, doch der Vers selbst beschreibt zurückhaltend nur die ausbleibende Antwort und das Ende des Befragens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Von jenem Tag an« erhält den erzählerischen Ton; »ihm Fragen zu stellen« klingt natürlich und wahrt den disputativen Kontext, ohne ihn zu überzeichnen.
