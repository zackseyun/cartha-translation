id: MAT.22.5
reference: Matthew 22:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: de
  text: Doch sie kümmerten sich nicht darum und gingen weg[a], der eine auf seinen eigenen Acker, der andere zu seinen Geschäften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch sie beachteten es nicht und gingen fort“; gemeint ist im Zusammenhang die Einladung des Königs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: sie kümmerten sich nicht darum
  rationale: Das Partizip bezeichnet mangelnde Beachtung oder Gleichgültigkeit. Die Formulierung ist im modernen Deutsch natürlich und lässt das im Griechischen unausgesprochene, aus dem Zusammenhang erkennbare Objekt offen.
- source_word: ἀπῆλθον
  choice: gingen weg
  rationale: Die Wendung gibt die Bewegung fort von der Einladung klar und ohne unnötig gehobenen Ton wieder.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: der eine ... der andere
  rationale: Diese übliche deutsche Verteilungskonstruktion bewahrt den durch μέν ... δέ markierten Gegensatz.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: auf seinen eigenen Acker
  rationale: Acker gibt ἀγρός hier konkret und unmittelbar wieder; eigenen bewahrt die Betonung durch ἴδιον. Die Richtungsangabe wird im Deutschen idiomatisch mit auf ausgedrückt.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: zu seinen Geschäften
  rationale: ἐμπορία bezeichnet Handel oder geschäftliche Tätigkeit. Geschäfte ist natürliches modernes Deutsch und bildet einen verständlichen Gegensatz zur landwirtschaftlichen Arbeit.
theological_decisions:
- issue: Unausgesprochenes Objekt von ἀμελήσαντες
  choice: Das Objekt wird durch „darum“ aufgenommen, ohne die Einladung ausdrücklich in den Vers einzufügen.
  alternative: „Sie beachteten die Einladung nicht“ oder „sie setzten sich darüber hinweg“
  rationale: Der unmittelbare Zusammenhang verweist auf die Einladung des Königs, doch der griechische Satz nennt kein Objekt ausdrücklich. „Darum“ schafft im Deutschen einen natürlichen Rückbezug, ohne den Text unnötig zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Acker“ bewahrt die konkrete Bildsprache, während „Geschäfte“ die Handelstätigkeit idiomatisch wiedergibt. Der Satzbau folgt der griechischen Gegenüberstellung, ohne im Deutschen steif zu wirken.
