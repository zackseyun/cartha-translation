  source_fidelity: Der Entwurf gibt ἀμελήσαντες treffend als „kümmerten sich nicht darum“ wieder und bewahrt damit das im Griechischen nur kontextuell erschließbare Objekt. „Gingen weg“ entspricht ἀπῆλθον. Die Verteilung „der eine … der andere“ bildet ὃς μὲν … ὃς δέ angemessen ab. „Auf seinen eigenen Acker“ und „zu seinen Geschäften“ entsprechen den beiden Zielangaben und erhalten den Kontrast zwischen landwirtschaftlicher und geschäftlicher Tätigkeit.
  naturalness: Der Satz ist idiomatisches modernes Standarddeutsch und hat einen sachlich-würdigen biblischen Erzählton. Die Präpositionen „auf … Acker“ und „zu … Geschäften“ sind natürlich.
  terminology: „Acker“ ist für ἀγρός eine vertretbare konkrete Wiedergabe; „eigenen“ erhält die Hervorhebung von ἴδιον. „Geschäften“ gibt ἐμπορία als geschäftliche bzw. Handelstätigkeit passend wieder. Die Fußnote bietet eine sachlich zutreffende lexikalische Alternative und erläutert den Kontext, ohne den Grundtext zu überdeuten.
