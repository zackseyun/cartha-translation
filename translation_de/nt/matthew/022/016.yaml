id: MAT.22.16
reference: Matthew 22:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: de
  text: 'Und sie schicken ihre Jünger zusammen mit den Herodianern zu ihm, um ihm zu sagen: „Lehrer, wir wissen, dass du wahrhaftig bist und den Weg Gottes der Wahrheit gemäß lehrst. Du lässt dich von niemandem beeinflussen, denn du siehst nicht auf das Ansehen der Menschen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: sie schicken
  rationale: Das historische Präsens wird beibehalten; es ist auch im modernen deutschen Erzählstil verständlich und gibt die griechische Tempusform unmittelbar wieder.
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: ihre Jünger
  rationale: „Jünger“ ist im Evangelienkontext die geläufige Bezeichnung für Anhänger und Schüler.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: zusammen mit den Herodianern
  rationale: Gibt die durch μετά bezeichnete Begleitung beziehungsweise Verbindung natürlich wieder.
- source_word: λέγοντες
  choice: und lassen sagen
  rationale: Die partizipiale Konstruktion wird idiomatisch mit dem Senden verbunden und macht deutlich, dass die Abgesandten die folgenden Worte sprechen.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Entspricht der gewöhnlichen Anrede für einen Lehrenden, ohne zusätzliche hierarchische Bedeutung einzutragen.
- source_word: ἀληθὴς εἶ
  choice: du wahrhaftig bist
  rationale: „Wahrhaftig“ bezeichnet hier zuverlässig den Charakter beziehungsweise die Aufrichtigkeit Jesu; „wahr“ wäre im Deutschen weniger natürlich.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: den Weg Gottes
  rationale: Bewahrt die bildhafte und möglicherweise umfassende Bedeutung des griechischen Ausdrucks.
- source_word: ἐν ἀληθείᾳ
  choice: der Wahrheit gemäß
  rationale: Gibt die Orientierung an der Wahrheit natürlich wieder und vermeidet die im Deutschen steife Formulierung „in Wahrheit lehren“.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: du lässt dich von niemandem beeinflussen
  rationale: Der Kontext meint nicht gefühllose Gleichgültigkeit, sondern Unabhängigkeit vom Rang, Urteil oder Druck anderer; diese idiomatische Wiedergabe passt zur folgenden Begründung.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: denn du siehst nicht auf das Ansehen der Menschen
  rationale: Die deutsche Wendung bewahrt das Motiv des Sehens und vermittelt zugleich den idiomatischen Sinn, dass gesellschaftliches Ansehen keine Rolle spielt.
theological_decisions:
- issue: Unparteilichkeit und Unabhängigkeit gegenüber Menschen
  choice: „Du lässt dich von niemandem beeinflussen, denn du siehst nicht auf das Ansehen der Menschen.“
  alternative: „Niemand kümmert dich, denn du siehst nicht auf das Gesicht der Menschen.“
  rationale: Eine streng wörtliche Fassung könnte moralische Gleichgültigkeit oder bloßes äußeres Sehen nahelegen. Die gewählte Formulierung gibt den idiomatischen Zusammenhang wieder, ohne festzulegen, ob vor allem Rang, öffentliche Meinung oder persönlicher Druck gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens des griechischen Erzähltexts bleibt erhalten. Die Schmeichelei klingt bewusst gehoben, aber verständlich; schwer verständliche Lehnübertragungen der griechischen Idiome werden vermieden.
