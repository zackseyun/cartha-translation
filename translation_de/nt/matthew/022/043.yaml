  text: λέγει αὐτοῖς· Πῶς οὖν Δαυὶδ ἐν πνεύματι ⸂καλεῖ αὐτὸν κύριον⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Wie kann David ihn dann im Geist[a] Herr[b] nennen, indem er sagt:“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Geist“. Die griechische Wendung kann den Bereich oder die vermittelnde Wirksamkeit bezeichnen; „im Geist“ folgt dem Wortlaut enger.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann je nach Zusammenhang auch „Gebieter“ oder „Meister“ bedeuten; hier wird es als Titel mit „Herr“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Er sagte zu ihnen
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: Πῶς οὖν
  choice: Wie kann … dann
  rationale: Die Formulierung bewahrt die Fragekraft von πῶς und den folgernden beziehungsweise anknüpfenden Sinn von οὖν; das deutsche Modalverb macht die idiomatische Tragweite der Frage deutlich, ohne ihren Sinn festzulegen.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Die Präposition ἐν wird eng am Wortlaut wiedergegeben. Die Großschreibung kennzeichnet den im Kontext wahrscheinlichen Bezug auf Gottes Geist, während eine Fußnote die mögliche instrumentale Wiedergabe nennt.
- source_word: καλεῖ αὐτὸν κύριον
  choice: ihn … ‚Herr‘ nennen
  rationale: „Herr“ ist die übliche und intertextuell passende Wiedergabe von κύριος; die Anführungszeichen verdeutlichen, dass es um die von David verwendete Anrede beziehungsweise Bezeichnung geht.
- source_word: λέγων
  choice: wenn er sagt
  rationale: Die finite deutsche Form verbindet das Partizip natürlich mit dem nachfolgenden Schriftzitat.
theological_decisions:
- issue: Bezug von πνεῦμα in ἐν πνεύματι
  choice: Gottes Heiliger Geist als wahrscheinlicher Bezug, wiedergegeben mit „Geist“
  alternative: Davids eigener Geist oder geistlicher Zustand; außerdem instrumental „durch den Geist“
  rationale: Der Kontext inspirierten Schriftsprechens legt Gottes Geist nahe. „Im Geist“ bewahrt jedoch die griechische Ausdrucksweise und vermeidet eine stärkere Festlegung auf bloße Vermittlung beziehungsweise Urheberschaft.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter; Herr und Meister
  rationale: „Herr“ bewahrt sowohl den gewöhnlichen Titelsinn als auch den Zusammenhang mit dem folgenden Zitat aus Psalm 110 und die theologische Spannung der Frage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Präteritum entspricht natürlichem deutschem Erzählstil. „Wie kann … dann“ ist idiomatisch, während „im Geist“ und „Herr“ die intertextuelle und theologische Offenheit des griechischen Wortlauts bewahren.
