  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: de
  text: Und einer von ihnen, ein Gesetzesgelehrter,[a] fragte ihn, um ihn auf die Probe zu stellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Fachmann für das Gesetz. Gemeint ist ein Kenner des jüdischen Gesetzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den schlichten erzählerischen Anschluss an den vorangehenden Zusammenhang, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: ἐπηρώτησεν
  choice: fragte ihn
  rationale: Gibt das Verb knapp und idiomatisch wieder; der Inhalt der Frage folgt im nächsten Vers.
- source_word: εἷς ἐξ αὐτῶν
  choice: einer von ihnen
  rationale: Natürliche deutsche Wiedergabe des partitiven Ausdrucks; der Fragende gehört zu der zuvor genannten Gruppe.
- source_word: νομικὸς
  choice: ein Gesetzesgelehrter
  rationale: Bezeichnet hier einen Fachmann für das jüdische Gesetz. Diese Wiedergabe vermeidet die moderne Assoziation von „Jurist“ oder „Anwalt“ mit staatlichem Recht und Gerichtspraxis.
- source_word: πειράζων
  choice: um ihn auf die Probe zu stellen
  rationale: Gibt die in diesem Zusammenhang naheliegende absichtliche, adversative Prüfung verständlich wieder, ohne die engere moderne Bedeutung von „versuchen“ im Sinn einer Verleitung zur Sünde aufzudrängen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich im Kontext auf Jesus und wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Bedeutungsnuance von πειράζων gegenüber Jesus
  choice: um ihn auf die Probe zu stellen
  alternative: ihn versuchend
  rationale: Das griechische Wort kann prüfen, erproben oder versuchen bedeuten. Der Zusammenhang legt eine herausfordernde Prüfung nahe; die Übersetzung wahrt die feindselige Absicht, ohne ausdrücklich eine Verleitung zum Bösen zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gesetzesgelehrter“ ist sachlich präziser als „Anwalt“ und für den jüdischen Kontext verständlicher; die Fußnote erläutert den historischen Sinn.
