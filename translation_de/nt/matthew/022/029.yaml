  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Ihr irrt euch, weil ihr weder die Schriften noch die Macht Gottes kennt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jesus antwortete ihnen
  rationale: Die griechische Antwortformel lautet wörtlich etwa „Jesus aber antwortete und sagte ihnen“. Im natürlichen modernen Deutsch fasst „antwortete ihnen“ die idiomatische Wendung ohne unnötige Doppelung zusammen; δέ markiert hier vor allem den Übergang zur Erwiderung und muss nicht eigens mit „aber“ wiedergegeben werden.
- source_word: Πλανᾶσθε
  choice: Ihr irrt euch
  rationale: Das Verb bezeichnet hier, dass die Angesprochenen sich im Irrtum befinden beziehungsweise fehlgehen. „Ihr irrt euch“ ist klar, gegenwartsnah und lässt offen, ob der Irrtum selbstverschuldet oder durch Täuschung entstanden ist.
- source_word: μὴ εἰδότες
  choice: weil ihr … nicht kennt
  rationale: Das Partizip benennt in diesem Zusammenhang den Grund ihres Irrtums. Der deutsche Kausalsatz mit „weil“ gibt diesen Zusammenhang verständlich wieder.
- source_word: τὰς γραφὰς
  choice: die Schriften
  rationale: Der Plural bezeichnet im jüdischen Kontext die als heilig und maßgeblich anerkannten Schriften. „Die Schriften“ ist präzise und vermeidet, den antiken Ausdruck unnötig zu modernisieren.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: noch die Macht Gottes
  rationale: μηδέ bildet zusammen mit μή die Paarung „weder … noch“. δύναμις bezeichnet Gottes wirksame Macht beziehungsweise Kraft; „Macht Gottes“ ist hier idiomatisch und bewahrt das Gewicht des Ausdrucks.
theological_decisions:
- issue: Grund für den Irrtum der Sadduzäer
  choice: Ihr Irrtum wird auf ihre Unkenntnis sowohl der Schriften als auch der Macht Gottes zurückgeführt.
  alternative: Das Partizip lediglich begleitend mit „ohne … zu kennen“ wiederzugeben.
  rationale: μὴ εἰδότες erklärt im Kontext am natürlichsten, weshalb sie irren. Die Übersetzung macht diesen kausalen Zusammenhang sichtbar, ohne weiter zu bestimmen, worin Gottes Macht hier genau besteht.
- issue: Bedeutung von Πλανᾶσθε
  choice: „Ihr irrt euch“
  alternative: „Ihr seid getäuscht“ oder „Ihr geht in die Irre“
  rationale: Die griechische Form kann einen Zustand des Irrtums oder des Irregehens ausdrücken. „Ihr irrt euch“ legt keine äußere Täuschungsinstanz fest und bewahrt damit die sachliche Offenheit des Originals.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, direkte Zurechtweisung Jesu bleibt erhalten. Keine Fußnote ist erforderlich, da „Ihr irrt euch“ die relevante Bedeutungsbreite von Πλανᾶσθε im Kontext angemessen wiedergibt.
