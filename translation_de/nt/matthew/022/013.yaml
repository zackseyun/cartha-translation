id: MAT.22.13
reference: Matthew 22:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: de
  text: 'Da sagte der König zu den Dienern: »Fesselt ihm Füße und Hände und werft ihn hinaus in die äußerste Finsternis.[a] Dort wird Heulen und Zähneknirschen sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fesselt ihm Hände und Füße und werft ihn hinaus in die Finsternis draußen.«'
    reason: Nennt eine idiomatischere Körperteilreihenfolge und eine mögliche räumlich-konkrete Wiedergabe von τὸ σκότος τὸ ἐξώτερον.
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Leitet in natürlichem deutschem Erzählstil den unmittelbar folgenden Vorgang ein und gibt die zeitliche Abfolge wieder.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Bewahrt die eindeutige königliche Bildsprache des Gleichnisses.
- source_word: τοῖς διακόνοις
  choice: zu den Dienern
  rationale: Im Rahmen des königlichen Hochzeitsmahls bezeichnet διάκονοι die dem König dienenden Personen; „Diener“ ist verständlich und vermeidet hier kirchliche Amtsassoziationen von „Diakone“.
- source_word: Δήσαντες αὐτοῦ πόδας καὶ χεῖρας
  choice: Fesselt ihm Füße und Hände
  rationale: Das vorangestellte Aoristpartizip wird zusammen mit dem folgenden Imperativ als koordinierte Aufforderung wiedergegeben. „Fesselt“ entspricht dem gewaltsamen Kontext; die griechische Reihenfolge „Füße und Hände“ bleibt erhalten.
- source_word: ἐκβάλετε αὐτὸν
  choice: werft ihn hinaus
  rationale: Gibt die nachdrückliche, gewaltsame Entfernung durch ἐκβάλλω in modernem Deutsch wieder.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: in die äußerste Finsternis
  rationale: Bewahrt den markanten matthäischen Ausdruck und seine räumlich wie theologisch eindringliche Bildsprache, ohne sie auszudeuten.
- source_word: ἐκεῖ ἔσται
  choice: Dort wird … sein
  rationale: Gibt den örtlichen Nachdruck von ἐκεῖ und die Zukunftsform knapp und idiomatisch wieder.
- source_word: ὁ κλαυθμὸς
  choice: Heulen
  rationale: Bezeichnet lautes Klagen und bildet zusammen mit „Zähneknirschen“ die im Deutschen etablierte, eindringliche Wendung.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: Zähneknirschen
  rationale: Ist die prägnante und etablierte deutsche Wiedergabe der Wendung und lässt offen, ob Qual, Verzweiflung oder Wut im Vordergrund steht.
theological_decisions:
- issue: Bedeutung des Ausschlusses in der Gleichnisbildsprache
  choice: Die konkrete Bildsprache vom Hinauswerfen in die äußerste Finsternis bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Finsternis ausdrücklich als Hölle oder Endgericht deuten beziehungsweise auf den bloßen Ausschluss vom Fest begrenzen.
  rationale: Der griechische Text bietet drastische Gerichtsbildsprache, benennt deren dogmatische Entsprechung hier aber nicht ausdrücklich. Die Übersetzung bewahrt daher die theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und knapp. „Finsternis“ trägt den feierlich-literarischen Charakter der wiederkehrenden matthäischen Formel besser als das neutralere „Dunkelheit“.
