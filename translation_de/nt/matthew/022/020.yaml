  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: de
  text: 'Und er sagt zu ihnen: „Wessen Bild und Aufschrift ist das?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler: „Wessen sind dieses Bild und diese Aufschrift?“ Das griechische Fragewort steht im Genitiv und fragt nach Zugehörigkeit oder Zuordnung; „dieses“ bezieht sich grammatisch auf „Bild“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das griechische Präsens ist ein historisches Präsens. Das deutsche Präsens ist hier in der lebendigen Erzählweise natürlich und bildet die Form des Ausgangstextes unmittelbar ab.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Der Dativ Plural bezeichnet die Adressaten der Äußerung; „zu ihnen“ ist die natürliche deutsche Wiedergabe.
- source_word: Τίνος
  choice: Wessen
  rationale: Der Genitiv des Interrogativpronomens fragt nach Zugehörigkeit beziehungsweise Zuordnung; „wessen“ gibt dies knapp und idiomatisch wieder.
- source_word: εἰκών
  choice: Bild
  rationale: „Bild“ ist die übliche und sachlich passende Wiedergabe für das auf der Münze dargestellte Herrscherbild, ohne das Motiv näher auszudeuten.
- source_word: αὕτη
  choice: das
  rationale: Im natürlichen deutschen Fragesatz bezieht sich „das“ gemeinsam auf die wahrgenommenen Merkmale der vorgezeigten Münze; die formal engere Zuordnung von αὕτη zu εἰκών wird in der Fußnote sichtbar gemacht.
- source_word: ἐπιγραφή
  choice: Aufschrift
  rationale: „Aufschrift“ bezeichnet präzise den Schriftzug auf einer Münze und klingt im heutigen Deutsch natürlicher als „Inschrift“ in diesem Zusammenhang.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die beiden erfragten Merkmale, Bild und Aufschrift.
