  language: de
  text: Ebenso erging es auch dem zweiten und dem dritten, bis hin zu allen sieben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Ebenso erging es
  rationale: Das Adverb verbindet den Vers mit dem zuvor geschilderten Geschehen. Die Ergänzung „erging es“ macht die im Griechischen knappe Ellipse im Deutschen natürlich verständlich.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: dem zweiten und dem dritten
  rationale: Die substantivierten Ordnungszahlen bleiben ohne das im Kontext mitgedachte Wort „Bruder“. Die Dativform ist durch die idiomatische Wendung „erging es“ bedingt; das wiederholte καί wird im Deutschen natürlich durch „und“ wiedergegeben.
- source_word: ἕως τῶν ἑπτά
  choice: bis hin zu allen sieben
  rationale: Die Wendung bezeichnet die Fortsetzung bis zur vollständigen Gruppe der sieben Brüder. „Allen“ verdeutlicht idiomatisch den im griechischen Ausdruck gemeinten Gesamtumfang.
theological_decisions: []
