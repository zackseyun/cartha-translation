  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: de
  text: Als aber die Pharisäer hörten, dass er die Sadduzäer zum Schweigen gebracht hatte[a], kamen sie zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »den Sadduzäern einen Maulkorb angelegt hatte«. Das griechische Verb kann bedeuten, jemandem oder einem Tier einen Maulkorb anzulegen; hier bezeichnet es bildlich, dass Jesus sie in der Auseinandersetzung zum Schweigen gebracht hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten erzählerischen Übergang mit kontrastierendem Bezug zur vorausgehenden Auseinandersetzung.
- source_word: Φαρισαῖοι
  choice: die Pharisäer
  rationale: Im Deutschen übliche Bezeichnung der jüdischen Gruppierung.
- source_word: ἀκούσαντες
  choice: als … hörten
  rationale: Das Aoristpartizip wird idiomatisch temporal wiedergegeben und wahrt die zeitliche Beziehung.
- source_word: ἐφίμωσεν
  choice: zum Schweigen gebracht hatte
  rationale: Gibt im Kontext die übertragene Bedeutung des wörtlich mit dem Anlegen eines Maulkorbs verbundenen Verbs natürlich wieder; das Bild bleibt in der Fußnote erhalten.
- source_word: Σαδδουκαίους
  choice: die Sadduzäer
  rationale: Im Deutschen übliche Bezeichnung der jüdischen Gruppierung.
- source_word: συνήχθησαν
  choice: kamen sie zusammen
  rationale: Gibt die intransitive Bedeutung der Aorist-Passivform in natürlichem modernem Deutsch wieder.
- source_word: ἐπὶ τὸ αὐτό
  choice: zusammen
  rationale: Die idiomatische Wendung bezeichnet das Zusammenkommen an einem Ort, ohne hier Ort oder Absicht näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Erzählfluss, während Partizip und Idiom natürlich deutsch wiedergegeben werden.
