  text: 'Als die Pharisäer versammelt waren, fragte Jesus sie:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: Als … versammelt waren
  rationale: Das Genitivus-absolutus-Partizip beschreibt den begleitenden zeitlichen Umstand. „Als“ gibt diesen Hintergrund im Deutschen natürlich wieder; „versammelt waren“ bewahrt den Zustandssinn des Partizips.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel markiert hier einen leichten Fortgang im Erzählzusammenhang, keinen starken Gegensatz. Im Deutschen wird dieser Übergang durch den einleitenden Nebensatz ausreichend getragen; ein zusätzliches „nun“ wäre entbehrlich.
- source_word: τῶν Φαρισαίων
  choice: die Pharisäer
  rationale: Übliche deutsche Bezeichnung der genannten Gruppe; der Genitiv gehört zur absoluten Partizipialkonstruktion.
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: Die Aoristform führt die folgende Frage Jesu ein. „Fragte“ ist die natürliche, sachlich neutrale deutsche Wiedergabe.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Akkusativpronomen verweist auf die unmittelbar zuvor genannten Pharisäer.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Eigenname als Subjekt; der griechische Artikel wird vor Personennamen im Deutschen nicht wiedergegeben.
