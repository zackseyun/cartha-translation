lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Reaktion auf den vorausgehenden Wortwechsel fort.
- source_word: ἀκούσαντες
  choice: als … das hörten
  rationale: Das adverbiale Partizip Aorist wird natürlich als temporaler Nebensatz wiedergegeben. „Das“ bezeichnet sinngemäß Jesu unmittelbar vorausgehende Antwort.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Die Übersetzung bewahrt den griechischen Plural und ist im heutigen Standarddeutsch verständlich.
- source_word: ἐξεπλήσσοντο
  choice: staunten
  rationale: Das Imperfekt bezeichnet die einsetzende beziehungsweise anhaltende Reaktion; „staunten“ gibt die starke Verwunderung klar und würdig wieder.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: über seine Lehre
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass beziehungsweise Gegenstand des Staunens. „Lehre“ ist kontextgemäß und weniger umständlich als „Lehrweise“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechische Plural „Menschenmengen“ bleibt erhalten; die Partizipialkonstruktion wird für natürliche Lesbarkeit temporal aufgelöst.
