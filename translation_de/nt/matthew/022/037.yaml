  source_fidelity: 'Die Übersetzung gibt den griechischen Wortlaut zuverlässig wieder: ἔφη αὐτῷ als „Er sagte zu ihm“, der imperativisch verwendete Futur Ἀγαπήσεις als „Du sollst … lieben“, κύριον τὸν θεόν σου als „den Herrn, deinen Gott“ sowie die dreifache Totalitätsformel mit Herz, Seele und Verstand. Das nicht ausdrücklich wiedergegebene δέ ist als schwacher Anschluss im Deutschen vertretbar.'
