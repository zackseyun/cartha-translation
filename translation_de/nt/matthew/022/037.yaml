id: MAT.22.37
reference: Matthew 22:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: de
  text: 'Er sagte zu ihm: »Du sollst den Herrn, deinen Gott, lieben mit deinem ganzen Herzen, mit deiner ganzen Seele[a] und mit deinem ganzen Verstand[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Seele« kann hier auch den ganzen lebendigen Menschen beziehungsweise das eigene Leben bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit deinem ganzen Denken« beziehungsweise »mit deinem ganzen Verständnis«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: δὲ ist hier ein schwaches Bindewort im fortlaufenden Dialog. Im natürlichen modernen Deutsch muss es nicht eigens wiedergegeben werden.
- source_word: ἔφη αὐτῷ
  choice: Er sagte zu ihm
  rationale: Die Formulierung gibt das schlichte Redeeinleitungsverb φημί und das Dativpronomen αὐτῷ unmittelbar wieder, ohne die nicht ausdrücklich bezeichnete Nuance »antwortete« einzutragen.
- source_word: Ἀγαπήσεις
  choice: Du sollst … lieben
  rationale: Der Futur Indikativ hat im Zitat aus dem Gesetz gebietende Kraft. »Du sollst« bewahrt im Deutschen sowohl den Gebotscharakter als auch den vertrauten Schriftton.
- source_word: κύριον τὸν θεόν σου
  choice: den Herrn, deinen Gott
  rationale: »Herr« ist die angemessene Wiedergabe von κύριος im Gottesnamen-Kontext des Zitats; die Apposition mit Komma ist idiomatisches Deutsch.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: mit deinem ganzen Herzen
  rationale: Obwohl ἐν grundlegend »in« bedeutet, bezeichnet die Konstruktion hier die umfassende Hingabe. Deutsch gibt dies natürlich mit »mit« wieder.
- source_word: ψυχῇ
  choice: Seele
  rationale: ψυχή kann je nach Kontext auch »Leben« oder »Selbst« bedeuten. »Seele« wahrt hier die eigenständige Bezeichnung innerhalb der dreigliedrigen Formulierung.
- source_word: διανοίᾳ
  choice: Verstand
  rationale: διάνοια bezeichnet das Denk- und Erkenntnisvermögen. »Verstand« ist präzise und natürlich; »Denken« bleibt als mögliche Wiedergabe vermerkt.
theological_decisions:
- issue: Wiedergabe des alttestamentlichen Gebots in Jesu Aussage
  choice: Die drei Glieder »Herz … Seele … Verstand« bleiben unterschieden, und Ἀγαπήσεις wird als »Du sollst … lieben« wiedergegeben.
  alternative: Die Glieder zusammenfassend umschreiben oder Ἀγαπήσεις als unmittelbaren Imperativ »Liebe« wiedergeben.
  rationale: Die gewählte Fassung bewahrt die Form und den Gebotscharakter des griechischen Zitats, ohne die genannten Aspekte des Menschen dogmatisch als voneinander trennbare Bestandteile festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der vertraute Gebotston bleibt erhalten, ohne unnötig altertümliche Syntax. Die Wiederholung von »mit deinem ganzen« bildet die emphatische Dreigliederung des Griechischen ab.
