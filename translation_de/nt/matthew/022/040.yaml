  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: de
  text: An diesen beiden Geboten hängen das ganze Gesetz und die Propheten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Gesetz und die Propheten“ ist eine zusammenfassende Bezeichnung für das maßgebliche Schriftzeugnis Israels.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: An diesen beiden Geboten
  rationale: Das griechische ἐν steht hier in Verbindung mit dem Bild des Hängens. Im Deutschen ist „an diesen … hängen“ zugleich idiomatisch und formal nahe am griechischen Ausdruck.
- source_word: ὅλος ὁ νόμος
  choice: das ganze Gesetz
  rationale: ὅλος betont die Gesamtheit. „Das Gesetz“ bewahrt die im matthäischen Zusammenhang erkennbare Bezeichnung der Tora beziehungsweise des maßgeblichen schriftlichen Zeugnisses.
- source_word: κρέμαται
  choice: hängen
  rationale: Die Wiedergabe erhält das anschauliche Bild des griechischen Verbs und lässt dessen Sinn von Abhängigkeit und Zusammenfassung erkennen, ohne ihn durch eine erklärende Paraphrase zu ersetzen.
- source_word: καὶ οἱ προφῆται
  choice: und die Propheten
  rationale: Die feste Verbindung „das Gesetz und die Propheten“ wird bewahrt und verweist auf das schriftliche Zeugnis Israels, nicht bloß auf einzelne prophetische Personen.
theological_decisions:
- issue: Bedeutung der Formel „das Gesetz und die Propheten“
  choice: Die überlieferte Formel bleibt als Bezeichnung des umfassenden Schriftzeugnisses stehen, das an den beiden Liebesgeboten hängt.
  alternative: Nur die ethischen Aussagen der gesetzlichen und prophetischen Schriften sind gemeint.
  rationale: Der Wortlaut lässt die kanonische Reichweite der matthäischen Formel sichtbar, ohne sie auf eine engere ethische Kategorie zu beschränken oder unmittelbar mit „die ganze Schrift“ zu paraphrasieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute und im Deutschen natürliche Metapher „an etwas hängen“ bewahrt sowohl das Bild als auch den Sinn der Abhängigkeit. Wegen der unmissverständlichen festen Formel sind keine typografischen Großschreibungen über die normalen deutschen Regeln hinaus nötig.
