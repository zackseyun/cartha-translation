base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: de
  text: 'In der Auferstehung nun: Wessen Frau von den sieben wird sie sein? Denn alle sieben hatten sie zur Frau.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Denn alle hatten sie.« Gemeint ist: Alle sieben waren mit ihr verheiratet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: bei der Auferstehung
  rationale: Die Verbindung ἐν mit dem Dativ bezeichnet hier den zeitlichen beziehungsweise situativen Rahmen. „Auferstehung“ gibt im Zusammenhang mit der Streitfrage der Sadduzäer den etablierten neutestamentlichen Sinn klar wieder.
- source_word: οὖν
  choice: nun
  rationale: οὖν führt die Folgerung aus dem geschilderten Fall ein. Das deutsche „nun“ bewahrt diesen argumentativen Anschluss und klingt in der Frage natürlich.
- source_word: τίνος τῶν ἑπτὰ
  choice: wessen Frau von den sieben
  rationale: Der Genitiv τίνος fragt nach der ehelichen Zuordnung; τῶν ἑπτὰ grenzt die betreffende Person auf die Gruppe der sieben Brüder ein. Die Formulierung bleibt nahe am griechischen Satzbau, ohne unverständlich zu werden.
- source_word: γυνή
  choice: Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Im deutschen Ausdruck „wessen Frau“ ist die eheliche Bedeutung eindeutig und idiomatisch.
- source_word: πάντες γὰρ
  choice: Sie alle … ja
  rationale: πάντες bezeichnet sämtliche sieben Brüder. Das Modalwort „ja“ vermittelt hier die begründende Funktion von γάρ in einer natürlichen deutschen Aussage.
- source_word: ἔσχον αὐτήν
  choice: hatten sie zur Frau
  rationale: Wörtliches „hatten sie“ wäre im Deutschen mehrdeutig und könnte bloßen Besitz oder Geschlechtsverkehr nahelegen. „Hatten sie zur Frau“ bewahrt die knappe Ausdrucksweise und macht den ehelichen Sinn des Kontextes deutlich.
theological_decisions:
- issue: Bedeutung von ἀνάστασις in der Frage der Sadduzäer
  choice: die künftige Auferstehung der Toten
  alternative: ein unbestimmtes Weiterleben nach dem Tod
  rationale: Der unmittelbare Zusammenhang behandelt ausdrücklich die von den Sadduzäern bestrittene Auferstehung. Die Wiedergabe „Auferstehung“ wahrt diese konkrete Aussage, ohne sie näher dogmatisch auszugestalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Frage folgt dem argumentativen Aufbau des griechischen Textes; die abschließende Begründung wird idiomatisch formuliert, während die Fußnote den ungewöhnlich knappen Wortlaut sichtbar hält.
