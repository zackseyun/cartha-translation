  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: de
  text: 'Sie sagten: „Lehrer, Mose hat gesagt: ‚Wenn ein Mann stirbt, ohne Kinder zu haben, soll sein Bruder die Witwe heiraten[a] und seinem Bruder Nachkommen erwecken.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit Bezug auf die damalige Rechtsordnung: „soll gegenüber der Witwe die Schwagerpflicht erfüllen“. Das griechische Verb bezeichnet hier die Schwagerehe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die direkte Anrede bezeichnet Jesus als Lehrenden; „Lehrer“ ist im modernen Deutschen klar und natürlich.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Wenn ein Mann stirbt
  rationale: Der angeführte Rechtsfall betrifft ausdrücklich einen Mann und die Pflicht seines Bruders; die geschlechtsspezifische Form wird daher bewahrt.
- source_word: μὴ ἔχων τέκνα
  choice: ohne Kinder zu haben
  rationale: τέκνα bezeichnet allgemein Kinder, nicht nur Söhne; die Formulierung gibt die Partizipialkonstruktion verständlich wieder.
- source_word: ἐπιγαμβρεύσει
  choice: soll ... die Witwe heiraten
  rationale: Das Verb bezeichnet hier die Schwagerehe mit der Witwe des verstorbenen Bruders. Die natürliche Hauptübersetzung nennt die Eheschließung; die besondere rechtliche Bedeutung wird in der Fußnote erläutert.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: die Witwe
  rationale: Wörtlich steht „seine Frau“; im Zusammenhang ist sie nach seinem Tod seine Witwe. „Die Witwe“ macht den Bezug im Deutschen eindeutig, ohne den Sinn zu erweitern.
- source_word: ἀναστήσει σπέρμα
  choice: Nachkommen erwecken
  rationale: Die feste Wendung verbindet Zeugung und Fortführung der Linie des Verstorbenen. „Nachkommen erwecken“ bewahrt das Bild des griechischen Ausdrucks und bleibt verständlich.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: seinem Bruder
  rationale: 'Der Dativ bezeichnet die Zuordnung beziehungsweise den Nutzen: Die Nachkommen gelten als Nachkommen des verstorbenen Bruders.'
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe des Rechtsfalls
  choice: „ein Mann“ und „sein Bruder“
  alternative: „jemand“ beziehungsweise eine geschlechtsneutrale Formulierung
  rationale: Die zitierte Regel der Schwagerehe ist in männlichen Verwandtschaftsrollen formuliert; diese Besonderheit des Ausgangstextes wird nicht neutralisiert.
- issue: Zuordnung der Nachkommen zum verstorbenen Bruder
  choice: „seinem Bruder Nachkommen erwecken“
  alternative: „für seinen Bruder Nachkommen zeugen“
  rationale: Die gewählte Form bewahrt die traditionelle Bildsprache von ἀναστήσει, ohne festzulegen, dass der Dativ ausschließlich Nutzen oder ausschließlich rechtliche Zuordnung ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede wird als vollständiger Satz angeschlossen. „Witwe“ beseitigt eine im Deutschen mögliche Unklarheit von „seine Frau“; die Fußnote erklärt den fachsprachlichen Gehalt der Schwagerehe.
