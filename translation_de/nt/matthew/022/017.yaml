id: MAT.22.17
reference: Matthew 22:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: de
  text: 'Sag uns also: Was meinst du? Ist es erlaubt, dem Kaiser die Kopfsteuer zu zahlen, oder nicht?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: Was meinst du?
  rationale: Gibt die idiomatische Frage nach der persönlichen Einschätzung natürlich und präzise wieder.
- source_word: ἔξεστιν
  choice: Ist es erlaubt
  rationale: Bewahrt die Frage nach der rechtlichen beziehungsweise religiös-rechtlichen Zulässigkeit, ohne sie näher festzulegen.
- source_word: δοῦναι
  choice: zu zahlen
  rationale: Obwohl das Verb wörtlich „geben“ bedeutet, bezeichnet es zusammen mit κῆνσον idiomatisch das Entrichten einer Steuer.
- source_word: κῆνσον
  choice: die Steuer
  rationale: Bezeichnet hier die römische Kopf- beziehungsweise Tributsteuer; „Steuer“ ist im Deutschen verständlich und vermeidet eine unnötig enge Festlegung.
- source_word: Καίσαρι
  choice: dem Kaiser
  rationale: Der Titel Caesar bezeichnet hier den römischen Kaiser als Empfänger beziehungsweise Hoheitsträger der Steuer.
theological_decisions:
- issue: Art der in ἔξεστιν angesprochenen Erlaubtheit
  choice: „Ist es erlaubt“ lässt offen, ob vor allem das jüdische Gesetz, das Gewissen oder eine allgemein legitime Verpflichtung gemeint ist.
  alternative: „Ist es nach dem Gesetz erlaubt“
  rationale: Der griechische Text nennt kein bestimmtes Gesetz; die offene Formulierung bewahrt die Spannung der Fangfrage.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, direktem Frageton. Die Anrede wechselt wie im griechischen Text vom pluralischen „uns“ zum singularischen „du“, da Jesus als Einzelner angesprochen wird.
