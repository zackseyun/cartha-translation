  naturalness: '„Sag uns also: Was meinst du?“ ist modernes, natürliches Standarddeutsch und erhält den Wechsel von der Anrede Jesu im Singular zu „uns“ als Objekt. „Die Kopfsteuer zahlen“ ist verständlich und idiomatisch.'
