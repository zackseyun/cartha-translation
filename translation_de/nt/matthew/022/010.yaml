id: MAT.22.10
reference: Matthew 22:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: de
  text: Und jene Sklaven gingen hinaus auf die Straßen und brachten alle zusammen, die sie fanden, Böse wie Gute. Und der Hochzeitssaal[a] füllte sich mit Gästen, die zu Tisch lagen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Hochzeit“; gemeint sein kann die Hochzeitsfeier beziehungsweise der Raum, in dem das Festmahl stattfindet.
    reason: lexical_alternative
  - marker: b
    text: Bei festlichen Mahlzeiten lag man damals üblicherweise auf Polstern am Tisch.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: „Sklaven“ bewahrt den rechtlich und sozial gebundenen Status der königlichen Hausangehörigen, ohne ihn durch „Diener“ abzuschwächen.
- source_word: ὁδοὺς
  choice: Straßen
  rationale: Das Wort bezeichnet hier öffentliche Verkehrswege, auf denen Menschen anzutreffen sind; „Straßen“ ist im Deutschen natürlich und hinreichend weit.
- source_word: συνήγαγον
  choice: brachten ... zusammen
  rationale: Die Wendung gibt das aktive Versammeln der Gefundenen idiomatisch wieder.
- source_word: πάντας οὓς εὗρον
  choice: alle, die sie fanden
  rationale: Die umfassende, personenbezogene Aussage des Griechischen bleibt unmittelbar erhalten.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: Böse wie Gute
  rationale: „Böse“ bewahrt den deutlichen moralischen Gegensatz zu „Gute“; „wie“ gibt die einschließende Verbindung beider Gruppen knapp und natürlich wieder.
- source_word: γάμος
  choice: Hochzeitssaal
  rationale: Wörtlich bezeichnet γάμος die Hochzeit beziehungsweise Hochzeitsfeier. Da sie hier mit zu Tisch Liegenden gefüllt wird, ist der gemeinte Raum im Deutschen als „Hochzeitssaal“ verständlich; die Präzisierung wird durch eine Fußnote offengelegt.
- source_word: ἐπλήσθη
  choice: füllte sich
  rationale: Die deutsche Zustandsveränderung entspricht dem griechischen Passiv natürlich, ohne einen ausdrücklich handelnden Urheber hinzuzufügen.
- source_word: ἀνακειμένων
  choice: mit Gästen, die zu Tisch lagen
  rationale: Die Form bezeichnet das bei einem Festmahl übliche Liegen am Tisch. „Gäste“ ist kontextuell ergänzt und die historische Esshaltung bleibt sichtbar.
theological_decisions:
- issue: Moralische Charakterisierung der Versammelten
  choice: Böse wie Gute
  alternative: Schlechte wie Gute
  rationale: Die Wiedergabe erhält die moralische Schärfe von πονηρός und zugleich die überraschend unterschiedslose Sammlung, ohne vorwegzunehmen, wie die spätere Handlung des Gleichnisses die Anwesenden beurteilt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sklaven“ macht die antike soziale Wirklichkeit sichtbar. Die Satzstruktur bleibt erzählerisch klar; kulturell oder lexikalisch notwendige Verdeutlichungen werden in Fußnoten transparent gemacht.
