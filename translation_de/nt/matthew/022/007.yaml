  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: de
  text: Doch der König wurde zornig. Er schickte seine Truppen, ließ jene Mörder töten und ihre Stadt niederbrennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: wurde zornig
  rationale: Gibt den ingressiv bzw. zustandsverändernden Aorist natürlich und würdig wieder.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: seine Truppen
  rationale: Entspricht dem militärischen Sinn von στρατεύματα im Kontext und ist modernes Standarddeutsch.
- source_word: ἀπώλεσεν
  choice: ließ ... töten
  rationale: Drückt aus, dass der König die Tötung durch die zuvor genannten Truppen vollziehen ließ; im Deutschen natürlicher als eine Formulierung, die ihn persönlich als unmittelbaren Täter erscheinen lässt.
- source_word: ἐνέπρησεν
  choice: ließ ... niederbrennen
  rationale: Bewahrt die kausative Handlung durch die entsandten Truppen und bezeichnet die vollständige gewaltsame Verbrennung einer Stadt idiomatisch.
theological_decisions:
- issue: Mögliche allegorische Deutung des Königs und der zerstörten Stadt
  choice: Keine Deutung in den Vers hineintragen; die erzählte Handlung direkt wiedergeben.
  alternative: Durch erklärende oder abschwächende Sprache eine bestimmte heilsgeschichtliche Identifikation nahelegen.
  rationale: Der Vers steht innerhalb eines Gleichnisses; die Übersetzung soll dessen Spannung bewahren, ohne eine konfessionell bestimmte Auslegung festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die zwei Sätze vermeiden eine schwerfällige Partizipialkonstruktion; die koordinierte Struktur des griechischen Textes bleibt in der Abfolge der Handlungen erhalten.
