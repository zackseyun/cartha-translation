id: MAT.22.45
reference: Matthew 22:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: de
  text: Wenn also David ihn »Herr« nennt, wie kann er dann sein Sohn sein?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aus dem Zusammenhang ausführlicher: »Wenn also David den Messias ›Herr‹ nennt, wie kann er dann Davids Sohn sein?«'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: Wenn also
  rationale: Bewahrt sowohl die konditionale Kraft von εἰ als auch den folgernden Charakter von οὖν und klingt im modernen Deutschen natürlich.
- source_word: Δαυὶδ
  choice: David
  rationale: Übliche deutsche Form des Eigennamens.
- source_word: καλεῖ
  choice: nennt
  rationale: Gibt hier die Bedeutung »als etwas bezeichnen« treffend wieder und erhält den prädikativen Sinn von κύριον.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bleibt wie im Griechischen stehen; sein Bezug ergibt sich aus dem vorherigen Kontext.
- source_word: κύριον
  choice: »Herr«
  rationale: Bewahrt den Ehrentitel und seinen Widerhall aus Psalm 110,1; »Meister« würde diese Resonanz abschwächen.
- source_word: πῶς
  choice: wie
  rationale: Gibt die direkte Frage nach dem logischen Verhältnis natürlich und präzise wieder.
- source_word: υἱὸς αὐτοῦ
  choice: sein Sohn
  rationale: Erhält bewusst die familiäre und königliche Ausdrucksweise; »sein Nachkomme« würde die zugespitzte Spannung abschwächen.
- source_word: ἐστιν
  choice: sein kann
  rationale: Die deutsche Frageform »wie kann ... sein?« gibt die rhetorisch-logische Funktion des griechischen Präsens natürlich wieder, ohne die Aussage inhaltlich aufzulösen.
theological_decisions:
- issue: Messianische und christologische Spannung zwischen Davids »Herrn« und Davids »Sohn«
  choice: »Herr« und »sein Sohn« bleiben im Haupttext ohne erklärende Auflösung stehen.
  alternative: »Wenn also David den Messias ›Herr‹ nennt, wie kann der Messias dann sein Sohn sein?«
  rationale: Im griechischen Vers steht nur das Pronomen αὐτόν; sein messianischer Bezug kommt aus dem Kontext. Die knappe Form bewahrt sowohl die davidische Sohnschaft als auch die übergeordnete Herrschaft, ohne deren Verhältnis dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung mit »dann« macht die argumentative Folge idiomatisch deutlich. Deutsche Anführungszeichen kennzeichnen »Herr« als die Bezeichnung, die David verwendet.
