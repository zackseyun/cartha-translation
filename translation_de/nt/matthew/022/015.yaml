    issue: Unbegründete Richtungsnuance in „gingen ... weg“
    rationale: πορευθέντες bezeichnet Bewegung, ohne hier ausdrücklich ein Weggehen vom gegenwärtigen Ort zu markieren. „Hin gingen“ bewahrt die konventionelle deutsche Erzählform ohne diese zusätzliche Nuance.
  - severity: medium
    issue: „mit einer Äußerung“ ist semantisch mehrdeutig und im Deutschen missverständlich
    rationale: Die Formulierung kann das Mittel als eine Äußerung der Pharisäer verstehen lassen. Im Kontext bezeichnet ἐν λόγῳ die beabsichtigte Verstrickung Jesu durch etwas, das er sagt.
