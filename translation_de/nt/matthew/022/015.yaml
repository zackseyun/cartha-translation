source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: de
  text: Da gingen die Pharisäer hin und hielten Rat, wie sie ihn durch das, was er sagte, in die Falle locken könnten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie sie ihn bei einer Aussage in die Falle locken könnten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Markiert knapp und natürlich die zeitliche Abfolge der Erzählung; im Deutschen verbindet „Da“ den Vorgang gut mit dem vorausgehenden Kontext.
- source_word: πορευθέντες
  choice: gingen ... weg
  rationale: Das vorzeitige Aoristpartizip wird idiomatisch als koordinierte Handlung wiedergegeben und bezeichnet hier das Weggehen vor der Beratung.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Übliche und sachlich genaue deutsche Bezeichnung der genannten Gruppe.
- source_word: συμβούλιον ἔλαβον
  choice: berieten
  rationale: Gibt die idiomatische Wendung natürlich wieder, ohne deren feindseligen Zweck vorwegzunehmen; dieser wird durch den folgenden Zwecksatz ausdrücklich benannt.
- source_word: ὅπως
  choice: wie ... könnten
  rationale: Nach „berieten“ bezeichnet die Konstruktion zugleich den Gegenstand und die Absicht ihrer Beratung; die deutsche Formulierung bewahrt beides.
- source_word: αὐτὸν
  choice: ihn
  rationale: Direkter Bezug auf Jesus.
- source_word: παγιδεύσωσιν
  choice: in die Falle locken
  rationale: Bewahrt das Bild des Fangens mit einer Falle und ist in modernem Deutsch klar verständlich.
- source_word: ἐν λόγῳ
  choice: mit einer Äußerung
  rationale: Das artikellose λόγῳ kann eine Äußerung beziehungsweise etwas Gesagtes bezeichnen; „mit“ gibt den instrumentalen Sinn von ἐν wieder, ohne einen Possessivbezug ausdrücklich in den Ausgangstext einzutragen.
theological_decisions:
- issue: Grad der Feindseligkeit in συμβούλιον ἔλαβον
  choice: Die Wendung neutral mit „berieten“ wiedergeben und die feindselige Absicht im Zwecksatz ausdrücken.
  alternative: „Sie schmiedeten einen Plan“ oder „sie planten“
  rationale: Die böse Absicht ist durch παγιδεύσωσιν eindeutig. Eine neutrale Wiedergabe der Beratungsformel vermeidet es, denselben Gedanken schon dort interpretierend zu verstärken.
- issue: Bezug und Funktion von ἐν λόγῳ
  choice: „mit einer Äußerung“
  alternative: „durch das, was er sagte“ oder „in seinen Worten“
  rationale: Die knappe griechische Wendung lässt offen, ob eine einzelne Äußerung, seine Rede allgemein oder das von ihm Gesagte im Blick ist. Die Hauptfassung erhält diese Knappheit; die Fußnote nennt eine natürliche kontextuelle Entfaltung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung bleibt flüssig; „in die Falle locken“ erhält das griechische Fangbild. Die Fußnote bewahrt die mögliche kontextuelle Entfaltung von ἐν λόγῳ.
