revisions:
- from: Da gingen die Pharisäer weg und berieten, wie sie ihn mit einer Äußerung in die Falle locken könnten.[a]
  to: Da gingen die Pharisäer hin und hielten Rat, wie sie ihn durch das, was er sagte, in die Falle locken könnten.[a]
  rationale: Die Revision entfernt die nicht im griechischen Text festgelegte Nuance von „weg“ und ersetzt die missverständliche instrumentale Formulierung. Die Hauptfassung entfaltet den in ἐν λόγῳ kontextuell vorausgesetzten Bezug auf Jesu Reden; die Fußnote erhält die knappere, weniger explizite Möglichkeit. „Hielten Rat“ bewahrt den neutralen deliberativen Charakter von συμβούλιον ἔλαβον.
