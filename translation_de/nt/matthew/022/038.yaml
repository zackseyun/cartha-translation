base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: de
  text: Dies ist das große und erste Gebot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies ist das oberste Gebot.“ Wörtlicher stehen im Griechischen zwei Beschreibungen: „das große und erste Gebot“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: αὕτη
  choice: Dies
  rationale: Das Demonstrativpronomen verweist auf das unmittelbar zuvor angeführte Gebot zurück. „Dies“ gibt diesen Rückbezug im Deutschen natürlich und präzise wieder.
- source_word: ἐστὶν
  choice: ist
  rationale: Die Kopula im Präsens wird unmittelbar mit „ist“ wiedergegeben.
- source_word: μεγάλη
  choice: große
  rationale: Das Adjektiv bezeichnet hier Größe im Sinn von Bedeutung oder Rang. Die positive Form „große“ bewahrt die Form des griechischen Textes; „größte“ wäre eine ausdrückliche Steigerung.
- source_word: πρώτη
  choice: erste
  rationale: πρώτη kann den ersten Platz in Reihenfolge oder Rang bezeichnen. „erste“ ist die direkte Entsprechung und lässt diese Bedeutungsbreite bestehen.
- source_word: ἐντολή
  choice: Gebot
  rationale: „Gebot“ ist im biblischen und jüdisch-rechtlichen Zusammenhang die geläufige, natürliche Wiedergabe und wahrt den Bezug zur Diskussion über das Gesetz.
theological_decisions:
- issue: Verhältnis von μεγάλη und πρώτη als Bestimmungen des Gebots
  choice: 'Beide Adjektive koordiniert wiedergeben: „das große und erste Gebot“'
  alternative: „das größte und wichtigste Gebot“ oder „das oberste Gebot“
  rationale: Der griechische Text enthält zwei koordinierte Adjektive in der Positivform. Ihre getrennte Wiedergabe bewahrt die rhetorische Spannung zwischen Größe und Vorrang, ohne beide zu einer einzigen Superlativaussage zu verschmelzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst markante Verbindung „das große und erste Gebot“ folgt der griechischen Ausdrucksweise; die Fußnote bietet eine idiomatischere Deutung nach dem Rang.
