    text: 'Auch möglich: „Und Jesus erwiderte und sprach wieder in Gleichnissen zu ihnen: …“ Das griechische „antwortete“ ist eine geläufige Erzählformel, auch wenn unmittelbar zuvor keine ausdrückliche Frage steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den einfachen erzählerischen Anschluss, ohne eine nicht ausdrücklich markierte zeitliche Nuance hinzuzufügen.
- source_word: ἀποκριθεὶς
  choice: antwortete
  rationale: Gibt das übliche griechische Erzählidiom formal wieder, auch wenn unmittelbar zuvor keine ausdrückliche Frage steht.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der griechische Artikel vor dem Eigennamen wird im natürlichen Deutschen nicht wiedergegeben.
- source_word: πάλιν
  choice: wieder
  rationale: Bezeichnet die erneute Aufnahme dieser Redeweise im Erzählverlauf.
- source_word: εἶπεν
  choice: redete
  rationale: Vermeidet zusammen mit dem folgenden λέγων die schwerfällige Wiederholung „sagte … und sagte“ und gibt den Sprechakt natürlich wieder.
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: Die Präposition mit Dativ bezeichnet hier Art oder Mittel des Redens; „in Gleichnissen“ ist die geläufige und präzise deutsche Wendung.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Gibt den Dativ der angesprochenen Personen direkt wieder.
- source_word: λέγων
  choice: 'Er sagte:'
  rationale: Leitet den folgenden Redeinhalt klar und idiomatisch ein; die Aufteilung in einen neuen Satz ersetzt im Deutschen die griechische Partizipialfügung.
theological_decisions:
- issue: Erzählerischer Gebrauch von ἀποκριθεὶς ohne unmittelbar vorausgehende ausdrückliche Frage
  choice: „antwortete“ beibehalten
  alternative: „erwiderte“, „begann zu sprechen“ oder Auslassung
  rationale: Die Formulierung wahrt das griechische Erzählidiom und den Zusammenhang, ohne aus ihm eine besondere theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweigliedrige Formulierung bewahrt „antwortete“ und vermeidet zugleich eine unnatürliche Häufung von „sagen“. Der Doppelpunkt führt in das folgende Gleichnis hinein.
