  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: de
  text: Lehrer, welches Gebot ist im Gesetz das wichtigste?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „groß“; sinngemäß auch: „das größte“.'
    reason: Der griechische Text verwendet den Positiv μεγάλη („groß“), der hier idiomatisch eine Rangordnung ausdrücken kann.
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die Anrede bezeichnet Jesus hier als Lehrenden. „Lehrer“ gibt den gewöhnlichen Sinn von διδάσκαλος direkt wieder und vermeidet die zusätzliche hierarchische Färbung, die „Meister“ im heutigen Deutsch haben kann.
- source_word: ποία
  choice: welches
  rationale: Das Fragewort verlangt die Bestimmung eines Gebots innerhalb der Gesamtheit der Gebote.
- source_word: ἐντολὴ
  choice: Gebot
  rationale: „Gebot“ ist im jüdischen Schrift- und Gesetzeskontext die natürliche und etablierte Wiedergabe von ἐντολή.
- source_word: μεγάλη
  choice: das wichtigste
  rationale: Obwohl μεγάλη formal ein Positiv („groß“) ist, hat es in dieser Frage idiomatisch eine rangordnende Bedeutung. „Das wichtigste“ ist im modernen Deutsch klar und natürlich; die wörtlichere Form wird in der Fußnote bewahrt.
- source_word: ἐν τῷ νόμῳ
  choice: im Gesetz
  rationale: Gemeint ist das jüdische Gesetz beziehungsweise die Tora. Die Großschreibung kennzeichnet diesen bestimmten Schrift- und Offenbarungszusammenhang.
theological_decisions:
- issue: Ob μεγάλη als Positiv oder mit rangordnender Bedeutung wiederzugeben ist
  choice: das wichtigste
  alternative: groß; das größte
  rationale: Der griechische Positiv kann im Zusammenhang eine vergleichende oder superlativische Kraft haben. Die Frage zielt offenbar auf den Rang eines Gebots. Die Hauptfassung gibt diesen Sinn in natürlichem Deutsch wieder, während die Fußnote die formale Ausdrucksweise des Griechischen sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung „im Gesetz das wichtigste“ klingt natürlich und macht deutlich, dass nach dem Rang innerhalb des Gesetzes gefragt wird. „Lehrer“ bleibt bewusst nahe an der griechischen Anrede.
