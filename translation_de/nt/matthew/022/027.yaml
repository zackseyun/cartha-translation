  text: Last of all[a], the woman died.
translation:
  language: de
  text: Zuletzt starb auch die Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον … πάντων
  choice: Zuletzt
  rationale: Die Verbindung bezeichnet das abschließende Ereignis in der geschilderten Reihenfolge. „Zuletzt“ gibt den Sinn knapp und natürlich wieder.
- source_word: δὲ
  choice: auch
  rationale: δέ ist hier ein schwaches Bindeglied. Im Deutschen fügt „auch“ den Tod der Frau natürlich an die zuvor genannten Todesfälle an, ohne einen Gegensatz auszudrücken.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Der Aorist stellt den Tod als schlichtes Ereignis fest; „starb“ ist die direkte, nicht euphemistische Wiedergabe.
- source_word: ἡ γυνή
  choice: die Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Da dieselbe Frau in dem Beispiel nacheinander mit mehreren Brüdern verbunden war, bewahrt „die Frau“ die Perspektive des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller und allgemein verständlicher Erzählstil. Das zusätzliche „auch“ macht im Deutschen den Anschluss an die Reihe der zuvor verstorbenen Brüder deutlich.
