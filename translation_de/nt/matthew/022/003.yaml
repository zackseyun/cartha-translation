id: MAT.22.3
reference: Matthew 22:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: de
  text: Und er sandte seine Diener[a] aus, um die Geladenen[b] zur Hochzeitsfeier[c] zu rufen; doch sie wollten nicht kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklaven“. Das griechische Wort kann sowohl Diener als auch Sklaven bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Gerufenen“. Im Griechischen steht hier dasselbe Verb wie bei „zu rufen“; in diesem Zusammenhang sind die zuvor Eingeladenen gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zum Hochzeitsmahl“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte … aus
  rationale: Die Verbform bezeichnet ein abgeschlossenes Aussenden. „Sandte … aus“ ist im Deutschen natürlich und gibt den Auftrag der Diener als Boten wieder.
- source_word: δούλους
  choice: Diener
  rationale: δοῦλος kann je nach Zusammenhang „Sklave“ oder „Diener“ bedeuten. Hier steht die Aufgabe als Abgesandte des Königs im Vordergrund, nicht ihr rechtlicher oder sozialer Status.
- source_word: καλέσαι
  choice: zu rufen
  rationale: „Rufen“ bewahrt soweit möglich die Wiederholung von καλέω in καλέσαι und κεκλημένους. Im Zusammenhang bedeutet der Ruf, dass die schon Geladenen nun zur Feier kommen sollen.
- source_word: κεκλημένους
  choice: die Geladenen
  rationale: Das Perfektpartizip bezeichnet Personen, die zuvor eingeladen worden waren. „Die Geladenen“ drückt dies knapp und idiomatisch aus, ohne aus dem erneuten Ruf eine erstmalige Einladung zu machen.
- source_word: εἰς τοὺς γάμους
  choice: zur Hochzeitsfeier
  rationale: Der Plural γάμοι bezeichnet hier die Hochzeitsfeier und kann insbesondere das damit verbundene Festmahl einschließen.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: doch sie wollten nicht kommen
  rationale: Die Formulierung gibt die im griechischen Verb ausgedrückte Willenshaltung unmittelbar wieder. „Sie weigerten sich“ wäre möglich, aber stärker formuliert.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gleichnis
  choice: Diener
  alternative: Sklaven
  rationale: Im unmittelbaren Zusammenhang handeln sie als Boten des Königs. „Diener“ stellt diese erzählerische Funktion heraus; die mögliche Bedeutung „Sklaven“ bleibt in der Fußnote sichtbar.
- issue: Verhältnis zwischen vorheriger Einladung und gegenwärtigem Ruf
  choice: die Geladenen … zu rufen
  alternative: die Gerufenen … zu rufen
  rationale: Das Perfekt κεκλημένους weist auf den vorausgegangenen Ruf beziehungsweise die Einladung hin, während καλέσαι den nun ergehenden Ruf zum Kommen bezeichnet. Die Übersetzung macht diese zeitliche Spannung verständlich, ohne die Wiederholung ganz aufzugeben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Doch“ gibt den Gegensatz des zweiten καί idiomatisch wieder. Die Satzstellung bleibt nahe am griechischen Ablauf, ohne unnatürlich zu wirken.
