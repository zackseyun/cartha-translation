  source_fidelity: „Das Himmelreich wurde mit einem König verglichen“ gibt Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ treffend wieder. Die Vergangenheitsform des Aorist Passiv bleibt erhalten; „mit einem König“ ist für die griechische Verbindung idiomatisch und muss ἄνθρωπος nicht künstlich separat abbilden. „… der für seinen Sohn ein Hochzeitsfest veranstaltete“ erfasst ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ vollständig und ohne interpretative Ergänzung.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und bewahrt einen angemessen würdevollen biblischen Registerton. „Himmelreich“ sowie „ein Hochzeitsfest veranstaltete“ sind natürlich und verständlich.
  terminology: „Himmelreich“ wahrt die spezifisch matthäische Formulierung und ersetzt sie nicht durch „Reich Gottes“. „Hochzeitsfest“ gibt γάμοι als Festlichkeiten idiomatisch wieder. Die Fußnoten sind korrekt verankert, verständlich formuliert und entsprechen den lexikalischen Alternativen des englischen Audit-Trails.
