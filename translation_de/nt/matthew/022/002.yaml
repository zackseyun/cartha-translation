id: MAT.22.2
reference: Matthew 22:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: de
  text: Das Himmelreich wurde mit einem König verglichen, der für seinen Sohn ein Hochzeitsfest veranstaltete.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Himmelreich lässt sich mit einem König vergleichen.“ Wörtlicher steht im Griechischen die Vergangenheitsform „wurde … verglichen“ beziehungsweise „wurde … gleichgemacht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Hochzeiten“ (Mehrzahl); die griechische Wendung bezeichnet die Hochzeitsfeierlichkeiten oder das Hochzeitsmahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: wurde mit … verglichen
  rationale: Der Aorist Passiv Indikativ wird formal als vergangene passive Aussage wiedergegeben; die geläufige parabolische Alternative „lässt sich vergleichen“ ist möglich, enthält jedoch eine im Griechischen nicht ausdrücklich markierte modale Nuance.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: „Himmelreich“ ist die natürliche und etablierte deutsche Wiedergabe der für Matthäus kennzeichnenden Wendung und bewahrt ihren Unterschied zu „Reich Gottes“.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: mit einem König
  rationale: Die Verbindung von ἄνθρωπος und βασιλεύς bezeichnet hier idiomatisch einen königlichen Menschen beziehungsweise einen König. „Mit einem Menschen, einem König“ wäre im Deutschen unnötig schwerfällig.
- source_word: ὅστις
  choice: der
  rationale: Das Relativpronomen leitet schlicht die Handlung des Königs ein; eine verstärkende Wiedergabe wäre hier überzogen.
- source_word: ἐποίησεν γάμους
  choice: ein Hochzeitsfest veranstaltete
  rationale: ποιέω mit dem pluralischen γάμοι bezeichnet idiomatisch das Ausrichten der Hochzeitsfeierlichkeiten. Die deutsche Formulierung ist natürlich und erfasst den festlichen Zusammenhang.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: für seinen Sohn
  rationale: Der Dativ bezeichnet die Person, für die das Fest veranstaltet wird; die Hochzeit selbst ist bereits durch γάμους ausgedrückt.
theological_decisions:
- issue: Bezeichnung der βασιλεία τῶν οὐρανῶν
  choice: Himmelreich
  alternative: Reich Gottes; Herrschaft des Himmels
  rationale: Matthäus’ eigene Formulierung bleibt erhalten, ohne sie harmonisierend oder theologisch auslegend zu ersetzen. Ob stärker an Herrschaft oder Reichsbereich gedacht ist, wird nicht einseitig festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Himmelreich“ ist allgemein verständlich und bewahrt den matthäischen Sprachgebrauch; „Hochzeitsfest veranstaltete“ gibt die griechische Festwendung idiomatisch wieder.
