  rationale: Die Ergänzung von „Gebot“ beseitigt eine im Deutschen unnatürliche Ellipse und verdeutlicht den vom griechischen Kontext vorausgesetzten Bezug auf das erste Gebot. Die Fußnote wird entsprechend vollständig formuliert. Die Aussage, dass das zweite Gebot dem ersten gleich bzw. vergleichbar ist, bleibt ohne weitergehende dogmatische Ausdeutung erhalten.
