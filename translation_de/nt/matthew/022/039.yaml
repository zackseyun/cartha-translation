    rationale: Die Wiedergabe „ein zweites“ lässt im Deutschen das sachlich benötigte Bezugswort offen. Da Δευτέρα sich im Kontext auf das zuvor genannte Gebot bezieht, macht „ein zweites Gebot“ diesen Bezug explizit, ohne den Sinn zu verändern.
