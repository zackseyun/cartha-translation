  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: de
  text: 'Und ein zweites Gebot ist ihm gleich: »Du sollst deinen Nächsten lieben wie dich selbst.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das zweite Gebot ist ihm gleich.«'
    reason: Das artikellose Δευτέρα kann im Zusammenhang sowohl mit »ein zweites« als auch mit »das zweite« wiedergegeben werden.
lexical_decisions:
- source_word: Δευτέρα
  choice: ein zweites
  rationale: Das artikellose feminine Ordinaladjektiv wird substantivisch gebraucht. »Ein zweites« bewahrt die grammatische Offenheit gegenüber »das zweite« und klingt im Deutschen natürlich.
- source_word: δὲ
  choice: Und
  rationale: δέ führt hier den Gedankengang mit einer milden Verknüpfung fort und bezeichnet keinen starken Gegensatz.
- source_word: ὁμοία αὐτῇ
  choice: ist ihm gleich
  rationale: ὁμοία mit Dativ drückt Ähnlichkeit beziehungsweise Entsprechung aus. »Ihm gleich« bezieht sich klar auf das zuvor genannte Gebot und wahrt den gehobenen, knappen Ton.
- source_word: Ἀγαπήσεις
  choice: Du sollst lieben
  rationale: Der futurische Indikativ hat im Schriftzitat gebietende Kraft. Die deutsche Form »Du sollst« gibt diesen Gebotscharakter wieder und entspricht dem vertrauten biblischen Register.
- source_word: τὸν πλησίον σου
  choice: deinen Nächsten
  rationale: Die feste Wendung bezeichnet den Mitmenschen beziehungsweise Nächsten, nicht lediglich eine räumlich nahe Person.
- source_word: ὡς
  choice: wie
  rationale: »Wie« führt im Deutschen natürlich und präzise den Vergleichsmaßstab ein.
- source_word: σεαυτόν
  choice: dich selbst
  rationale: Das Reflexivpronomen verweist auf das angesprochene »du«; »dich selbst« ist die direkte idiomatische Entsprechung.
theological_decisions:
- issue: Verhältnis des zweiten Gebots zum ersten
  choice: ein zweites ist ihm gleich
  alternative: das zweite ist ihm gleich
  rationale: Die Übersetzung wahrt sowohl den Ordinalsinn als auch die Aussage der Entsprechung zum ersten Gebot, ohne beide Gebote gleichzusetzen oder ihre Beziehung dogmatisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anführungszeichen kennzeichnen das Schriftzitat; »Du sollst« bewahrt dessen gebietenden und biblischen Charakter.
