id: MAT.22.11
reference: Matthew 22:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: de
  text: Als aber der König hereinkam, um sich die zu Tisch liegenden Gäste[a] anzusehen, sah er dort einen Mann, der kein Hochzeitsgewand[b] trug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Liegenden“. Bei festlichen Mahlzeiten lag man in der Antike üblicherweise auf Polstern zu Tisch.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „keine Hochzeitskleidung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν δὲ
  choice: Als aber … hereinkam
  rationale: Der Aoristpartizip bezeichnet die dem Hauptverb vorausgehende Handlung; δέ führt zugleich eine spannungsvolle Wendung der Erzählung ein.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Die übliche und kontextgemäße Wiedergabe im königlichen Gleichnis.
- source_word: θεάσασθαι
  choice: um sich … anzusehen
  rationale: Der Infinitiv bezeichnet den Zweck des Hereinkommens. „Sich ansehen“ gibt das bewusste Betrachten natürlich wieder, ohne eine amtliche Inspektion ausdrücklich festzulegen.
- source_word: τοὺς ἀνακειμένους
  choice: die zu Tisch Liegenden
  rationale: ἀνάκειμαι bezeichnet im antiken Festmahlkontext das Liegen bei Tisch. Die Formulierung bewahrt dieses historische Detail und bleibt verständlich.
- source_word: εἶδεν ἐκεῖ
  choice: sah er dort
  rationale: Direkte Wiedergabe des Wahrnehmungsverbs und des Ortsadverbs.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Im Gleichnis ist eine einzelne männliche Person gemeint; die geschlechtsspezifische Form des Ausgangstextes bleibt erhalten.
- source_word: οὐκ ἐνδεδυμένον
  choice: der … nicht trug
  rationale: Das Perfektpartizip beschreibt den gegenwärtigen Bekleidungszustand. Im Deutschen ist „nicht tragen“ in Verbindung mit einem Kleidungsstück idiomatisch.
- source_word: ἔνδυμα γάμου
  choice: kein Hochzeitsgewand
  rationale: Die singularische Wendung wird formnah wiedergegeben. „Hochzeitsgewand“ kann sowohl ein bestimmtes Kleidungsstück als auch hochzeitsgemäße Kleidung bezeichnen, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Körperhaltung beim Festmahl
  choice: Das Liegen zu Tisch wird im Text beibehalten und durch eine Kulturfußnote erläutert.
  alternative: Nur „die Gäste“ oder „die Tischgäste“ schreiben.
  rationale: Die konkrete antike Bankettsitte gehört zum Bild des Gleichnisses. Ihre Beibehaltung bewahrt die historische Textur, ohne ihr eine besondere theologische Deutung aufzuerlegen.
- issue: Bedeutung von ἔνδυμα γάμου
  choice: „Hochzeitsgewand“ ohne nähere Bestimmung
  alternative: „festliche Kleidung“ oder „angemessene Hochzeitskleidung“
  rationale: Der Ausgangstext erklärt weder Beschaffenheit noch Herkunft des Gewands. Die Übersetzung lässt diese Offenheit bestehen und deutet das Bild nicht konfessionell aus.
- issue: Geschlecht von ἄνθρωπον
  choice: „einen Mann“
  alternative: „einen Menschen“ oder „jemanden“
  rationale: Hier bezeichnet das maskuline Singularwort eine konkrete Gestalt der Erzählung, nicht die Menschheit allgemein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung folgt der griechischen Handlungsabfolge, während „um sich … anzusehen“ und „trug“ natürliches heutiges Deutsch bieten. Die ungewöhnliche Banketthaltung wird bewusst im Haupttext bewahrt und knapp erläutert.
