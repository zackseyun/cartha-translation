review_pass:
  verdict: revise
  source_fidelity: 'Die Satzstruktur, das historische Präsens (λέγει: „sagt“) und der Festkontext von γάμος sind zutreffend wiedergegeben. „ist vorbereitet“ verschiebt jedoch ἕτοιμός ἐστιν („ist bereit“) in Richtung eines abgeschlossenen Vorbereitungsvorgangs. „waren es nicht wert“ legt zudem stärker „verdienten es nicht“ nahe und ergänzt ein Objekt; ἄξιοι bezeichnet hier unmittelbar ihr Unwürdig- bzw. Nicht-geeignet-Sein.'
  naturalness: Die Formulierung ist insgesamt flüssiges modernes Standarddeutsch. „Das Hochzeitsfest ist bereit“ ist auch im heutigen Deutsch idiomatisch; „waren nicht würdig“ ist in diesem würdigen Gleichnisregister natürlich und genauer als die umschreibende Formulierung.
  terminology: „Dienern“, „Hochzeitsfest“ und „die Eingeladenen“ passen zum Gleichniskontext. Die Fußnote bewahrt die formnähere Wiedergabe von κεκλημένοι, ohne eine theologische Fachbedeutung in den Haupttext einzutragen.
  issues:
  - severity: medium
    issue: „ist vorbereitet“ statt „ist bereit“
    rationale: ἕτοιμός ἐστιν ist ein Zustandsausdruck („ist bereit“), nicht ausdrücklich eine Aussage über den vorherigen Vorgang des Vorbereitens. Die deutsche Korrektur hält den Quellwortlaut genauer ein.
  - severity: medium
    issue: „waren es nicht wert“ statt „waren nicht würdig“
    rationale: Die Wendung kann „verdienten es nicht“ bedeuten und macht das Fest zu einem ergänzten Bezugsobjekt. „waren nicht würdig“ bewahrt die prädikative und bewertende Offenheit von οὐκ ἦσαν ἄξιοι.
  revised_text: 'Dann sagt er zu seinen Dienern: »Das Hochzeitsfest ist bereit, aber die Eingeladenen[a] waren nicht würdig.«'
  revised_footnotes:
  - marker: a
    text: 'Wörtlicher: »die Gerufenen«. Im Zusammenhang mit dem Hochzeitsfest sind damit die eingeladenen Gäste gemeint.'
    reason: lexical_alternative
  revision_rationale: 'Die Revision beschränkt sich auf zwei quellentreuere Prädikate: „bereit“ gibt ἕτοιμος unmittelbar wieder, und „nicht würdig“ erhält die offene wertende Aussage von ἄξιος. Kontext, Register, historisches Präsens und Fußnotenanker bleiben erhalten.'
