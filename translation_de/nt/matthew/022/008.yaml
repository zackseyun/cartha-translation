id: MAT.22.8
reference: Matthew 22:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: de
  text: 'Dann sagt er zu seinen Dienern: »Das Hochzeitsfest ist bereit, aber die Eingeladenen[a] waren nicht würdig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Gerufenen«. Im Zusammenhang mit dem Hochzeitsfest sind damit die eingeladenen Gäste gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Gibt die zeitliche Abfolge knapp und natürlich wieder.
- source_word: λέγει
  choice: sagt er
  rationale: Bewahrt das historische Präsens und damit die erzählerische Lebendigkeit des griechischen Textes.
- source_word: δούλοις
  choice: Dienern
  rationale: Passt zum königlichen Gleichniskontext; der rechtliche Status als Sklaven steht hier nicht im Vordergrund.
- source_word: Ὁ μὲν γάμος
  choice: Das Hochzeitsfest
  rationale: γάμος bezeichnet hier angesichts des vorbereiteten Mahls die Hochzeitsfeier beziehungsweise das Fest, nicht nur die Eheschließung. Der mit μέν eröffnete Gegensatz wird durch »aber« wiedergegeben.
- source_word: ἕτοιμός ἐστιν
  choice: ist vorbereitet
  rationale: Drückt idiomatisch aus, dass das Fest bereitsteht; »ist bereit« wäre ebenfalls möglich, klingt bei einem Fest im Deutschen jedoch weniger natürlich.
- source_word: οἱ δὲ κεκλημένοι
  choice: aber die Eingeladenen
  rationale: Das Perfektpartizip von καλέω bezeichnet im unmittelbaren Festkontext die zuvor eingeladenen Gäste. Die wörtlichere Alternative »die Gerufenen« wird in der Fußnote bewahrt.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: waren es nicht wert
  rationale: Bewahrt die wertende Kraft von ἄξιος, ohne den Grund ihrer Unwürdigkeit näher zu bestimmen.
theological_decisions:
- issue: Mögliche theologische Nebenbedeutung von κεκλημένοι im Sinn von »Berufene«
  choice: die Eingeladenen
  alternative: die Gerufenen / die Berufenen
  rationale: Im unmittelbaren Gleichniskontext geht es um Gäste, die zu einer Hochzeit eingeladen worden waren. »Berufene« könnte im Deutschen stärker eine heilsgeschichtliche Fachbedeutung nahelegen, als der Kontext verlangt. Die formnähere Wiedergabe bleibt per Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens bleibt erhalten. »Hochzeitsfest« verdeutlicht den Festmahlkontext; die Fußnote bewahrt die lexikalische Spannweite von καλέω.
