- from: 'Dann sagt er zu seinen Dienern: »Das Hochzeitsfest ist vorbereitet, aber die Eingeladenen[a] waren es nicht wert.«'
  to: 'Dann sagt er zu seinen Dienern: »Das Hochzeitsfest ist bereit, aber die Eingeladenen[a] waren nicht würdig.«'
  rationale: 'Die Revision beschränkt sich auf zwei quellentreuere Prädikate: „bereit“ gibt ἕτοιμος unmittelbar wieder, und „nicht würdig“ erhält die offene wertende Aussage von ἄξιος. Kontext, Register, historisches Präsens und Fußnotenanker bleiben erhalten.'
