id: MAT.22.32
reference: Matthew 22:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: de
  text: »Ich bin der Gott Abrahams und der Gott Isaaks und der Gott Jakobs.« Er ist nicht der Gott der Toten, sondern der Lebenden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die direkte Selbstbezeichnung im Präsens bewahrt die griechische Form und die Bedeutung des Schriftzitats für Jesu Argument.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: der Gott Abrahams und der Gott Isaaks und der Gott Jakobs
  rationale: Die dreifache Wiederholung von Artikel und Substantiv bleibt erhalten und gibt dem Satz sein rhetorisches Gewicht; die deutschen Genitivformen sind natürlich und präzise.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Er ist nicht der Gott
  rationale: Das Pronomen greift den unmittelbar zuvor genannten Gott idiomatisch auf. Der im Griechischen erneut ausdrücklich stehende Gottesbegriff bleibt im Prädikatsnomen „der Gott“ erhalten.
- source_word: νεκρῶν
  choice: der Toten
  rationale: Das substantivierte Adjektiv im Genitiv Plural wird knapp und natürlich wiedergegeben.
- source_word: ζώντων
  choice: der Lebenden
  rationale: Das substantivierte Partizip wird parallel zu „der Toten“ übersetzt und bewahrt die prägnante Gegenüberstellung.
theological_decisions:
- issue: Folgerung aus dem gegenwärtigen Gottesverhältnis der Patriarchen für Jesu Auferstehungsargument
  choice: Die Aussage wird ohne erklärenden Zusatz unmittelbar wiedergegeben.
  alternative: Er ist nicht der Gott von Menschen, die tot sind, sondern von Menschen, die für ihn leben.
  rationale: Die Übersetzung bewahrt die Aussagekraft und Spannung des Textes, ohne eine bestimmte Lehre über Auferstehung oder Zwischenzustand in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die Wiederholung „der Gott“ wurde wegen ihrer rhetorischen und argumentativen Funktion beibehalten. Deutsche Anführungszeichen kennzeichnen das in Jesu Rede angeführte Schriftwort.
