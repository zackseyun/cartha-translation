id: MAT.22.30
reference: Matthew 22:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: de
  text: Denn in der Auferstehung[a] heiraten sie weder noch werden sie verheiratet, sondern sind wie die Engel Gottes im Himmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bei der Auferstehung.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: bei der Auferstehung
  rationale: Die Wendung kann Zeit oder Zustand bezeichnen. „Bei der Auferstehung“ ist im Deutschen natürlich und lässt offen, ob das Ereignis oder das auferstandene Leben im Blick ist.
- source_word: γαμοῦσιν
  choice: heiraten
  rationale: Das Verb bezeichnet das Eingehen einer Ehe; „heiraten“ ist die natürliche, allgemein verständliche deutsche Entsprechung.
- source_word: γαμίζονται
  choice: werden sie verheiratet
  rationale: Die passive Form wird gegenüber γαμοῦσιν eigens wiedergegeben und bewahrt den Unterschied zwischen selbst heiraten und verheiratet werden.
- source_word: ὡς
  choice: wie
  rationale: ὡς drückt hier einen Vergleich aus, keine Gleichsetzung; Auferstandene werden mit Engeln verglichen, nicht als Engel bezeichnet.
- source_word: ἄγγελοι θεοῦ
  choice: die Engel Gottes
  rationale: Der Genitiv θεοῦ wird ausdrücklich wiedergegeben; die Formulierung ist würdig und quellennah.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Im Zusammenhang bezeichnet οὐρανός den himmlischen Bereich, in dem die Engel sind, nicht den sichtbaren Himmel.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage; „Denn“ erhält diese erklärende Verknüpfung.
theological_decisions:
- issue: Art des Vergleichs mit den Engeln
  choice: Die Auferstandenen sind wie die Engel, insbesondere im unmittelbar genannten Hinblick darauf, dass sie nicht heiraten.
  alternative: Der Vergleich könnte als umfassende Aussage über eine engelgleiche Existenz verstanden werden.
  rationale: ὡς kennzeichnet Ähnlichkeit statt Identität. Der unmittelbare Zusammenhang legt den Verzicht auf Ehe als Vergleichspunkt nahe, ohne den möglichen Umfang des Vergleichs im Übersetzungstext weiter festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Register. Die parallele Struktur „weder … noch“ bildet die beiden griechischen Verbformen ab, ohne geschlechtsspezifische Rollen unnötig einzutragen.
