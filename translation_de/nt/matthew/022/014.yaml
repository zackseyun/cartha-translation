  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: de
  text: Denn viele sind berufen[a], aber wenige sind ausgewählt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eingeladen“; im Zusammenhang des Hochzeitsmahls kann das Wort den Sinn einer Einladung tragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auserwählt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv wird knapp mit „viele“ wiedergegeben und bildet den direkten Gegensatz zu ὀλίγοι.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ bewahrt die begründende beziehungsweise erläuternde Verbindung zum vorausgehenden Gleichnis.
- source_word: εἰσιν
  choice: sind
  rationale: Direkte und natürliche Wiedergabe des Präsens von εἰμί.
- source_word: κλητοὶ
  choice: berufen
  rationale: „Berufen“ erhält sowohl die Grundbedeutung des Rufens als auch die weiter reichende Aussage des abschließenden Spruchs. Im Zusammenhang des Hochzeitsmahls ist auch „eingeladen“ möglich und wird in einer Fußnote genannt.
- source_word: ὀλίγοι
  choice: wenige
  rationale: Die knappe Wiedergabe erhält den pointierten Gegensatz zwischen „viele“ und „wenige“.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ gibt den deutlichen Kontrast zwischen den beiden Satzhälften wieder.
- source_word: ἐκλεκτοί
  choice: ausgewählt
  rationale: „Ausgewählt“ gibt den transparenten Wortsinn wieder, ohne im Haupttext von vornherein einen später geprägten theologischen Fachausdruck einzusetzen. Das traditionelle „auserwählt“ bleibt als mögliche Wiedergabe in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von ἐκλεκτοί in einer Aussage, die häufig in Debatten über Berufung und Erwählung herangezogen wird
  choice: ausgewählt
  alternative: auserwählt
  rationale: Beide Wiedergaben sind lexikalisch möglich. „Ausgewählt“ wahrt im Haupttext den unmittelbaren Sinn und lässt die genaue theologische Beziehung zwischen Berufung und Erwählung offen; „auserwählt“ wird als traditionelle und theologisch resonante Alternative ausgewiesen.
- issue: Wiedergabe von κλητοί im Zusammenhang des Gleichnisses vom Hochzeitsmahl
  choice: berufen
  alternative: eingeladen
  rationale: „Eingeladen“ passt unmittelbar zum Bild des Festmahls, während „berufen“ den breiteren Bedeutungsumfang und den Gegensatz zu ἐκλεκτοί erhält. Die Fußnote bewahrt die kontextuell naheliegende Alternative.
translation_notes:
  register: Knapper, würdevoller und allgemein verständlicher Aussagesatz. Die sprichwortartige Gegenüberstellung „viele … aber wenige“ bleibt erhalten; „Denn“ bindet den Vers ausdrücklich an das vorausgehende Gleichnis an.
