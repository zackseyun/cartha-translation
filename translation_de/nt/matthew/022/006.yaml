  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: de
  text: Die Übrigen aber ergriffen seine Sklaven[a], misshandelten sie und töteten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener.'
    reason: Lexikalische Alternative für δοῦλοι; der Ausdruck kann im Kontext die Funktion als Diener oder Boten hervorheben, bezeichnet jedoch zugleich ihren Sklavenstatus.
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Die Übrigen aber
  rationale: λοιποί bezeichnet die übrigen zuvor genannten Eingeladenen; das nachgestellte „aber“ gibt die leicht kontrastierende Kraft von δέ natürlich wieder.
- source_word: κρατήσαντες
  choice: packten
  rationale: Das Aoristpartizip bezeichnet hier das Ergreifen und Festhalten vor der anschließenden Misshandlung. Eine koordinierte Verbform ist im Deutschen natürlicher und lässt die Ereignisfolge im Kontext klar erkennen.
- source_word: τοὺς δούλους αὐτοῦ
  choice: seine Sklaven
  rationale: δοῦλοι bezeichnet Menschen in einem rechtlich-sozialen Abhängigkeits- und Eigentumsverhältnis. „Sklaven“ bildet diese Bedeutung transparenter ab als das weiter gefasste „Diener“; die im Gleichnis ausgeübte Botenfunktion hebt diesen Status nicht auf.
- source_word: ὕβρισαν
  choice: misshandelten sie
  rationale: ὑβρίζω umfasst schändliche, gewaltsame Behandlung und nicht nur eine verbale Beleidigung. „misshandelten“ gibt die Breite und Härte des Ausdrucks idiomatisch wieder.
- source_word: ἀπέκτειναν
  choice: töteten sie
  rationale: Eine direkte Wiedergabe von ἀποκτείνω, ohne die zusätzliche juristische Wertung von „ermordeten“ einzutragen.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gleichnis
  choice: Sklaven
  alternative: Diener
  rationale: „Sklaven“ bewahrt die soziale Realität des griechischen Ausdrucks, während „Diener“ die Rolle als königliche Beauftragte stärker hervorheben, den abhängigen Status jedoch abschwächen würde. Die Alternative wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „packten“ ist anschaulich und gegenwärtig, ohne umgangssprachlich zu wirken; die knappe Reihung erhält die Härte und Steigerung des griechischen Satzes.
