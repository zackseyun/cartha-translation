  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: de
  text: „Zeigt mir die Münze für die Steuer[a].“ Da brachten sie ihm einen Denar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kopfsteuer“ oder „die Zensussteuer“; κῆνσος bezeichnet hier eine römische Reichssteuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Zeigt mir
  rationale: Der Aorist Aktiv Imperativ in der zweiten Person Plural fordert dazu auf, den Gegenstand sichtbar vorzuzeigen. „Zeigt mir“ gibt dies natürlich und unmittelbar wieder.
- source_word: νόμισμα
  choice: die Münze
  rationale: νόμισμα bezeichnet hier eine im Umlauf befindliche Münze; der folgende Satz bestimmt sie näher als Denar.
- source_word: τοῦ κήνσου
  choice: für die Steuer
  rationale: Der Genitiv bezeichnet die zur Entrichtung der römischen Steuer verwendete Münze. „Für die Steuer“ ist verständlich und vermeidet eine im Haupttext unnötige Festlegung auf eine spezifischere Steuerbezeichnung.
- source_word: προσήνεγκαν
  choice: brachten
  rationale: Die Aoristform von προσφέρω bezeichnet in diesem Erzählzusammenhang das Herbeibringen beziehungsweise Vorlegen der Münze; „brachten“ ist idiomatisch.
- source_word: δηνάριον
  choice: einen Denar
  rationale: Die historische Münzbezeichnung wird als „Denar“ beibehalten; der deutsche Akkusativ entspricht der Funktion als direktes Objekt.
theological_decisions: []
