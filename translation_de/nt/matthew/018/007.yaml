revisions:
- from: Wehe der Welt wegen der Verführungen zum Bösen[a]! Denn es ist notwendig, dass solche Verführungen kommen. Doch wehe dem Menschen[b], durch den die Verführung kommt!
  to: Wehe der Welt wegen der Anstöße[a]! Denn es ist notwendig, dass die Anstöße kommen; doch wehe dem Menschen[b], durch den der Anstoß kommt!
  rationale: Die Revision ersetzt die einengende Deutung „Verführungen zum Bösen“ durch „Anstöße“. Dadurch bleibt die metaphorische und semantische Spannweite von σκάνδαλον gewahrt, einschließlich eines möglichen Anlasses zum Straucheln, ohne sie auf sexuelle oder moralische Verführung zu beschränken. Die Wiederholung sowie Plural und Singular des griechischen Textes bleiben sichtbar. Die Notwendigkeit wird weiterhin nicht näher begründet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:45:53Z'
