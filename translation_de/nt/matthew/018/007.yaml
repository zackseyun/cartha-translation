id: MAT.18.7
reference: Matthew 18:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: de
  text: Wehe der Welt wegen der Anstöße[a]! Denn es ist notwendig, dass die Anstöße kommen; doch wehe dem Menschen[b], durch den der Anstoß kommt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Stolpersteine“, „Fallstricke“ oder „Anlässe zur Sünde“ bezeichnen. Gemeint ist etwas, das einen Menschen zu Fall oder zur Sünde bringt, sei es durch Verlockung, Kränkung oder einen anderen Anlass.
    reason: lexical_alternative
  - marker: b
    text: „Der Mensch“ bezeichnet hier jeden einzelnen Menschen, durch den ein solcher Anstoß kommt.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Wehe
  rationale: Bewahrt den prophetischen und gerichtlichen Ton des griechischen Weherufs und erhält die rhetorische Wiederholung in beiden Satzteilen.
- source_word: κόσμῳ
  choice: der Welt
  rationale: Gibt den umfassenden Bezug auf die menschliche Welt natürlich wieder, ohne ihn auf die physische Schöpfung oder ein bestimmtes Weltsystem einzuengen.
- source_word: ἀπὸ
  choice: wegen
  rationale: Drückt hier knapp und idiomatisch die Ursache des Weherufs aus.
- source_word: σκάνδαλα / σκάνδαλον
  choice: Verführungen zum Bösen / Verführung
  rationale: Bezeichnet das, was einen Menschen zu Fall beziehungsweise zur Sünde bringt. Die Formulierung ist im heutigen Deutsch verständlicher als „Ärgernisse“ und wahrt durch die Fußnote die größere Bedeutungsbreite des griechischen Bildes. Plural und Singular bleiben unterschieden.
- source_word: ἀνάγκη
  choice: es ist notwendig
  rationale: Erhält die Aussage der Notwendigkeit, ohne deren Grund als göttlichen Ratschluss, logische Notwendigkeit oder bloß praktische Unvermeidlichkeit festzulegen.
- source_word: γάρ
  choice: denn
  rationale: Kennzeichnet den folgenden Satz als Begründung beziehungsweise Erläuterung des vorausgehenden Weherufs.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: kommen ... kommt
  rationale: Bewahrt die Wiederholung und das konkrete Bewegungsbild des griechischen Verbs.
- source_word: πλήν
  choice: doch
  rationale: Markiert deutlich den Gegensatz zwischen der allgemeinen Notwendigkeit und der persönlichen Verantwortung.
- source_word: ἀνθρώπῳ
  choice: dem Menschen
  rationale: „Mensch“ entspricht ἄνθρωπος natürlich und bezeichnet hier einen einzelnen Menschen mit allgemeiner, stellvertretender Reichweite.
- source_word: δι’ οὗ
  choice: durch den
  rationale: Gibt die betreffende Person als Vermittler beziehungsweise Handelnden wieder, durch den die Verführung eintritt.
theological_decisions:
- issue: Art der Notwendigkeit in ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: Die Notwendigkeit wird ausdrücklich benannt, ihr Grund aber offengelassen.
  alternative: „Verführungen werden unweigerlich kommen“ würde eher praktische Unvermeidlichkeit betonen; „Verführungen müssen nach Gottes Ratschluss kommen“ würde göttliche Verursachung festlegen.
  rationale: Der griechische Text nennt eine Notwendigkeit, erklärt jedoch nicht, worauf sie beruht. Die Übersetzung wahrt diese theologische Spannung.
- issue: Allgemeine Reichweite von ἀνθρώπῳ
  choice: „dem Menschen“ im Haupttext, mit Erläuterung in der Fußnote
  alternative: „der Person“ oder „jedem, durch den“
  rationale: Der Singular und der Bezug auf einen einzelnen Verantwortlichen bleiben erhalten; zugleich stellt die Fußnote klar, dass die Warnung jedem Menschen gilt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verführungen zum Bösen“ vermeidet das heute leicht missverständliche traditionelle „Ärgernisse“; die Fußnote bewahrt zugleich die Bild- und Bedeutungsbreite von σκάνδαλον. Die Satzgliederung erhält die beiden Weherufe und den scharfen Gegensatz des Originals.
