id: MAT.18.25
reference: Matthew 18:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: de
  text: Da er aber nicht zurückzahlen konnte, befahl sein Herr[a], dass er zusammen mit seiner Frau und seinen Kindern sowie allem, was er besaß[b], verkauft und die Schuld beglichen werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Gebieter“. Das griechische κύριος kann je nach Zusammenhang „Herr“ oder „Gebieter“ bedeuten; hier ist der menschliche Herr des Dieners im Gleichnis gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Der Schuldner und seine Familie sollten verkauft und sein Besitz verwertet werden, um die Schuld zu begleichen.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Da er aber nicht zurückzahlen konnte
  rationale: Der Genitivus absolutus bezeichnet den Umstand beziehungsweise Grund. Wörtlich fehlt ihm die Möglichkeit oder die Mittel zur Rückzahlung; die deutsche Formulierung gibt dies natürlich wieder, ohne festzulegen, ob ausschließlich völlige Mittellosigkeit gemeint ist.
- source_word: ἐκέλευσεν
  choice: befahl
  rationale: κελεύω bezeichnet eine verbindliche Anordnung durch einen Höhergestellten; „befahl“ ist präzise und im Deutschen idiomatisch.
- source_word: ὁ κύριος
  choice: sein Herr
  rationale: κύριος bezeichnet hier innerhalb des Gleichnisses den menschlichen Herrn des Dieners. Das kontextuell ergänzte Possessivpronomen macht die Beziehung im Deutschen deutlich, ohne den Ausdruck unmittelbar als Gottestitel zu deuten.
- source_word: πραθῆναι
  choice: zu verkaufen
  rationale: Der passive Infinitiv von πιπράσκω verlangt hier, dass der Schuldner verkauft werden soll; die deutsche Infinitivkonstruktion nach „befahl“ bewahrt diesen Sinn.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: seine Frau und seine Kinder
  rationale: Die bestimmten Artikel verweisen im Kontext auf die Familie des Schuldners. Possessivpronomen sind im modernen Deutsch die natürliche Wiedergabe.
- source_word: πάντα ὅσα ἔχει
  choice: alles, was er besaß
  rationale: Die Wendung umfasst seinen gesamten Besitz. Das Präteritum fügt sich natürlich in die deutsche Erzählperspektive ein.
- source_word: καὶ ἀποδοθῆναι
  choice: und damit die Schuld zu begleichen
  rationale: Der passive Infinitiv von ἀποδίδωμι nimmt die geforderte Rückzahlung wieder auf. „Damit“ verdeutlicht knapp den im Satz angelegten Zweck des Verkaufs; „die Schuld“ ist aus dem unmittelbaren Kontext erschlossen.
theological_decisions:
- issue: Wiedergabe von κύριος im sozialen Rahmen des Gleichnisses
  choice: sein Herr
  alternative: sein Gebieter; der Herr
  rationale: Hier bezeichnet κύριος den menschlichen Herrn des Dieners innerhalb der Erzählung. „Herr“ erhält die traditionelle soziale Beziehungsbezeichnung und lässt zugleich die weitergehende Bildfunktion des Gleichnisses bestehen; die Kleinschreibung ist im Deutschen bei „Herr“ nicht verfügbar, weshalb der Kontext die Bedeutung klärt.
- issue: Art und Umfang der Zahlungsunfähigkeit
  choice: nicht zurückzahlen konnte
  alternative: nichts hatte, um zurückzuzahlen
  rationale: Die griechische Konstruktion sagt, dass ihm das zum Zurückzahlen Erforderliche fehlte, ohne die genaue wirtschaftliche Lage weiter auszumalen. Die gewählte Formulierung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Ablauf, wird aber durch „sowie“ und „damit“ für heutige Leser klar und flüssig gestaltet. „Herr“ wahrt die Bildsprache des Gleichnisses, während die Fußnote den sozialen Sinn erläutert.
