  source_fidelity: Der deutsche Text gibt die griechische Warnung Ὁρᾶτε μὴ καταφρονήσητε treffend als „Seht zu, dass ihr keinen … verachtet“ wieder. „Keinen von diesen Kleinen“ bewahrt die partitive Aussage, ohne den Bezug auf Kinder zu verengen. „Ihre Engel“, „stets“ und „das Angesicht meines Vaters“ entsprechen dem Wortlaut und bewahren die im Ausgangstext angelegte Aussage über die Engel ohne zusätzliche dogmatische Festlegung. Die idiomatische Wiedergabe des griechischen Plurals οὐρανοῖς mit „im Himmel“ ist angemessen.
  naturalness: Modernes, gut verständliches Standarddeutsch mit einem dem Kontext angemessen würdevollen Register. „Seht zu“ ist als eindringliche Warnung natürlich; „Angesicht“ erhält die bildhafte, gehobene Sprache, ohne unverständlich zu wirken. Der Satzbau ist klar.
  terminology: „Diese Kleinen“, „ihre Engel“, „Angesicht“ und „mein Vater“ sind terminologisch stimmig. Die Fußnoten erläutern die lexikalische Alternative und die begrenzte Aussagekraft von „ihre Engel“ sachgerecht und nicht konfessionell. Die Marker stehen jeweils an der passenden Textstelle.
