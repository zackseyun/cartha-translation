id: MAT.18.10
reference: Matthew 18:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: de
  text: 'Seht zu, dass ihr keinen von diesen Kleinen verachtet.[a] Denn ich sage euch: Ihre Engel[b] im Himmel sehen stets das Angesicht meines Vaters, der im Himmel ist.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ihr auf keinen von diesen Kleinen herabseht“.'
    reason: lexical_alternative
  - marker: b
    text: „Ihre Engel“ kann Engel bezeichnen, die diesen Kleinen zugeordnet sind oder sie vertreten. Der Vers allein legt keine umfassende Lehre von persönlichen Schutzengeln fest.
    reason: alternative_reading
  - marker: c
    text: Wörtlich steht an beiden Stellen „in den Himmeln“; im Deutschen idiomatisch mit „im Himmel“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Seht zu
  rationale: Der Präsensimperativ leitet eine eindringliche Warnung ein. „Seht zu“ ist im modernen Deutschen verständlich und bewahrt den Gedanken wachsamer Aufmerksamkeit.
- source_word: μὴ καταφρονήσητε
  choice: dass ihr keinen … verachtet
  rationale: μή mit dem Aoristkonjunktiv nach Ὁρᾶτε drückt ein Verbot aus. „Verachten“ gibt die Geringschätzung prägnant und gewichtig wieder.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: keinen von diesen Kleinen
  rationale: Die Teilmenge „einen von“ wird in der deutschen Verneinung natürlich mit „keinen von“ ausgedrückt. „Diese Kleinen“ lässt offen, ob Alter, geringe Stellung oder demütige Zugehörigkeit im Vordergrund steht.
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: Die geläufige Redeeinleitung wird formal nah wiedergegeben; „denn“ bewahrt die begründende Funktion von γάρ.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: ihre Engel
  rationale: Die possessive Beziehung wird direkt wiedergegeben, ohne daraus eine ausgearbeitete Lehre von persönlichen Schutzengeln abzuleiten.
- source_word: ἐν οὐρανοῖς
  choice: im Himmel
  rationale: Der griechische Plural wird entsprechend dem üblichen deutschen biblischen Sprachgebrauch idiomatisch im Singular wiedergegeben.
- source_word: διὰ παντὸς
  choice: stets
  rationale: Das Adverb gibt die Bedeutung „fortwährend/zu jeder Zeit“ knapp und natürlich wieder.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: sehen … das Angesicht
  rationale: „Das Angesicht sehen“ erhält das Bild unmittelbaren Zugangs und der Gegenwart vor Gott; „Angesicht“ ist hier würdevoll, aber weiterhin allgemein verständlich.
- source_word: τοῦ πατρός μου
  choice: meines Vaters
  rationale: Die ausdrückliche Ich-Beziehung Jesu zum Vater bleibt unverändert erhalten.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: der im Himmel ist
  rationale: Die attributive Wendung wird unmittelbar auf „meines Vaters“ bezogen und idiomatisch deutsch formuliert.
theological_decisions:
- issue: Bedeutung von „ihre Engel“
  choice: Die Formulierung „ihre Engel“ bleibt ohne nähere dogmatische Festlegung stehen.
  alternative: Deutung als persönliche Schutzengel jedes einzelnen Kleinen oder allgemeiner als Engel, die diesen Kleinen zugeordnet sind beziehungsweise sie vertreten.
  rationale: Der griechische Text nennt „ihre Engel“, erläutert aber nicht die genaue Art dieser Zuordnung. Die Übersetzung bewahrt diese Offenheit.
- issue: Referenz von „diesen Kleinen“
  choice: „Diese Kleinen“ wird nicht auf kleine Kinder allein eingeengt.
  alternative: Ausdrückliche Wiedergabe als „diese kleinen Kinder“ oder ausschließlich als demütige Gläubige.
  rationale: Der Zusammenhang von Matthäus 18 verbindet ein Kind mit Niedrigkeit und Zugehörigkeit zu Jesus. Die offene Formulierung bewahrt den möglichen weiteren Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht zu“ bewahrt den mahnenden Ton, „Angesicht“ die biblische Bildsprache unmittelbarer Gegenwart; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich.
