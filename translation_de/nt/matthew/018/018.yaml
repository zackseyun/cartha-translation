review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die Anredeformel, den umfassenden Konditionalausdruck („was immer“), die Metaphern „binden/lösen“ sowie den Kontrast zwischen Erde und Himmel zuverlässig wieder. Das Futur II („wird ... gebunden/gelöst worden sein“) ist eine vertretbare, aspektbewusste Wiedergabe von ἔσται + Perfektpassivpartizip und behauptet nicht über den griechischen Befund hinaus eine bestimmte institutionelle oder kausale Deutung.
  naturalness: „Amen, ich sage euch“ ist im feierlich-biblischen Register des modernen Standarddeutschen geläufig. Das Futur II ist stilistisch markiert und etwas schwerfällig, aber hier als bewusste, nachvollziehbare Abbildung der auffälligen griechischen Form akzeptabel. Satzbau und Zeichensetzung sind klar.
  terminology: „Binden“ und „lösen“ bewahren das traditionelle Metaphernpaar und dessen offene konkrete wie autoritative Bedeutung. „Erde“ und „Himmel“ entsprechen dem griechischen Singulargebrauch idiomatisch. Die Fußnote stellt die traditionelle Alternative als Alternative dar, ohne eine konfessionelle Deutung festzuschreiben.
