id: MAT.18.18
reference: Matthew 18:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: de
  text: 'Amen, ich sage euch: Was immer ihr auf der Erde bindet, wird im Himmel gebunden worden sein, und was immer ihr auf der Erde löst, wird im Himmel gelöst worden sein.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „wird im Himmel gebunden sein … wird im Himmel gelöst sein“ oder „wird im Himmel gebunden werden … wird im Himmel gelöst werden“. Die griechische Form verbindet ein Zukunftsverb mit einem Perfektpartizip und kann einen im Himmel bereits herbeigeführten Zustand bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das vorangestellte „Amen“ bewahrt die feierliche, autoritative Bekräftigungsformel Jesu und ist im Deutschen als biblischer Ausdruck verständlich.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Entspricht der griechischen Redeformel unmittelbar und klingt in gehobenem, modernem Standarddeutsch natürlich.
- source_word: ὅσα ἐὰν
  choice: was immer
  rationale: Gibt den unbestimmten, umfassenden Relativausdruck idiomatisch wieder.
- source_word: δήσητε
  choice: bindet
  rationale: Bewahrt die Metapher und ihren möglichen rechtlich-autoritativen Bedeutungsumfang, ohne sie auf „verbieten“ festzulegen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Gibt den räumlichen Gegensatz zum Himmel klar und natürlich wieder.
- source_word: ἔσται δεδεμένα
  choice: wird … gebunden worden sein
  rationale: Das Futur von εἰμί mit Perfektpartizip wird als Futur II wiedergegeben; so bleibt der mögliche Sinn eines bereits herbeigeführten, fortbestehenden Zustands erhalten.
- source_word: ἐν οὐρανῷ
  choice: im Himmel
  rationale: Natürliche deutsche Wiedergabe des Singulars für die göttliche Sphäre.
- source_word: λύσητε
  choice: löst
  rationale: Bewahrt die Gegenüberstellung zu „bindet“ und lässt sowohl die konkrete Metapher als auch den autoritativen Sinn offen.
- source_word: ἔσται λελυμένα
  choice: wird … gelöst worden sein
  rationale: Spiegelt parallel zur ersten Aussage die Konstruktion aus Futur und Perfektpartizip als Futur II.
theological_decisions:
- issue: Zeitliche und theologische Aussage der Formel vom Binden und Lösen
  choice: „wird … gebunden/gelöst worden sein“
  alternative: „wird … gebunden/gelöst sein“ oder traditionell „wird … gebunden/gelöst werden“
  rationale: Die griechische Konstruktion ἔσται mit Perfektpartizip kann einen zukünftigen Zustand ausdrücken, der aus einer vorausliegenden Handlung hervorgegangen ist. Das Futur II bewahrt diese Spannung und legt nicht fest, ob beziehungsweise auf welche Weise himmlische und irdische Entscheidung zeitlich oder ursächlich zueinander stehen.
translation_notes:
  register: Feierlich und würdig, zugleich in modernem Standarddeutsch. „Amen“ und das Metaphernpaar „binden/lösen“ wurden wegen ihrer sprachlichen und theologischen Offenheit beibehalten; das deutsche Futur II klingt markiert, bildet hier aber die auffällige griechische Konstruktion präzise ab.
