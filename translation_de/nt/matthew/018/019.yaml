source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: de
  text: 'Wahrlich, ich sage euch noch einmal: Wenn zwei von euch[a] auf der Erde in irgendeiner Sache übereinstimmen, um die sie bitten[c], wird es ihnen von meinem Vater im Himmel[b] zuteilwerden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn zwei aus eurer Mitte übereinstimmen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in den Himmeln“; im Deutschen idiomatisch mit „im Himmel“ wiedergegeben.'
    reason: lexical_alternative
  - marker: c
    text: Im Zusammenhang folgt diese Zusage auf Jesu Lehre über das Handeln und die Vollmacht der Gemeinschaft (18,15–18); der Wortlaut selbst spricht jedoch allgemein von Bitten, über die Einvernehmen besteht.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: Weiter
  rationale: Kennzeichnet einen weiteren, eng mit dem Vorhergehenden verbundenen Ausspruch Jesu; „Weiter“ bildet den Fortgang im Deutschen natürlicher ab als ein isoliertes „Wieder“.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 'sage ich euch: Wahrlich'
  rationale: Bewahrt den feierlichen und bekräftigenden Charakter der festen Redeeinleitung, ohne das semitische „Amen“ unnötig zu transliterieren.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: wenn zwei von euch übereinstimmen
  rationale: συμφωνέω bezeichnet hier gemeinsames Einvernehmen; ἐξ ὑμῶν wird idiomatisch und genau mit „von euch“ wiedergegeben.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Bewahrt den räumlichen Gegensatz zum Vater im Himmel in natürlichem modernem Deutsch.
- source_word: περὶ παντὸς πράγματος
  choice: in irgendeiner Sache
  rationale: πρᾶγμα ist weit gefasst und kann eine Sache, Angelegenheit oder ein Anliegen bezeichnen; die Formulierung erhält diese Breite.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: um die sie bitten
  rationale: Gibt die unbestimmte Relativkonstruktion flüssig wieder und lässt den Gebets- beziehungsweise Bittecharakter von αἰτέω erkennen, ohne ihn ausdrücklich zu ergänzen.
- source_word: γενήσεται αὐτοῖς
  choice: wird es ihnen gewährt werden
  rationale: Eine rein wörtliche Wiedergabe mit „geschehen“ wäre zusammen mit der Herkunftsangabe im Deutschen schwer verständlich; „gewährt werden“ drückt das Eintreten des Erbetenen aus.
- source_word: παρὰ τοῦ πατρός μου
  choice: von meinem Vater
  rationale: παρά mit Genitiv kann Herkunft beziehungsweise Wirkursache bezeichnen; „von“ bewahrt beide Nuancen besser als eine ausschließlich instrumentale Formulierung.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: im Himmel
  rationale: Der griechische Plural wird entsprechend dem üblichen deutschen Sprachgebrauch idiomatisch im Singular wiedergegeben.
theological_decisions:
- issue: Reichweite der Zusage im Zusammenhang
  choice: Die Aussage wird ohne zusätzliche Einschränkung auf Gemeindezucht oder ausdrückliche Ausweitung zu einer schrankenlosen Gebetszusage wiedergegeben.
  alternative: Die Bitte ausdrücklich auf Entscheidungen der Gemeindezucht begrenzen oder als uneingeschränkte Verheißung für jedes beliebige Gebetsanliegen formulieren.
  rationale: Der unmittelbare Zusammenhang betrifft das Handeln der Gemeinschaft und ihre Vollmacht (18,15–18), während der Wortlaut dieses Verses allgemein von gemeinsamem Einvernehmen und Bitten spricht. Die Übersetzung erhält diese Spannung.
- issue: Handeln des Vaters in γενήσεται ... παρὰ τοῦ πατρός
  choice: „wird es ihnen von meinem Vater ... gewährt werden“
  alternative: „wird es ihnen von meinem Vater ... geschehen“ oder „mein Vater wird es für sie tun“
  rationale: Die gewählte passive Form macht das Handeln des Vaters deutlich, ohne die Zusage dogmatisch weiter auszulegen oder die Satzstruktur unnötig umzubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt nahe am griechischen Gedankengang, vermeidet aber unnatürliche Wendungen. „Wahrlich“ erhält den feierlichen Nachdruck der Amen-Formel; „gewährt werden“ macht die Ergebnisaussage mit der anschließenden Herkunftsangabe verständlich.
