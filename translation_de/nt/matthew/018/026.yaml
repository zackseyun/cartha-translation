  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: de
  text: 'Da warf sich der Sklave vor ihm nieder[a] und sagte: »Hab Geduld mit mir, dann werde ich dir alles zurückzahlen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »huldigte ihm«; das griechische Verb kann in anderen Zusammenhängen auch »anbeten« bedeuten. Hier bezeichnet es die ehrerbietige Niederwerfung vor einem menschlichen Herrn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν οὖν
  choice: Da fiel ... nieder
  rationale: Das Aoristpartizip beschreibt die einleitende körperliche Bewegung; οὖν führt die Reaktion als Folge des zuvor Gesagten ein. Die finite deutsche Formulierung ist natürlich und erhält den Erzählfluss.
- source_word: ὁ δοῦλος
  choice: der Sklave
  rationale: δοῦλος bezeichnet hier einen rechtlich und wirtschaftlich gebundenen Menschen. Angesichts der Verfügungsgewalt des Herrn und der Schuldenthematik bewahrt »Sklave« die soziale Härte des Gleichnisses besser als »Diener«.
- source_word: προσεκύνει αὐτῷ
  choice: vor ihm nieder und flehte ihn an
  rationale: προσκυνέω bezeichnet in diesem Kontext die ehrerbietige Niederwerfung vor einem menschlichen Herrn. Das Imperfekt trägt zum andauernden Flehen bei; »anbeten« würde wahrscheinlich eine ausdrücklich religiöse Bedeutung eintragen.
- source_word: λέγων
  choice: '[Einführung der direkten Rede]'
  rationale: Das Partizip leitet die direkte Rede ein. Im Deutschen ist kein zusätzliches »und sagte« nötig, weil »flehte ihn an« die Sprechhandlung bereits natürlich einführt.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Hab Geduld mit mir
  rationale: Der Imperativ bittet um Aufschub und nachsichtige Geduld. Die Formulierung ist modern, verständlich und dem Schuldnerkontext angemessen.
- source_word: καί
  choice: dann
  rationale: 'In diesem Versprechen kann καί im Deutschen natürlich die Folge ausdrücken: Gewährt der Herr Aufschub, verspricht der Sklave die Rückzahlung. »Dann« macht diesen pragmatischen Zusammenhang deutlich, ohne eine zusätzliche Bedingung zu formulieren.'
- source_word: πάντα ἀποδώσω σοι
  choice: werde ich dir alles zurückzahlen
  rationale: ἀποδίδωμι bedeutet im Schuldkontext »zurückzahlen«; πάντα bezeichnet die gesamte Schuld. Die Wortstellung klingt im modernen Deutsch natürlich.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber einem menschlichen Herrn
  choice: Als ehrerbietiges Niederfallen und Flehen wiedergegeben
  alternative: »Er betete ihn an« oder »er warf sich vor ihm nieder«
  rationale: Im Handlungsrahmen des Gleichnisses gilt die Geste einem menschlichen König bzw. Herrn und bezeichnet zunächst Unterwerfung und inständige Bitte. Eine Wiedergabe mit »anbeten« könnte eine religiöse Aussage festlegen, die der Kontext nicht verlangt; die Fußnote bewahrt die lexikalische Spannweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede »Hab« entspricht der persönlichen Singularform des griechischen Imperativs. »Sklave« erhält bewusst die soziale Schärfe von δοῦλος; die Fußnote erklärt die kontextabhängige Bedeutungsbreite von προσκυνέω.
