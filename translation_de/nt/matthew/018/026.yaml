  source_fidelity: 'Die Vorlage gibt zwei körperliche Akte wieder: πεσών („fiel [nieder]“) und προσεκύνει („warf sich ehrerbietig vor ihm nieder“). Der Entwurf gibt den ersten wieder, ersetzt den zweiten jedoch durch „flehte ihn an“. Das Flehen ist aus der Bitte verständlich und im englischen Audit als idiomatische Bündelung vertreten, entspricht aber nicht unmittelbar dem griechischen Verb. Die direkte Rede sollte zudem ausdrücklich durch „sagte“ eingeführt werden.'
  naturalness: Die vorgeschlagene Fassung ist modernes, würdiges Standarddeutsch. Die Doppelung der körperlichen Geste wird idiomatisch vermieden, indem „warf sich ... nieder“ die proskynētische Geste ausdrückt und „fiel“ nicht zusätzlich wörtlich wiederholt wird. Der Aoristpartizip-Sinn bleibt als einleitende Handlung gewahrt.
  terminology: „Sklave“ ist im Schuld- und Herrschaftskontext für δοῦλος sachgerecht. „warf sich vor ihm nieder“ gibt προσκυνέω gegenüber einem menschlichen Herrn ohne religiöse Überbestimmung wieder. „Hab Geduld mit mir“ und „alles zurückzahlen“ sind treffend und gegenwartsnah.
