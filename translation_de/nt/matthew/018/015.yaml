  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: de
  text: Wenn aber dein Bruder[c] gegen dich sündigt[a], geh hin und weise ihn unter vier Augen zurecht[b]. Wenn er auf dich hört, hast du deinen Bruder gewonnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lassen „gegen dich“ aus und lauten entsprechend: „Wenn aber dein Bruder sündigt, geh hin und weise ihn unter vier Augen zurecht.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Halte ihm seine Verfehlung vor“; auch „überführe ihn“.'
    reason: lexical_alternative
  - marker: c
    text: „Bruder“ steht im Griechischen im maskulinen Singular; im Zusammenhang kann das Wort allgemeiner einen anderen Jünger bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: sündigt
  rationale: Der Aorist Konjunktiv nach ἐάν bezeichnet hier einen allgemeinen möglichen Fall. „Sündigt“ gibt die moralisch-religiöse Bedeutung von ἁμαρτάνω präzise und idiomatisch wieder.
- source_word: εἰς σέ
  choice: gegen dich
  rationale: Die Präpositionalfügung bezeichnet hier die Person, gegen die sich die Sünde richtet. Da sie im SBLGNT-Haupttext steht, wird sie aufgenommen; ihre textkritische Unsicherheit wird in Fußnote [a] genannt.
- source_word: ἀδελφός σου
  choice: dein Bruder
  rationale: Dies entspricht der grammatisch maskulinen Singularform. Im Zusammenhang kann damit allgemeiner ein anderer Jünger beziehungsweise Glaubensbruder gemeint sein; diese mögliche Reichweite wird in Fußnote [c] offengehalten.
- source_word: ὕπαγε
  choice: geh hin
  rationale: „Geh hin“ ist eine natürliche deutsche Aufforderung und bewahrt die auf eine direkte persönliche Begegnung zielende Bewegung des Imperativs.
- source_word: ἔλεγξον
  choice: weise ihn zurecht
  rationale: ἐλέγχω meint hier, den Betreffenden mit seinem Fehlverhalten zu konfrontieren und es ihm vorzuhalten. „Zurechtweisen“ ist im heutigen Standarddeutsch verständlich und wahrt den korrigierenden Sinn, ohne unnötig scharf zu klingen.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: unter vier Augen
  rationale: Die geläufige deutsche Wendung gibt knapp und natürlich wieder, dass das Gespräch ausschließlich zwischen den beiden Beteiligten stattfinden soll.
- source_word: ἀκούσῃ
  choice: auf dich hört
  rationale: Die Wendung bezeichnet mehr als bloß akustisches Hören, legt sich aber nicht so stark wie „gehorchen“ auf vollständige Unterordnung fest.
- source_word: ἐκέρδησας
  choice: hast du … gewonnen
  rationale: „Gewonnen“ bewahrt die Metapher von κερδαίνω und fügt nicht die im Verb unausgesprochene Vorstellung eines Zurückgewinnens hinzu.
theological_decisions:
- issue: Textkritischer Status von εἰς σέ
  choice: „gegen dich“ im Haupttext aufnehmen
  alternative: 'Die kürzere Lesart lautet: „Wenn aber dein Bruder sündigt …“'
  rationale: Der vorgegebene SBLGNT-Text enthält εἰς σέ. Weil das Fehlen der Wörter den Anwendungsbereich der Anweisung beeinflussen kann, wird die kürzere Lesart ausdrücklich in einer Fußnote dokumentiert.
- issue: Mögliche inklusive Reichweite von ἀδελφός
  choice: „dein Bruder“
  alternative: „dein Bruder oder deine Schwester“ beziehungsweise „ein anderer Glaubender“
  rationale: Der Haupttext folgt der grammatisch maskulinen Singularform, ohne die im Jüngerkontext mögliche weitere Anwendung auszuschließen. Die Fußnote benennt diese, statt sie interpretierend in den Wortlaut einzubauen.
- issue: Stärke der Aufforderung ἔλεγξον
  choice: „weise ihn zurecht“
  alternative: „halte ihm seine Verfehlung vor“ oder „überführe ihn“
  rationale: Die gewählte Formulierung hält Korrektur und persönliche Konfrontation zusammen, ohne eine besonders harte Rüge oder bereits bewiesene Schuld über den griechischen Wortlaut hinaus festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unter vier Augen“ ist eine allgemein verständliche idiomatische Wiedergabe der ausdrücklich vertraulichen Begegnung; „auf dich hört“ und „gewonnen“ bewahren die Mehrdeutigkeit beziehungsweise Metaphorik des Griechischen.
