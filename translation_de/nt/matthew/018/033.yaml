  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: de
  text: Hättest du nicht auch mit deinem Mitsklaven[a] Erbarmen haben müssen, wie auch ich mit dir Erbarmen hatte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mitdiener“ beziehungsweise „Mitknecht“. Das griechische Wort bezeichnet jemanden, der als Sklave demselben Herrn untersteht.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Hättest ... nicht ... müssen
  rationale: Die rhetorische Frage bringt eine moralische Verpflichtung und zugleich den vorwurfsvollen Ton idiomatisch zum Ausdruck.
- source_word: καὶ σὲ
  choice: auch du
  rationale: Das additive καί wird bewahrt; im Deutschen steht wegen der Konstruktion mit „müssen“ das Subjekt „du“ im Nominativ.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: Erbarmen haben / Erbarmen hatte
  rationale: Die gleiche deutsche Wendung erhält die Wiederholung desselben griechischen Verbs und wahrt dessen ethisch-theologisches Gewicht.
- source_word: τὸν σύνδουλόν σου
  choice: deinem Mitsklaven
  rationale: σύνδουλος bezeichnet einen Sklaven, der demselben Herrn untersteht. „Mitsklave“ erhält sowohl den gebundenen Status als auch die durch σύν- bezeichnete Gemeinsamkeit.
- source_word: ὡς
  choice: so wie
  rationale: Die Wendung kennzeichnet den Vergleich zwischen der erwarteten und der zuvor empfangenen Barmherzigkeit natürlich und deutlich.
- source_word: κἀγὼ σὲ
  choice: auch ich mit dir
  rationale: κἀγώ ist die Verschmelzung von καὶ ἐγώ; „auch ich“ bewahrt den ausdrücklichen Parallelismus.
theological_decisions:
- issue: Wiedergabe des δοῦλος-Wortfeldes in σύνδουλος
  choice: Mitsklave
  alternative: Mitdiener; Mitknecht
  rationale: Im Gleichnis ist das Abhängigkeitsverhältnis unter demselben Herrn wesentlich. „Mitsklave“ gibt diesen rechtlich-sozial gebundenen Status genauer wieder als das mildere „Mitdiener“, ohne die Aussage konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt vorwurfsvoll; die zweimalige Wendung „Erbarmen haben“ bildet die griechische Wortwiederholung sichtbar ab.
