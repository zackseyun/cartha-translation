  rationale: Die allgemeine Bezeichnung wird ohne unnötige Alterspräzisierung wiedergegeben.
- source_word: ἔστησεν
  choice: stellte
  rationale: Das transitive Verb bedeutet hier, dass Jesus das Kind an einen bestimmten Platz treten bzw. stehen ließ; „stellte“ ist im Deutschen die knappe, natürliche Entsprechung.
- source_word: ἐν μέσῳ αὐτῶν
  choice: in ihre Mitte
  rationale: 'Die idiomatische deutsche Wendung bewahrt die räumliche Aussage: Das Kind steht mitten unter ihnen.'
