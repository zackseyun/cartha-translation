id: MAT.18.12
reference: Matthew 18:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: de
  text: Was meint ihr? Wenn ein Mann hundert Schafe hat und sich eines von ihnen verirrt[a], wird er dann nicht die neunundneunzig auf den Bergen[b] zurücklassen, sich auf den Weg machen und das umherirrende Schaf[c] suchen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geht in die Irre“; das griechische Verb kann „sich verirren“, „umherirren“ oder in manchen Zusammenhängen „irregeführt werden“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Bergland“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „das Umherirrende“; traditionell: „das verlorene Schaf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Was meint ihr?
  rationale: Natürliche direkte Frage an mehrere Angesprochene; sie lädt zu ihrem Urteil ein und bewahrt den Plural ὑμῖν.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα
  choice: Wenn ein Mann hundert Schafe hat
  rationale: Die Konstruktion mit γίνομαι und Dativ bezeichnet hier Besitz beziehungsweise eine gegebene Situation. „Ein Mann“ wahrt die maskuline Singularform von ἀνθρώπῳ.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: sich eines von ihnen verirrt
  rationale: Das mediale deutsche „sich verirren“ gibt den passivisch formulierten Vorgang idiomatisch wieder, ohne äußere Verführung oder bewusste Schuld festzulegen.
- source_word: οὐχὶ ἀφήσει
  choice: wird er dann nicht … zurücklassen
  rationale: Die Frage erwartet Zustimmung; das Futur entspricht ἀφήσει. „Zurücklassen“ bezeichnet hier das vorübergehende Verlassen besser als „im Stich lassen“.
- source_word: ἐπὶ τὰ ὄρη
  choice: auf den Bergen
  rationale: Formnahe Wiedergabe des Plurals ὄρη und der konkreten topografischen Angabe; „im Bergland“ ist ebenfalls möglich.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: sich auf den Weg machen und … suchen
  rationale: Das vorangehende Partizip wird als koordinierte Bewegung wiedergegeben; ζητεῖ entspricht unmittelbar „suchen“.
- source_word: τὸ πλανώμενον
  choice: das umherirrende Schaf
  rationale: Der substantivierte Präsenspartizip bezeichnet das Schaf als weiterhin irrend und nimmt den Wortstamm von πλανηθῇ wieder auf. „Das verlorene“ würde eine andere griechische Wortwahl nahelegen.
theological_decisions:
- issue: Generisch gebrauchtes maskulines ἀνθρώπῳ
  choice: ein Mann
  alternative: jemand
  rationale: Die Übersetzung wahrt die grammatisch maskuline Singularform und ihren beispielhaften, allgemein anwendbaren Charakter.
- issue: Bedeutung von πλανάω im Bild vom Schaf
  choice: sich verirren / das umherirrende Schaf
  alternative: fortlaufen / irregeführt werden / das verlorene Schaf
  rationale: Die gewählte Fassung erhält sowohl das Bild des Umherirrens als auch seinen möglichen übertragenen Nachklang, ohne eine Ursache, Schuldfrage oder endgültige Verlorenheit festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem Erzählton. „Was meint ihr?“ spricht die Hörer natürlich im Plural an. Die Wiederholung des griechischen πλανάω-Wortstamms wird durch „verirrt“ und „umherirrende“ soweit idiomatisch möglich sichtbar gehalten.
