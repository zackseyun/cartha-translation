revisions:
- from: Als er nun anfing, die Abrechnungen vorzunehmen, wurde ihm ein Schuldner vorgeführt, der ihm zehntausend Talente[a] schuldete.
  to: Als er nun begann, die Konten abzurechnen, wurde ein Schuldner vor ihn gebracht, der ihm zehntausend Talente[a] schuldete.
  rationale: Die Revision präzisiert den buchhalterisch-rechtlichen Sinn von συναίρειν und vermeidet bei προσηνέχθη eine im Deutschen unnötig kriminalisierende Nuance. Aussagegehalt, Erzählregister und Fußnotenanker bleiben erhalten.
