  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: de
  text: Als er nun begann, die Konten abzurechnen, wurde ein Schuldner vor ihn gebracht, der ihm zehntausend Talente[a] schuldete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine sehr große Gewichts- und Geldeinheit; „zehntausend Talente“ bezeichnet im Rahmen des Gleichnisses eine unvorstellbar hohe Schuld.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Als er nun anfing
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Begleitumstand; „als er ... anfing“ gibt ihn natürlich wieder. δέ wird im fortlaufenden Erzählzusammenhang mit „nun“ leicht markiert.
- source_word: συναίρειν
  choice: die Abrechnungen vorzunehmen
  rationale: Im finanziellen Kontext bezeichnet das Verb das Ordnen beziehungsweise Abrechnen von Forderungen. Die Formulierung ist im modernen Deutschen verständlich und bewahrt das Bild einer förmlichen Rechnungslegung.
- source_word: προσηνέχθη αὐτῷ
  choice: wurde ihm ... vorgeführt
  rationale: Der Aorist Passiv zeigt, dass andere den Schuldner zum König brachten. „Vorführen“ passt bei einer Person besser als das wörtlichere „bringen“ und bewahrt den Gedanken, dass er vor den König gestellt wurde.
- source_word: εἷς ὀφειλέτης
  choice: ein Schuldner
  rationale: εἷς führt hier einen einzelnen Fall aus einer größeren Gruppe ein. Im Deutschen gibt der unbestimmte Artikel diese Funktion natürlicher wieder als das betonte „ein einziger Schuldner“.
- source_word: μυρίων ταλάντων
  choice: zehntausend Talente
  rationale: μύριοι bezeichnet wörtlich zehntausend und vermittelt zugleich eine ungeheuer große Summe. Die historische Einheit wird nicht spekulativ in eine moderne Währung umgerechnet.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Erzählgang, ohne unnatürlich wörtlich zu klingen; die historische Währungseinheit wird mit einer erklärenden Fußnote beibehalten.
