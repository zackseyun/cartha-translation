review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Genitivus absolutus, den passiven Vorgang des Herbeibringens, den einzelnen Schuldner und die Summe von zehntausend Talenten sachgerecht wieder. „Die Abrechnungen vorzunehmen“ trifft συναίρειν jedoch weniger genau: Es kann das Erstellen von Abrechnungen nahelegen, während hier das Abrechnen bzw. Begleichen von Konten gemeint ist. Die Ergänzung „der ihm ... schuldete“ macht die im griechischen Ausdruck ὀφειλέτης enthaltene Schuldbeziehung idiomatisch explizit, ohne zusätzlichen Sinn einzutragen.'
  naturalness: „Die Konten abzurechnen“ ist im modernen Standarddeutsch für den finanziellen Kontext klarer und idiomatischer als „die Abrechnungen vorzunehmen“. „Vor ihn gebracht“ ist neutraler als „vorgeführt“, das im heutigen Deutsch leicht eine polizeiliche oder demütigende Konnotation haben kann, die das griechische προσηνέχθη nicht selbst ausdrückt.
  terminology: „Schuldner“ und „Talente“ sind passend. Die Fußnote erklärt die historische Einheit zurückhaltend und wahrt die parabolische Übertreibung, ohne eine unsichere moderne Umrechnung vorzunehmen.
  issues:
  - severity: low
    issue: „die Abrechnungen vorzunehmen“
    rationale: Die Formulierung ist verständlich, klingt aber bürokratisch und kann das Anfertigen statt das Abrechnen von Konten bezeichnen.
  - severity: low
    issue: „vorgeführt“
    rationale: Das Wort ist möglich, hat im modernen Deutsch jedoch eine unnötig stark forensische Konnotation. „Vor ihn gebracht“ gibt das passive προσηνέχθη neutral wieder.
  revised_text: Als er nun begann, die Konten abzurechnen, wurde ein Schuldner vor ihn gebracht, der ihm zehntausend Talente[a] schuldete.
  revised_footnotes:
