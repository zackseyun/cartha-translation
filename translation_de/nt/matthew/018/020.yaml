  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: de
  text: Denn wo zwei oder drei in meinem Namen versammelt sind, da bin ich mitten unter ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: wo
  rationale: Leitet einen lokalen Nebensatz ein. „Wo“ ist im Deutschen natürlich und vermeidet die gegenüber dem Griechischen leicht ausweitende Bedeutung von „wo immer“.
- source_word: γάρ
  choice: denn
  rationale: Bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorausgehenden Zusammenhang.
- source_word: δύο ἢ τρεῖς
  choice: zwei oder drei
  rationale: Die schlichte Zahlenangabe wird unmittelbar wiedergegeben.
- source_word: συνηγμένοι
  choice: versammelt sind
  rationale: 'Gibt das resultative Moment des Perfektpartizips natürlich wieder: Die Betreffenden sind zusammengekommen und befinden sich als Versammelte beieinander. Das Passiv bleibt im Deutschen hinsichtlich des Handelnden ebenso offen wie im Griechischen.'
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: in meinem Namen
  rationale: Die im Deutschen geläufige Wendung bewahrt den Bezug auf Jesu Namen, ohne eine einzelne Bedeutungsnuance wie Autorität, Zugehörigkeit oder Anlass exklusiv festzulegen.
- source_word: ἐκεῖ
  choice: da
  rationale: Korrespondiert idiomatisch mit „wo“ und erhält die griechische Struktur „wo … da“.
- source_word: εἰμι
  choice: bin ich
  rationale: Gibt das einfache Präsens direkt wieder; ein ergänztes „gegenwärtig“ wäre erklärender als der Ausgangstext.
- source_word: ἐν μέσῳ αὐτῶν
  choice: mitten unter ihnen
  rationale: Bewahrt das räumliche Bild von ἐν μέσῳ und klingt im modernen Standarddeutsch natürlicher als „in ihrer Mitte“, ohne den Sinn auf bloße räumliche Nähe zu reduzieren.
theological_decisions:
- issue: Christologische Aussage über Jesu Gegenwart bei den in seinem Namen Versammelten
  choice: Die Aussage wird unmittelbar als „da bin ich mitten unter ihnen“ wiedergegeben.
  alternative: „Da bin ich bei ihnen“ oder das deutendere „da bin ich gegenwärtig unter ihnen“.
  rationale: Der Vers behauptet Jesu Gegenwart, bestimmt aber nicht deren metaphysische oder sakramentale Weise. Die Übersetzung erhält diese Aussage, ohne eine bestimmte konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung „Denn wo …, da …“ bewahrt den pointierten Aufbau des griechischen Satzes und ist zugleich allgemein verständlich.
