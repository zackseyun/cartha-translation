source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: de
  text: So wird auch mein himmlischer Vater mit euch verfahren, wenn nicht jeder seinem Bruder von Herzen vergibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische hat wörtlich: »aus euren Herzen« (Plural). »Bruder« ist grammatisch männlich Singular und kann hier repräsentativ einen Mitjünger beziehungsweise ein Glaubensgeschwister bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: So wird auch
  rationale: Leitet die Anwendung des vorangehenden Gleichnisses ein und bewahrt dessen vergleichende und folgernde Kraft in natürlichem Deutsch.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: mein himmlischer Vater
  rationale: Entspricht der adjektivischen griechischen Formulierung und ist im Deutschen idiomatisch und würdevoll.
- source_word: ποιήσει ὑμῖν
  choice: wird ... mit euch verfahren
  rationale: Verweist auf das Handeln des Herrn im Gleichnis zurück. Die deutsche Wendung ist natürlicher als das wörtliche „wird euch tun“, ohne die Art des Gerichts über den Kontext hinaus festzulegen.
- source_word: ἐὰν μὴ
  choice: wenn nicht
  rationale: Bewahrt die ausdrücklich negative Bedingung des griechischen Textes; „falls nicht“ oder „wenn ... nicht“ sind ebenfalls möglich.
- source_word: ἀφῆτε
  choice: vergibt
  rationale: ἀφίημι bezeichnet hier angesichts persönlicher Verfehlung und der Schuldenmetaphorik eindeutig das Vergeben.
- source_word: ἕκαστος
  choice: jeder
  rationale: Gibt die distributive Einzahl wieder und bezieht die Verpflichtung auf jede einzelne angesprochene Person.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: seinem Bruder
  rationale: Bewahrt die maskuline Singularform des griechischen Textes; im Zusammenhang steht „Bruder“ repräsentativ für ein Mitglied der Glaubensgemeinschaft.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: von Herzen
  rationale: Ist die natürliche deutsche Entsprechung für aufrichtige, innere Vergebung. Der griechische Plural „aus euren Herzen“ wird in der Fußnote als formnähere Alternative dokumentiert.
theological_decisions:
- issue: Reichweite und Schärfe der Warnung
  choice: Die Aussage bleibt eine direkte Warnung vor einem dem Gleichnis entsprechenden Handeln Gottes.
  alternative: Eine Abschwächung wie „wird euch ähnlich behandeln“ oder eine dogmatische Ausdeutung als ewige Verdammnis beziehungsweise Verlust von Lohn.
  rationale: Der Vers äußert eine ernste bedingte Warnung, bestimmt aber die systematisch-theologische Kategorie des Gerichts nicht ausdrücklich.
- issue: Repräsentative Bedeutung von ἀδελφῷ
  choice: seinem Bruder
  alternative: seinem Bruder oder seiner Schwester; einem anderen Gläubigen
  rationale: Die Übersetzung wahrt die grammatisch maskuline Einzahl, ohne auszuschließen, dass der Ausdruck im Kontext repräsentativ für Mitjünger beziehungsweise Glaubensgeschwister gebraucht wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Mit euch verfahren“ vermeidet eine unnatürliche Wort-für-Wort-Wiedergabe und hält den Rückbezug auf das Gerichtshandeln im Gleichnis offen. Das idiomatische „von Herzen“ gibt den Sinn des griechischen Plurals natürlich wieder; die formnähere Gestalt wird in der Fußnote bewahrt.
