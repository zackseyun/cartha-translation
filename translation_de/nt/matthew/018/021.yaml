  source_fidelity: 'Die zentralen Bedeutungen sind zutreffend wiedergegeben: Petrus tritt zu Jesus, redet ihn als »Herr« an, fragt nach der Zahl der gegen ihn begangenen Sünden und nach seinem Vergeben bis zu einer Grenze von siebenmal. Die beiden griechischen Futurformen sollen erhalten bleiben.'
