  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: de
  text: 'Da trat Petrus an ihn heran und sagte: »Herr, wie oft wird mein Bruder[a] gegen mich sündigen, und werde ich ihm vergeben? Bis zu siebenmal?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im weiteren Sinn: »mein Bruder oder meine Schwester«; im Griechischen steht »mein Bruder« im maskulinen Singular, kann sich hier aber allgemein auf einen Mitjünger beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Kennzeichnet in natürlichem deutschem Erzählstil die zeitliche und sachliche Folge.
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: trat Petrus zu ihm und sagte
  rationale: Gibt das Herantreten vor dem Sprechen sowie das neutrale griechische Redeverb wieder.
- source_word: Κύριε
  choice: Herr
  rationale: Bewahrt die respektvolle Anrede und ihre mögliche theologische Bedeutung.
- source_word: ποσάκις
  choice: wie oft
  rationale: Ist die natürliche deutsche Frage nach der Häufigkeit und führt passend zur genannten Zahl hin.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: wird ... gegen mich sündigen
  rationale: Bewahrt den griechischen Futur und die gegen Petrus gerichtete Verfehlung.
- source_word: ὁ ἀδελφός μου
  choice: mein Bruder
  rationale: Entspricht dem maskulinen Singular des griechischen Wortlauts; eine kontextuell weitere Bedeutung wird in der Fußnote erläutert.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: und ich werde ihm vergeben
  rationale: Bewahrt sowohl die koordinierte Satzstruktur als auch den Futur; ἀφίημι bezeichnet hier das Vergeben einer Verfehlung.
- source_word: ἕως ἑπτάκις
  choice: Bis zu siebenmal?
  rationale: Gibt die von Petrus vorgeschlagene Obergrenze knapp und idiomatisch wieder.
theological_decisions:
- issue: Bezugsweite von ἀδελφός
  choice: Im Haupttext »mein Bruder«
  alternative: »mein Bruder oder meine Schwester« beziehungsweise »ein anderer Jünger«
  rationale: Der griechische Ausdruck steht im maskulinen Singular, kann im Zusammenhang aber einen Mitjünger allgemeiner bezeichnen. Der Haupttext bewahrt die Form, die Fußnote die mögliche weitere Bezugsweite.
- issue: Zeitform und Spannung in ἁμαρτήσει ... ἀφήσω
  choice: Beide Futurformen ausdrücklich wiedergegeben
  alternative: 'Präsentisch: »wenn mein Bruder gegen mich sündigt und ich ihm vergebe«'
  rationale: Die ungewöhnliche griechische Formulierung fragt wörtlich danach, wie oft der Bruder sündigen und Petrus vergeben wird. Diese Spannung wird nicht stillschweigend zu einem Konditionalsatz geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst etwas ungewohnte Futurkoordination folgt der Struktur des griechischen Textes und bewahrt dessen offene gedankliche Spannung.
