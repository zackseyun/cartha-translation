review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den Kontrast (δέ/ἀλλά), die fehlende Bereitschaft, die Abfolge des Weggehens sowie die Härte von ἔβαλεν treffend wieder. „Das Geschuldete“ ist eine genaue und angemessen offene Wiedergabe von τὸ ὀφειλόμενον. Korrekturbedarf besteht bei der Wiedergabe von ἀποδῷ: Der Konjunktiv II Plusquamperfekt „bezahlt hätte“ erzeugt im Deutschen eine kontrafaktische bzw. irreal klingende Nuance, die der griechische Aorist-Konjunktiv nach ἕως οὗ nicht trägt.'
  naturalness: Der Satz ist bis auf „bezahlt hätte“ klar, würdevoll und modernes Standarddeutsch. „Bis er das Geschuldete bezahlt hatte“ ist als vom erzählten Zeitpunkt aus vorausblickender Abschluss der Haft idiomatisch und neutral.
  terminology: „Gefängnis“ und „das Geschuldete“ sind sachgerecht. „Warf ihn ins Gefängnis“ erhält die im Verb βάλλω erkennbare Härte, ohne über das Griechische hinauszugehen.
  issues:
  - severity: medium
    issue: „bezahlt hätte“ verwendet einen irrealen Konjunktiv II der Vorzeitigkeit.
    rationale: ἀποδῷ ist ein Aorist-Konjunktiv in einem temporalen ἕως-οὗ-Satz und bezeichnet den erwarteten Eintritt der Zahlung als zeitliche Grenze. Die deutsche Form „hätte bezahlt“ kann eine nicht eingetretene oder nur hypothetische Zahlung nahelegen. Der indikativische Plusquamperfekt „bezahlt hatte“ wahrt die erzählerische Vorausblicksperspektive ohne Irrealität.
  revised_text: Doch er wollte nicht, sondern ging weg und warf ihn ins Gefängnis, bis er das Geschuldete bezahlt hatte.
  revised_footnotes: []
