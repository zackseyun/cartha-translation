  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: de
  text: Doch er wollte nicht, sondern ging weg und warf ihn ins Gefängnis, bis er das Geschuldete bezahlt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Doch er
  rationale: Das substantivisch gebrauchte Artikelwort verweist auf den zuvor genannten Knecht; „Doch er“ gibt den Rückbezug und den Gegensatz knapp und natürlich wieder.
- source_word: οὐκ ἤθελεν
  choice: wollte nicht
  rationale: Die Form bezeichnet fehlende Bereitschaft oder fehlenden Willen. „Wollte nicht“ bleibt nahe am griechischen Wortlaut, ohne die Aussage durch „weigerte sich“ zu verstärken.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung kennzeichnet ἀλλά den scharfen Gegensatz zwischen seiner fehlenden Bereitschaft und seinem tatsächlichen Handeln.
- source_word: ἀπελθὼν
  choice: ging weg
  rationale: Das Aoristpartizip wird als koordinierte finite Verbform wiedergegeben; so bleibt die zeitliche Abfolge in natürlichem Deutsch erhalten.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: warf ihn ins Gefängnis
  rationale: „Warf“ bewahrt die Härte von βάλλω deutlicher als das neutralere „brachte“ oder „ließ ihn ins Gefängnis setzen“.
- source_word: ἕως οὗ
  choice: bis
  rationale: „Bis“ gibt die zeitliche Grenze der Gefangenschaft präzise und idiomatisch wieder.
- source_word: ἀποδῷ
  choice: bezahlt hätte
  rationale: Der Konjunktiv nach ἕως οὗ bezeichnet die aus damaliger Perspektive erwartete Voraussetzung für das Ende der Haft. Der deutsche Konjunktiv II der Vorzeitigkeit bringt diese Perspektive in der indirekt-zielgerichteten Konstruktion natürlich zum Ausdruck.
- source_word: τὸ ὀφειλόμενον
  choice: das Geschuldete
  rationale: Das substantivierte Partizip bedeutet wörtlich „das, was geschuldet wird“. „Das Geschuldete“ wahrt diese Form und lässt offen, ob der Betrag oder die Schuld als Ganzes im Vordergrund steht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Härte der Erzählung bleibt durch „wollte nicht“ und „warf ihn ins Gefängnis“ erhalten; es sind keine erläuternden Fußnoten erforderlich.
