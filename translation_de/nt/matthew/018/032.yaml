    issue: „ließ ihn zu sich rufen“ statt einer direkten Wiedergabe von προσκαλεσάμενος
    rationale: Die kausative Wendung kann nahelegen, der Herr habe eine andere Person mit dem Herbeirufen beauftragt. Der griechische Text beschreibt direkt sein Herbeirufen des Sklaven.
  - severity: low
    issue: „Da“ als Wiedergabe von τότε
    rationale: Nicht falsch, doch „Dann“ bildet die fortlaufende narrative Abfolge im modernen Deutsch natürlicher ab.
