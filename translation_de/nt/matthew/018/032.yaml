  rationale: Die Revision beseitigt die unnötig vermittelte Kausativkonstruktion und verwendet einen natürlicheren narrativen Anschluss. Die übrigen Entscheidungen bleiben erhalten, da sie den griechischen Wortlaut, die soziale Beziehung im Gleichnis und die doppelte Resonanz von Schuld und Erlass angemessen wiedergeben.
