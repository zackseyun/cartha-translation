  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: de
  text: 'Dann rief sein Herr ihn zu sich und sagte zu ihm: »Du böser Sklave! Jene ganze Schuld habe ich dir erlassen, weil du mich angefleht hast.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Markiert natürlich die zeitliche und erzählerische Folge innerhalb des Gleichnisses.
- source_word: προσκαλεσάμενος αὐτόν
  choice: ließ ihn zu sich rufen
  rationale: Gibt das Herbeirufen zum Herrn und dessen Autorität idiomatisch wieder, ohne ein reflexives deutsches »rief ihn zu sich« an das Partizip zu binden.
- source_word: ὁ κύριος αὐτοῦ
  choice: sein Herr
  rationale: Bezeichnet hier den Herrn des Sklaven innerhalb des Gleichnisses; »Herr« erhält die soziale Hierarchie und die mögliche parabolische Resonanz.
- source_word: λέγει αὐτῷ
  choice: sagte zu ihm
  rationale: Das historische Präsens wird entsprechend natürlicher deutscher Erzählweise im Präteritum wiedergegeben.
- source_word: Δοῦλε πονηρέ
  choice: Du böser Sklave!
  rationale: δοῦλος bezeichnet in diesem Herren-Sklaven-Verhältnis einen rechtlich und sozial Gebundenen; πονηρός ist hier ein scharfes moralisches Urteil.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: jene ganze Schuld
  rationale: Bewahrt sowohl die Gesamtheit als auch den rückverweisenden Charakter von ἐκείνην; »Schuld« trägt im Deutschen zugleich finanziellen und moralischen Sinn.
- source_word: ἀφῆκά σοι
  choice: habe ich dir erlassen
  rationale: Im unmittelbaren Schuldkontext bezeichnet ἀφίημι den Erlass einer Schuld; »erlassen« bleibt zugleich mit Vergebungssprache verbunden.
- source_word: ἐπεὶ παρεκάλεσάς με
  choice: weil du mich angefleht hast
  rationale: ἐπεί gibt den Grund an, und παρακαλέω bezeichnet hier eine dringliche Bitte.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Herren-Sklaven-Verhältnis
  choice: Sklave
  alternative: Diener
  rationale: Die Besitz- und Abhängigkeitsbeziehung ist für die Handlung des Gleichnisses wesentlich. »Diener« könnte diese Bindung abschwächen.
- issue: Wiedergabe von ἀφίημι bei einer Geldschuld
  choice: erlassen
  alternative: vergeben
  rationale: »Erlassen« bezeichnet den konkreten Schuldenerlass idiomatisch und bewahrt durch das deutsche Wort »Schuld« dennoch die moralisch-theologische Verbindung zur Vergebung.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Besitzer
  rationale: »Herr« entspricht der sozialen Beziehung im Gleichnis, ohne den Ausdruck auf bloßes Eigentum zu verengen; eine mögliche parabolische Mehrdeutigkeit bleibt erhalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede ist knapp und nachdrücklich; »Sklave« macht die historische Abhängigkeitsbeziehung transparent. Keine Fußnote ist erforderlich, da der Schuldenerlass im Haupttext eindeutig und die theologische Resonanz durch »Schuld« gewahrt ist.
