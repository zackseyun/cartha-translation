  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes vollständig und sachgerecht wieder: οὖν („nun“), σύνδουλοι („Mitsklaven“), die zweimalige Wendung τὰ γενόμενα mit der Verstärkung πάντα beim zweiten Vorkommen, ἐλυπήθησαν σφόδρα („wurden sie tief betrübt“), die Abfolge von ἐλθόντες und διεσάφησαν sowie τῷ κυρίῳ ἑαυτῶν („ihrem Herrn“). Die Aufteilung in zwei deutsche Sätze verändert weder Ablauf noch Aussage.'
