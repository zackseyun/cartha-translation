  terminology: „Mitsklaven“ bewahrt den durch σύνδουλοι bezeichneten gemeinsamen Sklavenstatus deutlicher als abschwächende Alternativen. „Herr“ ist für κύριος im Gleichniskontext passend; das Possessivum „ihrem“ gibt ἑαυτῶν korrekt wieder. Die Fußnote bietet mit „Mitknechte“ eine plausible lexikalische Alternative, ohne den Haupttext zu verwässern.
