id: MAT.18.31
reference: Matthew 18:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: de
  text: Als nun seine Mitsklaven[a] sahen, was geschehen war, wurden sie tief betrübt. Sie kamen zu ihrem Herrn und berichteten ihm alles, was geschehen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Mitknechte. Das griechische Wort bezeichnet Sklaven beziehungsweise Knechte, die demselben Herrn gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Im Anschluss an ἰδόντες gibt „Als nun“ den folgernden und zugleich erzählerisch fortschreitenden Zusammenhang natürlich wieder.
- source_word: σύνδουλοι
  choice: Mitsklaven
  rationale: Der Ausdruck bezeichnet Menschen, die unter demselben Herrn den Status von Sklaven teilen. „Mitsklaven“ bewahrt diesen für das Gleichnis wichtigen sozialen Status genauer als „Mitdiener“.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: was geschehen war / alles, was geschehen war
  rationale: Die substantivierten Partizipien werden idiomatisch wiedergegeben; πάντα wird beim zweiten Vorkommen ausdrücklich durch „alles“ abgebildet.
- source_word: ἐλυπήθησαν σφόδρα
  choice: wurden tief betrübt
  rationale: Die Formulierung bewahrt sowohl den Kummer beziehungsweise die Bestürzung von λυπέω als auch die starke Intensivierung durch σφόδρα.
- source_word: ἐλθόντες
  choice: sie kamen
  rationale: Das vorzeitige Aoristpartizip wird als eigener deutscher Hauptsatz wiedergegeben und wahrt so die Abfolge der Ereignisse.
- source_word: διεσάφησαν
  choice: berichteten
  rationale: Das Verb bezeichnet ein klares beziehungsweise eingehendes Darlegen. „Berichteten“ passt zum Vorgang; die Vollständigkeit wird bereits durch „alles“ ausgedrückt.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: ihrem Herrn
  rationale: „Herr“ ist im Deutschen die natürliche Wiedergabe von κύριος für den menschlichen Herrn des Gleichnisses und vermeidet eine unnötige Festlegung auf eine göttliche Anrede.
theological_decisions:
- issue: Wiedergabe eines Wortes aus der δοῦλος-Wortfamilie im sozialen Rahmen des Gleichnisses
  choice: Mitsklaven
  alternative: Mitknechte / Mitdiener
  rationale: Der gemeinsame unfreie Status unter demselben Herrn gehört zur Logik des Gleichnisses. „Mitsklaven“ macht ihn sichtbar, ohne die Aussage durch eine konfessionelle Deutung zu ergänzen.
- issue: Wiedergabe von κύριος für einen menschlichen Vorgesetzten
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ erhält die übliche lexikalische Entsprechung und funktioniert im Kontext eines menschlichen Herrn; die Kleinschreibung im fortlaufenden Satz verhindert eine unmittelbare Gleichsetzung mit einem Gottesnamen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem langen griechischen Satz leicht gegliedert, während Abfolge, Wiederholung und emotionale Stärke erhalten bleiben.
