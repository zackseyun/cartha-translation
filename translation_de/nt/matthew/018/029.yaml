review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft σύνδουλος, παρεκάλει, Μακροθύμησον und ἀποδώσω im Wesentlichen gut. Das im Entwurf ergänzte »alles« hat jedoch keine Grundlage im vorgelegten SBLGNT-Text, der nur καὶ ἀποδώσω σοι („und ich werde dir zurückzahlen“) liest. Auch »vor ihm« ist im Griechischen nicht ausdrücklich formuliert und sollte bei einer optimal-äquivalenten Übersetzung nicht ergänzt werden.
  naturalness: »Da fiel sein Mitsklave nieder und flehte ihn an« ist verständliches, modernes und zugleich würdiges Standarddeutsch. »Hab Geduld mit mir, dann werde ich dir zurückzahlen« klingt idiomatisch; »dann« gibt den Folgebezug im Deutschen angemessen wieder.
  terminology: »Mitsklave« gibt σύνδουλος präzise wieder und erhält die im Gleichniskontext relevante unfreie Stellung. »flehte ihn an«, »Hab Geduld mit mir« und »zurückzahlen« sind passende, natürliche Wiedergaben ohne unnötig archaisches Register.
  issues:
  - severity: medium
    issue: Nicht belegte Ergänzung »alles«
    rationale: Der vorgelegte griechische Text lautet καὶ ἀποδώσω σοι und enthält kein πάντα. Die Variantenzeichen im SBLGNT-Text rechtfertigen keine Ergänzung; eine abweichende Lesart müsste, falls relevant, ausdrücklich belegt und als Fußnote behandelt werden.
  - severity: low
    issue: Ergänzung »vor ihm«
    rationale: πεσὼν bezeichnet das Niederfallen, nennt aber in diesem Vers kein Objekt der Bewegung. Der Kontext lässt die Geste zwar erkennen, doch »nieder« bewahrt den Text enger und klingt im Deutschen natürlich.
  revised_text: 'Da fiel sein Mitsklave nieder und flehte ihn an: »Hab Geduld mit mir, dann werde ich dir zurückzahlen.«'
  revised_footnotes: []
  revision_rationale: Die Revision entfernt die unbelegte Quantifizierung »alles« und die nicht explizit im Vers ausgedrückte Ergänzung »vor ihm«. Sie wahrt die präzise Wiedergabe von σύνδουλος als »Mitsklave« sowie den eindringlichen Charakter der Bitte und des Rückzahlungsversprechens.
