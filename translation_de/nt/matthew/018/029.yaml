source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: de
  text: 'Da fiel sein Mitsklave nieder und flehte ihn an: »Hab Geduld mit mir, dann werde ich dir zurückzahlen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: Mitsklave
  rationale: Das Kompositum bezeichnet einen Sklaven desselben Herrn. »Mitsklave« bewahrt die soziale Unfreiheit, die im Kontext des Gleichnisses wichtig ist, und vermeidet die Abschwächung zu »Mitdiener«.
- source_word: παρεκάλει
  choice: flehte ihn an
  rationale: Im Zusammenhang mit Schulden und drohender Bestrafung bezeichnet das Imperfekt ein eindringliches, anhaltendes Bitten; »flehte ihn an« ist gegenwärtig, verständlich und der Notlage angemessen.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Hab Geduld mit mir
  rationale: Die Verbindung bedeutet, jemandem gegenüber geduldig beziehungsweise nachsichtig zu sein. Die deutsche Wendung ist idiomatisch und bewahrt den Imperativ.
- source_word: ἀποδώσω
  choice: werde ich ... zurückzahlen
  rationale: Im unmittelbaren Schuldenkontext bezeichnet das Verb die Rückzahlung des Geschuldeten.
- source_word: πεσὼν
  choice: fiel ... vor ihm nieder
  rationale: Die Form beschreibt eine körperliche Geste demütiger Bitte. »Vor ihm niederfallen« gibt die relationale Ausrichtung im Deutschen natürlich wieder.
- source_word: οὖν
  choice: Da
  rationale: Hier führt οὖν die Reaktion im Erzählablauf weiter. »Da« klingt im deutschen Gleichnisstil natürlich und wahrt den folgernden beziehungsweise zeitlichen Anschluss.
- source_word: καί
  choice: dann
  rationale: 'Zwischen Aufforderung und Zusage kann καί im Deutschen natürlich als Folgeanschluss wiedergegeben werden: Wenn Geduld gewährt wird, folgt die Rückzahlung.'
- source_word: πάντα (Textvariante)
  choice: alles
  rationale: Die Übersetzung folgt hier der im SBLGNT-Text angezeigten Lesart hinter der Variantennotation; »alles« bezieht sich auf die gesamte geschuldete Summe.
theological_decisions:
- issue: Wiedergabe der δοῦλος-Sprache in σύνδουλος
  choice: Mitsklave
  alternative: Mitdiener; Mitknecht
  rationale: Das Gleichnis setzt eine Herrschafts- und Abhängigkeitsordnung voraus. »Mitsklave« bildet die unfreie Stellung deutlicher ab, ohne die Beziehung allegorisch oder konfessionell auszudeuten.
- issue: Umfang des Rückzahlungsversprechens
  choice: »alles zurückzahlen« im Haupttext
  alternative: »zurückzahlen« ohne »alles«
  rationale: Die SBLGNT-Variantennotation bei der betreffenden Stelle weist auf eine textkritische Variation hin. Die gewählte Fassung bewahrt die im vorgelegten Ausgangstext angezeigte Lesart, ohne daraus eine zusätzliche theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich und eindringlich; »Mitsklave« ist bewusst quellentreu, obwohl das Wort im heutigen Deutsch weniger häufig ist. Keine Fußnote ist nötig, da keine alternative Lesart im veröffentlichten Text erläutert werden muss.
