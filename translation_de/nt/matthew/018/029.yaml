revisions:
- from: 'Da fiel sein Mitsklave vor ihm nieder und flehte ihn an: »Hab Geduld mit mir, dann werde ich dir alles zurückzahlen.«'
  to: 'Da fiel sein Mitsklave nieder und flehte ihn an: »Hab Geduld mit mir, dann werde ich dir zurückzahlen.«'
  rationale: Die Revision entfernt die unbelegte Quantifizierung »alles« und die nicht explizit im Vers ausgedrückte Ergänzung »vor ihm«. Sie wahrt die präzise Wiedergabe von σύνδουλος als »Mitsklave« sowie den eindringlichen Charakter der Bitte und des Rückzahlungsversprechens.
