  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: de
  text: Darum wurde das Himmelreich mit einem König verglichen, der mit seinen Sklaven[a] abrechnen wollte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dienern« beziehungsweise »Knechten«; das griechische Wort δοῦλοι bezeichnet Menschen in einem gebundenen Abhängigkeitsverhältnis und kann ausdrücklich »Sklaven« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Die griechische Wendung bezeichnet das Abrechnen von Rechnungen beziehungsweise die Prüfung von Konten und kann das Einfordern von Rechenschaft einschließen.
    reason: idiom_clarification
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt den folgernden beziehungsweise begründenden Anschluss an die vorausgehende Lehre knapp und natürlich wieder.
- source_word: ὡμοιώθη
  choice: wurde … verglichen
  rationale: Bewahrt die passive Form des Aorists und den ausdrücklichen Vergleich, ohne mit »ist gleich« die Verbform einzuebnen.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Geläufige, würdevolle deutsche Wiedergabe der matthäischen Wendung für Gottes Herrschaft; sie ist hier natürlicher als »Königreich der Himmel«.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: mit einem König
  rationale: βασιλεῖ bestimmt ἀνθρώπῳ näher; im Deutschen vermittelt »einem König« den Sinn vollständig und ohne die schwerfällige Form »einem Menschen, einem König«.
- source_word: ἠθέλησεν
  choice: wollte
  rationale: Gibt die Absicht des Königs in natürlichem modernem Deutsch wieder.
- source_word: συνᾶραι λόγον
  choice: abrechnen
  rationale: Die deutsche Wendung bezeichnet hier treffend das Prüfen und Begleichen von Rechnungen beziehungsweise das Einfordern von Rechenschaft.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: mit seinen Sklaven
  rationale: δοῦλοι bezeichnet rechtlich und sozial Gebundene; die uneingeschränkte Verfügungsgewalt des Königs im Fortgang des Gleichnisses macht diesen Status bedeutsam. Eine Fußnote nennt die traditionellere Alternative.
theological_decisions:
- issue: Wiedergabe von δοῦλος im königlich-wirtschaftlichen Gleichniskontext
  choice: Sklaven
  alternative: Diener oder Knechte
  rationale: »Sklaven« wahrt den gebundenen Status und die weitreichende Verfügungsgewalt des Königs, ohne das soziale Verhältnis zu beschönigen. Da »Diener« traditionell verbreitet und semantisch möglich ist, bleibt es als Alternative in der Fußnote erhalten.
- issue: Reichweite des Vergleichs
  choice: Das Himmelreich wird mit einem König verglichen
  alternative: Das Himmelreich ist wie ein König
  rationale: Die passive Konstruktion ὡμοιώθη wird formal bewahrt. Der weitere Verlauf zeigt, wie sich der Vergleich entfaltet; der Vers allein wird nicht durch eine ausdrückliche Deutung ergänzt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Himmelreich« folgt dem etablierten matthäischen Sprachgebrauch. »Abrechnen« ist idiomatisch; die Fußnote erläutert den wirtschaftlich-rechtlichen Sinn und verhindert eine bloß zwischenmenschliche Lesart.
