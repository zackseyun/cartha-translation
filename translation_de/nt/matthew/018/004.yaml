id: MAT.18.4
reference: Matthew 18:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: de
  text: Wer sich also selbst erniedrigt wie dieses Kind, der ist der Größte im Himmelreich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: sich selbst erniedrigt
  rationale: Gibt die aktive, auf die eigene Person bezogene Handlung des griechischen Ausdrucks unmittelbar wieder. „Demütigt“ wäre möglich, kann im heutigen Deutsch aber stärker nach äußerer Beschämung klingen.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: wie dieses Kind
  rationale: Bewahrt den direkten Vergleich und den konkreten Bezug auf das anwesende Kind.
- source_word: ὁ μείζων
  choice: der Größte
  rationale: Der bestimmte Artikel zusammen mit dem Komparativ hat hier superlativische Bedeutung.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: im Himmelreich
  rationale: Natürliche und in Matthäus geläufige deutsche Wiedergabe von „im Reich der Himmel“.
theological_decisions:
- issue: Art der Erniedrigung
  choice: Die Formulierung lässt offen, in welcher konkreten Hinsicht die Person dem Kind gleicht.
  alternative: Den Vergleich ausdrücklich als kindliche Demut, Abhängigkeit oder niedrigen Rang auszudeuten.
  rationale: Der Vers nennt keine einzelne Eigenschaft des Kindes; eine nähere Deutung sollte nicht in den Text eingefügt werden.
- issue: Hervorhebung des Subjekts im Folgesatz
  choice: „der ist“ bewahrt die nachdrückliche Wiederaufnahme von οὗτος.
  alternative: „ist“ ohne wiederaufnehmendes Pronomen.
  rationale: Die griechische Konstruktion hebt gerade denjenigen hervor, der sich so erniedrigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Form „Wer …, der …“ bildet die griechische Hervorhebung idiomatisch ab; „Himmelreich“ ist knapp und im matthäischen Sprachgebrauch vertraut.
