  text: Ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου σῶσαι τὸ ἀπολωλός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: de
  text: Denn der Menschensohn ist gekommen, um das Verlorene zu retten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter im Codex Sinaiticus und im Codex Vaticanus aus dem 4. Jahrhundert, sowie in frühen koptischen Übersetzungen. Er steht jedoch im Codex Bezae aus dem 5. Jahrhundert, in der byzantinischen Mehrheitstradition und in der lateinischen Vulgata. Wahrscheinlich wurde er von späteren Schreibern zur Angleichung an Lukas 19,10 eingefügt.
    reason: textual_critical
lexical_decisions:
- source_word: ἀπολωλός
  choice: das Verlorene
  rationale: Das substantivierte Partizip Perfekt Aktiv ist Neutrum Singular. „Das Verlorene“ bewahrt diese grammatische Form und bezeichnet das, was sich im Zustand des Verlorenseins beziehungsweise des drohenden Verderbens befindet.
- source_word: σῶσαι
  choice: zu retten
  rationale: Der Infinitiv Aorist von σῴζω bezeichnet hier die beabsichtigte Rettung aus Verlorenheit oder Verderben; „retten“ ist im Deutschen klar, natürlich und theologisch nicht unnötig verengt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die feste deutsche Wiedergabe des christologischen Titels erhält dessen biblische Prägung und mögliche Anklänge an Daniel 7.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem Deutsch; „Denn“ gibt γάρ wieder. Der Fußnotenmarker steht nach dem vollständigen Vers, da die Anmerkung die Echtheit des ganzen Verses betrifft.
