id: MAT.18.14
reference: Matthew 18:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: de
  text: Ebenso ist es nicht der Wille eures Vaters im Himmel, dass auch nur eines von diesen Kleinen zugrunde geht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verloren geht“. Das griechische Verb kann sowohl „zugrunde gehen“ als auch „verloren gehen“ bedeuten; das unmittelbar vorausgehende Bild vom verirrten Schaf legt hier auch die zweite Bedeutung nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Ebenso
  rationale: Stellt in natürlichem Deutsch den Bezug zum unmittelbar vorausgehenden Bild vom verirrten Schaf her.
- source_word: θέλημα ἔμπροσθεν τοῦ πατρός
  choice: der Wille eures Vaters
  rationale: Die griechische Wendung mit ἔμπροσθεν (wörtlich „vor“) bezeichnet hier idiomatisch, was beim Vater gewollt ist. Eine mechanisch wörtliche Wiedergabe mit „vor“ wäre im modernen Deutschen missverständlich und schwerfällig.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: eures Vaters im Himmel
  rationale: Gibt die persönliche Zuordnung und die Ortsangabe klar und idiomatisch wieder; der griechische Plural „Himmel“ wird im Deutschen gewöhnlich singularisch ausgedrückt.
- source_word: ἵνα ἀπόληται
  choice: dass … zugrunde geht
  rationale: ἀπόλλυμι kann hier sowohl endgültiges Verderben als auch Verlorengehen bezeichnen. „Zugrunde geht“ wahrt den ernsten Ausgang, während die kontextnahe Alternative in der Fußnote erscheint.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: auch nur eines von diesen Kleinen
  rationale: „Auch nur eines“ bringt die im Zusammenhang hervorgehobene Einzahl idiomatisch zum Ausdruck. „Diese Kleinen“ wahrt die offene Bezeichnung und legt sie nicht ausschließlich auf Kinder fest.
theological_decisions:
- issue: Bedeutung von ἀπόληται im Zusammenhang mit dem verirrten Schaf
  choice: zugrunde geht
  alternative: verloren geht
  rationale: Das Verb kann auf Verderben oder auf Verlorengehen zielen. Der Haupttext bewahrt die ernste Warnung; die Fußnote hält die durch den unmittelbaren Kontext gestützte zweite Nuance ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ebenso“ verbindet den Satz knapp mit dem vorausgehenden Vergleich. „Diese Kleinen“ bleibt bewusst offen für die metaphorische beziehungsweise gemeinschaftsbezogene Bedeutung und wird nicht auf kleine Kinder eingeengt.
