id: MAT.18.6
reference: Matthew 18:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: de
  text: Wer aber einen von diesen Kleinen, die an mich glauben, zu Fall bringt[a], für den wäre es besser, wenn ihm ein Mühlstein, den ein Esel dreht,[b] um den Hals gehängt und er im offenen Meer[c] versenkt würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Sünde verführt“. Das griechische Verb kann bedeuten, jemanden zum Straucheln, zum Abfall oder zur Sünde zu bringen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein großer Mühlstein, der von einem Esel statt von Hand gedreht wurde.
    reason: cultural_note
  - marker: c
    text: 'Oder: „in der Weite des Meeres“. Das griechische Wort bezeichnet besonders das offene Meer fern vom Ufer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: zu Fall bringt
  rationale: Die Wendung bewahrt das Bild des Stolperns und kann zugleich Verführung zur Sünde oder Abfall einschließen, ohne den Bedeutungsumfang vorschnell einzuengen.
- source_word: μικρῶν τούτων
  choice: diesen Kleinen
  rationale: Die Formulierung lässt offen, ob Kinder, gering geachtete Menschen oder demütige und verletzliche Glaubende gemeint sind.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: die an mich glauben
  rationale: Dies ist die direkte und natürliche Wiedergabe des auf Jesus gerichteten Glaubens.
- source_word: συμφέρει αὐτῷ
  choice: für den wäre es besser
  rationale: Die idiomatische deutsche Formulierung gibt den vergleichenden Vorteil in dieser drastischen Warnung wieder.
- source_word: μύλος ὀνικός
  choice: ein von einem Esel gedrehter Mühlstein
  rationale: ὀνικός bezeichnet einen großen Mühlstein, der im Unterschied zum Handmühlstein von einem Esel bewegt wurde; die explizite Wiedergabe erschließt das antike Bild.
- source_word: καταποντισθῇ
  choice: versenkt würde
  rationale: Das Verb bezeichnet das Hinabstoßen beziehungsweise Versinkenlassen im tiefen Wasser; „versenkt“ bewahrt den passiven Vorgang, ohne nur das Ergebnis zu benennen.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: im offenen Meer
  rationale: πέλαγος bezeichnet die weite, offene See fern vom Ufer und nicht primär die Wassertiefe.
theological_decisions:
- issue: Bezugsgruppe der „Kleinen“
  choice: „diesen Kleinen, die an mich glauben“ wird bewusst breit wiedergegeben.
  alternative: „diesen Kindern, die an mich glauben“
  rationale: Das Kind im unmittelbaren Kontext prägt das Bild, doch die nähere Bestimmung als Glaubende kann auch niedrig gestellte, demütige oder verletzliche Jünger einschließen. Die Übersetzung schränkt den Bezug daher nicht auf Kinder ein.
- issue: Bedeutungsumfang von σκανδαλίζω
  choice: „zu Fall bringt“
  alternative: „zur Sünde verführt“
  rationale: Das Verb kann Verführung zur Sünde, geistliches Straucheln oder Abfall bezeichnen. Die bildhafte Formulierung erhält diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu Fall bringt“ erhält die griechische Metaphorik und den breiten geistlichen Sinn. Der kontrafaktisch-vergleichende Warnsatz wird mit „wäre es besser, wenn …“ natürlich formuliert; die drastische Bildsprache bleibt ungemildert.
