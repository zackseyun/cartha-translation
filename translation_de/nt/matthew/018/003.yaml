reference: Matthew 18:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: de
  text: 'Und er sagte: „Amen, ich sage euch: Wenn ihr nicht umkehrt[a] und wie die Kinder[b] werdet, werdet ihr ganz gewiss nicht in das Himmelreich hineinkommen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht umgewendet werdet“. Ältere Übersetzungen geben das Verb auch mit „euch bekehrt“ wieder.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „wie Kinder“. Der griechische Ausdruck hat den Artikel („wie die Kinder“) und kann an das Kind im unmittelbaren Zusammenhang erinnern.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „werdet ihr niemals hineinkommen“. Im Griechischen steht eine nachdrückliche Verneinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Amen
  rationale: Das im Deutschen geläufige „Amen“ bewahrt die feierliche, autoritative Einleitungsformel Jesu und ist in diesem Zusammenhang verständlich.
- source_word: στραφῆτε
  choice: umkehrt
  rationale: Die Form kann intransitiv („umkehren“) oder passiv („umgewendet werden“) verstanden werden. „Umkehrt“ bezeichnet eine entschiedene Neuausrichtung, ohne einen späteren theologischen Fachbegriff einzutragen.
- source_word: γένησθε
  choice: werdet
  rationale: Gibt den Zustandswechsel von γίνομαι natürlich und eng am Griechischen wieder.
- source_word: ὡς τὰ παιδία
  choice: wie die Kinder
  rationale: Der Artikel wird bewahrt; zugleich bleibt offen, ob die Kinder als Gruppe beziehungsweise das unmittelbar zuvor in die Mitte gestellte Kind anklingen. Der Text benennt hier keine bestimmte kindliche Eigenschaft.
- source_word: οὐ μὴ εἰσέλθητε
  choice: werdet ihr ganz gewiss nicht hineinkommen
  rationale: „Ganz gewiss nicht“ bringt die nachdrückliche Verneinung οὐ μή zum Ausdruck; „hineinkommen“ bildet εἰσέρχομαι idiomatisch ab.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: „Himmelreich“ ist die natürliche, etablierte deutsche Wiedergabe der für Matthäus charakteristischen Wendung und bezeichnet Gottes Königsherrschaft beziehungsweise Reich, nicht bloß einen Ort.
theological_decisions:
- issue: Bedeutung der umkehrartigen Sprache in στραφῆτε
  choice: „umkehrt“ ohne technischen Bekehrungsbegriff
  alternative: „umgewendet werdet“ oder „euch bekehrt“
  rationale: Das Griechische lässt hinsichtlich der grammatischen Diathese eine gewisse Offenheit und fordert eine entschiedene Wendung; „umkehrt“ vermeidet sowohl eine unnötige Festlegung der handelnden Instanz als auch konfessionell geprägte Fachsprache.
- issue: Vergleich mit den Kindern
  choice: Die konkrete Wendung „wie die Kinder“ bleibt ohne Deutung der verglichenen Eigenschaft stehen.
  alternative: „wie Kinder“ oder eine Ausdeutung als unschuldig, demütig oder vertrauensvoll
  rationale: Der Vers selbst nennt nicht, welche kindliche Eigenschaft gemeint ist. Die Übersetzung bewahrt diese interpretative Offenheit und den möglichen Rückbezug auf das Kind im unmittelbaren Kontext.
- issue: Stärke der Verneinung
  choice: „ganz gewiss nicht“
  alternative: „niemals“
  rationale: Die emphatische Konstruktion οὐ μή wird deutlich wiedergegeben, ohne die Aussage durch eine zusätzliche zeitliche Nuance unnötig zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Amen, ich sage euch“ bewahrt die markante Redeeinleitung Jesu; „Himmelreich“ ist idiomatisch und traditionsnah. Die Satzstruktur folgt dem griechischen Bedingungssatz, bleibt aber gut verständlich.
