  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: de
  text: Da hatte der Herr Mitleid mit diesem Sklaven[a], ließ ihn gehen und erließ ihm das Darlehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener. Das griechische Wort bezeichnet hier einen Sklaven, also einen Menschen in rechtlich und sozial gebundener Stellung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: die Schuld. Das griechische Substantiv bezeichnet genauer ein Darlehen oder etwas Geliehenes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: hatte … Mitleid mit ihm
  rationale: Das Partizip bezeichnet tief empfundenes Erbarmen. Die Formulierung ist im modernen Deutsch natürlich und bewahrt die emotionale Kraft, ohne die passive Form des griechischen Deponens mechanisch nachzubilden.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Reaktion des Herrn im Erzählverlauf weiter. „Da“ gibt diesen narrativen Anschluss idiomatisch wieder.
- source_word: ὁ κύριος τοῦ δούλου ἐκείνου
  choice: der Herr dieses Sklaven
  rationale: κύριος bezeichnet im unmittelbaren Zusammenhang den menschlichen Herrn der Erzählfigur; δοῦλος benennt deren konkreten Sklavenstatus. Das kleingeschriebene „Herr“ vermeidet eine direkte göttliche Titulierung.
- source_word: ἀπέλυσεν αὐτόν
  choice: ließ ihn gehen
  rationale: Die Wendung gibt die Entlassung aus der unmittelbaren Festhaltung bzw. Verpflichtung wieder, ohne fälschlich eine Freilassung aus dem Sklavenstand zu behaupten.
- source_word: τὸ δάνειον
  choice: das Darlehen
  rationale: δάνειον bezeichnet genauer ein Darlehen beziehungsweise etwas Geliehenes. Die spezifische Bedeutung wird gegenüber dem allgemeineren „Schuld“ bewahrt.
- source_word: ἀφῆκεν αὐτῷ
  choice: erließ ihm
  rationale: ἀφίημι bezeichnet hier den Erlass der finanziellen Forderung. „Erließ“ ist im Deutschen für eine aufgehobene Schuldverpflichtung präzise und natürlich.
theological_decisions:
- issue: Mögliche Deutung von κύριος als göttlicher Titel
  choice: „Herr“ kleingeschrieben und auf den menschlichen Herrn im Gleichnis bezogen
  alternative: „der Herr“ als unmittelbare Gottesbezeichnung oder „Gebieter“
  rationale: Der unmittelbare Erzählbezug ist der Herr des Sklaven. Die weiterführende theologische Entsprechung des Gleichnisses bleibt möglich, wird aber nicht in den Wortlaut hineingetragen.
- issue: Sozialer Status bei δοῦλος
  choice: „Sklave“
  alternative: „Diener“ oder „Knecht“
  rationale: Im Zusammenhang von Herrschaft, Verschuldung und drohender Veräußerung ist der rechtlich und sozial abhängige Status wesentlich; „Diener“ würde ihn abschwächen.
- issue: Bedeutung von ἀπέλυσεν
  choice: „ließ ihn gehen“
  alternative: „ließ ihn frei“
  rationale: „Ließ ihn frei“ könnte als förmliche Freilassung aus der Sklaverei verstanden werden. Der Text besagt sicher, dass der Herr ihn aus der aktuellen Zwangslage entließ, nicht ausdrücklich, dass er ihn manumittierte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Herr“ ist im Deutschen die natürliche Bezeichnung für den menschlichen Herrn eines Sklaven im Gleichnis; die Kleinschreibung verhindert eine vorschnelle Deutung als unmittelbaren Gottestitel. „Ließ ihn gehen“ vermeidet die unbelegte Aussage einer förmlichen Freilassung.
