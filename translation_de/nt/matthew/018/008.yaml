reference: Matthew 18:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: de
  text: Wenn aber deine Hand oder dein Fuß dich zu Fall bringt[a], dann hau die Hand oder den Fuß ab und wirf das abgetrennte Glied von dir. Es ist besser für dich, verstümmelt oder lahm ins Leben einzugehen, als mit zwei Händen oder zwei Füßen ins ewige Feuer geworfen zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich zur Sünde verführt“. Das griechische Verb bedeutet wörtlich, jemanden zum Stolpern oder zu Fall zu bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: dich zu Fall bringt
  rationale: Die Wiedergabe bewahrt das griechische Bild des Stolperns beziehungsweise Fallens und lässt zugleich die moralische Tragweite im Zusammenhang erkennen.
- source_word: ἔκκοψον
  choice: hau sie ab
  rationale: Der Aoristimperativ ist scharf und konkret. „Abhauen“ ist bei Hand oder Fuß eine natürliche, ungemilderte deutsche Entsprechung.
- source_word: βάλε ἀπὸ σοῦ
  choice: wirf sie von dir
  rationale: Die Formulierung gibt sowohl die kraftvolle Handlung als auch die ausdrückliche Entfernung vom Handelnden wieder.
- source_word: καλόν σοί ἐστιν
  choice: Es ist besser für dich
  rationale: Im durch ἤ gebildeten Vergleich hat καλόν hier idiomatisch komparativen Sinn.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ins Leben einzugehen
  rationale: Die Formulierung bewahrt den matthäischen Ausdruck und ergänzt nicht ausdrücklich „ewig“, da im Griechischen nur „Leben“ steht.
- source_word: κυλλὸν
  choice: verstümmelt
  rationale: Das Wort bezeichnet hier den Zustand nach dem Verlust beziehungsweise der Verstümmelung eines Gliedes und passt unmittelbar zum vorausgehenden Abhauen der Hand.
- source_word: χωλόν
  choice: lahm
  rationale: Dies ist die direkte und im Zusammenhang mit Fuß oder Bein passende deutsche Entsprechung.
- source_word: ἔχοντα
  choice: mit
  rationale: Die deutsche Präpositionalfügung gibt das Partizip idiomatisch wieder, ohne den Gegensatz abzuschwächen.
- source_word: βληθῆναι
  choice: geworfen zu werden
  rationale: Die passive Form und die Gewalt des Verbs βάλλω bleiben ausdrücklich erhalten.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: das ewige Feuer
  rationale: Im Gerichtskontext ist „ewig“ die natürliche Wiedergabe von αἰώνιος; die bestimmte Form des Ausdrucks bleibt erhalten.
theological_decisions:
- issue: Ob σκανδαλίζει ausdrücklich als Verführung zur Sünde oder bildhaft wiederzugeben ist
  choice: dich zu Fall bringt
  alternative: dich zur Sünde verführt
  rationale: Das griechische Stolper- und Fallbild bleibt im Haupttext erhalten; die moralische Deutung wird nicht bestritten, aber auch nicht an die Stelle des Bildes gesetzt.
- issue: Bedeutung von „Leben“ in εἰς τὴν ζωὴν
  choice: Leben
  alternative: ewiges Leben
  rationale: Der Zusammenhang ist eschatologisch, doch der Ausgangstext sagt an dieser Stelle lediglich „Leben“. Der Kontrast mit dem ewigen Feuer trägt die weitergehende Bedeutung.
- issue: Einordnung der Aufforderung zur Verstümmelung
  choice: Die drastische Aufforderung wird ohne Abschwächung übersetzt.
  alternative: Eine erklärende Umschreibung als bildhafter Aufruf zu radikaler Umkehr
  rationale: Die Übersetzung soll weder im Haupttext entscheiden, ob die Aussage hyperbolisch ist, noch ihre Schärfe durch eine Deutung ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst drastischer Bildsprache. Das pluralische Pronomen „sie“ nimmt die mit „oder“ verbundenen möglichen Körperteile gemeinsam auf und vermeidet eine einseitige Genusangleichung an nur eines der beiden Substantive.
