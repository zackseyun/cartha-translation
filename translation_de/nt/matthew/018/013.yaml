  terminology: „Amen, ich sage euch“, „freut sich über“, „mehr als“ und „sich verirrt haben“ sind angemessen. „Das eine“ bewahrt die im griechischen Kontext implizierte Bezugnahme auf das einzelne Schaf, ohne „Schaf“ hier unnötig zu wiederholen.
