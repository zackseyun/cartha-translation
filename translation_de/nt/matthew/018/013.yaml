  source_fidelity: 'Die Übersetzung gibt Satzanschluss, Bedingung, Bekräftigungsformel, Freude und den echten Vergleich mit μᾶλλον ἢ im Wesentlichen treffend wieder. „Tatsächlich“ ist jedoch keine angemessene Wiedergabe der kontingenten Wendung ἐὰν γένηται εὑρεῖν αὐτό: Es bekräftigt im Deutschen eher die Wirklichkeit des Fundes, statt dessen mögliches Eintreten auszudrücken.'
