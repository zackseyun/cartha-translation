source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: de
  text: 'Und wenn er es findet[a], Amen, ich sage euch: Er freut sich über das eine mehr als über die neunundneunzig, die sich nicht verirrt haben[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wenn es geschieht, dass er es findet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die nicht vom Weg abgekommen sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss bewahrt den fortlaufenden Gedankengang des Gleichnisses.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: wenn er es tatsächlich findet
  rationale: Die Wendung mit ἐὰν, γένηται und Infinitiv bezeichnet ein bedingtes Eintreten. „Tatsächlich“ lässt diesen Kontingenz- und Erfolgsaspekt im natürlichen Deutschen anklingen, ohne ein bloß zufälliges Finden zu behaupten.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: amen, ich sage euch
  rationale: „Amen“ gibt das semitisch geprägte ἀμήν unmittelbar wieder; die ganze Wendung bewahrt die feierliche Bekräftigungsformel Jesu.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: er freut sich über dieses eine
  rationale: „Sich freuen über“ ist die natürliche deutsche Wiedergabe. „Dieses eine“ nimmt das einzelne Schaf aus dem Kontext auf, ohne das im Griechischen hier nicht wiederholte Substantiv ausdrücklich einzusetzen.
- source_word: μᾶλλον ἢ
  choice: mehr als
  rationale: Die echte Vergleichsform wird direkt wiedergegeben und nicht zu einem ausschließenden „anstatt“ verschärft.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: die neunundneunzig
  rationale: Wie im Griechischen bleibt „Schafe“ unausgesprochen, da der Bezug aus dem unmittelbaren Kontext eindeutig ist.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: die sich nicht verirrt haben
  rationale: Das Perfektpartizip beschreibt die neunundneunzig als solche, die nicht vom Weg abgekommen sind. Die reflexive Form ist im deutschen Bild von Schafen natürlich und bewahrt den resultativen Sinn.
theological_decisions:
- issue: Aussagekraft des Vergleichs über die Freude des Hirten
  choice: Der Hirte freut sich über das wiedergefundene eine Schaf mehr als über die neunundneunzig, die sich nicht verirrt haben.
  alternative: Den Vergleich abschwächen, damit er weder eine Bevorzugung noch einen geringeren Wert der neunundneunzig anzudeuten scheint.
  rationale: μᾶλλον ἢ formuliert einen wirklichen Vergleich. Die Übersetzung erhält diese Spannung, ohne daraus mangelnde Fürsorge für die neunundneunzig oder einen Unterschied ihres Wertes abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die traditionelle Bekräftigungsformel wird quellennah als „amen, ich sage euch“ wiedergegeben; Satzbau und Wortwahl bleiben ansonsten natürlich und gegenwärtig.
