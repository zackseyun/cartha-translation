source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: de
  text: Hört er aber nicht[a], dann nimm noch einen oder zwei mit, damit jede Sache durch die Aussage von zwei oder drei Zeugen bestätigt wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist hier ein Hören, das dem Gesagten Beachtung schenkt, nicht bloß akustisches Hören.
    reason: lexical_alternative
  - marker: b
    text: 'Anspielung auf 5. Mose 19,15. Wörtlicher lautet die Wendung: „auf den Mund von zwei oder drei Zeugen hin“.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: auf dich hört
  rationale: Im Zusammenhang der Zurechtweisung meint ἀκούω nicht nur akustisches Hören, sondern auf jemanden hören und sich dem Gesagten öffnen. Die deutsche Wendung bewahrt diesen Sinn natürlich.
- source_word: παράλαβε μετὰ σοῦ
  choice: nimm … mit
  rationale: Die knappe deutsche Aufforderung gibt sowohl den Imperativ παράλαβε als auch die Begleitung durch μετὰ σοῦ idiomatisch wieder.
- source_word: ἔτι ἕνα ἢ δύο
  choice: noch einen oder zwei
  rationale: ἔτι bezeichnet hier zusätzliche Personen. Das deutsche „noch“ hält diesen Zusatz fest, ohne die Personen näher zu bestimmen als der griechische Text.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: durch die Aussage von zwei oder drei Zeugen
  rationale: Die semitisch-rechtliche Wendung bedeutet, dass eine Angelegenheit auf der Zeugenaussage zweier oder dreier Personen beruht. „Aussage“ vermittelt den juristischen Sinn in verständlichem modernem Deutsch; die wörtliche Bildsprache wird in der Fußnote genannt.
- source_word: σταθῇ
  choice: bestätigt wird
  rationale: Das passive σταθῇ bedeutet in diesem rechtlichen Zusammenhang, dass eine Sache Bestand erhält bzw. als gültig festgestellt wird. „Bestätigt wird“ ist klar und wahrt die rechtliche Funktion.
- source_word: πᾶν ῥῆμα
  choice: jede Sache
  rationale: ῥῆμα kann wörtlich „Wort“ oder „Aussage“ heißen, bezeichnet in der zugrunde liegenden Rechtsformel jedoch die jeweils zu klärende Angelegenheit. „Jede Sache“ lässt den Umfang offen und verengt ihn nicht auf eine Anklage.
theological_decisions:
- issue: Alttestamentliche Zeugenregel im Zusammenhang der Gemeindezucht
  choice: Die Rechtsformel wird verständlich als Bestätigung jeder Sache durch zwei oder drei Zeugen wiedergegeben.
  alternative: 'Formaler: „damit auf den Mund zweier oder dreier Zeugen hin jedes Wort Bestand hat“.'
  rationale: Der Vers greift 5. Mose 19,15 auf und überträgt dessen Zeugenprinzip auf die Zurechtweisung in der Gemeinschaft. Die Übersetzung bewahrt den rechtlichen Charakter, ohne festzulegen, ob die Zeugen nur den ursprünglichen Vorfall oder auch das anschließende Gespräch bezeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Aufforderungsstruktur. Die juristische Anspielung bleibt erkennbar, während die für heutige Leser ungewohnte Wendung „auf den Mund … hin“ in die Fußnote verlegt wird.
