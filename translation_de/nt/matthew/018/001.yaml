id: MAT.18.1
reference: Matthew 18:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: de
  text: 'In jener Stunde kamen die Jünger zu Jesus und fragten: »Wer ist denn größer im Himmelreich?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: In jener Stunde
  rationale: Gibt die griechische Zeitangabe eng und zugleich in natürlichem, würdigem Deutsch wieder.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: kamen ... zu Jesus
  rationale: Natürliche deutsche Wiedergabe der Bewegung auf Jesus zu.
- source_word: λέγοντες
  choice: und fragten
  rationale: Die folgende direkte Rede ist grammatisch eine Frage; im Deutschen ist »fragten« natürlicher als das wörtliche »sagten«.
- source_word: Τίς ἄρα μείζων ἐστὶν
  choice: Wer ist denn größer
  rationale: Bewahrt den Komparativ μείζων als »größer« und gibt ἄρα mit dem folgernden beziehungsweise nachdrücklichen »denn« wieder, ohne zum Superlativ »der Größte« umzudeuten.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: im Himmelreich
  rationale: »Himmelreich« ist eine geläufige, knappe deutsche Wiedergabe der matthäischen Wendung »Königsherrschaft/das Reich der Himmel«.
theological_decisions:
- issue: Komparativ oder Superlativ bei μείζων
  choice: größer
  alternative: der Größte
  rationale: Der griechische Text hat formal den Komparativ μείζων. Die Übersetzung erhält diese auffällige Form und die damit verbundene mögliche Spannung, statt sie stillschweigend als idiomatischen Superlativ aufzulösen.
- issue: Wiedergabe von βασιλεία τῶν οὐρανῶν
  choice: Himmelreich
  alternative: Königsherrschaft der Himmel / Reich der Himmel
  rationale: »Himmelreich« ist im modernen Standarddeutsch verständlich und wahrt den etablierten matthäischen Ausdruck, ohne eine konfessionelle Sonderdeutung einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Frage ist idiomatisch formuliert; der ungewöhnliche Komparativ des Ausgangstextes bleibt bewusst erhalten.
