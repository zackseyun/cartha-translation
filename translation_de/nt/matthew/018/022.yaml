source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: de
  text: 'Jesus sagt ihm: »Ich sage dir: nicht bis zu siebenmal, sondern bis zu siebenundsiebzigmal[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »siebzigmal sieben«.'
    reason: Alternative Deutung der mehrdeutigen griechischen Zahlenverbindung ἑβδομηκοντάκις ἑπτά.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagt zu ihm
  rationale: Das historische Präsens des griechischen Erzähltexts wird beibehalten. Das Pronomen bleibt entsprechend dem Ausgangstext stehen, statt durch »Petrus« ersetzt zu werden.
- source_word: Οὐ λέγω σοι
  choice: 'Ich sage dir: nicht'
  rationale: Die Formulierung gibt Verb und Dativpronomen direkt wieder; der Doppelpunkt sorgt im Deutschen für eine natürliche Gegenüberstellung der beiden Zahlenangaben.
- source_word: ἕως ἑπτάκις
  choice: bis zu siebenmal
  rationale: Im Zusammenhang mit einer Anzahl bezeichnet ἕως eine Obergrenze; »bis zu« und das Adverb »siebenmal« sind im heutigen Deutsch klar und idiomatisch.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung ist »sondern« im Deutschen die natürliche adversative Verbindung und bildet den griechischen Kontrast präzise ab.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: bis zu siebenundsiebzigmal
  rationale: Die griechische Zahlenverbindung kann als »siebenundsiebzigmal« verstanden werden. Da auch »siebzigmal sieben« sprachlich und traditionsgeschichtlich möglich ist, wird diese Alternative in einer Fußnote bewahrt.
theological_decisions:
- issue: Mehrdeutige Zahlenangabe in Jesu Lehre über Vergebung
  choice: siebenundsiebzigmal
  alternative: siebzigmal sieben
  rationale: Die syntaktisch mehrdeutige Wendung ἑβδομηκοντάκις ἑπτά wird im Haupttext als »siebenundsiebzigmal« wiedergegeben; die andere verbreitete Deutung steht in der Fußnote. So wird die textliche Spannung erhalten, ohne die Aussage durch eine erklärende Auslegung auf eine bestimmte rechnerische oder symbolische Bedeutung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das historische Präsens und die knappe, pointierte Gegenüberstellung des griechischen Textes bleiben erhalten.
