  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: de
  text: Und sein Herr wurde zornig und übergab ihn den Folterern[a], bis er alles zurückgezahlt hat, was er schuldete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Peinigern. Das griechische Wort bezeichnet Menschen, die andere quälen oder foltern, nicht lediglich gewöhnliche Gefängniswärter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: wurde zornig
  rationale: Das adverbial gebrauchte Aoristpartizip bezeichnet die der Übergabe vorausgehende beziehungsweise sie motivierende Zornesreaktion. Die finite Form ist im Deutschen natürlich und bewahrt den Zusammenhang.
- source_word: κύριος
  choice: Herr
  rationale: Im Gleichnis bezeichnet das Wort den Herrn des Knechtes. Das deutsche „Herr“ passt zu diesem Verhältnis und bewahrt zugleich die im griechischen κύριος vorhandene sprachliche Offenheit, ohne ausdrücklich einen christologischen Titel einzutragen.
- source_word: παρέδωκεν
  choice: übergab
  rationale: „Übergab“ gibt die Überstellung in die Gewalt anderer knapp und mit dem passenden gerichtlichen Beiklang wieder.
- source_word: βασανισταῖς
  choice: Folterern
  rationale: βασανιστής bezeichnet jemanden, der quält oder foltert, nicht bloß einen gewöhnlichen Gefängniswärter. „Folterer“ ist modern, verständlich und erhält die Härte der Aussage.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die einfache temporale Konjunktion gibt die griechische Wendung im Deutschen vollständig und natürlich wieder.
- source_word: ἀποδῷ
  choice: zurückgezahlt hätte
  rationale: Der Aorist Konjunktiv nach ἕως οὗ bezeichnet den erwarteten Endpunkt. Der deutsche Konjunktiv II aus der Perspektive der vergangenen Erzählung erhält diesen prospektiven Sinn; „zurückzahlen“ passt zum Schuldzusammenhang.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: alles …, was er schuldete
  rationale: Diese Formulierung bildet den substantivierten Partizipialausdruck eng und idiomatisch ab, ohne ihn unnötig auf einen bestimmten Begriff für Geldschuld zu verengen.
theological_decisions:
- issue: Bedeutung von κύριος innerhalb des Gleichnisses
  choice: Herr
  alternative: 'Gebieter; als Titel: Herr'
  rationale: Gemeint ist zunächst der menschliche Herr des Knechtes innerhalb der Erzählung. „Herr“ gibt diese Ebene natürlich wieder und lässt die theologische Resonanz des Gleichnisses bestehen, ohne die Figur im Wortlaut ausdrücklich mit Gott oder Christus gleichzusetzen.
- issue: Härte von βασανισταῖς im Gerichtsbild
  choice: Folterer
  alternative: 'Peiniger; schwächer: Gefängniswärter'
  rationale: Die stärkere Wiedergabe entspricht der lexikalischen Bedeutung und erhält die ernste Spannung des Gerichtsbildes. Sie entscheidet dabei nicht über weitergehende Fragen zu Art oder Dauer des endzeitlichen Gerichts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und folgt dem Erzählfluss des griechischen Textes; veraltete Ausdrücke wie „Folterknechte“ werden vermieden.
