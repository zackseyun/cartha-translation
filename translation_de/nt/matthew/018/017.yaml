id: MAT.18.17
reference: Matthew 18:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: de
  text: Wenn er aber nicht auf sie hört, sag es der Gemeinde[a]. Wenn er auch auf die Gemeinde nicht hört, soll er für dich wie ein Nichtjude und ein Zolleinnehmer sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Versammlung; auch: Kirche. Das griechische Wort ekklēsia bezeichnet hier die versammelte Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: nicht auf … hört
  rationale: Im Zusammenhang bezeichnet παρακούω nicht bloß ein akustisches Nichtverstehen, sondern die Weigerung, auf jemanden zu hören. Die deutsche Wendung gibt diesen Sinn natürlich wieder, ohne das stärkere »ungehorsam sein« einzutragen.
- source_word: εἰπὸν
  choice: sag es
  rationale: 'Der Aoristimperativ leitet den nächsten Schritt ein: Die Angelegenheit soll der Gemeinde mitgeteilt werden. Das aus dem Zusammenhang ergänzte »es« entspricht natürlichem Deutsch.'
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: Gemeinde
  rationale: ἐκκλησία bezeichnet hier die versammelte Gemeinschaft. »Gemeinde« ist im heutigen Deutsch verständlich und vermeidet sowohl die ungewohnte Abstraktheit von »Versammlung« als auch mögliche institutionelle Nebenbedeutungen von »Kirche«.
- source_word: ἔστω σοι
  choice: soll er für dich … sein
  rationale: Diese Formulierung bewahrt den imperativischen Sinn und gibt den singularischen Dativ σοι ausdrücklich mit »für dich« wieder.
- source_word: ὥσπερ
  choice: wie
  rationale: »Wie« gibt den Vergleich schlicht und idiomatisch wieder.
- source_word: ὁ ἐθνικὸς
  choice: ein Nichtjude
  rationale: ἐθνικός bezeichnet im jüdischen Kontext einen Menschen außerhalb des jüdischen Bundesvolkes. »Nichtjude« ist präzise und im modernen Deutsch weniger missverständlich als »Heide«; der unbestimmte Artikel gibt die im Griechischen repräsentativ gebrauchte Kategorie natürlich wieder.
- source_word: ὁ τελώνης
  choice: ein Zolleinnehmer
  rationale: τελώνης bezeichnet einen Einnehmer von Abgaben beziehungsweise Zöllen. »Zolleinnehmer« ist die etablierte, verständliche Wiedergabe; der unbestimmte Artikel entspricht im deutschen Vergleich der repräsentativen Kategorie.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία in der matthäischen Anweisung zur Zurechtweisung
  choice: Gemeinde
  alternative: Versammlung oder Kirche
  rationale: »Gemeinde« bezeichnet die konkrete Gemeinschaft, ohne eine spätere konfessionelle Kirchenordnung in den Vers hineinzulesen. Die lexikalisch nähere Alternative »Versammlung« und die traditionelle Wiedergabe »Kirche« werden in der Fußnote offengehalten.
- issue: Bedeutung des Vergleichs mit dem Nichtjuden und dem Zolleinnehmer
  choice: soll er für dich wie ein Nichtjude und ein Zolleinnehmer sein
  alternative: Behandle ihn wie einen Nichtjuden und einen Zolleinnehmer
  rationale: Die gewählte Fassung bewahrt das Gleichnisartige und den singularischen Bezug »für dich«. Sie formuliert nicht ausdrücklich eine umfassende Verfahrensregel oder eine bestimmte Lehre vom Gemeindeausschluss, die der Wortlaut selbst nicht weiter ausführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung »nicht auf … hört« bildet die Wiederholung von παρακούσῃ ab. »Nichtjude« vermeidet die heute teils abwertend oder rein religionsbezogen verstandene Bezeichnung »Heide«.
