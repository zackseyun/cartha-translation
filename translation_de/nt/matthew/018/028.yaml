id: MAT.18.28
reference: Matthew 18:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: de
  text: 'Als jener Sklave aber hinausging, traf er einen seiner Mitsklaven, der ihm hundert Denare[a] schuldete. Er packte ihn und würgte ihn mit den Worten: »Zahl zurück, was immer du schuldest!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar entsprach ungefähr dem üblichen Tageslohn eines Arbeiters oder Soldaten.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »Zahl zurück, wenn du etwas schuldest.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Die Bezeichnung wahrt den rechtlich und sozial unfreien Status, der für die Macht- und Schuldverhältnisse des Gleichnisses bedeutsam ist.
- source_word: ἐξελθὼν δὲ
  choice: Als ... aber hinausging
  rationale: Gibt das Aoristpartizip mit seinem zeitlichen Verhältnis und δέ als natürlichen deutschen Erzählübergang wieder.
- source_word: συνδούλων
  choice: Mitsklaven
  rationale: Bewahrt die σύν-Komponente und entspricht der Wiedergabe von δοῦλος mit »Sklave«.
- source_word: ὤφειλεν
  choice: schuldete
  rationale: Bezeichnet die konkrete finanzielle Schuld in natürlichem Deutsch.
- source_word: ἑκατὸν δηνάρια
  choice: hundert Denare
  rationale: Behält die historische Währung bei und wahrt dadurch den Größenvergleich mit der vorausgehenden Schuld.
- source_word: κρατήσας
  choice: packte ihn
  rationale: Drückt den gewaltsamen körperlichen Zugriff knapp und idiomatisch aus.
- source_word: ἔπνιγεν
  choice: würgte ihn
  rationale: Das Imperfekt bezeichnet die andauernde gewaltsame Handlung; »würgte« ist im Deutschen direkt und natürlich.
- source_word: Ἀπόδος
  choice: Zahl zurück
  rationale: Gibt den scharfen Aoristimperativ im Zusammenhang einer Geldschuld angemessen wieder.
- source_word: εἴ τι ὀφείλεις
  choice: was immer du schuldest
  rationale: Bewahrt die indefinite Aussage von εἴ τι in idiomatischem Deutsch, ohne sie zu einer bestimmten, referenziellen Formulierung zu verengen.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gleichnis
  choice: Sklave / Mitsklave
  alternative: Diener / Mitdiener; Knecht / Mitknecht
  rationale: Der unfreie Status und die Zwangsgewalt sind in dieser Szene ausdrücklich relevant. »Sklave« bildet diese soziale Wirklichkeit deutlicher ab als die weicheren Alternativen, ohne eine konfessionelle Deutung einzutragen.
- issue: Indefinite Formulierung εἴ τι ὀφείλεις
  choice: was immer du schuldest
  alternative: wenn du etwas schuldest; was du schuldest
  rationale: Die Hauptfassung erhält den offenen, indefiniten Charakter der Forderung. Die formal wörtlichere konditionale Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bedrohlich; die historische Währungsbezeichnung wird durch eine Kulturfußnote erläutert.
