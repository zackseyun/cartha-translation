id: MAT.18.5
reference: Matthew 18:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: de
  text: Und wer ein solches Kind in meinem Namen aufnimmt, nimmt mich auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch „willkommen heißen“ oder „annehmen“ bedeuten. Wörtlich steht hier „ein solches Kind“; das Adjektiv „klein“ kommt in diesem Vers nicht vor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: wer
  rationale: Das verallgemeinernde Relativgefüge wird im Deutschen natürlich mit „wer“ wiedergegeben und behält den generischen Sinn bei.
- source_word: δέξηται / δέχεται
  choice: aufnimmt / nimmt … auf
  rationale: „Aufnehmen“ kann hier sowohl das Empfangen als auch das Willkommenheißen ausdrücken. Die Wiederholung desselben Verbs bewahrt die enge Entsprechung zwischen der Aufnahme des Kindes und der Aufnahme Jesu.
- source_word: ἓν παιδίον τοιοῦτο
  choice: ein solches Kind
  rationale: Die Formulierung gibt die Einzahl und den rückverweisenden Charakter von τοιοῦτο wieder. παιδίον bezeichnet ein Kind; ein zusätzliches Adjektiv wie „klein“ steht in diesem Vers nicht.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die geläufige deutsche Wendung lässt offen, ob besonders der Bezug auf Jesu Namen, seine Autorität oder die Zugehörigkeit zu ihm im Vordergrund steht.
- source_word: ἐμὲ
  choice: mich
  rationale: Das betonte griechische Pronomen wird idiomatisch mit „mich“ wiedergegeben; die Wiederholung des Verbs hebt die Identifikation bereits deutlich hervor.
theological_decisions:
- issue: Repräsentative Identifikation des Kindes mit Jesus
  choice: Wer ein solches Kind in Jesu Namen aufnimmt, nimmt Jesus selbst auf.
  alternative: Die Handlung lediglich als eine Form der Ehrung Jesu zu umschreiben.
  rationale: Der griechische Text verwendet in beiden Satzteilen dasselbe Verb und wechselt das Objekt unmittelbar vom Kind zu Jesus. Die starke Identifikation bleibt erhalten, ohne zusätzliche sakramentale oder kirchliche Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufnehmen“ ist natürlich und bewahrt zugleich die für den Vers entscheidende Wiederholung. Die Fußnote bündelt die beiden knappen lexikalischen Hinweise, ohne den Haupttext zu überladen.
