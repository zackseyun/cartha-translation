review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt die generische Konstruktion ὃς ἐὰν mit „wer“ treffend wieder. „Ein solches Kind“ wahrt Einzahl und Rückbezug von ἓν παιδίον τοιοῦτο, ohne das nicht im griechischen Text stehende „klein“ hinzuzufügen. Die zweimalige Wiedergabe von δέχομαι durch „aufnimmt / nimmt ... auf“ erhält die im Ausgangstext zentrale verbale Entsprechung. „In meinem Namen“ gibt ἐπὶ τῷ ὀνόματί μου idiomatisch wieder, ohne dessen genaue Nuance unzulässig einzuengen.
  naturalness: „Und wer ein solches Kind in meinem Namen aufnimmt, nimmt mich auf“ ist flüssiges, modernes Standarddeutsch und besitzt einen angemessen würdigen biblischen Registerton. Die Satzstellung ist klar; die Wiederholung von „aufnimmt“ ist stilistisch und semantisch begründet.
  terminology: „Kind“, „in meinem Namen“ und „aufnehmen“ sind sachgerecht. „Aufnehmen“ deckt den Kontext von δέχομαι gut ab und bewahrt die direkte Identifikation des aufgenommenen Kindes mit Jesus. Die Fußnote nennt tragfähige lexikalische Alternativen und erläutert korrekt das Fehlen von „klein“.
