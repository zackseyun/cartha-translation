id: MAT.18.9
reference: Matthew 18:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: de
  text: Und wenn dein Auge dich zu Fall bringt[a], reiß es heraus und wirf es von dir. Es ist besser für dich, mit nur einem Auge in das Leben einzugehen, als mit zwei Augen in die Gehenna des Feuers[b] geworfen zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dich zur Sünde verleitet«. Das griechische Verb kann bedeuten, jemanden zum Stolpern, zu Fall oder zum Sündigen zu bringen.'
    reason: lexical_alternative
  - marker: b
    text: »Gehenna« bezeichnet den Ort des endgültigen Gerichts; traditionell wird das Wort mit »Hölle« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: bringt dich zu Fall
  rationale: Die Wendung bewahrt das Bild des Stolperns und Fallens, das im Kontext zugleich zum Sündigen führen kann, ohne die Bedeutung vorschnell darauf zu verengen.
- source_word: ἔξελε
  choice: reiß es heraus
  rationale: Der nachdrückliche Aoristimperativ und das drastische Bild werden in natürlichem, kräftigem Deutsch wiedergegeben.
- source_word: βάλε ἀπὸ σοῦ
  choice: wirf es von dir
  rationale: Die Formulierung bezeichnet eine entschlossene, vollständige Entfernung und bleibt nahe an der räumlichen Bildsprache des Griechischen.
- source_word: καλόν σοί ἐστιν
  choice: es ist besser für dich
  rationale: Im Vergleich mit dem folgenden ἤ hat καλόν idiomatisch den Sinn des Vorzuziehenden oder Besseren.
- source_word: μονόφθαλμον
  choice: mit nur einem Auge
  rationale: Dies gibt das Adjektiv μονόφθαλμος in flüssigem modernem Deutsch wieder; »nur« verdeutlicht den Gegensatz zu den zwei Augen, ohne den Sinn zu verändern.
- source_word: εἰς τὴν ζωὴν
  choice: in das Leben
  rationale: Die Übersetzung fügt »ewig« nicht hinzu und erhält so die knappe, eschatologisch offene Formulierung des Ausgangstextes.
- source_word: βληθῆναι
  choice: geworfen zu werden
  rationale: Die passive Infinitivform wird direkt und in gegenwärtigem Deutsch wiedergegeben.
- source_word: γέενναν
  choice: Gehenna
  rationale: Der spezifische jüdisch-eschatologische Ausdruck wird als Eigenbegriff bewahrt und nicht ohne Kennzeichnung mit dem breiteren deutschen Begriff »Hölle« gleichgesetzt.
- source_word: τοῦ πυρός
  choice: des Feuers
  rationale: Der Genitiv wird formal bewahrt; »Gehenna des Feuers« erhält die markante Bildsprache des griechischen Textes.
theological_decisions:
- issue: Wiedergabe von γέεννα
  choice: Gehenna
  alternative: Hölle
  rationale: Der Ausgangstext verwendet den besonderen Begriff γέεννα. Seine Beibehaltung wahrt die historischen und eschatologischen Bezüge und vermeidet eine vorschnelle Gleichsetzung mit späteren umfassenderen Vorstellungen von »Hölle«.
- issue: Wiedergabe von εἰς τὴν ζωὴν
  choice: in das Leben
  alternative: in das ewige Leben
  rationale: Obwohl die Wendung im Kontext eschatologisches Leben bezeichnet, steht das Adjektiv »ewig« nicht im griechischen Text. Die knappe Form bewahrt dessen Wortlaut und Spannung.
- issue: Drastische Aufforderung zum Herausreißen des Auges
  choice: Bildsprache ohne abschwächende Auslegung wiedergeben
  alternative: paraphrasierend als Beseitigung von Sündenanlässen wiedergeben
  rationale: Der Text formuliert bewusst drastisch. Die Übersetzung soll diese Schärfe erhalten und die Frage nach der rhetorischen beziehungsweise hyperbolischen Funktion nicht im Haupttext entscheiden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die drastischen Imperative bleiben erhalten; zugleich werden traditionelle, heute weniger natürliche Wendungen vermieden. Die Satzstruktur folgt dem griechischen Vergleich, ohne im Deutschen unnötig schwerfällig zu wirken.
