source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: de
  text: 'Er antwortete: „Habt ihr nicht gelesen, dass der, der von Anfang an schuf, sie männlich und weiblich machte?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Er antwortete
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine geläufige griechische, semitisch geprägte Ausdrucksweise. Im natürlichen Deutschen gibt „Er antwortete“ den Sinn vollständig wieder.
- source_word: Οὐκ ἀνέγνωτε
  choice: Habt ihr nicht gelesen
  rationale: Die Perfektform ist im Deutschen eine natürliche, eindringliche Frage nach der Kenntnis des weiterhin maßgeblichen Schrifttextes.
- source_word: ὁ κτίσας
  choice: der, der … erschuf
  rationale: Die substantivierte Partizipialform wird transparent wiedergegeben, ohne sie stärker deutend zum Titel „der Schöpfer“ zu verdichten.
- source_word: ἀπ’ ἀρχῆς
  choice: von Anfang an
  rationale: Die Wendung bewahrt den Anklang an den Schöpfungsbericht und steht so, dass sie sich wie im Griechischen auf das Erschaffen beziehen kann.
- source_word: ἄρσεν καὶ θῆλυ
  choice: männlich und weiblich
  rationale: Diese Wiedergabe entspricht eng der griechischen Formulierung und bewahrt den Wortlaut sowie den schöpfungstheologischen Bezug von Genesis 1,27.
- source_word: ἐποίησεν αὐτούς
  choice: machte sie
  rationale: „Machte“ unterscheidet ἐποίησεν von dem zuvor mit „erschuf“ wiedergegebenen κτίσας und vermeidet eine im Griechischen nicht vorhandene Wiederholung desselben deutschen Verbs.
theological_decisions:
- issue: Wiedergabe der Schöpfungsaussage in ihrem Bezug auf Genesis 1,27
  choice: männlich und weiblich
  alternative: als Mann und Frau
  rationale: Die gewählte Formulierung folgt der griechischen Wortwahl unmittelbar und bewahrt den Bezug auf die Schöpfungserzählung, ohne über die Aussage des Verses hinausgehende Folgerungen einzutragen.
- issue: Bezug von ἀπ’ ἀρχῆς
  choice: „von Anfang an“ wird in die Relativkonstruktion zu „erschuf“ gestellt
  alternative: „von Anfang an“ als Einleitung der gesamten Inhaltserklärung
  rationale: Die Wortstellung lässt den im Griechischen naheliegenden Bezug auf das Schöpfungshandeln erkennen, ohne den umfassenderen zeitlichen Sinn auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „ihr“ entspricht dem Plural des griechischen Verbs. Die bewusst schriftnahe Wendung „männlich und weiblich machte“ erhält den Genesis-Anklang und die beiden unterschiedlichen griechischen Verben, auch wenn sie weniger idiomatisch ist als eine freie Paraphrase.
