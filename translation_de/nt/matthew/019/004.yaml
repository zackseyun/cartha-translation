  to: 'Er antwortete: „Habt ihr nicht gelesen, dass der, der von Anfang an schuf, sie männlich und weiblich machte?“'
  rationale: Die Umstellung lässt „von Anfang an“ weiterhin das Schöpfungshandeln bestimmen, weist „sie“ eindeutig dem abschließenden „machte“ zu und bewahrt zugleich die im Griechischen vorhandene Unterscheidung zwischen dem Schaffen und dem Machen. Die nicht notwendige Fußnote wird entfernt.
