  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: de
  text: 'Jesus aber sagte zu ihnen: „Amen, ich sage euch: Ihr, die ihr mir gefolgt seid, werdet in der Erneuerung[a], wenn der Menschensohn auf dem Thron seiner Herrlichkeit sitzt, ebenfalls auf zwölf Thronen sitzen und die zwölf Stämme Israels richten[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „in der Wiedergeburt“, „in der neuen Welt“ oder „in der Neuschöpfung“. Gemeint ist hier wahrscheinlich die künftige Erneuerung im Zusammenhang mit der Herrschaft des Menschensohnes, nicht die Wiedergeburt eines einzelnen Menschen.'
    reason: lexical_alternative
  - marker: b
    text: „Richten“ kann hier auch den Sinn von „herrschen“ oder „Regierungsgewalt ausüben“ einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Amen
  rationale: Die im Deutschen geläufige feierliche Bekräftigungsformel bewahrt den semitischen Klang und die autoritative Einleitung des Ausspruchs.
- source_word: ἀκολουθήσαντές μοι
  choice: die ihr mir gefolgt seid
  rationale: Das substantivisch gebrauchte Aoristpartizip kennzeichnet die Angesprochenen durch ihr Nachfolgen; das Perfekt ist im modernen Deutsch natürlich und hält den Bezug auf Jesus ausdrücklich fest.
- source_word: ἐν τῇ παλιγγενεσίᾳ
  choice: bei der Erneuerung
  rationale: „Erneuerung“ wahrt die Bedeutung von Wiederentstehung beziehungsweise Neuschöpfung, ohne die im Kontext naheliegende endzeitliche Dimension durch einen erklärenden Zusatz in den Haupttext einzuschränken. „Bei“ gibt die zeitlich-situative Funktion von ἐν idiomatisch wieder.
- source_word: ὅταν καθίσῃ
  choice: wenn … sitzt
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet hier ein zukünftiges Geschehen; im deutschen temporalen Nebensatz ist das Präsens idiomatisch.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt den Titel und seine Resonanz mit Daniel 7.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: auf dem Thron seiner Herrlichkeit
  rationale: Die formnahe Genitivkonstruktion erhält den feierlichen Ton und lässt offen, ob die Herrlichkeit den Thron kennzeichnet oder dem Menschensohn zugeordnet ist.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: werdet … ebenfalls … sitzen
  rationale: „Ebenfalls“ gibt καί wieder und hebt die Entsprechung zum Sitzen des Menschensohnes hervor.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: auf zwölf Thronen
  rationale: Direkte und natürliche Wiedergabe der lokalen Konstruktion.
- source_word: κρίνοντες
  choice: richten
  rationale: „Richten“ ist die unmittelbarste Wiedergabe und bewahrt zugleich die mögliche Verbindung von Rechtsprechung und Herrschaftsausübung.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: die zwölf Stämme Israels
  rationale: Konventionelle, präzise Wiedergabe der israelitischen Stammesbezeichnung.
theological_decisions:
- issue: Bedeutung von παλιγγενεσία
  choice: die künftige Erneuerung im Zusammenhang mit der Thronbesteigung des Menschensohnes
  alternative: individuelle Wiedergeburt; neue Welt; neues Zeitalter
  rationale: Thronbesteigung und Gericht weisen im unmittelbaren Zusammenhang auf ein künftiges, umfassendes Geschehen. Der Haupttext bleibt mit „Erneuerung“ knapp und vermeidet die Festlegung auf ein bestimmtes endzeitliches System.
- issue: Bedeutungsumfang von κρίνοντες
  choice: richten
  alternative: herrschen; regieren
  rationale: Das Verb bezeichnet unmittelbar das Richten, kann im biblischen Zusammenhang aber auch Herrschaftsausübung einschließen. Der Haupttext wahrt den engeren Wortlaut; die Fußnote nennt die weitere Nuance.
- issue: Bezug von ἐν τῇ παλιγγενεσίᾳ
  choice: zeitlich-situativer Rahmen der verheißenen Thronstellung
  alternative: enger Anschluss ausschließlich an das Nachfolgen
  rationale: Die Wortstellung erlaubt eine gewisse syntaktische Spannung. Inhaltlich kennzeichnet die Erneuerung den Zeitpunkt beziehungsweise Rahmen, in dem der Menschensohn und die Nachfolger auf Thronen sitzen; die Übersetzung lässt diesen Zusammenhang erkennbar, ohne ihn dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Amen, ich sage euch“ bewahrt Jesu feierliche Ausspruchsformel; „Thron seiner Herrlichkeit“ erhält die erhöhte Ausdrucksweise des griechischen Textes. Die Satzstellung bleibt quellenah, ist aber durch die Einfügung des temporalen Nebensatzes im Deutschen gut lesbar.
