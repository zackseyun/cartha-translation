  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: de
  text: 'Er aber sagte zu ihnen: »Nicht alle können diese Aussage[a] annehmen, sondern nur die, denen es gegeben ist[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieses Wort«, »dieser Spruch« oder »diese Lehre«.'
    reason: lexical_alternative
  - marker: b
    text: Mit »es gegeben ist« ist wahrscheinlich Gott als Geber gemeint; im Griechischen wird der Handelnde jedoch nicht ausdrücklich genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: sagte
  rationale: Die gewöhnliche erzählende Wiedergabe des Aorists von λέγω; sie bleibt neutral und natürlich.
- source_word: Οὐ πάντες
  choice: Nicht alle
  rationale: Gibt die verneinte Gesamtheit knapp und idiomatisch wieder, ohne zu behaupten, niemand könne die Aussage annehmen.
- source_word: χωροῦσι
  choice: können … annehmen
  rationale: χωρέω bedeutet wörtlich, Raum zu haben oder zu schaffen; mit λόγος bezeichnet es hier, einer Aussage innerlich Raum zu geben, sie also anzunehmen. Die deutsche Formulierung wahrt zugleich die im Kontext vorausgesetzte Befähigung.
- source_word: τὸν λόγον τοῦτον
  choice: diese Aussage
  rationale: λόγος verweist hier auf das unmittelbar zuvor Gesagte. »Aussage« ist im heutigen Deutsch klarer als das mögliche, aber missverständliche »Wort«.
- source_word: ἀλλ’ οἷς
  choice: sondern nur die, denen
  rationale: »Nur« macht die einschränkende Gegenüberstellung der ἀλλά-Konstruktion im Deutschen natürlich deutlich.
- source_word: δέδοται
  choice: es gegeben ist
  rationale: Die passive Perfektform bezeichnet etwas Gewährtes, dessen Wirkung fortbesteht. Das unpersönliche Passiv bewahrt, dass der Geber im Griechischen nicht ausdrücklich genannt wird.
theological_decisions:
- issue: Wer im Passiv δέδοται als Geber vorausgesetzt ist
  choice: Der Geber wird im Haupttext nicht ausdrücklich genannt.
  alternative: »sondern nur die, denen Gott es gegeben hat«
  rationale: Ein göttliches Passiv ist wahrscheinlich, doch der griechische Text nennt Gott nicht ausdrücklich. Die passive Form erhält diese theologische Offenheit.
- issue: Worauf sich »diese Aussage« bezieht
  choice: Der Bezug auf Jesu vorausgehende Aussage bleibt wie im Griechischen kontextabhängig.
  alternative: Eine ausdrückliche Festlegung auf Ehelosigkeit oder auf die Lehre von der Ehe
  rationale: Der Vers selbst benennt den genauen Umfang des λόγος nicht. Eine Präzisierung würde die im Text bestehende Deutungsspannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Aussage annehmen« ist allgemein verständlich und gibt das bildhafte χωρέω sinngemäß wieder; die passive Schlussform bleibt bewusst erhalten.
