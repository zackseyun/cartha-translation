  variant: modern standard German
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: de
  text: 'Noch einmal sage ich euch: Eher geht ein Kamel[b] durch ein Nadelöhr[a], als dass ein Reicher in das Reich Gottes hineinkommt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: durch die Öffnung einer Nähnadel.'
    reason: lexical_clarification
  - marker: b
    text: Manche haben statt „Kamel“ die Bedeutung „Seil“ vorgeschlagen; im griechischen Text steht hier jedoch „Kamel“.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: Noch einmal sage ich euch
  rationale: πάλιν bezeichnet die Wiederholung; δέ ist hier ein schwaches Bindewort und muss im natürlichen Deutschen nicht eigens wiedergegeben werden. Die feierliche, aber verständliche Wendung bewahrt die direkte Anrede.
- source_word: εὐκοπώτερόν ἐστιν
  choice: Eher
  rationale: Im deutschen Vergleich mit zwei Infinitivkonstruktionen gibt „eher … als“ die komparative Aussage natürlich und prägnant wieder.
- source_word: κάμηλον
  choice: ein Kamel
  rationale: Der griechische Text bietet κάμηλον, eindeutig „Kamel“. Die gelegentlich vorgeschlagene Deutung „Seil“ wird vom vorliegenden Ausgangstext nicht gestützt.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: durch ein Nadelöhr
  rationale: Die Wortgruppe bezeichnet die Öffnung einer Nähnadel. „Nadelöhr“ ist die genaue und geläufige deutsche Entsprechung.
- source_word: εἰσελθεῖν
  choice: geht … durch / hineinkommt
  rationale: Dasselbe griechische Verb steht in beiden Vergleichsteilen. Wegen der unterschiedlichen Ergänzungen verlangt natürliches Deutsch im ersten Teil „durchgehen“ und im zweiten „hineinkommen“; die gemeinsame Grundvorstellung des Eintretens bleibt erhalten.
- source_word: ἢ πλούσιον
  choice: als dass ein Reicher
  rationale: πλούσιον bezeichnet hier substantivisch einen reichen Menschen. „Ein Reicher“ bewahrt die grammatische Form und klingt im Deutschen natürlich.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: in das Reich Gottes hineinkommt
  rationale: „Reich Gottes“ ist die sachgerechte feste Wiedergabe von βασιλεία τοῦ θεοῦ. „in … hineinkommt“ bringt die von εἰς bezeichnete Bewegung zum Ziel klar zum Ausdruck.
theological_decisions:
- issue: Deutung des Bildes vom Kamel und Nadelöhr
  choice: Das drastische Unmöglichkeitsbild wird unverändert bewahrt.
  alternative: Das Nadelöhr als angebliches Jerusalemer Tor deuten oder „Kamel“ durch „Seil“ ersetzen.
  rationale: Der griechische Text bietet ein Kamel und die Öffnung einer Nähnadel. Eine Abschwächung oder Allegorisierung ist textlich nicht begründet und würde die Spannung des Ausspruchs vorzeitig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die vergleichende Konstruktion „Eher … als dass“ hält das Bild knapp und eindringlich; „hineinkommt“ ist natürlicher als das formellere „eintritt“, ohne den Sinn abzuschwächen.
