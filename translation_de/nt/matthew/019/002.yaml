  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, καὶ ἐθεράπευσεν αὐτοὺς ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: de
  text: Und große Menschenmengen folgten ihm, und er heilte sie dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: folgten
  rationale: Der Aorist von ἀκολουθέω bezeichnet hier im erzählenden Zusammenhang das konkrete Folgen; „folgten“ ist die natürliche und sachlich genaue deutsche Wiedergabe.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das von ἀκολουθέω abhängige Dativpronomen wird entsprechend der deutschen Rektion mit „ihm“ wiedergegeben.
- source_word: ὄχλοι πολλοί
  choice: viele Menschen
  rationale: Wörtlich steht „viele Volksmengen“. „Viele Menschen“ gibt die gemeinte große Zahl von Leuten in natürlichem modernem Deutsch wieder, ohne die im Deutschen sperrige Pluralform „Menschenmengen“ zu verwenden.
- source_word: ἐθεράπευσεν
  choice: er heilte
  rationale: θεραπεύω bezeichnet in diesem Evangelienkontext das Heilen; „heilte“ ist die klare, übliche Wiedergabe.
- source_word: αὐτούς
  choice: sie
  rationale: Das Akkusativpronomen verweist auf die zuvor genannten Menschen und wird direkt mit „sie“ wiedergegeben.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb wird schlicht und genau mit „dort“ wiedergegeben.
- source_word: καὶ ... καὶ
  choice: Und ... und
  rationale: Die Wiederholung von „und“ bewahrt den parataktischen Erzählfluss des griechischen Textes, ohne das Verhältnis der Handlungen näher auszudeuten.
