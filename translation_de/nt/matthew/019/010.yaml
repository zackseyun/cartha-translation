source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: de
  text: 'Seine Jünger sagten zu ihm: »Wenn es sich mit einem Mann und seiner Frau so verhält,[a] ist es nicht von Vorteil zu heiraten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wenn dies der Fall eines Mannes mit seiner Frau ist«. Der griechische Ausdruck ist knapp; αἰτία kann hier die Lage, die Sache oder den Fall bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: sagten zu ihm
  rationale: Das griechische Präsens ist hier als historisches Präsens zu verstehen; im natürlichen deutschen Erzählstil steht das Präteritum.
- source_word: οἱ μαθηταί
  choice: seine Jünger
  rationale: »Jünger« ist der etablierte und sachlich passende Ausdruck für Jesu Schüler und Nachfolger; das Possessivpronomen ergibt sich im Deutschen natürlich aus dem Bezug auf Jesus.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Wenn es so ... steht
  rationale: Die idiomatische Wendung gibt die knappe griechische Formulierung wieder, ohne αἰτία vorschnell ausschließlich als Ursache oder Rechtsfall festzulegen.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: um den Mann und seine Frau
  rationale: Der Kontext verlangt bei γυνή die Bedeutung »Frau« im Sinn von Ehefrau. Die männlich-weibliche Bezogenheit des Ausgangstextes bleibt erhalten.
- source_word: οὐ συμφέρει
  choice: ist es nicht von Vorteil
  rationale: Die Formulierung bewahrt den Nutzen- beziehungsweise Vorteilssinn von συμφέρει und klingt zugleich in modernem Deutsch natürlich.
- source_word: γαμῆσαι
  choice: zu heiraten
  rationale: Der Infinitiv wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung in ἀνθρώπου ... γυναικός
  choice: der Mann und seine Frau
  alternative: ein Mensch und sein Ehepartner
  rationale: Der unmittelbare Zusammenhang behandelt die Ehe ausdrücklich in der Beziehung von Mann und Frau; diese Rahmung wird nicht neutralisiert.
- issue: Bewertung des Heiratens durch οὐ συμφέρει
  choice: nicht von Vorteil
  alternative: nicht ratsam
  rationale: »Nicht von Vorteil« wahrt den Nutzenaspekt des griechischen Verbs und vermeidet es, die Aussage zu einer ausdrücklichen Empfehlung oder moralischen Weisung zu verstärken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Redeform bleibt knapp und zugespitzt; die Mehrdeutigkeit von αἰτία wird im Haupttext idiomatisch und in der Fußnote ausdrücklich bewahrt.
