review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die historische Vergangenheitsform, die Jünger, die eheliche Mann-Frau-Beziehung und den Vorteilssinn von οὐ συμφέρει grundsätzlich zutreffend wieder. Die Wendung »Wenn es so um den Mann und seine Frau steht« verschiebt jedoch αἰτία unnötig in Richtung einer bloßen Lage des Mannes und bindet die Konstruktion im Deutschen weniger klar an die Beziehung beider Ehepartner.
  naturalness: »Wenn es sich mit einem Mann und seiner Frau so verhält« ist modernes, idiomatisches Standarddeutsch und bildet die knappe, auf die zuvor behandelte Ehesituation zurückweisende Bedingung klarer ab. »Es ist nicht von Vorteil zu heiraten« bleibt sachlich und natürlich.
  terminology: »Jünger«, »Mann«, »Frau« (im ehelichen Sinn) und »heiraten« sind passend. Die Fußnote sollte μετὰ nicht mit »gegenüber« wiedergeben, da dies eine Gegenüberstellung statt des neutralen »mit« nahelegt.
  issues:
  - severity: medium
    issue: Die Haupttextwendung »Wenn es so um den Mann und seine Frau steht« ist semantisch und syntaktisch weniger präzise.
    rationale: Die griechische Aussage betrifft die »Sache/den Fall« eines Mannes mit seiner Frau. Die deutsche Wendung kann vor allem die persönliche Lage des Mannes bezeichnen. »Wenn es sich mit einem Mann und seiner Frau so verhält« bewahrt den relationalen Bezug und bleibt idiomatisch.
  - severity: low
    issue: Die Fußnotenalternative verwendet »gegenüber seiner Frau«.
    rationale: μετὰ τῆς γυναικός bedeutet hier »mit seiner Frau«, nicht »gegenüber seiner Frau«. Letzteres kann einen Gegensatz oder eine Konfrontation suggerieren.
  revised_text: 'Seine Jünger sagten zu ihm: »Wenn es sich mit einem Mann und seiner Frau so verhält,[a] ist es nicht von Vorteil zu heiraten.«'
  revised_footnotes:
