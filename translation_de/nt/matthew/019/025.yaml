  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: de
  text: 'Als die Jünger das hörten, waren sie sehr erstaunt und fragten: „Wer kann dann gerettet werden?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Als ... das hörten
  rationale: Der Aoristpartizip bezeichnet den vorausgehenden Umstand. Ein temporaler Nebensatz ist im Deutschen natürlich; „das“ nimmt Jesu unmittelbar vorhergehende Aussage auf.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ führt die Erzählung mit leichter Weiterführung beziehungsweise Kontrastierung fort. Der deutsche temporale Satz stellt den Übergang bereits natürlich her.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: „Jünger“ ist die etablierte und kontextuell genaue Bezeichnung für die Schüler und Nachfolger Jesu.
- source_word: ἐξεπλήσσοντο
  choice: waren ... bestürzt
  rationale: Das Imperfekt beschreibt ihre anhaltende Reaktion. Im Zusammenhang bezeichnet das Verb nicht nur Staunen, sondern eine erschütterte Überraschung über die Folgerung aus Jesu Aussage.
- source_word: σφόδρα
  choice: zutiefst
  rationale: Das Adverb verstärkt die Reaktion erheblich. „Zutiefst bestürzt“ ist natürliches, gegenwärtiges Deutsch und bewahrt die starke Intensität.
- source_word: λέγοντες
  choice: und fragten
  rationale: Das Partizip begleitender Rede wird idiomatisch als finites Verb wiedergegeben. Da die folgende Äußerung eine direkte Frage ist, gibt „fragten“ die Sprechhandlung präzise wieder.
- source_word: Τίς
  choice: Wer
  rationale: Das Fragepronomen bezieht sich auf eine Person und wird direkt mit „Wer“ wiedergegeben.
- source_word: ἄρα
  choice: dann
  rationale: Die Partikel kennzeichnet eine Folgerung aus Jesu voriger Aussage und zugleich das überraschte Nachfragen der Jünger.
- source_word: δύναται
  choice: kann
  rationale: Das Verb bezeichnet Möglichkeit beziehungsweise Fähigkeit; „kann“ ist die direkte und idiomatische deutsche Entsprechung.
- source_word: σωθῆναι
  choice: gerettet werden
  rationale: Der passive Infinitiv wird formal bewahrt. Im Kontext von Gottes Reich trägt „gerettet werden“ das umfassende heilsgeschichtliche Gewicht, ohne den Handelnden oder die Weise der Rettung im Vers ausdrücklich festzulegen.
theological_decisions:
- issue: Bedeutung von σωθῆναι im Kontext
  choice: gerettet werden
  alternative: befreit werden; errettet werden
  rationale: Die Frage steht im Zusammenhang mit dem Eingehen in das Himmelreich und meint daher umfassende Rettung, nicht lediglich Befreiung aus einer zeitlichen Gefahr. „Gerettet werden“ bewahrt zugleich das Passiv und vermeidet eine konfessionelle Ausdeutung des Vorgangs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zutiefst bestürzt“ vermittelt stärker als bloßes „erstaunt“ die erschütterte Reaktion, ohne altertümlich zu wirken. Keine Fußnoten erforderlich.
