source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: de
  text: Denn es gibt Eunuchen, die so aus dem Mutterleib geboren wurden, und es gibt Eunuchen, die von Menschen zu Eunuchen gemacht wurden, und es gibt Eunuchen, die sich selbst um des Himmelreichs willen zu Eunuchen gemacht haben.[a] Wer das annehmen kann, soll es annehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, ausdrücklich: »die sich selbst kastriert haben«. Viele verstehen die Wendung bildlich als freiwilligen Verzicht auf die Ehe um des Himmelreichs willen.'
    reason: Bewahrt die offene Frage, ob die Aussage wörtlich, übertreibend oder bildlich gemeint ist, ohne die explizitere Formulierung als abweichende Bedeutung darzustellen.
  - marker: b
    text: 'Oder: »Wer dies aufnehmen kann, nehme es auf.«'
    reason: Gibt die formellere lexikalische Alternative für χωρεῖν wieder.
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: Eunuchen
  rationale: Der Begriff bezeichnet Eunuchen und wird in allen drei Satzteilen einheitlich wiedergegeben. So bleibt die auffällige Wiederholung erhalten, ohne die dritte Gruppe bereits deutend als »Ehelose« zu bezeichnen.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: von Mutterleib an so geboren wurden
  rationale: Die geläufige deutsche Wendung bewahrt das anschauliche Bild des griechischen Ausdrucks und gibt οὕτως natürlich mit »so« wieder.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: von Menschen zu Eunuchen gemacht wurden
  rationale: Diese Formulierung erhält die Wortverbindung zu »Eunuchen« und ist weniger verengend als das anatomisch ausdrückliche »kastriert wurden«.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: sich selbst … zu Eunuchen gemacht haben
  rationale: Die direkte Formulierung bewahrt die provokante Offenheit des griechischen Wortlauts, statt vorschnell zwischen wörtlicher Selbstkastration und bildlich verstandener Ehelosigkeit zu entscheiden.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: um des Reiches der Himmel willen
  rationale: Die Wendung bringt Beweggrund beziehungsweise Zweck von διά mit Akkusativ zum Ausdruck und bewahrt zugleich die matthäische Formulierung im Plural »der Himmel«.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Wer das annehmen kann, soll es annehmen
  rationale: »Annehmen« gibt χωρέω hier idiomatisch als Aufnehmen beziehungsweise Akzeptieren einer anspruchsvollen Aussage wieder; »soll« vermittelt den auffordernden Imperativ in natürlichem Deutsch.
theological_decisions:
- issue: Ob εὐνούχισαν ἑαυτοὺς wörtlich oder bildlich zu verstehen ist
  choice: Die konkrete Wendung »sich selbst zu Eunuchen gemacht haben« bleibt im Haupttext stehen.
  alternative: »sich selbst kastriert haben« oder »um des Reiches willen auf die Ehe verzichtet haben«
  rationale: Der Vers erklärt nicht ausdrücklich, ob die Aussage wörtlich, übertreibend oder bildlich auf freiwillige Ehelosigkeit bezogen ist. Die Übersetzung bewahrt diese Spannung; die Fußnote nennt die wesentlichen Verständnismöglichkeiten.
- issue: Bedeutung von χωρεῖν in der abschließenden Aufforderung
  choice: »annehmen«
  alternative: »aufnehmen« oder wörtlicher »dafür Raum haben«
  rationale: »Annehmen« vermittelt im heutigen Deutsch verständlich die Bereitschaft, diese schwierige Aussage aufzunehmen, ohne den Satz auf bloß intellektuelles Verstehen zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von »Eunuchen« und »zu Eunuchen gemacht« bildet die Struktur und Wortwahl des griechischen Textes ab. »Reich der Himmel« bewahrt den matthäischen Plural, während »um … willen« gehoben, aber weiterhin allgemein verständlich ist.
