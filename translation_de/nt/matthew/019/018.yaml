  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: de
  text: 'Er fragte ihn: „Welche?“ Jesus antwortete: „Diese: Du sollst nicht morden, du sollst nicht die Ehe brechen, du sollst nicht stehlen, du sollst kein falsches Zeugnis ablegen,“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: fragte
  rationale: Das historische Präsens wird im deutschen Erzählstil natürlich als Präteritum wiedergegeben; der Inhalt der direkten Rede macht deutlich, dass hier eine Frage gestellt wird.
- source_word: Ποίας
  choice: Welche?
  rationale: Die feminine Pluralform bezieht sich sinngemäß auf die zuvor genannten Gebote und kann im Deutschen ebenso knapp und idiomatisch wiedergegeben werden.
- source_word: Τὸ
  choice: 'Diese:'
  rationale: Der substantivierende Artikel leitet die folgende Aufzählung ein. „Diese:“ bewahrt die knappe, leicht markierte Einleitung besser als eine ersatzlose Tilgung.
- source_word: Οὐ φονεύσεις
  choice: Du sollst nicht morden
  rationale: „Morden“ gibt φονεύω genauer wieder als das weiter gefasste „töten“ und entspricht dem Verbot vorsätzlicher unrechtmäßiger Tötung.
- source_word: Οὐ μοιχεύσεις
  choice: du sollst nicht die Ehe brechen
  rationale: Die feste deutsche Wendung gibt μοιχεύω klar und allgemeinverständlich wieder.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: du sollst kein falsches Zeugnis ablegen
  rationale: Diese Formulierung bewahrt den rechtlich-zeugenschaftlichen Sinn des Verbs und klingt im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Frage und die formelhafte Sprache der Gebote bleiben erhalten. Das Schlusskomma zeigt, dass Jesu Aufzählung im folgenden Vers weitergeht.
