  source_fidelity: Die Übersetzung gibt die Frage Ποίας knapp und treffend wieder und bewahrt die Abfolge von Frage und Jesu anschließender Antwort. Die vier zitierten Gebote entsprechen dem griechischen Text. „Diese:“ bildet die im Griechischen durch den Artikel markierte Einleitung zur Gebotsreihe in vertretbarer, knapper Form ab.
  naturalness: Modernes Standarddeutsch und ein angemessen würdiger, biblischer Register. „Er fragte ihn“ und „Jesus antwortete“ sind im deutschen Erzählstil idiomatisch. Die Formulierungen der Gebote sind klar und geläufig.
  terminology: „Nicht morden“, „nicht die Ehe brechen“, „nicht stehlen“ und „kein falsches Zeugnis ablegen“ sind sachgerecht. Besonders „falsches Zeugnis“ bewahrt den forensisch-zeugenschaftlichen Sinn von ψευδομαρτυρέω.
