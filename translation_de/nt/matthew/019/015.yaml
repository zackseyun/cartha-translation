  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: de
  text: Und nachdem er ihnen die Hände aufgelegt hatte, ging er von dort weiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die Konjunktion verbindet den Satz schlicht mit dem vorausgehenden Geschehen, ohne eine zusätzliche Folgerung oder zeitliche Nuance einzutragen.
- source_word: ἐπιθεὶς
  choice: nachdem er … aufgelegt hatte
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die der Handlung des Hauptverbs vorausgeht. Der deutsche Nebensatz gibt diese Abfolge natürlich und genau wieder.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: ihnen die Hände
  rationale: Die Verbindung mit ἐπιτίθημι bezeichnet das Auflegen der Hände auf Personen. Die deutsche Konstruktion „jemandem die Hände auflegen“ gibt den Dativ αὐτοῖς idiomatisch wieder; ein Possessivpronomen ist im Deutschen nicht nötig.
- source_word: ἐπορεύθη
  choice: ging … weiter
  rationale: πορεύομαι bedeutet gehen, sich auf den Weg machen oder weiterziehen. „ging … weiter“ passt zum erzählerischen Zusammenhang und bleibt in modernem Deutsch natürlich.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Das Ortsadverb bezeichnet den Ausgangspunkt einer Bewegung und wird direkt und idiomatisch mit „von dort“ wiedergegeben.
theological_decisions:
- issue: Bedeutung der Handauflegung Jesu
  choice: Die konkrete körperliche Handlung wird ausdrücklich als „die Hände aufgelegt“ wiedergegeben.
  alternative: Eine deutende Wiedergabe wie „segnete er sie“.
  rationale: Der griechische Text nennt ausdrücklich das Auflegen der Hände. Der Zusammenhang legt zwar einen Segen nahe, doch die Übersetzung ersetzt die genannte Handlung nicht durch ihre erschlossene Bedeutung und trägt weder sakramentale noch ordinatorische Vorstellungen ein.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die finite Nebensatzkonstruktion bildet das griechische Partizip natürlich ab; der Satz benötigt keine Fußnote, da keine für die Übersetzung wesentliche Mehrdeutigkeit verloren geht.
