id: MAT.19.26
reference: Matthew 19:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: de
  text: 'Jesus sah sie an und sagte zu ihnen: »Für Menschen ist das unmöglich, aber für Gott ist alles möglich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: sah sie an
  rationale: Das Aoristpartizip bezeichnet den gezielten Blick auf die Jünger. »Sah sie an« ist natürliches modernes Deutsch und überzeichnet die Intensität nicht.
- source_word: δὲ
  choice: und
  rationale: δέ markiert hier eine leichte Fortführung mit möglichem Kontrast. Im Deutschen verbindet »und« den Blick Jesu flüssig mit seiner Antwort; der entscheidende Gegensatz wird innerhalb des Ausspruchs ausdrücklich durch »aber« wiedergegeben.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Das ausdrückliche αὐτοῖς wird zur Transparenz und narrativen Klarheit beibehalten.
- source_word: παρὰ ἀνθρώποις
  choice: für Menschen
  rationale: παρά mit Dativ bezeichnet hier den Bereich beziehungsweise die Seite, auf der etwas möglich oder unmöglich ist. »Für Menschen« gibt den generischen Sinn von ἀνθρώποις inklusiv und idiomatisch wieder.
- source_word: τοῦτο
  choice: das
  rationale: Das Demonstrativpronomen verweist auf den unmittelbar zuvor besprochenen Sachverhalt. Im Deutschen ist rückverweisendes »das« natürlicher als »dies«.
- source_word: ἀδύνατόν ἐστιν
  choice: ist unmöglich
  rationale: Direkte und idiomatische Wiedergabe des prädikativen Adjektivs mit Kopula.
- source_word: παρὰ δὲ θεῷ
  choice: aber für Gott
  rationale: Die parallele Konstruktion παρά mit Dativ wird entsprechend wiederholt. »Aber für Gott« bewahrt den rhetorischen Gegensatz zu den Menschen.
- source_word: πάντα δυνατά
  choice: ist alles möglich
  rationale: »Alles« gibt das substantivierte πάντα natürlich wieder; das singularische Verb entspricht der deutschen Grammatik und erhält die umfassende Aussage.
theological_decisions:
- issue: Generischer Sinn von ἀνθρώποις
  choice: Menschen
  alternative: Männer
  rationale: Obwohl die griechische Form grammatisch maskulin ist, bezeichnet sie hier die Menschheit allgemein. »Menschen« bewahrt diesen Umfang ohne eine sachlich nicht gemeinte Beschränkung auf männliche Personen.
- issue: Umfang von πάντα δυνατά
  choice: alles ist möglich
  alternative: alle Dinge sind möglich
  rationale: Die umfassende Formulierung bleibt ohne dogmatische Einschränkung oder Ausdeutung stehen. Der Kontext betrifft menschlich unmögliche Rettung; die Übersetzung selbst fügt jedoch keine erklärende Begrenzung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, knapper Satzstruktur. Die direkte Rede behält den ausgewogenen Gegensatz zwischen menschlicher Unmöglichkeit und Gottes Möglichkeit bei.
