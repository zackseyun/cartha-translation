source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: de
  text: 'Sie sagten zu ihm: „Warum hat Mose dann geboten, ihr eine Scheidungsurkunde zu geben und sie fortzuschicken[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sich von ihr zu scheiden“. Das griechische Verb kann „fortschicken“ bedeuten und bezeichnet hier im Zusammenhang die Scheidung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Sie sagten zu ihm
  rationale: Das historische Präsens wird für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben.
- source_word: Τί οὖν
  choice: Warum ... dann
  rationale: Τί hat hier im Einwand begründende beziehungsweise argumentative Kraft; die Formulierung knüpft an Jesu vorherige Aussage an.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: hat Mose ... geboten
  rationale: ἐντέλλομαι bezeichnet ein Gebot. Die zugespitzte Darstellung der Fragenden bleibt erhalten und wird nicht vorzeitig durch Jesu Erwiderung in Vers 8 abgeschwächt.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: ihr eine Scheidungsurkunde zu geben
  rationale: βιβλίον ἀποστασίου bezeichnet die schriftliche Urkunde zur Scheidung; „Scheidungsurkunde“ ist im heutigen Deutsch klar und rechtlich präzise. Das indirekte Objekt „ihr“ ist im Deutschen idiomatisch aus αὐτήν und dem beschriebenen Vorgang erschließbar, ohne ein im Griechischen nicht vorhandenes „uns“ einzufügen.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: und sie fortzuschicken
  rationale: Die Formulierung bewahrt das konkrete Bild von ἀπολύω; im Zusammenhang bezeichnet das Verb zugleich die Entlassung beziehungsweise Scheidung der Ehefrau.
theological_decisions:
- issue: Ob die Formulierung der Fragenden bereits an Jesu Richtigstellung im folgenden Vers angeglichen werden soll
  choice: „geboten“ im Haupttext beibehalten
  alternative: „erlaubt“ oder „gestattet“
  rationale: Der griechische Text verwendet ausdrücklich ἐνετείλατο („gebot“). Die Übersetzung bewahrt die Darstellung der Fragenden, statt Jesu Unterscheidung zwischen Gebot und Zugeständnis aus Vers 8 vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frage bleibt als zugespitzter Einwand formuliert; „Scheidungsurkunde“ vermittelt den rechtlichen Bezug verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
