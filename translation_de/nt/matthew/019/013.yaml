  source_fidelity: Die Übersetzung gibt die Erzählabfolge (Τότε), das Passiv von προσηνέχθησαν, den Finalsatz sowie die beiden Handlungen Jesu sachgerecht wieder. »Ihnen die Hände auflegte« entspricht der griechischen Wendung τὰς χεῖρας ἐπιθῇ αὐτοῖς. »Betete« ergänzt kein im Griechischen nicht ausgedrücktes Objekt. Das abschließende »sie« bewahrt die Mehrdeutigkeit von αὐτοῖς.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch mit angemessen würdigem biblischem Register. Die Abfolge »damit er ihnen die Hände auflegte und betete« ist in einer vergangen erzählten Zielhandlung idiomatisch und verständlich.
  terminology: »Kinder«, »die Hände auflegen«, »Jünger« und »zurechtweisen« sind treffend und registergerecht. »Doch« gibt den kontrastierenden Übergang mit δέ gut wieder. »Zurechtweisen« vermittelt die tadelnde Kraft von ἐπετίμησαν ohne unnötige Verschärfung.
