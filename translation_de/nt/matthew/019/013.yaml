id: MAT.19.13
reference: Matthew 19:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: de
  text: Dann wurden Kinder zu ihm gebracht, damit er ihnen die Hände auflegte und betete; doch die Jünger wiesen sie zurecht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das letzte »sie« kann sich entweder auf die Kinder oder auf diejenigen beziehen, die sie brachten.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Kennzeichnet knapp und natürlich die zeitliche Abfolge der Erzählung.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: wurden Kinder zu ihm gebracht
  rationale: Bewahrt das Passiv und gibt προσφέρω in diesem Zusammenhang in natürlichem modernem Deutsch wieder.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: damit er ihnen die Hände auflegte
  rationale: Gibt den Finalsatz und die ausdrückliche Mehrzahl »Hände« wieder; »jemandem die Hände auflegen« ist die natürliche deutsche Wendung.
- source_word: καὶ προσεύξηται
  choice: und betete
  rationale: Das deutsche Präteritum fügt sich nach »damit« natürlich an »auflegte« an. Ein Objekt wie »für sie« wird nicht ergänzt, da es im Griechischen nicht ausdrücklich steht.
- source_word: οἱ δὲ μαθηταὶ
  choice: doch die Jünger
  rationale: »Doch« bringt den milden, aber deutlichen Gegensatz von δέ idiomatisch zum Ausdruck.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: wiesen sie zurecht
  rationale: Gibt die tadelnde Bedeutung von ἐπιτιμάω in verständlichem, würdigem Gegenwartsdeutsch wieder und bewahrt durch »sie« den unbestimmten Bezug des Pronomens.
theological_decisions:
- issue: Bezugswort des letzten αὐτοῖς
  choice: sie
  alternative: die Kinder; diejenigen, die sie brachten
  rationale: Das griechische Pronomen kann sich grammatisch auf die Kinder oder auf die bringenden Personen beziehen. Die Übersetzung entscheidet diese echte Mehrdeutigkeit nicht im Haupttext.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Erzählfluss, ohne unnatürlich zu wirken.
