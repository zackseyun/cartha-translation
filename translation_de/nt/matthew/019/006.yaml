id: MAT.19.6
reference: Matthew 19:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: de
  text: So sind sie nicht mehr zwei, sondern ein Fleisch. Was nun Gott zusammengefügt hat, soll kein Mensch trennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: So
  rationale: Leitet die Folge aus der vorausgehenden Aussage ein und klingt im modernen Deutschen natürlich.
- source_word: οὐκέτι εἰσὶν δύο
  choice: sind sie nicht mehr zwei
  rationale: Gibt die zeitliche Verneinung und den Kontrast zur nun bestehenden Einheit klar wieder; das Subjekt wird aus dem Kontext ergänzt.
- source_word: σὰρξ μία
  choice: ein Fleisch
  rationale: Bewahrt bewusst die geprägte Formulierung und den Rückbezug auf die Schöpfungserzählung, statt sie erklärend als „ein Leib“ aufzulösen.
- source_word: ὃ οὖν
  choice: Was nun
  rationale: Das substantivische Relativpronomen bezeichnet die von Gott geschaffene Verbindung; „nun“ erhält die folgernde Kraft von οὖν ohne unnötige Schwere.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte und natürliche Wiedergabe des Subjekts.
- source_word: συνέζευξεν
  choice: zusammengefügt hat
  rationale: Gibt das Verb für das Verbinden beziehungsweise Zusammenjochen idiomatisch wieder und lässt die vollzogene Handlung in ihrer gegenwärtigen Bedeutung erkennen.
- source_word: ἄνθρωπος
  choice: kein Mensch
  rationale: 'Im verneinten deutschen Satz gibt „kein Mensch“ den generischen Singular präzise und inklusiv wieder: Kein menschliches Wesen darf diese Verbindung trennen.'
- source_word: μὴ χωριζέτω
  choice: soll … trennen
  rationale: Gibt den verneinten Imperativ als klare, würdige Untersagung wieder. Das trennbare Verb umschließt dabei idiomatisch das Subjekt.
theological_decisions:
- issue: Generische Bedeutung von ἄνθρωπος im Verbot
  choice: „kein Mensch“
  alternative: „der Mensch“ oder „niemand“
  rationale: ἄνθρωπος bezeichnet hier nicht speziell einen Mann, sondern jeden Menschen. „Kein Mensch“ wahrt das Nomen und bringt den universalen Geltungsbereich der Untersagung natürlich zum Ausdruck.
- issue: Eheliche Einheit in σὰρξ μία
  choice: „ein Fleisch“
  alternative: „ein Leib“
  rationale: Die wörtlich geprägte Wendung bewahrt den Rückbezug auf Genesis und die theologische Spannung der Aussage, ohne die Art dieser Einheit erklärend einzuengen.
- issue: Akteur und Bestand der Verbindung
  choice: „Was nun Gott zusammengefügt hat“
  alternative: „Diejenigen, die Gott verbunden hat“
  rationale: Das Neutrum ὃ wird formal als „was“ erhalten. So bleibt die Aussage auf das von Gott Zusammengefügte beziehungsweise die entstandene Verbindung bezogen, ohne sie auf eine ergänzte Deutung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die vertraute Wendung „ein Fleisch“ bleibt wegen ihres intertextuellen Gewichts erhalten; sonst wird eine natürliche deutsche Satzführung verwendet.
