id: MAT.19.9
reference: Matthew 19:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: de
  text: 'Ich aber sage euch: Wer sich von seiner Frau scheiden lässt – außer wegen sexueller Unmoral[a] – und eine andere heiratet, begeht Ehebruch; und wer eine geschiedene Frau heiratet, begeht Ehebruch.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „außer aufgrund sexueller Unmoral“. Das griechische Wort kann traditionell auch mit „Unzucht“ wiedergegeben und von manchen enger als „sexuelle Untreue“ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lassen den Satz „und wer eine geschiedene Frau heiratet, begeht Ehebruch“ aus.
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ich aber sage euch
  rationale: Gibt λέγω mit Dativ direkt wieder und bewahrt δέ als milden Gegensatz beziehungsweise Übergang im Zusammenhang.
- source_word: ὃς ἂν
  choice: wer
  rationale: Die Verbindung aus Relativpronomen und ἄν bezeichnet einen allgemeinen, unbestimmten Fall; deutsches „wer“ gibt dies natürlich wieder.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: sich von seiner Frau scheiden lässt
  rationale: ἀπολύω bezeichnet im ehelichen Kontext die Scheidung. Die idiomatische deutsche Wendung vermeidet das heute missverständliche wörtliche „entlässt seine Frau“.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: außer wegen sexueller Unmoral
  rationale: Die Wendung formuliert eine Ausnahme beziehungsweise einen Scheidungsgrund. „Sexuelle Unmoral“ wahrt die Breite von πορνεία, ohne den Ausdruck auf Ehebruch oder vorehelichen Geschlechtsverkehr zu verengen.
- source_word: γαμήσῃ ἄλλην
  choice: eine andere heiratet
  rationale: ἄλλην ist feminin und meint eine andere Frau; dies ist im Deutschen nach „heiratet“ auch ohne Ergänzung eindeutig.
- source_word: μοιχᾶται
  choice: begeht Ehebruch
  rationale: Dies ist die klare, herkömmliche und sachlich genaue deutsche Wiedergabe des Verbs.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: und wer eine geschiedene Frau heiratet, begeht Ehebruch
  rationale: Die substantivierte Partizipialkonstruktion wird als allgemeiner Relativsatz wiedergegeben; das Perfektpassiv ἀπολελυμένην bezeichnet eine Frau, die geschieden worden ist.
theological_decisions:
- issue: Bedeutung von πορνεία in der Ausnahmeklausel
  choice: Breit als „sexuelle Unmoral“ wiedergeben
  alternative: „Unzucht“, „sexuelle Untreue“ oder enger „Ehebruch“
  rationale: πορνεία besitzt einen weiteren Bedeutungsumfang als μοιχεία („Ehebruch“). Die breite Wiedergabe bewahrt die lexikalische Offenheit und entscheidet keine umstrittene konfessionelle Auslegung vorab.
- issue: Aufnahme des Schlusssatzes καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Im Haupttext aufnehmen und durch eine textkritische Fußnote kennzeichnen
  alternative: Den Satz auslassen
  rationale: Der bereitgestellte SBLGNT-Text enthält den Satz, markiert ihn jedoch als textlich umstritten. Daher wird er übersetzt, während die handschriftliche Abweichung transparent vermerkt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch Gedankenstriche lesbar gegliedert. „Sich scheiden lassen“ ist im heutigen Deutsch natürlicher und rechtlich klarer als eine wörtliche Wiedergabe mit „entlassen“.
