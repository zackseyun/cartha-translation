source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: de
  text: 'Er aber sagte zu ihm[a]: »Warum fragst du mich nach dem Guten? Einer ist der Gute[b]. Wenn du aber ins Leben eingehen willst, halte die Gebote.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften sowie die Parallelstellen lauten sinngemäß: »Warum nennst du mich gut? Niemand ist gut außer einem, nämlich Gott.« Der hier zugrunde gelegte SBLGNT-Text des Matthäusevangeliums lautet dagegen: »Warum fragst du mich nach dem Guten? Einer ist der Gute.«'
    reason: textual_variant
  - marker: b
    text: 'Idiomatischer auch: »Nur einer ist gut« oder: »Es gibt einen, der gut ist.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Warum fragst du mich nach dem Guten?
  rationale: Das substantivierte Neutrum τοῦ ἀγαθοῦ bezeichnet hier das Gute beziehungsweise das, was gut ist. »Nach dem Guten« bewahrt sowohl die Abstraktion als auch die sprachliche Verbindung zum folgenden ὁ ἀγαθός, ohne den Wortlaut an Markus oder Lukas anzugleichen.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Einer ist der Gute
  rationale: Die Wiedergabe erhält die auffällige Struktur aus εἷς und dem substantivierten ὁ ἀγαθός sowie den Wechsel vom neutralen »dem Guten« zur persönlichen Bezeichnung »der Gute«. Sie ist im Deutschen markiert, aber verständlich; eine idiomatischere Alternative wird in der Fußnote genannt.
- source_word: εἰ δὲ θέλεις
  choice: Wenn du aber … willst
  rationale: θέλεις bezeichnet Wollen oder Beabsichtigen. Die Stellung von »aber« im deutschen Satz gibt das leicht kontrastierende δέ natürlich wieder.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: ins Leben eingehen
  rationale: Die Formulierung bewahrt die Bewegung in das Leben hinein und lässt den eschatologischen Gehalt stehen, ohne das im Satz nicht ausdrücklich vorhandene Adjektiv »ewig« einzufügen.
- source_word: τήρησον τὰς ἐντολάς
  choice: halte die Gebote
  rationale: Bei Geboten bedeutet τηρέω sachgemäß, sie zu halten beziehungsweise zu befolgen. »Die Gebote halten« ist im modernen Deutschen klar und trägt dem Gewicht von ἐντολάς Rechnung.
theological_decisions:
- issue: Verhältnis der Aussage Jesu zur Güte Gottes und zur Christologie
  choice: Matthäus wird als Frage nach »dem Guten« und mit der Antwort »Einer ist der Gute« übersetzt.
  alternative: 'Angleichung an Markus und Lukas: »Warum nennst du mich gut? Niemand ist gut außer dem einen Gott.«'
  rationale: Der vorliegende SBLGNT-Wortlaut des Matthäusevangeliums unterscheidet sich von den synoptischen Parallelstellen. Die Übersetzung wahrt diese Fassung und deutet sie weder als Leugnung der Güte oder Gottheit Jesu noch als ausdrückliche christologische Selbstaussage aus.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Einer ist der Gute« ist bewusst etwas markiert, um die griechische Form und das Wortspiel zwischen »dem Guten« und »der Gute« sichtbar zu halten. Die Anführungszeichen folgen deutscher Typografie.
