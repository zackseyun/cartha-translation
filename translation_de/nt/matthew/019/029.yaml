id: MAT.19.29
reference: Matthew 19:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: de
  text: Und jeder, der um meines Namens willen Häuser oder Brüder oder Schwestern oder Vater oder Mutter oder Ehefrau oder Kinder oder Äcker verlassen hat, wird das Hundertfache empfangen und das ewige Leben erben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: jeder, der
  rationale: Die Verbindung bezeichnet in distributiver und allgemeiner Weise jeden Menschen, auf den die folgende Bedingung zutrifft.
- source_word: ἀφῆκεν
  choice: verlassen hat
  rationale: Das Perfekt gibt die vollzogene Handlung mit fortdauernder Bedeutung im Deutschen natürlich wieder, ohne sie durch „aufgegeben“ oder „preisgegeben“ stärker auszudeuten.
- source_word: οἰκίας
  choice: Häuser
  rationale: Die konkrete Mehrzahl entspricht dem Griechischen und passt zu den ebenfalls genannten Äckern als wirtschaftlichem Besitz.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: Brüder / Schwestern
  rationale: Da beide Verwandtschaftsbezeichnungen ausdrücklich und getrennt vorkommen, werden sie auch im Deutschen getrennt wiedergegeben.
- source_word: πατέρα / μητέρα
  choice: Vater / Mutter
  rationale: Die singularischen Verwandtschaftsbezeichnungen werden unmittelbar und in der Reihenfolge des Ausgangstextes wiedergegeben.
- source_word: γυναῖκα
  choice: Frau
  rationale: In der Aufzählung enger Familienbeziehungen bezeichnet γυνή hier die Ehefrau. „Frau“ ist im Deutschen in der Verbindung mit dem Possessivgedanken idiomatisch und lässt den ehelichen Sinn im Kontext erkennen.
- source_word: τέκνα
  choice: Kinder
  rationale: Dies ist die natürliche und sachlich genaue deutsche Bezeichnung für Nachkommen in einer Familienliste.
- source_word: ἀγρούς
  choice: Äcker
  rationale: Der Ausdruck bezeichnet landwirtschaftlich genutzte Flächen. „Äcker“ bewahrt den konkreten Besitz- und Erwerbsbezug.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: um meines Namens willen
  rationale: Die Wiedergabe bewahrt das theologisch gewichtige Bild des Namens und bezeichnet die Hingabe an Jesu Person und Autorität, ohne zu „um meinetwillen“ zu vereinfachen.
- source_word: ἑκατονταπλασίονα
  choice: das Hundertfache
  rationale: Die substantivische deutsche Form gibt die quantitative Aussage knapp, verständlich und in einem würdigen Register wieder.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: das ewige Leben erben
  rationale: Die geläufige deutsche Formulierung bewahrt sowohl den Begriff des ewigen Lebens als auch das Erbmotiv des griechischen Verbs.
theological_decisions:
- issue: Bedeutung von γυνή in der Aufzählung des Verlassenen
  choice: Frau im Sinn von Ehefrau
  alternative: Frau im allgemeinen Sinn
  rationale: Der unmittelbare Zusammenhang nennt Familienangehörige und Besitz. Daher ist die eheliche Beziehung gemeint; die Übersetzung vermeidet die sachlich unpassende Vorstellung einer allgemeinen Abkehr von Frauen.
- issue: Wiedergabe von ἕνεκεν τοῦ ὀνόματός μου
  choice: um meines Namens willen
  alternative: um meinetwillen / wegen mir
  rationale: Die ausdrückliche Nennung des Namens bleibt erhalten und damit auch die Verbindung zu Jesu Person, Autorität und bekanntem Bekenntnis, ohne diese Bedeutungsbreite paraphrasierend festzulegen.
- issue: Charakter der hundertfachen Verheißung
  choice: das Hundertfache
  alternative: hundertmal so viel
  rationale: Die Übersetzung bewahrt die kräftige quantitative Aussage, ohne näher festzulegen, in welcher Form oder zu welchem Zeitpunkt sich der verheißene Empfang verwirklicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konjunktion „oder“ erhält den aufzählenden Nachdruck des griechischen Textes. „Um meines Namens willen“ und „das ewige Leben erben“ bewahren die biblischen Leitbegriffe, bleiben aber für heutige Leser verständlich.
