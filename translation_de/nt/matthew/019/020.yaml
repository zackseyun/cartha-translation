  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: de
  text: 'Der junge Mann sagt zu ihm: „Das alles habe ich befolgt. Was fehlt mir noch?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens des griechischen Erzählstils wird beibehalten; es klingt im Deutschen hier natürlich.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ wird nach „sagt“ idiomatisch mit „zu ihm“ wiedergegeben.
- source_word: ὁ νεανίσκος
  choice: der junge Mann
  rationale: νεανίσκος bezeichnet einen jungen Mann; „junger Herrscher“ würde eine Angabe aus der synoptischen Überlieferung in diesen Vers eintragen.
- source_word: Πάντα ταῦτα
  choice: das alles
  rationale: Die Wendung verweist zusammenfassend und im modernen Deutsch natürlich auf die zuvor genannten Gebote.
- source_word: ἐφύλαξα
  choice: habe ich befolgt
  rationale: φυλάσσω bedeutet bei Geboten „befolgen“ oder „halten“. Das deutsche Perfekt gibt die vergangene, bis in die Gegenwart relevante Selbstaussage natürlich wieder.
- source_word: τί ἔτι ὑστερῶ
  choice: Was fehlt mir noch?
  rationale: ὑστερέω bezeichnet ein Fehlen oder Zurückbleiben. Die Formulierung ist knapp, idiomatisch und bewahrt die offene Frage nach einem verbleibenden Mangel.
theological_decisions:
- issue: Selbsteinschätzung des Gehorsams
  choice: Die Behauptung des jungen Mannes wird ohne wertenden Zusatz wiedergegeben.
  alternative: Die Aussage ausdrücklich als irrig oder übertrieben kennzeichnen.
  rationale: Der griechische Text berichtet seine Aussage ohne ausdrückliche Bestätigung, Ironisierung oder Widerlegung. Diese theologische Spannung bleibt der Erzählung überlassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Befolgt“ ist bei Geboten natürlicher als das formal nähere „gehalten“; „Was fehlt mir noch?“ bewahrt die Kürze und Mehrdeutigkeit von τί ἔτι ὑστερῶ.
