source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: de
  text: 'Jesus sagte zu ihm: »Wenn du vollkommen[a] sein willst, geh, verkaufe deinen Besitz und gib den Armen; dann wirst du einen Schatz im Himmel haben. Komm, folge mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vollständig« oder »reif«. Das griechische Wort kann »vollkommen«, »vollständig« oder »reif« bedeuten.'
    reason: Bewahrt die Bedeutungsbreite von τέλειος und verhindert, dass „vollkommen“ vorschnell ausschließlich als sündlose moralische Perfektion verstanden wird.
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: Die schlichte Erzählformel gibt das gewöhnliche griechische Redeverb natürlich wieder, ohne die Art des Sprechens näher zu bestimmen.
- source_word: τέλειος
  choice: vollkommen
  rationale: „Vollkommen“ entspricht dem Bedeutungsfeld von τέλειος und bewahrt sowohl den Gedanken der Vollständigkeit und ungeteilten Hingabe als auch die traditionelle, anspruchsvolle Formulierung.
- source_word: ὕπαγε
  choice: geh
  rationale: Der einfache Imperativ gibt die Aufforderung zum Weggehen knapp und idiomatisch wieder.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: verkaufe deinen Besitz
  rationale: τὰ ὑπάρχοντα bezeichnet das, was jemand besitzt; „deinen Besitz“ ist im Deutschen präzise und natürlich.
- source_word: δὸς πτωχοῖς
  choice: gib den Armen
  rationale: Das substantivierte Adjektiv bezeichnet arme Menschen; die deutsche Wendung ist knapp und idiomatisch.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: So wirst du einen Schatz im Himmel haben
  rationale: Das griechische Futur wird direkt wiedergegeben. Der Singular „im Himmel“ ist die natürliche deutsche Entsprechung des griechischen Plurals in dieser festen religiösen Wendung; „So“ macht die Folgebeziehung verständlich, ohne einen zusätzlichen theologischen Gedanken einzuführen.
- source_word: δεῦρο ἀκολούθει μοι
  choice: komm, folge mir
  rationale: δεῦρο ist ein unmittelbarer Ruf zum Kommen; ἀκολούθει μοι ist die vertraute Aufforderung zur Nachfolge.
theological_decisions:
- issue: Bedeutung von τέλειος im Zusammenhang der Nachfolge
  choice: vollkommen
  alternative: ganz, vollständig oder reif
  rationale: Die Übersetzung lässt den umfassenden Anspruch Jesu stehen, legt ihn aber nicht ausdrücklich als abstrakte Sündlosigkeit aus. Eine Fußnote bewahrt die im Kontext mögliche Nuance ungeteilter beziehungsweise vollständiger Hingabe.
- issue: Schatz „in den Himmeln“
  choice: im Himmel
  alternative: in den Himmeln
  rationale: Der griechische Plural wird im heutigen Standarddeutsch idiomatisch mit dem Singular wiedergegeben. Damit ist keine Entscheidung über eine kosmologische Mehrzahl von Himmeln verbunden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, gut verständlicher Satzführung. Die kurzen Imperative erhalten die Eindringlichkeit der Aufforderung. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Wort.
