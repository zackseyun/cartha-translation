id: MAT.19.1
reference: Matthew 19:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: de
  text: Und als Jesus diese Worte beendet hatte, verließ er Galiläa und kam in das Gebiet von Judäa jenseits des Jordans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf der anderen Seite des Jordans«.'
    reason: Bewahrt eine natürliche alternative Wiedergabe von πέραν und macht deutlich, dass die Wendung die gegenüberliegende Seite des Flusses bezeichnet.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε ἐτέλεσεν
  choice: Und als … beendet hatte
  rationale: Die im Griechischen geläufige Übergangsformel wird im Deutschen natürlich als temporaler Erzählanschluss wiedergegeben; das Plusquamperfekt markiert den Abschluss der Rede vor dem Aufbruch.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Der Ausdruck verweist auf die unmittelbar vorausgehende Rede Jesu; »Worte« ist würdig und verständlich, ohne den Inhalt auf einzelne Sinnsprüche zu verengen.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: verließ er Galiläa
  rationale: μεταίρω bezeichnet hier den Aufbruch beziehungsweise das Weggehen von einem Ort; »verließ« ist im modernen Deutschen natürlicher als eine formellere Umschreibung.
- source_word: ἦλθεν εἰς
  choice: kam in
  rationale: Die Formulierung bewahrt sowohl das Bewegungsverb »kam« als auch die Zielrichtung in ein Gebiet hinein.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: das Gebiet von Judäa
  rationale: ὅρια bezeichnet im Reisebericht das Gebiet oder Territorium, nicht notwendig eine genaue Grenzlinie.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: jenseits des Jordans
  rationale: Die Wendung bezeichnet die andere beziehungsweise gegenüberliegende Seite des Jordans; die Perspektive bleibt wie im Griechischen unausgesprochen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Die griechische Übergangsformel wird nicht mit dem heute altertümlichen »Und es geschah« nachgebildet, sondern idiomatisch in den temporalen Satz integriert.
