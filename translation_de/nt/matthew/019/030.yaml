id: MAT.19.30
reference: Matthew 19:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: de
  text: Doch viele, die Erste sind, werden Letzte sein, und Letzte werden Erste sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und ebenso möglich: „Doch viele Erste werden Letzte sein und Letzte Erste.“ Das Griechische ist auffallend knapp und sprichwortartig.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet eine große, nicht näher bestimmte Gruppe. „Viele“ bleibt knapp und fügt keine ausdrückliche Personenbezeichnung hinzu.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen leichten Gegensatz beziehungsweise eine weiterführende Wendung gegenüber der vorausgehenden Aussage über Lohn und Rang. „Doch“ gibt diesen Zusammenhang in modernem Deutsch natürlich wieder.
- source_word: ἔσονται
  choice: werden … sein
  rationale: Die Zukunftsform von εἰμί wird im modernen Deutsch idiomatisch mit „werden … sein“ wiedergegeben.
- source_word: πρῶτοι
  choice: Erste
  rationale: πρῶτοι bezeichnet hier eine vordere Stellung oder einen Rang, ohne dessen genaue Art festzulegen. Das substantivierte „Erste“ bewahrt diese Offenheit und den Gegensatz zu „Letzte“.
- source_word: ἔσχατοι
  choice: Letzte
  rationale: ἔσχατοι steht als unmittelbarer Gegenbegriff zu πρῶτοι und bezeichnet die hinterste Stellung beziehungsweise den niedrigsten Rang. „Letzte“ erhält die prägnante Antithese.
- source_word: πολλοὶ … πρῶτοι ἔσχατοι
  choice: viele, die Erste sind, werden Letzte sein
  rationale: Der Relativsatz macht die knappe griechische Prädikation im Deutschen verständlich, ohne den sachlichen Umfang der Aussage einzuengen.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: und Letzte werden Erste sein
  rationale: Das im Griechischen nur aus dem ersten Satzteil mitzuverstehende Verb wird im Deutschen wiederholt, damit der Satz natürlich und eindeutig lesbar bleibt.
theological_decisions:
- issue: Art und Umfang der angekündigten Umkehrung
  choice: Die Aussage bleibt eine allgemeine Umkehrung von Stellung oder Rang.
  alternative: Eine ausdrückliche Festlegung auf Rettung, Zugang zum Himmelreich, Lohn der Jünger oder gesellschaftlichen Status.
  rationale: Der Vers benennt nicht ausdrücklich, worauf sich „Erste“ und „Letzte“ beziehen. Die Übersetzung bewahrt daher die sprichwortartige Offenheit und legt keine engere dogmatische Deutung in den Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Großschreibung von „Erste“ und „Letzte“ kennzeichnet den substantivischen Gebrauch. Der Haupttext ergänzt die im Deutschen nötigen Satzglieder für natürliche Verständlichkeit; die Fußnote dokumentiert die markante Kürze des griechischen Wortlauts.
