  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: de
  text: 'Da kamen Pharisäer zu ihm, stellten ihn auf die Probe und fragten: „Ist es einem Mann erlaubt, sich von seiner Frau aus jedem Grund[a] scheiden zu lassen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus irgendeinem Grund“ oder „auf jedem Grund“. Die griechische Wendung formuliert eine weit gefasste Rechtsfrage danach, ob jeder geltend gemachte Grund eine Scheidung rechtfertigen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: kamen zu ihm
  rationale: Das Verb bezeichnet das Herantreten oder Näherkommen zu jemandem. „Kamen zu ihm“ ist natürliches modernes Deutsch und bewahrt die Bewegung auf Jesus zu.
- source_word: πειράζοντες
  choice: stellten ihn auf die Probe
  rationale: πειράζω kann prüfen, versuchen oder in eine Falle locken bedeuten. Die gewählte Formulierung erhält den Grundsinn des Prüfens, ohne die feindselige Absicht stärker auszudeuten, als der Ausdruck selbst verlangt.
- source_word: ἔξεστιν
  choice: ist es … erlaubt
  rationale: In dieser Rechtsfrage bezeichnet ἔξεστιν das Erlaubtsein. „Erlaubt“ ist im Deutschen klar und natürlich und bewahrt den rechtlichen Charakter der Frage.
- source_word: ἀνθρώπῳ
  choice: einem Mann
  rationale: Obwohl ἄνθρωπος auch allgemein „Mensch“ bedeuten kann, bezeichnet der Zusammenhang mit „seiner Frau“ hier konkret einen Mann beziehungsweise Ehemann.
- source_word: ἀπολῦσαι
  choice: sich … von seiner Frau scheiden zu lassen
  rationale: ἀπολύω bedeutet wörtlich entlassen oder wegschicken, ist hier jedoch der übliche Ausdruck für die Auflösung einer Ehe. Die deutsche Wendung gibt den rechtlichen Sinn idiomatisch wieder.
- source_word: γυναῖκα αὐτοῦ
  choice: seiner Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten; das Possessivverhältnis und der Scheidungskontext verlangen hier die Bedeutung „Ehefrau“.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: aus jedem beliebigen Grund
  rationale: Die Wendung stellt weit gefasst die Frage nach möglichen Scheidungsgründen. „Aus jedem beliebigen Grund“ macht den umfassenden Charakter von πᾶσαν deutlich, ohne die damalige Rechtsdebatte vorwegzunehmen.
theological_decisions:
- issue: Die Scheidungsfrage so wiederzugeben, dass die damalige Rechtsdebatte erhalten bleibt, ohne eine spätere konfessionelle Scheidungslehre einzutragen
  choice: Ist es einem Mann erlaubt, sich aus jedem beliebigen Grund von seiner Frau scheiden zu lassen?
  alternative: Darf ein Mann seine Frau aus irgendeinem Grund entlassen?
  rationale: Der Vers formuliert eine Prüf- und Rechtsfrage und gibt noch keine lehrmäßige Antwort. Die Übersetzung bewahrt deshalb sowohl die rechtliche Rahmung als auch die offene Breite der möglichen Scheidungsgründe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Da kamen“ bindet den Satz erzählerisch an den Zusammenhang an; „stellten ihn auf die Probe“ wahrt die Mehrdeutigkeit von πειράζω. Der Fußnotenmarker steht unmittelbar nach der gesamten Frage, auf die sich die Erläuterung bezieht.
