source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Wegen eurer Herzenshärte erlaubte Mose euch, eure Frauen zu entlassen[a]. Doch von Anfang an ist es nicht so gewesen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eure Frauen wegzuschicken“; im ehelichen Zusammenhang ist damit die Scheidung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Er sagt
  rationale: Der historische Präsens wird beibehalten; im Deutschen ist es in erzählender Rede natürlich und vergegenwärtigt die Szene.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Wegen eurer Herzenshärte
  rationale: πρός mit Akkusativ bezeichnet hier den Anlass bzw. Grund. „Herzenshärte“ bewahrt das konkrete biblische Bild und bleibt gut verständlich.
- source_word: ἐπέτρεψεν
  choice: erlaubte
  rationale: Das Verb bezeichnet eine Erlaubnis oder ein Zugeständnis, keinen Befehl und keine uneingeschränkte Gutheißung.
- source_word: ἀπολῦσαι
  choice: zu entlassen
  rationale: Die formal nähere Wiedergabe bewahrt das Bild des Wegschickens; der ehe- und scheidungsrechtliche Sinn wird in der Fußnote klargestellt.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: eure Frauen
  rationale: Im Ehekontext bedeutet γυναῖκες „Ehefrauen“; „eure Frauen“ ist im modernen Deutschen natürlich und eindeutig genug.
- source_word: ἀπ’ ἀρχῆς
  choice: von Anfang an
  rationale: Die geläufige Formulierung erhält den Rückbezug auf den Anfang der Schöpfung, ohne ihn erklärend in den Haupttext einzutragen.
- source_word: οὐ γέγονεν οὕτως
  choice: ist es nicht so gewesen
  rationale: Das deutsche Perfekt gibt den griechischen Perfektcharakter und den bis zur Gegenwart relevanten Zustand angemessen wieder.
theological_decisions:
- issue: Moses’ Regelung als Befehl, Erlaubnis oder Zugeständnis
  choice: erlaubte Mose euch
  alternative: gebot Mose euch
  rationale: ἐπέτρεψεν bezeichnet ausdrücklich eine Erlaubnis. So bleibt Jesu Gegensatz zwischen der mosaischen Regelung angesichts menschlicher Herzenshärte und dem ursprünglichen Zustand erhalten.
- issue: Explizierung des Schöpfungsbezugs
  choice: Doch von Anfang an ist es nicht so gewesen
  alternative: Doch von Anfang an entsprach dies nicht Gottes Schöpfungsordnung
  rationale: Die Übersetzung bewahrt die knappe Aussage des Griechischen und lässt den Schöpfungsbezug aus dem unmittelbaren Kontext hervorgehen, ohne eine theologische Auslegung in den Haupttext einzubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der historische Präsens und das biblische Bild „Herzenshärte“ werden bewahrt; die rechtliche Bedeutung von „entlassen“ wird durch eine knappe Fußnote erschlossen.
