  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Satzes wieder: den erzählerischen Anschluss (δέ), Jesus und seine Jünger, die feierliche Formel „Amen, ich sage euch“, den maskulinen Singular von πλούσιος, die Schwierigkeit durch δυσκόλως, die Zukunft sowie die matthäische Wendung „Himmelreich“. „In das Himmelreich kommen“ ist im Deutschen eine angemessene, idiomatische Wiedergabe von εἰσελεύσεται εἰς.'
  naturalness: „Da sagte Jesus zu seinen Jüngern“ und „wird nur schwer in das Himmelreich kommen“ sind flüssiges modernes Standarddeutsch mit würdig-biblischem Register. Die Stellung von „nur schwer“ ist natürlich und macht die Aussage nicht stärker als der griechische Text.
  terminology: „Amen, ich sage euch“ bewahrt die prägnante Jesusformel. „Ein Reicher“ erhält die im Ausgangstext maskuline, substantivierte Singularform. „Himmelreich“ ist eine etablierte und sachgerechte deutsche Wiedergabe von βασιλεία τῶν οὐρανῶν.
