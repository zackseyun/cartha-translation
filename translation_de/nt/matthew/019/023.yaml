id: MAT.19.23
reference: Matthew 19:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: de
  text: 'Da sagte Jesus zu seinen Jüngern: „Amen, ich sage euch: Ein Reicher wird nur schwer in das Himmelreich kommen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Da
  rationale: Kennzeichnet den erzählerischen Übergang und klingt im modernen Deutschen natürlich.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: Gibt sowohl μαθηταῖς als auch das ausdrücklich gesetzte Possessivpronomen αὐτοῦ wieder.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Bewahrt die charakteristische, feierliche Einleitungsformel Jesu und ist im biblischen Deutsch verständlich.
- source_word: πλούσιος
  choice: ein Reicher
  rationale: Das substantivierte maskuline Adjektiv steht im Singular; „ein Reicher“ bildet Form und repräsentative Aussage knapp ab.
- source_word: δυσκόλως
  choice: nur schwer
  rationale: Gibt die Schwierigkeit idiomatisch wieder, ohne bereits die im folgenden Vers zugespitzte Unmöglichkeit vorwegzunehmen.
- source_word: εἰσελεύσεται
  choice: wird … kommen
  rationale: In Verbindung mit „in das Himmelreich“ ist „hineinkommen/kommen“ im Deutschen natürlicher als das steifere „eintreten“; die Zukunft bleibt erhalten.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Ist die geläufige deutsche Wiedergabe der matthäischen Wendung und bewahrt den Gedanken königlicher Herrschaft in einer etablierten Kurzform.
theological_decisions:
- issue: Maskulines substantiviertes Adjektiv πλούσιος
  choice: ein Reicher
  alternative: ein reicher Mensch
  rationale: Die grammatisch maskuline Singularform wird bewahrt, ohne die repräsentative Reichweite der Aussage einzuschränken.
- issue: Wiedergabe der Formel Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  alternative: Wahrlich, ich sage euch / Ich versichere euch
  rationale: „Amen“ erhält die markante semitische Formel und ihre feierliche Autorität; eine idiomatische Auflösung wäre möglich, würde jedoch die Form stärker einebnen.
- issue: Stärke von δυσκόλως
  choice: nur schwer
  alternative: kaum
  rationale: „Nur schwer“ wahrt die unmittelbare Bedeutung der Schwierigkeit und nimmt die stärkere Zuspitzung des folgenden Verses nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während „Da sagte“ und „nur schwer … kommen“ natürlich und gut verständlich formuliert sind.
