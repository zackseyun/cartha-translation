  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: de
  text: 'und sagte: »Darum wird ein Mann Vater und Mutter verlassen, sich mit seiner Frau verbinden[a], und die beiden werden zu einem Fleisch werden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich fest an seine Frau binden“ oder „seiner Frau anhängen“. Das griechische Verb bezeichnet eine enge, feste Verbindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Darum
  rationale: Die knappe, idiomatische Kausalformel gibt den begründenden beziehungsweise folgernden Sinn im modernen Deutschen natürlich wieder.
- source_word: καταλείψει
  choice: wird ... verlassen
  rationale: Das Futur wird direkt wiedergegeben; „verlassen“ ist im Zusammenhang mit dem Elternhaus klar und bewahrt den formelhaften Charakter des Schriftzitats.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Im Zusammenhang der Verbindung mit „seiner Frau“ bezeichnet das maskuline Singularwort hier konkret den männlichen Ehepartner, nicht allgemein einen Menschen.
- source_word: κολληθήσεται
  choice: sich mit ... verbinden
  rationale: Die Form bezeichnet eine enge, feste Verbindung. Die reflexive deutsche Wendung ist natürlich und gibt den Sinn des griechischen Passivs wieder, ohne eine bestimmte emotionale Nuance aufzuzwingen.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: mit seiner Frau
  rationale: γυνή bedeutet in diesem eindeutig ehelichen Zusammenhang „Frau“ im Sinn von Ehefrau.
- source_word: οἱ δύο
  choice: die zwei
  rationale: Die im griechischen Text ausdrücklich genannte Zweizahl bleibt erhalten.
- source_word: εἰς σάρκα μίαν
  choice: ein Fleisch sein
  rationale: Die vertraute und zugleich präzise Wendung bewahrt das körperlich-relationale Bild des Genesiszitats; „Fleisch“ bezeichnet hier nicht eine sündige Natur.
theological_decisions:
- issue: Geschlechtsspezifische Sprache im Ehe-Zitat
  choice: ein Mann ... seine Frau
  alternative: ein Mensch ... sein Ehepartner
  rationale: Der griechische Wortlaut beschreibt in diesem Kontext ausdrücklich die Verbindung des männlichen Partners mit seiner Frau. Eine geschlechtsneutrale Fassung würde diese konkrete Formulierung verdecken.
- issue: Wiedergabe der ehelichen Einheit
  choice: die zwei werden ein Fleisch sein
  alternative: die zwei werden zu einem Fleisch werden
  rationale: Die gewählte Fassung folgt eng der Konstruktion ἔσονται εἰς und bewahrt die traditionelle Bildsprache, ohne die Art dieser Einheit erklärend festzulegen.
- issue: Abschließendes Fragezeichen
  choice: Fragezeichen nach dem Zitat
  alternative: Punkt nach dem Zitat
  rationale: Der Vers setzt die in Matthäus 19,4 begonnene Frage Jesu fort; das griechische Semikolon markiert hier das Ende dieser Gesamtfrage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarem Schriftzitat. „Ein Fleisch“ bleibt als bewusst bildhafte biblische Formulierung erhalten. Das Fragezeichen gehört syntaktisch zur bereits im vorigen Vers begonnenen Frage.
