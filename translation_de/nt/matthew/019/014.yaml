source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: de
  text: 'Jesus aber sagte: „Lasst die Kinder zu mir kommen und hindert sie nicht daran; denn solchen gehört das Himmelreich.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn von solchen ist das Himmelreich.“ „Solchen“ kann außer den anwesenden Kindern auch Menschen dieser Art bezeichnen; worin die Ähnlichkeit besteht, wird hier nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Lasst
  rationale: Der Aoristimperativ von ἀφίημι bezeichnet hier idiomatisch das Zulassen. „Lasst“ ist im Deutschen knapp, natürlich und bewahrt den unmittelbaren Befehlscharakter.
- source_word: τὰ παιδία
  choice: die Kinder
  rationale: παιδία bezeichnet Kinder, häufig jüngere Kinder. „Die Kinder“ ist genau und vermeidet eine unnötige Verstärkung durch „kleinen“.
- source_word: μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με
  choice: hindert sie nicht daran
  rationale: κωλύω mit Infinitiv bedeutet, jemanden an einer Handlung zu hindern. Da „zu mir kommen“ bereits im ersten, mit καί verbundenen Befehl steht, vermeidet diese natürliche deutsche Fassung eine schwerfällige Wiederholung, ohne den Sinn auszulassen.
- source_word: τῶν … τοιούτων
  choice: solchen
  rationale: τοιούτων weist über die anwesenden Kinder hinaus auf Menschen dieser Art, ohne ausdrücklich zu bestimmen, welche Eigenschaft gemeint ist. „Solchen“ erhält diese Offenheit.
- source_word: ἐστὶν ἡ βασιλεία τῶν οὐρανῶν
  choice: gehört das Himmelreich
  rationale: Der vorangestellte Genitiv τῶν τοιούτων mit ἐστίν drückt Zugehörigkeit aus. „Gehört …“ gibt dies in gegenwärtigem Deutsch klarer wieder als das unnatürliche „solcher ist …“.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: „Himmelreich“ ist die geläufige, prägnante deutsche Wiedergabe von Matthäus’ charakteristischer Wendung und bezeichnet Gottes Königsherrschaft beziehungsweise Reich, nicht bloß den Aufenthaltsort Himmel.
theological_decisions:
- issue: Bezieht sich Jesus ausschließlich auf die anwesenden Kinder oder auch auf Menschen, die ihnen in bestimmter Hinsicht entsprechen?
  choice: „solchen“
  alternative: „diesen Kindern“ oder deutender „Menschen, die wie Kinder sind“
  rationale: Das griechische τοιούτων bezeichnet eine Art oder Gruppe, deren konkrete kennzeichnende Eigenschaft hier nicht erklärt wird. „Solchen“ wahrt sowohl den unmittelbaren Bezug auf die Kinder als auch die mögliche weitere Anwendung, ohne die theologische Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte griechische Formulierung wird idiomatisch als „Lasst die Kinder zu mir kommen und hindert sie nicht daran“ wiedergegeben. Der traditionelle Ausdruck „Himmelreich“ bleibt erhalten; die Fußnote dokumentiert die wörtlichere Genitivkonstruktion und die genuine Offenheit von τοιούτων.
