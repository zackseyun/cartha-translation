  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: de
  text: 'Darauf antwortete Petrus ihm: „Sieh doch, wir haben alles verlassen und sind dir gefolgt. Was wird uns dann zuteilwerden?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Sieh doch
  rationale: Gibt den aufmerksamkeitslenkenden, nachdrücklichen Charakter der Partikel in natürlichem modernem Deutsch wieder.
- source_word: ἀφήκαμεν πάντα
  choice: wir haben alles verlassen
  rationale: Bewahrt die umfassende Aussage und die konkrete Bedeutung von ἀφίημι im Kontext des Zurücklassens.
- source_word: ἠκολουθήσαμέν σοι
  choice: sind dir gefolgt
  rationale: Entspricht der üblichen persönlichen Konstruktion von ἀκολουθέω mit Dativ und klingt im Deutschen natürlich.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Was wird dann für uns dabei sein?
  rationale: Bewahrt die offene Frage nach dem, was den Jüngern zukommen wird, ohne ausdrücklich einen Lohn oder Besitz einzuführen.
theological_decisions:
- issue: Petrus’ Frage nach dem Ergebnis der Nachfolge
  choice: Was wird dann für uns dabei sein?
  alternative: Was werden wir dafür bekommen?
  rationale: Die gewählte Fassung erhält die Unbestimmtheit von τί ... ἔσται ἡμῖν und vermeidet es, die Frage vorschnell auf materiellen oder verdienstlichen Lohn festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh doch“ trägt die Hervorhebung von Ἰδού, ohne das heute feierlich-altertümliche „Siehe“ zu verwenden.
