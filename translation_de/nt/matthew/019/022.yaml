  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: de
  text: Als der junge Mann aber dieses Wort[a] hörte, ging er traurig weg[b], denn er hatte viele Besitztümer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese Aussage«. Mit »dieses Wort« ist hier die unmittelbar vorausgehende Aussage von Jesus gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »voller Trauer« oder »betrübt«. Die griechische Form beschreibt den Zustand, in dem er wegging.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: »großen Besitz«. Im Griechischen liegt der Akzent wörtlicher auf der Menge: »viele Besitztümer« beziehungsweise »viel Besitz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: als ... hörte
  rationale: Das Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben und bezeichnet den vorausgehenden Anlass seines Weggehens.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier eine leichte Gegenüberstellung beziehungsweise narrative Wendung gegenüber Jesu vorausgehendem Wort.
- source_word: ὁ νεανίσκος
  choice: der junge Mann
  rationale: Dies gibt die Bezeichnung des Matthäustextes unmittelbar wieder, ohne die Angabe »führender Mann« aus dem lukanischen Parallelbericht einzutragen.
- source_word: τὸν λόγον
  choice: dieses Wort
  rationale: λόγος verweist im Zusammenhang auf die unmittelbar vorausgehende Aussage Jesu. »Dieses Wort« bleibt quellennah und ist im Deutschen verständlich.
- source_word: ἀπῆλθεν
  choice: ging ... weg
  rationale: Die Form bezeichnet schlicht sein Fortgehen; die deutsche Wortstellung verbindet das Verb natürlich mit der begleitenden Zustandsangabe.
- source_word: λυπούμενος
  choice: traurig
  rationale: Das Präsenspartizip beschreibt den fortdauernden Gemütszustand, in dem er wegging. Das prädikative Adjektiv ist im modernen Deutschen natürlicher als »trauernd«.
- source_word: ἦν γὰρ ἔχων
  choice: denn er hatte
  rationale: Die periphrastische Konstruktion bezeichnet einen anhaltenden Besitzstand und wird idiomatisch mit »hatte« wiedergegeben; γάρ nennt die Begründung.
- source_word: κτήματα πολλά
  choice: viele Besitztümer
  rationale: κτήματα bezeichnet Besitz beziehungsweise Eigentum, während πολλά ausdrücklich die große Anzahl oder Menge hervorhebt.
theological_decisions:
- issue: Ob die Identifikation als führender Mann aus dem Parallelbericht übernommen werden soll
  choice: Nur »der junge Mann«
  alternative: »der junge führende Mann« oder »der junge Oberste«
  rationale: Der griechische Matthäustext bezeichnet ihn an dieser Stelle ausschließlich als νεανίσκος. Eine Amts- oder Statusangabe würde den Wortlaut mit Lukas harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt die leichte Kontrastwirkung von δέ, ohne steif zu klingen. »Besitztümer« bildet den griechischen Plural ab; »traurig« gibt den begleitenden Zustand idiomatisch wieder.
