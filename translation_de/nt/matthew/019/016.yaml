  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: de
  text: 'Und siehe, einer trat zu ihm und sagte: »Lehrer, was muss ich Gutes[a] tun, damit ich ewiges Leben habe?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Welche gute Tat muss ich tun …?« Das griechische τί ἀγαθόν kann »was Gutes« oder im Zusammenhang mit »tun« eine »gute Tat« bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Und sieh
  rationale: Bewahrt sowohl das anschließende καί als auch den aufmerksamkeitslenkenden, erzählerisch vergegenwärtigenden Charakter von ἰδού in verständlichem modernem Deutsch.
- source_word: εἷς
  choice: Einer
  rationale: Gibt die unbestimmte Personenbezeichnung wörtlich wieder, ohne aus dem späteren Zusammenhang oder den Parallelstellen vorzeitig »ein Mann« oder »ein reicher junger Mann« einzutragen.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: trat zu ihm und sagte
  rationale: 'Die Beiordnung ist im Deutschen natürlicher und bildet die zeitliche Abfolge des vorgeordneten Aoristpartizips zuverlässig ab: Zuerst tritt die Person heran, dann spricht sie.'
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Entspricht der gewöhnlichen Bedeutung der Anrede und vermeidet altertümliche oder missverständliche Konnotationen von »Meister«.
- source_word: τί ἀγαθὸν ποιήσω
  choice: was muss ich Gutes tun
  rationale: Das substantivierte neutrale Adjektiv ἀγαθόν wird natürlich als »Gutes« wiedergegeben. »Muss ich« vermittelt die praktische Dringlichkeit der deliberativen Frage, ohne bereits eine Lehre über Verdienst oder Werke einzutragen.
- source_word: ἵνα σχῶ
  choice: damit ich … habe
  rationale: »Damit« erhält die Zweck- beziehungsweise Zielbeziehung von ἵνα; »habe« gibt ἔχω direkt wieder und vermeidet das stärker deutende »erlange«.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Die geläufige und kontextuell genaue deutsche Wiedergabe der festen Wendung.
theological_decisions:
- issue: Nähere Bestimmung der herantretenden Person
  choice: Einer
  alternative: ein Mann; ein reicher junger Mann
  rationale: Der Vers selbst sagt lediglich εἷς. Weitere Angaben aus dem späteren Zusammenhang oder den Parallelberichten werden nicht vorweggenommen.
- issue: Verhältnis von gutem Tun und ewigem Leben in der Frage
  choice: was muss ich Gutes tun, damit ich ewiges Leben habe?
  alternative: welche gute Tat muss ich vollbringen, um ewiges Leben zu erlangen?
  rationale: Die Übersetzung lässt die handlungsbezogene Fragestellung und ihre theologische Spannung bestehen, ohne sie als Verdienstlehre zu bestätigen oder vorzeitig zu widerlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Und sieh« erhält die auffordernde Erzählpartikel, wirkt jedoch weniger altertümlich als »Und siehe«. Die direkte Rede bleibt schlicht und mündlich. Der Fußnotenmarker steht unmittelbar nach dem gesamten Zitat.
