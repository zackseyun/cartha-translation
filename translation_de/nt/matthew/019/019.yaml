  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: de
  text: Ehre deinen Vater und deine Mutter und liebe deinen Nächsten wie dich selbst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler: „Ehre deinen Vater und deine Mutter, und du sollst deinen Nächsten lieben wie dich selbst.“'
    reason: Bewahrt den Wechsel vom Imperativ Τίμα zum Futur Indikativ Ἀγαπήσεις im griechischen Schriftzitat.
lexical_decisions:
- source_word: Τίμα
  choice: Ehre
  rationale: Das Verb τιμάω fordert hier, Vater und Mutter die ihnen gebührende Ehre zu erweisen. „Ehre“ bewahrt den Anklang an das Gebot und ist stärker als bloßes inneres Respektieren.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: deinen Vater und deine Mutter
  rationale: Obwohl im Griechischen Artikel statt Possessivpronomen stehen, verlangt die deutsche Gebotssprache in der direkten Anrede idiomatisch „deinen … deine …“.
- source_word: Ἀγαπήσεις
  choice: liebe
  rationale: Der Futur Indikativ steht in einem Zitat aus der Tora und hat gebietende Kraft. Der deutsche Imperativ gibt diese Funktion in der Aufzählung natürlich wieder; die formal nähere Zukunftsform wird in der Fußnote bewahrt.
- source_word: τὸν πλησίον σου
  choice: deinen Mitmenschen
  rationale: πλησίον bezeichnet im ethischen Zusammenhang den anderen Menschen, dem man verbunden oder begegnet. „Mitmensch“ ist im heutigen Standarddeutsch verständlich und vermeidet die mögliche Verengung von „Nächster“ oder „Nachbar“.
- source_word: ὡς σεαυτόν
  choice: wie dich selbst
  rationale: Die knappe Vergleichsformel wird ohne erklärenden Zusatz wiedergegeben.
theological_decisions:
- issue: Form der Gebote im Schriftzitat
  choice: 'Beide Aussagen im Haupttext als direkte Aufforderungen wiedergeben: „Ehre … und liebe …“'
  alternative: „Ehre deinen Vater und deine Mutter, und du sollst deinen Mitmenschen lieben wie dich selbst.“
  rationale: Der griechische Text verbindet den Imperativ Τίμα mit dem futurischen Ἀγαπήσεις in der gebietenden Sprache eines Torazitats. Zwei deutsche Aufforderungen vermitteln Funktion und Zusammenhang natürlich; die unterschiedliche Form des Griechischen bleibt in der Fußnote sichtbar.
- issue: Bedeutungsumfang von πλησίον
  choice: Mitmensch
  alternative: Nächster
  rationale: „Mitmensch“ gibt den personal-ethischen Bezug verständlich wieder, ohne den Ausdruck auf räumliche Nachbarschaft zu beschränken. „Nächster“ wäre traditionsnäher, klingt im modernen allgemeinen Sprachgebrauch jedoch weniger unmittelbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ehre“ erhält den feierlichen Gebotscharakter; „Mitmensch“ ist gegenwärtig und allgemein verständlich. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Vers, da die Anmerkung die Form beider verbundenen Gebote betrifft.
