    issue: Das Objekt im Schlusssatz wird als „es“ statt als „ihn“ wiedergegeben.
    rationale: τότε ἀφίησιν αὐτόν hat ausdrücklich Jesus als Objekt. „Da ließ Johannes ihn gewähren“ bewahrt diese Referenz und drückt im Deutschen kontextgerecht aus, dass Johannes seinen Widerstand aufgab.
  - severity: low
    issue: Die temporäre Nuance von ἄρτι kann deutlicher markiert werden.
    rationale: „Vorerst“ hält offen, dass die Zustimmung für die gegenwärtige Situation erbeten wird, ohne den Sinn gegenüber „jetzt“ zu verändern.
