  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: de
  text: 'Jesus aber antwortete ihm: „Lass es vorerst zu; denn so ist es angemessen für uns, alle Gerechtigkeit[a] zu erfüllen.“ Da ließ Johannes ihn gewähren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, was vor Gott recht ist“. Das griechische Wort kann Gerechtigkeit beziehungsweise rechtes, dem Willen Gottes entsprechendes Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Jesus aber antwortete ihm
  rationale: Die im Griechischen übliche Verbindung aus „antworten“ und „sagen“ wird im natürlichen Deutschen mit „antwortete“ wiedergegeben. „Aber“ bewahrt den Gegensatz zu Johannes’ Einwand im vorherigen Vers.
- source_word: Ἄφες ἄρτι
  choice: Lass es jetzt zu
  rationale: ἀφίημι bedeutet hier kontextbedingt „zulassen“, nicht „vergeben“ oder „verlassen“. ἄρτι bezeichnet den gegenwärtigen Zeitpunkt; „jetzt“ gibt dies knapp und natürlich wieder.
- source_word: οὕτως γὰρ
  choice: denn so
  rationale: „So“ verweist auf die unmittelbar gemeinte Weise, nämlich dass Johannes Jesus tauft; „denn“ gibt die begründende Funktion von γάρ wieder.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: ist es angemessen für uns
  rationale: πρέπον bezeichnet das, was in der gegebenen Situation passend oder geboten ist. „Angemessen“ bewahrt diesen moralisch-situativen Sinn in modernem Deutsch.
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: alle Gerechtigkeit zu erfüllen
  rationale: „Erfüllen“ bewahrt den für Matthäus bedeutsamen Ausdruck πληρόω. „Alle Gerechtigkeit“ hält die Weite von δικαιοσύνην offen und verengt die Aussage weder auf einzelne Gesetzesforderungen noch auf ein bestimmtes Lehrsystem.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Da ließ Johannes es zu
  rationale: Der historische Präsens wird im deutschen Erzählstil als Vergangenheit wiedergegeben. Der im Griechischen unausgesprochene Handlungsträger wird zur Klarheit als Johannes benannt; das deutsche „es“ nimmt den zuvor erbetenen Taufvollzug auf und gibt den kontextuellen Sinn von „ihn gewähren lassen“ natürlich wieder.
theological_decisions:
- issue: Bedeutung von πᾶσαν δικαιοσύνην
  choice: „alle Gerechtigkeit“ als umfassende Übereinstimmung mit Gottes rechtem Willen in dieser Situation
  alternative: '„alles, was vor Gott recht ist“ oder enger: die Erfüllung sämtlicher rechtlicher Forderungen'
  rationale: Die formnahe Wiedergabe bewahrt die theologische Weite und Spannung des Ausdrucks. Der unmittelbare Zusammenhang bezieht ihn auf Jesu Taufe durch Johannes, ohne ihn ausdrücklich auf bloße Gesetzeserfüllung zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und feierlich, ohne altertümliche Wendungen. Die Wiederholung von „zulassen“ bildet die Wiederaufnahme desselben griechischen Verbs sinngemäß ab.
