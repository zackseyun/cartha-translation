  source_fidelity: 'Der Entwurf gibt den Sinn des griechischen Satzes insgesamt zuverlässig wieder: Jesu Antwort, die zeitlich begrenzte Aufforderung, die Begründung mit „alle Gerechtigkeit“ und Johannes’ anschließendes Nachgeben sind erhalten. Im Schlusssatz steht jedoch im Griechischen ausdrücklich ein maskulines Objekt („ihn“), das sich auf Jesus bezieht. Die vorgeschlagene Fassung mit „es“ erschließt den Sinn zwar aus dem Kontext, gibt diese Bezugnahme aber nicht unmittelbar wieder.'
  naturalness: „Lass es jetzt zu“ und „angemessen für uns“ sind modernes, verständliches Standarddeutsch. Für τότε ἀφίησιν αὐτόν ist „Da ließ Johannes ihn gewähren“ idiomatischer und zugleich näher am ausdrücklich genannten Objekt als „Da ließ Johannes es zu“. „Vorerst“ gibt die begrenzende Nuance von ἄρτι etwas deutlicher wieder als das bloße „jetzt“.
  terminology: „Gerechtigkeit“ ist für δικαιοσύνη in diesem matthäischen Kontext angemessen und wahrt die Breite des Ausdrucks. „Erfüllen“ gibt πληρῶσαι treffend wieder. Die Fußnote bietet mit „alles, was vor Gott recht ist“ eine sinnvolle erläuternde Alternative, ohne den Ausdruck auf eine bestimmte theologische Deutung festzulegen.
  issues:
