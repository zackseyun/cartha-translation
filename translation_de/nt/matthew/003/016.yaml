id: MAT.3.16
reference: Matthew 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: de
  text: 'Als Jesus getauft worden war, stieg er sofort aus dem Wasser herauf.[a] Und siehe: Die Himmel wurden geöffnet, und er sah den Geist Gottes wie eine Taube herabkommen[b] und auf ihn kommen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische ἀπὸ τοῦ ὕδατος bedeutet wörtlich „vom Wasser“ bzw. „weg vom Wasser“; „aus dem Wasser“ ist im Deutschen eine idiomatische Wiedergabe der Aufwärtsbewegung.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Vergleichswort ὡσεί bedeutet „wie“ oder „gleichsam“; der Geist wird nicht ausdrücklich mit einer Taube gleichgesetzt.
    reason: alternative_reading
  - marker: c
    text: 'Oder deutender: „sich auf ihm niederlassen“. Das griechische Verb bedeutet hier wörtlicher „kommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Als Jesus getauft worden war
  rationale: Das vorzeitige passive Aoristpartizip wird als temporaler Nebensatz wiedergegeben. „Getauft worden war“ bewahrt Passiv und zeitliche Zuordnung, ohne den Satz im Deutschen unnötig schwer zu machen; δέ dient hier lediglich der Erzählfortführung und braucht nach dem Anschluss an den vorherigen Vers kein eigenes starkes Gegenstück.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: stieg er sofort aus dem Wasser herauf
  rationale: „Sofort“ gibt εὐθύς klar wieder. „Heraufsteigen“ entspricht ἀναβαίνω; das im Deutschen idiomatische „aus dem Wasser“ bezeichnet die Bewegung vom Wasser weg, während eine Fußnote die formal weitere Bedeutung von ἀπό offenhält.
- source_word: ἰδοὺ
  choice: Und siehe
  rationale: Die traditionelle, weiterhin verständliche Wendung erhält den lebhaften, aufmerksamkeitslenkenden Erzählruf.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: Die Himmel wurden geöffnet
  rationale: Plural und Passiv des griechischen Textes bleiben erhalten. „Himmel“ kann im Deutschen ebenso wie οὐρανοί kosmische und theologische Resonanz tragen.
- source_word: πνεῦμα θεοῦ
  choice: den Geist Gottes
  rationale: Die Genitivverbindung wird eng wiedergegeben. Der Kontext legt Gottes Heiligen Geist nahe, doch die Übersetzung ersetzt die konkrete Formulierung nicht durch den weiter deutenden Titel „Heiliger Geist“.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: wie eine Taube herabkommen
  rationale: ὡσεί kennzeichnet ausdrücklich einen Vergleich. Die Formulierung behauptet daher nicht, der Geist sei buchstäblich eine Taube gewesen.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: auf ihn kommen
  rationale: Die transparente Wiedergabe bewahrt das allgemeine Bewegungsverb ἔρχομαι und die Zielrichtung von ἐπί, ohne das spezifischere Bild eines Sich-Niederlassens einzutragen.
theological_decisions:
- issue: Bezeichnung des πνεῦμα θεοῦ
  choice: Geist Gottes
  alternative: Heiliger Geist; ein Geist von Gott
  rationale: Der Taufkontext weist auf Gottes Geist hin. Die genaue Genitivformulierung wahrt diese Identifikation, ohne den im Vers nicht verwendeten Titel „Heiliger Geist“ einzusetzen oder durch „ein Geist“ unnötige Unbestimmtheit zu erzeugen.
- issue: Art des Taubenvergleichs
  choice: wie eine Taube herabkommen
  alternative: als Taube herabkommen
  rationale: Das Vergleichswort ὡσεί lässt offen, ob sich die Ähnlichkeit auf Erscheinungsform, Bewegung oder eine andere wahrnehmbare Weise bezieht. „Wie“ bewahrt diese Spannung und vermeidet eine Gleichsetzung.
- issue: Bedeutung von ἐρχόμενον ἐπ’ αὐτόν
  choice: auf ihn kommen
  alternative: sich auf ihm niederlassen
  rationale: Der Text beschreibt ein Kommen auf Jesus zu beziehungsweise auf ihn; er verwendet kein eigenes Verb für das Landen oder Niederlassen. Deshalb bleibt die Hauptfassung bewusst näher am allgemeineren griechischen Verb.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem Erzählruf „Und siehe“. Der Satzbau bleibt gut vorlesbar; die leichte Wiederholung von „kommen“ dient der Transparenz gegenüber den beiden griechischen Partizipien und verhindert eine unnötige Ausdeutung.
