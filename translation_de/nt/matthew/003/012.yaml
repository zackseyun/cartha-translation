source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: de
  text: Seine Worfschaufel[a] hat er in der Hand; er wird seinen Dreschplatz gründlich reinigen und seinen Weizen in den Kornspeicher[b] sammeln. Die Spreu aber wird er mit unauslöschlichem Feuer verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wurfschaufel“; gemeint ist ein Gerät zum Worfeln des Getreides.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Vorratsspeicher“ beziehungsweise „Scheune“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: Worfschaufel
  rationale: Das Wort bezeichnet ein Gerät, mit dem das gedroschene Getreide zum Trennen in die Luft geworfen wurde. „Worfschaufel“ ist im Deutschen der geläufige landwirtschaftliche Ausdruck, ohne die überholte Vorstellung eines Fächers hervorzurufen.
- source_word: διακαθαριεῖ
  choice: wird … gründlich reinigen
  rationale: Das zusammengesetzte Verb hebt die vollständige Säuberung des Dreschplatzes hervor; „gründlich reinigen“ gibt diese Verstärkung natürlich wieder.
- source_word: ἅλωνα
  choice: Dreschplatz
  rationale: Gemeint ist die feste Fläche, auf der Getreide gedroschen und geworfelt wurde. „Dreschplatz“ ist sachlich genauer und im heutigen Deutsch verständlicher als das ebenfalls mögliche „Tenne“.
- source_word: σῖτον
  choice: Weizen
  rationale: σῖτος kann Getreide allgemein bezeichnen, doch im Bild von Weizen und Spreu ist „Weizen“ eine natürliche und konkrete Wiedergabe.
- source_word: ἀποθήκην
  choice: Kornspeicher
  rationale: Das Substantiv bezeichnet einen Aufbewahrungsraum. Im vorliegenden landwirtschaftlichen Zusammenhang gibt „Kornspeicher“ die Funktion präzise wieder, ohne die Bauform näher festzulegen.
- source_word: ἄχυρον
  choice: Spreu
  rationale: Im Zusammenhang des Worfelns bezeichnet „Spreu“ das vom Korn ausgesonderte, wertlose Pflanzenmaterial und bewahrt den bildhaften Gegensatz zum Weizen.
- source_word: κατακαύσει
  choice: wird … restlos verbrennen
  rationale: Das Präfix verstärkt den Gedanken des Verbrennens bis zur vollständigen Vernichtung. „Restlos verbrennen“ bringt diese Intensität zum Ausdruck.
- source_word: πυρὶ ἀσβέστῳ
  choice: mit unauslöschlichem Feuer
  rationale: Der Dativ kann das Mittel bezeichnen. „Unauslöschliches Feuer“ gibt ein Feuer wieder, das nicht gelöscht werden kann, ohne die Gerichtsaussage abzuschwächen.
- source_word: οὗ
  choice: Er hält … in der Hand
  rationale: Das Genitiv-Relativpronomen verweist auf den Kommenden aus dem vorherigen Vers und drückt Besitz aus. Die Umformung als eigener Satz mit „Er“ und dem Besitz implizierenden Halten ist im Deutschen natürlicher und hält den Bezug eindeutig.
theological_decisions:
- issue: Gerichtsbild der Trennung von Weizen und Spreu
  choice: Das konkrete landwirtschaftliche Bild und die zukünftige Gerichtssprache bleiben unverändert erhalten.
  alternative: Weizen und Spreu im Haupttext ausdrücklich als gerechte beziehungsweise böse Menschen deuten.
  rationale: Der Vers selbst bietet das Bild, ohne seine beiden Gruppen ausdrücklich auszudeuten. Die Übersetzung sollte seine Schärfe und theologische Spannung bewahren, aber keine erklärende Identifikation in den Haupttext eintragen.
- issue: Bedeutung des unauslöschlichen Feuers
  choice: „unauslöschlich“ wird ohne weitere zeitliche oder dogmatische Erläuterung wiedergegeben.
  alternative: Das Feuer im Haupttext ausdrücklich als ewig oder als zeitlich begrenzt auslegen.
  rationale: ἄσβεστος bezeichnet ein Feuer, das nicht gelöscht werden kann. Weitergehende systematisch-theologische Folgerungen liegen außerhalb der unmittelbaren Aussage des Verses.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht die lange griechische Periode gut verständlich; die Voranstellung von „Seinen Weizen“ und der Kontrast „die Spreu aber“ bewahren die nachdrückliche Gegenüberstellung. Landwirtschaftliche Fachwörter werden nur verwendet, wo sie das Bild präzise und weiterhin verständlich wiedergeben.
