  to: Seine Worfschaufel[a] hat er in der Hand; er wird seinen Dreschplatz gründlich reinigen und seinen Weizen in den Kornspeicher[b] sammeln. Die Spreu aber wird er mit unauslöschlichem Feuer verbrennen.
