source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: de
  text: Und sie wurden von ihm im Fluss Jordan getauft und bekannten dabei ihre Sünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden getauft“. Das griechische Imperfekt kann einen andauernden oder wiederholten Vorgang hervorheben: „wurden gerade getauft“ bzw. „wurden wiederholt getauft“.'
    reason: Aspektalternative zu ἐβαπτίζοντο; die deutsche einfache Vergangenheitsform kann den im griechischen Imperfekt möglichen Vorgangs- oder Wiederholungsaspekt nicht vollständig ausdrücken.
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: ließen sich taufen
  rationale: Das griechische Imperfekt Passiv beschreibt den fortlaufenden beziehungsweise wiederholten Vorgang innerhalb der Erzählung. Die deutsche Konstruktion „ließen sich taufen“ gibt das passive Geschehen natürlich wieder, ohne die Art der Taufhandlung näher festzulegen.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: im Jordanfluss
  rationale: ἐν mit dem Dativ bezeichnet hier den Ort; ποταμῷ nennt den Jordan ausdrücklich einen Fluss. „im Jordanfluss“ ist knapp, verständlich und bewahrt diese Angabe.
- source_word: ὑπ’ αὐτοῦ
  choice: von ihm
  rationale: ὑπό mit dem Genitiv bezeichnet den Handelnden. Das Pronomen wird entsprechend dem griechischen Wortlaut beibehalten; aus dem Zusammenhang ist Johannes gemeint.
- source_word: ἐξομολογούμενοι
  choice: bekannten dabei
  rationale: Das präsentische Partizip bezeichnet eine Handlung, die gleichzeitig mit der Taufe geschieht. „dabei“ macht diese Beziehung im natürlichen Deutschen deutlich, ohne eine genauere zeitliche oder kausale Deutung aufzuzwingen.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ihre Sünden
  rationale: Die Wiedergabe bewahrt den Plural und die possessive Beziehung und bezeichnet die von ihnen eingestandenen Verfehlungen direkt.
- source_word: καὶ
  choice: Und
  rationale: Die einfache Konjunktion verbindet den Vers mit dem vorausgehenden Erzählzusammenhang, ohne eine zusätzliche zeitliche Folgerung einzutragen.
theological_decisions:
- issue: Bezeichnung und Vollzugsweise der Taufe
  choice: „taufen“ wird als etablierter ritueller Ausdruck beibehalten.
  alternative: „untertauchen“ oder „waschen“
  rationale: Der Vers berichtet von der Taufe im Jordan, bestimmt aber ihre Vollzugsweise nicht ausdrücklich. „taufen“ wahrt diese Offenheit und vermeidet konfessionelle Festlegungen.
- issue: Verhältnis von Sündenbekenntnis und Taufe
  choice: „dabei“ stellt Gleichzeitigkeit beziehungsweise Begleitumstände dar.
  alternative: Eine kausale oder streng zeitliche Verknüpfung, etwa „nachdem sie bekannt hatten“
  rationale: Das griechische Partizip ist am natürlichsten als gleichzeitig zur Haupthandlung zu verstehen; eine Kausalität oder feste Reihenfolge wird nicht ausdrücklich ausgesagt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Jordanfluss“ bewahrt das im Griechischen ausdrücklich vorhandene Wort „Fluss“; „ließen sich taufen“ klingt natürlicher als das schwerfällige „wurden getauft“ und bleibt semantisch passiv.
