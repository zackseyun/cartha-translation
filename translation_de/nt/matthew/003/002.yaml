lexical_decisions:
- source_word: καὶ λέγων
  choice: und sagte
  rationale: Die koordinierende Partizipialkonstruktion knüpft an den vorhergehenden Vers an. „Und sagte“ gibt sie in natürlichem modernem Deutsch wieder, ohne die speziellere Bedeutung „verkündete“ in λέγων hineinzulesen.
- source_word: Μετανοεῖτε
  choice: Kehrt um
  rationale: Der Imperativ Plural ruft zu einer grundlegenden Änderung von Denken, Haltung und Lebensausrichtung auf. „Kehrt um“ ist im Deutschen verständlich und erfasst mehr als bloße Reuegefühle; die stärker kognitive Wiedergabe „Ändert euer Denken“ wird in der Fußnote genannt.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ leitet idiomatisch den Grund für die vorangehende Aufforderung ein.
- source_word: ἤγγικεν
  choice: ist nahe gekommen
  rationale: Das Perfekt von ἐγγίζω bezeichnet ein Herannahen mit gegenwärtigem Ergebnis. „Ist nahe gekommen“ bewahrt sowohl das Geschehen als auch die nun bestehende Nähe.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: „Himmelreich“ ist die natürliche und traditionsfähige deutsche Wiedergabe von Matthäus’ charakteristischer Wendung. βασιλεία kann sowohl Königsherrschaft als auch Königreich bezeichnen; die Fußnote hält diese Bedeutungsbreite und den griechischen Plural sichtbar.
theological_decisions:
- issue: Bedeutung von μετανοεῖτε
  choice: Kehrt um
  alternative: Ändert euer Denken; denkt um
  rationale: Der Aufruf wird weder auf Schuldgefühl noch auf eine rein intellektuelle Meinungsänderung verengt. „Kehrt um“ lässt die umfassende Neuausrichtung offen, während die Fußnote die kognitive Komponente ausdrücklich wahrt.
- issue: Bedeutung des Himmelreichs
  choice: Matthäus’ Ausdruck „Himmelreich“ beibehalten
  alternative: Gottes Königsherrschaft; das Königreich der Himmel
  rationale: Eine ausdeutende Ersetzung durch „Gottes Herrschaft“ würde Matthäus’ eigene Ausdrucksweise einebnen. „Himmelreich“ bewahrt die theologische Spannung zwischen Herrschaft und Reich; die Fußnote nennt die wörtlichere Form.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Verkündigungsdeutsch. Der Satz bleibt als Anschluss an Matthäus 3,1 mit „und sagte“ syntaktisch verbunden. Traditionell verständliche Begriffe werden verwendet, ohne ihre Bedeutungsbreite durch konfessionelle Auslegung festzulegen.
