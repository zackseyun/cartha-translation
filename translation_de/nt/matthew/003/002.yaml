  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Ändert euer Denken“ oder „Denkt um“. Das griechische μετανοεῖτε bezeichnet eine grundlegende Neuausrichtung des Denkens und der Haltung, nicht nur Reuegefühle.'
