  source_fidelity: „Kehrt um“ gibt Μετανοεῖτε als pluralischen Aufruf zu einer umfassenden Umkehr treffend wieder, ohne die Bedeutung auf bloßes Bedauern oder eine rein gedankliche Änderung zu reduzieren. „Denn“ gibt γάρ korrekt wieder. „Das Himmelreich“ ist für Matthäus’ ἡ βασιλεία τῶν οὐρανῶν eine etablierte und sachgerechte deutsche Wiedergabe. „Ist nahe gekommen“ bildet das Perfekt ἤγγικεν mit seiner gegenwärtig fortbestehenden Nähe angemessen ab. „Und sagte“ ist als deutsche Auflösung von καὶ λέγων im narrativen Anschluss zulässig.
  naturalness: Der Satz ist modernes, verständliches und zugleich würdiges Deutsch. Die Formulierung „ist nahe gekommen“ ist etwas gehobener als „ist nahe“, aber in diesem Verkündigungskontext gut verständlich und aspectuell genauer.
  terminology: Die Terminologie ist konsistent und nicht konfessionell überinterpretiert. „Himmelreich“ bewahrt Matthäus’ charakteristische Formulierung; die Fußnote weist sachlich auf „Königreich der Himmel“ und die Bedeutungsbreite von βασιλεία hin. Die Fußnote zu „Kehrt um“ bietet eine hilfreiche Alternative, ohne diese zur alleinigen Bedeutung zu erklären.
