  rationale: Die Revision beschränkt sich auf die Wiedergabe von εὐδόκησα und die dazugehörige Fußnote. „Wohlgefallen habe“ vermeidet die ungewollte Nuance eines erst entdeckten Gefallens, bewahrt den feierlichen Registerwert der göttlichen Erklärung und entspricht der idiomatischen Verwendung von εὐδοκέω. Die Pluralform „aus den Himmeln“ und die übrigen Entscheidungen bleiben unverändert.
