source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: de
  text: 'Und siehe, eine Stimme aus den Himmeln[a] sprach: »Dieser ist mein geliebter Sohn, an dem ich Wohlgefallen habe.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus dem Himmel. Im Griechischen steht der Plural „aus den Himmeln“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: in dem ich Wohlgefallen habe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Und siehe
  rationale: ἰδού lenkt als markierter Hinweis die Aufmerksamkeit auf das bedeutsame Geschehen. „Und siehe“ bewahrt den feierlichen Ton und ist im Deutschen weiterhin verständlich.
- source_word: φωνὴ
  choice: eine Stimme
  rationale: φωνή bezeichnet hier wegen der anschließenden wörtlichen Rede eine vernehmbare, sprechende Stimme und nicht nur ein Geräusch.
- source_word: ἐκ τῶν οὐρανῶν
  choice: aus den Himmeln
  rationale: Die Übersetzung bewahrt den griechischen Plural. Da im Deutschen der Singular idiomatischer und traditionell vertraut ist, wird er als Alternative in einer Fußnote genannt.
- source_word: λέγουσα
  choice: sprach
  rationale: Das Partizip führt die direkte Rede ein. Ein finites Verb klingt im Deutschen natürlicher als die formale Nachbildung „sagend“.
- source_word: Οὗτός ἐστιν
  choice: Dieser ist
  rationale: Die Formulierung erhält die direkte, nachdrückliche Identifizierung durch Demonstrativpronomen und Kopula.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mein geliebter Sohn
  rationale: „Geliebter“ gibt ἀγαπητός präzise und würdevoll wieder; „Sohn“ bewahrt die ausdrücklich personale und christologische Bezeichnung des Textes.
- source_word: ἐν ᾧ
  choice: an dem
  rationale: Bei Gefallen oder Wohlgefallen ist „an jemandem“ die natürliche deutsche Verbindung. Die wörtlichere Wiedergabe „in dem“ bleibt als Fußnotenalternative sichtbar.
- source_word: εὐδόκησα
  choice: ich Gefallen gefunden habe
  rationale: Die Perfektform gibt den griechischen Aorist in natürlichem Deutsch wieder und bezeichnet Gottes erklärtes Wohlgefallen, ohne die Aussage auf einen bloß momentanen Eindruck zu verengen.
theological_decisions:
- issue: Die göttliche Erklärung der Sohnschaft Jesu
  choice: mein geliebter Sohn
  alternative: mein Sohn, der Geliebte
  rationale: Die Übersetzung bewahrt sowohl die ausdrückliche Sohnschaft als auch die qualifizierende Bezeichnung „geliebt“, ohne eine weitergehende dogmatische Erklärung in den Vers einzutragen.
- issue: Zeitlicher Aussagewert von εὐδόκησα
  choice: an dem ich Gefallen gefunden habe
  alternative: an dem ich Gefallen habe
  rationale: Die gewählte Form lässt den Aorist hörbar, ohne auszuschließen, dass die Erklärung ein gegenwärtig fortbestehendes göttliches Wohlgefallen ausdrückt.
- issue: Plural οὐρανῶν
  choice: aus den Himmeln
  alternative: aus dem Himmel
  rationale: Der ungewöhnlichere Plural folgt der Form des griechischen Ausgangstextes; die vertraute deutsche Singularform wird nicht ausgeschlossen, sondern in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und siehe“ trägt bewusst den feierlichen Aufmerksamkeitsruf des Ausgangstextes; „aus den Himmeln“ bewahrt dessen markierten Plural. Die direkte Rede bleibt knapp und proklamatorisch.
