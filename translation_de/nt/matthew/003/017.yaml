    rationale: Die Formulierung kann im heutigen Deutsch den Anschein erwecken, dass Gott erst zu einem bestimmten Zeitpunkt Gefallen an Jesus gefunden habe. Das griechische Aoristverb in dieser formelhaften Erklärung rechtfertigt diese Nuance nicht. „an dem ich Wohlgefallen habe“ ist idiomatischer und wahrt die Aussage göttlicher Zustimmung.
