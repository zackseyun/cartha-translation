  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Bedeutungen des griechischen Textes zuverlässig wieder: der Aufmerksamkeitsruf, die Stimme „aus den Himmeln“, die Identifikation Jesu als Gottes geliebter Sohn und das göttliche Wohlgefallen bleiben erhalten. Für εὐδόκησα ist jedoch „Gefallen gefunden habe“ im Deutschen weniger treffend, weil es leicht ein erst nachträglich entstandenes Gefallen nahelegen kann. Die idiomatische Formel „Wohlgefallen habe“ gibt das erklärte, fortgeltende Wohlgefallen angemessener wieder, ohne den Aorist überzuinterpretieren.'
  naturalness: „Und siehe“, „Dieser ist“ und „aus den Himmeln“ sind bewusst gehoben bzw. markiert, aber in einem würdevollen biblischen Register verständlich. „Wohlgefallen habe“ ist in dieser Redeform natürlicher und präziser als „Gefallen gefunden habe“.
  terminology: „geliebter Sohn“ bewahrt die christologisch gewichtige, aber textlich nicht weiter ausgelegte Bezeichnung ὁ υἱός μου ὁ ἀγαπητός. „Wohlgefallen“ ist für εὐδοκέω in diesem Kontext die etablierte und semantisch klare deutsche Wiedergabe. Die Fußnoten sollen die Alternative zu ἐν ᾧ als vollständige Satzalternative formulieren.
