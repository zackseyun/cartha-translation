  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: de
  text: Johannes selbst trug ein Gewand aus Kamelhaar[a][b] und einen Ledergürtel um die Taille; seine Nahrung aber bestand aus Heuschrecken und wildem Honig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Kleidung des Johannes erinnert an das Erscheinungsbild des Propheten Elija in 2. Könige 1,8.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „hatte sein Gewand aus Kamelhaaren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Johannes selbst
  rationale: αὐτός hebt Johannes hervor; „selbst“ bewahrt diesen Nachdruck. δέ markiert einen milden Übergang, der im Deutschen durch die Satzführung und später durch „aber“ natürlich wiedergegeben wird.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: trug ein Gewand
  rationale: εἶχεν bedeutet wörtlich „hatte“, beschreibt hier aber idiomatisch seine Kleidung. „trug“ ist natürlich und vermeidet den Eindruck, Johannes habe das Gewand anfertigen lassen.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: aus Kamelhaar
  rationale: ἀπό bezeichnet hier den Stoff, aus dem das Gewand bestand. Der deutsche Kollektivbegriff „Kamelhaar“ ist idiomatisch.
- source_word: ζώνην δερματίνην
  choice: einen Ledergürtel
  rationale: ζώνη bezeichnet einen Gürtel oder eine Leibbinde; „Ledergürtel“ ist die klare und geläufige Entsprechung.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: um die Hüften
  rationale: ὀσφύς bezeichnet den Hüft- oder Lendenbereich. „Hüften“ ist gegenwärtiges, würdevolles Deutsch ohne den altertümlichen Klang von „Lenden“.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: seine Nahrung aber bestand aus
  rationale: τροφή bedeutet Nahrung oder Speise. „bestand aus“ bildet die prädikative Konstruktion im Deutschen natürlich ab; „aber“ bewahrt die leichte Gliederungsfunktion von δέ.
- source_word: ἀκρίδες
  choice: Heuschrecken
  rationale: Die reguläre lexikalische Bedeutung ist das essbare Insekt „Heuschrecken“; für eine pflanzliche Deutung gibt der griechische Text keinen Anlass.
- source_word: μέλι ἄγριον
  choice: wilder Honig
  rationale: Die feste deutsche Verbindung „wilder Honig“ gibt μέλι ἄγριον knapp und sachgerecht wieder.
theological_decisions:
- issue: Anklang an Elijas Erscheinungsbild
  choice: Die Beschreibung bleibt im Haupttext sachlich; der Bezug zu Elija wird nur in einer Fußnote genannt.
  alternative: Den Elija-Bezug durch eine stärker deutende Formulierung in den Haupttext eintragen.
  rationale: Matthäus beschreibt unmittelbar Kleidung und Nahrung des Johannes. Der wahrscheinliche intertextuelle Bezug zu 2. Könige 1,8 ist wichtig, sollte aber nicht als ausdrückliche Aussage in den Vers hineingetragen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Gewand“ passt zur antiken Kleidung, ohne unnötig altertümlich zu wirken; „Hüften“ vermeidet das heute ungebräuchliche „Lenden“. Die Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Textstellen.
