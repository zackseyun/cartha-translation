  source_fidelity: Der Entwurf gibt die Satzstruktur, den Kontrast μὲν ... δέ, εἰς μετάνοιαν, die Demutsformel und die Betonung durch αὐτός insgesamt zuverlässig wieder. Die Auflösung der Relativkonstruktion in zwei Sätze ist verständlich, verdeckt jedoch leicht, dass die Aussage über die Sandalen ausdrücklich auf den Kommenden bezogen ist. Die deutsche Wiedergabe „in Feuer taufen“ ist zwar formal möglich, klingt im modernen Standarddeutsch aber unnötig ungewohnt und legt eher ein lokatives Bild nahe. „Mit Heiligem Geist und Feuer“ gibt ἐν idiomatisch wieder, während eine Anmerkung die Alternative transparent hält.
  naturalness: „Mit Wasser“ sowie „mit Heiligem Geist und Feuer“ sind im heutigen würdevollen Standarddeutsch deutlich idiomatischer als „in Wasser“ und besonders „in Feuer“. Die Relativform „dessen Sandalen zu tragen ich nicht würdig bin“ ist flüssig und bewahrt den Zusammenhang des griechischen Relativsatzes.
  terminology: „taufen“, „Umkehr“, „Sandalen“ und „Heiliger Geist“ sind sachgemäß. „Umkehr“ bewahrt die Bedeutung von μετάνοια ohne eine konfessionell oder zeitlich engere Erklärung. Die Fußnote zur Präposition sollte auch die parallele zweite Wendung berücksichtigen, wie es der englische Audit Trail vorsieht.
