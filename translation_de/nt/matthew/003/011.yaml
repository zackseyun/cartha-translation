id: MAT.3.11
reference: Matthew 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: de
  text: Ich taufe euch zwar mit Wasser[a] zur Umkehr; doch der, der nach mir kommt, ist stärker als ich, dessen Sandalen zu tragen ich nicht würdig bin. Er selbst wird euch mit Heiligem Geist und Feuer[b] taufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »in Wasser«; entsprechend später: »im Heiligen Geist und Feuer«. Das griechische ἐν kann in diesen Wendungen je nach Zusammenhang mit »in« oder »mit« wiedergegeben werden. »Zur Umkehr« bewahrt die Zielrichtung der Wendung, ohne das Verhältnis zwischen Umkehr und Taufe näher festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: »Feuer« kann hier als Bild für Reinigung oder für Gericht verstanden werden; der griechische Wortlaut lässt die Bildaussage an dieser Stelle offen.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: taufe / wird ... taufen
  rationale: Die etablierte deutsche Wiedergabe bewahrt den rituellen Sinn, ohne die Taufweise durch »untertauchen« näher festzulegen.
- source_word: ἐν ὕδατι
  choice: in Wasser
  rationale: »In Wasser« bildet die Präposition ἐν formal ab und wahrt die Parallele zu »im Heiligen Geist und in Feuer«; idiomatisch wäre auch »mit Wasser« möglich.
- source_word: εἰς μετάνοιαν
  choice: zur Umkehr
  rationale: »Zur« bewahrt die Zielrichtung von εἰς, ohne abschließend festzulegen, wie Taufe und Umkehr zeitlich oder sachlich zueinander stehen.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: doch der, der nach mir kommt
  rationale: Natürliche moderne Wiedergabe des substantivierten Partizips mit der zeitlichen beziehungsweise nachfolgenden Bedeutung von ὀπίσω μου.
- source_word: ἰσχυρότερός μού
  choice: ist stärker als ich
  rationale: Direkte und allgemein verständliche Wiedergabe des Komparativs, ohne das altertümlichere »mächtiger denn ich«.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Ich bin nicht würdig
  rationale: Im Zusammenhang der Demutsaussage gibt »würdig« die idiomatische Kraft von ἱκανός besser wieder als rein fähigkeitsbezogene Ausdrücke.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: seine Sandalen zu tragen
  rationale: βαστάσαι bedeutet hier »tragen«; »Sandalen« ist sachlich genauer als das allgemeinere »Schuhe«.
- source_word: αὐτός
  choice: Er selbst
  rationale: Die Wiedergabe erhält die ausdrückliche Betonung und den Kontrast zu Johannes.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: Die Formulierung bewahrt die wiederholte ἐν-Konstruktion; »Heiliger Geist« bezeichnet im matthäischen Zusammenhang den personalen göttlichen Geist.
- source_word: καὶ πυρί
  choice: und in Feuer
  rationale: Die Wiederholung von »in« macht die syntaktische Zuordnung im Deutschen klar und lässt offen, ob das Feuer Reinigung oder Gericht bezeichnet.
theological_decisions:
- issue: Bedeutung von »Heiligem Geist und Feuer«
  choice: Die bildhafte Formulierung bleibt ohne deutende Ergänzung stehen.
  alternative: »im Heiligen Geist und im reinigenden Feuer« oder »im Heiligen Geist und im Feuer des Gerichts«
  rationale: Der griechische Wortlaut bestimmt an dieser Stelle nicht ausdrücklich, ob Feuer Reinigung, Gericht oder beide Motivbereiche bezeichnet; der folgende Kontext darf die Auslegung leiten.
- issue: Bezug von πνεύματι ἁγίῳ
  choice: »Heiliger Geist«
  alternative: »heiliger Geist« oder »heilige Geisteskraft«
  rationale: Im matthäischen Kontext ist die feste Bezeichnung des Heiligen Geistes sachgemäß; eine Erweiterung zu einer unpersönlichen Kraft ginge über den Wortlaut hinaus.
- issue: Verhältnis von Taufe und Umkehr in εἰς μετάνοιαν
  choice: »zur Umkehr« ohne nähere Erklärung im Haupttext
  alternative: »als Zeichen der Umkehr« oder »damit ihr umkehrt«
  rationale: Die Alternativen würden das sachliche oder zeitliche Verhältnis stärker bestimmen, als die knappe griechische Präpositionalphrase es allein tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Zwar ... doch« bildet den Kontrast μὲν ... δέ natürlich ab. Zwei Hauptsätze vermeiden eine schwerfällige deutsche Relativkonstruktion. Die ungewöhnlichere Form »in Wasser« wurde bewusst gewählt, um die formale und theologische Parallelität der drei Dativgruppen sichtbar zu halten.
