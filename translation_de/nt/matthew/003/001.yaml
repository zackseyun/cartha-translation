  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: de
  text: 'In jenen Tagen trat Johannes der Täufer auf und verkündete in der Wüste von Judäa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: In jenen Tagen
  rationale: Die Präposition ἐν mit Dativ bezeichnet den Zeitpunkt. Das schwach verbindende δέ muss im Deutschen nicht eigens wiedergegeben werden; ein zusätzliches »aber« oder »nun« würde den Übergang unnötig markieren.
- source_word: παραγίνεται
  choice: trat … auf
  rationale: Das historische Präsens führt Johannes als neue Gestalt in die Erzählung ein. »Trat auf« gibt diese narrative Funktion im Deutschen natürlich wieder, ohne ein wunderhaftes Erscheinen anzudeuten.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Johannes der Täufer
  rationale: Der Name und der etablierte Beiname werden nach geläufiger deutscher Bibel- und Standardsprache wiedergegeben. »Täufer« bezeichnet hier Johannes anhand seiner Tätigkeit.
- source_word: κηρύσσων
  choice: verkündete
  rationale: Das Partizip bezeichnet die mit seinem Auftreten verbundene Tätigkeit. Eine finite, mit »und« angeschlossene Form ist im Deutschen flüssig und bewahrt die Gleichzeitigkeit im Erzählzusammenhang.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: in der Wüste von Judäa
  rationale: ἔρημος bezeichnet eine unbewohnte, öde Gegend; »Wüste« ist dafür die geläufige deutsche Wiedergabe und muss keine Sandwüste meinen. Ἰουδαία bezeichnet die Region Judäa.
theological_decisions:
- issue: Wiedergabe des Beinamens βαπτιστής
  choice: der Täufer
  alternative: der Taufende
  rationale: »Der Täufer« ist im Deutschen der etablierte und semantisch zutreffende Beiname. Die ungewöhnlichere Alternative macht den Tätigkeitsbezug deutlicher, bietet hier aber keinen theologischen Präzisionsgewinn.
translation_notes:
  register: Moderne, würdige Standardsprache. »Trat … auf« entspricht idiomatischer deutscher Erzählweise; der Doppelpunkt weist darauf hin, dass in Vers 2 der Inhalt der Verkündigung folgt.
