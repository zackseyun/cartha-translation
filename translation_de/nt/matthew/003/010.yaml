id: MAT.3.10
reference: Matthew 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: de
  text: Schon liegt die Axt an der Wurzel der Bäume.[a] Darum wird jeder Baum, der keine gute Frucht hervorbringt, gefällt und ins Feuer geworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schon ist die Axt an die Wurzel der Bäume gelegt.“'
    reason: Die Zustandsbedeutung von κεῖται kann im Deutschen sowohl mit „liegt“ als auch mit dem resultativen „ist … gelegt“ ausgedrückt werden.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: Schon
  rationale: ἤδη bezeichnet die bereits eingetretene, dringliche Lage. δέ verbindet hier nur leicht mit dem Vorhergehenden und muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: ἡ ἀξίνη
  choice: die Axt
  rationale: Die übliche und bildlich klare Bezeichnung für das Werkzeug zum Fällen.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: liegt an der Wurzel der Bäume
  rationale: Gibt κεῖται unmittelbar mit „liegt“ wieder und bewahrt mit „an“ die räumliche Ausrichtung beziehungsweise Nähe von πρός.
- source_word: πᾶν οὖν δένδρον
  choice: Darum wird jeder Baum
  rationale: „Darum“ gibt die folgernde Funktion von οὖν in natürlichem modernem Deutsch wieder.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: der keine gute Frucht hervorbringt
  rationale: Das Partizip beschreibt den Baum durch sein ausbleibendes Erzeugnis; „hervorbringt“ ist natürlich und bleibt dem allgemeinen ποιέω näher als das idiomatische „trägt“.
- source_word: ἐκκόπτεται
  choice: wird gefällt
  rationale: Im Bild eines Baumes ist „fällen“ die präzise und idiomatische deutsche Entsprechung.
- source_word: καὶ εἰς πῦρ βάλλεται
  choice: und ins Feuer geworfen
  rationale: Bewahrt Handlung und Zielrichtung der griechischen Formulierung ohne das Feuer näher auszudeuten.
theological_decisions:
- issue: Bedeutung des Feuerbildes
  choice: „ins Feuer“ ohne erklärenden Zusatz
  alternative: ausdrückliche Deutung als endzeitliches Gericht, zeitliches Gericht oder Höllenfeuer
  rationale: Der Text gebraucht ein deutliches Gerichtsbild, legt dessen genaue dogmatische Reichweite in diesem Vers aber nicht ausdrücklich fest.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die knappe Bildsprache und der dringliche Ton des Ausgangstextes bleiben erhalten.
