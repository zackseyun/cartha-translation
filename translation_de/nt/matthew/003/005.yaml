id: MAT.3.5
reference: Matthew 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: de
  text: Da zogen Jerusalem, ganz Judäa und die ganze Gegend um den Jordan zu ihm hinaus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Da zogen sie immer wieder zu ihm hinaus.“ Das griechische Imperfekt kann einen fortdauernden oder wiederholten Vorgang ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Ganz Judäa“ und „die ganze Gegend um den Jordan“ sind weit gefasste geografische Angaben für den großen Zulauf zu Johannes; sie müssen nicht ausnahmslos jeden einzelnen Einwohner einschließen.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Der zeitliche Erzählanschluss wird im modernen Deutschen knapp und natürlich wiedergegeben.
- source_word: ἐξεπορεύετο
  choice: zogen … hinaus
  rationale: Das Verb bezeichnet die Bewegung hinaus zu Johannes. Die deutsche Vergangenheitsform liest sich natürlich; der durative oder wiederholte Aspekt des griechischen Imperfekts wird in Fußnote [a] kenntlich gemacht.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet bei einem Bewegungsverb die Bewegung auf eine Person zu; „zu ihm“ ist die idiomatische deutsche Entsprechung.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Die übliche deutsche Form des Ortsnamens; wie im Griechischen steht die Stadt metonymisch für ihre Bevölkerung.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: ganz Judäa
  rationale: Bewahrt die umfassende geografische Formulierung, ohne ausdrücklich zu behaupten, ausnahmslos jeder einzelne Einwohner sei gekommen.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: die ganze Gegend um den Jordan
  rationale: „Gegend um den Jordan“ gibt περίχωρος τοῦ Ἰορδάνου präzise und in natürlichem modernem Deutsch wieder.
- source_word: καὶ … καὶ
  choice: '[Aufzählung mit] und'
  rationale: Die drei geografischen Größen werden wie im Griechischen kumulativ miteinander verbunden.
theological_decisions:
- issue: Reichweite der geografischen Gesamtangaben
  choice: Die umfassenden Regionsbezeichnungen bleiben im Haupttext erhalten und werden als übliche kollektive beziehungsweise rhetorische Ausdrucksweise verstanden.
  alternative: Explizit „Menschen aus Jerusalem, aus ganz Judäa und aus der ganzen Jordangegend“ schreiben.
  rationale: Der griechische Text nennt die Gebiete selbst metonymisch. Die Übersetzung bewahrt dieses Bild und erläutert zugleich, dass daraus nicht zwingend die Teilnahme jedes einzelnen Bewohners folgt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Personifizierung der Orts- und Regionsnamen wird entsprechend dem griechischen Text bewahrt; der Plural des deutschen Verbs folgt der dreigliedrigen Aufzählung.
