id: MAT.3.13
reference: Matthew 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: de
  text: Dann kommt Jesus[a] aus Galiläa an den Jordan, zu Johannes, um sich von ihm taufen zu lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trifft ein“. Das griechische Verb steht im historischen Präsens und dient der lebendigen Erzählung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „um von ihm getauft zu werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Kennzeichnet den zeitlichen Fortgang der Erzählung knapp und natürlich.
- source_word: παραγίνεται
  choice: kommt
  rationale: Bewahrt das historische Präsens und damit die lebendige Erzählweise des Griechischen; je nach Zusammenhang ist auch „trifft ein“ möglich.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: aus Galiläa
  rationale: ἀπό bezeichnet den Ausgangspunkt; im Deutschen ist bei einer Herkunft aus einem Gebiet „aus“ idiomatisch.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: an den Jordan
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung zu einem Ort hin; „an den Jordan“ ist im Deutschen die natürliche Ortsangabe für das Flussufer.
- source_word: πρὸς τὸν Ἰωάννην
  choice: zu Johannes
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf eine Person zu. Der Titel „der Täufer“ wird nicht ergänzt, da er in diesem Vers nicht steht.
- source_word: τοῦ βαπτισθῆναι
  choice: um sich … taufen zu lassen
  rationale: Der artikulierte Infinitiv drückt den Zweck aus. Die deutsche Konstruktion gibt zugleich natürlich wieder, dass Jesus die Taufe empfängt.
- source_word: ὑπ’ αὐτοῦ
  choice: von ihm
  rationale: ὑπό mit Genitiv kennzeichnet den persönlichen Handelnden; das Pronomen wird entsprechend beibehalten.
theological_decisions:
- issue: Historisches Präsens παραγίνεται
  choice: Präsens „kommt“
  alternative: Präteritum „kam“
  rationale: Das Präsens erhält die erzählerische Unmittelbarkeit des griechischen Textes, ohne eine theologische Zusatzdeutung einzutragen.
- issue: Bezeichnung des Johannes
  choice: Nur „Johannes“
  alternative: „Johannes der Täufer“
  rationale: Der Vers selbst nennt lediglich Johannes; ein Titel aus dem weiteren Kontext wird nicht in den Wortlaut eingefügt.
- issue: Empfang der Taufe durch Jesus
  choice: „um sich von ihm taufen zu lassen“
  alternative: „um von ihm getauft zu werden“
  rationale: Beide Fassungen geben den passiven Infinitiv und die persönliche Urheberschaft korrekt wieder. Die gewählte Form ist in modernem Deutsch natürlicher und lässt die im Text ausgesagte Absicht bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens bleibt erhalten. Die Abfolge „an den Jordan zu Johannes“ bildet das Zielgebiet und die dort aufgesuchte Person ohne ein im Griechischen nicht vorhandenes „und“ ab.
