  verdict: approve
  source_fidelity: „Bringt also Frucht hervor“ gibt den aoristischen Imperativ ποιήσατε als deutliche Aufforderung im Plural wieder. „also“ bildet οὖν angemessen als Folgerung ab. Der kollektive Singular καρπόν bleibt mit „Frucht“ erhalten. Die Relativformulierung „die der Umkehr entspricht“ trifft ἄξιον τῆς μετανοίας als Angemessenheit beziehungsweise Entsprechung und vermeidet zutreffend eine meritorische Lesart.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und bewahrt zugleich einen angemessen würdevollen biblischen Registerton. „Frucht hervorbringen“ ist idiomatisch; die Umformung des attributiven griechischen Ausdrucks in einen Relativsatz ist natürlich und sinngetreu.
  terminology: „Umkehr“ ist für μετανοία in diesem johanneischen Kontext eine tragfähige, natürliche Wiedergabe. Sie vermittelt die geforderte Neuausrichtung, ohne μετανοία auf eine bloße gedankliche Sinnesänderung zu verengen. Die Fußnote bietet mit „der Umkehr würdig“ eine zulässige nähere formale Alternative; ihr Anker steht an der sachlich einschlägigen Stelle.
