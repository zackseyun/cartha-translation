  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: de
  text: Bringt also Frucht hervor, die der Umkehr entspricht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Frucht, die der Umkehr würdig ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: Bringt … hervor
  rationale: Der Aorist-Imperativ in der zweiten Person Plural fordert entschieden zum Handeln auf. „Frucht hervorbringen“ gibt ποιέω mit καρπός im Deutschen natürlich wieder, ohne zum im Griechischen nicht verwendeten Verb „Frucht tragen“ zu wechseln.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet knapp und natürlich die Folgerung aus der vorausgehenden Mahnung.
- source_word: καρπὸν
  choice: Frucht
  rationale: Der kollektive Singular und das Bild für sichtbare Auswirkungen im Verhalten bleiben erhalten.
- source_word: ἄξιον
  choice: die … entspricht
  rationale: ἄξιος mit Genitiv bezeichnet hier Angemessenheit beziehungsweise Entsprechung. Diese Formulierung ist im modernen Deutsch klarer als „der Umkehr würdig“ und vermeidet den Eindruck, die Frucht verdiene die Umkehr.
- source_word: μετανοίας
  choice: Umkehr
  rationale: „Umkehr“ erfasst in diesem Kontext die Neuausrichtung, zu der Johannes aufruft, natürlicher und umfassender als bloß „Sinnesänderung“.
theological_decisions:
- issue: Bedeutung von καρπὸν ἄξιον τῆς μετανοίας
  choice: Sichtbares Verhalten, das echter Umkehr entspricht
  alternative: Frucht, welche die Umkehr verdient oder ihr an Wert gleichkommt
  rationale: Die Genitivverbindung bezeichnet Angemessenheit beziehungsweise Übereinstimmung, nicht Verdienst. Der moralische Anspruch bleibt bestehen, ohne Werke als Ursache oder Kaufpreis der Umkehr darzustellen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die imperative Kraft, das Fruchtbild und der logische Anschluss an den Kontext bleiben erhalten.
