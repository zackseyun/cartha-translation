id: MAT.3.14
reference: Matthew 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: de
  text: 'Johannes aber versuchte ihn davon abzuhalten[a] und sagte: »Ich habe es nötig, von dir getauft zu werden, und du kommst zu mir?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wollte ihn davon abhalten«. Das griechische Imperfekt kann einen andauernden oder wiederholten Versuch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: versuchte ihn davon abzuhalten
  rationale: Das Imperfekt stellt den Widerstand des Johannes als andauernden oder versuchten Vorgang dar. Die Formulierung ist natürliches Deutsch, ohne eine wiederholte Handlung zwingend festzulegen.
- source_word: λέγων
  choice: und sagte
  rationale: Das griechische Partizip bezeichnet die begleitende Äußerung. Im modernen Deutschen verbindet eine finite Form den Widerstand und seine Begründung natürlicher als das schwerfällige »indem er sagte«.
- source_word: χρείαν ἔχω
  choice: Ich habe es nötig
  rationale: Die idiomatische Wendung bedeutet, etwas nötig zu haben. Diese Wiedergabe bewahrt die betonte Gegenüberstellung von ἐγώ und σύ und klingt würdig und verständlich.
- source_word: ὑπὸ σοῦ
  choice: von dir
  rationale: Bei dem passiven Infinitiv bezeichnet ὑπό mit Genitiv den Handelnden; »von dir« gibt dies im Deutschen präzise wieder.
- source_word: βαπτισθῆναι
  choice: getauft zu werden
  rationale: Der passive Infinitiv wird unmittelbar wiedergegeben. »Taufen« ist der etablierte Ausdruck und legt die konkrete Art des Vollzugs nicht über den Text hinaus fest.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: und du kommst zu mir?
  rationale: Die rhetorische Frage und der ausdrücklich gesetzte Gegensatz zwischen »ich« und »du« bleiben erhalten. Ein ergänztes »trotzdem« oder »ausgerechnet« würde den Kontrast stärker ausdeuten als der griechische Wortlaut.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier den Gegensatz zwischen dem Kommen Jesu und dem Widerstand des Johannes.
theological_decisions:
- issue: Einwand des Johannes gegen die Taufe Jesu
  choice: Die Aussage wird als Anerkennung der Überlegenheit Jesu und des eigenen Bedürfnisses des Johannes wiedergegeben, ohne dessen theologischen Grund näher zu bestimmen.
  alternative: Den Einwand ausdrücklich mit der Sündlosigkeit Jesu oder ausschließlich mit Rang und Autorität zu erklären.
  rationale: Der Vers selbst nennt keine vollständige Begründung. Die Übersetzung bewahrt daher die theologische Spannung und fügt keine spätere dogmatische Erklärung ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bewahrt die betonte Gegenüberstellung von Johannes und Jesus; die Verlaufsbedeutung des Imperfekts wird im Haupttext zurückhaltend und in der Fußnote erläutert.
