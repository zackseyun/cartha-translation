  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: de
  text: 'Und meint nicht, bei euch selbst sagen zu können[a]: »Wir haben Abraham zum Vater.« Denn ich sage euch: Gott kann Abraham aus diesen Steinen Kinder erwecken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in euch selbst sagen« beziehungsweise »untereinander sagen«. Die griechische Wendung kann sowohl inneres Selbstgespräch als auch Reden innerhalb der Gruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: meint nicht, … sagen zu können
  rationale: δόξητε bezeichnet hier das irrige oder selbstsichere Meinen, man könne sich auf diese Aussage berufen. Die deutsche Wendung gibt die Warnung natürlich wieder, ohne über das Verb hinaus ausdrücklich ein moralisch gefärbtes »sich anmaßen« einzutragen.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: bei euch selbst sagen
  rationale: Die pluralische Wendung kann inneres Selbstgespräch oder Reden im eigenen Kreis bezeichnen. »Bei euch selbst« bewahrt diese Schwebe besser als eine eindeutige Festlegung; die Fußnote nennt beide Möglichkeiten.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Wir haben Abraham zum Vater
  rationale: Die Formulierung bewahrt den nachdrücklichen Anspruch auf Abraham als Stammvater und klingt im modernen Deutschen würdig und verständlich.
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: Die Übersetzung erhält die begründende Funktion von γάρ und die feierliche direkte Redeformel.
- source_word: δύναται
  choice: kann
  rationale: »Kann« drückt Gottes Fähigkeit und Macht im heutigen Deutsch klar und natürlich aus; ein zusätzliches »ist imstande« wäre schwerfälliger.
- source_word: ἐκ τῶν λίθων τούτων
  choice: aus diesen Steinen
  rationale: »Aus« entspricht der Herkunftsangabe mit ἐκ und bewahrt das konkrete Bild.
- source_word: ἐγεῖραι
  choice: erwecken
  rationale: Das Verb meint hier, Kinder beziehungsweise Nachkommen entstehen oder hervortreten zu lassen. »Erwecken« erhält die Bildkraft und biblische Resonanz, ohne die Aussage ausdrücklich auf Auferstehung festzulegen.
- source_word: τέκνα
  choice: Kinder
  rationale: τέκνα ist nicht auf männliche Nachkommen beschränkt; »Kinder« ist daher präzise und natürlich.
- source_word: τῷ Ἀβραάμ
  choice: dem Abraham
  rationale: 'Der Dativ bezeichnet die Zuordnung zu Abraham: Gott kann ihm Kinder beziehungsweise Nachkommen erwecken. Der Artikel vor dem Namen entspricht einer im Deutschen möglichen biblisch-feierlichen Ausdrucksweise.'
theological_decisions:
- issue: Bedeutung der Abstammung von Abraham in der Warnung des Johannes
  choice: Die Übersetzung lässt die Warnung gegen das selbstsichere Vertrauen auf die leibliche Abstammung von Abraham hervortreten.
  alternative: Die Aussage entweder als bloße rhetorische Übertreibung ohne Kritik am Abstammungsprivileg oder als ausdrückliche Verwerfung beziehungsweise Ersetzung Israels zu deuten.
  rationale: Der Vers bestreitet, dass die Berufung auf Abraham Sicherheit gewährt, leugnet aber weder Abrahams historische Vaterschaft noch formuliert er ein späteres theologisches System. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer leicht feierlichen biblischen Sprachlage. Die Satzstruktur bleibt nah am Griechischen, ohne unnatürlich zu wirken; die genuine Mehrdeutigkeit von ἐν ἑαυτοῖς wird im Haupttext bewahrt und in der Fußnote erläutert.
