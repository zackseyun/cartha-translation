id: MAT.3.7
reference: Matthew 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: de
  text: 'Als er aber sah, dass viele aus den Reihen der Pharisäer und Sadduzäer zu seiner Taufe[a] kamen, sagte er zu ihnen: »Ihr Vipernbrut[b]! Wer hat euch gewarnt, vor dem kommenden Zorn[c] zu fliehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: zu der von Johannes vollzogenen Taufe. Der Wortlaut sagt hier nicht ausdrücklich, dass sie sich taufen ließen.'
    reason: Übersetzungs- und Auslegungsmehrdeutigkeit
  - marker: b
    text: 'Wörtlich: »Nachkommen von Vipern«; auch: »Schlangenbrut«.'
    reason: Lexikalische Alternative
  - marker: c
    text: 'Oder: »vor dem Zorn, der kommen wird«; auch: »vor dem bevorstehenden Zorn«.'
    reason: Lexikalische Alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Als er aber sah
  rationale: Das Aoristpartizip wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben; »aber« bewahrt die leichte Gegenüberstellung durch δέ.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: viele von den Pharisäern und Sadduzäern
  rationale: Die partitive Genitivkonstruktion bezeichnet viele Angehörige dieser Gruppen, nicht notwendig alle.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: zu seiner Taufe kamen
  rationale: Die Formulierung gibt die Bewegung hin zu der von Johannes ausgeübten Taufe knapp wieder, ohne ausdrücklich zu behaupten, dass die Betreffenden in diesem Vers tatsächlich getauft wurden.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Ihr Schlangenbrut!
  rationale: Die im Deutschen geläufige, scharfe Anrede bewahrt das Bild einer von Giftschlangen hervorgebrachten Nachkommenschaft. Das vorangestellte »Ihr« kennzeichnet den Vokativ natürlich.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Wer hat euch gewarnt
  rationale: ὑποδείκνυμι kann »zeigen«, »hinweisen« oder im Kontext einer drohenden Gefahr »warnen« bedeuten. Hier bringt »warnen« den dringlichen Sinn natürlich zum Ausdruck, ohne die rhetorische Frage aufzulösen.
- source_word: φυγεῖν ἀπὸ
  choice: vor … zu fliehen
  rationale: φυγεῖν bezeichnet eine dringliche Flucht. Die deutsche Verbindung »vor etwas fliehen« ist hier idiomatisch.
- source_word: τῆς μελλούσης ὀργῆς
  choice: dem kommenden Zorn
  rationale: μελλούσης bezeichnet das Bevorstehende; »kommender Zorn« wahrt sowohl die zeitliche als auch die gewichtige, wahrscheinlich endzeitliche Aussage.
theological_decisions:
- issue: Umfang der angesprochenen Gruppen
  choice: Johannes spricht viele Angehörige der Pharisäer und Sadduzäer an.
  alternative: Johannes spricht unterschiedslos sämtliche Pharisäer und Sadduzäer an.
  rationale: Die partitive Formulierung πολλοὺς τῶν bezeichnet eine Teilmenge und rechtfertigt keine pauschale Ausweitung auf jedes Mitglied beider Gruppen.
- issue: Absicht der Kommenden hinsichtlich der Taufe
  choice: Sie kommen zu der Taufe des Johannes; ob sie sich tatsächlich taufen lassen wollten oder ließen, bleibt in diesem Vers offen.
  alternative: Sie kamen ausdrücklich, um sich von Johannes taufen zu lassen.
  rationale: Der griechische Wortlaut nennt ihre Bewegung hin zur Taufe, formuliert aber nicht ausdrücklich den tatsächlichen Empfang der Taufe.
- issue: Bedeutung von ὀργή
  choice: Zorn
  alternative: Gericht oder Strafe
  rationale: »Zorn« entspricht dem griechischen Ausdruck unmittelbar und bewahrt seine theologische Spannung und wahrscheinlich endzeitliche Tragweite, ohne ihn auf Folgen wie Gericht oder Strafe zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die scharfe prophetische Anrede bleibt erhalten; zugleich werden die partitive Aussage und die Offenheit hinsichtlich der tatsächlichen Taufe nicht eingeebnet.
