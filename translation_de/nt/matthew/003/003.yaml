id: MAT.3.3
reference: Matthew 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: de
  text: 'Denn dieser ist es, von dem durch den Propheten Jesaja gesagt wurde: »Eine Stimme ruft in der Wüste[a]: Bereitet den Weg des Herrn[b], macht seine Pfade gerade!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit anderer Gliederung: »Eine Stimme ruft: Bereitet in der Wüste den Weg des Herrn …«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »des HERRN«; das Zitat greift Jesaja 40,3 auf, wo im hebräischen Text der Gottesname JHWH steht.'
    reason: divine_name_background
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν ὁ ῥηθεὶς
  choice: Denn dieser ist es, von dem … gesagt wurde
  rationale: Die Formulierung bewahrt den erklärenden Anschluss von γάρ, die hinweisende Kraft von οὗτος und die passive Aussage des substantivierten Partizips ὁ ῥηθεὶς, klingt dabei aber in modernem Deutsch natürlich.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: durch den Propheten Jesaja
  rationale: διά mit Genitiv bezeichnet hier die prophetische Vermittlung; „durch“ bildet diese Zwischeninstanz genauer ab als ein schlichtes „von“.
- source_word: Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ
  choice: Eine Stimme ruft in der Wüste
  rationale: Die idiomatische deutsche Form gibt φωνὴ βοῶντος verständlich wieder. „Wüste“ bezeichnet hier die unbewohnte Wildnis und wahrt zugleich den Anklang an Jesaja 40,3.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Bereitet den Weg des Herrn
  rationale: „Bereitet“ bewahrt den entschiedenen Imperativ, während „Weg“ sowohl die konkrete Bildsprache als auch ihre prophetische Bedeutung trägt.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: macht seine Pfade gerade
  rationale: Die Wiedergabe erhält das Straßenbild, den Imperativ und den persönlichen Bezug von αὐτοῦ. „Pfade“ passt zum poetisch-prophetischen Register.
theological_decisions:
- issue: Wiedergabe von κυρίου in einem Zitat aus Jesaja 40,3, wo der hebräische Text den Gottesnamen JHWH hat
  choice: des Herrn
  alternative: des HERRN
  rationale: Der griechische Matthäustext hat κυρίου und wird daher im Haupttext mit „des Herrn“ wiedergegeben. Dass der hebräische Ausgangstext den Gottesnamen JHWH nennt, wird in einer Fußnote offengelegt, ohne die Spannung zwischen griechischem Zitat und hebräischem Hintergrund einzuebnen.
- issue: Zuordnung von ἐν τῇ ἐρήμῳ innerhalb des Zitats
  choice: 'Eine Stimme ruft in der Wüste: Bereitet …'
  alternative: 'Eine Stimme ruft: Bereitet in der Wüste …'
  rationale: Die Hauptfassung folgt der naheliegenden griechischen Wortverbindung mit βοῶντος. Die alternative Gliederung ist aufgrund der Zeichensetzungs- und Überlieferungstradition von Jesaja 40,3 möglich und wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Die Einleitungsformel bleibt nah an der griechischen Syntax, ohne steif zu wirken; die wörtliche Rede ist für heutige Leser flüssig formuliert.
