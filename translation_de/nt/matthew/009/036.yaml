  source_fidelity: Die Übersetzung gibt den temporalen Bezug von Ἰδών, Jesu Erbarmen (ἐσπλαγχνίσθη), die Begründung durch ὅτι sowie die beiden passiven Partizipien ἐσκυλμένοι und ἐρριμμένοι sachgerecht wieder. „Bedrängt und niedergestreckt“ wahrt die Belastungs- und Niederwerfungsbildlichkeit, ohne die stärker interpretierende Wiedergabe „hilflos“ in den Haupttext zu verlagern. Der Vergleich mit führerlosen Schafen ist vollständig erhalten.
  naturalness: „Als er die Menschenmengen sah, hatte er tiefes Mitgefühl mit ihnen“ ist flüssiges modernes Standarddeutsch mit angemessen würdigem Register. „Bedrängt und niedergestreckt“ ist etwas bildhaft-markant, aber im Kontext bewusst und verständlich; es bewahrt die Metaphorik des griechischen Textes.
  terminology: „Menschenmengen“, „tiefes Mitgefühl“ und „Hirte“ sind treffend und registergerecht. Die Fußnote bietet die geläufigere, stärker ausdeutende Alternative „erschöpft und hilflos“ transparent an, ohne sie als einzige Bedeutung auszugeben. Der Fußnotenanker steht unmittelbar bei dem betroffenen Ausdruck.
