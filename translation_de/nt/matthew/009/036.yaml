id: MAT.9.36
reference: Matthew 9:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: de
  text: Als er die Menschenmengen sah, hatte er tiefes Mitgefühl mit ihnen; denn sie waren bedrängt und niedergestreckt[a], wie Schafe, die keinen Hirten haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „erschöpft und hilflos“. Die griechischen Wörter können Misshandlung und Niedergestrecktsein oder, stärker deutend, einen Zustand völliger Erschöpfung und Hilflosigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Als er … sah
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben. δέ führt die Erzählung nur leicht weiter und muss im Deutschen hier nicht eigens mit „und“ oder „aber“ markiert werden.
- source_word: τοὺς ὄχλους
  choice: die Menschenmengen
  rationale: Die Wiedergabe bezeichnet größere Ansammlungen von Menschen in gegenwärtigem, verständlichem Deutsch; „Volksmengen“ wäre weniger natürlich.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: hatte er tiefes Mitgefühl mit ihnen
  rationale: Das Verb bezeichnet innerlich bewegtes, starkes Erbarmen. „Tiefes Mitgefühl“ bewahrt die Intensität in natürlichem modernem Deutsch, ohne die griechische Körpermetaphorik hölzern nachzubilden.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion führt den Grund für Jesu Mitgefühl an. „Denn“ stellt diesen Begründungszusammenhang in einem würdigen und flüssigen deutschen Satz klar heraus.
- source_word: ἐσκυλμένοι
  choice: bedrängt
  rationale: Das Partizip kann Misshandlung, Bedrängnis und daraus folgende Erschöpfung ausdrücken. „Bedrängt“ wahrt die passive Notlage, ohne die Stärke des Ausdrucks einseitig festzulegen.
- source_word: ἐρριμμένοι
  choice: niedergestreckt
  rationale: Das Perfektpartizip von ῥίπτω enthält das Bild des Hingeworfenseins beziehungsweise Am-Boden-Liegens. „Niedergestreckt“ erhält dieses Bild besser als das stärker deutende „hilflos“.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: wie Schafe, die keinen Hirten haben
  rationale: Die Formulierung bewahrt Vergleich und Hirtenmetapher unmittelbar und klingt zugleich natürlich auf Deutsch.
theological_decisions:
- issue: Sprache für Jesu Erbarmen
  choice: hatte er tiefes Mitgefühl mit ihnen
  alternative: wurde er von Erbarmen über sie ergriffen
  rationale: Die gewählte Fassung vermittelt Jesu tiefes Erbarmen klar, ohne durch eine altertümliche oder allzu wörtliche Formulierung zusätzliche theologische Akzente einzutragen.
- issue: Zustand der Menschenmengen
  choice: bedrängt und niedergestreckt
  alternative: erschöpft und hilflos
  rationale: Die gewählte Fassung bleibt näher an der passiven und bildhaften Kraft der beiden griechischen Partizipien. Die Alternative beschreibt stärker den daraus resultierenden Zustand und wird deshalb als mögliche Deutung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt anschaulich und gut verständlich; die ungewöhnliche Bildkraft der beiden griechischen Partizipien wird im Haupttext bewahrt, während die verbreitete stärker deutende Lesart in der Fußnote erscheint.
