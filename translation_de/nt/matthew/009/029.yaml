id: MAT.9.29
reference: Matthew 9:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: de
  text: 'Dann berührte er ihre Augen und sagte: »Euch geschehe nach eurem Glauben.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Euch geschehe nach eurem Vertrauen.« Das griechische Wort pistis kann auch »Vertrauen« und in manchen Zusammenhängen »Treue« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das temporale Adverb führt den nächsten Vorgang in der Erzählfolge ein; »Dann« ist knapp und natürlich.
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: berührte er ihre Augen
  rationale: ἅπτομαι mit Genitiv bezeichnet hier eine körperliche Berührung. Im natürlichen Deutschen steht das Berührte im Akkusativ.
- source_word: λέγων
  choice: und sagte
  rationale: Das präsentische Partizip bezeichnet eine Begleithandlung. Die Auflösung als koordinierter Satz ist im modernen Deutschen flüssiger als »sagend«.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: nach eurem Glauben
  rationale: κατά mit Akkusativ bezeichnet hier Maß oder Entsprechung. »Nach eurem Glauben« bewahrt diese Beziehung, ohne ausdrücklich eine Ursache zu behaupten.
- source_word: γενηθήτω ὑμῖν
  choice: Euch geschehe
  rationale: Der Aorist-Passiv-Imperativ von γίνομαι ist eine wirksame Zusage beziehungsweise Anordnung. »Euch geschehe« erhält Imperativkraft, Passivgedanken und Dativ in einer im biblischen Ausspruch würdigen, verständlichen Form.
theological_decisions:
- issue: Bedeutung von πίστις im Heilungsausspruch
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Im unmittelbaren Zusammenhang bezeichnet πίστις das Vertrauen der Blinden auf Jesu Fähigkeit zu heilen. »Glaube« ist die geläufige und sachlich offene Hauptwiedergabe; die kontextuell mögliche Verdeutlichung »Vertrauen« wird in der Fußnote genannt. »Treue« ist lexikalisch möglich, passt hier jedoch weniger gut.
- issue: Verhältnis des Glaubens zum Geschehen
  choice: nach eurem Glauben
  alternative: aufgrund eures Glaubens; eurem Glauben entsprechend
  rationale: Die Übersetzung bewahrt die durch κατά ausgedrückte Entsprechung und legt nicht eindeutiger als der griechische Text fest, ob der Glaube als Ursache, Voraussetzung oder Maß beschrieben wird.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht gehobenem Ton. Die kurze Wunsch-/Befehlsform »Euch geschehe« spiegelt den prägnanten performativen Charakter des griechischen Ausspruchs; die Wortstellung ist verständlich, ohne unnötig altertümlich zu wirken.
