id: MAT.9.14
reference: Matthew 9:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: de
  text: 'Dann kamen die Jünger des Johannes zu ihm und fragten: »Warum fasten wir und die Pharisäer oft,[a] deine Jünger aber fasten nicht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »viel« beziehungsweise »viele Male«. Das griechische πολλά bezeichnet beim Fasten eine häufige Praxis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Natürlicher temporaler Erzählanschluss, der die folgende Begebenheit in die Ereignisfolge einordnet.
- source_word: προσέρχονται αὐτῷ
  choice: kamen ... zu ihm
  rationale: Gibt die Bewegung auf Jesus zu idiomatisch und ohne unnötig gehobenen Ton wieder; das historische Präsens wird im deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: die Jünger des Johannes
  rationale: Natürliche deutsche Wiedergabe des Genitivs; zugleich eindeutig und würdevoll.
- source_word: λέγοντες
  choice: und fragten
  rationale: Der Inhalt ist ausdrücklich eine Frage. Die finite Koordination ist im modernen Deutschen natürlicher als ein wörtliches »sagend«.
- source_word: Διὰ τί
  choice: Warum
  rationale: Direkte und idiomatische Wiedergabe der Frage nach dem Grund.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: wir und die Pharisäer
  rationale: Bewahrt das ausdrücklich gesetzte und damit hervorgehobene Pronomen ἡμεῖς sowie die gemeinsame Vergleichsgruppe.
- source_word: νηστεύομεν
  choice: fasten
  rationale: Der geläufige deutsche religiöse Begriff bezeichnet den bewussten Verzicht auf Nahrung, ohne den Text auszudeuten.
- source_word: πολλά
  choice: oft
  rationale: Das substantivierte Neutrum Plural wird bei νηστεύω adverbial gebraucht und bezeichnet hier am natürlichsten eine häufige Praxis.
- source_word: οἱ δὲ μαθηταί σου
  choice: deine Jünger aber
  rationale: Die Nachstellung von »aber« bildet den Kontrast des griechischen δέ idiomatisch ab.
- source_word: οὐ νηστεύουσιν
  choice: fasten nicht
  rationale: Das Präsens beschreibt im Zusammenhang eine übliche Praxis; die schlichte Präsensform erhält diese Offenheit.
theological_decisions:
- issue: Art des Einwands gegen die Fastenpraxis
  choice: Die Frage wird als Vergleich einer üblichen religiösen Praxis wiedergegeben.
  alternative: Sie könnte als Vorwurf verstanden werden, Jesu Jünger missachteten eine Pflicht, oder ausschließlich auf einen einzelnen Fastentag bezogen werden.
  rationale: Die Präsensformen und πολλά sprechen für ein wiederkehrendes Verhalten. Die Übersetzung bewahrt den fragenden Kontrast, ohne daraus ausdrücklich eine Pflichtverletzung oder einen einmaligen Anlass zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das historische Präsens wurde entsprechend natürlichem deutschen Erzählgebrauch im Präteritum wiedergegeben. Die direkte Rede bleibt knapp und erhält die betonte Gegenüberstellung.
