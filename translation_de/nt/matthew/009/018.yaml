id: MAT.9.18
reference: Matthew 9:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: de
  text: 'Während er noch so zu ihnen redete, kam auf einmal ein Vorsteher, warf sich vor ihm nieder und sagte: »Meine Tochter ist gerade gestorben. Doch komm und leg ihr deine Hand auf, dann wird sie leben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: auf einmal
  rationale: Markiert natürlich und aufmerksamkeitslenkend das unerwartete Eintreten des Vorstehers, ohne das im heutigen Deutsch unnatürliche »siehe«.
- source_word: ἄρχων
  choice: Vorsteher
  rationale: Gibt die allgemeine Amts- oder Leitungsbezeichnung wieder, ohne aus den Parallelberichten eine ausdrücklich synagogale Amtsbezeichnung einzutragen.
- source_word: προσεκύνει
  choice: warf sich vor ihm nieder
  rationale: Beschreibt die körperliche Huldigung bzw. ehrerbietige Niederwerfung, ohne die Handlung hier zwingend als kultische Anbetung festzulegen.
- source_word: ἄρτι ἐτελεύτησεν
  choice: ist gerade gestorben
  rationale: Gibt sowohl die unmittelbare Zeitangabe als auch den eindeutigen Tod der Tochter direkt wieder.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: leg ihr deine Hand auf
  rationale: Natürliche deutsche Wiedergabe der Bitte um eine konkrete Handauflegung.
- source_word: ζήσεται
  choice: wird sie leben
  rationale: Bewahrt die bestimmte Zukunftsaussage des Vaters.
theological_decisions:
- issue: Bedeutung der Niederwerfung vor Jesus
  choice: warf sich vor ihm nieder
  alternative: betete ihn an
  rationale: Das Verb προσκυνέω kann Anbetung oder ehrerbietige Huldigung bezeichnen. Der unmittelbare Kontext legt die genaue theologische Einordnung der Geste nicht ausdrücklich fest; die Übersetzung wahrt diese Offenheit.
- issue: Identität und Amt des ἄρχων
  choice: Vorsteher
  alternative: Synagogenvorsteher
  rationale: Matthäus selbst nennt ihn an dieser Stelle nur ἄρχων. Die genauere Amtsangabe aus Markus und Lukas wird nicht harmonisierend in den Text übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Während er noch so zu ihnen redete« wahrt den laufenden Redevorgang; »auf einmal« bildet die aufmerksamkeitslenkende Erzählbewegung idiomatisch ab. Die direkte Rede bleibt klar und knapp.
