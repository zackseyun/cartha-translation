  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: de
  text: Doch niemand bringt einen Flicken aus noch nicht eingelaufenem Stoff an einem alten Kleidungsstück[a] an; denn der Flicken reißt sich vom Kleidungsstück los, und der Riss wird noch schlimmer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus noch nicht gewalktem Stoff“. Das griechische Wort bezeichnet Stoff, der noch nicht entsprechend bearbeitet wurde und deshalb später einläuft und am alten Kleidungsstück zieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: Doch niemand
  rationale: δὲ markiert hier einen leichten Gegensatz beziehungsweise Übergang; „Doch“ verbindet den Satz natürlich mit dem vorausgehenden Bild, während „niemand“ die uneingeschränkte Verneinung wiedergibt.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: setzt einen Flicken … auf
  rationale: ἐπιβάλλει bedeutet wörtlich „daraufsetzen/-legen“; „setzt … auf“ bewahrt diese Allgemeinheit, ohne das im Zusammenhang naheliegende Annähen ausdrücklich in den griechischen Wortlaut hineinzutragen. ἐπίβλημα bezeichnet hier eindeutig einen Flicken.
- source_word: ῥάκους ἀγνάφου
  choice: aus noch nicht eingelaufenem Stoff
  rationale: ἄγναφος bezeichnet Stoff, der noch nicht gewalkt beziehungsweise abschließend bearbeitet wurde. „Noch nicht eingelaufen“ macht die für das Bild entscheidende Folge in heutigem Deutsch verständlich; die genauere handwerkliche Alternative steht in der Fußnote.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: auf ein altes Kleidungsstück
  rationale: ἱμάτιον kann allgemein ein Kleidungsstück, häufig ein Obergewand, bezeichnen. „Kleidungsstück“ bleibt breit und ist im modernen Deutsch natürlicher als das kontextuell möglicherweise zu enge „Mantel“.
- source_word: αἴρει … ἀπὸ τοῦ ἱματίου
  choice: zieht sich von dem Kleidungsstück ab
  rationale: αἴρει hat hier im Zusammenhang die Wirkung des Ablösens beziehungsweise Wegziehens. Die reflexive Formulierung gibt den Vorgang natürlich wieder, ohne die stärkere Bedeutung „reißt ab“ zwingend festzulegen.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: der Flicken
  rationale: Wörtlich handelt es sich um „seine Füllung/das Füllstück“; gemeint ist das aufgesetzte Stück, also der Flicken. Die Wiederaufnahme als „der Flicken“ ist klar und idiomatisch.
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: und der Riss wird noch schlimmer
  rationale: Die Formulierung wahrt den Komparativ χεῖρον und gibt γίνεται als eintretende Verschlimmerung wieder. Das bestimmte „der Riss“ entspricht im Deutschen dem bereits vorausgesetzten Schaden am alten Kleidungsstück.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchcharakter. „Kleidungsstück“ vermeidet eine unnötige Festlegung auf eine bestimmte Gewandart; die fachsprachliche Textilbezeichnung wird in der Fußnote bewahrt.
