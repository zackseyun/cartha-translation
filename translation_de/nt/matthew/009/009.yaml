id: MAT.9.9
reference: Matthew 9:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: de
  text: 'Als Jesus von dort weiterging, sah er einen Mann namens Matthäus am Zollstand sitzen. Er sagt[a] zu ihm: »Folge mir!« Da stand er auf und folgte ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er sagte zu ihm«; im Griechischen steht zur lebendigen Vergegenwärtigung das historische Präsens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: als Jesus von dort weiterging
  rationale: Das Präsenspartizip bezeichnet die begleitende, noch andauernde Bewegung vom vorherigen Ort weg. Die Formulierung ist im Deutschen natürlich und gibt ἐκεῖθεν ausdrücklich wieder.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Gemeint ist hier eine konkrete männliche Person; daher ist »Mann« sachlich und sprachlich passend.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: am Zollstand sitzen
  rationale: τελώνιον bezeichnet die Stelle, an der Zölle oder Abgaben erhoben wurden. »Zollstand« ist anschaulich und vermeidet die modern-institutionelle Vorstellung eines größeren »Finanzamts«.
- source_word: Μαθθαῖον λεγόμενον
  choice: namens Matthäus
  rationale: Die Wendung bezeichnet den Namen, unter dem der Mann bekannt ist. »Namens Matthäus« ist präzise und idiomatisch.
- source_word: λέγει αὐτῷ
  choice: er sagt zu ihm
  rationale: Das historische Präsens des griechischen Erzähltextes wird zur Wahrung seiner lebendigen Wirkung beibehalten; eine Fußnote nennt die im Deutschen mögliche Vergangenheitsform.
- source_word: Ἀκολούθει μοι
  choice: Folge mir!
  rationale: Der Imperativ wird knapp und ohne erklärende Zusätze wiedergegeben. So bleiben sowohl die konkrete Aufforderung als auch ihre Bedeutung als Ruf in die Nachfolge erhalten.
- source_word: ἀναστὰς
  choice: da stand er auf
  rationale: Das Aoristpartizip bezeichnet die der Nachfolge unmittelbar vorausgehende Reaktion. »Da« macht den engen erzählerischen Anschluss natürlich deutlich, ohne eine zusätzliche Begründung einzutragen.
- source_word: ἠκολούθησεν αὐτῷ
  choice: und folgte ihm
  rationale: Die Formulierung bewahrt sowohl den konkreten Vorgang als auch den möglichen Jüngerschaftssinn, ohne diesen ausdeutend festzulegen.
theological_decisions:
- issue: Charakter des Rufes Jesu an Matthäus
  choice: »Folge mir!« ohne erklärende Erweiterung
  alternative: »Werde mein Jünger!« oder »Komm mit mir!«
  rationale: Der Zusammenhang zeigt einen Ruf in die Nachfolge, doch der griechische Wortlaut formuliert schlicht einen Imperativ. Die knappe Wiedergabe bewahrt die theologische Tragweite, ohne sie paraphrasierend festzulegen.
- issue: Historisches Präsens in Jesu Anrede
  choice: »Er sagt zu ihm«
  alternative: »Er sagte zu ihm«
  rationale: Das Präsens entspricht der Form λέγει und erhält die erzählerische Unmittelbarkeit. Da das deutsche Präteritum ebenfalls idiomatisch wäre, wird diese Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. »Zollstand« vermittelt den antiken Ort der Abgabenerhebung verständlich, ohne einen modernen Behördenapparat anzudeuten. Das historische Präsens wird bewusst beibehalten und erläutert.
