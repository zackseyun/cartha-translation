base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: de
  text: 'Denn sie sagte sich immer wieder: »Wenn ich nur sein Gewand berühre, werde ich gerettet.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werde ich geheilt« oder »werde ich gesund«. Im Griechischen steht »werde ich gerettet«; das verwendete Verb kann in diesem Zusammenhang auch Heilung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte sich immer wieder
  rationale: Der Imperfekt bezeichnet hier fortdauerndes oder wiederholtes inneres Sprechen; die Formulierung gibt diesen Aspekt in natürlichem Deutsch wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erklärt das Geschehen im umgebenden Erzählzusammenhang.
- source_word: ἐν ἑαυτῇ
  choice: sich
  rationale: 'In Verbindung mit dem Verb des Sagens ist dies die natürliche deutsche Wiedergabe für inneres Sprechen: »sie sagte sich«.'
- source_word: Ἐὰν μόνον
  choice: Wenn ich nur
  rationale: Die Wendung bezeichnet eine stark hervorgehobene Mindestbedingung; »wenn … nur« gibt sowohl die Bedingung als auch die Fokussierung wieder.
- source_word: ἅψωμαι
  choice: berühre
  rationale: Der Aorist Konjunktiv nach ἐάν wird in einem zukunftsbezogenen Bedingungssatz idiomatisch mit deutschem Präsens wiedergegeben. Das Verb bedeutet hier »berühren«, nicht notwendig »ergreifen«.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: sein Gewand
  rationale: ἱμάτιον bezeichnet ein Kleidungsstück, häufig das Obergewand. »Gewand« wahrt die Breite des Ausdrucks, ohne die Art des Kleidungsstücks stärker festzulegen als der Text.
- source_word: σωθήσομαι
  choice: werde ich gerettet werden
  rationale: Das Futur Passiv von σῴζω kann Rettung wie auch Heilung bzw. Gesundwerden bezeichnen. Die Hauptfassung bewahrt den breiteren Wortlaut, während die Fußnote den im Kontext naheliegenden körperlichen Sinn nennt.
theological_decisions:
- issue: Wiedergabe von σωθήσομαι in einem Heilungskontext
  choice: werde ich gerettet werden
  alternative: werde ich geheilt werden / werde ich gesund werden
  rationale: Der unmittelbare Zusammenhang betrifft körperliche Heilung, doch der griechische Text verwendet das semantisch breitere σῴζω. »Gerettet werden« erhält dessen mögliche weitergehende Resonanz, ohne sie auszudeuten; die Fußnote macht den kontextuellen Heilungssinn transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sagte sich immer wieder« bewahrt den imperfektischen Aspekt, ohne unnatürlich zu klingen. Die wörtlich breitere Rettungssprache bleibt im Haupttext erhalten und wird durch eine knappe Fußnote kontextuell erläutert.
