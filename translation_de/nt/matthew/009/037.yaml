  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: de
  text: 'Dann sagt er[a] zu seinen Jüngern: »Die Ernte ist zwar groß, aber es gibt nur wenige Arbeiter.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische verwendet hier ein historisches Präsens: »sagt«. Möglich ist im Deutschen auch: »sagte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Kennzeichnet knapp und natürlich die zeitliche Abfolge der Erzählung.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt das historische Präsens des griechischen Erzählstils und dessen lebendige Wirkung.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: Gibt sowohl μαθηταῖς mit dem geläufigen Begriff »Jünger« als auch das ausdrücklich gesetzte Possessivpronomen αὐτοῦ wieder.
- source_word: Ὁ μὲν … οἱ δὲ
  choice: zwar … aber
  rationale: Bildet den durch μέν und δέ markierten Gegensatz in natürlichem modernem Deutsch ab.
- source_word: θερισμός
  choice: Ernte
  rationale: Bewahrt das landwirtschaftliche Bild des Ausgangstextes und ist die etablierte deutsche Entsprechung.
- source_word: πολύς
  choice: groß
  rationale: »Groß« bezeichnet hier idiomatisch den Umfang der Ernte, ohne das Bild erklärend auszudeuten.
- source_word: ἐργάται
  choice: Arbeiter
  rationale: Ist eine klare, gegenwärtige und kontextgerechte Wiedergabe für diejenigen, die bei der Ernte arbeiten.
- source_word: ὀλίγοι
  choice: nur wenige
  rationale: Die Formulierung »es gibt nur wenige« gibt den prädikativen Gegensatz idiomatisch wieder; »nur« verdeutlicht dabei die im Kontrast liegende Begrenztheit, ohne ein ausdrückliches »zu wenige« einzutragen.
theological_decisions:
- issue: Bildhafte Bedeutung der Ernte
  choice: Das landwirtschaftliche Bild bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Ernte ausdrücklich als Menschen deuten, die für Jesu Wirken bereit sind.
  rationale: Der Vers selbst nennt nur das Bild. Seine Bedeutung soll aus dem Zusammenhang hervorgehen und nicht durch eine interpretierende Paraphrase im Haupttext festgelegt werden.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Das historische Präsens und der knappe Gegensatz des griechischen Satzes bleiben erhalten.
