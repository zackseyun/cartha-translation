id: MAT.9.20
reference: Matthew 9:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: de
  text: 'Und sieh da: Eine Frau, die seit zwölf Jahren an Blutungen litt, trat von hinten an ihn heran und berührte den Saum[a][b] seines Gewandes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Quaste«, »Franse« oder »Rand«; das griechische Wort kann den Saum beziehungsweise Rand eines Kleidungsstücks bezeichnen und möglicherweise auch die daran befindliche Quaste oder Franse.
    reason: lexical_alternative
  - marker: b
    text: Zum Hintergrund der Quasten beziehungsweise Fransen an den Kleidern im Gesetz Israels siehe 4. Mose 15,38 und 5. Mose 22,12.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Und sieh da
  rationale: Gibt sowohl die Verknüpfung durch καί als auch den aufmerksamkeitslenkenden, überraschenden Erzählton von ἰδού wieder, ohne das Signalwort auszulassen.
- source_word: γυνὴ
  choice: eine Frau
  rationale: Entspricht der unbestimmten Einführung der Frau im griechischen Text.
- source_word: αἱμορροοῦσα
  choice: die … an Blutungen litt
  rationale: Drückt den andauernden krankhaften Blutfluss in natürlichem modernem Deutsch aus. Der Plural „Blutungen“ vermeidet den Eindruck eines einmaligen akuten Ereignisses.
- source_word: δώδεκα ἔτη
  choice: seit zwölf Jahren
  rationale: Gibt den Akkusativ der zeitlichen Ausdehnung idiomatisch wieder und passt zur im Deutschen gewählten Vergangenheitsform.
- source_word: προσελθοῦσα ὄπισθεν
  choice: trat von hinten an ihn heran
  rationale: Bewahrt sowohl die Annäherung als auch die Angabe, dass sie sich Jesus von hinten näherte.
- source_word: ἥψατο
  choice: berührte
  rationale: Der mediale Aorist von ἅπτω bezeichnet hier eine Berührung; stärkere Wiedergaben wie „ergriff“ würden den Kontakt überzeichnen.
- source_word: τοῦ κρασπέδου
  choice: den Saum
  rationale: κράσπεδον kann den Rand beziehungsweise Saum eines Kleidungsstücks und in diesem Zusammenhang möglicherweise eine daran befindliche Quaste oder Franse bezeichnen. „Saum“ ist im Haupttext natürlich und legt die genaue textile Form nicht fest; die Alternativen werden in der Fußnote erhalten.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: seines Gewandes
  rationale: „Gewand“ gibt ἱμάτιον hinreichend allgemein wieder, ohne es enger als Mantel oder Robe zu bestimmen.
theological_decisions:
- issue: Möglicher Bezug von κράσπεδον auf die vorgeschriebenen Quasten beziehungsweise Fransen israelitischer Kleidung
  choice: Im Haupttext allgemein mit „Saum“ wiedergeben und den möglichen kulturell-rechtlichen Hintergrund in Fußnoten nennen
  alternative: Mit „Quaste“ oder „Franse“ übersetzen und dadurch den Bezug auf Numeri 15,38 und Deuteronomium 22,12 stärker hervorheben
  rationale: Der griechische Ausdruck lässt den Bezug auf eine Quaste oder Franse zu, bezeichnet aber auch den Kleidungsrand. Der Vers entfaltet die mögliche Symbolik nicht ausdrücklich. Die allgemeine Wiedergabe vermeidet eine vorschnelle Festlegung, während die Fußnoten die echte lexikalische und kulturelle Möglichkeit offenhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Und sieh da“ bewahrt bewusst den lebhaften Aufmerksamkeitshinweis des griechischen Textes; „an Blutungen litt“ beschreibt die chronische Erkrankung natürlich und ohne unnötig technische Sprache.
