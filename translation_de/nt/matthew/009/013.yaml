id: MAT.9.13
reference: Matthew 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: de
  text: 'Geht aber hin und lernt, was das bedeutet: »Barmherzigkeit will ich und nicht Opfer.«[a] Denn ich bin nicht gekommen, Gerechte zu rufen, sondern Sünder.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat aus Hosea 6,6.
    reason: cross_reference
  - marker: b
    text: Mit »Gerechte« können hier möglicherweise Menschen gemeint sein, die sich selbst für gerecht halten; der griechische Text sagt lediglich »Gerechte«.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: Geht aber hin und lernt
  rationale: Das Aoristpartizip πορευθέντες bildet mit dem Imperativ μάθετε eine idiomatische Aufforderung. Die deutsche Verbindung „Geht … hin und lernt“ bewahrt sowohl die Bewegung als auch den zurechtweisenden Ton.
- source_word: τί ἐστιν
  choice: was das bedeutet
  rationale: Die idiomatische Wiedergabe bezeichnet das Erfassen des Sinnes des folgenden Schriftwortes; das wörtlichere „was das ist“ bleibt als mögliche Formulierung denkbar, klingt hier aber weniger natürlich.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: „Barmherzigkeit“ ist die geläufige, würdige Wiedergabe und trägt sowohl die ethische als auch die bundestheologische Färbung des Zitats aus Hosea.
- source_word: θέλω
  choice: will ich
  rationale: „Will ich“ gibt die göttliche Willensäußerung direkt wieder und entspricht der vertrauten, zugleich modernen Sprache eines Schriftzitats.
- source_word: θυσίαν
  choice: Opfer
  rationale: Die Singularform wird direkt bewahrt; der Ausdruck bezeichnet das kultische Opfer, ohne den Gegensatz interpretierend auszuweiten.
- source_word: οὐ γὰρ ἦλθον
  choice: Denn ich bin nicht gekommen
  rationale: Das deutsche Perfekt ist in heutiger Standardsprache für Jesu Aussage über den Zweck seines Kommens natürlich und erhält den Missionsbezug.
- source_word: καλέσαι
  choice: zu rufen
  rationale: „Rufen“ wahrt die Breite des griechischen Verbs zwischen Aufforderung, Einladung und Berufung, ohne eine Bedeutung festzulegen.
- source_word: δικαίους
  choice: Gerechte
  rationale: Das substantivierte Adjektiv wird ebenso knapp wiedergegeben. Ob tatsächlich Gerechte oder Menschen mit eigener Gerechtigkeitsüberzeugung gemeint sind, wird nicht in den Haupttext eingetragen.
- source_word: ἁμαρτωλούς
  choice: Sünder
  rationale: Die herkömmliche substantivische Wiedergabe erhält den scharfen Gegensatz zu „Gerechte“.
theological_decisions:
- issue: Kraft des Zitats aus Hosea 6,6
  choice: Den prophetischen Gegensatz direkt als „Barmherzigkeit will ich und nicht Opfer“ wiedergeben.
  alternative: Den Satz entweder als vollständige Verwerfung jedes Opfers oder nur als situationsbedingte Vorliebe paraphrasieren.
  rationale: Der griechische Wortlaut formuliert einen zugespitzten Gegensatz. Die Übersetzung bewahrt diese Spannung, ohne daraus im Text ein umfassendes Urteil über jedes Opfer abzuleiten.
- issue: Bezug von „Gerechte“
  choice: Den Ausdruck ohne erklärenden Zusatz als „Gerechte“ übersetzen.
  alternative: „Menschen, die sich für gerecht halten“ oder „Selbstgerechte“.
  rationale: Der Kontext kann eine ironische oder kritische Lesart nahelegen, doch der griechische Text kennzeichnet sie nicht ausdrücklich. Daher bleibt die mögliche Spannung zwischen wirklicher und beanspruchter Gerechtigkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper Satzführung. Das Schriftzitat bleibt markant und die theologische Mehrdeutigkeit von „Gerechte“ wird nicht im Haupttext aufgelöst. Alle Fußnotenmarker stehen unmittelbar an der jeweils erläuterten Stelle.
