  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: de
  text: Und als Jesus im Haus[a] zu Tisch lag, siehe, da kamen viele Steuereinnehmer und Sünder und lagen mit Jesus und seinen Jüngern zu Tisch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers selbst sagt nicht ausdrücklich, wessen Haus es war.
    reason: alternative_reading
  - marker: b
    text: 'Natürlicher könnte man sagen: „während Jesus im Haus aß“. Das Griechische bezeichnet genauer das damalige Liegen bei Tisch während einer Mahlzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Und als
  rationale: Die Wendung καὶ ἐγένετο dient hier als erzählerischer Übergang. „Und als“ gibt ihren zeitlichen und narrativen Sinn natürlich wieder, ohne das im Deutschen schwerfällige „Und es geschah“.
- source_word: αὐτοῦ ἀνακειμένου
  choice: als Jesus ... zu Tisch lag
  rationale: Das Pronomen wird im Deutschen zur eindeutigen Bezugnahme mit „Jesus“ wiedergegeben. ἀνάκειμαι bezeichnet im Mahlkontext das damalige Liegen bei Tisch, nicht gewöhnliches Sitzen.
- source_word: ἐν τῇ οἰκίᾳ
  choice: im Haus
  rationale: Die Übersetzung bewahrt die bestimmte, aber hinsichtlich des Besitzers nicht näher bezeichnete Ortsangabe und legt nicht fest, wessen Haus gemeint ist.
- source_word: ἰδοὺ
  choice: auf einmal
  rationale: ἰδού lenkt als lebhafter Diskursmarker die Aufmerksamkeit auf die folgende Szene. „Auf einmal“ markiert den auffälligen Einsatz im natürlichen modernen Deutsch, ohne das heute altertümliche „siehe“ zu verwenden.
- source_word: τελῶναι
  choice: Zolleinnehmer
  rationale: „Zolleinnehmer“ ist im neutestamentlichen historischen Umfeld genauer als das moderne „Steuereinnehmer“, da τελῶναι Abgaben und Zölle im gepachteten Einnahmesystem erhoben.
- source_word: ἁμαρτωλοὶ
  choice: Sünder
  rationale: Das substantivierte Adjektiv bezeichnet hier Menschen unter einer sozialen und religiösen Einordnung. „Sünder“ erhält diese knappe, spannungsreiche Bezeichnung.
- source_word: ἐλθόντες
  choice: kamen
  rationale: Das Aoristpartizip wird als finite Handlung im Deutschen natürlich in die Erzählfolge eingefügt.
- source_word: συνανέκειντο
  choice: lagen mit ... zu Tisch
  rationale: Das Verb bezeichnet das gemeinsame Liegen beim Mahl und damit zugleich die sichtbare Tischgemeinschaft. Die konkrete historische Körperhaltung bleibt erhalten.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: seinen Jüngern
  rationale: „Jünger“ ist die etablierte und sachgerechte deutsche Wiedergabe von μαθηταί im Evangelienkontext.
theological_decisions:
- issue: Körperhaltung und Tischgemeinschaft
  choice: Das konkrete „zu Tisch liegen“ wird beibehalten.
  alternative: „aßen“, „speisten“ oder „saßen zu Tisch“
  rationale: Die Formulierung erhält sowohl die damalige Mahlhaltung als auch das Motiv gemeinsamer Tischgemeinschaft, ohne zusätzliche theologische Aussagen in den Text einzutragen.
- issue: Identität des Hauses
  choice: Im Haupttext steht nur „im Haus“.
  alternative: „in seinem Haus“ oder „im Haus des Matthäus“
  rationale: Der griechische Vers nennt keinen Besitzer ausdrücklich. Eine Identifizierung aus dem weiteren Zusammenhang wird daher nicht stillschweigend in diesen Vers aufgenommen.
- issue: Bezeichnung der Tischgenossen
  choice: Die Gruppenbezeichnung „Sünder“ bleibt unaufgelöst stehen.
  alternative: „als Sünder geltende Menschen“ oder „sündige Menschen“
  rationale: Der Quelltext lässt offen, ob die Bezeichnung primär erzählerisch, gesellschaftlich oder religiös kategorisierend verstanden werden soll. Die direkte Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historisch konkrete Wendung „zu Tisch liegen“ ist bewusst markierter als gewöhnliche Alltagssprache; die Fußnote erläutert sie. „Zolleinnehmer“ wahrt den antiken Kontext. Die Wortstellung vermeidet eine missverständliche Pronomenkette und nennt Jesus ausdrücklich.
