  text: Und er stand auf und ging in sein Haus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Da
  rationale: Im fortlaufenden Erzählzusammenhang gibt καί den Anschluss an Jesu vorausgehenden Befehl und die unmittelbar folgende Handlung wieder. „Da“ klingt im modernen Deutschen natürlich, ohne einen stärkeren zeitlichen Gehalt zu behaupten.
- source_word: ἐγερθεὶς
  choice: stand er auf
  rationale: Das Aoristpartizip von ἐγείρω wird hier intransitiv gebraucht. Die finite deutsche Wendung gibt die vorzeitige beziehungsweise begleitende Handlung idiomatisch wieder.
- source_word: ἀπῆλθεν
  choice: ging
  rationale: ἀπέρχομαι bezeichnet das Weggehen vom bisherigen Ort. Zusammen mit „nach Hause“ bringt das schlichte „ging“ die Bewegung natürlich zum Ausdruck; „ging weg“ wäre vor der Zielangabe im Deutschen schwerfälliger.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nach Hause
  rationale: Die Verbindung bezeichnet die Bewegung zu seiner eigenen Wohnstätte. Das idiomatische deutsche „nach Hause“ trifft den Sinn von οἶκος mit Possessivpronomen, auch wenn es die konkrete Formulierung „in sein Haus“ weniger wörtlich wiedergibt.
