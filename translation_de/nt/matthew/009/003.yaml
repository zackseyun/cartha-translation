id: MAT.9.3
reference: Matthew 9:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: de
  text: 'Und sieh: Einige der Schriftgelehrten sagten bei sich[a]: »Dieser lästert Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sagten zueinander« beziehungsweise »dachten bei sich«. Der griechische Ausdruck kann private Rede oder inneres Überlegen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Erzählung entsprechend dem griechischen καί fort.
- source_word: ἰδού
  choice: sieh
  rationale: Die Aufforderung bewahrt die aufmerksamkeitslenkende und verlebendigende Funktion von ἰδού; »siehe« wäre im heutigen Deutsch unnötig altertümlich.
- source_word: τινες τῶν γραμματέων
  choice: einige der Schriftgelehrten
  rationale: Die Formulierung gibt sowohl die unbestimmte Teilmenge als auch die etablierte Bezeichnung der γραμματεῖς im Evangelienkontext wieder.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: sagten bei sich
  rationale: Die Wendung lässt offen, ob es sich um inneres Reden oder eine nicht öffentlich geäußerte Verständigung handelt; die Fußnote nennt die mögliche Alternative.
- source_word: Οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen wird knapp und mit seiner im Kontext möglichen distanzierenden Färbung wiedergegeben.
- source_word: βλασφημεῖ
  choice: lästert Gott
  rationale: Im Deutschen verlangt »lästern« gewöhnlich eine nähere Bestimmung; »Gott lästern« gibt den hier gemeinten religiösen Sinn von βλασφημέω natürlich und eindeutig wieder.
theological_decisions:
- issue: Wiedergabe des Vorwurfs gegen Jesus
  choice: Dieser lästert Gott.
  alternative: Dieser redet Gotteslästerung.
  rationale: Die Übersetzung bewahrt den uneingeschränkten Vorwurf der Schriftgelehrten und erklärt oder bewertet ihn an dieser Stelle nicht. Die Ergänzung »Gott« macht lediglich den im Kontext gemeinten deutschen Sinn von »lästern« deutlich.
- issue: Art des Redens der Schriftgelehrten
  choice: sagten bei sich
  alternative: dachten bei sich / sagten zueinander
  rationale: Das griechische ἐν ἑαυτοῖς kann inneres Überlegen oder private Rede bezeichnen. Der Haupttext hält diese Spannung möglichst offen, statt eindeutig stummes Denken oder ein Gespräch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sieh« erhält die narrative Signalwirkung ohne das altertümlichere »siehe«; die direkte Rede bleibt knapp und scharf.
