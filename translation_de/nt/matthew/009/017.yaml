source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: de
  text: Auch füllt man neuen Wein nicht in alte Weinschläuche. Sonst platzen die Weinschläuche, der Wein läuft aus, und die Weinschläuche werden zerstört. Vielmehr füllt man neuen Wein in neue[a] Weinschläuche, und beides bleibt erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische verwendet für den Wein νέος („neu, jung“) und für die Weinschläuche καινός („neu, frisch“).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Auch … nicht
  rationale: Knüpft als weiteres negatives Beispiel natürlich an den vorausgehenden Vergleich an.
- source_word: βάλλουσιν
  choice: füllt man … in
  rationale: Gibt das Einbringen und Aufbewahren von Wein in Behältern im Deutschen idiomatisch wieder.
- source_word: οἶνον νέον
  choice: neuen Wein
  rationale: Direkte und geläufige Wiedergabe für frisch hergestellten Wein.
- source_word: ἀσκούς
  choice: Weinschläuche
  rationale: Bezeichnet klar die damaligen Behälter aus Tierhaut.
- source_word: παλαιούς
  choice: alte
  rationale: Bewahrt den unmittelbaren Gegensatz zu den geeigneten, noch ungebrauchten Schläuchen.
- source_word: εἰ δὲ μή γε
  choice: Sonst
  rationale: Gibt die konditionale Warnung knapp und natürlich wieder.
- source_word: ῥήγνυνται
  choice: platzen
  rationale: Beschreibt anschaulich das Bersten der Schläuche unter Druck.
- source_word: ἐκχεῖται
  choice: läuft aus
  rationale: Drückt im Zusammenhang natürlich den ungewollten Verlust des Weins aus.
- source_word: ἀπόλλυνται
  choice: gehen zugrunde
  rationale: Bewahrt die starke Verlustsprache des Verbs, ohne einen besonderen theologischen Sinn einzutragen.
- source_word: ἀλλά
  choice: Vielmehr
  rationale: Markiert die korrigierende Gegenüberstellung deutlich.
- source_word: καινούς
  choice: ungebrauchte
  rationale: Macht im Deutschen die neue beziehungsweise frische Beschaffenheit der Schläuche deutlich und wahrt zugleich den Unterschied zu νέος beim Wein.
- source_word: ἀμφότεροι
  choice: beides
  rationale: Bezieht sich kollektiv und eindeutig auf Wein und Weinschläuche.
- source_word: συντηροῦνται
  choice: bleibt erhalten
  rationale: Gibt das gemeinsame Bewahrtwerden von Wein und Schläuchen präzise wieder.
theological_decisions:
- issue: Unterscheidung zwischen νέος und καινός
  choice: νέος mit „neu“, καινός mit „ungebraucht“ wiedergeben
  alternative: Beide Adjektive mit „neu“ wiedergeben
  rationale: Der griechische Text verwendet unterschiedliche Adjektive. Die gewählte Formulierung lässt erkennen, dass der Wein neu hergestellt und die Schläuche hinsichtlich ihres Zustands neu beziehungsweise noch ungebraucht sind, ohne die Bildaussage theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weinschläuche“ wird als verständlicher historischer Sachbegriff beibehalten; die Satzfolge folgt eng der Kontraststruktur des griechischen Textes.
