revisions:
- from: Auch füllt man neuen Wein nicht in alte Weinschläuche. Sonst platzen die Schläuche, der Wein läuft aus, und die Schläuche gehen zugrunde. Vielmehr füllt man neuen Wein in ungebrauchte[a] Schläuche, und beides bleibt erhalten.
  to: Auch füllt man neuen Wein nicht in alte Weinschläuche. Sonst platzen die Weinschläuche, der Wein läuft aus, und die Weinschläuche werden zerstört. Vielmehr füllt man neuen Wein in neue[a] Weinschläuche, und beides bleibt erhalten.
  rationale: Die Revision vermeidet eine zu enge Festlegung von καινός als „ungebraucht“, bewahrt aber die im Griechischen vorhandene lexikalische Differenz in einer sachlichen Fußnote. Außerdem wird die Zerstörung der Weinschläuche idiomatischer ausgedrückt. Bedeutung, Bildsprache und Ambiguität des Ausgangstextes bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:42:07Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur, die negative Fortführung (οὐδέ), die konditionale Folge und den Kontrast mit ἀλλά insgesamt zuverlässig wieder. „Ungebrauchte“ legt für καινούς jedoch enger als nötig fest, dass die Schläuche zuvor nie benutzt wurden; καινός bedeutet hier sicher „neu/frisch“ und kann den geeigneten neuen Zustand bezeichnen, nicht zwingend Unbenutztheit. Für ἀπόλλυνται ist „gehen zugrunde“ bei Gegenständen weniger idiomatisch als „werden zerstört“.
  naturalness: „Weinschläuche“, „platzen“ und „läuft aus“ sind modernes, gut verständliches Standarddeutsch. Die Wiederaufnahme von „Weinschläuche“ nach „Sonst“ ist klarer als das bloße „Schläuche“. „werden zerstört“ ist in diesem Sachzusammenhang natürlicher als „gehen zugrunde“.
  terminology: „Neuer Wein“ und „Weinschläuche“ sind treffend. Die unterschiedlichen griechischen Adjektive νέος und καινός können in modernem Deutsch beide mit „neu“ wiedergegeben werden; die Fußnote kann die lexikalische Differenz transparent machen, ohne eine zu starke Bedeutungsdifferenz in den Haupttext einzutragen.
  issues:
  - severity: medium
    issue: „ungebrauchte“ für καινούς
    rationale: Die Formulierung kann eine zwingende Aussage über vorherigen Gebrauch vermitteln. Der griechische Ausdruck bezeichnet neue bzw. frische Schläuche, ohne dass „nie benutzt“ als alleinige Bedeutung festgelegt werden sollte.
  - severity: low
    issue: „die Schläuche gehen zugrunde“
    rationale: Die Wiedergabe ist verständlich, wirkt für beschädigte Behälter jedoch weniger idiomatisch. „Die Weinschläuche werden zerstört“ gibt den Verlust bzw. die Zerstörung klar und natürlich wieder.
