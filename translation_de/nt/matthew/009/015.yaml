reference: Matthew 9:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: de
  text: 'Jesus sagte zu ihnen: „Die Hochzeitsgäste[a] können doch nicht trauern, solange der Bräutigam bei ihnen ist? Es werden aber Tage kommen, an denen ihnen der Bräutigam weggenommen wird[b]; dann werden sie fasten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne des Hochzeitssaals“; eine Wendung für die Gefährten des Bräutigams beziehungsweise die Teilnehmer der Hochzeitsfeier.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „entfernt wird“. Die passive Form deutet auf mehr als eine gewöhnliche Abreise hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: die Hochzeitsgäste
  rationale: Wörtlich „die Söhne des Hochzeitssaals“, eine semitisch geprägte Wendung für die Gefährten des Bräutigams beziehungsweise die Teilnehmer der Hochzeitsfeier. „Hochzeitsgäste“ gibt die gemeinte soziale Gruppe in natürlichem modernem Deutsch wieder.
- source_word: πενθεῖν
  choice: trauern
  rationale: Das Verb bezeichnet Trauer oder Klage und bildet hier den sachlichen Gegensatz zur freudigen Gegenwart des Bräutigams.
- source_word: ἐφ’ ὅσον
  choice: solange
  rationale: Die zeitliche Wendung bezeichnet die gesamte Dauer der Anwesenheit und wird im Deutschen knapp und genau mit „solange“ wiedergegeben.
- source_word: νυμφίος
  choice: Bräutigam
  rationale: Der übliche deutsche Ausdruck bewahrt das Hochzeitsbild und seine mögliche weitergehende Bedeutung.
- source_word: ἀπαρθῇ
  choice: entrissen wird
  rationale: Der passive Aorist von ἀπαίρω bezeichnet ein Wegnehmen. „Entrissen wird“ bewahrt stärker als „weggeht“ den Hinweis auf eine von außen bewirkte, einschneidende Entfernung, ohne deren genaue Art auszudeuten.
- source_word: νηστεύσουσιν
  choice: werden sie fasten
  rationale: Die einfache Zukunftsform wird direkt und idiomatisch wiedergegeben.
- source_word: Μὴ δύνανται ... ;
  choice: können doch nicht ...!
  rationale: Die mit μή eingeleitete rhetorische Frage erwartet eine verneinende Antwort. Die deutsche Formulierung mit „doch nicht“ gibt diese Erwartung natürlich wieder; das Ausrufezeichen lässt die rhetorische Aussagefunktion erkennen.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Es werden aber Tage kommen
  rationale: Die idiomatische Zukunftswendung bleibt erhalten, während „aber“ den milden Kontrast von δέ ausdrückt.
theological_decisions:
- issue: Mögliche christologische Bedeutung des Bräutigambildes
  choice: Das Bild vom Bräutigam bleibt ohne erklärende Identifikation stehen.
  alternative: Jesus ausdrücklich als messianischen Bräutigam bezeichnen.
  rationale: Der Vers legt durch Jesu Antwort eine Beziehung zwischen ihm und dem Bräutigam nahe, formuliert die weitergehende theologische Bedeutung aber nicht ausdrücklich. Die Übersetzung bewahrt deshalb Bild und Spannung.
- issue: Deutung des passiven ἀπαρθῇ
  choice: „entrissen wird“ lässt eine von außen bewirkte Entfernung und die mögliche Vorausdeutung auf Jesu Tod anklingen.
  alternative: Neutral „weggenommen wird“ oder interpretierend „getötet wird“.
  rationale: Die passive Form ist stärker als eine gewöhnliche Abreise, nennt jedoch weder den Handelnden noch ausdrücklich den Tod. Die Übersetzung soll den Hinweis bewahren, ohne ihn aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hochzeitsgäste“ vermeidet eine unverständliche wörtliche Wiedergabe des Idioms. Die rhetorische Frage wird als nachdrückliche, eine Verneinung erwartende Aussage gestaltet. „Entrissen“ erhält die ernste Vorausdeutung des griechischen Passivs, ohne den Vorgang ausdrücklich als Tod zu interpretieren.
