  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: de
  text: 'Und als die Pharisäer das sahen[a], sagten sie zu seinen Jüngern: „Warum isst euer Lehrer mit Zolleinnehmern und Sündern?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Partizip bedeutet wörtlich „sehend“ bzw. „als sie sahen“. Was die Pharisäer sahen, wird nicht ausdrücklich genannt; im Zusammenhang ist die Mahlszene gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Als … das sahen
  rationale: Das Aoristpartizip wird in natürlichem Deutsch als temporaler Nebensatz wiedergegeben. „Das“ nimmt die im Zusammenhang beobachtete Mahlszene auf, obwohl das griechische Objekt unausgesprochen bleibt.
- source_word: ἔλεγον
  choice: sagten sie
  rationale: Der Imperfekt stellt das Sprechen im Erzählverlauf dar. Das deutsche Präteritum ist hier idiomatisch; eine Verlaufsform wie „waren dabei zu sagen“ wäre unnatürlich und würde den Aspekt überbetonen.
- source_word: μαθηταῖς
  choice: Jüngern
  rationale: „Jünger“ ist im Evangelienkontext die geläufige Wiedergabe und bewahrt das Verhältnis zwischen Lehrer und Lernenden beziehungsweise Nachfolgern.
- source_word: Διὰ τί
  choice: Warum
  rationale: Direkte, idiomatische Wiedergabe der griechischen Frage nach dem Grund.
- source_word: τελωνῶν
  choice: Zolleinnehmern
  rationale: Der Ausdruck bezeichnet Personen, die Zölle oder Abgaben einnahmen. „Zolleinnehmer“ ist verständlich und lässt die aus dem Kontext hervorgehende gesellschaftliche Stigmatisierung stehen, ohne sie auszuformulieren.
- source_word: ἁμαρτωλῶν
  choice: Sündern
  rationale: Direkte und etablierte Wiedergabe; sie wahrt, dass hier eine moralisch und gesellschaftlich bezeichnete Gruppe gemeint ist, ohne die Wertung erklärend aufzulösen.
- source_word: ἐσθίει
  choice: isst
  rationale: Gibt das Präsens und die grundlegende Bedeutung natürlich wieder. Der Zusammenhang macht das gemeinsame Essen deutlich.
- source_word: διδάσκαλος
  choice: Lehrer
  rationale: Entspricht der gewöhnlichen Bedeutung des Titels und bewahrt die Beziehung zu den als Jünger bezeichneten Personen.
theological_decisions:
- issue: Unausgesprochenes Objekt von ἰδόντες
  choice: „das“ im Haupttext ergänzt und mit einer Fußnote kenntlich gemacht
  alternative: „Als die Pharisäer es sahen“ oder formal „Als die Pharisäer sahen“
  rationale: Das Griechische nennt kein Objekt; aus dem Zusammenhang ist die Mahlszene gemeint. Natürliches Deutsch verlangt hier in der Regel eine Ergänzung. „Das“ verweist auf die gesamte beobachtete Situation, ohne deren Deutung festzulegen.
- issue: Bezeichnung der Gruppe als ἁμαρτωλοί
  choice: „Sünder“
  alternative: „sündige Menschen“ oder eine erklärende soziale Gruppenbezeichnung
  rationale: Die direkte Wiedergabe erhält die theologische und gesellschaftliche Spannung der Aussage. Eine Umschreibung könnte die Wertung abschwächen oder eine bestimmte Auslegung vorwegnehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und mündlich natürlich. „Zolleinnehmer“ vermeidet unnötige Fachsprache; „Jünger“, „Sünder“ und „Lehrer“ bewahren die etablierten Beziehungen und Spannungen des griechischen Textes.
