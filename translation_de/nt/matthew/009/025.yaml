source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: de
  text: Als aber die Menge hinausgewiesen worden war, ging er hinein, nahm das Mädchen bei der Hand, und das Mädchen stand auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Mädchen wurde auferweckt.“ Das griechische Verb kann hier sowohl intransitiv als auch passiv verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als aber
  rationale: ὅτε leitet den temporalen Nebensatz ein; δέ markiert einen leichten erzählerischen Gegensatz bzw. Übergang. „Als aber“ gibt beides knapp und natürlich wieder.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: die Menge hinausgeschickt worden war
  rationale: Der Aorist Passiv bezeichnet die Entfernung der Menschen. „Hinausgeschickt“ bewahrt das Passiv, ohne die möglicherweise missverständliche Härte von „hinausgeworfen“ einzutragen; das Plusquamperfekt macht die zeitliche Abfolge im Deutschen deutlich.
- source_word: εἰσελθών
  choice: ging er hinein
  rationale: Das Partizip bezeichnet die der Haupthandlung vorausgehende Handlung und wird im natürlichen deutschen Erzählstil als finites Verb wiedergegeben.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: nahm das Mädchen bei der Hand
  rationale: κρατέω mit Genitiv bedeutet hier „ergreifen/fassen“. Die deutsche Wendung „bei der Hand nehmen“ ist idiomatisch und sachlich. Das Nomen wird wiederholt, weil ein isoliertes „sie“ im Deutschen weniger klar wäre.
- source_word: ἠγέρθη
  choice: stand auf
  rationale: Der passive Aorist von ἐγείρω kann kontextuell intransitiv wiedergegeben werden. „Stand auf“ klingt im heutigen Deutsch natürlich und lässt die im Griechischen mögliche passive Deutung offen, die in der Fußnote genannt wird.
- source_word: τὸ κοράσιον
  choice: das Mädchen
  rationale: κοράσιον bezeichnet ein Mädchen bzw. junges Mädchen. „Das Mädchen“ ist gegenwärtig, verständlich und ohne unnötige Altersspezifizierung.
theological_decisions:
- issue: Wiedergabe von ἠγέρθη im Zusammenhang einer Totenerweckung
  choice: stand auf
  alternative: wurde auferweckt
  rationale: Die intransitive deutsche Form beschreibt das sichtbare Geschehen, ohne die Agensfrage ausdrücklich festzulegen. Zugleich wird die formal passive und theologisch bedeutsame Alternative nicht verschwiegen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die Formulierung vermeidet sowohl exorzistisch klingende Härte bei ἐκβάλλω als auch eine vorschnelle Festlegung der Mehrdeutigkeit von ἠγέρθη.
