source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: de
  text: 'Und nachdem der Dämon ausgetrieben worden war, sprach der Stumme.[a] Da staunten die Menschenmengen und sagten: „Noch nie hat man in Israel so etwas gesehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Taube“. Das griechische Wort kann sowohl „taub“ als auch „stumm“ bedeuten; hier spricht der Zusammenhang eher für „stumm“, weil hervorgehoben wird, dass der Mann sprach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: nachdem … ausgetrieben worden war
  rationale: Der Aoristpartizip im Genitivus absolutus bezeichnet eine Handlung, die der Haupthandlung vorausgeht; die Formulierung gibt dies in natürlichem Deutsch wieder.
- source_word: τοῦ δαιμονίου
  choice: der Dämon
  rationale: In den Exorzismusberichten der Evangelien ist „Dämon“ die präzise und geläufige Wiedergabe von δαιμόνιον.
- source_word: ἐλάλησεν
  choice: sprach
  rationale: Der einfache Aorist von λαλέω bezeichnet hier das Sprechen, ohne ausdrücklich den Beginn der Handlung hervorzuheben.
- source_word: ὁ κωφός
  choice: der Stumme
  rationale: κωφός kann „taub“ oder „stumm“ bedeuten; da unmittelbar berichtet wird, dass der Betroffene sprach, steht hier seine bisherige Sprachlosigkeit im Vordergrund.
- source_word: ἐθαύμασαν
  choice: staunten
  rationale: „Staunten“ gibt die starke Verwunderung der Menschenmengen in natürlichem, modernem Deutsch wieder.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Der griechische Plural wird bewahrt; „Menschenmengen“ ist klarer und idiomatischer als das altertümliche „Volksscharen“.
- source_word: Οὐδέποτε
  choice: Noch nie
  rationale: Im Kontext einer Aussage über ein bis dahin beispielloses Ereignis ist „Noch nie“ die natürliche deutsche Entsprechung.
- source_word: ἐφάνη οὕτως
  choice: ist so etwas … geschehen
  rationale: Wörtlich steht etwa „ist es so erschienen/ist es so sichtbar geworden“. Die idiomatische Wendung „ist so etwas geschehen“ gibt den Sinn eines in Israel beispiellosen Vorgangs wieder, ohne eine unnatürliche deutsche Formulierung zu erzwingen.
- source_word: ἐν τῷ Ἰσραήλ
  choice: in Israel
  rationale: Die knappe Formulierung kann sowohl das Volk als auch dessen Lebensbereich bezeichnen und bewahrt diese Offenheit.
theological_decisions:
- issue: Bedeutungsumfang von κωφός im Heilungs- und Exorzismuskontext
  choice: „der Stumme“ im Haupttext
  alternative: „der Taube“
  rationale: Das Wort kann Taubheit oder Stummheit bezeichnen. Das anschließende „sprach“ macht Stummheit hier kontextuell wahrscheinlicher; die echte lexikalische Alternative bleibt in der Fußnote sichtbar.
- issue: Wiedergabe der unpersönlichen Aussage ἐφάνη οὕτως
  choice: „Noch nie ist so etwas in Israel geschehen“
  alternative: „Noch nie ist so etwas in Israel sichtbar geworden/erschienen“
  rationale: Das Griechische betont, dass etwas Vergleichbares noch nie in Erscheinung getreten beziehungsweise wahrgenommen worden war. Die gewählte deutsche Wendung ist idiomatisch und lässt offen, ob die Menge vor allem die Heilung, den Exorzismus oder Jesu Wirken insgesamt meint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem zeitlichen Verhältnis des griechischen Genitivus absolutus, ohne unnötig wörtlich zu klingen. Der Plural „Menschenmengen“ entspricht οἱ ὄχλοι; „der Stumme“ ist knapp und im Kontext eindeutig auf den zuvor genannten Mann bezogen.
