  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: de
  text: Als Jesus in das Haus des Vorstehers[a] kam und die Flötenspieler[b] und die Menge in Aufruhr[c] sah,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Amtsträgers“; nach den Parallelberichten möglicherweise: „Synagogenvorstehers“. Matthäus verwendet hier lediglich die allgemeine Bezeichnung „Vorsteher“.'
    reason: alternative_reading
  - marker: b
    text: Flötenspieler gehörten zu den bei Trauerfeiern üblichen Klageleuten.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die lärmende Menge“ oder „die Menge, die Lärm machte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: als Jesus … kam
  rationale: Das Aoristpartizip bezeichnet hier natürlich die zeitliche Abfolge; der deutsche Nebensatz gibt dies idiomatisch wieder.
- source_word: οἰκίαν
  choice: Haus
  rationale: Die direkte und im erzählerischen Zusammenhang passende Wiedergabe.
- source_word: ἄρχοντος
  choice: Vorsteher
  rationale: Bewahrt die allgemeine Bedeutung einer leitenden Person, ohne die aus Parallelberichten bekannte genauere Bezeichnung in den Haupttext einzutragen.
- source_word: ἰδὼν
  choice: sah
  rationale: Schlichte, natürliche Wiedergabe des narrativen Partizips.
- source_word: αὐλητὰς
  choice: Flötenspieler
  rationale: Bezeichnet Spieler eines Blasinstruments beziehungsweise einer Flöte; die gewählte Form ist im heutigen Deutsch klar verständlich.
- source_word: ὄχλον
  choice: Menge
  rationale: Natürliche Standardwiedergabe für eine versammelte größere Personengruppe.
- source_word: θορυβούμενον
  choice: lärmende
  rationale: Gibt den andauernden hörbaren Tumult knapp wieder, ohne die Ursache oder Gefühlslage über den griechischen Wortlaut hinaus festzulegen.
theological_decisions:
- issue: Identität des Hausherrn
  choice: Vorsteher
  alternative: Amtsträger; Synagogenvorsteher
  rationale: Matthäus verwendet hier nur den allgemeinen Ausdruck ἄρχων. Die Übersetzung vermeidet daher eine stillschweigende Harmonisierung mit den Parallelberichten; die genauere mögliche Identifikation steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt flüssig und bewahrt zugleich die griechische Abfolge. Der Vers endet wie die Vorlage mit einem Komma, da der Satz im folgenden Vers weitergeführt wird.
