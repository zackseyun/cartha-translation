  rationale: Die Revision glättet den Erzählbeginn, ohne die markierende Funktion von καὶ ἰδού aufzugeben. Sie ersetzt außerdem die missverständliche Alternativformulierung zur Vergebung durch eine idiomatische deutsche Alternative, die keine Zukunftsbedeutung nahelegt. Die Mehrdeutigkeit des Bezugs von αὐτῶν und das ungenannte Agens des Passivs bleiben gewahrt.
