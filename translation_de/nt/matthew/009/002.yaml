    rationale: „werden vergeben“ kann im heutigen Deutsch eine zukünftige Vergebung nahelegen. Die griechische Präsensform ist zwar auslegungsfähig, aber die Alternative sollte die gegenwärtig geltende Zusage klarer ausdrücken.
