source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: de
  text: 'Und siehe, sie brachten einen gelähmten Mann zu ihm, der auf einer Liege lag. Als Jesus ihren Glauben[a] sah, sagte er zu dem Gelähmten: „Hab Mut, Kind! Deine Sünden sind vergeben.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Plural kann den Gelähmten und die Menschen, die ihn brachten, oder die Bringenden als Gruppe bezeichnen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Deine Sünden sind dir vergeben worden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt die Aufmerksamkeit lenkende, anschauliche Funktion des Erzählmarkers; der Doppelpunkt ermöglicht dabei einen natürlichen deutschen Satzfluss.
- source_word: προσέφερον
  choice: brachten sie
  rationale: Gibt die Handlung im erzählenden Zusammenhang natürlich wieder. Der Imperfekt kann den Verlauf der Szene andeuten, verlangt im Deutschen hier aber keine Verlaufsform.
- source_word: παραλυτικὸν
  choice: einen gelähmten Mann
  rationale: Das substantivierte maskuline Adjektiv bezeichnet hier einen männlichen Gelähmten. Die personenbezogene Formulierung ist im heutigen Deutsch natürlich und respektvoll.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: der auf einer Liege lag
  rationale: Gibt den aus dem Perfektpartizip resultierenden Zustand idiomatisch wieder. „Liege“ lässt die genaue Art des einfachen Lagers offen.
- source_word: πίστιν
  choice: Glauben
  rationale: Die etablierte und kontextuell passende Wiedergabe bezeichnet hier ein durch das Handeln sichtbar gewordenes Vertrauen.
- source_word: Θάρσει
  choice: Hab Mut
  rationale: Eine direkte, heutige und verständliche Aufforderung zur Zuversicht; weniger altertümlich als „Sei getrost“ oder „Sei guten Mutes“.
- source_word: τέκνον
  choice: Kind
  rationale: Bewahrt die liebevolle Anrede, ohne das im Griechischen nicht vorhandene Possessivpronomen „mein“ hinzuzufügen.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Deine Sünden sind vergeben
  rationale: Die deutsche Zustandspassivform gibt die gegenwärtige Zusage natürlich wieder und lässt wie das griechische Passiv den Handelnden ungenannt.
- source_word: ἁμαρτίαι
  choice: Sünden
  rationale: Die übliche Wiedergabe wahrt den konkreten Plural des griechischen Ausdrucks.
theological_decisions:
- issue: Bezug von τὴν πίστιν αὐτῶν
  choice: Das pluralische „ihren Glauben“ bleibt im Haupttext ohne nähere Festlegung erhalten.
  alternative: Nur der Glaube der Träger oder ausdrücklich auch der Glaube des Gelähmten.
  rationale: Das Pronomen steht im Plural und bezeichnet die mit dem Gelähmten verbundene Gruppe, legt aber nicht eindeutig fest, ob der Gelähmte selbst eingeschlossen ist.
- issue: Kraft des Vergebungsausspruchs
  choice: „Deine Sünden sind vergeben“ als deklarative Zusage mit ungenanntem Handelnden.
  alternative: „Deine Sünden werden vergeben“ als stärker ereignisbezogene oder performative Wiedergabe.
  rationale: Das griechische Passiv nennt den Handelnden nicht. Die gewählte Form wahrt dies und legt weder die genaue zeitliche Nuance noch eine ausführlichere theologische Deutung fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Und sieh“ bewahrt bewusst den matthäischen Aufmerksamkeitsmarker; „Hab Mut“ vermeidet kirchlich-altertümliche Wendungen.
