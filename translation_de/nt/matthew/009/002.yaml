  source_fidelity: 'Der Haupttext gibt den griechischen Sinn insgesamt zuverlässig wieder: προσέφερον wird als erzählendes Imperfekt angemessen mit „brachten“ wiedergegeben, der Gelähmte liegt auf einer Liege, und sowohl der Plural in „ihren Glauben“ als auch das ungenannte Agens des Passivs bei der Sündenvergebung bleiben erhalten. Die Anrede „Kind“ wahrt τέκνον ohne zusätzliche Festlegung.'
  naturalness: '„Und sieh: Da brachten sie“ wirkt im modernen Standarddeutsch durch die Häufung zweier aufmerksamkeitslenkender Elemente unnötig holprig. „Und siehe, sie brachten …“ ist als bewusst leicht gehobener biblischer Erzählmarker klarer und idiomatischer. Die übrige Formulierung ist natürlich.'
  terminology: „Glaube“, „Gelähmter“, „Sünden“ und „vergeben“ sind treffend und registergerecht. Die Alternativfußnote „Deine Sünden werden vergeben“ ist im Deutschen jedoch ohne Kontext leicht futurisch zu verstehen und daher keine gleichwertig klare Alternative zur präsentischen griechischen Zusage. Eine Perfektpassiv-Alternative ist klarer.
