review_pass:
  verdict: approve
  source_fidelity: 'Der Entwurf gibt den griechischen Satzbau und Sinn zuverlässig wieder: εἰδώς wird idiomatisch als „wusste, was sie dachten“ ausgedrückt; τὰς ἐνθυμήσεις sind damit als ihre inneren Gedanken/Überlegungen erfasst. Die Frage bewahrt Präsens, Anredeplural, die substantivische Offenheit von πονηρά („Böses“) und das Bild von den „Herzen“.'
  naturalness: Modernes, gut verständliches Standarddeutsch. Die Wiederholung von „dachten/denkt“ ist hier sinnvoll, weil sie die im Griechischen vorhandene Wortfeldverbindung hörbar macht. „Böses in euren Herzen denken“ hat einen bewusst bibelnahen, aber weiterhin natürlichen würdigen Ton.
  terminology: „Herzen“ ist für καρδίαις angemessen und vermeidet die unzulässige Einengung auf rein verstandesmäßiges Denken. „Böses“ ist als substantivierte, nicht näher spezifizierte Wiedergabe von πονηρά treffend; die Übersetzung ergänzt weder „Gedanken“ noch „Absichten“ interpretierend. Der Eigenname und die Jesus betreffende Aussage bleiben sachlich und ohne doktrinäre Ausdeutung wiedergegeben.
