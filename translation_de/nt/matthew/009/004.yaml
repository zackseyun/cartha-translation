  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: de
  text: 'Und Jesus wusste, was sie dachten, und sagte: »Warum denkt ihr Böses in euren Herzen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: wusste
  rationale: Das Partizip bezeichnet hier Jesu Wissen um die inneren Überlegungen der Schriftgelehrten. Die finite Wiedergabe ist im Deutschen natürlich und bewahrt die Aussage, ohne ihre theologischen Implikationen auszudeuten.
- source_word: ἐνθυμήσεις
  choice: was sie dachten
  rationale: Das Substantiv bezeichnet innere Gedanken oder Überlegungen. Die deutsche Nebensatzkonstruktion gibt den Sinn idiomatisch wieder und vermeidet die schwerfällige Formulierung „ihre Gedanken wissend“.
- source_word: Ἱνατί
  choice: Warum
  rationale: Das Fragewort fragt nach Grund oder Beweggrund; „Warum“ ist die klare und natürliche deutsche Entsprechung.
- source_word: ἐνθυμεῖσθε
  choice: denkt ihr
  rationale: Das Präsens bezeichnet den gegenwärtigen inneren Denkvorgang. „denkt ihr“ ist knapp und stellt den Wortzusammenhang mit ἐνθυμήσεις sinngemäß her.
- source_word: πονηρὰ
  choice: Böses
  rationale: Das substantivierte neutrale Pluraladjektiv bezeichnet böse Gedanken oder Erwägungen. Das deutsche substantivierte „Böses“ bewahrt die knappe, nicht weiter ausgedeutete Form.
- source_word: καρδίαις
  choice: Herzen
  rationale: καρδία bezeichnet hier das innere Denken und Wollen. „Herzen“ erhält das biblische Bild und seine theologische Resonanz, statt es auf „Verstand“ zu verengen.
theological_decisions:
- issue: Jesu Kenntnis unausgesprochener Gedanken
  choice: Jesus wusste, was sie dachten
  alternative: Jesus erkannte ihre Gedanken
  rationale: Der Text stellt fest, dass Jesus ihre inneren Überlegungen kannte. „wusste“ bewahrt diese Aussage, ohne zu erklären, auf welche Weise dieses Wissen zustande kam.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die doppelte Verwendung des deutschen Wortfelds „denken“ spiegelt die griechische Verbindung zwischen ἐνθυμήσεις und ἐνθυμεῖσθε; „in euren Herzen“ bewahrt bewusst die Bildsprache des Ausgangstextes.
