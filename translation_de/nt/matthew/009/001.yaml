id: MAT.9.1
reference: Matthew 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: de
  text: Und er stieg in ein Boot, fuhr hinüber und kam in seine eigene Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Heimatstadt“. Wörtlich steht im Griechischen „seine eigene Stadt“; im Zusammenhang ist wahrscheinlich Kafarnaum gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: stieg in
  rationale: Das Partizip Aorist bezeichnet eine der Überfahrt vorausgehende Handlung. Die deutsche Reihung mit finitem Verb ist natürlich und wahrt die zeitliche Abfolge.
- source_word: πλοῖον
  choice: ein Boot
  rationale: Der allgemeine Ausdruck für ein Wasserfahrzeug wird im galiläischen Kontext angemessen mit „Boot“ wiedergegeben; der artikellose Gebrauch legt „ein Boot“ nahe.
- source_word: διεπέρασεν
  choice: fuhr hinüber
  rationale: διαπεράω bezeichnet das Übersetzen von einer Seite zur anderen. Da die Überfahrt mit einem Boot erfolgt, ist „fuhr hinüber“ im Deutschen natürlich und erhält die Richtungsbedeutung.
- source_word: ἦλθεν
  choice: kam
  rationale: „Kam“ gibt ἔρχομαι aus der Erzählperspektive direkt wieder, ohne die Bedeutung zu „traf ein“ zu verengen.
- source_word: τὴν ἰδίαν πόλιν
  choice: seine eigene Stadt
  rationale: Die wörtungsnahe Wiedergabe erhält die Zugehörigkeits- beziehungsweise Zuordnungsnuance von ἴδιος und legt nicht ausdrücklich „Heimatstadt“ fest.
- source_word: Καὶ ... καὶ
  choice: Und ... und
  rationale: Die wiederholten Konjunktionen verbinden die Handlungen in schlichter erzählerischer Folge; das einleitende „Und“ bewahrt Matthäus’ Verknüpfungsstil.
theological_decisions:
- issue: Bezug von „seine eigene Stadt“
  choice: Die Stadt wird im Haupttext nicht namentlich bestimmt.
  alternative: „seine Heimatstadt“ oder eine ausdrückliche Identifizierung mit Kafarnaum
  rationale: Der griechische Text nennt die Stadt nicht. „Seine eigene Stadt“ bewahrt die offene Formulierung, auch wenn der Erzählzusammenhang wahrscheinlich auf Kafarnaum weist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die finite Verbfolge klingt natürlicher als eine schwere partizipiale Konstruktion und bewahrt dennoch die klare Handlungsabfolge.
