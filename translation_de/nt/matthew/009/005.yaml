source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: de
  text: 'Denn was ist leichter: zu sagen: »Deine Sünden sind dir vergeben«[a], oder zu sagen: »Steh auf und geh«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Deine Sünden sind dir vergeben worden.« Das griechische Präsenspassiv kann einen fortbestehenden Zustand bezeichnen, der aus einer vollzogenen Handlung hervorgegangen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Denn was ist leichter
  rationale: τί fragt zusammen mit dem Komparativ nach der leichteren von zwei Möglichkeiten. γάρ stellt die begründende Verbindung zum vorhergehenden Gedankengang her und wird daher mit »Denn« wiedergegeben.
- source_word: εἰπεῖν
  choice: zu sagen
  rationale: Der Infinitiv bezeichnet in beiden Satzhälften schlicht das Aussprechen; die identische Wiedergabe bewahrt die rhetorische Parallelität.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Deine Sünden sind dir vergeben
  rationale: Das Präsens Passiv kann im Deutschen natürlich als bestehender Zustand ausgedrückt werden. Das zusätzliche »dir« bildet den griechischen Genitiv σου idiomatisch ab, ohne den Zeitpunkt oder den Handelnden näher festzulegen.
- source_word: ἁμαρτίαι
  choice: Sünden
  rationale: »Sünden« ist die direkte und im Kontext angemessene Wiedergabe; eine Ausweitung zur Schuld- oder Schuldenmetaphorik ist nicht erforderlich.
- source_word: Ἔγειρε
  choice: Steh auf
  rationale: Der Aoristimperativ fordert in diesem Heilungskontext zu einer unmittelbaren körperlichen Handlung auf; »Steh auf« ist gegenwärtiges, natürliches Deutsch.
- source_word: καὶ περιπάτει
  choice: und geh umher
  rationale: περιπατέω bezeichnet hier tatsächliches Gehen. »Geh umher« lässt die durative Färbung des Präsensimperativs erkennen und passt zur demonstrierbaren Heilung.
- source_word: σου
  choice: deine … dir
  rationale: Der Genitiv der zweiten Person Singular wird im deutschen Satz idiomatisch durch das Possessiv »deine« und den persönlichen Bezug »dir« ausgedrückt.
theological_decisions:
- issue: Zeitliche bzw. zuständliche Bedeutung der Vergebungsaussage
  choice: Deine Sünden sind dir vergeben
  alternative: Deine Sünden sind dir vergeben worden
  rationale: Das griechische Präsens Passiv lässt eine zuständliche Lesart zu, ohne ausdrücklich festzulegen, wann die Vergebung vollzogen wurde. Die Hauptfassung bewahrt diese Offenheit; die perfektische Möglichkeit wird in der Fußnote genannt.
- issue: Nicht genannter Handelnder beim Passiv
  choice: Passivform ohne ausdrückliche Nennung Gottes
  alternative: Gott hat dir deine Sünden vergeben
  rationale: Der griechische Text nennt den Handelnden nicht ausdrücklich. Die deutsche Passivform vermeidet es, diese theologisch naheliegende Identifikation in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die parallele Formulierung »zu sagen … oder zu sagen« bildet die rhetorische Struktur des Griechischen ab. Direkte Rede steht in deutschen Anführungszeichen; die Anrede bleibt Singular.
