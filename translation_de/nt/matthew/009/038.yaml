id: MAT.9.38
reference: Matthew 9:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: de
  text: Bittet daher den Herrn der Ernte inständig, dass er Arbeiter in seine Ernte hinausschickt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass er Arbeiter in seine Ernte hinaustreibt«; das griechische Verb ist stärker als ein schlichtes »schicken«, bezeichnet hier jedoch das Aussenden von Arbeitern zur Ernte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: bittet … inständig
  rationale: Das Verb bezeichnet hier eine dringliche Bitte. Die Formulierung wahrt den Gebetsbezug durch das Objekt »den Herrn« und gibt zugleich die Nachdrücklichkeit natürlich wieder.
- source_word: οὖν
  choice: daher
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Aussage, dass die Ernte groß, die Zahl der Arbeiter aber klein ist.
- source_word: κυρίου
  choice: Herrn
  rationale: Bewahrt den Titel und die Aussage über die Autorität dessen, dem die Ernte gehört.
- source_word: θερισμοῦ
  choice: Ernte
  rationale: Gibt die im Kontext zentrale Metapher unmittelbar wieder.
- source_word: ὅπως
  choice: dass
  rationale: Leitet idiomatisch den Inhalt beziehungsweise das Ziel der Bitte ein.
- source_word: ἐκβάλῃ
  choice: hinausschickt
  rationale: Passt natürlich zum Entsenden von Arbeitern und bewahrt durch »hinaus-« etwas von der gerichteten, kräftigen Bewegung des griechischen Verbs; dessen stärkere mögliche Bedeutung wird in der Fußnote genannt.
- source_word: ἐργάτας
  choice: Arbeiter
  rationale: Eine klare, gegenwärtige und der Erntemetapher angemessene Wiedergabe.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: in seine Ernte
  rationale: Bewahrt sowohl die Bewegung in den Bereich der Ernte als auch das Possessivpronomen, ohne ein im Griechischen nicht ausdrücklich genanntes »Feld« hinzuzufügen.
theological_decisions:
- issue: Identität des »Herrn der Ernte«
  choice: Die Bezeichnung bleibt ohne nähere Identifizierung als »Herr der Ernte« stehen.
  alternative: Ausdrückliche Identifizierung mit dem Vater, mit Jesus oder allgemeiner mit Gott.
  rationale: Der Vers selbst bestimmt den Bezug nicht genauer. Die offene Formulierung wahrt diese theologische Spannung und vermeidet eine ergänzende Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Bittet … inständig« klingt natürlich und vermittelt die Dringlichkeit; die Erntemetapher bleibt unverändert erhalten.
