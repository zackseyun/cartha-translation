reference: Matthew 9:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: de
  text: Als die Menschenmengen das sahen, fürchteten sie sich[a] und verherrlichten Gott, der den Menschen[b] solche Vollmacht gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bedeutet wörtlich „sie fürchteten sich“; im Zusammenhang kann die Furcht auch ehrfürchtiges Staunen einschließen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen der Plural: „den Menschen“. Die Aussage kann Menschen allgemein bezeichnen; sie fällt als Reaktion auf die Vollmacht, die Jesus gezeigt hatte.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδόντες
  choice: Als ... das sahen
  rationale: Das Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben. „Das“ nimmt das unmittelbar zuvor berichtete Geschehen auf.
- source_word: δὲ
  choice: unübersetzt im Anschluss mit „Als“
  rationale: δέ markiert hier vor allem den Fortgang der Erzählung; ein ausdrückliches „aber“ würde im Deutschen einen stärkeren Gegensatz nahelegen, als der Kontext verlangt.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Der Plural wird bewahrt; „Menschenmengen“ ist modern und verständlich, während „Volksmengen“ weniger natürlich klingt.
- source_word: ἐφοβήθησαν
  choice: fürchteten sie sich
  rationale: Die Wiedergabe hält am gewöhnlichen Sinn von φοβέομαι fest und lässt offen, in welchem Maß Ehrfurcht und Staunen mitschwingen.
- source_word: ἐδόξασαν
  choice: verherrlichten
  rationale: „Verherrlichen“ bewahrt das theologische Gewicht und die lexikalische Verbindung von δοξάζω zur Herrlichkeit Gottes besser als das allgemeinere „loben“.
- source_word: τὸν θεὸν
  choice: Gott
  rationale: Standardwiedergabe des direkten Objekts.
- source_word: τὸν δόντα
  choice: der ... gegeben hatte
  rationale: Das attributive Aoristpartizip wird als Relativsatz wiedergegeben; das Plusquamperfekt bezeichnet die Gabe als der Reaktion vorausgehend.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: „Vollmacht“ bezeichnet übertragene beziehungsweise legitime Autorität präziser als bloße Kraft oder Fähigkeit und passt zum Kontext der Sündenvergebung.
- source_word: τοιαύτην
  choice: solche
  rationale: Die Formulierung entspricht der Art und Beschaffenheit der soeben sichtbar gewordenen Vollmacht, ohne sie interpretierend zu steigern.
- source_word: τοῖς ἀνθρώποις
  choice: den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen beziehungsweise menschliche Wesen; „den Menschen“ bewahrt den Plural und die Spannung, dass die Menge angesichts Jesu von einer Menschen gegebenen Vollmacht spricht.
theological_decisions:
- issue: Ob die Reaktion der Menschenmenge als Angst oder Ehrfurcht wiederzugeben ist
  choice: fürchteten sie sich
  alternative: wurden von Ehrfurcht erfüllt / staunten ehrfürchtig
  rationale: Der Grundsinn des Verbs ist Furcht. Eine mögliche ehrfürchtige Komponente wird in der Fußnote genannt, aber nicht an die Stelle der stärkeren Aussage des griechischen Textes gesetzt.
- issue: Bezug und Reichweite von τοῖς ἀνθρώποις
  choice: den Menschen
  alternative: einem Menschen / den Männern
  rationale: Der griechische Text steht im Plural und kann Menschen allgemein bezeichnen. Die Übersetzung bewahrt diesen Plural und löst nicht auf, wie die Menge Jesu einzigartige Vollmacht zur allgemein formulierten Gabe Gottes an Menschen in Beziehung setzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt flüssig und erzählerisch. „Vollmacht“ und „verherrlichten“ erhalten zentrale theologische Begriffe, während die Fußnoten echte lexikalische und theologische Spannung sichtbar machen.
