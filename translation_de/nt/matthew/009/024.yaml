  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: de
  text: 'Er sagte: „Geht hinaus! Denn das Mädchen ist nicht gestorben, sondern es schläft.“ Da lachten sie ihn aus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: Er sagte
  rationale: Der Imperfekt kann einen andauernden oder wiederholten Sprechakt anzeigen. Im natürlichen deutschen Erzählstil gibt das Präteritum „sagte“ den Vorgang hier angemessen wieder, ohne die Rede unnatürlich mit „sagte immer wieder“ zu überbestimmen.
- source_word: Ἀναχωρεῖτε
  choice: Geht hinaus!
  rationale: Der Imperativ Plural fordert die Anwesenden auf, den Raum beziehungsweise den Ort zu verlassen. „Geht hinaus“ ist im Kontext konkret und natürlich; „Zieht euch zurück“ wäre förmlicher und weniger anschaulich.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: Denn ... ist nicht gestorben
  rationale: γάρ begründet die Aufforderung; „denn“ bewahrt diesen Zusammenhang. Das Perfekt „ist ... gestorben“ gibt das eingetretene beziehungsweise verneinte Todesereignis im Deutschen idiomatisch wieder.
- source_word: τὸ κοράσιον
  choice: das Mädchen
  rationale: κοράσιον bezeichnet ein Mädchen, häufig ein junges Mädchen. „Das Mädchen“ ist präzise und fügt keine im Vers eigens betonte Altersnuance hinzu.
- source_word: ἀλλὰ καθεύδει
  choice: sondern es schläft
  rationale: Die direkte Gegenüberstellung von Tod und Schlaf bleibt wörtlich und spannungsvoll erhalten. „Es schläft“ ist natürliches Deutsch und deutet die Aussage nicht aus.
- source_word: κατεγέλων αὐτοῦ
  choice: Da lachten sie ihn aus
  rationale: Das Verb bezeichnet spöttisches Lachen über jemanden. „Jemanden auslachen“ trägt diese Bedeutung im modernen Deutsch klar und bewahrt zugleich das Bild des Lachens; „da“ stellt den erzählerischen Fortgang natürlich her.
theological_decisions:
- issue: Jesu Aussage, das Mädchen sei nicht gestorben, sondern schlafe
  choice: Die wörtliche Gegenüberstellung „ist nicht gestorben, sondern es schläft“ bleibt ohne erklärenden Zusatz stehen.
  alternative: „Es ist nur eingeschlafen“ oder eine ausdrückliche Erklärung, Schlaf sei hier ein Bild für den Tod.
  rationale: Der griechische Text erklärt die Aussage nicht und bewahrt eine bewusste narrative und theologische Spannung. Die Übersetzung soll weder „nur“ ergänzen noch vorwegnehmen, in welchem genauen Sinn Jesus vom Schlaf spricht.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede klingt bestimmt, aber nicht altertümlich; das spöttische Moment des abschließenden Verbs wird idiomatisch ausgedrückt.
