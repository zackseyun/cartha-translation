source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: de
  text: 'Als Jesus von dort weiterging, folgten ihm zwei blinde Männer und riefen laut: „Hab Erbarmen mit uns, Sohn Davids![a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sohn Davids“ ist ein königlich-messianischer Titel. Er bezeichnet Jesus als den verheißenen Erben aus der Linie Davids.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: Als Jesus von dort weiterging
  rationale: Die Konstruktion mit dem präsentischen Partizip bezeichnet die gleichzeitige, fortschreitende Bewegung Jesu. „Von dort weiterging“ gibt den erzählerischen Übergang natürlich wieder.
- source_word: ἠκολούθησαν αὐτῷ
  choice: folgten ihm
  rationale: ἀκολουθέω bezeichnet hier zunächst das tatsächliche Hinterhergehen; die knappe deutsche Wendung bewahrt zugleich mögliche erzählerische Anklänge an Nachfolge.
- source_word: δύο τυφλοὶ
  choice: zwei blinde Männer
  rationale: Das substantivierte maskuline Adjektiv wird im Deutschen natürlich und geschlechtsgenau mit „blinde Männer“ wiedergegeben.
- source_word: κράζοντες καὶ λέγοντες
  choice: Sie riefen laut
  rationale: κράζω bezeichnet einen lauten, dringlichen Ruf. Im natürlichen Deutschen ist „riefen laut“ ausreichend; ein zusätzliches „und sagten“ wäre redundant, obwohl es die griechische Struktur formaler abbildete.
- source_word: Ἐλέησον ἡμᾶς
  choice: Hab Erbarmen mit uns
  rationale: Der Aoristimperativ ist eine unmittelbare Bitte um erbarmendes Handeln. „Hab Erbarmen mit uns“ ist würdig, verständlich und semantisch präzise.
- source_word: υἱὲ Δαυίδ
  choice: Sohn Davids
  rationale: Die wörtliche Titelwiedergabe bewahrt die königlich-messianische Bedeutung und reduziert die Formulierung nicht auf eine bloße Abstammungsangabe.
theological_decisions:
- issue: Messianische Bedeutung von υἱὲ Δαυίδ
  choice: Der Haupttext behält den Titel „Sohn Davids“ bei.
  alternative: Eine erklärende Wiedergabe wie „verheißener Nachkomme Davids“ oder „messianischer Sohn Davids“.
  rationale: Der griechische Text nennt den traditionellen Titel ohne erklärenden Zusatz. Die wörtliche Wiedergabe bewahrt seine messianische und königliche Resonanz, ohne die Aussage im Haupttext auszulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt eindringlich, ohne altertümliche Formen. Der Fußnotenmarker steht unmittelbar nach dem erklärungsbedürftigen Titel.
