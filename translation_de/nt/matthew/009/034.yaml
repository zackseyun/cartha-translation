id: MAT.9.34
reference: Matthew 9:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: de
  text: 'Die Pharisäer aber sagten: »Durch den Herrscher[a] der Dämonen treibt er die Dämonen aus.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürsten“.'
    reason: Lexikalische Alternative für ἄρχων; „Fürst“ ist traditionell, während „Herrscher“ die Autoritätsstellung in heutigem Deutsch unmittelbarer ausdrückt.
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Das nachgestellte „aber“ gibt den Gegensatz zwischen der vorausgehenden Reaktion der Menge und der feindseligen Deutung der Pharisäer natürlich wieder.
- source_word: Φαρισαῖοι
  choice: die Pharisäer
  rationale: Die übliche deutsche Bezeichnung bewahrt den bestimmten Artikel des griechischen Textes.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt beschreibt das Äußern in der Vergangenheit; im Deutschen ist „sagten“ hier natürlicher als eine schwerfällige Verlaufsform. Ein wiederholtes Sagen ist möglich, wird vom unmittelbaren Zusammenhang aber nicht zwingend verlangt.
- source_word: Ἐν τῷ ἄρχοντι
  choice: Durch den Herrscher
  rationale: ἐν mit Dativ bezeichnet hier Mittel beziehungsweise wirksame Macht. „Durch“ macht die Anschuldigung verständlich, ohne eine räumliche Bedeutung hineinzulesen.
- source_word: ἄρχοντι
  choice: Herrscher
  rationale: „Herrscher“ gibt die Autoritätsstellung von ἄρχων direkt und in modernem Deutsch wieder; „Fürst“ ist eine mögliche traditionellere Alternative.
- source_word: τῶν δαιμονίων
  choice: der Dämonen
  rationale: Der Genitiv bezeichnet die Dämonen als den Herrschaftsbereich des genannten Herrschers.
- source_word: ἐκβάλλει
  choice: treibt ... aus
  rationale: „Austreiben“ ist im Deutschen die klare und etablierte Wiedergabe von ἐκβάλλω im Zusammenhang mit Dämonenaustreibungen.
- source_word: τὰ δαιμόνια
  choice: die Dämonen
  rationale: „Dämonen“ entspricht δαιμόνια genauer als die allgemeinere Wiedergabe „böse Geister“; der Artikel wird natürlich wiedergegeben.
theological_decisions:
- issue: Wiedergabe von δαιμόνια im Zusammenhang einer Austreibung
  choice: Dämonen
  alternative: böse Geister
  rationale: Der Ausgangstext nennt ausdrücklich δαιμόνια und nicht πνεύματα. „Dämonen“ bewahrt daher die konkrete übernatürliche Aussage.
- issue: Quelle beziehungsweise Mittel der Austreibung
  choice: Durch den Herrscher der Dämonen
  alternative: In dem Herrscher der Dämonen
  rationale: Die instrumentale Bedeutung von ἐν mit Dativ gibt die Anschuldigung wieder, Jesus treibe Dämonen kraft der Macht ihres Herrschers aus. Die Formulierung entscheidet nicht darüber hinaus, wie dieses Verhältnis theologisch zu erklären wäre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung „Die Pharisäer aber“ hält den adversativen Anschluss sichtbar. Die direkte Rede bleibt knapp und anklagend; die Wiederholung von „Dämonen“ entspricht dem griechischen Text.
