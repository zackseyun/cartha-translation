id: MAT.9.35
reference: Matthew 9:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: de
  text: Und Jesus zog durch alle Städte und Dörfer, lehrte in ihren Synagogen, verkündete die gute Nachricht[a] vom Reich und heilte jede Krankheit und jedes Gebrechen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Evangelium vom Reich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jede Krankheit und jede Schwäche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: zog durch
  rationale: Das Imperfekt beschreibt Jesu fortdauernde Reisetätigkeit. „Zog durch“ gibt diese Bewegung knapp und natürlich wieder.
- source_word: τὰς πόλεις πάσας καὶ τὰς κώμας
  choice: alle Städte und Dörfer
  rationale: Die Wiedergabe wahrt die Unterscheidung zwischen größeren Orten und kleineren Siedlungen und bezieht πάσας sinngemäß auf beide Gruppen.
- source_word: διδάσκων
  choice: lehrte
  rationale: Die finite Reihung ist im Deutschen flüssiger als mehrere Partizipien und bewahrt die Gleichordnung der fortlaufenden Tätigkeiten.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: in ihren Synagogen
  rationale: „Synagogen“ bewahrt den historischen und religiösen Begriff; „ihren“ gibt αὐτῶν ausdrücklich wieder und bezieht sich auf die jeweiligen Ortsgemeinschaften.
- source_word: κηρύσσων
  choice: verkündete
  rationale: „Verkündete“ erhält den öffentlichen, heroldartigen Charakter des Verbs, ohne die Aussage auf eine bestimmte Form kirchlicher Predigt zu verengen.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: die gute Nachricht vom Reich
  rationale: „Gute Nachricht“ macht die Grundbedeutung von εὐαγγέλιον unmittelbar verständlich. „Vom Reich“ bewahrt die offene Beziehung des Genitivs in idiomatischem Deutsch.
- source_word: θεραπεύων
  choice: heilte
  rationale: „Heilte“ ist im Zusammenhang der Wundertaten Jesu die natürliche und sachlich passende Wiedergabe.
- source_word: πᾶσαν νόσον
  choice: jede Krankheit
  rationale: νόσος bezeichnet eine Krankheit oder Erkrankung; „jede“ erhält den umfassenden Ausdruck πᾶσαν.
- source_word: πᾶσαν μαλακίαν
  choice: jedes Gebrechen
  rationale: μαλακία kann Krankheit, Schwäche oder Gebrechen bezeichnen. „Gebrechen“ unterscheidet den Ausdruck von νόσος und ist weiterhin allgemein verständlich.
theological_decisions:
- issue: Wiedergabe von εὐαγγέλιον
  choice: gute Nachricht
  alternative: Evangelium
  rationale: Die verständliche Wiedergabe bringt den lexikalischen Sinn unmittelbar zum Ausdruck, ohne den theologischen Gehalt oder den traditionellen Begriff als mögliche Übersetzung auszuschließen.
- issue: Umfang der Heilungsaussage in πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: jede Krankheit und jedes Gebrechen
  alternative: jede Krankheit und jede Schwäche
  rationale: Die Wiederholung von πᾶσαν wird mit „jede … und jedes …“ erhalten. So bleibt die umfassende Formulierung bestehen, ohne die Bedeutungsbreite von μαλακία dogmatisch einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei griechischen Partizipien werden als koordinierte finite Verben wiedergegeben, was im Deutschen natürlicher klingt und ihre gleichzeitige bzw. fortlaufende Funktion wahrt. „Reich“ bleibt wie im Ausgangstext ohne erklärenden Zusatz stehen.
