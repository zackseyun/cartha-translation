  source_fidelity: Der Text gibt καὶ ἐγερθεὶς ὁ Ἰησοῦς ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ zuverlässig wieder. „stand Jesus auf“ bildet das intransitiv gebrauchte ἐγερθεὶς idiomatisch ab; „folgte ihm“ wahrt den Bezug auf den im vorigen Vers genannten Vorsteher. Die elliptische zweite Koordination wird mit „seine Jünger folgten ebenfalls“ klar und ohne Bedeutungszusatz ergänzt.
