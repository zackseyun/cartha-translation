  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: de
  text: Da stand Jesus auf und folgte ihm, und seine Jünger folgten ebenfalls.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: stand … auf
  rationale: Das Aoristpartizip von ἐγείρω wird hier intransitiv gebraucht und bezeichnet die der folgenden Handlung vorausgehende Bewegung. Die finite Formulierung ist im modernen deutschen Erzählstil natürlich und präzise.
- source_word: ἠκολούθει
  choice: folgte
  rationale: Der Imperfekt beschreibt das einsetzende beziehungsweise fortdauernde Folgen. Im deutschen Erzählzusammenhang gibt das Präteritum dies natürlich wieder, ohne den Verlaufsaspekt unnötig zu betonen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen wird von ἀκολουθέω regiert. Sein Bezug ist der im vorherigen Vers genannte führende Mann; die im Zusammenhang eindeutige pronominale Form bewahrt die Ausdrucksweise des Griechischen.
- source_word: μαθηταὶ
  choice: Jünger
  rationale: „Jünger“ ist im Evangelienkontext die sachlich und sprachlich angemessene Wiedergabe für μαθηταί und bezeichnet Jesu Schüler und Anhänger.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: und seine Jünger folgten ebenfalls
  rationale: Im Griechischen ist das Verb im zweiten Satzglied ausgelassen und sinngemäß zu ergänzen. Die Wiederaufnahme von „folgten“ klingt im Deutschen klar und natürlich; „ebenfalls“ gibt das koordinierende καί idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. „Da“ gibt das einleitende καί als Fortführung der Handlung wieder. Die Satzstruktur bleibt knapp und wahrt den Unterschied zwischen Jesus und seinen Jüngern.
