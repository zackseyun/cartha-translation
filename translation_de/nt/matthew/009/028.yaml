id: MAT.9.28
reference: Matthew 9:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: de
  text: 'Als er in das Haus kam, traten die blinden Männer zu ihm. Da fragt Jesus sie: »Glaubt ihr, dass ich das tun kann?« Sie antworten ihm: »Ja, Herr.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Anrede kann hier auch einfach als respektvolle Anrede verstanden werden, etwa im Sinn von „mein Herr“. „Herr“ lässt zugleich eine Anerkennung der Autorität Jesu anklingen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Als er in das Haus kam
  rationale: Die temporale Wendung gibt das aoristische Partizip mit δέ natürlich wieder, ohne die Reihenfolge stärker festzulegen, als es der griechische Text tut.
- source_word: προσῆλθον αὐτῷ
  choice: traten ... zu ihm
  rationale: „Zu jemandem treten“ gibt die gezielte Annäherung von προσέρχομαι präzise und in würdigem, natürlichem Deutsch wieder.
- source_word: οἱ τυφλοί
  choice: die blinden Männer
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet im Zusammenhang die beiden zuvor genannten Männer; die Formulierung ist im Deutschen klarer als „die Blinden“.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Da fragt Jesus sie
  rationale: Das historische Präsens bleibt erhalten. „Fragt“ gibt aufgrund des unmittelbar folgenden Fragesatzes den kommunikativen Sinn von λέγει idiomatisch wieder; „da“ markiert den Fortgang der Erzählung.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: Glaubt ihr, dass ich das tun kann?
  rationale: Die Formulierung bewahrt die Frage nach Jesu Fähigkeit, klingt aber natürlicher als das schwerfälligere „dass ich fähig bin, dies zu tun“.
- source_word: λέγουσιν αὐτῷ
  choice: Sie antworten ihm
  rationale: Auch hier bleibt das historische Präsens erhalten. Da die Worte eine direkte Erwiderung auf Jesu Frage sind, ist „antworten“ im Deutschen natürlicher als „sagen“.
- source_word: Ναί, κύριε
  choice: Ja, Herr
  rationale: „Ja“ entspricht der schlichten Bejahung. „Herr“ bewahrt sowohl die respektvolle Anrede als auch die mögliche Anerkennung der Autorität Jesu.
theological_decisions:
- issue: Anrede κύριε an Jesus
  choice: Herr
  alternative: mein Herr; respektvolle Anrede ohne ausdrücklichen christologischen Titel
  rationale: κύριε kann in diesem Zusammenhang eine höfliche Anrede sein und zugleich eine weitergehende Anerkennung von Jesu Autorität ausdrücken. „Herr“ lässt diese Spannung bestehen, ohne eine voll entwickelte christologische Aussage zu erzwingen.
- issue: Historisches Präsens λέγει und λέγουσιν
  choice: fragt / antworten
  alternative: fragte / antworteten
  rationale: Das Präsens erhält die erzählerische Unmittelbarkeit des griechischen Textes. Die deutschen Verben geben dabei die jeweilige Gesprächsfunktion natürlich wieder.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens des griechischen Textes wird bewahrt; unnötig wörtliche oder altertümliche Formulierungen werden vermieden.
