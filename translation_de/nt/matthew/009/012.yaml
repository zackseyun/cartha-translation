  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: de
  text: 'Als er das hörte, sagte er: »Nicht die Gesunden brauchen einen Arzt, sondern die Kranken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Als er das hörte
  rationale: Das Aoristpartizip wird natürlich temporal wiedergegeben. Das im Griechischen unausgesprochene Objekt wird aus dem unmittelbaren Zusammenhang als »das« ergänzt.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier einen leichten Übergang beziehungsweise Gegensatz. Dieser ergibt sich im Deutschen bereits aus Jesu Reaktion; ein zusätzliches »aber« nach dem einleitenden Nebensatz wäre möglich, jedoch stilistisch schwerfälliger.
- source_word: εἶπεν
  choice: sagte er
  rationale: Die schlichte Wiedergabe bleibt beim allgemeinen griechischen Redeverb und vermeidet das stärker deutende »antwortete er«.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: brauchen nicht
  rationale: Die deutsche idiomatische Formulierung gibt χρείαν ἔχειν klar und knapp wieder; durch die Voranstellung »Nicht die Gesunden« bleibt die Kontraststruktur erhalten.
- source_word: οἱ ἰσχύοντες
  choice: die Gesunden
  rationale: Obwohl ἰσχύω grundsätzlich »stark sein« bedeutet, bezeichnet es im ausdrücklichen Gegensatz zu den Kranken idiomatisch Menschen, denen es gesundheitlich gut geht.
- source_word: ἰατροῦ
  choice: einen Arzt
  rationale: »Arzt« ist die natürliche, präzise und würdige moderne Entsprechung zu ἰατρός.
- source_word: οἱ κακῶς ἔχοντες
  choice: die Kranken
  rationale: κακῶς ἔχειν ist im medizinischen Zusammenhang die übliche Wendung für Kranksein. Die substantivierte Form wahrt die knappe Parallelität.
theological_decisions:
- issue: Bildliche gegenüber rein körperlicher Bedeutung des Sprichworts
  choice: Die Aussage wird im Haupttext in ihrer medizinischen Bildsprache wiedergegeben.
  alternative: Die geistliche Anwendung auf Sünder ausdrücklich in die Übersetzung aufnehmen.
  rationale: Der Kontext erschließt die geistliche Anwendung, während der griechische Wortlaut selbst ein medizinisches Sprichwort formuliert. Die unverdeutlichte Bildsprache bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. »Gesunde« und »Kranke« geben den medizinischen Gegensatz idiomatisch wieder; keine Fußnote ist nötig.
