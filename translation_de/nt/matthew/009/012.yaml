  source_fidelity: Der Text gibt die temporale Funktion von ἀκούσας treffend wieder und ergänzt das kontextuell implizite Objekt mit „das“. Die Auslassung von δέ ist im Deutschen stilistisch vertretbar; der Übergang bleibt durch den Kontext erkennbar. „Gesunden“ und „Kranken“ geben den medizinisch geprägten Kontrast von οἱ ἰσχύοντες und οἱ κακῶς ἔχοντες idiomatisch und quellentreu wieder. Die elliptische zweite Satzhälfte entspricht der knappen Spruchform des Griechischen.
  naturalness: '„Als er das hörte, sagte er: »Nicht die Gesunden brauchen einen Arzt, sondern die Kranken.«“ ist flüssiges modernes Standarddeutsch. Die Wortstellung und die parallele substantivierte Formulierung wirken natürlich und bewahren den sprichwörtlichen Ton.'
