  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: de
  text: Während sie hinausgingen, da brachte man ihm einen stummen[a] Mann, der von einem Dämon besessen war[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tauben“. Das griechische Wort kann je nach Zusammenhang „stumm“ oder „taub“ bedeuten. Dass der Mann im nächsten Vers spricht, spricht hier für „stumm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der dämonisiert war“ beziehungsweise „der unter der Macht eines Dämons stand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Während sie hinausgingen
  rationale: Der Genitivus absolutus bezeichnet die gleichzeitig stattfindende Handlung; δέ dient hier vor allem dem Szenenübergang und muss im Deutschen nicht eigens mit „aber“ wiedergegeben werden.
- source_word: ἰδοὺ
  choice: 'sieh: Da'
  rationale: „Sieh“ bewahrt den aufmerksamkeitslenkenden, erzählerisch lebhaften Impuls von ἰδού; das anschließende „Da“ führt die überraschende Handlung natürlich ein.
- source_word: προσήνεγκαν αὐτῷ
  choice: brachte man ... zu ihm
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen idiomatisch mit „man“ wiedergegeben; „zu ihm“ bildet αὐτῷ ausdrücklich ab.
- source_word: ἄνθρωπον
  choice: Mann
  rationale: Im vorliegenden Heilungsbericht bezeichnet ἄνθρωπος eine männliche Einzelperson.
- source_word: κωφὸν
  choice: stummen
  rationale: κωφός kann je nach Zusammenhang „taub“ oder „stumm“ bedeuten. Da Vers 33 anschließend hervorhebt, dass der Mann sprach, ist hier „stumm“ kontextuell vorzuziehen; die echte lexikalische Alternative bleibt in der Fußnote erhalten.
- source_word: δαιμονιζόμενον
  choice: der von einem Dämon besessen war
  rationale: Die Formulierung gibt die dämonische Bedrängnis klar und geläufig wieder, ohne über deren genaue Art mehr auszusagen, als der griechische Ausdruck erkennen lässt.
theological_decisions:
- issue: Wiedergabe der dämonischen Bedrängnis
  choice: der von einem Dämon besessen war
  alternative: der dämonisiert war / der unter der Macht eines Dämons stand
  rationale: Der Text stellt eine reale dämonische Bedrängnis fest, bestimmt aber deren genaue Wirkungsweise nicht näher. Die gewählte Formulierung ist im Deutschen verständlich und traditionell geläufig; die weniger deutende Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ erhält bewusst das Aufmerksamkeitssignal des griechischen ἰδού, ohne das altertümlichere „siehe“ zu verwenden. Der Relativsatz vermeidet die im Deutschen schwerfällige Häufung „ein stummer, dämonenbesessener Mann“ und hält zugleich beide Beschreibungen des Mannes klar zusammen.
