source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: de
  text: 'Doch damit ihr wisst, dass der Menschensohn[a] Vollmacht hat, auf der Erde Sünden zu vergeben« – dann sagt er zu dem Gelähmten: »Steh auf, nimm dein Bett[b] und geh nach Hause.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »der Sohn des Menschen«. »Menschensohn« ist die traditionelle Wiedergabe der Selbstbezeichnung Jesu und bewahrt die mögliche Anspielung auf Daniel 7.
    reason: lexical_alternative
  - marker: b
    text: Oder »deine Liege« beziehungsweise »deine Schlafmatte«. Das griechische Wort kann ein Bett, eine Liege oder eine einfache Schlafunterlage bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Doch damit ihr wisst
  rationale: δὲ markiert einen leichten Gegensatz bzw. Übergang, während ἵνα den Zweck einleitet. Die Wendung ist im Deutschen natürlich und wahrt beides.
- source_word: ἐξουσίαν ἔχει
  choice: Vollmacht hat
  rationale: ἐξουσία bezeichnet hier legitime Autorität oder Befugnis, nicht bloß die Fähigkeit. »Vollmacht« gibt diesen Sinn im biblischen Kontext prägnant wieder.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte Selbstbezeichnung Jesu bewahrt die mögliche Anspielung auf Daniel 7 und vermeidet eine vorschnelle Auflösung des Titels.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die Präpositionalphrase bezeichnet hier den irdischen Wirkungsbereich; »auf der Erde« ist quellennah und idiomatisch.
- source_word: ἀφιέναι ἁμαρτίας
  choice: Sünden zu vergeben
  rationale: ἀφίημι bedeutet in diesem Zusammenhang Sünden vergeben bzw. erlassen; die gewählte Formulierung ist klar und etabliert.
- source_word: τότε λέγει
  choice: Dann sagt er
  rationale: Das historische Präsens λέγει wird als Präsens wiedergegeben, wodurch die erzählerische Unmittelbarkeit erhalten bleibt.
- source_word: τῷ παραλυτικῷ
  choice: zu dem Gelähmten
  rationale: Das substantivierte Adjektiv bezeichnet die gelähmte Person. »Der Gelähmte« ist knapp, verständlich und vermeidet das im heutigen Deutsch ungebräuchliche »Paralytiker«.
- source_word: Ἐγερθεὶς
  choice: Steh auf
  rationale: Das Aoristpartizip hat in der Befehlsfolge imperativische Kraft. »Steh auf« gibt diese direkt und natürlich wieder.
- source_word: ἆρόν
  choice: nimm
  rationale: αἴρω bedeutet hier aufnehmen und mitnehmen. Im Zusammenhang mit dem Bett ist »nimm« idiomatisch und wird durch den folgenden Gang nach Hause konkretisiert.
- source_word: κλίνην
  choice: Bett
  rationale: κλίνη kann Bett, Liege oder Schlafmatte bezeichnen. »Bett« ist die breiteste natürliche Wiedergabe; die gegenständliche Unschärfe wird in der Fußnote angezeigt.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: geh nach Hause
  rationale: οἶκος kann sowohl Haus als auch Zuhause meinen. Die deutsche Richtungsangabe »nach Hause« ist hier die natürliche Entsprechung des gesamten Ausdrucks.
theological_decisions:
- issue: Christologischer Titel ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: »Menschensohn« erhält Jesu bedeutsame Selbstbezeichnung und ihre wahrscheinliche Daniel-7-Resonanz, ohne die im Ausdruck liegende Mehrdeutigkeit interpretierend einzuebnen.
- issue: Bedeutung von ἐξουσία beim Vergeben von Sünden
  choice: Vollmacht
  alternative: Macht / Recht
  rationale: Der Vers betont die legitime Befugnis Jesu, Sünden zu vergeben, nicht lediglich seine Fähigkeit. »Vollmacht« wahrt diese Aussage, ohne sie dogmatisch auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt; die Auslassung vor dem eingeschobenen Erzählerkommentar macht den im griechischen Satz angelegten Abbruch der Rede verständlich. »Vollmacht«, »Menschensohn« und »Sünden vergeben« erhalten die theologische Dichte, ohne konfessionelle Zusätze.
