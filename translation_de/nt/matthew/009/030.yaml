  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: de
  text: 'Und ihre Augen wurden geöffnet. Jesus warnte sie eindringlich: „Seht zu, dass niemand davon erfährt!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Seht zu, dass niemand weiß.“ Der Gegenstand des Wissens wird im Griechischen nicht ausdrücklich genannt, sondern ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: wurden geöffnet
  rationale: Der Aorist Passiv von ἀνοίγω wird formnah wiedergegeben und bezeichnet in diesem Zusammenhang die Wiederherstellung des Sehvermögens, ohne einen ausdrücklich genannten Handelnden hinzuzufügen.
- source_word: οἱ ὀφθαλμοί
  choice: ihre Augen
  rationale: Die possessive Wendung gibt αὐτῶν οἱ ὀφθαλμοί in natürlichem modernem Deutsch wieder.
- source_word: ἐνεβριμήθη
  choice: warnte sie eindringlich
  rationale: ἐμβριμάομαι bezeichnet hier angesichts des anschließenden Verbots eine nachdrückliche, von starker Regung getragene Weisung. „Eindringlich warnte“ bewahrt die Kraft, ohne ein Motiv zu unterstellen.
- source_word: λέγων
  choice: durch Doppelpunkt wiedergegeben
  rationale: Das gleichzeitige Partizip leitet den Inhalt der Warnung ein; im Deutschen verbindet ein Doppelpunkt beides natürlicher als das formale „indem er sagte“.
- source_word: Ὁρᾶτε
  choice: Seht zu
  rationale: Der Imperativ dient als eindringliche Aufforderung zur Wachsamkeit und wird idiomatisch mit „Seht zu“ wiedergegeben.
- source_word: μηδεὶς γινωσκέτω
  choice: dass niemand davon erfährt
  rationale: Der Imperativ der dritten Person mit μηδείς drückt ein Verbot aus. „Davon“ macht den im Zusammenhang erschlossenen Bezug auf die Heilung im Deutschen verständlich, ohne den Grund des Schweigegebots festzulegen.
theological_decisions:
- issue: Stärke und Zweck des Schweigegebots Jesu
  choice: Jesus spricht eine eindringliche Warnung aus, dass niemand von der Heilung erfahren soll.
  alternative: Jesus fährt sie an beziehungsweise erteilt ihnen einen strikten Befehl.
  rationale: Der starke Ton des Verbs wird bewahrt; ein theologischer oder strategischer Grund für das Schweigegebot wird nicht ergänzt, da der Vers keinen nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von καί wird nicht mechanisch mit zwei aufeinanderfolgenden „Und“ nachgebildet. Der Doppelpunkt gibt λέγων idiomatisch wieder; das Ausrufezeichen entspricht der starken Befehlsform.
