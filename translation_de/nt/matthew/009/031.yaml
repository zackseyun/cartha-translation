source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: de
  text: Doch nachdem sie hinausgegangen waren, verbreiteten sie die Kunde von ihm in jener ganzen Gegend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in jenem ganzen Land“. Das griechische Wort γῆ kann „Land“, „Gebiet“ oder „Gegend“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den milden Gegensatz zu Jesu unmittelbar vorausgehendem Schweigegebot und gibt die erzählerische Wendung natürlich wieder.
- source_word: ἐξελθόντες
  choice: nachdem sie hinausgegangen waren
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die der Haupthandlung vorausgeht; die Formulierung bewahrt diese zeitliche Abfolge.
- source_word: διεφήμισαν
  choice: verbreiteten sie die Kunde
  rationale: Das Verb bezeichnet das weithin Bekanntmachen oder Verbreiten einer Nachricht; „die Kunde verbreiten“ ist im Deutschen verständlich und dem würdevollen Erzählstil angemessen.
- source_word: αὐτὸν
  choice: von ihm
  rationale: Beim deutschen Ausdruck „die Kunde verbreiten“ wird das griechische direkte Objekt idiomatisch als Inhalt der Kunde mit „von ihm“ wiedergegeben.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: in jener ganzen Gegend
  rationale: γῆ kann Land, Gebiet oder Gegend bedeuten. Im örtlichen Zusammenhang bezeichnet „Gegend“ den begrenzten geografischen Raum natürlich, ohne den Umfang zu überzeichnen.
theological_decisions:
- issue: Geografischer Umfang von γῆ
  choice: Gegend
  alternative: Land
  rationale: Der Zusammenhang spricht vom Bekanntwerden Jesu im örtlichen Umfeld. „Gegend“ bewahrt diesen naheliegenden Sinn; die ebenfalls mögliche Wiedergabe „Land“ wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in einem würdevollen Erzählton. „Die Kunde von ihm verbreiten“ ist leicht gehoben, aber geläufig und vermeidet eine schwerfällige Umschreibung.
