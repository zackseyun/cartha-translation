    issue: „sah sie an“ ist leicht interpretierend.
    rationale: ἰδὼν αὐτήν bedeutet unmittelbar „sie sehend/sah sie“. Die Partikel „an“ kann einen gezielten oder eindringlichen Blick ausdrücken, der nicht eigens im griechischen Wortlaut steht.
  - severity: low
    issue: Stellung der Zeitangabe im Schlusssatz.
    rationale: Die vorangestellte Wendung „Von jener Stunde an“ verbindet sich im Deutschen klar mit dem fortan bestehenden Heilungszustand und spiegelt die griechische Zeitangabe natürlich wider.
