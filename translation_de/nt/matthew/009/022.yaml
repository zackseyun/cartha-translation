  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzglieder, die Anrede und die Bedeutungsweite von σῴζω insgesamt zuverlässig wieder. „sah sie an“ ist jedoch gegenüber ἰδὼν αὐτήν leicht stärker, da das griechische Verb lediglich „sehen“ sagt. Die Schlussformulierung ist als Zustand korrekt, kann aber durch eine Stellung von „von jener Stunde an“ klarer als eingetretener Heilungszustand gelesen werden.
  naturalness: Modernes Standarddeutsch und der würdige Ton sind weitgehend gelungen. „Jesus aber wandte sich um und sah sie“ ist natürlicher und näher am schlichten griechischen Ausdruck als die Folge „wandte sich um, sah sie an“. „Von jener Stunde an war die Frau geheilt“ ist idiomatisch und vermeidet, dass „wurde ... von ... an geheilt“ fälschlich einen fortdauernden Behandlungsvorgang nahelegt.
  terminology: „Hab Mut“, „Tochter“ und „dein Glaube“ sind treffend. „hat dich gerettet“ bewahrt bei σέσωκέν σε die weitere Bedeutung von σῴζω; „geheilt“ im Erzählerkommentar macht das konkrete körperliche Ergebnis verständlich. Die Fußnote erhält die möglichen Bedeutungen transparent, ohne sie einseitig aufzulösen.
