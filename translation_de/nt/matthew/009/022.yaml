  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: de
  text: 'Jesus aber wandte sich um und sah sie und sagte: „Hab Mut, Tochter! Dein Glaube hat dich gerettet.“ Von jener Stunde an war die Frau geheilt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb kann sowohl „retten“ als auch „heilen“ oder „gesund machen“ bedeuten. Jesu Aussage kann daher auch lauten: „Dein Glaube hat dich geheilt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: wandte sich um
  rationale: Das aoristische Partizip wird hier intransitiv gebraucht. Die finite Wiedergabe bildet zusammen mit dem folgenden Partizip eine natürliche deutsche Handlungsfolge.
- source_word: ἰδὼν αὐτήν
  choice: sah sie an
  rationale: „Sah sie an“ gibt nicht nur das Wahrnehmen, sondern in diesem Zusammenhang auch Jesu gezielte Hinwendung zu der Frau natürlich wieder.
- source_word: Θάρσει
  choice: Hab Mut
  rationale: Der Imperativ fordert zu Zuversicht und Mut auf. „Hab Mut“ ist gegenwärtiges, klares und würdiges Deutsch.
- source_word: θύγατερ
  choice: Tochter
  rationale: Die direkte familiäre Anrede bleibt ohne deutende Zusätze erhalten und vermittelt Jesu zugewandten Ton.
- source_word: ἡ πίστις σου
  choice: dein Glaube
  rationale: „Glaube“ ist die übliche und kontextgerechte Wiedergabe von πίστις; hier schließt sie vertrauendes Sich-Verlassen ein.
- source_word: σέσωκέν σε
  choice: hat dich gerettet
  rationale: Das Perfekt von σῴζω kann Rettung wie auch Heilung bezeichnen. „Hat dich gerettet“ bewahrt in Jesu Worten die weitere Bedeutung, während der Schlusssatz die körperliche Heilung ausdrücklich benennt.
- source_word: ἐσώθη
  choice: war geheilt
  rationale: Im erzählerischen Schluss bezeichnet σῴζω das konkrete Ende des körperlichen Leidens. Die Wiedergabe unterscheidet bewusst zwischen der breiten Aussage Jesu und dem sichtbaren Heilungsergebnis.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: von jener Stunde an
  rationale: Die formnahe Wendung ist im Deutschen verständlich und bewahrt den feierlichen zeitlichen Ausdruck des griechischen Textes.
theological_decisions:
- issue: Bedeutungsumfang von σῴζω in Jesu Aussage und im Erzählerkommentar
  choice: „hat dich gerettet“ in Jesu Worten, „war … geheilt“ im Erzählerkommentar
  alternative: An beiden Stellen „geheilt“ beziehungsweise „gesund gemacht“
  rationale: Das wiederholte Verb kann sowohl retten als auch heilen bedeuten. Die differenzierte Wiedergabe erhält die mögliche heilsgeschichtliche Weite der direkten Rede und macht zugleich das unmittelbare körperliche Ergebnis deutlich.
- issue: Wiedergabe von πίστις
  choice: Glaube
  alternative: Vertrauen
  rationale: „Glaube“ wahrt den etablierten theologischen Bedeutungsraum; „Vertrauen“ ist hier eine mögliche inhaltliche Nuance, muss jedoch nicht an die Stelle des umfassenderen Ausdrucks treten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Partizipialkonstruktion wird als natürliche deutsche Handlungsfolge wiedergegeben. Die Anrede „Tochter“ und die Wendung „von jener Stunde an“ bewahren die feierliche und persönliche Färbung.
