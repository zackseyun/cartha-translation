translation:
  language: de
  text: Und diese Nachricht verbreitete sich in jener ganzen Gegend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in jenem ganzen Land“ oder „in jenem ganzen Gebiet“. Das griechische Wort γῆ kann Erde, Land, Gebiet oder Gegend bezeichnen; hier ist wahrscheinlich das umliegende Gebiet gemeint, nicht die ganze Erde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Gibt den schlichten erzählerischen Anschluss natürlich wieder, ohne eine zusätzliche Folgerung oder zeitliche Abstufung einzutragen.
- source_word: ἐξῆλθεν
  choice: verbreitete sich
  rationale: Das wörtliche Bild „ging hinaus“ bezeichnet hier das Bekanntwerden einer Nachricht. „Verbreitete sich“ ist im heutigen Deutsch idiomatisch und bewahrt den gemeinten Vorgang, ohne ihn inhaltlich zu erweitern.
- source_word: ἡ φήμη αὕτη
  choice: diese Nachricht
  rationale: φήμη bezeichnet eine umlaufende Meldung oder Kunde. „Nachricht“ vermeidet den heute häufigen Beiklang mangelnder Glaubwürdigkeit bei „Gerücht“; αὕτη wird direkt mit „diese“ wiedergegeben.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: in jener ganzen Gegend
  rationale: γῆ kann Erde, Land oder Gebiet bezeichnen. Der örtlich begrenzte Erzählzusammenhang spricht hier für „Gegend“; „jener ganzen“ bildet ὅλην und ἐκείνην ab.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Wendung „verbreitete sich“ wird gegenüber dem im Deutschen steifen „ging hinaus“ bevorzugt; die räumliche Reichweite bleibt durch „in jener ganzen Gegend“ ausdrücklich erhalten.
