id: MAT.21.11
reference: Matthew 21:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: de
  text: 'Die Menschenmengen sagten: »Das ist der Prophet Jesus aus Nazaret in Galiläa.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Prophet«. Im Griechischen steht »der Prophet«; damit kann Jesus als eine anerkannte prophetische Gestalt identifiziert sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Die Menschenmengen
  rationale: ὄχλοι steht im Plural und bezeichnet die versammelten Gruppen. »Menschenmengen« gibt den Plural natürlich wieder; das schwach weiterführende δέ muss im Deutschen nicht eigens übersetzt werden.
- source_word: ἔλεγον
  choice: sagten immer wieder
  rationale: Der Imperfekt beschreibt hier wahrscheinlich andauerndes oder wiederholtes Reden. »Sagten immer wieder« macht diesen Aspekt verständlich, ohne eine zusätzliche inhaltliche Nuance einzutragen.
- source_word: Οὗτός ἐστιν
  choice: Das ist
  rationale: Natürliche deutsche Identifikationsformel, die Demonstrativpronomen und Kopula knapp wiedergibt.
- source_word: ὁ προφήτης
  choice: der Prophet
  rationale: Der griechische Ausdruck trägt den bestimmten Artikel. Die Wiedergabe bewahrt eine mögliche Identifikation Jesu als des erwarteten oder anerkannten Propheten, ohne diese Deutung ausdrücklich festzulegen.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: aus Nazaret in Galiläa
  rationale: Die Wendung kennzeichnet Jesu Herkunft. »Aus Nazaret in Galiläa« ist im modernen Deutschen natürlich und macht die geografische Zuordnung des Genitivs τῆς Γαλιλαίας klar.
theological_decisions:
- issue: Bestimmte oder unbestimmte Wiedergabe von ὁ προφήτης
  choice: der Prophet
  alternative: ein Prophet
  rationale: Der bestimmte Artikel wird im Haupttext bewahrt. Zugleich bleibt offen, ob die Menge Jesus als den erwarteten prophetischen Heilsbringer oder lediglich als eine bekannte prophetische Gestalt bezeichnet; die Fußnote weist deshalb auf die im Deutschen mögliche unbestimmte Auffassung hin.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der wiederholte Charakter des Imperfekts wird idiomatisch ausgedrückt; die geografische Herkunftsangabe bleibt knapp und natürlich.
