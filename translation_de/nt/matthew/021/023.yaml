- from: 'Als er in den Tempel[a] kam und dort lehrte, traten die führenden Priester und die Ältesten des Volkes zu ihm und fragten: »Mit welcher Vollmacht tust du das? Und wer hat dir diese Vollmacht gegeben?«'
  to: 'Als er in den Tempel[a] kam, traten die obersten Priester und die Ältesten des Volkes zu ihm, während er lehrte, und fragten: »Mit welcher Vollmacht tust du das? Und wer hat dir diese Vollmacht gegeben?«'
  rationale: Die Revision macht die im griechischen Partizip διδάσκοντι ausgedrückte Gleichzeitigkeit ausdrücklich sichtbar und verwendet für ἀρχιερεῖς die präzise, etablierte Bezeichnung „oberste Priester“. Die Bedeutung, der knappe konfrontative Ton und die Ambiguität hinsichtlich der Quelle der Vollmacht bleiben unverändert.
