id: MAT.21.23
reference: Matthew 21:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: de
  text: 'Als er in den Tempel[a] kam, traten die obersten Priester und die Ältesten des Volkes zu ihm, während er lehrte, und fragten: »Mit welcher Vollmacht tust du das? Und wer hat dir diese Vollmacht gegeben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die gesamte Tempelanlage mit ihren Vorhöfen, nicht nur das innere Heiligtum.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Als er … kam
  rationale: Der Genitivus absolutus hat hier zeitliche Bedeutung. »Als er … kam« gibt den zeitlichen Zusammenhang natürlich wieder, ohne die genaue zeitliche Nähe weiter festzulegen.
- source_word: ἱερόν
  choice: Tempel
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage, nicht speziell das innere Heiligtum (ναός). »Tempel« ist die geläufige deutsche Wiedergabe; der genauere Umfang wird in einer Fußnote erläutert.
- source_word: προσῆλθον αὐτῷ
  choice: traten … zu ihm
  rationale: Die Formulierung gibt das körperliche Herantreten idiomatisch und erzählerisch angemessen wieder.
- source_word: διδάσκοντι
  choice: und dort lehrte
  rationale: Das Präsenspartizip bezeichnet eine gleichzeitig ablaufende Handlung. Die koordinierte deutsche Formulierung bewahrt diese Gleichzeitigkeit in natürlicher Syntax.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen priesterlichen Autoritäten und nicht mehrere gleichzeitig amtierende Hohepriester. »Führende Priester« ist für heutige Leser verständlich und sachlich präzise.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: die Ältesten des Volkes
  rationale: Die Wendung bezeichnet anerkannte nichtpriesterliche Führer des jüdischen Volkes und lässt sich formal wie verständlich wiedergeben.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Mit welcher Vollmacht
  rationale: ἐξουσία meint im Kontext die legitime Befugnis beziehungsweise Autorisierung zum Handeln. »Vollmacht« bewahrt den institutionellen und theologischen Klang der Herausforderung.
- source_word: ταῦτα ποιεῖς
  choice: tust du das
  rationale: Das griechische ταῦτα ist pluralisch, verweist aber zusammenfassend auf Jesu gegenwärtiges Handeln. Im Deutschen ist das idiomatische Singularpronomen »das« natürlicher und umfasst dennoch die gemeinten Handlungen.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: wer hat dir diese Vollmacht gegeben
  rationale: Das Perfekt ist im Deutschen die natürliche Form für die vorausliegende Erteilung einer bis in die Gegenwart wirksamen Vollmacht.
theological_decisions:
- issue: Bedeutung von ἐξουσία in der Herausforderung der führenden Männer
  choice: Vollmacht
  alternative: Befugnis; Recht; Autorität; Macht
  rationale: Die Frage gilt der legitimen Beauftragung Jesu, nicht bloß seiner Fähigkeit oder Macht. »Vollmacht« erhält sowohl die institutionelle als auch die theologische Spannung, ohne die Herkunft dieser Vollmacht vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Führende Priester« vermeidet das im heutigen Deutsch leicht missverständliche »Hohepriester« im Plural. Die direkte Rede bleibt knapp und konfrontativ; »Vollmacht« trägt die zentrale Frage nach legitimer Autorisierung.
