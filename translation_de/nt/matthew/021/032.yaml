reference: Matthew 21:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: de
  text: Denn Johannes kam zu euch auf dem Weg der Gerechtigkeit[a], und ihr habt ihm nicht geglaubt; die Zolleinnehmer aber und die Prostituierten glaubten ihm. Doch obwohl ihr das gesehen habt, habt ihr nicht einmal später eure Haltung geändert[c], um ihm zu glauben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „auf einem gerechten Weg“ oder „auf dem Weg, der zur Gerechtigkeit führt“. Die griechische Wendung kann sowohl Johannes’ Lebens- und Wirkungsweise als auch den von ihm verkündeten Weg bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um ihm zu vertrauen“. Das griechische Verb kann sowohl „glauben“ als auch „vertrauen“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „habt ihr es später nicht bereut“ oder „habt ihr später keine Sinnesänderung vollzogen“. Hier steht nicht das häufigere griechische Verb μετανοέω, sondern μεταμέλομαι, das besonders eine nachträgliche Sinnesänderung oder Reue ausdrücken kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: Denn … kam
  rationale: Der Aorist wird im erzählenden Rückblick natürlich mit „kam“ wiedergegeben; „denn“ bewahrt die begründende Verbindung zum vorherigen Vers.
- source_word: Ἰωάννης πρὸς ὑμᾶς
  choice: Johannes kam zu euch
  rationale: „Johannes“ ist die übliche deutsche Namensform; πρός mit Akkusativ bezeichnet hier die Hinwendung zu den Angesprochenen.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: auf dem Weg der Gerechtigkeit
  rationale: Die Formulierung bewahrt das Weg-Bild und lässt offen, ob vor allem Johannes’ Lebens- und Dienstweise oder der von ihm verkündete gerechte Weg gemeint ist.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: ihr habt ihm nicht geglaubt / glaubten ihm
  rationale: πιστεύω mit Dativ bezeichnet hier das Glauben beziehungsweise Vertrauen gegenüber einer Person und ihrer Botschaft. Die parallele Wiedergabe erhält den ausdrücklichen Kontrast.
- source_word: τελῶναι
  choice: Zolleinnehmer
  rationale: Der Ausdruck bezeichnet Personen, die im antiken Pachtsystem Zölle und Abgaben einzogen. „Zolleinnehmer“ ist verständlich und vermeidet die mögliche moderne Verengung von „Steuereinnehmer“ auf staatliche Beamte.
- source_word: πόρναι
  choice: Prostituierte
  rationale: Dies ist die direkte, gegenwärtig verständliche Bezeichnung und bewahrt die soziale und moralische Zuspitzung des Kontextes.
- source_word: ἰδόντες
  choice: obwohl ihr das gesehen habt
  rationale: Die konzessive Wiedergabe passt zum vorwurfsvollen Zusammenhang. „Das“ bezieht sich auf den zuvor genannten Glauben der Zolleinnehmer und Prostituierten.
- source_word: οὐδὲ … ὕστερον
  choice: auch später … nicht
  rationale: Die Stellung macht sowohl das steigernde οὐδέ als auch die zeitliche Angabe ὕστερον in natürlichem Deutsch sichtbar.
- source_word: μετεμελήθητε
  choice: eure Haltung … geändert
  rationale: Die Formulierung bezeichnet hier eine nachträgliche innere Umkehr beziehungsweise Sinnesänderung, ohne das Verb vorschnell mit dem üblichen Fachwort „Buße tun“ gleichzusetzen.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: um ihm zu glauben
  rationale: Der artikulierte Infinitiv im Genitiv beschreibt hier das Ergebnis beziehungsweise Ziel der ausgebliebenen Haltungsänderung.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη in der Weg-Formulierung
  choice: Gerechtigkeit
  alternative: gerechte Lebensweise / rechter Weg
  rationale: „Gerechtigkeit“ bewahrt den breiten matthäischen Begriff und das biblische Weg-Bild, ohne ihn auf soziale Gerechtigkeit oder lediglich persönliches Wohlverhalten zu verengen.
- issue: πιστεύω mit dem Dativ αὐτῷ
  choice: ihm glauben
  alternative: ihm vertrauen
  rationale: Im Zusammenhang geht es um die Reaktion auf Johannes und seine Botschaft. „Ihm glauben“ gibt die Konstruktion unmittelbar wieder und importiert nicht die stärker dogmatisch geprägte Wendung „an ihn glauben“.
- issue: Nuance von μεταμέλομαι
  choice: seine Haltung ändern
  alternative: bereuen / Buße tun / seine Meinung ändern
  rationale: Das Verb kann Bedauern und eine nachträgliche Sinnesänderung ausdrücken. „Die Haltung ändern“ wahrt den moralischen Ernst und unterscheidet es zugleich vom häufigeren μετανοέω, ohne eine starre begriffliche Trennung zu behaupten.
- issue: Bezug von ἰδόντες
  choice: das gesehen
  alternative: es gesehen / dies mitangesehen
  rationale: 'Das nicht ausdrücklich genannte Objekt wird aus dem unmittelbaren Kontext ergänzt: Die Angesprochenen sahen, dass Zolleinnehmer und Prostituierte Johannes glaubten. Die Ergänzung legt keine darüber hinausgehende Deutung fest.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Das wiederholte „ihm glauben“ bildet den griechischen Kontrast bewusst ab. „Zolleinnehmer“ hält den historischen Kontext deutlicher offen als das modern-amtliche „Steuereinnehmer“. Die Fußnoten bewahren die Mehrdeutigkeit der Wendung „Weg der Gerechtigkeit“ sowie die Nuancen von πιστεύω und μεταμέλομαι.
