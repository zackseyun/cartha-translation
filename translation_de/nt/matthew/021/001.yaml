id: MAT.21.1
reference: Matthew 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: de
  text: Als sie sich Jerusalem näherten und nach Betfage am Ölberg kamen, da sandte Jesus zwei Jünger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: sie sich … näherten
  rationale: Das Verb bezeichnet hier die räumliche Annäherung; die reflexive deutsche Form ist natürlich und präzise.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Die im Deutschen etablierte Form des Ortsnamens.
- source_word: ἦλθον
  choice: kamen
  rationale: Gibt das gewöhnliche Bewegungsverb schlicht wieder und unterscheidet es idiomatisch von der vorausgehenden Annäherung.
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: Gebräuchliche deutsche Schreibung des Ortsnamens.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: am Ölberg
  rationale: Die Wendung ordnet Betfage geografisch dem Ölberg zu; „am Ölberg“ ist im Deutschen natürlich und vermeidet die missverständliche Vorstellung, sie seien auf einen Berg als Ziel zugegangen.
- source_word: τότε
  choice: nicht eigens wiedergegeben
  rationale: Die zeitliche Folge wird im Deutschen durch den vorangestellten Nebensatz und das anschließende Präteritum bereits klar ausgedrückt; ein zusätzliches „da“ oder „dann“ wäre möglich, aber stilistisch schwerer.
- source_word: ἀπέστειλεν
  choice: sandte … voraus
  rationale: „Sandte“ gibt den Vorgang direkt wieder; „voraus“ macht im Deutschen idiomatisch deutlich, dass die Jünger als Boten vorangeschickt wurden, ohne den Auftrag dieses Verses vorwegzunehmen.
- source_word: δύο μαθητὰς
  choice: zwei Jünger
  rationale: Direkte und im Evangelienkontext etablierte Wiedergabe.
theological_decisions:
- issue: Subjekt der pluralischen Verben vor der ausdrücklichen Nennung Jesu
  choice: Das unbestimmte „sie“ bleibt erhalten; Jesus wird erst im Hauptsatz genannt.
  alternative: „Als Jesus und seine Jünger …“
  rationale: Der griechische Text setzt die Reisegruppe voraus, nennt sie hier aber nicht ausdrücklich. Die Übersetzung ergänzt daher keine nähere Bestimmung des Subjekts.
- issue: Verhältnis Betfages zum Ölberg
  choice: „Betfage am Ölberg“
  alternative: „Betfage, zum Ölberg“ beziehungsweise „Betfage auf dem Ölberg“
  rationale: Die geografische Zuordnung wird verständlich wiedergegeben, ohne eine überpräzise topografische Aussage zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der griechischen Erzählbewegung, vermeidet jedoch eine im Deutschen schwerfällige doppelte Zielangabe. Keine Fußnote erforderlich.
