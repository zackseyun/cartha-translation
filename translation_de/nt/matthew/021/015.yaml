id: MAT.21.15
reference: Matthew 21:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: de
  text: 'Als aber die führenden Priester und die Schriftgelehrten die erstaunlichen Dinge sahen, die er tat, und die Kinder, die im Tempelbezirk[a] laut riefen: »Hosanna[b] dem Sohn Davids!«, empörten sie sich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ἱερόν bezeichnet die gesamte Tempelanlage mit ihren Höfen, nicht speziell das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: »Hosanna« ist ein aus dem Hebräischen übernommener Ruf. Ursprünglich bedeutet er etwa »Hilf doch!« oder »Rette jetzt!«; zur damaligen Zeit diente er zugleich als Lob- und Huldigungsruf.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: als ... sahen
  rationale: Das Partizip Aorist bezeichnet den zeitlichen Umstand zur Haupthandlung; die finite Konstruktion ist im Deutschen natürlich und bewahrt diesen zeitlichen Bezug.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den leichten Gegensatz zwischen dem vorherigen Geschehen und der Reaktion der religiösen Autoritäten.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die leitenden priesterlichen Autoritäten und nicht mehrere gleichzeitig amtierende Hohepriester; die Wiedergabe macht die Funktion im heutigen Deutsch verständlich.
- source_word: οἱ γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Eingebürgerte und sachlich passende Bezeichnung für die gelehrten Ausleger und Lehrer der heiligen Schriften.
- source_word: τὰ θαυμάσια
  choice: all die erstaunlichen Dinge
  rationale: Die substantivierte Form bezeichnet bemerkenswerte Taten allgemein; die Formulierung legt sie nicht enger ausschließlich als Wunder fest.
- source_word: ἐποίησεν
  choice: die er tat
  rationale: Schlichte Wiedergabe des Aorists, passend zum weit gefassten Bezugswort τὰ θαυμάσια.
- source_word: τοὺς παῖδας
  choice: die Kinder
  rationale: Im gegebenen Zusammenhang ist ‚Kinder‘ die naheliegende Bedeutung; ‚Diener‘ ist kontextuell unwahrscheinlich, ‚Jungen‘ wäre unnötig eng.
- source_word: τοὺς κράζοντας ... καὶ λέγοντας
  choice: die ... laut riefen
  rationale: Das laute öffentliche Ausrufen samt seinem Inhalt wird im Deutschen natürlich durch ein Redeverb mit Doppelpunkt wiedergegeben; eine wörtliche Doppelung mit ‚riefen und sagten‘ wäre schwerfällig.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempelbezirk
  rationale: ἱερόν meint hier die gesamte Tempelanlage beziehungsweise ihre Höfe, nicht speziell das innere Heiligtum.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: Die aus dem Hebräischen übernommene liturgische Akklamation wird transliteriert, sodass sowohl ihr Ursprung als Hilferuf als auch ihre Funktion als Lob- und Huldigungsruf erhalten bleiben.
- source_word: τῷ υἱῷ Δαυίδ
  choice: dem Sohn Davids
  rationale: Der Dativ wird in der feststehenden Akklamation direkt bewahrt; ‚Sohn Davids‘ bleibt als messianisch bedeutsamer Titel wörtlich erhalten.
- source_word: ἠγανάκτησαν
  choice: empörten sie sich
  rationale: Gibt die starke missbilligende und unwillige Reaktion idiomatisch und prägnant wieder.
theological_decisions:
- issue: Messianische Bedeutung von υἱὸς Δαυίδ
  choice: Sohn Davids
  alternative: Erbe Davids; Davids Sohn
  rationale: Die wörtliche Form bewahrt den in Matthäus erkennbaren messianischen Titel und seine Verbindung zu den davidischen Verheißungen, ohne ihn erklärend auszuweiten.
- issue: Bedeutung und Funktion von Ὡσαννά
  choice: Hosanna im Haupttext, mit Erklärung in der Fußnote
  alternative: Hilf doch!; Rette jetzt!
  rationale: Der Ausdruck geht auf eine Bitte um Rettung zurück, fungiert hier aber zugleich als feststehender Huldigungs- und Lobruf. Die Transliteration bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Wahrnehmungsgefüge, bleibt aber gut lesbar. Die direkte Rede wird mit deutschen Anführungszeichen und einem Ausrufezeichen als laute Akklamation kenntlich gemacht.
