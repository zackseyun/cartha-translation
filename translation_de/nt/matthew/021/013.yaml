id: MAT.21.13
reference: Matthew 21:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: de
  text: 'Und er sagt zu ihnen: „Es steht geschrieben: ‚Mein Haus wird ein Haus des Gebets genannt werden‘[a]; ihr aber macht es zu einer Räuberhöhle.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus greift hier Jesaja 56,7 auf; mit „Räuberhöhle“ spielt er zugleich auf Jeremia 7,11 an.
    reason: cross_reference
  - marker: b
    text: 'Oder: „eine Höhle von Wegelagerern“. Das griechische Wort kann Räuber, aber auch gewalttätige Wegelagerer oder Banditen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: er sagt
  rationale: Das historische Präsens des griechischen Erzähltexts bleibt erhalten und verleiht der Szene Unmittelbarkeit.
- source_word: Γέγραπται
  choice: Es steht geschrieben
  rationale: Die geläufige deutsche Schriftformel gibt das griechische Perfekt angemessen wieder und lässt die fortdauernde Geltung des Geschriebenen erkennen.
- source_word: Ὁ οἶκός μου
  choice: Mein Haus
  rationale: Die wörtliche Bezeichnung bewahrt den Wortlaut des Jesaja-Zitats; „Tempel“ wäre eine kontextuell plausible, aber engere Auslegung.
- source_word: οἶκος προσευχῆς
  choice: ein Haus des Gebets
  rationale: Diese natürliche deutsche Genitivverbindung wahrt die erkennbare Schriftformulierung.
- source_word: κληθήσεται
  choice: wird … genannt werden
  rationale: Gibt das Futur Passiv direkt und in modernem Standarddeutsch wieder.
- source_word: ποιεῖτε
  choice: ihr … macht
  rationale: Das deutsche Präsens entspricht dem griechischen Präsens; die Ergänzung „zu“ bildet die resultative Aussage idiomatisch ab.
- source_word: σπήλαιον
  choice: Höhle
  rationale: Bewahrt das konkrete Bild einer Höhle beziehungsweise eines Schlupfwinkels und die Verbindung zu Jeremia 7,11.
- source_word: λῃστῶν
  choice: Räuber
  rationale: „Räuber“ ist die naheliegende allgemeine Wiedergabe; das griechische Wort kann auch gewalttätige Wegelagerer oder Bandenangehörige bezeichnen.
theological_decisions:
- issue: Verknüpfung alttestamentlicher Schrifttexte
  choice: Die Formulierungen „Mein Haus wird ein Haus des Gebets genannt werden“ und „Räuberhöhle“ bleiben als Anklänge an Jesaja 56,7 und Jeremia 7,11 erkennbar.
  alternative: Eine freiere, modernisierte Formulierung, die die schrifttextlichen Bezüge weniger deutlich erkennen lässt.
  rationale: Jesu Aussage verbindet ein ausdrückliches Zitat mit einer prophetischen Anspielung; beide Bezüge sollen transparent bleiben.
- issue: Bedeutungsumfang von λῃστῶν
  choice: Im Haupttext steht „Räuber“, während die mögliche Bedeutung „gewalttätige Wegelagerer“ in einer Fußnote genannt wird.
  alternative: „Banditen“ oder „Wegelagerer“ unmittelbar im Haupttext.
  rationale: So wird die vertraute prophetische Wendung bewahrt, ohne den weiter reichenden Bedeutungsumfang des griechischen Ausdrucks zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens und die markanten Schriftformulierungen werden beibehalten. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den die Anmerkung erläutert.
