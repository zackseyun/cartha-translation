source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: de
  text: Wenn nun der Besitzer[a] des Weinbergs kommt, was wird er mit jenen Weinbauern[b] tun?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Herr des Weinbergs“. Das griechische Wort κύριος kann „Herr“ bedeuten; hier bezeichnet es innerhalb des Gleichnisses denjenigen, dem der Weinberg gehört.
    reason: lexical_alternative
  - marker: b
    text: Oder „Pächter“. Aus dem Zusammenhang des Gleichnisses geht hervor, dass sie den Weinberg gepachtet haben; das griechische Wort selbst bedeutet allgemeiner „Bauern“ oder „Landwirte“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Mit dem Aorist Konjunktiv ἔλθῃ bezeichnet ὅταν hier den erwarteten künftigen Zeitpunkt innerhalb des Gleichnisses; „wenn“ ist im Deutschen natürlich und nicht iterativ.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ kennzeichnet idiomatisch den folgernden Übergang von der bisherigen Erzählung zu Jesu Frage; das schwerere „daher“ wäre hier weniger natürlich.
- source_word: ἔλθῃ
  choice: kommt
  rationale: Der griechische Aorist Konjunktiv nach ὅταν wird in diesem zukünftigen Temporalsatz im Deutschen idiomatisch mit dem Präsens wiedergegeben.
- source_word: κύριος
  choice: Besitzer
  rationale: Im unmittelbaren Zusammenhang bezeichnet κύριος den Verfügungsberechtigten des Weinbergs innerhalb des Gleichnisses. „Besitzer“ vermittelt diese Rolle in modernem Deutsch, ohne κύριος hier vorschnell als göttlichen Titel zu deuten.
- source_word: ἀμπελῶνος
  choice: Weinbergs
  rationale: „Weinberg“ ist die übliche und sachlich genaue Wiedergabe von ἀμπελών.
- source_word: τί ποιήσει τοῖς …
  choice: was wird er mit … tun
  rationale: Die deutsche Verbindung „mit jemandem etwas tun“ gibt die auf die Personen gerichtete Handlung mit dem griechischen Dativ natürlich wieder und lässt die konkrete Maßnahme zunächst offen.
- source_word: γεωργοῖς
  choice: Weinbauern
  rationale: γεωργός bezeichnet allgemein einen Landarbeiter oder Bauern; wegen des Weinbergkontexts präzisiert „Weinbauern“ die Tätigkeit, ohne die aus dem weiteren Gleichnis erkennbare Pächterstellung direkt in das Wort hineinzulesen.
- source_word: ἐκείνοις
  choice: jenen
  rationale: „Jenen“ bewahrt die hervorhebende und leicht distanzierende Wirkung des Demonstrativpronomens stärker als bloßes „den“.
theological_decisions:
- issue: Wiedergabe von κύριος im Gleichnis
  choice: Besitzer
  alternative: Herr
  rationale: κύριος kann „Herr“ oder „Lord“ bedeuten, bezeichnet hier grammatisch und erzählerisch jedoch den Besitzer beziehungsweise Herrn des Weinbergs. „Besitzer“ hält den unmittelbaren Sinn klar, ohne eine mögliche symbolische Deutung des Gleichnisses zum ausdrücklichen Wortlaut des Verses zu machen.
- issue: Bezeichnung der γεωργοί
  choice: Weinbauern
  alternative: Pächter
  rationale: Der weitere Kontext zeigt, dass die Männer den Weinberg als Pächter bewirtschaften. Das einzelne griechische Wort γεωργοί bezeichnet jedoch zunächst die Bearbeiter oder Bauern. „Weinbauern“ wahrt diese lexikalische Offenheit; die Fußnote nennt die kontextuell naheliegende Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Sprachgebrauch, während „jenen“ die demonstrative Zuspitzung des griechischen Textes erhält. Die Fußnoten stehen jeweils unmittelbar an dem Wort, auf das sie sich beziehen.
