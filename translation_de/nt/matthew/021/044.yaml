  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: de
  text: Wer auf diesen Stein fällt, wird zerschmettert werden; auf wen aber der Stein fällt, den wird er zermalmen[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder noch bildhafter: „zu Staub zermahlen“ oder „wie Spreu zerstreuen“.'
    reason: lexical_alternative
  - marker: b
    text: Dieser Vers fehlt in einigen Handschriften des Matthäusevangeliums; eine Parallele steht jedoch in Lukas 20,18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: Wer … fällt
  rationale: Das substantivierte Partizip bezeichnet allgemein eine Person. Die deutsche Wer-Konstruktion gibt diesen sprichwortartigen, offenen Bezug natürlich wieder.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: auf diesen Stein
  rationale: Die räumliche Bedeutung und das konkrete Steinmotiv des Zusammenhangs bleiben unmittelbar erhalten.
- source_word: συνθλασθήσεται
  choice: wird zerschmettert werden
  rationale: Das Futur Passiv bezeichnet ein gewaltsames Zerbrechen. „Zerschmettert“ wahrt zugleich einen erkennbaren Unterschied zum folgenden λικμήσει.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: auf wen aber der Stein fällt
  rationale: Die indefinite Relativkonstruktion wird im Deutschen direkt wiedergegeben. Das wiederholte Substantiv „der Stein“ verdeutlicht ohne sachliche Erweiterung, dass nun der Stein das Subjekt des Fallens ist.
- source_word: λικμήσει
  choice: wird … zermalmen
  rationale: Das Verb kann ein gründliches Zerkleinern bis hin zum Pulverisieren oder Zerstreuen bezeichnen. „Zermalmen“ ist kräftig, verständlich und unterscheidet sich von „zerschmettern“.
- source_word: αὐτόν
  choice: den
  rationale: Das maskuline Singularpronomen wird durch das Korrelat der deutschen Wer-Konstruktion aufgenommen und behält den individuellen Bezug bei.
theological_decisions:
- issue: Steinbild und Gerichtsmetaphorik
  choice: Das konkrete Steinbild und die beiden unterschiedlichen Wirkungen bleiben ohne ausdrückliche Deutung erhalten.
  alternative: Den Stein im Vers selbst ausdrücklich mit Jesus beziehungsweise dem Messias gleichsetzen oder beide Verben zu einer allgemeinen Vernichtungsaussage vereinheitlichen.
  rationale: Der Kontext erschließt die Bildsprache, doch der Vers selbst formuliert sie sprichwortartig. Die Übersetzung bewahrt ihre Härte und Spannung, ohne die Auslegung in den Wortlaut einzutragen.
- issue: Textkritischer Status des Verses
  choice: Der Vers steht im Haupttext und seine handschriftliche Bezeugung wird in einer Fußnote erläutert.
  alternative: Den Vers ohne Hinweis drucken oder aus dem Haupttext entfernen.
  rationale: 'Die SBLGNT-Markierung und die Überlieferungslage verlangen Transparenz: Einige Handschriften lassen den Vers aus, während Lukas 20,18 eine Parallele bietet.'
- issue: Generischer maskuliner Singular
  choice: Die Konstruktion „auf wen … den“ erhält den singularischen Personenbezug.
  alternative: Eine pluralische oder unpersönliche Umschreibung verwenden.
  rationale: So bleibt die grammatische und repräsentative Kraft des griechischen Singulars in idiomatischem Deutsch erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftigen Verben „zerschmettern“ und „zermalmen“ erhalten die Abstufung der beiden griechischen Verben; die Syntax bleibt knapp und sprichwortartig.
