id: MAT.21.14
reference: Matthew 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: de
  text: Da kamen im Tempel[a] Blinde und Gehbehinderte zu ihm, und er heilte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet hier das gesamte Tempelgelände mit seinen Höfen, nicht nur das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον (προσέρχομαι)
  choice: kamen … zu ihm
  rationale: Die Wendung gibt die auf Jesus gerichtete Annäherung idiomatisch und ohne unnötig formellen Ton wieder.
- source_word: τυφλοὶ
  choice: Blinde
  rationale: Das substantivierte Adjektiv bezeichnet blinde Menschen. „Blinde“ entspricht knapp der griechischen Form und ist im Deutschen verständlich.
- source_word: χωλοὶ
  choice: Gehbehinderte
  rationale: χωλός bezeichnet Menschen, deren Gehfähigkeit beeinträchtigt ist. „Gehbehinderte“ ist genauer als „Gelähmte“, da der griechische Ausdruck keine vollständige Lähmung voraussetzt, und zeitgemäßer als „Lahme“.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel[a]
  rationale: ἱερόν bezeichnet hier das gesamte Tempelgelände und nicht speziell das innere Heiligtum. Die knappe deutsche Form bleibt natürlich; die Fußnote erläutert den räumlichen Umfang.
- source_word: ἐθεράπευσεν
  choice: er heilte
  rationale: θεραπεύω bedeutet in diesem Zusammenhang, körperlich Kranke oder Beeinträchtigte zu heilen; „heilte“ ist die klare und im Evangelienkontext natürliche Wiedergabe.
theological_decisions:
- issue: Ort der Heilung und Bedeutung von ἱερόν
  choice: Jesus heilte sie auf dem Tempelgelände, wiedergegeben als „im Tempel“.
  alternative: „in den Tempelhöfen“ oder „auf dem Tempelgelände“
  rationale: Der Text nennt das ἱερόν, also den größeren Tempelbezirk, nicht den inneren Tempelbau beziehungsweise das Heiligtum (ναός). Die Übersetzung wahrt die übliche deutsche Ausdrucksweise, während die Fußnote eine irreführende Verengung vermeidet.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Voranstellung „Da kamen“ führt den Erzählfluss natürlich fort. „Gehbehinderte“ vermeidet die sachlich engere Deutung „Gelähmte“ und das heute teils veraltet wirkende „Lahme“.
