  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: de
  text: 'Dies aber ist geschehen, damit erfüllt würde, was durch den Propheten[a] gesagt worden war:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von dem Propheten“. Wörtlicher steht hier „durch den Propheten“, wodurch seine Rolle als Vermittler der Botschaft hervorgehoben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: Dies
  rationale: Das substantivisch gebrauchte Neutrum Singular verweist auf das unmittelbar zuvor geschilderte Geschehen als Ganzes.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel stellt hier einen milden fortführenden beziehungsweise erläuternden Anschluss her; „aber“ bewahrt diesen Übergang, ohne einen starken Gegensatz zu erzeugen.
- source_word: γέγονεν
  choice: ist geschehen
  rationale: Das Perfekt von γίνομαι bezeichnet das eingetretene Geschehen mit fortbestehender Bedeutung; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: ἵνα πληρωθῇ
  choice: damit erfüllt würde
  rationale: Die Verbindung aus ἵνα und Aorist Passiv Konjunktiv wird als Ziel- beziehungsweise Erfüllungssatz wiedergegeben und bewahrt die passive Form.
- source_word: τὸ ῥηθὲν
  choice: was … gesagt worden war
  rationale: Das substantivierte passive Partizip bezeichnet das zuvor Gesagte. Das Plusquamperfekt macht im Deutschen das zeitliche Vorhergehen gegenüber dem erzählten Geschehen deutlich.
- source_word: διὰ τοῦ προφήτου
  choice: durch den Propheten
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise mittelbare Urheberschaft. „Durch“ erhält diese Nuance genauer als ein bloßes „von“.
- source_word: λέγοντος
  choice: ':'
  rationale: Das Partizip führt das unmittelbar folgende Zitat ein. Im natürlichen Deutschen übernimmt der Doppelpunkt diese Funktion, ohne die schwerfällige Wendung „der spricht“ zu erzwingen.
theological_decisions:
- issue: Erfüllungsformel und prophetische Vermittlung
  choice: „was durch den Propheten gesagt worden war“
  alternative: „was von dem Propheten gesagt worden war“
  rationale: Die gewählte Formulierung bewahrt die im griechischen διά mit Genitiv angelegte Vorstellung vermittelter Rede, ohne ausdrücklich einen nicht genannten göttlichen Sprecher hinzuzufügen.
- issue: Zweck oder Folge in ἵνα
  choice: „damit erfüllt würde“
  alternative: „sodass erfüllt wurde“
  rationale: „Damit“ erhält die zielgerichtete Aussage der Erfüllungsformel, lässt aber die enge Verbindung von Zweck und Ergebnis bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der griechischen Erfüllungsformel, bleibt aber durch die deutsche Tempusfolge und den zitateröffnenden Doppelpunkt gut verständlich.
