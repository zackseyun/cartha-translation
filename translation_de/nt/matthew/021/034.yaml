translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Früchte“ ist bewusst beibehalten, um die Wortwiederholung im griechischen Text sichtbar zu machen. „Diener“ ist gegenwärtiger als „Knechte“, während die Fußnote die historische Bedeutungsbreite wahrt.
