base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: de
  text: Als aber die Zeit der Fruchternte näher kam, schickte er seine Diener[a] zu den Pächtern[b], um seine Früchte zu holen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklaven“. Das griechische Wort kann sowohl Diener als auch Sklaven bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bauern“ oder „Weinbauern“. Das griechische Wort bezeichnet Menschen, die Land bewirtschaften; im Zusammenhang bearbeiten sie als Pächter den Weinberg eines anderen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als aber
  rationale: ὅτε leitet den zeitlichen Nebensatz ein; δέ markiert einen leichten Übergang beziehungsweise Gegensatz. „Als aber“ gibt beides im Deutschen natürlich wieder.
- source_word: ἤγγισεν
  choice: näher kam
  rationale: Das Verb bezeichnet das Herannahen. Die Formulierung wahrt das Bild eines bevorstehenden Zeitpunkts und klingt im erzählenden Zusammenhang natürlich.
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: die Zeit der Früchte
  rationale: καιρός meint hier die für die Früchte bestimmte beziehungsweise geeignete Zeit. Die relativ formnahe Wiedergabe erhält die Verbindung zu καρποί und vermeidet, den Ausdruck vorschnell ausschließlich als „Erntezeit“ auszulegen.
- source_word: ἀπέστειλεν
  choice: schickte er
  rationale: Eine schlichte, idiomatische Wiedergabe des gewöhnlichen Verbs für das Senden.
- source_word: τοὺς δούλους αὐτοῦ
  choice: seine Diener
  rationale: δοῦλοι kann Sklaven oder Diener bezeichnen. Hier steht ihre Funktion als Beauftragte des Besitzers im Vordergrund; die mögliche sozialrechtliche Bedeutung wird in einer Fußnote offengehalten.
- source_word: πρὸς τοὺς γεωργούς
  choice: zu den Pächtern
  rationale: γεωργοί sind Bearbeiter des Landes. Im Kontext bewirtschaften sie den Weinberg eines anderen; „Pächter“ macht dieses Verhältnis im Deutschen knapp und verständlich deutlich.
- source_word: λαβεῖν
  choice: in Empfang zu nehmen
  rationale: λαμβάνειν bedeutet grundsätzlich „nehmen“ oder „empfangen“. „In Empfang nehmen“ passt zu den ausgesandten Beauftragten, ohne ausdrücklich zu ergänzen, dass sie eine geschuldete Abgabe eintreiben.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: seine Früchte
  rationale: Die Wiedergabe bewahrt sowohl den Plural als auch das Possessivpronomen des griechischen Textes und hält die bewusste Wiederholung von καρποί fest.
