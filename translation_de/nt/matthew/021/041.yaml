source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: de
  text: 'Sie sagten zu ihm: „Diese Übeltäter wird er elend zugrunde richten[a] und den Weinberg an andere Pächter verpachten[b], die ihm die Früchte zu den vorgesehenen Zeiten abliefern werden[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Diese Bösen wird er auf schlimme Weise vernichten.“ Im Griechischen verstärken ein Adjektiv und ein stammverwandtes Adverb das Urteil durch ein Wortspiel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an andere Winzer verpachten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die ihm die Erträge zu den vorgesehenen Zeiten abliefern werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Sie antworteten ihm
  rationale: Das erzählende Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben. Im Zusammenhang reagieren die Angesprochenen auf Jesu Frage, daher trifft „antworteten“ die Gesprächsfunktion.
- source_word: Κακοὺς κακῶς ἀπολέσει αὐτούς
  choice: Er wird diesen Übeltätern ein schlimmes Ende bereiten
  rationale: Die Formulierung gibt sowohl die moralische Wertung von κακούς als auch die durch das stammverwandte κακῶς verstärkte Härte des Urteils wieder. „Ein schlimmes Ende bereiten“ ist idiomatisches, würdiges Deutsch und bewahrt den Gedanken des endgültigen Verderbens, ohne dessen konkrete Art festzulegen.
- source_word: τὸν ἀμπελῶνα ἐκδώσεται
  choice: den Weinberg … verpachten
  rationale: ἐκδίδωμι bezeichnet hier die entgeltliche Überlassung eines landwirtschaftlichen Betriebs. „Verpachten“ ist dafür im Deutschen der präzise und natürliche Ausdruck.
- source_word: ἄλλοις γεωργοῖς
  choice: an andere Winzer
  rationale: Im unmittelbaren Kontext eines Weinbergs sind die γεωργοί dessen Pächter und Bewirtschafter. „Winzer“ wahrt die landwirtschaftliche Bildwelt; das Pachtverhältnis wird bereits durch „verpachten“ deutlich.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: die ihm … abliefern werden
  rationale: ἀποδίδωμι bezeichnet hier die geschuldete Übergabe des Ertrags. „Abliefern“ macht diese Verpflichtung deutlich, ohne eine Geldzahlung zu unterstellen.
- source_word: τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν
  choice: die Früchte zu ihrer jeweiligen Zeit
  rationale: „Früchte“ bewahrt das konkrete Bild und dessen mögliche übertragene Resonanz. Die distributive Formulierung „zu ihrer jeweiligen Zeit“ gibt die mehreren καιροί und den Bezug von αὐτῶν wieder, ohne sie ausschließlich als Erntezeiten auszulegen.
theological_decisions:
- issue: Härte und Art des Gerichts über die bösen Weinbergpächter
  choice: Er wird diesen Übeltätern ein schlimmes Ende bereiten
  alternative: Er wird diese Bösen auf schlimme Weise vernichten
  rationale: Der griechische Text spricht von einem entschiedenen, vernichtenden Gericht und verstärkt es durch das Wortspiel κακούς κακῶς. Die gewählte Fassung wahrt die Härte, legt aber weder die konkrete Todesart noch eine weitergehende dogmatische Deutung fest.
- issue: Mögliche übertragene Bedeutung der „Früchte“
  choice: Früchte
  alternative: Erträge
  rationale: Die konkrete Bildsprache bleibt stehen und lässt zugleich ihre theologische Tragweite offen, statt sie durch eine rein wirtschaftliche oder ausdrücklich geistliche Deutung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Wendung „ein schlimmes Ende bereiten“ bildet die griechische Zuspitzung natürlich ab; die Fußnote dokumentiert die wörtlichere Struktur. Die landwirtschaftlichen Begriffe bleiben konkret, ohne die Bildrede konfessionell oder dogmatisch auszudeuten.
