source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: de
  text: 'Hört ein anderes Gleichnis: Ein Grundbesitzer pflanzte einen Weinberg, zog einen Zaun darum, grub darin eine Kelter und baute einen Turm.[a] Dann verpachtete er ihn an Bauern[b] und zog fort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild vom Pflanzen und Einfrieden eines Weinbergs, vom Graben einer Kelter und vom Bau eines Turms erinnert an Jesaja 5,1–2.
    reason: cross_reference
  - marker: b
    text: 'Oder: „an Pächter“. Gemeint sind Bauern, die den Weinberg pachteten und bewirtschafteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Hört ein anderes Gleichnis
  rationale: Der Aoristimperativ ἀκούσατε wird als unmittelbare Aufforderung wiedergegeben; „Gleichnis“ ist im Kontext der Lehre Jesu die übliche und präzise Entsprechung für παραβολή.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Es war einmal ein Grundbesitzer
  rationale: οἰκοδεσπότης bezeichnet den Herrn bzw. Eigentümer eines Hauses oder Anwesens; im landwirtschaftlichen Zusammenhang trifft „Grundbesitzer“ seine Rolle natürlich. „Es war einmal“ gibt die erzählerische Einführung idiomatisch wieder, ohne das Gleichnis als historischen Bericht festzulegen.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: pflanzte einen Weinberg
  rationale: Die konkrete landwirtschaftliche Bildsprache und der Anklang an Jesaja 5 bleiben erhalten.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: zog einen Zaun darum
  rationale: φραγμός kann einen Zaun, eine Hecke oder eine andere Einfriedung bezeichnen. „Zaun“ ist eine verständliche, nicht unnötig spezifizierende Wiedergabe.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: grub darin eine Kelter
  rationale: ληνός bezeichnet eine Weinpresse bzw. Kelter; „Kelter“ bewahrt das konkrete historische Bild, während ὀρύσσω mit „grub“ direkt wiedergegeben wird.
- source_word: ᾠκοδόμησεν πύργον
  choice: baute einen Turm
  rationale: πύργος bedeutet „Turm“. Die mögliche Funktion als Wachturm wird nicht in den Haupttext aufgenommen, da sie im Griechischen nicht ausdrücklich genannt ist.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: verpachtete er ihn an Weinbauern
  rationale: Die mediale Form von ἐκδίδωμι bezeichnet hier das Verpachten. γεωργοί sind in diesem Zusammenhang die Pächter und Bewirtschafter des Weinbergs; „Weinbauern“ drückt den konkreten Tätigkeitsbereich aus, während das Pachtverhältnis bereits im Verb steht.
- source_word: ἀπεδήμησεν
  choice: ging außer Landes
  rationale: ἀποδημέω bezeichnet das Fortgehen aus der Heimat bzw. eine Reise in die Ferne. „Ging außer Landes“ bewahrt diesen Aspekt deutlicher als das allgemeinere „ging weg“, ohne ein bestimmtes Ziel hinzuzufügen.
theological_decisions:
- issue: Anklang an das Weinberglied in Jesaja 5,1–2
  choice: Die konkrete Weinbergbildsprache bleibt im Haupttext erhalten; der intertextuelle Bezug wird in einer Fußnote genannt.
  alternative: Durch traditionellere oder erklärende Formulierungen den Bezug zu Jesaja im Haupttext stärker hervorheben.
  rationale: Die deutliche Anspielung soll erkennbar bleiben, doch ihre Auslegung darf nicht in den Bibeltext selbst eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Gleichniserzählung. „Kelter“ ist ein etablierter biblisch-landwirtschaftlicher Begriff; der Zusammenhang macht seine Bedeutung hinreichend deutlich. Die Satzfolge bleibt nahe an der griechischen Vorlage, ohne im Deutschen schwerfällig zu wirken.
