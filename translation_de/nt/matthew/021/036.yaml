  variant: modern standard German
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: de
  text: Wieder schickte er andere Diener[a], mehr als die ersten, und sie behandelten sie genauso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklaven“. Das griechische Wort doulos kann je nach Zusammenhang sowohl „Diener“ als auch „Sklave“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Wieder
  rationale: Kennzeichnet knapp und natürlich die Wiederholung der Handlung.
- source_word: ἀπέστειλεν
  choice: schickte er
  rationale: Schlichte narrative Wiedergabe des Aorists von ἀποστέλλω; „sandte er aus“ wäre möglich, ist hier aber nicht nötig.
- source_word: ἄλλους δούλους
  choice: andere Diener
  rationale: δοῦλος kann je nach Zusammenhang „Diener“ oder „Sklave“ bezeichnen. Im Gleichnis steht hier vor allem ihre Rolle als ausgesandte Beauftragte im Vordergrund; die Alternative wird in der Fußnote genannt.
- source_word: πλείονας τῶν πρώτων
  choice: mehr als die ersten
  rationale: Die Vergleichskonstruktion besagt, dass die zweite Gruppe zahlenmäßig größer war als die erste. Die knappe deutsche Form bewahrt diesen Bezug.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: sie behandelten sie genauso
  rationale: Die idiomatische deutsche Form gibt wieder, dass mit den später Gesandten ebenso verfahren wurde wie mit den ersten, ohne die im vorigen Vers genannten Misshandlungen nochmals auszuschreiben.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gleichnis
  choice: Diener
  alternative: Sklaven
  rationale: Der Zusammenhang betont die Funktion der Männer als ausgesandte Beauftragte. „Diener“ ist daher im modernen Deutschen angemessen; „Sklaven“ bleibt als lexikalisch mögliche und stärker statusbezogene Wiedergabe in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Pronomenfolge des griechischen Textes bleibt erhalten; „behandelten“ macht die idiomatische Bedeutung von ποιέω mit Dativ im Deutschen klar.
