id: MAT.21.29
reference: Matthew 21:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: de
  text: 'Er aber antwortete: »Ich will nicht.« Doch später änderte er seine Meinung[a] und ging.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bereute es« oder »besann sich anders«. Das griechische Wort kann Bedauern einschließen, das zu einer Änderung des Handelns führt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: antwortete
  rationale: Die geläufige narrative Partizipialformel wird im Deutschen natürlich als finites Verb wiedergegeben.
- source_word: Οὐ θέλω
  choice: Ich will nicht
  rationale: Die knappe direkte Weigerung gibt den volitionalen Sinn von θέλω idiomatisch und würdig wieder; der Zusammenhang ergänzt, was der Sohn nicht tun will.
- source_word: ὕστερον
  choice: später
  rationale: Das Adverb bezeichnet schlicht den späteren Zeitpunkt der gegenteiligen Handlung.
- source_word: μεταμεληθεὶς
  choice: änderte er seine Meinung
  rationale: Die Form bezeichnet hier eine innere Umkehr, möglicherweise mit Bedauern, die zu einem anderen Handeln führt. Die Wiedergabe wahrt diese Breite, ohne ausdrücklich den stärker theologisch geprägten Begriff »bereuen« festzulegen.
- source_word: ἀπῆλθεν
  choice: ging
  rationale: Im Kontext bedeutet das Verb, dass der Sohn dem Auftrag schließlich nachkam; »ging« ist knapp und natürlich.
theological_decisions:
- issue: Bedeutungsumfang von μεταμεληθεὶς im Gleichnis
  choice: änderte er seine Meinung
  alternative: bereute es / besann sich anders
  rationale: Der Text schildert die Abkehr von der Weigerung und das anschließende Handeln. »Änderte seine Meinung« lässt ein mögliches Bedauern offen und vermeidet, dem Verb ohne Not einen fest umrissenen theologischen Bußbegriff aufzuerlegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Erzählweise. Die direkte Rede bleibt bewusst kurz und bestimmt.
