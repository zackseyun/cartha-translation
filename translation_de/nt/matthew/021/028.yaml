id: MAT.21.28
reference: Matthew 21:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: de
  text: 'Was meint ihr dazu? Ein Mann hatte zwei Kinder.[a] Er ging zum ersten und sagte: »Kind, geh heute im Weinberg arbeiten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zwei Söhne«. Im Griechischen steht hier jedoch das allgemeinere Wort für »Kinder« (τέκνα).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Was meint ihr aber?
  rationale: Die idiomatische Frage fordert das Urteil der Angesprochenen heraus; »aber« gibt die leicht weiterführende beziehungsweise kontrastierende Kraft von δέ wieder.
- source_word: ἄνθρωπος
  choice: Ein Mann
  rationale: Im erzählerischen Zusammenhang bezeichnet das Wort einen männlichen Hausherrn beziehungsweise Vater; »ein Mann« ist daher natürlich und sachgerecht.
- source_word: τέκνα δύο
  choice: zwei Kinder
  rationale: τέκνα ist der allgemeine Ausdruck für Kinder und nicht das spezifischere Wort für Söhne. Die Übersetzung bewahrt diese lexikalische Breite.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Er ging zu dem ersten
  rationale: Das Partizip bezeichnet die dem Sprechen vorausgehende Annäherung. Ein selbstständiger deutscher Satz gibt die Abfolge natürlich wieder.
- source_word: Τέκνον
  choice: Kind
  rationale: Die Anrede τέκνον ist gegenüber »Sohn« lexikalisch weiter. »Kind« erhält die familiäre Anrede, ohne das Geschlecht enger festzulegen.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: geh heute … arbeiten
  rationale: Die beiden Imperativformen werden in natürlichem modernem Deutsch als Aufforderung mit »geh … arbeiten« wiedergegeben; »heute« behält seine zeitliche Hervorhebung.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: im Weinberg
  rationale: Die Wendung bezeichnet den Ort der Arbeit und bewahrt das für das Gleichnis zentrale landwirtschaftliche Bild.
theological_decisions:
- issue: Ob τέκνα und τέκνον entsprechend verbreiteter Übersetzungstradition als »Söhne« und »Sohn« wiederzugeben sind
  choice: Kinder / Kind
  alternative: Söhne / Sohn
  rationale: Der griechische Text verwendet hier die allgemeineren Wörter τέκνα und τέκνον, nicht υἱοί und υἱέ. Die Übersetzung engt die Aussage deshalb nicht vorzeitig auf männliche Kinder ein.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist flüssig formuliert, während die allgemeineren Verwandtschaftsbezeichnungen des griechischen Textes bewusst erhalten bleiben.
