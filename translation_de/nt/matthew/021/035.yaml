  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: de
  text: 'Und die Pächter packten seine Sklaven[a]: Den einen schlugen sie, den anderen töteten sie, und einen weiteren steinigten sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener. Das griechische Wort douloi kann je nach Zusammenhang „Sklaven“ oder „Diener“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: Weinbauern
  rationale: Im Kontext des Gleichnisses sind es Pächter, die einen Weinberg bewirtschaften. „Weinbauern“ bezeichnet ihre konkrete Tätigkeit natürlich und prägnant; das Pachtverhältnis ergibt sich bereits aus dem Kontext.
- source_word: λαβόντες
  choice: packten
  rationale: Das Aoristpartizip bezeichnet die der Misshandlung vorausgehende Handlung. „Packten“ gibt das gewaltsame Ergreifen im Deutschen idiomatischer wieder als das neutralere „nahmen“.
- source_word: δούλους
  choice: Sklaven
  rationale: δοῦλοι bezeichnet hier die dem Grundbesitzer gehörenden beziehungsweise rechtlich untergeordneten Beauftragten. „Sklaven“ bewahrt diesen Status deutlicher als das weiter gefasste „Diener“, ohne ihn zu beschönigen.
- source_word: ἔδειραν
  choice: schlugen
  rationale: Das Verb bedeutet hier, jemanden zu schlagen oder zu verprügeln. „Schlugen“ ist klar und legt kein bestimmtes Instrument oder eine formelle Auspeitschung fest.
- source_word: ἀπέκτειναν
  choice: töteten
  rationale: Die direkte Bedeutung ist „töten“. „Ermordeten“ würde eine zusätzliche rechtlich-moralische Qualifizierung eintragen.
- source_word: ἐλιθοβόλησαν
  choice: steinigten
  rationale: Das Verb bezeichnet ausdrücklich einen Angriff beziehungsweise eine Tötung mit Steinen; „steinigten“ ist die knappe und etablierte deutsche Entsprechung.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: den einen ... den anderen ... einen weiteren
  rationale: Diese Formulierung bildet die distributive Reihe ab und macht deutlich, dass verschiedene Sklaven unterschiedlich behandelt wurden.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gleichnis
  choice: Sklaven
  alternative: Diener
  rationale: Der soziale Status der ausgesandten Personen als dem Besitzer untergeordnete Angehörige seines Hauses ist hier relevant. „Diener“ wäre natürlicher, könnte den im griechischen Ausdruck möglichen beziehungsweise naheliegenden Unfreiheitsstatus jedoch verdecken; die Fußnote nennt die Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am griechischen Original; „packten“ vermittelt die gewaltsame Situation idiomatisch. Der Fußnotenmarker steht nach dem ganzen Vers, weil die Anmerkung den Ausdruck „Sklaven“ erläutert.
