base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: de
  text: 'und sagte zu ihnen: „Geht in das Dorf, das euch gegenüberliegt. Dort werdet ihr sofort eine angebundene Eselin und bei ihr ein Fohlen[a] finden. Bindet sie los und bringt sie zu mir.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet ein Jungtier; im Zusammenhang mit der Eselin ist ein Eselsfohlen gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: und sagte zu ihnen
  rationale: Das griechische Partizip führt Jesu Rede ein. Im Deutschen gibt ein finites Verb mit „und“ den fortlaufenden Erzählzusammenhang natürlich wieder.
- source_word: Πορεύεσθε
  choice: Geht
  rationale: Der Imperativ bezeichnet hier den schlichten Auftrag, sich an einen bestimmten Ort zu begeben.
- source_word: κώμην
  choice: Dorf
  rationale: κώμη bezeichnet gewöhnlich eine kleinere Ortschaft und wird präzise und allgemeinverständlich mit „Dorf“ wiedergegeben.
- source_word: κατέναντι ὑμῶν
  choice: das euch gegenüberliegt
  rationale: Die Formulierung bewahrt die räumliche Bedeutung von κατέναντι und klingt im modernen Deutschen natürlicher als „euch gegenüber“ ohne Verb.
- source_word: εὐθέως
  choice: sofort
  rationale: „Sofort“ gibt die unmittelbare zeitliche Bedeutung knapp und idiomatisch wieder.
- source_word: ὄνον δεδεμένην
  choice: eine angebundene Eselin
  rationale: Das feminine Partizip zeigt, dass ὄνος hier weiblich verstanden wird. „Eselin“ macht zudem den Bezug des folgenden femininen Pronomens eindeutig.
- source_word: πῶλον
  choice: ein Fohlen
  rationale: πῶλος bezeichnet ein Jungtier. Durch die Verbindung mit der Eselin ist klar, dass ein Eselsfohlen gemeint ist; eine Fußnote sichert diese kontextuelle Präzisierung.
- source_word: μετ’ αὐτῆς
  choice: bei ihr
  rationale: μετά mit Genitiv bezeichnet die Begleitung beziehungsweise räumliche Nähe; „bei ihr“ ist hier natürlich und bewahrt den Bezug auf die Eselin.
- source_word: λύσαντες ἀγάγετέ μοι
  choice: Bindet sie los und bringt sie zu mir
  rationale: Das vorangestellte Aoristpartizip bezeichnet eine Handlung, die dem Imperativ vorausgeht. Zwei koordinierte Aufforderungen geben diese Abfolge im Deutschen idiomatisch wieder. Das pluralische „sie“ bezieht beide Tiere ein.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. „Eselin“ bildet das feminine Geschlecht des griechischen Ausdrucks ab und macht den Bezug von αὐτῆς transparent. Die griechische Partizipialkonstruktion am Versanfang und bei λύσαντες wird zugunsten natürlichen deutschen Satzbaus finit beziehungsweise koordinierend wiedergegeben.
