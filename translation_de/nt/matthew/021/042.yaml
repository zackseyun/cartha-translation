id: MAT.21.42
reference: Matthew 21:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: de
  text: 'Jesus sagt zu ihnen: »Habt ihr nie in den Schriften gelesen: ›Der Stein, den die Bauleute verworfen haben, der ist zum Eckstein[a] geworden. Vom Herrn[b] ist dies geschehen, und es ist wunderbar in unseren Augen‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Schlussstein; wörtlich: Haupt der Ecke.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: vom Herrn; die hebräische Vorlage des Zitats hat vom HERRN (JHWH).'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: sagt
  rationale: Das historische Präsens des griechischen Erzählstils lässt sich im Deutschen natürlich und unmittelbar mit »sagt« wiedergeben.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Habt ihr nie … gelesen
  rationale: Das deutsche Perfekt gibt die rhetorische Frage idiomatisch wieder; »nie« bewahrt ihre nachdrückliche Wirkung.
- source_word: ἐν ταῖς γραφαῖς
  choice: in den Schriften
  rationale: Gemeint sind die als heilig anerkannten Schriften Israels; »die Schriften« ist präzise und vermeidet eine unnötige interpretierende Erweiterung.
- source_word: Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες
  choice: Der Stein, den die Bauleute verworfen haben
  rationale: »Verworfen« bewahrt den Sinn einer Ablehnung als ungeeignet; das substantivierte Partizip wird idiomatisch mit »die Bauleute« wiedergegeben.
- source_word: οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
  choice: der ist zum Eckstein geworden
  rationale: Das demonstrative οὗτος erhält durch »der« einen natürlichen deutschen Nachdruck. »Eckstein« ist die geläufigste sachgerechte Wiedergabe der bildhaften Wendung; die mögliche Alternative wird in einer Fußnote genannt.
- source_word: παρὰ κυρίου ἐγένετο αὕτη
  choice: Vom Herrn ist dies geschehen
  rationale: παρά mit Genitiv bezeichnet hier Ursprung beziehungsweise Urheberschaft. Die Wortstellung bewahrt den hervorgehobenen göttlichen Ursprung.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: wunderbar in unseren Augen
  rationale: Die bildhafte Ausdrucksweise und der erhabene Ton des Psalmzitats bleiben erhalten, ohne den Sinn erklärend auszuweiten.
theological_decisions:
- issue: Wiedergabe von κύριος im Psalmzitat
  choice: Herr
  alternative: HERR
  rationale: Der griechische Text hat κυρίου, daher steht im Haupttext »Herr«. Da die hebräische Vorlage des Zitats den Gottesnamen JHWH enthält, wird »HERR« als quellenbezogene Information in der Fußnote ausgewiesen.
- issue: Messianische Deutung des Steinbildes
  choice: Das Bild ohne ausdrückliche Identifizierung beibehalten
  alternative: Den Stein im Haupttext ausdrücklich als Messias beziehungsweise als Jesus bezeichnen
  rationale: Der Kontext legt Jesu Anwendung des Zitats nahe, doch der Wortlaut des Verses enthält diese ausdrückliche Identifizierung nicht. Die Übersetzung bewahrt daher die metaphorische und theologische Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Psalmzitat bleibt als Zitat erkennbar; die Syntax ist gut verständlich, bewahrt aber den feierlichen Charakter und die markante Bildsprache der Vorlage.
