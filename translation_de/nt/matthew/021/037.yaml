id: MAT.21.37
reference: Matthew 21:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: de
  text: 'Doch später schickte er seinen Sohn zu ihnen und sagte: »Sie werden meinen Sohn achten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: später
  rationale: Das temporale Adverb bezeichnet eine spätere Handlung. »Später« ist natürliches modernes Deutsch und vermeidet die stärkere, im Wort nicht zwingend enthaltene Aussage »zuletzt«.
- source_word: δὲ
  choice: doch
  rationale: 'δέ kennzeichnet hier eine leichte Gegenüberstellung beziehungsweise narrative Wendung: Nach den Knechten sendet der Besitzer nun seinen Sohn.'
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Das einfache und idiomatische »schickte« gibt die Aoristhandlung wieder, ohne einen fachsprachlich-apostolischen Beiklang einzutragen.
- source_word: πρὸς αὐτοὺς
  choice: zu ihnen
  rationale: πρός mit Akkusativ bezeichnet bei einem Verb des Sendens die Richtung auf Personen hin.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: Die possessive Wiedergabe ist im Deutschen natürlich und erhält die besondere familiäre Beziehung, ohne durch »seinen eigenen Sohn« zusätzliche Betonung einzutragen.
- source_word: λέγων
  choice: und sagte
  rationale: Das begleitende Partizip wird in natürlichem deutschem Erzählstil als koordinierter finiter Satz wiedergegeben.
- source_word: Ἐντραπήσονται
  choice: werden sie Achtung haben
  rationale: Mit dem direkten Objekt bezeichnet ἐντρέπομαι hier, jemandem Achtung oder respektvolle Rücksicht entgegenzubringen. Die Formulierung bewahrt den gehobenen sozialen Sinn besser als das möglicherweise zu schwache »respektieren« und vermeidet den religiös stärkeren Klang von »verehren«.
- source_word: τὸν υἱόν μου
  choice: vor meinem Sohn
  rationale: Die deutsche Wendung »vor jemandem Achtung haben« erfordert »vor« und gibt den persönlichen Bezug von μου klar und idiomatisch wieder.
theological_decisions:
- issue: Den Sohn im Gleichnis wiedergeben, ohne den christologischen Bezug übersetzend vorwegzunehmen
  choice: seinen Sohn / meinem Sohn
  alternative: seinen geliebten Sohn / den Sohn
  rationale: Der Zusammenhang weist auf Jesus, doch im Vers steht das gewöhnliche υἱός ohne ἀγαπητός und ohne eine sprachlich erzwungene Titulierung. Die Übersetzung lässt die christologische Bedeutung aus dem Kontext hervorgehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt. Keine Fußnote ist nötig, da »Achtung haben« den kontextuellen Sinn von ἐντρέπομαι präzise und natürlich wiedergibt.
