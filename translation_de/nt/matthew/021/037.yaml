  source_fidelity: Die Satzglieder und die zeitliche/narrative Entwicklung werden zutreffend wiedergegeben. Für ἐντραπήσονται ist im Kontext mit direktem Objekt eindeutig der Sinn „Respekt/Achtung erweisen“ gemeint; die revidierte Formulierung bildet dies direkter ab.
  naturalness: „Vor meinem Sohn werden sie Achtung haben“ ist verständlich, wirkt im modernen Standarddeutsch jedoch unnötig umständlich und leicht markiert. „Sie werden meinen Sohn achten“ ist idiomatischer und bewahrt den würdigen Erzählton.
  terminology: „Sohn“ bleibt sachgerecht unmarkiert und greift weder durch „geliebt“ noch durch eine Titelschreibung in die Deutung des Gleichnisses ein. „Achten“ gibt den sozialen Respekt wieder, ohne den religiös stärkeren Sinn von „verehren“ einzutragen.
