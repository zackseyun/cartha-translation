- from: 'Da antworteten sie Jesus: „Wir wissen es nicht.“ Darauf sagte auch er zu ihnen: „Dann sage auch ich euch nicht, in welcher Vollmacht ich diese Dinge tue.“'
  to: 'Sie antworteten Jesus: „Wir wissen es nicht.“ Er sagte ihnen: „Auch ich sage euch nicht, in welcher Vollmacht ich diese Dinge tue.“'
  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext vorhandene Folgerungsnuance von „Dann“. „Auch ich“ bewahrt den Nachdruck von καὶ αὐτός und Οὐδὲ ἐγώ, während „Vollmacht“ und der Plural „diese Dinge“ erhalten bleiben.
