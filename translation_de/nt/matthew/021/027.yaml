id: MAT.21.27
reference: Matthew 21:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: de
  text: 'Sie antworteten Jesus: „Wir wissen es nicht.“ Er sagte ihnen: „Auch ich sage euch nicht, in welcher Vollmacht ich diese Dinge tue.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: Da antworteten sie
  rationale: Das adverbiale Partizip führt ihre unmittelbare Antwort ein; die finite deutsche Form ist natürlich und bewahrt den Zusammenhang.
- source_word: Οὐκ οἴδαμεν
  choice: Wir wissen es nicht
  rationale: Das ergänzte „es“ entspricht natürlichem modernem Deutsch und verweist auf die zuvor gestellte Frage, ohne ihren Inhalt näher auszulegen.
- source_word: ἔφη
  choice: sagte
  rationale: Eine schlichte, nicht interpretierende Wiedergabe des Redeverbs.
- source_word: καὶ αὐτός
  choice: auch er
  rationale: 'Bewahrt die reziproke Betonung: Wie sie keine Auskunft geben, gibt Jesus ihnen ebenfalls keine.'
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Dann sage auch ich euch nicht
  rationale: Gibt die responsive Verneinung idiomatisch wieder. Das Präsens von λέγω bleibt als „sage“ erhalten; „Dann“ macht den aus dem Zusammenhang hervorgehenden Gegenzug deutlich.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: in welcher Vollmacht
  rationale: „Vollmacht“ bezeichnet hier die legitime Befugnis beziehungsweise Autorisierung hinter Jesu Handeln und entspricht dem kontroverstheologischen Kontext.
- source_word: ταῦτα
  choice: diese Dinge
  rationale: Bewahrt den Plural des Demonstrativpronomens und lässt den Umfang der gemeinten Handlungen offen.
- source_word: ποιῶ
  choice: ich … tue
  rationale: Der einfache Präsens entspricht dem griechischen Präsens und bezeichnet Jesu gegenwärtiges beziehungsweise charakteristisches Handeln.
theological_decisions:
- issue: Bedeutung von ἐξουσία in Jesu Antwort
  choice: Vollmacht
  alternative: Autorität; Recht; Macht
  rationale: Im Streitgespräch geht es nicht bloß um Fähigkeit oder Kraft, sondern um die legitime Befugnis und deren Ursprung. „Vollmacht“ bewahrt diese rechtliche und theologische Dimension, ohne ihren Ursprung vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist für mündlichen Dialog geglättet, während der reziproke Nachdruck von καὶ αὐτός / Οὐδὲ ἐγώ und der Plural ταῦτα erhalten bleiben.
