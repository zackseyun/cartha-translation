id: MAT.21.26
reference: Matthew 21:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: de
  text: 'Wenn wir aber sagen: »Von Menschen[a]«, fürchten wir die Menge; denn alle halten Johannes für einen Propheten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »menschlichen Ursprungs«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Wenn wir aber sagen
  rationale: ἐάν mit dem Aorist Konjunktiv εἴπωμεν bezeichnet eine erwogene Bedingung. Die gewählte Form ist im modernen Deutsch natürlich und bewahrt den abwägenden Charakter.
- source_word: Ἐξ ἀνθρώπων
  choice: Von Menschen
  rationale: Die knappe Wendung bezeichnet die menschliche Herkunft beziehungsweise Autorisierung und steht im unmittelbaren Gegensatz zu »vom Himmel«. »Menschen« ist dabei allgemein, nicht ausschließlich männlich, zu verstehen.
- source_word: φοβούμεθα
  choice: fürchten wir
  rationale: Die Form hat hier aktive Bedeutung. Die direkte Wiedergabe erhält die Unmittelbarkeit ihrer Furcht vor der Reaktion der Menge.
- source_word: τὸν ὄχλον
  choice: die Menge
  rationale: ὄχλος bezeichnet die versammelte Menschenmenge. »Die Menge« ist präzise, verständlich und passt zum erzählerischen Zusammenhang.
- source_word: πάντες
  choice: alle
  rationale: Das Wort bezieht sich auf die Menschen in der Menge und betont die allgemeine Einschätzung Johannes’.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: halten Johannes für einen Propheten
  rationale: Die Konstruktion ἔχω mit Objekt und ὡς samt Prädikatsbezeichnung drückt aus, als was jemand angesehen wird. »Für einen Propheten halten« ist die entsprechende natürliche deutsche Wendung.
- source_word: προφήτην
  choice: einen Propheten
  rationale: 'Das artikellose Prädikatsnomen wird hier im Deutschen idiomatisch unbestimmt wiedergegeben: Johannes gilt als einer, der prophetisch im Auftrag Gottes spricht.'
- source_word: Ἰωάννην
  choice: Johannes
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition als »Johannes« wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἀνθρώπων im Gegensatz zwischen himmlischer und menschlicher Herkunft
  choice: Von Menschen
  alternative: menschlichen Ursprungs
  rationale: Die Übersetzung bewahrt den knappen Quellengegensatz zum »Himmel« aus dem vorhergehenden Vers. Die Fußnote erläutert, dass es um menschliche Herkunft beziehungsweise Autorität geht, ohne den Text interpretierend auszuweiten.
- issue: Aussage über die Einschätzung Johannes’ durch die Menge
  choice: alle halten Johannes für einen Propheten
  alternative: alle sehen Johannes als Propheten an
  rationale: Die Formulierung gibt die im Erzähltext berichtete allgemeine Überzeugung wieder, ohne sie über die Aussage des Verses hinaus theologisch zu bewerten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und bildet den Gegensatz zum vorausgehenden »vom Himmel« ab; der Semikolon gliedert Begründung und Folge klar.
