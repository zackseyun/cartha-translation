base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: de
  text: 'Dann wandte er sich an den zweiten und sagte dasselbe. Der antwortete: »Ich will gehen, Herr[a]«, ging aber nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich, Herr«. Die griechische Antwort ist elliptisch; gemeint ist: »Ich will [gehen].« »Herr« ist hier eine respektvolle Anrede an den menschlichen Vater; auch »mein Herr« ist als Wiedergabe möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Dann ging er
  rationale: Das Aoristpartizip mit δέ führt den nächsten Schritt der Erzählung ein. „Dann ging er“ gibt sowohl die Hinwendung zum zweiten Sohn als auch den lockeren erzählerischen Anschluss natürlich wieder.
- source_word: τῷ δευτέρῳ
  choice: zum zweiten
  rationale: „Zum zweiten“ bewahrt die knappe Form des Griechischen; dass der zweite Sohn gemeint ist, ergibt sich eindeutig aus dem unmittelbaren Zusammenhang.
- source_word: ὡσαύτως
  choice: sagte dasselbe
  rationale: Das Wort verweist darauf, dass der Vater dem zweiten Sohn denselben Auftrag erteilte. Die deutsche Wendung ist knapp und idiomatisch.
- source_word: ἀποκριθεὶς εἶπεν
  choice: antwortete
  rationale: Die griechische Verbindung „antwortend sagte er“ wird im heutigen Deutsch ohne Bedeutungsverlust idiomatisch mit „antwortete“ wiedergegeben.
- source_word: Ἐγώ
  choice: Ich gehe
  rationale: Wörtlich steht nur das betonte Pronomen „Ich“. Es ist eine elliptische Zusage als Antwort auf den zuvor erteilten Auftrag; „Ich gehe“ ergänzt den im Zusammenhang vorausgesetzten Sinn, ohne die Zusage unnötig auszubauen.
- source_word: κύριε
  choice: Herr
  rationale: Der Vokativ ist eine respektvolle Anrede. „Herr“ bewahrt die lexikalische und mögliche soziale Spannung des griechischen Ausdrucks, obwohl die Anrede eines Vaters im heutigen Deutsch ungewohnt klingt.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: ging aber nicht
  rationale: Das griechische καί verbindet hier Zusage und gegenteiliges Handeln. Das deutsche „aber“ macht den im Zusammenhang deutlich beabsichtigten Gegensatz idiomatisch sichtbar.
theological_decisions:
- issue: Anrede κύριε an den menschlichen Vater
  choice: Herr
  alternative: Vater; mein Herr
  rationale: Der Kontext bezeichnet einen menschlichen Vater, sodass kein göttlicher oder christologischer Titel gemeint sein muss. Dennoch wird die Grundbedeutung der respektvollen Anrede mit „Herr“ bewahrt; die Fußnote verhindert, dass daraus eine theologische Anrede herausgelesen wird.
- issue: Elliptische Zusage Ἐγώ
  choice: Ich gehe
  alternative: Ich; Ja
  rationale: Die Ergänzung des im Auftrag vorausgesetzten Verbs macht die Antwort im Deutschen verständlich. Die Fußnote legt die wörtliche Kürze offen und bewahrt damit die Eigenart und Betonung des griechischen Ausdrucks.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die knappe Syntax des Ausgangstextes bleibt erhalten. „Herr“ wirkt in einer heutigen familiären Anrede bewusst ungewohnt, bewahrt aber die respektvolle Anrede des Griechischen; die Fußnote erläutert den nichttheologischen Gebrauch.
