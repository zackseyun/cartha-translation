id: MAT.21.9
reference: Matthew 21:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: de
  text: 'Die Menschenmengen, die vor ihm hergingen, und die, die ihm folgten, riefen immer wieder: »Hosianna[a] dem Sohn Davids[b]! Gesegnet ist, der im Namen des Herrn[c] kommt! Hosianna in den höchsten Höhen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Hosianna« geht auf einen hebräischen Hilferuf zurück und bedeutet etwa »Hilf doch!« oder »Rette jetzt!«; hier dient das Wort zugleich als Jubel- und Lobpreisruf.
    reason: lexical_alternative
  - marker: b
    text: »Sohn Davids« ist ein königlicher Titel mit messianischer Bedeutung.
    reason: cultural_note
  - marker: c
    text: Die Worte greifen Psalm 118,26 auf. Wo hier »Herr« steht, hat der hebräische Psalm den Gottesnamen JHWH.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Die Wiedergabe bezeichnet größere Gruppen von Menschen und bewahrt den Plural des griechischen Textes.
- source_word: οἱ προάγοντες αὐτὸν
  choice: die vor ihm hergingen
  rationale: Die Formulierung beschreibt die Menschen, die sich im Zug vor Jesus bewegten, ohne ihnen eine förmliche Führungsrolle zuzuschreiben.
- source_word: οἱ ἀκολουθοῦντες
  choice: die, die ihm folgten
  rationale: Die direkte Wiedergabe bildet zusammen mit »vor ihm hergingen« die Prozessionsszene klar ab.
- source_word: ἔκραζον λέγοντες
  choice: riefen immer wieder
  rationale: Das Imperfekt bezeichnet einen anhaltenden beziehungsweise wiederholten Ruf. Das deutsche Redeeinleitungszeichen macht eine zusätzliche Wiedergabe von λέγοντες als »und sagten« unnötig und vermeidet Schwerfälligkeit.
- source_word: Ὡσαννά
  choice: Hosianna
  rationale: Die im Deutschen eingebürgerte Form bewahrt den liturgischen Ruf; seine hebräische Grundbedeutung wird in einer Fußnote erläutert.
- source_word: τῷ υἱῷ Δαυίδ
  choice: dem Sohn Davids
  rationale: Der Dativ wird unmittelbar bewahrt; der davidische Titel bleibt unverändert stehen und wird nicht durch eine Deutung wie »Messias« ersetzt.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Gesegnet ist, der … kommt
  rationale: Die Formulierung bewahrt den substantivierten Singular und den feierlichen Charakter des Psalmzitats in verständlichem Deutsch.
- source_word: ἐν ὀνόματι κυρίου
  choice: im Namen des Herrn
  rationale: Die feste Wendung wahrt sowohl den griechischen Wortlaut als auch die Bedeutung göttlicher Beauftragung und den Anklang an Psalm 118.
- source_word: ἐν τοῖς ὑψίστοις
  choice: in den höchsten Höhen
  rationale: Die Wiedergabe lässt den Bezug auf den höchsten himmlischen Bereich erkennen, ohne ihn durch eine Ergänzung wie »Himmel« vollständig festzulegen.
theological_decisions:
- issue: Der königlich-messianische Titel τῷ υἱῷ Δαυίδ
  choice: »dem Sohn Davids« als Titel beibehalten
  alternative: »dem Messias«
  rationale: Der Ausdruck trägt messianische Bedeutung, doch der griechische Text nennt ausdrücklich den Sohn Davids. Die Übersetzung bewahrt diese geschichtliche und theologische Bildwelt.
- issue: Bedeutung und Funktion von Ὡσαννά
  choice: »Hosianna« im Haupttext, Erklärung der Grundbedeutung in einer Fußnote
  alternative: »Hilf doch!« oder »Rette jetzt!«
  rationale: Der ursprünglich bittende Ausdruck ist hier zugleich ein liturgischer Jubelruf. Die eingebürgerte Form erhält beide Resonanzen, ohne eine davon im Haupttext einseitig festzulegen.
- issue: Bezug von κυρίου im Psalmzitat
  choice: »des Herrn« entsprechend dem griechischen κύριος
  alternative: »JHWHs« beziehungsweise »des HERRN«
  rationale: Der neutestamentliche griechische Text hat κύριος. Eine Fußnote weist darauf hin, dass im hebräischen Hintergrund von Psalm 118 der Gottesname JHWH steht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-feierlichem Ton. Die wiederholte Handlung des Imperfekts wird natürlich durch »immer wieder« ausgedrückt. »Hosianna« und die Psalmformulierung behalten ihren liturgischen Klang, während die Fußnoten die sprachlichen und alttestamentlichen Hintergründe knapp erschließen.
