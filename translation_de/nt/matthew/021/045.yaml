id: MAT.21.45
reference: Matthew 21:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: de
  text: Als die führenden Priester und die Pharisäer seine Gleichnisse hörten, erkannten sie, dass er von ihnen sprach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „über sie“. Sie erkannten, dass die Gleichnisse auf sie bezogen waren. Manche Übersetzungen geben dies deutender mit „gegen sie“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: als … hörten
  rationale: Das vorzeitige Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben und wahrt den zeitlichen Zusammenhang mit dem Erkennen.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural bezeichnet hier die ranghohe priesterliche Führung. „Führende Priester“ vermeidet den möglichen Eindruck, mehrere Personen hätten gleichzeitig das Amt des einen Hohenpriesters inne.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Die im Deutschen eingebürgerte Bezeichnung für diese jüdische Gruppe.
- source_word: παραβολὰς
  choice: Gleichnisse
  rationale: Die geläufige und sachlich passende deutsche Bezeichnung für diese bildhaften Erzählungen und Aussagen Jesu.
- source_word: ἔγνωσαν
  choice: erkannten
  rationale: Der Aorist von γινώσκω bezeichnet hier das Erfassen beziehungsweise Erkennen dessen, auf wen die Gleichnisse zielten; „erkannten“ bringt diesen Vorgang natürlicher zum Ausdruck als „wussten“.
- source_word: περὶ αὐτῶν
  choice: von ihnen
  rationale: περί mit Genitiv bedeutet „über/von, betreffend“. „Von ihnen“ ist in der Verbindung „sprechen von“ idiomatisches Deutsch und trägt nicht eigenmächtig die stärkere Bedeutung „gegen sie“ ein.
- source_word: λέγει
  choice: sprach
  rationale: Das griechische Präsens im abhängigen Aussagesatz wird nach dem vergangenzeitlichen Hauptverb idiomatisch mit deutschem Präteritum wiedergegeben.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, dass Jesu Gleichnisse gegen die religiösen Führer gerichtet waren
  choice: dass er von ihnen sprach
  alternative: dass er gegen sie sprach
  rationale: Der Zusammenhang macht den kritischen Bezug deutlich, doch περί mit Genitiv bezeichnet zunächst das Reden über beziehungsweise von ihnen. Die Übersetzung bewahrt diese Formulierung, ohne die implizite Gegnerschaft zur ausdrücklichen lexikalischen Aussage zu machen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Der Satzbau folgt natürlichem deutschem Sprachgebrauch; traditionelle Fachbegriffe wie „Pharisäer“ und „Gleichnisse“ bleiben erhalten.
