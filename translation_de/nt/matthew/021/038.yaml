source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: de
  text: 'Als die Weinbergpächter aber den Sohn sahen, sagten sie unter sich: »Das ist der Erbe. Kommt, lasst uns ihn töten und uns sein Erbe aneignen[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und sein Erbe haben«; gemeint ist hier, es in ihren Besitz zu bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: Weinbergpächter
  rationale: Im Kontext sind es Pächter, die den Weinberg des Besitzers bewirtschaften. »Weinbergpächter« bezeichnet ihre soziale Rolle und den konkreten landwirtschaftlichen Zusammenhang knapp und natürlich.
- source_word: ἰδόντες
  choice: als ... sahen
  rationale: Das Aoristpartizip wird idiomatisch als temporaler Nebensatz wiedergegeben und wahrt die Abfolge des Geschehens.
- source_word: τὸν υἱόν
  choice: den Sohn
  rationale: Der griechische Text hat keinen ausdrücklichen Possessivartikel. »Den Sohn« folgt der Formulierung direkt; die Zugehörigkeit ist aus dem Kontext klar.
- source_word: ἐν ἑαυτοῖς
  choice: zueinander
  rationale: Die Pächter beraten innerhalb ihrer Gruppe. »Zueinander« ist im Deutschen für ausdrücklich wiedergegebene Gruppenrede natürlicher als das wörtlichere »unter sich«.
- source_word: κληρονόμος
  choice: Erbe
  rationale: »Erbe« ist die geläufige und präzise deutsche Entsprechung mit rechtlichem Erbschaftssinn.
- source_word: δεῦτε
  choice: Kommt
  rationale: Das Wort leitet eine gemeinsame Aufforderung ein; »Kommt« bewahrt diesen exhortativen Charakter.
- source_word: ἀποκτείνωμεν
  choice: wir wollen ihn töten
  rationale: Der auffordernde Konjunktiv wird nach »Kommt« natürlich mit »wir wollen« wiedergegeben. »Töten« entspricht dem Verb, ohne den rechtlichen Akzent von »ermorden« zusätzlich einzutragen.
- source_word: σχῶμεν
  choice: an uns bringen
  rationale: Wörtlich bezeichnet die Form von ἔχω das Haben beziehungsweise Erlangen. Im Zusammenhang meint sie, sich das Erbe infolge der Tötung anzueignen; »an uns bringen« drückt dies aus, ohne die Art der Aneignung genauer festzulegen als der Text.
- source_word: κληρονομίαν αὐτοῦ
  choice: sein Erbe
  rationale: »Erbe« ist hier im Deutschen eine natürliche Bezeichnung für das Erbgut und gibt αὐτοῦ mit »sein« ausdrücklich wieder.
theological_decisions:
- issue: Parabolische Bedeutung des Sohnes
  choice: »den Sohn« ohne ausdrückliche christologische Identifizierung
  alternative: Die Übersetzung könnte den Sohn deutend als Hinweis auf Jesus kennzeichnen.
  rationale: Im Matthäusevangelium weist die Gestalt auf Jesus hin, doch der Vers bleibt auf der Erzählebene des Gleichnisses. Die schlichte Wiedergabe bewahrt diese Ebene und überlässt die Identifizierung dem Zusammenhang.
- issue: Art der Aneignung des Erbes
  choice: »sein Erbe an uns bringen«
  alternative: »sein Erbe an uns reißen« oder wörtlicher »sein Erbe haben«
  rationale: Der Kontext macht eine unrechtmäßige Aneignung deutlich, während σχῶμεν lexikalisch zunächst »haben/erlangen« bedeutet. Die Formulierung wahrt beides, ohne Gewalt zusätzlich in das Verb selbst einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist lebendig, bleibt aber frei von umgangssprachlichen Zusätzen. Der Vers folgt der griechischen Satzbewegung, ohne die Partizipialkonstruktion unnatürlich nachzubilden.
