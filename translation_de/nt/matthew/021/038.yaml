    issue: Hortativer Charakter von ἀποκτείνωμεν
    rationale: „Kommt, lasst uns ihn töten“ bildet die gemeinsame Aufforderung klarer und idiomatischer ab als „Kommt, wir wollen ihn töten“.
  - severity: low
    issue: Formulierung „sein Erbe an uns bringen“
    rationale: Die Wendung ist verständlich, aber im modernen Deutsch weniger geläufig. „Uns sein Erbe aneignen“ ist idiomatischer und wahrt den aus dem Kontext erschlossenen Erwerbs- bzw. Besitzergreifungssinn.
  - severity: low
    issue: Position des Fußnotenzeichens
    rationale: Die Fußnote erläutert σχῶμεν und sollte daher unmittelbar bei der betreffenden Wiedergabe der Aneignung stehen, nicht erst nach dem gesamten Zitat.
