  rationale: Die Revision verbessert die idiomatische und grammatische Abbildung der beiden hortativen Konjunktive und ersetzt eine weniger geläufige Wendung durch eine natürliche Formulierung, ohne die parabolische oder theologische Aussage zu erweitern. Das Fußnotenzeichen steht nun direkt bei dem erläuterten Ausdruck.
