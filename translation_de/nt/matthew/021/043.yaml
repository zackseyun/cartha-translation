  verdict: revise
  source_fidelity: Der Satz gibt Folgerung, Zukunftspassiv, Wegnahme von den Angeredeten und Gabe an einen durch Fruchtbringen gekennzeichneten kollektiven Empfänger zutreffend wieder. Allerdings ist das griechische αὐτῆς feminin und bezieht sich auf ἡ βασιλεία; es bezeichnet daher die Früchte des Reiches Gottes, nicht die des Volkes.
  naturalness: Der deutsche Satz ist flüssig und dem modernen Standarddeutsch angemessen. „dessen Früchte“ ist jedoch wegen der beiden sächlichen Bezugswörter „Reich“ und „Volk“ mehrdeutig. Die ausdrückliche Genitivfügung beseitigt diese nicht im griechischen Text vorhandene Mehrdeutigkeit.
  terminology: „Reich Gottes“, „Volk“ und „hervorbringt“ sind passende, theologisch nicht einengende Wiedergaben. Die Fußnote wahrt die lexikalische Offenheit von ἔθνει und legt die Identität des Empfängervolks nicht fest.
  issues:
