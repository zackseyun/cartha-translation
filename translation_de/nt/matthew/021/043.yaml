    issue: Mehrdeutiger Bezug von „dessen Früchte“
    rationale: Im Griechischen verweist αὐτῆς aufgrund des femininen Genus eindeutig auf „das Reich Gottes“ (ἡ βασιλεία) und nicht auf ἔθνει. Im Deutschen kann „dessen“ dagegen sowohl auf „das Reich“ als auch auf „ein Volk“ bezogen werden. „die Früchte des Reiches Gottes“ stellt den Quellbezug klar.
