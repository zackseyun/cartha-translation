id: MAT.21.43
reference: Matthew 21:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: de
  text: 'Darum sage ich euch: Das Reich Gottes wird euch weggenommen und einem Volk[a] gegeben werden, das die Früchte des Reiches Gottes hervorbringt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einer Nation. Das griechische Wort ἔθνος kann eine Nation oder eine Volksgemeinschaft bezeichnen. Hier wird eine Gemeinschaft dadurch gekennzeichnet, dass sie die Früchte des Reiches Gottes hervorbringt, ohne genauer festzulegen, wer damit gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Leitet aus dem vorangehenden Gleichnis und Schriftwort eine Folgerung ab; „Darum“ ist knapp, natürlich und bewahrt den logischen Zusammenhang.
- source_word: λέγω ὑμῖν
  choice: sage ich euch
  rationale: Gibt die direkte und persönliche Anrede in gegenwärtigem, würdigem Deutsch wieder.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: wird euch weggenommen
  rationale: Bewahrt Passiv, Zukunftsbezug und Trennung von den bisherigen Empfängern; die deutsche Dativkonstruktion ist idiomatisch.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die etablierte und sachlich offene Wiedergabe lässt sowohl Herrschaft als auch Herrschaftsbereich mitschwingen, ohne auf nur einen Aspekt zu verengen.
- source_word: δοθήσεται
  choice: gegeben werden
  rationale: Bewahrt das koordinierte Futur Passiv; das gemeinsame Subjekt „das Reich Gottes“ bleibt klar.
- source_word: ἔθνει
  choice: einem Volk
  rationale: ἔθνος bezeichnet hier einen gemeinschaftlichen Empfänger. „Volk“ ist im Deutschen natürlicher als „Nation“ und legt weder ausschließlich Nichtjuden noch eine bestimmte spätere theologische Identifikation fest.
- source_word: ποιοῦντι
  choice: das … hervorbringt
  rationale: Das substantivbezogene Partizip kennzeichnet das Volk durch fortdauerndes Hervorbringen; die Formulierung passt zur Fruchtmetaphorik.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: dessen Früchte
  rationale: Der Plural „Früchte“ wird bewahrt. „Dessen“ verweist grammatisch und inhaltlich auf „das Reich Gottes“ und nicht auf das Volk.
theological_decisions:
- issue: Identität des mit ἔθνει bezeichneten Volkes
  choice: Im Haupttext allgemein als „ein Volk“ wiedergegeben.
  alternative: „eine Nation“, ausdrücklich „die Nichtjuden“ oder ausdrücklich „die Gemeinde“
  rationale: Der griechische Wortlaut bezeichnet einen gemeinschaftlichen Empfänger durch seine Fruchtbarkeit, bestimmt ihn aber nicht ausdrücklich als eine einzelne spätere theologische Größe. Die offene Wiedergabe vermeidet eine vorschnelle konfessionelle oder supersessionistische Festlegung.
- issue: Bedeutungsumfang von „Reich Gottes“
  choice: Als „das Reich Gottes“ beibehalten.
  alternative: „Gottes Herrschaft“ oder eine erklärende Umschreibung wie „die Vorrechte des Gottesvolkes“
  rationale: Die traditionelle, weiterhin verständliche Wendung bewahrt den weiten Bedeutungsumfang von βασιλεία und verengt die Gerichtsaussage nicht durch eine Deutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber idiomatisch. Der Fußnotenmarker steht unmittelbar bei dem erläuterten Ausdruck.
