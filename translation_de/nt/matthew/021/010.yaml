  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: de
  text: 'Als er in Jerusalem einzog, geriet die ganze Stadt in Aufruhr[a] und fragte: »Wer ist dieser?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde erschüttert«. Das griechische Verb kann ein körperliches Erschüttern bezeichnen, hier aber auch die heftige Unruhe und Erregung der Bevölkerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: als er … eingezogen war
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben. Das Verb bezeichnet hier das Hineingehen in die Stadt; »eingezogen« passt zum erzählten Einzug, ohne ein zeitlich weit nachfolgendes Geschehen anzudeuten.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: ἐσείσθη
  choice: geriet … in Aufruhr
  rationale: Das Verb bedeutet wörtlich »erschüttern« und beschreibt hier bildhaft die starke öffentliche Erregung der Stadt. »Geriet in Aufruhr« gibt diese kollektive Unruhe in natürlichem Deutsch wieder; die wörtlichere Bildsprache bleibt in der Fußnote sichtbar.
- source_word: πᾶσα ἡ πόλις
  choice: die ganze Stadt
  rationale: Idiomatiche Wiedergabe der Stadt als Gesamtheit ihrer Bewohner.
- source_word: λέγουσα
  choice: und sagte
  rationale: Das Partizip stimmt mit »Stadt« überein und wird entsprechend im Singular wiedergegeben. »Sagte« bewahrt die Formulierung des Ausgangstextes; der Fragesatz zeigt die Funktion als Frage.
- source_word: Τίς ἐστιν οὗτος;
  choice: Wer ist dieser?
  rationale: Die knappe Frage folgt dem Griechischen, ohne das dort nicht ausdrücklich stehende Substantiv »Mann« hinzuzufügen.
theological_decisions:
- issue: Bildliche oder wörtliche Bedeutung der Reaktion der Stadt
  choice: 'Bildlich: »geriet … in Aufruhr«'
  alternative: »wurde erschüttert«
  rationale: Im Zusammenhang bezeichnet das Verb die heftige kollektive Reaktion auf Jesu Einzug. Die Hauptfassung vermittelt diesen Sinn, während die Fußnote die zugrunde liegende Erschütterungsmetapher und ihre mögliche wörtlichere Wiedergabe bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierte »Stadt« und der Singular »sagte« entsprechen der griechischen Konstruktion. »Wer ist dieser?« ist bewusst knapp und etwas feierlicher, vermeidet aber die Ergänzung »Mann«.
