  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: de
  text: 'Und sie sagten zu ihm: „Hörst du, was die da sagen?“ Jesus aber sagt zu ihnen: „Ja. Habt ihr nie gelesen: ‚Aus dem Mund von kleinen Kindern und Säuglingen hast du Lob bereitet‘?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jesus zitiert Psalm 8,3 nach der griechischen Schriftüberlieferung. Der hebräische Text wird häufig so übersetzt: „Aus dem Mund von kleinen Kindern und Säuglingen hast du Macht gegründet.“'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Hörst du
  rationale: Die präsentische direkte Frage wird im Deutschen natürlich und textnah mit „Hörst du“ wiedergegeben.
- source_word: τί οὗτοι λέγουσιν
  choice: was die da sagen
  rationale: „Die da“ bewahrt die leicht distanzierende beziehungsweise abwertende Färbung von οὗτοι, ohne ein im Griechischen nicht genanntes Substantiv einzufügen.
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens wird zur Wahrung der erzählerischen Lebendigkeit beibehalten.
- source_word: Ναί
  choice: Ja
  rationale: Die schlichte Bejahung entspricht unmittelbar dem griechischen Ausdruck.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Habt ihr nie gelesen
  rationale: Diese Formulierung ist modernes, idiomatisches Deutsch und erhält den vorwurfsvollen Ton der rhetorischen Frage.
- source_word: Ἐκ στόματος
  choice: Aus dem Mund von
  rationale: Die Präpositionalphrase wird eng am griechischen Wortlaut und zugleich natürlich deutsch wiedergegeben.
- source_word: νηπίων
  choice: kleinen Kindern
  rationale: νήπια bezeichnet sehr junge Kinder; „kleine Kinder“ unterscheidet sie verständlich von den unmittelbar danach genannten Säuglingen.
- source_word: θηλαζόντων
  choice: Säuglingen
  rationale: Das substantivierte Partizip bezeichnet noch gestillte Kinder; „Säuglinge“ ist die knappe und natürliche deutsche Entsprechung.
- source_word: κατηρτίσω
  choice: hast du dir … bereitet
  rationale: „Bereitet“ gibt das Herstellen beziehungsweise Zustandebringen des Lobes wieder; das reflexive „dir“ macht im Deutschen den Zielbezug des Lobes natürlich verständlich, ohne den Sinn festzulegen.
- source_word: αἶνον
  choice: Lob
  rationale: Das abstrakte Substantiv αἶνος wird direkt und idiomatisch mit „Lob“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Psalmzitats in Jesu Argument
  choice: Im Haupttext wird Matthäus’ griechische Formulierung „hast du dir Lob bereitet“ übersetzt.
  alternative: Der hebräische Text von Psalm 8,3 wird häufig mit „hast du Macht gegründet“ wiedergegeben.
  rationale: Maßgeblich ist der von Matthäus überlieferte griechische Wortlaut; er wird nicht an den hebräischen Psalmtext angeglichen. Die bekannte abweichende Fassung wird transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die da“ erhält die im Demonstrativpronomen liegende Distanzierung. Das historische Präsens „sagt“ bleibt entsprechend dem griechischen Erzählstil stehen. Die Psalmstellenzählung folgt der in deutschen Bibeln üblichen Zählung (Psalm 8,3).
