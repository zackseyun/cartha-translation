id: MAT.21.31
reference: Matthew 21:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: de
  text: 'Wer von den beiden hat den Willen des Vaters getan? Sie antworteten: »Der erste.« Jesus sagte zu ihnen: »Amen, ich sage euch: Die Zolleinnehmer und die Prostituierten gehen euch in das Reich Gottes voraus.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kommen vor euch in das Reich Gottes hinein«. Das griechische Verb bedeutet wörtlich, jemandem vorauszugehen; es betont hier den Vorrang, ohne für sich allein einen endgültigen Ausschluss der Angesprochenen auszusagen.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Wer von den beiden
  rationale: Gibt den partitiven Sinn von ἐκ mit δύο knapp und idiomatisch wieder.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: hat den Willen des Vaters getan
  rationale: Bewahrt die konkrete Verbindung von ποιέω und θέλημα sowie den Vater der vorausgehenden Erzählung als Bezugspunkt.
- source_word: Ὁ πρῶτος
  choice: Der erste
  rationale: Entspricht der knappen, elliptischen Antwort des Griechischen.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Bewahrt die feierliche, für Jesus charakteristische Einleitungsformel und bleibt im Deutschen verständlich.
- source_word: τελῶναι
  choice: Zolleinnehmer
  rationale: Bezeichnet verständlich die gesellschaftlich verachteten Einnehmer von Zöllen und Abgaben im damaligen System.
- source_word: πόρναι
  choice: Prostituierten
  rationale: Gibt die spezifische Bedeutung des griechischen Ausdrucks klar und ohne archaische oder unnötig verallgemeinernde Sprache wieder.
- source_word: προάγουσιν ὑμᾶς
  choice: gehen euch … voraus
  rationale: Bewahrt die bildhafte Bedeutung des Vorangehens und den präsentischen Aspekt, ohne einen endgültigen Ausschluss der Angesprochenen in den Text hineinzulesen.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: in das Reich Gottes
  rationale: Gibt die durch εἰς ausgedrückte Richtung wieder und verwendet die geläufige theologische Wendung.
theological_decisions:
- issue: Aussagekraft von προάγουσιν ὑμᾶς hinsichtlich des Eingehens in das Reich Gottes
  choice: gehen euch in das Reich Gottes voraus
  alternative: kommen vor euch in das Reich Gottes hinein
  rationale: Die gewählte Fassung erhält das Bild des Vorangehens und betont den Vorrang, ohne ausdrücklich zu behaupten, die angesprochenen religiösen Führer seien endgültig ausgeschlossen. So bleibt die Spannung des griechischen Wortlauts bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Amen-Formel bleibt wegen ihres besonderen Gewichts erhalten; ansonsten ist die Wortwahl gegenwärtig und unmittelbar verständlich.
