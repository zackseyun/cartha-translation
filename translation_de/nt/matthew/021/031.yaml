  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes angemessen wieder: die partitive Frage („Wer von den beiden“), das idiomatische „den Willen ... getan“, die elliptische Antwort „Der erste“, die feierliche Amen-Formel, die Bezeichnungen „Zolleinnehmer“ und „Prostituierte“ sowie das präsentische und nicht-exklusiv verstandene „gehen euch ... voraus“. „In das Reich Gottes“ bewahrt die Bewegungsrichtung von εἰς.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit einem dem Kontext angemessen würdevollen Register. „Amen, ich sage euch“ ist als bewusste, traditionsreiche Jesusformel auch im heutigen Deutsch natürlich. Die Satzführung und Zeichensetzung sind klar.
  terminology: „Reich Gottes“ ist die etablierte deutsche Wiedergabe von βασιλεία τοῦ θεοῦ. „Zolleinnehmer“ ist im historischen Evangelienkontext eine sachgerechte Wiedergabe von τελῶναι; „Prostituierte“ trifft πόρναι präzise und ohne archaisierende Sprache. Die Fußnote erläutert zutreffend, dass προάγουσιν Vorrang ausdrückt, ohne einen endgültigen Ausschluss zwingend festzulegen.
