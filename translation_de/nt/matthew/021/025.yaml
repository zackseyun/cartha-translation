id: MAT.21.25
reference: Matthew 21:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: de
  text: 'Die Taufe des Johannes – woher stammte sie? Vom Himmel[a] oder von Menschen[b]? Sie überlegten miteinander und sagten: »Wenn wir sagen: ›Vom Himmel‹, wird er uns fragen: ›Warum habt ihr ihm dann nicht geglaubt?‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Gott«. »Vom Himmel« ist hier eine ehrfürchtige Umschreibung für göttlichen Ursprung oder göttliche Bevollmächtigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: von Menschen ausgehend, also rein menschlichen Ursprungs – im Gegensatz zum Ursprung im Himmel.'
    reason: lexical_clarification
lexical_decisions:
- source_word: βάπτισμα
  choice: Taufe
  rationale: Das Wort bezeichnet hier die von Johannes vollzogene Taufe beziehungsweise sein Taufwirken; „Taufe“ ist die etablierte und natürliche deutsche Wiedergabe.
- source_word: τὸ Ἰωάννου
  choice: des Johannes
  rationale: Der Genitiv ordnet die Taufe Johannes zu und wird in der geläufigen Wendung „die Taufe des Johannes“ präzise wiedergegeben.
- source_word: πόθεν ἦν
  choice: woher stammte sie
  rationale: πόθεν fragt nach Ursprung oder Herkunft. „Woher stammte sie?“ ist idiomatisches Deutsch und macht diesen Sinn klar.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel
  rationale: Die wörtliche Formulierung bewahrt die ehrfürchtige Umschreibung für göttlichen Ursprung und den Gegensatz zur menschlichen Herkunft.
- source_word: ἐξ ἀνθρώπων
  choice: von Menschen
  rationale: ἀνθρώπων meint Menschen allgemein, nicht nur Männer. „Von Menschen“ bewahrt den knappen Gegensatz zu „vom Himmel“.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: sie überlegten miteinander
  rationale: Die Wendung beschreibt ihre fortlaufende gemeinsame Beratung. „Überlegten miteinander“ gibt sowohl das Abwägen als auch den Austausch natürlich wieder.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip führt den Inhalt ihrer Beratung ein; im Deutschen ist die finite Verbindung idiomatischer.
- source_word: Ἐὰν εἴπωμεν
  choice: Wenn wir sagen
  rationale: Die Bedingung wird im Deutschen natürlich mit Präsens wiedergegeben.
- source_word: ἐρεῖ ἡμῖν
  choice: wird er uns fragen
  rationale: Obwohl λέγω wörtlich „sagen“ heißt, folgt unmittelbar eine Frage. „Fragen“ ist im Deutschen die natürliche Redeeinleitung und verändert den Inhalt nicht.
- source_word: Διὰ τί οὖν
  choice: Warum ... dann
  rationale: „Dann“ gibt die folgernde Kraft von οὖν in der deutschen Frage idiomatisch wieder.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: habt ihr ihm nicht geglaubt
  rationale: πιστεύω mit Dativ bezeichnet hier, Johannes und seiner Botschaft Glauben zu schenken; „ihm geglaubt“ trifft dies direkt.
theological_decisions:
- issue: Bedeutung von „vom Himmel“
  choice: Die konkrete Formulierung „vom Himmel“ bleibt im Haupttext erhalten.
  alternative: von Gott
  rationale: Die Wendung verweist ehrfürchtig auf göttlichen Ursprung oder göttliche Bevollmächtigung. Die wörtliche Wiedergabe bewahrt Ausdruck und rhetorischen Gegensatz, ohne die Umschreibung im Haupttext aufzulösen.
- issue: Bedeutung von ἀνθρώπων im Gegensatz zum Himmel
  choice: von Menschen
  alternative: von Männern
  rationale: Gemeint ist rein menschlicher Ursprung, nicht eine geschlechtsspezifische Gruppe. „Menschen“ gibt den generischen Sinn im modernen Deutschen korrekt wieder.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Woher stammte sie?“ verdeutlicht die Frage nach dem Ursprung. Die verschachtelte direkte Rede wird durch deutsche Anführungszeichen klar gegliedert.
