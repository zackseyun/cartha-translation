  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: de
  text: Sie brachten die Eselin und das Fohlen, legten ihre Gewänder auf sie und er setzte sich auf sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er setzte sich auf die Gewänder, die sie auf die Tiere gelegt hatten. Das griechische Pronomen steht im Plural und kann sich auf die Tiere oder auf die Gewänder beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: Sie brachten
  rationale: Der Aorist von ἄγω kann „führen“ oder „bringen“ bedeuten. Im erzählerischen Zusammenhang ist „brachten“ im modernen Deutschen natürlich und gibt wieder, dass die Jünger die Tiere zu Jesus führten.
- source_word: τὴν ὄνον
  choice: die Eselin
  rationale: Das feminine Substantiv mit femininem Artikel bezeichnet hier eine Eselin; die ausdrückliche Wiedergabe passt zur anschließenden Nennung ihres Fohlens und ist im Deutschen natürlich.
- source_word: τὸν πῶλον
  choice: das Fohlen
  rationale: πῶλος bezeichnet ein Jungtier. Durch die unmittelbare Verbindung mit „Eselin“ ist klar, dass ein Eselsfohlen gemeint ist.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: legten ihre Obergewänder auf sie
  rationale: ἱμάτια bezeichnet äußere Kleidungsstücke. „Obergewänder“ ist sachlich präzise und würdevoll; „ihre“ wird sinngemäß aus dem Kontext ergänzt. Das pluralische „sie“ bewahrt den Bezug auf beide Tiere.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: er setzte sich darauf
  rationale: „Darauf“ gibt die lokale Bedeutung idiomatisch wieder, ohne den Bezug des letzten pluralischen αὐτῶν im Haupttext eindeutig auf Tiere oder Obergewänder festzulegen. Die Fußnote macht die syntaktische Mehrdeutigkeit sichtbar.
theological_decisions:
- issue: Bezug des letzten pluralischen αὐτῶν in καὶ ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Die mehrdeutige Formulierung wird mit „darauf“ bewahrt und in einer Fußnote erläutert.
  alternative: „Er setzte sich auf die Obergewänder“ oder eine eindeutige Bezugnahme auf eines der Tiere.
  rationale: Das Griechische lässt als Bezug sowohl die beiden Tiere als auch die auf ihnen liegenden Obergewänder zu. Da es sich um eine echte syntaktische und erzählerische Mehrdeutigkeit handelt, wird sie nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Eselin“ macht das im Griechischen markierte Geschlecht sichtbar; „Obergewänder“ ist präziser als das im heutigen Deutsch missverständliche „Mäntel“. Die Formulierung „darauf“ erhält die Mehrdeutigkeit des griechischen Schlusspronomens.
