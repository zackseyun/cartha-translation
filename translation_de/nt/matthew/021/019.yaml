  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: de
  text: 'Als er am Weg einen Feigenbaum sah, ging er zu ihm hin, fand aber nichts an ihm als Blätter. Da sagte er zu ihm: »Von dir soll in Ewigkeit keine Frucht mehr kommen.« Und der Feigenbaum verdorrte sofort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: einen Feigenbaum
  rationale: μίαν führt hier idiomatisch einen einzelnen, unbestimmten Baum ein; »einen Feigenbaum« ist natürliches Deutsch, ohne den Zahlaspekt unnötig zu betonen.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: am Weg
  rationale: Die Wendung bezeichnet die Lage beim beziehungsweise neben dem Weg; »am Weg« ist knapp, natürlich und nicht missverständlich wie das wörtliche »auf dem Weg«.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: ging er zu ihm hin
  rationale: Die Präposition bezeichnet die Annäherung an den Baum. Das maskuline Pronomen folgt dem deutschen Genus von »Feigenbaum«.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: fand aber nichts an ihm als nur Blätter
  rationale: Bei einem Baum ist »an ihm« idiomatischer als »in ihm«; »als nur Blätter« bewahrt die emphatische Ausschließlichkeit von εἰ μὴ ... μόνον.
- source_word: λέγει αὐτῇ
  choice: Da sagte er zu ihm
  rationale: Das historische Präsens wird für einen flüssigen deutschen Erzählstil als Präteritum wiedergegeben; »Da« markiert den Fortgang, ohne zusätzliche Deutung.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: Von dir soll in Ewigkeit keine Frucht mehr kommen
  rationale: Die Formulierung erhält die Herkunftsbildlichkeit von ἐκ σοῦ und gibt Μηκέτι sowie εἰς τὸν αἰῶνα jeweils erkennbar wieder. Die Soll-Konstruktion trägt den feierlichen, wirksamen Ausspruch im Deutschen natürlicher als eine Wunschformel.
- source_word: ἐξηράνθη παραχρῆμα
  choice: verdorrte sofort
  rationale: »Verdorren« ist für einen Baum die natürliche Entsprechung von ἐξηράνθη; »sofort« gibt die Unmittelbarkeit von παραχρῆμα klar wieder.
theological_decisions:
- issue: Kraft des Ausspruchs Jesu über den Feigenbaum
  choice: 'Als feierlich-jussiven Ausspruch wiedergeben: »Von dir soll in Ewigkeit keine Frucht mehr kommen.«'
  alternative: 'Als Vorhersage formulieren: »Von dir wird nie wieder Frucht kommen«, oder als Wunsch: »Möge nie wieder Frucht von dir kommen.«'
  rationale: Der Subjunktiv γένηται mit Μηκέτι trägt hier den Charakter eines untersagenden beziehungsweise verwünschenden Ausspruchs. Die Soll-Form bewahrt diese Spannung, ohne ihn ausschließlich als Wunsch oder bloße Vorhersage festzulegen; eine symbolische Deutung wird nicht in den Vers eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Bezug zur griechischen Satzbewegung. Die Wiederholung des auf den Baum bezogenen Pronomens bleibt erhalten. Keine Fußnote ist nötig, da die zentrale Ambiguität des Ausspruchs im Haupttext angemessen bewahrt wird.
