  source_fidelity: 'Der Entwurf gibt den griechischen Satzinhalt zuverlässig wieder: die Lage des Baumes am Weg, die Annäherung, das ausschließliche Finden von Blättern, den feierlich-jussiven Ausspruch und das unmittelbare Verdorren. »In Ewigkeit« gibt εἰς τὸν αἰῶνα angemessen als dauerhafte Negation wieder. Der durch μίαν eingeführte einzelne Baum muss im idiomatischen Deutschen nicht ausdrücklich mit »ein einzelner« markiert werden.'
  naturalness: »Als er am Weg einen Feigenbaum sah« sowie »ging er zu ihm hin« sind natürliches modernes Standarddeutsch. Die Verbindung »fand aber nichts an ihm als nur Blätter« ist jedoch unnötig schwerfällig und doppelt ausschließend. »Fand aber nichts an ihm als Blätter« ist idiomatisch und bewahrt die Ausschließlichkeit.
  terminology: »Feigenbaum«, »Frucht«, »in Ewigkeit« und »verdorrte sofort« passen zum würdigen modernen Register und zur Terminologie des Verses. Die Soll-Formulierung wahrt den Charakter des Ausspruchs, ohne ihn zu einer bloßen Vorhersage oder zu einer ausschließlich als Wunsch verstandenen Aussage einzuengen.
