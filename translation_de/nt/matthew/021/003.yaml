  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: de
  text: 'Und wenn jemand euch etwas sagt, sollt ihr sagen: »Der Herr[a] braucht sie.« Und sofort wird er sie schicken.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Meister braucht sie.«'
    reason: lexical_alternative
  - marker: b
    text: Das Subjekt ist im Griechischen nicht ausdrücklich genannt. Gemeint ist wahrscheinlich die Person, die euch anspricht und die Tiere freigibt; möglich ist auch, dass »der Herr« als Subjekt verstanden wird.
    reason: ambiguity
lexical_decisions:
- source_word: καὶ ἐάν τις ὑμῖν εἴπῃ τι
  choice: Und wenn jemand etwas zu euch sagt
  rationale: Die offene Bedingung und das unbestimmte τις/τι werden ohne Verengung auf eine Frage oder einen Einwand wiedergegeben. Das pluralische ὑμῖν entspricht »euch«.
- source_word: ἐρεῖτε
  choice: sollt ihr sagen
  rationale: Der Futur Indikativ hat hier anweisende Kraft. »Sollt ihr sagen« klingt im heutigen Deutsch natürlich und wahrt den direktiven Sinn.
- source_word: Ὁ κύριος
  choice: Der Herr
  rationale: »Herr« bewahrt sowohl die gewöhnliche Bedeutung einer Autoritätsperson als auch die mögliche christologische Titelfunktion; eine eindeutige Festlegung auf den menschlichen Besitzer wird vermieden.
- source_word: αὐτῶν χρείαν ἔχει
  choice: braucht sie
  rationale: Die deutsche Verbform gibt die idiomatische Wendung χρείαν ἔχει klar und natürlich wieder. Das Pronomen im Plural verweist im Kontext auf die beiden Tiere.
- source_word: εὐθὺς δὲ
  choice: Dann … sofort
  rationale: εὐθύς bezeichnet unverzügliches Handeln. »Dann« stellt zugleich den Anschluss an die angekündigte Antwort her; δέ wird im Deutschen nicht unnötig adversativ wiedergegeben.
- source_word: ἀποστελεῖ αὐτούς
  choice: wird er sie schicken
  rationale: Die Übersetzung wahrt Futur, Pronomen und Grundbedeutung von ἀποστέλλω, ohne die im Griechischen nicht ausdrücklich enthaltene Vorstellung eines Zurücksendens einzufügen.
theological_decisions:
- issue: Bedeutung von Ὁ κύριος
  choice: Der Herr
  alternative: der Besitzer / ihr Herr
  rationale: Der Ausdruck kann im unmittelbaren Geschehen eine Autoritätsperson bezeichnen, trägt im Matthäusevangelium aber zugleich mögliches christologisches Gewicht. »Der Herr« hält diese Spannung offen.
- issue: Subjekt von ἀποστελεῖ
  choice: Das im Deutschen nur pronominal bezeichnete »er« bleibt im Haupttext ohne ausdrücklich genannten Bezug.
  alternative: Der Herr wird sie schicken; beziehungsweise der Angesprochene wird sie schicken.
  rationale: Das griechische Verb nennt sein Subjekt nicht ausdrücklich. Im Zusammenhang liegt der Angesprochene als derjenige nahe, der die Tiere freigibt, doch grammatisch kann »der Herr« als nächstgenanntes Subjekt verstanden werden. Die Fußnote bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die anweisende Futurform wird idiomatisch mit »sollt« wiedergegeben; unnötig altertümliche Formulierungen wie »hat ihrer nötig« werden vermieden. Die syntaktische und theologische Mehrdeutigkeit des letzten Satzes wird nicht stillschweigend aufgelöst.
