id: MAT.21.5
reference: Matthew 21:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: de
  text: 'Sagt der Tochter Zion: »Sieh, dein König kommt zu dir, sanft[a], reitend auf einem Esel und auf einem Füllen[b], dem Jungen eines Lasttiers.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »demütig«. Das griechische Wort πραΰς kann »sanft«, »mild« oder »demütig« bedeuten; die Formulierung steht im Anklang an Sacharja 9,9.'
    reason: lexical_alternative
  - marker: b
    text: 'Matthäus bewahrt die prophetische Formulierung mit zwei verbundenen Tierbezeichnungen: »auf einem Esel und auf einem Füllen, dem Jungen eines Lasttiers«.'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Sagt
  rationale: Der Aoristimperativ Plural wird als direkte, gegenwärtig verständliche Aufforderung wiedergegeben.
- source_word: τῇ θυγατρὶ Σιών
  choice: der Tochter Zion
  rationale: Bewahrt die prophetische Personifikation, ohne sie erklärend zu »Bewohnern Jerusalems« aufzulösen.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Zuruf würdig und ohne unnötig altertümliches Deutsch wieder.
- source_word: ὁ βασιλεύς σου
  choice: dein König
  rationale: Bewahrt die direkte Anrede und die königliche, im Kontext messianische Bedeutung.
- source_word: ἔρχεταί σοι
  choice: kommt zu dir
  rationale: Entspricht dem anschaulichen griechischen Präsens und klingt im Deutschen natürlich.
- source_word: πραῢς
  choice: sanft
  rationale: Bezeichnet Sanftmut beziehungsweise Milde; »sanft« ist modernes, verständliches Deutsch, während »demütig« als echte Bedeutungsalternative in der Fußnote erhalten bleibt.
- source_word: ἐπιβεβηκὼς
  choice: reitend
  rationale: Das Perfektpartizip beschreibt den König als auf das Tier gestiegen und darauf befindlich; »reitend« fügt sich natürlich in den deutschen Satz ein.
- source_word: ἐπὶ ὄνον
  choice: auf einem Esel
  rationale: Direkte und idiomatische Wiedergabe der Präpositionalphrase.
- source_word: πῶλον
  choice: einem Füllen
  rationale: Bezeichnet ein Jungtier; der folgende Ausdruck präzisiert dessen Herkunft beziehungsweise Art.
- source_word: υἱὸν ὑποζυγίου
  choice: dem Jungen eines Lasttiers
  rationale: Gibt die semitisch geprägte Wendung verständlich wieder, ohne das bildhafte »Sohn« unnatürlich zu reproduzieren oder ὑποζύγιον enger als der griechische Ausdruck auf »Eselin« festzulegen.
theological_decisions:
- issue: Prophetisches beziehungsweise messianisches Zitat und Verhältnis zu Sacharja 9,9
  choice: Matthäus’ griechischen Wortlaut mit »sanft« und den beiden verbundenen Tierbezeichnungen bewahren.
  alternative: Mit »demütig« stärker an verbreitete Wiedergaben von Sacharja 9,9 angleichen oder die beiden Tierausdrücke zu einer einzigen Bezeichnung zusammenziehen.
  rationale: Die Übersetzung folgt dem vorliegenden griechischen Text des Matthäusevangeliums und harmonisiert ihn nicht stillschweigend mit einer alttestamentlichen Fassung. Die sprachliche Doppelung bleibt deshalb sichtbar, ohne ihre Auslegung im Haupttext vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Anrede »Tochter Zion« und die auffällige doppelte Tierformulierung bleiben erhalten; altertümliche Wörter wie »siehe« oder »Sanftmütiger« werden vermieden.
