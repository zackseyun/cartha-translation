  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: de
  text: Und er ließ sie zurück, ging aus der Stadt hinaus nach Betanien und übernachtete dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλιπὼν
  choice: ließ … stehen
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. „Er ließ sie stehen“ gibt das Zurücklassen in diesem konfrontativen Zusammenhang natürlich wieder, ohne einen zusätzlichen Bewegungsablauf einzuführen.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Pronomen verweist unmittelbar auf die zuvor angesprochenen Personen und bleibt ebenso wenig interpretierend wie der griechische Ausdruck.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: ging aus der Stadt hinaus
  rationale: Die Verbindung aus ἐξέρχομαι und ἔξω betont die Bewegung aus der Stadt nach draußen. Die deutsche Formulierung bewahrt diese Verstärkung idiomatisch.
- source_word: πόλεως
  choice: Stadt
  rationale: πόλις bezeichnet hier Jerusalem; „Stadt“ ist die sachlich und kontextuell passende Wiedergabe.
- source_word: εἰς Βηθανίαν
  choice: nach Betanien
  rationale: Bei Ortsnamen wird die Richtungsangabe εἰς im Deutschen natürlich mit „nach“ wiedergegeben.
- source_word: ηὐλίσθη
  choice: übernachtete
  rationale: Das Verb αὐλίζομαι bedeutet hier, die Nacht an einem Ort zu verbringen. „Übernachtete“ ist präzise, modern und knapp.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb verweist auf Betanien und wird direkt mit „dort“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Satzstruktur folgt dem griechischen Handlungsablauf, klingt jedoch natürlich deutsch. „Betanien“ entspricht der im modernen deutschen Bibelgebrauch üblichen Schreibung.
