  source_fidelity: 'Die Übersetzung trifft Aussage, Konditionalsatz, Glaubensbegriff und die elliptische Bezugnahme auf den Feigenbaum im Wesentlichen. Die beiden griechischen passiven Imperative (Ἄρθητι, βλήθητι) werden jedoch durch reflexive deutsche Imperative semantisch verschoben: Der Berg hebt und stürzt sich im Entwurf selbst, während er im Griechischen angehoben und ins Meer geworfen wird.'
  naturalness: Modernes Standarddeutsch und der würdige Registerton sind überwiegend gelungen. Die Satztrennung vor „Sondern“ zerstört jedoch die syntaktische Verbindung von „nicht nur … sondern …“. Eine durchgehende Satzkonstruktion ist sowohl natürlicher als auch genauer.
  terminology: „Amen, ich sage euch“, „Glauben“ und „zweifelt“ sind angemessene, verständliche Wiedergaben. Die Fußnote erhält die relevante Nuance von διακριθῆτε ohne eine Auslegung aufzuzwingen.
