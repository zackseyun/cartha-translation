source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Amen, ich sage euch: Wenn ihr Glauben habt und nicht zweifelt[a], werdet ihr nicht nur das tun, was mit dem Feigenbaum geschehen ist, sondern selbst wenn ihr zu diesem Berg sagt: ‚Werde emporgehoben und ins Meer geworfen!‘, wird es geschehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht schwankt“ oder „nicht innerlich hin- und hergerissen seid“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jesus antwortete ihnen
  rationale: Die idiomatische deutsche Wiedergabe bewahrt den responsiven Sinn von ἀποκριθείς; δέ dient hier als leichter Übergang und muss nicht eigens mit „aber“ wiedergegeben werden.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: „Amen“ bewahrt die markante, feierliche Einleitungsformel Jesu und ist im Deutschen verständlich.
- source_word: ἐὰν ἔχητε πίστιν
  choice: wenn ihr Glauben habt
  rationale: πίστις bezeichnet hier vertrauendes Zutrauen; „Glauben“ ist die natürliche und theologisch offene deutsche Entsprechung.
- source_word: μὴ διακριθῆτε
  choice: nicht zweifelt
  rationale: Im Kontext bezeichnet das Verb inneres Schwanken oder Zweifeln. Die Hauptübersetzung ist idiomatisch; die Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: werdet ihr nicht nur das tun, was mit dem Feigenbaum geschehen ist
  rationale: Die elliptische griechische Wendung wird im Deutschen ausdrücklich, aber ohne zusätzliche Deutung wiedergegeben.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: selbst wenn ihr zu diesem Berg sagt
  rationale: „Selbst wenn“ gibt die steigernde Kraft von καὶ ἐάν wieder; „diesem Berg“ erhält den demonstrativen Bezug.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Heb dich empor und stürz dich ins Meer!
  rationale: Die beiden passiven Imperative werden als natürliche deutsche Aufforderung an den Berg formuliert. „Emporheben“ bewahrt die räumliche Bildhaftigkeit von αἴρω, „ins Meer stürzen“ die kraftvolle Bewegung von βάλλω.
- source_word: γενήσεται
  choice: wird es geschehen
  rationale: Die Formulierung gibt das zukünftige Eintreten des Gesagten würdig und prägnant wieder.
theological_decisions:
- issue: Bedeutung von πίστις bei einer außergewöhnlichen Handlung
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Der Zusammenhang spricht von vertrauendem Glauben, ohne ihn als menschliche Charaktertreue einzuengen.
- issue: Aussage über das Versetzen eines Berges
  choice: Die bildstarke Aussage wird ohne interpretierende Abschwächung beibehalten.
  alternative: Ausschließlich wörtliche Wunderverheißung; bloße Metapher für das Überwinden von Schwierigkeiten
  rationale: Die Übersetzung entscheidet nicht, ob die Aussage ausschließlich wörtlich oder metaphorisch zu verstehen ist, sondern bewahrt ihre Spannung und Kraft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und anschaulich; altertümliche Formulierungen werden vermieden, während „Amen, ich sage euch“ die charakteristische feierliche Formel bewahrt.
