    rationale: „Nicht nur … Sondern selbst wenn …“ ist nach dem Punkt kein vollständiger und kohärenter Anschluss. Das griechische οὐ μόνον … ἀλλὰ κἄν sollte in einer verbundenen deutschen Konstruktion erscheinen.
