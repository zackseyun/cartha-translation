  source_fidelity: 'Die Übersetzung gibt die drei Handlungen in der griechischen Reihenfolge wieder: λαβόντες („ergriffen“), ἐξέβαλον ἔξω τοῦ ἀμπελῶνος („warfen ihn aus dem Weinberg hinaus“) und ἀπέκτειναν („töteten ihn“). Insbesondere wird die für Matthäus charakteristische Abfolge Hinauswerfen, dann Töten nicht an die Parallelberichte angeglichen. „Ergriffen“ ist im Kontext der gewaltsamen Handlung eine vertretbare, idiomatische Konkretisierung von λαμβάνω, ohne eine Festnahme im technischen Sinn zu behaupten.'
