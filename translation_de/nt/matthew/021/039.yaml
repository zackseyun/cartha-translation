  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: de
  text: Und sie ergriffen ihn, warfen ihn aus dem Weinberg hinaus und töteten ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες (λαμβάνω)
  choice: sie ergriffen ihn
  rationale: Das Aoristpartizip bezeichnet hier die erste Handlung in der Abfolge. „Ergriffen“ ist im gewaltsamen Erzählzusammenhang natürlich, ohne die stärkere Deutung „nahmen ihn fest“ ausdrücklich einzutragen.
- source_word: ἐξέβαλον (ἐκβάλλω)
  choice: warfen ihn … hinaus
  rationale: Die Form bezeichnet ein gewaltsames Hinausbefördern. Zusammen mit ἔξω τοῦ ἀμπελῶνος gibt „aus dem Weinberg hinauswerfen“ die Bewegung klar und idiomatisch wieder.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: aus dem Weinberg hinaus
  rationale: Die Wendung markiert die Bewegung aus dem Weinberg nach draußen; die deutsche Konstruktion verbindet Ausgangspunkt und Richtung natürlich.
- source_word: ἀμπελῶνος (ἀμπελών)
  choice: Weinberg
  rationale: „Weinberg“ ist die präzise und übliche deutsche Entsprechung im Kontext dieses Gleichnisses.
- source_word: ἀπέκτειναν (ἀποκτείνω)
  choice: töteten ihn
  rationale: „Töten“ gibt das Verb direkt wieder. „Ermordeten“ würde die moralische und rechtliche Bewertung stärker explizieren, als es das griechische Verb allein tut.
theological_decisions:
- issue: Reihenfolge von Hinauswerfen und Töten im Verhältnis zu den Parallelberichten
  choice: Der Sohn wird zuerst aus dem Weinberg hinausgeworfen und danach getötet.
  alternative: Die Reihenfolge an Markus und Lukas angleichen oder offenlassen.
  rationale: 'Matthäus nennt die Handlungen ausdrücklich in dieser Reihenfolge: ἐξέβαλον … καὶ ἀπέκτειναν. Die Übersetzung bewahrt den eigenen Wortlaut des Berichts, statt ihn mit den Parallelstellen zu harmonisieren.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reihung der drei Handlungen und das einleitende „Und“ spiegeln den nüchternen, fortlaufenden Erzählstil des griechischen Textes.
