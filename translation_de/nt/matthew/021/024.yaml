  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: de
  text: 'Jesus aber antwortete ihnen: „Auch ich will euch eine Frage stellen.[a] Wenn ihr sie mir beantwortet, werde auch ich euch sagen, mit welcher Vollmacht ich diese Dinge tue.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „eine Sache“, wörtlicher „ein Wort“; das griechische λόγον ἕνα kann eine Frage oder einen zur Erörterung stehenden Gegenstand bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jesus aber antwortete ihnen
  rationale: Die Verbindung aus Partizip und Redeverb ist eine geläufige griechische Erzählformel. Die deutsche Wiedergabe vermeidet eine schwerfällige Verdopplung wie „antwortete und sagte“, bewahrt aber Antwortcharakter und leichten Kontrast.
- source_word: Ἐρωτήσω
  choice: ich will … stellen
  rationale: Das Futur kündigt Jesu Gegenfrage an. Zusammen mit „eine Frage“ ist „eine Frage stellen“ die natürliche moderne deutsche Formulierung.
- source_word: κἀγὼ
  choice: Auch ich
  rationale: 'Die Krasis aus καί und ἐγώ betont die Gegenseitigkeit: Wie Jesus befragt wurde, stellt nun auch er eine Frage.'
- source_word: λόγον ἕνα
  choice: eine Frage
  rationale: λόγος kann „Wort“, „Sache“ oder einen Gesprächsgegenstand bezeichnen. Im vorliegenden Frage-Antwort-Zusammenhang gibt „eine Frage“ die gemeinte Funktion klar und idiomatisch wieder, während die Fußnote die weitere Bedeutungsbreite offenhält.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Wenn ihr sie mir beantwortet
  rationale: Wörtlich steht etwa „die, wenn ihr sie mir sagt“. Gemeint ist, Jesus die verlangte Antwort zu geben; „beantwortet“ ist im Deutschen natürlich und bewahrt die Bedingung.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: werde auch ich euch sagen
  rationale: Die Stellung von „auch ich“ spiegelt die wiederholte Gegenseitigkeit des griechischen κἀγώ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: in welcher Vollmacht
  rationale: ἐξουσία bezeichnet hier die Befugnis oder autorisierte Macht, auf deren Grundlage Jesus handelt. „Vollmacht“ ist im Deutschen prägnant und im biblischen Kontext verständlich; „in welcher“ bewahrt die griechische Konstruktion ohne Bedeutungsverlust.
- source_word: ταῦτα ποιῶ
  choice: ich diese Dinge tue
  rationale: Die Übersetzung bewahrt den Plural des Demonstrativpronomens und den allgemein auf Jesu umstrittene Handlungen bezogenen Präsens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der wechselseitigen Struktur des Griechischen, bleibt aber mündlich verständlich. „Vollmacht“ wurde gegenüber „Autorität“ gewählt, weil es sowohl Befugnis als auch wirksame Handlungsgewalt ausdrückt.
