  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: de
  text: Die meisten aus der Menge breiteten ihre Gewänder[a] auf der Straße aus; andere schnitten Zweige von den Bäumen ab und breiteten sie auf der Straße aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Obergewänder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Der größte Teil der Menge
  rationale: πλεῖστος mit dem Kollektivbegriff ὄχλος bezeichnet hier den größten Teil beziehungsweise die Mehrheit der Menge. Die Wiedergabe ist präzise und natürlich; δέ markiert lediglich den Fortgang der Erzählung und braucht hier kein eigenes deutsches Wort.
- source_word: ἔστρωσαν
  choice: breitete … aus
  rationale: στρώννυμι bezeichnet das Ausbreiten oder Auslegen auf einer Fläche. Das Präteritum entspricht der erzählenden Vergangenheitsform im Deutschen.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: seine Obergewänder
  rationale: ἱμάτια meint hier Kleidungsstücke, besonders die äußeren Gewänder. Das Possessivpronomen gibt ἑαυτῶν im Deutschen idiomatisch wieder; beim kollektiven Singular „Menge“ steht „seine“.
- source_word: ἐν τῇ ὁδῷ
  choice: auf der Straße
  rationale: Bei Gegenständen, die auf der Oberfläche eines Verkehrswegs ausgebreitet werden, ist „auf der Straße“ die natürliche deutsche Ortsangabe.
- source_word: ἄλλοι δὲ
  choice: andere
  rationale: Die Wendung führt eine weitere Gruppe ein. Im Deutschen genügt nach dem Semikolon „andere“; ein ausdrücklich adversatives „aber“ wäre zu stark.
- source_word: ἔκοπτον κλάδους ἀπὸ τῶν δένδρων
  choice: schnitten Zweige von den Bäumen ab
  rationale: Das Imperfekt stellt die Handlung als im Verlauf befindlich dar; das deutsche Präteritum trägt dies im Erzählzusammenhang natürlich. „abschneiden“ gibt die Trennung der Zweige von den Bäumen klar wieder.
- source_word: καὶ ἐστρώννυον ἐν τῇ ὁδῷ
  choice: und breiteten sie auf der Straße aus
  rationale: Die Wiederholung von στρώννυμι und ἐν τῇ ὁδῷ wird entsprechend dem griechischen Text beibehalten; „sie“ macht den Bezug auf die Zweige deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Obergewänder“ ist im biblisch-antiken Kontext genauer als das allgemeinere „Kleider“, bleibt aber ohne konfessionelle Sonderprägung. Die im Griechischen wiederholte Wendung „auf der Straße“ wurde bewusst erhalten.
