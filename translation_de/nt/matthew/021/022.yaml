  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: de
  text: Und alles, worum ihr im Gebet im Glauben bittet,[a] werdet ihr empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »als Glaubende«; auch: »während ihr glaubt« oder »im Vertrauen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: alles, worum
  rationale: Die Verbindung von πᾶς und ὅσος bezeichnet umfassend »alles, was« bzw. »was auch immer«. Mit dem von αἰτέω geforderten deutschen Anschluss ist »alles, worum« natürlich und präzise.
- source_word: ἂν αἰτήσητε
  choice: ihr bittet
  rationale: ἄν mit dem Aorist Konjunktiv steht in einem unbestimmten Relativsatz. Das schlichte Präsens »ihr bittet« gibt dies im Deutschen idiomatisch wieder; eine Formulierung wie »worum ihr auch bitten mögt« wäre unnötig schwerfällig.
- source_word: ἐν τῇ προσευχῇ
  choice: im Gebet
  rationale: Die Präpositionalwendung bezeichnet den Zusammenhang bzw. Vollzug des Betens. »Im Gebet« bewahrt die nominale Form und entspricht einem natürlichen, würdigen deutschen Sprachgebrauch.
- source_word: πιστεύοντες
  choice: im Glauben
  rationale: Das präsentische Partizip beschreibt die Bittenden als Glaubende und verbindet den Glauben zeitlich und sachlich mit ihrem Beten. »Im Glauben« ist im Deutschen natürlicher als das wörtliche, aber unbeholfene »glaubend« und vermeidet einen ausdrücklich konditionalen Nebensatz.
- source_word: λήμψεσθε
  choice: werdet ihr empfangen
  rationale: Das Futur von λαμβάνω wird angemessen mit »werdet ihr empfangen« wiedergegeben. »Empfangen« wahrt den gehobenen, aber allgemein verständlichen biblischen Sprachton.
theological_decisions:
- issue: Verhältnis von Glauben und erhörtem Gebet
  choice: Das Partizip wird mit »im Glauben« wiedergegeben und unmittelbar mit dem Bitten verbunden.
  alternative: »wenn ihr glaubt« oder »sofern ihr glaubt«
  rationale: Der griechische Text verknüpft Gebet und Glauben deutlich, formuliert jedoch keinen ausdrücklichen Bedingungssatz. »Im Glauben« bewahrt diese Verbindung, ohne die Aussage zu einer stärker ausformulierten theologischen Bedingung umzudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung hält die umfassende Zusage zusammen und vermeidet sowohl ein unnatürliches deutsches Partizip als auch eine stärker konditionale Auslegung des griechischen Wortlauts.
