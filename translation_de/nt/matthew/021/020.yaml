  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: de
  text: 'Als die Jünger das sahen, staunten sie und sagten: »Wie konnte der Feigenbaum so schnell verdorren?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Als … das sahen
  rationale: Der Aoristpartizip wird als temporaler Nebensatz wiedergegeben. Das im Deutschen nötige Objekt »das« nimmt das zuvor berichtete Geschehen am Feigenbaum auf.
- source_word: ἐθαύμασαν
  choice: staunten sie
  rationale: θαυμάζω bezeichnet hier erstauntes Verwundern; »staunen« ist natürlich, gegenwärtig und wahrt den erzählerischen Ton.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das begleitende Partizip wird im Deutschen idiomatisch als koordinierte Redeeinleitung ausgedrückt.
- source_word: Πῶς
  choice: Wie konnte
  rationale: Die Frage gilt dem überraschenden Zustandekommen des Geschehens. »Wie konnte« gibt die Verwunderung idiomatisch wieder, ohne eine bestimmte Ursache festzulegen.
- source_word: παραχρῆμα
  choice: so plötzlich
  rationale: Das Adverb bezeichnet unmittelbares beziehungsweise augenblickliches Eintreten. Im Zusammenhang der erstaunten Frage bringt »so plötzlich« Zeitnähe und Überraschung natürlich zum Ausdruck.
- source_word: ἐξηράνθη
  choice: verdorren
  rationale: Der Aorist Passiv von ξηραίνω beschreibt, dass der Baum dürr beziehungsweise vertrocknet wurde; bei einem Baum ist »verdorren« die natürliche deutsche Entsprechung. Das Passiv ist im Deutschen beim intransitiven Zustandswechsel nicht eigens markiert.
- source_word: ἡ συκῆ
  choice: der Feigenbaum
  rationale: συκῆ bezeichnet eindeutig einen Feigenbaum; der bestimmte Artikel wird beibehalten.
