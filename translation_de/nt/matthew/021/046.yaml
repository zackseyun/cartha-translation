id: MAT.21.46
reference: Matthew 21:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: de
  text: Sie wollten ihn festnehmen, fürchteten sich aber vor den Menschenmengen, weil diese ihn für einen Propheten hielten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: sie wollten
  rationale: Das Präsenspartizip bezeichnet hier ihre fortdauernde Absicht. Zusammen mit dem adversativen „aber“ wird der aus dem Zusammenhang hervorgehende Gegensatz zur Furcht natürlich wiedergegeben.
- source_word: κρατῆσαι
  choice: ihn festnehmen
  rationale: Im feindseligen erzählerischen Zusammenhang meint κρατέω das gewaltsame Ergreifen beziehungsweise die Festnahme Jesu, nicht bloß eine körperliche Berührung.
- source_word: ἐφοβήθησαν
  choice: fürchteten sich
  rationale: Die schlichte Vergangenheitsform gibt den Aorist wieder, ohne unnötig einen Beginn der Furcht einzutragen.
- source_word: τοὺς ὄχλους
  choice: vor den Menschenmengen
  rationale: Der Plural wird bewahrt; „Menschenmengen“ ist im modernen Deutsch verständlich und bezeichnet die versammelten Gruppen der Bevölkerung.
- source_word: ἐπεὶ
  choice: weil
  rationale: Die Konjunktion führt den Grund für ihre Furcht ein.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: diese ihn für einen Propheten hielten
  rationale: „Jemanden für etwas halten“ ist die natürliche deutsche Entsprechung der idiomatischen Konstruktion. „Diese“ macht deutlich, dass die Menschenmengen, nicht Jesu Gegner, das Subjekt sind.
theological_decisions:
- issue: Wie die Einschätzung Jesu als προφήτην wiederzugeben ist, ohne weitergehende christologische Aussagen einzutragen oder auszuschließen
  choice: ihn für einen Propheten hielten
  alternative: ihn als Propheten ansahen
  rationale: Der Vers berichtet die Wahrnehmung der Menschenmengen. Die Formulierung bleibt bei dieser Erzählperspektive und behauptet weder, Jesus sei ausschließlich ein Prophet, noch löst sie seine Identität über den Vers hinaus auf.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstruktur macht den Gegensatz zwischen Festnahmeabsicht und Furcht deutlich; das Demonstrativpronomen verhindert eine missverständliche Zuordnung des Subjekts im Begründungssatz.
