  variant: modern standard German
source:
  edition: SBLGNT
  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: de
  text: Da gingen die Jünger hin und taten, wie Jesus ihnen aufgetragen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befohlen hatte“. Das griechische Verb kann sowohl das Erteilen eines Befehls als auch einer verbindlichen Anweisung bezeichnen; hier passt „aufgetragen“ zu den vorausgehenden konkreten Anweisungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες δὲ
  choice: Da gingen … hin
  rationale: Das Aoristpartizip bezeichnet die der nächsten Handlung vorausgehende Bewegung; δέ führt die Erzählung fort. Die deutsche Formulierung gibt den Handlungsablauf natürlich wieder und knüpft zugleich an Jesu vorherige Anweisung an.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: „Jünger“ ist im Evangelienkontext die etablierte und sachlich passende Bezeichnung für Jesu Schüler und Anhänger.
- source_word: καὶ ποιήσαντες
  choice: und taten
  rationale: Das koordinierte Aoristpartizip wird im Deutschen idiomatisch als weitere Erzählhandlung wiedergegeben.
- source_word: καθὼς
  choice: wie
  rationale: καθώς drückt hier die Übereinstimmung ihres Handelns mit Jesu Vorgabe aus. Im Deutschen vermittelt „wie“ diese Entsprechung klar; eine Verstärkung durch „genau“ ist möglich, aber nicht erforderlich.
- source_word: συνέταξεν αὐτοῖς
  choice: ihnen aufgetragen hatte
  rationale: συντάσσω kann das Erteilen einer Anweisung oder eines Befehls bezeichnen. „Aufgetragen hatte“ passt zu den konkreten vorausgehenden Anweisungen und bewahrt den verbindlichen Charakter, ohne unnötig militärisch zu klingen. Das Plusquamperfekt macht die zeitliche Vorordnung im Deutschen deutlich.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der artikulierte Eigenname wird im Deutschen gewöhnlich schlicht als „Jesus“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Natürliches, modernes Standarddeutsch mit würdigem Erzählton. Die beiden griechischen Partizipien werden als aufeinanderfolgende finite Handlungen wiedergegeben; die verbindliche, aber kontextuell nicht unnötig harte Nuance von συνέταξεν bleibt erhalten.
