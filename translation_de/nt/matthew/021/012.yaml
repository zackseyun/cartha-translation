  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: de
  text: Und Jesus betrat den Tempelbezirk[a] und trieb alle hinaus, die dort verkauften und kauften. Er stieß die Tische der Geldwechsler um und stieß die Sitze der Taubenverkäufer um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Tempel“ oder „Tempelanlage“; das griechische Wort bezeichnet den größeren Tempelkomplex und nicht speziell das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: Tempelbezirk
  rationale: Das Wort bezeichnet hier den gesamten Tempelkomplex beziehungsweise dessen zugängliche Höfe, nicht speziell das innere Heiligtum (ναός). „Tempelbezirk“ wahrt diese räumliche Unterscheidung.
- source_word: ἐξέβαλεν
  choice: trieb ... hinaus
  rationale: Die Formulierung gibt die entschlossene, gewaltsame Entfernung natürlich und treffend wieder.
- source_word: πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: alle ..., die dort verkauften und kauften
  rationale: „Alle“ bewahrt den ausdrücklichen Umfang von πάντας; der Relativsatz gibt die substantivierten Partizipien in natürlichem Deutsch wieder. „Dort“ nimmt den im griechischen Text wiederholten Ortsbezug auf.
- source_word: τράπεζας
  choice: Tische
  rationale: Die gewöhnliche Bedeutung passt zu den von den Geldwechslern verwendeten Tischen und vermeidet unnötige Spezifizierung.
- source_word: κολλυβιστῶν
  choice: Geldwechsler
  rationale: Der etablierte deutsche Ausdruck bezeichnet Personen, die Münzen beziehungsweise Währungen wechselten.
- source_word: κατέστρεψεν
  choice: stieß ... um
  rationale: Im Zusammenhang mit Tischen und Sitzen bezeichnet das Verb ein Umstürzen, nicht notwendig deren Zerstörung. „Stieß ... um“ ist anschaulich und idiomatisch.
- source_word: καθέδρας
  choice: Sitze
  rationale: „Sitze“ entspricht dem breiten Bedeutungsumfang des griechischen Substantivs, ohne eine bestimmte Möbelart vorauszusetzen.
- source_word: περιστεράς
  choice: Tauben
  rationale: περιστερά kann Tauben einschließlich Turtel- oder Haustauben bezeichnen; „Tauben“ ist im deutschen Opferkontext der natürliche Oberbegriff.
theological_decisions:
- issue: Räumlicher Umfang von ἱερόν
  choice: Jesus betritt den Tempelbezirk, nicht ausdrücklich das innere Heiligtum.
  alternative: Generisch „Tempel“, ohne räumliche Präzisierung.
  rationale: Die Wortwahl wahrt den Unterschied zwischen ἱερόν und ναός und vermeidet die historisch irreführende Vorstellung, die Handelstätigkeit und Jesu Handeln hätten im inneren Heiligtum stattgefunden.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzähldeutsch. Die koordinierte Satzfolge des Griechischen wird zur besseren Lesbarkeit in zwei Sätze gegliedert; sämtliche Handlungen und ihr Umfang bleiben erhalten.
