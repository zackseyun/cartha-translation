  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Satzes zutreffend wieder: Πρωΐ als „Früh am Morgen“, die Rückbewegung εἰς τὴν πόλιν als „in die Stadt zurückkehrte“ und den wahrscheinlich ingressiven Aorist ἐπείνασεν als „bekam er Hunger“. Das gleichzeitig zum Hunger eintretende Zurückkehren wird mit dem als-Satz ausreichend wiedergegeben. Das schwache δέ muss im Deutschen nicht eigens markiert werden.'
  naturalness: „Früh am Morgen, als er in die Stadt zurückkehrte, bekam er Hunger“ ist klares, modernes und würdiges Standarddeutsch. Die Wortstellung ist idiomatisch und der knappe Erzählton des Ausgangstextes bleibt erhalten.
  terminology: Es sind keine fachterminologischen oder namensbezogenen Probleme vorhanden. „Bekam er Hunger“ ist eine natürliche deutsche Wiedergabe, die keine theologische Deutung ergänzt und die Aussage über Jesu tatsächlichen Hunger unmittelbar stehen lässt.
