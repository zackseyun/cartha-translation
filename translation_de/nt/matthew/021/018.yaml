  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: de
  text: Früh am Morgen, als er in die Stadt zurückkehrte, bekam er Hunger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: Früh am Morgen
  rationale: Das Adverb bezeichnet den frühen Teil des Tages. „Früh am Morgen“ ist im modernen Deutschen natürlich und bewahrt die zeitliche Hervorhebung.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ dient hier als schwache narrative Verknüpfung ohne deutlichen Gegensatz. Der deutsche Erzählfluss benötigt an dieser Stelle kein zusätzliches „aber“ oder „nun“.
- source_word: ἐπανάγων
  choice: als er … zurückkehrte
  rationale: Das präsentische Partizip bezeichnet eine Handlung, die gleichzeitig mit dem Hauptgeschehen verläuft. Die Konstruktion mit „als“ gibt dies idiomatisch wieder.
- source_word: εἰς τὴν πόλιν
  choice: in die Stadt
  rationale: εἰς mit Akkusativ bezeichnet die gerichtete Bewegung hinein beziehungsweise hin zu einem Ziel. Im Kontext der Rückkehr nach Jerusalem ist „in die Stadt“ natürlich und präzise.
- source_word: ἐπείνασεν
  choice: bekam er Hunger
  rationale: 'Der Aorist kann hier ingressiv verstanden werden: Der Hunger setzt ein. „Bekam er Hunger“ bringt diesen Ereignischarakter natürlicher zum Ausdruck als „war er hungrig“.'
theological_decisions:
- issue: Christologische Bedeutung von Jesu Hunger
  choice: Jesu Hunger als wirkliche menschliche Erfahrung schlicht wiedergeben
  alternative: Die Aussage abschwächen oder dogmatisch erläutern
  rationale: Der Vers schildert Jesu Hunger unmittelbar als reales menschliches Erleben. Die Übersetzung bewahrt diese Aussage, ohne über den Text hinausgehende dogmatische Erläuterungen einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und erzählerisch; „bekam er Hunger“ ist allgemein verständlich und wahrt den möglichen ingressiven Sinn des griechischen Aorists.
