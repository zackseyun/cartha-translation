id: MAT.6.29
reference: Matthew 6:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: de
  text: 'Doch ich sage euch: Nicht einmal Salomo war in all seiner Pracht gekleidet wie eine von diesen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Doch ich sage euch
  rationale: λέγω mit dem Dativ ὑμῖν wird natürlich mit „ich sage euch“ wiedergegeben. δέ setzt hier einen milden Kontrast zur vorangehenden Betrachtung und wird passend mit „doch“ ausgedrückt.
- source_word: οὐδὲ
  choice: nicht einmal
  rationale: Die Wendung hebt hervor, dass selbst Salomo den Vergleich nicht erreicht.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: in all seiner Pracht
  rationale: δόξα bezeichnet hier im Zusammenhang königlichen Glanz beziehungsweise prächtige äußere Erscheinung. „Pracht“ vermittelt diesen konkreten Sinn im modernen Deutschen klarer als „Herrlichkeit“.
- source_word: περιεβάλετο
  choice: war … gekleidet
  rationale: Die mediale Form bezeichnet hier das Bekleidetsein beziehungsweise die äußere Ausstattung; die passive deutsche Form ist natürlich und bewahrt den Bezug zur Kleidung der Blumen.
- source_word: ὡς ἓν τούτων
  choice: wie eine von diesen
  rationale: Das neutrale Zahlwort ἓν bezieht sich auf die im Kontext genannten Blumen beziehungsweise Lilien. Im Deutschen richtet sich das Pronomen natürlich nach dem erschlossenen femininen Bezugswort „Blume“.
theological_decisions:
- issue: Bedeutung von δόξα bei Salomo
  choice: Pracht
  alternative: Herrlichkeit
  rationale: Gemeint ist Salomos königlicher Glanz, nicht göttliche Herrlichkeit. „Pracht“ wahrt den irdisch-königlichen Sinn, ohne eine zusätzliche theologische Bedeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bekannte Satzstruktur bleibt erkennbar, während „Pracht“ den kontextuellen Sinn von δόξα unmittelbar verständlich ausdrückt.
