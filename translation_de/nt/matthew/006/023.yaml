  source_fidelity: 'Der Text gibt die Struktur und die zentralen Begriffe des griechischen Textes zuverlässig wieder: πονηρός mit dem bewusst weiten »schlecht«, σκοτεινός als »dunkel«, φῶς/σκότος als »Licht/Finsternis« sowie die gesteigerte Schlussfrage zu πόσον. Die Folgerung von οὖν ist mit »nun« und »dann« angemessen erfasst. Die im Griechischen elliptische Schlussform wird idiomatisch ergänzt, ohne den Sinn festzulegen.'
  naturalness: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. »Wenn aber dein Auge schlecht ist« bewahrt die absichtlich körperliche Metapher; »wie groß ist dann die Finsternis!« ist ein natürlicher, nachdrücklicher deutscher Ausruf.
  terminology: Die Terminologie ist konsistent und sachgerecht. Besonders gelungen ist die Beibehaltung von »Licht« und »Finsternis« ohne interpretierende Spiritualisierung. Die Fußnote markiert die semantische und idiomatische Offenheit von πονηρός, einschließlich der im Kontext möglichen Nuance von Geiz beziehungsweise mangelnder Freigebigkeit, ohne diese zur einzigen Lesart zu machen.
