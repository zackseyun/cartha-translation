id: MAT.6.23
reference: Matthew 6:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: de
  text: Wenn aber dein Auge schlecht[a] ist, wird dein ganzer Körper dunkel sein. Wenn nun das Licht in dir Finsternis ist – wie groß ist dann die Finsternis!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »böse« oder »ungesund«; im damaligen Sprachgebrauch kann ein »schlechtes Auge« möglicherweise auch eine geizige oder missgünstige Haltung bezeichnen.'
    reason: Lexikalische und idiomatische Alternativen; die griechische Formulierung πονηρὸς ὀφθαλμός lässt im Zusammenhang mehrere überlappende Nuancen zu.
lexical_decisions:
- source_word: πονηρός
  choice: schlecht
  rationale: Die breite Wiedergabe bewahrt sowohl den möglichen Sinn eines schadhaften beziehungsweise ungesunden Auges als auch moralische und im Kontext möglicherweise geizige oder missgünstige Nuancen, ohne die Metapher einseitig festzulegen.
- source_word: σκοτεινός
  choice: dunkel
  rationale: Das prädikative Adjektiv wird knapp und natürlich wiedergegeben; die Bildsprache bleibt erhalten.
- source_word: φῶς
  choice: Licht
  rationale: Die wörtliche Wiedergabe bewahrt den Gegensatz zur Finsternis und vermeidet eine auslegende Festlegung auf innere, moralische oder geistliche Erkenntnis.
- source_word: σκότος
  choice: Finsternis
  rationale: Die gehobene, aber allgemein verständliche Bezeichnung erhält den starken metaphorischen Gegensatz zu »Licht« und die Wiederholung im Schluss.
- source_word: πόσον
  choice: wie groß
  rationale: Im elliptischen Ausruf bezeichnet πόσον das Ausmaß; »wie groß« gibt die warnende Steigerung im Deutschen natürlich wieder.
- source_word: ὀφθαλμός
  choice: Auge
  rationale: Die körperliche Metapher für Wahrnehmung, Ausrichtung und Haltung wird wörtlich bewahrt.
- source_word: ὅλον τὸ σῶμά σου
  choice: dein ganzer Körper
  rationale: Die Formulierung gibt den totalisierenden Nachdruck von ὅλον klar und idiomatisch wieder.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: das Licht in dir
  rationale: Die knappe Form bleibt nahe am Griechischen und vermeidet die stärker deutende Wiedergabe »dein inneres Licht«.
theological_decisions:
- issue: Bedeutung der Metapher vom schlechten Auge
  choice: Im Haupttext steht das semantisch breite »schlecht«.
  alternative: Möglich sind »böse«, »ungesund« sowie im Licht eines semitischen Idioms und des Zusammenhangs »geizig/missgünstig« beziehungsweise »nicht freigebig«.
  rationale: Matthäus 6,19–24 lässt überlappende Bezüge auf moralische Verkehrtheit, gestörte Wahrnehmung und möglicherweise mangelnde Freigebigkeit zu. Die Übersetzung bewahrt diese Spannung, statt sie im Haupttext auf nur eine Deutung zu reduzieren.
- issue: Elliptischer Schlusssatz τὸ σκότος πόσον
  choice: 'Als Ausruf: »wie groß ist dann die Finsternis!«'
  alternative: 'Wörtlicher und abgebrochener: »die Finsternis – wie groß!«'
  rationale: Die Ergänzung des im Griechischen ausgelassenen Verbs ist im Deutschen für einen natürlichen vollständigen Ausruf erforderlich; »dann« verdeutlicht die folgernde Beziehung von οὖν, ohne den Sinn inhaltlich zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schlecht« hält die zentrale Metapher bewusst offen; »Finsternis« bewahrt die rhetorische Stärke des Gegensatzes. Der Gedankenstrich im zweiten Satz trägt den climaktischen Ausruf, ohne die griechische Ellipse unnatürlich nachzuahmen.
