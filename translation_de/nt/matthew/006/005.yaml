id: MAT.6.5
reference: Matthew 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: de
  text: 'Und wenn ihr betet, sollt ihr nicht wie die Heuchler sein. Denn sie beten gern im Stehen in den Synagogen und an den Ecken der breiten Straßen[a], um von Menschen gesehen zu werden. Amen, ich sage euch: Sie haben ihren Lohn bereits erhalten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den Straßenecken“. Wörtlicher: „an den Ecken der breiten Straßen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie haben ihren Lohn.“ Das griechische Verb kann im Zusammenhang mit einer Zahlung bedeuten, dass man den geschuldeten Betrag erhalten hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: wenn ihr betet
  rationale: Das Deutsche gibt die allgemeine, wiederholt eintretende Situation nach ὅταν mit „wenn“ natürlich wieder.
- source_word: οὐκ ἔσεσθε ὡς
  choice: sollt ihr nicht sein wie
  rationale: Bewahrt die Zukunftsform mit ihrem auffordernden beziehungsweise verbietenden Sinn, ohne altertümlich zu wirken.
- source_word: ὑποκριταί
  choice: Heuchler
  rationale: Die geläufige und kontextgerechte Bezeichnung für Menschen, die Frömmigkeit zur Schau stellen.
- source_word: φιλοῦσιν ... ἑστῶτες προσεύχεσθαι
  choice: sie beten gern im Stehen
  rationale: φιλοῦσιν bezeichnet hier eine Vorliebe; das Partizip ἑστῶτες beschreibt die Körperhaltung beim Beten. Die deutsche Formulierung ist natürlich und wahrt beide Aspekte.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: in den Synagogen
  rationale: Erhält die historische und jüdische Besonderheit des Schauplatzes.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: an den Ecken der breiten Straßen
  rationale: Gibt die konkrete griechische Formulierung relativ eng wieder; die idiomatischere Alternative „an den Straßenecken“ steht in der Fußnote.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: damit die Leute sie sehen
  rationale: Drückt den Zweck klar und natürlich aus; ἀνθρώποις bezeichnet hier Menschen allgemein, nicht ausschließlich Männer.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Bewahrt Jesu markante Einleitungsformel und das semitische Lehnwort, das auch im Deutschen geläufig ist.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: Sie haben ihren Lohn bereits erhalten
  rationale: „Bereits erhalten“ bringt die im Kontext naheliegende Abrechnungsbedeutung von ἀπέχω zum Ausdruck, ohne mit „vollständig“ mehr festzulegen, als der griechische Wortlaut ausdrücklich sagt.
theological_decisions:
- issue: Generische Bedeutung von ἀνθρώποις
  choice: Leute
  alternative: Menschen; Männer
  rationale: Gemeint sind menschliche Beobachter allgemein. „Leute“ ist im Satz natürlich und vermeidet eine irreführende Beschränkung auf männliche Personen.
- issue: Tragweite der Aussage über den Lohn
  choice: Sie haben ihren Lohn bereits erhalten
  alternative: Sie haben ihren Lohn; sie haben ihren Lohn vollständig erhalten
  rationale: 'Die Formulierung wahrt den ernsten Gegensatz: Die öffentliche Anerkennung ist der schon empfangene Lohn. Sie macht jedoch nicht ausdrücklich „vollständig“ zum Bestandteil des Textes, da dies eine kontextuelle Nuance des Verbs und kein eigenständiges griechisches Wort ist.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. „Amen, ich sage euch“ erhält die charakteristische Formel Jesu; Satzbau und Wortwahl bleiben für heutige Leserinnen und Leser klar.
