id: MAT.6.8
reference: Matthew 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: de
  text: Darum werdet ihnen nicht gleich; denn euer Vater weiß, was ihr braucht, bevor ihr ihn bittet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Darum … nicht
  rationale: „Darum“ gibt den folgernden Zusammenhang mit der vorausgehenden Warnung wieder; die Verneinung bildet zusammen mit dem Verb das Verbot.
- source_word: ὁμοιωθῆτε
  choice: werdet … gleich
  rationale: Der Aorist Passiv Konjunktiv steht in einem Verbot. „Werdet ihnen nicht gleich“ ist im Deutschen natürlich und bewahrt gegenüber dem bloßen „seid nicht wie sie“ den Gedanken einer Angleichung.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Das Pronomen verweist auf die unmittelbar zuvor genannten Menschen; eine erläuternde Ergänzung ist nicht nötig.
- source_word: οἶδεν
  choice: weiß
  rationale: οἶδα hat trotz seiner Perfektform präsentische Bedeutung; „weiß“ ist die genaue und idiomatische Wiedergabe.
- source_word: ὁ πατὴρ ὑμῶν
  choice: euer Vater
  rationale: Der griechische Text sagt schlicht „euer Vater“; „himmlischer“ wird nicht ergänzt.
- source_word: ὧν χρείαν ἔχετε
  choice: was ihr braucht
  rationale: Die Wendung bezeichnet den Inhalt des Bedürfnisses. „Was ihr braucht“ ist präzise und in modernem Deutsch natürlich.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: bevor ihr ihn bittet
  rationale: πρὸ τοῦ mit Infinitiv bezeichnet Vorzeitigkeit. „Ihn bitten“ gibt αἰτέω mit persönlichem Objekt idiomatisch wieder.
theological_decisions:
- issue: Göttliches Vorwissen im Verhältnis zum Gebet
  choice: Die vorherige Kenntnis des Vaters von den Bedürfnissen der Jünger wird ohne erklärenden Zusatz wiedergegeben.
  alternative: Eine deutende Paraphrase, nach der Gebet der Beziehung und nicht der Information diene, oder eine dogmatische Ausformulierung umfassenden Vorwissens.
  rationale: Der Vers stellt das Wissen des Vaters vor der Bitte fest, erklärt aber nicht, weshalb dennoch gebetet werden soll. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des griechischen Textes bleibt gewahrt; ein Fußnotenmarker ist nicht erforderlich, da „werdet ihnen nicht gleich“ sowohl verständlich als auch nah an der Formulierung des Ausgangstextes ist.
