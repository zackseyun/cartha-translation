  source_fidelity: Die Übersetzung gibt den kontrastierenden, temporal gefassten Genitivus absolutus (»Wenn du aber …«), ἐλεημοσύνη als Gabe für Bedürftige und die personifizierende Aufforderung bezüglich linker und rechter Hand sachgerecht wieder. Das ergänzte »etwas« macht die im deutschen Verb »geben« regelmäßig erforderliche Gabe explizit, ohne den Sinn einzuengen.
  naturalness: »Wenn du aber den Bedürftigen etwas gibst« ist modernes, verständliches Standarddeutsch. Auch »soll deine linke Hand nicht wissen« ist als bildhafte Aufforderung idiomatisch und bewahrt den würdevollen Registerton. Die Auslassung des zweiten »Hand« in »was deine rechte tut« ist im Deutschen natürlich und eindeutig.
  terminology: »Bedürftigen etwas gibst« trifft im Kontext die Bedeutung von ἐλεημοσύνη als mildtätigem Geben an Arme bzw. Bedürftige. Die Fußnote dokumentiert mit »Almosen« und »Almosen gibst« die engere lexikalische Formulierung, ohne den Haupttext unnötig altertümlich zu machen.
