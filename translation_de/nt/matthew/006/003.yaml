id: MAT.6.3
reference: Matthew 6:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: de
  text: Wenn du aber den Bedürftigen etwas gibst,[a] soll deine linke Hand nicht wissen, was deine rechte tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wenn du ein Almosen gibst« oder »wenn du Almosen gibst«; das griechische Wort bezeichnet mildtätiges Geben an Arme und Bedürftige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Wenn du aber … gibst
  rationale: Der Genitivus absolutus bezeichnet die begleitende Situation; δέ setzt einen Kontrast zum zuvor beschriebenen Verhalten. Im Deutschen ist die konditional-temporale Formulierung idiomatisch.
- source_word: ἐλεημοσύνην
  choice: den Bedürftigen etwas gibst
  rationale: Das Wort bezeichnet hier eine mildtätige Gabe beziehungsweise das Almosengeben. Die gewählte Formulierung ist modern und verständlich; eine Fußnote bewahrt die engere lexikalische Alternative.
- source_word: μὴ γνώτω
  choice: soll … nicht wissen
  rationale: Der verneinte Imperativ der dritten Person wird als Aufforderung wiedergegeben und erhält zugleich die anschauliche Personifikation der Hand.
- source_word: ἡ ἀριστερά σου
  choice: deine linke Hand
  rationale: Die direkte Wiedergabe bewahrt das einprägsame Bild und den Parallelismus.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: was deine rechte tut
  rationale: Die elliptische deutsche Form vermeidet eine unnötige Wiederholung von »Hand« und gibt das Präsens ποιεῖ natürlich wieder.
theological_decisions:
- issue: Deutung des Bildes von der linken und rechten Hand
  choice: Das Bild wird unverändert als zugespitzte Aufforderung zu verborgenem, nicht auf Selbstdarstellung zielendem Geben bewahrt.
  alternative: Das Bild ausdrücklich als allgemeine Demut oder als ausnahmsloses Verbot jeder öffentlich sichtbaren Wohltätigkeit auslegen.
  rationale: Die Übersetzung erhält Personifikation und Übertreibung, ohne deren Reichweite durch eine dogmatische Paraphrase enger oder weiter festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Bedürftigen etwas geben« ist allgemein verständlicher als das heute teils altertümlich oder institutionell klingende »Almosen geben«; die traditionelle Form bleibt in der Fußnote erhalten.
