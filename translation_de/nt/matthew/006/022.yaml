source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: de
  text: Das Auge ist die Lampe des Körpers. Wenn nun dein Auge gesund[a] ist, wird dein ganzer Körper voller Licht sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einfach“, „ungeteilt“, „klar“ oder „gesund“; das griechische Wort kann je nach Zusammenhang auch „großzügig“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: Lampe
  rationale: Das Wort bezeichnet gewöhnlich eine konkrete Lampe, nicht Licht im abstrakten Sinn; so bleibt das Bild vom Auge als Lichtquelle des Körpers erhalten.
- source_word: σῶμα
  choice: Körper
  rationale: Die übliche und im körperlichen Bild unmittelbar verständliche Wiedergabe.
- source_word: ὀφθαλμός
  choice: Auge
  rationale: Die wörtliche Wiedergabe trägt sowohl das körperliche Bild als auch dessen übertragene Bedeutung.
- source_word: ἐὰν οὖν
  choice: Wenn nun
  rationale: „Nun“ bewahrt die folgernde Verbindung, während „wenn“ die Bedingung natürlich einleitet.
- source_word: ἁπλοῦς
  choice: gesund
  rationale: Im unmittelbaren Bild von Auge, Licht und Körper bezeichnet „gesund“ verständlich ein richtig funktionierendes Auge. Die weiteren möglichen Bedeutungsnuancen werden in der Fußnote offengehalten.
- source_word: ὅλον
  choice: ganzer
  rationale: Gibt den umfassenden Sinn natürlich und vollständig wieder.
- source_word: φωτεινόν
  choice: licht
  rationale: „Licht sein“ bewahrt die Prädikatsform und das Beleuchtungsbild des griechischen Ausdrucks; es ist würdevoll und im modernen Deutsch verständlich.
- source_word: ἔσται
  choice: wird ... sein
  rationale: Bewahrt ausdrücklich das Futur des griechischen Textes.
theological_decisions:
- issue: Bedeutung von ἁπλοῦς im Bild vom Auge
  choice: Im Haupttext „gesund“
  alternative: „einfach“, „ungeteilt“, „klar“ oder „lauter“; je nach Zusammenhang kann das Wort auch „großzügig“ bedeuten
  rationale: Der direkte Gegensatz zum schlechten Auge im folgenden Vers und das Bild körperlicher Beleuchtung sprechen hier zunächst für ein richtig funktionierendes Auge. Da ἁπλοῦς zugleich die Vorstellung von Einfachheit beziehungsweise Ungeteiltheit und in anderen Zusammenhängen Großzügigkeit tragen kann, werden diese Deutungsmöglichkeiten nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Licht sein“ erhält die Bildsprache enger als die idiomatischere Erweiterung „voller Licht sein“; die Mehrdeutigkeit von ἁπλοῦς wird durch die Fußnote sichtbar gehalten.
