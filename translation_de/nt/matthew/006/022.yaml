    rationale: Das deutsche Adjektiv „licht“ wird heute häufig etwa von schütterem Bewuchs gebraucht und ist als Prädikat für einen Körper nicht die natürliche Entsprechung von φωτεινόν. „Voller Licht sein“ bewahrt die Aussage von Erfüllung mit Licht und ist klar verständlich.
  - severity: low
    issue: „lauter“ in der Fußnote ist im modernen Deutsch unklar
    rationale: Die Fußnote soll lexikalische Alternativen verständlich offenhalten. „lauter“ wird gegenwärtig meist adverbial oder im Sinn von Geräuschstärke verstanden; „gesund“ bzw. „unversehrt“ erläutert die im Kontext relevante Nuance verständlicher.
