base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: de
  text: 'Darum macht euch keine Sorgen[a] und sagt nicht: »Was werden wir essen?« oder: »Was werden wir trinken?« oder: »Was werden wir anziehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seid nicht beunruhigt.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Darum macht euch keine Sorgen
  rationale: οὖν kennzeichnet die Folgerung aus dem Vorangehenden und wird natürlich mit »Darum« wiedergegeben. μεριμνάω bezeichnet hier die sorgenvoll-ängstliche Beschäftigung mit den materiellen Bedürfnissen; »sich Sorgen machen« ist im heutigen Deutsch idiomatisch und bewahrt den verneinten Aufforderungscharakter.
- source_word: λέγοντες
  choice: und sagt nicht
  rationale: Das Partizip benennt, wie beziehungsweise worin sich das Sorgen äußert. Die finite koordinierte Wiedergabe ist im Deutschen natürlich; das ergänzte »nicht« erstreckt die vorangehende Verneinung sinngemäß auf die folgenden Fragen.
- source_word: Τί
  choice: Was
  rationale: τί leitet jeweils eine direkte Frage nach dem Lebensnotwendigen ein; »Was« entspricht dem schlicht und idiomatisch.
- source_word: φάγωμεν
  choice: sollen wir essen
  rationale: Der deliberative Aorist Konjunktiv fragt besorgt nach dem künftig verfügbaren Essen. Das deutsche »sollen wir« gibt diese fragende Ungewissheit natürlicher wieder als ein bloßes Futur.
- source_word: πίωμεν
  choice: sollen wir trinken
  rationale: Wie bei φάγωμεν wird der deliberative Konjunktiv als besorgte Frage nach künftiger Versorgung mit »sollen wir« wiedergegeben.
- source_word: περιβαλώμεθα
  choice: sollen wir anziehen
  rationale: περιβάλλω bezeichnet hier das Anlegen von Kleidung. »Was sollen wir anziehen?« ist die natürliche moderne deutsche Entsprechung, ohne die reflexive griechische Form hölzern nachzubilden.
- source_word: ἤ ... ἤ ... ἤ
  choice: oder ... oder ... oder
  rationale: Die wiederholte Disjunktion und damit die dreigliedrige Reihe besorgter Fragen bleibt erhalten.
theological_decisions:
- issue: Reichweite des Verbots im Blick auf materielle Bedürfnisse
  choice: μεριμνήσητε wird als Verbot sorgenvoller, ängstlicher Beschäftigung wiedergegeben, nicht als generelles Verbot verantwortlicher Vorsorge.
  alternative: »Seid überhaupt nicht besorgt« beziehungsweise eine Formulierung, die jede vorausschauende Planung ausschließt.
  rationale: Der unmittelbare Zusammenhang handelt von bedrängender Sorge um Gottes Versorgung. »Macht euch keine Sorgen« wahrt die Aussagekraft, ohne eine über den Text hinausgehende Absage an verantwortliches Planen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die drei direkten Fragen und ihre parallele Struktur bleiben deutlich hörbar; der Doppelpunkt und deutsche Anführungszeichen sorgen für flüssige Lesbarkeit.
