  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: de
  text: Gib uns heute unser tägliches Brot[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unser Brot für heute«, »unser Brot für den kommenden Tag« oder »das Brot, das wir brauchen«. Das griechische Adjektiv ἐπιούσιον ist selten, und seine genaue Bedeutung ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: Brot
  rationale: ἄρτος bezeichnet wörtlich »Brot« und kann darüber hinaus Nahrung oder Lebensunterhalt meinen. Das konkrete Bild bleibt im Haupttext erhalten.
- source_word: ἡμῶν
  choice: unser
  rationale: Der Genitiv bezeichnet hier eindeutig den Besitz beziehungsweise die Zugehörigkeit und modifiziert »Brot«.
- source_word: ἐπιούσιον
  choice: tägliches
  rationale: Das seltene Adjektiv ἐπιούσιος ist in seiner genauen Bedeutung umstritten. »Täglich« ist die im Deutschen vertraute und im Zusammenhang gut verständliche Wiedergabe, ohne die Bitte unnötig einzuengen; wichtige Alternativen werden in der Fußnote genannt.
- source_word: δὸς
  choice: Gib
  rationale: Der Aorist-Imperativ von δίδωμι wird direkt und idiomatisch mit »Gib« wiedergegeben.
- source_word: ἡμῖν
  choice: uns
  rationale: Das Dativpronomen bezeichnet die Empfänger der erbetenen Gabe.
- source_word: σήμερον
  choice: heute
  rationale: σήμερον bedeutet »heute«; diese natürliche moderne Formulierung bewahrt den zeitlichen Bezug.
theological_decisions:
- issue: Bedeutung von ἐπιούσιον im Vaterunser
  choice: tägliches
  alternative: für heute; für den kommenden Tag; das Brot, das wir brauchen
  rationale: ἐπιούσιος kann sich auf den gegenwärtigen oder kommenden Tag oder auf das zum Leben nötige Brot beziehen. »Täglich« bewahrt die vertraute Bitte um fortwährende Versorgung, während die Fußnote die echte lexikalische und theologische Spannung offenhält.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die traditionelle Wendung »tägliches Brot« bleibt erhalten; die genuine Mehrdeutigkeit von ἐπιούσιον wird nicht im Haupttext aufgelöst, sondern in der Fußnote transparent gemacht.
