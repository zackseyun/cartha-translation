id: MAT.6.25
reference: Matthew 6:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: de
  text: 'Darum sage ich euch: Macht euch keine Sorgen um euer Leben[a], was ihr essen sollt, und auch nicht um euren Körper, was ihr anziehen sollt. Ist nicht das Leben mehr als die Nahrung und der Körper mehr als die Kleidung?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Seele“. Das griechische Wort ψυχή kann „Seele“ oder „Leben“ bedeuten; der Zusammenhang mit Essen und Kleidung spricht hier für „Leben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der unmittelbar vorausgehenden Lehre und ist im modernen Deutsch knapp und natürlich.
- source_word: μεριμνᾶτε
  choice: Macht euch keine Sorgen
  rationale: Das Verb bezeichnet hier sorgenvoll-ängstliches Beschäftigtsein. Die Formulierung ist allgemein verständlich und verbietet nicht jede verantwortliche Vorsorge.
- source_word: ψυχῇ / ψυχὴ
  choice: Leben
  rationale: Im Zusammenhang mit Essen und leiblicher Versorgung bezeichnet ψυχή das Leben beziehungsweise die lebende Person, nicht eindeutig eine vom Körper getrennte Seele.
- source_word: τί φάγητε
  choice: was ihr essen sollt
  rationale: Der Aorist Konjunktiv steht in einer zukunftsbezogenen indirekten Frage. Diese deutsche Wendung gibt die besorgte Frage nach der nötigen Nahrung idiomatisch wieder.
- source_word: σώματι / σῶμα
  choice: Körper
  rationale: Gemeint ist der physische Körper im Verhältnis zur Kleidung.
- source_word: τί ἐνδύσησθε
  choice: was ihr anziehen sollt
  rationale: Gibt die zukunftsbezogene Sorge um Bekleidung in natürlichem Deutsch wieder.
- source_word: οὐχὶ
  choice: Ist nicht
  rationale: Leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet.
- source_word: πλεῖόν
  choice: mehr als
  rationale: Bewahrt den offenen Vergleich, ohne ihn durch eine ausdrückliche Wertung wie „wertvoller“ enger festzulegen.
- source_word: τροφῆς
  choice: Nahrung
  rationale: Bezeichnet das, was das Leben ernährt; „Nahrung“ bildet einen passenden allgemeinen Gegenbegriff zu „Leben“.
- source_word: ἐνδύματος
  choice: Kleidung
  rationale: Allgemeiner Ausdruck für das, womit der Körper bekleidet wird, und im modernen Deutsch natürlicher als „Gewand“.
theological_decisions:
- issue: Bedeutung von ψυχή in Jesu Lehre
  choice: Als „Leben“ wiedergegeben
  alternative: „Seele“
  rationale: Der unmittelbare Zusammenhang handelt von Essen, Körper und Kleidung. Daher bezeichnet ψυχή hier am ehesten das irdische Leben beziehungsweise die Person als Lebewesen. Die Fußnote erhält die weiter gefasste lexikalische Möglichkeit, ohne eine bestimmte Leib-Seele-Lehre in den Vers einzutragen.
- issue: Reichweite des Verbots von μεριμνάω
  choice: Als Verbot sorgenvoll-ängstlichen Sich-Sorgens formuliert
  alternative: „Sorgt nicht“
  rationale: „Macht euch keine Sorgen“ verdeutlicht, dass es um belastende Sorge geht, und vermeidet den möglichen Eindruck, verantwortliche Fürsorge oder Vorsorge werde grundsätzlich untersagt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Plural bleibt erhalten. Der parallele Satzbau des griechischen Textes wird weitgehend bewahrt; „Macht euch keine Sorgen“ ist gegenüber dem knapperen „Sorgt euch nicht“ eindeutiger und alltagssprachlich zugänglich.
