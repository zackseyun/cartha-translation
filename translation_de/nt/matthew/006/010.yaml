source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: de
  text: Dein Reich komme. Dein Wille geschehe[a], wie im Himmel, so auch auf der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Dein Reich komme; dein Wille geschehe, wie im Himmel, so auch auf der Erde“, wobei „wie im Himmel, so auch auf der Erde“ auf beide Bitten bezogen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: komme
  rationale: Der Aoristimperativ der dritten Person formuliert eine an Gott gerichtete Bitte. Die im Deutschen etablierte Gebetsform „Dein Reich komme“ gibt diese Kraft knapp und würdig wieder.
- source_word: βασιλεία
  choice: Reich
  rationale: βασιλεία kann sowohl Gottes Königsherrschaft als auch sein Reich bezeichnen. „Reich“ ist in diesem Gebetskontext natürlich und traditionsnah, ohne den Aspekt seiner Herrschaft auszuschließen.
- source_word: γενηθήτω
  choice: geschehe
  rationale: Der Aorist Passiv Imperativ von γίνομαι bedeutet zusammen mit θέλημα sinngemäß, dass Gottes Wille Wirklichkeit werden soll. „Geschehe“ bewahrt die Gebetsform und entspricht dem griechischen Ausdruck prägnant.
- source_word: θέλημα
  choice: Wille
  rationale: θέλημα bezeichnet das, was jemand will, wünscht oder beabsichtigt. „Wille“ erhält die lexikalische Breite und das theologische Gewicht, ohne den Sinn unnötig einzuengen.
- source_word: ὡς
  choice: wie
  rationale: ὡς leitet einen Vergleich ein. „Wie“ bildet diesen knapp und offen ab.
- source_word: ἐν οὐρανῷ
  choice: im Himmel
  rationale: Der Singular mit ἐν bezeichnet hier den himmlischen Bereich. „Im Himmel“ ist die natürliche deutsche Entsprechung.
- source_word: καὶ ἐπὶ γῆς
  choice: so auch auf der Erde
  rationale: καί vervollständigt in dieser Vergleichskonstruktion idiomatisch die Entsprechung zwischen Himmel und Erde. „So auch auf der Erde“ macht die griechische Beziehung im Deutschen natürlich deutlich.
theological_decisions:
- issue: Bezugsbereich der Vergleichsphrase ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: Im Haupttext wird die Phrase unmittelbar auf „Dein Wille geschehe“ bezogen.
  alternative: 'Die Phrase kann als auf beide Bitten bezogen verstanden werden: sowohl auf das Kommen des Reiches als auch auf das Geschehen des Willens Gottes.'
  rationale: Die nächstliegende syntaktische Zuordnung gilt der zweiten Bitte. Da die Zeichensetzung moderner griechischer Ausgaben redaktionell ist und ein weiterer Bezugsbereich möglich bleibt, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in vertrauter Gebetssprache. Die knappen Konjunktivformen „komme“ und „geschehe“ sind weiterhin allgemein verständlich und geben die Imperativbitten angemessen wieder. „Auf der Erde“ ist gegenwärtiger als das traditionelle „auf Erden“.
