id: MAT.6.28
reference: Matthew 6:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: de
  text: 'Und warum macht ihr euch Sorgen um Kleidung? Schaut euch die Lilien auf dem Feld genau an, wie sie wachsen: Sie mühen sich nicht ab und spinnen auch nicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: um Kleidung
  rationale: Das singularische ἔνδυμα bezeichnet hier im Zusammenhang der allgemeinen Versorgung Kleidung als Kategorie, nicht ein einzelnes Kleidungsstück.
- source_word: τί μεριμνᾶτε
  choice: warum macht ihr euch Sorgen
  rationale: μεριμνάω bezeichnet im Kontext sorgende, beunruhigende Gedanken. Die Wendung ist natürliches modernes Deutsch und gibt τί idiomatisch als „warum“ wieder.
- source_word: καταμάθετε
  choice: seht euch … an und lernt
  rationale: Das Verb fordert zu genauer Beobachtung auf, die zu einer Einsicht führt. Die Doppelwendung bildet diese beiden Aspekte im Deutschen klar ab, ohne lediglich eine beiläufige Betrachtung auszudrücken.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: die Lilien auf dem Feld
  rationale: κρίνα bezeichnet am unmittelbarsten Lilien; τοῦ ἀγροῦ beschreibt sie als auf freiem Feld wachsende Pflanzen. Die möglicherweise weitere Bedeutung „Wildblumen“ bleibt als echte lexikalische Alternative dokumentiert.
- source_word: πῶς αὐξάνουσιν
  choice: wie sie wachsen
  rationale: αὐξάνω bezeichnet hier das natürliche Wachstum der Pflanzen; „wachsen“ ist präzise und idiomatisch.
- source_word: οὐ κοπιῶσιν
  choice: sie mühen sich nicht ab
  rationale: κοπιάω bezeichnet anstrengende Arbeit oder Mühe. „Sich abmühen“ erhält diesen Intensitätswert besser als das allgemeinere „arbeiten“.
- source_word: οὐδὲ νήθουσιν
  choice: und spinnen auch nicht
  rationale: νήθω bedeutet Faden oder Garn spinnen. Die knappe Wiedergabe ist im Deutschen ausreichend; οὐδέ wird natürlich als steigernde zweite Verneinung wiedergegeben.
theological_decisions:
- issue: Bedeutung von μεριμνάω in Jesu Lehre über die Versorgung
  choice: sich Sorgen machen
  alternative: besorgt sein
  rationale: Die Formulierung bezeichnet belastende Sorge um materielle Versorgung, ohne jede vorausschauende Fürsorge pauschal zu verurteilen. Sie ist zugleich verständlich und näher am alltäglichen deutschen Sprachgebrauch als „ängstlich sein“.
- issue: Umfang der Pflanzenbezeichnung κρίνα
  choice: Lilien
  alternative: Wildblumen
  rationale: Die spezifische Wiedergabe „Lilien“ entspricht der primären lexikalischen Bedeutung. Da die genaue botanische Zuordnung unsicher und ein weiterer Gebrauch möglich ist, wird die Alternative dokumentiert, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. „Seht euch … an und lernt“ bewahrt den auffordernden und erkenntnisorientierten Charakter von καταμάθετε. Der Parallelismus der beiden verneinten Tätigkeiten bleibt erhalten.
