base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: de
  text: Wenn ihr aber den Menschen nicht vergebt, wird auch euer Vater eure Verfehlungen nicht vergeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Wenn ... aber nicht
  rationale: ἐάν leitet die Bedingung ein, δέ setzt einen Kontrast zum vorigen Vers, und μή verneint die Bedingung. Die deutsche Wortstellung „Wenn ihr aber ... nicht“ gibt dies natürlich und präzise wieder.
- source_word: ἀφῆτε
  choice: vergebt
  rationale: ἀφίημι bezeichnet hier im zwischenmenschlichen Zusammenhang das Vergeben. Dieselbe Wiedergabe wird beim zweiten Vorkommen beibehalten, um die sprachliche Entsprechung zu wahren.
- source_word: τοῖς ἀνθρώποις
  choice: den Menschen
  rationale: ἄνθρωποι bezeichnet Menschen allgemein und nicht nur Männer. „Den Menschen“ ist quellennah, inklusiv und im modernen Deutsch verständlich.
- source_word: οὐδὲ
  choice: auch ... nicht
  rationale: 'Im Deutschen gibt „auch ... nicht“ die negative Entsprechung idiomatisch wieder: Geschieht das eine nicht, wird auch das andere nicht geschehen.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: euer Vater
  rationale: Der griechische Text sagt schlicht „euer Vater“; „himmlischer“ wird daher nicht ergänzt.
- source_word: ἀφήσει
  choice: wird ... vergeben
  rationale: Das Futur von ἀφίημι wird wie das erste Vorkommen mit „vergeben“ übersetzt. So bleiben Wiederholung und wechselseitige Struktur des Satzes sichtbar.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: eure Verfehlungen
  rationale: παράπτωμα bezeichnet eine Verfehlung, Übertretung oder einen Fehltritt. „Verfehlungen“ trägt das moralische Gewicht, ist gegenwärtig verständlich und vermeidet das im modernen Deutsch leicht missverständliche „Übertretungen“.
theological_decisions:
- issue: Bedingter Zusammenhang zwischen menschlichem und göttlichem Vergeben
  choice: 'Die direkte Bedingung wird ohne Abschwächung beibehalten: Wenn die Menschen nicht vergeben, wird auch der Vater ihre Verfehlungen nicht vergeben.'
  alternative: Die Aussage lediglich als Erkennungszeichen bereits empfangener Vergebung oder nur als Verlust der Gemeinschaft mit Gott auszulegen.
  rationale: Der griechische Text formuliert einen unmittelbaren Bedingungssatz. Die Übersetzung bewahrt diese theologische Spannung, ohne sie durch eine systematisierende Paraphrase aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist natürlich, bleibt aber eng an der griechischen Konditional- und Parallelstruktur. Keine konfessionelle Präzisierung und keine Ergänzung von „himmlischer“.
