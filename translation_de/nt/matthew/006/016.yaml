id: MAT.6.16
reference: Matthew 6:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: de
  text: 'Wenn ihr fastet, dann setzt keine düstere Miene auf wie die Heuchler. Denn sie entstellen ihre Gesichter, damit die Leute sehen, dass sie fasten. Amen, ich sage euch: Sie haben ihren Lohn bereits vollständig erhalten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: Wenn ihr fastet
  rationale: Ὅταν mit dem Präsens Konjunktiv bezeichnet einen wiederkehrenden bzw. jeweils eintretenden Fall. Im Deutschen gibt „wenn“ dies natürlich wieder; δέ verbindet den Satz mit den parallelen Weisungen über Almosengeben und Beten und muss nicht eigens mit „aber“ markiert werden.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: dann setzt keine düstere Miene auf
  rationale: Die Verbindung bezeichnet hier das Annehmen eines sichtbar finsteren oder traurigen Gesichtsausdrucks. Die idiomatische deutsche Formulierung bewahrt den ingressive-performativen Sinn besser als das unnatürliche „werdet nicht düster“.
- source_word: ὡς οἱ ὑποκριταί
  choice: wie die Heuchler
  rationale: „Heuchler“ gibt die religiöse Verstellung im Kontext prägnant und traditionsübergreifend wieder.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: sie entstellen ihre Gesichter
  rationale: ἀφανίζω kann das Unkenntlichmachen, Verunstalten oder Vernachlässigen bezeichnen. „Entstellen“ erhält das konkrete Bild der Gesichter, ohne eine bestimmte Methode der äußerlichen Veränderung festzulegen.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: damit die Leute sehen, dass sie fasten
  rationale: Die Zweckangabe und der Sinn von φαίνομαι als Sichtbarwerden bzw. Wahrgenommenwerden werden in natürlichem Deutsch wiedergegeben. τοῖς ἀνθρώποις bezeichnet hier Menschen allgemein; „die Leute“ passt zum öffentlichen Ansehen als Ziel der Zurschaustellung.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Das semitische ἀμήν wird als charakteristische feierliche Einleitungsformel Jesu bewahrt; die folgende Formulierung bleibt transparent und würdevoll.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: Sie haben ihren Lohn bereits vollständig erhalten
  rationale: ἀπέχω ist hier eine aus dem Geschäftsverkehr stammende Wendung für den vollständigen Empfang einer Zahlung. „bereits vollständig erhalten“ macht deutlich, dass der erstrebte menschliche Lohn ganz ausgezahlt ist.
theological_decisions:
- issue: Reichweite von τοῖς ἀνθρώποις
  choice: die Leute
  alternative: den Menschen; den Männern
  rationale: ἄνθρωποι ist grammatisch maskulin, bezeichnet hier aber ohne erkennbare Beschränkung die menschliche Öffentlichkeit. Eine geschlechtlich eingeschränkte Wiedergabe würde dem Kontext eine nicht vorhandene Festlegung hinzufügen.
- issue: Art und Abschluss des μισθός
  choice: Lohn bereits vollständig erhalten
  alternative: haben ihren Lohn; empfangen ihren Lohn
  rationale: Die kaufmännische Färbung von ἀπέχουσιν legt vollständigen Empfang nahe. Die Übersetzung wahrt damit die Spannung zwischen dem schon empfangenen menschlichen Ansehen und dem im Zusammenhang vorausgesetzten Lohn Gottes, ohne diesen im Vers ausdrücklich zu ergänzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Düstere Miene aufsetzen“ macht die absichtliche äußerliche Inszenierung deutlich; „Amen, ich sage euch“ bewahrt die markante Formel des griechischen Textes.
