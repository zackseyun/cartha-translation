  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: de
  text: Wenn aber Gott das Gras auf dem Feld, das heute da ist und morgen in den Ofen[a] geworfen wird, so kleidet, wird er dann nicht erst recht euch kleiden, ihr Kleingläubigen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist ein Backofen. Getrocknetes Gras und andere Feldpflanzen konnten als Brennmaterial dienen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ihr, die ihr wenig Glauben habt“. Das griechische Wort ist eine direkte, tadelnde Anrede und bezeichnet unzureichendes Vertrauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: das Gras auf dem Feld
  rationale: χόρτος bezeichnet Gras beziehungsweise niedrigen Feldbewuchs. Die Formulierung bleibt beim Bild des griechischen Textes, ohne es auf Blumen einzuengen.
- source_word: σήμερον ὄντα
  choice: das heute da ist
  rationale: Die idiomatische deutsche Wendung gibt das schlichte ὄντα („seiend, vorhanden“) wieder und betont die kurze Dauer, ohne „lebendig“ hinzuzufügen.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: morgen in den Ofen geworfen wird
  rationale: κλίβανος ist hier ein Backofen, nicht zwingend ein Schmelzofen; die passive Form bewahrt das Bild von getrocknetem Feldbewuchs als Brennmaterial.
- source_word: οὕτως ἀμφιέννυσιν
  choice: so kleidet
  rationale: ἀμφιέννυμι bedeutet „kleiden“ oder „bekleiden“. „Kleidet“ bewahrt die personifizierende Bildsprache und den Anschluss an den Kontext.
- source_word: οὐ πολλῷ μᾶλλον
  choice: wird er dann nicht erst recht
  rationale: Die Formulierung gibt den rhetorischen Schluss vom Geringeren auf das Größere in natürlichem modernem Deutsch wieder.
- source_word: ὑμᾶς
  choice: euch kleiden
  rationale: Das Verb ist im Griechischen beim zweiten Glied sinngemäß zu ergänzen; im Deutschen wird es zur Klarheit wiederholt.
- source_word: ὀλιγόπιστοι
  choice: ihr Kleingläubigen
  rationale: Das substantivierte Adjektiv steht als direkte Anrede im Plural und tadelt unzureichendes Vertrauen. „Kleingläubige“ ist knapp, verständlich und bewahrt die prägnante Form.
- source_word: εἰ δὲ
  choice: Wenn ... aber
  rationale: Die deutsche Wortstellung gibt sowohl die Bedingung als auch die leichte kontrastive beziehungsweise weiterführende Funktion von δέ wieder.
theological_decisions:
- issue: Gottes Fürsorge im Schluss vom Geringeren auf das Größere
  choice: 'Die Aussage bleibt als rhetorische Frage formuliert: Gott wird die Angeredeten erst recht kleiden.'
  alternative: Als bloße Feststellung oder Verheißung ohne Frage wiedergeben.
  rationale: Die griechische Konstruktion mit οὐ erwartet eine bejahende Antwort. Die Frage bewahrt zugleich den Zuspruch göttlicher Fürsorge und den tadelnden Nachdruck der abschließenden Anrede, ohne weitergehende Lehrannahmen einzutragen.
- issue: Bedeutung von ὀλιγόπιστοι
  choice: „ihr Kleingläubigen“ als Tadel wegen unzureichenden Vertrauens
  alternative: „ihr Ungläubigen“ im Sinn vollständigen Fehlens von Glauben
  rationale: Das Wort bezeichnet hier geringen beziehungsweise unzureichenden Glauben oder Vertrauen, nicht eindeutig völligen Unglauben. Diese Spannung wird nicht verschärft.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Satzführung und das Bild des Kleidens bleiben erhalten; „erst recht“ vermittelt den Schluss vom Geringeren auf das Größere idiomatisch.
