  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: de
  text: 'Deshalb sollt ihr so beten: Unser Vater in den Himmeln[a], dein Name werde als heilig geehrt[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „im Himmel“. Im Griechischen steht „in den Himmeln“ im Plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „dein Name werde geheiligt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: so
  rationale: Bezeichnet hier die Art und das Muster des Gebets. „So“ ist im modernen Deutschen knapp, natürlich und bewahrt die anweisende Funktion.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Unterweisung. Die Stellung nach „sollt ihr“ klingt im Deutschen natürlich und erhält den logischen Anschluss.
- source_word: προσεύχεσθε ὑμεῖς
  choice: sollt ihr beten
  rationale: Der Imperativ wird als klare Anweisung wiedergegeben; das ausdrücklich gesetzte ὑμεῖς kommt durch das ausgesprochene „ihr“ zur Geltung, ohne im Deutschen übermäßig betont zu wirken.
- source_word: Πάτερ ἡμῶν
  choice: Unser Vater
  rationale: Natürliche deutsche Form der direkten Anrede; sie bewahrt sowohl die Vaterbezeichnung als auch den gemeinschaftlichen Plural.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Die griechische Pluralform τοῖς οὐρανοῖς wird bewusst erhalten. Die attributive Wendung wird im Deutschen idiomatisch direkt an „Unser Vater“ angeschlossen.
- source_word: ἁγιασθήτω
  choice: werde als heilig geehrt
  rationale: Der passive Imperativ formuliert eine Bitte darum, dass Gottes Name als heilig anerkannt und entsprechend geehrt wird. Diese Wiedergabe ist für heutige Leser verständlicher als das alleinstehende traditionelle „werde geheiligt“.
- source_word: τὸ ὄνομά σου
  choice: dein Name
  rationale: Entspricht unmittelbar dem griechischen Ausdruck. „Name“ bleibt stehen und wird nicht erklärend auf Ruf, Wesen oder Offenbarung verengt.
theological_decisions:
- issue: Göttliche Anrede und Transzendenz in der Eröffnung des Gebets
  choice: Unser Vater in den Himmeln
  alternative: Unser Vater im Himmel
  rationale: Der Plural des griechischen Textes wird bewahrt, ohne die vertraute Nähe der Anrede „Unser Vater“ abzuschwächen. Die traditionelle Singularform ist idiomatischer, glättet jedoch die Ausgangsform.
- issue: Bedeutung und petitionärer Charakter von ἁγιασθήτω
  choice: dein Name werde als heilig geehrt
  alternative: dein Name werde geheiligt
  rationale: Die Formulierung wahrt die Bitte, dass Gottes Name heilig behandelt und geehrt werde, und vermeidet zugleich den möglichen modernen Eindruck, Gottes Name müsse erst heilig gemacht werden. Die traditionelle Fassung bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichere Pluralform „in den Himmeln“ folgt bewusst dem griechischen Wortlaut; eine Fußnote nennt die vertraute traditionelle Fassung. „Als heilig geehrt“ erschließt die Bitte in heutiger Sprache, ohne den Begriff der Heiligkeit abzuschwächen.
