id: MAT.6.2
reference: Matthew 6:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: de
  text: 'Wenn du also Almosen gibst[a], posaune es nicht vor dir her[b], wie es die Heuchler in den Synagogen und auf den Straßen tun, damit sie von den Menschen verherrlicht werden[c]. Amen, ich sage euch: Sie haben ihren Lohn bereits vollständig erhalten[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bedürftigen etwas gibst“ beziehungsweise „Barmherzigkeit übst“. Die griechische Wendung bezeichnet wohltätiges Geben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich sinngemäß: „lass vor dir keine Trompete erschallen“. Das Bild kann als Übertreibung oder bildhafte Rede verstanden werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „geehrt“ beziehungsweise „gelobt werden“. Das griechische Verb bedeutet wörtlich „verherrlicht werden“.'
    reason: lexical_alternative
  - marker: d
    text: 'Die Formulierung greift eine kaufmännische Ausdrucksweise auf: Sie haben ihren Lohn schon ganz bekommen; mehr steht für sie nicht aus.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Wenn du also
  rationale: Ὅταν mit dem Konjunktiv bezeichnet einen allgemeinen oder wiederkehrenden Fall; im Deutschen gibt „wenn“ dies natürlich wieder. „Also“ bewahrt den folgernden beziehungsweise fortführenden Anschluss von οὖν.
- source_word: ποιῇς ἐλεημοσύνην
  choice: Almosen gibst
  rationale: Die feste Wendung bezeichnet wohltätiges Geben an Bedürftige. „Almosen geben“ ist knapp, sachlich und im Deutschen weiterhin verständlich.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: posaune es nicht vor dir her
  rationale: Die deutsche Wendung bewahrt das anschauliche Trompetenbild und gibt ἔμπροσθέν σου idiomatisch mit „vor dir her“ wieder. Das ergänzte „es“ bezeichnet das zuvor genannte Almosengeben.
- source_word: οἱ ὑποκριταί
  choice: die Heuchler
  rationale: „Heuchler“ ist die etablierte und kontextgerechte Bezeichnung für Menschen, die Frömmigkeit zur Schau stellen.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: in den Synagogen und auf den Straßen
  rationale: „Synagogen“ bezeichnet die jüdischen Versammlungsorte präzise; bei Straßen ist im Deutschen die Präposition „auf“ idiomatisch.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: damit sie von den Menschen verherrlicht werden
  rationale: „Damit“ drückt die Absicht aus. „Verherrlicht“ bewahrt die auffallend starke Wortwahl von δοξάζω, während „Menschen“ ἀνθρώπων generisch wiedergibt.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Das beibehaltene „Amen“ bewahrt die markante, autoritative Einleitungsformel Jesu und ist im Deutschen geläufig.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: Sie haben ihren Lohn bereits vollständig erhalten
  rationale: 'ἀπέχω ist hier als kaufmännische Empfangsformel gebraucht: Der betreffende Betrag ist vollständig ausgezahlt. „Lohn“ erhält zugleich die Zahlungs- und Vergeltungsnuance von μισθός.'
theological_decisions:
- issue: Stärke von δοξασθῶσιν
  choice: verherrlicht werden
  alternative: gelobt werden; geehrt werden
  rationale: 'Die stärkere Wiedergabe hält die bewusste rhetorische Spannung fest: Die Heuchler suchen bei Menschen eine Ehre, die mit einem für „verherrlichen“ verwendeten Verb bezeichnet wird. Eine Abschwächung zu „gelobt“ würde diese Spannung glätten.'
- issue: Generischer Sinn von ἀνθρώπων
  choice: von den Menschen
  alternative: von den Leuten; von anderen
  rationale: Das griechische Substantiv meint hier menschliche Beobachter allgemein und nicht ausschließlich Männer.
- issue: Art und Umfang des Lohns
  choice: ihren Lohn bereits vollständig erhalten
  alternative: ihren Lohn erhalten; ihren Lohn weg
  rationale: Die Übersetzung wahrt die kaufmännische Idiomatik, ohne festzulegen, worin der Lohn genau besteht. Im Kontext ist die öffentliche Anerkennung bereits die vollständige Gegenleistung, die sie gesucht haben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Posaune es nicht vor dir her“ ist bewusst anschaulich und zugleich idiomatisch; „verherrlicht“ erhält die starke und theologisch spannungsreiche Wortwahl des Ausgangstextes. Die direkte Amen-Formel bleibt erhalten.
