source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: de
  text: Und wer von euch kann, indem er sich Sorgen macht, seiner Lebenszeit[a] auch nur eine Elle hinzufügen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Körpergröße eine Elle hinzufügen“. Das griechische Wort kann sowohl „Lebensalter/Lebenszeit“ als auch „Körpergröße“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: Und wer von euch
  rationale: τίς mit ἐξ ὑμῶν bedeutet idiomatisch „wer von euch“. δέ verbindet hier den Gedanken leicht mit dem Vorangehenden; „Und“ gibt diesen Anschluss natürlich wieder.
- source_word: μεριμνῶν
  choice: dadurch, dass er sich Sorgen macht
  rationale: 'Das Partizip von μεριμνάω bezeichnet besorgtes, ängstliches Sich-Sorgen und lässt sich hier instrumental verstehen: Sorgen sind das vermeintliche Mittel, durch das etwas erreicht werden soll.'
- source_word: δύναται
  choice: kann
  rationale: Die geläufige deutsche Entsprechung für die ausgedrückte Fähigkeit.
- source_word: προσθεῖναι ἐπὶ
  choice: hinzufügen
  rationale: Die Formulierung bewahrt das konkrete Bild des Hinzufügens und passt zur nachfolgenden Maßeinheit.
- source_word: τὴν ἡλικίαν αὐτοῦ
  choice: seiner Lebenszeit
  rationale: ἡλικία kann Lebensalter beziehungsweise Lebenszeit oder Körpergröße bedeuten. Im Zusammenhang mit der Sorge um das Leben ist „Lebenszeit“ eine plausible Hauptlesart; die echte lexikalische Alternative bleibt in der Fußnote erhalten.
- source_word: πῆχυν ἕνα
  choice: auch nur eine Elle
  rationale: πῆχυς bezeichnet die Elle als Längenmaß. Die traditionelle Maßeinheit erhält das auffällige Bild einer messbaren Verlängerung; „auch nur“ bringt in der rhetorischen Frage den Nachdruck von μίαν natürlich zum Ausdruck.
- source_word: αὐτοῦ
  choice: seiner
  rationale: Das maskuline Singularpronomen bezieht sich repräsentativ auf das vorausgehende „wer“; die deutsche Form folgt dieser grammatischen Struktur.
theological_decisions:
- issue: Bedeutung von ἡλικία in diesem Ausspruch
  choice: Lebenszeit
  alternative: Körpergröße
  rationale: Beide Bedeutungen sind sprachlich möglich. „Lebenszeit“ fügt sich in den Zusammenhang von Gottes Fürsorge für das Leben und der Unfähigkeit des Menschen, dieses durch Sorgen zu verlängern. Wegen der Verbindung mit dem Längenmaß „Elle“ bleibt „Körpergröße“ jedoch eine ernst zu nehmende Alternative und wird ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die ungewöhnliche Verbindung von „Lebenszeit“ und „Elle“ wird bewusst als bildhafte Ausdrucksweise des griechischen Textes bewahrt; die lexikalische Mehrdeutigkeit wird nicht stillschweigend aufgelöst.
