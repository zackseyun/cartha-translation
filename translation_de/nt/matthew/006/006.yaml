review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt den Kontrast von „Du aber“, den allgemeinen Zeitpunkt („wenn du betest“), den Rückzugsraum, das Schließen der Tür, die Anrede „deinem Vater“ sowie die zweimalige Wendung ἐν τῷ κρυπτῷ zuverlässig wieder. Die identische Wiedergabe „im Verborgenen“ bewahrt die rhetorische Wiederholung und die im Griechischen bestehende Auslegungsweite. „wird es dir vergelten“ ist im Kontext als positive göttliche Erwiderung verständlich und deckt den Bedeutungsspielraum von ἀποδώσει angemessen ab.
  naturalness: Modernes, würdiges Standarddeutsch. „Kammer“ ist verständlich und passend für einen abgeschlossenen inneren Raum. Die Imperativreihe „geh …, schließ … und bete“ ist idiomatisch; sie vermittelt die durch das aoristische Partizip angezeigte Vorzeitigkeit hinreichend klar.
  terminology: „Vater“ folgt dem griechischen Wortlaut ohne ergänzendes „himmlisch“. „Im Verborgenen“ ist als bewusste, wiederholte Formulierung sowohl sprachlich tragfähig als auch terminologisch konsistent. Die Fußnoten erläutern ταμεῖον und ἀποδίδωμι sachlich und ohne unnötige Einengung.
