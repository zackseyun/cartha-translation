id: MAT.6.6
reference: Matthew 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: de
  text: Du aber, wenn du betest, geh in deine Kammer[a], schließ deine Tür und bete zu deinem Vater, der im Verborgenen ist. Und dein Vater, der im Verborgenen sieht, wird es dir vergelten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deinen inneren Raum“ beziehungsweise „in deinen Vorratsraum“. Das griechische Wort bezeichnet einen abgeschlossenen Innenraum, der Rückzug ermöglichte und auch zur Aufbewahrung dienen konnte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird dich belohnen“. Das griechische Verb kann je nach Zusammenhang „zurückgeben“, „vergelten“ oder „belohnen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Du aber
  rationale: Das ausdrücklich gesetzte Pronomen σὺ und δέ markieren den Gegensatz zu den Heuchlern im vorherigen Vers. „Du aber“ bewahrt diesen Kontrast knapp und deutlich.
- source_word: ὅταν προσεύχῃ
  choice: wenn du betest
  rationale: ὅταν mit dem Konjunktiv bezeichnet einen allgemeinen beziehungsweise wiederkehrenden Zeitpunkt. „Wenn du betest“ ist im modernen Deutsch natürlich und lässt diesen allgemeinen Sinn bestehen.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: geh in deine Kammer
  rationale: ταμεῖον bezeichnet einen abgeschlossenen inneren Raum, der auch als Vorratsraum dienen konnte. „Kammer“ ist knapp, verständlich und vermittelt einen vom öffentlichen Blick abgeschirmten Raum, ohne ihn genauer festzulegen als der griechische Text.
- source_word: κλείσας τὴν θύραν σου
  choice: schließ deine Tür
  rationale: Das vorzeitige Aoristpartizip beschreibt das Schließen vor dem Gebet. Die deutsche Reihung mit Imperativen gibt die zeitliche Abfolge natürlich wieder; das Possessivpronomen wird entsprechend dem Ausgangstext beibehalten.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: bete zu deinem Vater
  rationale: Die schlichte Wiedergabe bewahrt sowohl den Gebetsakt als auch die relationale Gottesbezeichnung „dein Vater“, ohne eine im Text nicht vorhandene Ergänzung wie „himmlisch“ einzuführen.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: der im Verborgenen ist
  rationale: Die Formulierung wahrt die Mehrdeutigkeit zwischen verborgenem Bereich und verborgener Gegenwart und hält sich eng an die substantivierte Wendung des Griechischen.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: der im Verborgenen sieht
  rationale: Die gleiche Formulierung „im Verborgenen“ erhält die auffällige Wiederholung von ἐν τῷ κρυπτῷ und legt nicht ausdrücklich fest, ob der Vater verborgen sieht oder das Verborgene sieht.
- source_word: ἀποδώσει σοι
  choice: wird es dir vergelten
  rationale: ἀποδίδωμι kann je nach Zusammenhang „zurückgeben“, „vergelten“ oder „belohnen“ bedeuten. „Es dir vergelten“ bewahrt die Vorstellung einer entsprechenden göttlichen Erwiderung, ohne deren Gestalt näher zu bestimmen.
theological_decisions:
- issue: Bedeutung der wiederholten Wendung ἐν τῷ κρυπτῷ
  choice: Beide Vorkommen werden mit „im Verborgenen“ wiedergegeben.
  alternative: „an einem verborgenen Ort“, „im Geheimen“ oder beim zweiten Vorkommen „der das Verborgene sieht“
  rationale: Der Vers stellt verborgenes Beten öffentlicher Selbstdarstellung gegenüber. Die identische Wiedergabe bewahrt die rhetorische Wiederholung und lässt offen, ob die Wendung primär räumlich oder modal zu verstehen ist.
- issue: Bezeichnung Gottes als πατήρ
  choice: Vater
  alternative: himmlischer Vater
  rationale: Der Ausgangstext sagt an dieser Stelle nur „dein Vater“. Die relationale Gottesbezeichnung wird ohne eine aus dem weiteren Kontext ergänzte Qualifizierung wiedergegeben.
- issue: Art der göttlichen Erwiderung in ἀποδώσει
  choice: wird es dir vergelten
  alternative: wird dich belohnen
  rationale: Die Übersetzung wahrt die im Verb liegende Vorstellung des Zurückgebens beziehungsweise Vergeltens und bestimmt weder Art noch Zeitpunkt der göttlichen Antwort.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kammer“ ist bewusst etwas gehobener, bleibt aber allgemein verständlich und bildet den abgeschlossenen Innenraum prägnant ab. Die zweimalige Wendung „im Verborgenen“ ist trotz ihrer leichten Fremdheit beibehalten, um die Wiederholung und Mehrdeutigkeit des griechischen Textes zu erhalten.
