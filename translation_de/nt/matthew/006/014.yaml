  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: de
  text: Denn wenn ihr den Menschen ihre Verfehlungen vergebt, wird euer himmlischer Vater auch euch vergeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Denn wenn
  rationale: γάρ begründet die vorausgehende Bitte des Gebets; ἐάν mit Aorist Konjunktiv leitet eine reale Bedingung ein. „Denn wenn“ gibt beides natürlich wieder.
- source_word: ἀφῆτε … ἀφήσει
  choice: vergebt … wird … vergeben
  rationale: ἀφίημι bezeichnet hier das Vergeben zwischenmenschlicher beziehungsweise moralischer Schuld. Derselbe deutsche Wortstamm bewahrt die bewusste Wiederholung des griechischen Verbs.
- source_word: τοῖς ἀνθρώποις
  choice: den Menschen
  rationale: ἄνθρωποι ist allgemein und nicht auf Männer beschränkt; „den Menschen“ entspricht dem generischen Sinn und klingt im Deutschen natürlich.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: ihre Verfehlungen
  rationale: παράπτωμα bezeichnet moralische Fehltritte oder Übertretungen. „Verfehlungen“ wahrt diesen Sinn, ohne ihn unnötig zu verengen oder altertümlich auszudrücken.
- source_word: καὶ ὑμῖν
  choice: auch … euch
  rationale: καί stellt die Entsprechung zwischen menschlichem und göttlichem Vergeben heraus; der Dativ ὑμῖν wird idiomatisch als Objekt „euch“ wiedergegeben.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: euer himmlischer Vater
  rationale: Die attributive Konstruktion bedeutet wörtlich „euer Vater, der himmlische“. „Euer himmlischer Vater“ ist eine natürliche, würdevolle und genaue deutsche Wiedergabe.
theological_decisions:
- issue: Bedingungsverhältnis zwischen menschlichem und göttlichem Vergeben
  choice: Die Aussage wird unmittelbar als echte Bedingung wiedergegeben.
  alternative: Die Bedingung ausdrücklich als Verdienstursache oder lediglich als nachträgliches Kennzeichen bereits empfangener Vergebung deuten.
  rationale: Der griechische Text formuliert eine klare Bedingung, erklärt aber an dieser Stelle nicht deren dogmatischen Zusammenhang. Die Übersetzung bewahrt diese theologische Spannung, statt sie konfessionell aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung hält „auch“ nahe beim göttlichen Vergeben und vermeidet unnötig altertümliche Wörter.
