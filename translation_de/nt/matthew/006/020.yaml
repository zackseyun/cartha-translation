source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: de
  text: Sammelt euch aber Schätze im Himmel, wo weder Motten noch Verfall[a] sie vernichten und wo Diebe nicht einbrechen[b] und stehlen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann einen aufzehrenden Verderb bezeichnen; auch „Rost“ ist als Übersetzung möglich.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „durchgraben“; Diebe konnten sich durch die Wand eines Hauses Zugang verschaffen.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: Sammelt
  rationale: Der Präsensimperativ fordert zu fortgesetztem Handeln auf. „Sammelt“ ist natürliches modernes Deutsch und bewahrt das Bild vom Anhäufen von Schätzen.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert den Gegensatz zum Verbot im vorhergehenden Vers.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet hier den eigenen Nutzen; in der Verbindung „sich Schätze sammeln“ gibt das reflexive „euch“ dies idiomatisch wieder.
- source_word: θησαυρούς
  choice: Schätze
  rationale: Die Pluralform und das wiederkehrende Schatzmotiv werden unmittelbar bewahrt.
- source_word: ἐν οὐρανῷ
  choice: im Himmel
  rationale: Natürliche deutsche Wiedergabe der örtlichen Bestimmung im Singular.
- source_word: σής
  choice: Motten
  rationale: Gemeint ist die Motte als Zerstörerin gelagerter Kleidung und anderer Güter. Der deutsche Plural klingt in dieser allgemeinen Aussage natürlicher.
- source_word: βρῶσις
  choice: Verfall
  rationale: Das Wort bezeichnet wörtlich ein Fressen beziehungsweise etwas Aufzehrendes und kann hier allgemein den zerstörerischen Verbrauch oder Zerfall irdischer Güter ausdrücken; „Verfall“ vermeidet die unnötige Verengung auf Rost.
- source_word: ἀφανίζει
  choice: vernichten
  rationale: Das Verb bezeichnet das Zugrunderichten oder Verschwindenlassen. „Vernichten“ passt sowohl zu Motten als auch zu Verfall.
- source_word: κλέπται
  choice: Diebe
  rationale: Direkte und geläufige Wiedergabe des griechischen Plurals.
- source_word: διορύσσουσιν
  choice: einbrechen
  rationale: Wörtlich ist das Durchgraben einer Hauswand gemeint. „Einbrechen“ vermittelt die Handlung im heutigen Deutsch natürlich; das konkrete antike Bild wird in einer Fußnote erläutert.
- source_word: κλέπτουσιν
  choice: stehlen
  rationale: Direkte, klare Wiedergabe des Verbs.
theological_decisions:
- issue: Bedeutung der „Schätze im Himmel“
  choice: Das Bild „Schätze im Himmel“ bleibt ohne erklärende Erweiterung stehen.
  alternative: „himmlischer Lohn“ oder „geistlicher Reichtum“
  rationale: Der griechische Text entfaltet die Metapher hier nicht näher. Ihre Beibehaltung vermeidet, eine bestimmte Lehre über Verdienst, Lohn oder geistlichen Besitz in den Vers hineinzutragen.
- issue: Bedeutungsumfang von βρῶσις
  choice: Breite Wiedergabe mit „Verfall“
  alternative: „Rost“, „Korrosion“ oder wörtlicher „Fraß“
  rationale: Die Formulierung soll den Gegensatz zwischen vergänglichen irdischen und unvergänglichen himmlischen Schätzen bewahren, ohne die Art des Verderbens auf Metallrost festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. „Sammelt euch aber“ wahrt den Gegensatz zum vorhergehenden Vers; die Fußnoten stehen jeweils direkt an der erklärungsbedürftigen Stelle.
