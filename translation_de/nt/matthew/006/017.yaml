lexical_decisions:
- source_word: σὺ δὲ
  choice: Du aber
  rationale: Das ausdrücklich gesetzte Pronomen mit δέ hebt den Gegensatz zu den Heuchlern im vorherigen Kontext hervor. „Du aber“ bewahrt diese Betonung; das ergänzte „sollst“ ermöglicht im Deutschen einen natürlichen Satzbau mit den folgenden Aufforderungen.
- source_word: νηστεύων
  choice: wenn du fastest
  rationale: Das adverbiale Präsenspartizip wird als temporaler Nebensatz wiedergegeben. Dies ist im modernen Deutschen natürlich und lässt offen, wann oder wie oft gefastet wird.
- source_word: ἄλειψαί
  choice: deinen Kopf salben
  rationale: ἀλείφω bezeichnet hier das Auftragen von Öl, wahrscheinlich im Rahmen gewöhnlicher Körperpflege. „Salben“ bewahrt die kulturelle Ausdrucksweise des griechischen Textes, ohne ausdrücklich eine rituelle Handlung daraus zu machen.
- source_word: τὴν κεφαλήν
  choice: deinen Kopf
  rationale: „Kopf“ ist die direkte, moderne Entsprechung von κεφαλή. Gemeint ist im Zusammenhang die Pflege von Kopf beziehungsweise Haar.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die beiden parallelen Aufforderungen schlicht miteinander.
- source_word: τὸ πρόσωπόν σου
  choice: dein Gesicht
  rationale: πρόσωπον bezeichnet hier das sichtbare Gesicht; „Gesicht“ ist die klare und zeitgemäße deutsche Entsprechung.
- source_word: νίψαι
  choice: waschen
  rationale: νίπτω bezeichnet gewöhnlich das Waschen eines Körperteils. „Waschen“ gibt die praktische Aufforderung natürlich und präzise wieder.
theological_decisions:
- issue: Sinn der Anweisung zum äußeren Erscheinungsbild beim Fasten
  choice: Jesus weist zu gewöhnlicher Körperpflege beim Fasten an, sodass das Fasten nicht demonstrativ zur Schau gestellt wird.
  alternative: Gemeint sein könnte eine rituelle Salbung; oder der Vers könnte als grundsätzliches Verbot öffentlichen Fastens verstanden werden.
  rationale: Der unmittelbare Zusammenhang stellt die entstellte Miene der Heuchler einem normalen Erscheinungsbild gegenüber. Der Wortlaut verbietet das Fasten nicht und kennzeichnet das Salben nicht ausdrücklich als Ritual; zugleich wird die Folgerung, das Fasten solle anderen verborgen bleiben, erst im folgenden Vers vollständig ausgesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Du aber“ erhält die nachdrückliche Gegenüberstellung des griechischen Textes; „sollst“ dient einem natürlichen deutschen Satzbau. „Salben“ bewahrt die kulturelle Bildwelt, während die Fußnote die alltagssprachliche Bedeutung erläutert.
