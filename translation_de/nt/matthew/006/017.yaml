  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: de
  text: Du aber, wenn du fastest, salbe deinen Kopf[a] und wasche dein Gesicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „reibe deinen Kopf mit Öl ein“. Das griechische Verb kann das Auftragen von Öl als Teil der gewöhnlichen Körperpflege bezeichnen.'
    reason: lexical_alternative
