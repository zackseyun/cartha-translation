  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: de
  text: Sammelt euch keine Schätze auf der Erde, wo Motten und Zerstörung sie vernichten[a] und wo Diebe einbrechen[b] und stehlen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rost“. Das griechische Wort kann allgemein verzehrende oder verderbende Zerstörung bezeichnen, nicht nur die Korrosion von Metall.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durchgraben“ oder „durchbrechen“; vermutlich ist an Diebe gedacht, die sich durch Wände aus Lehmziegeln Zugang verschafften.'
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Sammelt … keine
  rationale: Die Verneinung μή mit dem Präsensimperativ formuliert ein Verbot. „Schätze sammeln“ gibt die Anhäufung natürlich und würdig wieder.
- source_word: ὑμῖν
  choice: euch
  rationale: 'Der Dativ hat hier reflexiven Sinn: Die Schätze werden für den eigenen Besitz oder Nutzen gesammelt.'
- source_word: θησαυροὺς
  choice: Schätze
  rationale: Bewahrt die Wortverwandtschaft mit dem Verb sinngemäß und bezeichnet wertvollen irdischen Besitz umfassender als nur Geld.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Gibt die Ortsangabe wieder und erhält den Gegensatz zum Himmel im folgenden Vers.
- source_word: σὴς
  choice: Motten
  rationale: Bezeichnet Motten, die gelagerte Kleidung und andere wertvolle Güter zerstören; der deutsche Plural ist in dieser Verbindung idiomatisch.
- source_word: βρῶσις
  choice: Verfall
  rationale: Das Wort bezeichnet wörtlich ein Fressen oder Verzehren und kann allgemein konsumierende Zerstörung meinen. „Verfall“ bleibt weiter als das traditionelle „Rost“.
- source_word: ἀφανίζει
  choice: vernichten
  rationale: Das Verb bezeichnet das Verschwindenlassen beziehungsweise Zugrunderichten. „Vernichten“ passt zu beiden genannten Ursachen.
- source_word: διορύσσουσιν
  choice: einbrechen
  rationale: Die wörtliche Vorstellung ist das Durchgraben oder Durchbrechen, vermutlich einer Lehmziegelwand. „Einbrechen“ vermittelt die beabsichtigte Handlung in modernem Deutsch.
- source_word: κλέπτουσιν
  choice: stehlen
  rationale: Direkte und natürliche Entsprechung des griechischen Verbs.
theological_decisions:
- issue: Bedeutungsumfang von γῆ
  choice: auf der Erde
  alternative: auf Erden
  rationale: Die Formulierung wahrt den konkreten räumlichen Gegensatz zum Himmel, ohne eine weitergehende theologische Unterscheidung einzutragen.
- issue: Wiedergabe von βρῶσις
  choice: Verfall
  alternative: Rost
  rationale: „Rost“ ist traditionell und im Kontext möglich, doch das griechische Wort ist breiter und bezeichnet konsumierende Zerstörung. „Verfall“ erhält diesen weiteren Sinn; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt eng am griechischen Parallelismus; die Fußnoten bewahren die lexikalische Breite von βρῶσις und den kulturellen Hintergrund von διορύσσουσιν.
