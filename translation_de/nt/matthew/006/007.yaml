- from: Und wenn ihr betet, macht nicht viele leere Worte[a] wie die Nichtjuden[b]; denn sie meinen, wegen ihrer vielen Worte erhört zu werden.
  to: Und wenn ihr betet, redet nicht gedankenlos daher[a] wie die Heiden[b]; denn sie meinen, wegen ihrer vielen Worte erhört zu werden.
  rationale: Die Revision verbessert die Natürlichkeit des Deutschen und wahrt zugleich die semantische Unsicherheit von βατταλογέω. „Heiden“ entspricht dem historischen und bibelsprachlichen Kontext von ἐθνικοί, während die Fußnote die mögliche Übersetzung „Nichtjuden“ und den Bezug zu den Völkern außerhalb Israels transparent macht. Der Sinn von πολυλογία und εἰσακουσθήσονται bleibt unverändert erhalten.
