source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: de
  text: Und wenn ihr betet, redet nicht gedankenlos daher[a] wie die Heiden[b]; denn sie meinen, wegen ihrer vielen Worte erhört zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „plappert nicht“; auch: „häuft nicht leere Worte an“. Das seltene griechische Verb kann leeres, mechanisches oder wortreiches Reden bezeichnen; seine genaue Nuance ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Nichtjuden“. Das griechische Wort bezeichnet hier die Völker außerhalb Israels und kann je nach Zusammenhang auch religiös als „Heiden“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: Und wenn ihr betet
  rationale: Das adverbiale Partizip bezeichnet den Umstand des folgenden Gebots; „wenn ihr betet“ ist im modernen Deutschen natürlich. δέ führt die nächste Anweisung weiter, ohne einen starken Gegensatz auszudrücken.
- source_word: μὴ βατταλογήσητε
  choice: macht nicht viele leere Worte
  rationale: Das seltene Verb bezeichnet wahrscheinlich leeres, gedankenloses oder wortreiches Reden. Die Formulierung wahrt die Verbindung von Inhaltsleere und Wortfülle, ohne jedes wiederholte Beten zu verurteilen.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: wie die Nichtjuden
  rationale: ἐθνικοί bezeichnet in diesem jüdischen Zusammenhang Menschen aus den Völkern außerhalb Israels. „Nichtjuden“ gibt den Bezug verständlich wieder, während „Heiden“ die religiöse Wertung stärker hervorhebt.
- source_word: δοκοῦσιν
  choice: sie meinen
  rationale: Das Verb drückt hier ihre Annahme darüber aus, wodurch ihr Gebet Gehör finde.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: wegen ihrer vielen Worte
  rationale: πολυλογία bedeutet Vielrederei beziehungsweise umfangreiches Reden; die Präpositionalphrase bezeichnet hier den vermeintlichen Grund der Erhörung.
- source_word: εἰσακουσθήσονται
  choice: erhört zu werden
  rationale: Das Passiv bezeichnet mehr als bloß akustisches Hören und meint, dass dem Gebet Gehör geschenkt wird. „Erhört“ ist dafür im deutschen Gebetskontext präzise, ohne ausdrücklich eine bestimmte Art der Antwort festzulegen.
theological_decisions:
- issue: Ob Jesus jede Wiederholung im Gebet oder leere, wortreiche Rede verbietet
  choice: „macht nicht viele leere Worte“ kennzeichnet inhaltsleere Wortfülle als Gegenstand des Verbots.
  alternative: „plappert nicht“ oder „wiederholt nicht gedankenlos immer dasselbe“
  rationale: Das seltene βατταλογέω bleibt semantisch nicht völlig sicher. Die gewählte Wiedergabe vermeidet die unbegründete Aussage, jede aufrichtige Wiederholung im Gebet sei verboten, und erhält zugleich die Kritik an Wortfülle als vermeintlichem Mittel, Gottes Gehör zu sichern.
- issue: Bedeutungsumfang von εἰσακουσθήσονται
  choice: „erhört zu werden“
  alternative: „gehört zu werden“
  rationale: Im Gebetszusammenhang bezeichnet das griechische Verb ein günstiges Gehör. „Erhört“ bildet diesen Sinn idiomatisch ab, ohne zu behaupten, dass jede erbetene Sache gewährt werde.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Ton. „Viele leere Worte machen“ ist natürlich und bewahrt die wahrscheinlich beabsichtigte Verbindung von Leere und Wortreichtum. Die Anrede steht entsprechend dem griechischen Plural im vertrauten „ihr“.
