  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: de
  text: Und vergib uns unsere Schulden[a], wie auch wir unseren Schuldnern vergeben haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ist von „Schulden“ die Rede; gemeint sein können hier Sünden oder Verfehlungen gegenüber Gott.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wie auch wir unseren Schuldnern vergaben“. Die griechische Verbform bezeichnet die Vergebung als vollzogene Handlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: vergib
  rationale: Der Aoristimperativ von ἀφίημι bezeichnet hier im Gebetszusammenhang das Erlassen moralischer Schuld; „vergib“ ist dafür die natürliche und präzise deutsche Wiedergabe.
- source_word: τὰ ὀφειλήματα
  choice: unsere Schulden
  rationale: ὀφειλήματα bezeichnet wörtlich das, was jemand schuldet. „Schulden“ bewahrt das Bild des Geschuldeten und zugleich die Wortverbindung mit „Schuldnern“.
- source_word: ὡς
  choice: wie
  rationale: ὡς stellt einen Vergleich zwischen der erbetenen Vergebung Gottes und der von den Betenden gewährten Vergebung her. „Wie“ erhält diese Beziehung, ohne sie näher zu deuten.
- source_word: καὶ ἡμεῖς
  choice: auch wir
  rationale: Das zweite καί und das ausdrücklich gesetzte Pronomen betonen die Betenden als ebenfalls Handelnde; „auch wir“ gibt diese Hervorhebung wieder.
- source_word: ἀφήκαμεν
  choice: vergeben haben
  rationale: Das deutsche Perfekt gibt die abgeschlossene Handlung des griechischen Aorists idiomatisch wieder und lässt ihre gegenwärtige Bedeutung im Gebet erkennen. Ein schlichtes Präteritum bleibt grammatisch möglich.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: unseren Schuldnern
  rationale: „Schuldnern“ erhält die etymologische und bildhafte Verbindung zu „Schulden“. Im Kontext sind damit diejenigen gemeint, die gegenüber den Betenden schuldig geworden sind.
theological_decisions:
- issue: Das Schuldenbild für moralische Verfehlungen
  choice: Das konkrete Bild „Schulden/Schuldner“ bleibt im Haupttext erhalten.
  alternative: „Verfehlungen“ oder „Sünden“ und „die, die an uns schuldig geworden sind“
  rationale: Der griechische Text spricht mit zwei verwandten Wörtern vom Geschuldeten und von Schuldnern. Eine direkte moralische Umschreibung wäre verständlicher, würde aber das bewusst verwendete Bild auflösen.
- issue: Verhältnis zwischen göttlicher und menschlicher Vergebung
  choice: Die vergleichende Formulierung „wie auch wir“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Eine Deutung als Bedingung, Maßstab oder Folge der göttlichen Vergebung
  rationale: ὡς bezeichnet den Vergleich, legt dessen genaue theologische Logik jedoch nicht vollständig fest. Die Übersetzung soll diese Spannung nicht einseitig auflösen.
- issue: Zeitliche Nuance von ἀφήκαμεν
  choice: „vergeben haben“
  alternative: „vergaben“
  rationale: Beide Wiedergaben sind für den Aorist möglich. Das Perfekt ist in modernem Standarddeutsch in diesem Zusammenhang natürlicher und stellt die Vergebung als vollzogen dar, ohne aus der Verbform allein eine weitergehende Lehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der vertrauten Gebetssprache „vergib uns“. Die wörtliche Schuldenmetapher und die Parallelität von „Schulden“ und „Schuldnern“ bleiben erhalten. Das Perfekt entspricht dem heutigen deutschen Sprachgebrauch; die mögliche Präteritumwiedergabe wird vermerkt.
