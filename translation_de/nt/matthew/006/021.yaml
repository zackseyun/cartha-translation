  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: de
  text: Denn wo dein Schatz ist, da wird auch dein Herz sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: wo
  rationale: Leitet einen lokativen Relativsatz ein; „wo“ ist im Deutschen natürlich und bewahrt die knappe Satzstruktur.
- source_word: γάρ
  choice: denn
  rationale: Kennzeichnet die Begründung für die vorausgehende Aufforderung und macht den erklärenden Zusammenhang deutlich.
- source_word: θησαυρός
  choice: Schatz
  rationale: Bewahrt sowohl die konkrete Bedeutung von angesammeltem Wert als auch die metaphorische Bedeutung im Kontext.
- source_word: σου
  choice: dein
  rationale: Gibt den possessiven Genitiv bei „Schatz“ und „Herz“ direkt und idiomatisch wieder.
- source_word: ἐκεῖ
  choice: da
  rationale: Entspricht im deutschen Korrelativgefüge natürlich dem vorausgehenden „wo“ und erhält den Parallelismus „wo … da“.
- source_word: ἔσται
  choice: wird … sein
  rationale: Bewahrt den Futur Indikativ von εἰμί, statt ihn zu einer zeitlosen Präsensform zu glätten.
- source_word: καρδία
  choice: Herz
  rationale: Die etablierte und semantisch weite Wiedergabe umfasst Begehren, Loyalität und innere Ausrichtung, ohne diese auf einen einzelnen Aspekt zu verengen.
- source_word: καὶ
  choice: auch
  rationale: Bewahrt den additiven Zusammenhang zwischen dem Ort des Schatzes und dem des Herzens.
theological_decisions:
- issue: Zeitliche Aussagekraft von ἔσται in einem weisheitlichen Ausspruch
  choice: Das Futur ausdrücklich mit „wird … sein“ wiedergeben.
  alternative: Das Präsens „ist“ verwenden, um eine zeitlose allgemeine Wahrheit auszudrücken.
  rationale: Der griechische Text hat eine Futurform. Ihre Beibehaltung wahrt die mögliche dynamische Aussage, dass sich das Herz dorthin ausrichtet, wo der Schatz liegt, ohne den Satz ausschließlich als statische Feststellung zu deuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Das traditionelle Korrelativgefüge „wo … da“ klingt natürlich und bildet die griechische Parallelstruktur präzise ab.
