id: MAT.6.4
reference: Matthew 6:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: de
  text: damit deine Gabe für die Armen[a] im Verborgenen bleibt; und dein Vater, der im Verborgenen sieht, wird dich belohnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Almosen“. Das griechische Wort bezeichnet ausdrücklich eine Gabe für Bedürftige.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird dir vergelten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck ein und verbindet den Vers mit der vorausgehenden Anweisung.
- source_word: ᾖ
  choice: bleibt
  rationale: Gibt den präsentischen Konjunktiv von εἰμί in natürlichem Deutsch wieder; gemeint ist, dass die Gabe der Öffentlichkeit verborgen bleibt.
- source_word: ἐλεημοσύνη
  choice: Gabe für die Armen
  rationale: Bezeichnet konkret eine Unterstützung Bedürftiger, nicht allgemein Barmherzigkeit oder institutionelle Wohltätigkeit.
- source_word: ἐν τῷ κρυπτῷ
  choice: im Verborgenen
  rationale: Bewahrt die Wiederholung in beiden Satzteilen und bezeichnet, was öffentlicher Wahrnehmung entzogen ist.
- source_word: ὁ πατήρ σου
  choice: dein Vater
  rationale: Folgt dem griechischen Wortlaut, ohne das hier nicht ausdrücklich vorhandene Adjektiv „himmlisch“ zu ergänzen.
- source_word: ὁ βλέπων
  choice: der … sieht
  rationale: Gibt das substantivierte Partizip als natürlichen deutschen Relativsatz wieder.
- source_word: ἀποδώσει σοι
  choice: wird dich belohnen
  rationale: Drückt in diesem Zusammenhang Gottes positive Antwort idiomatisch aus, ohne Art oder Zeitpunkt des Lohns festzulegen.
theological_decisions:
- issue: Art der göttlichen Vergeltung in ἀποδώσει
  choice: wird dich belohnen
  alternative: wird es dir vergelten
  rationale: „Belohnen“ wahrt den positiven Sinn, bestimmt aber nicht, ob die Antwort zeitlich oder ewig, materiell oder geistlich erfolgt. Die formal nähere Alternative „vergelten“ bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der mit „damit“ beginnende Satzanschluss an den vorhergehenden Vers bleibt erhalten. Die zweimalige Wendung „im Verborgenen“ bildet die Wiederholung des griechischen Textes ab.
