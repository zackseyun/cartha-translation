id: MAT.6.33
reference: Matthew 6:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: de
  text: Doch sucht zuerst sein Reich und seine Gerechtigkeit[a], und dies alles wird euch hinzugefügt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Recht“. Das griechische Wort kann Gerechtigkeit, rechtes Handeln oder Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: sucht
  rationale: Der Präsensimperativ im Plural bezeichnet eine fortdauernde, aktive Ausrichtung. „Sucht“ ist knapp, natürlich und bewahrt den Aufforderungscharakter.
- source_word: δὲ
  choice: doch
  rationale: Die Partikel markiert hier den Gegensatz zum besorgten Streben nach Nahrung, Trinken und Kleidung. „Doch“ gibt diese Wendung im Deutschen angemessen wieder.
- source_word: πρῶτον
  choice: zuerst
  rationale: „Zuerst“ bewahrt sowohl die Grundbedeutung als auch den Gedanken des Vorrangs, ohne ihn paraphrasierend zu verstärken.
- source_word: βασιλείαν
  choice: Reich
  rationale: βασιλεία kann Königsherrschaft, Herrschaft oder Reich bezeichnen. „Reich“ ist im Matthäusevangelium eine vertraute, zugleich hinreichend weite Wiedergabe, die Gottes königliche Herrschaft einschließen kann.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die natürliche deutsche Wiedergabe und lässt die im Kontext mögliche Breite von rechtem Verhältnis zu Gott, gottgemäßem Handeln und Recht bestehen.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Pronomen wird entsprechend dem Griechischen beibehalten. Aus dem Zusammenhang ist Gott beziehungsweise der Vater als Bezug klar.
- source_word: ταῦτα πάντα
  choice: dies alles
  rationale: Die Wendung verweist auf die zuvor genannten Lebensbedürfnisse. „Dies alles“ ist im Deutschen idiomatisch und bewahrt den rückverweisenden Charakter.
- source_word: προστεθήσεται
  choice: wird … hinzugefügt werden
  rationale: Das Futur Passiv wird formal bewahrt und hält den Gedanken fest, dass die genannten Dinge zusätzlich zukommen, ohne das Verb vorschnell als „versorgen“ auszulegen.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ wird mit „euch“ direkt und natürlich wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht; gerechtes Handeln
  rationale: Das deutsche „Gerechtigkeit“ kann sowohl die von Gott bestimmte rechte Lebensordnung und Lebensführung als auch den Aspekt des Rechts umfassen. Eine engere Festlegung würde die theologische Spannweite des griechischen Begriffs unnötig beschränken.
- issue: Bezug von αὐτοῦ
  choice: seine
  alternative: Gottes
  rationale: Das Pronomen spiegelt den griechischen Text und vermeidet eine unnötige Explizierung; der Bezug auf Gott beziehungsweise den Vater ergibt sich aus dem Kontext.
- issue: Passiv in προστεθήσεται
  choice: wird euch … hinzugefügt werden
  alternative: Gott wird euch … dazugeben
  rationale: Die passive Form bleibt erhalten. Dadurch wird Gott als implizit Handelnder nicht ausdrücklich in den Text eingesetzt, obwohl dies im Kontext naheliegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ stellt den Kontrast zum vorangehenden Sorgen und Streben heraus. Die traditionelle Wendung „sein Reich und seine Gerechtigkeit“ bleibt verständlich und wahrt die begriffliche Weite des Ausgangstextes.
