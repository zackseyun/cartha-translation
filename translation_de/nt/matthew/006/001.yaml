id: MAT.6.1
reference: Matthew 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: de
  text: Achtet aber darauf, eure Gerechtigkeit[a] nicht vor den Menschen zu üben, um von ihnen gesehen zu werden; sonst habt ihr keinen Lohn bei eurem Vater in den Himmeln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure gerechten Taten“. Einige Handschriften lesen: „euer Almosengeben“.'
    reason: lexical_alternative_and_textual_variant
  - marker: b
    text: Wörtlich steht im Griechischen der Plural „in den Himmeln“; häufig wird sinngemäß „im Himmel“ übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: Achtet darauf
  rationale: Der präsentische Imperativ fordert zu anhaltender Wachsamkeit auf. „Achtet darauf“ ist im modernen Deutschen natürlich und behält den warnenden Ton bei.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel kennzeichnet hier einen Übergang mit warnendem Gegensatz zur vorausgehenden Lehre.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Die SBLGNT-Lesart bezeichnet hier grundsätzlich die Gerechtigkeit beziehungsweise ihre praktische Ausübung. Die breite Bedeutung bleibt im Haupttext erhalten; konkretere Deutungen werden in der Fußnote genannt.
- source_word: μὴ ποιεῖν
  choice: nicht … zu üben
  rationale: „Gerechtigkeit üben“ gibt das Tun als gelebte Praxis idiomatisch wieder und wahrt die Verbindung zum abstrakten Substantiv.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: vor den Menschen
  rationale: Gemeint sind menschliche Beobachter allgemein; die im Deutschen generische und etablierte Wendung entspricht dem würdevollen Register.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: um von ihnen gesehen zu werden
  rationale: Die Formulierung bewahrt sowohl den ausdrücklichen Zweck als auch das Passiv des griechischen Ausdrucks.
- source_word: εἰ δὲ μή γε
  choice: sonst
  rationale: „Sonst“ gibt die konditionale Warnung knapp und idiomatisch wieder.
- source_word: μισθὸν
  choice: Lohn
  rationale: „Lohn“ ist die traditionelle und zugleich verständliche Bezeichnung für die hier gemeinte Vergeltung beziehungsweise Belohnung.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: bei eurem Vater
  rationale: παρά mit Dativ bezeichnet hier zunächst die Sphäre beziehungsweise Gegenwart des Vaters. „Bei“ wahrt diese Formulierung, ohne die mögliche Quellenbedeutung vorschnell festzulegen.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Der Plural des griechischen Textes und der charakteristische matthäische Sprachgebrauch bleiben sichtbar.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνην
  choice: Gerechtigkeit als umfassende gerechte Praxis
  alternative: gerechte Taten; Almosengeben
  rationale: Der Ausgangstext liest δικαιοσύνην und legt den Sinn daher nicht ausschließlich auf Almosen fest. Die konkrete praktische Bedeutung und die abweichende Lesart werden in einer Fußnote bewahrt.
- issue: Verhältnis des Lohns zum Vater bei παρὰ τῷ πατρὶ
  choice: Lohn „bei“ dem Vater
  alternative: Lohn „von“ dem Vater
  rationale: Die Dativkonstruktion kann Nähe beziehungsweise Gegenwart ausdrücken und im Zusammenhang zugleich den Vater als Geber nahelegen. „Bei“ lässt diese Spannung bestehen.
- issue: Plural τοῖς οὐρανοῖς
  choice: in den Himmeln
  alternative: im Himmel
  rationale: Die Wiedergabe im Plural folgt der griechischen Form und dem matthäischen Stil, ohne daraus eine besondere Kosmologie abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt gut verständlich, während „Gerechtigkeit“, „Lohn“ und der Plural „Himmel“ die theologischen und sprachlichen Konturen des griechischen Textes bewahren.
