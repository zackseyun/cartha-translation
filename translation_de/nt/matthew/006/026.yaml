source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: de
  text: 'Seht euch die Vögel am Himmel[a] an: Sie säen nicht, sie ernten nicht und sammeln nichts in Scheunen, und euer himmlischer Vater ernährt sie. Seid ihr nicht viel mehr wert als sie?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Vögel des Himmels“; traditionell auch: „die Vögel in der Luft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seid ihr ihnen nicht überlegen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Seht euch … an
  rationale: Der Aoristimperativ fordert zu gezielter Aufmerksamkeit auf. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt den Aufforderungscharakter.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel am Himmel
  rationale: πετεινά bezeichnet hier Vögel beziehungsweise fliegende Geschöpfe. „Am Himmel“ gibt den sichtbaren Himmelsraum idiomatisch wieder; die formal nähere Alternative „des Himmels“ wird in der Fußnote genannt.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt lässt die folgende Beobachtung als Inhalt beziehungsweise Begründung der Aufforderung verstehen, ohne die im Griechischen mögliche Nuance zwischen „dass“ und „denn/weil“ unnötig festzulegen.
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας
  choice: Sie säen nicht, sie ernten nicht und sammeln nichts in Scheunen
  rationale: Die landwirtschaftliche Bildsprache und die dreigliedrige Reihung bleiben erhalten. „Scheunen“ ist eine allgemein verständliche Entsprechung für landwirtschaftliche Vorratsgebäude.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: euer himmlischer Vater
  rationale: Die kompakte Wendung bewahrt sowohl die relationale Bezeichnung „Vater“ als auch das Attribut οὐράνιος.
- source_word: τρέφει
  choice: ernährt
  rationale: τρέφω bezeichnet hier Gottes Versorgung mit Nahrung. „Ernährt“ ist direkt und umfasst fortdauernde Versorgung.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Seid ihr nicht viel mehr wert als sie?
  rationale: Die rhetorische Frage erwartet Zustimmung. Im Kontext bezeichnet διαφέρω ein Übertreffen an Wert oder Bedeutung; „viel mehr wert“ gibt auch die verstärkende Vergleichsaussage von μᾶλλον natürlich wieder.
theological_decisions:
- issue: Der größere Wert der Menschen gegenüber den Vögeln in Jesu Argument
  choice: Die Angesprochenen werden ausdrücklich als viel mehr wert bezeichnet, ohne den Grund dafür näher zu bestimmen.
  alternative: Den größeren Wert ausdrücklich mit der Gottebenbildlichkeit oder ausschließlich mit einer Bundesbeziehung zu begründen.
  rationale: Der Vers behauptet den höheren vergleichenden Wert der Angesprochenen, nennt aber keine dogmatische Begründung. Die Übersetzung fügt keine hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Doppelpunkt bildet die offene Funktion von ὅτι natürlicher ab als ein schwerfälliges „dass“ und legt sich nicht ausdrücklich auf eine rein kausale Wiedergabe fest.
