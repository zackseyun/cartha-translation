  to: Darum macht euch keine Sorgen um morgen, denn der morgige Tag wird sich um sich selbst sorgen. Jeder Tag hat genug eigene Not[a].
  rationale: Die Revision stellt im zweiten Satz die Wiederholung von μεριμνάω durch „sich sorgen um“ wieder her und bewahrt damit die absichtliche Personifikation sowie den Zusammenhang mit dem Verbot, sich Sorgen zu machen. Die kontextuelle Übersetzung „Not“ bleibt bestehen; die Fußnote hält die alternative Bedeutung von κακία offen, ohne sie als streng wörtliche Gesamtübersetzung auszugeben.
