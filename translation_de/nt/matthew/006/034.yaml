    issue: „wird für sich selbst sorgen“ gibt μεριμνήσει nicht ausreichend parallel zu „macht euch keine Sorgen“ wieder.
    rationale: Das griechische Verb μεριμνάω wird in beiden Teilsätzen wiederholt und bezeichnet hier besorgtes Kümmern bzw. Sich-Sorgen. Die deutsche Konstruktion „für sich sorgen“ hat überwiegend die andere Bedeutung „für den eigenen Unterhalt bzw. Bedarf vorsorgen“.
  - severity: low
    issue: Die Fußnote bezeichnet eine freie deutsche Alternative als „wörtlicher“.
    rationale: „Jeder Tag hat genug eigenes Übel“ ist keine eng am griechischen Satzbau orientierte wörtliche Wiedergabe. Die Fußnote kann die mögliche Bedeutung von κακία nennen, ohne einen unzutreffenden Grad an Wörtlichkeit zu behaupten.
