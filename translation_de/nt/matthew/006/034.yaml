  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: de
  text: Darum macht euch keine Sorgen um morgen, denn der morgige Tag wird sich um sich selbst sorgen. Jeder Tag hat genug eigene Not[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jeder Tag hat genug eigenes Übel.« Das griechische Wort kann »Böses« oder »Übel« bedeuten; hier bezeichnet es wahrscheinlich die Not und Mühe des Tages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: macht euch keine Sorgen
  rationale: Das Verb bezeichnet im Zusammenhang von Matthäus 6,25–34 sorgendes, ängstliches Grübeln. Die Wendung ist natürliches modernes Deutsch und bewahrt den wiederkehrenden Leitbegriff.
- source_word: εἰς τὴν αὔριον
  choice: um morgen
  rationale: Mit μεριμνάω bezeichnet εἰς die Ausrichtung der Sorge auf den kommenden Tag; „um morgen“ gibt dies idiomatisch wieder.
- source_word: ἡ αὔριον
  choice: der morgige Tag
  rationale: Das substantivierte αὔριον wird personifiziert. „Der morgige Tag“ ermöglicht im Deutschen eine klare und natürliche Fortführung dieser Personifikation.
- source_word: μεριμνήσει αὑτῆς
  choice: wird für sich selbst sorgen
  rationale: Die Formulierung bewahrt die Personifikation und gibt das reflexive αὑτῆς ausdrücklich wieder. Im Deutschen lässt sich das Wortspiel mit „Sorgen“ und „sorgen“ natürlich nachvollziehen, ohne zu behaupten, der morgige Tag empfinde Angst.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Jeder Tag hat genug
  rationale: 'Das prädikative ἀρκετόν und der Dativ werden in verständlichem Deutsch distributiv wiedergegeben: Jedem einzelnen Tag genügt seine eigene Belastung.'
- source_word: ἡ κακία αὐτῆς
  choice: eigene Not
  rationale: κακία kann moralisches Böses, aber auch Übel, Not oder Plage bezeichnen. Im Kontext der Sorge um Lebensbedürfnisse bezeichnet „Not“ am ehesten die belastenden Schwierigkeiten des jeweiligen Tages; „eigene“ bildet den Rückbezug von αὐτῆς ab.
theological_decisions:
- issue: Bedeutung von κακία im abschließenden Weisheitsspruch
  choice: Not
  alternative: das Böse / Übel
  rationale: Der Zusammenhang behandelt die Sorge um den kommenden Tag. „Not“ wahrt den negativen und belastenden Sinn, ohne κακία hier unnötig auf moralische Bosheit festzulegen. Die mögliche wörtlichere Lesart wird in der Fußnote offengehalten.
- issue: Personifizierung des morgigen Tages
  choice: der morgige Tag wird für sich selbst sorgen
  alternative: morgen wird sich um sich selbst sorgen
  rationale: Die gewählte Form bewahrt die rhetorische Personifizierung und klingt zugleich in modernem Deutsch würdig und verständlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das Wortspiel zwischen „Sorgen“ und „sorgen“ sowie die Personifizierung des morgigen Tages bleiben erhalten; die Schlusszeile ist idiomatisch formuliert und ihre lexikalische Spannweite wird in der Fußnote dokumentiert.
