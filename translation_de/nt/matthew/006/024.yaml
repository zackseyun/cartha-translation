review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die universale Unmöglichkeitsaussage, die beiden alternativen Parallelglieder und den Wechsel von Singular („Niemand“) zu pluralischer direkter Anrede („Ihr“) korrekt wieder. „zwei Herren dienen“ vermittelt die durch κύριοις und δουλεύειν aufgerufene Dienst- bzw. Abhängigkeitsbeziehung. „sich an den einen halten“ ist eine treffende, idiomatische Wiedergabe von ἑνὸς ἀνθέξεται. Die Beibehaltung von „Mammon“ erhält den markierten aramäischen Lehnbegriff und dessen rhetorische Gegenüberstellung zu Gott.
  naturalness: Der Text ist flüssiges modernes Standarddeutsch mit würdigem, prägnantem Register. Die Wiederholung von „dienen“ und die klaren Gegensatzpaare entsprechen dem stilisierten Satzbau des griechischen Textes. „Niemand kann zwei Herren dienen“ ist zudem eine im Deutschen fest etablierte und verständliche Formulierung.
  terminology: „Herren“ ist im nichtgöttlichen sozialen Kontext von κύριοις angemessen; „Gott“ ist korrekt und ohne artikellose Zusatzdeutung wiedergegeben. „Mammon“ ist als bewusst beibehaltenes Lehnwort sachgerecht. Die Fußnote bietet die lexikalischen Alternativen „Reichtum“ und „Geld“ und erläutert die mögliche Personifizierung, ohne diese als zwingende dogmatische Aussage festzulegen.
