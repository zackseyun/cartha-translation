id: MAT.6.24
reference: Matthew 6:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: de
  text: Niemand kann zwei Herren dienen; denn entweder wird er den einen hassen und den anderen lieben, oder er wird sich an den einen halten und den anderen verachten. Ihr könnt nicht Gott und dem Mammon[a] dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Reichtum“ oder „dem Geld“. Im Griechischen steht das Lehnwort „Mammon“, das Reichtum wie einen rivalisierenden Herrn erscheinen lassen kann.'
    reason: Lexikalische Alternative und Erklärung der Personifizierung.
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Niemand
  rationale: Gibt die uneingeschränkte Verneinung natürlich und präzise wieder.
- source_word: δύναται / δύνασθε
  choice: kann / könnt nicht
  rationale: Die deutschen Modalverben geben die im Griechischen bezeichnete Fähigkeit beziehungsweise Unmöglichkeit idiomatisch wieder.
- source_word: δυσὶ κυρίοις
  choice: zwei Herren
  rationale: Im Zusammenhang des Sklaven- und Dienstverhältnisses bezeichnet κύριος die Herren, denen Dienst geschuldet wird; „Herren“ bewahrt zugleich die Würde und Prägnanz des Bildes.
- source_word: δουλεύειν
  choice: dienen
  rationale: Das Verb bezeichnet den Dienst eines Sklaven oder Knechts. Zusammen mit „Herren“ bleibt dieses Abhängigkeitsverhältnis erkennbar, ohne im Deutschen unnötig schwerfällig zu werden.
- source_word: μισήσει
  choice: wird ... hassen
  rationale: Bewahrt den starken Gegensatz zu „lieben“, ohne eine mögliche vergleichende Nuance stillschweigend in den Haupttext einzutragen.
- source_word: ἀγαπήσει
  choice: wird ... lieben
  rationale: Direkte und im antithetischen Satzbau natürliche Wiedergabe.
- source_word: ἑνὸς ἀνθέξεται
  choice: wird sich an den einen halten
  rationale: Gibt das Festhalten an beziehungsweise die loyale Bindung an einen Herrn konkret wieder und bleibt näher am Bild des griechischen Verbs als eine rein abstrakte Formulierung.
- source_word: καταφρονήσει
  choice: wird ... verachten
  rationale: Bewahrt die starke Bedeutung, jemanden geringzuschätzen oder mit Verachtung zu behandeln.
- source_word: θεῷ
  choice: Gott
  rationale: Standardmäßige Wiedergabe des Dativobjekts zu „dienen“.
- source_word: μαμωνᾷ
  choice: dem Mammon
  rationale: Das aramäische Lehnwort bleibt erhalten, sodass Reichtum im rhetorischen Gegensatz zu Gott als rivalisierender Herr erscheinen kann. Die Sachbedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von κύριος im gesellschaftlichen Dienstverhältnis
  choice: Herren
  alternative: Gebieter
  rationale: Der Plural steht hier im Bild eines Dienst- beziehungsweise Sklavenverhältnisses, nicht als unmittelbarer göttlicher Titel. „Herren“ ist die klare, geläufige deutsche Entsprechung und trägt das Bild.
- issue: Wiedergabe von μαμωνᾶς
  choice: Mammon
  alternative: Reichtum oder Geld
  rationale: Die Beibehaltung des Lehnworts erhält die Personifizierung als rivalisierenden Herrn. Eine direkte Übersetzung mit „Geld“ oder „Reichtum“ wäre verständlicher, würde aber diese rhetorische Spannung abschwächen; die Bedeutungsalternativen stehen deshalb in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einprägsame Satzbau und die scharfen Gegensatzpaare des griechischen Textes bleiben erhalten. „Sich an den einen halten“ ist gegenwärtig verständlich und bewahrt die konkrete Bindungsnuance von ἀντέχομαι.
