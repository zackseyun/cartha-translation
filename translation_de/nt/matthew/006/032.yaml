id: MAT.6.32
reference: Matthew 6:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: de
  text: Denn nach all diesen Dingen trachten die Völker[a]; denn euer himmlischer Vater weiß, dass ihr dies alles braucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Heiden« beziehungsweise »die Nichtjuden«. Der griechische Ausdruck bezeichnet allgemein die Völker, meint hier aber wahrscheinlich Menschen außerhalb des Bundesvolkes.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Die Grundbedeutung ist »die Völker«; im matthäischen Zusammenhang sind damit besonders die Menschen außerhalb des Bundesvolkes gemeint. Die Formulierung bewahrt die sprachliche Weite, ohne mit »Heiden« eine heute oft abwertend wirkende Färbung einzutragen.
- source_word: ἐπιζητοῦσιν
  choice: trachten nach
  rationale: »Nach etwas trachten« gibt das zielgerichtete, anhaltende Suchen des Verbs wieder und passt natürlich zum Gegenstand materieller Bedürfnisse.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: euer himmlischer Vater
  rationale: Diese idiomatische deutsche Fassung bewahrt sowohl die persönliche Zuordnung »euer« als auch die himmlische Kennzeichnung.
- source_word: οἶδεν
  choice: weiß
  rationale: Das formal perfekte οἶδα hat präsentische Bedeutung und wird im Deutschen treffend mit »weiß« wiedergegeben.
- source_word: χρῄζετε
  choice: ihr braucht
  rationale: Die Formulierung ist klar, modern und entspricht unmittelbar dem Sinn von χρῄζω.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: all diesen Dingen ... dies alles
  rationale: Die Wiederholung von »alles« bleibt erhalten; die leichte Variation entspricht natürlichem Deutsch und vermeidet eine schwerfällige wörtliche Wiederholung.
- source_word: γὰρ ... γὰρ
  choice: Denn ... denn
  rationale: Beide begründenden γάρ-Partikeln werden bewahrt, sodass der erklärende Gedankengang des griechischen Textes sichtbar bleibt.
theological_decisions:
- issue: Bezug von τὰ ἔθνη
  choice: die Völker
  alternative: die Heiden / die Nichtjuden
  rationale: »Die Völker« bewahrt die genuine lexikalische Breite. Der Kontext legt Menschen außerhalb des Bundesvolkes nahe, doch die Übersetzung soll diese historische und theologische Zuordnung nicht stärker festlegen als der griechische Ausdruck selbst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Trachten nach« ist gehoben, aber allgemein verständlich und trägt die Zielgerichtetheit des griechischen Verbs. Die zweimalige Begründung mit »denn« folgt bewusst der Struktur des Ausgangstextes.
