  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: de
  text: Und führe uns nicht in Versuchung[a], sondern rette uns vor dem Bösen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in eine Prüfung“ oder „in eine Erprobung“. Das griechische Wort kann sowohl Versuchung als auch eine prüfende Bedrängnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor dem Bösen“, verstanden als „vor dem Bösen“ im Sinn eines persönlichen Widersachers. Die griechische Form kann sowohl das Böse allgemein als auch den Bösen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: führe uns nicht
  rationale: Die mit μή verneinte Aorist-Konjunktivform steht hier in einer Gebetsbitte. „Führe uns nicht“ gibt die direkte Form des Griechischen natürlich und würdig wieder, ohne sie deutend zu „Lass nicht zu, dass …“ umzuschreiben.
- source_word: πειρασμόν
  choice: Versuchung
  rationale: πειρασμός kann sowohl die Verlockung zum Bösen als auch Prüfung oder Erprobung bezeichnen. „Versuchung“ ist im Deutschen die natürliche Hauptwiedergabe in diesem Gebet; die weitere Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: ῥῦσαι
  choice: rette
  rationale: Das Verb bezeichnet aktives Befreien oder Retten aus einer Gefahr. „Rette“ ist im heutigen Deutsch klar, kräftig und dem Gebetsregister angemessen.
- source_word: τοῦ πονηροῦ
  choice: dem Bösen
  rationale: Die artikulierte Form kann grammatisch unpersönlich „das Böse“ oder persönlich „der Böse“ bedeuten. „Dem Bösen“ wahrt im Haupttext eine natürliche, weniger festlegende deutsche Formulierung; die mögliche persönliche Deutung wird ausdrücklich in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von τοῦ πονηροῦ
  choice: dem Bösen
  alternative: 'dem Bösen (im Sinn: dem bösen [einen]) / dem Bösen schlechthin'
  rationale: Die griechische Genitivform ist zwischen einem substantivierten Neutrum („das Böse“) und Maskulinum („der Böse“) formal mehrdeutig. Der Haupttext entscheidet sich nicht ausdrücklich für Satan als persönlichen Referenten; die Fußnote bewahrt die genuine persönliche Lesart.
- issue: Gottes Führung und Versuchung
  choice: direkte Bitte „führe uns nicht“
  alternative: „Lass uns nicht in Versuchung geraten“
  rationale: Der griechische Text bittet unmittelbar darum, nicht in πειρασμόν hineingeführt zu werden. Eine erlaubende Umschreibung würde eine theologische Erklärung in den Wortlaut eintragen und die Spannung des Originals abschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetsrhythmus. Die traditionelle Wendung „führe uns nicht in Versuchung“ bleibt wegen ihrer Genauigkeit und Vertrautheit erhalten. „Rette“ ist gegenwärtiger als „erlöse“, ohne die Aussage abzuschwächen.
