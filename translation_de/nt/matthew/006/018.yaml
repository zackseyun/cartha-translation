id: MAT.6.18
reference: Matthew 6:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: de
  text: damit du nicht vor den Menschen als jemand erscheinst, der fastet, sondern vor deinem Vater, der im Verborgenen ist. Und dein Vater, der im Verborgenen sieht, wird dich belohnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck ein und gibt die finale Bedeutung knapp und natürlich wieder.
- source_word: μὴ φανῇς
  choice: du nicht … erscheinst
  rationale: Bewahrt den Gedanken des Wahrgenommenwerdens bzw. öffentlichen Erscheinens, ohne eine bewusste Selbstdarstellung stärker auszudrücken, als der griechische Text es tut.
- source_word: τοῖς ἀνθρώποις
  choice: vor den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein, nicht ausschließlich Männer. Die Präposition „vor“ macht im Deutschen die Rolle menschlicher Beobachter idiomatisch deutlich.
- source_word: νηστεύων
  choice: als Fastender
  rationale: Gibt das prädikative Partizip knapp wieder und erhält den Bezug darauf, als fastende Person wahrgenommen zu werden.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: sondern vor deinem Vater
  rationale: Stellt den menschlichen Beobachtern den Vater als den eigentlichen Adressaten der verborgenen Frömmigkeit gegenüber; „vor“ wird zur natürlichen deutschen Parallelführung wiederholt.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: der im Verborgenen ist
  rationale: Bewahrt die ausdrückliche Aussage über den Vater und legt κρυφαίῳ nicht unnötig auf einen konkreten geheimen Ort fest.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: der im Verborgenen sieht
  rationale: Erhält die knappe Form und die Wiederholung von „im Verborgenen“, ohne das nicht ausdrücklich vorhandene Objekt „was getan wird“ einzufügen.
- source_word: ἀποδώσει σοι
  choice: wird dich belohnen
  rationale: Gibt die kontextuelle Bedeutung göttlicher Vergeltung für die verborgene Frömmigkeit in geläufigem modernem Deutsch wieder.
theological_decisions:
- issue: Allgemeiner Bezug von ἀνθρώποις
  choice: „Menschen“ als geschlechtsübergreifende Bezeichnung
  alternative: „Männer“
  rationale: Im Kontext sind menschliche Beobachter allgemein gemeint; eine Beschränkung auf männliche Personen wäre sachlich irreführend.
- issue: Bedeutung von κρυφαίῳ in beiden Vorkommen
  choice: Beide Male „im Verborgenen“
  alternative: „an einem verborgenen Ort“ oder „im Geheimen“
  rationale: Die einheitliche Wiedergabe erhält die rhetorische Verbindung zwischen der verborgenen Gegenwart des Vaters und seinem Sehen, ohne den Ausdruck räumlich zu verengen.
- issue: Bedeutung von ἀποδώσει
  choice: „wird dich belohnen“
  alternative: „wird es dir vergelten“
  rationale: „Belohnen“ entspricht dem Zusammenhang, lässt aber die im Text bestehende Vorstellung einer göttlichen Antwort auf verborgenes Handeln bestehen, ohne Art oder Zeitpunkt des Lohns festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „vor den Menschen … sondern vor deinem Vater“ glättet den griechischen Dativ idiomatisch, während „als Fastender erscheinst“ die Bildlichkeit und den Gegensatz des Ausgangstextes bewahrt.
