source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: de
  text: 'Ein anderer von den Jüngern sagte zu ihm: »Herr, erlaube mir[a], zuerst wegzugehen und meinen Vater zu begraben.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »gestatte mir« oder »lass mich«.'
    reason: lexical_alternative
  - marker: b
    text: Die Bitte kann sich auf eine unmittelbar anstehende Bestattung beziehen oder allgemeiner darauf, seinen Pflichten als Sohn bis zum Tod seines Vaters nachzukommen; der griechische Text legt dies nicht fest.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος
  choice: ein anderer
  rationale: Bezeichnet eine weitere, von dem zuvor genannten Sprecher unterschiedene Person; »ein anderer« ist im Deutschen natürlich und wahrt den Bezug zum vorangehenden Kontext.
- source_word: δὲ
  choice: unübersetzt
  rationale: Die schwache weiterführende Partikel wird durch die deutsche Satzfolge ausreichend wiedergegeben; ein ausdrückliches »aber« würde einen stärkeren Gegensatz nahelegen, als der griechische Text erkennen lässt.
- source_word: τῶν μαθητῶν
  choice: von den Jüngern
  rationale: Die Genitivkonstruktion ordnet den Sprecher der Gruppe der Jünger zu. »Von den Jüngern« gibt dies knapp und idiomatisch wieder.
- source_word: Κύριε
  choice: Herr
  rationale: Die übliche Anrede »Herr« bewahrt sowohl den respektvollen Ton als auch das mögliche theologische Gewicht des Titels.
- source_word: ἐπίτρεψόν μοι
  choice: erlaube mir
  rationale: Die Wendung bittet um Erlaubnis. »Erlaube mir« klingt respektvoll und zugleich natürlich; auch »gestatte mir« oder »lass mich« wären möglich.
- source_word: πρῶτον
  choice: zuerst
  rationale: Drückt den zeitlichen beziehungsweise sachlichen Vorrang der erbetenen Handlung aus, ohne deren Dauer festzulegen.
- source_word: ἀπελθεῖν
  choice: wegzugehen
  rationale: Gibt neben dem Gehen auch die Bewegung fort vom gegenwärtigen Ort wieder.
- source_word: θάψαι τὸν πατέρα μου
  choice: meinen Vater zu begraben
  rationale: Direkte und idiomatische Wiedergabe des Infinitivs mit seinem Objekt.
theological_decisions:
- issue: Zeitlicher und kultureller Sinn der Bitte, den Vater zu begraben
  choice: Die Bitte wird ihrem Wortlaut entsprechend wiedergegeben, ohne festzulegen, ob der Vater bereits gestorben ist.
  alternative: Die Aussage ausdrücklich entweder auf eine unmittelbar bevorstehende Bestattung oder auf die längerfristige Sohnespflicht bis zum Tod des Vaters beziehen.
  rationale: Der griechische Text nennt keinen Zeitpunkt des Todes und entscheidet nicht zwischen diesen Deutungen. Die Übersetzung bewahrt daher die genuine Offenheit; die Fußnote macht sie sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt respektvoll, aber allgemein verständlich. Die Satzstellung hält »zuerst« eng bei der erbetenen Handlung und bewahrt dadurch die im Ausgangstext angelegte Spannung zwischen Nachfolge und familiärer Pflicht.
