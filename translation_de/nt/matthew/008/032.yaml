  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des griechischen Textes präzise wieder: den knappen Befehl, das Ausfahren und Eingehen in die Schweine, den hervorgehobenen Erzählumschwung, das Hinabstürmen der ganzen Herde sowie den zurückhaltend formulierten Tod im Wasser. „Die Tiere“ ist jedoch im griechischen Text nicht ausdrücklich gesetzt; der Plural von ἀπέθανον genügt, um sich auf die Schweine zu beziehen.'
  naturalness: Modernes Standarddeutsch ist insgesamt gelungen. Die Stellung der Fußnoten sollte unmittelbar bei den jeweiligen Bezugswörtern erfolgen. „Und sie starben im Wasser“ ist klar und natürlich; nach „die ganze Herde“ ist das Pronomen ausreichend verständlich und vermeidet die ergänzende Benennung „die Tiere“.
  terminology: „Schweine“, „Herde“, „Steilhang“ und „Meer“ sind treffende, moderne Wiedergaben. „Und siehe“ bewahrt den markierten, leicht gehobenen Erzählton von ἰδού. Die Todesaussage soll nicht mit „ertranken“ im Haupttext spezifiziert werden.
