source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Geht!“ Da kamen sie heraus und gingen in die Schweine. Und siehe, die ganze Herde stürmte den Steilhang hinab[a] ins Meer, und sie starben im Wasser.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Abhang hinab“ beziehungsweise „die Klippe hinab“. Das griechische Wort bezeichnet einen steilen Abhang oder einen Felsabsturz.'
    reason: lexical_alternative
  - marker: b
    text: 'Als Deutung des Geschehens auch: „und ertranken“. Wörtlich heißt es: „und sie starben im Wasser“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Geht!
  rationale: Der knappe Imperativ gibt Jesu kurzen Befehl natürlich und ohne zusätzliche Nuance wieder.
- source_word: ἐξελθόντες
  choice: kamen sie heraus
  rationale: Die Form bezeichnet das Herauskommen der Dämonen aus den Besessenen; die deutsche Formulierung bleibt im Erzählfluss natürlich.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: gingen in die Schweine
  rationale: Die Wendung beschreibt unmittelbar den Übergang der Dämonen in die Tiere, ohne den Vorgang weiter auszudeuten.
- source_word: ἰδοὺ
  choice: und siehe
  rationale: Der Aufmerksamkeitsruf bewahrt die Lebendigkeit und den nachdrücklichen Übergang des griechischen Erzähltextes; die Wendung ist im Deutschen gehoben, aber weiterhin allgemein verständlich.
- source_word: πᾶσα ἡ ἀγέλη
  choice: die ganze Herde
  rationale: Dies gibt sowohl den Kollektivbegriff als auch die umfassende Bedeutung von πᾶσα präzise und idiomatisch wieder.
- source_word: ὥρμησεν
  choice: stürmte
  rationale: Das Verb bezeichnet eine plötzliche, heftige Bewegung; „stürmte“ wahrt diese Dynamik, ohne zusätzliche Absicht zuzuschreiben.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: den Steilhang hinab
  rationale: κρημνός kann einen steilen Abhang oder eine Klippe bezeichnen. „Steilhang“ ist anschaulich, ohne zwingend eine senkrechte Felswand vorauszusetzen.
- source_word: εἰς τὴν θάλασσαν
  choice: ins Meer
  rationale: „Meer“ entspricht unmittelbar θάλασσα und bewahrt die Bezeichnung des Ausgangstextes.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: die Tiere starben im Wasser
  rationale: Die Formulierung hält sich an das ausdrücklich Gesagte. „Die Tiere“ macht den im Griechischen durch den Numeruswechsel erkennbaren Bezug auf die einzelnen Schweine im Deutschen verständlich.
theological_decisions:
- issue: Art des Todes der Schweine
  choice: starben im Wasser
  alternative: ertranken im Wasser
  rationale: Der Zusammenhang legt Ertrinken nahe, doch der griechische Text sagt wörtlich nur, dass sie im Wasser starben. Die Übersetzung lässt diese geringe Differenz zwischen Aussage und Schlussfolgerung bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Und siehe“ bewahrt bewusst den rhetorischen Aufmerksamkeitsruf des Originals; ansonsten werden unnötig altertümliche Wendungen vermieden.
