id: MAT.8.17
reference: Matthew 8:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: de
  text: 'damit erfüllt würde, was durch den Propheten Jesaja gesagt worden war: „Er selbst nahm unsere Schwächen[a] und trug unsere Krankheiten[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebrechen“ beziehungsweise „Krankheiten“. Das griechische Wort kann Schwächen, Gebrechen oder Erkrankungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Trug“ kann auch im Sinn von „auf sich nahm“ verstanden werden und bewahrt die sprachliche Verbindung zu Jesaja 53,4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: damit sich erfüllte
  rationale: Gibt die mit ὅπως eingeleitete Ziel- bzw. Ergebnisbeziehung und das matthäische Erfüllungsmotiv knapp und idiomatisch wieder.
- source_word: τὸ ῥηθὲν
  choice: was … gesagt worden war
  rationale: Natürliche Wiedergabe des substantivierten Passivpartizips; das Plusquamperfekt ordnet den früher ergangenen Prophetenspruch verständlich ein.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: durch den Propheten Jesaja
  rationale: '„Durch“ bewahrt διά mit Genitiv als vermittelnde Urheberschaft: Der Ausspruch erging durch den Propheten.'
- source_word: λέγοντος
  choice: Doppelpunkt vor dem Zitat
  rationale: Im Deutschen führt ein Doppelpunkt das inhaltlich folgende Zitat natürlicher ein als ein zusätzliches „der sagte“ oder „mit den Worten“.
- source_word: Αὐτὸς
  choice: Er selbst
  rationale: Bewahrt die ausdrückliche Hervorhebung des Pronomens.
- source_word: ἀσθενείας
  choice: Schwächen
  rationale: Erhält die semantische Breite von körperlichen Schwächen, Gebrechen und Krankheiten; der unmittelbare Heilungskontext wird durch die alternative Fußnote berücksichtigt.
- source_word: ἔλαβεν
  choice: nahm
  rationale: Direkte Wiedergabe von λαμβάνω, ohne deutend „nahm weg“ zu ergänzen oder den Unterschied zum folgenden Verb einzuebnen.
- source_word: νόσους
  choice: Krankheiten
  rationale: Präzise und im modernen Deutsch natürliche Bezeichnung körperlicher Erkrankungen.
- source_word: ἐβάστασεν
  choice: trug
  rationale: Gibt βαστάζω eng wieder und bewahrt zugleich die Verbindung zur Bildsprache von Jesaja 53, ohne deren theologische Tragweite näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Zitats aus Jesaja 53,4 im Heilungskontext
  choice: „Schwächen“ und „Krankheiten“
  alternative: „Gebrechen“ bzw. „Leiden“ und „Krankheiten“
  rationale: Matthäus bezieht das Zitat im unmittelbaren Zusammenhang auf Jesu Heilungen. „Schwächen“ wahrt dennoch die weitere Bedeutung von ἀσθένεια, während „trug“ die mögliche theologische Resonanz des Jesajazitats offenhält, ohne eine bestimmte Sühnelehre in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der matthäischen Erfüllungsformel; das Zitat ist zugleich für heutige Leser unmittelbar verständlich.
