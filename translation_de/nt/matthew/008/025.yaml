  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Textes zuverlässig wieder: Die Jünger nähern sich Jesus, wecken ihn und richten eine dringliche Bitte an ihn. »Rette uns« gibt σῶσον in der konkreten Gefahrensituation treffend wieder; »Wir kommen um« bildet ἀπολλύμεθα als gegenwärtig drohenden Untergang angemessen ab.'
  naturalness: Modernes, gut verständliches Standarddeutsch. Die Auflösung der griechischen Partizipien in zwei Hauptsätze ist flüssig und wahrt die Abfolge. Die knappe direkte Rede hat einen passenden dringlichen Ton.
  terminology: »Herr« wahrt die für κύριε mögliche Spannweite zwischen respektvoller Anrede und weiterem christologischem Gewicht. »Rette uns« ist idiomatisch und kontextgerecht. Die Fußnote zu »Wir kommen um« bietet mit »Wir gehen unter« eine plausible, kontextnahe lexikalische Alternative, ohne den Sinn einzuengen.
