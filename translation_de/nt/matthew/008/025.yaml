id: MAT.8.25
reference: Matthew 8:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: de
  text: 'Da traten sie zu ihm und weckten ihn. Sie sagten: »Herr, rette uns! Wir kommen um!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir gehen unter!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: Da traten sie zu ihm
  rationale: Das Aoristpartizip bezeichnet ihre Annäherung an Jesus vor dem Wecken. »Zu ihm treten« gibt die Bewegung natürlich wieder; das im Griechischen aus dem Zusammenhang erschlossene Ziel wird im Deutschen idiomatisch ausgedrückt.
- source_word: ἤγειραν
  choice: weckten ihn
  rationale: ἐγείρω bezeichnet hier konkret das Aufwecken eines Schlafenden und nicht ein Aufrichten oder Auferwecken.
- source_word: λέγοντες
  choice: Sie sagten
  rationale: Das Partizip führt den Inhalt ihrer Rede ein. Ein neuer Hauptsatz klingt im modernen Deutsch natürlich, ohne zusätzliche emotionale Färbung wie »sie schrien« einzutragen.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος wird als »Herr« wiedergegeben. So bleibt offen, ob hier vor allem eine respektvolle Anrede oder ein weiter reichender christologischer Titel mitschwingt.
- source_word: σῶσον
  choice: rette uns
  rationale: Der Aoristimperativ von σῴζω ist hier der dringende Ruf nach unmittelbarer Rettung aus Gefahr. Das Objekt »uns« ist im Kontext und durch das folgende »wir« eindeutig und im Deutschen idiomatisch erforderlich.
- source_word: ἀπολλύμεθα
  choice: Wir kommen um
  rationale: Die präsentische Form bezeichnet drohenden Untergang beziehungsweise Tod. »Wir kommen um« ist im heutigen Deutsch unmittelbar verständlich und bewahrt die akute Dringlichkeit.
theological_decisions:
- issue: κύριος als Anrede für Jesus
  choice: Herr
  alternative: Meister
  rationale: »Herr« bewahrt sowohl die mögliche respektvolle Anrede als auch das stärkere christologische Gewicht, ohne die Stelle auf nur eine dieser Nuancen festzulegen.
- issue: Explizites Objekt bei σῶσον
  choice: rette uns
  alternative: rette
  rationale: Das Griechische nennt beim Imperativ kein eigenes Objekt; aus dem unmittelbar folgenden »wir kommen um« ergibt sich jedoch eindeutig, wer gerettet werden soll. Im Deutschen ist »uns« die natürliche Ergänzung.
- issue: Wiedergabe von ἀπολλύμεθα
  choice: Wir kommen um
  alternative: Wir gehen unter
  rationale: Beide können den drohenden Tod ausdrücken. »Wir kommen um« hält den Schwerpunkt auf der Lebensgefahr, ohne ausdrücklich festzulegen, ob das Boot sinkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzer, dringlicher direkter Rede. Die Partizipialkonstruktionen werden zur besseren Lesbarkeit in finite Sätze aufgelöst. Der Fußnotenmarker steht nach dem Ausdruck, auf den sich die Alternative bezieht.
