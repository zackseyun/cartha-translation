id: MAT.8.2
reference: Matthew 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: de
  text: 'Und siehe: Ein Aussätziger kam zu ihm, warf sich vor ihm nieder[a] und sagte: »Herr, wenn du willst, kannst du mich reinigen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »betete ihn an«. Das griechische Verb kann je nach Zusammenhang ein ehrerbietiges Niederwerfen, eine Huldigung oder Anbetung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt die aufmerksamkeitslenkende und die Erzählung belebende Funktion der Partikel in einer knappen, verständlichen Form.
- source_word: λεπρὸς
  choice: ein Aussätziger
  rationale: Gibt das substantivisch gebrauchte Adjektiv knapp und traditionell wieder. Gemeint ist eine Person mit einer als Aussatz bezeichneten Hautkrankheit; der antike Begriff entspricht nicht zwingend der heutigen medizinischen Lepra.
- source_word: προσελθὼν
  choice: kam zu ihm
  rationale: Drückt die auf Jesus gerichtete Annäherung natürlich und vollständig aus.
- source_word: προσεκύνει
  choice: warf sich vor ihm nieder
  rationale: Bezeichnet eine ehrerbietige körperliche Geste und lässt offen, ob hier darüber hinaus ausdrücklich Anbetung gemeint ist.
- source_word: Κύριε
  choice: Herr
  rationale: Bewahrt sowohl die respektvolle Anrede als auch das mögliche christologische Gewicht des Titels.
- source_word: ἐὰν θέλῃς
  choice: wenn du willst
  rationale: Gibt die Bedingung, die sich auf Jesu Willen richtet, in natürlichem modernem Deutsch wieder.
- source_word: δύνασαί
  choice: kannst du
  rationale: Drückt Jesu Fähigkeit beziehungsweise Macht idiomatisch aus.
- source_word: καθαρίσαι
  choice: mich rein machen
  rationale: Bewahrt neben der körperlichen Heilung auch die Reinheitsthematik, die bei Aussatz kultische Bedeutung hat.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber Jesus
  choice: warf sich vor ihm nieder
  alternative: betete ihn an
  rationale: Das Verb kann Niederwerfung, Huldigung oder Anbetung bezeichnen. Die gewählte Formulierung gibt die sichtbare ehrerbietige Handlung wieder, ohne die theologische Bedeutungsbreite vorschnell festzulegen.
- issue: Bedeutung der Anrede Κύριε
  choice: Herr
  alternative: mein Herr / Herr und Meister
  rationale: »Herr« erhält die mögliche Spannung zwischen respektvoller Anrede und christologischem Titel, ohne eine Lesart auszuschließen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der einleitende Aufmerksamkeitsruf »sieh« ist bewusst markiert. »Rein machen« erhält die körperliche und kultische Dimension von καθαρίζω; die Fußnote bewahrt die Bedeutungsbreite von προσκυνέω.
