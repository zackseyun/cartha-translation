id: MAT.8.29
reference: Matthew 8:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: de
  text: 'Und siehe, sie schrien: »Was haben wir mit dir zu schaffen[a], Sohn Gottes? Bist du hierhergekommen, um uns vor der bestimmten Zeit[b] zu quälen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was ist uns und dir?« Die Wendung drückt Abgrenzung oder Zurückweisung aus; sinngemäß auch: »Was willst du von uns?«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vor der Zeit«. Das griechische Wort kann eine festgesetzte oder passende Zeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Und sieh da
  rationale: Bewahrt den Aufmerksamkeit weckenden, die Szene vergegenwärtigenden Diskursmarker, ohne ihn auszulassen.
- source_word: ἔκραξαν λέγοντες
  choice: sie schrien
  rationale: κράζω bezeichnet lautes Rufen oder Schreien. Das im Griechischen idiomatische λέγοντες muss im Deutschen nicht zusätzlich mit „und sagten“ wiedergegeben werden, da die direkte Rede den Inhalt bereits einführt.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Was haben wir mit dir zu schaffen
  rationale: Gibt die abgrenzende und herausfordernde Kraft der semitisch geprägten Wendung verständlich wieder und bleibt ihrer Form näher als „Was willst du von uns?“
- source_word: υἱὲ τοῦ θεοῦ
  choice: Sohn Gottes
  rationale: Direkte Wiedergabe des christologischen Anredetitels.
- source_word: ἦλθες ὧδε
  choice: Bist du hierhergekommen
  rationale: Das Perfekt entspricht im Deutschen natürlich einer Ankunft, deren Zweck und gegenwärtige Folgen erfragt werden; ὧδε wird ausdrücklich lokal wiedergegeben.
- source_word: πρὸ καιροῦ
  choice: vor der bestimmten Zeit
  rationale: καιρός kann eine festgesetzte oder angemessene Zeit bezeichnen. „Bestimmte Zeit“ erhält diese mögliche Nuance, ohne ausdrücklich zu benennen, wer sie bestimmt hat.
- source_word: βασανίσαι ἡμᾶς
  choice: um uns zu quälen
  rationale: Der finale Infinitiv wird natürlich mit „um … zu“ wiedergegeben; βασανίζω bezeichnet hier schweres Quälen im Zusammenhang mit Gericht.
theological_decisions:
- issue: Identität Jesu in der Anrede der Dämonen
  choice: Sohn Gottes
  alternative: Gottessohn
  rationale: „Sohn Gottes“ gibt den ausdrücklichen Titel transparent und ohne Abschwächung oder dogmatische Erweiterung wieder.
- issue: Eschatologische Nuance von καιρός
  choice: vor der bestimmten Zeit
  alternative: vor der Zeit
  rationale: Die gewählte Fassung lässt erkennen, dass eine feststehende Zeit des Gerichts gemeint sein kann, ohne den im Ausdruck nicht ausdrücklich genannten göttlichen Urheber ergänzend in den Haupttext einzutragen.
- issue: Zweck oder Ergebnis des Kommens
  choice: um uns … zu quälen
  alternative: sodass du uns … quälst
  rationale: Der Aoristinfinitiv βασανίσαι wird im Kontext am natürlichsten final verstanden; die fragende Form und die Furcht der Sprecher bleiben erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh da“ bewahrt die auffordernde Lebendigkeit von ἰδού; die leicht gehobene Wendung „mit dir zu schaffen haben“ spiegelt das griechische Idiom, bleibt aber allgemein verständlich. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
