id: MAT.8.13
reference: Matthew 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: de
  text: 'Da sagte Jesus zu dem Hauptmann: „Geh! Wie du geglaubt hast, so soll es dir geschehen.“ Und sein Diener[a] wurde in jener Stunde geheilt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Junge“ oder „Kind“; das griechische Wort παῖς kann einen Diener oder einen jungen Menschen bezeichnen. In diesem Zusammenhang passt „Diener“ am besten zu dem Untergebenen des Hauptmanns.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: Hauptmann
  rationale: Die im Deutschen vertraute und präzise Bezeichnung für einen römischen Offizier, der ungefähr hundert Soldaten befehligte.
- source_word: Ὕπαγε
  choice: Geh!
  rationale: Gibt den Imperativ der Fortbewegung knapp, natürlich und ohne zusätzliche Deutung wieder.
- source_word: ὡς ἐπίστευσας
  choice: Wie du geglaubt hast
  rationale: Bewahrt die verbale und persönliche Formulierung des Griechischen, statt sie abstrahierend mit „nach deinem Glauben“ wiederzugeben.
- source_word: γενηθήτω σοι
  choice: so soll es dir geschehen
  rationale: Gibt den jussiven passiven Imperativ würdig und idiomatisch wieder; „so“ stellt im Deutschen den Bezug zu „wie“ klar her.
- source_word: παῖς
  choice: Diener
  rationale: Im Zusammenhang mit dem Untergebenen des Hauptmanns ist „Diener“ am wahrscheinlichsten; die ebenfalls möglichen Bedeutungen „Junge“ und „Kind“ werden in einer Fußnote bewahrt.
- source_word: ἰάθη
  choice: wurde … geheilt
  rationale: Entspricht dem Passiv von ἰάομαι und bezeichnet die Wiederherstellung von der Krankheit.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: in jener Stunde
  rationale: Bewahrt den griechischen Zeitausdruck, ohne ihn enger als „in genau diesem Augenblick“ auszulegen.
theological_decisions:
- issue: Wiedergabe von πιστεύω
  choice: geglaubt hast
  alternative: vertraut hast; Glauben hattest
  rationale: „Glauben“ ist die direkte, geläufige Wiedergabe und bewahrt hier die persönliche Verbform, ohne den Ausdruck in eine theologisch stärker ausgelegte Nominalform umzuwandeln.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem biblischem Ton. „Hauptmann“ ist im deutschen Bibelgebrauch vertrauter als das fachsprachliche „Zenturio“. Die Korrespondenz „Wie …, so …“ bildet die griechische Satzbeziehung klar und natürlich ab.
