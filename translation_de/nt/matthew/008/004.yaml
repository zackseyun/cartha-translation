id: MAT.8.4
reference: Matthew 8:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihm: „Sieh zu, dass du niemandem etwas sagst. Geh vielmehr hin, zeige dich dem Priester und bring die Gabe dar, die Mose angeordnet hat,[a] ihnen zum Zeugnis.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Anweisung entspricht dem von Mose vorgeschriebenen Verfahren für einen vom Aussatz Gereinigten; siehe 3. Mose 14.
    reason: cross_reference
  - marker: b
    text: 'Oder: „ihnen als Beweis“. Wer mit „ihnen“ gemeint ist, bleibt im griechischen Text offen; manche verstehen die Wendung auch als ein Zeugnis gegen diejenigen, die nicht glauben würden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Sieh zu, dass du niemandem etwas sagst
  rationale: Ὅρα leitet idiomatisch eine eindringliche Aufforderung ein; die Konstruktion mit dem Konjunktiv drückt ein Verbot aus. Die deutsche Formulierung bewahrt Nachdruck und natürlichen Sprachfluss.
- source_word: ἀλλὰ ὕπαγε
  choice: Geh vielmehr hin
  rationale: ἀλλά setzt die gebotene Handlung deutlich vom vorherigen Verbot ab. „Vielmehr“ gibt diesen Kontrast wieder; „geh hin“ entspricht dem Bewegungsimperativ.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: zeige dich dem Priester
  rationale: Die reflexive Konstruktion wird direkt wiedergegeben und lässt den Bezug auf die priesterliche Untersuchung erkennen, ohne ihn in den Haupttext hineinzuerklären.
- source_word: προσένεγκον τὸ δῶρον
  choice: bring die Gabe dar
  rationale: „Darbringen“ trägt dem kultischen Zusammenhang von προσφέρω Rechnung; „Gabe“ ist eine direkte und im religiösen Kontext verständliche Wiedergabe von δῶρον.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: die Mose angeordnet hat
  rationale: προστάσσω bezeichnet hier eine verbindliche Anordnung. „Angeordnet“ klingt im Deutschen bei einer vorgeschriebenen kultischen Handlung natürlicher als „befohlen“, ohne die Verbindlichkeit abzuschwächen.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ihnen zum Zeugnis
  rationale: Die knappe Formulierung bewahrt sowohl den offenen Bezug von αὐτοῖς als auch die mögliche Bandbreite von μαρτύριον als Zeugnis oder Beleg und legt weder eine positive noch eine anklagende Funktion fest.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: Das historische Präsens wird entsprechend natürlicher deutscher Erzählweise im Präteritum wiedergegeben.
theological_decisions:
- issue: Bezug und Funktion von εἰς μαρτύριον αὐτοῖς
  choice: „ihnen zum Zeugnis“ mit unbestimmtem Pronomen und offener Funktion
  alternative: „den Priestern als Beweis“ oder „zum Zeugnis gegen sie“
  rationale: Der griechische Text nennt den Bezug von αὐτοῖς nicht ausdrücklich; auch μαρτύριον entscheidet nicht eindeutig zwischen bestätigendem Beleg und belastendem Zeugnis. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich und klar; kultische Begriffe werden verständlich, aber nicht paraphrasierend wiedergegeben. Sämtliche Fußnotenmarker stehen im Haupttext.
