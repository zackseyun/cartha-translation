id: MAT.8.11
reference: Matthew 8:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: de
  text: 'Ich sage euch aber: Viele werden von Osten und Westen[b] kommen und mit Abraham, Isaak und Jakob im Himmelreich zu Tisch liegen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezeichnet das Einnehmen eines Platzes bei einem Festmahl; in der Antike lag man dabei zu Tisch.
    reason: cultural_note
  - marker: b
    text: „Von Osten und Westen“ bezeichnet Menschen aus weit entfernten Gegenden und schließt im Zusammenhang wahrscheinlich auch Menschen außerhalb Israels ein.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ich sage euch aber
  rationale: λέγω bedeutet hier „sagen“, während δέ einen leichten Gegensatz beziehungsweise eine Weiterführung gegenüber dem Vorhergehenden markiert. Die Nachstellung von „aber“ ist im Deutschen natürlich und bewahrt diesen Diskurswechsel.
- source_word: πολλοὶ
  choice: Viele
  rationale: Das Adjektiv wird substantivisch gebraucht. „Viele“ gibt dies knapp und idiomatisch wieder, ohne eine Personengruppe ausdrücklich zu benennen, die der griechische Text nicht nennt.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: von Osten und Westen
  rationale: Die Pluralformen bezeichnen idiomatisch Himmelsrichtungen beziehungsweise weit auseinanderliegende Regionen. „Von Osten und Westen“ ist natürliches Deutsch und erhält die geografische Weite.
- source_word: ἥξουσιν
  choice: werden … kommen
  rationale: ἥκω bedeutet „kommen“ oder „eintreffen“. In Verbindung mit der Herkunftsangabe ist „kommen“ die schlichteste und passendste Wiedergabe.
- source_word: ἀνακλιθήσονται
  choice: werden sich … zu Tisch legen
  rationale: Das Verb bezeichnet das Niederlegen beziehungsweise Zurücklehnen bei einer Mahlzeit. „Sich zu Tisch legen“ bewahrt die antike Bankettszene und macht den Mahlkontext verständlich, ohne ihn zu einer bloßen Anwesenheitsaussage abzuflachen.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: mit Abraham, Isaak und Jakob
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft; hier ist es die Tischgemeinschaft. Die Namen folgen ihren geläufigen deutschen Formen.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: im Himmelreich
  rationale: „Himmelreich“ ist eine etablierte, natürliche deutsche Wiedergabe der für Matthäus charakteristischen Wendung und wahrt den Singular von βασιλεία. Sie bezeichnet Gottes himmlische Königsherrschaft beziehungsweise deren Reich, nicht lediglich einen Ort im Himmel.
theological_decisions:
- issue: Bankettbild und endzeitliche Gemeinschaft
  choice: Das Mahlbild wird mit „sich … zu Tisch legen“ beibehalten.
  alternative: „mit Abraham, Isaak und Jakob zusammensitzen“
  rationale: Der Vers zeichnet eine Bankettszene und damit Gemeinschaft, nicht bloß räumliche Anwesenheit. Die Übersetzung bewahrt dieses Bild, ohne zusätzliche Lehraussagen einzutragen.
- issue: Identität der Vielen aus Osten und Westen
  choice: Die geografische Formulierung bleibt stehen; die Vielen werden nicht ausdrücklich als Nichtjuden bezeichnet.
  alternative: „Viele Nichtjuden werden von Osten und Westen kommen“
  rationale: Der Kontext legt die Einbeziehung von Menschen außerhalb Israels nahe, doch der griechische Wortlaut sagt lediglich „Viele“. Die Übersetzung bewahrt diese Implikation, ohne sie im Haupttext festzuschreiben.
- issue: Bedeutung von „Himmelreich“
  choice: Die traditionelle matthäische Wendung wird ohne erklärende Erweiterung im Haupttext verwendet.
  alternative: „in der Königsherrschaft des Himmels“
  rationale: Die knappe Form erhält die vertraute Ausdrucksweise und lässt die Spannung zwischen Herrschaft und Reich bestehen, statt sie einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Text, klingt jedoch natürlich. „Zu Tisch legen“ ist bewusst etwas ungewohnt, damit die antike Mahlpraxis und das Bankettbild sichtbar bleiben; Fußnote [a] erläutert dies. Sämtliche Fußnotenmarker stehen im Haupttext.
