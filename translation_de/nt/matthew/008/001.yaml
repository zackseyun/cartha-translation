  text: ⸂Καταβάντος δὲ αὐτοῦ⸃ ἀπὸ τοῦ ὄρους ἠκολούθησαν αὐτῷ ὄχλοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: de
  text: Als er vom Berg herabkam, folgten ihm große Menschenmengen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viele Menschenmengen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Als er … herabkam
  rationale: Der Genitivus absolutus mit Aoristpartizip wird natürlich als temporaler Nebensatz wiedergegeben. Das leicht weiterführende δέ braucht im Deutschen nicht eigens mit „und“ ausgedrückt zu werden.
- source_word: ἀπὸ τοῦ ὄρους
  choice: vom Berg
  rationale: ὄρος bezeichnet einen Berg oder eine Anhöhe; „der Berg“ greift hier den Schauplatz des unmittelbar vorausgehenden Abschnitts auf.
- source_word: ἠκολούθησαν αὐτῷ
  choice: folgten ihm
  rationale: ἀκολουθέω mit Dativ wird im Deutschen idiomatisch mit „jemandem folgen“ wiedergegeben und bezeichnet hier zunächst das tatsächliche Hinterhergehen.
- source_word: ὄχλοι πολλοί
  choice: viele Menschen
  rationale: Wörtlich steht „viele Volksmengen“. „Viele Menschen“ ist natürliches modernes Deutsch und vermittelt die große Zahl, gibt jedoch den Plural „Menschenmengen“ weniger ausdrücklich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Der Satzbau bleibt nah am griechischen Erzählfluss; die ungewöhnliche wörtliche Mehrzahl von ὄχλος wird in der Fußnote bewahrt.
