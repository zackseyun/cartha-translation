  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: de
  text: 'Denn auch ich bin ein Mensch, der unter Befehlsgewalt steht und Soldaten unter sich hat. Und ich sage zu diesem: »Geh!«, dann geht er; und zu einem anderen: »Komm!«, dann kommt er; und zu meinem Diener[a]: »Tu das!«, dann tut er es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meinem Sklaven« (griechisch: δοῦλος).'
    reason: 'Lexikalische Alternative: δοῦλος kann je nach sozialem und historischem Kontext »Diener« oder »Sklave« bezeichnen.'
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn auch
  rationale: Leitet die Begründung des Hauptmanns ein; »denn« bewahrt die erklärende Funktion von γάρ, während »auch« das καί und die Analogie ausdrückt.
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: ich bin ein Mensch, der unter Befehlsgewalt steht
  rationale: Gibt sowohl die menschliche Stellung als auch die militärisch geprägte Unterordnung unter übergeordnete Autorität klar wieder.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: ich habe Soldaten unter mir
  rationale: Eine natürliche deutsche Formulierung, die die parallele Befehlshierarchie des griechischen Textes bewahrt.
- source_word: λέγω τούτῳ
  choice: Sage ich zu diesem
  rationale: Bewahrt den demonstrativen und individualisierenden Charakter von τούτῳ sowie die knappe Befehlsfolge.
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: Geh! / Komm! / Tu das!
  rationale: Die kurzen Imperative bilden die direkte, unbedingte Befehlsgewalt des Hauptmanns natürlich und prägnant ab.
- source_word: δοῦλος
  choice: Diener
  rationale: Passt im unmittelbaren Zusammenhang zur Haus- und Befehlsordnung; die mögliche sozialrechtlich stärkere Bedeutung »Sklave« wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bedeutung von ἐξουσία im Bild der Autoritätsordnung
  choice: Befehlsgewalt
  alternative: Vollmacht / Autorität
  rationale: Der militärische Kontext hebt konkrete, delegierte Kommandogewalt hervor. Die Formulierung vermeidet zugleich eine dogmatische Festlegung darüber, wie genau die Analogie auf Jesu Vollmacht zu übertragen ist.
- issue: Wiedergabe von δοῦλος
  choice: Diener
  alternative: Sklave
  rationale: Der Schwerpunkt liegt hier auf Unterordnung und Gehorsam innerhalb des Haushalts. »Diener« ist im modernen Deutschen lesbar; »Sklave« bleibt als lexikalisch und historisch mögliche Wiedergabe ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten knappen Befehle und Reaktionen erhalten den rhythmischen Parallelismus des griechischen Textes. »Dann« macht die unmittelbare Folgerelation im Deutschen natürlich deutlich, ohne den Sinn zu erweitern.
