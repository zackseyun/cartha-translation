  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: de
  text: In einiger Entfernung von ihnen weidete eine große Schweineherde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weit von ihnen entfernt.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: weidete
  rationale: Die Existenzkonstruktion mit ἦν und dem Partizip βοσκομένη wird im Deutschen natürlich als finites Verb wiedergegeben. δέ ist ein schwacher erzählerischer Anschluss und muss hier nicht eigens mit „aber“ oder „nun“ ausgedrückt werden.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: in einiger Entfernung von ihnen
  rationale: Die Formulierung gibt die räumliche Distanz idiomatisch wieder und lässt offen, wie groß sie genau war; die stärkere Alternative „weit von ihnen entfernt“ bleibt in der Fußnote erhalten.
- source_word: ἀγέλη
  choice: Herde
  rationale: „Herde“ ist die natürliche moderne deutsche Bezeichnung für eine Gruppe von Tieren und passt im Kompositum „Schweineherde“.
- source_word: χοίρων
  choice: Schweine-
  rationale: „Schweine“ ist die klare, gegenwärtige Entsprechung; „Säue“ wäre enger beziehungsweise stilistisch markierter.
- source_word: πολλῶν
  choice: große
  rationale: Bei dem Kollektivnomen „Herde“ gibt „eine große Herde“ die Bedeutung „viele Schweine“ idiomatisch wieder.
- source_word: βοσκομένη
  choice: weidete
  rationale: Das mediale Partizip beschreibt die Herde beim Fressen. „Weidete“ ist knapp und im Deutschen auch für eine Schweineherde verständlich; eine passive Wiedergabe wie „wurde gehütet“ würde eine nicht ausdrücklich genannte Betreuung in den Vordergrund rücken.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der milde Anschluss durch δέ wird nicht durch ein unnötiges „nun“ oder ein zu starkes „aber“ überzeichnet.
