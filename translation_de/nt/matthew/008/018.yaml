  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: de
  text: Als Jesus die vielen Menschen um sich sah, befahl er, ans andere Ufer zu fahren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: die vielen Menschen
  rationale: Das wörtliche „viele Menschenmengen“ klingt im Deutschen unnatürlich. Der Plural bezeichnet hier die zahlreich versammelten Leute und wird idiomatisch mit „die vielen Menschen“ wiedergegeben.
- source_word: ἐκέλευσεν
  choice: befahl er
  rationale: Das Verb bezeichnet eine verbindliche Anordnung; „befahl“ gibt seine Stärke knapp und natürlich wieder.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: ans andere Ufer zu fahren
  rationale: τὸ πέραν meint im Kontext das gegenüberliegende Ufer des Sees. Da die Überfahrt mit einem Boot erfolgt, ist „fahren“ im Deutschen natürlicher als das allgemeinere „gehen“, ohne die Zielrichtung zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Das einleitende δέ wird nicht eigens mit „nun“ wiedergegeben, da es hier vor allem den Erzählfluss fortführt.
