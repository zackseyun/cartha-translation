  verdict: approve
  source_fidelity: Der Text gibt das historische Präsens λέγει mit „sagt“ angemessen wieder und bildet den milden Anschluss bzw. Kontrast von δέ durch „aber“ ab. „Folge mir“ entspricht dem Imperativ Ἀκολούθει μοι. Die Formulierung „lass die Toten ihre eigenen Toten begraben“ bewahrt sowohl den Imperativ ἄφες als auch die absichtliche Wiederholung von νεκρούς und die durch ἑαυτῶν hervorgehobene Zugehörigkeit.
  naturalness: Modernes, gut verständliches Standarddeutsch. Die direkte Rede ist knapp und eindringlich; „lass … begraben“ ist in diesem Kontext idiomatisch. Das historische Präsens wirkt im deutschen Bibelerzählstil natürlich.
  terminology: „Tote“ und „begraben“ sind sachgerecht und bewahren die im griechischen Wortlaut offene Spannung, ohne die mögliche bildliche Bedeutung im Haupttext festzulegen. Die Fußnote kennzeichnet die metaphorische Deutung ausdrücklich als häufiges Verständnis und nicht als zwingende Übersetzung.
