id: MAT.8.22
reference: Matthew 8:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: de
  text: 'Jesus aber sagt zu ihm: »Folge mir, und lass die Toten ihre eigenen Toten begraben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das erste »die Toten« wird häufig bildlich verstanden: Menschen, die geistlich nicht ansprechbar sind, können die körperlich Verstorbenen begraben.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet im Zusammenhang einen milden Gegensatz zur vorangehenden Bitte und gibt Jesu korrigierende Antwort wieder, ohne den Kontrast zu überzeichnen.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt das historische Präsens des griechischen Erzählstils und damit dessen Unmittelbarkeit.
- source_word: Ἀκολούθει μοι
  choice: Folge mir
  rationale: Natürliche und präzise Wiedergabe des direkten Imperativs, der sowohl tatsächliches Nachfolgen als auch die Bindung als Jünger bezeichnet.
- source_word: ἄφες
  choice: lass
  rationale: 'Gibt den Imperativ idiomatisch wieder: Der Angesprochene soll diese Angelegenheit anderen überlassen. Im Deutschen fügt sich »lass … begraben« natürlich in die Infinitivkonstruktion.'
- source_word: νεκρούς ... νεκρούς
  choice: die Toten ... ihre eigenen Toten
  rationale: Bewahrt die bewusste Wiederholung desselben griechischen Wortes und löst die Spannung zwischen möglicher bildlicher und körperlicher Bedeutung nicht im Haupttext auf.
- source_word: θάψαι
  choice: begraben
  rationale: Steht nach »lass« im deutschen Infinitiv und entspricht dem griechischen Infinitiv sachlich und idiomatisch.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: ihre eigenen Toten
  rationale: »eigenen« erhält die durch ἑαυτῶν ausgedrückte rückbezügliche und betonte Zugehörigkeit.
theological_decisions:
- issue: Deutung der ersten Bezeichnung »die Toten«
  choice: Der Haupttext behält die wörtliche Formulierung »die Toten … ihre eigenen Toten« bei.
  alternative: Das erste »die Toten« ausdrücklich als »die geistlich Toten« wiedergeben, das zweite als körperlich Verstorbene.
  rationale: Die Aussage arbeitet wahrscheinlich mit einer absichtlichen Mehrdeutigkeit und einem zugespitzten Wortspiel. Da der griechische Text beim ersten Vorkommen nicht ausdrücklich »geistlich« sagt, würde eine solche Ergänzung die Deutung im Haupttext festlegen. Die verbreitete metaphorische Deutung wird stattdessen in einer Fußnote erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Das historische Präsens und die schroffe rhetorische Zuspitzung des Ausgangstextes bleiben erhalten; die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
