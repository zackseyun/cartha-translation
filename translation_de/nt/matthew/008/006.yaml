source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: de
  text: 'und sagte: „Herr, mein Diener liegt gelähmt zu Hause und leidet schrecklich.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Diener“ kann hier auch „Junge“ oder „Kind“ bedeuten. Für „leidet schrecklich“ steht im Griechischen wörtlicher: „wird heftig gequält“.'
    reason: Lexikalische Alternativen bei παῖς und δεινῶς βασανιζόμενος werden bewahrt.
lexical_decisions:
- source_word: καὶ λέγων
  choice: und sagte
  rationale: Das griechische Präsenspartizip verbindet die Äußerung mit dem vorangehenden Erzählzusammenhang. Im natürlichen modernen Deutsch gibt „und sagte“ diese narrative Verknüpfung idiomatisch wieder.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ kann sowohl eine respektvolle Anrede als auch einen inhaltlich gewichtigeren Titel bezeichnen und bewahrt damit die Offenheit des griechischen κύριε.
- source_word: ὁ παῖς μου
  choice: mein Diener
  rationale: παῖς kann einen Diener, Jungen oder ein Kind bezeichnen. Beim Hauptmann legt der Kontext „Diener“ nahe; die echte lexikalische Mehrdeutigkeit wird in der Fußnote genannt.
- source_word: βέβληται
  choice: liegt
  rationale: Das Perfekt Passiv bezeichnet hier idiomatisch den anhaltenden Zustand des Erkrankten. „liegt“ ist im Deutschen natürlich und vermeidet die irreführend wörtliche Vorstellung, er sei hingeworfen worden.
- source_word: ἐν τῇ οἰκίᾳ
  choice: zu Hause
  rationale: „zu Hause“ gibt die lokale Wendung in diesem Zusammenhang natürlich und verständlich wieder.
- source_word: παραλυτικός
  choice: gelähmt
  rationale: Die adjektivische Wiedergabe entspricht der griechischen Zustandsbeschreibung und ist im modernen Deutsch natürlicher als eine Substantivierung.
- source_word: δεινῶς βασανιζόμενος
  choice: leidet schrecklich
  rationale: Die Formulierung bezeichnet schweres Leiden beziehungsweise heftige Qual. „leidet schrecklich“ ist klar und idiomatisch; die stärkere wörtliche Nuance von βασανίζω wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von κύριε als Anrede Jesu
  choice: Herr
  alternative: mein Herr / Herr im Sinn einer bloßen höflichen Anrede
  rationale: „Herr“ lässt offen, ob vor allem respektvolle Anrede oder eine weitergehende Anerkennung Jesu gemeint ist, und legt keine eindeutige christologische Deutung in den Mund des Hauptmanns.
- issue: Identität des παῖς
  choice: Diener
  alternative: Junge / Kind
  rationale: Der soziale Kontext des Hauptmanns stützt „Diener“, doch der griechische Ausdruck allein schließt „Junge“ oder „Kind“ nicht aus. Diese Spannung wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung „liegt gelähmt zu Hause“ ist verständlich und flüssig; „und sagte“ glättet die griechische Partizipialkonstruktion narrativ, ohne ihren Zusammenhang zu verlieren.
