  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: de
  text: 'Da trat ein Schriftgelehrter zu ihm und sagte: »Lehrer, ich werde dir folgen, wohin du auch gehst.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wohin du auch fortgehst«. Das griechische Verb kann genauer »weggehen« oder »fortgehen« bedeuten, wird hier jedoch natürlich im Sinn von »gehen« gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: trat ... zu ihm
  rationale: Das Aoristpartizip bezeichnet die Annäherung vor dem Sprechen; die deutsche Wendung ist natürlich und bewahrt die Bewegungsrichtung auf Jesus zu.
- source_word: εἷς
  choice: ein
  rationale: Das Zahlwort führt hier idiomatisch eine einzelne Person ein. Im Deutschen gibt »ein Schriftgelehrter« den Sinn natürlich wieder, ohne eine unbestimmte Identität zu überbetonen.
- source_word: γραμματεὺς
  choice: Schriftgelehrter
  rationale: Dies ist die etablierte und sachlich passende deutsche Bezeichnung für einen jüdischen Schrift- und Gesetzeskundigen im Evangelienkontext.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die direkte Anrede wird übersetzt und behält ihren respektvollen, aber nicht künstlich erhöhten Sinn.
- source_word: ἀκολουθήσω
  choice: ich werde dir folgen
  rationale: Das Futur drückt die erklärte Absicht des Mannes aus; »folgen« bewahrt sowohl den konkreten als auch den möglichen Jüngerschaftssinn.
- source_word: ὅπου ἐὰν
  choice: wohin ... auch
  rationale: Die Verbindung bezeichnet einen unbestimmten, uneingeschränkten Zielbereich und wird im Deutschen idiomatisch mit »wohin ... auch« wiedergegeben.
- source_word: ἀπέρχῃ
  choice: gehst
  rationale: ἀπέρχομαι kann genauer »weggehen« oder »fortgehen« bedeuten; hier bezeichnet »gehen« natürlich den Weg zu jedem beliebigen Ziel.
theological_decisions:
- issue: Wiedergabe von διδάσκαλος als Anrede für Jesus
  choice: Lehrer
  alternative: Meister; Rabbi
  rationale: »Lehrer« entspricht der lexikalischen Bedeutung und lässt die christologische Einordnung offen, statt durch »Meister« eine stärkere Rangbedeutung oder durch »Rabbi« eine nicht im griechischen Wort selbst enthaltene Transliteration einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung ist natürlich; »Da trat« bildet den narrativen Anschluss von καί ab, ohne das Deutsche mit einem mechanischen »Und« zu belasten.
