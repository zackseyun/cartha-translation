id: MAT.8.3
reference: Matthew 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: de
  text: 'Und er streckte die Hand aus, berührte ihn und sagte: »Ich will; werde rein!« Sofort wurde er von seinem Aussatz gereinigt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »Aussatz« übersetzte griechische Wort λέπρα kann verschiedene schwere Hautkrankheiten bezeichnen und meint nicht ausschließlich die heute sogenannte Hansen-Krankheit.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: er streckte die Hand aus
  rationale: Die Wendung gibt die dem Berühren vorausgehende konkrete Geste natürlich und eng am griechischen Aoristpartizip wieder.
- source_word: ἥψατο αὐτοῦ
  choice: berührte ihn
  rationale: ἅπτομαι mit Genitiv bezeichnet hier schlicht das körperliche Berühren.
- source_word: Θέλω
  choice: Ich will
  rationale: Die knappe deutsche Form bewahrt die Mehrdeutigkeit zwischen entschlossener Bereitschaft und geäußertem Wollen und antwortet unmittelbar auf die vorausgehende Bitte.
- source_word: καθαρίσθητι
  choice: werde rein
  rationale: Der passive Imperativ wahrt sowohl die körperliche als auch die kultische Dimension des Reinwerdens.
- source_word: εὐθέως
  choice: sofort
  rationale: Die Wiedergabe bezeichnet klar den unverzüglichen Eintritt der Wirkung.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: wurde sein Aussatz rein
  rationale: Die Formulierung bewahrt Aussatz als grammatisches Subjekt und hält die Wortverbindung mit dem vorausgehenden Befehl, auch wenn sie im Deutschen bewusst markant klingt.
- source_word: ἡ λέπρα
  choice: sein Aussatz
  rationale: Aussatz ist die erkennbare traditionelle Wiedergabe; eine Fußnote weist darauf hin, dass der antike Begriff nicht ausschließlich die moderne Hansen-Krankheit bezeichnet.
theological_decisions:
- issue: Reinheits- und Heilungssprache in καθαρίζω
  choice: In Befehl und Ergebnis mit »rein werden« wiedergeben
  alternative: Mit »heilen« beziehungsweise »geheilt werden« wiedergeben
  rationale: Der griechische Text spricht ausdrücklich vom Reinwerden und verbindet körperliche Heilung mit Reinheitsvorstellungen; »heilen« allein würde diese Spannung einebnen.
- issue: Bedeutung von Θέλω
  choice: »Ich will«
  alternative: »Ich bin bereit« oder »Ich möchte es«
  rationale: »Ich will« ist knapp, würdig und lässt sowohl Jesu Bereitschaft als auch seinen wirksamen Willensentschluss anklingen, ohne den Ausdruck auf nur eine Nuance festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbeginn wird gegenüber einer schwerfälligen Partizipialkonstruktion verbal aufgelöst. Die ungewöhnliche Schlusswendung bleibt bewusst quellennah; die Fußnote erläutert nur den historischen Krankheitsbegriff.
