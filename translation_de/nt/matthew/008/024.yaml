  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: de
  text: Und siehe, auf dem Meer erhob sich ein gewaltiger Sturm[a], sodass die Wellen das Boot überspülten[b]. Er aber schlief.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet häufig ein »Erdbeben« oder eine heftige »Erschütterung«; hier meint es im Zusammenhang einen gewaltigen Sturm auf dem Meer.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: sodass das Boot von den Wellen bedeckt wurde.'
    reason: literal_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt die lebhafte, aufmerksamkeitslenkende Funktion des griechischen Diskursmarkers. Die Formulierung ist leicht gehoben, aber im modernen Deutsch verständlich.
- source_word: σεισμὸς μέγας
  choice: ein gewaltiger Sturm
  rationale: σεισμός bezeichnet häufig ein Erdbeben oder eine Erschütterung; im unmittelbaren Zusammenhang von See, Boot und Wellen ist jedoch ein heftiger Sturm beziehungsweise ein gewaltiges Aufwühlen des Wassers gemeint. „Gewaltiger Sturm“ gibt diesen kontextuellen Sinn natürlich wieder.
- source_word: ἐγένετο
  choice: erhob sich
  rationale: Bei einem Sturm bezeichnet die Wendung idiomatisch dessen Einsetzen und entspricht dem ereignishaften ἐγένετο.
- source_word: ἐν τῇ θαλάσσῃ
  choice: auf dem See
  rationale: θάλασσα kann Meer oder See bezeichnen. Hier ist der See Gennesaret gemeint; „auf dem See“ ist geografisch und idiomatisch passend, ohne die Heftigkeit des Geschehens abzuschwächen.
- source_word: ὥστε
  choice: sodass
  rationale: Leitet klar die Folge des gewaltigen Sturms ein.
- source_word: τὸ πλοῖον
  choice: das Boot
  rationale: „Boot“ ist für das Fahrzeug auf dem See die natürliche moderne Entsprechung von πλοῖον.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: die Wellen das Boot überspülten
  rationale: Die aktive deutsche Formulierung gibt den fortdauernden Vorgang natürlich und anschaulich wieder. „Überspülen“ entspricht im maritimen Zusammenhang dem Bedecken des Bootes durch die Wellen, ohne bereits ausdrücklich zu behaupten, es sei voll Wasser gelaufen.
- source_word: αὐτὸς δὲ ἐκάθευδεν
  choice: Er aber schlief
  rationale: Die Wortstellung erhält den auffälligen Gegensatz zwischen dem Sturm und Jesu fortdauerndem Schlaf. Das Imperfekt wird im Deutschen idiomatisch durch „schlief“ wiedergegeben.
theological_decisions:
- issue: Art des mit σεισμός bezeichneten Ereignisses
  choice: Kontextuell als „Sturm“ wiedergegeben
  alternative: „Erdbeben“, „Erschütterung“ oder „gewaltiges Beben“
  rationale: Die Entscheidung ist lexikalisch und kontextbezogen, nicht dogmatisch. Die anschließende Beschreibung der Wellen, die das Boot bedecken, spricht für einen heftigen Sturm beziehungsweise eine gewaltige Bewegung des Sees. Die Fußnote bewahrt die ungewöhnliche Grundbedeutung des griechischen Wortes.
- issue: Kontrast zwischen Jesus und dem Sturm
  choice: „Er aber schlief“
  alternative: „Doch er schlief“ oder „Er selbst aber schlief“
  rationale: Die gewählte Form bewahrt den im Griechischen markierten Kontrast, ohne das Pronomen durch „selbst“ stärker zu betonen, als der Zusammenhang verlangt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. „Und sieh“ erhält bewusst den lebhaften biblischen Erzählton; die übrige Syntax ist gegenwärtig und natürlich. Die knappe Form „Er aber schlief“ bewahrt den starken Kontrast des griechischen Satzes.
