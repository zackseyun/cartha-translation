lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ εἰς Καφαρναούμ
  choice: Als Jesus nach Kafarnaum kam
  rationale: Der Genitivus absolutus mit Aoristpartizip wird als natürlicher Temporalsatz wiedergegeben. „Als“ lässt offen, ob das Herantreten während oder unmittelbar nach dem Eintreffen geschah. Der im Griechischen nur pronominal bezeichnete Jesus wird zur Verständlichkeit ausdrücklich genannt.
- source_word: προσῆλθεν αὐτῷ
  choice: trat … an ihn heran
  rationale: Die Wendung gibt die gerichtete Annäherung von προσέρχομαι präzise und in natürlichem erzählendem Deutsch wieder.
- source_word: ἑκατόνταρχος
  choice: Hauptmann
  rationale: „Hauptmann“ ist die etablierte, allgemein verständliche deutsche Bezeichnung für diesen militärischen Befehlshaber. Das sperrige „Hundertführer“ wäre formaler, aber im heutigen Deutsch unnatürlich.
- source_word: παρακαλῶν αὐτόν
  choice: bat ihn eindringlich
  rationale: Im Zusammenhang leitet παρακαλέω eine ernsthafte Bitte ein. „Bat“ wahrt die Grundbedeutung; „eindringlich“ bringt den bittenden Nachdruck des Partizips zum Ausdruck, ohne bereits die stärkere Bedeutung „anflehen“ festzulegen.
