  verdict: approve
  source_fidelity: Die Übersetzung gibt den Genitivus absolutus angemessen durch einen Temporalsatz wieder und macht den kontextuell eindeutigen Bezug des Pronomens auf Jesus explizit. „Nach Kafarnaum kam“ ist eine idiomatische deutsche Wiedergabe von εἰς Καφαρναούμ εἰσελθεῖν, ohne die zeitliche Beziehung über das griechische Maß hinaus festzulegen. „Trat … an ihn heran“ entspricht προσῆλθεν αὐτῷ, und „bat ihn eindringlich“ gibt παρακαλῶν αὐτόν als begleitende, nachdrückliche Bitte treffend wieder.
  naturalness: Flüssiges modernes Standarddeutsch in einem angemessen würdevollen Erzählregister. Der Doppelpunkt ist sachgerecht, da die Bitte im folgenden Vers wörtlich ausgeführt wird.
