source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: de
  text: Als Jesus in das Haus des Petrus kam, sah er dessen Schwiegermutter daliegen; sie hatte Fieber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: als Jesus … kam
  rationale: Das temporale aoristische Partizip wird in natürlichem Deutsch als Nebensatz wiedergegeben; die zeitliche Abfolge bleibt erhalten.
- source_word: οἰκίαν Πέτρου
  choice: das Haus des Petrus
  rationale: Die Genitivverbindung bezeichnet eindeutig das Haus, das Petrus zugeordnet ist. „Haus“ entspricht οἰκία und passt zum würdevollen Erzählstil.
- source_word: πενθερὰν αὐτοῦ
  choice: dessen Schwiegermutter
  rationale: πενθερά bezeichnet die Schwiegermutter. „Dessen“ bezieht sich auf Petrus und verhindert, dass die Frau fälschlich Jesus zugeordnet wird.
- source_word: βεβλημένην
  choice: daliegen
  rationale: Das Perfektpartizip von βάλλω beschreibt hier idiomatisch den fortdauernden Zustand einer liegenden Person. „Daliegen“ gibt diesen Zustand wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Bett hinzuzufügen.
- source_word: πυρέσσουσαν
  choice: sie hatte Fieber
  rationale: Das präsentische Partizip bezeichnet einen anhaltenden fiebrigen Zustand. Der eigenständige deutsche Satz ist klar und natürlich, ohne die Aussage durch „leiden“ oder „vor Fieber glühen“ zu verstärken.
theological_decisions:
- issue: Bezugswort von αὐτοῦ bei „Schwiegermutter“
  choice: Das Pronomen bezieht sich auf Petrus; gemeint ist die Schwiegermutter des Petrus.
  alternative: Bei unklarer deutscher Formulierung könnte das Pronomen irrtümlich auf Jesus bezogen werden.
  rationale: Syntax und unmittelbarer Zusammenhang ordnen sowohl das Haus als auch die Schwiegermutter Petrus zu. Daraus werden keine weitergehenden theologischen Folgerungen gezogen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit ruhigem, würdigem Erzählton. Die griechische Partizipialkonstruktion wird zur besseren deutschen Lesbarkeit in einen Temporalsatz und zwei verbale Aussagen aufgelöst.
