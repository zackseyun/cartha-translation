source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: de
  text: Als es Abend geworden war, brachte man viele Menschen zu ihm, die von Dämonen besessen waren[a]; er trieb die Geister mit einem Wort aus und heilte alle Kranken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die von Dämonen geplagt waren“. Das griechische Partizip bezeichnet Menschen unter dämonischem Einfluss, ohne dessen genaue Art näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Als es Abend geworden war
  rationale: Der Genitivus absolutus bezeichnet den Zeitpunkt. Die Formulierung ist natürliches Deutsch und bewahrt zugleich den Eintritt des Abends.
- source_word: προσήνεγκαν αὐτῷ
  choice: brachte man ... zu ihm
  rationale: Das unbestimmte Subjekt der griechischen Pluralform wird im Deutschen idiomatisch mit „man“ wiedergegeben; προσφέρω bezeichnet hier das Herbringen von Menschen zu Jesus.
- source_word: δαιμονιζομένους πολλούς
  choice: viele Menschen ..., die von Dämonen beherrscht wurden
  rationale: Die Wendung bezeichnet Menschen unter dämonischem Einfluss. „Von Dämonen beherrscht“ ist verständlich und vermeidet die möglicherweise zu absolute Aussage von „besessen“, ohne die reale dämonische Bedrängnis des Textes abzuschwächen.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: Er trieb die Geister ... aus
  rationale: „Austrieben“ entspricht dem exorzistischen Gebrauch von ἐκβάλλω; „die Geister“ gibt das griechische Objekt direkt wieder, ohne „böse“ ausdrücklich hinzuzufügen.
- source_word: λόγῳ
  choice: mit einem Wort
  rationale: Der instrumentale Dativ hebt die Autorität und Mühelosigkeit des gesprochenen Befehls hervor. „Seinem“ wird nicht ergänzt, da es im Griechischen nicht ausdrücklich steht.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: alle Kranken
  rationale: κακῶς ἔχειν ist eine gebräuchliche Wendung für Kranksein. Die substantivische deutsche Form ist knapp, klar und natürlich.
- source_word: ἐθεράπευσεν
  choice: heilte
  rationale: θεραπεύω bezeichnet in diesem Heilungsbericht das Gesundmachen; „heilte“ bewahrt die übliche biblische und narrative Aussage.
theological_decisions:
- issue: Art der durch δαιμονιζομένους und τὰ πνεύματα bezeichneten Not
  choice: Reale dämonische Bedrängnis als „von Dämonen beherrscht“ und „die Geister“ wiedergeben
  alternative: „Besessene“ oder eine psychologisierende Wiedergabe als psychisch Kranke
  rationale: Der Vers unterscheidet das Austreiben der Geister vom Heilen der Kranken. Die Übersetzung bewahrt diese Kategorien des Textes, legt aber mit „beherrscht“ den genauen Grad dämonischen Einflusses nicht enger fest, als das Partizip verlangt.
- issue: Bedeutung von λόγῳ
  choice: 'instrumental: „mit einem Wort“'
  alternative: „durch sein Wort“ oder „indem er sprach“
  rationale: Die knappe Formulierung wahrt den Akzent auf Jesu wirksamer Autorität, ohne eine ausdrückliche Besitzangabe oder eine weitergehende dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Kurze Hauptsätze erhalten den zügigen Erzählrhythmus; traditionelle Fachwörter wie „Besessene“ werden im Haupttext vermieden und als Alternative in der Fußnote genannt.
