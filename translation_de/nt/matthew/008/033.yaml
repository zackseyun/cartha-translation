id: MAT.8.33
reference: Matthew 8:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: de
  text: Die Hirten aber flohen, gingen in die Stadt und berichteten alles, auch was mit den von Dämonen besessenen Männern geschehen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und das, was die von Dämonen besessenen Männer betraf«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Die Hirten aber
  rationale: Das substantivierte Partizip bezeichnet hier diejenigen, die die Schweineherde hüteten. »Hirten« ist im Deutschen knapp und natürlich; δέ wird mit »aber« wiedergegeben und markiert den Fortgang der Erzählung.
- source_word: ἔφυγον
  choice: flohen
  rationale: Das Verb φεύγω bezeichnet unmittelbar das Fliehen und wird in der Erzählung prägnant mit »flohen« wiedergegeben.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: gingen in die Stadt
  rationale: Das vorzeitige Aoristpartizip beschreibt den anschließenden Gang in die Stadt. Die koordinierte Wiedergabe ist im Deutschen flüssig und bewahrt die Abfolge der Handlungen.
- source_word: ἀπήγγειλαν πάντα
  choice: berichteten alles
  rationale: ἀπαγγέλλω bedeutet hier, eine Nachricht weiterzugeben; »berichteten« passt zum erzählerischen Zusammenhang. πάντα wird umfassend mit »alles« wiedergegeben.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: auch was mit den von Dämonen besessenen Männern geschehen war
  rationale: Die knappe griechische Wendung bedeutet wörtlich etwa »und das bezüglich der von Dämonen Besessenen«. Die gewählte Fassung erschließt idiomatisch, dass die Hirten auch die sie betreffenden Ereignisse meldeten; »Männern« ergibt sich aus dem unmittelbaren Kontext von Matthäus 8.
- source_word: δαιμονιζομένων
  choice: von Dämonen besessenen
  rationale: Die Form bezeichnet Menschen, die unter dämonischer Macht stehen. Die geläufige deutsche Wendung benennt diese Wirklichkeit klar, ohne über den Text hinaus feinere Kategorien dämonischer Einwirkung festzulegen.
theological_decisions:
- issue: Wiedergabe der dämonischen Einwirkung in δαιμονιζομένων
  choice: von Dämonen besessenen Männern
  alternative: von Dämonen geplagten Männern / dämonisierten Männern
  rationale: »Von Dämonen besessen« ist die verständlichste etablierte Wiedergabe und nimmt die im Erzählzusammenhang dargestellte dämonische Macht ernst. Sie führt keine zusätzliche lehrmäßige Unterscheidung ein.
- issue: Ergänzung des im Griechischen nur impliziten Geschehens
  choice: was mit … geschehen war
  alternative: was die … Männer betraf
  rationale: Die idiomatische Ergänzung gibt den Bezug auf die berichteten Ereignisse wieder. Da die griechische Formulierung knapper und offener ist, wird die wörtlichere Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Reihung »flohen, gingen … und berichteten« hält den zügigen Handlungsablauf fest; die Fußnote bewahrt die größere formale Offenheit der griechischen Schlusswendung.
