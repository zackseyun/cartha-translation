revisions:
- from: Als er ans andere Ufer in das Gebiet der Gadarener[a] gekommen war, begegneten ihm zwei von Dämonen besessene Männer. Sie kamen aus den Grabhöhlen und waren äußerst gefährlich, sodass niemand auf jenem Weg vorbeigehen konnte.
  to: Als er ans andere Ufer in das Gebiet der Gadarener[a] kam, begegneten ihm zwei von Dämonen besessene Männer, die aus den Gräbern kamen. Sie waren äußerst gefährlich, sodass niemand auf diesem Weg vorbeikommen konnte.
  rationale: Die Überarbeitung ersetzt die zu spezifische historische Konkretisierung „Grabhöhlen“ durch das quellennähere, moderne „Gräbern“ und formuliert das Passieren des Weges ohne Einschränkung auf Fußgänger. Der temporale Nebensatz wird mit dem einfachen Präteritum idiomatischer gefasst, ohne die zeitliche Abfolge zu verändern. Die bezeugte Namensvariante bleibt transparent in der Fußnote.
