id: MAT.8.28
reference: Matthew 8:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: de
  text: Als er ans andere Ufer in das Gebiet der Gadarener[a] kam, begegneten ihm zwei von Dämonen besessene Männer, die aus den Gräbern kamen. Sie waren äußerst gefährlich, sodass niemand auf diesem Weg vorbeikommen konnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben hier „Gergesener“ oder „Gerasener“ statt „Gadarener“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: als er … gekommen war
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben; das Plusquamperfekt markiert das vorausgehende Ankommen.
- source_word: τὸ πέραν
  choice: das andere Ufer
  rationale: Im Kontext der Überfahrt bezeichnet der Ausdruck die gegenüberliegende Seite des Sees; „Ufer“ macht den gemeinten räumlichen Bezug im Deutschen natürlich deutlich.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: das Gebiet der Gadarener
  rationale: χώρα bezeichnet hier ein Gebiet oder eine Region; der Haupttext folgt der Lesart Γαδαρηνῶν des SBLGNT.
- source_word: δύο δαιμονιζόμενοι
  choice: zwei von Dämonen besessene Männer
  rationale: Die Form bezeichnet zwei männliche Personen unter dämonischer Herrschaft. Die Wiedergabe ist im Deutschen klar und geläufig, ohne zusätzliche Einzelheiten über Art oder Ausmaß ihres Zustands einzutragen.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: sie kamen aus den Grabhöhlen
  rationale: μνημεῖα bezeichnet Begräbnisstätten beziehungsweise Gräber. „Grabhöhlen“ passt zur damaligen Bestattungspraxis und ergibt ein anschauliches, verständliches Deutsch.
- source_word: χαλεποὶ λίαν
  choice: äußerst gefährlich
  rationale: χαλεπός kann hier „gefährlich“, „wild“ oder „heftig“ bedeuten. Der Folgesatz hebt die von den Männern ausgehende Gefahr für Vorübergehende hervor; „gefährlich“ bewahrt dies, ohne ausdrücklich körperliche Gewalttätigkeit zu behaupten.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: sodass niemand auf jenem Weg vorbeigehen konnte
  rationale: ὥστε führt die Folge ein, ἰσχύειν bezeichnet hier das Vermögen beziehungsweise die Möglichkeit, und διά mit dem Genitiv kennzeichnet die Strecke, auf der man sich bewegt.
theological_decisions:
- issue: Bezeichnung der dämonischen Herrschaft
  choice: von Dämonen besessen
  alternative: unter der Macht von Dämonen; dämonisiert
  rationale: Die gewählte geläufige Formulierung gibt die reale dämonische Einwirkung des Partizips δαιμονιζόμενοι wieder, ohne eine weiter ausgearbeitete Lehre über deren genaue Beschaffenheit hinzuzufügen.
- issue: Textvariante beim Gebietsnamen
  choice: Gadarener
  alternative: Gergesener; Gerasener
  rationale: Der Haupttext folgt Γαδαρηνῶν im angegebenen SBLGNT-Text. Die abweichenden Ortsnamen der handschriftlichen Überlieferung werden in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wird nach der Begegnung geteilt, damit die Partizipialkonstruktion verständlich bleibt. „Äußerst gefährlich“ bewahrt die Bedeutungsbreite von χαλεποὶ λίαν und vermeidet die engere Festlegung auf ausdrücklich körperliche Gewalt.
