    issue: „vorbeigehen“ kann die Aussage auf Gehen beschränken.
    rationale: παρελθεῖν bezeichnet hier das Vorbeikommen bzw. Passieren. „Vorbeikommen“ ist im Deutschen natürlich und legt keine bestimmte Art der Fortbewegung fest.
