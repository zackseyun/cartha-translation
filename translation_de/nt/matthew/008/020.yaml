id: MAT.8.20
reference: Matthew 8:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: de
  text: 'Und Jesus sagt zu ihm: »Die Füchse haben Höhlen und die Vögel des Himmels Nester[a]; der Menschensohn aber hat keinen Ort, wo er seinen Kopf hinlegen kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alternativ für »Nester«: »Unterkünfte« oder »Ruheplätze«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt das historische Präsens des griechischen Erzählstils und klingt auch im Deutschen natürlich.
- source_word: ἀλώπεκες
  choice: Füchse
  rationale: Direkte und geläufige deutsche Entsprechung.
- source_word: φωλεούς
  choice: Höhlen
  rationale: Bezeichnet hier die Behausungen der Füchse; »Baue« wäre zoologisch idiomatischer, doch »Höhlen« bewahrt die allgemeinere Bildsprache des griechischen Wortes.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel des Himmels
  rationale: Bewahrt die Wendung mit οὐρανός und ist in gehobenem, aber verständlichem Deutsch natürlich.
- source_word: κατασκηνώσεις
  choice: Nester
  rationale: Im Zusammenhang mit Vögeln ist »Nester« die verständlichste natürliche Wiedergabe; das griechische Wort bezeichnet allgemeiner Aufenthalts- oder Ruheplätze.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe erhält Jesu Selbstbezeichnung sowie ihre mögliche Anspielung auf Daniel 7, ohne die vielschichtige Bedeutung aufzulösen.
- source_word: οὐκ ἔχει ποῦ
  choice: hat keinen Ort, wo
  rationale: Gibt die verneinte griechische Konstruktion idiomatisch wieder und hält das konkrete Motiv eines fehlenden Platzes fest.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: den Kopf hinlegen kann
  rationale: Natürliche deutsche Formulierung, die das konkrete Bild des Neigens beziehungsweise Niederlegens des Kopfes bewahrt.
theological_decisions:
- issue: Wiedergabe der Selbstbezeichnung ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Mensch / der menschliche Eine
  rationale: »Menschensohn« bewahrt die feste biblische Ausdrucksweise, ihre mögliche messianische Resonanz und zugleich ihre Deutungsoffenheit. Eine paraphrasierende Wiedergabe würde diese Spannung vorschnell auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem biblischem Ton. Das historische Präsens wird beibehalten. »Menschensohn« bleibt als etablierte, theologisch offene Selbstbezeichnung stehen.
