id: MAT.8.10
reference: Matthew 8:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: de
  text: 'Als Jesus das hörte, staunte er und sagte zu denen, die ihm folgten: »Amen, ich sage euch: Bei niemandem in Israel habe ich einen so großen Glauben gefunden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Als Jesus das hörte
  rationale: Das Aoristpartizip bezeichnet den vorausgehenden Umstand. Die temporale Wiedergabe ist im Deutschen natürlich; »das« nimmt sinngemäß die unmittelbar vorausgehenden Worte des Hauptmanns auf.
- source_word: ἐθαύμασεν
  choice: staunte er
  rationale: »Staunen« gibt die erzählerisch hervorgehobene Verwunderung Jesu klar und würdig wieder, ohne zusätzliche Deutungen einzutragen.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: zu denen, die ihm folgten
  rationale: Das substantivierte Präsenspartizip bezeichnet die Menschen, die Jesus in dieser Situation begleiteten, ohne sie mit einem institutionellen Titel zu versehen.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Die formelhafte, feierliche Einleitung wird nah am griechischen Wortlaut bewahrt. »Amen« ist im Deutschen geläufig und erhält die charakteristische Redeweise Jesu.
- source_word: παρ’ οὐδενὶ
  choice: bei niemandem
  rationale: παρά mit Dativ bezeichnet hier das Vorfinden bei beziehungsweise im Fall einer Person. »Bei niemandem« ist präzise und idiomatisch.
- source_word: τοσαύτην πίστιν
  choice: einen so großen Glauben
  rationale: τοσαύτην hebt ausdrücklich das Ausmaß hervor. »Einen so großen Glauben« bewahrt diese graduelle Bedeutung deutlicher als das ebenfalls mögliche »solchen Glauben«.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: in Israel
  rationale: Die Wendung bezeichnet Israel räumlich und zugleich gemeinschaftlich; die direkte deutsche Entsprechung wahrt diese Offenheit.
- source_word: εὗρον
  choice: habe ich ... gefunden
  rationale: Das deutsche Perfekt drückt natürlich Jesu Erfahrung bis zu diesem Augenblick aus und entspricht in diesem Kontext der punktuellen griechischen Aoristform.
theological_decisions:
- issue: Wiedergabe von πίστις
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Im Kontext geht es um das vertrauende Zutrauen des Hauptmanns zu Jesu Vollmacht. »Glauben« ist die sachlich passende und theologisch nicht einengende Hauptwiedergabe; »Treue« trifft den konkreten Zusammenhang weniger gut.
- issue: Bezug von »Israel«
  choice: in Israel
  alternative: unter Israel
  rationale: »In Israel« lässt offen, ob vor allem das Volk, sein Gebiet oder seine gemeinschaftliche Wirklichkeit im Blick steht, und löst diese Spannung nicht unnötig auf.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung ist natürlich, bleibt aber eng an Aufbau und Nachdruck des griechischen Textes. Da keine Fußnote erforderlich ist, stehen im Haupttext keine Fußnotenmarker.
