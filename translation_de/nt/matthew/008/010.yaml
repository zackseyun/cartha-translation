  terminology: »Amen, ich sage euch« bewahrt die charakteristische Evangelienformel. »Glauben« ist für πίστις in diesem Kontext die passende, theologisch offene Standardwiedergabe; »in Israel« erhält die Offenheit des griechischen Ausdrucks. Keine Fußnote ist für den deutschen Zieltext erforderlich.
