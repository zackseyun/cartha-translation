  source_fidelity: 'Der deutsche Text gibt sämtliche Sinnelemente des griechischen Satzes zutreffend wieder: den einleitenden Umstand (ἀκούσας), Jesu Verwunderung (ἐθαύμασεν), die aktuell Mitgehenden (τοῖς ἀκολουθοῦσιν), die feierliche Amen-Formel, die Negation bei Personen (παρ’ οὐδενί), den Grad von τοσαύτην πίστιν, den Bezug auf Israel und das Finden (εὗρον). Das deutsche Perfekt »habe ... gefunden« ist idiomatisch und im Kontext angemessen.'
