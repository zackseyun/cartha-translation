id: MAT.8.23
reference: Matthew 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: de
  text: Als Jesus in das Boot[a] stieg[b], folgten ihm seine Jünger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ein Boot“. Im Griechischen steht hier kein Artikel; der Zusammenhang kann im Deutschen dennoch die bestimmte Form nahelegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Nachdem Jesus in das Boot gestiegen war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: als Jesus … stieg
  rationale: Das Partizip Aorist bezeichnet hier am natürlichsten die zeitliche Begleithandlung zur Haupthandlung. „Als … stieg“ ist im modernen Deutsch idiomatisch und lässt offen, ob der Einstieg unmittelbar vorausging oder zeitlich mit dem Folgen zusammenfiel. Der Name „Jesus“ verdeutlicht den im Kontext eindeutigen Bezug von αὐτῷ.
- source_word: πλοῖον
  choice: das Boot
  rationale: πλοῖον kann ein Boot oder Schiff bezeichnen. Im galiläischen Kontext ist „Boot“ die natürliche Wiedergabe. Obwohl im Griechischen kein Artikel steht, legt der Erzählzusammenhang im Deutschen „das Boot“ nahe; die formal mögliche unbestimmte Wiedergabe wird in einer Fußnote genannt.
- source_word: ἠκολούθησαν
  choice: folgten
  rationale: „Folgen“ gibt sowohl die konkrete Bewegung als auch den bei Matthäus möglichen Jüngerschaftsanklang wieder, ohne diesen ausdrücklich auszudeuten.
- source_word: μαθηταὶ
  choice: Jünger
  rationale: „Jünger“ ist die etablierte und sachlich passende Bezeichnung für die μαθηταί Jesu und bewahrt ihre Beziehung als Lernende und Nachfolger.
- source_word: αὐτῷ … αὐτῷ … αὐτοῦ
  choice: Jesus / ihm / seine
  rationale: Alle drei Formen beziehen sich im Kontext auf Jesus. Der Name vermeidet im einleitenden Nebensatz ein im Deutschen unklar klingendes Pronomen; „ihm“ und „seine“ geben die weiteren Bezüge natürlich wieder.
theological_decisions:
- issue: Möglicher Jüngerschaftsanklang von ἀκολουθέω
  choice: „folgten ihm“
  alternative: „gingen mit ihm“ oder „wurden seine Nachfolger“
  rationale: Der unmittelbare Sinn ist räumliches Folgen beim Einsteigen ins Boot. Zugleich kann das Verb bei Matthäus Jüngerschaft anklingen lassen. „Folgten ihm“ bewahrt beide Ebenen, ohne die Aussage theologisch auszuweiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung ist natürlich und bewahrt zugleich die knappe Struktur des griechischen Textes.
