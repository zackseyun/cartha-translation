  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: de
  text: 'Die Dämonen flehten ihn immer wieder an[a]: »Wenn du uns austreibst, schick uns in die Schweineherde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »baten ihn inständig« bzw. »flehten ihn an«; die griechische Verbform kann ein fortgesetztes oder wiederholtes Bitten ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ δαίμονες
  choice: Die Dämonen
  rationale: »Dämonen« ist die klare, geläufige Bezeichnung für die hier als persönlich handelnd dargestellten bösen Geister; δέ führt ihre Reaktion im Erzählfluss weiter und muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: παρεκάλουν
  choice: flehten ihn immer wieder an
  rationale: Das Imperfekt beschreibt ein fortgesetztes oder wiederholtes Bitten; die Formulierung gibt sowohl die Eindringlichkeit als auch den durativen Aspekt wieder.
- source_word: λέγοντες
  choice: direkte Rede nach Doppelpunkt
  rationale: Das Partizip leitet die wörtliche Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion, ohne dass ein schwerfälliges »und sagten« nötig ist.
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: Wenn du uns austreibst
  rationale: »Wenn« bewahrt die Bedingungsform, ohne sie zu »da« oder »weil« umzudeuten. »Austreiben« ist im Zusammenhang einer Dämonenaustreibung präzise und idiomatisch.
- source_word: ἀπόστειλον ἡμᾶς
  choice: schick uns
  rationale: Der Imperativ verlangt eine unmittelbare Handlung. »Schick uns« ist direkt, natürlich und erhält das ausdrücklich wiederholte Objekt »uns«.
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: in die Schweineherde
  rationale: Das deutsche Kompositum ist die natürliche knappe Entsprechung für »Herde von Schweinen« und bewahrt das Ziel der erbetenen Sendung.
theological_decisions:
- issue: Darstellung der bösen Geister
  choice: Dämonen
  alternative: böse Geister
  rationale: Der Text bezeichnet sie ausdrücklich als δαίμονες und stellt sie als redende, Jesus untergeordnete Wesen dar. »Dämonen« bewahrt diese Aussage, ohne zusätzliche Deutung einzuführen.
- issue: Bedingungssatz Εἰ ἐκβάλλεις ἡμᾶς
  choice: Wenn du uns austreibst
  alternative: Da du uns austreibst
  rationale: Die Übersetzung erhält die grammatische Bedingung und lässt offen, wie sicher die Sprecher das bevorstehende Austreiben voraussetzen, statt die Aussage kausal festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schick« ist als natürlicher Imperativ gewählt; »Schweineherde« ist allgemein verständlich. Die fortgesetzte Handlung des griechischen Imperfekts wird im Haupttext ausdrücklich wiedergegeben.
