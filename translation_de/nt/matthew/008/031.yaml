  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes sachgerecht wieder: δαίμονες als „Dämonen“, das imperfektische παρεκάλουν mit „flehten ... immer wieder an“, die Bedingung „Wenn du uns austreibst“ sowie den Imperativ „schick uns in die Schweineherde“. Die direkte Rede mittels Doppelpunkt ist eine natürliche deutsche Wiedergabe von λέγοντες. Das nicht eigens übersetzte δέ ist im deutschen Erzählfluss vertretbar.'
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und hat einen angemessen würdevollen Erzählregister. „Schweineherde“ und „schick uns“ sind idiomatisch. „Immer wieder“ macht die wiederholte bzw. andauernde Perspektive des Imperfekts gut verständlich.
