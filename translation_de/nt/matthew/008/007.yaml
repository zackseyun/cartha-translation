  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: de
  text: 'Und er sagt zu ihm[a]: »Ich werde kommen und ihn heilen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Frage: »Soll ich kommen und ihn heilen?« Einige verstehen Jesu Worte aufgrund des Zusammenhangs als Frage; der griechische Wortlaut lässt sich jedoch natürlicher als Aussage lesen.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zeitliche oder folgernde Nuance hinzuzufügen.
- source_word: λέγει
  choice: er sagt
  rationale: Das historische Präsens wird beibehalten; es ist auch im deutschen Erzählstil verständlich und gibt der Szene Unmittelbarkeit.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet hier den Adressaten der Rede und wird natürlich mit »zu ihm« wiedergegeben.
- source_word: Ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Pronomen trägt eine gewisse Hervorhebung, die das deutsche »Ich« an dieser Stelle ausreichend wiedergibt.
- source_word: ἐλθὼν
  choice: werde kommen und
  rationale: Das vorangestellte Aoristpartizip bezeichnet eine begleitende beziehungsweise der Heilung vorausgehende Handlung; die koordinierte deutsche Formulierung gibt den Ablauf natürlich wieder.
- source_word: θεραπεύσω
  choice: heilen
  rationale: Im Zusammenhang mit dem kranken Diener bezeichnet θεραπεύω die Wiederherstellung von Krankheit; »heilen« ist die treffende und idiomatische Wiedergabe.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen verweist auf den erkrankten Diener und wird eindeutig mit »ihn« wiedergegeben.
theological_decisions:
- issue: Aussage oder Frage
  choice: 'Aussage: »Ich werde kommen und ihn heilen.«'
  alternative: 'Frage: »Soll ich kommen und ihn heilen?«'
  rationale: Der griechische Wortlaut enthält kein Fragezeichen im ursprünglichen Sinn und kein Fragewort oder Fragepartikel; syntaktisch ist er am natürlichsten als Aussage zu lesen. Da der Kontext dennoch eine rhetorische Frage nahelegen kann und die antike Interpunktion diese Möglichkeit nicht endgültig ausschließt, wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens und die einfache Satzverknüpfung spiegeln den knappen, unmittelbaren Erzählstil des griechischen Textes.
