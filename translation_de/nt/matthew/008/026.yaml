id: MAT.8.26
reference: Matthew 8:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Warum seid ihr so furchtsam, ihr Kleingläubigen?« Dann stand er auf, wies die Winde und den See zurecht, und es trat eine große Stille ein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: ängstlich
  rationale: Bezeichnet hier furchtsames, mutloses Verhalten; »ängstlich« gibt den Vorwurf natürlich wieder, ohne ihn zu einem bloßen momentanen Erschrecken abzuschwächen.
- source_word: ὀλιγόπιστοι
  choice: ihr Kleingläubigen
  rationale: Bewahrt die knappe direkte Anrede und den matthäischen Gedanken eines unzureichenden Vertrauens; gemeint ist nicht völliger Unglaube.
- source_word: ἐπετίμησεν
  choice: wies ... zurecht
  rationale: Gibt den autoritativen Tadel beziehungsweise Befehl wieder und lässt die auffällige Personifizierung von Wind und See bestehen.
- source_word: τῇ θαλάσσῃ
  choice: den See
  rationale: Im erzählten geografischen Zusammenhang ist der See von Galiläa gemeint; modernes Deutsch bezeichnet ihn natürlich als »See«, obwohl θάλασσα auch »Meer« heißen kann.
- source_word: γαλήνη μεγάλη
  choice: eine große Stille
  rationale: Bewahrt die Verstärkung durch μεγάλη und bezeichnet den vollständigen ruhigen Zustand von Wind und Wasser in würdigem, natürlichem Deutsch.
theological_decisions:
- issue: Charakterisierung des Glaubens der Jünger
  choice: »ihr Kleingläubigen«
  alternative: »ihr mit eurem kleinen Glauben«
  rationale: Die substantivierte Anrede spiegelt die direkte Zuspitzung des griechischen ὀλιγόπιστοι, ohne den Jüngern jeden Glauben abzusprechen.
- issue: Jesu Autorität über die Naturgewalten
  choice: »wies die Winde und den See zurecht«
  alternative: »bedrohte die Winde und den See«
  rationale: Die Formulierung erhält die autoritative Handlung, ohne durch eine zusätzliche Erklärung ihre christologische Bedeutung ausdrücklich festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die griechische Abfolge wird weitgehend bewahrt, aber idiomatisch formuliert; keine Fußnoten erforderlich.
