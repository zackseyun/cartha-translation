  source_fidelity: 'Der Vers wird im Wesentlichen treffend wiedergegeben: „Hauptmann“, „Herr“, „unter mein Dach“, die Beschränkung „nur“ und das futurische Heilungspassiv entsprechen dem griechischen Text. Für παῖς ist „Diener“ im Kontext eine gut begründete Hauptlesart, sofern die lexikalische Bandbreite kenntlich bleibt.'
  naturalness: Der deutsche Satz ist klar, würdevoll und modernes Standarddeutsch. „Sprich nur ein Wort“ ist idiomatisch. Das explizite Futurpassiv „wird … geheilt werden“ ist etwas schwerer als „wird … geheilt“, gibt aber die griechische Zukunftsform zuverlässig wieder.
  terminology: „Hauptmann“ ist als etablierte deutsche Bezeichnung für ἑκατόνταρχος vertretbar. „Herr“ bewahrt die respektvolle Anrede κύριε samt möglichem weiterem Bedeutungsgehalt, ohne ihn festzuschreiben. Die Fußnote zu παῖς ist sachlich angemessen.
