  - severity: low
    issue: Fußnotenanker entsprechen nicht dem vorgelegten Audit-Trail
    rationale: Der englische Audit-Trail führt die Alternative zu „say/speak the word“ und die Bedeutungsbreite von παῖς an; im deutschen Entwurf ist stattdessen eine zusätzliche textkritische Fußnote eingefügt. Nach Entfernung der unbelegten Fußnote bleibt die tatsächlich relevante Anmerkung zu παῖς erhalten und wird fortlaufend markiert.
  revised_text: 'Der Hauptmann antwortete: »Herr, ich bin es nicht wert, dass du unter mein Dach kommst. Sprich nur ein Wort, dann wird mein Diener[a] geheilt werden.«'
