  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: de
  text: 'Der Hauptmann antwortete: »Herr, ich bin es nicht wert, dass du unter mein Dach kommst. Sprich nur ein Wort, dann wird mein Diener[a] geheilt werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Zusammenhang auch „Junge“ oder „Kind“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: antwortete
  rationale: Die Verbindung aus Partizip und Redeverb wird im Deutschen natürlich mit einem einzigen Redeeinleiter wiedergegeben; „antwortete“ bewahrt den responsiven Sinn.
- source_word: ἑκατόνταρχος
  choice: Hauptmann
  rationale: Die im Deutschen etablierte Bezeichnung für den römischen Befehlshaber einer Hundertschaft ist verständlich und passt zum historischen Kontext.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ wahrt sowohl die respektvolle Anrede als auch einen möglichen weitergehenden christologischen Klang, ohne diesen festzulegen.
- source_word: οὐκ εἰμὶ ἱκανός
  choice: ich bin es nicht wert
  rationale: Im Zusammenhang bezeichnet ἱκανός persönliche beziehungsweise soziale Würdigkeit, nicht bloß Fähigkeit oder Eignung.
- source_word: ὑπὸ τὴν στέγην
  choice: unter mein Dach
  rationale: Die anschauliche griechische Wendung lässt sich im Deutschen verständlich und nahezu wörtlich bewahren.
- source_word: μόνον εἰπὲ λόγῳ
  choice: Sprich nur ein Wort
  rationale: Die Formulierung gibt den restriktiven Nachdruck von μόνον und die ungewöhnliche Ausdrucksweise mit λόγῳ quellennah und zugleich idiomatisch wieder.
- source_word: ἰαθήσεται
  choice: wird … geheilt werden
  rationale: Die Wiedergabe bewahrt Futur und Passiv des griechischen Verbs und lässt den Handelnden, wie im Ausgangstext, unausgesprochen.
- source_word: παῖς
  choice: Diener
  rationale: Der soziale Zusammenhang und die Parallele in Lukas 7 sprechen für „Diener“; da das Wort auch „Junge“ oder „Kind“ bedeuten kann, bleibt die Mehrdeutigkeit in einer Fußnote sichtbar.
theological_decisions:
- issue: Bedeutung der Anrede κύριε
  choice: Herr
  alternative: Herr; je nach rein sozialer Deutung auch „mein Herr“
  rationale: Die Übersetzung wahrt die mögliche christologische Bedeutung, ohne zu behaupten, dass die Anrede hier ausschließlich als göttlicher Titel gebraucht wird.
- issue: Deutung von παῖς
  choice: Diener
  alternative: Junge oder Kind
  rationale: „Diener“ passt am besten zur erzählten Situation, doch die lexikalisch echte Mehrdeutigkeit wird nicht verschwiegen.
- issue: Unausgesprochener Urheber der Heilung
  choice: 'Passiv: „wird … geheilt werden“'
  alternative: „wird … gesund werden“
  rationale: Das Passiv entspricht dem griechischen Text und vermeidet es, den impliziten Urheber der Heilung ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und gut verständliche Bezeichnung „Hauptmann“ wird beibehalten; direkte Rede und Satzbau bleiben klar und mündlich natürlich. Die Metapher „unter mein Dach“ sowie das Heilungspassiv werden quellennah bewahrt.
