  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: de
  text: 'Die Männer aber staunten und sagten: »Was ist das für ein Mensch[a], dass ihm sogar die Winde und der See gehorchen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was ist das für einer?« Der griechische Ausdruck fragt danach, von welcher Art oder Beschaffenheit jemand ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Die Männer aber
  rationale: ἄνθρωποι bezeichnet hier im erzählten Zusammenhang die Männer im Boot. »Aber« gibt δέ wieder und knüpft ihre Reaktion kontrastierend an Jesu Handeln an.
- source_word: ἐθαύμασαν
  choice: staunten
  rationale: Das Verb bezeichnet erstauntes, bewunderndes Verwundern. »Staunten« ist im modernen Deutsch natürlich und bewahrt die starke Reaktion.
- source_word: λέγοντες
  choice: und sagten
  rationale: Der griechische Partizipialanschluss wird im Deutschen idiomatisch als beigeordnete Handlung wiedergegeben.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Was ist das für einer
  rationale: ποταπός fragt nach Art oder Beschaffenheit. Die Formulierung ist natürliches modernes Deutsch und fügt keine nähere Bestimmung hinzu, die im Griechischen nicht ausdrücklich steht.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier den Sachverhalt ein, der die erstaunte Frage hervorruft. Die deutsche Konstruktion mit »dass« erhält diesen Zusammenhang.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: sogar die Winde und der See
  rationale: »Sogar« bringt die steigernde Kraft des ersten καί idiomatisch zum Ausdruck; das zweite καί verbindet die beiden Naturmächte.
- source_word: αὐτῷ ὑπακούουσιν
  choice: ihm … gehorchen
  rationale: ὑπακούω bezeichnet Hören mit der Folge des Gehorsams. »Gehorchen« vermittelt hier die persönliche Autorität Jesu über Wind und See.
theological_decisions:
- issue: Christologische Tragweite der Frage
  choice: Die erstaunte Frage bleibt offen formuliert und lässt Jesu außergewöhnliche Autorität über die Schöpfung hervortreten.
  alternative: Die christologische Folgerung ausdrücklich benennen oder die Aussage auf bloßes Erstaunen über ein Wunder reduzieren.
  rationale: Der Vers legt durch den Gehorsam von Wind und See eine hohe christologische Bedeutung nahe, spricht die abschließende Deutung aber nicht ausdrücklich aus. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Was ist das für einer« bewahrt die offene, staunende Frage; »der See« bezeichnet hier das Galiläische Meer und entspricht dem deutschen Sprachgebrauch im biblischen Kontext.
