  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: δέ wird mit „aber“ angemessen angeschlossen, ἐθαύμασαν als vergangene Reaktion wiedergegeben, und „dass sogar die Winde und der See ihm gehorchen“ bewahrt sowohl die steigernde Kraft von καί als auch die personale Autoritätsaussage von αὐτῷ ὑπακούουσιν. „Der See“ ist im Kontext des Galiläischen Meeres sachgerecht und im deutschen Bibelgebrauch etabliert.'
