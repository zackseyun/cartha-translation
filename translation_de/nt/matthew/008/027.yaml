  terminology: Die Bezeichnungen „Männer“, „Winde“, „See“ und „gehorchen“ sind angemessen. Die Formulierung vermeidet jede zusätzliche christologische Ausdeutung und lässt die im Text angelegte Verwunderung über Jesu Autorität stehen.
