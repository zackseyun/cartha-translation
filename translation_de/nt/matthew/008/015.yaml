source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: de
  text: Und er berührte ihre Hand, und das Fieber verließ sie. Sie stand auf und bediente ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »begann, ihn zu bedienen«. Das griechische Imperfekt kann eine fortdauernde Handlung beschreiben, aber auch darauf hindeuten, dass sie damit begann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο τῆς χειρὸς αὐτῆς
  choice: berührte ihre Hand
  rationale: Das mediale ἅπτομαι mit Genitiv bezeichnet hier eine Berührung. Die deutsche Akkusativkonstruktion ist natürlich und gibt die Handlung ohne Überzeichnung wieder.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: da verließ sie das Fieber
  rationale: ἀφίημι bedeutet hier »verlassen«; die Formulierung bewahrt die anschauliche Personifizierung des Fiebers. »Da« macht in natürlichem Deutsch den unmittelbaren erzählerischen Zusammenhang deutlich.
- source_word: πυρετός
  choice: Fieber
  rationale: Das Substantiv bezeichnet unmittelbar Fieber; eine Erweiterung zu einer allgemeineren Krankheit ist nicht nötig.
- source_word: ἠγέρθη
  choice: sie stand auf
  rationale: 'Die passive Form von ἐγείρω wird hier intransitiv im gewöhnlichen erzählerischen Sinn gebraucht: Nach der Heilung steht die Frau auf.'
- source_word: διηκόνει αὐτῷ
  choice: bediente ihn
  rationale: διακονέω bezeichnet in dieser häuslichen Szene das persönliche Dienen beziehungsweise Aufwarten. Das Imperfekt beschreibt die einsetzende oder andauernde Tätigkeit, ohne dass »begann« zwingend ausdrücklich ergänzt werden muss.
theological_decisions:
- issue: Mögliche theologische Überdeutung von ἠγέρθη
  choice: »sie stand auf« im gewöhnlichen erzählerischen Sinn
  alternative: »sie wurde aufgerichtet« oder »sie wurde auferweckt«
  rationale: Obwohl ἐγείρω andernorts Auferstehungsbezüge haben kann, bezeichnet es hier im unmittelbaren Zusammenhang das Aufstehen der geheilten Frau. Eine Auferstehungsaussage soll nicht in den Text eingetragen werden.
- issue: Aspekt des Imperfekts διηκόνει
  choice: »bediente ihn« mit Fußnote zur möglichen ingressiven Wiedergabe
  alternative: »begann, ihn zu bedienen«
  rationale: Das Imperfekt kann eine fortdauernde oder einsetzende Handlung darstellen. Der Haupttext vermeidet eine Festlegung, während die Fußnote die mögliche ingressive Nuance bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Semikolon- und Satzgliederung vermeidet eine schwerfällige Kette aus mehrfachen »und«; »bediente ihn« passt zur häuslichen Szene und bleibt allgemein verständlich.
