  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: de
  text: Und siehe, die ganze Stadt zog hinaus, um Jesus zu begegnen. Als sie ihn sahen, baten sie ihn inständig, ihr Gebiet zu verlassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Gegend. Wörtlich: von ihren Grenzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Und sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden und belebenden Erzählmarker ἰδού in einer modernen, verständlichen Form; „siehe“ wäre würdevoll, wirkt heute jedoch stärker altertümlich.
- source_word: πᾶσα ἡ πόλις
  choice: die ganze Stadt
  rationale: Gibt die Bevölkerung der Stadt als Gesamtheit wieder, wie es der griechischen Ausdrucksweise entspricht, ohne ausdrücklich zu behaupten, dass ausnahmslos jede Einzelperson hinausging.
- source_word: ἐξῆλθεν
  choice: zog hinaus
  rationale: Bezeichnet die Bewegung aus der Stadt heraus und klingt im erzählenden Zusammenhang natürlich und würdevoll.
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: um Jesus zu begegnen
  rationale: Gibt die Zweckrichtung der festen Wendung εἰς ὑπάντησιν klar wieder; „begegnen“ lässt offen, ob die Begegnung freundlich ist.
- source_word: ἰδόντες αὐτόν
  choice: Als sie ihn sahen
  rationale: Löst das Aoristpartizip natürlich als temporalen Nebensatz auf und bewahrt die erzählte Abfolge.
- source_word: παρεκάλεσαν
  choice: baten sie ihn inständig
  rationale: Erfasst die nachdrückliche Bitte, ohne durch „flehten“ eine möglicherweise zu starke emotionale Deutung einzutragen.
- source_word: ὅπως μεταβῇ
  choice: zu verlassen
  rationale: 'Gibt den Inhalt der Bitte idiomatisch wieder: Jesus soll sich aus ihrem Gebiet wegbegeben.'
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: ihr Gebiet
  rationale: ὅρια bezeichnet wörtlich Grenzen, kann aber metonymisch das von ihnen umgrenzte Gebiet meinen; „Gebiet“ ist im Deutschen hier die natürliche Hauptlesart.
theological_decisions:
- issue: Grund für die Bitte der Stadtbevölkerung
  choice: 'Der Grund bleibt ungenannt: Sie bitten Jesus inständig, ihr Gebiet zu verlassen.'
  alternative: Furcht vor Jesu Macht, Zorn wegen des Verlusts der Schweine oder allgemeine Bestürzung als Motiv ausdrücklich nennen.
  rationale: Der griechische Text berichtet die Bitte, erklärt aber ihr Motiv nicht. Die Übersetzung bewahrt diese narrative und theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Aufmerksamkeitshinweis „Und sieh“ erhält die Erzähllebendigkeit, ohne die stärker altertümliche Form „siehe“ zu verwenden. Die Bitte bleibt nachdrücklich, ihr Motiv jedoch bewusst offen.
