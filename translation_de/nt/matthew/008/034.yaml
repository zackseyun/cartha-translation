  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Die Stadtbevölkerung geht Jesus entgegen und bittet ihn anschließend nachdrücklich, ihr Gebiet zu verlassen. Das Motiv bleibt zutreffend unausgesprochen. Die Fußnote sollte jedoch die lokale Bedeutung von ὅρια präziser und weniger umständlich erläutern.'
  naturalness: „Und sieh“ ist im modernen erzählenden Standarddeutsch als Anrede an eine einzelne Person ungewöhnlich und wirkt hier weniger idiomatisch als „Und siehe“. Die übrige Formulierung ist klar und gut lesbar.
  terminology: „Gebiet“ ist für ὅρια im Kontext treffend. Die vorliegende Fußnote („sich von ihren Grenzen wegzubegeben“) ist als wörtliche Erklärung missverständlich, weil sie die Grenzen wie einen bloßen Ausgangspunkt behandelt. „Von ihren Grenzen“ ist die wörtliche Formulierung; kontextuell ist ihr Gebiet bzw. ihre Gegend gemeint.
