    issue: Der Erzählmarker „Und sieh“ ist stilistisch unidiomatisch.
    rationale: Als direkte Singularanrede ist „sieh“ in diesem narrativen Gebrauch im heutigen Deutsch ungewohnt. „Und siehe“ bewahrt die markierende, bewusst schriftsprachlich-biblische Funktion von καὶ ἰδού ohne diese Irritation.
  - severity: medium
    issue: Die Fußnote erklärt ἀπὸ τῶν ὁρίων αὐτῶν nicht präzise genug.
    rationale: „Sich von ihren Grenzen wegzubegeben“ kann räumlich bedeuten, sich von einer Grenzlinie zu entfernen. Der Ausdruck bezeichnet hier das Verlassen ihres abgegrenzten Gebiets; die Fußnote sollte die wörtliche Möglichkeit und die kontextuelle Bedeutung klar unterscheiden.
