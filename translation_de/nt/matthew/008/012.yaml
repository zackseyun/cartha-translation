id: MAT.8.12
reference: Matthew 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: de
  text: Aber die Söhne des Reiches[a] werden in die äußerste Finsternis hinausgeworfen. Dort wird Weinen und Zähneknirschen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „Söhne des Reiches“; eine Bezeichnung für diejenigen, die als rechtmäßige Erben oder erwartete Angehörige des Reiches gelten. Auch möglich: „Kinder des Reiches“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Aber die Söhne des Reiches
  rationale: '„Aber“ gibt den Kontrast zum vorherigen Vers wieder. Die formal nahe Wendung „Söhne des Reiches“ bewahrt das griechische Zugehörigkeits- und Erbenidiom sowie dessen Ironie: Gerade diejenigen, die als zum Reich gehörig gelten, werden ausgeschlossen.'
- source_word: ἐκβληθήσονται
  choice: werden … hinausgeworfen
  rationale: Das Futur Passiv von ἐκβάλλω bezeichnet eine gewaltsame Ausweisung. „Hinausgeworfen“ ist im modernen Deutsch klar und kräftig, ohne den Vorgang abzuschwächen.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: in die äußerste Finsternis
  rationale: Die im Deutschen etablierte biblische Wendung bewahrt das räumliche Bild eines Bereichs außerhalb. „Finsternis“ entspricht dem würdevollen Register der Gerichtsszene.
- source_word: ἐκεῖ
  choice: Dort
  rationale: Die Anfangsstellung erhält den im Griechischen hervorgehobenen Ortsbezug und klingt im Deutschen natürlich.
- source_word: ὁ κλαυθμὸς
  choice: Weinen
  rationale: „Weinen“ gibt die Klage wieder, ohne ihre Intensität über den griechischen Ausdruck hinaus festzulegen.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: Zähneknirschen
  rationale: „Zähneknirschen“ ist die natürliche und fest etablierte deutsche Entsprechung der griechischen Wendung.
theological_decisions:
- issue: Gerichtsbild und Art der Strafe
  choice: Die konkreten Bilder von Hinauswerfen, äußerster Finsternis, Weinen und Zähneknirschen bleiben stehen.
  alternative: Deutende Wiedergaben wie „Hölle“ oder „ewige Strafe“.
  rationale: Der Vers schildert ein schweres endzeitliches Ausschlussgericht, nennt hier aber weder ausdrücklich die Hölle noch die Dauer der Strafe. Die Bildsprache wird deshalb nicht systematisch ausgedeutet.
- issue: Wiedergabe von υἱοὶ
  choice: Söhne
  alternative: Kinder; Erben
  rationale: „Söhne“ entspricht der grammatisch maskulinen Form und bewahrt das idiomatische Bild. Eine Fußnote erläutert, dass damit diejenigen bezeichnet werden, die als zugehörige Erben oder erwartete Angehörige des Reiches gelten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „äußerste Finsternis“ wird wegen ihrer Prägnanz und Nähe zur matthäischen Bildsprache beibehalten; der übrige Satzbau ist gegenwärtig und gut verständlich.
