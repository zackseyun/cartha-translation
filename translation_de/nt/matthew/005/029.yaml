  terminology: '„Gehenna“ bewahrt γέεννα sachgerecht; die Fußnote nennt die traditionelle Wiedergabe „Hölle“, ohne sie dem Haupttext aufzuzwingen. „Glieder“ ist als Oberbegriff für μέλη korrekt, auch wenn das Auge keine Gliedmaße im engen Sinn ist. Die Fußnoten sind korrekt verankert: [a] bei der Bildsprache von σκανδαλίζει und [b] bei „Gehenna“.'
