id: MAT.5.29
reference: Matthew 5:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: de
  text: Wenn aber dein rechtes Auge dich zu Fall bringt[a], dann reiß es heraus und wirf es von dir. Denn es ist besser für dich, dass eines deiner Glieder zugrunde geht, als dass dein ganzer Körper in die Gehenna[b] geworfen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dich zur Sünde verleitet.'
    reason: lexical_alternative
  - marker: b
    text: Gehenna ist die griechische Form eines Namens, der mit dem Tal Hinnom verbunden ist; traditionell mit „Hölle“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: bringt dich zu Fall
  rationale: Die Wiedergabe bewahrt das griechische Bild des Stolperns beziehungsweise Fallens und lässt zugleich den im Kontext erkennbaren Bezug zur Sünde bestehen, ohne ihn im Haupttext vollständig auszudeuten.
- source_word: ἔξελε
  choice: reiß es heraus
  rationale: Der kraftvolle Imperativ und die drastische Bildsprache werden in natürlichem, gegenwärtigem Deutsch wiedergegeben.
- source_word: βάλε ἀπὸ σοῦ
  choice: wirf es von dir
  rationale: Die Formulierung erhält sowohl die Wucht von βάλλω als auch den durch ἀπὸ σοῦ bezeichneten Abstand.
- source_word: συμφέρει
  choice: es ist besser für dich
  rationale: Dies gibt den Gedanken des Vorteils in idiomatischem Deutsch wieder und passt zum ausdrücklich vergleichenden Satzbau.
- source_word: ἀπόληται
  choice: zugrunde geht
  rationale: Die Wahl bewahrt das ernste Gewicht von ἀπόλλυμι, ohne die genaue Art des Verlustes stärker festzulegen als der griechische Text.
- source_word: μελῶν
  choice: Glieder
  rationale: „Glieder“ ist eine würdige und verständliche Bezeichnung für Körperteile und erhält den Gegensatz zum ganzen Körper; es ist dabei weiter als „Gliedmaßen“, da auch das Auge gemeint ist.
- source_word: βληθῇ
  choice: geworfen wird
  rationale: Das Passiv von βάλλω wird direkt und in modernem Deutsch wiedergegeben.
- source_word: γέενναν
  choice: Gehenna
  rationale: Die Transliteration erhält den besonderen griechischen Begriff und vermeidet, seine historischen und theologischen Bezüge im Haupttext vorschnell mit dem allgemeineren Wort „Hölle“ gleichzusetzen.
- source_word: ὁ δεξιὸς
  choice: rechtes
  rationale: Die im Ausgangstext ausdrücklich genannte rechte Seite bleibt erhalten.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ gibt den leichten Gegensatz beziehungsweise die Weiterführung des Gedankens im Kontext angemessen wieder.
theological_decisions:
- issue: Wiedergabe von γέεννα
  choice: Gehenna
  alternative: Hölle
  rationale: Der Haupttext bewahrt den eigenständigen Ausdruck des griechischen Textes. Die traditionelle Wiedergabe wird in einer Fußnote genannt, ohne spätere Lehrvorstellungen in den Wortlaut einzutragen.
- issue: Bildhafte Bedeutung von σκανδαλίζω
  choice: bringt dich zu Fall
  alternative: verleitet dich zur Sünde
  rationale: Die Hauptfassung erhält das Bild des Fallens und damit die Mehrschichtigkeit des Ausdrucks. Die im Zusammenhang naheliegende Deutung auf Sünde wird als Alternative in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die drastischen Imperative und der Gegensatz zwischen einem einzelnen Glied und dem ganzen Körper bleiben erhalten; echte lexikalische und theologische Spannungen werden durch Fußnoten offengelegt.
