  source_fidelity: 'Der Entwurf gibt sämtliche wesentlichen Elemente des griechischen Textes wieder: die Bedingung und den leichten Kontrast (εἰ δὲ), die ausdrückliche Bezeichnung des rechten Auges, die Bildsprache von σκανδαλίζει, die zwei scharfen Imperative, die Trennung durch ἀπὸ σοῦ, den Vergleich mit einem einzelnen Körperglied sowie das Passiv „in die Gehenna geworfen wird“. „Zugrunde geht“ ist für ἀπόληται im Vergleichssatz tragfähig und legt keine über den Text hinausgehende präzise Art des Untergangs fest.'
