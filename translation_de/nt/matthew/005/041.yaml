  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: de
  text: Und wenn dich jemand zwingt, eine Meile mitzugehen, dann geh mit ihm zwei Meilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier verwendete Verb kann bedeuten, dass jemand kraft obrigkeitlicher Befugnis zu einem Dienst gezwungen wird. Gemeint ist eine römische Meile; im Griechischen heißt es wörtlich: „eine Meile … zwei“, wobei „Meilen“ beim zweiten Mal mitgedacht ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: wenn dich jemand
  rationale: Das indefinite Relativpronomen bezeichnet einen allgemeinen Fall. Die deutsche Konditionalkonstruktion ist natürlich und bewahrt diese offene, verallgemeinernde Aussage.
- source_word: ἀγγαρεύσει
  choice: zwingt, ... mitzugehen
  rationale: Das Verb bezeichnet das Heranziehen zu einem erzwungenen Dienst, häufig kraft obrigkeitlicher Befugnis. „Zwingt“ gibt den Zwang klar wieder; „mitzugehen“ ergibt sich aus dem Wegmaß und dem anschließenden μετ’ αὐτοῦ.
- source_word: μίλιον ἕν
  choice: eine Meile
  rationale: Gemeint ist eine römische Meile. „Eine Meile“ gibt Substantiv und Zahl verständlich und ohne unnötige historische Präzisierung im Haupttext wieder.
- source_word: ὕπαγε
  choice: geh
  rationale: Der Imperativ fordert zum Gehen beziehungsweise Weitergehen auf. „Geh“ ist direkt, idiomatisch und entspricht dem knappen Ausdruck.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: μετά mit Genitiv bezeichnet Begleitung; „mit ihm“ ist die unmittelbare deutsche Entsprechung.
- source_word: δύο
  choice: zwei Meilen
  rationale: Im Griechischen steht nur „zwei“, wobei „Meilen“ aus dem vorherigen Satzglied zu ergänzen ist. Im Deutschen wird die Einheit für einen natürlichen und eindeutigen Satz wiederholt.
theological_decisions:
- issue: Historisch-sozialer Hintergrund des erzwungenen Dienstes
  choice: Den Zwang deutlich wiedergeben, ohne im Haupttext römische Soldaten oder eine bestimmte Dienstleistung zu nennen.
  alternative: Ausdrücklich von römischem Militärdienst oder dem Tragen von Gepäck sprechen.
  rationale: ἀγγαρεύω und das römische Wegmaß lassen an obrigkeitlich erzwungenen Dienst im römischen Umfeld denken. Der griechische Text nennt jedoch weder Soldaten noch Gepäck; diese Einzelheiten werden daher nicht in den Haupttext eingeführt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Imperativform. Die Wiederholung von „Meilen“ vermeidet eine im Deutschen unnatürliche Ellipse; „dann“ verdeutlicht den konditionalen Zusammenhang, ohne den Sinn zu erweitern.
