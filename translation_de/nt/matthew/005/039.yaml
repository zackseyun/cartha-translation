  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: de
  text: 'Ich aber sage euch: Leistet einem bösen Menschen[a] keinen Widerstand. Wenn dich aber jemand auf die rechte Wange schlägt, dann halte ihm auch die andere hin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Leistet dem Bösen keinen Widerstand; auch möglich: Leistet dem Bösen (dem Teufel) keinen Widerstand.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: Wende ihm auch die andere zu.'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ich aber sage euch
  rationale: Die Formulierung bewahrt den Kontrast durch δέ und gibt die autoritative Redeformel eng und zugleich würdig wieder.
- source_word: μὴ ἀντιστῆναι
  choice: Leistet … keinen Widerstand
  rationale: ἀνθίστημι bezeichnet, sich jemandem oder etwas entgegenzustellen bzw. Widerstand zu leisten. Die Wiedergabe vermeidet eine vorschnelle Verengung auf Vergeltung oder rechtliche Gegenwehr.
- source_word: τῷ πονηρῷ
  choice: einem bösen Menschen
  rationale: Der substantivierte Dativ ist grammatisch mehrdeutig und kann das Böse, einen bösen Menschen oder den Bösen bezeichnen. Der unmittelbar folgende persönliche Fall spricht im Haupttext für einen menschlichen Übeltäter; die anderen Möglichkeiten bleiben in der Fußnote erhalten.
- source_word: ὅστις
  choice: wenn … jemand
  rationale: Im vorliegenden konditionalen Zusammenhang gibt diese Formulierung die unbestimmte Bedeutung natürlich wieder.
- source_word: ῥαπίζει
  choice: schlägt
  rationale: ῥαπίζω bezeichnet einen Schlag mit der Hand, häufig eine Ohrfeige. In Verbindung mit der Wange ist „schlägt“ klar und bewahrt gegenüber „ohrfeigt“ die Möglichkeit eines nicht näher bestimmten Handschlags.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: auf die rechte Wange
  rationale: σιαγών kann Kiefer oder Wange bedeuten; im Zusammenhang eines Handschlags ist „Wange“ die natürliche deutsche Entsprechung.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: halte ihm auch die andere hin
  rationale: Wörtlich ist vom Hinwenden der anderen Wange die Rede. Die deutsche Wendung „die andere hinhalten“ ist natürlich und vermittelt dieselbe konkrete Handlung, ohne „auch“ auszulassen.
theological_decisions:
- issue: Bedeutung von τῷ πονηρῷ
  choice: ein böser Mensch
  alternative: das Böse; der Böse
  rationale: Die griechische Form ist hinsichtlich Genus und Bezug offen. Das anschließende Beispiel legt einen menschlichen Angreifer nahe, entscheidet die sprachliche Mehrdeutigkeit jedoch nicht vollständig; deshalb werden die Alternativen in einer Fußnote genannt.
- issue: Umfang des verbotenen Widerstands
  choice: keinen Widerstand leisten
  alternative: nicht vergelten; sich nicht widersetzen
  rationale: Der allgemeinere Wortlaut des Verbs bleibt erhalten. Das Beispiel erläutert ihn als Verzicht auf Gegenwehr beziehungsweise Vergeltung, ohne dass die Übersetzung den Satz ausdrücklich auf eine einzige Art des Widerstands begrenzt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Halt ihm die andere Wange hin“ wäre idiomatischer, doch die gewählte Form vermeidet die Wiederholung von „Wange“, die auch im griechischen Text nur einmal ausdrücklich steht. Die Hauptfassung wahrt den Zusammenhang von Angriff und Nichtgegenwehr; die echte Mehrdeutigkeit von τῷ πονηρῷ wird in Fußnote [a] offengelegt.
