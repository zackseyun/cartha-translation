source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: de
  text: Glücklich zu preisen sind diejenigen, die nach Gerechtigkeit[a] hungern und dürsten; denn sie werden satt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann Gerechtigkeit, gerechte Verhältnisse oder das bezeichnen, was vor Gott recht ist.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Glücklich zu preisen sind
  rationale: Die Formulierung bewahrt den feierlichen, zusprechenden Charakter der Seligpreisung und vermeidet, μακάριοι auf ein bloß subjektives Glücksgefühl zu verengen.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: die ... hungern und dürsten
  rationale: Die verbale Formulierung gibt die fortdauernde, intensive Sehnsucht der griechischen Präsenspartizipien natürlich wieder.
- source_word: τὴν δικαιοσύνην
  choice: nach Gerechtigkeit
  rationale: „Gerechtigkeit“ kann im Deutschen sowohl rechtes Handeln und einen rechten Stand vor Gott als auch gerechte Verhältnisse bezeichnen. „Nach“ ist bei „hungern und dürsten“ idiomatisch.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ führt in einer würdigen und natürlichen deutschen Satzmelodie den Grund für die Seligpreisung ein.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das Personalpronomen bezeichnet ausdrücklich dieselbe Gruppe als Empfänger der Verheißung; eine zusätzliche Wiedergabe durch „sie selbst“ wäre im Deutschen unnötig schwer.
- source_word: χορτασθήσονται
  choice: werden satt werden
  rationale: Die Formulierung erhält das Bild von Hunger und Durst und gibt den zukünftigen Passivgedanken wieder, ohne den nicht genannten Handelnden ausdrücklich einzusetzen.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: das, was vor Gott recht ist; gerechte Verhältnisse
  rationale: Der griechische Begriff umfasst hier möglicherweise persönliche und gemeinschaftliche, religiöse und soziale Dimensionen. Der Haupttext lässt diesen Bedeutungsumfang offen; die Fußnote erläutert ihn, ohne ihn auf eine einzelne Lehrdeutung festzulegen.
- issue: Nicht genannter Handelnder beim Futurpassiv χορτασθήσονται
  choice: 'Passiv: „sie werden satt werden“'
  alternative: „Gott wird sie satt machen“
  rationale: Gott ist im Kontext als Handelnder naheliegend, wird im griechischen Wortlaut jedoch nicht ausdrücklich genannt. Das Passiv bewahrt diese zurückhaltende Formulierung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, einprägsamem Klang. Die parallele Bildsprache von Hunger, Durst und Sattwerden bleibt erhalten.
