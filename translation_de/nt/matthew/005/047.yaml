id: MAT.5.47
reference: Matthew 5:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: de
  text: Und wenn ihr nur eure Brüder[a] grüßt, was tut ihr Besonderes?[b] Tun nicht auch die Nichtjuden[c] dasselbe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ kann hier weiter gefasst die Angehörigen der eigenen Gemeinschaft meinen, also auch Brüder und Schwestern.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „Was tut ihr darüber hinaus?“'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „Heiden“; gemeint sind hier Menschen, die nicht zum jüdischen Volk gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: grüßt
  rationale: Das Verb bezeichnet hier das Entbieten eines Grußes. „Grüßen“ ist im Deutschen natürlich und vermeidet die weitergehende Bedeutung von „willkommen heißen“.
- source_word: ἀδελφοὺς
  choice: Brüder
  rationale: Die grammatisch maskuline Pluralform wird im Haupttext bewahrt; im Zusammenhang kann sie zugleich Angehörige der eigenen Gemeinschaft bezeichnen, was die Fußnote offenhält.
- source_word: μόνον
  choice: nur
  rationale: „Nur“ gibt die Einschränkung auf den eigenen Kreis knapp und idiomatisch wieder.
- source_word: τί περισσὸν ποιεῖτε
  choice: was tut ihr Besonderes?
  rationale: περισσόν bezeichnet das über das Übliche Hinausgehende. „Was tut ihr Besonderes?“ gibt die rhetorische Frage natürlich wieder, ohne das Maß des Unterschieds näher festzulegen.
- source_word: ἐθνικοὶ
  choice: Nichtjuden
  rationale: Der Ausdruck bezeichnet in diesem jüdischen Kontext Menschen aus den Völkern, also Nichtjuden. „Nichtjuden“ macht den ethnisch-religiösen Gegensatz für heutige Leser unmittelbar verständlich, ohne die stärker wertende Bedeutung von „Heiden“ festzuschreiben.
- source_word: τὸ αὐτὸ
  choice: dasselbe
  rationale: „Dasselbe tun“ ist die knappe und idiomatische Entsprechung der griechischen Wendung.
theological_decisions:
- issue: Reichweite von ἀδελφοὺς in der ethischen Mahnung
  choice: Im Haupttext steht „Brüder“; eine Fußnote weist auf die mögliche weitere Bedeutung als Angehörige der eigenen Gemeinschaft hin.
  alternative: „Brüder und Schwestern“ oder „Mitglieder eurer eigenen Gemeinschaft“
  rationale: So bleibt die maskuline Form des Griechischen sichtbar, ohne den möglicherweise inklusiven oder gruppenbezogenen Bezug auszuschließen.
- issue: Bedeutung von ἐθνικοὶ
  choice: „Nichtjuden“
  alternative: „Heiden“ oder „Menschen aus den Völkern“
  rationale: „Nichtjuden“ bewahrt den primären Gegensatz im jüdischen Kontext und vermeidet eine unnötig abwertende oder ausschließlich religionsbezogene Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen rhetorischen Fragen und die Gegenüberstellung des eigenen Kreises mit den Nichtjuden bleiben erhalten.
