  variant: modern standard German
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: de
  text: Denkt nicht, dass ich gekommen bin, um das Gesetz oder die Propheten aufzuheben; ich bin nicht gekommen, um sie aufzuheben, sondern um sie zu erfüllen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erfüllen“ kann hier auch im Sinn von „zur Vollendung bringen“ oder „voll zur Geltung bringen“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Denkt nicht
  rationale: Der verneinte Aorist-Konjunktiv hat hier verbietende Kraft. „Denkt nicht“ ist direkt, natürlich und entspricht der Anrede im Plural.
- source_word: ἦλθον
  choice: ich sei gekommen / ich bin gekommen
  rationale: Im ersten Satz verlangt die abhängige Gedankenwiedergabe im Deutschen idiomatisch „ich sei gekommen“; in der anschließenden direkten Aussage steht „ich bin gekommen“. Beide geben denselben griechischen Aorist natürlich wieder.
- source_word: καταλῦσαι
  choice: aufzuheben
  rationale: Im Zusammenhang mit „dem Gesetz oder den Propheten“ bezeichnet das Verb nicht körperliche Zerstörung, sondern das Beseitigen ihrer Geltung. „Aufheben“ bewahrt zugleich die markante Gegenüberstellung zu „erfüllen“.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: das Gesetz oder die Propheten
  rationale: Die feste Paarung verweist auf die heiligen Schriften Israels. Die Großschreibung der deutschen Substantive macht keine zusätzliche Deutung nötig.
- source_word: ἀλλὰ πληρῶσαι
  choice: sondern um sie zu erfüllen
  rationale: „Erfüllen“ bewahrt die breite Bedeutung von πληρόω und dessen theologisches und intertextuelles Gewicht. Das Pronomen „sie“ ist für flüssiges Deutsch ergänzt und nimmt beide vorausgehenden Größen auf.
theological_decisions:
- issue: Bedeutung von πληρῶσαι für Jesu Verhältnis zu Gesetz und Propheten
  choice: „erfüllen“ ohne Festlegung auf eine einzige theologische Erklärung
  alternative: „zur Vollendung bringen“ oder „voll zur Geltung bringen“
  rationale: Das griechische Verb kann hier mehrere eng verbundene Aspekte umfassen. Die Hauptfassung soll weder ausschließlich Erfüllung von Vorhersagen noch ausschließlich Bestätigung, Auslegung oder Abschluss behaupten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstruktur erhält die Wiederholung und den Gegensatz des griechischen Textes; „um“ und das wiederaufgenommene Pronomen sorgen für natürliche deutsche Syntax.
