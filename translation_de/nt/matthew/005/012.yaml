id: MAT.5.12
reference: Matthew 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: de
  text: Freut euch und jubelt, denn euer Lohn im Himmel ist groß. Genauso haben sie nämlich die Propheten verfolgt, die vor euch lebten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρετε καὶ ἀγαλλιᾶσθε
  choice: Freut euch und jubelt
  rationale: Die beiden Präsensimperative rufen zu Freude auf; ἀγαλλιᾶσθε steigert χαίρετε und wird durch das kräftigere „jubelt“ natürlich und prägnant wiedergegeben.
- source_word: μισθὸς
  choice: Lohn
  rationale: „Lohn“ deckt sowohl Vergütung als auch göttliche Belohnung ab und ist in diesem Zusammenhang im Deutschen geläufig, ohne den bildhaften Vergeltungsgedanken abzuschwächen.
- source_word: πολὺς
  choice: groß
  rationale: Das prädikative Adjektiv bezeichnet das Ausmaß des Lohns; „groß“ ist die natürliche deutsche Verbindung.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: im Himmel
  rationale: Der griechische Plural ist bei Matthäus häufig semitisch geprägt; modernes Deutsch bezeichnet den gemeinten himmlischen Bereich idiomatisch mit dem Singular.
- source_word: οὕτως γὰρ
  choice: Genauso … nämlich
  rationale: οὕτως bezeichnet hier die entsprechende Art der Verfolgung; γάρ begründet die Aufforderung und wird im Deutschen natürlich durch „nämlich“ aufgenommen.
- source_word: ἐδίωξαν
  choice: haben sie … verfolgt
  rationale: Im Kontext bezeichnet διώκω feindselige Verfolgung. Das deutsche Perfekt klingt in gegenwärtiger Standardsprache natürlich.
- source_word: τοὺς προφήτας τοὺς πρὸ ὑμῶν
  choice: die Propheten, die vor euch lebten
  rationale: Die attributive Präpositionalgruppe bezeichnet die Propheten früherer Zeit. „Die vor euch lebten“ macht den zeitlichen Bezug eindeutig und idiomatisch.
theological_decisions:
- issue: Ort und Verständnis des Lohns
  choice: „euer Lohn im Himmel ist groß“
  alternative: „euer Lohn in den Himmeln ist groß“
  rationale: Die Wiedergabe wahrt die Aussage eines bei Gott im himmlischen Bereich liegenden Lohns, ohne aus dem griechischen Plural mehrere Himmel als eigene Lehraussage abzuleiten.
- issue: Vergleich mit den Propheten
  choice: „Genauso haben sie nämlich die Propheten verfolgt“
  alternative: „Denn so haben sie die Propheten verfolgt“
  rationale: „Genauso“ lässt den Vergleich zwischen der Verfolgung der Angesprochenen und jener der früheren Propheten deutlich hervortreten, ohne die genaue Gestalt der Verfolgung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze Parallelform „Freut euch und jubelt“ bewahrt die rhetorische Steigerung. Keine Fußnote ist erforderlich, da „im Himmel“ die reguläre idiomatische deutsche Wiedergabe des matthäischen Plurals ist.
