review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt beide Imperative samt ihrer Steigerung treffend wieder: „Freut euch und jubelt“. „Lohn“, „groß“, „im Himmel“ und „verfolgt“ entsprechen dem Sinn der griechischen Ausdrücke. Der Singular „im Himmel“ ist im modernen Deutschen für das matthäische ἐν τοῖς οὐρανοῖς idiomatisch und legt keine zusätzliche theologische Aussage fest. „Die vor euch lebten“ gibt den zeitlichen Bezug von τοὺς πρὸ ὑμῶν verständlich wieder.'
  naturalness: Der Text ist flüssiges, würdiges modernes Standarddeutsch. Das Perfekt in „haben sie ... verfolgt“ ist im Deutschen natürlich. Die Verbindung „Genauso ... nämlich“ ist möglich und macht den begründenden Vergleich verständlich.
  terminology: „Lohn“ bewahrt den traditionellen, zugleich allgemein verständlichen biblischen Ausdruck für μισθός. „Propheten“ und „Himmel“ sind angemessen und konsistent. Es sind keine Fußnoten erforderlich.
