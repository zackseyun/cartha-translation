id: MAT.5.15
reference: Matthew 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: de
  text: Man zündet auch keine Lampe an und stellt sie unter ein Maßgefäß, sondern auf den Lampenständer, und sie gibt allen im Haus Licht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Auch … keine
  rationale: Führt ein weiteres negatives Beispiel an und verbindet es natürlich mit dem vorausgehenden Bild.
- source_word: καίουσιν λύχνον
  choice: zündet man … eine Lampe an
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen idiomatisch mit dem generischen „man“ wiedergegeben; bei einer Lampe ist „anzünden“ die natürliche Entsprechung.
- source_word: ὑπὸ τὸν μόδιον
  choice: unter ein Gefäß
  rationale: μόδιος bezeichnet ein Trockenmaß und auch dessen Behälter. „Gefäß“ bewahrt die konkrete Vorstellung, ohne das heute missverständliche traditionelle Maßwort „Scheffel“ in den Haupttext zu setzen.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: auf den Lampenständer
  rationale: λυχνία ist ein Ständer beziehungsweise eine Halterung für eine Lampe. Der bestimmte Artikel folgt dem griechischen Ausdruck und klingt in der Gegenüberstellung natürlich.
- source_word: λάμπει
  choice: leuchtet
  rationale: Gibt die Grundbedeutung von λάμπω unmittelbar wieder und lässt sowohl das Scheinen als auch die Lichtwirkung erkennen.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: allen im Haus
  rationale: Eine knappe, natürliche Wiedergabe, die den universalen Umfang von πᾶσιν und den räumlichen Sinn von οἰκίᾳ erhält.
theological_decisions:
- issue: Nicht ausdrücklich genanntes generisches Subjekt der griechischen Verben
  choice: man
  alternative: die Leute / niemand
  rationale: Das deutsche generische „man“ gibt die sprichwörtliche Allgemeingültigkeit der unbestimmten dritten Person Plural wieder, ohne ein bestimmtes handelndes Kollektiv einzuführen.
- issue: Bezug des abschließenden Verbs λάμπει
  choice: dann leuchtet sie allen im Haus
  alternative: und sie gibt allen im Haus Licht
  rationale: Das grammatische Subjekt bleibt die Lampe. „Leuchtet“ wahrt die lexikalische Direktheit; „allen“ bewahrt den Personenbezug des Dativs, ohne die Aussage theologisch auszuweiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. „Lampenständer“ erhält das konkrete Bild; „Scheffel“ erscheint wegen seiner historischen Bekanntheit nur als Fußnotenalternative.
