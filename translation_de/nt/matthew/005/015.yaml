    rationale: Das abschließende καί verbindet schlicht die Folgehandlung bzw. Wirkung; die deutsche Koordination mit „und“ reicht aus.
  - severity: low
    issue: Die Wortstellung „Auch zündet man …“ klingt unnötig gehoben.
    rationale: Die Nachstellung von „auch“ nach dem generischen Subjekt ist in modernem Standarddeutsch flüssiger und bewahrt die anschließende negative Illustration.
  revised_text: Man zündet auch keine Lampe an und stellt sie unter ein Maßgefäß, sondern auf den Lampenständer, und sie gibt allen im Haus Licht.
