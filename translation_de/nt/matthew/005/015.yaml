  source_fidelity: 'Der Entwurf gibt die Satzstruktur, die generische Aussage, Lampe, Lampenständer und den Personenkreis im Haus insgesamt zutreffend wieder. „Gefäß“ allein ist für μόδιος jedoch zu unspezifisch: Gemeint ist ein Trockenmaß beziehungsweise dessen als Abdeckung verwendeter Maßbehälter. Das ergänzte „dann“ hat im Griechischen keine ausdrückliche Entsprechung und ist nicht nötig.'
  naturalness: „Man zündet auch keine Lampe an“ ist im modernen Standarddeutsch natürlicher als die vorangestellte Form „Auch zündet man …“. „und sie gibt allen im Haus Licht“ ist eine klare, idiomatische Wiedergabe der Lichtwirkung für πᾶσιν und vermeidet die leicht weniger präzise Verbindung „jemandem leuchten“.
  terminology: „Maßgefäß“ macht die Funktion von μόδιος im Haupttext verständlich, ohne das historische Maßwort „Scheffel“ vorauszusetzen. „Lampenständer“ ist für λυχνία passend und verständlich. Die Fußnote bewahrt „Scheffel“ als traditionelle Alternative und erklärt den Begriff.
