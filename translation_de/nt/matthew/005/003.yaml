source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: de
  text: Glücklich zu preisen[a] sind die, die im Geist arm sind[b], denn ihnen gehört das Himmelreich.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Selig sind“ oder „glücklich sind“. Das griechische Wort bezeichnet einen beneidenswerten Zustand unter Gottes Gunst, nicht nur ein Glücksgefühl.'
    reason: lexical_alternative
  - marker: b
    text: „Im Geist arm“ kann auch als „geistlich arm“ oder als „Menschen, die sich ihrer geistlichen Bedürftigkeit bewusst sind“ verstanden werden. Die Übersetzung bewahrt die offene griechische Formulierung.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „das Reich der Himmel“, eine für Matthäus charakteristische Ausdrucksweise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Glücklich zu preisen sind
  rationale: Die Wendung bezeichnet einen aufgrund göttlicher Gunst beneidenswerten Zustand und nicht bloß ein subjektives Glücksgefühl. Sie ist im Deutschen verständlich, würdevoll und für die Seligpreisungen passend.
- source_word: οἱ πτωχοὶ
  choice: die … arm sind
  rationale: Die substantivierte Adjektivform bezeichnet die Armen. Die deutsche Relativkonstruktion verbindet sich natürlich mit der näheren Bestimmung „im Geist“, ohne die Armut auf Demut oder Bedürfnisbewusstsein einzuengen.
- source_word: τῷ πνεύματι
  choice: im Geist
  rationale: Der Dativ bezeichnet den Bereich oder die Hinsicht der Armut. „Im Geist“ bewahrt die knappe Ausdrucksweise und ihre Deutungsoffenheit; „geistlich arm“ wäre stärker auslegend, „im Heiligen Geist“ unbegründet.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt den Grund der Seligpreisung ein. „Denn“ ist hier natürlich und bewahrt den feierlichen, aber gegenwärtigen Ton.
- source_word: αὐτῶν ἐστιν
  choice: ihnen gehört
  rationale: Die deutsche Besitzkonstruktion gibt das präsentische ἐστιν mit dem vorangestellten, betonten αὐτῶν idiomatisch wieder und vermeidet eine Verschiebung in die Zukunft.
- source_word: ἡ βασιλεία
  choice: das Reich
  rationale: βασιλεία umfasst Königsherrschaft und Herrschaftsbereich. In der festen deutschen Verbindung „Himmelreich“ bleibt diese Bedeutungsbreite konventionell erkennbar.
- source_word: τῶν οὐρανῶν
  choice: Himmel-
  rationale: Der griechische Plural „der Himmel“ gehört zu Matthäus’ charakteristischer Wendung. Das eingebürgerte deutsche „Himmelreich“ gibt sie idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von „arm im Geist“
  choice: Die offene Formulierung „im Geist arm“ bleibt im Haupttext erhalten.
  alternative: „geistlich arm“, „demütig“ oder „Menschen, die ihre geistliche Bedürftigkeit erkennen“
  rationale: Der griechische Ausdruck ist theologisch gehaltvoll und lässt mehrere eng verwandte Deutungen zu. Eine erklärende Paraphrase würde die vom Ausgangstext offengelassene Spannung vorschnell auflösen.
- issue: Gegenwärtiger Besitz des Himmelreichs
  choice: „ihnen gehört“ im Präsens
  alternative: „ihnen wird gehören“
  rationale: ἐστιν steht im Präsens. Die Aussage darf daher nicht ausschließlich zu einer zukünftigen Verheißung umgedeutet werden.
- issue: Bezug von πνεῦμα
  choice: „Geist“ ohne ausdrückliche Identifikation
  alternative: „Heiliger Geist“ oder ausdrücklich „menschlicher Geist“
  rationale: Der Text nennt keinen solchen eindeutigen Bezug. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Rhythmus. „Glücklich zu preisen“ vermeidet die mögliche Verengung von „glücklich“ auf ein Gefühl; „Himmelreich“ ist eine geläufige und idiomatische Wiedergabe der matthäischen Formel. Alle Erläuterungen bleiben in den Fußnoten, damit der Haupttext knapp und einprägsam bleibt.
