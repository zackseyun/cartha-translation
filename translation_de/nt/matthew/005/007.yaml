revisions:
- from: Glückselig sind die Barmherzigen, denn ihnen wird Barmherzigkeit erwiesen werden.
  to: Selig sind die Barmherzigen, denn sie werden Barmherzigkeit erfahren.
  rationale: Die Revision ersetzt die veraltete Bezeichnung „Glückselig“ durch das in modernen deutschen Bibelübersetzungen und im Seligpreisungsregister natürliche „Selig“. Die Verheißung wird idiomatisch formuliert, ohne Gott oder andere ausdrücklich als Handelnde einzutragen. Die Wiederholung von „Barmherzig-“ erhält die lexikalische Entsprechung des griechischen Satzes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:40:26Z'
review_pass:
  verdict: revise
  source_fidelity: Die Aussage, die Kausalverknüpfung und die ungenannte handelnde Instanz des griechischen Futurpassivs werden zutreffend wiedergegeben. Die Formulierung „ihnen wird Barmherzigkeit erwiesen werden“ bildet das Passiv zwar formal ab, ist durch die doppelte werden-Form jedoch unnötig schwerfällig.
  naturalness: „Glückselig“ wirkt im modernen Standarddeutsch deutlich veraltet und ist außerhalb traditioneller Bibelsprache kaum natürlich. „Selig“ ist die etablierte, würdige und zugleich knappere Form der Seligpreisungen. „Sie werden Barmherzigkeit erfahren“ ist idiomatisches modernes Deutsch und wahrt, ohne einen Handelnden einzuführen, die Offenheit des griechischen Passivs.
  terminology: „Barmherzige/Barmherzigkeit“ bewahrt die im Griechischen bestehende Wortverbindung zwischen ἐλεήμονες und ἐλεηθήσονται. „Selig“ gibt μακάριοι in diesem literarischen und biblischen Register angemessener wieder als „Glückselig“.
  issues:
  - severity: medium
    issue: „Glückselig“ ist nicht modernsprachlich genug.
    rationale: Für die Zielvariante modernes Standarddeutsch ist „Glückselig“ antiquiert. „Selig“ ist im Kontext der Seligpreisungen idiomatisch, traditionsbewusst und weniger künstlich.
  - severity: low
    issue: Die Schlussform ist unnötig umständlich.
    rationale: „Ihnen wird Barmherzigkeit erwiesen werden“ ist grammatisch korrekt, aber wegen der Häufung von „werden“ schwerfällig. Eine idiomatische Formulierung kann die agentenoffene Zusage ebenso zuverlässig wiedergeben.
  revised_text: Selig sind die Barmherzigen, denn sie werden Barmherzigkeit erfahren.
  revised_footnotes: []
