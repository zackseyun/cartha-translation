  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: de
  text: Selig sind die Barmherzigen, denn sie werden Barmherzigkeit erfahren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Glückselig
  rationale: Bewahrt als geläufiger Begriff der Seligpreisungen den Gedanken göttlicher Gunst und umfassenden Wohlergehens; „glücklich“ könnte zu stark als bloß subjektives Empfinden verstanden werden.
- source_word: οἱ ἐλεήμονες
  choice: die Barmherzigen
  rationale: Der substantivierte Plural wird knapp und sprichwortartig wiedergegeben. „Barmherzig“ wahrt zudem die Wortverbindung zum folgenden Verb ἐλεηθήσονται.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung der Seligpreisung ein und entspricht in der gehobenen, zugleich verständlichen Form natürlich dem griechischen Kausalsatz.
- source_word: αὐτοὶ
  choice: ihnen
  rationale: 'Die hervorgehobene Rückbeziehung wird durch die Voranstellung des Dativpronomens im deutschen Passivsatz erkennbar: Gerade ihnen gilt die verheißene Barmherzigkeit.'
- source_word: ἐλεηθήσονται
  choice: wird Barmherzigkeit erwiesen werden
  rationale: Gibt das Futur Passiv ausdrücklich wieder, erhält die lexikalische Verbindung zu „Barmherzigen“ und lässt den Handelnden wie im Griechischen ungenannt.
theological_decisions:
- issue: Urheber der verheißenen Barmherzigkeit
  choice: Passiv ohne ausdrückliche Nennung des Handelnden
  alternative: Gott wird ihnen Barmherzigkeit erweisen
  rationale: Der Zusammenhang legt Gott als Handelnden nahe, doch der griechische Wortlaut nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
- issue: Verhältnis von Barmherzigkeit und empfangener Barmherzigkeit
  choice: Die kausale Formulierung mit „denn“ und die Entsprechung der Wortstämme bleiben bestehen
  alternative: Eine Deutung als Verdienst, Bedingung oder bloße Folge ausdrücklich festlegen
  rationale: Der Vers stellt die Entsprechung fest, erklärt aber nicht näher, in welchem dogmatischen Verhältnis das barmherzige Handeln zur Verheißung steht.
translation_notes:
  register: Knapp, würdevoll und an der traditionellen Form der Seligpreisungen orientiert. „Glückselig“ ist leicht gehoben, aber im biblischen Sprachgebrauch verständlich. Die passive Schlussform ist formaler als „sie werden Barmherzigkeit erfahren“, bildet jedoch Form und theologische Offenheit des griechischen Textes genauer ab.
