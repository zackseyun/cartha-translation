id: MAT.5.11
reference: Matthew 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: de
  text: Selig seid ihr, wenn man euch um meinetwillen beschimpft und verfolgt und euch fälschlich alles Böse nachsagt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen mir“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jede Art von Bösem gegen euch sagt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Glückselig seid ihr
  rationale: Bewahrt die feierliche Seligpreisungsformel und deren theologisches Gewicht; „glücklich“ allein könnte zu sehr nach einem bloßen Gefühl klingen.
- source_word: ὅταν
  choice: wenn
  rationale: Gibt die allgemeine, künftige Bedingung mit den folgenden Konjunktiven natürlich und präzise wieder.
- source_word: ὀνειδίσωσιν ὑμᾶς
  choice: man euch beschimpft
  rationale: Bezeichnet verständlich und gegenwärtig ehrverletzende verbale Angriffe; das unbestimmte „man“ ist im Deutschen idiomatischer als ein nicht näher bestimmtes „sie“.
- source_word: διώξωσιν
  choice: verfolgt
  rationale: Bewahrt die Breite feindseliger Bedrängung, ohne sie auf körperliche Gewalt oder rechtliche Verfolgung einzuengen.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: euch alles mögliche Böse nachsagt
  rationale: Gibt umfassende böswillige Rede gegen die Angesprochenen in natürlichem Deutsch wieder; „nachsagen“ passt besonders zu verleumderischen Behauptungen.
- source_word: ψευδόμενοι
  choice: fälschlich
  rationale: Gibt das adverbial gebrauchte Partizip knapp wieder und macht deutlich, dass die bösen Behauptungen unwahr sind.
- source_word: ἕνεκεν ἐμοῦ
  choice: meinetwegen
  rationale: Drückt in modernem, prägnantem Deutsch aus, dass die Verbundenheit mit Jesus der Grund der Anfeindung ist.
theological_decisions:
- issue: Art der beschriebenen Anfeindung
  choice: Der Vers umfasst Beschimpfung, Verfolgung und unwahre böse Nachrede aufgrund der Verbundenheit mit Jesus.
  alternative: Die Verfolgung ausschließlich als körperliche Gewalt oder den ganzen Vers ausschließlich als Verleumdung zu verstehen.
  rationale: Die drei koordinierten Verben bezeichnen verschiedene, sich überschneidende Formen der Feindseligkeit; die Übersetzung engt deren Umfang nicht ein.
- issue: Bezug von ψευδόμενοι
  choice: „fälschlich“ kennzeichnet die bösen Aussagen als unwahr.
  alternative: Das Partizip als zusätzliche, eigenständige Handlung „während sie lügen“ wiederzugeben.
  rationale: Der griechische Satz verbindet das Partizip eng mit dem Aussprechen des Bösen; die adverbiale Wiedergabe bewahrt diesen Zusammenhang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glückselig“ wahrt bewusst die biblische Seligpreisungsformel, während „beschimpft“, „verfolgt“ und „nachsagt“ allgemein verständlich bleiben. Beide Fußnotenmarker stehen im Haupttext.
