- from: Glückselig seid ihr, wenn man euch beschimpft und verfolgt und euch meinetwegen[a] fälschlich alles mögliche Böse nachsagt.[b]
  to: Selig seid ihr, wenn man euch um meinetwillen beschimpft und verfolgt und euch fälschlich alles Böse nachsagt.[a][b]
  rationale: Die Revision ersetzt die altertümliche Wendung „Glückselig“ durch die im modernen deutschen Bibelregister natürliche Formel „Selig“. Sie stellt „um meinetwillen“ so um, dass es erkennbar den Grund sämtlicher genannter Anfeindungen bezeichnet. Die Aussage bleibt in Umfang und Ambiguität unverändert; insbesondere wird „Verfolgung“ nicht näher spezifiziert.
