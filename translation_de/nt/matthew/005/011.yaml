  source_fidelity: Die drei feindseligen Handlungen sowie die Unwahrheit der bösen Aussagen sind zutreffend wiedergegeben. Die Stellung von „meinetwegen“ am Satzende kann im Deutschen jedoch unnötig nahe nur an die letzte Handlung gebunden verstanden werden, obwohl ἕνεκεν ἐμοῦ den Grund der gesamten beschriebenen Anfeindung angibt.
  naturalness: „Glückselig“ ist im heutigen Standarddeutsch deutlich altertümlicher und weniger idiomatisch als die etablierte, zugleich würdevolle Formel „Selig seid ihr“. Die vorgezogene Grundangabe „um meinetwillen“ macht den Satzbezug klar und bleibt natürlich.
  terminology: „Selig“ entspricht μακάριοι im Kontext der Seligpreisungen angemessen. „Beschimpft“, „verfolgt“, „fälschlich“ und „alles Böse nachsagt“ geben ὀνειδίζω, διώκω, ψευδόμενοι und πᾶν πονηρόν idiomatisch wieder, ohne die Verfolgung auf eine bestimmte Form einzuengen.
