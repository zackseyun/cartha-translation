id: MAT.5.40
reference: Matthew 5:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: de
  text: Und wenn einer mit dir vor Gericht gehen und dir dein Untergewand[a] nehmen will, dann überlass ihm auch deinen Mantel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Untergewand“ wurde unmittelbar am Körper getragen; der „Mantel“ war das äußere Kleidungsstück.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: wenn einer … will
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein eine beliebige Person; die deutsche Konditionalkonstruktion gibt die generische Situation natürlich wieder und bewahrt den Willensaspekt von θέλω.
- source_word: σοι κριθῆναι
  choice: mit dir vor Gericht gehen
  rationale: Das passive Infinitiv κριθῆναι bezeichnet wörtlich ein Gerichtsverfahren bzw. das Sich-richten-Lassen. Die Formulierung wahrt den rechtlichen Rahmen und vermeidet die engere moderne Festlegung von „verklagen“.
- source_word: χιτῶνά
  choice: Untergewand
  rationale: χιτών bezeichnet das am Körper getragene innere Kleidungsstück. „Untergewand“ macht den historischen Gegensatz zum äußeren ἱμάτιον unmittelbar verständlich.
- source_word: λαβεῖν
  choice: nehmen
  rationale: λαμβάνω bezeichnet hier die Erlangung beziehungsweise Wegnahme des Kleidungsstücks im Rahmen des Rechtsstreits; „nehmen“ ist direkt und semantisch offen.
- source_word: ἄφες
  choice: überlass ihm
  rationale: Der Aoristimperativ von ἀφίημι fordert dazu auf, dem Gegner das Kleidungsstück zu lassen beziehungsweise auszuhändigen. „Überlass ihm“ bewahrt die direkte Aufforderung in natürlichem Deutsch.
- source_word: ἱμάτιον
  choice: Mantel
  rationale: ἱμάτιον ist das äußere Kleidungsstück. „Mantel“ ist im Deutschen eine klare, würdige und historisch passende Entsprechung und erhält den Gegensatz zum Untergewand.
- source_word: καὶ … καὶ
  choice: Und … auch
  rationale: Das erste καί verbindet den Vers mit dem vorherigen Ausspruch; das zweite fügt steigernd den Mantel hinzu. „Und … auch“ bildet diese additive Struktur ab.
theological_decisions:
- issue: Ethische Tragweite von Jesu Weisung in einem Rechtsstreit
  choice: Als direkte Aufforderung zu radikalem, nicht vergeltendem Nachgeben wiedergeben.
  alternative: Als bloß allgemeines Prinzip des Verzichts auf eigene Rechte abschwächen.
  rationale: Der Imperativ ἄφες und die konkrete Gegenüberstellung der Kleidungsstücke bewahren die zugespitzte Forderung Jesu. Die Übersetzung sollte sie weder metaphorisch verflüchtigen noch konfessionell eingrenzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die rechtliche Formulierung bleibt bewusst etwas weiter als „verklagen“, um die Bedeutung von κριθῆναι nicht unnötig zu verengen. Der Fußnotenmarker [a] steht unmittelbar beim erklärungsbedürftigen Kleidungsbegriff.
