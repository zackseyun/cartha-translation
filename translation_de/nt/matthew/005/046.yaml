  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: de
  text: Denn wenn ihr die liebt, die euch lieben, welchen Lohn habt ihr?[a] Tun nicht auch die Steuereinnehmer dasselbe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Welche Vergütung habt ihr?“ Das griechische Wort kann „Lohn“, „Vergütung“ oder „Belohnung“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Denn wenn
  rationale: „Denn“ bewahrt die begründende Verbindung zum vorausgehenden Gebot, während „wenn“ die Bedingung natürlich wiedergibt.
- source_word: ἀγαπήσητε
  choice: ihr liebt
  rationale: Der Aorist Konjunktiv nach ἐάν bildet hier eine allgemeine Bedingung; im Deutschen ist dafür das Präsens idiomatisch.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: die euch lieben
  rationale: Das substantivierte Partizip bezeichnet die Menschen, die den Angesprochenen Liebe entgegenbringen, und die Wiederholung von „lieben“ erhält die Wortverbindung des Griechischen.
- source_word: τίνα μισθὸν ἔχετε
  choice: welchen Lohn habt ihr dann?
  rationale: „Lohn“ deckt im Deutschen sowohl Vergütung als auch Belohnung ab und bewahrt damit die Bedeutungsweite von μισθός. „Dann“ verdeutlicht idiomatisch die Folge innerhalb der Bedingung, ohne einen neuen Gedanken einzuführen.
- source_word: οὐχὶ καὶ
  choice: Tun nicht auch
  rationale: οὐχί leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet; καί hebt hervor, dass selbst die genannte Gruppe so handelt. Die deutsche Konstruktion gibt diese Wirkung natürlich wieder.
- source_word: οἱ τελῶναι
  choice: die Zolleinnehmer
  rationale: τελῶναι waren Pächter oder Einnehmer von Steuern und Zöllen. „Zolleinnehmer“ ist präzise, verständlich und im neutestamentlichen Zusammenhang geläufig.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: tun ... dasselbe
  rationale: Die Wendung gibt die schlichte Bedeutung „dasselbe tun“ knapp und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von μισθός in Jesu ethischer Lehre
  choice: Lohn
  alternative: Belohnung; Vergütung
  rationale: „Lohn“ erhält die mögliche Bedeutung von Gegenleistung beziehungsweise Belohnung, ohne die Aussage auf ein mechanisches Verdienstschema festzulegen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Das einschränkende „nur“ macht den im griechischen Kontext angelegten Gegensatz der bloß gegenseitigen Liebe natürlich verständlich; die rhetorische Schlussfrage bleibt erhalten.
