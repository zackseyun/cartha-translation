source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: de
  text: 'Ihr habt weiter gehört, dass zu den Menschen früherer Zeiten gesagt wurde: »Du sollst keinen falschen Eid schwören[a], sondern deine Eide gegenüber dem Herrn erfüllen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du sollst keinen Eid brechen.« Das Verb kann sowohl falsches Schwören als auch die Verletzung eines Eides bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gegenüber dem HERRN«; so würde der Bundesname Gottes im alttestamentlichen Hintergrund wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Weiter
  rationale: Kennzeichnet einen weiteren Fall in der fortlaufenden Reihe. „Weiter“ gibt den Zusammenhang natürlich wieder, ohne einen zeitlichen Wiederholungssinn aufzudrängen.
- source_word: ἠκούσατε
  choice: habt ihr gehört
  rationale: Das deutsche Perfekt entspricht in dieser formelhaften Aussage natürlichem gegenwärtigem Deutsch und bewahrt den fortwirkenden Bezug des Gehörten.
- source_word: ἐρρέθη
  choice: gesagt wurde
  rationale: Bewahrt die unpersönliche Passivkonstruktion, ohne den Sprecher näher zu bestimmen.
- source_word: τοῖς ἀρχαίοις
  choice: zu den Menschen in alter Zeit
  rationale: Bezeichnet frühere Generationen. Die Formulierung vermeidet sowohl das missverständliche „den Alten“ als auch die mögliche Verengung von „den Vorfahren“ auf leibliche Ahnen.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Du sollst keinen falschen Eid schwören
  rationale: ἐπιορκέω kann falsches Schwören oder den Bruch eines Eides bezeichnen. Die Hauptfassung gibt den unmittelbaren Sinn klar wieder; die andere mögliche Bedeutung wird in einer Fußnote bewahrt.
- source_word: ἀποδώσεις
  choice: erfüllen
  rationale: ἀποδίδωμι bezeichnet hier das Einlösen einer durch einen Eid übernommenen Verpflichtung. „Erfüllen“ ist im Deutschen klarer und natürlicher als „entrichten“ oder „zurückgeben“.
- source_word: τῷ κυρίῳ
  choice: gegenüber dem Herrn
  rationale: Der Dativ bezeichnet denjenigen, dem gegenüber die eidliche Verpflichtung besteht. „Herr“ folgt dem griechischen κύριος; der alttestamentliche Hintergrund wird in einer Fußnote kenntlich gemacht.
- source_word: τοὺς ὅρκους σου
  choice: deine Eide
  rationale: Gibt den Plural und die konkrete Bedeutung von ὅρκος knapp und direkt wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in einer Zusammenfassung alttestamentlicher Gebote
  choice: dem Herrn
  alternative: dem HERRN
  rationale: Der griechische Text bietet κυρίῳ und keine direkte hebräische Schreibung des Gottesnamens. Daher steht „Herr“ im Haupttext; „HERR“ bleibt wegen des Bundesnamens im alttestamentlichen Hintergrund als Fußnotenalternative erhalten.
- issue: Bedeutungsumfang von ἐπιορκέω
  choice: keinen falschen Eid schwören
  alternative: einen Eid nicht brechen
  rationale: Das Verb kann sowohl falsches Schwören als auch die Verletzung eines Eides bezeichnen. Die Hauptfassung ist verständlich und hält den Bezug zum Schwören fest; die echte lexikalische Alternative wird nicht stillschweigend ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Die altertümlich klingende Formulierung „den Alten“ wurde vermieden; der rechtlich-religiöse Charakter von „Eid“ und „erfüllen“ bleibt erhalten.
