  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: de
  text: 'Ihr habt gehört, dass zu den Menschen früherer Zeiten gesagt wurde: »Du sollst nicht morden; wer aber mordet, wird dem Gericht verfallen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ihr habt gehört
  rationale: Das deutsche Perfekt gibt die Diskursformel natürlich wieder und hebt hervor, dass die Angesprochenen diese Lehre als überlieferte Unterweisung kennen.
- source_word: ἐρρέθη
  choice: gesagt wurde
  rationale: Die Passivform bleibt erhalten, ohne den Sprecher ausdrücklich zu bestimmen.
- source_word: τοῖς ἀρχαίοις
  choice: zu den Menschen früherer Zeiten
  rationale: Die Formulierung gibt den Dativ als Empfängerangabe wieder und bezeichnet verständlich Menschen aus früherer Zeit; das knappe »den Alten« wäre im heutigen Deutsch mehrdeutig.
- source_word: Οὐ φονεύσεις
  choice: Du sollst nicht morden
  rationale: φονεύω bezeichnet hier Töten im Sinn von Mord und ist enger als das allgemeine »töten«.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: wer aber mordet
  rationale: Die unbestimmte Relativkonstruktion mit ἄν und Konjunktiv wird als allgemeiner Fall natürlich wiedergegeben; δέ erscheint als »aber«.
- source_word: ἔνοχος ἔσται
  choice: wird … verfallen sein
  rationale: Die Wendung bezeichnet rechtliche Haftbarkeit beziehungsweise das Unterworfensein unter eine gerichtliche Instanz oder Folge.
- source_word: τῇ κρίσει
  choice: dem Gericht
  rationale: κρίσις kann in diesem juristischen Zusammenhang das urteilende Gericht beziehungsweise gerichtliche Verfahren bezeichnen. »Gericht« bewahrt die institutionelle und judizielle Offenheit besser als das bereits stärker ergebnisbezogene »Verurteilung«.
theological_decisions:
- issue: Wiedergabe des sechsten Gebots
  choice: morden
  alternative: töten
  rationale: Das griechische φονεύω bezeichnet unerlaubtes Töten beziehungsweise Mord, nicht unterschiedslos jede Form des Tötens. Die Übersetzung vermeidet daher eine weitergehende ethische Aussage, die der Wortlaut nicht ausdrücklich macht.
- issue: Bezug von τῇ κρίσει
  choice: dem Gericht verfallen
  alternative: dem Urteil verfallen / der Verurteilung schuldig
  rationale: Der Ausdruck bleibt bei der gerichtlichen Verantwortlichkeit und legt weder eine bestimmte irdische Instanz noch das Ergebnis des Verfahrens unnötig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in der Anrede des Plurals. Die traditionelle Gebotsform »Du sollst nicht …« bleibt wegen ihrer Vertrautheit und ihrer genauen Funktion angemessen. Das Semikolon stellt Gebot und Rechtsfolge als eine zusammenhängende überlieferte Aussage dar.
