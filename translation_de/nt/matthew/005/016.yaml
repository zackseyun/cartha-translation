id: MAT.5.16
reference: Matthew 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: de
  text: Ebenso soll euer Licht vor den Menschen leuchten, damit sie eure guten Werke sehen und euren Vater verherrlichen, der in den Himmeln ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der im Himmel ist“. Im Griechischen steht der Plural: „in den Himmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Ebenso
  rationale: Stellt knapp und natürlich den Bezug zum vorausgehenden Bild von Lampe und Licht her und bezeichnet die entsprechende Weise des Leuchtens.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: soll euer Licht … leuchten
  rationale: Gibt den Imperativ der dritten Person Singular mit dem grammatischen Subjekt „euer Licht“ im Deutschen natürlich wieder und bewahrt die auffordernde Kraft.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: vor den Menschen
  rationale: „Menschen“ gibt ἀνθρώπων allgemein und geschlechterübergreifend wieder; „vor“ bewahrt den Gedanken öffentlicher Sichtbarkeit.
- source_word: ὅπως ἴδωσιν
  choice: damit sie … sehen
  rationale: Gibt die mit ὅπως und dem Konjunktiv ausgedrückte Zielrichtung idiomatisch wieder.
- source_word: τὰ καλὰ ἔργα
  choice: eure guten Werke
  rationale: „Gute Werke“ ist eine klare, geläufige Wiedergabe; καλός kann darüber hinaus den Beiklang von edel oder schön tragen.
- source_word: δοξάσωσιν
  choice: verherrlichen
  rationale: Bewahrt die starke, auf Gott bezogene Bedeutung von δοξάζω und die traditionelle biblische Ausdrucksweise.
- source_word: τὸν πατέρα ὑμῶν
  choice: euren Vater
  rationale: Natürliche possessive Wiedergabe, die die relationale Sprache des griechischen Textes erhält.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: der in den Himmeln ist
  rationale: Bewahrt den Plural οὐρανοῖς und gibt die attributive Wendung ausdrücklich wieder.
theological_decisions:
- issue: Sichtbare gute Werke und Verherrlichung Gottes
  choice: Die Menschen sehen die guten Werke der Jünger und verherrlichen deren Vater.
  alternative: Die Formulierung so umzugestalten, dass die Jünger selbst für ihre Werke geehrt werden.
  rationale: Der Satz hält die Spannung zwischen öffentlich sichtbarem Handeln und der Ausrichtung aller Ehre auf Gott fest; diese Zielrichtung darf nicht abgeschwächt oder umgedeutet werden.
- issue: Plural „Himmel“ in οὐρανοῖς
  choice: der in den Himmeln ist
  alternative: der im Himmel ist
  rationale: Der Plural des griechischen Textes wird im Haupttext bewahrt; die im Deutschen geläufigere singularische Form wird als mögliche Wiedergabe in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vor den Menschen“ ist im Deutschen selbstverständlich allgemein auf Menschen bezogen und benötigt daher keine erläuternde Fußnote. Der Plural „in den Himmeln“ klingt markierter als die traditionelle Wendung „im Himmel“, bewahrt jedoch bewusst die Form des griechischen Textes.
