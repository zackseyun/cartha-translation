  variant: modern standard German
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: de
  text: auch nicht bei der Erde, denn sie ist der Schemel seiner Füße[a]; auch nicht bei Jerusalem[b], denn es ist die Stadt des großen Königs[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Anspielung auf Jesaja 66,1: „Die Erde ist der Schemel meiner Füße.“'
    reason: cross_reference
  - marker: b
    text: Das Griechische verwendet hier eine Präposition, die gewöhnlich eine Richtung bezeichnet („nach/zu Jerusalem“); im Zusammenhang kann sie idiomatisch als Schwurformel im Sinn von „bei Jerusalem“ verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: Anspielung auf Psalm 48,3, wo Jerusalem „die Stadt des großen Königs“ genannt wird.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε … μήτε
  choice: auch nicht … auch nicht
  rationale: Die zweiteilige Fortführung einer bereits im vorherigen Vers begonnenen Reihe von Verboten wird im Deutschen natürlich mit „auch nicht … auch nicht“ wiedergegeben.
- source_word: ἐν τῇ γῇ
  choice: bei der Erde
  rationale: ἐν steht hier innerhalb einer Schwurformel. Das idiomatische deutsche „bei der Erde“ gibt den gemeinten Schwurgegenstand wieder.
- source_word: γῇ
  choice: Erde
  rationale: Im Gegensatz zu Himmel und Jerusalem bezeichnet γῆ hier die Erde, nicht ein bestimmtes Land.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet jeweils die Begründung des Verbots ein. „Denn“ wahrt den würdigen, knappen Satzrhythmus und ist im modernen Deutsch klar.
- source_word: ὑποπόδιόν
  choice: Schemel
  rationale: „Schemel“ ist die prägnante, geläufige Entsprechung und bewahrt den Anklang an Jesaja 66,1.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: seiner Füße
  rationale: Die Genitivverbindung wird eng am Griechischen wiedergegeben; das kleingeschriebene Pronomen lässt die im Kontext erkennbare Bezugnahme auf Gott unausdrücklich.
- source_word: εἰς Ἱεροσόλυμα
  choice: bei Jerusalem
  rationale: Obwohl εἰς gewöhnlich eine Richtung bezeichnet, fungiert die Verbindung hier im parallelen Zusammenhang idiomatisch als Schwurformel. „Bei Jerusalem“ ist im Deutschen verständlich; die auffällige Präposition wird in einer Fußnote dokumentiert.
- source_word: πόλις
  choice: Stadt
  rationale: Dies ist die direkte und natürliche Entsprechung von πόλις.
- source_word: τοῦ μεγάλου βασιλέως
  choice: des großen Königs
  rationale: Die Genitivfügung und der feierliche Titel werden bewahrt; zugleich bleibt der Anklang an Psalm 48 erhalten.
theological_decisions:
- issue: Bezug von αὐτοῦ in „seiner Füße“
  choice: „seiner“ kleingeschrieben; der Bezug auf Gott bleibt aus dem Kontext erkennbar
  alternative: „Seiner“ großschreiben und damit den göttlichen Bezug typografisch ausdrücklich machen
  rationale: Das Griechische markiert göttliche Pronomen nicht durch Großschreibung. Die Kleinschreibung vermeidet eine über den Ausgangstext hinausgehende Festlegung, ohne den sachlichen Bezug zu verdunkeln.
- issue: Identität des „großen Königs“
  choice: Den Titel ohne erklärende Ergänzung wiedergeben
  alternative: „Gottes, des großen Königs“ oder eine andere ausdrückliche Identifizierung
  rationale: Der Text nennt den König nicht ausdrücklich. Der alttestamentliche Anklang weist auf Gott, doch die Übersetzung soll diese Identifizierung nicht in den Haupttext eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. Der Vers ist als syntaktische Fortsetzung von Matthäus 5,34 gestaltet; deshalb beginnt er kleingeschrieben und endet entsprechend der fortlaufenden Satzstruktur mit einem Semikolon.
