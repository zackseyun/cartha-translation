  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: de
  text: 'Denn wahrlich, ich sage euch: Bis Himmel und Erde vergehen, wird weder ein einziges Jota[a] noch ein einziges Strichlein[b] vom Gesetz vergehen, bis alles geschehen ist.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jota“ bezeichnet den kleinsten Buchstaben des griechischen Alphabets und steht hier für den kleinsten Schriftbestandteil.
    reason: lexical_explanation
  - marker: b
    text: Ein „Strichlein“ ist ein winziger schriftlicher Zusatz oder Fortsatz, durch den sich Buchstaben unterscheiden können.
    reason: lexical_explanation
  - marker: c
    text: 'Oder: „bis alles vollbracht ist“ beziehungsweise „bis alles in Erfüllung gegangen ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: wahrlich
  rationale: In den Worten Jesu leitet ἀμήν eine feierliche, nachdrückliche Bekräftigung ein. „Wahrlich“ bewahrt diesen würdevollen, autoritativen Ton und ist im biblischen Sprachgebrauch weiterhin verständlich.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die vorausgehende Aussage und wird mit dem natürlichen deutschen Begründungswort „denn“ wiedergegeben.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte Wiedergabe erhält den formellen und autoritativen Charakter der Aussage.
- source_word: ἕως ἂν παρέλθῃ
  choice: bis … vergehen
  rationale: Die Konstruktion bezeichnet einen zukünftigen Grenzpunkt; „vergehen“ passt sowohl zu Himmel und Erde als auch zum später genannten schriftlichen Bestandteil des Gesetzes.
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: Himmel und Erde
  rationale: Dies ist die idiomatische deutsche Bezeichnung für die kosmische Gesamtheit; die griechischen Artikel müssen im Deutschen nicht eigens wiedergegeben werden.
- source_word: ἰῶτα ἓν
  choice: kein einziges Jota
  rationale: Das griechische Jota war der kleinste Buchstabe. Die Formulierung erhält die konkrete Buchstabenbezeichnung und bringt durch „kein einziges“ die Negation natürlich zum Ausdruck.
- source_word: μία κεραία
  choice: kein einziges Strichlein
  rationale: κεραία bezeichnet einen winzigen Strich oder Fortsatz an einem Buchstaben. „Strichlein“ ist anschaulich, verständlich und bewahrt die Verkleinerungsnuance.
- source_word: οὐ μὴ παρέλθῃ
  choice: wird … nicht vergehen
  rationale: Die emphatische griechische Verneinung wird im Deutschen durch die vorangestellten negativen Ausdrücke „kein einziges … und kein einziges …“ zusammen mit dem Futur nachdrücklich wiedergegeben.
- source_word: ἀπὸ τοῦ νόμου
  choice: vom Gesetz
  rationale: Der Kontext meint Gottes schriftlich überliefertes Gesetz. Die Großschreibung kennzeichnet im Deutschen die konkrete Größe „das Gesetz“, ohne im Text festzulegen, ob ausschließlich die Tora oder die Schrift in weiterem Sinn gemeint ist.
- source_word: ἕως ἂν πάντα γένηται
  choice: bis alles geschehen ist
  rationale: γίνομαι bezeichnet hier das Eintreten beziehungsweise Geschehen. Die Formulierung bleibt bewusst weit und legt nicht einseitig fest, ob Erfüllung, Vollendung oder bloßes Eintreten im Vordergrund steht.
theological_decisions:
- issue: Bedeutungsumfang von νόμος
  choice: „das Gesetz“ als Gottes schriftlich bezeugtes Gesetz
  alternative: ausschließlich die Tora beziehungsweise der Pentateuch; oder im weiteren Sinn die gesamte alttestamentliche Schrift
  rationale: Im unmittelbaren Zusammenhang nennt Jesus „das Gesetz und die Propheten“. Die Übersetzung hält sich an die konkrete Bezeichnung des griechischen Textes und lässt den genauen Umfang durch den Kontext bestimmen.
- issue: Sinn von πάντα γένηται
  choice: „bis alles geschehen ist“
  alternative: „bis alles vollbracht ist“ oder „bis alles in Erfüllung gegangen ist“
  rationale: Die griechische Formulierung kann das Eintreten wie auch die volle Verwirklichung des Gemeinten umfassen. Der Haupttext bewahrt diese Offenheit; die Fußnote nennt die stärker ziel- beziehungsweise erfüllungsorientierten Möglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst feierlichem „wahrlich“. „Jota“ und „Strichlein“ erhalten das Bild kleinster Schriftbestandteile. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber im Deutschen flüssig. Sämtliche Fußnotenmarker stehen im Haupttext.
