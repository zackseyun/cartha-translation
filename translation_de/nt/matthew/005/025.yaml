  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: de
  text: Komm deinem Gegner schnell entgegen[a], solange du noch mit ihm auf dem Weg bist, damit dein Gegner dich nicht etwa dem Richter übergibt, der Richter dich dem Gerichtsbeamten übergibt und du ins Gefängnis geworfen wirst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im rechtlichen Zusammenhang sinngemäß: „Einige dich schnell mit deinem Gegner.“ Wörtlicher: „Sei deinem Gegner gegenüber wohlgesinnt.“'
    reason: Die Formulierung bewahrt sowohl den lexikalischen Grundsinn von εὐνοέω als auch die im Kontext naheliegende Bedeutung einer außergerichtlichen Einigung.
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Komm … entgegen
  rationale: Die Umschreibung aus Imperativ und Partizip fordert zu einer anhaltend entgegenkommenden Haltung beziehungsweise einem entsprechenden Handeln auf. „Komm … entgegen“ gibt dies in natürlichem modernem Deutsch wieder, ohne die rechtliche Folge bereits ausdrücklich als Einigung festzulegen.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: Gegner
  rationale: Das Wort bezeichnet hier aufgrund von Richter, Gerichtsbeamtem und Gefängnis einen Gegner in einer Rechtssache. „Gegner“ bleibt verständlich und vermeidet die mögliche Überbestimmung durch „Ankläger“ oder „Kläger“.
- source_word: ταχὺ
  choice: schnell
  rationale: „Schnell“ bewahrt die Dringlichkeit des griechischen Adverbs und fügt sich unmittelbar in die Aufforderung ein.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: solange du noch mit ihm auf dem Weg bist
  rationale: Die konkrete Wegmetapher bleibt erhalten; „noch“ verdeutlicht natürlich das begrenzte Zeitfenster, ohne das Ziel ausdrücklich als Gericht zu benennen.
- source_word: μήποτέ
  choice: damit … nicht etwa
  rationale: Diese Wendung bewahrt den warnenden und zugleich möglichen, nicht als sicher behaupteten Ausgang.
- source_word: παραδῷ
  choice: übergibt
  rationale: „Übergeben“ bezeichnet in diesem gerichtlichen Ablauf klar die Auslieferung an die nächste Autorität.
- source_word: κριτῇ / κριτὴς
  choice: Richter
  rationale: „Richter“ ist die direkte und im rechtlichen Zusammenhang eindeutige Entsprechung.
- source_word: ὑπηρέτῃ
  choice: Gerichtsbeamten
  rationale: Der Ausdruck bezeichnet hier den untergeordneten Amtsträger, der die richterliche Anordnung vollzieht. „Gerichtsbeamter“ macht diese Funktion verständlich, ohne einen kulturabhängigen modernen Amtstitel vorauszusetzen.
- source_word: εἰς φυλακὴν
  choice: ins Gefängnis
  rationale: Dies ist die übliche, dem ernsten rechtlichen Zusammenhang angemessene Wiedergabe.
- source_word: βληθήσῃ
  choice: geworfen wirst
  rationale: Die Formulierung erhält die Anschaulichkeit und Härte von βάλλω stärker als das neutralere „gebracht wirst“.
theological_decisions:
- issue: Ob die einleitende Aufforderung ausdrücklich als Abschluss eines Vergleichs wiederzugeben ist
  choice: Komm deinem Gegner schnell entgegen
  alternative: Einige dich schnell mit deinem Gegner
  rationale: Der Rechtskontext legt eine Einigung nahe, doch εὐνοέω bezeichnet zunächst eine wohlwollende oder entgegenkommende Haltung beziehungsweise Handlung. Die Hauptfassung wahrt diesen weiteren Sinn; die rechtlich zugespitzte Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der konkrete Weg zum Gericht bleibt unausgedeutet. Die Konstruktion mit „damit … nicht etwa“ erhält den Warncharakter und die Möglichkeit des beschriebenen Ausgangs; „Gerichtsbeamter“ erläutert die amtliche Funktion knapp und ohne unnötige kulturelle Spezifizierung.
