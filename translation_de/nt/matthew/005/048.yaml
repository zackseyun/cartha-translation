  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: de
  text: Darum sollt ihr vollkommen[a] sein, wie euer himmlischer Vater vollkommen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vollständig«, »ungeteilt« oder »reif«. Das griechische Wort τέλειος kann neben Vollkommenheit auch Ganzheit, Vollständigkeit oder Reife bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: sollt … sein
  rationale: Das Futur von εἰμί hat hier im Zusammenhang auffordernde bzw. gebietende Kraft. „Sollt … sein“ gibt diese im heutigen Deutsch natürlicher wieder als ein bloßes „werdet … sein“.
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Forderung, auch die Feinde zu lieben; „darum“ stellt den logischen Zusammenhang klar und idiomatisch her.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck. Im deutschen Hauptsatz bleibt es mit „ihr“ sichtbar, ohne den Sinn durch „ihr selbst“ zu verstärken.
- source_word: τέλειοι / τέλειός
  choice: vollkommen
  rationale: Die Wiederholung desselben Wortes erhält den Vergleich zwischen den Angesprochenen und dem Vater. „Vollkommen“ wahrt die starke ethische Aussage; die Bedeutungsnuancen vollständig, ungeteilt und reif werden in der Fußnote genannt.
- source_word: ὡς
  choice: wie
  rationale: Leitet den Vergleich mit dem himmlischen Vater knapp und natürlich ein.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: euer himmlischer Vater
  rationale: Gibt die attributive Wortgruppe idiomatisch und in der im Deutschen geläufigen Form wieder.
theological_decisions:
- issue: Bedeutung von τέλειος in der ethischen Aufforderung
  choice: Im Haupttext „vollkommen“, ergänzt durch eine lexikalische Fußnote.
  alternative: vollständig; ungeteilt; reif
  rationale: Der unmittelbare Zusammenhang betrifft eine Liebe, die nicht auf Freunde beschränkt bleibt. „Vollkommen“ bewahrt dennoch die uneingeschränkte und herausfordernde Formulierung des Textes, ohne sie im Haupttext auf eine einzige kontextuelle Erklärung zu reduzieren.
- issue: Aussageweise von Ἔσεσθε
  choice: Als Aufforderung „sollt ihr … sein“ wiedergegeben.
  alternative: „werdet ihr … sein“ als rein zukünftige Aussage
  rationale: Im Kontext schließt der Futur eine Reihe von Weisungen ab und hat gebietende bzw. exhortative Kraft. Die Übersetzung vermeidet zugleich das stärker nach äußerem Zwang klingende „müsst“.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die traditionelle Wendung „himmlischer Vater“ und die Wiederholung von „vollkommen“ erhalten den rhetorischen Nachdruck des griechischen Textes.
