  text: Ἠκούσατε ὅτι ἐρρέθη· Οὐ μοιχεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: de
  text: 'Ihr habt gehört, dass gesagt wurde[a]: »Du sollst nicht die Ehe brechen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher: »Ihr hörtet, dass gesagt wurde.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ihr habt gehört
  rationale: Das deutsche Perfekt gibt die formelhafte Einleitung natürlich wieder und betont, dass das früher Gehörte für die Angesprochenen weiterhin gegenwärtig ist. Das ebenfalls mögliche Präteritum steht in der Fußnote.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was die Angesprochenen gehört haben.
- source_word: ἐρρέθη
  choice: gesagt wurde
  rationale: Die unpersönliche Passivform entspricht dem griechischen Aoristpassiv und ist im modernen Deutsch natürlicher als »gesprochen wurde«.
- source_word: Οὐ μοιχεύσεις
  choice: Du sollst nicht die Ehe brechen
  rationale: Die Formulierung bewahrt den rechtlich-feierlichen Gebotsstil und macht den Bezug zum Dekalog erkennbar. »Die Ehe brechen« ist eine präzise und allgemein verständliche Wiedergabe von μοιχεύω.
theological_decisions:
- issue: Bezug auf das Gebot des Dekalogs
  choice: »Du sollst nicht die Ehe brechen.«
  alternative: »Brich nicht die Ehe.«
  rationale: Die traditionelle Gebotsform erhält den intertextuellen Bezug zum Dekalog, ohne die Aussage zusätzlich auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht im Plural, das zitierte Gebot entsprechend seinem individuellen Adressaten im Singular. Die Satzstellung bleibt nah am Griechischen, ohne unnatürlich zu wirken.
