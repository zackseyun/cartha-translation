review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die griechische Einleitung Ἠκούσατε ὅτι ἐρρέθη angemessen als „Ihr habt gehört, dass gesagt wurde“ wieder. Das Perfekt ist im Deutschen für die formelhafte Bezugnahme auf überlieferte Lehre idiomatisch; die Fußnote bietet zutreffend das näher am Aorist liegende Präteritum. Die unpersönliche Passivkonstruktion wahrt offen, wer gesprochen hat. Οὐ μοιχεύσεις ist vollständig und im Gebotscharakter korrekt wiedergegeben.
  naturalness: Modernes, würdiges Standarddeutsch. „Du sollst nicht die Ehe brechen“ ist verständlich und als Gebotsform natürlich, auch wenn „ehebrechen“ als Einwortverb traditioneller wirken kann. Der Wechsel von pluralischer Anrede zur singularischen Dekalogform ist sachgerecht.
  terminology: „Die Ehe brechen“ gibt μοιχεύω in diesem Dekalogzitat präzise wieder und erhält den Bezug zum siebten Gebot. Es werden keine zusätzlichen theologischen oder konfessionellen Deutungen eingeführt.
