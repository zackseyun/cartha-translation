lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Verknüpfung durch καί wird ohne zusätzliche zeitliche oder deutende Nuance wiedergegeben.
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: er öffnete seinen Mund
  rationale: Die feierlich wirkende, semitisch geprägte Wendung bleibt erhalten; die vorzeitige Partizipialhandlung wird in natürlichem Deutsch als koordinierter Satz wiedergegeben.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das Imperfekt stellt das Lehren als andauernde Tätigkeit dar. Im Deutschen kann das einfache Präteritum diesen Verlauf im Erzählzusammenhang natürlich ausdrücken, ohne einen Beginn ausdrücklich hinzuzufügen.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen bleibt allgemein und legt seine im Kontext zu bestimmende Bezugsgruppe nicht enger als der griechische Text fest.
- source_word: λέγων
  choice: indem er sprach
  rationale: Das präsentische Partizip führt den Inhalt des Lehrens ein. Diese Formulierung bewahrt die enge Verbindung zum Hauptverb und klingt würdevoll, ohne das Partizip bloß in ein weiteres Hauptverb aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit bewusst beibehaltener feierlicher Redeformel. Die Konstruktion „indem er sprach“ ist leicht gehoben, aber transparent und dem würdevollen Erzählregister angemessen.
