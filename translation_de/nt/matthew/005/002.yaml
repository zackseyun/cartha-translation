  source_fidelity: 'Die Wiedergabe von καί, ἀνοίξας τὸ στόμα αὐτοῦ, ἐδίδασκεν und αὐτούς ist im Wesentlichen quellentreu. Für λέγων ist „indem er sprach“ jedoch nicht passend: „indem“ bezeichnet im Deutschen gewöhnlich die Art und Weise bzw. das Mittel einer Handlung, während das Partizip hier die anschließenden Worte einführt.'
  naturalness: „Er öffnete seinen Mund“ bewahrt bewusst die feierliche, formelhafte Redeeröffnung und ist in diesem Register verständlich. „Mit folgenden Worten“ ist modernes, idiomatisches Deutsch und vermeidet die semantisch ungenaue Konstruktion „indem er sprach“.
  terminology: Keine theologischen Fachbegriffe oder Eigennamen kommen vor. „Lehrte“ gibt ἐδίδασκεν im erzählenden Kontext angemessen wieder; „sie“ wahrt die im Vers nicht weiter eingegrenzte Referenz.
  issues:
