    issue: „indem er sprach“ für λέγων
    rationale: Die deutsche Konstruktion legt nahe, dass das Sprechen das Mittel oder die Begleitumstandsweise des Lehrens sei. λέγων fungiert hier vielmehr als formelhafte Einführung der folgenden Lehrrede. „Mit folgenden Worten“ bildet diese Funktion natürlich und ohne Sinnverschiebung ab.
