  language: de
  text: 'Ihr habt gehört, dass gesagt wurde: »Auge um Auge und Zahn um Zahn.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ihr habt gehört
  rationale: Das griechische Aorist in dieser matthäischen Einleitungsformel bezeichnet das Überlieferte, das die Angesprochenen gehört haben; das deutsche Perfekt ist dafür natürlich und gegenwartsbezogen.
- source_word: ὅτι
  choice: dass
  rationale: Leitet als Inhaltssatz das Gehörte ein.
- source_word: ἐρρέθη
  choice: gesagt wurde
  rationale: Bewahrt die unpersönliche Passivform des griechischen Textes, ohne den Sprecher ausdrücklich zu bestimmen.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Auge um Auge
  rationale: Die feste deutsche Rechtsformel gibt Austausch beziehungsweise Entsprechung prägnant wieder und erhält den parallelen Aufbau.
- source_word: καὶ
  choice: und
  rationale: Verbindet die beiden parallelen Glieder schlicht und direkt.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: Zahn um Zahn
  rationale: Entspricht der etablierten deutschen Form der Talionsformel und bewahrt ihre rhythmische Parallelität.
theological_decisions:
- issue: Wiedergabe der von Jesus zitierten Talionsformel
  choice: Auge um Auge und Zahn um Zahn
  alternative: ein Auge anstelle eines Auges und einen Zahn anstelle eines Zahnes
  rationale: Die geläufige deutsche Form ist dem Sinn des griechischen ἀντί angemessen und lässt offen, wie die rechtliche Forderung genau anzuwenden ist; sie deutet weder wörtliche Vergeltung noch bloß verhältnismäßigen Ausgleich in den Text hinein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die vertraute Rechtsformel wird ohne erklärenden Zusatz im Vers beibehalten.
