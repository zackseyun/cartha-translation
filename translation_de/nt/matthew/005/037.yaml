  naturalness: '„Euer Wort sei: »Ja, ja« oder »Nein, nein«“ ist modernes, würdiges und zugleich natürliches Standarddeutsch. Die im Entwurf gesetzte Abfolge „oder: »Nein, nein«“ ist nach dem bereits einleitenden Doppelpunkt unnötig schwerfällig.'
