  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: de
  text: 'Euer Wort sei: »Ja, ja« oder »Nein, nein«. Was darüber hinausgeht, ist vom Bösen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck τοῦ πονηροῦ kann persönlich („der Böse“, also der Teufel) oder unpersönlich („das Böse“) verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: sei
  rationale: Der Imperativ der dritten Person wird im Deutschen knapp und natürlich mit dem Konjunktiv I in auffordernder Funktion wiedergegeben.
- source_word: λόγος
  choice: Wort
  rationale: „Wort“ bezeichnet hier die verlässliche Äußerung und bewahrt die knappe, sprichwortartige Form.
- source_word: ναὶ ναί, οὒ οὔ
  choice: '»Ja, ja«, oder: »Nein, nein«'
  rationale: Die Verdopplung und der Rhythmus des Griechischen bleiben erhalten; „oder“ verdeutlicht im Deutschen den Gegensatz.
- source_word: περισσὸν
  choice: Was darüber hinausgeht
  rationale: Die substantivierte Form bezeichnet alles, was über das schlichte Ja oder Nein hinausgeht.
- source_word: τούτων
  choice: darüber
  rationale: Der Rückbezug auf die beiden zuvor genannten Antworten wird idiomatisch und knapp ausgedrückt.
- source_word: ἐκ
  choice: von
  rationale: „Von“ bezeichnet hier Herkunft oder Ursprung; zusammen mit „dem Bösen“ lässt es die grammatische Mehrdeutigkeit im Deutschen weitgehend bestehen.
- source_word: τοῦ πονηροῦ
  choice: dem Bösen
  rationale: Die Form kann das Böse unpersönlich oder den Bösen persönlich bezeichnen. „Vom Bösen“ ist im Deutschen bewusst mehrdeutig und erhält beide Möglichkeiten.
theological_decisions:
- issue: Ob τοῦ πονηροῦ unpersönlich („das Böse“) oder persönlich („der Böse“) gemeint ist
  choice: vom Bösen
  alternative: 'vom Bösen, das heißt: vom Teufel / aus dem Bösen'
  rationale: Der griechische Ausdruck ist grammatisch mehrdeutig. Die deutsche Formulierung „vom Bösen“ bewahrt diese Spannung; die Fußnote benennt beide möglichen Verständnisse ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, einprägsamer Satzstruktur. „Vielmehr“ gibt den kontrastierenden Anschluss δέ wieder. Die doppelte Form „Ja, ja“ und „Nein, nein“ bleibt entsprechend dem griechischen Wortlaut erhalten.
