id: MAT.5.19
reference: Matthew 5:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: de
  text: Wer also eines von diesen geringsten Geboten außer Kraft setzt[a] und die Menschen lehrt, es ebenso zu tun, wird im Himmelreich der Geringste genannt werden; wer sie aber befolgt und lehrt, der wird im Himmelreich groß genannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „löst“. Gemeint sein kann auch: „hebt auf“, „setzt beiseite“ oder „entkräftet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: also
  rationale: „Also“ gibt die Folgerung aus der vorausgehenden Aussage über Gesetz und Propheten natürlich und würdig wieder.
- source_word: λύσῃ
  choice: außer Kraft setzt
  rationale: Das Verb bedeutet wörtlich „löst“ und bezeichnet hier, ein Gebot aufzuheben oder ihm seine bindende Kraft zu nehmen. „Außer Kraft setzt“ ist im heutigen Deutsch klarer als das missverständliche „auflöst“.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: eines von diesen geringsten Geboten
  rationale: Die Formulierung bewahrt die Einordnung des betreffenden Gebots unter die geringsten dieser Gebote, ohne „geringsten“ auf „unbedeutend“ auszulegen.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: die Menschen entsprechend lehrt
  rationale: „Die Menschen“ gibt den generischen Bezug von ἀνθρώπους wieder; „entsprechend“ bezieht οὕτως auf das zuvor genannte Außerkraftsetzen, ohne ein im Griechischen nicht ausdrücklich vorhandenes Objekt einzufügen.
- source_word: ἐλάχιστος κληθήσεται
  choice: wird … der Geringste genannt werden
  rationale: Die Zukunft Passiv wird direkt wiedergegeben. Der bestimmte Artikel ist im Deutschen beim substantivierten Superlativ idiomatisch erforderlich und behauptet keine über den griechischen Text hinausgehende Ausschließung.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: im Himmelreich
  rationale: „Himmelreich“ ist die natürliche, etablierte deutsche Wiedergabe der matthäischen Wendung und bezeichnet das Reich beziehungsweise die Königsherrschaft des Himmels.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: sie aber tut und lehrt
  rationale: „Tut“ entspricht dem weiten Sinn von ποιέω; das Pronomen „sie“ macht den aus dem Kontext erschlossenen Bezug auf die Gebote deutlich.
- source_word: οὗτος
  choice: der
  rationale: Das betonte deutsche Demonstrativpronomen „der“ erhält den Nachdruck und den Gegensatz der griechischen Form οὗτος.
- source_word: μέγας
  choice: groß
  rationale: „Groß“ ist die direkte Entsprechung und wahrt den Gegensatz zu „der Geringste“, ohne eine technische Rangordnung zu definieren.
theological_decisions:
- issue: Status als „der Geringste“ beziehungsweise „groß“ im Himmelreich
  choice: Die vergleichende Stellung innerhalb des Himmelreichs wird formuliert, ohne Ausschluss oder ein bestimmtes Verdienst- und Belohnungssystem hineinzulesen.
  alternative: „Der Geringste“ als vom Himmelreich ausgeschlossen oder „groß“ als festgelegten himmlischen Belohnungsrang deuten.
  rationale: Der griechische Text sagt ausdrücklich „im Reich der Himmel“ und lässt die weitergehende theologische Einordnung offen.
- issue: Bezug von „diese Gebote“
  choice: Der Bezug bleibt wie im Ausgangstext bei „diesen Geboten“, ohne festzulegen, ob damit ausschließlich das mosaische Gesetz, Jesu Lehre oder beides gemeint ist.
  alternative: Den Ausdruck ausdrücklich als „Gebote des mosaischen Gesetzes“ oder ausschließlich als „Gebote Jesu“ erklären.
  rationale: Der unmittelbare Zusammenhang ist theologisch spannungsreich; eine präzisierende Ergänzung würde eine Auslegung in den Text eintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Himmelreich“ und die parallele Satzstruktur bewahren den matthäischen Charakter; unnötige konfessionelle Fachsprache wird vermieden.
