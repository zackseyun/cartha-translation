- from: Wer also eines von diesen geringsten Geboten außer Kraft setzt[a] und die Menschen entsprechend lehrt, wird im Himmelreich der Geringste genannt werden; wer sie aber tut und lehrt, der wird im Himmelreich groß genannt werden.
  to: Wer also eines von diesen geringsten Geboten außer Kraft setzt[a] und die Menschen lehrt, es ebenso zu tun, wird im Himmelreich der Geringste genannt werden; wer sie aber befolgt und lehrt, der wird im Himmelreich groß genannt werden.
