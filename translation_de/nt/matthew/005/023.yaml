id: MAT.5.23
reference: Matthew 5:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: de
  text: Wenn du nun deine Gabe zum Altar bringst und dich dort daran erinnerst, dass dein Bruder[a] etwas gegen dich hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Bruder oder deine Schwester“; im Griechischen steht „Bruder“, eine maskuline Singularform, die in diesem Zusammenhang repräsentativ gebraucht sein kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Wenn du nun
  rationale: „Wenn“ gibt die Bedingung wieder; „nun“ bewahrt den folgernden Anschluss von οὖν an das Vorangehende und klingt im Deutschen natürlich.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: deine Gabe … bringst
  rationale: προσφέρω bezeichnet im kultischen Zusammenhang das Heranbringen bzw. Darbringen. Zusammen mit „zum Altar“ vermittelt „deine Gabe bringst“ die konkrete Szene natürlich und quellennah.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: zum Altar
  rationale: ἐπί mit Akkusativ kann die gerichtete Bewegung zum Altar bezeichnen. „Zum Altar“ passt idiomatisch zum Heranbringen der Gabe, ohne festzulegen, dass sie bereits auf dem Altar liegt.
- source_word: κἀκεῖ μνησθῇς
  choice: und dich dort daran erinnerst
  rationale: „dort“ erhält den räumlichen Akzent von κἀκεῖ; das reflexive „dich erinnern“ ist die natürliche deutsche Wiedergabe des deponentisch gebrauchten Verbs.
- source_word: ὁ ἀδελφός σου
  choice: dein Bruder
  rationale: Die maskuline Singularform wird formal bewahrt. Eine mögliche repräsentative Verwendung wird in der Fußnote kenntlich gemacht, statt den Haupttext auszuweiten.
- source_word: ἔχει τι κατὰ σοῦ
  choice: etwas gegen dich hat
  rationale: Diese geläufige deutsche Wendung gibt das Idiom präzise wieder und bewahrt die Unbestimmtheit von τι.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung ἀδελφός
  choice: dein Bruder
  alternative: dein Bruder oder deine Schwester; ein anderer Glaubender
  rationale: Der griechische Text hat einen maskulinen Singular. Der Haupttext bewahrt diese Form, während die Fußnote darauf hinweist, dass sie im Zusammenhang repräsentativ gebraucht sein kann.
- issue: Art der Gabe am Altar
  choice: Gabe
  alternative: Opfergabe
  rationale: δῶρον bedeutet allgemein „Gabe“; der Altarzusammenhang macht ihren kultischen Charakter deutlich. „Opfergabe“ wäre erklärender, würde die lexikalische Offenheit aber stärker einengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wenn du nun“ hält Folgerung und Bedingung zusammen; „zum Altar bringst“ beschreibt die gerichtete Handlung natürlich. Das abschließende Komma bleibt stehen, da der Vers als Nebensatz in Vers 24 fortgeführt wird.
