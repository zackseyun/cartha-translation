  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: de
  text: Ihr seid das Licht der Welt. Eine Stadt, die auf einem Berg liegt, kann nicht verborgen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Stadt, die auf einem Hügel liegt, kann nicht verborgen werden.“'
    reason: 'Lexikalische Alternative: ὄρος kann je nach Gelände auch „Hügel“ bedeuten.'
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ihr
  rationale: Das ausdrücklich gesetzte Personalpronomen ist im Griechischen betont. „Ihr“ bewahrt die direkte Anrede; eine zusätzliche Verstärkung wie „ihr selbst“ wäre im Deutschen unnötig interpretierend.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: Der bestimmte Artikel wird natürlich wiedergegeben und die unmittelbare Metapher bleibt erhalten.
- source_word: τοῦ κόσμου
  choice: der Welt
  rationale: Der Genitiv wird formal und idiomatisch als „der Welt“ wiedergegeben, ohne ihn deutend zu „für die Welt“ umzuschreiben.
- source_word: οὐ δύναται
  choice: kann nicht
  rationale: Dies ist die natürliche deutsche Wiedergabe der ausgedrückten Unmöglichkeit.
- source_word: πόλις
  choice: Eine Stadt
  rationale: „Stadt“ ist die gewöhnliche und im Bildzusammenhang passende Entsprechung von πόλις.
- source_word: κρυβῆναι
  choice: verborgen bleiben
  rationale: Wörtlich steht ein passiver Infinitiv „verborgen werden/sein“. Im Deutschen beschreibt „verborgen bleiben“ idiomatisch, dass eine so gelegene Stadt nicht unbemerkt sein kann.
- source_word: ἐπάνω ὄρους
  choice: auf einem Berg
  rationale: ὄρος bezeichnet eine erhöhte Geländeform und wird quellentreu als „Berg“ wiedergegeben; „Hügel“ wäre ebenfalls kontextuell möglich.
- source_word: κειμένη
  choice: die … liegt
  rationale: Das Partizip bedeutet hier „liegend/gelegen“. Der Relativsatz ist im modernen Deutsch natürlich und bewahrt die räumliche Aussage.
theological_decisions:
- issue: Metaphorische Identifikation der Angeredeten als Licht
  choice: „Ihr seid das Licht der Welt“
  alternative: „Ihr seid Licht für die Welt“
  rationale: Die direkte Metapher und die Genitivkonstruktion bleiben erhalten. Die stärker funktionale Deutung „für die Welt“ wird nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Bildsprache und der direkte, emphatische Anredecharakter des griechischen Textes bleiben erhalten.
