  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: de
  text: Glücklich zu preisen sind die, die ein reines Herz haben,[a] denn sie werden Gott sehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die im Herzen rein sind“; auch „die ein lauteres Herz haben“.'
    reason: lexical_alternative
  - marker: b
    text: Die Verheißung, Gott zu sehen, kann unmittelbaren Zugang zu Gottes Gegenwart bezeichnen, auch in ihrer künftigen Vollendung. Der Wortlaut lässt diese Bedeutung offen.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Glücklich zu preisen sind
  rationale: Die in deutschen Seligpreisungen geläufige Wendung bezeichnet den von Gott begünstigten, beneidenswerten Zustand, ohne ihn auf ein bloßes Glücksgefühl zu verkürzen.
- source_word: οἱ καθαροὶ τῇ καρδίᾳ
  choice: die ein reines Herz haben
  rationale: Die natürliche deutsche Formulierung gibt den Dativ des Bezugs idiomatisch wieder. „Herz“ meint hier den inneren Menschen, nicht nur Gefühle; „rein“ bewahrt den moralisch-geistlichen Sinn und kann zugleich den Hintergrund von Reinheit anklingen lassen.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ führt in einer würdigen und natürlichen Form die Begründung der Seligpreisung ein.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das Personalpronomen bezeichnet nachdrücklich gerade die zuvor Genannten. Die deutsche Satzstellung und das ausdrückliche „sie“ vermitteln dies ohne das schwerfällige „sie selbst“.
- source_word: τὸν θεὸν
  choice: Gott
  rationale: Direktes Objekt von ὄψονται; im Deutschen ist die artikellose Wiedergabe „Gott“ natürlich.
- source_word: ὄψονται
  choice: werden … sehen
  rationale: Gibt die zukünftige Verheißung schlicht und direkt wieder, ohne die Art oder den Zeitpunkt des Sehens auszudeuten.
theological_decisions:
- issue: Bedeutung von „Gott sehen“
  choice: Die direkte Aussage „sie werden Gott sehen“ bleibt unverändert erhalten.
  alternative: „Sie werden Gottes Gegenwart erfahren“ oder „sie werden Gott in der endzeitlichen Vollendung schauen“.
  rationale: Die knappe griechische Formulierung kann unmittelbaren Zugang zu Gottes Gegenwart und dessen künftige Vollendung umfassen. Eine erklärende Übersetzung würde die theologische Weite unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glücklich zu preisen“ wahrt den traditionellen Klang der Seligpreisung, ist aber für heutige Leser verständlich. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
