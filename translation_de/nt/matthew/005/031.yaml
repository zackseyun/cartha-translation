id: MAT.5.31
reference: Matthew 5:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: de
  text: 'Weiter heißt es: »Wer sich von seiner Frau scheidet[a], soll ihr eine Scheidungsurkunde geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Frau wegschickt«. Das griechische Verb kann »wegschicken« bedeuten, bezeichnet hier im ehelichen Rechtszusammenhang jedoch die Scheidung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη δέ
  choice: Weiter heißt es
  rationale: Die unpersönliche Zitierformel wird im Deutschen natürlich wiedergegeben; δέ markiert hier vor allem den Übergang zum nächsten Lehrsatz und muss nicht zwingend adversativ mit »aber« übersetzt werden.
- source_word: Ὃς ἂν
  choice: Wer
  rationale: Relativpronomen mit ἄν bezeichnet einen allgemeinen, unbestimmten Fall; »Wer« ist die idiomatische deutsche Entsprechung.
- source_word: ἀπολύσῃ
  choice: sich von ... scheidet
  rationale: Im ehe- und rechtsbezogenen Zusammenhang mit ἀποστάσιον bezeichnet das Verb die Scheidung. Die reflexive deutsche Formulierung ist natürlich und bewahrt den rechtlichen Sinn.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: seiner Frau
  rationale: γυνή bedeutet in diesem Zusammenhang eindeutig »Ehefrau/Frau«; das Besitzverhältnis und das männliche Subjekt bleiben erhalten.
- source_word: δότω αὐτῇ
  choice: soll ihr ... geben
  rationale: Der Imperativ der dritten Person wird im modernen Deutschen treffend durch »soll« wiedergegeben und erhält den Charakter einer zitierten Rechtsbestimmung.
- source_word: ἀποστάσιον
  choice: eine Scheidungsurkunde
  rationale: Das Wort bezeichnet ein schriftliches Dokument, das die Scheidung bescheinigt; »Scheidungsurkunde« ist präzise, knapp und verständlich.
theological_decisions:
- issue: Verhältnis der Aussage zur mosaischen Scheidungsregelung
  choice: Die Aussage als zitierte rechtliche Weisung wiedergeben, ohne in diesem Vers Zustimmung oder Ablehnung auszudrücken.
  alternative: Die Formulierung ausdrücklich als Billigung der Scheidung oder lediglich als Beschreibung einer verbreiteten Lehre deuten.
  rationale: Der Vers führt die überlieferte Regel ein, auf die Jesus im folgenden Vers eingeht. Die Übersetzung soll die theologische Spannung bewahren und die Bewertung nicht vorwegnehmen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die zitierte Rechtsform bleibt knapp; »Weiter heißt es« stellt den Anschluss her, ohne einen stärkeren Gegensatz in δέ hineinzulesen.
