id: MAT.5.43
reference: Matthew 5:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: de
  text: 'Ihr habt gehört, dass gesagt wurde[a]: »Du sollst deinen Nächsten lieben und deinen Feind hassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der erste Teil klingt an 3. Mose 19,18 an. Der zweite Teil (»und deinen Feind hassen«) ist kein unmittelbares Zitat aus dem Alten Testament, sondern gibt eine überlieferte Lehre wieder, die Jesus richtigstellt.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ihr habt gehört
  rationale: Das idiomatische deutsche Perfekt gibt den formelhaften Rückblick auf eine früher empfangene Lehre natürlich wieder.
- source_word: ἐρρέθη
  choice: dass gesagt wurde
  rationale: Die unpersönliche Passivform bleibt erhalten, ohne den Sprecher näher zu bestimmen.
- source_word: Ἀγαπήσεις
  choice: Du sollst … lieben
  rationale: Das Futur hat hier im angeführten Gebot auffordernde Kraft; »sollst« entspricht zudem der vertrauten Formulierung von 3. Mose 19,18.
- source_word: τὸν πλησίον σου
  choice: deinen Nächsten
  rationale: »Nächster« ist in diesem ethischen Zusammenhang die präzise und etablierte Wiedergabe, besonders im Anklang an 3. Mose 19,18.
- source_word: μισήσεις
  choice: deinen Feind hassen
  rationale: Die auffordernde Kraft des Futurs wird im Deutschen durch das gemeinsame »sollst« auf beide koordinierte Verben bezogen.
- source_word: τὸν ἐχθρόν σου
  choice: deinen Feind
  rationale: »Feind« ist die direkte und kontextgerechte Entsprechung im Gegensatz zu »Nächster«.
theological_decisions:
- issue: Status der Aussage »und deinen Feind hassen«
  choice: Die Aussage wird als Bestandteil der von Jesus wiedergegebenen gehörten Lehre übersetzt, ohne sie ausdrücklich als Schriftzitat auszuweisen.
  alternative: Die gesamte Aussage als unmittelbares Zitat aus dem Alten Testament kennzeichnen oder den zweiten Teil schon im Haupttext als bloße Auslegungstradition markieren.
  rationale: Der griechische Text führt beide Teile als eine einzige gehörte Aussage an. Nur der erste Teil klingt unmittelbar an 3. Mose 19,18 an; die Fußnote wahrt diese Unterscheidung, ohne die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Singularform »Du sollst« innerhalb des Zitats bewahrt den individuellen Wortlaut des Gebots; »Ihr habt gehört« spricht die Hörerschaft im Plural an.
