id: MAT.5.42
reference: Matthew 5:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: de
  text: Gib dem, der dich bittet, und wende dich nicht von dem ab, der von dir leihen will.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτοῦντί
  choice: der dich bittet
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein einen Bittenden. „Der dich bittet“ ist natürliches modernes Deutsch und lässt offen, worum gebeten wird.
- source_word: δός
  choice: Gib
  rationale: Der Aoristimperativ wird als unmittelbarer, ungemilderter Imperativ wiedergegeben.
- source_word: θέλοντα
  choice: der … will
  rationale: Das substantivierte Präsenspartizip wird idiomatisch mit einem Relativsatz wiedergegeben; „will“ bildet θέλω schlicht ab.
- source_word: ἀπὸ σοῦ
  choice: von dir
  rationale: Die Präpositionalphrase bezeichnet die Quelle dessen, was geliehen werden soll.
- source_word: δανίσασθαι
  choice: leihen
  rationale: Im Deutschen kann „von dir leihen“ eindeutig „sich etwas von dir ausleihen“ bedeuten. Das nicht genannte Objekt wird nicht auf Geld verengt.
- source_word: μὴ ἀποστραφῇς
  choice: wende dich nicht … ab
  rationale: Die Formulierung bewahrt das Bild des griechischen Verbs und gibt die mit μή ausgedrückte Aufforderung als Verbot wieder.
theological_decisions:
- issue: Reichweite und Nachdruck von Jesu ethischer Weisung
  choice: Die beiden Aussagen werden als direkte, allgemein formulierte Aufforderungen ohne Abschwächung wiedergegeben.
  alternative: Den Kreis der Bittenden einzuschränken oder die zweite Aufforderung deutend mit „weise nicht ab“ wiederzugeben.
  rationale: Der griechische Text nennt keine Einschränkungen. Die bildhafte Formulierung „sich abwenden“ bleibt erhalten, ohne mögliche Anwendungskriterien in den Text einzutragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die parallele Struktur und die direkte Anrede im Singular bleiben erhalten; die knappe Form entspricht dem sentenzenartigen Stil der Bergpredigt.
