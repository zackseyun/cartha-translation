id: MAT.5.13
reference: Matthew 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: de
  text: Ihr seid das Salz der Erde. Wenn aber das Salz fade wird, womit soll es wieder salzig gemacht werden? Es taugt zu nichts mehr, außer hinausgeworfen und von den Menschen zertreten zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ihr
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen Nachdruck. Das vorangestellte „Ihr“ gibt diesen in natürlichem Deutsch angemessen wieder.
- source_word: τὸ ἅλας τῆς γῆς
  choice: das Salz der Erde
  rationale: γῆ kann „Erde“, „Land“ oder „Boden“ bedeuten. Im umfassenden Bildwort ist „Erde“ die natürliche und sachlich passende Wiedergabe.
- source_word: μωρανθῇ
  choice: fade wird
  rationale: Das Verb ist zwar mit dem Wort für „töricht“ verwandt, bezeichnet bei Salz aber das Sch निष?alwerden beziehungsweise den Verlust seines Geschmacks. „Fade wird“ bewahrt das Bild knapp und verständlich.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: womit soll es wieder salzig gemacht werden?
  rationale: Die passive Form fragt nach dem Mittel, durch das das Salz erneut salzig gemacht werden könnte. „Womit“ bildet ἐν τίνι ab; „wieder“ macht den im Zusammenhang vorausgesetzten früheren Zustand im Deutschen natürlich deutlich.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Es taugt zu nichts mehr
  rationale: ἰσχύω bezeichnet hier praktische Brauchbarkeit oder Wirksamkeit. Die deutsche Wendung gibt diese Nutzlosigkeit idiomatisch wieder.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: außer hinausgeworfen
  rationale: „Hinausgeworfen“ bewahrt die räumliche Bedeutung von ἔξω und klingt im Deutschen zugleich natürlich.
- source_word: καταπατεῖσθαι
  choice: zertreten zu werden
  rationale: Das Verb bezeichnet das Niedertreten oder Zertreten und vermittelt die drastische Bildwirkung ohne unnötigen Zusatz.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: von den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein. „Menschen“ ist im modernen Deutschen quellennah, eindeutig generisch und stilistisch natürlich.
theological_decisions:
- issue: Generischer Sinn von ὑπὸ τῶν ἀνθρώπων
  choice: von den Menschen
  alternative: von den Leuten
  rationale: Die Aussage bezieht sich allgemein auf Menschen und nicht nur auf männliche Personen. „Von den Menschen“ wahrt diesen Sinn unmittelbar, ohne eine konfessionelle oder auslegungsspezifische Festlegung einzutragen.
- issue: Bildhafte Bedeutung von μωρανθῇ
  choice: fade wird
  alternative: seine Salzkraft verliert
  rationale: Die Übersetzung hält an der konkreten Salzmetapher fest und überträgt die etymologische Verbindung zu „töricht werden“ nicht als eigenständige theologische Aussage in den Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, mündlich gut verständlicher Satzführung. Das traditionelle und weiterhin natürliche Bild „Salz der Erde“ bleibt erhalten; unnötige Fachsprache und konfessionell geprägte Deutungen werden vermieden.
