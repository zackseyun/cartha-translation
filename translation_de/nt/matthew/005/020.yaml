id: MAT.5.20
reference: Matthew 5:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: de
  text: 'Denn ich sage euch: Wenn eure Gerechtigkeit nicht über die der Schriftgelehrten und Pharisäer hinausgeht, werdet ihr auf keinen Fall in das Himmelreich kommen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ; „ich sage euch“ gibt die direkte und feierliche Anrede natürlich wieder.
- source_word: ἐὰν μὴ
  choice: wenn … nicht
  rationale: Die Formulierung gibt die notwendige negative Bedingung idiomatisch wieder; in Verbindung mit dem folgenden Satz ist sie im Deutschen natürlicher als „es sei denn“.
- source_word: περισσεύσῃ … πλεῖον
  choice: über … hinausgeht
  rationale: Die Wendung bewahrt den Gedanken eines Mehrmaßes gegenüber der Vergleichsgröße, ohne unnatürlich „mehr überfließt“ zu sagen.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: eure Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die übliche und kontextuell passende Wiedergabe von δικαιοσύνη und kann im Deutschen sowohl gerechtes Handeln als auch den Zustand des Gerechtseins bezeichnen.
- source_word: γραμματέων καὶ Φαρισαίων
  choice: der Schriftgelehrten und Pharisäer
  rationale: „Schriftgelehrte“ bezeichnet die anerkannten Gesetzes- und Schriftexperten treffend; „Pharisäer“ ist die etablierte deutsche Gruppenbezeichnung.
- source_word: οὐ μὴ εἰσέλθητε
  choice: werdet ihr auf keinen Fall … kommen
  rationale: „Auf keinen Fall“ bringt die nachdrückliche Verneinung οὐ μή klar und in modernem Deutsch zum Ausdruck.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: in das Himmelreich
  rationale: „Himmelreich“ ist die natürliche, etablierte deutsche Wiedergabe der für Matthäus charakteristischen Formulierung und bezeichnet Gottes Königsherrschaft.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη im matthäischen Kontext
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; gerechtes Handeln
  rationale: „Gerechtigkeit“ lässt die theologische Spannung zwischen gelebtem gerechten Handeln und dem umfassenderen Gerechtsein bestehen. Eine engere Umschreibung würde den Begriff vorschnell auf Moralverhalten oder Rechtsordnung festlegen.
- issue: Art des Vergleichs mit Schriftgelehrten und Pharisäern
  choice: eure Gerechtigkeit geht über die ihre hinaus
  alternative: ihr seid gerechter als sie
  rationale: Die gewählte Fassung vergleicht entsprechend dem griechischen Satz ausdrücklich die Gerechtigkeit, nicht pauschal die Personen, und legt nicht fest, ob der Unterschied vor allem quantitativ oder qualitativ zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt direkt und eindringlich; „Himmelreich“ wahrt den vertrauten matthäischen Ausdruck, während „auf keinen Fall“ die starke Verneinung ohne altertümliche Sprache wiedergibt.
