  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes treffend wieder: γάρ als „Denn“, die notwendige negative Bedingung, den Vergleich der Gerechtigkeit mit derjenigen der Schriftgelehrten und Pharisäer, die emphatische Verneinung οὐ μή sowie die matthäische Wendung „Himmelreich“. „Über … hinausgeht“ wahrt, dass die Gerechtigkeit und nicht die Personen selbst verglichen wird.'
  naturalness: Der Satz ist idiomatisches modernes Standarddeutsch und behält einen würdevollen, direkten Registerton. „Auf keinen Fall“ ist eine klare, nicht archaische Wiedergabe der Nachdrücklichkeit von οὐ μή.
  terminology: „Gerechtigkeit“, „Schriftgelehrte“, „Pharisäer“ und „Himmelreich“ sind etablierte, kontextgerechte Begriffe. Die Übersetzung von δικαιοσύνη als „Gerechtigkeit“ bewahrt die im Ausgangstext vorhandene Spannweite und legt sie nicht auf eine konfessionelle Deutung fest.
