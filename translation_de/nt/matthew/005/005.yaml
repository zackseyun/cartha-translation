  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: de
  text: Glücklich zu preisen sind die Sanftmütigen[a], denn sie werden die Erde erben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »die Sanften«. Gemeint ist eine sanfte, demütige Haltung, nicht Schwäche.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »das Land«. Die Formulierung erinnert wahrscheinlich an Psalm 37,11 und kann sowohl auf das verheißene Land als auch umfassender auf die Erde bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Glücklich zu preisen sind
  rationale: Die Wendung gibt den Zuspruch göttlicher Gunst und gelingenden Lebens wieder, ohne μακάριοι auf ein bloß subjektives Glücksgefühl zu reduzieren; zugleich klingt sie im heutigen Deutsch natürlicher als das missverständliche „selig“.
- source_word: οἱ πραεῖς
  choice: die Sanftmütigen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen von demütiger, beherrschter Sanftheit, nicht schwache oder ängstliche Menschen. „Sanftmütig“ bewahrt diese biblische Bedeutungsbreite.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet hier den vorausgehenden Glückwunsch. „Denn“ bildet die knappe Form der Seligpreisung im Deutschen idiomatisch ab.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das Personalpronomen ist im Deutschen ausdrücklich gesetzt und trägt im Kontext den griechischen Nachdruck ausreichend; „sie selbst“ wäre in dieser knappen Aussage unnötig schwer.
- source_word: κληρονομήσουσι
  choice: werden … erben
  rationale: Die direkte Wiedergabe bewahrt sowohl den Zukunftsbezug als auch die Sprache einer verheißenen Erbschaft.
- source_word: τὴν γῆν
  choice: die Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. „Die Erde“ eignet sich als Haupttext für die umfassende Reichweite der Verheißung; die mögliche Anspielung auf das verheißene Land in Psalm 37,11 bleibt durch eine Fußnote sichtbar.
theological_decisions:
- issue: Bedeutungsumfang von τὴν γῆν
  choice: die Erde
  alternative: das Land
  rationale: Der griechische Ausdruck erlaubt sowohl eine universale als auch eine auf das Land bezogene Lesart. Der Haupttext gibt die umfassende Verheißung wieder, während die Fußnote die wahrscheinlich mitschwingende Bundes- und Landverheißung aus Psalm 37,11 bewahrt.
- issue: Bedeutung von πραεῖς
  choice: die Sanftmütigen
  alternative: die Demütigen; die Freundlichen
  rationale: Die Übersetzung soll eine demütige und beherrschte Sanftheit bezeichnen, ohne sie als Kraftlosigkeit zu deuten. „Sanftmütig“ hält diese Spannung besser zusammen als die engeren Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt knapp und einprägsam wie das griechische Makarismus-Schema; traditionelle Begriffe werden nur verwendet, wenn sie semantisch tragfähig und durch eine kurze Fußnote verständlich sind.
