id: MAT.5.36
reference: Matthew 5:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: de
  text: Schwöre auch nicht bei deinem Kopf; denn du kannst kein einziges Haar weiß oder schwarz machen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: auch nicht
  rationale: Setzt die Reihe der vorausgehenden Verbote fort und klingt im modernen Deutschen natürlicher als ein isoliertes »noch«.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: bei deinem Kopf
  rationale: In Verbindung mit ὀμόσῃς bezeichnet ἐν das, worauf man schwört; die deutsche Schwurformel verlangt idiomatisch »bei«.
- source_word: ὀμόσῃς
  choice: Schwöre
  rationale: Der Aorist Konjunktiv mit μήτε bildet ein Verbot. Der Imperativ gibt dieses im Deutschen direkt und klar wieder.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung des Verbots ein und bewahrt den kausalen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: οὐ δύνασαι
  choice: du kannst … nicht
  rationale: Gibt die ausgesagte menschliche Unfähigkeit knapp und unmittelbar wieder.
- source_word: μίαν τρίχα
  choice: kein einziges Haar
  rationale: Die Negation zusammen mit μίαν betont, dass der Mensch nicht einmal über ein einzelnes Haar diese Macht besitzt.
- source_word: λευκὴν … ἢ μέλαιναν
  choice: weiß oder schwarz
  rationale: Bewahrt die beiden grundlegenden Farbbezeichnungen und ihren scharfen Gegensatz.
- source_word: ποιῆσαι
  choice: machen
  rationale: ποιέω bedeutet hier, etwas in einen bestimmten Zustand zu versetzen; »weiß oder schwarz machen« ist verständlich und nahe an der griechischen Formulierung.
theological_decisions:
- issue: Reichweite des Schwurverbots
  choice: Die konkrete Aufforderung wird als Verbot wiedergegeben, beim eigenen Kopf zu schwören.
  alternative: Den Vers ausdrücklich als ausnahmsloses Verbot aller Eide oder lediglich als Verbot missbräuchlicher Schwurformeln deuten.
  rationale: Der Vers selbst nennt das Schwören beim eigenen Kopf und begründet es mit der menschlichen Begrenztheit. Die Übersetzung entscheidet die weitergehende theologische Debatte nicht.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Der Semikolonanschluss macht die enge Beziehung zwischen Verbot und Begründung sichtbar; unnötige erklärende Zusätze wurden vermieden.
