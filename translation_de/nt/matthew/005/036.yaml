  source_fidelity: Der Text gibt die prohibitive Fortsetzung durch μήτε passend mit „auch nicht“ wieder, trifft die Schwurformel ἐν τῇ κεφαλῇ σου idiomatisch als „bei deinem Kopf“ und bewahrt die kausale Begründung sowie die Betonung von „kein einziges Haar“. „weiß oder schwarz machen“ entspricht ποιῆσαι ... λευκὴν ἢ μέλαιναν ohne zusätzliche Auslegung.
