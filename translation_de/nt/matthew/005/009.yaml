  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: de
  text: Selig sind, die Frieden stiften, denn sie werden Söhne Gottes genannt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kinder Gottes“. Im Griechischen steht „Söhne Gottes“; die männliche Pluralform kann hier Personen jeden Geschlechts einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Glückselig
  rationale: Die in den Seligpreisungen etablierte, würdevolle Wiedergabe bezeichnet nicht nur ein subjektives Glücksgefühl, sondern einen von Gott begünstigten und daher beneidenswerten Zustand.
- source_word: εἰρηνοποιοί
  choice: die Frieden stiften
  rationale: Die natürliche deutsche Wendung bewahrt den aktiven, auf die Herbeiführung von Frieden gerichteten Sinn des zusammengesetzten Nomens.
- source_word: ὅτι
  choice: denn
  rationale: Leitet in idiomatischem Deutsch den Grund der Seligpreisung ein und bewahrt den kausalen Zusammenhang.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das Personalpronomen trägt im Griechischen Nachdruck. Im parallelen deutschen Satzbau ist „sie“ natürlich; eine Wiedergabe als „sie selbst“ wäre hier unnötig markiert.
- source_word: υἱοὶ θεοῦ
  choice: Söhne Gottes
  rationale: Bewahrt die ausdrücklich männliche Pluralform und die mögliche theologische Bedeutung von Sohnschaft und Status; die repräsentative, einschließende Reichweite wird in der Fußnote erläutert.
- source_word: κληθήσονται
  choice: genannt werden
  rationale: Gibt den Futur Passiv von καλέω direkt wieder, ohne den Sinn auf bloße menschliche Anerkennung einzuengen.
theological_decisions:
- issue: Geschlechtsspezifische Sohnesbezeichnung in υἱοὶ θεοῦ
  choice: Söhne Gottes
  alternative: Kinder Gottes
  rationale: Der Haupttext bewahrt die männliche Ausdrucksform der griechischen Vorlage und damit mögliche Anklänge an Sohnschaft und den damit verbundenen Status. Die repräsentative, alle entsprechend Bezeichneten einschließende Bedeutung wird als Übersetzungsalternative in der Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glückselig“ hält den traditionellen Ton der Seligpreisung aufrecht, während „die Frieden stiften“ unmittelbar verständlich und handlungsbezogen ist.
