  naturalness: Der Satzbau ist verständlich und würdevoll. »wird ... verfallen sein« ist als rechtssprachliche Formel möglich, wirkt aber mit dem Futur II unnötig schwer; »wird ... verfallen« gibt das griechische Futur direkter wieder. »zürnt« ist gehoben, aber in diesem Register noch natürlich.
  terminology: »Gehenna des Feuers« bewahrt den spezifischen griechischen Terminus und die Bildsprache. »Rat« entspricht συνέδριον ohne die nicht zwingende institutionelle Festlegung auf den Hohen Rat. Die Erläuterung zum repräsentativen Gebrauch von »Bruder« muss am Wort »Bruder«, nicht am späteren Ausdruck »Raka«, verankert werden.
