id: MAT.5.22
reference: Matthew 5:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: de
  text: 'Ich aber sage euch: Jeder, der seinem Bruder[b] zürnt, wird dem Gericht verfallen.[a] Wer aber zu seinem Bruder sagt: »Raka!«,[c] wird dem Rat verfallen. Und wer sagt: »Du Narr!«, wird der Gehenna des Feuers[e] verfallen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften fügen nach »seinem Bruder zürnt« die Worte »ohne Grund« hinzu. Die früheste und am besten bezeugte Lesart lässt sie aus.
    reason: textual_variant
  - marker: b
    text: »Bruder« steht im griechischen Text im maskulinen Singular, kann hier aber repräsentativ gebraucht sein; die Aussage gilt nicht nur für leibliche Brüder.
    reason: lexical_alternative
  - marker: c
    text: »Raka« ist ein aramäisches Schimpfwort und bedeutet ungefähr »Hohlkopf« oder »Nichtsnutz«.
    reason: cultural_note
  - marker: e
    text: Wörtlich »der Gehenna des Feuers«. »Gehenna« geht auf das Hinnomtal bei Jerusalem zurück und wurde zum Bild für das göttliche Gericht.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ich aber sage euch
  rationale: Bewahrt den durch ἐγώ und δέ betonten Gegensatz und klingt zugleich würdig und natürlich.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: Jeder, der … zürnt
  rationale: Gibt das substantivierte Präsenspartizip als allgemein gültige Aussage wieder; »zürnen« hält den Bezug auf anhaltenden oder gehegten Zorn offen.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: seinem Bruder
  rationale: Entspricht dem maskulinen Singular des griechischen Ausdrucks. Sein möglicher repräsentativer Gebrauch wird in einer Fußnote erläutert.
- source_word: ἔνοχος ἔσται
  choice: wird … verfallen sein
  rationale: Gibt die rechtliche Verantwortlichkeit beziehungsweise Strafwürdigkeit wieder und lässt sich parallel mit Gericht, Hohem Rat und Feuerhölle verbinden.
- source_word: τῇ κρίσει
  choice: dem Gericht
  rationale: Bewahrt den gerichtlichen Sinn, ohne zwischen einem örtlichen Gericht und dem Vorgang des Gerichts endgültig zu entscheiden.
- source_word: Ῥακά
  choice: Raka
  rationale: Die aramäische Schmähung wird transliteriert und wegen ihrer kulturellen Eigenart in einer Fußnote erklärt.
- source_word: τῷ συνεδρίῳ
  choice: dem Hohen Rat
  rationale: Im neutestamentlich-jüdischen Kontext ist dies eine natürliche deutsche Bezeichnung für das συνέδριον; die allgemeinere Bedeutung »Rat« bleibt in der Fußnote sichtbar.
- source_word: Μωρέ
  choice: Du Narr!
  rationale: Gibt den Vokativ als direkte Beschimpfung wieder. »Narr« bewahrt stärker als moderne klinisch oder umgangssprachlich gefärbte Ausdrücke die moralische Schärfe.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: der Feuerhölle
  rationale: Ist im Deutschen verständlich und gibt die Genitivverbindung knapp wieder; der spezifische Ausdruck Gehenna und sein Bildhintergrund werden in der Fußnote offengelegt.
theological_decisions:
- issue: Bedingungsloser oder eingeschränkter Zorn
  choice: der seinem Bruder zürnt
  alternative: der seinem Bruder ohne Grund zürnt
  rationale: Der SBLGNT-Haupttext lässt εἰκῇ (»ohne Grund«) aus. Die textkritisch bedeutsame Erweiterung wird nicht in den Haupttext aufgenommen, sondern vermerkt.
- issue: Deutung von γέεννα
  choice: Feuerhölle
  alternative: feurige Gehenna / Gehenna des Feuers
  rationale: Der Haupttext soll für heutige deutschsprachige Leser unmittelbar verständlich sein, während die Fußnote den besonderen jüdischen Bild- und Begriffshintergrund bewahrt und eine Gleichsetzung mit sämtlichen späteren Höllenvorstellungen vermeidet.
- issue: Reichweite von ἀδελφός
  choice: Bruder
  alternative: Bruder oder Schwester / Mitmensch
  rationale: Der maskuline Singular wird formal bewahrt. Dass er hier repräsentativ und nicht nur für leibliche männliche Geschwister gebraucht sein kann, wird erläutert, ohne eine engere theologische Gruppenbezeichnung wie »Glaubensbruder« einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst parallelem Satzbau. »Zürnen« und »Narr« sind leicht gehoben, aber allgemein verständlich und tragen der feierlich-gerichtlichen Tonlage Rechnung. Alle textkritischen, kulturellen und begrifflichen Erläuterungen sind knapp in Fußnoten ausgelagert.
