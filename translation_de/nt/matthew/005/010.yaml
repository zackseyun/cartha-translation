  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: de
  text: Glücklich zu preisen sind die, die um der Gerechtigkeit[a] willen verfolgt worden sind; denn ihnen gehört das Himmelreich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier auch Rechtschaffenheit bezeichnen und einen umfassenderen moralischen oder auf den Bund bezogenen Sinn haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Glücklich zu preisen sind
  rationale: Gibt den zusprechenden Charakter der Seligpreisung wieder, ohne den Ausdruck auf ein subjektives Glücksgefühl zu verengen.
- source_word: οἱ δεδιωγμένοι
  choice: die … verfolgt worden sind
  rationale: Das substantivierte Perfektpassiv bezeichnet Menschen, die Verfolgung erlitten haben und von deren Folgen betroffen sind.
- source_word: ἕνεκεν
  choice: um … willen
  rationale: Eine natürliche, würdevolle Entsprechung, die den Grund beziehungsweise Anlass der Verfolgung ausdrückt.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: Der deutsche Begriff bewahrt die mögliche Breite zwischen einem Leben nach Gottes Willen, rechtem Handeln und dem Aspekt der Gerechtigkeit.
- source_word: ὅτι
  choice: denn
  rationale: Leitet idiomatisch die Begründung der Seligpreisung ein.
- source_word: αὐτῶν ἐστιν
  choice: ihnen gehört
  rationale: Gibt die possessive Aussage im Deutschen klar und natürlich wieder.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Eingebürgerte und prägnante deutsche Wiedergabe der für Matthäus charakteristischen Bezeichnung für Gottes himmlische Königsherrschaft.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; ein Leben nach Gottes Willen
  rationale: „Gerechtigkeit“ ist die direkte und im Deutschen theologisch offene Entsprechung. Die Fußnote verdeutlicht, dass hier nicht nur gesellschaftliche Rechtspflege, sondern auch ein Gott entsprechendes Leben gemeint sein kann, ohne beide Aspekte gegeneinander auszuspielen.
- issue: Zeitlicher Aspekt von δεδιωγμένοι
  choice: verfolgt worden sind
  alternative: verfolgt werden; die Verfolgten
  rationale: Das griechische Perfektpassiv wird ausdrücklich wiedergegeben und lässt den resultativen Zustand erkennen; zugleich wird nicht behauptet, die Verfolgung sei notwendig abgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glücklich zu preisen“ wahrt den feierlichen Zuspruch der Seligpreisung; „Himmelreich“ ist verständlich und im matthäischen Sprachgebrauch etabliert.
