reference: Matthew 5:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: de
  text: 'Ich aber sage euch: Jeder, der sich von seiner Frau scheidet – außer wegen sexueller Unmoral[a] –, bewirkt, dass sie Ehebruch begeht[b]; und wer eine geschiedene Frau heiratet, begeht Ehebruch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sexuelle Unmoral“ übersetzt das griechische Wort porneia, einen weit gefassten Ausdruck für unerlaubtes sexuelles Verhalten; auch „Unzucht“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Möglicherweise wörtlicher: „macht sie zur Ehebrecherin“. Der griechische Infinitiv steht der Form nach im Passiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: sich von seiner Frau scheidet / eine geschiedene Frau
  rationale: Im ehelichen Zusammenhang bezeichnet ἀπολύω die Scheidung. Die deutsche Formulierung gibt den rechtlich-ehelichen Sinn natürlich wieder und wahrt den Zusammenhang zwischen beiden Vorkommen.
- source_word: γυναῖκα
  choice: Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten; Possessivpronomen und Scheidungskontext machen hier die Ehefrau deutlich. „Seine Frau“ ist im modernen Deutsch natürlicher als „seine Ehefrau“.
- source_word: παρεκτὸς λόγου πορνείας
  choice: außer wegen sexueller Unmoral
  rationale: παρεκτός führt eine echte Ausnahme ein; λόγου bezeichnet hier Grund, Angelegenheit oder Fall. „Sexuelle Unmoral“ wahrt den breiten Bedeutungsumfang von πορνεία, ohne ihn auf Ehebruch oder eine bestimmte sexuelle Handlung zu verengen.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: macht, dass sie Ehebruch begeht
  rationale: ποιέω mit Infinitiv drückt Verursachung aus. Die Formulierung ist verständliches Deutsch; eine Fußnote bewahrt die auffällige Passivform des griechischen Infinitivs und die daraus entstehende Deutungsfrage.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: wer ... heiratet
  rationale: Der Relativsatz mit ἐάν formuliert einen unbestimmten allgemeinen Fall; „wer“ ist knapp und idiomatisch.
- source_word: μοιχᾶται
  choice: begeht Ehebruch
  rationale: Die Präsensform wird im Deutschen als allgemeingültige Aussage natürlich mit „begeht Ehebruch“ wiedergegeben.
- source_word: πᾶς ὁ ἀπολύων
  choice: Jeder, der sich ... scheidet
  rationale: Die maskuline singularische Partizipialkonstruktion bezeichnet hier jeden Mann in der beschriebenen Situation. „Jeder“ bewahrt diesen Bezug, während „seine Frau“ das soziale und eheliche Szenario ausdrücklich erkennen lässt.
theological_decisions:
- issue: Bedeutung der Ausnahmeklausel παρεκτὸς λόγου πορνείας
  choice: 'Als echte Ausnahme wiedergeben: „außer wegen sexueller Unmoral“'
  alternative: „außer im Fall einer unrechtmäßigen Ehe“ oder eine Wiedergabe, die keine echte Ausnahme ausdrückt
  rationale: Der griechische Wortlaut kennzeichnet ausdrücklich eine Ausnahme, bestimmt den genauen Umfang von πορνεία jedoch nicht. Die Übersetzung bewahrt diese Offenheit und legt keine konfessionelle Scheidungslehre fest.
- issue: Aussagekraft von μοιχευθῆναι nach ποιεῖ
  choice: Im Haupttext idiomatisch „macht, dass sie Ehebruch begeht“, mit Hinweis auf die Passivform in einer Fußnote
  alternative: „macht sie zur Ehebrecherin“ oder „bewirkt, dass an ihr Ehebruch begangen wird“
  rationale: Der Infinitiv ist formal passiv, doch seine genaue Aussagekraft ist umstritten. Der Haupttext bleibt verständlich; die Fußnote verhindert, dass die grammatische Spannung unbemerkt eingeebnet wird.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Gedankenstriche heben die Ausnahmeklausel klar ab, ohne ihren sachlichen Zusammenhang zu verändern. Beide Fußnotenmarker stehen unmittelbar an den einschlägigen Formulierungen im Haupttext.
