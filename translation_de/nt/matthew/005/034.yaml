  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: de
  text: 'Ich aber sage euch: Schwört überhaupt nicht, weder beim Himmel, denn er ist Gottes Thron,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ich aber sage euch
  rationale: Die betonte Gegenüberstellung durch ἐγὼ δέ wird formal und zugleich natürlich wiedergegeben.
- source_word: μὴ ὀμόσαι ὅλως
  choice: Schwört überhaupt nicht
  rationale: Der Aoristinfinitiv nach λέγω wird als verneinter Imperativ wiedergegeben; ὅλως bezeichnet hier den umfassenden Ausschluss des Schwörens.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: weder beim Himmel
  rationale: Bei Schwurformeln entspricht deutsches „bei“ dem instrumentalen ἐν idiomatisch.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt die Begründung für das Verbot ein; „denn“ wahrt den argumentativen Zusammenhang natürlich.
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: er ist Gottes Thron
  rationale: Der Himmel wird mit maskulinem Pronomen wieder aufgenommen; der Genitiv wird knapp als „Gottes Thron“ ausgedrückt.
theological_decisions:
- issue: Reichweite von μὴ ὀμόσαι ὅλως
  choice: „Schwört überhaupt nicht“ ohne einschränkenden Zusatz
  alternative: „Leistet keinen falschen Eid“ oder eine ausdrückliche Beschränkung auf leichtfertige Schwüre
  rationale: Der griechische Wortlaut formuliert an dieser Stelle umfassend. Mögliche Abgrenzungen aus dem weiteren biblischen Kontext werden nicht in den Vers hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Plural bleibt erhalten; die Zeichensetzung lässt den Satz offen, da der Gedankengang im folgenden Vers fortgesetzt wird.
