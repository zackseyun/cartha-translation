id: MAT.5.30
reference: Matthew 5:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: de
  text: Und wenn deine rechte Hand dich zum Straucheln bringt[a], dann schneide sie ab und wirf sie weg. Denn es ist besser für dich, dass eines deiner Körperteile verloren geht, als dass dein ganzer Körper in die Gehenna[b] kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dich zur Sünde verleitet«. Das griechische Verb bedeutet wörtlich, jemanden zum Straucheln zu bringen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in die Hölle«. »Gehenna« geht auf das Hinnomtal bei Jerusalem zurück und bezeichnet hier den Ort beziehungsweise das Geschick des endzeitlichen Gerichts.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: deine rechte Hand
  rationale: Die geläufige deutsche Wendung bewahrt die konkrete Körperbildlichkeit und die Parallele zum vorhergehenden Vers.
- source_word: σκανδαλίζει
  choice: dich zum Straucheln bringt
  rationale: Bewahrt das griechische Stolperbild und lässt zugleich dessen ethischen Sinn erkennen, ohne ihn im Haupttext vollständig mit „zur Sünde verleitet“ aufzulösen.
- source_word: ἔκκοψον
  choice: schneide sie ab
  rationale: Gibt den entschiedenen Imperativ unmittelbar und im Blick auf eine Hand idiomatisch wieder.
- source_word: βάλε ἀπὸ σοῦ
  choice: wirf sie von dir
  rationale: Bewahrt sowohl die Kraft von βάλε als auch die ausdrücklich bezeichnete Entfernung ἀπὸ σοῦ.
- source_word: συμφέρει γάρ σοι
  choice: Denn es ist besser für dich
  rationale: Drückt den kontextuellen Sinn des persönlichen Vorteils natürlich aus, ohne einen wirtschaftlichen Beiklang von „nützlich“ oder „Gewinn“.
- source_word: ἵνα ἀπόληται
  choice: dass ... verloren geht
  rationale: Gibt den Verlust des Körperteils wieder und bewahrt die Bedeutungsweite von ἀπόλλυμι, ohne unnötig „vernichtet“ festzulegen.
- source_word: ἓν τῶν μελῶν σου
  choice: eines deiner Körperteile
  rationale: Ist im modernen Deutsch verständlicher als „eines deiner Glieder“ und weit genug, da μέλος nicht ausschließlich eine Gliedmaße bezeichnet.
- source_word: ὅλον τὸ σῶμά σου
  choice: dein ganzer Körper
  rationale: Bewahrt den deutlichen Gegensatz zwischen einem einzelnen Körperteil und dem gesamten Körper.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: in die Gehenna kommt
  rationale: „Gehenna“ bewahrt den historisch und theologisch geprägten Ausgangsbegriff; „kommt“ gibt die gerichtete Bewegung im Deutschen natürlich wieder, ohne ein nicht vorhandenes Passiv wie „geworfen wird“ einzuführen.
theological_decisions:
- issue: Wiedergabe von γέεννα
  choice: Gehenna
  alternative: Hölle
  rationale: Die Transliteration bewahrt den Bezug auf das Hinnomtal und die jüdische Gerichtssprache, statt den Begriff stillschweigend mit sämtlichen späteren Vorstellungen zu verbinden, die das deutsche Wort „Hölle“ tragen kann. Die geläufige Deutung steht in der Fußnote.
- issue: Bedeutung von σκανδαλίζει
  choice: zum Straucheln bringt
  alternative: zur Sünde verleitet
  rationale: Die gewählte Formulierung erhält die Metapher des griechischen Verbs. Die ethische Bedeutung wird als plausible Verdeutlichung in der Fußnote genannt, ohne die Bildsprache im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, eindringlicher Satzführung. Die drastische Körpermetaphorik bleibt unverändert erhalten. „Körperteile“ vermeidet das heute missverständliche oder altertümlich wirkende „Glieder“, während „Gehenna“ als erklärungsbedürftiger Quellenbegriff bewusst stehen bleibt.
