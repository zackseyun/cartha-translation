source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: de
  text: damit ihr Söhne eures Vaters im Himmel[a] werdet; denn er lässt seine Sonne über Böse und Gute aufgehen und lässt es über Gerechte und Ungerechte regnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eures Vaters, der in den Himmeln ist“. Statt „Söhne“ ist dem Sinn nach auch „Kinder“ möglich; der griechische Text verwendet jedoch ausdrücklich „Söhne“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch steht aktiv: „er regnet über Gerechte und Ungerechte“. „Lässt es … regnen“ ist die idiomatische deutsche Wiedergabe mit Gott als Handelndem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das beabsichtigte Ergebnis ein und entspricht dem griechischen Zusammenhang natürlich und prägnant.
- source_word: γένησθε
  choice: ihr … werdet
  rationale: Bewahrt die dynamische Bedeutung von γίνομαι („werden“) und ebnet sie nicht zum statischen „sein“ ein.
- source_word: υἱοὶ
  choice: Söhne
  rationale: Gibt den ausdrücklich männlichen Plural und die Sohnesbeziehung des Ausgangstextes wieder; im Kontext sind die Jünger insgesamt angesprochen.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: eures Vaters im Himmel
  rationale: Gibt die Genitivverbindung und die Ortsangabe idiomatisch wieder; der griechische Plural „in den Himmeln“ wird im Deutschen üblicherweise singularisch ausgedrückt.
- source_word: ὅτι
  choice: denn
  rationale: Kennzeichnet die folgende Aussage als Begründung. „Denn“ ist in diesem Satzfluss idiomatischer als ein mit „weil“ eingeleiteter Nebensatz.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: er lässt seine Sonne … aufgehen
  rationale: Bewahrt sowohl das ausdrückliche Possessivpronomen als auch Gottes verursachendes Handeln in natürlichem Deutsch.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: über Böse und Gute
  rationale: Die substantivierten Adjektive werden knapp und parallel zum Griechischen wiedergegeben; „über“ passt im Deutschen idiomatisch zum Aufgehen der Sonne.
- source_word: βρέχει
  choice: lässt es … regnen
  rationale: Gibt das aktive Verb βρέχει idiomatisch wieder und hält Gottes Wirken als Subjekt fest, ohne die unnatürliche Formulierung „er regnet auf“.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: über Gerechte und Ungerechte
  rationale: Bewahrt das etablierte moralische Gegensatzpaar und die substantivische Verwendung der Adjektive.
theological_decisions:
- issue: Geschlechtlich markierte Sohnesbezeichnung
  choice: Söhne eures Vaters
  alternative: Kinder eures Vaters
  rationale: υἱοί bedeutet ausdrücklich „Söhne“ und trägt die Sohnesmetaphorik. Die Bezeichnung gilt im Kontext repräsentativ für die angesprochenen Jünger insgesamt, wird aber im Haupttext nicht neutralisiert.
- issue: Bedeutung von γένησθε für die Gotteskindschaft
  choice: damit ihr … werdet
  alternative: damit ihr … seid / euch als … erweist
  rationale: „Werden“ bewahrt die lexikalische und aspektuelle Spannung des griechischen Verbs. Der Wortlaut erklärt nicht näher, ob der Schwerpunkt auf Eintritt in diesen Stand oder auf sichtbarer Entsprechung zum Vater liegt; diese Mehrdeutigkeit wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die parallelen Gegensatzpaare „Böse und Gute“ sowie „Gerechte und Ungerechte“ bewahren den prägnanten, aphoristischen Charakter des griechischen Satzes.
