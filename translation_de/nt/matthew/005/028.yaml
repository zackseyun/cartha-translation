id: MAT.5.28
reference: Matthew 5:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: de
  text: 'Ich aber sage euch: Jeder, der eine Frau ansieht, um sie zu begehren, hat in seinem Herzen bereits Ehebruch mit ihr begangen.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jeder, der eine Frau ansieht, um sie sexuell zu begehren.“'
    reason: Lexikalische Alternative zu ἐπιθυμέω; sie macht den in diesem Zusammenhang sexuellen Sinn ausdrücklich, ohne das Begehren zu einer bloßen Art des Ansehens zu verschieben.
  - marker: b
    text: Das griechische Wort kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten.
    reason: Bewahrt die echte lexikalische Mehrdeutigkeit von γυνή.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ich aber sage euch
  rationale: Bewahrt die Hervorhebung von ἐγώ und den Kontrast durch δέ in einer würdevollen, im biblischen Lehrzusammenhang natürlichen deutschen Form.
- source_word: πᾶς ὁ βλέπων
  choice: Jeder, der ... ansieht
  rationale: Gibt die allgemeine, umfassende Aussage wieder. „Ansehen“ bezeichnet hier im Zusammenspiel mit der Zweckangabe ein absichtsvolles Hinblicken, nicht ein bloß zufälliges Sehen.
- source_word: γυναῖκα
  choice: eine Frau
  rationale: γυνή kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten. Da der griechische Wortlaut den Familienstand nicht ausdrücklich bezeichnet, bleibt der Haupttext bei der weiteren Bedeutung.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτήν
  choice: um sie zu begehren
  rationale: „Um ... zu“ bildet die durch πρὸς mit substantiviertem Infinitiv ausgedrückte Absicht deutlich ab. „Begehren“ wahrt die lexikalische Breite von ἐπιθυμέω, während der Zusammenhang das Begehren als sexuell und verfehlt kennzeichnet.
- source_word: ἤδη ἐμοίχευσεν αὐτήν
  choice: hat ... bereits Ehebruch mit ihr begangen
  rationale: „Bereits“ entspricht ἤδη; die deutsche Wendung „Ehebruch mit ihr begehen“ gibt das transitive μοιχεύω mit αὐτήν verständlich und idiomatisch wieder.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: in seinem Herzen
  rationale: Die traditionelle und weiterhin verständliche Wendung bewahrt καρδία als Bezeichnung des inneren Menschen, besonders seiner Gedanken und Wünsche.
theological_decisions:
- issue: Ob γυνή als „Frau“ oder „Ehefrau“ wiederzugeben ist
  choice: Frau
  alternative: Ehefrau
  rationale: Der Ehebruchskontext kann an eine verheiratete Frau denken lassen, doch der griechische Ausdruck legt ihren Familienstand nicht eindeutig fest. Der Haupttext soll diese Offenheit nicht einschränken.
- issue: Ob ἐπιθυμέω mit „begehren“ oder ausdrücklich mit „lüstern ansehen“ wiederzugeben ist
  choice: begehren
  alternative: sie voller Begierde ansehen
  rationale: „Begehren“ bleibt näher am semantisch breiteren Verb; die sexuelle und moralisch verfehlte Bedeutung entsteht hier klar aus dem Zusammenhang. Die Alternative wird zur Verdeutlichung in einer Fußnote genannt.
- issue: Ob der Satz jedes Sehen oder ein absichtsvolles Hinsehen verurteilt
  choice: 'absichtsvolles Hinsehen: „um sie zu begehren“'
  alternative: bloßes Ansehen
  rationale: πρὸς τὸ mit dem Infinitiv drückt Zielrichtung oder Absicht aus. Die Übersetzung wahrt daher den Bezug zwischen Hinsehen und beabsichtigtem Begehren, ohne die Spannung zwischen innerer Absicht und vollzogenem Ehebruch abzuschwächen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klar verständlichem Lehrton. Die Stellung „Ich aber“ bewahrt den Nachdruck des griechischen Satzanfangs; „um sie zu begehren“ gibt die Absicht präzise wieder. Keine konfessionell geprägte Zusatzdeutung.
