review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt sämtliche Elemente des griechischen Satzes angemessen wieder: Das hervorgehobene und kontrastierende „ἐγὼ δὲ λέγω ὑμῖν“ erscheint als „Ich aber sage euch“; beide Imperative, „eure Feinde“ sowie das Gebet „für“ die Verfolgenden sind vollständig erhalten. „die, die euch verfolgen“ wahrt den verbalen Charakter des substantivierten Präsenspartizips, ohne einen stärkeren Verlaufsaspekt einzutragen.'
  naturalness: '„Ich aber sage euch: Liebt eure Feinde und betet für die, die euch verfolgen.“ ist klares, modernes Standarddeutsch mit einem angemessen würdevollen Register für die Bergpredigt. Die Wiederholung in „die, die“ ist idiomatisch und verständlich; sie vermeidet zugleich eine unnötig nominalisierende Formulierung wie „eure Verfolger“.'
  terminology: „Liebt“, „Feinde“, „betet“ und „verfolgen“ sind etablierte, semantisch genaue und theologisch nicht einengende Entsprechungen. „Für“ gibt ὑπέρ in diesem Gebetskontext natürlich wieder, ohne den Gebetsinhalt interpretativ auf Segen, Umkehr oder Ähnliches festzulegen.
