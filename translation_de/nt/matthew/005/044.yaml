source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: de
  text: 'Ich aber sage euch: Liebt eure Feinde und betet für die, die euch verfolgen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ich aber sage euch
  rationale: Bewahrt die ausdrückliche Hervorhebung durch ἐγώ und den Kontrast durch δέ. Die Wortstellung ist im Deutschen würdevoll und für die Kontrastformeln der Bergpredigt natürlich.
- source_word: ἀγαπᾶτε
  choice: Liebt
  rationale: Die direkte Imperativform gibt das Gebot knapp und unverfälscht wieder. Ein Zusatz wie „beständig“ würde den Aspekt im Deutschen überpräzisieren.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: eure Feinde
  rationale: Direkte, idiomatische Wiedergabe, die die im Ausdruck bezeichnete feindliche Beziehung nicht abschwächt.
- source_word: προσεύχεσθε
  choice: betet
  rationale: Entspricht der üblichen Bedeutung von προσεύχομαι und wahrt die imperative Kraft ohne unnötige Aspektmarkierung.
- source_word: ὑπὲρ
  choice: für
  rationale: Bei Gebet bezeichnet ὑπέρ mit dem Genitiv hier das Beten zugunsten beziehungsweise im Interesse der betreffenden Personen. „Für“ ist im modernen Deutschen die natürliche und ausreichend genaue Formulierung.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: die, die euch verfolgen
  rationale: Gibt das substantivierte Präsenspartizip verbal wieder und lässt den fortdauernden beziehungsweise typischen Charakter der Verfolgung erkennen, ohne ihn eigens auszudeuten.
theological_decisions:
- issue: Reichweite des Gebots gegenüber Feinden
  choice: 'Beide Imperative werden ohne erläuternde Zusätze wiedergegeben: Feinde lieben und für Verfolger beten.'
  alternative: „Lieben“ ausdrücklich als wohlwollendes Handeln bestimmen oder das Gebet als Bitte um Segen, Umkehr oder Vergebung ausformulieren.
  rationale: Der griechische Text gebietet Liebe und Gebet, legt aber in diesem Vers weder sämtliche praktischen Folgen noch den konkreten Inhalt des Gebets fest. Die offene ethische und theologische Spannung bleibt erhalten.
translation_notes:
  register: Modernes Standarddeutsch in klarer, würdevoller Rede. „Ich aber sage euch“ bewahrt den markierten Kontrast des griechischen Satzanfangs; „die, die euch verfolgen“ ist bewusst verbal und allgemeinverständlich.
