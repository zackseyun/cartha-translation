review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt sämtliche Elemente des griechischen Textes präzise wieder: die feierliche Bekräftigung ἀμήν, die direkte Anrede, die emphatische Verneinung οὐ μή, die Bewegung weg vom Ort (ἐκεῖθεν), den durch vollständige Zahlung bestimmten Endpunkt sowie die konkrete römische Münzbezeichnung κοδράντης. „Bis du ... bezahlt hast“ ist eine idiomatische und semantisch angemessene Wiedergabe von ἕως ἂν ἀποδῷς.'
  naturalness: „Amen, ich sage dir“ ist im modernen Standarddeutsch verständlich, würdevoll und als jesuanische Redeformel etabliert. Der übrige Satz ist flüssig und klar. „Ganz gewiss nicht herauskommen“ bildet die Emphase natürlich ab.
  terminology: „Quadrans“ bewahrt die spezifische historische Münzbezeichnung; die Fußnote erklärt sie treffend als kleine römische Bronzemünze. Die Übersetzung vermeidet eine über das Bild von Schuld, Haft und Zahlung hinausgehende dogmatische Auslegung.
