id: MAT.5.26
reference: Matthew 5:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: de
  text: 'Amen, ich sage dir: Du wirst von dort ganz gewiss nicht herauskommen, bis du den letzten Quadrans[a] bezahlt hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Quadrans war eine kleine römische Bronzemünze.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das unübersetzte „Amen“ bewahrt die markante, feierliche Bekräftigungsformel Jesu und ist im Deutschen geläufig. Es steht hier nur einmal.
- source_word: λέγω σοι
  choice: ich sage dir
  rationale: Die direkte Anrede wird schlicht und natürlich wiedergegeben; zugleich bleibt der feierlich-autoritative Ton der Formel erhalten.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: du wirst … ganz gewiss nicht herauskommen
  rationale: Die Verbindung οὐ μή mit dem Aorist Konjunktiv ist eine nachdrückliche Verneinung. „Ganz gewiss nicht“ gibt diese Verstärkung in gegenwärtigem Deutsch wieder.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Das Adverb bezeichnet eine Bewegung weg von dem genannten Ort. Zusammen mit „herauskommen“ klingt „von dort“ natürlich und wahrt die räumliche Aussage.
- source_word: ἕως ἂν ἀποδῷς
  choice: bis du … bezahlt hast
  rationale: Die Konstruktion bezeichnet den zukünftigen Endpunkt des Eingeschlossenseins; das Perfekt im Deutschen hebt die vollständige Begleichung hervor, ohne mehr als der griechische Text zu behaupten.
- source_word: τὸν ἔσχατον
  choice: den letzten
  rationale: Die Formulierung bezeichnet den letzten noch ausstehenden Betrag und wird ohne unnötige Verstärkung wiedergegeben.
- source_word: κοδράντην
  choice: Quadrans
  rationale: Der konkrete Name der römischen Münze bleibt erhalten, statt durch eine historisch irreführende moderne oder europäische Münzbezeichnung ersetzt zu werden. Eine Fußnote erklärt den Begriff.
theological_decisions:
- issue: Ob das Gefängnis- und Schuldbild ausdrücklich als Endgericht, Läuterung oder rein weltliche Rechtssituation auszulegen ist
  choice: Die konkrete Aussage über das Nicht-Herauskommen bis zur vollständigen Bezahlung bleibt ohne ausdrückliche dogmatische Deutung stehen.
  alternative: Die Aussage ausdrücklich auf das göttliche Endgericht oder einen Läuterungszustand beziehen.
  rationale: Der griechische Wortlaut lässt solche weiterführenden Deutungen offen. Die Übersetzung wahrt deshalb das unmittelbare Bild und löst seine theologische Spannung nicht einseitig auf.
- issue: Ob „bis“ zwingend voraussetzt, dass danach eine Freilassung erfolgt
  choice: Die zeitliche Formulierung „bis“ wird unverändert bewahrt, ohne daraus ausdrücklich eine spätere Freilassung abzuleiten.
  alternative: Den Satz so formulieren, dass eine spätere Freilassung entweder garantiert oder ausgeschlossen wird.
  rationale: ἕως ἄν markiert die vollständige Zahlung als Grenze, entscheidet für sich allein aber nicht alle weitergehenden theologischen Fragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Formel „Amen, ich sage dir“ bleibt wegen ihrer Quellennähe und Verständlichkeit erhalten; die übrige Syntax ist gegenwärtig und gut lesbar.
