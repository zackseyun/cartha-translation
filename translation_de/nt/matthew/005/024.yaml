source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: de
  text: Lass deine Gabe dort vor dem Altar liegen und geh. Versöhne dich zuerst mit deinem Bruder[a]; dann komm und bring deine Gabe dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bruder“ gibt das maskuline Singularwort wieder. Der Grundsatz der Versöhnung kann im Zusammenhang weiter gefasst werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ τὸ δῶρόν σου
  choice: Lass deine Gabe dort … liegen
  rationale: ἄφες bezeichnet hier das Zurücklassen an einem Ort. Die Ergänzung „liegen“ macht die konkrete räumliche Bedeutung im Deutschen natürlich und eindeutig.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: vor dem Altar
  rationale: Gibt die räumliche Beziehung knapp und idiomatisch wieder; „Altar“ ist die übliche Entsprechung für θυσιαστήριον.
- source_word: ὕπαγε πρῶτον
  choice: geh. Versöhne dich zuerst
  rationale: „Geh“ bewahrt den eigenständigen Bewegungsbefehl; „zuerst“ erhält den ausdrücklichen Vorrang der Versöhnung vor der Darbringung.
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: Versöhne dich mit deinem Bruder
  rationale: Das deutsche reflexive „sich mit jemandem versöhnen“ gibt den passiven Imperativ und den Dativ idiomatisch wieder, ohne ein einseitig erzielbares Ergebnis zu unterstellen.
- source_word: καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου
  choice: dann komm und bring deine Gabe dar
  rationale: Die koordinierte deutsche Form gibt die zeitliche Folge des Partizips und des Imperativs natürlich wieder. „darbringen“ passt zum kultischen Zusammenhang und unterscheidet die Opferhandlung vom bloßen Mitbringen.
theological_decisions:
- issue: Bedeutungsweite von ἀδελφός in der zwischenmenschlichen Weisung
  choice: Bruder
  alternative: Bruder oder Schwester; Mitmensch; Glaubensbruder
  rationale: Der griechische Ausdruck steht im maskulinen Singular. „Bruder“ bewahrt diese Form und die familiäre Beziehungssprache. Eine Fußnote weist darauf hin, dass die Weisung in ihrem Zusammenhang nicht zwingend auf einen leiblichen Bruder beschränkt ist.
- issue: Wechselseitigkeit der Versöhnung
  choice: Versöhne dich mit
  alternative: Lass dich mit … versöhnen
  rationale: διαλλάγηθι ist formal passiv, wird hier jedoch idiomatisch als Aufforderung zur Wiederherstellung der Beziehung verstanden. Das natürliche deutsche „Versöhne dich mit“ wahrt die relationale Ausrichtung, ohne die Reaktion des anderen ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Imperative bewahren Nachdruck und Abfolge des griechischen Satzes. „Gabe“ hält die lexikalische Form von δῶρον fest, während „darbringen“ den Opferkontext klar erkennen lässt.
