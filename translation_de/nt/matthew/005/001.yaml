source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: de
  text: Als Jesus die Menschenmengen sah, stieg er auf den Berg. Als er sich gesetzt hatte,[a] kamen seine Jünger zu ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem er sich gesetzt hatte“. Im Griechischen steht eine Genitivus-absolute-Konstruktion, deren zeitlicher Bezug nicht genauer festgelegt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: Als Jesus die Menschenmengen sah
  rationale: Das adverbiale Aoristpartizip setzt den zeitlichen bzw. begleitenden Umstand der Haupthandlung. „Als … sah“ ist im modernen Deutsch natürlicher als eine substantivische oder partizipiale Konstruktion. Das im Griechischen nur implizite Subjekt wird zur Klarheit als „Jesus“ wiederaufgenommen; δέ ist hier eine schwache Übergangspartikel und bleibt unübersetzt.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: stieg er auf den Berg
  rationale: ἀναβαίνω bezeichnet eine Aufwärtsbewegung; mit εἰς wird die Bewegung auf den Berg hin ausgedrückt. „auf den Berg steigen“ ist präzise, idiomatisch und bewahrt den bestimmten Artikel.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Nachdem er sich gesetzt hatte
  rationale: Der Genitivus absolutus bezeichnet einen zeitlichen Begleitumstand, der der folgenden Handlung sachlich vorausgeht. Das deutsche Plusquamperfekt macht diesen Bezug natürlich verständlich; eine weniger strikt zeitliche Wiedergabe wird in der Fußnote genannt.
- source_word: προσῆλθαν αὐτῷ
  choice: kamen … zu ihm
  rationale: προσέρχομαι bedeutet hier „herankommen/zu jemandem kommen“. Die gewählte Formulierung ist schlicht und entspricht dem erzählerischen Register.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: „Jünger“ ist die etablierte und sachlich passende deutsche Bezeichnung für μαθηταί als Schüler und Anhänger Jesu.
theological_decisions:
- issue: Bestimmter Artikel bei τὸ ὄρος
  choice: auf den Berg
  alternative: auf einen Berg; den Berghang hinauf
  rationale: Der bestimmte Artikel des griechischen Textes wird bewahrt, ohne damit einen namentlich bekannten Berg vorauszusetzen. „Berg“ gibt ὄρος direkt wieder; die mögliche topografische Bedeutung „Anhöhe/Berghang“ wird nicht unnötig festgelegt.
- issue: Zeitlicher Bezug von καθίσαντος αὐτοῦ
  choice: Nachdem er sich gesetzt hatte
  alternative: Als er sich gesetzt hatte
  rationale: Der Genitivus absolutus stellt das Sichsetzen als Rahmenbedingung für das Herantreten der Jünger dar. „Nachdem“ gibt die naheliegende Vorzeitigkeit wieder, ohne dem Sitzen darüber hinaus eine besondere zeremonielle oder lehramtliche Bedeutung zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer narrativer Satzfolge. „Menschenmengen“ bewahrt den Plural von ὄχλοι. Der Name „Jesus“ wird im Deutschen zur eindeutigen Subjektaufnahme ergänzt, ohne neue Sachinformation einzuführen.
