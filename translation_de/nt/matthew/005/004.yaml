  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: de
  text: Glücklich zu preisen sind die Trauernden[a], denn sie werden getröstet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Klagenden“. Das griechische Wort ist weit gefasst und nennt den Anlass der Trauer nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Glückselig
  rationale: Bewahrt den wertenden und verheißungsvollen Charakter der Seligpreisungsformel besser als „glücklich“, das vor allem einen subjektiven Gefühlszustand bezeichnen kann.
- source_word: οἱ πενθοῦντες
  choice: die Trauernden
  rationale: Das substantivierte Partizip Präsens wird im Deutschen natürlich als substantiviertes Adjektiv wiedergegeben. „Trauernden“ lässt den Anlass der Trauer offen und umfasst Klage über Verlust, Leiden, Sünde oder Not.
- source_word: ὅτι
  choice: denn
  rationale: Leitet den Grund für die Seligpreisung ein und entspricht in dieser feierlichen, aber verständlichen Formulierung dem kausalen Sinn.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das griechische Pronomen ist leicht hervorgehoben; im Deutschen trägt „sie“ in der Gegenüberstellung bereits genügend Gewicht, während „sie selbst“ unnötig markiert klänge.
- source_word: παρακληθήσονται
  choice: werden getröstet werden
  rationale: Gibt das Futur Passiv und die Bedeutung des Empfangens von Trost präzise wieder, ohne den im Passiv unausgesprochenen Handelnden ausdrücklich zu benennen.
theological_decisions:
- issue: Gegenstand und Tragweite der Trauer
  choice: „die Trauernden“ ohne Festlegung des Anlasses
  alternative: „die über ihre Sünde Trauernden“ oder eine andere auf Verlust, Unterdrückung beziehungsweise Israels Not eingeengte Fassung
  rationale: Der griechische Text nennt keinen Gegenstand der Trauer. Die offene Wiedergabe bewahrt die theologische und seelsorgerliche Weite der Aussage.
- issue: Handelnder beim zukünftigen Trost
  choice: Passivform ohne ausdrückliche Nennung Gottes
  alternative: „denn Gott wird sie trösten“
  rationale: Die Passivform kann als göttliches Passiv verstanden werden, doch der Text nennt den Handelnden nicht ausdrücklich. Die deutsche Passivform bewahrt diese sprachliche Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glückselig“ erhält die vertraute Form der Seligpreisung und vermeidet die Verengung auf momentanes Glück; „Trauernden“ ist natürlich und inhaltlich offen.
