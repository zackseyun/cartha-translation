id: MAT.7.16
reference: Matthew 7:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: de
  text: An ihren Früchten werdet ihr sie erkennen.[a] Sammelt man etwa Trauben von Dornen oder Feigen von Disteln?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »An ihren Früchten werdet ihr sie kennen.«'
    reason: Lexikalische Alternative für ἐπιγνώσεσθε; „erkennen“ passt zum prüfenden Unterscheiden im Kontext, während „kennen“ ebenfalls möglich ist.
  - marker: b
    text: 'Die Frage erwartet eine verneinende Antwort: Von Dornen sammelt man keine Trauben und von Disteln keine Feigen.'
    reason: Die Funktion von μήτι wird erläutert, da die deutsche rhetorische Frage die erwartete Verneinung nur indirekt ausdrückt.
lexical_decisions:
- source_word: καρπῶν
  choice: Früchten
  rationale: Der ausdrückliche Plural wird beibehalten. Das konkrete Bild bleibt erhalten, ohne es auf Taten oder Ergebnisse einzuengen.
- source_word: ἐπιγνώσεσθε
  choice: werdet ihr … erkennen
  rationale: Das Futur bezeichnet hier das Erkennen anhand beobachtbarer Hinweise; „erkennen“ ist im Deutschen natürlich und kontextgerecht, ohne ein vollständiges Durchschauen zu behaupten.
- source_word: μήτι
  choice: etwa
  rationale: „Etwa“ kennzeichnet idiomatisch eine rhetorische Frage, auf die eine verneinende Antwort erwartet wird.
- source_word: συλλέγουσιν
  choice: Sammelt man
  rationale: Das unpersönliche „man“ gibt die allgemeine Aussage natürlich wieder; „sammeln“ bewahrt das landwirtschaftliche Bild.
- source_word: ἀκανθῶν
  choice: Dornen
  rationale: Die knappe Wiedergabe entspricht dem möglichen Sinn Dornen beziehungsweise Dorngewächse und erhält die Parallelität.
- source_word: σταφυλὰς
  choice: Trauben
  rationale: Direkte und im Deutschen idiomatische Bezeichnung der Frucht.
- source_word: τριβόλων
  choice: Disteln
  rationale: Das Wort bezeichnet eine stachlige Pflanze; „Disteln“ ist verständlich und bildet einen klaren Gegensatz zu essbaren Früchten.
- source_word: σῦκα
  choice: Feigen
  rationale: Direkte Wiedergabe des griechischen Plurals.
- source_word: αὐτῶν / αὐτούς
  choice: ihren / sie
  rationale: Die Pronomen beziehen sich auf die zuvor genannten Menschen, im Kontext die falschen Propheten; der persönliche Bezug bleibt erhalten.
theological_decisions:
- issue: Metaphorische Bedeutung der Früchte bei der Beurteilung von Menschen
  choice: Das Bild „Früchte“ wird unverändert beibehalten.
  alternative: „An ihren Taten“ oder „an den Ergebnissen, die sie hervorbringen“
  rationale: Der Text selbst deutet das Bild nicht ausdrücklich auf eine einzelne Art beobachtbarer Wirkung aus. Die konkrete Metapher bewahrt ihre theologische Spannung und ihre Verbindung zum folgenden Bild.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung „An ihren Früchten“ hebt wie die griechische Voranstellung das Erkennungsmerkmal hervor. „Sammelt man etwa“ klingt natürlich und bewahrt den allgemein gültigen Charakter der rhetorischen Frage.
