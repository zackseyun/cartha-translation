  source_fidelity: 'Der Entwurf gibt die Struktur und den Sinn des griechischen Textes genau wieder: Das vorangestellte »An ihren Früchten« entspricht der hervorgehobenen Präpositionalphrase ἀπὸ τῶν καρπῶν αὐτῶν; Futur und personaler Bezug in »werdet ihr sie erkennen« sind gewahrt. Die rhetorische Frage mit »etwa« vermittelt die durch μήτι erwartete negative Antwort, ohne sie in den Text hinein auszuschreiben. »Trauben«, »Dornen«, »Disteln« und »Feigen« folgen dem Bild und der Parallelität des Ausgangstextes.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und gut lesbar. »An ihren Früchten werdet ihr sie erkennen« ist idiomatisch und angemessen prägnant. »Sammelt man etwa Trauben von Dornen oder Feigen von Disteln?« ist eine natürliche rhetorische Frage; die unpersönliche Form »man« gibt den generischen Plural des Griechischen treffend wieder.
  terminology: »Früchte« bewahrt die absichtlich nicht eingeengte Metapher. »Erkennen« ist für ἐπιγνώσεσθε im Kontext der Unterscheidung treffend; die Fußnote nennt »kennen« transparent als mögliche, etwas weniger kontextuell präzise Alternative. Die Pflanzenterme sind verständlich, bildgetreu und ohne unnötige botanische Festlegung übersetzt.
