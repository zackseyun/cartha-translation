lexical_decisions:
- source_word: Μὴ
  choice: nicht
  rationale: Mit dem Präsensimperativ κρίνετε bildet μή ein Verbot; im Deutschen wird es idiomatisch durch die Verb-Erststellung mit „nicht“ wiedergegeben.
- source_word: κρίνετε
  choice: urteilt
  rationale: „Urteilen“ bewahrt die breite Bedeutung von κρίνω sowie die Wortverbindung mit κριθῆτε und legt den Sinn nicht vorschnell auf „verdammen“ fest.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck- beziehungsweise Folgezusammenhang des ἵνα-Satzes natürlich und prägnant wieder.
- source_word: μὴ
  choice: nicht
  rationale: Das zweite μή verneint den passiven Konjunktiv und wird direkt mit „nicht“ wiedergegeben.
- source_word: κριθῆτε
  choice: verurteilt werdet
  rationale: Die Passivform wird im Deutschen mit „verurteilt werdet“ idiomatisch wiedergegeben; der gemeinsame Wortstamm mit „urteilt“ erhält die rhetorische Wiederholung, während die Fußnote auf die mögliche engere Bedeutung „verdammen“ hinweist.
theological_decisions:
- issue: Reichweite von κρίνω in Jesu Verbot
  choice: Im Haupttext steht das breitere „urteilen“, ohne das Verbot auf jede Form moralischer Beurteilung oder ausschließlich auf Verdammung festzulegen.
  alternative: „Verdammt nicht, damit ihr nicht verdammt werdet.“
  rationale: Der Einzelvers bestimmt die genaue Reichweite des Urteilens noch nicht; der folgende Kontext entfaltet sie. Die breitere Wiedergabe bewahrt diese Spannung und vermeidet eine konfessionelle oder lehrmäßige Vorentscheidung.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die Verb-Erststellung formuliert ein natürliches Verbot; „ihr“ bildet den griechischen Plural ab.
