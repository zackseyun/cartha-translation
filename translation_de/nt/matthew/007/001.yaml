  footnotes:
  - marker: a
    text: 'Oder: „Verurteilt nicht, damit ihr nicht verurteilt werdet.“ Das griechische Verb kann je nach Zusammenhang auch „verurteilen“ bedeuten; „richten“ ist weiter gefasst und bewahrt die Wortwiederholung des Verses.'
