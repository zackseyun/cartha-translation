id: MAT.7.28
reference: Matthew 7:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: de
  text: 'Und es geschah: Als Jesus diese Worte[a] beendet hatte, staunten die Menschenmengen über seine Lehre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Aussprüche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Und es geschah, als
  rationale: Die erzählerische Übergangsformel und der anschließende Zeitsatz bleiben erkennbar, ohne auf die altertümliche deutsche Wendung „es begab sich“ zurückzugreifen.
- source_word: ἐτέλεσεν
  choice: beendet hatte
  rationale: Das Plusquamperfekt gibt im deutschen Zeitsatz natürlich wieder, dass Jesus die Rede zum Abschluss gebracht hatte.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: „Worte“ wahrt die Bedeutungsbreite von λόγοι und verweist ohne zusätzliche Deutung auf die unmittelbar vorausgehende Rede.
- source_word: ἐξεπλήσσοντο
  choice: waren … erstaunt
  rationale: Die Form beschreibt die anhaltende beziehungsweise gemeinsame Reaktion der Menschenmengen; „erstaunt“ gibt den starken Eindruck wieder, ohne eine bestimmte positive oder negative Wertung festzulegen.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Der Plural des griechischen Ausdrucks bleibt erhalten; zugleich ist die Bezeichnung in modernem Deutsch verständlich.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: über seine Lehre
  rationale: Bei ἐκπλήσσομαι bezeichnet ἐπί mit Dativ den Anlass des Erstaunens. „Über seine Lehre“ ist dafür eine natürliche deutsche Fügung.
theological_decisions:
- issue: Bezug von „diese Worte“
  choice: Die Formulierung verweist unmittelbar auf Jesu vorausgehende Rede, ohne sie mit einer späteren Überschrift zu benennen.
  alternative: „diese Aussprüche“ oder die deutende Erweiterung „diese Predigt“
  rationale: Der griechische Text nennt λόγοι und enthält keine Bezeichnung wie „Predigt“; die Übersetzung bewahrt daher den direkten, aber nicht weiter spezifizierten Rückverweis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Erzählformel bleibt sichtbar; der Doppelpunkt macht die im Griechischen geschichtete Konstruktion im Deutschen lesbar. Altertümliche Wendungen wie „es begab sich“ werden vermieden.
