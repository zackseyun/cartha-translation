  naturalness: 'Die Konstruktion mit Doppelpunkt und anschließendem Präteritum („… beendet hatte: Die Menschenmengen waren …“) ist verständlich, wirkt jedoch im modernen Standarddeutsch etwas schwerfällig. Eine Umstellung macht die geschichtete griechische Formel klarer und den Satz idiomatischer.'
