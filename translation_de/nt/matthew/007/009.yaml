  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: de
  text: Oder gibt es unter euch einen Mann, den sein Sohn um Brot bittet – wird er ihm etwa einen Stein geben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet wie im Griechischen eine weitere rhetorische Veranschaulichung im Gedankengang Jesu ein.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: gibt es unter euch einen Mann
  rationale: Gibt die partitive Wendung idiomatisch wieder und bewahrt mit „Mann“ die konkrete maskuline Einzahl des griechischen Beispiels.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον
  choice: den sein Sohn um Brot bittet
  rationale: „Jemanden um etwas bitten“ ist die natürliche deutsche Konstruktion. Das Präsens gibt die allgemein gedachte Beispielsituation idiomatisch wieder, obwohl das Griechische das Futur verwendet.
- source_word: μὴ
  choice: etwa
  rationale: Das in der rhetorischen Frage verwendete „etwa“ signalisiert die vom griechischen μή erwartete verneinende Antwort.
- source_word: λίθον ἐπιδώσει αὐτῷ
  choice: wird er ihm einen Stein geben
  rationale: Bewahrt das Futur und den scharfen Gegensatz zwischen Brot und Stein; „geben“ ist die natürliche Entsprechung von ἐπιδίδωμι in diesem Zusammenhang.
theological_decisions:
- issue: Generisch-maskuline Personenbezeichnung
  choice: einen Mann
  alternative: einen Menschen / jemanden
  rationale: ἄνθρωπος steht hier als maskuline Einzelperson in einem Beispiel und wird unmittelbar durch „sein Sohn“ näher bestimmt. „Mann“ bewahrt diese Form, ohne den repräsentativen Charakter auf Männer zu beschränken.
- issue: Rhetorische Frage mit erwarteter Verneinung
  choice: wird er ihm etwa einen Stein geben?
  alternative: er wird ihm doch keinen Stein geben
  rationale: Die Frageform des Ausgangstextes bleibt erhalten; „etwa“ macht die negative Antworterwartung deutlich, ohne sie als Aussage auszuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Gedankenstrich bildet den Übergang von der vorgestellten Situation zur eigentlichen rhetorischen Frage ab und vermeidet eine schwerfällige Verschachtelung.
