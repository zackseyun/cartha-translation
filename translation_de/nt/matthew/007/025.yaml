  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: de
  text: Und der Regen fiel herab, und die Flüsse[a] kamen, und die Winde wehten und schlugen gegen jenes Haus[b], und es stürzte nicht ein; denn es war auf den Felsen gegründet worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wasserströme.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: stürzten sich auf jenes Haus; das griechische Verb kann ein heftiges Anprallen oder Darüberherfallen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: der Regen fiel herab
  rationale: Gibt die Abwärtsbewegung von καταβαίνω mit dem Regen als Subjekt ausdrücklich und zugleich idiomatisch wieder.
- source_word: οἱ ποταμοί
  choice: die Wasserströme
  rationale: ποταμοί bedeutet wörtlich „Flüsse“. Im Unwetterzusammenhang bezeichnet „Wasserströme“ natürlich die heranströmenden Wassermassen, ohne sie eindeutig als Überschwemmung auszudeuten.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: die Winde wehten
  rationale: Direkte und natürliche Wiedergabe des Verbs πνέω mit den Winden als Subjekt.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: schlugen gegen jenes Haus
  rationale: Bewahrt die heftige Bewegung gegen das Haus; „schlugen gegen“ ist im Deutschen für die Wirkung des Sturms idiomatisch.
- source_word: οὐκ ἔπεσεν
  choice: es stürzte nicht ein
  rationale: Im Blick auf ein Haus gibt „einstürzen“ den Sinn von πίπτω natürlicher wieder als das wörtliche „fallen“, ohne die Aussage inhaltlich zu verstärken.
- source_word: τεθεμελίωτο
  choice: es war … gegründet
  rationale: 'Das Plusquamperfekt Passiv bezeichnet einen bereits hergestellten und fortbestehenden Zustand: Das Haus stand, weil es zuvor gegründet worden war.'
- source_word: ἐπὶ τὴν πέτραν
  choice: auf den Felsen
  rationale: Bewahrt das konkrete Bild von πέτρα und die Bestimmtheit des griechischen Artikels, ohne den Felsen innerhalb dieses Verses ausdrücklich theologisch zu identifizieren.
theological_decisions:
- issue: Das Gleichnisbild vom Fundament
  choice: auf den Felsen
  alternative: auf felsigem Grund
  rationale: „Auf den Felsen“ folgt der konkreten Bildsprache des griechischen Textes. Der Vers selbst identifiziert den Felsen nicht ausdrücklich; die Übersetzung lässt diese theologische Deutung daher offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholten Verknüpfungen mit „und“ spiegeln den vorwärtsdrängenden Satzbau des griechischen Textes; „doch“ verdeutlicht den sachlich vorhandenen Gegensatz, ohne ihn auszudeuten.
