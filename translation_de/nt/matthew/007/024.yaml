  variant: modern standard German
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: de
  text: Darum wird jeder, der diese meine Worte hört und sie tut, einem klugen Mann gleichen, der sein Haus auf den Felsen baute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird mit einem klugen Mann verglichen werden“ oder „wird einem klugen Mann gleichgemacht werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: 'Darum: Jeder, der'
  rationale: Πᾶς mit ὅστις hat distributiv-allgemeinen Sinn; „jeder, der“ gibt ihn natürlich wieder. „Darum“ bewahrt den folgernden Anschluss von οὖν an das Vorangehende.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: diese meine Worte hört
  rationale: „Worte“ ist eine direkte und verständliche Wiedergabe von λόγους; „diese meine“ erhält sowohl τούτους als auch den Genitiv μου.
- source_word: καὶ ποιεῖ αὐτούς
  choice: und sie tut
  rationale: ποιεῖ bezeichnet hier das Tun beziehungsweise Befolgen des Gehörten. Die knappe Form bewahrt die Parallelität von Hören und Tun.
- source_word: ὁμοιωθήσεται
  choice: wird … gleichen
  rationale: Die idiomatische deutsche Form gibt den zukünftigen passivischen Vergleich wieder, ohne ihn unnötig als ausdrücklichen Vergleichsakt festzulegen.
- source_word: ἀνδρὶ φρονίμῳ
  choice: einem klugen Mann
  rationale: ἀνήρ bezeichnet hier ausdrücklich einen Mann; φρόνιμος meint im Kontext klug, vernünftig beziehungsweise umsichtig. „Klug“ ist natürlich und traditionsnah.
- source_word: ᾠκοδόμησεν
  choice: baute
  rationale: Die einfache Vergangenheitsform gibt den Aorist im erzählenden Vergleich knapp und sachgerecht wieder.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: sein Haus
  rationale: „Sein Haus“ bewahrt den Besitzbezug und die konkrete Bau-Metapher.
- source_word: ἐπὶ τὴν πέτραν
  choice: auf den Felsen
  rationale: πέτρα bezeichnet festen Fels. „Auf den Felsen“ bewahrt das Bild, ohne mit „Felsgrund“ eine im Ausdruck nicht ausdrücklich genannte Fundamentdeutung einzutragen.
theological_decisions:
- issue: Geschlechtsspezifische Sprache im Vergleich
  choice: einem klugen Mann
  alternative: einem klugen Menschen
  rationale: Das Griechische verwendet ἀνήρ, das ausdrücklich einen Mann bezeichnet. Die allgemeine Geltung der Aussage wird bereits durch „Jeder, der“ ausgedrückt; deshalb bleibt die männliche Gestalt des Gleichnisses erhalten.
- issue: Verhältnis von Hören und Handeln
  choice: hört und sie tut
  alternative: hört und danach handelt
  rationale: Die direkte Form wahrt die Spannung und Parallelität des griechischen Textes, ohne das Tun bloß als lose Orientierung an Jesu Worten abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach „Darum“ macht den folgernden Übergang hörbar und vermeidet eine schwerfällige Satzöffnung. „Sie tut“ ist bewusst knapp und formal quellennah; „klug“ wirkt im heutigen Deutsch natürlicher als „weise“ oder „verständig“ für φρόνιμος.
