id: MAT.7.11
reference: Matthew 7:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: de
  text: Wenn nun ihr, die ihr böse seid, euren Kindern gute Gaben zu geben wisst, wie viel mehr wird euer Vater in den Himmeln[a] denen Gutes[b] geben, die ihn bitten!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „im Himmel“. Im Griechischen steht der Plural: „in den Himmeln“.'
    reason: lexical_alternative
  - marker: b
    text: Einige Übersetzungen geben hier „gute Gaben“ wieder; im Griechischen steht jedoch nur das substantivierte Wort „Gutes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: die ihr böse seid
  rationale: Die beschreibende Partizipialkonstruktion wird unmittelbar wiedergegeben. „Böse“ bewahrt die Schärfe des griechischen Ausdrucks, ohne ihn durch eine umfassendere Lehrformel auszudeuten.
- source_word: οἴδατε … διδόναι
  choice: zu geben wisst
  rationale: In Verbindung mit dem Infinitiv bezeichnet οἴδατε praktisches Wissen beziehungsweise die Fähigkeit, etwas zu tun; die deutsche Wendung ist knapp und idiomatisch.
- source_word: δόματα ἀγαθὰ
  choice: gute Gaben
  rationale: δόματα bezeichnet Gaben; ἀγαθὰ charakterisiert sie als gut. „Gaben“ ist hier würdevoll und weniger umgangssprachlich als „Geschenke“.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: euren Kindern
  rationale: τέκνα ist geschlechtsübergreifend und wird im Deutschen natürlich mit „Kinder“ wiedergegeben.
- source_word: πόσῳ μᾶλλον
  choice: wie viel mehr
  rationale: Die geläufige deutsche Vergleichsformel bildet den Schluss vom Geringeren auf das Größere klar ab.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: euer Vater in den Himmeln
  rationale: Die Formulierung bewahrt sowohl die Vaterbezeichnung als auch den lokativen, im Griechischen pluralischen Ausdruck „in den Himmeln“.
- source_word: δώσει ἀγαθὰ
  choice: wird … Gutes geben
  rationale: Da δόματα im zweiten Satzteil nicht wiederholt wird, gibt das substantivierte „Gutes“ das substantivisch gebrauchte ἀγαθὰ genauer wieder als „gute Gaben“.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: denen …, die ihn bitten
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein diejenigen, die ihn bitten; die Relativkonstruktion ist natürliches modernes Deutsch.
theological_decisions:
- issue: Anthropologische Aussage von πονηροὶ ὄντες
  choice: „die ihr böse seid“ unverändert beibehalten
  alternative: „obwohl ihr fehlerhaft/sündig seid“
  rationale: Jesu scharfer Gegensatz zwischen bösen Menschen und dem gebenden Vater bleibt bestehen, ohne zu einer weitergehenden anthropologischen Lehrformel ausgebaut oder zu bloßer Unvollkommenheit abgeschwächt zu werden.
- issue: Wiedergabe von ὁ ἐν τοῖς οὐρανοῖς
  choice: „in den Himmeln“
  alternative: „im Himmel“ oder „himmlischer Vater“
  rationale: Der Plural und die lokative Formulierung des Ausgangstextes werden sichtbar bewahrt; die traditionelle Singularform bleibt als verständliche Alternative in der Fußnote genannt.
- issue: Unterschied zwischen δόματα ἀγαθὰ und substantivischem ἀγαθὰ
  choice: zuerst „gute Gaben“, danach „Gutes“
  alternative: an beiden Stellen „gute Gaben“
  rationale: Die Unterscheidung folgt der tatsächlichen Wortwahl des griechischen Textes und vermeidet eine stillschweigende Angleichung der zweiten Aussage an die erste.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die Konstruktion „Wenn nun ihr, die ihr böse seid“ erhält den konditionalen Aufbau und die direkte Anrede; „Gaben“ und „Gutes“ bewahren den lexikalischen Unterschied beider Satzhälften.
