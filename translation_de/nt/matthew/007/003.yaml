id: MAT.7.3
reference: Matthew 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: de
  text: Warum aber siehst du den Splitter[a] im Auge deines Bruders[b], während du den Balken[c] in deinem eigenen Auge nicht bemerkst?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Halm“, „Spreu“ oder „kleiner Span“ für „Splitter“ (κάρφος).
    reason: lexical_alternative
  - marker: b
    text: Griechisch „Bruder“; der maskuline Singular des Ausgangstextes ist beibehalten.
    reason: lexical_alternative
  - marker: c
    text: Oder „Holzbalken“ oder „Pfosten“ für „Balken“ (δοκός).
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: warum
  rationale: In Verbindung mit βλέπεις ist τί idiomatisch kausal zu verstehen; „warum“ gibt die rhetorische Frage im Deutschen natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ setzt einen milden Gegensatz beziehungsweise Übergang zur vorausgehenden Mahnung und wird treffend mit „aber“ wiedergegeben.
- source_word: βλέπεις
  choice: siehst du
  rationale: „sehen“ bewahrt das konkrete Bild und unterscheidet sich sprachlich von κατανοεῖς.
- source_word: κάρφος
  choice: Splitter
  rationale: κάρφος bezeichnet ein kleines trockenes Teilchen, etwa einen Splitter, Halm oder Spreu. „Splitter“ ist im Deutschen für das Bild am Auge anschaulich und bildet einen klaren Gegensatz zum Balken.
- source_word: ἀδελφοῦ
  choice: deines Bruders
  rationale: Der griechische Ausdruck steht im maskulinen Singular; die Übersetzung bewahrt diese Form, ohne die allgemeine Anwendbarkeit des Spruchs einzuschränken.
- source_word: σῷ
  choice: deinem eigenen
  rationale: Das betonte Possessivpronomen wird mit „eigenen“ wiedergegeben und verstärkt den Gegensatz zum Auge des Bruders.
- source_word: δοκόν
  choice: Balken
  rationale: δοκός bezeichnet einen großen tragenden Holzbalken. „Balken“ bewahrt sowohl den architektonischen Sinn als auch die drastische Übertreibung.
- source_word: οὐ κατανοεῖς
  choice: nicht bemerkst
  rationale: κατανοέω kann ein aufmerksames Wahrnehmen oder Beachten bezeichnen. „nicht bemerkst“ klingt natürlich und erhält den Gegensatz zum bloßen Sehen.
- source_word: ὀφθαλμῷ
  choice: Auge
  rationale: „Auge“ ist die unmittelbare und idiomatische Entsprechung im konkreten Bild.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung ἀδελφοῦ
  choice: Bruder
  alternative: Bruder oder Schwester; Mitmensch
  rationale: Der Ausgangstext verwendet den maskulinen Singular. „Bruder“ gibt ihn formal genau wieder; der Kontext macht die Mahnung dennoch allgemein anwendbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte rhetorische Frage und der bildhafte, übertreibende Gegensatz zwischen Splitter und Balken bleiben erhalten. „Während“ gibt den inneren Kontrast der beiden Satzhälften flüssig wieder.
