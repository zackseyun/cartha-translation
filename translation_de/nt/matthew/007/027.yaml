  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: de
  text: Und der Regen fiel herab, und die Flüsse[a] kamen, und die Winde wehten und schlugen gegen jenes Haus; und es stürzte ein – und sein Einsturz war gewaltig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Fluten“. Das griechische Wort bedeutet wörtlich „Flüsse“, kann hier im Zusammenhang aber anschwellende Wasserläufe oder Flutwasser bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: der Regen fiel herab
  rationale: „Fiel herab“ gibt die Abwärtsbewegung von καταβαίνω wieder und ist im Deutschen in Verbindung mit Regen verständlich und würdig.
- source_word: ἦλθον οἱ ποταμοί
  choice: die Flüsse kamen
  rationale: ποταμοί bezeichnet wörtlich Flüsse bzw. Wasserläufe. Die ungewöhnliche, bildhafte Formulierung bleibt erhalten; die kontextuelle Deutung als Flutwasser wird in der Fußnote genannt.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: die Winde wehten
  rationale: Direkte und natürliche Wiedergabe des griechischen Ausdrucks.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: schlugen gegen jenes Haus
  rationale: Im Sturmzusammenhang bezeichnet προσκόπτω ein gewaltsames Auftreffen. „Schlugen gegen“ bewahrt sowohl die Richtung der Dativkonstruktion als auch die wiederholte Wucht.
- source_word: ἔπεσεν … ἡ πτῶσις αὐτῆς
  choice: stürzte es ein … sein Einsturz
  rationale: Bei einem Haus gibt „einstürzen“ die konkrete Bedeutung von πίπτω natürlich wieder; die Wortverwandtschaft zwischen Verb und Substantiv wird durch „einstürzte/Einsturz“ nachvollzogen.
- source_word: μεγάλη
  choice: gewaltig
  rationale: „Gewaltig“ vermittelt hier idiomatisch die Größe und Schwere des Einsturzes, ohne die Bildaussage theologisch auszudeuten.
theological_decisions:
- issue: Gerichtscharakter des abschließenden Bildes
  choice: Die Größe des Einsturzes wird eindringlich, aber ohne ausdrückliche Deutung als endzeitliches Gericht wiedergegeben.
  alternative: Den Einsturz als katastrophales oder ewiges Verderben ausdeuten.
  rationale: Der griechische Text schildert einen gewaltigen Fall des Hauses, benennt an dieser Stelle jedoch nicht ausdrücklich die weitergehende theologische Bedeutung.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem Erzählrhythmus. Die wiederholten καί-Verknüpfungen werden weitgehend durch „und“ bewahrt; vor dem Ergebnis setzt „Da“ einen im Deutschen natürlichen Übergang.
