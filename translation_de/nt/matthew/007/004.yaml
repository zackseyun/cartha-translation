  source_fidelity: 'Die Bildsprache ist insgesamt treffend wiedergegeben: »Splitter« und »Balken« bewahren den starken Gegensatz von κάρφος und δοκός, und »Lass mich … herausnehmen« gibt die bitteartige Aufforderung Ἄφες ἐκβάλω idiomatisch wieder. »Wie kannst du … sagen« schwächt jedoch den futurischen Indikativ ἐρεῖς zu einer Frage der Fähigkeit ab. »Wie wirst du … sagen« erhält die griechische Form und die rhetorische Herausforderung ohne unnatürlich zu wirken.'
