source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: de
  text: 'Oder wie wirst du zu deinem Bruder[a] sagen: »Lass mich den Splitter aus deinem Auge herausnehmen«, und sieh: Der Balken steckt in deinem eigenen Auge.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort steht im maskulinen Singular (»Bruder«), kann hier aber ein anderes Mitglied der Jüngergemeinschaft repräsentativ bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »und sieh: Der Balken ist in deinem Auge.«'
    reason: translation_note
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: Oder wie kannst du … sagen
  rationale: ἤ führt eine weitere rhetorische Alternative ein. Das wörtlichere »wirst du sagen« wäre im Deutschen missverständlich futurisch; »kannst du sagen« gibt die rhetorische Unmöglichkeit natürlich wieder.
- source_word: τῷ ἀδελφῷ σου
  choice: zu deinem Bruder
  rationale: Bewahrt den maskulinen Singular des griechischen Textes und die persönliche Anrede; eine mögliche repräsentative Verwendung wird in der Fußnote erläutert.
- source_word: Ἄφες ἐκβάλω
  choice: Lass mich … herausnehmen
  rationale: Der Imperativ ἄφες leitet idiomatisch eine Bitte um Erlaubnis ein; ἐκβάλω bezeichnet hier das Entfernen aus dem Auge.
- source_word: τὸ κάρφος
  choice: den Splitter
  rationale: κάρφος bezeichnet ein kleines trockenes Teilchen, etwa einen Splitter oder Halm. »Splitter« ist im Deutschen anschaulich und bildet einen deutlichen Kontrast zum Balken.
- source_word: καὶ ἰδοὺ
  choice: und sieh
  rationale: ἰδού lenkt nachdrücklich die Aufmerksamkeit auf den offenkundigen Gegensatz. »Sieh« wahrt diese Funktion in würdigem, verständlichem Deutsch.
- source_word: ἡ δοκὸς
  choice: der Balken
  rationale: δοκός bezeichnet einen großen Holzbalken; »Balken« ist lexikalisch genau und bewahrt die drastische Übertreibung.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: steckt in deinem eigenen Auge
  rationale: »Steckt« klingt bei einem Fremdkörper im Auge natürlicher als ein bloßes »ist«. »Eigenen« verdeutlicht den kontextuellen Kontrast, ohne den Sinn zu verändern.
theological_decisions:
- issue: Geschlecht und Bezug von ἀδελφῷ
  choice: Bruder
  alternative: Mitmensch; Bruder oder Schwester; Glaubensgeschwister
  rationale: Der Ausgangstext verwendet den maskulinen Singular. »Bruder« erhält diese konkrete Bildrede; die mögliche repräsentative Bedeutung wird nicht ausgeschlossen, sondern in einer Fußnote kenntlich gemacht.
- issue: Hyperbolischer Gegensatz κάρφος / δοκός
  choice: Splitter / Balken
  alternative: kleines Teilchen / Baumstamm; Splitter / Holzstück
  rationale: Die Wortwahl erhält die bewusst groteske Größenordnung und damit Jesu rhetorische Kritik, ohne sie abzuschwächen oder weiter auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Bildsprache und der starke Gegensatz bleiben erhalten; »sieh« gibt den Aufmerksamkeitsruf ἰδού knapper und näher am griechischen Ausdruck wieder als eine erklärende Umschreibung.
