  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: de
  text: Jeder Baum, der keine gute Frucht bringt, wird gefällt und ins Feuer geworfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Feuer ist ein Bild für Gericht. Der Vers selbst legt nicht genauer fest, ob dabei zeitliches oder endzeitliches Gericht oder beides im Vordergrund steht.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Jeder Baum
  rationale: πᾶν mit dem Singular δένδρον ist distributiv; „jeder Baum“ gibt die allgemeine, sprichwortartige Aussage natürlich und genau wieder.
- source_word: μὴ ποιοῦν
  choice: der ... nicht bringt
  rationale: Das präsentische Partizip beschreibt das kennzeichnende Tun des Baumes. Im Deutschen ist „Frucht bringen“ die natürliche feste Verbindung und entspricht dem Sinn von ποιέω in diesem Zusammenhang.
- source_word: καρπὸν καλὸν
  choice: gute Frucht
  rationale: καλός bezeichnet hier Frucht, die gut, brauchbar oder ihrem Zweck entsprechend ist. „Gute Frucht“ bewahrt zugleich die konkrete Bildsprache und ihre wertende Bedeutung.
- source_word: ἐκκόπτεται
  choice: wird gefällt
  rationale: Bei einem ganzen Baum ist „fällen“ die präzise und idiomatische deutsche Entsprechung für das passive ἐκκόπτεται.
- source_word: εἰς πῦρ βάλλεται
  choice: ins Feuer geworfen
  rationale: Die Formulierung bewahrt das Passiv und die durch εἰς ausgedrückte Bewegung hinein. Der bestimmte Artikel ist im Deutschen in diesem Bild idiomatisch, ohne die Art des Gerichts näher festzulegen.
theological_decisions:
- issue: Gerichtsbild des Feuers
  choice: Das Bild vom Fällen und Werfen ins Feuer bleibt ohne nähere Bestimmung des Feuers erhalten.
  alternative: Das Feuer ausdrücklich als zeitliches Gericht, endzeitliches Gericht oder Hölle bestimmen.
  rationale: Der Vers spricht deutlich von Gericht, legt aber für sich genommen weder dessen Zeitpunkt noch dessen genaue Gestalt fest. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Frucht bringen“ ist gegenüber dem wörtlicheren „Frucht hervorbringen“ natürlicher; eine zusätzliche lexikalische Fußnote ist deshalb nicht nötig. Der Fußnotenmarker steht unmittelbar nach dem Satzzeichen.
