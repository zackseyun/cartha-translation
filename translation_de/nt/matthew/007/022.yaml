source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: de
  text: 'Viele werden an jenem Tag zu mir sagen: »Herr, Herr, haben wir nicht in deinem Namen prophezeit, in deinem Namen Dämonen ausgetrieben und in deinem Namen viele Machttaten vollbracht?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »viele Wunder getan« beziehungsweise »viele Krafttaten vollbracht«. Das griechische Wort bezeichnet wörtlich »Kräfte« und wird in den Evangelien häufig für machtvolle, wunderbare Taten gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Viele
  rationale: Das substantivisch gebrauchte Adjektiv wird ohne den im Griechischen nicht ausdrücklich genannten Zusatz »Menschen« wiedergegeben.
- source_word: ἐροῦσίν μοι
  choice: werden zu mir sagen
  rationale: Gibt das Futur von λέγω mit Dativ direkt und in natürlichem Deutsch wieder.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: an jenem Tag
  rationale: Natürliche deutsche Zeitangabe; die eschatologische Bedeutung bleibt angedeutet, ohne »Tag des Gerichts« erklärend einzufügen.
- source_word: Κύριε κύριε
  choice: Herr, Herr
  rationale: Bewahrt die eindringliche Wiederholung sowie das gewöhnliche und christologisch gewichtige Äquivalent von κύριος.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: haben wir nicht ... prophetisch geredet
  rationale: Die verneinte Frage erwartet Zustimmung. »Prophetisch geredet« ist für heutige Leser klarer als das mögliche, aber weniger alltägliche »prophezeit«.
- source_word: τῷ σῷ ὀνόματι
  choice: in deinem Namen
  rationale: Die etablierte deutsche Wendung bezeichnet Handeln unter Berufung auf Namen und Autorität; die dreimalige Wiederholung wird zur Wahrung der rhetorischen Wirkung beibehalten.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: Dämonen ausgetrieben
  rationale: Natürliche und präzise Wiedergabe der in diesem Zusammenhang bezeichneten Austreibung.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: viele Machttaten vollbracht
  rationale: »Machttaten« bewahrt den Bezug von δυνάμεις auf wirksame Kraft, ohne die Bedeutung ausschließlich auf Wunder festzulegen; »vollbracht« ergibt idiomatisches Deutsch.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Jesu
  choice: Herr
  alternative: Meister
  rationale: »Herr« bewahrt sowohl den gewöhnlichen Titelsinn als auch das christologische Gewicht, ohne über den griechischen Ausdruck hinauszugehen.
- issue: Eschatologische Bedeutung von ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: an jenem Tag
  alternative: am Tag des Gerichts
  rationale: Der Zusammenhang weist auf das endzeitliche Gericht, doch der Ausgangstext nennt lediglich »jenen Tag«; diese Spannung bleibt erhalten.
- issue: Bedeutungsumfang von δυνάμεις
  choice: Machttaten
  alternative: Wunder
  rationale: Der Ausdruck kann im Evangelienkontext Wunder bezeichnen, hebt lexikalisch aber die wirksame Macht hervor. »Machttaten« vermeidet eine unnötige Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von »in deinem Namen« und die doppelte Anrede »Herr, Herr« bleiben als prägende rhetorische Elemente erhalten.
