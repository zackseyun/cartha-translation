id: MAT.7.15
reference: Matthew 7:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: de
  text: Nehmt euch vor den falschen Propheten in Acht, die in Schafskleidern zu euch kommen, innerlich aber reißende Wölfe sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Nehmt euch vor … in Acht
  rationale: Der präsentische Imperativ fordert zu anhaltender Wachsamkeit auf; die deutsche Wendung gibt zusammen mit „vor“ die Warnfunktion natürlich und präzise wieder.
- source_word: ψευδοπροφητῶν
  choice: falschen Propheten
  rationale: Die etablierte deutsche Wiedergabe bezeichnet Menschen, die zu Unrecht prophetische Autorität beanspruchen oder als Propheten Falsches verkünden, ohne dies auf spätere kirchliche Kategorien zu verengen.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: die … zu euch kommen
  rationale: Die Relativkonstruktion beschreibt die betreffenden Menschen näher; die schlichte Wiedergabe ist im Deutschen natürlich und bewahrt den präsentischen Sinn.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: in Schafskleidern
  rationale: Die bildhafte, im Deutschen verständliche Wendung bewahrt das Motiv einer täuschenden äußeren Erscheinung und bleibt näher an „Kleidern“ als das stärker idiomatisierte „im Schafspelz“.
- source_word: ἔσωθεν δέ
  choice: innerlich aber
  rationale: Die Formulierung erhält den deutlichen Gegensatz zwischen äußerem Auftreten und innerer Wirklichkeit.
- source_word: λύκοι ἅρπαγες
  choice: reißende Wölfe
  rationale: „Reißend“ bezeichnet im Deutschen treffend räuberische, gefährliche Tiere und gibt die zerstörerische, erbeutende Bedeutung von ἅρπαγες anschaulich wieder.
theological_decisions:
- issue: Art der Warnung vor täuschenden religiösen Verkündigern
  choice: Das Bild wird unmittelbar als Warnung vor falschen Propheten wiedergegeben.
  alternative: Die Aussage ausdrücklich auf Irrlehrer oder auf eine bestimmte spätere kirchliche Gruppe beziehen.
  rationale: Der griechische Text warnt allgemein vor falschen Propheten und stellt äußeren Anschein und innere Wirklichkeit gegenüber. Eine konfessionelle oder institutionelle Eingrenzung wäre nicht im Wortlaut begründet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die traditionelle Bildsprache bleibt erhalten; „reißende Wölfe“ wirkt kräftig und natürlich, ohne den Sinn durch zusätzliche Deutung festzulegen.
