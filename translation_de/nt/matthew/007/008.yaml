source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: de
  text: Denn jeder, der bittet, empfängt; und wer sucht, findet; und wer anklopft, dem wird geöffnet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und dem Anklopfenden wird geöffnet werden“. Eine „Tür“ wird im Griechischen nicht ausdrücklich genannt, ist aber durch das Bild vorausgesetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: jeder
  rationale: Substantivisch gebraucht und mit dem Partizip verbunden; „jeder, der …“ gibt den allgemeinen, umfassenden Sinn in natürlichem Deutsch wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende Verbindung zur vorausgehenden Aufforderung.
- source_word: ὁ αἰτῶν
  choice: der bittet
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein den Bittenden; der Relativsatz ist im Deutschen natürlich und bewahrt den generellen Aspekt.
- source_word: λαμβάνει
  choice: empfängt
  rationale: Gibt λαμβάνω präzise und würdig wieder und passt zum Gedanken des Bittens besser als das umgangssprachlichere „bekommt“.
- source_word: ὁ ζητῶν
  choice: wer sucht
  rationale: Bewahrt die allgemeine Aussage und den einprägsamen Parallelismus in idiomatischem Deutsch.
- source_word: εὑρίσκει
  choice: findet
  rationale: Die schlichte, kontextgemäße Entsprechung erhält die Prägnanz des griechischen Satzes.
- source_word: τῷ κρούοντι
  choice: wer anklopft, dem
  rationale: Die deutsche Korrelativkonstruktion bildet den Dativ des substantivierten Partizips natürlich ab und führt passend zum Passiv „wird geöffnet“.
- source_word: ἀνοιγήσεται
  choice: wird geöffnet
  rationale: Bewahrt das Futur Passiv und fügt kein im Griechischen ausdrücklich ungenanntes Objekt wie „die Tür“ hinzu.
theological_decisions:
- issue: Reichweite und Aussagekraft der Verheißung
  choice: Eine allgemein und umfassend formulierte Zusicherung, ohne eine kontextlose Garantie jeder einzelnen Bitte in die Übersetzung hineinzulesen.
  alternative: Eine uneingeschränkte Garantie, dass jede konkrete Bitte genau wie erbeten erfüllt wird, oder eine ausdrücklich auf bestimmte geistliche Bitten begrenzte Zusage.
  rationale: Der griechische Text spricht allgemein von jedem, der bittet, sucht und anklopft. Die Übersetzung gibt diese Weite direkt wieder, ohne eine theologische Einschränkung hinzuzufügen oder die Aussage über ihren Kontext hinaus festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, einprägsamem Rhythmus. Die dreigliedrige Parallelstruktur bleibt erhalten; Semikolons verdeutlichen die Gliederung. Der Haupttext vermeidet die Ergänzung „die Tür“, um die grammatische Offenheit des griechischen Passivs zu bewahren.
