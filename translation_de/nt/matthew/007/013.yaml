  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: de
  text: Geht durch das enge Tor! Denn weit ist das Tor und breit der Weg, der ins Verderben führt,[a] und viele sind es, die durch dieses Tor gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Untergang“ beziehungsweise „in die Vernichtung“. Das griechische Wort kann Verderben, Untergang oder Vernichtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Geht … hinein
  rationale: Der Aorist-Imperativ in der 2. Person Plural wird als unmittelbare Aufforderung wiedergegeben; mit „durch … hineingehen“ klingt die Bewegung durch ein Tor im Deutschen natürlich.
- source_word: διὰ τῆς στενῆς πύλης
  choice: durch das enge Tor
  rationale: διά mit Genitiv bezeichnet hier die Bewegung durch etwas hindurch. „Eng“ bildet den räumlichen Gegensatz zu „weit“ und „geräumig“ klar ab.
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Aufforderung knapp und idiomatisch ein.
- source_word: πλατεῖα ἡ πύλη
  choice: weit ist das Tor
  rationale: „Weit“ ist bei einer Toröffnung natürlich und bewahrt durch die Voranstellung des Adjektivs die Hervorhebung des griechischen Satzes.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: geräumig der Weg
  rationale: εὐρύχωρος bezeichnet etwas Weites oder Geräumiges. „Geräumig“ wahrt die Bedeutung und den Kontrast zum engen Tor; „Weg“ erhält zugleich das im Deutschen geläufige Wegmotiv.
- source_word: ἡ ἀπάγουσα
  choice: der … führt
  rationale: Das substantivbezogene Präsenspartizip wird idiomatisch als Relativsatz wiedergegeben und behält die Zielrichtung bei.
- source_word: εἰς τὴν ἀπώλειαν
  choice: ins Verderben
  rationale: „Verderben“ kann wie ἀπώλεια den Untergang beziehungsweise das vernichtende Ende bezeichnen, ohne dessen volle theologische Ausgestaltung festzulegen.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: viele sind es, die durch dieses Tor hineingehen
  rationale: Die Formulierung erhält die Betonung auf „viele“. Das feminine αὐτῆς bezieht sich grammatisch am plausibelsten auf πύλη; „dieses Tor“ macht den Bezug im Deutschen verständlich, da ein bloßes „dadurch“ nach dem näher stehenden „Weg“ missverständlich wäre.
theological_decisions:
- issue: Bedeutungsumfang von ἀπώλεια in Jesu Warnung
  choice: Verderben
  alternative: Untergang; Vernichtung
  rationale: Der Ausdruck bezeichnet ein verhängnisvolles Ende, legt aber in diesem Vers dessen vollständige theologische Art nicht ausdrücklich fest. „Verderben“ bewahrt Ernst und Offenheit der Aussage.
- issue: Bezug von αὐτῆς im Schlusssatz
  choice: dieses Tor
  alternative: dadurch
  rationale: Das feminine Pronomen stimmt mit πύλη überein und die Präposition beschreibt das Hindurchgehen durch ein Tor. Die Explizierung vermeidet im Deutschen einen irreführenden Bezug auf den unmittelbar zuvor genannten Weg, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wortstellung „weit ist das Tor und geräumig der Weg“ spiegelt die Hervorhebung und den Parallelismus des griechischen Textes, ohne altertümlich zu wirken.
