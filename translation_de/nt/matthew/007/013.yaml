  timestamp: '2026-07-14T19:41:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zuverlässig wiedergegeben: Der Imperativ fordert zum Eintritt durch das enge Tor auf; die Gegenüberstellung von weitem Tor und weitläufigem Weg, die Zielangabe „ins Verderben“ sowie die Betonung, dass viele durch das betreffende Tor eintreten, entsprechen dem griechischen Text. Die explizite Wiederaufnahme „dieses Tor“ ist eine zulässige verdeutlichende Wiedergabe von δι’ αὐτῆς und verhindert einen missverständlichen deutschen Bezug auf „Weg“.'
  naturalness: „Geräumig der Weg“ ist im modernen Standarddeutsch für einen Weg deutlich weniger idiomatisch als „breit der Weg“ und klingt zudem wegen der fehlenden Wiederholung von „ist“ unnötig elliptisch. „Durch das enge Tor hinein“ verdoppelt die durch „durch“ bereits ausgedrückte Bewegungsrichtung. Die Revision bewahrt die knappe, würdige Satzführung, klingt jedoch natürlicher.
  terminology: „Tor“, „Weg“ und „Verderben“ sind treffend. „Verderben“ lässt den Bedeutungsspielraum von ἀπώλεια offen und legt keine bestimmte dogmatische Ausgestaltung fest. „Breit“ gibt εὐρύχωρος bei einem Weg idiomatisch und im Gegensatz zu „weit“ für πλατεῖα angemessen wieder.
  issues:
