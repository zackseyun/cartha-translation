revisions:
- from: Geht durch das enge Tor hinein! Denn weit ist das Tor und geräumig der Weg, der ins Verderben führt,[a] und viele sind es, die durch dieses Tor hineingehen.
  to: Geht durch das enge Tor! Denn weit ist das Tor und breit der Weg, der ins Verderben führt,[a] und viele sind es, die durch dieses Tor gehen.
  rationale: Die Revision ersetzt die bei „Weg“ unidiomatische Formulierung „geräumig“ durch „breit“ und entfernt das redundante „hinein“ im Eingangsimperativ. Bedeutung, rhetorischer Parallelismus, der offene Sinn von ἀπώλεια und die eindeutige Bezugnahme des Schlusssatzes auf das Tor bleiben erhalten.
