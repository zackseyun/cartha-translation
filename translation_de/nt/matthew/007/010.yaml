  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: de
  text: Oder wenn er um einen Fisch bittet – wird er ihm etwa eine Schlange geben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Oder wenn
  rationale: Leitet das zweite Beispiel der parallelen rhetorischen Folge ein. „Oder wenn“ ist im Deutschen natürlich; καί muss hier nicht eigens mit „auch“ wiedergegeben werden.
- source_word: ἰχθὺν
  choice: einen Fisch
  rationale: Der Akkusativ Singular bezeichnet im häuslichen Nahrungskontext gewöhnlich einen Fisch.
- source_word: αἰτήσει
  choice: bittet
  rationale: Das griechische Futur steht in einem allgemein formulierten, bedingungsähnlichen Beispiel. Das deutsche Präsens gibt diesen Sinn idiomatisch wieder; „um … bitten“ bildet zudem das erbetene Gut klar ab.
- source_word: μὴ
  choice: etwa … geben?
  rationale: μή kennzeichnet eine Frage, auf die eine verneinende Antwort erwartet wird. Das Modalpartikel „etwa“ vermittelt diese rhetorische Erwartung im natürlichen Deutschen.
- source_word: ὄφιν
  choice: eine Schlange
  rationale: „Schlange“ ist die gewöhnliche moderne deutsche Bezeichnung; „Serpent“ wäre im heutigen Standarddeutsch unpassend und „Schlangentier“ unnötig umständlich.
- source_word: ἐπιδώσει
  choice: geben
  rationale: Das Verb bedeutet hier, jemandem etwas zu geben oder auszuhändigen. „Geben“ ist im Vater-Kind-Vergleich die klarste natürliche Entsprechung.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet den Empfänger und wird direkt mit „ihm“ wiedergegeben.
theological_decisions:
- issue: Rhetorische Kraft der Frage
  choice: Als Frage mit „etwa“ formuliert, die eine verneinende Antwort erwartet.
  alternative: Als bloße Aussage „wird er ihm keine Schlange geben“ oder mit „doch nicht“ wiedergeben.
  rationale: Das μή in der direkten Frage signalisiert, dass die Antwort „nein“ erwartet wird. „Etwa“ bewahrt diese argumentative Kraft, ohne die Aussage in eine Feststellung umzuwandeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bewahrt den scharfen Übergang von der Bedingung zur rhetorischen Frage. Keine Fußnote ist nötig, da „Schlange“ die eindeutige und natürliche deutsche Entsprechung ist.
