source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: de
  text: Bittet[a], und es wird euch gegeben werden; sucht, und ihr werdet finden; klopft an, und es wird euch geöffnet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Präsensimperative können auch einen fortdauernden Sinn haben: „Bittet weiter … sucht weiter … klopft weiter an.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Bittet
  rationale: Präsens Aktiv Imperativ, 2. Person Plural. „Bittet“ gibt den Aufforderungscharakter natürlich und präzise wieder; ein fortdauernder Sinn ist möglich, wird aber nicht in den Haupttext hineingedeutet.
- source_word: δοθήσεται
  choice: wird euch gegeben werden
  rationale: Das Futur Passiv von δίδωμι wird als Passiv bewahrt. Der Handelnde bleibt wie im Griechischen unausgesprochen.
- source_word: ζητεῖτε
  choice: sucht
  rationale: Der Imperativ „sucht“ wahrt die knappe, gehobene und zugleich allgemein verständliche Ausdrucksweise sowie die mögliche wörtliche und übertragene Bedeutung.
- source_word: εὑρήσετε
  choice: werdet ihr finden
  rationale: Das Futur Aktiv wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: κρούετε
  choice: klopft an
  rationale: Für das Klopfen an einer Tür ist „anklopfen“ im Deutschen idiomatisch; die trennbare Imperativform lautet „klopft an“.
- source_word: ἀνοιγήσεται
  choice: wird euch geöffnet werden
  rationale: Das griechische Futur Passiv wird ausdrücklich bewahrt; der unausgesprochene Öffnende wird nicht ergänzt.
- source_word: καὶ
  choice: dann
  rationale: Im Deutschen macht „dann“ die enge Folgebeziehung der parallel gebauten Aufforderungs- und Zusagesätze idiomatisch deutlich. Es dient hier als natürliche Wiedergabe des koordinierenden καί, ohne eine zusätzliche Bedingung einzuführen.
theological_decisions:
- issue: Aspekt der drei Präsensimperative
  choice: Einfache Imperative („Bittet“, „sucht“, „klopft an“) im Haupttext; Hinweis auf möglichen fortdauernden Sinn in der Fußnote.
  alternative: „Bittet immer weiter … sucht immer weiter … klopft immer weiter an.“
  rationale: Die griechischen Präsensimperative können fortdauerndes oder wiederholtes Handeln nahelegen, erzwingen aber keine ausdrückliche iterative Umschreibung. So bleibt die aspektuelle Offenheit erhalten.
- issue: Unausgesprochener Handelnder in den Passivformen
  choice: Die Passivformen bleiben ohne ausdrückliches Subjekt stehen.
  alternative: „Gott wird euch geben“ beziehungsweise „Gott wird euch öffnen“.
  rationale: Die Passivformen können als Umschreibung göttlichen Handelns verstanden werden, doch der griechische Text nennt Gott hier nicht ausdrücklich. Die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper Dreierstruktur. Die Wiederholung und der parallele Rhythmus des griechischen Satzes bleiben erkennbar; die Passivkonstruktionen werden beibehalten.
