id: MAT.7.18
reference: Matthew 7:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: de
  text: Ein guter Baum kann keine schlechten Früchte hervorbringen und ein fauler Baum keine guten Früchte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: ein guter Baum
  rationale: ἀγαθός bedeutet hier grundlegend »gut«. Die Wiedergabe bewahrt sowohl das konkrete Bild als auch dessen wertende Aussage, ohne es mit »gesund« vorschnell auszudeuten.
- source_word: οὐ δύναται ... ποιεῖν
  choice: kann ... nicht hervorbringen
  rationale: δύναται bezeichnet Fähigkeit beziehungsweise Möglichkeit; die Verneinung formuliert eine Unmöglichkeit. ποιεῖν mit καρπούς bedeutet in diesem Bild, Früchte hervorzubringen.
- source_word: καρποὺς πονηρούς
  choice: schlechte Früchte
  rationale: πονηρός kann »schlecht«, »böse« oder »verderblich« bedeuten. Bei Früchten ist »schlecht« natürlich und wahrt zugleich die negative Wertung.
- source_word: οὐδέ
  choice: und ... keine
  rationale: οὐδέ verbindet die zweite, parallele Verneinung mit der ersten. Die deutsche Koordination mit »und« und erneutem »keine« gibt die ausgewogene Gegenüberstellung natürlich wieder.
- source_word: δένδρον σαπρόν
  choice: ein fauler Baum
  rationale: σαπρός bezeichnet etwas Verfaultes, Verdorbenes oder Unbrauchbares. »Fauler Baum« ist im Deutschen ein anschaulicher und idiomatischer Gegenpol zum guten Baum.
- source_word: καρποὺς καλούς
  choice: gute Früchte
  rationale: καλός bezeichnet hier Früchte von guter Qualität. »Gute Früchte« bildet den klaren Gegensatz zu »schlechten Früchten« und bewahrt den Parallelismus.
theological_decisions:
- issue: Art der Unmöglichkeit im Bildwort
  choice: Die Aussage wird kategorisch mit »kann ... keine« wiedergegeben.
  alternative: »bringt gewöhnlich keine hervor« oder »soll keine hervorbringen«
  rationale: οὐ δύναται drückt Unfähigkeit beziehungsweise Unmöglichkeit aus, nicht bloß eine geringe Wahrscheinlichkeit oder eine Forderung. Weitergehende dogmatische Folgerungen werden nicht in den Text eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der bildhafte Parallelismus bleibt erhalten; auf unnötige Erläuterungen im Vers wird verzichtet.
