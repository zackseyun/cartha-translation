  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: de
  text: Darum[a] werdet ihr sie an ihren Früchten erkennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Also werdet ihr sie an ihren Früchten erkennen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα γε
  choice: Daran also
  rationale: ἄρα γε zieht mit leichter Bekräftigung eine Folgerung. Zusammen mit der vorangestellten Präpositionalphrase gibt „Daran also“ diesen Schluss im Deutschen natürlich wieder.
- source_word: ἀπὸ
  choice: an
  rationale: Bei ἐπιγινώσκω bezeichnet ἀπό die Grundlage, anhand deren die betreffenden Menschen erkannt werden. Deutsch verwendet dafür idiomatisch „an“.
- source_word: καρπῶν
  choice: Früchten
  rationale: Der ausdrückliche Plural und das Bild des griechischen Textes bleiben erhalten.
- source_word: αὐτῶν
  choice: ihren
  rationale: Das Genitivattribut wird im Deutschen natürlich durch das Possessivpronomen „ihren“ wiedergegeben.
- source_word: ἐπιγνώσεσθε
  choice: werdet ihr erkennen
  rationale: Die Futurform bezeichnet hier das Identifizieren oder Erkennen von Menschen anhand beobachtbarer Merkmale; „erkennen“ trifft diesen Sinn ohne eine übersteigerte Bedeutung von vollständiger Erkenntnis.
- source_word: αὐτούς
  choice: sie
  rationale: Das Akkusativpronomen verweist auf die zuvor genannten Menschen und wird direkt mit „sie“ wiedergegeben.
theological_decisions:
- issue: Bildlicher Gebrauch von „Früchten“ zur Beurteilung von Menschen
  choice: Das Bild „Früchte“ bleibt erhalten.
  alternative: ihre Taten; ihre Ergebnisse
  rationale: Der Zusammenhang weist auf beobachtbare Auswirkungen hin, legt diese aber bildhaft als Früchte dar. Die Beibehaltung des Bildes wahrt den Zusammenhang und vermeidet eine unnötige inhaltliche Verengung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wortstellung hebt die Erkenntnisgrundlage hervor und bewahrt zugleich den folgernden Charakter von ἄρα γε.
