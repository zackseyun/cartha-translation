source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: de
  text: Gebt das Heilige nicht den Hunden, und werft eure Perlen nicht vor die Schweine; sonst könnten sie diese mit ihren Füßen zertreten, sich gegen euch wenden und euch zerreißen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: das Heilige
  rationale: Das substantivierte Neutrum bleibt bewusst allgemein und legt nicht fest, ob heilige Lehre, Geweihtes oder etwas anderes gemeint ist.
- source_word: τοῖς κυσίν
  choice: den Hunden
  rationale: Die direkte Wiedergabe erhält die scharfe und kulturell anstößige Bildsprache.
- source_word: βάλητε
  choice: werft
  rationale: „Werfen“ ist die natürliche moderne Entsprechung von βάλλω und bewahrt die konkrete Bildlichkeit.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: eure Perlen
  rationale: Die gebräuchliche lexikalische Bedeutung und das Possessivpronomen werden unmittelbar wiedergegeben.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: vor die Schweine
  rationale: Die im Deutschen feststehende und zugleich quellengerechte Wendung gibt die räumliche Beziehung natürlich wieder.
- source_word: μήποτε
  choice: damit … nicht
  rationale: Die Konstruktion drückt hier eine warnende negative Folge beziehungsweise Absicht aus; „damit … nicht“ ist im modernen Deutsch klar und natürlich.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: sie sie nicht mit ihren Füßen zertreten
  rationale: „Zertreten“ erfasst die Intensität des Verbs; „mit ihren Füßen“ gibt die ausdrückliche griechische Präpositionalphrase wieder.
- source_word: στραφέντες
  choice: sich dann gegen euch wenden
  rationale: Das Partizip bezeichnet eine Wendung vor dem Angriff. „Dann“ macht die Abfolge idiomatisch deutlich, ohne eine zusätzliche Deutung einzuführen.
- source_word: ῥήξωσιν ὑμᾶς
  choice: euch zerreißen
  rationale: „Zerreißen“ bewahrt die gewaltsame Bedeutung des Verbs und die Härte des Bildes.
theological_decisions:
- issue: Deutung des Heiligen, der Hunde, der Perlen und der Schweine
  choice: Die Metaphern bleiben ohne erklärende Ausdeutung stehen.
  alternative: „Das Heilige“ als heilige Lehre oder Reich-Gottes-Botschaft und „Hunde“ beziehungsweise „Schweine“ ausdrücklich als feindselige oder gottlose Menschen bestimmen.
  rationale: Der Vers selbst identifiziert die einzelnen Bildelemente nicht eindeutig. Eine unaufgelöste Wiedergabe bewahrt seine genuine Offenheit und theologische Spannung.
- issue: Bezug der beiden drohenden Handlungen
  choice: 'Beide Handlungen werden als fortlaufende Warnung derselben Bildszene wiedergegeben: zertreten, sich wenden, zerreißen.'
  alternative: Die beiden Verben stärker auf verschiedene Tiergruppen verteilen oder die Syntax erklärend umstellen.
  rationale: Der griechische Satz lässt die drastische Abfolge stehen, ohne die Rollen der Hunde und Schweine ausdrücklich einzeln zuzuweisen. Die Übersetzung vermeidet eine künstliche Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Bildsprache. Die traditionelle Wendung „Perlen vor die Schweine“ bleibt erhalten, ohne altertümliche Wörter zu verwenden. Das pluralische „euch“ entspricht ὑμᾶς.
