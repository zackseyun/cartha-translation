  source_fidelity: 'Die zentralen Bilder und die Abfolge sind treffend wiedergegeben: „das Heilige“, Hunde, Perlen, Schweine, Zertreten und das anschließende Sichwenden und Zerreißen. Die Metaphern werden zu Recht nicht ausgedeutet. Die finale Warnung mit μήποτε ist jedoch im Deutschen als Folgewarnung idiomatischer mit „sonst“ wiederzugeben als mit der eher zweckbezogenen Konstruktion „damit ... nicht“.'
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Standarddeutsch. Die Folge „damit sie sie nicht“ ist zwar verständlich, wirkt wegen der doppelten Pronomina und der Zwecklesart jedoch unnötig schwerfällig. „Sonst könnten sie diese ...“ ist klarer und erhält den warnend-möglichen Charakter der griechischen Konstruktion.
  terminology: „Das Heilige“, „Hunde“, „Perlen“, „Schweine“ und „zerreißen“ sind angemessen, quellennah und im heutigen Deutsch verständlich. „Diese“ verdeutlicht ohne interpretative Erweiterung, dass die Perlen zertreten werden.
