    rationale: Die griechische Partikel leitet eine Warnung vor einer möglichen Folge ein („damit nicht / sonst nicht etwa“). Im Deutschen kann „damit“ zu stark nach einer beabsichtigten Verhinderung klingen; „sonst könnten“ bildet die Warnfolge natürlicher und modal angemessen ab.
  - severity: low
    issue: Doppelte Pronomenfolge „sie sie“
    rationale: Sie ist grammatisch möglich, aber stilistisch schwerfällig und kurzfristig mehrdeutig. Das Demonstrativpronomen „diese“ stellt den Bezug auf die Perlen klar, ohne den Sinn zu verändern.
  revised_text: Gebt das Heilige nicht den Hunden, und werft eure Perlen nicht vor die Schweine; sonst könnten sie diese mit ihren Füßen zertreten, sich gegen euch wenden und euch zerreißen.
