  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: de
  text: Denn mit dem Urteil, mit dem ihr urteilt, werdet ihr beurteilt werden; und mit dem Maß, mit dem ihr messt, wird euch zugemessen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: Es wird euch nach demselben Maß zugemessen werden. „Nach demselben Maß“ steht nicht ausdrücklich im Griechischen, ist durch den wechselseitigen Sinn jedoch nahegelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: Urteil / urteilt / beurteilt werden
  rationale: Die Wortwahl bewahrt so weit wie im Deutschen natürlich möglich die griechische Wiederholung des Wortstamms und lässt offen, ob das Urteilen hier allgemein bewerten oder im engeren Sinn verurteilen bedeutet.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: Maß / messt / zugemessen werden
  rationale: Die Formulierung erhält das Bild des Messens und den sprichwörtlichen Parallelismus. „Zugemessen“ gibt das passive Verb mit dem Dativ ὑμῖν in natürlichem Deutsch wieder.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: mit dem ... mit dem
  rationale: Die wiederholte Wendung bezeichnet das Mittel beziehungsweise den angewandten Maßstab. Die parallele Wiedergabe mit „mit dem“ bildet die Struktur des griechischen Satzes nach.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ kennzeichnet knapp den begründenden Anschluss an das vorausgehende Verbot in Matthäus 7,1.
- source_word: μετρηθήσεται ὑμῖν
  choice: wird euch zugemessen werden
  rationale: Der Dativ ὑμῖν wird ausdrücklich mit „euch“ wiedergegeben. Ein „zurück“ ist sinngemäß möglich, steht aber nicht ausdrücklich im griechischen Text.
theological_decisions:
- issue: Urheber des erwidernden Urteils
  choice: Das Passiv bleibt ohne genannten Handelnden.
  alternative: 'Gott wird euch nach demselben Maßstab richten; oder: Andere werden euch ebenso beurteilen.'
  rationale: Der griechische Text nennt den Handelnden nicht. Die Übersetzung bewahrt daher die Offenheit zwischen göttlichem Gericht und einer allgemein entsprechenden Gegenreaktion.
- issue: Bedeutungsumfang von κρίνω
  choice: urteilen / beurteilt werden
  alternative: verurteilen / verurteilt werden
  rationale: „Verurteilen“ würde den möglichen Sinn unnötig auf eine negative Verdammung einengen. Die allgemeinere Wiedergabe erhält die Spannung des Zusammenhangs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bewusst parallele Satzbau folgt der pointierten, sprichwörtlichen Form des griechischen Textes; „mit dem Urteil, mit dem ihr urteilt“ ist leicht markiert, bewahrt aber die zentrale Wortwiederholung.
