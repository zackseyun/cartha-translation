id: MAT.7.14
reference: Matthew 7:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: de
  text: Denn eng ist das Tor, und eingeengt ist der Weg, der zum Leben führt, und nur wenige finden ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl räumliche Einengung als auch Bedrängnis oder Beschwerlichkeit bezeichnen.
    reason: Sichert den über die Hauptfassung hinausgehenden Bedeutungsumfang von τεθλιμμένη, ohne die bildhafte Aussage einseitig auf bloße Schwierigkeit festzulegen.
lexical_decisions:
- source_word: στενή
  choice: eng
  rationale: Gibt die räumliche Enge des Tores knapp und unmittelbar wieder.
- source_word: τεθλιμμένη
  choice: bedrängt
  rationale: Bewahrt das Bild eines zusammengedrängten beziehungsweise von Bedrängnis geprägten Weges und vermeidet, die Aussage lediglich zum allgemeinen »schwer« abzuschwächen.
- source_word: ἀπάγουσα
  choice: der … führt
  rationale: Natürliche deutsche Wiedergabe des Partizips mit erhaltenem Zielbezug.
- source_word: ζωήν
  choice: Leben
  rationale: Entspricht dem theologischen und bildhaften Zielbegriff des griechischen Textes, ohne ihn näher auszudeuten.
- source_word: ὀλίγοι … οἱ εὑρίσκοντες
  choice: nur wenige finden
  rationale: Idiomatiche und bedeutungsgleiche deutsche Formulierung; »nur« macht die im vorangestellten ὀλίγοι liegende Einschränkung natürlich hörbar.
theological_decisions:
- issue: Bedeutungsumfang von τεθλιμμένη
  choice: bedrängt
  alternative: schwer; schmal; eingeengt
  rationale: Das Perfektpartizip kann sowohl räumliche Einengung als auch Bedrängnis beziehungsweise Mühsal anklingen lassen. »Bedrängt« erhält diese Spannung besser als das allgemeinere »schwer« und vermeidet zugleich eine bloße Wiederholung von »eng«.
- issue: Bezug des Pronomens αὐτήν
  choice: ihn
  alternative: sie
  rationale: Im Griechischen bezieht sich das feminine Pronomen grammatisch auf ὁδός. Im Deutschen ist »Weg« maskulin, daher lautet der natürliche Rückbezug »ihn«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Satzstruktur. Die Parallelität von »eng ist das Tor« und »bedrängt der Weg« wird bewahrt. Der Fußnotenmarker steht ordnungsgemäß im Haupttext.
