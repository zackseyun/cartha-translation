review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Satzes zutreffend wieder: die generische Partizipialkonstruktion („jeder, der“), den Nachdruck von „diese meine Worte“, das Nichttun, den zukünftigen Vergleich, ἀνήρ als „Mann“, den abgeschlossenen Bauvorgang sowie den Baugrund „auf den Sand“. Die Umschreibung des griechischen Futurpassivs durch „wird ... gleichen“ ist idiomatisch und bedeutungsgleich.'
  naturalness: „Und jeder, der diese meine Worte hört und sie nicht tut, wird einem törichten Mann gleichen“ ist würdiges, gut verständliches modernes Standarddeutsch. „Diese meine Worte“ und „sie nicht tut“ sind leicht gehoben bzw. bibelnah, aber weder veraltet noch unnatürlich und passen zum Register der Bergpredigt.
  terminology: „Töricht“ trifft μωρός im ethisch-weisheitlichen Kontext besser als umgangssprachliches „dumm“. „Mann“ entspricht ἀνήρ; die Fußnote erklärt sachlich die generische Reichweite des Vergleichs, ohne den griechischen Wortlaut zu neutralisieren. „Haus“ und „Sand“ sind terminologisch präzise.
