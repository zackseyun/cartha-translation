id: MAT.7.26
reference: Matthew 7:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: de
  text: Und jeder, der diese meine Worte hört und sie nicht tut, wird einem törichten Mann[a] gleichen, der sein Haus auf den Sand baute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem törichten Menschen“. Im Griechischen steht „Mann“; im Vergleich ist er repräsentativ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: jeder, der … hört
  rationale: Das substantivierte Präsenspartizip ist allgemein und umfassend gemeint. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den generischen Sinn.
- source_word: μου τοὺς λόγους τούτους
  choice: diese meine Worte
  rationale: Die Wortstellung wahrt sowohl die demonstrative Betonung als auch die Zugehörigkeit zu Jesus. Sie ist würdevoll und im Deutschen gut verständlich.
- source_word: μὴ ποιῶν αὐτούς
  choice: sie nicht tut
  rationale: ποιέω bezeichnet hier das Tun beziehungsweise Befolgen des Gehörten. Die knappe Wiedergabe bleibt eng am Griechischen und erhält die Parallele zum vorhergehenden Vers.
- source_word: ὁμοιωθήσεται
  choice: wird … gleichen
  rationale: Die zukünftige Passivform führt einen Vergleich ein. „Wird … gleichen“ gibt diesen im Deutschen idiomatisch wieder, ohne die Aussage unnötig auszudeuten.
- source_word: ἀνδρὶ μωρῷ
  choice: einem törichten Mann
  rationale: ἀνήρ bezeichnet ausdrücklich einen Mann; μωρός bedeutet hier „töricht“. Die Übersetzung bewahrt das männliche Vergleichsbild, ohne seinen allgemein anwendbaren Charakter einzuschränken.
- source_word: ὅστις
  choice: der
  rationale: Das Relativpronomen leitet die Erläuterung des Vergleichs ein; das schlichte deutsche Relativpronomen gibt seine Funktion natürlich wieder.
- source_word: ᾠκοδόμησεν
  choice: baute
  rationale: Der Aorist bezeichnet schlicht den abgeschlossenen Bauvorgang. „Baute“ ist präzise und natürlich.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: sein Haus
  rationale: οἰκία bezeichnet im Bild das Gebäude; „Haus“ passt daher besser als das stärker beziehungsbezogene „Zuhause“.
- source_word: ἐπὶ τὴν ἄμμον
  choice: auf den Sand
  rationale: ἐπί mit Akkusativ bezeichnet hier den Untergrund, auf dem gebaut wird. „Auf den Sand“ ist die übliche und klare deutsche Formulierung.
theological_decisions:
- issue: Männliche Repräsentativsprache im Vergleich
  choice: einem törichten Mann
  alternative: einem törichten Menschen
  rationale: Das griechische ἀνήρ ist ausdrücklich maskulin und zeichnet innerhalb des Gleichnisses einen Mann als Bauherrn. Die Übersetzung erhält dieses konkrete Bild; die einleitende Formulierung „jeder, der“ zeigt zugleich, dass die Warnung allgemein gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst knappe Wendung „sie nicht tut“ bewahrt die formale und rhetorische Parallele des griechischen Textes; „diese meine Worte“ setzt den im Ausgangstext vorhandenen Nachdruck.
