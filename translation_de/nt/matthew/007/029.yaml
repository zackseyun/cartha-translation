  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: de
  text: Denn er lehrte sie wie einer, der Vollmacht hat,[a] und nicht wie ihre Schriftgelehrten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „mit Vollmacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: Denn er lehrte
  rationale: Die Verbindung aus ἦν und Partizip bezeichnet eine fortdauernde Lehrtätigkeit in der Vergangenheit. „Denn“ bewahrt γάρ als Begründung für das Erstaunen der Menschen im vorhergehenden Vers.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen bezeichnet die Zuhörenden beziehungsweise die Menschenmenge.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: wie einer, der Vollmacht hat
  rationale: Die Formulierung bildet die griechische Vergleichskonstruktion deutlich ab. „Vollmacht“ gibt ἐξουσία als rechtmäßige, wirksame Autorität wieder, ohne sie auf bloß selbstsicheres Auftreten zu reduzieren.
- source_word: καὶ οὐχ ὡς
  choice: und nicht wie
  rationale: Bewahrt den ausdrücklichen Vergleich und den Gegensatz des griechischen Textes.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: ihre Schriftgelehrten
  rationale: „Schriftgelehrte“ ist im neutestamentlichen Kontext die geläufige Bezeichnung für anerkannte Ausleger und Lehrer des Gesetzes; „ihre“ erhält αὐτῶν.
theological_decisions:
- issue: Art der Vollmacht Jesu beim Lehren
  choice: 'Die Aussage wird beschreibend als Vergleich wiedergegeben: „wie einer, der Vollmacht hat“.'
  alternative: Die Vollmacht ausdrücklich als göttlich erklären oder sie lediglich als rhetorische Selbstsicherheit darstellen.
  rationale: Der Vers stellt Jesu wirkliche Vollmacht der Art des Lehrens der Schriftgelehrten gegenüber, nennt hier aber nicht ausdrücklich ihren theologischen Ursprung. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vollmacht“ ist im religiösen Kontext verständlich und trifft ἐξουσία präziser als das allgemeinere „Autorität“. Die etwas formellere Vergleichsform wahrt die Struktur und persönliche Zuspitzung des Ausgangstextes.
