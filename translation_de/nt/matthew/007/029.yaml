  source_fidelity: Die Übersetzung gibt γάρ mit „Denn“ angemessen als Begründung wieder, bewahrt den Bezug von αὐτούς mit „sie“ und bildet den Vergleich ὡς ἐξουσίαν ἔχων sowie den Gegensatz zu οἱ γραμματεῖς αὐτῶν zuverlässig ab. „Vollmacht“ trifft ἐξουσία im Kontext besser als bloßes „Selbstbewusstsein“ und legt den Ursprung dieser Vollmacht nicht über den Vers hinaus aus.
  naturalness: „Denn er lehrte sie wie einer, der Vollmacht hat, und nicht wie ihre Schriftgelehrten“ ist verständliches, würdiges modernes Standarddeutsch. Die präsentische Charakterisierung „der Vollmacht hat“ ist in diesem Vergleich idiomatisch und bewahrt die im Griechischen hervorgehobene persönliche Qualität.
  terminology: „Schriftgelehrten“ ist die etablierte und sachgerechte Wiedergabe von γραμματεῖς. „Vollmacht“ ist im religiös-literarischen Register präzise und die Fußnote bietet mit „mit Vollmacht“ eine wirklich idiomatischere, bedeutungsgleiche Alternative.
