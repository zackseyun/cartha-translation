review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und Bildsprache des griechischen Textes grundsätzlich treffend wieder: scharfe Anrede, vorrangige Selbstkorrektur, der Kontrast Balken–Splitter sowie das klare Sehen als Voraussetzung für das anschließende Entfernen. Die Formulierung „klar sehen, um ... zu ziehen“ bildet die syntaktische Verbindung jedoch im Deutschen nicht idiomatisch ab und kann fälschlich einen Zweck des Sehens statt der daraus folgenden Befähigung nahelegen.'
  naturalness: „Den Balken/den Splitter aus dem Auge ziehen“ ist verständlich, aber „entfernen“ ist im modernen Standarddeutsch für das Beseitigen eines Fremdkörpers aus dem Auge natürlicher. Die Verbindung „dann wirst du klar sehen und ... entfernen können“ klingt flüssig und bewahrt den resultativen Sinn von διαβλέψεις mit ακόλουθendem Infinitiv.
  terminology: „Heuchler“, „Balken“, „Auge“, „Splitter“ und „Bruder“ sind angemessen. „Balken“ gibt δοκός präzise als großes Holzelement wieder; „Splitter“ ist eine plausible, natürliche Wiedergabe von κάρφος. „Bruder“ wahrt die maskuline Singularform von ἀδελφοῦ, ohne zusätzliche konfessionelle Deutung einzutragen.
  issues:
  - severity: low
    issue: Unnatürliche bzw. leicht verschobene Zweckverbindung „klar sehen, um ... zu ziehen“
    rationale: Das griechische τότε διαβλέψεις ἐκβαλεῖν beschreibt, dass klares Sehen das Entfernen des Splitters anschließend ermöglicht. Die deutsche „um ... zu“-Konstruktion stellt eher einen Zweck des klaren Sehens dar. Eine Koordination mit „entfernen können“ gibt den Zusammenhang idiomatischer wieder.
  revised_text: Du Heuchler, entferne zuerst den Balken aus deinem Auge; dann wirst du klar sehen und den Splitter aus dem Auge deines Bruders entfernen können.
