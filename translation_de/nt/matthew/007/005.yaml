  rationale: Die Revision beschränkt sich auf eine idiomatischere Wiedergabe der beiden Formen von ἐκβάλλω und auf die klare Darstellung der durch διαβλέψεις ermöglichten Folgehandlung. Bedeutung, Reihenfolge, Schärfe der Anrede und die bildhafte Übertreibung bleiben unverändert.
