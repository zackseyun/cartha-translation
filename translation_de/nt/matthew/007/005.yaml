  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: de
  text: Du Heuchler, entferne zuerst den Balken aus deinem Auge; dann wirst du klar sehen und den Splitter aus dem Auge deines Bruders entfernen können.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριτά
  choice: Du Heuchler
  rationale: Der maskuline Singular im Vokativ ist eine direkte, scharfe Anrede. „Du Heuchler“ gibt diese Anrede im heutigen Deutsch natürlich und unmissverständlich wieder.
- source_word: ἔκβαλε
  choice: zieh ... aus
  rationale: Der Aoristimperativ von ἐκβάλλω fordert zur Entfernung auf. Im Bild eines Fremdkörpers im Auge ist „aus dem Auge ziehen“ idiomatischer als das wörtlichere „hinauswerfen“.
- source_word: πρῶτον
  choice: zuerst
  rationale: Kennzeichnet die zeitliche und sachliche Priorität der Selbstprüfung.
- source_word: δοκόν
  choice: Balken
  rationale: δοκός bezeichnet einen großen Bau- oder Tragbalken. „Balken“ bewahrt die bewusst groteske Übertreibung und den starken Gegensatz zum kleinen κάρφος.
- source_word: ὀφθαλμοῦ
  choice: Auge
  rationale: Direkte und im Deutschen übliche Wiedergabe des Körperbegriffs innerhalb des Bildworts.
- source_word: διαβλέψεις
  choice: wirst du klar sehen
  rationale: Das Futur von διαβλέπω bezeichnet deutliches beziehungsweise ungehindertes Sehen. Die Formulierung bewahrt sowohl die Zukunftsbedeutung als auch die Intensivierung des Sehens.
- source_word: ἐκβαλεῖν
  choice: um ... zu ziehen
  rationale: Der Infinitiv bezeichnet hier das beabsichtigte beziehungsweise dadurch ermöglichte Entfernen. „Um ... zu ziehen“ ist im Deutschen natürlich und hält die Verbindung zum vorangehenden Bild aufrecht.
- source_word: κάρφος
  choice: Splitter
  rationale: κάρφος kann einen kleinen trockenen Halm, Span oder Splitter bezeichnen. „Splitter“ ist als kleiner Fremdkörper im Auge anschaulich und wahrt den Größenkontrast zum Balken.
- source_word: ἀδελφοῦ
  choice: deines Bruders
  rationale: Die maskuline Singularform wird genau wiedergegeben. Im Kontext bezeichnet sie den Mitmenschen innerhalb der angesprochenen Gemeinschaft, ohne dass die Bildsprache verallgemeinernd geglättet wird.
theological_decisions:
- issue: Bedingung verantwortlicher Zurechtweisung
  choice: „dann wirst du klar sehen, um ... zu ziehen“
  alternative: „dann kannst du zusehen, dass du ... herausziehst“
  rationale: Der Vers verbietet nicht ausdrücklich jede Korrektur des Bruders, sondern ordnet ihr die eigene Umkehr beziehungsweise Selbstprüfung vor. Die gewählte Fassung bewahrt diese Spannung und macht aus dem Satz weder ein allgemeines Korrekturverbot noch eine Ermächtigung zur Selbstgerechtigkeit.
- issue: Geschlechtsspezifischer Beziehungsbegriff ἀδελφοῦ
  choice: „deines Bruders“
  alternative: „deines Mitmenschen“
  rationale: Die griechische Form ist maskulin und singularisch. Die konkrete Anrede wird beibehalten, statt sie stillschweigend zu neutralisieren.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem und scharfem Ton. Der traditionelle Bildkontrast „Balken – Splitter“ ist im Deutschen unmittelbar verständlich. Das Semikolon gliedert Aufforderung und Folge klar; die Wiederholung von „Auge“ bewahrt die rhetorische Parallelität des Griechischen.
