id: MAT.7.12
reference: Matthew 7:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: de
  text: 'Darum: Alles, was ihr wollt, dass die Menschen für euch tun, das tut auch ihr für sie; denn das ist das Gesetz und die Propheten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: Alles also, was
  rationale: Die umfassende Wendung wird natürlich wiedergegeben; „also“ bewahrt den folgernden Anschluss von οὖν an den vorausgehenden Zusammenhang.
- source_word: ἐὰν θέλητε
  choice: ihr wollt
  rationale: Die Verbindung bezeichnet allgemein das, was die Angesprochenen wünschen; „wollt“ ist direkt und gegenwärtig.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein und ist nicht auf Männer beschränkt.
- source_word: ποιῶσιν ὑμῖν … ποιεῖτε αὐτοῖς
  choice: für euch tun … tut auch ihr für sie
  rationale: Die parallele Formulierung erhält die Gegenseitigkeit und gibt die Dativkonstruktionen in natürlichem Deutsch wieder.
- source_word: οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται
  choice: denn darin bestehen das Gesetz und die Propheten
  rationale: „Darin bestehen“ drückt die zusammenfassende Gleichsetzung idiomatisch aus, ohne sie als erschöpfende dogmatische Definition auszudeuten. Die feste Formel „das Gesetz und die Propheten“ bleibt erhalten.
theological_decisions:
- issue: Generischer Gebrauch von ἄνθρωποι
  choice: die Menschen
  alternative: die Männer
  rationale: Der ethische Grundsatz gilt allgemein für menschliche Beziehungen; eine Beschränkung auf männliche Personen ist im Kontext nicht angezeigt.
- issue: Bedeutung von „das Gesetz und die Propheten“
  choice: als feste Schriftformel unverändert beibehalten
  alternative: die gesamte ethische Lehre der Schrift
  rationale: Die Übersetzung wahrt die jüdische und matthäische Zusammenfassungsformel und legt ihre genaue Reichweite nicht durch eine erklärende Paraphrase fest.
- issue: Gleichsetzung in οὗτος γάρ ἐστιν
  choice: denn darin bestehen
  alternative: denn das ist
  rationale: Die gewählte Formulierung gibt den zusammenfassenden Charakter idiomatisch wieder, ohne die im Ausgangstext bestehende theologische Spannung zwischen Zusammenfassung und Identität weiter aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die symmetrische Satzstruktur bildet die Gegenseitigkeit des griechischen Wortlauts nach; „Gesetz und Propheten“ bleibt als etablierte biblische Formel erhalten.
