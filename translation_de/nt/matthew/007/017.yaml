    issue: „Fauler Baum“ ist im modernen Deutsch potenziell mehrdeutig.
    rationale: Während „faul“ σαπρός lexikalisch treffen kann, wird es bei Personen sehr häufig im Sinn von „arbeitsscheu“ verstanden. „Verdorben“ macht die hier gemeinte negative Beschaffenheit des Baumes klar und lässt sowohl das konkrete als auch das kontextuell ethische Bild bestehen.
