source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: de
  text: So bringt jeder gute Baum gute Früchte hervor, der verdorbene Baum aber bringt schlechte Früchte hervor.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Verdorben“ gibt das griechische σαπρός wieder, das auch „faul“, „verfault“ oder „unbrauchbar“ bedeuten kann.
    reason: lexical_alternative
  - marker: b
    text: „Schlechte Früchte“ kann auch mit „böse Früchte“ wiedergegeben werden; das griechische Wort kann sowohl schlechte Beschaffenheit als auch moralische Bosheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Leitet aus dem vorausgehenden Bild eine entsprechende Folgerung ab und ist im heutigen Deutsch knapp und natürlich.
- source_word: πᾶν δένδρον
  choice: jeder … Baum
  rationale: πᾶν mit einem Substantiv im Singular hat distributiven Sinn; „jeder Baum“ bewahrt den allgemeinen, sprichwortartigen Charakter.
- source_word: ἀγαθὸν
  choice: gut
  rationale: Bezeichnet die positive Beschaffenheit des Baumes in einem weiten funktionalen und zugleich kontextuell moralischen Sinn.
- source_word: καρποὺς καλοὺς
  choice: gute Früchte
  rationale: καλός kann „gut“, „schön“ oder „vortrefflich“ bedeuten; bei der Beurteilung von Früchten ist „gute Früchte“ idiomatisch und lässt die ethische Anwendung durch den Kontext erkennen.
- source_word: ποιεῖ
  choice: bringt … hervor
  rationale: ποιέω bedeutet grundsätzlich „machen/tun“; bei einem Baum und seinen Früchten gibt „hervorbringen“ die Aussage natürlich und deutlich wieder.
- source_word: τὸ δὲ
  choice: der … aber
  rationale: δέ kennzeichnet hier den Gegensatz; die deutsche Nachstellung von „aber“ bildet ihn natürlich ab.
- source_word: σαπρὸν
  choice: faul
  rationale: σαπρός bezeichnet etwas Verfaultes, Verdorbenes oder Unbrauchbares. „Faul“ ist im Bild von Baum und Frucht anschaulich und lexikalisch präziser als das allgemeinere „schlecht“.
- source_word: καρποὺς πονηροὺς
  choice: schlechte Früchte
  rationale: πονηρός kann „schlecht“, „böse“ oder „verdorben“ bedeuten. „Schlechte Früchte“ passt natürlich zum landwirtschaftlichen Bild, ohne dessen moralische Bedeutung im Kontext auszublenden.
theological_decisions:
- issue: Moralische gegenüber rein landwirtschaftlicher Aussagekraft des Bildes
  choice: Das konkrete Bild von Baum und Früchten bleibt stehen, ohne seine moralische Anwendung ausdrücklich in den Vers hineinzuschreiben.
  alternative: Deutender formulieren, etwa „ein rechtschaffener Baum bringt gute Werke hervor“ oder „ein verdorbener Baum bringt böse Früchte hervor“.
  rationale: Im Zusammenhang warnt Jesus vor falschen Propheten, doch der griechische Vers formuliert das Bild und nicht dessen ausgedeutete Anwendung. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutungsbreite von πονηρός
  choice: „schlecht“ im Haupttext, mit Hinweis auf „böse“ in der Fußnote
  alternative: „böse Früchte“ im Haupttext
  rationale: „Schlecht“ ist innerhalb des konkreten Fruchtbildes das natürlichere Deutsch; die mögliche moralische Zuspitzung von πονηρός wird durch die Fußnote und den Kontext offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sprichwortartigem Klang. Die parallele Satzstruktur des Griechischen bleibt erhalten; „hervorbringen“ wird bewusst wiederholt.
