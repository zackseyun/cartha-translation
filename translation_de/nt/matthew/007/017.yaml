  to: So bringt jeder gute Baum gute Früchte hervor, der verdorbene Baum aber bringt schlechte Früchte hervor.[a][b]
  rationale: Die Revision ersetzt allein das im heutigen Deutsch potenziell missverständliche „faul“ durch „verdorben“ und ergänzt dafür eine Fußnote, die die konkret-lexikalische Spannweite von σαπρός transparent hält. Der Satzbau, die Wiederholungen und die Ambiguität der Metapher bleiben erhalten.
