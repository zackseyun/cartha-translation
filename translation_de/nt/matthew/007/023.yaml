  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: de
  text: 'Und dann werde ich ihnen erklären: »Ich habe euch nie gekannt.[a] Geht weg von mir, ihr, die ihr gesetzlos handelt![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe euch nie anerkannt.« Das griechische Wort für »kennen« kann hier persönliche Anerkennung oder Beziehung bezeichnen, nicht bloß gedankliches Wissen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihr, die ihr Unrecht tut«; »ihr Übeltäter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: Und dann
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorherigen Zusammenhang als auch die zeitliche Abfolge.
- source_word: ὁμολογήσω
  choice: werde ich … offen erklären
  rationale: Gibt in diesem öffentlichen, gerichtlichen Zusammenhang die feierliche und ausdrückliche Erklärung natürlich wieder.
- source_word: Οὐδέποτε
  choice: nie
  rationale: Bewahrt die nachdrückliche und uneingeschränkte Verneinung.
- source_word: ἔγνων
  choice: habe … gekannt
  rationale: Erhält die biblische Ausdrucksweise und lässt den Beziehungs- beziehungsweise Anerkennungsaspekt offen, statt ihn im Haupttext auszudeuten.
- source_word: ἀποχωρεῖτε
  choice: Geht weg
  rationale: Gibt den Befehl zur Zurückweisung in klarem, modernem Deutsch wieder, ohne unnötig altertümlich zu klingen.
- source_word: οἱ ἐργαζόμενοι
  choice: ihr, die ihr … tut
  rationale: Gibt das substantivierte Partizip als kennzeichnendes Handeln wieder und bleibt im Deutschen natürlich.
- source_word: τὴν ἀνομίαν
  choice: Gesetzlosigkeit
  rationale: Bewahrt den moralisch-rechtlichen Sinn von Missachtung des Gesetzes beziehungsweise der göttlichen Ordnung genauer als das allgemeinere „Böses“.
theological_decisions:
- issue: Bedeutung von „Ich habe euch nie gekannt“
  choice: Die relationale und gerichtliche Formulierung wird ohne dogmatische Ausdeutung beibehalten.
  alternative: „Ich habe euch nie anerkannt“ oder „Ihr habt nie zu mir gehört“
  rationale: Der griechische Text spricht unmittelbar vom Kennen. Eine Paraphrase als Anerkennung, Billigung oder Zugehörigkeit würde die im Vers bestehende theologische Spannung einseitig auflösen.
- issue: Bedeutungsumfang von ἀνομία
  choice: „Gesetzlosigkeit“
  alternative: „Unrecht“, „Bosheit“ oder „Böses“
  rationale: Die Wiedergabe erhält die rechtlich-moralische Kategorie des Ausgangstextes, ohne sie auf eine bestimmte konfessionelle Lehre zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Offen erklären“ trägt den öffentlichen, feierlichen Ton; „Geht weg“ ist klarer und gegenwärtiger als das gehobene „Weicht“. Die direkte Rede bleibt knapp und eindringlich.
