id: MAT.7.21
reference: Matthew 7:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: de
  text: 'Nicht jeder, der zu mir sagt: »Herr, Herr!«, wird in das Himmelreich[a] kommen, sondern wer den Willen meines Vaters im Himmel[b] tut, wird hineinkommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in das Reich der Himmel«. Matthäus verwendet häufig diese Wendung, wo in anderen Zusammenhängen vom »Reich Gottes« die Rede ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in den Himmeln«. Der griechische Plural wird im Deutschen sinngemäß als »im Himmel« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Nicht jeder, der zu mir sagt
  rationale: 'Οὐ πᾶς bezeichnet eine partielle Verneinung: »nicht jeder«, nicht »niemand«. Das Präsenspartizip wird im natürlichen Deutschen durch einen Relativsatz wiedergegeben.'
- source_word: Κύριε κύριε
  choice: Herr, Herr!
  rationale: Die übliche und theologisch offene Wiedergabe von κύριος ist »Herr«. Die Wiederholung als nachdrückliche Anrede bleibt erhalten.
- source_word: εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: wird in das Himmelreich kommen
  rationale: »In das Himmelreich kommen« ist im Deutschen idiomatischer als »in das Reich der Himmel eintreten« und gibt εἰσέρχομαι mit Zielangabe klar wieder. »Himmelreich« ist die geläufige deutsche Entsprechung für Matthäus’ βασιλεία τῶν οὐρανῶν.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: sondern wer … tut
  rationale: Das substantivierte Präsenspartizip wird knapp und natürlich mit »wer … tut« wiedergegeben. Der Gegensatz zwischen Reden und Tun bleibt deutlich.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: den Willen meines Vaters
  rationale: »Wille« bewahrt sowohl den ethischen als auch den theologischen Bedeutungsumfang von θέλημα, ohne ihn näher auszudeuten.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: im Himmel
  rationale: Die attributive Präpositionalgruppe bezieht sich auf den Vater. Der griechische Plural wird dem deutschen Sprachgebrauch entsprechend im Singular wiedergegeben.
- source_word: implied εἰσελεύσεται in the second clause
  choice: wird hineinkommen
  rationale: Das im Gegensatzsatz sinngemäß ergänzte Verb macht die Aussage im Deutschen vollständig; »hinein« nimmt das zuvor genannte Himmelreich auf, ohne den griechischen Satz unnötig zu wiederholen.
theological_decisions:
- issue: Verhältnis von Bekenntnis und Tun beim Eingang in das Himmelreich
  choice: Der Vers stellt die bloße Anrede Jesu als »Herr« dem Tun des Willens des Vaters gegenüber.
  alternative: Den Vers ausdrücklich als Lehre von Werkgerechtigkeit oder als vollständige Aussage über die Bedingungen des Heils auszulegen.
  rationale: Der Wortlaut warnt vor einem bloßen verbalen Bekenntnis und betont das Tun, entfaltet an dieser Stelle aber kein umfassendes Lehrsystem über Rechtfertigung oder Heil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Himmelreich« ist geläufig und gut verständlich; die Satzstruktur bewahrt den scharfen Gegensatz zwischen Sagen und Tun. Das explizite »wird hineinkommen« im zweiten Satzteil ergänzt das im Griechischen elliptisch mitgedachte Prädikat.
