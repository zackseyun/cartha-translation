  source_fidelity: Der Vers gibt die zeitliche Datierung (τετάρτῃ ... φυλακῇ τῆς νυκτός), die Bewegung zu den Jüngern (ἦλθεν πρὸς αὐτούς) und das gleichzeitige Gehen auf der Wasserfläche (περιπατῶν ἐπὶ τὴν θάλασσαν) sachgerecht wieder. „Auf dem See“ ist im Kontext eine natürliche deutsche Wiedergabe und wahrt die im griechischen Text ausgesagte Bewegung auf dem Wasser.
  naturalness: „In der vierten Nachtwache kam er zu ihnen und ging auf dem See“ ist flüssiges, modernes und zugleich würdiges Standarddeutsch. Die Umformung des griechischen Partizips in eine Beiordnung mit „und ging“ ist idiomatisch und beeinträchtigt den Gleichzeitigkeitssinn nicht.
  terminology: „Nachtwache“ ist historisch und terminologisch passend. „See“ ist für das galiläische Binnengewässer im Deutschen idiomatisch; die Fußnote macht transparent, dass θάλασσα wörtlich „Meer“ lautet. Die kulturelle Erläuterung zur vierten Nachtwache ist zutreffend. Die Marker sind inhaltlich korrekt an „Nachtwache“ bzw. „See“ verankert.
