id: MAT.14.25
reference: Matthew 14:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: de
  text: In der vierten Nachtwache[b] kam er zu ihnen und ging auf dem See[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »auf dem Meer«. Die Wendung ist vereinzelt im Sinn von »am Meer entlang« verstanden worden; der Zusammenhang spricht jedoch deutlich dafür, dass Jesus auf dem Wasser ging.'
    reason: alternative_reading
  - marker: b
    text: Die vierte Nachtwache war die letzte Nachtwache und dauerte nach römischer Zeiteinteilung ungefähr von 3 bis 6 Uhr morgens.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: in der vierten Nachtwache
  rationale: Der Dativ bezeichnet den Zeitpunkt. „Nachtwache“ bewahrt die historische Einteilung der Nacht, ohne im Haupttext eine moderne Uhrzeit einzusetzen.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein leichter erzählerischer Übergang. Im natürlichen deutschen Erzählstil muss er nicht zwingend durch „aber“, „und“ oder „da“ ausgedrückt werden.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: kam er zu ihnen
  rationale: ἔρχομαι mit πρός und Akkusativ bezeichnet hier die Bewegung auf die Jünger zu; „kam zu ihnen“ ist die direkte und idiomatische deutsche Wiedergabe.
- source_word: περιπατῶν
  choice: und ging
  rationale: Das präsentische Partizip bezeichnet eine gleichzeitig stattfindende Handlung. Die Beiordnung mit „und“ klingt im Deutschen natürlicher als eine schwerfällige partizipiale Konstruktion und bewahrt den Handlungssinn.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: auf dem See
  rationale: Im Zusammenhang bezeichnet die Wendung die Bewegung auf der Wasserfläche. „See“ ist im Deutschen für das galiläische Binnengewässer natürlich und vermeidet die mögliche Fehlvorstellung eines Ozeans, während die Fußnote die wörtlichere Form nennt.
theological_decisions:
- issue: Wunderhafte Bewegung Jesu auf dem Wasser
  choice: ging auf dem See
  alternative: ging am See entlang
  rationale: Syntax und Erzählzusammenhang sprechen deutlich für eine Bewegung auf der Wasserfläche. Die Übersetzung bewahrt diese Aussage, ohne sie abzuschwächen oder über den griechischen Text hinaus auszuschmücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historische Bezeichnung „Nachtwache“ bleibt im Haupttext erhalten und wird in der Fußnote erklärt. Die Satzstruktur ist bewusst schlicht und erzählerisch.
