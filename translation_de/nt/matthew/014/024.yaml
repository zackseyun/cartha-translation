source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: de
  text: Das Boot aber war schon viele Stadien vom Land entfernt[a][b] und wurde von den Wellen hart bedrängt[c], denn der Wind stand ihm entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Ufer entfernt“. Wörtlich steht im Griechischen „vom Land“.'
    reason: lexical_alternative
  - marker: b
    text: Ein Stadion war ein antikes Längenmaß von ungefähr 185 Metern.
    reason: cultural_note
  - marker: c
    text: 'Oder: „wurde von den Wellen gepeinigt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: Boot
  rationale: Im Zusammenhang der Überfahrt auf dem See Gennesaret ist „Boot“ die natürliche moderne Bezeichnung, ohne die Größe des Fahrzeugs zu übertreiben.
- source_word: ἤδη
  choice: schon
  rationale: Gibt den erreichten Stand der Handlung knapp und idiomatisch wieder.
- source_word: σταδίους πολλοὺς
  choice: viele Stadien
  rationale: Bewahrt die antike Maßeinheit und damit die Genauigkeit und historische Färbung des Ausgangstextes; die Größe wird in einer Fußnote erklärt.
- source_word: ἀπὸ τῆς γῆς ἀπεῖχεν
  choice: vom Land entfernt
  rationale: Gibt die räumliche Distanz natürlich wieder. „Land“ entspricht γῆ direkt; kontextuell ist das Ufer gemeint.
- source_word: βασανιζόμενον
  choice: wurde … hart bedrängt
  rationale: Das Partizip beschreibt die heftige Einwirkung der Wellen auf das Boot. „Hart bedrängt“ wahrt die starke Bildsprache von βασανίζω, ohne im Deutschen unnatürlich von einem „gequälten“ Boot zu sprechen.
- source_word: ὑπὸ τῶν κυμάτων
  choice: von den Wellen
  rationale: Direkte und natürliche Wiedergabe der verursachenden Größe.
- source_word: ἐναντίος ὁ ἄνεμος
  choice: der Wind stand ihm entgegen
  rationale: Idiomhafte deutsche Wiedergabe des widrigen, entgegenstehenden Windes; „ihm“ bezieht sich auf das Boot und macht den im Griechischen kontextuell erschlossenen Bezug deutlich.
- source_word: δὲ
  choice: aber
  rationale: Markiert den leichten Kontrast zwischen Jesus an Land und der schwierigen Lage des Bootes.
- source_word: γάρ
  choice: denn
  rationale: 'Bewahrt den erklärenden Zusammenhang: Der Gegenwind erklärt die Bedrängnis durch die Wellen.'
theological_decisions: []
