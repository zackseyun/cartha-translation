id: MAT.14.14
reference: Matthew 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: de
  text: Als Jesus ausstieg[a], sah er eine große Menschenmenge. Er hatte tiefes Mitgefühl mit ihnen und heilte ihre Kranken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „als er hinausging“ oder „als er herauskam“. Im Zusammenhang ist wahrscheinlich gemeint, dass Jesus aus dem Boot stieg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: als Jesus ausstieg
  rationale: Das Partizip bedeutet wörtlich „hinausgegangen/herausgekommen“. Der Zusammenhang mit der Bootsfahrt legt nahe, dass Jesus aus dem Boot stieg. Die ausdrückliche Nennung Jesu ist im Deutschen natürlicher und beseitigt keine sachliche Mehrdeutigkeit.
- source_word: εἶδεν
  choice: sah er
  rationale: Die schlichte Wiedergabe entspricht dem Aorist von ὁράω.
- source_word: πολὺν ὄχλον
  choice: eine große Menschenmenge
  rationale: Die Formulierung gibt sowohl ὄχλος als auch die quantitative Bedeutung von πολύς in natürlichem modernem Deutsch wieder.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: er hatte tiefes Mitgefühl mit ihnen
  rationale: σπλαγχνίζομαι bezeichnet ein tief empfundenes Erbarmen beziehungsweise Mitgefühl. „Tiefes Mitgefühl“ vermittelt diese emotionale Stärke klar und ohne altertümliche Sprache.
- source_word: ἐθεράπευσεν
  choice: heilte
  rationale: Im Zusammenhang bezeichnet θεραπεύω die körperliche Heilung und wird im Deutschen am natürlichsten mit „heilen“ wiedergegeben.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: ihre Kranken
  rationale: Die substantivische Wiedergabe bewahrt die Kürze des Griechischen und bezeichnet die Kranken aus ihrer Mitte.
theological_decisions:
- issue: Wiedergabe der emotionalen Reaktion Jesu
  choice: er hatte tiefes Mitgefühl mit ihnen
  alternative: er erbarmte sich über sie
  rationale: Die gewählte Formulierung bewahrt den starken Beweggrund für die anschließenden Heilungen, ohne das Erbarmen abzuschwächen oder konfessionell auszudeuten. Die Alternative ist ebenfalls möglich, wirkt im heutigen Deutsch jedoch traditioneller.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der kurze Satzbau folgt der klaren Abfolge des griechischen Textes; der erste Satz wird zur besseren Lesbarkeit vor dem Ausdruck des Mitgefühls abgeschlossen.
