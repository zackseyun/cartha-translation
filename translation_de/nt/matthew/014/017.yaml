base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: de
  text: 'Doch sie sagten zu ihm: »Wir haben hier nichts außer fünf Broten und zwei Fischen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Doch sie
  rationale: Der Artikel bezeichnet die zuvor genannten Jünger; »doch« gibt den leichten Gegensatz zu Jesu vorausgehender Aufforderung natürlich wieder.
- source_word: λέγουσιν αὐτῷ
  choice: sagten zu ihm
  rationale: Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: Wir haben hier nichts außer
  rationale: Nach der Verneinung bedeutet εἰ μή hier »außer«; die Formulierung bildet die griechische Aussage klar und idiomatisch ab.
- source_word: πέντε ἄρτους
  choice: fünf Broten
  rationale: ἄρτος bezeichnet hier zählbare Brotlaibe; im Deutschen ist »fünf Brote« die natürliche und kontextgerechte Wiedergabe.
- source_word: δύο ἰχθύας
  choice: zwei Fischen
  rationale: ἰχθύς bezeichnet gewöhnlich einen Fisch; der deutsche Plural passt unmittelbar zum Speisungskontext.
