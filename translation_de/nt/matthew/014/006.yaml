  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: de
  text: Als aber der Geburtstag des Herodes gefeiert wurde[a], tanzte die Tochter der Herodias in der Mitte[b] und gefiel Herodes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Herodes’ Geburtstag gekommen war“; die griechische Wendung kann den Geburtstag als Anlass beziehungsweise dessen Feier bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mitten unter den Anwesenden“. Wörtlich: „in der Mitte“; der genaue Bezug wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: als der Geburtstag des Herodes gefeiert wurde
  rationale: Die Wendung bezeichnet zeitlich den Eintritt bzw. die Begehung von Herodes’ Geburtstag. Die passive Formulierung gibt den Festanlass natürlich wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Festmahl vorauszusetzen.
- source_word: δὲ
  choice: aber
  rationale: δέ führt die Erzählung mit einer leichten Gegenüberstellung zum vorangehenden Geschehen weiter.
- source_word: ὠρχήσατο
  choice: tanzte
  rationale: Das Verb bedeutet schlicht „tanzen“; eine nähere Charakterisierung der Darbietung liefert der Text nicht.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: die Tochter der Herodias
  rationale: Die Genitivverbindung wird direkt wiedergegeben. Der Name der Tochter wird nicht ergänzt, da er im Text nicht steht.
- source_word: ἐν τῷ μέσῳ
  choice: mitten unter den Gästen
  rationale: Wörtlich heißt die Wendung „in der Mitte“. Im erzählerischen Zusammenhang ist die Mitte der versammelten Gesellschaft gemeint; „unter den Gästen“ macht diesen Bezug verständlich und wird durch eine Fußnote als kontextuelle Wiedergabe ausgewiesen.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: gefiel Herodes
  rationale: ἀρέσκω mit Dativ bedeutet „jemandem gefallen“. Die deutsche Konstruktion bildet dies knapp und natürlich ab.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Herodes
  rationale: Die im Deutschen übliche Form des Personennamens wird verwendet.
