source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: de
  text: Sein Kopf wurde auf einer Platte gebracht und dem Mädchen gegeben, und sie brachte ihn ihrer Mutter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠνέχθη
  choice: wurde gebracht
  rationale: Der Aorist Passiv von φέρω wird natürlich und unter Wahrung des Passivs wiedergegeben.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: sein Kopf
  rationale: Direkte Wiedergabe ohne beschönigenden Ausdruck.
- source_word: ἐπὶ πίνακι
  choice: auf einer Platte
  rationale: πίναξ bezeichnet hier eine Platte beziehungsweise ein Tablett zum Servieren; „Platte“ ist im Deutschen natürlich und dem Kontext angemessen.
- source_word: ἐδόθη
  choice: wurde ... gegeben
  rationale: Der Aorist Passiv von δίδωμι wird geradlinig wiedergegeben; die passive Abfolge des Griechischen bleibt erhalten.
- source_word: τῷ κορασίῳ
  choice: dem Mädchen
  rationale: κοράσιον bezeichnet ein Mädchen; die deutsche Formulierung ist klar, gegenwärtig und nicht unnötig altertümlich.
- source_word: ἤνεγκεν
  choice: sie brachte ihn
  rationale: Der Aorist Aktiv von φέρω wird mit „brachte“ wiedergegeben. Das Pronomen „ihn“ bezieht sich grammatisch eindeutig auf „Kopf“ und ist im Deutschen erforderlich.
- source_word: τῇ μητρὶ αὐτῆς
  choice: ihrer Mutter
  rationale: Die Dativphrase wird direkt wiedergegeben; „ihrer“ verweist auf die Mutter des Mädchens.
