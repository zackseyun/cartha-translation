  verdict: revise
  source_fidelity: Der Text gibt εὐθέως, ἐκτείνας τὴν χεῖρα, ἐπελάβετο αὐτοῦ, die Anrede Ὀλιγόπιστε und die Frage εἰς τί ἐδίστασας insgesamt treffend wieder. Das deutsche Perfekt „hast du gezweifelt“ verschiebt jedoch gegenüber dem aoristischen Erzähltempus unnötig den Tempusfluss; Präteritum ist hier die natürliche und genauere Lösung.
  naturalness: '„Sofort streckte Jesus die Hand aus, ergriff ihn und sagte zu ihm“ ist klares modernes Standarddeutsch. „Du Kleingläubiger“ ist verständlich, aber als substantivierte Personenbezeichnung härter und weniger idiomatisch als die direkte Anrede „Du Kleingläubiger“. Sie kann beibehalten werden. Die Fußnote benötigt eine grammatische Korrektur: Nicht „neben Zweifel“, sondern „neben Zweifeln“ bzw. besser eine verbnahe Formulierung.'
  terminology: „Kleingläubiger“ bewahrt die Aussage eines mangelhaften, nicht fehlenden Glaubens und ist als etablierte biblische Anrede angemessen. „gezweifelt“ ist als Hauptlesart vertretbar; die Fußnote wahrt die mögliche Nuance von Zögern oder Schwanken. Der historische Präsensgebrauch von λέγει muss im Deutschen nicht nachgebildet werden.
