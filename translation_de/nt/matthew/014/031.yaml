  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: de
  text: 'Sofort streckte Jesus die Hand aus, ergriff ihn und sagte zu ihm: »Du Kleingläubiger, warum zweifeltest du[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »warum bist du ins Schwanken geraten?« Das griechische Verb kann auch Zögern oder Schwanken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Sofort
  rationale: Gibt die unmittelbare, dringliche Abfolge der Handlung in natürlichem modernem Deutsch wieder.
- source_word: δὲ
  choice: unübersetzt
  rationale: Die leicht weiterführende beziehungsweise kontrastierende Funktion wird im Deutschen durch den Erzählfluss ausreichend deutlich; ein zusätzliches »aber« wäre hier unnötig schwer.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: streckte … die Hand aus
  rationale: Bewahrt das konkrete Bild und gibt das vorzeitige Partizip innerhalb der Handlungsfolge idiomatisch wieder.
- source_word: ἐπελάβετο αὐτοῦ
  choice: ergriff ihn
  rationale: Gibt das entschlossene Ergreifen beziehungsweise Festhalten knapp und präzise wieder, ohne weitere Einzelheiten in den Text hineinzulesen.
- source_word: λέγει αὐτῷ
  choice: sagte zu ihm
  rationale: Das historische Präsens wird zugunsten eines natürlichen deutschen Erzähltempus im Präteritum wiedergegeben.
- source_word: Ὀλιγόπιστε
  choice: Du Kleingläubiger
  rationale: Die etablierte und verständliche deutsche Anrede bewahrt den Bezug auf geringe beziehungsweise unzureichende Glaubenszuversicht, ohne völligen Unglauben zu behaupten.
- source_word: εἰς τί
  choice: warum
  rationale: Ist in diesem Zusammenhang die natürliche deutsche Entsprechung der Frage nach dem Grund.
- source_word: ἐδίστασας
  choice: hast du gezweifelt
  rationale: Gibt die geläufige Bedeutung wieder; die ebenfalls mögliche Nuance des Schwankens oder Zögerns wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Bedeutung von Ὀλιγόπιστε im Verhältnis zu πίστις
  choice: Du Kleingläubiger
  alternative: Du mit deinem kleinen Glauben
  rationale: Die Formulierung bezeichnet einen Mangel oder eine Schwäche des Glaubens, nicht dessen völliges Fehlen. So bleibt die Spannung zwischen vorhandenem Glauben und tatsächlichem Zweifel erhalten.
- issue: Nuance von ἐδίστασας
  choice: hast du gezweifelt
  alternative: bist du ins Schwanken geraten
  rationale: »Gezweifelt« ist klar und vertraut, darf aber nicht als gefestigter Unglaube überdeutet werden; der griechische Ausdruck kann situationsbezogenes Schwanken oder Zögern bezeichnen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Erzählbewegung und die direkte, pointierte Anrede Jesu bleiben erhalten.
