base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: de
  text: 'Er aber sagte: »Bringt sie mir hierher.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die im vorherigen Vers erwähnten Brote und Fische.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: 'δέ ist hier ein milder weiterführender Konnektor mit kontrastierender Wirkung: Auf den Einwand der Jünger folgt Jesu Antwort. »Aber« gibt diesen Zusammenhang natürlich wieder.'
- source_word: εἶπεν
  choice: sagte
  rationale: Der Aorist von λέγω bedeutet schlicht »sagte«; eine Wiedergabe wie »befahl« würde die im Verb selbst nicht ausdrücklich enthaltene Befehlsnuance verstärken.
- source_word: Φέρετέ
  choice: Bringt
  rationale: Der präsentische Aktivimperativ in der zweiten Person Plural fordert die Jünger auf, die genannten Dinge herzubringen. »Bringt« ist idiomatisch und bewahrt die Imperativform.
- source_word: μοι
  choice: zu mir
  rationale: Der Dativ bezeichnet hier die Person, zu der etwas gebracht werden soll. »Zu mir« ist im Deutschen klar und natürlich.
- source_word: ὧδε
  choice: her
  rationale: ὧδε bezeichnet den Ort beim Sprecher. In Verbindung mit »bringen« gibt das deutsche Richtungsadverb »her« diese Perspektive idiomatisch wieder.
- source_word: αὐτούς
  choice: sie
  rationale: Das maskuline Pluralpronomen verweist im Kontext gemeinsam auf die zuvor genannten Brote und Fische. »Sie« erhält den pronominalen Rückverweis, ohne im Haupttext eine erklärende Ergänzung einzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Wortstellung »zu mir her« bewahrt sowohl den persönlichen Bezug von μοι als auch die räumliche Perspektive von ὧδε.
