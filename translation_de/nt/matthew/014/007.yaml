base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: de
  text: Deshalb versprach er ihr unter Eid, ihr alles zu geben, worum sie bitten würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was immer sie erbitten sollte“. Das Griechische verwendet einen indefiniten Relativsatz (ὃ ἐὰν αἰτήσηται) für eine noch offene künftige Bitte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Deshalb
  rationale: Die Folgerungspartikel nimmt den vorausgehenden Erzählzusammenhang auf und bezeichnet dessen Ergebnis; „Deshalb“ gibt diese kausal-resultative Funktion natürlich wieder.
- source_word: μετὰ ὅρκου
  choice: unter Eid
  rationale: Die Präposition mit dem Genitiv bezeichnet hier die begleitende Art des Versprechens. „Unter Eid“ ist im modernen Deutschen idiomatisch und bewahrt den feierlich bindenden Charakter.
- source_word: ὡμολόγησεν
  choice: versprach
  rationale: ὁμολογέω bezeichnet in diesem Zusammenhang eine feste, öffentlich bindende Zusage, nicht ein Bekenntnis. „Versprach“ verbindet sich natürlich mit dem folgenden Infinitiv.
- source_word: αὐτῇ
  choice: ihr
  rationale: Der Dativ bezeichnet das Mädchen als Empfängerin der Zusage. Im Deutschen wird das Pronomen zur Klarheit sowohl beim Versprechen als auch beim Geben wiedergegeben.
- source_word: δοῦναι
  choice: zu geben
  rationale: Der Aoristinfinitiv gibt den Inhalt der Zusage an; „zu geben“ entspricht ihm direkt und idiomatisch.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: alles, worum sie bitten würde
  rationale: Relativpronomen, ἐάν und Konjunktiv bilden einen indefiniten Relativsatz über eine noch offene künftige Bitte. „Alles, worum sie bitten würde“ bewahrt die Offenheit und klingt im Deutschen natürlich.
theological_decisions: []
