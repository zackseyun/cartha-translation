id: MAT.14.19
reference: Matthew 14:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: de
  text: Dann wies er die Menschenmengen an, sich auf dem Gras niederzulassen. Er nahm die fünf Brote und die zwei Fische, blickte zum Himmel auf und segnete[a]. Dann brach er die Brote und gab sie den Jüngern, und die Jünger gaben sie den Menschenmengen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „segnete“. Der griechische Text nennt kein Objekt; gemeint sein kann auch, dass er Gott pries oder den Segen sprach.'
    reason: Bewahrt die im Ausgangstext vorhandene Mehrdeutigkeit, ohne sie im Haupttext einseitig aufzulösen.
lexical_decisions:
- source_word: κελεύσας
  choice: Dann wies er … an
  rationale: Gibt die verbindliche Anweisung natürlich wieder und ordnet das vorzeitige Partizip verständlich in die Erzählfolge ein.
- source_word: τοὺς ὄχλους
  choice: die Menschenmengen
  rationale: Bewahrt den Plural und bezeichnet die versammelten Gruppen in modernem Standarddeutsch.
- source_word: ἀνακλιθῆναι
  choice: sich … niederzulassen
  rationale: Passt natürlich zur Einnahme einer Mahlzeit, ohne eine moderne Sitzhaltung vorauszusetzen.
- source_word: ἐπὶ τοῦ χόρτου
  choice: auf dem Gras
  rationale: Entspricht der schlichten Ortsangabe; die bei Markus genannte grüne Farbe wird nicht ergänzt.
- source_word: λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας
  choice: Er nahm die fünf Brote und die zwei Fische
  rationale: Gibt Gegenstände und Zahlen direkt wieder; das Partizip wird für einen flüssigen deutschen Erzählstil als finites Verb formuliert.
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: blickte zum Himmel auf
  rationale: Natürliche und genaue Wiedergabe der Blickrichtung.
- source_word: εὐλόγησεν
  choice: segnete
  rationale: Bewahrt den direkten Wortsinn und lässt wie der griechische Text das Objekt unausgesprochen.
- source_word: κλάσας
  choice: Dann brach er die Brote
  rationale: Das implizite Objekt wird aus dem unmittelbaren Kontext aufgenommen; die zeitliche Folge bleibt klar.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: gab sie den Jüngern
  rationale: Das Pronomen verweist eindeutig auf die zuvor gebrochenen Brote und vermeidet unnötige Wiederholung.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: und die Jünger gaben sie den Menschenmengen
  rationale: Ergänzt das im Griechischen ausgelassene, aber eindeutig mitgedachte Verb und Objekt für idiomatisches Deutsch.
theological_decisions:
- issue: Nicht genanntes Objekt von εὐλόγησεν
  choice: „segnete“ ohne ausdrückliches Objekt
  alternative: „sprach den Segen“ oder „pries Gott“
  rationale: Im Griechischen steht kein Objekt. Die offene Formulierung vermeidet die Festlegung darauf, ob Jesus die Gaben segnete, Gott pries oder den üblichen Segen vor der Mahlzeit sprach; die Fußnote erklärt die möglichen Verständnisse.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die Partizipialkette des Griechischen wird in kurze Hauptsätze aufgelöst; die sachliche Wiederholung von „Menschenmengen“ erhält den Plural des Ausgangstextes.
