  text: καὶ πέμψας ἀπεκεφάλισεν ⸀τὸν Ἰωάννην ἐν τῇ φυλακῇ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: de
  text: Und er schickte hin und ließ Johannes im Gefängnis enthaupten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische verwendet ein Aoristpartizip („nachdem er gesandt hatte“/„er sandte“) vor dem Hauptverb. Dieses schreibt die Enthauptung Herodes zu; die Formulierung kann zugleich eine durch andere ausgeführte Tat einschließen.
    reason: grammatical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Erzählung weiter, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: πέμψας
  choice: er schickte jemanden hin
  rationale: Das adverbiale Aoristpartizip von πέμπω bezeichnet hier das Aussenden eines nicht genannten Beauftragten. Die Formulierung macht im Deutschen die vermittelte Ausführung verständlich, ohne einen im Griechischen nicht genannten Amtsträger einzuführen.
- source_word: ἀπεκεφάλισεν
  choice: ließ ... enthaupten
  rationale: ἀποκεφαλίζω bedeutet spezifisch „enthaupten“. Zusammen mit πέμψας ist im Kontext eine durch einen ausgesandten Beauftragten vollzogene Handlung gemeint; die deutsche Kausativkonstruktion gibt diese Vermittlung natürlich wieder, während die Verantwortung beim Subjekt bleibt.
- source_word: τὸν Ἰωάννην
  choice: Johannes
  rationale: Der Eigenname genügt, da der unmittelbare Zusammenhang eindeutig erkennen lässt, welcher Johannes gemeint ist. „Johannes der Täufer“ würde den Wortlaut dieses Verses erweitern.
- source_word: ἐν τῇ φυλακῇ
  choice: im Gefängnis
  rationale: φυλακή bezeichnet hier den konkreten Ort der Gefangenschaft. „Im Gefängnis“ ist die natürliche und genaue deutsche Ortsangabe.
theological_decisions:
- issue: Herodes’ Verantwortung und die vermittelte Ausführung
  choice: „ließ Johannes ... enthaupten“
  alternative: „enthauptete Johannes“
  rationale: Der griechische Hauptsatz schreibt Herodes die Tat zu, während das vorausgehende πέμψας erkennen lässt, dass sie durch einen Ausgesandten ausgeführt wurde. Die gewählte Form bewahrt sowohl seine Verantwortung als auch die Vermittlung, ohne anzunehmen, er habe Johannes eigenhändig enthauptet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist idiomatisch und zugleich quellennah; sie vermeidet sowohl die missverständliche Vorstellung einer eigenhändigen Tötung durch Herodes als auch die Abschwächung seiner Verantwortung.
