id: MAT.14.8
reference: Matthew 14:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: de
  text: 'Sie aber, von ihrer Mutter dazu gebracht, sagt: »Gib mir hier auf einer Schale den Kopf Johannes des Täufers.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: von … dazu gebracht
  rationale: Die Form bezeichnet hier den vorausgehenden Einfluss der Mutter auf die Tochter. Die passive Wendung bleibt erhalten, ohne die Art dieses Einflusses enger als im Griechischen als Anweisung oder Drängen festzulegen.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: von ihrer Mutter
  rationale: ὑπό mit Genitiv bezeichnet die handelnde Person in der Passivkonstruktion.
- source_word: Δός μοι
  choice: Gib mir
  rationale: Der Aoristimperativ wird als unmittelbare, bestimmte Aufforderung wiedergegeben.
- source_word: φησίν
  choice: sagt
  rationale: Das historische Präsens des griechischen Erzähltexts wird bewahrt und verleiht der Szene Unmittelbarkeit.
- source_word: ὧδε
  choice: hier
  rationale: Die knappe Ortsangabe wird direkt wiedergegeben und kann zugleich die verlangte unmittelbare Übergabe am Ort des Festes anklingen lassen.
- source_word: ἐπὶ πίνακι
  choice: auf einer Schale
  rationale: πίναξ bezeichnet in diesem Festmahlkontext eine große Servierschale oder Platte. „Schale“ ist im Deutschen natürlich und hinreichend anschaulich.
- source_word: τὴν κεφαλὴν
  choice: den Kopf
  rationale: Die konkrete und drastische Ausdrucksweise des Ausgangstextes wird unverändert bewahrt.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Johannes des Täufers
  rationale: „Täufer“ ist die im Deutschen natürliche und zugleich bedeutungstreue Wiedergabe des Tätigkeits- beziehungsweise Beinamens βαπτιστής.
theological_decisions:
- issue: Wiedergabe des Titels βαπτιστής
  choice: Johannes des Täufers
  alternative: Johannes des Taufenden
  rationale: „Täufer“ bewahrt den beschreibenden Bezug auf Johannes’ Tätigkeit und ist zugleich die feste, allgemein verständliche deutsche Bezeichnung; eine künstlich wörtliche Neubildung würde keinen zusätzlichen Bedeutungsgewinn bringen.
translation_notes:
  register: Moderner, würdiger Erzählstil. Das historische Präsens „sagt“ folgt der lebendigen griechischen Darstellung. Die Genitivfügung „den Kopf Johannes des Täufers“ ist knapp, klar und für einen biblischen Erzähltext angemessen.
