  source_fidelity: 'Die Übersetzung gibt die syntaktischen und semantischen Kernelemente des griechischen Textes zuverlässig wieder: das vorzeitige passive Partizip προβιβασθεῖσα („von ihrer Mutter dazu gebracht“), die persönliche Urheberschaft mit ὑπό, den bestimmten Imperativ, das historische Präsens φησίν, ὧδε („hier“) sowie die Forderung nach dem Kopf des Johannes. „Dazu gebracht“ bewahrt angemessen, dass die Mutter zuvor auf die Tochter eingewirkt hat, ohne die genaue Art des Einflusses unnötig festzulegen.'
  naturalness: Der Satz ist modernes, gut lesbares Standarddeutsch und behält zugleich einen würdigen erzählerischen Registerton. Das historische Präsens „sagt“ ist im Kontext verständlich und source-nah. „Auf einer Schale“ ist in der konkreten Bankettszene eine natürliche Wiedergabe von ἐπὶ πίνακι.
  terminology: „Johannes der Täufer“ bzw. hier die grammatisch erforderliche Genitivform „Johannes des Täufers“ ist die etablierte und zugleich bedeutungstreue deutsche Wiedergabe von Ἰωάννης ὁ βαπτιστής. „Kopf“ entspricht κεφαλή direkt. Eine Fußnote ist nicht erforderlich, da keine relevante Ambiguität oder ungewohnte Terminologie verbleibt.
