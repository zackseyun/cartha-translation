id: MAT.14.33
reference: Matthew 14:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: de
  text: 'Da warfen sich die im Boot vor ihm nieder[a] und sagten: »Du bist wirklich Gottes Sohn[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beteten ihn an« beziehungsweise »huldigten ihm«. Das griechische Verb bezeichnet ehrerbietiges Niederwerfen und kann je nach Zusammenhang Anbetung ausdrücken; hier sprechen der Kontext und das folgende Bekenntnis für diesen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »der Sohn Gottes«. Obwohl im Griechischen vor »Gott« kein Artikel steht, bezeichnet die Wendung hier nicht lediglich »einen Sohn Gottes«, sondern ist im Kontext als Titel zu verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Da … die
  rationale: δέ ist hier ein leichter erzählerischer Anschluss. »Da« gibt die Folge auf das vorangehende Geschehen im natürlichen modernen Deutsch wieder, ohne einen starken Gegensatz einzutragen; οἱ wird substantivisch als »die« wiedergegeben.
- source_word: ἐν τῷ πλοίῳ
  choice: im Boot
  rationale: Dies ist die idiomatische und genaue deutsche Wiedergabe der Ortsangabe.
- source_word: προσεκύνησαν αὐτῷ
  choice: warfen sich … vor ihm nieder
  rationale: προσκυνέω bezeichnet eine ehrerbietige körperliche Unterwerfung und kann je nach Zusammenhang auch Anbetung ausdrücken. Die konkrete Formulierung bewahrt den anschaulichen Grundsinn und lässt die durch Kontext und Bekenntnis entstehende kultische Bedeutung bestehen.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das griechische Partizip wird als beigeordnete Handlung natürlich ins Deutsche übertragen.
- source_word: Ἀληθῶς
  choice: wirklich
  rationale: »Wirklich« ist eine natürliche, nachdrückliche Bekräftigung im heutigen Standarddeutsch; die Satzstellung erhält das Gewicht der Aussage.
- source_word: θεοῦ υἱὸς
  choice: Gottes Sohn
  rationale: Die vorangestellte Genitivverbindung wird idiomatisch wiedergegeben. Trotz fehlenden Artikels bei θεοῦ ist die Wendung im Kontext nicht als »ein Sohn Gottes« zu verstehen, sondern als qualitative beziehungsweise definite Bezeichnung.
- source_word: εἶ
  choice: Du bist
  rationale: Die Kopula und das im Verb enthaltene Subjekt werden im Deutschen ausdrücklich wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von προσκυνέω gegenüber Jesus
  choice: »warfen sich … vor ihm nieder« mit Fußnote zur möglichen Wiedergabe »beteten ihn an«
  alternative: »beteten ihn an«
  rationale: Der unmittelbare Kontext und das Bekenntnis zu Gottes Sohn sprechen für Anbetung. Die Hauptformulierung bewahrt zugleich die genuine lexikalische Spannweite zwischen sichtbarer Niederwerfung, Huldigung und Anbetung, ohne die theologische Tragweite abzuschwächen.
- issue: Bestimmtheit von θεοῦ υἱὸς
  choice: »Gottes Sohn«
  alternative: '»der Sohn Gottes«; nicht: »ein Sohn Gottes«'
  rationale: Der fehlende Artikel erzwingt im Griechischen keine unbestimmte Bedeutung. Im matthäischen Kontext fungiert die Wendung als christologisches Bekenntnis; »Gottes Sohn« bewahrt dies idiomatisch, ohne einen im griechischen Wortlaut nicht gesetzten deutschen Artikel in die Genitivform einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. »Sich vor jemandem niederwerfen« ist verständlich und bewahrt die konkrete Bildhaftigkeit des griechischen Verbs; die Fußnote erschließt dessen kultische Tragweite. Die direkte Rede bleibt knapp und bekenntnishaft.
