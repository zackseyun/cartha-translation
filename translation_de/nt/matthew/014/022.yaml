source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: de
  text: Und sofort nötigte er die Jünger, ins Boot zu steigen und ihm ans andere Ufer vorauszufahren, bis er die Menschenmengen entlassen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die unverzügliche zeitliche Abfolge natürlich und prägnant wieder.
- source_word: ἠνάγκασεν
  choice: drängte
  rationale: Bewahrt den Nachdruck und die starke Veranlassung des Verbs, ohne eine im Kontext nicht ausdrücklich genannte körperliche Gewalt anzudeuten.
- source_word: τοὺς μαθητάς
  choice: die Jünger
  rationale: Der Artikel bezeichnet die bereits bekannte Jüngergruppe; ein zusätzliches »seine« ist im Griechischen nicht ausdrücklich vorhanden.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: ins Boot zu steigen
  rationale: Ist die natürliche deutsche Wendung für das Besteigen eines Bootes; der bestimmte Artikel ergibt sich aus dem Erzählzusammenhang.
- source_word: προάγειν αὐτόν
  choice: ihm … vorauszufahren
  rationale: Drückt aus, dass die Jünger Jesus auf dem Wasserweg vorausgehen sollen; »fahren« passt im Deutschen idiomatisch zum Boot.
- source_word: εἰς τὸ πέραν
  choice: ans andere Ufer
  rationale: Gibt die gegenüberliegende Seite des Gewässers im Deutschen klar und natürlich wieder.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: während er … entließ
  rationale: In diesem Zusammenhang beschreibt die Konstruktion den Zeitraum, in dem die Jünger vorausfahren und Jesus die Menschen entlässt. Die deutsche Nebenordnung vermeidet das missverständliche »bis«, das nahelegen könnte, die Jünger sollten erst nach der Entlassung ankommen.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: die Menschenmengen entließ
  rationale: ἀπολύω bezeichnet hier das Entlassen beziehungsweise Wegschicken; der Plural von ὄχλοι bleibt durch »Menschenmengen« erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Handlungsablauf, wird aber idiomatisch geglättet. »Menschenmengen« bewahrt den griechischen Plural, ohne das veraltete »Volksmengen« zu verwenden.
