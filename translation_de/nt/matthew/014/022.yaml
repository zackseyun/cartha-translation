    issue: »während er die Menschenmengen entließ« für ἕως οὗ ἀπολύσῃ
    rationale: 'ἕως οὗ mit Aorist-Konjunktiv setzt einen zukünftigen zeitlichen Endpunkt: Jesus nötigt die Jünger vorauszufahren, bis er die Mengen entlassen hat. »Während« macht daraus bloße Gleichzeitigkeit und verändert die Satzrelation.'
  - severity: medium
    issue: »drängte« für ἠνάγκασεν
    rationale: »Drängen« kann bloßes Zureden bezeichnen. ἀναγκάζω trägt hier deutlich stärkeren Nachdruck. »Nötigte« wahrt diese Stärke, ohne körperliche Gewalt zu behaupten.
  revised_text: Und sofort nötigte er die Jünger, ins Boot zu steigen und ihm ans andere Ufer vorauszufahren, bis er die Menschenmengen entlassen hatte.
