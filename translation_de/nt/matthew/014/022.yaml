revisions:
- from: Und sofort drängte er die Jünger, ins Boot zu steigen und ihm ans andere Ufer vorauszufahren, während er die Menschenmengen entließ.
  to: Und sofort nötigte er die Jünger, ins Boot zu steigen und ihm ans andere Ufer vorauszufahren, bis er die Menschenmengen entlassen hatte.
  rationale: Die Revision stellt die durch ἕως οὗ ausgedrückte zeitliche Begrenzung mit »bis« wieder her und gibt die abgeschlossene Entlassung in der deutschen Vergangenheitsdarstellung mit Plusquamperfekt wieder. »Nötigte« gibt die Stärke von ἠνάγκασεν genauer wieder. Alle übrigen Entscheidungen bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:44:41Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἕως οὗ ἀπολύσῃ mit »während er … entließ« ersetzt die im Griechischen ausgedrückte zeitliche Grenze (»bis«) durch Gleichzeitigkeit. Außerdem ist »drängte« für ἠνάγκασεν etwas zu schwach; das Verb bezeichnet hier eine nachdrückliche Veranlassung bzw. Nötigung.
  naturalness: Die übrige Formulierung ist flüssiges modernes Standarddeutsch. »Nötigte« ist in diesem erzählerischen Register idiomatisch und genauer als »drängte«. »Menschenmengen« bewahrt den griechischen Plural und ist verständlich.
  terminology: »Jünger«, »Boot«, »anderes Ufer« und »entlassen« sind angemessen. Eine Fußnote ist nicht erforderlich, da »entlassen« die Bedeutung von ἀπολύω in diesem Kontext klar abdeckt.
  issues:
