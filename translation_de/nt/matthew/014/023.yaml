id: MAT.14.23
reference: Matthew 14:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: de
  text: Nachdem er die Menschenmengen weggeschickt hatte, stieg er allein[a] auf den Berg, um zu beten. Als es Abend geworden war, war er dort allein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für sich« bzw. »abseits« (κατ’ ἰδίαν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: Nachdem er … weggeschickt hatte
  rationale: Das vorzeitige aoristische Partizip wird im Deutschen natürlich durch einen temporalen Nebensatz wiedergegeben; »wegschicken« trifft hier das Entlassen der versammelten Menschen.
- source_word: τοὺς ὄχλους
  choice: die Menschenmengen
  rationale: Die Pluralform bezeichnet die versammelten Gruppen; »Menschenmengen« ist modern und bewahrt den Plural.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: stieg … auf den Berg
  rationale: Die Formulierung gibt sowohl die Aufwärtsbewegung als auch das Ziel natürlich und knapp wieder.
- source_word: κατ’ ἰδίαν
  choice: allein
  rationale: Die Wendung kann »für sich«, »allein« oder »abseits« bedeuten. »Allein« passt zum räumlichen Rückzug und lässt die Wiederholung mit μόνος bewusst bestehen.
- source_word: προσεύξασθαι
  choice: um zu beten
  rationale: Der Infinitiv bezeichnet hier den Zweck des Hinaufsteigens.
- source_word: ὀψίας δὲ γενομένης
  choice: Als es Abend geworden war
  rationale: Der Genitivus absolutus wird als temporaler Nebensatz wiedergegeben; das Plusquamperfekt markiert den eingetretenen Zustand, ohne eine künstlich scharfe zeitliche Abfolge zu erzwingen.
- source_word: μόνος ἦν ἐκεῖ
  choice: war er dort allein
  rationale: Die Wortstellung ist idiomatisch und bewahrt die ausdrückliche Betonung seiner Einsamkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wiedergabe von κατ’ ἰδίαν und μόνος mit »allein« erhält die bewusste Betonung der Abgeschiedenheit; die Fußnote bewahrt die weitere Bedeutungsbreite der ersten Wendung.
