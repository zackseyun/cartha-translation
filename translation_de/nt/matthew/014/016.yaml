  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: de
  text: 'Jesus aber sagte zu ihnen: »Sie brauchen nicht wegzugehen. Gebt ihr ihnen zu essen!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet hier den milden Gegensatz zum Vorschlag der Jünger, die Menschen wegzuschicken.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Eine schlichte und natürliche Wiedergabe der griechischen Redeeinleitung.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: Sie brauchen nicht wegzugehen
  rationale: Gibt die idiomatische Verbindung χρείαν ἔχειν mit Infinitiv in natürlichem modernem Deutsch wieder.
- source_word: δότε αὐτοῖς ... φαγεῖν
  choice: Gebt ... ihnen zu essen
  rationale: Die deutsche Konstruktion »jemandem zu essen geben« entspricht der Bedeutung und benötigt kein zusätzliches unbestimmtes Objekt.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen wird durch die für den Imperativ sonst entbehrliche Form »ihr« hervorgehoben; die Wortstellung »Gebt ihr« bewahrt den Kontrast, ohne ihn mit »selbst« zu überdeuten.
theological_decisions:
- issue: Betonung der Rolle der Jünger im Befehl Jesu
  choice: 'Das ausdrückliche ὑμεῖς wird mit »ihr« wiedergegeben: »Gebt ihr ihnen zu essen!«'
  alternative: »Gebt ihnen selbst zu essen!« oder schlicht »Gebt ihnen zu essen!«
  rationale: Die gewählte Form bewahrt die grammatische Hervorhebung der Jünger als Handelnde, ohne festzulegen, ob »selbst« oder ein ausschließender Gegensatz gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Imperativ erhält durch das Ausrufezeichen seine mündliche Bestimmtheit; die natürliche Redewendung »zu essen geben« vermeidet eine unnötige Ergänzung wie »etwas«.
