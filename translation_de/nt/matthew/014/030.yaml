id: MAT.14.30
reference: Matthew 14:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: de
  text: 'Doch als er den starken Wind[a] sah, bekam er Angst. Als er zu sinken begann, schrie er: »Herr, rette mich![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »heftigen Wind«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann sowohl die Rettung aus unmittelbarer Gefahr als auch Heil und Rettung in einem umfassenderen Sinn bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: als er … sah
  rationale: Das Präsenspartizip bezeichnet eine gleichzeitig stattfindende Wahrnehmung. Ein temporaler Nebensatz ist im Deutschen natürlicher und bewahrt den Zusammenhang der Handlungen.
- source_word: δὲ
  choice: Doch
  rationale: Das Wort markiert den Gegensatz zu Petrus’ zuvor gelungenem Gehen auf dem Wasser und leitet die Wendung der Erzählung ein.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: den starken Wind
  rationale: ἰσχυρός beschreibt hier unmittelbar die Stärke des Windes. »Starker Wind« ist präzise und idiomatisch; »heftiger Wind« bleibt als mögliche Nuance vermerkt.
- source_word: ἐφοβήθη
  choice: bekam er Angst
  rationale: Die Form bezeichnet hier den Eintritt der Furcht. »Bekam er Angst« gibt diesen Beginn natürlicher wieder als das rein zuständliche »hatte er Angst«.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: als er zu sinken begann
  rationale: Die Wendung beschreibt den einsetzenden Vorgang des Versinkens. »Sinken« ist klar und übertreibt nicht zu »ertrinken«.
- source_word: ἔκραξεν λέγων
  choice: schrie er
  rationale: ἔκραξεν vermittelt einen lauten, dringlichen Ruf. Das im Griechischen folgende Partizip »sagend« muss vor direkter Rede im Deutschen nicht eigens wiedergegeben werden.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« ist die übliche und kontextgemäße Anrede für κύριε und bewahrt deren Gewicht in der Anrede an Jesus.
- source_word: σῶσόν με
  choice: rette mich
  rationale: Der Aoristimperativ formuliert einen unmittelbaren Hilferuf. »Rette mich« passt zur konkreten Lebensgefahr und bewahrt zugleich den weiteren Bedeutungsumfang von σῴζω.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede an Jesus
  choice: Herr
  alternative: Meister
  rationale: »Herr« entspricht der üblichen Bedeutung der Anrede und bewahrt ihre christologische Tragweite, ohne über den Text hinauszugehen.
- issue: Wiedergabe von σῴζω bei unmittelbarer körperlicher Gefahr
  choice: rette mich
  alternative: bring mich in Sicherheit
  rationale: Der Kontext betrifft die Rettung vor dem Versinken; zugleich sollte die breitere biblische Bedeutungsweite des Verbs nicht durch eine ausschließlich situationsbezogene Umschreibung eingeengt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die griechischen Partizipialkonstruktionen werden in natürliche deutsche Nebensätze überführt; die kurzen, dringlichen Worte des Hilferufs bleiben erhalten.
