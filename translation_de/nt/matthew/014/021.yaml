  source_fidelity: 'Die Übersetzung gibt die substantivierte Partizipialkonstruktion als Personengruppe wieder, bewahrt mit „Männer“ die spezifische Bedeutung von ἄνδρες und kennzeichnet mit „etwa“ die durch ὡσεί markierte Näherungsangabe. „Frauen und Kinder nicht mitgerechnet“ trifft χωρίς mit Genitiv präzise: Sie sind nicht in der genannten Zahl enthalten.'
