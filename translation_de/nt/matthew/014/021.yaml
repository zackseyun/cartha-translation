source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: de
  text: Diejenigen aber, die aßen, waren etwa fünftausend Männer, Frauen und Kinder nicht mitgerechnet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Diejenigen aber, die aßen
  rationale: Das substantivierte Präsenspartizip bezeichnet die Essenden bzw. Mahlzeitteilnehmer. Die Relativkonstruktion ist im Deutschen natürlich; „aber“ gibt δέ als leichten narrativen Anschluss wieder, ohne einen zeitlichen Ausdruck einzuführen.
- source_word: ἦσαν
  choice: waren
  rationale: Der Imperfekt von εἰμί bildet hier mit der ungefähren Zahl eine schlichte Aussage über die Größe der Gruppe.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἀνήρ bezeichnet hier männliche Personen, nicht Menschen allgemein; die anschließende ausdrückliche Nennung von Frauen und Kindern bestätigt diese Unterscheidung.
- source_word: ὡσεὶ πεντακισχίλιοι
  choice: etwa fünftausend
  rationale: ὡσεί kennzeichnet eine ungefähre Zahl; „etwa“ ist präzise und idiomatisch.
- source_word: χωρὶς γυναικῶν καὶ παιδίων
  choice: Frauen und Kinder nicht mitgerechnet
  rationale: χωρίς mit Genitiv schließt Frauen und Kinder aus der genannten Zahl aus. Die deutsche Wendung macht den Zählbezug unmissverständlich und bleibt natürlich.
theological_decisions:
- issue: Geschlechtsspezifische Zählangabe in einer gemischten Menschenmenge
  choice: ἄνδρες wird mit „Männer“ übersetzt; Frauen und Kinder werden ausdrücklich als nicht mitgezählt bezeichnet.
  alternative: „Menschen“ oder „Personen“
  rationale: Die allgemeineren Alternativen würden die im griechischen Text ausdrücklich vorgenommene Unterscheidung einebnen. Der Vers nennt ungefähr fünftausend Männer, ohne damit die Gesamtzahl aller Anwesenden festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die Nachstellung „Frauen und Kinder nicht mitgerechnet“ vermeidet die im Deutschen mögliche Unklarheit von „außer Frauen und Kindern“. Kein Fußnotenapparat ist nötig, da die Bedeutung von χωρίς im Haupttext eindeutig wiedergegeben wird.
