- from: Denn Herodes hatte Johannes festnehmen, fesseln und ins Gefängnis werfen lassen[a] – wegen Herodias, der Frau seines Bruders Philippus.
  to: Denn Herodes hatte Johannes[a] festgenommen, gefesselt und wegen Herodias, der Frau seines Bruders Philippus, ins Gefängnis gesetzt.
  rationale: Die Revision entfernt die vom Ausgangstext nicht gedeckte Kausativbedeutung und gibt die drei Handlungen des Herodes direkt wieder. Sie bewahrt den begründenden Anschluss von „Denn“, die zeitliche Vorordnung durch das Plusquamperfekt, die neutrale Benennung der Herodias-Beziehung und den Fußnotenanker. Die Fußnote bietet für κρατήσας die nähere lexikalische Alternative „ergriffen“ an.
