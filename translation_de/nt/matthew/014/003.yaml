source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: de
  text: Denn Herodes hatte Johannes[a] festgenommen, gefesselt und wegen Herodias, der Frau seines Bruders Philippus, ins Gefängnis gesetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Denn Herodes hatte Johannes ergriffen, gefesselt und wegen Herodias, der Frau seines Bruders Philippus, ins Gefängnis gesetzt.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende Verbindung zum vorausgehenden Kontext und ist im Deutschen natürlich.
- source_word: κρατήσας
  choice: hatte ... festnehmen lassen
  rationale: Das vorzeitige Partizip bezeichnet hier die vorausgehende Ergreifung beziehungsweise Verhaftung; die Kausativform passt dazu, dass Herodes als Herrscher durch seine Leute handelt.
- source_word: ἔδησεν
  choice: fesseln ... lassen
  rationale: Gibt das konkrete δέω wieder, ohne die Art der Fesselung als Ketten oder Stricke festzulegen.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: ins Gefängnis werfen lassen
  rationale: Gibt die Einweisung in Haft idiomatisch und verständlich wieder; die Fußnote hält eine formal nähere Wiedergabe fest.
- source_word: διὰ Ἡρῳδιάδα
  choice: wegen Herodias
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder Anlass.
- source_word: γυναῖκα
  choice: Frau
  rationale: Im relationalen Zusammenhang bezeichnet γυνή die Ehefrau; das deutsche „Frau“ ist in dieser Konstruktion natürlich und eindeutig.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: seines Bruders Philippus
  rationale: Die deutsche Genitivfügung macht klar, dass Philippus der Bruder des Herodes ist, und bewahrt die sachliche Identifikation.
theological_decisions:
- issue: Historisch-moralische Einordnung von Herodias’ Beziehung zu Philippus
  choice: „Herodias, der Frau seines Bruders Philippus“ ohne zusätzlichen wertenden Ausdruck
  alternative: „Herodias, der Frau des Philippus, seines Bruders“ oder eine ausdrückliche Bezeichnung der Verbindung als unrechtmäßig
  rationale: Der Vers identifiziert Herodias über ihre Beziehung zu Philippus, spricht das moralische Urteil aber erst im folgenden Vers ausdrücklich aus. Dieses Urteil wird daher hier nicht vorweggenommen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Gedankenstrich gliedert den längeren Satz und hebt die Begründung hervor. Die Fußnote bewahrt die formal nähere Partizipialstruktur und die konkretere Grundbedeutung von κρατέω.
