review_pass:
  verdict: revise
  source_fidelity: Die Kausativkonstruktionen „festnehmen, fesseln und ... werfen lassen“ sind im griechischen Text nicht angelegt. Herodes ist ausdrücklich Subjekt der drei Verben (κρατήσας, ἔδησεν, ἀπέθετο); eine Veranlassung durch Untergebene mag historisch naheliegen, wird aber nicht ausgedrückt. Die direkte Wiedergabe wahrt zudem die Abfolge Ergreifen/Verhaften, Fesseln und Einsperren.
  naturalness: Die revidierte Fassung ist modernes, gut lesbares Standarddeutsch. „Ins Gefängnis gesetzt“ ist gegenüber „geworfen“ neutraler und entspricht ἐν φυλακῇ ἀπέθετο genauer. Die eingeschobene Identifikation von Herodias ist syntaktisch klar.
  terminology: „Herodes“, „Johannes“, „Herodias“ und „Philippus“ sind korrekt. „Frau seines Bruders Philippus“ gibt γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ neutral wieder, ohne das im folgenden Vers formulierte moralische Urteil vorwegzunehmen.
  issues:
  - severity: high
    issue: Unbegründete Kausativform „... lassen“
    rationale: Das Griechische schreibt Herodes die Handlungen aktiv zu. Die deutsche Kausativform fügt die nicht ausgedrückte Aussage hinzu, dass er andere handeln ließ.
  - severity: low
    issue: „ins Gefängnis werfen“ ist unnötig zugespitzt
    rationale: ἀπέθετο bezeichnet hier das Inhaftieren bzw. Unterbringen im Gefängnis; „ins Gefängnis gesetzt“ ist genauer und im Deutschen neutraler.
  revised_text: Denn Herodes hatte Johannes[a] festgenommen, gefesselt und wegen Herodias, der Frau seines Bruders Philippus, ins Gefängnis gesetzt.
