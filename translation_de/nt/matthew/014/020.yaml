  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: de
  text: 'Und alle aßen und wurden satt. Dann sammelten sie die übrig gebliebenen Stücke[a] auf: zwölf volle Körbe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bruchstücke“. Das griechische Wort kann abgebrochene, nach dem Essen übrig gebliebene Stücke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: aßen
  rationale: Der Aorist von ἐσθίω wird in der deutschen Erzählung natürlich mit dem Präteritum wiedergegeben.
- source_word: πάντες
  choice: alle
  rationale: Bewahrt den umfassenden Bezug auf die versammelte Menge.
- source_word: ἐχορτάσθησαν
  choice: wurden satt
  rationale: χορτάζω bezeichnet hier, dass alle vollständig zu essen bekamen; „wurden satt“ ist idiomatisch, klar und wahrt die Aussage über die Fülle der Speisung.
- source_word: ἦραν
  choice: sammelten ... auf
  rationale: αἴρω bedeutet grundsätzlich „aufheben/aufnehmen“; beim Einsammeln der Reste ist „aufsammeln“ im Deutschen die natürliche kontextuelle Wiedergabe.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: die übrig gebliebenen Brotstücke
  rationale: Das substantivierte περισσεῦον bezeichnet das Übriggebliebene, κλάσματα abgebrochene Stücke. Aus dem Speisungskontext ergibt sich, dass Brotstücke gemeint sind.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: zwölf volle Körbe
  rationale: Gibt Zahl, Behältnis und Füllzustand knapp und unmittelbar wieder; der Doppelpunkt verdeutlicht natürlich, dass dies das Ergebnis des Aufsammelns ist.
theological_decisions:
- issue: Beschreibung der wunderbaren Speisung mit gewöhnlicher Sättigungssprache
  choice: wurden satt
  alternative: wurden gesättigt
  rationale: Die Formulierung gibt die vollständige Versorgung wieder, ohne zusätzliche theologische Deutung einzutragen oder das Wunder sprachlich auszuschmücken.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die zwei Hauptsätze werden zur besseren Lesbarkeit getrennt; „Dann“ macht die im Kontext erkennbare Handlungsfolge deutlich. Der Doppelpunkt bildet die nachgestellte Mengenangabe des Griechischen natürlich ab.
