  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: de
  text: Und obwohl er ihn töten wollte[a], fürchtete er die Menschenmenge, denn sie hielten ihn für einen Propheten[b].
  philosophy: optimal-equivalence
  footnotes:
