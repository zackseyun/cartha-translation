    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: obwohl er … wollte
  rationale: Das Partizip bezeichnet hier im Zusammenhang einen eingeräumten Wunsch, dem die Furcht vor der Menge entgegensteht. Die konzessive Wiedergabe ist im Deutschen natürlich und macht diesen Zusammenhang deutlich.
- source_word: ἀποκτεῖναι
  choice: töten
  rationale: Das Verb bedeutet direkt „töten“ beziehungsweise „zu Tode bringen“. „Ermorden“ würde eine zusätzliche rechtlich-moralische Wertung eintragen.
- source_word: ἐφοβήθη
  choice: fürchtete er
  rationale: Die knappe Präteritumform entspricht dem erzählenden Aorist und wahrt den würdigen Erzählton.
- source_word: τὸν ὄχλον
  choice: die Menschenmenge
  rationale: ὄχλος bezeichnet hier die versammelte Menge. „Menschenmenge“ ist klarer als das mögliche, aber mehrdeutige „Volk“.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt den Grund für seine Furcht ein. „Denn“ ist in diesem Satzfluss natürlich; auch „weil“ wäre möglich.
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: sie hielten ihn für einen Propheten
  rationale: Die Konstruktion mit ἔχω und prädikativem Akkusativ bezeichnet eine Einschätzung. Die deutsche Wendung „jemanden für etwas halten“ bildet dies idiomatisch und präzise ab.
theological_decisions:
- issue: Im griechischen Text bleiben Subjekt und Objekt als Pronomen stehen.
  choice: Die Pronomen „er“ und „ihn“ werden beibehalten.
  alternative: Die Namen „Herodes“ und „Johannes“ ausdrücklich einsetzen.
  rationale: Der unmittelbare Kontext klärt die Bezüge. Das Beibehalten der Pronomen folgt der Form des Ausgangstextes und vermeidet eine explizierende Ergänzung.
- issue: Verhältnis des Partizips θέλων zum Hauptverb ἐφοβήθη
  choice: 'Konzessiv: „obwohl er … wollte“'
  alternative: 'Formal näher: „da er ihn töten wollte“ oder „ihn töten wollend“'
  rationale: Der Kontext zeigt die Spannung zwischen Tötungsabsicht und Furcht vor der Menge. Die konzessive Wiedergabe drückt diese sachlich naheliegende Beziehung in natürlichem Deutsch aus, während die Fußnote die formal offenere Partizipialkonstruktion dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdevollem Erzählton. „Menschenmenge“ vermeidet die mögliche politische oder ethnische Nebenbedeutung von „Volk“; die Pronomen des griechischen Textes bleiben erhalten.
