  to: Und sie baten ihn inständig, dass sie auch nur den Saum[a] seines Gewandes berühren dürften. Und alle, die den Saum berührten, wurden geheilt.[b]
  rationale: Die Revision schärft die Wiedergabe von μόνον durch „auch nur“ und ersetzt das potenziell auf Jesus beziehbare Pronomen durch „den Saum“. Damit wird der vom Kontext vorgegebene Bezug der ausgelassenen zweiten Form von ἅπτομαι transparent, ohne den griechischen Sinn zu verändern. Die Fußnotenanker und die lexikalischen Hinweise bleiben korrekt zugeordnet.
