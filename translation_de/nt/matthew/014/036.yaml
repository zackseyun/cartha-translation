  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: de
  text: Und sie baten ihn inständig, dass sie auch nur den Saum[a] seines Gewandes berühren dürften. Und alle, die den Saum berührten, wurden geheilt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rand“, „Fransen“ oder „Quaste“; das griechische Wort kann den Saum beziehungsweise Rand eines Gewandes und möglicherweise dessen Quaste bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurden gesund“ beziehungsweise „wurden gerettet“. Das griechische Verb kann Heilung, Bewahrung oder Rettung ausdrücken; hier weist der Zusammenhang auf körperliche Heilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: baten ihn inständig
  rationale: Der Imperfekt kann ein anhaltendes oder wiederholtes Bitten ausdrücken; „baten ihn inständig“ gibt die Dringlichkeit in natürlichem Deutsch wieder.
- source_word: ἵνα μόνον ἅψωνται
  choice: wenigstens … berühren zu dürfen
  rationale: Die ἵνα-Konstruktion bezeichnet den Inhalt der Bitte. μόνον hebt hervor, dass ihnen schon die bloße Berührung genügte; „wenigstens“ vermittelt diesen Sinn idiomatisch.
- source_word: τοῦ κρασπέδου
  choice: den Saum
  rationale: κράσπεδον kann den Rand, Saum oder die Franse beziehungsweise Quaste eines Kleidungsstücks bezeichnen. „Saum“ ist verständlich und legt die genaue Form nicht unnötig fest.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: seines Gewandes
  rationale: ἱμάτιον bezeichnet hier allgemein ein Kleidungsstück, wahrscheinlich ein Obergewand. „Gewand“ bewahrt diese Breite.
- source_word: ὅσοι
  choice: alle, die
  rationale: ὅσοι hat einen umfassenden relativen Sinn. „Alle, die“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe wie „so viele, wie“.
- source_word: ἥψαντο
  choice: ihn berührten
  rationale: Das im Griechischen nicht ausdrücklich wiederholte Objekt wird aus dem vorherigen Ausdruck erschlossen. Das maskuline Pronomen „ihn“ bezieht sich grammatisch auf den Saum und vermeidet das im Deutschen unklare „es“.
- source_word: διεσώθησαν
  choice: wurden geheilt
  rationale: διασῴζω kann retten, bewahren oder vollständig gesund machen bedeuten. Im unmittelbaren Zusammenhang körperlicher Krankheiten ist „wurden geheilt“ die klare kontextuelle Wiedergabe.
theological_decisions:
- issue: Bedeutung von διεσώθησαν im Zusammenhang der Heilungswunder
  choice: körperliche Heilung („wurden geheilt“)
  alternative: „wurden gerettet“ oder „wurden gesund“
  rationale: Der weitere Bedeutungsumfang des Verbs wird nicht geleugnet, doch der unmittelbare Kontext handelt von körperlich Kranken. Die Übersetzung vermeidet es, dem Vers ausdrücklich eine soteriologische Aussage zuzuschreiben.
- issue: Bezug der wirksamen Berührung
  choice: grammatischer Bezug auf den Saum, ohne die Heilwirkung einem Gegenstand zuzuschreiben
  alternative: allgemeiner Bezug auf Jesus oder sein Gewand
  rationale: Der griechische Text lässt das Objekt beim zweiten ἥψαντο unausgesprochen und setzt es aus dem Kontext voraus. Die Übersetzung bleibt beim nächstliegenden grammatischen Bezug, ohne eine Lehre über die eigenständige Wirksamkeit des Gewandes zu formulieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Baten ihn inständig“ bewahrt die Dringlichkeit, ohne altertümlich zu wirken. Die beiden Fußnoten kennzeichnen die echte Bedeutungsbreite von κράσπεδον und διασῴζω.
