  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: de
  text: Nachdem sie hinübergefahren waren, kamen sie im Gebiet von Gennesaret an Land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „kamen sie auf das Land nach Gennesaret“. Das Griechische verbindet „auf das Land“ mit „nach Gennesaret“ und bezeichnet damit wohl die Landung in der Gegend von Gennesaret.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: Nachdem sie hinübergefahren waren
  rationale: Das vorzeitige Aoristpartizip bezeichnet eine vor der Ankunft abgeschlossene Überfahrt. Im Zusammenhang mit der Fahrt über den See gibt „hinübergefahren“ die Bewegung natürlich wieder, ohne das im Verb nicht ausdrücklich genannte Verkehrsmittel eigens zu benennen.
- source_word: ἦλθον
  choice: kamen … an
  rationale: Der Aorist von ἔρχομαι bezeichnet hier das Erreichen des Ziels; zusammen mit „an Land“ ist „kamen … an“ im Deutschen idiomatisch.
- source_word: ἐπὶ τὴν γῆν
  choice: an Land
  rationale: Wörtlich steht „auf das Land“. Im Kontext einer Seeüberfahrt bezeichnet die Wendung die Ankunft vom Wasser her und wird natürlich mit „an Land“ wiedergegeben.
- source_word: εἰς Γεννησαρέτ
  choice: im Gebiet von Gennesaret
  rationale: Die Präposition εἰς hat Zielrichtung; in Verbindung mit ἐπὶ τὴν γῆν ist Gennesaret am ehesten die Gegend, in der sie landeten. Die Formulierung vermeidet die irreführende Festlegung auf eine gleichnamige Stadt.
- source_word: Γεννησαρέτ
  choice: Gennesaret
  rationale: Der geografische Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die natürliche Wendung „an Land kommen“ bewahrt den maritimen Zusammenhang; die Fußnote dokumentiert die ungewöhnliche griechische Präpositionsverbindung.
