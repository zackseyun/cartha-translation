  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Textes genau wieder: Die Jünger des Johannes kommen, nehmen seinen Leichnam, bestatten ihn und melden dies Jesus. „Leichnam“ trifft πτῶμα als toten Körper präzise; „begruben ihn“ entspricht ἔθαψαν αὐτόν ohne zusätzliche Angaben. Die finite Wiedergabe der Partizipien ist im Deutschen idiomatisch und bewahrt die narrative Folge.'
