  terminology: „Jünger“, „Leichnam“ und „Jesus“ sind konsistent, etabliert und kontextgerecht. Das Pronomen in „Seine Jünger“ bewahrt die Formulierung des Ausgangstextes, ohne die kontextuell eindeutige Bezugnahme auf Johannes unnötig auszuformulieren.
