id: MAT.14.12
reference: Matthew 14:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: de
  text: Seine Jünger kamen, nahmen den Leichnam und begruben ihn. Dann gingen sie zu Jesus und berichteten ihm davon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: kamen
  rationale: Das Aoristpartizip leitet die Handlung der Jünger ein. „Kamen“ ist im Deutschen natürlich; „traten heran“ wäre möglich, klänge hier aber unnötig förmlich.
- source_word: μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Der Ausdruck bezeichnet im unmittelbaren Zusammenhang die Jünger Johannes des Täufers. „Jünger“ bewahrt den etablierten Beziehungs- und Lernbegriff.
- source_word: ἦραν
  choice: nahmen
  rationale: αἴρω kann „aufheben“ oder „nehmen“ bedeuten. Im Zusammenhang der Bestattung gibt „nahmen“ die Handlung knapp wieder, ohne zusätzliche Einzelheiten einzutragen.
- source_word: πτῶμα
  choice: Leichnam
  rationale: πτῶμα bezeichnet ausdrücklich einen toten Körper. „Leichnam“ ist im Deutschen eindeutig, würdevoll und für einen Bestattungsbericht natürlicher als „Leiche“.
- source_word: ἔθαψαν αὐτόν
  choice: begruben ihn
  rationale: Die direkte Wiedergabe von θάπτω und dem männlichen Pronomen bewahrt den Wechsel von „Leichnam“ zur Person, ohne eine Grabform hinzuzufügen.
- source_word: ἐλθόντες
  choice: Dann gingen sie zu
  rationale: Das Partizip bezeichnet die anschließende Bewegung zu Jesus. Eine finite Verbform mit „Dann“ ergibt einen natürlichen deutschen Erzählfluss.
- source_word: ἀπήγγειλαν
  choice: berichteten ihm davon
  rationale: ἀπαγγέλλω bedeutet „berichten“ oder „melden“. „Davon“ macht den im Griechischen unausgesprochenen Inhalt idiomatisch deutlich, ohne ihn enger festzulegen.
- source_word: τῷ Ἰησοῦ
  choice: zu Jesus … ihm
  rationale: Der Dativ bezeichnet den Empfänger des Berichts; die deutsche Formulierung verbindet die Bewegung zu Jesus mit dem anschließenden Berichten.
theological_decisions:
- issue: Bezug von „seine Jünger“
  choice: Die Jünger Johannes des Täufers sind gemeint; der Text bleibt bei „seine Jünger“.
  alternative: Die Jünger Jesu
  rationale: Der unmittelbare Kontext handelt von der Hinrichtung und Bestattung Johannes. Daher bezieht sich αὐτοῦ natürlicherweise auf Johannes; die Übersetzung bewahrt dennoch die pronominale Form des Griechischen.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. „Leichnam“ wahrt sowohl die ausdrückliche Bedeutung von πτῶμα als auch einen respektvollen Ton. Die beiden griechischen Partizipialkonstruktionen werden für natürlichen deutschen Satzfluss in finite Verben überführt.
