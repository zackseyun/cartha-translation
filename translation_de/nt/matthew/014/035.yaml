  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: de
  text: Als die Männer jenes Ortes ihn erkannten, sandten sie in die ganze umliegende Gegend[a] und brachten alle Kranken[b] zu ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sandten sie überall in jener ganzen umliegenden Gegend Boten aus«. Im Griechischen bleibt das Objekt – etwa eine Nachricht oder Boten – unausgesprochen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »alle, denen es schlecht ging«; eine Wendung für Kranke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: erkannten
  rationale: Das Aoristpartizip bezeichnet hier das Wiedererkennen beziehungsweise Identifizieren Jesu im Erzählzusammenhang.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: die Männer jenes Ortes
  rationale: ἀνήρ bezeichnet ausdrücklich Männer; τόπος meint die betreffende Örtlichkeit.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: sandten sie in die ganze umliegende Gegend
  rationale: Die Übersetzung bewahrt das im Griechischen fehlende Objekt, statt ausdrücklich »Nachricht« oder »Boten« einzufügen; περίχωρος bezeichnet das Umland.
- source_word: προσήνεγκαν αὐτῷ
  choice: brachten ... zu ihm
  rationale: προσφέρω bezeichnet hier das Herbeibringen von Personen zu Jesus, nicht ein kultisches Darbringen.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: alle Kranken
  rationale: κακῶς ἔχειν ist eine geläufige Wendung für Krank- oder Unwohlsein; »alle Kranken« gibt sie knapp und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewohnte objektlose Formulierung »sandten sie in ...« erhält die syntaktische Offenheit des griechischen Textes; die Fußnote erläutert den wahrscheinlichen Sinn.
