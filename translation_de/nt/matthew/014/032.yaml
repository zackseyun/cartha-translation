  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: de
  text: Und als sie in das Boot gestiegen waren,[a] legte sich der Wind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nachdem sie in das Boot hinaufgestiegen waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Setzt die Erzählfolge schlicht fort, ohne die zeitliche Beziehung stärker auszudeuten.
- source_word: ἀναβάντων αὐτῶν
  choice: als sie … gestiegen waren
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben. „In das Boot steigen“ bewahrt die Grundbedeutung von ἀναβαίνω und ist im Deutschen idiomatisch.
- source_word: εἰς τὸ πλοῖον
  choice: in das Boot
  rationale: πλοῖον bezeichnet hier das Boot der Jünger auf dem See; „Schiff“ würde für den Kontext unnötig groß wirken.
- source_word: ἐκόπασεν
  choice: legte sich
  rationale: κοπάζω bezeichnet beim Wind dessen Nachlassen beziehungsweise Aufhören. „Der Wind legte sich“ ist eine natürliche und genaue deutsche Wendung.
- source_word: ὁ ἄνεμος
  choice: der Wind
  rationale: Direkte Wiedergabe des bestimmten Subjekts.
theological_decisions:
- issue: Erzählerische Andeutung der Vollmacht Jesu über die Natur
  choice: Das Ereignis wird ohne deutenden Zusatz wiedergegeben.
  alternative: Eine stärker interpretierende Formulierung, die Jesu wunderwirkende Vollmacht ausdrücklich hervorhebt.
  rationale: Der zeitliche Zusammenhang ist im Text erkennbar; seine theologische Bedeutung soll aus dem Kontext hervorgehen und nicht durch zusätzliche Übersetzungswörter festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „in das Boot gestiegen“ klingt natürlich und bleibt zugleich näher an der räumlichen Bildsprache des griechischen ἀναβαίνω als das ebenfalls mögliche „ins Boot gegangen“.
