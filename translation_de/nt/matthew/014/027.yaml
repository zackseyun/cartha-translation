id: MAT.14.27
reference: Matthew 14:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: de
  text: 'Doch sofort sprach Jesus zu ihnen: „Fasst Mut! Ich bin es.[a] Habt keine Angst!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich bin.“ Das Griechische kann hier der einfachen Selbstidentifikation dienen; manche hören darin jedoch auch einen möglichen Anklang an die göttliche Selbstbezeichnung.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: sofort
  rationale: Gibt die zeitliche Unmittelbarkeit in natürlichem, modernem Deutsch knapp wieder.
- source_word: δὲ
  choice: doch
  rationale: Markiert den leichten Gegensatz zur Angst der Jünger im vorangehenden Vers und führt die Wendung der Szene ein.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: sprach Jesus zu ihnen
  rationale: Natürliches deutsches Erzählidiom; das redundante griechische Partizip λέγων muss vor der direkten Rede nicht eigens mit „und sagte“ wiedergegeben werden.
- source_word: Θαρσεῖτε
  choice: Fasst Mut!
  rationale: Der pluralische Imperativ ruft zu Mut und Zuversicht auf; die Wendung ist klar, gegenwärtig und würdevoll.
- source_word: ἐγώ εἰμι
  choice: Ich bin es.
  rationale: Im unmittelbaren Zusammenhang identifiziert Jesus sich gegenüber den erschrockenen Jüngern. Die wörtlichere Form „Ich bin“ bleibt in der Fußnote erhalten.
- source_word: μὴ φοβεῖσθε
  choice: Habt keine Angst!
  rationale: Natürliche moderne Wiedergabe des verneinten Imperativs, ohne durch „Hört auf, Angst zu haben“ den Aspekt überzubestimmen.
theological_decisions:
- issue: Ob ἐγώ εἰμι nur als Selbstidentifikation oder als möglicher Anklang an die göttliche Selbstbezeichnung wiederzugeben ist
  choice: Im Haupttext steht die kontextgemäße Selbstidentifikation „Ich bin es“.
  alternative: 'Wörtlicher: „Ich bin“.'
  rationale: Die Szene verlangt zunächst eine verständliche Identifikation Jesu. Zugleich wird die mögliche weitergehende theologische Resonanz nicht ausgeschlossen, sondern durch die Fußnote sichtbar bewahrt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. Kurze Ausrufe bewahren die Dringlichkeit und den tröstenden Charakter der Rede.
