id: MAT.14.28
reference: Matthew 14:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: de
  text: 'Petrus aber antwortete ihm: „Herr, wenn du es bist, dann befiehl mir, auf den Wassern[a] zu dir zu kommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Wasser“. Im Griechischen steht „Wasser“ im Plural.'
    reason: Lexikalische Alternative; der Haupttext bewahrt den griechischen Plural, während der Singular im Deutschen geläufiger ist.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Petrus aber antwortete ihm
  rationale: Die geläufige Erzählformel wird natürlich und zugleich strukturnah wiedergegeben. „Aber“ bewahrt die leichte weiterführende beziehungsweise kontrastierende Funktion von δέ, ohne sie zu überzeichnen.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist die übliche und kontextuell angemessene Wiedergabe von κύριε; sie wahrt sowohl die respektvolle Anrede als auch ihr mögliches christologisches Gewicht.
- source_word: εἰ σὺ εἶ
  choice: wenn du es bist
  rationale: Diese idiomatische deutsche Formulierung drückt die im Kontext gemeinte persönliche Identifikation aus, ohne zusätzliche Deutung einzutragen.
- source_word: κέλευσόν με
  choice: befiehl mir
  rationale: κελεύω bezeichnet hier eine autoritative Aufforderung. „Befiehl mir“ bewahrt diese Stärke und klingt im modernen Deutsch klar.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: zu dir zu kommen
  rationale: Die Bewegung ist auf Jesus hin gerichtet; „zu dir zu kommen“ entspricht sowohl der Perspektive des Sprechers als auch dem deutschen Sprachgebrauch.
- source_word: ἐπὶ τὰ ὕδατα
  choice: auf den Wassern
  rationale: Der Plural des griechischen Textes wird bewusst bewahrt. Die Formulierung ist im Deutschen etwas feierlicher als der idiomatische Singular, bleibt aber verständlich und gibt die Bildhaftigkeit der Vorlage wieder.
theological_decisions:
- issue: Bedeutungsumfang der Anrede κύριε an Jesus
  choice: Herr
  alternative: Meister; mein Herr
  rationale: „Herr“ reduziert die Anrede weder auf bloße Höflichkeit noch legt sie eine über den Text hinausgehende dogmatische Aussage fest. So bleibt die mögliche christologische Bedeutung offen.
- issue: Sinn von εἰ σὺ εἶ
  choice: wenn du es bist
  alternative: wenn du derjenige bist; wenn du es wirklich bist
  rationale: Die gewählte Fassung wahrt die Bedingungsform und die Frage nach der Identität. Ein Zusatz wie „wirklich“ würde eine Betonung eintragen, die im griechischen Text nicht ausdrücklich formuliert ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am griechischen Text, ohne unnatürlich zu wirken. „Auf den Wassern“ ist bewusst leicht gehoben, um den Plural der Vorlage zu erhalten; die idiomatischere deutsche Alternative steht in der Fußnote.
