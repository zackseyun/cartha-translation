  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: de
  text: Obwohl der König betrübt war, befahl er wegen seiner Eide und seiner Tischgäste[a], dass es gegeben werde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die mit ihm zu Tisch lagen“. Bei festlichen Mahlzeiten lag man damals gewöhnlich zu Tisch.'
    reason: cultural_note
  - marker: b
    text: Im Griechischen bleibt unausgesprochen, was gegeben werden sollte; gemeint ist das zuvor Erbetene.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: obwohl … betrübt war
  rationale: Das Aoristpassiv-Partizip bezeichnet den betrübten Zustand des Königs. Die konzessive Wiedergabe macht die im Zusammenhang erkennbare Spannung zwischen seiner Betrübnis und seinem anschließenden Befehl deutlich, ohne einen zusätzlichen Beweggrund einzuführen.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Die direkte und kontextgemäße Entsprechung von βασιλεύς ist „König“.
- source_word: διὰ τοὺς ὅρκους
  choice: wegen seiner Eide
  rationale: διά mit Akkusativ gibt hier den Grund an. „Seiner“ erschließt sich aus dem Zusammenhang und bezeichnet die vom König geleisteten Eide.
- source_word: τοὺς συνανακειμένους
  choice: derer, die mit ihm aßen
  rationale: Der Ausdruck bezeichnet die gemeinsam mit ihm zu Tisch Liegenden. Die Formulierung gibt die gemeinsame Mahlzeit in natürlichem modernem Deutsch wieder; die damalige Tischhaltung wird in einer Fußnote erläutert.
- source_word: ἐκέλευσεν
  choice: befahl er
  rationale: κελεύω bezeichnet einen verbindlichen Befehl; „befahl“ entspricht dem knappen erzählerischen Stil.
- source_word: δοθῆναι
  choice: es zu geben
  rationale: Der passive Infinitiv bedeutet wörtlich „gegeben zu werden“. Das im Griechischen unausgesprochene Objekt ergibt sich aus der Bitte im vorhergehenden Zusammenhang; „es“ bewahrt diese knappe Rückverweisung, während die deutsche Infinitivkonstruktion idiomatisch bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die konzessive Partizipialkonstruktion wird natürlich als Nebensatz wiedergegeben. Beide Begründungen mit διά werden durch die wiederholte Präposition „wegen“ klar auf den Befehl bezogen; die Ellipse am Versende bleibt erhalten.
