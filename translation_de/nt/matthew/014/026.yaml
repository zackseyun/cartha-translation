id: MAT.14.26
reference: Matthew 14:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: de
  text: 'Als die Jünger ihn aber auf dem See gehen sahen, erschraken sie und sagten: »Es ist ein Gespenst!« Und vor Angst schrien sie auf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten erzählerischen Kontrast zur vorausgehenden Szene und passt zur plötzlich einsetzenden Furcht der Jünger.
- source_word: μαθηταὶ
  choice: die Jünger
  rationale: Der Artikel bezeichnet die aus dem Zusammenhang bekannte Gruppe; ein zusätzliches »seine« ist nicht erforderlich.
- source_word: ἰδόντες αὐτὸν
  choice: als sie ihn ... sahen
  rationale: Das Aoristpartizip wird in natürlichem Deutsch als temporaler Nebensatz wiedergegeben.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: auf dem See gehen
  rationale: ἐπί mit Genitiv bezeichnet hier das Gehen auf der Oberfläche des Sees. »Auf dem See« wahrt die Wortwahl θάλασσα und ist im Kontext klar.
- source_word: ἐταράχθησαν
  choice: erschraken sie
  rationale: ταράσσω bezeichnet hier angesichts der vermeintlichen Erscheinung eine heftige innere Erschütterung; »erschraken« gibt dies idiomatisch wieder, ohne die Intensität unnötig zu steigern.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das begleitende Partizip leitet den Ausruf ein; die koordinierte Wiedergabe ist im Deutschen flüssig.
- source_word: Φάντασμά ἐστιν
  choice: Es ist ein Gespenst!
  rationale: φάντασμα bezeichnet eine geisterhafte Erscheinung. »Gespenst« ist im modernen Deutschen verständlich und gibt die erschrockene Deutung der Jünger wieder.
- source_word: ἀπὸ τοῦ φόβου
  choice: vor Angst
  rationale: ἀπό bezeichnet hier Ursache beziehungsweise Beweggrund; »vor Angst« ist die natürliche deutsche Wendung.
- source_word: ἔκραξαν
  choice: schrien sie auf
  rationale: κράζω bezeichnet einen lauten Ruf oder Schrei; »aufschreien« passt unmittelbar zur geschilderten Schreckreaktion.
theological_decisions:
- issue: Wesen des φάντασμα im Ausruf der Jünger
  choice: Im Haupttext mit »Gespenst« wiedergegeben
  alternative: Erscheinung; Spukgestalt; Phantom
  rationale: Der Satz berichtet die angstbedingte, irrige Deutung der Jünger und macht keine eigenständige ontologische Aussage über Geister. »Gespenst« vermittelt diese Wahrnehmung verständlich, ohne darüber hinaus eine Lehre festzulegen.
translation_notes:
  register: Modernes, würdiges ErzählDeutsch. Die Wortstellung hält den Blick zunächst auf der Wahrnehmung der Jünger und führt dann unmittelbar zu ihrer Reaktion. Keine Fußnote ist nötig, da »Gespenst« den Bedeutungsbereich von φάντασμα im Kontext ausreichend klar wiedergibt.
