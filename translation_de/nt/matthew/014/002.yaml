source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: de
  text: 'Und er sagte zu seinen Dienern: »Das ist Johannes der Täufer. Er ist von den Toten auferweckt worden, und deshalb wirken die Kräfte[a] in ihm.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Wunderkräfte«; sinngemäßer: »die Wunder«. Wörtlich steht im Griechischen »die Kräfte« (αἱ δυνάμεις), womit übernatürliche Kräfte gemeint sind, die sich in machtvollen Taten zeigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: Dienern
  rationale: παῖς kann je nach Zusammenhang »Kind«, »Diener« oder »Bediensteter« bedeuten. Hier sind Angehörige von Herodes’ Haushalt beziehungsweise Hof gemeint; »Diener« gibt das soziale Verhältnis wieder, ohne einen bestimmten Hofrang vorauszusetzen.
- source_word: ὁ βαπτιστής
  choice: der Täufer
  rationale: »Johannes der Täufer« ist die geläufige und sachlich zutreffende deutsche Wiedergabe des Beinamens.
- source_word: ἠγέρθη
  choice: ist … auferweckt worden
  rationale: Die passive Verbform wird ausdrücklich passiv wiedergegeben. So bleibt offen, wer Johannes auferweckt haben soll, und Herodes’ Aussage wird nicht über den griechischen Wortlaut hinaus gedeutet.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: von den Toten
  rationale: Dies ist die natürliche deutsche Wiedergabe der festen griechischen Wendung und bezeichnet die Rückkehr aus dem Bereich der Toten.
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: 'Die knappe, natürliche Konjunktion bewahrt den kausalen Schluss: Herodes führt die wirksamen Kräfte auf die vermeintliche Auferweckung des Johannes zurück.'
- source_word: αἱ δυνάμεις
  choice: diese Kräfte
  rationale: δύναμις bezeichnet hier übernatürliche Kraft, die sich in machtvollen Taten zeigt. »Kräfte« hält den Begriff offen, statt ihn vollständig mit den daraus hervorgehenden »Wundern« gleichzusetzen; »diese« stellt im Deutschen den Bezug zu den berichteten Taten her.
- source_word: ἐνεργοῦσιν
  choice: sind … am Werk
  rationale: Die Wendung gibt die fortdauernde wirksame Tätigkeit idiomatisch und würdig wieder.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die direkte Wiedergabe von ἐν bewahrt Johannes als den Ort beziehungsweise Träger der wirksamen Kräfte. »Durch ihn« wäre möglich, aber stärker deutend.
theological_decisions:
- issue: Art der Rückkehr des Johannes
  choice: Er ist von den Toten auferweckt worden
  alternative: Er ist von den Toten auferstanden
  rationale: Der griechische Text verwendet eine Passivform. Die gewählte Fassung wahrt diese grammatische Nuance, ohne über Herodes’ Vorstellung hinaus eine Aussage über den Handelnden oder die Art der Auferweckung zu machen.
- issue: Bedeutung von δυνάμεις im Zusammenhang
  choice: diese Kräfte sind in ihm am Werk
  alternative: diese Wunderkräfte wirken in ihm / deshalb vollbringt er diese Wunder
  rationale: Im Kontext sind übernatürliche Kräfte beziehungsweise ihre machtvollen Wirkungen gemeint. Die Hauptfassung bewahrt die begriffliche Offenheit und löst die Kräfte nicht vorschnell in einzelne Wunderhandlungen auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau bleibt nah am griechischen Gedankengang, ohne unnatürlich zu wirken. Die passive Form bei »auferweckt« und die Wendung »in ihm am Werk« bewahren wesentliche Nuancen des Ausgangstextes.
