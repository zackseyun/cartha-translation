  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: de
  text: 'Denn Johannes hatte ihm immer wieder gesagt: „Es ist dir nicht erlaubt, sie zu haben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: hatte … immer wieder gesagt
  rationale: Der Imperfekt bezeichnet hier eine in der Vergangenheit andauernde oder wiederholte Äußerung. Die Formulierung gibt diese iterative Kraft in natürlichem Deutsch wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Die Partikel leitet die erklärende Hintergrundinformation zum vorhergehenden Zusammenhang ein.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet bei λέγω den Adressaten und wird im Deutschen idiomatisch mit „ihm“ wiedergegeben.
- source_word: ὁ Ἰωάννης
  choice: Johannes
  rationale: Der Ausgangstext nennt den Sprecher lediglich Johannes; der unmittelbare Kontext identifiziert ihn bereits.
- source_word: Οὐκ ἔξεστίν
  choice: Es ist … nicht erlaubt
  rationale: ἔξεστιν bezeichnet das, was gestattet oder rechtmäßig ist. „Nicht erlaubt“ bewahrt die rechtlich-moralische Aussage und klingt im modernen Deutsch natürlicher als „nicht gesetzmäßig“.
- source_word: σοι
  choice: dir
  rationale: Der Dativ bezeichnet die Person, für die etwas nicht gestattet ist; „dir“ entspricht der natürlichen deutschen Konstruktion.
- source_word: ἔχειν
  choice: zu haben
  rationale: Das Verb bezeichnet im Kontext das Haben einer Frau als Ehefrau oder Partnerin. „Sie zu haben“ bewahrt die knappe Ausdrucksweise des Griechischen, ohne die kontextuelle Bedeutung ausdrücklich hinzuzufügen.
- source_word: αὐτήν
  choice: sie
  rationale: Das Pronomen verweist unmittelbar auf Herodias. „Sie“ ist die direkteste Wiedergabe und vermeidet eine erklärende Erweiterung.
theological_decisions:
- issue: Art von Johannes’ Zurechtweisung
  choice: „Es ist dir nicht erlaubt, sie zu haben.“
  alternative: „Es ist nicht recht, dass du sie hast.“
  rationale: Die Übersetzung bewahrt den Gedanken der fehlenden Erlaubnis beziehungsweise Rechtmäßigkeit in ἔξεστιν, ohne die Aussage auf ein bloß allgemeines moralisches Urteil abzuschwächen oder ihre konkrete gesetzliche Grundlage erklärend hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Immer wieder“ macht den durativen beziehungsweise iterativen Wert des griechischen Imperfekts verständlich; die direkte Rede bleibt knapp und eindringlich.
