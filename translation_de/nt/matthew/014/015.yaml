  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: de
  text: 'Als es Abend geworden war, kamen die Jünger zu ihm und sagten: »Der Ort ist abgelegen, und die Zeit ist schon fortgeschritten[a]. Schick die Menschen weg, damit sie in die Dörfer gehen und sich etwas zu essen kaufen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Stunde ist schon vergangen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Als es Abend geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Übergang. Die Formulierung ist natürliches, würdevolles Deutsch; δέ wirkt hier als leichter Erzählanschluss und braucht keine eigene Wiedergabe.
- source_word: προσῆλθον αὐτῷ
  choice: kamen die Jünger zu ihm
  rationale: προσέρχομαι bedeutet hier, zu jemandem zu kommen bzw. an ihn heranzutreten. „Kamen … zu ihm“ ist im Erzählzusammenhang klar und idiomatisch.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Der Artikel kennzeichnet die bereits bekannte Gruppe. Ein Possessivpronomen ist im Griechischen nicht ausdrücklich vorhanden und wird daher nicht ergänzt.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Der Ort ist abgelegen
  rationale: ἔρημος bezeichnet hier einen unbewohnten bzw. siedlungsfernen Ort. „Abgelegen“ vermittelt den praktischen Sachverhalt, ohne zwingend eine Wüstenlandschaft anzudeuten.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: die Zeit ist schon fortgeschritten
  rationale: Die wörtliche Aussage „die Stunde ist bereits vergangen“ bezeichnet idiomatisch die fortgeschrittene Tageszeit. Die deutsche Wiedergabe erhält das Zeitmotiv und klingt natürlich.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Schick die Menschen weg
  rationale: ἀπολύω bedeutet in diesem Zusammenhang entlassen bzw. fortschicken. οἱ ὄχλοι meint die versammelten Menschenmengen; „die Menschen“ ist hier im Deutschen natürlicher als „die Volksmengen“.
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: damit sie in die Dörfer gehen
  rationale: Die Verbindung aus ἵνα und vorausgehendem Partizip drückt die beabsichtigte Handlung aus. Der deutsche Zwecksatz gibt die Abfolge knapp und idiomatisch wieder.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: und sich etwas zu essen kaufen können
  rationale: βρώματα bezeichnet Nahrungsmittel bzw. Essbares; der reflexive Dativ wird durch „sich“ bewahrt. „Können“ macht die beabsichtigte Möglichkeit im deutschen Zwecksatz natürlich verständlich, ohne eine theologische Aussage hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Abgelegen“ vermeidet die mögliche Fehlvorstellung einer eigentlichen Wüste; „die Menschen“ gibt die Menschenmengen kontextgerecht und natürlich wieder. Der einzige Fußnotenmarker [a] steht unmittelbar bei der idiomatisch übersetzten Zeitangabe.
