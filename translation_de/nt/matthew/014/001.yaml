lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Zu jener Zeit
  rationale: Die idiomatische Zeitangabe wird in natürlichem, würdigem Standarddeutsch wiedergegeben.
- source_word: ἤκουσεν
  choice: hörte
  rationale: Das Aoristverb ἀκούω hat hier seinen unmittelbaren Sinn „hören“; stärker deutende Wiedergaben wie „erfuhr“ sind nicht nötig.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Dies ist die im Deutschen etablierte Form des Personennamens.
- source_word: ὁ τετραάρχης
  choice: der Tetrarch
  rationale: Der historische Amtstitel bleibt präzise erhalten. Die im Deutschen natürliche Stellung vor dem Namen vermeidet eine schwerfällige Apposition.
- source_word: τὴν ἀκοὴν Ἰησοῦ
  choice: was über Jesus berichtet wurde
  rationale: ἀκοή bezeichnet hier das Gehörte, also einen Bericht oder eine Nachricht. Der Inhalt des Berichts wird durch „über Jesus“ idiomatisch ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der historische Titel „Tetrarch“ wird aus Gründen der Genauigkeit beibehalten; die Fußnote bewahrt die lexikalische Alternative bei ἀκοή.
