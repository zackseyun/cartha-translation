id: MAT.14.29
reference: Matthew 14:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: de
  text: 'Er sagte: »Komm!« Da stieg Petrus aus dem Boot, ging auf dem Wasser und kam auf Jesus zu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und kam zu Jesus«. Das Griechische kann die Bewegung auf Jesus hin hervorheben, ohne ausdrücklich zu sagen, dass Petrus ihn erreichte.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: Komm!
  rationale: Der Aoristimperativ von ἔρχομαι ist eine knappe, unmittelbare Aufforderung. »Komm!« gibt sie im Deutschen natürlich und ohne Zusatz wieder.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: stieg … aus dem Boot
  rationale: Das Partizip καταβάς bezeichnet das Hinabsteigen. Im Deutschen gibt »stieg … aus dem Boot« die Handlung und ihre zeitliche Abfolge idiomatisch wieder.
- source_word: πλοίου
  choice: Boot
  rationale: πλοῖον kann ein Boot oder Schiff bezeichnen; im galiläischen Erzählzusammenhang ist »Boot« die passende moderne Bezeichnung.
- source_word: περιεπάτησεν
  choice: ging
  rationale: περιπατέω bedeutet hier schlicht gehen. Zusammen mit »auf dem Wasser« bezeichnet es Peters Fortbewegung, ohne einen Beginn oder ein Umhergehen hinzuzufügen.
- source_word: ἐπὶ τὰ ὕδατα
  choice: auf dem Wasser
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung über beziehungsweise auf der Wasserfläche. Der deutsche Singular »Wasser« ist idiomatisch.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: und kam auf Jesus zu
  rationale: πρός bezeichnet die Richtung auf Jesus hin. »Kam auf Jesus zu« wahrt diese Nuance, ohne ausdrücklich zu behaupten, Petrus habe ihn bereits erreicht.
- source_word: δὲ
  choice: Er sagte
  rationale: δέ ist hier ein schwaches erzählerisches Bindewort. Ein zusätzliches »und« oder »aber« ist im Deutschen für einen natürlichen Anschluss nicht erforderlich.
theological_decisions:
- issue: Beschreibung von Peters Bewegung zu Jesus
  choice: kam auf Jesus zu
  alternative: kam zu Jesus
  rationale: Die Verbindung ἦλθεν πρός hebt die Bewegung in Jesu Richtung hervor und muss nicht das erreichte Ziel bezeichnen. Die Übersetzung wahrt die erzählerische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die direkte Rede steht in deutschen Anführungszeichen; die Verben bilden die Abfolge der Handlungen natürlich ab.
