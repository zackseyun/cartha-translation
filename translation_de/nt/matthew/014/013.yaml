source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: de
  text: Als Jesus das hörte, zog er sich von dort mit einem Boot an einen abgelegenen Ort[a] für sich allein zurück. Als die Menschenmengen davon hörten, folgten sie ihm aus den Ortschaften[b] zu Fuß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen einsamen Ort“ oder „an einen unbewohnten Ort“. Gemeint ist nicht unbedingt eine sandige Wüste.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus den Städten“. Das griechische Wort kann je nach Zusammenhang Städte oder kleinere Ortschaften bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Als Jesus das hörte
  rationale: Das Aoristpartizip wird natürlich als temporaler Nebensatz wiedergegeben. δέ führt die Erzählung weiter, ohne hier einen starken Gegensatz zu verlangen. „Das“ nimmt den im Zusammenhang genannten Bericht auf, obwohl im Griechischen kein ausdrückliches Objekt steht.
- source_word: ἀνεχώρησεν
  choice: zog er sich … zurück
  rationale: Die Wendung bewahrt den bei ἀναχωρέω möglichen Sinn eines Rückzugs, ohne ein nicht genanntes Motiv festzulegen.
- source_word: ἐν πλοίῳ
  choice: mit einem Boot
  rationale: Eine natürliche deutsche Angabe des Reisemittels; der griechische Ausdruck kann ebenso örtlich als „in einem Boot“ verstanden werden.
- source_word: εἰς ἔρημον τόπον
  choice: an einen abgelegenen Ort
  rationale: ἔρημος bezeichnet hier einen einsamen, wenig oder nicht bewohnten Ort und nicht zwingend eine Wüste. „Abgelegen“ vermittelt dies im modernen Deutschen ohne falsche geografische Festlegung.
- source_word: κατ’ ἰδίαν
  choice: um für sich zu sein
  rationale: Die idiomatische Wiedergabe bringt das Abgesondertsein zum Ausdruck. Die finale Formulierung bezeichnet den erkennbaren Zweck der Ortswahl, ohne einen weitergehenden Beweggrund zu behaupten.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Die Wiedergabe bewahrt den Plural und klingt im heutigen Deutsch verständlicher und würdiger als „die Volksscharen“.
- source_word: πεζῇ
  choice: zu Fuß
  rationale: Dies ist die direkte und idiomatische deutsche Entsprechung für die Fortbewegung auf dem Landweg zu Fuß.
- source_word: ἀπὸ τῶν πόλεων
  choice: aus den Ortschaften
  rationale: πόλις kann je nach Größe und Zusammenhang Stadt oder kleinere Ortschaft bezeichnen. „Ortschaften“ vermeidet im galiläischen Umfeld eine unnötige Festlegung auf moderne Großstädte.
theological_decisions:
- issue: Grund für Jesu Rückzug
  choice: Der Rückzug wird beschrieben, sein Beweggrund aber nicht näher bestimmt.
  alternative: Den Rückzug ausdrücklich als Trauer, Gebet oder Flucht vor Gefahr deuten.
  rationale: Der Vers verbindet Jesu Hören mit seinem Rückzug und nennt sein Abgesondertsein, erklärt jedoch nicht ausdrücklich, warum er sich zurückzieht.
- issue: Bedeutung des Folgens der Menschenmengen
  choice: „folgten ihm“ bezeichnet hier zunächst die erzählte körperliche Bewegung.
  alternative: Das Verb ausdrücklich als geistliche Nachfolge formulieren.
  rationale: Der unmittelbare Zusammenhang beschreibt, dass die Menschen Jesus zu Fuß nachgehen; zusätzliche Aussagen über ihren Glauben oder Jüngerschaftsstatus wären nicht durch diesen Vers allein gedeckt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau folgt dem griechischen Handlungsablauf, vermeidet aber unnatürliche Partizipialkonstruktionen. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
