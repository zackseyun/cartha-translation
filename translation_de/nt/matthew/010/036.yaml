id: MAT.10.36
reference: Matthew 10:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: de
  text: Und die Feinde eines Menschen werden die Angehörigen seines Hausstands sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und die Feinde eines Menschen werden seine Hausgenossen sein.«'
    reason: Lexikalische Alternative zu »Angehörige seines Hausstands«; »Hausgenossen« kann die zum Haushalt gehörenden Menschen bezeichnen.
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache koordinierende Konjunktion verbindet den Satz mit dem vorausgehenden Zusammenhang, ohne eine zusätzliche logische Deutung einzutragen.
- source_word: ἐχθροὶ
  choice: Feinde
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die jemandem feindlich gegenüberstehen; »Feinde« ist die natürliche und in ihrer Stärke angemessene deutsche Entsprechung.
- source_word: τοῦ ἀνθρώπου
  choice: eines Menschen
  rationale: Der Genitiv bezeichnet die Person, deren Feinde gemeint sind. »Mensch« bewahrt die singularische Form und kann im Deutschen wie das griechische ἄνθρωπος repräsentativ gebraucht werden.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: seine eigenen Hausgenossen
  rationale: οἰκιακοί meint die zu einem Hausstand gehörenden Menschen, nicht das Gebäude. »Hausgenossen« bewahrt den weiteren antiken Haushaltsbegriff; »eigenen« bringt die durch αὐτοῦ im Zusammenhang hervorgehobene persönliche Zugehörigkeit natürlich zum Ausdruck.
theological_decisions:
- issue: Repräsentative Personenbezeichnung bei ἀνθρώπου
  choice: eines Menschen
  alternative: eines Mannes
  rationale: ἄνθρωπος kann einen Menschen allgemein bezeichnen, obwohl die Form grammatisch maskulin ist. »Eines Menschen« erhält Singular und repräsentativen Charakter, ohne die Aussage unnötig auf männliche Personen einzugrenzen.
- issue: Umfang von οἰκιακοί
  choice: Hausgenossen
  alternative: Familienangehörige
  rationale: Der griechische Ausdruck kann alle Angehörigen eines Hausstands umfassen und ist nicht zwingend auf die Kernfamilie oder Blutsverwandte beschränkt. »Hausgenossen« lässt diesen weiteren sozialen Umfang offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der sprichwortartige Satzbau und das Futur des griechischen Textes bleiben erhalten. »Hausgenossen« ist leicht gehoben, aber verständlich und sachlich genauer als das engere »Familienangehörige«.
