id: MAT.10.1
reference: Matthew 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: de
  text: Er rief seine zwölf Jünger zu sich und gab ihnen Vollmacht über unreine Geister[a], sie auszutreiben und jede Krankheit und jedes Leiden zu heilen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Macht über unreine Geister“. Das griechische Wort exousia bezeichnet häufig verliehene Autorität oder Befugnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung „jede Krankheit und jedes Leiden“ gibt zwei verwandte griechische Begriffe wieder (nosos und malakia); auch möglich: „jede Krankheit und jede Gebrechlichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Er rief … zu sich
  rationale: Das Aoristpartizip von προσκαλέομαι bezeichnet das Herbeirufen zu sich. Die Beiordnung mit dem folgenden Hauptverb ist im Deutschen natürlich und bewahrt den engen Handlungszusammenhang, ohne die zeitliche Beziehung unnötig zu präzisieren.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: seine zwölf Jünger
  rationale: μαθητής ist im Evangelienkontext angemessen mit „Jünger“ wiedergegeben; αὐτοῦ wird als Possessivpronomen ausgedrückt.
- source_word: ἔδωκεν
  choice: gab
  rationale: Die schlichte Grundbedeutung von δίδωμι wird ohne interpretierende Verstärkung wiedergegeben.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: ἐξουσία bezeichnet hier verliehene Befugnis beziehungsweise Autorität, nicht lediglich eine unpersönliche Kraft. „Vollmacht“ ist im Deutschen idiomatisch und passt zum Sendungszusammenhang.
- source_word: πνευμάτων ἀκαθάρτων
  choice: über unreine Geister
  rationale: Der Genitiv bei ἐξουσία wird natürlich mit „über“ wiedergegeben; „unreine Geister“ ist die sachlich präzise und vertraute Evangelienformulierung.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: sie auszutreiben
  rationale: ὥστε mit Infinitiv lässt hier Ziel beziehungsweise Folge anklingen. Der angeschlossene Infinitiv bewahrt diese Offenheit; „sie“ bezieht sich auf die unreinen Geister.
- source_word: θεραπεύειν
  choice: zu heilen
  rationale: θεραπεύω bezeichnet in diesem Zusammenhang die Heilung von Kranken.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: jede Krankheit und jedes Leiden
  rationale: Die beiden verwandten griechischen Begriffe bleiben als zwei Ausdrücke erhalten. „Leiden“ gibt μαλακία im Sinn körperlicher Schwäche oder Gebrechlichkeit verständlich wieder, ohne beide Begriffe gleichzusetzen.
theological_decisions:
- issue: Art der den Jüngern verliehenen Befähigung
  choice: Jesus gab den Zwölf Vollmacht über unreine Geister.
  alternative: Jesus gab ihnen Macht oder Kraft über unreine Geister.
  rationale: ἐξουσία hebt die verliehene Befugnis hervor. „Vollmacht“ bewahrt diesen Gedanken, ohne weitergehende dogmatische Aussagen hinzuzufügen.
- issue: Verhältnis von Zweck und Folge bei ὥστε
  choice: 'Infinitivischer Anschluss: „sie auszutreiben und … zu heilen“'
  alternative: Ausdrücklicher Zwecksatz („damit sie …“) oder Folgesatz („sodass sie …“)
  rationale: Die griechische Konstruktion kann Ziel und resultierende Befähigung verbinden. Der deutsche Infinitivanschluss vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig und allgemein verständlich; „Vollmacht“ und „unreine Geister“ bewahren zugleich die sachliche und biblische Prägung des Ausgangstextes.
