id: MAT.10.7
reference: Matthew 10:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: de
  text: 'Geht und verkündet: »Das Himmelreich ist nahe gekommen.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist herbeigekommen« oder »ist nahe«. Das griechische Perfekt betont eine Nähe, die eingetreten ist und fortbesteht.'
    reason: lexical_alternative
  - marker: b
    text: Matthäus spricht regelmäßig vom »Himmelreich«; die anderen Evangelien verwenden häufig die Wendung »Reich Gottes«.
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι δὲ
  choice: Geht und
  rationale: Das Partizip bezeichnet die begleitende Handlung zum Imperativ. Die koordinierte deutsche Fassung ist natürlich und gibt den milden Anschluss durch δὲ wieder, ohne einen Gegensatz zu erzwingen.
- source_word: κηρύσσετε
  choice: verkündet
  rationale: Der Imperativ meint öffentliches, autoritatives Bekanntmachen. »Verkündet« ist würdig und verständlich, ohne die stärker kirchlich geprägte Bedeutung von »predigt« vorauszusetzen.
- source_word: λέγοντες ὅτι
  choice: ':'
  rationale: Das Partizip führt den Inhalt der Verkündigung ein. Im modernen Deutschen übernimmt der Doppelpunkt diese Funktion idiomatisch; der Aussagegehalt von »indem ihr sagt« bleibt erhalten, ohne unnötige Redundanz.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: »Himmelreich« ist die natürliche, etablierte deutsche Wiedergabe von Matthäus’ charakteristischer Wendung und wahrt deren Unterschied zum ausdrücklich formulierten »Reich Gottes«.
- source_word: ἤγγικεν
  choice: ist nahe gekommen
  rationale: Das Perfekt bezeichnet eingetretene Nähe mit fortdauernder Geltung. »Ist nahe gekommen« bewahrt diesen Aspekt besser als das bloße »ist nahe«.
theological_decisions:
- issue: Bedeutung von ἡ βασιλεία τῶν οὐρανῶν
  choice: Himmelreich
  alternative: Herrschaft des Himmels; Reich Gottes
  rationale: Die matthäische Formulierung wird weder auf einen rein räumlichen noch auf einen ausschließlich dynamischen Sinn festgelegt und nicht mit »Reich Gottes« harmonisiert.
- issue: Aspekt von ἤγγικεν
  choice: ist nahe gekommen
  alternative: ist nahe; ist herbeigekommen
  rationale: Die Übersetzung gibt die erreichte und weiterhin bestehende Nähe wieder, ohne weitergehende Aussagen über Zeitpunkt oder Gestalt des Reiches in den Vers hineinzulesen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die knappe direkte Rede entspricht dem öffentlichen Verkündigungsauftrag; der Doppelpunkt gibt λέγοντες idiomatisch wieder.
