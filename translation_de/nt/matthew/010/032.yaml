  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: de
  text: 'Darum: Jeder, der sich vor den Menschen zu mir bekennt,[a] zu dem werde auch ich mich vor meinem Vater im Himmel bekennen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: „in mir“. Die Präposition kann hier idiomatisch die Beziehung des Bekenntnisses zu Jesus ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch wörtlich: „in ihm“. Die Formulierung entspricht dem vorausgehenden „in mir“ und hebt die Gegenseitigkeit hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Jeder also, der
  rationale: Die inklusive verallgemeinernde Wendung wird im Deutschen natürlich mit „Jeder …, der“ wiedergegeben; „also“ bewahrt den folgernden Anschluss an den vorausgehenden Zusammenhang.
- source_word: ὁμολογήσει
  choice: sich … bekennt
  rationale: ὁμολογέω bezeichnet hier das offene Anerkennen beziehungsweise Bekennen der Zugehörigkeit zu Jesus. „Sich zu jemandem bekennen“ ist dafür eine natürliche deutsche Wendung und lässt sich im zweiten Satzteil spiegelbildlich wiederholen.
- source_word: ἐν ἐμοὶ
  choice: zu mir
  rationale: Das griechische ἐν steht in einer ungewöhnlichen Verbindung mit ὁμολογέω. „Sich zu mir bekennen“ gibt den Sinn idiomatisch wieder; die formal nähere Möglichkeit „in mir“ bleibt in einer Fußnote sichtbar.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: vor den Menschen
  rationale: Die Formulierung gibt sowohl die Gegenwart beziehungsweise Öffentlichkeit als auch den generischen menschlichen Bezug präzise und geschlechtsübergreifend wieder.
- source_word: ὁμολογήσω κἀγὼ
  choice: werde auch ich mich … bekennen
  rationale: Das Futur und das betonte κἀγώ werden mit „werde auch ich“ bewahrt. Die Wiederholung von „bekennen“ erhält die beabsichtigte Entsprechung zwischen menschlichem und jesuanischem Bekennen.
- source_word: ἐν αὐτῷ
  choice: zu dem
  rationale: Die deutsche Korrelativkonstruktion „der …, zu dem …“ bildet die Gegenseitigkeit natürlich ab. Da das griechische ἐν αὐτῷ formal auch „in ihm“ lautet, wird diese Auffälligkeit in einer Fußnote dokumentiert.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: meinem Vater im Himmel
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der geläufigen matthäischen Wendung. Der griechische Plural οὐρανοῖς wird idiomatisch mit dem deutschen Singular „Himmel“ wiedergegeben.
theological_decisions:
- issue: Öffentliches Bekenntnis zu Jesus und Jesu entsprechendes Bekenntnis vor dem Vater
  choice: Die wechselseitige Aussage wird unmittelbar als Verheißung wiedergegeben, ohne ihren Zeitpunkt oder ihre heilsgeschichtliche Mechanik näher festzulegen.
  alternative: Die Aussage ausdrücklich ausschließlich auf das Endgericht oder ausschließlich auf gegenwärtige Jüngerschaft beziehen.
  rationale: Der Vers nennt das entsprechende Bekenntnis Jesu vor seinem Vater, bestimmt aber nicht ausdrücklich alle systematisch-theologischen Einzelheiten. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Form „der …, zu dem …“ ist gut verständlich und bewahrt die spiegelbildliche Struktur des griechischen Satzes; ungewöhnliche Präpositionsverbindungen werden nicht hölzern in den Haupttext übernommen, aber in den Fußnoten offengelegt.
