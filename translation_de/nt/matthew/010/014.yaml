source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: de
  text: Und wenn jemand euch nicht aufnimmt und euren Worten nicht zuhört[a], dann schüttelt, wenn ihr aus jenem Haus oder jener Stadt hinausgeht, den Staub von euren Füßen ab[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und eure Worte nicht hört“.'
    reason: lexical_alternative
  - marker: b
    text: Das Abschütteln des Staubes von den Füßen war eine symbolische Handlung der Distanzierung und des Gerichts gegenüber denen, die die Botschaft zurückwiesen.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ὃς ἂν μὴ
  choice: Und wenn jemand nicht
  rationale: Die indefinite Relativkonstruktion mit ἄν hat allgemeinen beziehungsweise konditionalen Sinn. „Wenn jemand … nicht“ ist natürliches modernes Deutsch und bewahrt den Bezug zum folgenden Imperativ.
- source_word: δέξηται ὑμᾶς
  choice: euch aufnimmt
  rationale: δέχομαι bezeichnet hier die gastliche und zustimmende Aufnahme der ausgesandten Boten. „Aufnehmen“ bewahrt beide Aspekte besser als das engere „willkommen heißen“.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: und euren Worten nicht zuhört
  rationale: ἀκούω kann bloßes Hören oder aufmerksames Zuhören bezeichnen. Im Kontext ist „zuhören“ idiomatisch und lässt offen, ob daraus Gehorsam folgt; λόγοι bleibt mit „Worten“ ausdrücklich erhalten.
- source_word: ἐξερχόμενοι ἔξω
  choice: dann geht … hinaus
  rationale: Das Partizip mit ἔξω bezeichnet das Hinausgehen als Begleitumstand der Aufforderung. Die deutsche imperativische Koordination ist klar und natürlich, ohne den räumlichen Sinn abzuschwächen.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: aus jenem Haus oder jener Stadt
  rationale: Die Formulierung bewahrt die Alternative zwischen Haus und πόλις sowie die demonstrative Kraft von ἐκείνης. „Stadt“ ist die direkte und im Matthäuskontext übliche Wiedergabe von πόλις, ohne eine bestimmte moderne Größenordnung vorauszusetzen.
- source_word: ἐκτινάξατε
  choice: schüttelt … ab
  rationale: Das Verb bezeichnet das kräftige Abschütteln und wird im Deutschen in Verbindung mit Staub idiomatisch durch die trennbare Verbform „abschütteln“ wiedergegeben.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: den Staub von euren Füßen
  rationale: κονιορτός ist konkret „Staub“; der Genitiv bezeichnet hier dessen Entfernung von den Füßen. Die deutsche Formulierung erhält das anschauliche Bild.
theological_decisions:
- issue: Symbolische Handlung gegenüber denen, die die Boten und ihre Botschaft ablehnen
  choice: Der konkrete Befehl, den Staub von den Füßen abzuschütteln, bleibt im Haupttext ohne eingefügte Deutung stehen.
  alternative: Eine Deutung wie „zum Zeugnis gegen sie“ aus den Parallelstellen ergänzen oder die Handlung als „überlasst sie dem Gericht“ paraphrasieren.
  rationale: Der Vers nennt die symbolische Handlung, erläutert ihre Bedeutung aber nicht ausdrücklich. Eine Ergänzung aus Parallelstellen würde den Wortlaut harmonisieren und die im Text verbleibende Deutungsspannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Plural bleibt erhalten. „Aufnehmen“, „Worte“ und „Staub von den Füßen abschütteln“ bewahren die konkreten Bilder und den leicht formellen Ton des Ausgangstextes.
