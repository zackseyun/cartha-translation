id: MAT.10.28
reference: Matthew 10:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: de
  text: Und fürchtet euch nicht vor denen, die den Körper töten, die Seele aber nicht töten können. Fürchtet vielmehr den, der sowohl Seele als auch Körper in der Gehenna[a] vernichten kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Hölle“. Griechisch: „Gehenna“; die Bezeichnung ist vom Tal Hinnom abgeleitet und wird für den Ort des endgültigen Gerichts gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: fürchtet euch nicht / fürchtet
  rationale: Das wiederholte Verb bildet einen bewussten Gegensatz. Dieselbe deutsche Wortfamilie bewahrt diesen Zusammenhang und die Eindringlichkeit der Warnung.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: vor denen, die … töten
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein eine Gruppe. Die Relativsatzkonstruktion ist im Deutschen natürlich und gibt diesen allgemeinen Bezug klar wieder.
- source_word: σῶμα
  choice: Körper
  rationale: „Körper“ ist die direkte, allgemein verständliche Wiedergabe und wahrt den ausdrücklichen Gegensatz zur Seele.
- source_word: ψυχήν
  choice: Seele
  rationale: Im Gegensatz zu σῶμα bezeichnet ψυχή hier den nicht auf den physischen Körper reduzierbaren Aspekt des Menschen. „Leben“ wäre andernorts möglich, würde diesen Gegensatz hier jedoch verwischen.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: nicht töten können
  rationale: Die Formulierung gibt die im griechischen Text hervorgehobene Unfähigkeit präzise und idiomatisch wieder.
- source_word: μᾶλλον
  choice: vielmehr
  rationale: '„Vielmehr“ kennzeichnet die korrigierende Gegenüberstellung: nicht jene fürchten, sondern den Folgenden.'
- source_word: τὸν δυνάμενον
  choice: den, der … kann
  rationale: Der substantivierte Ausdruck wird ohne zusätzliche ausdrückliche Identifizierung wiedergegeben. Das maskuline „den“ entspricht der griechischen Form, ohne den Referenten namentlich festzulegen.
- source_word: ἀπολέσαι
  choice: vernichten
  rationale: Das Verb bezeichnet hier endgültiges Verderben beziehungsweise gerichtliche Vernichtung. „Vernichten“ wahrt die Stärke der Aussage, ohne die genaue Beschaffenheit dieses Gerichts weiter auszudeuten.
- source_word: ἐν γεέννῃ
  choice: in der Gehenna
  rationale: Die Transliteration erhält den spezifischen, jüdisch geprägten Begriff des Ausgangstextes. Die geläufige Deutung „Hölle“ wird zur Verständlichkeit in der Fußnote genannt.
theological_decisions:
- issue: Identität dessen, der Seele und Körper in der Gehenna vernichten kann
  choice: 'Im Haupttext nicht ausdrücklich identifiziert: „den, der … kann“'
  alternative: Gott; Satan
  rationale: Der Zusammenhang legt Gott als Träger der endgültigen Gerichtsgewalt nahe, doch der griechische Ausdruck nennt den Referenten nicht ausdrücklich. Die Übersetzung bewahrt diese sprachliche Offenheit.
- issue: Wiedergabe von γέεννα
  choice: Gehenna
  alternative: Hölle
  rationale: „Gehenna“ folgt dem konkreten Begriff des Ausgangstextes und erhält dessen jüdischen Hintergrund. „Hölle“ ist eine geläufige interpretierende Entsprechung und wird deshalb in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Die Wiederholung von „fürchten“ sowie der Gegensatz zwischen Körper und Seele bleiben erhalten; unnötige konfessionelle Festlegungen werden vermieden.
