id: MAT.10.42
reference: Matthew 10:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: de
  text: 'Und wer einem von diesen Kleinen[a] auch nur einen Becher kaltes Wasser zu trinken gibt, weil dieser ein Jünger ist[b] – wahrlich, ich sage euch: Er wird seinen Lohn ganz gewiss nicht verlieren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Diese Kleinen“ bezeichnet hier wahrscheinlich gering geachtete oder unbedeutend erscheinende Menschen unter den Jüngern Jesu, nicht notwendigerweise nur Kinder.
    reason: referent_clarification
  - marker: b
    text: 'Wörtlicher: „auf den Namen eines Jüngers hin“ oder traditionell: „im Namen eines Jüngers“. Gemeint ist, dass die Gabe wegen der Identität des Empfängers als Jünger gegeben wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: wer
  rationale: Das Relativpronomen mit ἄν verallgemeinert die Aussage. „Wer“ gibt diesen offenen, allgemeinen Sinn im Deutschen natürlich wieder.
- source_word: ποτίσῃ
  choice: zu trinken gibt
  rationale: Die Wendung bildet die konkrete Bedeutung des Verbs („tränken“, „zu trinken geben“) verständlich und ohne altertümlichen Klang ab.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: einem von diesen Geringen
  rationale: „Geringen“ bewahrt den Bezug auf Menschen von niedrigem oder unbedeutend erscheinendem Rang und legt die Wendung nicht unnötig auf Kinder fest.
- source_word: ποτήριον ψυχροῦ
  choice: einen Becher kaltes Wasser
  rationale: Bei ψυχροῦ ist „Wasser“ sinngemäß zu ergänzen. „Becher“ entspricht dem gewöhnlichen Trinkgefäß und macht die Schlichtheit der Gabe deutlich.
- source_word: μόνον
  choice: auch nur
  rationale: „Auch nur“ bringt den minimalen Umfang der Gabe idiomatisch zum Ausdruck.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: weil dieser ein Jünger ist
  rationale: Die Formulierung macht verständlich, dass die Hilfe aufgrund der Identität des Empfängers als Jünger geschieht; die formalere Wiedergabe wird in einer Fußnote bewahrt.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: wahrlich, ich sage euch
  rationale: Die feste Wendung kennzeichnet eine feierliche, nachdrückliche Zusicherung. „Wahrlich“ bewahrt ihr Gewicht, ohne das hebräisch-griechische Lehnwort unübersetzt zu lassen.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: wird ... ganz gewiss nicht verlieren
  rationale: Die doppelte Verneinung mit dem Konjunktiv ist stark emphatisch; „ganz gewiss nicht“ gibt diese Sicherheit in natürlichem Deutsch wieder.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: seinen Lohn
  rationale: „Lohn“ deckt hier die Bedeutung einer zugesagten Vergeltung oder Belohnung ab und entspricht dem in diesem Zusammenhang üblichen deutschen Ausdruck.
theological_decisions:
- issue: Bezug von „diesen Geringen“
  choice: Die Wendung bleibt auf gering geachtete oder unbedeutend erscheinende Menschen bezogen, ohne sie ausdrücklich auf Kinder zu beschränken.
  alternative: „einem von diesen Kleinen“ im Sinn von Kindern oder ausschließlich jungen beziehungsweise schwachen Glaubenden
  rationale: Der Zusammenhang handelt vom Aufnehmen und Unterstützen der Jünger Jesu. Die Übersetzung wahrt den weiteren sozialen und geistlichen Bezug, ohne eine engere Deutung dogmatisch festzulegen.
- issue: Bedeutung von εἰς ὄνομα μαθητοῦ
  choice: „weil dieser ein Jünger ist“
  alternative: „im Namen eines Jüngers“
  rationale: Die idiomatische Fassung versteht die Identität des Empfängers als Beweggrund der Handlung. Die formal mögliche Fassung bleibt in der Fußnote sichtbar, damit die Struktur des griechischen Ausdrucks und seine mögliche Spannung nicht verdeckt werden.
- issue: Art des zugesagten Lohns
  choice: „seinen Lohn“ ohne nähere Bestimmung
  alternative: ausdrückliche Deutung als himmlischer, zeitlicher oder verdienstlich erworbener Lohn
  rationale: Der Vers bestimmt die Art des Lohns nicht näher. Die Übersetzung fügt deshalb keine konfessionelle oder systematisch-theologische Erklärung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die feierliche Formel „wahrlich, ich sage euch“ und der Doppelpunkt tragen den Nachdruck der Aussage; „ganz gewiss nicht“ bildet die emphatische griechische Verneinung ab. Das Pronomen „dieser“ verdeutlicht, dass der Empfänger als Jünger erkannt wird.
