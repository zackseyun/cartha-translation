  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: de
  text: Heilt die Kranken, erweckt die Toten[a], reinigt Menschen mit Aussatz[b], treibt Dämonen aus. Als Geschenk habt ihr empfangen; als Geschenk gebt weiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In einigen alten Handschriften fehlen die Worte „erweckt die Toten“.
    reason: textual_variant
  - marker: b
    text: Der traditionell mit „Aussatz“ wiedergegebene Begriff bezeichnet im biblischen Sprachgebrauch verschiedene schwere Hautkrankheiten und nicht nur die heute als Lepra oder Hansen-Krankheit bekannte Krankheit.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: Heilt die Kranken
  rationale: Der substantivierte Gedanke „die Kranken“ gibt das Partizip im Heilungskontext natürlich wieder; „heilt“ entspricht dem konkreten Auftrag von θεραπεύω.
- source_word: νεκροὺς ἐγείρετε
  choice: weckt die Toten auf
  rationale: ἐγείρω bezeichnet hier das Auferwecken aus dem Tod. „Aufwecken“ wahrt zugleich die Bildsprache des griechischen Verbs, während das Objekt jede bloß alltägliche Bedeutung ausschließt.
- source_word: λεπροὺς καθαρίζετε
  choice: macht die Aussätzigen rein
  rationale: „Aussätzige“ ist der herkömmliche, im biblischen Zusammenhang verständliche Ausdruck, dessen historische Bedeutungsbreite in einer Fußnote erläutert wird. „Rein machen“ bewahrt bei καθαρίζω sowohl die körperliche als auch die kultische Dimension.
- source_word: δαιμόνια ἐκβάλλετε
  choice: treibt Dämonen aus
  rationale: Diese Wendung ist im Deutschen die direkte und natürliche Wiedergabe des gewaltsamen Vertreibens, das ἐκβάλλω ausdrückt.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: Als Geschenk habt ihr empfangen; als Geschenk gebt weiter
  rationale: Die Formulierung bewahrt den betonten Parallelismus und gibt δωρεάν als unverdiente, ohne Gegenleistung empfangene und weiterzugebende Gabe wieder. Sie vermeidet die im heutigen Deutschen mögliche Nebenbedeutung von „umsonst“ im Sinn von „vergeblich“.
theological_decisions:
- issue: Reichweite der Wunderaufträge
  choice: Die vier Imperative werden als konkrete Aufträge an die Zwölf wiedergegeben.
  alternative: Die Handlungen metaphorisch verstehen oder ausschließlich auf spätere kirchliche Praktiken beziehen.
  rationale: Der griechische Text enthält unmittelbare Imperative im Plural innerhalb der Aussendungsrede. Die Übersetzung schränkt ihre Aussage weder ein noch dehnt sie über den Text hinaus aus.
- issue: Bedeutung von καθαρίζω bei Aussätzigen
  choice: „rein machen“ statt lediglich „heilen“
  alternative: „heilen“
  rationale: Der Ausdruck kann körperliche Wiederherstellung und kultische Reinheit zugleich bezeichnen. Die Übersetzung erhält diese theologische und soziale Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, direkt aufeinanderfolgenden Imperativen. Die parallele Schlussformulierung bildet die rhetorische Struktur des Griechischen ab, ohne das heute missverständliche „umsonst“ zu verwenden.
