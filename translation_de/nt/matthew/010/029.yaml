id: MAT.10.29
reference: Matthew 10:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: de
  text: Werden nicht zwei Spatzen für ein Assarion[a] verkauft? Und doch wird kein einziger von ihnen zu Boden fallen ohne euren Vater[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Assarion war eine römische Kupfermünze von sehr geringem Wert.
    reason: cultural_note
  - marker: b
    text: Die Wendung kann bedeuten, dass dies nicht ohne das Wissen, die Fürsorge oder den Willen eures Vaters geschieht; das Griechische legt nicht fest, welcher Aspekt gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: στρουθία
  choice: Spatzen
  rationale: Der Ausdruck kann allgemein kleine Vögel bezeichnen, meint in diesem Zusammenhang aber am natürlichsten Spatzen.
- source_word: ἀσσαρίου
  choice: ein Assarion
  rationale: Die Bezeichnung der konkreten römischen Kleinmünze bewahrt die historische Eigenart des Ausgangstextes; ihr geringer Wert wird in einer Fußnote erklärt.
- source_word: πωλεῖται
  choice: werden … verkauft
  rationale: Dies gibt das Präsens Passiv im Deutschen natürlich und sinngenau wieder.
- source_word: ἓν ἐξ αὐτῶν
  choice: kein einziger von ihnen
  rationale: Im Zusammenhang mit der Verneinung ist dies eine idiomatische deutsche Wiedergabe des partitiven Ausdrucks und betont, dass nicht einmal ein einzelner Spatz ausgenommen ist.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: wird … zu Boden fallen
  rationale: Die Formulierung bewahrt das Futur und gibt die griechische Wendung in natürlichem Deutsch wieder.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: ohne euren Vater
  rationale: Die knappe Wiedergabe folgt dem Griechischen, ohne näher festzulegen, ob Wissen, Fürsorge, Gegenwart oder Wille des Vaters gemeint ist.
- source_word: οὐχὶ … ;
  choice: Werden nicht …?
  rationale: Die rhetorische Frage erwartet Zustimmung; diese Form gibt ihre Kraft im Deutschen natürlich wieder.
- source_word: καὶ
  choice: Und doch
  rationale: Die Wendung bringt hier den hervorhebenden Kontrast zum äußerst geringen Verkaufswert der Spatzen zum Ausdruck.
theological_decisions:
- issue: Bedeutung von „ohne euren Vater“ im Blick auf Gottes Vorsehung
  choice: Die nicht näher bestimmte Formulierung „ohne euren Vater“ bleibt im Haupttext erhalten.
  alternative: „ohne das Wissen eures Vaters“ oder „ohne den Willen eures Vaters“
  rationale: Der Vers bezeugt die umfassende Beziehung des Vaters selbst zum Schicksal gering geachteter Geschöpfe, bestimmt aber sprachlich nicht ausdrücklich, ob Wissen, Fürsorge, Zulassung oder Wille gemeint ist. Eine engere Deutung würde die im Griechischen vorhandene Offenheit auflösen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die historische Münzbezeichnung bleibt erhalten und wird erklärt; die theologisch bedeutsame Kürze der Schlusswendung wird nicht durch eine Deutung ersetzt.
