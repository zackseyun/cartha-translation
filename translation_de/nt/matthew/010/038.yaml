  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: de
  text: Und wer nicht sein Kreuz auf sich nimmt und hinter mir hergeht[a], ist meiner nicht würdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder knapper: „mir nachfolgt“. Im Griechischen wird ausdrücklich die Nuance „mir hinterher folgen“ ausgedrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: wer
  rationale: Das indefinite, verallgemeinernde Relativpronomen wird im Deutschen natürlich mit „wer“ wiedergegeben.
- source_word: λαμβάνει τὸν σταυρὸν αὐτοῦ
  choice: sein Kreuz auf sich nimmt
  rationale: „Auf sich nehmen“ ist im Deutschen die natürliche Verbindung und bewahrt das konkrete Bild des Kreuzes sowie den Gedanken der bewussten Annahme seines Weges.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: hinter mir hergeht
  rationale: Die Formulierung gibt sowohl das Folgen als auch das durch ὀπίσω ausdrücklich bezeichnete Hinter-Jesus-Hergehen wieder.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: ist meiner nicht würdig
  rationale: Die prägnante Genitivkonstruktion wahrt den feierlichen, persönlichen Beziehungscharakter der Aussage.
theological_decisions:
- issue: Das Kreuz als Bild der Nachfolge
  choice: Das konkrete Bild „sein Kreuz auf sich nimmt“ bleibt erhalten.
  alternative: Deutende Wiedergaben wie „Leiden annimmt“ oder „sich selbst verleugnet“.
  rationale: Der griechische Text nennt ausdrücklich das Kreuz. Eine abstrakte Umschreibung würde dessen historische Härte und theologische Spannung abschwächen.
- issue: Generischer Singular in αὐτοῦ
  choice: „sein Kreuz“ im Bezug auf das generische „wer“.
  alternative: „das eigene Kreuz“ oder eine pluralische, geschlechtsneutrale Formulierung.
  rationale: „Wer … sein“ ist im heutigen Standarddeutsch eine natürliche generische Singularkonstruktion und entspricht der Form des griechischen Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinter mir hergeht“ erhält die räumliche Anschaulichkeit des griechischen ὀπίσω, während „ist meiner nicht würdig“ die feierliche Prägnanz des Ausgangstextes bewahrt.
