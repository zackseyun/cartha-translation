id: MAT.10.35
reference: Matthew 10:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: de
  text: Denn ich bin gekommen, um einen Mann gegen seinen Vater zu stellen[a], eine Tochter gegen ihre Mutter und eine Schwiegertochter gegen ihre Schwiegermutter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu entzweien“. Das griechische Verb bedeutet wörtlich, eine Teilung oder Entzweiung herbeizuführen; die folgenden wiederholten Wendungen mit „gegen“ machen den persönlichen Gegensatz deutlich.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann in anderen Zusammenhängen auch „Braut“ bedeuten. Hier ist wegen der Gegenüberstellung mit der Schwiegermutter die Schwiegertochter gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: ich bin gekommen
  rationale: Der griechische Aorist bezeichnet hier Jesu Kommen und Auftrag. Das deutsche Perfekt ist in gegenwärtiger Standardsprache die natürliche Wiedergabe und bewahrt den Bezug seines Kommens auf die aktuelle Aussage.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion kennzeichnet die Aussage als Begründung beziehungsweise Erläuterung des vorangehenden Satzes.
- source_word: διχάσαι
  choice: gegen … zu stellen
  rationale: Das Verb bedeutet, zu teilen oder Entzweiung herbeizuführen. Zusammen mit den dreimaligen κατά-Verbindungen bezeichnet es hier ausdrücklich den Gegensatz zwischen Angehörigen; „gegen … zu stellen“ bildet diese relationale Zuspitzung natürlich ab.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Obwohl ἄνθρωπος auch allgemein „Mensch“ bedeuten kann, steht hier ein männliches Familienmitglied parallel zu Tochter und Schwiegertochter. „Mann“ bewahrt diese konkrete Dreierstruktur.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: gegen seinen Vater
  rationale: κατά mit Genitiv drückt hier Gegnerschaft oder Gegensatz aus; „gegen seinen Vater“ ist knapp und idiomatisch.
- source_word: θυγατέρα
  choice: eine Tochter
  rationale: Direkte und natürliche Wiedergabe des griechischen Verwandtschaftsbegriffs.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: gegen ihre Mutter
  rationale: Die Formulierung bewahrt die adversative κατά-Konstruktion und die parallele Satzstruktur.
- source_word: νύμφην
  choice: eine Schwiegertochter
  rationale: νύμφη kann je nach Zusammenhang auch „Braut“ bedeuten; die Gegenüberstellung mit πενθερά zeigt hier jedoch eindeutig die Verwandtschaftsbeziehung Schwiegertochter–Schwiegermutter an.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: gegen ihre Schwiegermutter
  rationale: Die Wiedergabe erhält sowohl den genauen Verwandtschaftsbegriff als auch das wiederholte Muster familiärer Gegnerschaft.
theological_decisions:
- issue: Charakter von Jesu erklärtem Auftrag im Kontext
  choice: Die Aussage beschreibt in ihrer ungemilderten Form die familiäre Entzweiung, die mit Jesu Kommen verbunden ist, ohne diese im Haupttext weiter zu deuten.
  alternative: Den Satz erläuternd als bloße Nebenwirkung der Nachfolge oder der Verfolgung umzuformulieren.
  rationale: Der griechische Wortlaut formuliert pointiert, dass Jesus kam, um Familienangehörige gegeneinanderzustellen. Eine theologische Erklärung des Verhältnisses zwischen Absicht, Wirkung und menschlicher Reaktion würde über diesen Vers hinausgehen; deshalb bleibt die Spannung erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die dreigliedrige Parallelstruktur und die Schärfe der Aussage bleiben erhalten; die wiederholte Verbform wird im Deutschen idiomatisch ausgelassen.
