  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: de
  text: Wenn sie euch aber ausliefern, macht euch keine Sorgen darüber, wie oder was ihr sagen sollt; denn in jener Stunde wird euch gegeben werden[a], was ihr sagen sollt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Passiv „wird euch gegeben werden“ lässt den Geber hier unausgesprochen; der folgende Vers nennt den Geist eures Vaters als den, der durch euch redet.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Wenn ... aber
  rationale: ὅταν bezeichnet hier einen unbestimmten zukünftigen Fall; δέ markiert einen leichten Übergang beziehungsweise Gegensatz. Die deutsche Wortstellung „Wenn ... aber“ gibt beides natürlich wieder.
- source_word: παραδῶσιν ὑμᾶς
  choice: sie euch ausliefern
  rationale: παραδίδωμι bezeichnet im Zusammenhang die Übergabe an feindliche oder gerichtliche Stellen. „Ausliefern“ bewahrt diesen Sinn, ohne den engeren Begriff „verraten“ einzutragen.
- source_word: μὴ μεριμνήσητε
  choice: macht euch keine Sorgen
  rationale: μεριμνάω bezeichnet hier sorgenvoll-ängstliches Vorausplanen. Die Wendung ist modernes, verständliches Deutsch und kein allgemeines Verbot verantwortlicher Sorge.
- source_word: πῶς ἢ τί λαλήσητε
  choice: wie oder was ihr reden sollt
  rationale: „wie oder was“ wahrt die griechische Unterscheidung zwischen Art und Inhalt der Rede sowie die disjunktive Konjunktion ἤ. „reden sollt“ gibt den erwogenen, noch bevorstehenden Sprechakt idiomatisch wieder.
- source_word: δοθήσεται
  choice: wird euch gegeben werden
  rationale: Das Futur Passiv bleibt erhalten. Dadurch wird der Geber wie im griechischen Text nicht ausdrücklich genannt.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: in jener Stunde
  rationale: Die relativ formnahe Wiedergabe bewahrt die zeitliche Unmittelbarkeit und den würdigen biblischen Ton, ohne unverständlich zu sein.
- source_word: τί λαλήσητε
  choice: was ihr reden sollt
  rationale: Die Wiederholung von λαλέω wird auch im Deutschen wiederholt und damit die sprachliche Verknüpfung des Verses erhalten.
theological_decisions:
- issue: Unausgesprochener Urheber beim Passiv δοθήσεται
  choice: Das Passiv „wird euch gegeben werden“ bleibt ohne ausdrückliche Nennung des Gebers stehen.
  alternative: „Gott wird euch geben“ oder „der Geist wird euch geben“
  rationale: Der griechische Vers nennt den Geber nicht. Erst der folgende Vers erläutert das Wirken des Geistes; diese Zurückhaltung und die dadurch entstehende Spannung sollen hier erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ausliefern“ trägt den feindlich-gerichtlichen Kontext; „macht euch keine Sorgen“ ist alltagssprachlich verständlich, ohne salopp zu wirken. Die Wiederholung von „reden sollt“ und das göttliche Passiv wurden bewusst bewahrt.
