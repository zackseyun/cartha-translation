id: MAT.10.26
reference: Matthew 10:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: de
  text: Darum fürchtet euch nicht vor ihnen! Denn nichts ist verhüllt, was nicht enthüllt werden wird, und nichts ist verborgen, was nicht bekannt werden wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Darum fürchtet euch nicht vor ihnen!
  rationale: „Darum“ gibt die folgernde Funktion von οὖν natürlich wieder; „vor ihnen“ bildet das Objekt αὐτούς im Deutschen idiomatisch ab. Der verneinte Aorist-Konjunktiv wird als nachdrückliche Aufforderung formuliert.
- source_word: κεκαλυμμένον
  choice: verhüllt
  rationale: Das Partizip bezeichnet etwas Bedecktes beziehungsweise Verhülltes. „Verhüllt“ bewahrt das Bild und bildet mit „enthüllt“ ein klares Wortpaar.
- source_word: ἀποκαλυφθήσεται
  choice: enthüllt werden wird
  rationale: Das Futur Passiv wird ausdrücklich beibehalten; „enthüllt“ entspricht sowohl semantisch als auch bildlich dem Gegensatz zu κεκαλυμμένον.
- source_word: κρυπτὸν
  choice: verborgen
  rationale: „Verborgen“ ist eine natürliche und genaue Wiedergabe für das, was geheim oder versteckt ist.
- source_word: γνωσθήσεται
  choice: bekannt werden wird
  rationale: Die Form ist Futur Passiv von γινώσκω. „Bekannt werden“ gibt den Sinn idiomatisch wieder, ohne ausdrücklich einen menschlichen oder göttlichen Handelnden einzusetzen.
theological_decisions:
- issue: Unausgesprochener Handelnder bei den Futur-Passivformen
  choice: 'Die Passivformen bleiben ohne genannten Handelnden: „enthüllt werden wird“ und „bekannt werden wird“.'
  alternative: „Gott wird alles enthüllen und bekannt machen.“
  rationale: Der griechische Text nennt den Handelnden nicht. Die Übersetzung wahrt diese Offenheit und fügt keine ausdrückliche theologische Identifikation hinzu.
- issue: Reichweite der Aussage
  choice: Die umfassenden Formulierungen „nichts … was nicht“ werden unverändert bewahrt.
  alternative: Eine kontextuell eingeengte Wiedergabe nur auf Verfolgung, Lehre oder Geheimnisse.
  rationale: Der Satz formuliert allgemein; eine nähere Begrenzung wäre Auslegung und sollte nicht in den Übersetzungstext eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die Bildbeziehung „verhüllt/enthüllt“ werden bewahrt; das Ausrufezeichen macht die nachdrückliche Ermutigung natürlich kenntlich.
