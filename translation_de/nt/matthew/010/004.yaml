source:
  edition: SBLGNT
  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: de
  text: Simon der Kananäer[a] und Judas Iskariot, der ihn auch verriet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Simon der Zelot«. Im Griechischen steht »Kananäer«, wahrscheinlich eine aus dem Aramäischen oder Hebräischen übernommene Bezeichnung, die traditionell als »Zelot« verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der ihn auch auslieferte«. Das griechische Verb kann allgemein »übergeben« oder »ausliefern« bedeuten; bei Judas passt im erzählerischen Zusammenhang »verriet«.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Kananäer
  rationale: Die eingedeutschte Umschrift bewahrt die griechische Bezeichnung, die wahrscheinlich auf eine aramäische oder hebräische Benennung zurückgeht. Die verbreitete Deutung »Zelot« wird in der Fußnote genannt, aber nicht in den Haupttext eingetragen.
- source_word: Ἰσκαριώτης
  choice: Iskariot
  rationale: Die im Deutschen etablierte Form gibt den Beinamen als Eigennamenbezeichnung wieder.
- source_word: παραδοὺς
  choice: verriet
  rationale: Das Verb bedeutet allgemein »übergeben/ausliefern«; im erzählerischen Zusammenhang mit Judas bezeichnet es jedoch eine treulose Auslieferung. »Verriet« gibt diese kontextuelle Bedeutung natürlich wieder, während die allgemeinere Bedeutung in der Fußnote erhalten bleibt.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: der ihn dann auch verriet
  rationale: Der substantivierte Partizipialausdruck wird im Deutschen natürlich als Relativsatz wiedergegeben. »Auch« bildet καί ab; »dann« verdeutlicht knapp, dass die kennzeichnende Tat später erfolgte, ohne den Sachgehalt zu erweitern.
theological_decisions:
- issue: Ob παραδοὺς neutral mit »auslieferte« oder kontextuell mit »verriet« wiederzugeben ist
  choice: verriet
  alternative: auslieferte
  rationale: Im Zusammenhang des Matthäusevangeliums kennzeichnet der Ausdruck Judas durch seine treulose Übergabe Jesu. »Verriet« bringt die moralische und relationale Kraft des Kontexts zum Ausdruck; die breitere lexikalische Bedeutung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionellen Namensformen »Kananäer« und »Iskariot« bleiben erhalten. Der knappe Stil der Apostelliste wird gewahrt; die Fußnoten machen die lexikalischen Alternativen transparent.
