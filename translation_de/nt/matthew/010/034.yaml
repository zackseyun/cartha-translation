  - severity: low
    issue: „Denkt nicht“ ist weniger idiomatisch als „Meint nicht“ in diesem Kontext.
    rationale: νομίζω bedeutet hier „meinen/vermuten“. „Meint nicht“ ist modernes Standarddeutsch und bewahrt die prohibitive Korrektur.
