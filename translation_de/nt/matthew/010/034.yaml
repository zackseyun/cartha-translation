    rationale: Der nähere Kontext stützt die Deutung des Schwertbilds als Trennung bzw. Konflikt. Die Formulierung „keine Aufforderung zur Gewalt“ ist zwar kontextuell naheliegend, aber keine lexikalische Alternative und für diese knappe Fußnote entbehrlich.
