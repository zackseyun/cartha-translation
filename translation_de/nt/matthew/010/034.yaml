  source_fidelity: Der Haupttext gibt Μὴ νομίσητε, ἦλθον, βαλεῖν, εἰρήνην, ἐπὶ τὴν γῆν und μάχαιραν sachgerecht wieder. Die deutsche Wiedergabe mit Konjunktiv I ist möglich. Die erste Fußnote behauptet jedoch fälschlich, das griechische „ich kam“ entspreche dem deutschen „ich sei gekommen“; der griechische Aorist legt diese deutsche Form nicht fest. Zudem ist die vorgeschlagene sinngemäße Formulierung unnötig weit vom Wortlaut entfernt.
  naturalness: „Denkt nicht, ich sei gekommen …“ ist grammatisch korrekt, wirkt im heutigen Standarddeutsch aber etwas gedrängt. „Meint nicht, ich sei gekommen …“ ist in diesem Warn- und Korrekturzusammenhang idiomatischer. Die Wiederholung „Frieden zu bringen“ und der scharfe Gegensatz mit „sondern“ sind natürlich.
  terminology: „Frieden“, „Erde“ und „ein Schwert“ sind treffend. Das Bild des Schwertes bleibt zu Recht im Haupttext. Die erläuternde Fußnote soll die kontextuelle Wirkung als Trennung benennen, ohne den Ausdruck zu ersetzen oder eine über den Text hinausgehende Aussage über Gewalt zuzuschreiben.
