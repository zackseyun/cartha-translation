source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: de
  text: Meint nicht, ich sei gekommen, Frieden auf die Erde zu bringen.[a] Ich bin nicht gekommen, Frieden zu bringen, sondern ein Schwert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meint nicht, dass ich gekommen bin“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „ein Schwert“. Im folgenden Zusammenhang steht das Bild für Trennung und Konflikt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Denkt nicht
  rationale: Die Verbindung aus μή und Aorist-Konjunktiv formuliert hier eine verneinte Aufforderung. „Denkt nicht“ ist direkt, natürlich und bewahrt die gedankliche Aussage, ohne sie auszudeuten.
- source_word: ἦλθον
  choice: ich sei gekommen / ich bin gekommen
  rationale: Nach „Denkt nicht“ verlangt das Deutsche idiomatisch indirekte Rede mit Konjunktiv I („ich sei gekommen“); im anschließenden direkten Aussagesatz steht „ich bin gekommen“. Das deutsche Perfekt gibt die auf Jesu gegenwärtigen Auftrag bezogene vergangene Ankunft natürlicher wieder als das Präteritum „ich kam“.
- source_word: βαλεῖν
  choice: zu bringen
  rationale: Obwohl βάλλω wörtlich „werfen“ oder „setzen“ bedeuten kann, bezeichnet der Infinitiv in dieser Zweckkonstruktion das Herbeiführen beziehungsweise Bringen von Frieden oder Schwert. „Zu bringen“ ist im Deutschen klar und idiomatisch.
- source_word: εἰρήνην
  choice: Frieden
  rationale: „Frieden“ ist die unmittelbare und übliche Entsprechung von εἰρήνη und lässt den Umfang des Begriffs offen.
- source_word: ἐπὶ τὴν γῆν
  choice: auf die Erde
  rationale: Die Formulierung wahrt die Präposition und den bestimmten Artikel des Griechischen und versteht γῆ hier im umfassenden Sinn als „Erde“, nicht enger als „Land“.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der deutschen Negation „nicht“ drückt „sondern“ den scharfen Gegensatz natürlicher und präziser aus als „aber“.
- source_word: μάχαιραν
  choice: ein Schwert
  rationale: μάχαιρα bezeichnet ein Schwert beziehungsweise Kurzschwert oder großes Messer. Das konkrete Bild „ein Schwert“ wird bewahrt und nicht bereits im Haupttext als „Trennung“ ausgelegt.
theological_decisions:
- issue: Ob das Schwertbild im Haupttext zu „Trennung“ abgeschwächt oder aufgelöst werden soll
  choice: Das konkrete Bild „ein Schwert“ bleibt im Haupttext erhalten.
  alternative: „Trennung“
  rationale: Der griechische Text nennt ausdrücklich μάχαιραν, „ein Schwert“. Der folgende Zusammenhang beschreibt zwar die trennende Wirkung von Jesu Sendung, doch eine paraphrasierende Auflösung würde die bewusste Spannung des Bildes beseitigen. Eine Fußnote kann die Kontextfunktion erläutern, ohne den Wortlaut umzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. Der Konjunktiv I nach „Denkt nicht“ ist grammatisch präzise und noch gut verständlich. Die Wiederholung von „Frieden bringen“ und das anstößige Schwertbild werden bewusst beibehalten.
