  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: de
  text: In welche Stadt oder welches Dorf ihr auch kommt, erkundigt euch, wer dort würdig ist[a], und bleibt dort, bis ihr weiterzieht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Würdig“ meint hier im Zusammenhang wohl jemanden, der geeignet oder bereit ist, die Boten aufzunehmen; es geht nicht darum, sich Gottes Gunst verdient zu haben.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: bis ihr hinausgeht; gemeint sein kann: bis ihr den Ort verlasst.'
    reason: translation_clarification
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: In welche Stadt oder welches Dorf ihr auch kommt
  rationale: Die indefinite Relativkonstruktion mit ἄν bezeichnet jeden beliebigen Ort, in den die Jünger gelangen. „Kommt“ gibt das Eintreten in eine Stadt oder ein Dorf im heutigen Deutsch natürlich wieder.
- source_word: ἐξετάσατε
  choice: erkundigt euch
  rationale: Das Verb fordert zu einer gezielten, sorgfältigen Erkundigung auf. Die Formulierung ist idiomatisch und vermeidet den für diesen Zusammenhang zu technischen Klang von „untersucht“.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: wer dort würdig ist
  rationale: „Dort“ verweist natürlich auf die zuvor genannte Ortschaft. „Würdig“ bewahrt den wertenden und kontextuell offenen Gehalt von ἄξιος, statt ihn im Haupttext auf „geeignet“ oder „gastfreundlich“ festzulegen.
- source_word: κἀκεῖ μείνατε
  choice: und bleibt bei ihm
  rationale: Im Zusammenhang geht es um den Aufenthalt bei der als würdig ermittelten Person. „Bei ihm“ macht diesen im Griechischen kontextuell gegebenen Bezug im Deutschen verständlich; das generische Maskulinum bezieht sich auf „wer“ und legt das Geschlecht der Person nicht fest.
- source_word: ἕως ἂν ἐξέλθητε
  choice: bis ihr weiterzieht
  rationale: Gemeint ist der Zeitpunkt, an dem die Jünger den betreffenden Ort wieder verlassen. „Weiterzieht“ ist in der Reisesituation natürlich und vermeidet die mögliche Fehlauffassung, sie sollten lediglich das Haus verlassen.
theological_decisions:
- issue: Bedeutung von ἄξιος in der Aussendungsanweisung
  choice: „würdig“ im Haupttext beibehalten und kontextuell als würdig beziehungsweise geeignet, die Boten aufzunehmen, erläutern
  alternative: „geeignet“ oder „aufnahmebereit“ direkt in den Haupttext setzen
  rationale: Das griechische Wort trägt eine echte wertende Nuance, deren genaue Reichweite der Vers nicht ausdrücklich festlegt. Die Übersetzung wahrt diese Offenheit und verhindert in der Fußnote zugleich die unbegründete Deutung, hier werde das Verdienen von Gottes Gunst ausgesagt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Anrede im Plural und der knappe Anweisungsstil des griechischen Textes bleiben erhalten. Die Fußnotenmarker [a] und [b] stehen jeweils an der erläuterten Stelle.
