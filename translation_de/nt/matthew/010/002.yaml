  variant: modern standard German
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: de
  text: 'Dies sind die Namen der zwölf Apostel: Als Erster[a] Simon, der Petrus genannt wird, und sein Bruder Andreas; Jakobus, der Sohn des Zebedäus, und sein Bruder Johannes,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Als Erster“ kann außer der Reihenfolge auch eine besondere Stellung unter den Zwölf andeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt; Übergang durch den Satzfluss wiedergegeben
  rationale: δέ markiert hier einen leichten Übergang. Ein ausdrückliches „nun“ würde im Deutschen leicht eine zeitliche Bedeutung nahelegen, die im Griechischen nicht ausdrücklich vorhanden ist.
- source_word: δώδεκα ἀποστόλων
  choice: der zwölf Apostel
  rationale: „Apostel“ ist im Matthäusevangelium die etablierte und sachlich passende Bezeichnung für die von Jesus beauftragte Gruppe.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Die Namen … sind diese
  rationale: Die Formulierung bewahrt die demonstrative Struktur des griechischen Textes und bleibt in würdigem modernem Deutsch verständlich.
- source_word: πρῶτος
  choice: Als Erster
  rationale: Die Wendung passt natürlich zur beginnenden Aufzählung. Sie legt im Haupttext keine bestimmte Rang- oder Amtslehre fest.
- source_word: ὁ λεγόμενος
  choice: der … genannt wird
  rationale: Dies gibt die identifizierende Partizipialkonstruktion transparent und natürlich wieder.
- source_word: Πέτρος
  choice: Petrus
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: sein Bruder
  rationale: ἀδελφός bezeichnet hier jeweils den leiblichen Bruder; die Possessivkonstruktion ist idiomatisches Deutsch.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: der Sohn des Zebedäus
  rationale: Die griechische Genitivbezeichnung drückt die Abstammung aus und wird im Deutschen sachgerecht expliziert.
theological_decisions:
- issue: Bedeutung von πρῶτος bei Simon/Petrus
  choice: 'Im Haupttext als Beginn der Aufzählung wiedergegeben: „Als Erster“'
  alternative: „Der Erste“ beziehungsweise eine Deutung als Hinweis auf Vorrang oder besondere Stellung unter den Zwölf
  rationale: πρῶτος kann die Reihenfolge bezeichnen und möglicherweise zugleich eine Hervorhebung andeuten. Der Haupttext wahrt den einfachen lexikalischen Sinn; die Fußnote erhält die mögliche Bedeutungsnuance, ohne eine konfessionelle Folgerung festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Namen folgen den etablierten deutschen Formen. Die Satzstruktur bleibt nahe am griechischen Text, ohne unnatürlich zu wirken.
