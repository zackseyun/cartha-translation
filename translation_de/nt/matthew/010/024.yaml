  source_fidelity: 'Die Grundstruktur und die Rangvergleichsbedeutung von ὑπέρ sind korrekt wiedergegeben. Im matthäischen Kontext ist μαθητής jedoch besser mit „Jünger“ als mit „Schüler“ wiederzugeben: Das Wort bezeichnet hier Jesu Nachfolger innerhalb der Jünger- und Sendungsrede, nicht lediglich einen Lernenden in einem allgemeinen Schulverhältnis. Die Paarung δοῦλος–κύριος wird mit „Sklave–Herr“ treffend und ohne unangemessene theologische Aufladung wiedergegeben.'
