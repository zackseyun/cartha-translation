  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a servant above his master.
translation:
  language: de
  text: Ein Jünger steht nicht über seinem Lehrer, ebenso wenig ein Sklave[a] über seinem Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das griechische Wort δοῦλος kann je nach Zusammenhang auch einen Diener bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαθητής
  choice: Schüler
  rationale: „Schüler“ gibt die persönliche Lern- und Nachfolgebeziehung zu einem Lehrer in natürlichem modernem Deutsch wieder; „Jünger“ wäre im Evangelienkontext ebenfalls möglich, klingt hier jedoch stärker als feststehende religiöse Bezeichnung.
- source_word: ὑπέρ
  choice: über … stehen
  rationale: Mit dem Akkusativ bezeichnet ὑπέρ hier einen höheren Rang oder eine übergeordnete Stellung. Die deutsche Wendung „über jemandem stehen“ bewahrt diesen Vergleich.
- source_word: διδάσκαλος
  choice: Lehrer
  rationale: „Lehrer“ ist die klare Grundbedeutung und erhält die Parallelität Schüler–Lehrer.
- source_word: δοῦλος
  choice: Sklave
  rationale: Im Gegenpaar mit κύριος bezeichnet das Wort hier eine rechtlich und sozial untergeordnete, einem Herrn gehörende Person; „Sklave“ bildet diese Beziehung genauer ab als „Diener“.
- source_word: κύριος
  choice: Herr
  rationale: Im sozialen Vergleich mit δοῦλος bezeichnet κύριος den menschlichen Herrn eines Sklaven. „Herr“ ist im Deutschen dafür idiomatisch und bewahrt zugleich die lexikalische Breite des Ausdrucks.
- source_word: αὐτοῦ
  choice: seinem
  rationale: Das Genitivpronomen bezeichnet die Zugehörigkeitsbeziehung des Sklaven zu seinem Herrn; die deutsche Possessivform gibt dies natürlich wieder.
- source_word: οὐδέ
  choice: und … nicht
  rationale: „Und … nicht“ verbindet die beiden negativen Parallelsätze in klarem, natürlichem Deutsch; „noch“ wäre ebenfalls möglich.
theological_decisions:
- issue: Wiedergabe von δοῦλος in einem sozialen Vergleich
  choice: Sklave
  alternative: Diener
  rationale: Der unmittelbare Gegensatz zu κύριος hebt den Status und die Abhängigkeit hervor. „Sklave“ wahrt diese Schärfe, ohne den Vergleich theologisch umzudeuten.
- issue: Wiedergabe von κύριος in einem nicht göttlichen Kontext
  choice: Herr
  alternative: Gebieter
  rationale: Hier ist κύριος Teil des sozialen Begriffspaars Sklave–Herr und kein ausdrücklich christologischer Titel. „Herr“ ist sachgerecht und lässt die im griechischen Wort vorhandene Bedeutungsbreite bestehen.
- issue: Wiedergabe von μαθητής im Evangelienkontext
  choice: Schüler
  alternative: Jünger
  rationale: Der Satz formuliert eine allgemeine Lehrer-Schüler-Analogie. „Schüler“ macht diese Beziehung unmittelbar verständlich; die traditionelle evangelische Wiedergabe „Jünger“ bleibt als mögliche Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarweise Satzstruktur des Griechischen bleibt erhalten; die elliptische zweite Hälfte wird im Deutschen natürlich fortgeführt.
