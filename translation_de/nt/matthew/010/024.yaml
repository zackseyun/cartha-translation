    rationale: Die belegte Alternative betrifft δοῦλος, nicht den gesamten Vers. Eine unmittelbare Verankerung bei „Sklave“ macht den Bezug eindeutig; die zusätzliche Alternative „Jünger“ ist nach der gewählten Revision nicht mehr erforderlich.
