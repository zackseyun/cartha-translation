  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: de
  text: Darum habt keine Angst! Ihr seid mehr wert als viele Spatzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: Darum habt keine Angst
  rationale: οὖν zieht die Folgerung aus Jesu vorheriger Begründung über die Fürsorge des Vaters. μὴ mit dem Präsensimperativ φοβεῖσθε formuliert ein Verbot; „habt keine Angst“ ist dafür eine natürliche und klare deutsche Wiedergabe.
- source_word: πολλῶν στρουθίων
  choice: als viele Spatzen
  rationale: στρουθίον bezeichnet im unmittelbaren Zusammenhang (Matthäus 10,29) einen Spatz beziehungsweise einen kleinen, gering geachteten Vogel. Der Genitiv steht nach διαφέρετε im Vergleich.
- source_word: διαφέρετε
  choice: seid mehr wert
  rationale: διαφέρω bedeutet hier nicht bloß „sich unterscheiden“, sondern „übertreffen“ beziehungsweise „von größerem Wert sein“. „Mehr wert sein“ gibt den vergleichenden Sinn idiomatisch wieder.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen hebt die angesprochenen Jünger gegenüber den Spatzen hervor. Das deutsche „ihr“ bewahrt diese Gegenüberstellung durch seine Stellung am Satzanfang.
theological_decisions:
- issue: Der vergleichsweise größere Wert der Jünger gegenüber den Spatzen
  choice: Ihr seid mehr wert als viele Spatzen.
  alternative: Ihr seid wichtiger als viele Spatzen.
  rationale: Die gewählte Fassung bewahrt die vergleichende Wertung von διαφέρετε und damit Jesu Zusicherung der besonderen Fürsorge Gottes für die Jünger. Sie bestreitet nicht Gottes ebenfalls im Kontext ausgesagte Fürsorge für die Spatzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem, direktem Ton. Das Ausrufezeichen nach dem Verbot bildet die eindringliche Ermutigung ab; der zweite Satz trägt die begründende Zusicherung.
