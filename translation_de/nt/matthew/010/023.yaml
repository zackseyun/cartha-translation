source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: de
  text: 'Wenn sie euch aber in dieser Stadt verfolgen, dann flieht in die nächste.[a] Amen, ich sage euch: Ihr werdet mit den Städten Israels keinesfalls fertig werden,[b] bis der Menschensohn kommt.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in eine andere Stadt“. Im Griechischen steht wörtlich „in die andere [Stadt]“; „Stadt“ ist aus dem vorhergehenden Satz zu ergänzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihr werdet die Städte Israels keinesfalls zu Ende durchziehen.“ Das griechische Verb bedeutet „vollenden, zu Ende bringen“; welche Tätigkeit im Blick ist, ergibt sich nur aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: c
    text: Die Aussage „bis der Menschensohn kommt“ ist bewusst offengelassen. Umstritten ist, ob sie Jesu Rechtfertigung, ein Kommen zum Gericht oder seine endgültige Wiederkunft bezeichnet.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Das indefinite temporale ὅταν bezeichnet hier einen möglichen bzw. wiederholt eintretenden Fall. Im natürlichen modernen Deutsch gibt „wenn“ diesen Sinn idiomatischer wieder als „wann immer“.
- source_word: διώκωσιν
  choice: verfolgen
  rationale: Im Kontext der Aussendungsrede bezeichnet das Verb feindselige Verfolgung, nicht bloß ein Nachsetzen.
- source_word: πόλει ταύτῃ
  choice: in dieser Stadt
  rationale: Die proximale Demonstrativform wird direkt und ohne Abschwächung wiedergegeben.
- source_word: φεύγετε
  choice: flieht
  rationale: Der Imperativ fordert angesichts der Verfolgung zu dringender Flucht auf; „flieht“ ist prägnant und kraftvoll.
- source_word: εἰς τὴν ἑτέραν
  choice: in die nächste
  rationale: „Stadt“ ist aus dem vorigen Satzglied zu ergänzen. „Die nächste“ passt zum Weiterziehen, während die mögliche allgemeinere Bedeutung „eine andere“ in einer Fußnote erhalten bleibt.
- source_word: ἀμὴν
  choice: Amen
  rationale: Die überlieferte einleitende Bekräftigungsformel wird formal bewahrt und ist im Deutschen verständlich und würdevoll.
- source_word: οὐ μὴ τελέσητε
  choice: ihr werdet … keinesfalls zu Ende kommen
  rationale: „Keinesfalls“ bildet die nachdrückliche Verneinung οὐ μή ab. Die Wendung mit den Städten lässt die im Kontext gemeinte Tätigkeit offen, ohne das nicht ausdrücklich vorhandene „durchziehen“ in den Haupttext einzutragen.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: mit den Städten Israels
  rationale: Die Präposition „mit“ ermöglicht im Deutschen die idiomatische Verbindung „mit etwas zu Ende kommen“; der Genitiv „Israels“ wahrt die schlichte Zuordnung des griechischen Ausdrucks.
- source_word: ἕως ἂν ἔλθῃ
  choice: bis … kommt
  rationale: Die temporale Konstruktion bezeichnet den künftigen Zeitpunkt, bis zu dem das verneinte Vollenden nicht eintreten wird.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die im Deutschen etablierte Wiedergabe bewahrt den Titel und seine biblisch-theologische Resonanz.
theological_decisions:
- issue: Bedeutung des Kommens des Menschensohnes
  choice: „bis der Menschensohn kommt“ bleibt ohne nähere Bestimmung stehen.
  alternative: Deutung auf Jesu Auferstehung bzw. Rechtfertigung, ein Gerichtskommen oder seine endgültige Wiederkunft.
  rationale: Der griechische Wortlaut legt den konkreten Bezug an dieser Stelle nicht eindeutig fest. Die Übersetzung wahrt daher die exegetische und eschatologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Satzbau bleibt nah am griechischen Gedankengang; „Amen, ich sage euch“ bewahrt die markante Autoritätsformel. Die Fußnoten kennzeichnen sowohl die lexikalische Offenheit als auch die nicht aufzulösende eschatologische Deutungsfrage.
