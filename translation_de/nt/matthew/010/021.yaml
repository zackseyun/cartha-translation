  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und alle zentralen Aussagen des griechischen Textes präzise wieder: die Auslieferung zum Tod, die parallele Vater-Kind-Beziehung, das feindselige Erheben der Kinder gegen die Eltern und die anschließende Tötung. „Dem Tod ausliefern“ wahrt die Zielrichtung von εἰς θάνατον, ohne Empfänger oder Verfahren unzulässig festzulegen.'
