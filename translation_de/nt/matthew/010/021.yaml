id: MAT.10.21
reference: Matthew 10:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: de
  text: Ein Bruder wird aber seinen Bruder dem Tod ausliefern[a] und ein Vater sein Kind. Kinder werden sich gegen ihre Eltern erheben und sie zu Tode bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „preisgeben“; das Verb kann in einem Zusammenhang von Treulosigkeit auch „verraten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: wird … ausliefern
  rationale: Das Verb bezeichnet hier die Übergabe eines Menschen an feindliche Gewalt mit Todesfolge. „Ausliefern“ ist im Deutschen natürlich und bewahrt diesen konkreten Sinn, ohne die mögliche Bedeutung „verraten“ zur alleinigen Deutung zu machen.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: ein Bruder … seinen Bruder
  rationale: Die repräsentativen Singularformen und die ausdrücklich männliche Verwandtschaftsbezeichnung bleiben erhalten; das Possessivpronomen ergibt idiomatisches Deutsch.
- source_word: εἰς θάνατον
  choice: dem Tod
  rationale: In Verbindung mit „ausliefern“ gibt der Dativ die auf den Tod gerichtete Übergabe knapp und idiomatisch wieder.
- source_word: πατὴρ τέκνον
  choice: ein Vater sein Kind
  rationale: τέκνον bezeichnet geschlechtsübergreifend ein Kind; „sein“ ergänzt die im Griechischen aus der Beziehung erschlossene Zugehörigkeit.
- source_word: ἐπαναστήσονται
  choice: werden sich … erheben
  rationale: Die Wendung bewahrt das anschauliche Bild des feindseligen Aufstehens, ohne es unnötig auf politische Rebellion einzuengen.
- source_word: τέκνα
  choice: Kinder
  rationale: Die Übersetzung entspricht dem geschlechtsübergreifenden Bedeutungsumfang von τέκνα.
- source_word: ἐπὶ γονεῖς
  choice: gegen ihre Eltern
  rationale: ἐπί mit Akkusativ bezeichnet hier die feindliche Ausrichtung. Das im Deutschen ergänzte „ihre“ verdeutlicht die familiäre Beziehung, die der Zusammenhang voraussetzt.
- source_word: θανατώσουσιν
  choice: werden … zu Tode bringen
  rationale: Die Formulierung gibt das absichtliche Verursachen des Todes würdig und deutlich wieder, ohne zwingend ein förmliches Hinrichtungsverfahren anzunehmen.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen bezieht sich unmittelbar und verständlich auf „ihre Eltern“.
theological_decisions:
- issue: Geschlechtsspezifische und repräsentative Familienbegriffe
  choice: ἀδελφός wird mit „Bruder“, τέκνα und γονεῖς werden mit „Kinder“ und „Eltern“ wiedergegeben.
  alternative: ἀδελφός geschlechtsneutral mit „Geschwister“ wiedergeben.
  rationale: Die Übersetzung wahrt die männliche Bezeichnung ἀδελφός und zugleich den weiteren, geschlechtsübergreifenden Umfang von τέκνα und γονεῖς.
- issue: Art der Übergabe zum Tod
  choice: „dem Tod ausliefern“ lässt offen, ob die Übergabe an Behörden oder an andere feindliche Akteure erfolgt.
  alternative: Mit „verraten“ eine heimtückische Preisgabe oder mit „hinrichten lassen“ ein gerichtliches Verfahren ausdrücklich festlegen.
  rationale: Der griechische Wortlaut beschreibt die tödliche Auslieferung, bestimmt aber weder den Empfänger noch ein konkretes Verfahren vollständig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Satzstruktur macht die familiäre Eskalation klar; „sich gegen … erheben“ bewahrt die Bildhaftigkeit des griechischen Ausdrucks.
