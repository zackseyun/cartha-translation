  terminology: „Bruder“ bildet ἀδελφός angemessen geschlechtsspezifisch ab; „Kind/Kinder“ und „Eltern“ entsprechen dem weiteren Bedeutungsumfang von τέκνον, τέκνα und γονεῖς. „Sich gegen ihre Eltern erheben“ trifft ἐπαναστήσονται idiomatisch und bildhaft. „Zu Tode bringen“ gibt θανατώσουσιν deutlich wieder, ohne eine gerichtliche Hinrichtung zu behaupten. Die Fußnote zu παραδώσει bewahrt die mögliche Verratsnuance, ohne sie in den Haupttext einzutragen.
