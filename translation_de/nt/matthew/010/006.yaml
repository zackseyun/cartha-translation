  source_fidelity: 'Der Haupttext gibt den Imperativ πορεύεσθε, den kontrastiv-präferierenden Ausdruck δὲ μᾶλλον und das Bild von den „verlorenen Schafen des Hauses Israel“ präzise wieder. Die Fußnote ist jedoch syntaktisch und semantisch problematisch: Der griechische Genitiv οἴκου Ἰσραήλ bezeichnet die Zuordnung der Schafe zum „Haus Israel“; eine Herkunfts- bzw. Trennungsbedeutung („aus dem Haus Israel verloren gegangen“) ist hier nicht angezeigt.'
  naturalness: „Geht vielmehr zu den verlorenen Schafen des Hauses Israel“ ist natürliches, würdiges modernes Standarddeutsch und bewahrt die knappe Befehlsform. Die bisherige Fußnotenformulierung „aus dem Haus Israel verloren gegangen“ klingt zudem im Deutschen unidiomatisch.
  terminology: „verlorene Schafe“ erhält die Metapher von τὰ πρόβατα τὰ ἀπολωλότα. „Haus Israel“ ist als biblisch geprägte, weiterhin verständliche Bezeichnung angemessen. Die Fußnote wird so gefasst, dass sie die mögliche deutsche Umstellung erläutert, ohne eine nicht im griechischen Text liegende räumlich-ablative Nuance einzutragen.
