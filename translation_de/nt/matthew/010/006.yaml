  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: de
  text: Geht vielmehr zu den verlorenen Schafen des Hauses Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit umgestellter Satzfügung: „Geht vielmehr zu den Schafen des Hauses Israel, die verloren sind.“'
    reason: 'Syntaktische Alternative: Die Umstellung macht die Zugehörigkeit der Schafe zum Haus Israel ausdrücklich, ohne den Genitiv als räumliches „aus dem Haus Israel“ zu deuten.'
lexical_decisions:
- source_word: πορεύεσθε
  choice: Geht
  rationale: Der Imperativ in der zweiten Person Plural wird im Deutschen natürlich mit „Geht“ wiedergegeben und bewahrt den ausdrücklichen Auftragscharakter.
- source_word: δὲ μᾶλλον
  choice: vielmehr
  rationale: Die Verbindung markiert im Kontext einen Gegensatz und lenkt die Jünger vom zuvor untersagten Weg auf das gebotene Ziel um. „Vielmehr“ gibt diese Korrektur knapp und idiomatisch wieder.
- source_word: πρὸς
  choice: zu
  rationale: Bei einem Verb der Bewegung bezeichnet πρός die Zielrichtung; „zu“ ist hier die natürliche deutsche Entsprechung.
- source_word: τὰ πρόβατα
  choice: den Schafen
  rationale: „Schafe“ erhält das ausdrücklich verwendete Hirtenbild und dessen biblische Bezüge, statt es durch eine erklärende Umschreibung aufzulösen.
- source_word: τὰ ἀπολωλότα
  choice: den verlorenen
  rationale: Das substantivbezogene Partizip von ἀπόλλυμι bezeichnet im Hirtenbild Schafe, die verloren sind. „Verloren“ bewahrt sowohl den Zustand als auch die metaphorische Offenheit.
- source_word: οἴκου Ἰσραήλ
  choice: des Hauses Israel
  rationale: Die traditionelle, aber weiterhin verständliche Wendung erhält den gemeinschaftlichen und biblisch geprägten Sinn des Genitivs genauer als die Paraphrase „des Volkes Israel“.
theological_decisions:
- issue: Metaphorische Beschreibung Israels
  choice: Das Bild von den „verlorenen Schafen des Hauses Israel“ bleibt unverändert erhalten.
  alternative: die vom rechten Weg abgekommenen Israeliten
  rationale: Der griechische Text formuliert ausdrücklich eine Schafmetapher mit alttestamentlichem Hintergrund. Eine erklärende Wiedergabe würde das Bild interpretierend verengen.
- issue: Zuordnung von „des Hauses Israel“
  choice: Im Haupttext bezeichnet der Genitiv die Zugehörigkeit der verlorenen Schafe zum Haus Israel.
  alternative: Schafe, die aus dem Haus Israel verloren gegangen sind
  rationale: Die Hauptfassung folgt der nächstliegenden Genitivverbindung, während die mögliche ablativisch gedachte Nuance des Verlorengegangenseins aus dem Haus in einer Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Befehlsform und das biblische Hirtenbild bleiben erhalten; „Haus Israel“ wahrt den biblischen Klang, ohne altertümliche Satzstellung.
