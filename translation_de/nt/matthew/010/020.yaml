id: MAT.10.20
reference: Matthew 10:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: de
  text: Denn nicht ihr seid es, die reden, sondern der Geist eures Vaters ist es, der in euch redet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch euch“. Wörtlich steht im Griechischen „in euch“; im Zusammenhang kann damit auch gemeint sein, dass der Geist durch die Jünger redet.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn nicht
  rationale: γάρ begründet die vorausgehende Zusage; „Denn“ gibt diesen erklärenden Anschluss natürlich wieder.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: ihr seid es, die reden
  rationale: Die Konstruktion hebt ausdrücklich hervor, wer die Redenden sind. Die deutsche Spaltsatzform bewahrt diesen Nachdruck und den durativen Charakter des Präsens.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach einer verneinten Aussage bezeichnet ἀλλά den starken Gegensatz; im Deutschen ist „sondern“ hier treffender als „aber“.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: der Geist eures Vaters
  rationale: Die Formulierung folgt der Genitivverbindung genau. „Himmlisch“ wird nicht ergänzt, da es im Vers nicht steht.
- source_word: τὸ λαλοῦν
  choice: ist es, der … redet
  rationale: Das substantivierte Partizip bezieht sich grammatisch eindeutig auf „Geist“. Die wiederholte Hervorhebungsform bildet zugleich die Parallelität der beiden Satzhälften natürlich ab.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: ἐν bedeutet unmittelbar „in“. Im Zusammenhang kann die Wendung auch ein Reden durch die Jünger einschließen, doch die Übersetzung bewahrt die offene Ausdrucksweise des Griechischen.
theological_decisions:
- issue: Ob ἐν ὑμῖν als innewohnende Gegenwart („in euch“) oder als vermittelnde Wirksamkeit („durch euch“) wiederzugeben ist
  choice: in euch
  alternative: durch euch
  rationale: Der unmittelbare Sinn der Präposition ἐν ist „in“. Der Zusammenhang des vom Geist gewirkten Redens lässt „durch euch“ als Sinnmöglichkeit zu, ohne dass die griechische Formulierung darauf festgelegt werden sollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Form „ihr seid es … der Geist … ist es“ bewahrt die nachdrückliche Gegenüberstellung des griechischen Satzes, ohne unnatürlich wörtlich zu wirken.
