  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: de
  text: Philippus und Bartholomäus, Thomas und Matthäus, der Zöllner, Jakobus, der Sohn des Alphäus, und Thaddäus[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »Lebbäus« oder »Lebbäus, genannt Thaddäus«. In den entsprechenden Apostellisten bei Lukas steht »Judas des Jakobus«; die genaue Beziehung zu Jakobus bleibt dabei offen.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: Philippus
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Βαρθολομαῖος
  choice: Bartholomäus
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Θωμᾶς
  choice: Thomas
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Μαθθαῖος
  choice: Matthäus
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: ὁ τελώνης
  choice: der Zolleinnehmer
  rationale: τελώνης bezeichnet einen Einnehmer von Zöllen oder Abgaben. „Zolleinnehmer“ ist im Deutschen verständlich und bildet den historischen Tätigkeitsbereich präziser ab als das allgemeinere „Steuereinnehmer“.
- source_word: Ἰάκωβος
  choice: Jakobus
  rationale: Die herkömmliche deutsche Namensform für Ἰάκωβος bei den gleichnamigen neutestamentlichen Personen.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: der Sohn des Alphäus
  rationale: Die elliptische Genitivverbindung bezeichnet die Abstammung; im Deutschen wird die Beziehung zur Klarheit ausdrücklich gemacht.
- source_word: Ἁλφαίου
  choice: Alphäus
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Θαδδαῖος
  choice: Thaddäus
  rationale: Direkte Wiedergabe der Lesart des SBLGNT; abweichende Namen in Handschriften und Parallelstellen werden in der Fußnote dokumentiert.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Struktur der griechischen Namensliste wird beibehalten.
theological_decisions:
- issue: Identität des zuletzt genannten Apostels
  choice: Thaddäus
  alternative: Lebbäus; Judas, der Sohn des Jakobus
  rationale: Der vorgelegte griechische Ausgangstext liest Θαδδαῖος. Andere handschriftliche Lesarten und die entsprechenden Listen bei Lukas werden nicht harmonisierend in den Haupttext aufgenommen, sondern transparent in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die paarweise Reihung der Namen und die wiederholten Konjunktionen des Griechischen bleiben erkennbar; erläuternde Appositionen werden durch Kommas übersichtlich gegliedert.
