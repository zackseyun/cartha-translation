id: MAT.10.40
reference: Matthew 10:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: de
  text: Wer euch aufnimmt[a], nimmt mich auf; und wer mich aufnimmt, nimmt den auf, der mich gesandt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „willkommen heißt“ beziehungsweise „annimmt“. Das griechische Verb kann besonders die Aufnahme und Annahme eines Boten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Wer ... aufnimmt
  rationale: Das substantivierte Partizip mit Artikel bezeichnet allgemein jeden, auf den die Aussage zutrifft. Die deutsche Wer-Konstruktion gibt diesen generischen Sinn natürlich und ohne unnötige Geschlechtsmarkierung wieder.
- source_word: δέχομαι / δέχεται
  choice: aufnimmt
  rationale: „Aufnehmen“ kann hier sowohl gastfreundliches Willkommenheißen als auch die Annahme eines Boten ausdrücken. Die konsequente Wiederholung bewahrt die im Griechischen bewusst gebildete Identifikationskette.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen steht in der zweiten Person Plural und bezieht sich auf die von Jesus angesprochenen Jünger.
- source_word: ἐμέ
  choice: mich
  rationale: Das betonte Pronomen der ersten Person Singular bezeichnet Jesus und wird unmittelbar wiedergegeben.
- source_word: τὸν ἀποστείλαντά με
  choice: den, der mich gesandt hat
  rationale: Das substantivierte Aoristpartizip wird als natürliche deutsche Relativkonstruktion wiedergegeben. „Gesandt“ wahrt den Sendungscharakter von ἀποστέλλω.
theological_decisions:
- issue: Identität dessen, der Jesus gesandt hat
  choice: „den, der mich gesandt hat“ ohne ausdrückliche Ergänzung „Vater“
  alternative: „den Vater, der mich gesandt hat“
  rationale: Der Zusammenhang und die matthäische Theologie weisen auf den Vater, doch der griechische Wortlaut nennt ihn hier nicht ausdrücklich. Die Übersetzung lässt diese Implikation bestehen, ohne sie in den Text einzufügen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die dreifache Wiederholung von „aufnimmt“ bildet die rhetorische Struktur des griechischen Satzes ab; das Semikolon gliedert die zwei eng verbundenen Aussagen.
