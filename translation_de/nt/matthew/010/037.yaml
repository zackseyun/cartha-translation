  source_fidelity: Die Übersetzung bildet die beiden exakt parallelen griechischen Satzglieder zuverlässig ab. „Wer ... mehr liebt als mich“ gibt ὁ φιλῶν ... ὑπὲρ ἐμέ idiomatisch und präzise als Vergleich bzw. Vorrang wieder. „Ist meiner nicht würdig“ entspricht οὐκ ἔστιν μου ἄξιος ohne zusätzliche Auslegung.
  naturalness: Das Deutsch ist klar, würdig und für eine moderne Bibelübersetzung natürlich. Die Wendung „meiner nicht würdig“ ist leicht gehoben, aber weiterhin verständlich und im biblisch-literarischen Register passend. Die Wiederholung bewahrt den beabsichtigten Parallelismus.
  terminology: Die Familienbezeichnungen sowie „würdig“ sind konsistent und quellentreu. Es werden weder Possessivpronomen noch eine konfessionell deutende Erklärung ergänzt. Die Formulierung wahrt die offene Beziehungsnuance des Genitivs μου.
