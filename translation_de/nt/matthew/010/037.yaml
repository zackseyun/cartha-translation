id: MAT.10.37
reference: Matthew 10:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: de
  text: Wer Vater oder Mutter mehr liebt als mich, ist meiner nicht würdig; und wer Sohn oder Tochter mehr liebt als mich, ist meiner nicht würdig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: wer … liebt
  rationale: Der substantivierte Präsenspartizip bezeichnet allgemein einen Menschen, der entsprechend handelt. Die deutsche Konstruktion mit „wer“ ist natürlich, gegenwartsnah und bewahrt den allgemeinen Sinn.
- source_word: πατέρα ἢ μητέρα
  choice: Vater oder Mutter
  rationale: Die Verwandtschaftsbezeichnungen stehen im Griechischen ohne Artikel und Possessivpronomen. Die knappe deutsche Wiedergabe entspricht dem Wortlaut und ist idiomatisch verständlich.
- source_word: ὑπὲρ ἐμέ
  choice: mehr … als mich
  rationale: ὑπέρ mit Akkusativ drückt hier im Zusammenhang des Liebens einen Vergleich beziehungsweise Vorrang aus. „Mehr als mich“ gibt diesen Sinn im Deutschen klar wieder.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: ist meiner nicht würdig
  rationale: Die feste deutsche Wendung bewahrt die Verbindung von ἄξιος mit dem Genitiv μου eng und lässt die anspruchsvolle Aussage ohne erklärende Erweiterung stehen.
- source_word: καὶ
  choice: und
  rationale: Die einfache Konjunktion erhält den parallelen Aufbau der beiden Satzhälften.
- source_word: υἱὸν ἢ θυγατέρα
  choice: Sohn oder Tochter
  rationale: Wie bei „Vater oder Mutter“ wird kein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen ergänzt.
theological_decisions:
- issue: Jesu Anspruch gegenüber familiärer Liebe und Loyalität
  choice: Die Übersetzung fordert, Jesus selbst gegenüber den engsten Familienbindungen den Vorrang zu geben.
  alternative: Eine Abschwächung wie „mich nicht ebenso sehr liebt“ oder eine Verschärfung zu einem Gebot, die Familie zu hassen.
  rationale: Der griechische Vergleich ὑπὲρ ἐμέ bezeichnet größere Liebe beziehungsweise Vorrang. Die Übersetzung bewahrt sowohl den scharfen Anspruch Jesu als auch den Umstand, dass die Liebe zur Familie hier nicht an sich verworfen wird.
- issue: Bedeutung von „meiner nicht würdig“
  choice: Die offene Beziehungsaussage des Genitivs wird wörtlich und idiomatisch bewahrt.
  alternative: Deutende Erweiterungen wie „ist es nicht wert, zu mir zu gehören“ oder „ist für mich nicht geeignet“.
  rationale: Der Ausgangstext erklärt nicht näher, ob Würdigkeit hier Zugehörigkeit, Eignung oder Jüngerschaftsfähigkeit betont. Die deutsche Formulierung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. Das idiomatische „wer“ vermeidet eine schwerfällige substantivische Form; „meiner nicht würdig“ ist gehoben, aber im heutigen Bibeldeutsch gut verständlich und eng am griechischen Ausdruck.
