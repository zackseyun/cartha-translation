  variant: modern standard German
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: de
  text: 'Diese Zwölf sandte Jesus aus und wies sie mit den Worten an: „Schlagt keinen Weg zu den Nichtjuden ein[a] und betretet keine Stadt der Samariter[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Geht nicht auf einen Weg der Völker.“ Gemeint ist wahrscheinlich, dass sie nicht in Richtung nichtjüdischer Gebiete ziehen sollen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „keine samaritanische Stadt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: diese Zwölf
  rationale: Die substantivierte Zahl bezeichnet genau die zuvor genannte Gruppe. „Jünger“ wird nicht ergänzt, da das Wort hier nicht ausdrücklich steht.
- source_word: ἀπέστειλεν
  choice: sandte … aus
  rationale: „Aussenden“ gibt sowohl das Schicken als auch den Auftragssinn des Verbs in natürlichem Deutsch wieder.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: wies sie mit den Worten an
  rationale: Die Formulierung bewahrt die verbindliche Weisung und führt die direkte Rede idiomatisch ein, ohne das griechische Partizipialgefüge schwerfällig nachzubilden.
- source_word: Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε
  choice: Schlagt keinen Weg zu den Nichtjuden ein
  rationale: Die Wendung erhält das Wegmotiv von ὁδός und gibt zugleich die zielgerichtete Bewegung von εἰς wieder. „Nichtjuden“ bezeichnet im Kontext verständlich die Menschen aus den Völkern außerhalb Israels.
- source_word: εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε
  choice: betretet keine Stadt der Samariter
  rationale: Die Übersetzung wahrt die konkrete Anweisung, keine von Samaritern bewohnte Stadt zu betreten. „Stadt“ ist die übliche, größenmäßig nicht zwingend festgelegte Wiedergabe von πόλις.
theological_decisions:
- issue: Reichweite und zeitliche Geltung des Verbots hinsichtlich Nichtjuden und Samaritern
  choice: Die Aussage wird als konkrete Weisung bei dieser Aussendung wiedergegeben, ohne einen zeitlich unbegrenzten Ausschluss auszudrücken.
  alternative: Eine verschärfte Formulierung, die als grundsätzliches oder dauerhaftes Verbot verstanden werden könnte.
  rationale: Der Vers selbst enthält eine nachdrückliche Missionsanweisung an die Zwölf, bestimmt aber an dieser Stelle nicht ausdrücklich ihre Geltung über diese Aussendung hinaus. Diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und verbindlich; „einen Weg einschlagen“ erhält das griechische Wegbild in einer geläufigen deutschen Wendung.
