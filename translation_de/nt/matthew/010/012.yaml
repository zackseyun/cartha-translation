  text: εἰσερχόμενοι δὲ εἰς τὴν οἰκίαν ἀσπάσασθε αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: de
  text: Wenn ihr aber ein Haus betretet, grüßt es.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „grüßt den Haushalt“. Das griechische Pronomen bezieht sich auf das „Haus“; wahrscheinlich sind damit die Menschen gemeint, die dort leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: wenn ihr … kommt
  rationale: Das präsentische Partizip im Nominativ Plural ist adverbial auf den Imperativ bezogen. Ein temporaler Nebensatz gibt diese Beziehung in natürlichem Deutsch wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ ist ein schwaches Bindewort. „Aber“ markiert hier den Fortgang der Anweisung, ohne einen starken Gegensatz auszudrücken.
- source_word: οἰκίαν
  choice: das Haus
  rationale: οἰκία kann das Gebäude oder metonymisch den Haushalt bezeichnen. Wegen des ausdrücklichen Hineinkommens bleibt im Haupttext die konkrete Bedeutung „Haus“ erhalten.
- source_word: ἀσπάσασθε
  choice: grüßt
  rationale: Der Aorist Imperativ Medium, zweite Person Plural, erteilt eine direkte Anweisung. „Grüßt“ ist die klare und idiomatische moderne Entsprechung.
- source_word: αὐτήν
  choice: es
  rationale: Das feminine Singularpronomen bezieht sich grammatisch auf οἰκίαν. Im Deutschen verlangt das sächliche „Haus“ entsprechend „es“; die wahrscheinlich metonymische Bezugnahme auf die Bewohner wird in der Fußnote erläutert.
theological_decisions:
- issue: Metonymische Anrede des Hauses oder ausdrücklicher Bezug auf seine Bewohner
  choice: Im Haupttext bleibt die Formulierung „grüßt es“ erhalten.
  alternative: „grüßt den Haushalt“ oder „grüßt seine Bewohner“
  rationale: Der griechische Text verwendet ein Singularpronomen, das auf οἰκίαν zurückverweist. Die ungewöhnliche metonymische Ausdrucksweise wird bewahrt, während die wahrscheinliche soziale Referenz in einer Fußnote erklärt wird.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Anweisungsstil. Die ungewöhnliche Personifizierung beziehungsweise Metonymie des Hauses wird nicht stillschweigend geglättet.
