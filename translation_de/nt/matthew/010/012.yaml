  naturalness: „Wenn ihr aber ein Haus betretet“ ist modernes, idiomatisches Standarddeutsch. Die bewusst ungewohnte Formulierung „grüßt es“ bleibt als quellentreue Metonymie bestehen und wird angemessen erläutert.
  terminology: „Haus“ entspricht οἰκία im Haupttext. „Haushalt“ ist als lexikalische Alternative in der Fußnote geeignet. Die Fußnote sollte nicht behaupten, das griechische Wort laute wörtlich „es“, da αὐτήν im Griechischen feminin ist; entscheidend ist sein Bezug auf „Haus“.
