    rationale: Das griechische αὐτήν ist feminin und bezieht sich auf οἰκία; das deutsche Neutrum „es“ folgt dagegen dem deutschen Wort „Haus“. Eine Bezugserklärung ist genauer als eine behauptete wörtliche Gleichheit.
