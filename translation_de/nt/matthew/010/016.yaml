  terminology: „Klug“ gibt φρόνιμοι angemessen als praktische Einsicht wieder, ohne die negativere Nuance von „listig“. „Die Schlangen“ und „die Tauben“ geben die bestimmten Vergleichsbilder natürlich wieder. „Unschuldig“ wahrt den ethischen Sinn von ἀκέραιοι, ohne eine weitergehende dogmatische Deutung einzutragen.
