  source_fidelity: 'Eine sichere Korrektur ist nötig: ἐν μέσῳ λύκων ist eine Ortsangabe und wird im Deutschen hier idiomatisch mit Dativ wiedergegeben („mitten unter Wölfen“). „Arglos“ kann im heutigen Deutsch vor allem „leichtgläubig“ oder „nichts ahnend“ bedeuten und trifft ἀκέραιοι weniger genau als „unschuldig“; der griechische Ausdruck bezeichnet hier Unversehrtheit bzw. schuldlose Lauterkeit.'
