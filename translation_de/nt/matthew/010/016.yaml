  - severity: medium
    issue: „arglos“ für ἀκέραιοι
    rationale: „Arglos“ wird im modernen Deutsch häufig als unvorsichtig, ahnungslos oder naiv verstanden. ἀκέραιοι meint dagegen schuldlos, rein bzw. ohne Falschheit. „Unschuldig“ erhält den Kontrast zu „klug“ ohne diese unbeabsichtigte Verschiebung.
