  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: de
  text: Seht, ich sende euch wie Schafe mitten unter Wölfen. Seid deshalb klug wie die Schlangen und unschuldig wie die Tauben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Die aufmerksamkeitslenkende Partikel wird als würdige, zugleich gut verständliche Aufforderung wiedergegeben.
- source_word: ἀποστέλλω
  choice: sende
  rationale: Das einfache deutsche Verb bildet den Sendungsauftrag unmittelbar ab, ohne zusätzliche Amtsvorstellungen einzutragen.
- source_word: ἐν μέσῳ
  choice: mitten unter
  rationale: Diese idiomatische Formulierung bewahrt das Bild, dass die Schafe von Wölfen umgeben und ihnen ausgesetzt sind.
- source_word: φρόνιμοι
  choice: klug
  rationale: Das Wort bezeichnet besonnene, praktisch einsichtige Klugheit; „klug“ ist natürlich und vermeidet die mögliche negative Färbung von „listig“.
- source_word: οἱ ὄφεις
  choice: die Schlangen
  rationale: Der bestimmte Artikel und das Vergleichsbild werden direkt gewahrt.
- source_word: ἀκέραιοι
  choice: arglos
  rationale: Im Kontext bezeichnet das Wort unverfälschte, nicht schädigende Lauterkeit. „Arglos“ erhält den Kontrast zur Klugheit, ohne bloße Naivität ausdrücklich zu behaupten.
- source_word: αἱ περιστεραί
  choice: die Tauben
  rationale: Der bestimmte Artikel und das traditionelle, unmittelbar verständliche Vergleichsbild werden beibehalten.
theological_decisions:
- issue: Verhältnis von Klugheit und Lauterkeit in der Sendung
  choice: Beide Aufforderungen werden gleichrangig und ohne erklärenden Zusatz wiedergegeben.
  alternative: Die Klugheit als Vorsicht und die Arglosigkeit als moralische Reinheit deutend ausformulieren.
  rationale: Der griechische Text hält beide Eigenschaften in pointierter Spannung zusammen; eine nähere Harmonisierung würde die Auslegung vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Bildsprache. „Seht“ wahrt den auffordernden Charakter von Ἰδού; „arglos“ ist idiomatisch und bildet den Gegenpol zu „klug“, ohne konfessionelle Deutung einzutragen.
