review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur, die Haushaltsmetaphorik und die Steigerung πόσῳ μᾶλλον sachgerecht wieder. „Jünger“, „Lehrer“, „Sklave“, „Herr“, „Hausherr“ und „Beelzebul“ sind quellentreue Entscheidungen. Die aoristische Bezeichnungshandlung ἐπεκάλεσαν wird mit „genannt haben“ im deutschen Konditionalsatz angemessen wiedergegeben.
  naturalness: Die zweite Hälfte des ersten Satzes ist im Entwurf durch die stark belastete Ellipse „und für den Sklaven, wie sein Herr“ unnötig holprig. Eine geringfügige Umstellung stellt den gemeinsamen Infinitiv klarer her und bewahrt zugleich die knappe Parallelität des Griechischen.
  terminology: 'Die zentrale Terminologie ist stimmig: „Sklave“ wahrt die soziale Asymmetrie von δοῦλος gegenüber κύριος; „Herr“ passt hier als Hausherr eines Sklaven und legt keinen ausdrücklichen Hoheitstitel fest. „Hausherr“ gibt οἰκοδεσπότης idiomatisch wieder. Die Fußnote zu „Beelzebub“ dokumentiert angemessen die traditionelle Namensform. Im englischen Audittext steht der Fußnotenanker offenbar versehentlich bei „teacher“ statt bei „Beelzebul“; der deutsche Entwurf setzt ihn hingegen richtig.'
  issues:
