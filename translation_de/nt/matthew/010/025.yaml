id: MAT.10.25
reference: Matthew 10:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the servant like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: de
  text: Für den Jünger genügt es, wie sein Lehrer und der Sklave wie sein Herr zu werden. Wenn sie den Hausherrn Beelzebul[a] genannt haben, wie viel mehr seine Hausgenossen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beelzebub“, eine geläufige traditionelle Namensform.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: ist es genug
  rationale: Gibt die prädikative Aussage der Genügsamkeit direkt wieder und klingt in der Verbindung „Für den Jünger ist es genug“ würdig und verständlich.
- source_word: μαθητῇ
  choice: Jünger
  rationale: Bewahrt im Evangelienkontext die persönliche Bindung und das Lernen in der Nachfolge besser als das schulischere „Schüler“.
- source_word: ἵνα γένηται
  choice: wie … zu werden
  rationale: Der deutsche Infinitiv gibt die vom Jünger beziehungsweise Sklaven erreichte Entsprechung natürlich wieder, ohne dem Ausdruck eine zusätzliche modale Bedeutung aufzuzwingen.
- source_word: διδάσκαλος
  choice: Lehrer
  rationale: Ist im Gegensatz zu „Jünger“ die klare heutige Entsprechung und unterscheidet den Begriff von κύριος.
- source_word: δοῦλος
  choice: Sklave
  rationale: Der ausdrückliche Gegensatz zu κύριος bezeichnet hier ein unfreies hierarchisches Verhältnis; „Diener“ würde dieses Verhältnis abschwächen.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ bezeichnet im Haushaltsbild den Herrn eines Sklaven und bewahrt zugleich die im Deutschen mögliche weitergehende Resonanz, ohne sie ausdrücklich festzulegen.
- source_word: οἰκοδεσπότην
  choice: Hausherrn
  rationale: Bezeichnet knapp und idiomatisch denjenigen, der einem Haus beziehungsweise Haushalt vorsteht.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Folgt der Namensform des griechischen Ausgangstextes; die traditionsbekannte Form „Beelzebub“ wird in einer Fußnote genannt.
- source_word: ἐπεκάλεσαν
  choice: genannt haben
  rationale: Gibt hier das Bezeichnen mit einem Namen treffend wieder; das Perfekt ist im deutschen Konditionalsatz natürlich.
- source_word: πόσῳ μᾶλλον
  choice: wie viel mehr dann
  rationale: Bewahrt den Schluss vom Größeren auf das Kleinere und macht die elliptische Folgerung im Deutschen flüssig.
- source_word: οἰκιακοὺς
  choice: die, die zu seinem Haushalt gehören
  rationale: Erfasst die Angehörigen des Haushalts umfassend und beschränkt den Ausdruck nicht auf Diener oder Sklaven.
theological_decisions:
- issue: Wiedergabe von κύριος im Haushaltsvergleich
  choice: Herr
  alternative: Gebieter
  rationale: Der unmittelbare Gegensatz zu δοῦλος verlangt die soziale Bedeutung „Herr“. Das geläufige deutsche Wort bewahrt zugleich eine mögliche theologische Resonanz, ohne die Stelle ausdrücklich zu einem Hoheitstitel zu machen.
- issue: Wiedergabe von δοῦλος
  choice: Sklave
  alternative: Diener
  rationale: Die Statusasymmetrie im Vergleich ist wesentlich. „Sklave“ gibt die Unfreiheit deutlicher wieder, während „Diener“ im heutigen Deutsch meist ein freiwilliges Dienstverhältnis nahelegt.
- issue: Bezeichnung Beelzebul
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Die Hauptzeile folgt Βεελζεβούλ im SBLGNT. Die verbreitete traditionelle Namensform wird als Alternative dokumentiert, ohne sie in den Ausgangstext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität von Jünger/Lehrer und Sklave/Herr bleibt sichtbar; die Ellipse im zweiten Satzteil wird weitgehend bewahrt. Der Fußnotenmarker steht unmittelbar bei dem Namen, auf den sich die Anmerkung bezieht.
