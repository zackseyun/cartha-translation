    issue: Unklare Ellipse im ersten Satz
    rationale: „… und für den Sklaven, wie sein Herr“ lässt den zu ergänzenden Infinitiv im Deutschen weniger eindeutig und weniger flüssig erkennen als nötig. Die Umstellung zu „… wie sein Lehrer und der Sklave wie sein Herr zu werden“ lässt „zu werden“ beide Vergleichsglieder regieren.
  revised_text: Für den Jünger genügt es, wie sein Lehrer und der Sklave wie sein Herr zu werden. Wenn sie den Hausherrn Beelzebul[a] genannt haben, wie viel mehr seine Hausgenossen!
