revisions:
- from: Für den Jünger ist es genug, wie sein Lehrer zu werden, und für den Sklaven, wie sein Herr. Wenn sie den Hausherrn Beelzebul[a] genannt haben, wie viel mehr dann die, die zu seinem Haushalt gehören!
  to: Für den Jünger genügt es, wie sein Lehrer und der Sklave wie sein Herr zu werden. Wenn sie den Hausherrn Beelzebul[a] genannt haben, wie viel mehr seine Hausgenossen!
  rationale: Die Revision betrifft ausschließlich die deutsche Satzfügung im ersten Satz. Sie erhält ἀρκετόν, die mit ἵνα γένηται ausgedrückte Angleichung sowie die parallelen Relationen μαθητής/διδάσκαλος und δοῦλος/κύριος, klingt aber im modernen Standarddeutsch klarer. „Hausgenossen“ gibt οἰκιακοί als Angehörige des Haushalts knapp wieder, ohne den Begriff auf Sklaven zu verengen.
  reviewer_model: gpt-5.6-terra
