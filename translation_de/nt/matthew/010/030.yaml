id: MAT.10.30
reference: Matthew 10:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: de
  text: Aber sogar die Haare auf eurem Kopf sind alle gezählt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind alle abgezählt worden“. Die griechische Perfekt-Passivform kann eine abgeschlossene Handlung mit fortbestehendem Ergebnis hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: eure(m)
  rationale: Der Genitiv der zweiten Person Plural wird im Deutschen idiomatisch als Possessivartikel wiedergegeben; wegen der Konstruktion mit „auf“ erscheint er in „auf eurem Kopf“.
- source_word: δὲ
  choice: Aber
  rationale: Kennzeichnet im Zusammenhang eine leichte Gegenüberstellung beziehungsweise eine weiterführende Wendung und entspricht hier natürlich dem deutschen „Aber“.
- source_word: καὶ
  choice: sogar
  rationale: 'Hat hier hervorhebende Bedeutung: Selbst etwas so Einzelnes und scheinbar Geringfügiges wie die Haare ist vollständig erfasst.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: die Haare auf eurem Kopf
  rationale: Gibt die genitivische Verbindung in natürlichem modernem Deutsch wieder, ohne das konkrete Bild zu verändern.
- source_word: πᾶσαι
  choice: alle
  rationale: Bewahrt die nachdrückliche Aussage vollständiger Erfassung.
- source_word: ἠριθμημέναι εἰσίν
  choice: sind gezählt
  rationale: Die periphrastische Perfekt-Passivform beschreibt einen aufgrund vollendeten Zählens bestehenden Zustand; „sind gezählt“ ist knapp, idiomatisch und stativ.
theological_decisions:
- issue: Umfang der durch die Aussage angedeuteten göttlichen Kenntnis und Fürsorge
  choice: Das konkrete Bild umfassender Kenntnis wird ohne dogmatische Erweiterung wiedergegeben.
  alternative: Eine erklärende Wiedergabe wie „Gott kennt und behütet sogar jedes Haar auf eurem Kopf“.
  rationale: Der griechische Text sagt ausdrücklich, dass alle Haare gezählt sind. Die Folgerung über Gottes Kenntnis, Fürsorge oder Vorsehung soll sich aus dem Kontext ergeben und nicht in die Übersetzung eingefügt werden.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Haare auf eurem Kopf“ ist natürlicher als das formal nähere „Haare eures Kopfes“. Der Plural „eurem“ bewahrt die Anrede mehrerer Personen.
