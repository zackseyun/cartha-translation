id: MAT.10.41
reference: Matthew 10:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: de
  text: Wer einen Propheten im Namen eines Propheten[a] aufnimmt, wird den Lohn eines Propheten empfangen; und wer einen Gerechten im Namen eines Gerechten[b] aufnimmt, wird den Lohn eines Gerechten empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil er ein Prophet ist“ oder „als einen Propheten“. Wörtlich: „im Namen eines Propheten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil er ein Gerechter ist“ oder „als einen Gerechten“. Wörtlich: „im Namen eines Gerechten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: wer … aufnimmt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden, der so handelt. Die deutsche Relativkonstruktion mit „wer“ ist natürlich und bewahrt den allgemeinen Charakter; „aufnehmen“ gibt hier gastfreundliches Annehmen beziehungsweise Willkommenheißen passend wieder.
- source_word: προφήτην
  choice: einen Propheten
  rationale: Direktes Akkusativobjekt; „Prophet“ ist die sachlich und traditionssprachlich angemessene Entsprechung.
- source_word: εἰς ὄνομα προφήτου
  choice: im Namen eines Propheten
  rationale: Die formnahe Wiedergabe erhält die wiederholte griechische Wendung und ihre inhaltliche Spannung. Im Kontext kann sie bedeuten, jemanden aufgrund seiner Identität als Prophet oder in seiner Eigenschaft als Prophet aufzunehmen; diese Deutungsmöglichkeiten werden in der Fußnote genannt.
- source_word: μισθὸν προφήτου
  choice: den Lohn eines Propheten
  rationale: 'Die Genitivverbindung bleibt bewusst offen: Gemeint sein kann der Lohn, den ein Prophet empfängt, oder ein einem Propheten entsprechender Lohn. „Lohn“ ist im Zusammenhang von göttlicher Vergeltung natürlicher und präziser als „Belohnung“.'
- source_word: λήμψεται
  choice: wird … empfangen
  rationale: Das Futur wird als einfache Zukunft wiedergegeben. „Empfangen“ wahrt den würdigen Registerton und entspricht dem semantischen Zusammenhang mit göttlichem Lohn.
- source_word: δίκαιον
  choice: einen Gerechten
  rationale: Das substantivierte maskuline Adjektiv wird im Deutschen idiomatisch und formnah als „einen Gerechten“ wiedergegeben. Es bezeichnet hier einen als gerecht anerkannten Menschen, ohne die Aussage weiter zu spezifizieren.
- source_word: εἰς ὄνομα δικαίου
  choice: im Namen eines Gerechten
  rationale: Die parallele Formulierung der ersten Satzhälfte wird bewahrt. Die möglichen Sinnnuancen „weil er ein Gerechter ist“ und „als einen Gerechten“ stehen in der Fußnote.
- source_word: μισθὸν δικαίου
  choice: den Lohn eines Gerechten
  rationale: Die parallele Genitivkonstruktion bleibt erhalten und wird nicht darauf festgelegt, ob es um den einem Gerechten gewährten oder einen seiner Stellung entsprechenden Lohn geht.
theological_decisions:
- issue: Bedeutung von εἰς ὄνομα mit Genitiv
  choice: Die wörtlichkeitsnahe Wendung „im Namen eines …“ steht im Haupttext; die kontextuellen Deutungen werden in Fußnoten erläutert.
  alternative: „weil er ein Prophet/Gerechter ist“ oder „als einen Propheten/Gerechten“
  rationale: Die Wendung bezeichnet wahrscheinlich die Aufnahme aufgrund der anerkannten Identität oder Stellung des Betreffenden. Eine rein dynamische Übersetzung wäre leichter verständlich, würde aber die auffällige Wiederholung und mögliche Anklänge der Formel „im Namen“ einebnen.
- issue: Bezug des Genitivs in μισθὸν προφήτου / μισθὸν δικαίου
  choice: „den Lohn eines Propheten/Gerechten“
  alternative: „denselben Lohn wie ein Prophet/Gerechter“ oder „den für einen Propheten/Gerechten bestimmten Lohn“
  rationale: Der griechische Genitiv legt die genaue Beziehung nicht ausdrücklich fest. Die deutsche Genitivkonstruktion bewahrt diese echte Mehrdeutigkeit, statt eine bestimmte Lehraussage über Art oder Verteilung des Lohnes festzuschreiben.
- issue: Maskuline Form von δίκαιον / δικαίου
  choice: „einen Gerechten / eines Gerechten“
  alternative: „einen gerechten Menschen / eines gerechten Menschen“
  rationale: Die substantivierte maskuline Singularform lässt sich im Deutschen natürlich als „ein Gerechter“ wiedergeben. Diese Form bleibt quellennah, ohne ausdrücklich zu behaupten, dass die allgemeine Aussage ausschließlich Männer betrifft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzstruktur des Griechischen bleibt erhalten. „Aufnehmen“, „empfangen“ und „Lohn“ sind allgemein verständlich, zugleich aber dem biblischen Aussagezusammenhang angemessen. Beide Fußnotenmarker stehen unmittelbar nach der jeweils erklärten Wendung.
