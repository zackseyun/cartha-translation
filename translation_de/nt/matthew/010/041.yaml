  source_fidelity: Der Text gibt die beiden vollständig parallelen griechischen Satzglieder zuverlässig wieder. „Wer … aufnimmt“ bildet das substantivierte Partizip angemessen ab; Futur, Objekte und die wiederholten Genitivverbindungen μισθὸν προφήτου / μισθὸν δικαίου sind erhalten. Die formnahe, im Deutschen ohne Erläuterung potenziell mehrdeutige Wendung „im Namen eines …“ wird durch die Fußnoten sachgerecht erklärt, ohne die im Griechischen bewusst wiederholte Formel im Haupttext aufzulösen.
  naturalness: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Wer“, „aufnimmt“ und „wird … empfangen“ bewahrt die rhetorische Symmetrie, ohne unnatürlich zu wirken. „Einen Gerechten“ ist als substantiviertes Adjektiv idiomatisch und verständlich.
  terminology: „Prophet“, „Gerechter“, „Lohn“, „aufnehmen“ und „empfangen“ sind terminologisch passend und registergerecht. Die Genitivformulierungen „Lohn eines Propheten/Gerechten“ vermeiden eine nicht vom griechischen Wortlaut erzwungene Festlegung über die genaue Art des Lohnes. Die Fußnotenmarker sind korrekt unmittelbar an den jeweils erläuterten Formeln verankert.
