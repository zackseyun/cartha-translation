base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: de
  text: Beschafft euch weder Gold noch Silber noch Kupfer[b] in eure Gürtel[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Geld, das im Gürtel oder in einem am Gürtel getragenen Geldbeutel aufbewahrt wurde.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Bronze“ statt „Kupfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Beschafft euch nicht
  rationale: κτάομαι bezeichnet gewöhnlich das Erwerben oder Beschaffen. Die reflexive Formulierung gibt den medialen Sinn wieder und vermeidet die kontextuell weniger genaue Wiedergabe „Nehmt ... nicht mit“.
- source_word: χρυσὸν
  choice: Gold
  rationale: Direkte Bezeichnung des Materials, das hier im Zusammenhang mit Geld steht.
- source_word: ἄργυρον
  choice: Silber
  rationale: Direkte Bezeichnung des Materials, hier im Zusammenhang mit Silbergeld.
- source_word: χαλκὸν
  choice: Kupfer
  rationale: χαλκός kann Kupfer oder Bronze bezeichnen. In der Reihe mit Gold und Silber ist „Kupfer“ als Bezeichnung geringwertiger Münzen im modernen Deutsch naheliegend; „Bronze“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: für eure Gürtel
  rationale: ζώνη bezeichnet Gürtel oder Leibgurt. εἰς drückt hier aus, dass das Geld für die Aufbewahrung im Gürtel bestimmt wäre. Die knappe Formulierung wahrt das antike Bild; eine kulturelle Fußnote erläutert dessen Funktion.
theological_decisions:
- issue: Reichweite des Verbots
  choice: „Beschafft euch“ als Verbot des Erwerbens oder Besorgens für die Aussendung
  alternative: „Nehmt ... nicht mit“ als bloßes Mitführverbot
  rationale: Der Wortlaut von κτάομαι legt Erwerben oder Beschaffen näher als bloßes Tragen. Dadurch wird das Verbot nicht stillschweigend auf vorhandenen Besitz oder dessen Mitnahme festgelegt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. „Beschafft euch“ bewahrt die Bedeutung des griechischen Verbs genauer als „Nehmt nicht mit“. Die Materialbegriffe bleiben im Haupttext stehen, während die Geldbedeutung kulturell erläutert wird.
