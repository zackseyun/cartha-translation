id: MAT.10.15
reference: Matthew 10:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: de
  text: 'Amen, ich sage euch: Dem Land von Sodom und Gomorra wird es am Tag des Gerichts erträglicher ergehen als jener Stadt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Die Beibehaltung des semitischen Bestätigungswortes wahrt die feierliche Bekräftigungsformel Jesu. Im Deutschen ist „Amen, ich sage euch“ als verständliche biblische Wendung etabliert.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte und im Deutschen natürliche Formulierung entspricht der griechischen Redewendung eng.
- source_word: ἀνεκτότερον ἔσται
  choice: wird es … erträglicher ergehen
  rationale: Die idiomatische deutsche Konstruktion gibt den Komparativ „erträglicher“ wieder und ergänzt mit „ergehen“ nur, was für einen natürlichen vollständigen Satz erforderlich ist.
- source_word: γῇ
  choice: dem Land
  rationale: γῆ bezeichnet hier das mit Sodom und Gomorra verbundene Land beziehungsweise Gebiet. Die konkrete geografische Ausdrucksweise des Griechischen bleibt erhalten.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: von Sodom und Gomorra
  rationale: Die geläufigen deutschen Namensformen werden verwendet; beide Genitive sind von γῇ abhängig.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: am Tag des Gerichts
  rationale: Die Formulierung bewahrt den bestimmten zukünftigen Gerichtstag, ohne ein weitergehendes theologisches System in den Text einzutragen.
- source_word: πόλει ἐκείνῃ
  choice: jener Stadt
  rationale: πόλις kann „Stadt“ oder „Ort“ bezeichnen. „Jene Stadt“ ist präzise, knapp und erhält den rückverweisenden Demonstrativcharakter von ἐκείνῃ.
theological_decisions:
- issue: Bedeutung des „Tages des Gerichts“
  choice: Als zukünftiger Tag des Gerichts wiedergegeben, ohne weitere dogmatische Einzelheiten festzulegen.
  alternative: Als allgemeine Zeit beziehungsweise Erfahrung des Gerichts verstehen.
  rationale: Die bestimmte Formulierung bezeichnet am natürlichsten einen eschatologischen Gerichtstag; die Übersetzung lässt dessen genauere Ausgestaltung offen.
- issue: Vergleich zwischen Sodom und Gomorra und der ablehnenden Stadt
  choice: Der abgestufte Vergleich des Ergehens im Gericht bleibt ausdrücklich erhalten.
  alternative: Den Satz allgemein als stärkere Verurteilung der Stadt paraphrasieren.
  rationale: Der griechische Text spricht konkret davon, dass es dem Land von Sodom und Gomorra erträglicher ergehen wird. Eine Paraphrase würde die bildhafte und theologisch spannungsvolle Aussage abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bibelsprachlicher, aber weithin verständlicher Einleitungsformel. Die Satzstellung ist natürlich; der konkrete Ausdruck „Land von Sodom und Gomorra“ und der Gerichtvergleich bleiben eng am griechischen Text.
