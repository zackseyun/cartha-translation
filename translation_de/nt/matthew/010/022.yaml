review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die futurische Passivumschreibung καὶ ἔσεσθε μισούμενοι treffend als „ihr werdet … gehasst werden“ wieder. „von allen“ wahrt die umfassende personale Aussage von ὑπὸ πάντων, und „wegen meines Namens“ bildet διὰ τὸ ὄνομά μου angemessen als Grundangabe ab. „Wer aber bis zum Ende standhält“ gibt ὁ δὲ ὑπομείνας εἰς τέλος idiomatisch und inhaltlich genau wieder. Das nicht eigens übersetzte, resumptive οὗτος ist in der deutschen Wer-Konstruktion ohne bedeutsamen Verlust natürlich aufgefangen. „wird gerettet werden“ erhält die semantische und theologische Weite von σωθήσεται.
  naturalness: Der Text ist klares modernes Standarddeutsch mit angemessen würdigem Register. Die Wortstellung und die Wer-Konstruktion sind flüssig; eine hölzerne Nachbildung des griechischen Demonstrativpronomens ist zu Recht vermieden.
  terminology: „Name“, „standhält“ und „gerettet werden“ sind etablierte, verständliche und kontextangemessene Formulierungen. Die Fußnote hält mögliche kontextuelle Nuancen von σῴζω offen, ohne eine dogmatische oder rein körperliche Deutung festzulegen.
