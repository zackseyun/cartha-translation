id: MAT.10.22
reference: Matthew 10:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: de
  text: Und ihr werdet von allen gehasst werden wegen meines Namens. Wer aber bis zum Ende standhält, wird gerettet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gerettet werden“ kann je nach Verständnis des Zusammenhangs auch „befreit werden“ oder „bewahrt werden“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: von allen gehasst werden
  rationale: Die futurische Umschreibung bezeichnet den künftigen Zustand des Gehasstwerdens; ὑπό mit dem Genitiv nennt die handelnden Personen. „Von allen“ bewahrt die umfassende Formulierung knapp und würdevoll.
- source_word: διὰ τὸ ὄνομά μου
  choice: wegen meines Namens
  rationale: διά mit Akkusativ gibt hier den Grund an. „Mein Name“ bleibt als biblische Ausdrucksweise erhalten und verweist auf Jesu Person und die Zugehörigkeit zu ihm, ohne dies erklärend in den Haupttext einzutragen.
- source_word: ὁ δὲ ὑπομείνας
  choice: Wer aber … standhält
  rationale: Das substantivierte Aoristpartizip bezeichnet die Person, die unter Bedrängnis ausharrt. „Standhält“ ist natürliches modernes Deutsch und wahrt den Gedanken beharrlichen Ausharrens.
- source_word: εἰς τέλος
  choice: bis zum Ende
  rationale: Die Wendung bezeichnet das Durchhalten bis zum Endpunkt; „bis zum Ende“ ist im Deutschen idiomatisch und lässt offen, welcher Endpunkt im Kontext genau gemeint ist.
- source_word: οὗτος
  choice: durch die deutsche Wer-Konstruktion wiederaufgenommen
  rationale: Das griechische Demonstrativpronomen nimmt den vorangestellten Partizipialsatz nachdrücklich wieder auf. Eine ausdrückliche Wiedergabe als „der wird“ wäre möglich, doch die Wer-Konstruktion gibt den Zusammenhang im Deutschen flüssig wieder.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Das Passiv von σῴζω kann Rettung, Befreiung oder Heil bezeichnen. „Gerettet werden“ erhält diese Breite und legt weder ausschließlich körperliche Bewahrung noch eine bestimmte dogmatische Deutung fest.
theological_decisions:
- issue: Bedeutung der Rettung im Verhältnis zum Ausharren
  choice: Die umfassende Aussage „wird gerettet werden“ bleibt ohne nähere dogmatische Festlegung stehen.
  alternative: „wird befreit werden“, „wird körperlich gerettet werden“ oder eine ausdrückliche Festlegung auf endgültiges eschatologisches Heil
  rationale: Der Vers verbindet das Standhalten in Verfolgung mit Rettung, bestimmt hier aber nicht abschließend deren genaue Dimension. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur ist natürlich deutsch; die griechische Wiederaufnahme durch οὗτος wird nicht hölzern nachgebildet. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Aussage.
