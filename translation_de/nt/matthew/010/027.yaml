base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: de
  text: Was ich euch im Dunkeln sage, das sagt im Licht; und was ihr ins Ohr gesagt bekommt,[a] das verkündet auf den Dächern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Was ihr im persönlichen, vertraulichen Rahmen hört. Wörtlich steht im Griechischen das anschauliche Bild „ins Ohr hört“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die flachen Dächer damaliger Häuser, die als erhöhte und weithin sichtbare Orte für öffentliche Bekanntmachungen dienen konnten.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Was ich euch … sage
  rationale: Die substantivisch gebrauchte Relativkonstruktion wird im Deutschen natürlich mit „was“ wiedergegeben; „euch sage“ entspricht der direkten Unterweisung.
- source_word: ἐν τῇ σκοτίᾳ … ἐν τῷ φωτί
  choice: im Dunkeln … im Licht
  rationale: Bewahrt den bildhaften Gegensatz des Griechischen und klingt zugleich natürlich im modernen Deutschen.
- source_word: εἴπατε
  choice: sagt
  rationale: Der Imperativ wird knapp und unmittelbar wiedergegeben; das wiederaufgenommene „das“ verdeutlicht im Deutschen den Bezug.
- source_word: εἰς τὸ οὖς ἀκούετε
  choice: ins Ohr hört
  rationale: Die ungewöhnliche, anschauliche Wendung des Griechischen bleibt erhalten, statt sie bereits im Haupttext als „heimlich“ oder „zugeflüstert“ auszulegen.
- source_word: κηρύξατε
  choice: verkündet
  rationale: Gibt den öffentlichen Ausruf eines Herolds wieder, ohne ihn auf eine förmliche Predigt einzuengen.
- source_word: ἐπὶ τῶν δωμάτων
  choice: von den Dächern
  rationale: Im Deutschen bezeichnet „von den Dächern verkünden“ natürlich den Ausgangspunkt der öffentlichen Bekanntmachung und bewahrt das antike Bild der flachen Hausdächer.
theological_decisions:
- issue: Bildsprache von Dunkel/Licht und Ohr/Dächern gegenüber einer erklärenden Wiedergabe von privater und öffentlicher Mitteilung
  choice: Die Bildsprache bleibt im Haupttext erhalten.
  alternative: „Was ich euch im Verborgenen sage, das sagt öffentlich; und was euch zugeflüstert wird, das macht überall bekannt.“
  rationale: Die konkrete Gegenüberstellung trägt Jesu rhetorische Aussage und lässt die Spannung zwischen zunächst verborgener Unterweisung und öffentlicher Verkündigung stehen, ohne sie durch eine Paraphrase zu verflachen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die Kontraste der Vorlage bleiben erhalten. „Im Dunkeln“ ist idiomatischer als „in der Dunkelheit“, während „von den Dächern“ im Deutschen natürlicher klingt als das formal engere „auf den Dächern“.
