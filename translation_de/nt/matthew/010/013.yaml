source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: de
  text: Und wenn das Haus es wert ist[a], soll euer Friede über dieses Haus kommen; wenn es aber nicht wert ist[b], soll euer Friede zu euch zurückkehren.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Hausgemeinschaft« beziehungsweise »das Zuhause«; das griechische Wort für »Haus« kann auch die darin lebenden Menschen einschließen.'
    reason: lexical_alternative
  - marker: b
    text: '»Es wert« bedeutet hier: geeignet, die Boten und ihren Friedensgruß aufzunehmen; damit ist nicht moralische Sündlosigkeit gemeint.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »soll sich euer Friede euch wieder zuwenden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: Haus
  rationale: Die direkte Entsprechung bewahrt das Bild des Hauses; im Zusammenhang können auch die darin lebenden Menschen mitgemeint sein.
- source_word: ἀξία
  choice: würdig
  rationale: Bewahrt den wertenden Sinn des griechischen Ausdrucks, ohne ihn verengend als bloße Aufnahmebereitschaft wiederzugeben.
- source_word: ἐλθάτω
  choice: soll ... kommen
  rationale: Gibt den Imperativ in natürlichem, würdevollem Deutsch wieder.
- source_word: εἰρήνη
  choice: Friede
  rationale: Ist die übliche Entsprechung und lässt den weiteren Sinn eines Segens des Wohlergehens im Kontext mitschwingen.
- source_word: ἐπ’ αὐτήν
  choice: auf es
  rationale: Bewahrt die gerichtete Bildsprache, dass der Friede auf das Haus kommt; das Pronomen bezieht sich im Deutschen auf das sächliche »Haus«.
- source_word: πρὸς ὑμᾶς ... ἐπιστραφήτω
  choice: soll ... zu euch zurückkehren
  rationale: Gibt die Richtungsangabe und die Rückkehrbewegung idiomatisch und präzise wieder.
- source_word: μὲν ... δὲ
  choice: wenn ...; wenn aber ...
  rationale: Bildet die kontrastierende Bedingungsstruktur in natürlichem Deutsch ab.
theological_decisions:
- issue: Wesen von »euer Friede«
  choice: Die konkrete Bildsprache vom Frieden der Jünger, der auf ein Haus kommt oder zu ihnen zurückkehrt, bleibt erhalten.
  alternative: »euer Friedensgruß« oder »der von euch zugesprochene Friede«
  rationale: Der Text verbindet den Frieden mit der Sendung der Jünger, erklärt aber nicht näher, ob er als Gruß, Segenszuspruch oder darüber hinaus zu verstehen ist. Diese Spannung wird nicht aufgelöst.
- issue: Bedeutung von »würdig«
  choice: »würdig« bleibt im Haupttext stehen und wird in einer Fußnote kontextuell erläutert.
  alternative: »geeignet«, »aufnahmebereit« oder »es wert«
  rationale: Das griechische Wort ist wertend, bezeichnet hier aber nicht ausdrücklich moralische Sündlosigkeit. Die Übersetzung vermeidet sowohl eine Verengung auf Aufnahmebereitschaft als auch eine dogmatische Überhöhung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Kontrast, ohne unnötig altertümlich zu klingen. »Auf es« ist bewusst formal und bildnah; die Fußnoten erläutern die wichtigsten lexikalischen und kulturellen Nuancen.
