  source_fidelity: Der Entwurf gibt die bedingte Gegenüberstellung, den Imperativcharakter und die Bildsprache von εἰρήνη, die auf das Haus kommt bzw. zu den Jüngern zurückkehrt, grundsätzlich zutreffend wieder. »Haus« bewahrt οἰκία angemessen; die mögliche Einbeziehung der Hausgemeinschaft ist korrekt in der Anmerkung vermerkt.
  naturalness: »Wenn das Haus würdig ist« ist im modernen Standarddeutsch nicht idiomatisch, da »würdig« gewöhnlich eine Ergänzung verlangt oder stark moralisch bzw. feierlich wirkt. Auch »auf es kommen« klingt hier unnatürlich. »Wenn das Haus es wert ist« und »über dieses Haus kommen« sind idiomatisch, bewahren aber die wertende und gerichtete Bildsprache. Die alternative Formulierung in Anmerkung c benötigt eine natürlichere Wortstellung.
  terminology: »Friede« ist als traditionsbewusste und zugleich verständliche Wiedergabe von εἰρήνη passend. »Es wert« ist hier die angemessenere deutsche Entsprechung für ἀξία als das isolierte »würdig«, ohne die Bedeutung auf bloße Aufnahmebereitschaft zu reduzieren. Die Erläuterung der nicht gemeinten moralischen Sündlosigkeit bleibt hilfreich.
