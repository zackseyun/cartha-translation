  source_fidelity: Die Übersetzung gibt die indefinite allgemeine Bedingung (ὅστις δ’ ἄν), den Kontrast durch „aber“, das öffentliche „vor den Menschen“ sowie die zweimalige, bewusst parallele Verwendung von ἀρνέομαι treffend wieder. „Den werde auch ich“ bildet κἀγὼ αὐτόν mit angemessener Betonung und individueller Rückverweisung ab. Die Bezeichnung „meinem Vater, der im Himmel ist“ entspricht dem griechischen Bezug; der idiomatische Singular „im Himmel“ ist sachgerecht.
  naturalness: Der Satz ist modernes, würdevolles und gut verständliches Standarddeutsch. Die vorangestellte Korrelatkonstruktion „Wer …, den werde auch ich …“ ist idiomatisch und bewahrt den feierlich-rechtlichen Nachdruck des Verses.
  terminology: „Verleugnen“ ist für beide Vorkommen von ἀρνέομαι präzise und erhält die rhetorische Gegenseitigkeit. „Menschen“ gibt ἀνθρώπων natürlich in seiner generischen Bedeutung wieder. „Vater“ und „Himmel“ sind etablierte, source-nahe biblische Terminologie, ohne unnötige Auslegung.
