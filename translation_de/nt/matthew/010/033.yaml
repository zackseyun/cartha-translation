id: MAT.10.33
reference: Matthew 10:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: de
  text: Wer mich aber vor den Menschen verleugnet, den werde auch ich vor meinem Vater verleugnen, der im Himmel[a] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in den Himmeln«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Wer ... aber
  rationale: Die indefinite Relativkonstruktion mit ἄν bezeichnet allgemein jeden, auf den die Aussage zutrifft; „aber“ gibt den Kontrast zum vorherigen Vers wieder.
- source_word: ἀρνήσηταί ... ἀρνήσομαι
  choice: verleugnet ... werde ... verleugnen
  rationale: „Verleugnen“ trifft hier das öffentliche Abstreiten beziehungsweise Lossagen und bewahrt durch die Wiederholung desselben Verbs die pointierte Gegenseitigkeit des griechischen Satzes.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: vor den Menschen
  rationale: Die Wendung bedeutet „vor den Menschen“, also in ihrer Gegenwart beziehungsweise öffentlich. „Menschen“ gibt den generischen Sinn des griechischen Plurals natürlich und genau wieder.
- source_word: κἀγὼ αὐτὸν
  choice: den werde auch ich
  rationale: „Auch ich“ bewahrt die betonte Entsprechung von κἀγώ; das vorangestellte „den“ nimmt im Deutschen idiomatisch und deutlich auf „wer“ Bezug.
- source_word: τοῦ πατρός μου
  choice: meinem Vater
  rationale: Die schlichte personale Gottesbezeichnung Jesu wird ohne erklärende Erweiterung wiedergegeben.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: der im Himmel ist
  rationale: Der Singular „im Himmel“ ist die übliche deutsche Wiedergabe des griechischen idiomatischen Plurals; die formnähere Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Wechselseitigkeit des Verleugnens
  choice: verleugnet ... werde auch ich ... verleugnen
  alternative: sich von mir lossagt ... werde auch ich mich von ihm lossagen
  rationale: Dasselbe deutsche Verb an beiden Stellen erhält die feierliche und theologisch gewichtige Entsprechung, ohne die Aussage durch zusätzliche Deutung zu verschärfen oder abzuschwächen.
- issue: Generischer Bezug von ὅστις und αὐτόν
  choice: Wer ... den
  alternative: Jeder Mensch, der ... diesen Menschen
  rationale: Die deutsche Konstruktion „Wer ... den“ umfasst allgemein jede entsprechende Person und folgt zugleich der grammatischen Gestalt und dem individuellen Bezug des griechischen Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die symmetrische Satzstruktur und die Wiederholung von „verleugnen“ bewahren die rhetorische Schärfe des Ausgangstextes; „vor den Menschen“ ist allgemein verständlich und schließt Menschen beiderlei Geschlechts ein.
