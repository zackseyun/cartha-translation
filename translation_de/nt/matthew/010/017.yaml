id: MAT.10.17
reference: Matthew 10:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: de
  text: Hütet euch aber vor den Menschen[a]; denn sie werden euch an Gerichte ausliefern und euch in ihren Synagogen auspeitschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort steht im maskulinen Plural, bezeichnet hier jedoch allgemein Menschen.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: Hütet euch
  rationale: Der Imperativ warnt eindringlich vor einer Gefahr. „Hütet euch“ ist im Deutschen natürlich, würdig und bewahrt die Aufforderung zur Wachsamkeit.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier eine leichte Gegenüberstellung beziehungsweise eine warnende Weiterführung des vorausgehenden Gedankens.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: vor den Menschen
  rationale: Nach προσέχω bezeichnet ἀπό die Quelle der Gefahr. „Menschen“ gibt den hier allgemein gebrauchten Plural ἀνθρώπων wieder, ohne ihn unnötig auf männliche Personen zu beschränken.
- source_word: παραδώσουσιν
  choice: werden ... ausliefern
  rationale: παραδίδωμι bezeichnet hier die Übergabe an rechtsprechende Instanzen. „Ausliefern“ erhält den rechtlichen und feindseligen Sinn, ohne ausdrücklich einen Verrat zu behaupten.
- source_word: συνέδρια
  choice: Gerichte
  rationale: Der Plural bezeichnet örtliche Rats- oder Gerichtsorgane und nicht notwendig den Jerusalemer Hohen Rat. „Gerichte“ macht ihre rechtsprechende Funktion im modernen Deutsch verständlich.
- source_word: συναγωγαῖς
  choice: Synagogen
  rationale: Das Wort bezeichnet konkret jüdische Synagogen als Orte gemeinschaftlicher Versammlung und Disziplin.
- source_word: αὐτῶν
  choice: ihren
  rationale: Das Genitivpronomen bezieht sich natürlich auf die Synagogen und bezeichnet deren Zugehörigkeit zu den genannten Verfolgern beziehungsweise ihrem Umfeld.
- source_word: μαστιγώσουσιν
  choice: werden ... auspeitschen
  rationale: μαστιγόω bezeichnet körperliche Bestrafung durch Schläge mit einer Peitsche. „Auspeitschen“ ist deutlich, ernst und im heutigen Deutsch verständlich.
theological_decisions:
- issue: Geschlechtsgenaue Wiedergabe von ἀνθρώπων
  choice: Menschen
  alternative: Männer
  rationale: Obwohl die griechische Form grammatisch maskulin ist, bezeichnet sie hier Menschen allgemein als mögliche Verfolger und nicht ausdrücklich nur männliche Personen.
- issue: Institutionelle Bedeutung von συνέδρια
  choice: Gerichte
  alternative: Räte / Synhedrien
  rationale: Der Plural lässt örtliche jüdische Rats- und Gerichtsinstanzen erkennen. „Gerichte“ vermittelt ihre Funktion, ohne sämtliche Instanzen mit dem Jerusalemer Hohen Rat gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Warnungs- und Begründungszusammenhang; „Gerichte“ dient als verständliche funktionale Wiedergabe örtlicher Ratsinstanzen.
