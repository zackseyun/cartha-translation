    issue: „weil ihr zu mir gehört“ für ἕνεκεν ἐμοῦ
    rationale: Die Formulierung interpretiert den Grund als ausdrückliche Zugehörigkeit zu Jesus. Das Griechische sagt knapper „um meinetwillen/wegen mir“ und sollte nicht weiter spezifiziert werden.
  - severity: low
    issue: „damit ihr ... Zeugnis gebt“ für εἰς μαρτύριον
    rationale: Die Finalumschreibung ist semantisch vertretbar, verändert aber die nominale und bewusst knappe Formulierung. „Zum Zeugnis“ ist näher am Ausgangstext und erhält dessen Offenheit.
