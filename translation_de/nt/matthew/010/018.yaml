- from: Auch vor Statthalter und Könige wird man euch führen, weil ihr zu mir gehört, damit ihr ihnen und den Völkern[a] Zeugnis gebt.[b]
  to: Auch vor Statthalter und Könige wird man euch um meinetwillen führen, ihnen und den Völkern[a] zum Zeugnis.[b]
  rationale: Die Revision ersetzt die interpretierendere Begründung „weil ihr zu mir gehört“ durch das quellennähere „um meinetwillen“ und stellt εἰς μαρτύριον als „zum Zeugnis“ wieder her. Dadurch bleiben sowohl die syntaktische Knappheit als auch die offene Wirkung des Zeugnisses gegenüber den Behörden und den Völkern gewahrt.
