  source_fidelity: Die Grundstruktur und die politischen Autoritäten sind zutreffend wiedergegeben. „Weil ihr zu mir gehört“ legt ἕνεκεν ἐμοῦ jedoch stärker als Zugehörigkeitsverhältnis aus; „um meinetwillen“ gibt den kausalen Bezug unmittelbarer wieder. Die Umformung von εἰς μαρτύριον zu „damit ihr ... Zeugnis gebt“ ist möglich, aber „zum Zeugnis“ wahrt die Nominalform und die knappe, offene Satzfügung des Griechischen besser.
  naturalness: Die Fassung ist grundsätzlich verständlich und modern. „Auch vor Statthalter und Könige wird man euch führen“ ist möglich, doch die revidierte Wortstellung mit „euch wird man ... führen“ wirkt flüssiger. „Ihnen und den Völkern zum Zeugnis“ ist im würdigen biblischen Register idiomatisch.
  terminology: „Statthalter“, „Könige“, „Zeugnis“ und „Völker“ sind angemessen. Die Fußnote zu „Nichtjuden“ bildet die im Kontext naheliegende, aber nicht zwingende Bedeutung von τοῖς ἔθνεσιν ab. Die neutrale Wiedergabe von αὐτοῖς bleibt erhalten.
  issues:
