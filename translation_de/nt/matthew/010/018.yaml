  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: de
  text: Auch vor Statthalter und Könige wird man euch um meinetwillen führen, ihnen und den Völkern[a] zum Zeugnis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Nichtjuden“.'
    reason: lexical_alternative
  - marker: b
    text: „Ihnen zum Zeugnis“ kann im Zusammenhang auch ein Zeugnis gegen sie einschließen; der griechische Dativ legt das nicht ausdrücklich fest.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: vor Statthalter und Könige
  rationale: ἐπί mit Akkusativ nach einem Verb des Führens bezeichnet hier das Erscheinen vor politischen Autoritäten. „Statthalter“ ist im matthäischen und römischen Kontext eine natürliche Wiedergabe von ἡγεμόνες.
- source_word: ἀχθήσεσθε
  choice: wird man euch führen
  rationale: Das Passiv von ἄγω wird im Deutschen idiomatisch mit dem unpersönlichen „man“ wiedergegeben. „Führen“ wahrt die Bedeutung, ohne eine im Verb nicht ausdrücklich enthaltene Gewaltsamkeit einzutragen.
- source_word: ἕνεκεν ἐμοῦ
  choice: weil ihr zu mir gehört
  rationale: Die Wendung bezeichnet den Grund ihres Vorgeführtwerdens. Die natürliche deutsche Formulierung macht deutlich, dass ihre Verbindung mit Jesus der Anlass ist; das knappere „meinetwegen“ wäre ebenfalls möglich.
- source_word: εἰς μαρτύριον
  choice: damit ihr ... Zeugnis gebt
  rationale: εἰς kann hier Ziel beziehungsweise Ergebnis ausdrücken. Die verbale deutsche Wendung ist verständlicher als „zu einem Zeugnis“, bewahrt aber den Aussagekern von μαρτύριον.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezieht sich am naheliegendsten auf Statthalter und Könige und wird neutral wiedergegeben. Ob das Zeugnis für oder gegen sie wirkt, bleibt offen.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: ἔθνη kann „Völker“ oder im jüdischen Sprachgebrauch „Nichtjuden“ bedeuten. „Völker“ bewahrt die lexikalische Breite; die kontextuell wahrscheinliche Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Bedeutung von μαρτύριον αὐτοῖς
  choice: „ihnen Zeugnis gebt“
  alternative: „zum Zeugnis gegen sie“
  rationale: Der griechische Dativ αὐτοῖς kennzeichnet nicht ausdrücklich ein belastendes Zeugnis. Die neutrale Form lässt offen, ob das Zeugnis zur Einladung, zur Anklage oder zu beidem wird.
- issue: Referenz von τοῖς ἔθνεσιν
  choice: „den Völkern“
  alternative: „den Nichtjuden“
  rationale: Im Matthäusevangelium bezeichnet ἔθνη häufig die nichtjüdischen Völker. Die allgemeinere Wiedergabe wahrt jedoch die im griechischen Ausdruck vorhandene Breite und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die politischen Autoritäten im Vordergrund. „Weil ihr zu mir gehört“ ist kommunikativ klar; die Zeugnisformulierung bleibt theologisch bewusst neutral.
