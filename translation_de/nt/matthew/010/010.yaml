  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: de
  text: Nehmt für unterwegs weder eine Reisetasche noch zwei Untergewänder, Sandalen oder einen Wanderstab[a] mit; denn der Arbeiter ist seiner Nahrung wert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche verstehen das Verbot eines Wanderstabs als Verbot eines zusätzlichen Stabs, besonders im Blick auf Markus 6,8, wo ein Stab erlaubt wird.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: Reisetasche
  rationale: Das Wort bezeichnet eine auf Reisen mitgeführte Tasche, besonders für Vorräte. „Reisetasche“ macht den Zusammenhang knapp und natürlich deutlich.
- source_word: εἰς ὁδὸν
  choice: für unterwegs
  rationale: Die Wendung bezeichnet idiomatisch, was auf eine Reise mitgenommen wird. „Für unterwegs“ ist im modernen Deutschen natürlich und bewahrt den Reisesinn.
- source_word: δύο χιτῶνας
  choice: zwei Untergewänder
  rationale: χιτών bezeichnet das unmittelbar am Körper getragene Grundgewand. „Untergewänder“ ist historisch verständlich und genauer als das moderne „Hemden“.
- source_word: ὑποδήματα
  choice: Sandalen
  rationale: Das Wort bezeichnet an den Füßen befestigtes Schuhwerk; im historischen Umfeld sind „Sandalen“ die treffende und geläufige Wiedergabe.
- source_word: ῥάβδον
  choice: Wanderstab
  rationale: Hier ist ein auf Reisen verwendeter Stab gemeint. „Wanderstab“ ist im Deutschen eindeutiger als „Stab“ und lässt Matthäus’ ausdrückliches Verbot unverändert stehen.
- source_word: ἄξιος
  choice: ist … wert
  rationale: Die traditionelle, noch verständliche Wendung bewahrt den wertenden Sinn von ἄξιος und bleibt näher am griechischen Ausdruck als eine rein anspruchsbezogene Paraphrase.
- source_word: ὁ ἐργάτης
  choice: der Arbeiter
  rationale: ἐργάτης bezeichnet allgemein jemanden, der arbeitet. „Arbeiter“ ist klar und führt keinen kirchlichen Fachbegriff ein.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: seiner Nahrung
  rationale: τροφή bedeutet konkret Nahrung oder Essen. „Seiner Nahrung“ erhält diesen konkreten Sinn und gibt den griechischen Genitiv in natürlichem Deutsch wieder.
theological_decisions:
- issue: Möglicher Ausgleich mit der Parallelüberlieferung zur erlaubten Reiseausrüstung
  choice: Matthäus’ Verbot „keinen Wanderstab“ bleibt im Haupttext stehen.
  alternative: Das Verbot auf einen zusätzlichen Wanderstab beziehen oder die Formulierung im Blick auf Markus 6,8 angleichen.
  rationale: Der griechische Text führt ῥάβδον ausdrücklich unter den nicht mitzunehmenden Dingen auf. Die Spannung zu Markus 6,8 wird deshalb nicht stillschweigend harmonisiert, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paarweise Aufzählung des Griechischen wird flüssig wiedergegeben; konkrete Begriffe für Reiseausrüstung und Nahrung bleiben erhalten. Die Fußnotenmarke steht nach dem vollständigen Satz, da sie die Auslegung von „Wanderstab“ betrifft.
