id: MAT.10.39
reference: Matthew 10:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: de
  text: Wer sein Leben findet, wird es verlieren[a]; und wer sein Leben um meinetwillen verliert, wird es finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder in beiden Satzhälften: „Seele“. Das griechische Wort ψυχή kann „Leben“ oder „Seele“ bedeuten; hier passt „Leben“ am besten zum Zusammenhang des Verlierens und Findens des eigenen Lebens in der Nachfolge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Wer ... findet
  rationale: Der substantivierte Aoristpartizip bezeichnet allgemein eine repräsentative Person. „Wer ...“ gibt diese generische Aussage im modernen Deutschen natürlich wieder.
- source_word: ψυχὴν
  choice: Leben
  rationale: ψυχή bezeichnet hier im Zusammenhang von Nachfolge, Bewahrung und Preisgabe das eigene Leben; „Leben“ wahrt zugleich das Paradox von Finden und Verlieren.
- source_word: ἀπολέσει
  choice: wird ... verlieren
  rationale: ἀπόλλυμι bezeichnet hier Verlust, nicht ausdrücklich Vernichtung. „Verlieren“ erhält den gezielten Gegensatz zu „finden“.
- source_word: ὁ ἀπολέσας
  choice: wer ... verliert
  rationale: 'Trotz des Aoristpartizips verlangt die allgemeingültige Spruchform im Deutschen eine präsentische Wiedergabe im Nebensatz: „wer ... verliert“.'
- source_word: ἕνεκεν ἐμοῦ
  choice: um meinetwillen
  rationale: Die Wendung bezeichnet Grund beziehungsweise Beweggrund und bringt die persönliche Bindung an Jesus knapp und würdig zum Ausdruck.
- source_word: εὑρήσει
  choice: wird ... finden
  rationale: „Finden“ bewahrt die bewusste Wiederholung desselben Verbstamms und damit die rhetorische Symmetrie des Satzes.
- source_word: αὐτοῦ / αὐτήν
  choice: sein / es
  rationale: Das Deutsche kann mit „wer ... sein Leben ... es“ die generische Einzelperson natürlich ausdrücken und den singularischen Aufbau des Griechischen bewahren.
theological_decisions:
- issue: Wiedergabe von ψυχή im Paradox der Nachfolge
  choice: Leben
  alternative: Seele
  rationale: Im Kontext geht es um das Festhalten am beziehungsweise die Preisgabe des eigenen Lebens aus Treue zu Jesus, nicht vorrangig um eine Gegenüberstellung von Körper und immaterieller Seele. Da ψυχή jedoch auch „Seele“ bedeuten kann, bleibt diese echte lexikalische Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, prägnantem Spruchcharakter. „Um meinetwillen“ ist leicht gehoben, aber weiterhin geläufig und bildet die persönliche Ausrichtung auf Jesus präzise ab.
