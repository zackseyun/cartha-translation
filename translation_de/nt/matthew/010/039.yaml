review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung bildet die antithetische Struktur des griechischen Spruchs zuverlässig ab. „Wer ... findet/verliert, wird ... verlieren/finden“ gibt die substantivierten Partizipien idiomatisch generisch wieder und bewahrt die gezielte Wiederaufnahme von εὑρίσκω sowie den Gegensatz zu ἀπόλλυμι. „Um meinetwillen“ trifft ἕνεκεν ἐμοῦ präzise.
  naturalness: Das Deutsch ist modernes Standarddeutsch, prägnant und für einen Lehrspruch angemessen. Die leicht gehobene, aber geläufige Formulierung „um meinetwillen“ passt zum Register. Die Satzfügung mit Semikolon und „und“ ist klar und stilistisch unauffällig.
  terminology: „Leben“ ist für ψυχή in diesem Kontext die naheliegende Hauptwiedergabe. Die Fußnote bewahrt mit „Seele“ die relevante lexikalische Alternative, ohne den Vers auf eine spezifische dogmatische Deutung festzulegen. Die Pronomenführung „sein Leben ... es“ erhält den generischen Singular des Griechischen natürlich.
