source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: de
  text: Dann begann er, den Städten, in denen die meisten seiner Machttaten[a] geschehen waren, Vorwürfe zu machen, weil sie nicht umkehrten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wunder“ oder „Krafttaten“ (griechisch: dynameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Natürlicher temporaler Erzählanschluss, der den Übergang zum nächsten Geschehen kennzeichnet.
- source_word: ἤρξατο ὀνειδίζειν
  choice: begann er … Vorwürfe zu machen
  rationale: Bewahrt den ingressiven Sinn von ἤρξατο und gibt ὀνειδίζειν idiomatisch als vorwurfsvolles Tadeln wieder, ohne es zu einer förmlichen Verurteilung zu verschärfen.
- source_word: τὰς πόλεις ἐν αἷς
  choice: den Städten, in denen
  rationale: Gibt Substantiv und Relativkonstruktion eng am Griechischen und zugleich in natürlichem Deutsch wieder.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: die meisten seiner Machttaten geschehen waren
  rationale: Das Plusquamperfekt markiert die vorausliegenden Taten. „Machttaten“ erhält den Bezug von δυνάμεις auf wirksame Kraft und bezeichnet hier Jesu außergewöhnliche Taten.
- source_word: ὅτι
  choice: weil
  rationale: Leitet eindeutig den Grund für die Vorwürfe ein.
- source_word: οὐ μετενόησαν
  choice: sie nicht umgekehrt waren
  rationale: „Umkehren“ gibt im biblisch-theologischen Kontext die von μετανοέω bezeichnete grundlegende Neuausrichtung wieder; das Plusquamperfekt entspricht der Vorzeitigkeit gegenüber dem einsetzenden Tadel.
theological_decisions:
- issue: Wiedergabe von δυνάμεις im Kontext außergewöhnlicher Taten Jesu
  choice: Machttaten
  alternative: Wunder; Krafttaten
  rationale: „Machttaten“ bewahrt die im griechischen Wort liegende Betonung der Kraft, ohne den Ausdruck auf die Kategorie „Wunder“ zu verengen.
- issue: Wiedergabe von μετενόησαν
  choice: nicht umgekehrt waren
  alternative: nicht Buße getan hatten; nicht bereut hatten
  rationale: „Umkehren“ drückt die geforderte moralisch-geistliche Neuausrichtung in verständlichem, würdigem Deutsch aus. Es vermeidet zugleich die mögliche Verengung von „bereuen“ auf ein bloßes Bedauern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt quellennah, wird aber durch die idiomatische Wendung „Vorwürfe machen“ natürlich gestaltet.
