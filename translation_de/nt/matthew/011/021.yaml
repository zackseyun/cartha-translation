  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: de
  text: Wehe dir, Chorazin! Wehe dir, Betsaida! Denn wenn die machtvollen Taten, die bei euch geschehen sind, in Tyrus und Sidon geschehen wären, hätten sie längst in Sack und Asche bereut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Wehe dir
  rationale: Die geläufige prophetische Weheruf-Formel bewahrt sowohl den Klang der Klage als auch die Ankündigung des Gerichts.
- source_word: Χοραζίν
  choice: Chorazin
  rationale: Der Ortsname wird nach etablierter deutscher biblischer Schreibweise wiedergegeben.
- source_word: Βηθσαϊδά
  choice: Betsaida
  rationale: Der Ortsname folgt der im Deutschen etablierten Schreibweise.
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι leitet hier die Begründung für den vorangehenden Weheruf ein.
- source_word: εἰ ... ἐγένοντο ... ἂν ... μετενόησαν
  choice: wenn ... geschehen wären, hätten sie ... bereut
  rationale: Der irreale Bedingungssatz der Vergangenheit wird im Deutschen natürlich mit Konjunktiv II wiedergegeben.
- source_word: αἱ δυνάμεις
  choice: die Machttaten
  rationale: „Machttaten“ hält den Bezug zu δύναμις („Kraft/Macht“) fest und bezeichnet im Evangelienkontext machtvolle, wunderhafte Taten, ohne den Ausdruck vorschnell auf eine moderne Kategorie zu verengen.
- source_word: ἐν ὑμῖν
  choice: bei euch
  rationale: Bei der Anrede ganzer Ortschaften bezeichnet der Ausdruck das Geschehen in ihrer Mitte; „bei euch“ ist dafür natürliches modernes Deutsch.
- source_word: πάλαι
  choice: längst
  rationale: „Längst“ gibt knapp und idiomatisch wieder, dass die Reaktion schon lange zuvor erfolgt wäre.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: in Sack und Asche
  rationale: Die etablierte deutsche Wendung bewahrt das kulturelle Bild öffentlicher Trauer und Umkehr.
- source_word: μετενόησαν
  choice: bereut
  rationale: „Bereut“ bezeichnet hier die von Sack und Asche sichtbare innere Umkehr; es ist im Satz natürlich, ohne den Vorgang auf bloßes Umdenken zu reduzieren.
theological_decisions:
- issue: Jesu Vergleich mit Tyrus und Sidon
  choice: Der irreale Vergleich wird als wirkliche Aussage über die ausgebliebene Umkehr und die größere Verantwortlichkeit Chorazins und BetsaidAs bewahrt.
  alternative: Den Vergleich als bloße rhetorische Übertreibung auszuweisen.
  rationale: Der griechische Text formuliert eine kontrafaktische Aussage, erläutert sie aber nicht weiter. Die Übersetzung erhält ihre Spannung und fügt keine dogmatische Erklärung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und weiterhin verständliche Weheruf-Formel sowie das Bild »in Sack und Asche« bleiben erhalten. Die Satzstellung vermeidet eine mögliche Fehlzuordnung von »bei euch geschehen« zu Tyrus und Sidon.
