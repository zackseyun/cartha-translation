revisions:
- from: Wehe dir, Chorazin! Wehe dir, Betsaida! Denn wenn in Tyrus und Sidon die Machttaten[a] geschehen wären, die bei euch geschehen sind, hätten sie längst in Sack und Asche bereut.
  to: Wehe dir, Chorazin! Wehe dir, Betsaida! Denn wenn die machtvollen Taten, die bei euch geschehen sind, in Tyrus und Sidon geschehen wären, hätten sie längst in Sack und Asche bereut.
  rationale: Die Revision ersetzt allein das im modernen Deutsch unübliche »Machttaten« durch »machtvolle Taten« und passt die daran gebundene Fußnote sprachlich und sachlich an. Der kontrafaktische Vergleich, die Wiederholung von »geschehen«, die Bedeutung von Umkehr/Reue und die Bildsprache bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:42:59Z'
review_pass:
  verdict: revise
  source_fidelity: Der irreale Bedingungssatz der Vergangenheit, die direkte Anrede, die Ortsnamen, der zeitliche Akzent von πάλαι sowie das Bild von Sack und Asche sind zutreffend wiedergegeben. »bei euch« gibt ἐν ὑμῖν angemessen als Geschehen inmitten der angesprochenen Orte wieder.
  naturalness: Die Satzführung ist insgesamt klar und würdig. »Machttaten« ist im heutigen Standarddeutsch jedoch ungebräuchlich und wirkt als Kompositum künstlich. »Machtvolle Taten« ist verständlicher und bewahrt den Bezug von δυνάμεις zu Macht/Kraft.
  terminology: »Wehe dir«, »Tyrus und Sidon«, »Sack und Asche« und »bereut« sind im Kontext angemessen. Die Fußnote sollte die lexikalische Alternative präzise benennen, ohne »Krafttaten« als gleichrangig wörtliche Wiedergabe auszugeben.
  issues:
  - severity: low
    issue: Ungebräuchliche Wiedergabe von αἱ δυνάμεις
    rationale: »Machttaten« ist zwar semantisch nachvollziehbar, aber im modernen Standarddeutsch wenig idiomatisch. »Machtvolle Taten« ist eine natürliche, quellennähere Formulierung und lässt die Alternative »Wundertaten« offen.
  - severity: low
    issue: Unpräzise Formulierung der Fußnote
    rationale: Die Formulierung »wörtlich auch« vermischt eine lexikalische Alternative mit einer näheren Bedeutungsumschreibung. Eine knappe Kennzeichnung von »Wundertaten« als Alternative und »Taten der Macht« als wörtlicher Annäherung ist klarer.
  revised_text: Wehe dir, Chorazin! Wehe dir, Betsaida! Denn wenn die machtvollen Taten, die bei euch geschehen sind, in Tyrus und Sidon geschehen wären, hätten sie längst in Sack und Asche bereut.
  revised_footnotes:
  - marker: a
    text: 'Oder: »Wundertaten«; wörtlich: »Taten der Macht«.'
    reason: lexical_alternative
