base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: de
  text: Wer Ohren hat, der höre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
