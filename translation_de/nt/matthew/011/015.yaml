lexical_decisions:
- source_word: ὁ ἔχων
  choice: Wer … hat
  rationale: Der substantivierte Artikel mit Partizip bezeichnet allgemein jeden Menschen, auf den die Aussage zutrifft. Die deutsche Wer-Konstruktion gibt diesen generischen Sinn natürlich und zugleich im Singular wieder.
- source_word: ὦτα
  choice: Ohren
  rationale: Der griechische Akkusativ steht im Plural. „Ohren“ bewahrt sowohl die Form als auch das Bild für aufmerksames Wahrnehmen.
- source_word: ἀκουέτω
  choice: der höre
  rationale: Der Imperativ der dritten Person wird mit dem deutschen Konjunktiv I in einer auffordernden Wendung prägnant wiedergegeben. „Hören“ lässt wie das Griechische sowohl das akustische Wahrnehmen als auch das aufmerksame Beachten anklingen.
theological_decisions:
- issue: Generische singularische Formulierung
  choice: Wer Ohren hat, der höre.
  alternative: Wer Ohren hat, soll hören.
  rationale: Die Wer-der-Konstruktion wahrt den generischen Bezug und die singularische Form des Griechischen, ohne die Aussage auf männliche Personen einzuschränken. Zugleich bleibt der feierliche Aufforderungscharakter erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit einer bewusst würdevollen, im Deutschen vertrauten Aufforderungsform. Die knappe Spruchgestalt des griechischen Satzes bleibt erhalten.
