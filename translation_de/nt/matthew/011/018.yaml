  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: de
  text: 'Denn Johannes kam und aß nicht und trank nicht, und sie sagen: »Er hat einen Dämon.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: kam
  rationale: Der Aorist von ἔρχομαι bezeichnet hier das Auftreten beziehungsweise Kommen des Johannes; »kam« gibt die übliche Verbbedeutung knapp und natürlich wieder.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage; »Denn« bewahrt diesen erklärenden Zusammenhang.
- source_word: Ἰωάννης
  choice: Johannes
  rationale: Dies ist die im Deutschen etablierte Namensform; gemeint ist aus dem Kontext Johannes der Täufer.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: und aß nicht und trank nicht
  rationale: Die gepaarten Partizipien beschreiben die asketische Lebensweise des Johannes. Die verbale Form klingt im modernen Deutschen natürlicher, ohne Brot oder Wein einzutragen, die der griechische Text hier nicht nennt.
- source_word: καὶ λέγουσιν
  choice: und sie sagen
  rationale: Das Präsens wirkt vergegenwärtigend und verallgemeinernd. Das unbestimmte »sie« bleibt erhalten, statt die Sprecher näher zu bestimmen.
- source_word: Δαιμόνιον ἔχει
  choice: Er hat einen Dämon
  rationale: Die Übersetzung folgt der wörtlichen und im Deutschen verständlichen Ausdrucksweise. Sie kennzeichnet eine berichtete Anschuldigung und fügt keine stärkere Deutung wie »besessen« hinzu.
theological_decisions:
- issue: Wiedergabe der Anschuldigung mit δαιμόνιον
  choice: Er hat einen Dämon
  alternative: Er ist von einem Dämon besessen
  rationale: Der Text berichtet die Anschuldigung gegen Johannes und bestätigt sie nicht als Erzähleraussage. Die nähere Wiedergabe bewahrt die Ausdrucksweise und lässt offen, wie genau die Ankläger den behaupteten dämonischen Einfluss verstanden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst knappe Wiederholung »aß nicht und trank nicht« bildet die zugespitzte griechische Aussage idiomatisch ab; das historische Präsens in »sie sagen« bleibt erhalten.
