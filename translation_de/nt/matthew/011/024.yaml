  source_fidelity: Die Wiedergabe von γῇ Σοδόμων, ἀνεκτότερον, ἐν ἡμέρᾳ κρίσεως und des singularischen σοί ist im Wesentlichen treffend. Der Plural in λέγω ὑμῖν darf jedoch nicht ohne Kennzeichnung in einen Singular umgeformt werden. Der im Griechischen vorhandene Numeruswechsel – Anrede an mehrere Personen, dann Vergleich mit der personifiziert angesprochenen Stadt – ist beizubehalten.
  naturalness: „Dem Land von Sodom wird es am Tag des Gerichts erträglicher ergehen als dir“ ist natürliches, würdiges modernes Standarddeutsch. Der Wechsel „euch … dir“ ist zwar markiert, entspricht aber der rhetorischen und grammatischen Gestaltung des Ausgangstextes und ist verständlich.
  terminology: „Tag des Gerichts“ und „erträglicher“ sind präzise und registergerecht. „Land von Sodom“ bewahrt das ausdrücklich genannte γῇ („Land/Gebiet“), ohne den Ausdruck unnötig zu interpretieren.
  issues:
