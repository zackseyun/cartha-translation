    issue: λέγω ὑμῖν wurde als „ich sage dir“ im Singular übersetzt.
    rationale: ὑμῖν ist im SBLGNT eindeutig Dativ Plural. Das nachfolgende σοί ist dagegen Singular. Die Vereinheitlichung zur Einzahl glättet einen im Ausgangstext bestehenden Numeruswechsel und verändert damit die unmittelbare Anrede.
