  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: de
  text: 'Doch ich sage euch: Dem Land von Sodom wird es am Tag des Gerichts erträglicher ergehen als dir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „leichter zu ertragen sein als für dich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Markiert hier einen nachdrücklichen Gegensatz beziehungsweise Übergang und klingt im modernen Deutschen natürlich und würdig.
- source_word: λέγω ὑμῖν
  choice: ich sage dir
  rationale: Der Kontext richtet die ursprünglich pluralische Formel an die personifizierte Stadt; das unmittelbar folgende σοί ist Singular. Die deutsche Einzahl hält die direkte Anrede im Vers einheitlich fest.
- source_word: γῇ Σοδόμων
  choice: dem Land von Sodom
  rationale: Gibt γῇ ausdrücklich als „Land“ wieder und bewahrt so den räumlichen Bezug statt nur den Stadtnamen zu setzen.
- source_word: ἀνεκτότερον
  choice: erträglicher
  rationale: Der Komparativ bedeutet „leichter zu ertragen“ beziehungsweise „erträglicher“; diese Formulierung ist im Gerichtskontext klar und idiomatisch.
- source_word: ἔσται
  choice: wird es … ergehen
  rationale: Die deutsche Konstruktion „jemandem wird es … ergehen“ gibt die prädikative Verbindung mit den Dativen natürlich wieder.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: am Tag des Gerichts
  rationale: Bewahrt die zeitliche und eschatologische Gerichtsformulierung präzise in geläufigem Deutsch.
- source_word: ἢ σοί
  choice: als dir
  rationale: Erhält den singularischen Dativ und die direkte, personifizierende Anrede an die Stadt.
theological_decisions:
- issue: Numerus der Anrede bei λέγω ὑμῖν und σοί
  choice: 'Die Aussage wird im Deutschen durchgehend in der Einzahl an die personifizierte Stadt gerichtet: „ich sage dir … als dir“.'
  alternative: „Ich sage euch … als dir“ oder eine ausdeutende Mehrzahl wie „als euch Menschen dort“.
  rationale: Im griechischen Text steht zwar λέγω ὑμῖν im Plural, doch σοί ist Singular und setzt die prophetische Anrede an die Stadt aus dem Kontext fort. Eine rein mechanische Wiedergabe des Numeruswechsels wäre im Deutschen auffällig; die Einzahl bewahrt den erkennbaren Referenten und vermeidet eine ausdeutende Erweiterung auf die Einwohner.
- issue: Art des Vergleichs im Endgericht
  choice: 'Die komparative Aussage bleibt ohne Erklärung stehen: Für das Land von Sodom wird das Gericht „erträglicher“ sein.'
  alternative: Eine Paraphrase, die ausdrücklich unterschiedliche Strafgrade oder ein bestimmtes dogmatisches System formuliert.
  rationale: Der Text behauptet einen relativen Unterschied, erläutert jedoch dessen genaue Beschaffenheit nicht. Die Übersetzung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „wird es … ergehen“ ist natürlich und erhält die Dativstruktur des Vergleichs. Der Fußnotenmarker [a] steht unmittelbar nach dem Satz.
