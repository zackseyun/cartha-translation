  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: de
  text: 'Doch womit soll ich diese Generation vergleichen? Sie gleicht Kindern, die auf den Marktplätzen[a] sitzen und den anderen[b] zurufen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Marktplätzen“ oder „auf den öffentlichen Plätzen“. Das griechische Wort bezeichnet öffentliche Marktbereiche, auf denen Handel getrieben wurde und Menschen zusammenkamen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den anderen Kindern“. Im Griechischen steht nur „den anderen“; dass Kinder gemeint sind, ergibt sich aus dem Vergleich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι … ὁμοιώσω
  choice: womit soll ich … vergleichen
  rationale: Der Dativ des interrogativen τίς bezeichnet den Vergleichsmaßstab. „Womit … vergleichen“ ist im modernen Deutschen natürlich und bewahrt die rhetorisch-überlegende Kraft des Futurs.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier einen leichten Übergang beziehungsweise Kontrast. „Doch“ gibt diesen rhetorischen Anschluss würdig wieder, ohne ihn zu stark zu machen.
- source_word: τὴν γενεὰν ταύτην
  choice: diese Generation
  rationale: γενεά bezeichnet hier die zeitgenössische Generation beziehungsweise die als Gruppe betrachteten Menschen dieser Zeit. Die knappe Formulierung erhält die Weite des Ausdrucks.
- source_word: ὁμοία ἐστὶν
  choice: Sie gleicht
  rationale: Die prädikative Ähnlichkeitsaussage wird prägnant und idiomatisch wiedergegeben; das Pronomen nimmt das feminine deutsche Substantiv „Generation“ auf.
- source_word: παιδίοις
  choice: Kindern
  rationale: παιδίον bezeichnet hier allgemein Kinder; eine Verkleinerungsnuance wie „kleine Kinder“ ist im Kontext nicht zwingend.
- source_word: καθημένοις ἐν ταῖς ἀγοραῖς
  choice: die auf den Marktplätzen sitzen
  rationale: Das Partizip beschreibt Haltung und Schauplatz. ἀγορά meint öffentliche Markt- und Versammlungsplätze; „Marktplätze“ ist im Deutschen anschaulich und sachgerecht.
- source_word: ἃ προσφωνοῦντα
  choice: und … zurufen
  rationale: προσφωνέω bezeichnet ein hörbares Anreden oder Zurufen. Die koordinierte deutsche Konstruktion bildet die fortlaufende Szene natürlich ab.
- source_word: τοῖς ἑτέροις
  choice: den anderen
  rationale: Die substantivierte Form bezeichnet „die anderen“ beziehungsweise eine andere Gruppe. Die knappe Wiedergabe vermeidet, die im Griechischen nur kontextuell erschlossene Identität ausdrücklich festzulegen.
