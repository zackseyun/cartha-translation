translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ und „womit soll ich“ bewahren den rhetorischen Charakter; „Marktplätze“ bleibt verständlich, während die Fußnote den breiteren antiken Bedeutungsumfang erklärt. Der abschließende Doppelpunkt signalisiert, dass der Zuruf im folgenden Vers wiedergegeben wird.
