id: MAT.11.10
reference: Matthew 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: de
  text: 'Dieser ist es, von dem geschrieben steht: »Siehe, ich sende meinen Boten vor deinem Angesicht her[a]; er wird deinen Weg vor dir bereiten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor deinem Angesicht«. Idiomatischer: »vor dir« oder »dir voraus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Dieser ist es
  rationale: Die demonstrative Identifikation wird betont und zugleich in würdigem, verständlichem Deutsch wiedergegeben.
- source_word: περὶ οὗ
  choice: von dem
  rationale: Gibt περί mit Genitiv in der deutschen Formel „von dem geschrieben steht“ idiomatisch wieder.
- source_word: γέγραπται
  choice: geschrieben steht
  rationale: Entspricht der etablierten deutschen Schriftzitat-Formel und bewahrt den resultativen Sinn des griechischen Perfekts.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den feierlich-prophetischen Aufforderungscharakter des Zitats besser als das umgangssprachlichere „Schau“.
- source_word: ἀποστέλλω
  choice: ich sende
  rationale: Der Präsensausdruck des Schriftzitats bleibt knapp und unmittelbar; im Deutschen kann das Präsens auch bevorstehendes Handeln bezeichnen.
- source_word: ἄγγελόν
  choice: Boten
  rationale: ἄγγελος bezeichnet hier im Kontext Johannes als menschlichen Boten, nicht notwendig einen Engel.
- source_word: πρὸ προσώπου σου
  choice: vor deinem Angesicht her
  rationale: Bewahrt die konkrete Bildsprache der griechischen Wendung und klingt durch „her“ als Aussage über ein Vorausgehen verständlicher.
- source_word: κατασκευάσει
  choice: wird … bereiten
  rationale: Gibt das Futur und den Sinn des Vorbereitens prägnant wieder.
- source_word: τὴν ὁδόν σου
  choice: deinen Weg
  rationale: „Weg“ wahrt sowohl die konkrete als auch die übertragene Bedeutung von ὁδός.
- source_word: ἔμπροσθέν σου
  choice: vor dir
  rationale: Natürliche deutsche Entsprechung, die zugleich von „vor deinem Angesicht her“ unterscheidbar bleibt.
theological_decisions:
- issue: Die zwei ähnlichen Ortsangaben im Schriftzitat
  choice: Sowohl „vor deinem Angesicht her“ als auch „vor dir“ bleiben erhalten.
  alternative: Die Wendungen zu einem einzigen „vor dir“ oder „dir voraus“ glätten.
  rationale: Der griechische Text enthält πρὸ προσώπου σου und ἔμπροσθέν σου ausdrücklich. Ihre Beibehaltung bewahrt Struktur und Nachdruck des Zitats, ohne die Beziehung zwischen Bote und Angesprochenem näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht erhöhtem Schriftzitatregister. „Dieser ist es“ und „Siehe“ markieren die feierliche Identifikation und Zitatformel; die übrige Syntax bleibt für heutige Leser klar.
