  naturalness: '„Und wenn ihr bereit seid, es anzunehmen: Er ist Elia, der kommen soll“ ist modernes, verständliches Standarddeutsch. Der Doppelpunkt bildet die im Deutschen natürliche Überleitung zur Identifizierung ohne ein zusätzliches Folgewort.'
