  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: de
  text: 'Und wenn ihr bereit seid, es anzunehmen[a]: Er ist Elia, der kommen soll.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ihr bereit seid, dies anzunehmen“.'
    reason: lexical_alternative
  - marker: b
    text: Dies bezieht sich auf Johannes den Täufer; vergleiche Maleachi 3,23 und Matthäus 17,10–13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte Verknüpfung mit dem vorausgehenden Zusammenhang, ohne das Verhältnis stärker auszudeuten.
- source_word: εἰ θέλετε δέξασθαι
  choice: wenn ihr bereit seid, es anzunehmen
  rationale: θέλετε mit dem Infinitiv bezeichnet hier Bereitschaft; „anzunehmen“ gibt die aufgeschlossene Aufnahme der Aussage im heutigen Deutsch natürlich wieder. Das Pronomen „es“ ergänzt das im Griechischen unausgesprochene Objekt idiomatisch.
- source_word: αὐτός
  choice: er
  rationale: Das Pronomen verweist auf Johannes den Täufer. „Er“ ist im Deutschen natürlich; eine zusätzliche Betonung wie „er selbst“ ist möglich, aber nicht zwingend.
- source_word: ἐστιν Ἠλίας
  choice: ist er Elia
  rationale: Die direkte Identifizierung des griechischen Textes bleibt erhalten und wird weder zu bloßer Ähnlichkeit noch ausdrücklich zu einer Rollenbeschreibung abgeschwächt.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: der kommen soll
  rationale: Gibt die erwartete, prophetisch angekündigte Ankunft knapp und idiomatisch wieder. „Soll“ bezeichnet hier nicht eine moralische Verpflichtung, sondern die erwartete Bestimmung.
theological_decisions:
- issue: Identifizierung Johannes des Täufers mit Elia
  choice: „dann ist er Elia, der kommen soll“
  alternative: „dann erfüllt er die Rolle Elias“ / „dann ist er wie Elia“
  rationale: Der griechische Wortlaut formuliert die Identifizierung ausdrücklich, verbindet sie aber mit dem bedingten Aufruf zur Annahme. Die Übersetzung bewahrt diese Spannung, ohne sie durch eine Erklärung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und nah am griechischen Satzbau, vermeidet jedoch unnatürliche Wörtlichkeit. Die Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Aussage.
