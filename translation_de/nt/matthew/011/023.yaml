source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: de
  text: 'Und du, Kafarnaum: Wirst du etwa bis zum Himmel erhöht werden? Bis in den Hades[a] wirst du hinabsteigen! Denn wenn in Sodom die Machttaten geschehen wären, die in dir geschehen sind, würde sie bis heute bestehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Totenreich“. Griechisch Hades, nicht Gehenna.'
    reason: Lexikalische Alternative und Abgrenzung unterschiedlicher griechischer Gerichtstermini.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kafarnaum
  rationale: Der Ortsname folgt der etablierten deutschen Transliterationsform.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: Wirst du etwa bis zum Himmel erhöht werden?
  rationale: μή mit dem Futur wird als rhetorische Frage verstanden, die eine verneinende Antwort erwartet. „Etwa“ macht diese Erwartung im Deutschen kenntlich; Passiv und räumliches Bild bleiben erhalten.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Bis in den Hades wirst du hinabsteigen
  rationale: „Hinabsteigen“ gibt καταβαίνω direkt wieder. „Hades“ bewahrt den griechischen Begriff und vermeidet eine Gleichsetzung mit Gehenna oder eine vorschnelle dogmatische Festlegung.
- source_word: δυνάμεις
  choice: Machttaten
  rationale: „Machttaten“ bezeichnet konkrete machtvolle Taten und wahrt damit sowohl den Werk- als auch den Machtaspekt des griechischen Wortes.
- source_word: αἱ γενόμεναι ἐν σοί
  choice: die in dir geschehen sind
  rationale: Die Formulierung bewahrt das Geschehen und die direkte Anrede der als Person angesprochenen Stadt.
- source_word: ἐγενήθησαν
  choice: geschehen wären
  rationale: Der deutsche Konjunktiv II der Vergangenheit gibt die irreale Bedingung der Vergangenheit natürlich wieder.
- source_word: ἔμεινεν ἂν
  choice: stünde es
  rationale: Im Blick auf eine Stadt bezeichnet μένω hier ihr Fortbestehen; „stünde es noch heute“ ist idiomatisches Deutsch und bewahrt den irrealen Ergebnissatz.
- source_word: μέχρι τῆς σήμερον
  choice: noch heute
  rationale: Die Wendung gibt knapp und natürlich den Fortbestand bis zum gegenwärtigen Tag wieder.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Totenreich
  rationale: Die Transkription bewahrt den griechischen Ausdruck und dessen Unterscheidung von anderen Gerichtstermini. Die erklärende Alternative steht in der Fußnote, ohne den Text auf eine bestimmte Jenseitslehre festzulegen.
- issue: Syntax von μὴ ἕως οὐρανοῦ ὑψωθήσῃ
  choice: rhetorische Frage mit erwarteter Verneinung
  alternative: 'Aussagesatz: „Du wirst nicht bis zum Himmel erhöht werden“'
  rationale: Die Frageform wahrt die syntaktische und rhetorische Spannung des griechischen Textes; „etwa“ signalisiert die erwartete negative Antwort, ohne sie in einen Aussagesatz umzuwandeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierende Anrede der Stadt wird beibehalten. „Machttaten“ ist bibelsprachlich vertraut, aber allgemein verständlich; „Hades“ wird durch eine knappe Fußnote erläutert.
