  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: de
  text: Denn mein Joch ist angenehm[a], und meine Last ist leicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gut, gütig, wohltuend. Das griechische Wort kann etwas Gutes, Freundliches oder Angenehmes bezeichnen; bei einem Joch kann auch mitschwingen, dass es gut passt und nicht scheuert.'
    reason: χρηστός hat eine Bedeutungsbreite, die im Deutschen nicht vollständig mit einem einzelnen Adjektiv wiedergegeben werden kann.
lexical_decisions:
- source_word: χρηστός
  choice: wohltuend
  rationale: Das Adjektiv kann »gut«, »gütig«, »freundlich«, »brauchbar« oder – bei einem Joch – »angenehm/passend« bezeichnen. »Wohltuend« wahrt hier den Gedanken einer gütigen, nicht bedrückenden Herrschaft und vermeidet die Verengung auf bloß »einfach«.
- source_word: ζυγός
  choice: Joch
  rationale: »Joch« ist das entsprechende Bildwort und bezeichnet übertragen die Bindung an Herrschaft, Lehre oder Dienst.
- source_word: φορτίον
  choice: Last
  rationale: »Last« gibt die konkrete und übertragene Bedeutung natürlich und knapp wieder.
- source_word: ἐλαφρόν
  choice: leicht
  rationale: »Leicht« entspricht dem Gegensatz zu einer drückenden oder schweren Last und erhält die pointierte Parallelität.
- source_word: γάρ
  choice: Denn
  rationale: »Denn« bewahrt die begründende Verbindung mit der vorausgehenden Einladung Jesu.
theological_decisions:
- issue: Bedeutung von χρηστός für Jesu Joch
  choice: wohltuend
  alternative: leicht / angenehm / gütig
  rationale: Der Ausdruck soll nicht behaupten, Nachfolge sei in jeder Hinsicht mühelos. »Wohltuend« lässt sowohl die Güte Jesu als auch die nicht scheuernde, heilsame Beschaffenheit seines Jochs anklingen; die eigentliche Aussage »leicht« bleibt dem zweiten Satzglied vorbehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Bildsprache »Joch« und »Last« bleibt erhalten; »wohltuend« ist verständlich und hält die semantische Spannung von χρηστός offen.
