id: MAT.11.11
reference: Matthew 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: de
  text: 'Amen, ich sage euch: Unter denen, die von Frauen geboren sind,[a] ist kein Größerer aufgetreten[b] als Johannes der Täufer. Doch der Geringste[c] im Himmelreich ist größer als er.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Von Frauen geboren“ ist eine semitische Ausdrucksweise für Menschen beziehungsweise Sterbliche.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ist … erweckt worden“. Das griechische Verb kann sowohl „auftreten/aufstehen“ als auch „erweckt werden“ bedeuten; hier ist wahrscheinlich das Auftreten in der Geschichte gemeint, nicht die Auferstehung.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „der Geringere“ oder „der Kleinere“. Das Griechische verwendet eine Vergleichsform, die hier den im Rang oder Status Geringsten bezeichnen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Die feste Einleitungsformel wird im Deutschen würdevoll und gut verständlich wiedergegeben. „Amen“ bewahrt den markanten semitischen Ausdruck und kennzeichnet die folgende Aussage als feierlich und gewiss.
- source_word: οὐκ ἐγήγερται
  choice: ist kein Größerer aufgetreten
  rationale: „Aufgetreten“ gibt hier das Erscheinen einer bedeutenden Person in der Geschichte natürlich wieder und vermeidet, die Formulierung vorschnell auf Auferstehung zu beziehen. Das Perfekt wird mit deutschem Perfekt ausgedrückt.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: unter denen, die von Frauen geboren sind
  rationale: Die semitisch geprägte Wendung bleibt erkennbar, ist aber syntaktisch natürlich. Gemeint sind Menschen beziehungsweise Sterbliche.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: kein Größerer … als Johannes der Täufer
  rationale: Die deutsche Vergleichskonstruktion gibt die Aussage idiomatisch und ohne zusätzliche Deutung wieder.
- source_word: τοῦ βαπτιστοῦ
  choice: der Täufer
  rationale: Dies ist die geläufige und lexikalisch zutreffende deutsche Bezeichnung für Johannes.
- source_word: ὁ δὲ μικρότερος
  choice: doch der Geringste
  rationale: Obwohl das Griechische formal einen Komparativ verwendet, bezeichnet die Wendung im Zusammenhang natürlich den im Rang oder Status Geringsten. Eine Fußnote bewahrt die formale Alternative.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: im Himmelreich
  rationale: „Himmelreich“ ist die natürliche, etablierte deutsche Wiedergabe der matthäischen Wendung und wahrt ihren Charakter als feste Bezeichnung.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ist größer als er
  rationale: Die knappe Vergleichsaussage wird direkt wiedergegeben; „er“ bezieht sich grammatisch auf Johannes.
theological_decisions:
- issue: Verhältnis der Größe des Johannes zum Geringsten im Himmelreich
  choice: Die paradoxe Vergleichsaussage bleibt ohne theologische Erklärung stehen.
  alternative: Den Unterschied ausdrücklich mit heilsgeschichtlicher Stellung, Bundeszugehörigkeit oder persönlicher Heiligkeit erklären.
  rationale: Der Vers nennt selbst nicht den Grund, weshalb der Geringste im Himmelreich größer als Johannes ist. Eine nähere Erklärung würde eine bestimmte Auslegung in den Text eintragen.
- issue: Bedeutung von ἐγήγερται
  choice: Als geschichtliches Auftreten verstanden, bei erhaltener lexikalischer Alternative in der Fußnote.
  alternative: Als „ist auferweckt worden“ wiedergeben und damit eine Auferstehungsaussage nahelegen.
  rationale: Im Zusammenhang mit den von Frauen Geborenen und der Größe des Johannes bezeichnet das Verb am wahrscheinlichsten sein Auftreten beziehungsweise Hervortreten; seine weitere mögliche Bedeutung wird dennoch nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar biblischem Ton. „Amen“ und „Himmelreich“ bewahren vertraute matthäische Sprachprägung; Satzbau und Wortwahl bleiben zugleich für heutige Leser klar. Die Fußnoten erläutern die semitische Wendung und bewahren echte lexikalische Mehrdeutigkeiten, ohne die theologische Spannung des Verses aufzulösen.
