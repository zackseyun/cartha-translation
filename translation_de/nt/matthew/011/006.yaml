  verdict: revise
  source_fidelity: 'Die Hauptaussage trifft die griechische Konstruktion gut: καί wird angeschlossen, ὃς ἐὰν μή idiomatisch mit »wer nicht« wiedergegeben, und »an mir Anstoß nimmt« gibt σκανδαλισθῇ ἐν ἐμοί kontextgerecht wieder. Die Fußnotenalternative »durch mich zu Fall kommt« verschiebt jedoch die Relation unnötig in Richtung einer kausativen Verursachung durch Jesus; näher am griechischen Bild und an ἐν ἐμοί ist »an mir strauchelt«.'
  naturalness: »Glücklich zu preisen ist« ist zwar verständlich, wirkt im heutigen Standarddeutsch aber gekünstelt. »Selig ist« ist die natürliche, würdige und in Seligpreisungen etablierte Wiedergabe, ohne ein bloß subjektives Glücksgefühl nahezulegen.
  terminology: »Selig« bewahrt das religiös geprägte Gewicht von μακάριος besser als »glücklich«. »Anstoß nehmen« ist als Haupttext angemessen. Die Fußnote sollte die Stolpermetapher mit »straucheln« ausdrücken und die mögliche Bedeutungsnuance des Sich-Ärgerns bzw. Anstoßnehmens nicht überdeuten.
  issues:
  - severity: medium
    issue: »glücklich zu preisen« für μακάριος
    rationale: Die Formulierung ist stilistisch unnötig umständlich und »glücklich« kann die Zusage auf ein subjektives Gefühl verengen. »Selig ist« ist im Deutschen sowohl idiomatischer als auch dem feierlich-religiösen Register des griechischen μακάριος angemessener.
  - severity: low
    issue: Fußnotenalternative »durch mich zu Fall kommt«
    rationale: »Durch mich« kann Jesus stärker als verursachendes Agens darstellen. Das griechische ἐν ἐμοί bezeichnet hier natürlicher die Person, an der jemand Anstoß nimmt bzw. strauchelt. »An mir strauchelt« erhält diese Relation und die Metapher.
  revised_text: Und selig ist, wer nicht an mir Anstoß nimmt.[a]
