  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: de
  text: Und selig ist, wer nicht an mir Anstoß nimmt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wer nicht an mir strauchelt«; auch: »wer sich nicht an mir ärgert«.'
    reason: Lexikalische Alternativen für σκανδαλισθῇ ἐν ἐμοί; die Formulierung kann Anstoß, Ablehnung oder ein geistliches Straucheln bezeichnen.
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die Verknüpfung mit Jesu vorausgehender Antwort.
- source_word: μακάριός
  choice: glücklich zu preisen
  rationale: Gibt den feierlichen Zuspruch einer Seligpreisung wieder, ohne ihn auf ein subjektives Glücksgefühl zu reduzieren.
- source_word: ὃς ἐὰν μὴ
  choice: wer nicht
  rationale: Natürliches Deutsch für die unbestimmte, allgemein geltende Bedingung.
- source_word: σκανδαλισθῇ
  choice: Anstoß nimmt
  rationale: Die im Deutschen geläufige Wendung bewahrt die Anstoß-Metaphorik und kann über bloße emotionale Kränkung hinaus auch Ablehnung oder Abwendung einschließen.
- source_word: ἐν ἐμοί
  choice: an mir
  rationale: Im Zusammenhang mit »Anstoß nehmen« bezeichnet die Präposition Jesus als denjenigen, an dem jemand Anstoß nimmt.
theological_decisions:
- issue: Tragweite von σκανδαλισθῇ in Bezug auf Jesus
  choice: nicht an mir Anstoß nimmt
  alternative: nicht durch mich zu Fall kommt
  rationale: Die Hauptfassung bewahrt die Spannung, dass Jesus selbst zum Anlass von Ablehnung oder Abwendung werden kann. Die Alternative macht die stärkere Stolper- beziehungsweise Fallmetaphorik sichtbar, ohne sie als einzig mögliche Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Glücklich zu preisen« markiert den Seligpreisungscharakter; »Anstoß nehmen« ist idiomatisch und erhält zugleich das biblische Bildfeld.
