id: MAT.11.1
reference: Matthew 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: de
  text: Als Jesus damit fertig war, seinen zwölf Jüngern Anweisungen zu geben[a], zog er von dort weiter, um in ihren Städten[b] zu lehren und zu predigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinen zwölf Jüngern Befehle zu geben.'
    reason: lexical_alternative
  - marker: b
    text: Wessen Städte gemeint sind, bleibt im Griechischen offen. Es können die Städte der Jünger oder allgemeiner die Ortschaften der Menschen in jener Gegend gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Als
  rationale: Die semitisch geprägte matthäische Übergangsformel eröffnet hier vor allem einen temporalen Nebensatz. „Als“ gibt diese Funktion in natürlichem modernem Deutsch wieder, ohne ein schwerfälliges „Und es geschah, als“ einzuführen.
- source_word: ἐτέλεσεν
  choice: damit fertig war
  rationale: Die Form bezeichnet den Abschluss der vorausgehenden Tätigkeit vor Jesu anschließendem Aufbruch. Die deutsche Wendung bildet diese zeitliche Abfolge idiomatisch ab.
- source_word: διατάσσων
  choice: Anweisungen zu geben
  rationale: Das Partizip bezeichnet autoritatives Anordnen oder Anweisen. „Anweisungen geben“ wahrt diesen Nachdruck, passt zum Aussendungsauftrag und klingt weniger unnötig militärisch als „Befehle geben“.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: seinen zwölf Jüngern
  rationale: „Jünger“ ist im Evangelienkontext die etablierte und sachlich passende Wiedergabe von μαθηταί; Zahl und Zugehörigkeit bleiben ausdrücklich erhalten.
- source_word: μετέβη ἐκεῖθεν
  choice: zog er von dort weiter
  rationale: Die Formulierung gibt sowohl die Ortsveränderung als auch den Fortgang der Erzählung natürlich wieder.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: um … zu lehren und zu predigen
  rationale: Der artikulierte Infinitiv bezeichnet hier den Zweck. Die Wiedergabe bewahrt die Unterscheidung zwischen Lehren und öffentlicher Verkündigung.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: in ihren Städten
  rationale: Die direkte Wiedergabe lässt den Bezug von αὐτῶν ebenso offen wie der griechische Text. „Städte“ entspricht πόλεις, auch wenn je nach örtlicher Größe „Ortschaften“ möglich wäre.
theological_decisions:
- issue: Bezug von αὐτῶν in ἐν ταῖς πόλεσιν αὐτῶν
  choice: Die mehrdeutige Formulierung „in ihren Städten“ wird beibehalten.
  alternative: „in den Städten der Jünger“, „in den jüdischen Städten“ oder „in den Ortschaften jener Gegend“
  rationale: Das Pronomen nennt seinen Bezug nicht ausdrücklich. Eine Festlegung würde eine Auslegung in den Haupttext eintragen, die der Ausgangstext selbst nicht eindeutig vornimmt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die matthäische Übergangsformel wird idiomatisch verkürzt; die lexikalische Stärke von διατάσσων und die Mehrdeutigkeit des Possessivpronomens werden durch Fußnoten gesichert.
