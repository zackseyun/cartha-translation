id: MAT.11.4
reference: Matthew 11:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: de
  text: 'Und Jesus antwortete ihnen[a]: »Geht und berichtet Johannes, was ihr hört und seht:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und Jesus antwortete und sagte ihnen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Das einleitende καί führt die Erzählung schlicht fort; »Und« bewahrt diese verbindende Funktion.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: Jesus antwortete ihnen
  rationale: Die griechische Erzählformel bedeutet idiomatisch, dass Jesus ihnen antwortete. Im modernen Deutschen wäre »antwortete und sagte ihnen« unnötig schwerfällig; der folgende Doppelpunkt wahrt die Redeeinleitung.
- source_word: Πορευθέντες
  choice: Geht
  rationale: Das vorausgehende Aoristpartizip begleitet den Imperativ und hat hier gebietende Kraft; »Geht« gibt dies natürlich wieder.
- source_word: ἀπαγγείλατε
  choice: berichtet
  rationale: Das Verb bezeichnet die Weitergabe beziehungsweise Rückmeldung einer Nachricht. »Berichtet« passt zu den Boten, die Johannes mitteilen sollen, was sie wahrnehmen.
- source_word: Ἰωάννῃ
  choice: Johannes
  rationale: Der Dativ bezeichnet den Empfänger des Berichts. Im Deutschen genügt bei »berichten« der Dativ ohne »an«.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: was ihr hört und seht
  rationale: Die Formulierung bildet die gegenwärtige Wahrnehmung der Angesprochenen knapp und unmittelbar ab.
theological_decisions:
- issue: Wiedergabe der Erzählformel ἀποκριθεὶς ... εἶπεν
  choice: Jesus antwortete ihnen
  alternative: Jesus antwortete und sagte ihnen
  rationale: Die verkürzte deutsche Form ist idiomatisch und bewahrt die Aussagefunktion vollständig. Die wörtlichere Struktur wird in einer Fußnote kenntlich gemacht; eine theologische Festlegung ist damit nicht verbunden.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. »Berichtet« ist präziser als das allgemeinere »sagt«, bleibt aber für gewöhnliche Leser verständlich. Die Satzstruktur folgt dem griechischen Ablauf, ohne dessen idiomatische Redeeinleitung hölzern nachzubilden.
