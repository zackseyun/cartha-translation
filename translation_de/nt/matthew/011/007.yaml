  variant: modern standard German
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: de
  text: 'Während sie weggingen, begann Jesus zu den Menschenmengen über Johannes zu sprechen: »Was seid ihr in die Wüste hinausgegangen, um zu sehen? Ein vom Wind hin und her bewegtes Schilfrohr?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild eines vom Wind hin und her bewegten Schilfrohrs kann für Unbeständigkeit oder Wankelmut stehen. Die rhetorische Frage legt nahe, dass Johannes nicht so war.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Während sie weggingen
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig ablaufende Handlung. Das Pronomen verweist im unmittelbaren Zusammenhang auf die Jünger des Johannes; die knappe Wiedergabe bewahrt den Rückbezug, ohne eine zusätzliche Bezeichnung in den Text einzufügen.
- source_word: ἤρξατο ... λέγειν
  choice: begann ... zu sprechen
  rationale: Die Verbindung von ἄρχομαι mit Infinitiv bezeichnet den Beginn einer Handlung; „zu sprechen“ ist im Deutschen für die an die Menschenmengen gerichtete Rede natürlich.
- source_word: τοῖς ὄχλοις
  choice: zu den Menschenmengen
  rationale: Die Wiedergabe behält den Plural bei und ist im modernen Deutschen verständlicher und würdevoller als das veraltete „Volkshaufen“.
- source_word: περὶ Ἰωάννου
  choice: über Johannes
  rationale: περί mit Genitiv bezeichnet hier das Thema der Rede.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Was wolltet ihr draußen in der Wüste betrachten?
  rationale: τί wird als Frage nach dem Gegenstand („Was?“) bewahrt. θεάομαι bezeichnet hier ein bewusstes Anschauen oder Betrachten; „wolltet ihr ... betrachten“ gibt den Zweck des Hinausgehens idiomatisch wieder. „Draußen in der Wüste“ bildet ἐξήλθατε und εἰς τὴν ἔρημον natürlich ab.
- source_word: κάλαμον
  choice: ein Schilfrohr
  rationale: „Schilfrohr“ ist eine präzise und im Deutschen geläufige Bezeichnung für κάλαμος und erhält das Bild im Singular.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: das vom Wind hin und her bewegt wird
  rationale: Die passive Partizipialkonstruktion bleibt erhalten. „Hin und her bewegt“ vermittelt die schwankende Bewegung, ohne die übertragene Bedeutung ausdrücklich in den Haupttext einzutragen.
theological_decisions:
- issue: Bezug von Τούτων („diese“)
  choice: Mit „sie“ wiedergegeben; der unmittelbare Kontext identifiziert sie als die Jünger des Johannes.
  alternative: „Während diese Männer weggingen“ oder „Während die Jünger des Johannes weggingen“
  rationale: Das Deutsche kann den kontextuellen Rückbezug mit „sie“ klar und natürlich ausdrücken. Eine ausdrückliche Identifizierung wäre zwar sachlich zutreffend, würde aber Information aus dem vorherigen Vers in diesen Vers eintragen.
- issue: Bedeutung des vom Wind bewegten Schilfrohrs
  choice: Das Bild bleibt im Haupttext unausgelegt; eine Anmerkung erläutert seine wahrscheinliche rhetorische Funktion.
  alternative: Die Unbeständigkeit des Johannes ausdrücklich in der Übersetzung verneinen.
  rationale: Jesu rhetorische Frage legt eine negative Antwort nahe, doch der griechische Wortlaut formuliert die Deutung nicht ausdrücklich. So bleiben Bild und theologische Spannung erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage und das konkrete Naturbild werden bewahrt; interpretierende Zusätze bleiben auf die Fußnote beschränkt.
