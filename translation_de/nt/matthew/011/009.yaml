review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von „Propheten“, „Ja, ich sage euch“ und „mehr als einen Propheten“ trifft den griechischen Sinn und bewahrt die bewusst nicht näher erklärte Steigerung. Die erste Frage sollte jedoch den finalen Infinitiv ἰδεῖν deutlicher wiedergeben: Der Entwurf fügt mit „sehen wollen“ ein Wollen hinzu und macht mit „als“ aus dem Zweck eine Zeitangabe.'
  naturalness: „Was seid ihr hinausgegangen, um zu sehen?“ ist modernes, klares Standarddeutsch und bildet die rhetorische Frage samt Zweckangabe natürlich ab. Der Doppelpunkt nach der Redeformel unterstützt die im Deutschen knappe, elliptische Schlusswendung.
  terminology: „Prophet“ ist der etablierte und sachgerechte Ausdruck. „mehr als einen Propheten“ bewahrt die offene, ungewöhnliche Formulierung des Griechischen, ohne die Aussage zu einer bestimmten Deutung über Johannes auszubauen.
  issues:
  - severity: medium
    issue: Die Wiedergabe von τί ἐξήλθατε ἰδεῖν als „was habt ihr sehen wollen, als ihr hinausgingt?“
    rationale: ἰδεῖν ist ein finaler Infinitiv („um zu sehen“). „sehen wollen“ fügt eine modale Nuance hinzu; „als ihr hinausgingt“ gibt die Zweckbeziehung nur indirekt und als zeitlichen Nebensatz wieder.
  - severity: low
    issue: Die Fußnote bezeichnet „sogar“ als Teil der wörtlicheren griechischen Formulierung.
    rationale: Das Griechische lautet καὶ περισσότερον προφήτου, wörtlich etwa „und mehr als einen Propheten“. „Sogar“ ist eine mögliche deutsche Wiedergabe der steigernden/additiven Nuance von καί, aber nicht Bestandteil einer wörtlichen Übersetzung.
  revised_text: 'Doch was seid ihr hinausgegangen, um zu sehen? Einen Propheten? Ja, ich sage euch: mehr als einen Propheten.[a]'
