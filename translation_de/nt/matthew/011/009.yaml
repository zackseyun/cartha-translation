  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: de
  text: 'Doch was seid ihr hinausgegangen, um zu sehen? Einen Propheten? Ja, ich sage euch: mehr als einen Propheten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen, der größer ist als ein Prophet“. Wörtlich: „und mehr als einen Propheten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Leitet nach den vorangehenden rhetorischen Fragen einen deutlichen Gegensatz beziehungsweise eine Weiterführung ein und klingt im modernen Deutschen natürlich.
- source_word: τί ἐξήλθατε … ἰδεῖν
  choice: was habt ihr sehen wollen, als ihr hinausgingt
  rationale: τί bezeichnet das gesuchte Objekt, während ἰδεῖν den Zweck des Hinausgehens angibt. Die Umstellung gibt diese Beziehung in verständlichem, natürlichem Deutsch wieder, ohne τί als „warum“ zu deuten.
- source_word: προφήτην
  choice: einen Propheten
  rationale: Das artikellose Singularwort bezeichnet in der rhetorischen Frage natürlich einen Vertreter dieser Kategorie.
- source_word: ναί
  choice: Ja
  rationale: Gibt die unmittelbare bejahende Antwort knapp und idiomatisch wieder.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Bewahrt die geläufige und nachdrückliche Redeformel eng am griechischen Wortlaut.
- source_word: καὶ περισσότερον προφήτου
  choice: sogar mehr als einen Propheten
  rationale: καί hat hier steigernde Kraft; περισσότερον mit dem Genitiv drückt einen Vergleich aus. Die Formulierung bewahrt das ungewöhnliche „mehr als“, ohne im Haupttext ausdrücklich zu erklären, worin dieses Mehr besteht.
theological_decisions:
- issue: Stellung Johannes des Täufers im Verhältnis zu den Propheten
  choice: „mehr als einen Propheten“
  alternative: „einen, der größer ist als ein Prophet“
  rationale: Die Aussage hebt Johannes über die bloße Bezeichnung als Prophet hinaus, legt in diesem Satzteil aber nicht fest, worin seine besondere Stellung besteht. Die knappe Form bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Frage wird für natürliche deutsche Syntax umgestellt; die zweite und die Antwort behalten die knappe rhetorische Folge des griechischen Textes bei.
