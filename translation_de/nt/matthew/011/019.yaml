review_pass:
  verdict: revise
  source_fidelity: Der Hauptsatz folgt dem griechischen Ausgangstext einschließlich der präsentischen Redeform »sie sagen«, der abwertenden Vorwürfe und der SBLGNT-Lesart »Werke«. »wurde gerechtfertigt« ist für ἐδικαιώθη zwar formal möglich, trifft hier im heutigen Deutsch aber die erweisende/vindizierende Bedeutung nicht hinreichend klar.
  naturalness: »Der Menschensohn kam, aß und trank« sowie »Fresser und Säufer« sind natürliches, würdiges modernes Standarddeutsch und bewahren den scharfen Ton der Anschuldigung. Für den Schlusssatz ist »wurde durch ihre Werke als richtig erwiesen« idiomatischer und verständlicher.
  terminology: »Menschensohn«, »Zolleinnehmer«, »Sünder« und die nicht weiter ausgelegte personifizierte »Weisheit« sind angemessen. Die Fußnoten werden an die revidierte Haupttextform angepasst; die Variante »Kinder« bleibt klar als Handschriftenvariante markiert.
  issues:
  - severity: medium
    issue: »wurde gerechtfertigt« im Schlusssatz
    rationale: δικαιόω bezeichnet hier, wie der Kontext und die englische Audit-Spur ausweisen, das Erweisen bzw. Bestätigen der Weisheit als richtig. »Gerechtfertigt« ist im Deutschen stark von einer anderen theologischen Verwendung geprägt und ist hier ohne Erläuterung missverständlich. »als richtig erwiesen« gibt die Funktion der Werke als Bestätigung wieder, ohne die Personifikation auszudeuten.
  - severity: low
    issue: Fußnotenformulierung nach der semantischen Revision
    rationale: Wenn der Haupttext die idiomatische Wiedergabe verwendet, sollte die lexikalische Alternative die formal nähere Form bieten; die Variantenfußnote sollte die gewählte Wiedergabe konsistent fortführen.
