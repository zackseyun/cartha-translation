id: MAT.11.19
reference: Matthew 11:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: de
  text: 'Der Menschensohn kam, aß und trank, und sie sagen: »Seht, ein Fresser und Säufer, ein Freund von Zolleinnehmern und Sündern!« Und die Weisheit wurde durch ihre Werke als richtig erwiesen.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und die Weisheit wurde durch ihre Werke gerechtfertigt.«'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften lesen »Kinder« statt »Werke«: »Und die Weisheit wurde durch ihre Kinder als richtig erwiesen.«'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt den semitischen Hintergrund und die messianisch-theologische Bedeutung des Titels, ohne ihn auszudeuten.
- source_word: ἐσθίων καὶ πίνων
  choice: aß und trank
  rationale: Die schlichte Formulierung gibt die gewöhnliche Tätigkeit wieder und wahrt den Gegensatz zu Johannes’ asketischer Lebensweise, ohne sie als Gelage zu überzeichnen.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Eine natürliche, gegenwärtige Wiedergabe des ausrufenden Hinweises, die den anklagenden Ton erhält.
- source_word: φάγος καὶ οἰνοπότης
  choice: ein Fresser und Säufer
  rationale: Beide Wörter sind abwertende Anschuldigungen. Die idiomatische deutsche Wortpaarung gibt die Schärfe der Beleidigung wieder.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: ein Freund von Zolleinnehmern und Sündern
  rationale: Die Wiedergabe bewahrt sowohl die Genitivbeziehung als auch die gesellschaftlich-religiöse Wirkung der Bezeichnungen.
- source_word: ἐδικαιώθη
  choice: wurde gerechtfertigt
  rationale: Die formal nahe Wiedergabe erhält die Verbindung zum weiteren biblischen Gebrauch von δικαιόω; die Fußnote nennt eine im Deutschen unmittelbar verständliche sinngemäße Alternative.
- source_word: ἡ σοφία
  choice: die Weisheit
  rationale: Die personifizierte Weisheit bleibt ohne interpretierende Identifikation erhalten.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: durch ihre Werke
  rationale: Dies gibt die bestätigende beziehungsweise erweisende Funktion von ἀπό mit dem Genitiv in diesem Zusammenhang wieder und folgt der Lesart ἔργων des SBLGNT.
theological_decisions:
- issue: Bedeutung der Weisheit im Schlusssatz
  choice: Die personifizierte Bezeichnung »die Weisheit« bleibt ohne nähere Identifikation stehen.
  alternative: Die Weisheit ausdrücklich mit Jesus, Gottes Weisheit oder Gottes Heilsplan gleichsetzen.
  rationale: Der Wortlaut selbst löst die Personifikation nicht eindeutig auf; deshalb bleibt die literarische und theologische Spannung erhalten.
- issue: Textform des Schlusssatzes
  choice: Im Haupttext steht gemäß SBLGNT »Werke«.
  alternative: Einige Handschriften lesen »Kinder« und stimmen damit mit der Parallele in Lukas 7,35 überein.
  rationale: Der vorgegebene griechische Ausgangstext hat ἔργων; die beachtenswerte Variante wird aus Gründen der Nachprüfbarkeit in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede behält mit »Fresser und Säufer« bewusst den scharfen, verleumderischen Ton der griechischen Bezeichnungen. »Gerechtfertigt« wahrt die biblische Wortverbindung; die idiomatischere Deutung steht in der Fußnote.
