id: MAT.11.28
reference: Matthew 11:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: de
  text: Kommt zu mir, ihr alle, die ihr euch abmüht und mit Lasten beladen seid[a]; ich werde euch Ruhe schenken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr schwer beladen seid“. Die griechische Perfektform bezeichnet Menschen, denen Lasten auferlegt worden sind und die weiterhin darunter stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ich werde euch erquicken“. Das Verb kann bedeuten, jemanden zur Ruhe zu bringen oder ihn zu erfrischen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Kommt zu mir
  rationale: Die einladende Aufforderung mit πρός und Akkusativ bezeichnet die Bewegung hin zu einer Person; „Kommt zu mir“ ist natürlich und unmittelbar.
- source_word: πάντες
  choice: ihr alle
  rationale: Gibt den umfassenden Adressatenkreis ausdrücklich wieder und macht zugleich den Plural der Aufforderung hörbar.
- source_word: οἱ κοπιῶντες
  choice: die ihr euch abmüht
  rationale: Bewahrt den aktiven Sinn fortgesetzter anstrengender Arbeit oder Mühe und klingt im heutigen Deutsch natürlicher als „die ihr arbeitet“.
- source_word: πεφορτισμένοι
  choice: mit Lasten beladen seid
  rationale: Das Perfekt Passiv bezeichnet einen durch auferlegte Last entstandenen, fortbestehenden Zustand. Die Formulierung bildet dieses Zustandsresultat anschaulich ab.
- source_word: κἀγὼ
  choice: ich
  rationale: Das explizite Subjekt bleibt erhalten; das deutsche Semikolon gibt den Anschluss und die leichte Gegenüberstellung natürlich wieder, ohne das καί mechanisch mit „und“ abzubilden.
- source_word: ἀναπαύσω ὑμᾶς
  choice: werde euch Ruhe schenken
  rationale: Gibt die kausative Bedeutung „zur Ruhe bringen/Ruhe geben“ idiomatisch wieder und lässt offen, welcher Art diese Ruhe ist.
theological_decisions:
- issue: Art der in ἀναπαύσω verheißenen Ruhe
  choice: „ich werde euch Ruhe schenken“ ohne nähere Bestimmung
  alternative: „ich werde euch erquicken“ oder „ich werde euren Seelen Ruhe geben“
  rationale: Der Vers bestimmt die Ruhe hier nicht ausdrücklich als körperlich, seelisch, geistlich oder endzeitlich. Die breite Formulierung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Einladung bleibt knapp und einprägsam; „euch abmüht“ vermeidet archaische Sprache, während „Ruhe schenken“ die verheißende Tonlage und die Bedeutungsbreite wahrt.
