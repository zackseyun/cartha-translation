id: MAT.11.22
reference: Matthew 11:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: de
  text: 'Doch ich sage euch: Tyrus und Sidon wird es am Tag des Gerichts erträglicher ergehen als euch.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Leitet einen deutlichen Gegensatz zur vorausgehenden Gerichtsankündigung ein und klingt im modernen Standarddeutsch würdig und natürlich.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Bewahrt die direkte, feierliche Redeformel und gibt den Plural von ὑμῖν ohne unnötige Erweiterung wieder.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Tyrus und Sidon
  rationale: Der Dativ bezeichnet im Vergleich diejenigen, für die das Gericht erträglicher sein wird; die deutsche Konstruktion „jemandem wird es … ergehen“ bildet dies unmittelbar ab.
- source_word: ἀνεκτότερον
  choice: erträglicher
  rationale: Gibt den Komparativ präzise wieder und ist im Zusammenhang des Gerichts natürlicher als das abstraktere „tolerierbarer“.
- source_word: ἔσται
  choice: wird es … ergehen
  rationale: Die idiomatische deutsche Vergleichskonstruktion drückt das zukünftige Erleben des Gerichtstags aus, ohne das Ergebnis näher festzulegen.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: am Tag des Gerichts
  rationale: Gibt die Zeitangabe und den forensischen Sinn von κρίσις klar und traditionsübergreifend wieder.
- source_word: ἢ ὑμῖν
  choice: als euch
  rationale: Vervollständigt den Vergleich knapp und bewahrt die pluralische direkte Anrede.
theological_decisions:
- issue: Art des kommenden Gerichts
  choice: am Tag des Gerichts
  alternative: an einem Gerichtstag
  rationale: Obwohl die griechische Wendung ohne Artikel steht, bezeichnet sie im matthäischen Zusammenhang idiomatisch den bekannten kommenden Gerichtstag. Die Übersetzung fügt keine weitergehende Aussage über Ablauf oder Ausgang dieses Gerichts hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung bewahrt den feierlichen Nachdruck der direkten Anrede; eine Fußnote ist nicht nötig, da „erträglicher“ die Bedeutung von ἀνεκτότερον unmittelbar und eindeutig wiedergibt.
