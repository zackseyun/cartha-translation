id: MAT.11.2
reference: Matthew 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: de
  text: Als Johannes im Gefängnis von den Taten des Messias[a] hörte, sandte er durch seine Jünger eine Botschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“.'
    reason: Bewahrt die traditionelle alternative Wiedergabe des Titels Χριστός.
lexical_decisions:
- source_word: δὲ
  choice: Als Johannes … hörte
  rationale: Die schwach weiterführende bzw. überleitende Funktion von δέ wird im natürlichen deutschen Satzbau mitgetragen; ein ausdrückliches „aber“ wäre hier unnötig markiert.
- source_word: ἀκούσας
  choice: Als … hörte
  rationale: Das Aoristpartizip wird idiomatisch als temporaler Nebensatz wiedergegeben und bezeichnet die der Haupthandlung vorausgehende Wahrnehmung.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: im Gefängnis
  rationale: Dies ist die natürliche deutsche Ortsangabe und bewahrt den Sinn des griechischen Ausdrucks.
- source_word: τὰ ἔργα
  choice: die Taten
  rationale: „Taten“ gibt ἔργα verständlich und würdig wieder und kann sowohl Jesu machtvolle Werke als auch sein weiteres Wirken umfassen.
- source_word: τοῦ χριστοῦ
  choice: des Messias
  rationale: Χριστός steht hier als Titel. „Messias“ macht dessen Bedeutung und jüdischen Erwartungshorizont deutlicher als die traditionelle Form „Christus“.
- source_word: πέμψας διὰ τῶν μαθητῶν αὐτοῦ
  choice: sandte er durch seine Jünger eine Botschaft
  rationale: διά mit Genitiv bezeichnet die Jünger als Vermittler. „Eine Botschaft“ macht das im Deutschen erforderliche, im Kontext erschließbare Objekt kenntlich, ohne den Inhalt aus dem folgenden Vers vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck bezeichnet hier den Gesalbten als Titel und steht inhaltlich mit den messianischen Taten Jesu in Verbindung. Die traditionelle Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der Satz bleibt eng an der griechischen Struktur, formuliert die durch πέμψας vorausgesetzte Mitteilung jedoch idiomatisch als „Botschaft“.
