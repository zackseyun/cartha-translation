  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: de
  text: 'Doch was seid ihr hinausgegangen, um zu sehen? Einen Mann in weicher Kleidung? Seht: Diejenigen, die weiche Kleidung tragen, sind in den Häusern der Könige.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Leitet im Anschluss an die vorherige rhetorische Frage einen deutlichen Gegensatz ein und klingt im modernen Deutsch natürlich.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: was wolltet ihr sehen, als ihr hinausgingt
  rationale: Gibt den Zweck des Hinausgehens idiomatisch wieder, ohne das Fragewort τί umzudeuten.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Entspricht dem maskulinen Singular und dem unmittelbaren Bezug auf Johannes den Täufer.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: in weicher Kleidung
  rationale: Bewahrt die konkrete Bedeutung von μαλακός; im Zusammenhang schwingt feine beziehungsweise luxuriöse Kleidung mit.
- source_word: ἰδοὺ
  choice: Seht
  rationale: Modernes, würdiges Aufmerksamkeitssignal, das die rhetorische Kraft des griechischen Ausdrucks erhält.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: Wer weiche Kleidung trägt
  rationale: Gibt die substantivierte Partizipialkonstruktion natürlich wieder und bewahrt die Wiederholung von μαλακός.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: lebt in Königspalästen
  rationale: Drückt den idiomatischen Sinn im Deutschen aus; der Plural und der königliche Wohnbereich bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, mündlich-rhetorischem Klang. Die Wiederholung von »weiche Kleidung« bildet die griechische Wiederholung ab; »Königspaläste« wird durch eine Fußnote zur wörtlicheren Form transparent gemacht.
