  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: de
  text: 'und sagte zu ihm: »Bist du der Kommende[a], oder sollen wir einen anderen erwarten?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der, der kommen soll« oder »der, der kommt«. Der griechische Ausdruck kann als messianischer Titel gebraucht werden.'
    reason: Lexikalische Alternative und möglicher Titelgebrauch.
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: und sagte zu ihm
  rationale: Das Aoristverb bedeutet schlicht »sagte«; »und« stellt im Deutschen den erzählerischen Anschluss an den vorherigen Vers her, obwohl dafür im vorgelegten griechischen Ausschnitt kein eigenes Wort steht.
- source_word: Σὺ εἶ
  choice: Bist du
  rationale: Die deutsche Frageform gibt die Konstruktion natürlich wieder. Das ausdrücklich gesetzte σύ hebt die angesprochene Person hervor; diese Betonung ist im unmittelbaren Gegensatz zu »einen anderen« ausreichend erkennbar.
- source_word: ὁ ἐρχόμενος
  choice: der Kommende
  rationale: Das substantivierte Partizip mit Artikel wird formal und zugleich titelartig wiedergegeben. So bleibt der messianische Erwartungshorizont erhalten, ohne das deutende Wort »Messias« in den Text einzusetzen.
- source_word: ἢ
  choice: oder
  rationale: Die disjunktive Konjunktion leitet die alternative Frage ein.
- source_word: ἕτερον
  choice: einen anderen
  rationale: ἕτερον bezeichnet hier eine andere Person beziehungsweise jemand anderen. »Einen anderen« ist präzise und idiomatisch.
- source_word: προσδοκῶμεν
  choice: sollen wir … erwarten
  rationale: Der formal präsentische Indikativ steht in einer abwägenden Frage. »Sollen wir … erwarten« gibt diese Funktion im Deutschen natürlich wieder und bewahrt den Sinn des gespannten Erwartens.
theological_decisions:
- issue: Messianische beziehungsweise titelartige Bedeutung von ὁ ἐρχόμενος
  choice: der Kommende
  alternative: der, der kommen soll; der Erwartete
  rationale: Artikel, Partizip und Kontext lassen die Wendung als Bezeichnung der erwarteten Heilsgestalt verstehen. »Der Kommende« wahrt diese Möglichkeit und zugleich die wörtliche Bildsprache, ohne die Wendung ausdrücklich mit »Messias« gleichzusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. »Der Kommende« ist bewusst leicht markiert, da es den möglichen Titelcharakter des griechischen Ausdrucks bewahrt; die Fußnote nennt natürlichere beschreibende Alternativen.
