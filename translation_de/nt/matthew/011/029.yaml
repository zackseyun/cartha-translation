source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: de
  text: Nehmt mein Joch auf euch und lernt von mir, denn ich bin sanftmütig[a] und von Herzen demütig, und ihr werdet Ruhe finden für eure Seelen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sanft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Nehmt mein Joch auf euch
  rationale: Die geläufige deutsche Wendung bewahrt das konkrete Bild des Jochs und gibt den Aoristimperativ als Aufforderung wieder, dieses Joch anzunehmen.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: lernt von mir
  rationale: Direkte und natürliche Wiedergabe des Imperativs mit ἀπό; sie lässt sowohl Unterweisung als auch Nachfolge anklingen.
- source_word: ὅτι
  choice: denn
  rationale: Hier leitet ὅτι die Begründung dafür ein, warum Jesus als Lehrer angenommen werden soll. „Denn“ bewahrt den erklärenden Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: πραΰς
  choice: sanftmütig
  rationale: „Sanftmütig“ bezeichnet eine milde, nicht harte Haltung, ohne Schwäche zu unterstellen, und ist im biblischen Sprachgebrauch verständlich verankert.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: von Herzen demütig
  rationale: Die Formulierung gibt die innere Haltung idiomatisch wieder und bewahrt sowohl ταπεινός als auch den Bezug auf das Herz.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: ihr werdet Ruhe finden
  rationale: Der Futur wird als Zusage wiedergegeben; „Ruhe“ erhält die unmittelbare und schriftsprachlich resonante Bedeutung von ἀνάπαυσις.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: für eure Seelen
  rationale: Die Dativkonstruktion wird idiomatisch mit „für“ wiedergegeben. „Seelen“ bewahrt die traditionelle Bildsprache und den Bezug auf das innere Leben beziehungsweise die ganze Person.
theological_decisions:
- issue: Jesu Selbstbeschreibung als πραΰς und ταπεινὸς τῇ καρδίᾳ
  choice: sanftmütig und von Herzen demütig
  alternative: sanft und demütig im Herzen
  rationale: 'Die gewählte Fassung bewahrt Jesu persönliche Selbstbeschreibung und ihre theologische Spannung: Autorität verbindet sich mit Sanftmut und Demut. Sie fügt keine konfessionelle Deutung hinzu.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das zentrale Jochbild bleibt erhalten; Satzbau und Wortwahl sind allgemein verständlich, ohne die biblische Bildsprache zu verflachen.
