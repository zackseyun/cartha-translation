source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: de
  text: Blinde werden sehend, Menschen mit einer Gehbehinderung gehen, Menschen mit Aussatz werden rein, Taube hören, Tote werden auferweckt, und den Armen wird die gute Nachricht verkündet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb steht im Passiv: Den Armen wird gute Nachricht verkündet. Auch möglich: „Den Armen wird das Evangelium gepredigt.“'
    reason: lexical_alternative
  - marker: b
    text: Die Aufzählung greift Jesaja 35,5–6 und 61,1 auf und nennt Zeichen, die mit dem Wirken des Messias verbunden sind.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: Blinde werden sehend
  rationale: Die Wendung gibt den Heilungssinn von ἀναβλέπω wieder, ohne festzulegen, ob die Betroffenen früher schon sehen konnten; „sehen wieder“ wäre enger.
- source_word: χωλοὶ περιπατοῦσιν
  choice: Gelähmte gehen
  rationale: „Gelähmte“ ist im heutigen Deutsch eine verständliche Bezeichnung für Menschen mit schwerer Gehbehinderung; „gehen“ bewahrt die knappe Aussageform des griechischen Präsens.
- source_word: λεπροὶ καθαρίζονται
  choice: Aussätzige werden rein
  rationale: „Werden rein“ erhält die körperliche und kultische Bedeutungsweite von καθαρίζονται und verengt die Aussage nicht auf bloße Heilung.
- source_word: κωφοὶ ἀκούουσιν
  choice: Taube hören
  rationale: κωφός kann je nach Zusammenhang taub oder stumm bedeuten; zusammen mit „hören“ ist hier eindeutig Taubheit gemeint.
- source_word: νεκροὶ ἐγείρονται
  choice: Tote werden auferweckt
  rationale: Die Passivform wahrt, dass die Toten die Handlung empfangen, und entspricht dem Zusammenhang von Totenerweckungen.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: Armen wird die gute Nachricht verkündet
  rationale: Die Formulierung bewahrt sowohl den Bezug auf die Armen als Empfänger als auch die passive Bedeutung des griechischen Verbs, ohne einen späteren kirchlichen Fachausdruck vorauszusetzen.
theological_decisions:
- issue: Bedeutung von εὐαγγελίζονται und Verhältnis zum Begriff „Evangelium“
  choice: Armen wird die gute Nachricht verkündet
  alternative: Armen wird das Evangelium gepredigt
  rationale: „Gute Nachricht“ gibt die verbale Grundbedeutung wieder und erhält das Passiv. Zugleich bleibt der messianische Ankündigungscharakter bestehen, ohne die Formulierung unnötig zu einem kirchlichen Fachbegriff zu verengen.
- issue: Messianische Erfüllung in der Aufzählung
  choice: Die Taten werden ohne ergänzende Erfüllungsformel wiedergegeben
  alternative: Eine ausdrückliche Formulierung wie „damit erfüllt sich Jesaja“
  rationale: Die Aussagen greifen deutlich Jesaja 35,5–6 und 61,1 auf, doch der griechische Vers selbst fügt keine ausdrückliche Erfüllungsformel hinzu. Die Übersetzung lässt den Anklang bestehen, ohne Kommentar in den Haupttext einzutragen.
translation_notes:
  register: Knappe, rhythmische Reihung in modernem, würdigem Standarddeutsch. Die parallelen Präsensformen und Passivkonstruktionen des griechischen Textes bleiben soweit natürlich möglich erhalten. „Aussätzige“ folgt dem antiken Sammelbegriff; er ist nicht ohne Weiteres mit der heutigen medizinischen Diagnose Lepra gleichzusetzen.
