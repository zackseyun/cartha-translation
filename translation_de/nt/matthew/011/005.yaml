revisions:
- from: Blinde werden sehend und Gelähmte gehen, Aussätzige werden rein und Taube hören, Tote werden auferweckt und Armen wird die gute Nachricht verkündet.[a][b]
  to: Blinde werden sehend, Menschen mit einer Gehbehinderung gehen, Menschen mit Aussatz werden rein, Taube hören, Tote werden auferweckt, und den Armen wird die gute Nachricht verkündet.[a][b]
  rationale: Die Änderungen beseitigen die unzulässige Einengung von χωλοί auf Lähmung und wählen für λεπροί eine modernere Personenbezeichnung, ohne den historischen Befund einer breiteren antiken Kategorie als der heutigen Diagnose Lepra zu verwischen. Die knappe Aufzählungsform, die passive Perspektive bei εὐαγγελίζονται und die Anspielung auf Jesaja bleiben erhalten. Fußnote a erklärt nun korrekt die grammatische Form und bietet die fachsprachlichere Alternative ohne sie dem Haupttext aufzuzwingen.
