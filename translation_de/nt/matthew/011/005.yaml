  terminology: „Rein werden“ bewahrt bei καθαρίζονται die körperliche und kultische Dimension. „Die gute Nachricht“ für εὐαγγελίζονται bewahrt den Bezug zum Evangelium und die passive Empfängerrolle. „Auferweckt“ ist für ἐγείρονται angemessen. Die Jesaja-Notiz ist sachlich und führt keine zusätzliche Aussage in den Haupttext ein.
