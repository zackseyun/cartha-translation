- from: 'Zu jener Zeit ergriff Jesus das Wort und sagte: „Ich preise dich[a], Vater, Herr des Himmels und der Erde, weil du dies vor Weisen und Verständigen verborgen und es Unmündigen[b] offenbart hast.“'
  to: 'Zu jener Zeit antwortete Jesus: „Ich preise dich[a], Vater, Herr des Himmels und der Erde, weil du dies vor Weisen und Verständigen verborgen und es kleinen Kindern[b] offenbart hast.“'
  rationale: Die Revision gibt die Antwortformel mit natürlichem deutschem „antwortete“ wieder und ersetzt das im modernen Deutsch missverständliche „Unmündigen“ durch „kleinen Kindern“. Die Metapher, die Offenheit ihres Bezugs und die aktive Zuschreibung des Verbergens und Offenbarens an den Vater bleiben erhalten.
