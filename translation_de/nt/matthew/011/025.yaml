    rationale: „Das Wort ergreifen“ gibt einen Redebeginn wieder, nicht die Antwortnuance von ἀποκριθεὶς. Die nachfolgende Ergänzung „und sagte“ ist im Deutschen zudem stilistisch redundant. „Jesus antwortete:“ erhält die relevante Erzählfunktion ohne künstliche Verdoppelung.
  - severity: medium
    issue: „Unmündigen“ für νηπίοις
    rationale: Im heutigen Deutsch ist „unmündig“ überwiegend rechtlich bzw. sozial-statusbezogen. Das griechische Wort bezeichnet wörtlich kleine Kinder bzw. Säuglinge und ist hier wahrscheinlich metaphorisch. „Kleinen Kindern“ bewahrt das Bild, ohne seine Bedeutung theologisch auszudeuten.
