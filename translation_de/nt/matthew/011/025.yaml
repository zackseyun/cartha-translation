  source_fidelity: 'Die direkte Anrede, die kausale Begründung sowie Gottes aktives Verbergen und Offenbaren sind sachgerecht wiedergegeben. „Ergriff Jesus das Wort und sagte“ bildet die Formel ἀποκριθεὶς ... εἶπεν jedoch nicht präzise ab: Es verschiebt „antwortete“ zu einem bloßen Redebeginn und fügt mit „und sagte“ eine im Deutschen unnötige Doppelung ein. „Unmündigen“ ist zwar traditionssprachlich möglich, bezeichnet im modernen Deutsch vor allem Minderjährige bzw. Personen ohne volle Geschäftsfähigkeit und verdeckt das konkrete kindliche Bild von νηπίοις.'
  naturalness: Der Satz ist insgesamt würdig und gut verständlich. „Jesus antwortete:“ ist in modernem Standarddeutsch knapp, idiomatisch und als erzählerische Formel auch ohne ausdrücklich vorangehende Frage möglich. „Kleinen Kindern“ ist natürlicher als „Unmündigen“ und bewahrt die Bildsprache.
  terminology: „Vater, Herr des Himmels und der Erde“, „preise dich“, „verborgen“ und „offenbart“ sind treffend und registergerecht. Für νηπίοις ist „kleinen Kindern“ die sichere Hauptwiedergabe; die mögliche engere Bedeutung „Säuglingen“ gehört in die Fußnote.
