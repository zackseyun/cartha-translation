source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: de
  text: 'Zu jener Zeit antwortete Jesus: „Ich preise dich[a], Vater, Herr des Himmels und der Erde, weil du dies vor Weisen und Verständigen verborgen und es kleinen Kindern[b] offenbart hast.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich danke dir.“ Das griechische Verb kann Dank, Lob und offenes Anerkennen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Säuglingen“. Die Bezeichnung ist hier wahrscheinlich bildhaft gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Zu jener Zeit
  rationale: Die Wendung gibt die zeitliche Einordnung idiomatisch wieder, ohne einen bestimmten Augenblick überzubetonen.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ergriff Jesus das Wort und sagte
  rationale: Die Wiedergabe bewahrt den Charakter der griechischen Antwortformel, klingt aber auch ohne unmittelbar vorausgehende Frage im Deutschen natürlich.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Ich preise dich
  rationale: Im Gebet an den Vater bezeichnet das Verb hier ein offenes, von Lob und Dank geprägtes Anerkennen. „Ich preise dich“ wahrt den doxologischen Ton, ohne an ein Sündenbekenntnis denken zu lassen.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Vater, Herr des Himmels und der Erde
  rationale: Die doppelte Anrede und die Aussage über Gottes Herrschaft werden unmittelbar und in geläufiger biblischer Sprache wiedergegeben.
- source_word: ὅτι
  choice: weil
  rationale: Die Konjunktion führt hier den Grund für Jesu Lob ein; „weil“ macht diesen kausalen Zusammenhang klar.
- source_word: ἔκρυψας
  choice: du ... verborgen ... hast
  rationale: Die aktive Form und Gottes unmittelbare Urheberschaft bleiben erhalten. „Verborgen“ ist in diesem Zusammenhang natürlicher als „versteckt“.
- source_word: ταῦτα ... αὐτά
  choice: dies ... es
  rationale: Die offenen Rückbezüge des Griechischen bleiben gewahrt, ohne ihren Inhalt erklärend festzulegen.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: vor Weisen und Verständigen
  rationale: Die substantivisch gebrauchten Adjektive und ihre Paarung bleiben erhalten. Bei „verbergen“ ist „vor“ die idiomatische deutsche Präposition.
- source_word: ἀπεκάλυψας
  choice: offenbart hast
  rationale: „Offenbaren“ gibt die göttliche Enthüllung prägnant wieder und bewahrt den theologischen Klang des Verbs.
- source_word: νηπίοις
  choice: Unmündigen
  rationale: Das Wort kann kleine Kinder oder Säuglinge bezeichnen, wird hier jedoch im Kontrast zu den Weisen und Verständigen bildhaft gebraucht. „Unmündige“ erhält sowohl den Gegensatz als auch die Metapher, ohne sie als „Demütige“ auszudeuten.
theological_decisions:
- issue: Göttliches Handeln beim Verbergen und Offenbaren
  choice: 'Die direkte Zuschreibung an den Vater bleibt erhalten: „du ... verborgen und ... offenbart hast“'
  alternative: Abschwächende Wiedergabe wie „du hast zugelassen, dass dies verborgen blieb“
  rationale: Beide griechischen Verben stehen aktiv mit Gott als Subjekt. Die Übersetzung bewahrt diese theologische Spannung, ohne sie durch eine Aussage über Zulassung, Vorherbestimmung oder Verstockung zu erklären.
- issue: Bedeutung von νηπίοις
  choice: Bildhafte Wiedergabe mit „Unmündigen“
  alternative: Wörtlicher „Säuglingen“ oder deutender „Demütigen“
  rationale: Der Ausdruck stellt die Empfänger der Offenbarung den Weisen und Verständigen gegenüber. „Unmündige“ erhält das kindbezogene Bild und legt dessen genaue theologische Bedeutung nicht abschließend fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, vermeidet jedoch die im Deutschen ohne ausdrückliche Frage unnatürliche Formel „antwortete und sagte“. „Unmündige“ ist bewusst bildhaft und wird durch eine Fußnote erläutert.
