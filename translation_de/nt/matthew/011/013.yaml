id: MAT.11.13
reference: Matthew 11:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: de
  text: Denn alle Propheten und das Gesetz haben bis zu Johannes[a] prophezeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis hin zu Johannes“ oder „bis zur Zeit des Johannes“. Die Wendung kann Johannes als Höhepunkt des prophetischen Zeugnisses verstehen lassen oder als zeitliche Grenze, die einen Übergang markiert.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: alle
  rationale: Das Wort bezieht sich attributiv auf die gesamte Gruppe der Propheten; „alle“ ist im Deutschen die natürliche Entsprechung.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage und wird mit „denn“ knapp und idiomatisch wiedergegeben.
- source_word: οἱ προφῆται
  choice: die Propheten
  rationale: Dies ist die übliche und kontextgerechte Bezeichnung für Menschen, die im Auftrag Gottes prophetisch sprechen.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Gemeint ist die Tora als anerkannter Teil der Schrift, nicht Gesetz im allgemeinen Sinn. Die Großschreibung kennzeichnet diesen Bezug im Deutschen.
- source_word: ἕως Ἰωάννου
  choice: bis zu Johannes
  rationale: Die Wendung bezeichnet eine zeitliche Grenze. „Bis zu Johannes“ bewahrt die Offenheit, ob Johannes als Höhepunkt einbezogen ist oder den Übergang markiert.
- source_word: ἐπροφήτευσαν
  choice: haben prophetisch geredet
  rationale: Die Form ist Aorist Aktiv Indikativ von προφητεύω. Die Wendung klingt im modernen Deutsch natürlicher als „haben geweissagt“ und bewahrt zugleich die auffällige Aussage, dass sowohl die Propheten als auch das Gesetz prophetisch redeten.
theological_decisions:
- issue: Ob ὁ νόμος allgemein oder als Bezeichnung eines Schriftteils zu verstehen ist
  choice: das Gesetz
  alternative: das gesetzliche Gebot / das Gesetz im allgemeinen Sinn
  rationale: Die Verbindung mit „allen Propheten“ weist auf den anerkannten Schriftbestand Israels, insbesondere die Tora. Die Wiedergabe fügt keine konfessionelle Deutung hinzu.
- issue: Ob ἕως Ἰωάννου Johannes in die prophetische Epoche einbezieht oder nur deren Endpunkt bezeichnet
  choice: bis zu Johannes
  alternative: bis zur Zeit des Johannes
  rationale: Der griechische Ausdruck entscheidet diese Frage nicht eindeutig. Die knappe Grenzformulierung erhält die exegetische Spannung.
- issue: Personifizierende Aussage über das Gesetz
  choice: Propheten und Gesetz sind gemeinsam Subjekt von „haben prophetisch geredet“
  alternative: Die Propheten haben geweissagt, und das Gesetz hat auf Johannes hingewiesen
  rationale: Die gemeinsame Verbform im Griechischen wird beibehalten, statt die Aussage erklärend aufzuteilen oder theologisch zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Prophetisch geredet“ vermeidet das heute teils missverständliche „weissagen“ und lässt die Personifizierung des Gesetzes bestehen.
