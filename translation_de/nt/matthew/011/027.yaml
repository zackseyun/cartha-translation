source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: de
  text: Alles ist mir von meinem Vater übergeben worden. Niemand kennt[a] den Sohn außer dem Vater, und niemand kennt den Vater außer dem Sohn und jedem, dem der Sohn ihn offenbaren will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erkennt wirklich“ bzw. „kennt genau“; das griechische Verb kann eine eingehende oder volle Erkenntnis bezeichnen. Dies gilt auch für die zweite Aussage über das Kennen des Vaters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Alles
  rationale: Das substantivierte Neutrum Plural hat umfassenden Sinn; „Alles“ ist im Deutschen natürlich und lässt den genauen Umfang wie der griechische Text offen.
- source_word: παρεδόθη
  choice: ist … übergeben worden
  rationale: Das Aoristpassiv bezeichnet eine vollzogene Übergabe durch den Vater. Das deutsche Perfektpassiv gibt den abgeschlossenen Vorgang und seine fortbestehende Bedeutung natürlich wieder.
- source_word: ἐπιγινώσκει
  choice: kennt
  rationale: ἐπιγινώσκω kann je nach Kontext eingehendes oder volles Erkennen bezeichnen, trägt die Verstärkung gegenüber γινώσκω jedoch nicht mechanisch in jedem Vorkommen. „Kennt“ wahrt hier die gegenseitige personale Erkenntnis und vermeidet eine unbelegte Explizierung; eine Fußnote nennt die mögliche stärkere Nuance.
- source_word: εἰ μὴ
  choice: außer
  rationale: Nach der Verneinung bezeichnet εἰ μή eine ausschließende Ausnahme; „außer“ bildet die parallelen Aussagen knapp und idiomatisch ab.
- source_word: ᾧ ἐὰν βούληται
  choice: jedem, dem … will
  rationale: Die generalisierende Relativkonstruktion bezeichnet jeden, den der Sohn zum Empfänger der Offenbarung machen will. „Will“ bewahrt seine volitionale Initiative, ohne zwischen Wollen, Wünschen und Entscheiden enger festzulegen als der Kontext.
- source_word: ἀποκαλύψαι
  choice: offenbaren
  rationale: „Offenbaren“ ist die sachlich und theologisch passende Wiedergabe für das Zugänglichmachen zuvor verborgener Erkenntnis.
theological_decisions:
- issue: Bedeutungsstärke von ἐπιγινώσκω in den beiden Erkenntnisaussagen
  choice: Im Haupttext „kennt“, mit Fußnote zur möglichen stärkeren Nuance
  alternative: „kennt vollständig“ oder „erkennt wirklich“
  rationale: Das Präfix kann eine intensivere oder eingehendere Erkenntnis nahelegen, erzwingt aber nicht stets eine ausdrückliche Verstärkung. Der uneingeschränkt exklusive Satzbau vermittelt bereits die einzigartige gegenseitige Erkenntnis von Vater und Sohn. Die Fußnote bewahrt die lexikalische Möglichkeit, ohne sie dogmatisch festzuschreiben.
- issue: Willensinitiative des Sohnes bei der Offenbarung
  choice: „dem der Sohn ihn offenbaren will“
  alternative: „dem der Sohn ihn zu offenbaren beschließt“
  rationale: βούληται schreibt dem Sohn eine echte Willensentscheidung zu. „Will“ ist modern, klar und lässt die Spannung zwischen souveräner Initiative und dem nicht näher beschriebenen Empfängerkreis bestehen.
- issue: Bezugswort des unausgesprochenen Objekts bei ἀποκαλύψαι
  choice: Das im Deutschen ergänzte „ihn“ bezieht sich auf den Vater
  alternative: „den Vater offenbaren“
  rationale: Der unmittelbare Satzbau macht den Vater zum Gegenstand der Offenbarung. Das Pronomen stellt dies idiomatisch dar, ohne zusätzliche Erklärung in den Haupttext einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vater“ und „Sohn“ erscheinen als relationale Titel, ohne dass im Deutschen eine typografische Sondermarkierung nötig ist. Die parallele Satzstruktur bleibt erhalten; „und jedem, dem“ ist idiomatisch und bewahrt den offenen Empfängerkreis.
