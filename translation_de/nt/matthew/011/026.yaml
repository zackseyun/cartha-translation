  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: de
  text: Ja[a], Vater, denn so hat es dir gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ja, Vater, denn dies war wohlgefällig vor dir.“ Auch möglich: „Ja, Vater, denn so war es dein Wohlgefallen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Ja
  rationale: Gibt die bekräftigende Zustimmung im Gebetszusammenhang unmittelbar und natürlich wieder.
- source_word: ὁ πατήρ
  choice: Vater
  rationale: Der artikulierte Nominativ fungiert hier als Anrede; „Vater“ ist im modernen Deutschen natürlich und würdig.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung der Zustimmung ein und fügt sich im Deutschen idiomatisch an „Ja, Vater“ an.
- source_word: οὕτως
  choice: so
  rationale: Verweist auf die unmittelbar zuvor beschriebene Weise des Verbergens und Offenbarens, ohne sie näher auszudeuten.
- source_word: εὐδοκία ἐγένετο
  choice: hat es gefallen
  rationale: Die deutsche Wendung gibt den idiomatischen Sinn des nominalen Ausdrucks natürlich wieder und bewahrt den Schwerpunkt auf dem Wohlgefallen, ohne daraus ausdrücklich einen Ratschluss oder Zweck zu machen.
- source_word: ἔμπροσθέν σου
  choice: dir
  rationale: Im Deutschen verlangt die idiomatische Wendung „jemandem gefallen“ den Dativ; damit wird die Ausrichtung auf den Vater natürlich ausgedrückt, auch wenn die räumliche Metapher „vor dir“ nicht wörtlich erhalten bleibt.
theological_decisions:
- issue: Ob εὐδοκία einen göttlichen Ratschluss/Zweck oder göttliches Wohlgefallen bezeichnet
  choice: „so hat es dir gefallen“ betont das Wohlgefallen des Vaters
  alternative: „so war es dein guter Wille“ / „so entsprach es deinem guten Ratschluss“
  rationale: Der griechische Ausdruck bezeichnet hier das, was vor dem Vater wohlgefällig ist. Die Übersetzung vermeidet eine unnötige Festlegung auf einen stärker dekretalen Sinn und lässt die weitere theologische Spannung offen.
- issue: Bezug und Funktion von ὅτι
  choice: kausal als „denn“
  alternative: inhaltlich als „dass“
  rationale: Im Zusammenhang begründet der folgende Satz am natürlichsten Jesu bekräftigendes „Ja“. Die Fußnote weist auf die eng verbundene alternative Gesamtfassung hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung ist idiomatisch und knapp; die Fußnote bewahrt formalere Möglichkeiten für εὐδοκία ἐγένετο ἔμπροσθέν σου.
