  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die rhythmische Parallelität der beiden Spielrufe bleibt erhalten; die konkrete antike Trauergeste wird im Haupttext bewahrt und in der Fußnote erläutert.
