  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: de
  text: 'Sie sagen: »Wir haben für euch Flöte gespielt, und ihr habt nicht getanzt; wir haben ein Klagelied angestimmt, und ihr habt euch nicht an die Brust geschlagen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihr habt euch nicht geschlagen«; gemeint ist eine damals übliche Trauergeste, etwa das Schlagen an die Brust.'
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Sie sagen
  rationale: Das Präsens führt die Klage der Kinder innerhalb des Vergleichs lebendig ein.
- source_word: Ηὐλήσαμεν
  choice: Wir haben für euch Flöte gespielt
  rationale: αὐλέω bezeichnet ausdrücklich das Spielen einer Flöte oder Pfeife; die Formulierung ist im modernen Deutschen natürlich und erhält den instrumentalen Sinn.
- source_word: ὑμῖν
  choice: für euch
  rationale: Der Dativ bezeichnet hier die Personen, für die gespielt wird; »für euch« gibt die gerichtete Darbietung idiomatisch wieder.
- source_word: ὠρχήσασθε
  choice: ihr habt nicht getanzt
  rationale: Die mediale Form wird hier im Deutschen natürlich mit dem einfachen Verb »tanzen« wiedergegeben.
- source_word: ἐθρηνήσαμεν
  choice: wir haben ein Klagelied angestimmt
  rationale: θρηνέω bezeichnet klagendes, besonders mit Trauer und Bestattung verbundenes Singen; »ein Klagelied angestimmt« wahrt die performative Parallele zum Flötenspiel.
- source_word: ἐκόψασθε
  choice: ihr habt euch nicht an die Brust geschlagen
  rationale: κόπτω im Medium bezeichnet in diesem Zusammenhang eine körperliche Trauergeste. Die konkrete Wiedergabe bewahrt das anschauliche Bild des griechischen Textes.
theological_decisions: []
