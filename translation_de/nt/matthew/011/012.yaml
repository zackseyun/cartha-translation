source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: de
  text: Doch von den Tagen Johannes des Täufers bis jetzt wird dem Himmelreich Gewalt angetan, und Gewalttätige reißen es an sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Himmelreich bahnt sich kraftvoll seinen Weg, und kraftvolle Menschen ergreifen es.“ Das griechische Verb, das mit „wird Gewalt angetan“ wiedergegeben ist, kann auch medial verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Doch von
  rationale: ἀπό bezeichnet den zeitlichen Ausgangspunkt, während δέ einen leichten Übergang oder Gegensatz markiert. „Doch von“ bewahrt beides, ohne den Kontrast zu verstärken.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: den Tagen Johannes des Täufers
  rationale: Die Formulierung gibt die Genitivkonstruktion und das griechische Zeitidiom eng, aber in würdigem, verständlichem Deutsch wieder.
- source_word: ἕως ἄρτι
  choice: bis jetzt
  rationale: Natürliche und genaue Wiedergabe des Zeitraums bis zur Gegenwart des Sprechers.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: „Himmelreich“ ist die etablierte, prägnante deutsche Wiedergabe der für Matthäus charakteristischen Wendung und bezeichnet Gottes vom Himmel bestimmte Königsherrschaft beziehungsweise deren Bereich.
- source_word: βιάζεται
  choice: wird Gewalt angetan
  rationale: Die passive Wiedergabe entspricht einer gut begründeten Deutung der mehrdeutigen medial-passiven Form und steht in engem Zusammenhang mit den nachfolgenden Gewalttätigen. Die mögliche mediale Bedeutung wird in der Fußnote bewahrt.
- source_word: βιασταὶ
  choice: Gewalttätige
  rationale: Das substantivierte Adjektiv bezeichnet Personen, die Gewalt anwenden. „Gewalttätige“ ist im Deutschen knapp, natürlich und lässt die grammatische Maskulinform erkennen, ohne unnötig „Männer“ zu ergänzen.
- source_word: ἁρπάζουσιν αὐτήν
  choice: reißen es an sich
  rationale: Die Wendung bringt das gewaltsame Ergreifen von ἁρπάζω idiomatisch und deutlich zum Ausdruck.
theological_decisions:
- issue: Deutung von βιάζεται in Bezug auf das Himmelreich
  choice: 'Passive Bedeutung im Haupttext: „dem Himmelreich wird Gewalt angetan“'
  alternative: 'Mediale/intransitive Bedeutung: „das Himmelreich bahnt sich kraftvoll seinen Weg“'
  rationale: Die griechische Form ist tatsächlich mehrdeutig. Die passive Lesart passt gut zu den anschließend genannten Gewalttätigen; die mediale Lesart ist jedoch sprachlich und auslegungsgeschichtlich ebenfalls vertretbar und wird deshalb ausdrücklich in einer Fußnote erhalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Bibelregister. Der Satzbau bleibt nahe am Griechischen; die echte Mehrdeutigkeit von βιάζεται wird nicht im Haupttext nivelliert, sondern durch eine alternative Lesart in der Fußnote offengehalten.
