  naturalness: Die revidierte Formulierung »In dem Maß, in dem ...« ist modernes, gut verständliches Standarddeutsch und wahrt zugleich die im Griechischen ausgedrückte Gradbestimmung. »Diesen meinen geringsten Brüdern« ist im würdigen Register des Verses natürlich.
  terminology: »König«, »Amen«, »Brüdern« und »geringsten« bewahren die maßgeblichen Begriffe und den maskulinen Plural von ἀδελφῶν. Die Fußnote erläutert die umstrittene Referenz, ohne sie im Text festzulegen.
