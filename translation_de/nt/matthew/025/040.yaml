source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: de
  text: 'Und der König wird ihnen antworten: »Amen, ich sage euch: In dem Maß, in dem ihr es einem von diesen meinen geringsten Brüdern getan habt,[a] habt ihr es mir getan.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wer mit »diesen meinen geringsten Brüdern« genau gemeint ist, bleibt umstritten: Jesu Jünger oder Boten, Glaubende allgemein oder umfassender Bedürftige und Schutzlose.'
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς
  choice: Und der König wird ihnen antworten
  rationale: Das vorangestellte Aoristpartizip ἀποκριθείς und das finite Futur ἐρεῖ bilden zusammen die natürliche Redeformel »wird ihnen antworten«. So bleibt der responsive Sinn erhalten, ohne im Deutschen hölzern »antwortend wird er sagen« zu formulieren.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: »Amen« bewahrt die markante, feierliche Formel Jesu und ist im Deutschen verständlich. Die Wortstellung folgt dem Griechischen eng.
- source_word: ἐφ’ ὅσον
  choice: Was immer
  rationale: Im gegebenen Zusammenhang bezeichnet die Wendung das, was an einem Einzelnen getan wurde. »Was immer« ist idiomatisches heutiges Deutsch und bewahrt die Offenheit hinsichtlich der jeweiligen Tat; die stärker graduelle Wiedergabe »insofern als« bleibt als Fußnotenalternative erhalten.
- source_word: ἐποιήσατε
  choice: getan habt
  rationale: Das griechische Aorist wird in deutscher Rückschau innerhalb der direkten Rede natürlich mit dem Perfekt wiedergegeben. Die Wiederholung in beiden Satzhälften erhält den Nachdruck des Originals.
- source_word: ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: einem von diesen meinen geringsten Brüdern
  rationale: »Einem« bewahrt die individualisierende Kraft von ἑνί; »diesen meinen ... Brüdern« erhält Demonstrativ, Zugehörigkeit und den ausdrücklich maskulinen Plural. »Geringsten« lässt soziale Stellung, Bedeutung und Ansehen offen, ohne auf Körpergröße oder eine bestimmte Art von Bedürftigkeit einzuengen.
- source_word: ἐμοὶ ἐποιήσατε
  choice: das habt ihr mir getan
  rationale: Das ergänzte »das« schafft im Deutschen eine klare Rückbindung an die zuvor genannte Tat. »Mir« gibt den Dativ direkt wieder und bewahrt die zugespitzte Identifikation mit dem König.
theological_decisions:
- issue: Bezugsgruppe von »diesen meinen geringsten Brüdern«
  choice: Die konkrete Formulierung des Griechischen bleibt stehen, ohne die Bezugsgruppe näher festzulegen.
  alternative: Ausdrückliche Deutung als Jesu Jünger oder Boten, als Glaubende allgemein oder als Bedürftige und Schutzlose insgesamt.
  rationale: Der Vers benennt die Gruppe nicht über die Formulierung hinaus eindeutig. Eine präzisierende Übersetzung würde eine umstrittene Auslegung in den Text eintragen.
- issue: Geschlechtliche Wiedergabe von ἀδελφῶν
  choice: Brüdern
  alternative: Brüdern und Schwestern; Geschwistern
  rationale: Der griechische Ausdruck steht ausdrücklich im maskulinen Plural. Da zudem umstritten ist, wer genau gemeint ist, vermeidet die Übersetzung eine auslegende Erweiterung oder Neutralisierung.
- issue: Identität des Königs
  choice: König als Titel im Satz, ohne zusätzliche Identifikation
  alternative: Explizite Wiedergabe als Christus oder Menschensohn
  rationale: Der Kontext verbindet den König mit dem endzeitlichen Richter, doch der Vers selbst verwendet ὁ βασιλεύς. Die Übersetzung bewahrt diesen Titel und fügt keine erklärende Identifikation in den Text ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. »Amen« erhält die charakteristische Redeformel; »geringsten Brüdern« bewahrt sowohl die sprachliche Gestalt als auch die offene Auslegungsfrage. Der einzige Fußnotenmarker [a] steht im Haupttext.
