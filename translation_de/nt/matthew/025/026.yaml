  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: de
  text: 'Doch sein Herr antwortete ihm: »Du böser und fauler Sklave,[a] du wusstest, dass ich ernte, wo ich nicht gesät habe, und einsammle, wo ich nicht ausgestreut habe?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du böser und fauler Diener!« Das griechische Wort *doulos* kann je nach Zusammenhang »Sklave« oder »Diener« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Satz kann auch als Feststellung verstanden werden: »Du wusstest, dass ich ernte, wo ich nicht gesät habe, und einsammle, wo ich nicht ausgestreut habe.«'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Doch … antwortete
  rationale: Die geläufige Erzählformel wird in natürlichem Deutsch wiedergegeben; »doch« bewahrt den leicht gegensätzlichen Anschluss an die Rede des Sklaven.
- source_word: ὁ κύριος αὐτοῦ
  choice: sein Herr
  rationale: Im Gleichnis bezeichnet κύριος den Herrn eines Sklaven. »Herr« bildet die soziale Beziehung ab, ohne die Stelle unmittelbar als christologischen Titel festzulegen.
- source_word: Πονηρὲ
  choice: böser
  rationale: Das Wort enthält hier ein moralisches Urteil; »böse« gibt diese ethische Schärfe in aktuellem Deutsch wieder.
- source_word: δοῦλε
  choice: Sklave
  rationale: δοῦλος bezeichnet in diesem hierarchischen Besitz- und Haushaltsverhältnis am unmittelbarsten einen Sklaven. Die traditionell mildere Wiedergabe »Diener« bleibt als Fußnotenalternative erhalten.
- source_word: ὀκνηρέ
  choice: fauler
  rationale: ὀκνηρός bezeichnet Trägheit beziehungsweise mangelnde Bereitschaft zu handeln; »faul« ist klar und gegenwärtig.
- source_word: ᾔδεις
  choice: Du wusstest also
  rationale: Die Form von οἶδα bezeichnet vorhandenes Wissen. »Also« signalisiert im Deutschen den ironisch-rhetorischen Rückgriff auf die Behauptung des Sklaven, ohne die Mehrdeutigkeit der Zeichensetzung zu verbergen.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: ich ernte, wo ich nicht gesät habe
  rationale: Die landwirtschaftliche Bildsprache und der Gegensatz von Ernten und Säen bleiben unmittelbar erhalten.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: einsammle, wo ich nicht ausgestreut habe
  rationale: »Einsammeln« passt zur Erntebildsprache. Das nicht ausdrücklich genannte Objekt von διεσκόρπισα wird nicht ergänzt; dadurch bleibt die knappe Ausdrucksweise des Griechischen gewahrt.
theological_decisions:
- issue: Aussage oder rhetorische Frage in der Rede des Herrn
  choice: Als rhetorische Frage mit Fragezeichen wiedergegeben
  alternative: 'Als Feststellung: »Du wusstest, dass ich ernte, wo ich nicht gesät habe, und einsammle, wo ich nicht ausgestreut habe.«'
  rationale: Der griechische Wortlaut enthält kein eigenes Fragezeichen und lässt beide Lesarten zu. Die rhetorische Frage passt dazu, dass der Herr die Behauptung des Sklaven aus dem vorigen Vers gegen ihn wendet; die Aussage-Lesart wird in der Fußnote ausdrücklich bewahrt.
- issue: Bezeichnung des δοῦλος
  choice: Sklave
  alternative: Diener
  rationale: Der soziale Rahmen des Gleichnisses spricht für »Sklave«; zugleich kann »Diener« funktional verstanden werden und ist als traditionelle, lexikalisch mögliche Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt kräftig und verständlich. »Ausgestreut« lässt das im Griechischen nicht genannte Objekt offen; der landwirtschaftliche Zusammenhang macht die Bedeutung dennoch erkennbar.
