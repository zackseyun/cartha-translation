  text: ⸀ὡσαύτως ὁ τὰ δύο ⸀ἐκέρδησεν ἄλλα δύο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/017.yaml
  text: Likewise[a], the one with the two gained two more.
translation:
  language: de
  text: Ebenso gewann der mit den zwei Talenten zwei weitere hinzu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Genauso gewann der, der die zwei Talente erhalten hatte, zwei weitere hinzu.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Das Adverb verknüpft das Handeln dieses Dieners mit dem des vorherigen Dieners in Vers 16 und bewahrt knapp die vergleichende Bedeutung.
- source_word: ὁ τὰ δύο
  choice: der mit den zwei
  rationale: Die elliptische griechische Wendung bezeichnet den Diener anhand der zwei Talente aus dem Zusammenhang. Die deutsche Formulierung bewahrt diese Ellipse, ohne ausdrücklich »Talente« oder »empfangen hatte« zu ergänzen.
- source_word: ἐκέρδησεν
  choice: gewann ... dazu
  rationale: Das Verb bezeichnet hier den erfolgreichen Zugewinn im finanziellen Zusammenhang. »Dazugewinnen« ist natürlich und vermeidet die bei »verdienen« mögliche Vorstellung eines Arbeitslohns.
- source_word: ἄλλα δύο
  choice: weitere zwei
  rationale: Die Wendung bezeichnet zwei zusätzliche Einheiten derselben Art; »weitere zwei« gibt dies klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die im Griechischen vorhandene Ellipse bleibt im Haupttext erhalten; die kontextuell mögliche Ausfüllung steht in der Fußnote.
