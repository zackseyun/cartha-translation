id: MAT.25.31
reference: Matthew 25:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: de
  text: Wenn aber der Menschensohn in seiner Herrlichkeit kommt und alle Engel mit ihm, dann wird er sich auf den Thron seiner Herrlichkeit[a] setzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf seinen herrlichen Thron“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Wenn aber
  rationale: Ὅταν leitet hier ein zukünftiges, einmaliges Geschehen ein; „wenn“ ist dafür im Deutschen natürlich. δέ markiert einen leichten Übergang beziehungsweise Gegensatz und wird mit „aber“ wiedergegeben.
- source_word: ἔλθῃ
  choice: kommt
  rationale: Der Aorist Konjunktiv nach ὅταν bezeichnet ein zukünftiges Ereignis. Im deutschen wenn-Satz steht idiomatisch das Präsens.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt den Titelcharakter und den Anklang an Daniel 7.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: in seiner Herrlichkeit
  rationale: „Herrlichkeit“ gibt die sichtbar hervortretende Majestät und Ehre wieder und bewahrt den biblischen Sprachklang.
- source_word: πάντες οἱ ἄγγελοι
  choice: alle Engel
  rationale: Der griechische Text enthält an dieser Stelle kein Possessivpronomen; deshalb wird kein „seine“ ergänzt.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: Die schlichte Formulierung gibt die begleitende Gemeinschaft unmittelbar und natürlich wieder.
- source_word: τότε
  choice: dann
  rationale: „Dann“ kennzeichnet knapp die zeitliche Folge.
- source_word: καθίσει
  choice: wird er sich … setzen
  rationale: Das aktive Verb bezeichnet hier das Einnehmen des Sitzes. „Sich setzen“ ist im Deutschen natürlicher und genauer als das möglicherweise statisch verstandene „sitzen“.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: auf den Thron seiner Herrlichkeit
  rationale: 'Die formal nahe Wiedergabe bewahrt die Genitivverbindung und ihre mögliche Bedeutungsweite: Der Thron kann durch seine Herrlichkeit gekennzeichnet sein oder als Schauplatz beziehungsweise Ausdruck seiner Herrlichkeit verstanden werden.'
theological_decisions:
- issue: Christologischer Titel ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: Der traditionelle Titel bewahrt die Verbindung zu Daniel 7 sowie seine messianische und richterliche Bedeutung, ohne sie paraphrasierend festzulegen.
- issue: Genitivverbindung θρόνου δόξης αὐτοῦ
  choice: der Thron seiner Herrlichkeit
  alternative: sein herrlicher Thron
  rationale: Die wörtlichere Genitivkonstruktion erhält die genuine semantische Offenheit und klingt im würdevollen modernen Deutsch verständlich. Die idiomatischere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt nah am griechischen Satz, ohne unnatürlich zu wirken. Der bestimmte Artikel bei „den Thron“ ist im Deutschen durch das Possessivverhältnis und den gemeinten einzigartigen Königsthron idiomatisch.
