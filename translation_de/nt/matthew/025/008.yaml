source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: de
  text: 'Die Törichten aber sagten zu den Klugen: »Gebt uns etwas von eurem Öl, denn unsere Lampen[a] gehen aus.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fackeln«. Das griechische Wort λαμπάδες kann tragbare Lichtquellen verschiedener Art bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: die törichten
  rationale: Das substantivierte Adjektiv bezeichnet die törichten jungen Frauen der Erzählung und bewahrt den direkten Gegensatz zu φρονίμοις.
- source_word: φρονίμοις
  choice: den klugen
  rationale: φρόνιμος meint hier praktische Klugheit und vorausschauende Bereitschaft; »klug« ist im Deutschen natürlich und hält den Kontrast zu »töricht« aufrecht.
- source_word: Δότε
  choice: Gebt
  rationale: Der Aoristimperativ Plural wird als unmittelbare Aufforderung wiedergegeben.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: etwas von eurem Öl
  rationale: 'ἐκ mit Genitiv hat hier partitiven Sinn: Erbeten wird ein Teil ihres Ölvorrats.'
- source_word: λαμπάδες
  choice: Lampen
  rationale: λαμπάς kann eine Lampe oder Fackel bezeichnen. »Lampen« passt zum erwähnten Öl und ist in diesem Gleichnis die geläufige deutsche Wiedergabe; die mögliche Alternative wird in einer Fußnote bewahrt.
- source_word: σβέννυνται
  choice: gehen aus
  rationale: Die Präsensform beschreibt einen bereits einsetzenden Vorgang; »gehen aus« gibt dies idiomatisch wieder.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt den Grund für die Bitte an. »Denn« wahrt den kausalen Zusammenhang in natürlichem, erzählerischem Deutsch.
