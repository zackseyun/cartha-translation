source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: de
  text: 'Doch um Mitternacht ertönte ein Ruf: »Seht, der Bräutigam! Geht hinaus, ihm entgegen!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Doch um Mitternacht
  rationale: Die Genitivverbindung bezeichnet idiomatisch den Zeitpunkt »um Mitternacht«; δέ wird als leichter, hier kontrastierender Erzählübergang mit »doch« wiedergegeben.
- source_word: κραυγὴ γέγονεν
  choice: ertönte ein Ruf
  rationale: Die Wendung beschreibt das plötzliche Einsetzen eines lauten Rufs. »Ertönte ein Ruf« ist im Deutschen natürlich und bewahrt den Ereignischarakter.
- source_word: Ἰδού
  choice: Seht
  rationale: Der deiktische Aufmerksamkeitsruf wird mit dem gegenwärtigen und würdigen »Seht« wiedergegeben, ohne auf das altertümlichere »Siehe« zurückzugreifen.
- source_word: ὁ νυμφίος
  choice: der Bräutigam
  rationale: νυμφίος bezeichnet im Hochzeitszusammenhang spezifisch den Bräutigam und erhält das Bild der Erzählung.
- source_word: ἐξέρχεσθε
  choice: Geht hinaus
  rationale: Der Imperativ fordert die Hörenden auf, ihren Aufenthaltsort zu verlassen. »Geht hinaus« entspricht der räumlichen Perspektive des griechischen Ausdrucks unmittelbar und klingt im Deutschen natürlich.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: ihm entgegen
  rationale: Die feste Verbindung bezeichnet das Entgegengehen mit dem Ziel der Begegnung. »Ihm entgegen« gibt dies knapp und idiomatisch wieder.
theological_decisions:
- issue: Gleichnishafter Bezug von νυμφίος
  choice: »der Bräutigam« kleingeschrieben und ohne ausdrückliche christologische Identifizierung
  alternative: »der Bräutigam« typografisch oder durch einen Zusatz ausdrücklich auf Christus beziehen
  rationale: Im Vers erscheint die Figur zunächst innerhalb des Gleichnisses. Die Übersetzung bewahrt diese literarische Ebene und legt die Deutung nicht ausdrücklich in den Wortlaut hinein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und ausrufartig; unnötig altertümliche Sprache wird vermieden.
