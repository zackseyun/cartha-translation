  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: de
  text: Du hättest also mein Geld[a] bei den Bankiers anlegen sollen, und bei meiner Rückkehr hätte ich das Meine mit Zinsen zurückerhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meine Silberstücke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: du hättest … sollen
  rationale: Das Imperfekt des unpersönlichen δεῖ bezeichnet eine in der Vergangenheit bestehende Verpflichtung. Die Formulierung gibt den vorwurfsvollen, rückblickenden Sinn im modernen Deutschen natürlich wieder.
- source_word: οὖν
  choice: also
  rationale: Die Partikel kennzeichnet die Folgerung aus dem vorangehenden Vorwurf. „Also“ ist hier klarer und natürlicher als das förmlichere „daher“.
- source_word: βαλεῖν
  choice: anlegen
  rationale: βάλλω bedeutet grundsätzlich „legen“ oder „tun“, bezeichnet in Verbindung mit Bankiers und Zinsen hier aber das Überlassen von Geld zu einem finanziellen Ertrag. „Anlegen“ vermittelt diesen Zusammenhang idiomatisch, ohne ein bestimmtes modernes Bankprodukt vorauszusetzen.
- source_word: τὰ ἀργύριά μου
  choice: mein Geld
  rationale: ἀργύριον kann Silber, Silberstücke oder Geld bezeichnen. Im geschäftlichen Zusammenhang der Aussage ist „Geld“ die klare funktionale Entsprechung; die konkretere Silberbedeutung bleibt in einer Fußnote sichtbar.
- source_word: τραπεζίταις
  choice: den Bankiers
  rationale: τραπεζίτης bezeichnet einen Geldwechsler oder Bankier. Da hier das Anlegen gegen Zinsen gemeint ist, passt „Bankiers“ besser als das enger klingende „Geldwechsler“.
- source_word: ἐλθὼν ἐγὼ
  choice: bei meiner Rückkehr
  rationale: Das Aoristpartizip bezeichnet zeitlich das Kommen des Herrn vor dem Zurückerhalten. Im Zusammenhang der Parabel gibt „bei meiner Rückkehr“ diese Abfolge knapp und natürlich wieder.
- source_word: ἐκομισάμην ἂν
  choice: hätte ich … zurückerhalten
  rationale: Die mediale Form von κομίζω kann bedeuten, etwas für sich zurückzuerhalten. Zusammen mit ἄν bezeichnet sie das Ergebnis eines nicht eingetretenen Falls; der deutsche Konjunktiv II der Vergangenheit bewahrt diesen Sinn.
- source_word: τὸ ἐμὸν
  choice: das Meine
  rationale: Das substantivierte Possessivpronomen betont, was dem Herrn gehört. „Das Meine“ bewahrt diese knappe possessive Betonung und passt zum würdigen Register.
- source_word: σὺν τόκῳ
  choice: mit Zinsen
  rationale: τόκος bezeichnet hier den Ertrag auf angelegtes Geld. „Zinsen“ ist die neutrale moderne Entsprechung und trägt nicht die wertende Nebenbedeutung von „Wucher“ ein.
theological_decisions:
- issue: Finanzsprache der Parabel und mögliche moralische Überdeutung des Zinsnehmens
  choice: Die wirtschaftlichen Begriffe werden neutral und ihrem erzählerischen Zweck entsprechend wiedergegeben.
  alternative: Eine wertende Wiedergabe wie „Wucherzins“ könnte die Aussage als allgemeine Billigung oder Verurteilung bestimmter Kreditpraktiken erscheinen lassen.
  rationale: Der Vers verwendet Finanzsprache als Bild innerhalb der Parabel. Die Übersetzung soll weder eine allgemeine Befürwortung noch eine Verurteilung des Zinsnehmens in den Text hineintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Bankiers“ und „das Meine“ bewahren die historische und rhetorische Färbung, während „anlegen“ und „Zinsen“ den wirtschaftlichen Vorgang für heutige Leser klar ausdrücken.
