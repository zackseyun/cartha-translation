id: MAT.25.34
reference: Matthew 25:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: de
  text: 'Dann wird der König zu denen auf seiner rechten Seite sagen: »Kommt, ihr, die ihr von meinem Vater gesegnet seid[a]! Erbt das Reich, das für euch von der Grundlegung der Welt an[b] bereitet ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »ihr Gesegneten meines Vaters«.'
    reason: Bewahrt die formale Genitivkonstruktion des Griechischen als mögliche, im Deutschen jedoch weniger eindeutige Wiedergabe.
  - marker: b
    text: 'Oder: »seit der Grundlegung der Welt«.'
    reason: Zeigt eine gleichwertige zeitliche Wiedergabe von ἀπό, die den fortdauernden Zeitraum seit diesem Ausgangspunkt stärker hervorhebt.
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Kennzeichnet in der Gerichtsszene die zeitliche Abfolge knapp und natürlich.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Der bestimmte Titel bezeichnet im Kontext den königlichen Richter; im Deutschen werden Amts- und Hoheitstitel regulär kleingeschrieben.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: zu denen auf seiner rechten Seite
  rationale: Gibt die räumliche Zuordnung klar wieder und lässt den im Kontext mitschwingenden Ehrenplatz bestehen.
- source_word: Δεῦτε
  choice: Kommt
  rationale: Entspricht dem imperativischen Ruf, ohne das im Griechischen nicht ausdrücklich genannte »her« oder »vor« hinzuzufügen.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: ihr von meinem Vater Gesegneten
  rationale: Bewahrt den substantivierten passiven Charakter des Partizips und gibt den Genitiv in natürlichem Deutsch als Ursprung beziehungsweise Urheber des Segens wieder.
- source_word: κληρονομήσατε
  choice: Erbt
  rationale: Der Imperativ erhält die Erbvorstellung und deren familiäre sowie heilsgeschichtliche Färbung; ein allgemeines »empfangt« wäre weniger präzise.
- source_word: τὴν ... βασιλείαν
  choice: das Reich
  rationale: Im Zusammenhang mit »erben« und »bereitet« steht das eschatologische Reich als Erbe im Vordergrund, ohne den Gedanken der Königsherrschaft auszuschließen.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: für euch ... bereitet ist
  rationale: Gibt den perfektisch-passiven Sinn als abgeschlossene Vorbereitung mit fortdauerndem Ergebnis wieder.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: von Grundlegung der Welt an
  rationale: Bildet ἀπό und die traditionelle biblische Wendung genau ab und bezeichnet den Ausgangspunkt der Vorbereitung.
theological_decisions:
- issue: Beziehung des Genitivs τοῦ πατρός μου zu »Gesegneten«
  choice: von meinem Vater Gesegneten
  alternative: Gesegneten meines Vaters
  rationale: Die Hauptfassung macht in heutigem Deutsch den Vater als Ursprung beziehungsweise Urheber des Segens verständlich. Die formal mögliche, weniger festgelegte Genitivwiedergabe bleibt in der Fußnote sichtbar.
- issue: Bedeutung von βασιλεία im Zusammenhang mit dem Erben
  choice: Reich
  alternative: Königsherrschaft
  rationale: Das als Erbe bereitete Objekt legt hier »Reich« nahe; die Übersetzung bestreitet damit nicht den dynamischen Bedeutungsaspekt königlicher Herrschaft.
- issue: Syntaktischer Bezug von ἀπὸ καταβολῆς κόσμου
  choice: Bezug auf das für die Angesprochenen bereitete Reich
  alternative: Lockerer Bezug auf die gesamte Einladung
  rationale: Die Stellung bei ἡτοιμασμένην und die unmittelbare Syntax sprechen dafür, dass das Reich seit der Grundlegung der Welt für sie bereit ist, ohne daraus weitergehende systematische Aussagen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt feierlich, aber ohne altertümliche Formen. »Kommt« ist bewusst knapper als »Kommt her«, da das Griechische keinen zusätzlichen Richtungszusatz ausdrückt.
