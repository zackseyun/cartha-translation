  source_fidelity: Die Übersetzung gibt die Abfolge und den Nachdruck von τότε sowie καὶ αὐτοὶ („Dann werden auch sie“) angemessen wieder. Die sechs Zustände bzw. Notsituationen entsprechen dem griechischen Text vollständig. „Als Fremden“ bewahrt ξένον ohne ethnische oder rechtliche Einengung. „Dir nicht gedient“ gibt οὐ διηκονήσαμέν σοι mit dem Dativbezug und dem offenen, praktisch-konkreten Sinn von διακονέω sachgerecht wieder.
  naturalness: Der Satz ist flüssiges, würdevolles modernes Standarddeutsch. Die Auslassung einer wörtlichen Entsprechung zu λέγοντες ist idiomatisch und lässt keinen Sinnbestandteil vermissen. Die Reihung „hungrig oder durstig ...“ ist klar und natürlich.
  terminology: „Herr“ ist für Κύριε konsistent und angemessen. „Dienen“ erhält gegenüber engeren Alternativen die Breite von διακονέω; die Fußnote nennt verständliche, kontextgerechte Konkretisierungen. Die Fußnotenmarkierung ist vorhanden und korrekt dem erläuterten Ausdruck zugeordnet.
