id: MAT.25.44
reference: Matthew 25:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: de
  text: 'Dann werden auch sie antworten: »Herr, wann haben wir dich hungrig oder durstig oder als Fremden oder nackt oder krank oder im Gefängnis gesehen und dir nicht gedient?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »uns nicht um dich gekümmert« oder »dich nicht versorgt«. Das griechische Wort διακονέω bezeichnet hier einen Dienst, der sich in praktischer Hilfe zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Markiert natürlich und prägnant die zeitliche Abfolge in der Gerichtsszene.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: werden auch sie antworten
  rationale: Das betonte καὶ αὐτοὶ wird mit »auch sie« bewahrt; das griechische Redepartizip λέγοντες kann im heutigen Deutschen ohne das schwerfällige »und sagen« in die Einleitung der direkten Rede eingehen.
- source_word: Κύριε
  choice: Herr
  rationale: Bewahrt die übliche respektvolle Anrede und ihre christologische Resonanz, ohne sie weiter auszudeuten.
- source_word: πεινῶντα ἢ διψῶντα
  choice: hungrig oder durstig
  rationale: Die prädikativ gebrauchten Partizipien werden idiomatisch durch deutsche Adjektive wiedergegeben.
- source_word: ξένον
  choice: als Fremden
  rationale: Bezeichnet hier einen Menschen außerhalb des vertrauten sozialen Kreises, der Aufnahme benötigt; »als Fremden« passt syntaktisch zu »dich … gesehen« und legt keine ethnische Bedeutung fest.
- source_word: γυμνὸν
  choice: nackt
  rationale: Bewahrt die unmittelbare lexikalische Aussage, die im Kontext auch unzureichende Bekleidung einschließen kann.
- source_word: ἀσθενῆ
  choice: krank
  rationale: Im Zusammenhang körperlicher und sozialer Not ist die Krankheitsbedeutung am wahrscheinlichsten.
- source_word: ἐν φυλακῇ
  choice: im Gefängnis
  rationale: Natürliche deutsche Entsprechung für die Ortsangabe.
- source_word: οὐ διηκονήσαμέν σοι
  choice: dir nicht gedient
  rationale: Bewahrt den breiten Sinn praktischen Dienens und den Dativbezug auf Jesus; die Fußnote nennt im Kontext mögliche konkretere Wiedergaben.
theological_decisions:
- issue: Titel κύριος für Jesus
  choice: Herr
  alternative: Meister
  rationale: »Herr« wahrt sowohl die respektvolle Anrede als auch die im Matthäusevangelium mitschwingende christologische Bedeutung, ohne eine engere Deutung aufzuzwingen.
- issue: Bedeutungsumfang von διακονέω
  choice: dir nicht gedient
  alternative: uns nicht um dich gekümmert / dich nicht versorgt
  rationale: »Gedient« erhält die theologisch bedeutsame Verbindung zwischen tätiger Hilfe für Bedürftige und dem Dienst am König. Die konkretere fürsorgliche Dimension bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist flüssig gestaltet; »auch sie« bewahrt den leichten Nachdruck des griechischen Ausdrucks. Die Reihung der Notsituationen und die offene Tragweite von »dienen« bleiben erhalten.
