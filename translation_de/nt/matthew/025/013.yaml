base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: de
  text: Seid also wachsam,[a] denn ihr wisst weder den Tag noch die Stunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Bleibt wach“ oder „Wacht“. Der griechische Imperativ bezeichnet eine fortdauernde Wachsamkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Seid wachsam
  rationale: Der präsentische Imperativ in der zweiten Person Plural fordert zu anhaltender Wachsamkeit auf. „Seid wachsam“ ist im modernen Deutschen natürlich und bewahrt die Bildwelt des Wachens, ohne nur körperliches Wachbleiben auszudrücken.
- source_word: οὖν
  choice: also
  rationale: Das Wort kennzeichnet die Aufforderung als Folgerung aus dem vorausgehenden Gleichnis; „also“ gibt diesen Zusammenhang knapp und idiomatisch wieder.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Aufforderung ein. „Denn“ ist hier in würdigem, natürlichem Deutsch passender als ein Nebensatz mit „weil“.
- source_word: οὐκ οἴδατε
  choice: ihr kennt nicht
  rationale: Die zweite Person Plural und die Verneinung werden unmittelbar wiedergegeben. Bei einem Zeitpunkt ist „den Tag/die Stunde kennen“ idiomatisches Deutsch.
- source_word: τὴν ἡμέραν οὐδὲ τὴν ὥραν
  choice: weder den Tag noch die Stunde
  rationale: Die korrelative deutsche Form „weder … noch“ bildet die beiden verneinten, jeweils bestimmten Zeitangaben klar und natürlich ab.
theological_decisions:
- issue: Bildhafte Aufforderung zur Wachsamkeit
  choice: Seid wachsam
  alternative: Bleibt wach; Wacht
  rationale: Die Formulierung bewahrt den Gedanken fortdauernder Bereitschaft im Rahmen des Gleichnisses, ohne ihn auf buchstäbliches Nichtschlafen zu begrenzen oder mit einem bestimmten endzeitlichen Lehrsystem auszufüllen.
- issue: Bezug von „Tag“ und „Stunde“
  choice: Ausdruck ohne erklärenden Zusatz beibehalten
  alternative: den Tag oder die Stunde der Wiederkunft; den festgesetzten Zeitpunkt
  rationale: Der weitere Zusammenhang legt einen endzeitlichen Bezug nahe, doch der Vers selbst nennt lediglich „den Tag“ und „die Stunde“. Die Übersetzung lässt diese kontextuell erschließbare Bedeutung unausgeführt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede im Plural wird durch „ihr“ wiedergegeben; die Satzstruktur bleibt knapp und nachdrücklich.
