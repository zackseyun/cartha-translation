- from: Die klugen aber nahmen zusammen mit ihren Lampen[a] Öl in Gefäßen mit.
  to: Die Klugen aber nahmen neben ihren Lampen Öl in Gefäßen mit.[a]
  rationale: 'Die Großschreibung von „Klugen“ korrigiert die deutsche Orthografie. „Neben ihren Lampen“ gibt μετά („mit, zusammen mit“) in diesem Kontext idiomatisch wieder: Die Klugen nehmen zusätzlich zu ihren Lampen Öl in Gefäßen mit. Inhalt, Reihenfolge der Sachverhalte und die offen gehaltene Art der Gefäße bleiben gewahrt.'
