  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: de
  text: Die Klugen aber nahmen neben ihren Lampen Öl in Gefäßen mit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fackeln“. Das griechische Wort kann je nach Zusammenhang eine Fackel oder eine Lampe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: die klugen
  rationale: Bezeichnet praktische Klugheit und wahrt den Gegensatz zu den törichten jungen Frauen im Kontext, ohne den Begriff auf bloße Vorbereitung zu verengen.
- source_word: ἔλαβον
  choice: nahmen ... mit
  rationale: Im erzählerischen Zusammenhang bedeutet das Verb, dass sie das Öl mit sich nahmen; die trennbare deutsche Formulierung ist natürlich.
- source_word: ἔλαιον
  choice: Öl
  rationale: Die allgemeine Bezeichnung genügt; eine Festlegung auf Olivenöl wäre genauer, als es der Text verlangt.
- source_word: ἀγγείοις
  choice: Gefäßen
  rationale: Der Ausdruck bezeichnet allgemein Behältnisse, ohne Form oder Material festzulegen. „Gefäße“ ist würdig und im Zusammenhang gut verständlich.
- source_word: λαμπάδων
  choice: Lampen
  rationale: Das Wort kann Lampen oder Fackeln bezeichnen. „Lampen“ passt zum mitgenommenen Öl und zur etablierten deutschen Wiedergabe; die echte Alternative wird in einer Fußnote bewahrt.
- source_word: ἑαυτῶν
  choice: ihren
  rationale: Das Possessivpronomen gibt den reflexiven Besitzbezug im Deutschen natürlich wieder; „ihren eigenen“ wäre möglich, aber unnötig betont.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: zusammen mit ihren Lampen
  rationale: Gibt die Begleitung ausdrücklich wieder und verdeutlicht, dass das Öl zusätzlich zu den Lampen mitgenommen wurde.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung hält den Gegensatz („die klugen aber“) sichtbar und bewahrt zugleich den generischen Charakter der Ölbehälter.
