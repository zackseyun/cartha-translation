  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: de
  text: Und wann haben wir dich krank oder im Gefängnis gesehen und sind zu dir gekommen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben dich besucht“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: πότε
  choice: wann
  rationale: Das interrogative Adverb fragt nach dem Zeitpunkt; „wann“ ist im Deutschen die natürliche Entsprechung in direkter Rede.
- source_word: δέ
  choice: und
  rationale: δέ verbindet hier die aufeinanderfolgenden Fragen nur leicht; „und“ gibt diesen Zusammenhang natürlicher wieder als das stärker gegensätzliche „aber“.
- source_word: εἴδομεν
  choice: haben wir gesehen
  rationale: Der Aorist bezeichnet hier ein vergangenes Sehen; im deutschen Fragesatz ist das Perfekt idiomatisch und bewahrt den Vergangenheitsbezug.
- source_word: ἀσθενοῦντα
  choice: krank
  rationale: Das Partizip von ἀσθενέω bezeichnet im Kontext körperliche Krankheit; „krank“ ist klar und enger als das ebenfalls mögliche „schwach“.
- source_word: ἐν φυλακῇ
  choice: im Gefängnis
  rationale: φυλακή bezeichnet hier einen Ort der Gefangenschaft; „im Gefängnis“ ist die geläufige, sachliche Wiedergabe.
- source_word: ἤλθομεν πρός σε
  choice: sind zu dir gekommen
  rationale: Die Formulierung bildet die schlichte Bewegungsangabe des Griechischen transparent ab. „Haben dich besucht“ wäre idiomatisch, legt aber eine spezifischere Handlung nahe als der Ausgangstext ausdrücklich nennt.
theological_decisions:
- issue: Ob ἤλθομεν πρός σε idiomatisch als „haben dich besucht“ oder wörtlicher als „sind zu dir gekommen“ wiederzugeben ist
  choice: sind zu dir gekommen
  alternative: haben dich besucht
  rationale: Der Zusammenhang handelt von Barmherzigkeit gegenüber dem Menschensohn in der Gestalt der Geringsten. Die griechische Wendung bezeichnet jedoch zunächst das Kommen zu einer Person und verwendet kein ausdrückliches Verb für „besuchen“. Daher bleibt der Haupttext quellennah; die idiomatische Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, schlichtem Satzbau. Die direkte Frage und die koordinierende Struktur des griechischen Textes bleiben erhalten.
