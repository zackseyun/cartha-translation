  source_fidelity: 'Der Satz gibt die griechische Struktur und den Kontrast zuverlässig wieder: οὗτοι/οἱ δὲ δίκαιοι entspricht „diese/die Gerechten aber“, εἰς wird in beiden Zielbestimmungen mit „in“ abgebildet, und κόλασις sowie ζωή sind treffend mit „Strafe“ und „Leben“ wiedergegeben. „werden … gehen“ ist für ἀπελεύσονται eine zulässige, idiomatische Wiedergabe; der im Präfix ἀπ- enthaltene Abgang wird nicht ausdrücklich hervorgehoben, aber auch nicht sinnverändernd ausgelassen.'
  naturalness: „Und diese werden in die ewige Strafe gehen, die Gerechten aber in das ewige Leben“ ist klares, würdiges modernes Standarddeutsch. Die Ellipse im zweiten Satzglied ist natürlich und bewahrt die knappe Parallelität des griechischen Satzes.
  terminology: „Ewige Strafe“ und „ewiges Leben“ geben αἰώνιον konsequent in beiden parallelen Wendungen wieder. „Die Gerechten“ ist die etablierte, verständliche Wiedergabe von οἱ δίκαιοι. Die Fußnote nennt die lexikalische Alternative symmetrisch und legt keine konfessionelle Deutung fest.
