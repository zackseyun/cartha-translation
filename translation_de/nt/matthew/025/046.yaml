  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: de
  text: Und diese werden in die ewige Strafe[a] gehen, die Gerechten aber in das ewige Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zeitalterlange Strafe« … »zeitalterlanges Leben«. Die Bedeutung des Adjektivs αἰώνιος wird in manchen Zusammenhängen unterschiedlich beurteilt. Hier bestimmt jedoch dasselbe Wort sowohl »Strafe« als auch »Leben«; deshalb gibt die Übersetzung beide Male mit »ewig« wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: werden … gehen
  rationale: Das Futur von ἀπέρχομαι bezeichnet hier das Weggehen beziehungsweise Hingehen. Die deutsche Formulierung ist natürlich und bewahrt den Bewegungssinn, ohne ein Ziel hinzuzufügen.
- source_word: οὗτοι
  choice: diese
  rationale: Das Demonstrativpronomen verweist knapp auf die zuvor beschriebene Gruppe und erhält den Kontrast zu »die Gerechten«.
- source_word: κόλασιν
  choice: Strafe
  rationale: Im Zusammenhang des Endgerichts bezeichnet κόλασις eine strafende Folge. »Strafe« ist im Deutschen die klare und kontextgemäße Wiedergabe.
- source_word: αἰώνιον
  choice: ewig
  rationale: Dasselbe Adjektiv bestimmt sowohl »Strafe« als auch »Leben«. »Ewig« ist hier die geläufige Wiedergabe und wahrt die genaue Parallelität beider Satzglieder; die umstrittene Alternative »zeitalterlang« wird in der Fußnote genannt.
- source_word: δίκαιοι
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die als gerecht gelten oder durch Gerechtigkeit gekennzeichnet sind. »Die Gerechten« ist die etablierte und zugleich verständliche deutsche Form.
- source_word: ζωὴν
  choice: Leben
  rationale: Die übliche und kontextuell hinreichende Wiedergabe von ζωή.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel kennzeichnet den Gegensatz zwischen den beiden Gruppen und ihren jeweiligen Ausgängen.
theological_decisions:
- issue: Wiedergabe von αἰώνιον in den parallelen Wendungen κόλασιν αἰώνιον und ζωὴν αἰώνιον
  choice: In beiden Satzgliedern mit »ewig« wiedergeben
  alternative: In beiden Satzgliedern mit »zeitalterlang« wiedergeben
  rationale: Da im Griechischen dasselbe Adjektiv sowohl »Strafe« als auch »Leben« bestimmt, darf die Übersetzung die zeitliche beziehungsweise qualitative Beziehung nicht zwischen beiden Satzgliedern unterschiedlich behandeln. »Ewig« ist in diesem Gerichtskontext die natürliche deutsche Hauptwiedergabe. Die lexikalisch diskutierte Alternative bleibt in einer Fußnote sichtbar, ohne die Parallelität aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Satzbau und die Gegenüberstellung des griechischen Textes bleiben erhalten. »In die … gehen« klingt im Deutschen natürlicher als eine wörtlichere Form mit »weggehen«, während die Zielrichtung von εἰς gewahrt bleibt.
