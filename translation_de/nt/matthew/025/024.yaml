source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: de
  text: 'Dann trat auch derjenige vor, der das eine Talent erhalten hatte, und sagte: »Herr, ich wusste, dass du ein harter Mann bist[a]: Du erntest, wo du nicht gesät hast, und sammelst, wo du nicht ausgestreut hast[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein strenger« beziehungsweise »ein schroffer Mann«. Das griechische Wort kann hart, streng oder schroff bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »und sammelst von woher du nicht ausgestreut hast«. Ein Objekt wie »Samen« steht im Griechischen nicht ausdrücklich da.'
    reason: literal_rendering
lexical_decisions:
- source_word: προσελθὼν δὲ καὶ
  choice: Da trat auch ... hinzu
  rationale: Die Wendung gibt den erzählerischen Fortschritt durch δέ, die Einbeziehung durch καί und die Annäherung durch προσελθών in natürlichem Deutsch wieder.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: der, der das eine Talent erhalten hatte
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet den Knecht anhand des Empfangenen; das Plusquamperfekt bildet die vorausliegende, weiterhin relevante Handlung des Perfektpartizips ab.
- source_word: τάλαντον
  choice: Talent
  rationale: Der antike Gewichts- und Geldbegriff bleibt erhalten, ohne den Wert durch eine freie Deutung zu verengen.
- source_word: Κύριε
  choice: Herr
  rationale: Als respektvolle Anrede des Herrn in der Erzählung ist »Herr« idiomatisch und wahrt zugleich die übliche Wiedergabe von κύριος.
- source_word: ἔγνων σε ὅτι
  choice: ich wusste, dass du
  rationale: Im Deutschen gibt der Objektsatz die behauptete Kenntnis vom Wesen des Herrn natürlich wieder; eine wörtlichere Doppelung wie »ich kannte dich, dass« wäre unidiomatisch.
- source_word: σκληρὸς ... ἄνθρωπος
  choice: ein harter Mann
  rationale: »Hart« bewahrt die Bedeutungsbreite von σκληρός zwischen hart, streng und schroff, ohne die im Mund des Knechtes stehende Charakterisierung stärker auszudeuten.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: Du erntest, wo du nicht gesät hast
  rationale: Die landwirtschaftliche Bildsprache und der Gegensatz zwischen Säen und Ernten bleiben direkt erhalten.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: und sammelst, wo du nicht ausgestreut hast
  rationale: »Sammeln« und »ausstreuen« entsprechen den Verben, ohne ein im griechischen Text unausgesprochenes Objekt wie »Samen« in den Haupttext einzufügen. Das strengere »von woher« wäre im Deutschen schwerfällig; die Herkunftsnuance wird in der Fußnote vermerkt.
theological_decisions:
- issue: Charakterisierung des Herrn durch den Knecht
  choice: Die Aussage wird als ungemilderte Behauptung des Knechtes mit »harter Mann« wiedergegeben.
  alternative: »strenger Mann« oder »schroffer Mann«
  rationale: Der Text berichtet die Einschätzung des Knechtes, ohne sie an dieser Stelle ausdrücklich zu bestätigen oder zu widerlegen. Die Übersetzung wahrt diese Spannung.
- issue: Anrede Κύριε innerhalb des Gleichnisses
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« ist eine natürliche respektvolle Anrede und vermeidet eine unnötige Festlegung darauf, ob hier nur die soziale Rolle oder zugleich eine weitergehende christologische Resonanz im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig gestaltet, während die landwirtschaftliche Bildsprache und die wertende Härte der Aussage des Knechtes erhalten bleiben. Alle Fußnotenmarker stehen im Haupttext.
