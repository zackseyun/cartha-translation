  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: de
  text: 'Später kommen auch die übrigen Jungfrauen[a] und sagen: »Herr, Herr[b], öffne uns![c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die anderen Jungfrauen«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische kyrios kann hier sowohl eine respektvolle Anrede als auch den Titel »Herr« ausdrücken; auch »Herr« im Sinn von »Gebieter« oder »Sir« kommt als Verständnismöglichkeit in Betracht.
    reason: alternative_reading
  - marker: c
    text: Im Griechischen steht nur »öffne uns«; die Tür ist aus dem Zusammenhang zu ergänzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Später
  rationale: Das temporale Adverb kennzeichnet die nachfolgende Handlung. »Später« ist im modernen Deutsch natürlich und gibt die zeitliche Abfolge ohne Zusatz wieder.
- source_word: δὲ
  choice: —
  rationale: δέ ist hier ein schwaches Übergangswort. Der Übergang wird im Deutschen bereits durch »Später« deutlich, sodass eine ausdrückliche Wiedergabe unnötig wäre.
- source_word: ἔρχονται
  choice: kommen
  rationale: Das historische Präsens wird beibehalten und erhält die Unmittelbarkeit der Erzählung.
- source_word: καὶ
  choice: auch
  rationale: 'καί hat hier additive Bedeutung: Nun kommen ebenfalls die zuvor ausgeschlossenen Jungfrauen.'
- source_word: αἱ λοιπαὶ παρθένοι
  choice: die übrigen Jungfrauen
  rationale: λοιπαί bezeichnet die Übrigen beziehungsweise Verbleibenden. »Jungfrauen« gibt παρθένοι direkt wieder und bewahrt die Bildsprache des Gleichnisses.
- source_word: λέγουσαι
  choice: und sagen
  rationale: Die koordinierte deutsche Form gibt das begleitende Partizip natürlich wieder, ohne seinen Bezug zur Ankunft zu verändern.
- source_word: Κύριε κύριε
  choice: Herr, Herr
  rationale: Die Wiederholung wird als Ausdruck der Dringlichkeit bewahrt. »Herr« lässt sowohl die respektvolle Anrede innerhalb des Gleichnisses als auch den möglichen theologischen Nachklang im Matthäusevangelium bestehen.
- source_word: ἄνοιξον ἡμῖν
  choice: mach uns auf
  rationale: Die idiomatische deutsche Wendung bewahrt, dass das griechische Original das im Kontext vorausgesetzte Objekt »Tür« nicht ausdrücklich nennt.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede
  choice: Herr
  alternative: mein Herr; Gebieter
  rationale: »Herr« bewahrt die Spannung zwischen einer respektvollen sozialen Anrede in der erzählten Szene und einer möglichen christologischen Bedeutung im weiteren Kontext des Matthäusevangeliums, ohne eine davon festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens und die eindringliche Wiederholung der Anrede bleiben erhalten. Die Formulierung »mach uns auf« ist idiomatisch, ohne das im Griechischen unausgesprochene Wort »Tür« in den Haupttext einzufügen.
