id: MAT.25.5
reference: Matthew 25:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: de
  text: Als aber der Bräutigam lange auf sich warten ließ[a], wurden sie alle schläfrig und schliefen ein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich verspätete“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und schliefen“. Das Griechische unterscheidet zwischen dem Eintreten der Schläfrigkeit (ἐνύσταξαν) und dem anschließenden, als andauernd dargestellten Schlafen (ἐκάθευδον).'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: lange auf sich warten ließ
  rationale: Das Präsenspartizip von χρονίζω bezeichnet ein längeres Ausbleiben oder eine Verzögerung. Die deutsche Wendung gibt den zeitlichen Verlauf und die enttäuschte Erwartung natürlich wieder, ohne ausdrücklich festzulegen, wodurch die Verzögerung verursacht wurde.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier eine leichte Gegenüberstellung beziehungsweise eine neue Wendung in der Erzählung; „aber“ gibt dies knapp und idiomatisch wieder.
- source_word: νυμφίου
  choice: Bräutigam
  rationale: νυμφίος bezeichnet ausdrücklich den Bräutigam. Der Begriff bewahrt das Hochzeitsbild des Gleichnisses und dessen mögliche theologische Resonanz, ohne diese auszudeuten.
- source_word: ἐνύσταξαν
  choice: wurden schläfrig
  rationale: νυστάζω beschreibt das Einsetzen von Schläfrigkeit. „Wurden schläfrig“ erhält diesen ingressiven Sinn und unterscheidet ihn vom anschließenden Schlafen.
- source_word: πᾶσαι
  choice: sie alle
  rationale: Die feminine Pluralform bezieht sich auf sämtliche zehn jungen Frauen des Gleichnisses. „Sie alle“ gibt die Vollständigkeit im Deutschen klar wieder.
- source_word: ἐκάθευδον
  choice: schliefen ein
  rationale: καθεύδω bedeutet „schlafen“. Zusammen mit dem vorangehenden „wurden schläfrig“ beschreibt „schliefen ein“ im Deutschen natürlich die Abfolge; da der griechische Imperfekt auch den andauernden Zustand „sie schliefen“ hervorheben kann, wird diese Möglichkeit in einer Fußnote bewahrt.
theological_decisions:
- issue: Gleichnisbild des Bräutigams
  choice: „Bräutigam“ als Bild der Erzählung unverändert stehen lassen
  alternative: Das Bild durch eine ausdrückliche christologische Identifikation ergänzen oder allgemeiner „Bräutigam der Hochzeit“ formulieren
  rationale: Im weiteren Matthäuskontext kann das Bräutigambild christologische Bedeutung tragen; der Vers selbst benennt diese Deutung jedoch nicht ausdrücklich. Die Übersetzung bewahrt daher das Bild und lässt seine theologische Spannung offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Lange auf sich warten ließ“ ist idiomatisch, während die Fußnoten engere lexikalische und aspektuelle Alternativen dokumentieren.
