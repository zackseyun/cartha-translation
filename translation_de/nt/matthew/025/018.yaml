  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: de
  text: Der aber, der das eine Talent erhalten hatte, ging weg, grub ein Loch in die Erde und verbarg das Geld[a] seines Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Silber“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Der aber
  rationale: δέ kennzeichnet den Gegensatz zu den zuvor handelnden Dienern; die substantivierte Artikelkonstruktion wird im Deutschen knapp mit „der“ wiedergegeben.
- source_word: τὸ ἓν
  choice: das eine Talent
  rationale: Im Griechischen steht elliptisch „das eine“; „Talent“ wird aus dem unmittelbaren Zusammenhang ergänzt, damit der Bezug im Deutschen klar bleibt.
- source_word: λαβὼν
  choice: erhalten hatte
  rationale: Das Partizip bezeichnet eine Handlung, die den folgenden Hauptverben vorausliegt. „Erhalten hatte“ gibt sowohl den Empfang als auch die zeitliche Abfolge natürlich wieder.
- source_word: ἀπελθὼν
  choice: ging weg
  rationale: Die Form bezeichnet das Sichentfernen vor den anschließenden Handlungen; „ging weg“ ist schlicht und gegenwartssprachlich.
- source_word: ὤρυξεν γῆν
  choice: grub in der Erde
  rationale: Die griechische Wendung beschreibt das Graben im Erdboden. Diese Wiedergabe ist im Deutschen idiomatisch, ohne das nur implizierte „Loch“ ausdrücklich hinzuzufügen.
- source_word: ἔκρυψεν
  choice: verbarg
  rationale: „Verbergen“ gibt κρύπτω präzise und in einem würdigen Erzählregister wieder.
- source_word: τὸ ἀργύριον
  choice: das Geld
  rationale: ἀργύριον kann „Silber“ oder daraus metonymisch „Geld“ bedeuten. Im Zusammenhang des anvertrauten Vermögens ist „Geld“ für heutige Leser am klarsten; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: seines Herrn
  rationale: κύριος bezeichnet hier innerhalb des Gleichnisses den Herrn des Dieners. „Seines Herrn“ bewahrt das Autoritätsverhältnis und ist im Deutschen in diesem Erzählzusammenhang natürlich.
theological_decisions:
- issue: Wiedergabe von κύριος bei einem menschlichen Bezug im Gleichnis
  choice: Herr
  alternative: Gebieter
  rationale: Der unmittelbare Bezug ist der menschliche Herr des Dieners innerhalb der erzählten Welt. „Herr“ hält die Autoritätsbeziehung fest, ohne den Ausdruck ausdrücklich zu einem göttlichen Titel zu machen; „Gebieter“ wäre stärker interpretierend und altertümlicher.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die knappe griechische Partizipialfolge wird in natürliches deutsches Satzgefüge übertragen; die Ellipse bei „das eine“ wird durch „Talent“ aus dem unmittelbaren Kontext aufgelöst.
