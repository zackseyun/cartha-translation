  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: de
  text: 'Denn es ist wie mit einem Mann, der verreisen wollte: Er rief seine eigenen Sklaven[a] und vertraute ihnen seinen Besitz an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“ beziehungsweise traditionell „Knechte“. Das griechische Wort doulos bezeichnet einen Menschen, der einem Herrn untersteht, und kann je nach Zusammenhang mit „Sklave“ oder „Diener“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Denn es ist wie bei
  rationale: Die elliptische Vergleichsformel wird im Deutschen durch „es ist“ zu einem natürlichen vollständigen Satz ergänzt; „denn“ bewahrt den begründenden Anschluss an den vorausgehenden Kontext.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Gemeint ist die männliche Gestalt des Gleichnisses, nicht der Mensch im allgemeinen Sinn.
- source_word: ἀποδημῶν
  choice: der im Begriff war zu verreisen
  rationale: Die Formulierung gibt die bevorstehende Abreise wieder und vermeidet den falschen Eindruck, der Mann habe seine Sklaven erst nach seiner Abreise gerufen. Ein Auslandsaufenthalt wird nicht unnötig festgelegt.
- source_word: ἐκάλεσεν
  choice: rief
  rationale: „Rief“ ist die direkte, natürliche Wiedergabe; „ließ zu sich rufen“ oder „berief“ wäre stärker ausdeutend.
- source_word: τοὺς ἰδίους δούλους
  choice: seine eigenen Sklaven
  rationale: „Sklaven“ macht das in δοῦλος bezeichnete Abhängigkeits- und Besitzverhältnis sichtbar; „eigenen“ bewahrt die Hervorhebung durch ἰδίους.
- source_word: παρέδωκεν
  choice: vertraute … an
  rationale: Im Zusammenhang einer verantwortlichen Verwaltung gibt „anvertrauen“ den Sinn der Übergabe treffend und idiomatisch wieder.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: seinen Besitz
  rationale: Der Ausdruck bezeichnet das, was dem Mann gehört; „Besitz“ ist klar, knapp und passt zum wirtschaftlichen Rahmen des Gleichnisses.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Haushaltsgleichnis
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Der soziale Status und die umfassende Autorität des Herrn sind im Gleichnis deutlich. „Sklaven“ wahrt diese historische Realität, ohne die metaphorische beziehungsweise theologische Deutung des Gleichnisses vorwegzunehmen.
- issue: Ergänztes Subjekt der elliptischen Vergleichsformel
  choice: „es ist wie bei“ ohne ausdrückliche Nennung des Himmelreichs
  alternative: „mit dem Himmelreich ist es wie“
  rationale: Der griechische Vers nennt das Himmelreich hier nicht ausdrücklich. Die gewählte Fassung stellt einen verständlichen Anschluss her, ohne eine aus dem weiteren Kontext erschlossene Bezeichnung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die griechische Satzbewegung lesbar ab. „Im Begriff war zu verreisen“ wahrt die zeitliche Beziehung der Handlungen, ohne „ins Ausland“ zu konkretisieren.
