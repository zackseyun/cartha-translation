source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: de
  text: Ich war ein Fremder, und ihr habt mich nicht aufgenommen[a]; ich war nackt, und ihr habt mich nicht bekleidet; ich war krank und im Gefängnis, und ihr habt mich nicht besucht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei euch aufgenommen“. Das griechische Verb bedeutet wörtlich „zusammenführen“ oder „sammeln“ und bezeichnet hier die gastfreundliche Aufnahme eines Fremden.'
    reason: lexical_alternative
  - marker: b
    text: „Besucht“ kann hier auch „nach mir gesehen“ oder „sich um mich gekümmert“ bedeuten; gemeint ist ein Aufsuchen mit fürsorglicher Anteilnahme, nicht nur ein gesellschaftlicher Besuch.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: ein Fremder
  rationale: ξένος bezeichnet hier einen Menschen außerhalb des eigenen Hauses oder vertrauten Umfelds, der auf Aufnahme angewiesen ist. „Ein Fremder“ bewahrt diese soziale Schutzlosigkeit, ohne die Bedeutung unnötig auf ethnische Herkunft zu verengen.
- source_word: συνηγάγετέ
  choice: aufgenommen
  rationale: συνάγω bedeutet wörtlich „zusammenführen/sammeln“, bezeichnet in Verbindung mit einem Fremden hier jedoch die gastfreundliche Aufnahme. „Aufgenommen“ ist im Deutschen natürlich und schließt sowohl Einlass als auch Fürsorge ein.
- source_word: γυμνός
  choice: nackt
  rationale: γυμνός kann völlige Nacktheit oder unzureichende Bekleidung bezeichnen. „Nackt“ gibt den kräftigen, direkten Ausdruck des griechischen Textes wieder; die folgende Handlung des Bekleidens verdeutlicht die Notlage.
- source_word: περιεβάλετέ
  choice: bekleidet
  rationale: περιβάλλω bedeutet wörtlich „umlegen“ und in diesem Zusammenhang „bekleiden“. „Bekleidet“ entspricht präzise der genannten Tat der Barmherzigkeit.
- source_word: ἀσθενής
  choice: krank
  rationale: Obwohl ἀσθενής allgemein auch „schwach“ heißen kann, legt die Aufzählung konkreter Notlagen hier körperliche Krankheit nahe. „Krank“ ist klar und idiomatisch.
- source_word: ἐν φυλακῇ
  choice: im Gefängnis
  rationale: φυλακή bezeichnet hier den Zustand der Gefangenschaft beziehungsweise den Haftort. „Im Gefängnis“ ist die geläufige und sachlich breite deutsche Wiedergabe.
- source_word: ἐπεσκέψασθέ
  choice: besucht
  rationale: ἐπισκέπτομαι bezeichnet ein Aufsuchen mit Anteilnahme und fürsorglicher Aufmerksamkeit. „Besucht“ wahrt die konkrete Handlung, während eine Fußnote den über einen bloßen Höflichkeitsbesuch hinausgehenden Sinn verdeutlicht.
theological_decisions:
- issue: Fürsorgliche Bedeutung von ἐπεσκέψασθέ με
  choice: mich besucht
  alternative: nach mir gesehen / sich um mich gekümmert
  rationale: Die konkrete Handlung des Aufsuchens bleibt erhalten, ohne den Ausdruck auf abstrakte Fürsorge zu reduzieren. Zugleich wird die im Verb liegende mitfühlende Anteilnahme durch die Fußnote kenntlich gemacht.
- issue: Bedeutungsumfang von γυμνός
  choice: nackt
  alternative: unzureichend bekleidet
  rationale: Die direkte Wiedergabe bewahrt die Eindringlichkeit des Textes. Da das griechische Wort auch Mangel an ausreichender Kleidung umfassen kann, darf die Formulierung nicht dogmatisch auf völlige unbekleidete Nacktheit eingeengt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die wiederholte Satzstruktur bildet die eindringliche Aufzählung des griechischen Textes nach; Semikolons gliedern die drei Notlagen klar. Die im Griechischen teilweise elliptische Formulierung wird durch die Wiederholung von „ich war“ im Deutschen natürlich entfaltet.
