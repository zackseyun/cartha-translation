id: MAT.25.10
reference: Matthew 25:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: de
  text: Während sie aber weggingen, um einzukaufen, kam der Bräutigam. Diejenigen, die bereit waren, gingen mit ihm zum Hochzeitsfest[a] hinein, und die Tür wurde verschlossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Hochzeitsfeier“ oder einfach „zur Hochzeit“. Der griechische Plural kann die gesamte Hochzeitsfeier bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν
  choice: Während sie aber weggingen
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig ablaufende Handlung. „Während sie … weggingen“ gibt sowohl das zeitliche Verhältnis als auch die Bewegung vom Ort weg wieder.
- source_word: ἀγοράσαι
  choice: um einzukaufen
  rationale: Der Aoristinfinitiv bezeichnet den Zweck. „Um einzukaufen“ ist im Deutschen natürlich und ergänzt nicht ausdrücklich „Öl“, das zwar aus dem Kontext hervorgeht, in diesem Vers aber nicht genannt wird.
- source_word: ὁ νυμφίος
  choice: der Bräutigam
  rationale: „Bräutigam“ ist die präzise und geläufige deutsche Bezeichnung im Hochzeitsbild und bewahrt die Bildsprache des Gleichnisses.
- source_word: αἱ ἕτοιμοι
  choice: Diejenigen, die bereit waren
  rationale: Das substantivierte feminine Adjektiv bezeichnet die bereiten Frauen. Die Formulierung ist idiomatisch und macht die Bereitschaft zum entscheidenden Merkmal, ohne sie näher auszudeuten.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: gingen mit ihm … hinein
  rationale: Die Wendung gibt die erzählerische Bewegung natürlich wieder und bewahrt ausdrücklich das gemeinsame Hineingehen mit dem Bräutigam.
- source_word: εἰς τοὺς γάμους
  choice: zum Hochzeitsfest
  rationale: Der griechische Plural kann die Hochzeitsfeier als Ganzes bezeichnen. „Hochzeitsfest“ ist im modernen Deutsch klar und bildet den festlichen Zusammenhang ab.
- source_word: ἐκλείσθη ἡ θύρα
  choice: die Tür wurde verschlossen
  rationale: Das Passiv bleibt erhalten. „Wurde verschlossen“ vermittelt sowohl den vollzogenen Vorgang als auch die Endgültigkeit der Szene.
theological_decisions:
- issue: Hochzeitsbild im Gleichnis
  choice: „Bräutigam“ und „Hochzeitsfest“ bleiben als gewöhnliche Erzählbilder stehen.
  alternative: Den Bräutigam ausdrücklich christologisch identifizieren oder das Fest als endzeitliches Mahl bezeichnen.
  rationale: Die theologische Bedeutung soll sich aus Gleichnis und Kontext ergeben. Eine ausdrückliche Deutung im Vers würde über den griechischen Wortlaut hinausgehen.
- issue: Die Bereitschaft der Frauen
  choice: „Diejenigen, die bereit waren“ ohne Erklärung, worin ihre Bereitschaft bestand.
  alternative: „Die vorbereiteten Frauen“ oder eine ausdrückliche Bezugnahme auf das mitgebrachte Öl.
  rationale: ἕτοιμοι bezeichnet ihren Zustand als bereit; eine nähere geistliche oder gegenständliche Bestimmung wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah an der griechischen Erzählstruktur; zugleich vermeiden „um einzukaufen“ und „gingen … hinein“ unnötig steife Formulierungen.
