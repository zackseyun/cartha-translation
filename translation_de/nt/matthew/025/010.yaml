review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung bildet den Genitivus absolutus mit gleichzeitigem Handlungsverlauf angemessen ab und gibt ἀπέρχομαι als Bewegung weg vom bisherigen Ort wieder. Der Zweckinfinitiv ἀγοράσαι ist korrekt mit „um einzukaufen“ wiedergegeben, ohne das im Vers nicht genannte Öl einzutragen. „Bräutigam“, „bereit waren“, das gemeinsame Hineingehen und das Passiv in „die Tür wurde verschlossen“ entsprechen dem griechischen Text. „Hochzeitsfest“ ist für εἰς τοὺς γάμους eine sachgerechte, nicht überinterpretierende Wiedergabe.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Formulierung „gingen mit ihm zum Hochzeitsfest hinein“ ist leicht bibelnah, aber grammatisch verständlich und wahrt die im Griechischen ausgedrückte Eintrittsbewegung besser als eine bloße Teilnahmeformulierung.
  terminology: „Bräutigam“ und „Hochzeitsfest“ sind konsistent mit der Bildsprache. Die Fußnote erläutert die mögliche Weite von γάμοι zutreffend und neutral. Es werden keine christologischen oder sonstigen theologischen Deutungen in den Text eingetragen.
