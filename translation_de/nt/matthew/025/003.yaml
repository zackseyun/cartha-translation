base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: de
  text: Denn die Törichten nahmen ihre Lampen[a], nahmen aber kein Öl mit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Fackeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung bzw. Erläuterung zur vorangehenden Aussage ein und bewahrt den Zusammenhang natürlich.
- source_word: μωραὶ
  choice: die Törichten
  rationale: Das substantivierte feminine Adjektiv verweist auf die zuvor genannten jungen Frauen; im Deutschen ist die knappe Rückverweisung verständlich.
- source_word: λαβοῦσαι … οὐκ ἔλαβον
  choice: nahmen zwar … aber … nicht mit
  rationale: Gibt den Gegensatz zwischen dem Mitnehmen der Lampen und dem Nichtmitnehmen von Öl idiomatisch wieder; „mitnehmen“ erfasst im Deutschen den Sinn des zweiten Verbs zusammen mit μεθ’ ἑαυτῶν.
- source_word: λαμπάδας
  choice: Lampen
  rationale: Traditionelle und im Zusammenhang mit Öl gut verständliche Wiedergabe; je nach Bauart können auch Fackeln gemeint sein.
- source_word: μεθ’ ἑαυτῶν
  choice: mit
  rationale: Ist im deutschen trennbaren Verb „mitnehmen“ idiomatisch enthalten.
- source_word: ἔλαιον
  choice: Öl
  rationale: Direkte und kontextgerechte Wiedergabe des Brennstoffs.
