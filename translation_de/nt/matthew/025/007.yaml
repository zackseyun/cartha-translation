  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: de
  text: Da standen alle diese Jungfrauen auf und machten ihre Lampen[a] bereit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fackeln“. Das griechische Wort kann eine tragbare Lampe oder eine Fackel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Markiert den nächsten Schritt der Erzählung knapp und idiomatisch; „Dann“ wäre ebenfalls möglich.
- source_word: ἠγέρθησαν
  choice: standen ... auf
  rationale: Das passive Aoristverb bezeichnet hier im Kontext des Schlafens das Aufstehen; eine ausdrückliche Wiedergabe als „wurden geweckt“ würde die mögliche Nuance unnötig festlegen.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: alle diese Jungfrauen
  rationale: Bewahrt sowohl die Gesamtheit als auch die demonstrative Rückverweisung und gibt παρθένοι im Hochzeitskontext lexikalisch präzise wieder.
- source_word: ἐκόσμησαν
  choice: machten ... bereit
  rationale: κοσμέω bedeutet hier, die Lichtquellen zu ordnen beziehungsweise für ihren Einsatz herzurichten. „Bereitmachen“ ist natürlich und vermeidet die technisch engere Annahme, ausschließlich die Dochte seien gekürzt worden.
- source_word: λαμπάδας
  choice: Lampen
  rationale: λαμπάς kann Lampe oder Fackel bezeichnen. Wegen des erwähnten Öls und des Herrichtens ist „Lampen“ im Deutschen eine gut verständliche Hauptlesart; „Fackeln“ bleibt möglich.
- source_word: ἑαυτῶν
  choice: ihre
  rationale: Der reflexive Genitiv bezeichnet den Besitz der Jungfrauen; das einfache Possessivpronomen ist im Deutschen ausreichend, ohne die nicht verlangte Betonung „ihre eigenen“.
theological_decisions: []
