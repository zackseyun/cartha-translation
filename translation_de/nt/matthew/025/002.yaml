id: MAT.25.2
reference: Matthew 25:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: de
  text: Fünf von ihnen waren töricht und fünf klug.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: fünf
  rationale: Die Kardinalzahl wird direkt mit „fünf“ wiedergegeben. Die Wiederholung bewahrt die ausgewogene Gegenüberstellung des griechischen Satzes.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ knüpft hier nur leicht an den vorherigen Vers an. Im Deutschen ist diese Verbindung ohne ein ausdrückliches „aber“ oder „und“ natürlicher; der Gegensatz liegt bereits in „töricht“ und „klug“.
- source_word: ἐξ αὐτῶν
  choice: von ihnen
  rationale: Die partitive Wendung bezeichnet fünf Personen aus der zuvor genannten Gruppe; „von ihnen“ ist die natürliche und genaue deutsche Formulierung.
- source_word: ἦσαν
  choice: waren
  rationale: Der Imperfekt von εἰμί dient hier als Kopula in einer Beschreibung und wird idiomatisch mit dem Präteritum „waren“ wiedergegeben.
- source_word: μωραὶ
  choice: töricht
  rationale: μωρός bezeichnet fehlende Einsicht oder vernünftige Urteilskraft. „Töricht“ wahrt den deutlichen Kontrast und den würdigen Ton der Erzählung.
- source_word: φρόνιμοι
  choice: klug
  rationale: φρόνιμος kann „klug“, „verständig“ oder „umsichtig“ bedeuten. „Klug“ bildet im Deutschen einen natürlichen, prägnanten Gegensatz zu „töricht“, ohne über die Aussage hinauszugehen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Satzführung. Die feminine Form der griechischen Adjektive ergibt sich im Deutschen aus dem Bezug auf die im vorigen Vers genannten jungen Frauen, muss hier jedoch nicht eigens markiert werden.
