source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: de
  text: 'Und der, der die fünf Talente[b] erhalten hatte, trat vor und brachte weitere fünf Talente und sagte: »Herr[a], fünf Talente hast du mir übergeben. Sieh, weitere fünf Talente habe ich gewonnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gebieter«. Griechisch: Kyrios.'
    reason: alternative_reading
  - marker: b
    text: Ein Talent war eine sehr große Gewichts- und Geldeinheit.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: trat … vor
  rationale: Das Aoristpartizip bezeichnet das Herantreten des Dieners zur Übergabe und Berichterstattung. „Trat vor“ ist in dieser Szene natürlich und bewahrt die gerichtete Annäherung.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: der, der die fünf Talente erhalten hatte
  rationale: Die substantivierte Partizipialkonstruktion kennzeichnet den Diener durch den vorausgegangenen Empfang. Das Plusquamperfekt macht die zeitliche Vorordnung gegenüber seinem Vortreten deutlich, ohne „Mann“ oder „Diener“ an dieser Stelle hinzuzufügen.
- source_word: τάλαντα
  choice: Talente
  rationale: τάλαντον bezeichnet eine große Gewichts- und daraus abgeleitete Geldeinheit. „Talente“ erhält den historischen Begriff und vermeidet eine unbelegte Festlegung auf Gold oder eine moderne Währung; eine Fußnote erklärt den monetären Sinn.
- source_word: προσήνεγκεν
  choice: brachte
  rationale: προσφέρω bezeichnet hier das Herbeibringen der zusätzlich gewonnenen Summe. „Brachte“ ist klar und vermeidet den möglichen kultischen Beiklang von „darbringen“.
- source_word: ἄλλα πέντε τάλαντα
  choice: weitere fünf Talente
  rationale: ἄλλα mit der Zahl bezeichnet eine zusätzliche gleich große Menge. „Weitere fünf Talente“ ist im Deutschen natürlicher als „andere fünf Talente“ und wahrt die Wiederholung.
- source_word: Κύριε
  choice: Herr
  rationale: In der Anrede bezeichnet κύριος innerhalb des Gleichnisses den Herrn des Dieners. „Herr“ ist die direkte, kontextgerechte deutsche Entsprechung und lässt mögliche weitere matthäische Resonanzen offen.
- source_word: παρέδωκας
  choice: hast du mir übergeben
  rationale: παραδίδωμι bedeutet grundlegend „übergeben/überantworten“. „Übergeben“ bleibt näher am Wortlaut als das stärker deutende „anvertrauen“ und ist im Deutschen verständlich.
- source_word: ἴδε
  choice: Sieh
  rationale: ἴδε ist ein aufmerksamkeitslenkender Imperativ. „Sieh“ bewahrt diese direkte Aufforderung in würdiger, heutiger Sprache; „siehe“ wäre stärker traditionell geprägt.
- source_word: ἐκέρδησα
  choice: habe ich dazugewonnen
  rationale: κερδαίνω bezeichnet Gewinn oder Mehrung. „Dazugewonnen“ macht im Kontext deutlich, dass die ursprüngliche Summe um einen gleichen Betrag vermehrt wurde, ohne den Vorgang als Lohnarbeit zu deuten.
theological_decisions:
- issue: Wiedergabe von κύριος in der Anrede des Gleichnisses
  choice: Herr
  alternative: Gebieter; Herr und Meister
  rationale: Das Wort bezeichnet unmittelbar den Herrn des Dieners, kann im matthäischen Erzählzusammenhang aber auch weitergehende Resonanz haben. „Herr“ bewahrt beide Ebenen, ohne die Figur ausdrücklich mit Christus gleichzusetzen.
- issue: Bedeutung von παραδίδωμι bei der Geldübergabe
  choice: übergeben
  alternative: anvertraut
  rationale: Das Gleichnis setzt Verantwortung voraus, doch das Verb selbst bezeichnet zunächst die Übergabe. Die Übersetzung vermeidet es daher, die implizierte Treuhandbeziehung bereits ausdrücklich in das Verb einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp und lebendig. Der historische Ausdruck „Talent“ wird beibehalten, aber wegen der heutigen Hauptbedeutung „Begabung“ durch eine Kulturfußnote erläutert.
