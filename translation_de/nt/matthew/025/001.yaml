  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: de
  text: Dann wird es mit dem Himmelreich sein wie mit zehn Jungfrauen[a], die ihre Lampen[b] nahmen und hinausgingen, dem Bräutigam entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, unter ausdrücklicher Wiedergabe der passiven griechischen Form: „Dann wird das Himmelreich mit zehn Jungfrauen verglichen werden.“'
    reason: grammatical_alternative
  - marker: b
    text: 'Oder: „Fackeln“. Das griechische Wort kann eine tragbare Lampe oder eine Fackel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Natürlicher zeitlicher Anschluss an den vorausgehenden endzeitlichen Zusammenhang.
- source_word: ὁμοιωθήσεται
  choice: wird es ... sein wie mit
  rationale: Gibt die zukünftige Vergleichsformel im Deutschen idiomatisch wieder; die passive Form und die näher am Wortlaut liegende Alternative werden in einer Fußnote bewahrt.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Eingebürgerte, prägnante deutsche Wiedergabe der matthäischen Wendung; gemeint ist Gottes Königsherrschaft.
- source_word: δέκα παρθένοις
  choice: zehn junge Frauen
  rationale: Im Hochzeitszusammenhang bezeichnet παρθένοις junge unverheiratete Frauen; die traditionelle, lexikalisch engere Wiedergabe „Jungfrauen“ bleibt als Fußnote erhalten.
- source_word: λαβοῦσαι
  choice: nahmen
  rationale: Das vorausgehende Aoristpartizip wird in natürlichem Deutsch als finites Verb wiedergegeben.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: ihre Lampen
  rationale: λαμπάς kann eine Lampe oder Fackel bezeichnen. „Lampen“ wahrt die vertraute Bildsprache, während „Fackeln“ als plausible Alternative vermerkt wird.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: gingen hinaus, ... entgegen
  rationale: Die deutsche Konstruktion „jemandem entgegengehen“ gibt die zielgerichtete Begegnung natürlich und genau wieder.
- source_word: τοῦ νυμφίου
  choice: dem Bräutigam
  rationale: Direkte und im Hochzeitszusammenhang eindeutige Wiedergabe von νυμφίος.
theological_decisions:
- issue: Vergleichsformel des Gleichnisses
  choice: Dann wird es mit dem Himmelreich sein wie mit zehn jungen Frauen
  alternative: Dann wird das Himmelreich mit zehn jungen Frauen verglichen werden
  rationale: Die Hauptfassung ist idiomatisches modernes Deutsch und behält Zukunft und Vergleich bei. Die Alternative macht das grammatische Passiv des griechischen Verbs ausdrücklich sichtbar, ohne daraus eine andere theologische Aussage abzuleiten.
- issue: Bedeutungsumfang von παρθένοις
  choice: junge Frauen
  alternative: Jungfrauen
  rationale: Im antiken Hochzeitsrahmen sind junge unverheiratete Frauen gemeint. Die Hauptfassung vermeidet im modernen Deutschen eine möglicherweise vorrangig sexualethische Zuspitzung; die traditionelle und formal engere Wiedergabe wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Gleichnisformel. „Himmelreich“ hält den vertrauten matthäischen Sprachgebrauch fest; die Fußnoten bewahren echte lexikalische und grammatische Alternativen.
