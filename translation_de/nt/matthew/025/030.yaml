id: MAT.25.30
reference: Matthew 25:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: de
  text: Und werft den nutzlosen Sklaven[a] hinaus in die äußerste Finsternis. Dort wird Weinen und Zähneknirschen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort doulos kann je nach Zusammenhang „Sklave“ oder „Diener“ bedeuten. Hier wird wegen des in der Parabel hervortretenden Abhängigkeitsverhältnisses „Sklave“ verwendet.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: nutzlosen
  rationale: Das Adjektiv bezeichnet hier jemanden, der sich für seinen Herrn als unbrauchbar beziehungsweise ohne Nutzen erwiesen hat. „Nutzlos“ ist gegenwärtiges, verständliches Deutsch und wahrt die Schärfe des Urteils, ohne darüber hinaus einen grundsätzlichen Unwert der Person zu behaupten.
- source_word: δοῦλον
  choice: Sklaven
  rationale: δοῦλος kann je nach Zusammenhang mit „Diener“ oder „Sklave“ wiedergegeben werden. In dieser Parabel ist das rechtlich und sozial gebundene Verhältnis zum Herrn deutlich, weshalb „Sklave“ den antiken Kontext genauer abbildet.
- source_word: ἐκβάλετε
  choice: werft … hinaus
  rationale: Der Aorist-Imperativ ist nachdrücklich. Die trennbare Wendung „hinauswerfen“ gibt sowohl die Gewalt als auch die Bewegung aus dem bisherigen Bereich heraus natürlich wieder.
- source_word: σκότος τὸ ἐξώτερον
  choice: die äußerste Finsternis
  rationale: Die feste matthäische Wendung bezeichnet den dunklen Bereich außerhalb des Ortes der Gemeinschaft und Freude. „Äußerste Finsternis“ ist im Deutschen prägnant, würdevoll und als Gerichtssprache verständlich.
- source_word: ἐκεῖ
  choice: Dort
  rationale: „Dort“ verweist knapp und eindeutig auf die unmittelbar zuvor genannte Finsternis.
- source_word: κλαυθμὸς
  choice: Weinen
  rationale: „Weinen“ gibt den Ausdruck schlicht wieder und vermeidet, die Intensität durch „Heulen“ oder „Wehklagen“ stärker festzulegen, als es der griechische Ausdruck verlangt.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: Zähneknirschen
  rationale: Die etablierte deutsche Wendung bewahrt das Bild von Qual und möglicherweise auch Wut, ohne zwischen diesen Deutungsmöglichkeiten zu entscheiden.
theological_decisions:
- issue: Art des in der Parabel dargestellten Gerichts
  choice: Die Bilder von Ausschluss, Finsternis, Weinen und Zähneknirschen bleiben ohne zusätzliche dogmatische Bestimmung stehen.
  alternative: Die Finsternis ausdrücklich als Hölle oder alternativ nur als zeitliche beziehungsweise rein metaphorische Strafe bezeichnen.
  rationale: Der Vers verwendet markante matthäische Gerichtssprache, benennt an dieser Stelle aber keine weitergehende dogmatische Kategorie. Die Übersetzung bewahrt daher Bild und Spannung des Textes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die bekannte matthäische Formel „Weinen und Zähneknirschen“ bleibt erhalten; altertümliche Formen wie „Knecht“ oder „hinausstoßen“ werden vermieden.
