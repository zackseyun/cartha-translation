  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: de
  text: 'Er aber antwortete: »Amen, ich sage euch: Ich kenne euch nicht.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich erkenne euch nicht.« Wörtlicher lautet das Griechische: »Ich kenne euch nicht«; im Zusammenhang kann damit eine relationale Nichtanerkennung gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Er aber antwortete
  rationale: Die partizipiale Erzählformel wird im natürlichen Deutschen ohne das redundante »antwortete und sagte« wiedergegeben; »aber« bewahrt den durch δέ markierten Gegensatz zur vorausgehenden Bitte.
- source_word: Ἀμὴν
  choice: Amen
  rationale: Das vorangestellte »Amen« ist in Jesu feierlicher Bekräftigungsformel auch im Deutschen verständlich und bewahrt die markante Form des griechischen Ausdrucks.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Wendung bildet die direkte, feierliche Anrede natürlich und quellennah ab; »euch« bewahrt den Plural.
- source_word: οὐκ οἶδα ὑμᾶς
  choice: Ich kenne euch nicht
  rationale: οἶδα bezeichnet hier ein Kennen, das im Kontext zugleich Nichtanerkennung und Beziehungsausschluss anklingen lassen kann. Die schlichte Formulierung wahrt diese Bedeutungsweite, ohne sie auszudeuten.
theological_decisions:
- issue: Tragweite von »Ich kenne euch nicht« im Gleichnis
  choice: Die relationale und ausschließende, aber textlich schlichte Aussage »Ich kenne euch nicht« bleibt im Haupttext stehen.
  alternative: »Ich erkenne euch nicht an« oder »Ich habe keine Beziehung zu euch«
  rationale: Der Kontext lässt Nichtanerkennung und Ausschluss mitschwingen, doch eine explizitere Formulierung würde die theologische Tragweite stärker festlegen, als es der griechische Wortlaut tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bekräftigungsformel »Amen, ich sage euch« bleibt wegen ihrer Prägnanz und Quellennähe erhalten. Der Gruppenbezug des pluralischen ὑμᾶς ist durch »euch« wiedergegeben.
