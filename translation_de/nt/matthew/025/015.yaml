  source_fidelity: 'Die Auslassung von »εὐθέως« im deutschen Vers ist sachgerecht, sofern die SBLGNT-Satzgliederung und die übliche Versabgrenzung befolgt werden: Das Adverb eröffnet syntaktisch Vers 16 (zu πορευθείς) und modifiziert nicht ἀπεδήμησεν. Die Wiedergabe von τάλαντα als »Talente« mit erklärender Fußnote und von δύναμις als »Fähigkeit« ist quellentreu. »dem dritten« ist jedoch etwas stärker ordnend als die griechische Wiederholung von ᾧ δέ.'
  naturalness: Der Satz ist klar und modernes Standarddeutsch. »Dann reiste er ab« fügt allerdings mit »Dann« eine nicht ausdrücklich markierte zeitliche Sequenz hinzu; »und reiste ab« entspricht dem griechischen καί genauer und bleibt idiomatisch.
  terminology: »Talente« ist als historischer Terminus angemessen, muss aber gegen die moderne Bedeutung von Begabung erläutert werden; die Fußnote leistet dies. »Fähigkeit« trifft die hier gemeinte persönliche Kapazität. Die Erklärung als Geld- beziehungsweise Gewichtseinheit ist im Kern richtig, kann fachlich präziser als Gewichts- und Rechnungseinheit formuliert werden.
