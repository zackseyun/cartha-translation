- from: Dem einen gab er fünf Talente[a], dem anderen zwei und dem dritten eines – jedem nach seiner eigenen Fähigkeit[b]. Dann reiste er ab.
  to: Dem einen gab er fünf Talente[a], einem anderen zwei und einem weiteren eines – jedem nach seiner eigenen Fähigkeit[b] –, und reiste ab.
  rationale: Die Revision entfernt die geringfügige, nicht im Ausgangstext markierte zeitliche Ergänzung »Dann« und gibt die dreifache distributive Empfängerreihe ohne zusätzliche Ordinalisierung wieder. Das Satzzeichen um die distributive Erläuterung verbessert die Zuordnung zu allen drei Gaben. »εὐθέως« wird nicht in diesen Vers aufgenommen, da es nach der SBLGNT-Interpunktion syntaktisch den Beginn von Vers 16 bildet; dadurch wird weder der Vers 15 verkürzt noch eine umstrittene Anschlussmöglichkeit dogmatisch entschieden.
