  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: de
  text: Dem einen gab er fünf Talente[a], einem anderen zwei und einem weiteren eines – jedem nach seiner eigenen Fähigkeit[b] –, und reiste ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine sehr große Gewichts- und Rechnungseinheit; hier ist keine natürliche Begabung gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »jedem entsprechend seiner Leistungsfähigkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τάλαντα
  choice: Talente
  rationale: Der historische Begriff bezeichnet hier große Geld- beziehungsweise Gewichtseinheiten, nicht natürliche Begabungen. Die Fußnote verhindert das im modernen Deutschen naheliegende Missverständnis.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: dem einen ... dem anderen ... dem dritten
  rationale: Diese natürliche deutsche Verteilungskonstruktion gibt die abgestufte Zuweisung an drei verschiedene Diener klar wieder.
- source_word: ἕν
  choice: eines
  rationale: Das zuvor genannte sächliche Substantiv »Talent« ist mitzudenken; »eines« wahrt die Ellipse des Griechischen und klingt im Deutschen natürlich.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: jedem nach seiner eigenen Fähigkeit
  rationale: δύναμις bezeichnet hier die persönliche Leistungsfähigkeit beziehungsweise Kapazität, nicht Wunderkraft. Die singularische distributive Form des Griechischen bleibt erhalten.
- source_word: ἀπεδήμησεν
  choice: reiste er ab
  rationale: Das Verb bezeichnet das Fortgehen, häufig mit der Nuance einer Reise oder eines Aufenthalts in der Ferne; »reiste ab« ist knapp und idiomatisch.
- source_word: εὐθέως
  choice: nicht in Vers 15 aufgenommen
  rationale: In der vorgelegten SBLGNT-Interpunktion steht εὐθέως nach dem Satzschluss und eröffnet Vers 16 (»Sofort ging ...«). Es wird daher nicht entgegen dieser Gliederung auf das Abreisen in Vers 15 bezogen.
theological_decisions:
- issue: Bedeutung der anvertrauten Talente
  choice: historische Geld- beziehungsweise Gewichtseinheiten
  alternative: natürliche Begabungen
  rationale: Im unmittelbaren Erzählzusammenhang wird Vermögen anvertraut. Die moderne übertragene Bedeutung von »Talent« darf nicht in den wörtlichen Handlungssinn eingetragen werden.
- issue: Bezug von εὐθέως
  choice: Beginn der Handlung in Vers 16
  alternative: »und reiste sofort ab«
  rationale: Die Satzgliederung der angegebenen griechischen Ausgabe setzt den Abschluss nach ἀπεδήμησεν; damit gehört εὐθέως syntaktisch zum folgenden πορευθείς. Die alternative Verbindung ist aufgrund antiker fehlender Originalinterpunktion grundsätzlich möglich, wird hier aber nicht stillschweigend bevorzugt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die distributive Reihung ist idiomatisch gestrafft; der Gedankenstrich hebt den Maßstab der Zuteilung hervor. »Talente« wahrt den vertrauten historischen Begriff, während die Fußnote seine heutige Mehrdeutigkeit klärt. Entsprechend der SBLGNT-Satzgliederung bleibt »sofort« Vers 16 vorbehalten.
