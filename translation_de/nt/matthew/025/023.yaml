  source_fidelity: 'Der deutsche Text gibt alle Elemente des griechischen Ausgangstextes vollständig und in der richtigen Beziehung wieder: die Rede des Herrn, die Anerkennung, den Kontrast zwischen Wenigem und Vielem, die künftige Einsetzung sowie die Aufforderung, in die Freude des Herrn einzugehen. Die Wiederholung von »treu« bildet πιστέ/πιστός sinnvoll ab.'
  naturalness: Der Wortlaut ist verständliches modernes Standarddeutsch mit angemessen würdigem Gleichnisregister. »Geh ein in die Freude deines Herrn« ist bewusst bildhaft und leicht gehoben, aber idiomatisch genug und dem griechischen Bild näher als eine erläuternde Paraphrase. »Über vieles werde ich dich setzen« ist in diesem Register verständlich und bewahrt den Parallelismus.
  terminology: »Herr« ist im erzählten Verhältnis angemessen und entspricht der wiederholten Verwendung von κύριος. »Diener« ist als Haupttextwiedergabe von δοῦλος vertretbar; die Fußnote macht die mögliche und sozialgeschichtlich stärkere Wiedergabe »Sklave« transparent. Die Fußnotenmarkierung ist korrekt bei »Diener« verankert.
