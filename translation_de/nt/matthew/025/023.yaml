id: MAT.25.23
reference: Matthew 25:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: de
  text: 'Sein Herr sagte zu ihm: »Gut gemacht, du guter und treuer Diener[a]! Über weniges warst du treu; über vieles werde ich dich setzen. Geh ein in die Freude deines Herrn!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklave«. Das griechische Wort δοῦλος kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: sagte
  rationale: Natürliche und genaue deutsche Wiedergabe der Redeeinleitung.
- source_word: κύριος
  choice: Herr
  rationale: Im Gleichnis bezeichnet das Wort den Herrn des Dieners. Das natürliche deutsche Begriffspaar »Herr/Diener« bewahrt zugleich die mögliche theologische Resonanz, ohne sie ausdrücklich festzulegen.
- source_word: δοῦλε
  choice: Diener
  rationale: »Diener« ist in diesem Gleichniskontext verständlich und bewahrt das hierarchische Verhältnis; die stärkere soziale Bedeutung »Sklave« wird in einer Fußnote ausgewiesen.
- source_word: Εὖ
  choice: Gut gemacht
  rationale: Idiomhafte deutsche Anerkennungsformel, die den knappen Ausruf εὖ treffend wiedergibt.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: guter und treuer
  rationale: Die Wortwahl bewahrt sowohl die Anredeform als auch die lexikalische Verbindung von πιστέ zum folgenden πιστός.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Über weniges warst du treu
  rationale: Die Formulierung bildet den Verantwortungsbereich und den betonten Gegensatz zu »über vieles« knapp und würdig ab.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: über vieles werde ich dich setzen
  rationale: Bewahrt die parallele Konstruktion und gibt καθίστημι als Einsetzung in erweiterte Verantwortung wieder.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Geh ein in die Freude
  rationale: Erhält das Bild des Eintretens, statt es deutend zu »Freude teilen« abzuflachen.
- source_word: τοῦ κυρίου σου
  choice: deines Herrn
  rationale: Entspricht der ersten Wiedergabe von κύριος und erhält die Beziehungsstruktur des Gleichnisses.
theological_decisions:
- issue: Wiedergabe von κύριος im Gleichnis
  choice: Herr
  alternative: Hausherr; Gebieter
  rationale: Der unmittelbare Bezug ist der menschliche Herr innerhalb der Erzählung. »Herr« ist im Deutschen kontextgerecht und lässt die weiterführende theologische Bedeutung des Gleichnisses offen, statt sie durch eine rein säkulare Festlegung auszuschließen.
- issue: Wiedergabe von δοῦλος
  choice: Diener
  alternative: Sklave
  rationale: Der Vers betont die treue Verwaltung unter der Autorität eines Herrn. »Diener« ist im modernen deutschen Haupttext natürlich; da δοῦλος auch einen Sklaven bezeichnen kann, wird diese sozialgeschichtlich stärkere Möglichkeit ausdrücklich vermerkt.
- issue: Bedeutung von εἴσελθε εἰς τὴν χαράν
  choice: Geh ein in die Freude
  alternative: Nimm teil an der Freude
  rationale: Die bildhafte räumliche Ausdrucksweise des Griechischen bleibt erhalten. Ob damit ein Fest, gemeinschaftliche Freude oder eine weitergehende eschatologische Wirklichkeit gemeint ist, wird nicht im Wortlaut entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar rhythmisiert; »über weniges/über vieles« wahrt den Parallelismus des griechischen Textes. »Geh ein in die Freude« erhält bewusst die ungewohnte, aber verständliche Bildsprache.
