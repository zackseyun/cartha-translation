base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: de
  text: Denn ich war hungrig, und ihr habt mir nichts zu essen gegeben; ich war durstig, und ihr habt mir nichts zu trinken gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: ich war hungrig
  rationale: Die idiomatische deutsche Zustandsbeschreibung gibt den Aorist von πεινάω natürlich und präzise wieder.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet hier im Zusammenhang das vorausgehende Urteil; „denn“ bewahrt diese erklärende Funktion.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: ihr habt mir nichts zu essen gegeben
  rationale: Die natürliche deutsche Wendung bewahrt sowohl das persönliche Dativobjekt μοι als auch den verbalen Gehalt des Infinitivs φαγεῖν.
- source_word: ἐδίψησα
  choice: ich war durstig
  rationale: Die Formulierung ist modernes, idiomatisches Deutsch und erhält die Parallelität zu „ich war hungrig“.
- source_word: ἐποτίσατέ με
  choice: ihr habt mir nichts zu trinken gegeben
  rationale: ποτίζω bezeichnet hier die Versorgung mit einem Getränk. Die Formulierung ist idiomatisch und entspricht parallel dem ersten Satzglied.
theological_decisions:
- issue: Explizitheit der verneinten Versorgung
  choice: Beide Aussagen werden mit „ihr habt mir nichts zu essen/zu trinken gegeben“ wiedergegeben.
  alternative: „Ihr habt mir nicht zu essen gegeben / ihr habt mich nicht trinken lassen.“
  rationale: Die gewählte Fassung macht die unterlassene persönliche Hilfe klar, ohne die Aussage im Gerichtskontext theologisch auszuweiten oder abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Der Parallelismus der beiden Halbverse und der persönliche Bezug auf „mir“ bleiben erhalten.
