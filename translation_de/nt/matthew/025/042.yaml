  source_fidelity: Die Übersetzung gibt die beiden aoristischen Zustandsaussagen ἐπείνασα und ἐδίψησα idiomatisch als „ich war hungrig/durstig“ wieder. γάρ ist mit „Denn“ zutreffend als Begründung markiert. Die Negationen sowie die persönliche Ausrichtung von μοι und με sind in „ihr habt mir nichts zu essen/zu trinken gegeben“ vollständig und parallel erfasst. Die Wiedergabe von ἐποτίσατέ με als Versorgung mit etwas zu trinken ist im Kontext sachgerecht.
