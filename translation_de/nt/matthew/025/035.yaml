id: MAT.25.35
reference: Matthew 25:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: de
  text: Denn ich war hungrig, und ihr habt mir zu essen gegeben; ich war durstig, und ihr habt mir zu trinken gegeben; ich war ein Fremder, und ihr habt mich aufgenommen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ihr habt mich zusammengebracht/versammelt“; hier ist die gastfreundliche Aufnahme eines Fremden gemeint. Auch möglich: „ihr habt mich beherbergt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: ich war hungrig
  rationale: Der Aorist bezeichnet hier die in der Vergangenheit erlebte Notlage; die Formulierung ist im heutigen Deutsch natürlich und genau.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die vorausgehende Aussage; „denn“ bewahrt diese erklärende Verknüpfung knapp und idiomatisch.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: ihr habt mir zu essen gegeben
  rationale: Die Konstruktion aus δίδωμι, Dativ und Infinitiv bezeichnet das Gewähren von Nahrung und lässt sich so natürlich und quellennah wiedergeben.
- source_word: ἐδίψησα
  choice: ich war durstig
  rationale: Die Wendung gibt den erlebten Zustand in klarem, modernem Deutsch wieder.
- source_word: ἐποτίσατέ με
  choice: ihr habt mir zu trinken gegeben
  rationale: ποτίζω bedeutet in diesem fürsorglichen Kontext, jemanden mit einem Getränk zu versorgen; die Formulierung wahrt zudem den Parallelismus.
- source_word: ξένος
  choice: ein Fremder
  rationale: ξένος bezeichnet hier einen Menschen ohne vertraute soziale Zugehörigkeit und gesicherte Aufnahme; „Fremder“ bewahrt die breite Bedeutung, ohne sie auf Nationalität oder Rechtsstatus einzuengen.
- source_word: συνηγάγετέ με
  choice: ihr habt mich aufgenommen
  rationale: συνάγω bedeutet wörtlich „zusammenbringen/sammeln“, bezeichnet hier in Verbindung mit ξένος aber die gastfreundliche Aufnahme. „Aufgenommen“ ist im Deutschen natürlich und lässt offen, ob besonders das Haus oder die Gemeinschaft gemeint ist.
theological_decisions:
- issue: Gastfreundschaft in ξένος … συνηγάγετέ με
  choice: „ich war ein Fremder, und ihr habt mich aufgenommen“
  alternative: „ich war fremd, und ihr habt mich beherbergt“
  rationale: Die gewählte Fassung bringt persönliche, barmherzige Aufnahme zum Ausdruck, ohne moderne Kategorien wie Staatsangehörigkeit oder Aufenthaltsstatus einzutragen. Zugleich verengt „aufgenommen“ den Sinn weniger stark auf Unterkunft als „beherbergt“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der dreifache Parallelismus des griechischen Satzes bleibt erhalten; „Denn“ wahrt den begründenden Anschluss an den vorherigen Vers.
