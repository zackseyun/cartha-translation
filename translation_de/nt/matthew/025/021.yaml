  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: de
  text: 'Sein Herr sagte zu ihm: »Sehr gut, du guter und treuer Diener[a]! Du hast dich in wenigen Dingen als treu erwiesen; ich werde dich über viele Dinge setzen. Tritt ein in die Freude deines Herrn!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklave«. Das griechische Wort doulos bezeichnet einen Diener und häufig genauer einen Sklaven.'
    reason: lexikalische Alternative und historische Statusbezeichnung
lexical_decisions:
- source_word: ἔφη
  choice: sagte
  rationale: Die übliche und natürliche deutsche Wiedergabe der Redeeinleitung mit φημί.
- source_word: κύριος
  choice: Herr
  rationale: »Herr« bezeichnet im unmittelbaren Gleichniskontext den Herrn des Dieners und lässt zugleich den möglichen theologischen Bezug des Gleichnisses offen.
- source_word: δοῦλε
  choice: Diener
  rationale: »Diener« ist in der Anrede natürlich und verständlich; die in δοῦλος enthaltene unfreie Rechtsstellung wird wegen ihrer sachlichen Bedeutung in einer Fußnote als Alternative ausgewiesen.
- source_word: Εὖ
  choice: Sehr gut
  rationale: Gibt den anerkennenden Ausruf idiomatisch wieder, ohne dem folgenden ἀγαθὲ sein eigenes »gut« zu nehmen.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: guter und treuer
  rationale: Bewahrt beide ausdrücklichen Eigenschaften in ihrer knappen parallelen Form.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Über Weniges warst du treu
  rationale: Bewahrt die Vorstellung eines anvertrauten Verantwortungsbereichs und die Verbindung mit dem folgenden ἐπὶ πολλῶν.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: über Vieles werde ich dich setzen
  rationale: Gibt καθίστημι als Einsetzung in größere Verantwortung wieder und erhält den Gegensatz zwischen Wenigem und Vielem.
- source_word: εἴσελθε εἰς τὴν χαράν
  choice: Tritt ein in die Freude
  rationale: Bewahrt das räumliche Bild des Eintretens, statt es auf bloße Teilnahme zu reduzieren.
theological_decisions:
- issue: κύριος kann auf der Erzählebene den Herrn des Dieners und auf der Gleichnisebene möglicherweise Gott oder Christus bezeichnen.
  choice: Herr
  alternative: Gebieter; Hausherr
  rationale: Das deutsche »Herr« passt zur sozialen Beziehung im Gleichnis und bewahrt zugleich die mögliche theologische Resonanz, ohne sie ausdrücklich festzulegen.
- issue: Sozialer Status von δοῦλος
  choice: Diener mit Fußnote
  alternative: Sklave
  rationale: »Diener« ergibt eine natürliche moderne Anrede, während die Fußnote transparent macht, dass das griechische Wort auch und in diesem antiken Kontext wahrscheinlich konkreter »Sklave« bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst gehobene Wendung »Tritt ein in die Freude« erhält das Bild des griechischen Textes; »über Weniges/Vieles setzen« wahrt den engen Parallelismus und die Vorstellung übertragener Verantwortung.
