  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzfolge und den Sinn des griechischen Textes zuverlässig wieder: τότε („Dann“), das Futur von ἀποκρίνομαι („wird ... antworten“), die feierliche Formel Ἀμὴν λέγω ὑμῖν („Wahrlich, ich sage euch“), den repräsentativen Singular („einem von diesen Geringsten“) sowie die nachdrücklich parallele Negation sind erhalten. Die Konstruktion „Was ..., das ...“ gibt die durch ἐφ’ ὅσον markierte Zuordnung der unterlassenen Handlung zu Jesus idiomatisch wieder, ohne sie unzulässig kausal zuzuspitzen.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Der Doppelpunkt ist eine natürliche Wiedergabe des begleitenden λέγων vor direkter Rede. Die korrelative Satzform ist im Deutschen klar und bewahrt den rhetorischen Parallelismus.
  terminology: „Geringsten“ ist eine treffende, traditionsbewusste und zugleich verständliche Wiedergabe von ἐλαχίστων. Die Formulierung entscheidet nicht vorzeitig, ob die Gruppe enger auf Jesu Jünger oder weiter auf Notleidende bezogen ist. „Wahrlich“ wahrt den feierlichen Registerwert der Jesusformel; die Fußnote dokumentiert die formnähere Alternative mit „Amen“.
