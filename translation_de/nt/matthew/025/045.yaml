id: MAT.25.45
reference: Matthew 25:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: de
  text: 'Dann wird er ihnen antworten: »Wahrlich, ich sage euch[a]: Was ihr einem von diesen Geringsten[b] nicht getan habt, das habt ihr auch mir nicht getan.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: »Amen, ich sage euch.«'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Geringsten« können speziell die Jünger Jesu oder weiter gefasst niedrige und bedürftige Menschen gemeint sein; die Übersetzung lässt die Formulierung des Textes offen.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Kennzeichnet in der Gerichtsszene die zeitliche Abfolge und ist im Deutschen natürlich und prägnant.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: wird er ihnen antworten
  rationale: Gibt das futurische ἀποκριθήσεται und das Dativobjekt αὐτοῖς genau wieder; das begleitende λέγων wird durch den Doppelpunkt idiomatisch in die direkte Rede überführt.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Wahrlich, ich sage euch
  rationale: Bewahrt Feierlichkeit und Nachdruck der festen Einleitungsformel Jesu in verständlichem Deutsch; die formnähere Wiedergabe mit „Amen“ wird in der Fußnote genannt.
- source_word: ἐφ’ ὅσον οὐκ ἐποιήσατε
  choice: Was ihr … nicht getan habt
  rationale: Die korrelative deutsche Konstruktion „Was …, das …“ gibt den Bezug zwischen unterlassener Tat und der auf Jesus bezogenen Folgerung natürlich wieder, ohne die Wendung kausal auf „weil“ zu verengen.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: einem von diesen Geringsten
  rationale: Bewahrt den repräsentativen Singular, den Demonstrativbezug „diesen“ und den superlativischen Ausdruck „Geringsten“.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: das habt ihr auch mir nicht getan
  rationale: Wiederholt das Verb entsprechend dem griechischen Parallelismus. „Auch … nicht“ ist hier eine natürliche deutsche Wiedergabe des negativen οὐδέ.
theological_decisions:
- issue: Identität der „Geringsten“
  choice: Die Formulierung „einem von diesen Geringsten“ bleibt ohne nähere Bestimmung stehen.
  alternative: Die Gruppe ausdrücklich als Jesu Jünger beziehungsweise Boten oder allgemein als Arme und Bedürftige bestimmen.
  rationale: Der Vers identifiziert die unterlassene Zuwendung zu den Geringsten unmittelbar mit einer Unterlassung gegenüber Jesus, legt aber in diesem Satz allein nicht eindeutig fest, wie weit die bezeichnete Gruppe zu fassen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt ersetzt das im Deutschen schwerfällige partizipiale „sagend“. Die korrelative Form „Was …, das …“ ist idiomatisch und erhält den pointierten Parallelismus des griechischen Satzes.
