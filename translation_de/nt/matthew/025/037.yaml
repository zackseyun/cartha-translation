id: MAT.25.37
reference: Matthew 25:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: de
  text: 'Dann werden ihm die Gerechten antworten: »Herr, wann haben wir dich hungrig gesehen und dir zu essen gegeben oder durstig und dir zu trinken gegeben?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das temporale Adverb kennzeichnet die Abfolge im vorausgehenden Gerichtsgeschehen; „Dann“ ist knapp und natürlich.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: werden ihm … antworten
  rationale: ἀποκρίνομαι hat trotz seiner medialen Form aktive Bedeutung; der Dativ αὐτῷ wird im Deutschen idiomatisch mit „ihm“ wiedergegeben.
- source_word: οἱ δίκαιοι
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet die in der Szene als gerecht Anerkannten. „Die Gerechten“ bewahrt diese Aussage ohne erklärenden Zusatz.
- source_word: λέγοντες
  choice: Doppelpunkt vor der direkten Rede
  rationale: Das Partizip leitet die wörtliche Rede ein. Im Deutschen gibt ein Doppelpunkt diese Funktion natürlicher wieder als das schwerfällige „indem sie sagen“.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος ist hier eine direkte Anrede an Jesus; „Herr“ bewahrt sowohl den respektvollen als auch den möglichen christologischen Klang.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: hungrig … und dir zu essen gegeben
  rationale: πεινῶντα bezeichnet den wahrgenommenen Zustand; τρέφω meint hier die konkrete Versorgung mit Nahrung. Die deutsche Wendung ist natürlich und gibt den Sinn präzise wieder.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: durstig … und dir zu trinken gegeben
  rationale: ποτίζω bedeutet, jemanden trinken zu lassen beziehungsweise ihm zu trinken zu geben. Die gewählte Formulierung ist idiomatisch und bleibt nahe an der konkreten Handlung.
theological_decisions:
- issue: Wiedergabe von κύριος in der Anrede an Jesus
  choice: Herr
  alternative: Meister
  rationale: „Herr“ entspricht dem üblichen Bedeutungsbereich von κύριος und erhält die im Matthäusevangelium mögliche christologische Tragweite, ohne sie über den Wortlaut hinaus auszudeuten.
- issue: Bezeichnung οἱ δίκαιοι
  choice: die Gerechten
  alternative: die gerecht Gesprochenen
  rationale: Der griechische Ausdruck benennt sie als „die Gerechten“, legt aber an dieser Stelle nicht ausdrücklich fest, ob damit ihr Verhalten, ihr Status oder ein richterlicher Zuspruch hervorgehoben wird. Die knappe Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählton. Die parallele Satzstruktur von „hungrig … zu essen“ und „durstig … zu trinken“ bleibt erhalten; die direkte Rede wird nach deutscher Zeichensetzung mit einem Doppelpunkt eingeleitet.
