id: MAT.25.33
reference: Matthew 25:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: de
  text: Und er wird die Schafe zu seiner Rechten aufstellen, die jungen Ziegen[a] aber zu seiner Linken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Zicklein.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch wörtlich: „von seiner Rechten … von der Linken“; eine idiomatische Ausdrucksweise für die Aufstellung auf der rechten beziehungsweise linken Seite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: wird … aufstellen
  rationale: Das transitive ἵστημι bedeutet hier, jemanden oder etwas an einer bestimmten Stelle aufzustellen. „Aufstellen“ bewahrt das räumliche Bild und klingt im Deutschen natürlich.
- source_word: τὰ μὲν πρόβατα
  choice: die Schafe
  rationale: πρόβατα ist die übliche Bezeichnung für Schafe; der Artikel verweist auf die im vorherigen Vers unterschiedenen Gruppen.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: zu seiner Rechten
  rationale: Die Wendung bezeichnet idiomatisch die Position auf seiner rechten Seite. „Zu seiner Rechten“ ist klar, würdevoll und im Deutschen geläufig.
- source_word: τὰ δὲ ἐρίφια
  choice: die Ziegenböckchen
  rationale: ἐρίφια bezeichnet genauer junge Ziegen, besonders Böckchen. „Ziegenböckchen“ erhält diese gegenüber dem allgemeinen „Ziegen“ spezifischere Bedeutung, ohne die Bildsprache aufzugeben.
- source_word: ἐξ εὐωνύμων
  choice: zu seiner Linken
  rationale: Die Genitivwendung bezeichnet idiomatisch die Position auf der linken Seite. Obwohl αὐτοῦ im zweiten Glied nicht wiederholt wird, ist der Bezug auf dieselbe Person eindeutig und wird im Deutschen natürlich ergänzt.
- source_word: μὲν … δὲ
  choice: …, … aber …
  rationale: Das korrelative Partikelpaar gliedert und kontrastiert die beiden Gruppen. Die deutsche Stellung von „aber“ bildet diesen Gegensatz knapp und idiomatisch ab.
theological_decisions:
- issue: Symbolische Bedeutung der rechten und linken Seite
  choice: 'Nur die räumliche Anordnung wiedergeben: „zu seiner Rechten … zu seiner Linken“'
  alternative: Die rechte Seite ausdrücklich als Ort der Gunst und die linke als Ort der Ungunst bezeichnen
  rationale: Der griechische Text nennt unmittelbar nur die räumliche Aufstellung. Ihre wertende Bedeutung ergibt sich aus dem Zusammenhang und soll nicht erklärend in den Vers hineingetragen werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller Erzählweise. Die parallele räumliche Gegenüberstellung bleibt erhalten; „aufstellen“ lässt die konkrete Gerichtsszene erkennen.
