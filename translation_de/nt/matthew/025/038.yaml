- from: Und wann haben wir dich als Fremden gesehen und aufgenommen[a] oder nackt und dir Kleidung gegeben[b]?
  to: Und wann haben wir dich als Fremden gesehen und aufgenommen[a] oder nackt und dich bekleidet[b]?
