  source_fidelity: Die Übersetzung gibt πότε, δέ, ξένον, συνηγάγομεν und γυμνόν insgesamt treffend und in der Satzfolge des griechischen Textes wieder. „Dir Kleidung gegeben“ beschreibt zwar eine mögliche Hilfeleistung, gibt περιεβάλομεν („dich bekleidet/mit Kleidung umhüllt“) jedoch weniger unmittelbar wieder als eine Formulierung mit „dich“ als Objekt des Bekleidens.
  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. „Und wann haben wir dich als Fremden gesehen und aufgenommen …?“ ist idiomatisch. „Und dich bekleidet“ ist ebenfalls natürlich, präziser und stilistisch passend.
  terminology: „Fremden“ bewahrt den sozialen und gastfreundschaftlichen Sinn von ξένον, ohne „Ausländer“ als engere nationale Kategorie einzutragen. Die Fußnote zu γυμνός erhält angemessen die mögliche Bedeutung „unzureichend bekleidet“. Die Fußnote zu συνηγάγομεν sollte keine irreführende wörtliche Paraphrase und kein unvermitteltes „bei euch“ enthalten.
