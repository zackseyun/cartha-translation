  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: de
  text: Und wann haben wir dich als Fremden gesehen und aufgenommen[a] oder nackt und dich bekleidet[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb bedeutet wörtlich „zusammenbringen“ oder „versammeln“; hier ist die gastliche Aufnahme gemeint.
    reason: lexical_alternative
  - marker: b
    text: „Nackt“ kann hier auch „unzureichend bekleidet“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: wann
  rationale: Das interrogative Adverb fragt nach dem Zeitpunkt; „wann“ ist die natürliche deutsche Entsprechung.
- source_word: δέ
  choice: und
  rationale: δέ verbindet die Frage hier locker mit der vorhergehenden Frage; „und“ gibt diesen fortführenden Zusammenhang natürlich wieder.
- source_word: σε
  choice: dich
  rationale: Das Akkusativpronomen bezeichnet den angesprochenen König beziehungsweise Menschensohn.
- source_word: εἴδομεν
  choice: haben wir … gesehen
  rationale: Der Aorist bezeichnet das vergangene Sehen; im Deutschen ist das Perfekt in dieser direkten Frage natürlich.
- source_word: ξένον
  choice: als Fremden
  rationale: ξένος bezeichnet hier einen unbekannten oder außenstehenden Menschen, der Aufnahme braucht. „Als Fremden“ bewahrt die prädikative Funktion und legt keine bestimmte Nationalität fest.
- source_word: συνηγάγομεν
  choice: aufgenommen
  rationale: συνάγω bedeutet wörtlich „zusammenführen/sammeln“, bezeichnet in diesem Zusammenhang aber die gastliche Aufnahme. „Aufgenommen“ ist knapp und idiomatisch.
- source_word: ἢ
  choice: oder
  rationale: Die disjunktive Konjunktion verbindet die beiden Teile der Frage.
- source_word: γυμνὸν
  choice: nackt
  rationale: γυμνός kann völlige Nacktheit oder unzureichende Bekleidung bezeichnen. „Nackt“ wahrt die direkte Ausdrucksweise des griechischen Textes; die mögliche weitere Bedeutung wird in der Fußnote genannt.
- source_word: περιεβάλομεν
  choice: dir Kleidung gegeben
  rationale: περιβάλλω bedeutet hier, jemanden zu bekleiden. „Dir Kleidung gegeben“ ist im heutigen Deutsch natürlicher als „dich bekleidet“ und bringt die konkrete Hilfe verständlich zum Ausdruck.
theological_decisions:
- issue: Bedeutung von ξένος im Kontext des Gerichts und der Barmherzigkeit
  choice: Fremder
  alternative: Ausländer
  rationale: „Fremder“ bewahrt den sozialen Sinn eines unbekannten oder außenstehenden Menschen, der Gastfreundschaft benötigt, ohne eine ethnische oder staatsrechtliche Kategorie einzutragen.
- issue: Umfang der Bedeutung von γυμνός
  choice: nackt im Haupttext, mit Hinweis auf unzureichende Bekleidung
  alternative: unzureichend bekleidet
  rationale: Der direkte Wortsinn bleibt im Haupttext stehen, während die Fußnote die echte lexikalische Spannweite offenhält und den Notkontext nicht verengt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das Perfekt entspricht natürlicher deutscher Rede; „als Fremden“ und „aufgenommen“ erhalten den Zusammenhang der Gastfreundschaft. Alle Fußnotenmarker stehen unmittelbar nach der jeweils erläuterten Formulierung.
