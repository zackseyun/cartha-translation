source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: de
  text: Derjenige, der die fünf Talente[a] erhalten hatte, ging fort, wirtschaftete mit ihnen und gewann weitere fünf dazu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine sehr große antike Gewichts- und Geldeinheit, nicht eine natürliche Begabung.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: ging hin
  rationale: Das aoristische Partizip bezeichnet die dem Haupthandeln vorausgehende bzw. es einleitende Bewegung. „Ging hin“ ist natürliches Deutsch und fügt kein im Griechischen nicht ausdrücklich vorhandenes „sofort“ hinzu.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Der die fünf Talente erhalten hatte
  rationale: Die substantivierte Partizipialkonstruktion identifiziert den Diener anhand des Empfangenen. Das Plusquamperfekt gibt das zeitliche Verhältnis zum anschließenden Handeln klar wieder, ohne im Vers erneut „Diener“ einzutragen.
- source_word: τάλαντα
  choice: Talente
  rationale: „Talent“ bewahrt den traditionellen Sachbegriff für die sehr große antike Gewichts- und Geldeinheit. Eine Fußnote verhindert das moderne Missverständnis als natürliche Begabung.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: arbeitete mit ihnen
  rationale: Die Wendung wird quellennah wiedergegeben und lässt die genaue Form der gewinnbringenden Tätigkeit offen. Der wirtschaftliche Sinn ergibt sich aus dem Geldbetrag und dem anschließenden Gewinn.
- source_word: ἐκέρδησεν
  choice: gewann
  rationale: Das Verb bezeichnet hier das Erzielen eines Gewinns. „Gewann“ wahrt die semantische Verbindung zu Gewinn, ohne eine bestimmte Geschäftsmethode festzulegen.
- source_word: ἄλλα πέντε
  choice: weitere fünf dazu
  rationale: Die Formulierung gibt den additiven Sinn idiomatisch wieder; aus dem Kontext ist eindeutig, dass fünf weitere Talente gemeint sind.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählfolge des Griechischen bleibt erhalten; weder „sofort“ noch die speziellere Tätigkeit „Handel treiben“ wird in den Text eingefügt.
