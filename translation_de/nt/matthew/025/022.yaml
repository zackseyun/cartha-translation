id: MAT.25.22
reference: Matthew 25:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: de
  text: 'Da trat auch der mit den zwei Talenten heran und sagte: »Herr[a], du hast mir zwei Talente[b] anvertraut. Sieh, ich habe zwei weitere Talente dazugewonnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebieter“. Das griechische Wort kyrios bedeutet gewöhnlich „Herr“, kann hier im Gleichnis aber auch als respektvolle Anrede des Dienstherrn verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Ein Talent war eine große Gewichts- und Geldeinheit, nicht eine natürliche Begabung.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: trat … heran
  rationale: Das Aoristpartizip von προσέρχομαι bezeichnet, dass der Diener sich nähert, um zu seinem Herrn zu sprechen. „trat … heran“ ist im Deutschen natürlich und bewahrt diese Bewegung.
- source_word: δὲ καὶ
  choice: Da … auch
  rationale: Die Verbindung führt die Erzählung fort und stellt diesen Diener parallel zum vorherigen dar. „Da“ markiert den Fortgang, „auch“ die Hinzufügung.
- source_word: ὁ τὰ δύο τάλαντα
  choice: der mit den zwei Talenten
  rationale: Die substantivierte Wortgruppe kennzeichnet den Diener anhand der ihm übergebenen Summe. Die knappe Form entspricht dem Griechischen, ohne ausdrücklich „empfangen hatte“ zu ergänzen.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος kann sowohl als Titel „Herr“ als auch als respektvolle Anrede eines Herrn bzw. Dienstherrn verstanden werden. „Herr“ bewahrt diese mögliche Bedeutungsweite.
- source_word: παρέδωκας
  choice: hast … anvertraut
  rationale: παραδίδωμι bedeutet grundsätzlich „übergeben“. Im Kontext des anvertrauten Vermögens gibt „anvertraut“ die gemeinte Beziehung idiomatisch wieder, ohne einen Eigentumsübergang nahezulegen.
- source_word: ἴδε
  choice: Sieh
  rationale: Der Imperativ lenkt die Aufmerksamkeit auf das sichtbare Ergebnis. „Sieh“ wahrt seine direkte, nachdrückliche Funktion in würdigem modernem Deutsch.
- source_word: ἄλλα δύο τάλαντα
  choice: zwei weitere Talente
  rationale: ἄλλα mit der Zahl bezeichnet hier eine zusätzliche gleich große Menge. „zwei weitere“ ist idiomatisch und präzise.
- source_word: ἐκέρδησα
  choice: habe … dazugewonnen
  rationale: κερδαίνω bedeutet „gewinnen, als Gewinn erzielen“. „dazugewonnen“ macht deutlich, dass die zwei Talente zur ursprünglichen Summe hinzukamen, ohne die Geschäftsmethode näher festzulegen.
- source_word: τάλαντα
  choice: Talente
  rationale: τάλαντον bezeichnet eine große Gewichts- und Geldeinheit, nicht eine natürliche Begabung. Der traditionelle Begriff bleibt erhalten und wird durch eine Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede innerhalb des Gleichnisses
  choice: Herr
  alternative: Dienstherr / Gebieter
  rationale: Im sozialen Rahmen des Gleichnisses bezeichnet κύριος den Herrn des Dieners; zugleich trägt „Herr“ im Matthäusevangelium eine weiterreichende Resonanz. Die Übersetzung „Herr“ bewahrt diese Spannung, während die Fußnote die konkrete Funktion der Anrede erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem Erzählfluss und bleibt gut vorlesbar. „Sieh“ erhält den direkten deiktischen Impuls des griechischen ἴδε; „Talente“ wahrt den traditionellen Ausdruck, dessen antike Geldbedeutung erläutert wird.
