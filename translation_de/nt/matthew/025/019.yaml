id: MAT.25.19
reference: Matthew 25:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: de
  text: Nach langer Zeit kommt der Herr jener Sklaven[a] und rechnet mit ihnen ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische κύριος kann „Herr“ oder „Gebieter“ bedeuten; δοῦλοι bezeichnet Sklaven, kann je nach Zusammenhang aber auch mit „Diener“ oder „Knechte“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Nach langer Zeit
  rationale: μετά mit dem Akkusativ bezeichnet hier zeitliche Folge. Das schwache δέ muss im Deutschen neben der einleitenden Zeitangabe nicht eigens wiedergegeben werden.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das historische Präsens des Griechischen wird beibehalten und verleiht der Erzählung Unmittelbarkeit.
- source_word: ὁ κύριος τῶν δούλων ἐκείνων
  choice: der Herr jener Sklaven
  rationale: κύριος bezeichnet im unmittelbaren Gleichniskontext den Herrn beziehungsweise Gebieter der δοῦλοι. „Sklaven“ bewahrt deren rechtlich unfreien Status, während „Herr“ zugleich die im Griechischen vorhandene Bedeutungsweite nicht unnötig verengt.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: rechnet mit ihnen ab
  rationale: Die feste Wendung bezeichnet das Prüfen und Begleichen von Rechenschaft beziehungsweise Konten. „Mit ihnen abrechnen“ ist im Deutschen idiomatisch und passt zum wirtschaftlichen Bild des Gleichnisses.
theological_decisions:
- issue: Wiedergabe von κύριος im Gleichnis
  choice: Herr
  alternative: Gebieter; Hausherr
  rationale: Im Vers bezeichnet κύριος zunächst die Gestalt innerhalb des Gleichnisses. „Herr“ ist im Deutschen sowohl für dieses soziale Verhältnis geeignet als auch offen für die weitergehende Bedeutung des Gleichnisses, ohne ausdrücklich einen christologischen Titel einzutragen.
- issue: Wiedergabe von δοῦλος
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Das Verhältnis zu einem κύριος und der wirtschaftliche Rahmen machen den Status der Unfreiheit deutlich. „Sklaven“ gibt diesen Aspekt genauer wieder als die milderen Alternativen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit erzählerischem Präsens. Die knappe Satzstruktur folgt dem griechischen Text; „rechnet mit ihnen ab“ gibt die Rechnungsmetapher idiomatisch wieder.
