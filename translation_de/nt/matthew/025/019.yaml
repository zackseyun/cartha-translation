  verdict: approve
  source_fidelity: „Nach langer Zeit“ gibt μετὰ δὲ πολὺν χρόνον zutreffend wieder; das schwache δέ muss im Deutschen nicht ausdrücklich markiert werden. Das erzählerische Präsens „kommt“ entspricht ἔρχεται. „der Herr jener Sklaven“ bildet ὁ κύριος τῶν δούλων ἐκείνων vollständig ab. „rechnet mit ihnen ab“ gibt συναίρει λόγον μετ’ αὐτῶν als idiomatische Abrechnungs-/Rechenschaftsformel angemessen wieder.
  naturalness: Der Satz ist knapp, verständlich und in modernem Standarddeutsch gut lesbar. Die Formulierung „jener Sklaven“ ist leicht gehoben, aber im Gleichnisregister natürlich und nicht altertümlich. „mit ihnen abrechnen“ passt hier erkennbar zum wirtschaftlichen Rahmen.
  terminology: „Herr“ wahrt bei κύριος die Bedeutungsweite, ohne den Gleichnisreferenten unzulässig als direkten christologischen Titel festzulegen. „Sklaven“ gibt δοῦλοι im hier hervorgehobenen Abhängigkeits- und Besitzverhältnis präzise wieder. Die Fußnote nennt sachgerechte Alternativen, ohne die Hauptlesart zu unterlaufen.
