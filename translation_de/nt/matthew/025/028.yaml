  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: de
  text: Darum nehmt ihm das Talent[a] weg und gebt es dem, der die zehn Talente hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine große antike Gewichtseinheit und damit auch eine Geldeinheit.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: nehmt … weg
  rationale: Der Aorist-Imperativ Plural von αἴρω bezeichnet hier das Entfernen einer Sache aus dem Besitz eines anderen. „Nehmt … weg“ gibt sowohl den Befehlscharakter als auch die durch ἀπ’ αὐτοῦ ausgedrückte Trennung natürlich wieder.
- source_word: οὖν
  choice: darum
  rationale: οὖν kennzeichnet die Folgerung aus dem unmittelbar vorausgehenden Urteil. „Darum“ ist in modernem Deutsch klar, knapp und erzählerisch natürlich.
- source_word: ἀπ’ αὐτοῦ
  choice: ihm … weg
  rationale: ἀπό mit Genitiv bezeichnet die Trennung von dem zuvor verurteilten Knecht. Die deutsche Verbklammer „ihm … wegnehmen“ bildet diese Beziehung idiomatisch ab.
- source_word: τὸ τάλαντον
  choice: das Talent
  rationale: τάλαντον bezeichnet eine große Gewichts- und daraus abgeleitet Geldeinheit. Der historische Begriff bewahrt die Bildwelt des Gleichnisses; eine Fußnote verhindert die moderne Fehldeutung als Begabung.
- source_word: δότε
  choice: gebt
  rationale: Der Aorist-Imperativ Plural von δίδωμι wird direkt und mit voller Befehlsstärke wiedergegeben.
- source_word: τῷ ἔχοντι
  choice: dem, der … hat
  rationale: Das substantivierte Partizip wird in natürlichem modernem Deutsch als Relativkonstruktion wiedergegeben, ohne über den griechischen Text hinaus eine Personenbezeichnung einzufügen.
- source_word: τὰ δέκα τάλαντα
  choice: die zehn Talente
  rationale: Der bestimmte Artikel verweist auf die bereits im Erzählzusammenhang genannte konkrete Menge; dies wird im Deutschen beibehalten.
theological_decisions:
- issue: Bedeutung von τάλαντον im Gleichnis
  choice: Der historische Begriff „Talent“ wird als Geld- beziehungsweise Gewichtseinheit beibehalten.
  alternative: „Geldbetrag“ oder „Summe“
  rationale: Der Vers handelt von anvertrauten, abrechenbaren Werten. Die historische Bezeichnung wahrt die kulturelle und erzählerische Eigenart, ohne τάλαντον als angeborene Fähigkeit auszulegen; die Fußnote klärt die antike Bedeutung.
translation_notes:
  register: Modernes, verständliches und würdiges Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Sprachgebrauch; die beiden pluralischen Imperative und die logische Folgerung des griechischen Textes bleiben deutlich erhalten. Keine zusätzliche Fußnote zur möglichen Wiedergabe von ἄρατε ist nötig, da „wegnehmen“ die Trennungsbedeutung von αἴρω mit ἀπό präzise ausdrückt.
