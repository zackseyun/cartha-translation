source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: de
  text: 'Die Klugen aber antworteten: »Nein, sonst reicht es womöglich weder für uns noch für euch.[a] Geht lieber zu den Verkäufern und kauft für euch selbst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung verbindet eine besorgte Möglichkeit (μήποτε, etwa: »sonst nicht etwa«) mit einer verstärkten Verneinung. Dadurch wird nachdrücklich die Sorge ausgedrückt, der Vorrat könne für beide Gruppen nicht reichen. Die verstärkte Verneinung ist im griechischen Text unsicher überliefert.'
    reason: Die idiomatische deutsche Wiedergabe kann die griechische Konstruktion nicht formgleich abbilden; zugleich wird die im SBLGNT durch eckige Klammern angezeigte Unsicherheit der verstärkten Verneinung transparent gemacht.
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ αἱ φρόνιμοι
  choice: Die Klugen aber antworteten
  rationale: Bewahrt den erzählerischen Gegensatz durch »aber« und gibt das substantivierte Adjektiv ohne einen im Vers nicht wiederholten Zusatz wie »Frauen« wieder.
- source_word: λέγουσαι
  choice: antworteten
  rationale: Das begleitende Partizip »sagend« muss im Deutschen nach »antworteten« nicht eigens wiedergegeben werden; »antworteten und sagten« wäre unnötig schwerfällig.
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: Nein! Sonst reicht es am Ende weder … noch …
  rationale: »Nein!« macht die im Griechischen enthaltene entschiedene Zurückweisung deutlich. »Sonst … am Ende« bringt die starke Sorge vor einer tatsächlich eintretenden Knappheit natürlich zum Ausdruck; »weder … noch« entspricht im Deutschen idiomatisch der Verneinung in Verbindung mit beiden Personengruppen.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: für uns noch für euch
  rationale: Die Dative bezeichnen diejenigen, für die der Vorrat ausreichen müsste; »für« ist dafür die natürliche deutsche Wiedergabe.
- source_word: πορεύεσθε μᾶλλον
  choice: Geht lieber
  rationale: Gibt die Aufforderung und die vorzuziehende Alternative knapp und idiomatisch wieder.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: zu den Verkäufern
  rationale: Das substantivierte Partizip wird formal entsprechend wiedergegeben, ohne ausdrücklich »Ölhändler« zu ergänzen.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: kauft für euch selbst
  rationale: Bewahrt den reflexiven Dativ und lässt wie der griechische Text den aus dem Zusammenhang erschließbaren Kaufgegenstand unausgesprochen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt bestimmt, ohne umgangssprachlich zu wirken; der im Kontext klare Kaufgegenstand wird nicht ergänzt.
