id: MAT.25.29
reference: Matthew 25:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: de
  text: Denn jedem, der hat, wird gegeben werden, und er wird im Überfluss haben[a]. Wer aber nicht hat, dem wird selbst das, was er hat, genommen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: und er wird im Überfluss sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die begründende Erklärung zum vorausgehenden Satz ein und wahrt den argumentativen Zusammenhang.
- source_word: τῷ ... ἔχοντι παντί
  choice: jedem, der hat
  rationale: Gibt das substantivierte Partizip mit παντί idiomatisch, distributiv und im repräsentativen Singular wieder.
- source_word: δοθήσεται
  choice: wird gegeben werden
  rationale: Bewahrt das Futur und die Passivform, ohne den nicht genannten Handelnden ausdrücklich zu bestimmen.
- source_word: περισσευθήσεται
  choice: wird Überfluss haben
  rationale: Gibt den resultierenden Zustand des Überflusses natürlich wieder; das griechische Verb kann hier intransitiv im Sinn von reichlich haben beziehungsweise im Überfluss sein verstanden werden.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: Wer aber nicht hat, dem
  rationale: Eine natürliche deutsche Entsprechung der kontrastierenden substantivischen Wendung; der repräsentative Singular bleibt erhalten.
- source_word: καὶ ὃ ἔχει
  choice: selbst das, was er hat
  rationale: Das steigernde καί wird mit „selbst“ wiedergegeben und hebt den paradoxen Gegensatz hervor.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: wird ... genommen werden
  rationale: Bewahrt das Futur Passiv und den Sinn der Wegnahme; der deutsche Dativ „dem“ drückt die Trennung idiomatisch aus.
theological_decisions:
- issue: Generische maskuline Referenz der singularischen Partizipialkonstruktionen
  choice: Singularische Formulierungen „jedem, der“ und „wer ... dem ... er“
  alternative: Pluralische oder vollständig pronomenfreie geschlechtsneutrale Wiedergabe
  rationale: Die Formulierung wahrt den generischen, repräsentativen Singular des Griechischen. Im Deutschen ist die Konstruktion natürlich und legt keine Beschränkung auf Männer nahe.
- issue: Nicht genannter Handelnder in den Passivformen
  choice: Die Passivformen „wird gegeben werden“ und „wird genommen werden“ beibehalten
  alternative: Gott ausdrücklich als Handelnden nennen
  rationale: Der Kontext kann ein göttliches Handeln nahelegen, doch der griechische Text nennt den Handelnden nicht ausdrücklich. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Wiederholung von „haben“ bleibt erhalten, weil sie den Zusammenhang beider Satzhälften trägt; „Überfluss haben“ bewahrt dabei die Pointe des griechischen περισσεύω.
