review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die drei aoristischen Aussagen vollständig und in ihrer Reihenfolge wieder: γυμνός mit „nackt“, περιεβάλετε mit „habt mich bekleidet“, ἠσθένησα mit „war krank“, ἐπεσκέψασθε mit „habt mich besucht“, φυλακῇ mit „im Gefängnis“ und ἤλθατε πρός με mit „seid zu mir gekommen“. Die fürsorgliche Nuance von ἐπεσκέψασθε wird zutreffend als Möglichkeit, nicht als Erweiterung des Haupttexts, in der Fußnote angegeben.'
  naturalness: Modernes Standarddeutsch, flüssig und dem würdigen, schlicht reihenden Register des Verses angemessen. Die Wiederholung von „ich war … und ihr habt/seid …“ ist idiomatisch und bildet die Struktur des Griechischen gut ab.
  terminology: „Nackt“, „bekleidet“, „krank“, „besucht“ und „Gefängnis“ sind präzise, natürliche und registergerechte Entsprechungen. „Zu mir gekommen“ bewahrt bewusst die schlichtere Formulierung des letzten Satzglieds gegenüber einer interpretierenden Wiedergabe als Gefängnisbesuch.
  issues:
  - severity: low
    issue: Unstimmige Fußnotenanker im englischen Audit-Trail
    rationale: 'Im englischen Text steht der Anker [b] bei „visited me“, während Fußnote a diese Wendung erläutert; Fußnote b erläutert dagegen „you came to me“, das keinen sichtbaren Anker trägt. Die deutsche Fassung hat diese Inkonsistenz nicht übernommen: Ihr Anker [a] steht korrekt bei „besucht“ und die Fußnote erläutert genau dieses Verb.'
  revised_text: Ich war nackt, und ihr habt mich bekleidet; ich war krank, und ihr habt mich besucht[a]; ich war im Gefängnis, und ihr seid zu mir gekommen.
  revised_footnotes:
  - marker: a
    text: 'Oder: »habt euch um mich gekümmert«; das griechische Verb kann einen Besuch aus fürsorglicher Anteilnahme bezeichnen.'
    reason: lexical_alternative
  revision_rationale: Keine sichere textliche Korrektur erforderlich. Die deutsche Übersetzung ist quellennah, idiomatisch und hält die lexikalische Ambiguität von ἐπεσκέψασθε sachgerecht in einer Fußnote fest, ohne sie im Haupttext auslegend aufzulösen.
