source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: de
  text: Ich war nackt, und ihr habt mich bekleidet; ich war krank, und ihr habt mich besucht[a]; ich war im Gefängnis, und ihr seid zu mir gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »habt euch um mich gekümmert«; das griechische Verb kann einen Besuch aus fürsorglicher Anteilnahme bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: nackt
  rationale: Die direkte Bedeutung ist »nackt« beziehungsweise »ohne Kleidung«. Im Zusammenhang kann auch unzureichende Bekleidung gemeint sein; »nackt« bewahrt jedoch die konkrete Gegenüberstellung zu »bekleidet«.
- source_word: περιεβάλετέ
  choice: habt mich bekleidet
  rationale: Das Verb περιβάλλω bezeichnet hier das Anlegen oder Geben von Kleidung. »Bekleidet« gibt die konkrete Handlung knapp und würdig wieder.
- source_word: ἠσθένησα
  choice: ich war krank
  rationale: Das Verb kann allgemein »schwach sein« bedeuten, bezeichnet hier im Zusammenhang tätiger Barmherzigkeit aber am wahrscheinlichsten Krankheit.
- source_word: ἐπεσκέψασθέ
  choice: habt mich besucht
  rationale: ἐπισκέπτομαι kann einen von Anteilnahme und Fürsorge getragenen Besuch bezeichnen. »Besucht« bleibt nah am Wortlaut; die mögliche Fürsorgekomponente wird in einer Fußnote kenntlich gemacht.
- source_word: φυλακῇ
  choice: im Gefängnis
  rationale: φυλακή bezeichnet hier einen Ort der Verwahrung oder Haft. »Gefängnis« ist die natürliche und hinreichend breite deutsche Entsprechung.
- source_word: ἤλθατε πρός με
  choice: seid zu mir gekommen
  rationale: Die Formulierung gibt das schlichte griechische »ihr kamt zu mir« unmittelbar wieder, ohne daraus ausdrücklich einen weiteren Besuch oder eine Fürsorgehandlung zu machen.
theological_decisions:
- issue: Grad der auslegenden Erweiterung bei den Werken der Barmherzigkeit
  choice: Die konkreten Handlungen werden als »bekleidet«, »besucht« und »zu mir gekommen« wiedergegeben.
  alternative: »Habt euch um mich gekümmert« beziehungsweise »habt mich im Gefängnis besucht«
  rationale: Der griechische Text nennt schlichte, konkrete Handlungen. Die gewählte Fassung vermeidet eine unnötige pastorale oder theologische Ausweitung und bewahrt zugleich durch die Fußnote den fürsorglichen Bedeutungsumfang von ἐπισκέπτομαι.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das wiederholte »und« erhält die klare, rhythmische Reihung des griechischen Textes.
