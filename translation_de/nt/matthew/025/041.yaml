id: MAT.25.41
reference: Matthew 25:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: de
  text: 'Dann wird er auch zu denen auf der linken Seite sagen: „Geht weg von mir, ihr Verfluchten[a], in das ewige Feuer, das für den Teufel und seine Engel bereitet ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr verflucht seid“.'
    reason: Lexikalisch-grammatische Alternative, die den passiven Sinn des griechischen Partizips ausdrücklich wiedergibt.
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Kennzeichnet in der Gerichtsszene die zeitliche Abfolge und entspricht natürlichem, modernem Deutsch.
- source_word: ἐρεῖ
  choice: wird er … sagen
  rationale: Gibt das Futur von λέγω wieder, ohne den Sprechakt interpretierend zu verstärken.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: zu denen auf der linken Seite
  rationale: Die Wendung bezeichnet im unmittelbaren Kontext die links vom König stehende Gruppe; die Formulierung ist klar und idiomatisch.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Geht weg von mir
  rationale: Gibt sowohl die Aufforderung zum Fortgehen als auch die Trennung vom Sprecher natürlich und nachdrücklich wieder.
- source_word: οἱ κατηραμένοι
  choice: ihr Verfluchten
  rationale: Das substantivierte perfekte Passivpartizip wird als direkte Anrede knapp und kraftvoll wiedergegeben; der passive Sinn bleibt in der Fußnote sichtbar.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: in das ewige Feuer
  rationale: „In“ bewahrt die durch εἰς bezeichnete Bewegung zum Ziel; „ewig“ ist hier die naheliegende Bedeutung von αἰώνιος.
- source_word: τὸ ἡτοιμασμένον
  choice: das … bereitet ist
  rationale: 'Bewahrt den passiven und resultativen Charakter des perfekten Partizips: Das Feuer befindet sich in einem zuvor hergestellten Zustand der Bereitschaft.'
- source_word: τῷ διαβόλῳ
  choice: für den Teufel
  rationale: διάβολος ist hier die etablierte persönliche Bezeichnung des Teufels und keine bloß allgemeine Benennung eines Verleumders.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: seine Engel
  rationale: Im endzeitlichen Gerichtskontext sind übernatürliche Wesen gemeint, die dem Teufel zugeordnet sind, nicht menschliche Boten.
theological_decisions:
- issue: Bedeutung von αἰώνιον im Gerichtskontext
  choice: ewig
  alternative: zeitalterlang
  rationale: „Ewig“ entspricht der gewöhnlichen Bedeutung im vorliegenden endzeitlichen Kontext und bewahrt die Schwere des Gerichtswortes, ohne eine weitergehende dogmatische Systematisierung einzutragen.
- issue: Referenten von διάβολος und ἄγγελοι
  choice: der Teufel und seine Engel
  alternative: der Verleumder und seine Boten
  rationale: Die Ausdrücke bezeichnen in diesem Gerichtskontext den Teufel und die ihm zugehörigen übernatürlichen Wesen; eine generische Wiedergabe würde die kontextuell etablierten Referenten verdunkeln.
- issue: Passiver Sinn von οἱ κατηραμένοι
  choice: ihr Verfluchten
  alternative: die ihr verflucht seid
  rationale: Die Hauptfassung erhält die Wucht der direkten Anrede; die Alternative macht deutlicher, dass die griechische Form passiv ist, ohne den Urheber des Fluches ausdrücklich zu benennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter und eindringlicher Rede. Die Wortstellung bleibt gut verständlich und bildet zugleich die Abfolge des griechischen Satzes weitgehend ab.
