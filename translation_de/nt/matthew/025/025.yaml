  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: de
  text: Und weil ich Angst hatte, ging ich weg und versteckte dein Talent[a] in der Erde. Sieh, hier hast du, was dir gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine sehr große Gewichts- und Geldeinheit; hier ist keine natürliche Begabung gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: weil ich Angst hatte
  rationale: Das adverbiale Aoristpartizip nennt den vom Diener angegebenen Grund seines Handelns. Ein kausaler Nebensatz gibt diesen Zusammenhang im Deutschen natürlich wieder, ohne die Angst als Ehrfurcht auszulegen.
- source_word: ἀπελθὼν
  choice: ging ich weg
  rationale: 'Das Aoristpartizip wird zusammen mit ἔκρυψα als natürliche deutsche Handlungsfolge wiedergegeben: Er ging weg und versteckte das Geld.'
- source_word: ἔκρυψα
  choice: versteckte
  rationale: κρύπτω bedeutet unmittelbar „verstecken“ oder „verbergen“. „Vergrub“ wäre aus „in der Erde“ erschließbar, würde aber die Ortsangabe bereits in das Verb hineinziehen.
- source_word: τὸ τάλαντόν σου
  choice: dein Talent
  rationale: τάλαντον bezeichnet hier eine sehr große Gewichts- und Geldeinheit. Der historische Ausdruck „Talent“ bleibt erhalten; eine Fußnote verhindert das moderne Missverständnis einer natürlichen Begabung.
- source_word: ἐν τῇ γῇ
  choice: in der Erde
  rationale: γῆ bezeichnet hier die Erde beziehungsweise den Erdboden als Ort des Verstecks. „In der Erde“ ist im Deutschen natürlich und wahrt die Formulierung des Ausgangstextes.
- source_word: ἴδε
  choice: Sieh
  rationale: Der Imperativ lenkt die Aufmerksamkeit auf das nun Vorliegende. „Sieh“ ist knapp, würdig und weniger altertümlich als „Siehe“.
- source_word: ἔχεις τὸ σόν
  choice: hier hast du, was dir gehört
  rationale: Die elliptische Wendung betont das Eigentum des Herrn. „Hier hast du“ gibt in diesem Übergabekontext den deiktischen und präsentierenden Sinn idiomatisch wieder; „was dir gehört“ bewahrt den possessiven Nachdruck.
theological_decisions:
- issue: Bedeutung von τάλαντον in einem Gleichnis, dessen Begriff später auf natürliche Begabungen übertragen wurde
  choice: „Talent“ als historische Geld- und Gewichtseinheit im Haupttext beibehalten und den monetären Sinn in einer Fußnote erläutern
  alternative: „eine große Geldsumme“ oder eine konkrete modernisierende Geldangabe
  rationale: Im griechischen Kontext ist keine natürliche Begabung gemeint, sondern ein sehr hoher Vermögenswert. Der historische Begriff wahrt das Bild des Gleichnisses, während die Fußnote das heutige Missverständnis ausräumt, ohne einen unsicheren modernen Gegenwert festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Partizipialkonstruktionen werden idiomatisch aufgelöst; der historische Geldbegriff bleibt mit erklärender Fußnote erhalten.
