  terminology: „Völker“ ist für πάντα τὰ ἔθνη breit und kontextgerecht; die Fußnote nennt „Nationen“ als mögliche Alternative. „Hirte“, „Schafe“ und „Ziegen“ sind treffend. Die Fußnote zu ἐρίφων bewahrt die spezifischere mögliche Bedeutung, ohne sie im Haupttext unnötig zu erzwingen.
