id: MAT.25.32
reference: Matthew 25:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: de
  text: Und alle Völker[a] werden vor ihm versammelt werden, und er wird sie voneinander scheiden, wie der Hirte die Schafe von den Ziegen[b] scheidet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Nationen“; griechisch: „alle Völker/Nationen“ (πάντα τὰ ἔθνη).'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort ἐρίφων kann genauer „junge Ziegen“ oder „Böckchen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: werden versammelt werden
  rationale: Das Futur Passiv bleibt erhalten, ohne einen im Griechischen nicht genannten Handelnden hinzuzufügen.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: vor ihm
  rationale: Natürliche und würdevolle Wiedergabe, die sowohl die räumliche Vorstellung als auch den Gerichtskontext trägt.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: „Völker“ gibt ἔθνη in diesem Zusammenhang breit wieder, ohne den Ausdruck auf Nichtjuden einzuengen.
- source_word: ἀφορίσει
  choice: wird scheiden
  rationale: „Scheiden“ bezeichnet hier klar die Trennung in Gruppen und passt zum würdevollen Register der Gerichtsszene.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: sie voneinander
  rationale: Bewahrt die wechselseitige Trennung innerhalb der versammelten Gesamtheit.
- source_word: ὥσπερ
  choice: wie
  rationale: Leitet den Vergleich im Deutschen knapp und idiomatisch ein.
- source_word: ὁ ποιμὴν
  choice: der Hirte
  rationale: Bewahrt den bestimmten Artikel und funktioniert im Deutschen als generische Bezeichnung.
- source_word: τὰ πρόβατα
  choice: die Schafe
  rationale: Gibt das konkrete Bild direkt wieder und vermeidet die allgemeinere Bezeichnung „Herde“.
- source_word: τῶν ἐρίφων
  choice: den Ziegen
  rationale: „Ziegen“ ist im Deutschen die natürliche Gegenüberstellung zu „Schafen“; die mögliche genauere Bedeutung „junge Ziegen/Böckchen“ wird in der Fußnote erhalten.
theological_decisions:
- issue: Umfang von πάντα τὰ ἔθνη
  choice: alle Völker
  alternative: alle Nationen; alle Nichtjuden
  rationale: Die Wiedergabe wahrt die lexikalische Breite und legt nicht fest, dass ausschließlich Nichtjuden gemeint seien.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Scheiden“ erhält die feierliche Gerichtssprache, bleibt aber allgemein verständlich; das doppelte Futur in „werden versammelt werden“ bewahrt bewusst das griechische Futur Passiv.
