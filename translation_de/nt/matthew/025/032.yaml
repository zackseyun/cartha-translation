  source_fidelity: 'Der Text gibt alle zentralen Elemente des griechischen Satzes präzise wieder: Futurpassiv („werden … versammelt werden“), „vor ihm“, die umfassende Wendung „alle Völker“, die wechselseitige Trennung sowie den Vergleich des Hirten mit Schafen und Ziegen. Der ungenannte Handelnde des Passivs wird nicht ergänzt.'
