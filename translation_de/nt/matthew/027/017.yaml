  variant: modern standard German
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: de
  text: 'Als sie nun versammelt waren, sagte Pilatus zu ihnen: »Wen wollt ihr, dass ich euch freilasse: Jesus Barabbas[a] oder Jesus, der Messias genannt wird[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen nur »Barabbas« statt »Jesus Barabbas«.
    reason: textual_variant
  - marker: b
    text: 'Oder: »Christus«. Das griechische Wort Christos ist hier als Titel gebraucht.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων οὖν αὐτῶν
  choice: Als sie nun versammelt waren
  rationale: Die zeitliche Genitivus- absolutus-Konstruktion wird natürlich wiedergegeben; »nun« bewahrt die fortführende Funktion von οὖν.
- source_word: Τίνα θέλετε
  choice: Wen wollt ihr
  rationale: Die Formulierung erhält den ausdrücklich genannten Willen beziehungsweise die Präferenz der Menge und passt zur Wahl zwischen zwei Personen.
- source_word: ἀπολύσω ὑμῖν
  choice: dass ich für euch freilasse
  rationale: ἀπολύω bezeichnet hier die Freilassung eines Gefangenen; »für euch« gibt den Dativ ὑμῖν verständlich wieder, ohne eine Begnadigung zu behaupten.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Jesus Barabbas
  rationale: Die Übersetzung folgt der vorgegebenen SBLGNT-Lesart mit Ἰησοῦν und bewahrt so den pointierten Gegensatz zwischen zwei Männern namens Jesus.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Jesus, der Messias genannt wird
  rationale: λεγόμενον wird ohne abwertende Nebenbedeutung wiedergegeben; χριστός fungiert hier ausdrücklich als Titel und wird daher mit »Messias« übersetzt.
theological_decisions:
- issue: Wiedergabe von χριστός
  choice: Messias
  alternative: Christus
  rationale: In der Wendung »der ... genannt wird« erscheint χριστός als Titel. »Messias« übersetzt diesen Titel transparent, während »Christus« als traditionelle Alternative in der Fußnote erhalten bleibt.
- issue: Aufnahme von »Jesus« vor Barabbas
  choice: Jesus Barabbas im Haupttext
  alternative: Barabbas
  rationale: Der bereitgestellte griechische Ausgangstext enthält Ἰησοῦν. Die kürzere, handschriftlich bezeugte Lesart wird als echte Textvariante vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfügung wahrt den ausdrücklichen Wunsch der Angesprochenen, ohne unnatürlich förmlich zu klingen. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
