source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: de
  text: Da gab er ihnen Barabbas frei; Jesus aber ließ er auspeitschen, und nachdem dies geschehen war, übergab er ihn zur Kreuzigung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus aber ließ er geißeln und übergab ihn zur Kreuzigung.“ Das griechische Verb bezeichnet die römische Strafe des Auspeitschens oder Geißelns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Markiert in diesem Erzählzusammenhang knapp und natürlich den nächsten Schritt der Handlung.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: ließ er ihnen … frei
  rationale: Gibt die Freilassung eines Gefangenen und den Dativ der Empfänger beziehungsweise Begünstigten idiomatisch wieder.
- source_word: τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Entspricht der etablierten deutschen Namensform.
- source_word: τὸν δὲ Ἰησοῦν
  choice: Jesus aber
  rationale: Die Stellung von „aber“ wahrt den durch δέ bezeichneten Gegensatz zwischen der Freilassung des Barabbas und der Behandlung Jesu.
- source_word: φραγελλώσας
  choice: ließ er auspeitschen
  rationale: Das Verb bezeichnet die römische Geißelungsstrafe. Die kausative deutsche Form ist natürlich und lässt Pilatus als verantwortlichen Handelnden erkennen, ohne zu behaupten, er habe die Strafe persönlich vollzogen.
- source_word: παρέδωκεν
  choice: übergab ihn
  rationale: Bewahrt den gerichtlichen Sinn des Auslieferns beziehungsweise Übergebens und nimmt das männliche Objekt Jesus ausdrücklich wieder auf.
- source_word: ἵνα σταυρωθῇ
  choice: zur Kreuzigung
  rationale: Gibt den Zweck beziehungsweise das vorgesehene Ergebnis der Übergabe knapp und idiomatisch wieder.
theological_decisions:
- issue: Reihenfolge und Verantwortlichkeit bei Geißelung und Übergabe Jesu
  choice: Pilatus veranlasst zuerst Jesu Auspeitschung und übergibt ihn anschließend zur Kreuzigung.
  alternative: Jesus wird übergeben und danach ausgepeitscht.
  rationale: Das Aoristpartizip φραγελλώσας bezeichnet hier am natürlichsten eine der finiten Verbform παρέδωκεν vorausgehende Handlung. „Ließ … auspeitschen“ wahrt zugleich den Unterschied zwischen Pilatus als Verantwortlichem und den tatsächlichen Vollstreckern.
- issue: Zweck oder Ergebnis von ἵνα σταυρωθῇ
  choice: „zur Kreuzigung“ lässt Zweck und vorgesehenes Ergebnis zusammenklingen.
  alternative: „damit er gekreuzigt würde“ legt den Zweck syntaktisch ausdrücklicher fest.
  rationale: Die knappe deutsche Nominalfügung bildet die griechische Zielrichtung natürlich ab, ohne eine im Kontext unnötige Präzisierung der semantischen Kategorie vorzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auspeitschen“ ist allgemein verständlicher als „geißeln“; die Fußnote nennt die traditionelle Alternative und verdeutlicht die zeitliche Beziehung des Partizips.
