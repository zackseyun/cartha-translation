review_pass:
  verdict: revise
  source_fidelity: 'Der Vers wird inhaltlich zutreffend wiedergegeben: τότε markiert den Fortgang, ἀπέλυσεν αὐτοῖς die Freilassung des Barabbas zugunsten der Menge, δέ den Kontrast, und die Übergabe Jesu zielt auf die Kreuzigung. Die kausative Wiedergabe „ließ ... auspeitschen“ ist im Zusammenhang mit Pilatus als handelndem Subjekt angemessen. Die vorangestellte Handlung von φραγελλώσας sollte jedoch im deutschen Haupttext klarer erkennbar sein.'
  naturalness: „Da gab er ihnen Barabbas frei“ ist im modernen Standarddeutsch idiomatischer als „ließ er ihnen Barabbas frei“. Eine explizite Satzfügung mit „nachdem“ bildet die zeitliche Funktion des aoristischen Partizips klar und natürlich ab.
  terminology: „Auspeitschen“ ist verständlich und für φραγελλόω vertretbar; „geißeln“ ist eine geeignete lexikalische Alternative. Die bisherige Fußnote ist jedoch nicht „wörtlicher“, weil das griechische Aktivpartizip nicht selbst die deutsche Kausativform „hatte ... auspeitschen lassen“ enthält.
  issues:
  - severity: medium
    issue: Die Fußnote bezeichnet eine kausative Umschreibung als „Wörtlicher“.
    rationale: φραγελλώσας bedeutet formal „nachdem er ... ausgepeitscht/gegeißelt hatte“. Die kausative Form ist kontextuell sinnvoll, aber nicht wörtlicher als der Haupttext. Die Fußnote sollte daher als alternative Formulierung ausgewiesen werden.
  - severity: low
    issue: Die zeitliche Vorordnung der Geißelung ist im Haupttext nur implizit.
    rationale: Die Reihung „ließ ... auspeitschen und übergab“ kann zwar sequenziell verstanden werden, aber „nachdem“ gibt die vorzeitige Funktion des Aoristpartizips präziser wieder.
  revised_text: Da gab er ihnen Barabbas frei; Jesus aber ließ er auspeitschen, und nachdem dies geschehen war, übergab er ihn zur Kreuzigung.[a]
