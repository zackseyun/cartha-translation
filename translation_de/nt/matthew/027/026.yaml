revisions:
- from: Da ließ er ihnen Barabbas frei; Jesus aber ließ er auspeitschen und übergab ihn zur Kreuzigung.[a]
  to: Da gab er ihnen Barabbas frei; Jesus aber ließ er auspeitschen, und nachdem dies geschehen war, übergab er ihn zur Kreuzigung.[a]
  rationale: Die Revision verbessert die idiomatische Wiedergabe der Freilassung und macht die durch φραγελλώσας ausgedrückte zeitliche Vorordnung deutlich. Die Fußnote wird von einer unzutreffenden Behauptung größerer Wörtlichkeit zu einer echten lexikalischen Alternative korrigiert. Die historische Verantwortlichkeit wird nicht über die Aussage des griechischen Textes hinaus präzisiert.
