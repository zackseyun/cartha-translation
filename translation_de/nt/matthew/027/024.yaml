source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: de
  text: 'Als Pilatus nun sah, dass er nichts erreichte, sondern dass vielmehr ein Aufruhr entstand[a], nahm er Wasser, wusch sich vor der Menge die Hände und sagte: »Ich bin unschuldig an diesem Blut[b]; seht ihr selbst zu![c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Tumult entstand«; auch: »Unruhe kam auf«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ich bin frei von diesem Blut.« Gemeint ist Pilatus’ Behauptung, für den Tod nicht verantwortlich zu sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Ihr werdet selbst sehen.« Die Wendung kann hier bedeuten: »Kümmert ihr euch selbst darum« oder »Tragt ihr selbst die Verantwortung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Als Pilatus nun sah
  rationale: Das Partizip mit δέ führt den nächsten Erzählschritt ein. »Als … nun sah« klingt im Deutschen natürlich, ohne einen stärkeren Gegensatz einzutragen.
- source_word: οὐδὲν ὠφελεῖ
  choice: dass er nichts erreichte
  rationale: Die Formulierung bezeichnet hier, dass Pilatus mit seinem Vorgehen keinen Erfolg hatte. »Nichts erreichte« gibt dies idiomatisch und knapp wieder.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: sondern dass vielmehr ein Aufruhr entstand
  rationale: θόρυβος bezeichnet öffentlichen Tumult oder Aufruhr; γίνεται stellt dessen Entstehen dar. »Aufruhr« bewahrt die mögliche Eskalation, ohne zwingend einen voll entwickelten Aufstand zu behaupten.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: nahm er Wasser, wusch sich … die Hände
  rationale: Die aufeinanderfolgenden Handlungen werden in natürlichem deutschem Erzählstil als finite Verben wiedergegeben. Das Medium wird mit »sich die Hände« angemessen ausgedrückt.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: vor der Menge
  rationale: Die Wendung betont, dass die symbolische Handlung öffentlich und im Angesicht der versammelten Menschen geschieht.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Ich bin unschuldig an diesem Blut
  rationale: Die griechische Wendung erklärt Pilatus nach seiner eigenen Aussage für frei von Verantwortung für den Tod. »An diesem Blut unschuldig« erhält das Blutmotiv und vermeidet die nicht ausdrücklich im Text stehende Ergänzung »dieses Mannes«.
- source_word: ὑμεῖς ὄψεσθε
  choice: seht ihr selbst zu!
  rationale: Der Zukunftsausdruck ist hier idiomatisch als Aufforderung zur eigenen Verantwortung zu verstehen. Das ausdrücklich gesetzte ὑμεῖς wird durch »ihr selbst« hervorgehoben; die wörtliche Form bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Pilatus’ Erklärung seiner Unschuld
  choice: Als direkte Selbstaussage Pilatus’ wiedergegeben, ohne sie als zutreffendes Urteil des Erzählers auszugeben.
  alternative: 'Eine streng wörtliche Fassung wäre: »Ich bin frei von diesem Blut.«'
  rationale: Der Vers berichtet Pilatus’ Versuch, Verantwortung von sich zu weisen. Die Übersetzung bestätigt weder seine tatsächliche Unschuld noch entscheidet sie die moralische und theologische Spannung.
- issue: Verantwortung der Menge in ὑμεῖς ὄψεσθε
  choice: »seht ihr selbst zu!« als idiomatische Aufforderung
  alternative: 'Wörtlich: »Ihr werdet selbst sehen.«'
  rationale: Die idiomatische Wiedergabe macht die Verantwortungszuweisung verständlich, während die Fußnote die grammatisch wörtliche Lesart dokumentiert und damit die sprachliche Spannung offenlegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Handlungsablauf, wird aber flüssig deutsch formuliert. »Aufruhr«, »Blut« und die betonte Verantwortungszuweisung bewahren die Bildsprache und Spannung des Ausgangstextes.
