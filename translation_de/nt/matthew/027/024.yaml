  source_fidelity: 'Der deutsche Text gibt den Handlungsablauf und die wesentlichen Aussagen des griechischen Textes zuverlässig wieder: Pilatus erkennt die Erfolglosigkeit seines Vorgehens, den sich entwickelnden öffentlichen Tumult, vollzieht die Handwaschung öffentlich und weist die Verantwortung rhetorisch der Menge zu. »An diesem Blut« bewahrt gegenüber der englischen Audit-Fassung zutreffend die im Griechischen nicht ausdrücklich genannte Person. Die Imperativform »seht ihr selbst zu!« ist eine angemessene idiomatische Wiedergabe der in diesem Kontext verantwortungszuweisenden Wendung ὑμεῖς ὄψεσθε; die wörtliche Zukunftsform ist sachgerecht in der Fußnote dokumentiert.'
