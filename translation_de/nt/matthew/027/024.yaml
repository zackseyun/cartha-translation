  terminology: »Aufruhr« ist für θόρυβος im öffentlichen Kontext gut vertretbar und wird durch die Alternativen in der Fußnote abgesichert. »Unschuldig« gibt ἀθῷος angemessen wieder, ohne Pilatus’ Selbstaussage als erzählerisches Urteil zu bestätigen. Die Fußnoten behandeln die relevanten lexikalischen und idiomatischen Spannungen korrekt.
