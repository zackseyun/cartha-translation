  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: τὸ δ’ αὐτὸ adverbial mit „Ebenso“, das anschließende καί mit „auch“, λῃσταί als „Räuber“, die Identifikation als mit Jesus Gekreuzigte und ὠνείδιζον als Beschimpfen. Der Plural bleibt erhalten und wird nicht an Lukas angeglichen.'
  naturalness: „Ebenso beschimpften ihn auch die Räuber, die mit ihm gekreuzigt worden waren“ ist idiomatisches, modernes Standarddeutsch und besitzt einen angemessen nüchternen biblischen Registerton. Die Stellung von „auch“ ist natürlich; das Präteritum kann den imperfektischen Vorgang im deutschen Erzählstil angemessen wiedergeben.
  terminology: „Räuber“ ist für λῃσταί eine sachgerechte, nicht überinterpretierende Wiedergabe. „Beschimpften“ trifft den vorwurfsvoll-schmähenden Sinn von ὠνείδιζον gut. Die Formulierung „mit ihm gekreuzigt worden waren“ bewahrt Passiv und die Zugehörigkeit zur Kreuzigungsszene.
