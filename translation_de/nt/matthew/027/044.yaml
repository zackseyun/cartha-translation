id: MAT.27.44
reference: Matthew 27:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: de
  text: Ebenso beschimpften ihn auch die Räuber, die mit ihm gekreuzigt worden waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: Ebenso
  rationale: Die Wendung τὸ αὐτό wird hier adverbial gebraucht und verweist auf die zuvor geschilderte Verhöhnung. „Ebenso“ gibt diesen Bezug knapp und natürlich wieder.
- source_word: καὶ
  choice: auch
  rationale: καί schließt die mit Jesus gekreuzigten Räuber an die zuvor genannten Spötter an. Das deutsche „auch“ bewahrt diese additive, im Zusammenhang zugleich steigernde Wirkung, ohne sie zu überzeichnen.
- source_word: λῃσταὶ
  choice: Räuber
  rationale: λῃστής bezeichnet gewöhnlich einen Räuber oder Banditen. „Räuber“ ist verständlich und vermeidet die nicht ausdrücklich belegte Festlegung auf politische Aufständische.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: die mit ihm gekreuzigt worden waren
  rationale: Das substantivierte passive Partizip identifiziert die Räuber als diejenigen, die zusammen mit Jesus gekreuzigt worden waren. Die deutsche Vorvergangenheit macht das dem Hauptverb vorausliegende Geschehen natürlich deutlich.
- source_word: ὠνείδιζον
  choice: beschimpften
  rationale: Das Imperfekt beschreibt ein andauerndes oder wiederholtes Beschimpfen. „Beschimpften“ ist gegenwärtiges, verständliches Deutsch und bewahrt den vorwurfsvollen Charakter von ὀνειδίζω besser als das allgemeinere „beleidigten“.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen ist direktes Objekt und bezieht sich auf Jesus.
theological_decisions:
- issue: Mögliche Harmonisierung mit dem Bericht des Lukas, nach dem einer der Mitgekreuzigten anders spricht
  choice: 'Matthäus’ Pluralaussage wird ohne Einschränkung wiedergegeben: „die Räuber … beschimpften ihn“.'
  alternative: Den Plural abschwächen oder so formulieren, dass nur einer der Räuber Jesus beschimpft.
  rationale: Der griechische Text nennt ausdrücklich den Plural οἱ λῃσταί und verbindet ihn mit dem pluralischen ὠνείδιζον. Die Spannung zu Lukas darf nicht durch die Übersetzung aufgelöst werden.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Satzform folgt der griechischen Aussage; „beschimpften“ ist zugänglich, ohne den scharfen Ton abzuschwächen.
