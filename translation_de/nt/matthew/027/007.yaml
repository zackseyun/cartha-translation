id: MAT.27.7
reference: Matthew 27:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: de
  text: Nachdem sie beraten hatten, kauften sie davon den Töpferacker als Begräbnisstätte für Fremde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für Auswärtige« beziehungsweise »für Ausländer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: Nachdem sie beraten hatten
  rationale: Die griechische Wendung bedeutet wörtlich etwa »einen Beschluss/Rat gefasst habend«. Die Wiedergabe drückt die vorausgehende gemeinsame Beratung natürlich aus, ohne das Ergebnis näher festzulegen.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ führt hier die Erzählung weiter und bezeichnet keinen starken Gegensatz. Der deutsche Satzanschluss ist auch ohne ein zusätzliches »da« oder »dann« natürlich.
- source_word: ἠγόρασαν
  choice: kauften sie
  rationale: Die schlichte Vergangenheitsform gibt den Aorist von ἀγοράζω sachgerecht und idiomatisch wieder.
- source_word: ἐξ αὐτῶν
  choice: davon
  rationale: Das sächliche Pluralpronomen verweist im unmittelbaren Zusammenhang auf die zuvor genannten Silberstücke. »Davon« bewahrt den rückverweisenden Charakter und ist im Deutschen natürlicher als »mit ihnen«.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: den Töpferacker
  rationale: Die etablierte deutsche Zusammensetzung gibt die Genitivverbindung knapp und natürlich als Bezeichnung des Ackers wieder.
- source_word: εἰς ταφὴν
  choice: als Begräbnisstätte
  rationale: εἰς bezeichnet hier den vorgesehenen Zweck beziehungsweise die Nutzung des Ackers; »als Begräbnisstätte« ist klar und idiomatisch.
- source_word: τοῖς ξένοις
  choice: für Fremde
  rationale: ξένοις kann Fremde, Auswärtige oder Ausländer bezeichnen. »Fremde« erhält die Breite des griechischen Ausdrucks, ohne eine bestimmte politische oder ethnische Kategorie festzulegen.
theological_decisions:
- issue: Bezugswort von αὐτῶν
  choice: Rückbezug auf die zuvor genannten Silberstücke, formuliert als »davon«
  alternative: »mit diesem Geld«
  rationale: Der unmittelbare Kontext macht den Bezug auf die Silberstücke deutlich. »Davon« bleibt näher an der pronominalen Ausdrucksweise des Griechischen, während die Alternative den Bezug erklärend ausformuliert.
- issue: Bedeutungsumfang von τοῖς ξένοις
  choice: »für Fremde«
  alternative: »für Ausländer« oder »für Auswärtige«
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, ob ethnisch-politische Ausländer oder allgemein Ortsfremde gemeint sind. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig und der knappe Erzählstil bleibt erhalten. »Töpferacker« folgt dem geläufigen biblischen Sprachgebrauch, ohne altertümlich zu wirken.
