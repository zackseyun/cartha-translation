  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: de
  text: und sie gaben sie für den Acker des Töpfers, wie der Herr mir[b] aufgetragen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befohlen“ oder „angewiesen“.'
    reason: lexical_alternative
  - marker: b
    text: Matthäus bewahrt in diesem prophetischen Zitat beziehungsweise dieser Anspielung die Formulierung in der ersten Person („mir“), statt sie dem Erzählzusammenhang anzupassen.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: gaben
  rationale: Der Aorist von δίδωμι wird in seiner naheliegenden Grundbedeutung wiedergegeben. „Bezahlten“ wäre im Zusammenhang möglich, würde den Kaufvorgang aber stärker ausdeuten als der griechische Wortlaut.
- source_word: αὐτὰ
  choice: sie
  rationale: Das Pronomen im Neutrum Plural verweist im Zusammenhang auf die Silberstücke. Das deutsche Pluralpronomen bewahrt diesen Rückbezug.
- source_word: εἰς τὸν ἀγρὸν
  choice: für den Acker
  rationale: Obwohl εἰς häufig eine Richtung bezeichnet, drückt die Wendung hier im Zusammenhang mit der Verwendung des Geldes den Zweck beziehungsweise den Erwerb aus. „Für den Acker“ ist im Deutschen natürlich und lässt den Kontext verständlich erkennen.
- source_word: τοῦ κεραμέως
  choice: des Töpfers
  rationale: 'Der Genitiv wird formal als Zugehörigkeitsangabe bewahrt: „der Acker des Töpfers“.'
- source_word: καθὰ
  choice: wie
  rationale: „Wie“ gibt die Übereinstimmung mit dem folgenden Auftrag knapp und idiomatisch wieder; „genau wie“ wäre möglich, im Deutschen hier aber unnötig nachdrücklich.
- source_word: συνέταξέν
  choice: aufgetragen hatte
  rationale: συντάσσω kann „anordnen“, „befehlen“ oder „auftragen“ bedeuten. „Auftragen“ vermittelt verbindliche Weisung in natürlichem, würdigem Deutsch. Das Plusquamperfekt macht das zeitlich vorausliegende Auftragen im deutschen Satz klar.
- source_word: μοι
  choice: mir
  rationale: Der Dativ der ersten Person wird direkt bewahrt. Dadurch bleibt auch die auffällige Ich-Perspektive der prophetischen Anspielung erhalten.
- source_word: κύριος
  choice: der Herr
  rationale: κύριος bezeichnet hier den Herrn; die bestimmte deutsche Form entspricht dem griechischen Gebrauch und dem prophetischen Kontext.
theological_decisions:
- issue: Ich-Bezug innerhalb des prophetischen Zitats beziehungsweise der prophetischen Anspielung
  choice: „mir“ bleibt unverändert in der ersten Person stehen.
  alternative: Den Bezug an den Erzählzusammenhang anpassen oder ausdrücklich mit einer alttestamentlichen Sprecherfigur erklären.
  rationale: Der griechische Text enthält μοι („mir“). Die Übersetzung bewahrt diese auffällige Formulierung und glättet weder die Sprecherperspektive noch die Spannung, die sich aus Matthäus’ Zitierweise ergibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die elliptische Fortsetzung „und gaben sie“ entspricht dem griechischen Anschluss und vermeidet das im Deutschen schwerfällige „und sie gaben sie“. „Acker“ bewahrt die traditionelle und sachlich passende Bezeichnung für ἀγρός.
