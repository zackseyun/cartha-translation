base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: de
  text: 'Er hat auf Gott vertraut; der soll ihn jetzt retten, wenn er ihn will[a]. Denn er hat gesagt[b]: »Ich bin Gottes Sohn.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Anklang an Psalm 22,9: »wenn er Gefallen an ihm hat«; dort steht Gottes Wohlgefallen besonders im Vordergrund.'
    reason: alternative_reading
  - marker: b
    text: Der Spott greift Psalm 22,9 eng auf und verbindet Jesus so mit dem leidenden Gerechten dieses Psalms.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: Er hat auf Gott vertraut
  rationale: Das Perfekt bezeichnet einen aus vorausgegangenem Vertrauen bestehenden Zustand. »Auf Gott vertrauen« ist im Deutschen die natürliche Verbindung und bewahrt gegenüber einem bloßen Präsens den Aspekt des griechischen Perfekts.
- source_word: ῥυσάσθω νῦν
  choice: der soll ihn jetzt retten
  rationale: ῥύομαι bezeichnet die Rettung aus Gefahr; der Aoristimperativ formuliert hier die spöttische Aufforderung. Das Demonstrativpronomen »der« nimmt Gott als Subjekt eindeutig wieder auf, ohne den Namen entgegen dem griechischen Text zu wiederholen.
- source_word: εἰ θέλει αὐτόν
  choice: wenn er ihn will
  rationale: θέλω bedeutet unmittelbar »wollen, wünschen«. Die knappe Formulierung erhält die Mehrdeutigkeit zwischen persönlichem Wollen und göttlichem Wohlgefallen; die durch Psalm 22 nahegelegte Alternative wird in der Fußnote genannt.
- source_word: εἶπεν γὰρ ὅτι
  choice: 'Denn er hat gesagt:'
  rationale: Der Aorist wird als Vergangenheit wiedergegeben. Direkte Rede ist im Deutschen natürlicher und gibt den Inhalt des ὅτι-Satzes unverändert wieder.
- source_word: Θεοῦ εἰμι υἱός
  choice: Ich bin Gottes Sohn
  rationale: Die artikellose Prädikatskonstruktion bezeichnet im matthäischen Zusammenhang nicht irgendeine göttliche Abstammung, sondern den christologischen Anspruch. »Gottes Sohn« wahrt diese bestimmte, titular-qualitative Bedeutung in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von Θεοῦ εἰμι υἱός
  choice: Ich bin Gottes Sohn
  alternative: Ich bin der Sohn Gottes; Ich bin ein Sohn Gottes
  rationale: Der Kontext bei Matthäus spricht für den bekannten christologischen Anspruch, nicht für eine unbestimmte Zugehörigkeitsaussage. »Gottes Sohn« erhält die Titelfunktion, ohne die im Griechischen artikellose Form unnötig zu überbestimmen.
- issue: Bedeutung von θέλει αὐτόν im Anklang an Psalm 22,9 (nach deutscher Verszählung)
  choice: wenn er ihn will
  alternative: wenn er Gefallen an ihm hat
  rationale: Die Grundbedeutung von θέλω wird im Haupttext bewahrt. Der Psalmanklang kann die Nuance göttlichen Wohlgefallens tragen, wird aber nicht stillschweigend zur alleinigen Deutung gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der spöttische Ton bleibt durch die knappe Aufforderung erhalten. »Der soll« vermeidet die missverständliche Folge »er soll ihn«, macht Gott als Subjekt aber klar. Sämtliche Fußnotenmarker stehen im Haupttext.
