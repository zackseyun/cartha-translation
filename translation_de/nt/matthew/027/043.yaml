  source_fidelity: Der Haupttext gibt das griechische Perfekt πέποιθεν angemessen mit »hat ... vertraut« wieder. »Der soll ihn jetzt retten« trifft den spöttischen Imperativ ῥυσάσθω samt νῦν, und »wenn er ihn will« bewahrt die unmittelbare, im Psalmanklang nuancierte Bedeutung von εἰ θέλει αὐτόν. »Ich bin Gottes Sohn« ist im matthäischen Kontext eine natürliche und sachgerechte Wiedergabe der titulär-qualitativen Aussage Θεοῦ ... υἱός.
  naturalness: Das Deutsch ist modernes, würdevolles Standarddeutsch. Das demonstrative »der« hat hier einen passend abwertend-spöttischen Klang und klärt zugleich, dass Gott das Subjekt von »retten« ist. Der einzige nötige Eingriff betrifft die Platzierung des Fußnotenmarkers.
  terminology: »Auf Gott vertrauen«, »retten« und »Gottes Sohn« sind idiomatisch und terminologisch angemessen. Die Fußnote zu Psalm 22,9 erhält sinnvoll die mögliche Nuance von Gottes Gefallen, ohne diese dem griechischen θέλει im Haupttext aufzuzwingen.
