source:
  edition: SBLGNT
  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: de
  text: Und er antwortete ihm nicht einmal mit einem einzigen Wort,[a] sodass der Statthalter sich sehr wunderte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit keinem einzigen Wort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das deponentische Verb bedeutet hier schlicht „antworten“. Die finite Vergangenheitsform gibt den Aorist im deutschen Erzählstil natürlich wieder.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet denjenigen, dem Jesus antworten sollte; im Kontext ist dies der Statthalter Pilatus.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: auch nicht mit einem einzigen Wort
  rationale: Die Formulierung bewahrt die nachdrückliche Verneinung οὐδὲ ἕν und versteht ῥῆμα in seinem gewöhnlichen Sinn „Wort, Äußerung“. „Mit keinem einzigen Wort“ ist eine ebenso mögliche deutsche Wiedergabe.
- source_word: ὥστε
  choice: sodass
  rationale: ὥστε leitet die Folge von Jesu Schweigen ein; „sodass“ drückt diesen konsekutiven Zusammenhang präzise und idiomatisch aus.
- source_word: θαυμάζειν
  choice: war erstaunt
  rationale: Der Infinitiv bezeichnet die aus Jesu Schweigen folgende Reaktion. Die Umformung in einen deutschen finiten Satz ist natürlich und wahrt den Sinn.
- source_word: τὸν ἡγεμόνα
  choice: der Statthalter
  rationale: Im römischen Provinzkontext bezeichnet ἡγεμών den amtierenden Statthalter, hier Pilatus.
- source_word: λίαν
  choice: sehr
  rationale: Das Adverb verstärkt das Erstaunen. „Sehr“ ist im modernen Deutschen natürlich und gibt die hohe Intensität klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ stellt den erzählerischen Gegensatz zum vorangehenden Verhör heraus; „Statthalter“ wahrt den historischen Amtstitel. Die Stellung des Fußnotenzeichens unmittelbar nach „Wort“ kennzeichnet genau die betroffene Wendung.
