  source_fidelity: 'Die Handlungskette entspricht dem Griechischen gut: εὐθέως, εἷς ἐξ αὐτῶν, σπόγγον, ὄξος und die Gabe zu trinken sind sachgerecht wiedergegeben. Der Imperfekt ἐπότιζεν wird im Deutschen idiomatisch ohne ungesicherte Wiederholungs- oder Versuchsnuance wiedergegeben. κάλαμος bezeichnet hier jedoch ein Rohr bzw. Schilfrohr als Gegenstand, nicht ein modernes „Rohr“ im Sinn einer Röhre oder Leitung.'
  naturalness: Die Satzfolge mit finiten Verben ist flüssiges modernes Standarddeutsch. „Steckte ihn auf ein Rohr“ wirkt wegen der heutigen Hauptbedeutung von „Rohr“ (Röhre, Leitung) unnatürlich und missverständlich. „Schilfrohr“ stellt den gemeinten Gegenstand verständlich dar.
  terminology: „Saurer Wein“ ist für ὄξος eine angemessene Hauptwiedergabe; „Weinessig“ bleibt als lexikalische Alternative sinnvoll in der Fußnote. „Schilfrohr“ ist für κάλαμος im Kontext präziser als „Rohr“. Die explizite Nennung Jesu ist möglich, aber nicht erforderlich; das Pronomen bewahrt die knappe Referenz des griechischen αὐτόν.
