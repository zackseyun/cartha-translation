id: MAT.27.48
reference: Matthew 27:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: de
  text: Und sofort lief einer von ihnen los, nahm einen Schwamm, füllte ihn mit saurem Wein, steckte ihn auf ein Schilfrohr und gab ihm zu trinken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „füllte ihn mit Weinessig“. Das griechische Wort kann sauren Wein oder Weinessig bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die unverzügliche Reaktion knapp und in natürlichem modernem Deutsch wieder.
- source_word: δραμὼν
  choice: lief … los
  rationale: Das Aoristpartizip wird innerhalb der Handlungskette idiomatisch als finites Verb wiedergegeben; „loslaufen“ bringt den Beginn der eiligen Bewegung natürlich zum Ausdruck.
- source_word: εἷς ἐξ αὐτῶν
  choice: einer von ihnen
  rationale: Entspricht der partitiven Wendung und lässt die nicht näher bestimmte Bezugsgruppe unverändert.
- source_word: λαβὼν σπόγγον
  choice: nahm einen Schwamm
  rationale: Gibt das Aoristpartizip als nächsten Schritt einer flüssigen deutschen Handlungskette wieder.
- source_word: πλήσας τε ὄξους
  choice: füllte ihn mit saurem Wein
  rationale: ὄξος bezeichnet sauren Wein beziehungsweise Weinessig; „saurer Wein“ macht verständlich, dass es sich um ein Getränk handelt, ohne die lexikalische Spannweite zu verschweigen.
- source_word: περιθεὶς καλάμῳ
  choice: steckte ihn auf ein Rohr
  rationale: „Auf ein Rohr stecken“ gibt in diesem Zusammenhang die Befestigung des Schwamms an einem κάλαμος natürlich und anschaulich wieder.
- source_word: ἐπότιζεν αὐτόν
  choice: gab Jesus zu trinken
  rationale: ποτίζω bedeutet, jemanden trinken zu lassen beziehungsweise ihm zu trinken zu geben. Das deutsche Imperfekt passt zur griechischen imperfektiven Form, ohne eine ausdrücklich wiederholte Handlung zu behaupten; der Name vermeidet ein mehrdeutiges Pronomen.
theological_decisions:
- issue: Art des Jesus angebotenen Getränks
  choice: saurer Wein
  alternative: Essig beziehungsweise Weinessig
  rationale: ὄξος kann sauren Wein oder Weinessig bezeichnen. „Saurer Wein“ entspricht hier am ehesten dem als Getränk verwendeten Referenten; die echte lexikalische Alternative bleibt in der Fußnote erhalten.
- issue: Aspekt von ἐπότιζεν
  choice: gab Jesus zu trinken
  alternative: versuchte, Jesus zu trinken zu geben / gab Jesus immer wieder zu trinken
  rationale: Der Imperfekt stellt den Vorgang imperfektiv dar, legt aber für sich allein weder eine wiederholte Handlung noch ausdrücklich einen bloßen Versuch fest. Das deutsche Imperfekt bewahrt diese Offenheit am besten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer klaren Folge finiter Verben. „Rohr“ ist die direkte und im Passionsbericht verständliche Wiedergabe von κάλαμος. Der Name „Jesus“ ersetzt das objektbezogene Pronomen, um nach „Schwamm“ und „Rohr“ jede mögliche Unklarheit zu vermeiden.
