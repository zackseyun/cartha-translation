id: MAT.27.16
reference: Matthew 27:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον ⸀Ἰησοῦν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: de
  text: Damals hatten sie einen berüchtigten Gefangenen namens Jesus Barabbas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen nur »Barabbas« und lassen »Jesus« weg.
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: hatten sie
  rationale: Der Imperfekt von ἔχω mit unbestimmtem Pluralsubjekt bezeichnet hier, dass die zuständigen Personen den Mann in Gewahrsam hatten; die aktive Form bleibt erhalten.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die schwache narrative Verknüpfung wird im Deutschen durch den Anschluss an den Kontext ausreichend getragen; ein zusätzliches „aber“ oder „nun“ würde den Übergang unnötig markieren.
- source_word: τότε
  choice: damals
  rationale: „Damals“ gibt die ausdrückliche Zeitangabe knapp und natürlich wieder.
- source_word: δέσμιον
  choice: Gefangenen
  rationale: Das Wort bezeichnet eine Person in Haft oder Gewahrsam; „Gefangener“ ist in diesem gerichtlichen Zusammenhang die klare Standardentsprechung.
- source_word: ἐπίσημον
  choice: berüchtigten
  rationale: ἐπίσημος kann „bekannt/auffällig“ bedeuten; bei einem Gefangenen legt der Kontext eine Bekanntheit im negativen Sinn nahe, ohne Näheres über sein Vergehen hinzuzufügen.
- source_word: λεγόμενον
  choice: namens
  rationale: Das Partizip führt hier die Bezeichnung der Person ein; „namens“ ist im modernen Deutschen natürlich und prägnant.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Jesus Barabbas
  rationale: Der vorgegebene SBLGNT-Text enthält beide Namen; daher werden beide im Haupttext wiedergegeben.
theological_decisions:
- issue: Textform des Namens Barabbas
  choice: '„Jesus“ im Haupttext einschließen: „Jesus Barabbas“'
  alternative: Nur „Barabbas“ ohne „Jesus“
  rationale: Die zugrunde gelegte SBLGNT-Ausgabe liest Ἰησοῦν Βαραββᾶν. Die bedeutende kürzere Lesart wird nicht stillschweigend bevorzugt, sondern in einer textkritischen Fußnote dokumentiert.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. „Damals“ vermeidet eine schwerfällige Doppelmarkierung des Übergangs; „berüchtigt“ wahrt die wahrscheinlich negative Kontextbedeutung von ἐπίσημος.
