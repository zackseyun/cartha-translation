source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: de
  text: 'Einige aber von denen, die dort standen, sagten, als sie es[a] hörten: „Der da ruft Elia.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Jesu Ruf im vorigen Vers.
    reason: implicit_object
  - marker: b
    text: Die Umstehenden verstanden Jesu Ruf im vorigen Vers wahrscheinlich als einen Ruf nach Elia.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς δὲ τῶν ἐκεῖ ἑστηκότων
  choice: Einige aber von denen, die dort standen
  rationale: Die Formulierung gibt die unbestimmte Teilmenge, den milden Gegensatz durch δέ und das substantivierte Partizip möglichst unmittelbar wieder, ohne es zu „Umstehende“ zu verallgemeinern.
- source_word: ἀκούσαντες
  choice: hörten es
  rationale: Das vorzeitige Partizip wird in natürlichem Deutsch nebengeordnet. Das im Griechischen unausgesprochene Objekt wird durch „es“ aufgenommen und bezieht sich aus dem Zusammenhang auf Jesu Ruf.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt bezeichnet die im Verlauf der Szene geäußerte Rede. Eine stärkere Wiedergabe wie „sagten immer wieder“ würde eine Wiederholung behaupten, die der Kontext nicht sicher verlangt.
- source_word: Ἠλίαν φωνεῖ
  choice: ruft Elia
  rationale: Die knappe deutsche Verbindung bewahrt die Offenheit des griechischen Ausdrucks zwischen dem Rufen nach Elia und dem Anrufen Elias, ohne mit „zu sich“ oder „um Hilfe“ zusätzliche Deutung einzutragen.
- source_word: οὗτος
  choice: der da
  rationale: „Der da“ gibt den hinweisenden Charakter des Demonstrativpronomens idiomatisch wieder und kann wie das Griechische eine gewisse Distanz der Sprecher erkennen lassen, ohne sie ausdrücklich festzuschreiben.
theological_decisions:
- issue: Ob die Aussage der Umstehenden als zutreffende Beschreibung oder als Missverständnis gekennzeichnet werden soll
  choice: 'Im Haupttext wird lediglich ihre Aussage wiedergegeben: „Der da ruft Elia.“'
  alternative: „Sie meinten, er rufe Elia“ oder „Der da ruft Elia um Hilfe“
  rationale: Der griechische Text berichtet die Wahrnehmung der Umstehenden, ohne sie in diesem Vers ausdrücklich zu bewerten. Die wahrscheinliche Verwechslung mit Jesu Ruf aus dem vorigen Vers wird daher nur in einer Fußnote erläutert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Der da“ erhält die deiktische Kraft von οὗτος; die Syntax bleibt quellennah, ohne unnatürlich zu wirken.
