  source_fidelity: Der Entwurf gibt die Personen, die deiktische Bezeichnung οὗτος und den offenen Ausdruck φωνεῖ Ἠλίαν sachgerecht wieder. Die Nebenordnung „hörten es und sagten“ schwächt jedoch die vom aoristischen Partizip ἀκούσαντες angezeigte zeitliche Einordnung („als/nachdem sie es hörten“) etwas ab.
  naturalness: „Der da ruft Elia“ ist im modernen Standarddeutsch verständlich und bewahrt die im Griechischen offene Ausdrucksweise. Eine Konstruktion mit „als sie es hörten“ ist zugleich natürlicher und quellennäher als die bloße Nebenordnung.
  terminology: „Elia“ ist die übliche deutsche Namensform. „Der da“ gibt die demonstrative, potenziell distanzierende Nuance von οὗτος idiomatisch wieder, ohne eine abwertende Haltung zwingend zu behaupten. Die Fußnoten erläutern den Kontext, ohne den Haupttext theologisch festzulegen.
