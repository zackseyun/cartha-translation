  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: de
  text: Deshalb heißt jenes Feld bis heute »Blutacker«.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Deshalb
  rationale: Kennzeichnet die Folgerung aus der zuvor erzählten Verwendung des Blutgeldes; »Deshalb« ist im modernen Deutsch klar und natürlich.
- source_word: ἐκλήθη
  choice: heißt
  rationale: Der Aorist Passiv bezeichnet die Benennung. Zusammen mit »bis heute« gibt das deutsche Präsens idiomatisch wieder, dass der Name damals entstand und weiterhin gebräuchlich ist.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: jenes Feld
  rationale: Bewahrt sowohl die Grundbedeutung von ἀγρός als auch den rückverweisenden Demonstrativcharakter von ἐκεῖνος.
- source_word: Ἀγρὸς Αἵματος
  choice: Blutacker
  rationale: Ein natürlicher und traditionsnaher deutscher Ortsname, der die Verbindung von ἀγρός und dem Genitiv αἵματος kompakt wiedergibt. Der Wechsel von »Feld« zu »Acker« vermeidet im Deutschen eine schwerfällige Bezeichnung, ohne den Sinn zu verändern.
- source_word: ἕως τῆς σήμερον
  choice: bis heute
  rationale: Die geläufige deutsche Entsprechung für die zeitliche Aussage, dass die Bezeichnung bis zur Gegenwart des Erzählers fortbestand.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die knappe Satzstruktur und der etablierte Ortsname »Blutacker« bewahren den erzählerischen Nachdruck.
