  source_fidelity: 'Die Übersetzung bildet die Satzstruktur und den Sinn des griechischen Textes zuverlässig ab: der amtliche Imperativ, das unbestimmt gehaltene Sichern des Grabes, die befürchtete Handlung der Jünger, die passivische Auferweckungsaussage und der Vergleich von letzter und erster πλάνη bleiben erhalten. „Sonst“ gibt die konsekutive Zuspitzung des abschließenden καί-Satzes idiomatisch wieder, ohne den Inhalt zu verändern.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit einem angemessen würdigen Register. „Ihn stehlen“ ist im Deutschen markierter als etwa „seinen Leichnam stehlen“, bewahrt aber bewusst das persönliche Pronomen αὐτόν und vermeidet eine im Ausgangstext nicht ausdrücklich genannte Ergänzung.
  terminology: „Grab“, „zum Volk“, „von den Toten auferweckt worden“ und „letzte Täuschung“ sind sachgerecht. Besonders die passive Form von Ἠγέρθη wird korrekt bewahrt, ohne den impliziten Handelnden zu benennen oder eine aktivische Lesart vorzuziehen. Die Fußnoten geben sowohl die relevante Textvariante als auch die mögliche deutsche Zeitform präzise wieder.
