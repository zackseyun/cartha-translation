id: MAT.27.64
reference: Matthew 27:64
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: de
  text: 'Ordne deshalb an, dass das Grab bis zum dritten Tag gesichert wird, damit nicht etwa seine Jünger kommen[a], ihn stehlen und zum Volk sagen: »Er ist von den Toten auferweckt worden.«[b] Sonst wird die letzte Täuschung schlimmer sein als die erste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen nach „kommen“ die Worte „bei Nacht“ hinzu: „damit nicht etwa seine Jünger bei Nacht kommen und ihn stehlen“. Hier wird der kürzere Text wiedergegeben.'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „Er wurde von den Toten auferweckt.“ Das griechische Verb steht im Passiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: Ordne … an
  rationale: Der Aoristimperativ fordert eine entschiedene amtliche Anordnung; die Wendung ist im Deutschen natürlich und entspricht Pilatus’ Autorität.
- source_word: οὖν
  choice: deshalb
  rationale: Kennzeichnet die Folgerung aus der zuvor erwähnten Ankündigung Jesu und klingt im heutigen Deutsch natürlicher als „daher“ oder „darum“ an dieser Stelle.
- source_word: ἀσφαλισθῆναι
  choice: dass … gesichert wird
  rationale: Das passive Verb bezeichnet das Sichern des Grabes, ohne die Mittel bereits auf Bewachung oder Versiegelung festzulegen.
- source_word: τὸν τάφον
  choice: das Grab
  rationale: „Grab“ ist die übliche deutsche Bezeichnung für die in diesem Zusammenhang gemeinte Felsgrabanlage.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: bis zum dritten Tag
  rationale: Bewahrt die zeitliche Formulierung und ihren Bezug auf Jesu Auferstehungsankündigung.
- source_word: μήποτε
  choice: damit nicht etwa … Sonst
  rationale: Gibt die befürchtete Möglichkeit und den daraus erwarteten Ausgang in natürlichem Deutsch wieder.
- source_word: ἐλθόντες οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger kommen
  rationale: Das vorzeitige Partizip wird in der deutschen Satzfolge idiomatisch als koordiniertes Verb wiedergegeben; „bei Nacht“ gehört nicht zum zugrunde gelegten Text.
- source_word: κλέψωσιν αὐτόν
  choice: ihn stehlen
  rationale: Bewahrt das persönliche Pronomen des griechischen Textes, statt es erklärend durch „seinen Leichnam“ zu ersetzen.
- source_word: εἴπωσιν τῷ λαῷ
  choice: zum Volk sagen
  rationale: λαός bezeichnet hier das Volk allgemein, nicht nur eine gerade versammelte Menschenmenge.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: Er ist von den Toten auferweckt worden
  rationale: Bewahrt das Passiv des griechischen Verbs und gibt die vollzogene Auferweckung in natürlichem deutschen Perfekt wieder.
- source_word: ἡ ἐσχάτη πλάνη
  choice: die letzte Täuschung
  rationale: „Täuschung“ bezeichnet hier die von den Sprechern unterstellte irreführende Behauptung, ohne ihre Wertung als Erzählerurteil auszugeben.
- source_word: χείρων τῆς πρώτης
  choice: schlimmer … als die erste
  rationale: Gibt den Komparativ und den bewusst nicht näher bestimmten Bezug der „ersten“ Täuschung unverändert wieder.
theological_decisions:
- issue: Passivische Form der Auferstehungsaussage
  choice: Er ist von den Toten auferweckt worden
  alternative: Er ist von den Toten auferstanden
  rationale: Das griechische Ἠγέρθη ist passiv. Die Übersetzung bewahrt diese Form und damit den unausgesprochenen Handelnden, statt zu einer intransitiven Formulierung zu wechseln.
- issue: Status der behaupteten Täuschung
  choice: die letzte Täuschung
  alternative: der letzte Irrtum
  rationale: πλάνη bezeichnet im Mund der Gegner eine bewusste Irreführung. Die Übersetzung lässt zugleich erkennbar, dass diese Einschätzung Teil ihrer Rede ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die amtliche Bitte an Pilatus bleibt bestimmt formuliert; ungewöhnliche, aber inhaltlich wichtige Einzelheiten wie „ihn stehlen“ und das Passiv „auferweckt worden“ werden bewahrt. Die Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Textstellen.
