reference: Matthew 27:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: de
  text: 'Jesus stand vor dem Statthalter, und der Statthalter fragte ihn: »Bist du der König der Juden[a]?« Jesus sagte: »Du sagst es.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Judäer«. Das griechische Wort kann je nach Zusammenhang die Juden im weiteren Sinn oder speziell die Bewohner Judäas bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Du sagst es selbst« oder »Es ist, wie du sagst«. Jesu Antwort ist im Griechischen knapp und in gewissem Maß elliptisch.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: stand
  rationale: Der Aorist Passiv von ἵστημι wird hier am natürlichsten intransitiv verstanden. »Stand« gibt die gerichtliche Situation knapp wieder; »wurde hingestellt« würde eine im Kontext nicht ausdrücklich genannte Verursachung hervorheben.
- source_word: ἔμπροσθεν
  choice: vor
  rationale: »Vor« ist die knappe, idiomatische Entsprechung und passt zur formellen Verhörszene.
- source_word: ἡγεμών / ἡγεμόνος
  choice: Statthalter
  rationale: »Statthalter« ist im Deutschen die geläufige Bezeichnung für den römischen Amtsträger in diesem Kontext. »Präfekt« wäre historisch genauer, aber für den Bibeltext unnötig fachsprachlich; »Herrscher« wäre zu allgemein.
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: »Fragte« ist natürliches modernes Deutsch und trägt durch den Kontext bereits den förmlichen Charakter des Verhörs. »Verhörte« wäre stärker, als das Verb allein verlangt.
- source_word: λέγων
  choice: durch Doppelpunkt wiedergegeben
  rationale: Der griechische Begleitumstand wird im Deutschen idiomatisch durch direkte Rede nach einem Doppelpunkt ausgedrückt; ein zusätzliches »und sagte« wäre schwerfällig.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: König der Juden
  rationale: Dies ist die geläufige und kontextuell passende politische und ethnische Bezeichnung. »König der Judäer« bleibt lexikalisch möglich und wird in einer Fußnote genannt.
- source_word: ἔφη
  choice: sagte
  rationale: φημί führt hier schlicht Jesu Replik ein. »Sagte« bleibt näher am Wortlaut als das kontextuell mögliche »antwortete«.
- source_word: Σὺ λέγεις
  choice: Du sagst es
  rationale: Die knappe deutsche Wendung bewahrt weitgehend den elliptischen und zurückhaltenden Charakter des Griechischen. Eine Formulierung wie »Ja, so ist es« würde die Aussage eindeutiger machen, als es der Wortlaut erlaubt.
theological_decisions:
- issue: Nuance von Jesu Antwort Σὺ λέγεις
  choice: 'Zurückhaltende, indirekte Zustimmung: »Du sagst es.«'
  alternative: 'Eindeutige Bestätigung: »Es ist, wie du sagst.«'
  rationale: Jesu Formulierung ist weder eine schlichte Verneinung noch eine uneingeschränkte Übernahme der politischen Fragestellung des Statthalters. Die Übersetzung bewahrt diese Spannung und erläutert die Ellipse in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Satzführung. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt. Der erste griechische Gegensatz- bzw. Fortsetzungsmarker δέ wird nicht eigens mit »aber« wiedergegeben, da der Zusammenhang die Fortführung bereits deutlich macht; ebenso wird das zweite δέ ohne schwerfällige Wiederholung natürlich angeschlossen.
