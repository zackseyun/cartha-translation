  source_fidelity: Der Text gibt ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος treffend mit „stand vor dem Statthalter“ wieder. Die Frage des Statthalters sowie Jesu knappe Erwiderung Σὺ λέγεις sind vollständig und ohne unzulässige Ausdeutung übertragen. Das nicht ausdrücklich wiedergegebene λέγων ist idiomatisch in die Einleitung der direkten Rede integriert.
  naturalness: Modernes, klares Standarddeutsch mit angemessen würdigem, narrativem Register. Die Satzführung und die deutschen Anführungszeichen sind natürlich. „Du sagst es“ ist im Deutschen knapp und lässt die im Griechischen bestehende Zurückhaltung stehen.
  terminology: „Statthalter“ ist für ἡγεμών etabliert und verständlich. „König der Juden“ ist die im Kontext übliche Wiedergabe von βασιλεὺς τῶν Ἰουδαίων; die Fußnote nennt „Judäer“ zutreffend als lexikalische Alternative. Die Fußnotenmarker sind im deutschen Text sinnvoll an den jeweils erläuterten Ausdruck gebunden.
