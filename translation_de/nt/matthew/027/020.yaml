revisions:
- from: Doch die Hohepriester und die Ältesten überredeten die Menschenmengen, Barabbas zu fordern, Jesus aber töten zu lassen.[a]
  to: Doch die Hohepriester und die Ältesten überredeten die Menschenmengen, Barabbas zu verlangen und Jesus umzubringen.[a]
  rationale: Die Revision erhält die adversative Verknüpfung und die parallele Struktur des griechischen Satzes. Sie vermeidet die durch „töten zu lassen“ eingeführte indirekte Kausation. Die Fußnote bewahrt die breitere mögliche Bedeutung von ἀπολέσωσιν, ohne eine bestimmte theologische oder juristische Deutung vorzugeben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:19:08Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den Gegensatz zwischen Barabbas und Jesus sowie die Rollen der Hohepriester, Ältesten und Menschenmengen grundsätzlich. „Jesus aber töten zu lassen“ verschiebt jedoch die aktive Form von ἀπολέσωσιν zu einer Veranlassung durch Dritte. Die griechische Konstruktion stellt beide Handlungen als Inhalt dessen dar, wozu die Menschenmengen überredet wurden.
  naturalness: „Doch die Hohepriester und die Ältesten“ ist modernes, würdiges Standarddeutsch. Die parallele Infinitivkonstruktion „Barabbas zu verlangen und Jesus umzubringen“ ist klarer und natürlicher als der Wechsel zu „töten zu lassen“.
  terminology: „Hohepriester“, „Älteste“, „Menschenmengen“ und „Barabbas“ sind angemessen. „verlangen“ gibt αἰτήσωνται im Kontext einer öffentlichen Forderung idiomatisch wieder; „umbringen“ gibt ἀπολέσωσιν im gerichtlichen Zusammenhang konkret wieder, ohne eine zusätzliche indirekte Veranlassung auszudrücken.
  issues:
  - severity: medium
    issue: „Jesus aber töten zu lassen“ verändert die Handlungszuordnung.
    rationale: ἀπολέσωσιν ist ein aktiver Aorist-Konjunktiv und steht parallel zu αἰτήσωνται als Ziel/Inhalt der Überredung. „Töten zu lassen“ macht aus der Handlung der Menschenmengen eine Bitte um ein Handeln anderer. Eine parallele aktive Infinitivkonstruktion bewahrt den griechischen Ausdruck besser.
  - severity: low
    issue: Die Fußnote bezeichnet die Alternative ungenau als „wörtlicher auch“.
    rationale: Bei einer Hauptübersetzung mit „töten zu lassen“ ist „zugrunde zu richten“ nicht einfach eine wörtlichere Variante, sondern eine breitere lexikalische Alternative. Die Fußnote sollte dies neutral kennzeichnen.
  revised_text: Doch die Hohepriester und die Ältesten überredeten die Menschenmengen, Barabbas zu verlangen und Jesus umzubringen.[a]
