id: MAT.27.20
reference: Matthew 27:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: de
  text: Doch die Hohepriester und die Ältesten überredeten die Menschenmengen, Barabbas zu verlangen und Jesus umzubringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Jesus zugrunde zu richten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Die Konjunktion markiert hier einen Gegensatz zur vorausgehenden Entwicklung; „Doch“ gibt diese adversative Funktion natürlich wieder.
- source_word: ἀρχιερεῖς
  choice: Hohepriester
  rationale: Der etablierte historische Ausdruck bezeichnet hier im Plural die führenden Mitglieder der Jerusalemer Priesterschaft.
- source_word: πρεσβύτεροι
  choice: Älteste
  rationale: Gemeint sind anerkannte jüdische Führungsvertreter; „Älteste“ bewahrt den institutionellen und historischen Sinn.
- source_word: ἔπεισαν
  choice: überredeten
  rationale: Das Verb bezeichnet den erfolgreichen Einfluss auf die Menschenmengen; „überredeten“ gibt den abgeschlossenen Vorgang treffend wieder.
- source_word: τοὺς ὄχλους
  choice: die Menschenmengen
  rationale: Die Wiedergabe erhält den Plural und bezeichnet die versammelten Gruppen, ohne sie pauschal mit dem ganzen Volk gleichzusetzen.
- source_word: ἵνα αἰτήσωνται
  choice: zu fordern
  rationale: Nach dem Verb des Überredens gibt der Infinitiv den Inhalt der beabsichtigten Forderung idiomatisch wieder. „Fordern“ passt zum öffentlichen Verlangen in dieser Gerichtsszene.
- source_word: τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Der Personenname wird nach der im Deutschen etablierten Form wiedergegeben; das Objekt wird durch die Infinitivkonstruktion klar erkennbar.
- source_word: τὸν δὲ Ἰησοῦν
  choice: Jesus aber
  rationale: Das zweite δέ stellt das unterschiedliche Geschick von Barabbas und Jesus ausdrücklich einander gegenüber.
- source_word: ἀπολέσωσιν
  choice: töten zu lassen
  rationale: Im gerichtlichen Zusammenhang ist das Herbeiführen von Jesu Tod gemeint. Die Formulierung ist im Deutschen konkret und macht deutlich, dass die Menge seine Tötung verlangen soll, nicht ihn selbst unmittelbar tötet.
theological_decisions:
- issue: Wiedergabe von ἀπολέσωσιν im Zusammenhang einer Hinrichtung
  choice: Jesus aber töten zu lassen
  alternative: Jesus aber zugrunde zu richten / zu vernichten
  rationale: Das griechische Verb ist weiter als ein technischer Ausdruck für Hinrichtung und kann „vernichten“ oder „zugrunde richten“ bedeuten. Im unmittelbaren gerichtlichen Kontext bezeichnet es jedoch konkret die Herbeiführung von Jesu Tod. Die Hauptübersetzung gibt diesen Sinn in natürlichem Deutsch wieder; die breitere lexikalische Bedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den scharfen Gegensatz zwischen Barabbas und Jesus. „Menschenmengen“ erhält bewusst den griechischen Plural und vermeidet eine Verallgemeinerung auf das gesamte Volk.
