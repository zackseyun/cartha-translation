  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: de
  text: 'Und siehe: Der Vorhang des Heiligtums[a] wurde von oben bis unten entzwei gerissen, und die Erde bebte, und die Felsen spalteten sich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Tempelvorhang.'
    reason: Die Verbindung kann im Deutschen auch zusammenfassend als „Tempelvorhang“ wiedergegeben werden; ναός bezeichnet hier genauer das Heiligtum innerhalb des Tempels.
lexical_decisions:
- source_word: ἰδοὺ
  choice: und sieh
  rationale: Die Wendung erhält den aufmerksamkeitslenkenden, dramatischen Erzählruf. „Siehe“ wäre traditionell, wirkt im heutigen Deutsch jedoch stärker altertümlich.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: Vorhang des Heiligtums
  rationale: καταπέτασμα bezeichnet hier den Tempelvorhang, während ναός genauer das Heiligtum und nicht den gesamten Tempelbezirk meint. Die Formulierung ist präzise und im Deutschen verständlich.
- source_word: ἐσχίσθη
  choice: wurde … entzwei gerissen
  rationale: Die passive Form des griechischen Verbs bleibt erhalten, ohne den Handelnden ausdrücklich zu benennen. „Entzwei“ gibt εἰς δύο idiomatisch wieder.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: von oben bis unten
  rationale: Dies ist die natürliche deutsche Entsprechung und bewahrt die hervorgehobene Richtung des Zerreißens.
- source_word: ἡ γῆ ἐσείσθη
  choice: die Erde bebte
  rationale: Die idiomatische aktive Formulierung gibt das Erdbeben klar wieder. „Erde“ lässt den im Zusammenhang möglichen umfassenderen Horizont offen, statt das Ereignis ausdrücklich auf den Boden oder das Land einzugrenzen.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: die Felsen spalteten sich
  rationale: „Felsen“ passt zu größeren Gesteinsmassen; „spalteten sich“ ist dafür natürliches Deutsch und spiegelt zugleich die Wiederaufnahme von σχίζω.
theological_decisions:
- issue: Bedeutung des zerrissenen Tempelvorhangs
  choice: Das Geschehen wird ohne theologische Deutung als Zerreißen des Vorhangs im Heiligtum wiedergegeben.
  alternative: Das Zerreißen ausdrücklich als Öffnung des Zugangs zu Gott oder als Gericht über den Tempel deuten.
  rationale: Der Vers berichtet das Zeichen, erklärt seine theologische Bedeutung jedoch nicht. Die Übersetzung bewahrt diese Offenheit.
- issue: Handelnder beim Zerreißen des Vorhangs
  choice: Die Passivform benennt keinen Handelnden.
  alternative: Gott ausdrücklich als Handelnden nennen.
  rationale: Auch wenn ein göttliches Handeln im Kontext naheliegen kann, nennt der griechische Text das Agens nicht; die Übersetzung ergänzt es daher nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und sieh“ bewahrt die dramatische Aufmerksamkeitsformel, ohne das stärker altertümliche „Und siehe“ zu verwenden. Die wiederholten „und“-Verbindungen spiegeln den eindringlichen Erzählrhythmus des griechischen Textes.
