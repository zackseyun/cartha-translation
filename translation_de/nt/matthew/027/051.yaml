  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Bedeutungen des griechischen Textes zuverlässig wieder: das ungenannte Passiv beim Zerreißen, „von oben bis unten“, die Zweiteilung, das Beben der Erde und das Spalten der Felsen. „Heiligtum“ ist für ναός in diesem Zusammenhang sachgerecht; die Fußnote wahrt die geläufige Alternative „Tempelvorhang“.'
  naturalness: Der einzige sichere Korrekturbedarf betrifft „Und sieh“. Als direkte Anrede im erzählenden Kontext klingt dies im modernen Standarddeutsch unidiomatisch und ist weniger natürlich als die etablierte feierlich-erzählende Wiedergabe „Und siehe“. Diese bewahrt die aufmerksamkeitslenkende Funktion von ἰδού, ohne eine zusätzliche zeitliche Nuance wie „plötzlich“ einzutragen.
  terminology: „Vorhang des Heiligtums“, „entzwei gerissen“, „die Erde bebte“ und „die Felsen spalteten sich“ sind terminologisch und stilistisch angemessen. Die Wiedergabe vermeidet eine nicht im Text enthaltene theologische Auslegung und benennt keinen Handelnden für das passive Zerreißen.
