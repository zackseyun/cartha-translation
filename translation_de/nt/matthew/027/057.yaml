id: MAT.27.57
reference: Matthew 27:57
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: de
  text: Als es Abend geworden war, kam ein reicher Mann aus Arimathäa namens Josef. Auch er war ein Jünger Jesu geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch er war von Jesus zum Jünger gemacht worden“; oder: „Auch er war ein Jünger Jesu.“'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Als es Abend geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Übergang. Die Formulierung gibt den eingetretenen Abend natürlich wieder; δέ wirkt hier als leichter Erzählanschluss und muss nicht eigens mit „nun“ übersetzt werden.
- source_word: ἦλθεν
  choice: kam
  rationale: Schlichte und natürliche Wiedergabe des Aorists von ἔρχομαι im Erzählzusammenhang.
- source_word: ἄνθρωπος πλούσιος
  choice: ein reicher Mann
  rationale: Direkte, idiomatische Wiedergabe der Substantiv-Adjektiv-Verbindung.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: aus Arimathäa
  rationale: ἀπό bezeichnet hier die Herkunft; „aus“ ist im Deutschen dafür die natürliche Präposition.
- source_word: τοὔνομα Ἰωσήφ
  choice: namens Josef
  rationale: Knappes, modernes Deutsch für die identifizierende Namensangabe.
- source_word: ὃς καὶ αὐτὸς
  choice: Auch er
  rationale: Bewahrt die durch καί und αὐτός ausgedrückte Hervorhebung, dass Josef ebenfalls zu den Jüngern gehörte.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: war ein Jünger Jesu geworden
  rationale: Gibt den passiven beziehungsweise resultativen Sinn von μαθητεύω verständlich wieder, ohne festzulegen, auf welche Weise Josef zum Jünger gemacht wurde.
theological_decisions:
- issue: Bedeutung von ἐμαθητεύθη in Beziehung zu Jesus
  choice: war ein Jünger Jesu geworden
  alternative: war von Jesus zum Jünger gemacht worden; war ebenfalls ein Jünger Jesu
  rationale: Das Passiv kann sowohl das Eintreten in die Jüngerschaft als auch das Zum-Jünger-gemacht-Werden ausdrücken. Die Hauptübersetzung bezeichnet Josefs erreichten Status, ohne die handelnde Person oder den Vorgang unnötig festzulegen; die Fußnote bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet einen schwerfälligen Relativsatz und lässt die Hervorhebung von ὃς καὶ αὐτός klar hervortreten.
