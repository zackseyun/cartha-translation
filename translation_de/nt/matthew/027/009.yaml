  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: de
  text: 'Da erfüllte sich, was durch den Propheten Jeremia gesagt worden war[a]: »Und sie nahmen die dreißig Silberstücke, den Preis dessen, dessen Wert sie unter den Söhnen Israels festgesetzt hatten[b],«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Matthäus schreibt dieses Prophetenwort Jeremia zu. Der Wortlaut weist die engste Parallele zu Sacharja 11,12–13 auf. Dies wird unterschiedlich erklärt: als zusammengesetztes Zitat, als Verweis auf eine prophetische Schriftsammlung oder als Problem der Textüberlieferung.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »von den Söhnen Israels«. Die griechische Formulierung ist schwierig; auch eine partitive Wiedergabe wie »unter den Söhnen Israels« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Markiert knapp und idiomatisch die zeitliche Folge innerhalb der Erzählung.
- source_word: ἐπληρώθη τὸ ῥηθὲν
  choice: erfüllte sich, was … gesagt worden war
  rationale: Bewahrt die matthäische Erfüllungsformel und gibt das substantivierte Partizip in natürlichem Deutsch wieder.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: durch den Propheten Jeremia
  rationale: Gibt διά mit Genitiv als prophetische Vermittlung wieder und behält die ausdrückliche Zuschreibung an Jeremia unverändert bei.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: die dreißig Silberstücke
  rationale: Bezeichnet verständlich Silber als Zahlungsmittel, ohne eine im griechischen Ausdruck nicht genannte Münzsorte festzulegen.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: den Preis dessen, dessen Wert … festgesetzt hatten
  rationale: Vermittelt den wirtschaftlichen Sinn von τιμή und τιμάω in natürlichem Deutsch; die Formulierung wahrt den Bezug auf die Person, der ein Wert zugemessen wurde.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: einige von den Söhnen Israels
  rationale: Gibt die wahrscheinlich partitive Bedeutung der schwierigen Präpositionalphrase verständlich wieder, ohne sie als völlig zweifelsfrei auszugeben.
theological_decisions:
- issue: Zuschreibung des Prophetenwortes an Jeremia, obwohl der Wortlaut besonders Sacharja 11,12–13 ähnelt
  choice: Jeremia bleibt im Haupttext ausdrücklich genannt.
  alternative: Den Namen in Sacharja ändern oder die Zuschreibung im Haupttext harmonisierend verallgemeinern.
  rationale: Der vorliegende griechische Text nennt Jeremia. Die Übersetzung bewahrt diese Spannung, statt sie stillschweigend aufzulösen.
- issue: Mehrdeutigkeit von ἀπὸ υἱῶν Ἰσραήλ
  choice: 'partitiv: „einige von den Söhnen Israels“'
  alternative: „von den Söhnen Israels“ beziehungsweise „unter den Söhnen Israels“
  rationale: Die partitive Deutung ergibt im Deutschen einen nachvollziehbaren Satz, doch die ungewöhnliche griechische Fügung lässt andere Zuordnungen zu; deshalb wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erfüllungsformel bleibt erkennbar, während schwer verständliche nominale Wiederholungen so weit geglättet werden, dass der wirtschaftliche Sinn von Preis und Wert erhalten bleibt. Das offene Komma am Versende folgt dem fortlaufenden Zitat, das im nächsten Vers weitergeht.
