id: MAT.27.6
reference: Matthew 27:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: de
  text: 'Die führenden Priester nahmen die Silberstücke und sagten: »Es ist nicht erlaubt, sie in den Tempelschatz[a] zu legen, denn es ist Blutgeld[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch κορβανᾶν (korban): der heilige Schatz beziehungsweise die für den Tempel bestimmten Gelder.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Preis für Blut« oder »Preis des Blutes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural bezeichnet hier die ranghöchsten beziehungsweise maßgeblichen priesterlichen Autoritäten. »Führende Priester« ist in modernem Deutsch verständlich und vermeidet die missverständliche Vorstellung mehrerer gleichzeitig amtierender Hoherpriester.
- source_word: λαβόντες
  choice: nahmen
  rationale: Der griechische Aoristpartizip wird als natürlich anschließende Handlung wiedergegeben; die zeitliche Folge bleibt aus dem Zusammenhang klar.
- source_word: τὰ ἀργύρια
  choice: die Silberstücke
  rationale: Die Formulierung greift die zuvor erwähnte Zahlung auf, bewahrt den konkreten Bezug zum Silber und legt keinen im Vers ungenannten Münztyp fest.
- source_word: Οὐκ ἔξεστιν
  choice: Es ist nicht erlaubt
  rationale: Gibt die Aussage über religiös-rechtliche Zulässigkeit klar und idiomatisch wieder, ohne sie unnötig auf staatliches Recht zu verengen.
- source_word: βαλεῖν
  choice: zu legen
  rationale: Im Zusammenhang mit dem Tempelschatz bezeichnet βάλλω das Einbringen beziehungsweise Hineinlegen; »legen« klingt hier natürlicher als das wörtlichere »werfen«.
- source_word: κορβανᾶν
  choice: Tempelschatz
  rationale: Das Lehnwort bezeichnet hier den heiligen Schatz beziehungsweise die für den Tempel bestimmten Gelder. Die Übersetzung macht den institutionellen und kultischen Bezug unmittelbar verständlich.
- source_word: ἐπεὶ
  choice: denn
  rationale: Leitet knapp und natürlich die Begründung für das Verbot ein.
- source_word: τιμὴ αἵματός
  choice: Blutgeld
  rationale: Die feste deutsche Wendung gibt den Sinn prägnant wieder. Die wörtlichere Form »Preis für Blut« wird in der Fußnote bewahrt, da die griechische Genitivverbindung knapp und in ihrer Beziehung leicht mehrdeutig ist.
theological_decisions:
- issue: Wiedergabe von κορβανᾶν als kultisch gebundener Geldbestand
  choice: Tempelschatz
  alternative: Korban; heiliger Schatz
  rationale: »Tempelschatz« vermittelt heutigen Lesern den konkreten Bezug auf die heiligen Tempelgelder, ohne aus dem Begriff eine weitergehende Lehrfrage zu machen. Die aramäisch-griechische Bezeichnung wird in der Fußnote dokumentiert.
- issue: Wiedergabe von τιμὴ αἵματός
  choice: Blutgeld
  alternative: Preis für Blut; Preis des Blutes
  rationale: »Blutgeld« ist im Deutschen idiomatisch und bezeichnet Geld, das mit der Herbeiführung eines Todes verbunden ist. Eine Fußnote erhält die formale Nähe zur griechischen Wendung und damit deren knappe Bildlichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und rechtlich-kultisch geprägt. »Führende Priester« ist verständlicher als der traditionelle, potenziell missverständliche Plural »Hohepriester«; »Blutgeld« ist idiomatisch, während die Fußnote die griechische Formulierung offenlegt.
