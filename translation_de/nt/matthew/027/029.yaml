id: MAT.27.29
reference: Matthew 27:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: de
  text: 'Sie flochten eine Krone aus Dornen, setzten sie ihm auf den Kopf und steckten ihm ein Schilfrohr in die rechte Hand. Dann knieten sie vor ihm nieder, verspotteten ihn und sagten: »Sei gegrüßt, König der Juden![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »König der Judäer«. Das griechische Wort kann sowohl Juden als auch Judäer bezeichnen; hier steht es in dem spöttisch gebrauchten Königstitel für Jesus.'
    reason: Lexikalische Alternative und Bewahrung des möglichen regionalen Bedeutungsanteils von Ἰουδαίων.
lexical_decisions:
- source_word: πλέξαντες
  choice: sie flochten
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Die finite Form ergibt im Deutschen eine natürliche und klare Abfolge.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: eine Krone aus Dornen
  rationale: στέφανος kann einen Kranz bezeichnen; im Zusammenhang der verspotteten Königswürde gibt „Krone“ die beabsichtigte Symbolik treffend wieder. „Aus Dornen“ bezeichnet das Material.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: setzten sie ihm auf den Kopf
  rationale: Die deutsche Wendung gibt das Aufsetzen der Krone präzise und idiomatisch wieder.
- source_word: κάλαμον ἐν τῇ δεξιᾷ αὐτοῦ
  choice: steckten ihm einen Rohrstab in die rechte Hand
  rationale: κάλαμος ist wörtlich ein Rohr beziehungsweise Rohrstab, der hier als Spottzepter dient. „Rohrstab“ bewahrt das konkrete Bild, ohne den Gegenstand ausdrücklich als Zepter auszudeuten.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: Dann knieten sie vor ihm nieder
  rationale: Die Formulierung bewahrt die gespielte Huldigung und gibt das Aoristpartizip in natürlicher deutscher Satzfolge wieder.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: verspotteten ihn
  rationale: „Verspotten“ trifft die höhnische, bewusst erniedrigende Handlung in einem würdigen Erzählregister.
- source_word: Χαῖρε
  choice: Sei gegrüßt
  rationale: Im Kontext ist die übliche Grußformel als ironische königliche Huldigung gebraucht. „Sei gegrüßt“ lässt sowohl die Grußbedeutung als auch den feierlich-spöttischen Ton erkennen.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: König der Juden
  rationale: Die Anredeform wird im Deutschen mit „König“ wiedergegeben. „Juden“ entspricht hier dem geläufigen ethnisch-religiösen Sinn des Titels; die mögliche regionale Wiedergabe wird in der Fußnote offengehalten.
theological_decisions:
- issue: Ironischer Königshuldigungsruf
  choice: »Sei gegrüßt, König der Juden!«
  alternative: »Heil dir, König der Juden!«
  rationale: Die gewählte Fassung bewahrt die Form einer ehrerbietigen Anrede und damit die Ironie der Szene, ohne im modernen Deutschen unerwünschte politische Nebenklänge von „Heil“ hervorzurufen.
- issue: Bedeutungsumfang von Ἰουδαίων
  choice: Juden
  alternative: Judäer
  rationale: Im Passionskontext bezeichnet die Formel den gegen Jesus verwendeten Königstitel und ist nicht eindeutig auf Bewohner der Region Judäa beschränkt. Die Fußnote erhält die lexikalisch mögliche regionale Lesart.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur wurde gegenüber der langen griechischen Partizipialkonstruktion gegliedert, während Reihenfolge, Spottgesten und königliche Symbolik erhalten bleiben.
