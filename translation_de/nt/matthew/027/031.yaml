id: MAT.27.31
reference: Matthew 27:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: de
  text: Nachdem sie ihn verspottet hatten, zogen sie ihm den Umhang[a] aus, zogen ihm seine eigenen Kleider an und führten ihn ab, um ihn zu kreuzigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Mantel. Das griechische Wort bezeichnet ein Übergewand, häufig einen kurzen Mantel oder militärischen Umhang; hier ist das Spottgewand gemeint, das Jesus zuvor angelegt worden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: verspottet hatten
  rationale: Das Verb bezeichnet höhnische, verächtliche Verspottung. Das Plusquamperfekt gibt im deutschen Erzählfluss die zeitliche Vorordnung der Handlung im ὅτε-Satz natürlich wieder.
- source_word: χλαμύδα
  choice: Umhang
  rationale: χλαμύς bezeichnet ein äußeres Kleidungsstück, häufig einen kurzen Mantel oder militärischen Umhang. „Umhang“ ist im Kontext verständlich und legt keine tatsächliche königliche Amtskleidung nahe.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: zogen sie ihm den Umhang aus
  rationale: ἐκδύω bezeichnet das Ausziehen beziehungsweise Entkleiden. Die deutsche Formulierung bewahrt die konkrete Handlung und ist idiomatisch.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: zogen ihm seine eigenen Kleider an
  rationale: ἐνδύω bezeichnet hier das Bekleiden einer Person; ἱμάτια ist die allgemeine Mehrzahl für Kleidung. „Seine eigenen Kleider“ macht den durch αὐτοῦ bezeichneten Gegensatz zum zuvor entfernten Spottgewand deutlich.
- source_word: ἀπήγαγον
  choice: führten ihn ab
  rationale: ἀπάγω bedeutet, jemanden wegzuführen. „Abführen“ passt zur bewachten Wegführung eines Gefangenen und ist knapp und natürlich.
- source_word: εἰς τὸ σταυρῶσαι
  choice: um ihn zu kreuzigen
  rationale: Die Verbindung aus εἰς und substantiviertem Infinitiv drückt den Zweck aus. Der deutsche Finalsatz gibt dies unmittelbar wieder.
theological_decisions: []
