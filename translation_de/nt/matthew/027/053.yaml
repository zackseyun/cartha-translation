id: MAT.27.53
reference: Matthew 27:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: de
  text: Und nach seiner Auferstehung kamen sie aus den Gräbern heraus, gingen in die heilige Stadt und erschienen vielen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „heilige Stadt“ ist Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: nachdem sie … herausgekommen waren
  rationale: Das Aoristpartizip bezeichnet hier eine der Haupthandlung vorausgehende Handlung. Die temporale Wiedergabe ist im Deutschen natürlich und bewahrt das Verhältnis zum Hauptverb.
- source_word: μνημείων
  choice: Gräbern
  rationale: μνημεῖον bezeichnet eine Grabstätte bzw. ein Grab. „Gräber“ passt zu den im vorherigen Vers geöffneten Grabstätten.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: nach seiner Auferstehung
  rationale: μετά mit Akkusativ ist temporal („nach“). ἔγερσις bezeichnet hier die Auferstehung Jesu; der Bezug des Pronomens ergibt sich aus dem Kontext.
- source_word: εἰσῆλθον
  choice: gingen sie in
  rationale: Bei einer Stadt ist „in die Stadt gehen“ natürliches modernes Deutsch und gibt den Eintritt sachgerecht wieder.
- source_word: τὴν ἁγίαν πόλιν
  choice: die heilige Stadt
  rationale: Die traditionelle und zugleich verständliche biblische Bezeichnung für Jerusalem bleibt erhalten, ohne den Ortsnamen in den Haupttext einzutragen.
- source_word: ἐνεφανίσθησαν
  choice: erschienen
  rationale: Die Form bezeichnet hier das Sichtbarwerden vor anderen. „erschienen“ ist knapp, natürlich und wahrt die Aussage, ohne die Art des Erscheinens näher festzulegen.
- source_word: πολλοῖς
  choice: vielen
  rationale: Der substantivisch gebrauchte Dativ Plural bleibt wie im Griechischen unbestimmt; „Menschen“ muss nicht ergänzt werden.
theological_decisions:
- issue: Zuordnung der Zeitangabe „nach seiner Auferstehung“
  choice: Die Zeitangabe steht innerhalb des Partizipialsatzes und bezieht sich damit auf das Herauskommen aus den Gräbern; danach folgt der Gang in die Stadt.
  alternative: Man kann den Satz glatter als „Nach seiner Auferstehung kamen sie aus den Gräbern, gingen in die heilige Stadt …“ formulieren oder das Öffnen der Gräber in Vers 52 zeitlich vom Herauskommen nach der Auferstehung unterscheiden.
  rationale: Die griechische Wortfolge setzt μετὰ τὴν ἔγερσιν αὐτοῦ nach ἐκ τῶν μνημείων und vor das Hauptverb. Die Übersetzung bewahrt diese syntaktische Zuordnung, ohne das Verhältnis zum vorherigen Vers harmonisierend weiter auszudeuten.
- issue: Referent von „seiner“
  choice: Das Pronomen bezieht sich kontextuell auf Jesus.
  alternative: Der Vers nennt Jesus an dieser Stelle nicht nochmals ausdrücklich.
  rationale: Der Zusammenhang von Matthäus 27 macht Jesus zum naheliegenden Referenten; die pronominale Form des griechischen Textes bleibt jedoch auch im Deutschen erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas auffällige Folge „nachdem sie nach seiner Auferstehung“ ist bewusst beibehalten, weil sie die griechische Satzstruktur und die zeitliche Zuordnung genauer wahrt als eine stärker geglättete Formulierung.
