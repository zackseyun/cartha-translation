source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: de
  text: Dort waren viele Frauen, die aus der Ferne zusahen. Sie waren Jesus von Galiläa an gefolgt und dienten ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und unterstützten ihn.“ Das griechische Verb kann praktische Hilfe und Unterstützung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: Dort waren auch
  rationale: Das Imperfekt wird als schlichte Szenenbeschreibung wiedergegeben. δέ verbindet mild mit dem Vorhergehenden; „auch“ fügt die Frauen natürlich in die bereits beschriebene Szene ein, ohne einen starken Gegensatz zu behaupten.
- source_word: γυναῖκες πολλαὶ
  choice: viele Frauen
  rationale: Direkte und natürliche Wiedergabe von Substantiv und Mengenangabe.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: die aus der Ferne zusahen
  rationale: Das Präsenspartizip bezeichnet anhaltendes Beobachten; „zusahen“ passt idiomatisch zur Kreuzigungsszene. „Aus der Ferne“ bewahrt die räumliche Perspektive der griechischen Präpositionalphrase.
- source_word: αἵτινες
  choice: Sie
  rationale: Der qualitative Relativanschluss wird für gutes modernes Deutsch in einen neuen Satz überführt, ohne die Identität der Frauen oder die charakterisierende Zusatzinformation zu verändern.
- source_word: ἠκολούθησαν τῷ Ἰησοῦ
  choice: waren Jesus … gefolgt
  rationale: Das Plusquamperfekt macht deutlich, dass ihr Folgen der gegenwärtigen Kreuzigungsszene vorausging. Das griechische Dativobjekt wird nach deutschem Sprachgebrauch bei „folgen“ beibehalten.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: von Galiläa an
  rationale: Die Wendung kennzeichnet Galiläa als Ausgangspunkt ihres fortdauernden Mitgehens. „Von Galiläa an“ ist im Deutschen natürlicher und zeitlich-räumlich klarer als ein bloßes „aus Galiläa“, das ihre Herkunft bezeichnen könnte.
- source_word: διακονοῦσαι αὐτῷ
  choice: hatten ihm gedient
  rationale: „Dienen“ bewahrt die Breite von διακονέω für praktische Hilfe und Unterstützung, ohne den Ausdruck auf Hausarbeit oder ein späteres kirchliches Amt einzuengen.
theological_decisions:
- issue: Bedeutung des Dienstes der Frauen
  choice: hatten ihm gedient
  alternative: hatten ihn versorgt / hatten für ihn gesorgt
  rationale: Die offene Bezeichnung „dienen“ gibt den konkreten Unterstützungscharakter wieder, legt aber weder ausschließlich häusliche Versorgung noch ein formales kirchliches Dienstamt fest.
- issue: Zeitliches Verhältnis ihres Folgens zur Kreuzigungsszene
  choice: waren Jesus von Galiläa an gefolgt
  alternative: folgten Jesus von Galiläa an
  rationale: Das Plusquamperfekt stellt im Deutschen natürlich heraus, dass das Folgen bereits vor der hier beschriebenen Beobachtung begonnen hatte, ohne das griechische Aoristgefüge theologisch zu überdeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze vermeidet einen schweren Relativsatz. „Von Galiläa an“ verhindert die mögliche Fehldeutung, die Frauen seien lediglich galiläischer Herkunft. Der Fußnotenmarker steht unmittelbar nach der übersetzungsrelevanten Wendung.
