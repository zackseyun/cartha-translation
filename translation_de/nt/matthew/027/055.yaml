revisions:
- from: Dort waren auch viele Frauen, die aus der Ferne zusahen. Sie waren Jesus von Galiläa an gefolgt und hatten ihm gedient.[a]
  to: Dort waren viele Frauen, die aus der Ferne zusahen. Sie waren Jesus von Galiläa an gefolgt und dienten ihm.[a]
  rationale: Die Revision entfernt die nicht erforderliche additive Nuance von „auch“ und gibt das präsentische διακονοῦσαι mit „dienten“ wieder. Das Plusquamperfekt bei „waren ... gefolgt“ kann die dem Zuschauen vorausgehende Wegbegleitung idiomatisch ausdrücken; „dienten“ bewahrt zugleich den im Griechischen gegebenen begleitenden Charakter des Dienstes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:19:38Z'
review_pass:
  verdict: revise
  source_fidelity: Die Frauen werden zutreffend als aus der Ferne zuschauend und als Jesus seit/von Galiläa an gefolgt beschrieben. Die Wiedergabe von διακονοῦσαι als „hatten ihm gedient“ verschiebt jedoch das gleichzeitig bzw. begleitend gemeinte Präsenspartizip unnötig in eine vorzeitige, abgeschlossene Handlung.
  naturalness: Der Text ist grundsätzlich flüssiges modernes Standarddeutsch. „Dort waren viele Frauen“ ist als schlichte Szenenbeschreibung natürlicher und quellengetreuer als „Dort waren auch viele Frauen“, da „auch“ eine zusätzliche Einschlussnuance setzt, die δέ nicht verlangt.
  terminology: „dienen“ ist für διακονέω passend, sofern die Gleichzeitigkeit mit dem Folgen/der dargestellten Szene erhalten bleibt. Es wahrt die Offenheit zwischen praktischer Unterstützung und Dienst, ohne ein kirchliches Amt einzutragen.
  issues:
  - severity: medium
    issue: Zeitform von „hatten ihm gedient“
    rationale: διακονοῦσαι ist ein Präsenspartizip und steht koordiniert zu θεωροῦσαι. Das Plusquamperfekt stellt den Dienst als bereits abgeschlossene Vorhandlung dar; der griechische Text beschreibt ihn vielmehr als begleitenden bzw. fortdauernden Dienst.
  - severity: low
    issue: Hinzufügung von „auch“
    rationale: δέ ist ein milder Anschluss, aber „auch“ kann im Deutschen eine ausdrückliche additive Nuance vermitteln. Die einfache Szenenfortführung ohne „auch“ ist präziser.
  revised_text: Dort waren viele Frauen, die aus der Ferne zusahen. Sie waren Jesus von Galiläa an gefolgt und dienten ihm.[a]
  revised_footnotes:
  - marker: a
    text: 'Oder: „und unterstützten ihn.“ Das griechische Verb kann praktische Hilfe und Unterstützung bezeichnen.'
    reason: lexical_alternative
  revision_rationale: Die Revision entfernt die nicht erforderliche additive Nuance von „auch“ und gibt das präsentische διακονοῦσαι mit „dienten“ wieder. Das Plusquamperfekt bei „waren ... gefolgt“ kann die dem Zuschauen vorausgehende Wegbegleitung idiomatisch ausdrücken; „dienten“ bewahrt zugleich den im Griechischen gegebenen begleitenden Charakter des Dienstes.
