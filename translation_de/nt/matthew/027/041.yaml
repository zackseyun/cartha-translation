  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: de
  text: 'Ebenso verspotteten ihn auch die Hohenpriester zusammen mit den Schriftgelehrten und Ältesten und sagten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Ebenso
  rationale: Das Adverb stellt eine Entsprechung zum unmittelbar zuvor geschilderten Spott her und klingt im Deutschen knapp und natürlich.
- source_word: καὶ
  choice: auch
  rationale: 'καί hat hier additive Kraft: Neben den zuvor genannten Personen beteiligten sich auch die führenden Priester am Spott.'
- source_word: ἀρχιερεῖς
  choice: führende Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der priesterlichen Führungsschicht, nicht mehrere Inhaber eines einzigen Hohepriesteramtes. „Führende Priester“ ist für heutige Leser verständlich und sachlich präzise.
- source_word: ἐμπαίζοντες
  choice: verspotteten ihn
  rationale: Das Partizip bezeichnet höhnischen Spott. Das im Kontext eindeutige Objekt Jesus wird im Deutschen mit „ihn“ ausgedrückt; zusammen mit dem imperfektischen ἔλεγον wird der Vorgang natürlich als koordinierte Handlung wiedergegeben.
- source_word: μετὰ
  choice: zusammen mit
  rationale: μετά mit Genitiv bezeichnet hier die Gemeinschaft der Beteiligten und nicht bloß räumliche Nähe.
- source_word: γραμματέων
  choice: Schriftgelehrten
  rationale: Dies ist die etablierte und kontextgerechte deutsche Wiedergabe für γραμματεῖς.
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: Der Ausdruck bezeichnet hier anerkannte jüdische Führungspersonen und nicht lediglich ältere Männer.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt beschreibt die fortdauernde Szene. Im Deutschen trägt der narrative Zusammenhang diesen Aspekt ausreichend; „sagten“ vermeidet eine schwerfällige Verlaufsform.
theological_decisions:
- issue: Beteiligung der genannten Gruppen am Spott
  choice: Die führenden Priester verspotten Jesus zusammen mit den Schriftgelehrten und Ältesten.
  alternative: Die führenden Priester spotten lediglich in Gegenwart der Schriftgelehrten und Ältesten.
  rationale: μετά mit Genitiv bezeichnet in dieser Konstruktion am natürlichsten gemeinschaftliche Beteiligung. Die Übersetzung macht keine weitergehende lehrmäßige Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktion wurde zur natürlichen deutschen Koordination umgeformt; der Doppelpunkt führt in die in den Folgeversen wiedergegebene direkte Rede ein.
