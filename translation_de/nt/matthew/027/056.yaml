id: MAT.27.56
reference: Matthew 27:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: de
  text: Unter ihnen waren Maria aus Magdala, Maria, die Mutter von Jakobus und Josef,[a] und die Mutter der Söhne des Zebedäus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften beziehungsweise Textüberlieferungen haben hier „Joses“ statt „Josef“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: unter ihnen
  rationale: Die Wendung verweist auf die im vorherigen Vers genannte Gruppe von Frauen. „Unter ihnen“ gibt die Zugehörigkeit im Deutschen natürlich wieder.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria aus Magdala
  rationale: Die Herkunftsbezeichnung wird transparent und in natürlichem modernem Deutsch wiedergegeben.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Maria, die Mutter von Jakobus und Josef
  rationale: Die Genitive identifizieren Maria anhand ihrer Söhne; „Jakobus“ und „Josef“ sind die üblichen deutschen Namensformen.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: die Mutter der Söhne des Zebedäus
  rationale: Die Formulierung bewahrt die griechische Genitivstruktur, bleibt aber klar und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt eng an der griechischen Satzstruktur; zur eindeutigen Zuordnung steht das Fußnotenzeichen unmittelbar nach „Josef“.
