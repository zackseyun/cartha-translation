id: MAT.27.27
reference: Matthew 27:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: de
  text: Dann nahmen die Soldaten des Statthalters Jesus mit in das Prätorium[a] und versammelten die ganze Kohorte um ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Amtssitz des Statthalters“. Der griechische Ausdruck bezeichnet die offizielle Residenz oder das militärische Hauptquartier des römischen Statthalters.'
    reason: lexical_alternative
  - marker: b
    text: „Kohorte“ ist ein römischer militärischer Fachbegriff. Gemeint sein kann die betreffende Truppeneinheit, ohne dass zwingend jeder Soldat einer Kohorte anwesend gewesen sein muss.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Gibt den zeitlichen Fortgang der Erzählung knapp und natürlich wieder.
- source_word: οἱ στρατιῶται τοῦ ἡγεμόνος
  choice: die Soldaten des Statthalters
  rationale: Bewahrt die Zuordnung zum römischen Provinzverwalter; „Statthalter“ ist im deutschen biblisch-historischen Kontext präzise und allgemein verständlich.
- source_word: παραλαβόντες τὸν Ἰησοῦν
  choice: nahmen ... Jesus mit
  rationale: Gibt das Partizip als finite, idiomatische Handlung wieder und wahrt den Sinn des Mitnehmens beziehungsweise Übernehmens in ihre Gewalt.
- source_word: εἰς τὸ πραιτώριον
  choice: in das Prätorium
  rationale: Erhält den historisch spezifischen römischen Ausdruck; eine verständliche Erklärung steht in der Fußnote.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: versammelten ... um ihn
  rationale: Im Zusammenhang bezeichnet die Wendung das Zusammenkommen der Soldaten bei beziehungsweise rings um Jesus.
- source_word: ὅλην τὴν σπεῖραν
  choice: die ganze Kohorte
  rationale: „Kohorte“ bewahrt den römischen militärischen Fachbegriff, während „ganze“ ὅλην ausdrücklich wiedergibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der historisch präzise Fachbegriff „Prätorium“ bleibt im Haupttext erhalten und wird in einer Fußnote erklärt; „Kohorte“ bewahrt den militärischen Charakter des Ausgangstextes.
