  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: de
  text: 'Pilatus sagte zu ihnen: „Ihr habt eine Wache.[a] Geht und sichert es, so gut ihr könnt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Nehmt eine Wache“ oder „Ihr habt eure eigene Wache.“ Das Griechische kann so verstanden werden, dass Pilatus ihnen eine Wache bewilligt, oder so, dass er auf eine ihnen bereits zur Verfügung stehende Wache verweist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Πιλᾶτος
  choice: Pilatus sagte zu ihnen
  rationale: Die übliche Erzählformulierung gibt das Redeverb φημί und den Dativ αὐτοῖς natürlich und genau wieder.
- source_word: Ἔχετε
  choice: Ihr habt
  rationale: Die formale Aussage des Präsens wird beibehalten; je nach Zusammenhang kann sie zugleich als Hinweis auf eine vorhandene Wache oder als Bewilligung einer Wache verstanden werden.
- source_word: κουστωδίαν
  choice: eine Wache
  rationale: Das aus dem Lateinischen entlehnte κουστωδία bezeichnet hier einen Wachposten beziehungsweise eine Wachmannschaft; „Wache“ ist im Deutschen knapp und geläufig.
- source_word: ὑπάγετε
  choice: Geht
  rationale: Der Imperativ bezeichnet das Weggehen beziehungsweise den Aufbruch und wird im Deutschen direkt wiedergegeben.
- source_word: ἀσφαλίσασθε
  choice: sichert es
  rationale: Der mittlere Imperativ fordert dazu auf, etwas zuverlässig zu sichern. Das Pronomen greift das Grab aus dem unmittelbaren Kontext auf, ohne es ausdrücklich in den griechischen Satz einzutragen.
- source_word: ὡς οἴδατε
  choice: so gut ihr könnt
  rationale: Die idiomatische Wendung bezeichnet hier ein Vorgehen nach dem eigenen Wissen und Vermögen. Die deutsche Formulierung klingt natürlich, ohne eine konkrete Sicherungsmethode festzulegen.
theological_decisions:
- issue: Ob Pilatus mit Ἔχετε κουστωδίαν eine römische Wache bewilligt oder auf eine den jüdischen Führern bereits verfügbare Wache verweist
  choice: 'Im Haupttext steht neutral: „Ihr habt eine Wache.“'
  alternative: „Nehmt eine Wache“ oder „Ihr habt eure eigene Wache“
  rationale: Die knappe griechische Formulierung lässt sowohl eine Bewilligung als auch einen Hinweis auf eine bereits verfügbare Wache zu. Der Haupttext bewahrt diese Mehrdeutigkeit; die Fußnote nennt die möglichen Verständnisse, ohne die historische Frage vorzuentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und bestimmt. „So gut ihr könnt“ gibt die idiomatische Aussage von ὡς οἴδατε verständlich wieder; die zentrale Mehrdeutigkeit bei der Herkunft beziehungsweise Bewilligung der Wache bleibt erhalten.
