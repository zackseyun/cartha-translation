source:
  edition: SBLGNT
  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: de
  text: 'und sagte: »Ich habe gesündigt, weil ich unschuldiges Blut ausgeliefert habe.«[a] Doch sie sagten: »Was geht das uns an? Sieh du zu!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »nachdem ich unschuldiges Blut ausgeliefert habe«.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht ein Futur: »Du wirst sehen«; gemeint ist abweisend: »Das ist deine Verantwortung.«'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Ich habe gesündigt
  rationale: Das griechische Aorist bezeichnet das begangene Vergehen; im Deutschen bringt das Perfekt in diesem unmittelbaren Schuldbekenntnis sowohl die Tat als auch ihre gegenwärtige Schuldwirkung natürlich zum Ausdruck.
- source_word: παραδοὺς
  choice: weil ich … ausgeliefert habe
  rationale: Das Partizip erläutert hier am ehesten den Grund beziehungsweise Inhalt des Schuldbekenntnisses. »Ausliefern« wahrt die Grundbedeutung von παραδίδωμι und lässt den verräterischen Charakter aus dem Erzählzusammenhang hervorgehen, ohne ihn zusätzlich in das Verb hineinzulegen.
- source_word: αἷμα ἀθῷον
  choice: unschuldiges Blut
  rationale: Die knappe biblisch-rechtliche Wendung bleibt erhalten; der Bezug auf Jesus wird wie im Griechischen nicht ausdrücklich ergänzt.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Was geht das uns an?
  rationale: Diese natürliche deutsche Redewendung gibt die abweisende Frage und die Zurückweisung jeder Verantwortung prägnant wieder.
- source_word: σὺ ὄψῃ
  choice: Sieh du zu!
  rationale: Der formal futurische Ausdruck wird im Kontext idiomatisch und schroff im Sinn von »Kümmere dich selbst darum« gebraucht. Die betonte Wiedergabe »du« erhält das ausdrückliche σύ.
theological_decisions:
- issue: Ob der Bezug auf Jesus ausdrücklich gemacht werden soll
  choice: Die Wendung »unschuldiges Blut« bleibt ohne ergänzendes Objekt stehen.
  alternative: »das Blut eines Unschuldigen« oder ausdrückliche Nennung Jesu
  rationale: Der griechische Text lässt den Referenten in der festen Wendung unausgesprochen. Eine ausdrückliche Identifizierung würde zwar erklären, aber über den Wortlaut hinausgehen.
- issue: Ob σὺ ὄψῃ als Vorhersage oder als abweisende Aufforderung wiederzugeben ist
  choice: »Sieh du zu!«
  alternative: »Du wirst zusehen« / »Du wirst dich darum kümmern«
  rationale: Die Form ist grammatisch Futur, hat hier jedoch idiomatisch die Kraft einer schroffen Aufforderung. Eine rein vorhersagende Wiedergabe wäre im Deutschen missverständlich; die formale Besonderheit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch mit »und sagte« an den vorhergehenden Kontext an. Die direkte Rede klingt natürlich, bewahrt aber die biblische Wendung »unschuldiges Blut«. Die knappe Antwort der führenden Priester bleibt bewusst schroff.
