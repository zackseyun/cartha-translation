id: MAT.27.34
reference: Matthew 27:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: de
  text: Sie gaben ihm Wein zu trinken, der mit Galle vermischt war[a]. Doch als er ihn gekostet hatte, wollte er nicht trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort χολή kann „Galle“ oder allgemeiner einen bitteren Stoff bezeichnen. Hier steht „Galle“, um die Wortwahl des Matthäus zu bewahren; im verwandten Passionsbericht in Markus 15,23 wird Myrrhe genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Sie gaben ihm … zu trinken
  rationale: Die Formulierung bildet δίδωμι mit Dativ und dem ergänzenden Infinitiv eng ab und klingt im Deutschen natürlich.
- source_word: οἶνον
  choice: Wein
  rationale: Das gewöhnliche griechische Wort für Wein wird ohne Abschwächung wiedergegeben.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: der mit Galle vermischt war
  rationale: Das Partizip bezeichnet den Wein als bereits vermischt; χολή wird lexikalisch konkret mit „Galle“ wiedergegeben, während die Fußnote die mögliche allgemeinere Bedeutung nennt.
- source_word: καὶ γευσάμενος
  choice: Doch als er ihn gekostet hatte
  rationale: γευσάμενος bezeichnet das vorausgehende Kosten. „Doch“ macht den im Zusammenhang entstehenden Gegensatz zur anschließenden Ablehnung idiomatisch sichtbar, ohne den Sachgehalt zu erweitern.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: wollte er nicht trinken
  rationale: Die Wiedergabe bewahrt den Willensaspekt von θέλω und vermeidet die stärkere Deutung „er weigerte sich“.
theological_decisions:
- issue: Bedeutung von χολή im Passionsbericht und möglicher Schriftanklang
  choice: Galle
  alternative: Bitterstoff / etwas Bitteres
  rationale: χոլή kann konkret Galle beziehungsweise Gallensaft und erweitert einen bitteren Stoff bezeichnen. „Galle“ bewahrt Matthäus’ konkrete Wortwahl und einen möglichen Schriftanklang, ohne die Beziehung zu Markus 15,23 harmonisierend aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Gekostet“ ist hier präziser und stilistisch angemessener als das umgangssprachlichere „probiert“.
