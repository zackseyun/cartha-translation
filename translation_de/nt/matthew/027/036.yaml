lexical_decisions:
- source_word: καὶ
  choice: Dann
  rationale: Im fortlaufenden Erzählzusammenhang gibt die deutsche Folgepartikel den schlichten Anschluss natürlich wieder, ohne eine stärkere Folgerung auszudrücken.
- source_word: καθήμενοι
  choice: setzten sie sich
  rationale: Das präsentische Partizip bezeichnet hier die begleitende Handlung bzw. Körperhaltung; im Deutschen ist die koordinierte, idiomatische Wiedergabe natürlich und lässt sich im Zusammenhang als Sichsetzen verstehen.
- source_word: ἐτήρουν
  choice: bewachten
  rationale: Das Imperfekt beschreibt eine andauernde Tätigkeit. „Bewachten“ trifft im Hinrichtungskontext sowohl das Beobachten als auch das Sichern der bewachten Person.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf Jesus und wird direkt wiedergegeben.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb bezeichnet den Ort, an dem die Soldaten sitzen und Jesus bewachen.
