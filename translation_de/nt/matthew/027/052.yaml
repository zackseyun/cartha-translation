id: MAT.27.52
reference: Matthew 27:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: de
  text: Und die Gräber wurden geöffnet, und viele Leiber von Heiligen, die entschlafen waren[a], wurden auferweckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Entschlafen“ ist eine geläufige bildhafte Umschreibung für „gestorben sein“.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Gibt die einfache erzählerische Verbindung wieder, ohne eine genauere zeitliche Abfolge hinzuzufügen.
- source_word: τὰ μνημεῖα
  choice: die Gräber
  rationale: Bezeichnet hier die Grabstätten; „Gräber“ ist im modernen Deutschen natürlich und kontextgerecht.
- source_word: ἀνεῴχθησαν
  choice: wurden geöffnet
  rationale: Bewahrt die Passivform und fügt weder Ursache noch Mechanismus des Öffnens hinzu.
- source_word: πολλὰ σώματα
  choice: viele Leiber
  rationale: „Leiber“ gibt σώματα in diesem Zusammenhang würdig und präzise wieder; „Leichen“ wäre härter und würde den anschließenden Vorgang weniger neutral formulieren.
- source_word: τῶν κεκοιμημένων
  choice: die entschlafen waren
  rationale: Bewahrt das im frühjüdischen und christlichen Sprachgebrauch übliche Bild des Schlafes für den Tod; die Perfektbedeutung wird durch „waren“ erkennbar.
- source_word: ἁγίων
  choice: von Heiligen
  rationale: „Heilige“ ist die etablierte neutestamentliche Bezeichnung für Menschen, die Gott zugehören, ohne ihre Identität hier näher festzulegen.
- source_word: ἠγέρθησαν
  choice: wurden auferweckt
  rationale: Gibt das passive ἐγείρω im Kontext des Todes treffend wieder, ohne die genaue Art oder den endgültigen Charakter dieser Auferweckung eigens zu bestimmen.
theological_decisions:
- issue: Art des durch ἠγέρθησαν bezeichneten Geschehens
  choice: wurden auferweckt
  alternative: standen von den Toten auf / wurden endgültig auferweckt
  rationale: „Wurden auferweckt“ bewahrt die Auferstehungssprache des Verbs, legt aber nicht über den Vers hinaus fest, ob es sich um eine vorläufige Wiederbelebung oder eine endgültige Auferstehung handelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzkoordination des Griechischen bleibt erhalten; die Formulierung ist zugleich für heutige Leser verständlich. Der Fußnotenmarker steht unmittelbar bei dem erklärungsbedürftigen Ausdruck.
