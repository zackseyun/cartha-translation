  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: de
  text: 'Da sagt Pilatus zu ihm: „Hörst du nicht, was sie alles gegen dich bezeugen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Kennzeichnet natürlich und knapp den nächsten Schritt in der Erzählfolge.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt das historische Präsens und damit die Lebendigkeit der griechischen Erzählung.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Gibt das ausdrückliche Pronomen wieder, ohne den im Zusammenhang eindeutigen Bezug durch „Jesus“ zu ersetzen.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Bei Personennamen steht im modernen Standarddeutsch hier kein Artikel.
- source_word: Οὐκ ἀκούεις
  choice: Hörst du nicht
  rationale: Erhält die negative Frageform und die Grundbedeutung von ἀκούω.
- source_word: πόσα
  choice: was … alles
  rationale: Gibt im natürlichen Deutschen die große Zahl beziehungsweise Menge der gegen Jesus vorgebrachten Aussagen wieder, ohne „Anklagen“ in den Text einzutragen.
- source_word: σου … καταμαρτυροῦσιν
  choice: sie … gegen dich bezeugen
  rationale: Bewahrt den rechtlich-forensischen Sinn des Verbs und macht die durch den Genitiv ausgedrückte gegnerische Ausrichtung idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens bleibt erhalten. „Was … alles“ ist idiomatischer als das formal nähere, aber schwerfällige „wie viele Dinge“; der forensische Sinn von καταμαρτυρέω bleibt durch „gegen dich bezeugen“ erkennbar.
