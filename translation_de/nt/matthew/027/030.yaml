lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: nachdem sie ihn angespuckt hatten
  rationale: Das aoristische Partizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Die Nebensatzkonstruktion gibt die zeitliche Abfolge in natürlichem Deutsch klar wieder.
- source_word: ἔλαβον
  choice: nahmen sie
  rationale: Die schlichte Wiedergabe entspricht dem gewöhnlichen Sinn von λαμβάνω und fügt weder besondere Gewalt noch eine andere Art des Ergreifens hinzu.
- source_word: τὸν κάλαμον
  choice: das Rohr
  rationale: κάλαμος bezeichnet zunächst ein Rohr beziehungsweise Schilfrohr und kann auch einen daraus bestehenden Stab meinen. „Das Rohr“ bewahrt den Bezug zu dem zuvor in Jesu Hand gelegten Gegenstand und vermeidet die Festlegung auf einen königlichen Stab.
- source_word: ἔτυπτον
  choice: schlugen ... immer wieder
  rationale: Der Imperfekt stellt das Schlagen als andauernd oder wiederholt dar. „Immer wieder“ gibt hier den naheliegenden iterativen Verlauf in verständlichem Deutsch wieder.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: ihm ... auf den Kopf
  rationale: Bei τύπτω bezeichnet εἰς mit Akkusativ das Ziel der Schläge. Die deutsche Dativkonstruktion „ihm auf den Kopf“ ist idiomatisch und bewahrt den konkreten Sinn.
theological_decisions:
- issue: Darstellung der Misshandlung Jesu
  choice: Die Handlungen werden nüchtern, konkret und ohne Abschwächung wiedergegeben.
  alternative: Eine stärker formale Fassung wie „und nachdem sie ihn angespuckt hatten, nahmen sie das Rohr und waren dabei, auf seinen Kopf zu schlagen“
  rationale: Der Vers schildert Demütigung und fortgesetzte Gewalt. Die Übersetzung soll diese deutlich machen, ohne Motive, Empfindungen oder zusätzliche Einzelheiten in den Text einzutragen.
- issue: Aspekt des Imperfekts ἔτυπτον
  choice: Im Haupttext wird die wiederholte Handlung mit „immer wieder“ ausgedrückt.
  alternative: 'Eine fortdauernde Handlung: „und schlugen ihm fortwährend auf den Kopf“'
  rationale: Der griechische Imperfekt kann eine wiederholte oder andauernde Handlung darstellen. Im Kontext mehrerer Schläge ist die iterative Wiedergabe besonders natürlich; die mögliche durative Nuance bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. „Angespuckt“ und „auf den Kopf geschlagen“ sind bewusst konkret; die Formulierung mildert die Gewalt nicht ab und schmückt sie nicht aus.
