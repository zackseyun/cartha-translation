base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: de
  text: Und nachdem sie ihn angespuckt hatten, nahmen sie das Rohr[a] und schlugen ihm damit auf den Kopf.[b]
  philosophy: optimal-equivalence
  footnotes:
