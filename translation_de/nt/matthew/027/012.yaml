- from: Und während er von den Hohenpriestern und Ältesten angeklagt wurde, antwortete er nichts.[a]
  to: Und während er von den Oberpriestern und Ältesten angeklagt wurde, gab er keine Antwort.
  rationale: Die Revision präzisiert die Bezeichnung der ἀρχιερεῖς als „Oberpriester“ und ersetzt die unidiomatische direkte Objektkonstruktion durch die im modernen Deutschen natürliche Wendung „gab er keine Antwort“. Da diese Formulierung den Haupttext bildet, ist die bisherige Fußnote als bloße Alternative entbehrlich.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:19:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft Syntax und Aussage des griechischen Textes insgesamt: Die durative passive Anklagehandlung, die Tätergruppe und Jesu ausbleibende Erwiderung sind erhalten. „Hohenpriester“ ist jedoch für den Plural ἀρχιερεῖς weniger präzise, da damit im Deutschen leicht mehrere Inhaber des einen Hohenpriesteramts verstanden werden können; im matthäischen Kontext sind die führenden Priester gemeint.'
  naturalness: „Antwortete er nichts“ ist verständlich und nahe am Griechischen, wirkt im heutigen Standarddeutsch aber merklich unidiomatisch. „Gab er keine Antwort“ ist die natürliche, würdige Formulierung und gibt οὐδὲν ἀπεκρίνατο ohne Bedeutungsverlust wieder.
  terminology: „Oberpriester“ ist als feste deutsche Bibelterminologie für ἀρχιερεῖς geeignet und unterscheidet die priesterliche Führungsschicht vom singulären Hohenpriester. „Älteste“ ist korrekt.
  issues:
  - severity: medium
    issue: „Hohenpriestern“ für ἀρχιερέων
    rationale: Der griechische Plural bezeichnet hier die oberpriesterliche Führungsschicht, nicht mehrere Hohenpriester im engeren Sinn. „Oberpriestern“ ist im Deutschen sachgerechter und vermeidet diese mögliche Fehlassoziation.
  - severity: low
    issue: „antwortete er nichts“
    rationale: Die Formulierung bildet die griechische Kürze nach, ist aber im modernen Standarddeutsch weniger idiomatisch. „Gab er keine Antwort“ ist natürlich und semantisch gleichwertig.
  revised_text: Und während er von den Oberpriestern und Ältesten angeklagt wurde, gab er keine Antwort.
  revised_footnotes: []
  revision_rationale: Die Revision präzisiert die Bezeichnung der ἀρχιερεῖς als „Oberpriester“ und ersetzt die unidiomatische direkte Objektkonstruktion durch die im modernen Deutschen natürliche Wendung „gab er keine Antwort“. Da diese Formulierung den Haupttext bildet, ist die bisherige Fußnote als bloße Alternative entbehrlich.
