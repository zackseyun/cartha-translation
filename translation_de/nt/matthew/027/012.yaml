source:
  edition: SBLGNT
  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: de
  text: Und während er von den Oberpriestern und Ältesten angeklagt wurde, gab er keine Antwort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: während er … angeklagt wurde
  rationale: Die Konstruktion ἐν mit substantiviertem Infinitiv bezeichnet hier Gleichzeitigkeit; „während“ bewahrt den zeitlichen und durativen Sinn in natürlichem Deutsch.
- source_word: κατηγορεῖσθαι
  choice: angeklagt wurde
  rationale: Der passive Infinitiv beschreibt, dass Anschuldigungen gegen Jesus vorgebracht wurden; „angeklagt“ passt zum gerichtlichen Kontext.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: von den Hohenpriestern und Ältesten
  rationale: „Hohenpriester“ ist die im Deutschen übliche Bezeichnung für die führenden Angehörigen der Priesterschaft; „Älteste“ gibt πρεσβύτεροι konventionell und sachgerecht wieder.
- source_word: οὐδὲν
  choice: nichts
  rationale: Das Wort fungiert als Objekt zu ἀπεκρίνατο und wird direkt wiedergegeben, ohne die Aussage interpretierend auszuweiten.
- source_word: ἀπεκρίνατο
  choice: antwortete er
  rationale: Das deponentische Verb bedeutet hier „antworten“; zusammen mit οὐδέν ergibt sich die knappe Formulierung „antwortete er nichts“.
- source_word: καὶ
  choice: Und
  rationale: Die Konjunktion führt die Erzählung schlicht weiter und enthält keinen ausdrücklichen Gegensatz.
theological_decisions:
- issue: Jesu Schweigen gegenüber seinen Anklägern
  choice: Die Aussage wird als schlichte Erzählung wiedergegeben, ohne einen prophetischen Erfüllungshinweis hinzuzufügen.
  alternative: 'Die Formulierung stärker an Jesaja 53 anklingen lassen, etwa: „gab er keine Antwort“.'
  rationale: Obwohl Jesu Schweigen mit prophetischen Motiven in Verbindung gebracht werden kann, benennt dieser Vers selbst keine Erfüllung. Die Übersetzung belässt es daher bei der berichteten Tatsache.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nah am griechischen Erzählfluss; „antwortete er nichts“ bewahrt die knappe Direktheit des Ausgangstextes, während die Fußnote die idiomatischere Alternative nennt.
