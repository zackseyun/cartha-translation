id: MAT.27.3
reference: Matthew 27:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: de
  text: Als Judas, der ihn ausgeliefert hatte, nun sah, dass Jesus verurteilt worden war, empfand er Reue und brachte die dreißig Silberstücke den Hohepriestern und Ältesten zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: nun
  rationale: Kennzeichnet den zeitlichen Fortgang der Erzählung; in Verbindung mit dem temporalen Nebensatz klingt „nun“ im modernen Deutschen natürlich.
- source_word: ἰδὼν
  choice: als ... sah
  rationale: Das Aoristpartizip hat hier temporalen Sinn. Ein mit „als“ eingeleiteter Nebensatz gibt die Beziehung im Deutschen klar und idiomatisch wieder.
- source_word: Ἰούδας
  choice: Judas
  rationale: Eingebürgerte deutsche Namensform.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: der ihn ausgeliefert hatte
  rationale: Das substantivierte Partizip kennzeichnet Judas durch seine Rolle. „Ausgeliefert“ bewahrt die konkrete Bedeutung von παραδίδωμι und lässt zugleich den Verratsaspekt des Zusammenhangs erkennen.
- source_word: ὅτι κατεκρίθη
  choice: dass Jesus verurteilt worden war
  rationale: Das passive Verb bezeichnet das gegen Jesus ergangene Urteil. Der Name verdeutlicht den im Griechischen nur durch das Pronomen bezeichneten Bezug und verhindert im verschachtelten deutschen Satz ein missverständliches „er“.
- source_word: μεταμεληθεὶς
  choice: bereute er seine Tat
  rationale: μεταμέλομαι bezeichnet Bedauern oder Reue. Die Formulierung gibt die moralische Betroffenheit wieder, ohne das stärkere theologische Konzept umfassender Umkehr ausdrücklich festzulegen.
- source_word: ἔστρεψεν
  choice: brachte ... zurück
  rationale: Im Zusammenhang mit Geld und Empfängern bedeutet das Verb „zurückbringen“; diese Wendung ist im Deutschen natürlicher als „zurückkehren lassen“ oder „wenden“.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: die dreißig Silberstücke
  rationale: ἀργύρια bezeichnet silbernes Geld beziehungsweise Silberstücke. „Silberstücke“ ist verständlich, traditionsnah und legt keine historisch nicht näher bestimmte Münzsorte fest.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: zu den führenden Priestern und den Ältesten
  rationale: ἀρχιερεῖς bezeichnet hier die leitenden Angehörigen der Priesterschaft, nicht mehrere amtierende Hohepriester; „führende Priester“ ist daher sachlich transparent. „Älteste“ ist die etablierte Bezeichnung der jüdischen Führungsgruppe.
theological_decisions:
- issue: Bedeutung von μεταμεληθεὶς für Judas’ Reaktion
  choice: bereute er seine Tat
  alternative: tat er Buße / kehrte er um
  rationale: Der Text verwendet μεταμέλομαι, nicht μετανοέω. „Bereute“ drückt Reue aus, ohne Judas ausdrücklich eine umfassende geistliche Umkehr zuzuschreiben oder abzusprechen.
- issue: Wiedergabe von παραδιδοὺς
  choice: ausgeliefert hatte
  alternative: verraten hatte
  rationale: „Ausgeliefert“ bleibt näher an der Grundbedeutung des Verbs und bewahrt die Spannung zwischen konkreter Übergabe und dem im Kontext offensichtlichen Verrat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau löst das griechische Partizip temporal auf, ohne die Ereignisfolge zu verändern. „Silberstücke“ vermeidet eine unnötig genaue Bestimmung als Münzen.
