    issue: „seine Tat“ ergänzt ein nicht ausdrücklich genanntes Bezugsobjekt.
    rationale: μεταμεληθεὶς bezeichnet Judas’ Reue bzw. sein Bedauern, ohne im Vers selbst zu sagen, welche Tat er bereute. Die Ergänzung ist kontextuell naheliegend, aber für eine quellennähere Übersetzung entbehrlich.
  - severity: low
    issue: „führende Priester“ ersetzt den etablierten Terminus für ἀρχιερεῖς.
    rationale: Die Formulierung ist verständlich, doch „Hohepriester“ ist im deutschen Matthäusevangelium die präzisere und konsistente Bezeichnung der genannten Führungsgruppe.
  revised_text: Als Judas, der ihn ausgeliefert hatte, nun sah, dass Jesus verurteilt worden war, empfand er Reue und brachte die dreißig Silberstücke den Hohepriestern und Ältesten zurück.
