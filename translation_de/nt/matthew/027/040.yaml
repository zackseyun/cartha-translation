  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: de
  text: 'und sagten: „Du, der du den Tempel niederreißt und ihn in drei Tagen aufbaust[a], rette dich selbst! Wenn du der Sohn Gottes bist, steig vom Kreuz herab!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wieder aufbaust“. Im Griechischen steht lediglich „baust“; der Zusammenhang kann jedoch einen Wiederaufbau nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Präsenspartizip führt, an den vorausgehenden Erzählzusammenhang angelehnt, die spöttische direkte Rede ein. Im Deutschen ist ein finites Verb hier natürlicher.
- source_word: Ὁ καταλύων
  choice: Du, der du … niederreißt
  rationale: Der substantivierte Partizipialausdruck wird als direkte, spöttische Anrede wiedergegeben; die Formulierung bewahrt den Bezug auf den gegen Jesus erhobenen Vorwurf.
- source_word: καταλύω
  choice: niederreißen
  rationale: Bei einem Bauwerk bezeichnet das Verb anschaulich dessen Zerstörung beziehungsweise Abtragung und passt im Deutschen besonders gut zum Tempel.
- source_word: ναός
  choice: Tempel
  rationale: Obwohl ναός enger das Tempelheiligtum bezeichnen kann, ist „Tempel“ hier die natürliche und allgemein verständliche Wiedergabe.
- source_word: ἐν τρισὶν ἡμέραις
  choice: in drei Tagen
  rationale: Die gebräuchliche deutsche Zeitangabe erhält die knappe Form der verspotteten Aussage.
- source_word: οἰκοδομῶν
  choice: aufbaust
  rationale: Das Verb bedeutet an sich „bauen/aufbauen“. Ein ausdrückliches „wieder“ wäre kontextuell naheliegend, ist aber nicht Bestandteil des griechischen Verbs.
- source_word: σῶσον σεαυτόν
  choice: rette dich selbst
  rationale: Der Aoristimperativ mit Reflexivpronomen wird als unmittelbare spöttische Aufforderung wiedergegeben.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Wenn du der Sohn Gottes bist
  rationale: Die bedingte Herausforderung und der christologische Titel bleiben ohne Abschwächung oder erläuternde Erweiterung erhalten.
- source_word: κατάβηθι
  choice: steig … herab
  rationale: Die Aufforderung zur Abwärtsbewegung von der erhöhten Position am Kreuz wird in würdigem, natürlichem Deutsch ausgedrückt.
- source_word: σταυρός
  choice: Kreuz
  rationale: „Kreuz“ ist im Passionsbericht die sachlich und sprachlich angemessene Standardentsprechung.
theological_decisions:
- issue: Wiedergabe des christologischen Titels υἱὸς τοῦ θεοῦ im Kontext des Spotts
  choice: der Sohn Gottes
  alternative: Gottes Sohn
  rationale: Die traditionelle, transparente Titelform bewahrt die volle christologische Aussage, während der Satz selbst deutlich macht, dass sie hier als spöttische Herausforderung ausgesprochen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „Du, der du …“ erhält die rhetorische Form des griechischen substantivierten Partizips; „herabsteigen“ wahrt den feierlichen Ton des Passionsberichts.
