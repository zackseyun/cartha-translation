  variant: modern standard German
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: de
  text: 'Während er auf dem Richterstuhl saß, ließ ihm seine Frau ausrichten: „Lass dich mit diesem gerechten Mann[a] auf nichts ein; denn ich habe heute im Traum seinetwegen viel gelitten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unschuldigen Mann“. Das griechische Wort kann „gerecht“ oder, besonders im gerichtlichen Zusammenhang, „unschuldig“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Während er ... saß
  rationale: Der Genitivus absolutus mit präsentischem Partizip bezeichnet einen gleichzeitig andauernden Umstand; die deutsche Formulierung ist natürlich und wahrt diese zeitliche Beziehung.
- source_word: ἐπὶ τοῦ βήματος
  choice: auf dem Richterstuhl
  rationale: βῆμα bezeichnet hier im gerichtlichen Zusammenhang den offiziellen Sitz, von dem aus Recht gesprochen wurde; „Richterstuhl“ gibt Funktion und konkretes Bild knapp wieder.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: ließ ihm seine Frau ausrichten
  rationale: Die Wendung setzt eine durch einen Boten übermittelte Mitteilung voraus. „ließ ... ausrichten“ verbindet Absenderin, Empfänger und Botschaft idiomatisch, ohne den Übermittlungsweg unnötig auszumalen.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Lass dich mit diesem gerechten Mann auf nichts ein
  rationale: Die elliptische griechische Redewendung warnt vor jeder Beteiligung an der Sache dieses Mannes. Die deutsche Fassung ist verständlich und bewahrt zugleich die offene Reichweite der Warnung.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: diesem gerechten Mann
  rationale: δίκαιος bedeutet grundsätzlich „gerecht“; im Prozesszusammenhang kann das Wort zugleich die Unschuld des Betroffenen bezeichnen. Der Haupttext erhält die breitere moralische Aussage, die juristische Alternative steht in der Fußnote.
- source_word: πολλὰ ... ἔπαθον
  choice: ich habe ... viel gelitten
  rationale: πολλὰ πάσχω ist eine idiomatische Intensivierung. Das deutsche Perfekt bezeichnet die am selben Tag gemachte Erfahrung mit ihrer fortdauernden Bedeutung für die dringende Warnung.
- source_word: σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: heute im Traum seinetwegen
  rationale: „im Traum“ ist die natürliche Wiedergabe von κατ’ ὄναρ; „seinetwegen“ gibt die durch διά mit Akkusativ bezeichnete Ursache knapp und flüssig wieder.
theological_decisions:
- issue: Bedeutung von δίκαιος als Bezeichnung für Jesus
  choice: gerechter Mann
  alternative: unschuldiger Mann
  rationale: „Gerecht“ wahrt die moralisch und theologisch weiter reichende Bedeutung von δίκαιος bei Matthäus, ohne die im gerichtlichen Kontext naheliegende Aussage der Unschuld auszuschließen. Diese bleibt als echte lexikalische Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Richterstuhl“ hält das antike Amtsbild fest; „ließ ... ausrichten“ und „Lass dich ... auf nichts ein“ vermeiden schwerfällige Wörtlichkeit. Die kausale Folge γάρ ... δι’ αὐτόν wird durch „denn ... seinetwegen“ ohne störende Wiederholung wiedergegeben.
