  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: de
  text: Doch Jesus schrie noch einmal laut auf und gab seinen Geist auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tat seinen letzten Atemzug“. Wörtlich steht im Griechischen: „ließ den Geist los“ – eine Wendung für das Sterben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: δέ führt die Erzählung mit einer leichten Kontrastwirkung fort. „Doch“ gibt den Übergang nach dem zuvor Geschilderten natürlich wieder.
- source_word: πάλιν
  choice: noch einmal
  rationale: πάλιν bezeichnet die Wiederholung. „Noch einmal“ klingt hier im modernen Deutschen natürlicher als das ebenfalls mögliche „wieder“.
- source_word: κράξας φωνῇ μεγάλῃ
  choice: schrie … laut auf
  rationale: Das Partizip κράξας bezeichnet einen kräftigen Schrei; φωνῇ μεγάλῃ betont dessen Lautstärke. Die Wendung „laut aufschreien“ gibt beides knapp und idiomatisch wieder.
- source_word: ἀφῆκεν
  choice: gab … auf
  rationale: ἀφίημι kann unter anderem „loslassen“, „freigeben“ oder „aufgeben“ bedeuten. In Verbindung mit τὸ πνεῦμα bildet „den Geist aufgeben“ eine verständliche deutsche Todeswendung und bleibt zugleich nahe am griechischen Wortlaut.
- source_word: τὸ πνεῦμα
  choice: seinen Geist
  rationale: Das Griechische hat wörtlich „den Geist“. Im Deutschen verlangt die idiomatische Wendung gewöhnlich das Possessivpronomen „seinen“; „Geist“ bewahrt die lexikalische und theologische Bedeutungsweite von πνεῦμα besser als „Atem“.
theological_decisions:
- issue: Wiedergabe der Todeswendung ἀφῆκεν τὸ πνεῦμα
  choice: gab seinen Geist auf
  alternative: tat seinen letzten Atemzug
  rationale: „Gab seinen Geist auf“ bewahrt den ausdrücklichen Bezug auf πνεῦμα und die mögliche Bedeutung „Geist“, ohne mehr über den Vorgang auszusagen als der griechische Text. Die Alternative gibt den Tod eindeutig wieder, verengt πνεῦμα jedoch auf „Atem“.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. „Schrie … laut auf“ vermeidet das im Deutschen schwerfällige „schrie mit lauter Stimme“, während „gab seinen Geist auf“ die feierliche und quellennähere Formulierung erhält.
