  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: de
  text: 'Als sie an einen Ort kamen, der Golgota hieß – das heißt: »Ort eines Schädels«[a] –,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der Ort eines Schädels genannt wird«. Traditionell: »Schädelstätte«. Der griechische Ausdruck erläutert den Namen Golgota und bezeichnet den Ort nochmals als »Ort eines Schädels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Als sie … kamen
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben und wahrt den Erzählfluss.
- source_word: τόπον
  choice: einen Ort
  rationale: Das artikellose τόπον bezeichnet hier allgemein einen Ort; »einen Ort« ist im Deutschen idiomatisch.
- source_word: λεγόμενον
  choice: der … hieß
  rationale: Im Zusammenhang mit einem Ortsnamen gibt »hieß« die idiomatische Bedeutung »genannt« natürlich wieder.
- source_word: Γολγοθᾶ
  choice: Golgota
  rationale: Der Ortsname wird in seiner im Deutschen etablierten transliterierten Form beibehalten.
- source_word: ὅ ἐστιν
  choice: das bedeutet
  rationale: Die Formel erläutert die Bedeutung des semitischen Ortsnamens für die Leser; »das bedeutet« macht diese Funktion deutlich.
- source_word: Κρανίου Τόπος
  choice: Schädelstätte
  rationale: Das deutsche Kompositum gibt die Genitivverbindung knapp, verständlich und in der etablierten biblischen Ausdrucksweise wieder, ohne festzulegen, ob ein bestimmter oder unbestimmter Schädel gemeint ist.
- source_word: λεγόμενος
  choice: in der Bedeutungserklärung nicht nochmals ausdrücklich wiedergegeben
  rationale: Eine wörtliche Wiederholung von »genannt« wäre im Deutschen schwerfällig; die erklärende Formel »das bedeutet« nimmt ihre Funktion auf.
