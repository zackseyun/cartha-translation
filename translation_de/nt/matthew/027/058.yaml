    issue: Unnatürliche demonstrative Wiederaufnahme
    rationale: „Dieser“ kann οὗτος formal abbilden, ist hier im modernen deutschen Erzählstil aber merklich steifer als das natürliche anaphorische „Er“.
  - severity: medium
    issue: „herauszugeben“ ist für die angeordnete Übergabe zu unbestimmt
    rationale: ἀποδοθῆναι bezeichnet hier die autorisierte Aushändigung des Leibes. „jemandem … zu übergeben“ gibt diesen Vorgang im Deutschen klarer wieder und wahrt den kontextuell eindeutigen Empfänger.
  revised_text: Er ging zu Pilatus und bat um den Leib Jesu. Darauf befahl Pilatus, ihm den Leib Jesu zu übergeben.
