source:
  edition: SBLGNT
  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: de
  text: Er ging zu Pilatus und bat um den Leib Jesu. Darauf befahl Pilatus, ihm den Leib Jesu zu übergeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen verweist auf Josef von Arimathäa im vorhergehenden Vers. „Dieser“ bewahrt den demonstrativen Charakter des Griechischen und ist im gehobenen deutschen Erzählstil natürlich.
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: ging zu Pilatus
  rationale: Das vorzeitige Aoristpartizip bezeichnet Josefs Herantreten an Pilatus. „ging zu“ gibt die Bewegung idiomatisch wieder, ohne das steifere „trat an … heran“ zu erzwingen.
- source_word: ᾐτήσατο
  choice: bat um
  rationale: Die mediale Form von αἰτέω bezeichnet hier das Erbitten einer Sache. „bat um“ ist im Deutschen natürlich und passt zum Amtskontext.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: den Leib Jesu
  rationale: σῶμα bedeutet „Körper/Leib“. „Leib“ ist in diesem würdevollen Bestattungskontext geläufig und vermeidet das klinischere „Leichnam“; der Genitiv „Jesu“ ist korrektes, noch gut verständliches Standarddeutsch.
- source_word: τότε
  choice: Darauf
  rationale: τότε markiert die zeitliche Folge. „Darauf“ verbindet die Reaktion des Pilatus natürlich mit Josefs Bitte.
- source_word: ἐκέλευσεν
  choice: befahl
  rationale: κελεύω bezeichnet das Erteilen eines Befehls. „befahl“ ist knapp und entspricht Pilatus’ amtlicher Anordnung.
- source_word: ἀποδοθῆναι
  choice: ihn herauszugeben
  rationale: Der passive Aoristinfinitiv von ἀποδίδωμι bezeichnet hier die autorisierte Übergabe des Leibes. Der deutsche aktive Infinitiv nach „befahl“ ist idiomatisch; „ihn“ greift „den Leib“ auf, ohne einen im Griechischen nicht ausdrücklich genannten Empfänger einzusetzen.
theological_decisions:
- issue: Bezeichnung des toten Körpers Jesu
  choice: Leib
  alternative: Leichnam
  rationale: Der Kontext macht den Tod Jesu eindeutig, doch σῶμα selbst bedeutet „Leib/Körper“ und nicht ausdrücklich „Leichnam“. „Leib“ bewahrt den Wortlaut und die Würde des Zusammenhangs, ohne zusätzliche theologische Deutung.
- issue: Empfänger der angeordneten Übergabe
  choice: Keinen Empfänger ausdrücklich ergänzt
  alternative: „ihn Josef zu übergeben“
  rationale: Aus dem Kontext ist Josef als Empfänger klar, doch der griechische Satz nennt ihn im zweiten Satzteil nicht ausdrücklich. Die Übersetzung wahrt diese knappe Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem biblischem Erzählton. Der Satz bleibt knapp und folgt der griechischen Handlungsabfolge. Keine Fußnote ist nötig, da „herausgeben“ den Bedeutungsbereich von ἀποδίδωμι im Kontext hinreichend wiedergibt.
