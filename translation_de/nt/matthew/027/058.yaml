revisions:
- from: Dieser ging zu Pilatus und bat um den Leib Jesu. Darauf befahl Pilatus, ihn herauszugeben.
  to: Er ging zu Pilatus und bat um den Leib Jesu. Darauf befahl Pilatus, ihm den Leib Jesu zu übergeben.
  rationale: Die Revision modernisiert die anaphorische Bezugnahme und ersetzt das mehrdeutige „herauszugeben“ durch die im Bestattungskontext präzisere Übergabeformulierung. Der wiederholte Ausdruck „den Leib Jesu“ vermeidet ein mögliches Bezugsproblem bei einem Pronomen; „ihm“ macht lediglich den im Kontext klaren Empfänger der Anordnung sichtbar.
