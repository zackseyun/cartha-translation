  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: de
  text: Sie gingen hin und sicherten das Grab, indem sie den Stein mit der Wachmannschaft versiegelten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »… indem sie den Stein versiegelten und eine Wache aufstellten.« Die knappe griechische Wendung kann auch bedeuten, dass die Wachmannschaft beim Versiegeln anwesend oder daran beteiligt war.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Darauf gingen sie hin
  rationale: Das Partizip πορευθέντες begleitet das Hauptverb und lässt sich im Deutschen natürlich als finites Verb wiedergeben. δέ führt die Erzählung weiter; „Darauf“ macht diese Abfolge deutlich, ohne einen starken Gegensatz auszudrücken.
- source_word: ἠσφαλίσαντο
  choice: sicherten
  rationale: ἀσφαλίζω bezeichnet das Sichern beziehungsweise das Treffen von Maßnahmen gegen unbefugten Zugriff. „sicherten“ ist im heutigen Deutsch knapp und kontextgemäß.
- source_word: τὸν τάφον
  choice: das Grab
  rationale: τάφος bezeichnet hier Jesu Begräbnisstätte. „Grab“ ist die gewöhnliche und klare deutsche Entsprechung.
- source_word: σφραγίσαντες
  choice: indem sie … versiegelten
  rationale: Das Aoristpartizip erläutert hier am ehesten die Art und Weise beziehungsweise das Mittel, durch das das Grab gesichert wurde. Die Wiedergabe mit „indem“ ist natürlich und hält den Handlungsbezug deutlich.
- source_word: τὸν λίθον
  choice: den Stein
  rationale: Gemeint ist der vor dem Grabeingang liegende Stein. Der Ausgangstext sagt jedoch nur „den Stein“, weshalb keine zusätzliche Erläuterung in den Haupttext aufgenommen wird.
- source_word: μετὰ τῆς κουστωδίας
  choice: zusammen mit der Wachmannschaft
  rationale: κουστωδία ist ein lateinisches Lehnwort für eine Wachmannschaft; μετά mit Genitiv bezeichnet gewöhnlich Begleitung oder Beteiligung. Die Formulierung bewahrt die knappe Verbindung, ohne festzulegen, ob die Wachmannschaft erst aufgestellt wurde oder bereits anwesend war.
theological_decisions:
- issue: Verhältnis der Wachmannschaft zum Versiegeln und Sichern des Grabes
  choice: 'Die Wachmannschaft wird als begleitend oder beteiligt dargestellt: „zusammen mit der Wachmannschaft“.'
  alternative: „… indem sie den Stein versiegelten und eine Wache aufstellten“ oder „… im Beisein der Wachmannschaft“.
  rationale: Die griechische Wendung μετὰ τῆς κουστωδίας ist knapp und nennt kein eigenes Verb für das Aufstellen der Wache. Der Haupttext wahrt daher die syntaktische Offenheit; die Fußnote nennt die wesentlichen Deutungsmöglichkeiten, ohne einen genaueren Ablauf festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Wachmannschaft“ ist präziser als das mehrdeutige „Wache“ und legt weder eine römische noch eine jüdische Zugehörigkeit fest.
