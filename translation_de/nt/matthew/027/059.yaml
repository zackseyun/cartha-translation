  source_fidelity: 'Der Entwurf gibt alle satzelemente des griechischen Textes zuverlässig wieder: Joseph nimmt den Leichnam und wickelt ihn in ein sauberes Leinentuch. Die koordinierte deutsche Formulierung bildet das vorzeitige Aoristpartizip λαβών idiomatisch ab, ohne die Handlungsfolge zu verändern. „Leichnam“ ist im Bestattungskontext eine angemessene Wiedergabe von σῶμα.'
