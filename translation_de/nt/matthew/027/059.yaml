  terminology: „Josef“ entspricht der üblichen modernen deutschen Namensform. „Leinentuch“ gibt σινδών hinreichend weit wieder; die Fußnote nennt mit „Leichentuch“ zutreffend die im Bestattungskontext mögliche spezifischere Alternative. „Sauberes“ entspricht καθαρά ohne unnötige kultische Aufladung.
