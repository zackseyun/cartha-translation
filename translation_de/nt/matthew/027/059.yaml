  text: καὶ λαβὼν τὸ σῶμα ὁ Ἰωσὴφ ἐνετύλιξεν ⸀αὐτὸ σινδόνι καθαρᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: de
  text: Und Josef nahm den Leichnam und wickelte ihn in ein sauberes Leinentuch[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ein sauberes Leichentuch“. Das griechische Wort bezeichnet ein Leinentuch, hier im Zusammenhang der Bestattung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: nahm
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Die Beiordnung „nahm … und wickelte“ gibt den natürlichen Erzählfluss im Deutschen wieder.
- source_word: σῶμα
  choice: den Leichnam
  rationale: σῶμα bedeutet grundsätzlich „Körper/Leib“; im unmittelbaren Bestattungskontext ist „Leichnam“ die natürliche und eindeutige deutsche Entsprechung, ohne einen Besitzanzeiger hinzuzufügen.
- source_word: ἐνετύλιξεν
  choice: wickelte … in
  rationale: ἐντυλίσσω bezeichnet das Einwickeln oder Einhüllen. „wickelte … in“ ist im Deutschen anschaulich und idiomatisch.
- source_word: αὐτό
  choice: ihn
  rationale: Das griechische Neutrum bezieht sich grammatisch auf σῶμα. Da „Leichnam“ im Deutschen maskulin ist, verlangt die grammatische Kongruenz „ihn“; damit wird keine vom Ausgangstext abweichende personale Deutung eingeführt.
- source_word: σινδόνι
  choice: in ein … Leinentuch
  rationale: σινδών bezeichnet ein Leinentuch, in diesem Zusammenhang ein Bestattungstuch. „Leinentuch“ wahrt den Bedeutungsumfang besser als das spezifischere „Leichentuch“.
- source_word: καθαρᾷ
  choice: sauberes
  rationale: καθαρός bezeichnet hier das Tuch als sauber; „rein“ wäre möglich, könnte jedoch unnötig kultische oder moralische Nebenbedeutungen nahelegen.
- source_word: καὶ … ὁ Ἰωσὴφ
  choice: Und Josef
  rationale: „Und“ bewahrt die schlichte narrative Verknüpfung durch καί; die moderne deutsche Namensform lautet „Josef“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Erzählgang, wird aber als natürliche deutsche Beiordnung formuliert. „Leichnam“ ist kontextgerecht; „Leinentuch“ vermeidet eine unnötige Verengung des griechischen Begriffs.
