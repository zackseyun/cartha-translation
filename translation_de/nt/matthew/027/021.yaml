  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: de
  text: 'Doch der Statthalter fragte sie: »Welchen von den beiden soll ich euch freilassen?« Sie sagten: »Barabbas.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν αὐτοῖς
  choice: Doch … fragte sie
  rationale: Die griechische Antwortformel aus Partizip und finitem Verb wird idiomatisch zusammengezogen. Da der folgende direkte Satz eine Frage ist, gibt »fragte sie« die Sprechhandlung im Deutschen natürlicher wieder als »antwortete ihnen«; »Doch« bewahrt den leichten narrativen Gegensatz von δέ.
- source_word: ὁ ἡγεμών
  choice: der Statthalter
  rationale: Im Kontext bezeichnet ἡγεμών den römischen Provinzstatthalter Pilatus. »Statthalter« ist im Deutschen präzise und im biblisch-historischen Zusammenhang geläufig.
- source_word: Τίνα … ἀπὸ τῶν δύο
  choice: Welchen von den beiden
  rationale: Die Formulierung bezeichnet die Auswahl einer Person aus zwei vorgegebenen Möglichkeiten und entspricht natürlich dem griechischen partitivischen Ausdruck.
- source_word: θέλετε … ἀπολύσω ὑμῖν
  choice: soll ich euch freilassen
  rationale: Nach θέλετε drückt der deliberative Konjunktiv die von der Menge gewünschte Entscheidung aus. Die idiomatische deutsche Frage mit »soll ich« bewahrt diesen Sinn; »euch« gibt den Dativ ὑμῖν wieder.
- source_word: οἱ δὲ εἶπαν
  choice: Sie sagten
  rationale: Das zweite δέ führt schlicht die Antwort der Menge fort. Im Deutschen ist kein zusätzlicher Konnektor nötig; so wird der Gegensatz nicht überbetont.
- source_word: Τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben; Artikel und Akkusativmarkierung müssen nicht eigens abgebildet werden.
theological_decisions: []
