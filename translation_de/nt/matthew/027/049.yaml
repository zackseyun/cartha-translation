id: MAT.27.49
reference: Matthew 27:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: de
  text: 'Die anderen aber sagten: „Lass ihn! Wir wollen sehen, ob Elia kommt, um ihn zu retten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Die anderen aber
  rationale: λοιποί bezeichnet die übrigen Anwesenden im Gegensatz zu der zuvor handelnden Person; „die anderen“ ist im modernen Deutschen natürlicher als „die Übrigen“, während „aber“ den Kontrast von δέ wiedergibt.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der griechische Imperfekt kann andauerndes oder wiederholtes Reden anzeigen; im deutschen Erzählstil gibt „sagten“ die Aussage idiomatisch wieder, ohne den Aspekt unnötig festzulegen.
- source_word: Ἄφες
  choice: Lass ihn!
  rationale: Der Singularimperativ bedeutet wörtlich „lass“ beziehungsweise „lass ab“. Das im Kontext erschlossene Objekt „ihn“ macht deutlich, dass die zuvor handelnde Person Jesus in Ruhe lassen soll.
- source_word: ἴδωμεν
  choice: Wir wollen sehen
  rationale: Der hortative Konjunktiv der ersten Person Plural wird natürlich mit „Wir wollen sehen“ wiedergegeben und bewahrt den auffordernden Sinn.
- source_word: εἰ ἔρχεται
  choice: ob Elia kommt
  rationale: εἰ leitet eine indirekte Frage ein und entspricht daher „ob“. Das Präsens ἔρχεται kann im Deutschen idiomatisch mit „kommt“ wiedergegeben werden und hat in diesem Zusammenhang unmittelbaren Zukunftsbezug.
- source_word: Ἠλίας
  choice: Elia
  rationale: „Elia“ ist die etablierte deutsche Namensform des Propheten.
- source_word: σώσων αὐτόν
  choice: um ihn zu retten
  rationale: Das Futurpartizip drückt hier den Zweck des Kommens aus. „retten“ gibt σῴζω im unmittelbaren Sinn einer Befreiung vom Tod wieder und bewahrt zugleich die weiterreichende Ironie des Passionsberichts.
theological_decisions:
- issue: Mögliche theologische Bedeutungsanklänge von σῴζω im Kreuzigungskontext
  choice: „um ihn zu retten“ im unmittelbaren erzählerischen Sinn körperlicher Befreiung
  alternative: „um ihn zu befreien“
  rationale: Die Sprecher erwarten eine sichtbare Rettung vom Kreuz und formulieren keine ausdrückliche Lehraussage über ewiges Heil. „retten“ bewahrt dennoch die gewöhnliche Bedeutung von σῴζω und die theologische Spannung beziehungsweise Ironie des Zusammenhangs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe direkte Rede erhält die gespannte, spöttisch-abwartende Wirkung der Szene. Keine Fußnote ist nötig, da „die anderen“, „Lass ihn!“ und „ob Elia kommt“ die griechischen Formulierungen natürlich und hinreichend genau wiedergeben.
