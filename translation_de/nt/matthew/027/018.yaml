  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: de
  text: Denn er wusste, dass sie ihn aus Neid ausgeliefert hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Missgunst“ oder „wegen ihrer Eifersucht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: er wusste
  rationale: Das Verb bezeichnet hier Pilates Wissen bzw. seine Einsicht in das Motiv der Ankläger; „wusste“ ist direkt und natürlich.
- source_word: γὰρ
  choice: Denn
  rationale: Die Partikel leitet die Begründung für die vorangehende Aussage ein und wird im Deutschen treffend mit „Denn“ wiedergegeben.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι führt hier den Inhalt dessen ein, was Pilatus wusste, nicht einen weiteren Kausalsatz.
- source_word: διὰ φθόνον
  choice: aus Neid
  rationale: διά mit Akkusativ bezeichnet den Beweggrund; „aus Neid“ gibt die kausale Bedeutung idiomatisch und prägnant wieder.
- source_word: παρέδωκαν
  choice: ausgeliefert hatten
  rationale: Im Passionszusammenhang bezeichnet παραδίδωμι die Übergabe Jesu an die staatliche Gewalt. Das Plusquamperfekt macht im Deutschen deutlich, dass diese Handlung dem Wissen des Pilatus vorauslag.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf Jesus.
theological_decisions:
- issue: Motiv derer, die Jesus auslieferten
  choice: Pilatus erkannte Neid als Beweggrund ihrer Auslieferung Jesu.
  alternative: Pilatus erkannte Eifersucht als Beweggrund.
  rationale: φθόνος bezeichnet hier missgünstigen Neid. Die Übersetzung benennt dieses Motiv, ohne es über die Aussage des Textes hinaus theologisch auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. „Ausgeliefert“ entspricht dem rechtlich-politischen Zusammenhang besser als „verraten“; „aus Neid“ ist natürlicher als „wegen Neid“.
