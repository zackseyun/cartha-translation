base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: de
  text: Am nächsten Tag, der auf den Vorbereitungstag[a] folgte, versammelten sich die Hohenpriester und die Pharisäer vor Pilatus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „nach der Vorbereitung“. Das griechische Wort kann den Vorbereitungstag vor dem Sabbat bezeichnen; die Übersetzung „Freitag“ wäre deutender, als es der Ausgangstext verlangt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Die Wendung bezeichnet den folgenden Tag und führt die Erzählung zeitlich weiter. Das schwach verbindende δέ wird im Deutschen nicht eigens mit „nun“ wiedergegeben.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: also am Tag nach dem Vorbereitungstag
  rationale: ἥτις leitet hier eine erläuternde Bestimmung ein. „Also“ gibt diese Funktion natürlich wieder; die Formulierung hält zugleich die zeitliche Beziehung ausdrücklich fest.
- source_word: παρασκευήν
  choice: Vorbereitungstag
  rationale: Der Ausdruck bezeichnet in diesem jüdischen Zusammenhang den Tag der Vorbereitung auf den Sabbat. „Vorbereitungstag“ ist verständlich und bleibt näher am griechischen Ausdruck als das stärker deutende „Freitag“.
- source_word: συνήχθησαν
  choice: versammelten sich
  rationale: Die passive Form wird hier intransitiv gebraucht und bezeichnet das Zusammenkommen der genannten Gruppen.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der priesterlichen Führungsschicht, nicht mehrere gleichzeitig amtierende Hohepriester. Die Wiedergabe vermeidet dieses mögliche Missverständnis.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Gebräuchliche deutsche Bezeichnung der jüdischen Gruppierung.
- source_word: πρὸς Πιλᾶτον
  choice: bei Pilatus
  rationale: πρός mit einer Person nach einem Verb des Zusammenkommens kann das Zusammentreten bei beziehungsweise vor dieser Person bezeichnen. „Bei Pilatus“ ist im Deutschen natürlich und wahrt den politischen Kontext.
- source_word: Πιλᾶτον
  choice: Pilatus
  rationale: Die im Deutschen etablierte Namensform.
