id: MAT.27.54
reference: Matthew 27:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: de
  text: 'Als aber der Hauptmann und die Männer bei ihm, die Jesus bewachten, das Erdbeben und das, was geschehen war, sahen, bekamen sie große Angst und sagten: »Dieser war wirklich Gottes Sohn[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dieser war wirklich ein Sohn Gottes.« Im Griechischen steht θεοῦ υἱός ohne Artikel; im Zusammenhang des Matthäusevangeliums ist die Wiedergabe als Titel »Gottes Sohn« naheliegend.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: Hauptmann
  rationale: Die geläufige deutsche Bezeichnung gibt den römischen Offizier in diesem erzählerischen Zusammenhang verständlich wieder; „Zenturio“ wäre präziser, aber für viele Leser weniger unmittelbar verständlich.
- source_word: τηροῦντες
  choice: die Jesus bewachten
  rationale: Im Zusammenhang mit der Hinrichtung bezeichnet τηρέω das Bewachen beziehungsweise Wachehalten, nicht bloßes Beobachten.
- source_word: ἰδόντες
  choice: als … sahen
  rationale: Das Aoristpartizip wird seinem zeitlichen Verhältnis zum Hauptverb entsprechend als natürlicher deutscher Temporalsatz wiedergegeben.
- source_word: σεισμόν
  choice: Erdbeben
  rationale: Dies ist die gewöhnliche und im Kontext eindeutige Bedeutung von σεισμός.
- source_word: τὰ γενόμενα
  choice: das, was geschehen war
  rationale: Die substantivierte Partizipialform verweist umfassend auf die eingetretenen Geschehnisse und nicht nur auf das Erdbeben.
- source_word: ἐφοβήθησαν σφόδρα
  choice: bekamen sie große Angst
  rationale: Die Formulierung gibt sowohl das Eintreten der Furcht als auch die starke Intensivierung durch σφόδρα in natürlichem Gegenwartsdeutsch wieder.
- source_word: Ἀληθῶς
  choice: wirklich
  rationale: „Wirklich“ bewahrt die bekräftigende Kraft des Adverbs, ohne den theologischen Erkenntnisstand der Sprecher über die Aussage hinaus festzulegen.
- source_word: θεοῦ υἱὸς
  choice: Gottes Sohn
  rationale: Obwohl die griechische Prädikatsbezeichnung keinen Artikel trägt, legt der matthäische Kontext eine qualitative beziehungsweise bestimmte, titelartige Aussage nahe. Die deutsche Formulierung ist natürlich und lässt die Alternative „ein Sohn Gottes“ in einer Fußnote transparent werden.
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen wird direkt wiedergegeben und behält den Nachdruck der Äußerung bei.
theological_decisions:
- issue: Wiedergabe von θεοῦ υἱὸς im Bekenntnis des Hauptmanns und seiner Begleiter
  choice: Gottes Sohn
  alternative: ein Sohn Gottes
  rationale: Die artikellose griechische Prädikatskonstruktion erzwingt keine unbestimmte Wiedergabe. Im Matthäusevangelium ist „Sohn Gottes“ eine inhaltlich gewichtige Bezeichnung für Jesus; deshalb steht die titelartige Lesart im Haupttext. Die formal mögliche unbestimmte Deutung wird jedoch nicht verschwiegen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem zeitlichen Aufbau des griechischen Textes, vermeidet jedoch unnatürliche Partizipialkonstruktionen. „Die Männer bei ihm“ macht die Gruppe verständlich, ohne ihre Aussage auf den Hauptmann allein zu beschränken.
