  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: de
  text: Dann werden zusammen mit ihm zwei Räuber[a] gekreuzigt, einer rechts und einer links.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Banditen“. Das griechische Wort kann gewalttätige Räuber bezeichnen und sich in manchen Zusammenhängen auch mit aufständischer Tätigkeit überschneiden.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Das temporale Adverb führt das nächste Geschehen in der Erzählfolge ein; „Dann“ ist knapp und natürlich.
- source_word: σταυροῦνται
  choice: werden … gekreuzigt
  rationale: Das historische Präsens im Passiv wird im Deutschen idiomatisch als erzählendes Präsens wiedergegeben und bewahrt die Vorgangsperspektive.
- source_word: σὺν αὐτῷ
  choice: zusammen mit ihm
  rationale: σύν mit Dativ bezeichnet Begleitung beziehungsweise gemeinsames Geschehen; „zusammen mit ihm“ macht diese Verbindung klar.
- source_word: δύο λῃσταί
  choice: zwei Räuber
  rationale: λῃστής bezeichnet gewöhnlich einen Räuber oder gewalttätigen Banditen. „Räuber“ ist die klare, nicht unnötig spezifizierende Standardwiedergabe; die mögliche politische Konnotation wird nicht in den Haupttext eingetragen.
- source_word: εἷς ἐκ δεξιῶν
  choice: einer rechts
  rationale: Die idiomatische räumliche Wendung bezeichnet die Position auf der rechten Seite; die knappe deutsche Form ist natürlich.
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: und einer links
  rationale: Die Wendung bezeichnet im Gegensatz zur rechten die linke Seite und wird idiomatisch knapp wiedergegeben.
theological_decisions:
- issue: Identität der λῃσταί
  choice: „Räuber“ ohne nähere politische Bestimmung
  alternative: „Banditen“ oder „Aufständische“
  rationale: Der griechische Ausdruck kann gewalttätige Räuber oder Banditen bezeichnen und sich in manchen Zusammenhängen mit aufständischer Tätigkeit überschneiden. Der Vers selbst verlangt jedoch keine engere politische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das erzählende Präsens des griechischen Textes bleibt erhalten; die Stellung von „zusammen mit ihm“ folgt natürlichem deutschem Satzbau.
