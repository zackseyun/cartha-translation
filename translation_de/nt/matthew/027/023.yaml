source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: de
  text: 'Er aber sagte: „Was hat er denn Böses getan?“[a] Sie aber schrien umso heftiger: „Er soll gekreuzigt werden!“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „Warum? Was hat er denn Unrechtes getan?“'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: „Kreuzige ihn!“ Das Griechische hat einen passiven Imperativ, wörtlicher: „Er soll gekreuzigt werden.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Er aber sagte
  rationale: Das wiederholte δέ stellt Pilatus und die Menge einander gegenüber; ἔφη dient hier als schlichte Erzähleinleitung für direkte Rede.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Was hat er denn Böses getan?
  rationale: Das deutsche Modalwort „denn“ gibt γάρ in dieser herausfordernden Frage natürlich wieder; „Böses“ bewahrt die moralische Aussage von κακόν.
- source_word: περισσῶς ἔκραζον
  choice: schrien umso heftiger
  rationale: „Umso heftiger“ bezeichnet die gesteigerte Intensität, ohne sie ausschließlich auf die Lautstärke festzulegen. Das Imperfekt beschreibt den anhaltenden Ruf im Erzählverlauf.
- source_word: λέγοντες
  choice: durch die folgende direkte Rede wiedergegeben
  rationale: Ein zusätzliches „und sagten“ wäre nach „schrien“ im Deutschen schwerfällig; die direkte Rede macht den Inhalt des Rufens ausdrücklich.
- source_word: Σταυρωθήτω
  choice: Er soll gekreuzigt werden!
  rationale: Die deutsche Soll-Konstruktion gibt den Imperativ der dritten Person idiomatisch wieder und erhält zugleich das Passiv des griechischen Verbs.
theological_decisions:
- issue: Wiedergabe der Forderung nach der Kreuzigung
  choice: Er soll gekreuzigt werden!
  alternative: Kreuzige ihn!
  rationale: Die gewählte Form bewahrt den passiven Imperativ des griechischen Textes und benennt keinen zusätzlichen Handlungsträger.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Stellung „aber“ wahrt den Kontrast des griechischen δέ; „umso heftiger“ lässt offen, ob vor allem Lautstärke, Nachdruck oder beides zunimmt.
