source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: de
  text: 'Gegen die neunte Stunde rief Jesus mit lauter Stimme: »Eli, Eli, lema sabachthani?«[a], das heißt: »Mein Gott, mein Gott, warum hast du mich verlassen?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Wortlaut greift Psalm 22,2 auf (in anderer Verszählung Psalm 22,1).
    reason: cross_reference
  - marker: b
    text: 'Auch möglich: »Warum verließest du mich?« Das griechische Verb steht im Aorist; das deutsche Perfekt gibt den unmittelbaren Klageruf natürlicher wieder und bewahrt den vertrauten Psalmklang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Etwa um die neunte Stunde
  rationale: περί mit Akkusativ bezeichnet hier einen ungefähren Zeitpunkt. Das leicht verbindende δέ muss im Deutschen nicht eigens wiedergegeben werden; so bleibt der Satz natürlich, ohne einen stärkeren Gegensatz einzutragen.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: schrie ... mit lauter Stimme
  rationale: Das Verb bezeichnet einen lauten Ruf oder Schrei; die konkrete Wendung φωνῇ μεγάλῃ wird bewahrt und unterstreicht die hörbare Intensität.
- source_word: λέγων
  choice: und sagte
  rationale: Das Partizip führt den Inhalt des Schreis ein. Die finite deutsche Verbindung gibt die griechische Funktion natürlich wieder.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Eli, Eli, lema sabachthani?
  rationale: Matthäus überliefert zunächst den semitischen Wortlaut und übersetzt ihn anschließend. Die Transliteration bleibt deshalb im Haupttext erhalten.
- source_word: τοῦτ’ ἔστιν
  choice: Das heißt
  rationale: Die Formel leitet die unmittelbar folgende Übersetzung beziehungsweise Erklärung ein.
- source_word: Θεέ μου θεέ μου
  choice: Mein Gott, mein Gott
  rationale: Die wiederholte direkte Anrede wird unverändert bewahrt und lässt zugleich den Anklang an Psalm 22,2 erkennen.
- source_word: ἱνατί με ἐγκατέλιπες
  choice: warum hast du mich verlassen?
  rationale: ἱνατί bedeutet „warum“. Das Perfekt ist im heutigen Deutsch die natürliche Form für den griechischen Aorist in diesem unmittelbaren Klageruf und wahrt den vertrauten Psalmklang; „verlassen“ entspricht dem feierlichen und zugleich eindringlichen Ton.
theological_decisions:
- issue: Verhältnis des Schreis Jesu zu Psalm 22
  choice: Die Worte werden als wirklicher Klageruf wiedergegeben, während der Psalmanklang erhalten bleibt und nicht theologisch aufgelöst wird.
  alternative: Den Satz vor allem als bloßes Zitatssignal wiedergeben oder die Aussage des Verlassenseins abschwächen.
  rationale: Der griechische Text gibt den Schrei ohne erklärende Einschränkung wieder. Die Übersetzung soll weder seine Erfahrungswirklichkeit abschwächen noch eine bestimmte dogmatische Erklärung in den Wortlaut eintragen.
- issue: Beibehaltung des semitischen Schreis
  choice: Der transliterierte semitische Wortlaut steht im Haupttext, gefolgt von seiner Übersetzung.
  alternative: Nur die deutsche Bedeutung wiedergeben.
  rationale: Diese doppelte Darbietung entspricht der Erzählweise des Matthäus und bewahrt den Zusammenhang mit dem anschließenden Missverständnis der Umstehenden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, zurückhaltend feierlichem Ton. Die semitischen Worte bleiben nach der griechischen Überlieferung transliteriert; die deutsche Erklärung ist unmittelbar und ohne konfessionelle Deutung formuliert.
