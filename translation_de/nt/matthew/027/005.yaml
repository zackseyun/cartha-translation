id: MAT.27.5
reference: Matthew 27:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: de
  text: Er warf die Silberstücke in den Tempel[a], zog sich zurück und ging fort; dann erhängte er sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Tempelheiligtum“. Das griechische Wort bezeichnet häufig speziell das Heiligtum und nicht die gesamte Tempelanlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: warf
  rationale: Das vorzeitige Aoristpartizip wird im Deutschen natürlich als erstes Verb einer Handlungsfolge wiedergegeben; die zeitliche Abfolge bleibt durch die Satzstellung klar.
- source_word: τὰ ἀργύρια
  choice: die Silberstücke
  rationale: Der Ausdruck bezeichnet hier die zuvor genannten Silbermünzen. „Silberstücke“ bewahrt den Bezug zum Silber, klingt aber im Deutschen eindeutiger als das bloße „Silber“.
- source_word: εἰς τὸν ναὸν
  choice: in den Tempel[a]
  rationale: ναός kann speziell das Tempelheiligtum bezeichnen. Die gut verständliche Haupttextfassung „Tempel“ wird deshalb durch eine präzisierende Fußnote ergänzt.
- source_word: ἀνεχώρησεν
  choice: zog sich zurück
  rationale: Die Wiedergabe erfasst neben dem Weggehen auch den möglichen Beiklang des Sich-Zurückziehens und unterscheidet das Verb von dem folgenden ἀπελθών.
- source_word: ἀπελθὼν
  choice: ging fort
  rationale: Die eigenständige Bewegungsaussage bleibt erhalten, ohne sie mit dem vorangehenden ἀνεχώρησεν zusammenzuziehen.
- source_word: ἀπήγξατο
  choice: erhängte er sich
  rationale: Das Medium bezeichnet eine gegen sich selbst gerichtete Handlung; im Kontext ist Selbsttötung durch Erhängen die klare und übliche Bedeutung.
theological_decisions:
- issue: Spezifische Bedeutung von ναός gegenüber der allgemeinen Bezeichnung des Tempelbereichs
  choice: Im Haupttext „Tempel“, mit „Tempelheiligtum“ als Fußnotenalternative
  alternative: Tempelheiligtum
  rationale: So bleibt der Text allgemein verständlich, während die mögliche architektonische Präzision des griechischen Ausdrucks ausdrücklich erhalten wird.
translation_notes:
  register: Moderner, würdiger Erzählstil. Die zwei griechischen Ausdrücke des Weggehens werden bewusst getrennt wiedergegeben; das Semikolon gliedert die Bewegungsfolge und die anschließende Selbsttötung.
