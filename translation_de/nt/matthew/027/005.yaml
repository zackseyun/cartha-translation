  terminology: „Silberstücke“ ist im unmittelbaren Kontext sachgerecht. „Tempel“ als Haupttextwiedergabe von ναός ist gut lesbar; die Fußnote dokumentiert zutreffend die mögliche engere Bedeutung „Tempelheiligtum“. „Erhängte er sich“ gibt ἀπήγξατο idiomatisch und präzise wieder.
