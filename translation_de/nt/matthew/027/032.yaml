  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: de
  text: Als sie nun hinausgingen, trafen sie einen Mann aus Kyrene namens Simon. Diesen zwangen sie[a], sein Kreuz[b] zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb bezeichnet hier einen von einer Obrigkeit erzwungenen Dienst; auch: „verpflichteten ihn zum Dienst“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Jesu Kreuz.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: Als sie nun hinausgingen
  rationale: Das Präsenspartizip wird als gleichzeitige temporale Handlung wiedergegeben. „Nun“ nimmt die milde, fortführende Erzählfunktion von δέ auf, ohne einen unpassenden Gegensatz auszudrücken.
- source_word: εὗρον
  choice: trafen sie
  rationale: „Treffen“ gibt das Auffinden bzw. Antreffen in dieser erzählerischen Situation natürlich wieder.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: einen Mann aus Kyrene
  rationale: Die Formulierung bezeichnet Simons geografische Herkunft und ist im modernen Deutschen klar und idiomatisch.
- source_word: ὀνόματι Σίμωνα
  choice: namens Simon
  rationale: Dies ist die natürliche deutsche Entsprechung der festen griechischen Wendung mit ὀνόματι.
- source_word: τοῦτον
  choice: Diesen
  rationale: Das ausdrückliche Demonstrativpronomen des griechischen Textes bleibt erhalten und hebt den soeben genannten Mann als den Betroffenen hervor.
- source_word: ἠγγάρευσαν
  choice: zwangen
  rationale: Das Verb bezeichnet einen durch Autorität auferlegten Zwangsdienst. „Zwangen“ gibt den nötigen Zwang knapp und verständlich wieder; die besondere Bedeutung wird in der Fußnote erläutert.
- source_word: ἵνα ἄρῃ
  choice: zu tragen
  rationale: Der Infinitiv gibt den mit ἵνα und Konjunktiv ausgedrückten Zweck im Deutschen natürlich wieder. Im Kontext bedeutet αἴρω, das Kreuz aufzunehmen und zu tragen.
- source_word: τὸν σταυρὸν
  choice: das Kreuz
  rationale: „Kreuz“ ist die sachlich und sprachlich angemessene Entsprechung; der griechische Ausdruck legt hier nicht spezifisch „Querbalken“ fest.
- source_word: αὐτοῦ
  choice: sein
  rationale: Das Possessivpronomen bewahrt die Form des Ausgangstextes. Der Erzählzusammenhang weist Jesus als Bezugsgröße aus, auch wenn „sein“ isoliert kurzzeitig auf Simon bezogen werden könnte.
theological_decisions:
- issue: Bezugswort von αὐτοῦ („sein“)
  choice: Das Pronomen bleibt als „sein“ stehen und bezieht sich im Kontext auf Jesus.
  alternative: „Jesu Kreuz“ könnte den Bezug ausdrücklich machen.
  rationale: Der Kontext macht deutlich, dass Simon das Kreuz des Verurteilten, also Jesu Kreuz, tragen soll. Die Übersetzung löst das griechische Pronomen nicht unnötig durch einen Namen auf und dokumentiert die mögliche kurzfristige grammatische Mehrdeutigkeit in einer Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Diesen“ bewahrt die Hervorhebung des griechischen Demonstrativpronomens; „zwangen“ hält den Zwangscharakter klar fest.
