  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: de
  text: Nachdem sie ihn gekreuzigt hatten, verteilten sie seine Kleider, indem sie das Los warfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: Nachdem sie ihn gekreuzigt hatten
  rationale: Das vorzeitige Aoristpartizip bezeichnet eine Handlung, die der Verteilung der Kleider vorausgeht. Der temporale Nebensatz gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches, die Erzählung fortführendes Bindewort. Die Satzfolge stellt den Anschluss im Deutschen bereits natürlich her; ein zusätzliches „und“ wäre möglich, aber nicht nötig.
- source_word: διεμερίσαντο
  choice: verteilten
  rationale: Das Verb bezeichnet hier das Aufteilen beziehungsweise Verteilen der Kleidungsstücke unter mehreren Personen. „Verteilten“ ist im Deutschen idiomatisch und lässt den konkreten Vorgang erkennen.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: seine Kleider
  rationale: ἱμάτια bezeichnet allgemein Kleidungsstücke. „Kleider“ ist verständlich, würdevoll und vermeidet die nicht zwingend im Ausdruck enthaltene Präzisierung „Obergewänder“.
- source_word: βάλλοντες κλῆρον
  choice: indem sie das Los warfen
  rationale: Die Wendung bezeichnet das Werfen eines Loses und erklärt das Vorgehen bei der Verteilung. Der Singular κλῆρον wird mit dem im Deutschen natürlichen Singular „das Los“ bewahrt.
theological_decisions:
- issue: Verhältnis von βάλλοντες κλῆρον zu διεμερίσαντο
  choice: „indem sie das Los warfen“ beschreibt das Verfahren, mit dem die Kleider verteilt wurden.
  alternative: „und warfen dabei das Los“ oder „durch das Los“
  rationale: Das Partizip ist sachlich auf das Hauptverb bezogen und erläutert die Art und Weise der Verteilung. „Indem“ macht diese Beziehung deutlich, ohne über den griechischen Text hinauszugehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur wahrt die zeitliche Abfolge und gibt die Mittelbeziehung des abschließenden Partizips klar wieder.
