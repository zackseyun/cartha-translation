id: MAT.27.37
reference: Matthew 27:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: de
  text: 'Und sie brachten über seinem Kopf die gegen ihn erhobene Anklage[a] an. Darauf stand: »Das ist Jesus, der König der Juden[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den gegen ihn vorgebrachten Anklagegrund«. Das griechische Wort hat hier einen gerichtlichen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Judäer«. Das griechische Wort kann je nach Zusammenhang sowohl »Juden« als auch »Judäer« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: sie brachten … an
  rationale: Das Verb bezeichnet hier das Anbringen bzw. Platzieren der geschriebenen Anklage; »brachten … an« klingt im Deutschen bei einer Tafel oder Aufschrift natürlich.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: über seinem Kopf
  rationale: ἐπάνω mit Genitiv bezeichnet die Position oberhalb von Jesu Kopf; die deutsche Formulierung gibt diese räumliche Beziehung klar wieder.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: die gegen ihn erhobene Anklage
  rationale: αἰτία hat hier im Zusammenhang der Hinrichtung einen gerichtlichen Sinn. Die Formulierung macht deutlich, dass es um den gegen Jesus vorgebrachten Anklagegrund geht.
- source_word: γεγραμμένην
  choice: Darauf stand
  rationale: Das perfekte Passivpartizip beschreibt den schriftlich festgehaltenen Wortlaut. Die Aufteilung in zwei deutsche Sätze gibt den Sinn idiomatisch und verständlich wieder.
- source_word: Οὗτός ἐστιν Ἰησοῦς
  choice: Das ist Jesus
  rationale: Die direkte Aussage der Aufschrift wird schlicht und eng am griechischen Wortlaut wiedergegeben.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: der König der Juden
  rationale: Die traditionelle und kontextuell passende Wiedergabe bewahrt den königlich-politischen Titel der Hinrichtungsaufschrift.
theological_decisions:
- issue: Gerichtlicher Sinn von αἰτία
  choice: die gegen ihn erhobene Anklage
  alternative: der gegen ihn vorgebrachte Anklagegrund
  rationale: »Anklage« bewahrt den juristischen Charakter, ohne zusätzliche rechtliche Einzelheiten oder eine theologische Deutung einzutragen.
- issue: Bedeutungsumfang von Ἰουδαίων
  choice: der Juden
  alternative: der Judäer
  rationale: In der königlichen Titulatur der Passionsgeschichte ist »Juden« die etablierte und kontextuell naheliegende Wiedergabe; die geografisch-politische Möglichkeit »Judäer« bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Partizipialkonstruktion, ohne Inhalt oder Abfolge des griechischen Textes zu verändern.
