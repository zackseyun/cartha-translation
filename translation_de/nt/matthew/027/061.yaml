  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: de
  text: Maria Magdalena und die andere Maria waren dort und saßen dem Grab gegenüber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: waren dort
  rationale: Das griechische Verb steht formal im Singular, doch die nachgestellten, miteinander verbundenen Subjekte bezeichnen zwei Frauen. Im Deutschen gibt der Plural den Sinn der Konstruktion natürlich wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier lediglich einen schwachen narrativen Anschluss. Der Übergang ergibt sich im Deutschen bereits aus dem Satz- und Erzählzusammenhang; ein zusätzliches „aber“ würde einen zu starken Gegensatz nahelegen.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Dies ist die etablierte und natürliche deutsche Namensform.
- source_word: ἡ ἄλλη Μαρία
  choice: die andere Maria
  rationale: Die Formulierung unterscheidet diese Frau unmittelbar von Maria Magdalena, ohne sie näher zu bestimmen.
- source_word: καθήμεναι
  choice: saßen
  rationale: Das Partizip beschreibt die gleichzeitige, andauernde Körperhaltung der beiden Frauen; die finite Verbindung mit „und“ klingt im modernen Deutsch natürlich.
- source_word: ἀπέναντι τοῦ τάφου
  choice: dem Grab gegenüber
  rationale: 'Die Wendung bewahrt die räumliche Bedeutung: Die Frauen befanden sich auf der gegenüberliegenden Seite beziehungsweise mit Blick auf das Grab. „Grab“ ist in diesem Bestattungskontext die übliche moderne Bezeichnung.'
