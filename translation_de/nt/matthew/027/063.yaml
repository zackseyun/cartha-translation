  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: de
  text: 'und sagten: „Herr, wir erinnern uns, dass jener Betrüger, als er noch lebte, sagte: ‚Nach drei Tagen werde ich auferweckt.‘“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb steht im Präsens und kann mittel oder passiv verstanden werden; im zukünftigen Zusammenhang auch: „Nach drei Tagen stehe ich auf“ oder „Nach drei Tagen werde ich auferweckt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip knüpft an den vorherigen Vers an. Im Deutschen gibt eine finite Fortführung mit „und sagten“ diesen Zusammenhang natürlicher wieder als „sagend“.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ ist hier eine respektvolle Anrede an Pilatus; „Herr“ wahrt die griechische Wortwahl, ohne in diesem Kontext Göttlichkeit auszudrücken.
- source_word: ἐμνήσθημεν
  choice: wir haben uns daran erinnert
  rationale: Das Aoristverb bezeichnet das Erinnern bzw. Sich-ins-Gedächtnis-Rufen. Das deutsche Perfekt bewahrt den Vergangenheitsaspekt und zugleich die gegenwärtige Relevanz.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: jener Betrüger
  rationale: „Jener“ erhält die distanzierende, abwertende Wirkung des Demonstrativums; „Betrüger“ gibt die feindselige Bezeichnung πλάνος verständlich wieder.
- source_word: ἔτι ζῶν
  choice: als er noch lebte
  rationale: Die temporale Partizipialkonstruktion wird in natürlichem Deutsch als Nebensatz wiedergegeben.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Nach drei Tagen
  rationale: μετά mit Akkusativ bedeutet hier „nach“. Die Formulierung wird nicht mit „am dritten Tag“ harmonisiert.
- source_word: ἐγείρομαι
  choice: werde ich auferweckt
  rationale: Die Form ist präsentisch und morphologisch mittel/passiv. Im deutschen Kontext einer Zukunftsvoraussage ist „werde ich auferweckt“ idiomatisch und bewahrt die passive Lesart; die formnähere Präsenswiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe der zitierten Auferstehungsvoraussage Jesu
  choice: Nach drei Tagen werde ich auferweckt
  alternative: 'Nach drei Tagen stehe ich auf; Nach drei Tagen werde ich auferweckt (als formnahes Präsens: „werde ich auferweckt“ kann im Deutschen zugleich präsentisch-passiv verstanden werden)'
  rationale: Der griechische Präsensform ἐγείρομαι steht in einem eindeutig zukünftigen Zeitbezug und kann mittel oder passiv verstanden werden. Der Haupttext bewahrt die passive Möglichkeit und klingt zugleich natürlich; die Fußnote hält die formale und semantische Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die abwertende Redeweise der Sprecher bleibt mit „jener Betrüger“ erhalten. Die griechische Partizipialverknüpfung wird zur natürlichen deutschen Satzfortführung umgeformt.
