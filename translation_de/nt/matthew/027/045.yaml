  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: de
  text: Von der sechsten Stunde an kam Finsternis über das ganze Land bis zur neunten Stunde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die sechste Stunde entspricht ungefähr zwölf Uhr mittags, die neunte Stunde ungefähr drei Uhr nachmittags.
    reason: cultural_note
  - marker: b
    text: 'Oder: „über die ganze Erde“. Das griechische Wort kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: Von ... an
  rationale: ἀπό bezeichnet den zeitlichen Ausgangspunkt; δέ ist hier ein schwaches Bindewort, das im natürlichen Deutschen nicht eigens wiedergegeben werden muss.
- source_word: ἕκτης ὥρας
  choice: der sechsten Stunde
  rationale: Die antike Zeitangabe bleibt im Haupttext erhalten; ihre ungefähre heutige Entsprechung wird in einer Fußnote erklärt.
- source_word: σκότος
  choice: Finsternis
  rationale: Das Wort bezeichnet hier Dunkelheit. „Finsternis“ ist im Deutschen prägnant und dem würdevollen Erzählton angemessen.
- source_word: ἐγένετο
  choice: kam
  rationale: γίνομαι bezeichnet hier den Eintritt eines Zustands; „kam über“ gibt diesen Beginn natürlich wieder.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: über das ganze Land
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. „Land“ ist im unmittelbaren Erzählzusammenhang die zurückhaltendere Wiedergabe; die mögliche Bedeutung „Erde“ bleibt in einer Fußnote erhalten.
- source_word: ἕως ὥρας ἐνάτης
  choice: bis zur neunten Stunde
  rationale: Die Zeitangabe des Ausgangstextes bleibt erhalten; die ungefähre moderne Uhrzeit wird in der Fußnote genannt.
theological_decisions:
- issue: Reichweite von γῆ bei der Finsternis
  choice: Land
  alternative: Erde
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, ob das örtlich begrenzte Land oder die ganze Erde gemeint ist. Der Haupttext verwendet die kontextuell zurückhaltende Lesart, während die kosmische Reichweite als echte Alternative dokumentiert wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in einem knappen, würdevollen Erzählstil. Die antiken Stundenangaben und die Mehrdeutigkeit von γῆ werden bewahrt.
