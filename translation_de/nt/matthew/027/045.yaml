  naturalness: „Von der sechsten Stunde an“ sowie die antiken Stundenangaben sind verständlich und dem knappen erzählerischen Register angemessen. Die Stellung „kam über das ganze Land Finsternis“ ist zwar möglich, wirkt im modernen Standarddeutsch jedoch merklich poetisch-invertiert. „kam Finsternis über das ganze Land“ ist gleichermaßen prägnant, aber natürlicher.
