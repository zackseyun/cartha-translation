id: MAT.27.2
reference: Matthew 27:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: de
  text: Und nachdem sie ihn gefesselt hatten, führten sie ihn ab und übergaben ihn dem Statthalter Pilatus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δήσαντες
  choice: nachdem sie ihn gefesselt hatten
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die den finiten Verben vorausgeht. Der Nebensatz gibt diese zeitliche Abfolge in natürlichem Deutsch wieder; „fesseln“ bewahrt den konkreten Sinn von δέω.
- source_word: ἀπήγαγον
  choice: führten sie ihn ab
  rationale: ἀπάγω bezeichnet das Wegführen einer Person. „Abführen“ passt zum Gewahrsams- und Gerichtscontext und bleibt näher am körperlichen Geleiten als das allgemeinere „wegbringen“.
- source_word: παρέδωκαν
  choice: übergaben ihn
  rationale: παραδίδωμι bezeichnet hier die Übergabe in die Gewalt beziehungsweise Zuständigkeit eines anderen. „Übergeben“ ist gegenwärtig, klar und wahrt sowohl den juristischen Vorgang als auch die weitergehende Resonanz des Verbs, ohne sie auszudeuten.
- source_word: Πιλάτῳ
  choice: Pilatus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: ἡγεμόνι
  choice: Statthalter
  rationale: ἡγεμών bezeichnet einen leitenden Regierungsbeamten. „Statthalter“ ist im biblisch-historischen Zusammenhang verständlich und gibt den breiten griechischen Amtstitel wieder, ohne ihn zum historisch spezifischeren „Präfekten“ zu verengen.
- source_word: καὶ … καὶ
  choice: Und … und
  rationale: Das erste καί erhält den fortlaufenden Erzählanschluss; das zweite verbindet die beiden Haupthandlungen koordinierend.
theological_decisions:
- issue: Wiedergabe von παραδίδωμι in der Passionsgeschichte
  choice: übergaben ihn
  alternative: lieferten ihn aus
  rationale: „Übergeben“ stellt den unmittelbaren Vorgang der Überstellung an Pilatus heraus und lässt zugleich die theologische Resonanz des wiederkehrenden Verbs offen. „Ausliefern“ wäre ebenfalls möglich, legt jedoch stärker den Akzent auf Preisgabe oder feindliche Überstellung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der vorzeitige Nebensatz bildet die griechische Partizipialkonstruktion verständlich ab; die Satzfolge bleibt knapp und erzählerisch.
