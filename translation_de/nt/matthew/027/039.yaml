  verdict: approve
  source_fidelity: Die Übersetzung gibt οἱ δὲ παραπορευόμενοι idiomatisch als „Die Vorübergehenden aber“ wieder. Das Imperfekt ἐβλασφήμουν wird angemessen durch „lästerten“ ausgedrückt; die begleitende, gleichzeitig stattfindende Geste von κινοῦντες τὰς κεφαλὰς αὐτῶν ist mit „und schüttelten dabei den Kopf“ sachlich und aspektuell treffend wiedergegeben.
  naturalness: Modernes, würdiges Standarddeutsch. Der distributive Singular in „den Kopf schütteln“ ist bei mehreren Handelnden idiomatisch. „Dabei“ macht die Gleichzeitigkeit der Partizipialhandlung klar, ohne den Satz unnötig schwer zu machen.
  terminology: „Lästerten“ erhält die kräftige Wortwahl von βλασφημέω, ohne den Bedeutungsumfang unzulässig auf Gotteslästerung im engen Sinn zu verengen. Die Fußnote nennt mit „schmähten“ eine passende lexikalische Alternative. Die Angabe Psalm 22,8 entspricht der üblichen deutschen Psalmverszählung und ist gegenüber der englischen Zählung Psalm 22:7 korrekt.
