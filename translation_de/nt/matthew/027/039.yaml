  text: οἱ δὲ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/039.yaml
  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: de
  text: Die Vorübergehenden aber lästerten ihn[a] und schüttelten dabei den Kopf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schmähten ihn«. Das griechische Verb kann beleidigendes oder verleumderisches Reden bezeichnen, nicht nur Gotteslästerung im engeren Sinn.'
    reason: lexical_alternative
  - marker: b
    text: Eine Gebärde des Spotts oder der Verachtung; vergleiche Psalm 22,8.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ παραπορευόμενοι
  choice: Die Vorübergehenden aber
  rationale: Der substantivierte Präsenspartizip bezeichnet die Menschen, die an der Kreuzigungsstätte vorbeigingen. »Die Vorübergehenden« ist natürliches, gegenwärtiges Deutsch; δέ wird als milder fortführender beziehungsweise leicht kontrastierender Anschluss mit »aber« wiedergegeben.
- source_word: ἐβλασφήμουν
  choice: lästerten
  rationale: Das Imperfekt bezeichnet ein fortgesetztes Geschehen. »Lästern« bewahrt die Stärke von βλασφημέω und kann im Deutschen sowohl ehrverletzende Schmährede als auch Gotteslästerung bezeichnen, ohne hier die Bedeutung vorschnell auf den engeren religiösen Sinn festzulegen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen ist das direkte Objekt und bezieht sich auf Jesus.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: und schüttelten dabei den Kopf
  rationale: Der begleitende Partizipialsatz beschreibt die gleichzeitig ausgeführte Gebärde. Im Deutschen ist bei einer auf mehrere Personen verteilten Körperteilbezeichnung der distributive Singular »den Kopf« idiomatisch und entspricht sachlich dem griechischen Plural.
theological_decisions:
- issue: Bedeutungsumfang von βλασφημέω in Bezug auf Jesus
  choice: »lästerten« im Haupttext
  alternative: »schmähten«
  rationale: »Lästerten« erhält die stärkere Wortwahl des griechischen Textes und lässt deren mögliche theologische Resonanz im Passionsbericht bestehen. Zugleich darf das Verb hier lexikalisch auch als Schmähung einer Person verstanden werden; diese echte Bedeutungsbreite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nah am griechischen Erzählfluss, während »dabei« das zeitliche Verhältnis des Partizips idiomatisch ausdrückt. Die Psalmangabe folgt der in deutschen Bibeln üblichen Zählung; sie entspricht Psalm 22,7 in der englischen Verszählung.
