  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: de
  text: Zum Fest pflegte der Statthalter der Menge einen Gefangenen freizulassen, den die Leute in der Menge wollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Zum Fest
  rationale: κατά mit Akkusativ ist hier temporal; „zum Fest“ gibt den Zeitpunkt idiomatisch wieder. Das leicht weiterführende δέ muss im Deutschen nicht eigens ausgedrückt werden.
- source_word: εἰώθει
  choice: pflegte
  rationale: Die Form bezeichnet eine regelmäßig geübte Gewohnheit in der Vergangenheit; „pflegte“ bewahrt diesen habituellen Sinn knapp und würdig.
- source_word: ὁ ἡγεμὼν
  choice: der Statthalter
  rationale: Im Kontext bezeichnet ἡγεμών den römischen Provinzstatthalter; „Statthalter“ ist historisch passend und allgemein verständlich.
- source_word: ἀπολύειν
  choice: freizulassen
  rationale: ἀπολύω bedeutet hier, jemanden aus der Haft zu entlassen.
- source_word: ἕνα τῷ ὄχλῳ δέσμιον
  choice: der Menge einen Gefangenen
  rationale: ἕνα bezeichnet genau einen Gefangenen; der Dativ τῷ ὄχλῳ wird natürlich als „der Menge“ wiedergegeben.
- source_word: ὃν ἤθελον
  choice: den sie haben wollte
  rationale: Der Relativsatz bezieht sich auf den einen Gefangenen, den die Menge auswählte. Das singularische „sie“ nimmt das Kollektiv „die Menge“ grammatisch korrekt auf; „haben wollte“ ist in diesem Zusammenhang natürlich und wahrt den Auswahlgedanken.
theological_decisions: []
translation_notes:
