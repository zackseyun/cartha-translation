  source_fidelity: Die Übersetzung gibt die Antwortformel ἀποκριθεὶς … εἶπεν idiomatisch wieder. »das ganze Volk« bewahrt die kollektive Form von πᾶς ὁ λαός; »Sein Blut komme über uns und über unsere Kinder« erhält sowohl die elliptisch-selbstverpflichtende Verwünschungsform als auch die Wiederholung von ἐπί und den engen Sinn von τέκνα.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. Die kollektive Singularform »das ganze Volk antwortete« ist idiomatisch; »komme über uns« ist für diese formelhafte Aussage natürlich und angemessen.
  terminology: »Volk«, »Blut« und »Kinder« sind quellennahe und theologisch nicht überdeutende Wiedergaben. Die Fußnote begrenzt die Aussage zutreffend auf die in der Erzählung versammelten Personen, ohne den Wortlaut abzuschwächen oder eine transgenerationale Schuldlehre einzutragen.
