  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: de
  text: 'Da antwortete das ganze Volk[a]: »Sein Blut komme über uns und über unsere Kinder!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die Menschen, die in dieser Szene versammelt sind. Die Formulierung weist nicht allen Juden aller Generationen eine fortdauernde Schuld zu.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Da antwortete
  rationale: Das Partizip mit εἶπεν ist eine idiomatische griechische Antwortformel. Im modernen Deutschen gibt »Da antwortete« die Reaktion natürlich und knapp wieder.
- source_word: πᾶς ὁ λαὸς
  choice: das ganze Volk
  rationale: Die Wendung bezeichnet kollektiv die in der erzählten Szene versammelten Menschen. »Das ganze Volk« bewahrt die Grundbedeutung von λαός und die umfassende Formulierung des griechischen Textes.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: Sein Blut
  rationale: Die knappe deutsche Wendung erhält das Bild des Blutes. Die im gerichtlichen Zusammenhang mitschwingende Verantwortung für seinen Tod wird nicht erklärend in den Haupttext aufgenommen.
- source_word: ἐφ’ ἡμᾶς
  choice: komme über uns
  rationale: Der griechische Nominalsatz enthält kein ausdrückliches Verb. »Komme« gibt den auffordernden beziehungsweise selbstverwünschenden Sinn wieder; »über« entspricht dem traditionellen deutschen Idiom und ist hier natürlicher als bloßes »auf«.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: und über unsere Kinder
  rationale: τέκνα bedeutet hier am unmittelbarsten »Kinder«. Die wiederholte Präposition wird zur Wahrung von Parallelismus und Nachdruck beibehalten; »Nachkommen« würde den Wortlaut unnötig ausweiten.
theological_decisions:
- issue: Mögliche antijüdische Überdehnung von πᾶς ὁ λαὸς
  choice: Die kollektive Aussage der in der Szene versammelten Menschen wird als »das ganze Volk« wiedergegeben und durch eine Fußnote kontextualisiert.
  alternative: »die ganze Menschenmenge« beziehungsweise eine Deutung als dauerhafte Schuld aller Juden
  rationale: Der griechische Text berichtet von den Beteiligten innerhalb der erzählten Szene. Die Übersetzung soll weder die kollektive Schärfe abschwächen noch daraus eine ethnische oder generationenübergreifende Schuldzuweisung machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausruf behält seine knappe, feierlich-ernste und selbstverpflichtende Form; das Ausrufezeichen macht die emphatische Rede deutlich, ohne den Inhalt auszulegen.
