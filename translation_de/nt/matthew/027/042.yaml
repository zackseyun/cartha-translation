  terminology: „retten“, „König Israels“, „Kreuz“ und „an ihn glauben“ sind terminologisch angemessen. Der bestimmte Artikel in „der König Israels“ ist im Deutschen bei dieser Titelaussage idiomatisch und fügt keine sachliche Behauptung über den griechischen Text hinaus hinzu.
