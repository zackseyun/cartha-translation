id: MAT.27.42
reference: Matthew 27:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: de
  text: Andere hat er gerettet; sich selbst kann er nicht retten. Er ist der König Israels! Nun soll er vom Kreuz herabsteigen, dann werden wir an ihn glauben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn er der König Israels ist, soll er nun vom Kreuz herabsteigen, und wir werden an ihn glauben.“ Manche Übersetzungen geben den Spott ausdrücklich als Bedingung wieder; im Griechischen steht der Titel jedoch als direkte Aussage.'
    reason: Alternative syntaktische Wiedergabe der spöttischen Aussage.
lexical_decisions:
- source_word: Ἄλλους
  choice: Andere
  rationale: Der substantivierte Akkusativ Plural wird knapp und natürlich wiedergegeben und bewahrt den spöttischen Gegensatz zu „sich selbst“.
- source_word: ἔσωσεν
  choice: hat er gerettet
  rationale: Das Perfekt ist im modernen Deutschen eine natürliche Wiedergabe des griechischen Aorists; „retten“ erhält sowohl den unmittelbaren Sinn von Befreiung und Heilung als auch die weitergehende Bedeutung.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: sich selbst kann er nicht retten
  rationale: Die Wortstellung hebt den spöttischen Kontrast hervor; „kann ... nicht retten“ gibt δύναται mit Infinitiv idiomatisch wieder.
- source_word: βασιλεὺς Ἰσραήλ
  choice: der König Israels
  rationale: Die direkte Titelaussage des Griechischen bleibt erhalten, ohne einen nicht ausdrücklich vorhandenen Bedingungssatz einzufügen.
- source_word: καταβάτω νῦν
  choice: Nun soll er ... herabsteigen
  rationale: „Soll er“ gibt den Imperativ der dritten Person als höhnische Aufforderung natürlich wieder; „nun“ bewahrt die zeitliche Zuspitzung.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: vom Kreuz
  rationale: Knappes, idiomatisches Deutsch für die Präpositionalphrase.
- source_word: καὶ πιστεύσομεν ἐπ’ αὐτόν
  choice: dann werden wir an ihn glauben
  rationale: Das parataktische καί trägt hier im Deutschen natürlich eine folgernde Bedeutung; „an ihn glauben“ entspricht πιστεύω mit ἐπί und Akkusativ.
theological_decisions:
- issue: Wiedergabe der spöttischen Königsaussage
  choice: Er ist der König Israels!
  alternative: Wenn er der König Israels ist, ...
  rationale: Der griechische Text enthält eine direkte nominale Aussage und keine ausdrückliche Bedingung. Die Übersetzung bewahrt diese Form und lässt den spöttischen Ton durch Kontext und Zeichensetzung erkennen.
- issue: Verhältnis zwischen Herabsteigen und Glauben
  choice: dann werden wir an ihn glauben
  alternative: und wir werden an ihn glauben
  rationale: Das griechische καί verbindet die Aufforderung mit der angekündigten Folge. „Dann“ macht diesen pragmatischen Zusammenhang im Deutschen natürlich deutlich, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappen Satzglieder und die hervorgehobene Gegenüberstellung bewahren die Schärfe des Spotts.
