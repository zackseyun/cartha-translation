  source_fidelity: 'Die Übersetzung gibt die drei Satzglieder des griechischen Textes vollständig und in ihrer spöttischen Zuspitzung wieder: die Rettung anderer, die behauptete Unfähigkeit zur Selbstrettung sowie die Herausforderung, vom Kreuz herabzusteigen. Die direkte Aussage „Er ist der König Israels!“ bewahrt zutreffend die im Griechischen nicht ausdrücklich als Bedingung formulierte Titelaussage. „Dann werden wir an ihn glauben“ gibt die mit καί angeschlossene, pragmatisch folgernde Ankündigung idiomatisch wieder.'
