base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: de
  text: Und legte ihn in sein neues Grab, das er in den Felsen gehauen hatte. Dann wälzte er einen großen Stein vor den Eingang des Grabes[a] und ging weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor die Tür des Grabes“. Das griechische Wort kann sowohl „Tür“ als auch „Eingang“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: legte ihn
  rationale: τίθημι bezeichnet hier das Hineinlegen des Leichnams Jesu. „Legte ihn“ ist im Deutschen natürlich und würdevoll; das maskuline Pronomen entspricht dem im Kontext vorausgesetzten Leichnam beziehungsweise Jesus.
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: in sein neues Grab
  rationale: μνημεῖον bezeichnet hier eine in den Felsen gehauene Grabanlage. „Grab“ ist im modernen Deutschen die natürliche Entsprechung; καινῷ wird ohne die nur mitgemeinte Deutung „unbenutzt“ als „neu“ wiedergegeben, und αὐτοῦ bezeichnet Josephs Besitz.
- source_word: ὃ ἐλατόμησεν
  choice: das er … hatte hauen lassen
  rationale: λατομέω bezeichnet das Heraushauen beziehungsweise Anlegen im Felsen. Das Plusquamperfekt macht deutlich, dass die Herstellung des Grabes zuvor erfolgt war. Das deutsche Kausativ „hauen lassen“ gibt idiomatisch wieder, dass der wohlhabende Joseph das Grab anlegen ließ, ohne auszuschließen, dass der griechische Wortlaut ihn als verantwortlichen Handelnden nennt.
- source_word: ἐν τῇ πέτρᾳ
  choice: in den Felsen
  rationale: Die Formulierung beschreibt ein in massiven Fels hineingehauenes Grab. „In den Felsen“ ist räumlich klar und im Deutschen idiomatisch.
- source_word: προσκυλίσας
  choice: Dann wälzte er … vor
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Weggehen vorausgeht. Ein selbstständiger Satz mit „Dann“ bildet die Abfolge in natürlichem Deutsch ab; „vor den Eingang wälzen“ entspricht der Funktion des Steins als Verschluss.
- source_word: λίθον μέγαν
  choice: einen großen Stein
  rationale: μέγας bedeutet hier schlicht „groß“. Die Wiedergabe vermeidet sowohl eine altertümliche als auch eine unnötig verstärkende Formulierung.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: vor den Eingang des Grabes
  rationale: θύρα kann „Tür“ oder „Eingang/Öffnung“ bedeuten. Bei einem Felsengrab ist „Eingang“ im modernen Deutschen anschaulicher; der Dativ bezeichnet hier den Zielpunkt beziehungsweise die Position, an die der Stein gerollt wurde.
- source_word: ἀπῆλθεν
  choice: ging weg
  rationale: ἀπέρχομαι bezeichnet hier einfach das Fortgehen. „Ging weg“ ist klar, modern und bewahrt die knappe Erzählweise.
