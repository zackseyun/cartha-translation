  source_fidelity: Die Übersetzung gibt den temporalen Genitivus absolutus, die vollständige Beteiligung der genannten Gruppen, die gegen Jesus gerichtete Beratung sowie deren tödliche Zielrichtung zuverlässig wieder. „Führende Priester“ trifft οἱ ἀρχιερεῖς als Bezeichnung der priesterlichen Führungsschicht, ohne mehrere amtierende Hohepriester zu suggerieren. „Mit dem Ziel, ihn zu töten“ gibt den finalen Sinn von ὥστε mit Infinitiv im Kontext angemessen wieder.
  naturalness: Der Satz ist modernes, idiomatisches Standarddeutsch und bewahrt einen sachlich-würdigen Erzählton. „Als es Morgen geworden war“ ist leicht gehoben, aber natürlich und für den Kontext passend.
  terminology: „Älteste des Volkes“ und „gegen Jesus“ sind terminologisch präzise. „Führende Priester“ ist eine verständliche, quellentreue Wiedergabe der pluralischen Führungsgruppe. „Töten“ vermeidet die nicht ausdrücklich im Verb enthaltene Spezifizierung eines förmlichen Hinrichtungsverfahrens.
