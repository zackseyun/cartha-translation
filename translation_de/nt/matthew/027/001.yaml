id: MAT.27.1
reference: Matthew 27:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: de
  text: Als es Morgen geworden war, berieten sich alle führenden Priester und die Ältesten des Volkes gegen Jesus mit dem Ziel, ihn zu töten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Als es Morgen geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Übergang. Die deutsche Formulierung gibt dies natürlich und würdevoll wieder; δέ bleibt als leichter Fortgang der Erzählung unmarkiert.
- source_word: συμβούλιον ἔλαβον
  choice: berieten sich
  rationale: Die Wendung bezeichnet gemeinsames Beraten beziehungsweise eine förmliche Beratung. „Berieten sich“ ist im modernen Deutsch idiomatisch, ohne bereits ein Komplott oder einen endgültigen Beschluss in den Ausdruck hineinzulesen.
- source_word: πάντες
  choice: alle
  rationale: Die ausdrückliche Gesamtheit der beteiligten Führungspersonen bleibt erhalten.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: ἀρχιερεῖς bezeichnet hier die priesterliche Führungsschicht Jerusalems, nicht mehrere amtierende Hohepriester. „Führende Priester“ vermeidet dieses Missverständnis und ist für heutige Leser verständlich.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: die Ältesten des Volkes
  rationale: Die formelle Bezeichnung der nichtpriesterlichen Führung wird nah an der griechischen Genitivkonstruktion wiedergegeben.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: gegen Jesus
  rationale: κατά mit Genitiv hat im feindseligen Zusammenhang adversative Bedeutung; es geht nicht nur um eine Beratung über Jesus.
- source_word: ὥστε
  choice: mit dem Ziel
  rationale: Mit dem Infinitiv kann ὥστε hier beabsichtigte Folge beziehungsweise Zweck ausdrücken. Die Wiedergabe bewahrt diese Spannung und legt sich nicht ausschließlich auf eine rein konsekutive Lesart fest.
- source_word: θανατῶσαι αὐτόν
  choice: ihn zu töten
  rationale: Das Verb bedeutet, jemanden zu Tode zu bringen. „Töten“ ist präzise und vermeidet die zusätzliche Festlegung auf ein rechtsförmiges Hinrichtungsverfahren, die „hinrichten“ nahelegen könnte.
theological_decisions:
- issue: Art des Vorgehens der Führer gegen Jesus
  choice: Feindselige gemeinsame Beratung mit dem Ziel, Jesus zu töten
  alternative: „Sie hielten Rat über Jesus“ oder stärker „sie schmiedeten einen Plan gegen Jesus“
  rationale: κατὰ τοῦ Ἰησοῦ bezeichnet eindeutig die Gegnerschaft, und θανατῶσαι αὐτόν nennt das tödliche Ziel. „Berieten sich“ wahrt jedoch den Wortlaut, ohne über das Griechische hinaus ausdrücklich ein heimliches Komplott oder bereits einen endgültigen Beschluss zu behaupten.
- issue: Nuance von ὥστε mit Infinitiv
  choice: „mit dem Ziel“ als Wiedergabe einer beabsichtigten Folge
  alternative: „sodass sie ihn töteten“ als rein konsekutive Wiedergabe
  rationale: Der Kontext und der Infinitiv stützen eine zielgerichtete Beratung. Zugleich wird nicht behauptet, dass die Tötung bereits in diesem Moment als eingetretene Folge dargestellt werde.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt dem griechischen Ablauf nahe, ohne unnatürlich wörtlich zu wirken.
