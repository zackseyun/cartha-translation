source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: de
  text: 'Pilatus sagte zu ihnen: »Was soll ich dann mit Jesus tun, der Messias genannt wird?« Sie sagten alle: »Er soll gekreuzigt werden!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Was soll ich dann … tun?
  rationale: Der Aorist Konjunktiv steht in einer deliberativen Frage und wird im Deutschen natürlich mit „soll ich … tun?“ wiedergegeben. „Dann“ nimmt die folgernde beziehungsweise gesprächssteuernde Funktion von οὖν auf.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Der Personenname wird gemäß der üblichen deutschen Form wiedergegeben.
- source_word: τὸν λεγόμενον χριστόν
  choice: der Messias genannt wird
  rationale: Das attributive Passivpartizip λεγόμενον wird als Relativsatz wiedergegeben. χριστός bezeichnet hier einen Titel; „Messias“ bewahrt dessen jüdischen Bedeutungsgehalt.
- source_word: λέγουσιν πάντες
  choice: Sie sagten alle
  rationale: Das historische Präsens wird für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben; „alle“ erhält die kollektive Aussage von πάντες.
- source_word: Σταυρωθήτω
  choice: Er soll gekreuzigt werden!
  rationale: Die Form ist ein Aorist Passiv Imperativ der dritten Person Singular. „Er soll … werden“ bewahrt im Deutschen sowohl die Aufforderung als auch die Passivform.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: In der Formulierung „der … genannt wird“ fungiert χριστός erkennbar als Titel. „Messias“ vermittelt dessen Bedeutung, ohne ihn wie einen zweiten Namen zu behandeln; „Christus“ bleibt eine mögliche traditionelle Wiedergabe.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Passivform der abschließenden Forderung und die titulare Bedeutung von χριστός bleiben erhalten. Kein Fußnotenmarker ist nötig, da die Alternative „Christus“ im Deutschen keine für diesen Vers erforderliche textkritische oder semantisch unverzichtbare Erläuterung darstellt.
