  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: de
  text: Und sie zogen ihn aus und legten ihm einen scharlachroten Mantel[a] um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein scharlachrotes Gewand“. Das griechische Wort bezeichnet einen Mantel oder Überwurf, oft einen kurzen Soldatenmantel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδύσαντες
  choice: sie zogen ihn aus
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Die koordinierte deutsche Formulierung gibt die zeitliche Abfolge im Erzählzusammenhang natürlich wieder.
- source_word: χλαμύδα
  choice: Mantel
  rationale: χλαμύς bezeichnet einen kurzen Überwurf oder Mantel, häufig im militärischen Umfeld. „Mantel“ ist verständlich und wahrt die konkrete Bedeutung, ohne die Soldatenzugehörigkeit ausdrücklich in den Text hineinzutragen.
- source_word: κοκκίνην
  choice: scharlachroten
  rationale: κόκκινος bezeichnet ein kräftiges Scharlachrot; „scharlachrot“ erhält die präzise Farbangabe.
- source_word: περιέθηκαν αὐτῷ
  choice: legten ihm … um
  rationale: περιτίθημι bedeutet hier, ein Kleidungsstück um jemanden zu legen. Die deutsche Wendung bildet das Verb und den Dativ idiomatisch ab.
- source_word: καὶ
  choice: Und
  rationale: Die einfache Verbindung mit „Und“ entspricht καί und bewahrt den fortlaufenden Erzählstil.
theological_decisions:
- issue: Art des Kleidungsstücks in der Verspottungsszene
  choice: scharlachroter Mantel
  alternative: scharlachrotes Gewand
  rationale: „Mantel“ wahrt den konkreten Sinn von χλαμύς und lässt die im Kontext erkennbare spöttische königliche Inszenierung für sich selbst sprechen, ohne zusätzliche Deutung einzutragen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. „Legten … um“ klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit „darumlegen“ und spiegelt zugleich die Vorsilbe περί- angemessen wider.
