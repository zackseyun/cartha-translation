  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: de
  text: Nachdem sie im Traum gewarnt worden waren, nicht zu Herodes zurückzukehren,[a] zogen sie auf einem anderen Weg[b] in ihr Land zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „angewiesen worden waren“. Das griechische Passiv deutet auf eine Warnung oder Weisung von Gott hin, obwohl Gott in diesem Vers nicht ausdrücklich genannt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf einer anderen Route“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: angewiesen worden waren
  rationale: Das passive Partizip bezeichnet hier eine empfangene Weisung oder Warnung, die im matthäischen Zusammenhang von Gott kommt. „Angewiesen“ gibt sowohl den warnenden als auch den anordnenden Gehalt wieder, ohne Gott als im Vers nicht ausdrücklich genanntes Subjekt einzufügen.
- source_word: κατ’ ὄναρ
  choice: in einem Traum
  rationale: Die feste matthäische Wendung bezeichnet eine im Traum empfangene Mitteilung; „in einem Traum“ ist im heutigen Deutsch klar und idiomatisch.
- source_word: μὴ ἀνακάμψαι
  choice: nicht … zurückzukehren
  rationale: μή mit dem Infinitiv gibt den Inhalt der Weisung an. „Zurückzukehren“ passt präzise zur Reisebewegung.
- source_word: πρὸς Ἡρῴδην
  choice: zu Herodes
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung zu einer Person hin.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: auf einem anderen Weg
  rationale: ὁδός bezeichnet hier konkret den Reiseweg. Die deutsche Wendung ist natürlich und bleibt nah an der Bildlichkeit des griechischen Ausdrucks.
- source_word: ἀνεχώρησαν
  choice: zogen … zurück
  rationale: ἀναχωρέω kann „fortgehen“ oder „sich zurückziehen“ bedeuten. Zusammen mit dem Ziel „in ihr Land“ gibt „zogen … zurück“ den erzählten Aufbruch zur Heimreise natürlich wieder.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: in ihr Land
  rationale: χώρα kann Land, Gebiet oder Region bedeuten. „Ihr Land“ bewahrt die räumliche Bedeutung und vermeidet die im Griechischen nicht ausdrücklich enthaltene Verstärkung „eigenes“.
theological_decisions:
- issue: Unausgesprochener göttlicher Ursprung der Weisung
  choice: Passivische Formulierung „angewiesen worden waren“, ohne Gott im Haupttext ausdrücklich zu nennen
  alternative: „von Gott gewarnt worden waren“ oder „eine göttliche Weisung erhalten hatten“
  rationale: Der Kontext und der Gebrauch von χρηματίζω legen göttliches Handeln nahe, doch Gott wird in diesem Satz nicht ausdrücklich genannt. Die Übersetzung erhält diese Implikation, ohne das unausgesprochene Agens in den Text einzusetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung folgt natürlichem Deutsch; die passive Traumweisung und die konkrete Reisebewegung bleiben erhalten.
