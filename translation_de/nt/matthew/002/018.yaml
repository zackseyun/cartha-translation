  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: de
  text: 'In Rama wurde eine Stimme gehört: Weinen und großes Klagen. Rahel weinte um ihre Kinder und wollte sich nicht trösten lassen, weil sie nicht mehr da sind.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weil sie nicht sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: In Rama wurde eine Stimme gehört
  rationale: Die passive Form und der Ortsname werden eng am Griechischen wiedergegeben; „Stimme“ bewahrt zugleich den personifizierten, prophetischen Klang des Zitats.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: Weinen und lautes Klagen
  rationale: Die beiden Ausdrücke für hörbare Trauer bleiben unterschieden. „Lautes“ gibt die verstärkende Wirkung von πολύς in natürlichem Deutsch wieder, ohne eine zusätzliche emotionale Deutung einzutragen.
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: Rahel weinte um ihre Kinder
  rationale: Das Partizip wird für einen natürlichen deutschen Satz verbal wiedergegeben. „Kinder“ ist geschlechtsübergreifend und entspricht τέκνα.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: wollte sich nicht trösten lassen
  rationale: Diese Formulierung bewahrt den Willensaspekt von θέλω und den passiven Sinn von παρακληθῆναι; „weigerte sich“ wäre etwas stärker.
- source_word: ὅτι οὐκ εἰσίν
  choice: weil sie nicht mehr da sind
  rationale: Die idiomatische deutsche Wendung vermittelt Verlust oder Tod, ohne das im Griechischen auffallend knappe „sie sind nicht“ ausdrücklich auf eine einzige Deutung festzulegen.
theological_decisions:
- issue: Rahel als Gestalt des prophetischen Zitats
  choice: Rahel bleibt ohne erklärenden Zusatz als klagende Muttergestalt stehen.
  alternative: Rahel im Haupttext ausdrücklich als Sinnbild für die Mütter Israels erklären.
  rationale: Der griechische Text benennt Rahel, erläutert aber die symbolische oder typologische Ebene nicht. Die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung von οὐκ εἰσίν
  choice: „sie nicht mehr da sind“
  alternative: „sie tot sind“
  rationale: Der Zusammenhang bezeichnet einen endgültigen Verlust, doch der griechische Wortlaut sagt nicht ausdrücklich „tot“. Die gewählte Formulierung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am prophetischen Zitat, wird jedoch so geglättet, dass der Vers für heutige Leser verständlich und gut vorlesbar ist.
