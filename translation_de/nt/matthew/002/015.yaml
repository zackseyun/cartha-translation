id: MAT.2.15
reference: Matthew 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: de
  text: 'und blieb dort bis zum Tod des Herodes. So sollte sich erfüllen, was der Herr durch den Propheten gesagt hatte: »Aus Ägypten habe ich meinen Sohn gerufen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matthäus zitiert Hosea 11,1. Dort bezieht sich »mein Sohn« ursprünglich auf Israel; hier stellt Matthäus Jesu Rückkehr aus Ägypten als Erfüllung dieses Schriftwortes dar.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: blieb dort
  rationale: Wörtlich steht hier »war dort«. Im Zusammenhang bezeichnet die Wendung jedoch idiomatisch das Verbleiben in Ägypten; »blieb dort« ist im Deutschen natürlich und gibt den durativen Imperfekt angemessen wieder.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: bis zum Tod des Herodes
  rationale: τελευτή bezeichnet hier das Lebensende beziehungsweise den Tod. Die nominale griechische Konstruktion wird präzise und idiomatisch beibehalten.
- source_word: ἵνα πληρωθῇ
  choice: So sollte sich erfüllen
  rationale: Diese Formulierung bewahrt die zweck- beziehungsweise folgebezogene Aussage der matthäischen Erfüllungsformel, ohne sie auf eine bestimmte Theorie prophetischer Erfüllung festzulegen.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: was der Herr durch den Propheten gesagt hatte
  rationale: Die Übersetzung unterscheidet den Herrn als Ursprung der Aussage vom Propheten als ihrem Vermittler. Das Plusquamperfekt stellt im Deutschen klar, dass das prophetische Wort bereits zuvor gesprochen worden war.
- source_word: Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου
  choice: Aus Ägypten habe ich meinen Sohn gerufen
  rationale: »Aus Ägypten« gibt ἐξ natürlich wieder; »gerufen« wahrt den breiten Sinn von καλέω und »Sohn« die für das Hoseazitat wichtige Sohnesbezeichnung.
theological_decisions:
- issue: Erfüllungsformel und Zitat aus Hosea 11,1
  choice: Die Aussage bleibt als Erfüllungsformel stehen, ohne die Art der Erfüllung näher zu bestimmen.
  alternative: Ausschließlich direkte Vorhersage oder ausdrücklich typologische Wiederholung der Geschichte Israels
  rationale: Matthäus bezeichnet Jesu Rückkehr aus Ägypten ausdrücklich als Erfüllung. Die Übersetzung soll weder den ursprünglichen Bezug auf Israel ausblenden noch eine bestimmte Erklärung des Erfüllungsverhältnisses in den Haupttext eintragen.
- issue: κύριος in der Erfüllungsformel
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Text hat κύριος. »der Herr« gibt diese Form wieder, ohne im Haupttext eine besondere Wiedergabe des hebräischen Gottesnamens einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung folgt natürlichem deutschen Sprachgebrauch; die Unterscheidung zwischen dem Herrn als Sprecher und dem Propheten als Vermittler bleibt erhalten.
