  to: 'Als sie in das Haus kamen, sahen sie das Kind mit Maria, seiner Mutter. Sie warfen sich nieder und huldigten ihm.[a] Dann öffneten sie ihre Schätze und brachten ihm Geschenke dar: Gold, Weihrauch und Myrrhe.'
