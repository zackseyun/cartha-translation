id: MAT.2.11
reference: Matthew 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: de
  text: 'Als sie in das Haus kamen, sahen sie das Kind mit Maria, seiner Mutter. Sie warfen sich nieder und huldigten ihm.[a] Dann öffneten sie ihre Schätze und brachten ihm Geschenke dar: Gold, Weihrauch und Myrrhe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: beteten ihn an. Das griechische Verb kann je nach Zusammenhang Anbetung oder eine ehrerbietige Huldigung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: Haus
  rationale: Die konkrete Bezeichnung einer Wohnstätte wird direkt und natürlich mit »Haus« wiedergegeben.
- source_word: παιδίον
  choice: Kind
  rationale: »Kind« gibt die Altersbezeichnung genau wieder, ohne durch »kleines Kind« oder »Junge« unnötig zu präzisieren.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: bei Maria, seiner Mutter
  rationale: »Bei« drückt hier die räumliche Gemeinschaft idiomatisch aus; die Apposition bezeichnet Maria eindeutig als die Mutter des Kindes.
- source_word: πεσόντες
  choice: warfen sie sich nieder
  rationale: Die Formulierung macht die im griechischen Partizip bezeichnete körperliche Bewegung anschaulich, ohne sie bereits als Anbetung zu deuten.
- source_word: προσεκύνησαν
  choice: huldigten
  rationale: Das Verb kann sowohl ehrerbietige Huldigung als auch Anbetung bezeichnen. »Huldigten« bewahrt im Haupttext die königliche und religiöse Bedeutungsweite.
- source_word: θησαυρούς
  choice: Schätze
  rationale: Die direkte Wiedergabe lässt offen, ob vor allem die wertvollen Vorräte oder deren Behältnisse gemeint sind, auch wenn die Verbindung mit »öffnen« im Deutschen bewusst bildhaft bleibt.
- source_word: προσήνεγκαν
  choice: brachten … dar
  rationale: »Darbringen« entspricht dem feierlichen Überreichen der Gaben und wahrt den möglichen kultischen Klang, ohne die Geschenke ausdrücklich zu Opfern zu erklären.
- source_word: δῶρα
  choice: Geschenke
  rationale: »Geschenke« ist die klare, nicht unnötig kultisch festgelegte Entsprechung.
- source_word: λίβανον
  choice: Weihrauch
  rationale: »Weihrauch« bezeichnet präzise das aromatische Harz und ist im Deutschen die geläufige Benennung.
- source_word: σμύρναν
  choice: Myrrhe
  rationale: »Myrrhe« ist die genaue und allgemein etablierte Entsprechung.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber dem Kind Jesus
  choice: huldigten ihm
  alternative: beteten ihn an
  rationale: Im unmittelbaren Erzählzusammenhang kann die Handlung als Huldigung vor einem königlichen Kind verstanden werden; zugleich kann das Verb Anbetung bezeichnen. Der Haupttext legt die theologische Tragweite daher nicht enger fest, während die Fußnote die stärkere mögliche Lesart nennt.
translation_notes:
  register: Moderne, würdige Standardsprache mit anschaulicher Erzählbewegung. Die Satzfolge löst die lange griechische Koordination behutsam in drei deutsche Sätze auf. »Ihre Schätze öffnen« bewahrt die Offenheit des griechischen Ausdrucks, statt ausdrücklich Schatztruhen einzuführen.
