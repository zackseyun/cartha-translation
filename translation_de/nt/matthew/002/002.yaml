source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: de
  text: 'Sie sagten: „Wo ist der geborene König der Juden? Denn wir haben seinen Stern im Osten[a] gesehen und sind gekommen, um ihm zu huldigen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei seinem Aufgang“. Die griechische Wendung kann „im Osten“ bedeuten oder sich auf den Aufgang des Sterns beziehen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „um ihn anzubeten“. Das griechische Verb kann je nach Zusammenhang sowohl die Huldigung vor einem König als auch Anbetung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Sie fragten
  rationale: Das präsentische Partizip leitet hier den Inhalt einer Frage ein. Im Deutschen gibt „Sie fragten“ die narrative Funktion natürlicher wieder als das wörtlichere „und sagten“.
- source_word: Ποῦ ἐστιν
  choice: Wo ist
  rationale: Direkte und genaue Wiedergabe der Ortsfrage ohne erklärende Erweiterung.
- source_word: ὁ τεχθεὶς
  choice: der neugeborene
  rationale: Das substantivierte Aorist-Passiv-Partizip bezeichnet den, der geboren wurde. Im Zusammenhang der Erzählung ist „der neugeborene König“ idiomatisch und bewahrt den Fokus auf seiner Geburt.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: König der Juden
  rationale: Die übliche, natürliche Wiedergabe des königlichen Titels; seine politische und messianische Spannung bleibt erhalten.
- source_word: εἴδομεν γὰρ
  choice: Denn wir haben … gesehen
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder. Das deutsche Perfekt passt zur direkten Rede und bezeichnet eine vergangene Wahrnehmung, die ihre Reise und gegenwärtige Anwesenheit erklärt.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: seinen Stern
  rationale: Der Genitiv ist am natürlichsten possessiv wiedergegeben; die genaue Art des Himmelszeichens bleibt offen.
- source_word: ἐν τῇ ἀνατολῇ
  choice: im Osten
  rationale: Die Wendung kann eine Himmelsrichtung oder astronomisch den Aufgang bezeichnen. „Im Osten“ ist im Haupttext natürlich und traditionsnah; die echte Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: ἤλθομεν
  choice: sind gekommen
  rationale: Das Perfekt ist in deutscher direkter Rede idiomatisch und betont das gegenwärtige Ergebnis ihrer Reise.
- source_word: προσκυνῆσαι αὐτῷ
  choice: um ihm zu huldigen
  rationale: προσκυνέω kann königliche Huldigung, Niederwerfung oder Anbetung bezeichnen. „Huldigen“ passt zum unmittelbaren Bezug auf den König, ohne die weitergehende theologische Bedeutung auszuschließen.
theological_decisions:
- issue: Bedeutung von προσκυνῆσαι gegenüber dem Kind Jesus
  choice: um ihm zu huldigen
  alternative: um ihn anzubeten
  rationale: Der unmittelbare Kontext beschreibt Jesus als „König der Juden“, sodass königliche Huldigung semantisch naheliegt. Da das Verb zugleich Anbetung bezeichnen kann, wird diese christologische Spannung nicht aufgelöst, sondern als Alternative in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist flüssig formuliert; echte lexikalische und theologische Mehrdeutigkeiten werden durch Fußnoten offengehalten.
