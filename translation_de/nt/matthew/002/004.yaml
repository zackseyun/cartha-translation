id: MAT.2.4
reference: Matthew 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: de
  text: Er versammelte alle führenden Priester und Schriftgelehrten des Volkes und erkundigte sich bei ihnen, wo der Messias[a] geboren werden sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische Wort bezeichnet den erwarteten Gesalbten.'
    reason: Alternative Wiedergabe des messianischen Titels Χριστός.
lexical_decisions:
- source_word: συναγαγὼν
  choice: Er versammelte … und
  rationale: Das vorzeitige Aoristpartizip wird als koordinierte Handlung wiedergegeben. So bleibt die Abfolge erkennbar, ohne im Deutschen eine schwerfällige Partizipialkonstruktion zu erzeugen.
- source_word: πάντας
  choice: alle
  rationale: Bewahrt die umfassende Aussage des griechischen Adjektivs.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Bezeichnet hier die priesterliche Führungsschicht. Diese Wiedergabe vermeidet den missverständlichen Eindruck, es habe gleichzeitig mehrere amtierende Hohepriester gegeben.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Direkte, im deutschen Bibelwortschatz verständliche Bezeichnung für die in der Auslegung der heiligen Schriften und des Gesetzes kundigen Personen.
- source_word: τοῦ λαοῦ
  choice: des Volkes
  rationale: Gibt den Genitiv knapp wieder, ohne die ethnische Zuordnung erklärend in den Haupttext einzufügen.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: erkundigte sich bei ihnen
  rationale: Die idiomatische deutsche Formulierung wahrt den nachdrücklicheren Sinn von πυνθάνομαι und lässt den imperfektiven Hintergrund der Erkundigung erkennen.
- source_word: ποῦ
  choice: wo
  rationale: Direkte Wiedergabe des Frageadverbs.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός ist hier der Titel des erwarteten gesalbten Herrschers. „Messias“ bewahrt den jüdischen Erwartungshorizont; die alternative Titelwiedergabe wird in der Fußnote genannt.
- source_word: γεννᾶται
  choice: geboren werden sollte
  rationale: Das griechische Präsens steht in einer indirekten Frage nach dem prophetisch erwarteten Geburtsort. Die deutsche Formulierung gibt diese aus damaliger Sicht bevorstehende und erwartete Geburt natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Titels Χριστός
  choice: der Messias
  alternative: der Christus
  rationale: Im Zusammenhang mit Herodes’ Frage nach dem von den Schriften erwarteten Herrscher fungiert Χριστός deutlich als Titel. „Messias“ macht diesen jüdischen Erwartungskontext verständlich, ohne den Titel zu einem Eigennamen zu machen.
- issue: Zeitlicher Sinn von γεννᾶται
  choice: geboren werden sollte
  alternative: geboren wird
  rationale: Die gewählte Formulierung entspricht im deutschen Vergangenheitsrahmen einer erwarteten künftigen Geburt. Sie versteht das „sollte“ nicht als moralische Verpflichtung, sondern als Erwartung aufgrund prophetischer Verheißung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Führende Priester“ ist gegenüber dem traditionellen Plural „Hohepriester“ für heutige Leser sachlich klarer; „Schriftgelehrte“ bleibt als etablierter und präziser Begriff erhalten.
