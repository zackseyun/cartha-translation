  source_fidelity: 'Die Wiedergabe trifft die Satzstruktur und den Sinn des Griechischen zuverlässig: συναγαγών wird idiomatisch als vorangehende Versammlung ausgedrückt, πάντας durch „alle“, ἀρχιερεῖς durch das sachlich passende „führende Priester“, γραμματεῖς durch „Schriftgelehrte“ und τοῦ λαοῦ ohne zusätzliche Einengung durch „des Volkes“. „erkundigte sich bei ihnen“ gibt ἐπυνθάνετο παρ’ αὐτῶν natürlich wieder. „wo der Messias geboren werden sollte“ vermittelt die im Erzählrahmen erwartete zukünftige Geburt angemessen.'
  naturalness: Modernes, flüssiges und zugleich würdiges Standarddeutsch. Die koordinierte Formulierung „Er versammelte … und erkundigte sich“ ist gegenüber einer Partizipialkonstruktion idiomatisch. Sie wahrt im Kontext die Handlungsfolge, auch wenn sie die Partizipialform nicht formal nachbildet.
  terminology: „Messias“ ist für ὁ χριστός im jüdisch-messianischen Kontext treffend und entspricht der englischen POB-Entscheidung. Die Fußnote nennt transparent „der Christus“ als alternative Titelwiedergabe. „Führende Priester“ vermeidet die im Deutschen mögliche Fehlassoziation mehrerer gleichzeitig amtierender Hohepriester, ohne den Sinn von ἀρχιερεῖς abzuschwächen.
