id: MAT.2.9
reference: Matthew 2:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: de
  text: Nachdem sie den König gehört hatten, machten sie sich auf den Weg. Und siehe, der Stern, den sie im Osten[a] gesehen hatten, zog vor ihnen her, bis er über dem Ort, wo das Kind war, zum Stehen kam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei seinem Aufgang“. Der griechische Ausdruck kann sowohl den Osten als Gegend oder Richtung als auch den Aufgang eines Sterns bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Nachdem sie den König gehört hatten
  rationale: Der vorzeitige Aoristpartizip wird als temporaler Nebensatz wiedergegeben. Der Genitiv bezeichnet bei ἀκούω die gehörte Person; „den König“ bewahrt den ausdrücklichen Wortlaut, ohne den Namen Herodes aus dem Kontext einzufügen.
- source_word: ἐπορεύθησαν
  choice: machten sie sich auf den Weg
  rationale: Die Wendung gibt den erzählerischen Aufbruch natürlich wieder, ohne Ziel oder Reiseweise näher festzulegen.
- source_word: ἰδοὺ
  choice: Und siehe
  rationale: Der Aufmerksamkeitsruf bleibt als lebendiges, in gehobener moderner Erzählsprache verständliches Signal erhalten.
- source_word: ὃν εἶδον
  choice: den sie … gesehen hatten
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass die frühere Sichtung dem nun geschilderten Vorausziehen des Sterns vorausging.
- source_word: ἐν τῇ ἀνατολῇ
  choice: im Osten
  rationale: Die geografische Wiedergabe ist im Haupttext natürlich und traditionsnah; die ebenfalls mögliche astronomische Bedeutung wird in einer Fußnote bewahrt.
- source_word: προῆγεν αὐτούς
  choice: zog vor ihnen her
  rationale: Die Formulierung bewahrt das Bild des vorausgehenden Sterns und klingt für ein Himmelsobjekt im Deutschen natürlicher als „ging“.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: bis er … zum Stehen kam
  rationale: Die deutsche Wendung bündelt Ankunft und Stillstand idiomatisch, ohne einen Mechanismus der Sternbewegung zu erklären.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: über dem Ort, wo das Kind war
  rationale: „Über dem Ort“ macht den räumlichen Bezug des griechischen ἐπάνω οὗ im Deutschen klar; παιδίον wird schlicht mit „das Kind“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἐν τῇ ἀνατολῇ in der Erzählung vom Stern
  choice: im Osten
  alternative: bei seinem Aufgang
  rationale: Der griechische Ausdruck kann entweder den Osten als Gegend beziehungsweise Richtung oder astronomisch den Aufgang eines Gestirns bezeichnen. Der Haupttext entscheidet sich aus Gründen der Lesbarkeit für die geografische Wiedergabe, während die echte Mehrdeutigkeit in der Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und siehe“ erhält bewusst die anschauliche Erzählmarkierung des Originals; die übrige Syntax ist flüssig und allgemein verständlich.
