source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: de
  text: Da rief Herodes die Magier heimlich zu sich und ermittelte bei ihnen genau den Zeitpunkt, zu dem der Stern erschienen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Weisen«. Das griechische Wort bezeichnet hier gelehrte östliche Sterndeuter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Als temporaler Erzählanschluss gibt »Da« die Abfolge natürlich und prägnant wieder.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Im Deutschen übliche Namensform.
- source_word: λάθρᾳ
  choice: heimlich
  rationale: Bezeichnet die verborgene, nicht öffentliche Art der Kontaktaufnahme.
- source_word: καλέσας
  choice: rief … zu sich
  rationale: Das aoristische Partizip wird als dem Hauptverb vorausgehende Handlung wiedergegeben; die Wendung ist im Deutschen natürlicher als ein substantivisch oder partizipial enges Abbild.
- source_word: τοὺς μάγους
  choice: die Magier
  rationale: »Magier« bildet μάγοι unmittelbar ab und vermeidet die traditionell stärker festgelegte Bezeichnung »Weise«; eine verständliche Alternative wird in der Fußnote genannt.
- source_word: ἠκρίβωσεν
  choice: erkundigte sich … genau
  rationale: Das Verb bezeichnet ein sorgfältiges, präzises Ermitteln. Die gewählte Form bewahrt zugleich den möglichen Vorgangscharakter des Nachfragens, ohne schon dessen Erfolg stärker zu behaupten als der griechische Ausdruck.
- source_word: παρ’ αὐτῶν
  choice: bei ihnen
  rationale: παρά mit Genitiv kennzeichnet hier die Personen, von denen Herodes die Auskunft einholt; idiomatisch deutsch ist »sich bei ihnen erkundigen«.
- source_word: τὸν χρόνον τοῦ φαινομένου ἀστέρος
  choice: wann der Stern erschienen war
  rationale: Die genitivische Partizipialfügung wird als natürliche temporale Frage wiedergegeben. Das Plusquamperfekt ordnet das Erscheinen vor Herodes’ Erkundigung ein.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Magier« bleibt nahe am griechischen Ausdruck; die Fußnote erläutert die historische Bedeutung und nennt die vertraute Alternative.
