review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft die Imperative, die Zielangabe »Land Israel«, den resultativen Sinn von τεθνήκασιν (»sind tot«) und das Idiom »dem Kind nach dem Leben trachten« zutreffend. Das präteritale »trachteten« glättet jedoch das präsente substantivierte Partizip οἱ ζητοῦντες stärker, als es nötig ist.
  naturalness: Die Formulierung ist insgesamt gut verständlich. »Zieh in das Land Israel« hat einen leicht altertümlich-feierlichen, migrationsbezogenen Beiklang; »geh in das Land Israel« ist im modernen Standarddeutsch unmittelbarer und gibt πορεύου ausreichend genau wieder. Die Präsensform im Relativsatz bleibt verständlich und bewahrt die Charakterisierung der Verfolger.
  terminology: »Kind«, »seine Mutter«, »Land Israel«, »sind tot« und insbesondere »dem Kind nach dem Leben trachten« sind angemessene Wiedergaben. Letztere macht deutlich, dass ψυχή hier »Leben« und nicht »Seele« bedeutet, ohne eine zusätzliche theologische Deutung einzutragen.
  issues:
  - severity: low
    issue: πορεύου als »zieh« wiedergegeben
    rationale: »Zieh« ist möglich, wirkt im modernen Standarddeutsch aber unnötig gehoben und kann einen stärkeren Umsiedlungs- oder Auszugsakzent tragen. »Geh« ist die natürliche, quellennahe Grundwiedergabe.
  - severity: low
    issue: οἱ ζητοῦντες im Präteritum »die ... trachteten«
    rationale: Das griechische Präsenspartizip kennzeichnet die Personen als diejenigen, die dem Kind nach dem Leben trachten. Ein deutsches Präsens bewahrt diese Charakterisierung, während der Hauptsatz weiterhin ihren nun eingetretenen Tod ausdrückt.
  revised_text: 'und sagte: „Steh auf, nimm das Kind und seine Mutter mit und geh in das Land Israel; denn die, die dem Kind nach dem Leben trachten, sind tot.“'
