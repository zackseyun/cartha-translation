  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: de
  text: 'und sagte: „Steh auf, nimm das Kind und seine Mutter mit und geh in das Land Israel; denn die, die dem Kind nach dem Leben trachten, sind tot.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das Präsenspartizip führt die Rede des Engels ein und knüpft an den vorigen Vers an. Im Deutschen gibt die finite Wendung den Zusammenhang natürlicher wieder als das schwerfällige „sagend“.
- source_word: Ἐγερθείς
  choice: Steh auf
  rationale: Das Aoristpartizip wird vor dem Imperativ idiomatisch als Aufforderung gebraucht; „Steh auf“ ist im Deutschen klar und natürlich.
- source_word: παράλαβε
  choice: nimm … mit
  rationale: παραλαμβάνω bezeichnet hier, jemanden zu sich zu nehmen und mitzunehmen. Die trennbare Wendung „mitnehmen“ bildet diese Bedeutung genau und idiomatisch ab.
- source_word: τὸ παιδίον
  choice: das Kind
  rationale: παιδίον bedeutet hier schlicht „Kind“; eine zusätzliche Altersangabe wäre nicht erforderlich.
- source_word: τὴν μητέρα αὐτοῦ
  choice: seine Mutter
  rationale: Die Genitivverbindung wird im Deutschen natürlich mit dem Possessivpronomen wiedergegeben.
- source_word: πορεύου
  choice: zieh
  rationale: πορεύομαι bezeichnet hier das Sich-auf-den-Weg-Machen beziehungsweise Reisen. „Zieh“ passt zur längeren Rückreise und zum würdevollen Erzählregister besser als das allgemeinere „geh“.
- source_word: εἰς γῆν Ἰσραήλ
  choice: in das Land Israel
  rationale: Die Formulierung bewahrt den territorialen Sinn von γῆ und gibt εἰς mit einer natürlichen deutschen Zielangabe wieder.
- source_word: τεθνήκασιν
  choice: sind tot
  rationale: Das Perfekt hebt den aus dem Sterben hervorgegangenen gegenwärtigen Zustand hervor; „sind tot“ bildet diesen Ergebniszustand prägnant ab.
- source_word: οἱ ζητοῦντες
  choice: die … trachteten
  rationale: In Verbindung mit ψυχή bezeichnet ζητεῖν nicht bloß eine Suche, sondern eine tödliche Absicht. Das Präteritum entspricht im Deutschen natürlich der inzwischen beendeten Bedrohung.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: dem Kind nach dem Leben
  rationale: Die feste deutsche Wendung „jemandem nach dem Leben trachten“ entspricht dem griechischen Idiom und macht deutlich, dass ψυχή hier das irdische Leben, nicht die immaterielle Seele, meint.
theological_decisions:
- issue: Wiedergabe von ψυχή im Zusammenhang einer tödlichen Bedrohung
  choice: Leben
  alternative: Seele
  rationale: Die Wendung ζητεῖν τὴν ψυχήν meint im narrativen Zusammenhang, jemanden töten zu wollen. „Seele“ würde eine hier nicht beabsichtigte anthropologische oder theologische Aussage nahelegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Erzählton. „Und sagte“ stellt den syntaktischen Anschluss an den vorigen Vers lesbar her; „zieh“ und „nach dem Leben trachten“ sind gehoben, aber weiterhin geläufig.
