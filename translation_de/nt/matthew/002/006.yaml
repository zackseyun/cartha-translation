id: MAT.2.6
reference: Matthew 2:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: de
  text: Und du, Bethlehem im Land Juda, bist keineswegs die Geringste unter den Herrschern Judas; denn aus dir wird ein Herrscher hervorgehen[a], der mein Volk Israel hüten wird[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „hinausgehen“ oder „hervorkommen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „weiden“. Das Hirtenbild kann zugleich königliches Regieren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ Ἰούδα
  choice: Land Juda
  rationale: γῆ bezeichnet hier in der Apposition zu Bethlehem das zu Juda gehörende Gebiet. „Land Juda“ ist würdevoll und wahrt die geografische Zuordnung.
- source_word: οὐδαμῶς ἐλαχίστη
  choice: keineswegs die unbedeutendste
  rationale: οὐδαμῶς verstärkt die Verneinung; ἐλαχίστη betrifft im Kontext eher Rang und Bedeutung als bloße räumliche Größe.
- source_word: ἐν τοῖς ἡγεμόσιν Ἰούδα
  choice: unter den führenden Städten Judas
  rationale: Wörtlich bezeichnet ἡγεμόσιν „Herrscher/Führende“. Da Bethlehem als Ort mit ihnen verglichen wird, liegt metonymisch ein Bezug auf die führenden Orte bzw. Sippen Judas nahe. Die Wiedergabe macht den Vergleich im Deutschen verständlich, ohne einen einzelnen politischen Amtstitel einzutragen.
- source_word: ἐξελεύσεται
  choice: wird hervorgehen
  rationale: Die Wiedergabe bewahrt die Ausgangsbewegung von ἐξέρχομαι und klingt im Deutschen in einer prophetischen Aussage natürlich.
- source_word: ἡγούμενος
  choice: ein Herrscher
  rationale: Das substantivierte Partizip bezeichnet jemanden, der führt oder regiert. „Herrscher“ bewahrt die königliche Dimension.
- source_word: ποιμανεῖ
  choice: wird wie ein Hirte führen
  rationale: ποιμαίνω bedeutet wörtlich „weiden/hüten“ und kann übertragen „regieren“ heißen. Die Formulierung erhält das Hirtenbild und ist zugleich im modernen Deutsch unmittelbar verständlich.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: mein Volk Israel
  rationale: Die natürliche deutsche Wortfolge bewahrt die appositionelle, bundesbezogene Bezeichnung ohne erläuternden Zusatz.
theological_decisions:
- issue: Königliche und pastorale Bedeutung des kommenden Führers
  choice: ἡγούμενος mit „Herrscher“ und ποιμανεῖ mit „wie ein Hirte führen“ wiedergeben
  alternative: Beide Ausdrücke ausschließlich politisch als „Führer“ und „regieren“ oder ausschließlich pastoral wiedergeben
  rationale: Der Vers verbindet Herrschaft mit dem Bild fürsorglicher Hirtenführung. Beide Dimensionen bleiben erhalten, statt die Spannung einseitig aufzulösen.
- issue: Deutung von ἡγεμόσιν im Vergleich mit Bethlehem
  choice: Metonymisch „führende Städte Judas“
  alternative: Formal „Herrscher Judas“ oder traditionsnah „Fürsten Judas“
  rationale: Der griechische Wortlaut spricht formal von Führenden/Herrschern, doch Bethlehem ist eine Stadt. Die metonymische Wiedergabe stellt einen verständlichen Vergleich zwischen Orten her; die formale Ausdrucksweise bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-prophetischem Klang. „Juda“ bezeichnet das Land, „Judas“ in „Städte Judas“ die Genitivbeziehung. Die ungewöhnliche griechische Metonymie bei ἡγεμόσιν wird für deutsche Leser moderat verdeutlicht.
