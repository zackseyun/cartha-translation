revisions:
- from: Und du, Bethlehem, Land Juda, bist keineswegs die unbedeutendste unter den führenden Städten Judas; denn aus dir wird ein Herrscher hervorgehen[a], der mein Volk Israel wie ein Hirte führen wird[b].
  to: Und du, Bethlehem im Land Juda, bist keineswegs die Geringste unter den Herrschern Judas; denn aus dir wird ein Herrscher hervorgehen[a], der mein Volk Israel hüten wird[b].
  rationale: Die Revision entfernt die nicht im griechischen Text ausgedrückte Deutung „Städte“ und wahrt damit die Formulierung ἡγεμόσιν („Herrscher“) samt ihrer zitathaften Spannung. Außerdem wird das Hirtenverb direkt mit „hüten“ wiedergegeben; seine weiterreichende Herrschaftskonnotation bleibt als Alternative erläutert. Die Fußnotenanker stehen jeweils unmittelbar bei dem Wort bzw. der Wendung, die sie erläutern.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:39:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von ἐξελεύσεται („wird hervorgehen“) und ἡγούμενος („ein Herrscher“) ist sachgerecht. Jedoch gibt „unter den führenden Städten Judas“ ἐν τοῖς ἡγεμόσιν Ἰούδα nicht hinreichend quellentreu wieder: ἡγεμόσιν bezeichnet im griechischen Wortlaut führende Personen/Herrscher, nicht Städte. Die Orts-Person-Spannung der Zitatform sollte nicht durch die zusätzliche Deutung „Städten“ aufgelöst werden. „Wie ein Hirte führen“ erläutert ποιμανεῖ zwar treffend, fügt aber einen expliziten Vergleich hinzu, den das Verb selbst nicht enthält.'
  naturalness: Die revidierte Formulierung bleibt modernes, gut verständliches Standarddeutsch. „Bethlehem im Land Juda“ ist als Anrede natürlich; „die Geringste unter den Herrschern Judas“ bewahrt bewusst die auffällige, aus dem Zitat stammende Bildfügung. „Mein Volk Israel hüten“ ist idiomatisch und bewahrt das pastorale Bild ohne zusätzliche Umschreibung.
  terminology: „Land Juda“, „Herrscher“ und „mein Volk Israel“ sind angemessen. Für ποιμανεῖ ist „hüten“ eine natürliche deutsche Entsprechung, die die Hirtenmetaphorik wahrt; die mögliche Herrschaftsbedeutung wird in der Fußnote benannt. „Geringste“ gibt ἐλαχίστη mit der im Kontext naheliegenden Rangnuance wieder, ohne sie auf bloße Größe zu beschränken.
  issues:
  - severity: medium
    issue: „führenden Städten Judas“ für ἐν τοῖς ἡγεμόσιν Ἰούδα
    rationale: „Städten“ steht nicht im griechischen Text und ersetzt die dortigen ἡγεμόνες („Herrscher/Führende“) durch eine interpretative Ortsbezeichnung. Dass Bethlehem als Ort mit Personen verglichen wird, ist eine zitathafte bzw. metonymische Spannung, die nicht durch eine nicht markierte Ergänzung geglättet werden sollte.
  - severity: low
    issue: „wie ein Hirte führen“ für ποιμανεῖ
    rationale: Die Umschreibung macht das Bild verständlich, fügt aber mit „wie“ einen Vergleich hinzu. „hüten“ gibt das pastorale Verb unmittelbar wieder und lässt dessen mögliche regierende Konnotation für die Fußnote.
  revised_text: Und du, Bethlehem im Land Juda, bist keineswegs die Geringste unter den Herrschern Judas; denn aus dir wird ein Herrscher hervorgehen[a], der mein Volk Israel hüten wird[b].
  revised_footnotes:
