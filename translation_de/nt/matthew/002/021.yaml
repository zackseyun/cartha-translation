  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: de
  text: Da stand er auf, nahm das Kind und seine Mutter mit und zog in das Land Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter und bezeichnet keinen starken Gegensatz. „Da“ verbindet die Handlung natürlich mit dem vorausgehenden göttlichen Auftrag.
- source_word: ἐγερθεὶς
  choice: stand er auf
  rationale: Das Aoristpartizip von ἐγείρω wird hier intransitiv und zeitlich vorgeordnet gebraucht. Die finite Formulierung ist im Deutschen natürlich und bewahrt die Handlungsfolge.
- source_word: παρέλαβε
  choice: nahm … mit
  rationale: παραλαμβάνω bedeutet hier, Personen zu sich zu nehmen und mitzunehmen. Die trennbare deutsche Wendung gibt diesen Begleitaspekt präziser wieder als bloßes „nahm“.
- source_word: τὸ παιδίον
  choice: das Kind
  rationale: παιδίον bezeichnet hier schlicht das Kind; eine zusätzliche Altersbestimmung wäre nicht erforderlich.
- source_word: τὴν μητέρα αὐτοῦ
  choice: seine Mutter
  rationale: Das Pronomen αὐτοῦ bezieht sich am natürlichsten auf das Kind. „Seine Mutter“ bildet die knappe griechische Konstruktion idiomatisch ab.
- source_word: εἰσῆλθεν
  choice: zog in
  rationale: εἰσέρχομαι bezeichnet das Hineingehen beziehungsweise Eintreten. Bei einer Reise in ein Land ist „zog in“ im Deutschen natürlich und wahrt die gerichtete Bewegung.
- source_word: εἰς γῆν Ἰσραήλ
  choice: in das Land Israel
  rationale: Die Wendung bezeichnet das geografisch-nationale Gebiet Israel. „Das Land Israel“ ist eine natürliche und quellennah formulierte deutsche Wiedergabe.
