  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: de
  text: 'Und er schickte sie nach Bethlehem und sagte: »Geht und forscht sorgfältig nach dem Kind. Wenn ihr es gefunden habt, berichtet mir, damit auch ich komme und mich vor ihm niederwerfe[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn anbeten« oder »ihm huldigen«. Das griechische Verb kann sowohl Anbetung als auch eine ehrerbietige Verneigung vor einer königlichen Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: er schickte sie … und sagte
  rationale: Das vorzeitige Aoristpartizip bezeichnet das Absenden, das dem Sagen vorausgeht. Die deutsche Koordination gibt die Abfolge natürlich wieder.
- source_word: Πορευθέντες
  choice: Geht
  rationale: Das Partizip ist eng mit dem folgenden Imperativ verbunden und wird im Deutschen idiomatisch als Aufforderung wiedergegeben.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: forscht sorgfältig
  rationale: Die Verbindung bezeichnet eine genaue, gewissenhafte Erkundigung oder Nachforschung. »Forscht sorgfältig« bewahrt diesen Nachdruck und passt zur Suche nach dem Aufenthaltsort.
- source_word: περὶ τοῦ παιδίου
  choice: nach dem Kind
  rationale: Bei einem Verb des Erkundigens gibt περί den Gegenstand der Nachforschung an; »nach dem Kind forschen« ist natürliches Deutsch.
- source_word: παιδίου
  choice: Kind
  rationale: παιδίον bezeichnet hier ein Kind, ohne dass das Wort allein eine genauere Altersangabe verlangt.
- source_word: ἐπὰν δὲ εὕρητε
  choice: Wenn ihr es gefunden habt
  rationale: ἐπάν mit dem Konjunktiv bezeichnet einen zukünftigen, erwarteten Fall. »Wenn« erhält die Bedingtheit, ohne das Auffinden als sicher vorauszusetzen.
- source_word: ἀπαγγείλατέ μοι
  choice: berichtet mir
  rationale: ἀπαγγέλλω meint, eine Nachricht beziehungsweise einen Bericht zu überbringen; »berichtet mir« bewahrt diese Nuance.
- source_word: ὅπως
  choice: damit
  rationale: ὅπως leitet hier den von Herodes behaupteten Zweck ein.
- source_word: κἀγὼ
  choice: auch ich
  rationale: Die Krasis aus καί und ἐγώ hebt Herodes’ angeblich gleichartige Absicht hervor.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: hingehen und mich vor ihm niederwerfen kann
  rationale: Das Partizip wird als koordinierte Handlung wiedergegeben. προσκυνέω bezeichnet ein Niederwerfen als Verehrungs- oder Huldigungsakt und kann je nach Kontext auch Anbetung meinen; die konkrete Körperhandlung wahrt hier die lexikalische Mehrdeutigkeit.
theological_decisions:
- issue: Bedeutung von προσκυνήσω gegenüber dem Kind Jesus
  choice: mich vor ihm niederwerfen
  alternative: ihn anbeten / ihm huldigen
  rationale: προσκυνέω kann sowohl Anbetung als auch ehrerbietige Huldigung vor einer königlichen Person bezeichnen. Die Übersetzung mit der körperlichen Handlung legt die Art der Verehrung nicht vorschnell fest; die möglichen Deutungen werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und bestimmt; die Mehrdeutigkeit von προσκυνέω wird im Haupttext durch die konkrete Handlung und in der Fußnote durch die Deutungsalternativen bewahrt.
