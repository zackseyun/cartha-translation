id: MAT.2.23
reference: Matthew 2:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: de
  text: 'Und er kam und ließ sich in einer Stadt namens Nazaret[a] nieder, damit sich erfüllte, was durch die Propheten gesagt worden war: »Er wird Nazarener genannt werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nazoräer«. Der genaue prophetische Hintergrund der Aussage »Er wird Nazarener genannt werden« ist umstritten. Matthäus fasst möglicherweise Aussagen oder Themen mehrerer Propheten zusammen, statt eine einzelne Stelle wörtlich zu zitieren.'
    reason: Lexikalische Alternative und Wahrung der Unsicherheit über den prophetischen Bezug.
lexical_decisions:
- source_word: ἐλθὼν
  choice: er kam
  rationale: Das vorzeitige Aoristpartizip wird im Deutschen natürlich als koordinierte finite Verbform wiedergegeben und wahrt die Handlungsfolge.
- source_word: κατῴκησεν
  choice: ließ sich … nieder
  rationale: κατοικέω bezeichnet hier die Aufnahme eines Wohnsitzes. Die Wendung ist in modernem Deutsch natürlich und gibt den Ortswechsel deutlicher wieder als das allgemeinere »wohnte«.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: in einer Stadt namens Nazaret
  rationale: Bei einem Verb des Wohnens beziehungsweise der Niederlassung wird εἰς im Deutschen idiomatisch mit »in« wiedergegeben. πόλις wird formal als »Stadt« übersetzt.
- source_word: ὅπως πληρωθῇ
  choice: So sollte sich erfüllen
  rationale: Die deutsche Erfüllungsformel gibt Ziel beziehungsweise Ergebnis des griechischen ὅπως mit Konjunktiv wieder, ohne zwischen diesen Nuancen unnötig festzulegen.
- source_word: τὸ ῥηθὲν
  choice: was … gesagt worden war
  rationale: Das substantivierte Passivpartizip wird idiomatisch als Relativsatz wiedergegeben; das Plusquamperfekt verdeutlicht, dass die prophetische Aussage vorausging.
- source_word: διὰ τῶν προφητῶν
  choice: durch die Propheten
  rationale: Die Präposition διά mit Genitiv bezeichnet Vermittlung und wird mit »durch« formal und natürlich bewahrt.
- source_word: Ναζωραῖος
  choice: Nazoräer
  rationale: »Nazoräer« bildet die griechische Form Ναζωραῖος ab und hält sie vom deutschen »Nasiräer« für eine Person unter einem Nasiräergelübde auseinander. Die vertrautere Form »Nazarener« wird in der Fußnote genannt.
- source_word: κληθήσεται
  choice: wird … genannt werden
  rationale: Die futurische Passivform von καλέω wird in ihrer prophetischen Aussageform direkt bewahrt.
theological_decisions:
- issue: Art des Erfüllungszitats ohne genau entsprechende Einzelstelle im Alten Testament
  choice: Die Formel wird als Aussage dessen wiedergegeben, was »durch die Propheten« im Plural gesagt wurde, ohne im Haupttext eine bestimmte Schriftstelle zu identifizieren.
  alternative: Mögliche Bezüge sind Jesaja 11,1, eine prophetische Motivzusammenfassung über die Niedrigkeit oder Verachtung des Messias oder andere Wortanklänge.
  rationale: Der griechische Plural τῶν προφητῶν legt ein zusammenfassendes oder thematisches Zeugnis nahe. Eine eindeutige Identifizierung würde eine umstrittene Auslegung in den Text eintragen.
- issue: Bedeutung von Ναζωραῖος
  choice: Nazoräer als Bezeichnung mit Bezug zu Nazaret
  alternative: 'Nazarener; nicht: Nasiräer'
  rationale: Im unmittelbaren Zusammenhang erklärt der Wohnort Nazaret die Bezeichnung. Eine Wiedergabe als »Nasiräer« würde den sprachlich verschiedenen Begriff für ein Nasiräergelübde eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ließ sich nieder« ist gut verständlich und gibt die Aufnahme eines Wohnsitzes wieder. »Nazoräer« wahrt die besondere griechische Bezeichnung; die geläufigere Alternative und die offene Frage des prophetischen Hintergrunds stehen in der Fußnote.
