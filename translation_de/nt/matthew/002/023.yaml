  naturalness: „Und er kam und ließ sich … nieder“ ist verständlich und angemessen. Für modernes Standarddeutsch ist „damit sich erfüllte“ in diesem formelhaften Kontext idiomatischer als „So sollte sich erfüllen“. „Nazarener“ ist die geläufigere deutsche Ortsbezeichnung; „Nazoräer“ kann als formnähere Alternative in der Fußnote stehen.
  terminology: Die Wiedergabe „Nazarener“ bezeichnet hier, durch den unmittelbaren Bezug auf Nazaret, einen Einwohner bzw. eine mit Nazaret verbundene Person und ist nicht mit „Nasiräer“ zu verwechseln. Die Fußnote bewahrt mit „Nazoräer“ die formnähere Alternative und hält den umstrittenen prophetischen Hintergrund offen.
