  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: de
  text: Da erfüllte sich, was durch den Propheten Jeremia gesagt worden war:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Da wurde erfüllt, was durch den Propheten Jeremia gesagt worden war, der sagte:“'
    reason: Bewahrt für die Nachprüfung die passive Form und den ausdrücklich vorhandenen Partizipialanschluss λέγοντος, die im flüssigen Haupttext durch „erfüllte sich“ und den Doppelpunkt wiedergegeben werden.
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Markiert knapp und natürlich die zeitliche Folge innerhalb der Erzählung.
- source_word: ἐπληρώθη
  choice: erfüllte sich
  rationale: Die im Deutschen übliche Wiedergabe der passiven Erfüllungsformel bewahrt ausdrücklich Matthäus’ Motiv der prophetischen Erfüllung.
- source_word: τὸ ῥηθὲν
  choice: was … gesagt worden war
  rationale: Gibt das substantivierte Partizip idiomatisch wieder; das Plusquamperfekt macht deutlich, dass das prophetische Wort zuvor gesprochen worden war.
- source_word: διὰ Ἰερεμίου
  choice: durch … Jeremia
  rationale: Bewahrt διά mit Genitiv als Kennzeichnung der Vermittlung beziehungsweise mittelbaren Urheberschaft.
- source_word: τοῦ προφήτου
  choice: den Propheten
  rationale: Gibt die Apposition zu Jeremia direkt und natürlich wieder.
- source_word: λέγοντος
  choice: Doppelpunkt zur Einführung des Zitats
  rationale: Das Partizip führt den folgenden Wortlaut ein. Ein zusätzlicher Ausdruck wie „der sagte“ wäre im Deutschen nach „gesagt worden war“ schwerfällig; der Doppelpunkt erfüllt die gleiche Textfunktion.
theological_decisions:
- issue: Matthäus’ Erfüllungsformel
  choice: „erfüllte sich“
  alternative: „geschah, damit sich erfüllte“
  rationale: Der griechische Text behauptet hier unmittelbar die Erfüllung des prophetisch Gesagten; er enthält keinen Zwecksatz. Die Übersetzung erhält diese theologisch-literarische Aussage ohne Erweiterung.
- issue: Träger des Redens in λέγοντος
  choice: Das folgende Zitat wird typografisch an das durch Jeremia Gesagte angeschlossen.
  alternative: „wobei er sagte“ oder „das lautet“
  rationale: Formal kann das Genitivpartizip an Jeremia beziehungsweise an die gesamte Wortgruppe anschließen. Die deutsche Fassung vermeidet eine unnötige Festlegung und zugleich die missverständliche Vorstellung, das Erfüllen selbst rede.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die Formulierung ist für eine öffentliche Bibelausgabe natürlich und würdig; „Da“ hält den knappen Erzählfluss aufrecht. Der Fußnotenmarker steht unmittelbar am Zitateinleitungspunkt.
