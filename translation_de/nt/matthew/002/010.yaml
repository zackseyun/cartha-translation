  text: ἰδόντες δὲ τὸν ἀστέρα ἐχάρησαν χαρὰν μεγάλην σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: de
  text: Als sie den Stern sahen, freuten sie sich mit überaus großer Freude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie freuten sich mit großer Freude überaus“; die griechische Formulierung ist besonders nachdrücklich.'
    reason: Die Fußnote erläutert die im Deutschen bewusst beibehaltene, im Griechischen noch stärker ausgeprägte Verbindung von „freuen“ und „Freude“ sowie die zusätzliche Verstärkung.
lexical_decisions:
- source_word: ἰδόντες
  choice: Als sie … sahen
  rationale: Der Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben und bezeichnet den Anlass beziehungsweise die zeitliche Voraussetzung der Freude.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ ist hier ein schwaches narratives Bindewort. Im Deutschen wird der Fortgang des Berichts bereits durch den einleitenden Temporalsatz natürlich vermittelt; ein ausdrückliches „und“ wäre schwerfällig.
- source_word: τὸν ἀστέρα
  choice: den Stern
  rationale: Der bestimmte Artikel verweist auf den bereits zuvor genannten Stern.
- source_word: ἐχάρησαν χαρὰν μεγάλην σφόδρα
  choice: freuten sie sich über alle Maßen
  rationale: Die Verbindung aus χαίρω, dem verwandten Akkusativ χαράν, μεγάλην und dem verstärkenden σφόδρα ist stark emphatisch. Die deutsche Wendung gibt die außergewöhnliche Intensität idiomatisch wieder, ohne die griechische Wortfigur unnatürlich nachzuahmen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Über alle Maßen“ bewahrt die starke Emphase des Ausgangstextes, ohne altertümlich oder sperrig zu wirken.
