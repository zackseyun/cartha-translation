  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: de
  text: Als König Herodes das hörte, geriet er in Unruhe, und ganz Jerusalem mit ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ganz Jerusalem“ steht für die Bewohner der Stadt; die Formulierung kann verallgemeinernd oder übertreibend gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: Als … das hörte
  rationale: Das Aoristpartizip hat hier temporale Funktion; die deutsche Nebensatzkonstruktion gibt dies natürlich wieder. „Das“ nimmt den unmittelbar vorausgehenden Bericht der Sterndeuter auf. δέ wirkt als leichter Übergang und benötigt keine gesonderte Wiedergabe.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: König Herodes
  rationale: Die im modernen Deutschen natürliche Titelform bewahrt sowohl βασιλεύς als auch den Eigennamen.
- source_word: ἐταράχθη
  choice: erschrak
  rationale: Das Verb bezeichnet hier eine starke innere Beunruhigung oder Bestürzung. „Erschrak“ ist prägnant und idiomatisch, ohne die Ursache oder Tragweite näher auszudeuten.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: ganz Jerusalem
  rationale: Die Formulierung bewahrt die Metonymie des griechischen Textes, in der der Stadtname für ihre Bewohner steht, und lässt den möglicherweise verallgemeinernden oder hyperbolischen Umfang offen.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: Dies ist die direkte und natürliche Wiedergabe von μετά mit Genitiv und verbindet Jerusalems Erschrecken mit dem des Herodes.
theological_decisions:
- issue: Umfang von πᾶσα Ἱεροσόλυμα
  choice: Die Stadt wird als Ganzes genannt; gemeint sind metonymisch ihre Bewohner.
  alternative: Die Aussage könnte verallgemeinernd oder hyperbolisch viele Einwohner meinen oder besonders die Führungskreise Jerusalems im Blick haben.
  rationale: Der Haupttext übernimmt die umfassende Ausdrucksweise des Griechischen und engt sie weder auf bestimmte Gruppen ein noch erklärt er sie als ausnahmslos jeden einzelnen Einwohner betreffend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist idiomatisch; die knappe Parallelführung des griechischen Satzes bleibt erhalten. „Erschrak“ vermeidet das im heutigen Deutsch teils schwächere „war beunruhigt“.
