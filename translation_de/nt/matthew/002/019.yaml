source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: de
  text: Als Herodes aber gestorben war, siehe, da erscheint dem Josef in Ägypten im Traum ein Engel des Herrn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Engel des Herrn“. Im Griechischen steht vor „Engel“ kein Artikel.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος ... τοῦ Ἡρῴδου
  choice: Als Herodes ... gestorben war
  rationale: Der Genitivus absolutus mit Aoristpartizip bezeichnet hier einen zeitlich vorausgehenden Umstand; das deutsche Plusquamperfekt gibt diese Abfolge natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Übergang und zugleich einen leichten Gegensatz zur vorherigen Lage.
- source_word: ἰδοὺ
  choice: siehe, da
  rationale: Bewahrt den lebhaften erzählerischen Aufmerksamkeitsruf; „da“ leitet zugleich das plötzlich eintretende Geschehen idiomatisch ein.
- source_word: ἄγγελος κυρίου
  choice: ein Engel des Herrn
  rationale: Vor ἄγγελος steht kein Artikel; daher ist die unbestimmte Form die naheliegende Wiedergabe. κυρίου wird in der festen Gottesbezeichnung mit „des Herrn“ übersetzt.
- source_word: φαίνεται
  choice: erscheint
  rationale: Das historische Präsens des griechischen Erzählstils bleibt erhalten und vergegenwärtigt das Geschehen.
- source_word: κατ’ ὄναρ
  choice: im Traum
  rationale: Natürliche deutsche Wiedergabe der matthäischen Wendung für eine Offenbarung im Traum.
- source_word: τῷ Ἰωσὴφ
  choice: Josef
  rationale: Der Dativ bezeichnet die Person, der der Engel erscheint; die deutsche Satzstellung macht diese Beziehung deutlich.
- source_word: ἐν Αἰγύπτῳ
  choice: in Ägypten
  rationale: Lokalangabe zum Aufenthaltsort Josefs.
theological_decisions:
- issue: Wiedergabe von κύριος in ἄγγελος κυρίου
  choice: des Herrn
  alternative: des Gebieters
  rationale: „Herr“ ist in diesem biblischen Gottesbezug die natürliche und traditionsübergreifend verständliche Wiedergabe, ohne die Identität des Engels weiter zu bestimmen.
- issue: Artikel bei ἄγγελος
  choice: ein Engel des Herrn
  alternative: der Engel des Herrn
  rationale: Da ἄγγελος im griechischen Text ohne Artikel steht, verwendet der Haupttext die unbestimmte Form. Die bestimmte Form bleibt als mögliche kontextuelle Wiedergabe in der Fußnote erhalten, ohne ihre theologischen Assoziationen in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Erzählregister. „Siehe, da“ bewahrt die markante narrative Lebendigkeit von ἰδού und fügt sich in einen gehobenen, dennoch allgemein verständlichen Bibelstil ein.
