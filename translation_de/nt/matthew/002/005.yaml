  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: de
  text: 'Sie aber sagten ihm: „In Bethlehem in Judäa; denn so steht durch den Propheten geschrieben[a]:“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „denn so ist durch den Propheten geschrieben worden“. Das griechische Perfekt Passiv ist eine feste Formel zur Anführung der Schrift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sie aber
  rationale: Der substantivisch gebrauchte Artikel verweist auf die führenden Priester und Schriftgelehrten aus dem vorherigen Vers; δέ wird als leichter fortführender beziehungsweise absetzender Anschluss mit „aber“ wiedergegeben.
- source_word: εἶπαν αὐτῷ
  choice: sagten ihm
  rationale: Die einfache Redeformel mit Dativ wird unmittelbar und natürlich wiedergegeben.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: In Bethlehem in Judäa
  rationale: Der Genitiv grenzt dieses Bethlehem geografisch ein. Im Deutschen ist „Bethlehem in Judäa“ natürlicher und ebenso eindeutig wie das formalere „Bethlehem von Judäa“.
- source_word: οὕτως γὰρ
  choice: denn so
  rationale: γάρ begründet die Antwort, während οὕτως vorausweisend die folgende Schriftstelle ankündigt.
- source_word: γέγραπται
  choice: steht … geschrieben
  rationale: 'Diese idiomatische deutsche Schriftzitationsformel gibt den resultativen Sinn des griechischen Perfekt Passiv wieder: Was geschrieben wurde, gilt als schriftlich feststehend.'
- source_word: διὰ τοῦ προφήτου
  choice: durch den Propheten
  rationale: διά mit Genitiv bezeichnet hier die vermittelnde Instanz; „durch“ bewahrt diese Nuance genauer als „von“.
theological_decisions:
- issue: Vermittlung prophetischer Rede
  choice: durch den Propheten
  alternative: von dem Propheten
  rationale: Die Formulierung hält offen beziehungsweise deutet nicht weiter aus, wer als letzter Urheber der Schriftrede gedacht ist, und bildet zugleich den Propheten als Vermittler gemäß διά mit Genitiv ab.
- issue: Geltung des Geschriebenen
  choice: steht geschrieben
  alternative: ist geschrieben worden
  rationale: Die geläufige deutsche Zitationsformel bewahrt den bleibenden Resultatszustand des Perfekts, ohne daraus eine zusätzliche Lehraussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt wahrt den vorausweisenden Charakter zur folgenden prophetischen Anführung; das Semikolon markiert die deutliche Pause nach der Ortsangabe, ohne die Begründung aus derselben Rede herauszulösen.
