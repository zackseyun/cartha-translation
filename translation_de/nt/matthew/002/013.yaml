id: MAT.2.13
reference: Matthew 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: de
  text: 'Nachdem sie fortgezogen waren, erschien Josef im Traum da ein Engel des Herrn[a] und sagte: »Steh auf, nimm das Kind und seine Mutter mit und flieh nach Ägypten! Bleib dort, bis ich es dir sage. Denn Herodes ist im Begriff[b], nach dem Kind zu suchen, um es zu vernichten[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „der Engel des Herrn“. Im Griechischen fehlt der Artikel; die Formulierung kann jedoch als bekannte biblische Wendung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Griechisch: „ist im Begriff zu suchen“; damit wird eine unmittelbar bevorstehende Absicht ausgedrückt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu töten“. Wörtlich steht „zu vernichten“; hier ist damit gemeint, den Tod des Kindes herbeizuführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Nachdem sie fortgezogen waren
  rationale: Der Genitivus absolutus bezeichnet eine vorausgehende Handlung. „Fortgezogen“ gibt das Verlassen des Ortes natürlich wieder; „sie“ bezieht sich im Zusammenhang auf die zuvor genannten Sterndeuter.
- source_word: ἰδοὺ
  choice: in der natürlichen deutschen Erzählfolge nicht eigens ausgedrückt
  rationale: ἰδού lenkt die Aufmerksamkeit auf das nun eintretende Geschehen. Ein wörtliches „siehe“ klänge im heutigen Deutsch unnötig altertümlich; der unmittelbare Übergang zu „erschien“ bewahrt die narrative Hervorhebung.
- source_word: ἄγγελος κυρίου
  choice: ein Engel des Herrn
  rationale: Die artikellose griechische Wortgruppe wird am natürlichsten unbestimmt wiedergegeben. „Herr“ wahrt den biblischen Gottesbezug von κύριος, ohne die Identität des Engels enger festzulegen.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: erschien Josef im Traum
  rationale: Das historische Präsens φαίνεται wird in natürlichem deutschem Erzählstil als Vergangenheit wiedergegeben. κατ’ ὄναρ ist die feste Wendung „im Traum“.
- source_word: Ἐγερθεὶς παράλαβε
  choice: Steh auf, nimm … mit
  rationale: Das Partizip Ἐγερθεὶς gehört funktional zur Befehlsfolge. „Mitnehmen“ bringt bei παραλαμβάνω den Gedanken des Begleitens im Deutschen präzise zum Ausdruck.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: das Kind und seine Mutter
  rationale: Die Formulierung folgt der griechischen Bezugsetzung und nennt Maria bewusst über ihre Beziehung zum Kind.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: flieh nach Ägypten
  rationale: „Flieh“ bewahrt die Dringlichkeit und Gefahr, die φεύγω in diesem Zusammenhang ausdrückt.
- source_word: ἴσθι ἐκεῖ
  choice: Bleib dort
  rationale: Wörtlich steht „sei dort“; im Zusammenhang ist fortdauernder Aufenthalt gemeint, den „Bleib dort“ idiomatisch wiedergibt.
- source_word: ἕως ἂν εἴπω σοι
  choice: bis ich es dir sage
  rationale: Die Konstruktion bezeichnet einen noch unbestimmten zukünftigen Endpunkt. Das ergänzte „es“ ist im Deutschen idiomatisch und verweist auf die künftige Anweisung.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: Denn Herodes ist im Begriff, nach … zu suchen
  rationale: μέλλω mit Infinitiv bezeichnet hier eine unmittelbar bevorstehende Handlung beziehungsweise Absicht. „Ist im Begriff“ erhält diese zeitliche Nähe deutlicher als ein bloßes Futur.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: um es zu vernichten
  rationale: Der Genitiv mit Artikel und Infinitiv bezeichnet den Zweck. ἀπόλλυμι bedeutet „vernichten, zugrunde richten“ und meint hier konkret die Tötung des Kindes.
theological_decisions:
- issue: Bestimmtheit und mögliche feste Prägung von ἄγγελος κυρίου
  choice: ein Engel des Herrn
  alternative: der Engel des Herrn
  rationale: Da ἄγγελος ohne Artikel steht, ist die unbestimmte Wiedergabe grammatisch naheliegend. Die bekannte biblische Wendung kann jedoch dazu führen, dass die Gestalt als „der Engel des Herrn“ verstanden wird; diese Möglichkeit wird in einer Fußnote offengehalten.
- issue: Bedeutungsweite von ἀπόλλυμι für Herodes’ Vorhaben
  choice: vernichten
  alternative: töten
  rationale: „Vernichten“ entspricht der Grundbedeutung und bewahrt die Wortwahl des Ausgangstextes; im konkreten Zusammenhang ist eindeutig das Töten des Kindes beabsichtigt, was die Fußnote erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Imperative erhalten die Dringlichkeit der Warnung. Archaische Aufmerksamkeitspartikeln wie „siehe“ wurden vermieden; die Satzfolge trägt die narrative Hervorhebung.
