  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: de
  text: Da stand er auf, nahm das Kind und seine Mutter bei Nacht mit und brach nach Ägypten auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Da
  rationale: Die schwache narrative Verknüpfung führt die Handlung als Reaktion auf den vorausgehenden Befehl fort; „Da“ klingt im Deutschen natürlich, ohne eine stärkere Folgerung auszudrücken.
- source_word: ἐγερθεὶς
  choice: stand er auf
  rationale: Das Aoristpartizip bezeichnet die der Haupthandlung vorausgehende Handlung. Die finite Wiedergabe ist im modernen Deutschen klar und bewahrt die Erzählfolge.
- source_word: παρέλαβε
  choice: nahm … mit
  rationale: παραλαμβάνω bedeutet hier, Personen mit sich zu nehmen. Das trennbare Verb „mitnehmen“ gibt diese Bedeutung präzise und idiomatisch wieder.
- source_word: τὸ παιδίον
  choice: das Kind
  rationale: Die schlichte Bezeichnung entspricht παιδίον, ohne ein bestimmtes Alter stärker hervorzuheben, als es der Kontext verlangt.
- source_word: τὴν μητέρα αὐτοῦ
  choice: seine Mutter
  rationale: Das Pronomen bezieht sich grammatisch und sachlich auf das Kind. Die deutsche Formulierung bewahrt die griechische Perspektive.
- source_word: νυκτὸς
  choice: noch in der Nacht
  rationale: Der temporale Genitiv bezeichnet die nächtliche Zeit der Handlung. „Noch in der Nacht“ ist natürliches Deutsch und lässt im Kontext die unverzügliche Ausführung erkennen.
- source_word: ἀνεχώρησεν
  choice: zog
  rationale: ἀναχωρέω bezeichnet hier das Weggehen an einen anderen Ort. „zog nach Ägypten“ ist eine natürliche deutsche Wendung für den zielgerichteten Ortswechsel, ohne das Gefahrenmotiv zusätzlich auszudeuten.
- source_word: εἰς Αἴγυπτον
  choice: nach Ägypten
  rationale: εἰς kennzeichnet das Ziel der Bewegung; bei Ländernamen ohne Artikel ist „nach“ die idiomatische deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. Die Satzfolge bleibt knapp und handlungsorientiert; „das Kind und seine Mutter“ bewahrt die auffällige Reihenfolge und christologische Perspektive des griechischen Textes.
