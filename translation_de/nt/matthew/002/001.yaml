id: MAT.2.1
reference: Matthew 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: de
  text: Nachdem Jesus in Bethlehem in Judäa zur Zeit des Königs Herodes geboren worden war, siehe, da kamen Sterndeuter[a] aus dem Osten nach Jerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Magier. Das griechische Wort bezeichnet gelehrte Männer aus dem Osten, die vermutlich mit Astrologie oder höfischer Weisheit verbunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Nachdem Jesus … geboren worden war
  rationale: Der Genitivus absolutus nennt den zeitlichen Hintergrund, der der Haupthandlung vorausgeht. Das Plusquamperfekt gibt dieses Verhältnis im Deutschen klar und natürlich wieder; δέ wirkt hier nur als leichter erzählerischer Übergang und verlangt kein eigenständiges „nun“.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Bethlehem in Judäa
  rationale: Die Ortsangabe unterscheidet dieses Bethlehem von gleichnamigen Orten. „In Judäa“ ist im heutigen Deutsch natürlicher als „von Judäa“.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: zur Zeit des Königs Herodes
  rationale: Die idiomatische deutsche Wendung bewahrt die historische Einordnung und gibt Titel sowie Namen klar wieder.
- source_word: ἰδοὺ
  choice: siehe, da
  rationale: ἰδού lenkt auffällig die Aufmerksamkeit auf das überraschende Eintreffen der Besucher. „Siehe, da“ erhält diese markierte Erzählfunktion in würdigem, verständlichem Deutsch.
- source_word: μάγοι
  choice: Sterndeuter
  rationale: Der Ausdruck bezeichnet hier gelehrte Männer aus dem Osten, die mit Astrologie beziehungsweise höfischer Weisheit verbunden waren. „Sterndeuter“ ist verständlich und vermeidet die späteren, im Text nicht genannten Vorstellungen von Königen oder einer bestimmten Anzahl.
- source_word: ἀπὸ ἀνατολῶν
  choice: aus dem Osten
  rationale: Der griechische Plural bezeichnet östliche Gegenden; die kollektive Singularform ist im Deutschen idiomatisch.
- source_word: παρεγένοντο
  choice: kamen
  rationale: Das Verb beschreibt das Eintreffen am genannten Ziel. Zusammen mit „nach Jerusalem“ ist „kamen“ natürlich und präzise.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: εἰς bezeichnet die Bewegungsrichtung auf das Ziel hin; bei Städtenamen lautet die natürliche deutsche Fügung „nach Jerusalem“.
theological_decisions:
- issue: Wiedergabe von μάγοι ohne Übernahme späterer Traditionen
  choice: Sterndeuter
  alternative: Magier; Weise
  rationale: „Sterndeuter“ beschreibt die im antiken Kontext naheliegende Rolle, ohne sie zu Königen zu machen oder ihre Anzahl festzulegen. „Magier“ ist formnäher, kann heute jedoch irreführend an Zauberkünstler denken lassen; „Weise“ ist allgemeiner und verschleiert den astrologischen Hintergrund.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe, da“ ist bewusst markierter als gewöhnliche Alltagssprache, um die aufmerksamkeitslenkende Funktion von ἰδού zu erhalten. Der abschließende Beistrich zeigt, dass der Satz im folgenden Vers weitergeführt wird.
