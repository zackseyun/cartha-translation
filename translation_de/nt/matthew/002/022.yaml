  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: de
  text: Als er aber hörte, dass Archelaus anstelle seines Vaters Herodes über Judäa regierte, fürchtete er sich, dorthin zu gehen. Nachdem er jedoch im Traum gewarnt worden war[a], zog er sich in die Gegenden Galiläas zurück,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann auch im Sinn von »göttliche Weisung empfangen« verstanden werden; wer die Warnung gibt, bleibt im griechischen Text ungenannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: Als er aber hörte
  rationale: Das Aoristpartizip bezeichnet den vorausgehenden zeitlichen Umstand; »als er … hörte« ist natürliches Deutsch. »Aber« markiert den Gegensatz zu der zuvor beabsichtigten Rückkehr.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: über Judäa regierte
  rationale: βασιλεύω mit Genitiv bezeichnet die Herrschaft über ein Gebiet. »Regierte über« bewahrt den Herrschaftssinn, ohne Archelaus ausdrücklich einen im Deutschen möglicherweise missverständlichen Königstitel beizulegen.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: anstelle seines Vaters Herodes
  rationale: ἀντί bezeichnet hier Nachfolge beziehungsweise Ersatz; »anstelle« gibt dies knapp und quellennah wieder.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: fürchtete er sich, dorthin zu gehen
  rationale: Die idiomatische deutsche Konstruktion gibt sowohl die Furcht als auch das auf das Ziel bezogene ἐκεῖ wieder.
- source_word: χρηματισθεὶς
  choice: Nachdem er jedoch … gewarnt worden war
  rationale: Das passive Partizip bezeichnet eine empfangene Warnung oder Weisung. Die passive Form lässt wie der griechische Text den Urheber unausgesprochen.
- source_word: κατ’ ὄναρ
  choice: in einem Traum
  rationale: Dies ist die natürliche deutsche Wiedergabe der bei Matthäus üblichen Wendung für eine im Traum empfangene Mitteilung.
- source_word: ἀνεχώρησεν
  choice: zog er sich … zurück
  rationale: Die Formulierung bewahrt den Gedanken eines gezielten Weggehens als Reaktion auf Gefahr oder veränderte Umstände.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: in die Gebiete Galiläas
  rationale: Der Plural μέρη wird mit »Gebiete« sichtbar gehalten und bezeichnet die Gegenden beziehungsweise Landesteile Galiläas.
theological_decisions:
- issue: Soll der göttliche Urheber der Warnung in χρηματισθείς ausdrücklich genannt werden?
  choice: 'Der Haupttext lässt den Urheber ungenannt: »gewarnt worden war«.'
  alternative: »von Gott gewarnt worden war« oder »göttliche Weisung empfangen hatte«
  rationale: Der Gebrauch des Verbs bei Matthäus legt eine göttliche Mitteilung nahe, doch im griechischen Satz wird der Handelnde nicht genannt. Die passive Form bewahrt diese Zurückhaltung und vermeidet eine erklärende Ergänzung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt gut verständlich, während die zeitlichen Partizipien, der Gegensatz und die passive Form der Warnung sinngenau wiedergegeben werden. Das abschließende Komma wahrt den vom Nutzer vorgelegten fortlaufenden Versanschluss.
