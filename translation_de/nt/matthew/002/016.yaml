id: MAT.2.16
reference: Matthew 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: de
  text: Als Herodes merkte, dass die Magier[b] ihn getäuscht hatten,[a] wurde er sehr zornig. Er schickte Männer aus und ließ alle Jungen in Betlehem und der ganzen Umgebung töten, die zwei Jahre alt oder jünger waren. Dabei richtete er sich nach dem Zeitpunkt, den er von den Magiern genau erfragt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort kann auch bedeuten: „dass er von den Magiern verspottet oder zum Narren gehalten worden war“.'
    reason: lexical_alternative
  - marker: b
    text: Magier waren östliche Gelehrte und Sterndeuter; traditionell werden sie „Weise“ genannt.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Als
  rationale: Der zeitliche Anschluss wird zusammen mit dem Partizip ἰδών in einem natürlichen deutschen Temporalsatz wiedergegeben.
- source_word: ἰδὼν ὅτι
  choice: merkte, dass
  rationale: Gibt Herodes’ Wahrnehmung idiomatisch wieder, ohne zusätzliche Gewissheit oder Einsicht einzutragen.
- source_word: ἐνεπαίχθη
  choice: ihn getäuscht hatten
  rationale: Im Kontext hatten die Magier Herodes ins Leere laufen lassen; die mögliche Bedeutung „verspottet“ bleibt in der Fußnote sichtbar.
- source_word: τῶν μάγων
  choice: die Magier
  rationale: Bewahrt die historische Bezeichnung für östliche Gelehrte beziehungsweise Astrologen und vermeidet die traditionsbedingte Verengung auf „Weise“.
- source_word: ἐθυμώθη λίαν
  choice: wurde sehr zornig
  rationale: Bildet sowohl das Einsetzen des Zorns als auch die Verstärkung durch λίαν klar und würdig ab.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: Er schickte Männer aus und ließ … töten
  rationale: Macht die ausgesandten Vollstrecker als kontextuell vorausgesetzte Handelnde deutlich; „ließ töten“ zeigt zugleich, dass Herodes die Tötung anordnete, ohne eigenhändige Ausführung zu behaupten.
- source_word: πάντας τοὺς παῖδας
  choice: alle Jungen
  rationale: Der Kontext bezeichnet männliche Kinder; „Jungen“ ist im modernen Deutsch direkt und eindeutig.
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: in der ganzen Umgebung
  rationale: ὅρια bezeichnet hier das umliegende Gebiet Betlehems, nicht nur eine Grenzlinie.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: die zwei Jahre alt oder jünger waren
  rationale: Gibt die inklusive Altersobergrenze in natürlichem Deutsch präzise wieder.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: Dabei richtete er sich nach dem Zeitpunkt, den er von den Magiern genau erfragt hatte
  rationale: κατά bezeichnet die Maßgabe; ἀκριβόω drückt ein genaues Ermitteln aus, das nach Matthäus 2,7 durch Befragung geschah.
theological_decisions:
- issue: Wiedergabe von μάγοι
  choice: Magier
  alternative: Weise / Sterndeuter
  rationale: „Magier“ bleibt dem griechischen Kulturbegriff am nächsten, ohne spätere traditionelle Vorstellungen einzutragen; eine kurze Erklärung steht in der Fußnote.
- issue: Wiedergabe von ἐνεπαίχθη
  choice: getäuscht
  alternative: verspottet / zum Narren gehalten
  rationale: „Getäuscht“ vermittelt die kontextuelle Wirkung ihres Ausbleibens. Da das Verb auch Verspottung ausdrücken kann, wird diese echte Bedeutungsnuance in der Fußnote bewahrt.
- issue: Handlungsträgerschaft bei ἀποστείλας ἀνεῖλεν
  choice: schickte Männer aus und ließ … töten
  alternative: sandte aus und tötete
  rationale: Die deutsche Kausativform wahrt Herodes’ Verantwortung und macht zugleich die durch ἀποστείλας angezeigte Ausführung durch ausgesandte Personen verständlich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die langen griechischen Satzglieder sind zur besseren Lesbarkeit auf drei Sätze verteilt. Beide Fußnotenmarker stehen an inhaltlich passenden Stellen im Haupttext.
