  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: de
  text: Als Jesus diese Gleichnisse beendet hatte, zog er von dort weiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Als
  rationale: Die Wendung dient hier als erzählerischer Übergang mit zeitlicher Verknüpfung. Das deutsche „Als“ gibt diese Funktion natürlich wieder, ohne das semitisch geprägte Idiom unnötig wörtlich als „Und es geschah, als“ abzubilden.
- source_word: ἐτέλεσεν
  choice: beendet hatte
  rationale: τελέω bezeichnet hier das Zu-Ende-Bringen. Das Plusquamperfekt verdeutlicht im Deutschen, dass Jesus die Gleichnisse abschloss, bevor er weiterzog.
- source_word: τὰς παραβολὰς ταύτας
  choice: diese Gleichnisse
  rationale: „Gleichnisse“ ist die etablierte und sachgerechte Wiedergabe von παραβολαί in diesem Lehrzusammenhang; „diese“ verweist auf die unmittelbar vorausgehende Gleichnisrede.
- source_word: μετῆρεν
  choice: zog … weiter
  rationale: μεταίρω bezeichnet das Fortgehen beziehungsweise den Ortswechsel. „zog … weiter“ ist im modernen deutschen Erzählstil natürlich und bewahrt den Gedanken, dass Jesus den bisherigen Ort verließ.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Die Ortsangabe wird knapp und unmittelbar wiedergegeben.
theological_decisions: []
