id: MAT.13.40
reference: Matthew 13:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: de
  text: Wie nun das Unkraut[a] gesammelt und im Feuer verbrannt wird, so wird es am Ende des Zeitalters[b] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet schädliches Unkraut, wahrscheinlich Taumel-Lolch.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: „am Ende der Welt“; wörtlich: „des Zeitalters“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Wie nun
  rationale: ὥσπερ leitet den Vergleich ein, während οὖν an die vorausgehende Deutung anknüpft. „Wie nun … so“ gibt beides in natürlichem Deutsch wieder.
- source_word: συλλέγεται
  choice: gesammelt wird
  rationale: Das Verb steht im Präsens Passiv; beim deutschen singularischen Kollektivbegriff „Unkraut“ ist der Singular idiomatisch.
- source_word: τὰ ζιζάνια
  choice: das Unkraut
  rationale: ζιζάνια bezeichnet schädliche Ackerpflanzen, wahrscheinlich Taumel-Lolch. „Unkraut“ ist verständlich, modern und bewahrt den Bezug zur Bildrede.
- source_word: πυρὶ καίεται
  choice: im Feuer verbrannt wird
  rationale: Der Dativ πυρί bezeichnet hier das Feuer als Mittel beziehungsweise Bereich des Verbrennens. Die Formulierung hält die ausdrückliche Nennung des Feuers fest.
- source_word: οὕτως ἔσται
  choice: so wird es … sein
  rationale: Die deutsche Korrelativkonstruktion „wie … so“ bewahrt den Vergleich und den Zukunftsbezug von ἔσται.
- source_word: ἐν τῇ συντελείᾳ
  choice: am Ende
  rationale: συντέλεια bezeichnet Vollendung oder Abschluss. „Am Ende“ ist allgemein verständlich und im Deutschen idiomatisch.
- source_word: τοῦ αἰῶνος
  choice: des Zeitalters
  rationale: „Zeitalter“ gibt den zeitlichen Sinn von αἰών genauer wieder als „Welt“ und vermeidet eine vorschnelle Gleichsetzung mit dem physischen Kosmos.
theological_decisions:
- issue: Eschatologische Wendung τοῦ αἰῶνος
  choice: des Zeitalters
  alternative: der Welt
  rationale: Die Übersetzung bewahrt die zeitlich-eschatologische Bedeutung von αἰών, ohne ein bestimmtes Endzeitschema einzutragen. Die traditionelle Wiedergabe „Welt“ wird als mögliche, aber weniger genaue Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Konstruktion „Wie nun … so“ erhält die Form des griechischen Vergleichs. „Unkraut“ ist bewusst kollektivisch gebraucht; „Zeitalter“ wahrt die eschatologische, zeitliche Nuance.
