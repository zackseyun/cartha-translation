id: MAT.13.56
reference: Matthew 13:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: de
  text: Und sind nicht alle seine Schwestern bei uns? Woher hat dieser dann das alles?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche verstehen das griechische Wort hier im weiteren Sinn als »weibliche Verwandte«; gewöhnlich bedeutet es »Schwestern«.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: Schwestern
  rationale: Der gewöhnliche familiäre Sinn passt zum Zusammenhang, in dem die Dorfbewohner Jesu Familie aufzählen. Die direkte Wiedergabe wahrt zugleich die Spannung späterer theologischer Auslegungen.
- source_word: οὐχὶ πᾶσαι
  choice: sind nicht alle
  rationale: Die Formulierung gibt die rhetorische Frage wieder, die eine bejahende Antwort erwartet, und bewahrt die Betonung der Gesamtheit.
- source_word: πρὸς ἡμᾶς
  choice: bei uns
  rationale: Die Wendung bezeichnet hier Anwesenheit beziehungsweise Zugehörigkeit zur örtlichen Gemeinschaft; „bei uns“ ist im Deutschen natürlich und knapp.
- source_word: πόθεν
  choice: Woher
  rationale: Das Fragewort fragt nach Ursprung oder Quelle und wird unmittelbar mit „Woher“ wiedergegeben.
- source_word: οὖν
  choice: dann
  rationale: „Dann“ markiert den Schluss, den die Sprecher aus Jesu bekannter Herkunft ziehen, ohne den Satz unnötig zu formalisieren.
- source_word: τούτῳ
  choice: dieser
  rationale: Das substantivisch gebrauchte Demonstrativpronomen bewahrt den deiktischen, im Kontext leicht abschätzigen Ton.
- source_word: ταῦτα πάντα
  choice: das alles
  rationale: Die idiomatische deutsche Wendung verweist gesammelt auf die zuvor genannten Weisheit und Machttaten und gibt die umfassende Aussage des griechischen Plurals wieder.
theological_decisions:
- issue: Art der Bezeichnung von Jesu Schwestern
  choice: ἀδελφαὶ wird in seinem gewöhnlichen Sinn mit „Schwestern“ übersetzt.
  alternative: weibliche Verwandte beziehungsweise Cousinen
  rationale: Der unmittelbare familiäre Zusammenhang stützt die normale lexikalische Bedeutung. Eine weitere Verwandtschaftsbezeichnung würde eine spätere theologische Harmonisierung in den Haupttext eintragen, die der griechische Wortlaut nicht ausdrücklich verlangt.
translation_notes:
  register: Modernes, natürliches Standarddeutsch mit würdigem, mündlich gut verständlichem Satzbau. „Dieser“ erhält die distanzierte Färbung der Frage; „das alles“ vermeidet eine schwerfällige wörtliche Formulierung. Der Fußnotenmarker steht nach dem vollständigen Vers.
