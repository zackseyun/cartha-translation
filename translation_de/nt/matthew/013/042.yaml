  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: de
  text: Und sie werden sie in den Feuerofen werfen. Dort wird Weinen und Zähneknirschen sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Der einfache Anschluss an den vorhergehenden Zusammenhang bleibt erhalten.
- source_word: βαλοῦσιν
  choice: werden … werfen
  rationale: Das Futur von βάλλω bezeichnet hier ein gewaltsames Hineinwerfen; „werfen“ ist im heutigen Deutsch natürlich und kräftig.
- source_word: αὐτούς
  choice: sie
  rationale: Das Akkusativpronomen verweist ohne erläuternden Zusatz auf die zuvor genannte Gruppe zurück.
- source_word: κάμινον τοῦ πυρός
  choice: Feuerofen
  rationale: Das geläufige deutsche Kompositum gibt die Genitivverbindung prägnant und bildhaft wieder, ohne sie als späteren Lehrbegriff auszudeuten.
- source_word: ἐκεῖ
  choice: Dort
  rationale: Die Ortsangabe wird entsprechend ihrer hervorgehobenen Stellung am Anfang des zweiten Satzes wiedergegeben.
- source_word: κλαυθμός
  choice: Weinen
  rationale: „Weinen“ ist eine klare und im matthäischen Ausdruck angemessene Wiedergabe, ohne die Intensität auf ein bestimmtes Maß festzulegen.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: Zähneknirschen
  rationale: Das etablierte deutsche Wort bewahrt die anschauliche Redewendung und lässt offen, ob Schmerz, Verzweiflung oder Zorn im Vordergrund steht.
theological_decisions:
- issue: Bild des Gerichts im Ausdruck κάμινον τοῦ πυρός
  choice: Das konkrete Bild „Feuerofen“ wird unverändert als Metapher des Gerichts bewahrt.
  alternative: Den Ausdruck mit einem später geprägten Lehrbegriff wie „Höllenfeuer“ erklären.
  rationale: Der griechische Text bietet ein starkes Bild, legt dessen genaue dogmatische Ausgestaltung hier aber nicht weiter fest.
- issue: Bedeutungsumfang von „Weinen und Zähneknirschen“
  choice: Die feste matthäische Wendung wird ohne interpretierende Eingrenzung beibehalten.
  alternative: Das Zähneknirschen ausschließlich als Wut oder den gesamten Ausdruck ausschließlich als Trauer deuten.
  rationale: Die Formulierung bezeichnet schweres Leiden im Gericht, kann aber unterschiedliche Regungen einschließen; die Übersetzung sollte diese Spannung offenlassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die eindringliche Gerichtssprache des griechischen Textes bleiben erhalten; unnötige Fach- und Traditionsbegriffe werden vermieden.
