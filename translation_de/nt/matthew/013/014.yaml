  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: de
  text: 'Und an ihnen erfüllt sich die Prophezeiung Jesajas, die lautet: »Ihr werdet zwar hören, aber keinesfalls verstehen; ihr werdet zwar sehen, aber keinesfalls erkennen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Im Hören werdet ihr hören … und sehend werdet ihr sehen«; zwei durch das Griechische vermittelte hebräische Verstärkungskonstruktionen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: erfüllt sich
  rationale: Das Präsens Passiv wird im Deutschen mit der idiomatischen prophetischen Erfüllungsformel wiedergegeben. Die Formulierung wahrt den gegenwärtigen Bezug, ohne die mögliche Bedeutungskomponente einer vollständigen Erfüllung zu überzeichnen.
- source_word: αὐτοῖς
  choice: an ihnen
  rationale: Der Dativ bezeichnet die Menschen, an denen beziehungsweise in deren Fall die Prophezeiung Wirklichkeit wird. »An ihnen« ist im Deutschen natürlich und passt zur festen Wendung »sich an jemandem erfüllen«.
- source_word: προφητεία Ἠσαΐου
  choice: die Prophezeiung Jesajas
  rationale: Die Genitivverbindung bleibt eng am Griechischen und ist zugleich verständliches, würdiges Standarddeutsch.
- source_word: ἡ λέγουσα
  choice: die lautet
  rationale: Das attributive Partizip führt den Wortlaut des Zitats ein. »Die lautet« ist in diesem Zusammenhang natürlicher als das wörtlichere »die sagt«.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Hören werdet ihr
  rationale: Die vorangestellte Verbform bewahrt etwas von der semitisch-griechischen Verstärkung und dem rhetorischen Parallelismus, ohne im Haupttext unnatürlich »hörend hören« zu formulieren.
- source_word: οὐ μὴ συνῆτε
  choice: und doch keinesfalls verstehen
  rationale: »Keinesfalls« gibt die starke Negation οὐ μή wieder; »und doch« macht den im Zusammenhang liegenden Gegensatz auf natürliches Deutsch sichtbar, ohne ihn theologisch auszudeuten.
- source_word: βλέποντες βλέψετε
  choice: sehen werdet ihr
  rationale: Die parallele Wortstellung bildet die rhetorische Entsprechung zu »Hören werdet ihr«. Die wörtliche Doppelung wird in der Fußnote kenntlich gemacht.
- source_word: οὐ μὴ ἴδητε
  choice: und doch keinesfalls erkennen
  rationale: »Erkennen« unterscheidet das bloße Sehen von verstehender Wahrnehmung und gibt zugleich die emphatische Verneinung wieder.
theological_decisions:
- issue: Art der prophetischen Erfüllung
  choice: Die Prophezeiung erfüllt sich an diesen Menschen.
  alternative: Die Prophezeiung wird lediglich durch sie veranschaulicht oder in einem stärkeren Sinn vollständig abgeschlossen.
  rationale: Die Übersetzung bewahrt die Erfüllungsaussage des griechischen Textes, ohne einen bestimmten Mechanismus der Verstockung, Vorherbestimmung oder bloßen Entsprechung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstellung trägt den feierlichen Klang des Jesajazitats; die ungewöhnliche semitische Doppelung wird zugunsten natürlicher Verständlichkeit im Haupttext geglättet und in der Fußnote dokumentiert.
