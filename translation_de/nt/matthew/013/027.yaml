source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the servants of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: de
  text: 'Da traten die Sklaven des Hausherrn zu ihm und sagten: »Herr, hast du nicht guten Samen auf deinen Acker gesät? Woher kommt dann das Unkraut[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lolch“. Das griechische Wort bezeichnet wahrscheinlich Taumel-Lolch, ein Unkraut, das in frühen Wachstumsstadien Weizen ähnelt.'
    reason: Lexikalische Alternative und sachliche Präzisierung der wahrscheinlich gemeinten Pflanzenart.
lexical_decisions:
- source_word: προσελθόντες
  choice: traten … zu ihm
  rationale: Das Aoristpartizip bezeichnet eine der Hauptaussage vorausgehende Begleithandlung. „Zu ihm treten“ gibt die zielgerichtete Annäherung idiomatisch wieder.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: „Sklaven“ bewahrt in diesem Haushaltskontext den rechtlich und sozial gebundenen Status, den δοῦλοι bezeichnet, statt ihn mit „Diener“ abzuschwächen.
- source_word: οἰκοδεσπότου
  choice: Hausherrn
  rationale: „Hausherr“ ist die natürliche deutsche Entsprechung für den Herrn eines Hauses und wahrt zugleich seine Autoritätsbeziehung zu den Sklaven.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist eine würdevolle und kontextgerechte Anrede; sie lässt offen, ob hier vor allem eine respektvolle Anrede des Hausherrn oder die im Gleichnis mögliche weitergehende Bedeutung anklingt.
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: hast du nicht guten Samen … gesät
  rationale: Die verneinte Frage erwartet Zustimmung. Wortwahl und Satzbau sind im Deutschen natürlich und geben die landwirtschaftlichen Begriffe präzise wieder.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: auf deinen Acker
  rationale: Bei Säen und landwirtschaftlich genutztem Boden ist „auf den Acker säen“ im Deutschen idiomatischer als „in dem Feld“, während der Besitzbezug erhalten bleibt.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: Woher kommt dann das Unkraut?
  rationale: Die Formulierung gibt die Frage nach dem Ursprung idiomatisch wieder. Das deutsche Kollektivum „Unkraut“ entspricht dem griechischen Plural in diesem Zusammenhang, ohne die Pflanzenart im Haupttext vorschnell festzulegen.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im Haushalt des Gleichnisses
  choice: Sklaven
  alternative: Diener
  rationale: Der Vers lehrt nicht unmittelbar über Sklaverei, setzt aber ein antikes Herrschaftsverhältnis voraus. „Sklaven“ bewahrt diese soziale Wirklichkeit, ohne sie zu erläutern oder zu beschönigen.
- issue: Bedeutungsumfang der Anrede κύριε
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ entspricht dem üblichen Bedeutungsumfang von κύριε und wahrt die mögliche theologische Resonanz, ohne die Anrede im Gleichnis ausdrücklich christologisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich natürlich. „Hausherr“, „Sklaven“ und „Acker“ erhalten das soziale und landwirtschaftliche Umfeld des Gleichnisses; die spezifische Pflanzenbestimmung steht wegen ihrer Unsicherheit nur in der Fußnote.
