  text: 'Und er sprach zu ihnen vieles in Gleichnissen und sagte: „Seht! Der Sämann ging hinaus, um zu säen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: Gibt die geläufige Bedeutung von παραβολή im matthäischen Kontext präzise und natürlich wieder.
- source_word: Ἰδοὺ
  choice: Seht!
  rationale: Bewahrt den aufmerksamkeitslenkenden, eindringlichen Charakter des griechischen Ausdrucks in heutiger, würdiger Sprache.
- source_word: ὁ σπείρων
  choice: der Sämann
  rationale: Das substantivierte Partizip bezeichnet hier idiomatisch denjenigen, der sät; „der Sämann“ ist die natürliche deutsche Entsprechung.
- source_word: τοῦ σπείρειν
  choice: um zu säen
  rationale: Der Genitiv des substantivierten Infinitivs drückt hier den Zweck des Hinausgehens aus.
