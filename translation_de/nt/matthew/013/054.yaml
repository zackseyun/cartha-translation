  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: de
  text: 'Und er kam in seine Heimat und lehrte sie in ihrer Synagoge, sodass sie sehr erstaunt waren und sagten: »Woher hat dieser Mann diese Weisheit und diese Machttaten[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Kräfte«; gemeint sind machtvolle Taten, die häufig als Wunder verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: Heimatstadt
  rationale: Im Erzählzusammenhang bezeichnet πατρίς den Ort, aus dem Jesus stammt und an dem er den Menschen bekannt ist. »Heimatstadt« gibt diesen lokalen Sinn im heutigen Deutsch natürlich wieder.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das Imperfekt beschreibt Jesu andauernde Lehrtätigkeit. Im Deutschen kann das Präteritum diesen Verlauf kontextgerecht ausdrücken, ohne eine schwerfällige Umschreibung zu benötigen.
- source_word: συναγωγῇ
  choice: Synagoge
  rationale: Im jüdischen Kontext ist sowohl die örtliche Versammlung als auch ihr Versammlungsort gemeint; »Synagoge« ist die klare und etablierte Wiedergabe.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: Darüber staunten sie sehr und sagten
  rationale: ὥστε bezeichnet die Folge seines Lehrens. Die finite deutsche Formulierung ist natürlich; »staunten sehr« bewahrt die starke Reaktion von ἐκπλήσσομαι.
- source_word: Πόθεν
  choice: Woher hat
  rationale: Πόθεν fragt nach Ursprung oder Quelle. »Woher hat …?« entspricht dieser offenen Frage im Deutschen unmittelbar.
- source_word: τούτῳ
  choice: dieser Mann
  rationale: Das Demonstrativpronomen bezeichnet Jesus mit einer gewissen Distanz. »Dieser Mann« gibt diesen Ton idiomatisch wieder.
- source_word: σοφία
  choice: Weisheit
  rationale: »Weisheit« ist die direkte und im Kontext verständliche Entsprechung für die außergewöhnliche Einsicht, die seine Hörer wahrnehmen.
- source_word: δυνάμεις
  choice: Machttaten
  rationale: Der Plural δυνάμεις bedeutet wörtlich »Kräfte/Machterweise« und bezeichnet hier außergewöhnliche, machtvolle Taten. »Machttaten« ist im Deutschen verständlicher als »Kräfte« und weniger festlegend als »Wunder«.
theological_decisions:
- issue: Wiedergabe von δυνάμεις für Jesu außergewöhnliche Taten
  choice: Machttaten
  alternative: Kräfte; Wunder
  rationale: »Machttaten« hält den Zusammenhang von göttlicher Macht und sichtbaren Taten fest, ohne den Ausdruck vorschnell auf einen technischen Wunderbegriff zu verengen. Die wörtlichere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der lange griechische Satz wurde zur besseren Lesbarkeit in zwei Sätze gegliedert; der Folgezusammenhang bleibt durch »Darüber« erhalten.
