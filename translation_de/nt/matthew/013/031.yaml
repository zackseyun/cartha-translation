id: MAT.13.31
reference: Matthew 13:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: de
  text: 'Ein weiteres Gleichnis legte er ihnen vor und sagte: »Das Himmelreich gleicht einem Senfkorn, das ein Mann nahm und auf seinem Acker aussäte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: legte … vor
  rationale: Die Wendung bewahrt das anschauliche Bild von παρατίθημι und ist im Deutschen eine natürliche Ausdrucksweise dafür, einer Zuhörerschaft ein Gleichnis darzubieten.
- source_word: παραβολὴν
  choice: Gleichnis
  rationale: „Gleichnis“ ist im synoptischen Lehrkontext die geläufige und sachlich genaue Bezeichnung für παραβολή.
- source_word: Ὁμοία ἐστὶν
  choice: gleicht
  rationale: „Gleicht“ gibt die einleitende Vergleichsformel knapp, idiomatisch und ohne zusätzliche Deutung wieder.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: „Himmelreich“ ist die etablierte deutsche Wiedergabe der für Matthäus charakteristischen Wendung und lässt sowohl Herrschaft als auch Herrschaftsbereich als Bedeutungsdimensionen offen.
- source_word: κόκκῳ σινάπεως
  choice: einem Senfkorn
  rationale: „Senfkorn“ ist die natürliche deutsche Bezeichnung für den in diesem Bild gemeinten kleinen Senfsamen.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: das ein Mann nahm
  rationale: Der Relativsatz und das Partizip werden in natürlicher deutscher Syntax wiedergegeben; „ein Mann“ erhält den einzelnen männlichen Handlungsträger der Erzählung.
- source_word: ἔσπειρεν
  choice: aussäte
  rationale: „Aussäen“ bezeichnet präzise das Säen von Saatgut und passt zum landwirtschaftlichen Zusammenhang.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: auf seinem Acker
  rationale: „Auf seinem Acker“ ist die idiomatische deutsche Ortsangabe für das Aussäen und gibt sowohl ἀγρός als auch das Possessivpronomen klar wieder.
theological_decisions:
- issue: Wiedergabe von βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  alternative: die Herrschaft des Himmels; das Reich der Himmel
  rationale: „Himmelreich“ bewahrt die für Matthäus kennzeichnende Terminologie und engt den Ausdruck weder auf eine rein abstrakte Herrschaft noch auf einen räumlichen Bereich ein.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Text, während „auf seinem Acker aussäte“ dem natürlichen deutschen Sprachgebrauch entspricht.
