id: MAT.13.38
reference: Matthew 13:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: de
  text: Der Acker ist die Welt; der gute Same aber, das sind die Söhne des Reiches.[a] Das Unkraut aber sind die Söhne des Bösen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne des Reiches“ bezeichnet hier die Menschen, die zum Reich gehören.
    reason: cultural_note
  - marker: b
    text: Das mit „Unkraut“ übersetzte Wort kann sich insbesondere auf Taumellolch beziehen, ein dem Weizen ähnlich sehendes Wildgras.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: Acker
  rationale: Im landwirtschaftlichen Kontext des Gleichnisses bezeichnet ἀγρός das bestellte Feld; „Acker“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: κόσμος
  choice: Welt
  rationale: κόσμος bezeichnet hier umfassend die Welt als den Bereich, in dem ausgesät wird; „Welt“ ist die klare und übliche Wiedergabe.
- source_word: καλὸν σπέρμα
  choice: gute Same
  rationale: Die traditionelle, weiterhin verständliche Kollektivform „Same“ bewahrt das landwirtschaftliche Bild und den Gegensatz zum Unkraut.
- source_word: οὗτοί εἰσιν
  choice: das sind
  rationale: Das maskuline Pluralpronomen verweist auf die Menschen, für die der kollektivische Singular „Same“ steht; „das sind“ gibt diesen Übergang im Deutschen idiomatisch wieder.
- source_word: υἱοὶ τῆς βασιλείας
  choice: Söhne des Reiches
  rationale: „Söhne“ bewahrt die ausdrücklich maskuline relationale Ausdrucksweise des Griechischen; „Reich“ entspricht dem prägenden matthäischen Sprachgebrauch von βασιλεία.
- source_word: ζιζάνια
  choice: Unkraut
  rationale: ζιζάνια meint wahrscheinlich Taumellolch, doch „Unkraut“ ist verständlicher und führt das Bild des Gleichnisses natürlich fort.
- source_word: τοῦ πονηροῦ
  choice: des Bösen
  rationale: Die substantivierte, artikulierte Form bezeichnet hier am ehesten eine böse Person beziehungsweise den Bösen; die deutsche Großschreibung signalisiert den persönlichen Bezug, ohne den Referenten ausdrücklich zu benennen.
theological_decisions:
- issue: Persönliche oder unpersönliche Deutung von τοῦ πονηροῦ
  choice: des Bösen
  alternative: des Übels / des Bösen im unpersönlichen Sinn
  rationale: Artikel, Genus und der relationale Ausdruck „Söhne des …“ sprechen in diesem Zusammenhang für einen persönlichen Referenten. „Des Bösen“ erhält zugleich die knappe Formulierung des griechischen Textes.
- issue: Inklusive oder formal maskuline Wiedergabe von υἱοί
  choice: Söhne
  alternative: Kinder
  rationale: Das Griechische verwendet ausdrücklich den maskulinen Plural. Die Hauptübersetzung bewahrt diese Form; eine Fußnote erklärt, dass die relationale Wendung die Zugehörigen bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Konstruktion mit „aber“ bildet die parallelen δέ-Sätze ab; das Semikolon gliedert die ersten beiden Deutungen klar. Die relationalen Genitivwendungen und die Bildsprache bleiben erhalten.
