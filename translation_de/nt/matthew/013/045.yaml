review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die griechische Gleichnisformel und ihre Syntax sachgerecht wieder: Πάλιν mit „Wiederum“, ὁμοία ἐστίν mit „ist ... wie“, ἀνθρώπῳ ἐμπόρῳ idiomatisch mit „ein Kaufmann“ und ζητοῦντι als fortdauernde Suche im Relativsatz. „Schönen Perlen“ ist für καλοὺς μαργαρίτας semantisch möglich und wahrt dessen nicht rein ökonomisch festgelegte Qualitätsaussage. Die Auslassung einer gesonderten Wiedergabe von ἀνθρώπῳ ist im Deutschen unproblematisch, da „Kaufmann“ die Person bereits bezeichnet.'
  naturalness: „Wiederum ist das Himmelreich wie ein Kaufmann, der nach schönen Perlen sucht“ ist modernes, gut verständliches Standarddeutsch mit angemessen bibelnah-würdigem Register. Die Formulierung ist flüssig und benötigt keine erläuternde Fußnote.
  terminology: „Himmelreich“ ist eine etablierte und natürliche Wiedergabe von ἡ βασιλεία τῶν οὐρανῶν bei Matthäus. „Kaufmann“ trifft ἔμπορος präzise. „Schöne Perlen“ ist gegenüber möglichen Einengungen wie „wertvolle“ oder „kostbare“ bewusst offen; insbesondere wird dadurch die in V. 46 ausdrücklich verwendete Wertterminologie nicht vorweggenommen.
