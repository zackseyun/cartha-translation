source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: de
  text: Wiederum ist das Himmelreich wie ein Kaufmann, der nach schönen Perlen sucht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν
  choice: Wiederum
  rationale: Leitet ein weiteres Gleichnis in der Reihe ein und bewahrt den fortlaufenden Zusammenhang würdevoll und natürlich.
- source_word: ὁμοία ἐστὶν
  choice: ist wie
  rationale: Gibt die übliche Gleichnisformel knapp und idiomatisch wieder.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Ist die etablierte, natürliche deutsche Wiedergabe der für Matthäus charakteristischen Wendung, ohne den griechischen Plural unidiomatisch nachzubilden.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: ein Kaufmann
  rationale: ἔμπορος bezeichnet die Person bereits hinreichend; das zusätzliche ἀνθρώπῳ muss im Deutschen nicht mit „ein Mensch, ein Kaufmann“ verdoppelt werden.
- source_word: ζητοῦντι
  choice: der … sucht
  rationale: Der Relativsatz gibt das präsentische Partizip und die fortdauernde Tätigkeit in natürlichem Deutsch wieder.
- source_word: καλοὺς μαργαρίτας
  choice: schönen Perlen
  rationale: καλός kann hier Schönheit, Güte oder hohe Qualität bezeichnen. „Schöne Perlen“ bewahrt diese offene Wertung, ohne den Handelswert ausdrücklich in den Text hineinzulesen.
theological_decisions:
- issue: Reichweite des Vergleichs in der Gleichnisformel
  choice: Das Himmelreich wird unmittelbar mit einem Kaufmann verglichen.
  alternative: Das Himmelreich ist wie die gesamte Situation eines Kaufmanns, der nach schönen Perlen sucht.
  rationale: Die griechische Konstruktion ὁμοία ἐστὶν … ἀνθρώπῳ ἐμπόρῳ nennt den Kaufmann als unmittelbaren Vergleichspunkt. Die Übersetzung deutet die weiterführende Bildhandlung nicht vorzeitig aus.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Wiederum“ verbindet den Vers klar mit der Gleichnisreihe; „Kaufmann“ und der Relativsatz sind natürlich und präzise.
