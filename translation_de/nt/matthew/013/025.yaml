id: MAT.13.25
reference: Matthew 13:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: de
  text: Doch während die Menschen schliefen, kam sein Feind, säte Unkraut mitten unter den Weizen und ging fort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: die Menschen
  rationale: ἄνθρωποι bezeichnet hier die beteiligten Menschen bzw. Arbeiter allgemein; im modernen Deutschen ist „die Menschen“ natürlich und lässt eine unnötige Festlegung auf ausschließlich männliche Personen vermeiden.
- source_word: ἐπέσπειρεν
  choice: säte
  rationale: Das Verb bezeichnet das zusätzliche bzw. darübergestreute Aussäen; im Zusammenhang gibt „säte ... mitten unter“ den Vorgang klar und idiomatisch wieder.
- source_word: ζιζάνια
  choice: Unkraut
  rationale: ζιζάνια meint ein schädliches, dem Weizen ähnliches Beikraut, wahrscheinlich Taumellolch. „Unkraut“ ist verständlich und erhält die für das Gleichnis wesentliche Gegenüberstellung, ohne die Pflanzenart übermäßig festzulegen.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: mitten unter den Weizen
  rationale: Die Formulierung betont, dass das Unkraut im Weizenbestand verteilt ausgesät wurde; „mitten unter“ bildet dies prägnant ab.
- source_word: ἀπῆλθεν
  choice: ging wieder fort
  rationale: „Ging ... fort“ entspricht dem Weggehen; „wieder“ ist im Deutschen idiomatisch und macht deutlich, dass der Feind den Ort nach seiner heimlichen Tat verließ.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Der Satzbau folgt dem griechischen Ablauf, bleibt aber im Deutschen flüssig. Keine Fußnote ist nötig, da die botanische Präzisierung für den Vers nicht erforderlich ist.
