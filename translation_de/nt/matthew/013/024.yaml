  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: de
  text: 'Ein weiteres Gleichnis legte er ihnen vor und sagte: „Mit dem Himmelreich ist es wie mit einem Mann, der guten Samen auf seinen Acker säte.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς
  choice: Ein weiteres Gleichnis legte er ihnen vor
  rationale: „Ein weiteres“ kennzeichnet das Gleichnis als zusätzliches Glied der Folge. „Jemandem etwas vorlegen“ bewahrt das anschauliche Bild von παρατίθημι und ist im Deutschen für eine zur Betrachtung gestellte Lehre verständlich.
- source_word: λέγων
  choice: und sagte
  rationale: Die finite deutsche Form verbindet Einleitung und direkte Rede natürlicher als das wörtliche Partizip „sagend“.
- source_word: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ
  choice: Mit dem Himmelreich ist es wie mit einem Mann
  rationale: Diese geläufige deutsche Gleichnisformel gibt den Vergleich des Aoristpassivs ὡμοιώθη idiomatisch wieder, ohne eine zeitliche Wesensveränderung des Reiches zu behaupten. Der maskuline Mann ist die konkrete Figur des Gleichnisses.
- source_word: σπείραντι καλὸν σπέρμα
  choice: der guten Samen ... säte
  rationale: Der attributive Aoristpartizip wird als Relativsatz wiedergegeben. „Guter Samen“ bezeichnet hier Saatgut von guter beziehungsweise rechter Art und bereitet den Gegensatz zum Unkraut vor.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: auf seinen Acker
  rationale: Bei Säen auf einer landwirtschaftlich genutzten Fläche ist „auf seinen Acker“ im Deutschen natürlicher als „in seinem Feld“ und gibt den Besitzbezug von αὐτοῦ klar wieder.
theological_decisions:
- issue: Wiedergabe von ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  alternative: die Herrschaft der Himmel / das Reich der Himmel
  rationale: „Himmelreich“ ist im modernen deutschen Bibelsprachgebrauch verständlich und bewahrt die charakteristische matthäische Wendung, ohne den griechischen Plural unnatürlich nachzuahmen.
- issue: Aussagekraft von Ὡμοιώθη in der Gleichnisformel
  choice: Mit dem Himmelreich ist es wie mit ...
  alternative: Das Himmelreich ist einem Mann gleich geworden / wurde mit einem Mann verglichen
  rationale: Der Aorist in dieser matthäischen Einleitungsformel eröffnet einen erzählerischen Vergleich. Die idiomatische deutsche Formel vermeidet sowohl eine missverständliche ontologische Veränderung als auch eine unnötig passive Vergleichsaussage. Dabei bleibt offen, ob der Vergleichspunkt zunächst beim Mann oder beim gesamten folgenden Geschehen liegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Ein weiteres Gleichnis legte er ihnen vor“ hält die Hervorhebung des zusätzlichen Gleichnisses aufrecht; die direkte Rede verwendet eine natürliche deutsche Gleichnisformel.
