review_pass:
  verdict: revise
  source_fidelity: „setzte sich“ gibt gegenüber dem Imperfekt ἐκάθητο eine nicht erforderliche ingressive Nuance wieder. Die Form schildert Jesus als sitzend; im Deutschen ist „saß“ die knappe, idiomatische und quellentreue Wiedergabe. „An jenem Tag“, „ging ... aus dem Haus“ und „am See“ geben die übrigen Ausdrücke angemessen wieder. Die Wiedergabe von θάλασσα mit „See“ ist im galiläischen Kontext sachgerecht, ohne die räumliche Bedeutung von παρά einzuengen.
  naturalness: „An jenem Tag ging Jesus aus dem Haus und saß am See“ ist modernes, flüssiges Standarddeutsch und erhält die erzählerische Szenenbeschreibung. Die Fußnotenmarker stehen üblich vor dem Satzzeichen.
  terminology: „Jesus“ ist die etablierte deutsche Namensform. „See“ ist für den gemeinten See von Galiläa idiomatisch; „am See“ bewahrt die Näheangabe, ohne einen exakten Standort am Ufer zu behaupten.
  issues:
  - severity: medium
    issue: „setzte sich“ für ἐκάθητο
    rationale: ἐκάθητο ist ein Imperfekt von κάθημαι und bezeichnet hier das Sitzen als andauernden Hintergrundzustand. „Setzte sich“ legt den Beginn des Sitzens nahe; diese ingressive Handlung wird vom griechischen Verb nicht ausgedrückt.
  - severity: low
    issue: 'Fußnote a: „Noch am selben Tag“'
    rationale: „Noch“ fügt eine zeitliche/dringliche Nuance hinzu, die die griechische Wendung nicht trägt. Wenn eine kontextuelle Alternative angeboten wird, ist „Am selben Tag“ die neutralere Formulierung.
