  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: de
  text: An jenem Tag ging Jesus aus dem Haus und saß am See[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Am selben Tag“, wenn die Wendung besonders die unmittelbare Fortsetzung des vorhergehenden Geschehens hervorhebt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „beim See“. Die griechische Wendung bezeichnet einen Ort in der Nähe des Sees, ohne die genaue Entfernung vom Ufer anzugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: An jenem Tag
  rationale: Die Wendung ist eine gewöhnliche Zeitangabe. „An jenem Tag“ ist im modernen Deutschen natürlich und gibt den Rückverweis wieder, ohne die im Griechischen nicht ausdrücklich bezeichnete Gleichzeitigkeit durch „noch am selben Tag“ festzulegen.
- source_word: ἐξελθὼν … τῆς οἰκίας
  choice: ging … aus dem Haus
  rationale: Das vorangestellte Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Bewegung. Eine finite Reihung ist im Deutschen natürlich; der Genitiv bei ἐξέρχομαι bezeichnet den verlassenen Ort.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: ἐκάθητο
  choice: setzte sich
  rationale: Die Form kann kontextuell das Sichsetzen beziehungsweise Sitzen bezeichnen. Nach dem Herausgehen bildet „setzte sich“ eine natürliche deutsche Handlungsfolge, ohne ein zusätzliches Motiv oder eine besondere Sitzweise einzutragen.
- source_word: παρὰ τὴν θάλασσαν
  choice: an den See
  rationale: παρά mit Akkusativ bezeichnet hier die Lage in der Nähe des Gewässers. Im matthäischen Kontext ist der See von Galiläa gemeint; idiomatisches Deutsch verwendet dafür „See“. Die genaue Entfernung vom Ufer bleibt offen.
