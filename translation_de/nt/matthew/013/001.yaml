- from: An jenem Tag ging Jesus aus dem Haus und setzte sich an den See.[a][b]
  to: An jenem Tag ging Jesus aus dem Haus und saß am See[a][b].
  rationale: Die Revision ersetzt die ingressive Wiedergabe „setzte sich“ durch das dem Imperfekt entsprechende „saß“. Außerdem wird in der alternativen Zeitangabe das nicht im Griechischen ausgedrückte „noch“ entfernt. Die alternative Ortsangabe wird mit „beim See“ gegenüber dem Haupttext sinnvoll variiert, ohne die Bedeutung zu verändern.
