id: MAT.13.15
reference: Matthew 13:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: de
  text: Denn das Herz dieses Volkes ist abgestumpft, sie hören mit ihren Ohren nur schwer[a], und sie haben ihre Augen geschlossen, damit sie nicht etwa mit den Augen sehen, mit den Ohren hören, mit dem Herzen verstehen, umkehren[b] und ich sie heile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit den Ohren hörten sie schwer“; auch: „sie hören mit ihren Ohren mit Mühe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „sich wenden“ oder „zurückkehren“.'
    reason: lexical_alternative
  - marker: c
    text: Zitat aus Jesaja 6,9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: ist abgestumpft
  rationale: Das Verb bedeutet wörtlich „dick/fett werden“, bezeichnet in der Verbindung mit „Herz“ jedoch Unempfindlichkeit und mangelnde Aufnahmefähigkeit. „Ist abgestumpft“ gibt das Idiom natürlich wieder, ohne die Bildaussage unnötig auszudeuten.
- source_word: καρδία
  choice: Herz
  rationale: Bewahrt den biblischen Ausdruck für das innere Wahrnehmungs- und Verstehensvermögen; der folgende Satz verbindet das Herz ausdrücklich mit dem Verstehen.
- source_word: λαοῦ τούτου
  choice: dieses Volkes
  rationale: Gibt Genitiv und Demonstrativpronomen unmittelbar und idiomatisch wieder.
- source_word: τοῖς ὠσὶν βαρέως ἤκουσαν
  choice: mit den Ohren hören sie nur schwer
  rationale: „Nur schwer hören“ vermittelt die durch βαρέως ausgedrückte Schwere bzw. Beeinträchtigung des Hörens. Das deutsche Präsens stellt den fortdauernden Zustand in der prophetischen Anführung natürlich dar.
- source_word: ἐκάμμυσαν
  choice: haben sie verschlossen
  rationale: Bewahrt die aktive Handlung des Volkes und die gegenwärtige Folge des aoristischen Vorgangs.
- source_word: μήποτε
  choice: damit sie nicht etwa
  rationale: Erhält die negative Zweck- beziehungsweise Folgeformulierung und ihre theologische Spannung, ohne sie zu einem bloßen „sonst“ abzuschwächen.
- source_word: συνῶσιν
  choice: verstehen
  rationale: Gibt die kontextuelle Bedeutung geistiger Einsicht klar und geläufig wieder.
- source_word: ἐπιστρέψωσιν
  choice: umkehren
  rationale: „Umkehren“ wahrt die Richtungs- und Reuekomponente, ohne kirchliche Fachsprache wie „bekehrt werden“ einzutragen.
- source_word: ἰάσομαι
  choice: ich sie heile
  rationale: Im Deutschen verlangt die durch μήποτε eingeleitete abhängige Reihung den Konjunktivcharakter nicht eigens am Verb; „heile“ bewahrt die erste Person und das Heilungsbild, ohne die Aussage zu einem irrealen „würde heilen“ umzudeuten.
theological_decisions:
- issue: Spannung zwischen gerichtlicher Verstockung und menschlicher Verantwortung
  choice: „damit sie nicht etwa … umkehren und ich sie heile“
  alternative: „sonst würden sie … umkehren, und ich würde sie heilen“
  rationale: Die gewählte Fassung erhält die Oberflächenkraft von μήποτε und zugleich die aktive Verantwortung des Volkes, das seine Augen selbst verschließt. Sie entscheidet nicht vorab, ob die Formulierung primär Zweck, Folge oder gerichtliche Beschreibung ausdrückt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Folge „sehen – hören – verstehen – umkehren – heilen“ bleibt erhalten. „Nicht etwa“ wahrt die Spannung des griechischen μήποτε; bewusst wird weder ein rein kausales „sonst“ noch ein konfessionell geprägtes „bekehrt werden“ verwendet.
