source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: de
  text: 'Anderes aber fiel auf den guten Boden und brachte Frucht: das eine hundertfach, das andere sechzigfach, das andere dreißigfach.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: Anderes
  rationale: Das substantivierte Neutrum Plural verweist im Zusammenhang auf das zuvor ausgesäte Saatgut. Das deutsche kollektive „Anderes“ bewahrt diesen Rückbezug, ohne unnötig „Samen“ zu ergänzen.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert den Gegensatz zu den zuvor beschriebenen erfolglosen Böden; „aber“ gibt diese Funktion natürlich wieder.
- source_word: ἔπεσεν
  choice: fiel
  rationale: Die wörtliche Bildsprache des Fallens wird beibehalten und nicht zu „wurde gesät“ umgedeutet.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: auf den guten Boden
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet γῆ den Erdboden; „guter Boden“ ist im Deutschen natürlich und meint hier für Wachstum geeigneten, fruchtbaren Boden.
- source_word: ἐδίδου καρπόν
  choice: brachte Frucht
  rationale: Die idiomatische deutsche Wendung bewahrt die Fruchtmetaphorik. Das Imperfekt beschreibt den einsetzenden beziehungsweise fortdauernden Ertrag; im erzählenden Zusammenhang gibt das Präteritum dies natürlich wieder.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: das eine hundertfach, das andere sechzigfach, das andere dreißigfach
  rationale: Die korrelative Verteilung ὃ μὲν … ὃ δὲ … ὃ δὲ wird eng mit „das eine … das andere … das andere“ wiedergegeben. „-fach“ verdeutlicht bei allen drei Zahlen den gemeinten vervielfachten Ertrag.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter landwirtschaftlicher Bildsprache. Der Doppelpunkt macht deutlich, dass die folgenden Zahlen den unterschiedlich hohen Fruchtertrag entfalten.
