  verdict: revise
  source_fidelity: Die Abfolge von Finden, Weggehen, vollständigem Verkauf und Kauf wird grundsätzlich zutreffend wiedergegeben. Das explizite ἕνα ist mit „eine einzige“ erhalten, πολύτιμον mit „besonders wertvolle“ angemessen erfasst, und „alles, was er besaß“ gibt πάντα ὅσα εἶχεν vollständig wieder. „Ging er hin“ ist jedoch für ἀπελθών weniger genau, da das Verb das Weggehen bzw. Sich-Entfernen bezeichnet, nicht einfach ein Hingehen.
  naturalness: Der Satz ist insgesamt modernes, gut verständliches Standarddeutsch. „Ging er weg“ ist hier sowohl natürlicher als auch semantisch präziser als „ging er hin“.
