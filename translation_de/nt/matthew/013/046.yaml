  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: de
  text: Als er aber eine einzige besonders wertvolle Perle gefunden hatte, ging er weg, verkaufte alles, was er besaß, und kaufte sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine einzige kostbare Perle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: Als er aber … gefunden hatte
  rationale: Die temporale Konstruktion gibt die dem Hauptgeschehen vorausgehende Handlung des Aoristpartizips natürlich wieder. „Aber“ bewahrt die leicht weiterführende beziehungsweise kontrastierende Kraft von δέ im Zusammenhang.
- source_word: ἕνα
  choice: eine einzige
  rationale: Das ausdrücklich gesetzte Zahlwort wird beibehalten und hebt die eine außergewöhnliche Perle hervor.
- source_word: πολύτιμον
  choice: besonders wertvolle
  rationale: Die Formulierung vermittelt in natürlichem modernem Deutsch den außergewöhnlich hohen Wert; die knappere Alternative „kostbare“ bleibt in der Fußnote erhalten.
- source_word: μαργαρίτην
  choice: Perle
  rationale: Dies ist die übliche und kontextuell eindeutige Bedeutung.
- source_word: ἀπελθὼν
  choice: ging er hin
  rationale: Das Partizip wird für einen natürlichen deutschen Erzählfluss als finites Verb wiedergegeben und markiert den Übergang zur entschlossenen Handlung.
- source_word: πέπρακεν
  choice: verkaufte
  rationale: Das griechische Perfekt bezeichnet hier eine vollzogene Handlung; im deutschen Erzählzusammenhang ist das Präteritum idiomatisch.
- source_word: πάντα ὅσα εἶχεν
  choice: alles, was er besaß
  rationale: Die Wiedergabe erhält die ausdrücklich bezeichnete Gesamtheit und klingt würdevoll sowie gegenwärtig.
- source_word: ἠγόρασεν
  choice: kaufte
  rationale: Schlichte und genaue deutsche Entsprechung im narrativen Präteritum.
- source_word: αὐτόν
  choice: sie
  rationale: Das Pronomen bezieht sich auf das im Deutschen feminine Substantiv „Perle“; daher verlangt natürliches Deutsch „sie“.
theological_decisions: []
