  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Abfolge von Finden, Hingehen, Verkaufen und Kaufen bleibt klar; der explizite Singular und die Totalität des Verkaufs werden bewahrt.
