id: MAT.13.35
reference: Matthew 13:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: de
  text: 'damit erfüllt würde, was durch den Propheten gesagt worden war: »Ich werde meinen Mund zu Gleichnissen öffnen; ich werde aussprechen, was seit der Grundlegung verborgen ist.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben: »seit der Grundlegung der Welt«.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: damit erfüllt würde
  rationale: Gibt die Zweck- beziehungsweise Erfüllungsbeziehung mit dem passiven Konjunktiv natürlich wieder, ohne sie unnötig festzulegen.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: was durch den Propheten gesagt worden war
  rationale: Das Plusquamperfekt macht im Deutschen klar, dass das prophetische Wort der nun beschriebenen Erfüllung vorausging; »durch« bewahrt die vermittelte Urheberschaft.
- source_word: λέγοντος
  choice: ':'
  rationale: Ein Doppelpunkt führt das Zitat im modernen Deutschen natürlicher ein als ein zusätzliches und schwerfälliges »der sagte«.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Ich werde meinen Mund zu Gleichnissen öffnen
  rationale: Bewahrt das poetische Bild und den Plural παραβολαῖς; »zu Gleichnissen« ist im Deutschen idiomatischer als »in Gleichnissen« und hält die Art des Sprechens fest.
- source_word: ἐρεύξομαι
  choice: ich werde aussprechen
  rationale: Vermittelt das Hervorbringen von Worten in gehobenem, aber gegenwärtigem Deutsch, ohne die körperliche Grundbedeutung des Verbs unpassend wörtlich wiederzugeben.
- source_word: κεκρυμμένα
  choice: was … verborgen ist
  rationale: Gibt das substantivierte perfekte Passiv als fortbestehenden Zustand wieder und vermeidet die stärker deutende Wiedergabe »Geheimnisse«.
- source_word: ἀπὸ καταβολῆς
  choice: seit der Grundlegung der Welt
  rationale: »Seit« passt zur zeitlichen Bedeutung; »der Welt« vervollständigt im Deutschen die elliptische Wendung sinngemäß. Dass κόσμου im zugrunde gelegten griechischen Text nicht ausdrücklich steht, wird in der Fußnote offengelegt.
theological_decisions:
- issue: Bezeichnung der prophetischen Quelle
  choice: durch den Propheten
  alternative: durch Asaf, den Propheten
  rationale: Der vorgelegte griechische Text nennt nur »den Propheten«. Die Übersetzung identifiziert ihn nicht über den Wortlaut hinaus.
- issue: Umfang der Zeitangabe ἀπὸ καταβολῆς
  choice: seit der Grundlegung der Welt
  alternative: seit der Grundlegung
  rationale: Der Ausgangstext lässt das Bezugswort zu »Grundlegung« unausgesprochen. Für verständliches, natürliches Deutsch wird das im Kontext naheliegende »der Welt« ergänzt, während die textliche Ellipse und die handschriftliche Überlieferung in der Fußnote kenntlich bleiben.
- issue: Bedeutung von κεκρυμμένα
  choice: was verborgen ist
  alternative: Geheimnisse
  rationale: Die gewählte Form bewahrt den passiven Zustandsaspekt und deutet die verborgenen Inhalte nicht vorschnell als eine bestimmte Art religiöser Geheimnisse.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht poetischem Ton im Schriftzitat. Die Erfüllungsformel bleibt erkennbar, während der Zitateinstieg durch einen deutschen Doppelpunkt entlastet wird. Der Fußnotenmarker [a] steht im Haupttext.
