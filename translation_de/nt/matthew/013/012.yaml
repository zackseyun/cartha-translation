id: MAT.13.12
reference: Matthew 13:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: de
  text: Denn wer hat[a], dem wird gegeben werden, und er wird Überfluss haben; wer aber nicht hat, dem wird selbst das genommen werden, was er hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Was jemand „hat“, wird im griechischen Text nicht ausdrücklich genannt; im Zusammenhang kann es besonders um Aufnahmebereitschaft und Verständnis für Jesu Lehre gehen.
    reason: Bewahrung einer im Ausgangstext vorhandenen Bedeutungsweite.
lexical_decisions:
- source_word: ὅστις
  choice: wer
  rationale: Das indefinite Relativpronomen formuliert einen allgemein geltenden Grundsatz. Die deutsche Konstruktion „wer …, dem …“ ist natürlich und bewahrt den distributiven Sinn.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage und wird mit „denn“ anschlussgetreu wiedergegeben.
- source_word: ἔχει
  choice: hat
  rationale: Das schlichte Verb des Habens bleibt ohne ausdrücklich genanntes Objekt, wie im Griechischen.
- source_word: δοθήσεται αὐτῷ
  choice: dem wird gegeben werden
  rationale: Die zukünftige Passivform mit Dativ wird eng am Ausgangstext wiedergegeben. Anders als manche idiomatischen Übersetzungen wird „mehr“ nicht in den Haupttext eingefügt, da es im Griechischen nicht ausdrücklich steht.
- source_word: περισσευθήσεται
  choice: er wird Überfluss haben
  rationale: Die Form bezeichnet das Eintreten eines Zustands der Fülle beziehungsweise des Überflusses. Die Formulierung ist verständlich und lässt den Gegenstand des Überflusses ebenso offen wie der Kontext.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ bildet den deutlichen Gegensatz zwischen den beiden Satzhälften ab.
- source_word: καὶ ὃ ἔχει
  choice: selbst das, was er hat
  rationale: καί hat hier steigernde Kraft. „Selbst“ hebt die paradoxe Zuspitzung idiomatisch hervor.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: wird ihm genommen werden
  rationale: Das zukünftige Passiv von αἴρω mit ἀπό bezeichnet Entzug oder Entfernung; „genommen werden“ ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Nicht genanntes Objekt von „haben“ und „geben“
  choice: Das Objekt bleibt im Haupttext ungenannt.
  alternative: Es ausdrücklich als Verständnis, Aufnahmebereitschaft, Erkenntnis oder Einsicht in das Himmelreich bestimmen.
  rationale: Der Zusammenhang betrifft die Aufnahme von Jesu Lehre und die Geheimnisse des Himmelreichs, doch der griechische Wortlaut nennt kein Objekt. Die Übersetzung bewahrt daher die Weite und Spannung des Spruchs.
- issue: Allgemeiner Personenbezug im grammatischen Singular
  choice: Die deutsche Konstruktion „wer …, dem …“ und anschließend „er“ wahrt den repräsentativen Singular.
  alternative: Eine Pluralkonstruktion oder eine vollständig geschlechtsneutrale Umschreibung verwenden.
  rationale: Der griechische Text steht im grammatisch maskulinen Singular und ist allgemein gemeint. Die deutsche „wer“-Konstruktion bringt diese Allgemeingültigkeit natürlich zum Ausdruck, ohne die Numerusform zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einer natürlichen sprichwörtlichen Satzstruktur. Der parallele Gegensatz der beiden Satzhälften bleibt erhalten; interpretierende Ergänzungen werden vermieden.
