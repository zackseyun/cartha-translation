id: MAT.13.43
reference: Matthew 13:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: de
  text: Dann werden die Gerechten leuchten[a] wie die Sonne im Reich ihres Vaters. Wer Ohren hat, der höre!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hervorleuchten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Gibt die zeitliche, auf die vorherige Deutung folgende Abfolge knapp und natürlich wieder.
- source_word: οἱ δίκαιοι
  choice: die Gerechten
  rationale: Die substantivierte Adjektivform bezeichnet diejenigen, die gerecht sind; die traditionelle und verständliche Wiedergabe lässt moralische und bundestheologische Bezüge offen.
- source_word: ἐκλάμψουσιν
  choice: werden leuchten
  rationale: Das Futur von ἐκλάμπω bezeichnet ein helles Leuchten. „Leuchten“ ist im heutigen Deutsch natürlich; die mögliche Nuance des Hervorleuchtens wird in einer Fußnote genannt.
- source_word: ὡς ὁ ἥλιος
  choice: wie die Sonne
  rationale: Bewahrt den ausdrücklich als Vergleich formulierten Bildgehalt.
- source_word: ἐν τῇ βασιλείᾳ
  choice: im Reich
  rationale: Der Ausdruck ist hier räumlich beziehungsweise sphärisch gefasst; „Reich“ passt zur Wendung „ihres Vaters“, ohne den Aspekt der Herrschaft auszuschließen.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: ihres Vaters
  rationale: Folgt dem Genitiv eng und fügt keine im Vers nicht vorhandene nähere Bestimmung wie „himmlischen“ hinzu.
- source_word: ὁ ἔχων ὦτα ἀκουέτω
  choice: Wer Ohren hat, der höre!
  rationale: Die im Deutschen idiomatische singularische Mahnform bewahrt den repräsentativen Singular und gibt den Imperativ mit dem auffordernden Konjunktiv wieder.
theological_decisions:
- issue: Bedeutungsumfang von βασιλεία
  choice: Reich
  alternative: Herrschaft
  rationale: Die Formulierung „im Reich ihres Vaters“ legt in diesem Zusammenhang den Bereich nahe, in dem die Gerechten leuchten. „Reich“ erhält diese Aussage, ohne Gottes Herrschaft als Bedeutungsaspekt auszuschließen.
- issue: Repräsentativer Singular in der Schlussmahnung
  choice: Wer Ohren hat, der höre!
  alternative: Alle, die Ohren haben, sollen hören.
  rationale: Die gewählte Form erhält den grammatischen Singular und seinen allgemeinen Geltungsanspruch, ohne ihn auf männliche Personen zu beschränken oder in einen Plural umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schlussformel „Wer Ohren hat, der höre!“ ist bewusst prägnant und feierlich; sie entspricht dem mahnenden Charakter des griechischen Imperativs.
