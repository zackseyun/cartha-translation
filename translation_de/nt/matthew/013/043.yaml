  source_fidelity: Die Übersetzung gibt die Abfolge von Τότε, das substantivierte οἱ δίκαιοι, das Zukunftsverb ἐκλάμψουσιν, den Sonnenvergleich sowie die lokativ verstandene Wendung ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν sachgerecht wieder. „Wer Ohren hat, der höre!“ ist eine treffende, idiomatische Entsprechung der singularischen Mahnform ὁ ἔχων ὦτα ἀκουέτω.
  naturalness: Modernes, klares und zugleich würdiges Standarddeutsch. „Dann werden die Gerechten leuchten …“ und die abschließende Formel lesen sich natürlich; das Ausrufezeichen passt zum auffordernden Charakter, ohne den Sinn zu verändern.
  terminology: „Die Gerechten“ entspricht dem etablierten deutschen biblischen Sprachgebrauch und lässt den Bedeutungsumfang offen. „Reich ihres Vaters“ bewahrt den räumlich-sphärischen Aspekt von βασιλεία, ohne „Herrschaft“ auszuschließen. Die Fußnote zu „leuchten“ dokumentiert die mögliche Präfixnuance von ἐκλάμπω angemessen.
