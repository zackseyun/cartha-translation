reference: Matthew 13:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: de
  text: Derjenige aber, der unter die Dornen gesät wurde, ist der, der das Wort hört; doch die Sorgen dieser Zeit[a] und die Täuschung des Reichtums[b] ersticken das Wort, und er wird unfruchtbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sorgen dieser Welt“. Wörtlicher: „die Sorge dieses Zeitalters“.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: „der trügerische Reiz des Reichtums“ oder „die Verführung durch Reichtum“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Was aber unter die Dornen gesät wurde
  rationale: Die Formulierung bewahrt zunächst das Bild vom ausgesäten Samen. „Unter die Dornen“ gibt εἰς idiomatisch und bildgerecht wieder; der anschließende Satz identifiziert das Gesäte mit dem hörenden Menschen.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: der, der das Wort hört
  rationale: Das substantivierte Präsenspartizip wird im Deutschen natürlich als Relativsatz wiedergegeben. „Das Wort“ wahrt den knappen Ausdruck für die verkündigte Botschaft.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: die Sorgen dieser Zeit
  rationale: μέριμνα bezeichnet belastende Sorge; der deutsche Plural ist hier idiomatisch. „Diese Zeit“ erhält den zeitlich-ethischen Sinn von αἰών, ohne ihn vorschnell mit der geschaffenen Welt gleichzusetzen.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: der trügerische Reiz des Reichtums
  rationale: Die Wendung macht die täuschende und verlockende Wirkung des Reichtums in natürlichem Deutsch deutlich. Eine formal nähere Wiedergabe wird in der Fußnote genannt.
- source_word: συμπνίγει
  choice: ersticken
  rationale: Das Verb bezeichnet ein gemeinsames Bedrängen bis zum Ersticken und führt das Dornenbild anschaulich fort. Das Prädikat steht im Deutschen wegen des zusammengesetzten Subjekts im Plural.
- source_word: ἄκαρπος γίνεται
  choice: er bleibt ohne Frucht
  rationale: Die persönliche Form folgt der Identifikation mit dem Hörenden. „Ohne Frucht bleiben“ ist natürliches Deutsch, wahrt die Bildsprache und gibt das Ergebnis von γίνεται im Kontext angemessen wieder.
theological_decisions:
- issue: Wiedergabe von αἰών
  choice: diese Zeit
  alternative: diese Welt
  rationale: αἰών bezeichnet primär ein Zeitalter beziehungsweise die gegenwärtige Zeitordnung. „Diese Zeit“ bewahrt diese Nuance; die traditionelle kontextuelle Alternative steht in der Fußnote.
- issue: Persönlicher oder unpersönlicher Bezug im Schlusssatz
  choice: er bleibt ohne Frucht
  alternative: es wird unfruchtbar / das Wort bleibt ohne Frucht
  rationale: Die Auslegung identifiziert das Gesäte ausdrücklich mit dem Menschen, der das Wort hört. Der persönliche Bezug vermeidet zugleich die Aussage, das Wort sei an sich unfruchtbar.
- issue: Genitiv bei ἀπάτη τοῦ πλούτου
  choice: der trügerische Reiz des Reichtums
  alternative: die Täuschung des Reichtums
  rationale: Der Genitiv kann die dem Reichtum eigene Täuschungsmacht ausdrücken. Die Hauptfassung vermittelt diese Wirkung, ohne festzulegen, dass Reichtum als handelnde Person täuscht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die landwirtschaftliche Bildsprache bleibt erhalten; schwerfällige Nominalformulierungen werden vermieden. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
