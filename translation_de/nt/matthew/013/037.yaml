base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: de
  text: 'Er antwortete: »Derjenige, der das gute Saatgut sät, ist der Menschensohn.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Er antwortete
  rationale: Die griechische Verbindung aus Partizip und finitem Verb lautet wörtlich etwa »antwortend sagte er«. Im natürlichen modernen Deutsch gibt »Er antwortete« die einleitende Redeformel vollständig und ohne störende Doppelung wieder.
- source_word: Ὁ σπείρων
  choice: Der ... sät
  rationale: Das substantivierte Präsenspartizip bezeichnet die Person durch ihre Tätigkeit. Die Relativkonstruktion bewahrt diesen Sinn und klingt im Deutschen natürlicher als eine übermäßig wörtliche Partizipialform.
- source_word: τὸ καλὸν σπέρμα
  choice: das gute Saatgut
  rationale: καλός bezeichnet hier das Gute beziehungsweise Taugliche. σπέρμα steht kollektiv; »Saatgut« bewahrt diesen kollektiven landwirtschaftlichen Sinn und vermeidet die mögliche Mehrdeutigkeit von »Samen«.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: »Menschensohn« ist die etablierte deutsche Wiedergabe der Selbstbezeichnung Jesu und bewahrt ihre Verbindung zu Daniel 7 sowie ihren besonderen Klang in den Evangelien.
theological_decisions:
- issue: Wiedergabe des christologischen Ausdrucks υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: Die traditionelle Bezeichnung bewahrt die intertextuelle und theologische Spannung des Ausdrucks, ohne ihn auf eine bloße Aussage über Menschlichkeit festzulegen. Eine Fußnote ist nicht nötig, da »Menschensohn« im Deutschen etabliert und hier sachlich am genauesten ist.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe erklärende Aussageform und die bildhafte Sprache des Gleichnisses bleiben erhalten; die griechische Doppelung in der Redeeinleitung wird idiomatisch zusammengezogen.
