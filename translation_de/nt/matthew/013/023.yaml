  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: de
  text: 'Der aber auf den guten Boden gesät wurde, ist derjenige, der das Wort hört und versteht. Er trägt wirklich Frucht und bringt Ertrag hervor: der eine hundertfach, der andere sechzigfach und der andere dreißigfach.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der eine hundert, der andere sechzig und der andere dreißig«; gemeint sind unterschiedlich hohe Erträge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: auf den guten Boden
  rationale: Im landwirtschaftlichen Bild bezeichnet γῆ den Boden, der die Saat aufnimmt; καλός meint hier geeigneten beziehungsweise fruchtbaren Boden.
- source_word: σπαρείς
  choice: gesät wurde
  rationale: Das passive Aoristpartizip wird als Relativsatz wiedergegeben; so bleibt das Bild vom ausgesäten Samen erhalten und der deutsche Satz klingt natürlich.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: der, der das Wort hört
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet den Menschen durch sein kennzeichnendes Handeln. »Das Wort« wahrt die biblische Ausdrucksweise und den Bezug zur vorausgehenden Deutung.
- source_word: συνιείς
  choice: versteht
  rationale: συνίημι bezeichnet hier das Erfassen des gehörten Wortes. Das im Deutschen nicht wiederholte Objekt ist aus »das Wort« eindeutig erschließbar.
- source_word: δὴ
  choice: tatsächlich
  rationale: Die Partikel verstärkt die Aussage über das Fruchtbringen; »tatsächlich« gibt diesen Nachdruck zurück, ohne ihn zu überzeichnen.
- source_word: καρποφορεῖ
  choice: bringt Frucht
  rationale: Die Formulierung bewahrt das zentrale landwirtschaftliche und zugleich bildhafte Motiv.
- source_word: ποιεῖ
  choice: trägt Ertrag
  rationale: ποιεῖ bezeichnet im Kontext das Hervorbringen des jeweiligen Ertrags. Eine eigene Verbformulierung bewahrt die beiden griechischen Prädikate, ohne das unidiomatische »macht« zu verwenden.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: der eine hundertfach, der andere sechzigfach und der andere dreißigfach
  rationale: Die distributive Konstruktion beschreibt unterschiedliche Erträge. »-fach« verdeutlicht im Deutschen knapp den aus dem Saatbild erschließbaren Vergleich mit der ausgesäten Menge, obwohl ein entsprechendes Wort im Griechischen nicht ausdrücklich steht; dies wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Art der Reaktion auf das Wort im Gleichnis
  choice: Der Hörer auf gutem Boden hört, versteht und bringt in unterschiedlichem Maß Frucht.
  alternative: Die Übersetzung könnte ausdrücklich Beharrlichkeit, echte Bekehrung oder Wiedergeburt nennen.
  rationale: Der griechische Text nennt Hören, Verstehen und Fruchtbringen, ordnet diese aber nicht ausdrücklich späteren dogmatischen Kategorien zu. Die Übersetzung belässt die Aussage in den Kategorien des Verses.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewöhnliche Formulierung »auf den guten Boden gesät wurde« bleibt nahe am griechischen Bild, in dem der ausgesäte Same für den Hörer steht. »Ertrag tragen« ist bewusst gewählt, um καρποφορεῖ und ποιεῖ getrennt wiederzugeben.
