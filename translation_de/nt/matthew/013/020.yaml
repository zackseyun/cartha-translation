source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: de
  text: Der aber auf felsigen Boden Gesäte[a] ist derjenige, der das Wort hört und es sofort mit Freude aufnimmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der auf die felsigen Stellen Gesäte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Der aber auf felsigen Boden Gesäte
  rationale: Die substantivierte Passivpartizipialkonstruktion bleibt erhalten und bewahrt die verdichtete Bildsprache, in der das Gesäte zugleich auf den dargestellten Menschen bezogen wird. δέ wird als milder Übergang mit „aber“ wiedergegeben.
- source_word: πετρώδη
  choice: felsiger Boden
  rationale: Die Wendung bezeichnet felsiges beziehungsweise steiniges Gelände. „Felsiger Boden“ klingt im modernen Deutschen natürlich und wahrt das landwirtschaftliche Bild.
- source_word: σπαρείς
  choice: Gesäte
  rationale: Das substantivierte Partizip bewahrt den passiven Vorgang des Säens knapp und quellennah.
- source_word: οὗτός ἐστιν
  choice: ist der
  rationale: Die Identifikationsformel wird direkt wiedergegeben, ohne sie deutend zu „steht für“ oder „bezeichnet“ auszuweiten.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: der, der das Wort hört
  rationale: Das präsentische Partizip wird als natürlicher deutscher Relativsatz wiedergegeben. „Das Wort“ erhält die Ausdrucksweise und den thematischen Zusammenhang des Abschnitts.
- source_word: εὐθὺς
  choice: sofort
  rationale: „Sofort“ ist eine klare und gegenwärtige Entsprechung, die die unmittelbare Reaktion betont.
- source_word: μετὰ χαρᾶς
  choice: mit Freude
  rationale: Die Präpositionalphrase wird eng und idiomatisch wiedergegeben; das Substantiv „Freude“ bleibt erhalten.
- source_word: λαμβάνων αὐτόν
  choice: es aufnimmt
  rationale: „Aufnehmen“ gibt hier das annehmende Empfangen des Wortes natürlich wieder. Das Pronomen „es“ verweist eindeutig auf „das Wort“.
theological_decisions:
- issue: Bezug des Gesäten in der Deutung des Gleichnisses
  choice: Die verdichtete Metapher wird als „der ... Gesäte“ bewahrt; erst der folgende Satzteil identifiziert ihn als den Hörenden.
  alternative: 'Deutender formulieren: „Was auf felsigen Boden gesät wurde, steht für den Menschen, der ...“'
  rationale: Der griechische Text verbindet Saatbild und dargestellte Person auffällig eng. Die Übersetzung wahrt diese Spannung, statt sie durch eine erklärende Paraphrase aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung „der ... Gesäte“ ist bewusst quellennah; die Fußnote bietet die noch formalere räumliche Wiedergabe.
