id: MAT.13.21
reference: Matthew 13:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: de
  text: Doch er hat keine Wurzel in sich, sondern hält nur eine Zeit lang durch. Wenn wegen des Wortes Bedrängnis oder Verfolgung einsetzt, kommt er sofort zu Fall.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nimmt er sofort Anstoß“ oder „wendet er sich sofort ab“. Das griechische Verb kann bedeuten, dass jemand zu Fall gebracht wird, Anstoß nimmt oder vom bisherigen Weg abkommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: Wurzel in sich
  rationale: Bewahrt das Bild der Wurzel aus dem Gleichnis und gibt die reflexive Wendung ohne zusätzliche Deutung wieder.
- source_word: πρόσκαιρός
  choice: hält nur eine Zeit lang durch
  rationale: Gibt die zeitlich begrenzte Beständigkeit der Person in natürlichem Deutsch wieder. Das wörtlichere „ist nur vorübergehend“ wäre bei einer Person unidiomatisch.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: wenn ... Bedrängnis oder Verfolgung einsetzt
  rationale: Gibt den Genitivus absolutus als temporalen Nebensatz wieder. „Einsetzt“ vermittelt das Eintreten der belastenden Umstände natürlich.
- source_word: θλίψεως
  choice: Bedrängnis
  rationale: Bewahrt den Sinn von Druck und Not und ist im modernen Standarddeutsch verständlich.
- source_word: διωγμοῦ
  choice: Verfolgung
  rationale: Ist die präzise und etablierte deutsche Entsprechung für feindseliges Vorgehen aufgrund der Bindung an die Botschaft.
- source_word: διὰ τὸν λόγον
  choice: wegen des Wortes
  rationale: Bewahrt die lexikalische Verbindung zu λόγος und den Sprachgebrauch des Gleichnisses; gemeint ist die verkündete Botschaft.
- source_word: εὐθὺς
  choice: sofort
  rationale: Gibt die betonte Unmittelbarkeit knapp und idiomatisch wieder.
- source_word: σκανδαλίζεται
  choice: kommt ... zu Fall
  rationale: Bewahrt das Bild des Stolperns beziehungsweise Fallens und bezeichnet im Kontext das Scheitern unter Druck, ohne dessen theologische Tragweite enger festzulegen.
theological_decisions:
- issue: Bedeutung von σκανδαλίζεται im Kontext von Nachfolge und Gleichnis
  choice: kommt ... zu Fall
  alternative: nimmt Anstoß; wendet sich ab
  rationale: „Kommt zu Fall“ lässt sowohl das durch äußeren Druck verursachte Straucheln als auch das daraus folgende Scheitern erkennen. Die Alternativen werden in einer Fußnote genannt, damit die lexikalische und theologische Spannung erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Sätze sorgen für einen natürlichen Lesefluss. „Hält nur eine Zeit lang durch“ ist idiomatischer als eine formale Beschreibung der Person als „vorübergehend“, während das Wurzelbild und die Mehrdeutigkeit von σκανδαλίζεται erhalten bleiben.
