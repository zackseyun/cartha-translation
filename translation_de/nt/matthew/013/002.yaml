id: MAT.13.2
reference: Matthew 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: de
  text: Und große Menschenmengen versammelten sich zu ihm, sodass er in ein Boot stieg und sich setzte, und die ganze Menge stand am Ufer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: versammelten sich bei ihm
  rationale: Das formal passive συνήχθησαν wird im Deutschen natürlich reflexiv-intransitiv wiedergegeben. »Bei ihm« verbindet die Bewegung zu Jesus hin mit dem entstandenen Beisammensein, ohne ausdrücklich »um ihn« zu ergänzen.
- source_word: ὄχλοι πολλοί
  choice: große Menschenmengen
  rationale: Der Plural bleibt erhalten; »große Menschenmengen« ist idiomatischer als »viele Menschenmengen« und gibt die Vielzahl beziehungsweise Größe der versammelten Gruppen wieder.
- source_word: ὥστε
  choice: sodass
  rationale: Die Konjunktion bezeichnet hier die Folge des starken Andrangs.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: in ein Boot stieg
  rationale: Die Verbindung aus εἰς und ἐμβαίνω bezeichnet das Einsteigen in beziehungsweise Betreten eines Bootes; »in ein Boot stieg« ist natürlich und präzise.
- source_word: καθῆσθαι
  choice: sich setzte
  rationale: Die mediale Form wird idiomatisch mit »sich setzte« wiedergegeben und beschreibt Jesu Sitzposition im Boot.
- source_word: πᾶς ὁ ὄχλος
  choice: die ganze Menge
  rationale: Der Wechsel vom Plural zu einer kollektiv verstandenen Einzahl wird bewahrt.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: am Ufer
  rationale: αἰγιαλός kann Strand oder Ufer bezeichnen. »Am Ufer« ist im Kontext des Bootes neutral und natürlich; das Akkusativobjekt nach ἐπί bezeichnet hier die räumliche Lage, nicht zwingend eine Bewegung.
- source_word: εἱστήκει
  choice: stand
  rationale: 'Das griechische Plusquamperfekt hat bei ἵστημι resultativ-statischen Sinn: Die Menge befand sich stehend am Ufer. Das deutsche Präteritum gibt diesen Zustand natürlich wieder.'
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Satzführung. Das adversativ beziehungsweise szenisch weiterführende καί vor πᾶς ὁ ὄχλος wird als »aber« wiedergegeben, um den räumlichen Kontrast zwischen Jesus im Boot und der Menge am Ufer natürlich auszudrücken. Keine Fußnoten nötig, da die Bedeutungsbreite von αἰγιαλός durch »Ufer« angemessen abgedeckt wird.
