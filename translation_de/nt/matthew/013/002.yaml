- from: Und große Menschenmengen versammelten sich bei ihm, sodass er in ein Boot stieg und sich setzte; die ganze Menge aber stand am Ufer.
  to: Und große Menschenmengen versammelten sich zu ihm, sodass er in ein Boot stieg und sich setzte, und die ganze Menge stand am Ufer.
  rationale: Die Revision stellt die Bewegungsrichtung von πρὸς αὐτόν mit »zu ihm« wieder her und ersetzt das interpretierend-adversative »aber« durch das koordinierende »und«. Im Übrigen bleibt die natürliche, moderne Formulierung des Entwurfs erhalten.
  reviewer_model: gpt-5.6-terra
