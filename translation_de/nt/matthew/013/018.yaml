  text: Ὑμεῖς οὖν ἀκούσατε τὴν παραβολὴν τοῦ ⸀σπείραντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: de
  text: Hört nun ihr das Gleichnis von dem, der gesät hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gleichnis vom Sämann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ihr
  rationale: Das ausdrücklich gesetzte Pronomen ist im Griechischen hervorgehoben. Das eigenständige „Ihr“ bewahrt diesen Nachdruck und unterscheidet die Angesprochenen vom zuvor erwähnten Personenkreis.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ gibt den folgernden und zugleich überleitenden Charakter der Partikel in diesem Zusammenhang knapp wieder.
- source_word: ἀκούσατε
  choice: hört
  rationale: Der Aorist-Imperativ der zweiten Person Plural wird als unmittelbare Aufforderung wiedergegeben. „Hört“ wahrt die Grundbedeutung; „versteht“ würde die Aussage stärker auslegen, als es das Verb selbst verlangt.
- source_word: τὴν παραβολὴν
  choice: das Gleichnis
  rationale: „Gleichnis“ ist im synoptischen Lehrkontext die geläufige und sachlich genaue Wiedergabe von παραβολή.
- source_word: τοῦ σπείραντος
  choice: von dem, der säte
  rationale: Die Formulierung bildet das substantivierte aoristische Partizip und seinen rückblickenden Aspekt unmittelbar ab, ohne es stillschweigend zu einem festen Titel zu machen.
theological_decisions:
- issue: Bezeichnung der handelnden Person im Gleichnis
  choice: von dem, der säte
  alternative: vom Sämann
  rationale: Die Hauptfassung hält sich eng an das griechische substantivierte Partizip. Die geläufige Bezeichnung „Sämann“ bleibt als idiomatische Alternative in der Fußnote erhalten; keine der Fassungen verändert die inhaltliche Deutung des Gleichnisses.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Wortstellung „Ihr nun“ ist bewusst etwas gehoben, um die im Griechischen ausdrücklich hervorgehobene Anrede sichtbar zu halten; das Imperativische bleibt knapp und unmittelbar.
