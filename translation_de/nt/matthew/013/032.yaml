id: MAT.13.32
reference: Matthew 13:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: de
  text: Es ist zwar kleiner als alle Samenkörner, doch wenn es gewachsen ist, ist es größer als die Gartenpflanzen und wird zu einem Baum, sodass die Vögel des Himmels[a] kommen und in seinen Zweigen nisten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Vögel der Luft“.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild von Vögeln, die sich in den Zweigen niederlassen, kann an alttestamentliche Darstellungen eines großen Reichsbaums erinnern (zum Beispiel Ezechiel 17,23; Daniel 4,9.18); der Vers selbst erklärt diese Bildsprache jedoch nicht ausdrücklich.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: kleiner als alle Samenkörner
  rationale: Der griechische Komparativ wird transparent als Vergleich wiedergegeben. „Samenkörner“ bezeichnet hier natürlich die einzelnen ausgesäten Körner, ohne den Ausdruck auf eine bestimmte landwirtschaftliche Kategorie zu verengen.
- source_word: μέν ... δέ
  choice: zwar ... doch
  rationale: Das deutsche Korrelat markiert natürlich und deutlich den Gegensatz zwischen dem kleinen Anfang und dem späteren Wachstum.
- source_word: ὅταν ... αὐξηθῇ
  choice: wenn es gewachsen ist
  rationale: Die Form betrachtet das Wachstum als abgeschlossen, bevor Größe und Ergebnis beschrieben werden.
- source_word: μεῖζον τῶν λαχάνων
  choice: größer als die Gartenpflanzen
  rationale: λάχανα meint angebaute Pflanzen eines Gartens. „Gartenpflanzen“ ist weiter und weniger missverständlich als „Gemüse“ oder „Kräuter“.
- source_word: γίνεται δένδρον
  choice: wird zu einem Baum
  rationale: Die bildhafte Aussage des Griechischen wird weder abgeschwächt noch botanisch umgedeutet.
- source_word: ὥστε ἐλθεῖν
  choice: sodass ... kommen
  rationale: Die Konstruktion bezeichnet die Folge des beschriebenen Wachstums; „sodass“ gibt diesen Zusammenhang idiomatisch wieder.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel des Himmels
  rationale: Die Wendung bildet das griechische τοῦ οὐρανοῦ eng ab und ist im Deutschen als gehobene, aber verständliche biblische Bildsprache natürlich.
- source_word: κατασκηνοῦν
  choice: nisten
  rationale: Im Zusammenhang mit Vögeln und Zweigen bezeichnet das Verb anschaulich das Sich-Niederlassen beziehungsweise Nisten.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: in seinen Zweigen
  rationale: Die lokale Bedeutung wird direkt wiedergegeben; das Pronomen bezieht sich eindeutig auf den Baum.
theological_decisions:
- issue: Möglicher Anklang an alttestamentliche Bilder eines großen Reichsbaums
  choice: Das Bild bleibt im Haupttext wörtlich und wird nicht ausdrücklich gedeutet.
  alternative: Die Vögel unmittelbar als Völker oder Nationen auslegen, die im Reich Gottes Schutz finden.
  rationale: Die Formulierung kann an Ezechiel 17,23 und Daniel 4,9.18 erinnern, doch der Vers selbst erklärt die Symbolik nicht. Die Übersetzung bewahrt daher den möglichen theologischen Anklang, ohne eine Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdiger biblischer Bildsprache. „Zwar ... doch“ hält den Kontrast deutlich; „Gartenpflanzen“ vermeidet unnötige botanische Verengung. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Bildern.
