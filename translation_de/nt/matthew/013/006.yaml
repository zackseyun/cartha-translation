  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: de
  text: Als aber die Sonne aufging, wurde es versengt, und weil es keine Wurzel hatte, verdorrte es.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trocknete es aus“.'
    reason: Lexikalische Alternative für ἐξηράνθη; „verdorren“ passt besonders gut zum Pflanzenbild, während „austrocknen“ den Grundsinn stärker hervorhebt.
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Als aber die Sonne aufging
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand. „Als … aufging“ ist im Deutschen natürlich; „aber“ gibt das leicht kontrastierende beziehungsweise fortführende δέ wieder.
- source_word: ἐκαυματίσθη
  choice: wurde es versengt
  rationale: Das Passiv von καυματίζω bezeichnet hier die Schädigung einer Pflanze durch Hitze. „Versengt“ bewahrt das Bild, ohne bereits das vollständige Absterben auszudrücken.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: weil es keine … hatte
  rationale: διά mit substantiviertem Infinitiv drückt einen Grund aus. Ein kausaler Nebensatz gibt dies in natürlichem modernem Deutsch genau wieder.
- source_word: ῥίζαν
  choice: Wurzel
  rationale: Der griechische Text verwendet den Singular; auch im Deutschen ist „keine Wurzel haben“ in diesem Bild verständlich und idiomatisch.
- source_word: ἐξηράνθη
  choice: verdorrte es
  rationale: ξηραίνω bezeichnet im Pflanzenkontext das Austrocknen beziehungsweise Verdorren. „Verdorrte“ ist hier die natürliche und bildlich treffende deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Satzbau und Bildsprache des griechischen Textes. Das sächliche Pronomen „es“ nimmt das im vorausgehenden Kontext ausgesäte beziehungsweise aufgegangene Gewächs auf.
