  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: de
  text: Wer Ohren hat, der höre!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Wer … hat
  rationale: Der substantivierte Artikel mit Partizip bezeichnet allgemein jeden Menschen, auf den die Aussage zutrifft. Die deutsche Konstruktion „Wer … hat“ gibt diesen generischen Sinn natürlich wieder, ohne ein Geschlecht festzulegen.
- source_word: ὦτα
  choice: Ohren
  rationale: Der griechische Text verwendet den Plural. „Ohren“ bewahrt sowohl die grammatische Zahl als auch die bildhafte Redewendung.
- source_word: ἀκουέτω
  choice: der höre
  rationale: Der Imperativ der dritten Person Singular wird durch den deutschen Jussiv mit Konjunktiv I prägnant und würdig wiedergegeben. „Hören“ bewahrt den Wortlaut und schließt im Zusammenhang aufmerksames Erfassen und Annehmen ein.
theological_decisions:
- issue: Generische Personenbezeichnung
  choice: Wer Ohren hat, der höre!
  alternative: Wer Ohren hat, soll hören!
  rationale: „Wer“ ist im Deutschen geschlechtsübergreifend und wahrt den generischen Singular. „Der höre“ erhält zudem die direkte Aufforderung des griechischen Imperativs; „soll hören“ wäre zwar moderner, könnte aber eher wie eine bloße Verpflichtung oder Empfehlung wirken.
translation_notes:
  register: Knapp, einprägsam und würdig. Die jussive Form „der höre“ ist leicht gehoben, im Deutschen jedoch verständlich und für den markanten Ausspruch angemessen.
