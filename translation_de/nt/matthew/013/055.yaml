  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: de
  text: Ist das nicht der Sohn des Zimmermanns? Heißt seine Mutter nicht Maria, und heißen seine Brüder nicht Jakobus, Josef[b], Simon und Judas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Verwandten. Das griechische Wort bedeutet gewöhnlich „Brüder“, wird hier aber von manchen in einem weiteren Sinn verstanden.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften haben „Joses“ statt „Josef“.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: Zimmermanns
  rationale: τέκτων bezeichnet einen Handwerker, besonders im Holz- oder Baugewerbe. „Zimmermann“ ist hier die natürliche, traditionelle deutsche Wiedergabe, ohne den möglichen handwerklichen Bedeutungsumfang unnötig einzuengen.
- source_word: υἱός
  choice: Sohn
  rationale: Der unmittelbare Familienzusammenhang verlangt die gewöhnliche Bedeutung „Sohn“.
- source_word: λέγεται
  choice: heißt
  rationale: Das passive λέγεται bedeutet in diesem Namenskontext idiomatisch „heißt“; die einmalige griechische Verbform wird im Deutschen zur natürlichen Koordination bei den anschließend genannten Brüdern sinngemäß wieder aufgenommen.
- source_word: Μαριὰμ
  choice: Maria
  rationale: „Maria“ ist die etablierte deutsche Namensform.
- source_word: ἀδελφοὶ
  choice: Brüder
  rationale: Die gewöhnliche lexikalische Bedeutung ist „Brüder“. Eine mögliche weitere Verwandtschaftsbezeichnung wird in einer Fußnote genannt, damit die Übersetzung die theologische Streitfrage nicht vorentscheidet.
- source_word: Ἰάκωβος
  choice: Jakobus
  rationale: „Jakobus“ ist die übliche deutsche neutestamentliche Namensform.
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: Der SBLGNT-Haupttext liest Ἰωσήφ, auf Deutsch „Josef“. Die Variante Ἰωσῆς wird in einer Fußnote dokumentiert.
- source_word: Σίμων
  choice: Simon
  rationale: Übliche deutsche Wiedergabe des Namens.
- source_word: Ἰούδας
  choice: Judas
  rationale: „Judas“ ist die übliche deutsche neutestamentliche Wiedergabe dieses griechischen Namens.
- source_word: οὐχ ... ;
  choice: Ist das nicht ...? Heißt ... nicht ...?
  rationale: οὐχ leitet rhetorische Fragen ein, die Zustimmung erwarten. Die ausgeschriebene deutsche Form bewahrt Ton und Struktur.
theological_decisions:
- issue: Bedeutung von ἀδελφοὶ αὐτοῦ im Blick auf Jesu Familie
  choice: Im Haupttext mit „seine Brüder“ wiedergeben
  alternative: seine Verwandten oder Angehörigen
  rationale: „Brüder“ ist die gewöhnliche Oberflächenbedeutung des griechischen Wortes. Die Übersetzung soll weder die genaue biologische Beziehung festlegen noch eine Lehrposition zur immerwährenden Jungfräulichkeit Marias voraussetzen; die breitere Deutungsmöglichkeit steht deshalb in einer Fußnote.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die zwei rhetorischen Fragen bleiben erhalten. Das Verb „heißen“ wird bei der Namensliste wiederholt, um im Deutschen eindeutig und natürlich zu klingen. Sämtliche Fußnotenmarker stehen unmittelbar an den jeweils betroffenen Stellen im Haupttext.
