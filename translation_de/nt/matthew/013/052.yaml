source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: de
  text: 'Da sagte er zu ihnen: »Deshalb gleicht jeder Schriftgelehrte, der für das Himmelreich geschult worden ist,[a] einem Hausherrn,[b] der aus seinem Schatz[c] Neues und Altes hervorholt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der zu einem Jünger des Himmelreichs gemacht worden ist«. Das griechische Partizip kann sowohl das Zum-Jünger-Machen als auch Unterweisung oder Schulung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »Herr des Hauses« oder »Haushaltsvorstand«.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann auch einen Vorrat oder einen Aufbewahrungsort für Wertvolles bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Deshalb
  rationale: Gibt den folgernden Anschluss an das vorausgehende Gespräch knapp und natürlich wieder.
- source_word: πᾶς γραμματεὺς
  choice: jeder Schriftgelehrte
  rationale: Bewahrt die übliche sachliche Bedeutung von γραμματεύς und vermeidet die Verengung auf eine bloß allgemeine Lehrtätigkeit.
- source_word: μαθητευθεὶς
  choice: der … geschult worden ist
  rationale: Die passive Form bezeichnet eine prägende Unterweisung und kann zugleich das Zum-Jünger-Gemachtwerden einschließen. »Geschult« ist im Deutschen verständlich, ohne die mögliche Jüngerschaftsbedeutung auszuschließen; diese wird in der Fußnote genannt.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: für das Himmelreich
  rationale: Der ungewöhnliche Dativ wird als Ausrichtung beziehungsweise Bezug verstanden. »Für das Himmelreich« bleibt knapp und bewahrt den matthäischen Ausdruck.
- source_word: ὅμοιός ἐστιν
  choice: gleicht
  rationale: Natürliches und würdiges deutsches Vergleichswort, das die Bildrede klar kennzeichnet.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: einem Hausherrn
  rationale: Bezeichnet den verantwortlichen Herrn beziehungsweise Leiter eines Hauses oder Haushalts prägnant, ohne modernen Immobilienbesitz in den Vordergrund zu rücken.
- source_word: ἐκβάλλει
  choice: hervorholt
  rationale: Im Zusammenhang mit einem Vorrat bedeutet das Verb, etwas aus dem Aufbewahrungsort herauszubringen; »hervorholt« vermeidet die sonst häufige, hier irreführende Bedeutung »hinauswerfen«.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: aus seinem Vorrat
  rationale: θησαυρός kann sowohl einen Schatz als auch den Ort beziehungsweise Bestand der Aufbewahrung bezeichnen. »Vorrat« passt zur Tätigkeit des Hausherrn; die Wertbedeutung bleibt als Alternative in der Fußnote erhalten.
- source_word: καινὰ καὶ παλαιά
  choice: Neues und Altes
  rationale: Gibt die substantivierten neutralen Adjektive in ihrer griechischen Reihenfolge knapp und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von μαθητευθεὶς in Verbindung mit dem Schriftgelehrten und dem Himmelreich
  choice: Ein Schriftgelehrter, der für das Himmelreich geschult worden ist
  alternative: Ein Schriftgelehrter, der ein Jünger des Himmelreichs geworden beziehungsweise dazu gemacht worden ist
  rationale: Die Form kann Unterweisung wie auch das Zum-Jünger-Machen ausdrücken. Der Haupttext bewahrt die formative passive Bedeutung, während die Fußnote die ausdrücklichere Jüngerschaftslesart offenhält; eine Festlegung auf Bekehrung oder amtliche Ausbildung wird vermieden.
- issue: Rolle des οἰκοδεσπότης im Gleichnis
  choice: Hausherr
  alternative: Haushaltsvorstand beziehungsweise Herr des Hauses
  rationale: Die Wiedergabe erhält die Leitungs- und Verfügungsrolle innerhalb des Haushalts, ohne daraus weitergehende soziale oder lehrmäßige Aussagen abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Schriftgelehrter«, »Himmelreich« und »Hausherr« sind etablierte biblische Begriffe, bleiben aber heutigen Leserinnen und Lesern verständlich. Die Satzstellung folgt natürlichem Deutsch; die Reihenfolge »Neues und Altes« wird nach dem Griechischen bewahrt.
