source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: de
  text: 'Er erzählte ihnen ein weiteres Gleichnis: »Das Himmelreich gleicht einem Sauerteig[a], den eine Frau nahm und in drei Sea Mehl[b] verbarg[c], bis alles durchsäuert war.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gärmittel«. Das griechische Wort bezeichnet ein Triebmittel für Teig.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »drei Sea Mehl«. Ein Sea war ein antikes Hohlmaß; drei Sea entsprechen ungefähr 22 Litern und ergeben eine große Teigmenge.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »hineinverbarg«; dem Backvorgang nach auch: »untermischte« oder »einarbeitete«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Er erzählte ihnen ein weiteres Gleichnis
  rationale: Die Wiedergabe ist im deutschen Erzählzusammenhang natürlich und bewahrt den additiven Sinn von ἄλλην.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Die im Deutschen geläufige und prägnante Wiedergabe der matthäischen Wendung bewahrt den Gedanken der Herrschaft Gottes, ohne den semitisch geprägten Plural von οὐρανῶν unnötig nachzubilden.
- source_word: ζύμῃ
  choice: Sauerteig
  rationale: ζύμη bezeichnet ein gärendes Triebmittel; »Sauerteig« ist in der antiken Backpraxis sachgerecht und bewahrt die bildhafte sowie wertungsneutrale Funktion.
- source_word: ἐνέκρυψεν εἰς
  choice: unter … verbarg
  rationale: Dies bewahrt die auffällige wörtliche Bedeutung »hineinverbergen«, statt sie stillschweigend als bloßes Vermischen zu deuten.
- source_word: ἀλεύρου σάτα τρία
  choice: drei Sea Mehl
  rationale: Die antike Maßeinheit wird formal bewahrt; eine Fußnote erklärt, dass es sich insgesamt um eine große Menge handelt.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: bis das Ganze durchsäuert war
  rationale: Die Formulierung erhält das Passiv und den umfassenden Sinn von ὅλον, ohne das Bezugswort interpretierend als »Teig« oder »Masse« festzulegen.
theological_decisions:
- issue: Wertung des Sauerteigs im Gleichnis vom Himmelreich
  choice: Das Bild wird mit »Sauerteig« neutral wiedergegeben.
  alternative: Den Sauerteig aufgrund anderer biblischer Stellen ausdrücklich negativ verstehen oder durch »Hefe« ausschließlich als alltägliches Backbild darstellen.
  rationale: Der Vers selbst erklärt die moralische oder theologische Wertung des Bildes nicht. Die Übersetzung bewahrt deshalb die Spannung und hebt lediglich die verborgene, alles durchdringende Wirkung hervor.
- issue: Bedeutung von βασιλεία τῶν οὐρανῶν
  choice: Himmelreich
  alternative: Königsherrschaft der Himmel / Herrschaft des Himmels
  rationale: »Himmelreich« ist eine natürliche deutsche Wiedergabe der matthäischen Formel. Sie sollte nicht so ausgelegt werden, als sei lediglich ein räumlicher Aufenthaltsort im Himmel gemeint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Himmelreich« und »Sauerteig« sind vertraut und bildkräftig; die ungewöhnliche Formulierung »unter … verbarg« wahrt bewusst die Eigenart des griechischen Verbs. Die historische Maßeinheit »Sea« wird im Text beibehalten und unmittelbar in einer Fußnote erklärt.
