revisions:
- from: 'Er erzählte ihnen ein weiteres Gleichnis: »Das Himmelreich gleicht einem Sauerteig[a], den eine Frau nahm und unter drei Sea Mehl[b] verbarg[c], bis das Ganze durchsäuert war.«'
  to: 'Er erzählte ihnen ein weiteres Gleichnis: »Das Himmelreich gleicht einem Sauerteig[a], den eine Frau nahm und in drei Sea Mehl[b] verbarg[c], bis alles durchsäuert war.«'
  rationale: Die Revision korrigiert die Richtungsaussage des griechischen Verbs, berichtigt die historische Mengenangabe und entfernt eine unnötig einengende sachliche Festlegung zur Art des Sauerteigs. Sie bewahrt zugleich die bewusste wörtliche Eigenart des Bildes sowie dessen theologische Wertungsneutralität.
