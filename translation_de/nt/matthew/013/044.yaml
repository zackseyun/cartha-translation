  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: de
  text: Das Himmelreich gleicht einem Schatz, der in einem Feld verborgen ist. Ein Mann fand ihn und verbarg ihn. Voller Freude geht er hin, verkauft alles, was er hat, und kauft jenes Feld.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν
  choice: Das Himmelreich gleicht
  rationale: Die im Deutschen geläufige Matthäusformel gibt den Vergleich natürlich und würdig wieder. „Himmelreich“ bewahrt den traditionellen Ausdruck, ohne βασιλεία einseitig als Gebiet oder Herrschaftsvorgang festzulegen.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: einem Schatz, der in einem Feld verborgen war
  rationale: Der indefinite Dativ wird als „einem Schatz“ wiedergegeben. „Verborgen war“ bildet den durch das Perfektpartizip bezeichneten Zustand natürlich ab; der griechische Artikel bei ἀγρός verlangt hier im Deutschen keine bestimmte Referenz.
- source_word: ὃν εὑρὼν ἄνθρωπος ἔκρυψεν
  choice: Ein Mann fand ihn und verbarg ihn wieder
  rationale: Die Aufteilung in einen neuen Satz sorgt für klares, heutiges Deutsch. „Ein Mann“ entspricht dem maskulinen ἄνθρωπος; „wieder“ macht im Deutschen deutlich, dass der zuvor verborgene Schatz nach dem Finden erneut verborgen wird, ohne einen neuen Handlungsschritt hinzuzufügen.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: Voller Freude
  rationale: Die Wendung bewahrt sowohl den emotionalen Zustand als auch die motivierende Kraft der Freude und klingt natürlicher als das wörtliche „aus seiner Freude“.
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: geht er hin, verkauft alles, was er hat
  rationale: Die präsentischen Verben werden als lebendiges Erzählpräsens erhalten. „Alles, was er hat“ gibt die umfassende Bedeutung von πάντα ὅσα ἔχει genau und idiomatisch wieder.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: kauft jenes Feld
  rationale: „Jenes Feld“ bildet das Demonstrativpronomen ἐκεῖνον ab und verweist gezielt auf das Feld mit dem Schatz.
theological_decisions:
- issue: Bedeutungsumfang von βασιλεία τῶν οὐρανῶν
  choice: Himmelreich
  alternative: Herrschaft des Himmels
  rationale: „Himmelreich“ ist im Deutschen die etablierte matthäische Bezeichnung und lässt offen, ob in der jeweiligen Deutung Gottes Herrschaft, deren Wirklichkeit oder ihr Bereich im Vordergrund steht.
- issue: Geschlechtsbezogene Wiedergabe von ἄνθρωπος
  choice: ein Mann
  alternative: ein Mensch
  rationale: Die maskuline Einzelfigur der Erzählung wird quellentreu wiedergegeben; ihre beispielhafte Funktion wird dadurch nicht eingeschränkt.
- issue: Erneutes Verbergen des Schatzes
  choice: verbarg ihn wieder
  alternative: verbarg ihn
  rationale: Das griechische ἔκρυψεν bedeutet formal nur „verbarg“. Im Erzählzusammenhang war der Schatz jedoch bereits verborgen und wurde gefunden; „wieder“ verdeutlicht daher den naheliegenden Ablauf, ohne dessen ethische oder rechtliche Bewertung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Gleichnisstil. Kurze Sätze entlasten die komplexe griechische Periodenstruktur; das Erzählpräsens und die Spannung des Textes bleiben erhalten.
