id: MAT.13.28
reference: Matthew 13:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the servants said to him, “Do you want us to go and gather them up?”
translation:
  language: de
  text: 'Er sagte zu ihnen: »Das hat ein Feind getan.« Da sagten die Sklaven[a] zu ihm: »Willst du also, dass wir hingehen und das Unkraut einsammeln?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener«.'
    reason: Lexikalische Alternative für δοῦλοι, das je nach Zusammenhang Sklaven oder Diener bezeichnen kann.
lexical_decisions:
- source_word: ἔφη
  choice: sagte
  rationale: Das übliche deutsche Redeverb gibt den griechischen Aorist in der erzählenden Rede natürlich und direkt wieder.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: ein Feind
  rationale: Wörtlich steht hier etwa „ein feindlicher Mensch“. Idiomatisches Deutsch drückt die individualisierte gegnerische Person klar mit „ein Feind“ aus.
- source_word: τοῦτο ἐποίησεν
  choice: Das hat ... getan
  rationale: Das demonstrative τοῦτο wird durch das vorangestellte „Das“ deutlich aufgenommen; das deutsche Perfekt klingt in direkter Rede natürlich.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: δοῦλοι bezeichnet hier abhängige Angehörige des Haushalts unter der Verfügungsgewalt ihres Herrn. „Sklaven“ macht diesen sozialen Status transparenter; „Diener“ bleibt als geläufige kontextuelle Alternative in der Fußnote erhalten.
- source_word: Θέλεις
  choice: Willst du
  rationale: Die direkte Frage gibt den Willen beziehungsweise Wunsch des Angeredeten in klarem, gegenwärtigem Deutsch wieder.
- source_word: οὖν
  choice: also
  rationale: οὖν kennzeichnet die aus der Antwort folgende Frage; „also“ bewahrt diesen folgernden Zusammenhang.
- source_word: ἀπελθόντες
  choice: dass wir hingehen
  rationale: Das vorangestellte Partizip wird im Deutschen natürlich als mit dem Hauptverb verbundene Handlung innerhalb eines dass-Satzes wiedergegeben.
- source_word: συλλέξωμεν
  choice: einsammeln
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet das Verb das Zusammentragen und Entfernen des Unkrauts; „einsammeln“ ist verständlich und konkret.
- source_word: αὐτά
  choice: das Unkraut
  rationale: Das neutrale Pluralpronomen verweist auf das zuvor genannte Unkraut. Da „Unkraut“ im Deutschen gewöhnlich als Sammelbegriff im Singular steht, wird der Bezug zur Klarheit ausdrücklich wiederholt.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im Gleichnis
  choice: Sklaven
  alternative: Diener
  rationale: Die stärkere Bezeichnung wahrt die im antiken Haushaltsverhältnis vorausgesetzte Unfreiheit, ohne daraus eine besondere theologische Deutung abzuleiten. Weil „Diener“ in diesem Gleichnis ebenfalls kontextuell möglich und traditionell geläufig ist, wird es in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp. „Das Unkraut“ nimmt den vorausgehenden Referenten idiomatisch als deutschen Sammelbegriff auf.
