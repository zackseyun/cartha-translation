  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: de
  text: Der Feind aber, der es gesät hat, ist der Teufel. Die Ernte ist die Vollendung des Zeitalters[a], und die Erntearbeiter sind Engel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ende des Zeitalters“; traditionell: „das Ende der Welt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: Feind
  rationale: Die übliche und natürliche Wiedergabe bezeichnet hier den persönlichen Gegenspieler in der Deutung des Gleichnisses.
- source_word: ὁ σπείρας αὐτά
  choice: der es gesät hat
  rationale: Das substantivierte Aoristpartizip kennzeichnet den Feind durch seine abgeschlossene Handlung. Das neutrale Singularpronomen nimmt im Deutschen natürlich auf das zuvor genannte Unkraut zurück.
- source_word: διάβολος
  choice: der Teufel
  rationale: Hier ist das Wort eine feste persönliche Bezeichnung; eine etymologisierende Wiedergabe wie „Verleumder“ würde den gemeinten Bezug verdunkeln.
- source_word: θερισμός
  choice: Ernte
  rationale: Bewahrt das landwirtschaftliche Bild und ist im modernen Deutsch klar und idiomatisch.
- source_word: συντέλεια αἰῶνος
  choice: der Abschluss dieses Zeitalters
  rationale: „Abschluss“ gibt den Gedanken der Vollendung beziehungsweise des erreichten Endpunkts wieder; „Zeitalter“ bewahrt den zeitlichen Sinn von αἰών und vermeidet die mögliche stofflich-kosmische Konnotation von „Welt“.
- source_word: θερισταί
  choice: Erntearbeiter
  rationale: Eine transparente gegenwärtige Bezeichnung für diejenigen, die die Ernte einbringen; „Schnitter“ wäre traditioneller, wirkt heute jedoch altertümlich.
- source_word: ἄγγελοι
  choice: Engel
  rationale: Der endzeitliche Zusammenhang weist auf himmlische Wesen, nicht allgemein auf menschliche Boten.
- source_word: δέ
  choice: aber / Satzgliederung / und
  rationale: Das erste δέ wird mit „aber“ sichtbar gemacht; die weiteren Vorkommen gliedern die fortschreitende Erklärung und werden durch Satzgrenze beziehungsweise natürliche Koordination wiedergegeben.
theological_decisions:
- issue: Wiedergabe von αἰών in der endzeitlichen Wendung συντέλεια αἰῶνος
  choice: der Abschluss dieses Zeitalters
  alternative: das Ende der Welt; die Vollendung des Zeitalters
  rationale: Die Übersetzung wahrt den zeitlichen Bezug des griechischen αἰών und die in συντέλεια liegende Vorstellung eines abschließenden Zielpunkts, ohne eine Vernichtung der geschaffenen Welt in den Wortlaut hineinzulesen. Das Demonstrativ „dieses“ macht die im Deutschen sonst leicht unbestimmte Bedeutung des gegenwärtigen Zeitalters verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die klare Satzfolge folgt der erklärenden Struktur des griechischen Textes; „Erntearbeiter“ vermeidet das heute altertümliche „Schnitter“.
