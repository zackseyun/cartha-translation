review_pass:
  verdict: revise
  source_fidelity: Die Satzglieder und Referenten entsprechen dem griechischen Text insgesamt. „der es gesät hat“ ist im Kontext mit dem zuvor genannten kollektiven Neutrum „Unkraut“ möglich. „Abschluss dieses Zeitalters“ ist jedoch gegenüber συντέλεια αἰῶνος unnötig interpretierend („dieses“) und gibt den Kulminations-/Vollendungssinn von συντέλεια weniger treffend wieder.
  naturalness: Der Text ist flüssiges modernes Standarddeutsch. „Erntearbeiter“ ist verständlich und bewahrt das Bild, wenn auch weniger traditionell als „Schnitter“.
  terminology: „Teufel“, „Ernte“ und „Engel“ sind sachgerecht. „Vollendung des Zeitalters“ ist für συντέλεια αἰῶνος genauer und zugleich idiomatisch in einem würdevollen biblischen Register. Die Fußnote sollte die naheliegende Alternative „Ende des Zeitalters“ ausweisen; „Ende der Welt“ kann als traditionelle Wiedergabe genannt bleiben.
  issues:
  - severity: medium
    issue: „der Abschluss dieses Zeitalters“ für συντέλεια αἰῶνος
    rationale: „Dieses“ steht nicht im griechischen Text und legt den Bezug auf das gegenwärtige Zeitalter ausdrücklich fest. „Abschluss“ kann einen bloßen Endpunkt bezeichnen, während συντέλεια den Gedanken der Vollendung beziehungsweise Vollendung zum Abschluss einschließt. „die Vollendung des Zeitalters“ wahrt beides ohne zusätzliche Festlegung.
  revised_text: Der Feind aber, der es gesät hat, ist der Teufel. Die Ernte ist die Vollendung des Zeitalters[a], und die Erntearbeiter sind Engel.
