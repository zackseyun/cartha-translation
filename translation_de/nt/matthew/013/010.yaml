source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: de
  text: 'Da kamen die Jünger zu ihm und sagten: »Warum redest du in Gleichnissen zu ihnen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Da
  rationale: Das anschließende καί führt die Erzählung weiter. »Da« gibt diesen zeitlich-narrativen Anschluss im Deutschen natürlich wieder, ohne eine stärkere zeitliche Bestimmung hinzuzufügen.
- source_word: προσελθόντες
  choice: kamen … zu ihm
  rationale: Das Aoristpartizip von προσέρχομαι bezeichnet, dass die Jünger sich Jesus näherten, bevor sie sprachen. Die deutsche Verbindung »zu ihm kommen« bewahrt diese Bewegung und ist idiomatisch.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Der Artikel kennzeichnet die bereits bekannte Gruppe. Ein nicht ausdrücklich vorhandenes Possessivpronomen wird nicht ergänzt.
- source_word: εἶπαν αὐτῷ
  choice: sagten
  rationale: λέγω bezeichnet hier das Sprechen, das eine direkte Frage einleitet. Weil »zu ihm« bereits mit dem vorausgehenden Kommen verbunden ist, wäre eine erneute Dativangabe unnötig; »fragten« würde die Satzfunktion ausdrücken, aber vom konkreten Verb abweichen.
- source_word: Διὰ τί
  choice: Warum
  rationale: Die feste Frageverbindung bedeutet knapp und unmittelbar »warum?«.
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: ἐν mit Dativ bezeichnet hier die Art beziehungsweise das sprachliche Medium. »In Gleichnissen« ist die natürliche und sachlich genaue deutsche Wendung.
- source_word: λαλεῖς
  choice: redest
  rationale: Das Präsens der zweiten Person Singular wird direkt wiedergegeben. »Reden« klingt in dieser Frage natürlich und bewahrt den Bezug auf Jesu mündliches Sprechen.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Der Dativ bezeichnet die Menschen, an die Jesus seine Rede richtet. »Zu ihnen« gibt diesen Adressatenbezug unmittelbar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher direkter Rede. Die griechische Vorzeitigkeit des Partizips wird durch die deutsche Satzfolge wiedergegeben. Keine Fußnote ist nötig, da »kamen … zu ihm« sowohl die Annäherung als auch die natürliche deutsche Ausdrucksweise abdeckt.
