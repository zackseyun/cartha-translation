review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle Sinnbestandteile des griechischen Satzes angemessen wieder: der narrative Anschluss (Καὶ: „Da“), die Annäherung der Jünger (προσελθόντες), die Jünger als bekannte Gruppe, die direkte Frage, das Reden „in Gleichnissen“ und den Adressaten „zu ihnen“. Das in „kamen die Jünger zu ihm und sagten“ enthaltene „zu ihm“ stellt den Bezug von αὐτῷ natürlich und eindeutig her.'
  naturalness: '„Da kamen die Jünger zu ihm und sagten: …“ ist flüssiges modernes Standarddeutsch. Die direkte Rede und die Wortstellung sind klar; der würdige, ungekünstelte Registerton passt zum Kontext.'
  terminology: „Jünger“ für μαθηταί und „Gleichnisse“ für παραβολαῖς sind etablierte, sachgerechte und theologisch unaufgeladene Wiedergaben. „redest“ ist für λαλεῖς idiomatisch und semantisch angemessen.
