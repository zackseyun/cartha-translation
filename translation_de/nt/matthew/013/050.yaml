id: MAT.13.50
reference: Matthew 13:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: de
  text: und sie werden sie in den Feuerofen[a] werfen. Dort wird Weinen und Zähneknirschen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ofen des Feuers“.'
    reason: Die Fußnote macht die griechische Genitivkonstruktion hinter dem idiomatischen deutschen Kompositum transparent.
lexical_decisions:
- source_word: βαλοῦσιν
  choice: werden … werfen
  rationale: Das Futur von βάλλω bezeichnet hier ein gewaltsames Werfen; „werfen“ ist im modernen Deutsch natürlich und bewahrt die Bildkraft.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Akkusativpronomen im maskulinen Plural verweist im Zusammenhang auf die Bösen; das deutsche Objektpronomen gibt dies knapp wieder.
- source_word: κάμινον τοῦ πυρός
  choice: Feuerofen
  rationale: Das im Deutschen geläufige Kompositum gibt die griechische Genitivverbindung „Ofen des Feuers“ idiomatisch und zugleich bildhaft wieder.
- source_word: ἐκεῖ
  choice: Dort
  rationale: „Dort“ bewahrt den deutlichen Ortsbezug des griechischen Adverbs in natürlichem Deutsch.
- source_word: ἔσται
  choice: wird … sein
  rationale: Die deutsche Futurkonstruktion entspricht dem griechischen Futur und trägt die beiden folgenden Substantive als Prädikatsnomen.
- source_word: ὁ κλαυθμὸς
  choice: Weinen
  rationale: κλαυθμός bezeichnet Weinen oder Klagen; „Weinen“ ist präzise, verständlich und übertreibt die mögliche Nuance nicht.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: Zähneknirschen
  rationale: Das etablierte deutsche Wort gibt die feste matthäische Wendung knapp wieder und bewahrt ihre Assoziationen von Qual und Gericht.
theological_decisions:
- issue: Gerichtsbild in eschatologischem Zusammenhang
  choice: Die konkreten Bilder „Feuerofen“, „Weinen“ und „Zähneknirschen“ bleiben ohne Abschwächung oder erklärenden Zusatz erhalten.
  alternative: Die Aussage deutend umschreiben, etwa als Weinen und Zähneknirschen vor Qual.
  rationale: Der griechische Text formuliert die Gerichtsmetaphorik bewusst konkret. Die Übersetzung bewahrt ihre Härte und lässt ihre theologischen Implikationen offen, statt sie auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute matthäische Formel „Weinen und Zähneknirschen“ bleibt erhalten; „Feuerofen“ ist natürlich und bewahrt das konkrete Bild.
