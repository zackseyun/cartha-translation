  naturalness: „Der Böse“ und „reißt weg“ sind in modernem, würdigem Standarddeutsch verständlich. „Das ist derjenige, bei dem an den Weg gesät wurde“ ist idiomatisch und bewahrt zugleich die Bildlogik besser als die vorliegende Umschreibung.
  terminology: „Wort vom Reich“, „Herz“ und „der Böse“ sind angemessen. „Reich“ wahrt die traditionelle biblische Terminologie, ohne den Genitiv τῆς βασιλείας unnötig einzuengen. Die Fußnote soll die auffällige, metonymische Form des griechischen Schlusssatzes weiterhin kenntlich machen.
