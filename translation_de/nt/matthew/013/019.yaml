source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: de
  text: Wenn jemand das Wort vom Reich hört und es nicht versteht, kommt der Böse und reißt weg, was in seinem Herzen gesät worden ist. Das ist derjenige, bei dem an den Weg gesät wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dieser ist der an den Weg Gesäte.“ Die griechische Formulierung identifiziert den Hörer bildhaft mit dem Gesäten und lässt die Grenzen zwischen Samen, Boden und Mensch bewusst ineinanderlaufen.'
    reason: Die Fußnote dokumentiert die im Deutschen nur schwer natürlich wiederzugebende metonymische Formulierung, ohne ihre Deutung festzulegen.
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: Wenn jemand … hört
  rationale: Die genitivische Partizipialkonstruktion wird als allgemeiner Konditionalsatz natürlich und ihrem distributiven Sinn entsprechend wiedergegeben.
- source_word: λόγον τῆς βασιλείας
  choice: das Wort vom Reich
  rationale: „Wort“ bewahrt die Verbindung zwischen Botschaft und Samenbild; „vom Reich“ gibt den Genitiv im Deutschen natürlich wieder, ohne festzulegen, ob Herkunft oder Inhalt im Vordergrund steht.
- source_word: μὴ συνιέντος
  choice: es nicht versteht
  rationale: συνίημι bezeichnet hier das Verstehen beziehungsweise Erfassen; „es“ verweist eindeutig auf das Wort vom Reich.
- source_word: ὁ πονηρὸς
  choice: der Böse
  rationale: Der substantivierte Ausdruck bezeichnet im Kontext am ehesten einen persönlichen bösen Akteur, ohne ihn über den Wortlaut hinaus namentlich zu bestimmen.
- source_word: ἁρπάζει
  choice: reißt weg
  rationale: Die Formulierung wahrt die plötzliche und gewaltsame Nuance von ἁρπάζω.
- source_word: τὸ ἐσπαρμένον
  choice: was … gesät wurde
  rationale: Das substantivierte passive Partizip wird idiomatisch wiedergegeben und behält den Passivsinn bei.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: in sein Herz
  rationale: „Herz“ bewahrt den biblisch-anthropologischen Ausdruck; die Richtungsangabe ist beim deutschen Verb „säen“ idiomatisch.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: Bei diesem Menschen ist der Samen an den Weg gesät worden
  rationale: Die griechische Metonymie identifiziert den Menschen wörtlich mit dem Gesäten. Die deutsche Fassung macht die Bildbeziehung verständlich, bewahrt aber durch eine Fußnote die formal mögliche wörtlichere Lesart.
theological_decisions:
- issue: Identität von ὁ πονηρός
  choice: ein persönlicher böser Akteur („der Böse“)
  alternative: das abstrakte Böse
  rationale: Artikel, maskuline Form und Handlung sprechen hier für einen persönlichen Akteur; die Übersetzung benennt ihn jedoch nicht genauer als der Text.
- issue: Zuordnung von Gesätem, Hörer und Boden im letzten Satz
  choice: Der Mensch wird als Fall beschrieben, bei dem der Samen an den Weg gesät wurde
  alternative: „Dieser ist der an den Weg Gesäte“
  rationale: Der griechische Wortlaut verdichtet Samen, Boden und Hörer metonymisch. Die Hauptfassung ist im Deutschen verständlich, während die Fußnote die auffällige Formulierung des Ausgangstextes sichtbar hält.
- issue: Generisches Maskulinum bei αὐτοῦ
  choice: „sein Herz“
  alternative: „das Herz dieses Menschen“
  rationale: Das Singularpronomen wird grammatisch genau wiedergegeben; „jemand“ stellt klar, dass die Aussage allgemein gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Reich“ und „Herz“ bewahren die zentralen biblischen Begriffe. Die Bildsprache bleibt anschaulich; eine Fußnote dokumentiert die auffällige Metonymie des griechischen Schlusssatzes.
