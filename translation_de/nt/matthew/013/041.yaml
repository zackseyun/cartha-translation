id: MAT.13.41
reference: Matthew 13:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: de
  text: Der Menschensohn wird seine Engel aussenden. Sie werden aus seinem Reich alles zusammensammeln, was Menschen zu Fall bringt[a], und alle, die gesetzlos handeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Fallstricke“. Das griechische Wort σκάνδαλα kann Personen, Dinge oder Einflüsse bezeichnen, die andere zur Sünde oder zum Abfall verleiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die die Gesetzlosigkeit tun“. Die Formulierung bezeichnet ein fortgesetztes oder kennzeichnendes Handeln gegen Gottes Gesetz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: wird … aussenden
  rationale: Das Futur von ἀποστέλλω bezeichnet das beauftragende Aussenden; „aussenden“ ist im Deutschen natürlich und bewahrt diesen Akzent.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe erhält den Titelcharakter und den möglichen Bezug auf Daniel 7.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: seine Engel
  rationale: Im endzeitlichen Gerichtskontext sind himmlische Engel, nicht menschliche Boten, gemeint.
- source_word: συλλέξουσιν
  choice: sie werden … zusammensammeln
  rationale: Die Wiedergabe wahrt das Bild des Einsammelns aus Ernte und Gericht und passt zur Entfernung aus einem Bereich.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: aus seinem Reich
  rationale: „Aus“ gibt ἐκ knapp wieder und bezeichnet die Entfernung aus dem Herrschaftsbereich des Menschensohnes.
- source_word: πάντα τὰ σκάνδαλα
  choice: alles, was Menschen zu Fall bringt
  rationale: Die Formulierung gibt die aktive Bedeutung von σκάνδαλα verständlich wieder und lässt offen, ob Personen, Einflüsse oder Dinge gemeint sind.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: alle, die gesetzlos handeln
  rationale: „Gesetzlos handeln“ bewahrt den Bezug von ἀνομία auf die Missachtung des Gesetzes und gibt die charakteristische Tätigkeit des substantivierten Präsenspartizips idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Titels ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: „Menschensohn“ wahrt die in Matthäus etablierte Selbstbezeichnung Jesu und ihre apokalyptische, wahrscheinlich auf Daniel 7 bezogene Resonanz, ohne sie deutend aufzulösen.
- issue: Bedeutungsumfang von σκάνδαλα im Gerichtskontext
  choice: alles, was Menschen zu Fall bringt
  alternative: alle Fallstricke / alle Verführungen
  rationale: Die gewählte Fassung kann Personen, Dinge und Einflüsse umfassen, die Sünde oder Abfall verursachen; sie verengt den Ausdruck weder auf subjektives Ärgernis noch ausschließlich auf Sachen.
- issue: Charakter von ποιοῦντας τὴν ἀνομίαν
  choice: die gesetzlos handeln
  alternative: die die Gesetzlosigkeit tun / die Unrecht tun
  rationale: Die Formulierung bewahrt sowohl den Gesetzesbezug als auch den Gedanken eines kennzeichnenden Handelns, ohne über den griechischen Wortlaut hinaus eine bestimmte Gesetzestheologie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die logische Verbindung des griechischen Satzes zu verändern. „Zusammensammeln“ erhält das Erntebild; die beiden Fußnoten stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
