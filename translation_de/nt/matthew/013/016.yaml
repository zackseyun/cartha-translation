  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: de
  text: Aber selig sind eure Augen, weil sie sehen, und eure Ohren, weil sie hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn sie sehen … denn sie hören“. Das griechische Wort kann hier auch so wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zu denen, die sehen und doch nicht sehen sowie hören und doch nicht hören (V. 13). „Doch“ gibt diesen adversativen Übergang natürlich wieder.
- source_word: μακάριοι
  choice: glücklich
  rationale: Bezeichnet in einem Seligpreisungsausspruch den begünstigten, beneidenswert guten Zustand der Angesprochenen; „glücklich“ ist gegenwärtiges, verständliches Deutsch und meint hier mehr als ein bloßes Gefühl.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: eure Augen
  rationale: Natürliche deutsche Wiedergabe der griechischen Nominalfügung mit Possessivpronomen.
- source_word: ὅτι βλέπουσιν
  choice: weil sie sehen
  rationale: 'ὅτι wird im Haupttext kausal verstanden: Das Sehen begründet die Aussage, dass die Augen glücklich zu nennen sind.'
- source_word: τὰ ὦτα ὑμῶν
  choice: eure Ohren
  rationale: Bewahrt den Parallelismus zu „eure Augen“ in natürlicher deutscher Wortstellung.
- source_word: ὅτι ἀκούουσιν
  choice: weil sie hören
  rationale: Die zweite ὅτι-Konstruktion wird parallel kausal wiedergegeben; „hören“ wahrt die schlichte Sinnesmetaphorik des Ausgangstextes.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: sehen / hören
  rationale: Die konkreten Verben bleiben erhalten, sodass der Kontext ihre geistliche Tragweite erkennen lässt, ohne sie durch „verstehen“ oder „erkennen“ ausdrücklich festzulegen.
theological_decisions:
- issue: Ob Sehen und Hören ausdrücklich als geistliches Verstehen wiederzugeben sind
  choice: Die konkreten Sinnesverben „sehen“ und „hören“ bleiben stehen.
  alternative: „erkennen“ und „verstehen“
  rationale: Der Zusammenhang legt eine tiefere Aufnahme der Botschaft nahe, doch der Vers selbst verwendet die gewöhnlichen Verben für Sehen und Hören. Die wörtliche Bildsprache bewahrt diese theologische Spannung.
- issue: Bedeutungsumfang von μακάριοι
  choice: „glücklich“ als Aussage über den begünstigten Zustand der Jünger
  alternative: „selig“ oder „gesegnet“
  rationale: „Selig“ ist traditionell, wirkt im modernen Standarddeutsch jedoch stärker kirchensprachlich; „gesegnet“ könnte eine ausdrücklich vollzogene Segenshandlung nahelegen. „Glücklich“ bezeichnet hier kontextuell nicht bloß eine Gemütslage, sondern ihre bevorzugte Lage.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der Parallelismus des Griechischen bleibt erhalten; die Fußnote dokumentiert die mögliche Wiedergabe von ὅτι mit „denn“.
