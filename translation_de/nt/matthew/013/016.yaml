review_pass:
  verdict: revise
  source_fidelity: Die kausale Wiedergabe von ὅτι mit „weil“ sowie „sehen“ und „hören“ entspricht dem griechischen Text und bewahrt dessen knappen Parallelismus. δέ kann hier angemessen mit „Aber“ wiedergegeben werden. Für μακάριοι ist „selig“ im biblischen Kontext die treffendere deutsche Entsprechung als „glücklich“, da es nicht primär einen subjektiven Gefühlszustand bezeichnet.
  naturalness: „Glücklich sind eure Augen“ ist zwar verständlich, klingt im Deutschen jedoch ungewohnt und kann Augen einen emotionalen Zustand zuschreiben. „Selig sind eure Augen“ ist eine etablierte, auch heute verständliche Formulierung im Register biblischer Seligpreisungen.
  terminology: „Selig“ gibt μακάριοι als theologischen und zugleich nicht übermäßig ausdeutenden Schlüsselbegriff besser wieder. Es vermeidet sowohl die Verengung auf persönliches Glück als auch die mögliche Implikation eines vollzogenen Segensakts bei „gesegnet“.
  issues:
  - severity: medium
    issue: μακάριοι ist mit „glücklich“ wiedergegeben.
    rationale: Im modernen allgemeinen Sprachgebrauch bezeichnet „glücklich“ vor allem ein Gefühl. Im Kontext einer Seligpreisung und bei der ungewöhnlichen Aussage über „Augen“ ist „selig“ semantisch und registermäßig genauer und natürlicher.
  revised_text: Aber selig sind eure Augen, weil sie sehen, und eure Ohren, weil sie hören.[a]
