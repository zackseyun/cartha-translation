- from: Darum rede ich in Gleichnissen zu ihnen, weil sie sehend nicht sehen[a] und hörend nicht hören und auch nicht verstehen.
  to: Darum rede ich zu ihnen in Gleichnissen, weil sie zwar sehen, aber nicht sehen, zwar hören, aber nicht hören und auch nicht verstehen.
  rationale: Die Revision ersetzt die nicht natürliche partizipiale Nachbildung durch eine im modernen Deutsch klare, parallele Konstruktion. „Zwar …, aber …“ bringt die im griechischen Kontext naheliegende paradoxe bzw. konzessive Spannung zum Ausdruck, ohne sie als Aussage über Schuld, Verstockung oder deren Ursache auszuweiten. Die nicht erforderliche Fußnote entfällt.
