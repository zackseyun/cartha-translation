reference: Matthew 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: de
  text: Darum rede ich zu ihnen in Gleichnissen, weil sie zwar sehen, aber nicht sehen, zwar hören, aber nicht hören und auch nicht verstehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den rückbezüglichen kausalen Sinn knapp und natürlich wieder, ohne ihn zu einer bloßen Schlussfolgerung abzuschwächen.
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: Entspricht der üblichen deutschen Wiedergabe von ἐν mit dem Dativ und bezeichnet die Art und Weise des Redens.
- source_word: αὐτοῖς λαλῶ
  choice: rede ich … zu ihnen
  rationale: Bewahrt Person, Präsens und Adressatenbezug; „reden zu“ klingt im Deutschen natürlich und würdevoll.
- source_word: ὅτι
  choice: weil
  rationale: Kennzeichnet hier den von Jesus genannten Grund und wahrt die kausale Struktur des Satzes.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: sie sehend nicht sehen
  rationale: Die partizipiale, paradoxe Form des Griechischen bleibt sichtbar, ohne ausdrücklich ein nicht markiertes „obwohl“ oder „doch“ einzufügen.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: hörend nicht hören
  rationale: Bewahrt parallel zur vorigen Wendung die auffällige Wiederholung und den Gegensatz zwischen äußerer Wahrnehmung und tatsächlichem Erfassen.
- source_word: οὐδὲ συνίουσιν
  choice: und auch nicht verstehen
  rationale: „Auch nicht“ führt die verneinte Reihe natürlich fort; „verstehen“ bezeichnet das Erfassen von Sinn und Bedeutung, ohne eine weitergehende Lehrdeutung einzutragen.
theological_decisions:
- issue: Sinn der Partizipien βλέποντες und ἀκούοντες
  choice: Formal-paradoxal als „sehend“ und „hörend“ wiedergegeben
  alternative: 'Konzessiv: „obwohl sie sehen“ und „obwohl sie hören“'
  rationale: Die griechischen Partizipien können im Zusammenhang konzessiv verstanden werden, markieren dies aber nicht ausdrücklich. Die gewählte Form bewahrt sowohl die Mehrdeutigkeit als auch die Spannung zwischen Wahrnehmung und fehlendem Erfassen.
- issue: Bedeutung von συνίουσιν
  choice: „verstehen“
  alternative: „begreifen“ oder „erkennen“
  rationale: „Verstehen“ bezeichnet klar das fehlende Erfassen des Sinnes, ohne die Aussage auf eine bestimmte dogmatische Erklärung von Ursache oder Schuld festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst markierten Wendungen „sehend nicht sehen“ und „hörend nicht hören“ spiegeln den rhetorischen Parallelismus und die paradoxe Form des griechischen Textes.
