review_pass:
  verdict: revise
  source_fidelity: Die kausale Struktur von διὰ τοῦτο … ὅτι bleibt gewahrt. „Darum“ und „weil“ sind angemessene moderne Entsprechungen. Die Partizipien βλέποντες und ἀκούοντες bezeichnen die paradoxe Spannung von äußerem Sehen/Hören und fehlendem wirklichem Wahrnehmen/Verstehen; die Revision gibt dies idiomatisch wieder, ohne eine weitergehende dogmatische Ursache zuzuschreiben.
  naturalness: „Sie sehend nicht sehen“ ist im modernen Standarddeutsch nicht idiomatisch und lässt sich syntaktisch nur schwer erfassen. Die Konstruktion „zwar …, aber …“ bildet den Parallelismus klar und würdig nach. Die Stellung „zu ihnen in Gleichnissen“ ist im Deutschen flüssiger.
  terminology: „Gleichnisse“ entspricht παραβολαῖς im matthäischen Kontext; „verstehen“ ist eine treffende, theologisch nicht überladene Wiedergabe von συνίουσιν. „Auch nicht“ gibt die Fortsetzung der Verneinung durch οὐδέ angemessen wieder.
  issues:
  - severity: medium
    issue: Die Wendung „weil sie sehend nicht sehen“ ist unidiomatisch.
    rationale: Das deutsche Partizip „sehend“ kann hier nicht ohne Weiteres wie das griechische Partizip verwendet werden. Die Form beeinträchtigt Verständlichkeit und Natürlichkeit, obwohl sie die griechische Form nachbilden möchte.
  - severity: low
    issue: Die Fußnote bietet eine konzessive Alternative zu einer bereits schwer verständlichen deutschen Ausgangsform.
    rationale: Nach einer idiomatischen Wiedergabe der paradoxen Konstruktion ist diese Fußnote nicht erforderlich; sie trägt zudem keine für den Leser notwendige Textvariante oder Übersetzungsalternative bei.
  revised_text: Darum rede ich zu ihnen in Gleichnissen, weil sie zwar sehen, aber nicht sehen, zwar hören, aber nicht hören und auch nicht verstehen.
