id: MAT.13.26
reference: Matthew 13:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: de
  text: Als aber die Saat aufging und Frucht brachte, da zeigte sich auch das Unkraut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Lolch; möglicherweise ist insbesondere der Taumellolch gemeint, ein dem Getreide ähnlich sehendes Unkraut.'
    reason: lexikalische Alternative und mögliche botanische Präzisierung
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als aber
  rationale: ὅτε leitet den zeitlichen Nebensatz ein; δέ markiert hier einen leichten Gegensatz und den Fortgang der Erzählung.
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: die Saat aufging
  rationale: χόρτος bezeichnet in diesem landwirtschaftlichen Zusammenhang den heranwachsenden Pflanzenbestand; die deutsche Wendung „die Saat ging auf“ gibt den Vorgang natürlich und verständlich wieder.
- source_word: καρπὸν ἐποίησεν
  choice: Frucht brachte
  rationale: Die wörtliche Wendung „Frucht machte“ bedeutet, Ertrag hervorzubringen. „Frucht brachte“ bewahrt das Bild und lässt offen, dass hier konkret Getreidekörner gemeint sind.
- source_word: τότε ἐφάνη
  choice: da zeigte sich
  rationale: τότε kennzeichnet den zeitlichen Folgeschritt; ἐφάνη bezeichnet das Sichtbar- oder Erkennbarwerden.
- source_word: καὶ τὰ ζιζάνια
  choice: auch das Unkraut
  rationale: καί hat additive Bedeutung. ζιζάνια bezeichnet schädliche Beikräuter im Getreidefeld, möglicherweise speziell Lolch; „Unkraut“ ist im Haupttext allgemein verständlich, während die mögliche genauere Bestimmung in der Fußnote steht.
theological_decisions:
- issue: Genaue Bestimmung von ζιζάνια
  choice: Im Haupttext allgemein mit „Unkraut“ wiedergegeben
  alternative: „Lolch“ beziehungsweise genauer „Taumellolch“
  rationale: Der griechische Ausdruck kann eine bestimmte, dem Getreide ähnlich sehende Unkrautart bezeichnen, legt die botanische Bestimmung aber nicht zweifelsfrei fest. Der Haupttext bleibt daher verständlich und die mögliche Präzisierung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Formulierung „die Saat ging auf“ bildet den landwirtschaftlichen Zusammenhang natürlich ab; „Frucht brachte“ bewahrt zugleich das biblische Ertragsbild.
