source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: de
  text: 'Er aber sagte: »Nein, sonst könntet ihr beim Einsammeln des Unkrauts den Weizen zusammen mit ihm ausreißen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Unkraut“ ist möglicherweise genauer Taumellolch gemeint, der in frühen Wachstumsstadien Weizen ähnlich sehen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: sagte
  rationale: Das griechische historische Präsens wird im natürlichen deutschen Erzählstil idiomatisch als Präteritum wiedergegeben.
- source_word: Οὔ
  choice: Nein
  rationale: Die knappe, direkte Verneinung entspricht dem griechischen Wortlaut.
- source_word: μήποτε
  choice: sonst könntet ihr
  rationale: Die Formulierung gibt die Warnung vor einem möglichen unerwünschten Ergebnis natürlich wieder, ohne dessen Eintritt als sicher darzustellen.
- source_word: συλλέγοντες
  choice: beim Zusammenlesen
  rationale: Die Wendung bezeichnet eine gleichzeitig stattfindende Tätigkeit; »Zusammenlesen« passt zum Einsammeln beziehungsweise Aussondern der Pflanzen.
- source_word: ζιζάνια
  choice: Unkraut
  rationale: Der verständliche moderne Sammelbegriff bewahrt die botanische Unbestimmtheit des griechischen Ausdrucks; die wahrscheinlichere genauere Bestimmung wird in der Fußnote genannt.
- source_word: ἐκριζώσητε
  choice: ausreißen
  rationale: Im Pflanzenkontext bezeichnet das Verb das Herausreißen mitsamt der Wurzel; »ausreißen« ist dafür natürlich und präzise.
- source_word: ἅμα αὐτοῖς
  choice: zugleich mit ihm
  rationale: Die Formulierung bringt zum Ausdruck, dass der Weizen zusammen mit dem Unkraut entfernt werden könnte; das Pronomen bezieht sich im Deutschen grammatisch auf das singularische Kollektivwort »Unkraut«.
- source_word: σῖτον
  choice: den Weizen
  rationale: Im landwirtschaftlichen Kontext und im Gegensatz zum Unkraut ist konkret Weizen gemeint, nicht Getreide im Allgemeinen.
theological_decisions:
- issue: Wiedergabe von ζιζάνια im bekannten Gleichnis
  choice: Unkraut
  alternative: Taumellolch; Lolch
  rationale: Der Haupttext bleibt allgemein und gut verständlich, während die mögliche botanische Bestimmung in der Fußnote erhalten bleibt. So wird keine über den griechischen Wortlaut hinausgehende Sicherheit behauptet.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Das Präteritum ist im narrativen Zusammenhang idiomatisch; die direkte Rede bleibt knapp. Die Möglichkeit in μήποτε wird durch »könntet« bewahrt.
