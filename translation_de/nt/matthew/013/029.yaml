  terminology: „Unkraut“ ist als allgemeinverständliche, botanisch nicht überpräzise Wiedergabe von ζιζάνια geeignet. „Taumellolch“ gehört als vorsichtig markierte mögliche Spezifizierung in die Fußnote. „Weizen“ und „ausreißen“ geben σῖτος bzw. ἐκριζώσητε treffend wieder.
