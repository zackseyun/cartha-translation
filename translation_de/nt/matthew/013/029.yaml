  source_fidelity: 'Der Sinn des griechischen Satzes wird getroffen: Die Antwort verneint das sofortige Handeln und warnt davor, dass beim Sammeln der ζιζάνια der Weizen mit herausgerissen werden könnte. Das historische Präsens φησιν darf im deutschen Erzählpräteritum als „sagte“ stehen. Die pluralische Bezugsgröße αὐτοῖς wird bei dem deutschen Kollektivsingular „Unkraut“ korrekt durch „ihm“ wiedergegeben.'
