id: MAT.13.36
reference: Matthew 13:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: de
  text: 'Dann verließ er die Menschenmenge und ging ins Haus. Seine Jünger kamen zu ihm und sagten: „Erkläre uns das Gleichnis vom Unkraut[a] auf dem Feld.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet wahrscheinlich Taumellolch, ein Unkraut, das dem Weizen ähnelt; traditionell wird es auch mit „Lolch“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Kennzeichnet in der Erzählung den zeitlichen Übergang zum nächsten Geschehen.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: verließ er die Menschenmenge
  rationale: ἀφίημι bezeichnet hier das Zurücklassen beziehungsweise Verlassen der versammelten Menschen. Der deutsche Kollektivsingular ist natürlicher als „Menschenmengen“.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: ging ins Haus
  rationale: Gibt die Bewegung vom bisherigen Ort in das bereits bekannte Haus idiomatisch und knapp wieder.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: Seine Jünger kamen zu ihm
  rationale: Bewahrt sowohl die Annäherung an Jesus als auch die ausdrückliche Zuordnung der Jünger zu ihm.
- source_word: λέγοντες
  choice: und sagten
  rationale: Die koordinierte deutsche Form gibt das begleitende Partizip in natürlicher Erzählweise wieder.
- source_word: Διασάφησον ἡμῖν
  choice: Erkläre uns
  rationale: διασαφέω verlangt hier, etwas verständlich und deutlich darzulegen; „erklären“ ist die natürliche moderne Entsprechung.
- source_word: τὴν παραβολὴν
  choice: das Gleichnis
  rationale: „Gleichnis“ ist die etablierte und sachgerechte deutsche Bezeichnung für παραβολή in diesem Kontext.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: vom Unkraut auf dem Feld
  rationale: „Unkraut“ ist allgemein verständlich; die Präpositionalfügung ist im Deutschen natürlicher als eine doppelte Genitivkonstruktion. Die wahrscheinlich genauere Pflanzenbezeichnung bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die Wortstellung bleibt nah am griechischen Ablauf, ohne unidiomatische Partizipialkonstruktionen zu übernehmen.
