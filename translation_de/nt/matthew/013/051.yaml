  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: de
  text: '„Habt ihr das alles verstanden?“ Sie sagten zu ihm: „Ja.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: Habt ihr … verstanden
  rationale: Der Aorist Indikativ in der Frage blickt auf das bisher vermittelte Verständnis zurück. Das deutsche Perfekt gibt dies natürlich wieder, ohne den Sinn stärker als nötig als bloßen gegenwärtigen Zustand zu formulieren.
- source_word: ταῦτα πάντα
  choice: das alles
  rationale: Die idiomatische deutsche Wendung bildet den Gesamtbezug auf die zuvor vorgetragenen Lehren und Gleichnisse klar ab. „Alle diese Dinge“ wäre formaler, klingt hier jedoch unnötig schwer.
- source_word: λέγουσιν αὐτῷ
  choice: Sie sagten zu ihm
  rationale: Das griechische historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben; αὐτῷ bleibt ausdrücklich mit „zu ihm“ erhalten.
- source_word: Ναί
  choice: Ja
  rationale: Das einfache bejahende Partikel wird ohne Ergänzung wiedergegeben. Ein Titel wie „Herr“ steht nicht im griechischen Text.
theological_decisions:
- issue: Erweiterung der Antwort der Jünger um eine ehrende Anrede
  choice: Die schlichte Antwort „Ja“ beibehalten.
  alternative: „Ja, Herr.“
  rationale: Der SBLGNT-Text enthält nur Ναί. Eine zusätzliche Anrede würde einen nicht im Ausgangstext belegten devotionalen oder theologischen Akzent eintragen.
translation_notes:
  register: Modernes, würdevolles und unmittelbar verständliches Standarddeutsch. Die direkte Frage bleibt knapp; das Perfekt wahrt den rückblickenden Aspekt des Aorists. Keine Fußnote ist nötig, da „Habt ihr … verstanden?“ die relevante Form und Bedeutung natürlich wiedergibt.
