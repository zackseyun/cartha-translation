  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: de
  text: Während er säte, fiel einiges[a] neben den Weg, und die Vögel kamen und fraßen es auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fiel einiges“ beziehungsweise „fielen einige Dinge“; gemeint ist aus dem Zusammenhang ein Teil des ausgesäten Samens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Als er säte
  rationale: Die Verbindung ἐν mit substantiviertem Infinitiv bezeichnet hier Gleichzeitigkeit. „Als er säte“ gibt dies natürlich und knapp wieder.
- source_word: ἃ μὲν
  choice: einiges
  rationale: Das substantivisch gebrauchte Neutrum Plural meint im Zusammenhang einen Teil des Ausgesäten. „Einiges“ bewahrt die grammatische Unbestimmtheit des griechischen Textes, ohne ausdrücklich „Samenkörner“ einzufügen.
- source_word: ἔπεσεν
  choice: fiel
  rationale: Der Aorist wird im deutschen Erzählstil passend mit dem Präteritum wiedergegeben.
- source_word: παρὰ τὴν ὁδόν
  choice: an den Weg
  rationale: παρά mit Akkusativ bezeichnet hier den Bereich am Weg beziehungsweise Wegesrand. Die idiomatische Wendung „an den Weg fallen“ lässt offen, ob unmittelbar daneben oder auf den festgetretenen Rand gemeint ist.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: da kamen die Vögel
  rationale: Das adverbiale Aoristpartizip wird natürlich als nachfolgendes finites Verb wiedergegeben. πετεινά bezeichnet hier schlicht Vögel; ein Zusatz wie „des Himmels“ steht nicht im Vers.
- source_word: κατέφαγεν
  choice: fraßen ... auf
  rationale: Das trennbare Verb „auffressen“ gibt die verstärkende Bedeutung von κατεσθίω idiomatisch und anschaulich wieder.
- source_word: αὐτά
  choice: es
  rationale: Das griechische Neutrum Plural verweist auf das Ausgesäte. Im Deutschen nimmt „es“ den durch „einiges“ bezeichneten Stoff beziehungsweise Samen natürlich wieder auf.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt beziehungsweise das Semikolon strukturiert die rasche Handlungsfolge. Die Formulierung vermeidet einen nicht ausdrücklich im griechischen Vers stehenden Zusatz wie „Samenkörner“ im Haupttext, erläutert den Bezug jedoch in der Fußnote.
