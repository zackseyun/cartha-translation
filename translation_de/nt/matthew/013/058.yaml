  source_fidelity: Die Übersetzung gibt καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν vollständig und zutreffend wieder. Insbesondere wahrt „vollbrachte ... nicht“ die Aussage über unterbliebenes Handeln, ohne eine im griechischen Text nicht ausgesagte Unfähigkeit zu behaupten. „Wegen ihres Unglaubens“ gibt die kausale Funktion von διά mit Akkusativ angemessen wieder.
  naturalness: „Und er vollbrachte dort wegen ihres Unglaubens nicht viele Machttaten“ ist klares, würdiges modernes Standarddeutsch mit angemessen biblischem Register. Die Stellung von „nicht viele Machttaten“ ist idiomatisch. „Machttaten“ ist zwar gehoben, aber als fachlich-biblische Bezeichnung verständlich; die Fußnote bietet geläufigere Alternativen.
  terminology: „Machttaten“ bewahrt den Bedeutungsbezug von δυνάμεις zu Macht/Kraft besser als eine ausschließliche Wiedergabe mit „Wunder“ und bleibt im Kontext zutreffend. „Unglauben“ entspricht ἀπιστία direkt. Die Fußnote beschreibt die lexikalische Spannweite und den kontextuellen Bezug zu Wunderhandlungen sachgerecht.
