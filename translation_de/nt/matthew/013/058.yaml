id: MAT.13.58
reference: Matthew 13:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: de
  text: Und er vollbrachte dort wegen ihres Unglaubens nicht viele Machttaten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »viele Wunder« oder »viele machtvolle Taten«. Das griechische Wort bezeichnet Taten der Macht und meint in diesem Zusammenhang wunderhafte Werke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: vollbrachte
  rationale: ποιέω bedeutet allgemein »tun/machen«. In Verbindung mit δυνάμεις gibt »vollbrachte« die idiomatische Bedeutung im Deutschen natürlich wieder, ohne über das tatsächliche Handeln hinaus eine Unfähigkeit auszusagen.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb verweist auf den Ort im Heimatstadt-Kontext.
- source_word: δυνάμεις πολλὰς
  choice: viele Machttaten
  rationale: δύναμις bezeichnet in diesem Evangelienkontext machtvolle, wunderhafte Taten. »Machttaten« bewahrt den sprachlichen Bezug zur Kraft beziehungsweise Macht; πολλὰς wird mit »viele« wiedergegeben.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: wegen ihres Unglaubens
  rationale: διά mit Akkusativ bezeichnet hier die Ursache. ἀπιστία wird direkt als »Unglaube« wiedergegeben und behält die negative Aussage des griechischen Substantivs bei.
- source_word: καὶ οὐκ
  choice: Und er ... nicht
  rationale: καί führt die Erzählung weiter, während οὐκ das Aoristverb verneint. »Und ... nicht« fügt keine über den griechischen Text hinausgehende Folgerung hinzu.
theological_decisions:
- issue: Ob der Vers Unfähigkeit oder ein wegen des Unglaubens unterbliebenes Handeln aussagt
  choice: »er vollbrachte ... nicht viele Machttaten«
  alternative: »er konnte dort nicht viele Wunder tun«
  rationale: Der griechische Text lautet οὐκ ἐποίησεν (»er tat nicht«) und verwendet keinen Ausdruck der Unfähigkeit. Die Übersetzung bleibt daher bei der Aussage über das Handeln und bewahrt die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Machttaten« ist im biblischen Sprachgebrauch verständlich und erhält den Bedeutungsbezug von δύναμις zur Macht; die Fußnote bietet geläufigere Alternativen.
