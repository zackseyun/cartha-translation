source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: de
  text: Wiederum ist das Himmelreich wie ein Zugnetz[a], das ins Meer ausgeworfen wurde und allerlei[b] zusammenbringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schleppnetz“; das griechische Wort bezeichnet ein großes Zugnetz oder eine Senne.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus jeder Art“. Was das Netz sammelt, wird im griechischen Text nicht ausdrücklich genannt; im Bild vom Fischfang sind Fische gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Wiederum
  rationale: Kennzeichnet ein weiteres Gleichnis in der Folge; „wiederum“ ist knapp, verständlich und dem würdevollen Erzählton angemessen.
- source_word: ὁμοία ἐστὶν
  choice: ist wie
  rationale: Gibt die für Matthäus typische Vergleichsformel unmittelbar und idiomatisch wieder.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Bewahrt die charakteristische matthäische Formulierung in ihrer im Deutschen geläufigen Gestalt, ohne sie als „Reich Gottes“ oder „Herrschaft des Himmels“ auszulegen.
- source_word: σαγήνῃ
  choice: ein Schleppnetz
  rationale: Bezeichnet genauer ein großes Zug- beziehungsweise Schleppnetz und ist daher präziser als das allgemeine „Netz“.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: das ins Meer ausgeworfen wurde
  rationale: „Auswerfen“ ist im Deutschen die natürliche Bezeichnung für das Einbringen eines Netzes; „Meer“ wahrt die Wortwahl des griechischen Textes.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: und Fische aller Art zusammenholte
  rationale: „Zusammenholte“ hält das Motiv des Sammelns fest. „Fische“ wird für natürliches Deutsch aus dem eindeutigen Bild ergänzt, während eine Fußnote die implizite Natur des Objekts offenlegt.
theological_decisions:
- issue: Bedeutung von „ἡ βασιλεία τῶν οὐρανῶν“
  choice: das Himmelreich
  alternative: das Reich Gottes; die Herrschaft des Himmels
  rationale: Die eigentümliche Formulierung des Matthäus bleibt erhalten. Die Übersetzung ersetzt sie nicht durch eine theologisch erklärende oder harmonisierende Wendung.
- issue: Umfang des Vergleichs
  choice: Die Bildaussage bleibt beim Schleppnetz und seinem Sammeln, ohne den Vergleich allegorisch auszudeuten.
  alternative: Das Netz oder die Fischarten bereits im Vers ausdrücklich auf bestimmte Menschengruppen beziehen.
  rationale: Der Vers selbst bietet ein Gleichnisbild; seine weitere Deutung darf nicht vorwegnehmend in die Übersetzung aufgenommen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem griechischen Vergleich, wird aber durch einen deutschen Relativsatz natürlich gestaltet.
