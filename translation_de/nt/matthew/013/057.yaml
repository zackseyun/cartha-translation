review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt ἐσκανδαλίζοντο ἐν αὐτῷ idiomatisch als „sie nahmen Anstoß an ihm“ wieder. Der Kontrast von δέ ist mit „aber“ angemessen erfasst. Das Sprichwort bewahrt sowohl die Ausnahmeform εἰ μή als auch den Ehrenbegriff von ἄτιμος. „Heimat“ und „eigenes Haus“ lassen den jeweiligen Bedeutungsumfang von πατρίς und οἰκία offen und sind durch die Fußnoten sachgerecht erläutert.
  naturalness: Der Text ist flüssiges, modernes und zugleich würdiges Standarddeutsch. Die Stellung „Jesus aber sagte zu ihnen“ und die knappe Spruchform klingen natürlich. „Ohne Ansehen“ ist in diesem sprichwörtlichen Register passend.
  terminology: „Prophet“, „Anstoß nehmen“ und „Ansehen“ sind treffend und theologisch nicht überinterpretierend. Die Fußnote zu „Haus“ wahrt zutreffend die mögliche Bedeutung Haushalt bzw. Familienkreis. Die Fußnote zu „Heimat“ weist angemessen auf den weiteren möglichen Bedeutungsrahmen hin, ohne ihn im Haupttext aufzudrängen.
