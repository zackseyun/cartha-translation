id: MAT.13.57
reference: Matthew 13:57
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: de
  text: 'Und sie nahmen Anstoß an ihm.[a] Jesus aber sagte zu ihnen: »Ein Prophet ist nur in seiner Heimat[b] und in seinem eigenen Haus[c] ohne Ansehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie ärgerten sich über ihn“; wörtlich klingt die Vorstellung mit, dass sie an ihm zu Fall kamen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in seinem Herkunftsort“ beziehungsweise „in seinem Heimatland“.'
    reason: lexical_alternative
  - marker: c
    text: „Haus“ kann hier auch den Haushalt oder den Familienkreis bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: sie nahmen Anstoß an ihm
  rationale: Die deutsche Wendung gibt die übertragene Bedeutung des Anstoßnehmens wieder und lässt zugleich das im griechischen Verb enthaltene Bild des Stolperns anklingen.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jesus aber sagte zu ihnen
  rationale: Das nachgestellte „aber“ bildet den milden Kontrast von δέ zur ablehnenden Reaktion der Menschen natürlich und würdig ab.
- source_word: προφήτης
  choice: Prophet
  rationale: Dies ist die direkte und allgemein verständliche deutsche Entsprechung; der sprichwörtliche Charakter der Aussage bleibt erhalten.
- source_word: ἄτιμος
  choice: ohne Ansehen
  rationale: Die Formulierung bewahrt den Bezug auf Ehre und gesellschaftliche Anerkennung, ohne das Wort auf bloße persönliche Geringschätzung zu verengen.
- source_word: εἰ μὴ
  choice: nur
  rationale: In Verbindung mit der vorausgehenden Verneinung gibt „nur“ die ausschließende Ausnahme idiomatisch wieder.
- source_word: πατρίδι
  choice: Heimat
  rationale: πατρίς bezeichnet hier den Herkunftsort beziehungsweise die heimatliche Umgebung Jesu; „Heimat“ wahrt den möglichen Umfang besser als das engere „Heimatstadt“.
- source_word: οἰκίᾳ αὐτοῦ
  choice: in seinem eigenen Haus
  rationale: „Haus“ kann im Deutschen wie οἰκία sowohl den Wohnort als auch den häuslichen beziehungsweise familiären Kreis bezeichnen; „eigenen“ hebt die Nähe des Umfelds hervor.
theological_decisions:
- issue: Reichweite des Sprichworts über die Zurückweisung eines Propheten
  choice: Die Aussage bleibt als allgemeines Sprichwort über mangelndes Ansehen im eigenen Herkunfts- und Hauskreis stehen.
  alternative: Eine ausdrücklich auf den Unglauben der Familie Jesu oder auf seine umfassende Verwerfung zugespitzte Wiedergabe.
  rationale: Der griechische Text formuliert ein Sprichwort, das Jesus auf die konkrete Situation anwendet. Eine weitergehende dogmatische Ausdeutung wäre im Übersetzungstext nicht begründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwörtliche Kürze und der Gegensatz zwischen öffentlichem Ansehen und Ablehnung im engsten Umfeld bleiben erhalten. Die doppelte soziale Ortsangabe „Heimat“ und „eigenes Haus“ folgt dem griechischen Text, ohne die Mehrdeutigkeit von πατρίς und οἰκία vorschnell aufzulösen.
