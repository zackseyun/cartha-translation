base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: de
  text: Andere Samen fielen zwischen die Dornen[a]. Die Dornen wuchsen auf und erstickten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf die Dornen“. „Zwischen die Dornen“ gibt die Formulierung im landwirtschaftlichen Zusammenhang idiomatisch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Andere Samen
  rationale: Das substantivisch gebrauchte sächliche Pluraladjektiv verweist im Zusammenhang auf die zuvor erwähnte Saat. „Samen“ macht diesen Bezug im Deutschen natürlich und klar.
- source_word: δὲ
  choice: unmarkierter Satzanschluss
  rationale: δέ führt hier die Reihe weiter und verlangt keinen starken Gegensatz. Im Deutschen genügt nach der Satzgliederung der unmarkierte Anschluss.
- source_word: ἔπεσεν
  choice: fielen
  rationale: Die direkte Bedeutung von πίπτω wird bewahrt; „wurden gesät“ wäre gegenüber dem griechischen Verb stärker deutend.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: unter die Dornen
  rationale: ἐπί mit Akkusativ heißt wörtlich etwa „auf die Dornen“. Im landwirtschaftlichen Zusammenhang bezeichnet „unter die Dornen“ idiomatisch, dass die Saat in bereits dornbewachsenen Boden fiel.
- source_word: ἀκάνθας / ἄκανθαι
  choice: Dornen
  rationale: „Dornen“ ist die geläufige, bildkräftige Wiedergabe und kann hier sowohl den dornigen Bewuchs als auch die aufwachsenden Pflanzen bezeichnen.
- source_word: ἀνέβησαν
  choice: wuchsen auf
  rationale: Die Formulierung gibt die aufwärts gerichtete Wachstumsbewegung wieder und klingt im modernen Deutschen natürlich.
- source_word: ἔπνιξαν
  choice: erstickten
  rationale: „Ersticken“ bewahrt die kräftige Pflanzenmetapher von πνίγω, ohne sie zu einer bloßen Verdrängung abzuschwächen.
- source_word: αὐτά
  choice: sie
  rationale: Das sächliche Pluralpronomen bezieht sich auf die implizit mitgedachten Samen beziehungsweise Keimlinge; „sie“ wahrt die knappe Ausdrucksweise.
