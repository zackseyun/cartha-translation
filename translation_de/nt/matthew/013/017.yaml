id: MAT.13.17
reference: Matthew 13:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: de
  text: 'Denn ich sage euch die Wahrheit: Viele Propheten und gerechte Menschen sehnten sich danach, zu sehen, was ihr seht, und sahen es nicht, und zu hören, was ihr hört, und hörten es nicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν … λέγω ὑμῖν
  choice: ich sage euch die Wahrheit
  rationale: Die idiomatische deutsche Aussage gibt die feierliche Bekräftigungsformel vollständig wieder, ohne das im heutigen Deutsch altertümlich wirkende „wahrlich“ zu verwenden.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion kennzeichnet die Aussage als Begründung beziehungsweise Erläuterung zum vorausgehenden Zusammenhang.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: viele Propheten und gerechte Menschen
  rationale: δίκαιοι ist ein substantiviertes Adjektiv. „Gerechte Menschen“ macht diesen Personenbezug im modernen Deutsch deutlich und bewahrt die Gruppe neben den Propheten.
- source_word: ἐπεθύμησαν
  choice: sehnten sich danach
  rationale: Die Formulierung drückt das starke, anhaltende Verlangen des griechischen Verbs natürlich aus.
- source_word: ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν
  choice: zu sehen, was ihr seht, und sahen es nicht
  rationale: Die Wiedergabe erhält die Wiederholung des Sehens, den Gegensatz zwischen den Adressaten und früheren Generationen sowie die historische Verneinung.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: zu hören, was ihr hört, und hörten es nicht
  rationale: Die parallele Satzstruktur des Griechischen bleibt erhalten; die Gegenstände des Hörens werden nicht interpretierend ergänzt.
theological_decisions:
- issue: Bedeutungsumfang von δίκαιοι
  choice: „gerechte Menschen“ als eigene, weiter gefasste Personengruppe neben den Propheten
  alternative: „die Gerechten“
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet Personen. Die gewählte Form ist im modernen Deutsch unmittelbar verständlich, ohne den Begriff konfessionell näher festzulegen.
- issue: Gegenstand des Sehens und Hörens
  choice: Die offenen Relativsätze „was ihr seht“ und „was ihr hört“ bleiben erhalten.
  alternative: Ausdeutung als Jesus, der Messias oder die Geheimnisse des Himmelreichs
  rationale: Der Kontext legt einen Bezug zu Jesu Wirken und zur Offenbarung des Himmelreichs nahe, doch der Vers benennt den Gegenstand nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
- issue: Verhältnis zwischen Wunsch und Nichterfüllung
  choice: „sehnten sich danach … und sahen/hörten es nicht“
  alternative: „wollten … konnten es aber nicht“
  rationale: Der griechische Text stellt das starke Verlangen und das tatsächliche Nichtsehen beziehungsweise Nichthören fest, sagt jedoch nicht ausdrücklich, dass Unvermögen die Ursache war.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Formel wird idiomatisch statt mit dem heute markiert-altertümlichen „wahrlich“ wiedergegeben. Die auffällige Parallelität von Sehen und Hören bleibt bewusst erhalten.
