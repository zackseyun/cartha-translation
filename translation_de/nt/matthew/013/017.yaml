  source_fidelity: 'Die Übersetzung gibt die Satzglieder und Parallelstruktur des griechischen Textes zuverlässig wieder: Die einleitende Bekräftigung und das begründende γάρ sind durch „Denn ich sage euch die Wahrheit“ erfasst; „viele Propheten und gerechte Menschen“ bewahrt die zwei Gruppen; das starke Verlangen sowie das tatsächliche Nichtsehen und Nichthören bleiben klar unterschieden. Die offenen Gegenstände des Sehens und Hörens werden nicht interpretierend ergänzt.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch und bewahrt einen würdevollen, aber nicht künstlich altertümlichen Registerton. „Sehnten sich danach“ ist idiomatisch; die Wiederholung von „sahen es nicht“ und „hörten es nicht“ ist im Deutschen verständlich und entspricht der beabsichtigten Parallelität.
  terminology: „Propheten“ ist sachgerecht. „Gerechte Menschen“ vermittelt den substantivischen Plural δίκαιοι klar und ohne konfessionelle Engführung. Die Formulierung „ich sage euch die Wahrheit“ ist eine natürliche moderne Wiedergabe der feierlichen Formel ἀμὴν λέγω ὑμῖν.
