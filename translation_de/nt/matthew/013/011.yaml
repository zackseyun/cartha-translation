id: MAT.13.11
reference: Matthew 13:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: de
  text: 'Er antwortete ihnen: „Euch ist es gegeben, die Geheimnisse des Himmelreichs zu erkennen; ihnen aber ist es nicht gegeben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Er antwortete
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine geläufige, semitisch beeinflusste griechische Wendung. „Er antwortete“ gibt ihren Sinn im Deutschen natürlich wieder, ohne das hölzerne „antwortete und sagte“.
- source_word: Ὅτι
  choice: nicht eigens wiedergegeben; direkte Einleitung der Antwort
  rationale: Ὅτι kann hier den Inhalt der Antwort einleiten. Nach „Er antwortete“ ist im Deutschen die unmittelbare direkte Rede idiomatisch und wahrt den Zusammenhang, ohne ein missverständliches „weil“ einzufügen.
- source_word: ὑμῖν … ἐκείνοις
  choice: Euch … ihnen
  rationale: Die vorangestellte Form „Euch“ erhält den betonten Gegensatz zur anderen Gruppe; „ihnen“ ist für ἐκείνοις im Kontext natürlich und hinreichend deutlich.
- source_word: δέδοται … οὐ δέδοται
  choice: ist es gegeben … ist es nicht gegeben
  rationale: Das deutsche Zustandspassiv gibt den gegenwärtigen, aus einer Gewährung hervorgegangenen Zustand des griechischen Perfektpassivs knapp wieder und lässt den Geber wie im Ausgangstext unausgesprochen.
- source_word: γνῶναι
  choice: zu erkennen
  rationale: „Erkennen“ deckt hier das Erlangen von Kenntnis beziehungsweise Einsicht ab und klingt im Deutschen in Verbindung mit offenbarten Geheimnissen natürlicher als das statische „zu wissen“.
- source_word: τὰ μυστήρια
  choice: die Geheimnisse
  rationale: „Geheimnisse“ bezeichnet im biblischen Zusammenhang zuvor verborgene und nun offenbarte göttliche Wahrheiten. Es ist im heutigen Deutschen verständlicher als das potenziell rätselhaft klingende Fremdwort „Mysterien“.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: des Himmelreichs
  rationale: „Himmelreich“ ist die natürliche, etablierte deutsche Wiedergabe der matthäischen Wendung und bezeichnet Gottes Herrschaft, ohne den griechischen Plural „Himmel“ unidiomatisch nachzubilden.
theological_decisions:
- issue: Unausgesprochener göttlicher Geber im Passiv
  choice: Das Passiv beibehalten und Gott nicht ausdrücklich nennen
  alternative: „Gott hat euch gegeben“ beziehungsweise „von Gott gegeben“
  rationale: Der griechische Text lässt den Handelnden unausgesprochen. Das Passiv bewahrt diese Form und vermeidet, eine zwar naheliegende, aber nicht ausdrücklich formulierte Deutung in den Haupttext einzutragen.
- issue: Bedeutung von μυστήρια im Zusammenhang mit dem Himmelreich
  choice: „Geheimnisse“
  alternative: „Mysterien“ oder „verborgene Wahrheiten“
  rationale: „Geheimnisse“ wahrt die Vorstellung göttlicher Wirklichkeiten, die verborgen waren und erschlossen werden, ohne sie auf Rätsel oder auf ein späteres theologisches Fachsystem festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzgestalt und die Voranstellung von „Euch“ bewahren den scharfen Kontrast des griechischen Textes. Keine Fußnote ist nötig, da die wesentlichen Mehrdeutigkeiten im Haupttext erhalten bleiben.
