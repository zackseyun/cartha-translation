review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt die Struktur des griechischen Satzes zuverlässig wieder: Die kontrastiv vorangestellten Empfänger („Euch … ihnen aber“), das ungenannte Passiv von δέδοται und die Entsprechung von positiver und verneinter Aussage bleiben erhalten. Die direkte Einleitung der Rede ohne ausdrückliche Wiedergabe von ὅτι ist im Deutschen idiomatisch und im Kontext vertretbar; sie verliert keine inhaltliche Aussage.'
  naturalness: '„Er antwortete ihnen: ‚Euch ist es gegeben, die Geheimnisse des Himmelreichs zu erkennen; ihnen aber ist es nicht gegeben.‘“ ist modernes, verständliches und zugleich würdiges Standarddeutsch. Die Semikolonfügung unterstützt den griechischen Parallelismus und Kontrast.'
  terminology: „Geheimnisse“ ist eine angemessene Wiedergabe von μυστήρια, ohne es zu einem bloßen Rätsel oder zu einem späteren Fachbegriff zu verengen. „Himmelreich“ ist für die matthäische Formel τῆς βασιλείας τῶν οὐρανῶν etabliert und natürlich. Das unpersönliche Passiv vermeidet es zutreffend, den im griechischen Text nicht genannten Geber ausdrücklich zu identifizieren.
