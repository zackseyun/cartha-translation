  variant: modern standard German
source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: de
  text: Dies alles sagte Jesus in Gleichnissen zu den Menschenmengen, und ohne ein Gleichnis sagte er ihnen nichts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „... und ohne ein Gleichnis redete er nicht zu ihnen.“ Das griechische Imperfekt kann hier eine andauernde oder gewohnheitsmäßige Redeweise bezeichnen.'
    reason: Aspektuelle und lexikalische Alternative
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: Dies alles
  rationale: Bewahrt sowohl den demonstrativen Bezug als auch die umfassende Aussage und ist im Deutschen natürlich.
- source_word: ἐλάλησεν
  choice: sagte
  rationale: Der Aorist fasst Jesu Rede zusammen; „sagte“ verbindet sich idiomatisch mit „dies alles“.
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: ἐν bezeichnet hier Art oder Medium; „in Gleichnissen“ ist die natürliche und etablierte deutsche Wiedergabe.
- source_word: τοῖς ὄχλοις
  choice: zu den Menschenmengen
  rationale: Gibt den Dativ und den Plural wieder, ohne das heute teils altertümlich wirkende „Volksmengen“ zu verwenden.
- source_word: χωρὶς παραβολῆς
  choice: ohne ein Gleichnis
  rationale: Gibt χωρίς mit Genitiv klar wieder und bewahrt den Singular von παραβολῆς.
- source_word: οὐδὲν ἐλάλει
  choice: redete er nicht
  rationale: Die Negation wird im Deutschen idiomatisch mit „nicht“ ausgedrückt; das Imperfekt lässt sich als wiederholte bzw. charakteristische Redeweise verstehen.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Der Rückverweis auf die Menschenmengen bleibt knapp und eindeutig.
theological_decisions:
- issue: Erzählfunktion des Imperfekts ἐλάλει
  choice: Die Formulierung beschreibt Jesu charakteristische Redeweise gegenüber den Menschenmengen in diesem Zusammenhang.
  alternative: 'Eine rein punktuelle Wiedergabe wäre: „sagte er ihnen nichts“.'
  rationale: „redete er nicht zu ihnen“ ist im Deutschen natürlich und lässt den durativen beziehungsweise habituellen Wert des griechischen Imperfekts erkennen, ohne ihn übermäßig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschenmengen“ bewahrt den griechischen Plural; „Gleichnis“ entspricht dem etablierten biblischen Sprachgebrauch. Die Wortstellung vermeidet unnötige Altertümlichkeit und erhält zugleich den erzählerischen Nachdruck.
