  rationale: Nur die kausale Schlusswendung wurde korrigiert, damit die fehlende Tiefe der vorhandenen Erdschicht und nicht eine unnatürlich formulierte Eigenschaft „der Erde“ ausgedrückt wird. Die Ellipse und der knappe Bildcharakter des griechischen Textes bleiben erhalten.
