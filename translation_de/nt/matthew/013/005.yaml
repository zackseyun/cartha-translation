    issue: „weil die Erde nicht tief war“
    rationale: Das Griechische sagt nicht primär, die Erde sei „nicht tief“, sondern dass keine Bodentiefe vorhanden war (διὰ τὸ μὴ ἔχειν βάθος γῆς). Die Formulierung „keine tiefe Erdschicht hatte“ gibt dies im Deutschen genauer und natürlicher wieder.
  revised_text: Anderes aber fiel auf felsigen Boden[a], wo es nicht viel Erde hatte, und ging sofort auf, weil es keine tiefe Erdschicht hatte.
