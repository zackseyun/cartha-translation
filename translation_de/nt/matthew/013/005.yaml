source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: de
  text: Anderes aber fiel auf felsigen Boden[a], wo es nicht viel Erde hatte, und ging sofort auf, weil es keine tiefe Erdschicht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf die felsigen Stellen“; gemeint ist offenbar eine dünne Erdschicht über darunterliegendem Fels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Anderes aber
  rationale: Das substantivierte Neutrum Plural greift elliptisch das Saatgut aus dem vorherigen Vers auf. Im Deutschen kann „Anderes“ diese Ellipse natürlich bewahren; „aber“ gibt den Kontrast von δέ wieder.
- source_word: ἔπεσεν
  choice: fiel
  rationale: Die einfache Aussage des griechischen Verbs wird beibehalten; „wurde gesät“ würde den Vorgang stärker ausdeuten.
- source_word: ἐπὶ τὰ πετρώδη
  choice: auf felsigen Boden
  rationale: Die Wendung bezeichnet steinige oder felsige Stellen. „Felsiger Boden“ ist im heutigen Deutsch verständlich und passt zum Bild einer dünnen Erdschicht über Fels.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: wo es nicht viel Erde hatte
  rationale: Die Formulierung folgt eng der griechischen Konstruktion und lässt das grammatische Subjekt wie im Ausgangstext unausgesprochen beziehungsweise kontextabhängig. „Erde“ bezeichnet hier den zum Wachsen verfügbaren Boden.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: und ging sofort auf
  rationale: „Aufgehen“ ist die natürliche deutsche Bezeichnung für das Hervorkommen der Saat; „sofort“ wahrt die zeitliche Stärke von εὐθέως.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: weil die Erde nicht tief war
  rationale: Die kausale Infinitivkonstruktion wird klar wiedergegeben. Die natürliche deutsche Formulierung bewahrt das Bild der fehlenden Bodentiefe, ohne eine geologische Erklärung in den Vers einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Bildsprache des Gleichnisses und die elliptische Rückbindung an das Saatgut im vorherigen Vers bleiben erhalten.
