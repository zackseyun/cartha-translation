  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: de
  text: Als es voll war, zogen sie es ans Ufer, setzten sich und sammelten die guten Fische in Behälter[a]; die verdorbenen[b] aber warfen sie hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gefäße“. Das griechische Wort bezeichnet allgemein Behältnisse, nicht unbedingt Körbe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die schlechten“ beziehungsweise „die untauglichen“. Das griechische Wort kann „verdorben“, „faul“ oder allgemeiner „wertlos, untauglich“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: Als es voll war
  rationale: Das Relativpronomen bezieht sich auf das im vorherigen Vers genannte Netz. Im Deutschen nimmt „es“ diesen Bezug natürlich auf; „voll war“ gibt den erfüllten Zustand des Netzes idiomatisch wieder.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: zogen sie es ans Ufer
  rationale: Die Wendung beschreibt, wie das Netz aus dem Wasser an Land gezogen wird. „Ans Ufer“ wahrt den Küstenbezug, ohne einen Sandstrand vorauszusetzen.
- source_word: καθίσαντες
  choice: setzten sich
  rationale: Das Partizip bezeichnet die folgende Handlung in der Erzählfolge und wird in natürlichem Deutsch als koordiniertes Verb wiedergegeben.
- source_word: συνέλεξαν τὰ καλά
  choice: sammelten die guten Fische
  rationale: „Fische“ ist im Griechischen nur sinngemäß enthalten, wird aber aus dem Bild eindeutig erschlossen und sorgt im Deutschen für Klarheit.
- source_word: εἰς ἄγγη
  choice: in Behälter
  rationale: ἄγγη ist eine allgemeine Bezeichnung für Behältnisse; „Behälter“ vermeidet die unbelegte Präzisierung als Körbe.
- source_word: τὰ δὲ σαπρά
  choice: die verdorbenen aber
  rationale: σαπρός kann „verdorben“, „faul“ oder allgemeiner „untauglich/schlecht“ bedeuten. „Verdorben“ bewahrt das konkrete Bild unbrauchbarer Fische, ohne die weitere Deutung vorwegzunehmen.
- source_word: ἔξω ἔβαλον
  choice: warfen sie weg
  rationale: Die Verbindung bezeichnet das Hinauswerfen beziehungsweise Beseitigen; „wegwerfen“ ist im heutigen Deutsch natürlich und bringt die Verwerfung klar zum Ausdruck.
theological_decisions:
- issue: Deutung des Aussortierens im Gleichnis
  choice: Der Vers bleibt als konkrete Fischerszene formuliert.
  alternative: Durch deutende Begriffe bereits hier ausdrücklich auf das Endgericht vorausweisen.
  rationale: Die Auslegung des Bildes folgt erst in den nächsten Versen. Die Übersetzung sollte sie nicht vorwegnehmen, sondern Bild und Erklärung voneinander unterscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Partizipien werden als aufeinanderfolgende finite Verben wiedergegeben. Das Semikolon macht den Gegensatz zwischen Aufbewahren und Wegwerfen deutlich.
