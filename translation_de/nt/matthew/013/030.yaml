id: MAT.13.30
reference: Matthew 13:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: de
  text: 'Lasst beides miteinander wachsen bis zur Ernte. Zur Zeit der Ernte werde ich den Erntearbeitern sagen: »Sammelt zuerst das Unkraut[a] und bindet es zu Bündeln, um es zu verbrennen; den Weizen aber bringt in meine Scheune.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Taumellolch, eine dem Weizen ähnliche Unkrautart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: Lasst
  rationale: Der Aoristimperativ von ἀφίημι ist hier eine erlaubende Aufforderung; »Lasst« ist direkt, natürlich und bewahrt diese Funktion.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: beides miteinander wachsen
  rationale: »Beides« verweist auf die zwei zuvor genannten Pflanzenarten; »miteinander wachsen« gibt den συν-Gedanken des gemeinsamen Wachstums wieder.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: bis zur Ernte
  rationale: Die bestimmte Ernte als Zielpunkt des gemeinsamen Wachstums bleibt erhalten.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: Zur Zeit der Ernte
  rationale: Die Formulierung entspricht dem bestimmten, passenden Erntezeitpunkt und bleibt in modernem Deutsch natürlich.
- source_word: θερισταῖς
  choice: Erntearbeitern
  rationale: Die Bezeichnung ist allgemein verständlich und meint diejenigen, die die Ernte einbringen; »Schnitter« wäre präzise, klingt heute jedoch altertümlich.
- source_word: Συλλέξατε πρῶτον
  choice: Sammelt zuerst
  rationale: Die Reihenfolge und der konkrete Vorgang des Einsammelns werden unmittelbar wiedergegeben.
- source_word: τὰ ζιζάνια
  choice: das Unkraut
  rationale: ζιζάνια bezeichnet schädliches Beikraut, wahrscheinlich Taumellolch. Das kollektive »Unkraut« ist allgemein verständlich; die genauere botanische Möglichkeit steht in der Fußnote.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: bindet es zu Bündeln
  rationale: Die konkrete Handlung und das Ergebnis des Bindens werden idiomatisch wiedergegeben; das deutsche Singularpronomen folgt dem Kollektivum »Unkraut«.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: um es zu verbrennen
  rationale: Die Infinitivkonstruktion drückt den Zweck aus. »Verbrennen« wahrt das Bild, ohne die spätere Deutung der Parabel vorwegzunehmen.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: den Weizen aber bringt in meine Scheune
  rationale: »Aber« erhält den Gegensatz; »bringt in meine Scheune« gibt das Sammeln an den Zielort in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bildhafte Darstellung der abschließenden Trennung
  choice: Das landwirtschaftliche Bild bleibt ohne ausdrückliche Deutung als Endgericht stehen.
  alternative: Die spätere eschatologische Auslegung durch Zusätze wie »zur Vernichtung« oder »vollständig verbrennen« bereits hier ausdrücklich machen.
  rationale: Der Vers gehört zur Parabel; ihre Deutung folgt später im Kapitel. Die Übersetzung soll die Spannung des gesprochenen Bildes erhalten und die spätere Erklärung nicht in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Rede. »Erntearbeiter« vermeidet das heute altertümliche »Schnitter«. Die Semikolonsetzung hebt den Gegensatz zwischen Unkraut und Weizen klar hervor.
