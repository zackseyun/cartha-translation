  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: de
  text: So wird es am Ende des Zeitalters sein:[a] Die Engel werden hinausgehen und die Bösen aus der Mitte der Gerechten absondern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei der Vollendung des Zeitalters“. Traditionell wird auch „am Ende der Welt“ übersetzt; das griechische Wort αἰών bedeutet hier jedoch „Zeitalter“, nicht „Welt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: So wird es … sein
  rationale: Gibt die Folgerung und die Zukunftsaussage natürlich und zugleich eng am griechischen Wortlaut wieder.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: am Ende dieses Zeitalters
  rationale: „Ende“ ist allgemein verständlich; „Zeitalter“ gibt αἰών wieder und vermeidet das sachlich missverständliche „Welt“. Das Demonstrativ „dieses“ macht im Deutschen den Bezug auf das gegenwärtige Zeitalter deutlich, der im bestimmten griechischen Ausdruck kontextuell liegt.
- source_word: ἐξελεύσονται
  choice: werden ausziehen
  rationale: „Ausziehen“ bewahrt die gerichtete Bewegung des Verbs und klingt in diesem feierlichen Zusammenhang natürlicher als das mehrdeutige „hinausgehen“.
- source_word: οἱ ἄγγελοι
  choice: die Engel
  rationale: Im endzeitlichen Gerichtskontext sind himmlische Engel gemeint, nicht menschliche Boten.
- source_word: ἀφοριοῦσιν
  choice: aussondern
  rationale: Bezeichnet das Abtrennen einer Gruppe aus einer anderen und passt präzise zum Gerichtsbild.
- source_word: τοὺς πονηροὺς
  choice: die Bösen
  rationale: Das substantivierte Adjektiv bezeichnet böse Menschen; „die Bösen“ ist im modernen Deutschen klar und idiomatisch.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: aus der Mitte der Gerechten
  rationale: Bewahrt das Bild, dass beide Gruppen zunächst miteinander vermischt sind; „die Gerechten“ ist die etablierte Wiedergabe des substantivierten δικαίων.
theological_decisions:
- issue: Bedeutung von αἰών in der endzeitlichen Wendung
  choice: Zeitalter
  alternative: Welt
  rationale: αἰών bezeichnet hier ein Zeitalter beziehungsweise eine Weltzeit, nicht unmittelbar die physische Welt. Die Übersetzung vermeidet daher eine Aussage über deren Vernichtung, die der Wortlaut nicht zwingend enthält.
- issue: Identität der ἄγγελοι
  choice: himmlische Engel
  alternative: Boten
  rationale: Der Zusammenhang der abschließenden Gerichtsszene weist auf übernatürliche Engel; dies ist eine kontextuelle Bedeutungsentscheidung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Aussondern“ und „aus der Mitte“ bewahren die Präzision und Bildhaftigkeit des griechischen Textes.
