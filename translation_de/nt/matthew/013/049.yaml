  rationale: Die Revision entfernt den nicht ausgedrückten Demonstrativzusatz, ersetzt das im modernen Deutschen mehrdeutige „ausziehen“ durch „hinausgehen“ und behält die Bildlichkeit der Trennung aus einer gemischten Gruppe bei. Die Fußnote wird entsprechend an den revidierten Verswortlaut angeglichen.
