    issue: Zusatz „dieses“ in „am Ende dieses Zeitalters“
    rationale: Der griechische Text hat τοῦ αἰῶνος („des Zeitalters“), nicht „dieses Zeitalters“. Der Zusatz schränkt den Bezug stärker ein als der Wortlaut und sollte im Übersetzungstext entfallen.
  - severity: low
    issue: „werden ausziehen“ für ἐξελεύσονται
    rationale: Die Formulierung ist zwar etymologisch möglich, wirkt im modernen Deutsch aber unnötig mehrdeutig. „werden hinausgehen“ ist die klare, direkte Wiedergabe von ἐξέρχομαι.
