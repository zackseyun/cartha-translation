  source_fidelity: Die Satzstruktur und die zentralen Begriffe sind weitgehend treffend wiedergegeben. Das griechische τοῦ αἰῶνος ist jedoch ein bestimmter Genitiv („des Zeitalters“); „dieses Zeitalters“ fügt ein Demonstrativ hinzu, das im Ausgangstext nicht steht. Die inhaltliche zeitliche Einordnung kann der Kontext nahelegen, sollte aber nicht in den Verswortlaut eingetragen werden.
  naturalness: „Ausziehen“ ist im heutigen Standarddeutsch für ἐξελεύσονται mehrdeutig (Kleidung, Umzug, militärischer Auszug) und hier weniger idiomatisch. „Hinausgehen“ gibt die Bewegungsnuance klar und natürlich wieder. „Aus der Mitte der Gerechten absondern“ bewahrt die räumlich-gruppenhafte Vorstellung von ἐκ μέσου und ist verständlich.
  terminology: „Engel“, „die Bösen“, „die Gerechten“, „Zeitalter“ und „absondern“ sind angemessen. Die Fußnote bietet mit „Vollendung“ eine tragfähige lexikalische Alternative und erklärt zutreffend, dass αἰών nicht einfach „Welt“ bedeutet.
  issues:
