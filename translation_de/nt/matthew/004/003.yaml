id: MAT.4.3
reference: Matthew 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: de
  text: 'Da trat der Versucher zu ihm und sagte: »Wenn du der Sohn Gottes bist[a], dann sag, dass diese Steine zu Broten werden[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Wenn“ kann hier eine provozierende Herausforderung ausdrücken, ohne dass der Versucher Jesu Sohnschaft schlicht bezweifelt. Möglich wäre sinngemäß auch: „Da du der Sohn Gottes bist“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich steht im Griechischen der Plural: „Brote“.'
    reason: lexical_clarification
lexical_decisions:
- source_word: προσελθὼν
  choice: trat … zu ihm
  rationale: Das adverbiale Aoristpartizip von προσέρχομαι bezeichnet die Annäherung vor dem Sprechen; die deutsche Wendung ist natürlich und bewahrt die Bewegung auf Jesus zu.
- source_word: ὁ πειράζων
  choice: der Versucher
  rationale: Das substantivierte Präsenspartizip bezeichnet denjenigen, der Jesus versucht. „Der Versucher“ ist im Kontext prägnant und idiomatisch; „der Prüfer“ würde die feindliche Absicht zu wenig erkennen lassen.
- source_word: εἶπεν αὐτῷ
  choice: sagte
  rationale: Mit „zu ihm“ bereits bei der Annäherung ausgedrückt, ergibt „sagte“ eine natürliche deutsche Satzführung, ohne den Bezug auf Jesus zu verlieren.
- source_word: Εἰ
  choice: Wenn
  rationale: „Wenn“ bewahrt die grammatische Form und lässt offen, ob Zweifel, Herausforderung oder eine als gegeben vorausgesetzte Behauptung vorliegt.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Die artikellose Prädikatsbezeichnung identifiziert Jesus im matthäischen Zusammenhang mit dem bekannten einzigartigen Titel; eine unbestimmte Wiedergabe wäre im Deutschen irreführend.
- source_word: εἰπὲ ἵνα
  choice: sag, dass
  rationale: Die Verbindung aus Imperativ und ἵνα-Satz lässt sich im Deutschen unmittelbar als „sag, dass“ wiedergeben. Dies wahrt das Verb λέγω, ohne das stärkere „befiehl“ einzutragen.
- source_word: οἱ λίθοι οὗτοι
  choice: diese Steine
  rationale: Die Wiedergabe entspricht Substantiv und Demonstrativ und ist für die Wüstenszene natürlich.
- source_word: ἄρτοι
  choice: Brote
  rationale: Der Plural des griechischen ἄρτοι wird im Deutschen mit dem zählbaren Plural „Brote“ sichtbar bewahrt.
- source_word: γένωνται
  choice: zu … werden
  rationale: „Werden“ gibt γίνομαι direkt und neutral wieder, ohne die umgangssprachlichere Färbung von „sich verwandeln“.
theological_decisions:
- issue: Aussagekraft der Bedingung Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: „Wenn du der Sohn Gottes bist“
  alternative: „Da du der Sohn Gottes bist“ / „Wenn du wirklich der Sohn Gottes bist“
  rationale: Die schlichte Bedingungsform erhält die Spannung zwischen Zweifel, provokativer Herausforderung und vorausgesetzter Tatsache, ohne die Absicht des Versuchers festzulegen.
- issue: Christologischer Titel υἱὸς τοῦ θεοῦ
  choice: „der Sohn Gottes“
  alternative: „ein Sohn Gottes“
  rationale: Syntax und matthäischer Erzählzusammenhang sprechen für den bestimmten Titel. Die Übersetzung identifiziert Jesus entsprechend, ohne den Text theologisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da trat … zu ihm“ bewahrt den erzählerischen Ablauf; „sag, dass“ bleibt nahe am griechischen λέγω und vermeidet die interpretativ stärkere Formulierung „befiehl“.
