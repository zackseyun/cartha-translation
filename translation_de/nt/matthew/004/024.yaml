  source_fidelity: 'Die Übersetzung gibt die zentralen Aussagen zuverlässig wieder: Die Nachricht über Jesus verbreitet sich in ganz Syrien; Leidende werden zu ihm gebracht; und er heilt sie. „von verschiedenen Krankheiten und Qualen geplagt“, „unter der Macht von Dämonen standen“, „Menschen mit Anfällen“ und „gelähmt waren“ bilden angemessene, verständliche Wiedergaben der griechischen Partizipialgruppen. Die Wiedergabe von σεληνιαζομένους vermeidet es zu Recht, die antike Mondätiologie im Haupttext zu bestätigen, und die Fußnote dokumentiert diese Dimension.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch und der Doppelpunkt gliedert die erläuternde Aufzählung klar. „Kunde“ ist leicht gehoben, aber in einem würdigen Bibelerzählton weiterhin verständlich und natürlich genug. „Menschen mit Anfällen“ ist idiomatischer als „Menschen, die Anfälle hatten“.
  terminology: Die Begriffe „Dämonen“, „Qualen“, „gelähmt“ und „heilte“ sind treffend. Die Fußnoten bieten sachgerechte lexikalische Alternativen. Im Haupttext muss jedoch die koordinierende Reihung des Griechischen auch im letzten Glied mit „und“, nicht mit „oder“, wiedergegeben werden.
