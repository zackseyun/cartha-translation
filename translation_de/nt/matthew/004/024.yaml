reference: Matthew 4:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: de
  text: 'Und die Kunde von ihm verbreitete sich in ganz Syrien. Da brachte man alle Kranken zu ihm: Menschen, die von verschiedenen Krankheiten und Qualen geplagt wurden, unter der Macht von Dämonen standen[a], Anfälle hatten[b] und gelähmt waren. Und er heilte sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „von Dämonen Besessene“ oder „dämonisierte Menschen“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bedeutet wörtlich „Mondsüchtige“, also Menschen, deren Leiden man mit dem Mond in Verbindung brachte; traditionell wird es auch mit „Epileptiker“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: Kunde
  rationale: Gemeint ist das, was man über Jesus hörte. „Kunde“ bewahrt den Gedanken einer umlaufenden Nachricht und passt zu einem würdigen, zugleich verständlichen Register.
- source_word: ἀπῆλθεν … εἰς ὅλην τὴν Συρίαν
  choice: verbreitete sich in ganz Syrien
  rationale: Die natürliche deutsche Wendung gibt die griechische Bewegungsmetapher sinngemäß wieder und bezeichnet die Ausbreitung der Nachricht im gesamten Gebiet.
- source_word: κακῶς ἔχοντας
  choice: alle Kranken
  rationale: Die griechische Redewendung bezeichnet Menschen, denen es körperlich schlecht geht. „Kranke“ ist hier knapp und idiomatisch.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: von verschiedenen Krankheiten und Qualen geplagt
  rationale: συνέχω beschreibt ein starkes Bedrängt- oder Ergriffensein; βάσανοι bezeichnet schwere Schmerzen oder Qualen. Die Formulierung erhält diese Intensität.
- source_word: δαιμονιζομένους
  choice: unter der Macht von Dämonen standen
  rationale: Die Wiedergabe benennt den übernatürlichen Bezug ausdrücklich, ohne den griechischen Ausdruck auf eine eng definierte moderne Kategorie zu beschränken.
- source_word: σεληνιαζομένους
  choice: Anfälle hatten
  rationale: Der Ausdruck ist etymologisch mit dem Mond verbunden und bezeichnet hier offenbar Menschen mit anfallsartigen Leiden. Die Übersetzung vermittelt den wahrscheinlichen Sachbezug, ohne die antike Ursachenvorstellung zu übernehmen.
- source_word: παραλυτικούς
  choice: gelähmt waren
  rationale: Die adjektivische Form ist im heutigen Deutsch natürlicher und ebenso genau wie das substantivische „Gelähmte“.
- source_word: ἐθεράπευσεν
  choice: heilte
  rationale: θεραπεύω bezeichnet in diesem Zusammenhang das Heilen der Leidenden.
theological_decisions:
- issue: Bedeutungsumfang von δαιμονιζομένους
  choice: unter der Macht von Dämonen standen
  alternative: von Dämonen Besessene; dämonisierte Menschen
  rationale: Die Übersetzung lässt die dämonische Wirklichkeit stehen, legt aber nicht stillschweigend einen engeren technischen Grad von Einfluss oder Besitz fest, als der griechische Ausdruck eindeutig verlangt.
- issue: Wiedergabe von σεληνιαζομένους
  choice: Anfälle hatten
  alternative: Mondsüchtige; Epileptiker
  rationale: Die Hauptübersetzung benennt das erkennbare Leiden in verständlicher Sprache. Die Fußnote bewahrt sowohl die wörtliche Verbindung zum Mond als auch die traditionelle medizinische Zuordnung, ohne eine davon dogmatisch festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdigen Erzählton. Der Doppelpunkt macht deutlich, dass die folgenden Gruppen die zuvor genannten Kranken näher beschreiben. Die Aufzählung wurde im Deutschen parallel gestaltet, ohne die inhaltlichen Kategorien einzuebnen.
