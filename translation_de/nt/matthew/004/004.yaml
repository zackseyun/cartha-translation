  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: de
  text: 'Doch er antwortete: „Es steht geschrieben: ›Nicht vom Brot allein wird der Mensch[a] leben, sondern von jedem Wort, das durch den Mund Gottes hervorgeht[b].‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Der Mensch“ ist hier allgemein gemeint: der Mensch als solcher, nicht nur ein Mann.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „durch den Mund Gottes“; häufig wird sinngemäß „aus dem Mund Gottes“ übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Doch er antwortete
  rationale: Gibt die semitisch geprägte Erzählformel knapp und natürlich wieder; δέ markiert hier die entgegnende Fortführung.
- source_word: Γέγραπται
  choice: Es steht geschrieben
  rationale: 'Die geläufige deutsche Schriftformel bringt zugleich den resultativen Sinn des griechischen Perfekts zum Ausdruck: Das Geschriebene gilt fortdauernd.'
- source_word: ἄρτῳ μόνῳ
  choice: vom Brot allein
  rationale: Bewahrt den konkreten Sinn von ἄρτος und gibt die Konstruktion mit ἐπί idiomatisch deutsch wieder, ohne sie zum allgemeineren „Nahrung“ auszuweiten.
- source_word: ζήσεται
  choice: wird … leben
  rationale: Entspricht dem griechischen Futur und erhält die Form des Schriftzitats.
- source_word: ὁ ἄνθρωπος
  choice: der Mensch
  rationale: Im Kontext generisch-repräsentativ gebraucht; „der Mensch“ ist im Deutschen natürlich und bezeichnet hier die Menschheit allgemein, nicht nur einen Mann.
- source_word: παντὶ ῥήματι
  choice: von jedem Wort
  rationale: ῥῆμα bezeichnet hier das von Gott Gesprochene; „Wort“ ist präzise, verständlich und traditionsnah.
- source_word: ἐκπορευομένῳ
  choice: das … hervorgeht
  rationale: Die finite Relativsatzkonstruktion ist im Deutschen natürlich und bewahrt zugleich das Bild des ausgehenden göttlichen Redens.
- source_word: διὰ στόματος θεοῦ
  choice: durch den Mund Gottes
  rationale: Gibt διά mit Genitiv formal als „durch“ wieder und erhält das körperlich-konkrete Bild der göttlichen Äußerung.
theological_decisions:
- issue: Generischer Singular ὁ ἄνθρωπος
  choice: der Mensch
  alternative: ein Mensch; die Menschen
  rationale: Die Aussage gilt allgemein für den Menschen. Der Singular und die repräsentative Kraft des griechischen Ausdrucks bleiben erhalten, ohne die Aussage auf männliche Personen zu begrenzen.
- issue: Fortdauernde Geltung der Schriftformel Γέγραπται
  choice: Es steht geschrieben
  alternative: Es ist geschrieben
  rationale: Die gewählte deutsche Formel ist idiomatisch und lässt die fortdauernde Geltung des Geschriebenen anklingen, ohne eine zusätzliche Lehraussage einzutragen.
- issue: διά in der Wendung διὰ στόματος θεοῦ
  choice: durch den Mund Gottes
  alternative: aus dem Mund Gottes
  rationale: „Durch“ folgt der griechischen Präposition und bewahrt deren vermittelnde Bildlichkeit; die geläufigere Alternative „aus“ wird in der Fußnote genannt, ohne die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger Schriftformel. Die Wortstellung des Zitats hebt „nicht vom Brot allein“ hervor. Die Anführungszeichen unterscheiden Erzählerrede und Schriftzitat klar.
