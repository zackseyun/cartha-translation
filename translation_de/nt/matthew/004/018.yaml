  variant: modern standard German
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: de
  text: 'Als er am See von Galiläa entlangging, sah er zwei Brüder: Simon, der Petrus genannt wird, und dessen Bruder Andreas, die gerade ein Netz[a] in den See auswarfen; denn sie waren Fischer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Wurfnetz“; das griechische Wort bezeichnet ein Netz, das zum Fischfang ausgeworfen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: Als er … entlangging
  rationale: Das präsentische Partizip bezeichnet eine gleichzeitig mit dem Hauptverb ablaufende Handlung. Ein temporaler Nebensatz gibt dies im Deutschen natürlich wieder.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: am See von Galiläa entlang
  rationale: παρά mit Akkusativ bezeichnet hier die Bewegung längs des Ufers. „See von Galiläa“ ist im modernen Deutschen eine natürliche geografische Bezeichnung; obwohl θάλασσα auch „Meer“ heißen kann, handelt es sich geografisch um einen See.
- source_word: εἶδεν
  choice: sah er
  rationale: Schlichte Wiedergabe des erzählenden Aorists von ὁράω, ohne die Aussage zu „bemerkte“ zu verstärken.
- source_word: δύο ἀδελφούς
  choice: zwei Brüder
  rationale: Der Zusammenhang nennt zwei männliche leibliche Geschwister, Simon und Andreas.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Simon, der Petrus genannt wird
  rationale: Die passive Partizipialfügung wird als natürlicher Relativsatz wiedergegeben und bewahrt die Benennungsform des Griechischen.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: dessen Bruder Andreas
  rationale: „Dessen“ bezieht sich eindeutig auf Simon und gibt die appositionelle Verwandtschaftsangabe idiomatisch wieder.
- source_word: βάλλοντας
  choice: Sie warfen gerade
  rationale: Das präsentische Partizip beschreibt die Handlung, bei der Jesus die Brüder sah. „Gerade“ macht die Gleichzeitigkeit im Deutschen deutlich.
- source_word: ἀμφίβληστρον
  choice: ein Netz
  rationale: Das Wort bezeichnet ein zum Fischfang ausgeworfenes Wurfnetz. Im Haupttext bleibt „Netz“ leicht verständlich; die genauere Art wird in der Fußnote erläutert.
- source_word: εἰς τὴν θάλασσαν
  choice: in den See
  rationale: εἰς drückt die gerichtete Bewegung aus. Die Wiederaufnahme mit „See“ klingt im Deutschen natürlich und stimmt mit der geografischen Bezeichnung im Vers überein.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: denn sie waren Fischer
  rationale: „Denn“ bewahrt die erklärende Funktion von γάρ; „Fischer“ bezeichnet hier zutreffend die beiden genannten Männer und ihren Beruf.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Satzgliederung. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze geteilt. Der Bezug von „dessen“ vermeidet eine mögliche Unklarheit bei „seinen Bruder“.
