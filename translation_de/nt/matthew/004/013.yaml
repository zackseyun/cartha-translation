id: MAT.4.13
reference: Matthew 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: de
  text: Er verließ Nazara[a], kam nach Kafarnaum und ließ sich dort nieder, am See, im Gebiet von Sebulon und Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Nazara“; viele Übersetzungen haben „Nazaret“.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: Er verließ
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Sich-Niederlassen vorausgeht. Ein finites Verb gibt die Abfolge im modernen Deutschen natürlich wieder.
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: Die Übersetzung folgt der im griechischen Ausgangstext vorliegenden Namensform Ναζαρά; die geläufige deutsche Form „Nazaret“ wird in der Fußnote genannt.
- source_word: ἐλθὼν
  choice: kam nach
  rationale: Das zweite Aoristpartizip wird als koordiniertes finites Verb wiedergegeben, wodurch die Bewegungsfolge klar und idiomatisch bleibt.
- source_word: κατῴκησεν
  choice: ließ sich dort nieder
  rationale: κατοικέω bezeichnet hier die Aufnahme eines Wohnsitzes; „ließ sich nieder“ erfasst diesen dynamischen Sinn besser als das statische „wohnte“.
- source_word: Καφαρναοὺμ
  choice: Kafarnaum
  rationale: Dies ist die etablierte moderne deutsche Namensform.
- source_word: τὴν παραθαλασσίαν
  choice: am See
  rationale: Das attributive Adjektiv kennzeichnet Kafarnaum als am See gelegen. „Am See“ ist im deutschen biblisch-geografischen Zusammenhang natürlich und vermeidet die irreführende Vorstellung einer Meeresküste.
- source_word: ἐν ὁρίοις
  choice: im Gebiet von
  rationale: ὅρια bezeichnet hier die zu Sebulon und Naftali gehörende Gegend beziehungsweise deren Territorium; „Gebiet“ bewahrt den geografischen Sinn.
- source_word: Ζαβουλὼν
  choice: Sebulon
  rationale: Etablierte deutsche Form des Stammes- und Gebietsnamens.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Etablierte moderne deutsche Form des Stammes- und Gebietsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drei aufeinanderfolgenden Handlungen werden durch finite Verben klar wiedergegeben; „dort“ macht den Zielbezug des Sich-Niederlassens idiomatisch deutlich. Der Marker [a] steht unmittelbar nach dem betreffenden Ortsnamen.
