source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: de
  text: 'Und er sagt zu ihnen: „Kommt, folgt mir nach, und ich werde euch zu Menschenfischern machen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt das historische Präsens des griechischen Erzählstils und klingt im Deutschen natürlich.
- source_word: Δεῦτε ὀπίσω μου
  choice: Kommt, folgt mir nach
  rationale: „Kommt“ gibt den Ruf Δεῦτε wieder; „folgt mir nach“ überträgt ὀπίσω μου idiomatisch und bewahrt den Gedanken, hinter Jesus herzugehen.
- source_word: ποιήσω ὑμᾶς
  choice: ich werde euch zu … machen
  rationale: Die Konstruktion gibt Jesu zukünftiges, verwandelndes Handeln direkt und natürlich wieder.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: Menschenfischer
  rationale: Die im Deutschen etablierte Zusammensetzung gibt das Bild des Fischens und den generischen Bezug von ἀνθρώπων auf Menschen prägnant wieder, ohne es auf männliche Personen zu beschränken.
theological_decisions:
- issue: Generischer Personenbezug von ἀνθρώπων
  choice: Menschenfischer
  alternative: Fischer von Männern
  rationale: ἄνθρωπος bezeichnet hier Menschen allgemein. „Männer“ würde den Bedeutungsumfang im heutigen Deutschen fälschlich auf männliche Personen verengen; „Menschenfischer“ bewahrt zugleich das traditionelle Bild.
- issue: Bildhafte Aussage über die Jüngerschaft
  choice: Das Fischfangbild bleibt unaufgelöst stehen
  alternative: Ich werde euch dazu bringen, Menschen zu gewinnen
  rationale: Die Metapher soll nicht durch eine deutende Formulierung ersetzt werden; so bleiben ihre Prägnanz und mögliche Spannung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufforderung „Kommt, folgt mir nach“ ist verständlich und bildet beide Bestandteile des griechischen Rufs ab; „Menschenfischer“ ist vertraut, knapp und semantisch passend.
