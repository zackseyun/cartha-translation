  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: de
  text: Da ließen sie sofort die Netze zurück und folgten ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung hier als milde narrative Verknüpfung weiter. „Da“ schließt im Deutschen natürlich an Jesu Ruf an, ohne einen starken Gegensatz auszudrücken.
- source_word: εὐθέως
  choice: sofort
  rationale: εὐθέως betont die unverzügliche Reaktion. „Sofort“ ist klar, gegenwärtig und bewahrt die zeitliche Nachdrücklichkeit.
- source_word: ἀφέντες
  choice: ließen … zurück
  rationale: Das Aoristpartizip bezeichnet eine dem Hauptverb vorausgehende Handlung. Die koordinierte deutsche Wiedergabe ist idiomatisch und lässt die Abfolge erkennen; „verließen“ wäre bei Netzen weniger natürlich, „gaben auf“ zu stark.
- source_word: τὰ δίκτυα
  choice: die Netze
  rationale: Die bestimmte Form entspricht dem griechischen Artikel. Aus dem Zusammenhang ist klar, dass Fischernetze gemeint sind; Zusätze wie „ihre“ oder „Fischer-“ sind unnötig.
- source_word: ἠκολούθησαν αὐτῷ
  choice: folgten ihm
  rationale: ἀκολουθέω mit Dativ bezeichnet das Folgen einer Person und kann im Evangelienkontext zugleich die beginnende Jüngerschaft anklingen lassen. „Folgten ihm“ bewahrt beide Ebenen.
theological_decisions:
- issue: Jüngerschaftliche Bedeutung von ἠκολούθησαν αὐτῷ
  choice: folgten ihm
  alternative: gingen hinter ihm her
  rationale: „Folgten ihm“ kann sowohl die konkrete Bewegung als auch die Bindung als Jünger ausdrücken. Dadurch bleibt die im griechischen Verb angelegte Bedeutungsbreite erhalten, ohne sie lehrhaft auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper narrativer Satzführung. Keine Fußnoten erforderlich.
