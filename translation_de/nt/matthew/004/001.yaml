id: MAT.4.1
reference: Matthew 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: de
  text: Dann wurde Jesus vom Geist in die Wüste hinaufgeführt, um vom Teufel versucht zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geprüft zu werden“. Das griechische Verb kann sowohl „versuchen“ als auch „prüfen“ bedeuten; im unmittelbaren Zusammenhang liegt „versucht“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Der übliche zeitliche Anschluss gibt die Abfolge der Ereignisse knapp und natürlich wieder.
- source_word: ἀνήχθη
  choice: wurde … hinaufgeführt
  rationale: Die Form bewahrt sowohl das Passiv als auch die im Verb enthaltene Vorstellung einer aufwärts gerichteten Führung.
- source_word: εἰς τὴν ἔρημον
  choice: in die Wüste
  rationale: „Wüste“ bezeichnet im Deutschen natürlich eine unbewohnte, öde Gegend und passt zum judäischen Schauplatz, ohne dessen Gelände genauer festzulegen.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: vom Geist
  rationale: Der bestimmte Ausdruck verweist im unmittelbaren Zusammenhang mit der Taufe Jesu auf Gottes Geist; die Großschreibung macht diesen Bezug sichtbar, ohne „Heilig“ ergänzend einzufügen.
- source_word: πειρασθῆναι
  choice: um … versucht zu werden
  rationale: Wegen des Teufels als handelnder Person und des folgenden Erzählverlaufs steht die Bedeutung „versuchen“ im Vordergrund; die ebenfalls mögliche Bedeutung „prüfen“ bleibt in der Fußnote erhalten.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: vom Teufel
  rationale: Hier fungiert διάβολος als Bezeichnung des persönlichen Widersachers; „Teufel“ ist dafür die klare und etablierte deutsche Wiedergabe.
theological_decisions:
- issue: Identität von τοῦ πνεύματος
  choice: „der Geist“ bezeichnet Gottes Heiligen Geist
  alternative: ein Geist oder Jesu menschlicher Geist
  rationale: Der unmittelbare Erzählzusammenhang mit dem bei Jesu Taufe herabkommenden Geist stützt diese Deutung. „Geist“ gibt den Wortlaut wieder, ohne das nicht ausdrücklich vorhandene Adjektiv „heilig“ einzufügen.
- issue: Bedeutung von πειρασθῆναι
  choice: „versucht zu werden“
  alternative: „geprüft zu werden“
  rationale: Die handelnde Person, der Teufel, und die anschließenden Aufforderungen zum Bösen sprechen im unmittelbaren Zusammenhang für „versuchen“. Da das griechische Verb zugleich „prüfen“ bedeuten kann, wird diese Spannung nicht verschwiegen, sondern in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung hält Geist und Teufel als die beiden ausdrücklich genannten Handelnden klar auseinander. „Hinaufgeführt“ bewahrt die Richtungsnuance des griechischen Verbs, klingt hier jedoch etwas markierter als das allgemeinere „geführt“.
