id: MAT.4.8
reference: Matthew 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: de
  text: Wieder nimmt ihn der Teufel mit auf einen sehr hohen Berg und zeigt ihm alle Königreiche der Welt und ihre Herrlichkeit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihren Glanz.'
    reason: Lexikalische Alternative für δόξα, das hier die sichtbare Pracht beziehungsweise den Glanz der Königreiche bezeichnen kann.
lexical_decisions:
- source_word: Πάλιν
  choice: Wieder
  rationale: Kennzeichnet knapp und natürlich die Wiederholung innerhalb der Versuchungsfolge.
- source_word: παραλαμβάνει
  choice: nimmt … mit
  rationale: Gibt die begleitende Mitnahme und das historische Präsens des griechischen Erzählstils natürlich wieder.
- source_word: ὁ διάβολος
  choice: der Teufel
  rationale: Ist in diesem Zusammenhang die geläufige deutsche Bezeichnung und bewahrt die Funktion als Titel.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: auf einen sehr hohen Berg
  rationale: Bei einer Bewegung auf einen Berg ist „auf“ im Deutschen idiomatisch; „sehr“ gibt die Verstärkung durch λίαν wieder.
- source_word: δείκνυσιν
  choice: zeigt
  rationale: Entspricht dem schlichten Verb des Zeigens, ohne den Vorgang interpretierend zu verstärken.
- source_word: πάσας τὰς βασιλείας
  choice: alle Königreiche
  rationale: Bewahrt sowohl die umfassende Aussage von πάσας als auch den politisch-königlichen Sinn von βασιλείας.
- source_word: τοῦ κόσμου
  choice: der Welt
  rationale: Gibt κόσμος in diesem Zusammenhang allgemein und idiomatisch wieder.
- source_word: τὴν δόξαν αὐτῶν
  choice: ihre Herrlichkeit
  rationale: Bewahrt die breite Bedeutung und den biblischen Wortklang von δόξα; der kontextuell naheliegende sichtbare Glanz wird in der Fußnote genannt.
theological_decisions:
- issue: Art der Schau vom Berg in der Versuchungserzählung
  choice: Die Szene wird so wiedergegeben, wie sie erzählt ist, ohne die Art des Zeigens näher zu bestimmen.
  alternative: Eine rein geografische Rundschau oder eine visionäre beziehungsweise übernatürliche Offenbarung ausdrücklich festlegen.
  rationale: Der griechische Text sagt lediglich, dass der Teufel Jesus auf einen sehr hohen Berg mitnimmt und ihm alle Königreiche der Welt samt ihrer Herrlichkeit zeigt. Die Übersetzung soll keine vom Text nicht erklärte Deutung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens der griechischen Erzählung bleibt erhalten; die Wortstellung ist flüssig und allgemein verständlich.
