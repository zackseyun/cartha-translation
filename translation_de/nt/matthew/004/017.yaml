review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes angemessen wieder: Ἀπὸ τότε als „Von da an“, das ingressive ἤρξατο als „begann“, die öffentliche Verkündigung von κηρύσσειν sowie den durch λέγειν eingeführten Wortlaut. „Kehrt um!“ trifft den pluralischen Imperativ Μετανοεῖτε idiomatisch und inhaltlich. „ist nahe gekommen“ bildet das Perfekt ἤγγικεν zutreffend ab, ohne eine weitergehende eschatologische Deutung festzulegen.'
  naturalness: '„Von da an begann Jesus zu verkünden: …“ ist flüssiges, modernes Standarddeutsch mit einem dem Kontext angemessen würdevollen Register. Der Doppelpunkt ist eine natürliche deutsche Wiedergabe der Einleitung einer direkten Rede und vermeidet die unnötig steife Verdopplung „zu verkünden und zu sagen“.'
  terminology: „Himmelreich“ ist eine etablierte, idiomatische Wiedergabe von Matthäus’ βασιλεία τῶν οὐρανῶν und erhält die Formel als solche. „Kehrt um!“ ist gegenüber dem heute enger oder missverständlich wirkenden „Tut Buße!“ die klarere moderne Formulierung, ohne den Ruf auf bloßes Umdenken zu reduzieren.
