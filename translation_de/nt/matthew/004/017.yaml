id: MAT.4.17
reference: Matthew 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: de
  text: 'Von da an begann Jesus zu verkünden: „Kehrt um! Denn das Himmelreich ist nahe gekommen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Von da an
  rationale: Markiert einen erzählerischen Wendepunkt und gibt zugleich den Beginn eines fortdauernden Wirkens natürlich wieder.
- source_word: ἤρξατο
  choice: begann
  rationale: Entspricht der ingressiven Bedeutung und passt zum gehobenen Erzählstil.
- source_word: κηρύσσειν καὶ λέγειν
  choice: 'zu verkünden:'
  rationale: Das öffentliche Verkünden wird bewahrt; λέγειν führt inhaltlich die direkte Rede ein und wird im Deutschen idiomatisch durch den Doppelpunkt ausgedrückt. Die wörtlichere Alternative wäre „zu verkünden und zu sagen“.
- source_word: Μετανοεῖτε
  choice: Kehrt um!
  rationale: Gibt den Aufruf zu einer umfassenden Änderung von Denken, Haltung und Lebensrichtung in verständlichem, gegenwärtigem Deutsch wieder; „Tut Buße“ wäre traditionell, ist heute jedoch leichter missverständlich.
- source_word: ἤγγικεν
  choice: ist nahe gekommen
  rationale: 'Bewahrt den Aspekt des griechischen Perfekts: Die Nähe ist eingetreten und besteht fort.'
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Ist die natürliche und etablierte deutsche Wiedergabe von Matthäus’ charakteristischer Wendung und lässt sowohl Gottes Herrschaft als auch seinen Herrschaftsbereich anklingen.
theological_decisions:
- issue: Bedeutungsumfang von Μετανοεῖτε
  choice: Kehrt um!
  alternative: Tut Buße! / Ändert euer Denken!
  rationale: „Kehrt um“ umfasst mehr als bloß intellektuelles Umdenken und vermeidet zugleich, den Ruf auf bestimmte Bußpraktiken zu verengen.
- issue: Wiedergabe von βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  alternative: die Herrschaft der Himmel / das Reich der Himmel
  rationale: „Himmelreich“ bewahrt Matthäus’ besondere Ausdrucksweise in idiomatischem Deutsch, ohne eindeutig zwischen königlicher Herrschaft und Herrschaftsbereich zu entscheiden.
- issue: Zeitliche Aussage von ἤγγικεν
  choice: ist nahe gekommen
  alternative: ist nahe / ist herbeigekommen
  rationale: Die Formulierung hält die Spannung fest, dass die Nähe des Reiches bereits eingetreten ist und weiterhin gilt, ohne dessen volle Verwirklichung näher zu bestimmen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der Doppelpunkt vermeidet die im Deutschen schwerfällige Verdoppelung „verkünden und sagen“, ohne den Inhalt von λέγειν zu verlieren. Kurze Imperativ- und Begründungssätze erhalten die eindringliche Verkündigungsform.
