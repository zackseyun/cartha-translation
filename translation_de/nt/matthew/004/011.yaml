id: MAT.4.11
reference: Matthew 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: de
  text: Da verließ ihn der Teufel, und siehe, Engel kamen zu ihm und dienten ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „waren dabei, ihm zu dienen“. Das griechische Imperfekt kann eine andauernde Handlung bezeichnen.'
    reason: Aspektuelle Nuance und Übersetzungsalternative zu διηκόνουν.
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Kennzeichnet die zeitliche Abfolge und ist als erzählender Anschluss im modernen Deutschen natürlich.
- source_word: ἀφίησιν αὐτὸν
  choice: verließ ihn
  rationale: Das historische Präsens wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben; im Kontext bezeichnet das Verb das Weggehen des Teufels von Jesus.
- source_word: ὁ διάβολος
  choice: der Teufel
  rationale: Der Ausdruck dient hier als bekannte Bezeichnung Satans; die wörtlichere Bedeutung „Verleumder“ würde den Bezug im Erzählzusammenhang unnötig verdunkeln.
- source_word: καὶ ἰδοὺ
  choice: Und sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden, die Szene vergegenwärtigenden Charakter von ἰδού in verständlichem modernem Deutsch.
- source_word: ἄγγελοι
  choice: Engel
  rationale: Im Kontext göttlicher Fürsorge sind himmlische Wesen gemeint, nicht menschliche Boten.
- source_word: προσῆλθον
  choice: kamen zu ihm
  rationale: Gibt die Bewegung des Herantretens natürlich wieder; „zu ihm“ verdeutlicht im Deutschen das Ziel.
- source_word: διηκόνουν αὐτῷ
  choice: dienten ihm
  rationale: „Dienen“ deckt das Bedeutungsspektrum des Verbs sachlich und würdig ab. Die durative Nuance des Imperfekts wird in einer Fußnote kenntlich gemacht, da eine Verlaufsform im Deutschen hier schwerfällig wäre.
theological_decisions:
- issue: Wiedergabe von διάβολος als Personenbezeichnung
  choice: der Teufel
  alternative: der Verleumder
  rationale: Im Versuchungsbericht bezeichnet das Wort die bekannte persönliche Gestalt; „der Teufel“ stellt diesen Bezug klar her, ohne zusätzliche Lehrinhalte einzutragen.
- issue: Art des Dienstes der Engel
  choice: dienten ihm
  alternative: versorgten ihn fortwährend
  rationale: Der griechische Ausdruck lässt offen, worin der Dienst konkret bestand. Die Übersetzung bewahrt diese Offenheit und macht lediglich die im Imperfekt angelegte Dauer in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und sieh“ erhält die lebhafte Aufmerksamkeitsformel des griechischen Textes, ohne auf das stärker altertümlich wirkende „siehe“ zurückzugreifen.
