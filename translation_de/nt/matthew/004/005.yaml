  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: de
  text: Dann nimmt der Teufel ihn mit in die heilige Stadt[a] und stellt ihn auf die Zinne des Tempels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Jerusalem.
    reason: cross_reference
  - marker: b
    text: 'Oder: „den vorspringenden Rand des Tempels“ beziehungsweise „den höchsten Punkt der Tempelanlage“. Das griechische Wort kann einen flügelartigen Vorsprung oder einen hoch gelegenen äußersten Teil bezeichnen; mit „Tempel“ kann hier die gesamte Tempelanlage gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Gibt die zeitliche Abfolge der Erzählung knapp und natürlich wieder.
- source_word: παραλαμβάνει
  choice: nimmt … mit
  rationale: Das historische Präsens wird zur lebendigen Erzählweise als deutsches Präsens beibehalten; „mitnehmen“ erfasst hier die begleitete Ortsveränderung.
- source_word: ὁ διάβολος
  choice: der Teufel
  rationale: Im Zusammenhang ist διάβολος die etablierte Bezeichnung der handelnden Gestalt; „Teufel“ ist die geläufige und sachgerechte deutsche Wiedergabe.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: in die heilige Stadt
  rationale: Bewahrt sowohl die Bewegung zum Ziel als auch die ehrende Bezeichnung der Stadt, ohne den Eigennamen in den Haupttext einzusetzen.
- source_word: ἔστησεν
  choice: stellt
  rationale: 'Die Form ist hier kausativ und transitiv: Der Teufel bringt Jesus an einen Standort. Das Präsens folgt dem historischen Präsens des vorausgehenden Verbs und wirkt im Deutschen erzählerisch natürlich.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: auf die Zinne
  rationale: „Zinne“ ist die traditionelle, knappe deutsche Wiedergabe für den gemeinten vorspringenden oder hoch gelegenen Bauteil; die genaue architektonische Bedeutung bleibt jedoch unsicher und wird in der Fußnote offengelegt.
- source_word: τοῦ ἱεροῦ
  choice: des Tempels
  rationale: „Tempel“ ist im Haupttext verständlich und idiomatisch; ἱερόν kann dabei die gesamte Tempelanlage und nicht nur das innere Heiligtum bezeichnen.
theological_decisions:
- issue: Identität der „heiligen Stadt“
  choice: Die Bezeichnung „die heilige Stadt“ bleibt im Haupttext erhalten.
  alternative: Jerusalem
  rationale: Der griechische Text verwendet die ehrende Bezeichnung und nicht den Eigennamen. Die Identifizierung mit Jerusalem erfolgt transparent in einer Fußnote.
- issue: Bedeutung von πτερύγιον τοῦ ἱεροῦ
  choice: „die Zinne des Tempels“
  alternative: „der Flügel des Tempels“ beziehungsweise „der höchste Punkt der Tempelanlage“
  rationale: Der genaue architektonische Bezug ist nicht sicher. Die traditionelle und plausible Wiedergabe wird verwendet, ohne die vorhandene Mehrdeutigkeit in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit lebendigem historischem Präsens. Die traditionelle Wendung „Zinne des Tempels“ bleibt verständlich; ihre architektonische Unschärfe wird durch die Fußnote ausgeglichen.
