id: MAT.4.16
reference: Matthew 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: de
  text: Das Volk, das in der Finsternis saß, sah ein großes Licht; und denen, die im Land und im Schatten des Todes saßen, ging ein Licht auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸς
  choice: Volk
  rationale: „Volk“ gibt die kollektive Bezeichnung natürlich und im prophetischen Zitat angemessen wieder, ohne sie auf einen modernen Nationalstaat einzuengen.
- source_word: καθήμενος / καθημένοις
  choice: saß / saßen
  rationale: Die wörtliche Sitz-Metaphorik und der Parallelismus werden bewahrt; „lebte“ oder „wohnte“ wäre idiomatischer, würde aber das Bild abschwächen.
- source_word: σκοτίᾳ
  choice: Finsternis
  rationale: „Finsternis“ bewahrt sowohl die konkrete als auch die übertragene Bedeutung und entspricht dem würdevollen prophetischen Register.
- source_word: φῶς εἶδεν μέγα
  choice: sah ein großes Licht
  rationale: Der Aorist wird als einfaches Präteritum wiedergegeben; die Wortfolge klingt im Deutschen natürlich und erhält die eindrückliche Lichtmetapher.
- source_word: χώρᾳ
  choice: Land
  rationale: „Land“ ist eine natürliche und breite Entsprechung für χώρα in dieser poetisch-geografischen Wendung; „Gebiet“ wäre ebenfalls möglich, klänge jedoch technischer.
- source_word: σκιᾷ θανάτου
  choice: Schatten des Todes
  rationale: Die ausdrückliche Nennung des Todes im Griechischen sowie das vertraute biblische Bild bleiben erhalten; eine Wiedergabe als „tiefe Finsternis“ würde θανάτου verdecken.
- source_word: ἀνέτειλεν
  choice: ging ... auf
  rationale: Die übliche deutsche Wendung für das Aufgehen eines Lichtes bewahrt das Bild eines aufgehenden Himmelslichts.
- source_word: αὐτοῖς
  choice: denen
  rationale: Das vorangestellte Dativobjekt „denen“ nimmt die Empfänger des aufgehenden Lichtes ausdrücklich auf und führt natürlich zum Verb „aufgehen“.
theological_decisions:
- issue: Bedeutung der Bildsprache von Finsternis und Licht
  choice: Die Bildsprache bleibt ohne nähere dogmatische Festlegung stehen.
  alternative: Die Finsternis ausdrücklich als Sünde oder Unwissenheit und das Licht ausdrücklich als messianische Heilsoffenbarung auslegen.
  rationale: Der Vers trägt im Zusammenhang und durch sein Jesaja-Echo reiche theologische Bedeutung, legt in diesem Satz aber die einzelnen Bildbestandteile nicht eindeutig auf nur eine Bedeutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache und paralleler Satzstruktur. Keine Fußnote ist nötig, da „Schatten des Todes“ das griechische θανάτου ausdrücklich und verständlich wiedergibt.
