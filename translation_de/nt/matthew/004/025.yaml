  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: de
  text: Große Menschenmengen aus Galiläa, der Dekapolis, Jerusalem, Judäa und von jenseits des Jordan folgten ihm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der anderen Seite des Jordan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: folgten
  rationale: Das Aorist Aktiv Indikativ von ἀκολουθέω bezeichnet hier im Erzählzusammenhang das tatsächliche Folgen; „folgten“ ist natürlich und lässt zugleich offen, wie verbindlich dieses Interesse bereits war.
- source_word: ὄχλοι πολλοί
  choice: große Menschenmengen
  rationale: Die Verbindung bezeichnet zahlreiche beziehungsweise umfangreiche Volksmengen. „Große Menschenmengen“ ist im modernen Deutsch idiomatischer als das wörtlichere „viele Volksmengen“.
- source_word: ἀπό
  choice: aus
  rationale: Die Präposition kennzeichnet die Herkunft der Menschenmengen und regiert sinngemäß die gesamte Ortsliste.
- source_word: Γαλιλαίας
  choice: Galiläa
  rationale: Übliche deutsche Form des Regionsnamens.
- source_word: Δεκαπόλεως
  choice: der Dekapolis
  rationale: Übliche deutsche Bezeichnung für den als Zehnstädtegebiet bekannten Raum; nach „aus“ steht der Dativ.
- source_word: Ἱεροσολύμων
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens; die griechische morphologische Pluralform wird im Deutschen nicht nachgebildet.
- source_word: Ἰουδαίας
  choice: Judäa
  rationale: Übliche deutsche Form des Regionsnamens.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: dem Gebiet jenseits des Jordan
  rationale: πέραν mit Genitiv bezeichnet das Land auf der anderen Seite des Jordan. Die Ergänzung „dem Gebiet“ macht die Einordnung in die Herkunftsliste auf Deutsch klar, ohne ein bestimmtes politisches Territorium festzulegen.
- source_word: καὶ ... καὶ ... καὶ
  choice: Kommas mit abschließendem „und“
  rationale: Die kumulative Aufzählung bleibt erhalten; modernes deutsches Aufzählungsmuster vermeidet jedoch eine schwerfällige Wiederholung von „und“ vor jedem Ortsnamen.
theological_decisions:
- issue: Bedeutungsumfang von ἠκολούθησαν
  choice: „folgten ihm“ ohne nähere Bestimmung des Status
  alternative: „wurden seine Jünger“
  rationale: Der Text berichtet ein Folgen, legt aber nicht ausdrücklich fest, dass alle Angehörigen der Menschenmengen bereits Jünger im verbindlichen Sinn waren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die geografische Aufzählung bleibt klar und weitgehend quellennah; „Menschenmengen“ vermeidet das heute teils missverständliche „Scharen“.
