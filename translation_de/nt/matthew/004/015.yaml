  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: de
  text: Land Sebulon und Land Naftali, der Weg am Meer, jenseits des Jordan, das Galiläa der Nichtjuden[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Galiläa der Völker“; traditionell: „das Galiläa der Heiden“.'
    reason: Lexikalische Alternative für τῶν ἐθνῶν; „Völker“ bewahrt die weitere Grundbedeutung, während „Heiden“ die traditionelle deutsche Bibelterminologie dokumentiert.
lexical_decisions:
- source_word: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ
  choice: Land Sebulon und Land Naftali
  rationale: Bewahrt die parallele Wiederholung von γῆ und verwendet die im Deutschen üblichen biblischen Namensformen.
- source_word: ὁδὸν θαλάσσης
  choice: der Weg zum Meer
  rationale: Gibt die knappe, formelhafte Wendung natürlich wieder, ohne sie vorschnell als Küstenstraße oder konkrete Handelsroute festzulegen.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: jenseits des Jordan
  rationale: Bewahrt die geografische Redeweise und lässt den vorausgesetzten Blickpunkt wie im Griechischen offen.
- source_word: Γαλιλαία τῶν ἐθνῶν
  choice: das Galiläa der Völker
  rationale: Die Wiedergabe mit „Völker“ erhält die lexikalische Breite von ἔθνη und den feierlichen Klang des Schriftzitats; der mögliche Bezug auf Nichtjuden wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν im Jesaja-Zitat
  choice: Völker
  alternative: Heiden / Nichtjuden
  rationale: „Völker“ bewahrt die genuine Bedeutungsbreite und vermeidet eine im modernen Deutschen möglicherweise abwertend klingende Festlegung durch „Heiden“. Im matthäischen Kontext kann die Wendung besonders die nichtjüdische Bevölkerung bezeichnen; diese Lesart wird in der Fußnote sichtbar gehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem formelhaften Rhythmus eines Schriftzitats. Der abschließende Gedankenstrich zeigt an, dass das Zitat im folgenden Vers weitergeht.
