id: MAT.4.6
reference: Matthew 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: de
  text: 'Und er sagte zu ihm: „Wenn du der Sohn Gottes bist, wirf dich hinunter[a]. Denn es steht geschrieben: ‚Er wird seinen Engeln über dich befehlen‘, und: ‚Auf ihren Händen werden sie dich tragen[b], damit du deinen Fuß nicht an einen Stein stößt.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditioneller: „stürz dich hinab“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden sie dich emporheben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: er sagte
  rationale: Das griechische Präsens dient hier als historisches Präsens. Das deutsche Präteritum gibt den fortlaufenden Erzählstil natürlich wieder.
- source_word: Εἰ
  choice: Wenn
  rationale: Die Bedingung formuliert die Herausforderung des Versuchers, ohne ihre Voraussetzung ausdrücklich zu bestätigen.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Im matthäischen Zusammenhang fungiert die Wendung als christologischer Titel; der bestimmte Artikel ist im Deutschen idiomatisch erforderlich.
- source_word: βάλε σεαυτὸν κάτω
  choice: wirf dich hinunter
  rationale: Die Formulierung gibt den Aoristimperativ, das Reflexivpronomen und die Richtung klar und in heutigem Deutsch wieder.
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Diese feste deutsche Wendung bewahrt den durch das griechische Perfekt ausgedrückten fortdauernden Geltungsanspruch des Schriftworts.
- source_word: ἐντελεῖται
  choice: wird ... Befehl geben
  rationale: Die Formulierung bewahrt den Sinn einer verbindlichen Anordnung und entspricht der knappen Ausdrucksweise des Psalmzitats.
- source_word: περὶ σοῦ
  choice: deinetwegen
  rationale: Im Zusammenhang des Befehls an die Engel ist dies eine natürliche deutsche Wiedergabe von περί mit Genitiv, ohne den Inhalt des Befehls ergänzend auszudeuten.
- source_word: ἐπὶ χειρῶν
  choice: auf ihren Händen
  rationale: Die Wiedergabe erhält das Bild, dass die Engel den Angesprochenen auf ihren Händen stützen und tragen.
- source_word: ἀροῦσίν σε
  choice: werden sie dich tragen
  rationale: αἴρω bezeichnet hier das Aufnehmen und Tragen; „tragen“ ist im Deutschen natürlich und bewahrt das Schutzbild.
- source_word: μήποτε προσκόψῃς
  choice: damit du ... nicht ... stößt
  rationale: Die finale deutsche Konstruktion gibt den vorbeugenden Sinn von μήποτε mit dem Aoristkonjunktiv klar wieder.
- source_word: πρὸς λίθον
  choice: an einen Stein
  rationale: Die Präposition und das artikellose Substantiv werden idiomatisch und mit unbestimmtem Sinn wiedergegeben.
- source_word: τὸν πόδα σου
  choice: deinen Fuß
  rationale: Der Singular des griechischen Textes bleibt erhalten.
theological_decisions:
- issue: Christologische Tragweite von „Sohn Gottes“ in der Herausforderung des Versuchers
  choice: Wiedergabe als Titel „der Sohn Gottes“
  alternative: „Gottes Sohn“ oder formal ohne bestimmten Artikel „Sohn Gottes“
  rationale: Im Erzählzusammenhang des Matthäusevangeliums ist die Wendung eine erkennbare christologische Bezeichnung. Die Übersetzung wahrt diese Funktion, ohne zusätzliche dogmatische Aussagen in den Vers einzutragen.
- issue: Der Teufel zitiert Psalm 91 als Schriftbeleg
  choice: Das Zitat wird ohne deutenden oder korrigierenden Zusatz als Teil seiner Rede wiedergegeben.
  alternative: Eine wertende Einschränkung oder Erklärung in den Haupttext einfügen
  rationale: Der Vers lässt die Berufung des Versuchers auf die Schrift zunächst unvermittelt stehen. Die Übersetzung bewahrt diese erzählerische und theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Schriftton. Die direkte Rede und die beiden Teile des Psalmzitats bleiben deutlich erkennbar; altertümliche Verbformen werden vermieden.
