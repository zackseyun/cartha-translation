  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: de
  text: Und nachdem er vierzig Tage und vierzig Nächte gefastet hatte, bekam er Hunger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Das einfache Bindewort führt die Erzählung ohne zusätzliche zeitliche oder deutende Nuance fort.
- source_word: νηστεύσας
  choice: nachdem er … gefastet hatte
  rationale: Das vorzeitige Aoristpartizip bezeichnet eine Handlung, die der Haupthandlung vorausgeht; ein deutscher nachdem-Satz gibt dieses Verhältnis natürlich und präzise wieder.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: vierzig Tage und vierzig Nächte
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer. Im Deutschen ist diese Formulierung ohne zusätzliche Präposition klar und bewahrt den biblischen Klang.
- source_word: ὕστερον
  choice: nachdem … hatte
  rationale: ὕστερον unterstreicht, dass der Hunger nach dem Fasten eintrat. Diese zeitliche Abfolge wird im Deutschen durch den nachdem-Satz zusammen mit dem Präteritum der Haupthandlung ausgedrückt, ohne ein schwerfälliges zusätzliches „danach“.
- source_word: ἐπείνασεν
  choice: bekam er Hunger
  rationale: Die Form bezeichnet hier passend den Eintritt des Hungers nach dem Fasten. „Bekam Hunger“ ist modernes, natürliches Deutsch und gibt den dynamischen Aspekt deutlicher wieder als das bloße „war hungrig“.
theological_decisions:
- issue: Jesu wirkliches menschliches Bedürfnis nach dem Fasten
  choice: bekam er Hunger
  alternative: war er hungrig
  rationale: Die Formulierung bringt Jesu tatsächlichen körperlichen Hunger klar zum Ausdruck, ohne über den lexikalischen Gehalt des Verses hinauszugehen oder eine besondere dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die vorzeitige Partizipialkonstruktion wird idiomatisch als nachdem-Satz wiedergegeben; die ausdrückliche zeitliche Abfolge des griechischen Textes bleibt erhalten.
