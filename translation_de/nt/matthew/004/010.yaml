  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: de
  text: 'Da sagt Jesus zu ihm: „Geh weg, Satan! Denn es steht geschrieben: ›Den Herrn, deinen Gott, sollst du anbeten[a] und ihm allein dienen[b].‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollst du dich vor dem Herrn, deinem Gott, niederwerfen“. Das griechische Verb kann konkret das ehrfürchtige Niederwerfen oder Sich-Verbeugen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „dienen“ übersetzte Verb kann besonders den heiligen oder gottesdienstlichen Dienst für Gott bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Kennzeichnet knapp die Abfolge der Erzählung und klingt im modernen deutschen Erzählstil natürlich.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt als historisches Präsens die Lebendigkeit der griechischen Erzählform.
- source_word: Ὕπαγε
  choice: Geh weg
  rationale: Gibt den nachdrücklichen Imperativ der Entfernung klar und ohne altertümlichen Ton wieder.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Die im Deutschen etablierte Form des als Anrede gebrauchten Namens beziehungsweise Titels.
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Gibt die resultative Bedeutung des griechischen Perfekts in der üblichen deutschen Schriftformel wieder.
- source_word: Κύριον τὸν θεόν σου
  choice: den Herrn, deinen Gott
  rationale: Die Apposition wird im Deutschen durch ein Komma kenntlich gemacht; „Herr“ ist die sachgerechte Wiedergabe von κύριος in diesem Schriftzitat.
- source_word: προσκυνήσεις
  choice: sollst du anbeten
  rationale: Im Kontext der allein Gott geschuldeten Verehrung bezeichnet das Verb Anbetung; die konkretere Grundbedeutung des Niederwerfens wird in einer Fußnote erhalten.
- source_word: αὐτῷ μόνῳ
  choice: ihm allein
  rationale: Bewahrt die Hervorhebung der Ausschließlichkeit und ist zugleich natürliches, würdiges Deutsch.
- source_word: λατρεύσεις
  choice: dienen
  rationale: Wahrt den Unterschied zu προσκυνήσεις und lässt zugleich den im Kontext religiösen Dienst erkennen; dessen besondere Nuance wird in einer Fußnote erläutert.
theological_decisions:
- issue: Unterscheidung zwischen προσκυνέω und λατρεύω
  choice: προσκυνήσεις mit „anbeten“ und λατρεύσεις mit „dienen“ wiedergeben
  alternative: Beide Verben mit Anbetungssprache wiedergeben oder προσκυνήσεις konkreter als „sich niederwerfen vor“ übersetzen
  rationale: Der griechische Text verwendet zwei verwandte, aber verschiedene Verben. Die unterschiedliche Wiedergabe bewahrt die Spannung zwischen ehrfürchtiger Anbetung und dem allein Gott geltenden Dienst, ohne beide Begriffe gleichzusetzen.
- issue: Bezug von μόνῳ
  choice: „ihm allein“
  alternative: „allein dienen“
  rationale: Die gewählte Wortstellung macht deutlich, dass die Ausschließlichkeit auf Gott als den alleinigen Empfänger des Dienstes zielt, nicht bloß auf die Art der Tätigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Das historische Präsens („sagt“) und die etablierte Schriftformel („es steht geschrieben“) bewahren die Ausdrucksweise des griechischen Textes; die beiden Verben für Anbetung und religiösen Dienst bleiben bewusst unterschieden.
