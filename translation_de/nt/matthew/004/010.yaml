  terminology: „Anbeten“ für προσκυνέω und „dienen“ für λατρεύω bewahren sinnvoll die im griechischen Text vorhandene Unterscheidung. Die Fußnoten erläutern die körperlich-ehrerbietige Nuance von προσκυνέω sowie den kultisch-religiösen Sinnbereich von λατρεύω, ohne die Übersetzung zu überladen oder eine konfessionelle Deutung einzutragen. „Satan“ und „Herr“ sind korrekt und im Deutschen etabliert.
