  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: de
  text: 'damit sich erfüllte, was durch den Propheten Jesaja gesagt worden war:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet einen Zweck- bzw. Ergebnissatz ein und bewahrt den zielgerichteten Zusammenhang in natürlichem Deutsch.
- source_word: πληρωθῇ
  choice: sich erfüllte
  rationale: Der Aorist Passiv Konjunktiv von πληρόω steht in einem ἵνα-Satz. Die im Deutschen übliche Wendung „sich erfüllen“ gibt das Erfüllungsmotiv idiomatisch wieder, ohne es theologisch auszudeuten.
- source_word: τὸ ῥηθὲν
  choice: was … gesagt worden war
  rationale: Der substantivierte passive Aoristpartizip bezeichnet „das Gesagte“. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass das prophetische Reden dem berichteten Geschehen vorausging.
- source_word: διὰ
  choice: durch
  rationale: διά mit Genitiv bezeichnet hier vermittelte Urheberschaft bzw. das menschliche Sprachrohr und wird daher mit „durch“ wiedergegeben.
- source_word: Ἠσαΐου
  choice: Jesaja
  rationale: Die im Deutschen etablierte Namensform des Propheten.
- source_word: τοῦ προφήτου
  choice: den Propheten
  rationale: Die appositionelle Bezeichnung der prophetischen Rolle Jesajas bleibt ausdrücklich erhalten.
- source_word: λέγοντος
  choice: '[durch Doppelpunkt wiedergegeben]'
  rationale: Das Partizip leitet das unmittelbar folgende Zitat ein. Im natürlichen Deutschen übernimmt der Doppelpunkt diese Funktion, während ein zusätzliches „der sagte“ schwerfälliger wäre.
theological_decisions:
- issue: Matthäische Erfüllungsformel
  choice: „damit sich erfüllte“
  alternative: „damit wahr wurde“ oder „so ging in Erfüllung“
  rationale: „Erfüllte“ bewahrt das für Matthäus kennzeichnende Schrift- und Erfüllungsmotiv sowie die mögliche Zweck-/Ergebnisnuance von ἵνα, ohne die Art der Erfüllung näher festzulegen.
- issue: Vermittlung prophetischer Rede
  choice: „durch den Propheten Jesaja“
  alternative: „vom Propheten Jesaja“
  rationale: „Durch“ wahrt die im griechischen διά liegende Vorstellung der Vermittlung, ohne den letztlichen Urheber ausdrücklich zu benennen und damit über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Einleitung zum folgenden Schriftzitat bewusst syntaktisch offen; der Doppelpunkt zeigt diese Fortsetzung an.
