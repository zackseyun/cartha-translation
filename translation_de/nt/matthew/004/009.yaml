  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Das alles werde ich dir geben, wenn du dich niederwirfst und mich anbetest[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dich vor mir verbeugst“ oder „mir huldigst“. Das griechische Verb kann eine ehrerbietige Verbeugung oder Huldigung bezeichnen; hier spricht der Zusammenhang jedoch für „anbeten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache koordinierende Konjunktion bewahrt den Erzählfluss, ohne eine ausdrücklich zeitliche Bedeutung hinzuzufügen.
- source_word: εἶπεν αὐτῷ
  choice: er sagte zu ihm
  rationale: Die Übersetzung bewahrt die Pronomen des griechischen Textes und fügt keinen Namen ein.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Das alles werde ich dir geben
  rationale: „Das alles“ gibt den umfassenden Bezug auf die zuvor gezeigten Reiche und ihre Herrlichkeit natürlich wieder; das Futur drückt das Angebot unmittelbar aus.
- source_word: ἐὰν
  choice: wenn
  rationale: „Wenn“ leitet die Bedingung im modernen Standarddeutsch klar und schlicht ein.
- source_word: πεσὼν
  choice: du dich niederwirfst
  rationale: Die Wendung bewahrt die konkrete körperliche Bewegung des vorangehenden Aoristpartizips und ist im Deutschen natürlicher als das wörtlichere „niederfällst“.
- source_word: προσκυνήσῃς μοι
  choice: mich anbetest
  rationale: Im Versuchungskontext und angesichts der Antwort Jesu im folgenden Vers ist religiöse Anbetung gemeint. Der weitere Bedeutungsumfang des Verbs wird in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe von προσκυνέω in der Forderung des Versuchers
  choice: mich anbetest
  alternative: dich vor mir verbeugst / mir huldigst
  rationale: Der unmittelbare Kontext und der Hinweis auf die allein Gott gebührende Anbetung im folgenden Vers sprechen für „anbeten“. Die Fußnote bewahrt zugleich die echte lexikalische Spannweite des griechischen Verbs.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Sich niederwerfen“ erhält das körperliche Bild, während „anbeten“ die religiöse Tragweite des Zusammenhangs ausdrückt.
