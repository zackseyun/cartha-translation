review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt alle Elemente des Griechischen sachgerecht wieder: Das temporale Aoristpartizip Ἀκούσας mit „Als er … hörte“, δέ als schwach verbindendes „aber“, παρεδόθη in seiner gegenüber „festgenommen“ weiteren passiven Bedeutung mit „ausgeliefert worden war“, ἀνεχώρησεν mit „zog er sich … zurück“ und εἰς mit der idiomatischen Richtungsangabe „nach Galiläa“. Das Plusquamperfekt ist im Deutschen für das vorausliegende Ereignis angemessen.'
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und bewahrt einen knappen, würdevollen erzählerischen Registerton. Die Stellung von „aber“ nach „er“ ist unbetont und natürlich. „Zog er sich nach Galiläa zurück“ ist idiomatisch und überdeutet das Verb nicht als Flucht.
  terminology: „Johannes“ und „Galiläa“ sind die üblichen deutschen biblischen Namensformen. „Ausgeliefert“ wahrt bei παρεδόθη den Gedanken des Übergebenwerdens in fremde Gewalt besser als die engere Kontextkonkretisierung „festgenommen“. Die Fußnote bietet diese Konkretisierung klar als Alternative an, ohne den Haupttext einzuengen.
