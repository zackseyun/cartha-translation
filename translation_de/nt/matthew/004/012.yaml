id: MAT.4.12
reference: Matthew 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: de
  text: Als er aber hörte, dass Johannes ausgeliefert worden war[a], zog er sich nach Galiläa zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Zusammenhang genauer: „festgenommen worden war“.'
    reason: 'Lexikalische Alternative: Der Kontext erlaubt eine konkretere Wiedergabe, während der Haupttext den weiteren Sinn des griechischen Verbs bewahrt.'
lexical_decisions:
- source_word: Ἀκούσας
  choice: Als er … hörte
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die zeitlich zur Haupthandlung steht. Die Konstruktion mit „als“ gibt diesen Zusammenhang in natürlichem Deutsch wieder; das Subjekt ist aus dem Kontext als Jesus zu erschließen.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert einen leichten erzählerischen Übergang und kann zugleich einen schwachen Gegensatz zum vorangehenden Geschehen anzeigen. Das unbetonte „aber“ bewahrt diese Funktion, ohne einen starken Kontrast zu erzwingen.
- source_word: Ἰωάννης
  choice: Johannes
  rationale: Gebräuchliche deutsche Namensform.
- source_word: παρεδόθη
  choice: ausgeliefert worden war
  rationale: Das Passiv von παραδίδωμι hat einen weiteren Bedeutungsumfang als ein technischer Ausdruck für eine Festnahme. „Ausgeliefert“ bewahrt den Gedanken der Übergabe in die Gewalt anderer; das Plusquamperfekt verdeutlicht, dass dies vor Jesu Rückzug geschehen war.
- source_word: ἀνεχώρησεν
  choice: zog er sich … zurück
  rationale: ἀναχωρέω bezeichnet bei Matthäus häufig ein Weggehen oder Sichzurückziehen als Reaktion auf eine Lage. Die Formulierung wahrt diese Nuance, ohne wie „fliehen“ ein bestimmtes Motiv festzulegen.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: εἰς drückt die Richtung des Ortswechsels aus. Bei Gebiets- und Ländernamen ist „nach“ im Deutschen die natürliche Entsprechung.
theological_decisions:
- issue: Wiedergabe von παραδίδωμι in Bezug auf Johannes
  choice: ausgeliefert worden war
  alternative: festgenommen worden war
  rationale: Der griechische Ausdruck ist weiter als die konkrete Festnahme und kann bei Matthäus zusätzliche Anklänge an eine Übergabe in fremde Gewalt tragen. Der Haupttext bewahrt diese Bedeutungsbreite, während die im unmittelbaren Zusammenhang naheliegende Konkretisierung in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und erzählerisch. „Aber“ ist bewusst unbetont als leichter Übergang gesetzt; „zog sich zurück“ vermeidet sowohl das flache „ging weg“ als auch das motivisch stärkere „floh“.
