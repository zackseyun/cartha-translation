id: MAT.4.23
reference: Matthew 4:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: de
  text: Und Jesus zog durch ganz Galiläa, lehrte in ihren Synagogen, verkündete die gute Nachricht vom Reich[a] und heilte jede Krankheit und jedes Leiden im Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Evangelium vom Reich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: zog durch
  rationale: Das Imperfekt beschreibt Jesu fortdauernde Wandertätigkeit; „zog durch“ gibt Bewegung und regionale Ausdehnung natürlich wieder.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: durch ganz Galiläa
  rationale: Bei einem Bewegungsverb bezeichnet die Wendung die Verteilung über die gesamte Region.
- source_word: διδάσκων
  choice: Er lehrte
  rationale: Ein selbstständiger deutscher Satz gibt das gleichzeitig ablaufende Partizip klar und natürlich wieder.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: in ihren Synagogen
  rationale: „Synagogen“ bezeichnet hier die jüdischen Versammlungsorte; das Possessivpronomen αὐτῶν bleibt erhalten.
- source_word: κηρύσσων
  choice: verkündete
  rationale: Das Verb bezeichnet öffentliches, autoritatives Bekanntmachen; „verkündete“ ist im Deutschen würdig und verständlich.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: die gute Nachricht vom Reich
  rationale: „Gute Nachricht“ macht die Grundbedeutung von εὐαγγέλιον transparent. „Vom Reich“ bewahrt die mögliche charakterisierende oder inhaltliche Beziehung des Genitivs, ohne sie enger festzulegen.
- source_word: θεραπεύων
  choice: heilte
  rationale: Im Kontext bezeichnet θεραπεύω tatsächliches Heilen.
- source_word: πᾶσαν νόσον
  choice: jede Krankheit
  rationale: „Krankheit“ ist eine natürliche Entsprechung für νόσος und wahrt zusammen mit dem folgenden Ausdruck die umfassende Doppelung.
- source_word: πᾶσαν μαλακίαν
  choice: jedes Leiden
  rationale: μαλακία kann Krankheit, Schwäche oder Gebrechen bezeichnen. „Leiden“ ist breit genug und vermeidet im Deutschen die nahezu tautologische Paarung „Krankheit und Krankheit“.
- source_word: ἐν τῷ λαῷ
  choice: im Volk
  rationale: Die Wendung bezeichnet den Bereich beziehungsweise Personenkreis, in dem Jesus heilte; „im Volk“ ist knapp und bewahrt λαός.
theological_decisions:
- issue: Wiedergabe von εὐαγγέλιον
  choice: gute Nachricht
  alternative: Evangelium
  rationale: Die direkte lexikalische Bedeutung ist für heutige Leser transparent; der traditionelle theologische Ausdruck bleibt als Fußnotenalternative erhalten.
- issue: Beziehung zwischen εὐαγγέλιον und βασιλεία
  choice: gute Nachricht vom Reich
  alternative: gute Nachricht über das Reich
  rationale: „Vom Reich“ lässt offen, ob der Genitiv die Nachricht inhaltlich, charakterisierend oder ursprungsbezogen näher bestimmt.
- issue: Umfang der Heilungen in πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: jede Krankheit und jedes Leiden
  alternative: alle Arten von Krankheiten und Gebrechen
  rationale: Die zweimalige Verwendung von πᾶσαν wird bewahrt und stellt die umfassende Darstellung heraus, ohne über die Aussage des Verses hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechischen Begleitpartizipien werden zur besseren deutschen Lesbarkeit als koordinierte finite Verben wiedergegeben. „Reich“ bleibt ohne erklärenden Zusatz stehen, damit die knappe Formulierung und ihre theologische Spannung erhalten bleiben.
