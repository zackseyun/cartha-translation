  to: 'Und als er von dort weiterging, sah er zwei andere Brüder: Jakobus, den Sohn des Zebedäus, und seinen Bruder Johannes. Sie waren mit ihrem Vater Zebedäus im Boot und besserten ihre Netze aus. Und er rief sie.'
