  naturalness: Modernes Standarddeutsch und die Satzgliederung sind klar und gut lesbar. „Sie waren mit ihrem Vater Zebedäus im Boot und besserten ihre Netze aus“ ist natürlich.
  terminology: Die traditionellen deutschen Namen Jakobus, Johannes und Zebedäus sind angemessen. „Boot“ trifft πλοῖον im Fischereikontext; „Netze ausbessern“ gibt καταρτίζω kontextgerecht wieder. „rief“ bewahrt die knappe, nicht ausgeführte Bedeutung von ἐκάλεσεν.
