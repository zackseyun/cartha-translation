source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: de
  text: 'Und als er von dort weiterging, sah er zwei andere Brüder: Jakobus, den Sohn des Zebedäus, und seinen Bruder Johannes. Sie waren mit ihrem Vater Zebedäus im Boot und besserten ihre Netze aus. Und er rief sie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: als er von dort weiterging
  rationale: Das aoristische Partizip bezeichnet das Weitergehen vom zuvor genannten Ort. Die temporale Wiedergabe ist im Deutschen natürlich und bewahrt den erzählerischen Ablauf.
- source_word: εἶδεν
  choice: sah er
  rationale: Die schlichte Bedeutung von ὁράω wird ohne interpretierende Verstärkung wiedergegeben.
- source_word: ἄλλους δύο ἀδελφούς
  choice: zwei andere Brüder
  rationale: ἄλλους kennzeichnet sie als ein weiteres Brüderpaar nach den zuvor erwähnten Brüdern.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jakobus, den Sohn des Zebedäus
  rationale: Die elliptische Genitivkonstruktion bezeichnet die Abstammung; im Deutschen muss ‚Sohn‘ sinngemäß ergänzt werden.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder Johannes
  rationale: Die Formulierung bezeichnet Johannes als Bruder des Jakobus und ist in dieser Wortstellung natürliches Deutsch.
- source_word: ἐν τῷ πλοίῳ
  choice: im Boot
  rationale: Im Zusammenhang des Fischfangs bezeichnet πλοῖον ein Boot, nicht ein großes Schiff.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: mit ihrem Vater Zebedäus
  rationale: μετά mit Genitiv drückt Begleitung aus; die deutsche Wortfolge ist idiomatisch und bewahrt die Identifikation des Vaters.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: besserten ihre Netze aus
  rationale: καταρτίζω meint hier, beschädigte oder ungeordnete Fischernetze wieder gebrauchsfertig zu machen. ‚ausbessern‘ trifft den Kontext genauer als ein allgemeines ‚vorbereiten‘.
- source_word: ἐκάλεσεν αὐτούς
  choice: Da rief er sie
  rationale: καλέω wird schlicht als ‚rufen‘ wiedergegeben. ‚Da‘ markiert den nächsten Erzählschritt, ohne den nicht ausdrücklich genannten Inhalt des Rufes hinzuzufügen.
theological_decisions:
- issue: Jüngerschaft als Implikation von ἐκάλεσεν
  choice: Da rief er sie.
  alternative: Da rief er sie auf, ihm zu folgen.
  rationale: Der Zusammenhang macht deutlich, dass es um die Berufung in die Nachfolge geht; der Vers selbst nennt jedoch weder den Inhalt des Rufes noch ausdrücklich das Folgen. Die knappe Wiedergabe bewahrt diese textliche Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in drei Sätze gegliedert, ohne Informationen auszulassen oder hinzuzufügen. Traditionelle deutsche Namensformen wurden beibehalten.
