  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: de
  text: Sofort[a] ließen sie das Boot und ihren Vater zurück und folgten ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sogleich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: sie
  rationale: Der substantivierte Artikel verweist auf die zuvor genannten Brüder. δέ ist hier ein schwaches, fortführendes Bindewort; die deutsche Satzfolge gibt diesen Erzählanschluss natürlich wieder, ohne einen unnötigen Gegensatz zu markieren.
- source_word: εὐθέως
  choice: Sofort
  rationale: Das Wort betont die unverzügliche Reaktion der Brüder. Die Voranstellung wahrt den Nachdruck des griechischen Textes und klingt zugleich natürlich.
- source_word: ἀφέντες
  choice: ließen … zurück
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Folgen vorausgeht. Die finite deutsche Form gibt den Ablauf idiomatisch wieder; „zurücklassen“ wahrt die konkrete Bedeutung, ohne die stärkere Vorstellung eines endgültigen Verstoßens einzutragen.
- source_word: τὸ πλοῖον
  choice: das Boot
  rationale: Im Zusammenhang des Fischfangs bezeichnet πλοῖον ein Boot; „Schiff“ wäre hier unnötig groß und weniger treffend.
- source_word: τὸν πατέρα αὐτῶν
  choice: ihren Vater
  rationale: Die natürliche deutsche Possessivkonstruktion erhält die familiäre Dimension der geschilderten Entscheidung.
- source_word: ἠκολούθησαν αὐτῷ
  choice: folgten ihm
  rationale: Die Wendung bezeichnet sowohl das konkrete Mitgehen als auch, im Evangelienkontext, die Nachfolge als Jünger. Die knappe Wiedergabe bewahrt beide Ebenen.
theological_decisions:
- issue: Nachfolge und Trennung von der Familie
  choice: Die Brüder lassen Boot und Vater unverzüglich zurück, um Jesus zu folgen, ohne dass die Übersetzung eine endgültige Preisgabe des Vaters behauptet.
  alternative: „Sie verließen ihren Vater für immer“ oder eine abschwächende Deutung als bloß vorübergehendes Weggehen.
  rationale: Der Text hebt die sofortige und entschiedene Reaktion hervor. ἀφέντες bezeichnet hier das Zurücklassen, legt aber für sich genommen weder die Dauer noch sämtliche späteren familiären Beziehungen fest.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Voranstellung von „Sofort“ trägt den erzählerischen Nachdruck; der übrige Satz bleibt bewusst schlicht und nah an der griechischen Koordination.
