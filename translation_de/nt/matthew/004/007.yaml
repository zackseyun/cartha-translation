id: MAT.4.7
reference: Matthew 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Wiederum steht geschrieben: ‚Du sollst den Herrn, deinen Gott, nicht auf die Probe stellen.‘“[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du sollst den Herrn, deinen Gott, nicht versuchen.“ Das griechische Verb ἐκπειράζω kann „versuchen“ oder „auf die Probe stellen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Zitat aus 5. Mose 6,16. Das griechische „Herr“ folgt der Wiedergabe des Gottesnamens in der Septuaginta.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: Die schlichte Redeeinleitung gibt den Aorist von φημί und den Dativ αὐτῷ natürlich und ohne zusätzliche Nachdrücklichkeit wieder.
- source_word: Πάλιν γέγραπται
  choice: Wiederum steht geschrieben
  rationale: „Wiederum“ bewahrt den Sinn eines erneuten, hier entgegnenden Schriftzitats; „steht geschrieben“ ist die geläufige deutsche Zitierformel und bringt die fortdauernde Geltung des Perfekts zum Ausdruck.
- source_word: Οὐκ ἐκπειράσεις
  choice: Du sollst … nicht auf die Probe stellen
  rationale: Das Futur fungiert im Zitat als Verbot. „Auf die Probe stellen“ gibt den verstärkten Gehalt von ἐκπειράζω idiomatisch wieder.
- source_word: κύριον τὸν θεόν σου
  choice: den Herrn, deinen Gott
  rationale: Die Apposition wird im Deutschen durch Kommas kenntlich gemacht. „Herr“ folgt dem griechischen κύριος und wahrt zugleich den Klang des alttestamentlichen Zitats.
theological_decisions:
- issue: Wiedergabe von κύριος in einem Schriftzitat über den Gott Israels
  choice: den Herrn
  alternative: den HERRN
  rationale: Der unmittelbare Ausgangstext ist griechisch und hat κύριον. Daher steht im Haupttext „Herr“; der Bezug zur Wiedergabe des Gottesnamens in der Septuaginta wird in einer Fußnote erläutert.
- issue: Bedeutungsumfang von ἐκπειράζω
  choice: auf die Probe stellen
  alternative: versuchen
  rationale: Die gewählte Formulierung bezeichnet das herausfordernde Erproben Gottes, ohne die Aussage weiter theologisch auszudeuten; die traditionelle Alternative wird als lexikalische Möglichkeit vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wiederum steht geschrieben“ bewahrt bewusst den biblischen Zitierklang; die direkte Rede bleibt klar und allgemein verständlich.
