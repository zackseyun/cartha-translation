id: MAT.12.28
reference: Matthew 12:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: de
  text: Wenn ich aber die Dämonen durch den Geist Gottes[a] austreibe, dann ist das Reich Gottes zu euch gelangt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Geist Gottes“. Die griechische Wendung kann hier das Mittel bzw. die Wirksamkeit oder die Sphäre des Handelns ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „dann ist das Reich Gottes über euch gekommen“ oder „bei euch angekommen“. Das griechische Verb betont, dass Gottes Reich sie in Jesu Wirken erreicht hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn … aber
  rationale: Bewahrt sowohl die Bedingung als auch den leichten Gegensatz und klingt im Deutschen natürlich.
- source_word: ἐν πνεύματι θεοῦ
  choice: durch den Geist Gottes
  rationale: ἐν mit Dativ bezeichnet hier plausibel Mittel oder Wirksamkeit. „Durch“ gibt die göttliche Mitwirkung klar wieder; die mögliche lokale bzw. sphärische Nuance wird in der Fußnote erhalten.
- source_word: ἐγὼ
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen bleibt erhalten; durch die deutsche Wortstellung ist die Person klar hervorgehoben, ohne künstliche Zusatzbetonung.
- source_word: ἐκβάλλω
  choice: austreibe
  rationale: „Austreiben“ ist im Deutschen die klare und etablierte Bezeichnung für die Vertreibung von Dämonen und bewahrt die Kraft des Verbs.
- source_word: τὰ δαιμόνια
  choice: die Dämonen
  rationale: Entspricht dem bestimmten griechischen Ausdruck und bezeichnet die dämonischen Wesen direkt, ohne sie durch eine Umschreibung zu deuten.
- source_word: ἄρα
  choice: dann
  rationale: Kennzeichnet bündig die Folgerung aus dem vorausgehenden Bedingungssatz.
- source_word: ἔφθασεν
  choice: ist … gelangt
  rationale: Gibt das Erreichen bzw. Angekommensein wieder und wahrt den gegenwärtigen Aussagewert des griechischen Aorists, ohne das Verb auf bloße Nähe abzuschwächen.
- source_word: ἐφ’ ὑμᾶς
  choice: zu euch
  rationale: Gibt das Erreichen der Angeredeten in natürlichem modernem Deutsch wieder. Die bildhafteren Alternativen „über euch gekommen“ und „bei euch angekommen“ werden in der Fußnote dokumentiert.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die geläufige und sachlich umfassende Wiedergabe bewahrt sowohl Gottes Königsherrschaft als auch den mit ihr verbundenen Herrschaftsbereich.
theological_decisions:
- issue: Verhältnis des Reiches Gottes zu Jesu Dämonenaustreibungen
  choice: Jesu Austreiben der Dämonen durch Gottes Geist bezeugt, dass Gottes Reich die Angeredeten bereits wirklich erreicht hat.
  alternative: Das Reich sei lediglich nahe oder ausschließlich zukünftig.
  rationale: ἔφθασεν bezeichnet hier das Gelangen bzw. Erreichen. Die Aussage hält die gegenwärtige Ankunft fest, ohne damit die Spannung zu einer künftigen Vollendung aufzulösen.
- issue: Bezug von „Geist Gottes“
  choice: Der Ausdruck wird als Bezeichnung für Gottes Geist wiedergegeben.
  alternative: Eine unpersönliche göttliche Kraft.
  rationale: πνεῦμα θεοῦ bezeichnet im Kontext den Geist Gottes als denjenigen, durch dessen Wirken Jesus Dämonen austreibt. Die Übersetzung fügt keine weitergehende dogmatische Bestimmung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Austreiben“ und „Reich Gottes“ sind verständliche, etablierte biblische Begriffe. Die Satzstellung folgt natürlichem Deutsch und bewahrt zugleich die argumentative Bedingung und Folgerung.
