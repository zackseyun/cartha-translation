id: MAT.12.29
reference: Matthew 12:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: de
  text: Oder wie kann jemand in das Haus des Starken gelangen und seinen Hausrat[a] an sich reißen, wenn er nicht zuerst den Starken fesselt[b]? Und dann wird er sein Haus ausplündern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Besitz“. Das griechische Wort bezeichnet wörtlich Geräte oder Gefäße, kann hier aber allgemein den Hausrat oder die Besitztümer meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bindet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet eine weitere, an das vorherige Argument anknüpfende Veranschaulichung ein.
- source_word: πῶς δύναταί τις
  choice: wie kann jemand
  rationale: Bewahrt die rhetorische Frage und gibt den unbestimmten, allgemein gehaltenen Handelnden natürlich wieder.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: in das Haus … gelangen
  rationale: Gibt das Eintreten idiomatisch wieder, ohne die im Verb selbst nicht ausdrücklich enthaltene Vorstellung eines gewaltsamen Eindringens hinzuzufügen.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: des Starken / den Starken
  rationale: Das substantivierte Adjektiv erhält die konkrete männliche Gestalt des Vergleichs; „der Starke“ klingt im Deutschen natürlicher und prägnanter als „der starke Mann“.
- source_word: τὰ σκεύη αὐτοῦ
  choice: seinen Hausrat
  rationale: Das Wort bezeichnet wörtlich Geräte oder Gefäße, im Bild eines Hauses jedoch umfassender dessen beweglichen Besitz. „Hausrat“ wahrt sowohl den konkreten häuslichen Bezug als auch die weitere Bedeutung.
- source_word: ἁρπάσαι
  choice: an sich reißen
  rationale: Bringt das gewaltsame Ergreifen zum Ausdruck und unterscheidet sich bewusst vom stärkeren, nachfolgenden διαρπάσει.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: wenn er nicht zuerst … fesselt
  rationale: Bewahrt Bedingung und zeitliche Reihenfolge; „fesseln“ ist im geschilderten Überwältigungsvorgang natürlich und anschaulich.
- source_word: καὶ τότε
  choice: Und dann
  rationale: Erhält sowohl die Verknüpfung als auch die zeitliche Abfolge, ohne ein nicht ausdrücklich vorhandenes „erst dann“ einzufügen.
- source_word: διαρπάσει
  choice: wird … ausplündern
  rationale: Das zusammengesetzte Verb bezeichnet ein umfassenderes Plündern und wird daher stärker wiedergegeben als ἁρπάσαι.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: sein Haus
  rationale: Bewahrt das konkrete Bild, statt es deutend als Herrschaftsbereich oder Haushalt aufzulösen.
theological_decisions:
- issue: Konkrete männliche Gestalt des Vergleichs
  choice: der Starke
  alternative: der starke Mann / die starke Person
  rationale: Der griechische Text verwendet eine substantivierte maskuline Form innerhalb eines konkreten Bildes. „Der Starke“ bewahrt diese Gestalt, ohne unnötig auszuschmücken.
- issue: Deutung von Haus und Hausrat
  choice: Das konkrete Bild eines Raubes wird beibehalten.
  alternative: Haus als Herrschaftsbereich und Hausrat als geistliche Untertanen oder Besitz deutend wiedergeben
  rationale: Der Kontext legt eine geistliche Anwendung nahe, doch der Vers formuliert sie als Vergleich. Die Übersetzung sollte dessen Bildsprache bewahren und die allegorische Zuordnung nicht in den Wortlaut eintragen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die Abstufung zwischen „an sich reißen“ und „ausplündern“ spiegelt die beiden unterschiedlichen griechischen Verben wider; die konkrete Bildsprache bleibt ohne eingetragene allegorische Erklärung erhalten.
