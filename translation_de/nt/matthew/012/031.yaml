id: MAT.12.31
reference: Matthew 12:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: de
  text: 'Darum sage ich euch: Jede Sünde und Lästerung wird den Menschen vergeben werden; die Lästerung gegen den Geist[a] aber wird nicht vergeben werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Heilige Geist, wie aus dem unmittelbaren Zusammenhang hervorgeht; in diesem Vers selbst steht wörtlich nur »der Geist«.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Kennzeichnet eine Folgerung aus dem vorausgehenden Zusammenhang und klingt im modernen Deutsch natürlich.
- source_word: λέγω ὑμῖν
  choice: sage ich euch
  rationale: Bewahrt die direkte, feierliche Anrede und entspricht der üblichen deutschen Wendung.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: jede Sünde und Lästerung
  rationale: „Jede“ gibt die distributive Bedeutung von πᾶσα bei den singularischen Substantiven wieder; „Lästerung“ bezeichnet hier ehrverletzende, gegen das Göttliche gerichtete Rede.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: wird den Menschen vergeben werden
  rationale: Bewahrt das Passiv und gibt den Dativ als Empfänger der Vergebung wieder. „Menschen“ ist generisch und schließt alle Geschlechter ein.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: die Lästerung gegen den Geist aber
  rationale: Der Genitiv bezeichnet im Kontext das Ziel der Lästerung. Die Stellung von „aber“ erhält den betonten Gegensatz, ohne den Geist als Urheber der Lästerung erscheinen zu lassen.
- source_word: οὐκ ἀφεθήσεται
  choice: wird nicht vergeben werden
  rationale: Gibt das Futur Passiv klar wieder und hält die formale Parallelität zum ersten Satzteil aufrecht.
theological_decisions:
- issue: Wiedergabe von πνεύματος als „Geist“ oder „Heiliger Geist“
  choice: Geist
  alternative: Heiliger Geist
  rationale: Der griechische Vers hat nur „Geist“, während der unmittelbare Zusammenhang den Heiligen Geist als Referenten erkennen lässt. Der Haupttext bewahrt die ausdrückliche Form des Verses; die Fußnote erläutert den Bezug.
- issue: Objektive oder possessive Deutung von τοῦ πνεύματος
  choice: gegen den Geist
  alternative: Lästerung des Geistes
  rationale: 'Der Kontext fordert die objektive Deutung: Der Geist ist das Ziel der Lästerung, nicht ihr Urheber.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Satzstruktur und der Gegensatz der beiden Satzteile werden bewahrt; das generische „Menschen“ vermeidet eine unnötige geschlechtliche Verengung.
