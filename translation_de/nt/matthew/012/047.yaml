  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: de
  text: 'Da sagte jemand zu ihm[a]: »Sieh, deine Mutter und deine Brüder stehen draußen und wollen mit dir sprechen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen diesen Vers aus.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Da sagte jemand zu ihm
  rationale: δέ verbindet den Satz locker mit dem vorhergehenden Geschehen; »Da« gibt den erzählerischen Fortgang natürlich wieder. τις bleibt mit »jemand« unbestimmt.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: ἰδού dient als aufmerksamkeitslenkender Hinweis. »Sieh« bewahrt diese Funktion in knapper, würdiger Gegenwartssprache.
- source_word: ἡ μήτηρ σου
  choice: deine Mutter
  rationale: Die einfache Possessivkonstruktion wird unmittelbar und idiomatisch wiedergegeben.
- source_word: οἱ ἀδελφοί σου
  choice: deine Brüder
  rationale: ἀδελφοί bezeichnet hier die männlichen Familienangehörigen; »Brüder« bildet dies genauer ab als das geschlechtsübergreifende »Geschwister«.
- source_word: ἔξω ἑστήκασιν
  choice: stehen draußen
  rationale: Das Perfekt von ἵστημι bezeichnet hier den gegenwärtigen Zustand des Dastehens; »stehen draußen« gibt sowohl den Zustand als auch ἔξω ausdrücklich wieder.
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: möchten mit dir sprechen
  rationale: ζητέω mit dem Infinitiv drückt hier das Bestreben beziehungsweise den Wunsch aus, Jesus zu sprechen. Die idiomatische deutsche Wendung vermeidet das unnatürliche »suchen, mit dir zu sprechen«, ohne die Aussage zu verstärken.
theological_decisions:
- issue: Textkritischer Status von Matthäus 12,47
  choice: Der Vers wird gemäß dem vorgegebenen SBLGNT-Text in den Haupttext aufgenommen; seine Auslassung in einigen Handschriften wird in einer Fußnote vermerkt.
  alternative: Den Vers auslassen, da er in einigen Textzeugen fehlt.
  rationale: Die Überlieferungslage soll transparent bleiben. Die Aufnahme folgt dem bereitgestellten Ausgangstext, während die Fußnote die bedeutsame Variante dokumentiert, ohne sie stillschweigend zu entscheiden.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. »Sieh« erhält den direkten Aufmerksamkeitsruf des griechischen ἰδού; »möchten mit dir sprechen« ist idiomatischer als eine formale Nachbildung des Partizips.
