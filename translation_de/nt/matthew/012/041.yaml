id: MAT.12.41
reference: Matthew 12:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: de
  text: 'Die Männer von Ninive werden im Gericht zusammen mit dieser Generation auferstehen und sie verurteilen; denn sie kehrten auf die Verkündigung Jonas hin um.[a] Und siehe: Hier ist Größeres als Jona.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie kehrten als Reaktion auf Jonas Verkündigung um“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Hier ist einer, der größer ist als Jona.“ Im Griechischen steht eine neutrale Form, wörtlich „Größeres“; sie kann die größere Wirklichkeit hervorheben, die in Jesus und seinem Wirken gegenwärtig ist, statt nur zwei Personen miteinander zu vergleichen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: die Männer von Ninive
  rationale: Bewahrt die ausdrücklich männliche Bezeichnung ἄνδρες und gibt die Herkunftsbezeichnung in natürlichem Deutsch wieder.
- source_word: ἀναστήσονται
  choice: werden … auferstehen
  rationale: Im endzeitlichen Gerichtskontext liegt die Bedeutung des Auferstehens nahe; zugleich bleibt das Bild des Sich-Erhebens zum Gericht erhalten.
- source_word: ἐν τῇ κρίσει
  choice: im Gericht
  rationale: Bezeichnet hier das endzeitliche Gericht als Geschehen und ist im Deutschen knapp und idiomatisch.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: zusammen mit dieser Generation
  rationale: Gibt μετά mit Genitiv direkt als Begleitung wieder; der Gegensatz folgt erst durch das Verurteilen.
- source_word: κατακρινοῦσιν αὐτήν
  choice: werden … sie verurteilen
  rationale: κατακρίνω bedeutet verurteilen; das Pronomen bezieht sich grammatisch eindeutig auf die feminine ‚Generation‘.
- source_word: μετενόησαν
  choice: sie kehrten … um
  rationale: ‚Umkehren‘ gibt die kontextuelle Bedeutung von μετανοέω verständlich und als tatsächliche Reaktion auf die prophetische Botschaft wieder.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: auf die Verkündigung Jonas hin
  rationale: Die Formulierung bewahrt sowohl κήρυγμα als ‚Verkündigung‘ als auch die durch εἰς ausgedrückte Ausrichtung beziehungsweise Reaktion.
- source_word: ἰδοὺ
  choice: Und siehe
  rationale: Erhält den feierlichen, Aufmerksamkeit weckenden Diskursmarker, ohne ihn umgangssprachlich abzuschwächen.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: Hier ist Größeres als Jona
  rationale: Das substantivierte Neutrum ‚Größeres‘ entspricht dem griechischen neutralen πλεῖον und bewahrt dessen offene, über eine bloße Personenvergleichung hinausreichende Ausdrucksweise.
theological_decisions:
- issue: Wiedergabe von πλεῖον Ἰωνᾶ als Selbstbezug Jesu
  choice: Hier ist Größeres als Jona
  alternative: Hier ist einer, der größer ist als Jona
  rationale: Das griechische πλεῖον steht im Neutrum. ‚Größeres‘ bewahrt diese Form und lässt offen, ob der Akzent allein auf Jesu Person oder umfassender auf seiner Gegenwart und seinem Wirken liegt.
- issue: Geschlechtsbezogene Wiedergabe von ἄνδρες
  choice: Männer
  alternative: Leute / Menschen
  rationale: Der Ausgangstext verwendet ausdrücklich das maskuline ἄνδρες; eine geschlechtsneutrale Verallgemeinerung wäre hier nicht nötig.
- issue: Auferstehungsanklang von ἀναστήσονται
  choice: auferstehen
  alternative: sich erheben / auftreten
  rationale: Der Zusammenhang mit dem endzeitlichen Gericht stützt die Auferstehungsbedeutung, auch wenn das Verb zugleich das Bild des Sich-Erhebens zum Zeugnis oder Urteil tragen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem Klang bei „Und siehe“. Der Satzbau folgt der griechischen Argumentation, bleibt aber gut verständlich. „Generation“ wahrt den zeitgeschichtlichen und zugleich wertenden Bezug von γενεά; „Geschlecht“ wäre heute missverständlich.
