  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: de
  text: 'Und alle Menschenmengen waren zutiefst erstaunt und sagten: „Ist dieser etwa der Sohn Davids?“[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Sohn Davids“ ist ein messianischer Titel für den verheißenen königlichen Retter aus Davids Linie.
    reason: cross_reference
  - marker: b
    text: 'Die Frage lässt im Griechischen eine verneinende Erwartung anklingen; auch möglich: „Dieser ist doch nicht etwa der Sohn Davids?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: gerieten außer sich vor Staunen
  rationale: Die Form bezeichnet hier eine starke, anhaltende Reaktion des Staunens. Die Wendung bewahrt die Intensität, ohne einen Verlust der Selbstbeherrschung zu behaupten.
- source_word: πάντες οἱ ὄχλοι
  choice: alle Menschenmengen
  rationale: Der Plural von ὄχλοι wird ausdrücklich erhalten; „Menschenmengen“ ist im modernen Deutsch verständlich und gibt die Mehrzahl genauer wieder als „das ganze Volk“.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt kann fortdauerndes oder wiederholtes Reden anzeigen. Im deutschen Erzählstil ist „sagten“ natürlich; die gemeinschaftliche Äußerung ergibt sich aus dem pluralischen Subjekt.
- source_word: Μήτι
  choice: Ist dieser etwa
  rationale: Μήτι lässt eine verneinende Erwartung oder zögernde Skepsis anklingen. Das deutsche „etwa“ bewahrt diese Zurückhaltung, ohne die staunende Frage in eine entschiedene Verneinung umzudeuten.
- source_word: ὁ υἱὸς Δαυίδ
  choice: der Sohn Davids
  rationale: Die wörtliche und im Matthäusevangelium theologisch bedeutsame Titelform bleibt erhalten.
theological_decisions:
- issue: Messianische Bedeutung von „der Sohn Davids“
  choice: Der Titel „der Sohn Davids“ bleibt im Haupttext unverändert stehen.
  alternative: der Messias; der verheißene Nachkomme Davids
  rationale: Der griechische Text verwendet den Titel selbst. Eine erklärende Paraphrase würde die historische Ausdrucksweise ersetzen und die Identitätsfrage stärker auslegen, als es der Wortlaut tut.
- issue: Erwartungsrichtung der mit Μήτι eingeleiteten Frage
  choice: Die Frage wird mit „etwa“ als zögernd und skeptisch formuliert.
  alternative: „Kann dieser der Sohn Davids sein?“; „Dieser ist doch nicht etwa der Sohn Davids?“
  rationale: Die Übersetzung soll sowohl das Staunen als auch die gewöhnlich negative Erwartung von Μήτι erkennen lassen, ohne daraus eine kategorische Ablehnung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gerieten … außer sich vor Staunen“ gibt die starke Reaktion anschaulich wieder; „Ist dieser etwa …?“ klingt natürlich und erhält die im Griechischen angelegte zögernde, eher verneinende Erwartung.
