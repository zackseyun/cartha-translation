id: MAT.12.14
reference: Matthew 12:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: de
  text: Doch die Pharisäer gingen hinaus und beratschlagten, wie sie ihn vernichten könnten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »töten« oder »umbringen«. Das griechische Verb kann hier eine Tötungsabsicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: gingen hinaus
  rationale: Das vorzeitige Aoristpartizip bezeichnet hier die der Beratung vorausgehende Handlung; die finite Formulierung ist im Deutschen natürlich und bewahrt den erzählerischen Ablauf.
- source_word: δὲ
  choice: Doch
  rationale: Markiert den Kontrast zwischen Jesu Handeln im vorherigen Zusammenhang und der feindseligen Reaktion der Pharisäer.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Im Deutschen übliche Bezeichnung der jüdischen Gruppierung.
- source_word: συμβούλιον ἔλαβον
  choice: berieten miteinander
  rationale: Gibt die Wendung, wörtlich etwa »Rat fassten/nahmen«, in natürlichem Deutsch wieder, ohne schon durch »verschworen sich« eine stärkere Konnotation einzutragen.
- source_word: κατ’ αὐτοῦ
  choice: gegen ihn
  rationale: κατά mit Genitiv hat in diesem feindseligen Zusammenhang adversative Bedeutung.
- source_word: ὅπως
  choice: wie sie … könnten
  rationale: Gibt den Inhalt beziehungsweise das Ziel ihrer Beratung mit der im Deutschen idiomatischen deliberativen Konstruktion wieder.
- source_word: ἀπολέσωσιν
  choice: vernichten
  rationale: Bewahrt die grundsätzlich weitere Bedeutung von ἀπόλλυμι; im Kontext schließt sie die erkennbare Tötungsabsicht ein, ohne den Wortlaut unnötig zu verengen.
theological_decisions:
- issue: Grad der Bedeutungsverengung bei ἀπολέσωσιν
  choice: vernichten
  alternative: töten / umbringen
  rationale: Der Zusammenhang legt tödliche Absicht nahe, doch das griechische Verb ist weiter als ein ausdrückliches Verb für »töten«. Die Hauptübersetzung wahrt diese Breite; die Fußnote nennt die kontextuell möglichen konkreteren Wiedergaben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Berieten miteinander gegen ihn« hält sich eng an die griechische Wendung und bleibt verständlich; »vernichten« bewahrt die lexikalische Breite des Ausgangstextes.
