revisions:
- from: Doch die Pharisäer gingen hinaus und berieten miteinander gegen ihn, wie sie ihn vernichten könnten.[a]
  to: Doch die Pharisäer gingen hinaus und beratschlagten, wie sie ihn vernichten könnten.[a]
  rationale: Die Revision ersetzt die unnatürliche Verbindung »berieten miteinander gegen ihn« durch die idiomatische deliberative Konstruktion »beratschlagten, wie …«. Der gegen Jesus gerichtete Charakter der Beratung bleibt durch den Inhalt der Frage ausdrücklich erhalten. Die Fußnote wird lexikalisch präziser formuliert, ohne die bewusst weitere Hauptwiedergabe »vernichten« zu verengen.
  reviewer_model: gpt-5.6-terra
