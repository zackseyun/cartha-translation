review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den erzählerischen Gegensatz (δέ), das Hinausgehen, die feindliche Beratung und die auf Vernichtung zielende Absicht insgesamt zutreffend wieder. »Berieten miteinander gegen ihn« ist jedoch keine natürliche deutsche Verbindung; die Beratung richtet sich inhaltlich darauf, wie sie gegen Jesus vorgehen bzw. ihn vernichten könnten.
  naturalness: »Doch die Pharisäer gingen hinaus und beratschlagten, wie sie ihn vernichten könnten« ist modernes, verständliches Standarddeutsch und bildet die deliberative Inhaltsfrage natürlich ab. Es vermeidet die schwerfällige und idiomatisch fragliche Formulierung »berieten miteinander gegen ihn«.
  terminology: »Pharisäer« ist die übliche deutsche Gruppenbezeichnung. »Vernichten« wahrt die gegenüber »töten« weitere Formulierung von ἀπολέσωσιν, während die Fußnote die im Kontext naheliegende tödliche Bedeutung als Alternative nennt. Die Aussage, das griechische Wort bedeute „wörtlich“ vernichten, sollte vermieden werden, da dies eine unzutreffende lexikalische Eindeutigkeit nahelegt.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe von συμβούλιον ἔλαβον κατ’ αὐτοῦ
    rationale: »Miteinander gegen ihn beraten« klingt im Deutschen syntaktisch und stilistisch holprig. »Beratschlagten, wie sie ihn vernichten könnten« gibt die feindselige Beratung samt ihrem gegen Jesus gerichteten Inhalt natürlich wieder.
  - severity: low
    issue: Lexikalisch zu starke Fußnotenformulierung
    rationale: Das griechische Verb bedeutet nicht einfach „wörtlich vernichten“; seine Bedeutung ist kontextabhängig und kann hier insbesondere töten/umbringen meinen.
  revised_text: Doch die Pharisäer gingen hinaus und beratschlagten, wie sie ihn vernichten könnten.[a]
