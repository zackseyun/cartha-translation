  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: de
  text: Wer nicht mit mir ist, ist gegen mich, und wer nicht mit mir sammelt, zerstreut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: wer nicht … ist
  rationale: Der substantivierte Artikel mit Partizip bezeichnet allgemein eine Person, die dadurch gekennzeichnet ist, dass sie nicht mit Jesus ist. Die deutsche Konstruktion „wer nicht … ist“ gibt diesen generischen Sinn natürlich und prägnant wieder.
- source_word: μετ’ ἐμοῦ
  choice: mit mir
  rationale: μετά mit Genitiv bezeichnet hier Zugehörigkeit oder Gemeinschaft. „Mit mir“ ist die direkte deutsche Entsprechung und bewahrt die im Ausspruch enthaltene Frage der Ausrichtung auf Jesus.
- source_word: κατ’ ἐμοῦ
  choice: gegen mich
  rationale: κατά mit Genitiv drückt hier Gegnerschaft aus. „Gegen mich“ bildet mit „mit mir“ den scharfen Gegensatz des griechischen Textes ab.
- source_word: συνάγων
  choice: sammelt
  rationale: Das Partizip bezeichnet ein Zusammenbringen oder Sammeln. „Sammelt“ bleibt bildhaft, ohne das mögliche Hirten- oder Erntebild näher festzulegen.
- source_word: σκορπίζει
  choice: zerstreut
  rationale: σκορπίζω bedeutet auseinanderstreuen oder zerstreuen. „Zerstreut“ steht als treffendes Gegenstück zu „sammelt“ und bewahrt den Parallelismus.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet zwei parallele Aussagen additiv. „Und“ folgt dieser Struktur ohne einen nicht ausdrücklich markierten Gegensatz einzuführen.
theological_decisions:
- issue: Absoluter Gegensatz zwischen Zugehörigkeit zu Jesus und Gegnerschaft gegen ihn
  choice: 'Der Vers bleibt als uneingeschränkte Aussage formuliert: Wer nicht mit Jesus ist, ist gegen ihn.'
  alternative: Eine abschwächende Umschreibung, die neutrale Distanz oder eine Zwischenposition zulässt.
  rationale: Der griechische Text stellt den Gegensatz in zwei knappen parallelen Sätzen ohne Einschränkung dar. Die Übersetzung bewahrt diese Spannung, ohne daraus weitergehende konfessionelle Folgerungen abzuleiten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die wiederholte Formulierung „wer nicht mit mir“ und der Gegensatz „sammelt – zerstreut“ erhalten Rhythmus und Parallelismus des griechischen Ausspruchs.
