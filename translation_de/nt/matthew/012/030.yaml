review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die beiden substantivierten Partizipialkonstruktionen idiomatisch und generisch mit „Wer …“ wieder. „Mit mir / gegen mich“ entspricht μετά bzw. κατά mit Genitiv. „sammelt“ und „zerstreut“ bewahren die antithetische Bildsprache und den Parallelismus von συνάγων und σκορπίζει. Die additive Verknüpfung durch καὶ ist korrekt als „und“ wiedergegeben.
  naturalness: „Wer nicht mit mir ist, ist gegen mich, und wer nicht mit mir sammelt, zerstreut“ ist klares, modernes Standarddeutsch. Die Ellipse im zweiten Satzteil ist im Deutschen selbstverständlich und unterstützt die knappe, sentenzhafte Form des Verses.
  terminology: Die Wortwahl ist sachgerecht und theologisch nicht überdeutet. „Sammelt“ lässt die konkrete bildliche Referenz bewusst offen; „zerstreut“ ist das natürliche und präzise Gegenstück. Es sind keine Namen oder besonderen terminologischen Konventionen betroffen.
