id: MAT.12.12
reference: Matthew 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: de
  text: Wie viel mehr ist nun ein Mensch wert als ein Schaf! Deshalb ist es erlaubt, am Sabbat[a] Gutes zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den Sabbaten“. Der griechische Plural ist eine geläufige Ausdrucksweise für das Handeln am Sabbat.'
    reason: Transparenz zur idiomatischen Pluralform des griechischen Textes
lexical_decisions:
- source_word: πόσῳ
  choice: Wie viel mehr
  rationale: Mit dem Vergleich drückt der Dativ das stärkere Gewicht im Schluss vom Geringeren auf das Größere aus.
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Beispiel und fügt sich natürlich in die rhetorische Frage ein.
- source_word: διαφέρει
  choice: ist … wert
  rationale: Das Verb bezeichnet hier nicht bloß einen Unterschied, sondern den höheren Wert eines Menschen gegenüber einem Schaf.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: Das griechische Singularwort ist hier allgemein und repräsentativ gebraucht; „ein Mensch“ gibt dies im Deutschen natürlich und genau wieder.
- source_word: προβάτου
  choice: als ein Schaf
  rationale: Der Genitiv bezeichnet nach διαφέρει den Vergleichsgegenstand.
- source_word: ὥστε
  choice: Deshalb
  rationale: Leitet die aus dem Vergleich gezogene Schlussfolgerung ein.
- source_word: ἔξεστιν
  choice: es ist erlaubt
  rationale: Gibt im Zusammenhang der Auseinandersetzung um das Sabbatgebot die rechtlich-ethische Zulässigkeit wieder.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Der griechische Plural ist eine geläufige Wendung für das Handeln am Sabbat; der idiomatische deutsche Singular vermittelt diesen Sinn klar.
- source_word: καλῶς ποιεῖν
  choice: Gutes zu tun
  rationale: Entspricht der geläufigen Bedeutung der Wendung als wohltätiges oder rechtes Handeln.
theological_decisions:
- issue: Allgemeiner Sinn von ἄνθρωπος
  choice: ein Mensch
  alternative: ein Mann
  rationale: ἄνθρωπος bezeichnet hier im Gegensatz zum Schaf einen Menschen allgemein, nicht ausdrücklich eine männliche Person. Das deutsche „Mensch“ bewahrt diesen repräsentativen Sinn.
- issue: Pluralform bei τοῖς σάββασιν
  choice: am Sabbat
  alternative: an den Sabbaten
  rationale: Der griechische Plural kann idiomatisch die Sabbatzeit beziehungsweise die Sabbatobservanz bezeichnen. Der deutsche Singular ist natürlich, während eine Fußnote die Form des Ausgangstextes transparent macht.
- issue: Reichweite von καλῶς ποιεῖν
  choice: Gutes zu tun
  alternative: richtig zu handeln
  rationale: „Gutes zu tun“ bewahrt sowohl den ethischen als auch den konkret wohltätigen Sinn, ohne die Aussage auf eine einzelne Art von Handlung zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Ausrufeform gibt die rhetorische Kraft des Vergleichs wieder; „Deshalb“ macht die anschließende Folgerung klar.
