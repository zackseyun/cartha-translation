id: MAT.12.8
reference: Matthew 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: de
  text: Denn der Menschensohn ist Herr über den Sabbat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Menschensohn“ ist in den Evangelien eine charakteristische Selbstbezeichnung Jesu. Wörtlich kann der griechische Ausdruck auch „Sohn des Menschen“ bedeuten; eine allgemeinere Wiedergabe wie „der Mensch“ würde jedoch seine wahrscheinliche Bedeutung als Titel abschwächen.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Denn
  rationale: Bewahrt die begründende beziehungsweise erläuternde Verbindung zum vorausgehenden Argument und entspricht natürlichem, gehobenem Standarddeutsch.
- source_word: κύριος
  choice: Herr
  rationale: Erhält sowohl den Autoritätsanspruch als auch das christologische Gewicht des Ausdrucks, ohne ihn über den Wortlaut hinaus zu erläutern.
- source_word: τοῦ σαββάτου
  choice: über den Sabbat
  rationale: Der von κύριος abhängige Genitiv bezeichnet hier den Bereich, über den Autorität besteht. Im Deutschen ist „Herr über den Sabbat“ natürlicher und eindeutiger als „Herr des Sabbats“.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Bewahrt Jesu charakteristische Selbstbezeichnung und ihre mögliche intertextuelle beziehungsweise titularische Resonanz; eine generische Wiedergabe würde diese abschwächen.
- source_word: ἐστιν
  choice: ist
  rationale: Gibt die einfache präsentische Kopula ohne unnötige Erweiterung wieder.
theological_decisions:
- issue: Christologische Aussage von κύριος ... τοῦ σαββάτου
  choice: „der Menschensohn ist Herr über den Sabbat“
  alternative: „der Menschensohn verfügt über den Sabbat“
  rationale: „Herr“ bewahrt den starken Autoritätsanspruch und das theologische Gewicht des griechischen κύριος. Die Formulierung sagt nicht näher aus, wie diese Herrschaft auszuüben ist, und erhält damit die Spannung des Textes.
- issue: Bedeutung von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Als feste Selbstbezeichnung „der Menschensohn“ wiedergeben
  alternative: „der Mensch“ beziehungsweise „der menschliche Eine“
  rationale: Im matthäischen Zusammenhang fungiert der Ausdruck als charakteristische Selbstbezeichnung Jesu und kann titularische sowie apokalyptische Resonanzen tragen. Die traditionelle deutsche Wiedergabe erhält diese Mehrschichtigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Herr über den Sabbat“ ist im heutigen Deutsch idiomatischer als die formal nähere Genitivkonstruktion „Herr des Sabbats“. Der Satzbau folgt der deutschen Informationsstruktur, ohne die Aussage des griechischen Textes zu erweitern.
