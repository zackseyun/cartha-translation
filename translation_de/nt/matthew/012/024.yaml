id: MAT.12.24
reference: Matthew 12:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: de
  text: 'Als die Pharisäer das hörten, sagten sie jedoch: »Dieser da treibt die Dämonen nur durch Beelzebul[a], den Herrscher der Dämonen, aus.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelzebul: traditionell »Beelzebub«.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: jedoch
  rationale: Kennzeichnet den Gegensatz zur positiven Reaktion der Menschen im vorigen Vers und klingt im modernen Deutschen natürlich.
- source_word: ἀκούσαντες
  choice: als die Pharisäer das hörten
  rationale: Das Aoristpartizip wird als zeitlicher Nebensatz wiedergegeben; »das« nimmt den aus dem Kontext erschließbaren Inhalt des Gehörten auf.
- source_word: Οὗτος
  choice: Dieser da
  rationale: Bewahrt den im Zusammenhang abwertenden, distanzierenden Ton des Demonstrativpronomens, ohne eine weitergehende Deutung hinzuzufügen.
- source_word: ἐκβάλλει
  choice: treibt … aus
  rationale: Ist die klare und im Zusammenhang von Dämonenaustreibungen geläufige deutsche Entsprechung.
- source_word: δαιμόνια
  choice: Dämonen
  rationale: Direkte und allgemein verständliche Wiedergabe des griechischen Ausdrucks.
- source_word: εἰ μὴ
  choice: nur
  rationale: Die Verbindung bezeichnet hier das angeblich einzige Mittel der Austreibung; die deutsche Konstruktion »nur durch« gibt dies knapp und idiomatisch wieder.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: durch Beelzebul
  rationale: ἐν bezeichnet hier Mittel beziehungsweise Wirkmacht. »Durch« macht die Anschuldigung verständlich, ohne ausdrücklich »durch die Macht« zu ergänzen.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Folgt der Namensform des griechischen Ausgangstextes; die traditionelle Form wird in einer Fußnote genannt.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: den Herrscher der Dämonen
  rationale: ἄρχων bezeichnet jemanden mit Herrschaftsgewalt. »Herrscher« ist präzise, verständlich und bewahrt die Apposition zu Beelzebul.
theological_decisions:
- issue: Abwertende Wirkung von Οὗτος
  choice: Dieser da
  alternative: Dieser; Er
  rationale: Die distanzierende Feindseligkeit der Aussage wird hörbar, ohne sie durch zusätzliche Beschimpfungen zu verstärken.
- issue: Namensform Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Der Haupttext folgt der im SBLGNT belegten griechischen Form. Die vertraute traditionelle Form bleibt als Fußnote zugänglich.
- issue: Art der behaupteten dämonischen Mitwirkung
  choice: durch Beelzebul
  alternative: in Beelzebul; durch die Macht Beelzebuls
  rationale: Die instrumentale Bedeutung von ἐν wird bewahrt, ohne näher festzulegen, wie die behauptete Wirkmacht theologisch zu verstehen sei.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und anklagend. »Dieser da« vermittelt die feindselige Distanzierung; »Herrscher« ist gegenüber dem heute missverständlichen »Fürsten« unmittelbarer verständlich.
