  terminology: »Pharisäer«, »Dämonen«, »Beelzebul« und »Herrscher der Dämonen« sind konsequent, verständlich und quellennah. Die Fußnote nennt angemessen die traditionelle Namensform »Beelzebub«, ohne die im griechischen Text stehende Form zu verdrängen.
