  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: de
  text: wie er in das Haus Gottes hineinging und sie die Schaubrote[b] aßen[a], die weder er noch seine Begleiter essen durften, sondern nur die Priester?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften beziehungsweise Lesarten haben „er aß“ statt „sie aßen“.
    reason: textual_variant
  - marker: b
    text: Auch „Brote der Darbringung“; gemeint sind die geweihten Brote, die vor Gott niedergelegt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: wie
  rationale: Leitet den Inhalt des zuvor genannten Schriftberichts idiomatisch und quellennah ein.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: er in das Haus Gottes ging
  rationale: Natürliches modernes Deutsch; „Haus Gottes“ bewahrt die Bezeichnung des griechischen Textes, ohne sie ausdrücklich als Stiftshütte auszudeuten.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: die Brote der Gegenwart
  rationale: Bewahrt sowohl den Plural „Brote“ als auch den kultischen Gedanken der vor Gott niedergelegten Brote. Die geläufige Alternative „Schaubrote“ wird in einer Fußnote genannt.
- source_word: ἔφαγον
  choice: sie … aßen
  rationale: Folgt der im vorgelegten SBLGNT-Text gedruckten Pluralform; die abweichende Singularlesart wird kenntlich gemacht.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: obwohl weder er noch seine Begleiter davon essen durften
  rationale: Gibt die gesetzlich-kultische Unzulässigkeit in natürlichem Deutsch wieder und bezieht sowohl David als auch seine Begleiter ausdrücklich ein.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: sondern allein die Priester
  rationale: Die ausschließende Ausnahme wird knapp und deutlich wiedergegeben.
theological_decisions:
- issue: Gesetzlich-kultische Aussage von ἐξὸν
  choice: davon essen durften
  alternative: es war ihnen nicht erlaubt / es war für sie nicht gesetzlich zulässig
  rationale: „Durften“ ist im Deutschen natürlich und bezeichnet hier im Zusammenhang eindeutig die durch die heilige Ordnung gesetzte Grenze, ohne eine bloß gesellschaftliche Erlaubnis zu unterstellen.
- issue: Subjekt von ἔφαγον
  choice: 'Plural: „sie … aßen“'
  alternative: 'Singular: „er aß“'
  rationale: Der Haupttext folgt der vorgelegten SBLGNT-Lesart ἔφαγον. Die sachlich bedeutsame Singularvariante bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als abhängige Frage formuliert. Die etwas ungewohnte Wendung „Brote der Gegenwart“ erhält den kultischen Ausdruck; die traditionell geläufigere Bezeichnung steht in der Fußnote.
