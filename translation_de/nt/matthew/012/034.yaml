id: MAT.12.34
reference: Matthew 12:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: de
  text: Ihr Schlangenbrut! Wie könnt ihr Gutes reden, wenn ihr böse seid? Denn wovon das Herz überfließt, davon redet der Mund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: Denn aus der Fülle des Herzens redet der Mund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Schlangenbrut
  rationale: Die feste deutsche Wendung bewahrt das scharfe Bild einer von Giftschlangen hervorgebrachten Brut und damit die Aussage über Herkunft beziehungsweise Wesensart.
- source_word: πῶς δύνασθε
  choice: Wie könnt ihr
  rationale: Die idiomatische deutsche Frage gibt die rhetorisch behauptete Unfähigkeit unmittelbar wieder.
- source_word: ἀγαθὰ λαλεῖν
  choice: Gutes reden
  rationale: Das substantivierte Neutrum Plural bezeichnet gute Dinge beziehungsweise gute Worte; „Gutes reden“ bleibt knapp und nahe am Griechischen.
- source_word: πονηροὶ ὄντες
  choice: wenn ihr böse seid
  rationale: Die Formulierung gibt den begleitenden beziehungsweise bedingenden Umstand natürlich wieder und bewahrt das klare moralische Urteil von πονηροί.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Denn wovon das Herz überfließt
  rationale: Die idiomatische Bildsprache vermittelt, dass der Mund aus der inneren Fülle oder dem Überschuss des Herzens heraus redet.
- source_word: τὸ στόμα λαλεῖ
  choice: davon redet der Mund
  rationale: Die Ergänzung „davon“ macht im Deutschen den Bezug auf den Inhalt der Herzensfülle deutlich, ohne die Aussage inhaltlich einzuengen.
theological_decisions:
- issue: Bildgehalt von καρδία
  choice: Herz
  alternative: Inneres; Sinn
  rationale: „Herz“ wahrt den biblischen Begriff für das innere Zentrum des Menschen, einschließlich Denken, Wollen und Empfinden, ohne ihn auf Gefühl oder Verstand zu verengen.
- issue: Moralische Kennzeichnung durch πονηροί
  choice: böse
  alternative: schlecht; verdorben
  rationale: „Böse“ bewahrt das ethische Gewicht der Zurechtweisung und schwächt sie nicht zu einer bloßen Qualitätsangabe ab.
- issue: Verhältnis von innerer Fülle und Rede
  choice: Bild des Überfließens bewahren
  alternative: Aus der Fülle des Herzens redet der Mund
  rationale: Die Übersetzung lässt offen, ob περίσσευμα stärker als Fülle, Übermaß oder Überfluss verstanden wird, und erhält zugleich das Ursachenbild des griechischen Satzes.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der Ausruf erhält die Schärfe der direkten Anrede; der zweite Satz verwendet eine geläufige deutsche Bildformulierung und dokumentiert die formal nähere Wiedergabe in der Fußnote.
