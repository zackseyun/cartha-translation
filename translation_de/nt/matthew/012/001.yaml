reference: Matthew 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: de
  text: Zu jener Zeit ging Jesus am Sabbat[a] durch die Kornfelder. Seine Jünger wurden hungrig und begannen, Ähren abzupflücken und zu essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht der Plural „an den Sabbaten“, eine idiomatische Bezeichnung für „am Sabbat“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Zu jener Zeit
  rationale: Die Wendung bezeichnet einen erzählerischen Zeitpunkt oder Anlass. „Zu jener Zeit“ ist natürlich, würdevoll und bewahrt den zeitlichen Übergang.
- source_word: ἐπορεύθη
  choice: ging
  rationale: πορεύομαι bedeutet hier schlicht „gehen“; eine stärkere Wiedergabe wie „reiste“ wäre im Zusammenhang unnötig.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Der griechische Plural ist in diesem Zusammenhang eine geläufige idiomatische Bezeichnung für den Sabbattag. Der deutsche Singular gibt den Sinn natürlich wieder.
- source_word: διὰ τῶν σπορίμων
  choice: durch die Kornfelder
  rationale: σπόριμα bezeichnet besäte beziehungsweise mit Getreide bestandene Felder. „Kornfelder“ ist präzise und allgemein verständlich.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Seine Jünger
  rationale: δέ führt hier den nächsten Erzählzug ein und ist nicht deutlich adversativ. Ein neuer deutscher Satz gibt den Zusammenhang flüssig wieder, ohne einen künstlichen Gegensatz zu schaffen.
- source_word: ἐπείνασαν
  choice: wurden hungrig
  rationale: Die Form kann ingressiv verstanden werden und bezeichnet dann das Einsetzen des Hungers; „wurden hungrig“ bewahrt diese Nuance.
- source_word: ἤρξαντο
  choice: begannen
  rationale: ἄρχομαι mit Infinitiv bezeichnet den Beginn einer Handlung; „begannen“ ist die direkte und natürliche Entsprechung.
- source_word: τίλλειν
  choice: abzupflücken
  rationale: τίλλω bezeichnet das Abpflücken oder Abreißen mit der Hand. „abzupflücken“ passt im Deutschen idiomatisch zu Ähren.
- source_word: στάχυας
  choice: Ähren
  rationale: στάχυς bezeichnet eine Getreideähre. „Ähren“ ist im Deutschen knapp, genau und allgemein verständlich.
- source_word: καὶ ἐσθίειν
  choice: und zu essen
  rationale: Der koordinierte Infinitiv wird im Deutschen zur klaren und natürlichen Satzführung mit „zu“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des grammatischen Plurals σάββασιν
  choice: am Sabbat
  alternative: an den Sabbaten
  rationale: Der Plural fungiert hier idiomatisch als Bezeichnung des Sabbattages. Der Singular vermeidet den irreführenden Eindruck, Jesus sei an mehreren Sabbaten durch die Felder gegangen; die Form des Griechischen wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Aufteilung in zwei Sätze entspricht natürlichem deutschem Stil, ohne den Gedankengang des griechischen Satzes zu verändern.
