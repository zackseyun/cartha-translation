id: MAT.12.45
reference: Matthew 12:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: de
  text: Dann geht er hin und nimmt sieben andere Geister mit sich, die böser sind als er selbst[a]. Sie gehen hinein und wohnen dort. Und der letzte Zustand jenes Menschen wird schlimmer als der erste[b]. Ebenso wird es auch dieser bösen Generation ergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „sieben andere Geister, böser als er selbst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Die letzten Dinge jenes Menschen werden schlimmer als die ersten“; gemeint ist, dass sein späterer Zustand schlimmer wird als sein früherer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: Dann geht er hin
  rationale: Das historische Präsens setzt die Schilderung lebendig fort. Das maskuline Pronomen ist im Deutschen wegen des grammatischen Geschlechts von „Geist“ natürlich.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: nimmt … mit sich
  rationale: „Mit sich nehmen“ gibt die Bedeutung des Mitnehmens idiomatisch und präzise wieder.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: sieben andere Geister
  rationale: ἕτερα bezeichnet hier weitere Geister neben dem ersten; eine Verschiedenheit der Art muss nicht eigens betont werden.
- source_word: πονηρότερα ἑαυτοῦ
  choice: die böser sind als er selbst
  rationale: Die attributive Ergänzung bildet den griechischen Komparativ klar und in natürlichem Deutsch ab.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Sie gehen hinein und wohnen dort
  rationale: Das Partizip wird als koordinierter Satz wiedergegeben. Trotz des auffälligen Numeruswechsels im griechischen Text legt der Zusammenhang die Geister als handelnde Gruppe nahe.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: der letzte Zustand jenes Menschen
  rationale: Die wörtlichen „letzten Dinge“ sind eine idiomatische Bezeichnung für den späteren beziehungsweise abschließenden Zustand.
- source_word: χείρονα τῶν πρώτων
  choice: schlimmer als der erste
  rationale: Die knappe Gegenüberstellung von letztem und erstem Zustand bleibt erhalten.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Ebenso wird es auch dieser bösen Generation ergehen
  rationale: „Ergehen“ macht die Anwendung der vorangehenden Zustandsbeschreibung auf die Generation in natürlichem Deutsch verständlich, ohne ihre Aussage näher auszudeuten.
theological_decisions:
- issue: Bezeichnung der übernatürlichen Wesen
  choice: Geister
  alternative: Dämonen
  rationale: πνεύματα bedeutet ausdrücklich „Geister“; der Kontext kennzeichnet sie bereits als böse beziehungsweise unrein. „Dämonen“ wäre eine interpretierende Präzisierung.
- issue: Wiedergabe von ἄνθρωπος
  choice: jenes Menschen
  alternative: jener Person
  rationale: „Mensch“ entspricht dem allgemeinen griechischen Ausdruck, bewahrt den Einzelbezug und vermeidet eine unnötige geschlechtliche Festlegung, die das Substantiv hier semantisch nicht verlangt.
- issue: Numerus bei κατοικεῖ
  choice: 'Pluralisch: „Sie … wohnen dort“'
  alternative: 'Singularisch: „er wohnt dort“'
  rationale: Obwohl κατοικεῖ in der überlieferten Form Singular ist, beziehen sich das vorausgehende neutrale Pluralpartizip und der erzählerische Sinn auf die sieben Geister als Gruppe. Die deutsche Fassung folgt diesem sachlichen Bezug; die Textform wird in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Kurze Hauptsätze bewahren den erzählerischen Nachdruck. Die Fußnoten markieren die idiomatische Verdichtung und eine formal nähere Alternative.
