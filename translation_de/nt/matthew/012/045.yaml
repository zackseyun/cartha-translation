  revision_rationale: Keine sichere inhaltliche Korrektur erforderlich. Die vorgelegte Fassung bewahrt die griechische Aussage, die erzählerische Struktur und die Anwendung auf die Generation. Die Fußnoten sind strukturell korrekt verankert und die Zustandsidiomatik wird in Fußnote b sinnvoll erläutert.
