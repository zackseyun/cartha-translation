  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: de
  text: 'Er aber antwortete dem, der zu ihm sprach: „Wer ist meine Mutter, und wer sind meine Brüder?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Er aber antwortete
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine geläufige, semitisch beeinflusste Redeformel. Im natürlichen Deutschen gibt „antwortete“ den Sinn ohne die schwerfällige Doppelung „antwortete und sagte“ wieder; „aber“ bildet δέ als markierten Fortgang beziehungsweise Gegenakzent im Gespräch ab.
- source_word: τῷ λέγοντι αὐτῷ
  choice: dem, der zu ihm sprach
  rationale: Das substantivierte Präsenspartizip im Dativ bezeichnet den Gesprächspartner, der Jesus anspricht. Die Formulierung bleibt nah an der verbalen Handlung und ist zugleich idiomatisches Deutsch.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Wer ist meine Mutter
  rationale: Das Interrogativpronomen fragt nach der Identität; die direkte Wiedergabe bewahrt die rhetorische Zuspitzung.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: und wer sind meine Brüder
  rationale: Das pluralische τίνες wird im Deutschen idiomatisch ebenfalls mit „wer“ wiedergegeben. ἀδελφοί ist hier maskulin und bezieht sich im unmittelbaren Erzählzusammenhang auf Jesu Brüder, daher wird es nicht zu „Geschwister“ erweitert.
theological_decisions:
- issue: Mögliche interpretierende Abschwächung der rhetorischen Frage nach familiärer Zugehörigkeit
  choice: Die beiden unmittelbaren Identitätsfragen bleiben ohne erklärenden Zusatz stehen.
  alternative: „Wer gilt als meine Mutter, und wer gilt als meine Brüder?“
  rationale: Der folgende Kontext entfaltet Jesu Verständnis von Verwandtschaft. Vers 48 selbst soll diese Deutung nicht vorwegnehmen, sondern die erzählerische und theologische Spannung bewahren.
- issue: Geschlechtsspezifische Wiedergabe von ἀδελφοί
  choice: Brüder
  alternative: Geschwister
  rationale: Der unmittelbare Bezug gilt den in der Szene erwähnten leiblichen Familienangehörigen, und die griechische Bezeichnung ist maskulin. Eine Erweiterung zu einer gemischtgeschlechtlichen Gruppe wäre hier interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Redeformel wird idiomatisch gestrafft, während Satzbau, rhetorische Fragen und familiäre Begriffe eng am Ausgangstext bleiben.
