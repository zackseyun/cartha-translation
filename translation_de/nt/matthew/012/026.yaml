id: MAT.12.26
reference: Matthew 12:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: de
  text: Und wenn Satan Satan austreibt[a], ist er gegen sich selbst entzweit[b]. Wie wird dann sein Reich bestehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vertreibt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurde er gegen sich selbst entzweit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: Und wenn
  rationale: Bewahrt sowohl den Anschluss durch καί als auch die Bedingung durch εἰ und führt den Gedankengang aus dem vorherigen Vers fort.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Satan
  rationale: Die übliche deutsche Wiedergabe des Namens beziehungsweise Titels; die Wiederholung des griechischen Textes bleibt erhalten.
- source_word: ἐκβάλλει
  choice: austreibt
  rationale: Gibt im Zusammenhang mit Dämonenaustreibung die Bedeutung von ἐκβάλλω natürlich und präzise wieder.
- source_word: ἐφ’ ἑαυτὸν
  choice: gegen sich selbst
  rationale: Bewahrt den Gedanken innerer Gegnerschaft, den ἐπί mit dem Reflexivpronomen hier ausdrückt.
- source_word: ἐμερίσθη
  choice: ist … entzweit
  rationale: Das Aoristpassiv bezeichnet im hypothetischen Gedankengang den eingetretenen Zustand der inneren Teilung; die Formulierung klingt im Deutschen natürlich und lässt den passivischen Ergebnischarakter erkennen.
- source_word: πῶς οὖν
  choice: Wie … dann
  rationale: Gibt sowohl die Frage πῶς als auch die folgernde Kraft von οὖν idiomatisch wieder.
- source_word: σταθήσεται
  choice: wird … bestehen
  rationale: Bewahrt das Futur und die Metapher des Standhaltens beziehungsweise Fortbestehens.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: sein Reich
  rationale: „Reich“ passt hier zum Bild einer geteilten Herrschaft und ist die geläufige Wiedergabe von βασιλεία, ohne die mögliche Bedeutung „Herrschaft“ auszuschließen.
theological_decisions:
- issue: Sinn und Bezug der Selbstentzweiung Satans
  choice: 'Der Vers bleibt als Schluss aus einer angenommenen Selbstbekämpfung Satans formuliert: Treibt Satan Satan aus, ist sein eigenes Reich innerlich entzweit und kann nicht bestehen.'
  alternative: Eine freiere Wiedergabe könnte ausdrücklich das Bild eines „in sich gespaltenen Reiches“ aus dem vorherigen Vers aufnehmen.
  rationale: Der griechische Text formuliert hier die innere Gegnerschaft und die daraus folgende Unbeständigkeit, ohne das Bild aus dem Kontext nochmals ausdrücklich zu wiederholen. Die Übersetzung erweitert den Wortlaut daher nicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Austreiben“, „entzweit“ und „Reich“ bewahren die Bildsprache und den argumentativen Ernst, ohne altertümlich zu wirken.
