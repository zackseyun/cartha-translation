review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur ist zutreffend: ἵνα wird mit „damit“, διά mit „durch“ und die prophetische Bezeichnung mit „den Propheten Jesaja“ wiedergegeben. Allerdings ist λέγοντος nicht angemessen durch einen bloßen Doppelpunkt ersetzt. Das Partizip bezieht sich auf „Jesaja, den Propheten“ und bezeichnet ihn als denjenigen, der das folgende Zitat ausspricht. Zudem gibt „erfüllt wurde“ den durch ἵνα regierten Konjunktiv weniger genau wieder als „erfüllt würde“.'
  naturalness: Die revidierte Fassung bleibt in modernem, würdigem Standarddeutsch flüssig. „Jesaja, der sagte“ ist etwas formelhafter, aber in einem Schriftzitat natürlich und bewahrt den ausdrücklichen Anschluss an die folgende Rede.
  terminology: „erfüllt“, „durch den Propheten Jesaja“ und „gesagt worden war“ sind sachgerecht. „Durch“ wahrt die im Griechischen ausgedrückte prophetische Vermittlung, ohne zusätzliche theologische Festlegungen vorzunehmen.
  issues:
  - severity: medium
    issue: λέγοντος wurde semantisch ausgelassen.
    rationale: Der Doppelpunkt kann zwar ein Zitat einleiten, bildet aber nicht die im griechischen Text ausdrücklich vorhandene partizipiale Bezugnahme auf Jesaja als Sprechenden ab. Die vorhandene Fußnote räumt dies ein, behebt die Auslassung jedoch nicht und erklärt die Konstruktion zudem ungenau mit „indem er sagte“.
  - severity: low
    issue: „erfüllt wurde“ glättet den Modus von πληρωθῇ.
    rationale: Nach ἵνα steht ein Aorist Passiv Konjunktiv. „Damit erfüllt würde“ gibt diesen Satzanschluss im Deutschen genauer wieder und bleibt idiomatisch.
  revised_text: 'damit erfüllt würde, was durch den Propheten Jesaja gesagt worden war, der sagte:'
  revised_footnotes: []
  revision_rationale: Die Revision stellt die ausdrücklich vorhandene Partizipkonstruktion λέγοντος mit „der sagte“ wieder her und gibt den von ἵνα abhängigen Konjunktiv mit „erfüllt würde“ wieder. Die übrigen tragenden Elemente der Vorlage bleiben erhalten. Eine Fußnote ist nicht erforderlich, da die Formulierung die relevante griechische Struktur im deutschen Text selbst abbildet.
