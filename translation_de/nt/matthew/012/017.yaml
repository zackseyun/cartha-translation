  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: de
  text: 'damit erfüllt würde, was durch den Propheten Jesaja gesagt worden war, der sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet eine Zweck-/Folgekonstruktion ein und bewahrt diese Offenheit in natürlichem Deutsch.
- source_word: πληρωθῇ
  choice: erfüllt wurde
  rationale: Gibt den Aorist Passiv im matthäischen Erfüllungszitat idiomatisch wieder; der durch ἵνα ausgedrückte modale Zusammenhang wird im Deutschen bereits durch „damit“ getragen.
- source_word: τὸ ῥηθὲν
  choice: was … gesagt worden war
  rationale: Gibt das substantivierte passive Partizip natürlich wieder. Das Plusquamperfekt verdeutlicht, dass der prophetische Ausspruch vor dem erzählten Geschehen lag.
- source_word: διὰ
  choice: durch
  rationale: 'Bewahrt bei Genitiv die vermittelnde Urheberschaft: Jesaja ist der prophetische Vermittler der Botschaft.'
- source_word: Ἠσαΐου
  choice: Jesaja
  rationale: Verwendet die im Deutschen etablierte Namensform.
- source_word: τοῦ προφήτου
  choice: den Propheten
  rationale: Behält die ausdrückliche appositionelle Bezeichnung Jesajas bei.
- source_word: λέγοντος
  choice: ':'
  rationale: Der Doppelpunkt leitet das unmittelbar folgende Zitat in natürlichem modernem Deutsch ein. Eine wörtliche Wiedergabe mit „der sagte“ wäre möglich, aber schwerfälliger.
theological_decisions:
- issue: Prophetische Vermittlung in der Zitationsformel
  choice: durch den Propheten Jesaja
  alternative: von dem Propheten Jesaja
  rationale: „Durch“ entspricht διά mit Genitiv und lässt erkennen, dass Jesaja die Botschaft vermittelt, ohne ihn ausdrücklich als deren letzte Quelle festzulegen.
- issue: Zweck oder Folge der Erfüllung
  choice: damit erfüllt wurde
  alternative: sodass erfüllt wurde
  rationale: „Damit“ entspricht der üblichen matthäischen Erfüllungsformel, ohne die in ἵνα mögliche Spannung zwischen Zweck und Folge durch eine zusätzliche Erklärung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung „durch den Propheten Jesaja“ folgt natürlichem deutschem Sprachgebrauch; der Doppelpunkt stellt den Vorwärtsbezug zum Zitat in Vers 18 her.
