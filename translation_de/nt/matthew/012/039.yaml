review_pass:
  verdict: approve
  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes treffend wieder: die kontrastierende Antwort Jesu, die kollektive „Generation“, die moralische Kennzeichnung als „böse und ehebrecherisch“, das nachdrückliche Verlangen nach einem Zeichen, das Futurpassiv sowie die ausschließende Ausnahme des Zeichens Jonas. „Verlangt nach“ ist für ἐπιζητεῖ im Kontext vertretbar und ohne unzulässige Ergänzung. Die Formulierung zum Zeichen lässt dessen genaue Bedeutung wie im Ausgangstext offen.'
  naturalness: Das Deutsch ist modernes Standarddeutsch und zugleich in einem angemessen würdigen biblischen Register gehalten. „Er aber antwortete ihnen“ ist idiomatisch; die etwas formellere Passivform „wird ihr gegeben werden“ ist klar und passend. „Eine böse und ehebrecherische Generation“ ist verständlich und bewahrt die prägnante biblische Diktion.
  terminology: „Zeichen“, „Generation“, „böse“, „ehebrecherisch“ und „Prophet Jona“ sind terminologisch angemessen. Besonders „ehebrecherisch“ bewahrt die metaphorische Offenheit von μοιχαλίς, statt sie voreilig auf bloße Bundestreue oder ausschließlich sexuelle Untreue einzuengen. Die Fußnoten sind sachlich, korrekt verankert und erläutern beziehungsweise dokumentieren eine echte lexikalische Alternative.
