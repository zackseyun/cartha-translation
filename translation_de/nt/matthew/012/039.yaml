id: MAT.12.39
reference: Matthew 12:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: de
  text: 'Er aber antwortete ihnen: „Eine böse und ehebrecherische[a] Generation verlangt nach einem Zeichen, doch kein Zeichen wird ihr gegeben werden außer dem Zeichen des Propheten Jona[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ehebrecherisch“ kann neben wörtlichem Ehebruch auch die aus den Propheten bekannte Bildsprache für Untreue gegenüber Gott aufgreifen.
    reason: cross_reference
  - marker: b
    text: 'Auch möglich: „das Zeichen Jonas, des Propheten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Er aber antwortete ihnen
  rationale: Die griechische Verbindung aus Partizip und finitem Verb ist eine geläufige, semitisch geprägte Erzählformel. Im modernen Deutschen gibt „antwortete ihnen“ ihren Sinn natürlich wieder; ein zusätzliches „und sagte“ wäre unnötig schwerfällig.
- source_word: Γενεὰ
  choice: Generation
  rationale: „Generation“ bezeichnet hier kollektiv die Zeitgenossen Jesu und bewahrt die korporative Aussage des griechischen Singulars.
- source_word: πονηρὰ
  choice: böse
  rationale: „Böse“ gibt das klare moralische Urteil direkt und in angemessener Schärfe wieder.
- source_word: μοιχαλὶς
  choice: ehebrecherisch
  rationale: Die wörtliche Bildsprache bleibt erhalten und kann sowohl sittliche Verfehlung als auch die prophetisch geprägte Vorstellung der Untreue gegenüber Gott anklingen lassen.
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ entspricht dem weiten Bedeutungsumfang des griechischen Wortes. „Wunderzeichen“ würde den Ausdruck stärker festlegen, als es der Vers selbst tut.
- source_word: ἐπιζητεῖ
  choice: verlangt nach
  rationale: Das Verb bezeichnet ein nachdrückliches Suchen oder Fordern. „Verlangt nach“ klingt im Deutschen natürlich und gibt die Intensität besser wieder als das neutralere „sucht“.
- source_word: δοθήσεται αὐτῇ
  choice: wird ihr gegeben werden
  rationale: Die Form bewahrt das Futur Passiv; „ihr“ nimmt das grammatisch feminine Bezugswort „Generation“ eindeutig und idiomatisch wieder auf.
- source_word: εἰ μὴ
  choice: außer
  rationale: Nach der Verneinung bezeichnet die Wendung eine Ausnahme; „außer“ gibt diese Beziehung knapp und eindeutig wieder.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: das Zeichen des Propheten Jona
  rationale: Die Formulierung gibt die Genitivverbindung natürlich wieder und lässt offen, worin das Zeichen besteht. Die ebenfalls mögliche Wortfolge „das Zeichen Jonas, des Propheten“ steht in der Fußnote.
theological_decisions:
- issue: Bedeutung von μοιχαλὶς in Jesu Urteil
  choice: Die bildkräftige Bezeichnung „ehebrecherisch“ bleibt im Haupttext stehen.
  alternative: „treulos“ oder „untreu gegenüber Gott“
  rationale: Der Ausdruck kann an die prophetische Bildsprache vom Bundesbruch erinnern, ohne sich darin vollständig zu erschöpfen. Eine deutende Paraphrase würde die mögliche sexuelle und geistliche Dimension vorschnell auf eine einzige Lesart reduzieren.
- issue: Wesen des Zeichens Jonas
  choice: Die Wendung „Zeichen des Propheten Jona“ wird ohne Erklärung in den Haupttext übernommen.
  alternative: „ein Zeichen wie das Erlebnis Jonas“ oder „Jona selbst als Zeichen“
  rationale: Der Vers benennt das Zeichen, erklärt seine genaue Beziehung zu Jona aber noch nicht. Diese Spannung wird bewahrt und nicht durch eine vorweggenommene Auslegung aufgelöst.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung „Er aber“ erhält den Kontrast des griechischen δέ, ohne die semitisch geprägte Antwortformel im Deutschen unnötig nachzubilden.
