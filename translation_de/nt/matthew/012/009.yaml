  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: de
  text: Und er ging von dort weiter und kam in ihre Synagoge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der gewöhnliche erzählerische Anschluss wird schlicht wiedergegeben, ohne eine zusätzliche zeitliche Nuance einzuführen.
- source_word: μεταβὰς ἐκεῖθεν
  choice: ging von dort weiter
  rationale: Die Wendung gibt das Weggehen vom bisherigen Ort und den Übergang zum nächsten Schauplatz in natürlichem Deutsch wieder. Die Vorzeitigkeit des Aoristpartizips wird nicht umständlich mit einer deutschen Partizipialkonstruktion nachgebildet.
- source_word: ἦλθεν
  choice: kam
  rationale: Das griechische ἔρχομαι bedeutet hier die Ankunft am neuen Schauplatz. „Kam“ bewahrt die Perspektive des griechischen Verbs und klingt zusammen mit „ging … weiter“ natürlich.
- source_word: εἰς τὴν συναγωγὴν
  choice: in … Synagoge
  rationale: „In“ mit Akkusativ drückt die von εἰς bezeichnete Bewegung in das Gebäude hinein aus.
- source_word: συναγωγὴν
  choice: Synagoge
  rationale: „Synagoge“ ist die etablierte und sachlich genaue Bezeichnung für den jüdischen Versammlungs- und Gottesdienstort.
- source_word: αὐτῶν
  choice: ihre
  rationale: Das Genitivpronomen wird attributiv wiedergegeben. Der Bezug bleibt ebenso offen wie im griechischen Text.
theological_decisions:
- issue: Bezug von „ihre Synagoge“
  choice: Die Formulierung „ihre Synagoge“ bleibt ohne nähere Bestimmung stehen.
  alternative: „die Synagoge der dortigen Juden“ oder eine ausdrücklich polemische Gruppenbezeichnung
  rationale: Der griechische Text nennt mit αὐτῶν keine genauere Bezugsgruppe. Eine Präzisierung würde über den Wortlaut hinausgehen und möglicherweise eine polemische oder konfessionelle Deutung eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Satzstruktur bleibt nah am griechischen Bewegungsablauf, vermeidet aber eine im Deutschen schwerfällige Partizipialkonstruktion.
