id: MAT.12.20
reference: Matthew 12:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: de
  text: Ein geknicktes Rohr wird er nicht zerbrechen, und einen glimmenden Docht wird er nicht auslöschen[a], bis er das Recht zum Sieg führt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den rauchenden Flachs wird er nicht löschen“. Gemeint ist der aus Flachs gefertigte Docht einer Lampe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis er das Gericht zum Sieg führt“. Das griechische Wort kann Recht, Gericht oder Urteil bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: Rohr
  rationale: κάλαμος bezeichnet hier ein Rohr beziehungsweise einen Rohrhalm. „Rohr“ ist im Deutschen natürlich und bewahrt das Bild aus Jesaja 42.
- source_word: συντετριμμένον
  choice: geknickt
  rationale: Das Partizip bezeichnet etwas Zerschlagenes oder schwer Beschädigtes. „Geknickt“ macht verständlich, dass das Rohr beschädigt, aber noch nicht vollständig zerbrochen ist, und passt dadurch zur folgenden Aussage, er werde es nicht zerbrechen.
- source_word: κατεάξει
  choice: wird ... nicht zerbrechen
  rationale: κατάγνυμι bedeutet brechen oder zerbrechen. Die Wiedergabe ist klar, idiomatisch und erhält das Bild behutsamen Handelns.
- source_word: λίνον
  choice: Docht
  rationale: λίνον bezeichnet wörtlich Flachs beziehungsweise Leinen, meint in diesem Bild jedoch den aus Flachs gefertigten Lampendocht. „Docht“ nennt für heutige Leser unmittelbar den gemeinten Gegenstand.
- source_word: τυφόμενον
  choice: glimmenden
  rationale: Das Partizip beschreibt einen rauchenden oder nur noch schwach brennenden Docht. „Glimmend“ gibt den schwachen, beinahe erlöschenden Zustand in natürlichem Deutsch wieder.
- source_word: σβέσει
  choice: wird ... nicht auslöschen
  rationale: σβέννυμι bedeutet auslöschen. Das Verb ist im Deutschen für einen glimmenden Docht verständlich und bewahrt die Bildsprache.
- source_word: ἕως ἂν
  choice: bis
  rationale: Die Konstruktion bezeichnet den zukünftigen Zielpunkt, bis zu dem die vorangehenden Aussagen gelten. „Bis“ ist die knappe und natürliche Wiedergabe.
- source_word: ἐκβάλῃ
  choice: führt
  rationale: ἐκβάλλω kann wörtlich „hinausbringen“ bedeuten. In der Verbindung mit εἰς νῖκος bezeichnet es hier das wirksame Herbeiführen eines siegreichen Ausgangs; „zum Sieg führt“ bildet die gesamte Wendung idiomatisch ab.
- source_word: εἰς νῖκος
  choice: zum Sieg
  rationale: Die Präpositionalphrase bezeichnet das erfolgreiche Ziel oder Ergebnis. „Zum Sieg“ erhält diese Zielrichtung in geläufigem Deutsch.
- source_word: τὴν κρίσιν
  choice: das Recht
  rationale: κρίσις kann „Gericht“, „Urteil“ oder „Recht“ bezeichnen. Im Zusammenhang des Gottesknechts aus Jesaja 42 geht es um die wirksame Durchsetzung der gerechten Ordnung; „das Recht“ bewahrt zugleich den richterlichen Bedeutungsbereich besser als eine rein abstrakte Formulierung.
theological_decisions:
- issue: Wiedergabe von κρίσις im Zitat aus Jesaja
  choice: das Recht
  alternative: das Gericht
  rationale: „Das Recht“ entspricht dem weiteren prophetischen Sinn einer herbeigeführten gerechten Ordnung, ohne den richterlichen Aspekt auszuschließen. Da κρίσις auch „Gericht“ oder „Urteil“ bedeuten kann, wird diese echte Bedeutungsalternative in der Fußnote offengelegt.
- issue: Grad der Wörtlichkeit beim Bild des Lampendochts
  choice: glimmender Docht ... auslöschen
  alternative: rauchender Flachs ... löschen
  rationale: Der griechische Ausdruck nennt wörtlich Flachs beziehungsweise Leinen, bezeichnet aber im Bild den daraus gefertigten Lampendocht. Der Haupttext nennt den für heutige Leser erkennbaren Gegenstand; die Fußnote dokumentiert die formnähere Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter prophetischer Bildsprache. Die Satzstruktur bleibt eng am griechischen Parallelismus, während „Docht“ und „zum Sieg führt“ für heutige Leser idiomatisch formuliert sind. Die Stellung der Fußnotenmarker folgt jeweils der tatsächlich erläuterten Wendung.
