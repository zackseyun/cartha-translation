  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: de
  text: Denn aufgrund deiner Worte wirst du für gerecht erklärt werden[a], und aufgrund deiner Worte wirst du verurteilt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerechtfertigt“, „freigesprochen“ oder „als im Recht erwiesen“. Das griechische Verb kann im gerichtlichen Sinn bedeuten, dass jemand für gerecht beziehungsweise im Recht erklärt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: aufgrund
  rationale: Mit dem Genitiv bezeichnet ἐκ hier die Grundlage beziehungsweise das Beweismittel des Urteils. „Aufgrund“ gibt diesen forensischen Zusammenhang im Deutschen natürlich wieder.
- source_word: γάρ
  choice: denn
  rationale: γάρ begründet die vorausgehende Warnung über den Gebrauch der Sprache. „Denn“ bewahrt diese erklärende Verknüpfung.
- source_word: λόγων
  choice: Worte
  rationale: Der Plural λόγων bezeichnet hier die gesprochenen Äußerungen eines Menschen. „Worte“ ist direkt, verständlich und erhält die Wiederholung beider Satzhälften.
- source_word: σου
  choice: deiner
  rationale: Das Genitivpronomen bezeichnet in beiden Satzhälften die Zugehörigkeit der Worte zum angesprochenen Menschen.
- source_word: δικαιωθήσῃ
  choice: wirst du für gerecht erklärt werden
  rationale: Der zukünftige Passiv von δικαιόω hat durch den Gegensatz zu καταδικασθήσῃ einen gerichtlichen Sinn. „Für gerecht erklärt werden“ macht diesen deklarativen Sinn verständlich, ohne ihn auf bloße persönliche Bestätigung oder allein auf einen Freispruch zu verengen.
- source_word: καταδικασθήσῃ
  choice: wirst du verurteilt werden
  rationale: Der zukünftige Passiv bezeichnet ein gerichtliches Verdammungsurteil und bildet den ausdrücklichen Gegensatz zu δικαιωθήσῃ. „Verurteilt werden“ ist im modernen Deutschen klar und würdevoll.
theological_decisions:
- issue: Forensischer Sinn von δικαιόω im Verhältnis zu Worten und Gericht
  choice: „für gerecht erklärt werden“ als gerichtliche Feststellung auf der Grundlage der Worte
  alternative: „gerechtfertigt“, „freigesprochen“ oder „als im Recht erwiesen werden“
  rationale: Der unmittelbare Gegensatz zu „verurteilt werden“ stellt einen Gerichtszusammenhang her. Die gewählte Formulierung bewahrt den forensischen und deklarativen Sinn, ohne aus diesem einzelnen Vers eine umfassende Lehre über Rechtfertigung oder das Verhältnis von Worten und Heil abzuleiten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die parallele Satzstruktur und die zweimalige Wendung „aufgrund deiner Worte“ bilden den Nachdruck des griechischen Textes ab; das Futur Passiv bleibt in beiden Satzhälften erhalten.
