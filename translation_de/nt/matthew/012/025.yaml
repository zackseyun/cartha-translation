revisions:
- from: 'Da er aber ihre Gedanken[a] kannte, sagte er zu ihnen: »Jedes Reich, das gegen sich selbst gespalten ist, wird verwüstet[b]. Auch jede Stadt oder jedes Haus[c], das gegen sich selbst gespalten ist, wird keinen Bestand haben.«'
  to: 'Er kannte aber ihre Gedanken[a] und sagte zu ihnen: »Jedes Reich, das gegen sich selbst gespalten ist, wird verwüstet[b]. Auch jede Stadt oder jedes Haus[c], das gegen sich selbst gespalten ist, wird keinen Bestand haben.«'
  rationale: Die Revision ersetzt das potenziell kausale „Da“ durch eine koordinierende, im Deutschen natürliche Satzverbindung. Dadurch bleibt offen, wie Jesu Kenntnis der Gedanken mit seiner folgenden Aussage zusammenhängt und wie diese Kenntnis zustande kam. Die Fußnote zu ἐρημοῦται wird sprachlich geglättet; Bedeutung und Ambiguität bleiben erhalten.
