id: MAT.12.25
reference: Matthew 12:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: de
  text: 'Er kannte aber ihre Gedanken[a] und sagte zu ihnen: »Jedes Reich, das gegen sich selbst gespalten ist, wird verwüstet[b]. Auch jede Stadt oder jedes Haus[c], das gegen sich selbst gespalten ist, wird keinen Bestand haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Überlegungen; auch: ihre Absichten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: verödet; oder: wird zugrunde gerichtet.'
    reason: lexical_alternative
  - marker: c
    text: „Haus“ kann hier auch eine Hausgemeinschaft oder einen Haushalt bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: kannte
  rationale: Das Partizip bezeichnet hier geistiges Wissen oder Erkennen. „Kannte“ gibt die festgestellte Kenntnis natürlich wieder, ohne zu erklären, auf welche Weise sie zustande kam.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen leichten Übergang beziehungsweise Gegensatz; „aber“ passt zum argumentativen Umschwung im Zusammenhang.
- source_word: ἐνθυμήσεις
  choice: Gedanken
  rationale: Das Wort kann Gedanken, innere Überlegungen oder Absichten bezeichnen. „Gedanken“ ist allgemein verständlich und lässt die genaue Nuance offen; Alternativen werden in der Fußnote genannt.
- source_word: Πᾶσα βασιλεία
  choice: Jedes Reich
  rationale: πᾶσα mit einem Substantiv im Singular formuliert hier einen allgemeinen Grundsatz. „Jedes Reich“ bewahrt diesen universalen Charakter.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: gegen sich selbst gespalten
  rationale: Die Formulierung bezeichnet eine innere Spaltung, bei der die Teile gegeneinanderstehen. „Gegen sich selbst gespalten“ erhält sowohl den Gedanken der Teilung als auch die adversative Kraft.
- source_word: ἐρημοῦται
  choice: wird verwüstet
  rationale: Das Verb bezeichnet das Veröden beziehungsweise Zugrundegehen. „Wird verwüstet“ bewahrt die starke Bildsprache und die passive Form.
- source_word: πόλις ἢ οἰκία
  choice: Stadt oder Haus
  rationale: πόλις bedeutet „Stadt“, während οἰκία sowohl ein Gebäude als auch eine Haus- beziehungsweise Lebensgemeinschaft bezeichnen kann. „Haus“ bleibt nahe an der griechischen Form und die weitere Bedeutung wird in einer Fußnote kenntlich gemacht.
- source_word: οὐ σταθήσεται
  choice: wird keinen Bestand haben
  rationale: Die zukünftige Passivform von ἵστημι bezeichnet in diesem Zusammenhang das Fortbestehen oder Standhalten. „Keinen Bestand haben“ ist im modernen Deutsch natürlich und gibt den idiomatischen Sinn klar wieder.
theological_decisions:
- issue: Art und Ursprung von Jesu Kenntnis ihrer inneren Gedanken
  choice: Der Text sagt lediglich, dass er ihre Gedanken kannte, ohne die Art dieser Kenntnis näher zu bestimmen.
  alternative: Die Kenntnis ausdrücklich als übernatürliche Allwissenheit, prophetische Einsicht oder menschliche Schlussfolgerung bezeichnen.
  rationale: Der griechische Text stellt die Kenntnis fest, erklärt aber nicht, wie sie zustande kam. Die Übersetzung bewahrt diese Offenheit und trägt keine zusätzliche Lehrentscheidung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwörtliche Parallelstruktur bleibt erkennbar; „keinen Bestand haben“ ist natürlicher als das im Deutschen weniger eindeutige wörtliche „nicht stehen“.
