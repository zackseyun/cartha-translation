    rationale: Das griechische εἰδώς ist ein Partizip, das Jesu Kenntnis begleitend feststellt; es erklärt nicht, weshalb er sprach. „Da“ führt im modernen Deutsch typischerweise einen Grund an und verengt daher die Beziehung der Satzteile.
  - severity: low
    issue: Fußnote b enthält mit „wird öde“ keine idiomatisch vollständige Alternative zu „wird verwüstet“.
    rationale: „Verödet“ bzw. „wird zur Einöde“ gibt die mögliche Bedeutung von ἐρημοῦται natürlich und präzise wieder.
