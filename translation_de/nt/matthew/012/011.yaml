  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: de
  text: 'Er aber sagte zu ihnen: „Wer von euch, der ein einziges Schaf hat, wird es nicht ergreifen und herausheben[b], wenn es am Sabbat[a] in eine Grube fällt?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen der Plural „an den Sabbaten“, der hier idiomatisch „am Sabbat“ bedeutet.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hochheben“ beziehungsweise „emporheben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτοῖς
  choice: Er aber sagte zu ihnen
  rationale: Die adversative Partikel δέ wird mit „aber“ wiedergegeben; die Wortfolge bleibt würdevoll und nahe am griechischen Erzählstil.
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει
  choice: Wer von euch wird nicht, wenn er … hat
  rationale: Die verschachtelte rhetorische Konstruktion wird in natürliches modernes Deutsch überführt. „Wer von euch“ gibt das repräsentativ gebrauchte ἄνθρωπος idiomatisch wieder, ohne den Bezug auf die angesprochenen Menschen einzuschränken; das Futur bleibt in der Hauptfrage erhalten.
- source_word: πρόβατον ἕν
  choice: ein einziges Schaf
  rationale: „Ein einziges“ bewahrt den Nachdruck des Zahlworts ἕν und klingt im hypothetischen Beispiel natürlich.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: wenn … dieses … fällt
  rationale: Der Konditionalsatz mit Aorist Konjunktiv bezeichnet einen möglichen Fall; „dieses“ nimmt das eine Schaf ausdrücklich wieder auf.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Der griechische Plural ist eine gebräuchliche idiomatische Bezeichnung für den Sabbattag; der deutsche Singular vermittelt den gemeinten Sachverhalt klar.
- source_word: εἰς βόθυνον
  choice: in eine Grube
  rationale: βόθυνος bezeichnet allgemein eine Grube oder Vertiefung; „Grube“ vermeidet eine unbelegte nähere Bestimmung.
- source_word: οὐχὶ
  choice: nicht
  rationale: οὐχί kennzeichnet eine rhetorische Frage, auf die eine bejahende Antwort erwartet wird. Die deutsche Frage mit „nicht“ bewahrt diese Erwartung.
- source_word: κρατήσει αὐτό
  choice: es fest packen
  rationale: κρατέω bezeichnet hier kräftiges Ergreifen oder Festhalten. „Fest packen“ ist anschaulich, verständlich und dem Rettungsvorgang angemessen.
- source_word: καὶ ἐγερεῖ
  choice: und herausheben
  rationale: ἐγείρω bedeutet „aufrichten/aufheben“; im Bild der Grube macht „herausheben“ die im Kontext vorausgesetzte Bewegungsrichtung natürlich deutlich.
theological_decisions:
- issue: Repräsentatives ἄνθρωπος im rhetorischen Beispiel
  choice: Wer von euch
  alternative: Welcher Mensch unter euch
  rationale: „Wer von euch“ ist die natürliche deutsche Form der rhetorischen Frage und umfasst denselben Kreis der angesprochenen Personen. Das ausdrücklich männliche „Mann“ wäre für ἄνθρωπος hier semantisch enger als nötig.
- issue: Idiomatischer Plural τοῖς σάββασιν
  choice: am Sabbat
  alternative: an den Sabbaten
  rationale: Der Plural bezeichnet hier idiomatisch den einzelnen Sabbattag, an dem der angenommene Vorfall geschieht. Der Singular vermeidet die irreführende Vorstellung eines wiederholten Geschehens.
- issue: Kontextuelle Verdeutlichung bei ἐγερεῖ
  choice: herausheben
  alternative: aufrichten / aufheben
  rationale: Der Zusammenhang mit der Grube legt das Herausheben nahe, doch die Fußnote hält die formal allgemeinere Bedeutung des Verbs sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage wurde gegenüber der griechischen Verschachtelung behutsam neu geordnet; die erwartete bejahende Antwort und das konkrete Bild bleiben erhalten.
