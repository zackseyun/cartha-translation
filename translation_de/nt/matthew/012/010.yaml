source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: de
  text: 'Und siehe, da war ein Mann mit einer verdorrten Hand. Sie fragten ihn: »Ist es erlaubt, an Sabbaten[a] zu heilen?« Damit sie ihn anklagen konnten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Deutschen idiomatischer: »am Sabbat«. Im Griechischen steht der Plural »an den Sabbaten«, eine übliche Bezeichnung für Sabbattage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden und vergegenwärtigenden Erzählton des griechischen Ausdrucks, ohne das heute altertümlich wirkende »siehe« zu verwenden.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Der Ausdruck bezeichnet hier einen einzelnen männlichen Menschen; »ein Mann« gibt dies unmittelbar und natürlich wieder.
- source_word: χεῖρα ἔχων ξηράν
  choice: mit einer verdorrten Hand
  rationale: Die präpositionale Wendung ist im Deutschen idiomatischer als eine wörtliche Partizipialkonstruktion. »Verdorrt« bezeichnet die verkümmerte beziehungsweise funktionsunfähige Hand, ohne eine medizinische Diagnose hinzuzufügen.
- source_word: ἐπηρώτησαν αὐτόν
  choice: sie fragten Jesus
  rationale: »Fragten« gibt das Verb neutral wieder; die feindselige Absicht wird erst im folgenden Zwecksatz ausdrücklich. Der Name »Jesus« macht den im Deutschen sonst potenziell mehrdeutigen Rückbezug des Pronomens klar.
- source_word: λέγοντες
  choice: direkte Rede ohne eigenständiges »und sagten«
  rationale: Im natürlichen modernen Deutsch kann das begleitende Partizip durch den unmittelbaren Anschluss der direkten Rede wiedergegeben werden, ohne Information einzubüßen.
- source_word: ἔξεστι
  choice: ist es erlaubt
  rationale: Die Formulierung bezeichnet im Kontext der Sabbatvorschriften das rechtlich beziehungsweise religiös Zulässige. »Erlaubt« klingt im heutigen Deutsch natürlicher als »gesetzlich erlaubt« oder »rechtmäßig«.
- source_word: τοῖς σάββασιν
  choice: an Sabbaten
  rationale: Der Plural des griechischen Textes bleibt sichtbar. Im Deutschen ist diese Form verständlich, während die idiomatischere singularische Wiedergabe in der Fußnote genannt wird.
- source_word: θεραπεύειν
  choice: zu heilen
  rationale: »Heilen« ist in diesem Zusammenhang die natürliche und sachlich offene Wiedergabe, ohne Art oder Mittel der Heilung näher festzulegen.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: Damit wollten sie einen Grund finden, ihn anzuklagen
  rationale: Die Formulierung gibt die feindselige Absicht des Zwecksatzes in natürlichem Deutsch wieder. Der ergänzte Gedanke »einen Grund finden« macht deutlich, wie die Frage der beabsichtigten Anklage dienen sollte, ohne den möglichen rechtlichen Sinn von »anklagen« aufzugeben.
theological_decisions:
- issue: Wiedergabe des pluralischen Sabbatausdrucks in einer Kontroverse über das Erlaubte
  choice: an Sabbaten
  alternative: am Sabbat
  rationale: Der griechische Text verwendet den Dativ Plural τοῖς σάββασιν, eine geläufige Bezeichnung für Sabbattage. Der Haupttext wahrt diese Form; die im Deutschen üblichere singularische Fassung wird als echte idiomatische Alternative in der Fußnote angegeben.
- issue: Zweck und rechtlicher Klang der Frage
  choice: Damit wollten sie einen Grund finden, ihn anzuklagen
  alternative: damit sie ihn anklagen könnten
  rationale: Der finale Sinn von ἵνα bleibt erhalten. Die gewählte Formulierung macht den Zusammenhang zwischen Fangfrage und beabsichtigter Anklage verständlich, ohne festzulegen, ob es sich um eine förmliche gerichtliche Anklage oder eine allgemeinere Beschuldigung handelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sieh« erhält die erzählerische Lebendigkeit von ἰδού, ohne den archaischeren Imperativ »siehe«. Die direkte Rede wird klar und flüssig angeschlossen; der griechische Sabbat-Plural bleibt mit erläuternder Fußnote sichtbar.
