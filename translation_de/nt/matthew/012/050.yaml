  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: de
  text: Denn wer den Willen meines Vaters im Himmel tut, der ist mein Bruder und meine Schwester und meine Mutter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn jeder, der den Willen meines Vaters im Himmel tut, ist mein Bruder und meine Schwester und meine Mutter.“ Im Griechischen steht eine grammatisch maskuline Singularform, die hier allgemein gebraucht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: wer
  rationale: Die indefinite Relativkonstruktion mit ἄν formuliert eine offene, allgemeine Bedingung. Das deutsche „wer“ gibt dies natürlich und prägnant wieder.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorangehenden Kontext.
- source_word: ποιήσῃ
  choice: tut
  rationale: ποιέω mit θέλημα entspricht unmittelbar der deutschen Wendung „den Willen tun“. „Gehorcht“ wäre stärker deutend und würde den Sinn verengen.
- source_word: τὸ θέλημα
  choice: den Willen
  rationale: Die traditionelle und zugleich verständliche Wiedergabe bewahrt den theologischen und relationalen Gehalt des Ausdrucks.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: meines Vaters im Himmel
  rationale: Die Formulierung gibt die Genitivverbindung mit der attributiven Präpositionalphrase knapp und natürlich wieder, ohne sie zu „meines himmlischen Vaters“ umzuformen.
- source_word: αὐτός
  choice: der
  rationale: Das korrelative „wer …, der …“ ist im Deutschen idiomatisch und wahrt die Hervorhebung der betreffenden Person durch αὐτός.
- source_word: μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: mir Bruder und Schwester und Mutter
  rationale: Der freie Dativ „mir“ ist eine natürliche deutsche Entsprechung des Beziehungsgenitivs μου und bewahrt die einzeln aufgeführten familiären Rollen.
- source_word: ἐστίν
  choice: ist
  rationale: Die einfache Kopula und das Präsens werden direkt beibehalten.
theological_decisions:
- issue: Generisch gebrauchte grammatisch maskuline Einzahl
  choice: wer …, der ist mir Bruder und Schwester und Mutter
  alternative: wer …, ist mein Bruder, meine Schwester und meine Mutter
  rationale: ὅστις und αὐτός stehen grammatisch maskulin im Singular, haben hier aber generische Reichweite. Das deutsche Korrelat „wer …, der“ bewahrt die Singularstruktur und die Hervorhebung, während „Schwester“ und „Mutter“ im selben Satz die Einbeziehung beider Geschlechter ausdrücklich erkennen lassen.
- issue: Art der geistlichen Familienbeziehung
  choice: ist mir Bruder und Schwester und Mutter
  alternative: gehört zu meiner Familie
  rationale: Die konkrete dreifache Metapher des griechischen Textes wird nicht zu einer allgemeinen Aussage über Familienzugehörigkeit verflacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. „Den Willen tun“ bleibt bewusst erhalten; die Konstruktion „wer …, der“ ist idiomatisch und bildet die Hervorhebung des griechischen αὐτός ab.
