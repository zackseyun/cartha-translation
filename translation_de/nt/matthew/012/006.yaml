id: MAT.12.6
reference: Matthew 12:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: de
  text: 'Doch ich sage euch: Hier ist Größeres als der Tempel.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hier ist jemand, der größer ist als der Tempel“; auch: „Hier ist einer, der größer ist als der Tempel.“ Im Griechischen steht „größer“ in der sächlichen Form; worauf es sich bezieht, bleibt formal unausgesprochen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „An diesem Ort ist Größeres als der Tempel.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Doch ich sage euch
  rationale: Die übliche Anredeformel wird direkt wiedergegeben. δέ markiert hier einen milden Gegensatz zum vorausgehenden Argument; „Doch“ ist natürlich und weniger stark als „Aber“.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen den Inhalt der Aussage idiomatisch ein; ein ausdrückliches „dass“ würde eine weniger prägnante Satzstellung erfordern.
- source_word: τοῦ ἱεροῦ
  choice: als der Tempel
  rationale: ἱερόν bezeichnet gewöhnlich den Tempel beziehungsweise den gesamten Tempelbezirk, nicht spezifisch das innere Heiligtum (ναός). „Tempel“ ist im Deutschen die natürliche kontextgemäße Wiedergabe.
- source_word: μεῖζόν
  choice: Größeres
  rationale: Der substantivierte Komparativ steht im Neutrum Singular. „Größeres“ bewahrt diese grammatische Form und lässt den Bezug wie im Griechischen formal unausgesprochen.
- source_word: ἐστιν
  choice: ist
  rationale: Die einfache Kopula im Präsens wird ohne erläuternde Erweiterung wiedergegeben.
- source_word: ὧδε
  choice: hier
  rationale: Das lokale Adverb bedeutet „hier“ oder „an diesem Ort“. „Hier“ ist knapp und natürlich.
theological_decisions:
- issue: Identität des unausgesprochenen Bezugs von μεῖζόν
  choice: „Größeres“ als neutrales substantiviertes Adjektiv
  alternative: „einer, der größer ist“ oder „jemand, der größer ist“
  rationale: Das Griechische verwendet die neutrale Form μεῖζόν und benennt den Bezug nicht ausdrücklich. Der Kontext weist zwar stark auf Jesus und seine Vollmacht hin, doch die Übersetzung soll diese Deutung nicht grammatisch in den Haupttext eintragen und die theologische Spannung bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, feierliche Aussageform bleibt erhalten; „Größeres“ bewahrt zugleich die ungewöhnliche neutrale Form des Ausgangstextes.
