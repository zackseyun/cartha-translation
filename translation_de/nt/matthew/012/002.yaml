id: MAT.12.2
reference: Matthew 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: de
  text: 'Als aber die Pharisäer das sahen, sagten sie zu ihm: »Sieh doch! Deine Jünger tun etwas, was man am Sabbat nicht tun darf.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Als
  rationale: Der leichte Fortgang bzw. Kontrast wird im Deutschen durch die einleitende temporale Konstruktion natürlich wiedergegeben; ein ausdrückliches »aber« ist hier nicht nötig.
- source_word: ἰδόντες
  choice: als ... das sahen
  rationale: Das Aoristpartizip wird idiomatisch temporal aufgelöst. »Das« bezeichnet die aus dem Zusammenhang bekannte Handlung der Jünger.
- source_word: εἶπαν αὐτῷ
  choice: sagten sie zu ihm
  rationale: Direkte und neutrale Wiedergabe der griechischen Redeformel.
- source_word: Ἰδοὺ
  choice: Sieh doch!
  rationale: Die auffordernde, Aufmerksamkeit heischende Funktion bleibt in natürlichem modernem Deutsch erhalten.
- source_word: μαθηταί
  choice: Jünger
  rationale: Etablierter deutscher Begriff für das Lehrer-Schüler- bzw. Nachfolgeverhältnis in den Evangelien.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: tun ... tun
  rationale: Die Wiederholung von ποιέω wird bewahrt, ohne im Deutschen gekünstelt zu wirken.
- source_word: ὃ οὐκ ἔξεστιν
  choice: etwas, was man ... nicht tun darf
  rationale: ἔξεστιν bezeichnet das Erlaubt- oder Zulässigsein. »Nicht tun darf« wahrt den rechtlich-permissiven Sinn, ohne die Quelle oder Gültigkeit der beanstandeten Norm festzulegen.
- source_word: ἐν σαββάτῳ
  choice: am Sabbat
  rationale: Idiomatiche deutsche Zeitangabe für den in diesem Zusammenhang gemeinten Sabbattag bzw. die Sabbatordnung.
theological_decisions:
- issue: Art des Einwands der Pharisäer
  choice: »was man am Sabbat nicht tun darf«
  alternative: »was am Sabbat nicht erlaubt ist« / »was am Sabbat nicht gesetzlich ist«
  rationale: Die Übersetzung formuliert den Einwand als Frage des Erlaubten, entscheidet aber nicht, ob er sich auf die Tora oder auf eine bestimmte Auslegungstradition stützt. So bleibt die Spannung des Textes erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sieh doch!« gibt den nachdrücklichen Hinweischarakter von Ἰδοὺ lebendig wieder; »Jünger« bewahrt die etablierte biblische Terminologie.
