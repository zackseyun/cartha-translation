id: MAT.12.35
reference: Matthew 12:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: de
  text: Der gute Mensch bringt aus seinem guten Schatz Gutes hervor,[a] und der böse Mensch bringt aus seinem bösen Schatz Böses hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im unmittelbaren Zusammenhang geht es um das Reden; „Gutes“ und „Böses“ können daher besonders gute beziehungsweise böse Worte bezeichnen.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς
  choice: gut
  rationale: Bewahrt die wiederholte Wortwurzel und den klaren moralischen Gegensatz zu πονηρός.
- source_word: ἄνθρωπος
  choice: Mensch
  rationale: Im Deutschen gibt „Mensch“ den repräsentativen Singular natürlich wieder, ohne die Aussage unnötig auf Männer zu beschränken.
- source_word: θησαυροῦ
  choice: Schatz
  rationale: Bewahrt das Bild eines inneren Vorrats; „Vorrat“ wäre möglich, würde aber die Metapher abschwächen.
- source_word: ἐκβάλλει
  choice: bringt … hervor
  rationale: Gibt das Hervorkommen aus dem Schatz idiomatisch wieder, ohne die im Deutschen zu heftige Bedeutung von „hinauswerfen“ anzunehmen.
- source_word: ἀγαθά
  choice: Gutes
  rationale: Das substantivierte sächliche Pluraladjektiv wird im Deutschen am natürlichsten durch das substantivierte „Gutes“ wiedergegeben und bleibt inhaltlich offen.
- source_word: πονηρὸς
  choice: böse
  rationale: Bewahrt den starken moralischen Gegensatz zu „gut“; „schlecht“ wäre zu schwach.
- source_word: πονηρά
  choice: Böses
  rationale: Entspricht parallel zu ἀγαθά dem substantivierten Ausdruck und wahrt die symmetrische Satzstruktur.
- source_word: ἐκ
  choice: aus
  rationale: „Aus“ bildet die Herkunft aus dem bildlichen Schatz im Deutschen präzise und natürlich ab.
theological_decisions:
- issue: Moralisch-anthropologischer Gegensatz in sprichwortartiger Form
  choice: Die allgemein gehaltenen Ausdrücke „Gutes“ und „Böses“ bleiben im Haupttext erhalten.
  alternative: Wegen des unmittelbaren Zusammenhangs ausdrücklich „gute Worte“ und „böse Worte“ zu übersetzen.
  rationale: Der Kontext handelt besonders vom Reden, doch der griechische Text nennt hier kein Substantiv wie „Worte“. Die offene Formulierung wahrt sowohl den unmittelbaren Bezug auf Sprache als auch die grundsätzlich breitere Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur und die Wiederholung von „gut“/„böse“ sowie „Schatz“/„hervorbringen“ bleiben sichtbar. „Mensch“ ist im heutigen Deutschen die natürliche repräsentative Wiedergabe von ἄνθρωπος.
