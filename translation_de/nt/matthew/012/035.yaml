  source_fidelity: Der deutsche Text gibt die Parallelstruktur, die Wiederholung von „gut“/„böse“, das Bild des Schatzes und das substantivierte neutrale Pluraladjektiv des griechischen Textes zuverlässig wieder. „Gutes“ und „Böses“ bewahren die bewusst offene Referenz von ἀγαθά und πονηρά. „Aus seinem ... Schatz“ ist eine natürliche deutsche Entfaltung des bildlichen Besitzbezugs und verändert die Aussage nicht.
  naturalness: „Der gute Mensch bringt aus seinem guten Schatz Gutes hervor“ ist modernes, idiomatisches und würdiges Standarddeutsch. Die Wiederholung wirkt hier als absichtliche, dem griechischen Spruchstil entsprechende Parallelität.
