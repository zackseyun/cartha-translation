id: MAT.12.27
reference: Matthew 12:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: de
  text: Und wenn ich durch Beelzebul[a] die Dämonen austreibe, durch wen treiben eure Söhne sie aus? Darum werden sie eure Richter sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Beelzebul“; traditionell auch „Beelzebub“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: durch Beelzebul
  rationale: ἐν bezeichnet hier im Zusammenhang des Vorwurfs das Mittel beziehungsweise die wirkende Macht. „Durch“ gibt diesen instrumentalen Sinn im Deutschen natürlich wieder. Der Name folgt der Form Βεελζεβούλ im SBLGNT.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: die Dämonen austreibe
  rationale: ἐκβάλλω bezeichnet im Exorzismuskontext das Vertreiben oder Austreiben; „austreiben“ ist im modernen Deutschen klar und idiomatisch. δαιμόνια wird mit „Dämonen“ wiedergegeben.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: eure Söhne
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird bewahrt. Im Kontext können Angehörige oder Schüler der Angesprochenen gemeint sein, doch die Übersetzung legt diese Deutung nicht vorschnell fest.
- source_word: ἐν τίνι
  choice: durch wen
  rationale: Wie zuvor hat ἐν instrumentalen Sinn. Das personale Fragewort „wen“ entspricht dem rhetorischen Vergleich mit Beelzebul und klingt im Deutschen natürlich.
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: „Darum“ gibt die folgernde Kraft der Wendung knapp und idiomatisch wieder.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: werden sie eure Richter sein
  rationale: Die Formulierung bewahrt das Futur und die substantivische Aussage mit κριταί, ohne sie zum Verb „verurteilen“ umzudeuten.
theological_decisions:
- issue: Identität und Schreibweise von Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Die Übersetzung folgt der im vorgegebenen griechischen Text überlieferten Namensform und harmonisiert sie nicht mit der geläufigeren traditionellen Form.
- issue: Bedeutung von „eure Söhne“
  choice: wörtliche Wiedergabe als „eure Söhne“
  alternative: „eure Anhänger“ oder „eure Schüler“
  rationale: Der Kontext lässt eine gruppenbezogene Bedeutung zu, doch der griechische Text verwendet ausdrücklich υἱοί. Die wörtliche Form erhält die rhetorische Spannung und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Parallelität von „durch Beelzebul“ und „durch wen“ sowie die bewusst offene Bezeichnung „eure Söhne“ bleiben erhalten.
