  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: de
  text: 'Dann sagt er: »Ich will zu meinem Haus zurückkehren, das ich verlassen habe.« Und als er kommt, findet er es leer[a], sauber gefegt und in Ordnung gebracht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »frei« beziehungsweise »unbesetzt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »geschmückt« beziehungsweise »verziert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das temporale Adverb leitet knapp und natürlich den nächsten Schritt der Schilderung ein.
- source_word: λέγει
  choice: sagt er
  rationale: Das Präsens bewahrt die lebendige Erzählweise. Gemeint ist der unreine Geist aus dem vorangehenden Zusammenhang; da »Geist« im Deutschen maskulin ist, ist »er« grammatisch natürlich.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Ich will in mein Haus zurückkehren
  rationale: »Zurückkehren« gibt ἐπιστρέφω wieder, während »mein Haus« den Besitzanspruch des Geistes und das Bild des Ausgangstextes bewahrt.
- source_word: ὅθεν ἐξῆλθον
  choice: aus dem ich ausgezogen bin
  rationale: Die Formulierung bewahrt die konkrete Vorstellung des Verlassens eines Hauses und ist im Deutschen idiomatisch.
- source_word: ἐλθὸν
  choice: wenn er kommt
  rationale: Das vorzeitige Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben und wahrt die Handlungsfolge.
- source_word: εὑρίσκει
  choice: findet er
  rationale: Das Präsens erhält die anschauliche Erzählgegenwart.
- source_word: σχολάζοντα
  choice: unbewohnt
  rationale: Das Wort kann »frei«, »unbeschäftigt«, »leer« oder »unbesetzt« bedeuten. Beim Bild eines Hauses bezeichnet »unbewohnt« verständlich dessen verfügbaren, nicht belegten Zustand, ohne die Metapher auszudeuten.
- source_word: σεσαρωμένον
  choice: gekehrt
  rationale: Das Perfektpartizip beschreibt den fortbestehenden Zustand nach dem Kehren; »gekehrt« gibt dies knapp wieder.
- source_word: κεκοσμημένον
  choice: geordnet
  rationale: κοσμέω kann »ordnen«, »herrichten« oder »schmücken« bedeuten. »Geordnet« passt zum Zustand des Hauses, während die mögliche Bedeutung »geschmückt« in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bildhafte Bedeutung des Hauses in der Aussage über den zurückkehrenden unreinen Geist
  choice: »Haus« bleibt im Haupttext wörtlich stehen und wird nicht als »Mensch« oder »Leben« ausgedeutet.
  alternative: »Ich will zu dem Menschen zurückkehren, den ich verlassen habe.«
  rationale: Der Zusammenhang erschließt die Bildrede, doch der Vers selbst spricht von einem Haus. Die Beibehaltung des Bildes vermeidet eine interpretierende Paraphrase.
- issue: Geschlecht des Pronomens für den unreinen Geist
  choice: Das grammatisch natürliche deutsche Maskulinum »er« wird verwendet.
  alternative: Das sächliche Pronomen »es« entsprechend dem griechischen Genus von πνεῦμα.
  rationale: Das Genus des griechischen πνεῦμα ist sächlich, während das entsprechende deutsche Substantiv »Geist« maskulin ist. Die Wahl von »er« ist eine grammatische Anpassung und keine Aussage über Wesen oder Geschlecht des Geistes.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Erzählton. Das Präsens der griechischen Schilderung wird beibehalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils mehrdeutigen Wörtern.
