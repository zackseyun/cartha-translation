  terminology: »Haus« wahrt das metaphorische Bild ohne Auslegung. »Leer« ist als kontextgerechte Hauptwiedergabe von σχολάζοντα geeignet; die Fußnote hält die Alternativen offen. »In Ordnung gebracht« gibt κεκοσμημένον angemessen wieder, ohne die mögliche Nuance des Schmückens auszuschließen.
