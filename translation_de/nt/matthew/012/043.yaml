    rationale: Das griechische τοῦ ἀνθρώπου kann in dieser allgemein formulierten Aussage einen exemplarischen Menschen bezeichnen. Deutsch „aus einem Menschen“ ist ohne vorausgehenden Referenten natürlicher und erhält den generischen Sinn.
  - severity: low
    issue: „wasserlose Orte“ ist leicht kalkiert
    rationale: Die Formulierung ist verständlich, klingt aber im modernen Standarddeutsch weniger idiomatisch. „Wasserlose Gegenden“ bewahrt ἄνυδροι τόποι und passt besser zur Bewegung des Geistes durch eine Landschaft.
