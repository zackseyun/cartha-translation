- from: Wenn aber der unreine Geist aus dem Menschen hinausgeht, zieht er durch wasserlose Orte[a], sucht Ruhe und findet sie nicht.
  to: Wenn aber der unreine Geist aus einem Menschen hinausgeht, zieht er durch wasserlose Gegenden[a], sucht Ruhe und findet sie nicht.
  rationale: Die Revision glättet zwei deutsche Formulierungen, ohne die Aussage oder die bewusste Bildsprache des Ausgangstextes zu verändern. Der milde Anschlusswert von δέ bleibt mit „aber“ sichtbar; keine zusätzliche zeitliche Partikel wird eingeführt. Die Fußnotenmarke bleibt unmittelbar an der Wiedergabe von ἀνύδρων τόπων verankert.
