  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: de
  text: Wenn aber der unreine Geist aus einem Menschen hinausgeht, zieht er durch wasserlose Gegenden[a], sucht Ruhe und findet sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dürre Gegenden“. Wörtlich: „wasserlose Orte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Wenn aber
  rationale: Ὅταν leitet einen allgemeinen zeitlichen Fall ein; δέ markiert einen milden Übergang. „Wenn aber“ gibt beides knapp wieder, ohne ein zeitliches „nun“ hinzuzufügen.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: der unreine Geist
  rationale: Die wörtliche und im Kontext verständliche Bezeichnung bewahrt den Anklang an kultische beziehungsweise moralische Unreinheit.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: aus dem Menschen hinausgeht
  rationale: „Hinausgeht“ bezeichnet die Bewegung aus dem Menschen heraus; „dem Menschen“ wahrt den bestimmten Artikel und die allgemein gehaltene Einzelfigur des Gleichnisses.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: zieht er durch wasserlose Orte
  rationale: „Wasserlos“ bildet ἄνυδρος konkret und quellennah ab; „zieht durch“ gibt die Bewegung durch diese Orte in natürlichem Deutsch wieder.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: sucht Ruhe
  rationale: Die knappe finite Form gibt die gleichzeitige Handlung des Partizips natürlich wieder, ohne „Ruhe“ zu einem bestimmten Ruheplatz zu konkretisieren.
- source_word: καὶ οὐχ εὑρίσκει
  choice: und findet sie nicht
  rationale: Das im Griechischen unausgedrückte Objekt ist aus „Ruhe“ zu ergänzen; das Pronomen sorgt im Deutschen für eine klare, natürliche Verbindung.
theological_decisions:
- issue: Wiedergabe von πνεῦμα im Zusammenhang mit bösen Geistern
  choice: Geist
  alternative: Dämon
  rationale: Obwohl ein personaler böser Geist gemeint ist, steht im Ausgangstext πνεῦμα und nicht δαιμόνιον. „Geist“ bewahrt daher die Ausdrucksweise und die theologische Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bildhaft und knapp; die Fußnote steht unmittelbar bei dem Ausdruck, auf den sie sich bezieht.
