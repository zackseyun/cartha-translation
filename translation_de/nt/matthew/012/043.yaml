review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt Satzstruktur und Aussage des griechischen Textes zuverlässig wieder: Der allgemeine Zeitfall, das „unreine“ Geistwesen, das Ausgehen aus einem Menschen, die Wanderung durch wasserlose Orte sowie die erfolglose Suche nach Ruhe bleiben erhalten. Die Ergänzung „sie“ für die implizite ἀνάπαυσις ist im Deutschen angemessen.'
  naturalness: „Aus dem Menschen“ wirkt im modernen Deutschen ohne vorherigen individuellen Bezug unnötig bestimmt und leicht abstrakt; „aus einem Menschen“ gibt den generischen Einzelfall idiomatischer wieder. „Wasserlose Gegenden“ ist in diesem räumlichen Zusammenhang natürlicher als „wasserlose Orte“, ohne das konkrete Bild abzuschwächen.
  terminology: „Unreiner Geist“ ist die sachgerechte, etablierte Wiedergabe von τὸ ἀκάθαρτον πνεῦμα. „Geist“ ist gegenüber der engeren Deutung „Dämon“ vorzuziehen. „Ruhe“ trifft ἀνάπαυσις, ohne unzulässig einen Ruheplatz zu spezifizieren.
  issues:
