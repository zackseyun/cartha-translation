id: MAT.12.33
reference: Matthew 12:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: de
  text: Macht[a] entweder den Baum gut und seine Frucht gut, oder macht den Baum faul[b] und seine Frucht faul; denn an seiner Frucht wird der Baum erkannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das wiederholte »macht« kann hier rhetorisch auch »haltet für« oder »erweist als« bedeuten; im Griechischen steht jedoch die Befehlsform.
    reason: alternative_reading
  - marker: b
    text: Oder »schlecht« beziehungsweise »verdorben«; das griechische Wort kann etwas Faules, Verdorbenes oder Unbrauchbares bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: Macht
  rationale: Der Aoristimperativ Plural wird direkt als Imperativ wiedergegeben. Obwohl die Wendung rhetorisch auch im Sinn von »haltet für« oder »erweist als« verstanden werden kann, bewahrt »macht« die auffällige Form und den Parallelismus des Griechischen.
- source_word: δένδρον
  choice: Baum
  rationale: Die natürliche und genaue deutsche Entsprechung erhält das zentrale Bild.
- source_word: καλός
  choice: gut
  rationale: »Gut« wahrt sowohl die qualitative als auch die mögliche ethische Bedeutung, ohne den Sinn auf körperliche Gesundheit einzuengen.
- source_word: καρπός
  choice: Frucht
  rationale: »Frucht« entspricht dem griechischen Bild unmittelbar und ist im Deutschen als konkrete wie übertragene Bezeichnung geläufig.
- source_word: σαπρός
  choice: faul
  rationale: »Faul« gibt den anschaulichen Sinn von Verdorbenheit bei Baum und Frucht wieder. Der weitere Bedeutungsbereich bis hin zu »schlecht« oder »unbrauchbar« wird in einer Fußnote kenntlich gemacht.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: denn an seiner Frucht
  rationale: »Denn« gibt die begründende Funktion von γάρ wieder; »an seiner Frucht« ist eine natürliche deutsche Wiedergabe des erkennenden Schlusses aus der Frucht.
- source_word: γινώσκεται
  choice: wird ... erkannt
  rationale: Die Form bewahrt das Präsens Passiv und gibt den Sinn prägnant und idiomatisch wieder.
- source_word: αὐτοῦ
  choice: seine / seiner
  rationale: Das Pronomen wird entsprechend seinem Bezug auf »Baum« im Deutschen mit dem passenden Genus wiedergegeben.
theological_decisions:
- issue: Aussagekraft der Imperative im Gleichniswort Jesu
  choice: Die beiden Imperative werden direkt mit »macht« wiedergegeben.
  alternative: »Haltet entweder den Baum für gut ...« oder »Erweist entweder den Baum als gut ...«
  rationale: Das Griechische verwendet zweimal einen Aoristimperativ. Die direkte Wiedergabe wahrt die rhetorische Schärfe und lässt offen, ob »machen«, »einstufen« oder »als etwas erweisen« gemeint ist, statt diese Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der bewusst auffällige Imperativ »macht den Baum gut« bleibt wegen der Form und Spannung des Ausgangstextes erhalten; die mögliche rhetorische Bedeutung wird in der Fußnote erläutert.
