  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: de
  text: Dann wurde ein Mann zu ihm gebracht, der von einem Dämon besessen, blind und stumm[a] war. Und er heilte ihn, sodass der Stumme sprach und sah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „taub“. Das griechische Wort kann einen tauben oder einen stummen Menschen bezeichnen. Hier legt der Zusammenhang „stumm“ nahe, weil es anschließend heißt, dass der Mann sprach und sah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Natürlicher zeitlicher Erzählanschluss, der die Abfolge des Geschehens wiedergibt.
- source_word: προσηνέχθη αὐτῷ
  choice: wurde zu ihm gebracht
  rationale: Das Passiv bewahrt, dass der griechische Text die handelnden Personen nicht nennt.
- source_word: δαιμονιζόμενος
  choice: von einem Dämon besessen
  rationale: Gibt die ausdrücklich dämonische Ursache der Not natürlich und ohne Abschwächung wieder.
- source_word: τυφλὸς
  choice: blind
  rationale: Direkte und eindeutige deutsche Entsprechung.
- source_word: κωφός
  choice: stumm
  rationale: κωφός kann Taubheit oder fehlendes Sprachvermögen bezeichnen; weil die Heilungsfolge das Sprechen und Sehen nennt, ist hier „stumm“ kontextuell naheliegend.
- source_word: ἐθεράπευσεν αὐτόν
  choice: er heilte ihn
  rationale: „Heilen“ ist in diesem Wunderbericht die natürliche und sachlich genaue Wiedergabe.
- source_word: ὥστε
  choice: sodass
  rationale: Kennzeichnet knapp und idiomatisch das Ergebnis der Heilung.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: der Stumme sprach und sah
  rationale: Die substantivierte Bezeichnung und die beiden parallelen Infinitive werden prägnant als Ergebnissatz wiedergegeben.
theological_decisions:
- issue: Art der dämonischen Bedrängnis
  choice: Die ausdrückliche Aussage „von einem Dämon besessen“ bleibt erhalten.
  alternative: „dämonisch bedrängt“, „unter der Macht eines Dämons“ oder eine moderne klinische Deutung
  rationale: Der griechische Text nennt ausdrücklich dämonische Einwirkung. Eine Verallgemeinerung oder psychologisierende Umdeutung würde diese Aussage abschwächen.
- issue: Bedeutung von κωφός im Kontext
  choice: „stumm“ im Haupttext, mit Hinweis auf „taub“ als lexikalische Alternative
  alternative: „taub“ oder „taubstumm“
  rationale: Die Ergebnisformulierung nennt wiederhergestelltes Sprechen und Sehen, nicht Hören. Dennoch wird die echte Bedeutungsbreite des griechischen Wortes in der Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau bleibt nah an der griechischen Ereignisfolge, wird aber für natürliches Deutsch leicht umgestellt. Die knappe Bezeichnung „der Stumme“ vermeidet eine schwerfällige Wiederholung.
