id: MAT.12.15
reference: Matthew 12:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: de
  text: Doch Jesus erkannte dies[a] und zog sich von dort zurück. Viele folgten ihm, und er heilte sie alle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Doch Jesus erfuhr davon und zog sich von dort zurück.“ Im Griechischen bleibt unausgesprochen, was Jesus erkannte; aus dem vorherigen Vers ergibt sich der Plan der Pharisäer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: erkannte dies
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Wahrnehmung. „Dies“ nimmt natürlich auf den Mordplan der Pharisäer im vorherigen Vers Bezug, ohne den im Griechischen unausgesprochenen Gegenstand weiter auszudeuten.
- source_word: ἀνεχώρησεν
  choice: zog sich zurück
  rationale: ἀναχωρέω bezeichnet hier mehr als ein neutrales Weggehen und bewahrt den matthäischen Gedanken eines gezielten Rückzugs angesichts von Widerstand.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Die knappe Ortsangabe gibt die Bewegung weg von dem zuvor genannten Ort idiomatisch wieder.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Viele folgten ihm
  rationale: πολλοί bedeutet schlicht „viele“; der Text bezeichnet sie nicht ausdrücklich als Volksmenge.
- source_word: ἐθεράπευσεν
  choice: heilte
  rationale: θεραπεύω bezeichnet in diesem Evangelienkontext die Heilung von Kranken; „heilte“ ist die klare und übliche deutsche Entsprechung.
- source_word: αὐτοὺς πάντας
  choice: sie alle
  rationale: Die Formulierung erhält die umfassende Aussage von πάντας in natürlichem Deutsch.
theological_decisions:
- issue: Unausgesprochener Gegenstand von γνοὺς
  choice: „erkannte dies“, mit Rückbezug auf den im vorherigen Vers berichteten Plan
  alternative: „erkannte es“ oder „erfuhr davon“
  rationale: Im Griechischen steht kein ausdrückliches Objekt. „Dies“ stellt den sachlich naheliegenden Zusammenhang her, ohne genauer festzulegen, auf welche Weise Jesus davon Kenntnis erhielt.
- issue: Bedeutungsnuance von Jesu Fortgehen
  choice: „zog sich zurück“
  alternative: „ging weg“ oder „verließ den Ort“
  rationale: Die Übersetzung bewahrt die Reaktion auf die vorausgehende Feindseligkeit, ohne Angst oder Feigheit als Motiv in den Text hineinzulesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. „Doch“ gibt den weiterführend-kontrastiven Wert von δέ idiomatisch wieder; die Satzteilung folgt dem natürlichen deutschen Erzählrhythmus.
