  source_fidelity: Der Text gibt die Struktur und den Sinn des griechischen Verses präzise wieder. „erkannte dies“ wahrt den im Griechischen unausgedrückten Gegenstand von γνοὺς und stellt lediglich den klaren Rückbezug zum vorherigen Vers her. „zog sich von dort zurück“ trifft ἀνεχώρησεν ἐκεῖθεν angemessen; „Viele folgten ihm“ und „er heilte sie alle“ entsprechen πολλοί, ἠκολούθησαν αὐτῷ und αὐτοὺς πάντας ohne Übertragung zu „Volksmengen“ oder eine Einschränkung der Heilung.
