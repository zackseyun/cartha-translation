  terminology: „Jesus“, „heilte“ und „zog sich zurück“ sind terminologisch passend. Die Formulierung vermeidet eine theologische oder psychologische Deutung des Rückzugs. Die Fußnote erläutert die Ellipse sachlich und korrekt.
