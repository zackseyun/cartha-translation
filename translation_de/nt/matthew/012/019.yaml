id: MAT.12.19
reference: Matthew 12:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: de
  text: Er wird weder streiten noch laut rufen, und niemand wird auf den Straßen seine Stimme hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird weder hadern noch schreien, und niemand wird auf den öffentlichen Plätzen seine Stimme hören.“'
    reason: Lexikalische Alternativen für ἐρίσει, κραυγάσει und πλατείαι werden bewahrt.
lexical_decisions:
- source_word: ἐρίσει
  choice: wird streiten
  rationale: ἐρίζω bezeichnet streitendes oder zänkisches Auftreten. „Streiten“ ist gegenwärtiges, natürliches Deutsch und beschreibt hier die nicht-konfrontative Haltung des Gottesknechts, ohne jede Auseinandersetzung grundsätzlich auszuschließen.
- source_word: κραυγάσει
  choice: wird laut rufen
  rationale: κραυγάζω bezeichnet lautes Rufen oder Schreien. „Laut rufen“ bewahrt den Gedanken öffentlicher Lautstärke, ohne durch „schreien“ unnötig Aggressivität oder Verzweiflung anzudeuten.
- source_word: ἀκούσει τις
  choice: niemand wird … hören
  rationale: Die Verbindung von οὐδέ mit dem Indefinitpronomen τις wird im Deutschen idiomatisch als „niemand“ wiedergegeben und behält die fortgesetzte Verneinung bei.
- source_word: ἐν ταῖς πλατείαις
  choice: auf den Straßen
  rationale: πλατεῖαι bezeichnet breite Straßen oder öffentliche Verkehrsflächen. „Auf den Straßen“ ist im Deutschen die natürliche Ortsangabe und vermittelt den öffentlichen Raum; „auf den öffentlichen Plätzen“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: φωνὴν αὐτοῦ
  choice: seine Stimme
  rationale: φωνή bedeutet hier eindeutig die menschliche Stimme. Die possessive Wortgruppe wird direkt und natürlich wiedergegeben.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: weder … noch …, und niemand …
  rationale: Diese deutsche Struktur erhält die kumulative dreifache Verneinung, ohne die Syntax unnatürlich eng nachzubilden.
theological_decisions:
- issue: Bezug auf das Gottesknechtslied und Darstellung des Messias
  choice: Der Vers beschreibt den Messias als nicht streitsüchtig und nicht auf lautstarke öffentliche Selbstdarstellung bedacht.
  alternative: 'Eine stärker formale Wiedergabe könnte lauten: „Er wird weder hadern noch schreien.“'
  rationale: Das Zitat aus Jesaja 42,2 charakterisiert Jesu Auftreten. Die Formulierung darf weder völliges Schweigen noch absolute Passivität behaupten, da der Vers seine Art des öffentlichen Auftretens beschreibt, nicht ein Verbot jeder öffentlichen Rede.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Laut rufen“ vermeidet das leicht aggressive oder verzweifelte Klangbild von „schreien“. Die Fußnote dokumentiert die enger formalen Alternativen.
