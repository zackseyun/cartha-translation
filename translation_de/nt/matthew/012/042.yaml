id: MAT.12.42
reference: Matthew 12:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: de
  text: 'Die Königin des Südens[b] wird beim Gericht zusammen mit dieser Generation auferstehen[a] und sie verurteilen, denn sie kam von den Enden der Erde, um die Weisheit Salomos zu hören. Und seht: Hier ist etwas Größeres als Salomo.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird beim Gericht zusammen mit dieser Generation auferweckt werden«. Das griechische Verb steht im Passiv und kann auch »wird auferweckt werden« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Die »Königin des Südens« ist eine Anspielung auf die Königin von Saba (1. Könige 10,1–13; 2. Chronik 9,1–12); im griechischen Text wird Saba jedoch nicht ausdrücklich genannt.
    reason: cross_reference
  - marker: c
    text: Sinngemäß kann auch »einer, der größer ist als Salomo« verstanden werden; im Griechischen steht eine sächliche Form.
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: die Königin des Südens
  rationale: Gibt die Genitivverbindung unmittelbar wieder und vermeidet es, die im griechischen Text nicht ausdrücklich genannte Königin von Saba in den Haupttext einzutragen.
- source_word: ἐγερθήσεται
  choice: wird … auferstehen
  rationale: Der Kontext des endzeitlichen Gerichts legt die Auferstehungsbedeutung nahe; die passive griechische Form kann zugleich als »wird auferweckt werden« verstanden werden.
- source_word: ἐν τῇ κρίσει
  choice: beim Gericht
  rationale: Natürliches modernes Deutsch für das bestimmte endzeitliche Gericht.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: zusammen mit dieser Generation
  rationale: Bewahrt die gewöhnliche Bedeutung von μετά mit Genitiv als »mit«; die Gegnerschaft wird erst durch »verurteilen« ausgedrückt.
- source_word: κατακρινεῖ αὐτήν
  choice: wird sie verurteilen
  rationale: Das Pronomen bezieht sich grammatisch eindeutig auf die feminine »Generation«; »verurteilen« gibt κατακρίνω präzise wieder.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: von den Enden der Erde
  rationale: Bewahrt das Bild für eine äußerst weite Entfernung.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: um die Weisheit Salomos zu hören
  rationale: Gibt den finalen Infinitiv und die Genitivverbindung direkt und verständlich wieder.
- source_word: ἰδοὺ
  choice: Und seht
  rationale: Ein gegenwärtiger, würdevoller Aufmerksamkeitsruf, der die emphatische Funktion von ἰδού erhält.
- source_word: πλεῖον Σολομῶνος
  choice: etwas Größeres als Salomo
  rationale: Das substantivierte Neutrum πλεῖον wird als »etwas Größeres« bewahrt, ohne die Aussage vorschnell auf eine rein maskuline Personenbezeichnung festzulegen.
- source_word: ὧδε
  choice: Hier ist
  rationale: Idiomatiche deutsche Wiedergabe der Ortsangabe mit dem im Griechischen unausgesprochenen Kopulaverb.
theological_decisions:
- issue: Bedeutung der Passivform ἐγερθήσεται im Gerichtskontext
  choice: wird … auferstehen
  alternative: wird … auferweckt werden / wird sich erheben
  rationale: Die Gerichtsszene weist auf die Auferstehung hin. Die aktive deutsche Form ist idiomatisch, während eine Fußnote die grammatisch mögliche passive Nuance offenhält.
- issue: Bezug des substantivierten Neutrums πλεῖον auf Jesus
  choice: etwas Größeres als Salomo
  alternative: einer, der größer ist als Salomo
  rationale: 'Die neutrale Form erhält die grammatische Eigenart und die theologische Weite der Aussage: Gemeint ist die in Jesus und seinem Wirken gegenwärtige überragende Größe, ohne dies im Wortlaut enger festzulegen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Und seht« hält den feierlichen Nachdruck von ἰδού aufrecht, ohne das heute altertümliche »siehe« zu verwenden. Die Satzstruktur bleibt nah am griechischen Gedankengang und ist zugleich gut vorlesbar.
