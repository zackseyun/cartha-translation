  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: de
  text: 'Ich sage euch aber: Für jedes leichtfertige Wort[a], das die Menschen sagen werden, werden sie am Tag des Gerichts Rechenschaft ablegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „müßiges“ oder „unnützes Wort“. Das griechische Adjektiv kann „müßig“, „unproduktiv“ oder „unnütz“ und im Zusammenhang mit Rede „leichtfertig“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ich sage euch aber
  rationale: Das Präsens und die direkte Anrede werden unmittelbar wiedergegeben. Das nachgestellte „aber“ bildet den leicht kontrastierenden bzw. weiterführenden Charakter von δέ im Deutschen natürlich ab.
- source_word: πᾶν ῥῆμα
  choice: jedes ... Wort
  rationale: πᾶν ist beim singularischen Substantiv distributiv. „Wort“ bezeichnet hier idiomatisch eine gesprochene Äußerung.
- source_word: ἀργόν
  choice: leichtfertig
  rationale: Das Adjektiv kann untätig, unproduktiv, unnütz oder verantwortungslos bedeuten. „Leichtfertig“ vermittelt im Gerichtskontext verantwortungsloses Reden, ohne den Ausdruck auf ausdrücklich bösartige Worte zu verengen.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: das die Menschen reden
  rationale: Der griechische Futur steht in einer allgemein gehaltenen Warnung; im Deutschen ist dafür das Präsens natürlich. „Die Menschen“ gibt οἱ ἄνθρωποι generisch und geschlechtsübergreifend wieder.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: werden sie ... Rechenschaft ablegen
  rationale: ἀποδίδωμι mit λόγον ist eine feste Wendung für das Ablegen von Rechenschaft. Die vorangestellte Formulierung „für jedes ... Wort“ nimmt περὶ αὐτοῦ auf und vermeidet eine schwerfällige Wiederholung.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: am Tag des Gerichts
  rationale: Die Zeitangabe mit ἐν wird im Deutschen idiomatisch mit „am“ wiedergegeben. κρίσις bezeichnet hier das richterliche Gericht.
theological_decisions:
- issue: Moralische Tragweite von ἀργόν
  choice: „leichtfertig“ als Bezeichnung verantwortungslosen Redens
  alternative: „müßig“, „unnütz“ oder „unbedacht“
  rationale: Der Gerichtskontext verleiht dem Ausdruck ethisches Gewicht. „Leichtfertig“ bewahrt dieses Gewicht, ohne zu behaupten, jedes gemeinte Wort sei bewusst bösartig.
- issue: Reichweite von οἱ ἄνθρωποι
  choice: generisch „die Menschen“
  alternative: „die Männer“ oder unpersönlich „man“
  rationale: Gemeint sind Menschen allgemein, nicht ausschließlich männliche Personen. Die substantivische Form bewahrt zugleich das ausdrücklich genannte Subjekt.
- issue: Bezug von περὶ αὐτοῦ
  choice: durch „für jedes ... Wort“ in die deutsche Satzstruktur aufgenommen
  alternative: „darüber/dafür Rechenschaft ablegen“
  rationale: Der Einzelbezug auf jedes Wort bleibt erhalten, während eine im Deutschen redundante Wiederaufnahme vermieden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etablierte Wendung „Rechenschaft ablegen“ bewahrt den gerichtlichen Ernst; „leichtfertig“ ist verständlich und lässt die Bedeutungsbreite des griechischen Ausdrucks durch die Fußnote erkennen.
