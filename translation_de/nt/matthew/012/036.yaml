    rationale: „Sagen“ ist die übliche moderne deutsche Verbindung mit „Wort“ und gibt λαλέω in diesem Kontext angemessen wieder.
  - severity: low
    issue: Die Fußnote nennt „untätig“ als Bedeutung eines Wortes.
    rationale: „Untätig“ ist im Deutschen für ein Wort nicht idiomatisch. „Müßig“, „unnütz“ oder „nutzlos“ geben die lexikalische Spannweite verständlicher wieder.
