id: MAT.12.18
reference: Matthew 12:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: de
  text: Siehe, mein Diener, den ich erwählt habe, mein Geliebter, an dem meine Seele Gefallen gefunden hat! Ich werde meinen Geist auf ihn legen, und er wird den Völkern das Recht[a] verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den feierlichen, Aufmerksamkeit weckenden Ton des prophetischen Zitats und ist im Deutschen trotz erhöhten Registers verständlich.
- source_word: παῖς
  choice: Diener
  rationale: Im Zusammenhang des Jesaja-Zitats bezeichnet das Wort den Knecht beziehungsweise Diener Gottes; „Diener“ gibt dies in heutigem Deutsch würdig wieder, ohne hier ausdrücklich Sohnschaft einzutragen.
- source_word: ᾑρέτισα
  choice: den ich erwählt habe
  rationale: Das Perfekt formuliert die vollzogene göttliche Wahl idiomatisch und bewahrt das gehobene Register.
- source_word: ἀγαπητός
  choice: mein Geliebter
  rationale: Gibt die besondere Liebe und Wertschätzung in der direkten Rede Gottes knapp und würdig wieder.
- source_word: εἰς ὃν
  choice: an dem
  rationale: Mit „Gefallen finden“ ist „an dem“ die natürliche deutsche Entsprechung des griechischen Idioms.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: an dem meine Seele Gefallen gefunden hat
  rationale: Bewahrt die ausdrücklich genannte „Seele“ und die abgeschlossene verbale Form, ohne den Ausdruck zu einem bloßen „der mir gefällt“ abzuflachen.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Ich werde meinen Geist auf ihn legen
  rationale: Folgt dem Bild der prophetischen Beauftragung eng und bleibt zugleich natürlich verständlich. „Geist“ wird als Gottes Geist großgeschrieben.
- source_word: κρίσιν
  choice: das Recht
  rationale: „Das Recht“ bezeichnet hier Gottes gerechte Ordnung, die der Diener zu den Völkern bringt beziehungsweise ihnen verkündet. Es wahrt zugleich die Nähe zur Sprache des Jesaja-Zitats; die mögliche Wiedergabe „Gericht“ wird in der Fußnote genannt.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: Gibt die universale Reichweite des prophetischen Zitats wieder. Je nach Kontext kann das Wort auch die Nichtjuden bezeichnen.
- source_word: ἀπαγγελεῖ
  choice: wird verkünden
  rationale: Drückt die öffentliche, autoritative Bekanntmachung angemessen aus.
theological_decisions:
- issue: Die Identität des παῖς im messianischen Jesaja-Zitat
  choice: Diener
  alternative: Kind; Sohn; Knecht
  rationale: Der unmittelbare intertextuelle Zusammenhang ist das Gottesknecht-Motiv aus Jesaja. „Diener“ erhält diese Funktion, ist moderner als „Knecht“ und importiert aus diesem einzelnen Wort keine ausdrückliche Aussage über Sohnschaft.
- issue: Die Bedeutung von κρίσις im Auftrag an die Völker
  choice: das Recht
  alternative: das Gericht; Gerechtigkeit
  rationale: Im Jesaja-Kontext geht es um die öffentliche Durchsetzung beziehungsweise Bekanntmachung der gerechten Ordnung Gottes. „Recht“ bewahrt die Spannung zwischen gerechter Ordnung und richterlichem Handeln; „Gericht“ bleibt als echte lexikalische Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht erhöhtem prophetischem Ton. „Siehe“ und „meine Seele“ bewahren die markante Form des Zitats; „Diener“ vermeidet das heute leicht missverständliche oder altertümliche „Knecht“. Der Fußnotenmarker [a] steht unmittelbar beim betreffenden Ausdruck.
