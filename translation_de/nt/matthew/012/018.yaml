  source_fidelity: 'Die Übersetzung bildet die griechische Struktur und Aussage zuverlässig ab: Ἰδοὺ ist angemessen als „Siehe“ wiedergegeben, παῖς im Jesaja-Gottesknechtkontext als „Diener“, und die explizite Formulierung „meine Seele“ bleibt erhalten. „Ich werde meinen Geist auf ihn legen“ gibt θήσω ... ἐπ’ αὐτόν treffend wieder. „Den Völkern das Recht verkünden“ ist eine plausible und kontextgerechte Wiedergabe von κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.'
