  terminology: '„Diener“ wahrt das Gottesknechtmotiv ohne eine nicht im Wort selbst enthaltene Sohnschaftsbezeichnung einzutragen. „Geist“ ist in diesem Kontext angemessen großgeschrieben. „Das Recht“ gibt κρίσις im Jesaja-Kontext gut wieder; die Fußnote „Oder: das Gericht“ bewahrt die relevante lexikalische Alternative. Der Marker steht korrekt beim betroffenen Ausdruck.'
