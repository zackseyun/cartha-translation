id: MAT.12.13
reference: Matthew 12:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: de
  text: 'Dann sagt er zu dem Mann: „Streck deine Hand aus!“ Er streckte sie aus, und sie wurde wieder gesund[a] wie die andere[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sie wurde wiederhergestellt, gesund“. Das griechische Verb betont die Wiederherstellung des richtigen Zustands.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die andere Hand des Mannes.
    reason: clarification
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Kennzeichnet die zeitliche Abfolge der Erzählung knapp und natürlich.
- source_word: λέγει
  choice: sagt er
  rationale: Bewahrt das historische Präsens und damit die lebendige Erzählweise des griechischen Textes.
- source_word: τῷ ἀνθρώπῳ
  choice: zu dem Mann
  rationale: Im Zusammenhang bezeichnet ἄνθρωπος einen bestimmten männlichen Menschen.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: Streck deine Hand aus!
  rationale: Gibt den direkten Imperativ idiomatisch wieder; χείρ bezeichnet hier die Hand.
- source_word: ἐξέτεινεν
  choice: Er streckte sie aus
  rationale: Spiegelt die Wiederholung des Verbs in Befehl und Reaktion; das Pronomen wird im Deutschen zur Klarheit ergänzt.
- source_word: ἀπεκατεστάθη ὑγιὴς
  choice: sie wurde wieder gesund
  rationale: Natürliches modernes Deutsch, das sowohl die Wiederherstellung als auch den ausdrücklich genannten gesunden Zustand wiedergibt.
- source_word: ὡς ἡ ἄλλη
  choice: wie die andere
  rationale: Das feminine ἡ ἄλλη verweist auf die andere Hand; die im Griechischen vorhandene Ellipse bleibt erhalten.
theological_decisions:
- issue: Beschreibung der Heilung
  choice: Die Hand wurde wieder gesund
  alternative: Die Hand wurde wiederhergestellt / geheilt
  rationale: Die Formulierung berichtet das Wunder ohne zusätzliche dogmatische Deutung und vereint den Wiederherstellungsaspekt von ἀποκαθίστημι mit ὑγιής.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Das historische Präsens wurde bewahrt; die knappe Erzählweise und die elliptische Bezugnahme auf die andere Hand bleiben erhalten.
