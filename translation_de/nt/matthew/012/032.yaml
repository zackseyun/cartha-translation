id: MAT.12.32
reference: Matthew 12:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: de
  text: Und wer ein Wort gegen den Menschensohn sagt, dem wird vergeben werden. Wer aber gegen den Heiligen Geist spricht, dem wird nicht vergeben werden – weder in diesem Zeitalter noch im kommenden Zeitalter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird αἰών hier auch mit „Welt“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: wer …; wer aber
  rationale: Die Verbindung des Relativpronomens mit ἐάν bzw. ἄν bezeichnet einen offenen allgemeinen Fall. Die deutsche Konstruktion „wer …, dem …“ gibt dies natürlich und präzise wieder.
- source_word: εἴπῃ λόγον
  choice: ein Wort … sagt
  rationale: Die Wendung bewahrt λόγον ausdrücklich und ist im Deutschen idiomatisch; im zweiten Satz wird das alleinstehende εἴπῃ zur Vermeidung einer unnatürlichen Ergänzung mit „spricht“ wiedergegeben.
- source_word: κατὰ
  choice: gegen
  rationale: κατά mit Genitiv bezeichnet hier feindselig gegen jemanden gerichtetes Reden. „gegen“ ist in beiden Satzteilen die klare und sachgerechte Entsprechung.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: „Menschensohn“ ist die etablierte deutsche Wiedergabe dieser Selbstbezeichnung und bewahrt ihre biblischen sowie messianisch-apokalyptischen Bezüge.
- source_word: ἀφεθήσεται αὐτῷ
  choice: dem wird vergeben werden
  rationale: Die unpersönliche Passivkonstruktion erhält den Fokus auf der Vergebung, ohne ein handelndes Subjekt hinzuzufügen. Das Korrelat „dem“ entspricht αὐτῷ in natürlichem Deutsch.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: den Heiligen Geist
  rationale: Dies ist die übliche moderne deutsche Bezeichnung und gibt das griechische substantivische Gefüge angemessen wieder.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: weder in diesem Zeitalter
  rationale: αἰών bezeichnet hier angesichts des Gegensatzes zum kommenden αἰών eine Zeitordnung beziehungsweise ein Zeitalter, nicht primär die räumliche Welt.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: noch im kommenden
  rationale: Das substantivierte μέλλοντι ist elliptisch und nimmt αἰῶνι aus dem vorigen Satzteil auf. Im Deutschen bleibt diese Ellipse durch das substantivierte Adjektiv „im kommenden“ verständlich erhalten.
theological_decisions:
- issue: Zeitlicher Gegensatz zwischen αἰών und μέλλων
  choice: weder in diesem Zeitalter noch im kommenden
  alternative: weder in dieser Welt noch in der zukünftigen Welt; weder in diesem Zeitalter noch im kommenden Zeitalter
  rationale: Die Formulierung bewahrt den eschatologischen Gegensatz zwischen gegenwärtigem und kommendem Zeitalter, ohne daraus räumlich getrennte „Welten“ zu machen. Zugleich bleibt die griechische Ellipse im zweiten Glied erhalten.
- issue: Wesen der nicht vergebbaren Verfehlung
  choice: Die Warnung wird ohne nachträgliche dogmatische Definition wiedergegeben.
  alternative: Die Verfehlung ausschließlich als eine historische Anschuldigung gegen Jesu Wirken oder allgemein als endgültige Unbußfertigkeit bestimmen.
  rationale: Der Vers spricht vom Reden gegen den Heiligen Geist und nennt dessen Folge, definiert die Verfehlung hier aber nicht mit späterer theologischer Präzision. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur und der feierliche Warncharakter bleiben erhalten. „Menschensohn“ und „Heiliger Geist“ folgen dem etablierten biblischen Sprachgebrauch; „Zeitalter“ vermeidet die sachlich missverständliche räumliche Lesart von „Welt“.
