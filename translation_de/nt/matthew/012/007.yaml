id: MAT.12.7
reference: Matthew 12:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: de
  text: 'Wenn ihr aber erkannt hättet, was das bedeutet: »Barmherzigkeit will ich und nicht Opfer«,[a] dann hättet ihr die Schuldlosen[b] nicht verurteilt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus zitiert Hosea 6,6.
    reason: cross_reference
  - marker: b
    text: 'Oder: »die Unschuldigen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: ihr erkannt hättet
  rationale: Der Irrealis der Vergangenheit verlangt im Deutschen eine entsprechende Form; »erkannt« bezeichnet hier das verstehende Erfassen der Schriftstelle.
- source_word: τί ἐστιν
  choice: was das bedeutet
  rationale: Diese idiomatische Wiedergabe macht deutlich, dass Jesus nach dem Sinn des Zitats fragt, nicht nach einer bloßen Identifikation.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: »Barmherzigkeit« gibt den griechischen Begriff im Kontext des Hosea-Zitats würdig und verständlich wieder, ohne ihn auf bloßes Mitleid zu verengen.
- source_word: θέλω
  choice: will ich
  rationale: Die Wortstellung »Barmherzigkeit will ich« bewahrt die Hervorhebung des griechischen Zitats und klingt zugleich wie ein prägnantes Schriftwort.
- source_word: θυσίαν
  choice: Opfer
  rationale: »Opfer« ist die natürliche knappe Entsprechung und bewahrt den prophetischen Gegensatz ohne erklärende Erweiterung.
- source_word: κατεδικάσατε
  choice: hättet ... nicht verurteilt
  rationale: Diese Form bildet die irreale Folge der vergangenen Bedingung ab; »verurteilt« bewahrt den gerichtlichen Sinn des Verbs.
- source_word: ἀναιτίους
  choice: die Schuldlosen
  rationale: »Die Schuldlosen« erhält den forensischen Bezug zum Verb »verurteilen«; »die Unschuldigen« bleibt als natürliche Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Prophetischer Vorrang der Barmherzigkeit gegenüber dem Opfer im Zitat aus Hosea 6,6
  choice: »Barmherzigkeit will ich und nicht Opfer«
  alternative: »Barmherzigkeit will ich, nicht Opfer«
  rationale: Das explizite »und nicht« folgt der griechischen Form und erhält den scharfen prophetischen Gegensatz, ohne daraus über den unmittelbaren Zusammenhang hinaus eine grundsätzliche Aufhebung jedes Opfers abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der irreale Bedingungssatz wird natürlich mit Konjunktiv II der Vergangenheit wiedergegeben. Das Schriftzitat behält durch die vorangestellte »Barmherzigkeit« seine rhetorische Zuspitzung.
