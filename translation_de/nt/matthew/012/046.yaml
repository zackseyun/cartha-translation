  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: de
  text: Während er noch zu den Menschenmengen redete, siehe, da standen seine Mutter und seine Brüder[a] draußen und wollten mit ihm sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Geschwister“; ἀδελφοί ist hier ein maskuliner Plural und kann je nach Zusammenhang auch Verwandte bezeichnen. Im Haupttext steht daher „Brüder“, ohne das genaue Verwandtschaftsverhältnis näher festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Während er noch ... redete
  rationale: Die Genitivus-abs.-Konstruktion bezeichnet eine gleichzeitig andauernde Handlung; ἔτι wird mit „noch“ wiedergegeben, während δέ als leichter Erzählübergang im Deutschen nicht eigens markiert werden muss.
- source_word: τοῖς ὄχλοις
  choice: zu den Menschenmengen
  rationale: Bewahrt den Plural von ὄχλοις und ist im modernen Deutsch verständlicher als „Volksscharen“.
- source_word: ἰδοὺ
  choice: siehe, da
  rationale: Gibt den aufmerksamkeitslenkenden, lebhaften Erzählmarker wieder; „da“ bindet die folgende Szene zugleich natürlich in den deutschen Satz ein.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: seine Mutter und seine Brüder
  rationale: Das Possessivpronomen wird idiomatisch auf beide Familienbezeichnungen bezogen. ἀδελφοί ist maskuliner Plural und wird an der Textoberfläche mit „Brüder“ wiedergegeben.
- source_word: εἱστήκεισαν ἔξω
  choice: standen ... draußen
  rationale: Die statische Bedeutung der Form von ἵστημι wird natürlich mit „standen“ ausgedrückt; „draußen“ fügt keinen im Vers ungenannten Ort hinzu.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: wollten mit ihm sprechen
  rationale: ζητέω mit Infinitiv bezeichnet hier das zielgerichtete Bestreben. „Wollten“ ist in diesem Zusammenhang natürlich; „mit ihm sprechen“ gibt den Dativ αὐτῷ idiomatisch wieder, ohne den Gesprächsinhalt festzulegen.
theological_decisions:
- issue: Verwandtschaftsbezeichnung ἀδελφοί für Jesu Familie
  choice: seine Brüder
  alternative: seine Geschwister beziehungsweise nahe männliche Verwandte
  rationale: Der maskuline griechische Plural wird formal und geschlechtsgenau mit „Brüder“ wiedergegeben. Die Übersetzung entscheidet nicht die spätere theologische Frage, in welchem genauen verwandtschaftlichen Verhältnis diese Personen zu Jesus standen; darauf weist die Fußnote hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe, da“ bewahrt die markierte Erzählwirkung von ἰδού, ohne altertümliche Satzformen zu verwenden. Der Plural „Menschenmengen“ folgt bewusst dem griechischen Text.
