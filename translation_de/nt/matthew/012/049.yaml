  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: de
  text: 'Und er streckte seine Hand nach seinen Jüngern aus und sagte: „Seht, das sind meine Mutter und meine Brüder.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht die maskuline Pluralform „Brüder“; sie wird hier nicht zu „Brüder und Schwestern“ oder „Geschwister“ erweitert.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: streckte … aus
  rationale: Das vorangestellte Aoristpartizip bezeichnet die mit dem Sagen verbundene Geste. Eine koordinierte finite Form ist im Deutschen natürlich und bewahrt die zeitliche Abfolge.
- source_word: χεῖρα
  choice: Hand
  rationale: „Hand“ ist hier die gewöhnliche und konkrete Bezeichnung für Jesu zeigende Geste.
- source_word: ἐπὶ
  choice: zu … hin
  rationale: Mit dem Akkusativ bezeichnet ἐπί hier die Richtung der ausgestreckten Hand auf die Jünger zu.
- source_word: μαθητὰς
  choice: Jünger
  rationale: „Jünger“ ist die im Evangelienkontext präzise und geläufige Wiedergabe für μαθηταί und bewahrt das Lehrer-Schüler-Verhältnis.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Die aufmerksamkeitslenkende Partikel wird in natürlichem modernem Deutsch als Aufforderung „Seht“ wiedergegeben; ihre hervorhebende Kraft bleibt erhalten.
- source_word: μήτηρ
  choice: Mutter
  rationale: Direkte Wiedergabe des gewöhnlichen Verwandtschaftsbegriffs.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der grammatisch maskuline Plural wird in diesem ausdrücklich familiären Vergleich konkret als „Brüder“ wiedergegeben, ohne ihn interpretierend zu erweitern.
theological_decisions:
- issue: Familiensprache bei Jesu Bestimmung seiner wahren Verwandtschaft
  choice: Die konkreten Begriffe „Mutter“ und „Brüder“ werden beibehalten.
  alternative: Verallgemeinerung zu „Familie“ oder Erweiterung zu „Geschwister“ beziehungsweise „Brüder und Schwestern“.
  rationale: Die Aussage setzt die Jünger pointiert mit Jesu Familienangehörigen gleich. Eine allgemeinere oder inklusive Umschreibung würde die konkrete Bildsprache verändern und mehr festlegen, als der griechische Wortlaut ausdrücklich sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverbindung bleibt schlicht und erzählerisch; „Seht“ gibt ἰδού verständlich und mit angemessenem Nachdruck wieder.
