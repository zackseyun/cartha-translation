id: MAT.12.38
reference: Matthew 12:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: de
  text: 'Da antworteten ihm einige der Schriftgelehrten und Pharisäer: »Lehrer, wir wollen von dir ein Zeichen[a] sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wunderzeichen«. Das griechische Wort kann ein Zeichen mit wunderhafter Bedeutung bezeichnen; der Haupttext behält den weiteren Ausdruck »Zeichen« bei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Leitet in der Erzählung die anschließende Reaktion ein und gibt die zeitliche Folge knapp und natürlich wieder.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: antworteten ihm
  rationale: Bewahrt die übliche Antwortformel des griechischen Erzählstils, auch wenn unmittelbar zuvor keine ausdrückliche Frage steht.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: einige der Schriftgelehrten und Pharisäer
  rationale: „Einige“ bezeichnet nur einen Teil der genannten Gruppen; „Schriftgelehrte“ und „Pharisäer“ sind präzise und im Deutschen geläufige Gruppenbezeichnungen.
- source_word: λέγοντες
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die Funktion des Partizips zur Einführung der direkten Rede wird im natürlichen Deutschen durch einen Doppelpunkt ausgedrückt; ein zusätzliches „und sagten“ wäre schwerfällig.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Gibt die Anrede ohne die stärkere und potenziell missverständliche Autoritätsnuance von „Meister“ wieder.
- source_word: θέλομεν
  choice: wir wollen
  rationale: Drückt den geäußerten Willen direkt und in modernem Standarddeutsch aus.
- source_word: ἀπὸ σοῦ
  choice: von dir
  rationale: Bewahrt die Herkunfts- beziehungsweise Urheberangabe des griechischen Ausdrucks.
- source_word: σημεῖον
  choice: Zeichen
  rationale: Bewahrt den breiten Wortsinn; im Zusammenhang kann ein übernatürliches Beglaubigungszeichen gemeint sein, ohne dass dies lexikalisch ausdrücklich festgelegt wird.
- source_word: ἰδεῖν
  choice: sehen
  rationale: Ist die direkte, uninterpretierte Wiedergabe des Infinitivs von ὁράω.
theological_decisions:
- issue: Bedeutung von σημεῖον
  choice: Zeichen
  alternative: Wunderzeichen
  rationale: Die Bitte zielt im Zusammenhang wahrscheinlich auf eine übernatürliche Beglaubigung Jesu. Da σημεῖον jedoch zunächst „Zeichen“ bedeutet, bleibt die weitere Bedeutung im Haupttext offen und wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die griechische Partizipialkonstruktion wird idiomatisch durch direkte Rede nach einem Doppelpunkt wiedergegeben; die knappe und bestimmte Forderung der Sprecher bleibt erhalten.
