  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: de
  text: 'Doch er sagte zu ihnen: „Habt ihr nicht gelesen, was David tat, als er Hunger hatte und auch seine Begleiter hungrig waren?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als er und seine Begleiter Hunger hatten?“ Im Griechischen steht das Verb „Hunger haben“ in der Einzahl und bezieht sich ausdrücklich auf David; es kann sinngemäß auch für seine Begleiter gelten.'
    reason: grammatische und lexikalische Alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Doch er
  rationale: δέ ist ein schwaches verbindendes und hier zugleich leicht entgegensetzendes Bindewort. „Doch er“ kennzeichnet Jesu Erwiderung natürlich, ohne den Gegensatz zu überbetonen.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Die einfache Wiedergabe entspricht λέγω mit dem Dativ αὐτοῖς und vermeidet die stärker deutende Formulierung „erklärte ihnen“.
- source_word: Οὐκ ἀνέγνωτε
  choice: Habt ihr nicht gelesen
  rationale: Die im Aorist formulierte rhetorische Frage verweist auf die Vertrautheit der Angesprochenen mit der Schrift. Das deutsche Perfekt gibt diese idiomatische Frage in gegenwärtigem Standarddeutsch natürlich wieder.
- source_word: τί ἐποίησεν
  choice: was … tat
  rationale: ποιέω bezeichnet hier schlicht Davids Handeln in einer vergangenen Situation.
- source_word: Δαυὶδ
  choice: David
  rationale: Übliche deutsche Namensform.
- source_word: ὅτε ἐπείνασεν
  choice: als er Hunger hatte
  rationale: πεινάω bedeutet „hungrig sein/Hunger haben“. „Hunger hatte“ ist natürlich und wahrt durch das singularische „er“ den ausdrücklichen grammatischen Bezug auf David.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: und auch seine Begleiter hungrig waren
  rationale: Wörtlich steht „und die mit ihm“. Im Zusammenhang ist das Prädikat „hungrig waren“ elliptisch mitzudenken. „Seine Begleiter“ ist im Deutschen klar und knapp; „auch“ macht die Hinzufügung kenntlich.
theological_decisions:
- issue: Bezug des Hungers auf David und seine Begleiter
  choice: Der Haupttext nennt Davids Hunger ausdrücklich und ergänzt bei seinen Begleitern das elliptisch mitverstandene „hungrig waren“.
  alternative: „als er und seine Begleiter Hunger hatten“
  rationale: Die griechische Verbform ἐπείνασεν steht im Singular und bezieht sich ausdrücklich auf David; καὶ οἱ μετ’ αὐτοῦ kann elliptisch denselben Zustand auf seine Begleiter ausdehnen. Die gewählte Form bewahrt beides, ohne die Aussage theologisch weiter festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt direkt; das Perfekt klingt gegenwärtig und natürlich. Der Gedankenstrich der englischen Beratungsebene wurde nicht übernommen, da die deutsche Wiederholung die griechische Ellipse bereits klar und flüssig ausdrückt.
