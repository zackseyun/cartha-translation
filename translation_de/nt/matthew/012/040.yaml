id: MAT.12.40
reference: Matthew 12:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: de
  text: Denn wie Jona drei Tage und drei Nächte[a] im Bauch des großen Meerestiers[b] war, so wird der Menschensohn drei Tage und drei Nächte im Herzen der Erde[c] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Drei Tage und drei Nächte“ kann als damalige inklusive Zeitangabe verstanden werden, die auch Teile von drei Tagen einschließt; andere verstehen die Formulierung strenger.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „des großen Fisches“. Das griechische Wort bezeichnet allgemein ein großes Meerestier und ist nicht auf eine bestimmte Tierart festgelegt.'
    reason: lexical_alternative
  - marker: c
    text: „Im Herzen der Erde“ kann sich auf das Begräbnis, das Grab, die Tiefen der Erde oder den Bereich der Toten beziehen; im Haupttext bleibt das griechische Bild erhalten.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: Gibt sowohl die begründende beziehungsweise anschließende Funktion von γάρ als auch den Vergleich durch ὥσπερ in natürlichem Deutsch wieder.
- source_word: Ἰωνᾶς
  choice: Jona
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: ἐν τῇ κοιλίᾳ
  choice: im Bauch
  rationale: κοιλία bezeichnet hier natürlich den Bauch beziehungsweise Leib; „im Bauch“ ist klar, würdig und entspricht dem erzählerischen Bezug.
- source_word: τοῦ κήτους
  choice: des großen Meerestiers
  rationale: κῆτος bezeichnet ein großes Meerestier und ist zoologisch weiter als „Fisch“. „Groß“ bringt die im Substantiv liegende Größenvorstellung idiomatisch zum Ausdruck.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: drei Tage und drei Nächte
  rationale: Gibt die ausdrücklich wiederholte Zeitangabe unmittelbar wieder, ohne ihre chronologische Tragweite auszulegen.
- source_word: οὕτως
  choice: so
  rationale: Kennzeichnet knapp und idiomatisch den zweiten Teil des Vergleichs.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Bewahrt die etablierte deutsche Wiedergabe der biblisch geprägten Selbstbezeichnung Jesu.
- source_word: ἔσται
  choice: wird … sein
  rationale: Entspricht unmittelbar dem Futur von εἰμί; eine Wiedergabe wie „bleiben“ würde eine nicht ausdrücklich bezeichnete Dauerkomponente hinzufügen.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: im Herzen der Erde
  rationale: Bewahrt das Bild von καρδία und vermeidet es, die mehrdeutige Wendung bereits im Haupttext als Grab, Tiefe oder Totenreich auszulegen.
theological_decisions:
- issue: Bedeutung von „im Herzen der Erde“
  choice: Die Metapher bleibt als „im Herzen der Erde“ erhalten.
  alternative: „im Grab“, „in den Tiefen der Erde“ oder „im Totenreich“
  rationale: Der griechische Ausdruck legt keine einzelne dieser theologischen Deutungen eindeutig fest. Die Übersetzung bewahrt daher die Spannung.
- issue: Tragweite von „drei Tage und drei Nächte“
  choice: Die Zeitangabe wird wörtlich beibehalten.
  alternative: Semitische inklusive Zählweise mit Teilen von drei Tagen oder ein streng verstandener Zeitraum von 72 Stunden
  rationale: Der Vers formuliert die Zeitangabe ausdrücklich; die Übersetzung entscheidet die daraus entstehende chronologische Debatte nicht im Haupttext.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Vergleichsstruktur und beide identischen Zeitangaben bleiben erhalten. Die Fußnoten stehen jeweils unmittelbar bei der betreffenden Wendung.
