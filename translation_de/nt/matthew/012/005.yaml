id: MAT.12.5
reference: Matthew 12:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: de
  text: Oder habt ihr nicht im Gesetz gelesen, dass die Priester an den Sabbaten im Tempel den Sabbat entheiligen[a] und ohne Schuld sind?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Sabbat verletzen« oder »übertreten«. Das griechische Verb bezeichnet das Behandeln von etwas Heiligem wie etwas Gewöhnlichem.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen »an den Sabbaten«; gemeint ist wahrscheinlich der wiederkehrende Priesterdienst an den jeweiligen Sabbattagen.
    reason: lexical_alternative
  - marker: c
    text: Mit dem »Gesetz« ist hier die mosaische Tora gemeint, wahrscheinlich insbesondere die Vorschriften über den Priesterdienst am Sabbat; vgl. 4. Mose 28,9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet ein weiteres Schriftargument in Jesu Erwiderung ein und bewahrt den knappen rhetorischen Anschluss.
- source_word: οὐκ ἀνέγνωτε
  choice: habt ihr nicht gelesen
  rationale: Entspricht der geläufigen rhetorischen Frage nach der Kenntnis der Schrift und gibt den griechischen Aorist im Deutschen idiomatisch wieder.
- source_word: ἐν τῷ νόμῳ
  choice: im Gesetz
  rationale: Bezeichnet hier das mosaische Gesetz als Teil der Schrift, nicht Gesetz im abstrakten Sinn.
- source_word: τοῖς σάββασιν
  choice: an den Sabbaten
  rationale: Bewahrt den griechischen Plural und macht deutlich, dass es um das wiederkehrende priesterliche Handeln an Sabbattagen geht.
- source_word: οἱ ἱερεῖς
  choice: die Priester
  rationale: Direkte und kontextgemäße Bezeichnung der im Tempel diensttuenden Priester.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet den Tempel beziehungsweise den Tempelbezirk; „im Tempel“ ist die natürliche deutsche Wiedergabe.
- source_word: τὸ σάββατον
  choice: den Sabbat
  rationale: Bewahrt den Singular für den Sabbat als geheiligten Tag beziehungsweise als Institution.
- source_word: βεβηλοῦσιν
  choice: entheiligen
  rationale: Gibt den Gedanken wieder, etwas Heiliges wie etwas Gewöhnliches zu behandeln, und bewahrt die zugespitzte Spannung der Aussage.
- source_word: ἀναίτιοί εἰσιν
  choice: sind ohne Schuld
  rationale: Drückt fehlende rechtliche beziehungsweise moralische Schuld klar und natürlich aus.
theological_decisions:
- issue: Ob die Aussage über das Entheiligen des Sabbats abgeschwächt werden soll
  choice: „den Sabbat entheiligen und doch ohne Schuld sind“
  alternative: „den Sabbat übertreten und dennoch unschuldig sind“
  rationale: Der griechische Text stellt das starke Verb βεβηλόω bewusst der Schuldlosigkeit gegenüber. Die Übersetzung bewahrt diese Spannung, statt sie durch eine erklärende Abschwächung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entheiligen“ erhält die kultische und rhetorische Schärfe des griechischen Verbs; „doch“ macht den im Satz angelegten Kontrast natürlich hörbar, ohne ihn theologisch aufzulösen.
