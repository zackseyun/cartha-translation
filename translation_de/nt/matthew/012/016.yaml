  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μὴ φανερὸν αὐτὸν ποιήσωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: de
  text: Und er schärfte ihnen ein, ihn nicht bekannt zu machen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er warnte sie eindringlich davor, ihn bekannt zu machen“; auch: „Und er befahl ihnen, ihn nicht bekannt zu machen“.'
    reason: lexikalische Alternative zu ἐπετίμησεν
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Erzählung weiter, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: ἐπετίμησεν
  choice: schärfte … ein
  rationale: ἐπιτιμάω bezeichnet hier angesichts des folgenden Inhaltssatzes eine nachdrückliche Weisung. „Einschärfen“ gibt deren Strenge natürlich wieder, ohne den im Deutschen stärker tadelnden Beiklang von „zurechtweisen“ zwingend einzutragen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ Plural verweist auf die im Zusammenhang angesprochenen Menschen und wird direkt wiedergegeben.
- source_word: ἵνα μὴ
  choice: … nicht
  rationale: Nach einem Verb nachdrücklicher Weisung gibt ἵνα μή mit Konjunktiv den untersagenden Inhalt wieder; die deutsche Infinitivkonstruktion ist idiomatisch.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: ihn … bekannt zu machen
  rationale: Die Wendung φανερὸν ποιέω bedeutet, jemanden bekanntzumachen beziehungsweise öffentlich offenbar werden zu lassen. Die Formulierung bewahrt αὐτόν als persönliches Objekt.
theological_decisions:
- issue: Charakter der Weisung Jesu zur Öffentlichkeit
  choice: Eine nachdrückliche Aufforderung, ihn nicht bekannt zu machen
  alternative: Eine Zurechtweisung der Angesprochenen oder ein ausdrücklicher Befehl
  rationale: Der griechische Wortlaut trägt eine strenge Weisung, legt aber weder einen vorausgehenden moralischen Fehler noch den theologischen Grund für das Schweigegebot ausdrücklich fest. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Einschärfen“ ist allgemein verständlich und bringt die Nachdrücklichkeit der Weisung zum Ausdruck; die Fußnote dokumentiert die Bandbreite zwischen eindringlicher Warnung und Befehl.
