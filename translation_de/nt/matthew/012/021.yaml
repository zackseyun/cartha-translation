  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes angemessen wieder: καὶ als anschließendes „und“, τῷ ὀνόματι αὐτοῦ als „auf seinen Namen“, ἔθνη als „die Völker“ und ἐλπιοῦσιν als zukünftiges „werden ... hoffen“. Die deutsche Präpositionalfügung bewahrt die mit dem Namen verbundene biblische Aussage, ohne sie zu einer bloßen Aussage über Ruf oder Autorität zu reduzieren.'
  naturalness: „Und auf seinen Namen werden die Völker hoffen“ ist im modernen Standarddeutsch als gehobene, zitathafte Bibelsprache klar und idiomatisch. Die Voranstellung von „auf seinen Namen“ passt zum poetisch-prophetischen Register und zum Anschluss an das vorausgehende Zitat.
  terminology: „Die Völker“ ist für ἔθνη im Rahmen des Jesaja-Zitats treffend und lässt den weiten Bezug auf die nichtisraelitischen Völker offen. Die Fußnote dokumentiert „die Heiden“ als kontextuell mögliche, traditionell belegte Alternative, ohne diese als alleinige Deutung festzulegen. „Name“ und „hoffen“ sind terminologisch konsistent und quellennah.
