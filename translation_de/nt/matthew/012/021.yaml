  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: de
  text: und auf seinen Namen werden die Völker hoffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Heiden werden auf seinen Namen hoffen.“'
    reason: Alternative Wiedergabe von ἔθνη als „Heiden“; zugleich wird die im Deutschen natürliche Satzstellung dieser Lesart gezeigt.
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die gewöhnliche koordinierende Konjunktion wird beibehalten, damit der Anschluss an das vorangehende Jesaja-Zitat sichtbar bleibt.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: auf seinen Namen
  rationale: Beim Verb ἐλπίζω bezeichnet der Dativ hier den Bezug der Hoffnung. Die im Deutschen idiomatische Wendung „auf seinen Namen hoffen“ bewahrt zugleich die biblische Bedeutung von Name als Ausdruck der Person und ihrer Autorität.
- source_word: ἔθνη
  choice: die Völker
  rationale: ἔθνη kann „Völker“ oder „Heiden“ bezeichnen. Im Horizont des Jesaja-Zitats wahrt „die Völker“ die umfassende Aussage und vermeidet eine unnötige Verengung.
- source_word: ἐλπιοῦσιν
  choice: werden hoffen
  rationale: Die Zukunftsform wird direkt wiedergegeben. „Hoffen“ entspricht dem Grundsinn von ἐλπίζω und erhält den verheißungsvollen Ton.
theological_decisions:
- issue: Wiedergabe von ἔθνη im messianischen Jesaja-Zitat
  choice: die Völker
  alternative: die Heiden
  rationale: „Die Völker“ bewahrt den alttestamentlichen Horizont der Aussage und schließt die nichtjüdischen Völker ein, ohne den Ausdruck ausschließlich als religiös-ethnische Abgrenzung zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Deutschen natürliche Verbindung lautet „auf jemanden oder seinen Namen hoffen“. Die Satzstellung bleibt möglichst quellennah, ohne unnatürlich zu wirken.
