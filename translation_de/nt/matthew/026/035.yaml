id: MAT.26.35
reference: Matthew 26:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: de
  text: 'Petrus sagte zu ihm: „Selbst wenn ich mit dir sterben muss, werde ich dich ganz gewiss nicht verleugnen.[a]“ Ebenso sagten es auch alle Jünger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich dich niemals verleugnen“. Im Griechischen steht eine besonders starke Verneinung (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens wird im modernen deutschen Erzählstil natürlich als Präteritum wiedergegeben, ohne seine Erzählfunktion zu verändern.
- source_word: Κἂν δέῃ με
  choice: Selbst wenn ich … muss
  rationale: κἄν leitet hier eine einräumende Bedingung ein, während δέῃ Notwendigkeit ausdrückt. Die Wiedergabe ist idiomatisch und bewahrt den Nachdruck.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: mit dir sterben
  rationale: Die knappe Formulierung gibt Begleitung und Todesbereitschaft unmittelbar wieder.
- source_word: οὐ μή
  choice: ganz gewiss nicht
  rationale: Die doppelte griechische Negation ist eine nachdrückliche Verneinung. „Ganz gewiss nicht“ bewahrt diese Verstärkung in natürlichem Deutsch.
- source_word: ἀπαρνήσομαι
  choice: werde ich … verleugnen
  rationale: „Verleugnen“ ist im Kontext der angekündigten Verleugnung Jesu die präzise und etablierte deutsche Entsprechung.
- source_word: ὁμοίως
  choice: Ebenso
  rationale: Das Adverb bezeichnet gleichartiges Reden oder Handeln und wird direkt sowie in würdigem Register wiedergegeben.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: sagten es auch alle Jünger
  rationale: Die Formulierung bewahrt sowohl die Gesamtheit der Jünger als auch den zusätzlichen Anschluss durch καί; „es“ verweist natürlich auf dieselbe Aussage.
theological_decisions:
- issue: Stärke der von Petrus ausgesprochenen Verneinung
  choice: „werde ich dich ganz gewiss nicht verleugnen“
  alternative: „werde ich dich niemals verleugnen“
  rationale: οὐ μή drückt eine sehr starke zukünftige Verneinung aus. „Ganz gewiss nicht“ erhält den Nachdruck und lässt zugleich die Spannung zwischen Petrus’ Selbstgewissheit und der folgenden Erzählung unaufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens wurde dem natürlichen deutschen Erzählstil entsprechend als Präteritum wiedergegeben; der nachdrückliche Charakter von Petrus’ Aussage bleibt erhalten.
