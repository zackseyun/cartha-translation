  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: de
  text: Doch nachdem ich auferweckt worden bin[a], werde ich euch nach Galiläa vorausgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem ich auferstanden bin“. Im Griechischen steht eine Passivform: „nachdem ich auferweckt worden bin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Doch nachdem
  rationale: μετά mit substantiviertem Infinitiv bezeichnet die zeitliche Folge („nachdem“); δέ stellt hier einen milden Gegensatz zur vorausgehenden Ankündigung des Versagens der Jünger her.
- source_word: τὸ ἐγερθῆναί με
  choice: ich auferweckt worden bin
  rationale: Der passive Aoristinfinitiv von ἐγείρω mit με als Akkusativsubjekt wird passiv wiedergegeben. „Auferweckt“ ist im Deutschen die natürliche Auferstehungsformulierung und lässt die im Passiv angedeutete, aber nicht ausdrücklich genannte Handlungsmacht offen.
- source_word: προάξω ὑμᾶς
  choice: werde ich euch … vorausgehen
  rationale: προάγω bedeutet hier, jemandem voraus- bzw. voranzugehen. „Euch vorausgehen“ ist idiomatisches modernes Deutsch und deutet den Ausdruck nicht unnötig als formelles Anführen.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: εἰς bezeichnet die Bewegung auf ein Ziel hin. Bei geografischen Namen ohne Artikel ist „nach Galiläa“ die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Passivische Auferstehungsformulierung in ἐγερθῆναί
  choice: „nachdem ich auferweckt worden bin“
  alternative: „nachdem ich auferstanden bin“
  rationale: Die gewählte Form bewahrt das ausdrückliche Passiv des griechischen Textes und damit dessen mögliche Andeutung göttlichen Handelns, ohne den Handelnden ausdrücklich zu benennen. Die aktive deutsche Auferstehungsformel bleibt als verständliche Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ wahrt den leichten Gegensatz; „nach Galiläa“ und „euch vorausgehen“ sind natürliche deutsche Ziel- und Richtungsangaben.
