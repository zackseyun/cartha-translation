  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: de
  text: 'Ich sage euch aber: Von jetzt an werde ich ganz gewiss nicht mehr von dieser Frucht des Weinstocks trinken, bis zu jenem Tag, an dem ich sie im Reich meines Vaters neu[a] mit euch trinken werde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Neuem“. Das griechische Adjektiv kann etwas bezeichnen, das seiner Art oder Beschaffenheit nach neu ist; die Wendung kann auch auf ein Trinken auf neue Weise im kommenden Reich hindeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ich sage euch aber
  rationale: δέ markiert hier einen leichten Gegensatz oder Übergang. Die nachgestellte Formulierung mit „aber“ ist im Deutschen natürlich und bewahrt die zurückhaltende Kontrastwirkung.
- source_word: οὐ μὴ πίω
  choice: werde ich ganz gewiss nicht mehr … trinken
  rationale: οὐ μή mit dem Aorist Konjunktiv ist eine nachdrückliche Verneinung mit Zukunftsbezug. „ganz gewiss nicht mehr“ gibt sowohl die Emphase als auch im Zusammenhang mit ἀπ’ ἄρτι das Ende des bisherigen Trinkens verständlich wieder.
- source_word: ἀπ’ ἄρτι
  choice: von jetzt an
  rationale: Die Wendung bezeichnet den gegenwärtigen Zeitpunkt als Beginn des folgenden Zeitraums.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: von dieser Frucht des Weinstocks
  rationale: γένημα bezeichnet das Erzeugnis beziehungsweise die Frucht. Die Formulierung bewahrt das Bild und die jüdische Ausdrucksweise, statt sie ausdrücklich zu „Wein“ aufzulösen.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: bis zu jenem Tag
  rationale: „jenem“ gibt den Demonstrativcharakter von ἐκείνης wieder und verweist auf einen bestimmten zukünftigen Tag.
- source_word: ὅταν αὐτὸ πίνω
  choice: an dem ich … davon trinken werde
  rationale: ὅταν mit dem Konjunktiv verweist hier auf das zukünftige Eintreten des Geschehens. „davon“ nimmt im natürlichen Deutschen die zuvor genannte Frucht des Weinstocks beziehungsweise deren Getränk wieder auf.
- source_word: καινὸν
  choice: neu
  rationale: καινός kann Neuheit der Art oder Beschaffenheit ausdrücken. „neu“ wahrt diese Offenheit; die mögliche Bedeutung „von Neuem“ wird in der Fußnote genannt.
- source_word: μεθ’ ὑμῶν
  choice: mit euch
  rationale: Die schlichte Begleitung und Gemeinschaft wird direkt und natürlich wiedergegeben.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: im Reich meines Vaters
  rationale: Die Formulierung ist quellennah, feierlich und zugleich in modernem Deutsch verständlich.
theological_decisions:
- issue: Ob der Inhalt des Kelches ausdrücklich als „Wein“ bezeichnet oder die Bildformel bewahrt wird
  choice: Die Formulierung „Frucht des Weinstocks“ bleibt im Haupttext erhalten.
  alternative: Wein
  rationale: Im Griechischen steht nicht οἶνος, sondern „Frucht/Erzeugnis des Weinstocks“. Die Beibehaltung vermeidet eine über den Wortlaut hinausgehende Festlegung und bewahrt die Bildsprache.
- issue: Bedeutung von καινὸν beim zukünftigen Trinken im Reich
  choice: „neu“ im Haupttext, ohne die Art dieser Neuheit näher zu bestimmen
  alternative: von Neuem; auf neue Weise
  rationale: Der Ausdruck kann neue Beschaffenheit, eine neue Art des Trinkens oder erneute Teilnahme andeuten. Da der Vers die Nuance nicht eindeutig festlegt, bleibt die Spannung im Haupttext erhalten und die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „ganz gewiss“ bewahrt die starke griechische Verneinung, ohne archaisch zu klingen. Die traditionelle Bildformel „Frucht des Weinstocks“ bleibt verständlich und quellennah; die Stellung der Satzglieder wurde für einen flüssigen deutschen Satz behutsam angepasst.
