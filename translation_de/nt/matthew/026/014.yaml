  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: de
  text: Da ging einer von den Zwölf, der Judas Iskariot genannt wurde, zu den Hohenpriestern
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Als temporaler Erzählanschluss führt „Da“ das nächste Geschehen natürlich und prägnant ein.
- source_word: πορευθεὶς
  choice: ging
  rationale: Das adverbiale Aoristpartizip bezeichnet die Bewegung zu den obersten Priestern; im Deutschen gibt ein finites „ging“ den Sinn natürlicher wieder als „hingegangen“.
- source_word: εἷς τῶν δώδεκα
  choice: einer von den Zwölf
  rationale: Die partitive Wendung bezeichnet einen Angehörigen des bekannten Zwölferkreises. Die Substantivierung „die Zwölf“ erfordert im Deutschen Großschreibung.
- source_word: ὁ λεγόμενος
  choice: der … genannt wurde
  rationale: Die attributive Partizipialwendung identifiziert Judas und wird in natürlichem Deutsch als Relativsatz wiedergegeben.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Judas Iskariot
  rationale: Name und Beiname werden in ihrer etablierten deutschen Form wiedergegeben.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: zu den obersten Priestern
  rationale: πρός mit Akkusativ bezeichnet die gerichtete Bewegung. „Oberste Priester“ gibt die führenden priesterlichen Amtsträger im Plural wieder und unterscheidet sie vom einzelnen Hohenpriester.
theological_decisions:
- issue: Bezeichnung des Zwölferkreises (τῶν δώδεκα)
  choice: einer von den Zwölf
  alternative: einer von den zwölf Jüngern
  rationale: Der griechische Text nennt nur „die zwölf“ und setzt den bekannten Kreis voraus. „Jünger“ wäre eine erklärende Ergänzung; „die Zwölf“ bewahrt die knappe Gruppenbezeichnung.
translation_notes:
  register: Modernes, würdiges Erzählregister. Der Vers bleibt entsprechend dem griechischen Satzbau offen und endet ohne abschließenden Punkt, da der Satz im folgenden Vers weitergeführt wird.
