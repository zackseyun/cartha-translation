  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: de
  text: Denn sie hat dieses Duftöl auf meinen Körper gegossen, um mich auf meine Bestattung vorzubereiten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für meine Bestattung“. Das griechische Verb kann die Vorbereitung eines Leichnams für die Bestattung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: indem sie … goss
  rationale: Das aoristische Partizip beschreibt hier idiomatisch das Aufgießen bzw. Auftragen des Duftöls; „indem“ bewahrt den engen sachlichen Bezug zum Hauptverb.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ leitet die Begründung bzw. Erklärung für die vorausgehende Aussage Jesu ein.
- source_word: μύρον
  choice: Duftöl
  rationale: μύρον bezeichnet ein wohlriechendes Salböl oder Parfüm; „Duftöl“ ist im Deutschen natürlich und passt zu einer ausgießbaren Flüssigkeit.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: auf meinen Körper
  rationale: ἐπί mit Genitiv bezeichnet hier das Aufbringen auf den Körper.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: um mich für die Bestattung vorzubereiten
  rationale: πρός mit substantiviertem Infinitiv drückt einen Zweck aus; ἐνταφιάζω kann die Vorbereitung eines Leichnams zur Bestattung bezeichnen.
- source_word: ἐποίησεν
  choice: hat sie es getan
  rationale: Das allgemein gebrauchte ποιέω nimmt die beschriebene Handlung wieder auf; „es“ verhindert eine unnötige Wiederholung.
- source_word: αὕτη
  choice: sie
  rationale: Das Pronomen verweist auf die bereits bekannte Frau; im natürlichen Deutschen genügt „sie“, auch wenn αὕτη wörtlicher „diese“ lautet.
theological_decisions:
- issue: Bedeutung von ἐνταφιάζω im Blick auf Jesu Tod
  choice: Die Handlung der Frau wird als Vorbereitung Jesu für die Bestattung gedeutet.
  alternative: Die Handlung geschah allgemein „für meine Bestattung“, ohne die Vorbereitung ausdrücklich zu benennen.
  rationale: Der lexikalische Sinn umfasst die Zurüstung eines Leichnams für die Bestattung. Die gewählte Fassung macht diesen Sinn deutlich, ohne über Jesu eigene Deutung hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Duftöl“ ist gegenüber „Parfüm“ sachlich passender, da die Substanz auf den Körper gegossen wird. Die etwas markierte Konstruktion „indem … hat sie es getan“ hält die participiale Struktur und den Nachdruck des griechischen Hauptverbs sichtbar.
