  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: de
  text: 'Amen, ich sage euch: Wo immer diese gute Nachricht[a] in der ganzen Welt verkündet wird, wird auch erzählt werden, was diese Frau getan hat, zu ihrem Gedenken.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dieses Evangelium.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wird auch davon gesprochen werden, was diese Frau getan hat – als Erinnerungszeichen an sie.“'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das vorangestellte ἀμήν ist eine feierliche Bekräftigungsformel Jesu. Das im Deutschen geläufige „Amen“ bewahrt Form, Würde und markante Stellung des griechischen Ausdrucks.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte und im Deutschen natürliche Wiedergabe erhält die persönliche Anrede.
- source_word: ὅπου ἐὰν
  choice: wo immer
  rationale: Die Verbindung bezeichnet einen unbestimmten Ort und wird knapp und idiomatisch mit „wo immer“ wiedergegeben.
- source_word: κηρυχθῇ
  choice: verkündet wird
  rationale: „Verkündet“ bewahrt den öffentlichen Heroldscharakter von κηρύσσω, ohne die Tätigkeit auf eine Predigt im engeren Sinn zu beschränken.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: diese gute Nachricht
  rationale: εὐαγγέλιον bezeichnet eine gute Botschaft beziehungsweise Nachricht. „Diese gute Nachricht“ ist verständlich, bildet das Demonstrativpronomen ab und vermeidet, den Ausdruck unnötig als bloßen Fachbegriff erscheinen zu lassen.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: in der ganzen Welt
  rationale: Die Formulierung entspricht dem universalen räumlichen Sinn des griechischen Ausdrucks und klingt im modernen Deutsch natürlich.
- source_word: λαληθήσεται
  choice: wird man auch davon erzählen
  rationale: Der griechische Passivsatz wird mit dem deutschen unpersönlichen „man“ idiomatisch wiedergegeben. „Davon erzählen“ passt zum Inhalt einer berichteten Tat und bewahrt den Sinn von λαλέω.
- source_word: ὃ ἐποίησεν αὕτη
  choice: was diese Frau getan hat
  rationale: Das Relativpronomen bezieht sich auf die Tat; αὕτη verweist im Kontext auf die zuvor genannte Frau. Die Ergänzung „Frau“ macht den Bezug im Deutschen klar.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: zu ihrem Gedenken
  rationale: Die Wendung bringt Zweck beziehungsweise Ergebnis des Erinnerns prägnant zum Ausdruck. Sie lässt offen, ob stärker an Erinnerung oder an ein bleibendes Erinnerungszeichen gedacht ist.
theological_decisions:
- issue: Wiedergabe von εὐαγγέλιον
  choice: gute Nachricht
  alternative: Evangelium
  rationale: „Gute Nachricht“ gibt den lexikalischen Sinn transparent und allgemein verständlich wieder; „Evangelium“ bleibt als traditionsreiche und sachlich mögliche Alternative in der Fußnote erhalten.
- issue: Bezug von εἰς μνημόσυνον αὐτῆς
  choice: zu ihrem Gedenken
  alternative: als Erinnerungszeichen an sie
  rationale: Die Hauptfassung bewahrt den kommemorativen Sinn, ohne genauer festzulegen, ob das Erzählen selbst als Memorial gilt oder dem Erinnern an sie dient.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Einleitung „Amen, ich sage euch“ bleibt formal nah am Griechischen; der übrige Satz verwendet natürliche deutsche Syntax. Gedankenstrich und unpersönliches „man“ erhöhen die Verständlichkeit, ohne den Sinn festzulegen, den das Griechische offenlässt.
