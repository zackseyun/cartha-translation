    issue: Unklare Vorwegnahme durch „davon“
    rationale: In „wird man auch davon erzählen, was diese Frau getan hat“ ist „davon“ kataphorisch und stilistisch weniger glatt. „Wird auch erzählt werden, was diese Frau getan hat“ ist im Deutschen klarer, erhält den unpersönlich-passivischen Charakter von λαληθήσεται und verändert den Sinn nicht.
  revised_text: 'Amen, ich sage euch: Wo immer diese gute Nachricht[a] in der ganzen Welt verkündet wird, wird auch erzählt werden, was diese Frau getan hat, zu ihrem Gedenken.[b]'
