id: MAT.26.56
reference: Matthew 26:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: de
  text: Doch dies alles ist geschehen, damit die Schriften der Propheten erfüllt werden. Da verließen ihn alle Jünger und flohen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Doch dies alles
  rationale: Die Wendung verweist auf das gesamte vorausgehende Geschehen; „doch“ gibt δέ als leichten adversativen beziehungsweise weiterführenden Anschluss wieder.
- source_word: γέγονεν
  choice: ist geschehen
  rationale: Das Perfekt von γίνομαι bezeichnet ein eingetretenes Geschehen mit fortbestehender Bedeutung; das deutsche Perfekt ist hier natürlich und sachgerecht.
- source_word: ἵνα πληρωθῶσιν
  choice: damit … erfüllt werden
  rationale: Die Formulierung bewahrt die im ἵνα-Satz liegende Ziel- beziehungsweise Ergebnisbeziehung, ohne sie einseitig festzulegen.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: die Schriften der Propheten
  rationale: „Schriften“ bezeichnet hier die heiligen Schriften; der Genitiv „der Propheten“ bleibt bewusst ebenso knapp und mehrdeutig wie im Griechischen.
- source_word: τότε
  choice: Da
  rationale: „Da“ markiert in natürlichem deutschem Erzählstil die unmittelbar anschließende Handlung.
- source_word: οἱ μαθηταὶ πάντες
  choice: alle Jünger
  rationale: Die Stellung mit πάντες betont ausnahmslose Gesamtheit; ein nicht ausdrücklich vorhandenes Possessivpronomen wird nicht ergänzt.
- source_word: ἀφέντες αὐτὸν
  choice: verließen ihn
  rationale: ἀφίημι bezeichnet hier das Zurücklassen und kann im Zusammenhang den stärkeren Beiklang des Im-Stich-Lassens tragen; „verließen“ ist würdig, klar und zusammen mit „flohen“ ausreichend deutlich.
- source_word: ἔφυγον
  choice: flohen
  rationale: Die knappe, gewichtige Wiedergabe entspricht unmittelbar dem Aorist von φεύγω.
theological_decisions:
- issue: Erfüllung prophetischer Schrift
  choice: „damit die Schriften der Propheten erfüllt werden“
  alternative: „damit wahr wird, was die Propheten geschrieben haben“
  rationale: Die ausdrückliche Erfüllungssprache und die Bezeichnung als „Schriften“ werden erhalten. Zugleich bleibt ἵνα in seiner möglichen Ziel-/Ergebnis-Spannung bestehen, statt paraphrastisch eingeengt zu werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Erzählstil. Die Syntax bleibt nah am griechischen Aufbau, klingt aber natürlich. Keine Fußnote ist nötig, da „verließen ihn und flohen“ den kontextuellen Beiklang des Verlassens hinreichend vermittelt.
