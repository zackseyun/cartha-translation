id: MAT.26.41
reference: Matthew 26:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: de
  text: Bleibt wach und betet, damit ihr nicht in Versuchung kommt.[a] Der Geist ist zwar willig, aber das Fleisch ist schwach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in eine Prüfung geratet«. Das griechische Wort kann sowohl die Verlockung zur Sünde als auch eine belastende Prüfung oder Erprobung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Bleibt wach
  rationale: Der Imperativ bezeichnet sowohl das buchstäbliche Wachbleiben im unmittelbaren Zusammenhang als auch wachsame Bereitschaft. „Bleibt wach“ gibt beides in natürlichem Deutsch wieder.
- source_word: προσεύχεσθε
  choice: betet
  rationale: Der Imperativ Präsens fordert zum Beten auf; die schlichte Formulierung ist klar und idiomatisch.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: damit ihr nicht … kommt
  rationale: Die Konstruktion drückt beabsichtigte Verhütung aus. „In Versuchung kommen“ bewahrt das griechische Bild des Hineingelangens, ohne im Deutschen schwerfällig zu wirken.
- source_word: πειρασμόν
  choice: Versuchung
  rationale: Im unmittelbaren Zusammenhang steht die Gefahr des Versagens unter Druck im Vordergrund. Da das Wort auch Prüfung oder Erprobung bezeichnen kann, wird diese Bedeutungsbreite in einer Fußnote festgehalten.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: Der Geist ist zwar willig
  rationale: „Zwar … aber“ bildet den durch μέν und δέ markierten Gegensatz natürlich ab. „Willig“ trifft die Bereitschaft, ohne sie als bloße Begeisterung zu überzeichnen.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: aber das Fleisch ist schwach
  rationale: „Fleisch“ bewahrt das biblische Gegenüber von Geist und menschlicher leiblicher Gebrechlichkeit; „schwach“ entspricht dem Sinn von ἀσθενής prägnant.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: menschlicher Geist beziehungsweise innere Bereitschaft; „Geist“
  alternative: der Heilige Geist
  rationale: Der Gegensatz zum Fleisch und das bevorstehende Versagen der trotz guter Absicht müden Jünger sprechen hier für den menschlichen Geist. Die Formulierung fügt keine ausdrückliche Aussage über den Heiligen Geist hinzu.
- issue: Wiedergabe von σάρξ
  choice: „Fleisch“
  alternative: „Körper“ oder „menschliche Natur“
  rationale: Gemeint ist menschliche, auch leibliche Schwäche, nicht ausdrücklich eine ausgearbeitete Lehre von einer „sündigen Natur“. „Fleisch“ erhält das Bild und seine theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Gegenüberstellung „Der Geist ist zwar willig, aber das Fleisch ist schwach“ bleibt erhalten; „Bleibt wach“ nimmt den konkreten Zusammenhang in Gethsemane ebenso auf wie den Aufruf zur Wachsamkeit.
