id: MAT.26.24
reference: Matthew 26:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: de
  text: Der Menschensohn geht zwar dahin, wie über ihn geschrieben steht. Doch wehe jenem Menschen, durch den der Menschensohn verraten wird[a]! Für ihn wäre es besser gewesen, wenn jener Mensch nicht geboren worden wäre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgeliefert wird“. Das griechische Verb kann sowohl „verraten“ als auch „ausliefern, übergeben“ bedeuten; hier weist der Zusammenhang auf den Verrat des Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου … οὐαὶ δὲ
  choice: Der Menschensohn … zwar … Doch wehe
  rationale: „Menschensohn“ bewahrt die etablierte Selbstbezeichnung. Die Verbindung „zwar … doch“ gibt den Kontrast von μὲν und δὲ in natürlichem Deutsch wieder.
- source_word: ὑπάγει
  choice: geht dahin
  rationale: Die Wendung bewahrt das präsentische „Gehen“ und lässt offen, ob vor allem Weggang, bevorstehender Tod oder beides im Blick ist.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: wie über ihn geschrieben steht
  rationale: Die im Deutschen übliche Schriftformel gibt den perfektischen, fortbestehenden Geltungsaspekt von γέγραπται natürlich wieder.
- source_word: οὐαὶ … τῷ ἀνθρώπῳ ἐκείνῳ
  choice: wehe jenem Menschen
  rationale: „Wehe“ erhält den prophetischen und gerichtlichen Ernst; „jener Mensch“ bewahrt die demonstrative Distanzierung von ἐκεῖνος.
- source_word: δι’ οὗ
  choice: durch den
  rationale: Die Formulierung gibt διά mit Genitiv als vermittelnde Urheberschaft wieder, ohne die Aussage unnötig auszudeuten.
- source_word: παραδίδοται
  choice: verraten wird
  rationale: Im unmittelbaren Zusammenhang mit Judas bringt „verraten“ den treulosen Charakter der Handlung idiomatisch zum Ausdruck. Die wörtlichere Bedeutung „ausgeliefert“ bleibt in der Fußnote erhalten.
- source_word: καλὸν ἦν αὐτῷ
  choice: Für ihn wäre es besser gewesen
  rationale: Die deutsche Vergleichsform gibt den idiomatischen Sinn des kontrafaktischen Ausspruchs natürlich wieder; ein ausdrückliches griechisches Komparativwort ist dabei nicht vorausgesetzt.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: wenn jener Mensch nicht geboren worden wäre
  rationale: Der deutsche Konjunktiv II der Vergangenheit bildet die irreal-kontrafaktische Aussage ab und wahrt die Wiederholung von „jener Mensch“.
theological_decisions:
- issue: Verhältnis von schriftgemäßem Geschehen und menschlicher Verantwortung
  choice: 'Beides bleibt nebeneinander stehen: Der Weg des Menschensohnes entspricht der Schrift, zugleich trifft den Verräter das Wehe.'
  alternative: Entweder die Verantwortung des Verräters durch einen deterministischen Sinn abzuschwächen oder die Schriftgemäßheit als bloßen nachträglichen Bezug zu behandeln.
  rationale: Der griechische Text behauptet beide Seiten, ohne ihr Verhältnis weiter aufzulösen; die Übersetzung wahrt diese Spannung.
- issue: Aussage über das Nichtgeborensein
  choice: Die Formulierung bleibt ein schweres Gerichtswort, ohne daraus eine über den Vers hinausgehende Lehraussage abzuleiten.
  alternative: Die Aussage entweder als bloße Übertreibung abzuschwächen oder sie zu einem detaillierten Lehrsatz über das endgültige Geschick des Verräters auszubauen.
  rationale: Der Text nennt das Nichtgeborensein für diesen Menschen besser, erklärt aber an dieser Stelle nicht weiter, welche systematisch-theologischen Folgerungen daraus zu ziehen sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Menschensohn“ und „wehe“ bewahren die biblisch geprägte Ausdrucksweise, bleiben aber allgemein verständlich. Die Satzteilung macht den starken Gegensatz gut hörbar; der Fußnotenmarker steht unmittelbar bei der betreffenden Verbform.
