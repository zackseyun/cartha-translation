  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: de
  text: 'Doch er stritt es vor allen Anwesenden ab[a] und sagte: „Ich weiß nicht, was du sagst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht kein Objekt bei „stritt … ab“; gemeint ist die unmittelbar zuvor erhobene Behauptung.
    reason: Das Deutsche ergänzt „es“, während das griechische Verb hier ohne ausdrücklich genanntes Objekt steht.
lexical_decisions:
- source_word: ὁ δὲ
  choice: Doch er
  rationale: δέ markiert hier den Gegensatz zwischen der Anschuldigung und Petrus’ Reaktion. „Doch er“ gibt diesen narrativen Kontrast natürlich wieder.
- source_word: ἠρνήσατο
  choice: stritt es ab
  rationale: Das Verb bezeichnet hier das Bestreiten der unmittelbar zuvor erhobenen Behauptung. Das im Griechischen unausgesprochene Objekt wird im Deutschen mit „es“ aufgenommen, weil „stritt … ab“ so natürlich und eindeutig klingt, ohne den Inhalt der Verleugnung näher festzulegen.
- source_word: ἔμπροσθεν πάντων
  choice: vor allen
  rationale: Die Wendung bezeichnet eine öffentliche Äußerung in Gegenwart aller dort Anwesenden. „Vor allen“ ist knapp und entspricht der griechischen Formulierung.
- source_word: λέγων
  choice: und sagte
  rationale: Der griechische Begleitumstand wird im natürlichen deutschen Erzählstil als koordinierter Redeeinleiter wiedergegeben.
- source_word: Οὐκ οἶδα τί λέγεις
  choice: Ich weiß nicht, was du sagst
  rationale: Die direkte Wiedergabe bewahrt sowohl das Verb des Wissens als auch das Verb des Sagens und lässt offen, ob Petrus Unverständnis behauptet oder die Aussage zurückweist.
theological_decisions:
- issue: Gegenstand von Petrus’ Leugnung
  choice: Die unmittelbar zuvor erhobene Behauptung wird als unausgesprochenes Objekt mit „es“ aufgenommen.
  alternative: Ausdrücklich formulieren, Petrus habe Jesus verleugnet oder bestritten, ihn zu kennen.
  rationale: Der griechische Satz nennt kein ausdrückliches Objekt. Die Übersetzung macht den deutschen Satz idiomatisch, ohne eine über den unmittelbaren Zusammenhang hinausgehende Deutung einzutragen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die direkte Rede bleibt bewusst nah am griechischen Wortlaut; „was du sagst“ bewahrt die mögliche Spannung zwischen behauptetem Nichtwissen und tatsächlicher Zurückweisung.
