source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: de
  text: 'Da sagte Jesus zu ihm: „Bring dein Schwert wieder an seinen Platz! Denn alle, die zum Schwert greifen[a], werden durch das Schwert umkommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „das Schwert nehmen“; die Wendung meint hier wahrscheinlich, zu Waffengewalt zu greifen, nicht lediglich eine Waffe anzufassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Leitet in der Erzählfolge natürlich das unmittelbar folgende Geschehen ein.
- source_word: λέγει αὐτῷ
  choice: sagte Jesus zu ihm
  rationale: Das historische Präsens wird entsprechend natürlichem deutschem Erzählstil im Präteritum wiedergegeben.
- source_word: Ἀπόστρεψον τὴν μάχαιράν σου εἰς τὸν τόπον αὐτῆς
  choice: Steck dein Schwert wieder an seinen Platz
  rationale: Der Aoristimperativ fordert eine sofortige Umkehr der Handlung. „Wieder an seinen Platz“ bewahrt die Aussage des Griechischen, ohne ausdrücklich eine im Text nicht genannte Scheide einzuführen.
- source_word: μάχαιρα
  choice: Schwert
  rationale: Das Wort kann verschiedene kürzere Klingenwaffen bezeichnen; „Schwert“ ist im Zusammenhang der Verhaftung klar, konventionell und erhält die sprichwortartige Wiederholung.
- source_word: πάντες οἱ λαβόντες μάχαιραν
  choice: alle, die zum Schwert greifen
  rationale: Das substantivierte Partizip formuliert eine allgemeine Aussage. Die deutsche Wendung bezeichnet hier verständlich den Rückgriff auf Waffengewalt und nicht bloß das Anfassen eines Gegenstands.
- source_word: ἐν μαχαίρῃ
  choice: durch das Schwert
  rationale: Gibt den instrumentalen Dativ wieder und erhält die Parallelität der Aussage.
- source_word: ἀπολοῦνται
  choice: werden … umkommen
  rationale: Das Futur bezeichnet hier Tod beziehungsweise Verderben; „umkommen“ wahrt den ernsten Sinn, ohne die genaue Todesart über das Gesagte hinaus festzulegen.
theological_decisions:
- issue: Reichweite von Jesu Aussage über das Schwert
  choice: 'Als allgemeinen Grundsatz wiedergegeben: „alle, die zum Schwert greifen“'
  alternative: Entweder als absolutes Verbot jeder Gewalt oder ausschließlich als Vorhersage für die unmittelbar Beteiligten deuten
  rationale: Die griechische Konstruktion ist verallgemeinernd. Die Übersetzung bewahrt diese Weite, ohne eine bestimmte konfessionelle Lehre über Gewalt in den Vers hineinzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der knappe Parallelismus von „zum Schwert greifen“ und „durch das Schwert umkommen“ bleibt erhalten.
