  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: de
  text: 'Am ersten Tag des Festes der ungesäuerten Brote[a] kamen die Jünger zu Jesus und sagten: „Wo willst du, dass wir für dich das Passamahl zum Essen vorbereiten?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Am ersten der ungesäuerten Brote“. Gemeint ist der jüdische Festzeitraum. Die genaue zeitliche Einordnung des Passamahls sollte nicht allein durch die Übersetzung entschieden werden.'
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: Am ersten Tag des Festes der ungesäuerten Brote
  rationale: Der temporale Dativ wird natürlich mit „am ersten Tag“ wiedergegeben. Das substantivierte τῶν ἀζύμων bezeichnet die Festzeit; „Fest der ungesäuerten Brote“ macht den im Deutschen sonst schwer verständlichen Festnamen explizit. Das schwache δέ verlangt hier kein eigenes „aber“.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: kamen die Jünger zu Jesus
  rationale: προσέρχομαι bedeutet hier „zu jemandem kommen/herantreten“; die schlichte Formulierung ist natürlich und bewahrt die Richtung zum Dativobjekt.
- source_word: λέγοντες
  choice: und sagten
  rationale: Die beigeordnete deutsche Verbform gibt das gleichzeitig begleitende Partizip idiomatisch wieder, ohne die Äußerung stärker als „fragen“ zu deuten.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Wo sollen wir für dich … vorbereiten?
  rationale: Der deliberative Konjunktiv nach θέλεις wird im modernen Deutsch natürlich durch „sollen wir“ ausgedrückt; „für dich“ bewahrt σοι. Die Wendung vermittelt Jesu Wunsch, ohne ein schwerfälliges „Wo willst du, dass wir …“.
- source_word: φαγεῖν τὸ πάσχα
  choice: das Passamahl
  rationale: πάσχα kann Fest, Opfer oder Mahl bezeichnen. Mit φαγεῖν und ἑτοιμάσωμεν ist konkret das zu essende Mahl gemeint; „Passamahl“ gibt dies im Deutschen klar und knapp wieder, während der Infinitiv semantisch in der Bezeichnung des vorbereiteten Mahls aufgeht.
theological_decisions:
- issue: Chronologische Bezeichnung des ersten Tages der ungesäuerten Brote im Verhältnis zum Passamahl
  choice: Die griechische Festtagsangabe wird als „am ersten Tag des Festes der ungesäuerten Brote“ beibehalten.
  alternative: Interpretierend „am Tag vor dem Fest der ungesäuerten Brote“ oder vereinfachend „am ersten Passatag“ schreiben.
  rationale: Der Wortlaut soll chronologische Fragen zwischen den Evangelien nicht durch eine harmonisierende Übersetzung entscheiden.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Passamahl“ ist klarer als das im Deutschen mehrdeutige „das Passa essen“. Der Festname wird zur Verständlichkeit mit „Fest“ ergänzt; die Fußnote dokumentiert die wörtlich knappere Form.
