id: MAT.26.50
reference: Matthew 26:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: de
  text: 'Jesus aber sagte zu ihm: »Freund, tu, wozu du gekommen bist.«[a] Da traten sie heran, legten Hand an Jesus und ergriffen ihn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Frage: »Freund, wozu bist du gekommen?« Der griechische Ausdruck ist sehr knapp und kann als Frage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Freund
  rationale: Die Anrede bezeichnet hier keinen engen Vertrauten, sondern ist eine zurückhaltende direkte Anrede an Judas. »Freund« ist im modernen Deutschen natürlich und bewahrt den angespannten, nicht ausdrücklich herzlichen Ton.
- source_word: ἐφ’ ὃ πάρει
  choice: tu, wozu du gekommen bist
  rationale: Die griechische Wendung ist stark verkürzt und kann als auffordernde Aussage verstanden werden, die Judas’ Absicht benennt beziehungsweise freigibt. Die Wiedergabe ist im Deutschen verständlich, ohne den knappen Ausdruck unnötig auszudeuten; die mögliche Frageform steht in der Fußnote.
- source_word: προσελθόντες
  choice: Da traten sie heran
  rationale: Das Aoristpartizip beschreibt, wie die Festnehmenden auf Jesus zukommen. Die deutsche Form gibt die zeitliche Abfolge der Erzählung natürlich wieder.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: legten Hand an Jesus
  rationale: Die feste deutsche Wendung vermittelt den feindseligen körperlichen Zugriff und entspricht dem griechischen Idiom.
- source_word: ἐκράτησαν αὐτόν
  choice: ergriffen ihn
  rationale: κρατέω bezeichnet hier das gewaltsame Ergreifen und Festhalten. »Ergriffen ihn« bewahrt die körperliche Handlung, ohne ausdrücklich eine formelle rechtliche Festnahme in den Wortlaut einzutragen.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet einen leichten Gegensatz beziehungsweise den Übergang von Judas’ Handlung zu Jesu Antwort; »aber« gibt dies knapp wieder.
theological_decisions:
- issue: Deutung von Jesu Antwort an Judas
  choice: »Freund, tu, wozu du gekommen bist.«
  alternative: »Freund, wozu bist du gekommen?«
  rationale: Der knappe griechische Ausdruck lässt sowohl eine auffordernde beziehungsweise feststellende Deutung als auch eine Frage zu. Der Haupttext bewahrt Jesu nüchterne Konfrontation mit Judas’ Vorhaben; die Fußnote erhält die echte syntaktische und theologische Spannung, ohne Jesu Haltung als ausschließlich freundlich oder ausschließlich verurteilend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählweise. Die Anrede »Freund« bleibt bewusst zurückhaltend; die idiomatische Formulierung »Hand an jemanden legen« wahrt den körperlich-feindseligen Charakter der Szene.
