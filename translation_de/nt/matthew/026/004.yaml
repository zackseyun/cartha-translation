  text: καὶ συνεβουλεύσαντο ἵνα τὸν Ἰησοῦν δόλῳ κρατήσωσιν καὶ ἀποκτείνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: de
  text: und sie berieten miteinander, wie sie Jesus mit List festnehmen und töten könnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: berieten miteinander
  rationale: Gibt die gemeinsame Beratung beziehungsweise Planfassung wieder, ohne das Verb durch das stärkere und enger gefasste „sich verschwören“ zu überzeichnen.
- source_word: δόλῳ
  choice: mit List
  rationale: Bewahrt den Gedanken eines täuschenden, hinterhältigen Vorgehens in knapper und natürlicher deutscher Form.
- source_word: κρατήσωσιν
  choice: festnehmen
  rationale: Im Zusammenhang bezeichnet das Verb das Ergreifen und In-Gewahrsam-Nehmen Jesu; „festnehmen“ ist dafür im modernen Deutsch klar und idiomatisch.
- source_word: ἀποκτείνωσιν
  choice: töten
  rationale: Entspricht direkt und sachlich dem griechischen Verb.
theological_decisions:
- issue: Wiedergabe von ἵνα nach einem Verb des Beratens
  choice: wie sie … könnten
  alternative: um … zu
  rationale: Die Formulierung gibt den Inhalt und das Ziel ihrer Beratung in natürlichem Deutsch wieder. Der Absichtscharakter bleibt erhalten, ohne anzudeuten, dass die Festnahme und Tötung bereits vollzogen wurden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp, klar und ohne konfessionelle Zusatzdeutung.
