  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Der griechische Satz wurde zur Vermeidung einer schwerfälligen deutschen Relativkonstruktion in zwei Sätze gegliedert. Die Amts- und Gruppenbezeichnungen folgen dem etablierten biblischen Sprachgebrauch, ohne zusätzliche institutionelle Einzelheiten einzutragen.
