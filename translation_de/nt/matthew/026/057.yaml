  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: de
  text: Die aber, die Jesus ergriffen hatten, führten ihn weg zu Kajaphas, dem Hohen Priester, wo die Schriftgelehrten und die Ältesten sich versammelt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wo die Schriftgelehrten und die Ältesten versammelt waren.“ Die griechische Verbform kann hier passiv oder im Sinn eines Zusammenkommens verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Diejenigen, die
  rationale: Der Artikel mit Partizip wird als substantivische Relativkonstruktion wiedergegeben. δέ führt die Erzählung nur leicht weiter und muss im Deutschen nicht mit einem betonten Gegensatz wiedergegeben werden.
- source_word: κρατήσαντες
  choice: ergriffen hatten
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. „Ergriffen“ bewahrt die Grundbedeutung des Festhaltens beziehungsweise Ergreifens, ohne den stärker rechtssprachlichen Begriff „festgenommen“ vorauszusetzen.
- source_word: ἀπήγαγον
  choice: führten ihn zu
  rationale: ἀπάγω bezeichnet hier das Wegführen unter Bewachung. Die natürliche deutsche Wendung mit genanntem Ziel lautet „führten ihn zu“; der Gedanke des Wegführens ergibt sich aus dem Zusammenhang.
- source_word: πρὸς Καϊάφαν
  choice: zu Kajaphas
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf eine Person zu. Ein Haus oder ein förmliches Vorführen wird im griechischen Text nicht ausdrücklich genannt.
- source_word: τὸν ἀρχιερέα
  choice: dem Hohen Priester
  rationale: Der Titel ἀρχιερεύς bezeichnet hier Kajaphas in seinem Amt als Hoher Priester.
- source_word: ὅπου
  choice: Dort
  rationale: Die Aufteilung in zwei deutsche Sätze gibt den Ortsbezug von ὅπου klar und natürlich wieder, ohne den Inhalt zu verändern.
- source_word: οἱ γραμματεῖς
  choice: die Schriftgelehrten
  rationale: „Schriftgelehrte“ ist die geläufige und sachlich passende Bezeichnung für diese jüdischen Gesetzes- und Schriftausleger.
- source_word: οἱ πρεσβύτεροι
  choice: die Ältesten
  rationale: Der Ausdruck bezeichnet die anerkannten jüdischen Führungsvertreter und wird präzise mit „Älteste“ wiedergegeben.
- source_word: συνήχθησαν
  choice: hatten sich versammelt
  rationale: Der Aorist steht gegenüber dem Hinführen Jesu als bereits eingetretenes Geschehen. Die reflexiv-intransitive deutsche Form ist natürlich; eine echte Passivdeutung bleibt ebenfalls möglich und wird in der Fußnote genannt.
