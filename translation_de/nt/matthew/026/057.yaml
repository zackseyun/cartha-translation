review_pass:
  verdict: revise
  source_fidelity: Der Sinn wird im Wesentlichen zutreffend wiedergegeben. Allerdings bezeichnet ἀπάγω ausdrücklich ein Wegführen; „führten ihn zu“ lässt diesen Aspekt schwächer hervortreten. Die Ortsrelation von ὅπου sollte möglichst innerhalb des Satzes als „wo“ erhalten bleiben.
  naturalness: Die Formulierung ist verständlich und modern. „Diejenigen, die“ ist jedoch unnötig schwerfällig; „Die aber, die“ ist im biblisch-erzählenden Register natürlich und gibt δέ angemessen wieder. Ein einzelner Satz mit „wo“ ist ebenso flüssig.
  terminology: „Kajaphas“, „Hoher Priester“, „Schriftgelehrten“ und „Ältesten“ sind angemessen und etabliert. Die alternative Fußnote ist inhaltlich möglich, aber „versammelt worden“ klingt im Deutschen unnötig umständlich und legt eine agensbezogene Passivlesart stärker nahe, als der griechische Kontext erfordert.
  issues:
  - severity: low
    issue: ἀπήγαγον ist mit „führten ihn zu“ abgeschwächt.
    rationale: Das Präfix ἀπ- markiert das Wegführen. „führten ihn weg zu“ gibt sowohl die Abführung als auch das Ziel wieder.
  - severity: low
    issue: ὅπου wird durch Satztrennung als „Dort“ wiedergegeben.
    rationale: Die Wiedergabe ist nicht sinnwidrig, doch „wo“ bewahrt die relative Ortsverknüpfung des griechischen Satzes unmittelbarer.
  - severity: low
    issue: Fußnotenalternative „waren ... versammelt worden“ ist stilistisch schwerfällig und potenziell zu stark passivisch.
    rationale: συνήχθησαν kann passiv oder intransitiv verstanden werden. „waren versammelt“ bildet die passive Zustandslesart natürlicher ab, ohne ein nicht genanntes Agens zu nahe zu legen.
