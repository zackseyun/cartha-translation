revisions:
- from: Diejenigen, die Jesus ergriffen hatten, führten ihn zu Kajaphas, dem Hohen Priester. Dort hatten sich die Schriftgelehrten und die Ältesten versammelt.[a]
  to: Die aber, die Jesus ergriffen hatten, führten ihn weg zu Kajaphas, dem Hohen Priester, wo die Schriftgelehrten und die Ältesten sich versammelt hatten.[a]
  rationale: Die Revision wahrt die vorausgehende Handlung des Partizips („ergriffen hatten“), gibt das Wegführen in ἀπήγαγον ausdrücklich wieder und erhält die Ortsverknüpfung von ὅπου mit „wo“. Die Fußnote formuliert die mögliche passive Lesart idiomatischer und ohne unnötige Festlegung auf ein handelndes Agens.
