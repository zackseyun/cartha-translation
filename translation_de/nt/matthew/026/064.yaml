id: MAT.26.64
reference: Matthew 26:64
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Du hast es gesagt.[a] Doch ich sage euch: Von jetzt an werdet ihr den Menschensohn zur Rechten der Macht[b] sitzen und auf den Wolken des Himmels kommen sehen.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Du sagst es.“ Die griechische Wendung ist eine idiomatische bejahende Antwort.'
    reason: lexical_alternative
  - marker: b
    text: „Die Macht“ ist eine ehrfürchtige Umschreibung für Gott.
    reason: cultural_note
  - marker: c
    text: Anspielung auf Daniel 7,13 und Psalm 110,1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Du hast es gesagt
  rationale: Die Formulierung bewahrt den Wortlaut der idiomatischen, bejahenden Antwort, ohne sie zu einem uneingeschränkten „Ja“ zu vereinfachen.
- source_word: πλὴν
  choice: Doch
  rationale: „Doch“ kennzeichnet im heutigen Deutsch klar und würdig den nachdrücklichen Übergang von der unmittelbaren Antwort zur folgenden Erklärung.
- source_word: ἀπ’ ἄρτι
  choice: von jetzt an
  rationale: Die Wendung bezeichnet den Beginn einer neuen Lage ab diesem Zeitpunkt, ohne den Sinn unnötig auf denselben Augenblick zu beschränken.
- source_word: ὄψεσθε
  choice: werdet ihr … sehen
  rationale: Dies ist die natürliche Wiedergabe des Futurs von ὁράω und lässt offen, auf welche Weise und zu welchem Zeitpunkt dieses Sehen geschieht.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: Die etablierte Selbstbezeichnung bleibt erhalten und bewahrt zugleich den Bezug zu Daniel 7.
- source_word: καθήμενον
  choice: sitzen
  rationale: Zusammen mit „zur Rechten der Macht“ vermittelt das Verb die Vorstellung von Erhöhung und Thronstellung, ohne über den griechischen Wortlaut hinauszugehen.
- source_word: ἐκ δεξιῶν
  choice: zur Rechten
  rationale: Die feste deutsche Wendung bezeichnet den Ehren- und Autoritätsplatz und bewahrt das biblische Bild.
- source_word: τῆς δυνάμεως
  choice: der Macht
  rationale: Die substantivierte Bezeichnung bleibt als ehrfürchtige Umschreibung für Gott erhalten, statt den Bezug im Haupttext ausdrücklich aufzulösen.
- source_word: ἐρχόμενον
  choice: kommen
  rationale: Die direkte Wiedergabe erhält die Bewegungsvorstellung und den Anklang an Daniel 7.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: auf den Wolken des Himmels
  rationale: Die Formulierung gibt die Präpositionalphrase transparent wieder und bewahrt ihren Daniel-Bezug.
theological_decisions:
- issue: Aussagekraft der Antwort Σὺ εἶπας
  choice: Eine bejahende Antwort in der eigentümlichen Formulierung „Du hast es gesagt“
  alternative: Ein schlichtes „Ja“ oder eine ausweichende Nichtantwort
  rationale: Der Ausdruck wirkt im Zusammenhang als Zustimmung, doch ein bloßes „Ja“ würde die tatsächliche Formulierung einebnen; als Ausweichen verstanden, wäre seine bejahende Kraft unterbewertet.
- issue: Bezug von τῆς δυνάμεως
  choice: Die ehrfürchtige Umschreibung „der Macht“ wird beibehalten
  alternative: Die ausdrückliche Wiedergabe „Gottes“ oder „des Mächtigen“
  rationale: Gemeint ist sehr wahrscheinlich Gott. Die Übersetzung wahrt jedoch die indirekte, ehrfürchtige Ausdrucksweise des griechischen Textes.
- issue: Zeitlicher Bezug von Sitzen und Kommen
  choice: Erhöhung und Kommen bleiben gemeinsam Gegenstand dessen, was die Angesprochenen sehen werden
  alternative: Eine Festlegung entweder ausschließlich auf eine unmittelbar bevorstehende Erfüllung oder ausschließlich auf die zukünftige Wiederkunft
  rationale: Der griechische Satz verbindet beide Partizipien. Die Übersetzung bewahrt diese Spannung und legt keine umstrittene zeitliche Deutung fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die etablierte Bezeichnung „Menschensohn“ und die biblischen Bilder bleiben erhalten; archaische Formen und konfessionelle Deutungszusätze werden vermieden.
