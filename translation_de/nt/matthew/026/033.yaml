base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: de
  text: 'Petrus aber erwiderte ihm: „Selbst wenn alle an dir Anstoß nehmen[a], werde ich niemals Anstoß nehmen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „straucheln“ oder „von dir abfallen“. Das griechische Verb kann bezeichnen, dass jemand zum Straucheln gebracht wird, Anstoß nimmt oder die Treue aufgibt.'
    reason: lexikalische Bedeutungsbreite
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Petrus aber erwiderte ihm
  rationale: Die griechische Verbindung aus Partizip und finitem Redeverb ist eine übliche Redeformel. „Erwiderte ihm“ gibt sie im Deutschen natürlich wieder; „aber“ bewahrt den Kontrast zum vorausgehenden Wort Jesu.
- source_word: Εἰ πάντες
  choice: Selbst wenn alle
  rationale: Εἰ bedeutet formal „wenn“, hat hier durch den betonten Gegensatz zwischen allen anderen und Petrus jedoch einen konzessiven Nachdruck, den „selbst wenn“ natürlich ausdrückt.
- source_word: σκανδαλισθήσονται
  choice: an dir Anstoß nehmen und zu Fall kommen
  rationale: Das Passiv von σκανδαλίζω kann das Verursachtwerden zum Straucheln, Anstoßnehmen oder Abfallen bezeichnen. Die Doppelwendung erhält das Bild und macht zugleich die schwerwiegende Folge im Jüngerkontext verständlich.
- source_word: ἐν σοί
  choice: an dir
  rationale: In Verbindung mit σκανδαλίζω bezeichnet ἐν σοί den Bezug beziehungsweise Anlass des Anstoßes. „An dir“ ist im Deutschen idiomatisch und bleibt näher an der griechischen Konstruktion als eine rein kausale Auflösung.
- source_word: ἐγὼ οὐδέποτε σκανδαλισθήσομαι
  choice: ich werde niemals zu Fall kommen
  rationale: Das ausdrücklich gesetzte ἐγώ wird durch die Gegenüberstellung und den Gedankenstrich hervorgehoben. „Niemals“ entspricht der nachdrücklichen Zeitnegation οὐδέποτε; die Wiederaufnahme von „zu Fall kommen“ hält die beiden Verbformen eng zusammen.
theological_decisions:
- issue: Bedeutungsumfang von σκανδαλίζω im Zusammenhang des Versagens der Jünger
  choice: an dir Anstoß nehmen und zu Fall kommen
  alternative: von dir abfallen; an dir Anstoß nehmen; straucheln
  rationale: Die Formulierung bewahrt sowohl das Bild des Strauchelns als auch die mögliche Bedeutung eines schwerwiegenden Loyalitätsbruchs, ohne festzulegen, dass endgültiger Glaubensabfall gemeint sein müsse.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Redeformel wurde idiomatisch verdichtet; Petrus’ nachdrücklicher Gegensatz zu den übrigen Jüngern bleibt durch „selbst wenn“, den Gedankenstrich und „niemals“ deutlich.
