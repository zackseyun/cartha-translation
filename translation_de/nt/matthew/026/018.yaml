review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Bewegungsauftrag, ungenannten aber bestimmten Mann, den Titel „der Lehrer“, die offene Aussage über den nahen καιρός, die Gastgeberschaft bei der angesprochenen Person und die Begleitung durch die Jünger zutreffend wieder. „Bei dir“ bewahrt gegenüber „in deinem Haus“ die gebotene Zurückhaltung. Das deutsche „will ich ... feiern“ legt jedoch einen Willensentschluss nahe, während ποιῶ hier die feststehende bzw. bevorstehende Durchführung des Passafests ausdrückt.
  naturalness: Der Satz ist insgesamt modernes, gut verständliches Standarddeutsch. „Bei dir will ich mit meinen Jüngern das Passafest feiern“ ist zwar verständlich, wirkt aber durch die Stellung von „will ich“ semantisch unnötig voluntativ. „Bei dir feiere ich ...“ ist idiomatischer und gibt den präsentischen, unmittelbar bevorstehenden Charakter besser wieder.
  terminology: „Der Lehrer“, „Passafest“ und „Jünger“ sind sachgerecht und im Evangelienregister etabliert. „Meine Zeit ist nahe“ erhält die vom griechischen καιρός offen gelassene Reichweite. Für diese einzelne Übersetzung sind keine Fußnoten erforderlich.
  issues:
  - severity: medium
    issue: „will ich ... feiern“ für ποιῶ τὸ πάσχα
    rationale: Die Formulierung kann im Deutschen einen bloßen oder besonders betonten Willensentschluss ausdrücken. Das griechische Präsens bezeichnet hier die anstehende Durchführung bzw. Feier. Das einfache Präsens „feiere ich“ wahrt dies ohne zusätzliche Nuance.
  revised_text: 'Er sagte: „Geht in die Stadt zu einem bestimmten Mann und sagt ihm: ‚Der Lehrer sagt: Meine Zeit ist nahe. Bei dir feiere ich mit meinen Jüngern das Passafest.‘“'
