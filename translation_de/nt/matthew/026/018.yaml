  to: 'Er sagte: „Geht in die Stadt zu einem bestimmten Mann und sagt ihm: ‚Der Lehrer sagt: Meine Zeit ist nahe. Bei dir feiere ich mit meinen Jüngern das Passafest.‘“'
  rationale: Alle tragfähigen Entscheidungen des Entwurfs bleiben erhalten. Nur die Wiedergabe von ποιῶ τὸ πάσχα wird von „will ich ... feiern“ zu „feiere ich ...“ geändert, damit weder ein zusätzlicher voluntativer Akzent gesetzt noch die unmittelbar bevorstehende, feststehende Handlung abgeschwächt wird.
