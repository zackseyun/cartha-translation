source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: de
  text: 'Er sagte: „Geht in die Stadt zu einem bestimmten Mann und sagt ihm: ‚Der Lehrer sagt: Meine Zeit ist nahe. Bei dir feiere ich mit meinen Jüngern das Passafest.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Geht
  rationale: Der Bewegungsimperativ wird im Deutschen schlicht und natürlich mit „Geht“ wiedergegeben.
- source_word: πρὸς τὸν δεῖνα
  choice: zu einem bestimmten Mann
  rationale: δεῖνα bezeichnet eine konkrete, aber absichtlich nicht namentlich genannte Person. „Ein bestimmter Mann“ bewahrt dies in würdigem, verständlichem Deutsch.
- source_word: Ὁ διδάσκαλος
  choice: Der Lehrer
  rationale: „Lehrer“ entspricht διδάσκαλος und erhält die im Kontext als Bezeichnung Jesu gebrauchte Anrede.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Meine Zeit ist nahe
  rationale: καιρός bezeichnet hier eine bedeutsame Zeit, ohne dass der Vers deren genaue Reichweite festlegt. „Meine Zeit“ bewahrt diese Offenheit; „Stunde“ würde einen anderen griechischen Ausdruck nahelegen.
- source_word: πρὸς σὲ
  choice: bei dir
  rationale: Die Wendung bezeichnet im Zusammenhang den Ort beziehungsweise die Gastgeberschaft, sagt aber nicht ausdrücklich „in deinem Haus“. „Bei dir“ ist präzise und idiomatisch.
- source_word: ποιῶ τὸ πάσχα
  choice: will ich das Passafest feiern
  rationale: ποιεῖν τὸ πάσχα ist eine feste Wendung für das Feiern beziehungsweise Begehen des Passafestes. Das futurisch wirkende Präsens kann im Deutschen natürlich mit „will ich … feiern“ wiedergegeben werden, ohne einen bloßen Wunsch auszudrücken.
- source_word: τὸ πάσχα
  choice: das Passafest
  rationale: „Passafest“ ist eine klare und etablierte deutsche Bezeichnung des jüdischen Festes.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: mit meinen Jüngern
  rationale: „Jünger“ ist im Evangelienkontext die natürliche und inhaltlich angemessene Wiedergabe von μαθηταί.
theological_decisions:
- issue: Bedeutung von Jesu naher καιρός
  choice: „Meine Zeit ist nahe“
  alternative: „Meine festgesetzte Zeit ist nahe“ oder „Meine Stunde ist nahe“
  rationale: Der Wortlaut signalisiert die Nähe einer bedeutsamen Zeit, bestimmt hier aber nicht ausdrücklich, ob allein der Tod Jesu, das Passamahl oder die umfassendere Vollendung seines Auftrags gemeint ist. Die Übersetzung bewahrt diese Spannung.
- issue: Zeitwert von ποιῶ
  choice: „will ich … feiern“
  alternative: „feiere ich“ oder „werde ich … feiern“
  rationale: Das griechische Präsens kann eine feststehende, unmittelbar bevorstehende Handlung bezeichnen. „Will ich“ ist hier als entschiedene Ankündigung zu verstehen und hält zugleich die persönliche Entschlossenheit Jesu sichtbar.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede ist übersichtlich verschachtelt; „bei dir“ vermeidet sowohl das schwerfällige doppelte „mit“ als auch die nicht ausdrücklich im Griechischen enthaltene Ergänzung „in deinem Haus“.
