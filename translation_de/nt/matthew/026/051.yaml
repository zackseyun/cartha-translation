id: MAT.26.51
reference: Matthew 26:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: de
  text: Und sieh, einer von denen, die bei Jesus waren, streckte die Hand aus, zog sein Schwert, schlug den Sklaven[a] des Hohenpriesters und hieb ihm das Ohr ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt als verständliches narratives Aufmerksamkeitssignal die Plötzlichkeit und Anschaulichkeit des griechischen Ausdrucks.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: einer von denen, die bei Jesus waren
  rationale: Gibt die partitive Wendung natürlich wieder, ohne die Person anhand anderer Evangelien zu identifizieren.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: streckte die Hand aus
  rationale: Bildet das vorangehende Partizip als begleitende Handlung eng und idiomatisch ab.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: zog sein Schwert
  rationale: Ist die übliche deutsche Wendung für das Herausziehen der Waffe und wahrt die Besitzangabe.
- source_word: μάχαιραν
  choice: Schwert
  rationale: Ist hier die natürliche allgemeine Entsprechung; „Kurzschwert“ oder „Dolch“ wäre unnötig spezifisch.
- source_word: πατάξας
  choice: schlug nach
  rationale: Gibt den gewaltsamen Hieb natürlich wieder; zusammen mit dem folgenden Abhauen des Ohres ist die Handlung eindeutig.
- source_word: δοῦλον
  choice: Sklaven
  rationale: Spiegelt den sozialrechtlichen Status genauer als das abschwächende „Diener“.
- source_word: ἀρχιερέως
  choice: des Hohenpriesters
  rationale: Entspricht der etablierten deutschen Bezeichnung im Singular.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: hieb ihm das Ohr ab
  rationale: Gibt das finite Verb und das durch den Schwerthieb bewirkte Ergebnis mit einer natürlichen deutschen Wendung wieder.
- source_word: ὠτίον
  choice: Ohr
  rationale: Das Diminutiv verlangt hier weder „Öhrchen“ noch die spezifischere Wiedergabe „Ohrläppchen“.
theological_decisions:
- issue: Wiedergabe von δοῦλος in einem konkreten sozialen Verhältnis
  choice: Sklave
  alternative: Diener
  rationale: Der Ausdruck bezeichnet hier einen dem Hohenpriester untergeordneten Unfreien; „Sklave“ wahrt diese soziale Realität, während die Fußnote die traditionell weichere Alternative nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sieh“ bewahrt die markante narrative Einleitung; die anschließende Verbfolge ist knapp und anschaulich. Der Fußnotenmarker steht unmittelbar bei dem lexikalisch erklärten Ausdruck.
