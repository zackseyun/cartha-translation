review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem griechischen Satzbau und den Handlungen insgesamt genau: einer aus Jesu Begleitung zieht sein Schwert, schlägt den Sklaven des Hohenpriesters und trennt ihm das Ohr ab. Allerdings bedeutet πατάξας mit direktem Akkusativobjekt „den Sklaven schlagen/treffen“, nicht „nach dem Sklaven schlagen“; letzteres kann im Deutschen einen bloßen, möglicherweise nicht treffenden Schlag nahelegen.'
  naturalness: Der Text ist knapp, verständlich und im würdigen modernen Standarddeutsch gut lesbar. „Und sieh“ ist als bewusst markierte, narrative Entsprechung von ἰδοὺ vertretbar. Die Änderung zu „schlug den Sklaven“ ist zugleich idiomatischer als „schlug nach dem Sklaven“.
  terminology: „Sklave“ gibt δοῦλος in diesem sozial konkreten Kontext angemessen wieder; die Fußnote mit „Diener“ dokumentiert die mögliche traditionellere Alternative. „Hoherpriester“ und „Schwert“ sind sachgerecht. „Ohr“ wahrt die unspezifische Bedeutung von ὠτίον.
  issues:
  - severity: medium
    issue: „schlug nach dem Sklaven“ für πατάξας τὸν δοῦλον
    rationale: Das griechische Verb hat hier den Sklaven als direktes Objekt und beschreibt einen tatsächlich ausgeführten Treffer. Die deutsche Präposition „nach“ schwächt dies zu einem Schlagversuch ab; „schlug den Sklaven“ gibt den Kasus und den Handlungsverlauf genauer wieder.
  revised_text: Und sieh, einer von denen, die bei Jesus waren, streckte die Hand aus, zog sein Schwert, schlug den Sklaven[a] des Hohenpriesters und hieb ihm das Ohr ab.
