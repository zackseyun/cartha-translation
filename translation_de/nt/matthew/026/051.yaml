  to: Und sieh, einer von denen, die bei Jesus waren, streckte die Hand aus, zog sein Schwert, schlug den Sklaven[a] des Hohenpriesters und hieb ihm das Ohr ab.
  rationale: Eine minimale Korrektur ersetzt „schlug nach dem Sklaven“ durch „schlug den Sklaven“, damit der direkte Objektbezug von πατάξας τὸν δοῦλον ohne Bedeutungsabschwächung wiedergegeben wird. Text, Fußnotenanker und lexikalische Alternative bleiben ansonsten unverändert.
