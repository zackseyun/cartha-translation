lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Als es Abend geworden war
  rationale: Der Genitivus absolutus gibt den zeitlichen Rahmen an. Die Formulierung ist natürliches Deutsch und bewahrt den Eintritt des Abends als vorausgehenden Umstand.
- source_word: ἀνέκειτο
  choice: lag er … zu Tisch
  rationale: Das Verb bezeichnet das Liegen beziehungsweise Zurücklehnen bei einer Mahlzeit. „Zu Tisch liegen“ gibt die antike Esshaltung präziser wieder als „sitzen“ und macht den Mahlzeitkontext idiomatisch deutlich.
- source_word: μετὰ
  choice: mit
  rationale: Mit dem Genitiv bedeutet μετά hier schlicht „mit“.
- source_word: τῶν δώδεκα μαθητῶν
  choice: den zwölf Jüngern
  rationale: μαθητῶν steht im SBLGNT-Haupttext und wird mit der im Evangelienkontext etablierten deutschen Bezeichnung „Jünger“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lag … zu Tisch“ bewahrt den historischen Mahlzeitbrauch, ohne umständlich zu wirken; der Fußnotenmarker steht unmittelbar nach dem Satz.
