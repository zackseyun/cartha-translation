  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: de
  text: 'Während sie aßen, sagte er: „Amen, ich sage euch: Einer von euch wird mich verraten[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „wird mich ausliefern“ oder „wird mich übergeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Während sie aßen
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig stattfindende Handlung. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den zeitlichen Bezug.
- source_word: Ἀμὴν
  choice: Amen
  rationale: Am Anfang eines Jesuswortes dient ἀμήν als feierliche Bekräftigung seiner folgenden Aussage. „Amen“ bewahrt die markante Form des Ausdrucks und ist im Deutschen verständlich.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte und feierliche Anrede wird mit der im Deutschen geläufigen Formel genau wiedergegeben.
- source_word: εἷς ἐξ ὑμῶν
  choice: Einer von euch
  rationale: Diese natürliche deutsche Formulierung gibt den partitiven Ausdruck klar und vollständig wieder.
- source_word: παραδώσει
  choice: wird mich verraten
  rationale: Das Verb kann allgemein „übergeben“ oder „ausliefern“ bedeuten; im Zusammenhang mit Judas’ treulosem Handeln trifft „verraten“ den kontextuellen Sinn. Die breitere Grundbedeutung bleibt in der Fußnote sichtbar.
- source_word: με
  choice: mich
  rationale: Das Akkusativpronomen bezieht sich unmittelbar auf Jesus und wird ohne Erweiterung wiedergegeben.
theological_decisions:
- issue: Wiedergabe von παραδώσει im Passionszusammenhang
  choice: wird mich verraten
  alternative: wird mich ausliefern / wird mich übergeben
  rationale: Der griechische Ausdruck bezeichnet zunächst das Übergeben oder Ausliefern, meint hier jedoch die treulose Handlung eines Jüngers gegen Jesus. „Verraten“ vermittelt diesen Kontext natürlich, während die Fußnote die lexikalische Breite bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der charakteristische Auftakt „Amen, ich sage euch“ bleibt erhalten. Der Fußnotenmarker steht unmittelbar bei „verraten“, da sich die lexikalische Alternative auf παραδώσει bezieht.
