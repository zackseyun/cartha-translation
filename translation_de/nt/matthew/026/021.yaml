  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes sachgerecht wieder: den gleichzeitigen Handlungsrahmen des Genitivus absolutus („Während sie aßen“), die feierliche Einleitung Ἀμήν λέγω ὑμῖν, den partitiven Ausdruck „Einer von euch“ und das Futur von παραδώσει. „Verraten“ ist in diesem Kontext eine treffende kontextuelle Wiedergabe; die Fußnote wahrt die weitere lexikalische Bedeutung von παραδίδωμι.'
  naturalness: „Während sie aßen, sagte er“ ist flüssiges modernes Standarddeutsch. „Amen, ich sage euch“ ist als bewusst feierliche, im Deutschen gut etablierte Jesuswortformel idiomatisch und registergerecht.
