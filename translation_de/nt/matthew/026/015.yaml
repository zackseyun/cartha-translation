source:
  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: de
  text: 'Er sagte: »Was seid ihr bereit, mir zu geben? Und ich werde ihn euch ausliefern[a].« Da wogen sie ihm dreißig Silberstücke ab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verraten«. Das griechische Verb kann »übergeben«, »ausliefern« oder in diesem Zusammenhang »verraten« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Was seid ihr bereit, mir zu geben?
  rationale: θέλω bezeichnet hier Bereitschaft beziehungsweise Willen. Die Formulierung gibt den Verhandlungscharakter natürlich wieder, ohne den Satz auf eine bloße Zukunftsfrage zu reduzieren.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: Dann werde ich ihn euch ausliefern
  rationale: παραδίδωμι bedeutet grundsätzlich »übergeben« oder »ausliefern« und bezeichnet im Kontext zugleich den Verrat. »Ausliefern« bewahrt die konkrete Handlung, ohne die moralische Deutung vollständig in das Verb hineinzulegen.
- source_word: οἱ δὲ
  choice: Da
  rationale: δέ ist ein schwaches narratives Bindewort. »Da« verbindet Angebot und Reaktion im Deutschen flüssig, ohne einen Gegensatz zu behaupten.
- source_word: ἔστησαν αὐτῷ
  choice: wogen sie ihm … ab
  rationale: Die Wendung bezeichnet hier das Zumessen beziehungsweise Festsetzen der Zahlung. »Wogen … ab« bewahrt den konkreten antiken Zahlungsvorgang mit Silber, statt lediglich allgemein von Bezahlen zu sprechen.
- source_word: τριάκοντα ἀργύρια
  choice: dreißig Silberstücke
  rationale: ἀργύρια bezeichnet silbernes Geld beziehungsweise Silberstücke, ohne im Vers eine bestimmte Münzsorte zu nennen. »Silberstücke« ist präzise und verständlich.
theological_decisions:
- issue: Wiedergabe von παραδώσω in Judas’ Angebot
  choice: ausliefern
  alternative: verraten / übergeben
  rationale: »Ausliefern« erhält die lexikalische Breite und bezeichnet die konkrete Übergabe an die Autoritäten. Dass diese Handlung Verrat ist, ergibt sich aus dem Zusammenhang; die Fußnote nennt diese kontextuelle Wiedergabe ausdrücklich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und verhandlungsartig; es wird keine nicht im Griechischen genannte Münzsorte ergänzt.
