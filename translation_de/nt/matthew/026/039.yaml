reference: Matthew 26:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: de
  text: 'Und er ging ein wenig weiter, warf sich mit dem Gesicht zur Erde nieder[a], betete und sagte: „Mein Vater, wenn es möglich ist, lass diesen Kelch an mir vorübergehen[b]. Doch nicht wie ich will, sondern wie du.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fiel auf sein Gesicht“; gemeint ist, dass er sich mit dem Gesicht zur Erde niederwarf.'
    reason: lexical_alternative
  - marker: b
    text: Der „Kelch“ ist ein biblisches Bild für einen zugemessenen Anteil, besonders für Leiden; vergleiche Matthäus 20,22 und 26,42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: ging ein wenig weiter
  rationale: Die Form bezeichnet eine kurze Bewegung nach vorn; die deutsche Wendung ist natürlich und bewahrt den Sinn des Weitergehens.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: warf sich mit dem Gesicht zur Erde
  rationale: Die Wendung beschreibt eine Niederwerfung. Diese Formulierung gibt die Körperhaltung klar und würdevoll wieder, ohne einen unbeabsichtigten Sturz nahezulegen.
- source_word: προσευχόμενος καὶ λέγων
  choice: betete und sagte
  rationale: Die gleichzeitigen Partizipien werden in natürlichem deutschem Erzählstil als koordinierte Verben wiedergegeben.
- source_word: Πάτερ μου
  choice: Mein Vater
  rationale: Die Anrede bewahrt sowohl die persönliche Nähe als auch den ehrfürchtigen Ton, ohne zusätzliche emotionale Färbung.
- source_word: εἰ δυνατόν ἐστιν
  choice: wenn es möglich ist
  rationale: Dies entspricht dem vollständigen griechischen Bedingungssatz und lässt offen, worauf die Möglichkeit beruht.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: lass … an mir vorübergehen
  rationale: Der Imperativ trägt hier den Sinn einer Bitte. Die Formulierung bewahrt das Bild des vorübergehenden Kelches in idiomatischem Deutsch.
- source_word: τὸ ποτήριον τοῦτο
  choice: diesen Kelch
  rationale: Das konkrete Bild wird beibehalten, da es biblische Bezüge und eine bewusst nicht vollständig ausgedeutete Bedeutung trägt.
- source_word: πλὴν
  choice: doch
  rationale: Das Wort leitet eine starke Einschränkung der vorausgehenden Bitte ein; „doch“ ist knapp, natürlich und feierlich.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: nicht wie ich will, sondern wie du
  rationale: Die parallele, elliptische Gestalt des Griechischen bleibt erhalten. Im Deutschen ist das ausgelassene „willst“ eindeutig verständlich und bewahrt die markante Kürze.
theological_decisions:
- issue: Das Bild des Kelches in Jesu Gebet
  choice: Das wörtliche Bild „diesen Kelch“ bleibt im Haupttext erhalten.
  alternative: dieses Leiden; dieses Schicksal
  rationale: ποτήριον bezeichnet wörtlich einen Kelch, wird hier jedoch bildlich für einen zugemessenen Anteil gebraucht. Eine ausdeutende Wiedergabe würde die biblischen Bezüge und den Bedeutungsumfang verengen.
- issue: Jesu Wille im Verhältnis zum Willen des Vaters
  choice: θέλω wird mit „will“ wiedergegeben; die Ellipse „wie du“ bleibt bestehen.
  alternative: möchte; nicht was ich will, sondern was du willst
  rationale: „Will“ bewahrt die echte Willensäußerung und ihre Unterordnung, ohne sie zu bloßer Vorliebe abzuschwächen. Die griechische Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das traditionelle biblische Bild „Kelch“ und die knappe Parallelstruktur des Schlusses werden bewahrt; altertümliche Formen werden vermieden.
