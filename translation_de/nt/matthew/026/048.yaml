id: MAT.26.48
reference: Matthew 26:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: de
  text: 'Der ihn verriet[a], hatte ihnen ein Zeichen[b] gegeben und gesagt: »Wen ich küsse, der ist es. Den ergreift!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Der ihn auslieferte“. Das griechische Verb bedeutet grundsätzlich „übergeben“ oder „ausliefern“, bezeichnet hier im Zusammenhang jedoch den Verrat des Judas.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Signal“. Das Zeichen diente ihnen dazu, die betreffende Person bei der Festnahme zu erkennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: der ihn verriet
  rationale: Das Partizip bezeichnet hier Judas als denjenigen, der Jesus den Gegnern übergibt. „Verriet“ gibt in diesem Passionskontext die moralische Tragweite idiomatisch wieder; die grundsätzlich mögliche Bedeutung „auslieferte“ bleibt in einer Fußnote sichtbar.
- source_word: σημεῖον
  choice: Zeichen
  rationale: Das Zeichen dient als vorher vereinbartes Erkennungssignal. „Zeichen“ entspricht dem breiten Bedeutungsumfang des griechischen Wortes; „Signal“ ist hier eine mögliche kontextuelle Wiedergabe.
- source_word: Ὃν ἂν φιλήσω
  choice: Wen ich küsse
  rationale: Die Verbindung aus Relativpronomen, ἄν und Aorist Konjunktiv ist indefinit und verweist auf die bevorstehende identifizierende Handlung. Die deutsche Formulierung ist natürlich und erhält diese offene Identifikation.
- source_word: φιλήσω
  choice: küsse
  rationale: Das Verb bezeichnet unmittelbar einen Kuss. Eine Erweiterung wie „mit einem Kuss begrüße“ würde eine im Griechischen nur kontextuell naheliegende Absicht ausdrücklich machen.
- source_word: αὐτός ἐστιν
  choice: der ist es
  rationale: Die Formulierung identifiziert Jesus knapp und legt durch das vorangestellte αὐτός Nachdruck auf genau diese Person.
- source_word: κρατήσατε
  choice: Den ergreift!
  rationale: κρατέω bezeichnet ein festes Ergreifen oder Festhalten. Im Zusammenhang führt dies zur Festnahme, doch „ergreift“ bewahrt die körperliche und feindselige Färbung, ohne einen modernen rechtlichen Fachausdruck einzutragen.
theological_decisions:
- issue: Moralische Tragweite von παραδιδοὺς in Bezug auf Judas
  choice: „der ihn verriet“
  alternative: „der ihn auslieferte“
  rationale: Im unmittelbaren Passionskontext ist die Übergabe Jesu durch Judas als Verrat dargestellt. „Verriet“ macht diese kontextuelle Wertung verständlich, während die sachlichere lexikalische Alternative in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. „Wen ich küsse, der ist es“ bildet die indefinite Relativkonstruktion natürlich ab; „Den ergreift!“ greift das Bezugswort im Deutschen zur Klarheit wieder auf.
