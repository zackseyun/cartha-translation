  rationale: Die Revision ergänzt das im griechischen Text ausdrücklich vorhandene „begannen“ (ἤρξαντο), während „fragen“ wegen der folgenden direkten Frage idiomatisch bleibt. Die distributive Abfolge, die Intensität der Traurigkeit, die negative Erwartung von μήτι und die Anrede „Herr“ werden beibehalten. Die Fußnote wird auf die semantische Funktion von μήτι beschränkt.
