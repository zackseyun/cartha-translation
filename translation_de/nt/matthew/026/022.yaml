  verdict: revise
  source_fidelity: Die Wiedergabe von λυπούμενοι σφόδρα als „wurden sie sehr traurig“, von εἷς ἕκαστος als „einer nach dem anderen“, von μήτι als „doch nicht etwa“ und von κύριε als „Herr“ ist sachgerecht. Die Fassung lässt jedoch ἤρξαντο („sie begannen“) aus; dieses ingressive Element sollte erhalten bleiben.
  naturalness: Die direkte Rede ist modernes, würdiges Standarddeutsch und die Frage klingt idiomatisch. Mit „begannen, ihn ... zu fragen“ bleibt sie ebenso natürlich und bildet zugleich den Beginn der reihum erfolgenden Fragen ab.
  terminology: „Herr“ ist für κύριε konsistent und wahrt die mögliche über die Höflichkeitsanrede hinausgehende Bedeutung, ohne sie auszudeuten. Die Fußnote erklärt die negative Antworterwartung von μήτι angemessen; „erhofft“ ist dabei unnötig enger als der griechische Fragemodus.
