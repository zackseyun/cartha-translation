  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: de
  text: 'Sie wurden sehr traurig und begannen, ihn einer nach dem anderen zu fragen: »Ich bin es doch nicht etwa, Herr?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Frage mit μήτι erwartet eine verneinende Antwort: »Ich bin es doch nicht etwa, Herr?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: wurden sie sehr traurig
  rationale: Das Partizip mit dem verstärkenden Adverb beschreibt ihre einsetzende beziehungsweise anhaltende tiefe Traurigkeit. Die deutsche Formulierung ist natürlich und gibt die emotionale Stärke klar wieder.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: fragten ihn
  rationale: Wörtlich steht »begannen, zu ihm zu sagen«. Da die folgende Äußerung eine Frage ist und die einzelnen Jünger nacheinander sprechen, gibt »fragten ihn« den Vorgang im Deutschen idiomatisch wieder, ohne den Beginn einer Abfolge eigens auszudrücken.
- source_word: εἷς ἕκαστος
  choice: einer nach dem anderen
  rationale: Die distributive Wendung hebt hervor, dass jeder Einzelne persönlich reagiert; »einer nach dem anderen« vermittelt dies klar und natürlich.
- source_word: Μήτι ἐγώ εἰμι
  choice: Ich bin es doch nicht etwa
  rationale: μήτι kennzeichnet eine Frage, bei der eine verneinende Antwort erwartet oder erhofft wird. »doch nicht etwa« bewahrt diese Erwartung und die beunruhigte Selbstfrage.
- source_word: κύριε
  choice: Herr
  rationale: »Herr« ist die naheliegende Wiedergabe der Anrede an Jesus und erhält sowohl ihre respektvolle als auch ihre mögliche titulare Bedeutung.
theological_decisions:
- issue: Wiedergabe von κύριε als Anrede an Jesus
  choice: Herr
  alternative: mein Herr; Meister
  rationale: »Herr« wahrt die im Kontext mögliche theologische und narrative Bedeutung, ohne die Anrede durch »mein« zu erweitern oder sie auf die Bedeutung »Meister« festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt natürlich, bewahrt aber die Unsicherheit und Bestürzung der Jünger.
