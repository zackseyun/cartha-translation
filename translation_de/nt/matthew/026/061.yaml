source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: de
  text: 'Sie sagten: „Dieser Mann sagte: ‚Ich kann den Tempel Gottes niederreißen und ihn in drei Tagen[a] aufbauen.‘“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „innerhalb von drei Tagen“. Der griechische Ausdruck kann die Vollendung innerhalb dieses Zeitraums bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Vgl. Johannes 2,19–21; dort wird Jesu Aussage über den Tempel auf seinen Leib bezogen.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Sie sagten
  rationale: Der Aorist berichtet die Aussage der Zeugen als abgeschlossenes Ereignis; die einfache Vergangenheitsform ist im Deutschen natürlich.
- source_word: Οὗτος
  choice: Dieser Mann
  rationale: Die Formulierung bewahrt die zeigende und im Anklagekontext leicht abwertende Wirkung besser als ein bloßes „er“.
- source_word: ἔφη
  choice: hat gesagt
  rationale: φημί führt hier schlicht die Jesus zugeschriebene Äußerung ein; „hat gesagt“ ist im gesprochenen Vorwurf natürlich und überzeichnet die Aussage nicht.
- source_word: Δύναμαι
  choice: Ich kann
  rationale: „Ich kann“ gibt die ausgedrückte Fähigkeit klar und idiomatisch wieder.
- source_word: καταλῦσαι
  choice: niederreißen
  rationale: Bei einem Bauwerk bezeichnet καταλύω das Abbrechen oder Zerstören; „niederreißen“ bildet zugleich einen natürlichen Gegensatz zu „aufbauen“.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: den Tempel Gottes
  rationale: ναός bezeichnet hier im Wortlaut der Anklage den Tempel beziehungsweise das Heiligtum; „Tempel Gottes“ ist verständlich und wahrt die Genitivverbindung.
- source_word: διὰ τριῶν ἡμερῶν
  choice: innerhalb von drei Tagen
  rationale: διά mit dem Genitiv bezeichnet hier eine Zeitspanne, in deren Verlauf der Bau vollendet werden soll; „innerhalb von“ macht diesen Sinn im Deutschen eindeutig und natürlich.
- source_word: οἰκοδομῆσαι
  choice: ihn wieder aufbauen
  rationale: Das Objekt wird aus dem vorherigen Satzteil ergänzt. Nach dem Niederreißen ist „wieder aufbauen“ im Deutschen idiomatisch; das Präfix „wieder-“ ist kontextuell erschlossen, nicht ausdrücklich im Verb enthalten.
theological_decisions:
- issue: Bezug des Ausdrucks „Tempel Gottes“
  choice: Die Anklage wird ihrem unmittelbaren Wortlaut nach als Aussage über den Tempel wiedergegeben.
  alternative: Die Aussage bereits im Haupttext ausdrücklich auf Jesu Leib und seine Auferstehung beziehen.
  rationale: Matthäus gibt hier die Aussage der Zeugen wieder. Johannes 2,19–21 erläutert eine verwandte Aussage als Hinweis auf Jesu Leib; diese Deutung sollte den Wortlaut der Anklage bei Matthäus jedoch nicht stillschweigend ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar als Zeugenaussage innerhalb der Gerichtsverhandlung erkennbar. „Dieser Mann“ erhält die deiktische, leicht geringschätzige Färbung von Οὗτος; „niederreißen“ und „wieder aufbauen“ bilden ein natürliches deutsches Gegensatzpaar.
