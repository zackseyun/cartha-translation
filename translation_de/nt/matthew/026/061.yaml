  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: „wieder aufbauen“ fügt mit „wieder“ eine im griechischen οἰκοδομῆσαι nicht ausgedrückte Bedeutung hinzu. Die Zeitangabe διὰ τριῶν ἡμερῶν wird im Haupttext mit „in drei Tagen“ wiedergegeben; ihre mögliche Bedeutung „innerhalb von drei Tagen“ wird als Alternative vermerkt.'
  naturalness: „Sie sagten … Dieser Mann sagte“ ist modernes, klares Standarddeutsch im erzählenden Gerichts- bzw. Zeugenkontext. Die verschachtelte direkte Rede und die Platzierung der Anmerkungszeichen sind eindeutig.
  terminology: „Tempel Gottes“ gibt τὸν ναὸν τοῦ θεοῦ angemessen wieder. „Niederreißen“ für καταλῦσαι und „aufbauen“ für οἰκοδομῆσαι bilden ein idiomatisches Paar, ohne durch „wieder“ eine ausdrückliche Wiederherstellung zu behaupten.
  issues:
  - severity: medium
    issue: Das Präfix „wieder-“ in „wieder aufbauen“ ist nicht ausdrücklich im griechischen οἰκοδομῆσαι enthalten.
    rationale: Der Kontext kann einen Wiederaufbau nahelegen, doch der Wortlaut sagt lediglich „bauen“. Die Übersetzung sollte diese Ergänzung nicht im Haupttext festschreiben.
  - severity: low
    issue: Die bisherige Anmerkung a behandelt „wieder“, während die englische Auditspur für diese Stelle die zeitliche Alternative zu διὰ τριῶν ἡμερῶν dokumentiert.
    rationale: Die Fußnote wird auf die tatsächlich relevante, im Deutschen sinnvoll markierbare Zeitangabe ausgerichtet und direkt dort verankert.
