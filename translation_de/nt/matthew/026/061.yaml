- from: 'Sie sagten: „Dieser Mann hat gesagt: ‚Ich kann den Tempel Gottes niederreißen und ihn innerhalb von drei Tagen wieder aufbauen.‘“[a][b]'
  to: 'Sie sagten: „Dieser Mann sagte: ‚Ich kann den Tempel Gottes niederreißen und ihn in drei Tagen[a] aufbauen.‘“[b]'
  rationale: Die Übersetzung entfernt allein die nicht explizite Zusatzbedeutung „wieder“ und ersetzt die dazugehörige, nun gegenstandslose Fußnote durch die quellenrelevante zeitliche Alternative. Die Aussage bleibt als Behauptung der Zeugen wiedergegeben; die johanneische Deutung bleibt ausschließlich in der Querverweis-Anmerkung.
