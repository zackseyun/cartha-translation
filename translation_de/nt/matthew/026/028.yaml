id: MAT.26.28
reference: Matthew 26:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: de
  text: Denn dies ist mein Blut des Bundes[a], das für viele[b] ausgegossen wird zur Vergebung der Sünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „mein Blut des neuen Bundes“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „zugunsten vieler“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: dies
  rationale: Das Demonstrativpronomen wird ohne den im griechischen Satz nicht enthaltenen Zusatz „der Kelch“ wiedergegeben und verweist auf das beim Mahl Dargereichte.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ bewahrt die begründende Verbindung zur vorausgehenden Aufforderung zu trinken.
- source_word: τὸ αἷμά μου
  choice: mein Blut
  rationale: Die direkte Wiedergabe erhält die Opfer- und Bundesthematik, ohne sie paraphrasierend abzuschwächen.
- source_word: τῆς διαθήκης
  choice: des Bundes
  rationale: Der vorliegende SBLGNT-Text enthält kein καινῆς („neu“); die abweichende Lesart wird deshalb nur in einer Fußnote genannt.
- source_word: περὶ πολλῶν
  choice: für viele
  rationale: Im Opferzusammenhang gibt „für viele“ den Bezug beziehungsweise das Handeln zugunsten vieler idiomatisch wieder und bewahrt zugleich die mögliche Anspielung auf die Gottesknecht-Texte.
- source_word: ἐκχυννόμενον
  choice: das … ausgegossen wird
  rationale: Der Relativsatz gibt das passive Präsenspartizip natürlich wieder. „Ausgegossen“ hält das konkrete Bild des griechischen Verbs deutlicher fest als das traditionellere „vergossen“.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: zur Vergebung der Sünden
  rationale: Diese geläufige und verständliche Formulierung wahrt die Ziel- beziehungsweise Ergebnisrichtung von εἰς, ohne sie unnötig festzulegen.
theological_decisions:
- issue: Ob „neu“ vor „Bund“ in den Haupttext gehört
  choice: des Bundes
  alternative: des neuen Bundes
  rationale: Die zugrunde gelegte griechische Textfassung hat lediglich τῆς διαθήκης. Die verbreitete längere Lesart wird dokumentiert, aber nicht aus Parallelüberlieferung oder späterer Texttradition in den Haupttext übernommen.
- issue: Reichweite der Aussage „für viele“
  choice: für viele
  alternative: für alle
  rationale: πολλῶν bedeutet „viele“. Die Übersetzung bewahrt diese Formulierung und entscheidet damit nicht über weitergehende theologische Fragen zur Reichweite des Sühnehandelns.
- issue: Bedeutungsnuance von περί mit Genitiv
  choice: für viele
  alternative: zugunsten vieler
  rationale: Die knappe deutsche Wendung ist natürlich und kann den stellvertretenden beziehungsweise begünstigenden Sinn im Kontext tragen; die ausdrücklichere Alternative wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem Deutsch, während die prägnante Bundes-, Blut- und Vergebungssprache des Ausgangstextes erhalten bleibt.
