  source_fidelity: 'Die Aussage wird im Wesentlichen zutreffend wiedergegeben: ἐσιώπα bezeichnet Jesu andauerndes Schweigen, Ἐξορκίζω ... κατὰ τοῦ θεοῦ τοῦ ζῶντος eine feierliche Verpflichtung unter Anrufung Gottes, und die beiden Titel sind korrekt übertragen. Das einleitende δέ ist mit »aber« angemessen erfasst.'
  naturalness: Die Sprache ist verständlich und würdevoll. »Der Hohepriester« ist jedoch im heutigen Standarddeutsch als Zusammensetzung die übliche Schreibung; »der Hohe Priester« wirkt uneinheitlich und weniger idiomatisch. Außerdem entspricht »Und« für das griechische καί dem einfachen narrativen Anschluss genauer als das stärker folgernde »Da«.
  terminology: »Messias« für ὁ χριστός und »der Sohn Gottes« für ὁ υἱὸς τοῦ θεοῦ sind sachgerecht. »Ich beschwöre dich bei dem lebendigen Gott« bewahrt den feierlichen Charakter der Formel, ohne den exorzistischen Sinn von beschwören aufzurufen. Die Fußnote zu »Messias« ist korrekt verankert und stellt »Christus« als Alternative bereit.
