source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: de
  text: 'Jesus aber schwieg weiter. Und der Hohepriester sagte zu ihm: »Ich beschwöre dich bei dem lebendigen Gott: Sag uns, ob du der Messias[a], der Sohn Gottes, bist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Christus«. Das griechische Wort Christos bedeutet »Gesalbter« und wird hier als Titel gebraucht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσιώπα
  choice: schwieg weiter
  rationale: Der Imperfekt bezeichnet hier das anhaltende Schweigen Jesu; »schwieg weiter« gibt diesen Aspekt natürlich und knapp wieder.
- source_word: ἀρχιερεὺς
  choice: Hohe Priester
  rationale: Die etablierte deutsche Bezeichnung für das jüdische oberste Priesteramt in diesem Verhörkontext.
- source_word: Ἐξορκίζω σε
  choice: Ich beschwöre dich
  rationale: Das Verb bezeichnet hier keine Austreibung, sondern eine feierliche, durch Anrufung Gottes bekräftigte Verpflichtung zur Aussage. »Ich beschwöre dich« wahrt die Formel und bleibt verständlich.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: bei dem lebendigen Gott
  rationale: In Verbindung mit ἐξορκίζω benennt die Wendung die feierliche Anrufung Gottes; die deutsche Schwurformel »bei dem lebendigen Gott« entspricht ihrer Funktion.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: Sag uns
  rationale: Die ἵνα-Konstruktion gibt den Inhalt der feierlichen Aufforderung an; der deutsche Imperativ ist idiomatisch und erhält den direkten Nachdruck.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός fungiert hier eindeutig als Titel des erwarteten Gesalbten, nicht als Eigenname. »Messias« macht diese titular-messianische Bedeutung im Deutschen unmittelbar erkennbar.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Die feste christologische Titelformulierung wird direkt und ohne erklärende Erweiterung wiedergegeben.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Jesus aber
  rationale: δέ markiert den Kontrast zum vorausgehenden Verhör; die Wortstellung »Jesus aber« ist würdig, natürlich und textnah.
theological_decisions:
- issue: Wiedergabe von Χριστός in der christologischen Verhörfrage
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck steht mit Artikel und fungiert als Titel. »Messias« wahrt den Bezug auf den erwarteten Gesalbten; die traditionelle Alternative »Christus« wird in einer Fußnote erhalten.
- issue: Kraft der Formel Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: 'feierliche Verpflichtungsformel: »Ich beschwöre dich bei dem lebendigen Gott«'
  alternative: »Ich stelle dich unter Eid bei dem lebendigen Gott«
  rationale: Die Formulierung ist eine förmliche Adjuration mit Anrufung Gottes. »Beschwöre« erhält ihre Feierlichkeit, ohne eine übermäßig moderne juristische Terminologie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das anhaltende Schweigen wird durch »schwieg weiter« sichtbar gemacht. Die feierliche Gerichts- und Schwursprache bleibt mit »beschwöre dich« erhalten, ohne altertümlich unverständlich zu werden.
