  text: τότε ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ καὶ ἐκολάφισαν αὐτόν, οἱ δὲ ἐράπισαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: de
  text: Da spuckten sie ihm ins Gesicht und schlugen ihn mit den Fäusten; andere aber gaben ihm Ohrfeigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Das temporale Adverb führt in der Erzählung unmittelbar zum nächsten Geschehen; „Da“ ist knapp, natürlich und wahrt den narrativen Fortgang.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: spuckten sie ihm ins Gesicht
  rationale: Die griechische Wendung bezeichnet das direkte Spucken ins beziehungsweise auf das Gesicht. Die deutsche idiomatische Formulierung „jemandem ins Gesicht spucken“ bewahrt die konkrete Entehrung.
- source_word: ἐκολάφισαν αὐτόν
  choice: schlugen ihn mit den Fäusten
  rationale: κολαφίζω bezeichnet hier Faustschläge. Die explizite Wiedergabe macht die Art der Misshandlung klar, ohne umgangssprachlich zu wirken.
- source_word: οἱ δὲ ἐράπισαν
  choice: andere aber gaben ihm Ohrfeigen
  rationale: Der substantivierte Artikel οἱ weist auf andere Beteiligte hin; δέ markiert den Übergang beziehungsweise eine leichte Gegenüberstellung. ῥαπίζω bezeichnet typischerweise Schläge mit der offenen Hand, was idiomatisch als „Ohrfeigen geben“ wiedergegeben wird. Das im Griechischen unausgesprochene Objekt wird aus dem Kontext ergänzt.
theological_decisions:
- issue: Darstellung der Misshandlung Jesu vor dem Hohen Rat
  choice: Die einzelnen Handlungen konkret als Anspucken, Faustschläge und Ohrfeigen wiedergeben.
  alternative: Die Misshandlung mit allgemeineren Ausdrücken wie „sie schlugen ihn“ oder „sie misshandelten ihn“ zusammenfassen.
  rationale: Der griechische Text schildert Erniedrigung und körperliche Gewalt konkret. Eine genaue Wiedergabe bewahrt die narrative Härte, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Da“ hält den Vers eng am vorangehenden Geschehen; das Semikolon bildet den Wechsel zu den anderen Handelnden klar ab.
