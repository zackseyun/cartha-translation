id: MAT.26.25
reference: Matthew 26:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: de
  text: 'Da antwortete Judas, der ihn auslieferte, und sagte: „Ich bin es doch nicht etwa, Rabbi?“ Jesus sagte zu ihm: „Du sagst es.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: der ihn auslieferte
  rationale: Das präsentische Partizip kennzeichnet Judas als denjenigen, der Jesus ausliefert; „ausliefern“ gibt παραδίδωμι in diesem Zusammenhang treffend und natürlich wieder.
- source_word: Μήτι ἐγώ εἰμι
  choice: Ich bin es doch nicht etwa?
  rationale: Μήτι signalisiert, dass eine verneinende Antwort erwartet oder zumindest nahegelegt wird. Die deutsche Formulierung bewahrt zugleich die nervöse, ausweichende Frage.
- source_word: ῥαββί
  choice: Rabbi
  rationale: Der jüdische Anredetitel wird in seiner geläufigen deutschen Form beibehalten.
- source_word: Σὺ εἶπας
  choice: Du sagst es
  rationale: Die knappe, idiomatische Antwort wahrt die indirekte Bestätigung und legt nicht mehr Eindeutigkeit in den Satz, als die griechische Formulierung trägt.
theological_decisions:
- issue: Grad der Bestätigung in Jesu Antwort
  choice: Du sagst es.
  alternative: Ja, du bist es.
  rationale: Σὺ εἶπας ist eine zurückhaltende Bestätigungsformel. Eine ausdrückliche Ja-Antwort würde die im Wortlaut vorhandene indirekte Spannung auflösen.
- issue: Zeitbezug der Kennzeichnung des Judas
  choice: der ihn auslieferte
  alternative: der ihn verraten würde
  rationale: Die Übersetzung folgt dem präsentischen Partizip und vermeidet eine unnötige Verschiebung ins Futur. „Ausliefern“ bezeichnet zudem die konkrete Handlung, ohne den moralischen Gehalt auszublenden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im Griechischen formelhafte „antwortete und sagte“ wird natürlich zu „fragte“ verdichtet; der Sprecher der abschließenden Antwort wird zur Klarheit als Jesus bezeichnet, da das griechische Verb nur durch den Kontext auf ihn verweist.
