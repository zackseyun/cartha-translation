id: MAT.26.34
reference: Matthew 26:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Amen, ich sage dir: Noch in dieser Nacht, ehe ein Hahn kräht, wirst du mich dreimal verleugnen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: Die schlichte deutsche Erzählform gibt das griechische Redeverb und den persönlichen Adressaten natürlich und genau wieder.
- source_word: Ἀμὴν λέγω σοι
  choice: Amen, ich sage dir
  rationale: „Amen“ ist im Deutschen verständlich und bewahrt Jesu charakteristische, feierliche Einleitungsformel; „ich sage dir“ hält die direkte Anrede fest.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: noch in dieser Nacht
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf genau diese Nacht und klingt zugleich natürlich; „noch“ verdeutlicht den zeitlichen Rahmen, ohne die Aussage inhaltlich zu erweitern.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: ehe ein Hahn kräht
  rationale: Der Infinitivsatz wird idiomatisch als deutscher Nebensatz wiedergegeben. Da ἀλέκτορα artikellos steht, ist „ein Hahn“ eine naheliegende, aber nicht zwingend ausschließliche Wiedergabe.
- source_word: τρὶς
  choice: dreimal
  rationale: Dies ist die klare und übliche moderne deutsche Entsprechung.
- source_word: ἀπαρνήσῃ με
  choice: wirst du mich verleugnen
  rationale: „Verleugnen“ ist im Zusammenhang mit Petrus die präzise und im Deutschen geläufige Wiedergabe für die angekündigte Zurückweisung beziehungsweise Leugnung der Beziehung zu Jesus.
theological_decisions:
- issue: Jesu Einleitungsformel Ἀμὴν λέγω σοι
  choice: Amen, ich sage dir
  alternative: Wahrlich, ich sage dir; Ich versichere dir
  rationale: Die gewählte Fassung erhält die markante semitische Formel und ihren feierlichen Autoritätsanspruch, ohne sie durch eine erklärende Umschreibung abzuschwächen oder konfessionell auszudeuten.
- issue: Artikellosigkeit bei ἀλέκτορα
  choice: ein Hahn
  alternative: der Hahn
  rationale: Der griechische Text legt keinen bestimmten Artikel fest. „Ein Hahn“ bildet diese Offenheit im Deutschen gut ab; „der Hahn“ wäre sprachlich ebenfalls möglich, würde aber eine stärkere Bestimmtheit ausdrücken.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Ehe“ ist gehoben, aber weiterhin geläufig; „Amen“ bewahrt bewusst die charakteristische Redeform Jesu.
