reference: Matthew 26:55
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: de
  text: 'In jener Stunde sagte Jesus zu den Menschenmengen: »Ihr seid mit Schwertern und Knüppeln ausgezogen, um mich festzunehmen, als wäre ich ein Räuber[a]. Tag für Tag saß ich im Tempel und lehrte, und ihr habt mich nicht ergriffen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bandit« oder »Aufständischer«. Das griechische Wort kann einen gewalttätigen Räuber oder in manchen Zusammenhängen auch einen Rebellen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: In jener Stunde
  rationale: Bewahrt die zeitliche Unmittelbarkeit und die formale Prägung des griechischen Ausdrucks in natürlichem Deutsch.
- source_word: τοῖς ὄχλοις
  choice: zu den Menschenmengen
  rationale: Gibt den griechischen Plural wieder; „Menschenmengen“ ist verständlicher und würdiger als das heute teils negativ klingende „Massen“.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: als wäre ich ein Räuber
  rationale: Gibt die rhetorische Vergleichskonstruktion idiomatisch wieder, ohne die mögliche Bedeutung gewalttätiger Bandit oder Aufständischer im Haupttext festzulegen.
- source_word: ἐξήλθατε
  choice: ihr seid … ausgezogen
  rationale: „Ausziehen“ entspricht der Bewegung einer zur Festnahme aufgebrochenen bewaffneten Gruppe und bewahrt den Aorist als abgeschlossene Handlung.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: mit Schwertern und Knüppeln
  rationale: „Schwerter“ ist die klare übliche Wiedergabe; ξύλα bezeichnet hier hölzerne Schlagwaffen, daher „Knüppel“ statt des zu allgemeinen „Stöcke“.
- source_word: συλλαβεῖν με
  choice: um mich festzunehmen
  rationale: Bezeichnet im Kontext den Zweck des bewaffneten Vorgehens natürlich und präzise.
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Bewahrt den distributiven und rhetorisch betonten Sinn des griechischen Ausdrucks.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν meint den Tempelbezirk, doch „im Tempel“ ist im Deutschen die natürliche umfassende Bezeichnung und behauptet nicht, Jesus habe sich im inneren Heiligtum befunden.
- source_word: ἐκαθεζόμην διδάσκων
  choice: saß ich … und lehrte
  rationale: Gibt die andauernde beziehungsweise gewohnheitsmäßige Tätigkeit des Imperfekts und die gleichzeitige Handlung des Partizips flüssig wieder.
- source_word: οὐκ ἐκρατήσατέ με
  choice: ihr habt mich nicht ergriffen
  rationale: Bewahrt gegenüber „festnehmen“ die lexikalische Unterscheidung zwischen συλλαμβάνω und κρατέω und passt zur rückblickenden Aussage.
theological_decisions:
- issue: Bedeutungsumfang von λῃστής
  choice: Räuber
  alternative: Bandit oder Aufständischer
  rationale: Der Ausdruck kann einen gewalttätigen Straßenräuber, Banditen oder in bestimmten Zusammenhängen einen Aufständischen bezeichnen. „Räuber“ bleibt als zugängliche Hauptbedeutung offen genug; die politisch zugespitzte Lesart wird nicht in den Text hineingetragen, sondern als Alternative vermerkt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede bleibt rhetorisch kraftvoll; „als wäre ich ein Räuber“ vermeidet die im Deutschen steife Lehnkonstruktion „wie gegen einen Räuber“. Der Plural „Menschenmengen“ folgt dem Ausgangstext.
