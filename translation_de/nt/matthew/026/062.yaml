  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: de
  text: 'Da stand der Hohepriester auf und sagte zu ihm: »Antwortest du nichts? Was sagen diese Männer gegen dich aus?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand ... auf
  rationale: Das Aoristpartizip bezeichnet hier die körperliche Bewegung des Hohepriesters; die finite deutsche Formulierung ist natürlich und bewahrt die dramatische Wirkung.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohepriester
  rationale: Die übliche und sachlich genaue Bezeichnung für dieses jüdische Amt im Singular.
- source_word: εἶπεν αὐτῷ
  choice: sagte zu ihm
  rationale: Bewahrt das Pronomen des griechischen Textes, ohne den Namen Jesus erklärend einzusetzen.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Antwortest du nichts?
  rationale: Gibt die knappe, vorwurfsvolle Frage und die Verneinung οὐδέν unmittelbar wieder; im Deutschen ist diese Form zugleich verständlich und idiomatisch.
- source_word: τί
  choice: Was
  rationale: Entspricht dem einfachen Fragepronomen und vermeidet eine unnötig umständliche Spaltsatzkonstruktion.
- source_word: οὗτοί
  choice: diese Männer
  rationale: Das maskuline Demonstrativpronomen bezeichnet die anwesenden männlichen Zeugen; das Substantiv wird im Deutschen zur Klarheit ergänzt.
- source_word: σου ... καταμαρτυροῦσιν
  choice: sagen ... gegen dich aus
  rationale: 'Die Wendung gibt den forensischen Sinn des Verbs mit dem Genitiv natürlich wieder: Es handelt sich um belastende Zeugenaussagen gegen Jesus.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte und konfrontative Kürze der beiden Fragen bleibt erhalten; »gegen dich aussagen« wahrt den gerichtlichen Kontext.
