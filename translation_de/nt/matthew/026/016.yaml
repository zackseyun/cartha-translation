source:
  edition: SBLGNT
  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: de
  text: Und von da an suchte er nach einer Gelegenheit, ihn auszuliefern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn zu verraten“. Das griechische Verb bedeutet wörtlicher „jemanden übergeben“ oder „ausliefern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: von da an
  rationale: Gibt den zeitlichen Ausgangspunkt und die fortdauernde Perspektive von ἀπό + τότε natürlich und präzise wieder.
- source_word: ἐζήτει
  choice: suchte
  rationale: Das deutsche Präteritum bezeichnet im Erzählzusammenhang die im griechischen Imperfekt ausgedrückte fortdauernde Suche; die Verbindung „nach einer Gelegenheit suchen“ ist idiomatisch.
- source_word: εὐκαιρίαν
  choice: eine Gelegenheit
  rationale: Bezeichnet einen günstigen oder geeigneten Zeitpunkt; „Gelegenheit“ ist im Deutschen klar und lässt die im Kontext erkennbare günstige Eignung mitschwingen.
- source_word: ἵνα
  choice: ihn auszuliefern
  rationale: Der Infinitiv mit „zu“ gibt den von ἵνα eingeleiteten Zweck im Deutschen knapp und natürlich wieder.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Akkusativpronomen verweist im Kontext auf Jesus.
- source_word: παραδῷ
  choice: auszuliefern
  rationale: „Ausliefern“ bewahrt die Grundbedeutung von παραδίδωμι, jemanden in die Gewalt anderer zu übergeben, und vermeidet die interpretative Verengung auf „verraten“.
theological_decisions:
- issue: Wiedergabe von παραδῷ im Zusammenhang mit Judas
  choice: auszuliefern
  alternative: zu verraten
  rationale: Judas’ Handlung ist sachlich Verrat, doch παραδίδωμι bezeichnet zunächst das Übergeben beziehungsweise Ausliefern. Der Haupttext wahrt diese breitere Bedeutung; die kontextuell zutreffende Deutung „verraten“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Von da an“ und „nach einer Gelegenheit suchen“ sind natürlich; „ausliefern“ erhält die lexikalische Breite und die Spannung des griechischen Ausdrucks.
