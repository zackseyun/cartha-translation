id: MAT.26.73
reference: Matthew 26:73
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: de
  text: 'Kurze Zeit später kamen die Umstehenden auf Petrus zu und sagten: »Du gehörst wirklich auch zu ihnen; denn deine Sprechweise[a] verrät dich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Akzent«. Das griechische Wort kann Sprache, Sprechweise oder Akzent bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Kurze Zeit später
  rationale: Die temporale Wendung bezeichnet einen kurzen zeitlichen Abstand; die gewählte Formulierung ist natürlich und präzise.
- source_word: δὲ
  choice: —
  rationale: δέ führt hier die Erzählung leicht weiter und muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: προσελθόντες
  choice: kamen ... auf Petrus zu
  rationale: Gibt die auf Petrus gerichtete Annäherung des Aoristpartizips idiomatisch wieder.
- source_word: οἱ ἑστῶτες
  choice: die Umstehenden
  rationale: Bezeichnet knapp und sachlich diejenigen, die dort standen.
- source_word: Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Du gehörst wirklich auch zu ihnen
  rationale: Bewahrt sowohl die nachdrückliche Gewissheit von ἀληθῶς als auch die einschließende Bedeutung von καὶ σὺ und gibt ἐξ αὐτῶν idiomatisch als Gruppenzugehörigkeit wieder.
- source_word: καὶ γὰρ
  choice: denn
  rationale: γάρ begründet die Behauptung. Das καί kann hier verstärkend verstanden werden, ist im Deutschen jedoch nicht zwingend gesondert auszudrücken.
- source_word: ἡ λαλιά σου
  choice: deine Sprechweise
  rationale: λαλιά kann Sprache, Sprechweise oder Akzent bezeichnen. »Sprechweise« bewahrt die lexikalische Breite, ohne den Kontext vorschnell auf den Akzent zu verengen.
- source_word: δῆλόν σε ποιεῖ
  choice: verrät dich
  rationale: Die Wendung bedeutet wörtlich, dass Peters Sprechweise ihn erkennbar macht. »Verrät dich« ist im Deutschen natürlich und trifft die Funktion im Kontext.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Erzählsprache. Die direkte Rede klingt bestimmt und anklagend. Die Fußnote erhält die Bedeutungsbreite von λαλιά.
