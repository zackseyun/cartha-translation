  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: de
  text: 'Sie sagten jedoch immer wieder: »Nicht während des Festes, damit es keinen Aufruhr unter dem Volk gibt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sie sagten immer wieder
  rationale: Der Imperfekt bezeichnet hier die fortdauernde oder wiederholte Äußerung in der Beratung; die Formulierung gibt diesen Aspekt in natürlichem Deutsch wieder.
- source_word: δέ
  choice: jedoch
  rationale: Kennzeichnet einen milden Gegensatz beziehungsweise eine Weiterführung gegenüber dem vorherigen Vers.
- source_word: Μὴ
  choice: Nicht
  rationale: Die elliptische Verneinung drückt den Beschluss aus, dass die geplante Tat nicht zu diesem Zeitpunkt geschehen soll.
- source_word: ἐν τῇ ἑορτῇ
  choice: während des Festes
  rationale: ἐν mit Dativ ist temporal zu verstehen; »Fest« bezeichnet im Kontext das Passafest und bleibt zugleich nahe am allgemeinen Bedeutungsumfang von ἑορτή.
- source_word: ἵνα μὴ
  choice: damit ... keinen
  rationale: Gibt die beabsichtigte Vermeidung idiomatisch wieder, ohne den finalen Sinn der Konstruktion aufzugeben.
- source_word: θόρυβος
  choice: Aufruhr
  rationale: Bezeichnet öffentliche Unruhe oder Tumult; »Aufruhr« wahrt die mögliche Ernsthaftigkeit, ohne zwingend einen voll entwickelten Aufstand zu behaupten.
- source_word: γένηται
  choice: es ... gibt
  rationale: Die deutsche Existenzkonstruktion gibt das Entstehen beziehungsweise Eintreten des Aufruhrs natürlich wieder.
- source_word: ἐν τῷ λαῷ
  choice: unter dem Volk
  rationale: Bezeichnet Unruhe innerhalb der versammelten Bevölkerung; »unter dem Volk« ist idiomatisch und bewahrt λαός als »Volk«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »immer wieder« macht den imperfektiven Aspekt von ἔλεγον verständlich; die direkte Rede bleibt knapp und beratend.
