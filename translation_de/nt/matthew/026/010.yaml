source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: de
  text: 'Jesus aber bemerkte es und sagte zu ihnen: »Warum bereitet ihr der Frau Schwierigkeiten? Denn sie hat eine schöne Tat für mich getan.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn sie hat etwas Gutes an mir getan.«'
    reason: Bewahrt die lexikalische Alternative „gut“ für καλόν sowie die mögliche auf Jesus gerichtete Wiedergabe von εἰς ἐμέ.
lexical_decisions:
- source_word: γνοὺς
  choice: wusste davon
  rationale: Das vorangestellte Aoristpartizip bezeichnet Jesu Wahrnehmung der vorausgehenden Kritik. „Davon“ nimmt den Kontext natürlich auf, ohne den Gegenstand näher festzulegen.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier den milden Kontrast zwischen der Kritik der Jünger und Jesu zurechtweisender Antwort.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: Warum macht ihr der Frau das Leben schwer?
  rationale: Die Verbindung von κόπους und παρέχετε bezeichnet das Verursachen von Mühe, Belastung oder Bedrängnis. Die deutsche Wendung ist gegenwärtig und verständlich und bewahrt den vorwurfsvollen Ton.
- source_word: ἔργον ... καλὸν
  choice: etwas Schönes
  rationale: καλός kann hier sowohl gut als auch schön, edel oder anerkennenswert bedeuten. „Etwas Schönes“ bewahrt die ästhetisch-moralische Wertung und klingt im Deutschen natürlicher als „ein schönes Werk“.
- source_word: ἠργάσατο
  choice: hat ... getan
  rationale: Das Perfekt gibt die abgeschlossene Handlung mit ihrer gegenwärtigen Bedeutung in Jesu Antwort natürlich wieder.
- source_word: εἰς ἐμέ
  choice: an mir
  rationale: εἰς bezeichnet die auf Jesus gerichtete Handlung. „An mir getan“ ist im Deutschen idiomatisch und lässt sowohl die Ausrichtung auf ihn als auch den ihm erwiesenen Dienst erkennen.
theological_decisions:
- issue: Bewertung der Handlung der Frau
  choice: etwas Schönes
  alternative: etwas Gutes; ein edles Werk
  rationale: Die Formulierung gibt Jesu uneingeschränkt positive Würdigung wieder, ohne eine besondere Verdienst- oder Sakramentenlehre in den Text einzutragen.
- issue: Bezug der Handlung auf Jesus
  choice: an mir getan
  alternative: für mich getan
  rationale: „An mir“ bleibt näher an der gerichteten Beziehung von εἰς ἐμέ; „für mich“ kann stärker den Nutzen oder die stellvertretende Absicht betonen und wird deshalb als mögliche Wiedergabe vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist natürlich formuliert; „das Leben schwer machen“ gibt die idiomatische Belastungsaussage deutlich wieder. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Aussage.
