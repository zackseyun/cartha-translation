id: MAT.26.2
reference: Matthew 26:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: de
  text: 'Ihr wisst: Nach zwei Tagen ist das Passafest, und der Menschensohn wird ausgeliefert[a], um gekreuzigt zu werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird verraten“. Das griechische Verb kann einen Verrat bezeichnen, bedeutet aber allgemeiner „ausliefern“ oder „übergeben“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Ihr wisst
  rationale: Das Perfekt von οἶδα hat präsentische Bedeutung; die Anrede in der zweiten Person Plural wird direkt und natürlich wiedergegeben.
- source_word: μετὰ δύο ἡμέρας
  choice: Nach zwei Tagen
  rationale: μετά mit Akkusativ bezeichnet hier einen zeitlichen Abstand. Die Formulierung folgt dem griechischen Wortlaut, ohne die verständlichere deutsche Zeitangabe unnötig auszubauen.
- source_word: τὸ πάσχα
  choice: das Passafest
  rationale: πάσχα bezeichnet hier das jüdische Passa; „Passafest“ ist im heutigen Deutsch klarer als das alleinstehende „Passa“ und bringt keine sachfremde Ergänzung ein.
- source_word: γίνεται
  choice: ist
  rationale: γίνομαι bezeichnet hier das Eintreten beziehungsweise Stattfinden des Festes. In der Verbindung „Nach zwei Tagen ist das Passafest“ gibt „ist“ dies knapp und idiomatisch wieder.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt Jesu Selbstbezeichnung und ihre biblischen Bezüge.
- source_word: παραδίδοται
  choice: wird ausgeliefert
  rationale: Das Präsens Passiv bezeichnet das unmittelbar bevorstehende Geschehen. „Ausgeliefert“ bewahrt den weiteren Sinn von παραδίδωμι und verengt ihn nicht auf den Verrat durch Judas.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: um gekreuzigt zu werden
  rationale: Die Konstruktion mit εἰς und substantiviertem Infinitiv bezeichnet Ziel beziehungsweise Folge; die deutsche Infinitivgruppe gibt dies klar wieder.
theological_decisions:
- issue: Bedeutung von παραδίδοται in der Leidensankündigung
  choice: wird ausgeliefert
  alternative: wird verraten
  rationale: Der Zusammenhang schließt den Verrat des Judas ein, doch das griechische Verb ist weiter gefasst und kann sowohl menschlichen Verrat als auch das Übergeben in fremde Gewalt bezeichnen. „Ausgeliefert“ bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „Ihr wisst“ führt die bekannte Leidensankündigung natürlich ein; die Satzstruktur bleibt eng am griechischen Gedankengang.
