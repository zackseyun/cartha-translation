  naturalness: Die Formulierung ist modernes, verständliches und zugleich würdiges Standarddeutsch. „Nach zwei Tagen ist das Passafest“ ist als bevorstehender Termin idiomatisch; der Doppelpunkt nach „Ihr wisst“ gliedert die Ankündigung klar.
  terminology: „Passafest“ und „Menschensohn“ sind angemessen und etabliert. „Ausgeliefert“ vermeidet eine einengende Festlegung auf Judas als handelnde Person und bewahrt die im griechischen Verb vorhandene Offenheit. Die Fußnote bietet „wird verraten“ zutreffend als engere mögliche Lesart an.
