reference: Matthew 26:65
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: de
  text: 'Da zerriss der Hohepriester seine Gewänder[a] und sagte: »Er hat Gott gelästert! Wozu brauchen wir noch Zeugen? Seht, jetzt habt ihr die Gotteslästerung gehört.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zerreißen der Gewänder war ein öffentliches Zeichen von Entsetzen, Trauer oder Empörung.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Natürlicher deutscher Erzählanschluss, der die zeitliche Abfolge knapp wiedergibt.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohe Priester
  rationale: Die übliche und sachlich genaue Bezeichnung des jüdischen Amtsträgers; die Großschreibung kennzeichnet den Amtstitel.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: zerriss ... seine Gewänder
  rationale: Gibt die konkrete Handlung genau wieder; »Gewänder« wahrt den würdevollen historischen Ton, ohne die Kleidung unzulässig als Amtsgewand zu spezifizieren.
- source_word: λέγων
  choice: und sagte
  rationale: Im Deutschen ist die finite Beiordnung natürlicher als eine wörtliche partizipiale Konstruktion und bewahrt die Gleichzeitigkeit hinreichend.
- source_word: Ἐβλασφήμησεν
  choice: Er hat Gott gelästert
  rationale: Im heutigen Deutsch bezeichnet »Gott lästern« die hier erhobene religiös-rechtliche Anklage klarer und natürlicher als das weniger gebräuchliche Verb »lästern« ohne Objekt.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Wozu brauchen wir noch Zeugen?
  rationale: Idiomatiche, zugleich präzise Wiedergabe der rhetorischen Frage; »noch« entspricht ἔτι.
- source_word: ἴδε νῦν ἠκούσατε
  choice: Seht, jetzt habt ihr ... gehört
  rationale: »Seht« bewahrt den aufmerksamkeitslenkenden Imperativ im Plural; »jetzt« erhält die ausdrückliche Unmittelbarkeit von νῦν.
- source_word: τὴν βλασφημίαν
  choice: die Gotteslästerung
  rationale: Bewahrt die bestimmte, religiös-rechtliche Charakterisierung der Äußerung durch den Hohen Priester.
theological_decisions:
- issue: Wiedergabe der Anklage βλασφημέω / βλασφημία
  choice: »Gott gelästert« / »die Gotteslästerung« als direkte Anklage des Hohen Priesters
  alternative: »gelästert« / »die Lästerung«
  rationale: Die Formulierung erhält das religiös-rechtliche Gewicht der Anklage. Da sie innerhalb der direkten Rede steht, wird sie als Urteil des Hohen Priesters berichtet und nicht stillschweigend als Erzählerurteil bestätigt.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt energisch und gerichtsförmig. Die überlieferten englischen Fußnoten waren offenbar vertauscht: Die kulturelle Erklärung gehört zum Marker nach »Gewänder«; für die rhetorische Frage ist keine Fußnote nötig.'
