  source_fidelity: 'Der Text gibt alle maßgeblichen Elemente des griechischen Satzes wieder: die einleitende Redehandlung, den spöttischen Imperativ, die Anrede χριστέ als Titel sowie die Frage nach demjenigen, der Jesus geschlagen hat. Das deutsche Perfekt „hat dich geschlagen“ ist eine idiomatische Wiedergabe des aoristischen Partizips ὁ παίσας.'
