  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: de
  text: 'und sagten: »Weissage uns, Messias[a]! Wer hat dich geschlagen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Christus«.
    reason: Alternative geläufige Wiedergabe des griechischen Titels Χριστός.
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip führt die Rede der Spötter ein. Im Deutschen gibt eine koordinierte finite Form den fortlaufenden Erzählzusammenhang natürlich wieder.
- source_word: Προφήτευσον
  choice: Weissage
  rationale: Der Aoristimperativ verlangt spöttisch eine prophetische Offenbarung. »Weissage« bewahrt sowohl die Verbform als auch die Ironie, ohne den Inhalt erklärend vorwegzunehmen.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der verlangten prophetischen Auskunft; beim deutschen Verb »weissagen« genügt hier das Dativpronomen.
- source_word: χριστέ
  choice: Messias
  rationale: Der Vokativ von Χριστός wird hier als Titel und als Gegenstand des Spotts gebraucht. »Messias« ist im modernen Deutschen die geläufige bedeutungstragende Titelbezeichnung.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Wer hat dich geschlagen?
  rationale: Das substantivierte Aoristpartizip bezeichnet denjenigen, der Jesus schlug. Die deutsche Frage gibt die verlangte Identifizierung idiomatisch und vollständig wieder.
theological_decisions:
- issue: Wiedergabe des Titels Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός steht hier im Vokativ als messianischer Titel, nicht lediglich als namensähnliche Bezeichnung. »Messias« macht die in der Verspottung angegriffene Würde Jesu unmittelbar verständlich; »Christus« bleibt als geläufige Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Weissage« ist bewusst knapp und leicht bibelsprachlich, bleibt aber verständlich und erhält den prophetischen Spott. Die zwei direkten Sätze mit Ausrufe- und Fragezeichen bilden Befehl und anschließende Identifizierungsfrage klar ab.
