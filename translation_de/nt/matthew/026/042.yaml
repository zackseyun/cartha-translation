base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: de
  text: 'Dann ging er wieder weg und betete zum zweiten Mal: „Mein Vater, wenn dies nicht vorübergehen kann, ohne dass ich es[a] trinke, dein Wille geschehe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der im vorhergehenden Vers erwähnte Kelch. Wörtlich stehen hier nur „dies“ und „es“.
    reason: cross_reference
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: wieder … zum zweiten Mal
  rationale: Bewahrt beide Wiederholungsausdrücke des Griechischen, ohne im Deutschen schwerfällig zu wirken.
- source_word: ἀπελθὼν προσηύξατο λέγων
  choice: ging er weg und betete …
  rationale: Das vorzeitige Partizip und das Hauptverb werden als natürliche deutsche Erzählfolge wiedergegeben; der Inhalt des Gebets folgt idiomatisch nach einem Doppelpunkt.
- source_word: Πάτερ μου
  choice: Mein Vater
  rationale: Direkte, natürliche Wiedergabe der vertrauten kindlichen Anrede.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: wenn dies nicht vorübergehen kann
  rationale: Erhält τοῦτο als Demonstrativpronomen und gibt die ausgedrückte Unmöglichkeit präzise wieder.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: ohne dass ich es trinke
  rationale: Natürliche deutsche Wiedergabe der notwendigen Bedingung; „es“ nimmt das zuvor genannte „dies“ auf, ohne den im Vers unausgesprochenen Kelch einzufügen.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: soll dein Wille geschehen
  rationale: Bewahrt den auffordernden beziehungsweise voluntativen Charakter und die Verbindung zu Matthäus 6,10.
theological_decisions:
- issue: Soll der mit τοῦτο und αὐτό gemeinte Kelch im Haupttext ausdrücklich genannt werden?
  choice: „dies“ und „es“ beibehalten
  alternative: „dieser Kelch“ beziehungsweise „ihn“
  rationale: Der Zusammenhang mit Matthäus 26,39 macht den Leidenskelch deutlich, doch der griechische Text dieses Verses nennt ποτήριον nicht ausdrücklich. Die zurückhaltende Formulierung wahrt den Wortlaut und erklärt den Bezug in einer Fußnote.
- issue: Wiedergabe von Jesu Unterordnung unter den Willen des Vaters
  choice: „soll dein Wille geschehen“
  alternative: „dein Wille geschehe“
  rationale: Die gewählte Form ist modernes, verständliches Deutsch, erhält die Gebetsbitte und vermeidet eine bloße Feststellung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Wiederholung „wieder … zum zweiten Mal“ spiegelt πάλιν ἐκ δευτέρου; die sonst mögliche gehobene Form „dein Wille geschehe“ wurde zugunsten einer allgemein verständlichen Formulierung vermieden.
