id: MAT.26.23
reference: Matthew 26:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: de
  text: 'Er antwortete: »Der, der mit mir die Hand in die Schüssel getaucht hat – der wird mich verraten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird mich ausliefern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Er antwortete
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine geläufige semitisch beeinflusste Ausdrucksweise. »Er antwortete« gibt ihren Sinn in natürlichem modernem Deutsch wieder, ohne beide Verben unnötig abzubilden.
- source_word: ἐμβάψας
  choice: getaucht hat
  rationale: Das Aoristpartizip bezeichnet die vollzogene, zur Identifizierung dienende Handlung. Das Perfekt klingt in direkter Rede natürlich und wahrt den Vergangenheitsaspekt.
- source_word: μετ’ ἐμοῦ
  choice: mit mir
  rationale: Dies ist die direkte und idiomatische Wiedergabe von μετά mit dem Genitiv im Sinn der Begleitung beziehungsweise gemeinsamen Handlung.
- source_word: τὴν χεῖρα
  choice: die Hand
  rationale: Anders als im Englischen ist der bestimmte Artikel bei Körperteilen im Deutschen natürlich; aus dem Subjekt ergibt sich eindeutig, wessen Hand gemeint ist.
- source_word: ἐν τῷ τρυβλίῳ
  choice: in die Schüssel
  rationale: τρύβλιον bezeichnet ein Essgefäß, eine Schüssel oder Schale. Wegen des deutschen Verbs »eintauchen/tauchen« steht idiomatisch der Akkusativ zur Bezeichnung der Zielrichtung, obwohl das griechische ἐν mit Dativ formal lokativisch ist.
- source_word: οὗτός
  choice: der
  rationale: Die Wiederaufnahme »der … – der« bewahrt die hervorhebende Kraft des Demonstrativpronomens und klingt im Deutschen natürlicher als »dieser« oder »dieser eine«.
- source_word: παραδώσει
  choice: wird mich verraten
  rationale: Im Kontext der Passion bezeichnet παραδίδωμι das treulose Ausliefern Jesu. »Verraten« gibt diese kontextuelle Bedeutung klar wieder; die lexikalisch allgemeinere Möglichkeit »ausliefern« bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von παραδίδωμι im Zusammenhang mit Judas
  choice: wird mich verraten
  alternative: wird mich ausliefern
  rationale: Das Verb kann allgemein »übergeben/ausliefern« bedeuten. Der erzählerische und zwischenmenschliche Kontext hebt hier jedoch den Verrat hervor. Die Hauptübersetzung gibt diese kontextuelle Bedeutung wieder, ohne darüber hinausgehende Lehraussagen einzutragen; die wörtlichere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, verständliche und zugleich würdige direkte Rede. Die Satzkonstruktion »Der, der … – der …« erhält die emphatische Identifizierung durch οὗτός. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Alternative bezieht.
