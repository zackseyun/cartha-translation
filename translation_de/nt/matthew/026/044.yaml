id: MAT.26.44
reference: Matthew 26:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: de
  text: Und er ließ sie zurück, ging wieder weg und betete zum dritten Mal, wobei er noch einmal dasselbe sagte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „indem er wieder dasselbe Wort / dieselbe Aussage sagte“.'
    reason: Die Einzahl λόγον kann das Gesagte beziehungsweise den Inhalt der wiederholten Bitte bezeichnen.
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: er ließ sie zurück
  rationale: Das Aoristpartizip von ἀφίημι bezeichnet hier, dass Jesus die Jünger zurücklässt; die finite Form ergibt im Deutschen einen natürlichen Erzählfluss.
- source_word: πάλιν ἀπελθὼν
  choice: ging wieder weg
  rationale: πάλιν markiert die erneute Entfernung von den Jüngern; ἀπέρχομαι wird idiomatisch mit „weggehen“ wiedergegeben.
- source_word: προσηύξατο ἐκ τρίτου
  choice: betete zum dritten Mal
  rationale: ἐκ τρίτου ist eine idiomatische Wendung für das dritte Eintreten der Handlung.
- source_word: τὸν αὐτὸν λόγον εἰπὼν πάλιν
  choice: wobei er noch einmal dasselbe sagte
  rationale: Die Wiedergabe bewahrt das singularische τὸν αὐτὸν λόγον als denselben Gebetsinhalt und bildet auch das abschließende πάλιν ab.
theological_decisions:
- issue: Wiederholung des Gebets
  choice: Sowohl das dritte Beten als auch das erneute Sagen desselben Inhalts werden ausdrücklich wiedergegeben.
  alternative: Das abschließende πάλιν könnte aus stilistischen Gründen unübersetzt bleiben.
  rationale: Der griechische Text betont die Wiederholung durch zwei Vorkommen von πάλιν; diese Spannung und Redundanz soll nicht geglättet werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die partizipiale Satzfolge wurde maßvoll in finite und adverbiale Formen überführt; beide Wiederholungsmarker des griechischen Textes bleiben erkennbar.
