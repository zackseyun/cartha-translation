  terminology: „Derselbe“ gibt den wiederholten Gebetsinhalt neutral wieder, ohne die singuläre Form λόγον unangemessen auf ein einzelnes Wort zu verengen oder eine bestimmte dogmatische Deutung einzutragen. Die Fußnote erklärt diese semantische Spannweite angemessen.
