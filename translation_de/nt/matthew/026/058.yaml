  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: de
  text: Petrus aber folgte ihm in einiger Entfernung bis zum Hof des Hohen Priesters. Nachdem er hineingegangen war, saß er bei den Bediensteten[a], um zu sehen, wie es ausgehen würde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „bei den Dienern“, „bei den Amtsgehilfen“ oder „bei den Wachen“. Das griechische Wort ὑπηρέται kann untergeordnete Bedienstete oder Amtspersonen bezeichnen; ihre genaue Funktion bleibt hier offen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „um das Ende zu sehen“. Das griechische τὸ τέλος kann das Ende oder den Ausgang des Geschehens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: folgte
  rationale: Das Imperfekt beschreibt die fortdauernde Begleithandlung. Im Deutschen gibt das Präteritum „folgte“ dies im Erzählzusammenhang natürlich wieder.
- source_word: ἀπὸ μακρόθεν
  choice: in einiger Entfernung
  rationale: Die Wendung bezeichnet räumlichen Abstand; „in einiger Entfernung“ ist gegenwärtiges, idiomatisches Deutsch.
- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: bis zum Hof des Hohen Priesters
  rationale: ἕως bezeichnet die erreichte Grenze, und αὐλή meint hier den umschlossenen Hofbereich. „Hoher Priester“ ist die etablierte deutsche Bezeichnung für ἀρχιερεύς.
- source_word: εἰσελθὼν ἔσω
  choice: Nachdem er hineingegangen war
  rationale: Das vorzeitige Partizip mit ἔσω bezeichnet das Hineingehen vor dem Sitzen; die deutsche Nebensatzkonstruktion macht diese Abfolge deutlich.
- source_word: ἐκάθητο
  choice: saß er
  rationale: Das Imperfekt bezeichnet einen anhaltenden Zustand. „Saß er“ ist im deutschen Erzählstil natürlicher als eine progressive Umschreibung.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: bei den Bediensteten
  rationale: ὑπηρέται bezeichnet untergeordnete Diener, Amtsgehilfen oder Wachleute. „Bedienstete“ bleibt im Haupttext ausreichend weit, ohne ihre konkrete Funktion zu stark festzulegen.
- source_word: ἰδεῖν τὸ τέλος
  choice: um zu sehen, wie es ausgehen würde
  rationale: Der Infinitiv bezeichnet den Zweck. Die Wiedergabe versteht τέλος kontextgemäß als Ausgang beziehungsweise Ende des Geschehens, bewahrt aber durch die Fußnote die wörtlichere Möglichkeit.
theological_decisions:
- issue: Bedeutung von τὸ τέλος
  choice: wie es ausgehen würde
  alternative: das Ende zu sehen
  rationale: Im Zusammenhang wartet Petrus auf den Ausgang des Verfahrens gegen Jesus. Die Übersetzung legt nicht fest, dass τέλος hier eine besondere theologische Bedeutung trägt, und dokumentiert die wörtlichere Lesart in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die Partizipialkonstruktion wird durch einen temporalen Nebensatz wiedergegeben; mehrdeutige Amtsbezeichnungen und die Spannweite von τέλος werden nicht unnötig verengt.
