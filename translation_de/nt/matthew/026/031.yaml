  to: 'Da sagt Jesus zu ihnen: „Ihr alle werdet in dieser Nacht[b] an mir zu Fall kommen[a]; denn es steht geschrieben[c]: ‚Ich werde den Hirten schlagen, und die Schafe der Herde werden zerstreut werden.‘“'
  rationale: Die einzige Änderung ersetzt „wegen mir“ durch „an mir“, um die im Deutschen mögliche Nebenbedeutung „an meiner Stelle“ auszuschließen und die relationale, bildhafte Aussage von ἐν ἐμοὶ σκανδαλισθήσεσθε genauer wiederzugeben. Die übrige Formulierung einschließlich der Ankerreihenfolge bleibt unverändert.
