id: MAT.26.31
reference: Matthew 26:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: de
  text: 'Da sagt Jesus zu ihnen: „Ihr alle werdet in dieser Nacht[b] an mir zu Fall kommen[a]; denn es steht geschrieben[c]: ‚Ich werde den Hirten schlagen, und die Schafe der Herde werden zerstreut werden.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „an mir Anstoß nehmen“, „durch mich zum Straucheln gebracht werden“ oder „sich von mir abwenden“. Das griechische Wort kann ein Spektrum vom Stolpern bis zur Abwendung bezeichnen; hier weist der Zusammenhang auf die Flucht der Jünger hin.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „heute Nacht“.'
    reason: lexical_alternative
  - marker: c
    text: Zitat aus Sacharja 13,7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Leitet in einer Erzählung natürlich den nächsten zeitlichen Schritt ein und entspricht dem temporalen Τότε.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt den historischen Präsensgebrauch des griechischen Erzählstils.
- source_word: Πάντες ὑμεῖς
  choice: Ihr alle
  rationale: Gibt die ausdrückliche und betonte Einbeziehung sämtlicher Jünger wieder.
- source_word: σκανδαλισθήσεσθε
  choice: werdet … zu Fall kommen
  rationale: Erfasst das Bild des Stolperns beziehungsweise Fallens und lässt die Spannweite bis zum Abfall oder zur Abwendung offen; im Zusammenhang ist die bevorstehende Flucht der Jünger gemeint.
- source_word: ἐν ἐμοὶ
  choice: wegen mir
  rationale: 'Gibt den hier naheliegenden kausalen beziehungsweise relationalen Sinn idiomatisch wieder: Das Geschehen um Jesus wird für die Jünger zum Anlass ihres Fallens.'
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: in dieser Nacht
  rationale: Folgt der griechischen Formulierung eng und klingt zugleich in gehobenem modernem Deutsch natürlich.
- source_word: γέγραπται γάρ
  choice: denn es steht geschrieben
  rationale: Entspricht der festen Einleitungsformel für ein Schriftzitat und wahrt den resultativen Sinn des Perfekts.
- source_word: Πατάξω
  choice: Ich werde … schlagen
  rationale: Gibt das Futur und die einfache Bedeutung des Verbs ohne zusätzliche Aussage über das Ergebnis wieder.
- source_word: τὸν ποιμένα
  choice: den Hirten
  rationale: Bewahrt die vertraute und direkte Hirtenmetapher.
- source_word: διασκορπισθήσονται
  choice: werden zerstreut werden
  rationale: Bewahrt Futur und Passiv sowie das Bild einer auseinandergetriebenen Herde.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: die Schafe der Herde
  rationale: Gibt beide ausdrücklich genannten Substantive wieder, ohne die Formulierung auf bloß »die Schafe« zu verkürzen.
theological_decisions:
- issue: Bedeutungsumfang von σκανδαλισθήσεσθε in Bezug auf Jesus
  choice: „wegen mir zu Fall kommen“
  alternative: „sich von mir abwenden“, „an mir Anstoß nehmen“ oder „an mir irrewerden“
  rationale: Die Formulierung bewahrt das griechische Fallbild und lässt offen, wie dauerhaft der Fall ist. Der Zusammenhang deutet auf die noch in derselben Nacht erfolgende Flucht und Untreue der Jünger, ohne damit ausdrücklich endgültigen Glaubensabfall zu behaupten.
- issue: Historisches Präsens λέγει
  choice: „sagt“
  alternative: „sagte“
  rationale: Das Präsens erhält die griechische Erzähltextur, ohne den zeitlichen Ablauf zu verändern.
- issue: Handelndes Ich im Schriftzitat Πατάξω
  choice: „Ich werde den Hirten schlagen“
  alternative: Eine Umschreibung oder ausdrückliche Identifizierung des sprechenden Ichs
  rationale: Das grammatische Ich des Zitats bleibt unangetastet; seine theologische Identität wird nicht durch eine erläuternde Ergänzung im Haupttext festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem biblischem Erzählton. Das historische Präsens und die Schriftformel werden bewahrt; archaische Ausdrücke werden vermieden. Die Wortstellung „Ihr alle“ erhält die Betonung des griechischen Textes.
