  source_fidelity: Die Übersetzung gibt Satzfolge, Betonung von Πάντες ὑμεῖς, historisches Präsens, Zeitangabe, Schriftformel und das Zitat einschließlich Futur und Passiv insgesamt zuverlässig wieder. „wegen mir“ ist für ἐν ἐμοὶ jedoch nicht optimal, weil es im heutigen Deutsch auch leicht im Sinn von „an meiner Stelle“ verstanden werden kann und die relationale Wendung unnötig auf eine bloße Ursache verengt.
  naturalness: Der Text ist flüssiges, modernes Standarddeutsch mit angemessen würdigem Erzählton. „an mir zu Fall kommen“ ist in diesem biblisch-metaphorischen Zusammenhang idiomatisch genug und zugleich präziser als „wegen mir zu Fall kommen“.
  terminology: „Hirte“, „Schafe der Herde“, „zerstreut werden“ und „es steht geschrieben“ sind treffend und registergerecht. Die Fußnote zu σκανδαλισθήσεσθε sollte die Hauptlesart „an mir zu Fall kommen“ widerspiegeln und die Kontextdeutung als Desertion nicht zu einer Aussage über endgültigen Abfall ausweiten.
