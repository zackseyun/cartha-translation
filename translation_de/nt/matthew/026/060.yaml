  language: de
  text: Und sie fanden nichts[a], obwohl viele falsche Zeugen vortraten. Doch später traten zwei vor
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie fanden nicht“. Das griechische Verb lässt das Objekt unausgesprochen; gemeint ist die gesuchte belastende Aussage beziehungsweise ein Anklagegrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: sie fanden nichts
  rationale: 'Das Objekt von εὗρον bleibt im Griechischen unausgesprochen und ergibt sich aus Vers 59: Gesucht wurde eine belastende Aussage beziehungsweise ein Anklagegrund. „Nichts“ bewahrt diese Offenheit im Deutschen, ohne ein bestimmtes Objekt in den Text einzutragen.'
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: obwohl viele falsche Zeugen vorgetreten waren
  rationale: Der Genitivus absolutus ist im Zusammenhang konzessiv. Das Plusquamperfekt gibt das zeitliche Verhältnis zum erfolglosen Suchen natürlich wieder; „falsche Zeugen“ entspricht dem gerichtlichen Kontext.
- source_word: ὕστερον δὲ
  choice: Später aber
  rationale: ὕστερον bezeichnet einen späteren Zeitpunkt im Verfahren; δέ markiert hier einen leichten Gegensatz beziehungsweise erzählerischen Übergang.
- source_word: προσελθόντες δύο
  choice: traten zwei vor
  rationale: Im Rahmen einer Verhandlung ist „vortreten“ eine natürliche Wiedergabe von προσέρχομαι und erhält die Hervorhebung der Zahl zwei.
