  source_fidelity: Der Text gibt εὐθέως mit „sofort“, die Annäherung zu Jesus, die Grußanrede Χαῖρε, den Titel ῥαββί und die abschließende Handlung κατεφίλησεν zuverlässig wieder. Die Satzfolge ist gegenüber dem griechischen Partizip idiomatisch geglättet, ohne einen Bedeutungsverlust zu verursachen.
  naturalness: '„Und sofort ging er auf Jesus zu und sagte: »Sei gegrüßt, Rabbi!« Und er küsste ihn.“ ist verständliches modernes Standarddeutsch mit einem angemessen würdigen erzählerischen Ton. „Sei gegrüßt“ ist bewusst etwas gehobener, aber weder unverständlich noch unangemessen für die direkte Rede in diesem Kontext.'
  terminology: „Rabbi“ bewahrt den im griechischen Text beibehaltenen semitischen Titel. Die Fußnote zu „Sei gegrüßt“ erläutert zutreffend die zugrunde liegende lexikalische Bedeutung, ohne die kontextuelle Grußfunktion zu verkennen. Die Fußnote zu „küsste“ gibt die mögliche Intensivierung bzw. Wiederholung von κατεφίλησεν vorsichtig und nicht überbestimmt wieder.
