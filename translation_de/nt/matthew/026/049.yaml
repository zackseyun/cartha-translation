id: MAT.26.49
reference: Matthew 26:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: de
  text: 'Und sofort ging er auf Jesus zu und sagte: »Sei gegrüßt[a], Rabbi!« Und er küsste ihn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung ist eine übliche Grußformel; wörtlich kann sie auch »Freue dich« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Das Verb kann einen nachdrücklichen oder wiederholten Kuss bezeichnen: »küsste ihn innig« oder »küsste ihn wiederholt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die unverzügliche Handlung knapp und in modernem Deutsch wieder.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: ging er auf Jesus zu
  rationale: Gibt die körperliche Annäherung idiomatisch wieder und wahrt die zeitliche Abfolge des griechischen Partizips.
- source_word: Χαῖρε
  choice: Sei gegrüßt
  rationale: Das Wort dient hier als übliche Anrede. Die Wendung ist im Deutschen verständlich und würdevoll, ohne die Formulierung als theologischen Zuruf zu deuten.
- source_word: ῥαββί
  choice: Rabbi
  rationale: Bewahrt wie der griechische Text den semitischen Titel in seiner geläufigen deutschen Form.
- source_word: κατεφίλησεν
  choice: küsste
  rationale: Die schlichte Wiedergabe ist im Haupttext natürlich; die mögliche verstärkende oder wiederholende Bedeutung des Verbs wird in einer Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von Χαῖρε in der Anrede des Judas
  choice: Sei gegrüßt
  alternative: Freue dich; Grüß dich
  rationale: Im Zusammenhang ist Χαῖρε eine konventionelle Grußformel. Die Übersetzung lässt die Ironie der verräterischen Begrüßung aus der Erzählung selbst hervorgehen.
- issue: Stärke von κατεφίλησεν
  choice: küsste
  alternative: küsste ihn innig; küsste ihn wiederholt
  rationale: Das Präfix kann den Kuss als nachdrücklich oder wiederholt kennzeichnen, legt aber keine einzige deutsche Ausformulierung eindeutig fest. Deshalb bleibt der Haupttext zurückhaltend und die Bedeutungsbreite steht in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die zweimalige Wiedergabe von καί als »Und« bewahrt den schlichten, unmittelbar fortschreitenden Stil des griechischen Satzes.
