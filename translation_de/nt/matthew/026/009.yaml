  text: ἐδύνατο γὰρ ⸀τοῦτο πραθῆναι πολλοῦ καὶ δοθῆναι πτωχοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/009.yaml
  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: de
  text: Denn man hätte dies für viel Geld verkaufen und den Erlös den Armen geben können.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für viel“; gemeint ist: „für einen hohen Preis“. Im Griechischen steht ein Genitiv des Preises.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: hätte … können
  rationale: Das Imperfekt von δύναμαι bezeichnet hier zusammen mit den Infinitiven eine in der Vergangenheit bestehende, aber nicht verwirklichte Möglichkeit; der deutsche Konjunktiv II der Vergangenheit gibt dies natürlich wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende beziehungsweise erklärende Verbindung zur vorausgehenden Klage.
- source_word: τοῦτο
  choice: dies
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist auf das zuvor erwähnte Salböl; „dies“ erhält die knappe Form des Griechischen, ohne das Bezugswort erneut einzusetzen.
- source_word: πραθῆναι
  choice: verkaufen
  rationale: Der passive Aoristinfinitiv bedeutet formal „verkauft werden“. Im Deutschen ist bei einer Sache die unpersönliche aktive Konstruktion „man hätte dies … verkaufen können“ idiomatischer und erhält den Sinn.
- source_word: πολλοῦ
  choice: für viel Geld
  rationale: Der Genitiv des Preises bezeichnet einen hohen Verkaufserlös. „Für viel Geld“ ist modernes, natürliches Deutsch und legt keinen bestimmten Betrag fest.
- source_word: δοθῆναι
  choice: den Armen geben
  rationale: Der passive Infinitiv ist mit πραθῆναι koordiniert. In der deutschen unpersönlichen Konstruktion wird auch er idiomatisch aktiv wiedergegeben; der aus dem Verkauf gewonnene Erlös ist sinngemäß das Gegebene.
- source_word: πτωχοῖς
  choice: den Armen
  rationale: Das substantivierte Adjektiv im Dativ Plural bezeichnet arme Menschen kollektiv und wird im Deutschen knapp und würdig mit „den Armen“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die unpersönliche Konstruktion mit „man“ vermeidet ein schwerfälliges doppeltes Passiv; „dies“ bewahrt den demonstrativen Rückverweis des Ausgangstextes.
