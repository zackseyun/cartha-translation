  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: de
  text: Wie sollten sich dann die Schriften erfüllen, nach denen es so geschehen muss?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς
  choice: Wie
  rationale: Das Frageadverb leitet eine rhetorische Frage ein; „Wie“ ist die natürliche deutsche Entsprechung.
- source_word: οὖν
  choice: dann
  rationale: Die folgernde Partikel verbindet die Frage mit Jesu vorheriger Aussage; „dann“ gibt den logischen Anschluss idiomatisch wieder.
- source_word: πληρωθῶσιν
  choice: würden sich ... erfüllen
  rationale: 'Der Aorist Passiv Konjunktiv in der rhetorischen Frage bezeichnet hier eine gedachte Folge: Bei gewaltsamer Gegenwehr würden die Schriften nicht zur Erfüllung gelangen.'
- source_word: αἱ γραφαί
  choice: die Schriften
  rationale: Der Plural bezeichnet die heiligen Schriften Israels. „Die Schriften“ ist im Deutschen etabliert und lässt den Bezug ohne erklärenden Zusatz stehen.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι führt am wahrscheinlichsten den Inhalt dessen ein, was die Schriften bezeugen.
- source_word: οὕτως
  choice: so
  rationale: Das Adverb verweist knapp auf die Art und Weise, in der sich die gegenwärtigen Ereignisse vollziehen.
- source_word: δεῖ
  choice: es ... muss
  rationale: Die unpersönliche Form drückt Notwendigkeit aus; die Übersetzung erklärt deren göttlichen Grund nicht über den Wortlaut hinaus.
- source_word: γενέσθαι
  choice: geschehen
  rationale: Der Infinitiv von γίνομαι bezeichnet hier das Eintreten der Ereignisse; „geschehen“ ist natürlich und würdevoll.
theological_decisions:
- issue: Art der durch δεῖ ausgedrückten Notwendigkeit
  choice: „es so geschehen muss“ ohne ausdrücklichen Zusatz zur göttlichen Planung
  alternative: „es nach Gottes Plan so geschehen muss“
  rationale: Der Zusammenhang von Schriftenerfüllung und δεῖ legt eine göttliche Notwendigkeit nahe, doch der griechische Text formuliert diese nicht weiter aus.
- issue: Verhältnis des ὅτι-Satzes zu „den Schriften“
  choice: 'Als Inhalt der Schriften: „dass es so geschehen muss“'
  alternative: 'Begründend: „denn es muss so geschehen“'
  rationale: ὅτι kann formal unterschiedlich verstanden werden. Die Inhaltsangabe passt hier gut, doch die Fußnote hält die alternative Satzverknüpfung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Die Schriften“ bewahrt den etablierten Bezug auf Israels heilige Schriften; „so geschehen muss“ bleibt knapp und vermeidet eine theologische Ausdeutung.
