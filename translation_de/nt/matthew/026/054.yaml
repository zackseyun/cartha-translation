review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt πῶς οὖν, den potentialen Konjunktiv πληρωθῶσιν, αἱ γραφαί und die unpersönliche Notwendigkeit von δεῖ insgesamt zutreffend wieder. Die Verbindung von „sich erfüllen“ mit einem unmittelbaren dass-Satz ist im Deutschen jedoch syntaktisch unidiomatisch. „Nach denen“ gibt die inhaltliche Aussage von ὅτι in idiomatischer deutscher Satzfügung wieder, ohne die Art der Notwendigkeit näher zu bestimmen.
  naturalness: „Wie würden sich dann die Schriften erfüllen, dass …“ klingt im modernen Standarddeutsch holprig, weil ein dass-Satz nicht natürlich direkt von „sich erfüllen“ abhängt. „Wie sollten sich dann die Schriften erfüllen, nach denen …“ ist klar, würdig und idiomatisch.
  terminology: „die Schriften“ ist als Bezeichnung für die heiligen Schriften Israels angemessen. „geschehen muss“ bewahrt die knappe, nicht weiter erklärte Notwendigkeit des δεῖ. „Sollten“ bildet den rhetorisch-potentialen Charakter der Frage natürlich ab.
  issues:
  - severity: medium
    issue: Unidiomatische Anbindung des ὅτι-Satzes
    rationale: Die Formulierung „die Schriften erfüllen, dass es so geschehen muss“ ist zwar verständlich, aber kein natürlicher deutscher Satzbau. Eine relative Anbindung mit „nach denen“ vermittelt, dass die Schriften dieses Geschehen als notwendig ausweisen.
  - severity: low
    issue: Fußnote setzt eine begründende Lesart zu stark als gleichwertige Übersetzungsalternative voraus
    rationale: Die Fußnote „Denn es muss so geschehen“ löst ὅτι in einen eigenständigen Begründungssatz auf. Im Kontext ist die inhaltliche Beziehung zu den Schriften die naheliegendere Wiedergabe; die vorgeschlagene Hauptfassung macht sie bereits idiomatisch sichtbar.
