  source_fidelity: Die Übersetzung gibt den temporalen Genitivus absolutus angemessen wieder und bildet die Abfolge von Nehmen, Segensspruch, Brechen und Geben vollständig ab. »Nehmt, esst« entspricht den beiden asyndetisch gereihten Imperativen Λάβετε φάγετε. »Das ist mein Leib« gibt τοῦτό ἐστιν τὸ σῶμά μου unmittelbar wieder und wahrt die im griechischen Text bestehende Auslegungsweite.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch mit angemessen würdigem, aber nicht archaisierendem Register. »Sprach den Segen« ist eine natürliche religiös-liturgische Formulierung und gibt εὐλογήσας treffend wieder, ohne »dankte« einzutragen.
