  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: de
  text: 'Während sie aßen, nahm Jesus Brot, sprach den Segen, brach es, gab es den Jüngern und sagte: »Nehmt, esst; das ist mein Leib.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das ist mein Leib«. Manche verstehen die Worte im Sinn von »das bedeutet/versinnbildlicht meinen Leib«; die Übersetzung bewahrt den Wortlaut des griechischen Textes.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Während sie aßen
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig ablaufende Handlung. »Während sie aßen« gibt den zeitlichen Rahmen natürlich wieder; das schwach weiterführende δέ braucht im Deutschen nicht eigens ausgedrückt zu werden.
- source_word: λαβὼν ὁ Ἰησοῦς ἄρτον
  choice: nahm Jesus Brot
  rationale: Das vorzeitige Aoristpartizip wird als erstes Glied einer natürlichen deutschen Handlungsfolge wiedergegeben. ἄρτος bezeichnet hier Brot; ein bestimmter Artikel oder »Laib« wäre stärker festlegend als der griechische Text.
- source_word: εὐλογήσας
  choice: sprach den Segen
  rationale: εὐλογέω bezeichnet hier das Aussprechen eines Segens. Die Formulierung ist im Deutschen idiomatischer als »segnete es« und vermeidet, das Verb ohne Weiteres mit εὐχαριστέω (Dank sagen) gleichzusetzen.
- source_word: ἔκλασεν
  choice: brach es
  rationale: Das Verb bedeutet »brechen«. Das im Deutschen erforderliche Pronomen bezieht sich auf das Brot.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: gab es den Jüngern
  rationale: Das Partizip wird als koordiniertes finites Verb wiedergegeben. Der bestimmte Artikel kennzeichnet die bekannte Gruppe; »seinen« wird nicht ergänzt, da es im Griechischen nicht ausdrücklich steht.
- source_word: Λάβετε φάγετε
  choice: Nehmt, esst
  rationale: Die beiden unmittelbar aufeinanderfolgenden Aoristimperative werden ohne eingefügtes »und« bewahrt; so bleiben Nachdruck und knappe Form des Ausgangstextes erhalten.
- source_word: τοῦτό ἐστιν τὸ σῶμά μου
  choice: das ist mein Leib
  rationale: Die einfache Kopula ἐστιν wird direkt mit »ist« wiedergegeben. »Leib« ist in diesem überlieferten Mahlwort eine natürliche, würdevolle deutsche Entsprechung für σῶμα und bewahrt die Aussage ohne deutende Umschreibung.
theological_decisions:
- issue: Deutung des eucharistischen Wortes τοῦτό ἐστιν τὸ σῶμά μου
  choice: »das ist mein Leib«
  alternative: »das bedeutet/versinnbildlicht meinen Leib«
  rationale: Der griechische Text verwendet die einfache Kopula ἐστιν. Die Übersetzung wahrt daher den Wortlaut und die damit verbundene theologische Spannung, ohne eine bestimmte Abendmahlslehre durch eine Paraphrase festzuschreiben.
- issue: Bezug von εὐλογήσας
  choice: »sprach den Segen«
  alternative: »dankte« oder »segnete es«
  rationale: Die gewählte Formulierung lässt offen, ob der Segen primär als Lobpreis Gottes beziehungsweise als Segen über dem Brot verstanden wird, und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Partizipien des griechischen Satzes werden als flüssige Folge finiter Verben wiedergegeben. »Nehmt, esst« erhält die knappe asyndetische Form; »Leib« wahrt den vertrauten feierlichen Klang, ohne den griechischen Wortlaut theologisch auszudeuten.
