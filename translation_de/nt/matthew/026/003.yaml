id: MAT.26.3
reference: Matthew 26:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: de
  text: Dann versammelten sich die führenden Priester und die Ältesten des Volkes im Hof[a] des Hohen Priesters, der Kajaphas hieß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Palasthof“. Das griechische Wort kann den Hofbereich einer größeren Residenz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Kennzeichnet natürlich und knapp den zeitlichen Fortgang der Erzählung.
- source_word: συνήχθησαν
  choice: versammelten sich
  rationale: Gibt das Zusammenkommen im modernen Deutschen idiomatisch wieder; das formal passive griechische Verb kann hier medial beziehungsweise intransitiv verstanden werden.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Bezeichnet im Kontext die priesterliche Führungsschicht und vermeidet die missverständliche Vorstellung mehrerer gleichzeitig amtierender Hoher Priester.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: die Ältesten des Volkes
  rationale: Bewahrt die Genitivverbindung und die etablierte Bezeichnung für anerkannte Führungspersonen des Volkes.
- source_word: εἰς τὴν αὐλὴν
  choice: im Innenhof
  rationale: Bei einem Verb des Sichversammelns bezeichnet εἰς idiomatisch den Ort, an dem die Gruppe zusammenkam; αὐλή meint hier den umschlossenen Hof eines größeren Anwesens.
- source_word: τοῦ ἀρχιερέως
  choice: des Hohen Priesters
  rationale: Gibt das singuläre Amt präzise und in üblicher deutscher Schreibung wieder.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: der Kajaphas hieß
  rationale: Identifiziert den Hohen Priester in natürlichem Deutsch und entspricht sachlich dem griechischen Partizip λεγομένου.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Führende Priester“ ist für heutige Leser klarer als das potenziell missverständliche „Oberpriester“. Der Satzbau bleibt eng am Griechischen, ohne dessen passive Konstruktion unnatürlich nachzubilden.
