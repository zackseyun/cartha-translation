  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: de
  text: 'Und wieder leugnete er mit einem Eid: „Ich kenne den Mann nicht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: πάλιν
  choice: wieder
  rationale: Kennzeichnet unmittelbar und idiomatisch die Wiederholung von Petrus’ Verleugnung.
- source_word: ἠρνήσατο
  choice: leugnete er
  rationale: Das absolute deutsche „leugnen“ kann hier natürlich durch die folgende direkte Rede inhaltlich ergänzt werden; ein zusätzliches „es“ ist nicht erforderlich.
- source_word: μετὰ ὅρκου
  choice: mit einem Eid
  rationale: Gibt die begleitende Bekräftigung präzise wieder. „Unter Eid“ könnte stärker an eine förmliche gerichtliche Situation denken lassen.
- source_word: ὅτι
  choice: ':'
  rationale: Die Konjunktion führt den Inhalt der Verleugnung ein; im Deutschen gibt ein Doppelpunkt mit direkter Rede diese Funktion natürlich wieder.
- source_word: Οὐκ οἶδα
  choice: Ich kenne ... nicht
  rationale: Bei einer Person ist „kennen“ im Deutschen die idiomatische Entsprechung von οἶδα in diesem Zusammenhang.
- source_word: τὸν ἄνθρωπον
  choice: den Menschen
  rationale: Bewahrt die ausdrücklich distanzierende Bezeichnung des griechischen Textes. „Mann“ wäre möglich, „Mensch“ entspricht jedoch der lexikalischen Form und klingt in der Aussage bewusst abweisend.
theological_decisions:
- issue: Bezeichnung Jesu in Petrus’ Verleugnung
  choice: „den Menschen“ beibehalten
  alternative: „ihn“, „diesen Mann“ oder „Jesus“
  rationale: Der griechische Text nennt ausdrücklich „den Menschen“. Diese Formulierung trägt zur distanzierenden Wirkung von Petrus’ Aussage bei und sollte nicht durch eine eindeutiger identifizierende Bezeichnung ersetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am knappen griechischen Erzählstil; die direkte Rede ist natürlich deutsch formuliert.
