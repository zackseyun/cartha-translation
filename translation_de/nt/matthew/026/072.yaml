    issue: „den Menschen“ für τὸν ἄνθρωπον
    rationale: Obwohl ἄνθρωπος lexikalisch auch „Mensch“ bedeuten kann, referiert es hier auf Jesus als männliche Person. Deutsch „den Menschen“ ist in dieser Konstruktion nicht natürlich und kann den Referenten unpassend verallgemeinern. „den Mann“ erhält sowohl die konkrete Referenz als auch Petrus’ distanzierende Ausdrucksweise.
