  source_fidelity: Der Satz gibt die Abfolge, die wiederholte Verleugnung, die eidliche Bekräftigung und den Inhalt der direkten Rede zuverlässig wieder. τὸν ἄνθρωπον bezeichnet hier jedoch einen männlichen Einzelnen; „den Menschen“ ist im heutigen Deutschen eher generisch bzw. kategorial und verschiebt die konkrete, demonstrativ-distanzierende Bezeichnung.
  naturalness: „Ich kenne den Menschen nicht“ klingt im modernen Standarddeutsch unnatürlich und kann allgemeinmenschlich verstanden werden. „Ich kenne den Mann nicht“ ist idiomatisch und bewahrt die abweisende Distanz der Aussage.
  terminology: „Mit einem Eid“ ist für μετὰ ὅρκου angemessen; es suggeriert keine förmliche gerichtliche Vereidigung. „Leugnete er“ ist mit der folgenden direkten Rede tragfähig. „Mann“ ist hier die präzisere deutsche Wiedergabe von ἄνθρωπος im Kontext.
  issues:
