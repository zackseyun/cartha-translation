source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γενομένου ἐν Βηθανίᾳ ἐν οἰκίᾳ Σίμωνος τοῦ λεπροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: de
  text: Als Jesus in Betanien im Haus Simons des Aussätzigen[a] war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Aussätzige“ gibt den griechischen Beinamen Simons wieder. Der Ausdruck kann verschiedene schwere Hautkrankheiten bezeichnen und sagt für sich genommen nicht, ob Simon damals noch erkrankt war oder früher daran gelitten hatte.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Als Jesus … war
  rationale: Der Genitivus absolutus setzt den zeitlichen und szenischen Rahmen. „Als Jesus … war“ gibt dies im Deutschen natürlich wieder, ohne γίνομαι unidiomatisch wörtlich zu übersetzen. δέ fungiert hier als schwacher Erzählanschluss und braucht im deutschen Vers nicht eigens wiedergegeben zu werden.
- source_word: ἐν Βηθανίᾳ
  choice: in Betanien
  rationale: Direkte Ortsangabe mit ἐν.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: im Haus Simons
  rationale: οἰκία bezeichnet hier den konkreten Schauplatz; der Genitiv Σίμωνος zeigt den Besitzer an.
- source_word: τοῦ λεπροῦ
  choice: des Aussätzigen
  rationale: Die traditionelle, im biblischen Zusammenhang verständliche Bezeichnung bewahrt den identifizierenden Beinamen. Der griechische Ausdruck ist medizinisch weiter als die moderne Diagnose Lepra; dies wird in der Fußnote erläutert.
theological_decisions:
- issue: Ob Simon zu diesem Zeitpunkt noch aussätzig war
  choice: Den Beinamen „Simon der Aussätzige“ beibehalten, ohne einen gegenwärtigen Krankheitszustand zu behaupten
  alternative: „Simon, der früher aussätzig gewesen war“ oder „Simon mit einer Hautkrankheit“
  rationale: Der griechische Text nennt lediglich einen identifizierenden Beinamen. Er sagt weder, ob Simon damals noch erkrankt war, noch ob er geheilt worden war, und erlaubt keine präzise moderne Diagnose.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Betanien und das Haus Simons als zusammengehörige Schauplatzangabe beieinander; der Vers bleibt entsprechend dem griechischen Ausgangstext syntaktisch offen für den folgenden Satz.
