  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: de
  text: 'Dann sagt er zu ihnen: „Meine Seele ist tief betrübt bis zum Tod.[a] Bleibt hier und wacht mit mir.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis an den Tod“ beziehungsweise „bis zum Punkt des Todes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bleibt mit mir wach“. Das griechische Wort kann sowohl Wachbleiben als auch wachsame Aufmerksamkeit bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Gibt den zeitlichen Fortgang der Erzählung knapp und natürlich wieder.
- source_word: λέγει
  choice: sagt er
  rationale: Bewahrt das historische Präsens des Griechischen und damit die Lebendigkeit der Erzählung.
- source_word: Περίλυπός
  choice: tief betrübt
  rationale: Drückt die sehr starke Trauer und innere Bedrängnis in gegenwärtigem, würdigem Deutsch aus.
- source_word: ἡ ψυχή μου
  choice: Meine Seele
  rationale: Bewahrt das ausdrücklich verwendete ψυχή, ohne daraus eine technische Aussage über die menschliche Natur abzuleiten.
- source_word: ἕως θανάτου
  choice: bis zum Tod
  rationale: 'Erhält die knappe und mehrdeutige Grenzformulierung: Die Betrübnis reicht bis an den Tod beziehungsweise bis zum Punkt des Todes.'
- source_word: μείνατε ὧδε
  choice: Bleibt hier
  rationale: Gibt den Ortsbezug und die Aufforderung idiomatisch und unmittelbar wieder.
- source_word: γρηγορεῖτε
  choice: wacht
  rationale: Kann sowohl tatsächliches Wachbleiben als auch wachsame Aufmerksamkeit bezeichnen; „wacht“ hält beide Aspekte offen.
- source_word: μετ’ ἐμοῦ
  choice: mit mir
  rationale: Direkte und natürliche Wiedergabe der Begleitung.
theological_decisions:
- issue: Wiedergabe von ψυχή in Jesu Aussage
  choice: Meine Seele
  alternative: Ich bin tief betrübt
  rationale: Die ausdrückliche Rede von der Seele bleibt erhalten und bezeugt Jesu wirkliche innere Not, ohne eine weitergehende anthropologische Systematik in den Text einzutragen.
- issue: Bedeutungsumfang von γρηγορεῖτε
  choice: wacht mit mir
  alternative: bleibt mit mir wach
  rationale: „Wacht“ lässt sowohl körperliches Wachbleiben als auch wachsame Anteilnahme anklingen; die alternative Betonung des Wachbleibens wird in der Fußnote genannt.
- issue: Reichweite von ἕως θανάτου
  choice: bis zum Tod
  alternative: bis an den Tod / so sehr, dass ich sterben könnte
  rationale: Die knappe Formulierung wahrt die Spannung, ob der Tod als äußerste Intensitätsgrenze oder als mögliche Folge der Betrübnis bezeichnet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens wurde beibehalten. Die knappe Wiederholung „Bleibt hier und wacht mit mir“ wahrt den ernsten, unmittelbaren Ton des griechischen Textes.
