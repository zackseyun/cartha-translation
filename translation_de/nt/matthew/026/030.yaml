  text: καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: de
  text: Und nachdem sie ein Loblied gesungen hatten[a], gingen sie hinaus zum Ölberg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem sie Lob gesungen hatten“. Das griechische Verb kann allgemein das Singen von Lob bezeichnen; „ein Loblied gesungen“ passt zum unmittelbaren Zusammenhang des Mahls und zum üblichen Sprachgebrauch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung des griechischen Textes, ohne eine stärkere zeitliche Folgerung einzutragen.
- source_word: ὑμνήσαντες
  choice: nachdem sie ein Loblied gesungen hatten
  rationale: Das substantivierte deutsche Idiom gibt das Singen von Lob beziehungsweise Hymnen natürlich wieder; der vorzeitige Nebensatz bildet das Aoristpartizip als der Haupthandlung vorausgehende Handlung ab.
- source_word: ἐξῆλθον
  choice: gingen sie hinaus
  rationale: Direkte und idiomatische Wiedergabe von ἐξέρχομαι; im Kontext bezeichnet es das Hinausgehen vom Ort des Mahls.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: zum Ölberg
  rationale: „Ölberg“ ist die etablierte deutsche geografische Bezeichnung und gibt sowohl die Zielrichtung von εἰς als auch den Eigennamen natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die traditionelle Ortsbezeichnung „Ölberg“ bleibt erhalten; die mögliche allgemeinere Bedeutung des Verbs ὑμνέω wird in der Fußnote offengehalten.
