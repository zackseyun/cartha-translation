id: MAT.26.19
reference: Matthew 26:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: de
  text: Und die Jünger taten, was Jesus ihnen aufgetragen hatte, und bereiteten das Passamahl[a] vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Passafest“. Das griechische Wort kann die Passafeier insgesamt bezeichnen, einschließlich des Mahls und gegebenenfalls des Passalamms.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: taten
  rationale: Das häufige Verb bedeutet „tun/machen“; zusammen mit ὡς συνέταξεν bezeichnet es hier die Ausführung einer Anweisung.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Die etablierte und im Deutschen natürliche Bezeichnung für Jesu Schüler und Anhänger.
- source_word: ὡς
  choice: was
  rationale: Die idiomatische Konstruktion „taten, was … aufgetragen hatte“ gibt die durch ὡς ausgedrückte Übereinstimmung mit Jesu Anweisung natürlich wieder.
- source_word: συνέταξεν
  choice: aufgetragen hatte
  rationale: συντάσσω kann „anordnen, auftragen, anweisen“ bedeuten. „Aufgetragen hatte“ wahrt Jesu Autorität, ohne einen unnötig schroffen Ton einzutragen; das Plusquamperfekt markiert die vorausgehende Anweisung.
- source_word: ἡτοίμασαν
  choice: bereiteten … vor
  rationale: Eine direkte und idiomatische Wiedergabe von ἑτοιμάζω im Zusammenhang mit den Vorbereitungen.
- source_word: τὸ πάσχα
  choice: das Passafest
  rationale: πάσχα kann das Passafest beziehungsweise seine Feier einschließlich des Mahls bezeichnen. „Passafest“ bewahrt im Haupttext die Bedeutungsbreite, während die kontextuell mögliche engere Bedeutung in der Fußnote genannt wird.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Im Deutschen übliche Form des Eigennamens.
theological_decisions:
- issue: Bedeutungsumfang von τὸ πάσχα
  choice: das Passafest
  alternative: das Passamahl; das Passalamm
  rationale: Der griechische Ausdruck kann je nach Kontext das Fest, das Mahl oder das Passalamm bezeichnen. Hier geht es um Vorbereitungen für das gemeinsame Mahl, doch der Wortlaut legt sich nicht ausdrücklich auf diese engere Bedeutung fest. Daher bleibt der Haupttext weiter gefasst und die mögliche Präzisierung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „taten, was Jesus ihnen aufgetragen hatte“ ist natürlicher als eine eng formale Nachbildung mit „wie“, ohne den Sinn der Übereinstimmung mit Jesu Anweisung zu verändern.
