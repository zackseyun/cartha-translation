base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: de
  text: 'Da begann er zu fluchen und zu schwören[a]: »Ich kenne den Mann nicht.« Und sofort krähte ein Hahn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Flüche anzurufen und zu schwören«. Wahrscheinlich rief Petrus zur Bekräftigung seiner Verleugnung Flüche auf sich selbst herab.'
    reason: Lexikalische Alternative und Erläuterung der wahrscheinlich selbstverwünschenden Eidformel.
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Markiert knapp und natürlich den nächsten Schritt der Erzählung.
- source_word: ἤρξατο
  choice: begann er
  rationale: Bewahrt den ingressiven Aspekt und zeigt die Steigerung in Petrus’ Verleugnung.
- source_word: καταθεματίζειν
  choice: zu fluchen
  rationale: Gibt das Aussprechen beziehungsweise Anrufen eines Fluches wieder, ohne den im Griechischen nicht ausdrücklich genannten Adressaten des Fluches im Haupttext festzulegen.
- source_word: ὀμνύειν
  choice: zu schwören
  rationale: Bezeichnet hier feierliches Schwören beziehungsweise die Bekräftigung durch einen Eid.
- source_word: ὅτι
  choice: direkte Rede nach Doppelpunkt
  rationale: Leitet den Inhalt des Schwörens und der Verleugnung ein; direkte Rede ist im Deutschen klar und natürlich.
- source_word: Οὐκ οἶδα
  choice: Ich kenne … nicht
  rationale: Bei einer Person bezeichnet οἶδα hier persönliches Kennen; die Formulierung ist idiomatisches modernes Deutsch.
- source_word: τὸν ἄνθρωπον
  choice: diesen Menschen
  rationale: Das deutsche Demonstrativpronomen gibt den abweisenden Bezug auf die betreffende Person idiomatisch wieder; »Mensch« bewahrt die lexikalische Form von ἄνθρωπος.
- source_word: καὶ εὐθέως
  choice: Und sofort
  rationale: Bewahrt den unmittelbaren zeitlichen Anschluss und die erzählerische Dringlichkeit.
- source_word: ἀλέκτωρ
  choice: ein Hahn
  rationale: Die artikellose griechische Form wird mit dem im Deutschen natürlichen unbestimmten Artikel wiedergegeben.
- source_word: ἐφώνησεν
  choice: krähte
  rationale: Ist für den Ruf eines Hahns die idiomatische deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung von καταθεματίζειν bei Petrus’ Verleugnung
  choice: Im Haupttext neutral »zu fluchen«; die Fußnote erläutert das mögliche Anrufen von Flüchen, wahrscheinlich gegen sich selbst.
  alternative: Explizit »Flüche auf sich herabzurufen« oder ein Verfluchen Jesu anzunehmen.
  rationale: Die Verbindung mit ὀμνύειν spricht für eine Fluchformel zur Bekräftigung des Eides, wahrscheinlich mit Selbstverwünschung. Da das Reflexivobjekt im griechischen Text nicht ausdrücklich steht, bleibt der Haupttext zurückhaltend und die wahrscheinliche Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Da begann er« hält den Erzählfluss knapp; »diesen Menschen« vermittelt die distanzierende Verleugnung. Die Fußnote bewahrt die semantische Spannung von καταθεματίζειν, ohne eine nicht ausdrücklich genannte Ergänzung in den Haupttext einzutragen.
