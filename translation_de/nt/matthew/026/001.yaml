  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: de
  text: 'Und als Jesus alle diese Worte beendet hatte, sagte er zu seinen Jüngern:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Als
  rationale: Die semitisch gefärbte matthäische Übergangsformel wird im modernen Deutschen natürlich durch einen temporalen Nebensatz wiedergegeben. „Als“ bewahrt die zeitliche Verknüpfung; ein wörtliches „Und es geschah, als“ wäre unnötig schwerfällig.
- source_word: ἐτέλεσεν
  choice: beendet hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Jesus seine Rede abgeschlossen hatte, bevor er zu den Jüngern sprach. „Beendet“ passt idiomatisch zu „Worte“ und bewahrt den Gedanken des Abschlusses.
- source_word: πάντας τοὺς λόγους τούτους
  choice: alle diese Worte
  rationale: Die Wiedergabe bleibt nahe am griechischen λόγους und erhält die für Matthäus typische Formel am Ende eines Redeabschnitts.
- source_word: εἶπεν
  choice: sagte er
  rationale: „Sagte“ ist die neutrale und direkte Wiedergabe des narrativen Verbs, ohne zusätzliche Bedeutungsnuancen einzutragen.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: Das ausdrückliche Possessivpronomen αὐτοῦ wird bewahrt; „Jünger“ ist die etablierte und sachgerechte Wiedergabe von μαθηταί.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bildet einen flüssigen Übergang vom vorherigen Redeabschnitt zur folgenden Ankündigung. Da die natürlichere Übersetzung die Bedeutung vollständig wiedergibt und keine wesentliche Mehrdeutigkeit verloren geht, ist keine Fußnote erforderlich.
