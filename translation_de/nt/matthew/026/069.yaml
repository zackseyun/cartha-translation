source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: de
  text: 'Petrus aber saß draußen im Innenhof. Da kam eine junge Dienerin[a] auf ihn zu und sagte: »Auch du warst mit Jesus, dem Galiläer, zusammen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklavin«. Das griechische Wort παιδίσκη bezeichnet eine junge weibliche Bedienstete, mitunter eine Sklavin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Die nachgestellte Partikel markiert hier einen leichten Wechsel zurück zu Petrus und kann im Deutschen natürlich mit »aber« wiedergegeben werden, ohne einen starken Gegensatz zu behaupten.
- source_word: ἐκάθητο ἔξω
  choice: saß draußen
  rationale: Das Imperfekt beschreibt den fortdauernden Hintergrundzustand; »saß draußen« ist im Deutschen natürlich und wahrt den Bezug zum Geschehen im Inneren.
- source_word: ἐν τῇ αὐλῇ
  choice: im Innenhof
  rationale: αὐλή bezeichnet hier den offenen Hofbereich des Gebäudes; »Innenhof« ist im Deutschen präzise und geläufig.
- source_word: προσῆλθεν αὐτῷ
  choice: kam ... auf ihn zu
  rationale: Die Form bezeichnet eine konkrete Annäherung; diese Wiedergabe ist anschaulich und idiomatisch.
- source_word: μία παιδίσκη
  choice: eine Dienerin
  rationale: παιδίσκη bezeichnet eine junge weibliche Bedienstete und kann auch eine Sklavin meinen. »Dienerin« gibt ihre soziale Rolle wieder, ohne einen im Kontext nicht eindeutig festgelegten Rechtsstatus zu behaupten. Das Zahlwort μία führt hier eine einzelne Person ein und wird im Deutschen natürlich mit dem unbestimmten Artikel wiedergegeben.
- source_word: λέγουσα
  choice: und sagte
  rationale: Das präsentische Partizip wird in natürlichem modernem Deutsch als beigeordnete finite Aussage wiedergegeben.
- source_word: Καὶ σὺ
  choice: Auch du
  rationale: καί bezieht Petrus nachdrücklich in die Gruppe der mit Jesus Verbundenen ein; »Auch du« bewahrt diese Hervorhebung.
- source_word: ἦσθα μετὰ
  choice: warst ... zusammen
  rationale: Die Wendung bezeichnet schlicht das Zusammensein beziehungsweise die Zugehörigkeit im betreffenden Geschehen; die Formulierung bleibt nahe am Wortlaut und vermeidet eine ausdrückliche Deutung als Jüngerschaft.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Jesus, dem Galiläer
  rationale: Γαλιλαίου dient als identifizierende Herkunftsbezeichnung beziehungsweise Beiname. Die Apposition »dem Galiläer« bewahrt diese Form.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die wörtliche Partizipialkonstruktion wurde idiomatisch aufgelöst; die mögliche Unfreiheit der Dienerin bleibt in der Fußnote sichtbar. Der Fußnotenmarker steht unmittelbar bei dem erklärten Ausdruck.
