- from: Die führenden Priester und der gesamte Hohe Rat[a] suchten nach einer Falschaussage[b] gegen Jesus, um ihn hinrichten zu lassen.
  to: Die führenden Priester und der gesamte Hohe Rat[a] suchten nach falschem Zeugnis[b] gegen Jesus, um ihn zu töten.
