    rationale: θανατώσωσιν bezeichnet das Töten bzw. Zu-Tode-Bringen. Zwar liegt ein gerichtlicher Kontext vor, aber weder eine förmliche Hinrichtung noch das „Lassen“ durch andere wird in diesem Verb ausdrücklich gesagt.
  - severity: low
    issue: „Falschaussage“ ist enger als die griechische Gerichtsbezeichnung.
    rationale: ψευδομαρτυρία bezeichnet falsches Zeugnis bzw. falsche Aussage als Zeugnis. „Falsches Zeugnis“ bewahrt den Bezug auf Zeugenschaft unmittelbarer.
