source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: de
  text: Die führenden Priester und der gesamte Hohe Rat[a] suchten nach falschem Zeugnis[b] gegen Jesus, um ihn zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der gesamte Rat“; gemeint ist das oberste jüdische Leitungsgremium, auch Sanhedrin genannt.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „falscher Aussage“. Das griechische Wort kann im gerichtlichen Zusammenhang eine falsche Aussage oder ein falsches Zeugnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: Die Partikel markiert hier einen leichten narrativen Übergang. Ein ausdrückliches „nun“ oder „aber“ wäre im Deutschen unnötig beziehungsweise zu stark.
- source_word: ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die priesterliche Führungsschicht; „Hohepriester“ könnte fälschlich mehrere gleichzeitig amtierende Hohepriester nahelegen.
- source_word: συνέδριον ὅλον
  choice: der gesamte Hohe Rat
  rationale: „Hoher Rat“ ist die geläufige deutsche Bezeichnung für das jüdische Leitungsgremium; „gesamte“ gibt ὅλον wieder.
- source_word: ἐζήτουν
  choice: suchten nach
  rationale: Das Imperfekt beschreibt ein fortdauerndes Bemühen; die natürliche deutsche Form lässt diesen Verlauf im Kontext erkennen.
- source_word: ψευδομαρτυρίαν
  choice: einer Falschaussage
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Wort den Inhalt eines falschen Zeugnisses. Die mögliche Bedeutung „falsches Zeugnis“ bleibt in einer Fußnote erhalten.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: gegen Jesus
  rationale: κατά mit Genitiv bezeichnet hier die gegen Jesus gerichtete Aussage im gerichtlichen Verfahren.
- source_word: ὅπως
  choice: um
  rationale: Die Infinitivkonstruktion gibt die Zweckbedeutung im modernen Deutsch knapp und natürlich wieder.
- source_word: θανατώσωσιν
  choice: ihn hinrichten zu lassen
  rationale: Im gerichtlichen Kontext geht es darum, Jesu Tötung als Urteil beziehungsweise durch zuständige Gewalt herbeizuführen. Die Formulierung ist idiomatisch, ohne die griechische Aussage auf eine konkrete Vollstreckungsart festzulegen.
theological_decisions:
- issue: Gerichtliche Absicht der führenden Männer
  choice: Die Suche nach einer Falschaussage wird ausdrücklich als Mittel zum Zweck dargestellt, Jesu Hinrichtung herbeizuführen.
  alternative: „um ihn zu töten“
  rationale: Die Zweckkonstruktion ὅπως … θανατώσωσιν verbindet die laufende Suche mit der beabsichtigten Tötung. Der gerichtliche Rahmen rechtfertigt „hinrichten zu lassen“, ohne darüber hinaus eine Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Deutsch. „Führende Priester“ vermeidet die missverständliche Mehrzahl „Hohepriester“; „Hoher Rat“ ist für deutschsprachige Bibelleser zugänglich. Sämtliche Fußnotenmarker stehen unmittelbar nach dem erläuterten Ausdruck.
