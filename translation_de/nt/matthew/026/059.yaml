  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft die führenden Priester, den gesamten Rat, die fortgesetzte Suche und die gegen Jesus gerichtete falsche Aussage grundsätzlich gut. „Ihn hinrichten zu lassen“ geht jedoch über θανατώσωσιν hinaus: Es macht die Führenden zu Veranlassern einer förmlichen Exekution, während das griechische Verb allgemein „töten / zu Tode bringen“ sagt.'
  naturalness: „Die führenden Priester und der gesamte Hohe Rat suchten nach falschem Zeugnis gegen Jesus, um ihn zu töten“ ist modernes, klares und dem gerichtlichen Kontext angemessenes Deutsch. Die unmarkierte Wiedergabe von δέ ist idiomatisch.
  terminology: „Führende Priester“ und „Hoher Rat“ sind angemessen. „Falsches Zeugnis“ bildet ψευδομαρτυρία im juristischen Kontext genauer und weniger modern-rechtstechnisch eng ab als „Falschaussage“.
