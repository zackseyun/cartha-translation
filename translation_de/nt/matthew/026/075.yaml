  naturalness: Das Deutsch ist modernes, flüssiges Standarddeutsch mit einem würdevollen erzählerischen Register. „Da erinnerte sich Petrus“ stellt den narrativen Anschluss natürlich her; „weinte bitterlich“ ist idiomatisch und nicht unnötig altertümlich.
  terminology: „Verleugnen“ trifft ἀπαρνήσῃ in diesem Kontext präzise. Die Namensform „Jesus“ folgt dem griechischen Text ohne hinzugefügten Titel. „Ein Hahn“ gibt den artikellosen ἀλέκτωρ natürlich wieder; eine Fußnote ist im Deutschen nicht erforderlich.
