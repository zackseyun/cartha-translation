id: MAT.26.75
reference: Matthew 26:75
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: de
  text: 'Da erinnerte sich Petrus an das, was Jesus gesagt hatte: „Bevor ein Hahn kräht, wirst du mich dreimal verleugnen.“ Und er ging hinaus und weinte bitterlich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: erinnerte sich
  rationale: Das deponentisch gebrauchte Aoristverb bezeichnet hier, dass Petrus sich an die frühere Aussage erinnert; die reflexive deutsche Wendung ist natürlich und genau.
- source_word: τοῦ ῥήματος Ἰησοῦ εἰρηκότος
  choice: an das, was Jesus gesagt hatte
  rationale: Die Relativkonstruktion gibt das gesprochene ῥῆμα und die zeitliche Vorordnung des Perfektpartizips idiomatisch wieder, ohne den Sinn zu erweitern.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Bevor ein Hahn kräht
  rationale: Der artikellose ἀλέκτωρ wird im Deutschen natürlich mit dem unbestimmten Artikel wiedergegeben; die Infinitivkonstruktion wird als Temporalsatz formuliert.
- source_word: τρὶς
  choice: dreimal
  rationale: Die moderne deutsche Standardform ist klar und knapp.
- source_word: ἀπαρνήσῃ με
  choice: wirst du mich verleugnen
  rationale: „Verleugnen“ bezeichnet in diesem persönlichen Zusammenhang treffend das Abstreiten, Jesus zu kennen oder zu ihm zu gehören.
- source_word: ἐξελθὼν ἔξω
  choice: ging hinaus
  rationale: Die im Griechischen verstärkte Bewegung nach draußen wird idiomatisch mit „hinausgehen“ wiedergegeben.
- source_word: ἔκλαυσεν πικρῶς
  choice: weinte bitterlich
  rationale: Die feste deutsche Verbindung bewahrt die emotionale Schwere des griechischen Verb-Adverb-Ausdrucks ohne zusätzliche Deutung.
theological_decisions:
- issue: Bezeichnung Jesu
  choice: Jesus
  alternative: der Herr Jesus
  rationale: Der griechische Text nennt ausschließlich den Namen Ἰησοῦ; ein christologischer Titel wird nicht ergänzt.
- issue: Charakter von Petrus’ Verleugnung
  choice: verleugnen
  alternative: abstreiten
  rationale: „Verleugnen“ wahrt die persönliche und relationale Tragweite von ἀπαρνέομαι, ohne ausdrücklich ein bestimmtes inneres Motiv wie Reue oder Abfall festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ markiert den erzählerischen Anschluss; „bitterlich“ ist geläufig und ausdrucksstark, ohne altertümlich zu wirken. Keine Fußnote ist erforderlich, da „ein Hahn“ die artikellose griechische Form unmittelbar und idiomatisch wiedergibt.
