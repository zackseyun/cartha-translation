id: MAT.26.43
reference: Matthew 26:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: de
  text: Als er wiederkam, fand er sie schlafend; denn ihre Augen waren schwer geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »waren beschwert« oder »waren schwer«.'
    reason: Die griechische Perfekt-Passiv-Form bezeichnet einen Zustand des Beschwertseins; idiomatisches Deutsch kann diesen als »schwer geworden« ausdrücken.
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: als er wiederkam
  rationale: Das adverbiale Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben; »wieder« bewahrt den Wiederholungsaspekt von πάλιν.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: fand er sie schlafend
  rationale: Die Formulierung erhält das Finden und den durch das Präsenspartizip bezeichneten andauernden Zustand.
- source_word: ἦσαν γὰρ
  choice: denn … waren
  rationale: »Denn« gibt die erklärende Funktion von γάρ wieder und wahrt den Zusammenhang mit dem vorangehenden Befund.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: ihre Augen
  rationale: Dies ist die natürliche deutsche Wiedergabe der griechischen Possessivkonstruktion.
- source_word: βεβαρημένοι
  choice: waren schwer geworden
  rationale: Die Wendung bringt sowohl die Schwere als auch den aus dem griechischen Perfektpartizip hervorgehenden erreichten Zustand zum Ausdruck.
theological_decisions: []
