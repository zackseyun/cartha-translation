id: MAT.26.53
reference: Matthew 26:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: de
  text: Oder meinst du, ich könne meinen Vater nicht bitten[a], und er werde mir sofort mehr als zwölf Legionen von Engeln[c] zur Seite stellen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „meinen Vater anrufen“ oder „meinen Vater um Hilfe bitten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mir beistellen“ oder „mir zur Verfügung stellen“; gemeint ist, sie mir als Beistand bereitzustellen.'
    reason: lexical_alternative
  - marker: c
    text: Eine römische Legion war ein großer Heeresverband. Das Bild betont eine überwältigende himmlische Streitmacht.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet eine weitere rhetorische Herausforderung innerhalb von Jesu Zurechtweisung ein und bewahrt den Zusammenhang mit dem vorangehenden Satz.
- source_word: δοκεῖς
  choice: meinst du
  rationale: Gibt die direkte rhetorische Frage in natürlichem, modernem Deutsch wieder.
- source_word: οὐ δύναμαι
  choice: ich könne … nicht
  rationale: Bezeichnet Jesu Fähigkeit, nicht seine Erlaubnis oder Bereitschaft. Der Konjunktiv I steht nach dem Verb des Meinens.
- source_word: παρακαλέσαι
  choice: um Hilfe bitten
  rationale: Im Zusammenhang bezeichnet das Verb eine eindringliche Bitte an den Vater um Beistand; die Ergänzung „um Hilfe“ macht den kontextuellen Sinn natürlich verständlich.
- source_word: τὸν πατέρα μου
  choice: meinen Vater
  rationale: Bewahrt die unmittelbare personale und familiale Gottesbezeichnung des griechischen Textes.
- source_word: παραστήσει μοι
  choice: er werde mir … zur Seite stellen
  rationale: Bewahrt das Bild, dass der Vater die Engel Jesus zur Unterstützung bereitstellen würde, statt das weniger genaue „senden“ zu wählen.
- source_word: ἄρτι
  choice: sofort
  rationale: Drückt die im Kontext betonte unmittelbare Verfügbarkeit der Hilfe klar und idiomatisch aus.
- source_word: πλείω δώδεκα
  choice: mehr als zwölf
  rationale: Gibt den Vergleich mit der Zahl zwölf direkt und ohne unnötige Erweiterung wieder.
- source_word: λεγιῶνας
  choice: Legionen
  rationale: Erhält das römische Militärbild und damit die Vorstellung einer überwältigenden Streitmacht.
- source_word: ἀγγέλων
  choice: Engel
  rationale: Hier sind eindeutig himmlische Wesen und nicht menschliche Boten gemeint.
theological_decisions:
- issue: Ob Jesu Aussage seine Fähigkeit, seine Erlaubnis oder seine Bereitschaft betrifft
  choice: 'Als Fähigkeit wiedergegeben: „ich könne meinen Vater nicht … bitten“'
  alternative: Eine freiere Wiedergabe, die mangelnde Bereitschaft oder fehlende Erlaubnis nahelegt
  rationale: δύναμαι bezeichnet Können oder Vermögen. Die Formulierung bewahrt die Spannung, dass Jesus überwältigende himmlische Hilfe erbitten könnte, dies aber im Zusammenhang nicht tut.
- issue: Gewissheit und Unmittelbarkeit der Hilfe des Vaters
  choice: „er werde mir sofort … zur Seite stellen“
  alternative: Eine konditionale Abschwächung wie „er könnte mir … zur Seite stellen“
  rationale: Das griechische Futur παραστήσει stellt die Reaktion des Vaters als gewiss dar; die Übersetzung schwächt diese Aussage nicht zu einer bloßen Möglichkeit ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die indirekte Rede mit Konjunktiv I erhält die rhetorische Frage als einen zusammenhängenden Satz; „zur Seite stellen“ bewahrt zugleich das konkrete Bild des griechischen Verbs.
