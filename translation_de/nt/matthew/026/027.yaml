  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: de
  text: 'Und er nahm einen Becher, sagte Dank und gab ihn ihnen mit den Worten: »Trinkt alle daraus!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und nachdem er einen Becher genommen und Dank gesagt hatte, gab er ihn ihnen und sagte: ›Trinkt alle daraus!‹« Statt »einen Becher« ist dem Zusammenhang nach auch »den Becher« möglich.'
    reason: Dokumentiert die griechische Partizipialkonstruktion und die mögliche kontextuelle Bestimmtheit des artikellosen ποτήριον.
lexical_decisions:
- source_word: λαβὼν
  choice: nahm
  rationale: Das finite Präteritum gibt das vorzeitige aoristische Partizip im Deutschen natürlich wieder, ohne den Handlungsablauf zu verändern.
- source_word: ποτήριον
  choice: einen Becher
  rationale: Das griechische Substantiv steht ohne Artikel. »Einen Becher« bewahrt diese Form; »Becher« ist hier eine natürliche Bezeichnung für das Trinkgefäß.
- source_word: εὐχαριστήσας
  choice: dankte Gott
  rationale: εὐχαριστέω bedeutet »Dank sagen«. Im Deutschen braucht »danken« gewöhnlich eine Ergänzung; Gott ist im jüdischen Mahlkontext der selbstverständliche Empfänger des Dankes. Die Wiedergabe vermeidet eine sakramentale Überdeutung.
- source_word: ἔδωκεν αὐτοῖς
  choice: gab ihn ihnen
  rationale: Das maskuline Pronomen nimmt den deutschen »Becher« auf; »ihnen« entspricht dem Dativ αὐτοῖς.
- source_word: λέγων
  choice: mit den Worten
  rationale: Diese idiomatische Wendung führt die direkte Rede natürlich ein und gibt die Funktion des Partizips wieder.
- source_word: Πίετε ἐξ αὐτοῦ πάντες
  choice: Trinkt alle daraus!
  rationale: Der Pluralimperativ richtet sich zusammen mit πάντες an die gesamte anwesende Gruppe. »Daraus« bezeichnet eindeutig das Trinkgefäß als Quelle und vermeidet die missverständliche Lesart, jeder solle dessen gesamten Inhalt trinken.
theological_decisions:
- issue: Mögliche eucharistische oder sakramentale Konnotation von εὐχαριστήσας
  choice: »dankte Gott«
  alternative: »sprach das Dankgebet«; »segnete ihn«
  rationale: Der griechische Wortlaut bezeichnet das Danksagen, nicht ausdrücklich ein Segnen des Bechers. Die Übersetzung bleibt beim lexikalischen Sinn und legt keine spätere Sakramententheologie in den Vers hinein.
- issue: Bezugsbereich von πάντες
  choice: »Trinkt alle daraus«
  alternative: »Trinkt alles daraus«; »Trinkt davon«
  rationale: 'πάντες ist maskuliner Plural und bezeichnet die angesprochenen Personen: Alle von ihnen sollen trinken. Es beschreibt nicht die Menge des zu trinkenden Inhalts.'
- issue: Bestimmtheit von ποτήριον
  choice: »einen Becher«
  alternative: »den Becher«
  rationale: Der fehlende griechische Artikel spricht formal für die unbestimmte Wiedergabe, obwohl der Mahlkontext auch eine bestimmte deutsche Form ermöglichen würde. Die genuine Übersetzungsalternative wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen finiten Verben bilden den griechischen Handlungsablauf flüssig ab. »Becher« ist allgemeinverständlich und weniger kultisch vorgeprägt als »Kelch«; »Trinkt alle daraus« wahrt die klare Ausrichtung des Befehls auf die ganze Gruppe.
