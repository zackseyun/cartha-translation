  source_fidelity: „Steht auf“ gibt den pluralischen Imperativ ἐγείρεσθε präzise wieder, „lasst uns gehen“ den hortativen Konjunktiv ἄγωμεν. „Seht“ bildet die aufmerksamkeitslenkende Partikel ἰδού angemessen ab. „ist nahe“ gibt den gegenwartsbezogenen Ergebniszustand von ἤγγικεν idiomatisch wieder. „der mich ausliefert“ wahrt bei ὁ παραδιδούς με die konkrete Übergabe-/Auslieferungshandlung und vermeidet eine nicht im Wortlaut explizierte Rollenbezeichnung.
