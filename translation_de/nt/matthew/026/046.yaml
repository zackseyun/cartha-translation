  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: de
  text: Steht auf, lasst uns gehen! Seht, der mich ausliefert[a], ist nahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der mich verrät.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Steht auf
  rationale: Der pluralische Imperativ richtet sich unmittelbar an die Jünger; „Steht auf“ ist im modernen Deutschen natürlich und präzise.
- source_word: ἄγωμεν
  choice: lasst uns gehen
  rationale: Der hortative Konjunktiv der ersten Person Plural wird idiomatisch mit „lasst uns gehen“ wiedergegeben.
- source_word: ἰδού
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel hebt die unmittelbar bevorstehende Entwicklung eindringlich hervor; „Seht“ bewahrt diese Funktion ohne altertümlichen Klang.
- source_word: ἤγγικεν
  choice: ist nahe
  rationale: Das Perfekt bezeichnet eine vollzogene Annäherung mit gegenwärtigem Ergebnis; „ist nahe“ bringt diesen Zustand knapp und natürlich zum Ausdruck.
- source_word: ὁ παραδιδούς με
  choice: der mich ausliefert
  rationale: Das substantivierte Präsenspartizip bezeichnet denjenigen durch seine gerade wirksame Handlung. „Ausliefert“ bewahrt die konkrete Bedeutung von παραδίδωμι und lässt den im Kontext eindeutigen Verrat mitschwingen.
theological_decisions:
- issue: Wiedergabe von παραδιδούς im Passionskontext
  choice: der mich ausliefert
  alternative: mein Verräter
  rationale: Der griechische Ausdruck benennt konkret denjenigen, der Jesus übergibt beziehungsweise ausliefert. Obwohl die Handlung eindeutig Verrat ist, wahrt die konkrete Formulierung die Bild- und Handlungsebene des Ausgangstextes und vermeidet eine unnötige Verengung auf eine Rollenbezeichnung.
translation_notes:
  register: Moderne, würdevolle direkte Rede. Das Ausrufezeichen nach „gehen“ vermittelt die Dringlichkeit, ohne zusätzliche Bedeutung einzutragen. „Seht“ entspricht dem pluralischen Adressatenkreis und dem gehobenen, aber allgemein verständlichen biblischen Sprachregister.
