  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: de
  text: Denn die Armen habt ihr immer bei euch, mich aber habt ihr nicht immer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: immer
  rationale: Das Adverb bezeichnet die fortdauernde Verfügbarkeit bzw. Anwesenheit und wird in beiden Satzhälften gleich wiedergegeben, damit der Kontrast erhalten bleibt.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die vorausgehende Aussage; „denn“ stellt diesen erklärenden Zusammenhang knapp und natürlich her.
- source_word: τοὺς πτωχοὺς
  choice: die Armen
  rationale: Der substantivierte Plural bezeichnet arme Menschen als Gruppe. „Die Armen“ ist im Deutschen idiomatisch, würdevoll und hinreichend deutlich.
- source_word: ἔχετε
  choice: habt
  rationale: ἔχω bezeichnet hier Anwesenheit bzw. Verfügbarkeit, nicht Besitz. Das deutsche „haben“ bewahrt die schlichte Parallelstruktur beider Satzhälften.
- source_word: μεθ’ ἑαυτῶν
  choice: bei euch
  rationale: Die Wendung bezeichnet die Anwesenheit in ihrer Gemeinschaft. „Bei euch“ ist im Deutschen natürlicher als das wörtliche „mit euch selbst“ und passt inhaltlich zu beiden Vorkommen von ἔχετε.
- source_word: ἐμὲ
  choice: mich
  rationale: Das betonte Objektpronomen bezieht sich auf Jesus selbst; „mich“ ist die direkte Entsprechung.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert den Gegensatz zwischen der beständigen Anwesenheit der Armen und der zeitlich begrenzten Anwesenheit Jesu.
- source_word: οὐ πάντοτε
  choice: nicht immer
  rationale: Die Verneinung bildet den ausdrücklichen Gegenpol zum ersten πάντοτε; „nicht immer“ bewahrt diesen Kontrast ohne zusätzliche Deutung.
theological_decisions:
- issue: Bedeutung der Gegenwart Jesu
  choice: Der Wortlaut stellt die fortdauernde Anwesenheit der Armen der zeitlich begrenzten Anwesenheit Jesu bei den Jüngern gegenüber.
  alternative: Die Aussage kann als Geringschätzung der Fürsorge für arme Menschen verstanden werden.
  rationale: Der griechische Text formuliert einen zeitlichen Gegensatz, nicht ausdrücklich eine moralische Abwertung der Armen. Die Übersetzung erhält diesen Gegensatz, ohne weitergehende lehrmäßige Folgerungen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Satzstruktur. Die Wiederholung von „habt“ und „immer“ spiegelt bewusst die Parallelität und den Kontrast des griechischen Textes.
