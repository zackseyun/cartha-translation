- from: 'Als die Jünger das sahen, wurden sie empört und sagten: »Wozu diese Verschwendung?«'
  to: 'Als die Jünger das sahen, empörten sie sich und sagten: »Wozu diese Verschwendung?«'
  rationale: Die einzige Änderung ersetzt die weniger natürliche Prädikatsfügung »wurden sie empört« durch »empörten sie sich«. Dadurch wird der aoristische Reaktionseintritt von ἠγανάκτησαν idiomatisch wiedergegeben, ohne Bedeutung, Register oder die Kürze der direkten Frage zu verändern.
