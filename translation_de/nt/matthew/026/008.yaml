  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: de
  text: 'Als die Jünger das sahen, empörten sie sich und sagten: »Wozu diese Verschwendung?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Als ... sahen
  rationale: Das Aoristpartizip wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben. »Das« nimmt die zuvor geschilderte Salbung als implizites Objekt auf.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die leichte narrative Weiterführung beziehungsweise der Kontrast wird durch den Satzanschluss und die negative Reaktion hinreichend deutlich; ein ausdrückliches »aber« wäre möglich, im modernen deutschen Erzählfluss jedoch nicht nötig.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Dies ist die etablierte und kontextgerechte deutsche Wiedergabe von μαθηταί. Ein Possessivpronomen steht im Griechischen nicht.
- source_word: ἠγανάκτησαν
  choice: wurden sie empört
  rationale: ἀγανακτέω bezeichnet starken, entrüsteten Unwillen. »Empört« bewahrt den wertenden Ton besser als das schwächere »verärgert«.
- source_word: λέγοντες
  choice: und sagten
  rationale: Die koordinierte deutsche Form gibt das begleitende Partizip idiomatisch wieder und leitet die direkte Rede klar ein.
- source_word: Εἰς τί
  choice: Wozu
  rationale: Die Wendung fragt wörtlich nach Zweck oder Ziel. »Wozu« ist knapp, natürlich und bewahrt diesen Sinn genauer als das allgemeinere »Warum«.
- source_word: ἡ ἀπώλεια αὕτη
  choice: diese Verschwendung
  rationale: Im Zusammenhang mit dem ausgegossenen kostbaren Salböl bezeichnet ἀπώλεια einen als unnütz betrachteten Verlust; »Verschwendung« ist dafür die natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte, entrüstete Frage bleibt knapp und pointiert; die im Griechischen implizite Bezugnahme auf die Salbung wird mit »das« natürlich ausgedrückt.
