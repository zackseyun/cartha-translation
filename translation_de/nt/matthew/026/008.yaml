review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die temporale Funktion von ἰδόντες, die implizite Bezugnahme auf die vorausgehende Handlung, die Jünger als Subjekt sowie die zweckbezogene Frage Εἰς τί zuverlässig wieder. »Wozu diese Verschwendung?« trifft ἡ ἀπώλεια αὕτη im Kontext präzise. Das unübersetzte δέ ist im deutschen Erzählfluss vertretbar.
  naturalness: »wurden sie empört« ist im heutigen Standarddeutsch weniger idiomatisch und kann missverständlich wirken, als seien sie von außen empört worden. »empörten sie sich« ist natürlich und gibt die eintretende starke Missbilligung von ἠγανάκτησαν angemessen wieder.
  terminology: »Jünger« ist im Evangelienkontext die etablierte, registergerechte Wiedergabe von μαθηταί. »Verschwendung« und »Wozu« sind idiomatisch und semantisch passend. Keine theologischen oder namensbezogenen Fragen bestehen.
