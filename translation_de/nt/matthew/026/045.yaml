  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: de
  text: 'Dann kommt er zu den Jüngern und sagt zu ihnen: „Schlaft jetzt weiter und ruht euch aus.[a] Seht, die Stunde hat sich genähert,[b] und der Menschensohn wird in die Hände von Sündern ausgeliefert.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als rhetorische Frage: „Schlaft ihr noch immer und ruht euch aus?“ Die griechische Formulierung kann auch so verstanden werden; im Haupttext bleibt ihr möglicher ironischer Klang erhalten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die Stunde ist gekommen“ beziehungsweise „die Stunde ist da“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verraten“. Das griechische Wort bedeutet allgemeiner „übergeben“ oder „ausliefern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Natürlicher zeitlicher Anschluss, der die folgende Handlung in der Erzählfolge einleitet.
- source_word: ἔρχεται ... καὶ λέγει
  choice: kommt ... und sagt
  rationale: Das historische Präsens wird beibehalten; es ist auch im modernen deutschen Erzählen verständlich und bewahrt die Lebendigkeit des griechischen Textes.
- source_word: πρὸς τοὺς μαθητάς
  choice: zu den Jüngern
  rationale: Idiomatiches Deutsch für die durch πρός mit Akkusativ bezeichnete Bewegung auf Personen zu.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Schlaft jetzt weiter und ruht euch aus!
  rationale: Gibt die Oberflächenform als Aufforderung wieder und lässt zugleich den im Zusammenhang möglichen ironischen oder rhetorischen Klang bestehen; eine Fußnote nennt die mögliche Frageform.
- source_word: ἰδού
  choice: Seht
  rationale: Moderne, würdevolle Aufmerksamkeitsformel; weniger altertümlich als „siehe“ und etwas feierlicher als „schaut“.
- source_word: ἤγγικεν ἡ ὥρα
  choice: die Stunde ist nahe gekommen
  rationale: Bewahrt den perfektischen Aspekt und die Grundbedeutung der eingetretenen Nähe, ohne vorschnell ausschließlich mit „ist gekommen“ oder „ist da“ wiederzugeben.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Eingebürgerte deutsche Wiedergabe der bedeutsamen Selbstbezeichnung Jesu.
- source_word: παραδίδοται
  choice: wird ... ausgeliefert
  rationale: „Ausliefern“ bewahrt die breitere Bedeutung des Übergebens und verengt das Wort nicht auf den Verrat des Judas; das Präsens Passiv bezeichnet das nun eintretende Geschehen.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: in die Hände von Sündern
  rationale: Die klare und im Deutschen verständliche konkrete Wendung des griechischen Textes wird erhalten.
theological_decisions:
- issue: Aussage- oder Fragecharakter von Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Im Haupttext als ironisch oder zugestehend klingende Aufforderung: „Schlaft jetzt weiter und ruht euch aus!“'
  alternative: „Schlaft ihr noch immer und ruht euch aus?“
  rationale: Die griechische Formulierung kann im Kontext rhetorisch als Frage verstanden werden, ist im überlieferten Wortlaut jedoch nicht ausdrücklich als solche markiert. Der Haupttext bewahrt deshalb die Spannung, während die Fußnote die andere plausible Auffassung nennt.
- issue: Bedeutungsumfang von παραδίδοται im Passionszusammenhang
  choice: „wird ... ausgeliefert“
  alternative: „wird verraten“
  rationale: Die breitere Wiedergabe umfasst Verrat, Festnahme und Übergabe, ohne das Passiv auf eine einzelne menschliche Handlung oder eine bestimmte theologische Deutung festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Das historische Präsens und die konkrete Wendung „in die Hände“ bleiben erhalten. „Seht“ dient als natürliche, nicht altertümliche Aufmerksamkeitsformel.
