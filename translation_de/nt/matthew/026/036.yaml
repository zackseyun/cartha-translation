source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: de
  text: 'Dann kommt Jesus mit ihnen zu einem Ort, der Gethsemane heißt, und sagt zu den Jüngern: »Setzt euch hier hin, bis ich dorthin gehe und bete.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Der zeitliche Anschluss führt das nächste Geschehen in der Erzählfolge ein; »Dann« ist natürlich und prägnant.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das historische Präsens wird zur Wahrung der erzählerischen Unmittelbarkeit im Deutschen beibehalten.
- source_word: μετ’ αὐτῶν
  choice: mit ihnen
  rationale: Gibt die Begleitung durch μετά mit Genitiv direkt wieder.
- source_word: χωρίον
  choice: Ort
  rationale: χωρίον bezeichnet hier allgemein einen Ort beziehungsweise ein Grundstück; »Garten« wäre eine aus Johannes 18,1 eingetragene Präzisierung.
- source_word: λεγόμενον Γεθσημανί
  choice: der Getsemani heißt
  rationale: Natürliche deutsche Wiedergabe der Ortsbenennung; der Eigenname wird in gebräuchlicher deutscher Form transliteriert.
- source_word: λέγει
  choice: sagt
  rationale: Auch dieses historische Präsens bleibt erhalten und entspricht dem lebendigen Erzählstil des Griechischen.
- source_word: Καθίσατε αὐτοῦ
  choice: Setzt euch hier hin
  rationale: Der einfache Imperativ und das Ortsadverb werden in einer natürlichen modernen Aufforderung wiedergegeben.
- source_word: ἕως οὗ
  choice: während
  rationale: Obwohl die Wendung formal »bis« bedeutet, bezeichnet sie hier den Zeitraum, in dem die Jünger sitzen bleiben sollen; »während« ist im Deutschen idiomatisch und wahrt den Sinn.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: ich dort hingehe und bete
  rationale: Das vorzeitige Partizip wird als koordinierte Verbalfolge wiedergegeben; »dort« bewahrt den räumlichen Gegensatz zu »hier«.
theological_decisions:
- issue: Art des Ortes Getsemani
  choice: χωρίον wird mit »Ort« wiedergegeben.
  alternative: »Garten«
  rationale: Matthäus bezeichnet Getsemani nicht ausdrücklich als Garten. »Ort« wahrt seine Formulierung, ohne eine Angabe aus Johannes 18,1 einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die historischen Präsensformen werden beibehalten. Keine Fußnote nötig, da »während« den temporären Sinn von ἕως οὗ im Deutschen natürlich ausdrückt; die Alternative »bis« erzeugt hier keine für die Veröffentlichung wesentliche Bedeutungsdifferenz.
