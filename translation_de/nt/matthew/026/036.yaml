- from: 'Dann kommt Jesus mit ihnen zu einem Ort, der Getsemani heißt, und sagt zu den Jüngern: »Setzt euch hier hin, während ich dort hingehe und bete.«'
  to: 'Dann kommt Jesus mit ihnen zu einem Ort, der Gethsemane heißt, und sagt zu den Jüngern: »Setzt euch hier hin, bis ich dorthin gehe und bete.«'
  rationale: Die Revision stellt die direkte zeitliche Bedeutung von ἕως οὗ mit »bis« im Haupttext wieder her und dokumentiert die im Kontext mögliche idiomatische Wiedergabe »während« in einer Fußnote. Außerdem werden die gebräuchliche deutsche Ortsnamensform »Gethsemane« und das richtungsbezogene »dorthin« verwendet. Bedeutung und Zurückhaltung von χωρίον als »Ort« bleiben erhalten.
