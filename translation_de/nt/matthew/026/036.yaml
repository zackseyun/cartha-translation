review_pass:
  verdict: revise
  source_fidelity: Die historischen Präsensformen, die Wiedergabe von χωρίον als »Ort« und der Gegensatz von »hier« und dem entfernten Ort sind treffend. Bei ἕως οὗ ist jedoch »bis« die unmittelbare deutsche Entsprechung und sollte im Haupttext stehen; »während« gibt die pragmatisch naheliegende Dauer zwar wieder, schwächt aber die im Griechischen ausgedrückte Grenzsetzung ab.
  naturalness: Der Vers ist insgesamt flüssig und entspricht modernem Standarddeutsch. »Gethsemane« ist die im heutigen deutschen Bibelgebrauch weitaus geläufigere Namensform. »dorthin gehe« macht die Bewegungsrichtung idiomatischer deutlich als »dort hingehe«.
  terminology: »Ort« vermeidet zu Recht die nicht von Matthäus selbst genannte Einengung auf einen Garten. »Gethsemane« ist als etablierte deutsche Form des Ortsnamens vorzuziehen. »bete« ist für προσεύξωμαι registergerecht und präzise.
  issues:
  - severity: medium
    issue: ἕως οὗ wird mit »während« statt mit »bis« wiedergegeben.
    rationale: Die griechische Wendung bedeutet formal »bis [zu dem Zeitpunkt, da]«. Der Kontext erlaubt eine idiomatische Dauerauffassung, doch der Haupttext sollte die zeitliche Begrenzung nicht nivellieren. Eine Anmerkung kann die idiomatische Alternative nennen.
  - severity: low
    issue: Ungebräuchlichere Namensform »Getsemani«.
    rationale: »Gethsemane« ist im modernen deutschen Standard- und Bibelgebrauch die etablierte Schreibung und wahrt den Eigennamen ebenso.
  - severity: low
    issue: »dort hingehe« ist weniger richtungsbezogen als möglich.
    rationale: Mit dem Bewegungsverb »hingehen« ist »dorthin« die idiomatischere Wiedergabe des vom Standort der Jünger abgesetzten Orts ἐκεῖ.
  revised_text: 'Dann kommt Jesus mit ihnen zu einem Ort, der Gethsemane heißt, und sagt zu den Jüngern: »Setzt euch hier hin, bis ich dorthin gehe und bete.«'
  revised_footnotes:
  - marker: a
    text: 'Oder: »während ich dorthin gehe und bete«. Das griechische ἕως οὗ bedeutet wörtlich »bis [zu dem Zeitpunkt, da]«; im Zusammenhang kann die Aufforderung auch die Dauer seines Weggehens und Betens bezeichnen.'
    reason: lexical_alternative
