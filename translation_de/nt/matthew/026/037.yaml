review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt παραλαβών, die Bezeichnung der beiden Söhne des Zebedäus und den durch ἤρξατο markierten Beginn zutreffend wieder. „Von tiefer Unruhe erfüllt“ trifft ἀδημονεῖν jedoch weniger genau: Das Wort bezeichnet hier akute innere Bedrängnis bzw. Beklemmung, nicht lediglich Unruhe.'
  naturalness: Die Formulierung ist insgesamt verständlich, aber die Aufteilung in zwei Sätze mit „Da“ fügt eine nicht ausdrücklich markierte zeitlich-folgernde Nuance hinzu. Ein Satz bildet die griechische Verbindung natürlicher und genauer ab.
  terminology: „Traurig“ ist für λυπεῖσθαι angemessen. „Tief bedrückt“ gibt die gesteigerte innere Bedrängnis von ἀδημονεῖν in modernem Standarddeutsch klarer wieder, ohne zu „Verzweiflung“ oder „Entsetzen“ zu übersteigern. Namen und theologisch relevante Aussage bleiben unverändert.
  issues:
  - severity: medium
    issue: „von tiefer Unruhe erfüllt“ für ἀδημονεῖν
    rationale: „Unruhe“ kann bloße Rastlosigkeit oder Nervosität bezeichnen und schwächt die im Kontext und im Wort enthaltene schwere innere Bedrängnis ab. „tief bedrückt“ ist semantisch näher und idiomatischer.
  - severity: low
    issue: Satztrennung und hinzugefügtes „Da“
    rationale: Das griechische Partizip ist eng mit dem Hauptsatz verbunden; „Da“ ist nicht falsch, fügt aber eine explizitere Übergangsnuance ein. Die einheitliche Satzstruktur bewahrt die Verknüpfung ohne Zusatz.
  revised_text: Und er nahm Petrus und die beiden Söhne des Zebedäus mit sich und begann, traurig und tief bedrückt zu sein.[a]
