revisions:
- from: Und er nahm Petrus und die beiden Söhne des Zebedäus mit sich. Da begann er, traurig und von tiefer Unruhe erfüllt zu sein.[a]
  to: Und er nahm Petrus und die beiden Söhne des Zebedäus mit sich und begann, traurig und tief bedrückt zu sein.[a]
  rationale: Die Revision ersetzt die zu schwache bzw. potenziell anders akzentuierte „tiefe Unruhe“ durch „tief bedrückt“ und stellt die enge syntaktische Verbindung von Mitnehmen und einsetzendem Kummer wieder her. Sie bewahrt die zweifache Beschreibung des griechischen Textes, die ausdrückliche Anfangsnuance und die sachliche Darstellung von Jesu menschlicher Trauer und Bedrängnis.
