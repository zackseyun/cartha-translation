  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: de
  text: Und er nahm Petrus und die beiden Söhne des Zebedäus mit sich und begann, traurig und tief bedrückt zu sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er begann, betrübt und in großer Bedrängnis zu sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: nahm … mit sich
  rationale: Das Aoristpartizip bezeichnet hier, dass Jesus ausgewählte Begleiter mitnimmt. Die deutsche Wendung ist natürlich und gibt den relationalen Sinn ohne Zusatz wieder.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: die beiden Söhne des Zebedäus
  rationale: Die Formulierung bewahrt die ausdrückliche Bezeichnung des griechischen Textes und ergänzt nicht interpretierend die Namen Jakobus und Johannes.
- source_word: ἤρξατο
  choice: begann
  rationale: Der Beginn des Zustands ist im Griechischen ausdrücklich markiert und wird im Deutschen klar wiedergegeben.
- source_word: λυπεῖσθαι
  choice: traurig … zu sein
  rationale: Das Verb bezeichnet das Erleben von Trauer oder Betrübnis. „Traurig“ ist in modernem Deutsch klar und würdevoll.
- source_word: ἀδημονεῖν
  choice: von tiefer Unruhe erfüllt zu sein
  rationale: Das Verb bezeichnet starke innere Bedrängnis, Beklemmung oder Unruhe. Die Formulierung unterscheidet es von λυπεῖσθαι, ohne es über die lexikalische Aussage hinaus zu „Verzweiflung“ oder „Entsetzen“ zu steigern.
- source_word: καὶ ... καὶ
  choice: und … und
  rationale: Die Koordination der Begleiter und der beiden emotionalen Zustände bleibt gewahrt; im zweiten Fall wird sie in eine natürliche deutsche Doppelbeschreibung eingebunden.
theological_decisions:
- issue: Darstellung des emotionalen Zustands Jesu im Blick auf die Christologie
  choice: Beide Verben als wirkliche menschliche Trauer und starke innere Bedrängnis wiedergeben
  alternative: Die emotionale Verletzlichkeit abschwächen oder die Aussage zu Entsetzen beziehungsweise Verzweiflung steigern
  rationale: Der griechische Text beschreibt Jesu echtes menschliches Leiden. Die Übersetzung wahrt diese Spannung, ohne seine Trauer abzuschwächen oder einen über den Wortlaut hinausgehenden Zustand der Hoffnungslosigkeit einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Aufteilung in zwei Sätze vermeidet ein schwerfälliges Partizipialgefüge; „Da“ bildet den zeitlichen Übergang ab. Der Fußnotenmarker steht unmittelbar nach der betreffenden Aussage.
