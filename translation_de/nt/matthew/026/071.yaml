  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: de
  text: 'Als er aber zum Torbereich hinausging, sah ihn eine andere Frau und sagt zu den Leuten dort: »Dieser Mann war mit Jesus, dem Nazarener, zusammen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: Torbereich
  rationale: Bezeichnet hier den Bereich am Eingang beziehungsweise Tor und ist im Deutschen natürlicher und räumlich weniger eng als nur »Tor«.
- source_word: λέγει
  choice: sagt
  rationale: Bewahrt das historische Präsens des griechischen Textes, das die Erzählung vergegenwärtigt.
- source_word: ὁ Ναζωραῖος
  choice: der Nazarener
  rationale: Gibt die Herkunftsbezeichnung beziehungsweise den geläufigen Beinamen Jesu knapp und traditionsgemäß wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel zum historischen Präsens in »sagt« wird entsprechend dem griechischen Wortlaut bewahrt; »dieser Mann« bildet die demonstrative Hervorhebung von οὗτος ab.
