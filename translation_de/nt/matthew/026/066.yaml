  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: de
  text: '„Was meint ihr?“ Sie antworteten[a]: „Er ist des Todes schuldig.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat den Tod verdient“ beziehungsweise „Er ist dem Tod verfallen.“ Die griechische Wendung bezeichnet ein rechtliches Urteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Was meint ihr?
  rationale: Die Wendung mit δοκέω und dem Dativ fragt idiomatisch nach der Einschätzung beziehungsweise dem Urteil der Angesprochenen. „Was meint ihr?“ ist natürliches modernes Deutsch und bewahrt die unmittelbare Frageform.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Sie antworteten
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine geläufige erzählerische Ausdrucksweise und wird im Deutschen natürlich mit einem einzigen finiten Verb wiedergegeben. δέ ist hier nur schwach weiterführend und muss nicht eigens übersetzt werden.
- source_word: Ἔνοχος θανάτου
  choice: des Todes schuldig
  rationale: ἔνοχος mit dem Genitiv bezeichnet in diesem gerichtlichen Zusammenhang Schuld beziehungsweise Strafverfallenheit hinsichtlich des Todes. „Des Todes schuldig“ ist eine knappe, würdige und im biblisch-rechtlichen Kontext verständliche Urteilsformel; die Fußnote nennt natürlichere rechtssprachliche Deutungen.
- source_word: ἐστίν
  choice: Er ist
  rationale: Die Kopula wird bewahrt; das im Griechischen implizite Subjekt wird im Deutschen als „Er“ ausgedrückt.
theological_decisions:
- issue: Rechtlicher Charakter des Urteils des Hohen Rates
  choice: Er ist des Todes schuldig
  alternative: Er hat den Tod verdient; Er ist dem Tod verfallen
  rationale: Die Übersetzung gibt das Urteil der Ratsmitglieder als rechtliche Verurteilung wieder, ohne daraus eine Aussage über Jesu tatsächliche Schuld vor Gott oder über die Bedeutung seines Todes abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die traditionelle Wendung „des Todes schuldig“ erhält die knappe gerichtliche Prägung des griechischen Ausdrucks; ihre Bedeutung wird in der Fußnote erläutert.
