id: MAT.26.47
reference: Matthew 26:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: de
  text: Und noch während er redete, siehe, da kam Judas, einer der Zwölf, und mit ihm eine große Menschenmenge mit Schwertern und Knüppeln[a], von den obersten Priestern und den Ältesten des Volkes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Stöcken«. Das griechische Wort bezeichnet wörtlich Holzstücke; hier sind wahrscheinlich als Schlagwaffen verwendete Knüppel gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: »von den obersten Priestern und den Ältesten des Volkes geschickt«. Wörtlich steht im Griechischen: »von den obersten Priestern und den Ältesten des Volkes«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: noch während er redete
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig andauernde Handlung; »noch während« gibt sowohl ἔτι als auch die zeitliche Beziehung natürlich wieder.
- source_word: ἰδοὺ
  choice: siehe, da
  rationale: Die Wendung bewahrt den hervorgehobenen, lebhaften Erzählimpuls von ἰδού, ohne ihn mit »plötzlich« zeitlich zu überdeuten.
- source_word: Ἰούδας
  choice: Judas
  rationale: Im Deutschen etablierte Form des Personennamens.
- source_word: εἷς τῶν δώδεκα
  choice: einer der Zwölf
  rationale: Die partitive Wendung wird direkt wiedergegeben; die Großschreibung macht die im Kontext klar umrissene Jüngergruppe kenntlich.
- source_word: ἦλθεν
  choice: kam
  rationale: Direkte und natürliche Wiedergabe des erzählenden Aorists von ἔρχομαι.
- source_word: ὄχλος πολὺς
  choice: eine große Menschenmenge
  rationale: Gibt die Mengenangabe wieder, ohne durch »Mob« eine im Substantiv selbst nicht ausdrücklich enthaltene Wertung hinzuzufügen.
- source_word: μετὰ μαχαιρῶν
  choice: mit Schwertern
  rationale: μάχαιρα kann ein Schwert beziehungsweise eine kürzere Klingenwaffe bezeichnen; »Schwerter« ist hier die geläufige, hinreichend weite Wiedergabe.
- source_word: καὶ ξύλων
  choice: und Knüppeln
  rationale: ξύλον bezeichnet wörtlich Holz beziehungsweise ein Holzstück; im Zusammenhang mit Waffen meint der Plural wahrscheinlich als Schlagwaffen verwendete Knüppel.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: von den obersten Priestern und den Ältesten des Volkes
  rationale: ἀπό bezeichnet Herkunft oder Ausgangspunkt. Die knappe Wiedergabe mit »von« bewahrt diese Offenheit und ergänzt kein im Griechischen ausdrücklich genanntes Verb des Sendens.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, dass die Menschenmenge von den jüdischen Führungspersonen beauftragt oder gesandt war
  choice: von den obersten Priestern und den Ältesten des Volkes
  alternative: von den obersten Priestern und den Ältesten des Volkes geschickt
  rationale: Der Zusammenhang legt einen Auftrag nahe, doch ἀπό nennt unmittelbar nur Herkunft beziehungsweise Ausgangspunkt. Der Haupttext macht deshalb das Senden nicht ausdrücklich und erhält die Spannung des Wortlauts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe, da« behält bewusst den markanten Erzählhinweis bei; die übrige Syntax bleibt für heutige Leser klar. »Oberste Priester« entspricht der üblichen sachlichen Bezeichnung für ἀρχιερεῖς.
