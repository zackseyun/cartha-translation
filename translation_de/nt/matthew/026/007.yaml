  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: de
  text: Eine Frau kam zu ihm. Sie hatte ein Alabastergefäß mit sehr kostbarem Duftöl[a] und goss es ihm über den Kopf, während er beim Essen zu Tisch lag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit sehr kostbarer Salbe“. Das griechische Wort kann wohlriechendes Öl oder Salbe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet die übliche zurückgelehnte Liegehaltung bei einer Mahlzeit.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: kam ... zu ihm
  rationale: Gibt die gerichtete Annäherung natürlich und nah am griechischen Ausdruck wieder.
- source_word: γυνή
  choice: eine Frau
  rationale: Der griechische Text nennt hier keine nähere Bestimmung oder Identifizierung.
- source_word: ἔχουσα
  choice: Sie hatte
  rationale: Der griechische Partizipialsatz wird zur besseren Lesbarkeit als eigener deutscher Satz wiedergegeben, ohne den sachlichen Zusammenhang zu verändern.
- source_word: ἀλάβαστρον μύρου
  choice: ein Alabastergefäß mit ... Duftöl
  rationale: ἀλάβαστρον bezeichnet ein Gefäß aus Alabaster beziehungsweise einen so bezeichneten Behälter; μύρον ist wohlriechendes Öl oder Salböl. „Duftöl“ ist im modernen Deutsch verständlich und vermeidet die Verengung auf heutiges Parfüm.
- source_word: βαρυτίμου
  choice: sehr kostbarem
  rationale: Bewahrt die starke Wertangabe des griechischen Adjektivs.
- source_word: κατέχεεν
  choice: goss ... über
  rationale: Das Verb bezeichnet das Herab- beziehungsweise Darübergießen; zusammen mit „über den Kopf“ klingt diese Wiedergabe im Deutschen natürlich.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: ihm über den Kopf
  rationale: Gibt Ziel und Kontakt idiomatisch wieder; das Possessivverhältnis wird durch den Dativ „ihm“ ausgedrückt.
- source_word: ἀνακειμένου
  choice: während er beim Essen zu Tisch lag
  rationale: Bezeichnet die damalige liegende Haltung bei einer Mahlzeit. Die Ergänzung „beim Essen“ macht den kulturellen Zusammenhang deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der griechische Partizipialsatz wurde zur natürlichen deutschen Satzführung aufgeteilt. „Zu Tisch lag“ bewahrt die historische Esshaltung; eine Fußnote erläutert sie.
