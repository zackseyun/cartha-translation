id: MAT.26.40
reference: Matthew 26:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: de
  text: 'Dann kommt er zu den Jüngern und findet sie schlafend. Er sagt zu Petrus: »Konntet ihr also nicht eine Stunde mit mir wach bleiben?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Stunde mit mir wachen?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens bewahrt das historische Präsens des griechischen Erzählstils und wirkt im Deutschen lebendig, ohne unnatürlich zu sein.
- source_word: πρὸς τοὺς μαθητὰς
  choice: zu den Jüngern
  rationale: Bei einer Bewegung auf Personen zu ist dies die natürliche deutsche Wiedergabe.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: findet sie schlafend
  rationale: Die Formulierung bildet die verbale Aussage des Partizips eng und zugleich idiomatisch ab.
- source_word: λέγει τῷ Πέτρῳ
  choice: Er sagt zu Petrus
  rationale: Auch hier bleibt das historische Präsens erhalten; Πέτρος wird nach etablierter deutscher Namenstradition als Petrus wiedergegeben.
- source_word: Οὕτως
  choice: also
  rationale: Οὕτως leitet hier idiomatisch eine erstaunte beziehungsweise tadelnde Folgerung ein; „also“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: οὐκ ἰσχύσατε
  choice: Konntet ihr nicht
  rationale: ἰσχύω bezeichnet hier die Fähigkeit beziehungsweise Kraft. Die zweite Person Plural wird ausdrücklich bewahrt.
- source_word: μίαν ὥραν
  choice: eine Stunde
  rationale: Der Akkusativ bezeichnet die Zeitdauer; im Deutschen ist keine zusätzliche Präposition erforderlich.
- source_word: γρηγορῆσαι
  choice: wach bleiben
  rationale: Im unmittelbaren Gegensatz zum Schlafen steht zunächst das konkrete Wachbleiben im Vordergrund; die mögliche Bedeutung „wachen“ wird in der Fußnote bewahrt.
- source_word: μετ’ ἐμοῦ
  choice: mit mir
  rationale: Die schlichte Begleitung wird direkt und natürlich ausgedrückt.
theological_decisions:
- issue: Jesus spricht zu Petrus, verwendet aber mit ἰσχύσατε eine Verbform der zweiten Person Plural.
  choice: Der einzelne Adressat Petrus und der an mehrere gerichtete Plural „ihr“ bleiben beide erhalten.
  alternative: Den Tadel in den Singular setzen oder ausdrücklich ergänzen, dass Petrus stellvertretend für die Gruppe angesprochen wird.
  rationale: Der griechische Text enthält diesen Numeruswechsel ausdrücklich. Die Übersetzung lässt offen, wie genau Petrus und die übrigen Jünger als Adressaten zusammengehören, statt die Spannung erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens wurde beibehalten. „Schlafend“ hält die Partizipialkonstruktion knapp fest; „wach bleiben“ verdeutlicht den unmittelbaren Gegensatz, während „wachen“ als semantische Alternative in der Fußnote erscheint.
