  source_fidelity: Die Übersetzung gibt die griechischen historischen Präsensformen („kommt“, „sagt“) angemessen wieder und trifft die Satzglieder sowie den kontrastierenden Sinn von καθεύδοντας und γρηγορῆσαι präzise. Der Plural „Konntet ihr“ bleibt trotz der an Petrus gerichteten Einleitung erhalten und bewahrt den Numeruswechsel des griechischen Textes.
  naturalness: Modernes, gut verständliches und würdiges Standarddeutsch. „findet sie schlafend“ und „eine Stunde mit mir wach bleiben“ sind idiomatisch. „Dann“ und „also“ sind im Kontext als erzählerische bzw. tadelnd-folgernde Anbindung gut vertretbar.
  terminology: „Jünger“ und „Petrus“ entsprechen dem üblichen deutschen Bibelgebrauch. „wach bleiben“ gibt γρηγορῆσαι im unmittelbaren Gegensatz zum Schlafen treffend wieder; die Fußnote mit „wachen“ hält eine sinnvolle lexikalische Alternative bereit.
