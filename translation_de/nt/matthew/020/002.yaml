id: MAT.20.2
reference: Matthew 20:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: de
  text: Nachdem er mit den Arbeitern einen Denar für den Tag[a] vereinbart hatte, schickte er sie in seinen Weinberg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar war der übliche Tageslohn eines Arbeiters.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Nachdem er … vereinbart hatte
  rationale: Das aoristische Partizip bezeichnet hier eine Handlung, die der Haupthandlung vorausgeht. Die Formulierung gibt dies in natürlichem Deutsch wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches erzählerisches Bindewort; der deutsche Satzanschluss ist auch ohne ein zusätzliches „und“ oder „aber“ natürlich.
- source_word: ἐργατῶν
  choice: Arbeitern
  rationale: „Arbeiter“ ist eine klare, moderne und kontextgerechte Bezeichnung für die im Weinberg angeheuerten Personen.
- source_word: ἐκ δηναρίου
  choice: einen Denar
  rationale: Die Wendung bezeichnet den vereinbarten Lohnbetrag. Der antike Münzname bleibt erhalten, statt durch einen modernen Geldwert ersetzt zu werden.
- source_word: τὴν ἡμέραν
  choice: für den Tag
  rationale: Der Akkusativ bezeichnet die zeitliche Erstreckung des vereinbarten Lohns; „für den Tag“ bleibt nahe am Griechischen und klingt idiomatisch.
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Die einfache erzählerische Bedeutung des Verbs wird in natürlichem Deutsch wiedergegeben.
- source_word: ἀμπελῶνα
  choice: Weinberg
  rationale: Dies ist die übliche und genaue deutsche Entsprechung.
- source_word: αὐτοῦ
  choice: seinen
  rationale: Das Possessivpronomen verweist unmittelbar auf den Weinberg des Hausherrn.
