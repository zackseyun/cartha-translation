  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: de
  text: Nimm, was dir gehört, und geh! Ich will aber diesem Letzten genauso viel geben wie dir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: Nimm
  rationale: Der Aoristimperativ von αἴρω fordert hier idiomatisch dazu auf, das Zustehende an sich zu nehmen; „Nimm“ ist direkt und natürlich.
- source_word: τὸ σὸν
  choice: was dir gehört
  rationale: Die substantivierte neutrale Wendung bezeichnet wörtlich das Eigene des Angeredeten. Die Wiedergabe bleibt bewusst weiter als „deinen Lohn“, das erst aus dem Kontext erschlossen wird.
- source_word: ὕπαγε
  choice: geh
  rationale: Der Imperativ von ὑπάγω dient hier der Entlassung. „Geh“ wahrt die Kürze, ohne den Ton durch „geh weg“ unnötig zu verschärfen.
- source_word: θέλω δὲ
  choice: Ich will aber
  rationale: θέλω bezeichnet den Willen beziehungsweise die Absicht des Hausherrn; δέ markiert einen leichten Gegensatz und steht im Deutschen natürlich nach dem finiten Verb.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: diesem Letzten
  rationale: Die substantivierte maskuline Form verweist auf den zuletzt eingestellten Arbeiter. „Diesem Letzten“ ist im Deutschen persönlich und kontextgerecht, ohne das nicht ausdrücklich gesetzte Substantiv „Mann“ hinzuzufügen.
- source_word: δοῦναι
  choice: geben
  rationale: Der Infinitiv von δίδωμι bedeutet „geben“. Obwohl es im Zusammenhang um Lohnzahlung geht, bewahrt „geben“ die lexikalische Weite und den Akzent auf der freien Entscheidung des Hausherrn.
- source_word: ὡς καὶ σοί
  choice: genauso viel … wie dir
  rationale: Die Vergleichsformel drückt im Kontext die gleiche Gabe aus. „Genauso viel … wie dir“ macht den im Griechischen knappen Vergleich in idiomatischem Deutsch verständlich.
theological_decisions:
- issue: Personenbezeichnung für den zuletzt eingestellten Arbeiter
  choice: diesem Letzten
  alternative: diesem letzten Mann
  rationale: Das maskuline Singularwort bezeichnet im Kontext einen männlichen Arbeiter. Die substantivierte deutsche Form „der Letzte“ erhält diesen persönlichen und grammatischen Bezug, ohne ein im Griechischen nicht ausdrücklich vorhandenes Substantiv einzusetzen.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die zwei Imperative bleiben knapp und bestimmt; die Wortstellung „Ich will aber“ bildet den milden Gegensatz des griechischen δέ natürlich ab.
