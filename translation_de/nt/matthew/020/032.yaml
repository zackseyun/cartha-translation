    rationale: Das griechische ἐφώνησεν αὐτούς sagt, dass Jesus sie rief; »zu sich« kann als naheliegende Kontextkonkretisierung verstanden werden, ist aber nicht ausdrücklich formuliert. Die Revision vermeidet diese Ergänzung mit »rief ihnen zu«.
