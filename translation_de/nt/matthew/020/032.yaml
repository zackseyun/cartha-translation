  source_fidelity: 'Die Erzählung wird insgesamt zutreffend wiedergegeben: στὰς bezeichnet das Anhalten, ἐφώνησεν αὐτούς das Rufen der beiden Männer, und die Frage enthält den benefaktiven Bezug »für euch«. »Rief sie zu sich« ist im Kontext zwar plausibel, macht die Bewegungsrichtung jedoch ausdrücklicher, als der griechische Wortlaut sie nennt. Die Fragekonstruktion sollte zudem den abhängigen Konjunktiv ποιήσω unmittelbarer abbilden.'
  naturalness: »Jesus blieb stehen, rief sie zu sich und sagte« ist flüssig. In der direkten Frage ist jedoch »Was wollt ihr, das ich … tun soll?« nicht die natürliche standardsprachliche Konstruktion; nach »wollt ihr« ist hier »dass ich … tue« erforderlich und idiomatisch.
  terminology: »Jesus«, »blieb stehen«, »wollt ihr« und »für euch« entsprechen modernem würdigem Standarddeutsch. »tue« gibt den griechischen Aoristkonjunktiv ohne die zusätzliche modale Nuance von »tun soll« wieder.
