  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: de
  text: 'Jesus blieb stehen, rief ihnen zu und sagte: »Was wollt ihr, dass ich für euch tue?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: blieb stehen
  rationale: Das Aoristpartizip von ἵστημι bezeichnet hier idiomatisch, dass Jesus seine Bewegung unterbrach. »Blieb stehen« ist im Deutschen natürlich und bewahrt den erzählerischen Sinn.
- source_word: ἐφώνησεν
  choice: rief sie zu sich
  rationale: φωνέω kann »rufen« oder »herbeirufen« bedeuten. Im Kontext macht »rief sie zu sich« deutlich, dass Jesus die beiden Männer ansprach beziehungsweise zu sich rief, ohne das förmlichere »bestellte sie zu sich« zu verwenden.
- source_word: αὐτούς
  choice: sie
  rationale: Das Akkusativpronomen im Plural verweist auf die beiden blinden Männer aus dem unmittelbaren Kontext.
- source_word: Τί
  choice: Was
  rationale: Das einfache Fragepronomen entspricht dem direkten Charakter der griechischen Frage.
- source_word: θέλετε
  choice: wollt ihr
  rationale: θέλω bezeichnet Wollen oder Wünschen. »Wollt ihr« ist klares, gegenwärtiges Standarddeutsch und gibt die Direktheit der Frage wieder.
- source_word: ποιήσω
  choice: das ich … tun soll
  rationale: Der Aorist Konjunktiv nach θέλετε bezeichnet den Inhalt ihres Wunsches. Die deutsche Konstruktion »Was wollt ihr, das ich … tun soll?« bildet die griechische Satzstruktur verständlich ab.
- source_word: ὑμῖν
  choice: für euch
  rationale: 'Der Dativ ist hier benefaktiv: Es geht darum, was Jesus zugunsten der beiden tun soll.'
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der Eigenname wird in der üblichen deutschen Form wiedergegeben; der griechische Artikel wird bei Personennamen nicht eigens übersetzt.
theological_decisions:
- issue: Ton und Aussagekraft der Frage Jesu
  choice: 'Direkte, persönliche Einladung: »Was wollt ihr, das ich für euch tun soll?«'
  alternative: 'Förmlicher: »Was wünscht ihr, dass ich für euch tun soll?«'
  rationale: Der Vers enthält keinen erkennbar konfessionell umstrittenen Begriff. Die gewählte Formulierung bewahrt Jesu persönliche Zuwendung und die Direktheit der Frage, ohne altertümlich oder unnötig förmlich zu klingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist unmittelbar und gut verständlich; die koordinierte Erzählweise des griechischen Textes bleibt weitgehend erhalten.
