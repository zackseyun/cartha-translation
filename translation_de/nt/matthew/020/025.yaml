id: MAT.20.25
reference: Matthew 20:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: de
  text: 'Jesus aber rief sie zu sich und sagte: »Ihr wisst, dass die Herrscher der Völker[a] sie beherrschen und die Großen[b] ihre Macht über sie ausüben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Nichtjuden«; traditionell: »der Heiden«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Mächtigen« oder »die hohen Amtsträger«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: rief sie zu sich
  rationale: Das mediale Partizip bezeichnet, dass Jesus die Jünger zu sich ruft; die deutsche Formulierung gibt diese Richtung natürlich wieder.
- source_word: Οἴδατε
  choice: Ihr wisst
  rationale: Obwohl οἶδα formal eine Perfektform ist, hat es präsentische Bedeutung. »Ihr wisst« ist im Deutschen idiomatisch und genau.
- source_word: ἄρχοντες
  choice: Herrscher
  rationale: Der Ausdruck bezeichnet Personen, die politische Herrschaft ausüben. »Herrscher« ist weit genug und passt zum Zusammenhang.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: ἔθνη kann »Völker« oder aus jüdischer Perspektive »Nichtjuden/Heiden« bedeuten. »Völker« bewahrt die unmittelbare politische Aussage und vermeidet die heute leicht abwertend klingende Bezeichnung »Heiden«; die kontextuelle Alternative steht in der Fußnote.
- source_word: κατακυριεύουσιν
  choice: gebieten über sie
  rationale: Das Verb bezeichnet eine machtvolle, im Zusammenhang herrische Ausübung von Herrschaft. »Über sie gebieten« ist würdevoll und lässt den kritischen Ton erkennen, ohne Missbrauch ausdrücklich in den Text hineinzutragen.
- source_word: οἱ μεγάλοι
  choice: die Großen
  rationale: Die substantivierte maskuline Pluralform bezeichnet gesellschaftlich oder politisch hochgestellte Männer. »Die Großen« erhält die Bildsprache und die grammatische Form; eine funktionale Alternative wird in der Fußnote genannt.
- source_word: κατεξουσιάζουσιν
  choice: üben ihre Macht über sie aus
  rationale: Die Wendung gibt das Ausüben von Autorität oder Macht wieder. Der Kontext und die Parallelität vermitteln den kritischen Beiklang, ohne ihn durch »missbrauchen« zu verstärken.
- source_word: αὐτῶν
  choice: sie
  rationale: Das Pronomen verweist jeweils auf die zuvor genannten Völker beziehungsweise deren Angehörige. Die pronominale Wiedergabe ist im Deutschen klar und vermeidet unnötige Wiederholung.
theological_decisions:
- issue: Bedeutung von ἐθνῶν in einer jüdisch geprägten Aussage Jesu
  choice: Völker
  alternative: 'Nichtjuden; traditionell: Heiden'
  rationale: Der griechische Ausdruck kann sowohl die politischen Völker als auch die nichtjüdischen Völker im Gegensatz zu Israel bezeichnen. Der Haupttext bewahrt die allgemeinere Bedeutung; die Fußnote hält die kontextuell mögliche ethnisch-religiöse Lesart offen.
- issue: Wiedergabe von οἱ μεγάλοι
  choice: die Großen
  alternative: die hohen Amtsträger; die Mächtigen
  rationale: Die Übersetzung erhält die substantivierte und grammatisch maskuline Ausdrucksweise des Griechischen, ohne die Gruppe genauer zu bestimmen, als es der Ausgangstext tut.
- issue: Negativer Beiklang der beiden Herrschaftsverben
  choice: über sie gebieten / ihre Macht über sie ausüben
  alternative: sie tyrannisieren / ihre Macht missbrauchen
  rationale: Die Zusammensetzungen mit κατα- und der Gegensatz zum folgenden Vers legen herrische Machtausübung nahe. Eine ausdrückliche Übersetzung als Tyrannei oder Machtmissbrauch würde den möglichen Beiklang jedoch zur eindeutigen Aussage verschärfen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nah am griechischen Gedankengang, während »rief sie zu sich« und »ihre Macht ausüben« natürliches Deutsch bieten. Die Fußnotenmarker [a] und [b] stehen unmittelbar bei den jeweils mehrdeutigen Ausdrücken.
