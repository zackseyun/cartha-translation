  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: de
  text: Und um die elfte Stunde[a] ging er hinaus und fand andere, die dort standen. Da sagt er zu ihnen:[b] »Warum steht ihr hier den ganzen Tag untätig herum?«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nach antiker Tageszählung etwa gegen fünf Uhr nachmittags.
    reason: historical_context
  - marker: b
    text: 'Oder: »Da sagte er zu ihnen.« Im Griechischen steht das erzählende Präsens: »sagt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Und um die elfte Stunde
  rationale: περί mit Akkusativ bezeichnet eine ungefähre Zeitangabe. »Um die elfte Stunde« bewahrt die antike Zeiteinteilung und die Bildwelt des Gleichnisses.
- source_word: ἐξελθὼν εὗρεν
  choice: ging er hinaus und fand
  rationale: Das Aoristpartizip bezeichnet eine dem Finden vorausgehende Handlung; eine beigeordnete deutsche Verbfolge gibt den Ablauf natürlich und präzise wieder.
- source_word: ἄλλους ἑστῶτας
  choice: andere, die dort standen
  rationale: ἄλλους ist substantivisch gebraucht und legt das Geschlecht nicht ausdrücklich fest. Das Perfektpartizip beschreibt ihren andauernden Zustand; »dort« macht im Deutschen den Ortsbezug natürlich deutlich.
- source_word: καὶ λέγει αὐτοῖς
  choice: Da sagt er zu ihnen
  rationale: Das Präsens λέγει ist ein historisches Präsens. Die Wiedergabe im Präsens erhält die erzählerische Lebendigkeit des griechischen Textes.
- source_word: Τί ὧδε ἑστήκατε
  choice: Warum steht ihr ... hier ... herum?
  rationale: Τί bedeutet in dieser Frage idiomatisch »warum«. Das Perfekt ἑστήκατε bezeichnet einen bis dahin andauernden Zustand; »steht ... herum« ist im Kontext natürlich, ohne bereits die folgende Untätigkeit auszublenden.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: den ganzen Tag ... untätig
  rationale: Der Akkusativ bezeichnet die Dauer. ἀργοί meint hier untätig beziehungsweise ohne Arbeit; »untätig« vermeidet die modern sozialpolitische Engführung von »arbeitslos«.
