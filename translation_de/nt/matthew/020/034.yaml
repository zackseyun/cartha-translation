id: MAT.20.34
reference: Matthew 20:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: de
  text: Von tiefem Mitgefühl bewegt, berührte Jesus ihre Augen. Sofort konnten sie wieder sehen[a] und folgten ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: erhielten ihr Augenlicht zurück. Das griechische Verb kann auch wörtlicher „aufblicken“ bedeuten; hier bezeichnet es im Zusammenhang die Wiederherstellung des Sehvermögens.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: von tiefem Mitgefühl bewegt
  rationale: Das Partizip bezeichnet starkes, innerlich empfundenes Erbarmen. Die Formulierung bewahrt die emotionale Kraft und klingt im modernen Deutschen würdevoll und natürlich.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ führt hier die Erzählung mild weiter. Der Anschluss ist im Deutschen bereits durch den Satzfluss erkennbar; ein ausdrückliches „aber“ würde einen zu starken Gegensatz nahelegen.
- source_word: ἥψατο
  choice: berührte
  rationale: ἅπτομαι bezeichnet in diesem Heilungszusammenhang eine körperliche Berührung. Der Genitiv τῶν ὀμμάτων αὐτῶν wird idiomatisch als direktes Objekt „ihre Augen“ wiedergegeben.
- source_word: εὐθέως
  choice: sofort
  rationale: Das Wort hebt hervor, dass die Heilung ohne Verzögerung eintrat. „Sofort“ ist klar, prägnant und natürlich.
- source_word: ἀνέβλεψαν
  choice: konnten sie wieder sehen
  rationale: Im Zusammenhang mit der Blindheit der Männer bezeichnet das Verb die Wiederherstellung des Sehvermögens. Die Formulierung ist für heutige Leser unmittelbar verständlich, während die lexikalische Alternative in der Fußnote erhalten bleibt.
- source_word: ἠκολούθησαν αὐτῷ
  choice: folgten ihm
  rationale: Die Wendung kann sowohl das tatsächliche Mitgehen als auch einen Anklang an Nachfolge tragen. „Folgten ihm“ bewahrt beide Möglichkeiten, ohne ausdrücklich eine dauerhafte Jüngerschaft zu behaupten.
theological_decisions:
- issue: Art des Heilungsergebnisses in ἀνέβλεψαν
  choice: unmittelbare Wiederherstellung des Sehvermögens
  alternative: sie blickten auf
  rationale: Im unmittelbaren Kontext einer Blindenheilung und zusammen mit εὐθέως bezeichnet ἀνέβλεψαν, dass die Männer wieder sehen konnten. Die mögliche wörtlichere Bedeutung wird nicht verschwiegen, sondern in der Fußnote genannt.
- issue: Bedeutungsumfang von ἠκολούθησαν αὐτῷ
  choice: folgten ihm
  alternative: wurden seine Jünger
  rationale: Der Text berichtet, dass die Geheilten Jesus folgten, legt aber Dauer und Art dieser Nachfolge nicht ausdrücklich fest. Die Übersetzung vermeidet daher eine weitergehende theologische Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die vorangestellte Partizipialgruppe bewahrt die enge Verbindung zwischen Jesu Mitgefühl und seiner heilenden Berührung; die kurzen Folgesätze unterstreichen die Unmittelbarkeit des Geschehens.
