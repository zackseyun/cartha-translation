  text: Καὶ ἀκούσαντες οἱ δέκα ἠγανάκτησαν περὶ τῶν δύο ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: de
  text: Als die Zehn das hörten, empörten sie sich über die beiden Brüder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Als ... das hörten
  rationale: Das temporale Partizip wird im Deutschen natürlich als Nebensatz wiedergegeben; „das“ verweist auf die unmittelbar vorausgehende Bitte.
- source_word: ἠγανάκτησαν
  choice: wurden ... ungehalten
  rationale: Gibt den starken Unwillen beziehungsweise die Empörung in gehobenem, aber allgemein verständlichem Deutsch wieder.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: über die beiden Brüder
  rationale: 'Bewahrt die offene Relation von περί: Der Unwille betrifft die beiden Brüder, ohne stärker als der griechische Ausdruck festzulegen, ob er sich unmittelbar gegen sie richtet.'
theological_decisions:
- issue: Richtung des Unwillens gegenüber den beiden Brüdern
  choice: „über die beiden Brüder“
  alternative: „auf die beiden Brüder“ / „gegenüber den beiden Brüdern“
  rationale: Das griechische περί bezeichnet hier den Bezug oder Gegenstand des Unwillens. „Über“ erhält diese leichte Offenheit und vermeidet eine unnötige Präzisierung der feindseligen Ausrichtung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapper Erzählstil, der Wortfolge und Aussage des griechischen Textes natürlich wiedergibt.
