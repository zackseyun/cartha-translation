  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: de
  text: Darf ich nicht mit dem, was mir gehört, tun, was ich will? Oder ist dein Auge böse, weil ich gut bin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bist du neidisch, weil ich gut bin?“ Die Wendung „dein Auge ist böse“ ist ein griechisches Idiom für Neid oder missgünstigen Unmut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: Darf ich nicht
  rationale: Das Verb bezeichnet, was erlaubt oder rechtmäßig ist. Die rhetorische Frage mit „darf“ gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: ὃ θέλω ποιῆσαι
  choice: tun, was ich will
  rationale: Die Formulierung bewahrt den Ausdruck persönlichen Wollens und ist zugleich idiomatisches, gegenwärtiges Deutsch.
- source_word: ἐν τοῖς ἐμοῖς
  choice: mit dem, was mir gehört
  rationale: Die Wendung bezeichnet den eigenen Besitz. Diese Wiedergabe macht das Eigentumsverhältnis im Zusammenhang des Gleichnisses klar.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: ist dein Auge böse
  rationale: Die wörtliche Bildsprache bleibt erhalten. Da die Wendung idiomatisch Neid oder missgünstigen Unmut ausdrücken kann, wird dieser Sinn in einer Fußnote erläutert.
- source_word: ἀγαθός
  choice: gut
  rationale: „Gut“ entspricht dem Grundsinn des Adjektivs und bewahrt den ausdrücklichen Gegensatz zwischen dem bösen Auge und der Güte des Hausherrn, ohne ihn auf „großzügig“ einzuengen.
theological_decisions:
- issue: Ob die Wendung ὁ ὀφθαλμός σου πονηρός im Haupttext ausgedeutet werden soll
  choice: Die bildhafte Wendung „ist dein Auge böse“ im Haupttext bewahren
  alternative: „Bist du neidisch, weil ich gut bin?“
  rationale: Die wörtliche Wiedergabe erhält den Gegensatz zwischen dem „bösen Auge“ des Arbeiters und der Güte des Hausherrn sowie die darin liegende theologische Spannung. Die wahrscheinliche Bedeutung des Idioms wird in der Fußnote angegeben, ohne den Haupttext auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe und die konkrete Bildsprache des griechischen Textes bleiben erhalten; eine potenziell unklare Redewendung wird knapp in der Fußnote erklärt.
