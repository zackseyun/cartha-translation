source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: de
  text: 'So soll es unter euch nicht sein.[a] Vielmehr: Wer unter euch groß werden will, soll euer Diener sein,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So wird es unter euch nicht sein.“ Das griechische Verb steht im Futur; im Zusammenhang kann es ausdrücken, wie es unter den Nachfolgern Jesu nicht sein soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: So soll es unter euch nicht sein
  rationale: Das griechische Futur ἔσται hat hier im Zusammenhang normativen Sinn. Das deutsche „soll … nicht sein“ bewahrt diese auf die Gemeinschaft der Jünger gerichtete Weisung natürlicher als ein wörtliches „wird … nicht sein“.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: 'Vielmehr: Wer … will'
  rationale: ὃς ἂν mit Konjunktiv bezeichnet allgemein jeden, auf den die Bedingung zutrifft; „wer … will“ gibt dies in klarem modernem Deutsch wieder. „Vielmehr“ markiert den scharfen Gegensatz.
- source_word: μέγας γενέσθαι
  choice: groß werden
  rationale: „Werden“ bewahrt die ingressive Bedeutung von γενέσθαι und damit das Streben nach einer angesehenen Stellung.
- source_word: διάκονος
  choice: Diener
  rationale: διάκονος bezeichnet hier jemanden, der anderen dient. „Diener“ erhält das konkrete Dienstmotiv, ohne fälschlich das spätere kirchliche Amt eines Diakons anzudeuten.
- source_word: ὑμῶν
  choice: euer
  rationale: Der Genitiv wird im Deutschen idiomatisch und relational mit „euer Diener“ wiedergegeben.
theological_decisions:
- issue: Wesen von Größe in der Gemeinschaft der Nachfolger Jesu
  choice: Die Aussage wird als verbindliche Umkehr weltlicher Rangordnung formuliert und behält das konkrete Bild des Dienens bei.
  alternative: διάκονος als kirchliches Amt „Diakon“ verstehen oder die Aussage allgemein als Aufforderung zur Demut umschreiben.
  rationale: Der Kontext stellt die Herrschaftsweise der Völker Jesu Maßstab für seine Jünger gegenüber. Weder eine spätere Amtsstruktur noch eine abstrakte Verallgemeinerung soll in den Text eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach „Vielmehr“ bildet die griechische Gegenüberstellung natürlich ab; das abschließende Komma wird entsprechend der vorgelegten Einzelversform beibehalten.
