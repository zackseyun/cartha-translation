  naturalness: Modernes, klares und würdiges Standarddeutsch. Der Gegensatz „Vielmehr“ und die Formulierung „groß werden will“ sind idiomatisch. Das Schlusskomma entspricht sinnvoll der versübergreifenden Satzstruktur.
  terminology: „Diener“ trifft διάκονος im vorliegenden Kontext besser als „Diakon“ oder ein institutionell klingendes „Amtsträger“. Die Formulierung wahrt das konkrete Bild des Dienstes ohne zusätzliche theologische Festlegung.
