  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: de
  text: So werden die Letzten Erste sein und die Ersten Letzte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: So
  rationale: Leitet die Schlussfolgerung aus dem Gleichnis natürlich und knapp ein und bewahrt die folgernde beziehungsweise resultative Kraft.
- source_word: ἔσονται
  choice: werden … sein
  rationale: Gibt den Futur von εἰμί im modernen Standarddeutsch direkt wieder.
- source_word: οἱ ἔσχατοι
  choice: die Letzten
  rationale: Der substantivierte Plural wird direkt wiedergegeben; „Letzten“ bewahrt die Offenheit zwischen Reihenfolge und Rang, ohne vorschnell „Geringsten“ zu deuten.
- source_word: πρῶτοι
  choice: Erste
  rationale: Bewahrt als prädikatives Substantiv die knappe und ausgewogene Umkehrungsformel.
- source_word: καὶ
  choice: und
  rationale: Entspricht der einfachen griechischen Verknüpfung; „aber“ würde eine nicht ausdrücklich markierte adversative Nuance hinzufügen.
- source_word: οἱ πρῶτοι
  choice: die Ersten
  rationale: Gibt das substantivierte Adjektiv parallel zu „die Letzten“ wieder.
- source_word: ἔσχατοι
  choice: Letzte
  rationale: Vollendet die symmetrische Umkehrung und entspricht unmittelbar dem ersten Ausdruck.
theological_decisions:
- issue: Art und Reichweite der Umkehrung
  choice: Als knappen Umkehrungsspruch wiedergeben, ohne festzulegen, ob „Letzte/Erste“ zeitliche Reihenfolge, sozialen Rang, Lohn oder Rettung bezeichnet.
  alternative: Die Aussage ausdrücklich als soziale Umkehrung, als Umkehrung des Lohns in der Nachfolge oder als Reihenfolge der Rettung deuten.
  rationale: Der griechische Wortlaut grenzt die Aussage nicht auf eine dieser Deutungen ein; die Übersetzung bewahrt daher die Spannung und Offenheit des Spruchs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die prägnante Parallelstruktur des griechischen Satzes bleibt erhalten. Keine Fußnote nötig, da „So“ die naheliegende deutsche Entsprechung für οὕτως ist und „Auf diese Weise“ hier unnötig schwerfällig wäre.
