  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: de
  text: 'Die Menge wies sie zurecht, um sie zum Schweigen zu bringen. Doch sie schrien umso lauter[a]: »Herr, hab Erbarmen mit uns, Sohn Davids!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »umso eindringlicher«. Der griechische Komparativ kann eine Steigerung des Rufens allgemein bezeichnen, insbesondere aber auch größere Lautstärke.'
    reason: lexical_alternative
  - marker: b
    text: »Sohn Davids« ist hier ein messianischer Titel und nicht nur eine Angabe der Abstammung.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ ὄχλος
  choice: Doch die Menge
  rationale: ὄχλος bezeichnet hier die anwesende Menschenmenge. „Doch“ gibt den erzählerischen Gegensatz wieder.
- source_word: ἐπετίμησεν αὐτοῖς
  choice: wies sie scharf zurecht
  rationale: ἐπιτιμάω bezeichnet ein nachdrückliches Tadeln oder Zurechtweisen; die Ergänzung „scharf“ bewahrt die Stärke des Verbs in natürlichem Deutsch.
- source_word: ἵνα σιωπήσωσιν
  choice: damit sie schwiegen
  rationale: Die ἵνα-Konstruktion bezeichnet den Zweck des Zurechtweisens. Die deutsche Formulierung bleibt knapp und wahrt diesen Zweckbezug.
- source_word: μεῖζον ἔκραξαν
  choice: schrien nur noch mehr
  rationale: Das adverbial gebrauchte μεῖζον steigert das Schreien, ohne eindeutig festzulegen, ob vor allem Lautstärke oder Nachdruck gemeint ist.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ bewahrt sowohl die respektvolle Anrede als auch einen möglichen christologischen Beiklang.
- source_word: ἐλέησον ἡμᾶς
  choice: hab Erbarmen mit uns
  rationale: Die Wendung gibt den dringlichen Imperativ idiomatisch, würdig und verständlich wieder.
- source_word: υἱὸς Δαυίδ
  choice: Sohn Davids
  rationale: Die wörtliche Form bewahrt den in Matthäus bedeutsamen messianischen Königstitel und reduziert ihn nicht auf eine bloße Abstammungsangabe.
theological_decisions:
- issue: Messianischer Titel für Jesus
  choice: „Sohn Davids“ im Haupttext
  alternative: „Nachkomme Davids“
  rationale: „Sohn Davids“ bewahrt die königliche und messianische Tragweite der festen Bezeichnung, ohne sie im Haupttext auszudeuten.
- issue: Anrede κύριος für Jesus
  choice: „Herr“
  alternative: „Meister“
  rationale: „Herr“ lässt offen, ob die Anrede hier nur respektvoll oder zugleich christologisch aufgeladen ist, und bewahrt damit die Spannung des griechischen Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wies sie scharf zurecht“ erhält die nachdrückliche Wirkung von ἐπετίμησεν; „schrien nur noch mehr“ bewahrt die genuine Mehrdeutigkeit von μεῖζον. Beide Fußnotenmarker stehen im Haupttext.
