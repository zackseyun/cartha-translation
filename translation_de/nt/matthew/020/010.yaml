id: MAT.20.10
reference: Matthew 20:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: de
  text: Als die zuerst Eingestellten kamen,[a] dachten sie, sie würden mehr erhalten. Doch auch sie erhielten je einen Denar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die Ersten“; gemeint sind die Arbeiter, die im Gleichnis zuerst eingestellt wurden.'
    reason: lexical_alternative
  - marker: b
    text: Ein Denar war ein üblicher Tageslohn für einen Arbeiter.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: als ... kamen
  rationale: Das aoristische Partizip wird als temporaler Nebensatz wiedergegeben und bewahrt so den natürlichen Erzählablauf.
- source_word: οἱ πρῶτοι
  choice: die zuerst Eingestellten
  rationale: Gemeint sind die Arbeiter, die im Gleichnis zuerst angeworben wurden. Die Ergänzung macht den Bezug im Deutschen klar, ohne eine abstrakte Rangordnung auszudrücken.
- source_word: ἐνόμισαν
  choice: dachten
  rationale: νομίζω bezeichnet hier eine Annahme oder Erwartung; „dachten“ ist natürlich und legt keine Gewissheit nahe.
- source_word: πλεῖον
  choice: mehr
  rationale: Der substantivisch beziehungsweise adverbial gebrauchte Komparativ bezeichnet einen höheren Lohn; „mehr“ ist knapp und idiomatisch.
- source_word: λήμψονται
  choice: sie würden ... bekommen
  rationale: Der griechische Futur steht in einer von einem Vergangenheitstempus abhängigen Gedankenwiedergabe; der deutsche Konjunktiv II gibt diese Zukunft aus damaliger Sicht natürlich wieder.
- source_word: τὸ ἀνὰ δηνάριον
  choice: jeder einen Denar
  rationale: ἀνά mit Akkusativ hat distributive Bedeutung. Die Formulierung gibt „je einen Denar“ idiomatisch wieder und lässt zugleich den zuvor vereinbarten Lohn erkennen.
- source_word: καὶ αὐτοί
  choice: doch auch sie
  rationale: καί mit dem betonten αὐτοί hebt überraschend hervor, dass auch die zuerst Eingestellten denselben Betrag erhielten; „doch“ macht den Gegensatz zur Erwartung im Deutschen natürlich sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Eingestellten“ verdeutlicht den aus dem Kontext erschlossenen Bezug auf die Arbeiter; „Denar“ bewahrt die antike Münzbezeichnung.
