    issue: „habe nicht ich zu vergeben“ kann als fehlende Pflicht statt als fehlende Zuständigkeit verstanden werden.
    rationale: οὐκ ἔστιν ἐμὸν δοῦναι bedeutet hier, dass die Zuteilung nicht Jesus zukommt. „steht nicht mir zu“ gibt dies im modernen Standarddeutsch klarer wieder.
