- from: 'Er sagte zu ihnen: „Meinen Kelch werdet ihr zwar trinken.[a] Aber rechts und links von mir zu sitzen, habe nicht ich zu vergeben; das ist vielmehr für diejenigen bestimmt, für die es von meinem Vater vorbereitet worden ist.“'
  to: 'Er sagte zu ihnen: „Meinen Kelch werdet ihr zwar trinken.[a] Doch die Plätze rechts und links von mir zu vergeben, steht nicht mir zu, sondern sie sind für diejenigen bestimmt, für die mein Vater sie vorbereitet hat.“'
  rationale: Die Revision ersetzt die potenziell missverständliche Konstruktion „habe nicht ich zu vergeben“ durch die idiomatische und semantisch präzisere Wendung „steht nicht mir zu“. „Die Plätze“ erläutert lediglich das im Kontext des Sitzens implizite Objekt der griechischen Ellipse. Die Aussage wird nicht dogmatisch harmonisiert; dass der Vater die Plätze vorbereitet hat, bleibt ausdrücklich bestehen.
