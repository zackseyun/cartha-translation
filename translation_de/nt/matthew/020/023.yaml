  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Meinen Kelch werdet ihr zwar trinken.[a] Doch die Plätze rechts und links von mir zu vergeben, steht nicht mir zu, sondern sie sind für diejenigen bestimmt, für die mein Vater sie vorbereitet hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Kelch“ ist hier ein Bild für das Jesus bestimmte Leiden oder Geschick, an dem auch seine Jünger Anteil haben werden.
    reason: metaphor_explanation
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Er sagte zu ihnen
  rationale: Das historische Präsens wird in natürlichem deutschem Erzählstil als Präteritum wiedergegeben, ohne den Sinn zu verändern.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Meinen Kelch werdet ihr zwar trinken
  rationale: „Kelch“ bewahrt das Bild für das Jesus bestimmte Leiden beziehungsweise Geschick. „Zwar“ gibt die bestätigende und zugleich kontrastierende Funktion von μὲν im Zusammenhang mit δὲ wieder.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: rechts und links von mir zu sitzen
  rationale: Die Formulierung bezeichnet die Ehrenplätze unmittelbar neben Jesus und ist im modernen Deutschen natürlich und verständlich.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: habe nicht ich zu vergeben
  rationale: „Vergeben“ passt zur Zuweisung von Ehrenplätzen. Die betonte Form „nicht ich“ wahrt die Aussage und ihre Spannung, ohne eine erklärende Einschränkung einzufügen.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: das ist vielmehr für diejenigen bestimmt, für die es … vorbereitet worden ist
  rationale: Da der griechische Satz nach ἀλλά elliptisch ist, werden im Deutschen die zum Verständnis nötigen Satzglieder ergänzt. Das Perfekt Passiv wird als abgeschlossene Vorbereitung mit fortdauernder Geltung wiedergegeben.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: von meinem Vater
  rationale: Direkte Wiedergabe des im Passiv genannten Handelnden; ein nicht ausdrücklich vorhandenes „allein“ wird nicht ergänzt.
theological_decisions:
- issue: Christologische Spannung in der Aussage, die Plätze habe Jesus nicht zu vergeben
  choice: 'Die Aussage wird ohne harmonisierenden Zusatz unmittelbar wiedergegeben: „habe nicht ich zu vergeben“.'
  alternative: Eine Erläuterung wie „nicht unabhängig von meinem Vater“ oder „nicht ohne meinen Vater“ ergänzen.
  rationale: Der griechische Text enthält keine solche Einschränkung. Die Übersetzung bewahrt daher seine eigene theologische Spannung, statt sie durch eine dogmatische Erklärung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am griechischen Kontrast, wird aber so gegliedert, dass die elliptische Schlusswendung verständlich ist.
