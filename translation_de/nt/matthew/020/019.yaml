source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: de
  text: Und sie werden ihn den Nichtjuden ausliefern, damit sie ihn verspotten, auspeitschen und kreuzigen. Und am dritten Tag wird er auferweckt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird er auferstehen“. Das griechische Verb steht im Passiv („wird er auferweckt werden“), einer geläufigen Auferstehungsformulierung, die Gottes Handeln anklingen lassen kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: werden … ausliefern
  rationale: „Ausliefern“ bezeichnet natürlich und präzise die Übergabe in die Gewalt feindlicher Autoritäten, ohne die speziellere Bedeutung „verraten“ einzutragen.
- source_word: τοῖς ἔθνεσιν
  choice: den Nichtjuden
  rationale: Im jüdischen Kontext der Leidensankündigung meint ἔθνη Menschen außerhalb des jüdischen Volkes, konkret die nichtjüdischen Machthaber. „Nichtjuden“ ist im heutigen Deutsch verständlicher und neutraler als „Heiden“.
- source_word: εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι
  choice: damit sie ihn verspotten, auspeitschen und kreuzigen
  rationale: Die Konstruktion mit εἰς und substantivierten Infinitiven drückt hier Zweck beziehungsweise beabsichtigte Folge aus. Ein gemeinsames „damit sie ihn“ gibt die syntaktische Verbindung und das gemeinsame Objekt im Deutschen klar wieder.
- source_word: ἐμπαῖξαι
  choice: verspotten
  rationale: „Verspotten“ ist eine natürliche, gegenwärtige Wiedergabe des verhöhnenden Handelns.
- source_word: μαστιγῶσαι
  choice: auspeitschen
  rationale: „Auspeitschen“ bezeichnet die hier gemeinte körperliche Bestrafung klarer als das allgemeinere „schlagen“ und ist moderner als „geißeln“.
- source_word: σταυρῶσαι
  choice: kreuzigen
  rationale: Das Verb bedeutet unmittelbar „kreuzigen“; das gemeinsame Objekt „ihn“ gilt im deutschen Satz für alle drei Verben.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: am dritten Tag
  rationale: Dies ist die übliche und idiomatische deutsche Wiedergabe der temporalen Dativphrase.
- source_word: ἐγερθήσεται
  choice: wird er auferweckt werden
  rationale: Die passive Form wird bewahrt. „Auferwecken“ ist im Auferstehungskontext eindeutig und lässt Gottes Handeln anklingen, ohne weitere Aussagen über die Handlungsmacht Christi auszuschließen.
theological_decisions:
- issue: Genus Verbi des Auferstehungsverbs
  choice: wird er auferweckt werden
  alternative: wird er auferstehen
  rationale: Der griechische Text hat eine zukünftige Passivform. Die passive Übersetzung wahrt die Formulierung und die mögliche Nuance göttlichen Handelns, ohne die theologische Spannung durch eine aktive Wiedergabe aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nichtjuden“ vermeidet das heute missverständliche oder abwertend wirkende „Heiden“; „auspeitschen“ ist klarer und gegenwärtiger als „geißeln“.
