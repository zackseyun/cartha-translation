  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: de
  text: 'Als Jesus nach Jerusalem hinaufging, nahm er die zwölf Jünger beiseite und sagte unterwegs zu ihnen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: hinaufzog
  rationale: Das Präsenspartizip bezeichnet eine zur Haupthandlung gleichzeitige Bewegung. „Hinaufziehen“ bewahrt die geografische und im biblischen Sprachgebrauch übliche Aufwärtsrichtung nach Jerusalem und klingt im Deutschen natürlich.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: Bei Städtenamen wird εἰς im Deutschen idiomatisch mit „nach“ wiedergegeben.
- source_word: παρέλαβεν
  choice: nahm … beiseite
  rationale: Das Verb bedeutet hier „mitnehmen/zu sich nehmen“; zusammen mit κατ’ ἰδίαν bezeichnet es, dass Jesus die Gruppe für ein Gespräch von anderen absonderte.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: die zwölf Jünger
  rationale: μαθητάς ist im SBLGNT-Text ausdrücklich vorhanden und wird daher wiedergegeben; „Jünger“ ist die etablierte, sachgerechte deutsche Bezeichnung im Evangelienkontext.
- source_word: κατ’ ἰδίαν
  choice: beiseite
  rationale: Die Wendung bezeichnet ein abgesondertes, nicht öffentliches Gespräch. Im Zusammenhang mit „nahm“ bringt „beiseite“ dies knapp und natürlich zum Ausdruck.
- source_word: ἐν τῇ ὁδῷ
  choice: unterwegs
  rationale: „Unterwegs“ gibt die Reisesituation idiomatisch und prägnant wieder; gemeint ist, dass Jesus während des Weges sprach.
- source_word: εἶπεν αὐτοῖς
  choice: sagte … zu ihnen
  rationale: Dies entspricht der gewöhnlichen Bedeutung von λέγω und lässt den Inhalt der Rede für den folgenden Vers offen.
