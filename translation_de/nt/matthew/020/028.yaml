id: MAT.20.28
reference: Matthew 20:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: de
  text: So wie der Menschensohn nicht gekommen ist, um sich dienen zu lassen, sondern um zu dienen und sein Leben als Lösegeld für viele[a] zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklicher: »als Lösegeld anstelle vieler«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: So wie
  rationale: Bewahrt die vergleichende Verknüpfung mit der vorausgehenden Lehre und klingt im modernen Deutsch natürlich.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe erhält den Charakter als Selbstbezeichnung und den Anklang an Daniel 7.
- source_word: οὐκ ἦλθεν
  choice: nicht gekommen ist
  rationale: Das deutsche Perfekt gibt das punktuelle Kommen idiomatisch wieder, ohne einen Ort oder eine zusätzliche Bedeutungsnuance einzuführen.
- source_word: διακονηθῆναι
  choice: sich dienen zu lassen
  rationale: Gibt den passiven Infinitiv natürlich wieder und bewahrt den unmittelbaren Gegensatz zum aktiven »dienen«.
- source_word: ἀλλὰ διακονῆσαι
  choice: sondern um zu dienen
  rationale: Erhält den verbalen Gegensatz und vermeidet eine unnötig kirchensprachliche Formulierung.
- source_word: καὶ δοῦναι
  choice: und … zu geben
  rationale: Verbindet das Geben des Lebens parallel mit dem Dienen und fügt keine im Ausgangstext nicht ausdrücklich genannte Handlung hinzu.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sein Leben
  rationale: ψυχή bezeichnet hier das bis zum Tod hingegebene Leben, nicht lediglich eine vom Körper unterschiedene Seele.
- source_word: λύτρον
  choice: Lösegeld
  rationale: Bezeichnet den Preis zur Freilassung und bewahrt das Bild von Loskauf und Befreiung ohne erklärende Erweiterung.
- source_word: ἀντὶ πολλῶν
  choice: für viele
  rationale: Ist eine natürliche und traditionsreiche deutsche Formulierung; die stärker ausdrückliche Stellvertretungsnuance von ἀντί wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung von ἀντί in der Aussage vom Lösegeld
  choice: Im Haupttext steht idiomatisch »für viele«; die mögliche ausdrückliche Stellvertretungsnuance erscheint in einer Fußnote.
  alternative: anstelle vieler
  rationale: ἀντί kann Austausch oder Stellvertretung ausdrücken. »Für viele« ist gut verständlich und schließt diese Bedeutung nicht aus; die Fußnote bewahrt sie, ohne die theologische Spannung im Haupttext einseitig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Wendungen »sich dienen zu lassen« und »zu dienen« halten den rhetorischen Gegensatz des griechischen Textes deutlich fest.
