review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die Gesprächsstruktur und den Inhalt des griechischen Satzes zuverlässig wieder. »Was möchtest du?« ist eine natürliche Wiedergabe von Τί θέλεις. »Sag, dass … sitzen dürfen« bewahrt die Grundbedeutung von Εἰπὲ und gibt den von ἵνα καθίσωσιν ausgedrückten erbetenen Zugang zu den Ehrenplätzen idiomatisch wieder. Die beiden Seitenpositionen sowie »in deinem Reich« sind vollständig erhalten.
  naturalness: Modernes Standarddeutsch mit passendem würdig-erzählendem Register. »Diese meine beiden Söhne« ist bewusst leicht hervorgehoben und bildet die demonstrative, persönlich betonte griechische Formulierung angemessen ab. Der Gedankenstrich unterstützt den Parallelismus der beiden Sitzplätze klar.
  terminology: »Reich« ist für βασιλεία hier treffend und lässt die mögliche Bedeutung von Herrschaft/Königtum offen. »Zu deiner Rechten/Linken« ist die etablierte und zugleich verständliche deutsche Wiedergabe der räumlich-honorifizierenden Formulierung. Die Fußnoten sind inhaltlich passend verankert und markieren tatsächliche lexikalische Spielräume.
