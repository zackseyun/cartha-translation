id: MAT.20.21
reference: Matthew 20:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: de
  text: 'Da sagte er zu ihr: »Was möchtest du?« Sie sagte zu ihm: »Sag, dass diese meine beiden Söhne in deinem Reich[a] sitzen dürfen – einer zu deiner Rechten und einer zu deiner Linken.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter deiner Königsherrschaft«.'
    reason: lexical_alternative
  - marker: b
    text: »Sag« kann hier im Sinn von »Bestimme« oder »Ordne an« verstanden werden; das griechische Verb bedeutet wörtlich »sag«.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Was möchtest du?
  rationale: Die Frage zielt unmittelbar auf ihr Anliegen. »Möchtest« ist in diesem Gespräch natürlich und etwas würdevoller als das ebenfalls mögliche »willst«.
- source_word: Εἰπὲ
  choice: Sag
  rationale: Der Imperativ von λέγω bedeutet zunächst schlicht »sag«. So bleibt offen, ob Jesus etwas aussprechen, anordnen oder gewähren soll; eine stärkere Wiedergabe wie »bestimme« würde die im Zusammenhang naheliegende Wirkung bereits ausdeuten.
- source_word: ἵνα καθίσωσιν
  choice: dass ... sitzen dürfen
  rationale: Der ἵνα-Satz bezeichnet den Inhalt der Bitte. »Sitzen dürfen« gibt im Deutschen natürlich wieder, dass um die Zuweisung beziehungsweise Erlaubnis dieser Ehrenplätze gebeten wird.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: diese meine beiden Söhne
  rationale: Die Formulierung bewahrt sowohl das Demonstrativpronomen οὗτοι als auch die persönliche Zuordnung μου und klingt im Deutschen nachdrücklich, ohne unverständlich zu sein.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: einer zu deiner Rechten und einer zu deiner Linken
  rationale: Die räumlichen Wendungen bezeichnen die beiden Seiten Jesu und zugleich Ehrenplätze. Die traditionelle deutsche Formulierung ist klar und erhält den Parallelismus.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: in deinem Reich
  rationale: βασιλεία kann ein Reich oder die Ausübung königlicher Herrschaft bezeichnen. »Reich« ist hier idiomatisch und bewahrt den königlichen Zusammenhang, ohne eine bestimmte eschatologische Auslegung festzulegen.
theological_decisions:
- issue: Zeitpunkt und Gestalt der Königsherrschaft Jesu
  choice: Die Bitte wird als Bitte um Ehrenplätze »in deinem Reich« wiedergegeben, ohne dieses Reich zeitlich oder räumlich näher zu bestimmen.
  alternative: Ausdrückliche Deutung als irdisches messianisches Reich oder als vollendetes himmlisches Reich.
  rationale: Der griechische Text legt nicht fest, auf welche Phase oder Gestalt des Reiches die Frau zielt. Diese Spannung soll in der Übersetzung bestehen bleiben.
- issue: Stärke der mit Εἰπὲ ausgedrückten Bitte
  choice: Die Grundbedeutung »Sag« bleibt im Haupttext erhalten.
  alternative: »Bestimme«, »Befiehl« oder »Gewähre«.
  rationale: Im Zusammenhang ist eine wirksame königliche Verfügung gemeint, doch das griechische Verb selbst bedeutet »sagen«. Die stärkeren Deutungen werden daher nicht stillschweigend in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp. »Zu deiner Rechten/Linken« bewahrt die geläufige königliche Bildsprache; Gedankenstrich und Parallelismus machen die Zuordnung der beiden Ehrenplätze deutlich.
