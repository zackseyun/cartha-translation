revisions:
- from: Seht, wir ziehen hinauf nach Jerusalem. Dort wird der Menschensohn den führenden Priestern und den Schriftgelehrten ausgeliefert werden[a], und sie werden ihn zum Tod verurteilen.[b]
  to: Seht, wir ziehen hinauf nach Jerusalem, und der Menschensohn[b] wird den Hohenpriestern und den Schriftgelehrten ausgeliefert werden[a], und sie werden ihn zum Tod verurteilen.
  rationale: Die Revision entfernt die nicht explizit im griechischen Text enthaltene Ergänzung „Dort“, stellt die koordinierende Satzfolge wieder her und ersetzt die funktionale Umschreibung „führenden Priestern“ durch die etablierte, genauere Bezeichnung „Hohenpriestern“. Die Fußnoten werden unmittelbar an ihren jeweiligen Bezugsbegriffen verankert.
