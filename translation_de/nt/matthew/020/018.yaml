  source_fidelity: 'Die wesentlichen griechischen Aussagen sind getroffen: der Aufmerksamkeitsruf, das Hinaufgehen nach Jerusalem, der Titel „Menschensohn“, die zukünftige passive Übergabe, die beiden Autoritätsgruppen und die Verurteilung zum Tod. „Dort“ hat jedoch keine Entsprechung im Ausgangstext und verschiebt die Aussage unnötig zu einer Orts-/Ablauffolge. Für ἀρχιερεῦσιν ist „Hohenpriestern“ die etablierte präzise deutsche Fachbezeichnung für die führende priesterliche Gruppe.'
  naturalness: Der Satz ist nach der Entfernung von „Dort“ als zusammenhängende Ankündigung natürlich und klar. „Seht“ und „wir ziehen hinauf“ sind in einem würdevollen modernen Bibelregister gut verständlich.
  terminology: „Menschensohn“, „Hohenpriester“, „Schriftgelehrte“ und „zum Tod verurteilen“ sind sachgerecht und im deutschen Bibelgebrauch stabil. „Ausgeliefert werden“ gibt παραδοθήσεται als Übergabe in feindliche Gewalt angemessen wieder, ohne es auf Verrat zu verengen.
