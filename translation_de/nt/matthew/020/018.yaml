id: MAT.20.18
reference: Matthew 20:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: de
  text: Seht, wir ziehen hinauf nach Jerusalem, und der Menschensohn[b] wird den Hohenpriestern und den Schriftgelehrten ausgeliefert werden[a], und sie werden ihn zum Tod verurteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übergeben werden“; in einem engeren Zusammenhang kann das Verb auch „verraten werden“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Menschensohn“ ist Jesu charakteristische Selbstbezeichnung und kann an Daniel 7,13–14 erinnern.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden Diskursmarker in würdiger, noch natürlicher deutscher Sprache wieder; „Siehe“ wäre traditioneller, klingt heute aber stärker archaisch.
- source_word: ἀναβαίνομεν
  choice: wir ziehen hinauf
  rationale: Bewahrt sowohl die gegenwärtige Bewegung als auch den geografischen und herkömmlichen Aufstieg nach Jerusalem; „ziehen“ passt natürlich zu einer gemeinsam reisenden Gruppe.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe der charakteristischen Selbstbezeichnung Jesu; sie erhält eine mögliche Anspielung auf Daniel 7,13–14, ohne diese festzuschreiben.
- source_word: παραδοθήσεται
  choice: wird … ausgeliefert werden
  rationale: Drückt die passive Übergabe in die Gewalt anderer aus, ohne die Bedeutung vorschnell auf den Verrat durch Judas zu verengen.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: den führenden Priestern
  rationale: Bezeichnet die maßgeblichen priesterlichen Autoritäten. Diese Wiedergabe vermeidet das im Deutschen mögliche Missverständnis, es habe gleichzeitig mehrere amtierende Hohepriester gegeben.
- source_word: γραμματεῦσιν
  choice: den Schriftgelehrten
  rationale: Etablierte und verständliche deutsche Bezeichnung für die schrift- und gesetzeskundigen Fachleute.
- source_word: κατακρινοῦσιν
  choice: sie werden … verurteilen
  rationale: Gibt den gerichtlichen Sinn eines nachteiligen Urteils idiomatisch wieder.
- source_word: θανάτῳ
  choice: zum Tod
  rationale: Der Dativ bezeichnet die verhängte Strafe; „zum Tod verurteilen“ ist im Deutschen idiomatisch und präzise.
theological_decisions:
- issue: Wiedergabe des christologischen Ausdrucks ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Mensch / der Menschliche
  rationale: Bewahrt die im Deutschen verankerte Selbstbezeichnung Jesu und ihre mögliche Daniel-Anspielung, ohne sie auf eine rein allgemeine Aussage über einen Menschen zu reduzieren.
- issue: Bedeutungsumfang von παραδοθήσεται
  choice: wird ausgeliefert werden
  alternative: wird verraten werden
  rationale: Das griechische Verb bezeichnet hier zunächst die Übergabe in fremde Gewalt. „Verraten“ würde den konkreten Vorgang und Handelnden enger bestimmen, als dieser Vers es ausdrücklich tut.
- issue: Referenz von τοῖς ἀρχιερεῦσιν
  choice: den führenden Priestern
  alternative: den Hohenpriestern
  rationale: Die funktionale Wiedergabe bezeichnet die priesterliche Führungsschicht, ohne eine unhistorische Mehrzahl gleichzeitig amtierender Hoherpriester nahezulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Seht“ erhält den Aufmerksamkeitsruf, „ziehen hinauf“ die Bewegung nach Jerusalem. Der im Griechischen mit καί angeschlossene Satz wird im Deutschen mit „Dort“ gegliedert, um die örtliche Abfolge natürlich auszudrücken, ohne eine zusätzliche inhaltliche Behauptung einzuführen.
