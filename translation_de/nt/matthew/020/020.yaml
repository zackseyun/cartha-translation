id: MAT.20.20
reference: Matthew 20:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: de
  text: Dann kam die Mutter der Söhne des Zebedäus mit ihren Söhnen zu ihm, warf sich vor ihm nieder[a] und bat ihn um etwas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: betete ihn an. Das griechische Verb kann je nach Zusammenhang bedeuten, sich ehrerbietig niederzuwerfen, jemandem zu huldigen oder ihn anzubeten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Natürlicher zeitlicher Anschluss, der die folgende Begebenheit in der Erzählfolge einführt.
- source_word: προσῆλθεν αὐτῷ
  choice: kam … zu ihm
  rationale: Gibt die auf eine Person gerichtete Annäherung idiomatisch und quellennah wieder.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: die Mutter der Söhne des Zebedäus
  rationale: Bewahrt die griechische Genitivkonstruktion und identifiziert die Frau über die Söhne des Zebedäus.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: mit ihren Söhnen
  rationale: μετά mit Genitiv bezeichnet Begleitung; die Formulierung ist knapp und natürlich.
- source_word: προσκυνοῦσα
  choice: warf sich vor ihm nieder
  rationale: Bezeichnet anschaulich die ehrerbietige körperliche Geste, ohne eindeutig festzulegen, ob kultische Anbetung gemeint ist.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: und bat ihn um etwas
  rationale: Natürliches Deutsch für eine an ihn gerichtete Bitte; τι bleibt als unbestimmtes „etwas“ erhalten.
theological_decisions:
- issue: Bedeutung von προσκυνοῦσα gegenüber Jesus
  choice: warf sich vor ihm nieder
  alternative: betete ihn an; erwies ihm Ehrerbietung
  rationale: προσκυνέω kann je nach Kontext Niederwerfen, Huldigung oder Anbetung bezeichnen. Der Haupttext wahrt mit der körperlich-ehrerbietigen Bedeutung die Offenheit; die mögliche stärkere religiöse Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Warf sich vor ihm nieder“ ist allgemein verständlich und bewahrt die im griechischen Ausdruck liegende Spannung zwischen körperlicher Ehrerbietung, Huldigung und Anbetung.
