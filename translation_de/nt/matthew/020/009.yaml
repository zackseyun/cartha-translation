  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: de
  text: Und als die um die elfte Stunde kamen, erhielt jeder einen Denar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar war eine verbreitete römische Silbermünze und galt gewöhnlich als der typische Tageslohn eines Arbeiters.
