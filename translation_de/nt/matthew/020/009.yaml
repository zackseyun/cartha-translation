lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den schlichten erzählerischen Anschluss an den vorhergehenden Vers.
- source_word: ἐλθόντες
  choice: als die kamen
  rationale: Gibt das Aoristpartizip in natürlichem Deutsch wieder, ohne eine zusätzliche zeitliche Nuance einzuführen.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: die etwa um die elfte Stunde angeworben worden waren
  rationale: Die substantivierte Zeitangabe bezeichnet im Kontext die Gruppe der um diese Zeit angeworbenen Arbeiter. Das im Deutschen zur eindeutigen Zuordnung nötige »angeworben« stammt aus dem unmittelbaren Gleichniskontext.
- source_word: ἔλαβον
  choice: erhielt
  rationale: Passt idiomatisch zur Auszahlung eines Lohns; der Singular steht distributiv mit »jeder«.
- source_word: ἀνὰ
  choice: jeder
  rationale: 'Drückt die distributive Bedeutung aus: je ein Denar pro Person.'
- source_word: δηνάριον
  choice: einen Denar
  rationale: Bewahrt die historische Münzbezeichnung; der ungefähre wirtschaftliche Wert wird in der Fußnote erklärt.
