  naturalness: '„Und sieh: Zwei Blinde ...“ wirkt im modernen Standarddeutsch als unvermittelter Imperativ mit Doppelpunkt stilistisch auffällig und weniger natürlich. „Da saßen ...“ ist ein geläufiger erzählerischer Aufmerksamkeitsmarker und wahrt die hervorhebende Funktion von καὶ ἰδού ohne archaisierendes „siehe“.'
