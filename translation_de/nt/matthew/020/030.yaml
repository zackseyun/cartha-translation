  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: de
  text: 'Da saßen zwei Blinde am Straßenrand. Als sie hörten, dass Jesus vorbeiging, schrien sie: »Herr, hab Erbarmen mit uns, Sohn Davids!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt als knapper Aufmerksamkeitsmarker die erzählerische Hervorhebung; »siehe« wäre im heutigen Deutsch deutlich altertümlicher.
- source_word: δύο τυφλοὶ
  choice: zwei Blinde
  rationale: Bezeichnet im Kontext zwei männliche Personen und ist im Deutschen eine natürliche substantivierte Wiedergabe.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: saßen am Straßenrand
  rationale: Gibt Haltung und Schauplatz natürlich wieder; »am Straßenrand« entspricht hier idiomatisch dem Sitzen neben dem Weg.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: Als sie hörten, dass Jesus vorbeikam
  rationale: Das Aoristpartizip wird als zeitlicher Nebensatz wiedergegeben; »vorbeikam« passt zum erzählten Vergangenheitsrahmen.
- source_word: ἔκραξαν λέγοντες
  choice: riefen sie laut
  rationale: Drückt die Intensität von κράζω aus, ohne das im Deutschen entbehrliche semitisch-griechische »und sagten« mechanisch abzubilden.
- source_word: Κύριε
  choice: Herr
  rationale: Bewahrt die ehrerbietige und im Zusammenhang mit dem folgenden Titel möglicherweise christologische Tragweite der Anrede.
- source_word: ἐλέησον ἡμᾶς
  choice: hab Erbarmen mit uns
  rationale: Natürliche, würdevolle Wiedergabe der dringlichen Bitte um barmherzige Hilfe.
- source_word: υἱὸς Δαυίδ
  choice: Sohn Davids
  rationale: Bewahrt den in Matthäus wichtigen davidisch-messianischen Titel, statt ihn auf eine bloße Abstammungsangabe zu reduzieren.
theological_decisions:
- issue: Bedeutung von κύριος als Anrede Jesu
  choice: Herr
  alternative: Mein Herr / Herr im Sinn von höflichem »mein Herr«
  rationale: »Herr« lässt die ehrerbietige und mögliche christologische Bedeutung offen, ohne die Anrede auf bloße Höflichkeit festzulegen.
- issue: Messianische Tragweite von υἱὸς Δαυίδ
  choice: Sohn Davids
  alternative: Nachkomme Davids
  rationale: Die wörtliche Titelform erhält die königlich-messianische Resonanz des Ausdrucks im Matthäusevangelium.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Aufmerksamkeitsmarker wird mit »sieh« statt mit dem altertümlicheren »siehe« wiedergegeben; die direkte Rede bleibt eindringlich und knapp.
