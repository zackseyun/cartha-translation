  source_fidelity: 'Die Übersetzung bildet alle wesentlichen Elemente des griechischen Textes angemessen ab: die Bezugnahme auf die zuvor genannten Arbeiter (ἐκείνοις), den pluralischen Imperativ mit Einschlussbetonung (»Geht auch ihr«), den Weinberg sowie die offene Zusage, das Gerechte zu geben. »werde ich euch geben« wahrt zutreffend, dass δώσω nicht ausdrücklich »bezahlen« bedeutet.'
