  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: de
  text: 'Zu ihnen sagte er: »Geht auch ihr in den Weinberg, und was gerecht ist, werde ich euch geben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνοις
  choice: zu ihnen
  rationale: Der Dativ Plural des Demonstrativpronomens verweist auf die zuvor erwähnten Arbeiter; im Deutschen ist das schlichte Pronomen im Kontext natürlich und eindeutig.
- source_word: εἶπεν
  choice: sagte er
  rationale: Die gewöhnliche narrative Wiedergabe von λέγω leitet die direkte Rede ein, ohne ihre Aussagekraft zu verstärken.
- source_word: Ὑπάγετε
  choice: Geht
  rationale: Der Imperativ Plural bezeichnet hier die unmittelbare Aufforderung, sich in den Weinberg zu begeben.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Die Formulierung bewahrt die Hervorhebung und Einbeziehung dieser Arbeiter neben den bereits angeworbenen.
- source_word: ἀμπελῶνα
  choice: Weinberg
  rationale: Dies ist die übliche und kontextgerechte deutsche Entsprechung für ἀμπελών.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: was gerecht ist
  rationale: Die neutrale Relativkonstruktion bezeichnet das, was recht beziehungsweise gerecht ist. »Gerecht« erhält den ethischen Sinn von δίκαιον und passt natürlich zum Zusammenhang der Entlohnung.
- source_word: δώσω ὑμῖν
  choice: werde ich euch geben
  rationale: Die Wiedergabe folgt dem Grundsinn von δίδωμι. Obwohl es im Kontext um Lohn geht, steht im Griechischen kein ausdrückliches Verb für Bezahlen.
theological_decisions:
- issue: Wiedergabe von δίκαιον im Zusammenhang der Lohnfestsetzung
  choice: gerecht
  alternative: recht; angemessen; fair
  rationale: »Gerecht« wahrt die ethische Aussage und die mögliche Spannung zwischen Gerechtigkeit und erwarteter Entlohnung, ohne den Ausdruck auf subjektive Fairness oder bloße Angemessenheit zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung »auch ihr« erhält die Betonung des griechischen Pronomens; »geben« bewahrt die lexikalische Offenheit des Ausgangstextes.
