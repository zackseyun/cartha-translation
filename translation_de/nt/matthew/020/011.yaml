  text: λαβόντες δὲ ἐγόγγυζον κατὰ τοῦ οἰκοδεσπότου
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: de
  text: Als sie ihn aber erhalten hatten, murrten sie gegen den Hausherrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Als sie ihn aber erhalten hatten, begannen sie, gegen den Gutsherrn zu murren.'
    reason: Das Imperfekt kann als einsetzende oder fortdauernde Handlung verstanden werden; „Gutsherr“ gibt zudem die Rolle des οἰκοδεσπότης im Zusammenhang des Weinbergs wieder.
lexical_decisions:
- source_word: λαβόντες
  choice: als sie ihn … erhalten hatten
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die dem Murren zeitlich vorausgeht. Das im Griechischen unausgesprochene Objekt wird mit „ihn“ aufgenommen; gemeint ist der Denar aus dem Zusammenhang.
- source_word: δὲ
  choice: aber
  rationale: δέ verbindet den Satz mit dem Vorhergehenden und lässt zugleich einen leichten Gegensatz zwischen dem Empfang des Lohns und der anschließenden Reaktion erkennen.
- source_word: ἐγόγγυζον
  choice: murrten
  rationale: Das Imperfekt beschreibt ein andauerndes oder einsetzendes Murren. „Murrten“ bewahrt den Unterton leiser, unzufriedener Beschwerde, ohne den möglichen Aspekt ausdrücklich festzulegen.
- source_word: κατὰ
  choice: gegen
  rationale: κατά mit Genitiv bezeichnet hier die Person, gegen die sich das Murren richtet.
- source_word: τοῦ οἰκοδεσπότου
  choice: den Hausherrn
  rationale: „Hausherr“ gibt den Haushalts- beziehungsweise Gutsvorstand natürlich und nahe an der Zusammensetzung von οἰκοδεσπότης wieder; im Kontext ist er zugleich der Besitzer des Weinbergs.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Murrten“ entspricht dem erzählerischen und wertenden Ton, während „Hausherr“ allgemein verständlich bleibt.
