  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: de
  text: Sie aber gingen weg. Er ging gegen die sechste und die neunte Stunde[a] wieder hinaus und machte es ebenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das heißt nach damaliger jüdischer Zeitrechnung ungefähr um zwölf Uhr mittags und um drei Uhr nachmittags.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Da gingen sie hin
  rationale: οἱ nimmt die zuvor angesprochenen Arbeiter wieder auf; δέ führt die Erzählung leicht weiter. „Da gingen sie hin“ gibt die Folgewirkung und die Bewegung natürlich wieder.
- source_word: πάλιν ἐξελθὼν
  choice: Als er … wieder hinausging
  rationale: πάλιν bezeichnet die Wiederholung. Die temporale Wiedergabe des Aoristpartizips mit „als“ ist im Deutschen natürlich, ohne die zeitliche Beziehung unnötig zu präzisieren.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: um die sechste und um die neunte Stunde
  rationale: περί bezeichnet hier eine ungefähre Zeit. Die quellkulturelle Stundenzählung bleibt im Text erhalten; eine Fußnote erklärt die heutigen Zeitangaben.
- source_word: ἐποίησεν ὡσαύτως
  choice: machte er es ebenso
  rationale: ποιέω erhält seinen Inhalt aus ὡσαύτως. „Machte er es ebenso“ ist knapp, idiomatisch und verweist auf das zuvor beschriebene Handeln.
