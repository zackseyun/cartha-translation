base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: de
  text: 'Sie sagten zu ihm: „Herr,[a] lass unsere Augen geöffnet werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Herr“; die Anrede kann auch schlicht höflich gemeint sein.'
