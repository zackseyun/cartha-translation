lexical_decisions:
- source_word: λέγουσιν
  choice: Sie sagten
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Vergangenheit wiedergegeben.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den Adressaten der Aussage.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ bezeichnet eine respektvolle Anrede und kann bei Jesus zugleich sein besonderes Ansehen anklingen lassen, ohne dessen genaue Tragweite festzulegen.
- source_word: ἵνα ἀνοιγῶσιν
  choice: öffne
  rationale: Der ἵνα-Satz mit passivem Konjunktiv formuliert hier den Inhalt des Wunsches. Der deutsche Imperativ gibt die Bitte idiomatisch wieder; das ergänzte „uns“ und das Akkusativobjekt bewahren den Sinn des griechischen Passivs.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: uns die Augen
  rationale: Beim deutschen Ausdruck „jemandem die Augen öffnen“ wird der griechische Genitiv des Besitzes natürlich durch den Dativ „uns“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang der Anrede κύριε an Jesus
  choice: Herr
  alternative: Herr / mein Herr im Sinn einer höflichen Anrede
  rationale: „Herr“ bewahrt sowohl die gewöhnliche respektvolle Anrede als auch eine mögliche weitergehende Anerkennung Jesu; die Fußnote weist auf die echte lexikalische Spannweite hin.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Bitte klingt natürlicher als eine formale Wiedergabe mit „dass“, während die Fußnote die Form und Mehrdeutigkeit des Griechischen dokumentiert.
