id: MAT.20.12
reference: Matthew 20:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: de
  text: 'und sagten: „Diese Letzten haben eine Stunde gearbeitet, und du hast sie uns gleichgestellt, die wir die Last des Tages und die sengende Hitze getragen haben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip knüpft an den vorausgehenden Erzählvorgang an. Im natürlichen Deutschen gibt eine finite Form mit „und“ diesen Anschluss am klarsten wieder.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Diese Letzten
  rationale: Die substantivierte Form bezeichnet die zuletzt angeworbenen Arbeiter und bewahrt knapp den betonten Gegensatz.
- source_word: μίαν ὥραν ἐποίησαν
  choice: haben eine Stunde gearbeitet
  rationale: ποιέω mit einer Zeitangabe bezeichnet hier idiomatisch die geleistete Arbeitszeit. Die Übersetzung gibt dies verständlich wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes „nur“ einzufügen.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: du hast sie uns gleichgestellt
  rationale: „Gleichgestellt“ bewahrt sowohl den Gleichheitsgedanken als auch den Vorwurf, der Gutsherr habe die zuletzt Gekommenen entsprechend behandelt.
- source_word: τοῖς βαστάσασι
  choice: die wir ... getragen haben
  rationale: βαστάζω kann sowohl das Tragen einer Last als auch das Ertragen einer Belastung ausdrücken; „getragen“ erhält hier das Bild der Last.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: die Last des Tages
  rationale: Die Formulierung bewahrt das griechische Bild für die Belastung eines ganzen Arbeitstages.
- source_word: τὸν καύσωνα
  choice: die sengende Hitze
  rationale: καύσων bezeichnet starke, brennende Hitze; „sengend“ vermittelt deren Intensität in natürlichem Deutsch.
theological_decisions:
- issue: Klage über Gleichstellung und Gerechtigkeit im Gleichnis
  choice: Der Protest der Arbeiter wird unmittelbar als Klage über ihre Gleichstellung mit den zuletzt Gekommenen wiedergegeben.
  alternative: Den Wortlaut durch Begriffe wie „ungerecht behandelt“ ausdrücklich als moralisches Urteil auszudeuten.
  rationale: Der griechische Text berichtet die Beschwerde, entscheidet aber in diesem Satz nicht ausdrücklich über ihre Berechtigung. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzöffnung „und sagten“ setzt den Anschluss an den vorausgehenden Vers voraus. „Diese Letzten“ ist bewusst knapp und leicht gehoben; „uns gleichgestellt“ ist natürlich und zugleich eng am griechischen Gleichheitsausdruck.
