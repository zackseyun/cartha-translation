  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: de
  text: 'Sie sagen zu ihm: »Weil uns niemand eingestellt hat.« Er sagt zu ihnen: »Geht auch ihr in den Weinberg!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: Sie sagen
  rationale: Das historische Präsens des Griechischen wird beibehalten; es ist auch im deutschen Erzählstil verständlich und gibt der Szene Unmittelbarkeit.
- source_word: Ὅτι
  choice: Weil
  rationale: Ὅτι leitet hier die Begründung dafür ein, warum die Männer noch dort stehen.
- source_word: οὐδεὶς ἡμᾶς ἐμισθώσατο
  choice: uns niemand eingestellt hat
  rationale: μισθόομαι bezeichnet das Anwerben gegen Lohn. Das deutsche Perfekt drückt natürlich aus, dass sie bis zu diesem Zeitpunkt von niemandem eingestellt worden sind.
- source_word: λέγει
  choice: Er sagt
  rationale: Auch das zweite historische Präsens wird entsprechend der griechischen Erzählform bewahrt.
- source_word: Ὑπάγετε
  choice: Geht
  rationale: Der Imperativ fordert hier schlicht dazu auf, sich zum Arbeitsort zu begeben.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Die Formulierung hebt hervor, dass diese Gruppe ebenso wie die zuvor Angesprochenen in den Weinberg gehen soll.
- source_word: ἀμπελῶνα
  choice: Weinberg
  rationale: Dies ist die übliche und im Kontext eindeutige deutsche Entsprechung.
