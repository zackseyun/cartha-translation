  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: de
  text: Als sie Jericho verließen, folgte ihm eine große Menschenmenge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπορευομένων αὐτῶν
  choice: als sie … verließen
  rationale: Der Genitivus absolutus mit präsentischem Partizip wird als gleichzeitiger temporaler Nebensatz wiedergegeben. „Als sie … verließen“ ist im modernen Deutschen natürlich und bezeichnet hier den Vorgang des Weggehens, ohne ihn unnötig auszudeuten.
- source_word: ἀπὸ Ἰεριχὼ
  choice: Jericho
  rationale: Bei „verlassen“ wird der Ausgangsort im Deutschen direkt als Akkusativobjekt ausgedrückt; die Bedeutung von ἀπό, Bewegung von einem Ort weg, bleibt dadurch idiomatisch erhalten.
- source_word: ἠκολούθησεν
  choice: folgte
  rationale: Der Aorist von ἀκολουθέω bezeichnet hier, dass sich die Menge Jesus auf seinem Weg anschloss. „folgte“ ist die sachlich passende und etablierte Wiedergabe.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen ist Singular und verweist im Kontext am natürlichsten auf Jesus. Der Wechsel vom pluralischen „sie“ zum singularischen „ihm“ wird bewahrt.
- source_word: ὄχλος πολύς
  choice: eine große Menschenmenge
  rationale: Die Wortgruppe bezeichnet eine zahlreiche Menge von Menschen. „große Menschenmenge“ ist klares, modernes Standarddeutsch und vermeidet das heute weniger natürliche „viel Volk“.
theological_decisions:
- issue: Bezug des singularischen Pronomens αὐτῷ nach dem pluralischen Partizipialsatz
  choice: Die Menschenmenge folgte Jesus („ihm“).
  alternative: Die Menschenmenge folgte der ganzen Gruppe („ihnen“).
  rationale: Der griechische Text wechselt ausdrücklich vom Plural αὐτῶν zum Singular αὐτῷ. Im Zusammenhang ist Jesus der naheliegende Bezug; die Übersetzung glättet diesen Wechsel nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Erzählstil des griechischen Satzes bleibt erhalten; eine Fußnote ist nicht erforderlich, da „Jericho verlassen“ die räumliche Bedeutung von ἀπό vollständig und natürlich ausdrückt.
