- from: 'Als es Abend geworden war, sagt der Besitzer des Weinbergs zu seinem Verwalter: »Ruf die Arbeiter und zahl ihnen den Lohn aus, angefangen bei den Letzten bis hin zu den Ersten.«'
  to: 'Als es Abend wurde, sagte der Herr des Weinbergs zu seinem Verwalter: »Ruf die Arbeiter und zahle ihnen den Lohn aus, beginnend mit den Letzten und endend mit den Ersten.«'
  rationale: Die Revision glättet die deutsche Tempusführung und stellt die Bedeutung von κύριος als »Herr« wieder her. Die Reihenfolge der Auszahlung bleibt ausdrücklich von den Letzten zu den Ersten erhalten; für den kurzen Vers sind keine Fußnoten erforderlich.
