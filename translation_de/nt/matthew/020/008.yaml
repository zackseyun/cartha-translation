source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: de
  text: 'Als es Abend wurde, sagte der Herr des Weinbergs zu seinem Verwalter: »Ruf die Arbeiter und zahle ihnen den Lohn aus, beginnend mit den Letzten und endend mit den Ersten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: der Besitzer des Weinbergs
  rationale: κύριος bezeichnet hier im Rahmen des Gleichnisses den Eigentümer beziehungsweise Herrn des Weinbergs. »Besitzer« ist im modernen Deutsch natürlich und vermeidet eine unbeabsichtigte direkte Gottesbezeichnung.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: zu seinem Verwalter
  rationale: ἐπίτροπος bezeichnet hier den mit der Aufsicht und Auszahlung betrauten Verwalter; »Verwalter« ist klarer und gegenwärtiger als »Verwalter seines Hauses« oder »Aufseher«.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: zahl ihnen den Lohn aus
  rationale: ἀποδίδωμι trägt den Sinn des Aushändigens dessen, was geschuldet ist. »den Lohn auszahlen« gibt die konkrete Zahlungssituation idiomatisch wieder.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: angefangen bei den Letzten bis hin zu den Ersten
  rationale: Die Reihenfolge und Spannung zwischen ἔσχατοι und πρῶτοι bleiben eng am griechischen Wortlaut erhalten.
theological_decisions:
- issue: Historisches Präsens λέγει
  choice: sagt
  alternative: sagte
  rationale: Das griechische Präsens belebt die Erzählung. Das deutsche historische Präsens ist hier verständlich und bewahrt diese Form, wie auch die konsultierte englische Fassung.
- issue: Bezeichnung des Weinbergbesitzers mit κύριος
  choice: Besitzer
  alternative: Herr
  rationale: Im unmittelbaren Erzählzusammenhang bezeichnet das Wort die soziale Rolle des Weinbergeigentümers. Die Übersetzung legt keine zusätzliche christologische oder göttliche Identifikation fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Gleichniserzählung. Die direkte Rede ist klar und knapp; das historische Präsens wird bewusst beibehalten.
