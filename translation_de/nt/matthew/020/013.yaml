source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: de
  text: 'Er aber antwortete einem von ihnen: »Freund, ich tue dir kein Unrecht. Hast du dich nicht mit mir auf einen Denar[a] geeinigt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar war eine verbreitete römische Silbermünze und entsprach ungefähr dem üblichen Tageslohn eines Arbeiters.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: antwortete
  rationale: Die deutsche finite Verbform gibt die griechische Antwortformel natürlich und knapp wieder; eine wörtliche Doppelung wie »antwortend sagte er« wäre im modernen Deutsch schwerfällig.
- source_word: ἑνὶ αὐτῶν
  choice: einem von ihnen
  rationale: Der Dativ Singular mit partitivem Genitiv bezeichnet eine einzelne Person aus der Gruppe.
- source_word: Ἑταῖρε
  choice: Freund
  rationale: »Freund« ist die geläufigste deutsche Anrede; der Kontext lässt zugleich einen zurückhaltenden oder distanzierten Unterton zu.
- source_word: οὐκ ἀδικῶ σε
  choice: ich tue dir kein Unrecht
  rationale: 'Die Formulierung bewahrt sowohl den persönlichen Bezug von σε als auch den Sinn von ἀδικέω: jemanden ungerecht behandeln beziehungsweise ihm Unrecht tun.'
- source_word: οὐχὶ
  choice: Hast du dich nicht …?
  rationale: Die verneinte Frage erwartet Zustimmung und wird durch die deutsche Satzstellung klar als rhetorische Frage wiedergegeben.
- source_word: δηναρίου
  choice: auf einen Denar
  rationale: Der Genitiv bezeichnet hier den vereinbarten Preis beziehungsweise Lohn. Die historische Münzbezeichnung bleibt erhalten.
- source_word: συνεφώνησάς μοι
  choice: hast du dich mit mir … geeinigt
  rationale: Die reflexive Wendung ist im Deutschen für eine gegenseitige Vereinbarung idiomatischer als »mit mir übereingestimmt« und gibt den Rückbezug auf die frühere Lohnabsprache wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Antwortformel wurde ohne unnatürliche partizipiale Doppelung formuliert. »Freund« wahrt die mögliche Spannung zwischen höflicher Anrede und Distanz. Der Fußnotenmarker steht unmittelbar bei der historischen Münzbezeichnung.
