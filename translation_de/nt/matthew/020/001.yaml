id: MAT.20.1
reference: Matthew 20:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: de
  text: Denn mit dem Himmelreich ist es wie mit einem Hausherrn, der früh am Morgen hinausging, um Arbeiter für seinen Weinberg einzustellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: Die geläufige und prägnante deutsche Wiedergabe bewahrt Matthäus’ Ausdruck »Königsherrschaft der Himmel«, ohne ihn unnötig zu erklären.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: einem Hausherrn
  rationale: οἰκοδεσπότης bezeichnet den Herrn beziehungsweise Verwalter eines Hauses oder Besitzes. Das zusätzliche ἀνθρώπῳ ist in der natürlichen deutschen Vergleichsform »wie mit einem Hausherrn« mitenthalten und muss nicht pleonastisch als »einem Mann, einem Hausherrn« wiederholt werden.
- source_word: ἅμα πρωῒ
  choice: früh am Morgen
  rationale: Gibt den frühen Zeitpunkt idiomatisch wieder; ἅμα verstärkt hier die morgendliche Zeitangabe.
- source_word: μισθώσασθαι ἐργάτας
  choice: Arbeiter anzuwerben
  rationale: Das Medium μισθώσασθαι meint, Arbeiter gegen Lohn in Dienst zu nehmen. »Anwerben« ist natürlich und lässt die ausdrückliche Lohnvereinbarung des folgenden Verses offen.
- source_word: ἀμπελῶνα
  choice: Weinberg
  rationale: Direkte und kontextgemäße Entsprechung.
theological_decisions:
- issue: Vergleichsbezug des Himmelreichs
  choice: »Mit dem Himmelreich ist es wie mit einem Hausherrn«
  alternative: »Das Himmelreich gleicht einem Hausherrn«
  rationale: Die gewählte deutsche Vergleichsform vermeidet die übermäßig enge Gleichsetzung des Reiches allein mit der Person und lässt zu, dass die anschließende ganze Handlung den Vergleich entfaltet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Hausherr« erhält das historische Bild, während Satzbau und Wortwahl für heutige Leser natürlich bleiben.
