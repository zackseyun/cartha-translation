id: MAT.20.27
reference: Matthew 20:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: de
  text: Und wer unter euch der Erste sein will, wird euer Sklave sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knecht“. Das griechische Wort doulos ist stärker als das Wort für „Diener“ im vorhergehenden Vers und bezeichnet häufig einen Sklaven oder unfreien Knecht.'
    reason: lexikalische Alternative und Bewahrung der rhetorischen Steigerung gegenüber dem vorhergehenden Vers
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: wer … will
  rationale: Die Verbindung aus Relativpronomen, ἄν und Konjunktiv bezeichnet allgemein und unbestimmt jeden, auf den die Bedingung zutrifft. „Wer … will“ ist im modernen Deutschen natürlich und bewahrt den Willensaspekt von θέλω.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Im Zusammenhang mit Rang und Stellung innerhalb der Gemeinschaft bezeichnet ἐν mit Dativ die Position in der Gruppe; „unter euch“ ist dafür die idiomatische deutsche Wiedergabe.
- source_word: εἶναι πρῶτος
  choice: der Erste sein
  rationale: Die Formulierung bezeichnet das Streben nach dem höchsten Rang. Der bestimmte Artikel ist im Deutschen bei dem substantivierten Superlativ erforderlich.
- source_word: ἔσται
  choice: wird … sein
  rationale: Der Futur-Indikativ wird formal als Zukunft wiedergegeben. Seine kontextuell normative beziehungsweise auffordernde Kraft bleibt dabei erhalten, ohne sie durch „muss“ ausdrücklich festzulegen.
- source_word: ὑμῶν
  choice: euer
  rationale: 'Der Genitiv bezeichnet hier die Beziehung zu den übrigen Jüngern: Derjenige soll ihnen gegenüber die Stellung eines Sklaven einnehmen.'
- source_word: δοῦλος
  choice: Sklave
  rationale: δοῦλος ist stärker als διάκονος im vorhergehenden Vers und bezeichnet gewöhnlich einen rechtlich oder sozial gebundenen Sklaven. „Sklave“ bewahrt die rhetorische Steigerung und die Härte des Bildes.
theological_decisions:
- issue: Wiedergabe von δοῦλος in der Aussage über Nachfolge und Rang
  choice: Sklave
  alternative: Diener; Knecht
  rationale: Jesus kehrt das Streben nach dem ersten Rang durch ein Bild äußerster Unterordnung um. Da im vorhergehenden Vers διάκονος steht, würde „Diener“ die sprachliche Steigerung einebnen. „Knecht“ ist traditionell, kann im heutigen Deutsch aber die unfreie Stellung weniger eindeutig ausdrücken.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstellung folgt natürlichem Deutsch; „Sklave“ ist bewusst deutlich gewählt, um die Stärke des griechischen Ausdrucks und den Kontrast zum vorhergehenden Vers zu erhalten.
