reference: Matthew 20:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: de
  text: 'Doch Jesus antwortete: „Ihr wisst nicht, worum ihr bittet. Könnt ihr den Kelch trinken, den ich bald trinken werde?“ Sie sagten zu ihm: „Wir können es.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Doch Jesus antwortete
  rationale: „Doch“ gibt den milden Kontrast von δέ wieder. Das deutsche „antwortete“ bildet die griechische Erzählformel natürlich ab; ein zusätzliches „und sagte“ wäre im modernen Deutsch unnötig schwerfällig.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Ihr wisst nicht, worum ihr bittet
  rationale: „Wissen“ entspricht οἶδα, ohne es deutend zu „verstehen“ zu erweitern. „Worum ihr bittet“ ist eine natürliche und genaue deutsche Wiedergabe des erbetenen Gegenstands.
- source_word: δύνασθε πιεῖν
  choice: Könnt ihr … trinken
  rationale: Die idiomatische deutsche Frage mit „können“ drückt die von δύνασθε bezeichnete Fähigkeit aus und bewahrt die ernste Herausforderung.
- source_word: τὸ ποτήριον
  choice: den Kelch
  rationale: „Kelch“ bewahrt die biblisch geprägte Metapher für den zugewiesenen Anteil beziehungsweise das bevorstehende Geschick, ohne sie im Haupttext auf Leiden oder Tod festzulegen.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: den ich bald trinken werde
  rationale: „Bald … werde“ gibt die zukunftsgerichtete und wahrscheinlich bevorstehende Bedeutung von μέλλω wieder, ohne die im Deutschen teils überpointierte Unmittelbarkeit von „im Begriff sein“.
- source_word: λέγουσιν αὐτῷ
  choice: Sie sagten zu ihm
  rationale: Das historische Präsens wird entsprechend natürlicher deutscher Erzählweise im Präteritum wiedergegeben.
- source_word: Δυνάμεθα
  choice: Wir können es
  rationale: Die Antwort nimmt das zuvor verwendete „könnt“ unmittelbar auf. Das ergänzte Pronomen „es“ ist im Deutschen idiomatisch und verweist klar auf das Trinken des Kelches.
theological_decisions:
- issue: Metaphorische Bedeutung des Kelches
  choice: Die Metapher „den Kelch trinken“ bleibt im Haupttext unverändert stehen.
  alternative: „das Leiden ertragen, das mir bevorsteht“ oder „den Leidenskelch trinken“
  rationale: Der griechische Text erklärt das Bild nicht ausdrücklich. Es weist im Zusammenhang auf Jesu bevorstehendes Leiden und Geschick, soll aber nicht durch eine interpretierende Paraphrase auf nur eine Bedeutung verengt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Doppelungsformel „antwortete und sagte“ wird natürlich zu „antwortete“ verdichtet. „Kelch“ erhält den biblischen Bildcharakter; auf eine Fußnote wird verzichtet, da der Vers selbst keine textkritische oder für das Verständnis zwingend erforderliche Alternative verlangt.
