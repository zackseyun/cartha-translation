  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: de
  text: Und als er um die dritte Stunde[a] hinausging, sah er andere auf dem Marktplatz stehen, die untätig waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das heißt ungefähr gegen neun Uhr morgens. Die „dritte Stunde“ wurde vom Sonnenaufgang an gerechnet.
    reason: cultural_note
  - marker: b
    text: 'Oder: die keine Arbeit hatten. Das griechische Wort bedeutet hier, dass sie nicht arbeiteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: als er … hinausging
  rationale: Das temporale Satzgefüge gibt das vorzeitige bzw. begleitend-sequenzielle aoristische Partizip in natürlichem modernem Deutsch wieder.
- source_word: περὶ τρίτην ὥραν
  choice: um die dritte Stunde
  rationale: Bewahrt die antike jüdische Zeitangabe; περί wird durch „um“ im Sinn von „ungefähr“ idiomatisch wiedergegeben.
- source_word: εἶδεν
  choice: sah er
  rationale: Schlichte und genaue narrative Wiedergabe des Aorists von ὁράω.
- source_word: ἄλλους
  choice: andere
  rationale: Das substantivierte Adjektiv bleibt ohne die im Griechischen nicht ausdrücklich genannte Ergänzung „Männer“.
- source_word: ἑστῶτας
  choice: stehen
  rationale: Gibt den perfektischen Partizipialzustand von ἵστημι knapp und natürlich wieder.
- source_word: ἀγορᾷ
  choice: Marktplatz
  rationale: Bezeichnet den öffentlichen Markt- und Versammlungsplatz, an dem sich auch Tagelöhner aufhielten.
- source_word: ἀργούς
  choice: die untätig waren
  rationale: Gibt den Zustand des Nichtarbeitens direkt wieder, ohne die moderne wirtschaftliche Kategorie „arbeitslos“ festzuschreiben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die historische Zeitangabe bleibt im Haupttext erhalten und wird in der Fußnote erklärt; „untätig“ vermeidet eine vorschnelle Festlegung auf den modernen Begriff „arbeitslos“.
