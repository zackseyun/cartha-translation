  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: de
  text: Himmel und Erde werden vergehen, aber meine Worte werden ganz gewiss nicht vergehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Himmel
  rationale: In der eschatologischen Verbindung mit γῆ bezeichnet der Singular den geschaffenen Himmel beziehungsweise die geschaffene Weltordnung, nicht nur den sichtbaren Himmel. „Himmel und Erde“ ist im Deutschen die natürliche feste Wendung.
- source_word: ἡ γῆ
  choice: Erde
  rationale: In der Verbindung „Himmel und Erde“ bezeichnet γῆ die Erde als Teil der gesamten Schöpfungsordnung, nicht ein bestimmtes Land.
- source_word: παρελεύσεται
  choice: werden vergehen
  rationale: παρέρχομαι bezeichnet hier das Vergehen der gegenwärtigen Schöpfungsordnung. „Vergehen“ ist präzise, würdevoll und legt nicht fest, auf welche Weise dies geschieht.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet den deutlichen Gegensatz zwischen der Vergänglichkeit von Himmel und Erde und der bleibenden Geltung der Worte Jesu.
- source_word: οἱ λόγοι μου
  choice: meine Worte
  rationale: λόγοι meint hier die Äußerungen beziehungsweise Aussagen Jesu. „Meine Worte“ ist direkt, natürlich und bewahrt den umfassenden Sinn.
- source_word: οὐ μὴ παρέλθωσιν
  choice: werden ganz gewiss nicht vergehen
  rationale: Die Verbindung οὐ μή mit dem Aorist Konjunktiv ist eine nachdrückliche Verneinung. „Ganz gewiss nicht“ gibt diese emphatische Kraft in modernem Deutsch klar wieder.
theological_decisions:
- issue: Kraft der Aussage Jesu über die Beständigkeit seiner Worte
  choice: Die Aussage wird als nachdrücklicher Gegensatz zwischen der vergänglichen Schöpfungsordnung und der unvergehenden Geltung der Worte Jesu wiedergegeben.
  alternative: Eine stärker deutende Wiedergabe, die ausdrücklich Folgerungen über Jesu göttliche Autorität formuliert.
  rationale: Der Vers selbst behauptet mit besonderem Nachdruck, dass Jesu Worte nicht vergehen. Die Übersetzung bewahrt dieses theologische Gewicht, ohne über den Wortlaut hinaus eine bestimmte dogmatische Folgerung einzufügen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich feierlich-würdiges Standarddeutsch. Die Wiederholung von „vergehen“ bildet die enge sprachliche Gegenüberstellung des griechischen Textes ab; „ganz gewiss“ macht die emphatische Negation hörbar, ohne archaische Formulierungen zu verwenden.
