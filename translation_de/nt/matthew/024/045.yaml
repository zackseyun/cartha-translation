id: MAT.24.45
reference: Matthew 24:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: de
  text: Wer ist also der treue und kluge Sklave[a], den sein Herr[b] über die Dienerschaft seines Hauses eingesetzt hat, damit er ihnen zur rechten Zeit die Nahrung gibt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“ beziehungsweise „Knecht“. Das griechische Wort bezeichnet einen Menschen, der der Verfügungsgewalt eines Herrn untersteht; „Sklave“ gibt diesen stärkeren Sinn hier am deutlichsten wieder.'
    reason: lexical_alternative
  - marker: b
    text: Im Bild des Haushalts ist der Herr beziehungsweise Hausherr des Sklaven gemeint. Das griechische Wort kann auch als Titel „Herr“ gebraucht werden; diese mögliche weiterführende Bedeutung bleibt im Deutschen offen.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Wer ist also
  rationale: Die rhetorische Frage und die folgernde beziehungsweise weiterführende Kraft von ἄρα werden in natürlichem Deutsch bewahrt.
- source_word: πιστὸς
  choice: treu
  rationale: „Treu“ bezeichnet hier verlässliche Pflichterfüllung und bewahrt zugleich die moralische Bedeutungsweite des griechischen Ausdrucks.
- source_word: δοῦλος
  choice: Sklave
  rationale: δοῦλος bezeichnet einen Menschen unter der rechtlichen und persönlichen Verfügungsgewalt eines Herrn. „Sklave“ gibt dieses Abhängigkeitsverhältnis deutlicher wieder als „Diener“; die geläufigere Alternative wird in einer Fußnote genannt.
- source_word: φρόνιμος
  choice: klug
  rationale: Das Wort meint praktische Einsicht und umsichtiges Handeln. „Klug“ ist im Deutschen natürlich und lässt diesen praktischen Sinn zu.
- source_word: κατέστησεν
  choice: eingesetzt hat
  rationale: Das Verb bezeichnet hier die Übertragung einer verantwortlichen Stellung. „Eingesetzt hat“ gibt sowohl die Ernennung als auch die delegierte Vollmacht wieder.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ passt zum sozialen Verhältnis innerhalb des Gleichnisses und bewahrt im Deutschen zugleich die mögliche Anspielung auf den Herrn im theologischen Sinn, ohne sie ausdrücklich festzulegen.
- source_word: οἰκετείας
  choice: Dienerschaft seines Hauses
  rationale: οἰκετεία bezeichnet hier vor allem die zum Haushalt gehörenden Bediensteten, nicht bloß das Gebäude oder unterschiedslos sämtliche Familienangehörigen.
- source_word: τοῦ δοῦναι
  choice: damit er … gibt
  rationale: Der artikulierte Infinitiv drückt den Zweck der Einsetzung aus. Ein deutscher Finalsatz macht diesen Zusammenhang klar und natürlich.
- source_word: τροφὴν
  choice: die Nahrung
  rationale: „Nahrung“ gibt den allgemeinen Sinn von τροφή wieder, ohne die Versorgung unnötig als festgesetzte Ration zu spezifizieren.
- source_word: ἐν καιρῷ
  choice: zur rechten Zeit
  rationale: Die Wendung bezeichnet den passenden oder vorgesehenen Zeitpunkt, nicht lediglich einen Zeitpunkt im chronologischen Sinn.
theological_decisions:
- issue: Wiedergabe von κύριος im Gleichnis vom Haushalt
  choice: Herr
  alternative: Hausherr; Gebieter
  rationale: Im unmittelbaren Bild ist κύριος der Herr eines Sklaven und eines Haushalts. Das deutsche „Herr“ trägt diesen sozialen Sinn, lässt aber zugleich die im weiteren Kontext mögliche Beziehung auf den Herrn offen. „Hausherr“ wäre eindeutiger szenisch, würde die theologische Spannung jedoch stärker auflösen.
- issue: Sozialer Status des δοῦλος
  choice: Sklave
  alternative: Diener; Knecht
  rationale: Die Übersetzung soll das im antiken Bild vorausgesetzte Herrschafts- und Abhängigkeitsverhältnis nicht abschwächen. Sie macht damit keine Aussage zur Billigung dieser Institution, sondern bildet die soziale Metapher des Ausgangstextes ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dienerschaft seines Hauses“ verdeutlicht den personalen Bezug von οἰκετεία, ohne das altertümlich klingende „Hausgesinde“ zu verwenden. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber durch einen natürlichen Finalsatz geglättet.
