  source_fidelity: Der Text gibt die griechische Frageform mit folgerndem ἄρα treffend als „Wer ist also …?“ wieder. „treue und kluge Sklave“ entspricht πιστὸς δοῦλος καὶ φρόνιμος; „eingesetzt hat“ bildet κατέστησεν angemessen ab. „über die Dienerschaft seines Hauses“ bringt den personalen Haushaltsbezug von οἰκετεία gut zum Ausdruck. Der Finalsatz gibt τοῦ δοῦναι korrekt wieder, und „zur rechten Zeit“ bewahrt die qualitative Zeitnuance von ἐν καιρῷ.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch und als rhetorische Frage flüssig lesbar. „Dienerschaft seines Hauses“ ist etwas formeller, aber idiomatisch und für den Gleichniskontext passend.
  terminology: „Sklave“ ist für δοῦλος quellentreu; die Fußnote nennt verständlich die möglichen, weniger starken deutschen Alternativen. „Herr“ ist im deutschen Gleichniskontext sowohl sozial passend als auch ausreichend offen für die mögliche weiterführende Titelbedeutung von κύριος. Die Fußnotenanker stehen bei den einschlägigen Wörtern und sind inhaltlich stimmig.
