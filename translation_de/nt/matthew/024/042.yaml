  variant: modern standard German
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: de
  text: Darum bleibt wach[a], denn ihr wisst nicht, an welchem Tag euer Herr kommt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haltet Wache“ oder „seid wachsam“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kommen wird“. Im Griechischen steht eine Präsensform.'
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: bleibt wach
  rationale: Der Imperativ Präsens Plural fordert zu anhaltender Wachsamkeit auf. „Bleibt wach“ bewahrt das Bild des Wachseins und klingt zugleich natürlich und eindringlich.
- source_word: οὖν
  choice: Darum
  rationale: Das Wort kennzeichnet eine Folgerung aus dem vorausgehenden Abschnitt. „Darum“ ist in modernem Deutsch klar und würdevoll.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung für die Aufforderung ein. „Denn“ verbindet die beiden Hauptsätze im Deutschen natürlicher als ein mit „weil“ eingeleiteter Nebensatz.
- source_word: οὐκ οἴδατε
  choice: ihr wisst nicht
  rationale: Gibt die verneinte Aussage des Wissens ohne unbegründete Verstärkung wieder.
- source_word: ποίᾳ ἡμέρᾳ
  choice: an welchem Tag
  rationale: Der Dativ bezeichnet den Zeitpunkt. „An welchem Tag“ ist idiomatisch und erhält den Bezug auf einen bestimmten, aber unbekannten Tag.
- source_word: ὁ κύριος ὑμῶν
  choice: euer Herr
  rationale: Gibt Artikel, Titel und Possessivpronomen idiomatisch wieder und bewahrt κύριος als etablierten neutestamentlichen Hoheitstitel.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das deutsche Präsens entspricht der griechischen Präsensform und kann wie diese in diesem Kontext zukünftiges Geschehen ausdrücken, ohne den Zeitpunkt näher festzulegen.
theological_decisions:
- issue: Eschatologische Aussagekraft des Präsens ἔρχεται
  choice: „kommt“ im deutschen Präsens
  alternative: „kommen wird“ oder „im Kommen ist“
  rationale: Das Präsens bewahrt die unmittelbare, eindringliche Ausdrucksweise des Griechischen. Zugleich lässt es im Deutschen eine futurische Deutung zu, ohne eine genauere Lehre über den Zeitpunkt oder die Unmittelbarkeit des Kommens einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in einer klaren, würdevollen Anredeform. Das Bild des Wachbleibens und das eschatologische Präsens werden bewahrt; die Satzverknüpfung bleibt knapp und gut verständlich.
