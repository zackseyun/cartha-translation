id: MAT.24.30
reference: Matthew 24:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: de
  text: Und dann wird das Zeichen des Menschensohnes im Himmel[a] erscheinen. Dann werden alle Stämme der Erde[b] wehklagen, und sie werden den Menschensohn auf den Wolken des Himmels[c] kommen sehen, mit Macht und großer Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Himmel“. Das griechische Wort οὐρανός kann je nach Zusammenhang den Himmel als überirdischen Bereich oder den sichtbaren Himmelsraum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle Stämme des Landes“. Das griechische Wort γῆ kann „Erde“ oder „Land“ bedeuten.'
    reason: alternative_reading
  - marker: c
    text: Die Wendung „auf den Wolken des Himmels“ greift Daniel 7,13 auf.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: wird … erscheinen
  rationale: Die Form wird hier am natürlichsten intransitiv wiedergegeben; sie bezeichnet das sichtbare Hervortreten.
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: das Zeichen des Menschensohnes
  rationale: Die relativ formale Genitivkonstruktion bewahrt die Mehrdeutigkeit, ob es sich um ein ihm zugehöriges Zeichen handelt oder ob der Menschensohn selbst als Zeichen verstanden wird.
- source_word: ἐν τῷ οὐρανῷ
  choice: am Himmel
  rationale: „Am Himmel“ ist im Deutschen für ein sichtbares apokalyptisches Geschehen natürlich und lässt sowohl den sichtbaren Himmel als auch den Himmel als überirdischen Bereich anklingen.
- source_word: κόψονται
  choice: werden … klagen
  rationale: Das medial gebrauchte Verb bezeichnet hier Trauerklage; „klagen“ ist klar und bewahrt stärker als „trauern“ den aktiven Charakter, ohne eine bestimmte Trauergeste festzulegen.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: alle Stämme der Erde
  rationale: „Stämme“ gibt φυλαί unmittelbar wieder und erhält die prophetisch-apokalyptischen Anklänge; „Erde“ passt zum kosmischen Kontext, während „Land“ als Alternative vermerkt wird.
- source_word: ὄψονται … ἐρχόμενον
  choice: sie werden … kommen sehen
  rationale: Die deutsche Infinitivkonstruktion gibt Verb und Partizip natürlich und präzise wieder.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: auf den Wolken des Himmels
  rationale: Die räumliche Wiedergabe entspricht dem naheliegenden Sinn von ἐπί und bewahrt den deutlichen Anklang an Daniel 7,13.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: mit Macht und großer Herrlichkeit
  rationale: Die Formulierung folgt der griechischen Zuordnung von πολλῆς zu δόξης und klingt zugleich würdig und verständlich.
theological_decisions:
- issue: Bedeutung von „das Zeichen des Menschensohnes“
  choice: Die Genitivmehrdeutigkeit bleibt mit „das Zeichen des Menschensohnes“ erhalten.
  alternative: „das Zeichen, das dem Menschensohn gehört“ oder „das Zeichen, nämlich der Menschensohn selbst“
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, in welchem Verhältnis das Zeichen zum Menschensohn steht; die Übersetzung entscheidet diese eschatologische Streitfrage daher nicht.
- issue: Reichweite von γῆ
  choice: Im Haupttext steht „Erde“.
  alternative: „Land“
  rationale: Der kosmisch-apokalyptische Zusammenhang spricht für den universalen Sinn, doch ein Bezug auf das Land bleibt sprachlich und intertextuell möglich und wird in der Fußnote bewahrt.
- issue: Prophetischer Hintergrund der Wolkenaussage
  choice: Der Wortlaut bleibt als „auf den Wolken des Himmels“ erhalten.
  alternative: Eine erklärende Ausdeutung der Gestalt oder Art des Kommens
  rationale: Der deutliche Bezug auf Daniel 7,13 wird kenntlich gemacht, ohne seine theologischen Folgerungen in den Bibeltext hineinzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Menschensohn“ und „Herrlichkeit“ bewahren die vertraute biblische Begrifflichkeit; die Satzgliederung in zwei Sätze erhöht die Lesbarkeit, ohne die Abfolge des griechischen Textes zu verändern.
