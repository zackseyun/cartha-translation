  source_fidelity: 'Der deutsche Text gibt die Abfolge und den Sinn des griechischen Textes zuverlässig wieder: das künftig zu Erwartende (μελλήσετε ... ἀκούειν), „Kriege“ und Meldungen darüber, die warnende Aufforderung gegen Beunruhigung, die Notwendigkeit des Geschehens und das noch ausstehende Ende. Das unpersönliche „es muss geschehen“ bewahrt die im Griechischen nicht ausdrücklich benannte Bezugsgröße.'
