id: MAT.24.6
reference: Matthew 24:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: de
  text: Ihr werdet aber von Kriegen und Berichten über Kriege[a] hören. Seht zu, dass ihr nicht in Schrecken geratet! Denn es muss geschehen; aber das Ende ist noch nicht da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gerüchten über Kriege“. Das griechische Wort kann Berichte, Nachrichten oder Gerüchte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε ἀκούειν
  choice: ihr werdet … hören
  rationale: Die Verbindung aus dem Futur von μέλλω und dem Infinitiv bezeichnet ein erwartetes künftiges Geschehen. Das deutsche Futur gibt dies natürlich wieder, ohne eine stärkere Unmittelbarkeit zu behaupten.
- source_word: πολέμους
  choice: Kriegen
  rationale: πόλεμος bezeichnet gewöhnlich einen Krieg und nicht lediglich eine einzelne Schlacht oder allgemein einen Konflikt.
- source_word: ἀκοὰς πολέμων
  choice: Berichten über Kriege
  rationale: ἀκοή kann hier Berichte, Nachrichten oder auch Gerüchte bezeichnen. „Berichte“ lässt offen, ob die Meldungen zuverlässig sind, und vermeidet die mit „Gerüchte“ oft verbundene Unterstellung von Unwahrheit.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: Seht zu, dass ihr nicht in Schrecken geratet
  rationale: ὁρᾶτε leitet eine eindringliche Aufforderung ein; θροεῖσθε bezeichnet Beunruhigung, Bestürzung oder alarmartigen Schrecken. Die Formulierung ist idiomatisch und bewahrt den Ernst der Warnung.
- source_word: δεῖ γὰρ γενέσθαι
  choice: Denn es muss geschehen
  rationale: δεῖ drückt Notwendigkeit aus, γενέσθαι das Eintreten eines Geschehens. Das unpersönliche „es“ entspricht der knappen griechischen Form, die kein ausdrückliches „diese Dinge“ enthält.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: aber das Ende ist noch nicht da
  rationale: Die Formulierung gibt den eschatologischen Ausdruck knapp und verständlich wieder, ohne näher festzulegen, worin „das Ende“ besteht.
theological_decisions:
- issue: Eschatologische Bedeutung von τὸ τέλος
  choice: das Ende
  alternative: die Vollendung / das endgültige Ende
  rationale: Der allgemeine Ausdruck des Griechischen bleibt erhalten und wird nicht auf ein bestimmtes endzeitliches Lehrschema eingeengt.
- issue: Notwendigkeit in δεῖ γενέσθαι
  choice: es muss geschehen
  alternative: all das muss geschehen
  rationale: Die Notwendigkeit wird klar ausgesagt, ohne ein im griechischen Text nicht ausdrücklich vorhandenes Demonstrativpronomen einzufügen oder die Ursache dieser Notwendigkeit dogmatisch zu erklären.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, eindringlichem Ton. Der traditionelle Ausdruck „das Ende“ bleibt erhalten; konfessionell geprägte Deutungen werden vermieden.
