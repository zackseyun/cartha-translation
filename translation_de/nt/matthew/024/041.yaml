  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: de
  text: Zwei Frauen werden an der Mühle mahlen[a]; die eine wird mitgenommen und die andere zurückgelassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zwei Frauen mahlen an der Mühle“; das griechische Partizip steht im Femininum Plural und bezeichnet die beiden Personen ausdrücklich als Frauen. „Mühle“ kann hier auch genauer den Mahlstein oder die Handmühle meinen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen heißt es lediglich, dass die eine mitgenommen und die andere zurückgelassen wird. Ob das Mitnehmen hier Rettung oder Gericht bedeutet, wird in diesem Vers nicht ausdrücklich gesagt.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Zwei Frauen werden … mahlen
  rationale: Das substantivierte Partizip ἀλήθουσαι ist feminin Plural und bezeichnet daher ausdrücklich zwei Frauen. Die futurische Verlaufsform ergibt sich im Deutschen natürlich aus dem eschatologischen Kontext, obwohl das griechische Partizip präsentisch ist.
- source_word: ἐν τῷ μύλῳ
  choice: an der Mühle
  rationale: μύλος kann die Mühle oder den Mahlstein bezeichnen. „An der Mühle“ ist idiomatisch, lässt die genaue Art des Mahlgeräts offen und passt zur dargestellten Arbeit.
- source_word: μία … καὶ μία
  choice: die eine … und die andere
  rationale: Die distributive Gegenüberstellung wird im Deutschen durch „die eine … und die andere“ klar und natürlich wiedergegeben.
- source_word: παραλαμβάνεται
  choice: wird mitgenommen
  rationale: παραλαμβάνω kann hier „mitnehmen“ oder „zu sich nehmen“ bedeuten. „Wird mitgenommen“ bildet den Vorgang knapp ab, ohne sein Ziel oder seine heilsgeschichtliche Bedeutung festzulegen.
- source_word: ἀφίεται
  choice: wird zurückgelassen
  rationale: ἀφίημι bedeutet in dieser Gegenüberstellung „lassen/zurücklassen“. „Wird zurückgelassen“ macht den Gegensatz zu „mitgenommen“ deutlich, ohne „verlassen“ oder „preisgegeben“ hineinzulesen.
theological_decisions:
- issue: Heil oder Gericht beim Mitgenommen- und Zurückgelassenwerden
  choice: Die neutrale Gegenüberstellung „wird mitgenommen“ / „wird zurückgelassen“ bleibt bestehen.
  alternative: Das Mitnehmen ausdrücklich als Rettung oder Gericht und das Zurücklassen jeweils gegenteilig deuten.
  rationale: Der Vers selbst nennt weder Ziel noch Bedeutung der beiden Vorgänge. Die Übersetzung bewahrt deshalb die echte eschatologische Deutungsspannung.
- issue: Geschlecht der mahlenden Personen
  choice: „Frauen“ wird ausdrücklich genannt.
  alternative: „Zwei werden … mahlen“.
  rationale: Die feminine Pluralform ἀλήθουσαι identifiziert die beiden Personen grammatisch als weiblich; dies soll in der deutschen Übersetzung sichtbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „An der Mühle mahlen“ bewahrt die Alltagsszene; „mitgenommen“ und „zurückgelassen“ sind verständlich und vermeiden eine konfessionell vorentschiedene Auslegung.
