  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: de
  text: und wird ihn in zwei Teile schneiden[a] und ihm seinen Anteil bei den Heuchlern zuweisen[b]. Dort wird Weinen und Zähneknirschen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „wird ihn hart bestrafen“. Das griechische Verb bedeutet wörtlich „in zwei Teile schneiden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wird ihm seinen Anteil bei den Heuchlern zuweisen“. Gemeint sein kann auch sein Los oder sein zugewiesener Platz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: wird ihn entzweihauen
  rationale: Das Verb bezeichnet seinem konkreten Wortsinn nach das Zerteilen in zwei Teile. „Entzweihauen“ bewahrt das drastische Bild, ohne es vorschnell zur allgemeinen Aussage „hart bestrafen“ abzuschwächen.
- source_word: μέρος
  choice: Anteil
  rationale: „Anteil“ entspricht dem Grundsinn von μέρος und lässt offen, ob vor allem Los, Schicksal oder zugewiesener Platz gemeint ist.
- source_word: ὑποκριτῶν
  choice: Heuchlern
  rationale: „Heuchler“ ist die geläufige und im Matthäusevangelium thematisch passende Entsprechung für ὑποκριταί.
- source_word: ἐκεῖ
  choice: Dort
  rationale: „Dort“ nimmt knapp und natürlich auf den soeben zugewiesenen Bereich beziehungsweise das Los Bezug.
- source_word: κλαυθμὸς
  choice: Weinen
  rationale: „Weinen“ ist die natürliche deutsche Wiedergabe und wahrt die wiederkehrende matthäische Wendung.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: Zähneknirschen
  rationale: „Zähneknirschen“ ist die etablierte, bildkräftige deutsche Entsprechung der festen Wendung.
theological_decisions:
- issue: Ob διχοτομήσει als bildhafte Aussage allgemein mit schwerer Bestrafung wiederzugeben ist
  choice: Das konkrete Bild „wird ihn entzweihauen“ im Haupttext beibehalten
  alternative: „wird ihn hart bestrafen“
  rationale: Der konkrete Wortsinn und die Härte der Warnung sollen erhalten bleiben. Eine Fußnote nennt die mögliche sinngemäße Deutung, ohne sie im Haupttext festzuschreiben.
- issue: Wie τὸ μέρος αὐτοῦ ... θήσει auszudrücken ist
  choice: „ihm seinen Anteil bei den Heuchlern zuweisen“
  alternative: „ihm seinen Platz bei den Heuchlern zuweisen“
  rationale: „Anteil“ liegt näher am griechischen μέρος und bewahrt die Mehrdeutigkeit zwischen Anteil, Los und zugewiesenem Platz; „zuweisen“ gibt den richterlichen Vorgang natürlich wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Bildsprache des griechischen Textes bleibt erhalten; die ungewöhnliche Formulierung wird durch eine Fußnote erläutert. „Anteil“ wahrt die lexikalische und theologische Offenheit von μέρος.
