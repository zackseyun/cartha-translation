source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: de
  text: Denn ein Volk wird sich gegen das andere erheben und ein Königreich gegen das andere. Und es wird Hungersnöte und Erdbeben an verschiedenen Orten[a] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Ort zu Ort“. Die griechische Wendung bezeichnet eine Verteilung auf mehrere Orte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: wird sich erheben
  rationale: Die futurische Passiv-/Mediumform steht hier in einer feindseligen Wendung und bezeichnet das Aufstehen beziehungsweise Losschlagen gegen einen Gegner. Das reflexive deutsche Verb ist natürlich und führt keine ausdrückliche göttliche Verursachung ein.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage und wird im Deutschen angemessen mit „Denn“ wiedergegeben.
- source_word: ἔθνος
  choice: Volk
  rationale: ἔθνος bezeichnet hier eine größere ethnisch-politische Gemeinschaft. „Volk“ bewahrt diese Bedeutungsbreite besser als das modern staatsrechtlich enger klingende „Nation“ und steht zugleich parallel zu „Königreich“.
- source_word: ἐπὶ ἔθνος
  choice: gegen das andere
  rationale: ἐπί mit Akkusativ bezeichnet in dieser Wendung die feindliche Ausrichtung. Die paarige Form „ein Volk … gegen das andere“ gibt das griechische ἔθνος ἐπὶ ἔθνος idiomatisch wieder.
- source_word: βασιλεία
  choice: Königreich
  rationale: Gemeint ist hier im Parallelismus zu „Volk“ ein politischer Herrschaftsbereich, nicht abstrakt die Ausübung königlicher Herrschaft.
- source_word: ἔσονται
  choice: es wird … geben
  rationale: Der existentielle Gebrauch von εἰμί wird im modernen Deutschen natürlich mit „es wird … geben“ ausgedrückt.
- source_word: λιμοὶ
  choice: Hungersnöte
  rationale: Der Plural bezeichnet schwere, regional oder zeitlich auftretende Nahrungsmittelknappheiten; „Hungersnöte“ ist die präzise und geläufige Entsprechung.
- source_word: σεισμοὶ
  choice: Erdbeben
  rationale: σεισμός bezeichnet in diesem Zusammenhang eindeutig ein Erdbeben.
- source_word: κατὰ τόπους
  choice: an verschiedenen Orten
  rationale: Die distributive Wendung bezeichnet ein Auftreten an mehreren Orten. Die Übersetzung ist natürlich und bewahrt diese Verteilung, ohne eine bestimmte Abfolge zu behaupten.
theological_decisions:
- issue: Bedeutungsumfang von ἔθνος in der endzeitlichen Konfliktaussage
  choice: Volk
  alternative: Nation
  rationale: „Volk“ umfasst die ethnisch-politische Bedeutung des griechischen Ausdrucks und vermeidet eine Beschränkung auf moderne Nationalstaaten. Der Parallelismus mit „Königreich“ hält dennoch die politische Dimension fest.
- issue: Bedeutung der futurischen Passiv-/Mediumform ἐγερθήσεται
  choice: wird sich gegen … erheben
  alternative: wird gegen … aufgeboten werden
  rationale: Die Wendung beschreibt den Ausbruch von Feindschaft. Die gewählte Fassung behauptet keine im Satz nicht ausdrücklich genannte göttliche oder andere äußere Verursachung.
- issue: Verhältnis der genannten Ereignisse zur vorhergehenden Aussage
  choice: Denn
  alternative: Weil
  rationale: „Denn“ erhält den erklärenden Zusammenhang, ohne das Verhältnis als engeren Kausalsatz zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der traditionelle Begriff „Königreich“ erhält den politischen und endzeitlichen Ton; Satzbau und Wortwahl bleiben zugleich allgemein verständlich. Der Fußnotenmarker [a] steht unmittelbar nach der Aussage, auf die er sich bezieht.
