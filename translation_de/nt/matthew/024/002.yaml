base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: de
  text: 'Er aber antwortete ihnen: „Seht ihr das alles nicht? Amen, ich sage euch: Hier wird kein Stein auf dem anderen bleiben, der nicht niedergerissen wird.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „abgebrochen wird“. Das griechische Verb kann das Niederreißen oder Zerlegen eines Bauwerks bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Er aber antwortete ihnen
  rationale: Die im Griechischen semitisch geprägte Verbindung aus Partizip und finitem Verb wird im modernen Deutschen idiomatisch mit einem einzigen Redeverb wiedergegeben; δέ bleibt durch „aber“ erkennbar.
- source_word: Οὐ βλέπετε ταῦτα πάντα
  choice: Seht ihr das alles nicht?
  rationale: Die rhetorische Frage erwartet Zustimmung. „Das alles“ verweist natürlich und deutlich auf die zuvor genannten Tempelbauten.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: „Amen“ bewahrt die charakteristische feierliche Einleitungsformel Jesu und ist im Deutschen verständlich und etabliert.
- source_word: οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον
  choice: Hier wird kein Stein auf dem anderen bleiben
  rationale: Die starke Verneinung οὐ μή wird durch „kein Stein“ klar und nachdrücklich ausgedrückt; „hier“ bewahrt den Ortsbezug, und die geläufige deutsche Wendung gibt das Bild präzise wieder.
- source_word: ὃς οὐ καταλυθήσεται
  choice: jeder wird niedergerissen werden
  rationale: Das Relativpronomen bezieht sich auf „Stein“. „Jeder“ verhindert im Deutschen eine missverständliche doppelte Verneinung und bewahrt die Aussage vollständiger Demontage; „niedergerissen“ gibt den baulichen Kontext von καταλύω anschaulich wieder.
theological_decisions:
- issue: Reichweite und Aussagekraft der Vorhersage über den Tempel
  choice: Die Aussage wird als konkrete Ankündigung vollständiger baulicher Zerstörung wiedergegeben.
  alternative: Eine primär symbolische Deutung oder die ausdrückliche Einordnung in ein bestimmtes endzeitliches System.
  rationale: Das Bild von übereinanderliegenden und niedergerissenen Steinen ist konkret architektonisch. Die Übersetzung wahrt diese Aussage, ohne über den Vers hinaus ein eschatologisches Modell festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Formel „Amen, ich sage euch“ bleibt bewusst erhalten. Das Semikolon macht die enge Erläuterungsbeziehung zwischen dem Steinspruch und dem Niederreißen deutlich.
