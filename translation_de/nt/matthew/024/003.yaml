id: MAT.24.3
reference: Matthew 24:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: de
  text: 'Als er auf dem Ölberg saß, kamen die Jünger allein zu ihm und sagten: »Sag uns: Wann wird das geschehen, und was wird das Zeichen deiner Ankunft[a] und der Vollendung des Zeitalters[b] sein?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deines Kommens« beziehungsweise »deiner Gegenwart«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »des Endes des Zeitalters«; traditionell: »des Endes der Welt«.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Als er … saß
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Begleitumstand. Die Formulierung gibt den andauernden Vorgang natürlich und knapp wieder; δέ dient hier dem Erzählfortgang und muss nicht eigens übersetzt werden.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: auf dem Ölberg
  rationale: „Ölberg“ ist die etablierte deutsche Bezeichnung des Ortes und entspricht idiomatisch dem wörtlichen „Berg der Oliven(bäume)“.
- source_word: προσῆλθον αὐτῷ
  choice: kamen … zu ihm
  rationale: Gibt die Bewegung auf Jesus zu im erzählenden Kontext natürlich wieder.
- source_word: οἱ μαθηταὶ κατ’ ἰδίαν
  choice: die Jünger allein
  rationale: κατ’ ἰδίαν bezeichnet eine von anderen abgesonderte, nicht öffentliche Begegnung. „Allein“ ist verständlich und vermeidet das im Deutschen sachlich klingende „privat“.
- source_word: λέγοντες· Εἰπὸν ἡμῖν
  choice: 'und sagten: »Sag uns«'
  rationale: Das Partizip wird als beigeordnete Erzählhandlung wiedergegeben; der Aoristimperativ wird idiomatisch als direkte Aufforderung übersetzt.
- source_word: πότε ταῦτα ἔσται
  choice: Wann wird das geschehen
  rationale: Im Deutschen gibt „geschehen“ das zukünftige Eintreten der zuvor genannten Dinge natürlicher wieder als das strukturell wörtliche „wann wird dies sein“.
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ ist die klare und kontextuell etablierte Entsprechung für σημεῖον.
- source_word: παρουσίας
  choice: Ankunft
  rationale: παρουσία kann Anwesenheit, Gegenwart oder das Eintreffen bezeichnen. „Ankunft“ bewahrt den zukunftsgerichteten Sinn der Frage, ohne bereits die stärker auslegende kirchliche Bezeichnung „Wiederkunft“ in den Haupttext einzutragen.
- source_word: συντελείας
  choice: Vollendung
  rationale: „Vollendung“ bildet den Gedanken des Abschlusses beziehungsweise Zu-Ende-Kommens ab und lässt die im Begriff liegende Zielgerichtetheit erkennen; die geläufigere Alternative „Ende“ wird in der Fußnote genannt.
- source_word: τοῦ αἰῶνος
  choice: des Zeitalters
  rationale: αἰών bezeichnet hier ein Zeitalter oder eine Weltzeit, nicht ausdrücklich die physische Welt. „Zeitalter“ bewahrt diese Unterscheidung.
theological_decisions:
- issue: Bedeutung von παρουσία im endzeitlichen Zusammenhang
  choice: Ankunft
  alternative: Kommen; Gegenwart; Wiederkunft
  rationale: Der Kontext blickt auf ein zukünftiges Eintreffen Jesu. „Ankunft“ wahrt diese Ausrichtung und zugleich das lexikalische Spektrum, ohne durch „Wiederkunft“ eine theologische Präzisierung in den Wortlaut einzubauen.
- issue: Bedeutung von συντελείας τοῦ αἰῶνος
  choice: Vollendung des Zeitalters
  alternative: Ende des Zeitalters; Ende der Welt
  rationale: Der griechische Ausdruck spricht vom Abschluss einer Weltzeit und nicht ausdrücklich von der Vernichtung der physischen Welt. Die Übersetzung bewahrt diese Spannung; die traditionellen beziehungsweise geläufigeren Wiedergaben stehen in der Fußnote.
- issue: Bezug von σημεῖον auf die beiden Genitive
  choice: ein Zeichen für die Ankunft und die Vollendung
  alternative: je ein gesondertes Zeichen für beide Ereignisse
  rationale: Im Griechischen steht σημεῖον im Singular und wird von den koordinierten Genitiven παρουσία und συντέλεια näher bestimmt. Die deutsche Struktur lässt wie der Ausgangstext offen, wie eng beide Größen zeitlich und sachlich zusammengehören.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Satzführung. „Ölberg“ folgt dem etablierten Ortsnamen. Die Anrede bleibt im Singular, da Jesus angesprochen wird. Die Fußnotenmarker stehen unmittelbar bei den auslegungsrelevanten Ausdrücken.
