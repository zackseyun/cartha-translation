id: MAT.24.10
reference: Matthew 24:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: de
  text: Und dann werden viele zu Fall kommen[a] und einander ausliefern[b] und einander hassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden abfallen“, „werden zum Straucheln gebracht“ oder „werden Anstoß nehmen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einander verraten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: dann
  rationale: Das temporale Adverb bezeichnet die nächste Entwicklung innerhalb der Rede Jesu; „dann“ ist direkt und im modernen Deutsch natürlich.
- source_word: σκανδαλισθήσονται
  choice: werden zu Fall kommen
  rationale: Die Wendung bewahrt sowohl den ernsten Gedanken des Abfalls unter Verfolgungsdruck als auch die Bildlichkeit des griechischen Verbs, ohne ausdrücklich „vom Glauben“ zu ergänzen und damit die Deutung enger festzulegen als der Ausgangstext.
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv wird knapp und unmittelbar wiedergegeben.
- source_word: ἀλλήλους
  choice: einander
  rationale: Das reziproke Pronomen bezeichnet wechselseitiges Handeln; „einander“ gibt dies klar und idiomatisch wieder.
- source_word: παραδώσουσιν
  choice: werden einander ausliefern
  rationale: „Ausliefern“ bewahrt die konkrete Bedeutung von παραδίδωμι und passt zum Zusammenhang von Verfolgung; zugleich lässt es den darin liegenden Verrat erkennen, ohne ihn zum alleinigen Wortsinn zu machen.
- source_word: μισήσουσιν
  choice: werden einander hassen
  rationale: Die aktive Feindschaft des Verbs μισέω wird unmittelbar und natürlich wiedergegeben.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: Und dann ... und ... und ...
  rationale: Die wiederholte Verbindung mit „und“ erhält den kumulativen, sich steigernden Rhythmus des griechischen Satzes und bindet den Vers an den vorherigen Zusammenhang an.
theological_decisions:
- issue: Bedeutung von σκανδαλισθήσονται im Zusammenhang endzeitlicher Verfolgung
  choice: werden zu Fall kommen
  alternative: werden abfallen; werden zum Straucheln gebracht; werden Anstoß nehmen
  rationale: Der Zusammenhang deutet auf ein ernstes Versagen oder Abfallen hin, das zu gegenseitigem Ausliefern und Hass führt. „Zu Fall kommen“ wahrt diese Schwere, lässt aber die Spannweite des griechischen Ausdrucks bestehen und legt keine bestimmte Lehre über Abfall vom Glauben fest.
- issue: Bedeutung von παραδώσουσιν im zwischenmenschlichen Verfolgungskontext
  choice: werden einander ausliefern
  alternative: werden einander verraten
  rationale: Die konkrete Handlung des Übergebens beziehungsweise Auslieferns steht im Vordergrund. „Verraten“ beschreibt zutreffend den treulosen Charakter, ist jedoch stärker deutend; die Hauptfassung hält sich deshalb näher an die griechische Formulierung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die dreifache Verbindung durch „und“ bewahrt den eindringlichen Rhythmus. „Zu Fall kommen“ hält die semantische und theologische Offenheit des griechischen Passivs aufrecht; „ausliefern“ bleibt konkret und quellennah.
