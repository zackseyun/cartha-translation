  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: de
  text: Wer auf dem Dach[a] ist, soll nicht hinabsteigen, um die Dinge aus seinem Haus zu holen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die flache, begehbare Dachfläche eines damaligen Hauses.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Wer auf dem Dach ist
  rationale: Die substantivierte Wendung bezeichnet allgemein die Person, die sich auf dem Dach befindet. Die deutsche Wer-Konstruktion gibt den repräsentativen Singular natürlich wieder.
- source_word: δώματος
  choice: Dach
  rationale: δώμα bezeichnet hier die flache, begehbare Dachfläche eines Hauses. „Dach“ ist im modernen Deutschen klar und natürlich; die kulturgeschichtliche Besonderheit wird in der Fußnote erläutert.
- source_word: μὴ καταβάτω
  choice: soll nicht hinabsteigen
  rationale: Der verneinte Imperativ formuliert eine dringliche Anweisung. „Hinabsteigen“ bewahrt die räumliche Bewegung vom Dach nach unten.
- source_word: ἆραι
  choice: zu holen
  rationale: 'Der Infinitiv bezeichnet den Zweck des Hinabsteigens: Gegenstände aus dem Haus an sich zu nehmen. „Holen“ drückt dies im Deutschen idiomatisch aus.'
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: die Sachen aus seinem Haus
  rationale: Das substantivierte Neutrum Plural bezeichnet nicht näher bestimmte Gegenstände oder Besitztümer. „Die Sachen“ wahrt diese Unbestimmtheit besser als das deutlicher deutende „Hab und Gut“.
- source_word: οἰκίας
  choice: Haus
  rationale: Der Zusammenhang meint das konkrete Gebäude, aus dem etwas geholt werden könnte; daher ist „Haus“ genauer als das stärker persönliche „Zuhause“.
- source_word: αὐτοῦ
  choice: seinem
  rationale: Das maskuline Singularpronomen wird passend zur repräsentativen Wer-Konstruktion als „seinem“ wiedergegeben.
theological_decisions:
- issue: Repräsentativer maskuliner Singular
  choice: „Wer … seinem Haus“
  alternative: „Wer … aus dem eigenen Haus“ oder eine Pluralform
  rationale: Die Konstruktion bezieht sich allgemein auf jede betroffene Person, steht im Griechischen jedoch im Singular mit maskulinem Pronomen. Die deutsche Wer-Konstruktion mit „seinem“ erhält sowohl den Singular als auch den allgemeinen Bezug, ohne eine Aussage über eine ausschließlich männliche Personengruppe zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dringlichem, aber nicht unnötig verschärftem Anweisungston. „Hinabsteigen“ hält das räumliche Bild fest; „die Sachen“ bleibt bewusst unspezifisch.
