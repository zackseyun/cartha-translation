  source_fidelity: Der Text gibt τότε, die futurische Aussage, die Ortsangabe und den knappen Kontrast von παραλαμβάνεται und ἀφίεται zuverlässig wieder. »Zwei Männer« ist im Kontext des anschließenden ausdrücklich weiblichen Parallelbildes (V. 41) eine vertretbare Verdeutlichung der maskulinen Formen, ohne den Sinn zu verändern. »Mitgenommen« und »zurückgelassen« bewahren die im griechischen Wortlaut nicht abschließend geklärte Richtung bzw. Wertung des Geschehens.
  naturalness: Die Formulierung ist modernes, idiomatisches Standarddeutsch. »Dann werden zwei Männer auf dem Feld sein; der eine wird mitgenommen, der andere zurückgelassen« ist klar, würdig und bewahrt die prägnante Parallelstruktur.
