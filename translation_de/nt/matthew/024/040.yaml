  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: de
  text: Dann werden zwei Männer auf dem Feld sein; der eine wird mitgenommen[a], der andere zurückgelassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zu sich genommen. Das Verb legt für sich allein nicht fest, ob das Mitnehmen der Rettung oder dem Gericht dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das temporale Adverb verknüpft die Aussage knapp und natürlich mit dem vorausgehenden endzeitlichen Zusammenhang.
- source_word: δύο ἔσονται
  choice: werden zwei Männer … sein
  rationale: Das Griechische nennt zwar ausdrücklich nur »zwei«, doch die maskulinen Formen εἷς … εἷς und das weibliche Parallelbeispiel im folgenden Vers weisen hier auf zwei Männer. Die Ergänzung macht diese Unterscheidung im Deutschen sichtbar.
- source_word: ἐν τῷ ἀγρῷ
  choice: auf dem Feld
  rationale: Dies ist die übliche und direkte deutsche Wiedergabe der Ortsangabe.
- source_word: εἷς … εἷς
  choice: der eine … der andere
  rationale: Die idiomatische deutsche Gegenüberstellung gibt den knappen Kontrast der wiederholten griechischen Zahlwörter wieder.
- source_word: παραλαμβάνεται
  choice: wird mitgenommen
  rationale: Das Präsens schildert im futurischen Zusammenhang das Geschehen anschaulich. »Mitgenommen« gibt den Vorgang wieder, ohne für sich allein festzulegen, ob er Rettung oder Gericht bedeutet.
- source_word: ἀφίεται
  choice: wird zurückgelassen
  rationale: Im Kontrast zu παραλαμβάνεται bezeichnet das Verb hier, dass der andere am Ort verbleibt. »Zurückgelassen« ist im Deutschen klarer als das mehrdeutige »gelassen«, ohne »verlassen« oder »preisgegeben« zu unterstellen.
theological_decisions:
- issue: Ob παραλαμβάνεται eine Wegnahme zur Rettung oder zum Gericht bezeichnet
  choice: Die neutrale Formulierung »wird mitgenommen« bleibt im Haupttext erhalten.
  alternative: Deutende Wiedergaben wie »wird gerettet« oder »wird zum Gericht weggenommen«
  rationale: Wortlaut und Zusammenhang lassen die genaue Bedeutung der Wegnahme diskutierbar. Die Übersetzung soll keine bestimmte endzeitliche Deutung in den Text eintragen.
- issue: Ob die männlichen Bezugspersonen ausdrücklich genannt werden
  choice: »zwei Männer«
  alternative: »zwei« beziehungsweise »zwei Menschen«
  rationale: Die maskulinen Formen und das ausdrücklich weibliche Parallelbild im folgenden Vers sprechen für eine männliche Szene. »Menschen« würde diese textliche Unterscheidung verwischen.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Der parallele Satzbau bewahrt die pointierte Gegenüberstellung; die Fußnote hält die lexikalische und theologische Mehrdeutigkeit offen.
