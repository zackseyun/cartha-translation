  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: de
  text: Und sie merkten nichts, bis die Flut kam und sie alle fortnahm. So wird es auch bei der Ankunft des Menschensohnes sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: sie erkannten es nicht
  rationale: Gibt das Verb γινώσκω sachlich wieder und bewahrt die mögliche Spannung zwischen fehlender Erkenntnis und fehlendem Begreifen, ohne ausdrücklich Unwissenheit oder Achtlosigkeit einzutragen.
- source_word: ὁ κατακλυσμός
  choice: die Flut
  rationale: Natürliche, kontextgerechte Bezeichnung für die Sintflut; der bestimmte Artikel und der vorhergehende Kontext identifizieren das Ereignis.
- source_word: ἦρεν ἅπαντας
  choice: sie alle fortnahm
  rationale: Bewahrt die Grundbedeutung von αἴρω als Wegnehmen beziehungsweise Fortnehmen und lässt zugleich im Zusammenhang mit der Flut deren gewaltsame Wirkung erkennen, ohne das Bild stärker auszumalen als der griechische Text.
- source_word: παρουσία
  choice: Ankunft
  rationale: Gibt das Substantiv als Ankunft beziehungsweise Eintreffen wieder und vermeidet eine unnötige konfessionelle Spezialformulierung.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: des Menschensohnes
  rationale: Die im Deutschen etablierte, zugleich formal nahe Wiedergabe dieses christologischen Titels.
theological_decisions:
- issue: Bedeutung von οὐκ ἔγνωσαν
  choice: sie erkannten es nicht
  alternative: sie merkten nichts / sie wussten es nicht
  rationale: Die gewählte Fassung legt nicht fest, ob mangelndes Wissen, fehlende Einsicht oder Nichtbegreifen gemeint ist, und bewahrt damit die semantische Offenheit des griechischen Ausdrucks.
- issue: Wiedergabe von παρουσία
  choice: Ankunft
  alternative: Kommen / Wiederkunft
  rationale: „Ankunft“ entspricht dem griechischen Ausdruck, während „Wiederkunft“ das im Vers nicht ausdrücklich vorhandene Element „wieder“ ergänzen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Die Formulierung bleibt eng am griechischen Text, ohne unnatürlich zu wirken; es sind keine Fußnoten erforderlich.
