  - severity: low
    issue: Unnatürliche Vergleichskonstruktion
    rationale: „So wird auch die Ankunft des Menschensohnes sein“ ist verständlich, aber „So wird es auch bei der Ankunft des Menschensohnes sein“ gibt die elliptische griechische Konstruktion idiomatischer wieder.
