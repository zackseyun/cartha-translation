review_pass:
  verdict: revise
  source_fidelity: Die Fassung trifft den zeitlichen Ablauf und die Aussage des griechischen Textes grundsätzlich. „Sie erkannten es nicht“ fügt jedoch ein im Griechischen nicht ausgedrücktes, im Deutschen zudem unklar bezogenes „es“ ein. Die objektlose Formulierung „sie merkten nichts“ gibt οὐκ ἔγνωσαν im Kontext idiomatisch wieder, ohne genauer festzulegen, was ihnen verborgen blieb. „Fortnahm“ ist für ἦρεν vertretbar; die Flut als handelndes Subjekt lässt die tödliche Konsequenz im Kontext erkennen.
  naturalness: „Sie erkannten es nicht“ klingt im modernen Deutsch ohne eindeutigen Bezug sperrig. „Und sie merkten nichts“ ist flüssig und kontextuell klar. Die Umschreibung „So wird es auch bei der Ankunft des Menschensohnes sein“ ist eine natürliche deutsche Wiedergabe der griechischen Vergleichskonstruktion.
  terminology: „Flut“, „Ankunft“ und „Menschensohn“ sind sachgerecht. „Ankunft“ vermeidet die nicht im Wortlaut enthaltene Festlegung auf „Wiederkunft“. Es sind keine Fußnoten erforderlich.
