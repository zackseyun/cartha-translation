source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: de
  text: 'Wenn aber jener böse Diener[a] in seinem Herzen sagt: »Mein Herr[b] bleibt lange aus«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklave“. Das griechische Wort doulos kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kyrios kann „Herr“ oder im Haushaltszusammenhang „Hausherr“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Wenn aber
  rationale: ἐὰν mit dem Aorist Konjunktiv eröffnet einen Bedingungsfall; δέ wird durch „aber“ als leichter Gegensatz beziehungsweise Fortgang wiedergegeben.
- source_word: εἴπῃ
  choice: sagt
  rationale: Im deutschen Konditionalsatz gibt das Präsens den griechischen Aorist Konjunktiv natürlich und ohne unnötige Modalisierung wieder.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: jener böse Knecht
  rationale: „Böse“ bezeichnet die moralische Qualität; „Knecht“ passt zur Haushaltswelt des Gleichnisses und bewahrt das Abhängigkeitsverhältnis. „Jener“ erhält die demonstrative Hervorhebung von ἐκεῖνος.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: in seinem Herzen
  rationale: Die Formulierung bewahrt das biblische Bild für inneres Denken und bleibt im modernen Deutsch verständlich.
- source_word: Χρονίζει
  choice: bleibt lange aus
  rationale: Die Wendung gibt die als andauernd wahrgenommene Verzögerung idiomatisch wieder und passt zur erwarteten Rückkehr des Herrn.
- source_word: μου ὁ κύριος
  choice: mein Herr
  rationale: „Herr“ bezeichnet im unmittelbaren Gleichniskontext den Hausherrn, bewahrt im Deutschen aber zugleich die mögliche weiterführende Resonanz von κύριος.
theological_decisions:
- issue: Wiedergabe von κύριος im Gleichnis und seine mögliche weiterführende Bedeutung
  choice: Herr
  alternative: Gebieter; Hausherr
  rationale: „Herr“ ist im Haushaltsverhältnis natürlich und lässt zugleich die im größeren Redekontext mögliche Beziehung auf den kommenden Herrn offen, ohne sie ausdrücklich festzulegen.
- issue: Wiedergabe von δοῦλος
  choice: Knecht
  alternative: Sklave; Diener
  rationale: „Knecht“ bringt die abhängige Stellung und die anvertraute Aufgabe in der Gleichnisszene zusammen. Da δοῦλος auch ausdrücklich den Status eines Sklaven bezeichnen kann, wird diese Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In seinem Herzen“ bewahrt bewusst die Bildsprache des Ausgangstextes; „bleibt lange aus“ ist idiomatisch und erhält den Gedanken einer anhaltenden Verzögerung.
