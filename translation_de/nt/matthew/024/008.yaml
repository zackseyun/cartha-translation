  text: πάντα δὲ ταῦτα ἀρχὴ ὠδίνων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: de
  text: Doch dies alles ist der Anfang der Geburtswehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wehen“. Das griechische Wort bezeichnet die Schmerzen einer Geburt und dient hier als Bild für den Anfang bevorstehender Not.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Doch dies alles
  rationale: Die Wendung verweist zusammenfassend auf die zuvor genannten Ereignisse. „Doch“ gibt den leichten Gegensatz beziehungsweise die überleitende Einordnung durch δέ natürlich wieder.
- source_word: ἀρχὴ
  choice: erst der Anfang
  rationale: „Anfang“ bewahrt die Aussage vom Beginn einer Entwicklung. Das idiomatisch ergänzte „erst“ verdeutlicht den im Kontext liegenden Gegensatz zum Ende, ohne den Anfang näher zu bestimmen.
- source_word: ὠδίνων
  choice: Geburtswehen
  rationale: Das Wort bezeichnet Wehen beziehungsweise Schmerzen der Geburt. „Geburtswehen“ ist im modernen Deutschen verständlich und erhält das Bild des griechischen Textes.
theological_decisions:
- issue: Bildhafte Bedeutung von ὠδίνων
  choice: Das Bild der Geburt bleibt mit „Geburtswehen“ erhalten.
  alternative: „Leiden“, „Nöte“ oder „Wehen“
  rationale: Der griechische Text deutet die zuvor genannten Erschütterungen als Anfang eines schmerzhaften Geschehens, ohne hier dessen weiteren Ablauf lehrmäßig festzulegen. Eine Verallgemeinerung zu „Leiden“ würde das Geburtsbild einebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dies alles“ klingt in der zusammenfassenden Rückschau natürlicher als „alle diese Dinge“; „Geburtswehen“ bewahrt das anschauliche Bild.
