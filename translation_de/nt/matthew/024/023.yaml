  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: de
  text: 'Wenn euch dann jemand sagt: »Seht, hier ist der Messias!« oder: »Hier ist er!«, glaubt es nicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: dann
  rationale: Das temporale Adverb knüpft die Warnung an den vorausgehenden endzeitlichen Zusammenhang an; »dann« ist knapp und natürlich.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: wenn jemand zu euch sagt
  rationale: Die offene Bedingung mit unbestimmtem Subjekt wird im Deutschen idiomatisch mit »wenn jemand« wiedergegeben.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Der aufmerksamkeitslenkende Ausruf wird modern und würdig mit »Seht« wiedergegeben; »Siehe« klänge heute stärker traditionssprachlich.
- source_word: ὧδε
  choice: hier
  rationale: Das Ortsadverb bezeichnet unmittelbar den angegebenen Ort; »hier« ist die natürliche deutsche Entsprechung.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Artikel und Identifikationsaussage zeigen, dass Χριστός hier als Titel des erwarteten Gesalbten gebraucht wird, nicht wie ein Eigenname.
- source_word: ἤ· Ὧδε
  choice: 'oder: »Dort ist er!«'
  rationale: Das Griechische ist elliptisch und wiederholt nur das Ortsadverb. Die deutsche Ergänzung von Subjekt und Verb macht die gemeinte Behauptung verständlich; »dort« bildet in dieser deiktischen Meldung eine natürliche Alternative zum ersten »hier«.
- source_word: μὴ πιστεύσητε
  choice: dann glaubt es nicht
  rationale: Die Verneinung mit Aorist Konjunktiv hat verbietende Kraft. »Es« bezieht sich auf die jeweilige Behauptung und ergänzt im Deutschen das notwendige Objekt, ohne eine Person als Objekt einzutragen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus / der Christus
  rationale: Im Kontext geht es um die behauptete Identität und den Aufenthaltsort des erwarteten Gesalbten. »Messias« bewahrt diese Titelfunktion klar; »Christus« könnte im heutigen Deutschen stärker wie ein Name verstanden werden.
- issue: Bezugsgröße des Glaubensverbots
  choice: glaubt es nicht
  alternative: glaubt ihm nicht / glaubt nicht
  rationale: Der griechische Text nennt kein ausdrückliches Objekt. »Es« bezieht das Verbot plausibel auf die gemeldete Behauptung, ohne den Sprecher oder den angeblichen Messias als Objekt festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt lebendig; die Ellipse des zweiten Zurufs wird für natürliche deutsche Lesbarkeit maßvoll ergänzt.
