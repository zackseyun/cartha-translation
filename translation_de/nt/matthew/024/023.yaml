  source_fidelity: 'Eine sichere Korrektur ist nötig: Das zweite ὧδε bedeutet ebenfalls „hier“, nicht „dort“. Die Ergänzung „ist er“ ist im Deutschen zur Auflösung der griechischen Ellipse zulässig. Die Stellung von τότε wird mit „euch dann“ natürlich und ohne das im Entwurf etwas schwerfällige doppelte „dann“ wiedergegeben.'
  naturalness: „Wenn euch dann jemand sagt ... , glaubt es nicht“ ist modernes, flüssiges Standarddeutsch. „Seht“ wahrt den aufmerksamkeitslenkenden Charakter von Ἰδού und ist in diesem Register verständlich.
  terminology: „der Messias“ gibt ὁ χριστός angemessen als Titel wieder. „Es“ als Objekt von „glaubt“ bezieht sich neutral auf die Behauptung und legt kein im Griechischen nicht genanntes personales Objekt fest.
