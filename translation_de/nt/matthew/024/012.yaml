  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: de
  text: Und weil die Gesetzlosigkeit zunehmen wird, wird die Liebe vieler erkalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „weil die Gesetzlosigkeit vermehrt wird“; auch möglich: „wegen der Zunahme der Gesetzlosigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: weil … überhandnehmen wird
  rationale: διά mit dem substantivierten Aoristinfinitiv bezeichnet hier den Grund. „Überhandnehmen“ gibt die starke Zunahme idiomatisch und mit Blick auf die Zukunft wieder, ohne die griechische Passivform im Deutschen unnatürlich nachzubilden.
- source_word: ἀνομίαν
  choice: Gesetzlosigkeit
  rationale: ἀνομία bezeichnet die Missachtung oder Übertretung des Gesetzes, besonders des göttlichen Gesetzes. „Gesetzlosigkeit“ ist präziser als das allgemeinere „Bosheit“ und verständlicher als das traditionellere „Frevel“.
- source_word: ψυγήσεται
  choice: wird … erkalten
  rationale: Die Zukunftsform von ψύχομαι beschreibt bildhaft das Schwinden der Liebe. „Erkalten“ bewahrt diese Metapher in natürlichem, würdigem Deutsch.
- source_word: ἀγάπη
  choice: Liebe
  rationale: „Liebe“ ist die direkte und kontextuell angemessene Wiedergabe von ἀγάπη.
- source_word: τῶν πολλῶν
  choice: vieler
  rationale: Der artikulierte Genitiv Plural bleibt hinsichtlich der bezeichneten Gruppe unbestimmt. „Vieler“ ist im Deutschen natürlich und vermeidet die statistische Überdeutung „der meisten“.
theological_decisions:
- issue: Bezugsgruppe von „die Liebe vieler“
  choice: Die Gruppe wird nicht näher bestimmt.
  alternative: die Liebe unter den Gläubigen / die Liebe in der menschlichen Gesellschaft
  rationale: τῶν πολλῶν sagt nicht ausdrücklich, ob Jünger, Menschen allgemein oder eine gemischte Gruppe gemeint sind. Die offene Formulierung bewahrt diese Auslegungsspannung.
- issue: Art der Zunahme der Gesetzlosigkeit
  choice: „überhandnehmen“ stellt die zunehmende Verbreitung in den Vordergrund.
  alternative: „vermehrt werden“ bildet die grammatische Passivform unmittelbarer ab.
  rationale: Das griechische Passiv kann ohne ausdrücklichen Urheber die Zunahme bezeichnen. Die Übersetzung benennt daher keinen Verursacher und vermeidet eine theologische Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Erkalten“ erhält die griechische Metapher; „überhandnehmen“ vermeidet eine schwerfällige deutsche Passivkonstruktion.
