source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: de
  text: Darum seid auch ihr bereit, denn der Menschensohn kommt zu einer Stunde, die ihr nicht erwartet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „zu einer Stunde, die ihr nicht denkt/meint“. Das griechische Verb kann „denken“, „meinen“ oder „annehmen“ bedeuten und meint in diesem Zusammenhang: „erwarten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Die Wendung verweist folgernd und begründend auf die vorausgehende Warnung zurück. „Darum“ gibt diesen Zusammenhang knapp und natürlich wieder.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: καί und das ausdrücklich gesetzte Pronomen betonen, dass die Angesprochenen ebenfalls einbezogen sind. „Auch ihr“ bewahrt diesen Nachdruck.
- source_word: γίνεσθε ἕτοιμοι
  choice: sollt … bereit sein
  rationale: Der Imperativ fordert zu einer anhaltenden Haltung der Bereitschaft auf. „Sollt … bereit sein“ ist im modernen Deutsch natürlich und gibt die Aufforderung klar wieder, ohne ein punktuelles „bereit werden“ nahezulegen.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt hier die Begründung der Aufforderung ein. „Denn“ verbindet beide Satzteile in einem würdigen, natürlichen deutschen Stil.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: zu einer Stunde, in der ihr nicht damit rechnet
  rationale: Die Dativkonstruktion ist temporal. δοκεῖτε bedeutet grundsätzlich „denken/meinen“ und bezeichnet im Kontext die fehlende Erwartung; „nicht damit rechnen“ gibt dies idiomatisch wieder, während die Fußnote die wörtlichere Möglichkeit bewahrt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte, formnahe Wiedergabe bewahrt den Titel, seinen semitischen Hintergrund und seine möglichen Anklänge an Daniel, ohne ihn deutend aufzulösen.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das griechische Präsens wird mit dem deutschen Präsens wiedergegeben. Im Kontext kann es zukünftigen Bezug haben, behält aber die Unmittelbarkeit der Aussage.
theological_decisions:
- issue: Wiedergabe des christologischen Titels ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: „Der Menschensohn“ bewahrt den Wortlaut und die theologische sowie mögliche Danielische Resonanz des Titels. Deutende Alternativen würden die Mehrdeutigkeit unnötig einebnen.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Ton. Die Formulierung ist gut verständlich, wahrt den ausdrücklichen Rückbezug, den Imperativ und den traditionellen christologischen Titel. Der Fußnotenmarker [a] steht im Haupttext.
