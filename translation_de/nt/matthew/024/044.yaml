    rationale: Diese Formulierung ist im Deutschen nicht verständlich und stellt die griechische elliptische Zeitangabe nicht sinnvoll dar. Eine als „etwa“ gekennzeichnete Erklärung mit „denkt“, „annehmt“ oder kontextuell „erwartet“ ist genauer.
