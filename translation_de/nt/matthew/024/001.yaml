reference: Matthew 24:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: de
  text: Als Jesus den Tempelbereich verließ und weiterging, traten seine Jünger zu ihm, um ihm die Gebäude des Tempels zu zeigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet den gesamten Tempelkomplex mit seinen Bezirken, nicht nur das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ging … hinaus
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der fortlaufenden Bewegung des Hauptverbs vorausgeht; „hinausgehen“ bewahrt die Richtungsangabe.
- source_word: ἱεροῦ
  choice: Tempelbereich
  rationale: ἱερόν bezeichnet hier den gesamten Tempelkomplex beziehungsweise seine Bezirke, nicht nur das innere Heiligtum (ναός). Im ersten Vorkommen macht „Tempelbereich“ deutlich, woraus Jesus hinausging.
- source_word: ἐπορεύετο
  choice: entfernte sich gerade
  rationale: Das Imperfekt stellt Jesu Fortgehen als im Verlauf befindlich dar. Die Formulierung gibt diesen Hintergrundcharakter im natürlichen Deutschen wieder.
- source_word: προσῆλθον
  choice: kamen … zu ihm
  rationale: προσέρχομαι bezeichnet das Herantreten beziehungsweise Hinzukommen; die gewählte Formulierung ist idiomatisch und wahrt die Bewegung auf Jesus zu.
- source_word: ἐπιδεῖξαι
  choice: um ihn auf … hinzuweisen
  rationale: Der Infinitiv drückt den Zweck des Herantretens aus. Im Zusammenhang mit Gebäuden ist „auf etwas hinweisen“ natürlicher als ein rein demonstratives „zeigen“.
- source_word: οἰκοδομὰς
  choice: Gebäude
  rationale: οἰκοδομή bezeichnet hier die errichteten Bauwerke des Tempelkomplexes; „Gebäude“ ist präzise und allgemein verständlich.
- source_word: τοῦ ἱεροῦ
  choice: des Tempels
  rationale: Der Genitiv ordnet die Gebäude dem Tempelkomplex zu. „des Tempels“ ist im Deutschen idiomatisch; die genaue Reichweite von ἱερόν wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von ἱερόν im Unterschied zu ναός
  choice: Tempelbereich beim ersten, Tempel beim zweiten Vorkommen
  alternative: an beiden Stellen „Tempel“ oder „Tempelkomplex“
  rationale: ἱερόν meint den umfassenderen Tempelbezirk und nicht ausschließlich das innere Heiligtum. „Tempelbereich“ verdeutlicht beim Hinausgehen den räumlichen Sinn; „Gebäude des Tempels“ bleibt natürlich und wird durch die Fußnote präzisiert, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „da kamen“ bildet das fortlaufende Fortgehen Jesu und das darauf einsetzende Herantreten der Jünger erzählerisch klar ab.
