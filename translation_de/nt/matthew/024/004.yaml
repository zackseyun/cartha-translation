lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: antwortete ihnen
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine übliche, semitisch beeinflusste Redeformel. „Antwortete ihnen“ gibt den responsiven Sinn natürlich wieder, ohne das im Deutschen schwerfällige „antwortete und sagte“.
- source_word: Βλέπετε
  choice: Gebt acht
  rationale: Der präsentische Imperativ hat hier die idiomatische Bedeutung, wachsam zu sein beziehungsweise Sorge zu tragen. „Gebt acht“ ist gegenwärtiges, verständliches Deutsch und leitet den folgenden dass-Satz natürlich ein.
- source_word: μή τις
  choice: dass ... niemand
  rationale: μή mit dem Konjunktiv bezeichnet nach dem Imperativ das zu Verhindernde. Die deutsche Konstruktion „Gebt acht, dass ... niemand“ bewahrt diesen vorbeugenden Sinn.
- source_word: πλανήσῃ
  choice: in die Irre führt
  rationale: πλανάω kann irreführen, täuschen oder vom richtigen Weg abbringen bedeuten. „In die Irre führt“ bewahrt sowohl den Gedanken der Täuschung als auch das Bild des Abirrens.
theological_decisions:
- issue: Reichweite der Warnung in πλανήσῃ
  choice: 'allgemeine Warnung vor Irreführung und Abweichen: „in die Irre führt“'
  alternative: 'enger auf Täuschung bezogen: „täuscht“'
  rationale: Im Kontext der endzeitlichen Behauptungen warnt Jesus vor falscher Führung. Die gewählte Formulierung verengt die Aussage nicht auf bloß intellektuelle Täuschung, sondern lässt auch das Abbringen vom rechten Weg anklingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Plural wird durch „Gebt“ und „euch“ klar wiedergegeben; die griechische Redeformel ist ohne unnötige Doppelung natürlich formuliert.
