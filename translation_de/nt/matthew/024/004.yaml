base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Gebt acht, dass euch niemand in die Irre führt.[a]“'
  philosophy: optimal-equivalence
  footnotes:
