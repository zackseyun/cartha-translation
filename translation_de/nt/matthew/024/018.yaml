  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: de
  text: Und wer auf dem Feld ist, soll nicht umkehren, um seinen Mantel[a] zu holen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Kleidungsstück“ oder „sein Obergewand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: wer auf dem Feld ist
  rationale: Die substantivierte Wendung bezeichnet allgemein eine Person, die sich auf dem Feld befindet. „Wer … ist“ klingt im Deutschen natürlich, wahrt den repräsentativen Einzelfall und legt das grammatische Maskulinum nicht unnötig auf einen Mann fest.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: soll nicht umkehren
  rationale: Der Aoristimperativ mit μή formuliert ein dringendes Verbot. „Soll nicht umkehren“ gibt die Aufforderung in natürlichem, würdigem Deutsch wieder; ὀπίσω verstärkt dabei die Bedeutung des Zurückkehrens und muss nicht eigens mit „zurück“ verdoppelt werden.
- source_word: ἆραι
  choice: zu holen
  rationale: 'Der Infinitiv bezeichnet hier den Zweck des Umkehrens. Im Deutschen trifft „holen“ die Situation natürlicher als das wörtlichere „nehmen“: Die Person würde zurückgehen, um das zurückgelassene Kleidungsstück an sich zu nehmen.'
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: seinen Mantel
  rationale: ἱμάτιον bezeichnet häufig ein Kleidungsstück, besonders ein Obergewand oder einen Mantel. „Mantel“ ist im Fluchtkontext anschaulich und idiomatisch; die breitere lexikalische Möglichkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Generische Personenbezeichnung beim substantivierten maskulinen Artikel
  choice: wer auf dem Feld ist
  alternative: der Mann auf dem Feld
  rationale: Das grammatische Maskulinum bezeichnet in diesem Warnwort repräsentativ eine beliebige Person. Die gewählte Form vermeidet eine sachlich unbegründete Beschränkung auf Männer und bewahrt zugleich den individuellen Charakter der Aufforderung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und dringlichem Ton. Die Satzstellung folgt natürlichem Deutsch; „umkehren“ vermeidet die schwerfällige Doppelung „zurück umkehren“.
