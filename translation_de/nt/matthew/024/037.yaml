id: MAT.24.37
reference: Matthew 24:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: de
  text: Denn wie es in den Tagen Noahs war, so wird es bei der Ankunft des Menschensohnes sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gegenwart“ beziehungsweise „Anwesenheit“. Das griechische Wort kann sowohl die Ankunft als auch die daraus folgende Gegenwart bezeichnen; hier geht es um das künftige Kommen des Menschensohnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: wie ... so
  rationale: Die natürliche deutsche Vergleichskonstruktion bewahrt die korrelative Struktur und den Nachdruck des griechischen Ausdrucks.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorausgehenden Zusammenhang.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: wie es in den Tagen Noahs war
  rationale: Das Griechische formuliert den ersten Vergleichsteil elliptisch. Die Ergänzung „es ... war“ ergibt im Deutschen einen klaren Satz, ohne den Vergleich inhaltlich auszudeuten.
- source_word: Νῶε
  choice: Noah
  rationale: Verwendet die im Deutschen etablierte Form des biblischen Namens.
- source_word: ἔσται
  choice: wird es ... sein
  rationale: Gibt das Futur von εἰμί direkt wieder und entspricht der ergänzten Konstruktion im ersten Vergleichsteil.
- source_word: παρουσία
  choice: Ankunft
  rationale: Bezeichnet hier im eschatologischen Zusammenhang das künftige Eintreffen des Menschensohnes. „Ankunft“ bewahrt zugleich einen deutlicheren Bezug zum lexikalischen Sinn als das stärker traditionsgeprägte „Wiederkunft“.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: des Menschensohnes
  rationale: Bewahrt die etablierte deutsche Wiedergabe der Selbstbezeichnung Jesu und ihre biblischen Bezüge.
theological_decisions:
- issue: Wiedergabe von παρουσία in einer eschatologischen Aussage
  choice: Ankunft
  alternative: Gegenwart; Kommen; Wiederkunft
  rationale: „Ankunft“ vermittelt in diesem Kontext den ereignishaften Zukunftsbezug, ohne durch „Wiederkunft“ ein im griechischen Wort nicht ausdrücklich enthaltenes Element einzufügen. Die mögliche Bedeutung „Gegenwart/Anwesenheit“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „in den Tagen Noahs“ ist allgemein verständlich und bewahrt den biblischen Vergleich; „Menschensohn“ bleibt als etablierter Titel erhalten.
