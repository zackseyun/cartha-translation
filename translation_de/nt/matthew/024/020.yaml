  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: de
  text: Betet aber, dass eure Flucht nicht im Winter und auch nicht an einem Sabbat[a] geschieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Sabbat“.'
    reason: Alternative Wiedergabe des artikellosen σαββάτῳ.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: Betet
  rationale: Der Imperativ Präsens in der zweiten Person Plural wird im Deutschen natürlich mit „Betet“ wiedergegeben; ein fortdauernder Aspekt muss hier nicht ausdrücklich gemacht werden.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen leichten Gegensatz beziehungsweise Übergang zur vorausgehenden Warnung; „aber“ bewahrt diesen Diskursanschluss knapp und natürlich.
- source_word: ἵνα μὴ γένηται
  choice: dass … nicht … geschieht
  rationale: ἵνα mit Aorist Konjunktiv bezeichnet hier den Inhalt des Gebets. „Dass … nicht … geschieht“ gibt den ereignishaften Sinn von γίνομαι idiomatisch wieder.
- source_word: ἡ φυγὴ ὑμῶν
  choice: eure Flucht
  rationale: φυγή bezeichnet Flucht beziehungsweise Fliehen. „Eure Flucht“ ist prägnant und legt nicht zusätzlich nahe, dass die Flucht sicher erfolgreich sein wird.
- source_word: χειμῶνος
  choice: im Winter
  rationale: Der Genitiv bezeichnet die Zeit beziehungsweise Jahreszeit; „im Winter“ ist die natürliche deutsche Wiedergabe.
- source_word: μηδὲ σαββάτῳ
  choice: und auch nicht an einem Sabbat
  rationale: μηδέ fügt einen zweiten negierten Umstand hinzu. Der artikellose Dativ σαββάτῳ lässt sich formnah als „an einem Sabbat“ wiedergeben; „und auch nicht“ bildet die griechische negative Koordination im Deutschen klar ab.
theological_decisions:
- issue: Wiedergabe von σαββάτῳ mit bestimmtem oder unbestimmtem Artikel
  choice: an einem Sabbat
  alternative: am Sabbat
  rationale: Im Griechischen steht σαββάτῳ ohne Artikel. „An einem Sabbat“ wahrt diese Form und bezeichnet dennoch eindeutig den jüdischen Sabbattag. Die traditionelle bestimmte Wiedergabe bleibt als mögliche deutsche Übersetzung in der Fußnote erhalten, ohne die im Ausgangstext bestehende Offenheit stillschweigend aufzulösen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Satzstellung folgt natürlichem Deutsch und bewahrt die knappe Mahnung des griechischen Textes.
