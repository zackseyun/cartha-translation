id: MAT.24.34
reference: Matthew 24:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: de
  text: 'Amen, ich sage euch: Diese Generation wird ganz gewiss nicht vergehen, bis dies alles geschehen ist.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieses Volk« oder »dieses Geschlecht«. Das griechische Wort kann weiter gefasst verstanden werden; »Generation« ist hier jedoch die direkteste Wiedergabe.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das übernommene »Amen« bewahrt die feierliche Bekräftigungsformel Jesu und ist im Deutschen verständlich und geläufig.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte, natürliche deutsche Entsprechung wahrt die feierliche Redeformel und die Anrede im Plural.
- source_word: ὅτι
  choice: nicht eigens wiedergegeben
  rationale: Nach »Amen, ich sage euch« wird der Inhalt im natürlichen Deutschen ohne ein zusätzliches »dass« als Hauptsatz angeschlossen.
- source_word: οὐ μὴ παρέλθῃ
  choice: wird ganz gewiss nicht vergehen
  rationale: »Ganz gewiss nicht« gibt die nachdrückliche griechische Verneinung οὐ μή klar wieder; »vergehen« bewahrt die Bildlichkeit von παρέρχομαι.
- source_word: ἡ γενεὰ αὕτη
  choice: diese Generation
  rationale: »Generation« ist hier die direkteste lexikalische Wiedergabe und lässt die umstrittene zeitliche beziehungsweise heilsgeschichtliche Deutung offen.
- source_word: ἕως ἂν
  choice: bis
  rationale: »Bis« gibt die zeitliche Grenze mit zukünftigem Bezug knapp und idiomatisch wieder.
- source_word: πάντα ταῦτα
  choice: dies alles
  rationale: Die Wendung ist natürliches modernes Deutsch und umfasst ausdrücklich die Gesamtheit der zuvor genannten Dinge beziehungsweise Ereignisse.
- source_word: γένηται
  choice: geschehen ist
  rationale: Im Zusammenhang bezeichnet γίνομαι das Eintreten von Ereignissen; das deutsche Perfekt nach »bis« bezeichnet deren vollendetes Eintreten vor der genannten Grenze.
theological_decisions:
- issue: Bedeutung von ἡ γενεὰ αὕτη im eschatologischen Zusammenhang
  choice: diese Generation
  alternative: dieses Volk / dieses Geschlecht
  rationale: Die Hauptübersetzung folgt der naheliegendsten Bedeutung, ohne festzulegen, welche Personengruppe oder welcher zeitliche Rahmen damit im Einzelnen gemeint ist. Die Fußnote nennt breitere mögliche Lesarten, ohne eine bestimmte Endzeitlehre in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Anfangsformel bleibt mit »Amen« hörbar; die emphatische Verneinung wird verständlich als »ganz gewiss nicht« ausgedrückt. Die Deutungsfrage um »diese Generation« wird nicht im Haupttext entschieden.
