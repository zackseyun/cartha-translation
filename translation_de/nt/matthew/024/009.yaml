id: MAT.24.9
reference: Matthew 24:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: de
  text: Dann werden sie euch der Bedrängnis[a] ausliefern und euch töten. Und ihr werdet von allen Völkern[b] um meines Namens willen[c] gehasst werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „der Not“ beziehungsweise „der Verfolgung“. Das griechische Wort kann Bedrängnis, Unterdrückung, Not oder Drangsal bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder „von allen Nationen“; in diesem Zusammenhang weniger wahrscheinlich: „von allen Nichtjuden“.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich „wegen meines Namens“; gemeint ist die Zugehörigkeit zu Jesus und zu dem, wofür sein Name steht.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Das temporale Adverb kennzeichnet die zeitliche Folge innerhalb der Rede und wird knapp und natürlich wiedergegeben.
- source_word: παραδώσουσιν ὑμᾶς
  choice: sie werden euch … ausliefern
  rationale: παραδίδωμι bezeichnet hier die Übergabe in fremde beziehungsweise feindliche Gewalt. „Ausliefern“ bewahrt diesen Sinn, ohne ausdrücklich einen Verrat vorauszusetzen.
- source_word: εἰς θλῖψιν
  choice: der Bedrängnis
  rationale: θλῖψις umfasst Bedrängnis, Not, Unterdrückung und Verfolgung. „Bedrängnis“ ist im Deutschen verständlich und gewichtig und lässt sowohl konkrete Verfolgung als auch den endzeitlichen Horizont des Zusammenhangs offen.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: euch töten
  rationale: Die direkte Wiedergabe entspricht dem schlichten, starken Verb, ohne die zusätzliche rechtliche Färbung von „hinrichten“ oder die moralische Spezifizierung von „ermorden“.
- source_word: ἔσεσθε μισούμενοι
  choice: ihr werdet … gehasst werden
  rationale: Die periphrastische Futur-Passiv-Konstruktion wird als natürliches deutsches Futur Passiv wiedergegeben.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: von allen Völkern
  rationale: ἔθνη kann „Völker“ oder „Nichtjuden“ bedeuten. Der umfassende Zusammenhang spricht hier eher für „alle Völker“, ohne eine ethnische Gegenüberstellung festzulegen.
- source_word: διὰ τὸ ὄνομά μου
  choice: um meines Namens willen
  rationale: Die Formulierung wahrt das biblische Motiv des Namens, der für Jesu Person und die Zugehörigkeit zu ihm steht, statt es in eine erklärende Paraphrase aufzulösen.
theological_decisions:
- issue: Bedeutungsumfang von θλῖψις in der Endzeitrede
  choice: Bedrängnis
  alternative: Not, Verfolgung oder Drangsal
  rationale: „Bedrängnis“ erfasst konkreten Druck und Leiden, ohne das Wort ausschließlich als technischen Begriff eines bestimmten endzeitlichen Systems zu behandeln.
- issue: Bedeutung von ἔθνη
  choice: Völker
  alternative: Nichtjuden
  rationale: „Alle Völker“ gibt den wahrscheinlich universalen Umfang der Feindschaft wieder. Die mögliche lexikalische Alternative bleibt in der Fußnote sichtbar.
- issue: Bedeutung des Namens Jesu
  choice: um meines Namens willen
  alternative: weil ihr zu mir gehört
  rationale: Die bildhafte und theologisch offene Rede vom „Namen“ bleibt im Haupttext erhalten; ihre relationale Bedeutung wird nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne die logische Verbindung des griechischen καί aufzugeben. „Ausliefern“, „Bedrängnis“ und „um meines Namens willen“ bewahren den ernsten biblischen Ton, bleiben aber allgemein verständlich.
