  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: de
  text: Wehe aber den Schwangeren und Stillenden in jenen Tagen!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: wehe
  rationale: Bewahrt die prophetische Ausruf- und Klagekraft angesichts drohender Not; im Deutschen ist „wehe“ die natürliche und würdevolle Entsprechung.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den leichten Übergang von der vorhergehenden Warnung und gibt den milden Kontrast wieder, ohne ihn zu überzeichnen.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: den Schwangeren
  rationale: Die Wendung ἐν γαστρὶ ἔχω bedeutet idiomatisch „schwanger sein“. Die substantivierte Form „den Schwangeren“ ist im modernen Deutschen natürlich und entspricht der femininen griechischen Konstruktion.
- source_word: ταῖς θηλαζούσαις
  choice: den Stillenden
  rationale: θηλάζω bezeichnet das Stillen beziehungsweise Säugen eines Kindes. „Den Stillenden“ ist knapp, verständlich und bewahrt das im Griechischen nicht ausdrücklich genannte Objekt.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: in jenen Tagen
  rationale: Direkte und idiomatische Wiedergabe der zeitlichen Bestimmung mit angemessenem biblischem Register.
theological_decisions:
- issue: Referenz der femininen Dativformen und Partizipien
  choice: Substantivierte feminine Bezeichnungen „den Schwangeren“ und „den Stillenden“
  alternative: „den schwangeren und stillenden Frauen“
  rationale: Die griechischen Formen sind eindeutig feminin, nennen aber kein Substantiv für „Frauen“. Die deutsche Substantivierung bildet dies knapp und geschlechtsgenau ab, ohne eine unnötige Ergänzung einzuführen.
- issue: Charakter von οὐαί
  choice: Als Ausruf drohender Not und des Mitgefühls mit „wehe“ wiedergegeben
  alternative: Ein rein verurteilendes „Wehe über“
  rationale: Im Zusammenhang steht die besondere Bedrängnis dieser Personen im Vordergrund. Die Übersetzung lässt den Ausruf zwischen Klage und Warnung stehen und macht daraus keinen ausdrücklichen Schuldspruch.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, knappem biblischem Ton. Der Satz folgt der griechischen Ausrufstruktur; das abschließende Ausrufezeichen macht die Kraft von οὐαί sichtbar. Keine Fußnote nötig, da die mögliche ausführlichere Wiedergabe mit „Frauen“ keinen eigenständigen Bedeutungsunterschied erzeugt.
