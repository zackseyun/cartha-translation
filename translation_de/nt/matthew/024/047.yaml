  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: de
  text: 'Amen, ich sage euch: Er wird ihn über seinen ganzen Besitz einsetzen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über alles, was ihm gehört“.'
    reason: Lexikalische Alternative für τοῖς ὑπάρχουσιν αὐτοῦ, die den griechischen Ausdruck stärker umschreibt.
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das in Jesu feierlicher Einleitungsformel gebrauchte ἀμήν ist im Deutschen als „Amen“ geläufig, würdevoll und bewahrt die markante Form des griechischen Ausdrucks.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Wendung gibt Verb und Dativpronomen unmittelbar wieder und bewahrt den feierlichen, formelhaften Charakter der Aussage.
- source_word: ὅτι
  choice: Doppelpunkt
  rationale: Im natürlichen modernen Deutsch leitet ein Doppelpunkt nach der feierlichen Redeformel den Inhalt klarer ein als ein ausdrückliches „dass“.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: über seinen ganzen Besitz
  rationale: ἐπί mit dem Dativ bezeichnet hier den Verantwortungsbereich; τὰ ὑπάρχοντα meint das, was jemand besitzt. „Sein ganzer Besitz“ ist knapp, natürlich und sachlich genau.
- source_word: καταστήσει
  choice: wird einsetzen
  rationale: καθίστημι bezeichnet hier die Einsetzung in eine verantwortliche Stellung, nicht lediglich ein räumliches Hinstellen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen verweist auf den zuvor genannten treuen und klugen Knecht und wird entsprechend beibehalten.
theological_decisions:
- issue: Art der Belohnung beziehungsweise Beauftragung durch den Herrn
  choice: Die Aussage wird innerhalb der Bildwelt des Gleichnisses als Einsetzung über den gesamten Besitz wiedergegeben.
  alternative: Sie ausdrücklich als kirchliche Autorität oder als endzeitlichen himmlischen Lohn deuten.
  rationale: Der Vers selbst beschreibt eine erweiterte Verantwortung. Weiterführende ekklesiologische oder eschatologische Deutungen sollen nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die traditionelle feierliche Formel „Amen, ich sage euch“ bleibt erhalten; „einsetzen“ vermittelt den administrativen Sinn im Kontext.
