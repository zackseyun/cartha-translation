id: MAT.24.21
reference: Matthew 24:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: de
  text: Denn dann wird eine große Bedrängnis[a] sein, wie es sie vom Anfang der Welt bis jetzt nicht gegeben hat und auch nie wieder geben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „große Not“ oder „große Drangsal“. Das griechische Wort kann schwere Not, Druck, Bedrückung oder Verfolgung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Denn dann
  rationale: „Denn“ bewahrt den begründenden Anschluss von γάρ an den vorausgehenden Zusammenhang; „dann“ gibt τότε knapp und natürlich wieder.
- source_word: ἔσται ... θλῖψις μεγάλη
  choice: wird eine große Bedrängnis sein
  rationale: Die Formulierung gibt die zukünftige Existenz der Bedrängnis eng am Griechischen wieder. „Groß“ entspricht μεγάλη; „Bedrängnis“ bezeichnet schwere Not, Druck oder Bedrückung und ist im modernen Deutschen verständlich.
- source_word: οἵα
  choice: wie es sie
  rationale: Die idiomatische deutsche Wendung bewahrt den qualitativen Vergleich und leitet die Aussage über das beispiellose Ausmaß ein.
- source_word: οὐ γέγονεν
  choice: nicht gegeben hat
  rationale: Das Perfekt von γίνομαι beschreibt hier, dass eine solche Bedrängnis bis zum gegenwärtigen Zeitpunkt nie eingetreten beziehungsweise vorhanden gewesen ist. Die deutsche Wendung ist natürlich und passt zur Konstruktion „wie es sie ...“.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: vom Anfang der Welt
  rationale: κόσμος wird ohne erklärende Erweiterung als „Welt“ wiedergegeben; die Wendung bezeichnet den frühesten zeitlichen Ausgangspunkt.
- source_word: ἕως τοῦ νῦν
  choice: bis jetzt
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Grenze.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: und auch nie wieder geben wird
  rationale: „Nie“ bringt die nachdrückliche Zukunftsverneinung οὐ μή zum Ausdruck; „auch“ gibt οὐδέ wieder, und „wieder“ macht im Deutschen den Vergleich mit einem erneuten Auftreten natürlich deutlich.
theological_decisions:
- issue: Wiedergabe des eschatologisch geprägten Begriffs θλῖψις
  choice: Bedrängnis
  alternative: Drangsal; Not
  rationale: „Bedrängnis“ wahrt den Gedanken schwersten Drucks und Leidens sowie den biblisch-eschatologischen Ernst, ohne einen technisch festgelegten endzeitlichen Fachbegriff oder eine bestimmte Lehrdeutung einzutragen.
- issue: Reichweite der nachdrücklichen Verneinung οὐ μή
  choice: auch nie wieder geben wird
  alternative: gewiss nicht eintreten wird
  rationale: Die Übersetzung bewahrt die absolute, emphatische Zukunftsverneinung und lässt die Aussage in ihrer umfassenden rhetorischen Stärke stehen, ohne sie auf ein bestimmtes Endzeitschema zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bedrängnis“ ist gehoben, aber allgemein verständlich; die Satzführung bleibt nah an der markanten Steigerung des griechischen Textes.
