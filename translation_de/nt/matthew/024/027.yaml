id: MAT.24.27
reference: Matthew 24:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: de
  text: Denn wie der Blitz vom Osten ausgeht und bis zum Westen zu sehen ist, so wird die Ankunft des Menschensohnes[a] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gegenwart“; das griechische Wort παρουσία kann „Gegenwart“ oder „Ankunft“ bezeichnen. Hier meint es im Zusammenhang die zukünftige Ankunft des Menschensohnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: Bewahrt sowohl den begründenden Anschluss durch γάρ als auch den Vergleich durch ὥσπερ in natürlichem Deutsch.
- source_word: ἡ ἀστραπή
  choice: der Blitz
  rationale: Bezeichnet hier das weithin sichtbare Naturphänomen des Blitzes.
- source_word: ἐξέρχεται
  choice: ausgeht
  rationale: Gibt das Hervorkommen des Blitzes nahe am griechischen Ausdruck wieder und ist im Deutschen verständlich.
- source_word: ἀπὸ ἀνατολῶν
  choice: vom Osten
  rationale: Im Gegensatz zu δυσμῶν ist die Himmelsrichtung gemeint; der Plural wird im Deutschen idiomatisch singularisch wiedergegeben.
- source_word: φαίνεται ἕως δυσμῶν
  choice: bis zum Westen zu sehen ist
  rationale: Bewahrt den passivisch wahrnehmbaren Sinn von φαίνεται und die durch ἕως bezeichnete räumliche Ausdehnung.
- source_word: οὕτως ἔσται
  choice: so wird ... sein
  rationale: Erhält die Vergleichsstruktur und den Zukunftsbezug.
- source_word: παρουσία
  choice: Ankunft
  rationale: Gibt in diesem eschatologischen Zusammenhang den ereignishaften Sinn von Kommen bzw. Eintreffen wieder, ohne die mögliche Grundbedeutung „Gegenwart“ zu verschweigen.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: des Menschensohnes
  rationale: Die geläufige deutsche Wiedergabe bewahrt den Titelcharakter und den Bezugshorizont von Daniel 7.
theological_decisions:
- issue: Wiedergabe von παρουσία in einer endzeitlichen Aussage
  choice: Ankunft
  alternative: Kommen; Gegenwart
  rationale: Der Vergleich mit dem weithin sichtbaren Blitz stellt die zukünftige, öffentliche Ankunft des Menschensohnes heraus. „Ankunft“ wahrt den Ereignischarakter; die lexikalisch mögliche Bedeutung „Gegenwart“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Vergleich, ohne unnötig wörtlich zu klingen. „Menschensohn“ bleibt als etablierter Titel erhalten.
