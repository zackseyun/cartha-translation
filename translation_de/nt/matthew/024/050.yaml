id: MAT.24.50
reference: Matthew 24:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: de
  text: Der Herr[a] jenes Sklaven[b] wird an einem Tag kommen, mit dem dieser nicht rechnet, und zu einer Stunde, die er nicht kennt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebieter“. Das griechische Wort kyrios kann „Herr“ oder „Gebieter“ bedeuten; hier bezeichnet es im unmittelbaren Zusammenhang den menschlichen Herrn im Gleichnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Diener“. Das griechische Wort doulos bezeichnet einen Menschen in einem gebundenen Dienstverhältnis; „Sklave“ hebt den hier vorausgesetzten sozialen Status hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: wird kommen
  rationale: Das Futur von ἥκω bezeichnet das Kommen beziehungsweise Eintreffen. „Wird kommen“ ist im Zusammenhang der unerwarteten Rückkehr natürlich und direkt.
- source_word: κύριος
  choice: Herr
  rationale: Im unmittelbaren Bild bezeichnet κύριος den menschlichen Herrn eines Sklaven. Das deutsche „Herr“ bildet diese soziale Beziehung natürlich ab und bewahrt zugleich die lexikalische Nähe zu κύριος, ohne durch Großschreibung ausdrücklich einen göttlichen Titel zu setzen.
- source_word: δούλου
  choice: Sklaven
  rationale: δοῦλος bezeichnet hier eine Person in einem unfreien Dienstverhältnis. Da die Beziehung zu ihrem κύριος ausdrücklich im Mittelpunkt steht, gibt „Sklave“ den sozialen Status genauer wieder als das mildere „Diener“.
- source_word: ἐκείνου
  choice: jenes
  rationale: Das Demonstrativpronomen verweist auf den zuvor beschriebenen Sklaven zurück. „Jenes“ erhält die rückverweisende und leicht distanzierende Kraft.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: an einem Tag, mit dem dieser nicht rechnet
  rationale: Die Formulierung erhält die unbestimmte Zeitangabe. „Mit einem Tag rechnen“ ist idiomatisches modernes Deutsch; „dieser“ macht deutlich, dass der Sklave, nicht sein Herr, das Subjekt des Erwartens ist.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: zu einer Stunde, die er nicht kennt
  rationale: „Zu einer Stunde“ wahrt die Parallelität von Tag und Stunde. „Die er nicht kennt“ gibt γινώσκω schlicht wieder und lässt den Bezug auf den Zeitpunkt bestehen.
theological_decisions:
- issue: Bedeutung von κύριος im Gleichnis
  choice: Herr
  alternative: Gebieter
  rationale: κύριος bezeichnet innerhalb der erzählten Haushaltsszene den menschlichen Herrn des Sklaven. „Herr“ bewahrt sowohl diesen unmittelbaren Sinn als auch die im weiteren Gleichnis mögliche theologische Resonanz, ohne die Figur ausdrücklich mit einem Hoheitstitel gleichzusetzen.
- issue: Wiedergabe von δοῦλος
  choice: Sklave
  alternative: Diener
  rationale: Die gebundene und hierarchische Stellung ist in der Gegenüberstellung von κύριος und δοῦλος kontextuell wesentlich. „Sklave“ bewahrt diese unbequeme historische und rhetorische Schärfe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der Zeitangaben „an einem Tag“ und „zu einer Stunde“ erhält den griechischen Parallelismus. Das rückverweisende „dieser“ verhindert eine im Deutschen naheliegende Verwechslung des handelnden Sklaven mit seinem Herrn.
