  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: ἥξει als Futur, κύριος als menschlicher Herr innerhalb des Gleichnisses, δοῦλος als „Sklave“, das rückverweisende ἐκείνου sowie die parallelen Zeitangaben mit dem jeweiligen Bezug auf den Sklaven. „Mit dem dieser nicht rechnet“ trifft προσδοκᾷ idiomatisch und präzise; „die er nicht kennt“ gibt γινώσκει sachgerecht wieder.'
