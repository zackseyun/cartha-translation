  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: de
  text: Doch von jenem Tag und jener Stunde weiß niemand – nicht einmal die Engel im Himmel, auch nicht der Sohn[a]; nur der Vater weiß es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen „auch nicht der Sohn“ aus. Der Haupttext folgt hier dem SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Doch von
  rationale: περί mit Genitiv führt das Thema ein; δέ markiert hier einen leichten Gegensatz beziehungsweise Übergang. „Doch von“ gibt beides in natürlichem, würdigem Deutsch wieder.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: jenem Tag und jener Stunde
  rationale: Die Genitive hängen von περί ab. Das Demonstrativpronomen bezieht sich sinngemäß auf die koordinierte Zeitangabe; die Wiederholung von „jener“ entspricht dem natürlichen deutschen Ausdruck.
- source_word: οὐδεὶς οἶδεν
  choice: weiß niemand
  rationale: οὐδείς bezeichnet ausnahmslos „niemand“; οἶδα hat trotz seiner Perfektform präsentische Bedeutung „wissen“.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: nicht einmal die Engel im Himmel
  rationale: οὐδέ hebt die eingeschlossene Gruppe nachdrücklich hervor; „nicht einmal“ bewahrt diesen Akzent. „Im Himmel“ ist die natürliche deutsche Wiedergabe des griechischen Genitivattributs τῶν οὐρανῶν.
- source_word: οὐδὲ ὁ υἱός
  choice: und auch nicht der Sohn
  rationale: Die Formulierung setzt die negative Aufzählung fort. Der bestimmte Artikel kennzeichnet „der Sohn“ als bekannten Titel; die Aussage wird weder abgeschwächt noch erklärt.
- source_word: εἰ μὴ
  choice: sondern
  rationale: Nach der umfassenden Verneinung führt εἰ μή die einzige Ausnahme ein. Im Deutschen drückt „sondern“ zusammen mit „allein“ diese Ausnahme idiomatisch aus.
- source_word: ὁ πατὴρ μόνος
  choice: allein der Vater
  rationale: μόνος beschränkt das Wissen ausschließlich auf den Vater. Die Stellung „allein der Vater“ ist klar, knapp und bewahrt die Exklusivität.
theological_decisions:
- issue: Christologische Spannung in „οὐδὲ ὁ υἱός“
  choice: „und auch nicht der Sohn“ bleibt ohne Abschwächung im Haupttext erhalten.
  alternative: Die Wendung aufgrund der Textvariante auslassen oder durch eine erklärende Paraphrase theologisch harmonisieren.
  rationale: Der vorgelegte SBLGNT-Text enthält die Wendung. Die Übersetzung bewahrt daher die Aussage und ihre theologische Spannung; eine dogmatische Einordnung gehört nicht in den übersetzten Vers.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Gedankenstrich macht die eingeschobene negative Aufzählung übersichtlich, ohne die syntaktische und theologische Zuspitzung zu verändern.
