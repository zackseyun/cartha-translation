id: MAT.24.11
reference: Matthew 24:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: de
  text: Und viele falsche Propheten werden auftreten und viele in die Irre führen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: werden viele verführen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: werden erweckt werden; auch: werden sich erheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Die übliche quantitative Wiedergabe entspricht dem Griechischen und klingt im Deutschen natürlich.
- source_word: ψευδοπροφῆται
  choice: falsche Propheten
  rationale: Die geläufige deutsche Wendung bezeichnet Propheten, deren Anspruch oder Botschaft falsch beziehungsweise irreführend ist, ohne die Aussage unnötig einzuengen.
- source_word: ἐγερθήσονται
  choice: werden auftreten
  rationale: Das futurische Passiv kann in diesem Zusammenhang idiomatisch das Hervortreten oder Aufkommen solcher Personen bezeichnen. „Auftreten“ ist verständlich und vermeidet einen unbeabsichtigten Anklang an Auferstehung.
- source_word: πλανήσουσιν
  choice: werden … in die Irre führen
  rationale: Die Formulierung bewahrt das im Verb enthaltene Bild des Abirrens und lässt offen, ob die Irreführung vor allem lehrmäßiger, moralischer oder anderer Art ist.
- source_word: πολλούς
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv ist als direktes Objekt mit „viele“ knapp und genau wiedergegeben.
- source_word: καὶ … καὶ
  choice: Und … und
  rationale: Die beiden καί verbinden den Vers mit dem vorherigen Zusammenhang und koordinieren die beiden zukünftigen Handlungen.
theological_decisions:
- issue: Art der durch πλανήσουσιν bezeichneten Irreführung
  choice: Der Vers sagt allgemein, dass falsche Propheten viele Menschen irreführen werden.
  alternative: Die Irreführung wird ausdrücklich als lehrmäßig, moralisch oder endzeitlich bestimmt.
  rationale: Das griechische Verb legt den genauen Bereich und Mechanismus der Irreführung nicht fest; die Übersetzung wahrt diese inhaltliche Breite.
- issue: Passivform von ἐγερθήσονται
  choice: Idiomat ongoing-eventiv als „werden auftreten“ wiedergegeben.
  alternative: „werden erweckt werden“ beziehungsweise „werden sich erheben“
  rationale: Die Passivform bleibt in einer Fußnote sichtbar. Im Haupttext wird keine ausdrückliche Aussage darüber eingeführt, wer diese Propheten aufkommen lässt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt eng am griechischen Text; „auftreten“ und „in die Irre führen“ sind zugleich idiomatisch und bedeutungsoffen.
