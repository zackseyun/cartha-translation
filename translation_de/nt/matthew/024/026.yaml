  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: de
  text: 'Wenn sie also zu euch sagen: »Seht, er ist in der Wüste«, dann geht nicht hinaus. Wenn sie sagen: »Seht, er ist in den inneren Räumen«, dann glaubt es nicht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Wüste« kann auch mit »Einöde« oder »Ödland« wiedergegeben werden; »innere Räume« auch mit »Vorratsräume« oder »private Kammern«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Wenn ... also
  rationale: Die deutsche Stellung von »also« bewahrt den folgernden Anschluss durch οὖν, während »wenn« die Bedingung von ἐάν natürlich einleitet.
- source_word: εἴπωσιν ὑμῖν
  choice: sie zu euch sagen
  rationale: Die dritte Person Plural bleibt wie im Griechischen unbestimmt und benennt keine besondere Gruppe.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: »Seht« ist ein unmittelbarer, verständlicher Aufmerksamkeitsruf und weniger altertümlich als »Siehe«.
- source_word: ἐν τῇ ἐρήμῳ
  choice: draußen in der Einöde
  rationale: »Einöde« kann wie ἔρημος unbewohntes, abgelegenes Gebiet bezeichnen, ohne auf eine Sandwüste festgelegt zu sein; »draußen« verdeutlicht natürlich den Gegensatz zu den inneren Räumen und ist durch das folgende ἐξέλθητε gestützt.
- source_word: ἐστίν
  choice: er ist
  rationale: Das im Zusammenhang vorausgesetzte männliche Subjekt wird im Deutschen grammatisch ergänzt, ohne es ausdrücklich als Jesus oder Messias zu benennen.
- source_word: μὴ ἐξέλθητε
  choice: dann geht nicht hinaus
  rationale: Der mit μή gebrauchte Aorist-Konjunktiv ist eine direkte Aufforderung, die behauptete äußere Örtlichkeit nicht aufzusuchen.
- source_word: ἐν τοῖς ταμείοις
  choice: in den inneren Räumen
  rationale: ταμεῖον bezeichnet einen innen gelegenen, privaten Raum oder Vorratsraum. Die Wiedergabe hält die räumliche Bedeutung fest, ohne Heimlichkeit übermäßig zu betonen.
- source_word: μὴ πιστεύσητε
  choice: dann glaubt es nicht
  rationale: Das ergänzte »es« bezieht sich idiomatisch auf die jeweilige Behauptung, nicht zwingend auf die Personen, die sie äußern.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐστίν
  choice: Das Subjekt wird nur mit »er« wiedergegeben.
  alternative: »Der Messias ist dort« oder »Jesus ist dort«
  rationale: Der Zusammenhang legt den beanspruchten Aufenthaltsort Jesu beziehungsweise des Messias nahe, doch der griechische Satz nennt hier keinen Titel. »Er« bewahrt diese implizite Bezugnahme.
- issue: Verhältnis der beiden Ortsangaben
  choice: Die beiden behaupteten Aufenthaltsorte werden mit einem ergänzten »oder« als parallele Alternativen innerhalb derselben Bedingung verbunden.
  alternative: Unverbundene Gegenüberstellung nur durch ein Semikolon
  rationale: Das Griechische hat kein ausdrückliches ἤ, stellt aber zwei parallele Meldungen unter dieselbe Kondition. Das deutsche »oder« macht diese Struktur lesbar, ohne zu behaupten, beide Meldungen würden zugleich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede behält ihre Dringlichkeit. »Seht« vermeidet das altertümlich wirkende »Siehe«; »Einöde« wahrt die Bedeutungsbreite von ἔρημος.
