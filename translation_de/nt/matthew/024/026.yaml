  terminology: »Wüste« ist für ἔρημος im matthäischen Sprachgebrauch die naheliegende Standardwiedergabe; eine Fußnote erhält »Einöde« beziehungsweise »Ödland« als mögliche breitere Alternative. »innere Räume« gibt ταμεῖα angemessen wieder, ohne eine geheime Zusammenkunft zu behaupten.
