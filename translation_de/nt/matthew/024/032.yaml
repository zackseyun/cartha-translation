source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: de
  text: 'Lernt aber vom Feigenbaum das Gleichnis[a]: Sobald sein Zweig zart wird und Blätter treibt[b], erkennt ihr, dass der Sommer[c] nahe ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lehre“ oder „das Beispiel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Blätter sprießen“.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort θέρος kann „Sommer“ und in manchen Zusammenhängen die Erntezeit bezeichnen; hier passt wegen des Feigenbaumbildes am besten die jahreszeitliche Bedeutung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: Vom Feigenbaum aber
  rationale: Ἀπό mit Genitiv bezeichnet die Quelle des Lernens; die Voranstellung bewahrt die Hervorhebung. δέ wird mit dem milden, nachgestellten „aber“ wiedergegeben, ohne ein nicht ausdrücklich vorhandenes zeitliches „nun“ einzuführen.
- source_word: μάθετε
  choice: lernt
  rationale: Der Aoristimperativ von μανθάνω wird als direkte Aufforderung wiedergegeben.
- source_word: τὴν παραβολήν
  choice: das Gleichnis
  rationale: „Gleichnis“ entspricht dem neutestamentlichen Gebrauch von παραβολή und lässt offen, ob der Ausdruck hier stärker als Beispiel oder Lehre zu verstehen ist.
- source_word: ὅταν ἤδη
  choice: Sobald
  rationale: ὅταν bezeichnet einen allgemeinen zeitlichen Fall; zusammen mit ἤδη wird der einsetzende, erkennbare Zeitpunkt idiomatisch durch „sobald“ ausgedrückt.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: sein Zweig weich wird
  rationale: γένηται bezeichnet einen Zustandswechsel. ἁπαλός meint beim jungen Austrieb weich beziehungsweise zart; „weich“ ist hier verständlich und bildnah.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: und Blätter treibt
  rationale: ἐκφύω bezeichnet das Hervortreiben oder Sprossen; „Blätter treiben“ ist im modernen Deutschen die natürliche botanische Wendung.
- source_word: γινώσκετε
  choice: erkennt ihr
  rationale: Die Form ist Präsens Indikativ, zweite Person Plural. „Erkennt ihr“ gibt die aus dem beobachteten Zeichen gewonnene Einsicht wieder und vermeidet eine imperativische Deutung.
- source_word: ἐγγὺς τὸ θέρος
  choice: dass der Sommer nahe ist
  rationale: θέρος bezeichnet in diesem Zusammenhang am natürlichsten den Sommer; ἐγγύς wird mit „nahe“ wiedergegeben.
theological_decisions:
- issue: Bedeutung des Feigenbaumbildes
  choice: Das Bild wird als jahreszeitliches Gleichnis wiedergegeben, ohne den Feigenbaum in der Übersetzung ausdrücklich mit Israel gleichzusetzen.
  alternative: Der Feigenbaum steht symbolisch für Israel; oder er ist lediglich ein beliebiges Naturbeispiel.
  rationale: Der Vers selbst beschreibt die Erkennbarkeit zeitlicher Nähe anhand eines Naturzeichens. Eine weitergehende eschatologische Identifikation ist hier nicht ausdrücklich formuliert und wird deshalb nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Quellenangabe und das nachgestellte „aber“ bewahren die griechische Akzentsetzung, während „Blätter treibt“ natürliches gegenwärtiges Deutsch ist. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
