  source_fidelity: 'Der Teilsatz gibt die griechische Syntax und Semantik zuverlässig wieder: „anfängt … zu schlagen“ entspricht ἄρξηται τύπτειν, „seine Mitsklaven“ τοὺς συνδούλους αὐτοῦ, und „isst und trinkt … die sich betrinken“ bewahrt den gegenwärtig-charakterisierenden Sinn von ἐσθίῃ, πίνῃ und μεθυόντων. Die lockere Verbindung durch δέ ist mit „und“ angemessen wiedergegeben.'
