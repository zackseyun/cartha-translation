  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: de
  text: und anfängt, seine Mitsklaven[a] zu schlagen, und mit denen isst und trinkt, die sich betrinken[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mitdiener“. Wörtlich bezeichnet das griechische Wort Sklaven, die demselben Herrn unterstehen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „mit Betrunkenen“ oder „mit Trunkenbolden“. Das griechische Partizip bezeichnet Menschen, die sich betrinken oder durch Trunkenheit gekennzeichnet sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: anfängt … zu schlagen
  rationale: Die Verbindung aus ἄρχομαι und Infinitiv bezeichnet den Beginn einer Handlung; „anfängt … zu schlagen“ gibt sowohl den ingressiven Sinn als auch die hier naheliegende fortgesetzte Gewalttätigkeit natürlich wieder.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: seine Mitsklaven
  rationale: σύνδουλος bezeichnet einen Sklaven, der demselben Herrn untersteht. „Mitsklaven“ bewahrt den gemeinsamen rechtlich-sozialen Status deutlicher als „Mitdiener“.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: und … isst und trinkt
  rationale: Die Präsensformen schildern sein fortgesetztes beziehungsweise charakteristisches Verhalten. δέ verbindet hier locker und wird im Deutschen natürlich mit „und“ wiedergegeben.
- source_word: μετὰ τῶν μεθυόντων
  choice: mit denen …, die sich betrinken
  rationale: Das substantivierte Präsenspartizip bezeichnet Menschen, die sich betrinken beziehungsweise von solchem Verhalten geprägt sind. Die verbale Wiedergabe erhält den Handlungssinn, ohne sie mit einem festen Etikett zu belegen.
theological_decisions:
- issue: Wiedergabe des δοῦλος-Wortfeldes in συνδούλους
  choice: Mitsklaven
  alternative: Mitdiener
  rationale: Im Gleichnis ist der gemeinsame Status unter einem Herrn wesentlich. „Mitsklaven“ gibt diese soziale Realität und die daraus folgende Gleichstellung der Betroffenen unter ihrem Herrn präziser wieder, ohne die Bildsprache abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Teilsatz an den vorausgehenden Kontext angeschlossen. „Mitsklaven“ ist historisch und lexikalisch präzise; die Fußnote nennt die geläufigere, aber weniger genaue Alternative. Die Formulierung „die sich betrinken“ erhält den dynamischen Aspekt des Partizips.
