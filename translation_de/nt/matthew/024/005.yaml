id: MAT.24.5
reference: Matthew 24:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: de
  text: 'Denn viele werden unter meinem Namen kommen und sagen: »Ich bin der Messias«,[a] und sie werden viele irreführen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich bin der Christus.« Das griechische Wort ist ὁ χριστός.'
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Die übliche quantitative Wiedergabe; sie entspricht dem Kontext natürlich und genau.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden Anschluss an Jesu vorhergehende Warnung.
- source_word: ἐλεύσονται
  choice: werden kommen
  rationale: Gibt das Futur von ἔρχομαι idiomatisch und ohne unnötige Spezifizierung wieder.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: unter meinem Namen
  rationale: Drückt hier natürlich aus, dass die Kommenden Jesu Namen bzw. Identität für sich beanspruchen; »in meinem Namen« könnte im Deutschen leichter eine echte Beauftragung durch Jesus nahelegen.
- source_word: λέγοντες
  choice: und sagen
  rationale: Löst das griechische Partizip in einen natürlichen deutschen Hauptsatzanschluss auf, ohne den Aussageakt als bloße Behauptung vorzuinterpretieren.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Ich bin der Messias
  rationale: χριστός ist hier eindeutig als Titel eines messianischen Anspruchs gebraucht; »der Messias« macht diese Funktion im modernen Deutschen unmittelbar verständlich.
- source_word: πλανήσουσιν
  choice: werden ... irreführen
  rationale: Erfasst sowohl Täuschung als auch das Abbringen vom richtigen Weg und klingt im gegenwärtigen Standarddeutsch natürlich.
- source_word: πολλοὺς
  choice: viele
  rationale: Die substantivische Form ist im Deutschen eindeutig und bewahrt die knappe Wiederholung des griechischen Textes.
theological_decisions:
- issue: Wiedergabe von ὁ χριστός im Anspruch falscher Messiasgestalten
  choice: der Messias
  alternative: der Christus
  rationale: Der Ausdruck fungiert hier als Titel und bezeichnet die beanspruchte messianische Identität. »Messias« übersetzt diese Titelfunktion klar; die Alternative wird in einer Fußnote offengelegt.
- issue: Bedeutung von ἐπὶ τῷ ὀνόματί μου
  choice: unter meinem Namen
  alternative: in meinem Namen
  rationale: Die Wendung kann einen Anspruch auf Jesu Namen, Autorität oder Identität bezeichnen. Im Zusammenhang mit »Ich bin der Messias« vermeidet »unter meinem Namen« den falschen Eindruck einer wirklichen Sendung durch Jesus, ohne die Wendung enger auf eine einzige Nuance festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und bewahrt durch die zweimalige Verwendung von »viele« die rhetorische Wiederholung des griechischen Textes.
