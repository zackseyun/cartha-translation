  terminology: „Falsche Messiasse“ ist für ψευδόχριστοι sachgerecht und kontextuell klarer als eine namehaft verstandene Wiedergabe mit „Christusse“. „Erwählten“, „Zeichen und Wunder“ sowie „irrezuführen“ sind präzise und idiomatisch. Die Fußnoten erläutern echte Alternativen, ohne die Aussage dogmatisch festzulegen.
