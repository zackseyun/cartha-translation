  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: das zukünftige Auftreten der falschen Messiasse und Propheten, große Zeichen und Wunder sowie die mit ὥστε eingeleitete Folge bzw. Zielrichtung des Irreführens. „Wenn möglich“ bewahrt die knappe, theologisch nicht weiter festgelegte Bedingung εἰ δυνατόν; „sogar“ gibt das steigernde καί angemessen wieder.'
