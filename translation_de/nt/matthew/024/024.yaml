id: MAT.24.24
reference: Matthew 24:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: de
  text: Denn es werden falsche Messiasse[a] und falsche Propheten auftreten und große Zeichen und Wunder vollbringen, um, wenn möglich[c], sogar die Erwählten irrezuführen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „falsche Christusse“. Das griechische Wort verwendet den Titel Christos; hier ist es mit „Messiasse“ wiedergegeben, weil es titelhaft gebraucht wird.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zu täuschen“. Das Verb kann bedeuten, jemanden vom richtigen Weg abzubringen; daher „irrezuführen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wenn es möglich wäre“. Im Griechischen steht nur „wenn möglich“; welche theologische Folgerung daraus zu ziehen ist, bleibt unausgesprochen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: werden auftreten
  rationale: Das Passiv von ἐγείρω bezeichnet hier idiomatisch das Hervortreten bzw. Auftreten von Personen; „auftreten“ ist natürlich und vermeidet einen Auferstehungsanklang.
- source_word: ψευδόχριστοι
  choice: falsche Messiasse
  rationale: Χριστός ist hier titelhaft gebraucht. „Messiasse“ bewahrt diesen Sinn und gibt das Präfix ψευδο- direkt mit „falsche“ wieder.
- source_word: ψευδοπροφῆται
  choice: falsche Propheten
  rationale: Direkte und im Deutschen geläufige Wiedergabe des Kompositums.
- source_word: δώσουσιν
  choice: vollbringen
  rationale: In Verbindung mit Zeichen und Wundern bedeutet δίδωμι idiomatisch, solche Taten hervorzubringen bzw. zu wirken; „vollbringen“ ist im Deutschen natürlich und würdevoll.
- source_word: σημεῖα μεγάλα καὶ τέρατα
  choice: große Zeichen und Wunder
  rationale: Die etablierte Paarung wahrt sowohl den Hinweischarakter von σημεῖα als auch den Staunen erregenden Charakter von τέρατα.
- source_word: ὥστε πλανῆσαι
  choice: um … irrezuführen
  rationale: Die deutsche Infinitivkonstruktion gibt die auf Zweck oder Ergebnis offene Folgebeziehung von ὥστε mit Infinitiv knapp wieder, ohne sie dogmatisch zu verengen.
- source_word: εἰ δυνατὸν
  choice: wenn möglich
  rationale: Dies entspricht der knappen griechischen Bedingungsformulierung und fügt keinen ausdrücklich irrealen Sinn hinzu.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: sogar die Erwählten
  rationale: καί hat hier steigernde Bedeutung („sogar“); „die Erwählten“ ist eine präzise und geläufige Wiedergabe von τοὺς ἐκλεκτούς.
theological_decisions:
- issue: Wiedergabe von ψευδόχριστοι
  choice: falsche Messiasse
  alternative: falsche Christusse
  rationale: Da Χριστός hier als Titel für beanspruchte messianische Gestalten fungiert, gibt „Messiasse“ den jüdisch-messianischen Kontext klarer wieder, ohne eine konfessionelle Deutung einzutragen.
- issue: Aussagekraft von εἰ δυνατὸν hinsichtlich der Erwählten
  choice: wenn möglich
  alternative: wenn es möglich wäre
  rationale: Der griechische Text lässt die theologische Folgerung unausgesprochen. Die direkte konditionale Form bewahrt diese Spannung, statt die Möglichkeit ausdrücklich als irreal zu kennzeichnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Register. Die Satzstellung hält „wenn möglich“ eng beim Vorgang des Irreführens und wahrt die knappe Bedingungsform des Ausgangstextes.
