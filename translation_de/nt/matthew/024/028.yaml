  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: de
  text: Wo auch immer der Leichnam ist, dort werden sich die Geier[a] sammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Adler“. Das griechische Wort kann Adler bezeichnen; zum Bild von Vögeln, die sich um einen Leichnam sammeln, passt hier jedoch „Geier“ besser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Wo auch immer … ist
  rationale: Die Verbindung von ὅπου mit ἐάν und dem Konjunktiv ᾖ hat einen indefiniten relativen Sinn. „Wo auch immer“ gibt diesen im modernen Deutschen natürlich wieder.
- source_word: πτῶμα
  choice: Leichnam
  rationale: πτῶμα bezeichnet hier einen toten Körper. „Leichnam“ ist präzise, würdig und lässt offen, worauf das Bild im größeren Zusammenhang verweist.
- source_word: συναχθήσονται
  choice: werden sich … sammeln
  rationale: Obwohl die Form grammatisch passiv ist, lässt sie sich bei diesem Subjekt im Deutschen natürlich reflexiv-intransitiv wiedergeben. „Werden sich sammeln“ bewahrt den Zukunftsbezug ohne eine unnötig hölzerne Formulierung.
- source_word: ἀετοί
  choice: Geier
  rationale: ἀετός kann „Adler“ bezeichnen; bei Vögeln, die sich um einen Leichnam sammeln, passt „Geier“ jedoch am besten zum Bild. Die lexikalische Alternative wird in einer Fußnote erhalten.
theological_decisions:
- issue: Deutung des sprichwörtlichen Bildes
  choice: Das Bild wird ohne ausdrückliche symbolische Auflösung wiedergegeben.
  alternative: Das Wort als Aussage über unausweichliches Gericht, die sichtbare Ankunft des Menschensohnes, die Zerstörung Jerusalems oder römische Feldzeichen erklären.
  rationale: Der griechische Vers benennt nicht ausdrücklich, wofür Leichnam und Vögel stehen. Die Übersetzung sollte diese eschatologische und theologische Spannung nicht zugunsten einer einzelnen Deutung auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die knappe, sprichwortartige Struktur des griechischen Satzes bleibt erhalten.
