  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: de
  text: Ebenso erkennt auch ihr, wenn ihr dies alles seht, dass es nahe ist[a], vor den Türen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass er nahe ist“. Im Griechischen wird das Subjekt nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: So auch ihr
  rationale: Bewahrt knapp den Vergleich mit dem Bild vom Feigenbaum und die Hervorhebung der Jünger.
- source_word: ὅταν ἴδητε
  choice: wenn ihr … seht
  rationale: Gibt die auf einen erwarteten zukünftigen Fall bezogene Zeitangabe natürlich wieder; „wann immer“ würde unnötig einen wiederholten Vorgang nahelegen.
- source_word: πάντα ταῦτα
  choice: dies alles
  rationale: Gibt die Gesamtheit der genannten Dinge idiomatisch wieder, ohne sie deutend als bestimmte „Ereignisse“ festzulegen.
- source_word: γινώσκετε
  choice: erkennt
  rationale: Vermittelt den imperativischen Sinn und passt natürlich zur Schlussfolgerung aus dem Wahrgenommenen.
- source_word: ἐγγύς ἐστιν
  choice: es ist nahe
  rationale: Das griechische Verb nennt kein ausdrückliches Subjekt. Das unpersönliche „es“ vermeidet eine vorschnelle Festlegung auf eine Person oder ein Ereignis.
- source_word: ἐπὶ θύραις
  choice: vor den Türen
  rationale: Bewahrt den griechischen Plural und gibt das Bild äußerster Nähe in verständlichem Deutsch wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐγγύς ἐστιν
  choice: „es ist nahe“
  alternative: „er ist nahe“
  rationale: Der griechische Text lässt offen, ob etwa der Menschensohn oder das angekündigte Geschehen gemeint ist. Die Übersetzung bewahrt diese echte Mehrdeutigkeit; die personenbezogene Lesart wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die vergleichende Einleitung verständlich; „vor den Türen“ erhält bewusst den Plural des Ausgangstextes.
