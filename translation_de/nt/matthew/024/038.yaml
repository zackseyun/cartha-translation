  terminology: „Flut“, „Arche“ und „heiraten“ sind sachgerecht und im biblischen Kontext etabliert. Die Fußnote wird präzisiert, damit „jemanden verheiraten“ nicht fälschlich als bloßes eigenes Heiraten verstanden wird.
