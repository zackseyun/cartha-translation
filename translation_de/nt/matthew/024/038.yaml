  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: de
  text: Denn wie sie in den Tagen vor der Flut aßen und tranken, heirateten und andere in die Ehe gaben[a], bis zu dem Tag, an dem Noah in die Arche ging,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heirateten und verheiratet wurden“. Das Griechische unterscheidet zwischen γαμοῦντες und γαμίζοντες; das zweite Wort bezeichnet aktiv, dass jemand eine andere Person in die Ehe gibt, kann in diesem Zusammenhang aber auch im Sinn der Personen verstanden werden, die in die Ehe gegeben werden.'
    reason: lexikalische Alternative und Bewahrung einer echten Deutungsbreite
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Denn wie
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ, während „wie“ den Vergleich einleitet und natürlich an den vorherigen Vers anschließt.
- source_word: ἦσαν … τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ γαμίζοντες
  choice: sie … aßen und tranken, heirateten und andere verheirateten
  rationale: Die Verbindung des Imperfekts mit den Partizipien beschreibt fortdauernde, gewöhnliche Tätigkeiten. Im Deutschen gibt das Imperfekt diesen Verlauf natürlich wieder, ohne eine moralische Wertung hinzuzufügen.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: in den Tagen vor der Flut
  rationale: Die Wendung ist zeitlich zu verstehen; „Flut“ ist im Zusammenhang mit Noah klar, geläufig und bewahrt den Bezug zur Genesis.
- source_word: τρώγοντες καὶ πίνοντες
  choice: aßen und tranken
  rationale: Die Verben bezeichnen alltägliche Handlungen. Die schlichte Wiedergabe vermeidet, Ausschweifung oder Trunkenheit in den Text hineinzulesen.
- source_word: γαμοῦντες
  choice: heirateten
  rationale: γαμέω bedeutet hier „heiraten“ und bezeichnet die Eheschließung der betreffenden Personen.
- source_word: γαμίζοντες
  choice: andere verheirateten
  rationale: Die transitive Wiedergabe erhält den lexikalischen Unterschied zu γαμοῦντες und bezeichnet, dass jemand eine andere Person in die Ehe gibt beziehungsweise deren Heirat veranlasst. Die mögliche alternative Deutung wird in der Fußnote offengelegt.
- source_word: ἄχρι ἧς ἡμέρας
  choice: bis zu dem Tag, an dem
  rationale: Die Formulierung markiert den zeitlichen Endpunkt der zuvor beschriebenen fortdauernden Tätigkeiten und klingt im modernen Deutschen natürlich.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Noah in die Arche ging
  rationale: Der Aorist bezeichnet das entscheidende Ereignis. „In die Arche ging“ ist idiomatisch; „Arche“ ist die etablierte Bezeichnung im Noah-Bericht und bewahrt den intertextuellen Bezug.
theological_decisions:
- issue: Ob Essen, Trinken und Heiraten als sündige Ausschweifung oder als gewöhnliches Leben vor dem unerwarteten Gericht darzustellen sind
  choice: Die Tätigkeiten werden neutral als gewöhnliche menschliche Handlungen wiedergegeben.
  alternative: Eine Übersetzung mit Anklängen an Genussucht, Trunkenheit oder moralische Sorglosigkeit.
  rationale: Die griechischen Partizipien enthalten für sich keine ausdrückliche moralische Qualifizierung. Im Zusammenhang liegt der Nachdruck auf dem Fortgang des normalen Lebens bis zum plötzlich eintretenden Gericht; eine zusätzliche Verurteilung dieser Handlungen wäre interpretierend.
- issue: Die Rollenverteilung in γαμοῦντες καὶ γαμίζοντες
  choice: „heirateten und andere verheirateten“ erhält zwei unterschiedliche, aktive Vorgänge.
  alternative: „heirateten und verheiratet wurden“ versteht das zweite Partizip sinngemäß als Hinweis auf die Personen, die in die Ehe gegeben wurden.
  rationale: γαμίζω wird häufig transitiv im Sinn von „jemanden verheiraten/in die Ehe geben“ gebraucht. Da im Kontext auch eine Wiedergabe nach den beiden Seiten einer Eheschließung vertreten wird, bleibt diese Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das Imperfekt bildet die fortdauernden Alltagshandlungen natürlich ab. Die Formulierung „andere verheirateten“ ist bewusst etwas markierter, um den Unterschied der beiden griechischen Verben sichtbar zu halten; die alternative Rollenverteilung wird in der Fußnote genannt.
