id: MAT.24.22
reference: Matthew 24:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: de
  text: Und wenn jene Tage nicht verkürzt worden wären[a], wäre kein Mensch[b] gerettet worden; doch um der Erwählten willen werden jene Tage verkürzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „nicht abgekürzt worden wären … abgekürzt werden“. Das griechische Verb bezeichnet ein Verkürzen oder vorzeitiges Beenden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „alles Fleisch“. Dies ist eine biblische Ausdrucksweise für die Menschen beziehungsweise alle sterblichen Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: nicht verkürzt worden wären / verkürzt werden
  rationale: κολοβόω bezeichnet hier das Verkürzen beziehungsweise vorzeitige Beenden eines Zeitraums. „Verkürzt“ ist im modernen Deutschen bei Tagen natürlich und gibt beide griechischen Passivformen präzise wieder.
- source_word: οὐκ ἂν ἐσώθη
  choice: wäre … gerettet worden
  rationale: Die Verbindung aus ἄν und Aorist Indikativ drückt die nicht eingetretene Folge einer irrealen Bedingung aus. „Gerettet“ bewahrt die Bedeutungsbreite von σῴζω; im Zusammenhang steht besonders die Bewahrung des Lebens im Vordergrund, ohne dass dies durch „überlebt“ abschließend festgelegt wird.
- source_word: πᾶσα σάρξ
  choice: kein Mensch
  rationale: Die Wendung „alles Fleisch“ bezeichnet idiomatisch die gesamte sterbliche Menschheit; zusammen mit der Verneinung ist im Deutschen „kein Mensch“ die klare, natürliche Entsprechung. Eine wörtliche Wiedergabe als „nicht alles Fleisch“ könnte fälschlich bedeuten, einige würden dennoch gerettet.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: doch um der Erwählten willen
  rationale: διά mit Akkusativ bezeichnet hier den Grund beziehungsweise die begünstigten Personen. „Um … willen“ bewahrt diese Nuance, während „die Erwählten“ die Bezeichnung der Gruppe ohne zusätzliche Identifizierung wiedergibt.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: jene Tage
  rationale: „Jene Tage“ gibt die rückverweisende und hervorgehobene Kraft des Demonstrativpronomens ἐκεῖναι knapp und würdig wieder.
- source_word: καὶ εἰ μὴ
  choice: Und wenn … nicht
  rationale: Die Formulierung erhält sowohl die anknüpfende Konjunktion καί als auch die ausdrückliche Bedingungsstruktur des Griechischen.
theological_decisions:
- issue: Bedeutung der „Erwählten“ in der endzeitlichen Rede
  choice: Die Bezeichnung „die Erwählten“ wird ohne erklärende Erweiterung beibehalten.
  alternative: Gottes erwähltes Volk; die Gläubigen; der treue Rest
  rationale: Der Vers bezeichnet die Gruppe als ἐκλεκτοί, bestimmt ihren genauen heilsgeschichtlichen Umfang an dieser Stelle jedoch nicht. Die offene Formulierung vermeidet eine konfessionelle Festlegung.
- issue: Bedeutung von σῴζω im Zusammenhang
  choice: „gerettet“ mit kontextuell möglicher Bedeutung der Lebensrettung
  alternative: überlebt; am Leben geblieben
  rationale: Die Bedrängnis legt körperliches Überleben nahe, doch σῴζω hat einen weiteren Bedeutungsumfang. „Gerettet“ wahrt diese Spannung und schränkt den Ausdruck weder rein körperlich noch ausschließlich heilsgeschichtlich ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau folgt der griechischen Bedingungsstruktur, ohne unnatürlich zu wirken. „Kein Mensch“ ersetzt die im heutigen Deutschen missverständliche wörtliche Wendung „alles Fleisch“, während die Fußnote das Bild transparent macht.
