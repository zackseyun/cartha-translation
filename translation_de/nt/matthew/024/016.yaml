lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das Temporaladverb markiert die zeitliche Folge innerhalb der Rede Jesu; „Dann“ ist knapp, natürlich und wahrt diese Funktion.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: die Menschen in Judäa
  rationale: Der substantivierte präpositionale Ausdruck bezeichnet die Personen, die sich in Judäa befinden. „Die Menschen in Judäa“ ist im modernen Deutsch klar und vermeidet das weniger natürliche „die in Judäa“.
- source_word: Ἰουδαίᾳ
  choice: Judäa
  rationale: „Judäa“ ist die geläufige deutsche Form des geografischen Namens.
- source_word: φευγέτωσαν
  choice: sollen … fliehen
  rationale: Der Imperativ der dritten Person Plural erteilt eine dringliche Anweisung. „Sollen … fliehen“ gibt diese Befehlsfunktion im Deutschen natürlich wieder, ohne sie durch „müssen“ unnötig zu verstärken.
- source_word: ἐπὶ τὰ ὄρη
  choice: in die Berge
  rationale: ἐπί mit Akkusativ bezeichnet beim Bewegungsverb das Ziel. Die idiomatische deutsche Wendung „in die Berge fliehen“ bringt die Bewegung in das Bergland treffend zum Ausdruck.
theological_decisions:
- issue: Kraft des Imperativs in einer endzeitlichen Warnung
  choice: als direkte, dringliche Anweisung mit „sollen … fliehen“
  alternative: „müssen … fliehen“ oder formal näher „mögen … fliehen“
  rationale: Der Vers gibt eine praktische Anweisung. „Sollen“ wahrt den imperativischen Charakter und die Dringlichkeit, ohne zusätzliche eschatologische Deutungen oder eine über den griechischen Imperativ hinausgehende Zwangsnuance einzutragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wortstellung ist idiomatisch; „Menschen“ verdeutlicht den substantivierten griechischen Ausdruck, ohne die bezeichnete Gruppe näher festzulegen.
