id: MAT.24.43
reference: Matthew 24:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: de
  text: 'Das aber sollt ihr wissen: Wenn der Hausherr gewusst hätte, zu welcher Nachtwache[a] der Dieb kommen würde, wäre er wach geblieben und hätte nicht zugelassen, dass sein Haus durchgraben würde[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Nacht wurde in mehrere Wachzeiten eingeteilt.
    reason: cultural_note
  - marker: b
    text: Gemeint ist das Durchgraben oder Durchbrechen einer Hauswand, um einzubrechen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Das aber sollt ihr wissen
  rationale: Gibt den Diskurswechsel durch δέ und die auffordernde Kraft des Präsens γινώσκετε natürlich und würdig wieder.
- source_word: οἰκοδεσπότης
  choice: der Hausherr
  rationale: Bezeichnet den Haushaltsvorstand beziehungsweise Herrn des Hauses; „Hausherr“ ist prägnant und vermeidet die moderne Eigentumsannahme von „Hausbesitzer“.
- source_word: ποίᾳ φυλακῇ
  choice: in welcher Nachtwache
  rationale: φυλακή bezeichnet hier einen zeitlichen Abschnitt der Nacht. Die ausdrückliche Ergänzung „Nacht-“ macht den kulturellen Begriff im Deutschen verständlich.
- source_word: ὁ κλέπτης ἔρχεται
  choice: der Dieb kommt
  rationale: Bewahrt das griechische Präsens innerhalb der indirekten, irrealen Bedingung; das Deutsche lässt diese spannungsreiche Zeitform natürlich zu.
- source_word: ἐγρηγόρησεν ἂν
  choice: wäre er wach geblieben
  rationale: γρηγορέω bedeutet hier angesichts des nächtlichen Einbruchs konkret, wach zu bleiben; die irreale Folge wird durch den Konjunktiv II der Vergangenheit wiedergegeben.
- source_word: οὐκ ἂν εἴασεν
  choice: hätte nicht zugelassen
  rationale: Gibt die verhindernde Handlung des Hausherrn klar wieder und wahrt die irreale Aussage.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: dass sein Haus durchgraben wird
  rationale: Bewahrt das konkrete Bild des Verbs διορύσσω, das das Durchgraben beziehungsweise Durchbrechen einer Hauswand bezeichnet, statt es allgemein als Einbruch aufzulösen.
theological_decisions:
- issue: Bild des Hausherrn
  choice: der Hausherr
  alternative: der Hausbesitzer
  rationale: Das Gleichnis bezeichnet die leitende Person des Haushalts, ohne eine moderne rechtliche Eigentümerschaft vorauszusetzen.
- issue: Kulturell spezifisches Einbruchsbild
  choice: dass sein Haus durchgraben wird
  alternative: dass in sein Haus eingebrochen wird
  rationale: Die konkrete antike Bildsprache wird im Haupttext erhalten; die Fußnote erklärt, dass damit das Durchbrechen einer Wand und somit ein Einbruch gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang; „Nachtwache“ und „durchgraben“ bewahren die kulturell konkrete Bildsprache und werden knapp erläutert.
