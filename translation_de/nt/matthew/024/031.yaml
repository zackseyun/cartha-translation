id: MAT.24.31
reference: Matthew 24:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: de
  text: Und er wird seine Engel mit lautem Posaunenschall[a] aussenden, und sie werden seine Erwählten[b] aus den vier Winden[c] sammeln, von einem Ende des Himmels bis zum anderen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einer mächtigen Posaune“; auch möglich: „unter mächtigem Posaunenschall“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „seine Auserwählten“ oder „die von ihm Ausgewählten“.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung „die vier Winde“ bezeichnet bildhaft die äußersten Bereiche in allen Richtungen.
    reason: cultural_note
  - marker: d
    text: 'Wörtlicher: „von den Enden der Himmel bis zu ihren Enden“; gemeint ist die ganze Ausdehnung von einem äußersten Ende bis zum anderen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: wird … aussenden
  rationale: Das Futur von ἀποστέλλω bezeichnet hier das Aussenden der Engel. „Aussenden“ gibt den Gedanken eines beauftragten Sendens natürlich und präzise wieder.
- source_word: ἀγγέλους
  choice: Engel
  rationale: Im endzeitlichen Zusammenhang sind himmlische Wesen gemeint; „Boten“ wäre hier unnötig mehrdeutig.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: mit lautem Posaunenschall
  rationale: μετά mit Genitiv bezeichnet die Begleitung; σάλπιγξ ist die Posaune beziehungsweise ihr Signal, und μεγάλη kann hier die gewaltige Lautstärke ausdrücken. „Posaunenschall“ ist im Deutschen natürlicher als „laute Posaune“, während eine Fußnote die formnäheren Möglichkeiten nennt.
- source_word: ἐπισυνάξουσιν
  choice: sie werden … sammeln
  rationale: Das Verb bezeichnet das Zusammenbringen an einem Ort. „Sammeln“ gibt dies im Deutschen ohne überflüssige Verstärkung wieder; Subjekt sind die Engel.
- source_word: τοὺς ἐκλεκτοὺς αὐτοῦ
  choice: seine Erwählten
  rationale: „Erwählte“ bewahrt die Bedeutung von ἐκλεκτοί und das Possessivpronomen αὐτοῦ, ohne im Vers eine weitergehende dogmatische Erklärung einzutragen.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: aus den vier Winden
  rationale: Die biblische Bildsprache wird beibehalten. Die Wendung bezeichnet alle Himmelsrichtungen beziehungsweise die äußersten Bereiche in jeder Richtung.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: von einem Ende des Himmels bis zum anderen
  rationale: Die idiomatische deutsche Wendung vermittelt die vollständige räumliche Erstreckung. Eine Fußnote dokumentiert die ungewöhnliche griechische Pluralform und ihre wörtlichere Wiedergabe.
theological_decisions:
- issue: Wiedergabe von ἐκλεκτούς im endzeitlichen Zusammenhang
  choice: seine Erwählten
  alternative: die von ihm Ausgewählten
  rationale: Die Formulierung benennt die Menschen als von ihm erwählt, ohne die Aussage einer bestimmten konfessionellen Erwählungslehre zuzuordnen.
- issue: Räumlicher Umfang der Sammlung
  choice: aus den vier Winden … von einem Ende des Himmels bis zum anderen
  alternative: aus allen vier Himmelsrichtungen, von einem äußersten Punkt zum anderen
  rationale: Die Übersetzung bewahrt das umfassende kosmische Bild des Ausgangstextes und verengt es nicht ausdrücklich auf ein bestimmtes geografisches Gebiet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Aufbau, während „Posaunenschall“ und die Schlusswendung idiomatisches Deutsch gewährleisten. Die traditionelle biblische Bildsprache „vier Winde“ bleibt erhalten und wird erläutert.
