review_pass:
  verdict: approve
  source_fidelity: Der Haupttext gibt ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται treffend wieder. „Wer aber … standhält“ bildet die substantivische, repräsentative Personenbezeichnung idiomatisch ab; „bis zum Ende“ bewahrt die zeitliche Offenheit von εἰς τέλος; und „wird gerettet werden“ entspricht dem futurischen Passiv σωθήσεται, ohne dessen Umfang unzulässig auf zeitliche Bewahrung oder endgültiges Heil einzuengen. Das im Griechischen resumptive οὗτος wird durch die deutsche Wer-dann-Konstruktion ausreichend mitgetragen.
  naturalness: „Wer aber bis zum Ende standhält, wird gerettet werden“ ist flüssiges, modernes Standarddeutsch in einem angemessen würdevollen Bibelregister. Eine zusätzliche, wörtlichere Wiederaufnahme wie „der wird“ wäre möglich, aber stilistisch nicht nötig.
  terminology: '„standhält“ gibt ὑπομένω im Kontext von Bedrängnis und Verfolgung klar und ohne konfessionelle Überdeutung wieder. „gerettet werden“ ist für σῴζω die passende breite Formulierung. Die Fußnoten sind sinnvoll verankert: [a] bei der Endpunktformulierung und [b] bei „gerettet werden“.'
