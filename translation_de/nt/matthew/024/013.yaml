  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: de
  text: Wer aber bis zum Ende standhält, wird gerettet werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis ans Ende“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird befreit werden“. Das griechische Wort kann Rettung, Befreiung oder Heil bezeichnen; der Haupttext wahrt den weiteren Sinn, weil der Zusammenhang keine engere Festlegung verlangt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: wer ... standhält
  rationale: Der Artikel mit dem substantivierten Aoristpartizip bezeichnet die Person, die durch ihr Standhalten gekennzeichnet ist. Die deutsche Relativkonstruktion ist natürlich, geschlechtsneutral und wahrt den repräsentativen Singular.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert gegenüber den vorausgehenden Warnungen einen leichten Kontrast; „aber“ gibt diesen Zusammenhang knapp und idiomatisch wieder.
- source_word: ὑπομείνας (ὑπομένω)
  choice: standhält
  rationale: Das Verb bezeichnet das Ausharren beziehungsweise Standhalten unter Bedrängnis. „standhält“ ist allgemein verständlich und vermeidet eine unnötig konfessionell geprägte Deutung.
- source_word: εἰς τέλος
  choice: bis zum Ende
  rationale: Die Wendung bezeichnet das Fortdauern bis zu einem Endpunkt. „bis zum Ende“ ist im modernen Deutsch die natürliche Entsprechung und lässt offen, welches Ende im Kontext genau gemeint ist.
- source_word: οὗτος
  choice: durch die deutsche Konstruktion „wer …, wird …“ wiedergegeben
  rationale: Das resumptive οὗτος hebt die zuvor bezeichnete Person hervor. Eine wörtliche Ergänzung wie „der wird“ wäre möglich, wirkt hier aber schwerer; die Korrelativkonstruktion bewahrt den Fokus ausreichend und liest sich natürlicher.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Der Futur Passiv von σῴζω kann Rettung, Befreiung oder Heil bezeichnen. „gerettet werden“ bewahrt die Breite des Ausdrucks und legt die Art der Rettung nicht fest.
theological_decisions:
- issue: Bedeutung der Rettung im eschatologischen Zusammenhang des Standhaltens
  choice: Die umfassende Formulierung „wird gerettet werden“ bleibt ohne nähere Bestimmung stehen.
  alternative: „wird befreit werden“ oder ausdrücklich „wird das endgültige Heil erlangen“
  rationale: Der Vers legt nicht ausdrücklich fest, ob zeitliche Befreiung, endgültige eschatologische Rettung oder beides gemeint ist. Die Übersetzung wahrt diese theologische Spannung und trifft keine konfessionelle Vorentscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „standhält“ ist unmittelbar verständlich und vermittelt Belastbarkeit unter Bedrängnis; die Satzform ist knapp und für öffentliche wie persönliche Lektüre geeignet.
