source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: de
  text: Glücklich ist jener Diener, den sein Herr, wenn er kommt, so handeln finden wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Glücklich
  rationale: Gibt die Seligpreisungsformel in natürlichem, gegenwärtigem Deutsch wieder, ohne sie auf ein bloßes Gefühl zu beschränken.
- source_word: δοῦλος
  choice: Diener
  rationale: Passt zum Bild eines Hausverwalters im unmittelbaren Zusammenhang; „Sklave“ wäre lexikalisch möglich, würde hier aber den funktionalen Kontext weniger natürlich ausdrücken.
- source_word: κύριος
  choice: Herr
  rationale: Bewahrt die übliche Entsprechung und die mögliche theologische Resonanz des griechischen Wortes, während im Gleichnis zunächst der Hausherr gemeint ist.
- source_word: ἐλθών
  choice: bei seiner Rückkehr
  rationale: Der Herr kommt zu seinem Haus zurück; die nominale Wendung bildet den zeitlichen Zusammenhang idiomatisch ab.
- source_word: οὕτως ποιοῦντα
  choice: so handeln sieht
  rationale: Verweist knapp auf das zuvor beschriebene pflichtbewusste Austeilen der Nahrung und gibt εὑρήσει ... ποιοῦντα natürlich wieder.
theological_decisions:
- issue: Bezeichnung des κύριος im Gleichnis
  choice: Herr
  alternative: Hausherr / Dienstherr
  rationale: „Herr“ erhält sowohl die erzählerische Bedeutung als auch den im Kontext naheliegenden Bezug auf den Menschensohn, ohne die Bild- und Sachebene ausdrücklich gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und sprichwortartig wie der griechische Satz. Keine Fußnote erforderlich.
