revisions:
- from: Glücklich ist jener Diener, den sein Herr bei seiner Rückkehr so handeln sieht.
  to: Glücklich ist jener Diener, den sein Herr, wenn er kommt, so handeln finden wird.
  rationale: Die Revision vermeidet die nicht ausdrücklich markierte Spezifizierung „Rückkehr“ und stellt das Futur von εὑρήσει wieder her. Die knappe, würdige Form sowie die im Entwurf gewählten Begriffe „Glücklich“, „Diener“ und „Herr“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:17:20Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt μακάριος, δοῦλος, κύριος und den Partizipialsatz insgesamt treffend wieder. „bei seiner Rückkehr“ ist im Gleichniskontext möglich, doch ἐλθών bedeutet unmittelbar „wenn/als er kommt“ und sollte nicht stärker als Rückkehr spezifiziert werden. Außerdem steht εὑρήσει im Futur; „sieht“ schwächt diese Zukunftsaussage ab.
  naturalness: „Glücklich ist jener Diener“ ist modernes, würdiges Standarddeutsch. Die Formulierung mit „wenn sein Herr kommt“ und „finden wird“ ist ebenso natürlich und bildet den griechischen Satzbau klar ab.
  terminology: „Diener“ ist im gegebenen Gleichniskontext als kontextuelle Wiedergabe von δοῦλος vertretbar; „Herr“ entspricht κύριος und wahrt die narrative wie mögliche weiterführende Resonanz. Keine Fußnote ist erforderlich.
  issues:
  - severity: medium
    issue: ἐλθών wird als „bei seiner Rückkehr“ wiedergegeben.
    rationale: Das griechische Partizip sagt lediglich, dass der Herr kommt. Eine Rückkehr liegt im Gleichnis nahe, wird aber nicht ausdrücklich gesagt; „wenn sein Herr kommt“ bewahrt die Formulierung des Ausgangstextes.
  - severity: medium
    issue: Das futurische εὑρήσει wird mit dem Präsens „sieht“ wiedergegeben.
    rationale: Der Text blickt auf das künftige Kommen und Finden des Herrn. „finden wird“ erhält Tempus und Aussageperspektive.
  revised_text: Glücklich ist jener Diener, den sein Herr, wenn er kommt, so handeln finden wird.
  revised_footnotes: []
