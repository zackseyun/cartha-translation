id: MAT.24.14
reference: Matthew 24:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: de
  text: Und diese gute Nachricht vom Reich wird in der ganzen Welt verkündet werden, allen Völkern zum Zeugnis; und dann wird das Ende kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: wird verkündet werden
  rationale: Das Futur Passiv bezeichnet eine öffentliche Bekanntmachung. „Verkündet“ bewahrt diesen Sinn und ist im Deutschen natürlich, ohne die Aussage auf eine bestimmte kirchliche Predigtform einzuengen.
- source_word: εὐαγγέλιον
  choice: gute Nachricht
  rationale: Dies gibt die Grundbedeutung transparent und in heutiger Sprache wieder; „Evangelium“ wäre als kirchlich geprägter Fachausdruck ebenfalls möglich.
- source_word: τῆς βασιλείας
  choice: vom Reich
  rationale: Der Genitiv bezeichnet die gute Nachricht, deren Gegenstand beziehungsweise Inhalt das Reich ist. „Vom Reich“ klingt im Deutschen natürlicher als „des Reiches“, ohne die Konstruktion stärker auszulegen.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: in der ganzen Welt
  rationale: οἰκουμένη meint die bewohnte Welt beziehungsweise die Menschenwelt. Die gewählte Formulierung ist idiomatisch und erhält die umfassende Reichweite.
- source_word: εἰς μαρτύριον
  choice: zum Zeugnis
  rationale: Die Wendung lässt Zweck und Ergebnis anklingen. „Zum Zeugnis“ bewahrt diese Offenheit und legt nicht fest, ob das Zeugnis zugunsten oder gegen die Hörer wirkt.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: allen Völkern
  rationale: ἔθνη bezeichnet hier breit die Völker der Welt. „Völkern“ ist im Deutschen natürlicher und semantisch treffender als „Nationen“ und vermeidet die mögliche Verengung auf „Heiden“.
- source_word: ἥξει
  choice: wird kommen
  rationale: Die schlichte eschatologische Aussage wird idiomatisch und ohne zusätzliche Deutung wiedergegeben.
- source_word: τὸ τέλος
  choice: das Ende
  rationale: „Das Ende“ entspricht der offenen und gewichtigen Formulierung des Griechischen; Ausdrücke wie „Vollendung“ oder „Endzeit“ wären stärker deutend.
theological_decisions:
- issue: Reichweite von οἰκουμένη und ἔθνη in der eschatologischen Aussage
  choice: 'Die Aussage wird mit umfassender Sprache wiedergegeben: „in der ganzen Welt“ und „allen Völkern“.'
  alternative: „in der ganzen bewohnten Welt“ beziehungsweise „allen Nationen“
  rationale: So bleibt die universale Reichweite erhalten, ohne sie auf das Römische Reich zu beschränken oder mit einem bestimmten Missions- oder Endzeitschema gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Aufbau, während „vom Reich“ und „in der ganzen Welt“ idiomatisches Deutsch gewährleisten. Keine Fußnoten sind nötig, da die wichtigsten Bedeutungsnuancen im Haupttext angemessen erhalten bleiben.
