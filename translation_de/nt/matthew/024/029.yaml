reference: Matthew 24:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: de
  text: Doch unmittelbar nach der Bedrängnis jener Tage wird die Sonne verfinstert werden, und der Mond wird sein Licht nicht geben, und die Sterne werden vom Himmel[a] fallen, und die Kräfte der Himmel[b] werden erschüttert werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Himmelsraum“. Das griechische Wort kann den Himmel oder den sichtbaren Himmel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Die Kräfte der Himmel“ kann kosmische Kräfte, Himmelskörper oder himmlische Mächte bezeichnen; der griechische Ausdruck bleibt bewusst weit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Doch unmittelbar
  rationale: „Unmittelbar“ bewahrt die starke zeitliche Aussage von Εὐθέως; „doch“ markiert den Übergang mit leichter Gegenüberstellung, ohne einen stärkeren Gegensatz einzutragen.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: nach der Bedrängnis jener Tage
  rationale: „Bedrängnis“ gibt θλῖψις in heutigem, verständlichem Deutsch wieder und bewahrt zugleich das Gewicht des Ausdrucks. Der Genitiv „jener Tage“ folgt der griechischen Beziehung.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: die Sonne wird verfinstert werden
  rationale: Die Formulierung bildet das griechische Futur Passiv ab und wahrt den feierlich-prophetischen Ton.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: der Mond wird sein Licht nicht geben
  rationale: Die konkrete Bildsprache des Griechischen bleibt erhalten; „sein Licht geben“ ist im Deutschen klar und natürlich.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: die Sterne werden vom Himmel fallen
  rationale: Das einfache Futur entspricht πεσοῦνται. „Himmel“ bewahrt das erhöhte biblische Register, während eine Fußnote die ebenfalls mögliche Bedeutung „Himmelsraum“ nennt.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: die Mächte der Himmel
  rationale: Die weit gefasste Bedeutung von δυνάμεις und der griechische Genitiv Plural bleiben erhalten. Die Formulierung legt nicht fest, ob kosmische Kräfte, Himmelskörper oder himmlische Mächte gemeint sind.
- source_word: σαλευθήσονται
  choice: werden erschüttert werden
  rationale: „Erschüttert werden“ gibt das Futur Passiv transparent wieder und ist sowohl für eine kosmische als auch eine bildhafte Lesart offen.
theological_decisions:
- issue: Art der kosmischen Zeichen in apokalyptischer Rede
  choice: Die kosmischen Bilder werden unmittelbar wiedergegeben, ohne ihre Deutung festzulegen.
  alternative: Die Aussagen ausschließlich als wörtliche astronomische Ereignisse oder ausschließlich als Sinnbilder politischer und gerichtlicher Umwälzungen zu übersetzen.
  rationale: Der griechische Text verwendet prophetisch-apokalyptische Bildsprache, entscheidet hier aber nicht ausdrücklich zwischen einer wörtlichen, symbolischen oder beide Ebenen umfassenden Deutung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die wiederholten Futur-Passiv-Formen und die kosmische Reihung des griechischen Textes bleiben erhalten. Die Fußnotenmarker wurden jeweils an die tatsächlich erläuterten Ausdrücke gesetzt.
