id: MAT.24.15
reference: Matthew 24:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: de
  text: Wenn ihr nun den Gräuel der Verwüstung, von dem durch den Propheten Daniel gesprochen wurde, an einem heiligen Ort stehen seht – der Leser soll es verstehen –,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditioneller: „an dem heiligen Ort“; auch: „im Heiligtum“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „den verwüstenden Gräuel“ beziehungsweise „den Gräuel, der Verwüstung anrichtet“; eine Anspielung auf Daniel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Wenn ... nun
  rationale: Die temporale Konjunktion mit Konjunktiv bezeichnet ein erwartetes zukünftiges Geschehen; „wenn“ ist im prophetischen Zusammenhang natürlich. „Nun“ bewahrt den folgernden beziehungsweise überleitenden Charakter von οὖν.
- source_word: ἴδητε
  choice: ihr ... seht
  rationale: Die direkte Wiedergabe von ὁράω erhält sowohl den Wahrnehmungssinn als auch die Anrede im Plural.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: den Gräuel der Verwüstung
  rationale: Die formnahe, in der Danielüberlieferung erkennbare Wendung bewahrt die Genitivkonstruktion und lässt offen, ob Verwüstung als Wirkung, Kennzeichen oder nähere Bestimmung des Gräuels gemeint ist.
- source_word: τὸ ῥηθὲν
  choice: von dem ... gesprochen wurde
  rationale: Das substantivbezogene Partizip wird als Relativsatz natürlich ins Deutsche übertragen und bezeichnet die prophetische Erwähnung dieses Gräuels.
- source_word: διὰ Δανιὴλ τοῦ προφήτου
  choice: durch den Propheten Daniel
  rationale: „Durch“ gibt διά mit Genitiv als vermittelnde Urheberschaft wieder, ohne Daniel als letzte Quelle der prophetischen Rede festzulegen.
- source_word: ἑστὸς
  choice: stehen
  rationale: Die direkte Wiedergabe des Partizips von ἵστημι vermeidet die interpretierende Erweiterung „aufgestellt“ und folgt seiner grammatischen Beziehung zu βδέλυγμα.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: an einem heiligen Ort
  rationale: Der unbestimmte Artikel spiegelt die artikellose griechische Form; „an einem Ort stehen“ ist im Deutschen idiomatischer als „in einem Ort stehen“.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: wer es liest, soll verstehen
  rationale: Die Formulierung bewahrt die allgemeine Bezeichnung des Lesenden und die auffordernde Kraft des Imperativs. Das ergänzte „es“ ist für natürliches Deutsch erforderlich und bezieht sich auf die schriftliche Aussage.
theological_decisions:
- issue: Bestimmtheit von τόπῳ ἁγίῳ und mögliche Beziehung auf das Heiligtum
  choice: an einem heiligen Ort
  alternative: an dem heiligen Ort / im Heiligtum
  rationale: Die Wendung kann im Zusammenhang den Tempel oder ein bestimmtes Heiligtum meinen, doch die artikellose griechische Form legt diese Präzisierung nicht zwingend fest. Der Haupttext erhält daher die Offenheit; die traditionelle bestimmte Wiedergabe steht in der Fußnote.
- issue: Bedeutung der Daniel-Wendung βδέλυγμα τῆς ἐρημώσεως
  choice: der Gräuel der Verwüstung
  alternative: der verwüstende Gräuel / der Gräuel, der Verwüstung anrichtet
  rationale: Die formale Wendung macht den Bezug auf Daniel sichtbar und löst die semantische Beziehung des Genitivs nicht vorschnell als Wirkung oder Eigenschaft auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die lange prophetische Konstruktion verständlich zusammen; Gedankenstriche kennzeichnen den eingeschobenen Lesehinweis. „Gräuel“ bleibt wegen des Danielbezugs und seines starken religiös-moralischen Gehalts erhalten.
