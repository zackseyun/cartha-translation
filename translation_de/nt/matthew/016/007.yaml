  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: de
  text: 'Sie aber berieten sich miteinander und sagten: »Wir haben kein Brot mitgenommen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir haben kein Brot genommen.«'
    reason: Die Grundbedeutung von ἐλάβομεν ist „nahmen“; im Zusammenhang ist wahrscheinlich das Mitnehmen als Reisevorrat gemeint.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sie aber
  rationale: δέ ist ein schwaches verbindendes beziehungsweise leicht kontrastierendes Partikel. „Aber“ wahrt hier den Übergang und den Bezug auf die vorausgehende Warnung, ohne einen starken Gegensatz zu erzeugen.
- source_word: διελογίζοντο
  choice: berieten sich
  rationale: Das Imperfekt bezeichnet ein andauerndes Überlegen im Gespräch. „Berieten sich“ gibt sowohl den gedanklichen als auch den wechselseitigen Charakter natürlich wieder.
- source_word: ἐν ἑαυτοῖς
  choice: miteinander
  rationale: Die Wendung bezeichnet den Austausch innerhalb der Gruppe. „Miteinander“ ist im Deutschen idiomatisch und vermeidet die schwerfällige Formulierung „unter sich selbst“.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip führt den Inhalt ihrer Beratung ein. Eine koordinierte Verbform ist im modernen deutschen Erzählstil natürlich.
- source_word: Ἄρτους
  choice: Brot
  rationale: Der griechische Plural kann einzelne Brote oder Brot als Reiseproviant bezeichnen. Der deutsche Sammelbegriff „Brot“ passt hier am natürlichsten.
- source_word: οὐκ ἐλάβομεν
  choice: Wir haben kein Brot mitgenommen
  rationale: λαμβάνω bedeutet grundsätzlich „nehmen“, bezeichnet im Reisekontext aber idiomatisch das Mitnehmen von Vorräten. „Mitgenommen“ macht diesen situativen Sinn klar, ohne eine Begründung in den Satz hineinzulesen.
theological_decisions: []
