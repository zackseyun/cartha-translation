source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: de
  text: Denn was nützt es einem Menschen, wenn er die ganze Welt gewinnt, aber sein Leben verliert?[a] Oder was wird ein Mensch als Gegenwert für sein Leben geben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Seele einbüßt“. Das griechische Wort ψυχή kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten; ebenso beim zweiten Vorkommen in diesem Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Denn was
  rationale: τί leitet die rhetorische Frage ein; γάρ verbindet sie begründend mit der vorausgehenden Aussage. „Denn was“ bewahrt beides natürlich.
- source_word: ὠφεληθήσεται
  choice: nützt es
  rationale: Der zukünftige Passivgedanke von ὠφελέω wird im Deutschen idiomatisch durch die unpersönliche Wendung „was nützt es“ wiedergegeben.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: ἄνθρωπος bezeichnet hier generisch einen Menschen; die deutsche Wiedergabe ist genau und natürlich.
- source_word: τὸν κόσμον ὅλον
  choice: die ganze Welt
  rationale: Die geläufige Wendung gibt sowohl κόσμος als auch die umfassende Bedeutung von ὅλος wieder.
- source_word: κερδήσῃ
  choice: gewinnt
  rationale: κερδαίνω bezeichnet Gewinn oder Erwerb und bildet den beabsichtigten wirtschaftlichen Gegensatz zum Verlust.
- source_word: τὴν ... ψυχὴν αὐτοῦ
  choice: sein Leben
  rationale: ψυχή kann Leben, Selbst oder Seele bedeuten. Im Kontext bezeichnet „Leben“ den Menschen in seinem letztgültigen Wert, ohne eine engere anthropologische Lehre festzulegen.
- source_word: ζημιωθῇ
  choice: verliert
  rationale: Das Passiv von ζημιόω bedeutet Verlust erleiden beziehungsweise eingebüßt werden. „Sein Leben verliert“ ist im Deutschen klar und wahrt den Gegensatz zum Gewinnen.
- source_word: ἀντάλλαγμα
  choice: als Gegenwert
  rationale: ἀντάλλαγμα bezeichnet das, was im Tausch oder als Ersatz gegeben wird. „Gegenwert“ erhält das Tauschbild, ohne es auf Lösegeld einzuengen.
- source_word: δώσει
  choice: kann ... geben
  rationale: Die rhetorische Frage zielt darauf, dass kein ausreichender Gegenwert gegeben werden kann. Das deutsche Modalverb macht diese pragmatische Kraft natürlich deutlich, obwohl die griechische Form formal futurisch ist.
theological_decisions:
- issue: Wiedergabe von ψυχή in einer Aussage über den endgültigen Verlust
  choice: Leben
  alternative: Seele
  rationale: Der Kontext verlangt keine scharfe Trennung zwischen Körper und immaterieller Seele. „Leben“ bewahrt den umfassenden Bezug auf die Person; die traditionelle und lexikalisch mögliche Wiedergabe „Seele“ bleibt in der Fußnote sichtbar.
- issue: Kraft der zweiten rhetorischen Frage
  choice: was kann ein Mensch ... geben?
  alternative: was wird ein Mensch ... geben?
  rationale: Das griechische Futur kann in der rhetorischen Frage die Unmöglichkeit eines angemessenen Tausches ausdrücken. „Kann“ vermittelt diese Kraft im heutigen Deutsch, ohne einen bestimmten Heilsmechanismus in den Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die beiden rhetorischen Fragen und das wirtschaftliche Bild von Gewinn, Verlust und Gegenwert bleiben erhalten.
