id: MAT.16.27
reference: Matthew 16:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: de
  text: Denn der Menschensohn steht im Begriff, in der Herrlichkeit seines Vaters mit seinen Engeln zu kommen[a], und dann wird er jedem nach seinem Tun vergelten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird kommen“ oder „wird bald kommen“. Das Griechische bezeichnet ein bevorstehendes Geschehen und kann einen Anklang an zeitliche Nähe enthalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach dem, was er getan hat“. Im Griechischen steht „Tun/Handlung“ in der Einzahl und bezeichnet bei „jedem“ zusammenfassend das jeweilige Verhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει ... ἔρχεσθαι
  choice: wird bald ... kommen
  rationale: Die Verbindung von μέλλω mit dem Infinitiv bezeichnet ein bevorstehendes Geschehen. „Wird bald kommen“ bewahrt diesen Anklang an zeitliche Nähe und klingt im Deutschen natürlicher als „ist im Begriff zu kommen“.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage; „Denn“ gibt diese Verknüpfung knapp und idiomatisch wieder.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die im Deutschen etablierte Wiedergabe bewahrt den Titelcharakter und die intertextuellen Anklänge.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: in der Herrlichkeit seines Vaters
  rationale: „In“ erhält die durch ἐν bezeichnete Sphäre beziehungsweise Offenbarung; der Genitiv bleibt ausdrücklich auf den Vater bezogen.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: mit seinen Engeln
  rationale: μετά mit Genitiv bezeichnet Begleitung; die knappe Formulierung ist genau und natürlich.
- source_word: καὶ τότε
  choice: und dann
  rationale: Die Übersetzung bewahrt sowohl die Verbindung als auch die zeitliche Abfolge.
- source_word: ἀποδώσει
  choice: wird ... vergelten
  rationale: ἀποδίδωμι bezeichnet hier, jemandem im Gericht das ihm Entsprechende zukommen zu lassen. „Vergelten“ bewahrt diese gerichtliche Bedeutung, ohne nur Lohn oder nur Strafe festzulegen.
- source_word: ἑκάστῳ
  choice: jedem
  rationale: Der Dativ Singular hat verteilende Kraft und bezieht das Urteil auf jede einzelne Person.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: nach seinem Tun
  rationale: πρᾶξις steht im Singular, kann hier aber die Handlung beziehungsweise Lebensführung einer Person zusammenfassend bezeichnen. „Tun“ wahrt den Singular und ist im Deutschen natürlicher als „Tat“, das leicht nur eine einzelne Handlung nahelegt.
theological_decisions:
- issue: Eschatologische Zeitnähe in μέλλει
  choice: „wird bald ... kommen“ mit Fußnote zu möglichen Wiedergaben
  alternative: „wird kommen“ oder „ist im Begriff zu kommen“
  rationale: Die Übersetzung bewahrt die im griechischen μέλλω liegende Spannung eines bevorstehenden Kommens, ohne die Frage nach dessen genauer zeitlicher Einordnung auszulegen.
- issue: Gericht nach dem Tun
  choice: „wird er jedem vergelten nach seinem Tun“
  alternative: „wird er jedem nach seinen Taten geben“
  rationale: Die Formulierung gibt individuelle Vergeltung wieder, ohne ein weitergehendes Lehrsystem über Verdienst, Lohn oder Strafe in den Vers hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschensohn“, „Herrlichkeit“ und „vergelten“ erhalten den biblisch-theologischen Gehalt, ohne altertümliche Satzformen zu verwenden. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Formulierungen.
