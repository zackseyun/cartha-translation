id: MAT.16.20
reference: Matthew 16:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: de
  text: Da schärfte er den Jüngern ein, niemandem zu sagen, dass er der Messias[a] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische Wort Χριστός bedeutet „der Gesalbte“ und wird hier als Titel mit „Messias“ wiedergegeben.'
    reason: Alternative traditionelle Wiedergabe und Erläuterung des Titels.
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Das Adverb markiert die zeitliche Folge. Im deutschen Erzählstil gibt „Da“ diesen Anschluss knapp und natürlich wieder.
- source_word: διεστείλατο
  choice: schärfte ... ein
  rationale: Das Medium von διαστέλλομαι bezeichnet hier eine nachdrückliche Anweisung. „Einschärfen“ bewahrt deren Stärke, ohne zusätzlich eine konkrete Gefahr anzudeuten.
- source_word: τοῖς μαθηταῖς
  choice: den Jüngern
  rationale: Der bestimmte Plural bezeichnet die bereits bekannte Gruppe der Jünger; ein ergänzendes „seinen“ ist nicht erforderlich.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: niemandem zu sagen
  rationale: ἵνα mit Konjunktiv gibt hier den Inhalt der Anweisung wieder. Die Infinitivkonstruktion ist im modernen Deutsch idiomatisch und erhält das Verbot.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was nicht gesagt werden soll.
- source_word: αὐτός ἐστιν
  choice: er ... ist
  rationale: Gibt die ausdrückliche pronominale Aussage schlicht wieder; eine Hervorhebung durch „er selbst“ ist im Kontext nicht zwingend.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός fungiert hier als Titel des erwarteten Gesalbten. „Messias“ bewahrt diesen titularen und jüdischen Bedeutungshintergrund im heutigen Deutsch.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: der Messias
  alternative: der Christus
  rationale: Im Kontext ist Χριστός ein Titel und nicht bloß ein namensähnlicher Bestandteil. „Messias“ macht die Bedeutung als der erwartete Gesalbte transparent; die traditionelle Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schärfte ... ein“ trägt die Nachdrücklichkeit der Anweisung; die Satzstellung bleibt natürlich und gut verständlich.
