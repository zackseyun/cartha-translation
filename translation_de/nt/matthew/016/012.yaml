source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: de
  text: Da verstanden sie, dass er nicht gesagt hatte, sie sollten sich vor dem Sauerteig des Brotes[a] hüten, sondern vor der Lehre der Pharisäer und Sadduzäer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Brote“. Im Griechischen steht „Brote“ in der Mehrzahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Markiert natürlich den Zeitpunkt, an dem die Jünger Jesu Aussage verstanden; im deutschen Erzählfluss ist „Da“ idiomatischer als ein schwereres „Zu diesem Zeitpunkt“.
- source_word: συνῆκαν
  choice: verstanden sie
  rationale: Gibt den punktuellen Erkenntnisgewinn des Aorists klar und ohne zusätzliche Deutung wieder.
- source_word: οὐκ εἶπεν
  choice: dass er nicht gesagt hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass die frühere Aussage Jesu erst jetzt richtig verstanden wurde.
- source_word: προσέχειν
  choice: sie sollten sich … hüten
  rationale: Im Warnkontext bedeutet προσέχω, aufmerksam auf eine Gefahr zu achten beziehungsweise sich davor in Acht zu nehmen. Die deutsche Konstruktion ergänzt das im Infinitivsatz mitgedachte Subjekt natürlich.
- source_word: ἀπὸ τῆς ζύμης
  choice: vor dem Sauerteig
  rationale: „Sauerteig“ bewahrt das konkrete Bild und seine biblische Resonanz; ἀπό wird mit dem deutschen Verb „sich hüten“ idiomatisch durch „vor“ wiedergegeben.
- source_word: τῶν ἄρτων
  choice: der Brote
  rationale: Bewahrt den auffälligen griechischen Plural formal. Da „Sauerteig der Brote“ im Deutschen ungewohnt klingt, erläutert eine Fußnote die mögliche idiomatischere Wiedergabe.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung kennzeichnet „sondern“ den korrigierenden Gegensatz im Deutschen genauer als „aber“.
- source_word: διδαχῆς
  choice: der Lehre
  rationale: „Lehre“ bezeichnet hier den Inhalt dessen, was die Gruppen lehren, und passt natürlich in den ausdrücklichen Gegensatz zum bildhaften Sauerteig.
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: der Pharisäer und Sadduzäer
  rationale: Verwendet die etablierten deutschen Bezeichnungen der beiden jüdischen Gruppen.
theological_decisions:
- issue: Metaphorische Bedeutung des Sauerteigs
  choice: Das Bild bleibt im ersten Satzteil stehen und wird nur durch den textinternen Gegensatz zur „Lehre“ erklärt.
  alternative: Eine wertende Ausdeutung wie „Heuchelei“, „Irrlehre“ oder „verderbliche Lehre“.
  rationale: Der Vers selbst identifiziert den Sauerteig mit der Lehre der Pharisäer und Sadduzäer, beschreibt deren Qualität hier aber nicht näher. Eine zusätzliche Wertung würde die Aussage über den Wortlaut hinaus festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da verstanden sie“ trägt den knappen erzählerischen Übergang; „sich vor … hüten“ gibt die Warnung natürlich wieder. Der ungewöhnliche Plural „der Brote“ bleibt wegen der griechischen Form im Haupttext erhalten und wird in der Fußnote erklärt.
