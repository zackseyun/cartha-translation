  rationale: Die Revision bewahrt den Sinn und die metaphorische Offenheit des griechischen Textes, ersetzt aber die im Deutschen unübliche Formulierung „Sauerteig der Brote“ durch die idiomatische Massenbezeichnung „Sauerteig des Brotes“. Die abweichende griechische Pluralform bleibt an derselben Stelle durch die Fußnote überprüfbar.
