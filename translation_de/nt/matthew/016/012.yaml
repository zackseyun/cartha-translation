review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt τότε, συνῆκαν, die indirekte Rede mit dem kontrastierenden ἀλλά sowie διδαχή sachgerecht wieder. Die Warnbedeutung von προσέχειν ist mit „sich vor … hüten“ treffend erfasst. Der griechische Plural τῶν ἄρτων soll jedoch nicht durch die im Deutschen semantisch und idiomatisch problematische Verbindung „Sauerteig der Brote“ erzwungen werden; er kann in einer Fußnote transparent gemacht werden.
  naturalness: „Da verstanden sie“ und „sie sollten sich vor … hüten“ sind modernes, klares Standarddeutsch. „Sauerteig der Brote“ klingt hingegen nicht wie eine natürliche Bezeichnung für wörtliches Brot und legt eine sachlich unpassende Zugehörigkeitsbeziehung nahe. „Sauerteig des Brotes“ ist in diesem metaphorischen Kontrast idiomatisch.
  terminology: „Sauerteig“, „Lehre“, „Pharisäer“ und „Sadduzäer“ sind etablierte und angemessene deutsche Begriffe. Die Metapher wird nicht über den Text hinaus als Irrlehre oder Heuchelei ausgelegt.
  issues:
  - severity: medium
    issue: Unnatürliche und missverständliche Wiedergabe von τῶν ἄρτων
    rationale: „Sauerteig der Brote“ ist im Deutschen keine idiomatische Verbindung und kann so verstanden werden, als sei Sauerteig ein Bestandteil bereits gebackener Brote. Die griechische Pluralform lässt sich besser in der Fußnote dokumentieren, während der Haupttext idiomatisches Deutsch verwendet.
  revised_text: Da verstanden sie, dass er nicht gesagt hatte, sie sollten sich vor dem Sauerteig des Brotes[a] hüten, sondern vor der Lehre der Pharisäer und Sadduzäer.
