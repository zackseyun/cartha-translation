review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt προσλαβόμενος zutreffend mit „nahm ihn beiseite“ wieder und bewahrt mit „fing an, ihn zurechtzuweisen“ sowohl den ingressiven Charakter von ἤρξατο als auch die Schärfe von ἐπιτιμᾶν. „Das möge dir erspart bleiben“ ist eine vertretbare idiomatische Wiedergabe von Ἵλεώς σοι, ohne das im Griechischen nicht ausdrücklich genannte „Gott“ in den Haupttext einzutragen. „Auf keinen Fall“ gibt die Emphase von οὐ μή angemessen wieder.
  naturalness: Der Wortlaut ist modernes, würdiges Standarddeutsch. Die Verbindung von Zurechtweisung und wörtlicher Rede ist jedoch mit „und sagte“ enger und natürlicher an das griechische λέγων gebunden als mit einem neuen Hauptsatz „Er sagte“.
  terminology: „Herr“ ist für κύριε korrekt und wahrt die Anrede sowie die im Matthäusevangelium mitklingende Bedeutung. Die Alternativen in der Fußnote sind sachgerecht; „Das sei fern von dir“ bewahrt die traditionelle, formal nähere Möglichkeit, und „Gott bewahre“ kennzeichnet eine sinngemäße idiomatische Alternative.
  issues:
  - severity: low
    issue: Satzverknüpfung bei λέγων
    rationale: Das griechische λέγων ist eng mit „begann, ihn zurechtzuweisen“ verbunden. „… und sagte:“ stellt diese Beziehung im Deutschen unmittelbarer dar als der abgetrennte Satz „Er sagte:“.
  - severity: low
    issue: Position des Fußnotenankers
    rationale: Die Fußnote erläutert die gesamte Anredeformel Ἵλεώς σοι, κύριε. Der Anker sollte daher nach „Herr“ stehen, nicht innerhalb der Formel vor „Das wird …“.
