source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: de
  text: 'Und Petrus nahm ihn beiseite und fing an, ihn zurechtzuweisen, und sagte: »Das möge dir erspart bleiben, Herr![a] Das wird dir auf keinen Fall geschehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist idiomatisch und verkürzt. Auch möglich: »Das sei fern von dir, Herr!« oder »Gott bewahre, Herr!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος αὐτόν
  choice: nahm ihn beiseite
  rationale: Das mediale Partizip bezeichnet hier wahrscheinlich, dass Petrus Jesus zu sich beziehungsweise beiseitenahm, um unter vier Augen auf ihn einzureden. Die deutsche Wendung gibt diesen kontextuellen Sinn natürlich wieder.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: fing an, ihn zurechtzuweisen
  rationale: ἤρξατο mit Infinitiv bezeichnet den Beginn der Handlung; ἐπιτιμάω drückt eine scharfe Zurechtweisung aus. »Zurechtweisen« bewahrt die ungewöhnliche Kühnheit, mit der Petrus Jesus entgegentritt, ohne unnötig altertümlich zu klingen.
- source_word: Ἵλεώς σοι
  choice: Das möge dir erspart bleiben
  rationale: Die elliptische idiomatische Wendung enthält sprachlich die Vorstellung von Huld oder Erbarmen, fungiert hier jedoch als abwehrender Wunsch. Die gewählte Formulierung ist im Deutschen verständlich und fügt »Gott« nicht ausdrücklich ein, da dieser im griechischen Wortlaut nicht genannt wird.
- source_word: κύριε
  choice: Herr
  rationale: »Herr« entspricht der üblichen Bedeutung von κύριος, passt zur direkten Anrede Jesu und wahrt zugleich die christologische Resonanz des Evangeliums.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Das wird dir auf keinen Fall geschehen
  rationale: οὐ μή mit dem Futur ist eine nachdrückliche Verneinung. »Auf keinen Fall« gibt diese emphatische Gewissheit in gegenwärtigem Deutsch wieder.
theological_decisions:
- issue: Petrus’ abwehrenden Wunsch wiedergeben, ohne einen nicht ausdrücklich genannten Gottesbezug einzufügen
  choice: Das möge dir erspart bleiben, Herr!
  alternative: Gott bewahre, Herr! / Das sei fern von dir, Herr!
  rationale: Ἵλεώς σοι ist idiomatisch und elliptisch. Die Hauptfassung gibt den abwehrenden Wunsch natürlich wieder, ohne »Gott« als unausgesprochenes Subjekt festzulegen. Die Fußnote bewahrt die echte sprachliche Mehrdeutigkeit und nennt naheliegende Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist nachdrücklich und emotional, ohne umgangssprachlich zu wirken; die elliptische griechische Wendung wird im Haupttext verständlich wiedergegeben und in der Fußnote offengehalten.
