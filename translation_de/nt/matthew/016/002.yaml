  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: de
  text: 'Er aber antwortete und sagte zu ihnen: »Wenn es Abend wird, sagt ihr: ›Es gibt schönes Wetter, denn der Himmel[a] ist rot.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl den sichtbaren Himmel als auch den Himmel im religiösen Sinn bezeichnen; hier ist wegen der Wetterregel der sichtbare Himmel gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: antwortete und sagte zu ihnen
  rationale: Gibt die griechische, leicht formelhafte Doppelung wieder, ohne ihre Erzählfunktion zu verändern.
- source_word: Ὀψίας γενομένης
  choice: Wenn es Abend wird
  rationale: Der Genitivus absolutus bezeichnet den Zeitpunkt; diese Formulierung ist natürliches modernes Deutsch.
- source_word: λέγετε
  choice: sagt ihr
  rationale: Das Präsens beschreibt eine gewohnheitsmäßige, sprichwörtliche Aussage.
- source_word: Εὐδία
  choice: Es gibt schönes Wetter
  rationale: Bezeichnet günstiges beziehungsweise heiteres Wetter und fügt sich idiomatisch in die deutsche Wetterregel ein.
- source_word: πυρράζει
  choice: ist rot
  rationale: Gibt die rötliche Färbung knapp und ohne unnötige Verstärkung wieder.
- source_word: οὐρανός
  choice: Himmel
  rationale: Im Zusammenhang ist der sichtbare Himmel gemeint; das deutsche Wort bewahrt zugleich die allgemeine lexikalische Spannweite des griechischen Ausdrucks.
