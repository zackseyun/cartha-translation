revisions:
- from: Von da an begann Jesus seinen Jüngern zu zeigen, dass er nach Jerusalem gehen und von den Ältesten, den führenden Priestern und den Schriftgelehrten vieles erleiden[a], getötet werden und am dritten Tag auferweckt werden musste.
  to: Von da an begann Jesus, seinen Jüngern zu zeigen, dass er nach Jerusalem gehen und von den Ältesten, den Hohepriestern und den Schriftgelehrten vieles erleiden, getötet werden und am dritten Tag auferweckt werden müsse[a].
  rationale: Die Revision ersetzt die unpräzise Amtsgruppenbezeichnung „führende Priester“ durch „Hohepriester“ und fasst die koordinierte Aussage unter „müsse“ klar zusammen. Das passive „auferweckt werden“ bleibt erhalten. Die Fußnote ist an das Ende der betroffenen Verbfolge gesetzt und erläutert sowohl die lexikalische Nuance von πολλά παθεῖν als auch das für den Vers wichtige Passiv von ἐγερθῆναι.
