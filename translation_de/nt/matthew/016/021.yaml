review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die wesentlichen Bedeutungen werden zutreffend wiedergegeben: Ἀπὸ τότε als „Von da an“, der ingressive Beginn, die Notwendigkeit von δεῖ, die Bewegung nach Jerusalem, die drei genannten Gruppen, das Passiv von „getötet werden“ und besonders das Passiv von ἐγερθῆναι als „auferweckt werden“. „Führende Priester“ ist jedoch keine präzise Entsprechung für ἀρχιερεῖς, die etablierte Bezeichnung einer konkreten priesterlichen Führungsgruppe. „Hohepriester“ ist hier trotz des Plurals sachlich und terminologisch genauer.'
  naturalness: Der Satz ist grundsätzlich flüssig. Mit dem am Ende stehenden „musste“ kann die Notwendigkeit zwar alle Infinitive umfassen, doch „müsse“ direkt bei der infinitivischen Reihung macht den skopus von δεῖ im Deutschen klarer und bewahrt die gegenwärtige, nicht bloß vergangene Geltung der im Griechischen formulierten Notwendigkeit.
  terminology: „Älteste“, „Schriftgelehrte“, „getötet werden“ und „auferweckt werden“ sind angemessen. „Hohepriester“ ist für ἀρχιερεῖς vorzuziehen; es bezeichnet im Plural nicht mehrere gleichzeitig amtierende einzelne Hohepriester, sondern die priesterliche Führungsschicht.
  issues:
  - severity: medium
    issue: „führende Priester“ für ἀρχιερεῖς
    rationale: Die Formulierung ist verständlich, verallgemeinert aber eine feste historische und kultische Gruppenbezeichnung. „Hohepriester“ ist die im Deutschen übliche, quellentreue Wiedergabe und kann im Plural die betreffende Führungsschicht bezeichnen.
  - severity: low
    issue: Stellung und Tempus von „musste“
    rationale: Die Endstellung ist grammatisch möglich, lässt den Umfang der Notwendigkeit aber weniger transparent erkennen und verschiebt sie in die Vergangenheit. „müsse“ wahrt die starke Notwendigkeit von δεῖ in einer für diesen gehobenen Erzählkontext natürlichen Form.
