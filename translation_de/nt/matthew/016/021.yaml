  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: de
  text: Von da an begann Jesus, seinen Jüngern zu zeigen, dass er nach Jerusalem gehen und von den Ältesten, den Hohepriestern und den Schriftgelehrten vieles erleiden, getötet werden und am dritten Tag auferweckt werden müsse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „viele Dinge erleiden“; auch möglich: „viel leiden“. „Auferweckt werden“ gibt das griechische Passiv wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Von da an
  rationale: Kennzeichnet natürlich und prägnant einen neuen Abschnitt in der Erzählung.
- source_word: ἤρξατο δεικνύειν
  choice: begann … zu zeigen
  rationale: Bewahrt sowohl den Beginn einer neuen Lehrphase als auch den Sinn von δεικνύειν als Zeigen beziehungsweise Erkennenlassen.
- source_word: δεῖ αὐτὸν
  choice: dass er … musste
  rationale: Drückt die im Griechischen bezeichnete Notwendigkeit deutlich aus, ohne deren Ursprung näher festzulegen.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: nach Jerusalem gehen
  rationale: Ist im modernen Standarddeutsch die natürliche Wiedergabe der zielgerichteten Bewegung.
- source_word: πολλὰ παθεῖν
  choice: vieles erleiden
  rationale: Gibt den substantivisch gebrauchten griechischen Plural knapp wieder und deutet zugleich die Vielfalt der Leiden an.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: von den Ältesten, den führenden Priestern und den Schriftgelehrten
  rationale: Das deutsche „von“ bewahrt die offene Relation von Quelle beziehungsweise Urheberschaft. „Führende Priester“ bezeichnet die priesterliche Führungsgruppe verständlicher als das potenziell missverständliche „Hohepriester“ im Plural.
- source_word: ἀποκτανθῆναι
  choice: getötet werden
  rationale: Direkte und natürliche Wiedergabe des passiven Infinitivs.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: am dritten Tag auferweckt werden
  rationale: Bewahrt das grammatische Passiv und die zeitliche Bestimmung.
theological_decisions:
- issue: Bedeutung der Notwendigkeit in δεῖ
  choice: „musste“, ohne die Quelle der Notwendigkeit ausdrücklich zu erklären
  alternative: „sollte“ oder „es war notwendig, dass er …“
  rationale: Der Ausgangstext bezeichnet eine starke Notwendigkeit, erläutert in diesem Satz aber nicht ausdrücklich, ob sie als göttlicher Ratschluss, Schrifterfüllung oder anders zu verstehen ist.
- issue: Passiv von ἐγερθῆναι
  choice: „auferweckt werden“
  alternative: „auferstehen“
  rationale: Die passive Form des Ausgangstextes bleibt erhalten; dadurch wird die handelnde Instanz nicht ausdrücklich benannt und die theologische Spannung nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des Griechischen, vermeidet jedoch unnötig schwerfällige Formulierungen. Der Fußnotenmarker [a] steht unmittelbar bei der betroffenen Wendung.
