id: MAT.16.19
reference: Matthew 16:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: de
  text: Ich werde dir die Schlüssel des Himmelreichs geben[a]. Was immer du auf der Erde bindest, wird im Himmel gebunden worden sein[b][c], und was immer du auf der Erde löst, wird im Himmel gelöst worden sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „des Reiches der Himmel“. Matthäus verwendet diese Wendung häufig.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell wird oft übersetzt: „wird im Himmel gebunden sein … wird im Himmel gelöst sein“. Die griechische Form kann genauer als „wird … gebunden worden sein … wird … gelöst worden sein“ verstanden werden.'
    reason: alternative_reading
  - marker: c
    text: „Binden“ und „lösen“ können hier auch das Verbieten und Erlauben oder das Auferlegen und Aufheben von Verpflichtungen bezeichnen; die Übersetzung bewahrt jedoch die griechische Bildsprache.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Ich werde dir geben
  rationale: Das Futur bezeichnet eine klare Verheißung; der Dativ σοι wird im Deutschen natürlich mit „dir“ wiedergegeben.
- source_word: τὰς κλεῖδας
  choice: die Schlüssel
  rationale: Das konkrete Bild wird unverändert bewahrt und nicht als bestimmte Form von Vollmacht ausgedeutet.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: des Himmelreichs
  rationale: „Himmelreich“ ist die natürliche und geläufige deutsche Wiedergabe der für Matthäus typischen Wendung; der griechische Plural „der Himmel“ wird in einer Fußnote kenntlich gemacht.
- source_word: ὃ ἐὰν
  choice: was immer
  rationale: Die unbestimmte Relativkonstruktion wird in beiden Satzhälften idiomatisch und mit ihrem umfassenden Sinn wiedergegeben.
- source_word: δήσῃς
  choice: bindest
  rationale: „Binden“ erhält die Metapher und lässt ihre rechtliche beziehungsweise autoritative Bedeutung offen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Dies bildet den räumlichen Gegensatz zu „im Himmel“ klar und natürlich ab.
- source_word: ἔσται δεδεμένον
  choice: wird gebunden worden sein
  rationale: Die Verbindung aus dem Futur von εἰμί und dem Perfektpassivpartizip bezeichnet einen künftigen Zustand als Ergebnis einer bereits vollzogenen Handlung. Das deutsche Futur II bildet diese Form genauer ab als „wird gebunden sein“.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: im Himmel
  rationale: Der griechische Plural wird im Deutschen idiomatisch mit dem Singular wiedergegeben; die wörtlichere Form wird in der Fußnote zu der parallelen matthäischen Wendung erwähnt.
- source_word: λύσῃς
  choice: löst
  rationale: „Lösen“ wahrt das Gegenbild zu „binden“ und vermeidet eine vorschnelle Festlegung auf „erlauben“ oder „freisprechen“.
- source_word: ἔσται λελυμένον
  choice: wird gelöst worden sein
  rationale: Wie in der ersten Satzhälfte gibt das Futur II die Verbindung von Futur und Perfektpassivpartizip möglichst genau wieder.
theological_decisions:
- issue: Zeitverhältnis und theologische Tragweite von Binden und Lösen
  choice: „wird … gebunden/gelöst worden sein“
  alternative: „wird … gebunden/gelöst sein“
  rationale: Die gewählte Form bewahrt den Aspekt der griechischen Konstruktion und lässt erkennen, dass das irdische Handeln einer bereits vollzogenen himmlischen Bestimmung entsprechen kann. Sie legt jedoch keine bestimmte konfessionelle Lehre über kirchliche Vollmacht fest.
- issue: Bedeutung der Schlüssel des Himmelreichs
  choice: Das Schlüsselbild bleibt ohne erklärende Erweiterung im Haupttext stehen.
  alternative: „die Vollmacht, Zutritt zu gewähren oder zu verweigern“
  rationale: Das Bild deutet Vollmacht an, doch der Vers erläutert deren institutionelle Ausgestaltung nicht. Eine interpretierende Umschreibung würde die offene Metapher unnötig verengen.
- issue: Semantischer Umfang von „binden“ und „lösen“
  choice: Die griechischen Metaphern werden wörtlich bewahrt.
  alternative: „verbieten“ und „erlauben“ beziehungsweise „Verpflichtungen auferlegen“ und „aufheben“
  rationale: Diese Bedeutungen sind im damaligen rechtlich-religiösen Sprachgebrauch möglich, aber der Text selbst behält die Bildsprache bei. Die Fußnote informiert darüber, ohne eine einzige Deutung zum Haupttext zu machen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Ton. Die auffälligen Futur-II-Formen sind bewusst gewählt, um die griechische Aspektform sichtbar zu halten; die Fußnote bietet die geläufigere traditionelle Alternative. Die Anrede bleibt wegen des singularischen σοι und der direkten Anrede an Petrus im Singular („dir“, „du“).
