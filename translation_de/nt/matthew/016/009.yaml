  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: de
  text: Versteht ihr noch immer nicht[a], und erinnert ihr euch auch nicht an die fünf Brote für die Fünftausend und daran, wie viele Körbe ihr eingesammelt habt[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »noch nicht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »genommen habt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: noch immer nicht
  rationale: Die Formulierung gibt die zeitliche Bedeutung des Adverbs und zugleich den vorwurfsvollen Ton der rhetorischen Frage idiomatisch wieder; »noch nicht« bleibt als engere Alternative möglich.
- source_word: νοεῖτε
  choice: versteht ihr
  rationale: νοέω bezeichnet hier das geistige Erfassen der Bedeutung der vorausgegangenen Ereignisse, nicht bloßes Wahrnehmen.
- source_word: οὐδὲ
  choice: und … auch nicht
  rationale: Diese im Deutschen natürliche Verbindung koordiniert die beiden verneinten Verben, ohne ihre enge syntaktische Beziehung aufzulösen.
- source_word: μνημονεύετε
  choice: erinnert ihr euch
  rationale: Das Verb bezeichnet das bewusste Erinnern an die frühere Speisung und wird im modernen Deutsch direkt und verständlich wiedergegeben.
- source_word: τοὺς πέντε ἄρτους
  choice: die fünf Brote
  rationale: ἄρτοι bezeichnet in der Speisungserzählung konkrete Brotlaibe; »Brote« ist dafür die geläufige deutsche Ausdrucksweise.
- source_word: τῶν πεντακισχιλίων
  choice: für die Fünftausend
  rationale: Der Genitiv bezieht die fünf Brote auf die Speisung der fünftausend Menschen; »für« drückt diesen Zusammenhang natürlich aus.
- source_word: πόσους κοφίνους
  choice: wie viele Körbe
  rationale: κόφινος bezeichnet einen Korb; die Frage richtet sich auf die Anzahl der nach der Speisung gefüllten beziehungsweise eingesammelten Körbe.
- source_word: ἐλάβετε
  choice: ihr aufgehoben habt
  rationale: Obwohl λαμβάνω grundsätzlich »nehmen« oder »empfangen« bedeutet, verweist es hier im Kontext auf das Aufheben der übrig gebliebenen Stücke in Körben.
