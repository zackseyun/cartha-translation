reference: Matthew 16:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: de
  text: 'Amen, ich sage euch: Einige von denen, die hier stehen, werden ganz gewiss den Tod nicht schmecken, bis sie den Menschensohn in seinem Reich kommen sehen.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden den Tod keinesfalls schmecken“; im Griechischen steht eine nachdrückliche Verneinung.'
    reason: lexical_alternative
  - marker: b
    text: Die Aussage vom Kommen des Menschensohnes in seinem Reich kann auf die Verklärung, die Auferstehung und Erhöhung, das Gericht über Jerusalem oder die endgültige Wiederkunft bezogen werden; der Text selbst legt das Ereignis nicht näher fest. „Reich“ kann hier auch „Herrschaft“ oder „Königsherrschaft“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Die im Deutschen geläufige biblische Formel bewahrt den feierlichen, bekräftigenden Charakter der einleitenden Aussage.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Direkte und natürliche Wiedergabe der feierlichen Anrede.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: Einige von denen, die hier stehen
  rationale: Gibt den partitiven Genitiv ausdrücklich und in natürlichem Deutsch wieder.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: werden ganz gewiss den Tod nicht schmecken
  rationale: Bewahrt sowohl die starke Verneinung οὐ μή als auch das anschauliche Bild des Schmeckens des Todes.
- source_word: ἕως ἂν ἴδωσιν
  choice: bis sie ... sehen
  rationale: Natürliche Wiedergabe der auf ein künftiges Ereignis bezogenen Temporalkonstruktion.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: Bewahrt die feste Selbstbezeichnung Jesu und ihre biblisch-apokalyptischen Bezüge.
- source_word: ἐρχόμενον
  choice: kommen
  rationale: Das prädikativ auf den Menschensohn bezogene Partizip wird ohne nicht im Ausgangstext enthaltene Ergänzung wiedergegeben.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: in seinem Reich
  rationale: „Reich“ ist die geläufige und bildhafte Wiedergabe von βασιλεία; die mögliche Betonung von Herrschaft oder Königsherrschaft wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Bezug des Kommens des Menschensohnes in seinem Reich
  choice: Die Formulierung wird ohne Festlegung auf ein bestimmtes Ereignis übersetzt.
  alternative: Verklärung, Auferstehung und Erhöhung, Pfingsten, Gericht über Jerusalem oder endgültige Wiederkunft
  rationale: Der griechische Text bezeichnet das gemeinte Ereignis nicht ausdrücklich; die umstrittene zeitliche und theologische Spannung bleibt daher erhalten.
- issue: Bedeutungsumfang von βασιλεία
  choice: Reich
  alternative: Herrschaft oder Königsherrschaft
  rationale: „Reich“ bewahrt das traditionelle konkrete Bild, ohne die mögliche dynamische Bedeutung königlicher Herrschaft auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die biblisch geprägten Ausdrücke „Amen“, „Menschensohn“ und „den Tod schmecken“ bleiben erhalten, weil sie verständlich sind und zentrale Bilder des Ausgangstextes bewahren.
