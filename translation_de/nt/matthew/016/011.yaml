  naturalness: „Wie könnt ihr nicht verstehen“ ist als tadelnde rhetorische Frage verständlich und angemessen. „dass ich nicht über Brot zu euch gesprochen habe“ bildet die griechische Satzbeziehung klarer und klingt im modernen Standarddeutsch natürlicher. „Hütet euch aber vor“ ist idiomatisch und hat die nötige Warnfunktion.
  terminology: „Sauerteig“, „Pharisäer“ und „Sadduzäer“ sind etablierte, sachgerechte Begriffe. Die Fußnote bewahrt die Bildsprache im Haupttext und verweist zutreffend auf die explizite Erklärung im Folgevers.
