source:
  edition: SBLGNT
  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: de
  text: Wie könnt ihr nicht verstehen, dass ich nicht über Brot zu euch gesprochen habe? Hütet euch aber vor dem Sauerteig der Pharisäer und Sadduzäer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sauerteig“ ist hier bildlich gebraucht; im folgenden Vers wird damit die Lehre der Pharisäer und Sadduzäer bezeichnet.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Wie könnt ihr nicht verstehen
  rationale: Die rhetorische Frage tadelt das mangelnde Begreifen. Die Formulierung bewahrt die mit πῶς ausgedrückte Verwunderung und klingt zugleich natürlich.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: dass ich zu euch nicht vom Brot gesprochen habe
  rationale: Obwohl ἄρτων formal im Plural steht, bezeichnet „Brot“ im Deutschen hier idiomatisch das Nahrungsmittel beziehungsweise die Brotlaibe als Sachbereich. Die Wortstellung hebt hervor, dass Brot nicht das Thema seiner Aussage war.
- source_word: προσέχετε … ἀπό
  choice: Hütet euch … vor
  rationale: Die Verbindung bezeichnet hier eine eindringliche Warnung und nicht nur allgemeine Aufmerksamkeit. „Sich vor etwas hüten“ gibt Imperativ und Präposition idiomatisch wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet den korrigierenden Übergang vom missverstandenen Brot zur eigentlichen Warnung, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: τῆς ζύμης
  choice: dem Sauerteig
  rationale: „Sauerteig“ ist die geläufige deutsche Entsprechung und bewahrt das Bild des Ausgangstextes, das erst im folgenden Vers erklärt wird.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: der Pharisäer und Sadduzäer
  rationale: Dies sind die im modernen Standarddeutsch etablierten Bezeichnungen der beiden jüdischen Gruppen; der Genitiv ordnet ihnen den bildlich gemeinten Sauerteig zu.
theological_decisions:
- issue: Bildhafte Bedeutung von ζύμη
  choice: Das Bild „Sauerteig“ bleibt im Haupttext unaufgelöst.
  alternative: „Lehre der Pharisäer und Sadduzäer“
  rationale: Vers 12 erklärt den Sauerteig als ihre Lehre. Diese Deutung bereits hier in den Haupttext einzusetzen, würde die vom Evangelisten bewusst beibehaltene Bildsprache vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frage behält ihren tadelnden rhetorischen Charakter; „Hütet euch“ vermittelt die nachdrückliche Warnung, ohne altertümlich zu wirken.
