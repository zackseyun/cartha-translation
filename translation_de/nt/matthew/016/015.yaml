lexical_decisions:
- source_word: λέγει
  choice: Er sagt
  rationale: Das historische Präsens wird beibehalten und gibt der Erzählung Unmittelbarkeit.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Der Dativ bezeichnet die Adressaten der Rede.
- source_word: Ὑμεῖς δὲ
  choice: Ihr aber
  rationale: Das ausdrücklich gesetzte Pronomen ist betont; δέ hebt den Gegensatz zwischen der Meinung anderer und der Antwort der Jünger hervor.
- source_word: τίνα με λέγετε εἶναι
  choice: für wen haltet ihr mich
  rationale: Dies ist eine natürliche deutsche Wiedergabe der griechischen Akkusativ-mit-Infinitiv-Konstruktion und bewahrt die Frage nach Jesu Identität.
theological_decisions:
- issue: Betonung des eigenen Urteils der Jünger
  choice: „Ihr aber, für wen haltet ihr mich?“
  alternative: „Ihr aber, wer, sagt ihr, bin ich?“
  rationale: Die Formulierung erhält den Kontrast zum vorausgehenden Urteil der Leute, ohne die im nächsten Vers folgende Bekenntnisaussage vorwegzunehmen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Anrede ist eindeutig pluralisch; die Voranstellung „Ihr aber“ bildet die griechische Betonung natürlich nach.
