  rationale: 'Die Revision beschränkt sich auf zwei sichere stilistisch-semantische Anpassungen: Das unmarkierte καί wird mit „und“ statt mit dem stärker deutenden „doch“ wiedergegeben, und „ließ sie zurück“ bildet das Partizip καταλιπών unmittelbar ab. Die Metapher der ehebrecherischen Generation, die Mehrdeutigkeit des Zeichens Jonas und die passive Formulierung „wird ... gegeben werden“ bleiben erhalten. Der Fußnotenanker für das Zeichen Jonas steht nun unmittelbar an der betreffenden Wortgruppe.'
