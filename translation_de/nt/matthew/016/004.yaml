id: MAT.16.4
reference: Matthew 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: de
  text: Eine böse und ehebrecherische Generation[a] verlangt nach einem Zeichen; und ihr wird kein Zeichen gegeben werden außer dem Zeichen Jonas[b]. Und er ließ sie zurück und ging weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „untreue Generation“. Das griechische Wort bedeutet wörtlich „ehebrecherisch“ und kann an die prophetische Sprache von der Untreue gegenüber Gott erinnern.'
    reason: lexical_alternative
  - marker: b
    text: Das „Zeichen Jonas“ wird in Matthäus 12,39–40 mit Jonas drei Tagen und drei Nächten und dem entsprechenden Ergehen des Menschensohnes in Verbindung gebracht.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: Generation
  rationale: „Generation“ gibt γενεά direkt wieder und bezeichnet hier die gegenwärtige Gruppe von Menschen; es vermeidet die weitergehende Paraphrase „Volk“.
- source_word: πονηρὰ
  choice: böse
  rationale: „Böse“ ist eine direkte, natürliche Wiedergabe der moralischen Wertung durch πονηρά.
- source_word: μοιχαλὶς
  choice: ehebrecherisch
  rationale: Die wörtliche Metapher bleibt erhalten und lässt zugleich den möglichen prophetischen Anklang an Untreue gegenüber Gott offen.
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ entspricht dem griechischen Wort, ohne durch „Wunderzeichen“ die Art des verlangten Beglaubigungszeichens unnötig festzulegen.
- source_word: ἐπιζητεῖ
  choice: verlangt nach
  rationale: ἐπιζητέω bezeichnet hier im konflikthaften Kontext ein nachdrückliches Suchen oder Fordern; „verlangt nach“ klingt im Deutschen natürlich und bewahrt diese Intensität.
- source_word: δοθήσεται
  choice: wird gegeben werden
  rationale: Das Futur Passiv wird direkt wiedergegeben, ohne den nicht ausdrücklich genannten Handelnden einzufügen.
- source_word: αὐτῇ
  choice: ihr
  rationale: Das feminine Pronomen stimmt mit der femininen „Generation“ überein und ist im Deutschen idiomatisch.
- source_word: εἰ μὴ
  choice: außer
  rationale: 'Die Wendung führt die einzige Ausnahme ein: kein Zeichen außer einem.'
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: das Zeichen Jonas
  rationale: Der Genitiv bleibt knapp und mehrdeutig; die Erklärung aus Matthäus 12 wird nicht in den Haupttext eingetragen.
- source_word: καταλιπὼν αὐτοὺς
  choice: er ließ sie stehen
  rationale: Die idiomatische Wendung drückt das Zurücklassen der Angesprochenen aus und verbindet sich flüssig mit dem finiten Verb.
- source_word: ἀπῆλθεν
  choice: ging weg
  rationale: Die Form bezeichnet sein Fortgehen und wird in modernem, schlichtem Deutsch wiedergegeben.
theological_decisions:
- issue: Bedeutung von „ehebrecherische Generation“
  choice: Die Ehebruchsmetapher bleibt im Haupttext erhalten.
  alternative: „untreue Generation“
  rationale: Das Wort kann prophetische Sprache über die Untreue gegenüber Gott anklingen lassen, benennt aber ausdrücklich Ehebruch. Die wörtliche Metapher bewahrt sowohl ihre Schärfe als auch ihre theologische Offenheit.
- issue: Bedeutung des „Zeichens Jonas“
  choice: Die knappe Genitivverbindung wird ohne Deutung im Haupttext beibehalten.
  alternative: Ausdrückliche Erklärung als Hinweis auf Jesu Tod und Auferstehung
  rationale: Matthäus 12,39–40 erläutert das Motiv, doch der vorliegende Vers selbst formuliert es knapp. Die Übersetzung soll diese Stelle nicht durch eine eingefügte Auslegung vereindeutigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die scharfe Ehebruchsmetapher und die Mehrdeutigkeit des „Zeichens Jonas“ bleiben erhalten. „Verlangt nach“ trägt dem nachdrücklichen ἐπιζητεῖ Rechnung; „ließ sie stehen und ging weg“ ist eine natürliche deutsche Wiedergabe der abschließenden Partizipialkonstruktion.
