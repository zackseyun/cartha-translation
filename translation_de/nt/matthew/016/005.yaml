  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: de
  text: Als die Jünger ans andere Ufer kamen, hatten sie vergessen, Brot mitzunehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: Als ... kamen
  rationale: Das Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben und in seinem zeitlichen Verhältnis zum Hauptverb bewahrt.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: „Jünger“ ist im Evangelienkontext die etablierte und sachlich passende Bezeichnung für die μαθηταί Jesu.
- source_word: εἰς τὸ πέραν
  choice: ans andere Ufer
  rationale: Im Kontext der Überfahrt bezeichnet die Wendung die gegenüberliegende Seite des Gewässers; „ans andere Ufer“ ist im Deutschen natürlich und präzise.
- source_word: ἐπελάθοντο
  choice: hatten sie vergessen
  rationale: Das Plusquamperfekt verdeutlicht idiomatisch, dass das Versäumnis vor ihrer Ankunft am anderen Ufer lag, ohne die Bedeutung von ἐπιλανθάνομαι zu verändern.
- source_word: ἄρτους
  choice: Brot
  rationale: Obwohl das griechische Wort im Plural steht („Brote/Laibe“), bezeichnet „Brot“ im Deutschen natürlich den mitzuführenden Proviant und bewahrt den Sinn ohne unnötige Konkretisierung.
- source_word: λαβεῖν
  choice: mitzunehmen
  rationale: Nach „vergessen“ gibt der Infinitiv „mitzunehmen“ in dieser Reisesituation λαβεῖν natürlicher und kontextuell genauer wieder als das isolierte „zu nehmen“.
