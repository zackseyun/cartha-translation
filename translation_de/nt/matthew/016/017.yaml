id: MAT.16.17
reference: Matthew 16:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: de
  text: 'Jesus antwortete ihm: „Selig bist du, Simon Bar-Jona[a], denn Fleisch und Blut[b] haben dir das nicht offenbart, sondern mein Vater, der im Himmel[c] ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Simon, Sohn des Jona“. Das Griechische bewahrt hier die aramäische Form eines Vatersnamens.'
    reason: lexical_alternative
  - marker: b
    text: „Fleisch und Blut“ ist eine feste Wendung für Menschen oder einen rein menschlichen Ursprung.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „in den Himmeln“; im Deutschen wird gewöhnlich der Singular „im Himmel“ gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Jesus antwortete ihm
  rationale: Die Partizip-plus-Verb-Konstruktion bedeutet idiomatisch „antwortete und sagte“. Das natürliche deutsche „antwortete ihm“ gibt den Sinn ohne schwerfällige Doppelung wieder; δέ setzt hier den Erzählgang fort und muss nicht eigens mit „aber“ markiert werden.
- source_word: Μακάριος
  choice: Selig
  rationale: „Selig“ bewahrt den Charakter eines göttlichen Glückwunsches und den theologischen Nachdruck von μακάριος besser als das vorwiegend gefühlsbezogene „glücklich“.
- source_word: Σίμων Βαριωνᾶ
  choice: Simon Bar-Jona
  rationale: Die griechische Form bewahrt einen aramäischen Vatersnamen. Die Transliteration „Bar-Jona“ erhält diese sprachliche Gestalt; die Bedeutung wird in einer Fußnote erklärt.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet hier die Seligpreisung. „Denn“ verbindet die Begründung im Deutschen natürlich mit dem vorausgehenden Ausruf.
- source_word: σὰρξ καὶ αἷμα
  choice: Fleisch und Blut
  rationale: Die wörtliche Wendung ist auch im Deutschen verständlich und bewahrt das Bild des griechischen Textes. Gemeint ist ein menschlicher beziehungsweise rein menschlicher Ursprung.
- source_word: ἀπεκάλυψέν σοι
  choice: haben dir das nicht offenbart
  rationale: „Offenbaren“ erhält den Gedanken einer zuvor verborgenen, hier von Gott gewährten Erkenntnis. „Das“ nimmt den im Zusammenhang erschließbaren Inhalt von Simons Bekenntnis auf.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: sondern mein Vater
  rationale: Nach der Verneinung gibt „sondern“ den starken Gegensatz zwischen menschlichem Ursprung und dem Vater präzise und idiomatisch wieder.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: der im Himmel ist
  rationale: Der attributive Ausdruck wird ausdrücklich auf „mein Vater“ bezogen. Das singularische „im Himmel“ ist die übliche deutsche Wiedergabe des griechischen Plurals „in den Himmeln“.
theological_decisions:
- issue: Ursprung von Simons Erkenntnis
  choice: Die Aussage stellt menschlichen Ursprung („Fleisch und Blut“) der Offenbarung durch den Vater gegenüber.
  alternative: Die Wendung könnte enger nur Simons eigenes Nachdenken oder ausschließlich menschliche Lehrer bezeichnen.
  rationale: Der griechische Ausdruck schließt menschliche Vermittlung oder Herkunft allgemein aus, legt aber nicht fest, welche besondere menschliche Quelle gemeint wäre. Die Übersetzung wahrt diese Offenheit.
- issue: Bedeutung von μακάριος
  choice: „Selig“ als göttlicher Glückwunsch beziehungsweise Zuspruch
  alternative: „Glücklich“ oder „gesegnet“
  rationale: „Selig“ bezeichnet hier nicht bloß ein Gefühl und behauptet auch nicht ausdrücklich einen gesonderten Segensakt; es lässt die Spannung des Zuspruchs bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem, aber weiterhin allgemein verständlichem „selig“. Der Satzbau bleibt nahe am griechischen Kontrast, ohne die semitisch geprägte Doppelung „antwortete und sagte“ nachzuahmen.
