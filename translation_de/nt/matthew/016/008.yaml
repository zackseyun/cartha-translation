id: MAT.16.8
reference: Matthew 16:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: de
  text: 'Jesus merkte es und sagte: »Warum redet ihr untereinander darüber, ihr Kleingläubigen, dass ihr keine Brote mitgenommen habt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: merkte es
  rationale: Das Aoristpartizip bezeichnet Jesu Wahrnehmung, die seinem Reden vorausgeht. Das im Griechischen unausgedrückte Objekt wird aus dem Zusammenhang mit »es« aufgenommen.
- source_word: δὲ
  choice: und
  rationale: Die Partikel markiert hier einen leichten narrativen Übergang; ein stark kontrastierendes »aber« ist im Deutschen nicht erforderlich.
- source_word: Τί διαλογίζεσθε ἐν ἑαυτοῖς
  choice: Warum redet ihr untereinander darüber
  rationale: τί ist in dieser Verbindung am natürlichsten kausal als »warum« zu verstehen. διαλογίζεσθε mit ἐν ἑαυτοῖς bezeichnet die gemeinsame Erörterung der Jünger; »redet … untereinander« ist gegenwärtig und verständlich.
- source_word: ὀλιγόπιστοι
  choice: ihr Kleingläubigen
  rationale: Die substantivierte Anrede bewahrt den knappen, direkten Tadel und die für Matthäus charakteristische Verbindung von geringem Glauben beziehungsweise Vertrauen.
- source_word: ὅτι
  choice: darüber, … dass
  rationale: ὅτι führt den Inhalt der Erörterung ein. Die deutsche Konstruktion mit »darüber, dass« macht diese Funktion eindeutig, ohne die Konjunktion kausal als »weil« festzulegen.
- source_word: ἄρτους οὐκ ἐλάβετε
  choice: dass ihr keine Brote mitgenommen habt
  rationale: λαμβάνω bedeutet grundsätzlich »nehmen/empfangen«; im erzählerischen Zusammenhang ist das Mitnehmen von Broten gemeint. Der Plural »Brote« hält die konkrete Form des griechischen ἄρτους fest.
theological_decisions:
- issue: Kraft der Anrede ὀλιγόπιστοι
  choice: ihr Kleingläubigen
  alternative: ihr, die ihr so wenig glaubt / ihr mit eurem kleinen Glauben
  rationale: Die Übersetzung bewahrt den ausdrücklichen Vorwurf unzureichenden Glaubens beziehungsweise Vertrauens, ohne ihn zu einer weitergehenden dogmatischen Aussage auszubauen.
- issue: Funktion von ὅτι
  choice: 'Inhaltssatz: »darüber, … dass«'
  alternative: 'Kausalsatz: »weil ihr keine Brote mitgenommen habt«'
  rationale: Die griechische Form lässt formal beide Bezüge zu. Im unmittelbaren Gesprächszusammenhang liegt die inhaltliche Angabe dessen, worüber die Jünger reden, näher; die Übersetzung wahrt diese natürliche Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. »Kleingläubige« ist eine etablierte, prägnante biblische Anrede; »Brote mitgenommen« bleibt näher am konkreten griechischen Wortlaut als die stärker geglättete Wiedergabe »kein Brot haben«.
