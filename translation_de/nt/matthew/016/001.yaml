  source_fidelity: 'Die wesentlichen Begriffe sind treffend wiedergegeben: „Pharisäer“, „Sadduzäer“, „Zeichen vom Himmel“ und die Bitte, es zu zeigen. Die Wiedergabe von πειράζοντες als „um ihn auf die Probe zu stellen“ wahrt die feindselig-prüfende Nuance, ohne „eine Falle stellen“ als eindeutige Deutung festzulegen. Im Entwurf ist die Stellung dieser Zweckangabe innerhalb der Infinitivkonstruktion jedoch syntaktisch missverständlich.'
