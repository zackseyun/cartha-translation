id: MAT.16.1
reference: Matthew 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: de
  text: Und die Pharisäer und Sadduzäer kamen zu Jesus, um ihn auf die Probe zu stellen, und baten ihn, ihnen ein Zeichen vom Himmel zu zeigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn zu versuchen“; möglicherweise auch: „um ihm eine Falle zu stellen“.'
    reason: Lexikalische Alternativen zu πειράζοντες; die Anmerkung bewahrt die Bandbreite zwischen Prüfung, Versuchung und feindseliger Absicht.
lexical_decisions:
- source_word: προσελθόντες
  choice: kamen … zu Jesus
  rationale: Das Aoristpartizip bezeichnet die Annäherung vor der Haupthandlung. Die Ergänzung „Jesus“ macht den im Pronomen αὐτόν vorausgesetzten Bezug im Deutschen natürlich verständlich.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Eingebürgerte deutsche Bezeichnung der religiösen Gruppe.
- source_word: Σαδδουκαῖοι
  choice: Sadduzäer
  rationale: Eingebürgerte deutsche Bezeichnung der religiösen Gruppe.
- source_word: πειράζοντες
  choice: um ihn auf die Probe zu stellen
  rationale: Die Wendung bewahrt den prüfenden und im Kontext feindseligen Sinn von πειράζω, ohne das Motiv ausdrücklich als Falle auszudeuten.
- source_word: ἐπηρώτησαν
  choice: baten ihn
  rationale: Mit folgendem Infinitiv bezeichnet das Verb hier eine Aufforderung beziehungsweise Bitte; „baten ihn, … zu zeigen“ ist im Deutschen idiomatischer als „fragten ihn, … zu zeigen“.
- source_word: σημεῖον
  choice: ein Zeichen
  rationale: Die schlichte Wiedergabe erhält die Breite des griechischen Ausdrucks und fügt „Wunder-“ nicht erklärend hinzu.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Natürliche deutsche Wiedergabe der Herkunftsangabe; die mögliche göttliche Beglaubigung bleibt implizit.
- source_word: ἐπιδεῖξαι
  choice: zu zeigen
  rationale: Der Infinitiv gibt den Inhalt ihrer Bitte wieder; „zeigen“ ist klar und quellennah.
theological_decisions:
- issue: Feindseliger Unterton der Forderung
  choice: „um ihn auf die Probe zu stellen“
  alternative: „um ihn zu versuchen“ oder „um ihm eine Falle zu stellen“
  rationale: Die gewählte Formulierung erhält die Spannung zwischen Prüfung und feindseliger Absicht. „Versuchen“ kann im heutigen Deutsch missverständlich sein, während „eine Falle stellen“ das Motiv stärker festlegt als der griechische Wortlaut.
- issue: Bedeutung des Zeichens vom Himmel
  choice: „ein Zeichen vom Himmel“
  alternative: „ein Wunderzeichen vom Himmel“
  rationale: Der Text nennt ein σημεῖον, ohne ausdrücklich „Wunder“ zu sagen. Die Übersetzung lässt offen, welche konkrete Art himmlischer Beglaubigung verlangt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist für heutige Leser geglättet, ohne die Abfolge von Annäherung, prüfender Absicht und Bitte zu verändern.
