  terminology: Die eingedeutschten Gruppenbezeichnungen sind standardsprachlich. „Zeichen vom Himmel“ ist quellennah und angemessen; „Wunderzeichen“ sollte nicht in den Text aufgenommen werden. Die Fußnote bietet sinnvolle lexikalische Alternativen, ohne die Hauptfassung konfessionell oder interpretativ zu verengen.
