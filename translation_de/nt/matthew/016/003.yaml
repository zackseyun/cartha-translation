    issue: Nicht im Vers ausdrücklich enthaltenes »sagt ihr«
    rationale: Der griechische Text setzt nach »und am Morgen« unmittelbar mit der Wetteräußerung ein. Die Ergänzung ist aus dem parallelen Kontext nachvollziehbar, aber für eine isolierte, optimal-äquivalente Versübersetzung nicht erforderlich.
