  rationale: Die Revision entfernt die nicht ausdrücklich im Vers enthaltene Redeeinleitung, glättet die deutsche Syntax und gibt die unterschiedliche Akzentuierung von γινώσκετε διακρίνειν und οὐ δύνασθε idiomatisch wieder. »Stürmisches Wetter« ist eine angemessene, nicht überstarke Wiedergabe von χειμών. Die textkritische Fußnote wird auf den sicher durch die vorgelegte Textmarkierung belegten Satzumfang beschränkt.
