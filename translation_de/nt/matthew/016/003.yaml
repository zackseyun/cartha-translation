id: MAT.16.3
reference: Matthew 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: de
  text: 'Und am Morgen: »Heute wird das Wetter stürmisch, denn der Himmel ist rot und düster.« Ihr versteht es, das Aussehen des Himmels[a] zu deuten; die Zeichen der Zeiten[b] aber könnt ihr nicht deuten.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Gesicht des Himmels«.'
    reason: lexical_alternative
  - marker: b
    text: Die »Zeichen der Zeiten« können insbesondere auf die geistliche Bedeutung der gegenwärtigen Zeit einschließlich der messianischen Taten Jesu hinweisen.
    reason: alternative_reading
  - marker: c
    text: Dieser Satz fehlt in einigen alten Handschriften.
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: am Morgen
  rationale: Die adverbiale Zeitangabe bildet den natürlichen Gegensatz zur vorausgehenden Wetterregel.
- source_word: χειμών
  choice: Unwetter
  rationale: Hier bezeichnet das Wort nicht die Jahreszeit »Winter«, sondern schlechtes, stürmisches Wetter.
- source_word: πυρράζει
  choice: ist rot
  rationale: Die schlichte Farbangabe entspricht der meteorologischen Beobachtung und vermeidet eine übersteigerte Wiedergabe.
- source_word: στυγνάζων
  choice: düster
  rationale: Das Partizip beschreibt den Himmel als finster beziehungsweise drohend; »düster« bewahrt diese Bildwirkung.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: das Aussehen des Himmels
  rationale: Wörtlich steht »das Gesicht des Himmels«; gemeint ist seine sichtbare Erscheinung. »Aussehen« ist im modernen Deutschen natürlich.
- source_word: γινώσκετε διακρίνειν
  choice: wisst ihr zu beurteilen
  rationale: Die Verbindung bezeichnet die Fähigkeit, eine Erscheinung richtig einzuschätzen. Die Formulierung erhält sowohl das Wissen als auch den unterscheidenden Urteilsvorgang.
- source_word: σημεῖα
  choice: Zeichen
  rationale: »Zeichen« bewahrt den in Matthäus wichtigen evidenziellen und offenbarenden Sinn.
- source_word: καιρῶν
  choice: der Zeiten
  rationale: καιρός bezeichnet hier bedeutsame Zeitpunkte oder Zeitlagen, nicht bloß Jahreszeiten. Die traditionelle und offene Wendung lässt den messianischen und endzeitlichen Bezug unausgedeutet.
- source_word: οὐ δύνασθε
  choice: könnt ihr nicht beurteilen
  rationale: Die Formulierung gibt die ausdrücklich bezeichnete Unfähigkeit wieder; das im zweiten Satzteil ausgelassene Verb wird aus Gründen deutscher Klarheit wiederholt.
theological_decisions:
- issue: Bedeutung der »Zeichen der Zeiten«
  choice: Die offene Formulierung »Zeichen der Zeiten« bleibt erhalten.
  alternative: »die messianischen Zeichen der gegenwärtigen Heilszeit« oder ausschließlich »endzeitliche Zeichen«
  rationale: Der Zusammenhang weist auf die geistliche Bedeutung der Gegenwart und auf Jesu Wirken hin, doch der griechische Ausdruck legt den Bezug nicht ausschließlich auf eine einzelne theologische Kategorie fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede wird zur natürlichen Verständlichkeit mit »sagt ihr« eingeleitet, das im griechischen Zusammenhang aus der parallelen Wetterregel ergänzt ist. Die Wiederholung von »beurteilen« schärft den rhetorischen Gegensatz, ohne die theologische Offenheit der »Zeichen der Zeiten« einzuschränken.
