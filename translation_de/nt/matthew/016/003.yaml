revisions:
- from: 'Und am Morgen sagt ihr: »Heute gibt es Unwetter, denn der Himmel ist rot und düster.« Das Aussehen des Himmels[a] wisst ihr zu beurteilen, die Zeichen der Zeiten[b] aber könnt ihr nicht beurteilen.[c]'
