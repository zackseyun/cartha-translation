source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: de
  text: Denn wer sein Leben retten will, wird es verlieren[a]; wer aber sein Leben um meinetwillen verliert, wird es finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder an beiden Stellen: „Seele“. Das griechische Wort psychē kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Denn wer …; wer aber
  rationale: Die indefiniten Relativkonstruktionen werden im Deutschen natürlich mit „wer“ wiedergegeben. „Denn“ bewahrt den Anschluss durch γάρ an den vorausgehenden Gedanken; „aber“ macht den durch δέ angezeigten Gegensatz deutlich.
- source_word: θέλῃ
  choice: will
  rationale: θέλω bezeichnet hier den Willen oder das Bestreben. Die deutsche Konstruktion „retten will“ ist idiomatisch und entspricht der griechischen Aussage knapp.
- source_word: ψυχὴν
  choice: Leben
  rationale: ψυχή bezeichnet in diesem Jüngerschaftswort das eigene Leben, ohne dass seine mögliche Bedeutung „Seele“ vollständig ausgeschlossen wäre. „Leben“ passt am besten zu retten, verlieren und finden; die traditionelle Alternative wird in einer Fußnote bewahrt.
- source_word: σῶσαι
  choice: retten
  rationale: σῴζω bedeutet retten oder bewahren. „Retten“ erhält die zugespitzte Gegenüberstellung mit „verlieren“.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: wird … verlieren / verliert
  rationale: Die erste Form ist ein Futur und wird entsprechend wiedergegeben. Die zweite steht im indefiniten Relativsatz und wird im Deutschen natürlich im Präsens formuliert.
- source_word: ἕνεκεν ἐμοῦ
  choice: um meinetwillen
  rationale: Die Wendung bezeichnet Grund beziehungsweise persönliche Ausrichtung auf Jesus. „Um meinetwillen“ ist präzise, idiomatisch und würdevoll.
- source_word: εὑρήσει
  choice: wird … finden
  rationale: Die direkte Wiedergabe erhält das paradoxe Wortspiel von verlieren und finden, ohne es durch „gewinnen“ auszudeuten.
- source_word: αὐτοῦ / αὐτήν
  choice: sein / es
  rationale: Das griechische Maskulinum Singular hat allgemeinen, repräsentativen Sinn. Das deutsche „wer sein Leben“ ist eine natürliche generische Konstruktion; „es“ verweist auf „Leben“ zurück.
theological_decisions:
- issue: Wiedergabe von ψυχή im Jüngerschaftsparadox
  choice: Leben
  alternative: Seele; Selbst
  rationale: Im Zusammenhang von Nachfolge, Selbstverleugnung und möglichem Tod bezeichnet ψυχή vor allem das eigene Leben. „Seele“ könnte den Sinn zu stark auf einen immateriellen Bestandteil des Menschen verengen. Da ψυχή jedoch ein breiteres Bedeutungsspektrum hat, wird diese echte Mehrdeutigkeit in der Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die symmetrische Satzstruktur und das Paradox von retten, verlieren und finden bleiben erhalten.
