  terminology: »Stolperstein« trifft σκάνδαλον idiomatisch und bildhaft. »Was Gottes ist« / »was der Menschen ist« bewahrt die offene Genitivkonstruktion und vermeidet eine interpretierende Einengung auf Pläne oder Interessen. »Menschen« ist hier eine sachgerechte Wiedergabe von ἀνθρώπων.
