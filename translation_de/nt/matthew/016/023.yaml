id: MAT.16.23
reference: Matthew 16:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: de
  text: 'Doch er wandte sich um und sagte zu Petrus: »Geh hinter mich, Satan! Du bist mir ein Stolperstein, denn du hast nicht das im Sinn, was Gottes ist, sondern was der Menschen ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: wandte sich um
  rationale: Das intransitiv gebrauchte Aoristpartizip bezeichnet Jesu körperliche Hinwendung; die natürliche deutsche Wendung gibt diese Bewegung wieder.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Geh hinter mich
  rationale: Die Übersetzung bewahrt sowohl den Imperativ von ὑπάγω als auch die räumliche Aussage von ὀπίσω und lässt den möglichen Nachfolgeklang bestehen.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Die Anrede wird als geläufiger Name beziehungsweise Titel wiedergegeben, ohne festzulegen, ob Petrus mit Satan identifiziert oder als dessen Werkzeug angesprochen wird.
- source_word: σκάνδαλον
  choice: Stolperstein
  rationale: Das Wort bewahrt das konkrete Bild eines Hindernisses, das zu Fall bringen kann; »Ärgernis« wäre im heutigen Deutsch abstrakter und missverständlicher.
- source_word: ἐμοῦ
  choice: mir
  rationale: Der Genitiv bezeichnet hier idiomatisch die betroffene Person; »mir ein Stolperstein« ist knapp und natürlich.
- source_word: φρονεῖς
  choice: hast … im Sinn
  rationale: Die Wendung bezeichnet Denkweise, Ausrichtung und Anliegen, nicht lediglich einen einzelnen Gedanken.
- source_word: τὰ τοῦ θεοῦ
  choice: was Gottes ist
  rationale: Die substantivische Genitivkonstruktion bleibt bewusst weit und bewahrt den Gegensatz, ohne sie auf »Pläne« oder »Interessen« einzuengen.
- source_word: τὰ τῶν ἀνθρώπων
  choice: was der Menschen ist
  rationale: Die spiegelbildliche Formulierung wahrt den rhetorischen Gegensatz zu »was Gottes ist«; »Menschen« gibt ἀνθρώπων hier als allgemeine Bezeichnung der Menschheit natürlich und sachgerecht wieder.
theological_decisions:
- issue: Bedeutung der Anrede »Satan« an Petrus
  choice: Die scharfe direkte Anrede »Satan« bleibt stehen.
  alternative: »Widersacher« oder eine ausdrückliche Deutung, Satan rede beziehungsweise wirke durch Petrus.
  rationale: Der griechische Text entscheidet nicht ausdrücklich zwischen einer unmittelbaren Bezeichnung und einer Anspielung auf satanischen Widerstand. Die Übersetzung erhält diese Spannung und den Bezug zur Versuchungserzählung.
- issue: Sinn von Ὕπαγε ὀπίσω μου
  choice: »Geh hinter mich«
  alternative: »Weiche von mir« oder »Geh weg von mir«
  rationale: Die räumliche Aussage kann neben der Zurückweisung auch daran erinnern, dass Petrus als Jünger hinter Jesus gehört. Eine freiere Wiedergabe würde diese mögliche Doppeldeutigkeit beseitigen.
- issue: Umfang von »was Gottes ist« und »was der Menschen ist«
  choice: Die offenen Genitivformulierungen werden beibehalten.
  alternative: »Gottes Pläne/Interessen« und »menschliche Interessen«
  rationale: Der Text stellt göttliche und menschliche Ausrichtung umfassend gegenüber; eine Konkretisierung würde die Aussage unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gegensatz. »Stolperstein« ist anschaulich und allgemein verständlich; »Geh hinter mich« klingt markant, bewahrt aber bewusst die räumliche und mögliche nachfolgetheologische Spannung des Originals.
