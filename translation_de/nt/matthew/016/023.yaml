  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Textes genau wieder: Jesu Umwenden, die direkte Anrede an Petrus, den räumlich formulierten Imperativ, »Satan«, das Bild des Stolpersteins sowie den Gegensatz zwischen dem, was Gottes ist, und dem, was der Menschen ist. Die scharfe, im Griechischen nicht weiter ausgelegte Anrede »Satan« bleibt angemessen offen.'
