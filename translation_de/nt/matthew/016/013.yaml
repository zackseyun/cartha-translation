id: MAT.16.13
reference: Matthew 16:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: de
  text: 'Als Jesus in die Gegend von Cäsarea Philippi kam, fragte er seine Jünger: „Für wen halten die Leute den Menschensohn?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wer, sagen die Leute, ist der Menschensohn?“'
    reason: Die Fußnote bewahrt die im Griechischen sichtbare Struktur mit λέγουσιν („sagen“) und εἶναι („sein“), die im Haupttext idiomatisch mit „für wen halten“ wiedergegeben wird.
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Als ... kam
  rationale: Der Aoristpartizip mit δέ eröffnet eine neue Szene und bezeichnet den zeitlichen Rahmen. „Als ... kam“ gibt dies im Deutschen natürlich wieder; ein zusätzliches „nun“ ist im Ausgangstext nicht ausdrücklich vorhanden.
- source_word: εἰς τὰ μέρη
  choice: in die Gegend
  rationale: μέρη bezeichnet hier idiomatisch das Gebiet beziehungsweise Umland, nicht wörtlich einzelne „Teile“.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Cäsarea Philippi
  rationale: Dies ist die gebräuchliche deutsche Form des Ortsnamens und unterscheidet den Ort von anderen Städten namens Cäsarea.
- source_word: ἠρώτα
  choice: fragte
  rationale: Das Imperfekt kann einen andauernden oder einsetzenden Vorgang darstellen. Im natürlichen deutschen Erzählstil genügt hier das Präteritum; „war dabei zu fragen“ wäre unnötig schwerfällig.
- source_word: μαθητὰς
  choice: Jünger
  rationale: „Jünger“ ist im Evangelienkontext die etablierte und sachlich passende Wiedergabe.
- source_word: λέγων
  choice: durch Doppelpunkt wiedergegeben
  rationale: Das formelhafte Partizip „sagend“ leitet den Inhalt der Frage ein. Ein Doppelpunkt ist im modernen Deutschen natürlicher als „indem er sagte“.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: Für wen halten die Leute ...?
  rationale: Diese deutsche Konstruktion gibt die indirekte Aussage mit λέγουσιν und εἶναι idiomatisch wieder. „Die Leute“ bezeichnet hier Menschen allgemein, nicht nur Männer.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: „Menschensohn“ ist Jesu charakteristische Selbstbezeichnung und bewahrt die biblischen sowie insbesondere danielischen Bezüge.
theological_decisions:
- issue: Wiedergabe von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: Die traditionelle Wiedergabe erhält sowohl den Charakter einer Selbstbezeichnung als auch die mögliche Anspielung auf Daniel 7, ohne die mehrdeutige Wendung auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die umständliche griechische Redeeinleitung wird durch einen Doppelpunkt natürlich wiedergegeben; die Titelform „Menschensohn“ bleibt erhalten.
