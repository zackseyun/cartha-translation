review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle Elemente des griechischen Satzes wieder: den erzählerischen Anschluss (Τότε), Jesu Rede an seine Jünger, die offene Bedingung, das Sich-selbst-Verleugnen, das persönliche Kreuz und den abschließenden Aufruf zur Nachfolge. Die Unterscheidung zwischen ὀπίσω μου ἐλθεῖν („mir nachfolgen“) und ἀκολουθείτω μοι („mir folgen“) wird trotz unvermeidlicher semantischer Nähe im Deutschen sinnvoll erhalten.'
  naturalness: „Dann sagte Jesus zu seinen Jüngern“ und die anschließende direkte Rede sind modernes, würdiges Standarddeutsch. „Soll er sich selbst verleugnen“ ist eine natürliche Wiedergabe des Imperativs der dritten Person; die knappe Reihung der Aufforderungen wirkt klar und einprägsam.
  terminology: „Jünger“, „sich selbst verleugnen“ und „sein Kreuz auf sich nehmen“ sind etablierte, sachgerechte Begriffe. Sie bewahren das Kreuzbild, ohne es durch eine einengende Auslegung zu ersetzen. Der maskuline Singular bei „jemand … er … sein“ ist im Deutschen generisch und stimmt mit der singularischen griechischen Form überein.
