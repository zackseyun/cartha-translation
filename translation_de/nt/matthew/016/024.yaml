id: MAT.16.24
reference: Matthew 16:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: de
  text: 'Dann sagte Jesus zu seinen Jüngern: „Wenn jemand mir nachfolgen will, soll er sich selbst verleugnen, sein Kreuz auf sich nehmen und mir folgen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Natürlicher zeitlicher Erzählanschluss, der die Abfolge des Geschehens wiedergibt.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: „Jünger“ ist im Evangelienkontext die etablierte und sachgerechte Bezeichnung für Schüler und Nachfolger Jesu.
- source_word: Εἴ τις θέλει
  choice: Wenn jemand … will
  rationale: Gibt die offene Bedingung und den Willensaspekt von θέλει in natürlichem Deutsch wieder; „jemand“ wahrt den allgemeinen Geltungsbereich.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: mir nachfolgen
  rationale: Die Wendung bezeichnet hier den Eintritt in die Nachfolge. Das idiomatische deutsche Verb bewahrt diese Bedeutung; das abschließende „mir folgen“ gibt das eigenständige ἀκολουθείτω wieder.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: soll er sich selbst verleugnen
  rationale: „Sich selbst verleugnen“ ist eine direkte, etablierte Wiedergabe; „soll“ drückt den Imperativ der dritten Person in heutigem Deutsch natürlich aus.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: sein Kreuz auf sich nehmen
  rationale: Diese feste deutsche Wendung bildet sowohl das Aufnehmen als auch das persönliche Tragen des eigenen Kreuzes ab.
- source_word: ἀκολουθείτω μοι
  choice: mir folgen
  rationale: Klare Wiedergabe des Präsensimperativs; der fortdauernde Charakter der Nachfolge ergibt sich im Deutschen aus dem Kontext.
theological_decisions:
- issue: Allgemeiner Geltungsbereich bei grammatisch maskulinem Singular
  choice: „Wenn jemand … soll er sich selbst … sein Kreuz“
  alternative: „Wer … soll sich selbst … das eigene Kreuz“
  rationale: Der griechische Singular ist repräsentativ und schließt alle Menschen ein. Die gewählte deutsche Form bewahrt Numerus und grammatische Struktur, ohne den universalen Geltungsbereich einzuschränken.
- issue: Bedeutung des Kreuztragens
  choice: Die bildkräftige Aussage „sein Kreuz auf sich nehmen“ bleibt unkommentiert im Haupttext stehen.
  alternative: Eine deutende Umschreibung wie „bereit sein zu leiden“
  rationale: Der Text verbindet Nachfolge mit dem konkreten Kreuzbild. Eine bloße Leidensumschreibung würde die christologische Spannung und historische Härte des Ausdrucks abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und einprägsam. Es sind keine textkritischen oder erklärenden Fußnoten erforderlich.
