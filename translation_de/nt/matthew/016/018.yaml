id: MAT.16.18
reference: Matthew 16:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: de
  text: 'Und auch ich sage dir: Du bist Petrus, und auf diesen Felsen[a] werde ich meine Gemeinde bauen; und die Tore des Totenreichs[b] werden sie nicht überwältigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dieser Felsen“ kann auf Petrus, auf sein Bekenntnis oder auf Petrus als bekennenden und repräsentativen Apostel bezogen werden.
    reason: alternative_reading
  - marker: b
    text: 'Griechisch: „Hades“, das Reich der Toten. Traditionell wird auch „Hölle“ übersetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ σοι λέγω
  choice: Und ich sage dir
  rationale: κἀγώ betont das Ich Jesu und δέ führt mit leichter Gegenüberstellung weiter. Im Deutschen gibt „Und ich sage dir“ die Antwortbewegung natürlich wieder; ein zusätzliches „auch“ wäre hier missverständlich.
- source_word: Πέτρος / πέτρα
  choice: Petrus / Felsen
  rationale: Die übliche Namensform „Petrus“ und „Felsen“ bewahren das erkennbare Wortspiel, ohne seinen umstrittenen Bezug in der Übersetzung festzulegen.
- source_word: οἰκοδομήσω
  choice: werde ich … bauen
  rationale: Die wörtliche Bau-Metapher bleibt erhalten und klingt im Deutschen natürlich.
- source_word: μου τὴν ἐκκλησίαν
  choice: meine Gemeinde
  rationale: ἐκκλησία bezeichnet hier die zu Jesus gehörende Gemeinschaft. „Gemeinde“ ist im modernen Bibeldeutsch verständlich und vermeidet, den Begriff vorschnell auf eine Institution oder ein Gebäude zu verengen.
- source_word: πύλαι ᾅδου
  choice: die Tore des Totenreichs
  rationale: ᾅδης bezeichnet den Bereich der Toten, nicht ausdrücklich den Ort endgültiger Strafe. „Totenreich“ macht dies im Deutschen unmittelbar verständlich und erhält das Bild der Tore.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: werden sie nicht überwältigen
  rationale: κατισχύω bedeutet hier überwältigen, bezwingen oder die Oberhand gewinnen. Das feminine Pronomen αὐτῆς bezieht sich auf ἐκκλησία und wird mit „sie“ wiedergegeben.
theological_decisions:
- issue: Bezug von „dieser Felsen“
  choice: Im Haupttext nicht festgelegt
  alternative: Bezug auf Petrus selbst, auf sein Bekenntnis oder auf Petrus als bekennenden und repräsentativen Apostel
  rationale: Das griechische Wortspiel zwischen Πέτρος und πέτρα ist deutlich, bestimmt aber die genaue theologische Beziehung nicht ausdrücklich. Die Übersetzung wahrt diese Spannung.
- issue: Bedeutung von ᾅδης
  choice: Totenreich
  alternative: Hades; Hölle
  rationale: „Totenreich“ gibt den griechischen Begriff semantisch präziser wieder als „Hölle“ und vermeidet die Gleichsetzung mit der endgültigen Strafe.
- issue: Bild der Tore und κατισχύω
  choice: „werden sie nicht überwältigen“ ohne nähere Erklärung der Bildlogik
  alternative: „werden ihr nicht standhalten“ oder eine Deutung als Angriffsmacht des Todes
  rationale: Der Text sagt, dass die Tore des Totenreichs die Gemeinde nicht bezwingen werden, erklärt jedoch nicht ausdrücklich, ob das Bild defensiv oder offensiv zu entfalten ist. Die Formulierung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt ersetzt das im Deutschen schwerfällige „dass“ nach der direkten Anrede. „Gemeinde“ ist bewusst gemeinschaftsbezogen; „Totenreich“ ist verständlicher als die bloße Transkription „Hades“. Beide Fußnotenmarker stehen im Haupttext.
