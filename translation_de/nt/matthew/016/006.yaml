id: MAT.16.6
reference: Matthew 16:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: de
  text: 'Jesus aber sagte zu ihnen: „Gebt acht und hütet euch vor dem Sauerteig[a] der Pharisäer und Sadduzäer!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Hefe. Das griechische Wort bezeichnet ein gärendes Triebmittel; hier wird es bildlich gebraucht und später im Zusammenhang näher erklärt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten Gegensatz beziehungsweise einen Übergang zum vorangehenden Zusammenhang; die Nachstellung in „Jesus aber“ wahrt den griechischen Erzählton, ohne im Deutschen schwerfällig zu wirken.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Formale und zugleich natürliche Wiedergabe von λέγω mit indirektem Objekt.
- source_word: Ὁρᾶτε
  choice: Gebt acht
  rationale: Der Imperativ von ὁράω dient hier idiomatisch als Warnruf; „Gebt acht“ vermittelt diese Funktion in modernem, würdigem Deutsch.
- source_word: προσέχετε
  choice: hütet euch
  rationale: Zusammen mit Ὁρᾶτε verstärkt das Verb die Warnung. Die Verbindung „Gebt acht und hütet euch“ erhält die rhetorische Doppelung.
- source_word: ἀπὸ
  choice: vor
  rationale: Bei einem Verb des Sich-Hütens wird ἀπό im Deutschen idiomatisch mit „vor“ wiedergegeben.
- source_word: ζύμης
  choice: Sauerteig
  rationale: „Sauerteig“ bezeichnet ein gärendes Triebmittel und bewahrt die bildhafte, biblisch vertraute Ausdrucksweise besser als das modern-technische „Hefe“.
- source_word: Φαρισαίων
  choice: Pharisäer
  rationale: Im Deutschen übliche Bezeichnung dieser Gruppe.
- source_word: Σαδδουκαίων
  choice: Sadduzäer
  rationale: Im Deutschen übliche Bezeichnung dieser Gruppe.
theological_decisions:
- issue: Bildhafte Bedeutung von ζύμη
  choice: Das Bild vom Sauerteig bleibt im Haupttext unausgelegt.
  alternative: Die Metapher unmittelbar als „Lehre“ oder „Einfluss“ wiedergeben.
  rationale: Jesus erläutert das Bild erst im folgenden Zusammenhang. Seine vorzeitige Auflösung würde die Bildsprache des Verses und den Erzählverlauf einebnen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die doppelte Warnformel des Griechischen und die noch nicht erklärte Metapher bleiben erhalten.
