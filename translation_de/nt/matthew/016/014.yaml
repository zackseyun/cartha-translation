id: MAT.16.14
reference: Matthew 16:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: de
  text: 'Sie antworteten: „Die einen sagen: Johannes der Täufer; andere: Elia; wieder andere: Jeremia oder einer der Propheten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Sie antworteten
  rationale: Im Zusammenhang reagieren die Jünger auf Jesu Frage. Deutsch gibt λέγω in einer solchen Frage-Antwort-Situation natürlich mit „antworten“ wieder; δέ führt die Reaktion fort und muss nicht eigens übersetzt werden.
- source_word: Οἱ μὲν
  choice: Die einen sagen
  rationale: μέν eröffnet eine gegliederte Verteilung, die durch ἄλλοι und ἕτεροι fortgeführt wird. „Die einen“ bildet diese Struktur im Deutschen idiomatisch ab.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Johannes der Täufer
  rationale: Dies ist die etablierte und allgemein verständliche deutsche Bezeichnung; die Akkusativform im Griechischen gehört zur elliptischen indirekten Aussage.
- source_word: ἄλλοι δὲ
  choice: andere
  rationale: Die Fortsetzung der Verteilung wird knapp und natürlich wiedergegeben; δέ braucht im Deutschen hier kein zusätzliches „aber“.
- source_word: Ἠλίαν
  choice: Elia
  rationale: Übliche deutsche Namensform des alttestamentlichen Propheten.
- source_word: ἕτεροι δὲ
  choice: wieder andere
  rationale: „Wieder andere“ macht die dritte Personengruppe der Aufzählung klar, ohne einen sachlichen Gegensatz hinzuzufügen.
- source_word: Ἰερεμίαν
  choice: Jeremia
  rationale: Übliche deutsche Namensform des Propheten.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: oder einer der Propheten
  rationale: Die Formulierung bewahrt die Alternative des griechischen ἤ und fügt kein im Ausgangstext fehlendes „anderen“ hinzu.
theological_decisions:
- issue: Unausgesprochenes Bezugswort der Identifizierungen
  choice: 'Die elliptische Aufzählung bleibt erhalten: „Johannes der Täufer; andere: Elia …“'
  alternative: „Die einen sagen, du seist Johannes der Täufer, andere, du seist Elia …“
  rationale: Der griechische Vers nennt nur die Identifizierungen im Akkusativ und setzt Jesu vorangehende Frage voraus. Die deutsche Zeichensetzung macht diese Ellipse verständlich, ohne „du seist“ ausdrücklich hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelstruktur „die einen … andere … wieder andere“ bildet die griechische Verteilung klar ab; Doppelpunkte und Semikola erhalten die knappe, elliptische Antwort.
