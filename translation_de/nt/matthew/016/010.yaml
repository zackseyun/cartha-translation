  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: de
  text: Oder die sieben Brote für die Viertausend und wie viele große Körbe ihr eingesammelt habt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Oder
  rationale: In der elliptischen Fortsetzung der vorausgehenden Fragen führt οὐδὲ einen weiteren Punkt der Reihe ein. Im modernen Deutschen gibt „Oder“ diesen Anschluss natürlich wieder; „Auch nicht“ wäre formaler, wirkt hier aber schwerfälliger.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: die sieben Brote
  rationale: ἄρτοι bezeichnet im Zusammenhang der Speisung konkrete Brote; „Brote“ ist die natürliche und anschauliche deutsche Entsprechung.
- source_word: τῶν τετρακισχιλίων
  choice: für die viertausend Menschen
  rationale: Der Genitiv verweist auf die Speisung der Viertausend. „Für“ drückt den Zusammenhang idiomatisch aus; „Menschen“ verdeutlicht, dass eine Personenzahl gemeint ist, ohne den Sinn einzuengen.
- source_word: πόσας σπυρίδας
  choice: wie viele große Körbe
  rationale: πόσας ist die direkte Mengenfrage. σπυρίς bezeichnet einen größeren Korbtyp als κόφινος; „große Körbe“ bewahrt diese erzählerisch bedeutsame Unterscheidung.
- source_word: ἐλάβετε
  choice: ihr aufgehoben habt
  rationale: Im Kontext des Einsammelns der übrig gebliebenen Stücke bezeichnet λαμβάνω das Aufnehmen beziehungsweise Einsammeln. „aufgehoben“ ist natürlich und wahrt den Rückbezug auf die vorausgesetzte Erinnerung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Form des griechischen Fragesatzes bleibt erhalten und setzt wie der Ausgangstext den vorhergehenden Vers voraus. Die Kleinschreibung von „viertausend“ folgt der deutschen Standardschreibung für ausgeschriebene Kardinalzahlen.
