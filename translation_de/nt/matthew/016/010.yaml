    rationale: „Aufgehoben“ kann zwar das Aufnehmen bezeichnen, ist aber mehrdeutig und weniger klar auf das Einsammeln der Reste bezogen. „eingesammelt“ gibt die Handlung im Kontext genauer wieder.
  - severity: low
    issue: Explizites „Menschen“
    rationale: Der griechische Ausdruck nennt hier nur „die Viertausend“. Die Ergänzung ist kontextuell verständlich, aber für eine engere, dennoch natürliche Wiedergabe nicht erforderlich.
