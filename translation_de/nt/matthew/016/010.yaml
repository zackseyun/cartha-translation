  source_fidelity: Die elliptische Anschlussfrage und die sieben Brote für die Viertausend werden zutreffend wiedergegeben. Für ἐλάβετε ist „eingesammelt“ im Kontext des Einsammelns der übrig gebliebenen Stücke jedoch präziser als „aufgehoben“.
  naturalness: „Oder“ ist als elliptischer Anschluss an die vorausgehende Frage idiomatisch möglich. „Die Viertausend“ ist im Deutschen die knappe, kontextgemäße Bezeichnung der Speisung und vermeidet die nicht ausdrücklich im griechischen Vers stehende Ergänzung „Menschen“.
  terminology: „Brote“ ist angemessen. „große Körbe“ kann die im Erzählzusammenhang gegenüber κόφινοι erkennbare Unterscheidung von σπυρίδες wiedergeben, ohne eine zu spezifische Korbform zu behaupten.
