id: MAT.16.16
reference: Matthew 16:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: de
  text: 'Simon Petrus antwortete: »Du bist der Messias[a], der Sohn des lebendigen Gottes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Christus«. Der griechische Titel Χριστός bedeutet »Gesalbter« und entspricht dem Titel »Messias«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: antwortete
  rationale: Die griechische Verbindung bedeutet in dieser Redeeinleitung idiomatisch »antwortete«. Eine wörtliche Doppelung wie »antwortete und sagte« wäre im modernen Deutschen unnötig schwerfällig.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel markiert hier einen leichten Übergang beziehungsweise die Fortführung der Erzählung; der deutsche Satzfluss gibt dies bereits ausreichend wieder.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Die Personennamen werden nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: Σὺ
  choice: Du
  rationale: Das ausdrücklich gesetzte griechische Pronomen trägt Nachdruck. Das vorangestellte »Du« bewahrt diesen Akzent natürlich.
- source_word: ὁ χριστὸς
  choice: der Messias
  rationale: Χριστός bezeichnet hier den erwarteten Gesalbten und funktioniert als Titel. »Messias« macht diesen jüdisch-messianischen Zusammenhang im Deutschen unmittelbar erkennbar.
- source_word: ὁ υἱὸς
  choice: der Sohn
  rationale: Artikel und Substantiv bezeichnen einen bestimmten Sohn und haben hier titelartigen Charakter; »der Sohn« bewahrt diese Bestimmtheit.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: des lebendigen Gottes
  rationale: Die attributive Partizipialform wird idiomatisch und bedeutungsgetreu als »des lebendigen Gottes« wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel oder als christologisch vertraute Bezeichnung
  choice: Messias
  alternative: Christus
  rationale: In dem Bekenntnis ist Χριστός ein messianischer Titel. »Messias« bewahrt diese Funktion deutlich; die traditionsreiche Alternative »Christus« wird in der Fußnote genannt.
- issue: Aussagekraft von »Sohn des lebendigen Gottes«
  choice: der Sohn des lebendigen Gottes
  alternative: keine erläuternde Erweiterung
  rationale: Die griechische Bekenntnisformel wird unverändert in ihrer Bestimmtheit und theologischen Spannung bewahrt, ohne sie durch spätere dogmatische Terminologie auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform und der Nachdruck auf »Du« bleiben erhalten; »Messias« ist für heutige Leser verständlich und wahrt zugleich den Titelcharakter.
