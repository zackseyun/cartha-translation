  naturalness: '„Simon Petrus antwortete: »Du bist der Messias, der Sohn des lebendigen Gottes.«“ ist natürliches, modernes und zugleich würdiges Standarddeutsch. Zeichensetzung und direkte Rede sind korrekt und gut lesbar.'
