  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: de
  text: Und er erkannte sie nicht[a], bis sie einen Sohn zur Welt brachte[b]. Und er gab ihm den Namen Jesus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Erkannte sie nicht“ ist hier ein verhüllender Ausdruck für: „hatte keinen ehelichen Verkehr mit ihr“.'
    reason: lexical_alternative
  - marker: b
    text: „Bis“ bezeichnet, was bis zur Geburt Jesu galt; das Wort allein entscheidet nicht, was danach geschah.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Er nannte ihn Jesus.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: erkannte
  rationale: Das griechische γινώσκω („kennen/erkennen“) wird hier als verhüllender Ausdruck für geschlechtliche Beziehungen gebraucht. „Erkannte“ bewahrt diese Ausdrucksweise des Ausgangstextes; die explizite Bedeutung wird in einer Fußnote erläutert.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die übliche zeitliche Wiedergabe bezeichnet, was bis zur Geburt galt, ohne für sich genommen eine Aussage über die Zeit danach zu machen.
- source_word: ἔτεκεν
  choice: zur Welt brachte
  rationale: Eine natürliche und gegenwärtige deutsche Wiedergabe von τίκτω in diesem Geburtskontext.
- source_word: υἱόν
  choice: einen Sohn
  rationale: Das artikellose υἱόν wird hier am natürlichsten unbestimmt wiedergegeben; so wird keine im Griechischen nicht ausdrücklich markierte Hervorhebung eingetragen.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: er gab ihm den Namen Jesus
  rationale: Diese deutsche Namensformel gibt den Sinn natürlich und würdig wieder. Die wörtlichere Struktur „er nannte seinen Namen Jesus“ wäre im heutigen Deutsch unnötig fremd.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: „Jesus“ ist die im deutschen Neuen Testament übliche Namensform; „Josua“ würde zwar die hebräisch-aramäische Entsprechung spiegeln, wäre hier aber nicht die konventionelle Wiedergabe.
theological_decisions:
- issue: Bedeutung von „bis“ im Blick auf Marias späteres Eheleben
  choice: ἕως οὗ wird schlicht mit „bis“ wiedergegeben, ohne anzudeuten, ob es nach der Geburt zu ehelichen Beziehungen kam oder nicht.
  alternative: Manche folgern aus der Formulierung, dass danach eheliche Beziehungen begannen; andere sehen darin keinerlei Aussage über die Zeit danach.
  rationale: Der griechische Zeitausdruck setzt eine Grenze für die ausdrücklich beschriebene Zeitspanne, entscheidet aber allein nicht, was danach geschah. Die Fußnote bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die altertümlich wirkende, aber ausgangstextnahe Wendung „erkannte sie nicht“ bleibt bewusst erhalten und wird unmittelbar durch eine Fußnote erschlossen; „zur Welt brachte“ und „gab ihm den Namen“ sorgen zugleich für natürliche Verständlichkeit.
