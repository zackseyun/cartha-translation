  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: de
  text: Asor zeugte Zadok, Zadok zeugte Achim, und Achim zeugte Eliud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Asor
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: δέ
  choice: und / im Deutschen teilweise nicht eigens wiedergegeben
  rationale: In der Stammbaumfolge dient δέ als einfacher weiterführender Konnektor. Die ersten beiden Vorkommen werden durch die parataktische Satzfolge ausgedrückt; vor dem letzten Glied steht natürliches deutsches „und“.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet γεννάω das Zeugen beziehungsweise die Abstammungsfolge auf männlicher Linie. „Zeugte“ ist knapp, würdig und im Deutschen für Stammbäume geläufig.
- source_word: τὸν
  choice: nicht gesondert wiedergegeben
  rationale: Der griechische Akkusativartikel kennzeichnet die Eigennamen als direkte Objekte; im Deutschen steht in dieser Konstruktion normalerweise kein Artikel.
- source_word: Σαδώκ
  choice: Zadok
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
- source_word: Ἀχίμ
  choice: Achim
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
- source_word: Ἐλιούδ
  choice: Eliud
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
