id: MAT.1.22
reference: Matthew 1:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: de
  text: 'Dies alles aber ist geschehen, damit erfüllt würde, was vom Herrn durch den Propheten gesagt worden war[a], der sprach:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies alles aber geschah.“ Die griechische Wendung τοῦτο δὲ ὅλον hebt die Gesamtheit der unmittelbar zuvor geschilderten Ereignisse hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Dies alles aber
  rationale: Die Wendung fasst die zuvor geschilderten Ereignisse als Ganzes zusammen; „aber“ gibt die weiterführende, leicht absetzende Funktion von δέ wieder, ohne einen zeitlichen Ausdruck einzuführen.
- source_word: γέγονεν
  choice: ist geschehen
  rationale: Das Perfekt wird formal und zugleich natürlich wiedergegeben und lässt den Gegenwartsbezug des Geschehenen erkennen.
- source_word: ἵνα πληρωθῇ
  choice: damit erfüllt würde
  rationale: Bewahrt Passiv und Ziel-/Folgebezug der ἵνα-Konstruktion, ohne eindeutig zwischen Absicht und Ergebnis zu entscheiden.
- source_word: τὸ ῥηθὲν
  choice: was ... gesagt worden war
  rationale: Die substantivierte Passivform wird idiomatisch wiedergegeben; das Plusquamperfekt ordnet den prophetischen Ausspruch zeitlich vor dem berichteten Geschehen ein.
- source_word: ὑπὸ κυρίου
  choice: vom Herrn
  rationale: Gibt den Herrn als den eigentlichen Urheber der prophetischen Rede wieder, ohne „Gott“ ergänzend einzutragen.
- source_word: διὰ τοῦ προφήτου
  choice: durch den Propheten
  rationale: 'Bewahrt die vom Griechischen markierte vermittelte Urheberschaft: Der Herr spricht durch den Propheten.'
- source_word: λέγοντος
  choice: der sprach
  rationale: Das Partizip bezieht sich grammatisch auf den Propheten und leitet in natürlichem, würdigem Deutsch das folgende Zitat ein.
theological_decisions:
- issue: Urheberschaft prophetischer Rede
  choice: „vom Herrn durch den Propheten“
  alternative: „vom Propheten im Auftrag des Herrn“
  rationale: Die unterschiedliche Konstruktion mit ὑπό und διά stellt den Herrn als eigentlichen Sprecher und den Propheten als Vermittler dar; diese Unterscheidung bleibt erhalten, ohne eine weitergehende Inspirationslehre auszuformulieren.
- issue: Erfüllungsformel
  choice: „damit erfüllt würde“
  alternative: „sodass sich erfüllte“
  rationale: Die gewählte Formulierung hält Ziel und Ergebnis als mögliche Nuancen von ἵνα + Konjunktiv offen und bewahrt zugleich das Passiv des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wahrt die Unterscheidung zwischen dem Herrn als Urheber und dem Propheten als Vermittler. „Der sprach“ ist als Zitateinleitung im biblischen Erzählregister natürlich und grammatisch eindeutig.
