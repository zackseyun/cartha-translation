source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: de
  text: Isai zeugte David, den König. David zeugte Salomo mit der Frau des Uria[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „aus der [Frau] des Uria“. Gemeint ist Urias Frau; Matthäus nennt Batseba hier nicht beim Namen.'
    reason: Die Fußnote macht die elliptische Formulierung des Griechischen und Matthäus’ indirekte Bezeichnung der Frau sichtbar.
lexical_decisions:
- source_word: Ἰεσσαὶ
  choice: Isai
  rationale: Die im Deutschen gebräuchliche biblische Namensform für Ἰεσσαί.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet γεννάω die männliche Zeugung beziehungsweise Abstammung. „Zeugte“ ist knapp, präzise und im Deutschen weiterhin verständlich.
- source_word: Δαυὶδ τὸν βασιλέα
  choice: David, den König
  rationale: Der bestimmte Artikel und die Apposition heben David ausdrücklich als den König hervor.
- source_word: δὲ
  choice: aber / nicht eigens wiedergegeben
  rationale: Das erste δέ wird als leichtes fortführendes „aber“ wiedergegeben. Beim zweiten Satz ist es zur Vermeidung einer im Deutschen schwerfälligen Wiederholung nicht eigens übersetzt; die Fortführung bleibt durch die Satzfolge deutlich.
- source_word: Σολομῶνα
  choice: Salomo
  rationale: Die etablierte deutsche Namensform für Σολομών.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: mit der Frau des Uria
  rationale: Die elliptische griechische Wendung lautet wörtlich etwa „aus der [Frau] des Uria“. „Mit der Frau des Uria“ gibt im Deutschen idiomatisch die mütterliche Herkunft an, ohne ihren Namen zu ergänzen.
- source_word: Οὐρίου
  choice: Uria
  rationale: Die etablierte deutsche Namensform für Οὐρίας.
theological_decisions:
- issue: Matthäus’ indirekter Hinweis auf Batseba
  choice: „mit der Frau des Uria“; der Name Batseba wird nicht ergänzt
  alternative: „mit Batseba“ oder „mit der früheren Frau des Uria“
  rationale: Der griechische Text bezeichnet die Frau bewusst durch ihre Beziehung zu Uria. So bleiben die erzählerische und moralische Spannung sowie der Bezug auf 2 Samuel erhalten, ohne über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe genealogische Satzform bleibt erhalten. „Zeugte“ bewahrt die konkrete männlich-genealogische Aussage; „mit der Frau des Uria“ ist natürliches Deutsch und erhält zugleich die auffällige indirekte Benennung.
