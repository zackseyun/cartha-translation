source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: de
  text: Salmon zeugte Boas mit Rahab[a], Boas zeugte Obed mit Rut, und Obed zeugte Isai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus Rahab“; entsprechend auch „aus Rut“. Im Griechischen steht bei beiden Müttern ἐκ („aus, von“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Im Stammbaum bezeichnet γεννάω das Zeugen beziehungsweise die genealogische Abstammung in der väterlichen Linie. „zeugte“ ist im Deutschen knapp, würdig und in diesem Zusammenhang verständlich.
- source_word: ἐκ
  choice: mit
  rationale: ἐκ mit dem Namen der Mutter bezeichnet hier die mütterliche Herkunft. Die deutsche genealogische Wendung „zeugte ... mit ...“ nennt beide Eltern natürlich und ausdrücklich; die wörtlichere Möglichkeit „aus/von“ wird in der Fußnote vermerkt.
- source_word: δὲ
  choice: ohne durchgehend eigens wiedergegeben; vor dem letzten Glied „und“
  rationale: δέ ist hier ein schwaches, fortführendes Bindewort und nicht adversativ. Im natürlichen Deutschen muss es nicht in jedem Glied ausdrücklich erscheinen; das abschließende „und“ erhält den Reihungscharakter.
- source_word: Σαλμὼν
  choice: Salmon
  rationale: Die im deutschen Bibelgebrauch etablierte Namensform wahrt die Wiedererkennbarkeit.
- source_word: Βόες
  choice: Boas
  rationale: Die übliche deutsche Form des alttestamentlichen Namens verbindet die neutestamentliche Genealogie erkennbar mit der Gestalt aus dem Buch Rut.
- source_word: Ῥαχάβ
  choice: Rahab
  rationale: Etablierte deutsche Namensform.
- source_word: Ἰωβὴδ
  choice: Obed
  rationale: Die übliche deutsche Form des alttestamentlichen Namens wahrt die kanonische Kontinuität.
- source_word: Ῥούθ
  choice: Rut
  rationale: „Rut“ ist die heute im deutschen Bibelgebrauch weithin übliche Form und entspricht auch dem Namen des alttestamentlichen Buches.
- source_word: Ἰεσσαί
  choice: Isai
  rationale: Etablierte deutsche Bibelform des Namens.
theological_decisions:
- issue: Genealogische Formel und ausdrückliche Nennung der Mütter
  choice: Die väterliche Linie wird mit „zeugte“ wiedergegeben, während Rahab und Rut durch „mit“ ausdrücklich als Mütter genannt werden.
  alternative: „war der Vater von“ ohne ausdrückliche mütterliche Zuordnung oder wörtlicher „zeugte ... aus/von Rahab“.
  rationale: Der griechische Text hebt die Mütter durch ἐκ mit Genitiv eigens hervor. Die Übersetzung bewahrt sowohl die väterliche genealogische Formel als auch diese auffällige Nennung, ohne darüber hinaus eine theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Wiederholung von „zeugte“ erhält den Rhythmus der Genealogie. Die etablierten deutschen biblischen Namensformen Boas, Rut und Isai sichern die Wiedererkennbarkeit.
