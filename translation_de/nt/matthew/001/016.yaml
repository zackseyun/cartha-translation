id: MAT.1.16
reference: Matthew 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: de
  text: Jakob zeugte Josef, den Ehemann Marias. Von ihr wurde Jesus geboren, der Messias genannt wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ führt hier die Genealogie leicht weiter. Im Deutschen ergibt die bloße Fortsetzung ohne „und“ einen natürlicheren genealogischen Stil, ohne einen inhaltlichen Gegensatz anzudeuten.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Das aktive γεννάω bezeichnet in der Genealogie die männliche Zeugung beziehungsweise Abstammung. „Zeugte“ ist knapp, präzise und im gehobenen genealogischen Kontext weiterhin verständlich.
- source_word: ἄνδρα
  choice: Mann
  rationale: ἀνήρ bezeichnet mit dem Genitiv „Marias“ ihren Ehemann. „Den Mann Marias“ ist im modernen Standarddeutsch eine natürliche und eindeutige Bezeichnung der ehelichen Beziehung.
- source_word: ἐξ ἧς
  choice: von ihr
  rationale: Das feminine Singularpronomen verweist ausdrücklich auf Maria und durchbricht die wiederholte männliche Abstammungsformel. „Von ihr“ bewahrt diesen eindeutigen Bezug und gibt ἐκ idiomatisch wieder.
- source_word: ἐγεννήθη
  choice: wurde … geboren
  rationale: Der Passivwechsel gegenüber dem aktiven „zeugte“ wird erhalten. Die Formulierung bezeichnet Jesu Geburt von Maria, ohne Josef als den Zeugenden darzustellen.
- source_word: ὁ λεγόμενος
  choice: der … genannt wird
  rationale: Die partizipiale Wendung identifiziert Jesus durch den ihm beigelegten Titel. „Der … genannt wird“ gibt sie direkt und natürlich wieder.
- source_word: χριστός
  choice: Messias
  rationale: χριστός fungiert hier in der Identifikationsformel als Titel. „Messias“ vermittelt im Deutschen den titularen Sinn deutlicher als das stärker namensartig gebrauchte „Christus“.
theological_decisions:
- issue: Wiedergabe von Χριστός in einer christologischen Identifikationsformel
  choice: Messias
  alternative: Christus
  rationale: Die Wendung ὁ λεγόμενος χριστός stellt χριστός als Titel vor. „Messias“ bewahrt diese Funktion, ohne den Ausdruck wie einen Bestandteil des Eigennamens erscheinen zu lassen.
- issue: Wechsel von Josefs Zeugung zu Jesu Geburt
  choice: Jakob zeugte Josef; Jesus wurde von Maria geboren
  alternative: eine gleichförmige Zeugungsformel für Josef und Jesus
  rationale: Der griechische Text wechselt bewusst vom aktiven ἐγέννησεν zum passiven ἐγεννήθη mit dem femininen ἐξ ἧς. Die Übersetzung erhält diesen Unterschied und sagt nicht, Josef habe Jesus gezeugt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper genealogischer Satzführung. Die Satzteilung verhindert eine schwerfällige Verschachtelung und lässt den ausdrücklichen Bezug von „von ihr“ auf Maria klar hervortreten.
