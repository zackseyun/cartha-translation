  source_fidelity: Die Übersetzung bewahrt den entscheidenden Wechsel von aktivem „zeugte“ bei Josef zu passivem „wurde geboren“ bei Jesus und macht durch „von ihr“ den femininen Bezug auf Maria deutlich. „Messias“ gibt χριστός angemessen als Titel wieder. Bei ἄνδρα ist jedoch die eheliche Bedeutung im Kontext maßgeblich und sollte explizit übersetzt werden.
  naturalness: Die knappe Satzteilung und „Von ihr wurde Jesus geboren“ sind modernes, verständliches Standarddeutsch. „Den Mann Marias“ ist dagegen zwar wörtlich möglich, klingt aber ungewohnt und kann im heutigen Deutsch auch lediglich einen männlichen Bezug zu Maria bezeichnen; „den Ehemann Marias“ ist klarer und natürlicher.
  terminology: „Zeugte“, „Ehemann“, „Messias“ und „genannt wird“ treffen den genealogischen bzw. titularen Registerwert. Die Wiedergabe vermeidet es zutreffend, Josef als Vater Jesu zu bezeichnen.
