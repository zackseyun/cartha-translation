id: MAT.1.21
reference: Matthew 1:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: de
  text: Sie wird einen Sohn zur Welt bringen, und du sollst ihm den Namen Jesus geben[a]; denn er wird sein Volk von seinen Sünden retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus ist die griechische Form des hebräischen beziehungsweise aramäischen Namens Jeschua (Josua), der mit der Aussage „Der HERR rettet“ verbunden ist. Die Begründung „denn er wird … retten“ greift diese Namensbedeutung auf.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: wird … zur Welt bringen
  rationale: Das Futur von τίκτω bezeichnet hier die Geburt eines Kindes. „Zur Welt bringen“ ist im modernen Deutsch natürlich und bewahrt den vorausblickenden Charakter.
- source_word: δὲ
  choice: und
  rationale: δέ ist ein schwaches verbindendes Glied. „Und“ gibt den Fortgang des Satzes natürlich wieder, ohne einen nicht vorhandenen Gegensatz einzutragen.
- source_word: υἱὸν
  choice: einen Sohn
  rationale: Das artikellose Akkusativobjekt wird in dieser Geburtsankündigung idiomatisch mit „einen Sohn“ wiedergegeben.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: du sollst ihm den Namen … geben
  rationale: Die semitisch-griechische Namengebungsformel wird in natürlichem, würdigem Deutsch wiedergegeben. „Du sollst“ bewahrt den anweisenden Zukunftssinn.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: „Jesus“ ist die etablierte deutsche Form des neutestamentlichen Personennamens; die mit dem Namen verbundene Rettungsbedeutung wird in der Fußnote erläutert.
- source_word: αὐτὸς
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen kennzeichnet das Kind als handelndes Subjekt. Im Deutschen trägt „er“ diese Funktion natürlich; „er selbst“ wäre möglich, könnte die Betonung jedoch stärker festlegen, als es der Zusammenhang verlangt.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die Namengebung. „Denn“ bildet diese erklärende Verknüpfung knapp und idiomatisch ab.
- source_word: σώσει
  choice: wird … retten
  rationale: σῴζω bezeichnet Rettung oder Befreiung. In Verbindung mit „von seinen Sünden“ ist „retten“ die direkteste Wiedergabe und lässt die theologische Tragweite bestehen.
- source_word: τὸν λαὸν αὐτοῦ
  choice: sein Volk
  rationale: λαός bedeutet „Volk“ und kann bundestheologische Anklänge haben. „Sein Volk“ bewahrt die Zugehörigkeitsbeziehung, ohne den Umfang im Vers näher festzulegen.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: von seinen Sünden
  rationale: ἀπό bezeichnet hier Trennung beziehungsweise Befreiung. Der Plural „Sünden“ und der Rückbezug auf „Volk“ werden im Deutschen idiomatisch bewahrt.
theological_decisions:
- issue: Betonung des Subjekts αὐτός bei Jesu Rettungshandeln
  choice: „er wird … retten“
  alternative: „er selbst wird … retten“
  rationale: Das griechische αὐτός stellt das Kind als Subjekt des Rettungshandelns heraus. Im deutschen Satz ist das ausdrückliche „er“ ausreichend und natürlich; „er selbst“ wäre vertretbar, könnte aber eine zusätzliche Kontrastbetonung nahelegen.
- issue: Umfang von „sein Volk“
  choice: ohne nähere Eingrenzung als „sein Volk“ wiedergegeben
  alternative: „sein Volk Israel“ oder „alle, die zu ihm gehören“
  rationale: Der unmittelbare Kontext ist jüdisch und bundestheologisch geprägt, doch der Ausdruck wird in diesem Vers nicht näher bestimmt. Die Übersetzung engt ihn weder auf Israel ein noch weitet sie ihn ausdrücklich auf die ganze Menschheit aus.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. Die Namengebungsformel wurde idiomatisch formuliert; die erklärende Wortverbindung zwischen „Jesus“ und „retten“ bleibt durch die Fußnote sichtbar.
