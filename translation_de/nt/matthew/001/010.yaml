id: MAT.1.10
reference: Matthew 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: de
  text: Hiskia zeugte Manasse, Manasse zeugte Amos[a], und Amos zeugte Josia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Übersetzungen lesen hier „Amon“ und gleichen den Namen damit an den judäischen König in 2. Könige 21 an; der hier zugrunde gelegte griechische Text des Matthäusevangeliums lautet „Amos“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: In der männlich geführten Abstammungsliste bezeichnet γεννάω das Zeugen beziehungsweise die Vaterschaft. „Zeugte“ ist knapp, würdevoll und im genealogischen Zusammenhang verständlich, ohne die Aussage zur bloßen Abfolge abzuschwächen.
- source_word: Ἑζεκίας
  choice: Hiskia
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: Μανασσῆς
  choice: Manasse
  rationale: Verwendet wird die etablierte deutsche Namensform.
- source_word: Ἀμώς
  choice: Amos
  rationale: Der SBLGNT bietet Ἀμώς, daher folgt der Haupttext unmittelbar dem griechischen Wortlaut. Die aus 2. Könige bekannte Form „Amon“ wird nicht stillschweigend harmonisierend eingesetzt.
- source_word: Ἰωσίας
  choice: Josia
  rationale: Verwendet wird die etablierte deutsche Namensform.
- source_word: δέ
  choice: und / durch Satzzeichen wiedergegeben
  rationale: In der fortlaufenden Genealogie dient δέ als einfacher weiterführender Konnektor. Die ersten Vorkommen werden natürlich durch Kommas, das letzte durch „und“ wiedergegeben.
theological_decisions:
- issue: Abweichung zwischen dem Namen in Matthäus’ griechischem Text und dem Königsnamen im Alten Testament
  choice: Im Haupttext steht „Amos“, entsprechend Ἀμώς.
  alternative: „Amon“ zur Angleichung an den judäischen König in 2. Könige 21 und 2. Chronik 33.
  rationale: Die Übersetzung folgt dem vorliegenden griechischen Ausgangstext und beseitigt die Namensspannung nicht durch eine stille Harmonisierung. Die bekannte alternative Zuordnung wird in einer Fußnote transparent gemacht.
translation_notes:
  register: Knapper, rhythmischer Genealogiestil in modernem Standarddeutsch. Die wiederholte Form „zeugte“ bewahrt Struktur und Aussage des griechischen Textes; die Namen folgen etablierten deutschen Bibelformen.
source_grounding:
  english_pob_role: consult_only
