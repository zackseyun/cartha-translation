id: MAT.1.18
reference: Matthew 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: de
  text: 'Die Geburt Jesu, des Messias[a], geschah so: Als seine Mutter Maria mit Josef verlobt war[b], stellte sich, noch bevor sie zusammenkamen[c], heraus, dass sie vom Heiligen Geist schwanger war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesu Christi“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“.'
    reason: alternative_reading
  - marker: b
    text: Die damalige Verlobung war eine formelle, rechtlich anerkannte Bindung und verpflichtender als eine heutige Verlobung.
    reason: cultural_note
  - marker: c
    text: „Zusammenkamen“ kann hier auch den Vollzug der ehelichen Gemeinschaft einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: Geburt
  rationale: Im erzählerischen Zusammenhang bezeichnet das Wort Jesu Zur-Welt-Kommen beziehungsweise dessen Entstehungsgeschichte. „Geburt“ ist hier die klare und natürliche deutsche Wiedergabe.
- source_word: Ἰησοῦ χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird als Titel verstanden und daher bedeutungstragend mit „Messias“ wiedergegeben; die Apposition ist im Deutschen idiomatisch.
- source_word: οὕτως ἦν
  choice: verhielt es sich so
  rationale: Die Wendung leitet die folgende Darstellung der Umstände ein. „Verhielt es sich so“ klingt im Deutschen natürlich und bewahrt diesen erklärenden Charakter.
- source_word: μνηστευθείσης
  choice: war … verlobt
  rationale: „Verlobt“ ist die verständliche moderne Bezeichnung; eine Fußnote erläutert, dass die damalige rechtsverbindliche Verlobung mehr bedeutete als eine heutige Verlobung.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: noch bevor sie zusammenkamen
  rationale: Die zurückhaltende Ausdrucksweise des Griechischen bleibt erhalten und wird nicht unnötig auf Zusammenwohnen oder Geschlechtsverkehr festgelegt.
- source_word: εὑρέθη
  choice: stellte sich heraus
  rationale: Die sachliche Feststellung des griechischen Passivs wird in natürlichem Deutsch ausgedrückt, ohne eine bestimmte Person als Entdecker hinzuzufügen.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: schwanger war
  rationale: Dies ist die heutige, direkte deutsche Wiedergabe der griechischen Wendung „im Mutterleib haben“.
- source_word: ἐκ πνεύματος ἁγίου
  choice: vom Heiligen Geist
  rationale: ἐκ bezeichnet hier Herkunft beziehungsweise Ursprung. „Vom Heiligen Geist“ gibt dies idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Im einleitenden Zusammenhang ist Χριστός als Titel erkennbar. „Messias“ macht seine Bedeutung sichtbar; „Christus“ bleibt als mögliche traditionelle Wiedergabe in der Fußnote erhalten.
- issue: Referenz von πνεύματος ἁγίου
  choice: der Heilige Geist
  alternative: heiliger Geist
  rationale: Die Wendung bezeichnet im Kontext den göttlichen Heiligen Geist. Der fehlende griechische Artikel verlangt keine unbestimmte Wiedergabe.
- issue: Bedeutungsumfang von συνελθεῖν
  choice: zusammenkamen
  alternative: eheliche Gemeinschaft vollzogen
  rationale: Die gewählte Formulierung bewahrt die verhüllende Ausdrucksweise und ihre mögliche Spannweite; die sexuelle beziehungsweise eheliche Implikation wird in der Fußnote benannt, aber nicht in den Haupttext hineingezwungen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die traditionelle, aber weiterhin geläufige Wendung „Mit der Geburt … verhielt es sich so“ vermeidet ein unnatürliches „Die Geburt geschah so“. Die diskrete Mehrdeutigkeit von „zusammenkamen“ bleibt erhalten; kulturelle und lexikalische Erläuterungen stehen in den Fußnoten.
