id: MAT.1.20
reference: Matthew 1:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: de
  text: 'Während er noch darüber nachdachte, da erschien ihm im Traum ein Engel des Herrn und sagte: „Josef, Sohn Davids, fürchte dich nicht, Maria, deine Frau, zu dir zu nehmen.[a] Denn was in ihr gezeugt worden ist, stammt vom Heiligen Geist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann hier bedeuten, Maria als seine Frau in sein Haus und zu sich aufzunehmen.
    reason: Erläutert den kontextuellen Sinn von παραλαμβάνω und die bereits bestehende Bezeichnung Marias als „deine Frau“, ohne sexuelle Gemeinschaft zusätzlich zu behaupten.
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: während er noch darüber nachdachte
  rationale: Gibt die andauernde innere Erwägung des Genitivus absolutus wieder, ohne bereits einen endgültigen Entschluss auszudrücken.
- source_word: ἰδοὺ
  choice: da
  rationale: Markiert in natürlichem deutschem Erzählstil den überraschenden Einsatz des Geschehens, ohne das heute stark altertümliche „siehe“ zu verwenden.
- source_word: ἄγγελος κυρίου
  choice: ein Engel des Herrn
  rationale: Der fehlende Artikel bei ἄγγελος spricht für die unbestimmte Wiedergabe; „des Herrn“ bewahrt die Gottesbezeichnung, ohne eine bestimmte alttestamentliche Identifikation zu erzwingen.
- source_word: κατ’ ὄναρ ἐφάνη αὐτῷ
  choice: erschien ihm im Traum
  rationale: Idiomtische und zugleich genaue deutsche Wiedergabe der Traumoffenbarung.
- source_word: υἱὸς Δαυίδ
  choice: Sohn Davids
  rationale: Bewahrt die genealogische Bezeichnung und ihren davidisch-messianischen Klang.
- source_word: μὴ φοβηθῇς
  choice: fürchte dich nicht
  rationale: Geläufige, würdige deutsche Formulierung, die sowohl Verbot als auch Ermutigung ausdrückt.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: Maria, deine Frau, zu dir zu nehmen
  rationale: Bewahrt die ausdrückliche Bezeichnung Marias als Josefs Frau und gibt παραλαμβάνω im Kontext als Aufnahme in Haus und eheliche Gemeinschaft wieder, ohne einen neuen Eheschluss zu behaupten.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: was in ihr gezeugt worden ist
  rationale: Das substantivierte neutrale Partizip bleibt mit „was“ formal offen; „gezeugt“ bildet γεννάω genauer ab als eine ausschließlich medizinische Wiedergabe mit „empfangen“.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: stammt vom Heiligen Geist
  rationale: „Stammt von“ bringt den durch ἐκ bezeichneten Ursprung in natürlichem Deutsch klar zum Ausdruck.
theological_decisions:
- issue: Bestimmtheit von ἄγγελος κυρίου
  choice: ein Engel des Herrn
  alternative: der Engel des Herrn
  rationale: Die artikellose griechische Form wird nicht vorschnell mit der bestimmten alttestamentlichen Formel gleichgesetzt.
- issue: Ehestatus in τὴν γυναῖκά σου
  choice: Maria, deine Frau
  alternative: Maria als deine Frau
  rationale: Die Apposition bezeichnet Maria bereits als Josefs Frau; die Formulierung vermeidet die zusätzliche Aussage, sie werde erst durch diesen Schritt zu seiner Frau.
- issue: Bezug von πνεύματός ... ἁγίου
  choice: vom Heiligen Geist
  alternative: von heiligem Geist
  rationale: Im Zusammenhang des matthäischen Kindheitsevangeliums bezeichnet die Wendung den göttlichen Heiligen Geist; zugleich bleibt ἐκ als Ursprungsangabe erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Da“ übernimmt die narrative Funktion von ἰδού, ohne Archaismus. Die direkte Rede bleibt knapp und feierlich.
