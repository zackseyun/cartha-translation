review_pass:
  verdict: revise
  source_fidelity: 'Der Vers gibt die wesentlichen Elemente des griechischen Textes zutreffend wieder: Josefs Erwägung, die Traumerscheinung eines Engels des Herrn, die davidische Anrede, die Aufforderung, Maria zu sich zu nehmen, und den Ursprung dessen, was in ihr gezeugt wurde, vom Heiligen Geist. „Da“ ist eine angemessene moderne narrative Entsprechung für ἰδού. „Was in ihr gezeugt worden ist“ wahrt die offene neutrale Formulierung des substantivierten Partizips und ist hier vertretbar.'
  naturalness: Das Deutsch ist flüssig, modern und zugleich dem biblischen Erzählregister angemessen. Die Stellung „Maria, deine Frau, zu dir zu nehmen“ ist klar und idiomatisch.
  terminology: „Ein Engel des Herrn“, „Sohn Davids“ und „der Heilige Geist“ sind sachgerecht. Die textliche Bezeichnung Marias als „deine Frau“ wird bewahrt, ohne eine zusätzliche Aussage über einen erst jetzt erfolgenden Eheschluss zu machen.
  issues:
  - severity: medium
    issue: Die Fußnote spricht von der Aufnahme „in die eheliche Gemeinschaft“.
    rationale: παραλαμβάνειν bezeichnet hier das Zu-sich-Nehmen bzw. Aufnehmen Marias in den eigenen Haushalt als Ehefrau. „Eheliche Gemeinschaft“ kann im heutigen Deutschen sexuelle Gemeinschaft nahelegen und fügt damit eine Aussage hinzu, die das Verb selbst nicht enthält; im unmittelbaren Kontext wird vielmehr ausdrücklich keine sexuelle Beziehung vor der Geburt erwähnt (Mt 1,25). Die Erläuterung sollte auf Haushalt und eheliches Zusammenleben ohne diese Implikation beschränkt werden.
