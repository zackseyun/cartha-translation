id: MAT.1.3
reference: Matthew 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: de
  text: Juda zeugte Perez und Serach mit Tamar. Perez zeugte Hezron, und Hezron zeugte Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Übersetzungen geben den Namen hier als „Ram“ wieder und folgen damit einer anderen Umschrift beziehungsweise Überlieferungstradition; im hier zugrunde gelegten griechischen Text steht „Aram“.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Juda
  rationale: Im Stammbaum bezeichnet der Name den alttestamentlichen Stammvater. „Juda“ ist dafür die etablierte deutsche Form und vermeidet eine Verwechslung mit neutestamentlichen Personen namens Judas.
- source_word: δὲ
  choice: Satzgliederung und „und“
  rationale: δέ verbindet hier die Glieder der genealogischen Folge ohne starken Gegensatz. Im Deutschen wird dies durch neue Sätze beziehungsweise vor dem letzten Glied durch „und“ natürlich wiedergegeben.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Das Verb bezeichnet in diesem genealogischen Zusammenhang die männliche Zeugung beziehungsweise Abstammung. „Zeugte“ ist knapp, genau und im Deutschen weiterhin verständlich, ohne die Aussage zu umschreiben.
- source_word: Φαρὲς
  choice: Perez
  rationale: Die Form entspricht dem hebräischen Namen פֶּרֶץ und wahrt die im deutschen Alten Testament übliche Namenskontinuität.
- source_word: Ζάρα
  choice: Serach
  rationale: Die deutsche alttestamentliche Namensform „Serach“ entspricht dem hebräischen זֶרַח und verbindet den Stammbaum mit der bekannten Gestalt aus der Hebräischen Bibel.
- source_word: ἐκ τῆς Θαμάρ
  choice: mit Tamar
  rationale: ἐκ nennt hier die Mutter der beiden Söhne. „Mit Tamar“ ist eine natürliche und knappe deutsche Formulierung, die ihre ausdrückliche Nennung bewahrt.
- source_word: Θαμάρ
  choice: Tamar
  rationale: „Tamar“ ist die etablierte deutsche Namensform.
- source_word: Ἑσρώμ
  choice: Hezron
  rationale: Die Form entspricht dem hebräischen חֶצְרוֹן und ist im deutschen Alten Testament gebräuchlich.
- source_word: Ἀράμ
  choice: Aram
  rationale: Der vorgelegte griechische Text lautet ausdrücklich Ἀράμ. Daher folgt der Haupttext dieser Form, statt sie an die in anderen genealogischen Überlieferungen geläufige Form „Ram“ anzugleichen.
theological_decisions:
- issue: Angleichung des letzten Namens an die geläufige alttestamentliche Genealogie
  choice: Aram
  alternative: Ram
  rationale: Die Übersetzung folgt vorrangig dem vorgelegten griechischen Ausgangstext Ἀράμ. Die bekannte Form „Ram“ wird als Überlieferungs- und Übersetzungstradition in der Fußnote genannt, ohne den Haupttext zu harmonisieren.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper genealogischer Satzstruktur. Die wiederholte Formulierung „zeugte“ bildet die bewusste Wiederholung des griechischen Textes ab; Eigennamen orientieren sich grundsätzlich an vertrauten deutschen Formen, außer wo der griechische Ausgangstext ausdrücklich eine andere Form verlangt.
