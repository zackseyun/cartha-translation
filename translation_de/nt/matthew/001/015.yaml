  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: de
  text: Eliud zeugte Eleasar, Eleasar zeugte Mattan, und Mattan zeugte Jakob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliud
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: δὲ
  choice: teils unübersetzt, zuletzt „und“
  rationale: δέ verbindet hier die Glieder der fortlaufenden Genealogie nur schwach. Im Deutschen wirkt eine wiederholte Wiedergabe mit „und“ schwerfällig; beim letzten Glied macht „und“ den Zusammenhang natürlich deutlich.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: In der männlich formulierten Genealogie bezeichnet γεννάω die Zeugung beziehungsweise genealogische Abstammung. „Zeugte“ ist präzise, knapp und im biblischen Stammbaumregister verständlich.
- source_word: τὸν
  choice: nicht gesondert wiedergegeben
  rationale: Der griechische Artikel kennzeichnet jeweils das direkte Objekt; vor Personennamen steht im Standarddeutschen hier kein Artikel.
- source_word: Ἐλεάζαρ
  choice: Eleasar
  rationale: Die Form entspricht der etablierten deutschen biblischen Namenskonvention.
- source_word: Ματθάν
  choice: Mattan
  rationale: Der Name wird quellenah transliteriert und in der üblichen deutschen Form ohne englisches „th“ geschrieben.
- source_word: Ἰακώβ
  choice: Jakob
  rationale: Verwendet wird die etablierte deutsche biblische Namensform.
