id: MAT.1.12
reference: Matthew 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: de
  text: Nach der Verschleppung nach Babylon[a] zeugte Jojachin Schealtiel, und Schealtiel zeugte Serubbabel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem Exil in Babylon“. Das griechische Wort bezeichnet die erzwungene Verbringung des Volkes in die Verbannung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Nach
  rationale: μετά mit Akkusativ bezeichnet die zeitliche Folge. Das schwach verbindende δέ muss im Deutschen hier nicht eigens wiedergegeben werden.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: der Verschleppung nach Babylon
  rationale: μετοικεσία bezeichnet die erzwungene Verbringung beziehungsweise Umsiedlung ins Exil. „Verschleppung“ bringt den Zwang klar zum Ausdruck; „nach Babylon“ gibt das Ziel idiomatisch wieder.
- source_word: Ἰεχονίας
  choice: Jojachin
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform verbindet die griechische Form mit der entsprechenden alttestamentlichen Gestalt.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet γεννάω die väterliche Abstammung. „Zeugte“ ist knapp, würdig und als Stammbaumformel verständlich, ohne zwingend unmittelbare biologische Generationen festzulegen.
- source_word: Σαλαθιήλ
  choice: Schealtiël
  rationale: Die geläufige deutsche biblische Namensform wahrt den Bezug zur alttestamentlichen Überlieferung.
- source_word: δὲ
  choice: und
  rationale: Das zweite δέ verbindet die aufeinanderfolgenden Glieder der Genealogie; „und“ ist hier die natürliche deutsche Entsprechung.
- source_word: Ζοροβαβέλ
  choice: Serubbabel
  rationale: Dies ist die etablierte deutsche biblische Namensform.
theological_decisions:
- issue: Wiedergabe von γεννάω in der Genealogie
  choice: „zeugte“ als konventionelle genealogische Abstammungsformel
  alternative: „war der Vater von“
  rationale: Die Formulierung wahrt die väterliche Abstammungslinie, behauptet aber im Rahmen antiker Genealogien nicht ausdrücklich, dass zwischen den genannten Personen keine Generation ausgelassen wurde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, wiederholte Stammbaumformel des griechischen Textes bleibt erhalten; etablierte deutsche Formen der biblischen Eigennamen werden verwendet.
