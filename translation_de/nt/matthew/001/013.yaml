source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: de
  text: Serubbabel zeugte Abihud[a], Abihud zeugte Eljakim, und Eljakim zeugte Asor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde Vater von“. Biblische Stammbäume können mit dieser wiederholten Wendung eine Abstammung verkürzt darstellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Serubbabel
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben; sie bezeichnet dieselbe Gestalt wie im alttestamentlichen Stammbaum.
- source_word: δέ
  choice: — / und
  rationale: δέ führt hier jeweils den nächsten Abschnitt der Ahnenreihe fort und drückt keinen eigentlichen Gegensatz aus. Im Deutschen kann es in den ersten beiden Gliedern unübersetzt bleiben; vor dem letzten Glied gibt „und“ den fortlaufenden Zusammenhang natürlich wieder.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: In der männlich formulierten Genealogie bezeichnet γεννάω das Hervorbringen beziehungsweise die genealogische Vaterschaft. „zeugte“ ist knapp, würdig und näher an der griechischen Formel als eine bloße Angabe von Abstammung.
- source_word: Ἀβιούδ
  choice: Abihud
  rationale: Die etablierte deutsche Namensform bewahrt die Anbindung an die biblische Namenstradition und gibt den griechischen Personennamen verständlich wieder.
- source_word: Ἐλιακίμ
  choice: Eljakim
  rationale: Die gebräuchliche deutsche biblische Form gibt den griechischen Namen in moderner deutscher Schreibweise wieder.
- source_word: Ἀζώρ
  choice: Asor
  rationale: Die etablierte deutsche Form entspricht der üblichen Wiedergabe des griechischen Namens ohne wissenschaftliche Sonderzeichen.
theological_decisions:
- issue: Wiedergabe von γεννάω in einer Ahnenreihe, die Generationen verkürzt darstellen kann
  choice: zeugte
  alternative: wurde der Vater von / war ein Vorfahr von
  rationale: „zeugte“ bewahrt die wiederholte genealogische Formel des griechischen Textes. Die Formulierung legt nicht zusätzlich fest, ob jeder genannte Übergang eine unmittelbare Generation bezeichnet; diese mögliche Verdichtung wird in der Fußnote erläutert. „war ein Vorfahr von“ würde die mögliche Verkürzung bereits im Haupttext interpretierend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Wiederholung bildet den formelhaften Rhythmus der griechischen Ahnenreihe ab; die traditionellen deutschen Namensformen sichern Wiedererkennbarkeit.
