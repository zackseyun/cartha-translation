id: MAT.1.17
reference: Matthew 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: de
  text: Somit sind es insgesamt von Abraham bis David vierzehn Generationen, von David bis zur Wegführung nach Babylon vierzehn Generationen und von der Wegführung nach Babylon bis zum Messias[a] vierzehn Generationen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Das griechische χριστός bedeutet „Gesalbter“ und wird hier als Titel gebraucht.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Somit sind es insgesamt … Generationen
  rationale: οὖν fasst den vorangehenden Stammbaum folgernd zusammen; „somit“ bewahrt diese Funktion. „Insgesamt“ gibt Πᾶσαι wieder, ohne die im Deutschen schwerfällige Formulierung „alle Generationen waren vierzehn Generationen“ zu erzeugen.
- source_word: γενεαὶ
  choice: Generationen
  rationale: Im Zusammenhang des Stammbaums bezeichnet γενεά die aufeinanderfolgenden Generationen. „Generationen“ ist dafür die klare und geläufige deutsche Entsprechung.
- source_word: ἀπὸ … ἕως
  choice: von … bis
  rationale: Die Wendung markiert jeweils die beiden Endpunkte eines Abschnitts im Stammbaum und wird idiomatisch wie genau mit „von … bis“ wiedergegeben.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: Wegführung nach Babylon
  rationale: μετοικεσία bezeichnet die erzwungene Umsiedlung beziehungsweise Deportation. „Wegführung nach Babylon“ hält sowohl das Ereignis als auch das Ziel fest und vermeidet die mögliche Mehrdeutigkeit von „Exil nach Babylon“.
- source_word: τοῦ χριστοῦ
  choice: zum Messias
  rationale: Der Artikel und die Stellung am Höhepunkt des Stammbaums zeigen den titelhaften Gebrauch von χριστός. „Messias“ gibt die Bedeutung des Titels wieder, statt ihn lediglich als „Christus“ zu transliterieren.
- source_word: γενεαὶ δεκατέσσαρες
  choice: vierzehn Generationen
  rationale: Die dreimal wiederholte Nominalformel wird in allen drei Abschnitten gleich wiedergegeben, sodass die bewusst ausgewogene Struktur des griechischen Textes hörbar bleibt.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Hier bezeichnet χριστός den erwarteten Gesalbten als Titel und bildet den messianischen Zielpunkt des Stammbaums. „Messias“ macht diese Bedeutung unmittelbar verständlich; die traditionelle Wiedergabe „Christus“ bleibt als mögliche Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Parallelstruktur und die dreifache Wiederholung von „vierzehn Generationen“ bleiben erhalten. „Somit“ signalisiert den zusammenfassenden Schluss; „insgesamt“ bildet Πᾶσαι natürlich ab.
