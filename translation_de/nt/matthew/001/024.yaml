  source_fidelity: Der Entwurf gibt den vorzeitigen Ablauf von ἐγερθεὶς ... ἐποίησεν idiomatisch wieder. „Als Josef aus dem Schlaf erwacht war“ entspricht dem Erwachen aus dem Schlaf; „tat er, was ... ihm befohlen hatte“ gibt ἐποίησεν ὡς προσέταξεν αὐτῷ treffend wieder. „Der Engel des Herrn“ und „nahm seine Frau zu sich“ entsprechen dem griechischen Wortlaut und Kontext. Die nicht eigens wiedergegebene schwache Erzählverbindung δέ ist im deutschen Satzbau ohne Bedeutungsverlust mitgeführt.
  naturalness: Modernes, flüssiges Standarddeutsch mit angemessen zurückhaltendem biblischem Register. Die Temporalkonstruktion und die Satzverknüpfung sind natürlich.
  terminology: „Josef“, „der Engel des Herrn“ und „seine Frau“ sind terminologisch konsistent und kontextgerecht. „Zu sich nehmen“ bewahrt bei παρέλαβεν die Aufnahme- bzw. Haushaltsnuance, ohne diese im Haupttext übermäßig zu explizieren.
